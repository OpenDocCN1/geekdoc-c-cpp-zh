    # The Fundamental Characteristics of C++


    It is important to understand that C++ is not a programming language that is purely
    focused on object-oriented programming. C++ is derived from the ‘C’ programming
    language and is a hybrid. Although C++ is different in some aspects from the original
    ‘C’ programming language, it still features the majority of the important functionalities
    found in the ‘C’ programming language. In other words, the C++ language also supports
    the features that are characteristic in the `C` programming language as well,
    such as:


    * Modular programs that can be used universally.

    * Efficient machine programming capability.

    * Programs made in C++ can be easily ported over to other platforms.


    Just as how C++ comes with all the important features of the `C` programming language,
    similarly, major contents of the code written in the `C` programming language
    can be reused in the C++ source code as well. Another important characteristic
    of the C++ programming language is that it reinforces the concepts of `C`’s object-oriented
    programming into itself. For instance, some object-oriented programming concepts
    are listed below:


    * Data abstraction: creating classes to define objects while programming.

    * Data encapsulation: obtaining a controlled access route to the data of the object.

    * Inheritance: creating classes that are derived from other classes (classes can
    be even derived from multiple derived classes).

    * Polymorphism: using an instruction set in such a way that it can boast different
    types of effect during the execution of the program code.


    The C++ language features object-oriented characteristics of the `C` programming
    language and various elements from other programming languages. For instance,
    programming elements such as templates and exception handling offer incredible
    functionality when it comes to implementing your program efficiently. Not only
    that, these particular elements provide ease in your programming work while also
    ensuring that you have a clearer understanding of your programs.


    # Object-Oriented Programming


    In this section, we will discuss and build a contrast between traditional procedural
    programming and object-oriented programming.


    ## Traditional Procedural Programming


    The main concept of the traditional procedural programming is based on separating
    the data which is supposed to be processed from the corresponding sub-routines
    and procedures (also known as data and functions). This significantly impacts
    the method through which a program handles data, for instance:


    * It is the priority of the programmer to make sure that before the data can be
    used, it is initialized with proper and suitable values. Moreover, the programmer
    must also make sure that the data, and the proper values, can be passed to a function
    when required.

    * The functions representing the data are specific. Due to this, if the representation
    of the data is changed (for example, if data is represented in the form of a record
    and that record is lengthened), the function which represents this data must also
    be modified accordingly.


    Due to such features, this limits the productivity of the program and hinders
    the support for low program maintenance requirements. Moreover, the features of
    traditional procedural programming mentioned above make the program more prone
    to errors.


    ## Object-Oriented Programming


    In object-oriented programming, instead of emphasizing the elements of data and
    functions, the focus is primarily on the objects itself. In other words, the programmer
    gives importance to the elements of a program that highlight the main purpose
    of the program itself. For instance, in object-oriented programming, a program
    that has been created for the handling and maintenance of bank accounts will feature
    data objects such as interest rates, balance, credit and debit calculations, transfers,
    and so on. Such a program built with object-oriented programming will feature
    objects corresponding to each account in the program. Each of the objects represents
    properties and capacities that are crucial for the basic function of account management
    for the program.


    In object-oriented programming, the properties and capacities correspond to data
    and functions, respectively, and these elements are then combined in the program.
    This is done by using `classes`. A `class` used in a program that is based on
    object-oriented programming will define a type of object by directly defining
    the properties and capacities of the object. Objects can also communicate with
    each other through sending messages. In this way, an object can activate another
    object’s capacities as well that serves multiple advantages along with ease in
    building the program.


    ### Advantages of Object-Oriented Programming


    In terms of software development, there are several advantages offered by object-oriented
    programming that make it more practical than traditional procedural programming.
    As traditional procedural programming lacks certain aspects that make it less
    likely to be used by programmers. Some of these advantages have been listed below:


    * Less prone to errors: an object defined in terms of its corresponding data can
    control the access attempts to this data. In other words, an object can reject
    error-prone access attempts to its data.

    * Ease of reuse: objects that have been created are capable of maintaining themselves.
    Due to this characteristic of objects, this makes them easier to use in other
    programs as building blocks very conveniently.

    * Low maintenance needs: According to the situation, an object is capable of modifying
    the representation of its internal data without needing to modify the application
    as well. This makes it more practical to use than traditional procedural programming.


    # Translating and Creating a C++ Program


    Developing a C++ program is simpler than you might think. In this section, we
    will discuss how we can translate a C++ program and create a simple C++ program.


    ## Translating a C++ Program


    The following diagram depicts the process of C++ translation.

    ![](rsrc2Y4.jpg)


    When translating a C++ program, three major steps are very important for the creation
    and translation process. These steps have been outlined below:


    1. Saving the source code of the C++ program in a text file by using a text editor.
    The file which contains the source code of the program is known as the source
    file. The use of one source file is acceptable for short projects. However, for
    big programming projects, it is recommended to store the source code of the program
    in several source files so that they can be edited and translated separately with
    ease. This approach is known as modular programming.


    2. Using a `compiler` to translate the program. The programmer feeds the `compiler`,
    a source file that contains the source code of the program which he wishes to
    translate. If the compiling process does not encounter any errors, then the output
    will be an object file that contains machine code. Such an object file is known
    as a module.


    3. Using a `linker` to combine different modules to an object file to create an
    executable file. The modules that are being added to an object file through a
    `linker` contain functions that are either part of the program that has been compiled
    before-hand or contain functions from a standard library.

    '
  raw: 'The Fundamental Characteristics of C++It is important to understand that C++
    is not a programming language that is purely focused on object-oriented programming.
    C++ is derived from the ‘C’ programming language and is a hybrid. Although C++
    is different in some aspects from the original ‘C’ programming language, it still
    features the majority of the important functionalities found in the ‘C’ programming
    language. In other words, the C++ language also supports the features that are
    characteristic in the C programming language as well, such as:


    *   Modular programs that can be used universally.


    *   Efficient machine programming capability.


    *   Programs made in C++ can be easily ported over to other platforms.


    Just as how C++ comes with all the important features of the C programming language,
    similarly, major contents of the code written in the C programming language can
    be reused in the C++ source code as well.Another important characteristic of the
    C++ programming language is that it reinforces the concepts of C’s object-oriented
    programming into itself. For instance, some object-oriented programming concepts
    are listed below:


    *   Data abstraction : creating classes to define objects while programming.


    *   Data encapsulation: obtaining a controlled access route to the data of the
    object.


    *   Inheritance: creating classes that are derived from other classes (classes
    can be even derived from multiple derived classes).


    *   Polymorphism: using an instruction set in such a way that it can boast different
    types of effect during the execution of the program code.


    The C++ language features object-oriented characteristics of the C programming
    language and various elements from other programming languages. For instance,
    programming elements such as templates and exception handling offer incredible
    functionality when it comes to implementing your program efficiently. Not only
    that, these particular elements provide ease in your programming work while also
    ensuring that you have a clearer understanding of your programs.Object-Oriented
    ProgrammingIn this section, we will discuss and build a contrast between traditional
    procedural programming and object-oriented programming.Traditional Procedural
    ProgrammingThe main concept of the traditional procedural programming is based
    on separating the data which is supposed to be processed from the corresponding
    sub-routines and procedures (also known as data and functions). This significantly
    impacts the method through which a program handles data, for instance:


    *   It is the priority of the programmer to make sure that before the data can
    be used, it is initialized with proper and suitable values. Moreover, the programmer
    must also make sure that the data, and the proper values, can be passed to a function
    when required.


    *   The functions representing the data are specific. Due to this, if the representation
    of the data is changed (for example, if data is represented in the form of a record
    and that record is lengthened), the function which represents this data must also
    be modified accordingly.


    Due to such features, this limits the productivity of the program and hinders
    the support for low program maintenance requirements. Moreover, the features of
    traditional procedural programming mentioned above make the program more prone
    to errors.Object-Oriented ProgrammingIn object-oriented programming, instead of
    emphasizing the elements of data and functions, the focus is primarily on the
    objects itself. In other words, the programmer gives importance to the elements
    of a program that highlight the main purpose of the program itself. For instance,
    in object-oriented programming, a program that has been created for the handling
    and maintenance of bank accounts will feature data objects such as interest rates,
    balance, credit and debit calculations, transfers, and so on. Such a program built
    with object-oriented programming will feature objects corresponding to each account
    in the program. Each of the objects represents properties and capacities that
    are crucial for the basic function of account management for the program.In object-oriented
    programming, the properties and capacities correspond to data and functions, respectively,
    and these elements are then combined in the program. This is done by using classes.
    A class used in a program that is based on object-oriented programming will define
    a type of object by directly defining the properties and capacities of the object.
    Objects can also communicate with each other through sending messages. In this
    way, an object can activate another object’s capacities as well that serves multiple
    advantages along with ease in building the program.Advantages of Object-Oriented
    ProgrammingIn terms of software development, there are several advantages offered
    by object-oriented programming that make it more practical than traditional procedural
    programming. As traditional procedural programming lacks certain aspects that
    make it less likely to be used by programmers. Some of these advantages have been
    listed below:


    *   Less prone to errors: an object defined in terms of its corresponding data
    can control the access attempts to this data. In other words, an object can reject
    error-prone access attempts to its data.


    *   Ease of reuse: objects that have been created are capable of maintaining themselves.
    Due to this characteristic of objects, this makes them easier to use in other
    programs as building blocks very conveniently.


    *   Low maintenance needs: According to the situation, an object is capable of
    modifying the representation of its internal data without needing to modify the
    application as well. This makes it more practical to use than traditional procedural
    programming.


    Translating and Creating a C++ ProgramDeveloping a C++ program is simpler than
    you might think. In this section, we will discuss how we can translate a C++ program
    and create a simple C++ program.Translating a C++ ProgramThe following diagram
    depicts the process of C++ translation.![](rsrc2Y4.jpg)When translating a C++
    program, three major steps are very important for the creation and translation
    process. These steps have been outlined below,


    1.  Saving the source code of the C++ program in a text file by using a text editor.
    The file which contains the source code of the program is known as the source
    file. The use of one source file is acceptable for short projects. However, for
    big programming projects, it is recommended to store the source code of the program
    in several source files so that they can be edited and translated separately with
    ease. This approach is known as modular programming .


    2.  Using a compiler to translate the program. The programmer feeds the compiler,
    a source file that contains the source code of the program which he wishes to
    translate. If the compiling process does not encounter any errors, then the output
    will be an object file that contains machine code . Such an object file is known
    as a module .


    3.  Using a linker to combine different modules to an object file to create an
    executable file. The modules that are being added to an object file through a
    linker contain functions that are either part of the program that has been compiled
    before-hand or contain functions from a standard library.'
