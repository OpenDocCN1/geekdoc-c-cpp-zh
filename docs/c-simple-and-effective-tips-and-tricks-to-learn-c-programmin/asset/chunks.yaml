    \ | Opens a file for output. This flag implies `ios::trunc` if it is not combined\
    \ with one of the flags `ios::in` or `ios::app` `ios::ate` |\n| `ios::app` | Opens\
    \ a file for output at the end-of-file |\n| `ios::trunc` | An existing file is\
    \ truncated to zero length |\n| `ios::ate` | Open and seek to end immediately\
    \ after opening. Without this flag, the starting position after opening is always\
    \ at the beginning of the file |\n| `ios::binary` | Perform input and output in\
    \ binary mode. |\n\n(Explanation of the flags referenced from ‘A Complete Guide\
    \ To Programming in C++ by Ulla Kirch-Prinz and Peter Prinz’)It is important to\
    \ note that all of the flags mentioned above are already defined in the `ios`\
    \ base class (which is a parent class to all other file stream classes). Moreover,\
    \ all of these file stream classes are of the `ios::openmode` type.\n\n## Default\
    \ Settings of an Opened File\nWhenever we open a file, the default values used\
    \ by the constructor of the file stream class and the `open()` method are:\n\n\
    | Class | Flags |\n| :--- | :--- |\n| `ifstream` | `ios::in` |\n| `ofstream` |\
    \ `ios::out \\| ios::trunc` |\n| `fstream` | `ios::in \\| ios::out` |\n"
  raw: '*   The iostream class is the parent class for fstream . In other words, the
    fstream class is created from the iostream class, and its purpose is to support
    operations such as reading and writing for files.


    So an object that is part of the file stream class is referred to as a ‘file stream
    .’ The standardized file stream classes are defined in a header file known as
    fstream, and to use these classes in a program, we must add this header file into
    the program using the #include directive.Functionalities of the File Stream ClassesWhenever
    we create a file stream class from a base class, the newly derived class inherits
    all of the functionalities of its parent class as well. In this way, class functionalities
    such as methods, operators, and even manipulators for cin and cout are available
    to these classes as well. Hence, every file stream class comes with the following
    functional features:


    *   Methods that have been defined for operations such as non-formatted reading
    or writing specifically for single characters and data blocks.


    *   Operators (‘<<’ and ‘>>’) that are used for formatted read and write operations
    to or from files.


    *   The methods and manipulators that have been defined for formatting character
    sequences.


    *   The methods that have been defined for tasks such as state queries.


    Creating Files through a C++ ProgramLet’s see a program demonstrating the creation
    of file streams and then break it down and understand the fundamentals of this
    concept.// showfile.cpp// Reads a text file and outputs it in pages,// i.e. 20
    lines per page.// Call: showfile filename// ----------------------------------------------------#include
    <iostream>#include <fstream>using namespace std;int main( int argc, char *argv[]){if(
    argc != 2 )                          // File declared?{cerr << "Use: showfile
    filename" << endl;return 1;}ifstream file( argv[1]);                  // Create
    a file stream// and open for reading.if( !file )                              //
    Get status.{cerr << "An error occurred when opening the file "<< argv[1] << endl;return
    2;}char line[80];int cnt = 0;while( file.getline( line, 80))                //
    Copy the file{                                         // to standardcout << line
    << endl;                    // output.if( ++cnt == 20){cnt = 0;cout << "\n\t ----
    <return> to continue ---- "<< endl;cin.sync(); cin.get();}}if( !file.eof() ) //
    End-of-file occurred?{cerr << "Error reading the file "<< argv[1] << endl;return
    3;}return 0;}Opening a FileBefore we can proceed to manipulate a file in a program,
    we first need to open and access it. To open a file, we need to perform two fundamental
    actions:


    *   State the name of the file along with its directory or path where it is located
    on the system’s permanent storage.


    *   Define a file access mode that corresponds to the file we want to open.


    If the file we want to open does not have a directory or a path that is stated
    explicitly, it means that the file should be in the current directory of the program.
    The file access mode specifies the read and write permissions granted to the user
    for the file. This means that if the file access mode is defined as read-only,
    then we can only access the contents of the file but cannot modify it. When a
    program is terminated, all the open files that are associated with it are closed
    as well.Defining the File StreamWhen we create a file stream, we can also open
    the file at the same time as well. To do so, all we have to do is state the file’s
    designated name. The program demonstrated at the beginning of this section uses
    default values for defining the file access mode.ifstream myfile("test.fle");In
    this statement, since we have not specified any particular directory or path for
    the file ‘test.file,’ this tells the program that the file must be located in
    the same directory. The file is opened by the constructor of the ifstream class
    to perform a read operation. Once a file has been opened in a program, the current
    file position is specified at the start of the file.Also note that if you specify
    a write-only file mode access, then it’s no longer necessary for the actual file
    to even exist in the system. If there is no file corresponding to the file name
    for write-only access mode, then the program will create a new file with this
    specified name. However, if a file with the name specified actually exists, then
    the write-only access mode will delete this file.In this line of codeofstream
    yourfile("new.fle");We are creating a new file with the name of ‘new.fle.’ Once
    this file has been created, the program opens the file to perform the write function.
    Just as we recently discussed, if the directory has an existing file with the
    same name, then it will be first deleted before the new file is created.We can
    also create a file stream which does not necessarily refer to any particular file.
    This file can be opened later by using the open() method. For exampleofstream
    yourfile;yourfile.open("new.fle");These two statements perform the same task as
    the “ofstream yourfile("new.fle");” line. To elaborate, the open() method opens
    the file by using the same set of values, which are also used by the default constructor
    for the file stream class.Usually, fixed file names aren’t always used by experienced
    programmers in every instance. If we analyze the program shown at the beginning
    of this section, we will see that the name of the file we want to manipulate is
    stated in the command line instead. If we do not provide a suitable file name
    for the program to operate on, then it will simply generate an error message and
    close. Another alternative route of defining file names is to leverage the interactive
    user input feature in programs.Modes when Opening FilesIn this section, we will
    discuss open modes that can be used with constructors as well as the open() method.
    But before we dive into this concept, let’s first understand the different flags
    for the open mode of a file. A table showing the open mode flags along with their
    corresponding functions have been displayed below:


    | Flag | Function |


    | ios::in | Opens an existing file for input |


    | ios::out | Opens a file for output. This flag impliesios::trunc if it is not
    combined with one of the flags ios::in or ios::app or ios::ate |


    | ios::app | Opens a file for output at the end-of-file |


    | ios::trunc | An existing file is truncated to zero length |


    | ios::ate | Open and seek to end immediately after opening. Without this flag,
    the starting position after opening is always at the beginning of the file |


    | ios::binary | Perform input and output in binary mode. |


    (Explanation of the flags referenced from ‘A Complete Guide To Programming in
    C++ by Ulla Kirch-Prinz and Peter Prinz)It is important to note that all of the
    flags mentioned above are already defined in the ios base class (which is a parent
    class to all other file stream classes). Moreover, all of these file stream classes
    are of the ios::openmode type.The Default Settings of an Opened FileWhenever we
    open a file, the default values used by the constructor of the file stream class
    and the open() method are:


    | Class | Flags |


    | Ifstream | ios::in |


    | Ofstream | ios::out &#124; ios::trunc |


    | Fstream | ios::in &#124; ios::out |'
