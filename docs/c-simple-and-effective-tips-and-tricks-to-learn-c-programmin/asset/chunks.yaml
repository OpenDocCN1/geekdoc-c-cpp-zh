  trans: "\n\n| 32767 | 077777 | 0x7FFF | int |\n| 32768U | 0100000U | 0x8000U | unsigned\
    \ int |\n| 100000 | 0303240 | 0x186A0 | int (32-bit)long (16-bit) |\n| 10L | 012L\
    \ | 0xAL | long |\n| 27UL | 033UL | 0x1bUL | unsigned long |\n| 2147483648 | 020000000000\
    \ | 0x80000000 | unsigned long |\n\n从上表可以看出，可以看到每个值是如何以不同的方式表示的。这里是一个结合了我们目前为止讨论的整常量概念的程序示例：\n\
    \n```cpp\n// 显示十六进制整数字面量和\n// 十进制整数字面量。\n#include <iostream>\nusing namespace\
    \ std;\nint main(){\n    // cout 输出整数为十进制整数：\n    cout << \"Value of 0xFF = \"\
    \ << 0xFF << \" decimal\" << endl;               // 输出: 255 decimal\n    // 操符\
    \ hex 将输出更改为十六进制\n    // 格式（dec 变为十进制格式）：\n    cout << \"Value of 27 = \" << hex\
    \ << 27 <<\" hexadecimal\"<< << endl;     // 输出: 1b hexadecimal\n    return 0;\n\
    }\n```\n\n### 浮点数常量\n\n浮点值包含两个元素：一个整数元素和一个分数元素。数字数部分通过小数点与整数部分分开。这就是为什么尽管浮点值通常以十进制形式表示，但它们也可以通过指数计数法表示。例如，一个精确到小数点后一位的典型浮点数可以如下所示表示：`20.7`。\n\
    \n同样，如果我们有一个数字 `1.5*10-2`，我们不需要以其十进制形式输入，也可以简单地将其存储为指数形式，即 `1.8E-2`。用于存储这些对象的算术类型默认是\
    \ `double` 类型。然而，也可以在值后面添加 `F` 或 `f` 来手动将常量指定为 `float` 类型。同样，也可以通过添加 `L` 或 `l`\
    \ 将其赋值给 `long double` 类型。\n\n下表显示了浮点常量以不同方式表示的几个示例。\n\n| 7.19 | 16. | 0.55 |\n\
    | 0.719E1 | 16.0 | .55 |\n| 0.0719e2 | .16E+2 | 5.5e-1 |\n| 719.0E-2 | 16e0 |\
    \ 55E-2 |\n\n### 字符常量\n\n在单引号内的字符被识别为字符常量。字符常量通常分配给 `char` 类型。每个字符都有一个表示字符本身的数值代码。例如，在\
    \ ASCII 码中，字符 ‘A’ 用数字 `65` 表示。下表详细介绍了几个字符常量及其在 ASCII 码中的十进制值。\n\n| 字符常量 | 字符 |\
    \ ASCII 码十进制值 |\n| :--- | :--- | :--- |\n| ‘A’ | 大写字母 A | 65 |\n| ‘a’ | 小写字母 a\
    \ | 97 |\n| ‘ ’ | 空格 | 32 |\n| ‘.’ | 点 | 46 |\n| ‘0’ | 数字 0 | 48 |\n| ‘\\0’ |\
    \ 终止空字符 | 0 |\n\n### 字符串常量\n\n我们对字符串常量已经很熟悉了，因为在第一章讨论 C++ 程序中 `cout` 流的文本输出时已经处理过它们。无论如何，你应该记住，包含在双引号内的字符序列（如句子或短语）被视为字符串常量。例如，“Press\
    \ the Accept button to proceed!”就是一个字符串常量。\n\n需要注意的是，当字符串序列在内部存储时，双引号是不包含在内的。相反，在字符串序列末尾会放置一个终止空字符\
    \ `\\0`，表示该序列已结束。因此，除了存储单个字符所需的字节外，字符串序列还会使用另一个字节来存储终止空字符。这就是为什么字符串常量占用的内存比其通常需求多一个字节。下图描绘了字符串序列“Hello!”的这种内部表示。\n\
    \n![](img/rsrc2Y7.jpg)\n\n### 转义序列\n\n在讨论编程字符时，另一个需要考虑的方面是那些非图形或不显示在屏幕上但具有用途的字符。例如，看看你的键盘，检查那些按下时会在文字处理器中显示字符的按钮。一旦你开始思考，就会注意到某些字符在按下时不会在屏幕上显示任何字符，例如‘Tab’键、“Shift”键等。这些非图形字符被称为“转义序列”，其效果取决于其使用的设备。例如，Tab\
    \ 转义序列 `\\t` 取决于预定义的默认宽度设置，通常是八个空格。\n\n此外，注意每个转义序列的字符开头都有一个反斜杠。下表详细介绍了几个转义序列及其十进制值和影响。\n\
    \n| 字符 | 定义 | ASCII 码十进制值 |\n| :--- | :--- | :--- |\n| \\a | 警告 (BEL) | 7 |\n\
    | \\b | 退格 (BS) | 8 |\n| \\t | 水平制表符 (HT) | 9 |\n| \\n | 换行符 (LF) | 10 |\n| \\\
    v | 垂直制表符 (VT) | 11 |\n| \\f | 换页符 (FF) | 12 |\n| \\r | 回车符 (CR) | 13 |\n| \\\
    ” | \" (双引号) | 34 |\n| \\’ | ' (单引号) | 39 |\n| \\? | ? (问号) | 63 |\n| \\\\ | \\\
    \ (反斜杠) | 92 |\n| \\0 | 字符串终止字符 | 0 |\n| \\ooo (最多 3 位八进制数字) | 字符的数值 | ooo (八进制)\
    \ |\n| \\xhh (十六进制数字) | 字符的数值 | hh (十六进制) |\n\n"
- fmt: "Octal and hexadecimal escape sequences allow users to represent character\
    \ codes differently. For example, if you want to express the alphabet ‘A,’ then\
    \ you can convert its decimal value to an octal value and then use the octal escape\
    \ sequence to express it. In ASCII code, you will need to use the decimal value\
    \ `65`; however, if you’re not using the ASCII character code set, then you can\
    \ simply use `\\101` to express the same alphabet. Similarly, you will have to\
    \ use `\\x41` if you want in the hexadecimal escape sequence to express the alphabet\
    \ ‘A.’ Although escape sequences can be used in this way, they are primarily used\
    \ to express those characters that are non-printable. For example, if you want\
    \ to represent the character ‘ESC,’ which serves as a control sequence for printers,\
    \ then you can express it by using an escape sequence (for octal `\\33` and for\
    \ hexadecimal `\\x1b`).\n\n# Fundamental Variables\nVariables are commonly referred\
    \ to as ‘objects,’ especially if they are part of a class. Variables are very\
    \ important in programming as they serve as containers for data (numbers, characters,\
    \ and even entire sequences). Moreover, by using variables, the program can easily\
    \ process the data. In this section, we will discuss all the fundamental concepts\
    \ about variables.\n\n## Defining Variables\nA variable is an empty container\
    \ that is abstract to the program until it has been defined. By defining a variable,\
    \ we mean that we are storing data inside this abstract container by allocating\
    \ memory to it, making it meaningful for the program. So, in a sense, we specify\
    \ the data type and reserve the memory, which is to be used by the variable once\
    \ it has been initialized. Once a variable is defined, think of it as a redirection\
    \ tool. When a user refers to this variable, the program automatically fetches\
    \ the corresponding data associated with the variable in the memory space in which\
    \ it is allocated, so that the program can process it. In this way, we can perform\
    \ operations on this data linked to the variable easily. A standard definition\
    \ of a variable has a proper syntax that needs to be followed. This syntax is:\
    \ `typ name1 [name2 ... ];`. By looking at this syntax, we can see that the argument\
    \ `typ` is actually mentioning the variable’s type. `name1` is simply the variable’s\
    \ name that the programmer specifies. Once defined, whenever we want to specify\
    \ the variable in any part of the program, we use this particular name. In this\
    \ syntax, we can also see a square bracket that houses another variable by the\
    \ name of `name2`. The square brackets tell the program that the variables mentioned\
    \ inside it are not entirely necessary, and the program can ignore this portion\
    \ if it needs to. This means that we can define and store multiple variables in\
    \ one go. The following program demonstrates how we can define variables practically:\n\
    \n```\nchar c;\nint i, counter;\ndouble x, y, size;\n```\n\nAnother important\
    \ thing to note is that variables can be defined in two ways. They can be defined\
    \ within the function of the program or outside the program’s function. For example,\
    \ at any portion of the program as long as it isn’t done within the function.\
    \ However, defining a variable either within or outside a function has certain\
    \ effects, respectively. These have been listed below:\n\n1. A variable defined\
    \ outside a function has a global property within the program. This means that\
    \ all of the program’s functions can use this variable.\n2. A variable defined\
    \ inside a function has a local property within the program. This means that the\
    \ variable can only be used by the function in which it has been originally defined\
    \ and not by any other function of the program.\n\nA local variable can be defined\
    \ at any point in the function where a statement is permissible.\n\n## Initialization\n\
    The initialization of a variable essentially refers to the assigning of value\
    \ to the variable mentioned above. When a variable is being defined, it is also\
    \ initialized at the same time. Once the variable is defined, we simply assign\
    \ a value to it immediately after the definition syntax to initialize it. A variable\
    \ can be initialized by using either of the two methods:\n\n*   After defining\
    \ the variable, putting an equal sign (`=`) right next to it and inputting the\
    \ desired value. For example:\n```\nchar k = 'a';\n```\n*   Enclosing the desired\
    \ value of the variable in round brackets immediately after defining the variable.\
    \ For example:\n```\nchar k(a);\n```\nSimilarly `float x(1.112);`.\n\nA global\
    \ variable that is not initialized has a default value of ‘0’. However, this does\
    \ not apply to local variables as a local variable that hasn’t been initialized\
    \ will be assigned an undefined value by default. Here’s an example of a program\
    \ incorporating the concepts we have discussed so far:\n\n```cpp\n// Definition\
    \ and use of variables\n#include <iostream>\nusing namespace std;\n\nint gVar1;\
    \ // Global variables\nint gVar2 = 2; // explicit initialization\n\nint main()\
    \ {\n    char ch('A'); // Local variable being initialized\n    // or: char ch\
    \ = 'A';\n    cout << \"Value of gVar1: \" << gVar1 << endl;\n    cout << \"Value\
    \ of gVar2: \" << gVar2 << endl;\n    cout << \"Character in ch: \" << ch << endl;\n\
    \    int sum, number = 3; // Local variables with and without initializations\n\
    \    sum = number + 5;\n    cout << \"Value of sum: \" << sum << endl;\n    return\
    \ 0;\n}\n```\n\nUpon executing this program, the computer will display a result\
    \ as shown below:\nValue of gVar1: 0\nValue of gVar2: 2\nCharacter in ch: A\n\
    Value of sum: 8\n\n# Constant and Volatile Objects\nIn this section, we will discuss\
    \ two important keywords in programming that can heavily affect the properties\
    \ of an object. These keywords are:\n\n*   `const` (For constant objects)\n* \
    \  `volatile` (For volatile objects)\n"
