    # Constant Objects

    Let’s say we already have an object of a specific type available for use. We can
    change the properties of the object by using the `const` keyword in place of its
    type. Doing so will create an entirely new object that is specifically ‘read-only.’
    As we know from our daily interaction with computers, a read-only file can only
    be accessed and cannot be modified by the user. The same is the case for a constant
    object. Since its properties have become read-only (in other words, the object
    itself has become constant), it renders the program helpless when it attempts
    to modify the object. So a constant object, once defined and initialized, cannot
    be modified later on. Due to this nature, the programmer must initialize the constant
    object at the same time it is defined; otherwise, it will be a read-only object
    that is assigned a default value.


    An example of a constant object being defined and initialized is shown below:

    ```cpp

    const double pi = 3.1415947;

    ```


    By creating such an object, the program will not be able to modify the value of
    this object in any scenario. Even if we introduce a statement like this into the
    program:

    ```cpp

    pi = pi + 2.0;     // invalid

    ```

    The program will only return an error message as a result.


    # Volatile Objects

    A volatile object is the polar opposite of a constant object. However, volatile
    objects are rarely used in programs. An object created by using the keyword `volatile`
    will have properties that allow not only the program in which it resides but also
    other programs and external events as well to modify the object. External events
    are usually triggered through interrupts or hardware clocks, for instance:

    ```cpp

    volatile unsigned long clock_ticks;

    ```


    In this way, even if the program does not directly modify the values of this variable,
    the hardware clock definitely will. As such, the program has to assume the value
    of this variable has changed since the last time it was accessed. For this purpose,
    the compiler constructs a machine code that allows it to scan and access the variable’s
    current value instead of outputting the value on which it was initialized.


    Another interesting point is that we can use both `const` and `volatile` keywords
    at the same time on the same variable. For example, if we were to use these keywords,
    then the resulting variable’s properties cannot be modified by the program itself.
    Still, it can be modified by external events such as the hardware clock. An implementation
    of this concept has been shown below:

    ```cpp

    volatile const unsigned time_to_live;

    ```


    # Chapter 3: Functions and Classes in C++

    In this chapter, we will be taking another important step towards exploring the
    realm of C++ programming. This chapter builds upon some of the fundamentals that
    were briefly discussed or displayed in the first chapter’s C++ program. Functions
    and classes are integral parts of a program, and knowing how to use them ensures
    that the programmer’s skills have a strong foundation.


    In this chapter, we will learn how to declare functions in a program and call
    a function in a program. In addition, readers will also be instructed on how to
    properly use standard classes in C++ along with header files and string objects
    that belong to the string class.


    Before we go into theoretical details and discussion describing the basics of
    declaring functions in a program, let’s first see a demonstration and build the
    concept from that. The prototype shown below depicts the structure of a typical
    function that has been declared:

    ![](rsrc2Y8.jpg)


    If we analyze this function, we can see that the statement provides the following
    information to the C++ compiler:


    * The name of the function to be used is `func`

    * We are calling upon this specific function through two arguments. Both of these
    arguments are type arguments with the first one being `int` and the second one
    being `double`

    * The value that the function will return should be a `long` type.


    The following table highlights some of the most common and standard mathematical
    functions available for use in C++.


    | Function | Description |

    | :--- | :--- |

    | `double sin (double);` | //Sine |

    | `double cos (double);` | //Cosine |

    | `double tan (double);` | //Tangent |

    | `double atan (double);` | //Arc Tangent |

    | `double cosh (double);` | //Hyperbolic Cosine |

    | `double sqrt (double);` | //Square Root |

    | `double pow (double, double);` | //Power |

    | `double exp (double);` | //Exponential Function |

    | `double log (double);` | //Natural Logarithm |

    | `double log10 (double);` | //Base-ten Logarithm |


    # Declaring Functions

    When writing a program, the compiler is like the main player who will execute
    the instruction set you are writing down. Following this analogy, it only makes
    sense that if we tell the compiler about a function that it does not know, it
    will not be able to execute it. Hence, a programmer needs to declare the functions
    and names (apart from keywords) for variables and objects; otherwise, the compiler
    will simply return an error message. This is why declaring functions is very important
    before we can even use them in our program. Usually, the point where you define
    a function, or a variable is also the point where they are declared as well. However,
    not all functions need to be defined for them to be declared. For example, if
    the function you wish to use has already been defined in a library, then you only
    need to declare that function instead of defining it again in your program.


    Like a variable, a function features a name along with a type. The type of value
    defines the type of function it is supposed to return. In other words, if a function
    is supposed to return a `long` type value, then the type of the function will
    also be ‘long.’ Similarly, the argument’s type also needs to be properly specified
    for the function to work properly. In other words, to declare a function, we need
    to provide the compiler with the following information:


    * The function’s name and type

    * Each argument’s type

