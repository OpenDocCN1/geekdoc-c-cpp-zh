- fmt: "\nSuch a structure makes up a function prototype. An example of a function\
    \ being declared has been shown below:\n\n```cpp\nint toupper(int);\ndouble pow(double,\
    \ double);\n```\n\nThe following statement tells the compiler that the name of\
    \ the function is `toupper()`, and its type is `int`. Since it is an `int` type\
    \ function, the value it will return will also be an `int` type. The argument’s\
    \ type is also an `int`, so the function will expect an input argument that will\
    \ be of the `int` type.\n\nSimilarly, the second function’s name is `pow()`, and\
    \ its type is `double`. It has two arguments, and both are of the type `double`,\
    \ meaning that when this function is called, then it needs two arguments of the\
    \ type mentioned above to be passed to it. We can follow up such types of function\
    \ prototypes with names as well, but the names will be considered as comments\
    \ by the compiler.\n\nNow, let’s discuss another case where a function has already\
    \ been declared in the header file included in our program. For instance the function\
    \ prototype:\n```cpp\nint toupper(int c);\ndouble pow(double base, double exponent);\n\
    ```\nIt is the same for the compiler as the function prototype that has been demonstrated\
    \ previously. If this function has already been declared in the header file (which\
    \ has been added to the program initially using the directive `#include`), then\
    \ we can use the function immediately without declaring it. For example, if we\
    \ include the C++ math library `cmath`, then we can use the standard mathematical\
    \ functions immediately. The following program demonstrates the inclusion of this\
    \ library to use the mathematical functions immediately:\n\n```cpp\n// Calculating\
    \ powers with\n// the standard function pow()\n#include <iostream>        // Declaration\
    \ of cout\n#include <cmath>           // Prototype of pow(), thus:\n// double\
    \ pow( double, double);\nusing namespace std;\nint main(){\n    double x = 2.5,\
    \ y;\n    // By means of a prototype, the compiler generates\n    // the correct\
    \ call or an error message!\n    // Computes x raised to the power 3:\n    y =\
    \ pow(\"x\", 3.0);      // Error! String is not a number\n    y = pow(x + 3.0);\
    \      // Error! Just one argument\n    y = pow(x, 3.0);       // ok!\n    y =\
    \ pow(x, 3);         // ok! The compiler converts the\n    // int value 3 to double.\n\
    \    cout << \"2.5 raised to 3 yields: \"<< << y << endl;\n    // Calculating\
    \ with pow() is possible:\n    cout << \"2 + (5 raised to the power 2.5) yields:\
    \ \"<< << 2.0 + pow(5.0, x) << endl;\n    return 0;\n}\n```\nThe output of this\
    \ program will be:\n2.5 raised to the power 3 yields: 15.625\n2 + (5 raised to\
    \ the power 2.5) yields: 57.9017\n\n## Function Calls\n\nA function call is leveraging\
    \ the properties and results of a function and passing it on to the variable calling\
    \ the function mentioned above. For example:\n```cpp\ny = pow( x, 2.0);\n```\n\
    In this example, the variable `y` is calling upon the `pow()` function. The result\
    \ of the function is $x^2$, and this exponential power is then assigned to the\
    \ variable `y` calling the `pow()` function. In simpler terms, a function call\
    \ represents a value. Since we are simply representing a value, we can also proceed\
    \ to apply some other mathematical operations in a function call as well, like\
    \ addition, subtraction, and multiplication, etc. For instance, we can perform\
    \ an addition calculation on a function call for double values as shown below:\n\
    ```cpp\ncout << 2.0 + pow( 5.0, x);\n```\nIn this statement, the value of `2.0`\
    \ is added to the value returned by the `pow()` function. Afterward, the `cout`\
    \ argument displays this result as the final output of the statement.\n\nIt is\
    \ important to remember that, even though any type of expression, be it a constant\
    \ or mathematical expression, can be passed to a function as the argument, we\
    \ must make sure that the argument is passed on is of a type that the function\
    \ is expecting. In other words, the type of argument being passed should be in\
    \ accordance with the type that was specified when the function was initially\
    \ defined.\n\nTo ensure that the argument’s type is indeed correct, the compiler\
    \ refers to the prototype function to double-check the type that has been specified\
    \ in the input argument. In the scenario where the compiler identifies that the\
    \ type that has been initially defined in the function prototype does correspond\
    \ to the argument’s type being inputted, the compiler tries to convert it to the\
    \ desired type. But this is not always possible, so the type conversion can only\
    \ take place if it is feasible. This has been demonstrated in the code of the\
    \ program shown previously as:\n```cpp\ny = pow( x, 3); // also ok!\n```\nNote\
    \ that the compiler expects a `double` type value instead of an `int` type value\
    \ (`3`). Since the argument’s type does not correspond to the prototype function,\
    \ the compiler performs a type conversion of `int` to `double`. However, if the\
    \ number of arguments being input is more or less than specified by the function\
    \ prototype or the compiler cannot perform type conversion, it will simply return\
    \ an error message. At this point, you can easily point out the origin of the\
    \ error and fix it in the program’s developmental stages, saving you from dealing\
    \ with runtime errors.\n\nIn the following example:\n```cpp\nfloat x = pow(3.0\
    \ + 4.7); // Error!\n```\nThe compiler identifies that the number of arguments\
    \ being used does not comply with the structure specified in the function prototype.\
    \ Moreover, the return value of the function is a `double` type, and it cannot\
    \ be assigned to a variable of a `float` type, hence making the type conversion\
    \ impossible for the compiler. In this case, the compiler will simply generate\
    \ an error.\n\n## Functions Without Return Values or Arguments\n\nIn most cases,\
    \ the purpose of a function call would be to use it returns for the variable calling\
    \ the function. However, we can also create a function that executes a task but\
    \ does not necessarily return any particular value to the variable calling upon\
    \ this function. For such purposes, we use the `void` type with these functions.\
    \ In other programming languages, this is commonly referred to as a procedure.\n\
    \nTo demonstrate the usability of a function call without a return value, let’s\
    \ first consult the statement shown below:\n```cpp\nvoid srand( unsigned int seed\
    \ );\n```\nIn this example, we see a function `srand()` being used to generate\
    \ a random number. The function does this by initializing an algorithm that produces\
    \ the random number for the output of the function. Since this function does not\
    \ return a tangible value, we assign it the `void` type. The arguments of this\
    \ function show that we are using an `unsigned int` value, which is to be passed\
    \ to the function for use. This value acts as a seed for the random numbers that\
    \ the function will produce, enabling it to generate a series of random numbers.\n\
    \nNow that we have discussed a function that can perform an action without returning\
    \ a value let’s discuss a function that does not expect an argument. If we have\
    \ defined a function without specifying any arguments, then the programmer must\
    \ declare this prototype function as `void`. Alternatively, we can also leave\
    \ the argument space empty in the parenthesis. This has been demonstrated below:\n\
    ```cpp\nint rand( void ); // or int rand();\n```\nThe program will call the function\
    \ `rand()` without providing it with any arguments. Since no arguments have been\
    \ specified, the function simply generates a random number between 0 and 32767\
    \ and returns it as the output value. In this way, we can generate a series of\
    \ random numbers by repeatedly calling this function.\n\n## Header Files\n\nHeader\
    \ files are those text file components in a program module that feature declared\
    \ functions and macros. For a program to make use of the data contained within\
    \ header files, they need to be added into the program’s source code by using\
    \ the `#include` directive. A basic chart elaborating on how to use header files\
    \ has been shown below:\n\n![](rsrc2Y9.jpg)\n\nBy understanding this diagram,\
    \ we can extract the following points of important information regarding how to\
    \ use header files:\n"
