  trans: "\n创建源文件时，注意应用于源文件名的扩展名至关重要。通常，应用于源文件的扩展名类型取决于创建该源文件的编译器。最常用的文件扩展名是 `.cpp`\
    \ 和 `.cc`。\n\n在某些情况下，源文件在编译之前可能需要一个扩展名文件。这些文件被称为头文件（header files）。如果源文件有相应的头文件可用，那么在编译之前，必须将头文件的内容复制到源文件中。头文件包含了源文件的重要数据，例如定义类型、声明变量和函数。头文件可能有扩展名，也可能没有。如果它有扩展名，那么通常是\
    \ `.h` 文件扩展名。\n\n为了执行之前提到的步骤和任务，程序使用被称为“编译器”的软件。如今流行的编译器通常还会提供一个 IDE（集成开发环境），以便能够立即开始编程。\n\
    \n## 创建一个简单的 C++ 程序\n\n现在我们将创建一个标准且简单的 C++ 程序。之后，我们将讨论该程序中所使用的编码元素。\n\n以下是该 C++\
    \ 程序的代码：\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main(){\n \
    \   cout << \"Have a good day!\" << endl;\n    return 0;\n}\n```\n\n该程序的输出是一个文本：“Have\
    \ a good day!”。\n\n在我们深入理解该程序的核心元素之前，这里有一个展示了程序结构安排的视觉化表示，以建立基础理解。\n\n![](img/rsrc2Y5.jpg)\n\
    \n为了简单起见，我们可以说，一个基础 C++ 程序的主要部分是对象及其相应的“成员函数和全局函数”。这些对象和函数不属于任何类。除了完成其设计目的的任务外，函数还具有调用其他函数的能力。经验丰富的程序员可以选择自己创建一个函数，也可以使用\
    \ C++ 标准库中已提供的函数。对于初学者，建议只使用标准库中的预建函数，因为创建个性化的函数可能会导致代码出现难以解决的复杂性。然而，每个程序员都必须创建创建自己的全局函数\
    \ `main()`。该函数是程序代码的主要组件之一。\n\n上述演示的 C++ 程序包含了任何 C++ 程序中两个最关键的元素，即 `main()` 函数和输出字符串（作为程序输出显示的消息）。\n\
    \n如果你查看代码块的第一行，你会看到一个哈号符号‘#’。这告诉计算机该行代码是用于预处理步骤的。你可以将预处理器视为一个初步阶段，在此阶段尚未创建对象，代码为程序中后续指令做准备。例如，如果你想让预处理器将一个文件复制到源文件代码中定义的位置，你可以使用\
    \ `#` 符号来实现。这在下面也有演示：\n\n```cpp\n#include <filename>\n```\n\n通过这种方式，我们可以将头文件包含到源代码中。这样做，程序将能够访问头文件中的数据。在上述的\
    \ C++ 程序中，我们可以在第一行就看到名为 `iostream` 的头文件已通过这种方法包含在源代码中。该文件包含的数据对应于定义输入和输出流的约定。换句话说，程序中的信息被视为数据流。\n\
    \n程序中的第二行代码引用了一个名为 `std` 的命名空间（namespace），它包含了 C++ 中的预定义名称。要访问此命名空间的内容，我们在定义命名空间之前使用\
    \ `using` 关键字。\n\n程序本身的执行从执行由 `main()` 函数定义的指令开始。因此，每个 C++ 程序都需要有一个 `main()` 函数来执行一组指令。然而，尽管\
    \ `main()` 函数是一个全局函数，使其与其他函数不同，但使用该函数实现代码的结构与 C++ 中任何其他典型函数完全相同。\n\n在上述演示的 C++\
    \ 程序中，`main()` 函数包含两个语句：\n\n1. `cout << \"Have a good day!\" << endl;`\n2. `return\
    \ 0;`\n\n"
- fmt: "\nThe first statement has two important components, `cout` and `endl`. `cout`\
    \ has been taken from the C++ standard namespace, and it represents ‘console output.’\
    \ `cout` has been used to designate an object that will handle outputting the\
    \ text string defined in the statement. Moreover, the `<<` symbols represent the\
    \ stream of the data in the program. These symbols tell the program that the characters\
    \ in the string are supposed to flow to the output stream. In the end, `endl`\
    \ indicates that the statement has finished and generates a line feed.\n\nThe\
    \ second statement stops the execution of the `main()` function, and in this case,\
    \ the program itself. This is done by returning a value of `0`, which is an exit\
    \ code to the calling program. It is always recommended to use the exit code `0`\
    \ when highlighting that the program has been successfully terminated.\n\n# Creating\
    \ a C++ Program that has Multiple Functions\n\nNow that we know how a basic C++\
    \ program works and what core elements make up a simple program, let’s proceed\
    \ to understand a program that uses several functions instead of one. An example\
    \ of such a C++ program has been shown below, also note that this program also\
    \ has comments which are notes left by the programmer detailing what a specific\
    \ line of code’s purpose is. The comments are written after two back-slash symbols\
    \ `//`, and the compiler doesn’t consider this as executable code and ignores\
    \ it.\n\n```cpp\n#include <iostream>\nusing namespace std;\nvoid line(), message();\
    \ // Prototypes\nint main(){\n    cout << \"Hey! The program starts in main().\"\
    << << endl;\n    line();\n    message();\n    line();\n    cout << \"At the end\
    \ of main().\" << endl;\n    return 0;\n}\nvoid line() { // To draw a line.\n\
    \    cout << \"--------------------------------\" << endl;\n}\nvoid message()\
    \ { // To display a message.\n    cout << \"In function message().\" << endl;\n\
    }\n```\n\nNow let’s execute this program and see what’s the output.\nHey! The\
    \ program starts in main().\n--------------------------------\nIn function message().\n\
    --------------------------------\nAt the end of main().\n\nThrough this example,\
    \ we can understand the structure of a C++ program more intricately. Notice that\
    \ unlike the simple program shown previously, which only had one function, this\
    \ C++ program features several functions. However, C++ does not restrict the user\
    \ to a defined order according to which the functions need to be defined. In other\
    \ words, when working with a C++ program, you can define functions in any order\
    \ that you may choose. For instance, you can define the `message()` function first,\
    \ then the `line()` function, and finally the `main()` function or in another\
    \ order that you want.\n\nHowever, it is recommended that you define the `main()`\
    \ function first. This is because this function essentially controls the program\
    \ flow. To understand this, we need to take a look at what the `main()` function\
    \ primarily does. It calls those functions that haven’t been defined yet into\
    \ the program where it’s being used. The `main()` function does this by providing\
    \ the compiler with the prototype function. The prototype function contains all\
    \ the necessary information for the compiler to help the `main()` function do\
    \ its job.\n\nIn addition, if you take a look at this program, you’ll find some\
    \ sentences that start after `//` symbol. These are strings, and the program interprets\
    \ them as comments. Comments are very useful when working on big projects that\
    \ involve writing thousands of lines of code. By using comments, the programmer\
    \ can essentially leave reminders as to what is the purpose of this line of code\
    \ or an entire block of code, making it easier to debug, or for other users accessing\
    \ the code to understand it’s structure. Moreover, comments also make it easier\
    \ for programmers to make changes to the code later on. Hence, programmers practicing\
    \ this habit often divert some hefty workload later on in the future.\n\n# Chapter\
    \ 2: The Basic Data Types, Constants, and Variables Used in C++\n\nIn any programming\
    \ language, being familiar with the generally used constants and variables is\
    \ very important. In a programming language that is more object-oriented, such\
    \ as C++, it becomes even more important to learn about at least the basics of\
    \ the data types and objects that are commonly incorporated into C++ programs.\
    \ As such, this chapter will focus on the elements mentioned above and aim to\
    \ equip the reader with all the basics necessary for them to understand and create\
    \ more complex and effective C++ programs in the future.\n\n## The Fundamental\
    \ Data Types\n\nIn this section, we will discuss what a type refers to in a C++\
    \ program and understand the different fundamental data types available for use\
    \ in the C++ programming language.\n\nIn programming, we have to take the different\
    \ types of data into consideration, which can be used by the program to perform\
    \ a task or solve a problem. Moreover, a computer does not work with only a single\
    \ data processing method. To make use of the computer’s ability to process and\
    \ save data through various methods, we need to know what type of data we are\
    \ dealing with or figure out the data type which is being fed into our C++ program.\n\
    \nGenerally, there are four major categories of data types in C++. These four\
    \ data type categories are:\n\n* Boolean values\n* Characters\n* Integers\n* Floating-point\
    \ values\n\nEach data type requires a different approach to be adopted to make\
    \ it possible for the computer to process the information they carry. That’s why\
    \ it is very important to identify the data type in the program. The purpose of\
    \ a data type is to elaborate:\n\n* The data’s internal representation\n* The\
    \ memory value that needs to be allocated\n"
