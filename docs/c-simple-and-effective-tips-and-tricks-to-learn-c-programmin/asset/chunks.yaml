  trans: "\n一个正常终止的程序会自动关闭与其关联的任何打开的文件。然而，在某些情况下，程序并没有正常终止。为了避免这些不可预见的情况，在文件不再被使用时直接关闭它们是非常重要的。这里有一个演示了目前为止讨论的概念的程序：\n\
    \n```cpp\n// fcopy1.cpp : 拷贝文件。\n// 调用: fcopy1 源 [ 目标 ]\n// ----------------------------------------------------\n\
    #include <iostream>\n#include <fstream>\nusing namespace std;\n\ninline void openerror(\
    \ const char *file){\n    cerr << \"Error on opening the file \" << file << endl;\n\
    \    exit(1); // 结束程序并                                     // 所有已打开的文件。\n\nvoid\
    \ copy( istream& is, ostream& os); // 原型\n\nint main(int argc, char *argv[]){\n\
    \    if( argc < 2 || argc > 3){\n        cerr << \"Call: fcopy1 source [ destination\
    \ ]\"<< << endl;\n        return 1; // 或: exit(1);\n    }\n    ifstream infile(argv[1]);\
    \ // 打开第一个文件\n    if( !infile.is_open())openerror( argv[1]);\n    if( argc ==\
    \ 2) // 只有一个源文件。\n        copy( infile, cout);\n    else // 源和目标\n    {\n    \
    \    ofstream outfile(argv[2]); // 打开第二个文件\n        if( !outfile.is_open() )openerror(\
    \ argv[2]);\n        copy( infile, outfile);\n        outfile.close(); // 没有必要。\n\
    \    }\n    infile.close(); // 没有必要。\n    return 0;\n}\n\nvoid copy( istream&\
    \ is, ostream& os) // 将其拷贝到 os.{\n    char c;\n    while( is.get(c) )os.put(c);\
    \ // 或: os << c ;\n}\n```\n\n### `close()` 和 `is_open()` 方法\n注意，在演示的程序中使用的每个文件流类都定义了一个类型为\
    \ `void` 的方法。这就是 `close()` 方法，正如其名所示，它的目的是终止由使用该方法的流所占的文件。例如：`myfile.close();`。\n\
    \n尽管指定文件流上的文件已终止，但文件流本身仍保持原样。这意味着通过关闭特定文件流上的文件，我们可以立即在同一流上打开另一个文件。要检查一个文件是否当前正占用一个文件流，我们使用\
    \ `is_open()` 方法来实现。例如：\n\n```cpp\nif( myfile.is_open() ){ /* . . . */ } // 文件已打开\n\
    ```\n\n### `exit()` 函数\n当使用全局 `exit()` 函数时，程序已打开并正在访问的文件将被关闭。使用此全局终止函数而不是 `close()`\
    \ 方法的主要原因是，我们不仅关闭了打开的文件，还终止了程序本身。通过这种方式，程序被正确关闭，并向相应的调用进程返回一个状态错误码。`exit()` 函数的原型所示所示：\n\
    \n```cpp\nvoid exit( int status );\n```\n\n向调用进程返回状态错误码的原因是调用进程会评估 `status`。通常，在这种情况下，调用进程是命令行解释器本身，例如\
    \ Unix shell（外壳）。当程序在没有出现任何问题的情况下成功终止时，它会返回错误码 `0`。同样，在 `main()` 函数中，`return n`\
    \ 和 `exit(n)` 两个语句是等价的。在下一节所示的程序中，你将看到一个被指示将文件内容拷贝并粘贴到目标文件的程序。文件在命令行中指定，程序进行拷贝。如果用户没有指定目标文件，则原始文件将简单地拷贝到程序的输出中。\n\
    \n### 块的读写操作\n所有的文件流类都能够利用在它们的父类（也称为基类）中定义的公共操作。因此，通过为程序使用适当的文件流类，我们可以轻松地执行写操作，将格式化或未格式化的数据传输到指定的文件。同样，我们也可以执行读操作，一次处理整个块或一次处理一个字符来遍历文件内容。这里有一个演示使用数据块读写操作的程序：\n\
    \n```cpp\n// Pizza_W.cpp\n// 演示逐块输出记录\n// -----------------------------------\n\
    #include <iostream>\n#include <fstream>\nusing namespace std;\n\nchar header[]\
    \ =\" * * * P I Z Z P R O N * * *\"\n\n// 记录结构\nstruct Pizza {\n    char name[32];\n\
    \    float price;\n};\n\nconst int MAXCNT = 10;\nPizza pizzaMenu[MAXCNT] = {\n\
    \    {\"Pepperoni\", 9.90},\n    {\"White Pizza\", 15.90},\n    {\"Ham Pizza\"\
    , 12.50},\n    {\"Calzone\", 14.90}\n};\n\nint cnt = 4;\nchar pizzaFile[256] =\
