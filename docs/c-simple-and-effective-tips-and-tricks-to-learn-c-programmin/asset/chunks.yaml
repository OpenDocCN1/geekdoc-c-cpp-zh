  trans: "\n\n# 创建类对象\n\n对象是被赋值为类类型本身的变量。例如，如果我们为字符串类创建一个对象，那么该变量将附带字符串类型。这在下方的示例中已经得到了证明：\n\
    \n```cpp\nstring s(\"I am an object of the string class\");\n```\n\n每当创建一个对象时，系统都会为其数据成员分配内存，并用其对应的值进行初始化。在上面的示例中，你可以看到变量\
    \ `s` 的类型是字符串类。\n\n`Object`（对象）也被称为其所代表的相应类的实例（instance）。以上面的语句为例，对象 `s` 也可以被称为字符串类的一个实例。该对象后面跟着一个字符串常量（I\
    \ am an object of the string class），并最终以这种方式被定义和初始化。\n\n# 调用方法\n\n在类中，所有被定义为“public”（公有）的方法都可以通过该特定类的对象进行调用。我们绝不能将调用公共方法与调用全局函数混淆。尽管两者在某些方面具有基本相似之处，但仍有一个方面是方法与函数之间主要的区别因素。这一方面在于，与全局函数可以被其所在程序中的多个语句使用不同，公共方法一次只能为一个特定的对象被调用。方法和对象的典型设置如下所示：\n\
    \n```cpp\ns.length(); // object.method();\n```\n\n在这一语句中，`length()` 是对象 `s` 的方法。该方法的主要目的是提供有关字符串中字符总数的信息。这在上一节所示的程序中已经证明。我们看到，不是使用\
    \ `s` 对象，而是使用对象名配合 `length()` 方法。\n\n# 全局函数与类\n\n全局定义的函数也可以被某些类使用。类使用的全局函数主要为该类的对象执行某些操作，这些对象是作为参数传递给函数的。例如，考虑以下语句，它包含一个全局函数\
    \ `getline()`。它被与对象 `s` 使用（该对象作为参数传递给函数）：\n\n```cpp\ngetline(cin, s);\n```\n\n\
    全局函数执行一个操作，将一行键盘输入存储为字符串。通过这种方式，通过按下回车键，`\\n` 转义字符将创建一个换行符，但行本身不会被存储在字符串中。\n\n\
    # 第 4 章：基本类型的运算符\n\n在本章中，我们将介绍对于基本数据类型进行计算和选择至关重要的运算符。运算符与函数相似，但它们的语法完全不同。运算符是执行特定操作（如算术运算、比较运算和逻辑运算等）的工具。我们将讨论基础编程中使用的一些基础运算符。\n\
    \n## 二元算术运算符\n\n为了使程序能够处理数据输入，需要定义处理过程所需的操作。选择性操作的执行取决于所处理的数据类型，例如数字的加、乘或比较。然而，对字符串进行乘法是不符合逻辑的。\n\
    \n下一节将讨论用于算术处理的重要运算符，包括一元运算符二元运算符。一元运算符使用一个操作数，而二元运算符指定两个。这是一个演示典型二元运算符和操作数的图。\n\
    \n![](img/rsrc2YA.jpg)\n\n为了进一步澄清概念，下面列出了基本二元运算符的表格：\n\n| 运算符 | 意义 |\n| :--- |\
    \ :--- |\n| + | 加法 |\n| - | 减法 |\n| * | 乘法 |\n| / | 除法 |\n| % | 取余 |\n\n这是一个演示二元运算符使用的程序：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main(){\n    double x,\
    \ y;\n    cout << \"\\nEnter two floating-point values: \";\n    cin >> x >> y;\n\
    \    cout << \"The average of the two numbers is: \"<< (x + y)/2.0 << endl;\n\
    \    return 0;\n}\n```\n\n执行此程序时，我们将得到以下结果：\n`Enter two floating-point values:\
    \ 4.75 12.3456`\n`The average of the two numbers is: 8.5478`\n\n系统可以在算术运算符的帮助下进行计算。\n\
    \n*   如果使用整数操作数进行除法，将产生整数结果。例如，`7/2` 的计算结果将是 `3`。此外，一个或多个浮点数操作数将产生浮点数形式的结果。例如，如果计算\
    \ `7.0/2`，精确结果将是 `3.5`。\n*   整数操作数是唯一可以使用取余除法的类型，取余法用于返回整数除法的余数，例如 `7%2` 将产生结果\
    \ `1`。\n\n## 表达式\n\n简单表达式仅由一个常量、变量或函数调用组成，但当它们被用运算符的操作数时，就形成了复杂的表达式。因此，一个表达式通常是运算符和操作数的组合。\n\
    \n在使用时，除了具有 `void` 类型的外，所有表达式都会返回结果。操作数定义了算术计算中的表达式。\n\n示例：\n```cpp\nint a(4);\n\
    double x(7.9);\na * 512      // 类型 int\n1.0 + sin(x)  // 类型 double\nx – 3    \
    \    // 类型 double，因为其中一个操作数的类型是 double\n```\n\n如果表达式使用正确，它也可以作为另一个表达式的操作数。\n示例：\n\
    ```cpp\n2 + 7 * 3    // 2 加上 21\n```\n\n在求表达式时，遵循数学上的先乘后加规则。因此，`*`、`/` 和 `%` 运算符的优先级高于\
    \ `+` 和 `-`。在上面的示例中，首先执行 `7*3` 的计算，然后加上二。另一方面，可以通过为先执行的计算插入括号来改变优先级顺序。\n\n示例：\n\
    ```cpp\n(2 + 7) * 3 // 9 乘以 3\n```\n\n## 一元算术运算符\n\n一元算术运算符总共有四种：\n\n*   一元符号运算符\
    \ `+`\n*   一元符号运算符 `–`\n*   递增运算符 `++`\n*   递减运算符 `--`\n\n"
- fmt: "\nHowever, not all of the unary arithmetic operators feature the same level\
    \ of precedence. The precedence of the arithmetic operators has been demonstrated\
    \ in the table below:![](rsrc2YB.jpg)\n\nThe effects of the prefix and suffix\
    \ notation of arithmetic operators have been demonstrated in the following sample\
    \ program:\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main(){\n\
    \    int i(2), j(8);\n    cout << i++ << endl;          // Output: 2\n    cout\
    \ << i << endl;            // Output: 3\n    cout << j-- << endl;          //\
    \ Output: 8\n    cout << --j << endl;          // Output: 6\n    return 0;\n}\n\
    ```\n\n## Unary Sign Operators\nThe sign operator `+` has no real use as it only\
    \ returns the value of the operand as it is. On the other hand, the sign operator\
    \ `–` returns the operand value after inverting its sign.\nExample: `int n = -5;\
    \ cout << -n; //Output: 5`\n\n## Increment and Decrement Operators\nThe increment\
    \ operator is used to increase the value of the operand by 1. For this reason,\
    \ it cannot be used with constants. Increment operators can be used in the form\
    \ of prefix notation, or postfix notation. Taking `i` as a variable, the postfix\
    \ notation written as `i++` and prefix notation which is `++i` both perform the\
    \ function of `i=i+1`. The end result has the value of `I` increased by one.\n\
    \nDespite performing the same operation, the postfix `++` and prefix `++` function\
    \ in different ways. By observing the values in both expressions, the difference\
    \ between the two can be made apparent. When `++i` is used, it means the value\
    \ of `i` is already incremented before being applied. Conversely, in `i++`, the\
    \ original value that is `i` is retained.\n`++i`, the value of `i` is first incremented,\
    \ after which it is applied. `i++` the original value of `i` is applied and then\
    \ incremented.\nWhile it may not be as apparent in simple expressions, it makes\
    \ a noticeable difference in complex expressions. Therefore, when dealing with\
    \ complex expressions, the difference between the postfix and prefix expressions\
    \ must be noted.\n\nThe decrement operator `--` changes the value of the given\
    \ variable or operand by reducing it by 1. The prefix and postfix notations can\
    \ also be applied to this operator which function in the same way as the increment\
    \ notations except it perform the operation `i=i-1`.\n\n## Precedence\nWhen multiple\
    \ operators are to be evaluated, their order is decided by the operator precedence,\
    \ after which the operators and operand are grouped accordingly. If the table\
    \ opposite is studied, it can be seen that the operator `++` has the highest precedence\
    \ while “/” has higher precedence than “-.” \nExample: `( val++ ) – ( 7.0/2.0\
    \ )`\nThe result is `1.5`, keeping in mind the fact that `val` is incremented\
    \ later.\n\nIf any two or more operators have equal precedence, the evaluation\
    \ of the expression is determined by column three of the table.\nExample: `3 *\
    \ 5 % 2` is equivalent to `(3 * 5) % 2`.\n\n## Assignments\nThe process in which\
    \ we assign something to an expression or variable is known as assignment. Before\
    \ we discuss the topic of assignment in detail, let’s first see how they are used\
    \ in a practical C++ program:\n\n```cpp\n// Demonstration of compound assignments\n\
    #include <iostream>\n#include <iomanip>\nusing namespace std;\nint main(){\n \
    \   float x, y;\n    cout << \"\\n Please enter a starting value: \";cin >> x;\n\
    \    cout << \"\\n Please enter the increment value: \";cin >> y;\n    x += y;\n\
    \    cout << \"\\n And now multiplication! \";\n    cout << \"\\n Please enter\
    \ a factor: \";cin >> y;\n    x *= y;\n    cout << \"\\n Finally division.\";\n\
    \    cout << \"\\n Please supply a divisor: \";cin >> y;\n    x /= y;\n    cout\
    \ << \"\\n And this is \"<< << \"your current lucky number: // without digits\
    \ after\n    // the decimal point:\n    << fixed << setprecision(0)\n    << x\
    \ << endl;\n    return 0;\n}\n```\n\n### Simple Assignments\nWhen assigning a\
    \ variable value to an expression, the simple assignments use the assignment operator\
    \ written as `=`. The value is written on the right of the assignment operator\
    \ `=` while the variable the value is assigned to is on the left side.\nExample:\
    \ `z = 7.5;`, `y = z;`, `x = 2.0 + 4.2 * z;`\nAs seen in the example, the variables\
    \ are expressed as “x,” “y” and “z” on the left; the values assigned to them are\
    \ on the right. In order of evaluation, the assignment operator has low precedence.\
    \ This can be seen in the last example where the expressions on the right side\
    \ are evaluated first, and the result produced by the calculation is assigned\
    \ to the variable on the left side.\n\nThe assignment operator can be considered\
    \ as an expression in itself, and the value of this expression is the value assigned\
    \ to the variable.\nExample: `sin ( x = 2.5 );` As shown in the example, the value\
    \ of `2.5` is first assigned to the variable “x,” which is then passed as an argument\
    \ to the function.\n\nIf multiple assignment operators are used, it is possible\
    \ to evaluate them from right to left.\nExample: `i = j = 9;`\nThe evaluation\
    \ of the expressions in this example starts from the right, i.e., the value `9`\
    \ is first assigned to “j” and then to “i.”\n\n### Compound Assignments\nAnother\
    \ kind of operator besides the simple assignment is the compound assignment operator.\
    \ It is used to perform the operations of arithmetic and assignment at the same\
    \ time.\nExample: `i += 3;` is equivalent to `i = i + 3;`\n`i *= j + 2;` is equivalent\
    \ to `i = i * (j+2);`\nThe precedence of compound assignment is similar to simple\
    \ assignment operators and is set to be low. Hence the compound assignments are\
    \ implicitly placed in parentheses which is demonstrated in the second example.\n\
    \nThe binary arithmetic operators and bit operators are used for composing compound\
    \ assignment operators such as `+=`, `-=`, `*=`, `/=`, and `%=`. When evaluating\
    \ a complex operation, the presence of assignment operators or increment(++)/decrement(--)\
    \ can significantly modify a variable. This modification is referred to as side\
    \ effect and can usually lead to errors. Therefore, the use of side effects should\
    \ be avoided as much as possible so that the program readability is not impaired.\n\
    \n## Relational Operators\nHere’s a table showing all of the relational operators\
    \ available for use in C++.\n\n| Operator | Significance |\n| :--- | :--- |\n\
    | `<` | Less than |\n| `<=` | Less than or equal to |\n| `>` | Greater than |\n\
    | `>=` | Greater than or equal to |\n| `==` | Equal to |\n| `!=` | Unequal to\
    \ |\n\nLike unary operators, relational operators also have different precedence\
    \ among themselves. This has been highlighted in the table shown below:![](rsrc2YC.jpg)\
    \ Here’s a brief example of the use of relational operators for comparison purposes:\n\
    \n| Comparison | Result |\n| :--- | :--- |\n| `4 >= 5` | False |\n| `1.5 > 2.3`\
    \ | False |\n| `2.9 > 2.2` | True |\n| `2 * 10 != 18` | True |\n"
