    simply attach the first alphabetical letter of the type to the number. For example,
    if we were to assign the number 15 to a long type, then we would do so by either
    adding ‘L’ or ‘l’ to the number. Similarly, if we were to assign the same number
    to the unsigned long type, then we would do so by using the ‘ UL’ or ‘ul’ letter.
    For assigning a number to the unsigned int type, we only need to use the letter
    ‘U’ or ‘u.’ This has been demonstrated below:15L and 15l correspond to the type
    long15U and 15u correspond to the type unsigned int15UL and 15ul correspond to
    the type unsigned longA detailed example of all the integral constants has been
    demonstrated in the table shown below.


    | Decimal | Octal | Hexadecimal | Type |


    | 16 | 020 | 0x10 | int |


    | 255 | 0377 | OXff | int |'
