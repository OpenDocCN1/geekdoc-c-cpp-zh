  trans: "\n\n```cpp\ndouble d = 1.23456789012345;\nfloat f;\nf = d; // 1.234568 is\
    \ assigned to f.\n```\n\n## 其他类型转换\n\n到目前为止，我们主要讨论了隐式类型转换，虽然它们在基础 C++ 编程中更为常见，但还有其他类型的转换也值得讨论。在本节中，我们将讨论函数调用中的隐式类型转换，以及一种我们目前还没有讨论过的新类型转换：`显式类型转换`。\n\
    \n## 在函数调用中使用隐式类型转换\n\n我们已经在本书的第二章中讨论过函数调用，如果你对本节中关于函数调用的内容不理解，请参阅介绍该概念的主题。\n\n\
    函数调用中的隐式类型转换工作原理与赋值中的隐式类型转换处理非常相似。这是因为在函数调用中，传递给函数的参数算术类型被转换为函数原型中指定的类型。通过这种方式，原型函数的参数得到了遵循和保留。例如：\n\
    \n```cpp\nvoid func( short, double); // Prototype\nint size = 1000; // . .\nfunc(\
    \ size, 68); // Call\n```\n\n在这个示例中，你可以看到 `func()` 函数有两个参数，其参数已经在开头的函数原型中定义。这些参数本应该是\
    \ `short` 和 `double` 类型。然而，在实际函数调用中，你可以看到使用的参数都是 `int` 类型。在这种情况下，将通过隐式类型转换将 `int`\
    \ 值 `size` 转换为 `double` 类型，并将整数 `68` 转换为 `double` 类型值。注意，当发生特定示例发生隐式类型转换时，编译器会发出警告。此警告的主要目的是提醒用户，由于从\
    \ `int` 类型转换为 `short` 类型，存在数据丢失的可能。为了避免此类警告，我们可以选择执行显式类型转换。\n\n## 显式类型转换\n\n顾如名，在此类型转换中，我们利用强制转换符\
    \ `(type)` 的功能显式地转换表达式类型。换句话说，我们使用强制转换符来执行显式类型转换。其语法所示：\n\n`(type) expression`\n\
    \n根据此语法，我们直接将赋值给表达式的值转换为指定的类型。因此，显式类型转换也常被称为“强制转换”（casting），该运算符也是以这一过程命名的。\n\n\
    由于强制转换符 `(type)` 本质上是一个一元运算符，它的优先级高于 C++ 中传统的算术运算符。让我们通过一个例子来理解显式类型转换。\n\n```cpp\n\
    int a = 1, b = 4;\ndouble x;\nx = (double)a/b;\n```\n\n在这个示例中，我们可以看到赋值给变量 `a`\
    \ 的值已显式地从 `int` 类型转换为 `double` 类型。另一个变量没有执行显式类型转换，是因为它的类型将由编译器通过隐式类型转换自动转换为匹配\
    \ `double` 类型。在执行隐式类型转换后，编译器将执行浮点除法操作，得到的精确结果为 `0.25`。该值最终通过赋值运算符赋值给变量 `x`。注意，如果我们在此示例中不执行强制转换，那么程序将执行一个简单的整数除法操作，它得到的结果将是\
    \ `0`，这显然是错误的。\n\n本节讨论的用于显式类型转换的强制转换符是通用的。在 C++ 中，还有其他可用运算符（例如 `dynamic_cast<>`）可以用于显式类型转换，但那些仅用于特定情况。\n\
    \n## 第 7 章：C++ 中引用和指针的使用\n\n在本章中，我们将学习引用和指针，它们在编程中作为参数的使用，以及函数返回的值。关于引用和指针的讨论将主要关注通过引用传递和只读访问参数。\n\
    \n## 定义引用\n\n内存中特定位置已存在的变量或对象被赋予另一个名称或别名，这就是它的引用。因此，可以使用原始名称或引用来访问该变量。为对象定义引用并不意味着它会在程序中占用额外的内存。定义的引用将与其所引用的对象一起执行操作。\n\
    \n引用的一种特殊用途是它们作为参数，处理函数的结果并返回其值。\n\n引用用取地址符号 `&` 表示，`T&` 是类型 `T` 的引用。\n\n示例：\n\
    ```cpp\nfloat x = 10.7;\nfloat & rx = x; // or: float & rx = x;\n```\n\n这里清楚地显示\
    \ `rx` 被用作变量 `x` 的另一种表达方式，这种引用被称为“float 引用”。\n\n示例：\n```cpp\n--rx; // 等于 --x;\n\
    ```\n\n在上面的示例中，详细说明了涉及 `rx` 的操作也将影响变量 `x`。用于表示引用的字符 `&` 仅与声明有关，与地址运算符不同。地址运算符用于求值并返回任何对象的地址。如果它与引用结合使用，则最终返回对象的地址。\n\
    \n示例：\n```cpp\n&rx\n```\n\n在定义对象的引用时，必须在声明之前对其初始化，且不能在后期进行修改。\n\n## 只读引用\n\n如果为常量变量定义引用，应该使用\
    \ `const` 关键字，以避免通过引用对对象的修改。然而，非常量对象也可以有常量引用。\n\n示例：\n```cpp\nint a;\nconst int\
    \ & cref = a;\n```\n引用 `cref` 是只读标识符，提供了对前例变量 `a` 的只读访问。与普通引用相比，只读标识符可以通过常量初始化。\n\
    \n示例：\n`const double& pi = 3.1415927;` 常量占用内存，因此编译器生成的临时对象会被引用。\n\n## 作为参数的引用\n\
    \n内存中特定位置已存在的变量或对象被赋予另一个名称或别名，这就是它的引用。因此，可以使用原始名称或引用来访问该变量。为对象定义引用并不意味着它会在程序中占用额外的内存。定义的引用将与其引用的对象一起执行操作。引用的一种特殊用途是它们作为参数，处理函数的结果并返回其值。\n\
    \n## 作为返回值的引用\n\n当函数的返回类型使用引用时，函数调用将代表一个对象并作为一个对象作用。\n\n示例：\n```cpp\nstring& message()\
    \ {\n    static string str = \" Today only cuts \";\n    return str;\n}\n```\n\
    \n上面的函数中，返回的是 `static string`，它不是函数中的普通变量。将其声明为这样是一个严重错误，因为字符串在程序离开相应的函数后会被销。因此，重要的是在离开函数后，返回值所引用的对象不能被销。\n\
    \n## 调用引用类型函数\n\n函数 `message()` 被定义为表示 `string` 引用的类型，因此调用 `message()` 代表一个 `string`\
    \ 类型对象。函数 `message()` 的一些有效语句有：\n\n```cpp\nmessage() = \"Let's go to the beer\
    \ garden!\";\nmessage() += \" Cheers!\";\ncout << \"Length: \" << message().length();\n\
    ```\n\n其他引用类型运算符\n\n简单的赋值运算符 `=` 和复合赋值运算符 `+=` 和 `*=` 也被用作引用类型运算符，位于左侧的操作接收返回的引用值。考虑以下表达式：\n\
    \n`a = b` 或 `a += b`\n\n变量 `a` 被视为对象，表达式表示该对象 `a`。这对于运算符引用的类类型对象也是可能的，例如在标准类 `string`\
    \ 中定义赋值运算符 `=` 和 `+=` 的示例。\n\n示例：\n```cpp\nstring name ( \"Johnny \" );\nname\
    \ += \"Depp\"; // 对 name 的引用\n```\n\n可以将此表达式作为参数传递给引用传递函数，因为它是表示对象的类型。\n\n## 定义指针\n\
    \n```cpp\n// pointer1.cpp\n// 打印变量的值和地址。\n// --------------------------------------------------\n\
    #include <iostream>\nusing namespace std;\nint var, *ptr; // 变量 var 和 ptr 定义\n\
    int main() {\n    // ...\n}\n```\n\n## 指针\n\n```cpp\n// pointer1.cpp\n// 打印变量的值和地址。\n\
    // --------------------------------------------------\n#include <iostream>\nusing\
    \ namespace std;\nint var, *ptr; // 变量 var 和 ptr 定义\nint main() {\n    var = 10;\n\
    \    ptr = &var;\n    cout << \"Value of var: \" << endl;\n    cout << \"Address\
    \ of var: \" << endl;\n    cout << \"Value via ptr: \" << endl;\n    return 0;\n\
    }\n```\n\n"
- fmt: '

    - The memory space that each pointer variable occupies does not depend on the
    type of object it refers to and is the same because it only stores the address
    of every object. The pointer variables on a 32-bit computer would typically occupy
    four bytes.

    - Logic addresses are used in the program, which is allocated to physical addresses
    with the help of the system. In this way, the management of storage can be made
    efficient, and memory blocks not being used in the current time are swapped to
    the hard disk.

    - When a valid address in C++ shows the value of 0, it indicates an error because
    no address has the value 0. In the standard header files, pointers use the symbolic
    constant `NULL` instead of 0, and these pointers are called `NULL pointers`.


    ## Using Pointers to Access Objects


    When a variable is pointing to an object, we can access this object by using the
    asterisk (the indirection operator). But we should not confuse the variable and
    the object with each other. `ptr` is the variable, and `*ptr` is the object.


    Example:

    ```cpp

    long a = 10, b;     // Definition of a, b

    *ptr;               // and pointer ptr.

    ptr = &a;           // Let ptr point to a.

    b = *ptr;

    ```

    In the example shown above, we can see that the `ptr` is pointing to a variable
    `a.` Also, notice that in the beginning, the value of `a` is being assigned to
    another variable `b.` Hence, at the end, we can also substitute the variable `b`
    with `a` as they both represent the same thing, i.e., the object `a.`


    `long *ptr;`

    The above expression means that `ptr` is `long*` type, which is a pointer to long.
    Similarly, it can also be said that `*ptr` is a long type.


    ## L-values


    L-value in C++ is the type of expression that specifies a memory location to identify
    an object. The L-value is derived from an assignment operator and occurs in the
    compiler error messages. So, it is important that the left operand in the assignment
    `=` operator always specifies an address stored in the memory.


    The expressions other than L-values, which cannot have a value assigned to it
    appear only on the right side of the assignment operator `=` and are termed as
    R-values. In a statement, the variable would be the L-value, while constants and
    expressions such as `x+1` are the R-values. L-values are also returned as results
    by using the indirection operators. Consider a pointer variable `p`, then `p`
    and `*p` would both be L-values because `*p` is the object that variable `p` points
    to.


    ## Pointers as Parameters


    The following program demonstrated shows the implementation of pointers as parameters.![](rsrc2YX.jpg)


    ## Objects as Arguments


    When a function is called, and an object is passed over as an argument to the
    required function, the possible situation that may occur would:


    - The function parameter is of the same type as the object which was passed to
    it as the argument. Thus, the function that is called receives a copy of the object
    (passing by value).

    - The function parameter is a reference that means the said parameter is an alias
    for the argument. The function that is called then manipulates the object which
    was passed to it by the calling function (passing by reference).


    In the passing by value, it is clear that the function that was passed over the
    argument cannot manipulate it, but it is possible when using a ‘passing by reference.’
    On the other hand, a third situation related to passing by reference is passing
    the pointers to the required function.


    ## Pointers as Arguments


    When a function parameter is declared as a pointer variable, it is possible to
    declare a function in a way that an address can be passed as an argument to the
    function. For example, by using the statement:


    ```cpp

    long func( int *iPtr ){// Function block}

    ```

    The parameter `iPtr` is declared as an int pointer, so the address of an int value
    can be passed to the function `func()` as an argument. A function can access and
    manipulate an object with the help of the indirection operator only if it knows
    the memory address of that object.


    The function `swap()` shown in the sample program is used to swap the values given
    by the variables `x` and `y` within the calling function. The addresses of the
    variables `&x` and `&y` are already passed to the function as arguments, which
    enables the function to access these variables and manipulate them.


    The `swap` function contains two parameters `p1` and `p2` which are declared as
    float pointers. These pointers are initialized with the addresses of variables
    `x` or `y` by the given statement:

    `swap(&x, &y);`


    By manipulating the expression `*p1` and `*p2`, the function can access variable
    `x` and `y` available in the calling function. In this way, their values can be
    exchanged.

    '
