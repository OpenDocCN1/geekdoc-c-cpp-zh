  trans: "\n当表达式 `3` 重新初始化语句并返回 `expression 2` 再次验证值时，循环将重复。放在 `expression 1` 中的循环计数器只能在循环内部使用，不能在循环结束后使用。\n\
    \n示例：`for ( int i = 0; i < 10; cout << i++ );`\n\n给出的示例表明，某些循环甚至可以空语句，因为所有必要的语句都位于循环头。虽然这种方法可行，但这种循环体的可读性明显不如那些在空语句中单独占一行的循环体。\n\
    \n```cpp\n// EuroDoll.cpp\n// 输出汇率表：欧元和美国美元\n#include <iostream>\n#include <iomanip>\n\
    using namespace std;\nint main(){\n    long euro, maxEuro;             // 欧元金额\n\
    \    double rate;                     // 汇率 欧元 <-> $\ncout << \"\\n* * * TABLE\
    \ OF EXCHANGE \"<< \" Euro – US-$ * * *\\n\\n\";\n\ncout << \"\\nPlease give the\
    \ rate of exchange: \"\" one Euro in US-$: \";cin >> rate;\ncout << \"\\nPlease\
    \ enter the maximum euro: \";cin >> maxEuro;\n\n// --- 输出表格 ---\n// 列标题：\ncout\
    \ << '\\n'<< setw(12) << \"Euro\" << setw(20) << \"US-$\"<< \"\\t\\tRate: \" <<\
    \ rate << endl;\n// 格式化 US-$:\ncout << fixed << setprecision(2) << endl;\nlong\
    \ lower, upper,               // 下限和上限\nstep;                            // 步长\n\
    // 外层循环决定实际的\n// 下限和步长：\nfor( lower=1, step=1; lower <= maxEuro;step*= 10, lower\
    \ = 2*step)\n// 内层循环输出一个“块”:\nfor( euro = lower, upper = step*10;euro <= upper\
    \ && euro <= maxEuro; euro+=step)\n    cout << setw(12) << euro<< setw(20) <<\
    \ euro*rate << endl;\nreturn 0;\n}\n```\n\n在 `for statement` 中，表达式 `1`、`2` 和 `3`\
    \ 中的任何一个都可以很容易省略。例外是循环中必须至少有两个分号。因此，根据这一声明，for 语句的最短形式将写为：\n\n示例：`for ( ; ; )`\n\
    \n在这个示例中，控制表达式是 `expression 2` 必须缺失的条件。因此，在这种情况下，值始终返回为真，循环变成无限循环。\n\n示例：`for\
    \ ( ; expression ; )`\n\n这种 for 语句表达式的行为方式与 while 语句相同；只要控制表达式被验证为真，循环就会继续。\n\n\
    ### 逗号运算符\n\n逗号运算符用于分隔两个表达式，这些表达式被包含在只需要一个语句的代码中。例如在 `for statement` 的循环头中被用作初始化器的多个变量。逗号运算符具有以下语法：\n\
    \n语法：`expression1, expression2 [, expression3 ...]`\n\n表达式集从左到右求值，当它们必须为了单个值进行求值时，只考虑最右边的表达式。\n\
    \n示例：\n```cpp\n    int x, i, limit;\nFor ( i=0, limit=8; i < limit; i += 2)\n\
    x = i * i, cout << setw (10) << x;\n```\n\n逗号运算符分隔了上述示例中的不同计算。`i` 和 `limit` 的赋值由逗号分隔，随后是\
    \ `x` 值的计算和输出，都在同一个语句中。\n\n逗号运算符的优先级在顺序是最低的，甚至低于赋值运算符。因此，不需要像上面那样使用括号。\n\n包含逗号的语句中的最后一个表达式决定了逗号运算符的类型和值。\n\
    \n示例：`x = (a = 3, b = 5, a * b);`\n\n从左开始的表达式首先被求值，然后将 `a * b` 的值赋值给 `x`。\n\n\
    ### `do-while` 语句\n\ndo-while 的结构如下：\n\n![](img/rsrc2YH.jpg)\n\n程序中控制流的 do-while\
    \ 语句的实际实现所示：\n\n```cpp\n// tone.cpp\n#include <iostream>\nusing namespace std;\n\
    const long delay = 10000000L;\nint main(){\n    int tic;\n    cout << \"\\nHow\
    \ often should the tone be output? \";cin >> tic;\n    do{\n        for( long\
    \ i = 0; i < delay; ++i );\n        cout << \"Now the tone!\\a\" << endl;\n  \
    \  }while( --tic > 0 );\n    cout << \"End of the acoustic interlude!\\n\";\n\
    \    return 0;\n}\n```\n\n在 do-while 语句中，循环至少执行一次，控制表达式在循环之后评估。因此，此迭代语句是由它的尾部控制的，而不是另外两个由其头部控制的语句。\n\
    \n语法：`do statement while ( expression);`\n\ndo-while 在循环体执行一次后评估控制表达式，如果表达式的值返回为真，则重复循环；同时，为假的结果将终止循环。\n\
    \n### 嵌套循环\n\n嵌套循环意味着将不同的循环嵌套在循环体内部，即循环中的循环。根据 ANSI 标准，C++ 最多允许 256 层嵌套。示例程序给出了由用户确定的输出。给定程序有两个循环，一个嵌套在另一个内部。每当外层循环（do-while\
    \ 语句）重复时，在执行内层循环（for 语句）的过程中会发生中断。在内层循环中，`i` 的值从 0 增加到 `delay`。该程序的输出是由于输出控制字符（ASCII\
    \ 7）生成的文本。该控制字符表征为 `\\a`。do-while 语句在输入为 0 或负数时也会输出。\n\n### `If-Else` 语句的选择\n\n\
    if-else 语句的结构图如下：\n\n![](img/rsrc2J.jpg)\n\n同样，if-else 语句的实现如下所示：\n\n```cpp\n\
    // if_else.cpp\n// 展示 if-else 语句的使用\n#include <iostream>\nusing namespace std;\n\
    int main(){\n    float x, y, min;\n    cout << \"Enter different numbers:\\n\"\
    ;\n    if( cin >> x && cin >> y)  // 如果输入\n    {\n        if( x < y ) // 较小的\n\
    \            min = x;\n        else\n            min = y;\n        cout <<nThe\
    \ number is: \" << min << endl;\n    }\n    else\n        cout << \"\\nInput!\"\
    \ << endl;\n    return 0;\n}\n```\n\nif-else 语句用于根据满足的两个语句之间进行选择。\n\n语法：`if (\
    \ expression ) statement1 else statement2`\n\n首先评估表达式以验证条件是否满足。结果返回真或假。如果为真，则执行\
    \ `statement1`，并且在存在 else 分支的情况下终止；如果为假，则忽略 `statement1` 并执行 `statement2`。然而，如果没有\
    \ `else` 语句且为假，则跳转到 if-else 语句之后。\n\n#### 嵌套 if-else 语句\n\n考虑到程序中使用多个 if-else\
    \ 语句的情况，多个 if-else 语句可以相互嵌套。某些 `if statements` 没有关联 `else` 分支。因此，`else` 分支与最近的没有\
    \ else 的 if 语句关联。\n\n示例：\n```cpp\nif ( n > 0 )\n    if ( n%2 == 1 )\n        cout\
    \ << \" Positive odd number \";\nelse\n    cout << \"Positive even number\";\n\
    ```\n\n从示例可见，else 分支与缩进的第二个 if 语句关联。如果需要重新定义 else 分支并将其与另一个 if 语句关联，则使用代码块。\n\n\
    示例：\n```cpp\nif ( n > 0 ){ \n    if ( n%2 == 1 )\n        cout << \" Positive\
    \ odd number \\n\";\n}\nelse\n    cout << \" Negative number or zero\\n\";\n```\n\
    \n#### 在 if 语句中定义变量\n\n变量可以在 if 语句中定义并用于初始化。如果变量被转换为 `bool` 类型并返回真值，那么 if 语句中的表达式也为真。\n\
    \n示例：`if ( int x = func ( ) ){ . . }`\n\n示例中的变量 `x` 由函数 `func()` 的结果初始化。对于除 0\
    \ 以外的任何值，块中的语句都会求值并执行。一旦程序离开 if 语句，变量 `x` 不再被使用。\n\n### Else-If 链\n\nelse-if 语句的结构实现如下：\n\
    \n![](img/rsrc2YK.jpg)\n\n示例程序中的 else-if 语句实现：\n\n```cpp\n// speed.cpp\n// 输出超速的罚款\n\
    #include <iostream>\nusing namespace std;\nint main(){\n    float limit, speed,\
    \ toofast;\n    cout << \"\\nSpeed limit: \";cin >> limit;\n    cout << \"\\nSpeed:\
    \ \";cin >> speed;\n    if( (toofast = speed – limit ) < 10)\n        cout <<\
    \ \"You were lucky!\" << endl;\n    else if( toofast < 20)\n        cout << \"\
    Fine payable: 40,-. Dollars\" << endl;\n    else if( toofast < 30)\n        cout\
    \ << \"Fine payable: 80,-. Dollars\" << endl;\n    else\n        cout << \"Hand\
    \ over your driver's license!\" << endl;\n    return 0;\n}\n```\n\n#### 布局与程序流\n\
    \n如果程序有多个选项可以选择，可以借助 else-if 链选择性地执行，这些链是嵌入的一系列 if-else 语句。这些链的布局如下：\n\n```\n\
    if ( expression1 )\nstatement1\nelse if ( expression2 )\nstatement2\n...\nelse\
    \ if ( expression(n) )\nstatement(n)\n[ else statement (n+1)]\n```\n\n在执行 else-if\
    \ 链期间，从第一个（expression1）开始的表达式按照顺序逐一求值。验证第一个表达式，是真还是假。如果为真，则执行其后的语句，并且链终止；但如果为假，则评估下一个表达式。如果没有任何表达式返回为真，则执行与最后一个\
    \ if 语句关联的 else 分支。\n\n#### 条件运算符\n\n条件运算符 `(?:)` 可以作为 if-else 语句的简洁替代方案。这种选择机制基于语句中的两个给定值之一根据关联条件的值被选择输出。\n\
    \n语法：`expression ? expression1 : expression2`\n\n条件表达式的值将是 `expression1` 或 `expression2`。首先评估表达式或给定的条件。如果结果返回为真，则选择并评估\
    \ `expression1`；但如果结果为假，则选择 `expression2` 进行评估。\n\n示例：`z = ( a >= 0 ) ? a : -a;`\n"
- fmt: "\nThe variable `z` in the given expression is to be assigned an absolute value\
    \ of `a`. The first condition is that if the value of `a` is positive such as\
    \ `12`, then the variable `z` is assigned the number `12`. But if it is a negative\
    \ number like `-8`, the value of `z` would be `8`. The value obtained from the\
    \ conditional expression is stored in the variable `z`, and hence, it can be considered\
    \ to the if-else statement shown below:\n\n```cpp\nif ( a > 0 )\n    z = a;\n\
    else\n    z = -a;\n```\n\n### Precedence\nThe only operator that uses three operands\
    \ in the C++ language is the conditional operator. The brackets visible in the\
    \ first example can be removed because the precedence of a conditional operator\
    \ is higher than assignment operators and comma operators and lower than the rest.\
    \ The result produced by the evaluation of a conditional statement can be used\
    \ directly without having to assign it. This can be understood by the following\
    \ example, which has the condition that `x` should be greater than `y`. If `x`\
    \ is a greater value, then the value of `x` is displayed as the output. Otherwise,\
    \ the value of `y` will be printed. For complex expressions, it would be better\
    \ to use a variable to which the value of the conditional expression will be assigned\
    \ so that the readability of the program can be increased.\n\n### The ‘Switch’\
    \ Statements\nThe structural implementation of a switch statement in a program\
    \ is as follows:\n\n![](rsrc2YN.jpg)\n\nA sample program demonstrating the implementation\
    \ of switch statements and expressions has been shown below:\n\n```cpp\n// Evaluates\
    \ given input.\nint command = menu();           // The function menu() reads a\
    \ command.\nswitch( command )              // Evaluate command.\n    case 'a':\n\
    \    case 'A':\n        action1();      // Carry out 1st action.\n        break;\n\
    \    case 'b':\n    case 'B':\n        action2();      // Carry out 2nd action.\n\
    \        break;\n    default:\n        cout << '\\a' << flush; // Beep on\n} \
    \                                  // invalid input\n```\n\nJust as the else-if\
    \ chain evaluates multiple statements in sequence, the switch statement also chooses\
    \ between numerous alternatives. The difference is that it compares the expression\
    \ given in the beginning with all the other constants or statements.\n\n```cpp\n\
    switch ( expression ){\n{\n    case const1: [ statement ][ break; ]\n    case\
    \ const2: [ statement ][ break; ]\n    ...\n    [ default : statement ]\n}\n```\n\
    \nBefore implementation of the switch statement, it is mandatory to consider whether\
    \ the expression that needs to be evaluated and the constants to which it will\
    \ be compared to are all of the integral type (such as Boolean values or character\
    \ constants). Then the result of the expression evaluation is compared to `const1`,\
    \ `const2`, and so on, written in the case labels. Each of these constants must\
    \ be different. \n\nWhen the result value finds a match among the multiple case\
    \ constants, the program moves on to the selected case label and continues onwards.\
    \ After this step, the case labels are not required anymore.\n\nThe unnecessary\
    \ execution of case labels after the switch statement is implemented is prevented\
    \ by putting the `break` statement after each constant statement. This makes the\
    \ program leave the statement unconditionally.\n\nIn case the expression result\
    \ value does not match with any of the constants, the program branches to the\
    \ `default` label, which may not necessarily be the last label. If additional\
    \ case labels need to be added to the switch statement, they can be placed after\
    \ the `default` label. If the `default` label is not defined, then nothing happens,\
    \ and the program moves on to execute the next operator.\n\n### Differences between\
    \ the switch and else-if chains\nIn terms of versatility and usefulness, else-if\
    \ chains are better than switch statements because every kind of selection can\
    \ be programmed using the else-if chain. The disadvantage to the else-if chain\
    \ is that the integral values of the expressions need to be constantly compared\
    \ to several possible values. So, for cases like this, it is better to use a switch\
    \ statement. Comparing the readability of the else-if chain and the switch statement\
    \ is the given example, it is clear that switch statements are easier to read\
    \ and hence should be used wherever it is possible.\n\n### Chapter 6: Arithmetic\
    \ Data Type Conversions\nIn programming, it is very common to have arithmetic\
    \ types which are different from each other. Just as the types are different,\
    \ it’s a given that we cannot perform mathematical operations on inputs belonging\
    \ to two different arithmetic types. When dealing with such types, we need to\
    \ convert one of them into the same type as the other. In this chapter, we will\
    \ learn all about these conventions and rules to arithmetic types of conversions.\n\
    \nHowever, be mindful when going through this chapter, as you will often find\
    \ yourself dealing with different data types (especially arithmetic). In such\
    \ cases, it is important to know how to deal with them. Moreover, data type conversions\
    \ are a very important and very fundamental skill when it comes to C++ programming.\
    \ This is because big programming projects often involve huge amounts of data\
    \ streams from different sources and are very intricately intertwined. This means\
    \ that the inputs and outputs of such a complex program begin to form an ecosystem\
    \ of their own as they are used and reused by different classes, objects, and\
    \ functions. As such, it is not always the case that such data being circulated\
    \ through the program is going to be the correct type. This is why implementing\
    \ data type conversions is very important to allow the program to work efficiently.\n\
    \nIn this chapter, we will chiefly learn about implicit type conversions and briefly\
    \ discuss some type conversions at the end of this chapter.\n\n#### Implicit Type\
    \ Conversions\nBefore we go into the main discussion, we need to set up the context.\
    \ The following figures that have been shown below highlight the promotion and\
    \ int type respectively:\n\n![](rsrc2YP.jpg)(Integer Promotion)\n![](rsrc2YR.jpg)(int\
    \ type hierarchy)\n\nIn many of the C++ programs, we will occasionally see a single\
    \ expression containing different arithmetic types. This mixed-up arithmetic types\
    \ within the same expression mean that the operands of the corresponding operator\
    \ belong to the different types that have been highlighted in the expression.\
    \ The reason why this does not cause an error in the program while it tries to\
    \ perform the corresponding operation is due to the compiler performing implicit\
    \ type conversion by itself.\n\nIn an implicit type conversion, the requirement\
    \ of the operation which needs to be performed is first considered. This means\
    \ that we first check the type needed for the operation to proceed. This type\
    \ that is determined is a common ground between the two types between which we\
    \ are performing type conversion. Once a common type through which we can perform\
    \ the operation is decided, the values for both operands are assigned this type.\n\
    \nA general rule in implicit type conversion is that a smaller type is the one\
    \ which is subject to conversion. The smaller type is generally converted to the\
    \ larger type of the two operands. However, there is an operator that is exempt\
    \ from this rule, and this operator is the assignment operator. We will discuss\
    \ the assignment operator in the upcoming sections of this chapter in detail.\n\
    \n##### Integer Promotion\nIn this type of conversion, the main focus is to conserve\
    \ the value of the original type when it is converted into the int type. For instance,\
    \ a bool type containing a value which is either a True or False value, when converted\
    \ through integer promotion, will have its values changed to “1 for True” and\
    \ “0 for False”. In this way, the original value is preserved coming into the\
    \ int type. Moreover, the integer promotion type conversion is performed on expressions\
    \ that are:\n"
