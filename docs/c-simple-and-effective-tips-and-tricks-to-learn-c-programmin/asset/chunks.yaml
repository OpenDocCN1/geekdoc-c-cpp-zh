    现在让我们来讨论并澄清浮点数中的“精度”（Accuracy）这一概念。在数值表示中，一个值在小数点位后的数字越多，它的精度就越高。换句话说，高精度意味着浮点值在小数点位后有更多的数字。同样，低精度意味着浮点值在小数点位后的数字较少。例如，与浮点数
    `22.123` 相比，浮点数 `22.123456` 具有更高的精度。


    现在我们必须理解程序员是如何利用这个“精度”概念的。当我们有一个精确到六位小数的数字时，只要它与原始数字相比至少在某一个小数位上不同，我们就可以将相同的值存储为独立的、可区分的数字。然而，如果我们试图在一个
    6 位精度的浮点类型中，将一个精确到五位小数的数字与另一个精确到四位小数的相同数字作为独立数字存储，这种约定并不总是成立。明确的是，无法保证 `22.12345`
    和 `22.1234` 这两个数字在精度提高到 6 位小数时会有不同的小数位。


    当你的程序对于表示由特定设备或系统严格支持的精度的浮点数至关重要时，建议首先参考名为 `cfloat` 的头文件中定义的值。


    结论，数据的数学表示主要由两种数据类型处理。根据该值的算术性质（整数或带有小数的数字），它可以存储在整数类型或浮点类型中。下面列出了所有相应的类型。


    ### 整数数据类型 (Integral Data Types)

    - `bool`

    - `char`, `signed char`, `unsigned char`, `wchar_t`

    - `short`, `unsigned short`

    - `int`, `unsigned int`

    - `long`, `unsigned long`


    ### 浮点数据类型 (Floating-Point Data Types)

    - `float`

    - `double`

    - `long double`


    电气电子工程师学会（也称为 IEEE）为计算机编程领域提供了一种用于表示浮点类型的通用格式。下表简要讨论了这种格式表示法。


    | 类型 | 内存 | 取值范围 | 最小正值 | 十进制精度 |

    | :--- | :--- | :--- | :--- | :--- |

    | Float | 4 字节 | –3.4E+38 | 1.2E—38 | 6 位 |

    | Double | 8 字节 | –1.7E+308 | 2.3E—308 | 15 位 |

    | long double | 10 字节 | –1.1E+4932 | 3.4E—4932 | 19 位 |


    在接下来的章节中，我们将简要讨论 `sizeof` 运算符，并根据它们所表示对象的性质对数据类型进行分类。


    ### ‘sizeof’ 运算符

    当我们需要确认存储某种类型对象所需的内存时，我们只需使用 `sizeof` 运算符来实现这一目的。例如，如果我们像下面使用该运算符：


    ```

    sizeof (name of the object)

    ```

    程序将告诉我们存储该对象所需的内存。换句话说，` `sizeof`提供了对象的内存需求，而 `name` 参数定义了对象本身或其相应的类型。例如，通过向上述参数输入正确的数据，比如
    `sizeof(int)`。如果你记得 `int` 类型本身会根据系统进行调整，那么你也能理解为什么 `sizeof` 运算符会根据系统给出不同的值（它可能是
    2 或 4）。同样，如果我们将此运算符用于浮点类型，即 `sizeof(float)`，那么我们将得到一个 4 的值，代表存储该对象所需的内存。


    ### 分类

    根据对象的性质，我们可以将三种基本数据类型中的两种（整数类型和浮点类型）分类为算术数据类型，因为可以使用算术运算符对这些类型的变量进行算术计算。


    到目前为止，我们讨论了表示值的对象并对其进行了相应的分类。然而，还有一些不表示任何值的对象，例如函数。为了对此类表达式分类，我们只需通过 `void` 类型表示它们。换句话说，`void`
    类型包含了那些不表示任何值的表达式。因此，一个典型的函数调用可以用 `void` 类型表示。


    ### 基本常量 (The Fundamental Constants)

    常量也被称为“字面量（literal）”。在编程过程中我们一直都会处理常量，即使你不知道它们。例如，我们刚刚学习了布尔数据类型。一个布尔值可以是 1 或 0，即
    True（真）或 False（假）。这里的关键字 `True` 和 `False` 都是布尔常量。同样，每一个数字、字符甚至字符串（字符序列）都是“常量”。


    常量与数据类型直接相关。常量的最基本目的是表示值，而值反过来代表类型。因此，取决于常量如何被使用，我们可以相应地定义值的类型。根据上面的讨论，我们可以得出
    C++ 中有四种基本常量。这些常量是：


    1. 布尔常量

    2. 数字常量

    3. 字符常量

    4. 字符串常量


    我们现在分别讨论每种基本常量。


    #### 1. 布尔常量

    布尔常量是表示逻辑状态的常量。`True` 和 `False` 都是布尔常量。它们通常用于 `bool` 类型变量。


    #### 2. 数字常量

    十进制、八进制或十六进制数字被称为整数常量。让我们简要讨论这些数字以及如何区分它们。


    - 十进制常量属于十进制系统（基数为 10）。十进制数字不以 0 开头。例如，10、120。

    - 八进制常量属于八进制系统（基数为 8）。八进制数字总是以 0 开头。例如，088、0245 都是八进制数。

    - 十六进制常量属于十六进制系统（基数为 16）。十六进制数字总是以一对字符开头的。这对字符可以是“0x”或“0X”。例如，0x24A 和 0X2b4F 都是十六进制数。字母表示大于
    9 的数字（例如，A 代表 10，B 代表 11，F 代表 15）。十六进制数字没有强制的大小写限制。


    通常，整数常量被分配给 `int` 类型。然而，如果常量值太大 `int` 类型无法处理，则将使用适合处理该值的类型。无论如何，了解整数类型的排序是重要的：


    1. `int`

    2. `long`

    3. `unsigned long`


    为了为整数常量指定 `long` 或 `unsigned long` 类型，我们只需给数字加上类型的第一个字母。例如，如果我们将数字 15 赋值给 `long`
    类型，则只需添加 `L` 或 `l`。同样，如果我们我们将相同的数字赋值给 `unsigned long` 类型，则将使用 `UL` 或 `ul` 字母。对于给
    `unsigned int` 类型分配数字，我们只需要使用字母 `U` 或 `u`。演示如下：


    `15L` 和 `15l` 对应于 `long` 类型

    `15U` 和 `15u` 对应于 `unsigned int` 类型

    `15UL` 和 `15ul` 对应于 `unsigned long` 类型


    所有整数常量的详细示例已在表中所示。


    | 十进制 | 八进制 | 十六进制 | 类型 |

    | :--- | :--- | :--- | :--- |

    | 16 | 020 | 0x10 | int |

    | 255 | 0377 | OXff | int |


