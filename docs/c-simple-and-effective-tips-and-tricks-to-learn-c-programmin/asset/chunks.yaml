  trans: "\n给定表达式中的变量 `z` 将赋值为 `a` 的绝对值。第一个条件是，如果 `a` 的值为正数（例如 `12`），则变量 `z` 被赋值为数字\
    \ `12`。但如果是一个负数（例如 `-8`），则 `z` 的值将是 `8`。从条件表达式得到的值存储在变量 `z` 中，因此，它可以被视为下所示的 if-else\
    \ 语句：\n\n```cpp\nif ( a > 0 )\n    z = a;\nelse\n    z = -a;\n```\n\n### 优先级\n\
    C 语言中唯一使用三个操作数的运算符是条件运算符。第一个示例中可见括号可以删除，因为条件运算符的优先级高于赋值运算符和逗号运算符，但低于其他运算符。条件语句求值的结果可以直接使用，而无需赋值。这可以通过下面的示例理解，该示例的条件是\
    \ `x` 应该大于 `y`。如果 `x` 是一个较大的值，则显示 `x` 的值作为输出。否则，将打印 `y` 的值。对于复杂的表达式，最好使用一个变量来接收条件表达式的值，这样可以提高程序的可读性。\n\
    \n### “Switch”语句\n程序中 switch 语句的结构实现如下：\n\n![](img/rsrc2YN.jpg)\n\n下面展示了一个演示 switch\
    \ 语句和表达式实现的示例程序：\n\n```cpp\n// 评估给定的输入。\nint command = menu();           // 函数\
    \ menu() 读取命令。\nswitch( command )              // 评估 command。\n    case 'a':\n\
    \    case 'A':\n        action1();      // 执行第 1 个动作。\n        break;\n    case\
    \ 'b':\n    case 'B':\n        action2();      // 执行第 2 个动作。\n        break;\n\
    \    default:\n        cout << '\\a' << flush; // 蜂鸣提示\n}                    \
    \               // 无效输入\n```\n\n就像 else-if 链顺序评估多个语句一样，switch 语句也会在许多备选项之间进行选择。区别在于它将开头给出的表达式与所有其他常量或语句进行比较。\n\
    \n```cpp\nswitch ( expression ){\n{\n    case const1: [ statement ][ break; ]\n\
    \    case const2: [ statement ][ break; ]\n    ...\n    [ default : statement\
    \ ]\n}\n```\n\n在实现 switch 语句之前，必须考虑需要评估的表达式以及与之比较的常量是否都是整型类型（例如布尔值或字符常量）。然后，表达式求值的结果将与\
    \ case 标签中编写的 `const1`、`const2` 等进行比较。这些常量中的每一个都必须是不同的。\n\n当结果值在多个 case 常量中找到匹配时，程序将移动到选定的\
    \ case 标签并继续向下执行。完成此步骤后，就不再需要 case 标签。\n\n通过在每个常量语句之后放置 `break` 语句，可以防止在 switch\
    \ 语句实现后对 case 标签进行不必要的执行。这使得程序无条件地离开语句。\n\n如果表达式结果值与任何常量都不匹配，程序将跳转到 `default`\
    \ 标签，该标签不一定是最后一个标签。如果需要向 switch 语句添加额外的 case 标签，可以将它们放在 `default` 标签之后。如果没有定义\
    \ `default` 标签，则什么都不会发生，程序将继续执行下一个运算符。\n\n### switch 语句与 else-if 链的区别\n在通用性和实用性方面，else-if\
    \ 链优于 switch 语句，因为可以使用 else-if 链编写每种选择。else-if 链的缺点是表达式的整型值需要不断与几个可能的值进行比较。因此，对于这种情况，最好使用\
    \ switch 语句。对比给定示例中 else-if 链和 switch 语句的可读性，很明显 switch 语句更容易阅读，因此在可能的地方都应该使用。\n\
    \n### 第 6 章：算术数据类型转换\n在编程中，存在彼此不同的算术类型是非常常见的。正如类型不同一样，众所易见，我们无法对属于两种不同算术类型的输入执行数学操作。在处理此类类型时，我们需要将其中一种转换为与另一种相同的类型。在本章中，我们将学习所有关于算术类型转换的约定和规则。\n\
    \n然而，在阅读本章时要注意，因为你会经常发现自己正在处理不同的数据类型（特别是算术类型）。在这种情况下，知道如何处理它们非常重要。此外，数据类型转换是 C++\
    \ 编程中一项非常重要且基础的技能。这是因为大型编程项目通常涉及来自不同源的海量数据流，并且交织在一起。这意味着这种复杂程序的输入和输出在被不同的类、对象和函数使用和重用时，开始形成它们自己的生态系统。因此，在程序中传输的此类数据并不总是正确的类型。这就是为什么实现数据类型转换对于允许程序高效运行至关重要。\n\
    \n在本章中，我们将主要学习隐式类型转换，并在章末尾简要讨论一些类型转换。\n\n#### 隐式类型转换\n在进入主要讨论之前，我们需要设定背景。下面所示的几幅图分别突出了提升（promotion）和\
    \ int 类型：\n\n![](img/rsrc2YP.jpg)(整数提升)\n![](img/rsrc2YR.jpg)(int 类型层次)\n\n在许多\
    \ C++ 程序中，我们偶尔会看到包含不同算术类型的单一表达式。同一个表达式中混合的算术类型意味着对应运算符的操作数属于表达式中高亮显示的不同类型。程序在尝试执行相应操作时之所以没有引起错误，是因为由于编译器自动执行了隐式类型转换。\n\
    \n在隐式类型转换中，首先考虑需要执行的操作的要求。这意味着我们首先检查操作所需的类型。所确定的类型是正在进行类型转换的两个类型之间的共同点。一旦决定了可以执行操作的共同类型，两个操作数的值都将被分配该类型。\n\
    \n隐式类型转换的一个通用规则是，较小类型是被进行转换的类型。较小类型通常转换为两个操作数中较大的类型。然而，有一个运算符不受此规则限制，该运算符就是赋值运算符。我们将在章的后续章节中详细讨论赋值运算符。\n\
    \n##### 整数提升\n在这种转换类型中，重点是在原始类型转换为 int 类型时保留其值。例如，包含 True 或 False 值的 bool 类型在通过整数提升转换时，其值将变为“1\
    \ 代表 True”和“0 代表 False”。这样，原始值在进入 int 类型时得到了保留。此外，整数提升类型转换是在以下表达式上执行的：\n"
