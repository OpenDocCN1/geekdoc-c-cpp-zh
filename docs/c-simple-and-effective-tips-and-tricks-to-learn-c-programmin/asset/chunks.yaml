  trans: '


    # C++ 的基本特性


    需要理解，C++ 并不是一种纯关注面向对象编程的编程语言。C++ 衍生于“C”编程语言，是一种混合型语言。虽然 C++ 在某些方面与原始的“C”编程语言不同，但它仍然保留了“C”编程语言中存在的大部分功能。换句话说，C++
    语言也支持 `C` 编程语言的典型特性，例如：


    * 可以通用通的模块化程序。

    * 高效的机器编程能力。

    * 用 C++ 编写的程序可以很容易移植到其他平台。


    正如 C++ 拥有 `C` 编程语言的所有重要特性一样，用 `C` 编程语言编写的大部分代码也可以在 C++ 源代码中复用。C++ 编程语言的另一个重要特性是它将
    `C` 面向对象编程的概念强化到了自身之中。例如，下面列出了一些面向对象编程的概念：


    * 数据抽象：在编程时创建类来定义对象。

    * 数据封装：获取对对象数据受控的访问路径。

    * 继承：创建派自其他类的类（类甚至可以派生自多个派生类）。

    * 多态：使用一套指令集，使其在程序代码执行期间能够展现出不同类型的效果。


    C++ 语言具有 `C` 编程语言的面向对象特性以及来自其他编程语言的各种元素。例如，模板和异常处理等编程元素在高效实现程序方面提供了不可思议的功能。不仅如此，这些特定元素在为编程工作提供便利的同时，还确保了你对程序有更清晰的理解。


    # 面向对象编程


    在本节中，我们将讨论并构建传统的过程化编程与面向对象编程之间的对比。


    ## 传统的过程化编程


    传统过程化编程的核心概念基于将要处理的数据与相应的子程序和过程（也称为数据和函数）分离。这显著影响了程序处理数据的方法，例如：


    * 程序员的首要任务是确保在数据使用之前，已用适当且合适的值对其进行初始化。此外，程序员还必须确保在需要时可以将数据和适当的值传递给函数。

    * 代表数据的函数是特定的。由于由于，如果数据的表示方式发生变化（例如，数据以记录的形式表示且该记录被延长），那么表示该数据的函数也必须进行相应的修改。


    由于这些特性，限制了程序的生产力并阻碍了对低维护需求的支持。此外，上述传统过程化编程的特性使得程序更容易产生错误。


    ## 面向对象编程


    在面向对象编程中，重点不再是强调数据和函数的元素，而是主要关注对象本身。换句话说，程序员关注程序中突出程序本身主要目的的元素。例如，在面向对象编程中，一个为处理和维护银行账户而创建的程序将包含数据对象，如利率、余额、贷方和贷方计算、转账等。用面向对象编程构建的程序将包含与程序中每个账户对应的对象。每个对象都代表了对程序账户管理基本功能至关重要的属性和能力。


    在面向对象编程中，属性和能力分别对应数据和函数，然后这些元素在程序中组合在一起。这是通过使用 `classes` 实现的。基于面向对象编程的程序中的 `class`
    将通过直接定义对象的属性和能力来定义对象类型。对象之间还可以通过消息相互通信。通过这种方式，对象还可以激活另一个对象的能力，这在便于构建程序的同时还具有多重优势。


    ### 面向对象编程的优势


    在软件开发方面，面向对象编程提供了若干优势，使其比传统的过程化编程更实用。由于传统的过程化编程缺乏某些方面，导致它不太被程序员使用。其中一些优势列在下方：


    * 更不容易产生错误：根据相应数据定义的对象可以控制对该数据的访问尝试。换句话说，对象可以拒绝对其数据进行易错误的访问尝试。

    * 易于复用：已创建的对象能够自我维护。由于对象的这种特性，使得它们更容易作为构建块非常方便地用在其他程序中。

    * 低维护需求：根据情况，对象能够修改其内部数据的表示方式，而不需要修改应用程序。这使得它比传统的过程化编程更具实用。


    # 翻译和创建 C++ 程序


    开发一个 C++ 程序比你想象的要简单。在本节中，我们将讨论如何翻译一个 C++ 程序并创建一个简单的 C++ 程序。


    ## 翻译 C++ 程序


    接下来的图描述了 C++ 翻译的过程。

    ![](img/rsrc2Y4.jpg)


    在翻译 C++ 程序时，三个主要步骤对于创建和翻译过程非常重要。这些步骤概述如下所示：


    1. 使用文本编辑器将 C++ 程序的源代码保存到文本文件中。包含程序源代码的文件被称为源文件。对于短期项目，使用一个源文件是可以接受的。然而，对于大型编程项目，建议将程序的源代码存储在多个源文件中，以便方便地单独编辑和翻译。这种方法被称为模块化编程。


    2. 使用 `compiler` 翻译程序。程序员向 `compiler` 输入包含他想要翻译的程序源代码的源文件。如果编译过程没有遇到任何错误，则输出将是一个包含机器码的对象文件。这种对象文件被称为模块。


    3. 使用 `linker` 将不同的模块组合到对象文件中，以创建可执行文件。通过 `linker` 添加到对象文件的模块包含了预先编译好的程序函数，或者包含了来自标准库的函数。


    '
- fmt: "\nWhen creating a source file, it is important to note the extension which\
    \ is being applied to the filename of the source file. Generally, the type of\
    \ extension that is applied to the source file depends on the compiler being used\
    \ to create the source file. The most commonly used file extensions are `.cpp`\
    \ and `.cc`.\n\nIn some cases, the source file may require an extension file before\
    \ it can be compiled. These files are known as header files. If a source file\
    \ has corresponding header files available for the source code, then it becomes\
    \ necessary to copy the contents of the header file into the source file before\
    \ compiling it. Header files contain important data for the source file, such\
    \ as defining the types, declaring the variables, and functions. Header files\
    \ may or may not have a file extension. In cases where it does have an extension,\
    \ then it is the `.h` file extension.\n\nTo perform the steps and tasks mentioned\
    \ previously, programs use software known as a ‘compiler.’ Popular compilers nowadays\
    \ offer an IDE along as well to get started with programming right away.\n\n##\
    \ Creating a Simple C++ Program\n\nWe will now create a standard and simple C++\
    \ program. Afterward, we will proceed to discuss the coding elements used in this\
    \ program.\n\nHere’s the code for the C++ program:\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main(){\n    cout << \"Have a good day!\" << endl;\n\
    \    return 0;\n}\n```\n\nThe output of this program is a text; “Have a good day!”.\n\
    \nBefore we delve into understanding the core elements of this program, here’s\
    \ a visual representation showing the structural arrangement of the program to\
    \ establish a basic understanding.\n\n![](rsrc2Y5.jpg)\n\nFor simplification purposes,\
    \ we can say that major parts of a basic C++ program are the objects and their\
    \ corresponding ‘member functions and global functions.’ These objects and functions\
    \ are not part of any class. Apart from completing the task for which it is made,\
    \ a function also has the capability of calling other functions as well. Experienced\
    \ programmers have the choice of either creating a function by themselves or use\
    \ a function that is already available in the C++ standard library. For beginner’s\
    \ it’s recommended to only use pre-built functions from the standard library as\
    \ creating a personalized function may cause complications in the code that can\
    \ be hard to work out. However, every programmer is required to create his own\
    \ global function `main()`. This function is one of the main components of a program’s\
    \ code.\n\nThe C++ program demonstrated above contains two of the most crucial\
    \ elements of any C++ program, i.e., the `main()` function and the output string\
    \ (the message that is displayed as the output of the program).\n\nIf you look\
    \ at the first line of the code block, then you will see a hashtag symbol ‘#.’\
    \ This instructs the computer that this line of code is for the preprocessor step.\
    \ You can think of preprocessor as a preliminary phase where no object is created\
    \ yet, and code prepares for the upcoming instructions in the program. For instance,\
    \ if you want the preprocessor to copy a file into the position where it is defined\
    \ in the code of the source file, then you can use the `#` symbol to do so. This\
    \ has also been demonstrated below:\n\n```cpp\n#include <filename>\n```\n\nIn\
    \ this way, we can include header files into the source code. By doing so, the\
    \ program will be able to access the data in the header files. In the C++ program\
    \ shown above, we can see in the very first line that the header file by the name\
    \ of ‘iostream` has been included in the source code through this method. The\
    \ data contained by this file corresponds to the conventions that define input\
    \ and output streams. In other words, the information in the program is considered\
    \ as a stream of data.\n\nThe second line of code in the program refers to a namespace\
    \ known as `std`, which contains predefined names in C++. To access the contents\
    \ of this namespace, we use the `using` argument before defining the namespace.\n\
    \nThe execution of the program itself begins from carrying out the instruction\
    \ defined by the `main()` function. Hence, every C++ program needs to have the\
    \ `main()` function to execute an instruction set. However, although the `main()`\
    \ function is a global function that makes it different from other functions,\
    \ the structure of how code is implemented with the function is exactly the same\
    \ as any other typical function in C++.\n\nIn the C++ program demonstrated above,\
    \ the `main()` function contains two statements:\n\n1. `cout << \"Have a good\
    \ day!\" << endl;`\n2. `return 0;`\n"
