    \ int |\n| 100000 | 0303240 | 0x186A0 | int (32-bit)long (16-bit) |\n| 10L | 012L\
    \ | 0xAL | long |\n| 27UL | 033UL | 0x1bUL | unsigned long |\n| 2147483648 | 020000000000\
    \ | 0x80000000 | unsigned long |\n\nFrom the table shown above, you can see how\
    \ each value has been represented in different ways. Here’s an example of a program\
    \ that incorporates the integral constant concepts we have discussed so far:\n\
    \n```cpp\n// To display hexadecimal integer literals and\n// decimal integer literals.\n\
    #include <iostream>\nusing namespace std;\nint main(){\n    // cout outputs integers\
    \ as decimal integers:\n    cout << \"Value of 0xFF = \" << 0xFF << \" decimal\"\
    \ << endl;               // Output: 255 decimal\n    // The manipulator hex changes\
    \ output to hexadecimal\n    // format (dec changes to decimal format):\n    cout\
    \ << \"Value of 27 = \" << hex << 27 <<\" hexadecimal\"<< << endl;     // Output:\
    \ 1b hexadecimal\n    return 0;\n}\n```\n\n### Floating-Point Constants\n\nA floating-point\
    \ value has two elements, an integral element, and a fractional element. The fractional\
    \ part of the number is separated from the integer by a decimal point. That’s\
    \ why although floating-point values are usually represented as decimals, they\
    \ can also be represented through exponential notation as well. For example, a\
    \ typical floating-point number that is accurate up to one decimal place can be\
    \ represented as shown below: `20.7`.\n\nSimilarly, if we have a number `1.5*10-2`\
    \ then instead of inputting it in its decimal form, we can simply store it in\
    \ its exponential form as well, which would be `1.8E-2`. The arithmetic type used\
    \ to store these objects would be the `double` type by default. However, the constant\
    \ can be manually designated as a `float` type as well by adding `F` or `f` to\
    \ the value. Similarly, you can assign it to the `long double` type as well by\
    \ adding `L` or `l`.\n\nThe following table shows a few examples of how floating-point\
    \ constants can be represented in different ways.\n\n| 7.19 | 16. | 0.55 |\n|\
    \ 0.719E1 | 16.0 | .55 |\n| 0.0719e2 | .16E+2 | 5.5e-1 |\n| 719.0E-2 | 16e0 |\
    \ 55E-2 |\n\n### Character Constants\n\nA character that has been enclosed in\
    \ single quotes is identified as a character constant. Character constants are\
    \ generally assigned to the `char` type. Each character has a numerical code that\
    \ represents the character itself. For instance, in the ASCII code, the character\
    \ ‘A’ is numerically represented by the number `65`. The table shown below elaborates\
    \ a few character constants along with their decimal value in the ASCII code.\n\
    \n| Character Constant | Character | ASCII Code Decimal Value |\n| :--- | :---\
    \ | :--- |\n| ‘A’ | Capital Alphabet A | 65 |\n| ‘a’ | Small Alphabet a | 97 |\n\
    | ‘ ’ | Blank space | 32 |\n| ‘.’ | Dot | 46 |\n| ‘0’ | Numerical Digit 0 | 48\
    \ |\n| ‘\\0’ | Terminating Null Character | 0 |\n\n### String Constants\n\nWe\
    \ are already familiar with string constants as we had dealt with them in the\
    \ first chapter when we were discussing the text output for the `cout` stream\
    \ in C++ programs. Regardless, you should remember that a sequence of characters\
    \ (such as a sentence or a phrase) enclosed within double quotes is considered\
    \ as a string constant. For example, “Press the Accept button to proceed!” is\
    \ a string constant.\n\nIt is important to note that when a string sequence is\
    \ stored internally, the double quotes are not included. Instead, a terminating\
    \ null character `\\0` is placed at the end of the string sequence to indicate\
    \ that the sequence has ended. As such, apart from the bytes required to store\
    \ the individual characters, a string sequence also uses another byte to store\
    \ the terminating null character as well. That’s why string constants take up\
    \ one additional byte than their usual memory requirements. The following figure\
    \ depicts this internal representation of the string sequence “Hello!”\n\n![](rsrc2Y7.jpg)\n\
    \n### Escape Sequences\n\nAnother aspect to consider when talking about characters\
    \ in programming is those that are non-graphic or not displayed on the screen\
    \ but do have a purpose. For example, look at your keyboard and go through the\
    \ buttons that, when pressed, display a character on a word processor. As soon\
    \ as you think about it, you’ll notice that certain characters do not display\
    \ any character on the screen when pressed, such as the ‘Tab’ button, the ‘Shift’\
    \ button, and so on. Such non-graphic characters are referred to as ‘escape sequences’\
    \ and its effect depends on the device on which it is being used. For example,\
    \ the Tab escape sequence `\\t` depends on the default setting of the width space\
    \ that has been predefined, which is eight blanks.\n\nIn addition, note that every\
    \ escape sequence has a back-slash at the start of the character. The table shown\
    \ below elaborates several escape sequences along with their decimal values and\
    \ effects.\n\n| Character | Definition | ASCII Code Decimal Value |\n| :--- |\
    \ :--- | :--- |\n| \\a | alert (BEL) | 7 |\n| \\b | backspace (BS) | 8 |\n| \\\
    t | horizontal tab (HT) | 9 |\n| \\n | line feed (LF) | 10 |\n| \\v | vertical\
    \ tab (VT) | 11 |\n| \\f | form feed (FF) | 12 |\n| \\r | carriage return (CR)\
    \ | 13 |\n| \\” | \" (double quote) | 34 |\n| \\’ | ' (single quote) | 39 |\n\
    | \\? | ? (question mark) | 63 |\n| \\\\ | \\ (backslash) | 92 |\n| \\0 | string\
    \ terminating character | 0 |\n| \\ooo (up to 3 octal digits) | the numerical\
    \ value of a character | ooo (octal) |\n| \\xhh (hexadecimal digits) | the numerical\
    \ value of a character | hh (hexadecimal) |\n"
