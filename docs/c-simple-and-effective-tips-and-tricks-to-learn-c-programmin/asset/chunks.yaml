  trans: "\n然而，并不是所有的一元算术运算符都具有相同的优先级。算术运算符的优先级如下表所示：![](img/rsrc2YB.jpg)\n\n算术运算符的前缀表示法和后缀表示法的影响在以下示例程序中已得到演示：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main(){\n    int i(2),\
    \ j(8);\n    cout << i++ << endl;          // 输出: 2\n    cout << i << endl;  \
    \          // 输出: 3\n    cout << j-- << endl;          // 输出: 8\n    cout << --j\
    \ << endl;          // 输出: 6\n    return 0;\n}\n```\n\n## 一元符号运算符\n符号运算符 `+` 没有实际用处，因为它只是按原样返回操作数的值。相反，符号运算符\
    \ `–` 在反转操作数符号后返回操作数的值。\n示例：`int n = -5; cout << -n; // 输出: 5`\n\n## 增和和减运算符\n\
    增运算符用于将操作数的值增加 1。由于这个原因，它不能与常量一起使用。增运算符可以以前缀表示法或后缀表示法的形式使用。以变量 `i`，后缀表示写为 `i++`，前缀表示写为\
    \ `++i`，两者都执行 `i=i+1` 的功能。结果是 `i` 的值增加了一。\n\n尽管执行相同的操作，但后缀 `++` 和前缀 `++` 的工作方式不同。通过观察两个表达式中的值，它们之间的区别变得显而易见。当使用\
    \ `++i` 时，意味着 `i` 的值在应用之前已经增加了。相反，在 `i++` 中，保留了原始值 `i`。\n`++i` 是先增加 `i` 的值，然后进行应用。`i++`\
    \ 是先应用 `i` 的原始值，然后进行增加。\n虽然这在简单表达式中可能并不明显，但在复杂表达式中会产生显著差异。因此，在处理复杂表达式时，必须注意后缀表达式和前缀表达式之间的区别。\n\
    \n减运算符 `--` 通过通过减少 1 来改变给定变量或操作数的值。前缀和后缀表示法也可以应用于此运算符，其功能与增标记相同，只是执行操作 `i=i-1`。\n\
    \n## 优先级\n当需要评估多个运算符时，它们的顺序由运算符优先级决定，然后对运算符和操作数进行相应的分组。如果研究相反的表格，可以看到运算符 `++`\
    \ 具有最高优先级，而 “/” 的优先级高于 “-”。\n示例：`( val++ ) – ( 7.0/2.0 )`\n结果为 `1.5`，请记住 `val`\
    \ 是稍后增加的。\n\n如果任何两个或多个运算符具有相同的优先级，表达式的评估由表格的第三列决定。\n示例：`3 * 5 % 2` 等于 `(3 * 5)\
    \ % 2`。\n\n## 赋值\n我们将某个值赋给表达式或变量的过程被称为赋值。在详细讨论赋值主题之前，让我们先看看它们如何在实际的 C++ 程序中使用的：\n\
    \n```cpp\n// 复合赋值演示\n#include <iostream>\n#include <iomanip>\nusing namespace\
    \ std;\nint main(){\n    float x, y;\n    cout << \"\\n 请输入初始值：\";cin >> x;\n\
    \    cout << \"\\n 请输入增量值：\";cin >> y;\n    x += y;\n    cout << \"\\n 现在是乘法！\"\
    ;\n    cout << \"\\n 请输入一个因子：\";cin >> y;\n    x *= y;\n    cout << \"\\n 最后是除法。\"\
    ;\n    cout << \"\\n 请提供一个除数：\";cin >> y;\n    x /= y;\n    cout << \"\\n 这是 \"\
    << << \"你当前的幸运数字： // 小数点后没有\n    // 位数：\n    << fixed << setprecision(0)\n   \
    \ << x << endl;\n    return 0;\n}\n```\n\n### 简单赋值\n在给表达式赋值变量值，简单赋值使用写为 `=` 的赋值运算符。值位于赋值运算符\
    \ `=` 的右侧，而被赋值的变量在左侧。\n示例：`z = 7.5;`, `y = z;`, `x = 2.0 + 4.2 * z;`\n如示例所示，变量在左侧表示为\
    \ “x”，“y” 和 “z”；给它们的值在右侧。在评估顺序上，赋值运算符的优先级较低。在最后一个示例中可以看出，右侧的表达式首先被计算，计算产生的结果被赋值给左侧的变量。\n\
    \n赋值运算符本身可以被视为表达式，而该表达式的值就是赋值给变量的值。\n示例：`sin ( x = 2.5 );` 如示例所示，`2.5` 的值首先赋值给变量\
    \ “x”，然后作为参数传递给函数。\n\n如果使用多个赋值运算符，可以从右到左评估它们。\n示例：`i = j = 9;`\n该示例中表达式的评估从右侧开始，即值\
    \ `9` 首先赋值给 “j”，然后赋值给 “i。”\n\n### 复合赋值\n除了简单赋值，另一种运算符是复合赋值。它用于同时执行算术操作和赋值。\n示例：`i\
    \ += 3;` 等于 `i = i + 3;`\n`i *= j + 2;` 等于 `i = i * (j+2);`\n复合赋值的优先级与赋值运算符相似，设置为较低。因此，复合赋值被放在括号中，这在第二个示例中所示。\n\
    \n二元算术运算符和位运算符用于组合复合赋值，如 `+=`、`-=`、`*=`、`/=` 和 `%=`。在评估复杂操作时，赋值运算符或增(++)/减(--)会显著修改变量。这种修改被称为副作用，通常会导致错误。因此，应尽可能避免使用副作用，以防影响程序的可读性。\n\
    \n## 关系运算符\n下表显示了 C++ 中可用的所有关系运算符。\n\n| 运算符 | 意义 |\n| :--- | :--- |\n| `<` | 小于\
    \ |\n| `<=` | 小于等于 |\n| `>` | 大于 |\n| `>=` | 大于等于 |\n| `==` | 等于 |\n| `!=` | 不等于\
    \ |\n\n像一元运算符一样，关系运算符之间也有不同的优先级。这在下表中得到了突出：这里是使用关系运算符进行比较目的的简短示例：\n\n| 比较 | 结果\
    \ |\n| :--- | :--- |\n| `4 >= 5` | False |\n| `1.5 > 2.3` | False |\n| `2.9 >\
    \ 2.2` | True |\n| `2 * 10 != 18` | True |\n\n"
- fmt: "\n# The Result of Comparison\n\nThe comparison operators are `bool` type expressions\
    \ that are used to compare two values. The value may be “true,” which means the\
    \ comparison is correct, or it may be “false,” meaning the comparison is incorrect.\n\
    \nExample: `length == circuit` // false or true\n\nIn the given example, if the\
    \ number value of both `length` and `circuit` are the same, then the comparison\
    \ is correct, and the value of this comparison expression is “true.” On the other\
    \ hand, if the `length` and `circuit` have different values, then the value assigned\
    \ to this expression will be “false.”\n\nWhen comparing two individual characters,\
    \ the character set must be carefully selected because the characters are compared\
    \ based on their character codes.\n\nExample: `‘A’ < ‘a’` // true, since `65 <\
    \ 97`\n\nIn the example, the ASCII code is used, and hence, the value turns out\
    \ to be true.\n\n## Precedence of Relational Operators\n\nIn order of evaluation,\
    \ the precedence for relational operators is approximately in the middle. It is\
    \ lower than the arithmetic operators but higher than the assignment operators.\n\
    \nExample: `bool flag = index < max – 1;`\n\nAs seen in the example, the arithmetic\
    \ expression `max - 1` is evaluated first. The result is then compared with the\
    \ `index`, and finally, the value is assigned to the `flag` variable.\n\nExample:\
    \ `int result; result = length + 1 == limit;`\n\nIn this case, the operation `length\
    \ + 1` is performed before the other expressions and is then compared with the\
    \ `limit` variable. The result of this relational operation is then assigned to\
    \ the `result` variable. Due to the result type being `int` type, the value of\
    \ the end result is numerical, not true or false. So if the result is false, it\
    \ is given a value of `0`, and if the result is true, then the value is `1`.\n\
    \nIt is quite common to perform operations where the assignment operator is given\
    \ precedence, and the other operations follow after. It is achieved by enclosing\
    \ the assignment expression in parentheses.\n\nExample: `( result = length + 1\
    \ ) == limit`\n\nIn this case, the value of `length + 1` is first assigned to\
    \ the `result` variable and is compared with the limit afterward.\n\n## Logical\
    \ Operators\n\nBefore we go into a detailed discussion regarding logical operators,\
    \ here’s a truth table for the logical operators alongside examples showcasing\
    \ logical expressions. This is necessary to build background knowledge.\n\n![](rsrc2YD.jpg)\
    \ (Truth Table)!\n![](rsrc2YE.jpg)\n\nThe Boolean operators AND `&&`, OR `||`\
    \ and NOT `!` are all a part of the logical operators. The main use of these operators\
    \ is to make compound conditions as well as carry out conditional execution of\
    \ a program while relying on the multiple conditions set by the user. Similar\
    \ to relational expressions, logical expressions are checked to see if they are\
    \ correct or incorrect, and then a value between true or false is assigned to\
    \ the end result.\n\n### Operands and Order of Evaluation\n\nThe Boolean type\
    \ operators usually make use of `bool` type operands. However, arithmetic type\
    \ operands, as well as any operands that are convertible to `bool` type, are also\
    \ used. As such, if the operand used has a value of `0`, it is converted to `false`.\
    \ If its value is anything other than `0`, then it is taken as true.\n\nThe OR\
    \ operator `||` yields the relational result true if at least one of the operands\
    \ is true. If both are false, then the result will be false as well.\n\nExample:\
    \ `( length < 0.2 ) || ( length > 9.8 )`\n\nThe value of OR expression given above\
    \ will be true if the value of the `length` is less than `0.2` or greater than\
    \ `9.8`.\n\nThe value in an AND operator `&&` expression will be returned as true\
    \ only if both the operands are true and otherwise the result will be false.\n\
    \nExample: `( index < max ) && ( cin >> number)`\n\nIf, in the above expression,\
    \ the `index` is proven to be less than `max`, and the `number` is input successfully,\
    \ then the result produced by the operator will be true. On the other hand, if\
    \ the `index` is not less than `max`, the `number` will not be read or input by\
    \ the program. The logical operators AND `&&` as well as OR `||` have an order\
    \ of evaluation that is fixed.\n\nC++ starts the evaluation from left to right\
    \ and ignores the unnecessary operands, such as when the result is established\
    \ while evaluating the left operand, the right operands are not evaluated.\n\n\
    The logical operator `!` is the NOT operator that works with only one operand\
    \ located on its right. It checks the value of the operands, and if it is true,\
    \ then it will be inverted by the NOT operator, and the Boolean value will be\
    \ returned as false. Similarly, if the value of the variable `flag` is false or\
    \ `0`, then it will be returned as true. Therefore, NOT operator works by returning\
    \ the opposite value of the variable `flag` it evaluates.\n\n### Precedence of\
    \ Boolean Operators\n\nWhen considering the order of evaluation, the AND operator\
    \ `&&` is set to have higher precedence than the OR operator `||`. Both these\
    \ logical operators have higher precedence than the assignment operators and lower\
    \ than other previous operators.\n\nThe NOT operator `!`, being the unary operator,\
    \ among others, has higher precedence in the evaluation order.\n\n## Chapter 5:\
    \ Controlling the Flow of a Program\n\nIn a program, we need to control the flow\
    \ of data and information. A program that has a data flow in one continuous direction,\
    \ i.e., the flow of data is in the direction of the program’s structure, then\
    \ the resulting program is limited and one-dimensional. To increase the functionality\
    \ and capability of a program, we need to control its flow effectively. To do\
    \ this, we need to use certain statements such as loops (`while`, `for`, `do-while`),\
    \ using conditional operators (`if`, `then`, `if-else`, etc.) and jumps (`goto`,\
    \ `continue` and `break`).\n\n### The ‘While’ Statement\n\nHere’s a structural\
    \ diagram of the `while` statement.\n\n![](rsrc2YF.jpg)\n\nSimilarly, let’s first\
    \ observe a program demonstrating the use of the `while` statement for controlling\
    \ its flow and then proceed to break it down and understand it.\n\n```cpp\n//\
    \ average.cpp\n// Computing the average of numbers\n#include <iostream>\nusing\
    \ namespace std;\n\nint main(){\n    int x, count = 0;\n    float sum = 0.0;\n\
    \    cout << \"Please enter some integers:\\n\"\";\n    \"(Break with any letter)\"\
    \ << endl;\n    while( cin >> x ){\n        sum += x;\n        ++count;\n    }\n\
    \    cout << \"The average of the numbers: \" << sum / count << endl;\n    return\
    \ 0;\n}\n```\n\nThe iteration statements or loops repeat a set of instructions\
    \ that are supposed to repeat for a certain number of times. The statements or\
    \ set of instructions that are to be repeated are referred to as loops bodies.\
    \ The three language elements, namely `while`, `do-while` and `for` are the ones\
    \ responsible for expressing iteration statements. The controlling expression\
    \ is a condition that limits the number of times a loop is repeated, i.e., until\
    \ the expression is no longer true. The `while` and `for` statements verify whether\
    \ the expression is true or not before the loop body is executed. In contrast,\
    \ the `do-while` statement evaluates the controlling expression after the statement\
    \ is executed.\n\nThe syntax of `while` is:\n```\nwhile (expression)\n    statement\n\
    ```\n\n### The ‘For’ Statement\n\nJust like the previous section, let’s first\
    \ look and understand the structural diagram of the `for` statement and see how\
    \ it is actually implemented in a program.\n\n![](rsrc2YG.jpg)\n\n```cpp\n// Euro1.cpp\n\
    #include <iostream>\n#include <iomanip>\nusing namespace std;\n\nint main(){\n\
    \    double rate = 1.15; // Exchange rate\n    cout << fixed << setprecision(2);\n\
    \    cout << \"\\tEuro \\tDollar\\n\";\n    for( int euro = 1; euro <= 5; ++euro)\n\
    \        cout << \"\\t \" << euro << \"\\t \" << euro*rate << endl;\n    return\
    \ 0;\n}\n```\n\nThe output of this program is:\n```\nEuro\tDollar\n1\t1.15\n2\t\
    2.30\n3\t3.45\n4\t4.60\n5\t5.75\n```\n\n### Initializing and Reinitializing\n\n\
    ```cpp\nint count = 1; // Initialization\nwhile( count <= 10) // Controlling\n\
    {\n    cout << count << endl; // expression\n    ++count; // Reinitialization\n\
    }\n```\n\nThe expressions or elements that control the repetition of the statements\
    \ in the loop are typically placed in the loop header. You saw this in the above\
    \ example, which can be considered as a `for` statement.\n\n```cpp\nint count;\n\
    for ( count = 1; count <= 10; ++count)\n    cout << count << \". loop\" << endl\n\
    ```\n\nAny expression can control the initialization and reinitialization of a\
    \ loop in a `for` statement. Hence, the `for` statement has the following syntax:\n\
    \n```\nfor ( expression1; expression2; expression3 )\n```\n\nAs seen in the syntax,\
    \ `expression1` is executed only once at the beginning of the loop so it can be\
    \ initialized. The next expression `expression2` is evaluated before the loop\
    \ body is implemented and is the controlling expression of this statement.\n"
