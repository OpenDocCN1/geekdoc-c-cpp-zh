    *   `bool`, `short`, `signed char` 和 `unsigned char`。包含这些类型的表达式会被转换为 `int` 类型。

    *   如果一个表达式是 `unsigned short` 类型，那么只有当它的值大于 `unsigned short` 时，才会被转换为 `int` 类型。如果
    `int` 不大于 `unsigned short` 类型，则它将像其他情况一样转换为 `unsigned int`。


    简而言之，C++ 在涉及计算的运算中始终会优先考虑 `int` 类型的值。例如，假设我们正在比较一个 `char` 变量 `f` 和值‘b’，这些值在执行诸如
    `c < ''a''` 的计算之前，会先被转换为 `int` 类型。


    # 常见的算术类型转换


    在某些情况下，即使在执行整数提升类型转换后，操作操作数的算术类型仍然不同，此时我们需要使用 `int` 类型层级执行隐式类型转换。突出显示这种隐式类型转换的图表之前已经过，这里回顾一下层级类型转换的含义。![](img/rsrc2YR.jpg)


    在整数提升之后，进一步使用类型层级进行隐式类型转换时，我们主要将两个操作数转换为层级中位置最高的类型。当执行这两种隐式类型转换（整数提升和类型层级）时，它们被统称为“常规算术类型转换”。例如，仔细评估下面所示的类型转换：


    ```cpp

    short size(512); double res, x = 1.5;

    res = size / 10 * x; // short -> int -> double

    ```


    在这个示例中，我们正在执行两个数学操作，即除法和乘法。变量 `size` 的原始类型是 `short`。在执行 `size/10` 中的除法操作之前，`size`
    变量的类型从 `short` 提升为 `int`。一旦我们该操作的结果（结果为 50），该结果的类型通过层级隐式类型转换进一步转换为 `double` 类型。只有当结果的类型转换为
    `double` 后，才能与 `x` 执行乘法操作。这是因为 `x` 的值是 `double` 类型，而整数除法产生的值是 `int` 类型。


    通常，“常规算术类型转换”最常用于条件运算符（如 `(?:)`）和所有的二元运算。然而，常规算术类型转换的唯一条件是对应的操作数应该是算术类型。现在让我们来讨论少数可以应用常规算术类型转换的案例。


    ## 1. 有符号整数的转换


    众所周知，整数可以指正数也可以指负数，因此我们需要处理有符号整数转换的两种状态。下面的图准确地演示并详述了正数的转换。![](img/rsrc2YS.jpg)


    对于负数（整数）的转换，例如 `-10`，我们首先需要计算这个二进制数的位模式，然后生成一个对应的二进制补码。这一过程在下方所示：![](img/rsrc2YT.jpg)


    需要注意的是，如果类型是 `unsigned`，那么负数值的解释可能会发生变化。在接下来的章节中，我们将讨论相对于特定类型的不同类型转换的程序。


    ## 2. 无符号类型转换为更大的整数类型


    为了将 `unsigned` 类型转换为更大的整数类型，我们需要执行一个被称为“零扩展（Zero extension）”的过程。在零扩展中，我们获取想要转换的数字并计算其位模式。一旦计算出位模式，我们只需扩展该位模式以匹配其所转换的类型。这是通过简单地在位模式的左侧添加零来实现的。换句话说，零扩展过程涉及通过向数字的位模式添加零来将其扩展，使其尺寸匹配目标类型。例如：`unsigned
    char` 转 `int` 或 `unsigned int`。


    ## 3. 有符号类型转换为更大的整数类型


    首先，我们讨论新类型也是 `signed` 的情况。为了表示有符号整数，我们需要生成对应数字的二进制补码。为了在这种情况下保留数字的原始值，我们需要执行一个被称为“符号扩展（Sign
    extension）”的过程。在符号扩展过程中，通过从左侧填充符号位来扩展整数的原始位模式。例如：`char` 转 `int`，`short` 转 `long`。


    通过这种方式，位模式被被扩展以匹配目标类型的长度。这一过程在之前的图中也描述过。


    现在让我们讨论新类型为 `unsigned` 的场景。在处理此类整数时，负数的原始值无法被保留或保持。然而，如果我们想要转换的数字的类型具有相同位位模式，那么位模式将被保留，因为不需要进行位模式扩展。但即使位模式被保留，也不意味着它将以相同的方式被解释。在这种情况下，符号位将变得无关紧要，即它将失去重要性。因此，如果类型转换目标比原始类型长，则执行符号扩展以生成一个新的位模式，然后该位模式被解释为无符号。例如：`char`
    转 `unsigned int`，`long` 转 `unsigned long`。


    ## 4. 整数类型转换为浮点类型


    在这种类型转换中，数字的原始值被保留，同时转换为带有指数的浮点数。然而，在某些情况下，原始数字在转换过程中可能会被舍入。这在将 `long` 或 `unsigned
    long` 类型的值转换为 `float` 类型时显而易见。例如：`int` 转 `double`，`unsigned long` 转 `float`。


    ## 5. 浮点类型转换为更大的浮点类型


