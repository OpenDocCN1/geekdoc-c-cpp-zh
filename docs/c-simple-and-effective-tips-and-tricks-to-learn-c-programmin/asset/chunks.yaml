  trans: "\n乍看之下，我们可以看到两个表格中显示的头文件有一个关键区别，那就是包含了 `.h` 扩展名。这是因为在 C 语言中，头文件是用 `.h` 扩展名标识的。然而，C++\
    \ 头文件并非如此，因为它们的声明都包含在各自的命名空间 `std` 中。但是，重要的是向程序指定你将在全局范围内使用 `std` 命名空间来引用标识符。否则，如果不使用\
    \ `using` 指令，编译器将无法识别 `cin` 和 `cout` 流。\n\n在这种情况下，编译器无法识别 `cin` 和 `cout` 流。\n\n\
    ```cpp\n#include <iostream>\n#include <string>\nusing namespace std;\n```\n\n\
    通过添加 `using namespace std` 指令，程序现在可以轻松地识别和使用 `cin` 和 `cout` 流，而无需任何额外的语法。请注意，此演示还添加了\
    \ `string` 头文件。这将允许程序在 C++ 中轻松地执行字符串操作任务。\n\n# C 编程语言头文件\n\nC++ 编程语言已经采用并整合了 C\
    \ 编程语言的所有标准库，使得 C++ 程序可以使用它们。因此，头文件也不例外。最初为 C 编程语言标准化的头文件也被 C++ 编程语言所采用。例如，我们可以通过下所示的语句在\
    \ C++ 中使用 C 语言的标准数学库：\n\n```cpp\n#include <math.h>\n```\n\n虽然我们可以使用标准 C 库，但有一个可能会导致严重问题的复杂情况。当使用\
    \ C 头文件时，该文件中声明的标识符将变为全局可见。这在大型编程项目中可能会导致复杂性。为了解决这个问题，我们在 C++ 中简单地在 C 头文件之外额外使用另一个头文件。这个额外的头文件在\
    \ `std` 命名空间中声明了这些标识符，从而解决了标识符冲突的问题。例如，如果我们在 C++ 中使用 `math.h` 库，我们将配合另一个名为 `cmath`\
    \ 的头文件。这个 `cmath` 库包含了 `math.h` 库声明的所有数据，但区别在于 `cmath` 中的标识符已经在 `std` 命名空间中声明。下面演示了：\n\
    \n```cpp\n#include <cmath>\nusing namespace std;\n```\n\n在讨论头文件时，需要澄清的一个重要点是，`string`\
    \ 头文件与 `string.h` 或 `cstring` 提供的功能不同。`string` 头文件只定义了 `string` 类，而 `string.h`\
    \ 或 `cstring` 头文件声明了 C 编程语言中用于处理字符串数据的函数和变量。简单来说，`string.h` 和 `cstring` 头文件允许用户访问\
    \ C 字符串库的功能，而 `string` 头文件的唯一目的是定义 `string` 类。\n\n这里是一个展示在 C++ 程序中使用两个头文件（即 `iostream`\
    \ 和 `string`）的示例：\n\n```cpp\n// 使用字符串。\n#include <iostream>      // cin, cout\
    \ 的声明\n#include <string>         // class string 类的声明\nusing namespace std;\n\n\
    int main(){\n    // 定义了四个字符串：\n    string prompt(\"What is your name: \"),name,\
    \               // 一个空行\n    line(40, '-'),                      // 包含 40 个 '-'的字符串\n\
    \    total = \"Hello \";                   // 是可以的！\n    cout << prompt;     \
    \                // 请求输入。\n    getline( cin, name);                // 在行内输入名字\n\
    \    total = total + name;               // 拼接并赋值字符串。\n    cout << line << endl;\
    \                // 输出 line 和 name\n    cout << total << endl;\n    cout << \"\
    \ Your name is \"             // 输出长度\n    << name.length() << \" characters long!\"\
    \ << endl;\n    cout << line << endl;\n    return 0;\n}\n```\n\n此示例使用 `cout` 和\
    \ `<<` 语句打印字符串。该程序要求用户输入名字，然后继续显示其输入的名字以及该名字中包含的字符数。\n\nWhat is your name: Zoldyck\
    \ Killua\n---------------------------------------\nHello Zoldyck Killua\nYour\
    \ name is 13 characters long!\n---------------------------------------\n\n# 在\
    \ C++ 中使用类\n\n从上面的示例可以看出，它将 `string` 类整合到了其核心功能中。在 C++ 标准库中，预先定义了多个类。这些类对于 C++\
    \ 程序的基础至关重要。它们包括流类（`iostream`）以及有效地帮助程序表示字符串和产生错误的条件的类。\n\n尽管有许多可用的类，但每个类就表示其属性和能力的各自类型而言都是唯一的。虽然每个类都是唯一的，但无论它们是预定义类还是程序员自定义设计的类，它们的属性和能力仍然受两个主要方面的影响：\n\
    \n- 类的数据成员负责定义其对应类的属性。\n- 类的方法（属于类的函数。这些函数与类的成员协作以执行操作）定义了类的能力。类的方法通常也称为成员函数。\n"
- fmt: "\n# Creating Objects of a Class\n\nObjects are variables that are assigned\
    \ the class type itself. For instance, if we create an object for a string class,\
    \ then the variable will have the string type accompanying it. This has been demonstrated\
    \ in the example shown below:\n\n```cpp\nstring s(\"I am an object of the string\
    \ class\");\n```\n\nWhenever an object is created, it is allocated memory for\
    \ its data members and then initialized with its corresponding values. In the\
    \ example shown above, you can see that the variable `s` is of the string class\
    \ type.\n\nAn `Object` is also termed as an instance of the corresponding class\
    \ it represents. Take the statement shown above as an example. The object `s`\
    \ can also be referred to as an instance of the string class. The object is followed\
    \ by a string constant (I am an object of the string class) and is ultimately\
    \ defined and initialized in this way.\n\n# Calling Methods\n\nIn a class, all\
    \ the methods that have been defined as ‘public’ can be called by an object of\
    \ this particular class. We must not confuse calling a public method with calling\
    \ a global function. Although both share some basic similarities, however, there\
    \ is one aspect that acts as a major differentiating factor between methods and\
    \ functions. This aspect is that unlike global functions that can be used by multiple\
    \ statements of the program in which it is defined, a public method can only be\
    \ called for one particular object at a time only. A typical set up of a method\
    \ and an object is shown below:\n\n```cpp\ns.length(); // object.method();\n```\n\
    \nIn this statement, the `length()` is the method for the object `s`. The main\
    \ purpose of this method is to provide information regarding the total number\
    \ of characters in the string. This has already been demonstrated in the program\
    \ shown in the previous section. Instead of the `s` object, we can see that the\
    \ `length()` method is being used with the name object.\n\n# Global Functions\
    \ and Classes\n\nA function that has been defined globally can be used by some\
    \ classes as well. A global function being used by a class mainly executes certain\
    \ operations for the class’s objects, which have been passed as arguments to the\
    \ function. For example, consider the following statement, which features a global\
    \ function `getline()`. This has been used with an object `s` (which has been\
    \ passed to the function as an argument):\n\n```cpp\ngetline(cin, s);\n```\n\n\
    The global function executes an operation to store a line of keyboard input as\
    \ a string. In this way, by pressing the return key, a new line character will\
    \ be created by the `\\n` escape character, but this line will not be stored in\
    \ a string.\n\n# Chapter 4: Operators For Fundamental Types\n\nIn this chapter,\
    \ we will introduce those operators that are essential for performing calculations\
    \ as well as selections for fundamental data types. Operators are similar to functions,\
    \ but their syntax is quite different. Operators tools for performing specific\
    \ operations such as arithmetic operations, comparison operations and logical\
    \ operations, etc. We will be discussing some of the most basic operators used\
    \ for fundamental programming.\n\n## Binary Arithmetic Operators\n\nTo make a\
    \ program capable of processing the data input, the operations required for the\
    \ process need to be defined. The execution of selective operations depends on\
    \ the type of data being processed, such as adding, multiplying, or comparing\
    \ numbers. However, multiplying strings would not be logical.\n\nThe most important\
    \ operators, including unary and binary operators that are used for arithmetic\
    \ processing, are discussed in the following section. Only one operand is used\
    \ in unary operators while two are specified for the binary operators. Here’s\
    \ a diagram demonstrating a typical binary operator and operands.\n\n![](rsrc2YA.jpg)\n\
    \nFor further conceptual clarification, a table listing the fundamental binary\
    \ operators has been outlined below:\n\n| Operator | Significance |\n| :--- |\
    \ :--- |\n| + | Addition |\n| - | Subtraction |\n| * | Multiplication |\n| / |\
    \ Division |\n| % | Remainder |\n\nHere’s a program demonstrating the use of binary\
    \ operators:\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main(){\n\
    \    double x, y;\n    cout << \"\\nEnter two floating-point values: \";\n   \
    \ cin >> x >> y;\n    cout << \"The average of the two numbers is: \"<< (x + y)/2.0\
    \ << endl;\n    return 0;\n}\n```\n\nWhen executing this program, we will be given\
    \ the following result:\n`Enter two floating-point values: 4.75 12.3456`\n`The\
    \ average of the two numbers is: 8.5478`\n\nThe system can perform calculations\
    \ with the help of arithmetic operators.\n\n*   In case of using integral operands\
    \ to perform divisions, integral results will be produced. For instance, the computation\
    \ of `7/2` will result in `3`. Furthermore, one or more than one floating-point\
    \ number operands will produce a result in the form of a floating-point number.\
    \ For example, if `7.0/2` is calculated, the exact result will be `3.5`.\n*  \
    \ Integral Operands are the only ones that can make use of the remainder division,\
    \ which is used to return the remainder of an integral division, e.g., `7%2` would\
    \ produce the result `1`.\n\n## Expressions\n\nSimple expressions consist of only\
    \ one constant, variable, or a function call, but when they are used as operands\
    \ of operators, they form complex expressions. As such, an expression is usually\
    \ a combination of operators and operands.\n\nWhen utilized, all of the expressions\
    \ return values except for those that feature a void type. The operands define\
    \ the expressions in arithmetic calculations.\n\nExamples:\n```cpp\nint a(4);\n\
    double x(7.9);\na * 512      // Type int\n1.0 + sin(x)  // Type double\nx – 3\
    \        // Type double, since one operand is of type double\n```\n\nIf an expression\
    \ is correctly used, it can act as an operand in another expression as well.\n\
    Example:\n```cpp\n2 + 7 * 3    // Adds 2 and 21\n```\n\nWhen an expression is\
    \ evaluated, the mathematical rules of multiplication before addition apply. So,\
    \ the operators `*`, `/`, and `%` are given priority to `+` and `-`. In the example\
    \ provided above, the calculation `7*3` is performed first, and then two is added\
    \ to it. On the other hand, the precedence order can be changed by inserting parentheses\
    \ to the calculation that should be performed first.\n\nExample:\n```cpp\n(2 +\
    \ 7) * 3 // Multiplies 9 by 3\n```\n\n## Unary Arithmetic Operators\n\nThe total\
    \ number of unary arithmetic operators is four:\n\n*   The Unary sign operator\
    \ `+`\n*   The Unary sign operator `–`\n*   The increment operator `++`\n*   The\
    \ decrement operator `--`\n"
