  trans: "\n这样的结构构成了一个函数原型。下面展示了一个函数定义的示例：\n\n```cpp\nint toupper(int);\ndouble pow(double,\
    \ double);\n```\n\n以下语句告诉编译器，函数的名称为 `toupper()`，其类型为 `int`。由于它是一个 `int` 类型的函数，它返回的值也将是\
    \ `int` 类型。参数的类型也是 `int`，因此该函数期望一个 `int` 类型的输入参数。\n\n同样地，第二个函数的名称是 `pow()`，其类型为\
    \ `double`。它有两个参数，且两个都是 `double` 类型，这意味着当调用此函数时，需要向它传递两个上述类型的 `double` 参数。我们也可以在这类函数原型后面跟上名称，但编译器会将这些名称视为注释。\n\
    \n现在，让我们来讨论另一种情况，即函数已经在我们程序包含的头文件中声明了。例如，如下函数原型所示：\n```cpp\nint toupper(int c);\n\
    double pow(double base, double exponent);\n```\n对于编译器来说，这与之前演示的函数原型是一样的。如果该函数已经在头文件中声明（该头文件在最初通过\
    \ `#include` 指令添加到程序中），我们就可以立即使用该函数而无需再次声明。例如，如果我们包含了 C++ 数学库 `cmath`，那么我们就可以立即使用标准数学函数。下面的程序演示了包含此库以立即使用数学函数：\n\
    \n```cpp\n// 使用标准函数 pow()\n// 计算次方\n#include <iostream>        // cout 的声明\n#include\
    \ <cmath>           // pow() 的原型，因此：\n// double pow( double, double);\nusing namespace\
    \ std;\nint main(){\n    double x = 2.5, y;\n    // 通过原型，编译器会生成\n    // 正确的调用或错误信息！\n\
    \    // 计算 x 的 3 次：\n    y = pow(\"x\", 3.0);      // 错误！字符串不是数字\n    y = pow(x\
    \ + 3.0);      // 错误！只有一个参数\n    y = pow(x, 3.0);       // 确！\n    y = pow(x,\
    \ 3);         // OK！编译器将\n    // int 值 3 转换为 double。\n    cout << \"2.5 raised\
    \ to 3 yields: \"<< << y << endl;\n    // 使用 pow() 计算是可能的：\n    cout << \"2 +\
    \ (5 raised to the power 2.5) yields: \"<< << 2.0 + pow(5.0, x) << endl;\n   \
    \ return 0;\n}\n```\n该程序的输出将是：\n2.5 raised to power 3 yields: 15.625\n2 + (5 raised\
    \ to the power 2.5) yields: 57.9017\n\n## 函数调用\n\n函数调用是利用函数的属性和结果，并将其传递给上述调用该函数的变量。例如：\n\
    ```cpp\ny = pow( x, 2.0);\n```\n在这个示例中，变量 `y` 正在调用 `pow()` 函数。函数的结果是 $x²$，然后这个指数幂被赋值给调用\
    \ `pow()` 函数的变量 `y`。简单来说，函数调用代表一个值。由于我们只是在表示一个值，我们也可以在函数调用中使用一些其他数学运算法，如加法、减法和乘法等。例如，我们可以对双精度值的函数调用进行加法计算，如下所示：\n\
    ```cpp\ncout << 2.0 + pow( 5.0, x);\n```\n在此条语句中，`2.0` 的值与 `pow()` 函数返回的值相加。之后，`cout`\
    \ 参数将此结果作为语句的最终输出显示。\n\n需要记住，尽管任何类型的表达式（无论是常量还是数学表达式）都可以作为参数传递给函数，但我们必须确保传递的参数是函数期望的类型。换句话说，所传递的参数类型应该与函数最初定义时指定的类型一致。\n\
    \n为了确保参数的类型确实正确，编译器会参考函数原型来双重检查输入参数中指定的类型。在编译器识别出函数原型中最初定义的类型与输入的参数类型相匹配的情况下，编译器会尝试将其转换为所需的类型。但这并不总是可能的，因此类型转换只有在可行时才能发生。这在之前显示的程序代码中已经证明：\n\
    ```cpp\ny = pow( x, 3); // 也是 OK！\n```\n注意，编译器期望的是 `double` 类型的值而不是 `int` 类型的值（`3`）。由于参数的类型与函数原型不匹配，编译器执行了\
    \ `int` 到 `double` 的类型转换。然而，如果输入的参数数量多于或少于函数原型指定的数量，或者编译器无法执行类型转换，它将简单地返回错误信息。此时，你可以轻松地指出错误来源并在程序开发阶段修复它，从而避免处理运行时错误。\n\
    \n在接下来的示例中：\n```cpp\nfloat x = pow(3.0 + 4.7); // 错误！\n```\n编译器识别出使用的参数数量不符合函数原型的结构。此外，函数的返回值为\
    \ `double` 类型，无法赋值给 `float` 类型，因此这种情况下编译器将直接生成错误。\n\n## 无返回值的函数\n\n在大多数情况下，函数调用的目的是为了将其返回给调用该函数的变量。然而，我们也可以创建一个执行任务但不一定向调用它的变量返回任何值的函数。对于此类目的，我们对函数使用\
    \ `void` 类型。\n\n为了演示无返回值的函数调用，让我们先查看下面的语句：\n```cpp\nvoid srand( unsigned int seed\
    \ );\n```\n在这个示例，我们看到使用 `srand()` 来生成随机数。该函数通过初始化一个产生输出随机数的算法来实现这一点。由于该函数不返回具体的值，我们将其分配为\
    \ `void` 类型。函数的参数显示我们正在使用 `unsigned int` 值，该值将被传递给函数使用。该值作为函数将产生的随机数的种子，使其能够生成一系列随机数。\n\
    \n现在我们已经讨论了不返回值的函数，让我们讨论一个不期望参数的函数。如果我们定义函数时没有指定任何参数，那么程序员必须将此函数原型声明为 `void`。或者，我们也可以在括号中留空参数空间。如下所示：\n\
    ```cpp\nint rand( void ); // 或 int rand();\n```\n"
- fmt: '

    - Header files containing the declared functions and macros being used in the
    program should always be included at the beginning of the program’s source code.
    If not, the compiler will not be able to refer to the function prototypes when
    executing the functions in the program itself.

    - Multiple header files cannot be included with a single `#include` directive.
    If we want to add more than one header file into the program, then we will have
    to use separate `#include` directives to do so, as shown in the diagram.

    - The name of the header file should be properly written (taking note of the upper
    and lower case along with any punctuation) when being declared by the `#include`
    directive. The header file’s name can be either enclosed in angled brackets `<>`
    or in double-quotes `"`, as shown in the diagram.


    ## Searching for Header Files


    Usually, whenever you include a header file, it gets automatically stored in a
    separate folder in your files directory. The directory where the header file that
    has been added to the program is stored is known as `include`. If you want to
    make changes to the header file or want to access it manually to use it with another
    project, then you first need to refer to the method you used to include it into
    the current project. If you have used angle brackets `<>` to include the header
    file, then it will be in the include directory. However, since most of the programmers
    using C++ create their own header files, they usually store it in the same folder
    where the project is stored. In such cases where the header file is not in the
    include directory, then you will need to add it to the source code file using
    double quotes `""`. Similarly, if a header file has been included in the program’s
    source code using double quotes, then you need to search the project folder itself
    to find the header file.


    ## Standard Class Definitions in Header Files


    By now, we know that a header file contains important data such as function prototypes
    that help the programmer to code functions with ease efficiently. However, a header
    file is not that one-dimensional. It can store other important programming data
    as well such, as one which we will discuss in this section, standard classes that
    have already been defined. Programmers can include objects and define classes
    inside the header file and use them in their program just as how they would use
    function prototypes. So, any class and object that has been defined in the header
    file, the program can access and use this data to execute tasks.


    ```cpp#include <iostream>

    using namespace std;

    ```


    In this example, you can see two statements. Our concern is with the first statement
    only, i.e., the inclusion of the `istream` and `ostream` classes in the program.
    By adding the header file containing these classes, the program becomes capable
    of using the `cin` and `cout` streams. This is because `cin` is an object that
    belongs to the `istream` class, and similarly, `cout` is an object that belongs
    to the `ostream` class.


    ## Using Standard Header Files


    The table shown below highlights some of the header files that include standard
    C++ libraries.


    | algorithm | ios | map | stack |

    | :--- | :--- | :--- | :--- |

    | bitset | iosfwd | memory | stdexcept |

    | iomanip | locale | ssstream | vector |

    | complex | iostream | new | streambuf |

    | functional | list | set | valarray |

    | dequeue | istream | numeric | string |

    | fstream | limits | queue | utility |

    | exception | iterator | ostream | typeinfo |


    Since C++ can use most of the libraries used by standard C, here’s a list of header
    files that include C standard libraries.


    | assert.h | limits.h | stdarg.h | time.h |

    | :--- | :--- | :--- | :--- |

    | ctype.h | locale.h | stddef.h | wchar.h |

    | errno.h | math.h | stdio.h | wctype.h |

    | float.h | setjmp.h | stdlib.h | ios646.h |

    | signal.h | string.h | | |

