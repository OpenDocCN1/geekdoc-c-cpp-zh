    *   `bool`, `short`, `signed char` and `unsigned char`. Expressions containing
    these types are converted to the `int` type.

    *   If an expression is an `unsigned short` type, then it is converted to the
    `int` type only if it is bigger than the `unsigned short`. If the `int` is not
    greater than the `unsigned short` type, then it will be converted to `unsigned
    int` as well as in other cases.


    In short, C++ will always prioritize the `int` type values in operations that
    involve calculations. For example, let’s say that we are comparing a `char` variable
    `f` and the value ‘b,’ these values will be first converted to the `int` type
