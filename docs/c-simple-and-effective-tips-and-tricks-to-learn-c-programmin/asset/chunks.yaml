    # Some of the Usual Arithmetic Type Conversions


    In some cases where we end up with operands that differ in arithmetic types even
    after performing integer promotion type conversion, we will need to perform an
    implicit type conversion using `int` type hierarchy. The diagram highlighting
    this implicit type conversion has already been shown previously, here’s a reminder
    of what hierarchy type conversion refers to.![](rsrc2YR.jpg)


    When further performing an implicit type conversion using type hierarchy after
    integer promotion, we mainly convert the two operands into a type that holds the
    highest position in the hierarchy. When these two implicit type conversions (integer
    promotion and type hierarchy) are performed, they are collectively known as “Usual
    Arithmetic Type Conversions.” For example, carefully assess the type conversion
    shown below:


    ```cpp

    short size(512); double res, x = 1.5;

    res = size / 10 * x; // short -> int -> double

    ```


    In this example, we are performing two mathematical operations, i.e., division,
    and multiplication. The original type of the `size` variable is `short`. Before
    we can perform the division operation in `size/10`, the type of the `size` variable
    is promoted from `short` to `int`. Once we obtain the result of this operation
    (which would be 50), the type of this result is further converted to the `double`
    type by implicit type conversion of hierarchy. Once the type of the result is
    converted to `double`, only then can we perform the multiplication operation with
    `x`. This is because the value of `x` is of a `double` type, and the resulting
    value of the integer division is of the `int` type.


    Generally, ‘Usual Arithmetic Type Conversions’ are most often sought to be performed
    on conditional operators such as `(?:)` and all of the binary operations. However,
    the only condition specified for the Usual Arithmetic type conversions is that
    the corresponding operands should be of the Arithmetic type. Now let’s discuss
    a few cases where we can apply the Usual Arithmetic Type Conversions.


    ## 1. Converting Signed Integers


    As we know that an integer can refer to either a positive number or a negative
    number, hence we will need to address both states of signed integer conversions.
    The figure shown below accurately demonstrates and elaborates on the conversion
    of a positive number.![](rsrc2YS.jpg)


    For the conversion of negative numbers (integers), for instance, `-10`, we first
    need to calculate this binary number’s bit pattern and then generate a corresponding
    binary complement. This process has been demonstrated below:![](rsrc2YT.jpg)


    It is important to remember that the interpretation of the value of a negative
    number is subject to change if the type is `unsigned`. In the following sections,
    we will discuss the varying procedures for type conversions relative to specific
    types.


    ## 2. Conversion of an Unsigned Type to a Larger Integral Type


    For converting an `unsigned` type to a larger integral type, we will need to perform
    a process known as ‘Zero extension.’ In zero extension, we take the number that
    we want to convert and calculate its bit pattern. Once the bit pattern has been
    calculated, we simply expand the bit pattern to make it match the type in which
    it is being converted. This is done by simply adding zeroes to the bit pattern
    from the left-hand side. In other words, the zero extension process involves the
    expansion of a number’s bit pattern by adding zeroes to it, to make its size match
    the destination type. For example: `unsigned char` to `int` or `unsigned int`.


    ## 3. Conversion of a Signed Type to a Larger Integral Type


    First, we will talk about the case where the new type is also `signed`. To represent
    signed integers, we need to generate a binary complement of the corresponding
    numbers. To preserve the original value of the numbers in such cases, we need
    to perform a process known as ‘Sign extension.’ In the sign extension process,
    we expand the integer’s original bit pattern by padding the sign bit from the
    left direction. For example: `char` to `int`, `short` to `long`.


    In this way, the bit pattern is expanded to match the length of the destination
    type. This process has also been depicted in the figures shown previously.


    Now let’s talk about the scenario where the new type is `unsigned`. When dealing
    with such integers, the original value of the negative number cannot be preserved
    or retained. However, if the type in which we want to convert the number has a
    bit pattern that is of the same length, then the bit pattern is retained as there
    is no need to perform bit pattern extensions. But even if the bit pattern is retained,
    this does not mean that it will be interpreted the same way. In such cases, the
    sign bit will become insignificant, i.e., it will lose its significance. So, if
    the type convert destination is longer than the original type, then a sign extension
    is performed to generate a new bit pattern, and this bit pattern is then interpreted
    as unsigned. For example: `char` to `unsigned int`, `long` to `unsigned long`.


    ## 4. Conversion of an Integral Type to a Floating-Point Type


    In this type of conversion, the original value of the number is preserved while
    being converted into a floating-point number featuring an exponent. However, there
    are cases where the original number may be rounded-off during conversion. This
    is evident when converting a value of the `long` or `unsigned long` type to a
    `float` type value. For example: `int` to `double`, `unsigned long` to `float`.


    ## 5. Conversion of a Floating-Point Type to a Bigger Floating-Point Type

