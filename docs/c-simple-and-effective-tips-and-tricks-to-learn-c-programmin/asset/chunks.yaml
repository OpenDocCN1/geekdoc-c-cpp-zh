    Now let’s discuss and clarify the concept of ‘Accuracy’ in floating-point numbers.
    In numerical representation, the more numbers a value has after decimal points,
    the more accurate it is. In other words, high accuracy means that the floating-point
    value has a higher amount of numbers coming after the decimal point. Similarly,
    low accuracy means that the floating-point value has fewer numbers after the decimal
    point. For example, the floating-point number `22.123456` has a higher accuracy
    as compared to the floating-point number `22.123`.


    Now we must understand how is this concept of ‘Accuracy’ leveraged by programmers.
    when we have a number that is accurate up to six decimal places, we can store
    the same value as a separate and distinguishable number as long as it differs
    from the original number up to at least one decimal place. However, the same convention
    does not necessarily always hold true if we try to store a number that is accurate
    up to 5 decimal places along with the same number that is accurate up to 4 decimal
    places as separate numbers in a floating-type of 6 decimal place accuracy. To
    clarify, there’s no guarantee that the two numbers `22.12345` and `22.1234` will
    have different decimal places when their accuracy is brought up to 6 decimal places.


    In cases where it becomes crucial for your program to represent a floating-point
    number in an accuracy that is strictly supported by a particular device or system,
    it is recommended to first refer to the values that have been defined in the header
    file named `cfloat`.


    In conclusion, there are mathematical representations of data that are handled
    primarily by two data types. Depending on the arithmetic nature of the value (integer
    or a number with decimal points), it can be either stored in the integral type
    or the floating-point type. A recap of all the corresponding types has been listed
    below.


    ### Integral Data Types

    - `bool`

    - `char`, `signed char`, `unsigned char`, `wchar_t`

    - `short`, `unsigned short`

    - `int`, `unsigned int`

    - `long`, `unsigned long`


    ### Floating-Point Data Types

    - `float`

    - `double`

    - `long double`


    The Institute of Electrical and Electronic Engineering, also referred to as IEEE,
    has provided the field of computer programming with a universal format that is
    used to represent the floating-point types. The following table briefly discusses
    this format representation.


    | Type | Memory | Range of Values | Lowest Positive Value | Decimal Accuracy |

    | :--- | :--- | :--- | :--- | :--- |

    | Float | 4 bytes | –3.4E+38 | 1.2E—38 | 6 digits |

    | Double | 8 bytes | –1.7E+308 | 2.3E—308 | 15 digits |

    | long double | 10 bytes | –1.1E+4932 | 3.4E—4932 | 19 digits |


    In the following sections, we will briefly discuss the operator `sizeof` and talk
    about the classification of data types according to the nature of the object they
    represent.


    ### The ‘sizeof’ Operator

    When we need to confirm the required memory to store a certain type of object,
    we simply use the `sizeof` operator for this purpose. For instance, if we use
    this operator as shown below:


    ```

    sizeof (name of the object)

    ```

    the program will tell us the memory necessary for storing the object. In other
    words, the operator `sizeof` provides the object’s memory requirements while the
    `name` parameter defines the object itself, or it’s the corresponding type. For
    instance, by inputting the proper data into the above parameter, let’s say `sizeof(int)`.
    If you remember that the `int` type is adjusted itself according to the system,
    then you will also understand as to why the `sizeof` operator gives different
    values depending on the system (it can be either 2 or 4). Similarly, if we use
    this operator for floating-point type, i.e., `sizeof(float)`, then we will be
    given a value of 4 representing the memory required to store the object.


    ### Classification

    Based on the nature of the object, we can classify two of the three fundamental
    data types (integer types and floating-point types) as arithmetic data types as
    we can perform arithmetic calculations on the variables of these types using arithmetic
    operators.


    Until now, we have discussed objects that represented values and classified them
    accordingly. However, there are also those objects that do not represent any value,
    for example, a function. To classify such expressions, we simply represent them
    through the `void` type. In other words, the `void` type includes those expressions
    that do not represent any value. As such, a typical function call can be represented
    by a void type.


    ### The Fundamental Constants

    A constant is also referred to as a “literal .”. We deal with constants throughout
    programming, even if you don’t know about them. For instance, we just learned
    about the Boolean data type. A Boolean value can be either 1 or 0, i.e., True
    or False. The keyword here `True` and `False` are both Boolean constants. Similarly,
    every number, character, and even a string (sequence of characters) is a ‘constant.’


    Constants are directly related to data types. The very basic purpose of a constant
    is to represent values, which in turn represents the type. Hence, depending on
    how the constant is being used, we can define the type of the value accordingly.
    Based on the above discussion, we can conclude that there are four fundamental
    constants in C++. These constants are:


    1. Boolean constants

    2. Numerical constants

    3. Character constants

    4. String constants


    We will now discuss each fundamental constant separately.


    #### 1. Boolean Constants

    A Boolean constant is a keyword used to represent either of the two possible values.
    `True` and `False` are both Boolean constants. Boolean constants belong to the
    `bool` type and can be used to set up conditionals within a program or even set
    flags that functions to represent the two states.


    #### 2. Integral Constants

    Standard decimal, octal, or even hexadecimal numbers are referred to as integral
    constants. Let’s briefly discuss these three numbers and how they can be distinguished
    from each other.


    - A decimal constant is a number belonging to the decimal number system (base
    10). A decimal number never begins with a zero. `110`, `124020` are both decimal
    numbers.

    - An octal constant is a number belonging to the octal number system (base 8).
    An octal number always begins with a zero as the leading digit. For instance,
    `088` and `022445` are both octal numbers and are referred to as octal constants.

    - A hexadecimal constant is a number belonging to the hexadecimal number system
    (base 16). A hexadecimal number always begins with a character pair. This character
    pair can be either “0x” or “0X”. For instance, `0x224A` and `0X21b4F` are both
    hexadecimal numbers. The Alphabetical numbers represent digits greater than nine
    up to 15 (for example, A represents 10, B represents 11 and F represents 15).
    There is no uppercase or lower-case capitalization imposed on hexadecimal numbers.


    Usually, integral constants are assigned to the `int` type. However, if the constant
    value turns out to be too large for the `int` type to handle, then a type that
    is suitable to deal with that value will be used instead. Regardless, it is important
    to know the ranking of the integral types:


    1. `int`

    2. `long`

    3. `unsigned long`


    To designate either the long or unsigned long type to an integral constant, we
    simply attach the first alphabetical letter of the type to the number. For example,
    if we were to assign the number 15 to a long type, then we would do so by either
    adding `L` or `l` to the number. Similarly, if we were to assign the same number
    to the unsigned long type, then we would do so by using the `UL` or `ul` letter.
    For assigning a number to the unsigned int type, we only need to use the letter
    `U` or `u`. This has been demonstrated below:


    `15L` and `15l` correspond to the type `long`

    `15U` and `15u` correspond to the type `unsigned int`

    `15UL` and `15ul` correspond to the type `unsigned long`


    A detailed example of all the integral constants has been demonstrated in the
    table shown below.


    | Decimal | Octal | Hexadecimal | Type |

    | :--- | :--- | :--- | :--- |

    | 16 | 020 | 0x10 | int |

    | 255 | 0377 | OXff | int |

    '
