    . The main difference between these two types is the storage they use to allocate
    the character codes. The char type uses 8-bits (or one byte) of storage, making
    it suitable for extended character sets such as the ANSI character set. At the
    same time, the wchar_t type uses 16-bits (or 2 bytes) of storage to allocate the
    character codes making it suitable for the modern Unicode characters. This is
    also the reason why the whchar_t type is referred to as the ‘wide character set.’The
    Integer Data TypeThere are three integral types used to represent integer data.
    These types are different from each other based on the range of values they can
    represent. These integral data types are the following:


    1.  int and unsigned int


    2.  short and unsigned short


    3.  long and unsigned long


    The table shown below highlights the properties of and specification (storage
    space and the supported range value) of each integral data type.


    | Type | Size | Decimal Range of Values |


    | Char | 1 byte | -128 to +127 or 0 to 255 |


    | Unsigned char | 1 byte | 0 to 255 |


    | Signed char | 1 byte | -128 to +127 |


    | Int | 2-byte resp.4 byte | -32768 to +32767 resp-2147483648 to +2147483647 |


    | Unsigned int | 2-byte resp.4 byte | 0 to 65535 resp.0 to 4294967295 |


    | Short | 2 byte | -32768 to +32767 |


    | Unsigned short | 2 byte | 0 to 65535 |


    | Long | 4 byte | -2147483648 to +2147483647 |


    | Unsigned long | 4 byte | 0 to 4294967295 |


    The int type is like a self-fitting and self-adjusting integral type. It adapts
    to the register of the computer on which it is being used. For example, if the
    int type is being used on a 16-bit system, then it will have the same specifications
    as the short type. Similarly, if the int type is being used on a 32-bit system,
    then it will have the same specifications as the long type.You might have also
    noticed a data type that isn’t a part of the integral data type family. This is
    the char type belonging to the character data type. The reason as to why the char
    type is included in this table is because C++ evaluates character codes just like
    any ordinary integer. Due to this, programmers can perform calculations on variables
    that are stored in char and wchar_t type in the same way as they would with variables
    stored in int type. However, it is important to keep in mind that the storage
    capacity of a char type is only a single byte. So, depending on how the C++ compiler
    interprets it (as either signed or unsigned), the range of values you can use
    with it are only from -128 to +127 and 0 to 255, respectively. On the other hand,
    the wchar_t type is an extended integral type as opposed to the char type being
    a simple integral type and is commonly defined as unsigned short .Now let’s discuss
    the signed and unsigned modifiers in the integral type. A signed integral has
    the highest valued bit as the representative of the sign of the integer value.
    On the other hand, unsigned integrals do not feature the highest bit representing
    the sign, and as a consequence, the values that can be represented by unsigned
    integral are changed. However, the memory space required to store the values is
    the same for signed and unsigned integral types. Normally, the char type is interpreted
    by the compiler as ‘signed,’ and as such, there are the modifiers result in three
    integral types, char, signed char and unsigned char .Users can take advantage
    of a header file named as ‘climits ’ that defines the integral constants, for
    instance:


    *   CHAR_MIN , CHAR_MAX , INT_MIN , and INT_MAX .


    As their name suggests, these constants represent the smallest and largest values
    of their corresponding integral types. To understand integral types better, let’s
    implement this header file in a C++ program and use these constants to output
    the values of the int and unsigned int types.#include <iostream>#include <climits>
    ​ ​ ​ ​ ​ // Definition of INT_MIN, ...using namespace std;int main(){cout <<
    "Range of types int and unsigned int"<< endl << endl;cout << "Type ​ ​ ​ Minimum
    ​ ​ ​ ​ ​ Maximum"<< endl<< "--------------------------------------------"<< endl;cout
    << "int                  "<< INT_MIN << "                   "<< INT_MAX << endl;cout
    << "unsigned int         " << "              0                "<< UINT_MAX <<
    endl;return 0;}The Floating Point Data TypeFloating-point data refers to those
    numbers that have a fractional portion indicated by a decimal point. Unlike integers,
    floating-point values need to be stored according to a preset accuracy. This is
    in accordance with how decimal numbers are treated mathematically, i.e., the least
    significant numbers are ignored or rounded off. According to the preset accuracies,
    there are three floating-point types which have been listed below:


    1.  floa t : corresponds to a simple accuracy preset


    2.  doubl e : corresponds to a double accuracy preset


    3.  long doubl e : corresponds to a high accuracy preset


    An important thing to note regarding floating-point types is that the maximum
    and minimum value range along with the accuracy of a particular type is dependent
    on two factors:


    1.  The total memory allocated by the floating-point type.


    2.  The internal representation of the floating-point type.'
