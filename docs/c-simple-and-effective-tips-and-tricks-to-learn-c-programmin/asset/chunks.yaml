    \ stream class comes with the following functional features:\n\n- Methods that\
    \ have been defined for operations such as non-formatted reading or writing specifically\
    \ for single characters and data blocks.\n- Operators (`‘<<’ and ‘>>’`) that are\
    \ used for formatted read and write operations to or from files.\n- The methods\
    \ and manipulators that have been defined for formatting character sequences.\n\
    - The methods that have been defined for tasks such as state queries.\n\n## Creating\
