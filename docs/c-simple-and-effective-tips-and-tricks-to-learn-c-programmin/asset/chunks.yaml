  trans: "\n第一条语句包含两个重要部分：`cout` 和 `endl`。`cout` 取自 C++ 标准命名空间，代表“控制台输出”。`cout` 被用于指定一个对象，该对象负责输出语句中定义的文本字符串。此外，`<<`\
    \ 符号代表程序中的数据流。这些符号告诉程序，字符串中的字符应该流向输出流。最后，`endl` 表示该语句已结束并生成一个换行符。\n\n第二条语句停止了\
    \ `main()` 函数的执行，在这种情况下，就是程序本身的执行。这是通过返回一个值 `0` 实现的，`0` 是给调用程序的退出代码。在强调程序已成功终止时，始终建议使用退出代码\
    \ `0`。\n\n# 创建一个具有多个函数的 C++ 程序\n\n现在我们已经了解了基础 C++ 程序是如何运行的，以及哪些核心元素构成了一个简单的程序，让我们继续理解一个使用多个函数而非单个程序的。下面展示了这样一个\
    \ C++ 程序示例，请注意，该程序还包含注释，这些是程序员留下的笔记，详细说明了特定行代码的作用。注释写在两个反斜杠 `//` 之后，编译器不会将其视为可执行代码并忽略它。\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nvoid line(), message(); //\
    \ Prototypes\nint main(){\n    cout << \"Hey! The program starts in main().\"\
    << << endl;\n    line();\n    message();\n    line();\n    cout << \"At the end\
    \ of main().\" << endl;\n    return 0;\n}\nvoid line() { // To draw a line.\n\
    \    cout << \"--------------------------------\" << endl;\n}\nvoid message()\
    \ { // To display a message.\n    cout << \"In function message().\" << endl;\n\
    }\n```\n\n现在让我们运行这个程序并查看输出。\nHey! The program starts in main().\n--------------------------------\n\
    In function message().\n--------------------------------\nAt the end of main().\n\
    \n通过这个示例，我们可以更深入地理解 C++ 程序的结构。请注意，与之前显示的只有一个函数的简单程序不同，这个 C++ 程序具有多个函数。然而，C++ 并不限制用户按照定义的顺序来定义函数。换句话说，在编写\
    \ C++ 程序时，你可以按照选择的任何顺序定义函数。例如，你可以先定义 `message()` 函数，然后是 `line()` 函数，最后是 `main()`\
    \ 函数，或者按照你喜欢的其他顺序。\n\n然而，建议先定义 `main()` 函数。这是因为该函数本质上控制着程序的流程。为了理解这一点，我们需要看看 `main()`\
    \ 函数主要做了什么。它将尚未定义的函数调用到它们被使用的程序中。`main()` 函数通过向编译器提供函数原型来实现此点。函数原型包含了编译器帮助 `main()`\
    \ 函数完成其工作所需的所有必要信息。\n\n此外，如果你观察这个程序，会发现一些跟在 `//` 符号后面的句子。这些是字符串，程序将它们解释为注释。在处理涉及成千上万行代码的大项目时，注释是非常用的。通过使用注释，程序员本质上可以留下提醒，说明某行代码或整个代码块的作用，从而更容易进行调试，或让访问代码的其他用户理解其结构。此外，注释还让程序员在日后修改代码更加容易。因此，养成这种习惯的程序员通常可以在未来分担许多繁重的工作负载。\n\
    \n# 第 2 章：C++ 中使用的基本数据类型、常量和变量\n\n在任何编程语言中，熟悉通用的常量和变量都是非常重要的。在像 C++ 这样更面向对象的编程语言中，学习至少包含在\
    \ C++ 程序中的常用数据类型和对象的基础知识变得更加重要。因此，本章将重点介绍上述元素，旨在为读者提供未来理解和创建更复杂、更有效的 C++ 程序所需的所有基础知识。\n\
    \n## 基本数据类型\n\n在本节中，我们将讨论 C++ 程序中的“类型”指的是什么，并理解 C++ 编程语言中提供的各种基本数据类型。\n\n在编程中，我们必须考虑不同类型的数据，程序可以使用这些数据来执行任务或解决问题。此外，计算机的工作并不仅依靠单一的数据处理方法。为了利用计算机通过各种方法处理和保存数据的能力，我们需要知道处理的是什么类型的数据，或者弄清楚输入我们\
    \ C++ 程序的数据类型。\n\n通常，C++ 中有四类主要数据类型。这四类数据类型是：\n\n* 布尔值\n* 字符\n* 整数\n* 浮点值\n\n\
    每种数据类型都需要采用不同的方法，以便计算机处理它们所携带的信息。这就是为什么识别程序中的数据类型非常重要。数据类型的目的详述如下：\n\n* 数据的内部表示\n\
    * 需要分配的内存值\n"
- fmt: "\nFor example, let’s consider an integer that we want to store as data. The\
    \ number `-1024` needs only 2 or 4 bytes of memory as storage space. In other\
    \ words, if we want to store such an integer, we will need to allocate 2 or 4\
    \ bytes to do so. To access this data, we will need to access that part of memory\
    \ where it has been stored and to do this, we simply need to read the corresponding\
    \ byte numbers. Moreover, the program through which we are accessing this data\
    \ type must also interpret the sequence of bytes, representing the data in memory,\
    \ as an integer with a negative sign.\n\nHere’s a chart representing the basic\
    \ data types that are natively recognized by C++.![](rsrc2Y6.jpg)These are the\
    \ fundamental data types that serve as the base for other data types such as vectors,\
    \ pointers, and classes, etc. The C++ compiler has native support for these fundamental\
    \ data types. As such, these data types are commonly referred to as built-in types\
    \ . We will now proceed to discuss each category of data type individually.\n\n\
    ### The ‘bool’ Data Type\nA value obtained as a result of a logical comparison\
    \ or association by using logic gates (such as AND or or gates) is known as a\
    \ Boolean value and is referred to as a `bool` data type. The distinguishing feature\
    \ of this value is that it can be either of one of the logical states, i.e., `true`\
    \ or `false`. The internal value of these logical representations is ‘numerical\
    \ value 1’ for the ‘true state’ and ‘numerical value 0’ for the ‘false state.’\n\
    \n### The Character Data Types\nThe character data type is used to save the code,\
    \ which refers to a specific character. To be more specific, in programming, each\
    \ character code is represented by an integer that is associated with the character.\
    \ For instance, the integer associated with the character code of “A” is ‘65’.\
    \ Over the years, many character code sets have been developed to facilitate the\
    \ digitization of writing. However, some sets have different character codes representing\
    \ a particular character. So whenever a character is to be displayed on a screen\
    \ connected to a computer, the associated character code is translated by the\
    \ processor, and the resulting character is shown.\n\nAlthough there are many\
    \ character sets available in programming, the C++ language does not restrict\
    \ the user to any particular set. However, character sets that contain the American\
    \ Standard Code for Information Interchange, or more commonly referred to as `ASCII`\
    \ code is preferred. This is a 7-bit character code set, and as such, it features\
    \ 32 code characters and 96 printable characters.\n\nIn C++, the character data\
    \ type features two major type containers, the `char` type, and the `wchar_t`\
    \ type . The main difference between these two types is the storage they use to\
    \ allocate the character codes. The `char` type uses 8-bits (or one byte) of storage,\
    \ making it suitable for extended character sets such as the ANSI character set.\
    \ At the same time, the `wchar_t` type uses 16-bits (or 2 bytes) of storage to\
    \ allocate the character codes making it suitable for the modern Unicode characters.\
    \ This is also the reason why the whchar_t type is referred to as the ‘wide character\
    \ set.’\n\n### The Integer Data Type\nThere are three integral types used to represent\
    \ integer data. These types are different from each other based on the range of\
    \ values they can represent. These integral data types are the following:\n\n\
    1. `int` and `unsigned int`\n2. `short` and `unsigned short`\n3. `long` and `unsigned\
    \ long`\n\nThe table shown below highlights the properties of and specification\
    \ (storage space and the supported range value) of each integral data type.\n\n\
    | Type | Size | Decimal Range of Values |\n| :--- | :--- | :--- |\n| Char | 1\
    \ byte | -128 to +127 or 0 to 255 |\n| Unsigned char | 1 byte | 0 to 255 |\n|\
    \ Signed char | 1 byte | -128 to +127 |\n| Int | 2-byte resp.4 byte | -32768 to\
    \ +32767 resp-2147483648 to +2147483647 |\n| Unsigned int | 2-byte resp.4 byte\
    \ | 0 to 65535 resp.0 to 4294967295 |\n| Short | 2 byte | -32768 to +32767 |\n\
    | Unsigned short | 2 byte | 0 to 65535 |\n| Long | 4 byte | -2147483648 to +2147483647\
    \ |\n| Unsigned long | 4 byte | 0 to 4294967295 |\n\nThe `int` type is like a\
    \ self-fitting and self-adjusting integral type. It adapts to the register of\
    \ the computer on which it is being used. For example, if the `int` type is being\
    \ used on a 16-bit system, then it will have the same specifications as the `short`\
    \ type. Similarly, if the `int` type is being used on a 32-bit system, then it\
    \ will have the same specifications as the `long` type.\n\nYou might have also\
    \ noticed a data type that isn’t a part of the integral data type family. This\
    \ is the `char` type belonging to the character data type. The reason as to why\
    \ the `char` type is included in this table is because C++ evaluates character\
    \ codes just like any ordinary integer. Due to this, programmers can perform calculations\
    \ on variables that are stored in `char` and `wchar_t` type in the same way as\
    \ they would with variables stored in `int` type. However, it is important to\
    \ keep in mind that the storage capacity of a `char` type is only a single byte.\
    \ So, depending on how the C++ compiler interprets it (as either signed or unsigned),\
    \ the range of values you can use with it are only from -128 to +127 and 0 to\
    \ 255, respectively. On the other hand, the `wchar_t` type is an extended integral\
    \ type as opposed to the `char` type being a simple integral type and is commonly\
    \ defined as `unsigned short`.\n\nNow let’s discuss the signed and unsigned modifiers\
    \ in the integral type. A signed integral has the highest valued bit as the representative\
    \ of the sign of the integer value. On the other hand, unsigned integrals do not\
    \ feature the highest bit representing the sign, and as a consequence, the values\
    \ that can be represented by unsigned integral are changed. However, the memory\
    \ space required to store the values is the same for signed and unsigned integral\
    \ types. Normally, the `char` type is interpreted by the compiler as ‘signed,’\
    \ and as such, there are the modifiers result in three integral types, `char`,\
    \ `signed char` and `unsigned char`.\n\nUsers can take advantage of a header file\
    \ named as ‘climits ’ that defines the integral constants, for instance:\n\n*\
    \ `CHAR_MIN`, `CHAR_MAX`, `INT_MIN`, `INT_MAX`\n\nAs their name suggests, these\
    \ constants represent the smallest and largest values of their corresponding integral\
    \ types. To understand integral types better, let’s implement this header file\
    \ in a C++ program and use these constants to output the values of int and unsigned\
    \ int.\n\n```cpp\n#include <iostream>\n#include <climits> // Definition of INT_MIN,\
    \ ...\nusing namespace std;\nint main(){\n    cout << \"Range of types int and\
    \ unsigned int\"<< endl << endl;\n    cout << \"Type ​ ​ ​ ​ Minimum ​ ​ ​ ​ Maximum\"\
    << endl;\n    cout << \"-----------------------------\" << endl;\n    cout <<\
    \ \"int                \" << INT_MIN << \"              \" << INT_MAX << endl;\n\
    \    cout << \"unsigned int           \" << \"   0               \" << UINT_MAX\
    \ << endl;\n    return 0;\n}\n```\n\n### The Floating Point Data Type\nFloating-point\
    \ data refers to those numbers that have a fractional portion indicated by a decimal\
    \ point. Unlike integers, floating-point values need to be stored according to\
    \ a preset accuracy. This is in accordance with how decimal numbers are treated\
    \ mathematically, i.e., the least significant numbers are ignored or rounded off.\
    \ According to the preset accuracies, there are three floating-point types which\
    \ have been listed below:\n\n1. `float` : corresponds to a simple accuracy preset\n\
    2. `double` : corresponds to a double accuracy preset\n3. `long double` : corresponds\
    \ to a high accuracy preset\n\nAn important thing to note regarding floating-point\
    \ types is that the maximum and minimum value range along with the accuracy of\
    \ a particular type is dependent on two factors:\n\n1. The total memory allocated\
    \ by the floating-point type.\n2. The internal representation of the floating-point\
    \ type.\n"
