    # Chapter 8: The Basics of File Input and File Output in C++


    In the first few chapters of this book, we briefly discussed the `iostream` library,
    also known as the library, to feature sequential file access stream classes. In
    this chapter, we will build our discussion on this fundamental concept and explore
    it in more detail and depth. Understanding file streams are very important in
    programming as they are a gateway for practicing portable file handling techniques.
    Moreover, file operations are one of the very foundational tasks on which C++
    programs are built upon. Just as how functions, classes, objects, and variables
    all come together to make up the basic structure of a program, file streams provide
    a structural representation of storing data within a program to an external storage
    device. This is a very important process because a program primarily stores its
    data in the volatile system memory. Hence, when we close a program, the data in
    this volatile storage is immediately lost. That’s why we need certain techniques
    to not only output data from a program to permanent storage but also input data
    into the program as well.


    ## The Basic Concept of Files


    Before we discuss file streams, we must first understand the concepts of file
    operations and file positions.


    ### File Operations

    Just as how lone characters or an entire string of characters can be displayed
    on a screen as an output, such characters can also be written to a text file as
    well as representing this data. Now let’s talk a bit about records. Record is
    an umbrella term for referring to a file that houses data forming logical units.
    Generally, records are stored in files. This is achieved by the `write` operation,
    which handles the process of virtually storing a specified record to a specified
    file. If the file already has an existing record, the `write` operation either
    updates the already present record or simply adds in a new record to the file
    alongside the pre-existing one. When we want to access the contents of the record
    stored in a file, we are issuing a `read` command which takes the contents of
    the record and copies it to the program’s defined data structure.


    Similarly, objects can also be stored in the permanent storage of the system instead
    of the volatile storage. However, the process isn’t entirely the same as storing
    and reading record files, as we need to do more than just store the internal data
    of the object itself. When storing objects, we need to make sure that the object,
    along with its data, is accurately reconstructed when we issue a `read` command.
    For this purpose, we not only need to store the object’s type information, but
    we also need to store the included references to other objects as well.


    It is important to keep in mind that all of the external storage devices (for
    instance, a hard disk) have a block-oriented storage structure. This block-oriented
    nature of storage means that the data is stored into the device in blocks, and
    the sizes of these blocks are always multiples of 512 bytes. Efficient and simple
    file management simply refers to the concept of taking the data you need to store
    and transferring it to the temporary storage of the main memory, which is also
    known as ‘file buffer.’ Here’s a visual representation of this concept. ![](rsrc2YY.jpg)


    ### File Positions

    In a C++ program, a file is interpreted as a large array of bytes. Keeping this
    in mind, the structural elements of this file is solely the responsibility of
    the programmer to handle. How much flexibility the file’s structure provides the
    programmer is dependent on how he structured the file itself.


    In a file, there are many characters represented by bytes. Each byte in a file
    holds a specific position. For instance, the first byte of the file will be assigned
    the position 0, the next byte will be assigned the position 1 and this trend continues.
    As a consequence of this feature of files, a very important term arises, which
    is known as ‘current file position.’ This refers to the position that will be
    assigned to the upcoming byte, which is going to be written or read from the file.
    So, whenever a new byte is added to a file, the current file position is displaced
    positively (increased) by the value of 1.


    In sequential access, things are a little different. As we know that the word
    ‘sequential’ means ‘in a sequence or following a sequence,’ the data that is being
    written or read to file is done in a fixed and defined order. In other words,
    there is a defined sequence in which the programmer can read or write data, and
    it is not possible to deviate from this sequence. So if you execute the very first
    `read` operation on a file, the program will begin reading the file from the very
    beginning. This means that if you want to access a specific piece of information
    located within the file, you will have to go through the entire sequence, i.e.,
    start from the beginning and scrolling through the contents of the file until
    you find what you’re looking for. In terms of write operations, they have a little
    more freedom compared to read operations as they can easily create new files,
    overwrite existing files, or add new data to an existing file.


    In contrast, random file access means that we can access or read any part of the
    file without having to follow through a sequence at any given time. This allows
    for instantaneous access to the contents of the file. The concept of providing
    easy access to files refers to this technique of random access, and programmers
    have the freedom of specifying current file positions per their needs.


    ### File Stream Classes

    In C++, there are several classes standardized for file management purposes. These
    classes are commonly referred to as ‘file stream classes’ and offer easy file
    handling functionality for the program. Here’s a flow-chart highlighting some
    of the most commonly used file stream classes and their hierarchy relative to
    each other.![](rsrc2YZ.jpg)


    Although, as a programmer, you need to consider the file management classes and
    implement them properly, what you don’t need to worry about regarding file management
    during programming is buffer management or even the system specifics.


    In C++, the major file stream classes have already been standardized, allowing
    programmers the freedom and capability of developing portable C++ programs. By
    portable, we do not mean easy to carry around like a laptop or a smartphone. Portable
    in programming means that this particular program can be easily ported to other
    platforms such as Windows or Unix. Hence, standardized file stream classes make
    it easier for programmers to develop programs that can be easily ported to other
    platforms. All it takes is a simple recompilation of the program for each platform
    it’s being used on.


    ## File Stream Classes Belonging to the iostream Library


    If you refer to the flow-chart shown in the previous section highlighting the
    hierarchy of the file stream classes, we can see that this family of classes have
    something known as ‘base classes.’ A base class is a class from which other classes
    are derived. In other words, we can understand base classes by remembering them
    as ‘parent classes’ from which other classes can be created; however, ‘base class’
    is the official programming term. We have already used some of these base classes
    in the programs demonstrated in this book as well. Here’s an explanation of what
    class has been derived from which parent class:


    * `istream` is the parent class for the `ifstream` class. In other words, the
    `ifstream` class has been derived from the `istream` class. The purpose of the
    `ifstream` class is to allow the operations of file reading.

    *   The `ostream` class is the parent class for `ofstream` . In other words, the
    `ofstream` class is created from the `ostream` class, and its purpose is to support
    writing operations for files.

