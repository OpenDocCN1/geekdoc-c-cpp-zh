- fmt: "\nA program that is properly terminated will automatically close any open\
    \ files that are associated with it. However, there are cases where a program\
    \ is not properly terminated. To avoid those unforeseeable cases, it is important\
    \ always to close the files directly once they are not being used. Here’s a program\
    \ that demonstrates the concepts discussed up till now:\n\n```cpp\n// fcopy1.cpp\
    \ : Copies files.\n// Call: fcopy1 source [ destination ]\n// ----------------------------------------------------\n\
    #include <iostream>\n#include <fstream>\nusing namespace std;\n\ninline void openerror(\
    \ const char *file){\n    cerr << \"Error on opening the file \" << file << endl;\n\
    \    exit(1); // Ends program closing\n}                                     //\
    \ all opened files.\n\nvoid copy( istream& is, ostream& os); // Prototype\n\n\
    int main(int argc, char *argv[]){\n    if( argc < 2 || argc > 3){\n        cerr\
    \ << \"Call: fcopy1 source [ destination ]\"<< << endl;\n        return 1; //\
    \ or: exit(1);\n    }\n    ifstream infile(argv[1]); // Open 1st file\n    if(\
    \ !infile.is_open())openerror( argv[1]);\n    if( argc == 2) // Just one sourcefile.\n\
    \        copy( infile, cout);\n    else // Source and destination\n    {\n   \
    \     ofstream outfile(argv[2]); // Open 2nd file\n        if( !outfile.is_open()\
    \ )openerror( argv[2]);\n        copy( infile, outfile);\n        outfile.close();\
    \ // Unnecessary.\n    }\n    infile.close(); // Unnecessary.\n    return 0;\n\
    }\n\nvoid copy( istream& is, ostream& os) // Copy it to os.{\n    char c;\n  \
    \  while( is.get(c) )os.put(c); // or: os << c ;\n}\n```\n\n### The `close()`\
    \ And `is_open()` Methods\nNotice that each of the file stream classes used in\
    \ the program demonstrated a method defined as a `void` type. This is the `close()`\
    \ method, and as its name suggests, it’s purpose is to terminate the file which\
    \ is occupied by the stream in which the method is used. For example: `myfile.close();`.\n\
    \nEven though the file on the specified file stream is terminated, the file stream\
    \ itself is left untouched. This means that by closing a file on a particular\
    \ file stream, we can open another file immediately on the same stream. To check\
    \ whether a file is currently occupying a file stream, we use the `is_open()`\
    \ method to do so. For instance:\n\n```cpp\nif( myfile.is_open() ){ /* . . . */\
    \ } // File is open\n```\n\n### The `exit()` Function\nWhen using the global `exit()`\
    \ function, files that are open and being accessed by the program are closed.\
    \ The main reason for using this global terminating function as opposed to the\
    \ `close()` method is that we are not only closing the open files, but we are\
    \ also terminating the program itself as well. In this way, the program is properly\
    \ closed, and a status error code is returned to the corresponding calling process.\
    \ The prototype of the `exit()` function is shown below:\n\n```cpp\nvoid exit(\
    \ int status );\n```\n\nThe reason for returning a status error code to the calling\
    \ process is because the calling process evaluates `status`. Usually, the calling\
    \ process in such cases is the command-line interpreter itself, for example, Unix\
    \ shell. When a program is successfully terminated without any problems, it returns\
    \ an error code `0`. Similarly, in the `main()` function, the two statements `return\
    \ n` and `exit(n)` are equivalent to each other. In the program shown in the next\
    \ section, you will see a program that is instructed to copy the contents of a\
    \ file to paste it to a destination file. The file is stated in the command line,\
    \ and the program proceeds to copy it. If the user does not specify the destination\
    \ file, then the original file is simply copied to the program’s output.\n\n###\
    \ Read and Write Operation on Blocks\nAll of the file stream classes are capable\
    \ of utilizing the public operations that have been defined in their parent classes,\
    \ otherwise known as base classes. Hence, by using appropriate file stream classes\
    \ for program, we can easily perform write operations for transferring formatted\
    \ or unformatted data to a specified file. Similarly, we can also perform a read\
    \ operation to go through the data contents of the file either entire blocks at\
    \ time or one character at time. Here’s a program demonstrating the use of read\
    \ and write operations for blocks of data:\n\n```cpp\n// Pizza_W.cpp\n// Demonstrating\
    \ output of records block by block\n// -----------------------------------\n#include\
    \ <iostream>\n#include <fstream>\nusing namespace std;\n\nchar header[] =\" *\
    \ * * P I Z Z P R O N * * *\"\n\n// Record structure\nstruct Pizza {\n    char\
    \ name[32];\n    float price;\n};\n\nconst int MAXCNT = 10;\nPizza pizzaMenu[MAXCNT]\
    \ = {\n    {\"Pepperoni\", 9.90},\n    {\"White Pizza\", 15.90},\n    {\"Ham Pizza\"\
    , 12.50},\n    {\"Calzone\", 14.90}\n};\n\nint cnt = 4;\nchar pizzaFile[256] =\
    \ \"pizza.file\";\n\nint main() {\n    // To write records.\n    cout << header\
    \ << endl;\n    // To write data into the file:\n    int exitCode = 0;\n    ofstream\
    \ outFile( pizzaFile, ios::out|ios::binary );\n    if( !outFile){\n        cerr\
    \ << \"Error opening the file!\" << endl;\n        exitCode = 1;\n    }\n    else{\n\
    \        for( int i = 0; i < cnt; ++i){\n            if( !outFile.write( (char*)&pizzaMenu[i],sizeof(Pizza))\
    \ ){\n                cerr << \"Error writing!\" << endl;\n                exitCode\
    \ = 2;\n            }\n        }\n    }\n    if( exitCode == 0)\n        cout\
    \ << \"\\nData has been added to file \"<< pizzaFile << \"\\n\" << endl;\n   \
    \ return exitCode;\n}\n```\n\n### Formatted and Unformatted Input and Output\n\
    In the programs demonstrated up until now in this chapter, we have seen the use\
    \ of some important methods `get()`, `getline()` and `put()` to instruct the program\
    \ to perform read or write operations to from text files. Data that is formatted,\
    \ such as numerical values, require the `<<` and `>>` operators for input and\
    \ output. In addition, we also need specific formatting methods and proper manipulators\
    \ to handle formatted data. For example:\n\n```cpp\ndouble price = 12.34;\nofstream\
    \ textFile(\"Test.txt\");\ntextFile << \"Price: \" << price << \" Dollar\" <<\
    \ endl;\n```\nIn these lines of code, we can understand that the actual `test.txt`\
    \ file itself will have a line that will correspond to “Price..” and this line\
    \ will match exactly with the output shown on the screen.\n\n### Transfer Blocks\
    \ of Data\nTransferring entire data blocks is mostly done by issuing a write operation\
    \ through the `write()` method. This method belongs to the `ostream` class and\
    \ transfers the number of bytes specified by the user from the system’s main memory\
    \ to the destination file. The prototype of this method has been shown below:\n\
    \n```cpp\nostream& write( const char *buf, int n);\n```\n\nSince the `write()`\
    \ method gives a reference value to the corresponding file stream, we can use\
    \ this to check if the write operation completed successfully or if it wasn’t\
    \ able to transfer the total bytes of data completely. The following statements\
    \ show how this can be done:\n\n```cpp\nif( ! fileStream.write(\"An example \"\
    , 2) )\n    cerr << \"Error in writing!\" << endl;\n```\nWhen the program tries\
    \ to perform a write operation to transfer the first two characters, “An,” then\
    \ it will issue a warning if the write operation encounters an error; otherwise,\
    \ everything will go smoothly.\n\nWe can also perform a read operation by using\
    \ the `read()` method belonging to the `istream` class to read the blocks of data\
    \ within a specified file. When a read operation is performed, the `read()` method\
    \ takes a data block from the source file and transfers it to the buffer memory\
    \ of the program to read it. Once the data block has been read, the buffer memory\
    \ of the program is cleared, and the next data block is transferred until we reach\
    \ the end-of-line of the file. The prototype method of the read operation is shown\
    \ below:\n\n```cpp\nistream& read( char *buf, int n);\n```\n\nIt is important\
    \ to note and remember that the `read()` and `write()` methods are primarily used\
    \ with records that are of a fixed length. Moreover, the data block we want to\
    \ transfer can have more than one record as well. Last but not least, the buffer\
    \ in the system’s main memory can have two possible structures: a simple structure\
    \ variable or an entire array whose elements are part of the structure type itself.\
    \ When accessing the main memory for a data block, we must specify the address\
    \ referring to the specific area of memory in which the data block is found to\
    \ the argument `(char *)`. The implementation of the `read()` and `write()` methods\
    \ have been demonstrated in the following program:\n\n### Creating a Class Account\n\
    ```cpp\n// Class Account\n// Class Account with methods read() and write()\n//\
    \ ---------------------------------------------------\nclass Account{\nprivate:\n\
    \    string name; // Account holder\n    unsigned long nr; // Account number\n\
    \    double balance; // Balance of account\npublic:\n    // ... Constructors,\
    \ destructor, access methods\n    ostream& write(ostream& os) const;\n    istream&\
    \ read(istream& is);\n};\n\n// Implementing the read() and write() methods\n//\
    \ write() outputs an account into the given stream.\n// Returns: The given stream\n\
    ostream& Account::write(ostream& os) const{\n    os << name << '\\0'; // To write\
    \ a string\n    os.write((char*)&nr,sizeof(nr));\n    os.write((char*)&balance,sizeof(balance));\n\
    \    return os;\n}\n\n// read() is the opposite function of write().\n// read()\
    \ inputs an account from the stream\n// and writes it into the current object\n\
    istream& Account::read(istream& is){\n    getline(is,name,'\\0'); // Read a string\n\
    \    is.read((char*)&nr,sizeof(nr));\n    is.read((char*)&balance,sizeof(balance));\n\
    \    return is;\n}\n```\n\n### Conclusion\nIt’s a delight that you have finally\
    \ reached the end of this book, and we hope that you had as much fun reading the\
    \ book as we did writing the book. We hope that you followed the guidelines properly\
    \ on how to approach each chapter in this book and have learned a lot. The starting\
    \ chapters of this book have laid the foundation for upcoming and technical concepts\
    \ such as performing arithmetic type conversions, handling input and output file\
    \ streams, using references and pointers, and controlling the flow of C++ programs\
    \ using control-flow operators. If you have properly understood and digested the\
    \ information laid out in the starting chapters, then the relatively complicated\
    \ topics should also be understandable.\n"
