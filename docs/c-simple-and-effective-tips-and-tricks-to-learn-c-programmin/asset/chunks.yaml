- fmt: "\nAt first glance, we can see that the header files shown in the two tables\
    \ have one key difference, and that is the inclusion of the `.h` extension. This\
    \ is because, in C programming language, header files are indicated by the extension\
    \ `.h`. However, this is not the case for C++ header files as their declarations\
    \ are all contained within their own namespace `std`. However, it is important\
    \ to specify to the program that you will be using the `std` namespace globally\
    \ to refer to identifiers. Otherwise, the compiler will not be able to recognize\
    \ the `cin` and `cout` streams without the using directive. \n\nIn this case,\
    \ the compiler cannot identify the `cin` and `cout` streams.\n\n```cpp\n#include\
    \ <iostream>\n#include <string>\nusing namespace std;\n```\n\nBy adding the `using\
    \ namespace std` directive, the program can now easily identify and use the `cin`\
    \ and `cout` streams without the need for any syntax. Note that this demonstration\
    \ also added the `string` header file as well. This will allow the program to\
    \ perform string manipulation tasks in C++ easily.\n\n# C Programming Language\
    \ Header Files\n\nThe C++ programming language has adopted and incorporated all\
    \ of the standard libraries of the C programming language, making them available\
    \ for use by C++ programs. As such, header files are also no exception. The header\
    \ files which were originally standardized for the C programming language have\
    \ been adopted for use by the C++ programming language as well. For example, we\
    \ can use the C programming language’s standard math library in C++ as well by\
    \ using the following statement as shown below:\n\n```cpp\n#include <math.h>\n\
    ```\n\nAlthough we can use standard C libraries, there is one complication that\
    \ can cause quite a problem. When using a C header file, the identifiers declared\
    \ in this file become globally visible. This can cause complications in big programming\
    \ projects. To take care of this issue, we simply use another header file in addition\
    \ to the C header file in C++. This additional header file declares these identifiers\
    \ in the `std` namespace, thus solving the issue of identifier conflicts. For\
    \ example, if we are using `math.h` library in C++, then we will accompany it\
    \ with another header file named `cmath`. This `cmath` library features all of\
    \ the data declared in the `math.h` library, but the difference is that the identifiers\
    \ in `cmath` have been declared in the `std` namespace. This has been demonstrated\
    \ below:\n\n```cpp\n#include <cmath>\nusing namespace std;\n```\n\nAn important\
    \ topic to clarify while we are talking about header files is that the `string`\
    \ header file and `string.h` or `cstring` do not offer the same functionality.\
    \ The `string` header file only defines the `string` class while the `string.h`\
    \ or `cstring` header files declare those functions and variables that are used\
    \ to manipulate string data in C programming language. In simpler terms, the `string.h`\
    \ and `cstring` header files allow the user to access the functionality of the\
    \ C string library, while the `string` header file’s only purpose is to define\
    \ the `string` class.\n\nHere’s an example showing the use of two header files,\
    \ i.e., `iostream` and `string` in a C++ program:\n\n```cpp\n// To use strings.\n\
    #include <iostream>      // Declaration of cin, cout\n#include <string>      \
    \   // Declaration of class string\nusing namespace std;\n\nint main(){\n    //\
    \ Defines four strings:\n    string prompt(\"What is your name: \"),name,    \
    \           // An empty line\n    line(40, '-'),                      // string\
    \ with 40 '-'\n    total = \"Hello \";                   // is possible!\n   \
    \ cout << prompt;                     // Request for input.\n    getline( cin,\
    \ name);                // Inputs a name in one line\n    total = total + name;\
    \               // Concatenates and assigns strings.\n    cout << line << endl;\
    \                // Outputs line and name\n    cout << total << endl;\n    cout\
    \ << \" Your name is \"             // Outputs length\n    << name.length() <<\
    \ \" characters long!\" << endl;\n    cout << line << endl;\n    return 0;\n}\n\
    ```\n\nThis example prints out the string using `cout` and `<<` statements. This\
    \ program asks the user to input their name and then proceeds to display their\
    \ input name along with the total number of characters contained within their\
    \ name.\n\nWhat is your name: Zoldyck Killua\n---------------------------------------\n\
    Hello Zoldyck Killua\nYour name is 13 characters long!\n---------------------------------------\n\
    \n# Using Classes in C++\n\nThe program shown in the above example can be seen\
    \ to incorporate the `string` class into its core functionality. In the standard\
    \ library of C++, multiple classes have been defined before-hand. These classes\
    \ are very important for the foundations of a C++ program. They include the stream\
    \ classes (`iostream`) and classes that effectively help represent strings for\
    \ the program and conditions through which an error arises.\n\nEven though there\
    \ are many classes available for use, each class is unique with regards to their\
    \ respective type that represents their properties and capacities. Although each\
    \ class is unique, whether they are predefined classes or classes that have custom\
    \ designed by the programmer, their properties and capacities are still governed\
    \ by two main aspects:\n\n- The data members of a class are responsible for defining\
    \ the properties of their corresponding class.\n- The class’s methods (functions\
    \ belonging to a class. These functions coordinate with the members of the class\
    \ to carry out an operation) define the capacity of a class. The method of a class\
    \ is also commonly known as its member function.\n"
