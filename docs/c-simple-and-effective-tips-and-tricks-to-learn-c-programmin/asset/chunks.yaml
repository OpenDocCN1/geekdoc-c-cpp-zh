- fmt: "\nThe core process remains the same; we are simply converting the `float`\
    \ type to a `double` type or the `double` type to an even larger type, such as\
    \ the `long double` type, as shown below. Throughout this type of conversion,\
    \ the original value of the number is retained.\n\n## Implicit Type Conversions\
    \ with Assignment Operators\n\nEven if we are not familiar with assignment operators,\
    \ everybody has come across these operators when exploring programming. We have\
    \ even used assignment operators in the `C++` programs shown in this book. An\
    \ assignment operator allows you to assign a value to a variable. There are several\
    \ shorthands and operands of this tool in programming, but the most common one\
    \ is the equal sign (`=`).\n\nIn this section, we will be discussing how implicit\
    \ type conversions can be performed during assignments. You might find it interesting\
    \ that during assignments, arithmetic types can also be brought into the process.\
    \ In a sense, the compiler acts as a mediator balancing out the left and right-hand\
    \ sides of the assignment operands. In other words, the value’s type on the right-hand\
    \ side of the assignment operator is adjusted to match the value’s type on the\
    \ left-hand side of the assignment operator.\n\nHowever, not all assignments are\
    \ as simple as `x = 2`. Assignments can also have multiple statements (including\
    \ many calculation operations, etc.) and a complex structure. Such assignments\
    \ are termed as ‘compound assignments.’ Hence, in compound assignments, the process\
    \ is carried out by first dealing with the required calculations using the general\
    \ arithmetic type conversions. Once that has been dealt with, then the type conversion\
    \ is performed.\n\nRegardless, there are two particular scenarios out which a\
    \ programmer will most likely face one during type conversions in assignments.\
    \ These have been listed below:\n\n1. In an assignment, if the variable’s type\
    \ is seen to be higher or bigger than the type of the value to which it is supposed\
    \ to be assigned, then the value’s type must be promoted to match the variable’s\
    \ type. For this type of conversion, we follow the rules that are defined in the\
    \ Usual Arithmetic Types Conversion process. For example:\n\n```cpp\nint i = 100;\n\
    long lg = i + 50; // Result of type int is converted to long\n```\n\n2. In an\
    \ assignment, if the type of the value is seen to be higher or bigger than the\
    \ type of the variable to which it is being assigned to, instead, of promoting\
    \ the variable’s type, we must demote the value’s type accordingly. Depending\
    \ on individual circumstances, the following procedures cover most of the encounters\
    \ in this type of conversion during assignments:\n\n   - For converting an integral\
    \ type to a smaller type, we must consider the two different cases for signed\
    \ and unsigned int type conversions. Firstly, for converting an `int` type to\
    \ a smaller type, we simply eliminate the most significant byte(s) from the bit\
    \ pattern. If the resulting type is also unsigned, then the resulting bit pattern\
    \ will be interpreted as unsigned. If the resulting type is signed, then the bit\
    \ pattern will be simply interpreted as ‘signed.’ However, the original value\
    \ of the number will only be retained if the new type is capable of representing\
    \ it. An example of this process has been shown below:\n\n```cpp\nlong lg = 0x654321;\
    \ short st;\nst = lg; // 0x4321 is assigned to st.\n```\n\nHowever, if we are\
    \ converting an unsigned type into a signed type, then the original bit pattern\
    \ remains the same as before, and this bit pattern is simply interpreted as ‘signed.’\
    \ For example:\n\n```cpp\nint i = –2; unsigned int ui = 2;\ni = i * ui; // First\
    \ the value contained in i is converted to unsigned int (preserving the bit pattern)\
    \ and multiplied by 2 (overflow!).\n           // While assigning the bit pattern\
    \ the result is interpreted as an int value again,\n           // i.e. –4 is stored\
    \ in i.\n```\n\n   - For converting a floating-point type to an integral type,\
    \ we simply need to remove the decimal portion of the floating-point value. For\
    \ instance, if we want to convert the floating-point number `2.9`, then we simply\
    \ remove the `.9` part and round off the original number. Rounding off can be\
    \ done by simply adding `0.5` to the floating-point number if it is positive and\
    \ subtracting `0.5` from the floating-point number if it is negative. So, in the\
    \ case of this example, by removing the decimal portion, we are left with the\
    \ integer `2`. However, after rounding it off (`2.9 + 0.5`), then the floating-point\
    \ value is converted to an integer `3`. However, the result of this type of conversion\
    \ can be unpredictable at times, especially when the resulting value of `int`\
    \ type is either too large or too small for the type itself. This is evident when\
    \ converting a negative floating-point type value to an `unsigned int` type. For\
    \ example:\n\n```cpp\ndouble db = –4.567; int i; unsigned int ui;\ni = db;   \
    \   // Assigning –4.\ni = db - 0.5; // Assigning –5\nui = db;     // –4 is incompatible\
