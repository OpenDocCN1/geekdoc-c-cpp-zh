    # 第 8 章：C++ 文件输入与输出基础


    在本书的前几章中，我们简要讨论了 `iostream` 库（也称为输入输出库），它的特点是顺序文件访问流类。在本章中，我们将基于这一基础概念继续讨论，并对其进行更详细、更深入的探索。理解文件流在编程中非常重要，因为它们是练习可移植文件处理技术的门径。此外，文件操作是构建
    C++ 程序的最基础任务之一。正如函数、类、对象和变量共同构成了程序的基本结构一样，文件流也提供了一种将数据从程序内部存储到外部存储设备的结构化表示。这是一个非常重要的过程，因为程序主要将其数据存储在易性系统内存中。因此，当我们关闭程序时，这种易性存储器中的数据会立即丢失。这就是为什么我们需要某些技术不仅将数据从程序输出到持久性存储，还能将数据输入程序中。


    ## 文件的基本概念


    在讨论文件流之前，我们必须首先理解文件操作和文件位置的概念。


    ### 文件操作

    正如单个字符或整个字符串可以作为输出显示在屏幕上一样，字符也可以写入文本文件并表示这些数据。现在，我们来聊聊记录（Record）。记录是一个指代包含逻辑单元数据的文件的统术语。通常，记录存储在文件中。这是通过
    `write` 操作实现的，该操作处理了虚拟地将指定记录存储到指定文件的过程。如果文件已存在记录，`write` 操作将更新已存在的记录，或者简单地在原有记录旁边向文件添加一条新记录。当我们想要访问存储在文件中记录的内容时，我们发出了一个
    `read` 命令，该命令获取记录的内容并将其复制到程序定义的数据结构中。


    同样，对象也可以存储在系统的持久性存储中，而不是易性存储器中。然而，这个过程与存储和读取记录文件并不相同，因为我们需要的不仅仅是存储对象本身的内部数据。在存储对象时，我们需要确保在发出
    `read` 命令时，对象及其数据能够被准确地重建。为了这个目的，我们不仅需要存储对象的类型信息，还需要存储对其他对象的引用。


    必须记住的是，所有的外部存储设备（例如硬盘）都具有基于块的存储结构。这种基于块的存储特性意味着数据是以块为形式存储在设备中的，且这些块的大小始终是 512
    字节的倍数。高效且简单的文件管理指的是将你需要存储的数据传输到主内存的临时存储中，这被称为“文件缓冲区（file buffer）”。这里是该概念的视觉表示图![](img/rsrc2YY.jpg)


    ### 文件位置

    在 C++ 程序中，文件被解释为一个巨大的字节数组。记住这一点，该文件的结构化元素完全由程序员负责处理。文件结构为程序员提供了多少灵活性，取决于他如何构建文件本身。


    在文件中，有许多由字节表示的字符。文件中的每个字节都持有一个特定的位置。例如，文件的第一个字节被分配位置 0，下一个字节被分配位置 1，依此类推。由于文件具有的这种特性，出现了一个非常重要的术语，即所谓的“当前文件位置（current
    file position）”。这指的是分配给下一个要从文件中写入或读取的字节的位置。因此，每当向文件添加新字节时，当前文件位置就会根据 1 的值正向移动（增加）。


    在顺序访问中，情况略有不同。众所知道，“顺序（sequential）”一词意味着“按顺序或遵循顺序”，写入或读取文件的数据是以固定且定义的顺序完成的。换句话说，程序员可以读取或写入数据有一个定义的序列，并且无法偏离这个序列。因此，如果你对文件执行第一次
    `read` 操作，程序将从文件的最开始处读取。这意味着，如果你想访问位于文件中的某个特定信息，你将必须经过整个序列，即从开始一直向下滚动文件内容，直到找到你正在寻找的内容。在写操作方面，与读操作相比，它们拥有更大的自由度，因为它们可以轻松地创建新文件、覆盖现有文件或向现有文件添加新数据。


    相比之下，随机文件访问（random file access）意味着我们可以访问或读取文件的任何部分，而不需要在任何时候遵循序列。这允许对文件内容进行瞬时访问。便捷访问文件的概念指的是这种随机访问技术，程序员可以根据需要自由指定当前文件位置。


    ### 文件流类

    在 C++ 中，有几个为了文件管理目的而标准化的类。这些类通常“文件流类（file stream classes）”，为程序提供了方便的文件处理功能。这里有一个突出了一些最常用的文件流类及其相互之间关系的流程图![](img/rsrc2YZ.jpg)


    尽管作为程序员，你需要考虑文件管理类并正确地实现它们，但在编程过程中，你不需要担心文件管理中的缓冲区管理甚至是系统特定的细节。


    在 C++ 中，主要的流流类已经标准化，允许程序员具有开发可移植 C++ 程序的自由和能力。这里的可移植不是像笔记本电脑或智能手机那样便于携带。编程中的可移植意味着特定的程序可以轻松地移植到其他平台，如
    Windows 或 Unix。因此，标准化的文件流类让程序员更容易开发可以移植到其他平台的程序。只需要对每个使用的平台进行简单的重新编译。


    ## 属于 iostream 库的文件流类


    如果你参考上一节中显示的文件流类层级关系图，我们可以看到这一族类有一些被称为“基类（base classes）”。基类是从其他类派生出来的类。换句话说，我们可以通过将基类记忆为可以创建其他类的“父类”来理解它们；但是，“基类”是正式的编程术语。我们在本书演示的程序中使用了一些这些基类。以下是哪个类派生自哪个父类的说明：


    * `istream` 是 `ifstream` 类的基类。换句话说，`ifstream` 类派生自 `istream` 类。`ifstream` 类的目的是允许文件读取操作。

    * `ostream` 是 `ofstream` 类的基类。换句话说，`ofstream` 类是从 `ostream` 类创建的，其目的是支持文件的写入操作。


