- fmt: "\nThe loop is repeated when expression `3` reinitializes the statement and\
    \ returns to `expression 2` to verify the value again. The loop counter placed\
    \ in `expression 1` can only be used within the loop, and not after the loop is\
    \ terminated.\n\nExample: `for ( int i = 0; i < 10; cout << i++ );`\n\nThe example\
    \ given suggests that some loops may even have empty statements because all of\
    \ the required statements are located in the loop header. Though this method works,\
    \ the readability of such a loop body is significantly worse than the one that\
    \ has a line of its own in the empty statement.\n\n```cpp\n// EuroDoll.cpp\n//\
    \ Outputs a table of exchange: Euro and US-$\n#include <iostream>\n#include <iomanip>\n\
    using namespace std;\nint main(){\n    long euro, maxEuro;             // Amount\
    \ in Euros\n    double rate;                     // Exchange rate Euro <-> $\n\
    cout << \"\\n* * * TABLE OF EXCHANGE \"<< \" Euro – US-$ * * *\\n\\n\";\n\ncout\
    \ << \"\\nPlease give the rate of exchange: \"\" one Euro in US-$: \";cin >> rate;\n\
    cout << \"\\nPlease enter the maximum euro: \";cin >> maxEuro;\n\n// --- Outputs\
    \ the table ---\n// Titles of columns:\ncout << '\\n'<< setw(12) << \"Euro\" <<\
    \ setw(20) << \"US-$\"<< \"\\t\\tRate: \" << rate << endl;\n// Formatting US-$:\n\
    cout << fixed << setprecision(2) << endl;\nlong lower, upper,               //\
    \ Lower and upper limit\nstep;                            // Step width\n// The\
    \ outer loop determines the actual\n// lower limit and the step width:\nfor( lower=1,\
    \ step=1; lower <= maxEuro;step*= 10, lower = 2*step)\n// The inner loop outputs\
    \ a \"block\":\nfor( euro = lower, upper = step*10;euro <= upper && euro <= maxEuro;\
    \ euro+=step)\n    cout << setw(12) << euro<< setw(20) << euro*rate << endl;\n\
    return 0;\n}\n```\n\nIn a `for statement`, any from the expressions `1`, `2`,\
    \ and `3` can easily be omitted. The exception to this is that there must at least\
    \ two semicolons in the loop. Thus, following this proclamation, the shortest\
    \ form of a for statement would be written as:\n\nExample: `for ( ; ; )`\n\nIn\
    \ this example, the controlling expression is the condition that `expression 2`\
    \ must be missing. Therefore, in this case, the value is always returned as true,\
    \ and the loop becomes infinite.\n\nExample: `for ( ; expression ; )`\n\nThis\
    \ expression of a for statement behaves in the same way as a while statement;\
    \ the loop continues as long as the controlling expression is verified to be true.\n\
    \n### The Comma Operator\n\nThe comma operator is used to separate two expressions,\
    \ which are included in a code where only one statement is expected. An example\
    \ would be the several variables set as initializers in a looping header of a\
    \ `for statement`. The comma operator has the following syntax:\n\nSyntax: `expression1,\
    \ expression2 [, expression3 ...]`\n\nThe set of expressions is evaluated from\
    \ left to right, and when they have to be evaluated for a single value, only the\
    \ right-most expression is considered.\n\nExample:\n```cpp\n    int x, i, limit;\n\
    For ( i=0, limit=8; i < limit; i += 2)\nx = i * i, cout << setw (10) << x;\n```\n\
    \nThe comma operator separates the different calculations in the above example.\
    \ The assignments for `i` and `limit` are comma-separated, followed by the calculation\
    \ and output of the value of `x` all in a single statement.\n\nThe precedence\
    \ of the comma operator in the order is the lowest, placing even lower than the\
    \ assignment operator. Hence, the use of parentheses is not needed, as in the\
    \ example above.\n\nThe last expression in a statement containing commas determines\
    \ the type and value of a comma operator.\n\nExample: `x = (a = 3, b = 5, a *\
    \ b);`\n\nThe expressions starting from the left are evaluated first, and then\
    \ the value of `a * b` is assigned to `x`.\n\n### The `do-while` Statement\n\n\
    The structure of the do-while statement is as follows:\n\n![](rsrc2YH.jpg)\n\n\
    The practical implementation of the do-while statement in a program to control\
    \ its flow has been demonstrated below:\n\n```cpp\n// tone.cpp\n#include <iostream>\n\
    using namespace std;\nconst long delay = 10000000L;\nint main(){\n    int tic;\n\
    \    cout << \"\\nHow often should the tone be output? \";cin >> tic;\n    do{\n\
    \        for( long i = 0; i < delay; ++i );\n        cout << \"Now the tone!\\\
    a\" << endl;\n    }while( --tic > 0 );\n    cout << \"End of the acoustic interlude!\\\
    n\";\n    return 0;\n}\n```\n\nIn the do-while statement, the loop is always executed\
    \ at least once, and the controlling expression is evaluated after the loop. Therefore,\
    \ this iteration statement is controlled by its footer as opposed to the other\
    \ two statements, which are controlled by their headers.\n\nSyntax: `do statement\
    \ while ( expression);`\n\nThe do-while evaluates the controlling expression after\
    \ the loop body has been executed once, and if the value of the expression is\
    \ returned as true, the loop is repeated; meanwhile, the false result will terminate\
    \ the loop.\n\n### Nesting Loop\n\nNesting loops mean that a different loop is\
    \ nested inside the loop body, i.e., a loop inside a loop. At most, 256 levels\
    \ of nesting are allowed in C++ according to ANSI standard. The sample program,\
    \ as shown, gives an output of several tones as determined by the user. There\
    \ are two loops in the given program where one loop is nested in another. Whenever\
    \ the outer loop (do-while statement) is repeated, a short break occurs during\
    \ the process which the inner loop (for statement) is executed. In the inner loop,\
    \ the value of `i` is incremented from 0 to `delay`. The output of this program\
    \ is text and a tone, which is generated by outputting the control character BELL\
    \ (ASCII code 7). This control character is characterized as `\\a`. The do-while\
    \ statement used in the program outputs the tone even if the input is 0 or a negative\
    \ number.\n\n### Selections of `If-Else` Statements\n\nThe structural diagram\
    \ of if-else statement is as follows:\n\n![](rsrc2J.jpg)\n\nSimilarly, the implementation\
    \ of the if-else statement has been demonstrated in the program below:\n\n```cpp\n\
    // if_else.cpp\n// Demonstrates the use of if-else statements\n#include <iostream>\n\
    using namespace std;\nint main(){\n    float x, y, min;\n    cout << \"Enter different\
    \ numbers:\\n\";\n    if( cin >> x && cin >> y)  // If both inputs are\n    {\n\
    \        if( x < y ) // the lesser.\n            min = x;\n        else\n    \
    \        min = y;\n        cout << \"\\nThe number is: \" << min << endl;\n  \
    \  }\n    else\n        cout << \"\\nInvalid Input!\" << endl;\n    return 0;\n\
    }\n```\n\nThe if-else statement is used when a choice is to be made between two\
    \ statements, based on the conditions they fulfill.\n\nSyntax: `if ( expression\
    \ ) statement1 else statement2`\n\nThe expression is evaluated first to verify\
    \ whether the condition is fulfilled. The result is returned as true or false.\
    \ If it is true, then `statement1` is executed, and `statement2` is processed\
    \ in other cases only if else branch exists. In case the result is false, then\
    \ `statement1` is ignored, and `statement2` is executed. However, if there is\
    \ no else statement or it is also false, then the control skips to the statement\
    \ following the if-else statement.\n\n#### Nested if-else statements\n\nConsidering\
    \ the situation where more than one if-else statements are used in a program,\
    \ multiple if-else statements can be nested in each other. Some `if statements`\
    \ do not have an `else` branch associated with them. So the `else` branches are\
    \ set to be associated with the nearest preceding `if statement` that does not\
    \ have an else branch.\n\nExample:\n```cpp\nif ( n > 0 )\n    if ( n%2 == 1 )\n\
    \        cout << \" Positive odd number \";\nelse\n    cout << \"Positive even\
    \ number\";\n```\n\nAs visible from the example, the else branch is associated\
    \ with the second if statement, which is indented. In case the else branch needs\
    \ to be redefined and associated with another if statement, a code block is used.\n\
    \nExample:\n```cpp\nif ( n > 0 ){ \n    if ( n%2 == 1 )\n        cout << \" Positive\
    \ odd number \\n\";\n}\nelse\n    cout << \" Negative number or zero\\n\";\n```\n\
    \n#### Defining variables in if statements\n\nA variable can be defined within\
    \ the if statement and used for initialization. If the variable is converted to\
    \ a `bool` type and returns the value true, then the expression in if statement\
    \ will also be true.\n\nExample: `if ( int x = func ( ) ){ . . . }`\n\nThe variable\
    \ `x` in the example is initialized by the result of the function `func()`. For\
    \ any value other than 0, the statement in the block is evaluated and executed.\
    \ Once the program leaves the if statement, the variable `x` is no longer used.\n\
    \n### Else-If Chains\n\nThe structural implementation of the else-if statement\
    \ is as follows:\n\n![](rsrc2YK.jpg)\n\nThe implementation of the else-if statement\
    \ has been demonstrated in the sample program shown below:\n\n```cpp\n// speed.cpp\n\
    // Output the fine for driving too fast.\n#include <iostream>\nusing namespace\
    \ std;\nint main(){\n    float limit, speed, toofast;\n    cout << \"\\nSpeed\
    \ limit: \";cin >> limit;\n    cout << \"\\nSpeed: \";cin >> speed;\n    if( (toofast\
    \ = speed – limit ) < 10)\n        cout << \"You were lucky!\" << endl;\n    else\
    \ if( toofast < 20)\n        cout << \"Fine payable: 40,-. Dollars\" << endl;\n\
    \    else if( toofast < 30)\n        cout << \"Fine payable: 80,-. Dollars\" <<\
    \ endl;\n    else\n        cout << \"Hand over your driver's license!\" << endl;\n\
    \    return 0;\n}\n```\n\n#### Layout and Program Flow\n\nIf a program has multiple\
    \ options to choose from, they can be executed selectively with the help of else-if\
    \ chains, which are a series of if-else statements embedded within. The layout\
    \ of these chains are:\n\n```\nif ( expression1 )\nstatement1\nelse if ( expression2\
    \ )\nstatement2\n...\nelse if ( expression(n) )\nstatement(n)\n[ else statement\
    \ (n+1)]\n```\n\nDuring the execution of the else-if chain, the expressions starting\
    \ from the first one (`expression1`) are evaluated one by one as specified in\
    \ the order. The first expression is verified, whether if it is true or false.\
    \ If it is true, then the statement following it is performed, and the chain is\
    \ terminated, but if it is false, the next expression is evaluated. If none of\
    \ the expressions return true, the else branch associated with the last `if statement`\
    \ is executed.\n\n#### Conditional Operators\n\nConditional operators `(?:)` can\
    \ be used as a concise alternative to the if-else statements. This selection mechanism\
    \ is based on the fact that one of the two given values in a statement is selected\
    \ as the output depending on the value of the associated condition.\n\nThe value\
    \ selected and produced in this kind of expression depends on whether the value\
    \ of condition is returned as true or false, and so, it is referred to as conditional\
    \ expression.\n\nSyntax: `expression ? expression1 : expression2`\n\nThe value\
    \ of the conditional expression will either be `expression1` or `expression2`.\
    \ The expression or given condition is evaluated first. If the result value is\
    \ returned as true, then `expression1` is selected and evaluated, but if the result\
    \ is false, then `expression2` is chosen for evaluation.\n\nExample: `z = ( a\
    \ >= 0 ) ? a : -a;`\n"
