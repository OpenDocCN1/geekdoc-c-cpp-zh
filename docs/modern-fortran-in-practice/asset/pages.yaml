  md: "# INTERFACING C: SQLITE AS AN EXAMPLE 81\n\nside, but is visible on the C side.\
    \ The routine sqlite3_do_c looks like this\nthe Fortran side:\n\n```\ninteger\
    \ function sqlite3_do_c( handle, command, errmsg )\n  integer, dimension(*) ::\
    \ handle\n  character(len=*) :: command\n  character(len=*) :: errmsg\nend function\
    \ sqlite3_do_c\n```\n\nOn the C side, the two hidden arguments are visible:\n\n\
    ```\nint FTCALL sqlite3_do_c(\n  sqlite3**db, char *command, char *errmsg,\n \
    \ int len_command, int len_errmsg) {\n}\n```\n\nWith some compilers, hidden arguments\
    \ are placed right after the string\nargument, while other compilers hidden arguments\
    \ are placed after all\nt regular arguments. The latter method seems to be the\
    \ most common.\nFinally, on Windows, there are two ways of cleaning up the stack\
    \ after return-\nfrom a subroutine or function: the \"cddecl\" method where the\
    \ callee is\nresponsible and the \"stdcall\" method where the callee takes care\
    \ of it. This\nsecond method appears to be deprecated, but is still used by many\
    \ libraries.\nit is important that the proper method is used, otherwise the stack\
    \ gets corrupted\nand the program will crash.\n\nWhile all other aspects of C-Fortran\
    \ interfacing can be handled in regular C or\nFortran code, the matter of this\
    \ calling convention has to be dealt with using\nFortran compiler directives or\
    \ non-standard C keywords:\n\n```\n#ifdef WIN32\n#define FTCALL _stdcall\n#endif\n\
    ```\n\nor (for the Intel Fortran compiler – the gfortran compiler has a very similar\n\
    method):\n\n```\n!$decl attributes stdcall :: myroutine\n```\n\nInterfacing C\
    \ and Fortran has become much easier in this case too with the\niso_c_binding\
    \ module of Fortran 2003. The preceding C routine can be\nreplaced by a Fortran\
    \ routine, but it is easier to leave the C version (see Section\n6.5 for the code).\
    \ The hidden arguments, however, can now be made explicit:\n\n```\ninterface\n\
    integer function sqlite3_do_c( handle, command, &\n  errmsg, len_errmsg ) :: iso_binding\n\
    \  use, intrinsic :: iso_c_binding\n```"
