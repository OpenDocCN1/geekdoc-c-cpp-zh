- pgno: 211
  md: '# 12.


    # Parallel Programming


    The ubiquity of computers with multiple processors and computers cooperating in
    some network has made parallel computing a mainstream subject. Up to the Fortran
    2008 standard, Fortran did not offer any language constructs for such a programming
    style. The two approaches that are most popular at the moment are message passing
    interface [83] (MPI) and open multiprocessing [14] (OpenMP). These two processes
    actually complement each other: MPI deals with different processes running on,
    possibly, different computers that communicate with one another explicitly and
    OpenMP is a method to run parts of a program in parallel (multiple threads), so
    there is only a single process running.


    Fortran 2008 introduces coarrays and supporting statements and intrinsic routines
    to enable a Fortran program to run multiple copies (called images) that interact.
    Sharing the data between these images is done transparently. It is the task of
    the compiler to insert the required data communication, not the programmers.


    This chapter discusses these forms and uses two examples: a program to find the
    first N prime numbers and a program that numerically solves a partial differential
    equation using several domains. Neither program is meant to be very practical,
    they merely illustrate the techniques involved.


    # 12.1 Prime Numbers


    Here is a straightforward program to determine the first 1000 prime numbers:


    ```

    program_primes_plain


    implicit none


    integer, dimension(1000) :: prime

    integer :: number_primes

    integer :: candidate

    integer :: residue

    integer :: J

    logical :: isprime


    number_primes = 0

    candidate = 2

    ```'
