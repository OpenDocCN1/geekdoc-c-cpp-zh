- pgno: 114
  md: '# GRAPHICS, GUIS, AND THE INTERNET 99


    possibilities and the user selects one. Based on that choice, the program does
    some processing and presents the next list of choices, or perhaps question, to
    get the value of a parameter. The program, however, dictates the order.


    With GUIs, the user sees all possibilities within one screen. He or she can decide
    to fill in all the entry fields in any order, leave out a few, then press one
    of a range of buttons, or select a menu item. This has distinct consequences for
    the architecture of a GUI program. The decision structure at the heart of a textual
    interface is not present anymore. Instead, the various parts of a GUI program
    need to respond to events such as the user presses the button “Run”, so the program
    gathers all information typed in the window and runs the computation. In the T/Tk
    example from the previous section, this is handled by associating the command
    putValue with the push button labeled “Run.” The value that the user enters is
    kept in a global variable parameter, as the entry widget and that variable are
    connected:


    ```

    entry .toprow.e -variable parameter

    ```


    In other GUI systems, you may have to read the contents of the window explicitly
    before running the computation.


    Another type of event is when the keyboard focus is set or lost in an entry widget.
    You can use this to check if the value that the user typed is acceptable. For
    example, is it a proper number?


    The structure of the program, therefore, will look like this:


    +   - An implicit event loop, where the program receives the events that describe
    the user’s actions. From the event loop, the routines associated with the events
    are called.

    - In many systems, the interface for these routines is fixed – you cannot pass
    an arbitrary list of arguments, and therefore, you need access to some global
    data structure.

    - A global data structure that is filled and read by the routines associated with
    the events.

    - A set of routines that are responsible for the appropriate actions based on
    the event. These routines have to be registered so that the event loop can dispatch
    each event to a routine.


    With some toolkits for building GUIs, routines for handling events receive all
    events for a particular window and, therefore, they have to handle all widgets
    inside that window. With other toolkits, routines may be associated with a particular
    widget or a particular type of event for the widget. The Software Development
    Kit (SDK) on Microsoft Windows, meant for


    > ² The widget is commonly used for elements of a GUI window. It refers to that
    element and the way it reacts to various events (mouse clicks, for instance).
    Another term is control.


    > ³ This is another example of the interface or environment problem, discussed
    in Chapter 5.'
  merge: -1
  img_proc: true
