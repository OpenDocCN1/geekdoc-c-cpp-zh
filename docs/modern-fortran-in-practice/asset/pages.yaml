- pgno: 50
  md: '# 4.


    # Memory Management


    The introduction of allocatable arrays and pointers has made it much easier to
    create programs that can adapt their memory requirements to the problem at hand.
    As a side effect though, memory management, in the sense of allocating and deallocating
    arrays, has become an issue that needs to be addressed.


    # 4.1 Flexible Arrays


    Fortran 90 and later provides three ways of creating arrays of flexible size:


    +   **Automatic arrays are created when a subroutine or function is entered and
    they are automatically destroyed when returning from the routine.** This type
    of arrays is perfectly suited for work arrays. The only drawback is that they
    are often created on the stack of the program and, therefore, they should not
    become too large.¹


    Something similar can be done with character strings: the length of local character
    variables in routines can be dynamic, as shown in Section 4.4.


    +   **Allocatable arrays require an explicit allocat statement, but as long as
    they do not have the same attribute, the compiler will clean them up on return
    from a routine (Fortran 95 on). Of course, you can deallocate such arrays if you
    no longer need them.


    +   **Pointers are the most flexible type of memory.** For instance, via a pointer
    you can select elements from an array that need not be contiguous:


    ```

    real, dimension(:,), allocatable, target :: array

    real, dimension(:,), pointer :: ptr


    allocate(array(20,20))

    ptr => array(1:20:5,3:4)

    ```


    The variable ptr would point to the elements array(1,3), array(6,3), and so forth
    as:


    ```

    ptr(1,1) => array(1,3)

    ptr(2,1) => array(6,3)

    ...

    ptr(1,2) => array(1,4)

    ptr(2,2) => array(6,4)

    ```


    > ¹ Some compilers offer options to control how arrays are allocated, either from
    the stack (faster) or from the heap (more robust).'
  merge: -1
  img_proc: true
- pgno: 51
  md: "# MODERN FORTRAN IN PRACTICE\n\nHowever, because a pointer can also point to\
    \ memory, or auto-matic memory, it is very difficult and often impossible for\
    \ the compiler to determine if it is safe to deallocate the memory that is being\
    \ pointed to by such variables. In other words, if you use pointer variables,\
    \ you are yourself responsible for cleaning up the memory.\n\nFrom Fortran 2003\
    \ onwards, there are two more methods to consider: character strings with an allocatable\
    \ length and parametrized types.\n\nIn the remainder of this chapter, various\
    \ aspects of the previous types of arrays are discussed.\n\n# 4.2 Memory Leaks\
    \ with Pointers\n\nIn the following fragment, the memory allocated via the pointer\
    \ variable ptr becomes unavailable, because the pointer disappears upon return\
    \ from the routine:\n\n```\nsubroutine alloc_and_forget( amount )\n  integer ::\
    \ amount\n\nreal, dimension(:), pointer :: ptr ! Local variable!\n\nallocate(\
    \ ptr(amount) )\nend subroutine alloc_and_forget\n```\n\nSuch a memory leak can\
    \ be very difficult to find, and if this routine is called often, more and more\
    \ memory gets allocated and becomes unavailable until, finally, all is lost.\n\
    \nTools exist that can detect this type of problem, such as valgrind (see Appendix\
    \ A). However, in some circumstances it is not easy to prevent them, for instance,\
    \ with derived types that have pointer or allocatable components (see Section\
    \ 4.8).\n\n# 4.3 Extending an Array\n\nQuite you need to grow an array as more\
    \ and more values are added, such as when reading input data. Until Fortran 2003,\
    \ one way to do this is:\n\n+   - Create a pointer to an array of the new size.\n\
    - Copy the contents of the old array into the temporary one.\n- Deallocate the\
    \ old array and make it point to the temporary one.\n\nIn actual code, this looks\
    \ like:\n\n```\nreal, dimension(:), pointer :: array, tmp\ninteger :: newsize,\
    \ oldsize\n```"
  merge: -1
