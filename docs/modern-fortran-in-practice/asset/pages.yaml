  md: "# INTERFACING C: SQLITE AS AN EXAMPLE 85\n\nOnce the row data has been retrieved,\
    \ another function takes care of extracting the correct data for a particular\
    \ field, which again requires a routine from the iso_c_binding module:\n\n```\n\
    ! Get a field from a row.\nmyfortran_get_field(row, ind ::)\ntype(myfortran_row),\
    \ intent(in) :: row\ninteger, intent(in) :: ind\ncharacter(len=row%/lengths(ind))\
    \ :: myfortran_get_field\n\ntype(c_ptr), pointer :: cstrs(:)\ncharacter(kind=c_char),\
    \ pointer :: cstr(:)\ninteger :: i\n\n    call c_f_pointer(row%/c_row, cstrs,\
    \ shape(lengths))\n    call c_f_pointer(cstr(ind), cstr, (row%/lengths(ind)/ )\n\
    ```\n\n```\ndo i = 1, row%/lengths(ind)\n    myfortran_get_field(i:i) = cstr(i)\n\
    end do\n```\n\nmyfortran_get_field\n\n# 6.5 Interfacing to SQLite\n\nSQLite is\
    \ a well-known source database management system developed by Richard Hipp [44].\
    \ It actually consists of a single C library as works without a server. A simple\
    \ but typical scenario for working with SQLite is:\n\n+   - Open the database\
    \ (an ordinary file or a block of memory).\n- Run one or more SQL statements to\
    \ create a new table and fill it with data or select data from an existing set\
    \ of tables.\n- Close the file.\n\nThe goal of the fsqlite library is to work\
    \ with SQLite without having to know anything about SQL, although for more complicated\
    \ queries you would need to construct suitable SQL statements. More specifically,\
    \ fsqlite provides high-level routines to:\n\n+   - Connect to the database\n\
    - Create tables and query the structure of the tables\n- Select data from the\
    \ tables\n- Enter new data or delete existing data\n- Start and stop transactions\n\
    \nThe connection to the database is represented by a C pointer to an opaque data\
    \ structure. Executing SQL statements is at the heart of the library and these\
    \ statements are represented by a pointer to another opaque structure. For the\
    \ library to be usable from Fortran, you need to deal with these pointers."
  merge: -1
