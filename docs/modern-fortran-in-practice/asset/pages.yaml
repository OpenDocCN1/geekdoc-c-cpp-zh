- pgno: 253
  md: "# APPENDIX B: CAVEATS\n\n```\nreal :: param(3) = [1.0, 2.0, 3.0], result\n\
    call minim(param, mysub, result)\nend program main\n```\n\nIf you run the program,\
    \ the three numbers for the param array seem to contain rubbish: \n\nparam= 6.14149881E-39\
    \ NaN 3.93764868E-43\n\nThe problem is the use of an explicit-shape–real, intent\
    \ (in) :: param(3) – instead of an assumed-shape for the array param. This kind\
    \ of mismatch may or not be caught by the compiler, if not, it is probably hard\
    \ to spot in a more realistic program.\n\nSeeding the Random Number Generator\
    \ The routine random_number is convenient if you use pseudo-random numbers in\
    \ a program and you do not need to control the quality. Unfortunately, the standard\
    \ allows the compiler a lot of freedom where the random number generator is concerned:\n\
    \n+   - There is no guarantee as to the quality, even though compilers like a\
    \ very decent generator.\n- There is no guarantee that the generator is initialized\
    \ with different seeds at each run. Sometimes you will want that to happen and\
    \ sometimes not. If your program crucially depends on that behavior, you will\
    \ need to take care of it explicitly.\n\n+   - Taking care of the proper seeding\
    \ is not at all trivial. The routine random_seed is meant for this. Invoked without\
    \ any arguments, it resets the random number generator in a compiler-dependent\
    \ way. It also gives access to the array of values that is used internally by\
    \ the generator. The actual contents and size depend on the implementation, and\
    \ you have no guarantee that setting the array to a particular value or values\
    \ will give a good-quality series of random numbers.\n\n+   - The behavior of\
    \ the built-in random number generator in a multithreaded environment like OpenMP,\
    \ or when using coarrays. Ideally, you would get independent sequences that are\
    \ not guaranteed.\n\nWhen you need a high-quality random number generator and\
    \ detailed control over its behavior, the best solution is to use an implementation\
    \ that you can control. This is a recommendation that holds for, if not all, programming\
    \ languages. Luckily, there is a vast of literature over the subject [11], [46].\n\
    \nOpening the Same File Twice Sometimes it is convenient to open a file twice,\
    \ on different logical units, so that two parts of the program can process the\
    \ contents independently. Unfortunately, the Fortran standard does not allow that,\
    \ even when the files are opened for reading only. As a consequence, you will\
    \ have to implement a different solution:"
