    \  function sqlite3_column_count( stmt ) bind(C)\n    use, intrinsic      :: iso_c_binding\n\
    \    type(c_ptr), value :: stmt\n    integer(c_int)      :: sqlite3_column_count\n\
    \  end function sqlite3_column_count\nend interface\n```\n\nYou use the intrinsic\
    \ module iso_c_binding to fully describe the interface\non the Fortran side. This\
    \ makes it possible to call the function\nsqlite3_column_count directly, instead\
    \ of via an intermediate C function\nthat translates between the C and Fortran\
    \ data types and function names.\n(The original intermediate C function behaves\
    \ as a subroutine, but that is\nmerely a choice.)\n\n# 6.3 Naming and Calling\
    \ Conventions\n\nThe next hurdles in combining Fortran and C concern the internal\
    \ name of\nthe routine you will call and the calling convention. For the first\
    \ one, consider\nwhat should happen to a Fortran routine called MyRoutine:\n\n\
    ```\nsubroutine MyRoutine\n...\nend subroutine MyRoutine\n```\n\nAs Fortran does\
    \ not distinguish between lowercase and uppercase in variable\nnames and routine\
    \ names, the name as presented to the linker is translated to\\either lowercase\
    \ or uppercase, depending on the compiler.\nTo distinguish it from names in the\
    \ system libraries, an underscore may you use in\nthe Fortran code, the result\
    \ is that the name MyRoutine, MYROUTINE or myroutine_ (or some other variation).\
    \ Routines defined in a module generally get the name of the module\nprefixed,\
    \ so that the result might be module_mp_myroutine_. It is these\nnames that you\
    \ should use in the C code, unless you use the Fortran 2003\nnaming feature.\n\
    \nThe second issue, the calling convention, is more obscure. It touches upon\n\
    row-level features of passing arguments and managing the memory involved\n(the\
    \ stack). First, to pass a character string, most Fortran compilers insert an\n\
    argument holding the length of the string that is not visible on the Fortran"
