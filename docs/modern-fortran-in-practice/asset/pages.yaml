- pgno: 98
  md: "# INTERFACING TO C: SQLITE AS AN EXAMPLE\n\nBecause Fortran pointers are actually\
    \ a very different concept than C pointers and the allocation of arrays must be\
    \ done in a consistent way, there are a number of restrictions.The most important\
    \ are:\n\n+   - The components of a derived type cannot have the pointer or allocatable\
    \ attributes, or a derived type that in turn has components.\n- There cannot be\
    \ any type-bound procedures.\n\nTo deal with pointers and allocatable arrays,\
    \ you can use routines such as c_loc() to get the C address of a Fortran variable\
    \ (including pointers and allocatables) or c_f_pointer() to convert a C address\
    \ (C pointer) to a Fortran pointer.\n\nHere is a simple example. The C struct\n\
    \n```\ntypedef struct {\n  int number;\n  char name[10];\n  float *array;\n} struct;\n\
    ```\n\ncan be represented in Fortran as:\n\n```\nuse iso_binding_c\ntype(C) ::\
    \ mystruc\n  integer(c_int) :: number\n  character(c_char), dimension(10) :: name\n\
    \  type(c_ptr) :: array\nend type mystruc\n```\n\nThe component array is not recognizable\
    \ as an array of reals on the Fortran side, so you will have to take special care,\
    \ as illustrated in the following.\n\nHere are several fragments of a library\
    \ written by Daniel Kraft to interface with the MySQL database management system\
    \ ([57]), the layout has been adjusted to the style used in this book. It uses\
    \ the iso_binding module to completely interface this interface in Fortran. Data\
    \ are stored in dedicated types, such as:\n\n```\ntype myfortran_row :: num_fields\n\
    \  integer\n  integer, allocatable :: lengths(:)\n  type(c_ptr) :: c_row\nend\
    \ type myfortran_row\n```\n\n> ³ Work is being done on an extension of the interfacing\
    \ facilities that will relieve many of these restrictions [12]."
  merge: -1
  img_proc: true
