  md: "The value of the variable r is 0.0, not 0.33333..., as the two integers divided\
    \ first, yielding a new integer. Then that integer is converted to a real. The\
    \ same separation of concern holds for array operations:\n\n```\ninteger, dimension(10)\
    \ :: array\narray = 2 * array(10:1:-1)\n```\n\nThis statement is executed (at\
    \ least conceptually) as:\n\n```\ninteger, dimension(10) :: array\ninteger, dimension(10)\
    \ :: tmp\ninteger :: 1\n```\n\n```\n! First evaluate the right-hand side and store\
    \ the result\n! in a temporary array\ndo i = 1,10\n  tmp(i) = 2 * array(11-i)\n\
    enddo\n```\n\n```\n! Now copy the right-hand side into the array left of the\n\
    ! equal sign\ndo i = 1,10\n  array(i) = tmp(i)\nenddo\n```\n\nThis means that\
    \ code like the preceding simply works, even though the right-hand side involves\
    \ the same array elements as the left-hand side, but in a different order."
