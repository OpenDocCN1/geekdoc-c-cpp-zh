    \ assignx( item1, item2 )\n    import sortable\n    class(sortable), intent(inout)\
    \ :: item1\n    class(sortable), intent(in) :: item2\n  end subroutine assignx\n\
    end interface\n```\n\ncontains\n\n```\nsubroutine sort( array )\n  class(sortable),\
    \ dimension(:), &\n    intent(inout), target :: array\n```\n\n```\nclass(sortable),\
    \ allocatable :: tmp\nclass(sortable), pointer :: first_element\n```\n\n```\n\
    integer :: i, j\n```\n\n```\n!\n! Allocate the temporary variable such that it\
