    # A.4 Run-Time Checking


    Memory leaks are especially unusual for long-running programs as the memory that
    is no longer reachable accumulates. While the compiler can insert runtime checks
    for array bounds, keeping track of the allocated and deallocated memory is a completely
    separate problem.

    Most compilers do not do this, unless you specify extra options. The g95 compiler
    provides over by default [80], but the valgrind utility [75] gives more detailed
    information about where in the program memory was allocated that was not deallocated
    afterwards. It reports array bound violations. The following sample program contains
    an easy to spot memory leak and an array bound violation:


    ```

    program test_valgrind


    integer, dimension(:), pointer :: data


    allocate( data(100) )

    ```'
