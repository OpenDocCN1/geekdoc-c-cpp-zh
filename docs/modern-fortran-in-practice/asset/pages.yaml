- pgno: 14
  md: '# # Preface


    I have am been programming in Fortran for more than 25 years, first in FORTRAN
    IV and somewhat later in FORTRAN 77. In the last decade of the 20th century, I
    attended, together with a number of colleagues, a course on Fortran 90, given
    by the late Jan Oosterwijk at the Technical University of Delft. It was also during
    this time that I came to know the comp.lang.fortran newsgroup, and I have learned
    a lot by participating in that friendly community.


    In a way, I am a typical Fortran programmer. My background is physics and I learned
    the task of programming during my study, but mostly on the job. In other ways,
    I am not because I took a fancy to the more esoteric possibilities of programming
    in general and sought to apply them in Fortran. I also began writing articles
    for the *ACM Fortran Forum*. These articles are the groundwork for this book.


    This book will not teach you to program in Fortran. There are plenty of books
    dedicated to that ([22], [65]). Instead, the purpose of this book is to show how
    modern Fortran can be used for modern programming problems, as how techniques
    made popular in the world of object-oriented languages C++ and Java fit neatly
    into Fortran as it exists today. It even shows some techniques for solving certain
    programming problems that are not easily achieved in these languages.


    If you know Fortran mainly from the days before Fortran 90, you may find the first
    few chapters to be a gentle introduction to array operations, overloaded operations,
    and other features that were introduced by that standard. You will find that Fortran
    has also opened the way to completely different styles of programming, normally
    associated with functional programming languages. Most chapters are illustrating
    how all of these language features can be employed in practice.


    In this book, I often refer to software I have written myself and published via
    the *SourceForge* website or to software I am involved in some other way. This
    is not to promote particular software over anything else — it is merely a consequence
    of knowing that software very well. I have tried to attribute all of the examples
    that are not my own to the people who have written them. However, as I am only
    human, I may have forgotten one or two names.


    A book like this can hardly come into existence. Besides Michael Metcalf and Ian
    Chivers, the editors of the *ACM Fortran Forum*, and many people who participate
    in the comp.lang.fortran newsgroup, I am indebted to'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'at least the following people, in no particular order: Bil Kleb, Paul van Delst,
    Rolf Ade, Henry Gardner, Simon Geard, Richard Suchenwirth, Daniel Kraft, Richard
    Maine, Steve Lionel, Cameron Laird, and Clif Flynt. I thank them for their discussions,
    reviewing my contributions, and bringing various aspects of programming, directly
