    # MPI


    Using MPI, you end up with a program that is largely similar, but it is the details
    that are important:


    +   - You explicitly send the data to the other domain, but without waiting for
    that domain to pick them up. This asynchronous sending is achieved with the MPI_Isend()
    routine.


    +   - You cannot continue until receiving the data from the other domain, however,
    the synchronize routine MPI_Recv() to wait for the data. This means that you synchronize
    the two copies automatically because there is no need for an explicit synchronization.


    +   - Every copy has its own memory space, so simply allocate the two-dimensional
    array that holds the temperature and the one-dimensional array that is used to
