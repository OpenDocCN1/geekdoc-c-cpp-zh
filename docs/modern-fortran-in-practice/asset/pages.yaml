    # 11.6 Design Patterns


    While design patterns have been described mostly in the context of program-

    anguages as C++ and Java, the principles involved are quite

    unversal [35], [28]. Design patterns try to capture the essence of common

    solutions to a wide range of software problems. Rouson, Xia and Xu [34]

    compare implementations in Fortran 2003 and C++ of a number of design

    patterns. There are quite well-known, others are domain-specific, therefore,

    they are particularly useful in, for physical simulations.


    The following considers two examples only, the Factory pattern and the

    Observer pattern, to illustrate how design patterns can be applied in a Fortran

    program [see [54] and [73]] for some other examples.


    # The Factory Pattern


    One popular design pattern in object-oriented programming is the so-called

    factory pattern. The idea behind this is that a program may need one

    or more objects of a certain type, but it should not take the responsibility of

    properly initializing or managing objects, if it takes more than merely

    creating it, [9]. Proper initialization or management include tasks like:


    +   - Allocating memory for its components.

    - Setting initial values.

    - Opening a file and reading its contents if that is part of how the object

    works.

    - The object may be part of a pool of objects and then managing the associated

    resources should be done consistently.


    Another use of the factory pattern is to allow the using program to handle a\generic
    object rather than an object of a specific type. Here is an example: The

    program requests an object that generates a pseudo-random number, either

    with a uniform or an exponential distribution. The creation function returns

    polymorphic object that behaves as either type. It is completely transparent

    to the program, so extending the set of pseudo-random number generators

    with generators to support new distributions has no effect on its source code,

    except perhaps that a new type becomes:'
