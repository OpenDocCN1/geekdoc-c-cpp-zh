    \ )\n\ncall sqlite3_column_props(col(1), 'station', sqlite_char, 10 )\ncall sqlite3_column_props(col(2),\
    \ 'date', sqlite_char, 10 )\ncall sqlite3_column_props(col(3), 'salinity', sqlite_real\
    \ )\ncall sqlite3_column_props(col(4), 'temperature', sqlite_real)\n```\n\n```\n\
    call sqlite3_create_table(db, 'measurements', )\n```\n\nTo get data from the database\
    \ or store new data, you also use the sqlite_binding technique\nto communicate\
    \ the values back and forth rather than via arguments, which would\nbe awkward\
    \ as the types and the number of data will vary per query or\nper table. Therefore,\
    \ it stores the addresses of the variables that (will) hold the\ndata. These variables\
    \ may not be local variables in a subroutine, as these\nto exist as soon as you\
    \ run from the subroutine. Instead, the fields in\nsqlite_column type (extracted\
    \ from the sqlite3_insert routine):\n\n> !\nPrepare the insert statement for this\
    \ table\n! (The question marks the bound variables)\n!\n\n```\nwrite(command,\
