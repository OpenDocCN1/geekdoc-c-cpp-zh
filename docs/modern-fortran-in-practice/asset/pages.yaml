- pgno: 94
  md: "# INTERFACING TO C: SQLITE AS AN EXAMPLE 79\n\n# 6.2 Passing Arguments Between\
    \ C and Fortran Routines\n\nBasically speaking, Fortran (up to Fortran 2003) passes\
    \ all arguments by reference and C passes all arguments by value (even with arrays\
    \ and pointers, the address is passed as the value and by dereferencing that address\
    \ you can manipulate the memory contents). In Fortran 2003, you can select the\
    \ method of passing primarily to make interface C easier, but it has its merits\
    \ within a Fortran-only context too ([65], Section 14.6).\n\nThe result of this\
    \ difference in argument passing is that you need to have an intermediate routine\
    \ in C to accommodate for the mismatch. Here is an example from the sqlite library.\
    \ The routine sqlite3_column_count_c is used to get the number of database columns\
    \ that will be returned in a query. On the Fortran side, it has interface:\n\n\
    ```\ninterface\n  subroutine sqlite3_column_count_c( handle, count )\n    integer,\
    \ dimension(*) :: handle\n    integer :: count\n  end subroutine sqlite3_column_count_c\n\
    end interface\n```\n\nThe first argument is actually a pointer to an opaque structure\
    \ of sqlite3_stmt, defined by the SQLite library. On the Fortran side, it is mapped\
    \ to a one-dimensional array of length 2, to accommodate for both 32-bits and\
    \ 64-bits platforms. The interface presents the Fortran 2003 standard, otherwise\
    \ the type type type(c_ptr) would have the method of choice. On the C side, you\
    \ get the start address of this array, but as it actually represents a pointer,\
    \ you need two-level indirection (the double asterisk):\n\n```\nvoid FTNCALL sqlite3_column_count_c(\n\
    \  sqlite3_stmt **stmt,\n  int\n  *count = sqlite3_column_count( *stmt );\n  return;\n\
    ) {\n```\n\nThe plain integer argument count on the Fortran side turns into a\
    \ pointer to an int value. As you need to return a value via that argument, this\
    \ is quite appropriate.\n\n> The macro FTNCALL is used to get the calling convention\
    \ correct and the extra underscore is to do with naming conventions (the next\
    \ section)."
  merge: -1
