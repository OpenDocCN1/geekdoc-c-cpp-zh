  md: "# ROBUST IMPLEMENTATION OF SEVERAL SIMPLE ALGORITHMS 137\n\noptions. Some of\
    \ these consequences are actually visible in the results of the sample programs\
    \ given here.\n\n# 10.2 Linear Interpolation\n\nThe first algorithm to consider\
    \ is linear interpolation. The values of the mathematics is simple enough: given\
    \ an interval [a,b] and the values of a function $f$ at the endpoints $a$ and\
    \ $b$ to be estimated at a point $x$ within that interval, estimate the value\
    \ at $x$ to be:\n\n```\n$f(x) \\approx f(a) + \\frac{(x-a)}{(b-a)}(f(b)-f(a))\
    \ \\quad (10.1)$\n```\n\nIn practice, you have several such intervals. This leads\
    \ to a straightforward implementation like:\n\n```\nmodule interpolation_methods\n\
    \  contains\n  real function interpolate( x, y, xp )\n    real, dimension(:),\
    \ intent(in) :: x, y\n    real, intent(in) :: xp\n    integer :: i, idx\n    !\n\
    \    ! Search for the interval that contains xp\n    !\n    idx = size(x) - 1\n\
    \    do i = 2,size(x)-1\n      if ( xp < x(i) ) then\n        idx = i - 1\n  \
    \      exit\n      endif\n    enddo\n    !\n    ! Estimate the function value\n\
    \    !\n    interpolate = y(idx) + (xp-x(idx)) * (y(idx+1)-y(idx)) / (x(idx+1)-x(idx))\n\
    \  end function interpolate\nend module interpolation_methods\n```"
