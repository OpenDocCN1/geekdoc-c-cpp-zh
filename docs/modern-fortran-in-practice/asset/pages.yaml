    # 8.3 Design and Implementation


    One of the design goals of the Fnitun framework is to make it possible to have
    the code for testing close to the actual program code. Experiences with another
    framework I developed show separating the test code from the actual program makes
    the test code hard to maintain.


    Another goal is to have Fortran as much as possible, and as a consequence you
    can keep the test code inside the program. The test code is only run if a'
