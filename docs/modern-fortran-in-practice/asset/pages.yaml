    The assertion routine prints if there are elements in the two arrays that do not
    match and records the fact that this assertion failed.

    To run the routines, you put these routines (and several others) in a separate
    routine and call them indirectly via the routine test, which is part of the framework.


    subroutine test_all


    ```

    call test( test_trivial, &

    "Solve trivial system a=0, b=3, c=0, d=1" )

    call test( test_basic, &

    "Solve basic system a=0, b=6, c=-5, d=1" )

    call test( test_diagonal_dom1, &

