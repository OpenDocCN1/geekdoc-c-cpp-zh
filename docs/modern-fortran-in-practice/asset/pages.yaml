  md: "# 158 MODERN FORTRAN IN PRACTICE\n\n5. If you have the maximum number of function\
    \ evaluations, stop the procedure: no convergence. If you have not reached the\
    \ maximum yet, go back to step 2.\n\nThe implementation uses the number of function\
    \ evaluations as the cancellation criterion, because evaluating the function is\
    \ generally the most expensive step.\n\nHere is an implementation:\n\n```\n! robust_newton.f90\
    \ --\n! Robust version of the Newton-Raphson method\n!\nmodule robust_newton\n\
    \nimplicit none\n\ninteger, parameter :: bracketed_root = 1\ninteger, parameter\
    \ :: small_value_solution = 2\ninteger, parameter :: convergence_reached = 3\n\
    integer, parameter :: invalid_start_value = -1\ninteger, parameter :: no_convergence\
    \ = -2\ninteger, parameter :: invalid_arguments = -3\n```\n\n```\ncontains\n\n\
