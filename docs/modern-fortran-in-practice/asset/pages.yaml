    # 12.2 Domain Decomposition


    The second example demonstrates how parallel computing is used to solve partial
    differential equations (PDE). Consider a typical situation the heat exchange in
    a beam of metal. The equation you need to solve, together with its boundary conditions
    is (see Figure 12.1):


    | $\frac{\partial T}{\partial t} = a\nabla^2 T$ | (12.1) |

    | $t = 0 : T = 0$ | (initial condition) | (12.2) |

    | $x = 0$ or $L : T = 1$ | (Dirichlet) | (12.3) |

    | $y = 0$ or $B : \frac{\partial T}{\partial y} = 0$ | (Neumann) | (12.4) |


    > For simplicity, you will assume a two-dimensional geometry, rather than a three-dimensional
    one.'
