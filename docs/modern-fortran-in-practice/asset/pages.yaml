- pgno: 247
  md: '# # Appendix B


    # # Caveats


    Programming languages – and programming environments – all have their share of
    surprising features. This appendix attempts to describe the most important ones
    in Fortran. Not all caveats that appear here are part of the language. Some arise
    when you use dynamic libraries (DLLs), others are still surprising when you compare
    Fortran with other programming languages.


    # ## B.1 Details of the Standard


    **Short-Circuiting Logical Expressions** In languages like C/C++, or Java, you
    can rely on the so-called short-circuiting of logical expressions:


    ```

    if ( pointer != NULL && pointer[0] == 1 ) {

    ...

    }

    ```


    The expression consists of two parts: Check that the pointer variable referring
    to some memory and check that the value at the first location has a particular
    value. If the first condition is *not* satisfied, it is not necessary to check
    the second condition. (It would actually lead to a crash of the program). Therefore,
    the compound expression is evaluated as if:


    ```

    if ( pointer != NULL ) {

    if ( pointer[0] == 1 ) {

    ...

    }

    }

    ```


    The Fortran standard does *not* guarantee this, but it leaves it up to the compiler.
    The reason: efficiency. On modern computers, evaluating both parts and then deciding
    the outcome can be much faster than the stepwise evaluation that short-circuiting
    requires. If the expressions get more complicated, the number of tests required
    to ensure short-circuiting will increase as does the object code.


    **Saving Local Variables** While the Fortran language explicitly states (from
    least FORTRAN 77 onward), that locals in a routine do not retain their values
    between calls, unless they have the `save` attribute, some compilers will put
    them in static memory, because it is more efficient on that platform.'
  merge: -1
  img_proc: true
- pgno: 248
  md: "To avoid problems when moving to a different compiler, always explicitly use\
    \ the save attribute. For instance:\n\n```\nsubroutine print_data( data )\n  real,\
    \ dimension(:) :: data\n\n  logical      :: first = .true.\n  integer      ::\
    \ count\n\nif ( first ) then\n  first = .false.\n  count = 0\nendif\n```\n\n```\n\
    count = count + 1\nwrite(**) 'Page: ', count\nwrite(**) data\nend subroutine\n\
    ```\n\nThis routine may or may not work. It relies on the variable count retaining\
    \ its value. By using the save attribute, you make this portable and you document\
    \ the expectations:\n\n```\nsubroutine print_data( data )\n...\n  logical, save\
    \  :: first = .true.\n  integer, save  :: count\nend subroutine\n```\n\nThe variable\
    \ first implicitly has the save attribute, because of the initialization to .true.,\
    \ but for the sake of clarity, you should use that attribute for its declaration\
    \ as well.\n\n**More on Initialization** For programmers used to C and related\
    \ languages, it may come as a surprise that a statement like:\n\n```\nreal ::\
    \ x = 3.3\n```\n\nin a subroutine or function is not executed each time the routine\
    \ is entered. Rather than a short-cut for:\n\n```\nreal :: x\nx = 3.3\n```"
  merge: -1
  img_proc: true
- pgno: 249
  md: '# APPENDIX B: CAVEATS


    as it is in C, this statement has a two-fold effect in Fortran:


    +   - The variable x implicitly gets the save attribute: It will retain whatever
    value it has between calls.

    - The variable x is guaranteed to have the value 3.3 at the start of the program.
    Which brings another feature, variables in Fortran are not initialized by default.
    Their value is undefined, unless some form of initialization is used or their
    value is set by assignment.


    # Double Precision and Evaluating Right-Hand Side There is a very strict principle
    in Fortran: The right-hand side is evaluated without regard to the left-hand side.
    The rationale is that it is much easier to reason about what a statement means,
    and, in some cases, there is no left-hand side that could be used to determine
    the precision or the size of the result:


    ```

    write(*), 1.1d0 * 10

    ```


    In this statement, the precision of the result, and the number that is written
    to the file, is dictated by the operands alone. The integer is promoted to double
    precision and the final result is a double precision number.

    The first part holds for this assignment as well:


    ```

    real :: x

    x = 1.1d0 * 10

    ```


    The expression on the right-hand side is computed using double precision. Only
    on assigning the result to the single-precision variable x, it is converted to
    single precision.

    This consistent rule presents some surprises:


    ```

    real(kind=kind(1.d00)) :: x

    x = 1.11111111111111111111111111111111

    ```


    The value of x is not as accurate as the code suggests: The number appearing on
    the right may have a lot of digits, but it is still a single-precision number.
    Therefore, the value of x is the double-precision equivalent of that single-precision
    value.


    # Passing the Same Argument Twice Consider the following code fragments:


    ```

    integer :: x, y

    x = 1

    y = 2

    call add( x, x, x, y )

    ```'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# APPENDIX B: CAVEATS 235


    Here is the implementation of the subroutine add:


    ```

    subroutine add( a, b, c )

    integer :: a, b, c

    b = b + a

    c = c + a

    end subroutine add

    ```


    Because the dummy arguments a and b are both associated with the actual argument
    x, y might expect the output to be: x = 2 (twice the original value), y = 4. The
    result may very well be: x = 2, y = 3.


    The reason is that the compiler does not need to assume that aliasing can occur.
    In particular, it means that in a simple piece of code like this, the value of
    a can be left in a register (for fast access) and, therefore, b and c are increased
    by 1, the original value.


    However, you do not know if this will fact occur or not, it depends on the details
    of the code and the compiler. Therefore, you should avoid this kind of programming.


    If the variables involved the pointer attribute or the target attribute, then
    the compiler must take the possibility of aliasing into account. In that case,
    then manner of optimizations are impossible.


    For instance, the fragment:


    ```

    real, dimension(:), pointer :: a, b

    a = b

    ```


    has to be evaluated in a way equivalent to:


    ```

    real, dimension(:), pointer :: a, b

    real, dimension(:), allocable :: tmp

    ```


    ```

    allocate( tmp(size(a)) )

    ```


    ```

    tmp = b

    a = tmp

    ```


    ```

    deallocate( tmp )

    ```


    as b might be pointing partially to the same memory as a:


    ```

    real, dimension(100), target :: data

    real, dimension(:), pointer :: a, b

    ```


    ```

    a => data( 1:50)

    b => data(26:75)

    ```'
  merge: -1
  img_proc: true
- pgno: 251
  md: "# 236 APPENDIX B: CAVEATS\n\nREAL(4) While many compilers use kind numbers\
    \ that indicate how many bytes a particular type of real or integer occupies,\
    \ this is by no means universal. Kind numbers are any positive number that uniquely\
    \ identifies all properties of the associated type for that particular compiler.\n\
    \nThe scheme where the kind number equals the number of bytes breaks down with\
    \ complex numbers: The kind number is related to the underlying real values, rather\
    \ than four bytes, a complex(4) often occupies two times four bytes. Then, there\
    \ are computers whose hardware supports two or more kinds of reals occupying the\
    \ same number of bytes, for instance, kind adhering to the IEEE 754 format and\
    \ a native format that is faster for that particular hardware.\n\nAn additional\
    \ drawback of hard coding these numbers is that you cannot easily switch to a\
    \ different precision: you have to constantly change the “4” into an “8” to get\
    \ double precision.\n\nSimply put, use your parameters, like the kind() and selected_real_kind()\
    \ functions to get the kind number.\n\n# End-of-file, Output to the Screen, and\
    \ Others\n\nValues to indicate “End of file” and the logical unit for pre-connected\
    \ files, such as output to the screen or input from the keyboard, have traditionally\
    \ been associated with numbers -1, 6 or 5 respectively. These values, while ubiquitous,\
    \ are not portable.\n\nThe best way to deal with them is to avoid specific values\
    \ altogether (“End of file” is always indicated by a negative number, other read\
    \ errors are indicated by a positive value, while an asterisk refers to the output\
    \ to screen or input from the keyboard.) If that is not possible, then intrinsics\
    \ iso_fortran_env module, introduced in Fortran 2003, contains parameters that\
    \ can be used instead: iostat_end for the “end of file” condition, output_unit,\
    \ and input_unit for the LU numbers.\n\nAnother quantity that may vary from one\
    \ compiler to the next (it may be influenced by the compiler options) is the unit\
    \ in which the record length for direct-access files expires. This unit can be\
    \ a single byte or a single word, and is often four bytes. The parameter file_storage_size\
    \ in the intrinsic iso_fortran_env module provides the size of this unit in bits.\n\
    \n# External and Intrinsic Routines\n\nAccording to the standard, user-defined\
    \ routines are to be declared as external to avoid possible conflicts with intrinsic\
    \ routines, defined in the standard or as an extension in the compiler. You may\
    \ be in for a surprise with the following program if you do not know dim() is\
    \ a standard intrinsic function:\n\n```\nreal function dim( x, y )\n  real ::\
    \ x, y\n```"
  merge: -1
  img_proc: true
