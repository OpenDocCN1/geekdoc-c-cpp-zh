    a = b .concat. c\n```\n\nThe derived type and its associated operations are implemented\
    \ in the following module.\n\n```\nmodule chains\ntype chain\n  integer, dimension(:),\
    \ pointer :: null()\nend type chain\n```\n\n```\ninterface assignment(=)\n  module\
    \ procedure assign_chain\n  module procedure assign_array\nend interface assignment(=)\n\
    ```\n\n```\ninterface operator(.concat)\n  module procedure concat_chain\nend\
    \ interface operator(.concat)\n```\n\n> 5 List and Car, describe a general reference\
