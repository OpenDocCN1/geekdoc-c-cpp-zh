  md: "# 54 MODERN FORTRAN IN PRACTICE\n\nFORTRAN 77, however, does offer a somewhat\
    \ obscure facility, the entry statement, which could be exploited here:\n\n```\n\
    c\nc Define the function\nc\n    real function f( x )\n    real x\n\n    logical\
    \ a\n    real b\n    save a, b\n\n    f = exp(-a*x) * cos(b*x)\n\n    return\n\
    \nc Provide access to the parameters A and B\nc (Set the value of the function\
    \ f - a synonym for\nc the function setab c for good form)\nc\n    entry setab(\
    \ ain, bin )\n    real ain, bin\n    a = ain\n    b = bin\n    f = 0.0\n    end\n\
    ```\n\nThis allows access to the variables a and b by means of the alternative\
    \ interface defined by the entry statement [62]. It can be used as follows:\n\n\
    ```\nprogram integrate_function\n\nreal xmin, xmax, result, dummy\n    integer\
    \ steps\n    external f\n\nc Set the parameters before calling the integration\
    \ routine\nc (setab is formally a function, just as f is, so call it as\nc a function)\n\
    c\n    dummy = setab(1.0, 2.0 )\n\n    xmin = 0.0\n    xmax = 10.0\n    steps\
    \ = 10\n```"
