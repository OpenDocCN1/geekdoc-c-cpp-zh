- pgno: 63
  md: "# 4.9 Performance and Memory Access\n\nAnother form of memory management is\
    \ how you access the memory. In modern computers, and, in fact, this has been\
    \ the case for several decades, as witnessed by a 1982 book by Metcalf [60], the\
    \ locality of memory access is quite often the foremost important factor in the\
    \ comparison to the rate of (numerical) operations. This is due to the relative\
    \ slowness of memory access compared to the rate. The hardware solution is to\
    \ have several levels of cache with different sizes and speeds. It is the compiler's\
    \ task to efficiently use these caches, so that the data on which the operations\
    \ occur are as fast as possible [7], [32].\n\nThe programmer can help by carefully\
    \ considering the access patterns. The following program accesses the matrix elements\
    \ in three different rows and columns [31]:\n\n```\nprogram measure_matrix\nimplicit\
    \ none\ndouble complex, allocatable :: a(:)\ninteger               :: i, j, l,\
