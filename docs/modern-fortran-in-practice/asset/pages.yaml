    \ need\nto look at a few hundred lines. Two related routines be thousands of lines\n\
    apart. Therefore, a conscientious organization of the code in files, directories,\\\
    and subdirectories is as important as getting the program to work.\n\nWithin the\
    \ code, if you decide to use both uppercase and lowercase letters\n(such as all\
    \ keywords are capitalized), do so consistently. It does not matter to\nthe compiler,\
    \ but it does to the human eye.\n\nThen, there is the complexity of the code itself\
    \ to consider:\n\n+   - If a routine has a lot of tasks, is it necessary to do\
    \ all of them in one\nroutine? Can you split it or add an extra level of routines?\
    \ This will make\nthe structure clearer.\n\n+   - Routines with a lot of tasks\
    \ tend to require a number of argument lists and\nlines of code. Understanding\
    \ them and verifying that the correct arguments\nare passed is tedious and error-prone\
    \ work.\n\n+   - Common subexpressions that are often repeated have a number of\
    \ draw-\nbacks:\n\n+   - Unless the compiler recognizes them, they need to be\
    \ computed every\ntime.\n importantly, if you make a mistake or if the subexpression\
    \ changes\nfor another reason, you must change it in several places. It is easy\
    \ to\nforget one.\nThe code is more difficult to read, so you must recognize that\
    \ parts of\nthe expressions are the same.\n\nStore the result in an extra variable\
    \ and use that instead, or if the expressions\nare similar, but not identical\
    \ (differing in one or two variables), it may help\nuse small functions.\n\n+\
    \   - Sometimes just routines are repeated, while groups of state-\nments. A function\
    \ or a subroutine is probably a better solution, as it\nhighlights the role of\
    \ that group of statements and allows you to concentrate\nthe code in one place,\
    \ making it easier to consistently correct any bugs or\nimplement an improvement\
    \ or an extension."
