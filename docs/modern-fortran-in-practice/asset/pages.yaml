    \ point, factor )\n  type(point2d), intent(in) :: point, vector\n  real, intent(in)\
    \              :: factor\n\n  scale_by_factor%x = factor * point%x\n  scale_by_factor%y\
    \ = factor * point%y\nend function scale_by_factor\n\nend module points2d\n```\n\
    \nThese procedures (with one modification) can also be bound to the type:\n\n\
    ```\ntype point2d\n  real :: x, y\ncontains\n  procedure :: add => add_vector\n\
