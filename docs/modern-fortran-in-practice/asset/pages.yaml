    \ |\n| 34 | 0.172 | 66 | 0.219 | 130 | 0.266 | 258 | 0.266 | 514 | 0.687 |\n|\
    \ 35 | 0.141 | 67 | 0.219 | 131 | 0.250 | 259 | 0.281 | 515 | 0.657 |\n| 36 |\
    \ 0.156 | 68 | 0.219 | 132 | 0.266 | 260 | 0.281 | 516 | 0.640 |\n\n```\ncontains\n\
    subroutine test( a, m, n )\n  ! goes through a in \"wrong\" order\n  integer\n\
    \    :: m, n\n  double complex :: a(m,n)\n\n  integer\n    :: i, j\n\n  do i =\
    \ 2, n-1\n    do j = 2, n-1\n      a(i,j) = (a(i+1,j-1) + a(i-1,j+1)) * 0.5\n\
    \    endo\nendsubroutine\nendprogram\n```\n\nTable 4.1 shows the reported run\
    \ times. When the size of the matrix is a power of 2, the operation takes roughly\
    \ twice as long as it is not. This is due to cache misses. The size of the columns\
    \ interferes with the size of the cache, which makes the temporary storage of\
    \ a part of the matrix in the fastest cache inefficient.\n\nWhen the column is\
    \ large enough, the effect disappears, as can be seen in the last part of the\
    \ Table 4.2⁶\n\nIn this case, the problem can be solved by going through the matrix\
    \ in column first order, or by row first first — by using odd matrix dimensions.\n\
    \nAnother example is searching in a linked list. Linked lists are convenient for\
    \ inserting and deleting data efficiently, but there is no guarantee that the\
    \ locations of the memory occupied by the elements are close together.\n\n> ⁶\
    \ The effect depends on the compiler and the compile options you use. The results\
    \ here were obtained with the Intel Fortran compiler. With the gfortran compiler,\
    \ the run times were longer and did not show such a pronounced effect."
