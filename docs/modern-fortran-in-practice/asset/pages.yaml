  md: "# APPENDIX A: TOOLS FOR DEVELOPMENT AND MAINTENANCE 229\n\n# A.7 Code Coverage\
    \ and Static Analysis\n\nA technique that should to be part of the testing procedure\
    \ is test coverage. This means measuring what part of the code has actually been\
    \ run. Consider for example:\n\n```\nprogram test_coverage\n  implicit none\n\n\
    \  real :: a = 0.0\n\n  call setvalue(a, 1 )\n\n  write(**) 'Parameter = ', a\n\
    \ncontains\n  subroutine setvalue( param, intent(out) :: param\n    integer, intent(in)\
    \ :: type\n\n    if ( type == 0 ) then\n      param = param * exp(-param)\n  \
    \  endif\n  end subroutine setvalue\n```\n\nThe statement in the subroutine setvalue\
    \ that assigns a new value to its first argument is not run. Given the start value\
    \ of variable a, its effect would be undetectable, meaning a test on the output\
    \ will not reveal if the assignment has run. By measuring the test coverage, you\
    \ get insight into this fact. Here is the output from the gcov utility, that generated\
    \ the gfortran compiler, analyzes what parts of the program were run and what\
    \ parts were not:\n\n+   - 0:Source:coverage_example.f90\n- 0:Graph:coverage_example.gcno\n\
    - 0:Data:coverage_example.gcda\n- 0:Runs:1\n- 0:Programs:1\n- 1!: coverage_example.f90\
    \ --\n- 2!! Show how to use the gcov utility\n- 3!!\n- 1:4:program test_coverage\n\
    - 5:implicit none\n- 6:\n\n> The numbers before each line indicate how often the\
    \ line was run. However, the \"2\" before line 11 should be \"1\"."
