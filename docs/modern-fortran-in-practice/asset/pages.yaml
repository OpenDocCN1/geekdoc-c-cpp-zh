    do i = 1,size(array)\n  do j = i+1,size(array)\n    if ( array(j) < array(i) then\n\
    \      tmp = array(i)\n      array(i) = array(j)\n      array(j) = tmp\n    endif\n\
    \  enddo\nenddo\n```\n\nend subroutine sort\n\nend module sortable_types\n\nThe\
    \ only requirement to the types you pass is that they extend from the sortable\
    \ abstract type.\n\n**Approximating Multiple Inheritance** The fact that you cannot\
    \ use multiple inheritance may be considered a hindrance. Suppose you require\
