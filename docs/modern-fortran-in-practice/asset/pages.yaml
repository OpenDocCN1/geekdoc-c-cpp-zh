- pgno: 254
  md: "# APPENDIX B: CAVEATS 239\n\n+   * Stream access allows you to arbitrarily\
    \ set the reading/writing position in the file.\n* Direct access requires you\
    \ to specify what record to read/write.\n\nEither solution can be used to achieve\
    \ the effects needed, but they are more involved than might have been possible.\n\
    \n# B.2 Arrays\n\nAutomatic and Temporary Arrays can Cause Stack Overflow From\
    \ Fortran 90 onward, you can use automatic arrays:\n\n```\nsubroutine handle_data(\
    \ data )\n    real, dimension(:) :: data\n    real, dimension(size(data)) :: work\n\
    \nend subroutine\n```\n\nThis is very useful for creating work arrays of just\
    \ the right size. The size of your routine does not need to know the workspace\
    \ and is not responsible for passing arrays of the right size. Furthermore, the\
    \ array is created and destroyed automatically, so that you do not need to worry\
    \ about either. There is a caveat, however. if the array gets too large, the stack\
    \ from which the array is created may get well exhausted, leading to a crash of\
    \ the program. Try the following code:\n\n```\nprogram check_stack\n    implicit\
    \ none\n\n    integer :: size\n\n    size = 1\n    do\n        size = size * 2\n\
    \        write(**) 'Size: ', size\n        call create_automatic_array( size )\n\
    \    enddo\n    contains\nsubroutine create_automatic_array( size )\n    integer\
    \ :: size\n    real, dimension(size) :: data\n\n    data(1) = 0.0\nend subroutine\
    \ create_automatic_array\nend program check_stack\n```"
  merge: -1
  img_proc: true
- pgno: 255
  md: 'If you can expect these arrays to become very large, allocable arrays are a
    far better choice. When you allocate these arrays, you can catch the error code
    and arrange for a graceful shutdown if there is not enough memory.

    Array operations are sometimes implemented via hidden temporary arrays,

    special if pointers to arrays are involved. It is not immediately clear from the
    code, but if these temporary arrays are allocated on the stack, the same problem
    can occur. Many compilers offer an option to control the behavior.

    Therefore, small arrays are taken from the stack (which is faster), while large
    arrays are allocated on the heap (which poses less restrictions on the size).


    # Lower Bounds Other Than 1


    Suppose you use a declaration like:


    ```

    real, dimension(-3:3) :: array

    ```


    and you fill it with the following: 0, 0, 0, 1, 0, 0, 0.

    The function maxloc() will return the maximum at position 4, not position

    0, as you may expect(array(0) has the value 1 and all other elements have the
    value 0). This is because the lower bound is not automatically propagated

    to call subroutines or functions.

    This is a compromise. If the lower bound was actually propagated to routines,

    then using arrays passed as arguments would need to use the lower bound

    (and upper bound) consistently:


    ```

    do i = 1,size(array)

    write(*), i, array(i)

    enddo

    ```


    would need to become:


    ```

    do i = lbound(array),ubound(array)

    write(*), i, array(i)

    enddo

    ```


    for all arrays.

    As-default lower bounds are not common, it is more convenient to

    put the burden on programs that actually use non-trivial lower bounds, and

    put the burden on all programs.


    Array Declarations: dimension() versus dimension(*) The rules for pass-

    ing arguments to functions and subroutines are simple: Unless the interface to

    the routine is known explicitly – via modules, interface blocks, or because it
    is

    an internal routine – the compiler assumes the FORTRAN 77 conventions.'
  merge: -1
  img_proc: true
- pgno: 256
  md: "# APPENDIX B: CAVEATS 241\n\nTherefore, unless the following routine (which\
    \ uses an assumed-shape array) is known, it is called the wrong way:\n\n```\n\
    subroutine print_array( array )\n  real, dimension(:) :: array\n\n  integer\n\
    \  :: i\n\n  do i = 1,size(array)\n    write(*,*) array(i)\n  enddo\n```\n\nend\
    \ subroutine print_array\n\nTherefore, it is called as if it was declared as:\n\
    \n```\nsubroutine print_array( array )\n  real, dimension(*) :: array\n  ..\n\
    ```\n\nend subroutine print_array\n\nand means at the very least, the size of\
    \ the array is unknown. In effect, the loop will not run as intended (the size()\
    \ function may return zero) or the program could crash.\n\nAs a rule of thumb,\
    \ use modules whenever possible. You do not have to consider these interface questions\
    \ and the compiler can do more checks.\n\n# B.3 Dynamic Libraries\n\nOpening a\
    \ File in a Program and Using It in a DLL or Vice Versa a dynamic library, whether\
    \ a \"DLL\" on Windows, a \"dylib\" on Mac OSX, or a shared object on Linux, is\
    \ best thought of as a separate program with some special connections to the calling\
    \ program. Just as two programs do not share access to files on disk, neither\
    \ a program nor the dynamic library share access. The practical consequence is\
    \ that if you open a file on logical unit number (LUN) 10 in the program, the\
    \ library does not know anything about that. If you use LUN 10 within the library,\
    \ it may be connected to a completely different file. This is caused by the use\
    \ of LUNs as global resources. You can pass the numbers as arguments, but not\
    \ the connection itself. This even more illustrates the way dynamic libraries\
    \ work.\n\nSome compilers offer a solution for this and the related problem of\
    \ memory allocation and deallocation (see the following), but you need to be aware\
    \ of this behavior."
  merge: -1
  img_proc: true
- pgno: 257
  md: '# Allocate Memory in a DLL and Deallocate It in the Program or Vice Versa


    Memory allocated in a dynamic library should not be deallocated in the calling
    program or vice versa. The underlying administrations are independent. This is
    something to be aware if you change a static library into a dynamic one. As it
    involves no changes to the source code, the build procedure needs changed. These
    aspects can be easily forgotten.


    # Command-Line Arguments Are Not Available in a DLL


    The intrinsic routine get_command_argument together with two related subroutines
    give access to the arguments that were given to the program. This can be very
    useful, especially because you can use these subroutines anywhere in the program.
    You do not need to pass them on from the main program, as with other programming
    languages. However, these subroutines do not always work in a DLL. Notably, it
    does not work of the most program is not a Fortran program.


    # Subroutines or Data from the Main Program Used in the DLL


    The subroutines and data in a DLL are available to the main program (or other
    DLLs that link against the first one), if it makes them available. (The method
    to do this is platform-dependent and it is entirely beyond the Fortran language.)


    This is not the case other way around: a program cannot make its subroutines or
    data available to the DLL. Only by explicitly passing references to the DLL can
    they become available. The DLL is created as a more or less "program", so it can
    be used in any context. There is no guarantee that a routine my_subroutine will
    exist in that context, so the DLL cannot rely on it.'
  merge: -1
  img_proc: true
