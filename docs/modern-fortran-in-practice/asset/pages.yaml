- pgno: 129
  md: '# 8.


    # Unit Testing


    The subject of this chapter is a simple framework for automating one particular
    aspect of testing: unit tests. Unit tests focus on “small” parts of a program,
    typically single subroutines or functions. The idea is these tests give confidence
    in the correct operation of routines. As the code for these tests should be considered
    part of the program, you can repeatedly run them during development and maintenance
    of the whole system. Some development methods take this to the extreme. Test-driven
    development (TDD), for instance, prescribes that the tests are written first,
    before you start implementing the actual code.¹


    This is just one way to develop a program, but thinking about the ways you can
    test a particular routine helps to define its functionality. Most importantly,
    however, such unit tests become part of the program. Therefore, testing at that
    level is not an afterthought, implemented in ad hoc off programs.


    # 8.1 Testing Frameworks


    Junit is a well-known framework for unit tests in a Java programming environment
    [37]. It has been seminal for a whole range of similar frameworks for all manner,
    of programming languages. Tshirt depends on explicit support from several language
    features that Fortran does not have, as special annotations and the possibility
    to programmatically get a list of routine (method) names from a library. Nevertheless,
    it is quite possible to implement a unit testing framework in Fortran as well.
    There are several:


    +   - Funit, by Kleb et al. [50], implemented in Fortran and Ruby

    - pfunit, by Womack and Clune [84], a framework, implemented in Fortran

    - FRUIT; by Chen [21], implemented in Fortran and Ruby

    - Funit, by [56] implemented in Fortran


    As I know the framework I developed myself best, this chapter only discusses Funit.
    The framework offers a set of routines to run and a set of routines to check the
    actual results against the expected results (assertions).


    +   - A number of subroutines that exercise parts of the code and check the results
    using the assertion routines.

    - These routines get called in a separate subroutine, which does nothing but call
    the various subroutines.

    - The framework takes care of the administrative tasks.'
  merge: -1
  img_proc: true
- pgno: 130
  md: "# 8.2 Tridiagonal Matrices As an Example\n\nThe following subroutine illustrates\
    \ the framework from the perspective of a user.\n\n```\nmodule tridiag\n  implicit\
    \ none\n  contains\n  subroutine solve( a, b, c, d, x )\n    real, dimension(:)\
    \ :: a, b, c, d, x\n    integer :: i\n    integer :: n\n    real :: factor\n \
    \   n = size(a)\n    do i = 2,n\n      factor = a(i) / b(i-1)\n      b(i) = b(i)\
    \ - factor * c(i-1)\n      d(i) = d(i) - factor * c(i-1)\n    enddo\n    x(n)\
    \ = d(n) / b(n)\n    do i = n-1,1,-1\n      x(i) = (d(i) - c(i) * x(i+1)) / b(i)\n\
    \    enddo\n  end subroutine solve\nend module tridiag\n```\n\nIt is a straightforward\
    \ implementation of Gauss elimination for a tridiagonal matrix. The matrix is\
    \ represented by three separate arrays (a, b and c) and the right-hand side by\
    \ array d. The system of linear equations reads:\n\n> $a_{i-1} + b_i x_i + c_i\
    \ x_{i+1} = d_i$\n\nExamples of tests for this routine:\n\n+   - Use a diagonal\
    \ matrix with constant coefficients, such as 3.0 and a right-hand side with a\
    \ constant value of 1.0. The result is a vector with all elements close to $1/3$.\
    \ It is a trivial system, but the algorithm does not take into account.\n- Use\
    \ a (diagonally dominant) matrix with diagonals $a = 1, b = 2$, and $c = 1$. The\
    \ right-hand side is chosen so that the exact solution is a vector $1, 1/2, 1/3,\
    \ \\dots, 1/n$. By varying the size of the matrix, you can check the accuracy\
    \ of the implementation."
  merge: -1
  img_proc: true
