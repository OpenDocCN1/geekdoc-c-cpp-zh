  md: "# OBJECT-ORIENTED PROGRAMMING 175\n\n```\nmodule <module>_sorting\n\n  use\
    \ <module>, data_type => <type>\n\n  !\n  ! Include the generic code\n  !\n  include\
    \ \"sort_f90_include.f90\"\n\nend module <module>_sorting\n```\n\n```\nmodule\
    \ <module>_public\n  use <module>_sorting, <type> => data_type\nend module <module>_public\n\
    ```\n\nThis implementation relies on renaming a derived type and user-defined\
    \ operations.\nThe file \"sort_f90_include.f90\" is completely oblivious of the\
    \ particular type to be sorted. The interface statement ensures you can have several\
    \ sorting routines without a naming conflict, and the sort routine relies on a\
    \ user-defined comparison operation.\n\n```\nprivate :: sort\n\ninterface sort_data\n\
    \  module procedure sort\nend interface\n```\n\n```\ncontains\n\nsubroutine sort(\
    \ data )\n  implicit none\n\n  type(data_type), dimension(:) :: data\n  type(data_type)\
    \               :: tmp\n  integer                      :: i, j\n\n  do i = 1,size(data)\n\
    \    do j = i+1,size(data)\n      if ( data(j) < data(i) ) then\n        tmp =\
    \ data(i)\n        data(i) = data(j)\n        data(j) = tmp\n      endif\n   \
    \ enddo\nend subroutine sort\n```"
