- pgno: 38
  md: "# MATHEMATICAL ABSTRACTIONS 23\n\nThis main program prints the function value\
    \ and its first derivative:\n\n```\nprogram print_table\n  use automatic_differentiation\n\
    \ntype(autoderiv) :: x, y\n\n  do i = 0,10\n    x%dv = 0.1 * i\n    x%dv = 1.0\
    \      ! x is the variable we differentiate to\n\n    y = f(x)\n\n    write(*,'(310.4)')\
    \ x%y, y%x, y%dv\n  enddo\ncontains\n  function f( x ) result( z )\n  ...\n  end\
    \ program print_table\n```\n\nYou can apply the technique to find the root of\
    \ equation $f(x) = 0$ using Newton's method. Mathematically, the method is expressed\
    \ as:\n\n> $x_{k+1} = x_k - \\frac{f(x_k)}{f'(x_k)} \\quad (3.3)$\n\nwhere $x_{k+1}$\
    \ is the new estimate of the root, if the iteration converges. Put into a subroutine,\
    \ it looks like:\n\n```\nsubroutine find_root( f, xinit, tolerance, root, found\
    \ )\n  use automatic_differentiation\n\n  interface\n    function f(x)\n     \
    \ type(autoderiv), intent(in) :: x\n      type(autoderiv)             :: f\n \
    \   end interface\n\n  type(autoderiv), intent(in)  :: xinit\n  type(autoderiv),\
    \ intent(out) :: root\n  real :: tolerance\n  logical :: found\n\n  integer ::\
    \ iter\n  integer, parameter :: maxiter = 1000\n  type(autoderiv) :: fvalue\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 39
  md: "# 24 MODERN FORTRAN IN PRACTICE\n\n```\ntype(autoderiv)       :: newroot\n\
    found = .false.\nroot = xinit\nroot%dv = 1.0\n```\n\n```\ndo iter = 1,maxiter\n\
    fvalue = f(root)\n\nnewroot = - fvalue%v / fvalue%dv\nfound = abs(newroot%v -\
    \ root%v) < tolerance\nroot = newroot\n\nif ( found .or. abs(root%v) > huge(1.0)/10.0\
    \ ) exit\nenddo\n```\n\n```\nend subroutine find_root\n```\n\nThe interface to\
    \ the function passed as an argument is non-trivial, therefore, you need explicitly\
    \ define what kind of function you are using. This is done with an interface block:¹\n\
    \n```\ninterface\nfunction f(x)\n  use automatic_differentiation\n  type(autoderiv),\
    \ intent(in) :: x\n  type(autoderiv)             :: f\nend function\nend interface\n\
    ```\n\nInside an interface block, you must use the module that contains the definition\
    \ of the derived type, either via a use statement or via Fortran 2003's import\
    \ statement.\n\nNote that the loop to find the root stops on three criteria (see\
    \ also Chapter 10):\n\n+   - If the estimate is within the error margin of the\
    \ previous estimate.\n- If the maximum number of iterations is reached.\n- If\
    \ the iteration does not seem to converge: the root is becoming larger and larger.\n\
    \nThe technique is not limited to functions of one variable or to the first derivative.\
    \ It is quite possible to expand it to functions of two or three variables:\n\n\
    ```\ntype autoderiv_two_vars\nreal :: v\nreal :: dvdx\nreal :: dvdy\nend autoderiv_two_vars\n\
    ```\n\n> ¹ With Fortran 2003 and later you can also use abstract interfaces (see\
    \ Section 11.2)."
