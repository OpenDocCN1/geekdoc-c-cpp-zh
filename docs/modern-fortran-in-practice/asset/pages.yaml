    and similarly for the integrate_trapezoid routine.\n\n# 5.5 Dealing with Different\
    \ Precisions\n\nWe have considered only the matter of passing arbitrary data to\
    \ a function. A second aspect of a generic interface is whether to perform the\
    \ computations in single or double precision. Currently, Fortran does not allow\
    \ you to define one subroutine or function and specify the precision. You are\
