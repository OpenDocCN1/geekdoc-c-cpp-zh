- pgno: 169
  md: '# 154 MODERN FORTRAN IN PRACTICE


    A useful criterion for convergence tries to overcome the preceding cricisms:


    +   - The best estimate $x_{k+1}$ lies in the interval $(x_k - \delta, x_k + \delta)$,
    where $S$ is a scale factor, indicating the typical values of $x$ for which the
    function is relevant and $\delta$ is the relative tolerance.

    - The function values at the end points of this interval have opposite signs.
    If convergence does not happen within a preset marker of iterations, assume it
    will not happen at all.


    The first point guarantees that you have a meaningful, small interval under all
    circumstances, while the second guarantees that they bracket the exact root. The
    choice of $S$ and $\delta$ is left to the user.


    The next step is how to determine the derivative numerically? You will use finite
    differences to approximate the derivative:


    ```

    $f''(x) \approx \frac{f(x+\eta) - f(x)}{\eta} \quad (10.5)$

    ```


    This is prone to numerical errors (subtracting two almost equal quantities), but
    there is no alternative, if we cannot or do not want to use automatic or explicit
    differentiation. The criterion for selecting the stepsize $\eta$ in this formula
    is that the two function values differ significantly enough to avoid rounding
    errors, but are small enough to avoid effects of the higher-order derivatives.


    Unfortunately, it is not trivial to decide what step to use. Take the following
    example:


    ```

    $f(x) = \begin{cases} \frac{1-\\cos x}{x} & \text{if } x \neq 0 \ 0 & \text{if
    } x = 0 \end{cases} \quad (10.6)$

    ```


    The mathematically exact derivative at $x=0$ is $1$. Determining this value via
    a small program requires selecting a value of $x=0+\eta$, where $cos$ numerically
    differs from 1 (see Table 10.3).


    The smallest value of $\eta$ where this theoretically can happen is:$^4$


    ```

    $cos(0 + \eta) = largest value smaller than 1 = 0.999999940395$ \quad (10.7)$

    ```


    giving:


    ```

    $\eta \approx 3.453 \times 10^{-4} \quad (10.8)$

    ```


    Therefore, it makes no sense to try and determine the root to an error smaller
    than that.


    > $^4 You can use the nearest() function to determine the largest distinguishable
    smallest value than 1.'
