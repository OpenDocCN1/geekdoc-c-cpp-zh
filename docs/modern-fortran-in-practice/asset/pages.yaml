  md: "# OBJECT-ORIENTED PROGRAMMING 173\n\nThe preceding takes a \"particle-centric\"\
    \ point of view where the particles are the most important agent, here the call:\n\
    \n```\ncall particle(p)%new_position( flow_field, deltt )\n```\n\nYou may want\
    \ to change viewpoint to a \"flow-field-centric\" one:\n\n```\ntype(analytical_field)\
    \             :: flow_field\ntype(oil_particle), dimension(100000) :: particle\n\
    real                               :: deltt\n```\n\n```\ndo time = 1,number_times\n\
    \    compute the flow field for this time ...\n```\n\n```\n! Update the particle\
    \ positions using the new flow field\n! do p = 1,size(particle)\n    call flow_field%new_position(\
    \ particle(p), deltt )\n```\n\n```\nenddo\n```\n\nThis \"inversion\" is achieved,\
    \ by not changing the interface of the actual routine, via the pass() key. The\
    \ definition of the flow field type becomes:\n\n```\ntype :: basic_flow_field_type\n\
    contains\n    procedure :: flow_velocity => velocity_basic_flow_field\n    procedure,pass(flow_field)\
    \ :: &\n    new_position => position_basic_particle\nend type basic_flow_field_type\n\
    ```\n\n# 11.2 Interfaces As Contracts\n\nFortran 2003 does not allow multiple\
    \ inheritance (in contrast to C++), which is useful to combine properties. It\
    \ does not allow to specify Java-style interfaces either, assuring that certain\
    \ routines with predefined interface are available. Instead, you can emulate these\
    \ features by extending types from a basic type.\n\nThe idea is to use abstract\
    \ types and abstract interfaces. This is a mechanism to specify what is expected\
    \ of a derived type, in particular what routines are available without actually\
    \ defining them. You use the deferred keyword and the abstract interface keyword:\n\
    \n```\ntype, abstract :: abstract_point\n    ! No Coordinates, leave that to the\
    \ extending type\ncontains\n    procedure(add_vector), deferred :: add\nend type\
    \ abstract_point\n```"
