  md: "# APPENDIX A: TOOLS FOR DEVELOPMENT AND MAINTENANCE 227\n\n+   - **commit**:\
    \ put your changes back into the repository so that your developers can get your\
    \ work. Other benefits of committing regularly, are recording the various stages\
    \ of development or retrieving a previous version, if necessary.\n- **diff**:\
    \ compare two versions of the source files.\n- **branch and merge**: start a parallel\
    \ development, to test a new feature without interrupting the mainstream, and\
    \ later bring changes back into the mainstream.\n\nThese are just the basic features\
    \ you may expect from a version control system.²\n\n# A.6 Documenting the Source\
    \ Code\n\nMany programmers have trouble keeping the documentation of their programs\
    \ updated or even create formal documentation at all. This is especially true\
    \ if you have to write the documentation after the program or library is finished.\
    \ Tools like Doxygen and ROBODoc can help automate the process. They extract the\
    \ documentation via specially formatted comments from the source itself. In this\
    \ way, the source code and the documentation are intimately connected.\n\nROBODoc\
    \ [77] is a tool that relies entirely on extracting the information from comments,\
    \ whereas Doxygen [79] analyzes the source code to extract further details. With\
    \ the first tool, you have to do more work, but it is essentially agnostic with\
    \ respect to the programming language and allows customization. Doxygen is capable\
    \ of extracting most of the structure of the program automatically, but it requires\
    \ knowledge of the programming language to do this. The consequence is that the\
    \ structuring concepts of one language have to be mapped to those of the tool.\
    \ For example, whereas Fortran has one definition of *module*, C++ has a different\
    \ concept.\n\nBoth tools can be used to create comprehensive documentation, in\
    \ various formats (HTML, LaTeX, and others), if you supply the right information.\n\
    Here is a small example of the code required by ROBODoc:\n\n```\n!**** Utilities/sort_routines\n\
    ! FUNCTION\n!    The sort_routines module provides several routines\n!    to sort\
    \ arrays\n!****\n!\nmodule sort_routines\n    implicit none\n\n!*****m sort_routines/\n\
    ```\n\n² At least, *fossil* [43], comes with a built-in Internet server, a Wiki,\
    \ and an issue tracker system, that you can maintain much more than source code\
    \ with one tool."
