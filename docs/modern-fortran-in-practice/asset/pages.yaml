    call test( test_diagonal_dom2, &

    "Solve diagonally dominant system - n=10")

    call test( test_diagonal_dom3, &

    "Solve diagonally dominant system - n=100")

    ```


    end subroutine test_all


    Now run this routine test_all via the framework at a convenient spot in the program.
    Typically, this is run at the start for the following reasons:


    program solve_tridiagonal_systems


    ```

    use ftnunit

    use tridiag            ! The actual implementation

    use test_tridiag        ! The tests

    ```


    ```

    implicit none

    ```


    ```

    call runests_init

    call runests( test_all )

    call runests_final

    ```


    ```

    !

    ! If not testing mode, then proceed with the ordinary

    ! processing ...

    !

    ...

    ```


    end program solve_tridiagonal_systems


    The routines runests_init, runests, and runests_final are all part of the framework.
    If the program is not run in test mode (see the following), they do nothing and
    the program simply continues with its ordinary processing. Otherwise, the tests
    are run and when the last one is done, the program stops.'
