- pgno: 20
  md: '# INTRODUCTION TO MODERN FORTRAN 5


    # 1.2 Fortran 90


    The Fortran 90 standard introduced a large number of features. The best known
    are perhaps those involving array operations, but there are many more:


    +   - The implicit none statement requires the user to explicitly declare all
    variables and it requires the compiler to check this. Using this feature means
    typing errors are much less likely to inadvertently introduce new variables.


    +   - Modules, together with the public and private statements or attributes,
    provide an effective means to partition the entire program into smaller units
    that can only be accessed when explicitly stated in the source code. Modules furthermore
    provide explicit interfaces. to the routines they contain, which makes it possible
    for the compiler to perform all manner of checks and optimizations.


    Should this not be possible (such as when dealing with routines in a different
    language), you can use interface blocks.


    +   - The main program but also subroutines and functions can contain so-called
    internal routines. These routines have access to the variables of the containing
    routine but provide a new scope in which to define local variables. It is an additional
    method for modularizing the code.


    +   - As modern computers allow a flexible memory management that was not at ubiquitous
    when the FORTRAN 77 standard was published, several features of Fortran 90 relate
    to managing the memory:


    +   - Recursive routines are now allowed, making it far easier to implement recursive
    algorithms.


    +   - Via the allocate and deallocate statements, programmers can adjust the size
    of arrays to fit the problem at hand. Arrays whose size can be adjusted in two
    flavors: allocable and pointer. The former offers more opportunities for optimization,
    whereas the latter is much more flexible.


    +   - Besides explicit allocation, the programmer can use automatic arrays - arrays
    that get their size from the dummy arguments and are automatically created and
    destroyed upon entry or exit of a subroutine or function.


    +   - Array operations are an important aspect of the Fortran 90, as they allow
    a concise style of programming and make the optimization task much simpler for
    the compiler. These operations are supported in arithmetic expressions but also
    via a collection of generic standard functions.


    Not only can you manipulate an entire array, but you can also select a part, defined
    by the start, stop, and stride in any dimension.


    User-defined functions can return arrays as a result, adding to the flexibility
    and usefulness of array operations.


    +   - Besides obsolete fixed format that characterized Fortran from the start,
    there is the free form, where columns 1 to 6 no longer have a special meaning.
    This makes source code look much more modern.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 6 MODERN FORTRAN IN PRACTICE


    +   - Arrays of values can be constructed on the fly, via so-called array define
    constructors. This is a powerful mechanism that can be put to good use to fill
    an array with values.


    +   - Just as in other modern languages, Fortran allows the definition of new
    structures. The basic mechanism is that of derived types. Derived types consist
    of components of different types – either basic types, like integers or or derived
    types. You can use them much in the same way as the basic types – pass them to
    subroutines, use them as return values, or create arrays of such types.


    +   - Moreover, you can use derived types to create linked lists, trees, and other
    well-known abstract data types.


    +   - Overloading of routines and operations, as addition and subtraction, makes
    it possible to extend the language with new full-blown types. The idea is that
    you define generic names for specific routines or define +, -, and so for numerical
    types that are not defined by the standard (for instance, relational numbers).


    It is in fact possible to define your own operations. A simple example: suppose
    your program deals with planar geometric objects, then it may make sense to define
    an intersection operation on two objects, object_a_intersects. object_b, to replace
    the call to a function intersect_objects( object_a, object_b ).


    +   - Functions and subroutines can now have optional arguments, where the function
    present determines if an argument is present or not. You can also call functions
    and subroutines with an arbitrary order, as long as you add the names of the dummy
    arguments, so the compiler can match the actual arguments with the dummy arguments.


    A further enhancement is that you can specify the intent of an argument: whether
    it is input only, output only, or as both input and output. This is an aid to
    documentation as well as aid to the compiler for certain optimizations.


    +   - Kind is Fortran''s way of determining the characteristics of the basic types.
    For example, you can select single or double precision for real variables not
    via a different type (real or double precision) but via the kind:


    ```

    integer, parameter :: =

    select_kind_real( precision, range )\)

    real(double) :: value

    ```


    +   - Besides the introduction of the select/case construct, while we use loops
    and do loops without a condition, you can use a name for all control structures.
    This makes it easier to document the beginning and end of such structures. To
    skip the rest of a loop''s body you can now use the cycle statement – possibly
    with the name of the do loop – so that you can skip more than one loop in a nested
    construction. Similarly, the exit statement terminates the loop.'
