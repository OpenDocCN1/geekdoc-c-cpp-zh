- pgno: 32
  md: "# ARRAY-VALUED FUNCTIONS 17\n\n# Spacing of Irrational Numbers\n\nThis first\
    \ example requires a bit of explanation: it is a number-theoretical problem regarding\
    \ the spacing of irrational numbers [66]. The numbers considered are ($\\alpha$,\
    \ an irrational number):\n\nV = {x | x = n\\alpha mod 1, n = 1 .. N} (2.1)\n\n\
    If you sort these numbers, the spacing between successive numbers takes only one\
    \ of three distinct values (here the interval [0,1) is wrapped, so that 0.9 and\
    \ 0.1 are 0.2 apart, not 0.8). The following program demonstrates this. It constructs\
    \ an array of these numbers, sorts them (using a simple algorithm), and prints\
    \ the spacings:\n\n```\nprogram nearest_neighbors\n  implicit none\n  integer\
    \ :: i\n\n  write(',f10.4)') &\n  cdiff(sort( /(mod(i*sqrt(2.0),1.0),i=1,20) /\
    \ ))\n\n  contains\n\n  function cdiff(array)\n    real, dimension(:) :: array\n\
    \    real, dimension(size(array)) :: cdiff\n\n  cdiff = abs(array - cshift(array,1))\n\
    \  cdiff = min(cdiff, 1.0 - cdiff)\n  end function cdiff\n\n  function sort(array)\n\
    \    real, dimension(:) :: array\n    real, dimension(size(array)) :: sort\n\n\
    \    real :: temp\n    integer :: i, j\n    integer, dimension(1) :: pos\n\n \
    \   ! Retrieve the lowest elements one by one\n    ! \n    sort = array\n    do\
    \ i = 1,size(sort)\n      pos = minloc(sort(i:))\n      j = i + pos(1) - 1\n \
    \     temp = sort(j)\n```"
