    \ = x'dvdy * y'v + x'v * y'dvdy\nend function mult_vv\n```\n\nTo determine $\\\
    frac{\\partial}{\\partial x}$ and $\\frac{\\partial}{\\partial y}$, you must use\
    \ the right \"vectors\": $x = (x_0, 1, 0)$ and $y = (y_0, 0, 1).\nFor the function\
    \ $f(x,y) = xy$, the result will be:\n\n> $f^0v = x_0 \\cdot y_0$\n\n> $f^0dvdx\
    \ = 1 \\cdot y_0 + x_0 \\cdot 0 = y_0$\n\n> $f^0dvdy = 0 \\cdot y_0 + x_0 \\cdot\
    \ 1 = x_0$\n\nOf course, the implementation gets more complicated with higher-order\
    \ derivatives and more variables, but the principle remains the same.\n**Numerical\
    \ Aspects** The technique of automatic differentiation have a few problems. First\
    \ of all, it does not work well if the function in question has a \"removable\"\
    \ singular point, like the sine function. However, more seriously, catastrophic\
    \ cancellation can occur. Here is an example:\n\n> $f(x) = \\frac{\\ln x}{x-1}\
    \ \\quad (x \\neq 1)$\n\n> $f(1) = 1 \\quad (x = 1)$\n\nThe first derivative of\
    \ this function:\n\n> $f'(x) = \\frac{1}{x-1} - \\frac{\\ln x}{(x-1)^2}$\n\n>\
    \ $f'(x) = \\frac{x-1-\\ln x}{(x-1)^2}$\n\nwhich tends to $-\\frac{1}{2}$ for\
    \ $x \\to 1$.\nIf you compute the derivative around $x=1$ using the automatic\
    \ differentiation module, a very large relative error is observed around $x=1.000001$\
    \ (see Figure 3.1). The cause is the fact that the two contributions to the derivative\
    \ in"
