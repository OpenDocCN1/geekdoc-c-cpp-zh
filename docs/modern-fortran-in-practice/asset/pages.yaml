    In this example, the sort() function works by finding the position of the smallest
    value first and then exchanging value with the value in the first non-sorted position.
    Note that the minloc() function returns an array (one element for each dimension)
    and that you need to correct the index returned, as it is relative to the start
    of the array section.


    A more traditional program looks like this, adapting the contents of the array
    data:


    ```

    program nearest_neighbors

    implicit none

    integer :: i

    integer, parameter :: n = 20

    real, dimension(n) :: data


    doi i = 1,n

    data(i) = mod(i*sqrt(2.0),1.0)

    endo


    call sort( data )

    call cdiff( data )


    nwrite(*,''(f10.4)'') data

    ```


    ```

    contains


    subroutine cdiff( array )

    nreal, dimension(:) :: array

    real, dimension(size(array)) :: work

    integer :: i


    doi i = 1,size(array)-1

    work(i) = array(i+1) - array(i)

    endo

    work(size(array)) = array(size(array)) - array(1)


    doi i = 1,size(array)

    array(i) = min(abs(work(i)), abs(1.0-work(i)))

    endo

    end subroutine

    ```'
