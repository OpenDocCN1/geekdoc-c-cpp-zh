  md: '# MODERN FORTRAN IN PRACTICE


    Ultimately, the implementation should be robust:


    +   - Unacceptable input is recognized (if possible).

    - If the program can find an adequate answer, it will do so, otherwise, it will
    indicate why it cannot find it.


    In particular, this means no crash and no incorrect answer.


    # 10.1 Related Approaches


    Good programming practices that should lead to robust programs are described in
    many publications, such as in Safer C, by Hatton [42] and in Code Complete, by
    McConnell [58]. However, these books present detailed numerical examples as to
    how robustness in this area is achieved. Metcalf et al. [65] touch upon the subject
    when they illustrate the floating-point features new to the Fortran 2003 standard.


    The problems that floating-point arithmetic presents to the reliable implementation
    of numerical algorithms are usually handled in two different ways:


    +   - Use of arbitrary-precision arithmetic

    - Use of interval arithmetic


    The first approach, as exemplified by Karamheti and others [47], attempts to overcome
    the limitations by using arithmetic methods that allow much higher precision than
    the precision offered by single and double precision. There is quite significant
    impact on the performance, but the alternative of unreliable results is probably
    worse.


    Karamheti and others apply this method to geometrical computations to obtain so-called
    exact geometrical computation. The imprecision of floatingpoint numbers may cause
    false conclusions about whether two lines in space are parallel or not. Their
    special library, which can apply more accurate arithmetic at a level of precision,
    greatly alleviates these and other problems.


    In the second approach, the goal is to compute the margins within the true answer
    lies [1]. The major criticism is that often the intervals become so large that
    the answer is practically useless. Most implementations cannot account the dependencies
    between numbers, but the manual for SUN''s Forte Fortran compiler [45] describes
    an implementation where this is taken of.


    The CADNA library [74] uses a somewhat different method: It computes three different
    values for each operation using different rounding modes. These modes are chosen
    randomly. As the library requires only limited changes to the original source
    code, it is particularly suitable for investigating possible numerical instabilities
    in existing programs.


    In this chapter, you will reason mostly the visible part of the implementation,
    the actual program that is derived from this may have some unexpected and different
    properties. Corden and Kreizer [26] explain in some detail how these differences
    arise as a consequence of various compiler'
