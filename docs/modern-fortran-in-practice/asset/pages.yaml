- pgno: 22
  md: '# INTRODUCTION TO MODERN FORTRAN


    The Fortran standard defines a large number of functions and subroutines:


    +   - Numerical inquiry functions for retrieving the properties of the floating-point
    model.

    - Array manipulation functions that often take an array expression as one of their
    arguments. For instance, you can count the number of positive elements in an array
    using:


    ```

    integer, dimension(100,100) :: array


    write(**) ''Number of positive elements:'', & count(array > 0 )

    ```


    +   - Character functions and bit manipulation functions

    - Enhancements of the I/O system include nonadvancing I/O. That is, rather than
    whole records, a program can read or write a part of a record in one statement
    and rest in one another.


    # 1.3 Fortran 95


    As the Fortran 95 standard is a minor revision of the previous one, the differences
    mostly concern details. However, these details are important:


    +   - Fortran 90, variables with the pointer attribute could not be initialized.
    Their initial status was explicitly undefined: neither not nor associated. Fortran
    95 introduces the null() function to initialize pointers explicitly:


    ```

    real, dimension(:), pointer :: ptr -> null()

    ```


    +   - A further enhancement is that local allocatable variables without the save
    attribute are automatically deallocated, when they go out of scope (upon returning
    from a subroutine or function). It is for the compiler to do so, as the memory
    cannot be reached by any means afterwards.

    - As a preparation for the next standard, a technical report describes how derived
    types may contain allocatable components and how functions can return allocatable
    results. (This technical report became part of the Fortran 2003 standard with
    some additions).


    +   - New features in Fortran 95 are the pure and elemental routines. Elemental
    routines release the programmer from having to write versions of a routine for
    arrays of all the dimensions they want to support. Many functions and subroutines
    in the standard library were already elemental, meaning they work on individual
    elements of the arrays that are passed without regard for any order. With the
    advent of Fortran 95, programmers themselves can also write routines.


    Pure routines are routines that provide the compiler more opportunities to optimize,
    as roughly, they cause no side effects.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# MODERN FORTRAN IN PRACTICE


    +   Finally, the forall statement must be mentioned, known from High Performance
    Fortran. It was designed to enhance the capabilities of operations, but in Fortran
    turns out to be difficult to use properly. (In Fortran 2008, a more flexible construct,
    do concurrent, is introduced.)


    # 1.4 Fortran 2003


    Fortran 2003 is also a major revision and its main theme is the introduction of
    object-oriented programming. However, there are more enhancements, for instance,
    a standardization of interacting with C routines.


    +   The support for object-oriented programming comes from several features:

    - Derived types now contain procedures (functions and subroutines). These are
    either bound to the type, so that all variables of a particular type have the
    actual procedure, or they are procedures particular to a variable. Such procedures
    automatically get the variable (or object if you like) as one of their arguments,
    but you can control which one. (We will discuss these extensively in Chapter 11.)

    - Derived types can be extended into new types. This is Fortran''s inheritance
    mechanism. An extended type can have new components (both data and procedures),
    it can redefine the procedures that are bound to the parent type, but it cannot
    change their signature.

    - The select statement has been enhanced to select on the type of the variable.
    This is important if you use so-called polymorphic variablespointer variables
    whose type comes from the variable they are associated with the program is running.
    Polymorphic variables are declared via the class keyword instead of the type keyword.

    - To enhance the flexibility of the extension mechanism, procedures can be characterized
    by abstract interfaces. Rather defining a particular routine, these interfaces
    define what a routine should look like in terms of its argument list and return
    value. This can then be applied as a mold for actual routines.


    +   While procedure pointers will often occur within derived types, you can use
    them as “ordinary” variables as well.


    +   To achieve certain special effects, the concept of intrinsic modules has been
    introduced. Examples of these special effects are the control of the floatingpoint
    environment: rounding mode, the effect of floating-point exceptions,


    > 3 Fortran 90 possesses a few features that allow a programmer to come close
    to that style of programming, but it lacks inheritance, viewed as one of the most
    important characteristics of object-oriented programming. Fortran 90 is, therefore,
    sometimes called object-based.


    > 4 Rous and Adelstein [73] compare the terminology for object-oriented concepts
    in Fortran and C++.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# INTRODUCTION TO MODERN FORTRAN 9


    but also the interfacing to C, as that sometimes requires a different calling
    and naming convention.


    +   Memory management has been enhanced:

    - The length of character strings can now be determined by the allocate statement.

    - Under some circumstances an allocable array can be automatically reallocated
    to the correct size.

    - It is possible to move the allocated memory from one variable to the next via
    the move_alloc routine. This makes it easier to expand an array.

    - Another new feature is that of stream access to files. In particular, it is
    possible to read (and write) files without attention to complete records and write
    binary binary files, unlike the traditional unformatted files that have a record
    structure, which are cumbersome to use in other programming languages.

    - Fortran 2003 also standardizes the access to the system''s environment in the
    form of environment variables and to the command-line arguments that were used
    to start the program. Previously, you had to use all manner of compiler-specific
    solutions to access this information.


    # 1.5 Fortran 2008


    The Fortran 2008 standard is a minor revision to the language, even though it
    defines a large new feature: coarrays. These are discussed more fully in Chapter
    12 [72], [71]. Besides these, the standard defines a number of new constructs
    and keywords as well as new functions:


    +   - Coarrays are a mechanism for parallel computing that falls in the category
    of Partitioned Global Address Space (PGAS). Essentially, it makes data available
    on various copies of the program without having to worry about the exact methods
    that must be used to transfer the data. It is the compiler''s job to generate
    code that does this efficiently and effectively.

    - Arrays are defined to be contiguous. This enables the compiler to generate more
    efficient code, as the array elements are adjacent in memory.

    - The block – end block construct defines a local scope within a program or routine,
    so that new variables can be declared that are present only within that block.


    Modules as introduced in Fortran 90 are an important mechanism to modularize a
    program. However, the module itself does not allow much modularization, the entire
    module must be compiled. Fortran 2003 introduces modules to overcome the problem
    of very large source files containing a large module. An additional enhancement
    is the import feature. This is used in interface blocks to import a definition
    from the containing module, instead of having to define a second module containing
    the definitions you require.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# MODERN FORTRAN IN PRACTICE


    +   - To reduce the need for a GOTO statement, the exit statement can be used
    to jump to the end of if blocks and select blocks.


    +   - The concurrent statement may be regarded as a more flexible alternative
    to the forall statement/block. It indicates to the compiler that the code can
    be run in parallel (note that this is parallelism within the same copy, not between
    copies as coarrays).


    +   - Internal procedures may now be passed as actual arguments, giving access
    to the variables in the routine that contains them. It makes certain interface
    problems easier to solve (see Chapter 5).


    +   - Standard functions include Bessel functions and inquiry functions.


    # 1.6 What Has Not Changed


    The introduction of all these new features to the Fortran language does not have
    consequences for existing code that adheres to one or the other standards, with
    the exception of a few features that have been deleted or obsolete.


    Apart from such deleted, and perhaps almost forgotten features, like the assigned
    GOTO, old code should still work.


    There are in fact more invariants in the design of modern Fortran, besides this
    support for old code:


    +   - Fortran is case-insensitive


    +   - There is no concept of a file as an organizational unit for the source code.
    In particular, there can be no code outside the program, subroutine, function,
    or module.


    +   - The design of Fortran is biased to efficient execution. This is especially
    so in the latest Fortran 2008 standard, in which features have been added to the
    compiler in the creation of fast and efficient programs.


    The details may surprise programmers who are used to languages like C (see Appendix
    B).


    +   - The data type of an expression or subexpression depends solely on the operands
    and the operation, not on the context. This reasoning about a program much easier,
    but again it may cause surprises (Appendix B). Here is an example:


    ```

    real :: r

    r = 1 / 3

    ```


    > 5 The most important of these deleted features is the use of real variables
    to control a do loop ([66], Section 2.1.5).


    > 6 Most compilers continue to support such features, so that old programs can
    still be compiled and run.'
