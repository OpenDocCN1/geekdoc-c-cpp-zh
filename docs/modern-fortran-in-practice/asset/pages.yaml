  md: "# ROBUST IMPLEMENTATION OF SEVERAL SIMPLE ALGORITHMS 147\n\nAlternatives to\
    \ this formula exist that do not exhibit numerical instability, but they are more\
    \ complicated. A simple workaround for the problem is to modify the values that\
    \ are summed:\n\n```\nsum = sum + (value - offset)\nsumsq = sumsq + (value - offset)\
    \ ** 2\n```\n\nwhere offset is one of the non-missing values in the series of\
    \ data. As the values in the two sum capture only the variation in the numbers,\
    \ the roundoff errors are smaller.\n\nSecondly, when the input value are either\
    \ very large (> 10³ ) or small (< 10⁻³), overflow may occur – the square of such\
    \ extreme numbers cannot be represented with standard single-precision floating-point\
    \ numbers. There are several methods to avoid this particular issue:\n\n+   -\
    \ Use a type of floating-point numbers that allows a wider range, like double\
    \ precision. This merely expends the range of numbers you can deal with.\n- Use\
    \ scaling to force the numbers into a more convenient range. Depending on the\
    \ expected data and the emphasis we must put on the robustness aspects. The simplest\
    \ way to deal with the problem is to warn about numbers outside a particular safe\
    \ range. This is exactly what we do in the following revised version:\n\n```\n\
    ! robust_stat.f90\n--\n! Basic statistical parameters - robust version\n!\nprogram\
    \ robust_stat\n```\n\n```\ncharacter(len=80) :: line\nreal :: value, sum, sumsq,\
    \ var\ninteger :: i, j, nodata, nomiss\ninteger :: noerrers, nonempty, nolines,\
    \ ierr\nlogical :: first_value = .true.\n```\n\n```\nopen( 10, file = 'robust_stat.data',\
    \ status = 'old', &\niostat = ierr )\n```\n\n```\nif ( ierr /= 0 ) then\n  write(*,*)\
    \ 'Error opening file with input data &\n  &robust_stat.data'\n  write(*,*) 'Check\
    \ that it exists'\n  stop\nendif\n```\n\n```\n!\n! One value per line, ? means\
    \ a missing value\n```"
