  md: "# 82 MODERN FORTRAN IN PRACTICE\n\n```\ntype(c_ptr), value              ::\
    \ handle\ncharacter(kind=c_char), dimension(*)  :: command\ncharacter(kind=c_char),\
    \ dimension(*)  :: errmsg\ninteger(kind=c_int), value            :: len_errmsg\n\
    end function fsqlite_do_c\n interface\n```\n\nThe Fortran routine fsqlite_do,\
    \ the public routine you are supposed to use,\nverts the command string to a string\
    \ in the C convention with a trailing\nNUL character, the result of trim(string)//achar(0).\n\
    \nWhen you pass the character strings to a routine that has the C binding\nattribute,\
    \ the strings become, just as in C, arrays of single characters. This is\na special\
    \ rule in the standard. It boils down to an implicit conversion of the\ntype:\n\
    \n```\ncharacter(len=*)  :: string\n```\n\n```\ncharacter(len=1), dimension(*)\
    \  :: string\n```\n\nAs a consequence, there are no hidden length arguments anymore.\
    \ You do need\nto pass the (maximum) length of the string that will store an error\
    \ message,\nbut that is an ordinary argument, visible on both the C and the Fortran\
    \ sides.\nAs the names of the C functions matches the names on the Fortran side,\
    \ that,\nis, they are all lowercase, there is no need to use the binding in the\
    \ bind\nclause. For a C function that has uppercase characters, like SQLite3Doc,\
    \ you\nwould use:\n\n```\ninterface\n function sqlite3_do_c( handle, command,\
    \ &\n errmsg, len_errmsg ) &\n bind(c, name = 'SQLite3Doc')\n \n\n end function\
    \ sqlite3_do_c\n interface\n```\n\nYou can call this function by the name sqlite3_do_c\
    \ in Fortran while on the\nC side it is called SQLite3.\n\n# 6.4 Dealing with\
    \ Derived Types\n\nThe aspects discussed so far assume that you use only Fortran\
    \ 77 features,\nbasic types like single and double precision reals and arrays\
    \ of fixed or assumed\nsize. What about derived types, Fortran 90 pointers and\
    \ allocatable arrays, and\neven Fortran 2003 polymorphic variables?"
