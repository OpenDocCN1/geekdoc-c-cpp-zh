    \ :: wp = kind(1.0)\nreal(wp) :: x\n```\n\ndefines a parameter wp (the working\
    \ precision) that has a value corresponding to single precision - the kind of\
    \ the literal constant 1.0.\nYou can use this facility and the include statement\
