    type :: observer_list

    contains

    class(observer), pointer :: observer

    end type observer_list

    ```


    ```

    type solution_data

    type(observer_list), dimension(:), allocable :: list

    ... Fields defining the solution

    end type solution_data

    ```


    The observer_list is introduced because you cannot use default assignment to a
    class variable. The alternative is to require a user-defined assignment routine.
    Therefore, instead of the observer objects themselves you store a pointer to these
    objects. Fortran does not have arrays of pointers, but you can use a workaround:
    an array of derived type which contains a pointer component.


    You can define an abstract interface for the checking routine and an abstract
    interface that serves as a “parent” class for the actual observer objects:


    ```

    abstract interface

    logical function check_result(obs, result_data )

    import :: observer, solution_data

    class(observer) :: obs

    type(solution_data) :: result_data ! Type, not class

    end function check_result

    end interface

    ```


    Descendants of the class observer must define a procedure check with the interface
    check_result. What is in this procedure is completely up to the particular implementation.'
