  img_proc: true
- pgno: 189
  md: "# 174 MODERN FORTRAN IN PRACTICE\n\n```\n!\n! Define what the named interface\
    \ \"add_vector\" should\n! look like\n!\nabstract interface\nsubroutine add_vector(point,\
    \ vector )\n    import abstract_point\n    class(abstract_point), intent(inout)\
    \ :: point\n    class(abstract_point), intent(in) :: vector\nend subroutine add_vector\n\
    ```\n\nYou cannot declare ordinary variables to be of type(abstract_point) because\
    \ it is an abstract type. To use it you need to define some type that extends\
    \ it (note that the procedure add is not an interface name):\n\n```\ntype, extends(abstract_point)\
    \ :: point2d\nreal :: x, y\ncontains\n    procedure :: add => add_vector_2d\n\
    end type point2d\n```\n\n```\ntype(point2d) :: point\n```\n\nYou can declare a\
    \ pointer (or allocatable) variable to be of class(abstract_point), but at some\
    \ point it should be associated with a “concrete” type, as per point2d:\n\n```\n\
    class(abstract_point), pointer :: p\ntype(point2d), target :: point\ntype(point2d)\
    \ :: vector\n```\n\n```\np = point\ncall p%add_vector( vector )\n```\n\nAny type\
    \ that extends abstract_point must define the add procedure with the correct interface.\
    \ This guarantees that you can write generic code like the random walk presented\
    \ in the previous section. In other words, the abstract type defines a contract\
    \ [64]. If you want to use facilities that rely on this abstract type, you will\
    \ have to satisfy this contract. However, then you have access to a generic interface\
    \ of these facilities.\n\nAnother example is module to sort an array of items.\
    \ In Fortran 90/95, you need to implement a specific version for each type you\
    \ want to use, even though this can be done with a minimum of repeated code (replace\
    \ <module> and <type> by the appropriate actual names):"
