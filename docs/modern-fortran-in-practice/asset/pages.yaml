- pgno: 36
  md: "# 3.\nMathematical Abstractions\n\nThe features of Fortran 90 and later to\
    \ define operations for derived types, to use array operations, and, for Fortran\
    \ 2003 and later, to store procedure pointers allow a high-level style of programming\
    \ that can be likened to functional programming languages such as Lisp. We will\
    \ discuss several examples: automatic differentiation, integer programming, Diophantine\
    \ equations, and dynamic expressions.\n\n# 3.1 Automatic Differentiation\n\nWhen\
    \ solving differential equations or finding the roots of some function, you often\
    \ use the first derivative of the functions involved. It is, of course, possible\
    \ to implement the function and its derivative explicitly, but that is error-prone\
    \ if the function is even mildly complicated. For example, let the function $f$\
    \ be defined as:\n\n```\n$f(x) = \\frac{x}{(1-x^2)^2} - \\frac{e^{-x}}{1+\\cos^2\
    \ x} \\quad (3.1)$\n```\n\nHere is the first derivative:\n\n```\n$f'(x) = \\frac{1+3x^2}{(1-x^2)^3}\
    \ - e^{-x}\\frac{1+\\cos^2x-\\sin2x}{(1+\\cos^2x)^2} \\quad (3.2)$\n```\n\nDetermining\
    \ the derivative of a function is a completely mechanical process. You just follow\
    \ the basic rules. Because of this property we can automate it using overloaded\
    \ operators [38]. We start with a derived type, autoderiv:\n\n```\ntype autoderiv\n\
    real :: v\nreal :: dv\n type autoderiv\n```"
  merge: -1
  img_proc: true
- pgno: 37
  md: "# 22 MODERN FORTRAN IN PRACTICE\n\nIn this type, the component v represents\
    \ the value of the independent variable\nor the function value and dv, the derivative.\
    \ Summing two such variables is\ndone using this function:\n\n```\nfunction add_vv(\
    \ x, y ) result( z )\n  type(autodderiv), intent(in) :: x\n  type(autodderiv),\
    \ intent(in) :: y\n  type(autodderiv)               :: z\n```\n\n```\nz'v = x'v\
    \ + y'v\nz'dv = x'dv + y'dv\nend function add_vv\n```\n\nMultiplying them is a\
    \ bit more complicated, as you need to use the multi-plication rule for the derivative\
    \ components (note the intent(in) attributes,\nthese are required on:\n\n```\n\
    function mult_vv( x, y ) result( z )\n  type(autodderiv), intent(in) :: x\n  type(autodderiv),\
    \ intent(in) :: y\n  type(autodderiv)               :: z\n```\n\n```\nz'v = x'v\
    \ * y'v\nz'dv = x'dv * y'v + x'v * y'dv\nend function mult_vv\n```\n\nLikewise,\
    \ you define functions for subtraction, division, and all mathematical\nfunctions\
    \ you are interested in. Via interface blocks you then tie these functions\nto\
    \ the arithmetical operations:\n\n```\ninterface operator(+)\n  module procedure\
    \ add_vv\nend interface\ninterface operator(*)\n  module procedure mult_vv\nend\
    \ interface\n```\n\nNext apply this technique to the function f(x) = cos(x/(1\
    \ + x^2)) - 1/2:\n\n```\nfunction f( x ) result( z )\n  type(autodderiv), intent(in)\
    \ :: x\n  type(autodderiv)               :: z\n```\n\n```\nz = cos(x) / (1 + x**2)\
    \ - 0.5\nend function f\n```\n\nBecause of the overloading, the function looks\
    \ just like a normal mathematical\nfunction, only the return type and the type\
    \ of the arguments is special."
