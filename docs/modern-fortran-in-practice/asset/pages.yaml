    \ = array(i)\n        array(i) = array(j)\n        array(j) = temp\n      endif\n\
    \    enddo\n  enddo\n\nend subroutine sort\nend program nearest_neighbors\n```\n\
    \nQuickSort\nWith array constructors, you can do even more surprising things.\
    \ This implementation- of the well-known QuickSort algorithm may not be fast (and\
    \ it consumes more memory than necessary), but it is rather compact:\n\n```\n\
    recursive function qsort_reals( data ) result( sorted )\n  real, dimension(:),\
    \ intent(in) :: data\n  real, dimension(1:size(data)) :: sorted\n\n  if ( size(data)\
    \ > 1 ) then\n    sorted = =\n      (/ qsort_reals( pack( data(2:), data(2:) >\
    \ data(1) ) ), &\n      data(1),\n      qsort_reals( pack( data(2:), data(2:)\
    \ <= data(1) ) ) /)\n  else\n    sorted = data\n  endif\nend function qsort_reals\n\
    ```\n\n+   These lines of code have two important properties:\n* Arrays in Fortran\
    \ have length 0, which removes the need for a number of special cases in this\
    \ function.\n* The conditions are carefully chosen so that the constructed array\
    \ has exactly the same length as the input array. The function should also work\
    \ if the same value occurs multiple times."
