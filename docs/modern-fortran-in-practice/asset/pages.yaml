    # 5.3 Passing Extra Arguments


    As an alternative to the previous approaches, have a look at what you can do with
    extra arguments. The integration routine does not use them directly because they
    are only needed by the function. The challenge is to pass them along.


    Array of Parameters The simplest solution is to pass an array of parameters:


    ```

    subroutine integrate_trapezoid( f, params, xmin, xmax, &

    steps, result )

    ...

    ```


    ```

    interface

    real function f(x, params)

    real, intent(in) :: x

    real, dimension(:), intent(in) :: params

    end function f

    end interface

    ```


    ```

    real, dimension(:) :: params

    ...

    ```


    end subroutine


    The function f can be implemented in a straightforward way:


    ```

    f = exp(-params(1)*x) * cos(params(2)*x)

    ```


    end function f


    However, if the set of parameters does not consist of reals, this solution is
    awkward [65]. In other situations than this numerical integration problem, you
    might be dealing with character strings or linked lists. Therefore, an alternative
    needs to allow more general data types.'
