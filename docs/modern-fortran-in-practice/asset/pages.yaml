    \nSolving this mathematical problem using finite differences gives a set of algebraic\
    \ equations:\n\n```\n$T_{ij}^{t+\\Delta t} = T_{ij}^t + a \\Delta t \\left( \\\
    frac{T_{i-1,j}^{t} + T_{i+1,j}^{t} - 2T_{ij}^t}{\\Delta x^2} + \\frac{T_{i,j-1}^{t}\
    \ + T_{i,j+1}^{t} - 2T_{ij}^t}{\\Delta y^2} \\right) (12.5)\n```\n\nwhere the\
    \ indices $i$ and $j$ run over the whole interior of the grid.\nYou apply parallel\
    \ programming techniques in a variety of ways. With OpenMP, you can split up the\
    \ loops, for instance, the outer one, but that gives a low-level type of parallel\
    \ computing only. A more interesting method is to split up the beam (or whatever\
    \ geometry you encounter in practice) into smaller domains (see Figure 12.2).\
