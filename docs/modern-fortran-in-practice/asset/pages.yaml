  md: '# 78 MODERN FORTRAN IN PRACTICE


    ```

    for ( i = 0; i < 20; i ++) {

    array2d[i] = (int *) malloc((i+1) * sizeof(int));

    }

    ```


    and will create a set of one-dimensional arrays with a different length. Fortran
    does not allow that sort of pattern, at least not with the same notation as regular
    two-dimensional arrays. Instead, in Fortran arrays are, conceptually, contiguous
    blocks of memory whose elements are indexed with one, two, or more indices. If
    you need to pass a two-dimensional array to C, then use code to create the array
    of pointers that C requires.


    / The two-dimensional Fortran array f_array(dim1,dim2) appears as a one-dimensional
    array on the C side

    Extra complication: dimensions in C are reversed wrt Fortran

    /


    ```

    void pass_2d_array( int *f_array, int *dim1, int *dim2 ) {


    int i;

    **c_array;


    /* Create a c_array[dim2][dim1] */

    c_array = (int **) malloc(*dim2) * sizeof(int *));


    for ( i = 0; i < *dim2; i++) {

    c_array[i] = f_array + (*dim1) * i;

    }

    }

    ```


    In the previous C code, you can access array Fortran element f_array(4,5) as c_array[4]
    [3].


    With the advent of Fortran 2003, a lot has changed in the way you can interface
    with C. Using the iso_binding intrinsic module, you can specify more of the interface
    on the Fortran side (see Section 6.4). For instance, you can specify kinds for
    all basic data types so that they match the C data types. A type integer(c_long)
    in Fortran corresponds to a long int in C, whereas previously you had to take
    into account that C does not make guarantees about the actual size of a long int.
    The C standard guarantees:


    ```

    short int <= long int

    ```


    On 32-bits platforms, a long int is typically 32 bits long and on a 64-bits platform
    it is 64 bits, while an int is 32 bits.


    > In C indices, starts at 0, meaning you need to offset the indices by -1 and
    the order of the indices reversed.'
