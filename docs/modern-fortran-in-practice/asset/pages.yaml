    make ../sources -G "Visual Studio 2008"

    ```


    gives a solution that you can load into visual studio.

    The drawback is that these makefiles are specific to the system on which they
    were generated, so you need to distribute the CMakeLists.txt files along with
    the source code and the user will have to run CMake themselves. The advantage
    is, of course, that CMake itself is platform-independent and has excellent support
    for Fortran.

    Table A.1 gives an overview of the files needed in both cases.


    # A.3 Integrated Development Environments


    The purpose of integrated development environments (IDEs) is to offer a complete
    set of tools to edit the source code, build the program, and debug or run it.
    They also maintain the information about how to build (from what sources, what
    compilers, and so on).


    Having all these within one single (graphical) environment is certainly worthwhile,
    but it has a few drawbacks. They often work with specific files that describe
    how to build the program, which limits you to that IDE. The source file editor
    integrated into the environment may not be to your liking. Another important drawback,
    they tend to be platform-specific (running only on a particular operating system
    and the choice of compilers limited).


    The major advantage of IDEs is that they take care of tedious aspects of building
    a program: set up the dependencies or determine the order in which'
