- pgno: 136
  md: '# 9.

    Code Reviews


    There is extensive literature on reviewing code and design documents as a means
    to check that the software is performing as it should and that the implementation
    is maintainable and understandable. Some development methodologies, such as Extreme
    Programming [16], prescribe continuous reviews by peers [40]. In all forms, code
    reviews are about finding defects in the code, but they are not intended to criticize
    the programmer.


    While the procedural (and psychological) aspects of code reviews are widely described,
    some practical aspects are not. For example, what should you be looking for the
    code? It is not enough to check that the code adheres to the programming standard
    of the project it belongs to. Such a standard may not exist, be incomplete, or
    be focused on layout, not on questionable constructs that are a liability (see
    Appendix B).


    What do you want to achieve with code reviews? First, you want to verify that
    the code is doing its job and that the code is of good quality:


    +   - It is readable by others than the author.

    - It is maintainable – adding new functionality or correcting bugs should not
    amount to hard labor.

    - It is testable – do you understand what goes in and what comes out?


    Secondly, the code should be portable. This means it should be possible to build
    the program and run it on a different operating system, and also with different
    compilers and versions of that same compiler. Many compilers offer options to
    check against the language standard. Therefore, use it to see if you accidentally
    used some compiler-specific feature.


    From these considerations, here are four “principles” and a number of practical
    guidelines:


    +   - Be explicit.

    - Don''t stray.

    - Avoid traps.

    - Use clean code.


    # 9.1 Be Explicit


    The source code is the most important product from which you can judge software
    works, therefore, you must rely on that source code to give you all the information
    you need.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# MODERN FORTRAN IN PRACTICE


    Use Explicit Declarations of Variables and Constants While Fortran of old is perfectly
    happy to use undeclared variables and determine their types from a few simple
    rules, it is also easy to make mistakes that go undetected for a long time. Consider
    this code fragment:


    ```

    integer :: i

    real, dimension(10) :: x

    do i = 1,10

    x(i) = 2.0 * i + 1

    enddo

    ```


    The typos (the use of a lower-case "L" instead of a digit "1") would be caught
    by the compiler if explicit declarations were enforced. Therefore, always implicit
    none.


    Some compilers have an option to force an error if an undeclared variable is used,
    then you rely on something outside the source code and it is not a portable feature.
    Also, some compilers allow you to change the meaning of a default rate or integer.
    This can make double precision by default turn integers into 8-byte integers.
    Again, this makes the program run on features not visible in the code.


    Another example is the use of literal numbers in the source code:


    ```

    rate = rate * 1.1570407040412e-5

    ```


    The number will probably not be recognized as 1/86400, where 86400 is the number
    of seconds in a day. The computation is intended to convert the "rate" from `day⁻`
    to `s⁻`. Instead, declare a parameter to make this conversion explicitly:


    ```

    ! Convert from 1/day to 1/s

    real, parameter :: per_day = 1.0/(24.0*3600.0)

    ```


    While you are at, use an explicit kind:


    ```

    ! An alternative that is even more precise:

