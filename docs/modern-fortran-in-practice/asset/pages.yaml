    \ sends out the data for the new task and receives the primes that are found by\
    \ examining the message received. When enough primes are found, all copies are\
    \ informed that there are no more tasks to be done.\n\nThe routine get_range that\
    \ is run by all worker copies sends for a new task and waits for the data for\
