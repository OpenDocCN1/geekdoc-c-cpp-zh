- pgno: 16
  md: '# 1.

    Introduction to Modern Fortran


    Since the publication of the FORTRAN 77 standard the Fortran language has undergone
    a large number of revisions [61]. The changes that were introduced reflect new
    insights in programming techniques and new developments in computer hardware.
    From the very start, the language has been designed with computing efficiency
    in. The latest standard as of this writing, Fortran 2008, puts even more emphasis
    on this aspect by introducing explicit support for parallel processing [71].


    This first chapter gives an overview of the various standards that have appeared
    after FORTRAN 77. There is no attempt to be complete or even describe all major
    features, as would mean a whole book or even a series of books. Consult Metcalf
    [63], [65] or Brainerd et al. [36] for a detailed description of the standards.


    # 1.1 The Flavor of Modern Fortran


    The Fortran 90 standard introduced some very significant changes with respect
    to the widespread FORTRAN 77 standard: free source code, array operations, modules,
    and derived types to name a few. To give an impression of what this means for
    the programmer, consider this simple problem: you have a file with numbers, one
    per line (to keep it simple), and you want to determine the distribution of these
    numbers to produce a simple histogram. In FORTRAN 77, a program that might look
    like the following:


    +   * Produce a simple histogram


    ```

    PROGRAM HIST


    INTEGER MAXDATA

    PARAMETER (MAXDATA = 1000)

    ```


    > ¹ Officially, Fortran 77 should be written as FORTRAN 77. Since the Fortran
    90 standard, the name is written in lowercase.'
  merge: -1
  img_proc: true
