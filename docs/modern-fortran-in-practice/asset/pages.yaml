  md: "# 14 MODERN FORTRAN IN PRACTICE\n\nIn consequence, using such functions can\
    \ lead to more compact, and, in many cases, clearer code. But they do have drawbacks:\n\
    \n+   - You cannot access individual elements directly. For instance, to determine\
    \ the second largest element of an array, you need to first store the result of\
    \ a sort function to a separate array.\n\n+   - Similarly, if you need the result\
    \ in more than one place, you have to copy it to an actual array or pass it to\
    \ a function or subroutine.\n\n+   - The functions produce intermediate arrays\
    \ need to be allocated and deallocated at appropriate times. This may influence\
    \ the performance of the program.\n\nWhether these drawbacks are a serious problem\
    \ greatly depends on the context in which this feature is used. The style of programming\
    \ is, at the very least, quite economic in lines of code and conveys the purpose\
    \ much clearly. Also compilers improve all the time, so performance should not\
    \ be your first concern.\n\n# Performance with Array-Valued Functions To illustrate\
    \ the difference in performance, the mean value of random numbers larger than\
    \ a threshold is computed using two methods:\n\n+   - Filter the data that are\
    \ larger than the threshold via pack() and determine the mean from that:\n\n```\n\
    call random_data( data )\n...\ncall mean_pack( pack( data, data > threshold ),\
    \ mean1 )\nImplement the subroutine mean_pack:\nsubroutine mean_pack(data, mean)\n\
    \  real, dimension(:) :: data\n  real :: mean\n\n  mean = sum(data)/max(1,size(data))\n\
    ```\n\n+   - Pass the complete array (filled with the same random numbers) to\
    \ a subroutine that selects the data and determines the sum in a do loop:\n\n\
    ```\ncall random_data( data )\n...\ncall mean_do_loop( data, threshold, mean2\
    \ )\nImplement the subroutine in question:\nsubroutine mean_do_loop(data, threshold,\
    \ mean)\n  real, dimension(:) :: data\n  real :: threshold\n  real :: mean\n```"
