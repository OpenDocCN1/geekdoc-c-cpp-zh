    \ xmin, xmax, steps, result)\n\n  write(*,*) 'Result: ', result\n\n  end\n```\n\
    \nCOMMON blocks have a rather bad reputation:\n\n+   - You need to include the\
    \ same source code defining the COMMON block in each route that uses it.\n- You\
    \ are allowed to use different variable names and even different variable types\
    \ for defining the same COMMON block (only the block's name is fixed), as they\
    \ only provide access to a piece of memory.\n\n**Data in Modules** Module variables\
    \ are much more reliable: you define them in one location – the module – and you\
    \ can access them **by using** the module. A preferable implementation in Fortran\
    \ 90 is:\n\n```\nmodule functions\n  implicit none\n\n!\n  ! Publicly accessible\
    \ parameters\n!\n  real :: a, b\ncontains\nreal function f( x)\n\n  real, intent(in)\
    \ :: x\n\n  f = exp(-a*x) * cos(b*x)\n\nend function f\nend module functions\n\
    ```"
