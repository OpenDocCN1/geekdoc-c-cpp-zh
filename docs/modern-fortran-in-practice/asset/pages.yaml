  md: "# 84 MODERN FORTRAN IN PRACTICE\n\nThe various MySQL routines have interfaces\
    \ like these:\n\n```\n```fortran\ninterface c_fetch_row\n  function c_fetch_row\
    \ (res) bind(C, name='mysql_fetch_row')\n    use, intrinsic :: iso_c_binding\n\
    \    type(c_ptr), value :: res\n    type(c_ptr) :: c_fetch_row\n  end function\n\
    end interface\n```\n```\n\nTo get the results of a query, row by row, into a Fortran\
    \ program, the function myfortran_c_fetch_row returns the data in the row as a\
    \ long string of characters and the C function c_fetch_lengths returns the lengths\
    \ of the fields within this long string. To manage these C data structures, several\
    \ intrinsic functions from the iso_c_binding module are used:\n\n```\n```fortran\n\
    ! Fetch a row. Returns false if no more rows available.\nlogical function myfortran_c_fetch_row(res,\
    \ intent(in)) :: res\ntype(myfortran_row), intent(out) :: row\n\ninteger(c_int),\
    \ pointer :: lenptr\ntype(c_ptr) :: lengths\n\n!\n! Fetch the row data itself.\n\
    row%c_row = c_fetch_row(res%res)\nmyfortran_c_fetch_row = c_associated(row%c_row)\n\
    \nif (.not. myfortran_c_fetch_row) return\n\n!\n! Fetch number of fields.\n!\n\
    row%num_fields = c_num_fields(res%res)\n\n!\n! Get field lengths.\n!\nallocate(row%lengths(row%num_fields))\n\
    \nlengths = c_fetch_lengths(res%res)\ncall c_f_pointer(lengths, lenptr, shape(row%lengths))\n\
    \nrow%lengths = lenptr\nend function myfortran_c_fetch_row\n```\n```"
