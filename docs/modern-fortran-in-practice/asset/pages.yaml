- pgno: 27
  md: "# 2.\n\n# Array-Valued Functions\n\nAlong with array operations the Fortran\
    \ 90 standard introduced the concept of functions returning arrays. Such functions\
    \ can be used for a very compact, high-level programming style, like what John\
    \ Backus, the “father” of Fortran, advocated in his speech for accepting the ACM\
    \ Award [13].nWhile Fortran 90 allowed the programmer to define functions that\
    \ return arrays of data, Fortran 95 introduced the concept of elemental functions\
    \ and procedures. In combination with several features were introduced in Fortran\
    \ 2003, these have become even more powerful and easy to use.\nM of the intrinsic\
    \ functions work directly on arrays and Fortran’s array operations transform one\
    \ array into another, without the need for explicit loops that can obscure the\
    \ programmer’s goal. For example, suppose you have an array of data and you want\
    \ to print only those values that are larger than some threshold. One way of doing\
    \ that is:\n\n```\ndo i = 1,size(data)\n if data(i) > threshold then\n write(*,\
    \ '(f10.4)') data(i)\n endif\nenddo\n```\n\nIf you use the pack() intrinsic function,\
    \ this can be written more compactly:\n\n```\nwrite(*, '(f10.4)') pack(data, data\
    \ > threshold )\n```\n\n# 2.1 Passing Arrays\n\nThe standard function pack() returns\
    \ only those elements of an array for which the accompanying array elements are\
    \ true. For example:\n\n```\ninteger, dimension(5) :: x := (/ 1, 2, 3, 4, 5 /\
    \ / )\n```\n\n```\nwrite(*,*) pack( x, x > 3 )\n```\n\nprints the numbers 4 and\
    \ 5, because these are the elements of the array x that are greater than 3. The\
    \ result is always an array, even if there is only one element that fits the condition,\
    \ or no elements at all, since zero-sized arrays are allowed."
  merge: -1
  img_proc: true
