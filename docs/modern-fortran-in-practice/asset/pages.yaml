  md: "# CODE REVIEWS\n\nPreconditions. A subroutine may expect its arguments to conform\
    \ to particular conditions. For example, if it reads a file that must already\
    \ exist, however, check these conditions inside the routine. A code fragment like:\n\
    \n```\ninquire( file = 'myfile.inp', exist = exists )\nif ( exists ) then\n  \
    \  call read_file( )\nendif\n```\n\nthe condition should be moved into the subroutine\
    \ itself. Now you have a distributed responsibility: the calling code must make\
    \ sure that the routine is not inadvertently called, whereas the routine itself\
    \ must also make sure that the file can be read properly.\n\nA related issue arises\
    \ with composite conditions:\n\n```\nif ( allocated(array).and. array(1) > 0 )\
    \ then\n...\nendif\n```\n\nIf the array is not allocated, the second part does\
    \ not need to be evaluated. However, there is no guarantee that the program will\
    \ never do that because Fortran does not guarantee short-circuiting.\n\nTherefore,\
    \ the preceding should be written as:\n\n```\nif ( allocated(array) ) then\n \
    \   if ( array(1) > 0 ) then\n...\nendif\n```\n\nVariables that Need to Retain\
    \ Their Values Between Calls Fortran has several rules to determine if a local\
    \ variable retains its value between calls. But, why not your understanding of\
    \ such rules? The save attribute or statement wherever you want a variable to\
    \ behave that way. (Even worse, some compilers keep all the local variables in\
    \ static memory because it is more efficient on that particular platform. This\
    \ means your program may work on that platform but not on others if you forget\
    \ the save attribute). And, of course, be explicit about what you want to save:\
    \ do not use the save statement without any names.\n\nVisibility of the Interface\
    \ to a Subroutine or Function Modern Fortran programs usually use assumed-shape\
    \ arrays, optional arguments, derived types and other features. In these cases,\
    \ it is very important that the compiler\n\n¹ Short-circuiting can lead to inefficient\
    \ machine code, especially when the condition has multiple logical connectors.\
    \ The given example could actually fail at run-time without short-circuiting as\
    \ it may access an element of an unallocated array."
