  md: '# # Appendix A


    # # Tools for Development and Maintenance


    Nowadays there are myriad tools to select from if you develop and maintain software.
    Much is open source, but there are also many commercial tools available. The development
    and maintenance tools include:


    +   - Compilers, linkers, and interactive debuggers

    - Build tools to automatically compile the source code in the right order

    - Integrated development environments

    - Tools for static and dynamic analysis

    - Version control systems

    - Tools for source code documentation


    This appendix describes some uses of these tools, but it does not provide a complete
    overview.


    # ## A.1 The Compiler


    Since the Fortran 90 standard, the language has gained features that make it easier
    for the compiler to perform static and dynamic analysis:


    +   - The implicit none statement (or equivalent compiler options) force the compiler
    to check that every variable is explicitly declared. This reduces the chance that
    typos inadvertently introduce bugs in the form of stray variables names into the
    program.


    +   - By putting all routines in modules, you make sure the compiler checks the
    number and types of arguments for subroutine and function calls. It also reduces
    name clashes when linking a large program, which uses many libraries.


    +   - By using assumed-shape arrays instead of assumed-size, the compiler can
    insert runtime checks for array bounds. Moreover, you do not need to add separate
    arguments for the size of arrays anymore. This makes the call simpler and less
    error-prone.


    Therefore, the compiler has become a much more powerful tool with respect to static
    and dynamic analysis.


    > Some compilers, like the Intel Fortran compiler, generate interfaces for all
    routines that are not part of a module. This enhances the compiler''s capability
    to diagnose mismatches in the arguments lists.'
  merge: -1
  img_proc: true
- pgno: 237
  md: "# APPENDIX A: TOOLS FOR DEVELOPMENT AND MAINTENANCE\n\n# A.2 Build Tools\n\n\
    The classic tool that helps build a program efficiently is the UNIX utility make\
    \ that can be found on most, if not all, systems in wide use today. The main attraction\
    \ of make is that it checks the source code needs to be compiled or not, reducing\
    \ the runtime of the build process. It does so by checking the given dependencies\
    \ between the object file, the source file, and any other files (such as include\
    \ files or module files).\n\nCreating and maintaining the input files for make,\
    \ the so-called makefiles, can be tedious and error-prone, as they contain platform\
    \ dependencies, different compilers with different options or the names of systems\
    \ of libraries, to name a few. This maintenance task is made easier by software\
    \ that actually generates these makefiles from more abstract and generic descriptions.\n\
    \nThis software typically examines the source code (you specify a list of source\
    \ files to check), determines from the dependencies, and generates the makefiles.\
    \ Two examples of these software systems are autools [20] and CMake [5]. Of the\
    \ two, autools is the oldest and it is well-established. However, it relies on\
    \ tools typically available under a UNIX-like environment, and it only generates\
    \ generic ones. CMake, on the other hand, can run on MS Windows, Linux, and Mac\
    \ OSX and it can generate project files for an integrated development environment\
    \ such as MS Visual Studio.\n\nHere is a small example of both. The program consists\
    \ of a source file \"prog.f90\" living in the \"main\" and a file \"lib.f90\"\
    \ living in the directory \"lib\". For autools, you need files like this \"Makefile.am\"\
    \ to describe how to build the program from its components:\n\n```\n$($top_srcdir)/common.am\n\
    bin_PROGRAMS = example\n```\n\n```\nexample_SOURCES = \\\n    prog.f90\n```\n\n\
    ```\n#\n# Extend the macro FMODULES, defined in \"common.am\" to access\n# the\
    \ directory with the module file.\n#\nFMODULES += -I$(top_srcdir)/lib\n```\n\n\
    ```\nexample_LDADD = \\\n    $$(top_srcdir)/lib/libia.a\n```\n\nYou then run the\
    \ autoconf program that delivers a shell script configure and templates for the\
    \ makefiles:\n\n```\nautoconf -ivf\n./configure\n```"
  merge: -1
  img_proc: true
