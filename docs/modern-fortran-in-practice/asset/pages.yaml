- pgno: 10
  md: '# Foreword


    The applications of Fortran span, very nearly, the whole period during which computers
    have been been in general-purpose use. This is quite remarkable and, given the
    demise so many other high-level languages, it is quite difficult to know why.
    Possibly the original design concepts of John Backus – ease of use and efficiency
    of execution – have been two major factors. Another might be the devotion of Fortran''s
    user community, labor to keep it alive through many decades of developments in
    programming techniques and adapt it to ever-more demanding requirements.


    Despite all the predictions, over decades, Fortran is about to become extinct.
    Furthermore, over the last few years, it has been subject to new rounds of standardization,
    and the latest standard, Fortran 2008, should again extend the language''s life.
    Against this background, it is very regrettable that old versions of Fortran live
    on, both in the form of antiquated courses given by incorrigible teachers and
    also as an outmoded concept in the minds of its detractors. After all, modern
    Fortran is procedural, imperative, and compiled language with a syntax well suited
    to a direct representation of mathematical formulae. Its individual procedures
    may be compiled separately or grouped into modules, while allowing the convenient
    construction of very large programs and procedure libraries. The language contains
    features for array processing, abstract data types, dynamic structures, object-oriented
    programming, and parallel processing. It can readily be interfaced to C. Thus,
    modern Fort, as versions from Fortran 95 onwards are called, is a powerful tool.
    It fully supports structured programming, and the introduction of object-oriented
    programming into Fortran 2003, which was its most significant new feature, represented
    a major upgrade. Much of this is explained in this book.


    Nevertheless, no Fortran standard up to including Fortran 2003 contained any significant
    feature intended directly to facilitate parallel programming. Rather, this has
    to be achieved through the intermediate of hoc auxiliary standards, in particular
    HPF, MPI, OpenMP, and Posix Threads. The use of MPI and OpenMP has become widespread,
    but HPF, ultimately, met with little success. However, now, with the advent of
    Fortran 2008, a particular strength of modern Fortran is its ability to support
    parallel programming, as this latest standard introduces a sorely needed facility:
    coarrays.


    HPF directives took the form of Fortran comment lines that were recognized as
    only by an HPF processor. An example was the ability to align three'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# xii FOREWORD


    conformable (matching in size) arrays with a fourth, thus ensuring locality of
    reference. Further directives allowed, for instance, aligned arrays to be distributed
    over a set of processors. MPI, on the other hand, is a library specification for
    message passing, and OpenMP, which supports multipatform, shared-memory parallel
    programming, consists of a set of compiler directives, library routines, and environment
    variables that determine run-time behavior. Threads is a library specification,
    for multithreading.


    By contrast, the effect of coarrays is to provide a syntax, designed to make the
    smallest possible impact on the appearance of a program, that enables the distribution
    over some number of processors not only of data, but as a Single-Instruction-Multiple-Data
    (SIMD) model, but also of work, using the Single-Program-Multiple-Data (SPMD)
    model. The facility requires a programmer to learn only a modest set of new rules.
    Coarray handling for Fortran 2008''s most important new feature, the do concurrent
    of loop control is also introduced as a way of parallelizing loops. We then see
    how it becomes possible to achieve a significant degree of parallelization without
    going outside the language itself. These various paradigms are compared and contrasted
    in this book.


    Other major features in Fortran 2008 include: modules, enhanced access to data
    objects, enhancements to I/O and execution control, and additional new intrinsic
    procedures, in particular for bit processing. Fortran 2008 was published in 2010
    and is the current standard. If Fortran lives on it, it will be well suited to
    applications in high-performance computing and thus, coarrays will be crucial.


    But a language cannot survive without a means to learn about it. This implies
    the availability of textbooks of the language''s syntax and semantics, but also
    of books on how to use the language in real-life situations. Sometimes, experience
    in the use and application of a language needs to be passed on to a new generation
    of programmers and new features require advice on how they are best to be used.
    At a time when single language is rarely used in isolation, but more often in
    conjunction with other languages or with various tools, Modern Fortran in Practice
    fulfills a real need for practical advice in the field.


    The author has been a regular contributor to the ACM newsletter Fortune Forum
    and has given valuable and much appreciated advice on the comp. lang.fortran user
    newsgroup, where he has been very active as a contributor. The community has been
    able to benefit from his experience in scientific programming in The Netherlands.
    His papers on topics such as generic programming and design patterns were quite
    novel to Fortran. Thus, he is more than amply qualified to write this book.


    But Modern Fortran in Practice is not merely a concatenation of previous contributions.
    They have been woven into a coherent program, together with original material
    on parallel programming in Fortran, using MPI, OpenMP'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'and, briefly, coarrays, as well as on the use of Fortran for graphics applications
    and within GUIs. It is supplemented by extended examples that will be invaluable
    to providing a framework upon which users can build.


    This book is a most worthwhile undertaking and I commend it to all Fortran practitioners.
    After all, as we have seen, Fortran is in for the long haul.


    Michael Metcalf

    Tokyo, October 2011'
