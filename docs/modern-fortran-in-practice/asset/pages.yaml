- pgno: 135
  md: '# 8.4 Concluding Remarks


    While this cannot be enforced in a general framework, it is important that each
    test routine works independently of any other. This sometimes leads to duplication
    of code, but an interdependency means that failure in one test obscures the correct
    execution of the other, but


    In the example, the test routines are an integral part of the actual program,
    but this is not the only possible setup. Program, however, can put the test routines
    in a separate program as well. That program should, however, be an integral part
    of the whole project.


    The output from the framework consists of a plain text report (the titles of the
    test cases and any assertions that failed) and of an HTML file with the same information.
    You can use the latter type of output to show the report in an Internet browser.
    For instance, on Windows the following suffixes, thanks to the association of
    the file extension “.html" to the default browser:


    ```

    call system("ftunit.html")

    ```


    Unit testing can be combined with measuring the test coverage, recording what
    parts of the code are run. Tools exist to preprocess the source code, so that
    the coverage is automatically recorded or it can be left to the compiler via a
    suitable option (see Appendix A). Test coverage can be used to set up the individual
    tests, especially if several decisions are involved in the tested code. For numerical
    programs, the size of the problem to be solved may need to be taken into account.'
