- pgno: 150
  md: '# 10.

    Robust Implementation of Several Simple Algorithms


    Computer programs sometimes exhibit unexpected behavior. They may function correctly
    for years and then, suddenly, they fail. Computer programs that solve numerical
    problems are no exception. perhaps a division by zero, is often the consequence
    of input that does not conform to the hidden assumptions and restrictions of the
    program. For example, a Gauss elimination procedure to solve systems of linear
    equations requires the matrix to be non-singular. If the matrix is numerically
    singular or ill-conditioned, the mathematical problem of solving the system is
    well-defined, but the numerical counterpart may have a hard time delivering a
    decent approximation to the exact solution. The conclusion that the matrix is
    ill-conditioned is only drawn while solving the system.


    Sometimes there is a mismatch between the specification and the actual implementation.
    The part of the program that reads the data accepts input that conforms to the
    specification, but there are few tacit assumptions, like endings for a text file
    containing the coefficients of the matrix for the Gauss elimination program.


    Subtle bugs lurk in otherwise well-written and well-behaved program. Can you avoid
    them? The unsatisfactory answer is probably not, but that does not mean you cannot
    make an effort to understand the source of these bugs. That is the intention of
    this chapter — to examine three simple mathematical algorithms and their implementation
    in Fortran.


    The idea is that straightforward implementation contains all manners of hidden
    assumptions about the problem that needs solving. Careful examination reveals
    these assumptions, and then you can take measures to prevent them from causing
    failures in a practical situation – either by documenting the conditions on the
    input or by explicitly taking care of them in the code.'
  merge: -1
  img_proc: true
