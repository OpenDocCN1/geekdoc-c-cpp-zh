  md: "# 7.\nGraphics, GUIs, and the Internet\n\nInteraction with the user via graphical\
    \ presentation is an extremely important aspect of computing. It is also an area\
    \ that depends heavily on the available hardware and the operating system. While\
    \ much effort has been put into the various operating systems to hide the hardware\
    \ aspect, programming a graphical user-interface (GUI) on Windows is completely\
    \ different from doing so on Linux or Mac OS X.\nHardly any programming language\
    \ defines how you can display results or how to build a portable graphical user-interface.\
    \ The common approach is to use a library that hides – if possible or desirable\
    \ – the specifics of the operating system, so a portable result. Some libraries,\
    \ however, have been designed to take advantage of exactly one operating system,\
    \ so that the program fits seamlessly in that environment, at the cost of not\
    \ being portable anymore. At the same time, you should not underestimate the effort\
    \ and skills required for designing and building a useful and usable GUI [3].\n\
    \ a Fortran programmer, the situation is a bit complicated: most GUI libraries\
    \ are written with C, C++, and similar languages in mind. Furthermore, a GUI for\
    \ a long-running computation should have different properties than one for filling\
    \ in a database format. This chapter examines a variety of solutions.\n\n# 7.1\
    \ Plotting the Results\n\nThe first type of graphical interaction to examine is\
    \ the presentation of the results of a computation. The responses from the user\
    \ are simple: leaf through the collection of plots in many cases sequentially\
    \ – and may change a display parameter here and there. Anything more in the category\
    \ of GUIs. This is essentially one-way interaction, therefore, all you need is\
    \ a library of routines to draw various objects on the screen or in a file on\
    \ disk, like a PostScript or PDF file, for later processing.\n\nThere exists a\
