    \ xmin, xmax, steps, result)\n\nwrite(*,*) 'Result: ', result\n\nend program integrate_function\n\
    ```\n\nAdditional benefits of using modules are that the compiler can now check\
    \ the number and types of all arguments and subroutine and function names are\
    \ no longer completely global. In a large program that uses many libraries, global\
    \ names can cause all manner of conflicts.\n\nUsing module variables does have\
    \ an important drawback though. Multithreaded computing is more and more common\
    \ these days and without measures would be easy to have one thread mess up the\
    \ values in another thread.\n\nThe details depend on the method by which you implement\
    \ multithreading but if you use OpenMP, a possible solution to this problem is\
    \ this (Chapter 12):\n\n```\nmodule functions\nimplicit none\n\n!\n! Publicly\
    \ accessible parameters\n! Assume no more than 10 threads for simplicity\n!\n\
