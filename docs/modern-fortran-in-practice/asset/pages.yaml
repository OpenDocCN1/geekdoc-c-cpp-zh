  md: "# 170 MODERN FORTRAN IN PRACTICE\n\nThough in this case, it would not be entirely\
    \ impossible, the code for the routine_random_vector and others needs to distinguish\
    \ between the two types. Therefore, only one of the two pointer components is\
    \ associated and this is used to select the relevant code.\n\nWith the runtime\
    \ polymorphism that Fortran 2003 offers, this selection mechanism is completely\
    \ transparent. It is the dynamic type of the variable point that determines it.\n\
    \n**Determining the Dynamic Type** As previously discussed, sometimes you need\
    \ to know the dynamic type of a polymorphic variable to use it in the correct\
    \ way. For this, Fortran 2003 offers the select type construction as well as two\
    \ intrinsic functions to inquire about (dynamic) types, same_type_as() and extends_type_of().\n\
    \n**Particle Tracking** To illustrate object-oriented programming in Fortran,\
    \ extend the 2D point element in a different way. The points will be particles\
    \ in a hydrodynamic flow field, or an electromagnetic force field, if you prefer\
    \ that. You need to let the particles go with the flow field, but if they represent\
    \ droplets or grains of silt or sand, they will be influenced by gravitational\
    \ forces in addition to the flow field. The flow field itself may be schematized\
    \ by a set of analytical functions, an approximation on a rectangular grid or\
    \ a finite-element mesh. The variety in particle behavior, or the way the flow\
    \ field is handled, is encapsulated in the precise type of particles and in the\
    \ type of flow field, but the basic types are:\n\n```\nmodule particle_modelling\n\
    \    points2d3d\nn    implicit none\n\ntype, extends(point2) :: basic_particle_type\n\
    \    real :: mass\n    contains\n        procedure :: force => force_basic_particle\n\
    \        procedure, pass(particle) &\n            : :: new_position => position_basic_particle\n\
    end type basic_particle_type\n\ntype :: basic_flow_field_type\n    contains\n\
    \        procedure :: flow_velocity => velocity_basic_flow_field\nend type basic_flow_field_type\n\
    ```\n\ncontains"
