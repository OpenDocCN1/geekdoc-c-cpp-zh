- pgno: 58
  md: 'kind mechanism from Fortran 90 and the character lengths that are at least

    as old as FORTRAN 77. For example, suppose you are dealing with image

    processing. It would be very useful to have a derived type that stores the image

    data in such a way that you can hide all details, such as the image dimensions.

    With parametrized derived types, you can:


    ```

    type image_data( rows, columns )

    integer, len :: rows, columns

    integer, dimension(rows,columns) :: data

    end type

    ```


    (This assumes the image data are represented as discrete intensity, hence a

    single integer.)


    You can declare variables of this type with fixed dimensions:


    ```

    type(image_data(100,100)) :: picture

    type(image_data(5,5)) :: mask

    ```


    You can also adapt the dimensions to the problem at hand:³


    ```

    type(image_data(:)), allocatable :: picture

    integer :: rows, columns


    ! read the image size

    read(10, *) rows, columns


    allocate(image_data(rows, columns)) :: picture

    ```


    If you need another variable of this type with the same parameters, then you

    use source allocation:


    ```

    type(image_data(:)), allocatable :: picture1,picture2


    allocate(picture2, source :: picture1)

    ```


    The effect of source allocation is that the newly allocated variable has the

    s length parameters as the source variable, and that it has the same value.⁴nVariables
    of a parametrized type can be passed to routines in a similar way to

    t length of character strings:


    ```

    subroutine convolution( picture, mask, result )

    type(image_data(*)) :: picture, mask, result

    ...

    end subroutine

    ```


    > ³While you can use kind parameters as well to define a derived type, the kinds
    are fixed at compile-time.

    There is no way to redefine the kinds dynamically.


    > ⁴Fortran 2008 introduces the option to use the source variable as a "mold" only,
    so that the type

    parameters are copied, but not the value.'
  merge: -1
  img_proc: true
