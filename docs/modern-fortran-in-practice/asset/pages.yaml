    \             :: xmin, ymin, xmax, ymax\n  integer                       :: justify,\
    \ axis\n  integer                       :: i\n\n  ! Ask for the parameter \"a\"\
    \n  write(**) 'Value for the parameter \"a\":'\n  read(*,*) param\n\n  ! Parse\
    \ the command-line arguments\n  call plparseopts(PL_PARSE_FULL)\n\n  ! Initialize\
    \ the library\n  call plinit\n\n  ! Set up the viewport with default axes\n  xmin\
    \ = 0.0_plflt\n  xmax = 10.0_plflt\n  ymin = -1.0_plflt\n  ymax = 1.0_plflt\n\n\
    \  justify = 0\n  axis = 0\n  call plenv(xmin, ymin, xmax, ymax, justify, axis\
    \ )\n  call plab('(x)', '(y)', '&',\n    'Function: f(x) = exp(-x) * cos(ax)')\n\
    \n  ! Compute the values and draw the graph\n  do i = 1,size(x)\n    x(i) = (i-1)\
    \ * 0.05_plflt\n    y(i) = func(param, x(i) )\n  enddo\n\n  call plline( x, y\
    \ )\n\n  call plend\ncontains\n```\n\n> ¹ The real kind plflt is used to make\
