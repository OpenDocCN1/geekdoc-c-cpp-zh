  md: '# ROBUST IMPLEMENTATION OF SEVERAL SIMPLE ALGORITHMS


    ![](img/57520a202a0735ccfa4afc3beb12794b_172_0.png)


    **Figure 10.2.** Values of the quartic function $f(x) = (x^2 - 3)^2$ around the
    root $\sqrt{3}$. The floating-point values of x were enumerated using the Fortran
    90 nearest(function).


    With functions like:


    $f(x) = (x^2 - 3)^2 \quad (10.16)$


    $f(x) = 10^{10}(x^2 - 3)^2 \quad (10.17)$


    Furthermore, the values around the precise minimum are 10 times larger.

    A solution could be to specify a tolerance for the function value: any point where
    the function reaches a small enough absolute value is regarded as an approximation
    of its zero.


    Piecing it all together, we get the following steps:


    +   1. Determine if the initial guess, $x_0$, is within the domain of the function.
    If not, you cannot continue.


    +   2. If the value is small enough, you stop. However, also see if the exact
    root is enclosed or not in the tolerance interval.


    +   3. Determine a reasonable stepsize $\delta$ for estimating the derivative
    then take care of the step''s direction. If you cannot find a reasonable step,
    stop the procedure. (A reasonable stepsize is one where the function changes enough
    to determine the derivative accurately).


    +   4. Determine the next iterate. If not within the function''s domain, modify
    the estimate.'
