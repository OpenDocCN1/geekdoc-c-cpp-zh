    \ '?')\n```\n\n```\ncall sqlitestringc( command )\nprepared_columns => columns\n\
    call sqlite3_prepare( db, command, stmt, prepared_columns)\n```\n\n> !\nBind the\
    \ values\n!\n\n```\ndo i = 1,size(columns)\n  select case (columns(i)%type_set)\n\
    \    case (sqlite_int)\n      rc = sqlite3_bind_int_c(\n        stmt_handle, i,\
    \ columns(i)%int_value )\n    case (sqlite_double)\n      rc = sqlite3_bind_double_c(\n\
