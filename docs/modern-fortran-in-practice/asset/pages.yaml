- pgno: 125
  md: '# 110 MODERN FORTRAN PRACTICE


    The tag <book reference=... > is the start of a reference, while the tag </book>
    is the end of it. All information about the book is contained between these two
    tags via new tags.


    A tag, as in the example of "book", can also contain one or more *attributes:


    ```

    <book reference="GulliverTravels">

    ```


    These are always interpreted as key-value pairs with a character string as the
    value.

    Parsing the XML file is one thing, but handling the contents is quite another.
    There are several general strategies, each with its merits. You can simply read
    the file and process the contents as you go along. For example, you may want to
    reformat the preceding bibliography to a more suitable format (HTML) with CSS
    markup, for instance). This is known as theX approach.


    Another strategy, "document object model" or DOM, is to store the contents in
    a tree structure, so that you can search for the right elements: load the XML
    file into memory and print all references to Jonathan Swift or the entries in
    alphabetical order.


    Often, it is convenient to create a data structure that corresponds directly to
    the structure of the XML file:


    ```

    type book_reference

    character(len=20) :: key

    character(len=80) :: author

    character(len=200) :: title

    integer :: year

    end type book_reference

    ```


    ```

    type(book_reference), dimension(:), allocatable :: bibliography

    ```


    Once you have read the XML file into this structure, you can use the information
    directly:


    ```

    call load_bibliography( bibliography, xml file )

    call sort_author_and_year( bibliography )

    call print_( bibliography )

    ```


    There are a number of libraries that enable you to read XML files [18]. One is
    *xml-fortran*. The associated xmlreader utility takes a description of the XML
    file''s structure and generates a complete module to read XML files with this
    store and generate the information automatically. For the preceding bibliography
    file, the description may look like the following:


    ```

    <?xml version="1.0"?>

    <template>

    <options strict="yes" rootname="bibliography"/>

    <typedef name="book_t">

    ```'
