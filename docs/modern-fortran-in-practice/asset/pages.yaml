  md: "# 176 MODERN FORTRAN IN PRACTICE\n\nTwo modules are required to rename the\
    \ specific derived type (for instance, address) to the generic name data_type\
    \ then back to the specific name again. The one requirement to the derived type\
    \ is that it provides a comparison operation to determine if one value of that\
    \ type is smaller than another. example:\n\n```\nmodule address_module\n  type\
    \ address\n    character(len=40) :: name\n    character(len=40) :: street\n  end\
    \ type address\n\n  interface operator(<)\n    module procedure lower_address\n\
    \  end interface\n  contains\n    logical function lower_address( x, y )\n   \
    \   type(address), intent(in) :: x, y\n\n      if ( x%name /= y%name ) then\n\
    \        lower_address = x%name < y%name\n      else\n        lower_address =\
    \ x%street < y%street\n      endif\n    end function lower_address\nend module\
    \ address_module\n```\n\nIn Fortran 2003, you make these requirements part of\
    \ the definition of an abstract type:\n\n```\nmodule sortable_types\n  type, abstract\
    \ :: sortable\n    ! No particular data\n    procedure(islower), deferred :: islower\n\
    \    procedure(assign1), deferred :: assign_data\n    generic :: operator(<) =>\
    \ assign_data\n    generic :: assignment(=) => assign_data\n  end type\n  abstract\
    \ interface\n    logical function islower( item1, item2 )\n      import sortable\n\
    \      class(sortable), intent(in) :: item1, item2\n    end function islower\n\
    end interface\n```"
