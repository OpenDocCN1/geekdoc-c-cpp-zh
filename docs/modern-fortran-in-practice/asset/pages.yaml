    ```\n\n```\ncharacter(len=len(stringa)) :: copya\ncharacter(len=len(stringb))\
    \ :: copyb\n```\n\n```\ncopya = stringa\ncopyb = stringb\n```\n\n```\n! Convert\
    \ to uppercase\ncall toupper( copya )\ncall toupper( copyb )\n```\n\n```\nindex_ignore_case\
    \ = index( copya, copyb )\n```\n\nend function index_ignore_case"
