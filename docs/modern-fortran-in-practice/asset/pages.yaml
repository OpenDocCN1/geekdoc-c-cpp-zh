    # A.5 Version Control Systems


    An indispensable tool in modern software development is the version control system.
    The basic idea of the system is that you record the changes over time in the source
    code, documentation, and build files. This enables you to roll back changes that
    turned out to be unwanted, experiment with alternatives, or use new features while
    keeping the mainstream version intact. Most importantly, it allows for cooperation
    with other programmers.


    There is a wide variety of systems available: From the classic CVS or Subversion
    with a central repository to the newer distributed version control systems, such
    as git or fossil, every developer has a copy of the repository [8], [76]. Up to
    a point, it is a matter of taste which select. Most, if not all, offer commands
    as:


    +   - checkout: get the (current) version of the source files into a new directory.

    - update: merge the latest changes into your own files.'
