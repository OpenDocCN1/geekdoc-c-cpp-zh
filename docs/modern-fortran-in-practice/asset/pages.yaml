  md: "```\nmodule printable_sortable_types\nuse sortable_types\n\nimplicit none\n\
    \ntype, abstract, extends(sortable) :: printable_sortable\n    ! No particular\
    \ data\n    contains\n    procedure(print_item), deferred :: print\nend type printable_sortable\n\
    \nabstract interface\n    subroutine print_item( item )\n        import printable_sortable\n\
    \        class(printable_sortable), intent(in) :: item\n    end subroutine print_item\n\
    end interface\n```\n\n...\n\nend module printable_sortable_types\nIn this way,\
    \ the properties of the sortable type are propagated to a printable type. The\
    \ result is a derived type that combines the properties of both.\n\n# 11.3 Using\
    \ a Prototype Approach\n\nSo far this chapter has emphasized the class-based style\
    \ of object-oriented programming, meaning objects get their behavior from a centrally\
