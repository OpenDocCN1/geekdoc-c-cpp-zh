    # 3.2 Integer Programming


    As a second example, consider the following problem: For integer x, y ≥ 0, find
    the pair (x,y) for which f(x,y) = 3x + 4y is maximal, subject to the constraints:


    ```

    10x + 3y ≤ 200 (3.11)

    3x + 7y ≤ 121 (3.12)

    ```


    You can tackle this problem with brute force: Due to the constraints x must be
    between 0 and 20 and y lies in the range [0,17]. Therefore, looping over all pairs
    (x, y) within that region will give the desired answer.


    Using array operations and suitable derived types you can solve this problem in
    a more elegant way:


    ```

    type(integer_set) :: xset

    type(integer_set) :: yset

    type(integer_pair_set) :: c

    ```'
