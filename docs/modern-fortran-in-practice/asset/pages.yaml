- pgno: 153
  md: 'The implementation presumes a number of things about the input, but it is not
    clear what happens with number of edge cases. The following examines them:


    +   - Input arrays x and y should be filled with the x-coordinate in ascending
    order. If not, the do loop will turn up an arbitrary starting point and the result
    is equally arbitrary.


    +   - The size of the array y must be at least that of x – otherwise, at some
    data point xp, you will be outside the valid range.


    +   - The implementation tacit assumes linear extrapolation is required if the
    coordinate xp is greater than x(1) or greater than size(x). Whether this is a
    useful approach will depend on the algorithm. Alternatives are: return x(1) or
    x(size(x)) or return an indication that xp was outside the given range.


    +   - The number of data points, size(x), is assumed to be at least two. If not,
    the implementation will violate the array bounds.


    If two values of x are the same, the implementation is a model of discontinuity
    in the function. However, this does not work for xp exactly equal to these values
    for x: a division by zero results.


    This is unlikely to occur in practice. Nonetheless, one might want to control
    – just as in the case of extrapolation – what the program returns at the jump:
    return the left value, or the average. At the least, the documentation should
    be clear about this.


    +   - As a point of criticism, the implementation may fail with an overflow error
    if the values of x and y are large enough:


    > $x=\{1, 10^{30}\},y=\{1, 10^{30}\},xp=10^{20}.$


    The last statement in the program would involve the computation of $(10^{30} -
    1) \times (10^{30} - 1)$, which is a result that exceeds the range for single-precision
    floating-point numbers.


    If you change to:


    ```

    factor = (xp - x(idx)) / (x(idx+1) - x(idx))

    interpolate = y(idx) + factor * (y(idx+1) - y(idx))

    ```


    all operations involve numbers that are within range, if the result is within
    range.


    You can improve the implementation in two ways: by documenting in detail the assumptions
    (thereby, making the user responsible) or by checking the conditions on the input
    and allowing the user control over the details.'
