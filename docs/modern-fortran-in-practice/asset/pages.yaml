  md: "# 5.\nAn Interface Problem\n\nThis chapter focuses on how to make a general\
    \ (computing/programming) facility generic enough to be useful for a large set\
    \ of applications, but specific enough to make it practically usable. Concrete\
    \ examples are: a library for integrating differential equations or a library\
    \ to read XML files (Section 7.4). To elaborate on the second example, you can\
    \ read such files piece by piece and deal with the data you read directly or you\
    \ store the data in some convenient structure for later reference – the SAX and\
    \ the DOM approaches.\n\nNow examine various implementations for a somewhat simpler\
    \ problem: integrating over a particular interval.¹ You are not interested in\
    \ the numerical aspects, though they are quite interesting in their own right,\
    \ but rather in the methods available for integrating a well-behaved function\
    \ that depend on one or more parameters. For the function f:\n\n```\n$f(x) = e^{-ax}\
    \ \\cos bx (a, b \\ge 0)$\n```\n\nto be integrated over the interval [0, 10].\n\
    \nA general library of suitable integration methods might contain a routine such\
    \ as:\n\n```\nmodule integration_library\n\nimplicit none\n\ncontains\n\nsubroutine\
    \ integrate_trapezoid(f, xmin, xmax, steps, result )\n\ninterface\n  real function\
    \ f( x )\n    real, intent(in) :: x\n  end function f\nend interface\n\nreal,\
    \ intent(in) :: xmin, xmax\ninteger, intent(in) :: steps\n```\n\n> ¹ Oliveira\
    \ and Stewart [68] call this the environment problem. It is also discussed at\
    \ some length by [65]."
