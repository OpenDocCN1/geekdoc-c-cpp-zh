- pgno: 141
  md: "# 126 MODERN FORTRAN IN PRACTICE\n\n+   Conform to the agreed standard. If\
    \ you think the standard needs to be changed, discuss it separately from work\
    \ on the code.\n\nThis also means the programmer should have a good understanding\
    \ of the language: What features are acceptable and what features are a possibly\
    \ but nevertheless non-portable extension? The programmer should also be aware\
    \ of what are explicitly left to the discretion of the language implementation.\n\
    \nHere are a few examples:\n\n+   Declarations of the type real*4 or real(4) are\
    \ not portable and should be removed. real*4 is a common extension, but it has\
    \ never been part of a Fortran standard. real(4) hints at a common misunderstanding\
    \ of the mechanism: Compilers are free to use any positive number to select the\
    \ precision and range of the integer and real types. This is not necessarily identical\
    \ to the number of these bytes uses in memory.\n\n+   Unformatted files are not\
    \ portable between platforms: The record structure may differ, although there\
    \ exists a popular structure that (almost) universal. Beside the record structure,\
    \ the ordering of the bytes that make up a single number may differ, but as well\
    \ as the interpretation of these bytes. Again, a ubiquitous ordering and interpretation\
    \ exist, but they are not universal.\n\n+   Direct-access files pose a peculiar\
    \ issue: The unit of length is one byte with some compilers and one with others\
    \ (4 bytes on a 32-bit platform). Use the file_size parameter in the intrinsic\
    \ module iso_fortran_env to find out what the unit is (in bits).\n\n+   Tab characters\
    \ have no place in Fortran source code (with the possible exception of literal\
    \ strings). They are not part of the Fortran character set. Simply do not use\
    \ them. In the editor, they may expand to the right number of positions, but on\
    \ a printout the resulting indentation can be horrible.\n\n```\nif ( x > 0 ) then\n\
    \    valid = .true.\nelse\n    valid = .false.\nendif\n```\n\nindicates the programmer\
    \ does not quite understand logical expressions.\nHere is a simpler equivalent:\n\
    \n```\nvalid = x > 0\n```\n\nA code fragment such as:\n\n```\nif ( x > 0 ) then\n\
    \    valid = .true.\nendif\n```\n\n> ² Few things seem to be so provocative as\
    \ posing a standard to programmers [42], [6]."
