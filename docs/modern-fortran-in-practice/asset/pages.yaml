    \ can be changed or completely replaced independently of the presentation program\
    \ (and vice versa).\n\n# 7.2 Graphical User-Interfaces\n\nFrom the programmer's\
    \ point of view, graphical user-interfaces differ in one important aspect from\
    \ textual interfaces: There is no predefined order in which the user makes choices.\
    \ With a textual interface, the program can present a list"
