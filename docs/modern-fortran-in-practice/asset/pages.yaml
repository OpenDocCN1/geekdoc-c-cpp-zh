- pgno: 184
  md: "```\n! also to point_3d\n!class(point2d), pointer :: point, vector\n\ninteger\
    \ :: nsteps = 100\ninteger :: i\ninteger :: trial\nreal :: deltt = 0.1\n\ndo trial\
    \ = 1,2\n    ! Select what type of point ...\n    if ( trial == 1 ) then\n   \
    \     point => point_2d\n        vector => vector_2d\n\n        write(*,' 'Two-dimensional\
    \ walk:'\n    else\n        point => point_3d\n        vector => vector_3d\n\n\
    \        write(*,' 'Three-dimensional walk:'\n    endif\n\n    call point%/random_vector\n\
    \ndo i = 1,nsteps\n        call vector%/random_vector\n\n        point = point\
    \ + deltt * vector\n\n        call point%/print\n    enddo\nend program random_walk\n\
    ```\n\nBecause the variable point is declared to be of class(point2d), it can\
    \ point to any variable of type either point2d or an extension, like point3d.\n\
    The second iteration of the outer loop can use a 3D point. This would, in general,\
    \ be much harder to achieve with Fortran 90/95. One way, however, is to let a\
    \ general point consist of both a point2d pointer component and a point3d pointer\
    \ component:\n\n```\ntype :: point_t\ntype(point2d), pointer :: p2d => null()\n\
    type(point3d), pointer :: p3d => null()\nend type_t\n```"
