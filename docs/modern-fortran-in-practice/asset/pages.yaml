    PLplot is a library, or a collection of libraries, for plotting technical and
    scientific data, such that the source code is independent of the platform. It
    offers a wide range of output formats (both on screen and in files on disk) as
    well as interfaces to a variety of languages (C, Java, Octave, and Tcl to name
    a few).


    The style of programming is illustrated with a small example. The program reads
    a parameter for the function $f(x)=exp(-x)cos ax$ and draws a graph of function.
    To do this, it uses the following PLplot routines:


    +   - pparopts analyzes the command-line arguments and one or more parameters.


    +   - initializes the library, asks for the output device if it is not set (via
    the command-line arguments or the routine pdev), and brings up a graphical window.


    +   - plenv and plilab used to draw a simple axis with labels.


    +   - plline draws a continuous line through the data points.


    +   - plend finalizes the library (for example, in interactive mode it waits for
    the user to click in the window, while in batch mode it completes the output files.'
