    The derived type represents a chain of integers that can be extended via the .concat
    operation. The result is a new type(chain) data that contains the concatenated
    arrays of the two operands. When you assign one variable of this to another, a
    copy is made of the arrays of


    Whenever assigning a new value to a variable of this, any old memory must be deallocated
    and the right size (as shown in the subroutines assign_array and assign_chain).
    Otherwise, memory would be referenced twice or get lost. The problem, however,
    is that the program will not allocate the data in the temporary object that is
