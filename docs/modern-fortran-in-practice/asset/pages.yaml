    \ rectangles the computation of the area is done by the alternative routine pointed\
    \ to the procedure pointer. A very nice aspect of procedure pointers in Fortran\
    \ is that they are indistinguishable – to the code – from type-bound procedures.\
    \ You can use procedure pointers instead of type-bound procedures, with the same\
    \ pass() property. Only the position of the declaration is different (they come\
    \ before the contains keyword) and the fact that they can be changed dynamically\
    \ by object.\n\nTherefore, objects obtain a different behavior but still belong\
    \ to the same “class”. For instance, in modelling systems where the behavior of\
    \ individuals depends on their age or the time of year, this flexibility can be\
    \ greatly deployed (see the following).\n\nA concise example is shown in Chapter\
    \ 5. Instead of separate classes for all functions to integrate, you can define\
    \ a single class that takes a pointer to the specific function, as long as these\
    \ functions share the set of parameters defined in this class.\n\nThere are more\
    \ alternatives conceivable, such as delegation. The object in question can delegate\
    \ the actual work to a component or to a specific routine if one is defined on\
