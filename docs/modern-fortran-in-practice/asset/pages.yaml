  md: '# UNIT TESTING 119


    ![](img/57520a202a0735ccfa4afc3beb12794b_134_0.png)


    Figure 8.1. Screenshot of the graphical user interface


    particular file funit.run is in the working directory. If the test code is run,
    the program stops automatically in the routine runests_final. This is the reason
    the test routines should appear early in the program.


    Some non-Fortran programming is convenient. If the program under test suddenly
    stops because of a runtime error, or because it encounters an error condition
    that causes it to stop explicitly, the remaining tests should still run. This
    is achieved in several steps:


    +   - Each time a test runs, a file funit.1st records its start and when successful
    (that is, the program continues) also its completion.

    - The program under test runs via a script or a batch file that continues running
    the program as long as that particular file exists.

    - When the last test is run, the file is deleted automatically.


    In addition to this batch mode, there is a straightforward graphical user interface
    (Figure 8.1). It first runs the selected program in list mode so that it prints
    the descriptions of the tests (but not the routines). The GUI builds up the list
    of tests, so that you can run them all at once or only a small selection. If,
    in a test, an assertion fails or the program stops with a runtime error, this
    is recorded with an icon forming red.


    To accommodate for the problem of large datasets being necessary for a particular
    test – such as a complicated initial condition that is required for testing a
    solver for partial differential equations – the framework also offers some storage
    and retrieval routines. Here you can create and store the data, and save them
    with a descriptive text in a file, and retrieve them in any number of tests.'
