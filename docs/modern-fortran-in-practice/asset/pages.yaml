- pgno: 43
  md: "If the right-hand side in an assignment is the result of a function, the component\
    \ _from_function in the derived type is set to .true., so that the memory can\
    \ be pointed to instead of newly allocated:\n\n```\nsubroutine assign_set( setleft,\
    \ setright )\ntype(integer_set), intent(inout) :: setleft\ntype(integer_set),\
    \ intent(in) :: setright\n```\n\n```\nsetleft%from_function = .false\nif ( associated(setleft%elements)\
    \ ) then\n    deallocate( setleft%elements )\nendif\nif ( .not. setright%from_function\
    \ ) then\n    allocate( setleft%elements(size(setright%elements))\n    setleft%elements\
    \ = setright%elements\nelse\n    setleft%elements => setright%elements\nendif\n\
    ```\n\n```\nend subroutine assign_set\n```\n\nIn Fortran 2003, you have the move_alloc\
    \ routine, so that you can use a very similar technique for allocable components.\
    \ You can even rely on automatic reallocation:\n\n```\nif ( .not. setright%from_function\
    \ ) then\n    setleft%elements = setright%elements\nelse\n    call move_alloc(setright%elements,\
    \ setleft%elements)\nendif\n```\n\n# 3.3 Enumerating Solutions of Diophantine\
    \ Equations\n\nPointer pointers, defined in Fortran 2003, make it possible to\
    \ enumerate the solutions of Diophantine equations in a generic way. Such equations\
    \ take only integer or rational solutions. One example is Fermat's last theorem\
    \ - $x^n + y^n = z^n$, which has no non-trivial solutions for $n > 2$. Pell's\
    \ equation [82]:\n\n$y^2 = Ax^2 \\pm 1$ (A square free)\n\nis another well-known\
    \ example. Contrary to Fermat's theorem, these equations do have solutions and\
    \ even an infinite of them. One way of looking at this equation is: Consider the\
    \ left-hand side and the right-hand side as separate sets of points $(x, t)$ and\
    \ $(y, s)$:\n\n$S_1 = \\{(x, t) \\mid t = Ax^2 + 1, x \\in N\\}$\n\n$S_2 = \\\
    {(y, s) \\mid s = y^2, y \\in N\\}$"
  merge: -1
  img_proc: true
- pgno: 44
  md: "# MATHEMATICAL ABSTRACTIONS\n\nThen consider what is the $S_3$ defined as:\n\
    \n```\n$S_3 = \\{(x,y) \\mid (x,t) \\in S_1 \\wedge (y,s) \\in S_2 \\wedge t =\
    \ s\\}\\quad (3.16)\n```\n\nIf you assume that $t$ and $s$ are increasing functions\
    \ of $x$ and $y$, then a simple algorithm suffices to determine the elements of\
    \ $S_3$:\n\n+   1. Set $x$ and $y$ to 0.\n2. Determine $t = Ax^2 + 1$ and $s =\
    \ y^2$.\n3. If $t = s$, you have found a solution.\n4. If $t < s$, increase $x$\
    \ by 1 and go to step 2.\n5. If $t > s$, increase $y$ by 1 and go to step 2.\n\
    \nTo implement this mathematical algorithm, use a derived type that can store\
    \ the descriptions in Equations 3.14 and 3.15:\n\n```\ntype enum_func\n  type(enum_func),\
    \ pointer      :: f => null()\n  type(enum_func), pointer      :: g => null()\n\
    procedure(enumeration), pointer, pass(t) :: enum => null()\nend enum_func\n```\n\
    \nThis uses the feature that you can refer *recursively* to the same type. It\
    \ also uses an abstract interface to define what kind of procedures enum will\
    \ deal (see Chapter 11, which also discusses the *class* keyword):\n\n```\nabstract\
    \ interface\n  integer function enumeration(t, idx )\n    import :: enum_func\n\
    \    class(enum_func), intent(in) :: t\n    integer, intent(in)        :: idx\n\
    end function enumeration\n```\n\ninterface\n\nThe sets $S_1$ and $S_2$ are implemented\
    \ using these two functions:\n\n```\ninteger function y_square(t, idx )\n  class(enum_func),\
    \ intent(in) :: t ! Not used\n  integer, intent(in)        :: idx\n```\n\n```\n\
    y_square = idx ** 2\n```\n\nend function y_square\n\n```\ninteger function x_pell(t,\
    \ idx )\n  class(enum_func), intent(in) :: t ! Not used\n  integer, intent(in)\
    \        :: idx\n```\n\n```\nx_pell = 2 * idx ** 2 + 1\n```\n\nend function x_pell"
  merge: -1
  img_proc: true
- pgno: 45
  md: "# 30 MODERN FORTRAN IN PRACTICE\n\nThe set $S_3$ requires a bit more work,\
    \ the preceding algorithm is contained\nin the function combine:\n\n```\ninteger\
    \ function combine( t, idx )\n  class(enum_func), intent(in) :: t\n    integer,\
    \ intent(in)             :: idx\n\n  integer                          :: count,\
    \ i, j, fi, gj\n\n  count = 0\n  i = 0\n  j = 0\n\n  fi = t%f%enum(i)\n  gj =\
    \ t%g%enum(j)\n\n  do while (count < idx)\n    if (fi == gj) then\n      count\
    \ = count + 1\n      i = i + 1\n    else if (fi < gj) then\n      i = i + 1\n\
    \    else\n      j = j + 1\n    endif\n    fi = t%f%enum(i)\n    gj = t%g%enum(j)\n\
    \  enddo\n\n  combine = i - 1\\end function combine\n```\n\nAll you have to do\
    \ now is to create the Fortran equivalent of set $S_3$ and to\nenumerate a number\
    \ of its elements:\n\n```\nxright = func(x_pell )\nyleft = func(y_square )\n\n\
    xpeell = combination(xright, yleft, combine )\nypell = combination(yleft, xright,\
    \ combine )\n\ndo i = 1, 5\n  x = xpeell%enum(i)\n  y = ypell%enum(i)\n  write(*,*)\
    \ '>>', i, x, y\nend\n```"
  merge: -1
  img_proc: true
- pgno: 46
  md: "# MATHEMATICAL ABSTRACTIONS 31\n\nwhere the function func() is merely a convenience\
    \ function to set the enum component:\n\n```\nfunction func( f )\n  procedure(enumeration)\
    \ :: f\n  type(enum_func) :: func\n\nfunc%enum => f\n```\n\nend function\n\nThe\
    \ output of the program is:\n\n>> 0 1\n>> 2 2 3\n>> 3 12 17\n>> 4 70 99\n>> 5\
    \ 408 577\n\nBy inserting other functions, as h(x) = x³ + 2, you can solve other\
    \ Diophantine equations. Of course, the implementation of combine assumes that\
    \ there are solutions and you tacitly ignore the fact that the integers have a\
    \ finite range. However, these are more practical details that obscure the principle,\
    \ which is the reformulation of a mathematical problem into a Fortran program\
    \ that closely resolves the mathematics.\n\n# 3.4 Delayed Evaluation\n\nYou can\
    \ take the overloading of operations one step further. Instead of the routines\
    \ that do the computations immediately, you will store the operation. You do this\
    \ by creating an expression parse tree, so that you can evaluate it later. In\
    \ this way, you can create new expressions, new functions if you like, within\
    \ the running program. You cannot use the same syntax as ordinary functions, but\
    \ you do get the effect.\n\nHere is a simple example:\n\n```\ntype(integer_operand),\
    \ target :: x\ntype(integer_operand), target :: y\n\ntype(integer_relation) ::\
    \ relation\n```\n\n```\n!\n Store the relation, NOT the result\n!\nrelation =>\
    \ x + y == 0\n\nx = 1\nny = -1\nwrite(**) 'x', y: 1, -1 ', integer_relation_eval(\
    \ relation )\n```"
  merge: -1
  img_proc: true
- pgno: 47
  md: "# 32 MODERN FORTRAN IN PRACTICE\n\n```\nx = 2\ny = -1\nwrite(*, 'x, y: 2, -1\
    \ ', integer_relation_eval( relation )\n```\n\nFirst, set a variable that holds\
    \ the relation between two variables x and y that can be considered as holders\
    \ for integer values. Then by assigning an actual value to these variables, you\
    \ determine whether the relation holds or not. The hard work is done by the functions\
    \ integer_relation_eval and integer_eval:\n\n```\nfunction integer_relation_eval(\
    \ relation ) result(value)\ntype(integer_relation) :: relation\n  logical :: value\n\
    ```\n\n```\ncall integer_eval( relation%first )\ncall integer_eval( relation%second\
    \ )\n```\n\n```\nselect case(relation%relation)\ncase ( 1 )\n  !\n  ! Relation:\
    \ equality\n  !\n  value = relation%firstvalue == relation%second%value\ncase\
    \ ( 2 )\n  ... other relations (>, <, ...)\nend select\n```\n\n```\nend function\
    \ integer_relation_eval\n```\n\nThe function integer_eval is a recursive function\
    \ that looks like this:\n\n```\nrecursive subroutine integer_eval( x )\ntype(integer_operand)\
    \ :: x\n```\n\n```\nif ( associated( x%first ) ) call integer_eval( x%first )\n\
    if ( associated( x%second ) ) call integer_eval( x%second )\n```\n\n```\nselect\
    \ case( x%operation )\ncase ( 0 )\n  ! Nothing to be done\n```\n\n```\ncase (\
    \ 1 )\n  x%value = x%firstvalue + x%secondvalue\n```\n\n```\ncase ( 2 )\n  x%value\
    \ = x%firstvalue * x%secondvalue\n```\n\n```\ncase ( 3 )\n  x%value = x%firstvalue\
    \ ** x%secondvalue\n```"
  merge: -1
  img_proc: true
- pgno: 48
  md: "# MATHEMATICAL ABSTRACTIONS 33\n\n```\ncase default\n    ! Nothing to be done\n\
    end select\n```\n\n```\nend subroutine integer_eval\n```\n\nThe secret is for\
    \ the derived type integer_operand you have overloaded operations that store what\
    \ operation was called and with what operands, than do the actual computation:\n\
    \n```\nfunction integer_add( x, y ) result(add)\n    type(integer_operand), intent(in),\
    \ target :: x\n    type(integer_operand), intent(in), target :: y\n    type(integer_operand),\
    \ pointer :: add\n```\n\n```\nallocate( add )\n    add%operation = 1\n    add%first\
    \ => x\n    add%second => y\nend function integer_add\n```\n\nNote that the function\
    \ result, defined via the result variable add, is a pointer variable–it must persist\
    \ after the statement has been executed.\n\nThe previous example concerns a very\
    \ simple relation, but you can extend this to Pell's equation or any relation\
    \ between numbers. The full example shows how to create a pair of integers that\
    \ can then be queried:\n\n```\ntype(integer_operand), target :: x\ntype(integer_operand),\
    \ target :: y\n```\n\n```\ntype(integer_pair_set) :: set\n```\n\n```\nwrite(**)\
    \ 'Does the set {x,y} | y**2 = 3*x**2 + 1 & &contain(1,2) or (3,3)??'\n```\n\n\
    ```\nset = create_pair_set(y**2 == 3*x**2 + 1, range(x, 0, 0) & range(y, 0, 0)\
    \ )\n```\n\n```\nwrite(**) ' (1,2) in this set ', has_element(set, (/1,2))\nwrite(**)\
    \ ' (3,3) in this set ', has_element(set, (/3,3))\n```\n\nThe program produces\
    \ the following output:\n\n```\nDoes the set {x,y} | y**2 = 3*x**2 + 1 contain\
    \ (1,2) or (3,3)?\n(1,2) in this set? T\n(3,3) in this set? F\n```\n\n![](img/57520a202a0735ccfa4afc3beb12794b_48_0.png)"
