- pgno: 181
  md: "# 166 MODERN FORTRAN IN PRACTICE\n\nFirst, interfaces like add are overwritten\
    \ in extended types, but then you need to take care that the signature remains\
    \ essentially the same. The only required change is that the type of the object\
    \ passed is the extended type. In the preceding case, the signature of the routine\
    \ add_vector3d becomes:\n\n```\ntype(point2d) function add_vector3d( point, vector\
    \ )\n  class(point3d, intent(in) :: ! Required change!\n  type(point2d), intent(in)\
    \ :: vector\n\nend function add_vector3d\n```\n\nNote that the returned value\
    \ and the vector over which the point translates still type(point2d), not type(point3d).\
    \ The Fortran standard does not allow you to change that. Instead, you need polymorphic\
    \ variables.\n\nFor the two-dimensional case:\n\n```\nclass(point2d) function\
    \ add_vector_2d( point, vector )\n  class(point2d, intent(in) :: point\n  class(point2d),\
    \ intent(in) :: vector\n\nend function add_vector_2d\n```\n\nFor the three-dimensional\
    \ case:\n\n```\nclass(point2d) function add_vector_3d( point, vector )\n  class(point3d),\
    \ intent(in) :: point\n\n  ! This one still point2d\n  class(point2d), intent(in)\
    \ :: vector\n```\n\nend function add_vector_3d\n\nThis has some consequences for\
    \ the implementation of the actual routines as well: You cannot return a class\
    \ variable. It must be either an allocatable or a pointer, because the type is\
    \ dynamic. The allocation or the association transfers the type information as\
    \ well as information on the memory to be used. Therefore, the two-dimensional\
    \ variant becomes (note the allocation):\n\n```\nfunction add_vector_2d( point,\
    \ vector )\n  class(point2d), intent(in) :: point, vector\n  class(point2d), allocatable\
    \ :: add_vector_2d\n\nallocate( add_vector_2d )\n  add_vector_2d%x = point%x +\
    \ vector%x\n  add_vector_2d%y = point%y + vector%y\n\nend function add_vector_2d\n\
    ```"
