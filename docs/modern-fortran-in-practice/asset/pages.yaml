    reads a number using Fortran''s list-directed input features. While this is very
    flexible, it assume that input conforms to the rules. More specifically, the input
    is supposed to consist of valid numbers, separated by spaces, commas, or new lines.
    After each statement, the file pointer advances to the next line, if there is
