  md: "# 146 MODERN FORTRAN IN PRACTICE\n\nThis raises some questions about the details\
    \ of the file format:\n\n+   - List-directed input will skip an empty line. Should\
    \ that have been interpreted by the previous program as a missing value?\n- If\
    \ the line contains more than one value, it is accepted, but the other values\
    \ are silently ignored. Is that acceptable behavior?\n- What happens if the line\
    \ contains an invalid number, such as “1.0?”? Is this interpreted as a missing\
    \ value or is it reported separately?\n- More problems:\n  - What happens if the\
    \ line ends in the file do not match the platform? (Perhaps you have a UNIX/Linux\
    \ file on Windows or vice versa.)\n  - Sometimes files on Windows do not terminate\
    \ the last line with an end-file sequence. Can the list-directed read statement\
    \ handle in a clear?\n  - Fortran’s list-directed input does not accept tab characters.\
    \ As they are often not visible when viewing the file, they can be difficult to\
    \ detect.\n\nThe remedy to the issues mentioned here is not simple. It is not,\
    \ however, the fault of Fortran’s list-directed input features, rather that you\
    \ have underscored what input should be. The specification must pay attention\
    \ to what is not acceptable, too.\n\nYou can implement reading the data in such\
    \ a way that you can detect most of the issues already mentioned, by reading a\
    \ line of text from the file and analyzing in that detail. This is the second\
    \ version of the program. But, first pay attention to the computational part.\n\
    \nThe second part of the program is the actual computation of the statistical\
    \ parameters. The formulas are simple, but they present a few important problems.\
    \ First of all, the computation of the variance is numerically unstable. It is\
    \ easy to see: The program computes two sums and then uses the difference as the\
    \ final result. If the variation is small, then you subtract two large quantities\
    \ with significant rounding errors occur. A dramatic example is an input consisting\
    \ of nine times 0.1.\n\nOutcome:\n\n| Number of valid data: 9 |\n| Number of missing\
    \ data: 0 |\n\n| Mean value: 0.10000001 |\n| Standard deviation: NaN |\n\nNot\
    \ only is the mean value slightly different than 0.1, but is in fact computed\
    \ from the square root of a small negative number, the standard deviation, which\
    \ should have been 0, –1.93715111.10⁻⁹.\n\n> ³ I used the gfortran compiler under\
    \ Windows XP with default options to compute this result."
