  md: '# 156 MODERN FORTRAN IN PRACTICE


    Just as with the tolerance, the value of the stepsize is meaningless, unless you
    relate it to the *scale* of the function – a value of $1.0 \times 10^{-3}$ works
    with this function, but it does not:


    ```

    $h(x) = \begin{cases} 1 - \cos(10^4x) / x & \text{if } x \neq 0 \ 0 & \text{if
    } x = 0 \end{cases} \quad (10.10)$

    ```


    The first has a scale of 1, which is of order magnitude for over which the function
    values change considerably. The second has a scale of $10^{-4}$, therefore, the
    function varies much more rapidly.


    Given these considerations, you should ask the user to supply that scale, because
    it can be used to define the tolerance interval and the stepsize for numerical
    differentiation.


    Another refinement that you need if the implementation is to be robust: not all
    functions are defined over the entire range of floating-point numbers. For $f$
    defined by:


    ```

    $f(x) = \ln x - 1 \quad (10.11)$

    ```


    the iteration may produce a negative value of $x$. For a function like:


    ```

    $f(x) = e^x - 1 \quad (10.12)$

    ```


    the problem is that the function value may become too large to be represented
    as a floating-point number (for example, using a starting value of $-10$). Therefore,
    you need to deal with partial functions as well. One way is to ask the user to
    return a flag indicating if a domain error occurs or not. After determining the
    next acceptable estimate,


    +   - Compute the regular estimate:


    ```

    $x_{k+1} = x_k - \frac{f(x)}{f''(x)} \quad (10.13)$

    ```


    +   - If $x_{k+1}$ is within the domain, accept it.


    +   - If it is not, try:


    ```

    $x_{k+1} = x_k - \frac{f(x)}{2 f''(x)} \quad (10.14)$

    ```


    +   - Repeat the halving until an acceptable value is found.


    The initial estimate must, of course, be within the domain of $f$.

    The last point of concern is roots that are not first order. As long as the values
    in the neighborhood are both positive and negative, you get the situation as before,
    only the convergence is not quadratic anymore. The most problematic situation
    is roots where the function does not change sign. The function $f(x) = \sqrt{|x|}$
    leads to an oscillation:


    ```

    $x_{k+1} = x_k - f(x_k)/f''(x_k) = -x_k \quad (10.15)$

    ```'
