  md: "# Adequate Error Handling\n\nWith respect to errors that may occur, opening\
    \ and reading a file in Fortran is pretty easy.\n\n+   - Method 1: you do not\
    \ explicitly handle errors, therefore, the program will take care of itself with\
    \ drastic clear measures (it stops and prints an error message, possibly with\
    \ details of where it occurred).\n- Method 2: you use the keywords err=, end=\
    \ or iostat=\n\nIf you choose the second method, you have the opportunity to recover\
    \ from the error. But you also have the opportunity to ignore it:\n\n```\nopen(10,\
    \ file = 'non-existing-file.inp', status = 'old', &\niostat = ierr)\n```\n\n!\
    \ Happy go on -- ignore ier\n\n# Comparing Reals\n\nCommon wisdom suggests you\
    \ should not compare reals for (strict) equality or inequality, because of the\
    \ finite precision.⁴ Instead, you should use some margin or a \"fuzzy\" comparison\
    \ [51]. Actually, this rule can be relaxed in one way: if the mathematical real\
    \ number can be represented exactly. With a value -999.0, which is sometimes used\
    \ to indicate missing values and is exactly representable, the code will work\
    \ as expected.\n\n```\nparameter :: missing = -999.0\nif ( x == missing) then\n\
    ```\n\nOn the other hand, checking if a variable is greater than some threshold\
    \ is just dangerous as checking if it is equal to that value. Consider a thermostat,\
    \ for instance. If the temperature is below a threshold, the heating turns on,\
    \ but if it is above another threshold, it turns off. A precise check T < Tmin\
    \ or T > Tmax may lead to subtle differences when the heating turns on or off,\
    \ depending on the precise values of the temperature. A slightly different order\
    \ in the evaluations or a different optimization option might cause the moment\
    \ to shift.\n\nA peculiar problem occurs with special numbers, like \"not a number\"\
    \ (NaN). Look at this fragment:\n\n```\nif ( x < 0.0 ) then\n    write(**) 'Variable\
    \ x should be positive'\nelse\n    write(**) 'All is well'\nendif\n```\n\n> ⁴\
    \ The compiler you use may have an option to warn about such comparisons."
