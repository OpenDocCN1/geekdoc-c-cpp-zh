  md: "# 128 MODERN FORTRAN IN PRACTICE\n\nCOMMON block, the data they contain are\
    \ discarded – or at least the Fortran standard says so. In practice, few, if any,\
    \ really do that, but it is something to keep in mind.\n\n+   Beware of micro-optimizations:\n\
    \n```\ndo i = 1, n\n  if ( x(i) .ne. 1.0 ) y(i) = x(i) * y(i)\nenddo\n```\n\n\
    There is no reason to do something like this:\n\n+   - The program will be slightly\
    \ slower, unless you have a very smart compiler, because every iteration the condition\
    \ has to be checked.\n- The time saved by not multiplying the trivial factor is\
    \ marginal.\n- The code is more difficult to read.\n- You do not gain accuracy.\n\
    \n+   A somewhat surprising feature of Fortran is that lower bounds for array\
    \ indices are not passed to subroutines or functions, not even with intrinsic\
    \ functions. The following program illustrates this:\n\n```\nprogram chkidx\n\
    \  real, dimension(-3:3) :: x\n  x = 0.0\n  x(0) = 1.0\n  write(*, 'Maximum at:\
    \ ', maxloc(x)\nend program chkidx\n```\n\nThe printed index is 4, not 0. If you\
    \ think about why, it is quite a reasonable feature. If lower bounds are passed\
    \ on, then every subroutine and function would have to take care of it, with loops\
    \ like:\n\n```\ndo i = 1, n\n  y(i) = x(i) * y(i)\nenddo\n```\n\nThese would have\
    \ to be consistently written as:\n\n```\ndo i = lbound(x),ubound(x)\n  y(i) =\
    \ x(i) * y(i)\nenddo\n```\n\nAs lower bounds other than 1 are fairly rare, it\
    \ would put a large burden on the programmer for a small gain.\n\n# 9.3 Avoid\
    \ Traps\n\nIn any programming language, there are perfectly legal and well-defined\
    \ constructs or idioms to avoid. Fortran is no exception."
