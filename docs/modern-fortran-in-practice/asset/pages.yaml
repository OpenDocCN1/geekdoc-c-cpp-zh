  md: 'a declared type and a dynamic type. This type of variable is declared via the
    class keyword:


    ```

    type(point2d) function add_vector( point, vector )

    class(point2d), intent(in) :: point

    type(point2d), intent(in) :: vector

    ```


    ```

    add_vector/x = point%x + vector%x

    add_vector/y = point%y + vector%y

    end function add_vector

    ```


    Passing The Object Via Another Argument If the argument containing the object
    is not the first, you can specify:


    ```

    type point2d

    real :: x, y

    contains

    procedure :: add, pass(vector) => add_vector

    end type point2d

    ```


    This has the effect that the left-hand side pnt of pnt%add(vec) is no longer passed
    as the first argument, but as the argument whose name is "vector":


    ```

    newpnt = pnt/add(vec)

    ```


    It is now equivalent to:


    ```

    newpnt = add( vec, pnt )

    ```


    instead of:


    ```

    newpnt = add( pnt, vec )

    ```


    If you want to suppress this automatic passing of the left-hand side, you can
    use the nopass keyword instead of pass.


    Extending to Three Dimensions You have points in a two-dimensional space, so use
    this type as the basis for points in 3D space by extending the point2d type:


    ```

    type, extends(point2d) :: point3d

    real :: z

    contains

    procedure :: add => add_vector3d

    end type point3d

    ```


    This new type inherits all the components and type-bound procedures of the type
    it extends, but you need to revise the procedures (hence the new procedure add_vector3d)
    to reflect that these are points in 3D space and to accommodate for the restrictions
    of the Fortran standard imposes.'
