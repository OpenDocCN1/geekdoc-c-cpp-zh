    The advantages are: you only need to implement the function itself, perhaps with
    a few extras, to make it slightly more flexible. The values of the parameters
    are not completely private to the function.

    The disadvantage is that you need to implement several specific versions or create
    roundabout ways to set the parameters. Also, if you need to output more information,
    for instance, to report that you are crossing a singularity, making the result
    unreliable, you have very little support.


    # 5.2 Using a Pool of Data


    The example with the entry statement is akin to the second approach to be discussed:
    using COMMON blocks or module variables. In FORTRAN 77, such an approach looks
    like this:


    ```

    c Define the function

    c

    real function f( x )

    real x


    real a, b

    common /fparam/ a, b


    f = exp(-a*x) * cos(b*x)


    end

    ```


    with the following program as a typical way to use the interfacing COMMON blocks:


    ```

    program integrate_function


    real xmin, xmax, result

    integer steps

    external f

    ```


    c We need to repeat the definition of the COMMON block

    c to access the function parameters


    > This is likely to be an important issue if you apply this approach to other
    types of programming/computing problems.'
