- pgno: 182
  md: "# OBJECT-ORIENTED PROGRAMMING 167\n\nThe three-dimensional variant has an additional\
    \ difficulty to cope with. The result must be class(point2d), not class(point3d),\
    \ so you need to adjust the dynamic type of the result before returning. Here\
    \ is one solution:\n\n```\nfunction add_vector_3d( point, vector )\n    class(point3d),\
    \ intent(in) :: point\n    class(point2d), intent(in) :: vector\n\n    class(point2d),\
    \ allocatable :: add_vector_3d\n    class(point3d), allocatable :: add_result\n\
    \n    allocate( add_result )\n\n    add_result = point%point2d%add(vector)\n \
    \   add_result%z = 0.0\n\n    select type(vector)\n        class is (point3d)\n\
    \            add_result%z = point%z + vector%z\n\n    call move_alloc( add_result,\
    \ add_vector_3d )\n```\n\nIn this example, you allocate a local variable add_result,\
    \ which has the right basic type, and use the move_alloc intrinsic routine to\
    \ move the memory and the type information into the result variable, using add_vector_3d.\
    \ To make sure you know the type of the vector argument - known as basic type\
    \ type(point2d) only - use the select construction.¹\n\nThe type from which you\
    \ extended the 3D point is available with all its components and procedures, as\
    \ an implicit component point2d. Therefore, do the part of the task that has not\
    \ changed and add the new separately.²\n\n**Example: Random Walk in Two and Three\
    \ Dimensions** The dynamic type of polymorphic variables is exploited in a program\
    \ to simulate a random walk in two or three dimensions. The random walk is constructed\
    \ by repeatedly selecting a random vector and adding that to the current position\
    \ of a point to get the new position. If you are using ordinary types, use:\n\n\
    ```\ndo i = 1,nsteps\n    call random_vector( vector )\n```\n\n> ¹ This may seem\
    \ awkward, but it is not different from languages like C++ or Java where you first\
    \ have to create an object of the right type as well.\n\n> ² In C++ and Java,\
    \ you would use the super class to achieve this effect."
