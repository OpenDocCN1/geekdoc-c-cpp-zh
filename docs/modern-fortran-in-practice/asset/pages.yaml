- pgno: 120
  md: "# GRAPHICS, GUIS, AND THE INTERNET 105\n\n| Table 7.1. Characteristics of Various\
    \ Methods for Adding a GUI to a Program |\n| Method | Advantages |\n| --- | ---\
    \ |\n| Integrated GUI and computations | One programming language GUI and computational\
    \ program naturally evolve together |\n| GUI with computational library | One\
    \ or two programming languages, choose the most suitable ones Clear separation\
    \ of responsibilities |\n| Separate programs and cooperating programs | Clear\
    \ freedom in choosing the development environment for the GUI Clear separation\
    \ of responsibilities |\n| Method | Disadvantages |\n| Integrated GUI and computations\
    \ | Suitable Fortran toolkit required Intertwined of responsibilities |\n| GUI\
    \ with computational library | Interfacing with Fortran if the GUI does not support\
    \ Fortran directly |\n| Separate programs and Coordinating programs | Independent\
    \ programs can lead to disparate development |\n\n```\nfor {set i = 0} ${i <=\
    \ 200} {incr i} {\n  set x [expr {$i * 0.05}]\n  set y [func $parameter $x]\n\
    \  $plot plot data $x $y\n}\n```\n\nInstead of starting an external program as\
    \ in Section 7.1, call the routine drawGraph in response to pressing the button.\
    \ This routine calls the Fortran routine via func once for each data point.\n\
    The advantages and disadvantages of the various approaches are summarized in Table\
    \ 7.1.\n\n# 7.3 The Internet\n\nWhile creating a complete Internet site that is\
    \ rich in content is no sinecure, the technical principle is remarkably simple.\
    \ A server program handles the incoming requests for information. It passes these\
    \ requests to the right component, which, in turn, produces an HTML file that\
    \ the server sends back to the client.\nAlthough this book will not consider what\
    \ the server is all about, it will look at a simple method that an Internet server\
    \ can use to interact with the"
  merge: -1
  img_proc: true
- pgno: 121
  md: '# 106 MODERN FORTRAN IN PRACTICE


    component – the so-called common gateway interface or CGI. This is the only method
    that is independent of the chosen server software. With other methods, the program
    that implements the actual service is called as a library and the interaction
    with the server relies on a set of routines that are specific to the server.


    CGI is a relatively simple, uniform protocol. The server starts as a separate
    process, sending information about the request either via "standard input" (read(*))
    or via an environment variable. The program itself then writes the output with
    a suitable header to the “standard output” (write(*)). The technical complications
    are limited:


    +   - You need to get the parameters that are part of the user’s request from
    the information supplied by the server. The details depend on which method was
    used in the HTML file led to the new, "GET" or "POST"

    The output should have a header that tells the server (and the receiving client)
    what kind of content is plain text, HTML text, and so on. More important, however,
    are the complications that arise from the modulus operandi:


    +   - A CGI program starts stops independently with each request. Therefore, there
    is no state information other than that stored in the parameters belonging to
    the request.

    - There may be many requests at once, so that the program is started several times.
    This means you will have to devise a way to store data in independent files, if
    they have not seen. This “somewhere” may be a file on disk, and you need external
    files.


    Suppose that you want to show the new results in a long-running computation. You
    have to store the results user saw last somewhere, if you want to show results
    they have not seen. This will have to store the user’s identity and what computation
    he or she wants to see as well. Then, all this information must be somewhat retrieved.


    The following illustrates the basics of CGI using a simple service. Suppose you
    want to design a website that presents a table of function values. The function
    is that of Section 7.1. The user types in the single parameter and sends a request
    to the server for the table. Here is the initial HTML page:


    ```

    <html>

    <head><title>Table of function values</title>

    <body>

    Parameter: <input type="text" name="param" value="0.0">

    <input type="submit">

    </body>

    </html>

    ```


    > 7 The CGI module in the Flips library [57] takes care of these details.'
  merge: -1
  img_proc: true
