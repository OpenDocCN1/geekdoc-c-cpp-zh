- pgno: 1
  md: '# Modern Fortran in Practice


    From its earliest days, the Fortran programming language has been designed with
    computing efficiency in mind. The latest standard, Fortran 2008, incorporates
    a host of modern features, including object-orientation, array operations, user-defined
    types, and provisions for parallel computing.


    This tutorial shows Fortran programmers how to apply these features in twenty-first-century
    style: modular, concise, object-oriented, and resource-efficient, using multiple
    processors. It offers practical real-world examples of interfacing with C, memory
    management, graphics and GUIs, and parallel computing using MPI, OpenMP, and coarrays.
    The author also analyzes several numerical algorithms and their implementations
    and illustrates the use of several open source libraries. Full source code for
    the examples is available on the book’s website.


    Arjen Markus is a senior consultant at Deltares, an institute for applied research
    in the field of water, subsurface and infrastructure in The Netherlands, where
    he develops and maintains their numerical modeling programs and the tools that
    accompany them. He is an active contributor to the ACM newsletter Fortran Forum
    and the comp.lang.fortran newsgroup.'
  merge: -1
  img_proc: true
