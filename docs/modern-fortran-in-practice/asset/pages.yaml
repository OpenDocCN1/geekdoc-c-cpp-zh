- pgno: 53
  md: "From Fortran 2003 onwards, you can allocate character strings to have a length\
    \ determined at run-time (so-called deferred-length strings):\n\n```\ncharacter(len=:),\
    \ allocatable :: string\ninteger              :: size\n```\n\n```\nsize = ...\n\
    allocate(character(lensize=): string )\n```\n\nThis is very useful for analyzing\
    \ the contents of a file or to split a string in words. The following module uses\
    \ allocatable strings and several other features to read an arbitrarily long line\
    \ from a file:\n\n```\nmodule readline_utility\n  use is_fortran_env\n\n  implicit\
    \ none\n\ncontains\n```\n\n```\nsubroutine readline( lun, line, success )\n  integer,\
    \ intent(in)               :: lun\n  character(len=:), allocatable, intent(out)\
    \ :: line\n  logical, intent(out)               :: success\n\n  character(len=0)\
    \                   :: newline\n```\n\n```\nsuccess = .true.\n\ncall readline_piece_by_piece(\
    \ newline )\n```\n\n```\ncontains\n\n  recursive subroutine readline_piece_by_piece(\
    \ newline )\n    character(len=*)                  :: newline\n\n    character(len=10)\
    \                 :: piece\n    integer                           :: ierr\n  \
    \  integer                           :: sz\n```\n\n```\n  read( lun, '(a)', advance\
    \ = 'no', size = sz, &\n       iostat = ierr ) piece )\n```\n\n```\n  if ( ierr\
    \ /= 0 .and. ierr /= iostat_eor ) then\n    allocate(character(len=len(newline))):\
    \ line )\n    line = newline\n    success = .false.\n    return\n  endif\n```"
  merge: -1
  img_proc: true
- pgno: 54
  md: "!\n\n! We have gotten to the end of the line or not?\n\n!\n\n```\nif ( sz >=\
    \ len(piece) ) then\n    call readline_piece_by_piece( newline // piece )\nelse\n\
    \    allocate( character(len(newline)+sz) : line\n    line = newline // piece(sz)\n\
    \    success = .true.\nendif\nsubroutine readline_piece_by_piece\nsubroutine readline\n\
    ```\n\nend module readline_utility\n\nThe public subroutine readline provides\
    \ a convenient interface to the functionality, it is the recursive subroutine\
    \ readline_piece_by_piece that does the actual work:\n\n+   - The read statement\
    \ uses nonadvancing I/O to read a small piece of the current line. If you reach\
    \ the end of the line, then the line pointer will move to the start of the next\
    \ line or to the end of the file.\n- Depending on whether the end of the line\
    \ is reached or not, the routine either calls itself recursively or it allocates\
    \ the memory needed to store the entire string in the variable line. The number\
    \ of characters and stored in the variable sz is used as an indicator.\n\nWhen\
    \ the subroutine calls itself recursively, it does so with a longer string as\
    \ the argument. This string is constructed on the fly via concatenation and contains\
    \ all the contents sofar.\n\nIf it reached the end of the line, the job is finished\
    \ and the routine returns successfully, up to the calling routine.\n\n+   - When\
    \ the routine reaches the end of the line or some other error occurs, it allocates\
    \ the string and stores whatever it was able to read.\n- The preceding code defines\
    \ readline_piece_by_piece to be a subroutine internal to readline - it appears\
    \ between contains and the standard fortran_env to access the integer parameter\
    \ iostat_or to detect the end of line condition.\n\nThis is an example of how\
    \ you can use various techniques for managing the memory. However, it may not\
    \ actually be the most efficient way to read an arbitrarily long line from a file.\
    \ An alternative is to use a loop within which you repeatedly allocate the string\
    \ to ever-increasing length. An advantage of such a loop is that you can release\
    \ the memory of a previous iteration immediately."
