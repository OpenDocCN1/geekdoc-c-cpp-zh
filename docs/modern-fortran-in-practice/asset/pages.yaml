- pgno: 55
  md: "# 40 MODERN FORTRAN IN PRACTICE\n\n# 4.5 Combining Automatic and Allocatable\
    \ Arrays\n\nAs discussed while arrays are very easy to use, large automatic arrays\
    \ pose a problem. Here is a method to prevent this from happening. The algorithm\
    \ for getting the median of a set of data requires sorting the data, but you do\
    \ not want to disturb the original array. Therefore, you need a copy of the data\
    \ and then to sort it. As the array can be any size, you年纪 between small arrays,\
    \ for which you use an automatic array, and larger data arrays, for which you\
    \ explicitly allocate a work array of the correct size:\n\n```\nsubroutine get_median(\
    \ array, median )\n    implicit none\n```\n\n```\nreal, dimension(:), intent(in)\
    \ :: array\nreal, intent(out) :: median\n```\n\n```\n! Arbitrary threshold ...\n\
    integer, parameter :: threshold = 2000\n```\n\n```\nreal, dimension(min(size(array),\
    \ threshold)) :: auto_array\nreal, dimension(:), allocatable :: alloc_array\n\
    ```\n\n```\nif size(array) < threshold then\n    auto_array = array\n    call\
    \ get_median_sub(auto_array, median)\nelse\n    allocate(alloc_array(size(array)))\n\
    \    alloc_array = array\n    call get_median_sub(alloc_array, median)\nendif\n\
    ```\n\n```\ncontains\nsubroutine get_median_sub( array, median )\n```\n\n```\n\
    real, dimension(:), intent(in) :: array\nreal, intent(out) :: median\n```\n\n\
    ```\ncall sort_data( array )\n```\n\n```\n!\n! Either the middle element or the\
    \ mean of the\n! two elements at the center\n!\nmedian = 0.5 * ( array((size(array)+1)/2)\
    \ + &\narray((size(array)+2)/2) )\n```\n\n```\nend subroutine get_median_sub\n\
    end subroutine get_median\n```\n\n> 2 Algorithms exist to do this without sorting,\
    \ but that would defeat the purpose of this."
  merge: -1
  img_proc: true
- pgno: 56
  md: "The idea is to let the subroutine get_median decide what method is safe and\
    \ efficient and then let an internal routine (get_median_sub) do the actual work.\
    \ This way you only need to use an allocated array with the (slight) performance\
    \ when dealing with a large number of data.\n\n# 4.6 Performance of Various Types\
    \ of Arrays\n\nCommon wisdom is that arrays with the pointer attribute are more\
    \ costly than other arrays, as they can point to non-contiguous memory and they\
    \ can cause aliasing (two names for the same memory location), which hampers all\
    \ manner of optimizations. To give an indication of that cost, measure the time\
    \ it takes to run a simple algorithm with various types of arrays.\n\nThe basic\
    \ code is: compute_mean( data, sz, mean )\n\n```\nsubroutine compute_mean( data,\
    \ sz, mean )\n  real, dimension(:) :: data\n  integer :: sz\n  real :: mean\n\n\
    \  integer :: i\n\n  do i = 1,sz\n    data(i) = i\n  enddo\n\n  mean = sum(data(1:sz))\
    \ / sz\nend subroutine compute_mean\n```\n\nThe array data can be an automatic\
    \ array, a local allocable array, or a pointer array. The latter types are allocated\
    \ explicitly, so there is some overhead due to the allocation and deallocation.\
    \ A alternative is to pass an array that has the allocable or pointer attribute\
    \ in the calling program, but not in the subroutine itself.\n\nThe results are\
    \ shown in Figure 4.1. The numbers used for the figure are the result of measuring\
    \ the time that had elapsed after repeating the various versions of the subroutine\
    \ 10,000 times. The numbers were reproducible within several parameters. In the\
    \ figure, the mean value per array size is used to normalize the data.\n\nWhile\
    \ it is difficult to draw general conclusions (the numbers very greatly per compiler,\
    \ compiler options, and operating system), it would seem that local arrays with\
    \ the pointer attribute require systematically 10 to 20 percent more time — which\
    \ includes the overhead of allocations and deallocations. There is little difference\
    \ between automatic and allocable arrays (the triangle symbols), though this depends\
    \ on the choice of platform."
  merge: -1
  img_proc: true
