  md: '# ROBUST IMPLEMENTATION OF SEVERAL SIMPLE ALGORITHMS


    ![](img/57520a202a0735ccfa4afc3beb12794b_166_0.png)


    Figure 10.1. Constructing a new estimate with the Newton-Raphson algorithm


    # 10.4 Finding the Roots of an Equation


    The Newton-Raphson method is a popular algorithm for finding the roots of an equation.
    It is fast (quadratic convergence), if it converges, and you need only a single
    starting point. Geometrically it works by constructing the tangent line through
    the current estimate and using the zero of tangent as the next estimate (see Figure
    10.1).


    The formula for the iteration process is:


    > $x_{k+1} = x_k - \frac{f(x_k)}{f''(x_k)}$ (10.4)


    Drawbacks are as follows:


    The issue of the derivative is solved in a number of ways:


    +   * The user must supply a routine that computes the value of the function as
    well as its derivative explicitly.

    * Use automatic or symbolic differentiation (see Chapter 3).

    * Estimate the derivative numerically.


    For complicated functions, the first method is rather error-prone. The second
    method is closest to the mathematical formulation, but it may not be implemented
    easily in the chosen programming language.

    From the point of view of robustness, the third method is the most interesting.
    The focus is on that method, but the algorithm itself poses a few intriguing riddles,
    too.'
  merge: -1
  img_proc: true
