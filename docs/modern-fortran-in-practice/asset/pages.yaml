  md: "Here again is a straightforward implementation:\n\n```\nmodule newton_raphson\n\
    ```\n\n```\nimplicit none\n```\n\n```\ncontains\n```\n\n```\nsubroutine find_root(\
    \ f, xinit, tol, maxiter, result, success )\n```\n\n```\ninterface\n  real function\
    \ f(x)\n  real, intent(in) :: x\n  end function f\nend interface\n```\n\n```\n\
    real, intent(in) :: xinit, tol\ninteger, intent(in) :: maxiter\nreal, intent(out)\
    \ :: result\nlogical, intent(out) :: success\n```\n\n```\nreal :: eps = 1.0e-4\n\
    real :: fx1, fx2, fprime, x, xnew\ninteger :: i\n```\n\n```\nresult = 0.0\nsuccess\
    \ = .false.\n```\n\n```\nx = xinit\ndo i = 1,max(1,maxiter)\nfx1 = f(x)\nfx2 =\
    \ f(x+eps)\nfprime = (fx2 - fx1) / eps\nxnew = x - fx1 / fprime\n```\n\n```\n\
    if ( abs(xnew-x) <= tol ) then\n  success = .true.\n  result = xnew\n  exit\n\
    endif\n```\n\n```\nx = xnew\nenddo\n```\n\n```\nend subroutine find_root\n```\n\
    \n```\nend module\n```"
