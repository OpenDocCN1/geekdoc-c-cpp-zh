- pgno: 139
  md: "# 124 MODERN FORTRAN IN PRACTICE\n\n“knows” about the interface for the subroutines\
    \ and functions. This requirement is automatically fulfilled if you use modules\
    \ for all your routines. Organize the modules in a comprehensive way. For example,\
    \ routines that manipulate the contents of the same derived type go in one module.\n\
    \nAvailability of Variables and Routines If you use variables and routines in\
    \ a module, by default, they will be available for any program unit that uses\
    \ the module. This may or not be what you want: a program could inadvertently\
    \ use a variable reserved for the inner workings of your module and cause bugs\
    \ that are difficult to find. Therefore, use the private statement to hide any\
    \ data and routines and make only those items public that should be public. The\
    \ same goes for the content of a derived type.\n\nThe Default Case in a Select\
    \ Block and the Else Case in If Block Quite often, you will think a particular\
    \ condition may not occur, like in a select block only certain cases ever need\
    \ to be handled. It does not hurt to insert code that makes this explicit:\n\n\
    ```\nselect case (case_var)\n  ... legitimate cases ...\n\n  case default\n  \
    \  write(**) 'Programming error: case should not occur : ', &\\n      case_var\n\
    end select\n```\n\nA similar thing occurs with nested blocks or if/elseif constructions:\
    \ if you are certain a particular alternative should not occur, then say so.\n\
    \nAppropriate Error Messages Error messages should be to the point, accurately\
    \ indicate what is wrong, and – if possible – present what can be done about it.\
    \ Using code like this:\n\n```\nif ( n > nmax ) then\n  write(**) 'Invalid number\
    \ of items'\n  stop\nendif\n```\n\nis wrong and plainly unhelpful. There is nothing\
    \ wrong with the number of items, it is much larger than the maximum is allowed.\
    \ (I have encountered such code in practice. Only by examining the source code\
    \ was it clear what was wrong.) Use dynamically allocated memory – possibly a\
    \ bit more work, but more robust – so that the error condition cannot occur anymore."
  merge: -1
  img_proc: true
