  md: "# 86 MODERN FORTRAN IN PRACTICE\n\nAs previously explained, the library sqlite\
    \ stores these pointers in a small array of integers – long enough to hold pointers\
    \ on 32-bits and 64-bits machines. On the Fortran side, the arrays are kept in\
    \ derived types:\n\n```\ntype sqlite_database\ninteger, dimension(2) :: db_handle\n\
    integer               :: error\ncharacter(len=80)      :: errmsg\nend type sqlite_database\n\
    ```\n\nMany of the routines in the sqlite library simply run a single SQL statement,\
    \ but the only information returned is whether all well or there was some error\
    \ condition. To communicate this to the Fortran side, the sqlite_database also\
    \ holds the error code and the error message (if any). The Fortran routine sqlite3_do\
    \ takes care of this:\n\n```\nsubroutine sqlite3_do(db, command)\n  type(sqlite_database)\
    \ :: db\n  character(len=*)      :: command\n```\n\n```\ninterface\n  integer\
    \ function sqlite3_do_c(handle, command, errmsg)\n    integer, dimension(*)  \
    \ :: handle\n    character(len=*)        :: command\n    character(len=*)    \
    \    :: errmsg\n  end function sqlite3_do_c\nend interface\n```\n\n```\n! +1 for\
    \ the NUL character\ncharacter(len=len(command)+1) :: commandc\ninteger      \
    \                  :: k\n```\n\n```\ncommandc = command\ncall stringoc( commandc\
    \ )\n```\n\n```\ndb%errmsg = ' '\ndb%error = sqlite3_do_c(db%db_handle, commandc,\
    \ db%errmsg)\n```\n\n```\nend subroutine sqlite3_do\n```\n\nIts C counterpart\
    \ (sqlite3_do_c, slightly simplified):\n\n```\nint FTNCALL sqlite3_do_c(\n  sqlite3\
    \ **db,\n  char *command,\n  char *errmsg,\n  int len_command,\n  int len_errmsg\
    \ ) {\n  int rc ;\n```"
