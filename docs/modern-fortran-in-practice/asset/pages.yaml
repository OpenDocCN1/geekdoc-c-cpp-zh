    \ linear interpolation (see Table 2.2 for an illustration of the two-dimensional\
    \ case). First, you need to find the \"cell\" within the triple lies and the weighting\
    \ factors in each dimension (this can be done for each dimension). Say this the\
    \ indices (i1,i2,i3) to (i1+1,i2+1,i3+1), with weights (w1,w2,w3), you can extract\
    \ them into an array of $2 \times 2 \times 2$ elements:\n\n```\nreal,dimension(:,:,:)\
    \ :: table\nreal,dimension(2,2,2) :: cell\n\ncell = table(i1:i1+1,i2:i2+1,i3:i3+1)\n\
    ```\n\nIf you use explicit formula for the interpolation, you need to write down\
    \ all eight terms, and for higher dimensions even more. However, the interpolation\
    \ can also be done per dimension: simply compute the values at a slice through,\
    \ reducing the dimension by 1. Repeat until the dimension of the cell is reduced\
    \ to zero. This is elegantly expressed in the Fortran code:\n\n```\ncell(:,1,1)\
    \ = w3 * cell(:,1,1) + (1.0-w3) * cell(:,,:)\ncell(:,1,1) = w2 * cell(:,1,1) +\
    \ (1.0-w2) * cell(:,2,1)\ncell(1,1,1) = w1 * cell(1,1,1) + (1.0-w1) * cell(2,1,1)\n\
    ```\n\n```\nresult = cell(1,1,1)\n```\n\nIt is trivial to extend this code to\
    \ any number of dimensions, as long as stay within the maximum number of dimensions\
    \ that the standard allows."
