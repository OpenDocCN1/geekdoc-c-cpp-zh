  md: "# MODERN FORTRAN IN PRACTICE\n\n# MPI\n\nAn often cited advantage of OpenMP\
    \ over MPI is that with OpenMP you can work incrementally: Just parallelize those\
    \ sections you want to speed up by one. With MPI, you need to carefully reorganize\
    \ the whole program, as the communication between the individual processes has\
    \ to be implemented manually. A clear advantage of MPI over OpenMP, however, is\
    \ that data are not shared accidentally. An MPI program is run as several separate\
    \ processes that explicitly communicate their data.\n\nHere is an MPI version\
    \ of the example:\n\n```\nprogram primes_mpi\n  use mpi\n\n  implicit none\n```\n\
    \n```\ninteger, parameter :: tag_new_task = 1 ! Get new task\ninteger, parameter\
    \ :: tag_results = 2 ! Transmit results\n\ninteger :: rank\ninteger :: main =\
    \ 0\ninteger :: error\n\ninteger :: number_images\n\ninteger, dimension(2) ::\
    \ range\ninteger :: number_tasks\ninteger, dimension(1000) :: prime\ninteger ::\
    \ number_primes\ninteger, dimension(MPI_STATUS_SIZE) :: status\nlogical :: new_results\n\
    logical :: new_task\nlogical :: ready\n```\n\n```\ncall mpi_init( error )\nn\n\
    call mpi_comm_rank( MPI_COMM_WORLD, rank, error )\ncall mpi_comm_size( MPI_COMM_WORLD,\
    \ number_images, error )\n```\n\n```\n!\n! What do we depend on the rank:\n! Rank\
    \ 0 is the main program that hands out the chunks\n! and gathers the results\n\
    ! All others do the work\n!\n```\n\n```\nif ( rank == 0 ) then\n  ready = .false.\n\
    ```"
