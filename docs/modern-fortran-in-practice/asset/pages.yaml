    \    write(*, 'Error: More items (',n, ' ') can be handled.\n    write(*, ' Parameter\
    \ nmax (now: ',nmax, '&') must be increased to at least ', n\nstop\n```\n\nThis\
    \ alternative gives a clear indication of what is wrong and what can be done about\
    \ it. In summary:\n\n+   - Use implicit none, parameters instead of literal constants,\
    \ and parameters to specify the numerical kind.\n- Explicitly check the input\
    \ arguments: do they satisfy the preconditions of the routine? Put these checks\
    \ inside the routine.\n- Watch out for composite logic conditions: do not rely\
    \ on short-circuiting.\n- Use save for local variables that should retain their\
    \ value.\n- Use modules for all of your code.\n- Use private and public to control\
    \ access.\n- Provide error messages that inform the user what to do.\n\nOf course,\
    \ there are always good reasons why it is impossible or undesirable to conform\
    \ to these guidelines. For instance, routines called by a program in another language\
    \ should not be in a module. But, if you have such reasons, be explicit about\
    \ them!\n\n# 9.2 Don't Stray\n\nMany projects use a programming standard and guidelines\
    \ for coding besides the standard of the programming language itself. Published\
    \ examples include Boukara and van Delst [19] and Kleb and others [49]. An even\
    \ more extensive set of guidelines is the book byman and Spector [24], which presents\
    \ how the various features of modern Fortran can be used in a clear style.\n\n\
    They represent the practical experience people have built up using the language.\
    \ This may include the layout of the code for common programming tasks – the idiom\
    \ and choices for the layout of the code as indentation. Don’t go against the\
    \ grain. Even if the standard or the idiom prescribed by the project is silly,\
    \ use it anyway:\n\n+   - If you modify a program’s code, use the same layout\
    \ and programming style. Code that looks like a hotchpotch of styles is not very\
    \ appealing. If it is already bad, advise to clean it up first."
