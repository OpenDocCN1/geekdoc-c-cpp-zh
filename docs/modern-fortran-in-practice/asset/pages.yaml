- pgno: 91
  md: "# 6.\nInterfacing to C: SQLite As an Example\n\nQuite often the public interface\
    \ of a library that you are interested in is written in a different programming\
    \ language than the one you use. You will need an interface library that bridges\
    \ the gap between both languages. This is the case with SQLite, a lightweight\
    \ database management system [44]. It is written in C and there is a host of libraries\
    \ to communicate with SQLite in all manner of languages.\n\nFor Fortran, there\
    \ is the sqllite library that I developed. It was inspired by the work of Al Danial\
    \ [27], but focused on FORTRAN 77, which was mainly an example of how you could\
    \ interface with the SQLite library. I wanted a generic solution instead.\n\n\
    The design decisions and the implementation of sqllite illustrate a more general\
    \ question: how to combine Fortran and other programming languages? Each you need\
    \ to consider:\n\n+   - Low-level aspects of the combination:\n  - How do the\
    \ basic types of the two languages relate to each other?\n  - What are the naming\
    \ and calling conventions?\n- High-level aspects relating to the actual library:\
    \ What is a good “model” for the interface? Should you simply write routines that\
    \ merely translate the routine interfaces or should you build a higher-level interface,\
    \ molding the original interface into something that is a better fit for the library’s\
    \ use?\n\nThis chapter will cover both types of issues in the context of interfacing\
    \ with C (an intermediate layer in C is often a convenient way to communicate\
    \ with any other language) and of the interface to SQLite.\n\n# 6.1 Matching Data\
    \ Types\n\nThe basic types of Fortran are: integer, logical, single, and double\
    \ precision with real complex numbers and character strings. C has more or less\
    \ the same types (as they are dictated by computer hardware and tradition, more\
    \ than language design), but there are important differences:\n\n+   - In C, there\
    \ are no logicals; however, are there complex numbers (although the C99 standard\
    \ does define them)."
  merge: -1
  img_proc: true
- pgno: 92
  md: '# INTERFACING C: SQLITE AS AN EXAMPLE


    A common approach is to mimic complex variables via an array of two real numbers
    or as a structure with two numbers.


    +   - In C, double precision (double) are the default, rather than single precision
    as in Fortran. Presumably, that has some historical reasons and does not reflect
    a typical need for high-precision computations in C programs. In the case of SQLite
    it means, however, you do not store single precision results in the database,
    only double precision.


    +   - Fortran does not have unsigned integers. while they can be emulated, handling
    such types is a bit awkward. As long as you only need to pass the data, plain
    integers will suffice.


    +   - The most complicated aspects of matching data types are how to match character
    strings and arrays. Character strings in C are actually arrays of characters where
    the end of the string is indicated by a NULL character (achar (0) in Fortran).
    Single characters are different from character strings. In Fortran, a character
    variable "knows" its length and there is no special convention to indicate the
    end of string – strings are padded with spaces. This difference means you have
    convert a string from the Fortran to the C and back, plus you must adopt a separate
    mechanism for Fortran; for example, storing the significant length for each string.
    In C, you must take considerable care not to exceed the space that is allocated
    for the strings. There is no protection against overflowing the bounds, which
    could happen if you copy a string that is too long or forget to add the NULL character.


    Arrays of any basic data type have their own set of complications. In C, arrays
    are essentially one-dimensional. Two-dimensional arrays can be emulated by an
    array of pointers (statically defined two-dimensional arrays behave as a separate
    shorthand notation). Here is a pattern you frequently find:


    ```

    int ;

    int **array2;


    /* Create an array[20] [10] *

    */

    array2 = (int **)malloc( 20 * sizeof(int *));

    array2 = (int *)malloc( 20 * 10 * sizeof(int) );


    for ( i = 1; i < 20; i++) {

    array2[i] = array2[0] + 10 * i;

    }

    ```


    The block of memory is divided into 20 pieces, each ten integers long. How-ever,
    each piece could be arbitrarily long:'
