  md: "# ROBUST IMPLEMENTATION OF SEVERAL SIMPLE ALGORITHMS 139\n\nChecking the \"\
    sortedness\" of the array x for each invocation of the interpolation routine is\
    \ overdoing it. It is more efficient to create a self-contained \"object\" that\
    \ requires such checking only when it is created. The routine to create this object\
    \ can also check the sizes of the arrays x and y store them with respect to extrapolation\
    \ and jumps. The interpolation object holds a copy of the two arrays, as you do\
    \ not want data to change without repeated checking. Here is the improved implementation:\n\
    \n```\n! robust_interp.f90\n! Robust version of interpolation\n!\nmodule interpolation\n\
    \nimimplicit none\n\ntype interpolation_data\n    :: useable = .false.\n    integer\
    \              :: extrapolation\n    real, dimension(:), allocatable :: x, y\n\
    end type interpolation_data\n\ninteger, parameter :: extrapolation_none = 0\n\
    integer, parameter :: extrapolation_constant = 1\ninteger, parameter :: extrapolation_linear\
    \ = 2\n```\n\ncontains\n\n```\nfunction interpolation_object( x, y, extrapolation\
    \ )\n    type(interpolation_data)      :: interpolation_object\n    real, dimension(:),\
    \ intent(in) :: x, y\n    integer, intent(in)          :: extrapolation\n\n  \
    \  integer                        :: i, ierr, n\n    logical                 \
    \      :: success\n\n    interpolation_object%useable = .false.\n\nif ( allocated(interpolation_object%x)\
    \ ) then\n    deallocate(interpolation_object%x)\nendif\nif ( allocated(interpolation_object%y)\
    \ ) then\n    deallocate(interpolation_object%y)\nendif\n!\n! Set the extrapolation\
    \ method\n!\n```"
