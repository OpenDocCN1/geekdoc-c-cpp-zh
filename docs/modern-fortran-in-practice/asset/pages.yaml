    \ routine to find the primes is straightforward as no MPI calls are involved.)\n\
    \n# Coarrays\n\nThe coarrays feature of the Fortran 2008 standard [71] resembles\
    \ OpenMP in that communication between the threads (or images as they are called\
    \ in the standard) because it is hidden from the programmer. However, it resembles\
    \ MPI in that the images have their own memory, only the coarrays are shared.\
    \ When handing out the chunks of integers, you need to make sure that the shared\
    \ data are updated by only one image at a time.\n\nYou have a choice here, just\
    \ as with OpenMP and MPI, which image (or thread or copy) is responsible for gathering\
    \ the data. You can dedicate one single image to the task or you can have each\
    \ image store the data in the result array. The two choices involve different\
    \ synchronization methods. Here the first option is used²\n\n```\nprogram primes_coarrays\n\
    implicit none\n```\n\n```\ninteger, dimension(2)              :: range_priv\n\
    integer, dimension(2), codimension[*] :: range\ninteger, dimension(1000)     \
    \    :: total_primes\ninteger\ninteger, dimension(100), codimension[*] :: primes_in_task\n\
    integer, codimension[*]            :: number_in_task\nlogical, codimension[*]\
    \              :: new_results\nlogical, codimension[*]              :: new_task\n\
    logical, codimension[*]              :: ready\n```\n\n```\nready             \
    \           = .false.  ! Indicates the image has\nnew_results             = .true.\
    \   ! ! results available\nnew_task                = .false.  ! ! Indicates a\
    \ new task has been\n                                     ! ! issued for the image\n\
    number_in_task         = 0        ! Number of primes found in\n```\n\n```\nrange_priv(2)\
