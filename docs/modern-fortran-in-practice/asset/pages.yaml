- pgno: 234
  md: '# 12.3 Alternatives


    OpenMP, MPI, and coarrays are but three techniques that you can employ to create
    a parallel program. The following are a few alternatives:


    +   - Using shared memory to communicate between two or more programs on the same
    computer.


    +   - POSIX or Windows threads instead of OpenMP for a fine-grained and explicit
    control of the threads in the same program.


    +   - TCP/IP communication between programs on possibly different computers.


    Drawbacks of the preceding approaches are that they all rely on platform-specific
    system libraries and require low-level details.


    A different aspect of parallel computing that is worth discussing is the way the
    threads or workers operate. The first example used a master-workers setup — one
    thread handing out the tasks and collecting the results. The second example used
    two threads that synchronize with each other without playing a special role. Depending
    on the problem to solve, very different setups are possible [78], [39], for instance:


    +   - Pipeline architecture: The data undergoes a series of transformations, where
    each transformation is handled by a different thread. Once the transformation
    is complete, the result is transferred and hand back to the next stage and a new
    set of data is requested.


    +   - Tuplespaces: The threads request a task with certain characteristics from
    a central repository and hand back new tasks. This type of parallelism is very
    flexible, because synchronization needs to be done between the thread and the
    repository only.


    The past couple of years using the graphics card (GPU) for parallel processing
    has received much attention. GPUs are attractive because they consist of many
    hundreds of fast processors. The drawback is that they have indirect access to
    the data to be processed and requires redesign the entire algorithm. Another drawback
    is that programming for the GPU requires vendor-specific extensions to the programming
    language. Beside C and C++, it is possible to use Fortran to program for the GPU,
    the PGI CUDA Fortran compiler being one that supports this natively [41].


    Various research groups have been successful in developing complex programs using
    this technique for a variety of computational problems. Xian and Takayuki [85],
    for instance, report on the use of a cluster of GPUs to compute the flow of an
    incompressible fluid around obstacles.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# 220 MODERN FORTRAN IN PRACTICE


    | Table 12.1. Characteristics of the Three Parallel Programming Techniques |

    | Method | Support | Incremental Development | Main Issue |

    |---|---|---||}{

    | OpenMP | Compiler | Yes | Easy to make mistakes in shared/private variables
    |

    | MPI | External libraries | Limited | Communication of data is responsibility
    of the programmer |

    | coarrays | Compiler supporting Fortran 2008 | Yes | Synchronization must be
    carefully designed |


    # 12.4 Overview


    All methods of creating a program for parallel computing have their pros and cons.
    From a programming point of view, coarrays seem to combine the advantages of OpenMP
    with those of MPI – data communication is transparent and what data are defined
    explicitly. From a usage point of view, coarrays have the disadvantage that they
    require a supporting environment to start the separate processes and to control
    the number of processes. This is not different from MPI, however. Like OpenMP,
    coarrays of only require the compiler to support them. There is no need for an
    external library.


    The major disadvantage of coarrays is that the rules are rather complex. They
    are complex to ensure both efficiency and data consistency. Table 12.1 compares
    the methods.


    As mentioned, besides OpenMP, MPI, and coarrays there are several other methods
    to exploit parallel programming, such as the use of shared memory and multithreading
    libraries as pthreads. They are much more difficult to use, however, and they
    have not reached much popularity within the Fortran community.'
  merge: -1
