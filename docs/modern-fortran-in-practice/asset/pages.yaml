- pgno: 61
  md: '# MODERN FORTRAN IN PRACTICE


    Therefore, while code like:


    ```

    a = b .concat. c

    ```


    is perfectly possible, it also introduces a memory leak.

    One alternative to avoid this is to use subroutines instead of functions and assignments,
    so that there are no intermediate results, but this causes a rather awkward way
    of working. Compare:


    ```

    call concatenate( a, b .concat. c )

    ```


    with:


    ```

    a = b .concat. c

    ```


    or:


    ```

    a = concat( b, , c )

    ```


    A better solution that allows you to use such operations as .concat. almost without
    memory leaks is to mark the derived types, so that the allocated memory can be
    deallocated when it is no longer needed. You modify the definition of the derived
    type slightly:


    type chain


    ```

    integer, dimension(:), pointer :: values => null())

    logical :: tmp :: = .false.

    ```


    end type chain


    With this new, the function concat_chain() can mark its result as temporary. All
    functions in the module check whether their arguments are temporary and clean
    them up if that is the case, as they will not be used anymore:


    ```

    function concat_chain( ic, jc )

    type(chain), intent(in) :: ic, jc

    type(chain) :: concat_chain

    integer :: nic, jc

    ```


    ```

    nic = size(ic%values)

    jc = size(jc%values(1:nic+njc))

    ```


    ```

    allocate(concat_chain%values(1:nic) = ic%values(1:nic)

    concat_chain%values(1:nic+njc) = jc%values(1:njc)

    ```


    ```

    concat_chain%tmp = .true. ! Mark as temporary

    ```


    ```

    call cleanup( ic, .true ) ! Clean temporary arguments

    call cleanup(jc, .true )

    end function concat_chain

    ```


    and similarly for the assign_array and assign_chain subroutines.'
  merge: -1
  img_proc: true
- pgno: 62
  md: "# MEMORY MANAGEMENT 47\n\nThe routine cleanup has the task of hiding the details\
    \ of deallocating the arrays:\n\n```\nsubroutine cleanup( ic, only_tmp )\n  type(chain)\
    \ :: ic\n  logical     :: only%tmp\n```\n\n```\nif ( .not.only_tmp .or. ic%tmp\
    \ ) then\n  if ( associated( ic%values) ) deallocate( ic%values )\nendif\n```\n\
    \nTo effectively avoid memory leaks using this technique puts some burden on the\
    \ programmer of these modules. The programmer must ensure that variables are appropriately\
    \ initialized and memory is released when it can be done.\n\nIf the derived type\
    \ has allocatable components inside pointer components, keeping track of the temporary\
    \ status is still worthwhile, even though memory leaks would not be the main reason\
    \ anymore. Consider again the chain type, but now with allocatable components:\n\
    \n```\ntype chain\n  integer, dimension(:), allocatable :: values\n  logical \
    \                            :: tmp = .false.\n```\n\nConcatenating two variables\
    \ becomes simpler using Fortran 2003’s automatic allocation feature:\n\n```\n\
    function concat_chain( ic, jc )\n  type(chain), intent(in) :: ic\n  type(chain),\
    \ intent(in) :: jc\n  type(chain)             :: concat_chain\n  concat_chain_values\
    \ = (/ ic%values, jc%values /)\nend function concat_chain\n```\n\nHowever, in\
    \ the assignment routine you can avoid the allocation and copying if the right-hand\
    \ side is a temporary object:\n\n```\nsubroutine assign_chain( ic, jc )\n  type(chain),\
    \ intent(out) :: ic\n  type(chain)             :: jc\n```\n\n```\nif ( jc%tmp\
    \ ) then\n  call move_alloc( jc%values, ic%values )\nelse\n  ic%values = jc%values\
    \ ! Automatic allocation\nendif\n```\n\n```\nic%tmp = .false.\nend subroutine\
    \ assign_chain\n```"
