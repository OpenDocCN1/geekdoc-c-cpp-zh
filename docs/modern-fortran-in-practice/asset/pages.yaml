  md: "# ROBUST IMPLEMENTATION OF SEVERAL SIMPLE ALGORITHMS 153\n\n**Table 10.2.**\
    \ Results of the Straightforward Newton-Raphson Implementation for Several Functions.\
    \ Relative Tolerance: $10^{-5}$.\n\n| Function | Start Value | Root Found | Remarks\
    \ |\n|---|---|---|--|\n| $\\ln x - 1$ | 0.1 | 2.7182817 | 7 Iterations |\n| $\\\
    ln x - 1$ | 10 | Outside domain (NaN) | $x_1$ is negative |\n| $x^2$ | 10 | $3.99\
    \ \\cdot 10^{-5}$ | Slow convergence - 20 iterations |\n| $x^2 + 1$ | 10 | No\
    \ convergence | There is no real root |\n| $\\sqrt{|x|}$ | 1.0 | Oscillation |\
    \ Theoretically: $x_{k+1} = -x_k$ |\n\nSome results of this program are in Table\
    \ 10.2.\n\nSometimes the process will converge, sometimes it will not, and sometimes\
    \ the function cannot be properly evaluated. A robust implementation should try\
    \ to accurately diagnose the situation. More subtle problems exist as well: How\
    \ do you choose the tolerance? And for that matter, how do you define the tolerance?\n\
    \nLet us examine the first case: a simple root. There is not always a floating-point\
    \ value for x for which the numerical implementation of $f(x)$ is exactly zero.\
    \ However, you can find two numbers, $x_1$ and $x_2$, such that $f(x_1)$ and $f(x_2)$\
    \ have opposite signs, bracketing the root.\n\nTherefore the two floating-point\
    \ numbers on either side of the exact zero that are closest to that far, but in\
    \ fact the closest approximations you can get. It may not be necessary to find\
    \ such, but it is reassuring to know that you can find such a pair. This is *not*\
    \ the case for multiple roots of even order. They present an entirely different\
    \ problem.\n\nIf you do not need to find this narrow interval, but rather an approximation\
    \ within $10^{-4}$, what exactly do you need? This is more involved than you might\
    \ think. It is tempting to think it means:\n\n> We accept any number x that lies\
    \ in the interval $((1-\\epsilon), (1+\\epsilon))$, with $r$ the exact root and\
    \ $\\epsilon$ the relative tolerance.\n\nThis definition is meaningless if the\
    \ root is 0. If the root is small, with respect to 1, say $10^{-6}$, and you are\
    \ interested in numbers ranging from -10 to 10, you may want to accept an interval\
    \ $(-10^{-4}, 10^{-4})$, instead of $(0.9999 \times 10^{-6}, 1.0001 \times 10^{-6})$.\n\
    \nIf the numbers have a “logarithmic” character, meaning you interpret a number\
    \ based on its order of magnitude, rather than the absolute value, the original\
    \ relative interpretation is called for.\n\nLeave the discretion to the user:\
    \ if he or she seeks a logarithmic interpretation, then the function should actually\
    \ be formulated as such:\n\n+   - Rewrite $f(x)$ as $g(y)$, $y = \\ln x$.\n- Determine\
    \ the root of $g$ and transform the result."
