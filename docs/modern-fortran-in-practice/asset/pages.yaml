- pgno: 178
  md: '# 11.

    Object-Oriented Programming


    An interesting feature of Fortran 2003 is the possibility to use an object-oriented
    style of programming. While Akin [2] and Decyk and Gardner [28] have shown that
    object-oriented programming (OOP) is possible in Fortran 90/95, the class of inheritance
    and run-time polymorphism poses limits on what you can do. Fortran 2003 makes
    these aspects of OOP readily available. Furthermore, in combination with other
    facilities you can do more than merely class-based OOP.


    One thing to note: Object-oriented programming is a subject that is both vast
    and confusing at times. Not only does the terminology that is used differ per
    language, but also its semantics, or what the concepts actually mean. Authors
    differ in what they consider to be the essential concepts of OOP. Rouson and Adelsson
    [73] compare Fortran 2003 and C++ implementations of several design patterns and
    they provide synonyms for the various concepts in these two languages.


    # 11.1 Extending Types and Type-Bound Procedures


    The basic features that allow you to create an object-oriented program are type
    extension and type-bound procedures. For example, consider points in two-dimensional
    space. The following elaborates this example in several directions. The starting
    point is this derived type:


    ```

    type point2d

    real :: x, y

    end type point2d

    ```


    You can define operations like adding a vector to this point or scaling with respect
    to the origin in the classical way using Fortran 90/95:


    ```

    module point2d


    implicit none


    type point2d

    real :: x, y

    end type point2d

    ```'
