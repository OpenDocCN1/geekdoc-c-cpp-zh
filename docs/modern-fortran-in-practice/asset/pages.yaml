  md: "# 168 MODERN FORTRAN IN PRACTICE\n\npoint = point + deltt * vector\n\n```\n\
    call print ( point )\nenddo\n```\n\nThe compact expression point = point + deltt\
    \ * vector relies on defining operator interfaces, such that the compiler knows\
    \ what the + and * operations mean for the involved types:\n\n```\ninterface operator(+)\n\
    \  module procedure add_vector_2d\nend interface\n```\n\nThis does not work for\
    \ type-bound procedures, as such an interface block:\n\n```\ninterface operator(+)\n\
    \  module procedure add_vector_2d\n  module procedure add_vector_3d\nend interface\n\
    ```\n\nThis would result in a compiler error because the compiler cannot distinguish\
    \ between these two routines. A variable of type point3d is regarded as class(point2d)\
    \ as well, due to the fact that one is extended from the other.\nThe proper way\
    \ to do this is using generic interfaces:\n\n```\ntype point2d\nreal :: x, y\n\
    contains\n  procedure :: add => add_vector\n  generic :: operator(+) => add\n\
    end type point2d\n```\n\nUsing the generic keyword, you associate the procedure\
    \ add with the operation +. In extended types, the actual routine that implements\
    \ the add procedure is different and, therefore, the + operation has a different\
    \ meaning for such extended types. But that is, of course, exactly what you want.\n\
    \nIn the following program, the variables point and vector are polymorphic and\
    \ assume the dynamic types of point2d and point3d during the run of the program\
    \ (not all code, such as the subroutine random_vector, is shown):\n\n```\nprogram\
    \ random_walk\n\nuse point3d      ! Both 2d and 3d points available\n\ntype(point2d),\
    \ target :: point_2d, vector_2d\ntype(point3d), target :: point_3d, vector_3d\n\
    \n!\n! A variable of class point2d can point to point_2d but\n```"
