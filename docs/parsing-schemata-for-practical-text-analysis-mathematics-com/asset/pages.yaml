    # 6.3.2 End of the proof of Theorem 6.2


    This concludes the proof of the induction step for Proposition 6.1 and, therefore,
    it is proved that our error-repair transformation preserves completeness (Theorem
    6.2).


    # 6.4 Optimising the results of the transformation


    The error-repair transformation that we have defined allows us to obtain error-repair
    parsers from non-error-repair ones. We also formally shown that the error-repair
    parsers obtained by the transformation are always correct if the starting parser
    satisfies certain conditions, which are easy to verify for widely known parsers
    as CYK, Earley or Left-Corner.


    However, as we see in the Example 6.7 obtained by transforming the Earley parser,
    the extra steps generated by our transformation make the semantics of the resulting
    parser somewhat hard to understand. Furthermore, the SUBHYP and DELHYP steps would
    negatively affect performance if implemented directly in a deductive engine, they
    generate a number of hypotheses proportional to the size of the terminal alphabet
    $\Sigma$. Once we have used our transformation to obtain a correct error-repair
    parser, we can apply some simplifications to it in order to obtain a simpler,
    more efficient one which will generate the same items except for modified hypotheses.
    That is, we can bypass items of the form $[a,i,j,e]$. In order to do this:


    +   * We remove the steps that generate items of this kind.

    * For each step requiring an item of the form $[a,i,j,e]$ as an antecedent, we
    change this requirement to the set of hypotheses of the form $[b,i1,i2]$ to generate
    such an item from the error hypothesis steps.'
