    #  3.7 Discussion


    In this chapter, we have described the design and implementation of a working
    compiler which is able to automatically transform formal specifications of parsing
    algorithms (expressed as parsing schemata) into efficient implementations of the
    corresponding parsers. The system''s source code can be downloaded from http://www.groucole.org/software/COMPAS/


    The compiler takes a simple representation of a parsing schema as input and uses
    it to produce optimised Java code for the parsing algorithm it describes. The
    system performs a static analysis of the input schema in order to determine the
    adequate indexes and data structures that will provide constant-time access to
    items, ensuring the efficiency of the generated implementation.


    The system is general enough to be applicable to different grammatical formalisms,
    and has been used to generate parsers for CFGs and TAGs. In addition, we provide
    an extensibility mechanism that allows the user to add new kinds of elements to
    schema apart from predefined ones. This same mechanism has been used to provide
    predefined extensions like those for feature structure unification and probabilistic
    parsing.


    The ability to easily produce parsers from schema is very useful for the design,
    analysis and comparison of parsing algorithms, as it allows us to test them and
    check their results and performance without having to implement them in a programming
    language. The implementations generated by our system are efficient enough to
    be used as prototypes in real-life domains (Gómez-Rodríguez et al., 2007d), so
    they provide a quick means of evaluating several parsing algorithms in order to
    find the best one for a particular application. This is especially useful in practice,
    since different'
