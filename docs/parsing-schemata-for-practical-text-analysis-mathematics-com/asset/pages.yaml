- img_proc: true
  md: 'entailment recognition (Herrera et al., 2005), relation extraction (Culotta
    and Sorensen, 2004; Fundel et al., 2006) and question answering (Cui et al., 2005).
    Dependency structures show head-modifier and head-complement relationships which
    form the basis of predicate argument structure, but are not represented explicitly
    in constituency trees, while providing a conceptually simpler representation in
    which no lexical nodes. In addition to this, some dependency parsers (McDonald
    et al., 2005b) are able to represent so-called *non-projective structures*, where
    the set of words dominated by each node are not required to be continuous strands
    of the input. This feature becomes especially important when parsing variable
    word order languages in which discontinuous structures are common.


    The formalism of parsing schemata, introduced by Sikkel (1997) and described in
    Chapter 2 of this book, is a useful tool for the study of constituency parsers
    as it provides formal, high-level descriptions of parsing algorithms that can
    be used to prove their formal properties (such as correctness), establish relations
    between them, derive new parsers from existing and obtain efficient implementations
    automatically (Chapter 3). The formalism was initially defined for CFGs and later
    applied to other constituency-based formalisms, such as TAGs (see Section 4.3).
    However, since parsing schemata are defined as deduction systems over sets of
    constituency trees, they cannot be used to describe dependency parsers.


    In this chapter, we define an analogous formalism that can be used to define,
    analyse and compare dependency parsers (Gomez-Rodriguez et al., 2008, 2010b).
    We use this framework to provide uniform, high-level descriptions for a wide range
    of well-known algorithms described in the literature, including both projective
    and non-projective parsers. We also show how some of these algorithms formally
    relate to each other and how we can use these relations and the formalism itself
    to prove their correctness. Finally, we adapt the framework to the dependency-related
    grammatical formalism of Link Graph, which uses undirected links to represent
    syntactic structure (Sator and Temperley, 1991, 1993), and show how parsers for
    this formalism can be obtained by adapting the schema for existing dependency
    parsers.


    Apart from describing and studying existing parsing algorithms, dependency parsing
    schemata also provide a useful framework for the development of new parsers. An
