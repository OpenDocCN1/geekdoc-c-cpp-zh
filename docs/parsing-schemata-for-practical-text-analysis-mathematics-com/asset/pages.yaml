  md: '# 7.3.7 Covington’s projective parser (Covington, 2001)


    Covington (2001) defines a non-projective dependency parser, and then gives a
    projective variant of it, called Algorithm LSUP (for List-based Search with Uniqueness
    and Projectivity). Unfortunately, this algorithm is not complete as it is given
    in the paper, since it is not able to parse every projective dependency structure.
    The reason is that, when creating leftmost links, it assumes that the head of
    a word $a_i$ must be a reflexive-transitive head of the word $a_{i-1}$, which
    is not necessarily the case. For example, the structure shown in Figure 7.2 cannot
    be parsed with Covington’s projective parser, because the constraints imposed
    by the algorithm prevent it from being able to find the head of $a_4$.


    ![](img/ff16b807830c44d182b63a3009a55f28_181_0.png)


    The MaltParser system (Nivre et al.) includes an implementation of a variant of
    Covington’s LSUP parser where these constraints have been relaxed, so that it
    is complete. This implementation has the same tree-building logic as the parser
    by Nivre (2003), differing from it in the control structures. Thus, it can be
    considered as a different implementation of the schema provided in Section 7.3.6.


    # 7.4 Relations between dependency parsers


    The framework of parsing schemata can be used to establish relations between different
    parsing algorithms. These relations are useful in understanding and comparing
    different parsers and their particular features. They can also be used to obtain
    new algorithms from existing ones or to derive formal properties of a parser (such
    as soundness or correctness) from the properties of related algorithms.


    Sikkel (1994) defines several kinds of relations between schemata, which have
    been outlined in Section 2.3.4. Most of the parsers described in Section 7.3 can
    be related via generalisation and filtering, as shown in Figure 7.3.'
