    In order to obtain a schema, we need to abstract from the control structures used
    to parse the sentence (shift and reduce) and keep only what the parser actually
    does, i.e., the way in which it joins dependency structures and builds links between
    them. In this case, the Reduce step is just a mechanism to select which a set
    of possible “linkable words” is going to be linked to the word we are currently
    reading. Two different configurations corresponding to the same partial dependency
    structure may have different lists of words in the stack depending on which Reduce
    steps have been executed. In the parsing schema for Nivre’s parser, these configurations
    will have to correspond to the same item. In order to define an item set for this
    parser, we have to observe which words might be in the stack at each configuration.


    Let $T$ be a partial dependency structure. We say that a word in $T$ is right-linkable
    if it is not a dependent of any word situated to its right


    It is easy to check that we cannot create a link between a non-right-linkable
    word and any word to the right of $T$ without violating the objectivity property
    in our dependency structure. When Nivre’s parser is reading a particular word
    $a_f$, we can say the following about all words to the left of $a_0 \dots a_f$:


    +   - If the word $a_i$ is not right-linkable, then it cannot be on the stack.

    - If the word $a_i$ does not have a head, then it may be on the stack (note words
    that do not have a head assigned are all right-linkable).

    - If the word $a_i$ has a head and it is right-linkable, then it may be on the
    stack or not (it depends on the particular transitions that we executed).


    Therefore, we can obtain a dependency parsing schema for Nivre’s parser by representing
    items with a list (instead of a stack) containing all the words found so far which
    are right-linkable, and a flag associated to if it has been assigned a head or
    not. Instead of using Reduce steps to decide which word to choose as a head of
    the currently-read word, we allow any word in the list that does not have a headless
    word to its right'
