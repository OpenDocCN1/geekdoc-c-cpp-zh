  md: '# Introduction


    In the field of constituency parsing, *context-free grammars* (CFGs) are a widely-formalism,
    since they are simple and can be parsed efficiently, in cubic time with respect
    to the length of the input (Younger, 1967; Earley, 1970). However, it has been
    shown that CFGs are not powerful enough to represent natural languages, since
    some linguistic phenomena (such as Dutch cross-serial dependencies) are not context-free
    (Joshi, 1985). This led to the development of *mildly context-sensitive grammar*
    formalisms (Joshi, 1985; Joshi *et al.*, 1991), which are formalisms that are
    general enough to account for linguistic phenomena that cannot be handled by CFGs,
    yet restricted enough to still be parsable in polynomial time. An example of this
    type of formalism is *tree-adjoining grammars* (TAGs), which are parsable in $O(n^6)$,
    where $n$ is the length of the input (Vijay-Shanker and Joshi, 1985).


    In the case of dependency-based parsing, it is also possible to use a grammar.
    For example, dependency grammars can be defined with the formalism by Hays (1964)
    and Gaifman (1965) or as lexical grammars (Eisner, 2000). However, many dependency
    parsers (Yamada and Matsumoto, 2003; Nivre *et al.*, 2007b) are purely data-driven,
    and do not use a grammar at all.


    # 1.2.2 Robustness in grammar-driven parsers


    One of the biggest difficulties that arise when using grammar-driven approaches
    to process natural language sentences in practical domains is the problem of achieving
    robustness. Robustness can be defined as the capacity of a parser to analyse any
    input sentence (Nivre, 2006b), and it is a highly desirable property for any system
    dealing with unrestricted natural language text. The problem is that, when a parser
    employs a formal grammar is used to analyse unrestricted text, it is likely to
    find sentences that do not belong to the formal language defined by the grammar.
    This can happen because of several reasons, including insufficient coverage (the
    sentence is syntactically correct, but our grammar is not detailed enough to recognise
    it) or errors in the sentence itself (not all the sentences in real texts are
    syntactically correct).


    The methods that have been proposed to solve this problem fall mainly into two
    broad categories: those which try to parse well-formed fragments of the input
    when an analysis for the complete sentence cannot be found – partial parsers,
    like the one by Kasper *et al.* (1999) – and those that try to provide a complete
    parse for the input sentence by relaxing the constraints-'
