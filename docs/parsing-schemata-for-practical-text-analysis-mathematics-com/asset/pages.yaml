    # # Dependency parsing schemata


    All the parsing algorithms that we have seen until now correspond to constituency-based
    parsers, since the framework of parsing schemata (Sikkel, 1997) is based on constituency
    trees. In this chapter we define a new formalism, based on parsing schemata, that
    can be used to describe, analyse and compare dependency-based parsing algorithms.
    This formalism, called *dependency parsing schemata*, was first introduced by
    Gómez-Rodríguez et al. (2008).


    We use this abstraction to describe several well-known projective and non-projective
    dependency parsers from the literature, and show how it can be used to prove the
    correctness of these parsers and establish formal relations between them.


    Additionally, we show how a variant of these dependency parsing schemata can be
    used to describe parsers for the Link Grammar formalism, and existing projective
    dependency parsers can be adapted to work with Link Grammar.


    # ## 7.1 Motivation


    Dependency parsing consists of finding the structure of a sentence as expressed
    by directed links (called *dependencies*) between individual words. This is an
    alternative to constituency parsing, which tries to find a division of the sentence
    into meaningful segments called *constituents*, which are then broken up into
    smaller constituents.


    Although most research on computational linguistics has traditionally focused
    on constituency parsing, dependency formalisms have received wide interest in
    recent years, while being successfully applied to tasks such as machine translation
    (Ding and Palmer, 2005; *Shen et al.*, 2008), textual'
  merge: -1
