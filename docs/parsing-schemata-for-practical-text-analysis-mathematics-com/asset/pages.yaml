    # 5.3.1 Lyon is correct


    Once we have defined a parser by means of an error-repair parsing schema, as we
    have done with Lyon''s error-repair parser, we can use the formalism to prove
    its correctness. As an example, we will show an outline of the proof that the
    parsing schema for Lyon''s algorithm is correct. Note that the proof is not given
    in full detail it will be subsumed by a more general result presented in Chapter
    6. In that chapter, we will see how any standard parsing schema meeting a set
    of conditions can be systematically transformed to an error-repair parser, in
    such a way that the correctness of the standard parser implies that the error-repair
    parser obtained by applying the transformation is also correct. The proof outlined
    here can be obtained as a particular case of the proof that the aforesaid transformation
    preserves soundness and completeness, which is described in detail in Section6.3.


    First of all, we observe that the schema for Lyon''s parser, as given above, does
    not guarantee completeness as defined by the parsing schema formalism: the goal
    of Lyon''s algorithm is to perform a least-errors analysis of the input sentence,
    and therefore to obtain all the *minimal* correct final items for a given string,
    rather than the full set of correct final items. However, we can easily obtain
    a strictly correct version of the schema by adding a deduction step:


    ```

    DISTANCEINCREASER: $[A \to \alpha \bullet, i, j, e]\n[A \to \alpha \bullet, i,
    j, e+1]$

    ```'
