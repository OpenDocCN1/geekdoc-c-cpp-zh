    # 7.7.2 Adapting projective dependency parsers to LG


    In this section, we take advantage of the similarities between LG linkages and
    projective dependency structures to adapt some of the dependency parsers seen
    in Section 7.3 to the LG formalism. In particular, we present LG versions of the
    parsers by Eisner (1996), Eisner and Satta (1999) and Yamada and Matsumoto (2003),
