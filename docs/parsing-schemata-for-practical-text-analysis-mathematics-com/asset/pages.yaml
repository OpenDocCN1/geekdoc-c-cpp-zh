    # 7.6.2 Attardi (2006) and the $MH_k$ parser


    The non-projective parser by Attardi (2006) is an extension of the algorithm by
    Yamada and Matsumoto (2003) that adds additional shift and reduce actions to handle
    non-projective dependency structures. The extra actions allow the parser to link
    nodes that are several positions deep in the stack, which causes the creation
    of non-projective links. In particular, Attardi (2006) uses six non-projective
    actions: two actions to link to nodes that are 2 positions deep; another two actions
    for nodes that are 3 positions deep; and a third pair of actions that generalizes
    the previous ones to $n$ positions deep for $n$. Thus, the maximum depth in the
    stack to which links can be created be configured according to the actions that
    we allow to use. We will call $Att_d$ the variant of the algorithm that allows
