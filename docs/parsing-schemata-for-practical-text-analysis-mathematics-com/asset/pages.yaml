  md: '# Chapter 8

    Mildly non-projective dependency parsing


    In this chapter, we use the dependency parsing schemata formalism presented in
    the previous chapter to present novel parsing algorithms for several sets of mildly
    non-projective dependency structures, and formally prove their correctness.


    First, we define a parser for well-nested structures of gap degree at most 1.
    Then, we extend this algorithm to handle all well-nested structures with gap degree
    bounded by a constant $k$. These algorithms have the best computational complexity
    as the best existing parsers for constituency formalisms of equivalent generative
    power.


    Finally, we define another extension of the algorithm which is able to analyse
    a new class of structures with gap degree up to a constant $k$, which includes
    some ill-nested structures. This set of structures, which we call mildly ill-nested,
    includes all the gap degree $k$ structures in a number of dependency treebanks.


    The parsing algorithms described in this chapter were first presented in Gómez-Rodríguez
    *et al.* (2009d), and are described with more detail in Gómez-Rodríguez *et al.*
    (2010b).


    # 8.1 Motivation


    In the previous chapter we saw that, for reasons of computational efficiency,
    many practical implementations of dependency parsing are restricted to *projective*
    structures. In these structures, the subtree rooted at each word is required to
    cover a contiguous substring of the sentence. However, some natural language sentences
    do not verify this constraint, and therefore cannot be analysed correctly by projective
    parsers. *non-projective* sentences appear in many languages (Havelka, 2007),
    being particularly'
