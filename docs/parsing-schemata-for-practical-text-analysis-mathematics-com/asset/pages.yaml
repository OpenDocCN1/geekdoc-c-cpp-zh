    **Definition 5.8.** An error-repair parsing schema (Gómez-Rodríguez et al., 2010a)
    for a class of grammars $\mathcal{CG}$ and a distance function $d$ is a function
    that assigns an error-repair uninstantiated parsing system to each grammar $G
    \in \mathcal{CG}$.


    The concepts of valid items, soundness, and completeness are totally analogous
    to the standard parsing schemata case (Section 2.3.3). Note that, in the particular
    case of completeness, a complete error-repair parser must be to infer all correct
    final items, regardless of their associated parsing distance. However, in practice,
    only items with a minimal distance be used to solve the approximate parsing problem:


    **Definition 5.9.** The minimal parsing distance for a string $a_1 \dots a_n$
    in an approximate item set $\mathcal{T}''$ is defined by:


    ```

    $MinDist(\mathcal{T}'', a_1 \dots a_n) = min\{e \in (\mathbb{N} \cup \{0\}) \mid
    \exists t \in CF^{a_1 \dots a_n}_{\mathcal{G},\mathcal{T}''} : dist(t) = e\}$.

    ```


    **Definition 5.10.** The set of minimal final items for a string $a_1 \dots a_n$
    in an approximate item set $\mathcal{T}''$ is defined by:


    ```

    $MF(\mathcal{T}'', a_1 \dots a_n) = \{t \in CF^{a_1 \dots a_n}_{\mathcal{G},\mathcal{T}''}
    \mid dist(t) = MinDist(\mathcal{T}'', a_1 \dots a_n)\}$.

    ```


    The approximate recognition and approximate parsing problems that we defined early
    for any string and grammar can be solved by obtaining the set of minimal final
    items in an approximate item set. Minimal final items can be deduced by any correct
    error-repair parsing schema, since they are a subset of correct final items.


