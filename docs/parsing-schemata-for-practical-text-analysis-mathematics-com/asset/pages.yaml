    # 8.4.2 Proof of correctness for $WG_k$


    The proof of correctness for $WG_k$ is analogous to that of $WG_1$, but generalised
    the definition of valid trees to a higher degree gap. A valid tree in $WG_k$ can
    be defined as a partial dependency tree $T$, headed at a root $a_h$ of the input
    sentence, such that:


    +   1) $[a_h]$ is of form $\{a_h\} \cup \{[i, j] \setminus \cup_{p=1}^u [l_p,
    r_p]\}$, with $0 \le s \le k$,n2) All the nodes in $T$ have gap degree at most
    $k$ except for $a_h$, which can have gap degree up to $k+1$.


    With this, we can define correct items and correct final items analogously to
    their definition in $WG_1$.


    Soundness is proven in $WG_1$. Changing the constraints for nodes so that any
    node can have gap degree up to $k$ and the head of a correct tree can have gap
    degree $k+1$, the same reasons can be applied to this case.


    Completeness is proven by induction on $\#\{a_h\}$, just as in $WG_1$. The base
    case is the same as in $WG_1$, and for the induction step, we also consider the
    direct children $a_{d_1} \dots a_{d_n}$ of $a_h$. The case where $p=1$ is proven
    by USING LINKER steps as in $WG_1$. In the case for $p \ge 1$, we also base our
    proof on the order annotation $\tilde{o}(T, a_h)$, but we have to take into account
    the set of possible annotations is limited when we allow the gap degree to be
    greater than 1, so we must take into account more cases in this part of the proof.


    In particular, an order annotation $\tilde{o}(T, a_h)$ for a valid tree $WG_k$
    can contain up to $k+1$ commas and up to $k+1$ appearances of each symbol in $\{1\}
    \dots \[u]\}$, since the head of such a tree can have gap degree at most $k$ and
    the rest of its nodes are limited to gap degree $k$. If so (if $\tilde{o}(T, a_h)$
    contains $k+1$ commas), then the constraint on the form of $[a_h]$ in valid trees
    implies that the symbol 0 cannot be contiguous to any non-comma symbol in $\tilde{o}(T,
    a_h)$.


    > ^8In all the parsers described in this chapter, COMBINE steps may be applied
    in different orders to produce the same result, causing spurious ambiguity. In
    $WG_1$ and $WG_k$, this can be avoided when implementing the schemata, by flagging
    to items as to impose a particular order on the execution of these steps.'
