    ```

    LINK: \frac{[h_1, h_1, h_1, (\)] \quad [i_2, j_2, h_2, ((l_1, r_1), \dots, (l_g,
    r_g))] \to a_{h_2} \to a_{h_1}}{[i_2, j_2, h_1,((l_1, r_1), \dots, (l_g, r_g))]}

    ```


    such that $a_{h_2} \in [i_2, j_2] \setminus \bigcup_{p=1} [l_p, r_p] \wedge a_{h_1}
    \notin [i_2, j_2] \setminus \bigcup_{p=1} [l_p, r_p]$.


    # COMBINING OPEN GAP:


    ```

    [i, l_q-1, h, ((l_1, r_1), \dots, (l_{q-1}, r_{q-1}))] \frac{[r_q+1, m, h, ((l_{q+1},
    r_{q+1})), \dots, (l_g, r_g))]}{g \leq k \wedge l_q \leq r_q} [i, m, h, ((l_1,
    r_1), \dots, (l_g, r_g))]

    ```


    # COMBINING KEEPING GAP:


    ```

    [i, j, h, ((l_1, r_1), \dots, (l_q, r_q))] \frac{[j+1, m, h, ((l_{q+1}, r_{q+1})),
    \dots, (l_g, r_g))]}{g \leq k} [i, m, h, ((l_1, r_1), \dots, (l_g, r_g))]

    ```


    # COMBINING SHRINKING GAP LEFT:


    ```

    [i, j, h, ((l_1, r_1), \dots, (l_q, r_q), (l'', r''), (l_{s+1}, r_{s+1}), \dots,
    (l_g, r_g))] \frac{[l'', s-1, h, ((l_{q+1}, r_{q+1})), \dots, (l_{s-1}, r_{s-1}))]}{g
    \leq k} [i, j, h, ((l_1, r_1), \dots, (l_g, r_g))]

    ```


    # COMBINING SHRINKING GAP RIGHT:


    ```

    [i, j, h, ((l_1, r_1), \dots, (l_{q-1}, r_{q-1}), (l'', r''), (l_s, r_s), \dots,
    (l_g, r_g))] \frac{[r_q+1, r'', h, ((l_{q+1}, r_{q+1})), \dots, (l_{s-1}, r_{s-1}))]}{g
    \leq k} [i, j, h, ((l_1, r_1), \dots, (l_g, r_g))]

    ```


    # COMBINING SHRINKING GAP CENTRE:


    ```

    [i, j, h, ((l_1, r_1), \dots, (l_q, r_q), (l'', r''), (l_s, r_s), \dots, (l_g,
    r_g))] \frac{[l'', r'', h, ((l_{q+1}, r_{q+1})), \dots, (l_{s-1}, r_{s-1}))]}{g
    \leq k} [i, j, h, ((l_1, r_1), \dots, (l_g, r_g))]

    ```'
