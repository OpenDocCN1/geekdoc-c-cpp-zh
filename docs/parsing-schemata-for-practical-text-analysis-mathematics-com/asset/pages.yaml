    To emulate this functionality in our parsing schema-based system, we have used
    its extensibility mechanism to define a function Selects-tree(a,T) that returns
    true if the terminal symbol a selects the tree T.


    The implementation of this function is a Java method that looks for this information
    in XTAG''s syntactic database. Then the function is inserted in a filtering step
    over our schemata:


    ```

    [a, i, j]  α ∈ Trees/Selects-tree(a;α)

    [Selected, α]

    ```


    The presence of an item of the form [Selected, a] indicates that the tree a has
    been selected by the filter and can be used for parsing. In order for the filter
    to take effect, we add [Selected, a] as an antecedent to every step in our schema
    introducing a new tree α into the parse (such as initters, substitution and adjoining
    steps). In this way we guarantee that no trees that do not pass the filter will
    be used for parsing.


    Note that the Selects-tree function can be defined to return true by default when
    we are working with a generic non-lexicalised TAG without such a filter, so we
    can preserve the genericity of the schema while allowing them to take advantage
    of lexicalisation to improve performance with the XTAG grammar.


