    than Earley with respect to grammar size (see Section 4.1), but the TAG of the
    CYK algorithm is quadratic with respect to grammar size and does not have this
    advantage.


    CYK generates fewer items than the Earley-based algorithms when working with large
    grammars and short strings, and the opposite happens when working with small grammars
    and long strings.


    The Earley-based algorithm with the VPP generates the same number of items as
    the one without this property, and has worse execution times. The reason is that
    no partial parses violating the property are generated by any of algorithms in
    the particular case of the grammars $G_k$, so guaranteeing the VPP does not prevent
    any items from being generated. Therefore, the variant without the VPP works better
    in this particular case cannot be extrapolated to other grammars. However, the
    differences between these two algorithms illustrate the overhead caused by the
    extra needed to guarantee the VPP in a particularly bad case.


    Nederhof''s algorithm has slower execution times than the other Earley variants.
    Despite the fact that Nederhof''s algorithm is an improvement over the other Earley-based
    algorithm with the VPP in terms of computational complexity, the extra deduction
    steps contains it makes it slower in practice.


    Finally, if we compare the runtimes obtained in this section with those obtained
    with the XTAG English Grammar (Table 4.5), we see that the obtained execution
    times for the XTAG grammar are in the ranges that we could expect given the artificial
    results, i.e. they approximately match the times in the tables for the corresponding
    grammar sizes and input string lengths. The most noticeable difference is that
    the Earley-like algorithm verifying the VPP generates fewer items than the variant
    without the VPP in the XTAG grammar, and this causes its runtimes to be faster.
    But this difference is not surprising, as explained above.


