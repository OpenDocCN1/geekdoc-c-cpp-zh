    It is easy to prove that the grammar $G_k$ is one of the minimal TAGs (in terms
    of number of trees) whose associated language is $L_k$. Note that we need at least
    a tree containing $a_0$ as only terminal in order to parse the sentence $a_0$,
    and for each $1 \leq i \leq k$, we need at least a tree containing $a_i$ and no
    other $a_j$ ($j>0$) in order to parse the sentence $a_0a_i$. Therefore, any TAG
    for the language $L_k$ must have at least $k+1$ elementary trees.


    Note that although the languages $L_k$ are regular, the grammars $G_k$ are built
    in such way that any of the auxiliary trees may join into any other. These grammars
    are suitable if we want to make an empirical analysis of worst-case complexity.


