  md: '# Error-repair parsing schemata


    This alternative version of SCANINSERTED cannot be used to repair an insertion
    error at the end of the input, as a repair is only attempted if we are expecting
    a terminal symbol $x$ and find another terminal $b$ instead, but not if we are
    expecting the end of the string. Lyon avoids this problem by extending the grammar
    used by the schema by changing the initial symbol $S$ to $S''$ and adding the
    additional rule $S'' \to S$, where the character $\$$ acts as an end-of-sentence
    marker. However, we choose to keep our more general version of the step, and not
    to extend the grammar with this additional rule.


