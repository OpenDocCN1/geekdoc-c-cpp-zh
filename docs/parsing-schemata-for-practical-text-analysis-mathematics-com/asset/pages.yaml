  md: "# Practical complexity of constituency parsers\n\n# 4.2.2 Substitution and\
    \ adjunction\n\nTo define TAG derivations in more detail, we first need to define\
    \ initial and auxiliary trees. Initial trees are trees whose non-leaf nodes are\
    \ labelled with symbols in $N$, and whose leaf nodes can be labelled with any\
    \ symbol in $N \\cup \\Sigma \\{\\epsilon\\}$. Auxiliary trees have the same form\
    \ as initial trees, with the exception that exactly one of their frontier nodes\
    \ be marked as a foot node. The foot node must be labelled with a nonterminal\
    \ symbol, and it must have the same label as the root. The path from the root\
    \ to the foot node of an auxiliary tree is referred to as its spine.$^6$\n\nElementary\
    \ trees in $T \\cup A$ can be combined among themselves to form derived trees,\
    \ which can be in turn combined with other derived or elementary trees to larger\
    \ derived trees. Trees can be combined by using the adjunction and substitution\
    \ operations.\n\nThe adjunction operation combines an auxiliary tree $\beta$ with\
    \ another tree $\\gamma$, which can be an initial, or auxiliary tree. For an adjunction\
    \ to be possible, there must be an inner node in the tree $\\gamma$ (called an\
    \ adjunction node) whose label is the same as that of the root and foot of the\
    \ auxiliary tree $\beta$. Under this assumption, the derived tree is assembled\
    \ as follows (Figure 4.3):\n\n+   (1) $\\gamma_2$ be the subtree of $\\gamma$\
    \ rooted at the adjunction node. We call $\\gamma_1$ the tree obtained by removing\
    \ the nodes in $\\gamma_2$, except for the adjunction node, from $\\gamma$. Note\
    \ that both $\\gamma_1$ and $\\gamma_2$ contain a copy of the adjunction node\
    \ (these copies act as a frontier node of $\\gamma_1$ and the root of $\\gamma_2$).\n\
    \n+   (2) The derived tree is obtained by linking the tree $\beta$ to the tree\
    \ $\\gamma_1$ and $\\gamma_2$ by collapsing the copy of the adjunction node in\
    \ $\\gamma_1$ and the root of $\beta$ into a single node, and by collapsing the\
    \ copy of the adjunction node in $\\gamma_2$ and the foot node of $\beta$ into\
    \ a single node.\n\n> We are defining TAG with the adjunction and substitution\
    \ operations, the English grammar that will use in our experiments allows these\
    \ operations. However, it should be noted that it is also possible to define TAG\
    \ where only adjunction is allowed. In this case, there are additional constraints\
    \ on the sets $I$ and $A$: the root of initial trees must be labelled $S$, and\
    \ no leaf nodes of elementary trees can be labelled with nonterminal symbols except\
    \ for the foot nodes of auxiliary trees. TAG without substitution formally simpler\
    \ than those described here and have the same generative power; however, substitution\
    \ is usually allowed in practical grammars since it simplifies the description\
    \ of elementary trees."
