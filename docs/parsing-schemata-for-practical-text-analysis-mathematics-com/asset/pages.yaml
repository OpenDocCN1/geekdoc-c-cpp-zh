  md: 'Additionally, the trees’ anchor nodes were duplicated, so that every anchor
    node in the original XTAG grammar was transformed to an adjunction node with a
    single child labelled as an anchor node, with both nodes taking their label and
    feature structures from the original node. This transformation was necessary in
    order to work around a peculiar characteristic of the XTAG grammar. While the
    generic TAG formalism does not allow adjunction at anchor nodes, the XTAG grammar
    does. By applying this transformation to the grammar, we can parse it with our
    generic parsers without needing to modify them in order to contemplate this variation
    from the standard definition of TAGs, since we can perform adjunctions at the
    new adjunction nodes that we add to the trees and the effect is equivalent to
    that of adjoining on the anchor.


    # ## 4.4.2 Feature structure unification


    The XTAG trees include feature structures (Carpenter, 1992; Vijay-Shanker and
    Joshi, 1988) associated with each of its nodes. Feature structures contain information
    about how nodes may interact with each other, and they may impose constraints
    on the adjunction and substitution operations, where the features in the involved
    nodes must unify.


    Two strategies may be used in order to take unification into account in parsing:
    feature structures can be unified after parsing or during parsing. The first strategy
    consists of parsing the sentence just as in a grammar-without feature structures,
    ignoring unification, and then recovering the parse forest and performing unification
    only on the final parse trees, eliminating trees that violate unification constraints.
    The second strategy consists of performing unification as a part of the parsing
    process, so that feature structures are unified during operations like adjunction
    or substitution.


    At first, each of these strategies has its advantages and disadvantages. By performing
    unification during parsing, we are considering the constraints imposed by feature
    structures earlier, so we avoid the generation of unnecessary trees violating
    these constraints. On the other hand, by unifying after parsing, we are only performing
    unification on the items needed to build the final parse trees, so we avoid unification
    operations on items that lead to incomplete parses.


    Therefore, none of the methods is better than the other in absolute terms: the
    convenience of one or the other will depend on the way feature structures are
    used in the grammar.'
