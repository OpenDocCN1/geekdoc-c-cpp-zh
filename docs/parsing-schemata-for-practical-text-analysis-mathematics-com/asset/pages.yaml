    # 1.2 Background


    In this section, the contributions of this book are put into context by briefly
    introducing the problem of parsing natural language sentences and the formalism
    of parsing schemata.


    # 1.2.1 Parsing natural language


    In the context of computational linguistics, the process of parsing, or syntactic
    analysis, consists of finding the grammatical structure of natural language sentences.
    Given a sentence represented as a sequence of symbols, each corresponding to a
    word, a parsing algorithm (or simply parser) will try to find and output a representation
    of the syntactic structure of the sentence. The nature of this representation
    depends on the linguistic theory in phrase structure parsers, or constituency
    parsers, sentences are analysed by dividing them into meaningful segments called
    constituents, which are, in turn, broken into smaller constituents. The result
    of a constituency analysis can be represented with a phrase structure tree (or
    constituency tree), as can be seen in Figure 1.1a. On the other hand, in dependency-based
    parsers, the structure of a sentence is represented by a set of directed links
    (dependencies) between their words, which form a graph as can be seen in Figure
    1.1b.


    Parsing is a fundamental process in any natural language processing pipeline,
    since obtaining the syntactic structure of sentences provides us with information
    that can be used to extract meaning from them: constituents correspond to units
    of meaning, and dependency relations describe the ways in which they interact,
    such as who performed the action described in a sentence or which object is receiving
    the action. Thus, we can find'
