    # # Practical complexity of constituency parsers


    In the last chapter, we presented a compiler able to automatically obtain efficient
    implementations of parsing algorithms from their formal specifications expressed
    as parsing schemata. In this chapter, we show how this system can be used to prototype
    different parsing algorithms for constituency-based grammar formalisms. We evaluate
    these algorithms empirically, both on practical grammars and corpora, and on artificially-generated
    examples.


    First, implementations are generated for three well-known parsing algorithms for
    CFGs, and they are compared using them to parse sentences with three different
    grammars taken from real-life corpora. The obtained results show how the choice
    of the most suitable algorithm for a particular application depends on the characteristics
    of the particular grammar being used (Gómez-Rodríguez et al., 2006d).


    Second, implementations are also generated with system for four TAG parsers, and
    they are used to analyse natural language sentences under the XTAG English Grammar
    (XTAG Research Group, 2001). This allows us to compare the empirical performance
    of these algorithms under a real-life, wide-coverage feature-based TAG (Gómez-Rodríguez
    et al., 2006b). To the best of our knowledge, this is the first such empirical
    comparison of TAG parsers as previous studies in the literature (Díaz and Alonso,
    2000) are based on “toy” grammars with a small number of rules, so their results
    hardly extrapolable to practical applications.


    The claim that performance results for small TAGs do not predict those large grammars
    will be further substantiated in the last part of the chapter, where we use experiments
    based on artificially-generated grammars to provide an evaluation of the influence
    of grammar size on the performance of TAG parsers (Gómez-Rodríguez et al., 2006a,c),
    as well as a study of the practical overhead caused by using TAGs to parse context-free
    languages.'
