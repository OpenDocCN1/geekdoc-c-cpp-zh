    # 5.5 Global and regional error repair


    If a robust parser is able to find all the minimal-distance approximate parses
    for each given string, it is called a global error-repair parser. Therefore, all
    parsers which solve the approximate parsing problem we have defined it, including
    the ones implemented with the technique explained in the previous section, are
    global error-repair parsers.


    In practice, global error-repair parsers can be useful working with small grammars
    or short strings, but they can get really inefficient if we need to parse long
    sentences or use grammar with thousands of productions, as usual in natural language
    processing. The main reason for this inefficiency is that this kind of parsers
