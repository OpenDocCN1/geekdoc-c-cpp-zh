    We will write an edge $(a_i, a_j)$ of a dependency graph as $a_i \rightarrow a_j$.
    Each of these edges is called a dependency link, meaning that the word $a_i$ is
    a syntactic dependent (or child) of $a_j$, or conversely, that $a_j$ is the parent,
    governor or head of $a_i$.


    An important notion when defining dependency parsers is that of *projectivity*.
    Projective dependency graphs are those where each node dominates a contiguous
    substring of the input string. The relevance of projectivity comes from the fact
    that projective dependency structures can be parsed efficiently, in cubic time
    respect to input length, while the recognition problem for general non-projective
    structures is NP-complete (Neuhaus and Bröder, 1997). For this reason, many of
    the parsers whose schema we see in this chapter are projective parsers, meaning
    that they can only analyze projective dependency structures.


    When we translate the concept of projectivity from dependency graphs to the trees
    in $D$-trees, we obtain the following:


    **Definition 7.3.** A partial dependency tree $T \in D$-trees is said to be *projective*
    if $yield(T)$ cannot be written as $\dots a_i \dots a_j \dots$ where $i \ge j$,
    i.e., if the marked terminals in $yield(T)$ are ordered by their indexes.


    It is easy to verify that the dependency graph $g(T)$ is projective with respect
    to the linear order of marked terminals $a_i$, according to the usual definition
    of projectivity found in the literature (Nivre, 2006a), and only if the tree $T$
    is projective. A tree with an ordered yield trivially satisfies the condition
    that the marked terminals form a contiguous substring of the input sentence and
    the yield of each of its terminal nodes and the third constraint in Definition
    7.1 guarantees that trees corresponding to projective graphs *must* have their
    ordered yield.


    **Definition 7.4.** A partial dependency tree $T \in D$-trees is a *parse tree*
    for a given string $a_1 \dots a_n$ if its yield is a permutation of $a_1 \dots
    a_n$. If its yield is exactly $a_1 \dots a_n$, we will say it is a *projective
    parse tree* for the string.


    **Definition 7.5.** Let $\delta \in D$-trees be the set of dependency trees which
    are acceptable according to a given grammar $G$ (which may be a grammar of D-rules
    or CFG-rules, as explained above). We define an *item* for dependency parsing
    as a set $T \in \Pi$, where $\Pi$ is a partition of $P(\delta)$.'
