    execution times, as we can see from the results in the tables. This leads to note
    that traditional complexity analysis based on a single factor (string length or
    grammar size) can be misleading for practical applications, since it can lead
    us to an incomplete idea of real complexity. For example, if we are working with
    a grammar with thousands of trees, the size of the grammar is the most influential
    factor, and the use of filtering techniques (Schabes and Joshi, 1991) to reduce
    the amount of trees used in parsing is essential to achieve good performance.
    The influence of string length in these cases, on the other hand, is mitigated
    by the huge constant factors related to grammar size. For instance, in the times
    shown in the tables for the grammar $G_{4096}$, we see that parsing trees are
    multiplied by a factor less than 3 when the length of the input string is duplicated,
    although the rest of the results have lead us to conclude that the practical asymptotic
    complexity with respect to string length is at least $O(n^{2.6})$. These interactions
    between both factors must be taken into account when analysing performance in
    terms of computational complexity.'
