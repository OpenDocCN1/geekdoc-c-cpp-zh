  md: "# 7.4.3 Other relations\n\nIf we generalise the linking steps in Eisner and\
    \ Satta's parser so that the head of each item can be in any position, we obtain\
    \ a correct $O(n^5)$ parser which can be filtered to the parser by Collins (1996)\
    \ by eliminating the COMBINER steps.\n\nFrom Collins' parser, we can obtain an\
    \ $O(n^5)$ head-corner parser based on CFG-like rules by any item refinement in\
    \ which Collins item $[i, j, h]$ is split into a set of items $[A(\\alpha \\cdot\
    \ \bullet \\cdot \\gamma), i, j, h]$. Of course, the formal refinement between\
    \ these parsers only holds if the D-rules used for Collins' parser correspond\
    \ to the CFG rules used for the head-corner parser. For every D-rule $B \rightarrow\
    \ A$ there must be a corresponding CFG-like rule $A \rightarrow B \\dots$ in the\
    \ grammar used by the head-corner parser.\n\nAlthough this parser uses three indices\
    \ $i, j, h$, using CFG-like rules to guide linking decisions makes them unnecessary,\
    \ so they can be removed. This simplification is an item contraction which results\
    \ in $O(n^3)$ head-corner parser. From here, we can follow the procedure in Sikkel\
    \ (1994) to relate this head-corner algorithm to pars to other algorithms for\
    \ CFGs. In this way, we can refine the head-corner parser to a variant of the\
    \ algorithm by Vreught and Honig (1997)$^6$ and by successive filters we reach\
    \ a left-corner parser which is equivalent to the one described by Barbero *et\
    \ al.* (1998), and a step contraction of the Early-based dependency parser by\
    \ Lombardo and Lesmo (1996). The proofs for these relations are as described in\
    \ Sikkel (1994), except that the dependency variants of each algorithm are simpler\
    \ (due to the absence of epsilon rules and the fact that the rules are lexicalized)$^7$.\n\
    \n> $5$A head-corner parser (van Noord, 1997) is an algorithm that starts of parsing\
    \ the right-hand side of each CFG rule (corresponding to each dependency subtree,\
