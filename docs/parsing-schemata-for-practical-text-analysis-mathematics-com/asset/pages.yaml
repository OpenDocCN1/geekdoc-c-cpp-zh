    The order annotation for the node $a_k$ is a string over the alphabet $\{0, 1,
    \dots, p\} \cup \{“"\}$ obtained from the following process:


    +   - Build a string $T(T, a) = x_1x_2\dots x_n$, where $x_k = 0$, $x_i = u$ if
    $a_i \in [a_{d_u}]$, and $x_i = “v\”$ otherwise (i.e. if $a_i \in [a_k]$).

    - The order annotation for $a_k$, $\hat{o}(T, a)$, is the string collapsing all
    adjacent occurrences of the symbol in $x(T, a)$ into a single occurrence, and
    removing all leading and trailing characters.$3$


    By construction, order annotations have the following property:


    Property 1. If the order annotation for a node $a_k$ is a string $\hat{o}(T, a)
    = o_1 \dots o_q$, then there exist unique natural numbers $i_1 < i_2 < \dots <
    i_{q+1}$ such that:


    +   - If the symbol 0 appears in position $v$ in $\hat{o}(T, a_k)$, then $i_v
    = k$ and $i_{v+1} = k+1$.

    - If a symbol $s \in (\mathbb{N} \setminus \{0\})$ appears in positions $v_1,
    \dots, v_r$ in $\hat{o}(T, a_k)$, then the projection of the $s$-th node of $a_k$
    in $T$ is $\{i_{v_1}, i_{v_1+1}-1\} \cup \dots \cup \{i_{v_r}, i_{v_r+1}-1\}$.


    In particular, it can be checked that $i_1$ is always the index associated to
    the rightmost node in $[a_k]$, $i_{q+1}$, and for each $i_v$ such that $1 < v
    < q$, the differences $d_v = (i_v - i_{v-1})$ correspond to the positions in the
    intermediate string $x(T, a_k)$ such that the $d_v$th node in $x(T, a_k)$ differs
    from the $(d_v+1)$th.


    By using this property to reason about the projections of a dependency trees-nodes,
    we can show the following, more particular properties:


    Property 2. A node $a_k$ has degree $g$ in a dependency structure $T$ if, and
    only if, the comma symbol $(,)$ appears $g$ times in $\hat{o}(T, a_k)$.


    (Corollary 1) The gap degree of a dependency structure $T$ is the maximum value
    among the number of commas in the order annotations of each of its nodes.


    (Corollary 2) A dependency structure is projective if, and only if, none of the
    order annotations associated to its nodes contain a comma.


