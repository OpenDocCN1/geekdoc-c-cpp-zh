    From now on, we will focus on the strategy that performs unification

    during parsing. In order to generate implementations of parsing algorithms

    support this strategy with our parsing schemata-based system, we

    must extend our schemata in order to support unification. This has been

    done in the following way:


    +   - Items are extended so that they hold a feature structure in addition to

    t rest of the information they include.

    - We define two operations on feature structures: the unification operation and
    the "keep variables" operation. The "keep variables" operation is a transformation
    of feature structures that takes a feature structure as an argument, which may
    contain features, values, symbolic variables and associations between them. The
    operation returns a feature structure containing only the variable-value associations
    related to a given elementary tree, ignoring the variables and values not associated
    through these relations, and completely ignoring features.

    - During the process of parsing, feature structures that refer to the same node,
    or to nodes that are taking part in substitution or adjunction and are going to
    collapse into a single node in the final parse tree, must be unified. For this
    to be done, the test that these nodes must unify is also a side condition to the
    steps that must handle them, and the unification results are included in the item
    generated by the consequence. Of course, considerations about the different role
    of the top and bottom feature structures in adjunction and substitution (Vijay-Shanker
    and Joshi, 1988) must be taken into account when determining which feature structures
    must be unified.

    - Feature structures that are included in items must hold value associations for
    the symbolic variables appearing in the tree to which structures refers, for these
    relationships hold the information that we need in order to propagate values according
    to the rules specified in the unification equations. Variable-value associations
    referring to different elementary trees are irrelevant when parsing a given tree,
    and feature-value and feature-variable associations are local to a node and cannot
    be extrapolated to other nodes, so we will not propagate any of this information
    in items. However, it must be used locally for unification. Therefore, deduction
    steps perform unification by using the information in their antecedent items and
    recovering complete feature structures associated to nodes directly from the grammar,
