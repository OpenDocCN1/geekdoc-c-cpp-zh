    linkages with the same structure as these graphs. For example, the graphs associated
    to the forests in an item of the form $[i, j]$ in Yamada and Matsumoto''s dependency
    parsing schema are graphs with two distinct components headed at the words $a_i$
    and $a_j$, an item $[i, j]$ in the corresponding LG parsing schema will contain
    linkages with two connected components, containing the word $a_i$ and the other
    containing $a_j$. Note that the notion of a head is lost in the conversion since,
    being undirected, LG linkages do not make distinctions between heads and dependents.
    This will allow us to simplify the notation used to denote items in some cases.
    For example, we do not need to make a distinction between Eisner items of the
    form $[i, j, True, False]$ and those of the form $[i, j, False, True]$, since
    their structure is the same modulo the direction of the links. Therefore, items
    in the LG version of Eisner''s parser will use a single flag, indicating which
    linkages contained in them have one or two connected components.


    +   The combining and linking steps of the dependency parsers can be directly
    translated to LG. If the original dependency steps produced items containing dependency
    trees, the resulting LG steps will produce items with planar linkages. When the
    dependency steps have constraints related to the position of the head in items
    (like combiner steps in Eisner and Satta''s parser, where we can combine $[i,
    j]$ with $[j, k]$ but not with $[j, k, j]$, for example), we ignore these constraints,
    considering that any word in a linkage can be considered its “head” for the purpose
    of linking it to other linkages.


    +   With this, we obtain a parsing schema that for any acyclic input string, since
    projective dependency parsers do not allow cycles. To allow cycles, we add steps
    or remove constraints from existing steps so that the parsers are able to link
    two words that are already in the same connected component of a linkage. In the
    schema obtained from Eisner''s parser, this is done by allowing LINK steps to
    be applied on items representing fully connected linkages. In the one corresponding
    to Eisner and Satta''s we allow COMBINER steps to create a link in joining two
    linkages and in the one for Yamada and Matsumoto''s parser we add a step that
    creates two links at the same time, combining the functionality of the L-LINK
    and R-LINK steps.


