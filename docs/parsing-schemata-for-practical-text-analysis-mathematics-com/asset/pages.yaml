    of the form $[i, k, k]$ by symmetric reasoning, proving that the parsing schema
    for Eisner and Satta’s parser is correct.


    # 7.5.2 Yamada and Matsumoto (2003) is correct


    In order to prove correctness of this parser, we follow the procedure as above.
    Soundness is again trivial to verify, by building forests for the consequences
    of steps from those corresponding to the antecedents. To prove completeness, we
    use strong induction on the length of items, the length of an item $[i, j]$ is
    defined as $j-i+1$.


    The induction step is proved by considering any correct item $[i, k]$ of length
    $l > 2$ ($l=2$ is the base case since items of length 2 are generated by the *Initter*
    step) and proving that it can be inferred from antecedents of length less than
    $l$, so it is valid. To show this, we note that if $l > 2$, $a_i$ has either one
    right dependent or $a_k$ has at least one left dependent in the item. Supposing
    that $a_i$ has a right dependent, if $T_1$ and $T_2$ are the trees rooted at $a_i$
    and $a_k$ in a forest in $[i, k]$, we call $a_j$ the rightmost daughter of $a_i$
    and consider the following trees:


    +   - $V =$ the subtree of $T_1$ rooted at $a_j$,

    -$ $U_1 =$ the tree obtained by removing $V$ from $T_1$,

    -$ $U_2 =$ the tree obtained by removing all children to the right of $a_j$ from
