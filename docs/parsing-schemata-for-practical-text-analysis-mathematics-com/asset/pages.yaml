    CFGs by removing their arguments and feature structures.^1$ The test sentences
    were randomly generated by starting with the axiom and randomly selecting nonterminals
    and rules to perform expansions, until valid sentences consisting only of terminals
    were produced. Note, as we are interested in measuring and comparing the performance
    of the parsers, not the coverage of the grammars, randomly-generated sentences
    are a good input in this case: by generating several sentences of a given length,
    parsing them and averaging the resulting runtimes, we get a good idea of the performance
    of the parsers for sentences of that length. Table 4.1 summarises some facts about
    the three grammars, by "Rule Length" we mean the average length of the right-hand
    side of a grammar''s production rules.


    For Earley''s algorithm, we have used a schema similar to the one given in Section
    3.1, but slightly modified by dividing the PREDICTOR step into different steps
    for lengths of the associated production''s right side (0, 1, 2 or more symbols).
    This modification of the schema makes indexing more effective and thus reduces
    execution times, without affecting computational complexity.


    For the CYK algorithm, grammars were converted to Chomsky normal form (CNF), since
    this is a precondition of the algorithm. In the case of the Delta grammar, which
    is the only one of our test grammars containing epsilon rules, we have used a
    weak variant of CNF allowing epsilon rules and the CYK variant described by the
    schema in Figure 4.1, which can handle them.


    Left-corner parsing (Rosenkrantz and Lewis 1970) can be seen as an optimisation
    of Earley parsing which takes advantage of information obtained from the grammar,
    in the form of so-left-corner relations between nonterminal symbols. If we define
    a relation $First(A, B)$ be true if there is a production of the form $A \rightarrow
    Bo$ in the grammar, the transitive and reflexive closure of the form $First(A,
    B)$ is called the left-corner relation. A parsing scheme for Left-Corner parsing
    (Sikkel, 1997) can be obtained by using this left-corner information to contract
    its deduction steps and avoid the generation of unnecessary items.


    In particular, the schema used for the Left-Corner parsing in the experiments
    in this book is the $sLC$ variant described by Sikkel (1997),


