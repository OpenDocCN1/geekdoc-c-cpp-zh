    # 8.4 The $WG_k$ parser


    The $WG_1$ parsing can be generalised to obtain a parser for all well-nested dependency
    structures with gap degree bounded by a constant $k(k \ge 1)$, which we call $WG_k$
    parser. In order to do this, we extend the item set so that it can contain items
    with up to $k$ gaps, and modify the deduction steps with these multi-gapped items.


    # 8.4.1 $WG_k$ parsing schema


    The item set for the $WG_k$ parsing schema is:


    > $WG_k = \[i,j,h,((l_1,r), \dots, (l_g,r))]\}$


    where $i,j,h \in (\mathbb{N} \cup \{0\}),; 0 \le g \le k, 1 \le h \le n, 1 \le
    i \le j \le n, h \neq j, h \neq i-1;$ and for each $p \in \{1,2,\dots,g\}; l_p,
    r_p \in \mathbb{N}, l_p < r_p, r_p < l_{p+1}-1, h \neq l_p-1, h \neq r_p$.


    An item $[i,j,h,((l_1,r), \dots, (l_g,r)]]$ represents the set of all well-nested
    dependency trees at $a$ such that $[a_k] = \{a_k\} \cup \bigcup_{p=1}^g[l_p,r_p],
    \setminus$ where each $[l_p,r_p]$ is called a gap. The constraints $h \neq j,
    h \neq l_p-1, h \neq r_p$ are added to avoid redundancy, and normalisation is
    defined in $WG_1$. The set of final items is defined as the set $\mathcal{F} =
    \{\{[1,n,h,\{\}] \mid h \in \mathbb{N}, 1 \le h \le n\}$. Note that this is the
    same as in $WG_1$, as these are the items we denoted $[1,n,h,o,\circ]$ in the
    previous parser.'
