    from the smallest constituents (the leaves) and proceeds by grouping them into
    larger constituents, building the tree upwards until it finds its root. This algorithm
    can only be used to parse with CFGs G=(N, Σ, P, S) in Chomsky Normal Form (Chomsky,
    1959), which roughly means that productions in P must be of the form A → BC or
    A → a.'
