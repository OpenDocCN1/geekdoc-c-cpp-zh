  md: '# Error-repair parsing schemata


    An error-repair parser will be able to detect errors in sentences, and build a
    constituency tree for an ungrammatical sentence based on the parse tree for its
    corresponding grammatical sentence.


    The parsing schemata formalism introduced in Chapter 2 does not suffice to define
    error-repair parsers that can show a robust behaviour in the presence of errors.
    By Definition 2.9, items can only contain members of Trees(G), which are trees
    that conform to the constraints imposed by the grammar, but in order to build
    trees for ungrammatical sentences we need to be able to violate these constraints.
    What we need is to obtain items containing “approximate parses” if an exact parse
    does not exist. Approximate parses are not members of Trees(G), since they may
    correspond to ungrammatical sentences, but they should be similar to a member
    of Trees(G). This notion of “similarity” can be formalised as a distance function
    in order to obtain a definition of items allowing approximate parses to be generated.


    # 5.2.1 The formalism of error-repair parsing schemata


    Given a grammar G with an alphabet Σ of terminal symbols and a set N of nonterminal
    symbols, we by Trees''(G) the set of finitely branching trees whose children of
    a node have a left-to-right ordering and every node is labelled with an element
    of N ∪ Σ(Σ × N) ∪ ε. Note that Trees(G) ⊂ Trees''(G), and nodes labelled with
    elements of (Σ × N) correspond to marked terminals of the form (a, i). Definition
    2.7. We will use the notation ai to abbreviate a marked terminal, (a, i) or (ai,
    i), depending on the context.


    Let d: Trees''(G) × Trees''(G) → N{0, ∞} be a function verifying the following
    distances:


    +   * For all t1, t2 ∈ Trees''(G), d(t1, t2) takes non-negative values or the
    value +∞ (non-negativity),

    * For all t ∈ Trees''(G), d(t, t) = 0,

    * For all t1, t2, t3 ∈ Trees''(G), d(t1, t2) = d(t2, t1) (symmetry),

    * For all t1, t2, t3 ∈ Trees''(G), d(t1, t3) ≤ d(t1, t2) + d(t2, t3) (triangle
    inequality)


    > ¹These are the axioms for an extended pseudometric. If, in addition to this,
    the function d defines positive definiteness (i.e., if from being non-negative,
    we have that d(t1, t2) = 0 if and only if t1 = t2), the distance is an extended
    metric. A pseudometric is a generalisation of a metric where we allow distinct
    entities to be at zero distance, and a (pseudo)metric is called extended if it
    is allowed to take the value +∞.'
