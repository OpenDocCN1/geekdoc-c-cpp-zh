  md: '# Chapter 5


    # Error-repair parsing schemata


    Robustness, the ability to analyse any input regardless of its grammaticality,
    is a desirable property for any system dealing with unrestricted natural language
    text. Error-repair parsing approaches achieve robustness by considering ungrammatical
    sentences as corrupted versions of valid sentences.


    The formalism of parsing schemata, as defined by Sikkel (1997) and explained in
    Chapter 2 of this book, cannot be used to define and represent parsing algorithms.
    In this chapter we present a variant of the formalism (Gómez-Rodríguez et al.,
    2007b, 2010a) that can be used to define and relate error-repair parsers and study
    their formal properties, such as correctness. Additionally, we will use this new
    formalism, together with the parsing schema compiler presented in Chapter 3, to
    generate and compare implementations of parsers with global and regional error-repair
    strategies.


    # 5.1 Motivation


    When using grammar-driven parsers to process natural language texts in real-life
    domains, it is common to find sentences that cannot be parsed by the grammar.
    This may be due to several reasons, including insufficient coverage (the input
    is well-formed, but the grammar cannot recognise it) and ill-formedness of the
    input (errors in the sentence or errors caused by input methods). A standard parser
    will fail to return an analysis in these cases. A robust parser is one that can
    provide useful results for such extragrammatical sentences.


    The methods that have been proposed to achieve robustness in grammar-driven parsing
    fall fall mainly into two broad categories: those that try to parse well-formed
    fragments of the input when a parse for the complete sentence cannot be found
    (partial parsers, such as the one described'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# Parsing Schemata for Practical Text Analysis


    by Kasper et al. (1999)), and those who try to assign a complete parse to the
    input sentence by relaxing grammatical constraints. In this chapter we will focus
    on error-repair parsers, which fall into the second category. An error-repair
    parser is a kind of robust parser that can find a complete tree for sentences
    not covered by the grammar, by supposing that ungrammatical strings are corrupted
    versions of valid strings.


    In the field of compiler design for programming languages, the problem of repairing
    and recovering from syntax errors during parsing has received a great deal of
    attention in the past (see for the list of references provided in the annotated
    bibliography of Grune and Jacobs (2008, 18.2.7)) and also in recent years (see
    for example van der Spe et al. (2005); Cochuelo et al. (2002); Kim and Choe (2001);
    Cerecke (2002)). In the field of natural language parsing, some error-repair parsers
    have also been described, for example, in Lyon (1974); Mellish (1989), or more
    recently in Vilares et al. (2004) and Perez-Cortes et al. (2000).


    However, no formalism has been proposed to uniformly describe errorrepair parsers,
    compare them and prove their correctness. In this chapter we propose a framework
    as an extension of parsing schemata (Sikkel, 1997). This not only allows us to
    take advantage of all the theoretical benefits of parsing schemata that have been
    described in Section 2.4 when defining and studying error-repair parsers, but
    also to use the compiler introduced in Chapter 3 to obtain efficient implementations
    of them, as will be described at the end of this chapter. Furthermore, we will
    show in Chapter 6 how the described formalism can be used to automatically transform
    standard parsers, like those used in


    # 5.2 Error repair in parsing schemata


    As mentioned above, error-repair parsers are also to analyse ungrammatical sentences
    by considering them as versions of valid sentences that have been modified by
    applying a number of errors to them. Thus, errors can be seen as transformations
    on strings: for instance, a typical error could be the omission of a word from
    a sentence. Here, we will take the more general approach of considering that errors
    are transformations of constituency parse trees. From this point of view, string
    transformations can be seen as a particular case of tree transformations where
    only terminal nodes can be altered.'
