  md: '# Parsing Schemata for Practical Text Analysis


    can be viewed as particular optimisations of more general, nondestructive algorithms.
    In this case, if we represent the actions of the parser as deduction steps abstracting
    from the deterministic implementation details, we obtain an interesting nondeterministic
    parser.


    Actions in Yamada and Matsumoto''s parser create links between two target nodes,
    which act as heads of neighbouring dependency trees. One of the actions creates
    a link where the left target node becomes a child of the right one, and the head
    of a tree located directly to the left of the target nodes becomes the new left
    target node. The other action is symmetric, performing the same operation with
    a right-to-left link. An $O(n^3)$ nondeterministic parser generalising this behaviour
    can be defined by using an item set:


    $\mathcal{I}_M^03 = \{[i, j] \mid 0 \le i \le j \le n+1\}$,


    where each item $[i, j]$ is defined as the item $[i, j, False, False]$ in $\mathcal{E}_{is}96$;
    and the deduction steps are as follows:


    | [i, j] | [i+1, i+1, i+1] |

    |---|---|

    | INITTER: | [i, i+1] |

    | R-LINK: [i, j] | [j, k] $a_j \to a_k$ |

    | | [i, k] |

    | L-LINK: [i, j] | [j, k] $a_j \to a_i$ |

    | | [i, k] |


    The set of final items is $\{[0, n+1]\}$. In order for this set to be well-defined,
    the grammar must have D-rules of the form $a_i \to a_{n+1}$, i.e., it must not
    allow the EOS marker to govern any words. If this is the case, it is trivial to
    see that every forest in an item of the form $[0, n+1]$ must contain a parse tree
    rooted at the BOS marker and yield $a_0 \dots a_n$.


    As can be seen from the schema, this algorithm requires less bookkeeping than
    any other of the parsers described here.


