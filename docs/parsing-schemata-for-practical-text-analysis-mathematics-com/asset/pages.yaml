    our system requires element classes to follow a simple contract, providing the
    services needed by the code generator. This basic contract comes from the idea
    that any element appearing in a schema can be classified into one of four basic
    types:


    +   * Simple Elements: Atomic, unstructured elements which can be instantiated
    or not in a given moment. When simple elements are instantiated, they take a single
    value from a set of possible values, which may be bounded or not. Values can be
    converted to indexing keys. Examples of simple elements are grammar symbols, integers,
    string positions, probabilities, the data in Earley items, etc.

    In order to define a new simple element class, the user must implement a SimpleElement
    interface, providing a method to obtain a Java code representation of the element''s
    value, if it has one. For example, the Java code representation of an element
    representing a string position and holding the value 1 is the string "StringPosition.fromValue(1)",
    which calls a static method returning an integer element with the value 1. In
    addition to this method, simple element classes should implement a method returning
    an indexing key, so that the corresponding elements can be used for item indexing.


    +   * Expression Elements: These elements denote expressions which take simple
    elements or other expressions as arguments. For, i+1 is an expression element
    representing two string positions. Feature structures and logic terms are also
    represented by this kind of element. When all simple elements in an expression
    are instantiated to concrete values, the expression will be treated as a simple
    element whose value is obtained by applying the operation it defines (for example,
    summation). For the code generator to be able to do this, a Java expression must
    be provided as part of the element type definition, so that, for example, sums
    of string positions appearing in schemata can be converted to Java integer sums
    in


    > ³Using a static method such as one instead of creating a new instance ("StringPosition(1)")
    is an optimisation. A parser may use millions of items, each of them with several
    elements, so all the predefined element classes are programmed in so that the
    generated code uses multiple references to the same instances instead of multiple
    instances. Apart from the memory saved with this optimisation, it must also be
    noted that item comparison is one of the main performance bottlenecks in generated
    parsers, and this optimisation allows such comparisons to be performed at the
    reference level, which is much faster than dereferencing the elements and comparing
    their values.'
