    By applying these principles


    If we consider the number of items generated in each case (Table 4.8) we obtain
    that the empirical space complexity with respect to string length is approximately
    $O(n^2)$ for all the algorithms, also far below the worst-case bounds $O(n^4)$
    and $O(n^5)$.


    With respect to the size of the grammar, we obtain a time complexity of approximately
    $O([\Sigma \cup \Lambda|^2)$ for all the algorithms. This matches the worst-case
    bound, which is $O([\Sigma \cup \Lambda]^2)$ due to the adjunction sets, which
    work with trees. In the case of our artificially generated grammars $G_k$, any
    auxiliary tree can adjoin any other, so it is logical that our times grow quadratically.
    Note, however, that real-life grammars such as the XTAG English grammar (XTAG
    Research Group, 2001) have relatively few nonterminals with respect to their elementary
    trees, so many pairs of trees are susceptible to adjunction and we cannot expect
    their behaviour to be much better than this.


    Space complexity with grammar size is approximately $O([\Sigma \cup \Lambda])$
    for all the algorithms. This is an expected result, since each generated item
    is associated with a given tree node.


    An overview of the empirical time and space complexities obtained from these experiments,
    compared to the corresponding theoretical worst-case complexities, is shown in
    Table 4.9.


    Practical applications of TAG in natural language processing usually fall within
    the range of values for $n$ and $k$ covered in our experiments (grammars with
    hundreds or a few thousands of trees are used to parse sentences of dozens of
    words). Within these ranges, both string length and grammar size take significant
    values and have an important influence on


