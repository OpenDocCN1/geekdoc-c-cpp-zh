  md: 'A given sentence belongs to the language defined by a grammar if a final item
    can be obtained from the initial items by some sequence of inferences using deduction
    steps. A generic deductive procedure as the one described by Shieber et al. (1995)
    can be used to try all the possible inferences in order to find final items, and
    the sequences of inferences that produce final items can be used to recover parse
    forests (Billot and Lang, 1989).


    Items in parsing schemata are formally defined as sets of partial constituency
    trees, members of the quotient set of some equivalence relation between trees.
    Additionally, items can be augmented with additional information. For example,
    probabilities can be included in items to describe statistical parsers, or feature
    structures to describe unification-based parsers.


    Parsing schemata are a useful theoretical tool to describe and study parsers for
    several reasons:


    +   * They provide a simple and declarative way to represent parsing algorithms.
    A representation of a parser by means of a schema is typically much compact than,
    for example, a pseudocode representation. Properties of parsers such as their
    time and space complexities are easier to infer from their schemata.

    •

    * They represent parsers in a uniform way, and allow us to find and prove relationships
    between different algorithms. The mathematical framework provided by parsing schemata
    can also be used to prove the correctness of parsers, and proofs of correctness
    can be transferred between some parsers using the formal relationships between
    them.

    * They are at a high abstraction level, so that they focus on the semantics of
    the parser (what the parser does) and abstract away from implementation details
    (the particular data and control structures used by the algorithm). Note that
    this means there is not a direct correspondence between parsing schemata and algorithms:
    a schema describes a parsing strategy that can sometimes be realised by different
    algorithms.


