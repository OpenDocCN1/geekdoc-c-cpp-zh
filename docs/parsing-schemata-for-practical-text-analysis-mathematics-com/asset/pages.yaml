    # 4.1 Parsing natural language with CFGs


    As a first example of the use of the compilation technique presented in Chapter
    3 to prototype parsing algorithms and test them with different natural language
    grammars, we have used the compiler to generate implementations of three popular
    parsing algorithms for CFGs: CYK (Kasam, 1965; Younger, 1967), Earley (Earley,
    1970) and Left-Corner (Rosenkranz and Lewis II, 1970).


    The schema we have used describe recognisers, and therefore their generated implementation
    only checks sentences for grammaticality by launching the deductive engine and
    testing for the presence of final items in the item set. However, these schemata
    can easily be modified to produce a parse forest as output (Billott and Lang,
    1989). If we want to use a probabilistic grammar to modify the schema so that
    it produces the most probable parse tree, this requires slight modifications of
    the deductive engine, since it should only store and use the item with the highest
    probability when several items differing only in their associated probabilities
    are found (Manning and Schütze, 1999).


    The three algorithms have been tested with three different natural language grammars:
    the English grammar from the Susanne corpus (Sampson, 1994); the Alvey grammar
    (Carroll, 1993) (which is also an English-language grammar); and the Delta grammar
    (Schoor and Belder, 1990), which generates a fragment of Dutch. The Alvey and
    Delta grammars are unification-based grammars, which were converted to plain'
