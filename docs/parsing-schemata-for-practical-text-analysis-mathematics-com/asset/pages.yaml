    # 7.6.3 MST parser (McDonald et al., 2005b)


    McDonald et al. (2005b) present a parser which is able to find the best

    non-projective analysis for a given sentence in $O(n^2)$ time under a strong

    independency assumption called an *edge-factored model*, i.e., a model where

    each dependency decision is assumed to be independent from all the-

    ers (McDonald and Satta, 2007). Despite the limitations of this model,

    this MST (maximum spanning tree) parser provide state-of-the-art per-\formance
    for projective and non-projective structures, and it is widely used

    today (Che et al., 2008; Surdeanu et al., 2009; Nivre and McDonald, 2008).


    The parser works by considering the weighted graph formed by all the\possible
    dependencies between pairs of input words, and applying a max-

    imanning tree algorithm to find a dependency tree covering all the

    words in the sentence and maximising the sum of weights.


    The efficient maximum spanning tree algorithm for directed graphs sug-

    gested by McDonald et al. (2005b) is not constructive, in the sense that it

    does not work by building structures and combining them into large stru-\cture
    until the solution. Instead, the algorithm works by using a

    greedy strategy to select a candidate set of edges for the spanning tree,

    which may contain cycles and therefore not form a legal dependency tree.

    A elimination procedure is then iteratively applied to this graph until

    cycles are eliminated and a legal dependency tree is obtained.


    The formalism of parsing schemata specifies parsers in a constructive

    way, by describing how partial solutions can be linked to form larger partial

    solutions. This means that the cycle elimination procedure in McDonald''s

    parser cannot be described by a schema. In other words, parsing schemata

    describe the logic of parsers while abstracting from control structures. In

    other parsers that we have described, the correctness of the algorithm can

    be guaranteed by describing the possible ways of combining intermediate

    results (items), and any control structure will do as long as it executes all

    the steps, and thus generates all the valid items. On the other

    hand, in this algorithm, specific control structures are needed to eliminate

    cycles in the generated graph, and therefore to guarantee correctness.


    However, this does not mean that we cannot write a parsing schema

    for McDonald''s parser. Even if control structures are essential for this'
