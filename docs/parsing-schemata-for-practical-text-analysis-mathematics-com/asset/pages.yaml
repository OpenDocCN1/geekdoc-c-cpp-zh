    A more efficient alternative for error-repair is of local error-repair parsers
    (McKenzie et al., 1995; Bertsch and Nederhof, 1999). These parsers work by processing
    the sentence without error repair until they successfully find a parse, or until
    they find a state where the parsing process cannot continue (unless we call detection
    point). Local error-repair parsers assume that the error is located at the detection
    point, and apply repair steps only at that point, modifying the string as necessary
    to continue parsing. As local error-repair parsers do not have to search the whole
    string for errors, they are much more efficient than global techniques. However,
    they do not guarantee that their results are optimal, since there are sentences
    where the minimal distance parses are reached by applying corrections before the
    detection point.


    An intermediate solution is that of regional error-repair parsers (Vilaras et
    al., 2001, 2002, 2004). These algorithms work as non-error-repair parsers until
    they reach a detection point, just like local algorithms, but then they apply
    error-repair techniques to a region of states surrounding the detection point.
    The particular criterion to choose, and optionally enlarge, the region can be
    enlarged until a satisfactory correction for the detected error is found. This
    allows, the region to be adjusted according to the desired tradeoff between efficiency
    and quality of the solutions. From this standpoint, local and global error-repair
    parsers can be considered as extreme cases of regional algorithms where this criterion
    is extremely aggressive or extremely conservative, respectively.


