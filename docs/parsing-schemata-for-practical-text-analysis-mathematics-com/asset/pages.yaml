  md: 'These studies have been complemented with experiments based on artificially-generated
    grammars, providing an evaluation of the influence of grammar size on the performance
    of TAG parsers, as well as a study of the practical overhead caused by using TAGs
    to parse context-free languages.


    The results show that both string length and grammar size are important factors
    in performance, and the interactions between them sometimes be hard to quantify.
    The influence of string length in practical cases is usually below the worst-case
    bounds between $O(n)$ and $O(n^2)$ in our tests for CFGs, and slightly below $O(n^3)$
    for TAGs. Grammar size becomes the dominating factor in large TAGs, making tree
    filtering techniques advisable in order to achieve faster execution times.


    Using TAGs to parse context-free languages causes an overhead both in constant
    factors and in computational complexity, increasing execution times by several
    orders of magnitude with respect to CFG parsing.


    The results presented in this chapter conclude Part 2 of this book, in which we
    have defined a practical tool for the development of natural language parsers
    using parsing schemata, and we have used it to study the empirical behaviour of
    parsers for CFGs and TAGs. This system can be used to generate an efficient implementation
    of any parser that can be described as a parsing schema, allowing parser developers
    to prototype algorithms by specifying them formally, without the need to implement
    them.


    In the following parts, we take a more theoretical approach, in order to extend
    the theory of parsing schemata to be able to describe two kinds of parsers of
    practical interest that were not contemplated in the original formalism by Sikkel
    (1997). In particular, Part 3 defines parsing schemata for error-repair parsers,
    and Part 4 for dependency-based parsers. In both cases, the definitions of the
    formalisms are followed by novel results derived from their application.'
