  md: "# Preliminaries\n\nlocated at a higher abstraction level than algorithms, and\
    \ it can be said that a parsing algorithm is a particular implementation of a\
    \ schema.\n\n# 2.3 The formalism of parsing schemata\n\nNow that the concept of\
    \ parsing schemata has been informally introduced, a precise theoretical formulation\
    \ will be given, which is a summary of the main concepts defined by Sikkel (1997).\n\
    \nFrom on now, apart from the notational conventions mentioned in Section 2.1,\
    \ we will use $\\mathbb{N}$ as a notation to refer to the set of natural numbers,\
    \ and $\\epsilon$ to denote an empty string. We will refer to the root of a tree\
    \ $\tau$ as $root(\tau)$, and to its yield (list of frontier nodes, ordered from\
    \ left to right) as $yield(\tau)$. We will use the notation $\\mathscr{P}(X)$\
    \ to refer to the power set of $X$.\n\n# 2.3.1 Deduction systems\n\n**Definition\
    \ 2.2.** Let $X$ be a set of entities, and $\\mathcal{H}$ a set of hypotheses.\
    \ A *deduction step* is a pair $(Y, x)$, with $x \\in X$, where $Y \\subseteq\
    \ \\mathcal{H} \\cup X$ is a finite set.\n\nIn a deduction step of the form $\\\
    {(y_1, \\dots, y_k\\}, x\\}$, the entities $y_1 \\dots y_k$ are called *antecedents*,\
    \ and $x$ is the *consequent*.\n\n# **Definition 2.3.** A deduction system $\\\
    mathbb{D}$ is a tuple $(X, \\mathcal{H}, D)$ where:\n\n+   * $X$ is a set of entities\
    \ called the domain of $\\mathbb{D}$\n* $\\mathcal{H}$ is a set of hypotheses.\n\
    * $D \\subseteq \\mathscr{P}(\\mathcal{H} \\cup X)$ is a finite set of deduction\
    \ steps.\n\n$\\mathbb{D} = (X, \\mathcal{H}, D)$ is a deduction system.\n\n**Definition\
    \ 2.4.** We define the *inference relation* $\\vdash \\subseteq \\mathscr{P}(\\\
    mathcal{H} \\cup X) \times X$ as: $Y \\vdash x$ if $(Y', x) \\in D$ for some $Y'\
    \ \\subseteq Y$.\n\nIt will also be useful to define the relations:\n\n+   * $Y\
    \ \\vdash^0 x$ if $x \\in Y$,\n* $Y \\vdash^{-1} x$ if $Y \\vdash x$,\n* $\\forall\
    \ n \\in \\mathbb{N}, Y \\vdash^{-n+1} x$ if $\\exists x_1 \\in X$ such that $(Y\
    \ \\vdash x_1 \\wedge (Y \\cup \\{x_1\\}) \\vdash^{-n} x)$,\n* $Y \\vdash^* x$\
    \ if $\\exists n \\in \\mathbb{N} (\\mathbb{N} \\cup \\{0\\})$ such that $Y \\\
    vdash^{-n} x$.\n\n**Definition 2.5.** We define the set of valid entities for\
    \ $\\mathbb{D} = (X, \\mathcal{H}, D)$ as $\\mathcal{V}(\\mathbb{D}) = \\{x \\\
    in X \\mid \\mathcal{H} \\vdash^* x\\}$."
