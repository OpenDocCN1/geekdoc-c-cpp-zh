    # 7.7.1 Sleator and Temperley’s LG parser


    The parser by Sleator and Temperley (1991) is a dynamic programming algorithm
    that builds linkages in a top-down fashion: a link between $a_i$ and $a_k$ is
    always added before links between $a_i$ and $a_j$ or between $a_j$ and $a_k$,
    if $i < j < k$. This contrasts with the method of dependency parsers seen in previous
    sections (Eisner, 1996; Eisner and Satta, 1999; Yamada and Matsumoto, 2003), which
    build dependency graphs from the bottom up.


    The item set for Sleator and Temperley’s parser is:


