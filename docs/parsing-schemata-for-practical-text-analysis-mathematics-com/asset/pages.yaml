    ungrammatical sentence is based on the analysis of the grammatical sentence that
    produced it under this error model.


    # 1.2.3 Parsing schemata


    The formalism of parsing schemata (Sikkel, 1997) is a theoretical framework that
    can be used to describe different parsers in a simple and uniform way. Parsing
    schemata are based on the idea of considering the parsing process as a deduction
    process, which proceeds by generating intermediate results called items. This
    is similar to the view of parsing as deduction by Shie et al. (1995), with the
    difference that Sikkel''s framework formally defines items and related concepts,
    providing a mathematical basis that can be used to reason about formal properties
    of parsers. In particular, items in parsing schema are sets of partial constituency
    trees that are licensed by the rules of a given grammar. Note that this means
    parsing schemata are only applicable to grammar-based constituency parsers, and
    not to data-driven or dependency-based parsers. In fact, Sikkel''s examples were
    focused in CFG parsers only, but parsing schemata have subsequently been used
    to describe TAG parsers as well (Alonso et al., 1999, 2004).


    In order to describe a parser by means of a parsing schema, we need to provide
    the following:


    +   * A set of initial items, or hypotheses, which are obtained directly from
    each input sentence.

    * A set of inference rules called deduction steps, that can be used to derive
    new items from existing ones. A parsing schema specifies these inference rules
    as a set, but makes no claim about the order in which they are to be executed.
    The set of deduction steps in a schema is given as a function of the rules in
    our grammar, so that the same parsing strategy will produce different results
    with different grammars, as expected.

    * A set of final items, which are items that contain a full parse tree for the
    input or allow to obtain it.'
