    # 2.2 Parsing algorithms and schemata


    The process of parsing is an important step in natural language analysis, as it
    provides us with hierarchical representation of sentences that we can extract
    meaning from them. This has motivated the development of various parsing algorithms
    in recent decades. As an example, two of the most widely used parsing algorithms
    for CFGs are the CYK algorithm (Kasani, 1965; Younger, 1967) and Early''s algorithm
    (Earley, 1970).


