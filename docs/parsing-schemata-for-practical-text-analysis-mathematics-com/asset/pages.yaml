  md: '# Chapter 1


    # # Introduction


    This book provides several theoretical and practical tools that extend the applicability
    of Sikkel''s theory of parsing schemata (Sikkel, 1997) in several different directions.


    First, a compilation technique is defined that can be used to obtain efficient
    implementations of parsers automatically from their corresponding schemata. This
    makes it possible to use parsing schemata to prototype and test parsing algorithms,
    without the need of manually converting the formal representation to an efficient
    implementation in a programming language.


    Second, the range of parsing algorithms that can be defined by means of schemata
    is extended with the definition of new variants of the formalism that can deal
    with error-repair parsers and dependency-based parsers.


    Apart from these tools themselves, the book also introduces several results that
    have been obtained by using them. The compilation technique is used to obtain
    implementations of different parsers for context-free grammars and tree-adjoining
    grammars, and perform an empirical analysis of their behaviour with real-sized
    grammars. The extension of parsing schemata for error-repair parsing is used to
    define a transformation that can be employed to automatically add error-repair
    capabilities to parsers that do not have them. Finally, the extension of parsing
    schemata for dependency parsing is used to find formal relationships between several
    well-known dependency parsers, as well as to define novel algorithms for mildly
    non-projective dependency structures.


    # ##1.1 Motivation


    Parsing schemata, introduced by Sikkel (1997), are high-level, declarative descriptions
    of parsing algorithms. A parsing schemata describes a set of'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Parsing Schemata for Practical Text Analysis


    intermediate results that can be obtained by a parser and a set of operations
    that it can use to generate new results from existing ones, but it imposes no
    constraints on the order in which to execute the operations or the data structures
    in which to store the results. We could say that schemata are descriptions of
    what to do, but they abstract away from how to do it.


    This high abstraction level makes parsing schema a useful tool to describe, analyse
    and compare different parsing algorithms: schemata provide simple and uniform
    descriptions of the parsers, and allow us to focus on their logic without worrying
    about implementation details. However, if we wished to apply the schema formalism
    to practical parsing of natural language, we would find several problems, and
    is it these problems that are addressed in this monograph:


    +   * First of all, the high abstraction level of parsing schemata, which makes
    them useful from a theoretical standpoint, also rules out the possibility of executing
    them on a computer. If we wish to test an algorithm that we have defined by means
    of a schema, we must first implement it in a programming language, filling in
    the control structures and implementation details that were omitted in the schema.
    Therefore, schemata are useful as a formal framework for defining parsers and
    analysing their formal properties but not for prototyping and studying their empirical
    behaviour.

    * Parsing schemata can be used to represent algorithms that analyse input sentences
    with respect to a given grammar, so that they only produce a complete analysis
    of an input sentence if it is grammatical. However, it is common in practical
    applications to find sentences that do not conform to the constraints of our grammar,
    since it is not possible to build a grammar that will recognise every structure
    that can appear in a natural language. Therefore, it is interesting to be able
    to define robust parsers that are able to obtain a complete, albeit approximate,
    analysis for ungrammatical sentences. The formalism of Sikkel (1997) does not
    allow the relaxation of grammar constraints in define this kind of parsers, since
    it is based on the assumption that all the possible intermediate results are parts
    of grammatically valid trees.

    * The formalism of Sikkel (1997) is formally linked to constituency-based parsing,
    in which the structure of sentences is expressed by dividing them in blocks (constituents)
    which are, in turn, divided into smaller constituents. However, in recent years,
    there has been'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Introduction


    a surge of interest in dependency-based parsers, in which the structure of a sentence
    is represented as a set of binary links (dependencies) between its words. Although
    many current state-of-the-art parsers are based on this assumption, dependency
    parsers cannot be represented by the formalism of Sikkel (1997).


    The purpose and contribution of this monograph is to solve these problems, by
    defining a set of extensions and tools to make parsing schemata more useful in
    practice. In addition to this, research results obtained by using these extensions
