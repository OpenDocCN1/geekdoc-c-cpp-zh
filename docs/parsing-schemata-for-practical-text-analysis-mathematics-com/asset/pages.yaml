    # 8.3.2.2 Order annotations


    In the completeness proof for $WG_1$, we will use the concept of order annotations
    (Kuhlmann, 2007; Kullmann and Möhl, 2007). Here we will outline the concept and
    some properties relevant to the proof. A more detailed discussion can be found
    in Kullmann (2007).


    Order annotations are strings that encode the precedence relation between the
    nodes of a dependency tree: if we take a dependency tree with its words unordered
    and decorate each node with an order annotation, we will obtain a particular ordering
    for the words. Order annotations are related to projectivity, gap degree and well-nestedness.
    A set of order annotations exist that, when applied to nodes in any structure,
    will result in an ordering of the nodes that satisfies projectivity, and the same
    can be said about the properties of well-nestedness and having gap degree bounded
    by a given constant $k$. In addition to this, order annotations are closely related
    to the way in which parsers defined in this chapter construct subtrees with their
    COMBINE steps, and will make them useful for proving their correctness.


    Let $T$ be a dependency structure for a string $a_1 \dots a_n$, and $a_k$ a node
    in $T$. Let $a_{d1} \dots a_{dp}$ be the direct dependents of $a_k$ in $T$, ordered
    by'
