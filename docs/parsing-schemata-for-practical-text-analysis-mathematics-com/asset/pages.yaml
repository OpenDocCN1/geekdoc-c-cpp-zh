  md: '# # Chapter 3


    # # A compiler for parsing schemata


    In this chapter we present a compiler, described by Gómez-Rodríguez et al. (2009c),
    which can be used to automatically obtain efficient Java implementations of parsing
    algorithms from formal specifications expressed as parsing schemata. The system
    performs an analysis of the inference rules in the input schemata in order to
    determine the best data structures and indexes to use, and ensure that the generated
    implementations are efficient. The system described is general enough to be able
    to handle all kinds of schemata for different grammar formalisms, such as CFGs
    and TAGs, and it provides an extensibility mechanism, allowing the user to define
    custom notational elements. This compiler has proven very useful for analysing,
    prototyping and comparing natural language parsers in real domains, as will be
    seen in the empirical studies provided in the following chapters.


    # ## 3.1 Motivation and goals


    Parsing schemata are located at a higher abstraction level than algorithms. As
    seen in the previous chapter, a schema specifies a set of steps that must be executed
    and a set of intermediate results that must be obtained when parsing sentences,
    but it makes no claim about the order in which to execute the steps or the data
    structures to use for storing the results.


    Their abstraction of low-level details makes parsing schemata very useful, allowing
    us to define parsers in a simple and straightforward way. Comparing parsers, or
    considering aspects such as their correctness and completeness or their computational
    complexity, also becomes easier if we think in terms of schemata. However, when
    we want to test a parser in practice by running it on a computer, we need to implement
    it in a programming language, so we have to abandon the high abstraction level
    and worry about'
