    the “keep-variables” operation to remove the information that is not needed in
    the consequent item.


    +   - In algorithms, such as the CYK-based algorithm for TAG, a single deduction
    step deals with several different elementary tree nodes that do not collapse into
    one in the final parse tree. In this case, several “keep variables” operations
    must be performed on each step execution, for each of these nodes. If we just
    unified the information on all the nodes and called “keep variables” at the end,
    we could propagate information incorrectly.


    +   - In Earley-type algorithms, we must make a decision about how steps handle
    feature structures. Two options are possible: one is propagating the feature structure
    in the antecedent item to the consequent, and the other is discarding the feature
    structure and generating a whose associated feature structure is empty. The first
    option has the advantage that violations of unification constraints are detected
    earlier, avoiding the generation of some items. However, in scenarios where a
    predictor is applied to several items differing only in their associated feature
    structures, this approach generates different items while the discarding approach
    collapses them into a single consequent item. Moreover, the propagating approach
    favours the appearance of items with more complex feature structures, making unification
    operations slower. In practice, for the XTAG grammar we have found that these
    drawbacks of propagating the structures overcome the advantages, especially in
    complex sentences, where the discarding approach performs much better. Therefore,
    in our comparison of different algorithms we will use this variant, where unification
    constraints within a tree involving a node are not checked until the node is completed
    by a Completer step.


    # 4.4.3 Tree filtering


    The full XTAG English grammar contains thousands of elementary trees, so parsing
    performance is not good if we use the whole grammar to parse each sentence. Tree
    selection filters (Schabes and Joshi, 1991) are used to select a subset of the
    grammar, discarding the trees which are known not to be useful given the words
    in the input sentence.'
