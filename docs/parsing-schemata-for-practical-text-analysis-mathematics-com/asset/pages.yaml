  md: '# Practical complexity of constituency parsers


    although it was convenient to use them in our comparison. This can lead to us
    wonder how the overhead is caused by using the TAG formalism (Gómez-Rodríguez
    et al., 2006c).


    Given the regular language $L_k = a_0(a_1 \mid a_2 \mid \dots \mid a_k)^*$, a
    CFG that parses it is $G''_k = (N, \Sigma, P, S)$, and


    ```

    $N = \{S \to a_0\}\cup\{S \to Sa_i \mid 1 \le i \le k\};$

    ```


    This grammar minimises the number of rules needed to parse $L_k$ (k+1 rules),
    but has left recursion. If we want to eliminate recursion, we can use the grammar
    $G''''_k = (N, \Sigma, P, S)$ with eliminate:


    ```

    $N = \{S \to A\};

    ```


    ```

    $P = \{S \to a_0A\}\cup\{A \to a_iA \mid 1 \le i \le k\}\cup\{A \to \epsilon\};$

    ```


    which has k+2 production rules. The number of items generated by the Earley algorithm
    for CFGs when parsing a sentence of length $n$ from the language $L_k$ by using
    the grammar $G''_k$ is $(k+2)n$. In the case of $G''''_k$, the same algorithm
    generates $(k+4)n + \frac{n(n-1)}{2} + 1$ items. In both cases the amount of items
    generated is linear with respect to grammar size, as with TAG parsers. With respect
    to string length, the amount of items is $O(n)$ for $G''_k$ and $O(n^2)$ for $G''''_k$.
    Note, that the constant factors behind complexity are much greater when working
    with $G''_k$, and this reflects on the actual number of items generated (for example,
    the Earley algorithm generates 16,833 items when working with $G''''_4$ and a
    string of length $n=128$, while the TAG variant of Earley without the VPP generates
    1,152,833 items, as seen in Table 4.8).


    The obtained times for both algorithms appear in Table 4.10. From this we can
    deduce the empirical time complexity is linear with respect to string length and
    quadratic with respect to grammar size in the case of $G''_k$; and quadratic with
    respect to string length and linear with respect to grammar size in the case of
    $G''''_k$. This example shows that, when parsing a context-free language using
    a TAG, we suffer an overhead in both constant factors (more complex items, more
    deduction steps, etc.) and in asymptotic behaviour (summarised in Table 4.11),
    actual execution times can be several orders of magnitude larger. Note that the
    way grammars are designed also has an influence, but our tree adjoining grammars
    $G_k$ are the simplest TAG able to parse the languages $L_k$ by using adjunction
    (an alternative would be to write a grammar using the substitution operation to
    combine trees).'
