    these algorithms as deduction systems, we use the notion of $D-rules$

    (Covington, 1990). D-rules are simple rules of the form $a \rightarrow b$, which
    express that word $b$ can have $a$ as a dependent. Deduction steps in non-grammar-based
    parsers can be tied to the D-rules associated with the links they create. In this
    way, we obtain a representation of the semantics of these parsing strategies that
    is independent of the particular model used to take the decisions associated with
    each D-rule.


    +   The fundamental structures in dependency parsing are *dependency graphs*.
    Therefore, as items for constituency parsers are defined as sets of partial constituency
    trees, it is tempting to define them for dependency parsers as sets of partial
    dependency graphs. However, predictive grammar-based algorithms such as those
    of Lombardo and Lesmo (1996) and Kahane et al. (1998) have operations that postpone
    rules cannot be defined in terms of dependency graphs, since they do not do any
    modifications to the graph. In order to make the formalism general enough to include
    these parsers, we define items in terms of sets of partial dependency *trees*
    as shown in Figure 7.1. Note that a dependency graph can always be extracted from
