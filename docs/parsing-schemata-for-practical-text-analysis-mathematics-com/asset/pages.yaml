  md: 'into the underlying factors that influence performance. As the natural language
    grammars that we have used as fixed, we cannot use them to evaluate the influence
    of grammar-related parameters (such as grammar size) in performance.


    When studying the complexity of parsing algorithms in theory, it is common to
    focus mainly on complexity with respect to sentence length. However, other factors
    such as grammar size can have a significant influence on the practical performance
    of parsers. In the particular case of TAG parsers, both the results reported by
    Sarkar (2000) and the experiments in the previous section suggest that the main
    factor affecting performance in practical settings is not sentence length, but
    grammar size. This is especially relevant in the case of LTAG parsing, where the
    effective grammar size for a sentence depends on the lexical trees selected by
    each of its lexical elements.


    In this section, we make a detailed analysis of the influence of both sentence
    length and grammar size in the empirical performance of several TAG parsers (Gómez-Rodríguez
    et al., 2006). As in previous comparisons, the system described in Chapter 3 is
    used to generate implementations of the parsers, but in this case the algorithms
    are compared on artificially generated grammars and sentences.


    The advantage of using artificially generated grammars is that we can easily see
    the influence of grammar size on performance. If we test the algorithms on a real-life
    grammar, as we do in Section 4.5, we cannot get a very precise idea of how the
    grammar size affects performance, since we have no control over this. On the other
    hand, by using artificial grammars, we are able to adjust both string length and
    grammar size at all in the experiments, making it possible to isolate and analyse
    the influence of each of these factors.


    The algorithms used in this comparison are the same TAG parsers that were used
    in Section 4.5: the CYK-algorithm by Vijay-Shanker and Joshi (1985), Earley-like
    parsers with and without the VPP (Alonso et al., 1999; Schabes, 1994), and the
    algorithm described by Nederhof (1999).


    For the grammars, we will use a grammar size $k$ for each value of $k$. To define
    these grammars, we will use bracketed notation to write elementary trees, and
    $*$ to mark the foot node of auxiliary trees. Given an integer $k>0$, we define
    the TAG $G_k$ to be the grammar $G_k = (N, \Sigma, \mathbf{I}, \mathbf{A}, S)$
    where:'
