  md: '# 7.5 Proving the correctness of dependency parsers


    Another useful feature of the parsing sche framework is that it provides a formal
    way to prove the correctness of a parser (see Section 2.3.3) which we can use
    to prove that our parsers are correct. Furthermore, relations between schemata
    can be used to derive the correctness of a schema from that of related ones. In
    this section, we will show how we can prove that the algorithms by Yamada and
    Matsumoto (2003) and Eisner and Satta (1999) are correct, and we use fact to prove
    the correctness of the one by Eisner (1996).


    # 7.5.1 Eisner and Satta (1999) is correct


    In order to prove the correctness of a parser, we must prove its soundness and
    completeness (see Section 2.3.3). Soundness is easy to verify in this case, since
    we only need to check that every individual deduction step in the parser infers
    a correct consequent when applied to correct antecedents (i.e., in this case,
    that steps generate non-empty items that conform to the definition in Section
    7.3.3). This is shown by checking that, given two antecedents of a deduction step
    that contain a tree licensed by a set of D-rules G, the consequent of the step
    also contains such a tree. This can be seen by building the tree for the consequent
    from the trees corresponding to the antecedents, which is done by a graph union
    operation (in the case of COMBINER steps) or by linking the heads of both trees
    with a dependency licensed by G (in the case of LINK steps).


    The difficulty is proving completeness, for which we need to prove that all final
    items are valid (i.e., can be inferred from the schema). To show this, we will
    prove the stronger result that all correct items are valid.


    We will show this by strong induction on the length of items, where the length
    of an item $\iota = [i, k, h]$ is defined as $length(\iota) = k - i + 1$. Correct
    items of length 1 are the hypotes of the schema (of the form $[i, i, i]$) which
    are trivially valid. We then prove that, if all items of length $m$ are valid
    for $1 \le m < l$, then items of length $l$ are also valid.


    Let $[i, k, i]$ be an item of length $l$ (thus, $l = k - i + 1$). If this item
    is correct, then it contains a grounded dependency tree $T$ such that $yield(T)
    = a_i \dots a_k$ and $head(t) = a_i$.


    By construction, the root of $T$ is licensed $a_i$. Let $a_j$ be the rightmost
    daughter of $a_i$ in $T$. Since $T$ is projective, we know that the yield of $a_j$
    must be of the form $a_i \dots a_k$, where $i < l \le j$. If $l < j$, then $a_l$
    is the'
