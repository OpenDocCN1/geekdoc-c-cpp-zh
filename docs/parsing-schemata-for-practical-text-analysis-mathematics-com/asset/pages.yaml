    the inverse relations to item and step refinement: in item contraction, multiple
    items in $P_1$ are collapsed into a single one in $P_2$; and in step contraction,
    a sequence of steps in $P_1$ is replaced by a single one in $P_2$. All these filtering
    relations are extended to reflexive and transitive.


