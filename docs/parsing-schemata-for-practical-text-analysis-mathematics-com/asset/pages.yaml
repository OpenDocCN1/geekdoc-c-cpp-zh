    # 7.8 Discussion


    The parsing schemata formalism by Sikkel (1997) has proved very useful for describing,
    analysing and prototyping parsing algorithms, but it is limited to constituency-based
    parsers. In this chapter, we have defined a variant of the formalism that can
    be used to describe dependency parsers.¹⁰ These dependency parsing schemata are
    general enough to describe both grammar-driven and data-driven dependency parsers,
    be projective or non-projective. Like constituency parsing schemata, they can
    be used to prove the correctness of parsers, relations between them or generate
    implementations of them with a system like the one described in Chapter 3. Thus,
    this variant of the formalism makes all the advantages of parsing schemata applicable
    to the family of dependency parsers, which have been used extensively for practical
    parsing in recent years.


    To demonstrate the theoretical uses of dependency parsing schemata, we have used
    them to describe a wide range of projective and non-projective parsers from the
    literature. Additionally, we have clarified relations between parsers which were
    originally described differently. For example, while Eisner (1996) presented his
    algorithm as a dynamic programming algorithm which combines spans into larger
    spans, the algorithm by Yamada and Matsumoto (2003) works by sequentially executing
    parsing actions that move a focus point in one position to the left or right,
    (possibly) creating a dependency link. However, in the parsing schemata for these
    algorithms we can see (and formally prove) that they are related: one is a refinement
    of


    Parsing schemata are also a formal tool that can be used to prove the correctness
    of parsers. The relationships between dependency parsers can be exploited to derive
    properties of a parser from those of others, as we have seen in several examples.


    Finally, we have seen how the general principles used to extend parsing schemata
    to the realm of dependency parsing can also be applied


    > ¹⁰ An alternative framework that formally describes some dependency parsers
    is that of transition systems (McDonald Nivre, 2007). This model is based on parser
    configurations, and transitions, and has no clear relationship with the approach
    described here.'
