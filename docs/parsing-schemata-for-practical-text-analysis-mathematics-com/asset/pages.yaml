    $F''Lyon = \{[S \to \gamma, 0, n, e]\}\nCF''_{Lyon} = \{t \mid S \to \gamma, 0,
    n, e] \mid D(t, e) \in i\}\n$t$ is a marked tree for $a_1 \dots a_n$

