  md: "# 5.3.1.2 Completeness\n\nProving completeness for this schema is proving that,\
    \ given an input string, when correct items are valid, they can be inferred from\
    \ the hypotheses. Therefore, given a string $a_1 \\dots a_n$, we have to prove\
    \ that every item containing an approximate tree $(t, e)$ such that $t$ is a marked\
    \ parse tree for $a_1 \\dots a_n$ can be inferred from the hypotheses.\n\nSince\
    \ final items in this schema are always of the form $[S \rightarrow \\alpha, \\\
    bullet, 0, e]$, this is equivalent to proving the following proposition:\n\n**Proposition\
    \ 5.1.** *Let $G = (N, \\Sigma, P, S)$ be a CFG, and $a_1 \\dots a_n \\in \\Sigma^*$\
    \ a string. Every correct item of the form $[S \rightarrow \\alpha, 0, n, e]$\
    \ is valid in the instantiated parsing system $(\\mathcal{T}'_{Lyon}, K(a_1 \\\
    dots a_n), D)$ obtained from applying $S_{Lyon}$ to $G$ and $a_1 \\dots a_n$.*\n\
    \nThis proposition is proved by induction on the distance $e$:\n\n**Base case\
    \ ($e=0$):** Items in this schema's item distance 0 can be mapped from a standard\
    \ Earley parser by the function $f : \\{[A \\rightarrow \\alpha B, \\bullet, i,\
    \ j, 0] \\in \\mathcal{T}'_{Lyon}\\} \\rightarrow \\mathcal{I}_{Earley}$ that\
    \ maps $\\iota = [A \\rightarrow \\alpha B\\bullet, i, j, 0]$ to $f(\\iota) =\
    \ [A \\rightarrow \\alpha B\\bullet, i, j]$. This mapping is trivially bijective,\
    \ and it is easy to see that deductions are preserved, i.e., the deduction $t_1t_2\
    \ = tc$ can be made by a COMPLETER in Lyon's parser if only the deduction $f(t_1)f(t_2)\
    \ = f(tc)$ can be made by a COMPLETER in Earley's parser. Since any correct item\
    \ of the form $[S \\rightarrow \\alpha, 0, n, e]$ in the error-repair parser is\
    \ $f^{-1}(\\kappa)$ for some correct item $\\kappa = [S \\rightarrow \\alpha,\
    \ \\bullet, 0, n]$ in the Earley parser, and we know that the Earley parser is\
    \ complete (Sikkel, 1998), it follows that all final items of the form $[S \\\
    rightarrow \\alpha, 0, n, ]$ are valid in Lyon's parser.\n\n**Induction step:**\
    \ Supposing that Proposition 5.1 holds for a distance value of $e+1$.\n\nLet $[S\
    \ \\rightarrow \\alpha, \\bullet, 0, n, e+1]$ be a correct item for the string\
    \ $a_1 \\dots a_n$. We will prove that this item is valid in the deduction system\
    \ $(\\mathcal{T}'_{Lyon}, K(a_1 \\dots a_n), D)$.\n\nAs this item is correct for\
    \ the string $a_1 \\dots a_n$, we know that it contains an approximate tree of\
    \ the form $(t, e+1)$ where $t$ is a tree rooted at $S$ and with $yield(t) = a_1\
    \ \\dots a_n$. By definition there must exist a tree $u \\in Trees(G)$ such that\
    \ $\\hat{d}(t, u) = e+1$, or equivalently, $t \\in Trans_{e+1}(u)$."
