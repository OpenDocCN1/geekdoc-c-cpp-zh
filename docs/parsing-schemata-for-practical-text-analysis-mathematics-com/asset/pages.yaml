    - Cycles: the sets of links representing the structure of sentences in LG may
    contain cycles, contrary to dependency structures.


    In particular, LG is a grammar-based formalism in which a grammar G consists of
    a set of words, of which is associated with a set of linking requirements.


    Given an LG, a set of labelled links between the words of a sentence $a_1 \dots
    a_n$ is said to be a linkage for that sentence if it satisfies the following conditions:


    +   - Planarity: the links do not cross drawn above the words.

    - Connectivity: the undirected graph defined by links is connected.

    - Satisfaction: the links satisfying the linking requirements of all the words
    in the input.


    An input sentence is considered grammatical with respect to an LG G if it is possible
    to build a linkage for the sentence with the grammar G.


    The linking requirements of a word are a set of rules that specify the labels
    of the links that can be established between given word and other words in the
    sentence located to its left or its right. Linking requirements can include constraints
    on the order of the links. For example, a requirement can specify that a word
    $w$ can be linked to two words located to its left in such a way that the link
    to the farthest (leftmost) word has a particular label $L_2$ and the link to the
    closest word has a label $L_1$.


