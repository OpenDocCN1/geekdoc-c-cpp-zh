    # 6.2 Formal description of the error-repair transformation


    By applying these simple transformation rules to a prediction-completion parsing
    schema, we obtain an error-repair parsing schema which shares its underlying semantics.
    As the transformation rules are totally syntactic, they can be applied automatically,
    so that a system based on parsing schemata, such as the one described in Chapter
    3, can generate implementations of error-repair parsers from non-error-repair
    parsing schemata. However, in order for the transformation to be useful we must
    ensure that the error-repair parsers obtained from it are correct.


    In order to do this we first need to define some concepts that will take us to
    a formal definition of the transformation that we have informally described in
    the previous section.


    # 6.2.1 Some properties of trees and items


