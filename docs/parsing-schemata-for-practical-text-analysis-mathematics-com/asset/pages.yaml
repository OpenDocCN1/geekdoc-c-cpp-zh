    # 5.6 Discussion


    In this chapter we have introduced error-repair parsing schemata, and a formal
    framework that extends Sikkel''s theory of parsing schemata, and can be used to
    easily define, analyse and compare error-repair parsers. With this new theoretical
    tool, all the advantages of parsing schemata that we have seen in the previous
    chapters are extended to error-repair parsers, including the possibility of implementing
    them with the system described in Chapter 3. Furthermore, as parsing schema captures
    the logic of the algorithms while abstracting away control structures, the same
    errorrepair parsing schema can be implemented with different repair strategies
    (global, regional or local) depending on the control structures that we use to
    handle the execution of its deduction steps.


    As an example, we have used error-repair parsing schema to describe the Early-based
    error-repair algorithm first described by Lyon (1974), to prove its correctness,
    to generate a deductive implementation of the original algorithm, and to obtain
    a faster, regional error-repair parser based on the same parsing schema. We have
    also performed an empirical comparison to measure the efficiency gained by applying
    a regional error-repair strategy with respect to global repair.


    The methods that we have used for obtaining these results are generic and can
    be applied to other parsers. In the next chapter, we will present a transformation
    that can be used to convert standard parsing schemata satisfying certain conditions
    to correct error-repair parsing schemata. With this transformation, we can automatically
    obtain correct global and regional error-repair parsers from standard parsing
    schemata such as those for the CYK or Left-Corner parsers that we have used in
    Chapter 4.'
