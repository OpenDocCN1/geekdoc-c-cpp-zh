  md: '# Chapter 9


    # Conclusions


    The main goal of the research presented in this book was to provide theoretical
    and practical extensions to the parsing schemata framework by Sikkel (1997), broadening
    its applicability to practical parsing and using it to solve problems in research
    areas currently being addressed by the computational linguistics community. A
    variety of approaches and methods were used to achieve this goal, including software
    engineering (Chapter 3), empirical analyses (Chapters 4, 5) and formal approaches
    (Chapters 5, 6, 7, 8).


    In Part 2, we addressed a limitation when using the formal framework of parsing
    schemata to design parsing algorithms for practical settings. Although their high
    level of abstraction makes the user to reason about formal properties of parsers,
    they do not suffice when it is necessary to evaluate parsers in practice. In this
    case, a working implementation of the parsers must be obtained, and the efficiency
    of such an implementation depends on decisions about data and control structures
    that are not represented in the schema. Our approach to this problem was to design
    and implement a compiler to make these decisions automatically, by performing
    a static analysis of parsing schemata in order to determine a set of suitable
    indexes on items that, when combined with a generic control structure, ensures
    that the resulting implementation will achieve a computational complexity comparable
    to that of ad-hoc implementations. The interest of this system is that it allows
    a parser developer to automatically obtain working prototypes of parsing algorithms,
    efficient enough to be used with real-sized natural language grammars, from formal
    specifications of the parsers in the form of schemata. The system works with schemata
    for several grammar formalisms, and more can be supported through an extensibility
    mechanism that allows the user to define custom notational elements.'
  merge: -1
  pgno: 245
- img_proc: true
  md: 'After presenting this parsing schema compiler, we demonstrated its use by applying
    it to schemata describing several well-known constituency parsers, both for context-free
    grammars (CFG) and tree-adjoining grammars (TAG), and performing empirical studies
    to compare their performance. In a first study, we used the system to generate
    implementations of three popular parsers for CFG and used them to analyse sentences
    with three natural language grammars taken from real-life corpora. We then did
    an experiment with TAG, in which we compiled schema describing four different
    well-known TAG parsers from the literature, and compared their implementations
    by parsing sentences with the XTAG English Grammar. To the best of our knowledge,
    this was the first comparison of parsing algorithms performed with real-sized
    grammars rather than “toy” grammars. From the performance results obtained from
    the experiments, we observed that the best choice of a parsing algorithm for a
    particular application strongly depends on the nature of the sentences to be parsed
    and the grammar to be used, so it is useful to use a tool like this compiler to
    quickly prototype and test several parsers in order to find the best one for a
    particular application.


    Apart from these studies with real natural language grammars, we also performed
    a comparison of TAG and CFG algorithms on artificiallygenerated grammars. This
    study provided further insight into the influence of factors such as string length
    and grammar size in performance, since using artificial grammars allowed us to
    vary them freely. Among our conclusions, we observed that both factors can be
    influential on final parsing performance, and grammar size becomes particularly
    important when using real-sized TAG.


    In Part 3 of the book, we presented error-repair parsing schema, an extension
    of the parsing schema formalism which can be used to define error-repair parsers
    that can provide analyses for ungrammatical sentences. Since the original formulation
    of parsing schema was based on the assumption that all the intermediate results
    generated by parsers must conform to the rules of a given grammar, it was necessary
    to redefine the underlying concepts behind schema in order to obtain a variant
    to support these robust parsers. The obtained formalism extends to error-repair
    parsers all of the advantages that regular parsing schema provide for regular
    parsers. Not only can we describe, analyse and compare error-repair parsers and
    study their formal properties, but we can also obtain implementations of them
    with the compiler presented in Part 2. These implementations can be'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# Conclusions


    configured to use global, regional or local error-repair strategies by changing
    the control structures used to schedule inferences.


    As an example of these applications of the formalism, we used it to describe a
    well-known error-repair parser from the literature, to prove its correctness,
    and to generate implementations of it with global and regional error-repair strategies,
    measuring their performance.


    Additionally, we defined a general transformation technique that can be used to
    add error-repair capabilities to parsing algorithms that do not have them. This
    method transforms correct parsing schema into certain conditions. Since the transformation
    is totally systematic, it can be applied automatically as a preprocessing step
    before compiling a schema, so that the compiler defined can be used to obtain
    working implementations of error-repair parsers from standard parsing schemata
    without error-repair functionality.


    Part 4 of the book extended parsing schema in a different direction, by defining
    a variant of the formalism that can represent dependency-based parsers. This a
    redefinition of the core concepts before parsing schema theory, which was originally
    limited to constituency parsers. This extension, called dependency parsing schema,
    is attractive the increasing interest that dependency-based parsers have received
    in recent years, since it provides a common formal framework that can be used
    to describe, relate and prove the correctness of a wide range of such parsers,
    as well as obtaining working implementations of them with the compiler described
    earlier.


    We demonstrated the wide variety of dependency parsing schema algorithms by using
    them from the literature, including projective and non-projective, grammar-driven
    and data-driven, graph-based and transition-based parsers. We used the formal
    tools provided by the formalism to prove the correctness of some of the parsers,
    as well as to establish formal relations between parsers that had been described
    very differently in their original formulations. We also showed how the same ideas
    that led to the generalisation of schema to dependency parsing could be adapted
    to other formalisms, by defining schema for Link Grammar (LG) parsers and obtaining
    LG variants of some well-known dependency parsers.


    Finally, we used the dependency parsing schema formalism to solve the problem
    of efficiently parsing mildly non-projective dependency structures. This is a
    relevant problem for practical parsing, since these sets of structures strike
    a good balance between coverage and efficiency, as they cover a vast'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'majority of the structures observed in treebanks while being polynomially parsable.


    We defined an algorithm that can parse any well-nested dependency structure with
    gap degree bounded by a constant $k$ with time complexity $O(n^{2k+5})$ (with
    $n$ being the length of the input), same achieved by the existing parsers for
    constituency formalisms of similar generative power. Additionally, we defined
    a wider set of structures that we can call illnested for a given gap degree $k$,
    and a variant of the previous parser that can parse them in time $O(n^{3k+4})$.
    The practical relevance of this set of structures can be seen from several dependency
    treebanks, showing that all the sentences contained in them are in this set, and
    thus they are parsable with this algorithm.


    # 9.1 Future work


    The results presented in this book open up several interesting directions for
    future work:


    +   * While the parsing schema compiler introduced in Chapter 3 generates efficient
    implementations of parsers in terms of computational complexity, it should be
    possible to optimise it in order to obtain faster absolute runtimes. For instance,
    a possible aspect that allows for further optimisation is the order in which indices
    are considered when the generated implementations check for items conforming to
    a given specification. Slight improvements in runtime are obtained if the most
    used indices are considered first, since this minimises the amount of false “if”
    conditions that have to be checked. Thus, it should be possible to improve performance
    by gathering data in runtime and changing this order dynamically, prioritising
    the indexes that get used most frequently.

    * Although error-repair parsing schema described in Chapter 5 is defined for any
    class of constituency grammars, the practical examples that we explored were context-free
    grammar parsers. An interesting line of work would be to apply this formalism
    to tree adjoining grammars, obtaining and implementing TAG parsers able to behave
    robustly in the presence of ungrammatical sentences. The transformation presented
    in Chapter 6 could be used to systematically obtain schemata for these parsers
    from existing TAG parsing schemata,'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'after extending the definition of yield union step sets to support the discontinuous
    yields that can appear in TAG items. Due to the overhead of TAG parsing over CFG
    parsing, the parsers so obtained would probably be too inefficient to be used
    with real-sized grammars under a global error-repair strategy, but they could
    be used in realistic conditions by applying a local or regional repair strategy.


    +   * It would be interesting to add probabilistic models or machine learning
    techniques to make linking decisions for the parsers for mildly-projective dependency
    structures defined in Chapter 8, and test their performance and accuracy on real
    examples, comparing them to other projective and non-projective dependency parsers.


    +   * The definition of mildly ill-nested dependency structures given in Chapter
    8 is closely related to the way the $MG_k$ parser works. It would be interesting
    to find a more grammar-oriented definition of these structures that provide linguistic
    insight into them, and to study whether it is possible or not to find ill-nested
    structures in natural languages.


    +   * An interesting research direction which has already produced results is
    to apply variants of the $MG_k$ parser''s strategy to the related problem of binarising
    linear context-free rewriting systems, reducing the number of nonterminals in
    their productions to improve parsing efficiency. Gómez-Rodríguez et al. (2009b),
    an algorithm is presented to solve this problem, whose strategy to merge nonterminal
    symbols is directly related to the way in which $MG_k$ COMBINER steps join dependency
    subtrees.


    +   * As we have seen throughout this book, the parsing schemata can be used to
    describe any parse as long as it is consistent, based on the principle of combining
    structures into larger structures to find a full parse. While we have used schema
    to describe constituency, dependency and link grammar parsers, it could also be
    applied to other syntactic formalisms allowing the definition of constructive
    parsers. Furthermore, while the framework of parsing schema was defined with parsing
    in mind, the background idea of combining partial structures that can be represented
    as items is shared by other problems, such as natural language generation (Reiter
    and Dale, 2000). Thus, it should be possible to reformulate parsing schemata for
    generation and other problems that fail to construct this template.'
