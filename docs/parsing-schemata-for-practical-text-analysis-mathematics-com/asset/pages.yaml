    # 4.2 Parsing with TAGs


    Up to now, all the schemata that we have seen correspond to parsers for CFGs.
    However, as mentioned in Section 2.3.2, it is also possible to define parsing
    schemata for other constituency-based grammar formalisms. All the definitions
    in Section 2.3.2 can be applied to any grammar class $CG$ as long as we can define
    a set of valid constituency trees $Trees(G)$ for every grammar $G \in CG$.


    In this section, our schema compiler is used to obtain implementations of parsers
    for TAGs (Joshi and Schabes, 1997), and test their empirical performance by parsing
    natural language sentences with a real-sized grammar: the XTAG English Grammar
    (XTAG Research Group, 2001). To this end, we provide a brief introduction to the
    formalism of TAG.


    # 4.2.1 Tree-adjoining grammars


    CFGs are one of the most widely used formalisms for defining the syntax of natural
    languages, since they are relatively simple to be parsed efficiently. As we have
    seen, several parsers for CFGs have a cubic worst-case complexity with respect
    to input length, and their behaviour is typically better than cubic in practical
    cases (see Section 4.1). However, it has been shown that CFGs are not expressive
    enough to cover all the linguistic phenomena present in natural languages. Some
    constructions in human languages are context-sensitive, and thus cannot be adequately
    modelled by a CFG. For instance, Huybreght (1984) and Shieb (1985) show that certain
    variants of German constructions can only be modelled by formalisms that generate
    the *copy language* $\{\alpha\alpha | \alpha \in \Sigma^*\}$, which is not context-free.
    Another known linguistic phenomenon that lies outside the generative capacity
    of CFGs is of cross-serial dependencies,'
  merge: -1
  pgno: 77
- img_proc: true
  md: '# Practical complexity of constituency parsers


    present in languages like Dutch (Joshi, 1985). Cross-serial dependencies appearing
    in sentences of the form $a_1 a_2 \dots a_k b_2 \dots b_k$, where each $a_i$ depends
    on the corresponding $b_i$.


    Thus, it is clear that CFGs are not enough to model natural language: if we want
    a formalism that can successfully express the range of syntactic constructions
    used in human languages, we need a class of grammars with greater generative capacity
    than CFG, i.e., one that generates a strict superset of the context-free languages.
    However, for our formalism to be useful, this superset should not be too large.
    For example, the smallest superset of context-free languages described in the
    classical formal language hierarchy defined by Chomsky (1956, 1959), which is
    of *context-sensitive* languages, allows constraints that are considered more
    complex than those in natural languages (for instance, the language $\{a^p | p
    \text{ is a prime number}\}$ is context-sensitive), and the parsing is PSPACE-complete
    for this class of languages.


    For reasons, researchers have devoted considerable efforts to search for grammar
    formalisms that are general enough to model all the known constructions present
    in human languages, yet restricted enough to be parsable in polynomial time. The
    formalisms satisfying these conditions are called *mildly context-sensitive* (Joshi,
    1985; Joshi *et al.*, 1991), and the languages they generate are known as *mildly
    context-sensitive languages*. Several mildly context-sensitive formalisms have
    been proposed, ones generating larger sets of structures than others. For example,
    the most general of these formalisms we have linear context-free rewriting systems
    (Vijay-Shanker *et al.*, 1987; Weir, 1988), and among the most restrictive we
    have TAGs (Joshi and Schabes, 1997).


    TAGs are an extension of CFGs, first described by Joshi (1975), and later refined
    by Joshi (1987). The languages generated by these grammars, called tree-joining
    languages (TAL), are only slightly more expressive than context-free languages,
    yet expressive enough to model linguistic phenomena like cross-serial dependencies
    or the fact that TAG parsers run in $O(n^6)$ time in the worst case (Vijay-Shanker
    and Joshi, 1985), makes them an interesting formalism for natural language processing.


    **Definition 4.1.** A *tree-adjoining grammar (TAG)* is a 5-tuple $G = (N, \Sigma,
    \Gamma, I, A, S)$ where


    +   - $\Sigma$ is an alphabet of symbols called terminal symbols,'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# Parsing Schemata for Practical Text Analysis


    +   * N is an alphabet of auxiliary symbols called nonterminal symbols, satisfying
    $\Sigma \cap N = \varnothing$

    * $S \in N$ is a distinguished nonterminal symbol called the initial symbol or
    axiom of the grammar $G$,

    * $I$ is a finite set of trees called *initial trees*, and

    * $A$ is a finite set of trees called *auxiliary trees*.


    The meaning of $N$ and $\Sigma$ is the same as in CFG (see Section 2.1): terminal
    symbols $(\Sigma)$ are those that appear in strings of the language generated
    by the grammar, nonterminals $(N)$ are auxiliary symbols used to derive strings.
    In CFG, the initial symbol $S$ be the root node of trees. On the other hand, the
    initial and auxiliary trees in $I \cup A$ (together *elementary trees*) are used
    to derive trees (and from them, strings), although the derivation operations are
    different from those in CFG.


    Given a CFG $G$, we see in Section 2.1 that its associated language $L(G)$ is
    obtained by starting with the initial symbol $S$ and applying a series of derivations
    (licensed by a set of production rules) to it. However, we equivalently define
    $L(G)$ as the set of yields of the trees obtained by starting with the tree with
    a single node labeled $S$, and applying a series of operations consisting of adding
    nodes labelled $A$ as children of a frontier node labelled $A$ if there is a production
    $A \rightarrow \alpha$ in the grammar, until all the frontier nodes in our tree
    are labelled with terminals.


    The general idea of derivation in TAGs is a generalisation of this treebased derivation
    concept for CFG. In this case, the starting point is any initial tree $I$ rooted
    at a node labeled $S$, not necessarily a tree with a single node, and new trees
    can be obtained by combining elementary trees, using two combination operations:
    *substitution* and *adjunction*. Substitution consists of inserting a complete
    tree, rooted at a node $A$, in the place of a frontier node also labeled $A$:
    note that this is the same operation in CFG derivations, but the possibility of
    inserting trees of arbitrary depth, instead of the trees with two levels represented
    by CFG productions. On the other hand, adjunction is the operation that provides
    TAG with their extra generative power, and roughly consists of inserting an auxiliary
    tree $t \in A$, verifying certain constraints, in the place of an *inner* node
    of another tree, which has been marked as an adjunction node. The original tree
    containing the adjunction is split into two parts, with both, and the auxiliary
    tree being used to link them.'
