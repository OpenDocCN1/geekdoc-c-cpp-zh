    #  4.8 Discussion


    In this chapter, we have used the compiler introduced in Chapter 3 to perform
    empirical comparisons of different constituency-based parsing algorithms. We have
    compared algorithms for two different constituency grammar formalisms (CFG and
    TAG) by using them to parse sentences with grammars from well-known natural language
    corpora, as well as with artificially generated grammars.


    In the experiments with natural language grammars, for the case of CFG, the CYK
    (Kasami, 1965; Younger, 1967), Earley (Earley, 1970) and Left-Corner (Rosenkrantz
    and Lewis II, 1970) algorithms have been compared on the Susanne (Sampson, 1994),
    Avery (Carroll, 1993) and Delta (Schoold and Belder, 1990). For TAG, we have compared
    CYK-based algorithm (Vijay-Shanker and Joshi, 1985), Early-based algorithms with
    and without the VPP (Alonso et al., 1999), Schabes, (1994), and the algorithm
    by Nederhof (1999), using the XTAG English Grammar (XTAG Research Group, 2001).


    These experiments are an example of how the parsing compiler presented in Chapter
    3 can be easily obtain implementations of different parsers and test them on real-sized
    grammars under homogeneous conditions. The measurements obtained in the comparisons
    show how different parsers can be better or worse suited to a particular task
    depending on factors related to the size and nature of the grammar and sentences
    to be parsed. Our system provides a quick way to prototype and evaluate several
    parsing algorithms in order to find the best one for a particular application.'
