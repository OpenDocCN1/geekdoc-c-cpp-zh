    Therefore, an approximate tree is the pair formed by a tree and an upper bound
    of its distance to some tree in $Trees(G)$.


    This concept of approximate trees allows us to precisely define the problem we
    want to solve with error-repair parsers. Given a grammar $G$, a distance function
