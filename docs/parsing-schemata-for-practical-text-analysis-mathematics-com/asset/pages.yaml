    Therefore, for a given, $G_k$ is a grammar with one initial tree and $k$ auxiliary
    trees, which parses a language over an alphabet with $k+1$ terminal symbols. The
    actual language defined by $G_k$ is the regular language $L_k = a_0(a_1 \mid \dots
