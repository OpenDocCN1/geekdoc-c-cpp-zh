  md: '# A compiler for parsing schemata


    # 3.2 System architecture


    Our parsing schemata compiler is composed of several different subsystems:


    +   - The “sparser” (schema parser) subsystem reads input parsing schemata, parses
    them and transforms them into an internal tree representation, which will be the
    input to the code generation step. This subsystem is a compiler generated by the
    JavaCC parser generator (Viswanadha, 2006).

    - The “generator” (code generator) subsystem is the most complex part of the schema
    compiler. This subsystem takes the tree representation produced by “sparser” as
    input, and uses it to generate the Java classes implementing the algorithm described
    by the schema. This subsystem is divided into several parts, and each of them
    is used to generate a part of the implementation: deduction step execution, item
    management, indexing, etc.

    - The “eparser” (element parser) subsystem guarantees the generality property
    discussed previously by providing an extensibility mechanism which can be used
    to compile schemata with non-predefined elements. As explained above, parsing
    schemata have an open notation, so any mathematical object could appear as an
    item. Therefore, it would be impossible for our system to recognise *a priori*
    any kind of item that could potentially appear in an arbitrary schema. The “eparser”
    subsystem allows the user to define their own kinds of notation elements and use
    them in schemata, the use of Java’s dynamic class loading facilities eliminating
    the need for recompilation in order to add new element types.


    These three systems interact to transform a parsing schema into an executable
    parser: the “sparser” constructs a tree representation of the schema file, calling
    the “eparser” for help whenever it needs to parse a user-defined element. the
    “generator” then takes this tree and transforms it into Java source code, which
    includes a buildfile to compile it to bytecode. The result of this compilation
    is a Java executable which can read a grammar from a file and parse input sentences
    with that grammar, using the algorithm described in the schema.'
