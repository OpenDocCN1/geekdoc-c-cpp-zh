  md: '# 8.5 Parsing ill-nested structures


    The $WG_k$ parser analyses dependency structures with bounded gap degree as long
    as they are well-nested. This covers the vast majority of structures that occur
    in natural-language treebanks (Kuhlmann and Nivre, 2006), but there is still a
    significant minority of sentences that contain ill-nested structures,$^9$


    Unfortunately, the general problem of parsing ill-nested structures is NP-complete,
    even when the gap is bounded: this set of structures is closely related to LCFRS
    with bounded fan-out and unbounded production length, and parsing in this formalism
    has been proven to be NP-complete (Satta, 1992). The reason for this high complexity
    is the problem of *unrestricted configurations*, appearing when dependency subtrees
    are allowed to interleave in every possible way. However, just as it has been
    noted that most non-projective structures appearing in practice are "slightly"
    non-projective (Nivre and Nilsson, 2005), characterise a sense in which the structures
    appearing in treebanks can be viewed as being only "slightly" ill-nested.


    In this section, we general the algorithms $WG_1$ and $WG_k$ to parse a proper
    superset of the set of well-nested structures in polynomial time, and give a characterisation
    of this new set of structures, which includes all the structures in several dependency
    treebanks.


    # 8.5.1 The $MG_1$ and $MG_k$ parsers


    The $WG_k$ parser for well-nested structures presented previously is based on
    a bottom-up process, where LINK steps are used to link completed subtrees to a
    head, and COMBINE steps are used to join subtrees governed by a common head to
    obtain a larger structure. As the gap degree increases up to $k$, its COMBINER
    steps correspond to all the ways in which we can join two sets of sibling subtrees
    meeting these constraints, and having a common head, into another. Therefore,
    this parser does not use COMBINE steps that produce interleaved subtrees, since
    these would generate items corresponding to ill-nested structures.


    We obtain a polynomial parser for a wider set of structures of gap degree at most
    $k$, including some ill-nested ones, by having COMBINER steps representing every
    way in which two sets of sibling subtrees of gap degree


    > $^9$ Maier and Lichte (2009) provide examples of some linguistic phenomena that
    cause ill-nestedness in German sentences.'
