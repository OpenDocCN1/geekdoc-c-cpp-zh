  md: '# 2.3.3 Correctness of parsing schema


    Apart from providing us with a simple and compact way to represent parsers, as
    can be seen in these examples, parsing schema can also be used to prove the correctness
    of parsers and establish formal relations between them.


    To prove the correctness of a parser, we can define the soundness, completeness
    and correctness of a parsing schema in terms of that of its resulting deduction
    systems for different grammars and strings:


    **Definition 2.15.** *A parsing schema $S$ for a class of grammars $CG$ is said
    to be sound (complete, correct) if, for every grammar $G \in CG$, $S(G)$ is an
    uninstantiated parsing system of the form $(\mathcal{I}, K, D)$, such that every
    string $a_1 \dots a_n \in \Sigma^*$, the enhanced deduction system $(\mathcal{I},
    K(a_1 \dots a_n), \mathcal{F}_{G,II}^{(n)(a_1 \dots a_n)}, D)$ is sound (complete,
    correct).


    By Definition 2.6, what that a parsing schema $S$ is:


    +   - sound: if, in every instantiated parsing system obtained from $S$, all valid
    final items are correct

    - complete: if, in every instantiated parsing system obtained from $S$, all correct
    final items are valid

    - correct: if it is both sound and complete.


