    +   - $[i, l-1, i], [l, j, j] - [i, j, i]$ (by the L-Link step),

    - $[i, j, i], [j, k, i] - [i, k, i]$ (by the L-Combiner step).


    This proves that all correct items of length $l$ which are of the form $[i, k,
