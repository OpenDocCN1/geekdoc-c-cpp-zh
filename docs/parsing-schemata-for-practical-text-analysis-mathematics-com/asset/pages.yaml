  md: 'Thus, some valid entities associated with a deduction system is the set of
    all the entities that can be inferred from the hypotheses by applying a sequence
    of deduction steps.


    **Definition 2.6.** *An enhanced deduction system E is a tuple $(X, \mathcal{H},
    \mathcal{F}, C, D)$ where $X, \mathcal{H}$ and $D$ have the same meaning as in
    a standard deduction system, $\mathcal{F} \subseteq X$ is a set of final entities,
    and $C \subseteq \mathcal{F}$ is a set of correct final entities.*


    From a formal standpoint, the definition of the sets $C$ and $\mathcal{F}$ is
    arbitrary. In practice, they will be defined according to semantic criteria depending
    on what the deduction system is used: The sets $C$ and $\mathcal{F}$ allow us
    to establish the correctness of a deduction system; we say that an enhanced deduction
    system $E=(X, \mathcal{H}, \mathcal{F}, C, D)$ is


    +   * *sound*, if all valid final entities are correct: $\mathcal{F} \cap \mathcal{V}(E)
    \subseteq C$,n* *complete*, if all correct final entities are valid: $C \subseteq
    \mathcal{F} \cap \mathcal{V}(E)$,n* *correct*, if it is sound and complete.


    In the particular context of parsing, a parser is said to be sound if all the
    parse trees are licensed by the grammar, and complete if every such tree is obtained
    by the parser. Thus, the set of correct final entities will contain those entities
    corresponding to full syntax trees licensed by the grammar, as explained in more
    detail below.


    # ### 2.3.2 Parsing schemata and parsing schema


    Parsing schemata are a particular case of deduction systems, where the entities
    of $X$ and the hypotheses of $\mathcal{H}$ are called *items* and represent sets
    of partial parse trees in a given grammar.


    **Definition 2.7.** *Let $G$ be a grammar, belonging to some class of grammar
    CG. We will refer to the set of partial constituency trees licensed by $G$ as
    the set of valid trees for $G$, denoted $Trees(G)$.*


    For example, if $G=(N, \Sigma, P, S)$ is a CFG, the set $Trees(G)$ is defined
    by Sikkel as the set of finitely branching trees in which children node has a
    left-to-right ordering, every node is labelled with a symbol


    > ³Note that the definitions given in this chapter contrast to the traditional,
    grammar-driven formulation of parsing schemata. Throughout the book, this theory
    will always be used as a starting point, but we will depart from it. In Chapter
    5 we will relax the constraints related to valid trees, and in Chapter 7 we will
    define schemata for data-driven parsers that do not use a grammar at all.'
