  md: "# Parsing Schemata for Practical Text Analysis\n\nThis DISTANCEINCREASER step\
    \ is not necessary in practical implementations of the parser, where we are not\
    \ interested in strict completeness (finding all approximate parses) because we\
    \ only need the minimal-distance parses. However, if we are able to prove that\
    \ the variant of the parser that includes DISTANCEINCREASER is correct, it immediately\
    \ follows that the version without it generates all final items, any sequence\
    \ of deductions that uses an item $[A \to \\alpha \\cdot \beta, i, j, e+1]$ obtained\
    \ from a DISTANCEINCREASER to produce a minimal final item can also be made directly\
    \ with $[A \to \\alpha \\cdot \beta, i, j, e]$, avoiding the use of this step.\
    \ Thus, if we call the variant of Lyon's schema with the DISTANCEINCREASER $S_{Lyon}$,\
    \ the practical correctness of Lyon's algorithm is implied by the following\n\n\
    **Theorem 5.1.** The parsing schema $S_{Lyon}$ is correct.\n\n**Proof.** In order\
    \ to prove the correctness of the schema $S_{Lyon}$, we must prove:\n\n+   - Soundness:\
    \ given a grammar and an input string, all valid final items are correct.\n- Completeness:\
    \ given a grammar and an input string, all the correct final items are valid (i.e.\
    \ can be inferred from the hypotheses).\n\n# 5.3.1.1 Soundness\n\nBy construction,\
    \ each of the items $[A \to \\alpha \\cdot \beta, i, j, e]$ in $\\mathcal{T}_{Lyon}$\
    \ represents the set of approximate trees $(t, e)$ such that $t$ is a partial\
    \ tree with root $A$ where the children of $A$ are symbols of the string $\\alpha$.\
    \ We will say that an item $[A \to \\alpha \\cdot \beta, i, j, e]$ is *correct*\
    \ if it contains at least one approximate tree $(t, e)$ such that the leaf nodes\
    \ of the subtrees rooted at the symbols in $\\alpha$ form the substring $\\alpha_{i+1}\
    \ \\dots \\alpha_j$ of the input string $s^3$ (we will call such a tree *correct*\
    \ for the item). In the particular case of final items, which are of the form\
    \ $[S \to \\gamma \\cdot 0, n, e]$, correct approximate trees $(t, e)$ trivially\
    \ verify that $t$ is a marked tree for $a_1 \\dots a_n$, and thus a final item\
    \ containing a correct tree verifies the generic definition of correct final item.\n\
    \nProving the soundness of a parsing schema is proving that all final items are\
    \ correct for every grammar $G$ and input string $a_1 \\dots a_n$. To do\n\n>\
    \ $^3$We are supposing that we have each terminal in the input string annotated\
    \ with its position, so that our input is a string of marked terminals."
