    \ interleaved subtrees, like the steps for gap degree 1 shown in Figure 8.1. Note\
    \ that this does not mean that we can build every possible ill-nested structure\
    \ as some structures with complex crossed configurations have gap degree $k$,\
    \ but cannot be built by combining structures of that gap degree. More specifically,\
    \ our algorithm will be able to parse a dependency structure if there exists a\
    \ *binarisation* of that structure that has gap degree at most $k$. The parser\
    \ implicitly works by finding such a binarisation, since COMBINE steps are applied\
    \ to two items and no intermediate item generated by them can exceed gap degree\
    \ $k$ (not counting the position of the head in the projection).\n\n# **Definition\
    \ 8.4.** Let $a_1 \\dots a_n$ be a string, and $T$ a partial dependency tree headed\
    \ at a node $a_h$. A *binarisation* of $T$ is a tree $B$ in which each node has\
    \ at most two children, and such that:\n\n+   (a) Each node in $B$ can be unlabelled,\
    \ or labelled with a word $a_i$. Note that several nodes may have the same label\
    \ (in contrast with the definition of a dependency graph, where the set of nodes\
    \ is the set of word occurrences itself, so a word $a_i$ cannot appear twice in\
    \ the graph).\n(b) A node labelled $a_i$ is a descendant of $a_j$ in $B$ and only\
    \ if $a_i \to^* a_j$ in $T$.\n\nThe projection of a node in a binarisation is\
    \ the set of reflexive-transitive children of that node. With this, we can define\
    \ the gap degree of a binarisation in the same way as that of a dependency structure.\
    \ If we denote by $|n|_T$ the projection of node $n$ in a tree $T$, the condition\
    \ (b) of a binarisation can be rewritten as follows: $a_i \\in |a_j|_B \\Leftrightarrow\
    \ a_i \\in |a_j|_T$.\n\n# **Definition 8.5.** A dependency structure is *mildly\
    \ ill-nested* for gap degree $k$ if it has at least one binarisation of gap degree\
