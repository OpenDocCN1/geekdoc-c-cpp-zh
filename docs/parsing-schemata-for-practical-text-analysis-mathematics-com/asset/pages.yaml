    # 7.2 The formalism of dependency parsing schemata


    In the original formulation of parsing schemata that we have seen in Chapter

    2, schemata are deduction systems whose domain is a set of items, and

    items are defined as sets of partial parse trees, members of some partition

    of a set $Trees(G)$ that contains all the constituency licensed by a

    given grammar $G$. Although parsing schemata were initially defined for

    context-free parsers, they can be adapted to different constituency-based

    grammar formalisms, by finding a suitable definition of $Trees(G)$ for each

    particular formalism and a way to define deduction steps from its rules.

    However, since the concept of $Trees(G)$ and the subsequent definitions are

    based on constituency trees, parsing schemata are not directly applicable

    to dependency parsing.


    In spite of this problem, many of the dependency parsers described in

    the literature have the property of being constructive, in the sense that they

    proceed by combining smaller structures to larger ones until they find the

    complete parse for the input sentence. Therefore, it is possible to define a

    variant of parsing schemata, where these structures can be defined as items\and
    the strategies used for combining them can be expressed as inference

    rules. However, in order to define such a formalism we have to tackle

    some issues specific to dependency parsers:


    +   * Traditional parsing schemata are used to define grammar-based parsers,

    in which the parsing process is guided by some set of rules which are

    to use licence deduction steps. For example, as Earley PREDICTOR

    step is tied to a particular grammar rule, and can only be executed if

    such a rule exists. Some dependency parsers are also grammar-based,

    such as those described by Lombardo and Lesmo (1996), Barbero et al.

    (1998) and Kahane et al. (1998), which are tied to the formalisations

    of dependency grammar parsing using context-free rules described by Hays

    (1964) and Gaifman (1965). However, many of the widely used

    algorithms ( Eisner, 1996; Yamada and Matsumoto, 2003) do not use

    a formal grammar at all. In these, decisions about which depend-

    cies to create are individually, using probabilistic models (Eis-

    ner, 1996) or classifiers (Yamada and Matsumoto, 2003). To represent'
