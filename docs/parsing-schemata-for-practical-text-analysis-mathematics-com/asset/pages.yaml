  md: '# 7.3.6 Nivre (2003)


    Nivre (2003) describes a shift-reduce algorithm for projective dependency parsing,
    later extended by Nivre et al. (2004). With linear-time performance and competitive
    parsing accuracy (Nivre et al., 2006; Nivre and McDonald, 2008), it is one of
    the parsers included in the MaltParser system (Nivre et al., 2007b), in use today
    (Nivre et al., 2007a; Surdeanu et al., 2008).


    The paraser works by reading the sentence from left to right, using a stack and
    four different kinds of transitions between configurations. The transition system
    defined by all the possible configurations and transitions is nondeterministic,
    but machine learning techniques are used to train a mechanism that selects a single
    transition to undertake at each state, and that the paraser becomes deterministic.


    By encoding configurations into entities and transitions into steps, we can define
    a simple deduction system for Nivre''s parser as follows (where $a :: B$ represents
    the stack which is the result of pushing element onto stack $B$, and $()$ represents
    the empty stack):


    ```

    $\n{Initter}{0, ({}), \emptyset}}\n\n$\frac{Shift(f, S, V)}{f+1, f :: S, V}}\n\n$\frac{L-Link(f,
    l :: S, V)}{f+1, l :: S, V \cup \{a_f \to a_l\}} a_f \to a_l |\bar{a}_f \to a_k
    \in V$\n\n$\frac{R-Link(f, l :: S, V)}{f, S, V \cup \{a_l \to a_f\}} a_l \to a_f
    |\bar{a}_l \to a_k \in V$\n\n$\frac{Reduce(f, l :: S, V)}{f, S, V} \ \exists a_l
    \in V$

    ```


    Parser configurations are tuples $(f, S, V)$ where $f$ is a position of the input
    string, $S$ is a stack and $V$ is a set of dependency links, which will contain
    a parse for the input when the system reads the complete sentence.


    Note that this is a deduction system that literally describes the transitions
    of the parser as defined in Nivre et al. (2004), but it is not a parsing schema
    by the definitions given in this chapter, because the entities it works'
