    # 3.1.2 Related work


    Although some previous work has been done on systems and techniques that can be
    used to implement parsing schemata for natural languages, the existing alternatives
    do not fulfill the features enumerated in Section 3.1.1. The Dyna language (Eisner
    et al., 2004) can be used to implement some kinds of dynamic programs, but its
    notation is not close to the formal notation commonly used to represent schemata
    as ours. The DyAlg system (de la Clergeix, 2005) can be used to compile and run
    tabular parsers for several grammatical formalisms, but the specifications are
    based on local pushdown automata and can be complex and unnatural, especially
    for purely bottom-up parsers which do not use a left-to-right strategy to process
    the input string. None of these systems is specifically oriented to the implementation
    of parsing schemata.


    Shieber et al. (1995) introduce a technique to execute parsing schemata with a
    deductive parsing engine programmed in Prolog. However, this requires the conversion
    of items and deduction steps to the Prolog language. Moreover, if we want the
    implementations generated with this technique to be efficient, we need to provide
    item indexing code by hand, so we have to abandon the abstraction level of schemata
    and take implementation details into account. Without this indexing system, the
    Prolog interpreter will perform a large amount of CALL and REDO operations, distorting
    the results when working with large grammars (Alonso and Díaz, 2003; Díaz and
    Alonso, 2000).


    Basic parsing schemata can also be implemented in Datalog, a variant of Prolog
    commonly used for deductive databases. The subject of obtaining efficient implementations
    of Datalog programs has been studied in the literature (McAllister, 1999; Liu
    and Stoller, 2003). However, the constraints imposed by Datalog allow some useful
    extensions to parsing schemata, such as feature structure unification (Carpenter,
    1992), that can be used in this system.'
