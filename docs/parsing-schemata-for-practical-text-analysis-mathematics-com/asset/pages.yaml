    In this section, we describe how we have dealt with the particular characteristics
    of the XTAG English grammar in order to make it compatible with our generic compilation
    technique. We also provide empirical results which allow us to compare the performance
    of several different TAG parsing algorithms in the practical case of the XTAG
    grammar. It should be noted that previous comparisons of TAG parsers in the literature
    (Diaz and Alonso, 2000) use smaller grammars, as simplified subsets of the XTAG
    English grammar, instead of the whole XTAG grammar with all its trees and feature
    structures. Therefore, our comparison provides valuable information about the
    behaviour of various parsers on a complete, largcale natural language grammar.
    This behaviour is very different from the one that can be observed on small grammars,
    since grammar size becomes a dominant factor in computational complexity when
    large grammars like TAG are used to parse relatively small natural language sentences
    (see the experiments by Sarkar (2000), and the empirical evaluation of the impact
    of grammar size in complexity that will be presented in Section 4.6).


    # 4.4.1 Grammar conversion


    The first step we undertook in order to generate parsers for the XTAG English
    grammar was a full conversion of the grammar to an XML-based format, a variant
    of the TAG markup language (TAGML) (Bonhomme and Lopez, 2000). In this way we
    had the grammar in a standard, well-defined format, easier to parse and modify
    the original, ad-hoc format. This is highly convenient since grammar preprocessing
    or conversion is often necessary (an example is the binarisation required to use
    the CYK algorithm) and standard APIs for XML make it fast and easy to perform
    transformations.


    During this conversion, the relationships between features that were expressed
    as unification equations in the original XTAG grammar were transformed to links
    to symbolic variables, so that two features that should take equal values were
    linked to the same variable.'
