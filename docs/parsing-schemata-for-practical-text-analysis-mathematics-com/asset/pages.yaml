    of a diverse range of algorithms for this purpose. Different parsers are better
    suited to different situations, so the question of which parser is better for
    a practical application depends on many factors, such as the language, domain,
    application goal or availability of linguistic resources.


    According to the linguistic resources that they use, we can broadly classify parsing
    techniques into two categories: grammar-driven and data-driven approaches. In
    *grammar-driven* parsing, the set of valid sentences in a given language is represented
    by a *grammar*, which is a set of formal rules that describe the structures that
    can appear in the language. In a *data-driven* approach, no formal grammar is
    needed; instead, some learning technique is used to automatically infer linguistic
    knowledge from (possibly annotated) texts, that can be used to parse other texts.
    However, most of the systems used in practice are not purely grammar-driven or
    data-driven; instead, they combine features of both approaches. For example, a
    formal grammar can be annotated with statistical information obtained from a corpus
    of annotated text, or a system may induce a grammar automatically from text data.


    In parsers that use grammar, the kinds of rules that can be used to describe syntactic
    structures and the ways in which they are used to form sentences depend on the
    particular *grammatical formalism* that we use.'
