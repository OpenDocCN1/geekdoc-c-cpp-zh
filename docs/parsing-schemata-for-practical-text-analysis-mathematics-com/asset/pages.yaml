  md: '# Parsing Schemata for Practical Text Analysis


    frequent in free word order languages such as Czech. Unfortunately, parsing without
    the projectivity constraint is computationally complex. Although it is possible
    to parse non-projective structures in quadratic time with respect to the input
    length under a model in which each decision is independent of all the others (as
    in the parser by McDonald et al. (2005b), whose schema has been shown in Section
    7.6.3), the problem is intractable in the absence of this assumption (McDonald
    and Satta, 2007).


    Nivre and Nilsson (2005) observe that most non-projective dependency structures
    appearing in natural language treebanks are “close” to being projective, since
    they contain only a small proportion of non-projective arcs. This led to the study
    of classes of dependency structures that lie between projective and unrestricted
    non-projective structures (Kuhmann and Nivre, 2006; Havelka, 2007). Kuhmann (2007)
    investigates several classes, based on well-nested and gap degree constraints
    (Bodirsky et al., 2005), relating them to a number of lexicalised constituency
    grammar formal. Specifically, he shows that: context-free rewriting systems (LCFRS)
    with fan-out k (Vijay-Shanker et al., 1987; Satta, 1992) induce the set of dependency
    structures with gap degree at most $k-1$; context-free grammars in which the maximal
    rank of a nominal is $k$ (Hotz and Pitsch, 1996) induce the set of well-nested
    dependency structures with gap degree at most $k-1$; and finally, LTAGs (Joshi
    and Schabes, 1997) induce the set of well-nested dependency structures with gap
    degree at most 1.


    These results establish that there must be polynomial-time dependency parsing
    algorithms for well-nested structures with bounded gap degree, since such parsers
    exist for their corresponding lexicalised constituency formalisms. However, as
    it has been observed by Kuhmann and Nivre (2006) that most of the non-projective
    structures in treebanks are well-nested and have a small gap degree, developing
    efficient dependency parsing strategies for sets of structures has considerable
    practical interest, since we would be able to parse these sentences directly with
    dependencies in a data-driven manner, rather than indirectly by constructing intermediate
    constituency grammars and extracting dependencies from constituency parses.


