    The language associated with a grammar $G = (N, \Sigma, P, S)$, denoted $L(G)$,
    is the set of strings of terminal symbols in $\Sigma$ that can be obtained by
    starting with the initial symbol $S$ and applying a sequence of productions in
    $P$. A production of the form $A \to \alpha$ can be applied to any string containing
    the nonterminal $A$, and is applied by chaining one appearance of $A$ in the string
    to $\alpha$. We write $\beta \Rightarrow \gamma$ to denote that we can obtain
    the string $\gamma$ by applying a production to the string $\beta$. We write $\beta^*
    \Rightarrow \gamma$ to denote that $\gamma$ can be obtained by applying a sequence
    of zero or more productions to the string $\beta$. Thus, we can write the language
    associated with the grammar $G = (N, \Sigma, P, S)$ as $L(G) = {\alpha \in \Sigma^*
    | S \Rightarrow \alpha\}$.


    **Example 2.1.** Suppose that we have a CFG $G = (N, \Sigma, P, S)$ defined by
    the following:


    +   * $\Sigma = {\the, dog, barks}$

    * $N = {\S, NP, VP, N, Det}$

    * $P = {\S \to NP VP, NP \to Det N, VP \to Det, the N \to dog, VP \to barks\}$


    This is a typical example of a fragment of a CFG used for parsing natural language,
    in this case English. Of course, this is an extremely simplified "toy" grammar
    whose associated language $L(G)$ contains a single sentence ("the dog barks");
    however, the grammars used in real-life applications often have the same structure:
    nonterminal symbols correspond to syntactic structures — as noun phrases (NP)
    or verb phrases (VP) — and production rules express the valid ways in which these
    structures combine into order. Terminal symbols can denote concrete words, as
    in this example, or part-of-speech tags (such as N or Det). The latter option
    is common when a parser is used as one of the steps in a natural language processing
    pipeline, receiving its input from a part-of-speech tagger module which maps the
    words in input to sentences to these tags.


    We can check that the sentence "the dog barks" is fact in $L(G)$ by obtaining
