    the $MG_k$ parser can parse every sentence with gap degree at most $k$.


    # 8.6 Discussion


    Using the dependency parsing schemata framework described in Chapter 7, we have
    defined a parsing algorithm for well-nested dependency structures with bounded
    gap degree. In terms of computational complexity, this algorithm is comparable
    to the best parsers for relation-constituency-based formalisms: when the gap degree
    is at most 1, it runs in $O(n^7)$, like the fastest known parsers for LTAG, and
    can become $O(n^6)$ if we use unlocalised dependencies. When the gap degree is
    greater than 1, the time complexity goes up by a factor of $n$ for each extra
    unit of gap degree, as is in parsers for coupled-context-free grammars. Most of
    the non-projective structures appearing in treebanks are well-nested and have
    a small gap degree, so this algorithm directly parses the vast majority of the
    non-projective structures in natural languages, without requiring the construction
    of a constituency grammar as an intermediate step.


    Additionally, we have defined a set of structures for any gap degree $k$ which
    we might call ill-nested. This includes ill-nested structures verifying certain
    conditions, and can be parsed in $O(n^{3k+4})$ with a variant of the parser for
    well-nested structures. The practical interest of mildly ill-nested treebanks,
    showing that all the data obtained from all of the ill-nested structures are mildly
    ill-nested for their corresponding gap degree, our $O(n^{3k+4})$ parser can analyse
    all the gap degree $k$ structures in these treebanks. The strategy used by this
    algorithm for parsing mildly ill-nested structures has also been adapted to solve
    the problem of finding binarisations of LCFRS that improve parsing efficiency
    (see Gómez-Rodríguez et al. (2009b)).


    The set of mildly ill-nested structures for gap degree k is defined as the set
    of structures that have a binarisation of gap degree at most $k$. This definition
    is directly related to the way the $MG_k$ parser works, since it'
