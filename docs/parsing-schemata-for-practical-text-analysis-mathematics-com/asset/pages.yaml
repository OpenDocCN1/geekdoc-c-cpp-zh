    an approximate tree an *approximate marked parse tree* for $a_1 \dots a_n$.


    Similarly, the *approximate parsing* problem consists of finding the minimal $e
    \in (\mathbb{N} \cup \{0\})$ that there exists an approximate marked parse tree
    $(t,e) \in ApTrees(G)$ for the sentence, and finding all approximate marked parse
    trees of the form $(t,e)$ for the sentence.


    As we can see, the problem of parsing is a problem of finding trees, the problem
    of approximate parsing can be seen as a problem of finding approximate trees.
    In the same way the problem of parsing can be solved by a deduction system whose
    items are sets of trees, the problem of approximate parsing can be solved by one
    sets of approximate trees.


