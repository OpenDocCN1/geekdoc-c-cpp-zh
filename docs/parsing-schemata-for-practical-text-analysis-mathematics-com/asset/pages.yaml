    part of the code generator. Generating visitors traverse the parts of the schema
    tree according to item specifications. There is a different visitor for each basic
    operation in the generated code (matching, assigning values, etc.) and each visitor
    has a different behaviour for each kind of node (SimpleElement, Expression...)
    in the specification. We also need to keep track of which variables in specifications
    have a concrete value at each part of the code and which are uninstantiated, so
    this information is kept by an external structure which can be queried by the
    visitor.


