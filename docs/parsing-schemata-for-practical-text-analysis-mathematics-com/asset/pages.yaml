    # 7.5.3 Eisner (1996) is correct


    By using the previous proofs and the relationships between schemata that we explained
    earlier, it is easy to prove that the parser by Eisner (1996) is correct. Soundness
    is, as always, straightforward, and completeness can be proven by using the properties
    of other algorithms. Since the set of final items in Eisner (1996) and Eisner
    and Satta (1999) are the same, and the former is a slight refinement of the latter,
    the completeness of Eisner and Satta’s parser directly implies the completeness
    of Eisner’s parser.


    Alternatively, we can use Yamada and Matsumoto’s parser to prove the correctness
    of Eisner’s parser if we refine the set of final items in the latter to be items
    of form $[0, n+1, False, False]$, which are equally valid as final items since
    they always contain parse trees. This idea can be applied to transfer proofs of
    completeness across any refinement relation.


    # 7.6 Parsing schemata for non-projective dependency parsers


    The parsing schemata that we have seen up to now in this chapter correspond to
    parsers that are restricted to projective dependency structures, i.e., structures
    in which the set of reflexive-transitive dependents of each given node forms a
    contiguous substring of the input. However, the dependency schema formalism is
    general enough to handle non-projective parsers as well. In this section, we will
    see several non-projective parsing algorithms in the literature can be described
    as parsing schemata. More non-projective parsers are described in the next chapter,
    where we introduce novel algorithms for parsing mildly non-projective dependency
    structures.'
