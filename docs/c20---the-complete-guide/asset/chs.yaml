  \ Vinoski 和 Victor Zverovich。\n\n===== 本章节位于此处 =====\n\n这些专家花了许多许多时间向我解释和讨论他们的工作，并且充满了耐心和热情。在这里特别感谢\
  \ Howard Hinnant, Tomasz Kaminski, Arthur O’Dwyer, Peter Sommerlad, Tim Song, Barry\
  \ Revzin, Ville Voutilainen 和 Jonathan Wakely。\n\n# 2. 关于本书\n\n本书将介绍 C++20 的所有新语言和库特性。我们将通过示例和背景信息涵盖每个新特性的动机和背景。\n\
  \n正如我所写的其他书一常一样，重点在于新特性在实践中的应用，本书将展示这些特性如何影响日常编程，以及你如何在项目中从中受益。这既适用于应用程序程序员，也适用于提供泛型框架和基础库的程序员。\n\
  \n## 2.1 在阅读本书之前需要了解的知识\n\n\n\n\n为了充分利用本书的内容，你应该已经熟悉 C++，最好是熟悉 `C++11`、`C++14` 和/或\
  \ `C++17`。你应该熟悉类和引用的通用概念，并能够使用 `IOStreams` 和 C++ 标准库中的容器等组件编写 C++ 程序。你还应该熟悉“现代 C++”的基础特性，例如\
  \ `auto` 或基于范围的 `for` 循环。\n\n然而，你不需要成为一名专家。我的目标是让内容对于普通的 C++ 程序员来说易于理解，他们并不一定了解最新特性的所有细节。我将根据需要讨论基础特性，并在需要时回顾更微妙的问题。\n\
  \n这确保了文本对于专家和中级程序员来说都是易读的。\n\n## 2.2 本书的整体结构\n\n本书涵盖了 C++20 引入的 C++ 的*所有*变化。这既适用于语言特性和库特性，也适用于影响日常应用程序编程的特性以及用于（基础）库的高级实现的特性。不过，更通用的情况和示例通常先出现。\n\
  \n不同的章节进行了分组，但这种分组并没有深层的教学逻辑，除了先介绍语言特性是有意义的，因为它们可能会被随后的库特性所使用。原则上，你可以任何顺序阅读章节。如果结合了不同章节的特性，会有相应的交叉引用。\n\
  \n因此，本书包含以下部分：\n\n**===== 本章/本节正在进行中 =====**\n\n## 2.3 如何阅读本书\n\n不要被本书的页数吓到。像 C++\
  \ 中一如既常的，当你深入细节时，事情可能会变得相当复杂。对于对新特性的基本理解，介绍动机和示例通常足够理解该特性的基本思想。\n\n根据我的经验，学习新事物的最好方法是看示例。因此，你会在书中发现很多示例。有些只是用几行代码来说明一个抽象概念，而另一些是完整的程序，提供了材料的具体应用。这类示例将通过描述包含程序代码文件的\
  \ C++ 注释来引入。你可以在本书的网站上找到这些文件：`[`www.cppstd20.com`](http://www.cppstd20.com)`。\n\n\
  ## 2.4 我的实现方式\n\n请注意以下关于我编写代码和注释方式的提示。\n\n### 2.4.1 初始化\n\n我通常使用现代初始化形式（在 `C++11`\
  \ 中引入的*统一初始化*），并使用大括号：\n\n```\nint i{42};\nstd::string s{\"hello\"};\n```\n\n这种初始化形式被称为*大括号初始化*（brace\
  \ initialization），具有以下优点：\n\n*   它可以用于基本类型、类类型、聚合体、枚举类型和 `auto`\n*   它可以用于初始化带有多个值的容器\n\
  *   它可以检测收缩错误（例如，用浮点值初始化 `int`）\n*   它不会与函数声明或调用混淆\n\n如果大括号为空，则会调用（子）对象的默认构造函数，并保证基本数据类型被初始化为\
  \ `0`/`false`/`nullptr`。\n\n### 2.4.2 错误术语\n\n我经常讨论编程错误。如果没有特殊提示，*error*（错误）术语或如下注释\n\
  \n```\n...   // ERROR\n```\n\n意味着编译错误。相应的代码不应该通过通过（使用符合标准的编译器）。\n\n如果我使用 *runtime\
  \ error*（运行时错误）术语，程序可能会编译，但行为不正确或导致未定义行为（因此，它可能执行或不执行预期操作）。\n\n### 2.4.3 代码简化\n\n\
  我尝试用有用的示例来解释所有特性。然而，为了专注于要教授的关键方面，我可能会经常跳过本应属于代码的其他细节。\n\n*   大多数时候，我使用省略号（“…”）来表示缺失的额外代码。注意，我在这里没有使用代码字体。如果你看到带有代码字体的省略号，则代码必须包含这三个点作为一种语言特性（例如“`typename...`”）。\n\
  *   在头文件中，我通常跳过预处理保护符（pre guards）。所有头文件应该具有如下的内容：\n\n```\n #ifndef MYFILE_HPP\n\
  \  #define MYFILE_HPP\n  ...\n  #endif  // MYFILE_HPP\n```\n\n因此，在你的项目中使用这些头文件时，请务必小心并修复代码。\n\
  \n## 2.5 C++ 标准\n\nC++ 有由不同的 C++ 标准定义的多个版本。\n\n最初的 C++ 标准于 1998 年发布，随后在 2003 年通过*技术勘误*（technical\
  \ corrigendum）进行了修订，对原始标准提供了细小的修正和澄清。这个“旧 C++ 标准”被称为 `C++98` 或 `C++03`。\n\n“现代 C++”的世界始于\
  \ `C++11`，并经 `C++14` 和 `C++17` 扩展。国际 C++ 标准委员会现在的目标是每三年发布一个新标准。显然，这为大量添加留下的时间更少，但它将变化更快速地带给更广泛的编程社区。因此，开发较大的特性需要时间，并可能跨越多个标准。\n\
  \n`C++20` 现在是下一次“更加现代的 C++”演变的开始。再次，几种编程方式可能会发生变化。然而，如往常一样，编译器需要一些来提供最新的语言特性。在编写本书时，`C++20`\
  \ 已经至少得到了主要编译器的支持。然而，编译器在支持不同特性方面存在差异。\n\n## 2.6 示例代码和附加信息\n\n你可以从本书的网站访问所有示例并获取有关本书的信息，网址为：\n\
  \n`[`www.cppstd20.com`](http://www.cppstd20.com)`\n\n## 2.7 反馈\n\n我欢迎你的建设性意见——无论是正面的还是负面的。我非常努力为你带来一本我希望是优秀的书。然而，在某个时刻我必须停止编写、评审和调整以“发布新版本”。你的反馈让我有机会修复这些问题，通过网站告知所有读者，并改进任何后续修订或版本。\n\
