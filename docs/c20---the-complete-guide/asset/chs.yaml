  \n如果你使用电子书，你可能想确保拥有本书最新版本（记住它是增量编写和出版的）。在提交报告之前，你应该检查书籍网站查看已知的错误。在任何情况下，在提供反馈时请参考此版本的发布日期。当前发布日期为\
  \ `2021-12-31`（你也可以在封底后的第二页找到它）。\n\n非常感谢。\n\n# 3. 比较与运算符 `<=>`\n\nC++20 简化了自定义类型的比较定义，并引入了处理它们的更好方法。为此，引入了新的运算符\
  \ `<=>`（称为*飞船运算符*）。\n\n本章介绍了如何使用这些新特性自 C++20 以来定义和处理比较。\n\n## 3.1 运算符 `<=>` 的动机\n\
  \n让我们首先激励自 C++20 以来处理比较的新方法。\n\n### 3.1.1 在 C++20 之前定义比较运算符\n\n\n\n在 C++20 之前，你必须为一个类型定义六个运算符，以便对其对象的所有可能的比较提供完整支持。\n\
  \n例如，如果你想比较类型 `Value`（具有整型 ID）的对象，你必须实现以下内容：\n\n```cpp\nclass Value {\n private:\n\
  \  long id;\n  ...\n public:\n  ...\n  // 等等运算符:\n  bool operator== (const Value&\
  \ rhs) const {\n    return id == rhs.id;      // 基本等性检查\n  }\n  bool operator!=\
  \ (const Value& rhs) const {\n    return !(*this == rhs);   // 派生检查\n  }\n\n  //\
  \ 关系运算符:\n  bool operator< (const Value& rhs)  const {\n    return id < rhs.id;\
  \       // 基础排序检查\n  }\n  bool operator<= (const Value& rhs) const {\n    return\
  \ !(rhs < *this);    // 派生检查\n  }\n  bool operator> (const Value& rhs)  const {\n\
  \    return rhs < *this;       // 派生检查\n  }\n  bool operator>= (const Value& rhs)\
  \ const {\n    return !(*this < rhs);    // 派生检查\n  }\n};\n```\n\n这使得你能够调用任何六个比较运算符来比较\
  \ `Value`（运算符所定义的对象）和另一个 `Value`（作为参数 `rhs` 传递）。例如：\n\n```cpp\nValue v1, v2;\n...;\n\
  if (v1 <= v2) {   // 调用 v1.operator<=(v2)\n  ...\n}\n```\n\n运算符也可能被间接调用（例如通过调用 `sort()`）：\n\
  \n```cpp\nstd::vector<Value> coll;\n...;\nstd::sort(coll.begin(), coll.end()); \
  \ // 使用 operator < 进行排序\n```\n\n自 C++20 起，该调用也可以改用 ranges：\n\n```cpp\nstd::ranges::sort(coll);\
  \              // 使用 operator < 进行排序\n```\n\n问题在于，尽管大多数运算符都是根据其他运算符定义的（它们都基于运算符\
  \ `==` 或运算符 `<`），但这些定义非常繁琐，并且增加了大量的视觉干扰。\n\n此外，对于一个实现良好的类型，你可能还需要更多：\n\n- 如果运算符不会抛出异常，则使用\
  \ `noexcept` 声明运算符\n- 如果运算符可以在编译时使用，则使用 `constexpr` 声明运算符\n- 如果构造函数不是 `explicit`，则将运算符声明为“隐藏友”（在类结构内部使用\
  \ `friend` 声明它们，以便两个操作数变为参数并支持隐式类型转换）\n- 使用 `[[nodiscard]]` 声明运算符以便在返回值未被使用时发出警告\n\
  \n例如：\n\n```cpp\nclass Value {\n private:\n  long id;\n  //...\n public:\n  constexpr\
  \ Value(long i) noexcept  // 支持隐式类型转换\n   : id{i} {\n  }\n  //...\n  // 等等运算符:\n\
  \  [[nodiscard]] friend constexpr\n  bool operator== (const Value& lhs, const Value&\
  \ rhs) noexcept { \n    return lhs.id == rhs.id;      // 基本等性检查\n  }\n  [[nodiscard]]\
  \ friend constexpr\n  bool operator!= (const Value& lhs, const Value& rhs) noexcept\
  \ { \n    return !(lhs == rhs);         // 派生不等性检查\n  }\n\n  // 关系运算符:\n  [[nodiscard]]\
  \ friend constexpr\n  bool operator< (const Value& lhs, const Value& rhs) noexcept\
  \ { \n    return lhs.id < rhs.id;       // 基本排序检查\n  }\n  [[nodiscard]] friend constexpr\n\
  \  bool operator<= (const Value& lhs, const Value& rhs) noexcept { \n    return\
  \ !(rhs < lhs);          // 派生检查\n  }\n  [[nodiscard]] friend constexpr\n  bool\
  \ operator> (const Value& lhs, const Value& rhs) noexcept { \n    return rhs < lhs;\
  \             // 派生检查\n  }\n  [[nodiscard]] friend constexpr\n  bool operator>=\
  \ (const Value& lhs, const Value& rhs) noexcept { \n    return !(lhs < rhs);   \
  \       // 派生检查\n  }\n};\n```\n\n`lang/valueold.hpp`:\n\n### 3.1.2 自 C++20 起的比较运算符定义\n\
  \n自 C++20 起，关于比较运算符发生了几点变化。\n\n#### 3.1.2.1 运算符 `==` 意味着运算符 `!=`\n\n现在要检查等性，只需定义运算符\
  \ `==` 就足够了。\n\n这是因为如果对于表达式 `a!=b` 找不到任何实现，编译器会重写该表达式并寻找 `!(a==b)`。如果这不起作用，编译器还会尝试交换操作数的顺序，因此也会尝试\
  \ `!(b==a)`：\n\n```cpp\na != b  // 尝试：a!=b, !(a==b), 以及 !(b==a)\n```\n\n因此，对于类型\
  \ `TypeA` 的 `a` 和类型 `TypeB` 的 `b`，如果存在以下内容，编译器将能够编译\n\n```cpp\na != b\n```\n\n-\
  \ 一个独立的 `operator!=(TypeA, TypeB)`\n- 一个独立的 `operator==(TypeA, TypeB)`\n- 一个独立的\
  \ `operator==(TypeB, TypeA)`\n- 成员函数 `TypeA::operator!=(TypeB)`\n- 成员函数 `TypeA::operator==(TypeB)`\n\
  - 成员函数 `TypeA::operator==(TypeB)` （注：原文此处可能重复，已按原样保留）\n\n#### 3.1.2.2 运算符 `=>`\n\
  \n在 C++20 中，只需定义运算符 `<=>` 即可启用所有比较。例如：\n\n```cpp\n#include <compare>\n\nclass Value\
  \ {\n private:\n  long id;\n  ...\n public:\n  constexpr Value(long i) noexcept\n\
  \   : id{i} {\n  }\n  //...\n  // 启用所有运算符的使用\n  auto operator<=> (const Value& rhs)\
  \ const  = default;\n};\n```\n\n`lang/value20.hpp`:\n\n通常情况下，`operator==` 关注等运算符，而\
  \ `operator<=>` 关注关系运算符。然而，通过通过 `=default` 声明 `operator<=>`，它会生成相应的 `operator==`，因此我们实际上获得了：\n\
  \n```cpp\nclass Value {\n  ...\n  auto operator<=> (const Value& rhs) const  = default;\n\
  \  auto operator== (const Value& rhs) const  = default;  // 隐式生成\n};\n```\n\n效果是两个运算符都使用它们的默认实现，该实现逐成员地比较对象。这意味着类中成员的顺序非常重要。\n\
  \n因此，通过\n\n```cpp\nclass Value {\n  ...\n  auto operator<=> (const Value& rhs) const\
  \  = default;\n};\n```\n\n我们获得了使用所有六个比较运算符所需的所有内容。\n\n此外，即使将运算符声明为成员函数，生成的运算符\n\n\
  - 如果比较成员不会抛出异常，则它们是 `noexcept`\n- 如果比较成员可以在编译时进行，则它们是 `constexpr`\n- 得益于*重写*，第一个操作数的隐式类型转换也被支持（尽管它不是作为参数传递的），只要定义了相应的隐式类型转换\n\
  - 如果比较结果未被使用，可能会发出警告（但这取决于编译器）\n\n\n\n\n\n```cpp\n#include <compare>\n\nclass Value\
  \ {\n private:\n  long id;\n  //...\n public:\n  constexpr Value(long i) noexcept\n\
  \   : id{i} {\n  }\n  //...\n  // 用于相等性运算符：\n  bool operator== (const Value& rhs)\
  \ const { \n    return id == rhs.id;      // 定义相等性 (== 和 !=)\n  }\n  // 用于关系运算符：\n\
  \  auto operator<=> (const Value& rhs) const { \n    return id <=> rhs.id;     //\
  \ 定义顺序 (<, <=, >, 和 >=)\n  }\n};\n```\n\n### `lang/value20def.hpp`\n\n通过这种方式，你可以指定哪些成员以及什么顺序很重要，或者实现特殊行为。\n\
  \n这些基础运算符的工作原理是：如果一个表达式使用了其中一个比较运算符且没有找到匹配的直接定义，该表达式将被`rewritten`（重写），以便可以使用这些运算符。对应于重写相等运算符调用，重写也可能会改变关系操作数的顺序，这可能允许第一个操作数进行隐式类型转换。例如，如果\n\
  \n```\nx <= y\n```\n\n没有找到 `operator<=` 的匹配定义，它可能会被重写为：\n\n```\n(x <=> y) <= 0\n\
  ```\n\n甚至可能是\n\n```\n0 <= (y <=> x)\n```\n\n如你通过这种重写看到的，新的 `operator<=>` 执行三路比较，它产生一个你可以与\
  \ `0` 进行比较的值：\n\n- 如果 `x<=>y` 的值等于 `0`，则 `x` 和 `y` 相等或等价。\n- 如果 `x<=>y` 的值小于 `0`，则\
  \ `x` 小于 `y`。\n- 如果 `x<=>y` 的值大于 `0`，则 `x` 大于 `y`。\n\n请注意 `operator<=>` 的返回类型不是整数。返回类型是一个指示`比较类别`（comparison\
  \ category）的类型，它可以是 `strong ordering`（强序）、`weak ordering`（弱序）或 `partial ordering`（偏序）。这些类型支持与\
  \ `0` 比较以处理结果。\n\n## 3.2 定义和使用比较\n\n接下来的章节将解释 C++20 之后处理比较运算符的细节。\n\n### 3.2.1 使用运算符\
  \ `<<=>`\n\n运算符 `<=>` 是一个新的二元运算符。它被定义在所有定义了关系运算符的基础数据类型上。像常一样，它可以作为 `operator<=>()`\
  \ 由用户定义。\n\n运算符 `<=>` 的优先级高于所有其他比较运算符，因此在输出语句中使用它时需要括号，但在将其结果与其他值比较时则不需要：\n\n```\n\
  std::cout << (0 < x <=> y) << '\\n';  // 调用 0 < (x <=> y)\n```\n\n请注意，你必须包含一个特定的头文件来处理运算符\
  \ `<=>` 的结果：\n\n```cpp\n#include <compare>\n```\n\n然而，大多数标准类型（字符串、容器、`<utility>`）的头文件已经包含了该头文件。若要在不需要此头文件的值或类型上调用该运算符，你必须包含\
  \ `<compare>`。例如：\n\n```cpp\n#include <compare>   // 用于调用 <=>\n\nauto x = 3 <=>\
  \ 4;    // 没有头文件 <compare> 将无法编译\n```\n\n### 3.2.2 比较类别类型\n\n新的运算符 `<=>` 不返回布尔值。相反，它的行为类似于三路比较，产生负值表示\
  \ `less`（小于），正值表示 `greater`（大于），`0` 表示 `equal`（相等）或等价。这种行为与 C 函数 `strcmp()` 的返回值相似；但有一个重要的区别：返回值不是整数值。C++\
  \ 标准库提供了三种可能的返回类型，反映了比较的类别。\n\n#### 3.2.2.1 比较类别\n\n在比较两个值以对其进行排序时，可能会发生不同类别的行为：\n\
  \n- 使用 `strong ordering`（也称为 `total ordering` 全序），给定类型的任何值要么`小于`、要么`等于`或`大于`该类型的任何其他值（包括其自身）。\n\
  \n  该类的典型示例是整数值或常见的字符串类型。字符串 `s1` 要么小于或等于 `s2`，要么大于 `s2`。\n\n  如果一个值既不小于也不大于，那么它必须相等。如果你有多个对象，可以按升序或降序对它们进行排序（相等值之间可以是任何顺序）。\n\
  \n- 使用 `weak ordering`（弱序），给定类型的任何值要么`小于`、要么`等价`或`大于`该类型的任何其他值（包括其自身）。然而，等价的值不必相等（具有相同的值）。\n\
  \n  该类的典型示例是不区分大小写的字符串类型。字符串 `\"hello\"` 小于 `\"hello1\"` 且大于 `\"hell\"`。然而，`\"hello\"\
  ` 与 `\"HELLO\"` 等价，尽管这两个字符串并不相等。\n\n  如果一个值既不小于也不大于，那么它必须等价。如果你有多个对象，可以按升序或降序对它们进行排序（等价值之间可以是任何顺序）。\n\
  \n- 使用 `partial ordering`（偏序），给定类型的任何值都可能是`小于`、`等价`或`大于`该类型的任何其他值（包括其自身）。然而，也可能无法在两个值之间指定特定的顺序。\n\
  \n  该类的典型示例是浮点类型，因为它们可能包含 `NaN`（非数字），任何与 `NaN` 的比较都会产生 `false`。\n\n  如果你有多个对象，可能无法按升序或降序进行排序。\n\
  \n#### 3.2.2.2 标准库中的比较类别\n\n对于不同的比较类别，C++20 标准引入了以下类型：\n\n- `std::strong_ordering`，具有值：\n\
  \n  - `std::strong_ordering::less`\n  - `std::strong_ordering::equal`\n    （也可以可用\
  \ `std::strong_ordering::equivalent`）\n  - `std::strong_ordering::greater`\n\n-\
  \ `std::weak_ordering`，具有值：\n\n  - `std::weak_ordering::less`\n  - `std::weak_ordering::equivalent`\n\
  \  - `std::weak_ordering::greater`\n\n- `std::partial_ordering`，具有值：\n\n  - `std::partial_ordering::less`\n\
  \  - `std::partial_ordering::equivalent`\n  - `std::partial_ordering::greater`\n\
  \  - `std::partial_ordering::unordered`\n\n注意，所有类型都有 `less`、`greater` 和 `equivalent`。然而，`strong_ordering`\
  \ 还有 `equal`，它在那里等同于 `equivalent`，而 `partial_ordering` 拥有值 `unordered`，既不小于也不大于。\n\
  \n强比较类型具有隐式转换为弱比较类型的转换。这意味着你可以将任何 `strong_ordering` 值作为 `weak_ordering` 或 `partial_ordering`\
  \ 值使用（`equal` 变为 `equivalent`）。\n\n### 3.2.3 在 `operator<=>` 中使用比较类别\n\n新的运算符 `<=>`\
  \ 应该返回比较类别之一的值，表示比较的结果，以及该结果是否能够创建强序/全序、弱序或偏序的信息。\n\n例如，这是为类型 `MyType` 定义自由 `operator<=>`\
  \ 的方式：\n\n```cpp\nstd::strong_ordering operator<=> (MyType, MyOtherType y)\n{\n\
  \  if (xIsEqualToY)  return std::strong_ordering::equal;\n  if (xIsLessThanY)  return\
  \ std::strong_ordering::less;\n  return std::strong_ordering::greater;\n}\n```\n\
  \n或者作为一个更具体的示例，为类型 `MyType` 定义 `operator<=>`：\n\n```cpp\nclass MyType {\n  ...\n\
  \  std::strong_ordering operator<=> (const MyType& rhs) const {\n    return value\
  \ == rhs.value ? std::strong_ordering::equal :\n           value < rhs.value ? std::strong_ordering::less\
  \ :\n                               std::strong_ordering::greater;\n  }\n};\n```\n\
  \n\n\n\n然而，通常通过将运算符映射到其底层类型的类型来定义该运算符会更简单。因此，上面的成员函数 `operator<=>` 最好直接返回其成员变量 `value`\
  \ 的值和类别：\n\n```cpp\nclass MyType {\n  ...\n  auto operator<=> (const MyType& rhs)\
  \ const {\n    return value <=> rhs.value;\n  }\n};\n```\n\n这不仅返回了正确的值，还确保了返回值根据成员变量\
  \ `value` 的类型具有正确的比较类别类型。\n\n### 3.2.4 调用 `operator<=>`\n\n你可以直接调用任何定义的 `<=>` 运算符：\n\
  \n```cpp\nMyType x, y;\n...\nx <=> y        // 产生结果比较类别类型的值\n```\n\n按照目前的写法，`operator<=>`\
  \ 对于所有定义了关系运算符的基础基础类型都是预先定义的。例如：\n\n```cpp\nint x = 17, y = 42;\nx <=> y       \
  \        // 产生 std::strong_ordering::less\nx <=> 17.0            // 产生 std::partial_ordering::equivalent\n\
  &x <=> &x             // 产生 std::strong_ordering::equal\n&x <=> nullptr        //\
  \ 错误：不支持与 nullptr 的关系比较\n```\n\n此外，所有提供关系运算符的 C++ 标准库类型现在也都提供了 `operator<=>`。例如：\n\
  \n```cpp\nstd::string{\"hi\"} <=> \"hi\"                 // 产生 std::strong_ordering::equal;\n\
  std::pair{42, 0.0} <=> std::pair{42, 7.7}  // 产生 std::partial_ordering::less\n```\n\
  \n对于你自己的类型，只需要将 `operator<=>` 定义为成员函数或自由函数即可。\n\n返回类型取决于比较类别。你可以针对特定的返回值进行检查：\n\n\
  ```cpp\nif (x <=> y == std::partial_ordering::equivalent)  // 总是安全的\n```\n\n由于向更弱排序类型的隐式类型转换，即使\
  \ `operator<=>` 产生 `strong_ordering` 或 `weak_ordering` 值，这段代码也能通过编译。\n\n然而，相反的操作是不可行的。如果比较产生\
  \ `weak_ordering` 或 `partial_ordering` 值，你无法将其与 `strong_ordering` 值进行比较。\n\n```cpp\n\
  if (x <=> y == std::strong_ordering::equal)   // 可能无法编译\n```\n\n然而，与 `0` 的比较总是可能的且通常更简单：\n\
  \n```cpp\nif (x <=> y == 0)       // 总是安全的\n```\n\n此外，由于新的[关系运算符调用的重写]，`operator<=>`\
  \ 可能会被间接调用：\n\n```cpp\nif (!(x < y || y < x))  // 可能调用 operator<=> 来检查相等性\n```\n\
  \n或者：\n\n```cpp\nif (x <= y && y <= x)   // 可能调用 operator<=> 来检查相等性\n```\n\n注意，`operator!=`\
  \ 永远不会被重写为调用 `operator<=>`。但是，它可能会调用一个由于默认 `operator<=>` 成员而隐式生成的 `operator==` 成员。\n\
  \n### 3.2.5 处理多个排序标准\n\n为了根据多个属性计算 `operator<=>` 的结果，你通常只需要实现一个子比较链，直到结果不相等/不等价或你达到了要比较的最后一个属性：\n\
  \n```cpp\nclass Person {\n  ...\n  auto operator<=> (const Person& rhs) const {\n\
  \    auto cmp1 = lastname <=> rhs.lastname;    // 排序的主成员\n    if (cmp1 != 0) return\
  \ cmp1;               // 如果不等则返回结果\n    auto cmp2 = firstname <=> rhs.firstname;\
  \  // 排序的次成员\n    if (cmp2 != 0) return cmp2;               // 如果不等则返回结果\n    return\
  \ value <=> rhs.value;               // 排序的最终成员\n  }\n};\n```\n\n然而，如果属性具有不同的比较类别，返回类型将无法编译。例如，如果成员\
  \ `name` 是字符串而成员 `value` 是 `double`，就会产生冲突的返回类型：\n\n```cpp\nclass Person {\n  std::string\
  \ name;\n  double value;\n  ...\n  auto operator<=> (const Person& rhs) const {\
  \  // 错误：推导出了不同的返回类型\n    auto cmp1 = name <=> rhs.name;\n    if (cmp1 != 0) return\
  \ cmp1;    // 为 std::string 返回 strong_ordering\n    return value <=> rhs.value;\
  \    // 为 double 返回 partial_ordering\n  }\n};\n```\n\n在这种情况下，你可以定义转换为最弱的比较类型。如果你知道最弱的比较类型，可以直接将其作为返回类型：\n\
  \n```cpp\nclass Person {\n  std::string name;\n  double value;\n  ...\n  std::partial_ordering\
  \ operator<=> (const Person& rhs) const {  // 安全\n    auto cmp1 = name <=> rhs.name;\n\
  \    if (cmp1 != 0) return cmp1;    // strong_ordering 转换为返回类型\n    return value\
  \ <=> rhs.value;    // partial_ordering 被用返回类型\n  }\n};\n```\n\n如果你不知道比较类型（例如，它们的类型是一个模板参数），可以使用新的类型特性\
  \ `std::common_comparison_category<>` 来计算最强的比较类别：\n\n```cpp\nclass Person {\n  std::string\
  \ name;\n  double value;\n  ...\n  auto operator<=> (const Person& rhs) const  \
  \  // 安全\n   -> std::common_comparison_category<decltype(name <=> rhs.name), decltype(value\
  \ <=> rhs.value)> {\n    auto cmp1 = name <=> rhs.name;\n    if (cmp1 != 0) return\
  \ cmp1;\n    return value <=> rhs.value;\n  }\n};\n```\n\n## 3.3 定义 `operator<=>`\
  \ 和 `operator==`\n\n你可以为你的数据类型定义 `operator<=>` 和 `operator==`：\n\n- 可以是接受一个参数的成员函数\n\
  - 或者接受两个参数的自由函数\n\n在类或数据结构内部（作为成员或 `friend` 函数），这两个运算符都可以声明为默认 `=default`。成员函数必须将第二个参数作为\
  \ `const` 左值引用（`const &`）。自由函数也可以按值传递两个参数。\n\n对于 `operator<=>` 和 `operator==` 的默认定义：\n\
  \n- 如果比较成员保证不抛出异常，则运算符为 `noexcept`。\n- 如果比较可以在编译时完成，则运算符为 `constexpr`。\n\n### 3.3.1\
  \ 默认的 `operator<=>`\n\n当且仅当 `operator<=>` 成员被定义为默认时，根据定义相应的 `operator==` 成员也会定义。所有方面（可见性、`virtual`、属性、要求等）都会被采用。例如：\n\
  \n```cpp\ntemplate<typename T>\nclass Type {\n  ...\n public:\n  [[nodiscard]] virtual\
  \ std::strong_ordering\n     operator<=>(const Type&) const requires(!std::same_as<T,bool>)\
  \ = default;\n};\n```\n\n等于以下内容：\n\n```cpp\ntemplate<typename T>\nclass Type {\n\
  \  ...\n public:\n  [[nodiscard]] virtual std::strong_ordering\n     operator<=>\
  \ (const Type&) const requires(!std::same_as<T,bool>) = default;\n\n  [[nodiscard]]\
  \ virtual bool\n     operator== (const Type&) const requires(!std::same_as<T,bool>)\
  \ = default;\n};\n```\n\n例如，以下内容对于以支持 `Coord` 类型对象的所有 6 个比较运算符：\n\n\n\n\n\n```cpp\n\
  #include <compare>\n\nstruct Coord {\n  double x{};\n  double y{};\n  double z{};\n\
  \  auto operator<=>(const Coord&) const = default;\n};\n```\n\n`lang/coord.hpp`:\n\
  \n再次注意，该成员函数必须是 `const` 的，且参数必须声明为 `const` 左值引用（`const` `&`）。\n\n你可以如下使用此数据结构：\n\
  \n```cpp\n#include \"coord.hpp\"\n#include <iostream>\n#include <algorithm>\n\n\
  int main()\n{\n  std::vector<Coord> coll{ {0, 5, 5}, {5, 0, 0}, {3, 5, 5},\n   \
  \                        {3, 0, 0}, {3, 5, 7} };\n\n  std::sort(coll.begin(), coll.end());\n\
  \  for (const auto& elem : coll) {\n    std::cout << elem.x << '/' << elem.y <<\
  \ '/' << elem.z << '\\n';\n  }\n}\n```\n\n`lang/coord.cpp`:\n\n该程序的输出如下：\n\n```\n\
  0/5/5\n3/0/0\n3/5/5\n3/5/7\n5/0/0\n```\n\n### 3.3.2 默认的 `operator<=>` 与继承\n\n如果\
  \ `operator<=>` 是默认生成的（defaulted），且你有一个基类并调用了其中一个关系运算符，那么会发生以下情况：\n\n* 如果基类定义了 `operator<=>`，则调用该运算符。\n\
  * 否则，将调用 `operator==` 和 `operator<` 来判断（从基类的角度来看）：\n    * 对象是否`相等`/`等价`的（`operator==`\
  \ 返回 `true`）\n    * 对象是`小于` 还是`大于`\n    * 对象是`无序`的（仅在检查偏序时）\n\n在这种情况下，调用这些运算符的默认生成的\
  \ `operator<=>` 的返回类型不能是 `auto`。\n\n例如，考虑以下声明：\n\n```cpp\nstruct Base {\n  bool\
  \ operator==(const Base&) const;\n  bool operator<(const Base&) const;\n};\n\nstruct\
  \ Derived : public Base {\n  std::strong_ordering operator<=> (const Derived&) const\
  \ = default;\n};\n```\n\n那么：\n\n```cpp\nDerived d1, d2;\nd1 > d2;  // 调用 Base::operator==\
  \ 以及可能的 Base::operator<\n```\n\n如果 `operator==` 返回 `true`，我们知道 `>` 的结果是 `false`，仅此而已。否则，会调用\
  \ `operator<` 来确定该表达式是 `true` 还是 `false`。\n\n使用：\n\n```cpp\nstruct Derived : public\
  \ Base {\n  std::partial_ordering operator<=> (const Derived&) const = default;\n\
  };\n```\n\n编译器可能会调用两次 `operator<` 来确定是否存在任何顺序。\n\n使用：\n\n```cpp\nstruct Base {\n\
  \  bool operator==(const Base&) const;\n  bool operator<(const Base&) const;\n};\n\
  \nstruct Derived : public Base {\n  auto operator<=> (const Derived&) const = default;\n\
  };\n```\n\n编译器不会编译任何带有关系运算符的，因为它无法判断基类属于哪种排序类别。在这种情况下，你需要在基类中也需要 `operator<=>`。\n\
  \n然而，等性检查可以工作，因为在 `Derived` 中，`operator==` 会自动声明等同于以下：\n\n```cpp\nstruct Derived\
  \ : public Base {\n  auto operator<=> (const Derived&) const = default;\n  bool\
  \ operator== (const Derived&) const = default;\n};\n```\n\n所以我们有如下行为：\n\n```cpp\n\
  Derived d1, d2;\nd1 > d2;   // 错误：无法推导出 operator<=> 的比较类别\nd1 != d2;  // OK（注意：仅尝试了\
  \ operator<=> 和 Base::operator==）\n```\n\n\n\n\n\n通常情况下，类最好将 `operator==()` 定义为“隐藏友元”（hidden\
  \ friend）（在类结构内部使用 `friend` 声明它们，以便这两个运算符都变成参数并支持隐式类型转换）。然而，这也是实现相同效果的有效方法。\n\n\
  遗憾的是，这段代码在 `C++20` 中不再工作。它会导致无限递归。原因是在全局函数内部，表达式 `t == i` 也可以调用它自己（全局的 `operator==()`），因为编译器也会尝试将该调用重写为\
  \ `t == i`：\n\n```cpp\nbool operator==(int i, const MyType& t) {\n  return t ==\
  \ i;   // 除了找到 t.operator(MyType{i}) 外，还找到了 operator==(i,t)\n}\n```\n\n遗憾的是，重写后的语句是更好的匹配项，因为不需要隐式类型转换。我们还没有解决方案来支持这里的向后兼容性；然而，编译器已经开始对这样的代码发出警告。\n\
  \n```cpp\nif the constructors are not `explicit`\n```\n\n## 3.6 后后记\n\n对隐式定义比较运算符的请求由\
  \ Oleg Smolsky 首次在 [`wg21.link/n3950`](http://wg21.link/n3950) 中提出。随后 Bjarne Stroustrup\
  \ 在 [`wg21.link/n4175`](http://wg21.link/n4175) 再次提出了该问题。然而，最终提出的表述（由 Jens Maurer\
  \ 在 [`wg21.link/p0221r2`](http://wg21.link/p0221r2) 中制定）最终被拒绝了，因为这是一个退出式功能（因此，现有类型将自动拥有比较运算符，除非它们声明自己不需要此功能）。随后考虑了各种提议，Herb\
  \ Sutter 在 [`wg21.link/p0515r0`](http://wg21.link/p0515r0) 中汇总了这些。\n\n最终接受的表述由 Herb\
  \ Sutter、Jens Maurer 和 Walter E. Brown 在 [`wg21.link/p0515r3`](http://wg21.link/p0515r3)\
  \ 和 [`wg21.link/p0768r1`](http://wg21.link/p0768r1) 中制定。然而，接受了由 Barry Revzin 在 [`wg21.link/p1185r2`](http://wg21.link/p1185r2)\
  \ 和 [`wg21.link/p1630r1`](http://wg21.link/p1630r1) 中制定的重大修改。\n\n# 4. 函数参数的占位类型\n\
  \n泛型编程是 `C++` 的核心范式。因此，`C++20` 也为泛型编程提供了若干新功能。然而，有一个基础扩展，我们在书中或多少需要它：你现在可以使用 `auto`\
  \ 和其他占位类型来声明普通函数的参数。\n\n随后的章节将介绍更多泛型扩展：\n\n* 非类型模板参数的扩展\n* Lambda 模板\n\n## 4.1.\
  \ 普通函数参数的 auto\n\n自 `C++14` 以来，lambda 就可以使用 `auto` 等占位符来声明/定义它们的参数：\n\n```cpp\n\
  auto printColl = [] (const auto& coll) {  // 泛型 lambda\n                   for (const\
  \ auto& elem : coll) {\n                     std::cout << elem << '\\n';\n     \
  \              }\n                 }\n```\n\n它们允许我们传递任何类型的参数，只要 lambda 内部的操作受支持：\n\
  \n```cpp\nstd::vector coll{1, 2, 4, 5};\n...\nprintColl(coll);                 \
  \ // 为 vector<int> 编译 lambda\n\nprintColl(std::string{\"hello\"});  // 为 std::string\
  \ 编译 lambda\n```\n\n自 `C++20` 起，你可以对所有函数（包括成员函数和运算符）使用 `auto` 等占位符：\n\n```cpp\n\
  void printColl(const auto& coll)  // 泛型函数\n{\n  for (const auto& elem : coll) {\n\
  \    std::cout << elem << '\\n';\n  }\n}\n```\n\n这种声明只是声明/定义如下模板的快捷方式：\n\n```cpp\n\
  template<typename T>\nvoid printColl(const T& coll)     // 等价的泛型函数\n{\n  for (const\
  \ auto& elem : coll) {\n    std::cout << elem << '\\n';\n  }\n}\n```\n\n唯一的区别是，通过使用\
  \ `auto` 你不再有模板参数 `T` 的名称。由于由于原因，这种特征也被称为*简化函数模板*语法。\n\n由于带有 `auto` 的函数是函数模板，因此所有使用函数模板的规则都适用。这特别导致了你不能在一个编译单元（CPP\
  \ 文件）中实现带有 `auto` 参数的函数，而在另一个编译单元中调用它。带有 `auto` 参数的函数应该放在头文件中，以便在多个 CPP 文件中使用（或者你必须在一个编译单元中显式地实例化该函数）。然而，它不需要声明为\
  \ `inline`，因为函数模板总是内联的。\n\n#### 4.1.1. 成员函数参数的 auto\n\n你也可以使用此功能来定义成员函数：\n\n```cpp\n\
  class MyType {\n  ...\n  void assign(const auto& newVal);\n};\n```\n\n该声明等同于（区别是这里没有类型）：\n\
  \n```cpp\nclass MyType {\n  ...\n  template<typename T>\n  void assign(const T&\
  \ newVal);\n};\n```\n\n\n\n\n## 4.3 后记\n\n`auto` 以及其他用于普通函数参数的占位符类型首次提出，并包含了对这些类型使用类型约束的选项，由\
  \ Ville Voutilainen, Thomas Köppe, Andrew Sutton, Herb Sutter, Gabriel Dos Reis,\
  \ Bjarne Stroustrup, Jason Merrill, Hubert Tong, Eric Niebler, Casey Carter, Tom\
  \ Honermann 和 Erich Keane 在 [`wg21.link/p1141r0`](http://wg21.link/p1141r0) 中提出。最终接受的说法由\
  \ Ville Voutilainen, Thomas Köppe, Andrew Sutton, Herb Sutter, Gabriel Dos Reis,\
  \ Bjarne Stroustrup, Jason Merrill, Hubert Tong, Eric Niebler, Casey Carter, Tom\
  \ Honermann, Erich Keane, Walter E. Brown, Michael Spertus 和 Richard Smith 在 [`wg21.link/p1141r2`](http://wg21.link/p1141r2)\
  \ 中制定。\n\n# 5. 概念与要求\n\n本章介绍了 C++ 的新特性*概念（concepts）*，使用了 `concept` 和 `requires`\
  \ 关键字。\n\n毫无疑问，*概念*是 C++ 的一个里程碑，因为概念为我们在编写泛型代码时非常需要的功能提供了语言级支持：指定*要求（requirements）*。尽管之前已经有一些通变方法，但我们现在有了一种简单且易读的方式来指定泛型代码的要求，在要求不满足时获得更好的诊断信息，在泛型代码无法工作时将其禁用（尽管它可以通过编译），并针对不同类型切换不同的泛型代码。\n\
  \n## 5.1 概念与要求的要求的动因示例\n\n考虑以下返回两个值中最大值的函数模板：\n\n```cpp\ntemplate<typename T>\n\
  T maxValue(T a, T b) {\n  return b < a ? a : b;\n}\n```\n\n该函数模板可以为两个相同类型的参数进行调用，前提是为参数执行的操作（通过\
  \ `operator<` 比较和拷贝）是有效的。\n\n然而，传递两个指针将是比较它们的内存地址，而不是它们所引用的值。\n\n### 5.1.1 逐步改进模板\n\
  \n#### 5.1.1.1 使用 `requires` 子句\n\n为了修复这个问题，我们可以为模板配备一个*约束（constraint）*，使得当传递原始指针时它是不可用的：\n\
  \n```cpp\ntemplate<typename T>\nrequires (!std::is_pointer_v<T>)\nT maxValue(T a,\
  \ T b)\n{\n  return b < a ? a : b;\n}\n```\n\n在这里，约束是在 `requires 子句` 中定义的，该子句通过\
  \ `requires` 关键字引入（还有其他定义约束的方法）。\n\n为了指定模板不能用于原始指针的约束，我们使用了标准类型特征 `std::is_pointer_v<>`（它产生标准类型特征\
  \ `std::is_pointer<>` 的 `v` 值成员）。^(2) 有了这个约束，我们无法再对原始指针使用该函数模板了：\n\n```cpp\nint\
  \ x = 42;\nint y = 77;\nstd::cout << maxValue(x, y) << '\\n';      // OK: int 的最大值\n\
  std::cout << maxValue(&x, &y) << '\\n';    // : 未满足约束\n```\n\n该要求是在编译时检查的，对编译后代码的性能没有影响。它仅意味着模板无法用于原始指针。当传递原始指针时，编译器的行为就像该模板不存在一样。\n\
  \n#### 5.1.1.2 定义和使用 `concept`\n\n我们很有可能需要对指针进行多次以上的约束。为此，我们可以为它引入一个*概念（concept）*：\n\
  \n```cpp\ntemplate<typename T>\nconcept IsPointer = std::is_pointer_v<T>;\n```\n\
  \n*概念*是一个模板，在其中我们为对传递的模板参数的一个或多个约束引入一个名称。在等号之后，我们必须将约束指定为在编译时求值的布尔表达式。在这种情况下，我们要求传递给\
  \ `IsPointer<>` 的模板参数必须是原始指针。\n\n现在，我们可以使用这个概念来约束 `maxValue()` 模板：\n\n```cpp\ntemplate<typename\
  \ T>\nrequires (!IsPointer<T>)\nT maxValue(T a, T b)\n{\n  return b < a ? a : b;\n\
  }\n```\n\n#### 5.1.1.3 使用概念进行重载\n\n通过使用约束和概念，我们甚至可以重载 `maxValue()` 模板，为指针提供一个实现，为其他类型提供另一个实现：\n\
  \n```cpp\ntemplate<typename T>\nrequires (!IsPointer<T>)\nT maxValue(T a, T b) \
  \         // maxValue() 不用于指针\n{\n  return b < a ? a : b;       // 比较值\n}\n\ntemplate<typename\
  \ T>\nrequires IsPointer<T>\nauto maxValue(T a, T b)       // maxValue() 用于指针\n\
  {\n  return maxValue(*a, *b);    // 比较指针所指向的值\n}\n```\n\n注意，仅用概念约束模板的 `requires`\
  \ 子句不再需要括号。\n\n现在，我们有两个同名的函数模板，但对于每种类型，只有其中一个是可用的：\n\n```cpp\nint x = 42;\nint y\
  \ = 77;\nstd::cout << maxValue(x, y) << '\\n';      // 调用用于指针的 maxValue()\nstd::cout\
  \ << maxValue(&x, &y) << '\\n';\n```\n\n#### 5.1.1.4 带概念的重载解析\n\n重载解析认为带有约束的模板比没有约束的模板特殊。\n\
  \n```cpp\ntemplate<typename T>\nT maxValue(T a, T b)          // 用于指针\n{\n  return\
  \ b < a ? a : b;       // 比较值\n}\n\ntemplate<typename T>\nrequires IsPointer<T>\n\
  auto maxValue(T a, T b)       // 用于指针\n{\n  return maxValue(*a, *b);    // 比较指针指向的值\n\
  }\n```\n\n#### 5.1.1.5 类型约束\n\n如果约束适用于单个参数，有方法可以简化指定。首先，你可以在声明模板参数时直接指定作为*类型约束*：\n\
  \n```cpp\ntemplate<IsPointer T>   // 用于指针\nauto maxValue(T a, T b)\n{\n  return\
  \ maxValue(*a, *b);     // 比较指针指向的值\n}\n```\n\n此外，你可以在使用 auto 参数时将概念作为类型约束：\n\n\
  ```cpp\nauto maxValue(IsPointer auto a, IsPointer auto b)\n{\n  return maxValue(*a,\
  \ *b);     // 比较指针指向的值\n}\n```\n\n这对于通过引用传递的参数也有效：\n\n```cpp\nauto maxValue3(const\
  \ IsPointer auto& a, const IsPointer auto& b)\n{\n  return maxValue(*a, *b);   \
  \  // 比较指针指向的值\n}\n```\n\n注意，通过直接约束两个参数，我们改变了模板的：我们不再要求 `a` 和 `b` 具有相同类型。我们只要求它们都是任意类型的指针对象。\n\
  \n使用模板语法时，情况如下：\n\n```cpp\ntemplate<IsPointer T1, IsPointer T2>   // 用于指针\nauto\
  \ maxValue(T1 a, T2 b)\n{\n  return maxValue(*a, *b);     // 比较指针指向的值\n}\n```\n\n\
  我们可能也应该允许基础函数模板使用不同的类型。这样做的方法是指定两个模板参数：\n\n```cpp\ntemplate<typename T1, typename\
  \ T2>\nauto maxValue(T1 a, T2 b)      // maxValue() 用于值\n{\n  return b < a ? a :\
  \ b;        // 比较值\n}\n```\n\n另一种方案也是同样使用 `auto` 参数：\n\n\n\n\n\n```cpp\nauto maxValue(auto\
  \ a, auto b)  // 用于值的 maxValue()\n{\n  return b < a ? a : b;        // 比较值\n}\n\
  ```\n\n现在，我们可以传递一个 `int` 指针和一个 `double` 指针。\n\n#### 5.1.1.6 后置 `requires` 子句\n\n\
  考虑 `maxValue()` 的指针版本：\n\n```cpp\nauto maxValue(IsPointer auto a, IsPointer auto\
  \ b)\n{\n  return maxValue(*a, *b);     // 比较指针所指向的值\n}\n```\n\n仍然存在一个并不明显的隐式要求：最终这些值必须是可比较的。\n\
  \n编译器在（递归地）实例化 `maxValue()` 模板时会检测该要求。然而，错误信息可能是问题，因为错误发生得很晚，而且该要求在指针的 `maxValue()`\
  \ 声明中是不可见的。\n\n#### 5.1.1.7 标准概念（Concepts）\n\n为了让指针版本直接声明指针所指向的值是可比较的，我们可以为函数添加另一个约束：\n\
  \n```cpp\nauto maxValue(IsPointer auto a, IsPointer auto b)\nrequires std::three_way_comparable_with<decltype(*a),\
  \ decltype(*b)>\n{\n  return maxValue(*a, *b);\n}\n```\n\n我们在这里用于声明约束的是“后置 `requires`\
  \ 子句”，它可以在参数列表 `after` 指定。它的优点是可以使用参数来制定约束。\n\n在这种情况下，我们使用参数将它们引用的值传递给一个标准概念，该概念检查这些值是否可比较。`three_way_comparable_with`\
  \ 是 C++ 标准库在 `std` 命名空间提供的许多标准概念之一。它的名字来自于使用 `operator<=>` 定义关系运算符的新方法。\n\n####\
  \ 5.1.1.8 `requires` 表达式\n\n到目前为止，`maxValue()` 模板并不适用于非原始指针的指针类型，例如智能指针。如果代码也应该为这些类型编译，那么我们最好将指针定义为对象，我们可以对这些对象调用\
  \ `operator*`。\n\n这种要求自 C++20 以来就很容易指定：\n\n```cpp\ntemplate<typename T>\nconcept\
  \ IsPointer = requires(T p) { *p; };  // 要求调用 operator * 必须有效\n```\n\n我们没有使用用于原始指针的类型特质，而是概念制定了一个简单的要求：对于传递的类型\
  \ `T` 的对象 `p`，表达式 `*p` 必须有效。\n\n在这里，我们再次使用 `requires` 关键字来引入 `requires expression`，它可以为类型和参数定义一个或多个\
  \ `requirements`。通过通过声明一个类型为 `T` 的 `p`，我们可以简单地指定此类对象必须支持哪些操作。\n\n我们还可以要求多个操作、类型成员，以及表达式产生特定的类型。例如：\n\
  \n```cpp\ntemplate<typename T>\nconcept IsPointer = requires(T p) {\n          \
  \            *p;             // operator * 必须有效\n                      {p < p} ->\
  \ std::convertible_to<bool>;  // < 产生 bool\n                      p == nullptr;\
  \   // 可以与 nullptr 比较\n                    };\n```\n\n现在我们指定了三个要求，这些要求都适用于我们为该概念定义的类型\
  \ `T` 的参数 `p`：\n\n*   该类型必须支持运算符 `*`。\n\n*   该类型必须支持运算符 `<`, 且产生产生布尔值。\n\n*   该类型的对象必须与\
  \ `nullptr` 可比较。\n\n注意，我们不需要两个类型为 `T` 的参数来检查是否可以调用 `<`。运行时的值并不重要。但请注意，对于如何指定表达式产生的结果有一些限制（例如，你不能在那里仅指定\
  \ `bool`）。\n\n另外注意，我们这里 `not` 要求 `p` 必须 `nullptr`（我们只能在运行时检查）。我们只要求 `can` 将 `p`\
  \ 与 `nullptr` 比较。然而，这排除了迭代器，因为通常它们不能与 `nullptr` 比较（除非它们被实现为原始指针，如 `std::array<>`）。\n\
  \n再次，这是一个编译时约束，对生成的代码没有影响；我们只决定代码是否以及为哪些类型编译。因此，将参数 `p` 声明为值而不是引用并没有区别。\n\n你也可以将\
  \ `requires expression` 作为临时约束直接用在 `requires clause` 中（这看起来有点奇怪，但一旦你理解了 `requires\
  \ clause` 和 `requires expression` 之间的区别，它就完全合理了）：\n\n```cpp\ntemplate<typename T>\n\
  requires requires(T p) { *p; }  // 使用临时要求约束模板\nauto maxValue(T a, T b)\n{\n  return\
  \ maxValue(*a, *b);\n}\n```\n\n### 5.1.2 整个生成的程序\n\n现在，我们拥有了计算普通值和指针类对象最大值的所有内容。这里是一个完整的程序：\n\
  \n```cpp\n#include <iostream>\n\n// 用于指针类对象的概念：\ntemplate<typename T>\nconcept IsPointer\
  \ = requires(T p) {\n                      *p;             // operator * 必须有效\n\
  \                      p == nullptr;   // 可以与 nullptr 比较\n                     \
  \ {p < p} -> std::convertible_to<bool>;  // < 产生 bool\n                    };\n\n\
  // 用于普通值的 maxValue()：\nauto maxValue(auto a, auto b)\n{\n  return b < a ? a : b;\
  \        // 比较值\n}\n\n// 用于指针的 maxValue()：\nauto maxValue(IsPointer auto a, IsPointer\
  \ auto b)\nrequires std::three_way_comparable_with<decltype(*a), decltype(*b)>\n\
  {\n  return maxValue(*a, *b);     // 比较指针所指向的值\n}\n\nint main()\n{\n  int x = 42;\n\
  \  int y = 77;\n  std::cout << maxValue(x, y) << '\\n';\n  int* xp = &x;\n  int*\
  \ yp = &y;\n  std::cout << maxValue(&xp, &yp) << '\\n';\n\n  double d = 49.9;\n\
  \  std::cout << maxValue(xp, &d) << '\\n';\n}\n```\n\n`lang/maxvalue.cpp`:\n\n注意我们不能检查迭代器值的最大值：\n\
  \n```cpp\n#include <vector>\n#include <algorithm>\nstd::vector coll{0, 8, 15, 11,\
  \ 47};\nauto pos = std::find(coll.begin(), coll.end(), 11);\nif (pos != coll.end())\
  \ {\n  // 迭代器和值的最大值：\n  auto val = maxValue(coll.begin(), pos); // 错误\n}\n```\n\n\
  原因是我们要求参数与 `nullptr` 可比较，这在通常情况下是不行的。这证明了仔细考虑概念的定义是重要的。\n\n## 5.2 概念在实践中的典型应用\n\n\
  有多个理由说明约束和要求的用：\n\n*   约束有助于`理解`模板的限制，并在这些要求被破坏时获得更容易理解的错误信息。\n\n*   约束可以用于在不合理的情况下`禁用泛型代码`：\n\
  \n    *   泛型类型可能会编译，但结果不对。\n\n    *   我们可能需要修复重载解析，即决定调用哪个可调用函数。\n\n*   约束可以用于`重载`或`特化`泛型代码，以便为不同的类型编译不同的代码。\n\
  \n让我们逐步开发另一个示例来详细观察这些原因。通过这种方式，我们还引入了一些关于约束、要求和概念的细节。\n\n### 5.2.1 代码和错误信息的要求\n\n\
  假设我们想编写一种泛型代码，将值插入集合：\n\n```cpp\ntemplate<typename Coll, typename T>\nvoid add(Coll&\
  \ coll, const T& val)\n{\n  coll.push_back(val);\n}\n```\n\n这段代码并不总是编译。对于参数的类型有一个隐藏的要求：容器\
  \ `Coll` 必须支持对类型 `T` 值的 `push_back()` 调用。\n\n\n\n\n\n你也可以认为，这是多个基础要求的组合：\n\n*  \
  \ 类型 `Coll` 必须支持 `push_back()`。\n*   必须存在从类型 `T` 到 `Coll` 元素元素类型的转换。\n*   如果传入的参数具有\
  \ `Coll` 的元素类型，则该类型必须支持拷贝（因为会创建一个用传入的值初始化的新元素）。\n\n如果这些要求中的任何一个没有被满足，代码将无法编译。例如：\n\
  \n```cppcpp\nstd::vector<int> vec;\nadd(vec, 42);       // OK\nadd(vec, \"hello\"\
  );  // ERROR: no conversion from string literal to int\n\nstd::set<int> coll;\n\
  add(coll, 42);      // ERROR: no push_back() supported by std::set<>\n\nstd::vector<std::atomic<int>>\
  \ aiVec;\nstd::atomic<int> ai{42};\nadd(aiVec, ai);     // ERROR: cannot copy/move\
  \ atomics\n```\n\n当编译失败时，错误信息可能会非常清晰，例如在模板的顶层找不到成员 `push_back()` 时：\n\n```cpp\n\
  prog.cpp: In instantiation of 'void add(Coll&, const T&)\n          [with Coll =\
  \ std::__debug::set<int>; T = int]':\nprog.cpp:17:18:   required from here\nprog.cpp:11:8:\
  \ error: 'class std::set<int>' has no member named 'push_back'\n   11 |   coll.push_back(val);\n\
  \      |   ~~~~~^~~~~~~~~\n```\n\n然而，它们也可能非常难以阅读和理解。例如，当编译器必须处理不支持拷贝这一破坏的要求时，问题是在\
  \ `std::vector<>` 实现的深处被检测到的。我们会得到 40 到 90 行错误信息，你必须仔细寻找那个未满足的要求：\n\n```cpp\n...\n\
  prog.cpp:11:17:   required from 'void add(Coll&, const T&)\n                  [with\
  \ Coll = std::vector<std::atomic<int> >; T = std::atomic<int>]'\nprog.cpp:25:18:\
  \   required from here\n.../gcc/include/bits/stl_construct.h:96:17:\n  error: use\
  \ of deleted function\n         'std::atomic<int>::atomic(const std::atomic<int>&)'\n\
  \   96 |     -> decltype(::new((void*)0) _Tp(std::declval<_Args>()...))\n      |\
  \                 ^~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\n...\n```\n\n你可能会通过定义一个\
  \ concept 来检查是否可以执行 `push_back()` 调用来改进这种情况：\n\n```cpp\ntemplate<typename Coll,\
  \ typename T>\nconcept SupportsPushBack = requires(Coll c, T v) {\n    c.push_back(v);\n\
  };\n```\n\n然而，对可拷贝性的检查仍然在 `std::vector<>` 代码的深处被检测（这次是在检查 concept 时，而不是在编译代码时）。\n\
  \n当我们指定被 `push_back()` 使用的基础要求时，情况会好转：\n\n```cpp\ntemplate<typename Coll, typename\
  \ T>\nrequires std::convertible_to<T, typename Coll::value_type>\nvoid add(Coll&\
  \ coll, const T& val)\n{\n  coll.push_back(val);\n}\n```\n\n在这里，我们使用标准 concept `std::convertible_to`\
  \ 来确保传入的参数 `T` 可以（隐式或显式地）转换为集合的元素类型。\n\n现在，如果要求没有满足，我们应该得到一个包含损坏的 concept 及其发生位置的错误信息。例如：\n\
  \n```cpp\n...\nprog.cpp:11:17:   In substitution of 'template<class Coll, class\
  \ T>\n                  requires  convertible_to<T, typename Coll::value_type>\n\
  \                  void add(Coll&, const T&)\n                  [with Coll = std::vector<std::atomic<int>\
  \ >; T = std::atomic<int>]':\nprog.cpp:25:18:   required from here\n.../gcc/include/concepts:72:13:\
  \ required for the satisfaction of\n                  'convertible_to<T, typename\
  \ Coll::value_type>\n                  [with T = std::atomic<int>;\n           \
  \             Coll = std::vector<std::atomic<int>,\n                           \
  \                std::allocator<std::atomic<int> > >]'\n.../gcc/include/concepts:72:30:\
  \ note: the expression 'is_convertible_v<_From, _To>\n```\n\n### 5.2.1 修复重载解析\n\n\
  重载解析的修复方法非常简单。与其用特定类型声明第二个参数，不如我们只要求该值具有浮点类型。为了实现这一点，我们可以通过使用新的 concept `std::floating_point`\
  \ 来约束函数：\n\n```cpp\ntemplate<typename Coll, typename T>\nrequires std::floating_point<T>\n\
  void add(Coll& coll, const T& val)\n{\n  coll.push_back(val);\n}\n```\n\n由于我们使用了一个作用于单个模板参数的\
  \ concept，我们也可以使用简写符号：\n\n```cpp\ntemplate<typename Coll, std::floating_point T>\n\
  void add(Coll& coll, const T& val)\n{\n  coll.push_back(val);\n}\n```\n\n对于浮点值，我们现在有两个可以调用的函数模板，一个没有要求，一个有特定要求：\n\
  \n```cpp\ntemplate<typename Coll, typename T>\nvoid add(Coll& coll, const T& val)\n\
  {\n  coll.push_back(val);\n}\n\ntemplate<typename Coll, std::floating_point T>\n\
  void add(Coll& coll, const T& val)\n{\n  coll.push_back(val);\n}\n```\n\n这就足够了，因为重载解析也会优先选择具有约束的重载或特化，而不是约束较少或没有约束的。\n\
  \n### 5.2.2. 不同签名的限制\n\n\n\n\n如果签名不同，则更具约束性的重载不会被首选。例如，如果我们声明针对浮点值的重载为按值传递参数，那么传递一个浮点值将产生歧义：\n\
  \n```\ntemplate<typename Coll, typename T>\nvoid add(Coll& coll, const T& val) \
  \ // 注意：按 const 引用传递\n{\n  coll.push_back(val);\n}\n\ntemplate<typename Coll, std::floating_point\
  \ T>\nvoid add(Coll& coll, T val)         // 注意：按值传递\n{\n  ...  // 针对浮点值的特殊处理\n\
  \  coll.push_back(val);\n}\n\nstd::vector<double> dVec;\nadd(dVec, 0.7);      //\
  \ 错误：两个模板都匹配且无优选\n```\n\n后者的声明不再是前者声明的特例。我们现在有两个都可以被调用的不同函数模板。\n\n如果你真的想要不同的签名，你必须约束第一个函数模板，使其不再对浮点值可用。\n\
  \n### 5.2.2.3 窄转换的限制\n\n这里这里还有另一个有趣的问题：两个函数模板都允许我们传递一个 `double` 并将其添加到 `int` 集合中：\n\
  \n```\nstd::vector<int> iVec;\n\nadd(dVec, 1.9);      // 哎：添加了 1\n```\n\n原因是我们有从\
  \ `double` 到 `int` 的隐式类型转换（由于与编程语言 C 兼容）。这种可能会丢失数值部分的隐式转换被称为`窄转换`（narrowing）。这意味着上面的代码可以编译，并在插入之前将值\
  \ `1.9` 转换为 `1`。\n\n如果你不想支持窄转换，你有多种选择：其中一种方法是通过要求传递的值类型与集合的元素类型匹配，从而完全禁用类型转换：\n\n\
  ```\nrequires std::same_as<typename Coll::value_type, T>\n```\n\n然而，这将也会禁用有用且安全的类型转换。\n\
  \n因此，更好的方法是定义一个概念（concept），判断一个类型是否可以在不发生窄转换的情况下转换为另一种类型，这可以通过简短且巧妙的约束来实现：^(4)\n\
  \n```\ntemplate<typename From, typename To>\nconcept ConvertsWithoutNarrowing =\n\
  \    std::convertible_to<From, To> &&\n    requires (From&& x) {\n      { std::type_identity_t<To[]>{std::forward<From>(x)}\
  \ }\n         -> std::same_as<To[1]>;\n    };\n```\n\n然后我们可以使用这个概念来制定相应的约束：\n\n\
  ```\ntemplate<typename Coll, typename T>\nrequires ConvertsWithoutNarrowing<T, typename\
  \ Coll::value_type>\nvoid add(Coll& coll, const T& val)\n{\n  ...\n}\n```\n\n###\
  \ 5.2.2.4 约束的包含（Subsuming）\n\n定义窄转换的概念可能足够了，不需要要求 `std::convertible_to` 概念，因为其余部分隐式地检查了这一点：\n\
  \n```\ntemplate<typename From, typename To>\nconcept ConvertsWithoutNarrowing =\
  \ requires (From&& x) {\n    { std::type_identity_t<To[]>{std::forward<From>(x)}\
  \ } -> std::same_as<To[1]>;\n};\n```\n\n然而，如果 `ConvertsWithoutNarrowing` 概念也检查 `std::convertible_to`\
  \ 概念，将有一个重要的好处。在这种情况下，编译器可以检测到 `ConvertsWithoutNarrowing` 比 `std::convertible_to`\
  \ 更具约束性。术语是 `ConvertsWithoutNarrowing` `包含`（subsumes） `std::convertible_to`。\n\n\
  这允许程序员进行以下操作：\n\n```\ntemplate<typename F, typename T>\nrequires std::convertible_to<F,\
  \ T>\nvoid foo(F, T)\n{\n   std::cout << \"may be narrowing\\n\";\n}\n\ntemplate<typename\
  \ F, typename T>\nrequires ConvertsWithoutNarrowing<F, T>\nvoid foo(F, T)\n{\n \
  \  std::cout << \"without narrowing\\n\";\n}\n```\n\n如果不指定 `ConvertsWithoutNarrowing`\
  \ `包含`了 `std::convertible_to`，当用两个相互转换且无窄转换的参数调用 `foo()` 时，编译器将抛出歧义错误。\n\n### 5.2.3\
  \ 使用不同语句的要求\n\n最后，我们可能想让我们的 `add()` 函数模板更灵活：\n\n* 我们可能还想支持仅提供 `insert()` 而不是 `push_back()`\
  \ 来插入新元素的集合。\n* 我们可能想支持传递一个集合（容器或范围）来插入多个值。\n\n是的，你可以认为这些是不同的函数，它们应该有不同的名称，而且如果这样做行得通，通常使用不同的名称更好。然而，C++\
  \ 标准库是如果不同 API 协调一致可以获得益处的的良好示例。例如，你可以使用相同的泛型代码遍历所有容器，尽管容器内部使用非常不同的方式来移动下一个元素并访问其值。\n\
  \n### 5.2.3.1 调用不同的成员函数\n\n在函数实现中切换 `push_back()` 和 `insert()` 的使用，我们有多种选择。有两个问题需要解决：\n\
  \n* 我们必须检测是否支持 `push_back()` 或 `insert()`。\n* 我们必须确保只编译受支持的调用。\n\n由于切换发生在函数内部，我们可以使用\
  \ C++17 引入的 `if constexpr`。我们可以直接使用 `requires` 表达式作为其条件：^(5)\n\n```\nif constexpr\
  \ (requires { coll.push_back(val); }) {\n  coll.push_back(val);\n}\nelse {\n  coll.insert(val);\n\
  }\n```\n\n另一种方法是引入 `push_back()` 和 `insert()` 的支持。这里我们也有多种选择：\n\n* 我们可以定义一个 `bool`\
  \ 类型的变量模板（如类型 traits）：\n\n```\n   template<typename T>\ninline constexpr bool SupportsPushBack\
  \ = requires(T coll) {\n    coll.push_back(std::declval<typename T::value_type>());\n\
  \  };\n```\n\n* 我们可以定义一个概念：\n\n```\n   template<typename T>\nconcept SupportsPushBack\
  \ = requires(T coll) {\n    coll.push_back(std::declval<typename T::value_type>());\n\
  \  };\n```\n\n在这情况下，我们都使用 `std::declval` 来“假设有一个该类型的对象”，无论我们将 `coll` 声明为值还是非 `const`\
  \ 引用。\n\n倾向于定义概念还是 `bool` 变量模板是一个有趣的问题稍后详细讨论。然而，让我们看看技术上是可行的。\n\n我们可以在 `if constexpr`\
  \ 条件中使用任何形式的命名约束：\n\n```\nif constexpr (SupportsPushBack<coll>) {\n  coll.push_back(val);\n\
  }\nelse {\n  coll.insert(val);\n}\n```\n\n另一种选择是重载实现：\n\n```\ntemplate<typename\
  \ Coll, typename T>\nrequires SupportsPushBack<Coll>\nvoid add(Coll& coll, const\
  \ T& val)\n{\n  coll.push_back(val);\n}\n\ntemplate<typename Coll, typename T>\n\
  void add(Coll& coll, const T& val)\n{\n  coll.insert(val);\n}\n```\n\n通过 `requires`\
  \ 子句，这对于概念和命名 `bool` 都有效。\n\n注意，这里不需要命名约束 `SupportsInsert`，因为带有额外要求的的 `add()` 更特殊，因此重载解析会优先考虑它。\n\
  \n如果我们定义命名约束为概念，甚至可以将其作为约束的模板参数：\n\n```\ntemplate<SupportsPushBack Coll, typename\
  \ T>\nvoid add(Coll& coll, const T& val)\n{\n  coll.push_back(val);\n}\n```\n\n\
  这对于定义为变量模板的命名约束是不可能的。\n\n在 C++20 之前，我们必须使用复杂的声明来 SFINAE 排除不符合的模板](#chap04.xhtml_sfinae-pushback)。\n\
  \n### 5.2.3.2 插入单个和多个值\n\n为了提供一个处理作为一个集合传递的多个值的重载，我们可以简单地为它们添加约束。标准概念 `std::ranges::input_range`\
  \ 可以用于此处：\n\n\n\n\n\n```cpp\ntemplate<PushBackContainer Coll, std::ranges::input_range\
  \ T>\nvoid add(Coll& coll, const T& val)\n{\n  coll.insert(coll.end(), val.begin(),\
  \ val.end());\n}\n\ntemplate<InsertContainer Coll, std::ranges::input_range T>\n\
  void add(Coll& coll, const T& val)\n{\n  coll.insert(val.begin(), val.end());\n\
  }\n```\n\n同样，只要该重载版本具有此附加约束，这些函数将会被优先选择。\n\n`std::ranges::input_range` 概念是为了处理 ranges\
  \ 而引入的，ranges 是指你可以使用 `begin()` 和 `end()` 进行迭代的集合。然而，ranges 并不要求拥有 `begin()` 和 `end()`\
  \ 成员函数。因此，处理 ranges 的代码应该使用 ranges 库提供的辅助函数 `std::ranges::begin()` 和 `std::ranges::end()`：\n\
  \n```cpp\ntemplate<PushBackContainer Coll, std::ranges::input_range T>\nvoid add(Coll&\
  \ coll, const T& val)\n{\n  coll.insert(coll.end(), std::ranges::begin(val), std::ranges::end(val));\n\
  }\n\ntemplate<InsertContainer Coll, std::ranges::input_range T>\nvoid add(Coll&\
  \ coll, const T& val)\n{\n  coll.insert(std::ranges::begin(val), std::ranges::end(val));\n\
  }\n```\n\n这些辅助函数实际上是函数对象，它们避免了 ADL 问题。\n\n#### 5.2.3.3 处理多个约束\n\n通过整合所有有用的概念和要求，我们可以它们全部放在同一个函数的不同位置。\n\
  \n```cpp\ntemplate<PushBackContainer Coll, std::ranges::input_range T>\nrequires\
  \ ConvertsWithoutNarrowing<std::ranges::range_value_t<T>,\n                    \
  \              typename Coll::value_type>\nvoid add(Coll& coll, const T& val)\n\
  {\n  coll.insert(coll.end(),\n              std::ranges::begin(val), std::ranges::end(val));\n\
  }\n```\n\n为了禁用收缩转换，我们使用 `std::ranges::range_value_t` 将 ranges 的元素类型传递给 `ConvertsWithoutNarrowing。`std::ranges::range_value_t`\
  \ 是另一个在迭代 ranges 时获取其元素类型的 ranges 工具函数。\n\n我们也可以将它们一起表述在 `requires` 子句中：\n\n```cpp\n\
  template<typename Coll, typename T>\nrequires PushBackContainer<Coll> &&\n     \
  \    std::ranges::input_range<T> &&\n         ConvertsWithoutNarrowing<std::ranges::range_value_t<T>,\n\
  \                                  typename Coll::value_type>\nvoid add(Coll& coll,\
  \ const T& val)\n{\n  coll.insert(coll.end(),\n              std::ranges::begin(val),\
  \ std::ranges::end(val));\n}\n```\n\n这两种声明函数模板的方法是等价的。\n\n### 5.2.4 完整示例\n\n这里是完整的示例：\n\
  \n```cpp\n#include <iostream>\n#include <vector>\n#include <set>\n#include <ranges>\n\
  #include <atomic>\n\n// 用于禁用收缩转换的概念：\ntemplate<typename From, typename To>\nconcept\
  \ ConvertsWithoutNarrowing = \n    std::convertible_to<From, To> &&\n    requires\
  \ (From&& x) { \n      { std::type_identity_t<To[]>{std::forward<From>(x)} }\n \
  \         -> std::same_as<To[1]>;\n    };\n\n// 用于支持 push_back() 容器的概念：\ntemplate<typename\
  \ T>\nconcept SupportsPushBack = requires(T coll) {\n  coll.push_back(std::declval<typename\
  \ T::value_type>());\n};\n\n// 针对单值的 add():\ntemplate<typename Coll, typename T>\n\
  requires ConvertsWithoutNarrowing<T, typename Coll::value_type>\nvoid add(Coll&\
  \ coll, const T& val)\n{\n  if constexpr (SupportsPushBack<Coll>) {\n    coll.push_back(val);\n\
  \  }\n  else {\n    coll.insert(val);\n  }\n}\n\n// 针对多个值的 add():\ntemplate<typename\
  \ Coll, std::ranges::input_range T>\nrequires ConvertsWithoutNarrowing<std::ranges::range_value_t<T>,\n\
  \                                  typename Coll::value_type>\nvoid add(Coll& coll,\
  \ const T& val)\n{\n  if constexpr (SupportsPushBack<Coll>) {\n    coll.insert(coll.end(),\n\
  \                std::ranges::begin(val), std::ranges::end(val));\n  }\n  else {\n\
  \    coll.insert(std::ranges::begin(val), std::ranges::end(val));\n  }\n}\n\nint\
  \ main()\n{\n  std::vector<int> iVec;\n  add(iVec, 42);      // OK: T 为 int 时，调用\
  \ push_back()\n\n  std::set<int> iSet;\n  add(iSet, 42);      // OK: T 为 int 时，调用\
  \ insert()\n\n  short s = 42;\n  add(iVec, s);       // OK: T 为 short 时，调用 push_back()\n\
  \n  long long ll = 42;\n  //add(iVec, ll);      // 错误: 收缩转换\n  //add(iVec, ll);\
  \      // 错误: 收缩转换\n}\n```\n\n\n\n\n\n要为模板参数指定要求，你需要使用 `constraints`（约束），它们是布尔表达式，在编译时求值为\
  \ `true` 或 `false`，用以决定是否实例化并编译该模板。\n\n约束可以是：\n\n*   一个即时的（ad-hoc）编译时布尔表达式（语法有限制，因此可能需要加括号以避免歧义）\n\
  *   一个指定了所需操作和类型的 `requires` 表达式\n*   一个 `concept`（概念，已在之前通过使用 `concept` 关键字定义）\n\
  \n约束的基本应用是 `requires 子句`，它使用 `requires` 关键字和一个（或多个）约束来限制该模板的可用性。所有约束也可以用于任何可以使用可以使用布尔表达式的地方（特别是在\
  \ `if` `constexpr` 条件 中）。\n\n要组合多个约束，我们可以使用 `&&`。例如：\n\n```cpp\ntemplate<typename\
  \ T>\nrequires (sizeof(T) > 4)                           // 即时编译时布尔表达式\n       \
  \  && requires { typename T::value_type; }   // requires 表达式\n         && std::input_iterator<T>\
  \                 // concept\n```\n\n约束的顺序并不重要。\n\n也可以使用 `||` 表示“备选”约束。例如：\n\n```cpp\n\
  template<typename T>\nrequires std::integral<T> || std::floating_point<T>\nT power(T\
  \ b, T p);\n```\n\n指定备选约束很少需要，不应该用得太随意，因为在 `requires` 子句中过度使用 `||` 运算符可能会消耗编译资源（即导致编译速度明显变慢）。\n\
  \n单个约束也可以涉及多个模板参数：例如：\n\n```cpp\ntemplate<typename T, typename U>\nrequires std::convertible_to<T,\
  \ U>\nauto f(T x, U y) {\n  ...\n}\n```\n\n通过这种方式，约束可以在类型参数之间建立关系。\n\n## 5.3.2 即时布尔表达式\n\
  \n制定模板制定约束的第一种方法是使用转换为 `true` 或 `false` 的编译时表达式。这些表达式特别可能使用：\n\n*   类型谓词，如类型特质（type\
  \ traits）\n*   编译时变量（使用 `constexpr` 或 `constinit` `const` 定义）\n*   编译时函数（使用 `constexpr`\
  \ 或 `consteval` 定义）\n\n让我们来看一些使用即时布尔表达式限制模板可用性的示例：\n\n*   仅当 `int` 和 `long` 的大小不同时可用：\n\
  \n    ```cpp\n     template<typename T>\n      requires (sizeof(int) != sizeof(long))\n\
  \      ...\n    ```\n\n*   仅当 `sizeof(T)` 不太大时可用：\n\n    ```cpp\n     template<typename\
  \ T>\n      requires (sizeof(T) <= 64)\n      ...\n    ```\n\n*   仅当非类型模板参数](#chap10.xhtml_chapnttp)\
  \ `Sz` 大于 0 时可用：\n\n    ```cpp\n     template<typename T, std::size_t Sz>\n    \
  \  requires (Sz > 0)\n      ...\n    ```\n\n*   仅对原始指针和 `nullptr` 可：\n\n    ```cpp\n\
  \     template<typename T>\n      requires (std::is_pointer_v<T> || std::same_as<T,\
  \ std::nullptr_t>)\n      ...\n    ```\n\n    `std::same_as`是一个新的标准 concept。你也可以使用类型特质\
  \ `std::is_same<>`：\n\n    ```cpp\n     template<typename T>\n      requires (std::is_pointer_v<T>\
  \ || std::is_same_v<T, std::nullptr_t>)\n      ...\n    ```\n\n*   仅当参数不能作为字符串使用时可用：\n\
  \n    ```cpp\n     template<typename T>\n      requires (!std::convertible_to<T,\
  \ std::string>)\n      ...\n    ```\n\n    `std::convertible_to`是一个新的标准 concept。你也可以使用类型特质\
  \ `std::is_convertible<>`：\n\n    ```cpp\n     template<typename T>\n      requires\
  \ (!std::is_convertible_v<T, std::string>)\n      ...\n    ```\n\n*   仅当参数是指向整值的指针（或类似指针的对象）时可用：\n\
  \n    ```cpp\n     template<typename T>\n      requires std::integral<std::remove_reference_t<decltype(*std::declval<T>())>>\n\
  \      ...\n    ```\n\n    注意 `operator*` 通常产生引用，而引用不是整型。因此，我们执行了以下操作：\n\n    *\
  \   假设有一个类型为 `T` 的对象：`std::declval<T>()`\n    *   对它调用 `operator*`：`*`\n    *  \
  \ 获取其类型：`decltype()`\n    *   移除引用：`std::remove_reference_v<>`\n    *   检查是否为整型：`std::integral<>`\n\
  \n    `std::integral`是一个新的标准 concept。你也可以使用类型特质 `std::is_integral<>`。\n\n    该约束也会满足\
  \ `std::optional<int>`。\n\n*   仅当非类型模板参数 `Min` 和 `Max` 大于 0 时可用：\n\n    ```cpp\n\
  \     template<typename T, std::size_t Sz>\n      requires (Sz > 0)\n      ...\n\
  \    ```\n\n## 5.3.3 requires 表达式\n\n*requires 表达式*（与 *requires 子句 不同）提供了一种简单且灵活的语法，用于指定一个或多个模板参数的要求。你可以指定：\n\
  \n*   类型定义\n*   有效的表达式\n*   对类型的约束\n\n*requires 表达式*以 `requires` 开头，后跟可选的参数列表，然后是约束块（全部以分号结尾）。例如：\n\
  \n```cpp\ntemplate<typename Coll>\n... requires {\n     typename Coll::value_type::first_type;\n\
  \     typename Coll::value_type::second_type;\n   }\n```\n\n可选的参数列表允许你引入一组“虚拟变量”，以便在\
  \ requires 表达式体内表示约束：\n\n```cpp\ntemplate<typename T>\n... requires(T x, T y) {\n\
  \     x + y;   // 支持 +\n     x - y;   // 支持 -\n   }\n```\n\n这些参数永远被替换。因此，按值还是引用声明没有区别。\n\
  \n参数还允许我们引入（子类型的）参数：\n\n```cpp\ntemplate<typename Coll>\n... requires(typename Coll::value_type\
  \ v) {\n     std::cout << v;   // 支持输出运算符\n   }\n```\n\n此约束检查 `Coll::value_type`\
  \ 是否有效，以及该类型的对象是否支持输出运算符。\n\n当仅用于检查 `Coll::value_type` 是否有效时，你不需要约束块内的任何内容。然而，块不能为空。因此，你可能只是简单地使用\
  \ `true`：\n\n```cpp\ntemplate<typename Coll>\n... requires(typename Coll::value_type\
  \ v) {\n     true;             // 虚拟约束，因为块不能为空\n   }\n```\n\n### 5.3.3.1 简单约束\n\n\
  简单约束仅仅是指格式良好的表达式。这意味着调用必须通过编译。调用不会被执行，因此操作是否具有定义行为或产生 `true` 并不重要。\n\n例如：\n\n\n\n\
  \n\n```cpp\ntemplate<typename T1, typename T2>\n... requires(T1 val, T2 p) {\n \
  \    *p;              // T2 必须支持 operator*\n     p[0];            // 必须支持 int 作为索引的\
  \ operator[]\n     p->value();      // 必须可以调用无参数的成员函数 value()\n     *p > val;  \
  \      // 支持将 operator* 的结果与 T1 比较比较\n     p == nullptr;    // 支持将 T2 与 nullptr\
  \ 比较比较\n   }\n```\n\n最后一次调用并不要求 `p` *必须是* `nullptr`（若要要求这一点，你必须检查 `T2` 是否为 `std::nullptr_t`\
  \ 类型）。相反，我们要求*可以*将类型为 `T2` 的对象与类型为 `std::nullptr_t` 的对象（`nullptr` 的类型）进行比较。\n\n\
  使用运算符 `||` 通常没有意义。一个简单的需求如：\n\n```cpp\n*p > val || p == nullptr;\n```\n\n这*并不*要求左子表达式或右子表达式必须是可能的。它制定了一项需求，即我们可以用\
  \ `operator||` 两个子表达式的结果。\n\n若要要求两个子表达式之一，你必须使用：\n\n```cpp\ntemplate<typename T1,\
  \ typename T2>\n... requires(T1 val, T2 p) {\n     *p > val;          // 支持将 operator*\
  \ 的结果与 T1 比较\n   }\n   || requires(T2 p) {  // 或者\n     p == nullptr;      // 支持将\
  \ T2 与 nullptr 比较\n   }\n```\n\n还要注意，此概念*并不*要求 `T` 必须是整数类型：\n\n```cpp\ntemplate<typename\
  \ T>\n... requires {\n     std::integral<T>;            // 错误：并没有要求 T 为整型\n    \
  \ ...\n   };\n```\n\n它只要求表达式 `std::integral<T>` 是有效的，这对于所有类型都是如此。相反，你必须如下表述：\n\n\
  ```cpp\ntemplate<typename T>\n... std::integral<T> &&            // 正确，要求 T 为整型\n\
  \   requires {\n     ...\n   };\n```\n\n或者如下所示：\n\n```cpp\ntemplate<typename T>\n\
  ... requires {\n     requires std::integral<T>;   // 正确，要求 T 为整型\n     ...\n   };\n\
  ```\n\n### 5.3.3.2 类型需求 (Type Requirements)\n\n类型需求是在使用类型名称时必须是良好的（well-formed）的表达式。这意味着指定的名称必须被定义为有效的类型。\n\
  \n例如：\n\n```cpp\ntemplate<typename T1, typename T2>\n... requires {\n  typename\
  \ T1::value_type;               // T1 需要类型成员 value_type\n  typename std::ranges::iterator_t<T1>;\
  \  // T1 需要迭代器类型\n  typename std::ranges::iterator_t<std::vector<T1>>;\n  typename\
  \ std::common_type_t<T1, T2>;   // T1 和 T2 必须有一个共同类型\n}\n```\n\n对于所有类型需求，如果类型存在但为\
  \ `void`，则满足该需求。\n\n请注意，你只能检查赋值给类型的名称（类名、枚举类型、来自 `typedef` 或 `using` 的名称）。你不能使用类型标记来检查其他类型声明：\n\
  \n```cpp\ntemplate<typename T>\n... requires {\n  typename int;           // 错误：无效的类型需求\n\
  \  typename T&;            // 错误：无效的类型需求\n}\n```\n\n测试后者的方法是声明相应的参数：\n\n```cpp\n\
  template<typename T>\n... requires(T&) {\n  true;     // 某些虚拟需求\n};\n```\n\n再次，需求检查检查了使用传入的类型来定义另一个类型是否有效。例如：\n\
  \n```cpp\ntemplate<std::integral T>\nclass MyType1 {\n  ...\n};\n\ntemplate<typename\
  \ T>\nrequires requires {\n  typename MyType1<T>;    // 为 T 实例化 MyType1 将是有效的\n\
  }\nvoid mytype1(T) {\n  ...\n}\n\nmytype1(42);    // 正确\nmytype1(7.7);   // 错误\n\
  ```\n\n因此，以下需求*并没有*检查类型 `T` 是否存在标准的哈希函数：\n\n```cpp\ntemplate<typename T>\nconcept\
  \ StdHash = requires {\n  typename std::hash<T>;  // 并没有检查 std::hash<> 是否为 T 定义\n\
  };\n```\n\n这样做的方法是尝试创建或使用它：\n\n```cpp\ntemplate<typename T>\nconcept StdHash = requires\
  \ {\n  std::hash<T>{};  // 正确，检查我们是否可以为 T 创建标准的哈希器\n};\n```\n\n使用总是产生类型的类型函数是没有意义的：\n\
  \n```cpp\ntemplate<typename T>\n... requires {\n  typename std::remove_const_t<T>;\
  \   // 作为类型需求没有用（始终有效）\n}\n```\n\n该需求只检查类型表达式是否产生一个类型，这在这里总是可能的。要检查常量性，请使用：\n\n\
  ```cpp\ntemplate<typename T>\n... std::is_const<T>  // 确保 T 是 const\n```\n\n使用可能具有未定义行为的类型函数也是没有意义的。例如，类型特征\
  \ `std::make_unsigned<>` 要求传入的参数是整数。\n\n### 5.3.3.3 复合需求 (Compound Requirements)\n\
  \n复合需求允许我们将多个需求合并为一个。\n\n这里是一些示例：\n\n```cpp\ntemplate<typename T>\nconcept Numeric\
  \ = requires {\n  requires std::is_integral<T> || std::is_floating_point<T>;\n};\n\
  ```\n\n\n\n\n\n通过定义一个 `concept`，你可以为一个或多个 `constraints 引入一个名称。\n\n模板（函数模板、类模板和变量模板）可以使用概念来约束它们的能力（通过\
  \ requires 子句 或作为模板参数的直接 类型约束）。然而，概念也是布尔类型的编译时表达式（类型谓词），你可以在任何需要对某种类型进行某种检查的地方使用它们（例如在\
  \ `if` `constexpr` 条件 中）。\n\n## 5.4.1 定义概念\n\n概念的定义方式如下：\n\n```cpp\ntemplate<...>\n\
  concept name = ... ;\n```\n\n必须包含等号（你不能在不定义概念的情况下声明它）。在等号后面，你可以指定任何可以转换为 `true`\
  \ 或 `false` 的编译时表达式。\n\n概念非常像类型为 `bool` 的 `constexpr` 变量模板，但没有显式地指定类型：\n\n```cpp\n\
  template<typename T>\nconcept MyConcept = ...;\n\nstd::is_same<MyConcept<...>, bool>\
  \  // 返回 true\n```\n\n这意味着，在编译时或运行时，你始终可以在需要布尔表达式值的地方使用概念。然而，你不能获取它的地址，因为其背后没有对象（它是一个\
  \ prvalue）。\n\n模板参数不能有约束（你不能使用一个概念来定义另一个概念）。\n\n你不能在函数内部定义概念（与所有模板一样）。\n\n## 5.4.2\
  \ 概念的特殊能力\n\n概念具有特殊能力。如果我们对比布尔变量模板的通常定义（它专门用于定义类型特性）：\n\n```cpp\ntemplate<typename\
  \ T>\ninline constexpr bool IsOrHasThisOrThat = ...;\n```\n\n与概念的定义相比：\n\n```cpp\n\
  template<typename T>\nconcept IsOrHasThisOrThat = ...;\n```\n\n我们存在以下差异：\n\n* 概念不代表代码。它们没有类型、存储、生命周期或与对象相关的任何其他属性。\n\
  \  通过在编译时为特定的模板参数实例化它们，它们的实例化结果就变成了 `true` 或 `false`。因此，你可以在任何可以使用 `true` 或 `false`\
  \ 的地方使用它们，并获得这些字面量的所有属性。\n\n* 概念不需要声明为 `inline`，它们隐式地就是如此。\n\n* 概念可以作为 类型约束：\n\n\
  \  ```cpp\n   template<IsOrHasThisOrThat T>\n    ...\n  ```\n\n  变量模板不能这样使用。\n\n\
  * 概念是为 `constraints` 命名的唯一方式，这意味着你需要它们来判断一个约束是否是另一个约束的特例。要判断一个约束是否 包含 另一个约束，你需要使用概念来与该约束进行比较。\n\
  \n## 5.4.3 使用概念作为类型约束\n\n如介绍所示，概念可以用作类型约束。类型约束可以在不同的地方使用：\n\n* 在模板类型参数的声明中\n* 在用\
  \ `auto` 声明的调用参数声明中\n* 作为 复合要求 中的要求\n\n例如：\n\n```cpp\ntemplate<std::integral T>\
  \                      // 模板参数的类型约束\nclass MyClass {\n  ...\n};\n\nauto myFunc(const\
  \ std::integral auto& val) {   // auto 参数的类型约束\n  ...\n};\n\ntemplate<typename T>\n\
  concept MyConcept = requires(T x) {\n    { x + x } -> std::integral;           \
  \     // 返回类型的类型约束\n  };\n```\n\n在这里，我们使用了单元约束，它针对单个参数或表达式返回的类型调用。\n\n### 5.4.3.1\
  \ 多个参数的类型约束\n\n你也可以使用带有多个参数的约束，此时参数类型或返回值将作为第一个参数使用：\n\n```cpp\ntemplate<std::convertible_to<int>\
  \ T>                     // 需要转换为 int\nclass MyClass {\n  ...\n};\n\nauto myFunc(const\
  \ std::convertible_to<int> auto& val) {  // 需要转换为 int\n  ...\n};\n\ntemplate<typename\
  \ T>\nconcept MyConcept = requires(T x) {\n    { x + x } -> std::convertible_to<int>;\
  \               // 需要转换为 int\n  };\n```\n\n另一个常用示例是约束可调用对象（函数、函数对象、lambda）的类型，要求你可以传递特定数量和特定类型的参数，可以使用概念\
  \ std::invocable 或 std::regular_invocable：例如，要要求传递一个接受 `int` 和 `std::string` 的操作，必须声明：\n\
  \n```cpp\ntemplate<std::invocable<int, std::string> Callable>\nvoid call(Callable\
  \ op);\n```\n\n或者：\n\n```cpp\nvoid call(std::invocable<int, std::string> auto op);\n\
  ```\n\n`std::invocable` 和 `std::regular_invocable` 区别在于，后者保证不修改传递的操作和参数。这是一种语义差异，仅有助于文档化意图。\n\
  \n### 5.4.3.2 `auto` 的类型约束\n\n如前所述，类型约束可以用任何可以使用 `auto` 的地方：\n\n* 在声明中：\n\n  ```cpp\n\
  \   std::integral auto val1 = 42;    // OK\n   std::integral auto val2 = true; \
  \  // 错误\n\n   for (std::integral auto& elem : coll) {\n     ...\n   }\n  ```\n\n\
  * 在返回类型中：\n\n  ```cpp\n     std::integral auto foo() {\n        ...\n     }\n  ```\n\
  \n* 在非类型模板参数中：\n\n  ```cpp\n   template<typename T, std::integral auto>\n     class\
  \ SizedColl {\n       ...\n     };\n  ```\n\n适用于带有多个参数的概念：\n\n```cpp\ntemplate<typename\
  \ T, std::convertible_to<T> auto>\nclass MyType {\n  ...\n};\n```\n\n另一个示例请参见非类型模板参数的支持。\n\
  \n## 5.5 约束与概念的包含\n\n两个概念之间存在包含关系。也就是说，一个概念可以指定为限制一个或多个概念。这样做的好处是，重载解析会倾向于选择约束更多的泛型代码。\n\
  \n例如，考虑我们引入以下两个概念：\n\n```cpp\ntemplate<typename T>\nconcept GeoObject = requires(T\
  \ obj) {\n    { obj.width() } -> std::integral;\n    { obj.height() } -> std::integral;\n\
  \    obj.draw();\n  };\n\ntemplate<typename T>\nconcept ColoredGeoObject =\n  GeoObject<T>\
  \ &&             // 包含 GeoObject\n  requires(T obj) {           // 额外的约束\n    obj.setColor(Color{});\n\
  \    { obj.getColor() } -> std::convertible_to<Color>;\n  };\n```\n\n概念 `ColoredGeoObject`\
  \ 显式包含了概念 `GeoObject`，因为它显式地制定了类型 `T` 也必须满足概念 `GeoObject` 的约束。\n\n因此，当对这两个概念重载模板且两者都满足时，不会产生歧义。重载解析优先选择包含它的概念：\n\
  \n```cpp\ntemplate<GeoObject T>\nvoid process(T)         // 用于未提供 setColor 和 getColor\
  \ 的对象\n{\n  ...\n}\n\ntemplate<ColoredGeoObject T>\nvoid process(T)         // 用于提供了\
  \ setColor 和 getColor 的对象\n{\n  ...\n}\n```\n\n约束的包含关系仅在使用概念时才有效。当一个概念/约束比另一个更特殊时，并不会发生自动的包含。\n\
  \n约束和概念并不仅仅基于要求产生包含。请考虑以下示例：^(7)\n\n\n\n\n\n```\n// declared in some header:\ntemplate<typename\
  \ T>\nconcept GeoObject = requires(T obj) {\n                      obj.draw();\n\
  \                    };\n\n// declared in another header:\ntemplate<typename T>\n\
  concept Cowboy = requires(T obj) {\n                   obj.draw();\n           \
  \        obj = obj;\n                 };\n```\n\n假设我们为 `GeoObject` 和 `Cowboy` 同时重载了同一个函数模板：\n\
  \n```cpp\ntemplate<GeoObject T>\nvoid print(T) {\n  ...\n}\n\ntemplate<Cowboy T>\n\
  void print(T) {\n  ...\n}\n```\n\n我们不希望对于 `Circle` 或 `Rectangle`（它们拥有 `draw()` 成员函数），`print()`\
  \ 的调用会优于针对牛仔的 `print()`，仅仅因为 `Cowboy` 概念更特殊。我们希望看到在这种情况下有两个可能的 `print()` 函数发生了冲突。\n\
  \n检查包含关系（subsumptions）的代价仅对概念进行评估。如果不使用概念，使用不同的约束进行重载将产生歧义：\n\n```cpp\ntemplate<typename\
  \ T>\nrequires std::is_convertible_v<T, int>\nvoid print(T) {\n  ...\n}\n\ntemplate<typename\
  \ T>\nrequires (std::is_convertible_v<T, int> && sizeof(int) >= 4)\nvoid print(T)\
  \ {\n  ...\n}\n\nprint(42);  // ：歧义（如果两个约束都为真）\n```\n\n当使用概念时，这段代码可以工作：\n\n```cpp\n\
  template<typename T>\nrequires std::convertible_to<T, int>\nvoid print(T) {\n  ...\n\
  }\n\ntemplate<typename T>\nrequires (std::convertible_to<T, int> && sizeof(int)\
  \ >= 4)\nvoid print(T) {\n  ...\n}\n\nprint(42);  // OK\n```\n\n这种行为的原因之一是，在编译时需要详细处理概念之间的依赖关系。\n\
  \n标准库提供的概念经过仔细设计，在合理的情况下会包含其他概念。例如：\n\n*   `std::random_access_range` 包含 `std::bidirectional_range`，两者都包含概念\
  \ `std::forward_range`，三者都包含 `std::input_range`，且它们都包含 `std::range`。然而，`std::sized_range`\
  \ 只包含 `std::range`，不包含其他任何。\n*   `std::regular` 包含 `std::semiregular`，两者都包含 `std::copyable`\
  \ 和 `std::default_initializable`（后者包含了其他几个概念，如 `std::movable`、`std::copy_constructible`\
  \ 和 `std::destructible`）。\n*   `std::sortable` 包含 `std::permutable`，两者在参数类型相同时都包含\
  \ `std::indirectly_swappable`。\n\n## 5.5.1 间接包含\n\n约束甚至可以间接地包含。这意味着，重载解析仍然可能偏偏于其中一个重载或特化版本，尽管它们的约束并不是根据对方定义的。\n\
  \n例如，假设你定义了以下两个概念：\n\n```cpp eventemplate<typename T>\nconcept RgSwap = std::ranges::input_range<T>\
  \ && std::swappable<T>;\n\ntemplate<typename T>\nconcept ContCopy = std::ranges::contiguous_range<T>\
  \ && std::copyable<T>;\n```\n\n现在当我们为这两个概念重载两个函数并传递一个符合这两个概念的对象时，这不会产生歧义：\n\n```cpp\n\
  template<RgSwap T>\nvoid foo1(T) {\n  std::cout << \"foo1(RgSwap)\\n\";\n}\n\ntemplate<ContCopy\
  \ T>\nvoid foo1(T) {\n  std::cout << \"foo1(ContCopy)\\n\";\n}\n\nfoo1(std::vector<int>{});\
  \   // OK: 都符合，ContCopy 的约束更强\n```\n\n原因是 `ContCopy` 包含了 `RgSwap`，因为：\n\n*   概念\
  \ `contiguous_range` 是基于概念 `input_range` 定义的（它隐含 `random_access_range`，后者隐含 `bidirectional_range`，再隐含\
  \ `forward_range`，最后隐含 `input_range`）。\n*   概念 `copyable` 是基于概念 `swappable` 定义的（它隐含\
  \ `movable`，后者隐含 `swappable`）。\n\n然而，使用以下声明时，当两个概念都符合时我们会得到歧义：\n\n```cpp\ntemplate<typename\
  \ T>\nconcept RgSwap = std::ranges::sized_range<T> && std::swappable<T>;\n\ntemplate<typename\
  \ T>\nconcept ContCopy = std::ranges::contiguous_range<T> && std::copyable<T>;\n\
  ```\n\n原因是 `contiguous_range` 概念既不隐含 `sized_range`，`sized_range` 概念也不隐含 `contiguous_range`。\n\
  \n此外，对于以下声明，没有一个概念包含另一个：\n\n```cpp\ntemplate<typename T>\nconcept RgCopy = std::ranges::input_range<T>\
  \ && std::copyable<T>;\n\ntemplate<typename T>\nconcept ContMove = std::ranges::contiguous_range<T>\
  \ && std::movable<T>;\n```\n\n一方面，`ContMove` 的约束更强，因为 `contiguous_range` 隐含 `input_range`；另一方面，`RgCopy`\
  \ 的约束更强，因为 `copyable` 隐含 `movable`。\n\n为了避免混淆，不要对概念相互包含做出过多假设。\n\n## 5.6 语义约束\n\n\
  概念可能同时检查语法和语义约束：\n\n*   **语法约束**意味着在编译时可以检查某些需求是否满足（“支持特定操作？”或“操作是否返回特定类型？”）。\n\
  *   **语义约束**意味着某些需求得到满足，但只能在运行时检查（“操作是否有效？”或“对特定值是否产生相同的结果？”）。\n\n语义约束的一个简单例子是概念\
  \ `invocable` 和 `regular_invocable` 之间的区别。后者保证不修改参数的状态。我们无法通过编译器检查这一点，因此为了简单使用了\
  \ `invocable`。\n\n另一个例子是除了某些差异外，weakly_incrementable` 和 `incrementable` 之间存在语义差异：\n\
  \n*   `weakly_incrementable` 只要求类型支持增运算符。对同一个值递增可能会产生不同的结果。\n*   `incrementable`\
  \ 要求对同一个值的增加产生相同的结果。\n\n因此：\n\n*   当满足 `incrementable` 时，你可以从起始值对范围进行多次迭代。\n*  \
  \ 当仅满足 `weakly_incrementable` 时，你对范围只能迭代一次。\n\n这种差异对于迭代器很重要：输入流迭代器（从流读取值的迭代器）只能迭代一次，因为下一次迭代会产生不同的值。因此，输入流迭代器满足\
  \ `weakly_incrementable` 概念，但不满足 `incrementable` 概念。然而，这些概念无法检查这种差异：\n\n```cpp\n\
  std::weakly_incrementable<std::istream_iterator<int>> // 返回真\nstd::incrementable<std::istream_iterator<int>>\
  \         // OOP：同样返回真\n```\n\n原因是这种差异是一种无法在编译时检查的语义约束。因此概念可以用于记录约束：\n\n```cpp\n\
  template<std::weakly_incrementable T>\nvoid algo1(T beg, T end); // 单次算法\n\ntemplate<std::incrementable\
  \ T>\nvoid algo2(T beg, T end); // 多次算法\n```\n\n注意我们在这里为算法使用了不同的名称。由于无法检查约束的语义差异，由程序员确保不传递输入流迭代器：\n\
  \n```cpp\nalgo1(std::istream_iterator<int>{std::cin}, // OK\n      std::istream_iterator<int>{});\n\
  \nalgo2(std::istream_iterator<int>{std::cin}, // OOP：违反约束\n      std::istream_iterator<int>{});\n\
  ```\n\n\n\n\n然而，你无法根据这种差异在两个不同的实现之间进行分发：\n\n```cpp\ntemplate<std::weakly_incrementable\
  \ T>\nvoid algo(T beg, T end);                    // 单遍实现\n\ntemplate<std::incrementable\
  \ T>\nvoid algo(T beg, T end);                    // 多遍实现\n```\n\n如果你在此处传递一个输入流迭代器，编译器将错误地使用多遍实现：\n\
  \n```cpp\nalgo(std::istream_iterator<int>{std::cin},  // 错误：调用了错误的重载\n     std::istream_iterator<int>{});\n\
  ```\n\n幸运的是，这里有一个解决方案，因为对于这种语义差异，C++98 已经引入了迭代器特质（iterator traits），它们被迭代器概念（iterator\
  \ concepts）。如果你使用这些概念（或相应的范围概念（range concepts）），一切都是正常的：\n\n```cpp\ntemplate<std::input_iterator\
  \ T>\nvoid algo(T beg, T end);                    // 单遍实现\n\ntemplate<std::forward_iterator\
  \ T>\nvoid algo(T beg, T end);                    // 多遍实现\n\nalgo(std::istream_iterator<int>{std::cin},\
  \  // OK：调用了正确的重载\n     std::istream_iterator<int>{});\n```\n\n因此，在这种情况下，你应该优先选择为迭代器和范围使用更具体的概念。\n\
  \n## 5.7 概念的设计指南\n\n**===== 本章节/节正在编写中 =====**\n\n### 5.7.1 处理多重需求\n\n**===== 本章/节正在编写中\
  \ =====**\n\n例如，一个检查迭代器要求的的概念可能如下：^(9)\n\n```cpp\ntemplate<typename I>\nconcept\
  \ IsIterator =\n  default_initializable<T> &&\n  std::copyable<I> &&\n  requires(I\
  \ i) {\n    typename iter_difference_t<I>;\n    *i;\n    { ++i } -> same_as<I&>;\n\
  \    { i++ } -> same_as<I>;\n};\n```\n\n### 5.7.2 概念与特质及表达式\n\n概念不仅仅是可以在编译时求值为布尔结果的表达式。通常你应该优先使用概念而不是类型特质（type\
  \ traits）和其他编译时表达式。\n\n#### 5.7.2.1 标准概念更好地支持重载解析\n\n编译器例如能够检测一个概念是否是另一个概念的一部分。\n\
  \n考虑以下示例，我们我们用类型特质定义的两个需求重载了函数 `foo()`：\n\n```cpp\ntemplate<typename T, typename\
  \ U>\nrequires std::is_same_v<T, U>            // 使用特质\nvoid foo(T, U)\n{\n  std::cout\
  \ << \"foo() for parameters of same type\" << '\\n';\n}\n\ntemplate<typename T,\
  \ typename U>\nrequires std::is_same_v<T, U> && std::is_integral_v<T>\nvoid foo(T,\
  \ U)\n{\n  std::cout << \"foo() for integral parameters of same type\" << '\\n';\n\
  }\n\nfoo(1, 2);   // 错误：歧义：两个需求都成立\n```\n\n问题在于，如果两个需求都求值为 `true`，那么这两个两个重载都适用，且没有规则规定其中一个优先于另一个。因此，编译器将停止编译并抛出歧义错误。\n\
  \n如果我们改用相应的概念，编译器会发现第二个需求是一个特化版本，并在两个需求都满足时优选选择它：\n\n```cpp\ntemplate<typename T,\
  \ typename U>\nrequires std::same_as<T, U>              // 使用概念\nvoid foo(T, U)\n\
  {\n  std::cout << \"foo() for parameters of same type\" << '\\n';\n}\n\ntemplate<typename\
  \ T, typename U>\nrequires std::same_as<T, U> && std::integral<T>\nvoid foo(T, U)\n\
  {\n  std::cout << \"foo() for integral parameters of same type\" << '\\n';\n}\n\n\
  foo(1, 2);   // OK：优先选择第二个 foo()\n```\n\n#### 5.7.2.2 谨慎地定义概念\n\n为了检测子概念，编译器必须能够检测到概念及其调用方式是否匹配。这需要对概念进行仔细的定义。例如，考虑我们定义了自己的概念\
  \ `SameAs` 并如下使用它：\n\n```cpp\ntemplate<typename T, typename U>\nconcept SameAs =\
  \ std::is_same_v<T, U>;       // 定义 SameAs\n\ntemplate<typename T, typename U>\n\
  requires SameAs<T, U>                        // 使用 SameAs\nvoid foo(T, U)\n{\n \
  \ std::cout << \"foo() for parameters of same type\" << '\\n';\n}\n\ntemplate<typename\
  \ T, typename U>\nrequires SameAs<T, U> && std::integral<T>    // 再次使用 SameAs\n\
  void foo(T, U)\n{\n  std::cout << \"foo() for integral parameters of same type\"\
  \ << '\\n';\n}\n\nfoo(1, 2);   // OK：优先选择第二个 foo()\n```\n\n然而，注意当我们在第二个 `foo()`\
  \ 的需求中调用 `SameAs<>` 时交换参数会发生什么：\n\n```cpp\ntemplate<typename T, typename U>\nconcept\
  \ SameAs = std::is_same_v<T, U>;       // 定义 SameAs\n\ntemplate<typename T, typename\
  \ U>\nrequires SameAs<T, U>                        // 使用 SameAs\nvoid foo(T, U)\n\
  {\n  std::cout << \"foo() for parameters of same type\" << '\\n';\n}\n\ntemplate<typename\
  \ T, typename U>\nrequires SameAs<U, T> && std::integral<T>    // 以另一种顺序使用 SameAs\n\
  void foo(T, U)\n{\n  std::cout << \"foo() for integral parameters of same type\"\
  \ << '\\n';\n}\n\nfoo(1, 2);   // 错误：歧义：两个需求都成立\n```\n\n问题是编译器无法检测 `SameAs<>` 是交换的。顺序可能很重要，因此第一个需求并不是第二个需求的子集。\n\
  \n然而，我们可以通过明确 `SameAs<>` 的元素顺序不重要来解决这个问题：\n\n```cpp\ntemplate<typename T, typename\
  \ U>\nconcept SameAsHelper = std::is_same_v<T, U>; // 辅助概念\n\ntemplate<typename\
  \ T, typename U>\nconcept SameAs = SameAsHelper<T, U> && SameAsHelper<U, T>; //\
  \ 交换的\n```\n\n现在，对于 `SameAs<>`，元素的顺序不再重要：\n\n```cpp\ntemplate<typename T, typename\
  \ U>\nrequires std::same_as<T, U>                   // 使用 SameAs\nvoid foo(T, U)\n\
  {\n  std::cout << \"foo() for parameters of same type\" << '\\n';\n}\n\ntemplate<typename\
  \ T, typename U>\nrequires std::same_as<U, T> && std::integral<T>   // 以另一种顺序使用\
  \ SameAs\nvoid foo(T, U)\n{\n  std::cout << \"foo() for integral parameters of same\
  \ type\" << '\\n';\n}\n\nfoo(1, 2);   // OK：优先选择第二个 foo()\n```\n\nC++ 标准知道这些问题，因此相应地定义了概念\
  \ `std::same_as`，使得顺序不再重要。\n\n### 5.7.3 何时使用 `if` `constexpr`\n\n**===== 本章节/节正在编写中\
  \ =====**\n\nC++17 引入了编译时 if，允许我们根据某些编译时条件切换代码。\n\n例如：\n\n```cpp\ntemplate<typename\
  \ Coll, std::floating_point T>\nvoid add(Coll& coll, const T& val)    // 针对浮点数值类型\n\
  {\n  if constexpr(std::is_floating_point_v<T>) {\n    ...  // 针对浮点值的特殊处理\n  }\n\
  \  coll.push_back(val);\n}\n```\n\n为了在使用模板参数时有不同的行为，这比提供重载或特化模板更具可读性。然而，你不能使用 `if`\
  \ `constexpr` 提供不同的 API，允许他人添加其他重载或特化，或者完全禁用模板，\n\n## 5.8 概念的其他内容\n\n**===== 本章节/节正在编写中\
  \ =====**\n\n限制性构造函数\n\n静态多态的要求\n\n范围的要求\n\n## 5.9 后记\n\n\n\n\n\n自 C++98 以来，C++\
  \ 语言设计师一直在探索如何用概念（concepts）来约束模板参数。在 C++ 编程语言中引入概念有多种方法（例如参见 Bjarne Stroustrup 的\
  \ [`wg21.link/n1510`](http://wg21.link/n1510)）。然而，C++ 标准委员会无法对一种合适的机制达成共识（甚至在 C++11\
  \ 工作草案中采用过一套非常丰富的概念系统，但后来被舍弃了）。\n\n最终被接受的措述是由 Andrew Sutton 在 [`wg21.link/p0734r0`](http://wg21.link/p0734r0)\
  \ 中提出的。\n\n# ===== 本章/章节正在运行 =====\n\n# 6. 标准概念详述\n\n本章详细描述了 C++20 标准库中所有的 `concepts`。\n\
  \n## 6.1 所有标准概念概述\n\n表格 类型和对象的基本概念 列出了通用类型和对象的基本概念。\n\n表格 范围、迭代器和算法的概念 列出了用于创建视图及相应适配器的范围、迭代器和算法的概念。\n\
  \n表格 辅助概念 列出了主要作为其他概念构建块使用、通常不直接被应用程序程序员使用的概念。\n\n### 6.1.1 头文件与命名空间\n\n几乎所有的概念都定义在头文件\
  \ `<concepts>` 中，它被 `<ranges>` 和 `<iterator>` 包含。例外是：\n\n* `three_way_comparable`\
