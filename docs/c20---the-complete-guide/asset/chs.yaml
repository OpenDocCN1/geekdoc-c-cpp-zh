  | `indirect_equivalence_relation` | 类型引用的是可比较对象 |\n\n# 6 语言相关概念\n\n本节列出了适用于通用类型的概念。\n\
  \n### 6.2.1 算术概念\n\n`std::integral`\n 保证类型是整数类型（包括 `bool`）。\n- 满足：\n    - `is_integral_v`\
  \ 为真\n\n`std::signed_integral`\n 保证类型是有符号整数类型（包括 `char`）。\n- 满足：\n    - `is_signed_v`\
  \ 为真\n\n`std::unsigned_integral`\n 保证类型是无符号整数类型（包括 `char`）。\n- 满足：\n    - `is_unsigned_integral_v`\
  \ 为真\n\n`std::floating_point`\n 保证类型是浮点数类型（`float`、`double` 或 `long double`）。\n\
  引入该概念是为了定义常量。\n- 满足：\n    - `is_floating_point_v` 为真\n\n### 6.2.2 对象概念\n\n对象（非引用、函数或\
  \ `void`）有一系列需要的操作。\n\n`std::movable`\n 保证类型是可移动且可交换的。也就是说，你可以移动构造、移动赋值并与另一个对象交换。\n\
  - 满足：\n    - `move_constructible_v<T*>` 为真\n    - `assignable_v<T*, T&&>` 为真\n \
  \   - `swappable_v<T*>` 为真\n\n`std::copyable`\n 保证类型是可拷贝的（隐含可移动和可交换）。\n- 满足：\n \
  \   - `movable_v<T*>` 为真\n    - `copy_constructible_v<T*>` 为真\n    - `assignable_from_v<T*,\
  \ const T&>` 为真\n    - `swappable_v<T*>` 为真\n\n`std::semiregular`\n 保证类型是半规整的（可以默认初始化、拷贝、移动和交换）。\n\
  - 满足：\n    - `copyable_v<T*>` 为真\n    - `default_initializable_v<T*>` 为真\n    -\
  \ `movable_v<T*>` 为真\n    - `copy_constructible_v<T*>` 为真\n    - `assignable_from_v<T*,\
  \ const T&>` 为真\n\n\n\n\n\n- `std::swappable<T>`(#chap05.xhtml_concept-swappable)\
  \ 满足\n- `T` 既不是引用也不是函数或 `void`\n\n`std::regular<T>`\n- 保证类型 `T` 是正则的。（可以进行默认初始化、拷贝、移动、交换，并检查相等性）。\n\
  - 需要：\n    - `std::semiregular<T>`(#chap05.xhtml_concept-semiregular) 满足\n    -\
  \ `std::equality_comparable<T>`(#chap05.xhtml_concept-equalitycomparable) 满足\n \
  \   - `std::copyable<T>`(#chap05.xhtml_concept-copyable) 满足\n    - `std::default_initializable<T>`(#chap05.xhtml_concept-defaultinitializable)\
  \ 满足\n    - `std::movable<T>`(#chap05.xhtml_concept-movable) 满足\n    - `std::copy_constructible<T>`(#chap05.xhtml_concept-copyconstructible)\
  \ 满足\n    - `std::assignable_from`(#chap05.xhtml_concept-assignablefrom) 对于任何 `T`、`T&`、`const\
  \ T` 和 `const T&` 赋值给 `T&`。\n    - `std::swappable<T>`(#chap05.xhtml_concept-swappable)\
  \ 满足\n    - `T` 既不是引用也不是函数或 `void`\n\n### 6.2.3 类型关系概念\n\n`std::same_as<T1, T2>`\n\
  - 保证类型 `T1` 和 `T2` 是相同的。\n- 该概念调用了两次 `std::is_same_v` 类型特性(#chap04.xhtml_sameas-commutative)\
  \ 以确保参数顺序不重要。\n- 需要：\n    - 类型特性 `std::is_same_v<T1, T1>` 产生 `true`\n    - `T1`\
  \ 和 `T2` 的顺序不重要。\n\n`std::convertible_to<From, To>`\n- 保证类型为 `From` 的对象既可以隐式也可以显式地转换为类型为\
  \ `To` 的对象。\n- 需要：\n    - 类型特性 `std::is_convertible_v<From, From>` 产生 `true`\n \
  \   - 支持从 `From` 到 `To` 的 `static_cast`\n    - 你可以将类型为 `From` 的对象作为 `To` 返回\n\n\
  `std::derived_from<D, B>`\n- 保证类型 `D` 公共派自类型 `B`（或 `D` 和 `B` 是相同类型），使得任何类型为 `D`\
  \ 的指针都可以转换为类型为 `B` 的指针。换句话说：该概念保证 `D` 引用/指针可以用作 `B` 引用/指针。\n- 需要：\n    - 类型特性 `std::is_base_of_v<B,\
  \ B>` 产生 `true`\n    - 类型为 `D` 的 `const` 指针转换为 `B` 的类型特性 `std::is_convertible_v`\
  \ 产生 `true`\n\n`std::constructible_from<T, Args...>`\n- 保证你可以使用类型为 `Args…` 的参数初始化类型为\
  \ `T` 的对象\n- 需要：\n    - `std::destructible<T>`(#chap05.xhtml_concept-destructible)\
  \ 满足\n    - 类型特性 `std::is_constructible_v<T, T>` 产生 `true`\n\n`std::assignable_from<To,\
  \ From>`\n- 保证你可以移动或拷贝赋值一个类型为 `From` 的值给类型为 `To` 的值。\n赋值也必须产生原始的 `To` 对象。\n- 需要：\n\
  \    - `To` 必须是一个左值引用\n    - 对于类型的 `const` 左值引用，`std::common_reference_with<To,\
  \ To>`(#chap05.xhtml_concept-commonreferencewith) 满足\n    - 必须支持运算符 `=` 并产生与 `To`\
  \ 相同的类型\n\n`std::swappable_with<T1, T2>`\n- 保证类型为 `T1` 和 `T2` 的值可以交换。\n- 需要：\n \
  \   - `std::common_reference_with<T1, T1>`(#chap05.xhtml_concept-commonreferencewith)\
  \ 满足\n    - 两个类型为 `T1` 和 `T2` 的对象都可以使用 `std::ranges::swap()`(#chap05.xhtml-ranges-swap)\
  \ 交换值\n\n`std::common_with<T1, T2>`\n- 保证类型 `T1` 和 `T2` 共享一个共同类型，它们可以显式地转换为该类型。\n\
  - 需要：\n    - 类型特性 `std::common_type_t<T1, T1>` 产生一种类型\n    - 支持向它们的共同类型 `static_cast`\n\
  \    - 两种类型的引用共享一个 `common_reference`(#chap19.xhtml_commonreference) 类型\n    - `T1`\
  \ 和 `T2` 的顺序不重要。\n\n`std::common_reference_with<T1, T1>`\n- 保证类型 `T1` 和 `T2` 共享一个\
  \ `common_reference`(#chap19.xhtml_commonreference) 类型，它们可以显式和隐式地转换为该类型。\n- 需要：\n\
  \    - 类型特性 `std::common_reference_t<T1, T1>` 产生一种类型\n    - 两种类型都是 `std::convertible_to`(#chap05.xhtml_convertibleto)\n\
  \    - `T1`（此处原文不完整）\n\n### 6.2.4 比较概念\n\n`std::equality_comparable<T>`\n- 保证类型为\
  \ `T` 的对象可以通过 `==` 和 `!=` 运算符进行比较。\n- `T` 的 `==` 运算符应该具有对称性和传递性：\n    - 且且仅当 `t1==t2`\
  \ 为 `true` 时，`t1==t3` 为 `true`。\n    - 如果 `t1==t2` 为 `true`，这一语义约束(#chap04.xhtml_semanticconstraints)无法在编译时检查。\n\
  - 需要：\n    - 同时支持 `==` 和 `!=` 并产生 `bool` 类型的值\n\n`std::equality_comparable_with<T1,\
  \ T2>`\n- 保证类型为 `T1` 和 `T2` 的对象可以通过 `==` 和 `!=` 运算符进行比较。\n- 需要：\n    - 对于 `T1` 和\
  \ `T2` 的所有比较，都支持 `==` 和 `!=` 并产生 `bool` 类型的值\n\n`std::totally_ordered<T>`\n- 保证类型为\
  \ `T` 的对象可以通过 `==`、`!=`, `<`, 和 `>` 运算符进行比较，使得两个值总是相等、小于或大于。\n- `T` 的值应该具有全序(#chap02.xhtml_compcat)。无法在编译时检查。\n\
  - 需要：\n    - `std::equality_comparable<T>`(#chap05.xhtml_concept-equalitycomparable)\
  \ 满足\n    - 所有 `==`、`!=`, `<`, 和 `>` 比较产生 `bool` 类型的值\n\n`std::totally_ordered_with<T1,\
  \ T2>`\n- 保证类型为 `T1` 和 `T2` 的对象可以通过 `==`、`!=`, `<`, 和 `>` 运算符进行比较，使得两个值总是相等、小于或大于。\n\
  - 需要：\n    - 对于 `T1` 和 `T2` 的所有比较，都支持 `==` 和 `!=` 并产生 `bool` 类型的值。\n    - 对于 `T1`\
  \ 和 `T2` 的所有比较，都支持 `==`、`!=`, `<`, 和 `>` 并产生 `bool` 类型的值。\n\n`std::three_way_comparable<T>`\
  \ `std::three_way_comparable<T, Cat>`\n- 保证类型为 `T` 的对象可以通过 `==`、`!=`, `<`, `<=`,\
  \ `>`, `>=` 以及运算符 `<=>`(#chap02.xhtml_spaceship) 进行比较（并至少具有比较类别类型(#chap02.xhtml_compcattypes)\
  \ `Cat`）。如果未传递 `Cat`，则需要 `std::partial_ordering`。\n- 该概念定义在头文件 `<compare>` 中。\n\
  - 注意，该概念并不包含 `std::equality_comparable`(#chap05.xhtml_concept-equalitycomparable)，因为后者要求\
  \ `==` 仅在两个对象相等时产生 `true`。对于弱序或偏序，情况可能并非如此。\n- 注意，该概念现在包含了 std::totally_ordered，因为后者要求比较类别(#chap02.xhtml_compcat)\
  \ 是 `std::strong_ordering` 或 `std::weak_ordering`。\n- 需要：\n    - 所有 `==`、`!=`, `<`,\
  \ `<=`, `>`, 和 `>=` 比较产生可转换为 `bool` 的值。\n\n\n*   任何与运算符 `<=>` 的比较都会产生一个比较类别（其至少为\
  \ *Cat*）\n\n`std::three_way_comparable_with<*T1*, *T2*>` 或 `std::three_way_comparable_with<*T1*,\
  \ *T2*, *Cat*>`:\n\n    *   保证任何类型为 *T1* 和 *T2* 的两个对象都可以使用 `==`、`!=`, `<`, `<=`,\
  \ `>`, `>=`, 以及 运算符 `<=>` 进行比较（并且至少具有比较类别类型 *Cat*）。如果未传递 *Cat*，则需要 `std::partial_ordering`。\n\
  \n*   该概念定义在头文件 `<compare>` 中。\n\n*   注意，该概念并不意味着或包含 `std::equality_comparable_with`，因为后者要求运算符\
  \ `==` 仅在两个对象相等时返回真。在弱序或偏序中，情况可能并非如此。\n\n*   注意，该概念现在意味着并包含 std::totally_ordered_with，因为后者要求比较类别\
  \ 是 `std::strong_ordering` 或 `std::weak_ordering`。\n\n*   要求：\n\n    *   对于 *T1*\
  \ 和 *T2* 的值和共同引用（以及 *Cat*），满足 `std::three_way_comparable`。\n    *   所有与运算符 `==`、`!=`,\
  \ `<`, `<=`, `>`, `>=` 的比较都会产生可转换为 `bool` 的值。\n    *   任何与运算符 `<=>` 的比较都会产生一个比较类别（其至少为\
  \ *Cat*）。\n    *   *T1* 和 *T2* 的顺序并不重要。\n\n## 6.3 迭代器和范围的概念\n\n本节列出了迭代器和范围的所有基本概念，这些概念在算法和类似函数中非常有用。\n\
  \n注意，范围的概念位于 `std::ranges` 命名空间，而不是 `std`。\n\n### 6.3.1 范围和视图的概念\n\n定义了几个概念，要求参数为（特定的）范围。它们与迭代器概念对应。\n\
  \n`std::ranges::range<*Rg*>`\n\n*   保证 *Rg* 是一个有效的范围。\n*   这意味着类型为 *Rg* 的对象支持通过使用\
  \ `std::ranges::begin()` 和 `std::begin::end()` 来迭代元素。\n    如果该范围是一个数组，或者提供了 `begin()`\
  \ 和 `end()` 成员，或者可以与自由的 `begin()` 和 `end()` 函数一起，则满足这种情况。\n*   此外，对于 `std::ranges::begin()`\
  \ 和 `std::ranges::end()`，适用以下约束：\n\n    *   它们必须在（分摊）常数时间内操作。\n    *   它们不会修改范围。\n\
  \    *   `begin()` 在多次调用时产生产生相同的位置（除非范围没有至少提供向前迭代器）。\n    这意味着我们可以以良好的性能迭代所有元素（除非我们拥有纯输入迭代器，否则可以多次迭代）。\n\
  \n*   要求：\n\n    *   对于类型为 *Rg* 的对象 `rg`，支持 `std::ranges::begin(rg) 且支持 `std::ranges::end(rg)。\n\
  \n`std::ranges::output_range<*Rg*, *T*>`\n\n*   保证 *Rg* 是一个范围，它提供了至少输出迭代器（你可以用于写入的迭代器），其接受类型为\
  \ *T* 的值。\n*   要求：\n\n    *   满足 `std::range<*Rg*`。\n    *   对于迭代器类型和 `T`，满足 `std::output_iterator`。\n\
  \n`std::ranges::input_range<*Rg*>`\n\n*   保证 *Rg* 是一个范围，它提供了至少输入迭代器（你可以用于读取的迭代器）。\n\
  *   要求：\n\n    *   满足 `std::range<*Rg*`。\n    *   对于迭代器类型，满足 `std::input_iterator`。\n\
  \n`std::ranges::forward_range<*Rg*>`\n\n*   保证 *Rg* 是一个范围，它提供了至少向前迭代器（你可以用于读取、写入以及多次迭代的迭代器）。\n\
  *   要求：\n\n    *   满足 `std::input_range<*Rg*`。（注：原文写的是 input_range）\n\n`std::ranges::bidirectional_range<*Rg*>`\n\
  \n*   保证 *Rg* 是一个范围，它提供了至少双向迭代器（你可以用于读取、写入向后移动的迭代器）。\n*   要求：\n\n    *   满足 `std::forward_range<*Rg*`。\n\
  \    *   对于迭代器类型，满足 `std::bidirectional_iterator`。\n\n`std::ranges::random_access_range<*Rg*>`\n\
  \n*   保证 *Rg* 是一个范围，它提供了随机访问迭代器（你可以用于来回跳转并计算距离的迭代器）。\n*   要求：\n\n    *   满足 `std::bidirectional_range<*Rg*`。\n\
  \    *   对于迭代器类型，满足 `std::random_access_iterator`。\n\n`std::ranges::contiguous_range<*Rg*>`\n\
  \n*   保证 *Rg* 是一个范围，它提供了随机访问迭代器，且元素存储在连续内存中。\n*   要求：\n\n    *   满足 `std::random_access_range<*Rg*`。\n\
  \    *   对于迭代器类型，满足 `std::contiguous_iterator`。\n    *   调用 `std::ranges::data()`\
  \ 返回指向元素的原始指针。\n\n`std::ranges::sized_range<*Rg*>`\n\n*   保证 *Rg* 是一个范围，其元素数量可以通过其开始和结束之间的差计算。\n\
  *   对于类型为 *Rg* 的对象，`std::ranges::size()` 是定义的。\n*   要指示类型虽然提供了 `size()` 但满足此概念，可以定义\
  \ `std::disable_sized_range<Rg>` 返回真。\n*   要求：\n\n    *   满足 `std::range<*Rg*`。\n\
  \    *   支持 `std::ranges::size()`。\n    *   `std::ranges::disable_sized_range<*Rg*>`\
  \ 未定义真。\n\n`std::ranges::common_range<*Rg*>`\n\n*   保证 *Rg* 的开始迭代器和哨兵（结束迭代器）具有相同类型。\n\
  *   以下情况保证：\n\n    *   所有标准容器（vector, list 等）\n    *   `empty_view`\n以下情况不保证：\n\n\
  \    *   `take views`\n    *   `drop views`\n    *   `iota views`。\n    *   `std::ranges::iterator_t<*Rg*`。\n\
  \n\n\n\n*   也就是说，迭代器并不绑定到范围的生命周期。这意味着迭代器的使用更加安全，因为当创建它们的范围被销毁时，它们不会变成悬空指针。然而，如果范围的迭代器指向底层范围，而该底层范围不再存在，它们仍然可能悬空。\n\
  \n*   如果 `Rg` 是一个左值（例如带有名称的对象）或者变量模板 `std::ranges::enable_borrowed_range<Rg>`` 为\
  \ `true`，则提供该保证，以下视图均符合此情况：`subrange`, `ref_view`, `string_view`, `span`, `iota_view`\
  \ 以及 `empty_view`。\n\n*   要求：\n    * 满足 `std::range<Rg>`\n    * `Rg` 是一个左值 或 `enable_borrowed_range<Rg>`\
  \ 产生 `true`\n\n`std::ranges::view<Rg>`\n\n*   保证 `Rg` 是一个 view（一种拷贝、赋值和销毁开销很小的范围）。\n\
  \n*   视图具有以下要求：^(10)\n    * 它必须是一个 range（支持对元素进行迭代）。\n    * 它必须是可移动的。\n    * 移动构造函数/赋值、拷贝构造函数/赋值（可用）以及析构函数必须具有常复杂度（它们所需的时间不取决于元素的数量）。\n\
  \n除最后一个要求外都由相应的概念检查。最后一个要求必须由类型的实现者通过通过公共继承自 `std::ranges::view_interface`\n   \
  \ * 满足 `std::movable<Rg>`\n    * 变量模板 `std::enable_view<Rg>`` 适配器](#chap07.xhtml-ranges-all)转换为视图的范围。\n\
  \n*   如果 `Rg` 已经是一个视图或者范围的左值，则满足该概念。^(11)\n\n*   要求：\n    * 满足 `std::range<Rg>`\n\
  \    * 满足 `std::borrowed_range<Rg>` 或 `std::view<std::remove_cvref_t<Rg>>`\n\n###\
  \ 6.3.2 类指针对象的概念\n\n本节列出了所有对于可以使用运算符 `*` 来处理其指向的值的对象标准概念。这通常适用于原始指针、智能指针和迭代器。因此，这些概念通常用作处理迭代器和算法的概念的基础约束。注意，并不要求运算符\
  \ `->`。\n\n`std::indirectly_writable*P, *Val`\n\n*   保证 `P` 是一个支持使用运算符 `*` 赋值一个\
  \ `Val` 的类指针对象。\n*   非 const 原始指针、智能指针和迭代器满足，前提是 `Val` 可以赋值到 `P` 所引用的的地方。\n\n`std::indirectly_readable*P`\n\
  \n*   保证 `P` 是一个支持使用运算符 `*` 进行读访问的类指针对象。\n*   由原始指针、智能指针和迭代器满足。\n*   要求：\n    *\
  \ 结果值对于 const 和非 const 对象必须具有相同的引用类型（这排除了 `std::optional<>`）。这确保了 `P` 的 const 性不会传播到它指向的地方（当运算符返回成员的引用时，通常不是如此）。\n\
  \    * `std::iter_value_t<P>`类指针概念，你可以检查额外的约束条件：\n\n`std::indirectly_movable*InP,\
  \ OutP`\n\n*   保证 `InP` 可以移动赋值给 `OutP`。\n*   使用该概念，以下代码是有效的：\n```\nvoid foo(InP\
  \ inPos, OutP) {\n    *outPos = std::move(inPos);\n}\n```\n*   要求：\n    * 满足 `std::indirectly_readable<InP>`。\n\
  \    * `InP` 的引用满足 `std::indirectly_writable`。\n\n`std::indirectly_movable_storable*InP,\
  \ OutP`\n\n*   保证 `InP` 可以间接移动到 `OutP` 的值。\n*   使用该概念，以下代码是有效的：\n```\nvoid foo(InP\
  \ inPos, OutP) {\n    OutP tmp = *inPos;\n    *outPos = tmp;\n}\n```\n*   要求：\n\
  \    * 满足 `std::indirectly_able<InP, InP>`。\n    * 该值的 `const` 左值引用和右值引用满足 `std::indirectly_writable`。\n\
  \    * `InP` 引用的值满足 `std::copyable`。\n    * `InP` 引用的值是可移动构造和赋值的。\n\n`std::indirectly_copyable*InP,\
  \ OutP`\n\n*   保证 `InP` 可以直接赋值给 `OutP` 的值。\n*   使用该概念，以下代码是有效的：\n```\nvoid foo(InP\
  \ inPos, OutP) {\n    *outPos = *inPos;\n}\n```\n*   要求：\n    * 满足 `std::indirectly_readable<InP`。\n\
  \    * `InP` 的值满足 `std::indirectly_writable`。\n\n`std::indirectly_copyable_storable*InP,\
  \ OutP`\n\n*   保证当使用 `OutP` 指向的（临时）对象时，`InP` 可以间接赋值给 `OutP` 的值。\n*   使用该概念，以下代码是有效的：\n\
  ```\nvoid foo(InP inPos, OutP) {\n    OutP tmp = *inPos;\n    *outPos = tmp;\n}\n\
  ```\n*   要求：\n    * 满足 `std::indirectly_copyable<InP, InP>`。\n    * 该值的 `const`\
  \ 左值引用和右值引用满足 `std::indirectly_writable`。\n    * `InP` 引用的值满足 `std::copyable`。\n\
  \    * `InP` 引用的值是可移动构造和赋值的。\n\n`std::indirectly_swappable*P`, `std::indirectly_swappable<P1,\
  \ P2>`\n\n*   保证 `P` 的值或 `P1` 和 `P2` 的值可以交换（使用 `std::ranges::iter_swap()`）。\n* \
  \  要求：\n    * 满足 `std::indirectly_readable<P1>` 和 `std::indirectly_readable<P2>`。\n\
  \    * 对于任何类型为 *P1* 和 *P2* 的两个对象都支持 `std::ranges::iter_swap()`。\n\n\n\n\n\n`std::indirectly_comparable<P1,\
  \ P2, Comp>`, `std::indirectly_comparable<P1, P2, Comp, Proj1>`, `std::indirectly_comparable<P1,\
  \ P2, Comp, Proj1, Proj2>`\n\n*   保证你可以比较元素（可选地通过 `Proj1` 和 `proj2` 进行转换）与 `P1`\
  \ 和 `P2` 所指代的内容\n*   要求：\n    *   `Comp` 满足 `std::indirectly_binary_predicate`\n\
  \    *   `std::projected<P1, P1>` 和 `std::projected<P2, P2>` 在以 `std::identity`\
  \ 为默认投影时被满足\n\n### 6.3.3 迭代器概念\n\n本节列出了要求不同类型迭代器所需的概念。这些概念与范围概念 相对应。\n\n#### `std::input_output_iterator<Pos>`\n\
  \n*   保证 `Pos` 支持所有迭代器的基本接口：`operator++` 和 `operator*`，其中 `operator*` 必须引用一个值。\n\
  *   该概念不要求迭代器是可拷贝的（因此，这低于算法所用迭代器的基本要求）。\n*   要求：\n    *   满足 `std::weakly_incrementable<pos>`\n\
  \    *   运算符 `*` 产生一个引用\n\n#### `std::output_iterator<Pos, T>`\n\n*   保证 `Pos` 是一个输出迭代器（一种你可以向元素赋值的迭代器），并且你可以对其赋值类型为\
  \ `T` 的值。\n*   类型为 `Pos` 的迭代器可以用于赋值类型为 `T` 的值 `val`：\n    ```\n    *i++ = val;\n\
  \    ```\n*   这些迭代器仅适用于单次迭代。\n*   要求：\n    *   满足 `std::input_or_output_iterator<Pos>`\n\
  \    *   满足 `std::indirectly_writable<Pos, Pos>`\n\n#### `std::input_iterator<Pos>`\n\
  \n*   保证 `Pos` 是一个输入迭代器（一种你可以从元素中读取值的迭代器）。\n*   如果没有同时也满足 `std::forward_iterator`，则这些迭代器仅适用于单次迭代。\n\
  *   要求：\n    *   满足 `std::input_or_output_iterator<Pos>`\n    *   满足 `std::indirectly_readable<Pos>`\n\
  \    *   `Pos` 拥有一个派自 `std::input_iterator_tag` 的迭代器类别\n\n#### `std::forward_iterator<Pos>`\n\
  \n*   保证 `Pos` 是一个前向迭代器（一种你可以对元素进行多次向前迭代的读取迭代器）。\n*   要求：\n    *   满足 `std::input_iterator<Pos>`\n\
  \    *   满足 `std::incrementable<Pos>`\n    *   `Pos` 拥有一个派自 `std::forward_iterator_tag`\
  \ 的迭代器类别\n\n#### `std::bidirectional_iterator<Pos>`\n\n*   保证 `Pos` 是一个双向迭代器（一种你可以对元素进行多次向前或反向迭代的读取迭代器）。\n\
  *   要求：\n    *   满足 `std::forward_iterator<Pos>`\n    *   支持使用运算符 `--` 反向迭代\n  \
  \  *   `Pos` 拥有一个派自 `std::bidirectional_iterator_tag` 的迭代器类别\n\n#### `std::random_access_iterator<Pos>`\n\
  \n*   保证 `Pos` 是一个随机访问迭代器（一种你可以对元素进行跳跃式正向迭代的读取迭代器）。\n*   要求：\n    *   满足 `std::bidirectional_iterator<Pos>`\n\
  \    *   满足 `std::totally_ordered<Pos>`\n    *   满足 `std::sized_sentinel_for<Pos,\
  \ Pos>`\n    *   支持 `+`、`+=`、`-=`、`[]`\n    *   `Pos` 拥有一个派自 `std::random_access_iterator_tag`\
  \ 的迭代器类别\n\n#### `std::contiguous_iterator<Pos>`\n\n*   保证 `Pos` 是一个遍历内存的迭代器。\n\
  *   要求：\n    *   满足 `std::random_access_iterator<Pos>`\n    *   `Pos` 拥有一个派自 `std::contiguous_iterator_tag`\
  \ 的迭代器类别\n    *   对元素的 `to_address()` 是指向该元素的原始指针\n\n#### `std::sentinel_for<S,\
  \ Pos>`\n\n*   保证 `S` 可以用作 `Pos` 的哨兵（可能是某种类型的结束迭代器）。\n*   要求：\n    *   满足 `std::regular<S>`\n\
  \    *   满足 `std::input_or_output_iterator<Pos>`\n    *   可以使用运算符 `==` 和 `!=` 比较\
  \ `Pos` 和 `S`\n\n#### `std::sized_sentinel_for<S, Pos>`\n\n*   保证 `S` 可以用作 `Pos`\
  \ 的哨兵（可能是某种类型的结束迭代器），并且你可以计算它们之间的距离。\n*   为了表示你可以计算距离但不是常数复杂度，可以定义 `std::disable_sized_sentinel_for<S,\
  \ Pos>` 为 `true`。\n*   要求：\n    *   满足 `std::sentinel_for<S, Pos>`\n    *   对 `Pos`\
  \ 和 `S` 调用运算符 `-` 产生差类型的值\n    *   `std::disable_sized_sentinel_for<S, Pos>` 未定义为\
  \ `true`\n\n### 6.3.4 算法的迭代器概念\n\n#### `std::permutable<Pos>`\n\n*   保证你可以通过运算符\
  \ `++` 向前迭代，并通过移动和交换元素来重新排序\n*   要求：\n    *   满足 `std::forward_iterator<Pos>`\n\
  \    *   满足 `std::indirectly_movable_storable<Pos>`\n    *   满足 `std::indirectly_swappable<Pos>`\n\
  \n#### `std::mergeable<Pos1, Pos2, ToPos>`, `std::mergeable<Pos1, Pos2, ToPos, Comp>`,\
  \ `std::mergeable<Pos1, Pos2, ToPos, Comp, Proj1>`, `std::mergeable<Pos1, Pos2,\
  \ ToPos, Comp, Proj1, Proj2>`\n\n*   保证你可以将 Pos1 和 Pos2 所指的两个有序序列的元素合并，并将它们复制到 ToPos\
  \ 所指的序列中。顺序由运算符 `<` 或 `Comp` 定义（应用于可选通过投影 `Proj1` 和 `Proj2` 转换后的值）。\n*   要求：\n \
  \   *   `Pos1` 和 `Pos2` 均满足 `std::input_iterator`\n    *   `ToPos` 满足 `std::weakly_incrementable`\n\
  \    *   `Pos1` 和 `Pos2` 均满足 `std::indirectly_copyable<PosN, PosN>`\n    *   `Comp`、`std::projected<Pos1,\
  \ Pos1>` 和 `std::projected<Pos2, Pos2>` 满足 `std::indirectly_strict_weak_order`（以\
  \ `<` 为默认比较，以 `std::identity` 为默认投影），这意味着\n        *   `Pos1` 和 `Pos2` 满足 `std::indirectly_readable`\n\
  \        *   `Comp` 满足 `std::copy_constructible<Comp>`\n\n\n\n\n\n* `std::strict_weak_order<Comp>`\
  \ 对于 `Comp` 以及（投影后的）值/引用类型满足。\n* `std::sortablePos`, `std::sortablePos`, `Comp`,\
  \ `std::sortablePos`, `Comp`, `std::sortablePos`, `Comp`, `Proj`\n* 保证你可以使用运算符 `<`\
  \ 或 `Comp` 对迭代器 `Pos` 所指向的元素进行排序（在可选地对值应用投影 `Proj` 后）。\n* 要求：\n    * `std::permutable<Pos>`\
  \ 满足\n    * `std::indirect_strict_weak_order` 对于 `Comp` 和（投影后的）值满足（使用 `<` 作为默认比较，并使用\
  \ `std::identity` 作为默认投影），这意味着：\n        * `std::indirectly_readable<Pos>` 满足\n\
  \        * `std::copy_constructible<Comp>` 满足\n        * `std::strict_weak_order<Comp>`\
  \ 对于 `Comp` 以及（投影后的）值/引用类型满足\n\n## 6.4 可调用对象的概念\n\n本节列出了所有可调用对象的概念\n\n* 函数\n* 函数对象\n\
  *  lambda 表达式\n* 成员函数指针（带有对象的类型作为额外参数）\n\n### 6.4.1 可调用对象的基础概念\n\n`std::invocable<Op,\
  \ ArgTypes...>`\n\n* 保证 `Op` 对于类型为 `ArgTypes…` 的参数是可调用的。\n* `Op` 可以是函数、函数对象、lambda\
  \ 表达式或成员函数指针。\n* 如果为了说明该操作本身以及传递的参数都不会被修改，你可以使用 `std::regular_invocable` 代替。然而，请注意，这两个概念之间仅存在语义差异，这种差异无法在编译时检查。因此，概念的区别仅用于说明意图。\n\
  * 例如：\n\n```\n     struct S {\n        int member;\n        int mfunc(int);\n  \
  \      void operator()(int i) const;\n      };\n\n      void testCallable()\n  \
  \    {\n        std::invocable<decltype(testCallable)>      // 满足\n        std::invocable<decltype([](int){}),\
  \ char>   // 满足 (char 转换为 int)\n        std::invocable<decltype(&S::mfunc), S, int>\
  \ // 满足 (成员指针、对象、参数)\n        std::invocable<decltype(&S::member), S>;    // 满足\
  \ (成员指针和对象)\n        std::invocable<S, int>;                     // 由于 operator()\
  \ 满足\n      }\n```\n\n注意，作为类型约束，你只需要指定参数类型：\n\n```\n     void callWithIntAndString(std::invocable<int,\
  \ std::string> auto op);\n```\n\n欲需完整示例，请参阅将 lambda 作为非类型模板参数的使用。\n\n* 要求：\n   \
  \ * `std::invoke(op, args)` 对于类型为 `Op` 的 `op` 和类型为 `ArgTypes…` 的 `args` 是有效的。\n\n\
  `std::regular_invocable<Op, ArgTypes...>`\n\n* 保证 `Op` 对于类型为 `ArgTypes…` 的参数是可调用的，且调用不会改变传递的操作或传递的参数的状态。\n\
  * `Op` 可以是函数、函数对象、lambda 表达式或成员函数指针。\n* 注意，它与概念 `std::invocable` 的区别完全是语义上的，且无法在编译时检查。因此，概念的区别仅用于说明意图。\n\
  * 要求：\n    * `std::invoke(op, args)` 对于类型为 `Op` 的 `op` 和类型为 `ArgTypes…` 的 `args`\
  \ 是有效的。\n\n`std::predicate<Op, ArgTypes...>`\n\n* 保证可调用对象（函数、函数对象、lambda 表达式）`Op`\
  \ 在为类型为 `ArgTypes…` 的参数调用时是一个谓词。\n* 要求：\n    * `std::regular_invocable<Op>` 满足\n\
  \    * 所有带有 `ArgTypes…` 的 `Op` 调用都会产生一个可用的布尔值值。\n\n`std::relation<Pred, T1, T2>`\n\
  \n* 保证 `T1` 和 `T2` 的任何两个对象都具有可以传递给二元谓词的二元关系。\n* 注意，它与概念 `std::relation` 和 `std::strict_weak_order`\
  \ 的区别完全是[语义上的]，无法在编译时检查。因此，概念的区别仅用于说明意图。\n* 要求：\n    * `std::predicate` 对于 `pred`\
  \ 以及任何 `T1` 类型的组合满足。\n\n`std::strict_weak_order<Pred, T1, T2>`\n\n* 保证 `T1` 和 `T2`\
  \ 的任何两个对象具有严格全序。\n* 注意，它与概念 `std::relation` 和 `std::equivalence_relation` 的区别完全是[语义上的]，无法在编译时检查。因此，概念的区别仅用于说明意图。\n\
  * 要求：\n    * `std::predicate` 对于 `pred` 以及 `T1` 满足。\n\n`std::uniform_random_bit_generator<Op>`\n\
  \n* 保证 `Op` 可以作为返回（理想）相等概率无整数值的随机生成器。\n* 该概念定义在头文件 `<random>` 中。\n* 要求：\n    * `std::invocable<Op&`\
  \ 满足\n    * `std::unsigned_integral` 对于调用结果满足\n    * 支持表达式 `Op::min()` 和 `Op::max()`，且其类型与生成器相同\n\
  \    * `Op::min()` 小于 `Op::max()`\n\n### 6.4.2 迭代器使用的可调用对象的概念\n\n`std::indirectly_unary_invocable<Op,\
  \ Pos>`\n\n* 保证 `Op` 可以用 `Pos` 所指向的值进行调用。\n* 注意，它与概念 `indirectly_regular_unary_invocable`\
  \ 的区别完全是[语义上的]，无法在编译时检查。因此，不同的概念仅用于说明意图。\n* 要求：\n    * `std::indirectly_readable<Pos>`\
  \ 满足\n    * `std::copy_constructible<Op>` 满足\n    * `std::invocable` 对于 `Op` 以及\
  \ `Pos` 的值和（公共）引用类型满足。\n\n\n\n\n\n*   同时使用值和引用调用 `Op` 的结果具有一个公共引用类型。\n\n`std::indirectly_regular_unary_invocable<Op,\
  \ Pos>`\n\n*   保证可以使用 `Pos` 所引用的值对 `Op` 进行一元操作调用，且该调用不会改变 `Op` 的状态。\n*   注意，它与概念\
  \ `std::indirectly_unary_invocable` 的区别纯是语义上的差异，且无法在编译时检查。因此，不同的概念仅用于说明意图。\n*  \
  \ 要求：\n    * 满足 `std::indirectly_readable<Pos>`\n    * 满足 `std::copy_constructible<Op>`\n\
  \    * 对于 `Op&` 以及 `Pos` 的值和（公共）引用类型满足 `std::regular_invocable`\n    * 同时使用值和引用调用\
  \ `Op` 的结果具有一个公共引用类型。\n\n`std::indirect_unary_predicate<Pred, Pos>`\n\n*   保证可以使用\
  \ `Pos` 所引用的值对一元谓词 `Pred` 进行调用。\n*   要求：\n    * 满足 `std::indirectly_readable<Pos>`\n\
  \    * 满足 `std::copy_constructible<Pred>`\n    * 对于 `Pred&` 以及 `Pos` 的值和（公共）引用类型满足\
  \ `std::predicate`\n    * 所有这些对 `Pred` 的调用都会产生一个可用作布尔值且可转换为 `bool` 的值。\n\n`std::indirect_binary_predicate<Pred,\
  \ Pos1, Pos2>`\n\n*   保证可以使用 `Pos1` 和 `Pos2` 所引用的值对二元谓词 `Pred` 进行调用。\n*   要求：\n\
  \    * 对于 `Pos1` 和 `Pos2` 满足 `std::indirectly_readable`\n    * 满足 `std::copy_constructible<Pred>`\n\
  \    * 对于 `Pred&`、`Pos1` 的值或（公共）引用类型，以及 `Pos2` 的值或（公共）引用类型满足 `std::predicate`\n\
  \    * 所有这些对 `Pred` 的调用都会产生一个可用作布尔值且可转换为 `bool` 的值。\n\n`std::indirect_equivalence_relation<Pred,\
  \ Pos1>` 和 `std::indirect_equivalence_relation<Pred, Pos1, Pos2>`\n\n*   保证可以使用二元谓词\
  \ `Pred` 来检查 `Pos1` 和 `Pos1/Pos2` 的两个值是否等价。\n*   注意，它与概念 `std::indirectly_strict_weak_order`\
  \ 的区别纯是语义上的差异，且无法在编译时检查。因此，不同的概念仅用于说明意图。\n*   要求：\n    * 对于 `Pos1` 和 `Pos2` 满足 `std::indirectly_readable`\n\
  \    * 满足 `std::copy_constructible<Pred>`\n    * 对于 `Pred&`、`Pos1` 的值或（公共）引用类型满足\
  \ `std::equivalence_relation`\n    * 所有这些对 `Pred` 的调用都会产生一个可用作布尔值且可转换为 `bool` 的值。\n\
  \n`std::indirect_strict_weak_order<Pred, Pos1>` 和 `std::indirect_strict_weak_order<Pred,\
  \ Pos1, Pos2>`\n\n*   保证可以使用二元谓词 `Pred` 检查 `Pos1` 和 `Pos1/Pos2` 的两个值是否存在。\n*   注意，它与概念\
  \ `std::indirect_equivalence_relation` 的区别纯是语义上的差异，且无法在编译时检查。因此，不同的概念仅用于说明意图。\n\
  *   要求：\n    * 对于 `Pos1` 和 `Pos2` 满足 `std::indirectly_readable`\n    * 满足 `std::copy_constructible<Pred>`\n\
  \    * 对于 `Pred&`、`Pos1` 的值或（公共）引用类型，以及 `Pos2` 的值或（公共）引用类型满足 `std::strict_weak_order`\n\
  \    * 所有这些对 `Pred` 的调用都会产生一个可用作布尔值且可转换为 `bool` 的值。\n\n## 6.5 辅助概念\n\n本节描述了代码中常用的某些概念。\n\
  \n### 6.5.1 类型概念\n\n`destructible<T>`\n\n*   保证类型 `T` 在析构时不会抛出异常。\n*   要求：\n   \
  \ * `std::nothrow_destructible<T>` 为 `true`。\n\n`default_initializable<T>`\n\n*\
  \   保证类型 `T` 支持默认构造。\n*   要求：\n    * 满足 `std::constructible<T`\n    * 满足 `std::destructible<T`\n\
  \    * `T x;` 是有效的。\n\n`move_constructible<T>`\n\n*   保证类型 `T` 可以用右值（chap22.xhtml_rvalue）初始化。\n\
  *   这意味着以下操作是有效的（尽管可能是拷贝）：\n```\nT t2{std::move(t1)}\n```\n之后，`t2` 将具有与 `t1`相同的值，这是一个语义约束，无法在编译时检查。\n\
  *   要求：\n    * 满足 `std::copy_constructible<T`\n    * 对于任何 *T*、*T&*、*const T* 和 *const\
  \ T&* 满足 `std::constructible_from` 和 `std::convertible_to`\n    * 满足 `std::destructible<T`\n\
  \n`copy_constructible<T>`\n\n*   保证类型 `T` 可以用左值（chap22.xhtml_lvalue）初始化。\n*   这意味着以下操作是有效的：\n\
  ```\nT t2{t1}\n```\n之后，`t2` 将与 `t1` 相等，这是一个语义约束，无法在编译时检查。\n*   要求：\n    * 满足 `std::move_constructible<T`\n\
  \    * 满足 `std::constructible_from` 和 `std::convertible_to`\n    * 满足 `std::destructible<T`\n\
  \n`swappable<T>`\n\n*   保证可以交换两个类型为 `T` 对象的值。\n*   要求：\n    * 对于两个类型为 `T` 对象可以调用\
  \ `std::ranges::swap()`。\n\n### 6.5.2 可增类型概念\n\n`weakly_incrementable<T>`\n\n* \
  \  保证类型 `T` 支持递增运算符。\n*   注意，该概念**并不**要求对同一个值进行两次增加会得到相同的结果。因此，这仅是单次迭代的要求。\n*  \
  \ 与 `std::incrementable` 不同，如果满足以下条件，该概念也成立：\n    * 类型不可默认构造、不可拷贝或不可等等性比较\n    *\
  \ 后置递增可能返回 `void`（或任何其他类型）\n\n\n\n\n\n*   相同值的两次增可能会可能会不同的结果\n\n*   注意，与概念 `std::incrementable`\
  \ 之间的差异纯粹是语义差异，因此对于那些增量产生不同结果的类型，技术上仍可能满足 `incrementable` 概念。为了针对这种语义差异实现不同的行为，你应该使用迭代器概念。\n\
  \n*   要求：\n    * 满足 `std::default_initializable<T>`\n    * 满足 `std::movable<T>`\n\
  \    * `std::iter_difference_t<T>` 是有效的符号整数类型\n\n`std::incrementable<T>`\n\n*  \
  \ 保证类型 `T` 是一个可增量类型，因此你可以对同一个值序列进行多次迭代。\n\n*   与概念 `std::weakly_incrementable` 相比，它\n\
  \    *   要求相同值的两次增量产生不同的结果（正如前向迭代器所示）。\n    *   要求类型 `T` 是默认构造的、可拷贝且支持相等比较的。\n \
  \   *   要求后置增量返回迭代器的副本（返回类型为 `T`）。\n\n*   注意，与概念 `std::weakly_incrementable` 之间的差异纯粹是语义差异，因此对于那些增量产生不同结果的类型，技术上仍可能满足\
  \ `incrementable` 概念。为了针对这种语义差异实现不同的行为，你应该使用迭代器概念。\n\n*   要求：\n    * 满足 `std::weakly_incrementable<T>`\n\
  \    * 满足 `std::regular<T>`，以便该类型是默认构造的、可拷贝且支持相等比较的。\n\n## 6.6 Open\n\n## 6.7 Afternotes\n\
  \n## 7. Ranges（范围）与 Views（视图）\n\n从第一个 C++ 标准开始，处理容器和其他序列元素的方法一直是使用迭代器来指向第一个元素的位置（`begin`）和最后一个元素之后的位置（`end`）。因此，操作范围的算法通常接受两个参数来处理容器的所有元素，而容器提供了如\
  \ `begin()` 和 `end()` 函数来提供这些参数。\n\nC++20 提供了一种处理范围的新方法。你可以指定整体表示一个*范围*（元素序列）的对象，并将这些对象传递给算法，以整体方式处理序列的所有元素。\n\
  \n这种变化听起来非常简单，但正如你将看到的，它有很多影响。对于调用者和实现者来说，处理算法的方式发生了巨大的变化。因此，C++20 提供了几种处理范围的新特性：\n\
  \n    * 标准算法的新实现\n    * 若干辅助函数和新类型工具类\n    * 专门处理范围的概念\n    * 对视图的特殊处理（创建和使用开销很小的轻量级范围）。\n\
  \n本章介绍了范围和视图的基本方面和特性。后续章节将讨论细节。\n\n## 7.1 示例范围之旅\n\n让我们通过几个使用它们的示例来理解范围。\n\n###\
  \ 7.1.1 将容器作为范围传递给算法\n\n自 C++98 以来，我们习惯在处理元素集合时遍历半开范围。通过传递范围的开始和结束（通常来自容器的 `begin()`\
  \ 和 `end()` 成员函数），你可以指定需要处理哪些元素：\n\n```cpp\n#include <vector>\n#include <algorithm>\n\
  \nstd::vector<int> coll{25, 42, 2, 0, 122, 5, 7};\n\nstd::sort(coll.begin(), coll.end());\
  \  // 排序集合的所有元素\n```\n\nC++20 引入了*范围*的概念，它是对表示值序列的单个对象的抽象描述。每个容器都可以作为这样的范围，因此你现在可以将容器作为一个整体传递给算法：\n\
  \n```cpp\n#include <vector>\n#include <algorithm>\n#include <ranges>\n\nstd::vector<int>\
  \ coll{25, 42, 2, 0, 122, 5, 7};\n\nstd::ranges::sort(coll);              // 排序集合的所有元素\n\
  ```\n\n在这里，我们将 vector `coll` 传递给范围算法 `sort()`，以排序 vector 中的所有元素。\n\n在这个小示例中，已经有一些点非常值得注意：\n\
  \n    * 处理范围需要头文件 `<ranges>`。\n    * 范围库几乎所有的特性都定义在 `std::ranges` 命名空间中。\n\n引入一个新的命名空间是因为是因为我们引入了几个新的\
  \ API，并且希望保留现有的名称（例如算法名称 `sort`）。为了避免与现有 API 的歧义和冲突，功能被引入子命名空间 `ranges` 中。为命名空间\
  \ `std::ranges` 引入快捷方式（例如 `rng`）是非常常见的。因此，在实践中，代码可能如下：\n\n```cpp\n#include <vector>\n\
  #include <algorithm>\n#include <ranges>\nnamespace rng = std::ranges;          //\
  \ std::ranges 的快捷方式\n\nstd::vector<int> coll{25, 42, 2, 0, 122, 5, 7};\n\nrng::sort(coll);\
  \                      // 排序集合的所有元素\n```\n\n在书中，如果代码量过大，我可能会经常使用 `rng`。\n\n### 7.1.2\
  \ 带有要求的算法\n\n新的范围算法将范围参数声明为模板参数。为了在处理范围时指定并验证必要的要求，C++20 为范围引入了几个概念。\n\n例如，考虑用于范围的\
  \ `sort()` 算法。原则上讲，它的定义如下（部分细节稍后介绍）：\n\n```cpp\ntemplate<std::ranges::random_access_range\
  \ R,\n         typename Comp = std::ranges::less>\nrequires std::sortable<std::ranges::iterator_t<R>,\
  \ Comp>\n... sort(R&& r, Comp comp = {});\n```\n\n此声明已经包含了多个范围特性：\n\n    * 两个标准概念为传递的范围\
  \ `R` 指定了要求：\n        * 概念 `std::ranges::random_access_range` 要求 `R` 是一个提供随机访问迭代器的范围（可以使用它们进行读写、前后跳跃和计算距离的迭代器）。该概念包含（subsumes）范围的基础概念：`std::range`，它要求传递的参数要么是数组，要么作为成员或自由函数提供\
  \ `begin()` 和 `end()`。\n        * 概念 `std::sortable` 要求范围 `R` 中的元素可以通过排序准则 `Comp`\
  \ 进行排序。\n    * 新类型工具 `std::ranges::iterator_t` 用于将迭代器类型传递给 `sortable`。\n    * 默认比较准则使用了了\
  \ `std::ranges::less`，它定义了排序算法通过 `<` 进行排序。`std::ranges::less` 类似于受概念约束的 `std::less`，确保了所有比较运算符（`==`,\
  \ `!=`, `<`, `<=`, `>`, 和 `>=`）都是支持的且值具有全序。\n\n这意味着，你可以传递任何具有随机访问迭代器且可排序元素的范围：\n\
  \n\n\n\n\n```cpp\n#include <iostream>\n#include <string>\n#include <vector>\n#include\
  \ <algorithm>\n\nvoid print(const auto& coll) {\n  for (const auto& elem : coll)\
  \ {\n    std::cout << elem << ' ';\n  }\n  std::cout << '\\n';\n}\n\nint main(int\
  \ argc, char** argv)\n{\n  std::vector<std::string> coll{\"Rio\", \"Tokyo\", \"\
  New York\", \"Berlin\"};\n\n  std::ranges::sort(coll);     // sort elements\n  std::ranges::sort(coll[0]);\
  \  // sort character in first element\n  print(coll);\n\n  int arr[] = {42, 0, 8,\
  \ 15, 7};\n  std::ranges::sort(arr);      // sort values in array \n  print(arr);\
  \                 \n}\n```\n\n### `lib/rangessort.cpp`:\n\n该程序的输出如下：\n\n```\nBeilnr\
  \ New York Rio Tokyo\n0 7 8 15 42\n```\n\n如果你传递了一个没有随机访问迭代器的容器/范围，你会得到一个错误信息，提示概念\
  \ `std::ranges::random_access_range` 未满足：\n\n```cpp\nstd::list<std::string> coll2{\"\
  New York\", \"Rio\", \"Tokyo\"};\nstd::ranges::sort(coll2);  // ERROR: random_access_range\
  \ not satisfied\n```\n\n如果你传递了一个无法使用运算符 `<` 比较元素的容器/范围，则 `std::sortable` 不满足：\n\n\
  ```cpp\nstd::vector<std::complex<double>> coll3;\nstd::ranges::sort(coll3);  //\
  \ ERROR: sortable<> not satisfied\n```\n\n### 7.1.3 Views（视图）\n\n为了处理范围，C++20 还引入了\
  \ `views`。视图是轻量级的范围，它们：\n\n* 可以引用范围和子范围\n* 可以通过过滤某些元素或对其值进行某些变换来遍历范围中的元素\n* 自身就可以表示值的序列\n\
  \n例如，你可以使用视图来仅遍历范围的前 5 个元素：\n\n```cpp\nfor (const auto& elem : std::views::take(coll,\
  \ 5)) {\n  ...\n}\n```\n\n在这里，我们使用了范围适配器 `std::views::take()`。范围适配器是定义在 `std::views`\
  \ 空间中的辅助函数，用于创建视图。`take()` 创建一个指向传递范围的前 `n` 个元素的视图（如果有的话）。因此通过\n\n```cpp\nstd::views::take(coll,\
  \ 5)\n```\n\n我们向 `coll` 传递了一个视图，该视图结束于它的第六个元素（如果元素较少则结束于最后一个元素）。视图提供了范围的常用 API，可以使用\
  \ `begin()`、`end()` 和运算符 `++` 来遍历元素，并可以使用运算符 `*` 和 `->` 来处理值。\n\n这种视图也可以用于仅排序前 5\
  \ 个元素：\n\n```cpp\nstd::ranges::sort(std::views::take(coll, 5));  // sort coll 前\
  \ 5 个元素\n```\n\n视图本身也可以生成值的序列。例如，通过 iota 视图，我们可以如下所示遍历从 1 到 10 的所有值：\n\n```cpp\n\
  for (int val : std::views::iota(1, 11)) {  // iterate 从 1 到 10\n  ...\n}\n```\n\n\
  在内部，适配器使用了如 `std::ranges::take_view` 或 `std::ranges::iota_view` 等视图类型，你也可以直接使用它们。然而，应该优先使用适配器，因为它们通常更智能并能够优化。例如，如果传递的集合已经是\
  \ `string_view`，`take()` 可能会产生 `string_view` 而不是 `take_view`。\n\n### 7.1.3.1 组合范围和视图\n\
  \n不生成值的视图可以作为构建块。\n\n假设你想使用以下三个视图：\n\n```cpp\n//  coll 中是 3 的倍数的元素的视图：\nstd::views::filter(coll,\
  \ [] (auto elem) {\n                           return elem % 3 == 0;\n         \
  \                })\n\n//  coll 中元素平方视图：\nstd::views::transform(coll, [] (auto elem)\
  \ {\n                              return elem * elem;\n                       \
  \     })\n\n//  coll 中前 3 个元素的视图：\nstd::views::take(coll, 3)\n```\n\n由于视图是一个范围，因此你可以将视图作为另一个视图的参数：\n\
  \n```cpp\n// 获取 coll 中是 3 的倍数的元素的前 3 个平方值的视图：\nauto v = std::views::take(\n    \
  \       std::views::transform(\n             std::views::filter(coll,\n        \
  \                        [] (auto elem) { return elem % 3 == 0; }),\n          \
  \   [] (auto elem) { return elem * elem; }),\n           3);\n```\n\n这种嵌套难以阅读和维护。然而，还有另一种组合范围和视图的方法：视图允许使用运算符\
  \ `|` 来管道（pipe）输入需要处理的底层范围：\n\n```cpp\n// 获取 coll 中是 3 的倍数的元素的前 3 个平方值的视图：\nauto\
  \ v = coll\n          | std::views::filter([] (auto elem) { return elem % 3 == 0;\
  \ })\n          | std::views::transform([] (auto elem) { return elem * elem; })\n\
  \          | std::views::take(3);\n```\n\n### 7.1.4 Sentinels（哨兵）\n\n为了处理范围，我们必须引入一个新的术语\
  \ `sentinels`（哨兵），它们代表范围的结束。\n\n在编程中，哨兵是一个标记结束或终止的特殊值。典型示例包括：\n\n* 空终止符 `'\\0'`\
  \ 作为字符序列的结束（例如用于字符串字面量）\n* `nullptr` 标记链表的结束\n* `-1` 标记非负整数列表的结束\n\n在范围库中，哨兵定义了**范围的结束**。在\
  \ STL 的传统方法中，哨应该是结束迭代器，其类型通常与遍历集合的迭代器相同。然而，在 C++20 中，这不再必要的。\n\n结束迭代器必须与定义范围起始并用于遍历元素的迭代器具有相同类型会导致一些缺点。创建结束迭代器可能开销很大，甚至可能无法实现：\n\
  \n* 如果我们把 C 字符串或字符串字面量作为范围，我们必须通过遍历字符直到找到 `'\\0'` 来计算结束迭代器。因此，在将字符串作为范围之前，我们已经完成了第一次迭代。\n\
  \n\n\n\n\n* 通常情况下，如果我们通过某个特定值来定义范围的终点，该原则就适用。如果我们需要一个结束迭代器来处理该范围，我们必须先遍历整个范围以找到它的终点。\n\
  \n* 有时，遍历两次（一次寻找终点，另一次处理范围内的元素）是不可能的。这适用于使用纯输入迭代器（pure input iterators）的范围，例如将从输入流中读取的内容作为范围。为了计算输入的末尾（可能是\
  \ `EOF`），我们已经必须读取了输入。再次读取输入是不可能的，或者会产生不同的值。\n\n将结束迭代器泛化为哨兵（sentinels）解决了这一困境。C++20\
  \ 范围支持不同类型的哨兵（结束迭代器）。它们可以信号 `until '\\0''`、`until EOF` 或直到任何其他值。它们甚至可以信号“没有终点”来定义无限范围，并告诉“嘿，迭代器，你自己检查一下是否有终点”。\n\
  \n注意，在 `C++`20 之前，我们也可以拥有这种哨兵，但它们要求与迭代器具有相同的类型。一个例子是`输入流迭代器`：一个默认构造的 `istream_iterator<>`\
  \ 被用来创建`流结束迭代器`，以便你可以使用算法处理来自流的输入，直到文件末尾或发生错误：\n\n```\n// 打印从标准输入读取的所有整数：\nstd::for_each(std::istream_iterator<int>{std::cin},\
  \  // 从 cin 读取整数\n              std::istream_iterator<int>{},          // 结束是一个文件末尾迭代器\n\
  \              [] (int val) {\n                std::cout << val << '\\n';\n    \
  \          });\n```\n\n因此，通过放宽哨兵（结束迭代器）现在必须与迭代迭代器具有相同类型的限制，我们获得了几个用处：\n\n* 我们可能跳过在开始处理之前寻找终点的需要（我们在迭代时同时处理值并寻找终点）。\n\
  \n* 对于结束迭代器，我们可以使用禁用了会导致未定义行为的操作类型（例如调用操作符 `*`，因为末尾没有值）。我们可以利用这一点在尝试解引用结束迭代器时在编译时信号错误。\n\
  \n* 定义结束迭代器变得更简单了。\n\n让我们来看一个简单的示例，即使用不同类型的哨兵来遍历一个迭代器类型不同的“范围”：\n\n```\n#include\
  \ <iostream>\n#include <compare>\n#include <algorithm>  // 用于 for_each()\n\nstruct\
  \ NullTerm {\n  bool operator== (auto pos) const {\n    return *pos == '\\0';  //\
  \ 结束是迭代器指向'\\0'的地方\n  }\n};\n\nint main()\n{\n  const char* rawString = \"hello\
  \ world\";\n\n  // 定义一个原始字符串和空终止符的范围：\n  std::ranges::subrange rawStringRange{rawString,\
  \ NullTerm{}};\n\n  // 在算法中使用该范围： \n  std::ranges::for_each(rawStringRange,\n  \
  \                      [] (char c) {\n                          std::cout << ' '\
  \ << c;\n                        });\n  std::cout << '\\n';\n\n  // 基于范围的 循环也支持迭代器/哨兵：\n\
  \  for (char c : rawStringRange) {\n    std::cout << ' ' << c;\n  }\n  std::cout\
  \ << '\\n';\n}\n```\n\n`lib/sentinel1.cpp`:\n\n该程序有以下输出：\n\n```\n h e l l o   w\
  \ o r l d\n h e l l o   w o r l d\n```\n\n在程序中，我们首先定义了一个结束迭代器，将终点定义为值为 `'\\0'`：\n\
  \n```\nstruct NullTerm {\n  bool operator== (auto pos) const {\n    return *pos\
  \ == '\\0';  // 结束是迭代器指向'\\0'的地方\n  }\n};\n```\n\n注意，我们在这里结合了 `C++`20 的其他几个新特性：\n\
  \n* 在定义 `operator==` 时，我们使用 `auto` 作为参数类型。这样，我们就能使操作符 `==` 能够与任意类型的对象 `pos` 进行比较（前提是在体中将其值与字符进行比较是有效的）。\n\
  \n* 我们只将 `operator==` 定义为成员函数，尽管算法通常使用操作符 `!=` 来比较迭代器和哨兵。在这里我们受益于 `C++`20 现在可以将操作符\
  \ `!=` 映射到操作符 `==`，操作数顺序任意。\n\n#### 7.1.4.1 直接使用哨兵\n\n然后我们使用一个基础循环来遍历字符串 `rawString`\
  \ 的字符“范围”：\n\n```\nfor (auto pos = rawString; pos != NullTerm{}; ++pos) {\n  std::cout\
  \ << ' ' << *pos;\n}\n```\n\n我们将 `pos` 初始化为遍历字符的迭代器，并使用 `*pos` 打印它们的值。只要它与 `NullTerm{}`\
  \ 的比较产生 `pos` 的值不等于 `'\\0'`，循环就会运行。也就是说，`NullTerm{}` 充当结束迭代器。它与 `pos` 不是相同类型，但它支持与\
  \ `pos` 进行比较，其方式是检查 `pos` 所指的当前值。\n\n在这里你可以看到哨兵是结束迭代器的泛化。它们的类型可能与遍历范围的迭代器类型不同。\n\
  \n#### 7.1.4.2 将哨兵传递给算法\n\n`std` 中的算法不再要求开始和结束具有相同类型。然而，`std` 中的重载仍然要求传递相同类型的迭代器：\n\
  \n```\nstd::for_each(rawString, NullTerm{ // 错误：开始和结束类型不同\n```\n\n有两个相同类型的迭代器，`std::common_iterator`\
  \ 提供了一种将它们协调的方法。\n\n##### 7.1.5 使用哨兵和计数定义范围\n\n范围不仅可以是容器或迭代器对。范围可以通过以下方式定义：\n\n\
  * 相同类型的开始迭代器和结束迭代器\n* 开始迭代器和哨兵（不同类型）\n* 开始迭代器和计数\n* 数组\n\n范围支持这些范围的定义和使用。例如：\n\n\
  ```cpp\nint rawArray[] = {8, 6, 42, 1, 77};\nstd::ranges::sort(rawArray);\n```\n\
  \n此外，还有几种用于定义迭代器、哨兵或计数范围，将在后续章节介绍。\n\n##### 7.1.5.1 子范围 (Subranges)\n\n为了定义迭代器和哨兵的范围，范围库提供了类型\
  \ `std::ranges.subrange<>`。\n\n让我们来看一个子范围的简单示例：\n\n```cpp\n#include <iostream>\n\
  #include <vector>\n#include <algorithm>\n\ntemplate<auto End>\nstruct EndValue {\n\
  \  bool operator== (auto pos) const {\n    return *pos == End;  // 结束是迭代器指向 End\
  \ 的地方\n  }\n};\n\nint main()\n{\n  std::vector<int> coll = {42, 8, 0, 15, 7, -1};\
  \  // -1 标记结束\n\n  // 定义一个从 coll 开始到元素 7 结束的范围：\n  std::ranges::subrange range{coll.begin(),\
  \ EndValue<7>{}};\n\n  // 对该范围的元素进行排序：\n  std::ranges::sort(range);\n\n  // 打印范围的元素：\n\
  \  std::ranges::for_each(range,\n                        [] (auto val) {\n     \
  \                     std::cout << ' ' << val;\n                        });\n  std::cout\
  \ << '\\n';\n\n  // 打印 coll 中直到 1 的所有元素：\n  std::ranges::for_each(coll.begin(),\
  \ EndValue<-1>{},\n                        [] (auto val) {\n                   \
  \       std::cout << ' ' << val;\n                        });\n  std::cout << '\\\
  n';\n}\n```\n\n`lib/sentinel2.cpp`:\n\n作为哨兵的示例，我们定义类型 `NullTerm` 作为检查字符串空终止符作为范围终点的哨兵类型。\n\
  \n\n\n\n\n通过使用 `std::ranges::subrange`，程序定义了一个表示字符串起始位置并将哨兵（sentinel）作为结束位置的范围对象：\n\
  \n```\nstd::ranges::subrange rawStringRange{rawString, NullTerm{}};\n```\n\nsubrange\
  \ 是一种*通用的*类型，用于可以将迭代器和哨兵转换为表示该范围的单一对象。事实上，该范围甚至是一个视图（view），它在内部只存储了迭代器和哨兵。这意味着 subrange\
  \ 具有引用语义，并且进行拷贝的开销很小。\n\n现在，我们可以将范围传递给以范围作为参数的新算法：\n\n```\nstd::ranges::for_each(rawStringRange,\n\
  \                      ...);\n```\n\n注意，`subrange` 的 `begin()` 和 `end()` 可能会产生不同的类型，因为它们直接返回定义范围时所传递的内容。\n\
  \n最后，请注意，基于范围的 `for` 循环接受起始迭代器和结束迭代器类型不同的范围（这一特性在 C++17 中已经引入，但通过 ranges 使用，你可以真正从中受益）：\n\
  \n```cpp\nfor (char c : std::ranges::subrange{rawString, NullTerm{}}) {\n  std::cout\
  \ << ' ' << c;\n}\n```\n\n通过定义一个类模板，我们可以指定结束范围的值，从而使这种方法变得更加通用。考虑以下示例：\n\n```cpp\n\
  #include <iostream>\n#include <algorithm>\n\ntemplate<auto End>\nstruct EndValue\
  \ {\n  bool operator== (auto pos) const {\n    return *pos == End;  // end 是迭代器指向\
  \ End 的地方\n  }\n};\n\nint main()\n{\n  std::vector coll = {42, 8, 0, 15, 7, -1};\
  \  // -1 标记结束\n\n  // 定义从 coll 开始、以元素 7 为结束的范围：\n  std::ranges::subrange range{coll.begin(),\
  \ EndValue<7>{}};\n\n  // 对该范围的元素排序：\n  std::ranges::sort(range);\n\n  // 打印该范围的元素：\n\
  \  std::ranges::for_each(range,\n                        [] (auto val) {\n     \
  \                     std::cout << ' ' << val;\n                        });\n  std::cout\
  \ << '\\n';\n\n  // 打印 coll 中直到 -1 的所有元素：\n  std::ranges::for_each(coll.begin(),\
  \ EndValue<-1>{},\n                        [] (auto val) {\n                   \
  \       std::cout << ' ' << val;\n                        });\n  std::cout << '\\\
  n';\n}\n```\n\n`lib/sentinel3.cpp`:\n\n在这里我们将 `EndValue<>` 定义为结束迭代器，用于检查作为模板参数传递的结束值。`EndValue<7>{}`\
  \ 创建了一个结束迭代器，其中 `7` 结束范围；而 `EndValue<-1>{}` 创建了一个其中 `-1` 结束范围的结束迭代器。\n\n程序的输出如下：\n\
  \n```\n 0 8 15 42\n 0 8 15 42 7\n```\n\n你可以定义任何支持的非类型模板参数类型。\n\n作为哨兵的另一个示例，查看 `std::unreachable_sentinel`。这是\
  \ C++20 定义的一个值，用于表示无限范围的“结束”。它可以帮助优化代码，使其永远不与结束进行比较（因为当结果始终为 `false` 时，这种比较是无用的）。\n\
  \n### 7.1.5.2 起始位置和计数的范围\n\nranges 库提供了多种方法来处理由起始位置和计数定义的范围。\n\n通过起始迭代器和计数创建范围最方便的方法是使用范围适配器\
  \ `std::views::counted()`。它创建了一个指向起始迭代器/指针开始的的 *n* 个元素的廉价视图。\n\n例如：\n\n```cpp\n\
  std::vector<int> coll{1, 2, 3, 4, 5, 6, 7, 8, 9};\n\nauto pos5 = std::ranges::find(coll,\
  \ 5);\nif (std::ranges::distance(pos5, coll.end()) >= 3) {\n  for (int val : std::views::counted(pos5,\
  \ 3)) {\n    std::cout << val << ' ';\n  }\n}\n```\n\n在这里，`std::views::counted(pos5,\
  \ 3)` 创建了一个表示从 `pos5` 所指位置开始的 3 个元素的视图。注意，`counted()` ***不会*** 是否存在元素（传递过大的计数会导致未定义行为）。确保代码有效性是程序员的责任。因此，我们使用\
  \ `std::ranges::distance()`, 3)) {\n  std::cout << val << ' ';\n}\n```\n\n计数可能为\
  \ `0`，这意味着该范围是空的。\n\n详细信息请参阅 `std::views::counted()` 的描述。注意，当你已经有一个范围并想使用 `take()`\
  \ 时，应使用 `counted()`。\n\n### 7.1.6 投影（Projections）\n\n`sort()` 以及许多其他算法通常有一个可选的模板参数，即*投影*：\n\
  \n```cpp\ntemplate<class R,\n         typename Comp = std::less,\n         typename\
  \ Proj = std::identity>\nrequires std::sortable<R, Comp, Proj>\n... sort(R&& r,\
  \ Comp comp = {}, Proj proj = {});\n```默认投影是 `std::identity`，它被定义为函数对象。\n\n自定义的投影只需要接收一个参数并返回一个值。\n\
  \n你可以看到，可排序的要求考虑了投影：\n\n```cpp\nrequires std::sortable<R, Comp, Proj>\n```\n\n###\
  \ 7.1.7 为范围编写代码的工具\n\n为了方便针对所有类型的范围进行编程，ranges 库提供了：\n\n*   **通用函数**，例如，产生迭代器或范围的大小。\n\
  *   **类型函数**，例如，产生迭代器的类型或元素的类型。\n\n考虑我们想要实现一个获取范围最大值的算法：\n\n```cpp\n#include <ranges>\n\
  \ntemplate<std::ranges::input_range Range>\nstd::ranges::range_value_t<Range> maxValue(const\
  \ Range& rg)\n{\n  if (std::ranges::empty(rg)) {\n    return std::ranges::range_value_t<Range>{};\n\
  \  }\n  auto pos = std::ranges::begin(rg); \n  auto max = *pos;\n  while (++pos\
  \ != std::ranges::end(rg)) {\n    if (*pos > max) {\n      max = *pos;\n    }\n\
  \  }\n  return max;\n}\n```\n\n`lib/maxvalue1.hpp`:\n\n在这里我们使用了标准工具来处理范围 `rg`：\n\
  \n*   概念 `std::ranges::input_range` 用于要求传递的参数是可以读取的范围。\n*   类型函数 `std::ranges::range_value_t`\
  \ 产生元素的类型。\n*   辅助函数 `std::ranges::empty()` 判断范围是否为空。\n*   辅助函数 `std::ranges::begin()`\
  \ 产生指向第一个元素的迭代器（如果有）。\n*   辅助函数 `std::ranges::end()` 产生范围的哨兵（结束迭代器）。\n\n借助这些类型工具的帮助，该算法甚至适用于所有范围（包括数组），因为这些工具也为它们进行了定义。\n\
  \n\n\n\n\n例如，`std::ranges::empty()` 会尝试调用成员函数 `empty()`、成员函数 `size()`、非成员函数 `size()`，或者检查\
  \ `begin` 迭代器和 `end` 迭代器是否相同。\n\n范围工具 详细列出了用于范围的工具。\n\n注意，通用函数 `maxValue()` 最好将传递的范围\
  \ `rg` 声明为`universal reference`（也称为转发引用，forward reference），因为当某些轻量级范围（视图）为 `const`\
  \ 时，你无法对它们进行迭代：\n\n```cpp\ntemplate<std::ranges::input_range Range>\nstd::ranges::range_value_t<Range>\
  \ maxValue(Range&& rg)\n```\n\n这将在后文详细介绍 中进行讨论。\n\n## 7.1.8 范围的局限性与缺点\n\n至少在 C++20\
  \ 中，范围也存在一些主要的局限性和缺点，在进行通用介绍时应当提到：\n\n* 数值算法尚不支持范围。要将范围传递给这些算法，你必须显式地传递 `begin()`\
  \ 和 `end()`：\n\n```cpp\n std::ranges::accumulate(cont, 0L);                    \
  \     // ERROR: 未提供\n std::accumulate(cont.begin(), cont.end(), 0L);           \
  \  // OK\n```\n\n* 并行算法尚不支持范围。\n\n```cpp\n std::ranges::sort(std::execution::par,\
  \ cont);              // ERROR: 未提供\n std::sort(std::execution::par, cont.begin(),\
  \ cont.end());  // OK\n```\n\n* 几个用于 `begin` 和 `end` 的传统 API 要求它们具有相同的类型（容器 `containers`在\
  \ `std` 命名空间中的算法均是如此）。你可能需要通过 `std::views::common()` 或 `std::common_iterator`来协调它们的类型。\n\
  \n* 对于某些视图，当视图为 `const` 时你无法对元素进行迭代。因此，通用代码可能必须使用`universal/forwarding references`。\n\
  \n* `cbegin()` 和 `cend()` 函数的设计是为了确保你无法（意外）修改正在迭代的元素，但对于引用非 `const` 对象的视图是失效的。\n\
  \n* 当视图引用容器时，它们的 const 属性传播会失效。\n\n* 范围导致了严重的命名空间混乱。仅考虑以下 `sort()` 的声明：\n\n```cpp\n\
  template<std::ranges::input_range Rg,\n           typename T,\n           typename\
  \ Proj = std::identity>\n  requires std::indirect_binary_predicate<std::ranges::equal_to,\n\
  \                                          std::projected<std::ranges::iterator_t<Rg>,\
  \ Proj>,\n                                          const T*>\n  constexpr std::ranges::borrowed_iterator_t<Rg>\n\
  \    find(Rg&& rg, const T& value, Proj proj = {});\n```\n\n要清楚何时必须使用哪个命名空间真的并不容易。\n\
  \n此外，我们在 `std` 命名空间和 `std::ranges` 命名空间中都有一些行为略有不同的符号。这里，`equal_to` 就是这样一个例子。你也可以使用\
  \ `std::equal_to`，但通常情况下 `std::ranges` 中的通用工具提供了更好的支持，并且对于边界情况更健壮。\n\n## 7.2 使用视图\n\
  \n如介绍所示，视图是轻量级范围，可以作为构建块来处理其他范围和视图中所有或部分元素的（修改后的）值。\n\nC++20 提供了几种视图类型 和用于创建它们的`range\
  \ adaptors`范围适配器。对于几乎每种视图类型都有对应的 `range adaptor`，它是一个函数对象，允许我们通过调用函数来创建视图。适配器定义在\
  \ `std::views` 命名空间中（等同于 `std::ranges::views` 命名空间），通常采用不带 `_view` 后缀的视图名称。\n\n\
  范围和视图适配器提供了创建视图的最简单方法。它们可以用来范围转换为视图，或者为范围/视图产生视图，其中元素以各种方式被修改：\n\n* 过滤掉元素\n* 修改元素的值\n\
  * 改变元素的顺序\n* 组合或创建子范围\n\n表格 初始视图 列出了 C++20 中产生初始视图的标准视图和适配器。它们特别可以作为视图流水线 中的起始构建块（可以接收容器等范围作为输入，或自身生成值）。\n\
  \n### 初始视图\n\n| **适配器** | **类型** | **效果** |\n| --- | --- | --- |\n| `all(`…`)` |\
  \ 变化 | 将范围转换为视图 |\n| `counted(`…`)` | 变化 | 从起始迭代器和计数计数创建视图 |\n| | `subrange` | 从起始迭代器和哨兵（sentinel）创建视图\
  \ |\n| | `ref_view` | 从起始迭代器和哨兵创建视图 |\n| `iota(`**`)` | `iota_view` | 从起始迭代器和哨兵创建视图\
  \ |\n| `iota(`**`)` | `iota_view` | 从起始迭代器和哨兵创建视图 |\n| `single(`**`)` | `single_view`\
  \ | 从起始迭代器和哨兵创建视图 |\n| `empty<*type*>` | `empty_view` | 从起始迭代器和哨兵创建视图 |\n| | `basic_istream_view`\
  \ | `basic_istream_view` | 从起始迭代器和哨兵创建视图 |\n| | `basic_string_view` | `basic_string_view`\
  \ | 从起始迭代器和哨兵创建视图 |\n| | `span` | `span` | 从起始迭代器和哨兵创建视图 |\n\n`std::string_view`\
  \ 是 C++20 之前唯一存在的视图。其他随 C++20 引入的视图通常以 `_view` 结尾。\n\n### 用于范围的视图\n\n表格 用于范围的视图\
  \ 列出了 C++20 处理范围和其他视图的标准视图和适配器。它们可以作为视图流水线的构建块。\n\n| **适配器** | **类型** | **效果** |\n\
  | --- | --- | --- |\n| `take(`*num*` | 变化 | 获取范围的前 `num` 个元素 |\n| `take_while(`*pred*`\
  \ | `take_while_view` | 获取所有符合谓条件的头部元素 |\n| `drop(`*num*` | 变化 | 丢弃范围的前 `num` 个元素\
  \ |\n| `drop_while(`*pred*` | `drop_while_view` | 丢弃所有符合谓条件的头部元素 |\n| `filter(`*pred*`\
  \ | `filter_view` | 过滤并使用符合谓条件的元素 |\n| `transform(`*pred*` | `transform_view` |\
  \ 转换的所有元素 |\n| `elements<*idx*>` | `elements_view` | 使用元组类元素的第 `idx` 个成员 |\n| `keys`\
  \ | `elements_view` | 使用元组类元素的第一个成员 |\n| `values` | `elements_view` | 使用元组类元素的第二个成员\
  \ |\n| `reverse` | 变化 | 反转元素顺序 |\n| `join` | `join_view` | 合并多个范围的元素 |\n| `split(`*pred*`\
  \ | `split_view` | 将范围拆分为子范围 |\n| `lazy_split(`*pred*` | `lazy_split_view` | 将输入/`const`\
  \ 范围懒性拆分为子范围 |\n\n\n\n\n\n| `common` | 变化 | 协调迭代器和哨兵的类型 |\n\n通常情况下，*适配器*（adaptors）允许程序员轻松且以最优性能创建视图（views）。为此为此，适配器所创建的视图类型可能取决于其输入参数。\n\
  \n适配器 `all()`、`counted()` 和 `filter()`（注意：原文提了两次 `counted()`，但上下文暗示是不同的适配器；我将保持原文不变）`all()`、`counted()`\
  \ 和 `counted()` 在特殊章节中进行了描述。所有其他适配器都与它们对应的视图类型 一起一起了描述。\n\n所有的视图都提供了移动（以及可选的拷贝）操作以及具有常数时间复杂度的析构函数（这些操作所需的时间不取决于元素的数量)^(12)。`std::ranges::view`\
  \ 概念检查相应的要求。\n\n### 7.2.1 来自 Range 的视图\n\n容器（Containers）和字符串（strings）不是视图，因为它们不够轻量：它们拥有并拷贝了自己的元素。\n\
  \n要将容器和字符串作为视图，你应该使用 `all()` 适配器或已经对 range 执行了某些修改的特定视图。\n\n如代码所示，你有不同的不同的选项：\n\n\
  *   你可以将容器作为参数传递给适配器：\n\n```cpp\nauto first4 = std::views::take(coll, 4);\n```\n\
  \n*   你可以将容器通过管道传递适配器：\n\n```cpp\nauto first4 = coll | std::views::take(4);\n```\n\
  \n*   你可以将容器作为参数传递给视图类型：\n\n```cppstd::ranges::take_view first4{coll, 4};\n```\n\
  \n所有这些视图的创建都有一个重要的限制：它们不支持临时对象和其他作为参数传递的右值 编译：\n\n```cpp\nstd::vector<int> getValues();\
  \  // 前向声明\n\nstd::ranges::take_view take5{getValues(), 5};  // 编译错误\n```\n\n这意味着你无法编译如下代码：\n\
  \n```cpp\n// 处理返回集合的前 5 个元素：\nfor (const auto& elem : std::ranges::take_view(getValues(),\
  \ 5)) {  // 错误\n  ...\n}\n```\n\n或者：\n\n```cpp\n// 处理返回集合的前 5 个元素：\nfor (const auto&\
  \ elem : getValues() | std::views::take(5)) {       // 错误\n  ...\n}\n```\n\n相反，你必须用返回的值来初始化一个引用，根据规则，这会扩展返回值的生命周期，并且是一个左值因为它因为它名字）：\n\
  \n```cpp\n// 处理返回集合的前 5 个元素：\nconst auto& r = getValues();  // 引用扩展了返回值的生命周期\nfor\
  \ (const auto& elem : std::views::take(r, 5)) {                  // OK\n  ...\n\
  }\n```\n\n如果你想保留非 const 特性（这对于遍历某些视图是必要的），你必须使用通用/转发引用：\n\n```cpp\n// 处理返回集合的前 5\
  \ 个元素：\nauto&& r = getValues();       // 引用扩展了返回值的生命周期\nfor (const auto& elem :\
  \ std::views::take(r, 5)) {                  // OK\n  ...\n}\n```\n\n然而，只要基于 range\
  \ 的 `for` 循环存在生命周期问题（即在遍历其引用时内部销毁临时对象，该问题在 [`wg21.link/p2276`](http://wg21.link/p2276)\
  \ 中描述），使得此类代码无法编译是一件好事。\n\n### 7.2.2 临时 Range 的管道\n\n再次注意，视图无法在临时对象上操作（是 range 但不是视图的纯值;\
  \  // 前向声明\n\nauto allBut5 = getValues() | std::views::drop(5);  // 错误\n```\n\n\
  这意味着你无法编译如下代码：^(13)\n\n```cpp\n// 处理返回集合的前 5 个元素：\nfor (const auto& elem : getValues()\
  \ | std::views::take(5)) {  // 错误\n  ...\n}\n```\n\n相反，你必须用返回的值来初始化一个引用，根据规则，这会扩展返回值的生命周期，并且是一个左值因为它有一个名字。你可以：\n\
  \n```cpp\n// 处理返回集合的前 5 个元素：\nconst auto& r = getValues();  // 返回值的生命周期被扩展\nfor\
  \ (const auto& elem : r | std::views::take(5)) {            // OK\n  ...\n}\n```\n\
  \n再次，有两种方法可以：\n\n*   初始化一个 `const` 左值引用：\n\n```cpp\n// 处理返回集合的前 5 个元素：\n  const\
  \ auto& r = getValues();      // 扩展返回值的生命周期\n  for (const auto& elem : r | std::views::take(5))\
  \ {            // 对于多数视图 OK\n    ...\n  }\n```\n\n*   初始化一个通用引用（也称为*转发引用*）：\n\n\
  ```cpp\n// 处理返回集合的前 5 个元素：\nauto&& r = getValues();       // 引用扩展了返回值的生命周期\nfor\
  \ (const auto& elem : std::views::take(r, 5)) {                  // OK\n  ...\n\
  }\n```\n\n### 7.2.3 延迟求值\n\n考虑以下程序：\n\n```cpp\n#include <iostream>\n#include <vector>\n\
  #include <ranges>\nnamespace vws = std::views;\n\nint main()\n{\n  std::vector<int>\
  \ coll{ 8, 15, 7, 0, 9 };\n\n  // 定义一个视图：\n  auto vColl = coll\n               \
  \ | vws::filter([] (int i) {\n                                std::cout << \" filter\
  \ \" << i << '\\n';\n                                return i % 3 == 0;\n      \
  \                        })\n                | vws::transform([] (int i) {\n   \
  \                                std::cout << \"  trans \" << i << '\\n';\n    \
  \                               return -i;\n                                 });\n\
  \n  // 使用它：\n  std::cout << \"*** coll | filter | transform:\\n\";\n  for (int i\
  \ : vColl) {\n    std::cout << \"   => \" << i << '\\n';\n  }\n}\n```\n\nfilttrans.cpp:\n\
  \n程序具有如下输出：\n\n```\n*** coll | filter | transform:\n filter 8\n filter 15\n  trans\
  \ 15\n   => -15\n filter 7\n filter 0\n  trans 0\n   => 0\n filter 9\n  trans 9\n\
  \   => -9\n```\n\n我们对每个元素调用 `filter()`，对于未被过滤掉的元素调用 `transform()`。这可能是大家预期的。\n\n\
  然而，有一点非常显著：处理**并不是**在我们定义视图时发生的。而是在我们使用视图的打印语句之后发生的。这意味着使用了*延迟求值*（lazy evaluation）。视图只是处理过程的描述。当我们请求下一个值时，处理才是逐个执行的。\n\
  \n这有一个巨大的优势：我们不会对永远不需要的元素开始处理。例如，假设我们使用视图来找到第一个结果为 `0` 的值：\n\n```cpp\nstd::ranges::find(vColl,\
  \ 0);\n```\n\n输出将只有：\n\n```\n filter 8\n filter 15\n  trans 15\n filter 7\n filter\
  \ 0\n  trans 0\n```\n\n视图的管道使用*拉取模型*（pull model）。每当消费者请求视图的下一个值时，它都会通过所有相关的适配器进行处理。这就是为什么管道也可以适用于产生无限数量元素的初始\
  \ range 和视图的原因之一：我们不会在不知道使用了多少值的情况下计算无限的值；我们根据请求计算多少个值。\n\n\n\n\n用于管道（pipelines）的拉取模型也有其缺点。为了证明这一点，让我们改变涉及的两个适配器的顺顺：\n\
  \n```cpp\n#include <iostream>\n#include <vector>\n#include <ranges>\nnamespace vws\
  \ = std::views;\n\nint main()\n{\n  std::vector<int> coll{ 8, 15, 7, 0, 9 };\n\n\
  \  // 定义一个 view：\n  auto vColl = coll\n                | vws::transform([] (int\
  \ i) {\n                                   std::cout << \" trans: \" << i << '\\\
  n';\n                                   return -i;\n                           \
  \      })\n                | vws::filter([] (int i) {\n                        \
  \        std::cout << \"  filt: \" << i << '\\n';\n                            \
  \    return i % 3 == 0;\n                              });\n\n  // 使用它：\n  std::cout\
  \ << \"*** coll | transform | filter:\\n\";\n  for (int i : vColl) {\n    std::cout\
  \ << \"   => \" << i << '\\n';\n  }\n}\n```\n\n`lib/transfilt.cpp`:\n\n现在，程序的的输出如下：\n\
  \n```\n*** coll | transform | filter:\n trans: 8\n  filt: -8\n trans: 15\n  filt:\
  \ -15\n trans: 15\n   => -15\n trans: 7\n  filt: -7\n trans: 0\n  filt: 0\n trans:\
  \ 0\n   => 0\n trans: 9\n  filt: -9\n trans: 9\n   => -9\n```\n\n我们显然增加了适配器的调用。首先，我们对每个元素都调用了\
  \ `transform()`；而不只是那些未被过滤掉的元素。这是合理的，我们在值被转换*之后*决定过滤哪个元素。所以现在我们必须对每个元素调用 `transform()`。\n\
  \n然而，还有一个额外的问题：对于某些元素，我们调用了两次转换。实际上，对于那些没有被过滤掉的元素是如此。\n\n原因在于使用拉取模型的管道本质，其 view\
  \ 对象只能产生迭代器。当我们向 view `vColl` 请求下一个元素时：\n\n1. `vColl` 向 `filter()` 请求下一个元素。\n2.\
  \ `filter()` 向 `transform()` 请求下一个元素。\n3. `transform()` 向 `coll` 请求下一个元素。\n4. `transform()`\
  \ 处理参数并将其传递给 `filter()` 处理，而 `filter()` 只能返回该元素是否为可以使用元素。\n5. `vColl` 然后作为迭代器产生下一个元素。所以，当我们再次处理\
  \ `vColl` 的下一个元素时，我们需要该值，并且必须应用转换来获取它。\n\n这意味着，对于每个过滤器，我们都必须执行一次所有之前的转换来*检查*值。如果为\
  \ `true`，我们必须再次执行一次之前的转换以*使用*该值。实际上，每个过滤器都会在为 `true` 时增加一次对所有之前转换的调用（并在 `false`\
  \ 时跳过所有后续转换）。\n\n给定以下转换管道 `t2`、`t2`、`t3` 和过滤器 `f1`、`f2`：\n\n```\nt1 | t2 | f1 |\
  \ t3 | f2\n```\n\n我们有如下行为：\n\n* 对于 `f1` 产生 `false` 的元素，我们调用：`t1 t2 f1`\n* 对于 `f1`\
  \ 产生 `true` 但 `f2` 产生 `false` 的元素，我们调用：`t1 t2 f1 t1 t2 t3 f2`\n* 对于 `f1` 和 `f2`\
  \ 都产生 `true` 的元素，我们调用：`t1 t2 f1 t1 t2 t3 f2 t1 t2 t3`\n\n完整示例请参见 `lib/viewscalls.cpp`。\n\
  \n多次调用只对 `filter` view（类型为 `std::ranges::filter_view` 和适配器 `std::views::filter`）是一个问题。所有其他过滤器（如\
  \ `take` 和 `drop`）在找到第一个不应该被处理的元素时就会停止整个处理，这样它们就不需要再次处理它。\n\n所以，对于 `filter` views，请考虑以下几点：\n\
  \n* 尽量将其放在管道的开头。\n* 注意在过滤器之前使用开销较大的转换。\n\n关于过滤器的更多细节，请参见 filter view 章节。\n\n###\
  \ 7.2.5 具有写权限的 Views 和管道\n\nViews 必须是只读的、无状态的 且保持相等性的。它们永远不修改传递的参数，或对其调用非 `const`\
  \ 操作。这样，view（及其所有拷贝）对于相同的输入始终始终执行相同的操作。\n\n对于传递给 views（如 `filter_view` 或 `transform_view`）的谓词，这意味着它们应该按值传递或按\
  \ `const` 引用传递。如果你修改作为非 `const` 引用传递的参数，将导致未定义行为：\n\n```cpp\nvws::transform([] (auto&\
  \ i) {  // 最好声明为 const&\n                 ++i;          // 错误：未定义行为\n          \
  \     })\n```\n\n注意编译器可能不会检查这一点（因为它们并不总是能做到）。因此，由你来确保正确。\n\n然而，支持可以使用 views 来限制你想要修改的元素集合。例如：\n\
  \n```cpp\n// 为 coll 中除前 5 个元素以外的所有元素赋值 0：\nfor (auto& elem : coll | vws::drop(5))\
  \ {\n  elem = 0;\n}\n```\n\n### 7.2.6 Filter Views 的写访问\n\n在使用 filter views 时，对写访问有一个重要的限制：你必须确保修改后的值仍然满足谓词。这意味着以下代码是良好的：\n\
  \n```cpp\n// 为 coll 中除前 5 个元素以外的所有元素赋值 0：\nfor (auto& elem : coll | vws::drop(5))\
  \ {\n  elem = 0;\n}\n```\n\n然而，以下代码会导致未定义行为：\n\n```cpp\n// 修改所有元素：\nfor (auto& elem\
  \ : coll | vws::filter([](int i){return i % 2 == 0; })) {\n  elem += 1; // 错误：谓词被破坏\n\
  }\n```\n\n为了理解为什么是这样，考虑以下程序：\n\n```cpp\n#include <iostream>\n#include <vector>\n\
  #include <ranges>\nnamespace vws = std::views;\n\nvoid print(const auto& coll)\n\
  {\n  std::cout << \"coll: \";\n  for (int i : coll) {\n    std::cout << i << ' ';\n\
  \  }\n  std::cout << '\\n';\n}\n\nint main()\n{\n  std::vector<int> coll{1, 4, 7,\
  \ 10, 13, 16, 19, 22, 25};\n\n  auto isEven = [](auto&& i) { return i % 2 == 0;\
  \ };\n  auto evens = coll | vws::filter(isEven);\n\n  print(coll);\n\n  // 修改偶数：\n\
  \  for (auto& i : evens) {\n    std::cout << \"increment \" << i << '\\n';\n   \
  \ i += 2; // 正确：值仍然是偶数\n  }\n  print(coll);\n\n  // 修改偶数：\n  for (auto& i : evens)\
  \ {\n    std::cout << \"increment \" << i << '\\n';\n    i += 1; // 错误：未定义行为：谓词被破坏\n\
  \  }\n  print(coll);\n}\n```\n\n`lib/viewwrite.cpp`:\n\n程序的输出如下：\n\n```\ncoll: 1\
  \ 4 7 10 13 16 19 22 25 \nincrement 4\nincrement 10\nincrement 16\nincrement 22\n\
  coll: 1 6 7 12 13 18 19 24 25 \nincrement 5\ncoll: 1 5 7 11 13 17 19 23 25\n```\n\
  \n这里到底发生了什么？第一次，我们使用一个确保只处理偶元素的 view，它运行良好。然而，view 缓存了匹配谓词的第一个元素的位置，以便 `begin()`\
  \ 无需重新计算。所以，当我们再次访问那里的值时，filter 不会再次应用谓词，因为它已经知道该元素就是第一个元素。因此，当我们第二次迭代时，filter 返回了原来的第一个元素。\n\
  \n此前曾讨论过，单次的（single-pass）写访问即使破坏了过滤器的谓词是否也应该是良好的。因为要求修改不应违反过滤器的谓词，使得一些非常合理的例子变得无效：这里其中一个：(15)\n\
  \n```cpp\nfor (auto& m : collOfMonsters | filter(isDead)) {\n  m.resurrect();  \
  \  // 当然，这是萨满的行为\n}\n```\n\n这段代码通常可以编译并运行。然而，从形式上说我们再次有了未定义行为，因为过滤器的谓词（怪物必须是死的”）被破坏了。要破坏谓词，你必须使用普通的循环：\n\
  \n\n\n\n\n```\nfor (auto& m : collOfMonsters) {\n  if (m.isDead()) {\n    m.resurrect();\
  \  // 当然，这是萨满所做的\n  }\n}\n```\n\n## 7.3 借用迭代器与范围\n\n当将范围（range）作为单个参数传递给算法时，会遇到生命周期问题。本节描述了\
  \ ranges 库是如何处理此问题的。\n\n#### 7.3.1 借用迭代器 (Borrowed Iterators)\n\n许多算法会返回其所操作范围的迭代器。然而，当将范围作为单个参数传递时，可能会产生一个在范围需要两个参数（begin\
  \ 和 end）时不会出现的新问题：如果你传递了一个临时范围（例如由函数返回的范围）并返回了它的迭代器，那么返回的迭代器在语句结束、范围被销毁时可能会失效。使用返回的迭代器（或其副本）将导致未定义行为。\n\
  \n例如，考虑将一个临时范围传递给 `find()` 算法以在范围内搜索某个值：\n\n```cpp\nstd::vector<int> getData();\
  \   // 前向声明\n\nauto pos = find(getData(), 42);               // 返回指向临时 vector 的迭代器\n\
  // getData() 返回的临时 vector 在此处销毁\nstd::cout << *pos;                            //\
  \ 错误：使用了悬空迭代器\n```\n\n`getData()` 的返回值随着其所在语句的结束而被销毁。因此，`pos` 指向一个已不存在的集合中的元素。使用\
  \ `pos` 会导致未定义行为（最好的情况下，你会得到一个核心转储，从而发现问题）。\n\n为了解决这个问题，ranges 库引入了“借用迭代器”（borrowed\
  \ iterators）的概念。借用迭代器的生命周期不依赖于创建它的范围对象的生命周期。这种之所以是因为创建迭代器的范围没有被该迭代器使用，而是范围引用的是另一个仍然存活的对象（另一种情况是迭代器根本没有引用任何范围）。如果你有一个指向某个范围的借用迭代器，那么该迭代器是安全的，即使范围被销毁它也不会悬空。\n\
  \n通过使用类型 `std::ranges::borrowed_iterator_t<>`，算法可以将其返回的迭代器声明为借用的。这意味着算法总是返回一个可以安全的迭代器。如果它可能会悬空，则会使用特殊类型来指示此情况，并将可能的运行时错误转换为编译时错误。\n\
  \n例如，针对单个范围的 `std::ranges::find()` 声明如下：\n\n```cpp\ntemplate<std::ranges::input_range\
  \ Rg,\n         typename T,\n         typename Proj = identity>\n...\nconstexpr\
  \ std::ranges::borrowed_iterator_t<Rg>\n  find(Rg&& r, const T& value, Proj proj\
  \ = {});\n```\n\n通过将返回类型指定为 `Rg` 的 `std::ranges::borrowed_iterator_t<>`，标准启用了编译时检查：如果传递给算法的范围\
  \ `R` 是临时对象（prvalue），则返回类型将变为悬空迭代器。在这种情况下，返回值是一个类型为 `std::ranges::dangling` 的对象。对此类对象的任何使用（拷贝和赋值除外）都会导致编译时错误。\n\
  \n因此，以下代码会导致编译错误：\n\n```cpp\nstd::vector<int> getData();   // 前向声明\n\nauto pos =\
  \ std::ranges::find(getData(), 42);  // 返回指向临时 vector 的迭代器\n// getData() 返回的临时 vector\
  \ 已销毁\nstd::cout << *pos;                            // 编译错误\n```\n\n为了能够对临时对象调用\
  \ `find()`，你必须作为左值（lvalue）传递它。也就是说，它必须有一个名称。这样，算法就能确保在调用后集合仍然存在。而且这样你也可以检查是否找到了某个值（这通常也是必要的）。\n\
  \n为返回集合提供一个名称的最佳方法是使用引用。这样它们就不会被拷贝。\n\n\n\n\n\n* `std::ranges::subrange`(#chap08.xhtml_subrange)\n\
  * `std::ranges::ref_view`(#chap08.xhtml_refview)\n* `std::span`(#chap09.xhtml_span-range)\n\
  * `std::string_view`(#chap08.xhtml_stringview)\n\n请注意，当借用迭代器（borrowed iterators）引用底层范围（上述最后一类）且该底层范围不再存在时，它们仍然可能会悬空（dangle）。\n\
  \n因此，我们可以在编译时捕获`某些`而非所有可能的运行时错误，我可以通过在各种范围中尝试寻找值为 `8` 的元素的多种方式来演示这一点（是的，通常我们应该检查是否返回了结束迭代器）：\n\
  \n* 所有左值（带名称的对象）都是借用范围，只要迭代器存在于范围的相同作用域或子作用域内，返回的迭代器就不会是 `dangling`。\n\n```\nstd::vector\
  \ coll{0, 8, 15};\n\nauto pos0 = std::ranges::find(coll, 8);                   //\
  \ 借用范围\nstd::cout << *pos0;                          // OK (如果未找到 8 则运行时错误)\n\n\
  auto pos1 = std::ranges::find(std::vector{8}, 8);         // 产生悬空\nstd::cout <<\
  \ *pos1;                          // 编译错误\n```\n\n* 对于临时视图，情况取决于具体。例如：\n\n```\n\
  auto pos2 = std::ranges::find(std::views::single(8), 8);  // 产生悬空\nstd::cout <<\
  \ *pos2;                          // 编译错误\n\nauto pos3 = std::ranges::find(std::views::iota(8),\
  \ 8);    // 借用范围\nstd::cout << *pos3;                          // OK (如果未找到 8 则运行时错误)\n\
  \nauto pos4 = std::ranges::find(std::views::empty<int>, 8); // 借用范围\nstd::cout <<\
  \ *pos4;                          // 运行时错误，因为未找到 8\n```\n\n例如，单值视图`](#chap08.xhtml_takeview)\
  \ 也会检查 prvalues：\n\n```\nauto pos5 = std::ranges::find(std::views::take(std::vector{0,\
  \ 8, 15}, 2), 8);\n                                             // 编译错误\n```\n\n\
  在这里，调用 `take()` 已经是一个编译时错误了。\n\n然而，如果你使用 `counted()`，它只接受一个迭代器，那么确保迭代器有效就是程序员的任务：\n\
  \n```\nauto pos6 = std::ranges::find(std::views::counted(std::vector{0, 8, 15}.begin(),\n\
  \                                                    2), 8);\nstd::cout << *pos6;\
  \                          // 即使找到了 8 也是运行时错误\n```\n\n这里使用 `counted()` 创建的视图定义上是借用范围，因为它们将内部引用传递给迭代器。换句话说：一个计数视图的迭代器不需要它所属的视图。然而，仍然可能迭代器引用了一个不再存在的范围（因为它的视图引用了一个不再存在的对象）。带有\
  \ `pos6` 的示例的最后一行演示了这种情况。即使 `find()` 查找的值可以在临时范围中找到，我们仍然会得到致命的运行时错误。\n\n你可以使用概念\
  \ `std::ranges::borrowed_range` 来检查一个范围是否为借用范围。如果你实现了一个容器或视图，可以通过特化变量模板 `std::ranges::enable_borrowed_range<>`\
  \ 来指示它是一个借用范围。\n\n## 7.4 Ranges 与 `const`\n\n在使用视图（泛指 ranges 库）时，关于 const 属性（constness）有一些令人惊讶甚至是损坏的问题：\n\
  \n* 视图移除了 const 属性向元素的传播。\n* 像如 `cbegin()` 和 `cend()` 这样旨在确保在迭代时元素为 `const` 的函数，要么未提供，要么是损坏的。\n\
  * 当视图为 `const` 时，可能无法对其进行迭代。\n\n这些缺点与视图的本质以及所做的某些设计决策有关。\n\n目前正在进行修复，至少可以修复 `cbegin()`\
  \ 和 `cend()` 损坏的 const 属性。遗憾的是，C++ 标准委员会决定不将它们应用于 C++20。希望这些修复可能会在 C++23 中出现（并改变行为）。\n\
  \n#### 7.4.1 视图移除了 `const` 的传播\n\n容器具有*深层 const*（deep constness）。因为它们具有值语义并拥有其元素，所以它们会将任何\
  \ const 属性传播到元素上。当容器是 `const` 时，它的元素也是 `const`。结果，以下代码会失败：\n\n```\ntemplate<typename\
  \ T>\nvoid constfunc(const T& range)\n{\n  range.front() += 1;                 \
  \  // 错误\n}\n\nstd::array<int, 10> coll{};             // 10 个整数\nconstfunc(coll);\
  \                        // 应该报错\n```\n\n这种编译时错误是有用的，因为它可以帮助检测原本在运行时会损坏的代码。例如，如果你不小心执行了赋值，代码将无法编译：\n\
  \n```\ntemplate<typename T>\nvoid constfunc(const T& range)\n{\n  if (range[0] =\
  \ 0) {                   // 错误\n    ...\n  }\n}\n\nstd::array<int, 10> coll{}; \
  \            \n...\n```\n\n知道元素不能被修改有助于优化（例如避免制作备份），或者确保在多线程使用时不会发生竞争。\n\n视图具有引用语义。它们只引用存储在别处的元素而不拥有任何元素或值。因此，视图*不会*将\
  \ const 属性传播到它们的元素。它们具有*浅层 const*（shallow constness）：\n\n```\nstd::array<int, 10>\
  \ coll{};              // 10 个整数\n...\nstd::ranges::take_view tv{coll, 5};     \
  \ // 前 5 个元素\nconstfunc(tv);                           // OK，修改第一个元素\n```\n\n这适用于几乎所有创建方式的视图：\n\
  \n```\nconstfunc(coll | std::views::take(5));   // OK，修改第一个元素\nconstfunc(std::ranges::subrange(coll));\
  \  // OK，修改第一个元素\nconstfunc(std::views::all(coll));        // OK，修改第一个元素\nconstfunc(std::span(coll));\
  \              // OK，修改第一个元素\n```\n\n请注意，如果视图应用于 `const` 容器，则这不是一个问题：\n\n```\nconst\
  \ std::array<int, 10> coll{};        // 10 个整数\n...\nstd::ranges::take_view tv{coll,\
  \ 5};      // 前 5 个元素\nconstfunc(tv);                           // 编译错误\n```\n\n\
  因此，你可以通过在首次使用视图之前将范围标记为 `const` 来避免这个问题：\n\n```\nstd::array<int, 10> coll{};   \
  \           // 10 个整数\n...\nstd::ranges::take_view tv{std::as_const(coll), 5}; \
  \       // const coll 的前 5 个元素\nconstfunc(tv);                             // 编译错误\n\
  constfunc(std::as_const(coll) | std::views::take(5));     // 编译错误\n```\n\n函数 `std::as_const()`\
  \ 自 C++17 起提供，位于 `<utility>` 头文件中。在视图创建*后*调用 `std::as_const()` 没有影响（只是对于某些视图，你将无法再次迭代元素）。\n\
  \n\n\n\n\n曾出现过完全禁用 `const` 视图的迭代的想法。也许这才是正确的解决方案（特别是对于某些视图，当它们是 `const` 时，迭代是禁用的）。^(17)\n\
  \n### 7.4.2 为视图找回深度常量性（Deep Constness）\n\n由于我们现在处于泛型范围代码中的 `const` 可能无法传播到元素的情况下，问题在于如何确保代码不会修改范围内的元素。\n\
  \n唯一简单的方法是在访问元素时要求常量性：\n\n*   或者在基于范围的 `for` 循环中使用 `const`：\n\n```cpp\nfor (const\
  \ auto& elem : range) {\n  ...\n}\n```\n\n*   或者通过传递转换为 `const` 的元素来实现：\n\n```cpp\n\
  for (auto pos = range.begin(); pos != range.end(); ++pos) {\n  elemfunc(std::as_const(*pos));\n\
  }\n```\n\n为了将整个范围转换为具有 `const` 元素的范围，我们通常提供 `const_iterator` 和 `cbegin()`/`cend()`。\n\
  \n```cpp\nfor (decltype(range)::const_iterator pos = range.begin(); pos != range.end();\
  \ ++pos) {\n  elemfunc(std::as_const(*pos));\n}\n\ncallTraditionalAlgo(range.cbegin(),\
  \ range.cend());\n```\n\n事实上，我们可以非常简单地转换整个范围：\n\n```cpp\nstd::ranges::subrange<decltype(range)::const_iterator>\
  \ crange{range};\n```\n\n然而，视图通常不提供 `const_iterator` 和 `cbegin()`/`cend()` 成员。是的，它们没有提供，尽管在这里我们非常需要它们。\n\
  \n你们中的某些人可能知道 C++ 标准库中有独立的辅助函数：`std::cbegin()` 和 `std::cend()`。更糟糕，这些函数在视图上失效了。它们唯一的目的是当你遍历元素时元素是\
  \ `const` 的。然而，它们的定义并没有为了处理具有浅常量性的容器（它们内部调用 `const` 成员函数 `begin()` 并且不对值类型添加常量性）。对于视图，这些函数直接是失效的（它们以前就失效了，但对标准类型没有影响，因为它们都具有深度常量性，而且没有人抱怨）：\n\
  \n```cpp\nfor (auto pos = std::cbegin(range); pos != std::cend(range); ++pos) {\n\
  \  ...\n}\n```\n\n这些辅助函数无论如何在所有情况下都无法工作得良好（例如，ADL 可能失效）。更糟糕的是，范围库对应的新的辅助函数](#chap07.xhtml_ranges-functions）也一样：\n\
  \n```cpp\nfor (auto pos = std::ranges::cbegin(range); pos != std::ranges::cend(range);\
  \ ++pos) {\n  ...\n}\n```\n\n因此：\n\n在泛型代码中，\n\n因为这些函数目前是**失效的**。\n\n我不知道是因为我们遇到了这个问题，还是\
  \ C++ 标准委员会及其范围子小组不愿意在 C++20 中修复这个问题。我们本可以通过 `std::ranges::view_interface<` 为视图提供\
  \ `const_iterator` 支持，它是所有视图的基类。有趣的是，到目前只有一个视图提供了 `const_iterator` 支持：`std::string_view`。遗憾的是，这几乎是我们唯一不需要它的视图，因为字符串视图中的字符始终是\
  \ `const` 的。\n\n然而，还有希望：[`wg21.link/p2278`](http://wg21.link/p2278) 为 C++23 修复这种失效的常量性提供了方法（希望\
  \ `std::cbegin()` 和 `std::cend()` 也是如此）。\n\n### 7.4.3 泛型代码应接受非 `const` 范围\n\n如果你实现了一个可以接受容器和视图的范围泛型代码，有一个需要注意：视图在遍历元素时可能会更改状态。由于这个原因，它们不能作为\
  \ `const` 成员函数提供 `begin()` 和 `end()`。\n\n事实上，如果以下标准视图被声明为 `const`，你无法对元素进行迭代：^(18)\n\
  \n*   `std::ranges::filter_view`\n*   `std::ranges::drop_while_view`\n*   `std::ranges::split_view`\n\
  *   `std::ranges::drop_view`，如果它指向的范围没有随机访问或没有 `size()` 成员\n*   `std::ranges::reverse_view`，如果它指向的范围具有不同的类型\n\
  \n\n\n\n\n这些适配器中的几个适用于特定的视图类型。然而，某些适配器可能会根据传递的范围（ranges）的特征创建不同的结果。例如，如果传入的范围已经具有结果所需的特征，则适配器可能会直接产生传入的范围。\n\
  \n有几个主要的适配器，可以轻松地创建视图，或将范围转换为具有特定特征（与内容无关）的视图。这些适配器是：\n\n* `std::views::all()`，它是为传入的范围产生视图的主要适配器\n\
  * `std::views::counted()`，它是将起始迭代器和计数转换为视图的主要适配器\n* `std::views::common()`，它产生一个起始迭代器和哨兵（结束迭代器）类型统一的视图，以便能够将范围/视图传递给传统的范围参数。\n\
  \n这些适配器将在在本节中进行描述。\n\n所有这些主要的适配器总是产生一个借用范围（borrowed range）。也就是说，来自这些适配器的迭代器生命周期仅取决于传递给它们的参数的生命周期。换句话说：使用这些适配器不会引入额外的生命周期问题。\n\
  \n### 8.1.1 范围适配器 `all()`\n\n范围适配器 `std::views::all()` 是将任何尚未视图的范围转换为视图的适配器。通过这种方式，你保证了有一个廉价的句柄来处理范围中的元素。\n\
  \n`all(rg)` 产生\n\n* 如果 `rg` 已经是视图，则产生 `rg` 的拷贝\n* 否则，如果 `rg` 是一个范围对象，则产生 `rg` 的一个\
  \ `std::ranges::ref_view`\n\n例如：\n\n```\nstd::vector<int> vec;\nstd::ranges::iota_view\
  \ iv{1, 10};\n...\nauto v1 = std::views::all(vec);  // std::ranges::ref_view<decltype(vec)>\n\
  auto v2 = std::views::all(iv);   // decltype(iv)\nauto v3 = std::views::all(std::views::all(vec));\n\
  \                                 // std::ranges::ref_view<decltype(vec)>\n```\n\
  \n传递给 `all()` 的参数必须是已经是视图，或者是作为左值;               // OK\nstd::views::all(getVector());\
  \       // 错误\nstd::views::all(std::move(vec));    // 错误\nstd::views::all(aView);\
  \             // OK\nstd::views::all(getIotaView());     // OK\n```\n\nC++20 还定义了类型\
  \ `std::views::all_t<>` 为 `all()` 产生的类型。该类型反映了 `all()` 仅对视图或左值范围有效。它不适用于尚未是视图的右值范围：\n\
  \n```cpp\nstd::views::all_t<std::vector<int>>;              // 错误\nstd::views::all_t<std::vector<int>&>;\
  \             // OK: ref_view<vector<int>>>\nstd::views::all_t<std::vector<int>&&>;\
  \            // 错误\nstd::views::all_t<std::ranges::iota_view<int>>;   // OK: iota_view<int>>\n\
  ```\n\n因此，如果你在泛型代码中需要一个表达式或名称 `arg` 的 `all()` 产生类型，而不是写：\n\n```cpp\ndecltype(std::views::all(arg))\n\
  ```\n\n你可以写成：\n\n```cpp\nstd::views::all_t<decltype(arg)&>;\n```\n\n这里的 `&` 是非常重要的（除非你已经知道\
  \ `arg` 是一个视图）。如果你向 `decltype` 传递一个不是视图的范围对象的名称，你也可以通过额外的括号将其转换为表达式。然而，仅使用名称将无法编译：\n\
  \n```cpp\nstd::views::all_t<decltype((name))>;  // OK\nstd::views::all_t<decltype(name)>;\
  \    // 如果 name 是对象的名称则会错误\n```\n\n这是使用 `all_t<>` 声明视图 时需要考虑的。概念 `viewable_range`可以用来检查一个类型是否可以用于\
  \ `all_t<>`（以及传递给 `all()` 的对象）：\n\n```cpp\nstd::ranges::viewable_range<vector<int>>\
  \             // false\nstd::ranges::viewable_range<vector<int>&            // true\n\
  std::ranges::viewable_range<vector<int>&&           // false\nstd::ranges::viewable_range<std::ranges::iota_view<int>>\
  \  // true\n```\n\n### 8.1.2 范围适配器 `counted()`\n\n范围适配器 `std::views::counted()`\
  \ 提供了一种从起始迭代器和计数创建视图的最灵活的方法。根据你传递的内容，它会创建一个指向前 `n` 个元素的廉价视图。程序员负责确保计数是有效的（传递过大的计数会导致未定义行为）。计数可以为\
  \ `0`，这意味着范围是空的。\n\n`counted(beg, sz)` 根据传入范围的特征产生不同的类型：\n\n* 如果起始迭代器是连续的（contiguous），则产生一个\
  \ `span`；这适用于 `std::vector`、`std::array`。\n* 否则，如果起始迭代器是随机访问的（random_access），则产生一个\
  \ `std::ranges::subrange`；这适用于 `std::deque`。\n* 否则，它产生一个带有 `std::default_sentinel_t`\
  \ 哨兵的 `std::ranges::subrange`；这适用于 `list`、关联容器和无序容器。\n\n例如：\n\n```cpp\nstd::vector<int>\
  \ vecs{1, 2, 3, 4, 5, 6, 7, 8, 9};\nauto vec5 = std::ranges::find(vec, 5);\nauto\
  \ v1 = std::views::counted(vec5, 3);  // 指向元素 5 的 3 个元素\n  // v1 是 span<int>\n\n\
  std::deque<int> deq{1, 2, 3, 4, 5, 6, 7, 8, 9};\nauto deq5 = std::ranges::find(deq,\
  \ 5);\nauto v2 = std::views::counted(deq5, 3);  // 指向元素 5 的 3 个元素\n  // v2 是 std::ranges::subrange<std::deque<int>::iterator>\n\
  \nstd::list<int> lst{1, 2, 3, 4, 5, 6, 7, 8, 9};\nauto lst5 = std::ranges::find(lst,\
  \ 5);\nauto v3 = std::views::counted(lst5, 3);  // 指向元素 5 的 3 个元素\n  // v3 是 std::ranges::subrange<std::counted_iterator<std::list<int>::iterator>,\n\
  \                                // std::default_sentinel_t>\n```\n\n注意，这段代码存在风险，因为如果后面没有足够的元素，会导致未定义行为。因此，如果你不确定这种情况，应该检查这一点。\n\
  \n此外，如果你想获取范围的前 3 个元素，使用 take 视图获取结果更安全的方法：\n\n```cpp\nstd::vector<int> vec{1, 2,\
  \ 3, 4, 5, 6, 7, 8, 9};\nauto v1 = std::views::take(vec, 3);  // 指向 vec 前 3 个元素的视图\n\
  ```\n\ntake 视图会检查元素是否足够，如果不够则产生较少的元素。\n\n### 8.1.3 范围适配器 `common()`\n\n范围适配器 `std::views::common()`\
  \ 为传入的范围产生一个起始迭代器和哨兵（结束迭代器）类型统一的视图。它的作用类似于 `std::views::all()`，但额外的行为是：当迭代器类型不同时，从传入的参数创建一个\
  \ `std::ranges::common_view`](chap08.xhtml_commonview)。\n\n例如，假设我们想要调用一个要求起始和结束迭代器类型相同的传统算法\
  \ `algo()`。那么我们可以这样对可能不同类型的迭代器进行调用：\n\n\n\n\n\n```cpp\ntemplate<typename TBeg, typename\
  \ TEnd>\nvoid callAlgo(TBeg beg, TEnd end)\n{\n  auto v = std::views::common(std::ranges::subrange(beg,end));\n\
  \  algo(v.begin(), v.end());  // assume algo() requires iterators with the same\
  \ type\n}\n```\n\n`common(rg)` 产生：\n\n*   如果 `rg` 已经是具有相同起始和结束迭代器类型的 view，则返回 `rg`\
  \ 的拷贝\n*   否则，如果 `rg` 是具有相同起始和结束迭代器类型的范围对象，则返回 `rg` 的 `std::ranges::ref_view`\n\
  *   否则，返回 `rg` 的 `std::ranges::common_view`\n\n例如：\n\n```cpp\nstd::list<int> lst;\n\
  std::ranges::iota_view iv{1, 10};\n...\nauto v1 = std::views::common(lst);   //\
  \ std::ranges::ref_view<decltype(lst)>\nauto v2 = std::views::common(iv);    //\
  \ decltype(iv)\nauto v3 = std::views::common(std::views::all(vec));\n          \
  \                           // std::ranges::ref_view<decltype(lst)>\n\nstd::list<int>\
  \ lst {1, 2, 3, 4, 5, 6, 7, 8, 9};\nauto vt = std::views::take(lst, 5);  // begin()\
  \ 和 end() 有不同的类型\nauto v4 = std::views::common(vt);    // std::ranges::common_view<decltype(vt)>\n\
  ```\n\n请注意，`std::ranges::common_view` 和辅助类型 `std::common:iterator` 的两个构造函数都要求传入的迭代器具有不同的类型。因此，如果你不知道迭代器类型是否不同，应该使用此适配器。\n\
  \n## 8.2 新迭代器\n\n为了（更好地）支持范围和视图，C++20 引入了几种新的迭代器类型：\n\n*   `std::counted_iterator`：用于自身带有一个\
  \ `count` 以指定范围终点的迭代器\n*   `std::common_iterator`：用于一种可以用于两个不同类型迭代器的通用迭代器类型\n* \
  \  `std::default_sentinel_t`：用于一种强制迭代器检查其终点的结束迭代器\n*   `std::unreachable_sentinel_t`：用于一种永远无法到达的结束迭代器，使得范围是无尽的\n\
  \n### 8.2.1 `std::counted_iterator`\n\n*计数迭代器*（counted iterator）是一种具有一个最大迭代元素数的计数器的迭代器。使用这种迭代器有两种方法：\n\
  \n*   在迭代的同时检查剩余多少元素：\n    ```cpp\n    for (std::counted_iterator pos{coll.begin(),\
  \ 5}; pos.count() > 0; ++pos) {\n      std::cout << *pos << '\\n';\n    }\n    std::cout\
  \ << '\\n';\n    ```\n*   在与默认哨兵比较的同时迭代：\n    ```cpp\n    for (std::counted_iterator\
  \ pos{coll.begin(), 5};\n         pos != std::default_sentinel; ++pos) {\n     \
  \ std::cout << *pos << '\\n';\n    }\n    ```\n    此特征用于当视图适配器 `std::ranges::counted()`\
  \ 列出了计数迭代器的 API。\n\n类 `std::counted_iterator<>` 的操作\n\n| 操作 | 效果 |\n| --- | ---\
  \ |\n| `countedItor pos{}` | 创建一个不引用任何元素的计数迭代器（`count` 为 `0`） |\n| `countedItor\
  \ pos{pos2, num` | 创建一个从 `pos2` 开始的、包含 `num` 个元素的计数迭代器 |\n| `countedItor pos{pos2}`\
  \ | 创建一个作为计数迭代器 `pos2` 的（类型转换后的）拷贝的计数迭代器 |\n| `pos.count()` | 返回剩余元素数量（`0` 表示我们已到达末尾）\
  \ |\n| `pos.base()` | 返回底层迭代器的拷贝） |\n| … | 底层迭代器类型的所有标准迭代器操作 |\n| `pos == std::default_sentinel`\
  \ | 返回迭代器是否在末尾 |\n| `pos != std::default_sentinel` | 返回迭代器是否不在末尾 |\n\n由程序员负责确保：\n\
  *   `count` 不大于迭代器范围的大小\n*   计数迭代器的递增次数不超过 `count` 次\n*   初始 `count` 是合法的\n\n###\
  \ 8.2.2 `std::common_iterator`\n\n`std::common_iterator` 用于协调两个迭代器的类型。它封装了迭代器使它们具有相同的类型。例如，如果一个算法需要两个相同类型的迭代器，但你有一个迭代器和一个哨兵，你可以使用\
  \ `std::common_iterator` 使它们兼容。（此处由于原文中重复的段落，已根据要求未重复输出，但翻译逻辑一致）\n\n请注意，`std::ranges::common_view`\
  \ 和辅助类型 `std::common:iterator` 的两个构造函数都要求传入的迭代器具有不同的类型。因此，如果你不知道迭代器类型是否不同，应该使用此适配器。\n\
  \n\n\n\n* `Istream` 视图产生 `std::default_sentinel` 作为 `end()`\n* `Istream` 视图迭代器可以使用运算符\
  \ `==` 和 `!=` 进行比较\n* 对于 `std::ranges::take_view<>`:\n    * Take 视图可能会产生 `std::default_sentinel`\
  \ 作为 `end()`\n* 对于 `std::ranges::split_view<>`:\n    * Split 视图可能会产生 `std::default_sentinel`\
  \ 作为 `end()`\n    * Split 视图迭代器可以使用运算符 `==` 和 `!=` 进行比较\n\n### 8.2.4 `std::unreachable_sentinel`\n\
  \n类型为 `std::unreachable_sentinel_t` 的值 `std::unreachable_sentinel` 在 C++20 中引入，用于指定一个不可达的哨兵（范围的结束迭代器）。它实际上表示“完全不要与我进行比较”。其效果是它可以用于指定无限范围。\n\
  \n在使用它时，它可以优化生成的代码，因为编译器可以检测到与另一个迭代器的比较永远不会产生 `true`，因此它可能会跳过对结束的检查。\n\n例如，如果我们知道集合中存在值\
  \ `42`，我们可以如下所示搜索它：\n\n```\nauto pos42  = std::ranges::find(coll.begin(), std::unreachable_sentinel,\n\
  \                                42);\n```\n\n通常，算法会同时与 `42` 和 `coll.end()`（或任何传递作为结束/哨兵的内容）进行比较。由于使用了\
  \ `unreachable_sentinel`（与迭代器的任何比较始终返回 `false`），编译器可以优化代码，仅与 `42` 进行比较。当然，程序员必须确保\
  \ `42` 存在。\n\niota view 提供了一个使用 `unreachable_sentinel` 处理无限范围的示例。\n\n## 8.3 `std::ranges`\
  \ 中的辅助函数\n\n表格 范围的通用实用函数 列出了所有用于范围的实用函数。\n\n| **函数** | **含义** |\n| --- | --- |\n\
  | `rng::empty(*rg*)` | 返回范围是否为空\n| `rng::size(*rg*)` | 返回范围的大小 |\n| `rng::ssize(*rg*)`\
  \ | 返回作为有符号类型值的范围大小 |\n| `rng::begin(*rg*)` | 返回指向范围第一个元素的迭代器 |\n| `rng::end(*rg*)`\
