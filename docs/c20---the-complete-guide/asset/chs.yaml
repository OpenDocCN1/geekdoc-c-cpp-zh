  \ 描述所有其他缺失的 lambda 特性\n* **2021-08-20**: 记录所有新的类型特征\n* **2021-08-20**: 记录所有新的类型特征\n\
  * **2021-07-31**: 描述所有缺失的 lambda 特性\n* * * * * *\n\n## 1.3 致谢\n\n首先，我要感谢你们，C++ 社区，让这本书成为可能。C++20\
