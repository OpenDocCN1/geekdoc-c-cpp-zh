  \ 20.6 之后开始的剩余 翻译：)\n\n---\n\n## 20.6 Type Traits\n\n[New Type Traits 列出了随 C++20\
  \ 引入的新类型：\n\n| Trait | Effect |\n| :--- | :--- |\n| `is_bounded_array<T>` | 返回 true，如果\
  \ `T` 是已知延度的数组 |\n| `is_unbounded_array<T>` | 返回 true，如果 `T` 是未知延度的数组 |\n| `is_nothrow_convertible<T,\
  \ T2>` | 返回 true，如果 `T` 可以转换为 `T2` 且不抛出异常 |\n| `is_layout_compatible<T1, T2>` |\
  \ 返回 true，如果 `T1` 的指针可以安全转换为其基类型 `BaseT` 的指针 |\n| `base_of<BaseT, DerT>` | |\n|\
  \ `remove_cvref<T>` | 返回去掉引用、`const` 和 `volatile` 的类型 `T` |\n| `unwrap_reference<T>`\
  \ | 如果 `T` 是 `std::reference_wrapper`，返回其内部类型，否则返回 `T` |\n| `unwrap_ref_decay<T>`\
  \ | 如果 `T` 是 `std::reference_wrapper`，返回其内部类型，否则返回 `T` 的退化类型 |\n| `common_reference<T...>`\
  \ | 返回所有可以赋值的类型 `T...` 的共同类型（如果存在） |\n| `type_identity<T>` | 返回原始类型 `T` |\n| `is_clock<T>`\
  \ | 返回 true，如果 `T` 是时钟类型 |\n\n此外，类型属性 `is_pod<>` 已被弃用。后续段落将详细讨论这些属性。\n\n### 20.6.1\
  \ Type Traits `is_bounded_array<>` 和 `is_unbounded_array`\n\n`std::is_bounded_array<T>::value`\n\
  \n`std::is_unbounded_array<T>::value`\n\n返回类型 `T` 是否为边界/无边界数组（延度已知/未知）。\n\n例如：\n\
  \n```cpp\nint a[5];\nstd::is_bounded_array_v<decltype(a)>     // true\nstd::is_unbounded_array_v<decltype(a)>\
  \   // false\n\nextern int b[];\nstd::is_bounded_array_v<decltype(b)>     // false\n\
  std::is_unbounded_array_v<decltype(b)>   // true\n```\n\n### 20.6.2 Type Trait `is_nothrow_convertible<>`\n\
  \n`std::is_nothrow_convertible<From, To>::value`\n\n返回类型 `From` 是否可以转换为类型 `To` 且保证不抛出任何异常。\n\
  \n例如：\n\n\n\n\n\n```\n// char* 到 std::string:\nstd::is_convertible_v<char*, std::string>\
  \                     // true\nstd::is_nothrow_convertible_v<char*, std::string>\
  \             // false\n\n// std::string 到 std::string_view:\nstd::is_convertible_v<std::string,\
  \ std::string_view>          // true\nstd::is_nothrow_convertible_v<std::string,\
  \ std::string_view>  // true\n```\n\n### 20.6.3 类型 Trait `is_layout_compatible<>`\n\
  \n`std::is_layout_compatible<T1, T2>::value`\n\n判断类型 `T1` 和 `T2` 是否为**布局兼容 (layout\
  \ compatible)**，以便你可以使用 `reinterpret_cast` 安全地在它们的指针之间进行转换。\n\n### 20.6.4 类型 Trait\
  \ `is_layout_pointer_interconvertible_base_of<>`\n\n`std::is_layout_pointer_interconvertible_base_of<Base,\
  \ Der>::value`\n\n如果指向类型 `Der` 的指针可以通过 `reinterpret_cast` 安全地转换为其基类类型 `Base` 的指针，则产生\
  \ `true`。\n\n如果两者是相同类型，则始终始终产生 `true`。\n\n### 20.6.5 类型 Trait `remove_cvref<>`\n\
  \n`std::remove_cvref<T>::type`\n\n产生不带引用、`const` 和 `volatile` 修饰的类型 `T`。\n\n表达式\n\
  \n```\nstd::remove_cvref_t<T>\n```\n\n等价于：\n\n```\nstd::remove_cv_t<remove_reference_t<T>>\n\
  ```\n\n### 20.6.6 类型 Traits `unwrap_reference<>` 和 `unwrap_ref_decay`\n\n`std::unwrap_reference<T>::type`\n\
  \n如果 `T` 是 `std::reference_wrapper<>`（通过 `std::ref()` 或 `std::cref()` 创建），则产生 `T`\
  \ 的包装类型；否则产生 `T`。\n\n`std::unwrap_ref_decay<T>::type`\n\n如果 `T` 是 `std::reference_wrapper<>`（通过\
  \ `std::ref()` 或 `std::cref()` 创建），则产生 `T` 的包装类型；否则产生 `T` 的退化类型 (decayed type)。\n\
  \n例如：\n\n```\nstd::unwrap_reference_t<decltype(std::ref(s))>    // std::string&\n\
  std::unwrap_reference_t<decltype(std::cref(s))>   // const std::string&\nstd::unwrap_reference_t<decltype(s)>\
  \              // std::string\nstd::unwrap_reference_t<decltype(s)&>           \
  \  // std::string&\nstd::unwrap_reference_t<int[4]>                   // int[4]\n\
  \nstd::unwrap_ref_decay_t<decltype(std::ref(s))>    // std::string&\nstd::unwrap_ref_decay_t<decltype(std::cref(s))>\
  \   // const std::string&\nstd::unwrap_ref_decay_t<decltype(s)>              //\
  \ std::string\nstd::unwrap_ref_decay_t<decltype(s)&>             // std::string&\n\
  std::unwrap_ref_decay_t<int[4]>                   // int*\n```\n\n### 20.6.7 类型\
  \ Trait `common_reference<>`\n\n`std::common_reference<T...>::type`\n\n产生所有可以对其进行赋值的类型\
  \ `T...` 的公共类型（如果有的话）。因此，给定类型 `T1`、`T2` 和 `T3`，该 Trait 会产生一个可以接受这三种类型值的类型。理想情况下，它是一个引用类型。然而，如果涉及创建临时对象的类型转换，它将是一个值类型。\n\
  \n例如：\n\n```\nstd::common_reference_t<int&, int>                            // int\n\
  std::common_reference_t<int&, int&>                           // int&\nstd::common_reference_t<int&,\
  \ int&&>                          // const int&\nstd::common_reference_t<int&&,\
  \ int&&>                         // int&&\nstd::common_reference_t<int&, double>\
  \                         // double\nstd::common_reference_t<int&, double&&>   \
  \                    // double\nstd::common_reference_t<char*, std::string, std::string_view>\
  \ // std::string_view\nstd::common_reference_t<char, std::string>              \
  \      // ERROR\n```\n\n### 20.6.8 类型 Trait `type_identity<>`\n\n`std::type_identity<T>::type`\n\
  \n仅产生类型 `T`。\n\n该类型 Trait 有许多意想不到的使用场景：\n\n*   你可以禁用某个参数被用于推导模板参数。例如：\n\n```cpp\n\
  template<typename T>\n  void insert(std::vector<T>& coll, const std::type_identity_t<T>&\
  \ value)\n  {\n     coll.push_back(value);\n  }\n\n  std::vector<double> coll;\n\
  \  insert(coll, 42); // OK：42 的类型未被用于推导 T\n```\n如果参数 `value` 被声明为 `const&`，编译器将报错，因为它会为\
  \ `T` 推导出两个类型。\n\n*   你可以用它作为构建块来定义产生类型的类型 Trait。例如，你可以如下定义一个移除 `const` 的类型 Trait：\n\
  \n```cpp\ntemplate<typename T>\nstruct remove_const_identity {\n    using type =\
  \ typename std::remove_const<T>::type;\n};\n```\n\n### 20.7 数学常量\n\nC++20 引入了最重要的浮点数常量。它们提供在\
  \ `<numbers>` 头文件的 `std::numbers` 命名空间中。\n\n| 常量 | 模板 |\n| --- | --- |\n| `std::numbers::e`\
  \ | `std::numbers::e_v` |\n| `std::numbers::pi` | `std::numbers::pi_v` |\n| `std::numbers::inv_pi`\
  \ | `std::numbers::inv_pi_v` |\n| `std::numbers::inv_sqrtpi` | `std::numbers::inv_sqrtpi_v`\
  \ |\n| `std::numbers::sqrt2` | `std::numbers::sqrt2_v` |\n| `std::numbers::sqrt3`\
  \ | `std::numbers::sqrt3_v` |\n| `std::numbers::inv_sqrt3` | `std::numbers::inv_sqrt3_v`\
  \ |\n| `std::numbers::log2e` | `std::numbers::log2e_v` |\n| `std::numbers::log10e`\
  \ | `std::numbers::log10e_v` |\n| `std::numbers::ln2` | `std::numbers::ln2_v` |\n\
  | `std::numbers::ln10` | `std::numbers::ln10_v` |\n| `std::numbers::egamma` | `std::numbers::egamma_v`\
  \ |\n| `std::numbers::phi` | `std::numbers::phi_v` |\n\n这些常量是带有 `_v` 后缀的对应变量模板的特化。其值是对应类型的最可表示值。例如：\n\
  \n```cpp\nnamespace std::numbers {\n  template<std::floating_point T> inline constexpr\
  \ T pi_v<T> = ...;\n  inline constexpr double pi = pi_v<double>;\n}\n```\n\n如所见，定义使用了\
  \ `std::floating_point` 概念（该概念正是为此原因引入的）。\n\n因此，你可以这样使用它们：\n\n```cpp\n#include <numbers>\n\
  ...\n\ndouble area1 = rad * rad * std::numbers::pi;\n\nlong double area2 = rad *\
  \ rad * std::numbers::pi_v<long double>;\n```\n\n\n\n\n\n# 20.8 处理位操作的工具\n\nC++20\
  \ 为处理位操作提供了更好、更简洁的支持：\n\n*   缺失的低级位操作\n*   位类型转换（bit casts）\n*   检查平台的字节序（endianess）\n\
  \n所有这些实用工具都定义在头文件 `<bit>` 中。\n\n## 20.8.1 位操作\n\n硬件通常对位操作（如“左旋转”或“右旋转”）有特殊的支持。然而，在\
  \ C++20 之前，C++ 程序员无法直接访问这些指令。新引入的位操作为底层底层 CPU 的位指令提供了直接的 API。\n\n表 位操作 列出了 C++20\
  \ 引入的所有标准位操作。它们在头文件 `<bit>` 中定义，以 `std` 命名空间中的自由函数的形式提供。\n\n### 位操作\n\n| **操作**\
  \ | **含义** |\n| --- | --- |\n| `rotl(val, n)` | 产生 `val` 的左旋转 `n` 位的结果 |\n| `rotr(val,\
  \ n)` | 产生 `val` 的右旋转 `n` 位的结果 |\n| `countl_zero(val)` | 产生前导（最高位）`0` 位的个数 |\n|\
  \ `countl_one(val)` | 产生前导（最高位）`1` 位的个数 |\n| `countr_zero(val)` | 产生末尾（最低位）`0` 位的个数\
  \ |\n| `countr_one(val)` | 产生末尾（最低位）`1` 位的个数 |\n| `popcount(val)` | 产生值中 `1` 的个数\
  \ |\n| `has_single_bit(val)` | 产生 `val` 是否为 2 的幂（仅有一个位置 1） |\n| `bit_floor(val)`\
  \ | 产生小于或等于该值的 2 的幂 |\n| `bit_ceil(val)` | 产生大于等于该值的 2 的幂 |\n| `bit_width(val)`\
  \ | 产生存储该值所需的位数 |\n\n例如，考虑以下程序：\n\n```cpp\n#include <iostream>\n#include <format>\n\
  #include <bitset>\n#include <bit>\n\nint main()\n{\n  std::uint8_t i8 = 0b0000'1101;\
  \ \n  std::cout\n    << std::format(\"{0:08b} {0:3}\\n\", i8)                 //\
  \ 00001101\n    << std::format(\"{0:08b} {0:3}\\n\", std::rotl(i8, 2))   // 00110100\n\
  \    << std::format(\"{0:08b} {0:3}\\n\", std::rotr(i8, 1))   // 10000110\n    <<\
  \ std::format(\"{0:08b} {0:3}\\n\", std::rotr(i8, -1))  // 00011010\n    << std::format(\"\
  {}\\n\", std::countl_zero(i8))          // 4 个前导零\n    << std::format(\"{}\\n\"\
  , std::countr_one(i8))           // 1 个末尾 1\n    << std::format(\"{}\\n\", std::popcount(i8))\
  \             // 3 个 1\n    << std::format(\"{}\\n\", std::has_single_bit(i8)) \
  \      // false\n    << std::format(\"{0:08b} {0:3}\\n\", std::bit_floor(i8)) //\
  \ 00001101\n    << std::format(\"{0:08b} {0:3}\\n\", std::bit_ceil(i8))  // 00001101\n\
  \    << std::format(\"{}\\n\", std::bit_width(i8));           // 4\n}\n```\n\n`lib/bitops8.cpp`：\n\
  \n该程序的输出如下：\n\n```\n00001101  13\n00110100  52\n10000110 134\n00011010  26\n4\n\
  1\n3\nfalse\n00001000   8\n00010000  16\n4\n```\n\n注意以下几点：\n\n*   除了 `std::bit_cast<>`\
  \ 以外的所有位操作。\n*   注意旋转函数也接受负数 `n`，这意味着旋转方向会随之改变。\n*   所有返回计数的函数返回类型均为 `int`。唯一的例外是\
  \ `bit_width()`，它返回传入参数类型的值，这在标准中是一个不一致之处（我假设这是一个 bug）。因此，当将其作为 `int` 使用或直接打印它时，你可能需要使用\
  \ `static_cast`。\n\n如果你运行一个对应 `std::uint16_t` 的程序（参见 `lib/bitops16.cpp`），你将得到以下输出：\n\
  \n```\n0000000000001101    13\n0000000000110100    52\n1000000000000110 3274\n000000000001010\
  \    26\n12\n1\n3\nfalse\n0000000000001000     8\n00010000  16\n4\n```\n\n\n\n\n\
  然而，你可能不允许算法在多个数据项上运行，但将算法限制为仅使用一个线程。为此，C++20 现在提供了执行策略 `std::execution::unseq`。一如既常，新的执行策略是\
  \ `std::execution` 命名空间中相应唯一类 `unsequenced_policy` 的 `constexpr` 对象。表 执行策略 列出了目前支持的所有标准\
  \ `execution policies`。\n\n# 执行策略\n\n| `Policy` | 含义 |\n| --- | --- |\n| `std::execution::seq`\
  \ | 使用单线程对单条数据进行顺序执行 |\n| `std::execution::par` | 使用多线程对单数据进行并行执行 |\n| `std::execution::unseq`\
  \ | 使用单线程对多个数据并行执行（自 C++20 起） |\n| `std::execution::par_unseq` | 使用多线程对多个数据并行执行\
  \ |\n\n无序执行策略（unsequenced execution policy）允许用于访问元素的操作在单个执行线程上交替执行。你不应该将此策略与阻塞同步（例如使用\
  \ `mutexes`）一起使用，因为这可能会导致死锁。\n\n这里是一个使用它的示例：\n\n```cpp\n#include <iostream>\n#include\
  \ <vector>\n#include <cmath>\n#include <algorithm>\n#include <execution>\n\nint\
  \ main (int argc, char** argv)\n{\n  // 从命令行初始化参数数量（默认值：1000）：\n  int numElems =\
  \ 1000;\n  if (argc > 1) {\n    numElems = std::atoi(argv[1]);\n  }\n\n  // 初始化包含不同\
  \ double 值的 vector：\n  std::vector<double> coll;\n  coll.reserve(numElems);\n  for\
  \ (int i=0; i<numElems; ++i) {\n    coll.push_back(i * 4.37);\n  }\n\n  // 处理平方根：\n\
  \  // - 允许 SIMD 处理但仅使用一个线程\n  std::for_each(std::execution::unseq,     // 自 C++20\n\
  \                coll.begin(), coll.end(),\n                [](auto& val) {\n  \
  \                val = std::sqrt(val);\n                });\n\n  for (double value\
  \ : coll) {\n    std::cout << value << '\\n';\n  }\n}\n```\n\n`lib/unseq.cpp`:\n\
  \n与执行策略一如既常，你无法影响策略何时以及如何被使用。通过此策略，你 `enable` 了向量化或 SIMD 计算；然而，你并没有强制要求。在不支持此策略的硬件上，或者实现在运行时决定不使用它（例如\
  \ CPU 负载过高），`unseq` 策略将导致顺序执行。\n\n## 20.11 后记\n\n字符串成员函数 `starts_with()` 和 `ends_with()`\
  \ 由 Mikhail Maltsev 在 [`wg21.link/p0457r2`](http://wg21.link/p0457r2) 中最终制定引入。\n\
  \n字符串 `reserve()` 函数的限制最早由 Andrew Luo 在 [`wg21.link/lwg2968`](http://wg21.link/lwg2968)\
  \ 中提出的。最终接受的表述由 Mark Zeren 和 Andrew Luo 在 [`wg21.link/p0966r1`](http://wg21.link/p0966r1)\
  \ 中制定。\n\n`ssize()` 函数被讨论了很久，用于解决有符号索引与无符号大小比较的问题。我们希望所有的 `size()` 函数都产生有符号值；然而，存在向后兼容问题。作为对\
  \ `std::span` 使用有符号大小类型提案的反应，`ssize()` 最初由 Robert Douglas、Nevin Liber 和 Marshall\
  \ Clow 在 [`wg21.link/p1089r0`](http://wg21.link/p1089r0) 中提出。最终接受的表述由 Jorg Brown\
  \ 在 [`wg21.link/p1227r2`](http://wg21.link/p1227r2) 中制定。`std::ranges::ssize()` 随后由\
  \ Hannes Hauswedell、Jorg Brown 和 Casey Carter 在 [`wg21.link/p1970r2`](http://wg21.link/p1970r2)\
  \ 中添加。\n\n对源位置（source location）的访问最早由 Robert Douglas 在 [`wg21.link/n3972`](http://wg21.link/n3972)\
  \ 中提出。最终接受的表述由 Robert Douglas、Corentin Jabot、Daniel Krügler 和 Peter Sommerlad 在\
  \ [`wg21.link/p1208r6`](http://wg21.link/p1208r6) 中制定。\n\n类型特性的 `is_bounded_array<>`\
  \ 和 `is_unbounded_array<>` 按照 Walter E. Brown 和 Glen J. Fernandes 在 [`wg21.link/p1357r1`](http://wg21.link/p1357r1)\
  \ 中的建议被接受。\n\n类型特性的 `is_nothrow_convertible<>` 按照 Daniel Krügler 在 [`wg21.link/p0758r1`](http://wg21.link/p0758r1)\
  \ 中的建议被接受。\n\n类型特性的 `common` 按照 Daniel Krügler 在 [`wg21.link/p0758r1`](http://wg21.link/p0758r1)\
  \ 中的建议被接受。\n\n\n\n让我们来看几个简单的示例，演示如何在一个文件中声明模块，然后在另一个文件中使用该模块。\n\n### 21.1.1 实现并导出模块\n\
  \n模块的 API 规范定义在其`主模块接口单元`（primary module interface unit）中，每个模块恰好有一个：\n\n```\nexport\
  \ module Square;  // declare module Square\n\nint square(int i);\n\nexport class\
  \ Square {\n private:\n   int value;\n public:\n   Square(int i) \n    : value{square(i)}\
  \ {\n   }\n   int getValue() const {\n     return value;\n   }\n};\n\nexport template<typename\
  \ T>\nSquare toSquare(const T& x) {\n  return Square{x};\n}\n\nint square(int i)\
  \ {\n  return i * i;\n}\n```\n\n`lang/mod0.cppm`:\n\n首先，你可能会发现该文件使用了新的文件扩展名：`.cppm`。模块文件的扩展名目前尚未明确。我们稍后会讨论编译器对模块文件的处理。\n\
  \n主模块接口的关键入口是声明并导出使用 `Square` 名称模块的该行：\n\n```\nexport module Square;  // declare\
  \ module Square\n```\n\n注意，该名称仅用作导入模块的标识符。它 `并没有` 引入新的作用域或命名空间。模块导出的任何名称仍然在其导出时所在的作用域内。\n\
  \n模块的名称可以包含点，但点没有特殊含义：\n\n```\nexport module Math.Square;  // declare module \"\
  Module.Square\"\n```\n\n这除了将模块命名为 `ModuleDotSquare` 之外没有其他影响。点可以用来表示模块之间的某些逻辑关系；然而，使用点并不会产生语法上或形式上的后果。\n\
  \n模块的公共 API 是由所有使用 `export` 关键字显式导出的内容定义的。在本例中，我们导出了类 `Square` 和函数模板 `toSquare<>()`：\n\
  \n```cpp\nexport class Square {\n  ...\n};\n\nexport template<typename T>\nSquare\
  \ toSquare(const T& x) {\n   ...\n}\n```\n\n其他所有内容均`没有`被导出，无法被导入该模块的代码直接使用（我们稍后将讨论非导出的模块内容如何可达但不可见的`\
  \ 不供导入此模块的代码使用。\n\n该文件看起来像头文件，但有以下不同：\n\n* 我们有模块声明的行。\n* 我们有通过 `export` 导出的符号、类型、函数（甚至是模板）。\n\
  * 我们不需要 `inline` 来定义函数。\n* 我们不需要预处理器保护符。\n\n每个模块必须恰有一个指定名称的主模块接口单元`文件。正如你看到的，模块的名称\
  \ `并没有`与模块`中`的任何符号冲突。因此，模块的可以使用其（主要的）命名空间、类或函数的名称（注意，模块*不会* 自动引入新的命名空间；你必须显式实现这一点）。\n\
  \n### 21.1.2 导入并使用模块\n\n要在程序中使用模块（或其代码），你必须根据其名称导入模块。这里有一个使用上面定义的 `Square` 模块的简单程序示例：\n\
  \n```cpp\n#include <iostream>\n\nimport Square;  // import module ``Square''\n\n\
  int main()\n{\n  Square x = toSquare(42);\n  std::cout << v.getValue() << '\\n';\n\
  }\n```\n\n`lang/mod0main.cpp`:\n\n通过\n\n```cpp\nimport Square;  // import module\
  \ \"Square\"\n```\n\n我们导入了 `Square` 模块的所有导出内容。这意味着我们随后可以使用导出的类 `Square` 和函数模板 `toSquare<>()`。\n\
  \n使用模块中未导出的任何内容都会导致编译错误：\n\n```cpp\nimport Square;  // import module \"Square\"\n\
  \nsquare(42)      // ERROR: square() not exported\n```\n\n再次注意，模块*不会* 自动引入新的命名空间。我们在符号导出时所在的作用域中使用模块的导出符号。如果你希望让模块中的所有内容位于自己的命名空间中，你必须在模块中实现这一点。\n\
  \n### 21.1.3 可达与可见\n\n当模块模块时，引入了一个新的区分：*可达性*（reachability）与*可见性*（visibility）。^(59)\
  \ 在导出数据时，我们可能无法看到并直接使用模块的名称或符号；尽管我们可能可以间接使用它。\n\n当导出的 API 提供对未导出类型的访问时，就会出现可达但不可见的符号。考虑以下示例：\n\
  \n```cpp\nexport module ModReach;   // declare module ModReach\n\nstruct Data {\
  \             // 声明一个未导出的类型\n  int value;\n};\n\nexport struct Customer {  // 声明一个导出的类型\n\
  \ private:\n  Data data;\n public:\n  Customer(int i)\n   : data{i} {\n  }\n  Data\
  \ getData() const {  // 返回未导出类型\n    return data;\n  }\n};\n```\n\n导入此模块时，类型 `Data`\
  \ 是`不可见的`，因此无法直接使用：\n\n```cpp\nimport ModReach;\n\nData d{11};                 \
  \   // ERROR: type not exported\n```\n\n然而，类型 `Data` 是*可达的*，并且通过这种间接方式：\n\n```cpp\n\
  import ModReach;\n\nCustomer c{42};               // OK: type Data is reachable\n\
  Data d = c.getData();          // OK: type Data is reachable\n```\n\n### 21.1.4\
  \ 模块与命名空间\n\n如前所述，模块的符号是在它们导出所在的作用域内导入的。与其他编程语言不同，C++ 模块*不会* 自动引入命名空间。\n\n因此，你可能会将模块中的所有内容导出到命名空间。你可以通过两种方式实现：\n\
  \n* 在命名空间内部使用 `export` 指定你想要导出的内容：\n\n  ```cpp\n     export module Square;  // declare\
  \ module \"Square\"\n\n      namespace Square {\n        int square(int i);\n\n\
  \        export class Square {\n          ...\n        };\n\n        export template<typename\
  \ T>\n        Square toSquare(const T& x) {\n          ...\n        }\n\n      \
  \  int square(int i) {  // 未导出\n          ...\n        }\n      }\n    ```\n\n*\
  \ 在 `export` 声明的命名空间内指定你想要导出的所有内容：\n\n  ```cpp\n     export module Square;  // declare\
  \ module \"Square\"\n\n      int square(int i);\n\n      export namespace Square\
  \ {\n        class Square {\n          ...\n        };\n\n        template<typename\
  \ T>\n        Square toSquare(const T& x) {\n          ...\n        }\n      }\n\
  \n      int square(int i) {  // 未导出\n        ...\n      }\n  ```\n\n你仍然可以在没有用 `export`\
  \ 声明的命名空间 `Square` 中声明 `square()`。\n\n在这两种情况下，模块都导出了 `Square::Square` 和 `Square::toSquare<>()`（因此符号的命名空间被导出了，即使没有标记为\
  \ `export`）。\n\n### 21.1.5 模块与文件名\n\n与其他语言不同，C++ 并不要求模块具有特殊的文件名或位于特殊目录。任何 C++ 文件都可以定义模块（但只能一个），模块名称可能与文件名或位置无关。\n\
  \n\n\n\n当然，让文件名和模块名在某种程度上保持同步是有意义的；然而，这种决定仅仅是你源代码配置管理层面的决定。\n\n正如前面提到的，模块文件并不需要特定的文件扩展名。这取决于取决于所使用的惯例和工具。尽管如此，正如你看到的，我建议为模块接口使用特殊的文件扩展名，我们将在稍后详细讨论\
  \ 这一点。\n\n### 21.2 多文件多模块\n\n模块的目的是处理分布在多个文件中的大型代码。在未来，模块将用于封装由 2 个、10 个甚至 100 个文件组成的小型、中型和非常大的组件。这些文件甚至可能由多个程序员和团队提供并维护。\n\
  \n为了演示这种方法的可扩展性及其优势，让我们现在来看看如何使用多个文件来定义一个可以被其他代码使用/导入的模块。该示例的代码规模仍然很小，通常你不会将这些代码放在多个文件中；然而，我们想通过一个非常简单的示例来演示这些特性。\n\
  \n#### 21.2.1 模块单元 (Module Units)\n\n通常，模块由多个`module units`组成。模块单元是属于某个模块的编译单元（translation\
  \ units）。\n\n所有模块单元都必须以某种方式编译。即使它们只包含声明（这些声明在传统代码中会被放置在头文件中），也是需要进行某种预编译的。文件被转换为内部二进制格式，这种格式可以避免你必须反复编译相同的代码的情况。\n\
  \n然而，我们有不同的方法将一个模块拆分为多个文件：\n\n*   模块实现单元(Module implementation units）允许程序员提供代码，这些代码以传统方式编译为对象文件。\n\
  *   内部分区(Internal partitions）允许程序员提供仅在模块内部可见的声明和定义。然而，即使仅是声明，它们也会被预编译以避免多次编译。\n\
  *   接口分区(Interface partitions）允许程序员将导出的模块 API 分拆到多个文件中。\n\n下一节将通过示例介绍这些不同的模块单元。\n\
  \n#### 21.2.2 带有多个实现单元的模块\n\n第一个由多个文件提供的模块示例仅使用多个文件来定义/实现类型和函数。\n\n##### 21.2.2.1\
  \ 带有全局模块片段的主模块接口\n\n首先，我们再次拥有一个定义我们要导出内容的主模块接口单元：\n\n```\nmodule;              //\
  \ 以全局模块片段开始模块模块单元\n\n#include <string>\n#include <vector>\n\nexport module Mod1;\
  \  // 模块声明\n\nstruct Order {\n  int count;\n  std::string name;\n  double price;\n\
  \n  Order(int c, std::string n, double p)\n   : count{c}, name{n}, price{p} {\n\
  \  }\n};\n\nexport class Customer {\n private:\n  std::string name;\n  std::vector<Order>\
  \ orders;\n public:\n  Customer(std::string n)\n   : name{n} {\n  }\n  void buy(std::string\
  \ ordername, double price) {\n    orders.push_back(Order{1, ordername, price});\n\
  \  }\n  void buy(int num, std::string ordername, double price) {\n    orders.push_back(Order{num,\
  \ ordername, price});\n  }\n  double sumPrice() const;\n  double averagePrice()\
  \ const;\n  void print() const;\n};\n```\n\n`lang/mod1/mod1.cppm`:\n\n这一次，模块直接以\
  \ `module;` 开始，标志着我们为模块接口单元开始一些预处理器内容：\n\n```\nmodule;              // 以全局模块片段开始模块模块单元\n\
  \n#include <iostream>\n#include <string>\n#include <vector>\n\nexport module Mod1;\
  \  // 模块声明\n...\n```\n\n在这里我们引入了`global module fragment`全局模块片段，我们可以在其中放置如 `#define`\
  \ 和 `#include` 等预处理器命令。该区域的所有内容都不会被导出（没有宏、没有声明、没有定义）。\n\n在真正通过以下代码开始模块之前，无法进行其他操作：\n\
  \n```\nexport module mod1;  // 模块声明\n```\n\n模块中定义的内容有：\n\n*   一个内部数据结构 `Order`：\n\
  \n    ```cpp\n     struct Order {\n        ...\n      };\n    ```\n    该数据结构用于订单条目。每个条目保存了订购商品数量、名称和价格。构造函数确保我们初始化了所有成员。\n\
  \n*   一个导出的类 `customer`：\n\n    ```cpp\n     export class Customer {\n        ...\n\
  \      };\n    ```\n    如你所见，我们需要头文件和内部数据结构 `Order` 来定义类 `Customer`。然而，由于我们没有导出它们，导入此模块的代码无法直接使用它们。\n\
  \n对于 `Customer` 类，成员函数 `averagePrice()`、`sumPrice()` 和 `print()` 仅 string 了声明。我们在与模块相关的实现文件中实现它们。\n\
  \n##### 21.2.2.2 模块实现单元\n\n为了提供不导出到模块的源代码，你可以使用 `module implementation units`（模块实现单元）。它们类似于普通的\
  \ CPP 编译单元，但开头有一个语句说明它们适用于特定的模块。\n\n我们可以根据需要拥有任意数量的实现单元。在我们的示例中，我提供了两个，一个用于实现数值运算，另一个用于实现\
  \ I/O。\n\n数值运算的实现单元如下：\n\n```cpp\nmodule Mod1;\n\ndouble Customer::sumPrice() const\n\
  {\n  double sum = 0.0;\n  for (const auto& od : orders) {\n    sum += od.count *\
  \ od.price;\n  }\n  return sum;\n}\n\ndouble Customer::averagePrice() const\n{\n\
  \  if (orders.empty()) {\n    return 0.0;\n  }\n  return sum / orders.size();\n\
  }\n```\n\n`lang/mod1/mod1.cpp`:\n\n该文件以 `module` 开头，因此是一个模块单元：\n\n```cpp\nmodule\
  \ Mod1;\n```\n\n这导入了主接口。因此，`Order` 和 `Customer` 的声明是可见的，我们可以直接提供它们的实现。\n\n注意，模块实现单元不导出任何内容。`export`\
  \ 只允许位于接口（记住每个模块只有一个主接口）。\n\n再次，模块实现单元可以全局模块片段开始，我们在 I/O 实现单元中可以看到这一点：\n\n```cpp\n\
  module;              // 以全局模块片段开始模块单元\n\n#include <iostream>\n#include <format>\n\
  \nmodule Mod1;\n\nvoid Customer::print() const\n{\n  // 打印名字\n  std::cout << name\
  \ << \":\\n\";\n  // 打印订单条目\n  for (const auto& od : orders) {\n    std::cout <<\
  \ std::format(\"{:3} {:14} {:6.2f} {:6.2f}\\n\",\n                             od.count,\
  \ od.name, od.price, od.count * od.price);\n  }\n  // 打印总和：\n  std::cout << std::format(\"\
  {:25} ------\\n\", ' ');\n  std::cout << std::format(\"{:25} {:6.2f}\\n\", \"  \
  \  Sum:\", sumPrice());\n}\n```\n\n`lang/mod1/mod1io.cpp`:\n\n在这里，我们通过 `module;`\
  \ 引入模块，以便为实现单元使用的头文件提供全局模块片段。`<format>` 是新的格式化库 的头文件。\n\n可见模块实现单元使用传统 C++ 编译单元的文件扩展（大多数情况下为\
  \ `.cpp`）。编译器处理它们就像处理任何其他 C++ 代码一样。\n\n##### 21.2.3 使用模块\n\n使用模块的代码如下：\n\n```cpp\n\
  #include <iostream>\n\nimport Mod1;\n\nint main()\n{\n  Customer c1{\"Kim\"};\n\n\
  \  c1.buy(\"table\", 59.90);\n  c1.buy(4, \"chair\", 9.20);\n\n  c1.print();\n \
  \ std::cout << \"  Average: \" << c1.averagePrice() << '\\n';\n}\n```\n\n`lang/mod1/testmod1.cpp`:\n\
  \n\n\n在这里，我们使用从主模块接口导出的类 `Customer` 创建客户，下单一些订单，打印带有所有订单的客户，并打印平均订单的值。\n\n该程序的输出如下：\n\
  \n```\nKim:\n  1 table           59.90  59.90\n  4 chair            9.20  36.80\n\
  \                          ------\n    Sum:                   96.70\n  Average:\
  \ 48.35\n```\n\n注意，在导入模块的代码中任何尝试类型 `Order` 的尝试都会导致编译错误。\n\n### 21.2.3 内部模块分区 (Internal\
  \ Module Partitions)\n\n在上面的示例中，我们引入了一个数据结构 `Order`，它仅在模块内部使用。看起来我们必须在主模块接口中声明它，以便让所有实现单元可用，这在大型项目中显然并不具备可扩展性。\n\
  \n通过`内部分区`（internal partitions），你可以在单独文件中定义模块的此类内部内容。请注意，`partitions` 也可以用于在单独文件中定义导出的接口，我们将在稍后讨论这一点。\n\
  \n注意，`内部分区`有时被称为`分区实现单元`（partition implementation units），这是基于在 C++20 标准中，它们正式被称为“模块实现单元”（module\
  \ implementation units），且它们是“模块分区”（module partitions），这听起来像是它们提供了接口分区的实现。它们并非如此。它们的作用就像模块的内部头文件，可以提供声明和定义。\n\
  \n#### 21.2.3.1 定义内部分区\n\n使用内部分区，我们可以在自己的模块单元中按如下方式定义本地类型 `Order`：\n\n```\nmodule;\
  \              // 以全局模块片段开始模块单元\n\n#include <string>\n\nmodule Mod2:Order;   //\
  \ 内部分区声明\n\nstruct Order {\n  int count;\n  std::string name;\n  double price;\n\
  \n  Order(int c, std::string n, double p)\n   : count{c}, name{n}, price{p} {\n\
  \  }\n};\n```\n\n`lang/mod2/mod2order.cppp`:\n\n如你所见，分区的名称是模块名，一个冒号，然后是它的名称：\n\n\
  ```\nmodule Mod3:Order;\n```\n\n你可能再次发现该文件使用了另一个新的扩展名：`.cppp`，我们将在查看其内容后稍后讨论。\n\n\
  现在，主模块接口简单地导入了这个分区：\n\n```\nmodule;              // 以全局模块片段开始模块单元\n\n#include <string>\n\
  #include <vector>\n\nexport module Mod2;  // 模块声明\n\nimport :Order;       // 导入内部分区\
  \ Order \n\nexport class Customer {\n private:\n  std::string name;\n  std::vector<Order>\
  \ orders;\n public:\n  Customer(std::string n)\n   : name{n} {\n  }\n  void buy(std::string\
  \ ordername, double price) {\n    orders.push_back(Order{1, ordername, price});\n\
  \  }\n  void buy(int num, std::string ordername, double price) {\n    orders.push_back(Order{num,\
  \ ordername, price});\n  }\n  double sumPrice() const;\n  double averagePrice()\
  \ const;\n};\n```\n\n`lang/mod2/mod2.cppm`:\n\n主模块接口必须导入内部分区，因为它使用了类型 `Order`。通过这种，它在模块的所有实现单元中都可用。如果主模块接口不需要类型\
  \ `Order` 且没有导入内部分区，所有需要类型 `Order` 的模块单元都将直接导入内部分区。\n\n注意，分区仅仅是模块的内部实现方面。代码是否在分区内对导入模块的代码没有影响。\n\
  \n### 21.2.4 接口分区 (Interface Partitions)\n\n你也可以将模块的接口拆分为多个文件。在这种情况下，你声明`接口分区`（interface\
  \ partitions），它们本身导出任何应该导出的内容。\n\n如果模块提供了由不同程序员和/或团队维护的多个接口，则`接口分区` 特别有用。然而，为了简单起见，让我们使用当前的示例，通过仅在单独文件中定义\
  \ `Customer` 接口来演示如何使用此功能。\n\n为了仅定义 `Customer` 接口，我们可以提供以下文件：\n\n```\nmodule;  \
  \                     // 以全局模块片段开始模块单元\n\n#include <string>\n#include <vector>\n\
  \nexport module Mod3:Customer;  // 接口分区声明\n\nimport :Order;                // 导入内部分区以使用\
  \ Order\n\nexport class Customer {\n private:\n  std::string name;\n  std::vector<Order>\
  \ orders;\n public:\n  Customer(std::string n)\n   : name{n} {\n  }\n  void buy(std::string\
  \ ordername, double price) {\n    orders.push_back(Order{1, ordername, price});\n\
  \  }\n  void buy(int num, std::string ordername, double price) {\n    orders.push_back(Order{num,\
  \ ordername, price});\n  }\n  double sumPrice() const;\n  double averagePrice()\
  \ const;\n  void print() const;\n};\n```\n\n`lang/mod3/mod3customer.cppm`:\n\n该分区多或少是之前的主模块接口，只有一个区别：\n\
  \n*   作为分区，我们在模块名和冒号之后声明它的名称：`Mod3:Customer`\n\n与主模块接口一样：\n\n*   我们导出（export）这个模块分区：\n\
  \n    ```\n     export module Mod3:Customer;\n    ```\n\n*   我们使用新的文件扩展名 `.cppm`，我们将在稍后讨论\n\
  \n然而，主模块接口是唯一指定模块导出的地方。\n\n```\nexport module Mod3;       // 模块声明\n\nexport import\
  \ :Order;  // 导入导出分区\n```\n\n`lang/mod3/mod3.cppm`:\n\n通过同时导入导出分区（你必须写两个关键字），主模块接口导出了分区\
  \ `Customer` 的接口：\n\n```\nexport import :Customer;  // 导入导出分区\n```\n\n再次注意，分区只是模块的内部实现方面。接口和实现是否在分区中提供并不重要。\n\
  \n因此，对于 `Customer` 成员函数的实现，将声明移动到分区并没有影响。分区不会创建新的作用。\n\n```\nmodule;           \
  \   // 以全局模块片段开始模块单元\n\n#include <iostream>\n#include <vector>\n#include <format>\n\
  \nmodule Mod3;         // Mod3 的实现单元\n\nimport :Order;       // 导入内部分区以使用 Order\n\
  \nvoid Customer::print() const\n{\n  // 打印名字：\n  std::cout << name << \":\\n\";\n\
  \  // 打印订单条目：\n  for (const Order& od : orders) {\n    std::cout << std::format(\"\
  {:3} {:14} {:6.2f} {:6.2f}\\n\",\n                             od.count, od.name,\
  \ od.price, od.count * od.price);             \n  }\n  // 打印总和：\n  std::cout <<\
  \ std::format(\"{:25} ------\\n\", ' ');\n  std::cout << std::format(\"{:25} {:6.2f}\\\
  n\", \"    Sum:\", sumPrice());\n}\n```\n\n`lang/mod3/mod3io.cpp`:\n\n然而，在这个实现单元中有一个区别：由于主模块接口不再导入内部分区\
  \ `:Order`，这个模块必须这样做，因为它使用了类型 `Order`。\n\n对于导入模块的代码，代码内部的分布方式也不重要。我们仍然在全局范围内导出类\
  \ `Customer`：\n\n```cpp\n#include <iostream>\n\nimport Mod3;\n\nint main()\n{\n\
  \  Customer c1{\"Kim\"};\n\n  c1.buy(\"table\", 59.90);\n  c1.buy(4, \"chair\",\
  \ 9.20);\n\n  c1.print();\n  std::cout << \"  Average: \" << c1.averagePrice() <<\
  \ '\\n';\n}\n```\n\n`lang/mod3/testmod3.cpp`:\n\n这个示例展示了你如何定义具有多个（子）接口、内部声明和定义，并使用许多文件来实现它的的大型模块。\n\
  \n*   特定的导出接口可以在接口分区中指定。\n\n\n\n\n\n*   内部声明可以在内部分区中指定。\n*   定义和实现可以在模块实现单元中进行。\n\
  *   你仅提供主模块接口以将所有内容整合在一起并指定导出哪些内容。\n*   它导入并导出所有接口分区\n\n## 21.2.5 模块如何取代传统代码\n\n\
  **===== 本章节/节正在编写中 =====**\n\n## 21.2.6 模块声明/导出详情\n\n**===== 本章节/节正在编写中 =====**\n\
  \n## 21.2.7 模块导入详述\n\n**===== 本章节/节正在编写中 =====**\n\n## 21.2.8 在编译器中处理模块文件\n\n在 C++\
  \ 中，扩展名并不是标准的。在实践中，使用了不同的文件扩展名（通常是 `.cpp` 和 `.hpp`，但也使用了 `.cc`, `.cxx`, `.C`, `.hh`,\
  \ `.hxx`, `.H` 和 `.h`）。\n\n我们对模块也没有标准的扩展名。更糟糕的是，我们甚至对于是否需要新的扩展尚未达成共识。因此，在实践中，模块使用了不同的扩展名：`.cppm`、`.ixx`\
  \ 和 `.cpp`。\n\n有多个原因导致不同的文件扩展名似乎是必要的：\n\n*   编译器需要不同的命令行选项来处理不同类型的模块文件。\n*   类似于头文件，你必须向客户和第三方代码提供\
  \ `some` 模块文件。\n*   不同的模块文件创建不同的产物，你可能需要处理这些产物（例如在删除生成的产物时）。\n\n我个人对于模块文件的扩展名还没有\
  \ `final` 的决定和建议。然而，根据目前的情况，我建议如下：\n\n*   对于**接口文件**（包括主模块接口和接口分区），使用文件扩展名 `.cppm`。原因是：\n\
  \    *   Visual C++ 需要特殊处理，因此你不能使用 `.cpp`。\n    *   它是最好的自解释文件扩展名（远好于此处 Visual C++\
  \ 推荐的 `.ixx`）。\n    *   `clang` 目前需要它。\n    *   对于 `gcc` 它是可以使用的。\n*   对于**内部分区文件**（分区实现文件），使用文件扩展名\
  \ `.cppp`。原因是：\n    *   Visual C++ 需要特殊处理，因此你不能使用 `.cpp`。\n    *   对于 `gcc` 它是可以使用的。\n\
  \    *   `clang` 目前完全不支持这些文件（2021 年 9 月）。\n*   对于**模块实现文件**（但不是 `not` 分区实现文件），使用常用的扩展名，通常是\
  \ `.cpp`。原因是：\n    *   不会生成特殊的产物。\n    *   不需要特殊的命令行选项。\n\n结果，你必须按照如下方式（预）编译模块文件（仅提到了特殊情况）：\n\
  \n*   **Visual C++:**\n    Visual C++ 需要特定的命令行扩展，并且倾向于使用与我建议不同的文件扩展名 `.ixx`。出于这个原因：\n\
  \    *   如下所示编译接口文件 `file.cppm`：\n        ```cpp\n        cl /c /interface /Tp file.cppm\n\
  \        ```\n        `/Tp` 选项指定后续文件为 C++ 代码。`/interface` 选项指定 `all` 后续文件都是接口文件（在同一命令行中同时包含接口和非接口文件可能不起作用）。\n\
  \        如果你使用文件扩展名 `.ixx`，编译器会自动将该文件识别为接口文件。\n    *   如下所示编译内部分区文件 `file.cppp`：\n\
  \        ```cpp\n        cl /c /internalPartition /Tp file.cppp\n        ```\n \
  \       `/Tp` 选项指定后续文件为 C++ 代码。`/internalPartition` 选项指定 `all` 后续文件都是内部分区。\n\n*\
  \   **gcc/g++:**\n    `gcc` 完全不需要任何特殊的扩展扩展名或命令行选项。因此，通过使用特殊的扩展名，我们必须使用命令行选项 `-xc++`\
  \ 来指定文件包含 C++ 代码：\n    *   如下所示编译接口文件 `file.cppm`：\n        ```bash\n        g++\
  \ -c -xc++ file.cppm\n        ```\n    *   如下所示编译内部分区文件 `file.cppp`：\n        ```bash\n\
  \        g++ -c -xc++ file.cppp\n        ```\n\n*   **Clang:**\n    `clang` 目前只支持接口文件。由于提议的扩展名\
  \ `.cppm` 本身就是所需的，使用它应该可以直接工作。\n    然而，你无法使用内部分区文件。\n\n**===== 本章节/节正在编写中 =====**\n\
  \n## 21.3 导出\n\n**===== 本章节/节正在编写中 =====**\n\n## 21.4 导入\n\n**===== 本章节/节正在编写中 =====**\n\
  \n## 21.5 私有模块片段\n\n如果你在主模块接口单元中声明模块，有时可能需要一个*私有模块片段*（private module fragment）。它允许程序员在模块接口单元内部拥有声明和定义，这些内容对任何其他模块或翻译单元都是不可见且不可。使用它的一种方法是不导出类或函数的定义，尽管它的声明已经导出了。\n\
  \n考虑以下模块接口单元：\n\n```cpp\nexport module MyMod;\n\nexport class C;               \
  \  // 类 C 被导出\nexport void print(const C& c);  // print() 被导出\n\nclass C {     \
  \                  // 提供了导出类的详细信息\n private:\n  int value;\n public:\n  void print()\
  \ const;\n};\n\nvoid print(const C& c) {        // 定义\n}\n```\n```cpp\nexport module\
  \ MyMod;\n\nexport class C;                 // 类 C 被导出\nexport void print(const\
  \ C& c);  // print() 被导出\n```\n`export` 只能在引入名称的地方指定一次。详细信息也是导出的。因此，任何翻译单元都可以导入此模块并使用\
  \ `C` 类型的对象：\n\n```cpp\nimport MyMod;\n...\n\nC c;       // OK，类 C 定义已导出\nprint(c);\
  \  // OK，编译器可以使用函数体替换函数调用\n```\n然而，如果你想将定义封装在模块内部，使得导入代码只能看到声明，而你仍然希望在模块保留定义，你必须将定义放在*私有模块片段*中：\n\
  \n```cpp\nexport module MyMod;\n\nexport class C;                 // 声明导出\nexport\
  \ void print(const C& c);  // 声明导出\n\nmodule :private;  // 从此处开始不再隐式导出\n\nclass\
  \ C {                       // 完整类未导出\n private:\n  int value;\n public:\n  void\
  \ print() const;\n};\n\nvoid print(const C& c) {        // 定义未导出\n  c.print();\n\
  }\n```\n*私有模块片段*通过如下声明：\n\n```cpp\nmodule :private;  // 从此处开始不再隐式导出\n```\n它只能出现在主模块接口单元中，且只能出现一次。一旦声明，文件的其余部分就不再隐式导出。在之后使用\
  \ `export` 导出任何内容都是错误。\n\n通过将定义移动到*私有模块片段*，导入代码无法再使用那里的任何定义。它只能使用类 `C` 的前声明（类 `C`\
  \ 是一个*不完整类型*）和 `print()`。\n\n例如，你无法创建 `C` 类型的对象：\n\n```cpp\nimport MyMod;\n...\n\
  \nC c;       // 错误（C 仅声明未定义）\nprint(c);  // OK（编译器可以使用函数体替换函数调用）\n```\n然而，声明足够使用\
  \ `C` 类型的引用和指针了：\n\n```cpp\nimport MyMod;\n...\n\nvoid foo(const C& c) {  // OK\n\
  \  print(c);             // OK\n}\n```\n\n\n\n\n不允许提供既是头又是模块的文件（需要在 `#define` 和\
  \ `#ifdef` 之前使用预处理器语句）。\n\n### 21.8 后记\n\n## 22. 已弃用和移除的特性\n\n某些特性在 C++20 中被弃用或最终被移除。\n\
  \n实现可能仍提供已移除的特性，但你不能依赖此。当你使用已弃用的特性时，实现可能会或不会发出警告。\n\n### 22.1 已弃用和移除的核心语言特性\n\n\
  - `*this` 的隐式捕获已弃用。\n\n### 22.2 已弃用和移除的库特性\n\n#### 22.2.1 已弃用的库特性\n\n以下库特性自 C++17\
  \ 起已弃用，不应再次使用：\n\n- 类型特性的 `is_pod<>`。请改用 `is_trivial<>` 或类似的类型特质。\n\n#### 22.2.2\
  \ 已移除的库特性\n\n- 对于字符串，成员函数 `reverse()``` 不再允许无参数调用，且它不再收缩容量。\n\n- 你不再能向标准输出流写入 UTF-8\
  \ 字符串。\n\n### 22.3 后记\n\n弃用 `is_pod<>` 接受了 Jens Maurer 在 [`wg21.link/p0767r1`](http://wg21.link/p0767r1)\
  \ 中的提案。\n\n## 23 术语表\n\n本术语表提供了书中最重要的非平凡技术术语的简短定义。\n\n### 23.1 A\n\n#### 23.1.1\
  \ 依赖参数的查找 (ADL)\n\n一种允许程序员在某个参数位于其命名空间时，跳过函数命名空间限定的特性。也就是说，函数将在所有传递的参数的命名空间中进行查找。\n\
  \n### 23.2 C\n\n#### 23.2.1 类模板参数推导 (CTAD)\n\n从使用类模板的上下文隐式确定模板参数的过程。它在 C++17 中引入，允许当模板参数可以从构造函数中推导时，跳过指定对象的模板参数。\n\
  \n### 23.3 F\n\n#### 23.3.1 前向引用\n\nC++ 标准用于 *通用引用* 的术语。\n\n#### 23.3.2 完全特化\n\n\
  对（*主*模板的另一种定义，该模板不再依赖于任何模板参数。\n\n#### 23.3.3 函数对象 (functor)\n\n可以当作函数使用的对象。为此，在类中定义了\
  \ `operator()`。所有的 lambda 都是函数对象。\n\n### 23.4 G\n\n#### 23.4.1 glvalue\n\n产生存储值位置的表达式的\
  \ *值类别*（广义局部定位值）。glvalue 可以是 *lvalue* 或 *xvalue*。\n\n### 23.5 I\n\n#### 23.5.1 不完整类型\n\
  \n已声明但定义的类、结构体或无作用域的枚举类型、未知大小的数组、`void`（可选带有 `const` 和/或 `volatile`）或具有不完整元素类型的数组。\n\
  \n### 23.6 L\n\n#### 23.6.1 lvalue\n\n产生不假设为移动的存储值位置的表达式的 *值类别*（即不是 *xvalues* 的\
  \ *glvalues*）。例如：\n\n- 命名的对象（变量）\n- 字符串字面量\n- 返回的 lvalue 引用\n- 函数以及所有对函数的引用\n- 数据成员（除非是\
  \ *rvalues* 的成员）\n\n### 23.7 P\n\n#### 23.7.1 部分特化\n\n对（*主*模板的另一种定义，该模板仍然依赖于一个或多个模板参数。\n\
  \n#### 23.7.2 谓词\n\n检查特定标准是否适用于一个或多个参数的可调用（函数、函数对象或 lambda）。它返回一个布尔值，是只读的，且 *无状态*。\n\
  \n#### 23.7.3 prvalue\n\n执行初始化的表达式的 *值类别*。prvalue 可以被假设指定纯数学值（如 `1` 或 `true`）以及无名的临时对象。例如：\n\
  \n- 除了字符串字面量以外的所有字面量（`42`、`true`、`nullptr` 等）\n- 返回值（未通过引用返回的值\n- 构造函数调的结果\n- Lambda\n\
  - `this`\n\nC++11 之前称为 *rvalue* 的在 C++11 中称为 prvalue。\n\n### 23.8 R\n\n#### 23.8.1\
  \ 资源获取初始化 (RAII)\n\n一种编程模式，将资源使用结束所需的清理工作委托给析构函数，以便当代表资源的对象离开作用域或结束生命周期时，这些工作会自动发生。\n\
  \n#### 23.8.2 常规初始化\n\n一种编程模式，将资源使用结束所需的清理工作委托给析构函数，以便当代表资源的对象离开作用域或结束生命周期时，这些工作会自动发生。\n\
  \n（注：提供的源文本在此处存在大量重复，此处已根据文档质量要求进行合并。）\n\n\n\n\nSTL 是 C++ 标准库的一部分，用于处理容器（数据结构）、算法以及作为“胶胶水”的迭代器。这种方法被应用于第一个\
  \ C++ 标准，其目标是让程序员从各种标准数据结构和算法中获益，而无需自己实现它们。作为泛型代码，当你尝试组合不支持的内容时，仍然会获得编译时错误信息。\n\n\
  ### 23.10 U\n\n#### 23.10.1 通用引用 (universal reference)\n一种可以通用地引用任何对象且不使其 `const`\
  \ 的引用。它还可以延长返回值的生命周期。它声明为模板参数的右值引用（`T&&`）或使用 `auto&&`。\n\n通用引用对于使用 `std::forward<>()`\
  \ 完美转发参数非常有用（出于这个原因，C++ 标准将其命名为**转发引用**/forwarding references），但也用于引用传递的参数或延长临时返回值的生命周期，当将它们设为\
  \ `const` 会产生问题时（在某些视图 中就是如此）。\n\n### 23.11 V\n\n#### 23.11.1 值类别 (value category)\n\
  表达式的分类。传统的值类别 lvalues 和 rvalues 继承自编程语言 C。C++11 引入了替代类别：glvalues（广义左值），其求值结果标识已存储的对象；以及\
  \ prvalues（纯右值），其求值结果初始化对象。额外的类别将 `glvalues` 细分为 lvalues（可定位值）和 xvalues（即将销毁的值/eXpiring\
  \ values）。此外，rvalues\n一种模板化的变量。它允许我们通过将模板参数替换为特定类型或值来定义变量或静态成员。\n\n#### 23.11.3\
  \ 变变模板 (variadic template)\n一种带有任意数量类型或值的模板参数的模板。\n\n### 23.12 X\n\n#### 23.12.1\
  \ xvalue\n表达式的一种值类别，它产生一个存储对象的位置，且该对象可以被认为不再需要。示例包括：\n\n*   用 `std::move()` 标记的值\n\
  *   返回的右值引用\n*   将对象（而非函数）强制转换为右值引用\n*   右值的值数据成员\n\n## Notes\n\n1. 感谢 Peter Dimov\
