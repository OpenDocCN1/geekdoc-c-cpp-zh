  \        while(cin.get()!=’\\n’)  //去掉行的剩余部分，\n        continue ;\n        cout<<\"\
  please␣ input␣a␣ number\"<<endl;\n        continue;\n    }\n    ...  //输入是正确的。做一些有用的事情。\n\
  }\n```\n\n- 在上一个示例中，为什么我们需要区分 `eof` 和 `fail`？当 `fail` 发生时，缓冲区中可能存在无效字符。清理缓冲区后，我可以继续从输入缓冲区读取输入。清理缓冲区中无效字符的三种方法。\n\
  \n```cpp\ncin.clear();   //重要。清除状态和缓冲区\nwhile(cin.get()!=’\\n’)continue ;      //方法\
  \ 1\nwhile(!issapce(cin.get()))continue;  //方法 2\nbasic_istream& ignore(streamsize\
  \ _Count = 1, \\int_type _Delim = traits_type::eof());  //方法 3\ncin.ignore(5, ’a’);\n\
  cin.ignore(numeric_limits<streamsize>::max(), ’\\n’);\n```\n\n- 你可以使用 `istream_iterator`，它可以节省你判断\
  \ `EOF` 的麻烦。\n\n```cpp\nClass A{\nPrivate:\n    Int x,y;\n    Friend istream& operator>>(istream&\
  \ in, A&);\n    Friend ostream& operator<<(ostream& in, const A&);\n};\nistream&\
  \ operator>>(istream& in, A& a){\n    in>>a.x>>a.y;\n    return in;\n}\nOstream&\
  \ operator<<(ostream& out, const A& a){\n    out<<a.x<<a.y;\n    return out;\n}\n\
  istream& operator>>(istream& in, A& a){\n    in>>a.x>>a.y;\n    return in;\n}\n\
  Ostream& operator<<(ostream& out, const A& a){\n    out<<a.x<<a.y;\n    return out;\n\
  }\nvector<A> v;\nfor(istream_iterator<A> it(cin), end; it!=end; ++it)\n    v.push_back(*it);\n\
  ```\n*(注：示例中代码部分在原文中存在不完整或格式问题，此处已根据上下文进行翻译并保持逻辑结构)*\n\n\n\n\n\n```cpp\nchar input[80];int\
  \ i = 0;while( (ch=cin.peek()) != '.' && ch != '\\n')cin.get(input[i++];)input[i]\
  \ = '\\0';\n```\n\n2. `Gcount()` 方法返回上一次非格式化提取方法读取的字符数。这意味着通过 `get()`、`getline()`、`ignore()`\
  \ 或 `read()` 读取的字符，但不包括通过提取操作符读取的字符。\n\n3. `Putback()` 函数将一个字符放回输入缓冲区。\n\n# 第 10\
  \ 章：内存与资源\n\n## 内存管理\nC++ 编程语言在管理执行程序使用的内存时，为用户提供了许多选项。在本章中，我们将探索其中一些常用的选项。我们还将介绍一些旨在减少长期以来困扰\
  \ C++ 项目的内存管理问题的现代技术。\n\n### C++ 程序可用的内存\n现代操作系统通常会预留一段内存用于执行程序，这使得操作系统能够同时管理多个程序的运行。不同的操作系统以不同的方式布局执行程序的内存。然而，这种内存布局通常包含以下四个部分。\n\
  \n* **代码段 (Code)**：程序编译后的可执行指令存储在代码段内存中。在程序执行期间，代码段的内容永远不会改变。同样，在程序的执行过程中，代码段也不会发生变化。\n\
  * **数据段 (Data)**：持久变量和全局变量（如静态局部变量）存储在内存的数据段中。在执行程序的整个生命周期内，数据段中的变量一直存在。然而，除非数据是常量，否则执行程序可以自由更改它们的值。虽然存储在数据段变量中的值在程序执行过程中可能会改变，但在程序执行期间数据段的大小不会改变。这是因为程序的源代码精确地定义了全局和静态局部变量的数量。编译器也可以计算出数据段的确切大小。\n\
  * **堆 (Heap)**：执行程序获取动态内存的区域被称为堆。使用 `new` 运算符从堆获取内存，使用 `delete` 运算符将之前分配的内存返回堆。随着程序使用\
  \ `delete` 和 `new` 分配和释放动态内存，堆的大小在程序执行过程中收缩和扩展。\n* **栈 (Stack)**：函数参数和局部变量始终存储在栈中。函数参数和局部变量在函数返回时消失，在函数被调用时出现。随着各种函数的执行，栈的大小在程序执行过程中也会收缩和增长。\n\
  \n通常，操作系统会限制栈的大小。深度递归会消耗大量的栈空间。例如，考虑一个编写不当的递归函数，它省略了基准情况，从而表现出“无限”递归，这将消耗栈上的所有可用空间。这种情况被称为栈溢出（stack\
  \ overflow）。现代操作系统会终止任何大量栈空间的进程。然而，在某些嵌入式系统中，这种栈溢出可能无法被检测到。通常，堆空间是充足的，操作系统可以使用虚拟内存为执行程序提供比实际内存更多的可用空间。虚拟内存的额外空间来自磁盘驱动器，操作系统根据执行程序的需要将数据从磁盘传输到实际内存。使用虚拟内存的程序运行速度比使用少量虚拟内存的程序慢得多。\n\
  \n### 手动内存管理\n`delete` 和 `new` 频繁引发内存管理问题是逻辑错误来源中最难寻找和修复的。程序员必须严格遵守以下准则：\n\n* 对于你调用的每一个\
  \ `new` 内存，只要分配的内存不再需要，就应该始终有一个关联的 `delete` 调用。这听起来很简单，但何时该使用 `delete` 并不总是很清楚，下面的函数展示了内存泄漏：\n\
  \n```cpp\nvoid calc(int n) { // ...// 执行一些操作\n// ...int *x = new int[n];\n// ...//\
  \ 对 x 执行一些操作\n// ...// 退出函数时没有删除 x 的内存\n}\n```\n如果程序足够次数调用 `calc` 函数，程序最终将耗尽内存。在\
  \ `calc` 函数中，`x` 是局部变量。从这个角度来看，`x` 位于栈上。因此，当用户完成特定的 `calc` 调用时，函数的清理代码会自动释放由变量 `x`\
  \ 帮助的空间。因为所有函数都会自动管理其局部和参数变量的内存。问题在于 `x` 是通过 `new` 分配的，指向堆上的内存而不是栈内存。函数执行时，`x` 所指向的内存没有被自动释放。\n\
  \n* 然后，永远不应该 `delete` 运算符释放未从之前的 `new` 调用中分配的内存。下面的代码片段说明了这样一个例子：\n\n```cpp\nint\
  \ list[10], *x = list; // x 指向 list\n// ...// 执行一些操作 \n// ... delete [] x; // 逻辑错误，尝试释放\
  \ x 的内存\n```\n指针 `x` 所引的空间不是通过 `new` 运算符分配的，因此不应使用 `delete` 运算符尝试释放该内存。当你尝试删除未通过\
  \ `new` 分配的内存时，会导致未定义行为，这证明了逻辑错误。\n\n* `delete` 运算符不能对同一块内存多次释放。这种情况在两个指针引用同一块内存时非常常见。这种指针被称为别名（aliases）。下面的代码片段更好地说明了这种情况：\n\
  \n```cpp\nint *p = new int[10], *y = x; // y 是 x 的别名\n// ...// 对 x 和或 y 执行一些操作\n\
  // ...delete [] x; // 释放 x 的内存\n// ...// 执行其他其他操作\n// ...delete [] y; // 逻辑错误，y\
  \ 的内存已经释放！\n```\n由于指针 `x` 和指针 `y` 指向同一块内存，因此 `x` 和 `y` 是彼此的别名。如果你释放了其中一个引用的内存，另一个内存也被释放，因为它们是同一块内存。\n\
  \n* 当你通过 `delete` 释放之前的内存时，不应再次访问它们。当你尝试访问已删除内存的结果时，会导致未定义行为，这代表了逻辑错误。\n\n\n\n\n\
  ```cpp\nint *list = new int[10]; // ... // Use list, then // ... delete [ ] list;\
  \ // Deallocate list's memory // ... // Sometime later // ... int x = list[2]; //\
  \ Logic error, but sometimes works!\n```\n\n上面的代码段说明了这种情况是如何产生的。出于效率考虑，`delete`\
  \ 算符在不修改内存中内容的情况下，使堆空间变为可用状态。\n\n### 资源管理\n程序员在完成对链表对象的操作后，调用 `clear` 是至关重要的。看以下定义：\n\
  \n```cpp\nvoid x() {\n    IntList1 my_list; // 在此处调用构造函数\n    // 向列表中添加一些数字\n  \
  \  my_list.insert(12);\n    my_list.insert(7);\n    my_list.insert(-14);\n    //\
  \ 打印列表\n    my_list.print();\n} // 哎！忘记调用 my list.clear()！\n```\n\n在上面的代码中，变量 `my_list`\
  \ 是函数 `x` 的局部变量。当函数 `x` 执行结束时，变量 `my_list` 将超出作用范围。在此阶段，栈上分配给名为 `my_list` 的局部 `IntList1`\
  \ 变量的空间会被回收。虽然头部分配的元素空间仍然存在，但程序访问内存的唯一方式是通过 `my_list.head`，但 `my_list` 已经不存在了。这是一个经典的内存泄漏示例。\n\
  \n注意，我们到目前为止设计的类中，除了 `IntList1` 之外，没有出现这个问题。然而，C++ 为类设计者提供了一种方法，可以指定在对象生命周期结束时必须执行的操作。在对象存在之初执行代码的函数被称为析构函数。析构函数是一种在对象停止存在之前立即执行的特殊方法。析构函数的名字可以与其类相同，并带有波浪号\
  \ `~`。此外，析构函数不接受参数。代码 9.2 显示了如何向代码添加析构函数，并加入了之前建议的长度和 `clear` 方法优化。\n\n#### 代码 9.2\n\
  ```cpp\nclass Code9.2 {\n    // 之前的嵌套私有 Node 类\n    struct Node {\n        int data;\
  \ // 列表的数据元素\n        Node *next; // 列表中紧随其后的节点\n        Node(int d); // 构造函数\n\
  \    };\n    Node *head; // 指向列表中的第一个项\n    Node *tail; // 指向列表中的最后一个项\n    int\
  \ len; // 列表中的元素数量\npublic:\n    // 构造函数创建一个初始空列表\n    IntList2();\n    // 回收列表内存的析构函数\n\
  \    ~Code9.2(); // 将 n 插入列表尾。\n    void insert(int n);\n    // 打印整数链表的内容。\n   \
  \ void print() const;\n    // 返回链表的长度。\n    int length() const;\n    // 移除链表中的所有元素。\n\
  \    void clear();\n};\n```\n\n### 结论\n在带你介绍了 C++ 中十个必须掌握的话题后，现在轮到你自己的技能了。对于语言有一点是，无论是英语、法语还是编程语言，熟能生巧。我们在书中教给你们的知识可以类比为学习英语的字母表和一些基础单词。因此，我们建议你多加练习。专注于理解我们为什么要使用某些语句，以及我们想要获得的结果。\n\
  \n去网上下载所有你觉得易于使用的必要应用程序，如果需要付费，就购买它们。当你一切准备就绪后，挑选一个项目并学习。你可以构建自己的自己的小项目，也可以挑选一个已经做好的项目并尝试复制它。如果你在任何地方遇到卡壳，你随时可以回去，查看程序员是如何制作该项目并继续的。但始终要尝试推向自己的极限，在检查之前深深思考。\n\
  \n挑选其他非常好的书籍也会对你大有帮助，让你对 C++ 的某个部分有不同的认识，从而拓宽对它的理解。尽管我们能保证这本书的质量足以让你走上成为 C++ 高手的正确道路，但我们建议你也读读其他关于这种编程语言的书。\n\
  \n此外，你可以考虑学习一种 C++ 之外的语言来与 C++ 并行学习。学习新语言是深入理解 C++ 的有效方法。新语言能让你对通用编程语言有更好的理解。它还能拓宽你解决问题的思维方式，从而引出\
  \ C++ 主语言的特殊性。尽管你可能不会在 C++ 中使用这些新语言的代码，但它们会让你接触到可以转化到 C++ 中的成熟思想。我们建议你与 C++ 一起学习的编程语言是\
  \ `Haskell`。你也可以学习 `Java`，因为它比 C++ 更接近我们的日常英语，你更容易理解。你也可以查看我们关于 Java 的书。\n\n此外，始终尝试与跟潮流。关注现代\
  \ C++ 特性，如 `C++11`、`C++14`、`C++17` 以及标准库中的许多新特性如 `lambdas`，这些很容易掌握的。你需要的是良好的资源和时间，很快就会发现自己精通了它们。正如俗言所说，“千里之行始于足下”，所以现在就开始行动吧，让我们引导你走上正确的道路。\n\
  \n# 信息安全：在浏览互联网时如何保护你的电子数据免受黑客攻击\n\n### 引言\n自诞生以来，计算机技术已经进化到了不可想象的复杂程度。技术的进步和创新推动了信息技术的发展。今天，几乎任何行业或个人都在使用计算机系统和网络。现代\
  \ C++ 特性如 `C++11`、`C++14`、`C++17` 以及标准库中的许多新特性，如 `lambdas`，很容易理解的。你需要良好的资源和时间，在短时间内发现自己精通了它们。正如俗言所说，“千里之行始于足下”，所以现在就开始行动吧，让我们引导你走上正确的道路。\n\
  \n计算机技术自诞生以来已经进化到了不可想象的复杂程度。技术的进步和创新推动了信息技术的发展。今天，几乎任何行业或个人都在使用计算机系统和网络。尽管计算机技术已经飞速发展，但网络安全被定义为：网络攻击变得日益复杂且具有欺骗性，黑客投入了大量的时间、资源和精力来发动攻击。然而，为了保护个人和组织免受此类攻击，各种安全措施被广泛讨论，包括正确使用密码、定期备份、在连接公共网络时保持谨慎等。计算机和网络改变了从制造、运营到财务、配送和客户服务的各个流程。在所有与业务相关的流程中，计算机系统的存在是常见的。技术的进步和互联网的普及为新技术铺平了道路：原本“笨笨”的物体在人类干预下变得“智能”，并具备了收集和传输数据的能力。物联网（IoT）的快速增长也导致了网络安全需求的快速进化。\n\
  \n### 什么是网络安全？\n保护计算机系统或网络免受盗窃或损害等不利影响的计算机硬件、数据或提供的服务，被称为网络安全。网络安全也被称为计算机安全和 IT\
  \ 安全（信息安全）。由于对互联网、计算机和无线网络的依赖迅速增加，网络安全领域多年来快速发展。物联网（IoT）中的智能手机、智能电视等设备也容易受到网络攻击，这带来了许多挑战。由于技术的快速变化和其他因素，网络安全一直在进化。因此，网络安全方法、工具、风险管理方法、技术、最佳实践和培训一直在不断变化。许多组织甚至个人非常重视网络安全，以保护他们宝贵的硬件、数据和服务组织目标。由于数据泄露可能会从许多方面瘫痪企业，网络安全一直是企业的关注焦点。此类泄露往往会导致高度敏感数据的丢失，损害公司的收入、竞争优势、声誉和消费者信任。据估计，一次数据泄露会导致公司损失约\
  \ 360 万美元，使网络安全成为任何企业的首要任务。\n\n### 网络攻击与漏洞\n计算机、硬件、软件或网络的设计、实现、内部控制或操作中的缺陷会导致网络攻击。漏洞列表（CVE）是一个记录此类已知网络威胁的数据库。至少一个活跃的攻击或存在的利用程序被称为可利用漏洞。各种手动和自动工具被用于识别网络攻击漏洞。在计算机和网络方面，攻击主要尝试暴露、禁用、更改、盗取、破坏或获取资产的使用权限。任何试图针对计算机系统、网络、基础设施和个人设备的攻击性动作都可以被称为网络攻击。网络攻击可以由个人或具有恶意的团体实施，使硬件、数据和功能面临风险。根据攻击的性质和威胁，网络攻击可以被分类为网络战或网络恐怖主义。此外，网络攻击还可以由匿名运行的各种社会和国家实施。在网络攻击期间，易受的系统和设备会被入侵，以实现攻击者或攻击者的恶意意图。网络攻击的规模可能从单一计算机、设备、个人或公司到整个国家的设施。\n\
  \n### 信息安全文化\n员工的行为在建立公司网络安全方面起着关键作用。公司文化和实践的改变和改进可以帮助员工有效地实现信息安全。员工有时没有意识到他们公司实现满意网络安全水平努力的重要的一部分。结果是他们的行动有时与公司的网络安全目标不一致。公司应该不断改进其信息安全文化，同时确保员工理解他们需要扮演的角色。这个过程是无止的，是一个变化、评估和维护的持续循环。管理公司信息安全的五个步骤涉及：预评估、战略规划、实施和后评估。预评估带来了对公司当前信息安全的意识；战略规划是提高员工意识的计划；实施涉及通过改进内部沟通、安全意识和培训来促进更好的文化；后评估则是评估规划和实施的效果，并识别任何未解决的问题。\n\
  \n\n\n*   我的生活中有多少比例是由网络驱动的？\n*   我的私人信息中有多少比例是存储在网络上的？\n*   我的公司中有多少比例是通过网络访问的？\n\
  *   我的客户信息中有多少比例是通过网络访问的？\n\n由于对计算机系统存在显著的依赖，忽视贵公司可能面临的网络犯罪风险是极其危险的，并且可能对你、你的业务、你的员工以及你的买家产生不利影响。在缺乏安全感的情况下，贵公司正处于极高的网络攻击风险之中。以下是您需要关注的多种网络安全类型。这可以帮助您为卓越的安全策略奠定良好的基础。\n\
  \n### 1. 关键基础设施安全\n重要基础设施的安全包括现代社会赖以生存的物理物理方法。关键基础设施的常见示例包括：\n\n*   电网\n*   饮用水净化\n\
  *   场所访客灯光\n\n让购物中心、医院等拥有互联网能源网基础设施的设施，使其极易受到网络攻击。对任何关键基础设施承担责任的公司必须进行尽职调查，以发现漏洞并保护其公司免受这些的影响。除了这些关键基础设施的韧性外，保护工作对于我们社会的福祉和安全也至关重要。那些不负责这些关键基础设施，但公司运营部分依赖这些设施的公司，应当通过精确分析对其所依赖的关键基础设施的攻击可能如何影响自己，来制定应急预案。\n\
  \n### 2. 应用安全\n您必须将应用程序保护作为保护您的设备时应采纳的安全方法选择之一。软件安全利用软件和硬件处理来应对外部威胁，这些威胁可能出现在应用程序的开发阶段。应用程序在网络上变得极易被访问，因此在开发阶段采取保护措施已成为该工作中至关重要的一阶段。\n\
  \n应用程序安全的类型：\n*   杀毒程序\n*   防火墙\n*   加密显示：这些有助于防止未经授权的访问。公司还可以检测极易脆弱的特定数据资产，并通过在这些数据集上实施特定的系统安全程序来保护它们。\n\
  \n### 3. 网络安全\n由于网络安全关注的是外部威胁，因此网络安全旨在防止恶意目标对您各自内部网络未经授权的入侵。网络安全通过保护基础设施并限制对其访问来确保内部网络受到保护。为了让您能够更好地管理群组安全监控，安全团队目前使用机器学习来标记异常访客，并及时提醒真实的威胁。网络管理员持续执行策略和程序，以防止对系统的未经授权访问、修改和利用。\n\
  \n网络保护实施的常见示例：\n\n*   额外登录\n*   革命性密码\n*   系统安全\n*   杀毒程序\n*   反间谍软件\n*   加密\n*\
  \   防火墙\n*   监控的互联网访问\n\n\n\n\n## 4. 云安全\n增强网络安全是云技术记录增长的主要原因之一。云保护是一种基于软件程序的保护工具，它可以保护并监控你存储在云端材料中的信息。云服务商不断地开发并利用全新的安全工具，以帮助企业用户更好地保护其信息。\n\
  \n关于云计算，流传广泛的一个误解是它比标准策略更不安全。人们可能会认为，将信息存储在物理媒介以及你控制的服务器上要安全得多。然而，云安全已经证明，控制并不意味着安全，而且可用性比信息的物理位置重要得多。\n\
  \n`Alert's Logic Cloud Security Report` 发现，本地环境计算机客户经历的事件远多于服务提供商环境的客户。报告进一步发现，服务提供商环境的客户平均遭受\
  \ 27.8 次攻击。云计算的安全性与传统的本地数据中心相当，只是节省了维护大型数据设施的时间和成本，而且降低了安全泄露的风险。\n\n## 4. 物联网 (IoT)\
  \ 安全\n物联网涉及了许多非关键以及关键的网络网络物理实体，如家电器、传感器、电视机、Wi-Fi 路由器、打印机和安防摄像头。\n\n根据`Bain & Company\
  \ 的预测`，物联网组合市场在 2021 年将创造约 1.52 万亿美元的价值；这是 2017 年投资的 1.235 万亿美元的两倍多。物联网的数据中心、分析、消费设备、网络、遗留嵌入方法和连接器将是物联网市场的主要工程。物联网解决方案通常处于脆弱状态，并且几乎不提供或没有安全补丁。这为所有用户带来了独特的安全挑战。\n\
  \n## 5. 信息安全\n这指的是保护信息和数据免受盗窃、未经授权的访问、泄露等，以维护用户隐私并防止身份盗。\n\n## 6. 灾难恢复\n这需要准备和策略，使公司能够从网络安全/IT\
  \ 灾难中恢复。这需要风险评估、分析、优先级排序，并准备好灾难响应和恢复方法。这允许组织更快地从灾难中恢复并减少损失。\n\n## 7. 网站安全\n这用于阻止并保护网站免受网络安全风险的影响。不同的网站保护计划计划网站的信息、应用程序、源代码和文件。通常，过去几年网站数据泄露的数量频繁增加，导致身份盗窃、停机、财务损失、声誉和品牌形象损失等。其主要原因一直是网站所有者的一种误解，认为他们的网站受到网站托管提供者的保护。因此，它们容易受到网络攻击。用于网站安全的主要技术和工具包括网站检查和恶意病毒删除、网站防火墙、应用程序安全测试等。\n\
  \n## 8. 端点安全\n这允许组织保护其服务器、移动设备和工作站免受远程和本地网络攻击。由于方法上的产品相互连接，它往往会为威胁和漏洞制造入口点。端点保护通过阻止访问这些入口点的尝试来有效保护设备。文件完整性监控、反恶意软件程序以及杀病毒软件等是被采用的重要方法。\n\
  \n## 网络安全工具类型\n\n### 1. IBM QRadar Advisor 和 Watson\n这无疑是公司使用的最好的保护程序。Watson 使用人工智能\
  \ (AI) 是一个自学习和自演化的电话系统。在机会实际上检测到之前，它就能消除该部分。其运行方式如下：`IBM QRadar` 跟踪位置。它收集信息并与在线、离线和单元内的代码关联。它在事件发生时制定策略进行后续处理；消除机会。这是所有最优秀的网络事件？正在使用的安全计划。\n\
  \n### 2. Wireshark\n它是最受欢迎的社区协议分析器之一。它评估个人工作设备上的漏洞区域。`Wireshark` 可以收集或查看产品上正在运行的信息和活动。可以查看输入和输出的数据包，以及传输过程中所使用的协议。它能够捕获信息并创建一个传统的分析表，有助于协助跟踪。\n\
  \n### 3. Cryptostopper\n它是目前网络上防止商品遭受勒索软件或恶意软件攻击的最佳工具之一。`crypto stopper` 做的是找到加密文档的机器人并删除它们。它创建了一种设计或可能的欺骗方式，让机会在设备上自动附着其上；当它附着上时；`crypto\
  \ stopper` 就会检测并删除该代码。`Cryptostopper` 制造商倾向于提供九秒威胁检测和消除的承诺。它隔离工作站和单元受影响的区域，以便勒索软件无法影响更多区域。\n\
  \n### 4. N MAP\n它是为社区安全创建的无数主要和开源工具之一。`NMAP` 不仅对小网络，大网络也很好。它可以识别产品上的主机和接收者。此外，它还使用操作系统的发行。它能够在瞬间扫描成百上万台设备。\n\
  \n### 5. Burp Suite\n这是另一种网络扫描算法安全程序，允许你浏览在线应用。此特定设备背后的目的是检查和渗透受威胁的方法。它检查可能影响发送者和目标的响应。如果发现威胁，它可以被隔离或消除。\n\
  \n### 6. OpenVAS\n它是 Nessus 的工具，但与 Nessus 和 `Metploit` 有所不同，尽管它被认为是最稳定的。你会发现 OpenVAS\
  \ 有两个主要部分：\n扫描器：它体验漏洞区域并生成汇总报告。\n管理器：它汇总从扫描器获取的请求，并在之后。\n\n### 7. Nessus\n`Nessus`\
  \ 是另一个检查黑客的工具。它通过网络获取的信息检查电脑上的黑客。通常，认为 `Nessus` 扫描 1200 次未经授权的访问。此外它并不假设不同的端口仅设置为\
  \ Web 服务器，端口 `80` 仅设置为 Web 服务器。而且，它是一个开源工具，提供安全补丁中心，进一步有助于提供受影响区域的可行方法。\n\n### 8.\
  \ Metploit Framework\n由位于马诸塞塞波士顿的 `Rapid7` 创建。它被认为是最好的开源框架，用于检查漏洞。它是一个在 `UNIX` 内运行的命令行\
  \ shell，因此所有者有能力根据自己的指南来查看和运行脚本。\n\n\n\n- Aircrack-ng\n- Call Manager\n- MailControl\n\
  \n\n\n\n# 第三章：提升您的安全防护\n\n## 无线网络安全\n因此，人们学习如何保护自己的无线网络至关重要，以确保机密信息不会落入法徒之手。本章将要介绍保护个人无线网络的方法以及如何操作。对于大多数示例，将使用\
  \ `NETGEAR` 路由器。如果用户使用不同的路由器，请记住，某些之处会有所不同。\n\n### 加密\n让我们从讨论基础加密开始。在涉及网络上的数据传输时，加密是将明文转换为杂乱字符混合体的过程。这降低了通过加密网络发送的信息被用于恶意目的的概率。至于关于无线路由器的加密，它是指每当输入正确的登录凭据时，生成一个加密身份验证密钥的过程，从而允许访问网络。简单来说，每当用户登录受保护的路由器时，就会生成一个唯一的密钥，允许访问该互联网连接。\n\
  \n### WPA\nWi-Fi 保护访问（Wi-Fi Protected Access）或 `WPA` 是一种为了取代 `WEP` 安全开发的安全工具。有两种类型：`WPA`\
  \ 和 `WPA2`。区别在于 `WPA2` 是 `WPA` 更更新、更安全的版本。用户随时需要登录无线网络时（无论是在家里还是在学校），他们最可能正在登录一个\
  \ `WPA`/`WPA2` 加密网络。这些安全功能通过检查输入的登录凭据是否准确来工作，如果准确，就会生成一个与该登录唯一的加密身份验证密钥。一旦生成此密钥，它将由相应的网络进行检查，假设登录凭据匹配，即可开始传输数据。现在我们已经了解了\
  \ `WPA` 加密的基础知识，我们将讨论一些可以用来保护个人无线网络的基本步骤。\n\n### 无线路由器登录凭据\n在首次设置无线路由器时，更改默认登录凭据非常重要。大多数个人无线路由器都带有标准的登录用户名和密码，例如：\n\
  - 用户名：`admin`\n- 密码：`password`\n\n黑客知道这些默认登录凭据，这意味着立即更改它们至关重要。使用包含字符（包括大写字母和小写字母）的长密码将为用户提供可靠的安全的安全凭据。\n\
  \n### 服务集标识符\n服务集标识符（`SSID`）是指用于无线网络名称的计算机语言。例如，亚利桑那大学的无线网络被称为“UAWifi”。将个人网络的名称从默认值更改很重要，因为黑客可能会针对具有默认名称的无线网络，认为它的安全性较低。为了进一步提高安全性，可以关闭\
  \ `SSID` 广播。这意味着网络对外部人员不可见。它仍然在那里，如果搜索特定的 `SSID`，就可以找到它。然而，任何扫描网络以进行连接的人都看不到这个隐藏网络。当你有试图尝试访问你个人网络的邻居时，这尤为有用。\n\
  \n### 媒体访问控制\n媒体访问控制（`Media Access Control`）是一组用于识别特定设备的数字。每个设备，无论是计算机、平板电脑还是手机，都有一个唯一的\
  \ `MAC` 地址。为了更好地保护网络，可以将路由器设置为仅允许特定的 `MAC` 地址连接到该网络。通过只允许特定设备连接，这为您的网络增加了另一层安全。虽然这是一个实用的安全功能，但至少需要提到，目前有软件程序允许黑客伪造\
  \ `MAC` 地址，让他们可以假装成你网络上的同一设备。\n\n我们提供的关于保护路由器的最后一个建议是保持个人网络安全最有效的方法：关闭路由器。如果你要去度假，或者只是在一段时间内不使用他们的网络，关闭路由器是避免黑客进入网络的最佳方法。他们无法访问未开启且未传输数据的设备。\n\
  \n## 移动设备安全\n本章将解释移动设备面临的安全风险，以及如何更好地保护你在手机或平板电脑上的数据。\n\n### 安全风险\n移动设备面临有三个主要的安全风险：物理盗窃、网络盗窃和应用程序权限。\n\
  \n#### 物理盗窃\n设备的物理盗窃允许某人访问设备并窥探存储的所有个人信息。那可以是任何内容，从密码、短信、照片、电子邮件等等。\n\n#### 网络盗窃\n\
  这适用于在移动设备上浏览互联网时被盗取或查看的任何数据，无论是在无线网络上还是移动运营商服务上。\n\n#### 应用程序权限\n这可能是移动设备所有者面临的最大安全威胁，原因很简单：人们在下载应用时不会阅读该应用拥有哪些权限。`Business\
  \ Insider` 最近发布的一项研究发现，在 2017 年，90% 的消费者在没有通读的情况下接受了法律条款和条件。这就是安全风险发生的地方。\n\n###\
  \ 基础知识\n下面列出了六种可以更好地保护移动设备安全的方法。这些是：最新的操作系统、应用权限、地理跟踪意识、锁屏、Wi-Fi 或蓝牙安全以及互联网浏览。\n\
  \n#### 操作系统\n操作系统是移动设备的基础，管理所有网络和软件。例如，`Apple` 使用 `iOS`，而 `Android` 使用 `Android\
  \ OS`。保持所有类型移动操作系统的最新更新有助于让移动设备更安全。当这些操作系统的开发者发现安全漏洞时，它们会被修补，并向全球发送更新。这是保护自己免受恶意软件的最简单方法之一。\n\
  \n#### 应用程序\n我们都喜欢应用，无论它们来自 `Apple Store` 还是 `Google Play Store`，但大多数人不知道这些应用通过用户手机可以访问的信息。大多数人在下载新应用时从不去阅读细则。\n\
  \n#### 地理跟踪\n大多数移动设备用户完全不知道他们的位置被探测和存储的频率。在 `Apple Store` 或 `Google Play Store`\
  \ 下载的许多免费应用并非真的。应用程序开发者之间有一种增长的趋势，使用你的手机或平板电脑的 GPS 系统收集位置，这被称为地理跟踪。这些信息被大量收集并被大型实体购买，他们利用这些数据来研究并准确预测消费者行为。广告商一直在寻找新方法来吸引你的注意力，以便你购买他们的产品。如果应用开发者每天收集个人的位置，他或她可以查看并说：“哇，这个人似乎每天都经过这家商店。”然后该应用开发者会将此信息卖给该个人每天经过的那家商店，以便针对该个人投放广告。这些广告可能以电子邮件或垃圾短信的形式出现。\n\
  \n#### 密码\n这是保护手机数据最简单的方法之一。简单的锁屏密码可以防止某人在手机或平板电脑被盗时获得访问。想象一下一个人手机或平板电脑上所有的应用程序、短信、电子邮件和照片。然后想象这些人甚至不需要密码就可以访问所有信息。\n\
  \n#### Wi-Fi 安全\n为了避免黑客看到从用户移动设备发送的信息，用户在使用 Wi-Fi 时需要格外小心。根据律师专业职业责任保险公司（`LAWPRO`）的建议，这里有一些你可以这样做的提示：\n\
  \n\n\n\n\n# 无线网络安全\n\n1. 首先，仅使用已知且受信任的无线网络。如果可能，请完全避免使用公共无线网络。公共网络通常是不安全的，这使得同一网络上的某人很容易截获你发送的信息。\n\
  2. 如果必须使用公共网络，请登录虚拟专用网络（`VPN`）以保护你传输的数据。`VPN` 的工作原理是通过加密隧道发送加密数据，该隧道对于同一网络上的任何人来说都是安全的。\n\
  3. 确保正在使用的网络运行着某种形式的 `WPA` 加密。大多数家庭和公司网络运行 `WPA2` 加密，而公共网络则完全没有安全性。\n4. 如果你连接到一个不是自己的网络，请确保已关闭设备共享设置，以避免未知设备连接到你的设备。这在设备之间建立了一个旨在更易共享数据的链接。然而，这也是黑客连接到用户设备的一种简单方法。\n\
  \n## 蓝牙安全\n\n1. 大多数具备 `Bluetooth` 功能的设备在出厂时都处于未保护模式，也称为“发现模式”。这种模式允许设备被其他设备看到，从而更容易连接。\n\
  2. 如果你不使用 `Bluetooth`，请确保将其关闭，以避免与其他不需要的设备建立连接。在不使用时关闭 `Bluetooth` 可以消除攻击者设备连接到你设备的任何机会。\n\
  3. 如果可能，请更改设备设置，使其在与另一个设备配对之前需要用户确认。这消除了另一个设备秘密连接的可能性。\n4. 不要连接到未知设备。仅与已知且受信任的设备配对。\n\
  5. `Bluetooth` 连接的最大范围可能根据设备本身的功率而异，通过将范围设置为最低，可以降低攻击者触及设备的风险。\n\n## 互联网浏览\n\n1.\
  \ 即使在 iPad 上，互联网浏览仍然可能是危险的。以下是 McAfee 安全建议中心关于在移动设备上上网的几点要做和不要做的建议：\n2. 如果可能，请安装防病毒软件，对设备上下载的任何内容进行扫描。\n\
  3. 始终查看你访问的网页的 `URL`。确保你检查了 `https` 安全功能。\n4. 虚假网站往往会有一些错误，从页面的整体外观到不恰当的语法不等。\n\
  5. 如果你想访问的网站 `URL` 是已知的，直接输入它以避免任何可能的网站虚假副本。\n6. 避免点击广告，因为这些广告可能指向旨在在你设备上安装危险软件的恶意网站。\n\
  \n# 第 4 章：增强物理安全\n\n### 早期检测是改变游戏的关键\n\n由雷神（Raytheon）赞助并波蒙研究所（Ponemon Institute）独立进行的《全球网络安全大趋势研究》，从网络安全前线人员的视角，对未来三年出现的最关键网络威胁趋势提供了新见解。研究调查了全球\
  \ 1,110 多名高级信息技术从业人员。\n\n该研究揭示了专家从业人员对未来三年的关键见解和预测，例如：\n\n* 网络勒索和数据泄露对股东价值的影响将增加。\n\
  * 67% 的人表示，网络勒索（如勒索软件）的频率和赔付金额将增加。\n* 60% 的人预测国家支持的攻击将变得更加糟糕。\n* 只有 41% 的人表示他们的组织能够降低物联网（`IoT`）风险。\n\
  \n网络勒索、国家攻击和针对工业控制系统的攻击频率预计将以双位数增长。\n\n* 19% 的人表示，现在的网络勒索非常频繁，而 42% 的人表示这种威胁在未来三年内将非常频繁。\n\
  * 26% 的人表示，现在的国家攻击非常频繁，而 45% 的人表示这在未来三年内将非常频繁。\n* 40% 的人表示，针对工业控制和监视数据采集（`SCADA`）系统的攻击现在非常频繁，而\
  \ 54% 的人表示这在未来三年内将非常频繁。\n\n不安全的物联网（`IoT`）设备的数据丢失或被盗很可能会发生，这是一个重大的网络安全挑战。\n\n* 82%\
  \ 的人表示，他们的组织极有可能、可能或某种可能发生由不安全的 `IoT` 设备或应用程序导致的数据丢失或被盗。\n* 80% 的人表示，与不安全的 `IoT`\
  \ 设备或应用程序相关的安全事件发生的可能是灾难性的。\n\n总之，雷神和波蒙研究所的《全球网络安全大趋势研究》提供了全球每天一线防御网络攻击者的网络安全从业人员的几项预测。其中，在未来三年内，尽管对网络安全的投入不断增加：\n\
  \n* 网络勒索和数据泄露的频率将大幅增加。这一趋势在很大程度上由复杂的国家支持网络攻击者或组织集团驱动。\n* 特别是 `IoT` 设备非常脆弱，将成为被利用的目标。\n\
  \n所以，网络攻击者何时入侵不是“是否”而是“何时”的问题。当网络攻击者入侵时，他们将保持数月不被发现。网络攻击者保持未被发现的中位数或平均天数根据来源而异。例如：\n\
  \n* Mandiant 的 M-Trends 报告；\n* Verizon 的数据泄露调查报告；\n* IBM 和波蒙研究所的数据泄露成本研究。\n\n\n\n\
  \n\n然而，有一点是肯定的。网络攻击者能够隐藏数月，而且发现网络攻击者的时间越长，组织最终遭受的成本就越高。通过对几十个案例的研究，我在`网络攻击链`（Cyber\
  \ Attack Chain）中识别出了每个组织都应该理解并寻找的信号。在研究这些案例时，很明显，每个案例中，网络攻击者采取的步骤都符合我在`网络攻击链`中概述的某一个步骤。同样清楚的是，在每一步中都有网络攻击者正在工作的信号，但这些信号没有被组织检测到。\n\
  \n现在是每个组织了解什么是`网络攻击信号`（Cyber Attack Signals），并将其作为网络安全计划的一部分实施了。通过这种方式，他们将防御转化为进攻，并及早发现网络攻击者。`网络攻击信号`是一个高概率的信号，表明网络攻击者在执行`网络攻击链`中的某项任务时，正试图隐藏并规避检测。他们的工作是为了实现最终目标——窃取数据或知识产权（`IP`）或其他损害、侵害或破坏。`网络攻击信号`关注的是网络攻击者的行为。我识别了\
  \ 15 种网络攻击信号，每个组织至少应该对这些信号进行监控。这前 15 种信号与网络攻击者的行为有关。它们是及时的信号，发生在网络攻击执行之前，发生在`网络攻击链`的入侵、横向移动或命令控制步骤，因此具有最大的价值。这不是一份详尽的列表，根据组织的风险概况和其`皇冠宝石`（`Crown\
  \ Jewels`），可能还有其他与组织相关的可能指示网络攻击者正在工作的信号。因此，每个组织都应该量定制自己的`网络攻击信号`监控列表。\n\n### 入侵\
  \ (Intrusion)\n**入侵补丁窗口 (IntrusionPatch window)**：这是漏洞未被补丁的时间段，也是攻击者如何利用它，它提供了关于`皇冠宝石`可能受影响的警报、可能的攻击时间线以及预期的攻击者行为。\n\
  \n**Web 壳 (Web shell)**：这是在 Web 服务器上尝试安装或已安装 `web shell` 的行为。它将利用服务器或应用程序的漏洞或配置缺陷来实现入侵。\n\
  \n### 横向移动 (Lateral movement)\n**异常登录 (Abnormal logons)**：这些是与正常登录模式相比的登录异常。\n\n\
  **特权用户行为 (Privileged users’ behavior)**：这些是特权用户（具有更高访问级别能力的的用户）与正常行为相比的行为异常。\n\n\
  **WMI 异常 (WMI anomalies)**：这是使用 `Windows 管理实例`（`WMI`）的异常活动，它是一组系统管理员用于本地和远程管理 Windows\
  \ 系统的工具。\n\n**内部侦察信号 (Internal reconnaissance signals)**：这些是运行在电子邮件、Web 和文件服务器或域控制器或主机上的脚本或批处理脚本的异常，或者是对服务器和端口的扫描。\n\
  \n**恶意软件信号 (Malware signals)**：这些是用户、文件、进程、任务、来源和目的方面正常行为模式的异常，表明初始恶意软件的安装或传播。\n\
  \n**勒索软件信号 (Ransomware signals)**：这是指示初始勒索软件安装或传播的异常活动，例如安装新的 `.dll` 文件或尝试与 `TOR`\
  \ 网站通信（即 `TOR` 网络上的服务器，一种用于在互联网上提供匿名性的服务）。\n\n**恶意 PowerShell (Malicious PowerShell)**：这是使用\
  \ `PowerShell`（一种供系统管理员自动执行任务的脚本语言）的异常活动，例如脚本中添加了奇怪字符（如 `+ ‘$ %`）、异常用户在不常的时间或位置使用\
  \ `powershell.exe`，或包含命令参数的脚本。\n\n**RDP 信号 (RDP signals)**：这些是`远程桌面协议`（`RDP`）的异常，该协议允许用户（例如帮助台人员）使用图形界面连接到网络中的另一台计算机，例如异常的\
  \ `RDP` 用户、源或目的登录。\n\n**SMB 异常 (SMB anomalies)**：这些是`服务器消息块`（`SMB`）的异常，它是 Microsoft\
  \ Windows 中的一种协议，允许在网络中远程管理文件、文件共享、打印和目录共享等功能。\n\n**异常日志行为 (Unusual logs behavior)**：这些是事件日志中的异常，例如事件日志被删除、停止或清除，带有详细信息（用户详情、日期、时间、日志类型、执行的命令、受影响的资产、源和目的）。\n\
  \n### 命令与控制 (Command and control)\n**C&C 通信 (C&C communications)**：这是指示尝试与命令控制（`C&C`）服务器进行通信或已与其通信的异常活动，例如请求异常域名名称或一次性域名名称、将数字\
  \ IP 地址作为主机的域名请求、以特定频率（每小时、每天或其他）向某些 IP 地址或主机请求。\n\n**ICMP 包 (ICMP packets)**：这些是`互联网控制消息协议`（`ICMP`）包的异常，例如异常的大小、频率、源或目的。\n\
  \n**隐藏隧道 (Hidden tunnels)**：这些是与正常基准模式相比的 `HTTP`、`HTTPS` 或 `DNS` 流量的异常，表明使用旨在与正常流量混合的隧道与\
  \ `C&C` 服务器通信。\n\n## 第 5 章：保护你的小企业\n\n### 计算机与网络安全 (Computer and Network Security)\n\
  随着互联网在过去十年中的发展，黑客也在进化。由于计算机网络的不断增长，网络安全已成为公司考虑的最因素之一。像 `Microsoft` 这样的大公司不断设计和构建软件产品，需要防止受到黑客和外国攻击者的攻击，因为这些人将在得到他们想要的东西之前不择手段。\n\
  \n一个个人的网络安全性越高，黑客访问其数据和文件的机会就越小。网络安全是采取措施防止通过网络传输的信息被未经授权的访问、误用或修改的过程。换句话说，网络安全意味着任何访问私有网络的计算机都受到不受任何形式的网络盗取或操纵的保护。\n\
  \n网络安全是指保护任何访问私有网络的计算机免受任何形式的网络盗取或操纵。\n\n#### 网络安全 (Network security)\n三种方法可以更好地保护网络：入侵检测系统、`WPA/WPA2`\
  \ 以及安全套层（`SSL`）。\n\n**入侵检测系统 (Intrusion Detection Systems)**：这些系统是旨在保护网络的程序，旨在监控服务器并检测跨越这些服务器的恶意程序。第一种\
  \ `IDS` 被称为主动 `IDS`，它不仅监控服务器通道，还能阻止并移除检测到的任何恶意程序。第二种 `IDS` 保护性较弱，它只监控服务器通道，并在发现威胁时提醒用户。\n\
  \n**无线保护访问 (Wireless Protected Access)**：无线保护访问，也称为 `WPA`，是一种网络加密。有两种类型的系统：`WPA`\
  \ 和 `WPA2`。两者都比旧路由器上的 `WEP` 安全更安全。这些安全功能之所以有用，是因为它们能让攻击者进入网络变得更加困难。`WPA2` 提供了更高、更复杂的安全，通过使用不同的网络设置。\n\
  \n**安全套接层 (Security Sockets Layer)**：安全套接层（`SSL`）是由加密提供的一种网络保护。其目的是加密通过网络发送的任何数据，以防止他人看到。`SSL`\
  \ 对于任何进入网站的人非常重要。它们通过网站证书来验证真实性。当你连接到网站时，服务器运行其证书以验证真实性。网站通过 `https` 只能获取这些证书以防止任何人进入网站。\n\
  \n**计算机安全 (Computer security)**：另一方面，计算机安全是对存储在计算机上的数据进行保护。这包括采取措施防止攻击，也称为 `CIA`（机密性、完整性和可用性）。几种基本方法属于计算机安全，并将涵盖了软件更新、防火墙、杀病毒程序、电子邮件加密和数据备份。\n\
  \n**良好的密码 (Having a good password)**：良好的密码由三个品质：长度、使用的字符以及大写和小写字母的组合。密码越长越难以破解。一些黑客尝试使用发送大量组合的算法。通过增加密码的长度，被破解的机会就会降低。大写和小写字母和符号的混合（如叹号）有助于保护你的密码不被盗取。像\
  \ `password1` 这样的密码非常脆弱。另一种你可以用来创建极其安全密码的方法是使用如 `LastPass` 或 `Password Boss` 的程序。这些程序随机创建极其安全的密码。\n\
  \n**软件更新 (Software updates)**：软件更新非常重要，因为它们保护你的计算机或移动设备。软件更新用于修复操作系统发现的漏洞或错误，这将使你的设备更安全。经常检查操作系统以查看是否有新更新。\n\
  \n**防火墙 (Firewalls)**：防火墙是计算机的很好的保护，因为它们防止意外数据进入你的计算机。它们监控流入流量，并检查计算机接收的信息是否有害。例如，每当用户从网站下载内容时，防火墙都会扫描该文件并判断其是否恶意。并非所有的防火墙都是相同的。大多数操作系统都带有防火墙，因此没有必要安装额外的防火墙。此外，这些操作系统公司不断更新其安全功能使其更加可靠。防火墙防止对私有网络的未经授权访问。\n\
  \n**杀病毒软件 (Antivirus software)**：处理恶意软件的最有效且常见的方法之一是杀病毒软件。如 `Windows Essentials`、`McAfee`\
  \ 和 `Bitdefender` 等程序允许用户对系统进行扫描以寻找受感染的文件。如果发现任何文件已损坏，这些程序会提醒操作员，允许其移除相关文件。这种软件也非常有用，因为可以在允许用户下载之前扫描任何下载项或电子邮件附件。这是一个至关重要的保护屏障，因为它防止任何恶意程序安装在设备上。这些类型的软件还可以分析是什么种病毒、蠕虫或\
  \ `Trojan` 感染了计算机。这种保护软件会自动从计算机中移除任何恶意内容，但无法识别勒索软件或键盘记录器。\n\n**广告拦截器 (Ad blockers)**：大多数浏览器都有可以添加到浏览器的扩展，可以拦截讨厌的广告。例如，`Google\
  \ Chrome` 网上商店有各种用户在使用浏览器时下载和运行的附加扩展（并非都是广告拦截器）。`Chrome` 有专门为 `Chrome` 浏览器制作的广告拦截器，限制了你在访问网站时弹出广告的数量。广告拦截器也可以直接下载到计算机硬盘上，而不是通过网络浏览器。\n\
  \n**电子邮件加密 (Email encryption)**：加密通过使电子邮件内容对预期接收者之外的实体不可读来保护电子邮件。如 `Gmail` 等流行的电子邮件服务已在其网络中添加了电子邮件加密。然而，除非用户实施加密，否则它只保护在其他网络上传输时仍然易受攻击的数据。大多数实现此的方法需要与每个人交换的复杂过程。幸运的是，有一种名为\
  \ `Virtru` 的替代方案也适用于 `Gmail` 账户。\n\n**数据备份 (Data backups)**：数据备份是一个重要但被忽视的安全方面。通过对计算机上的所有重要数据进行定期备份，用户可以保护自己免受崩溃或病毒的风险。任何未备份的数据在硬件故障或数据损坏时可能完全丢失。\n\
  \n**安全失效 (Failed security)**：如果安全类型失效，可能会面临什么风险？黑客可能尝试窃取的信息被分为两类：个人和财务。关于个人信息，黑客可以使用它创建虚假的社交媒体帐户，或者。对于财务，攻击者会继续索要更多钱。根据\
  \ `LifeLock` 的数据，2017 年有 700 万人受害，导致了 80 亿美元损失。2016 年有 1500 万人受害，导致了 120 亿美元损失。在过去的几年中，遭受身份窃取的人增加了\
  \ 600 万。对于财务信息，这种安全失效一直源于不断增加的。黑客可以使用它进行在线购物，或者扩展到其他机器。这种类型最主要的特征之一允许恶意软件以一种保护的方式将所有信息从受害者传输给攻击者，这样你甚至意识不到自己正被监视。\n\
  \n**病毒 (Viruses)**：病毒将自己推入设备并成为另一个计算机程序的一部分。它可以在计算机之间传播，并在途中留下感染。\n\n**蠕虫 (Worms)**：类似于病毒，蠕虫自我复制，但它们不需要主机程序或人类来传播。蠕虫利用目标系统的漏洞或利用社交工程欺骗用户执行程序。\n\
  \n## 第 7 章：网络攻击 (Cyber attacks)\n\n### Web 攻击 (Web Attacks)\n**SQL 注入 (SQL Injection)**：`SQL`\
  \ 注入也称为 `SQLI`。`SQL` 是一种特定的攻击，使用恶意代码操纵后端数据库以获取不需要的数据。`SQLI` 可以对业务造成破坏性影响。有效的 `SQLI`\
  \ 攻击可能导致完整表、用户列表和地址被删除。尽管 `SQLI` 可用于任何数据库，但我们必须考虑客户信任的丢失。\n\n**跨站脚本 (Cross-Site\
  \ Scripting)**：跨站脚本（缩写为 `XSS`）是一种注入漏洞，犯罪分子将恶意代码传输到来自受信任网站的内容中。此类事件发生在不确定的源允许附加 `HTML`、`Flash`\
  \ 和 `Ajax` 等各种语言的脚本。跨站脚本攻击可能是极破坏性的；尽管如此，处理它们相对简单。\n\n**分布式拒绝服务攻击 (Distributed Denial-of-Service\
  \ (DDoS) Attack)**：拒绝服务（`DDoS`）的目标是关闭服务或网络，使用预期用户无法访问。攻击者通过向受害者泛入流量或其他数据来实现目标。`DDoS`\
  \ 攻击的目标通常是政府机构、媒体公司和银行的 Web 服务器。尽管此类攻击没有导致盗窃，但它们可能会花费时间和金钱。\n\n**密码攻击 (Password\
  \ Attack)**：密码攻击是获取或破解用户具有恶意意图的密码的尝试。不同的技术包括字典攻击、密码嗅探器和破解程序。尽管有一些针对此类攻击的防御机制，但通常的方法是使用密码策略，包括最小长度、扭曲单词和频繁更改。\n\
  \n**窃听攻击 (Eavesdropping Attack)**：这些攻击从流量的干扰开始。窃听的另一个术语是 `sniffing` 或 `snooping`。这是一种安全攻击，攻击者试图窃取计算机发送或接收的数据。窃听攻击很难检测，因为它们导致了异常传输。窃听攻击针对服务器和接收者之间的传输。\n\
  \n## 第 6 章：恶意软件 (CHAPTER 6: Malware)\n想象一种场景，客户呈现文件，并且不确定其是否恶意。这种恶意软件位于杀伤链的什么位置？\n\
  \n恶意软件是一个非常大的类别，其中有一些子类：\n\n**勒索软件 (Ransomware)**：这种恶意软件旨在冻结文件并正如名称所示，向受害者索要赎金以释放数据；成功的攻击者意识到他们可以通过索要更多钱来进一步。一旦支付，循环就会继续。\n\
  \n**广告软件 (Adware)**：这是一种下载、收集并显示意外广告或数据的软件，并将搜索重定向到某些网站。\n\n**机器人 (Bots)**：机器人是接管系统的自动脚本。你的计算机被用作“僵尸”执行在线攻击。大多数时候，你并不知道你的计算机正在执行这些攻击。\n\
  \n**根基工具 (Rootkits)**：当系统被入侵时，根基工具旨在隐藏你拥有恶意软件的事实。它们通过模仿正常文件让恶意软件在公开运行。\n\n**间谍软件\
  \ (Spyware)**：间谍软件在目标者不知情的情况下从硬盘传输数据。\n\n** 远程访问工具 (Remote Access Tool (RAT))**：在你的系统被入侵后，`RAT`\
  \ 帮助攻击者留在你的系统和网络中。`RAT` 帮助犯罪分子获取击键、使用相机拍照并/或扩展到其他机器。这种类型最主要的特征之一允许恶意软件以一种保护的方式将所有信息从受害者传输给攻击者，这样你甚至意识不到自己正被监视。\n\
  \n**病毒 (Viruses)**：病毒将自己推入设备并成为另一个计算机程序的一部分。它可以在计算机之间传播，并在途中留下感染。\n\n**蠕虫 (Worms)**：类似于病毒，蠕虫自我复制，但它们不需要主机程序或人类来传播。蠕虫利用目标系统的漏洞或利用社交工程欺骗用户执行程序。\n\
  \n\n\n\n\n*   黑客行为并非一夜之间出现的现象。它以各种形式存在，并从 20 世纪 60 年代一直演变至今。然而，最初从未被视为犯罪活动来处理。我们将通过一些案例来近距离观察某些攻击，以及逐渐改变这一局势的通用示例。\n\
  \n*   访问你没有权限使用的的服务或资源。这通常被称为盗取用户名和密码。在某些情况下，未经许可获取这些信息被视为一种网络犯罪，即使你并不使用它们，或者将其作为朋友或家庭成员的账户。\n\
  \n*   存在一种被称为“网络入侵”的数字犯罪，这也被视为网络犯罪。从本质上说，与普通犯罪一样，这意味着你在未经许可的情况下进入了某个地方（在这种情况下是访问系统）。因此，如果有人未经许可访问了某个系统或一组系统，我们可以说该人员违反了网络，从而实施了网络犯罪。然而，某些网络入侵可以在不使用黑客工具的情况下发生。有时未经事先许可登录游客账户也可以被视为网络犯罪。\n\
  \n*   黑客行为最复杂但也简单的形式之一是针对系统中最脆弱的元素——人。这种网络犯罪被称为“社会工程学”，我们之所以说它简单，因为人比系统的任何其他部分都更容易接触，也更容易对付。然而，人们可能会提供难以理解的线索，无论是口头的还是无意的，这使得黑客难以获取他们所需的信息。\n\
  \n*   发布或发送非法材料的问题通常已变得难以处理，尤其是在过去的十年里。社交媒体引起了大量关注，许多其他互联网服务的使用率和普及程度不断增加。这使得许多非法材料能够在最短时间内从一个地方移动到另一个地方，使其能够迅速传播。\n\
  \n*   欺诈也很常见，特别是在互联网上，也被视为网络犯罪。与原始术语一样，网络空间中的欺诈也意味着一方或双方通常为了财务利益或损害而被误导。\n\n## 什么是伦理黑客？\n\
  \n我们在本章之前提到的所有内容都是泛泛的黑客。然而，真正的目标是学习如何成为一名伦理黑客，并探索你应该具备的技能。伦理黑客通常受组织雇佣来测试其安全性。他们通常通过直接雇佣或临时合同工作。关键在于他们使用与其他所有黑客相同的技能，但有一个巨大的区别：他们被允许直接从系统所有者处发起攻击。此外，伦理黑客意味着你仅向所有者透露你评估过的系统漏洞（因为世界上每个系统都有漏洞），而不告诉其他人。此外，雇佣伦理黑客的组织或个人使用非常严格的合同，规定系统的哪些部分是被授权攻击的，哪些部分是被禁止的。伦理黑客的角色还取决于他所在的职位，即雇主的需求。今天，有些组织拥有常职员工团队，他们的工作是进行伦理黑客活动。\n\
  \n黑客可以分为 5 类。请记住这种格式可能会有所变化，但我们可以说这些是最常见的：\n\n*   第一类也被称为“脚本小子”（Script Kiddies）。这些黑客通常没有接受过训练，或者接受过但非常有限。他们只知道如何使用一些基础的黑客工具和技术，由于他们能力不足，有时可能无法完全理解自己的活动或其工作的后果。\n\
  \n*   第二类涉及被称为“白帽黑客”的人员。他们攻击计算机系统，但他们是好人，这意味着他们不会破坏自己的工作。这类黑客通常是伦理黑客，但也可以是渗透测试员（pentesters）。\n\
  \n*   “灰帽黑客”是第三类黑客。正如他们的名字所示，他们介于好坏之间，但最终的决定是选择正确的一方。尽管如此，这类黑客因为可能引起怀疑，而挣扎于赢得信任。\n\
  \n*   我们在本节中提到的第四类被称为“黑帽黑客”。这一类指的是我们在本章之前提到的黑客。这些人通常在法律的“另一侧”工作，并且通常与犯罪活动有关。\n\n\
  *   最后但同样重要的是“自杀型黑客”（Suicide hackers）。他们之所以被称为这样是因为他们的目标是证明观点，这就是为什么他们想要消灭目标。这些黑客不需要担心被发现，因为他们的目标不是隐藏，而是证明，所以他们更容易被发现。\n\
  \n## 伦理黑客的责任\n\n伦理黑客应该学习并永远不要忘记的最重要的事情是，对任何类型的系统攻击都应该获得许可。作为伦理黑客，你必须在每个任务中执行的伦理规范规定，如果你不拥有某个网络或系统，或者没有许可，就不应该对其进行测试或将其作为目标。否则，你可能会被判定犯了期间发生的多种罪。首先，这会损害你的职业生涯；其次，如果是非常严重的事情，甚至可能威胁到你的自由。\n\
  \n*明智的做法是在测试或攻击所需目标时，立即从雇主那里获得一份合同。合同是书面授权，但你应该记住，你只应该检查合同中指定的系统部分。因此，如果你的雇主想要授权你攻击系统的其他部分或取消某些部分的授权，他应该先修改合同，在你获得新许可之前你不应该继续工作。请注意，区分伦理黑客和网络犯罪分子的唯一区别就是合同。因此，你应该特别关注与隐私和机密性问题相关的词汇，因为你经常会遇到客户的隐私信息。\n\
  \n\n\n\n-   黑帽通常在法律之外活动，这意味着他们没有获得所谓“客户”的许可来对其活动表示同意。\n\n-   相反，白帽拥有被称为“客户”的人员的许可和授权，他们甚至会将获取的信息仅保留在客户与白帽之间。另一方面，灰帽则会进入这两个领域，并在不同时期使用两种类型的行动。黑行动者（Hacktivists）是我们之前未提到过的一类黑客。他们属于一个名为\
  \ `Hacktivism` 的运动，这指的是黑客通过推动特定的政治议程来影响公众的行动。到为止，黑行动主义者已涉及机构、大公司和政府。\n\n## 黑客伦理与行为准则\n\
  \n与其他任何其他职业一样，黑客也有其行为准则，该准则建立了规则，可以帮助客户（个人或组织）评估与其网络和计算机系统交互的人员通常是否可靠。实施该准则的组织已经确定，被称为\
  \ `EC Council`。从 `EC Council` 获取 `CEH` 认证意味着你完全理解了必须满足的预期。我们提供了该准则的部分内容，请务必阅读并熟悉它们。\n\
  \n-   你在专业工作期间获得的信息应保持保密和隐私（特别是个人信息）。\n\n-   除非获得客户的许可，否则你不能提供、传输或出售客户的家庭地址、姓名或其他身份识别信息。\n\
  \n-   你必须通过使用自己获取的技能来保护自己和他人的知识产权，以便所有利益都归原始创作者所有。\n\n-   务必向授权人员披露你怀疑可能来自互联网社区、电子交易或其他硬件和软件指标的任何危险因素。\n\
  \n-   确保你提供的服务在你的专业知识范围内，以便你在诚实工作的同时，意识到由于你的教育或经验可能导致的任何局限性。\n\n-   你只能从事你胜任的项目，并执行与你的培训、教育和工作经验技能相匹配的任务。\n\
  \n-   你绝不能故意使用非法获得或以不道德方式存储的软件。\n\n-   你不能参与可能被视为误导性的财务行为，例如双重收费、贿赂等。\n\n-   确保你妥善使用客户的财产，不要超出合同设置的限制。\n\
  \n-   你必须向所有相关方披露潜在的利益冲突，特别是当该冲突无法避免时。\n\n-   确保你管理你正在工作的整个项目，包括推广和风险披露活动。\n\n\n\
  \n\n# 第 10 章：网络安全中的常见错误\n\n信息和数据泄露不会导致业务终结，但对业务来说也不是一个好迹象。研究和调查表明，组织网络的数据泄露会导致 1540\
  \ 万美元的损失，且这一金额每年都在增加。人们不想因为系统的某些问题或漏洞而失去金钱，不是吗？事实上，企业和组织不能犯错。这些错误可能导致数据丢失，但大型组织不可避免会犯此类错误。组织必须做是从这些错误中学习。你不能仅仅因为结果在某一点发生了变化，就期望你的组织反复相同的事情。本章涵盖了组织会犯的不同错误。在此时，你必须保护你的组织免受此类错误。\n\
  \n## 未能数据映射\n每个组织都必须关注数据如何流动以及流向何处。应该查看数据存储在哪里。记住，数据是公司的命脉。只有当你评估并识别了数据流时，你才能看出哪里必须受到保护。你必须知道数据是否流出了你的组织，以及与谁共享。当你拥有可见性时，你就会知道黑客可以攻击哪些终端。你也会知道在哪里可以捕获黑客。\n\
  \n## 忽视安全测试\n漏洞会存在于数据库、系统、应用程序和网络中。这些漏洞现在扩展到了各种设备，如`IoT`（物联网）和智能手机。组织必须定期测试这些设备和连接以扫描任何漏洞。你也可以进行一些渗透测试来了解漏洞。记住，你无法猜到漏洞，只有在测试时你才能发现它们。\n\
  \n## 关注错误的方面\n诚然，预防并非过时。随着技术的进步，针对技术的威胁也随之增加。记住，黑客会找到进入边界的方法。如果你有一位不知道自己在做什么的员工，防火墙并不总是能保护好你的系统。一旦黑客进入系统，他就可以获取特权信息。他还可以伪装成组织的员工。黑客可以规避任何安全扫描很长时间。如果你有更好的可见性，就可以发现黑客并减少数据泄露的概率。\n\
  \n## 忘记基础知识\n通常，你可以利用一些简单的方法来克服对系统的威胁。你必须培训所有员工。帮助他们理解必须使用什么种类型的密码。他们也必须执行正确的操作。只有这样发生，你才能妥善地维护网络组件并最大限度地减少数据丢失的风险。你还可以寻找配置数据的方法以充分防止任何更改。\n\
  \n## 避免培训\n记住培训你的员工，让他们知道必须做什么来防止任何攻击。最常见的黑客形式是社会工程攻击。黑客会从恶意源发送信息并掩盖信息使其看起来合法。然后他可以使用员工录入网站的信息，并攻击系统和网络的配置。确保培训你的员工如何保护他们的系统以及如何识别社会工程攻击。\n\
  \n## 安全监控\n大多数企业由于缺乏预算，无法建立安全运营中心（SOC）或卓越中心。这并不意味着你不能监控系统和网络安全。你必须调查网络并寻找任何威胁或漏洞。你可以使用这些方法来减少攻击对数据和安全的影响。\n\
  \n## 避免供应商风险评估\n如前所述，你知道供应商风险是许多数据泄露的原因。黑客可以通过供应商的应用程序或网络进入组织系统。因此，你必须有一个计划帮助你评估第三方系统的风险。你也可以阅读他们共享的关于系统的报告，以更多关于他们安全的了解。\n\
  \n## 忽视影子 IT（Shadow IT）\n记住，任何网络的终端通常连接到其他网络，这使得很难控制通过网络传输的数据流。大多数员工从他们的笔记本电脑和桌面电脑访问影子设备和应用程序。大多数组织的\
  \ IT 部门不支持此类应用程序的使用。如果你不知道如何停止它，就必须找到隐藏它的方法。你可以阻止这些应用程序和网站。\n\n## 不仅关于恶意软件\n大多数黑客使用恶意软件在系统或网络中建立足点。一旦他们进入网络或系统，他们将使用不同的策略来执行攻击并在你的网络中移动。因此，你需要找到以合规的方式进入系统并执行攻击以检测任何漏洞。\n\
  \n## 泄露不会发生\n这是大多数公司犯下的最大错误之一。某些组织不保护他们的业务和网络，因为他们认为网络犯罪分子会留情面。这永远不会发生。网络犯罪分子会攻击任何公司，无论规模大小。你必须准备好防御并识别对攻击的响应。这将帮助你在灾难真的来临时减少损失并对任何威胁做出更快反应。\n\
  \n## 忘记管理\n你必须理解安全必须随时间推移而成熟，这是信息安全专业人员的首要目标之一。在业务达到高成熟度的某些情况下，安全是组织文化的一部分。在调查任何攻击或系统之前，你必须获得管理层的许可和批准。\n\
  \n## 自行其\n无论你是拥有一家小企业，还是缺乏安全技能的大型组织的一部分，都必须找人帮助你测试网络和系统。聘请一名道德黑客来测试网络和系统。你也可以与安全服务提供商合作。或者，你可以与管理层沟通并聘请合适的专业人士，或者你可以培训公司里的员工。如果你想提高组织系统和网络的安全性，就必须避免犯这些错误。\n\
  \n## 保持组织安全的提示\n在本章中，我们将查看一些帮助你保护组织免受受害的提示。与 IT 专业人员和业务中的其他利益相关者交流，以更多关于你可以如何防止任何网络攻击。\n\
  \n## 创建信息安全策略\n每家业务都必须有一个定义清晰的安全策略。该策略应该提供组织内每个员工必须遵循的流程和操作。你必须执行此策略并培训员工执行正确的操作。记住在你的信息安全策略中包含以下：\n\
  \n* 加密最佳实践\n* 密码要求\n* 设备使用\n* 电子邮件访问\n\n\n\n\n\n你必须频繁更新此政策，并让组织中的每位员工都了解政策所做的更改。\n\
  \n### 员工教育\n这是一个非常需要考虑的方面。如果你有一项安全政策，但你的员工并不知道他们必须做什么，那么这样做就是徒劳无功。帮助你的员工理解他们必须执行的不同协议。你需要进行培训，并让人们知道他们必须做什么。这是保护数据最简单的方法之一。\n\
  \n### 使用安全密码\n记住，密码对于维护网络安全至关重要。指示你的员工选择黑客难以破解的密码。你必须避免在密码中使用日期和姓名，因为黑客可以轻易将你与这些词联系起来。你还必须指示他们定期更改密码。你还可以使用多因素身份验证系统为账户增加额外的保护。\n\
  \n### 确保软件已更新\n如果你的系统里运行着过时的软件，可能会导致安全风险。你应该始终使用最新的补丁更新软件。例如，如果你使用`Windows Operating\
  \ System`，你必须允许更新运行，以便涵盖任何漏洞或缺口。\n\n### 保护网络\n你必须使用防火墙来保护系统使用的网络。确保使用加密技术，增加黑客或其他用户访问数据的难度。在使用`Wi-Fi`时必须小心，因为大多数黑客都针对这些连接。让员工知道他们不应该使用公共`Wi-Fi`。让他们使用`VPN`连接来确保数据传输的安全。确保使用强密码保护路由器。\n\
  \n### 备份数据\n无论你多警惕，黑客都可以选择针对你的系统或网络。在发生此类攻击时，将数据存储在磁盘上。让系统将数据存储在安全的地方。你还可以将数据存储在单独的数据中心。\n\
  \n### 控制访问\n你必须确保对员工使用的设备也也保持某些控制。员工必须对屏幕上的信息小心，绝不要离开未锁定的屏幕。如果他们离开工作站或桌面一分钟，必须注销该系统。由于任何人都可以带走笔记本电脑，应该告诉员工永远不要让无人看管。由于越来越多的业务在平板电脑和智能手机上进行，黑客针对这些设备。员工必须保护手机上的数据，并使用密码保护手机。他们必须及时报告设备的丢失或被盗。\n\
  \n### 网络安全培训\n组织始终可以通过培训员工来降低网络攻击的风险。他们为员工可以使用`Target Solutions Cybersecurity Training`。这些培训材料将提供动态课程，检查用户对网络安全的知识。\n\
  \n# 第 11 章：网络安全的经济影响\n\n## 网络安全业务\n资助更高水平的网络安全是高管必须解决的业务问题之一。中小型企业的运营利润率通常非常薄。因此，确保每一分网络安全资金都花得明智至关重要。这样做不仅会在安全上留下漏洞，而且过度支出还会破坏成本上的竞争优势。在分配资金时，决定哪些网络安全支出被视为销售成本，而哪些被视为提高利润和赢得市场份额的投资，是非常重要的。这与高管在几十年前计算机和互联网兴起时面临的相同问题：“这些新玩意儿应该被视为支出还是投资？”我们认为它既是支出也是投资，并将帮助你理解这两个观点。\n\
  \n对于小公司的忙碌领导者来说，要确定风险管理计划的优先级非常困难。他们希望直接跳到购买网络安全解决方案的部分，并尽快回到业务运营中。对于一家小公司来说，当客户等待服务时，花时间思考战略似乎是浪费时间。但事实完全并非如此，我们也理解当一切都是如此具有技术性时，考虑网络安全可能是令人敬畏的。我们使用`strategy`（战略）和`tactical`（战术）这两个术语来识别那些你需要关注的领域，以及哪些领域可以考虑委托或外包。\n\
  \n在我们深入解释你所角色的逐步说明之前，让我们看看高管参与的若干贡献和收益。这些功能大部分是不外外包，因为它们需要高层管理人员才具备的知识和权威。这并不意味着你不能使用工具和顾问来帮助自己；这意味着你不能放弃对它们的责任。\n\
  \n*   **阐述并控制方向。** 目标设定从顶层开始并反映业务需求。目标和目的为战术规划提供了背景，向多元化的专家战术顾问团队清晰地传达这些目标，可以保持每个人的专注并在同一频道上。\n\
  *   **分配预算。** 业务所有理解网络安全措施将花费时间和金钱，作为高管，决定资金的去向是你的责任。你的`IT guru`建议使用新的`firewall`。然后你的保险代理人建议增加网络保险保单。如果你两个都买（你应该两个都买），你如何在所有可能的解决方案之间分配有限的预算？如果将网络安全仅仅降为简单的战术\
  \ IT 问题，你将拥有一个完美的防火墙，但当黑客绕过它时，你没有任何保护。\n*   **授权公司级政策。** 无论是执行自带设备设备（BYOD）政策还是使用强密码，都应该有人控制正在发生的事情以及政策的执行得如何。在任何组织中，授权新的网络安全措施的能力都来自顶层。网络安全中人为的因素绝对是一个业务问题，你作为顶级经理需要对其进行监督。\n\
  *   **维护合规性。** 一旦授权，必须执行政策和程序。未能这样做将被解释为疏忽，导致起诉和监管罚款。网络保险由于引用了“未能遵守”免责条款，如果你未能维护自己的安全标准，它也将拒绝理赔。你的权威以及建立合规文化的能力对于避免这些灾难性的错误至关重要。\n\
  *   **危机之中的同理心。** 当发生数据泄露时，尽管付出了所有预防努力，如果客户和员工相信高层管理正在关注并付出了努力，他们会更加宽容。即使泄露的责任可以追溯到个人。\n\
  *   **证明支出合理性。** 网络安全的投资回报率是模糊的。很难衡量如果你不投资于预防或减少损失的事物，情况会变得多么糟糕，但这并不意味着这是可能的。经过调整的风险管理工具和技术可以使支出合理。无论你是向自己还是公司的其他利益相关者报告，只要你能阐述其价值，你就可以放心地进行投资。\n\
  \n### 附：如何在 Facebook 上停止身份窃取\n"
