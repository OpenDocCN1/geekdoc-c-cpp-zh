  \ is \" << sqrt(100.0) << \"\\n\";\n    cout << \"10 to the power of 5 is \" <<\
  \ pow(10,5) << \"\\n\";\n}\n```\n\n# 第 9 章：I/O\n\n## I/O 基础知识\n\n*   C++ 或 C 语言中都没有内置输入输出。它们在语言库中使用函数（C）或其他\
  \ I/O 对象（C++）。\n\n### C++ I/O 类和头文件\n\n1. `Iofs` 代表三个头文件 `<iostream>`、`<fstream>`\
  \ 和 `<sstream>`。`<iostream>` 自动包含了 `<ios>`。这些是你在 C++ 程序中应该包含三个三个头文件。\n2. 类：`iostream(streambuf)`、`fstream(filebuf)`、`stringstream(stringbuf)`\
