  \n接下来将讨论其他设计目标：\n\n## 强类型检查\nJava 是一种强类型语言。每个定义的变量都需要附着到一个数据类型上。现在你不需要理解整个程序，但让我们快速看下\
  \ 2 行代码。\n\n```java\nint i=5;\n```\n\n在这里，我们定义了一个被称为变量的东西，它用于存储值。可以存储的值取决于数据类型。在这个例子中，我们说\
  \ `i` 的类型是 `int` 或 `Integer`，这是一种数值数据值。\n\n## 数组边界检查\n在运行时， Java 将检查数组是否定义了所需数量的值。如果尝试访问数组边界之外的值，将抛出一个异常。现在你不需要理解整个程序，但让我们快速看下面的几行代码。\n\
  \n```java\nint[] array1 = new int[2];\narray1[0] = 1;\narray1[1] = 2;\narray1[2]\
  \ = 3;\n```\n\n在这里，我们声明一个数组，这是一组整数值。值 `2` 意味着我们只能在数组中存储两个值。通过这段代码，我们可以看到正在给数组分配\
  \ 3 个值。当你运行这个程序时，你将得到一个错误，因为程序会发现数组已经超出了它允许的最大边界两个。你将在运行时得到下面的错误。\n\n```\nException\
  \ in thread \"main\" java.lang.ArrayIndexOutOfBoundsException: 2 at HelloWorld.main(HelloWorld.java:8)\n\
  ```\n\n## 为什么 Java 很重要？\n接下来，Java 的语法和特征类似于 C 和 C++ 等其他编程语言。如果你有任何之前的编程经验，你会发现学习\
  \ Java 是轻而易举。即使你对编程完全是新手，也可以放心，Java 被设计成是一门相对容易学习的语言。大多数程序员发现学习 Java 比学习 C 或 C++\
  \ 更容易。\n\nJava 还被设计为与平台无关。正如前面提到的，Java 代码首先被编译成字节码，字节码可以在任何带有 Java 虚拟机（JVM）的机器上运行。因此通过\
  \ Java，你可以编写一次代码并在任何你想的地方运行。\n\n## 为什么选择 Java？\n当然，使用 Java 的关键原因之一是它对面向对象编程的关注。面向对象编程或“OOP”是一种编程语言模型，它允许程序代码围绕数据组织，而不是函数和逻辑（后者被称为过程编程）。这些“数据簇”被组织成被称为“对象”的东西，因此被称为“面向对象编程”。\n\
  \n这里的“类”允许程序员根据两个主要标准：属性和方法对它们进行“分类”。这些这些对象是由被称为“类”的东西创建的，在这里对类的理解是传统意义上的：即对象的类型，允许程序员根据两个主要标准对它们进行分类。\n\
  \n类的属性是创建对象的原始数据：这些是它的描述符，例如它拥有的值以及组成对象的其他相关数据。第二个标准是对象的“方法”。这个“方法”是类中包含的行为或逻辑序列，描述了它如何与外部交互，或者如何原生地与其进行交互。\n\
