  \ 等条件语句的使用。我们包含了异常的使用，以便当用户每次在计算器的除法数字输入错误值时，程序不会卡住。之后，我们将创建一个程序，该程序必须导入之前提到的模块，以便能够处理所有相关的数学函数。\n\
  \n但此时，你可能会认为唯一存在的模块是程序员创建的那些。答案是否定的，因为 Python 有内置集成的模块。通过它们，我们将再做两个程序：第一个是对我们刚刚做的那个改进，第二个将是一个闹钟，它会定期在屏幕上打印一个字符串。\n\
  \n### 示例\n创建一个名为 `dummymodule.py` 的 python 模块并在内部写入以下：\n```python\ndef testF():\n\
  \    print(\"this is a module, goodbuy\")\n```\n将模块保存在 python 安装目录下。在 shell 中：\n\
  ```python\nimport dummymodule\n```\n现在调用函数：\n```python\ndummymodule.testF()\n```\n\
  你使用了你的第一个模块。\n\n### 模块示例一\n第一要做的工作是创建模块，但乍一看，我们发现了一个惊喜，即导入了 `math`。这对我们意味着什么？嗯，意味着我们正在获取\
  \ Python 默认提供的 `math` 模块的属性。我们看到创建了计算函数，它有几个选项。如果 `op` 值等于 1，则进行加法操作。如果它等于 2，则进行减法操作，依此类推。但\
  \ `op` 等于 5 是很新的，因为如果是肯定的，它将通过使用 `math.sqrt(num1)` 返回值 `num1` 和 `num2` 的平方根值，该函数返回根的结果。然后，如果\
  \ `op` 等于 6，我们使用 `math.pow(num1, num2)` 来获取幂。然后，如果 `op` 等于 7，我们使用 `math.factorial(num1)`\
  \ 获取阶乘。然后，如果 `op` 等于 8，我们使用 `math.ceil(num1)` 获取上整。然后，如果 `op` 等于 9，我们使用 `math.floor(num1)`\
  \ 获取下整。然后，如果 `op` 等于 10，我们使用 `math.log(num1)` 获取对数。然后，如果 `op` 等于 11，我们使用 `math.sqrt(num1)`\
  \ 获取根。然后，如果 `op` 等于 12，我们使用 `math.sin(num1)` 获取正弦。然后，如果 `op` 等于 13，我们使用 `math.cos(num1)`\
  \ 获取余弦。然后，如果 `op` 等于 14，我们使用 `math.tan(num1)` 获取正切。然后，如果 `op` 等于 15，我们使用 `math.acos(num1)`\
  \ 获取反余弦……（此处省略重复的数学函数描述，保持翻译逻辑一致）\n\n### 模块示例二\n（此处保持与原文结构一致）\n\n模块在变量 `sys.path`\
  \ 给出的目录列表中搜索。该变量包含了当前目录、`PYTHONPATH` 目录以及安装自带的整个目录。如果在任何特殊情况下，上述操作失败，Python 将查找一个默认的\
  \ UNIX 路径（在 Windows 上位于 `/user/local/lib/python`）。\n\n\n\n\n\n# 面向编程\n\n\n\n\n##\
  \ 文件处理\n\n面向对象编程是一个用于创建强大应用程序的广泛概念。数据科学家需要构建应用程序来处理数据等工作。本章将探索 Python 中面向对象编程的基础。\n\
  \n## 面向对象编程\n\n面向对象编程缩写为 `OOP`，与其他设计模式相比具有许多优点。开发过程更快、更便宜，且具有极佳的软件可维护性。这反过来会产生更好的软件，而且还充满了新的属性和方法。然而，它的学习曲线是复杂的。对于新手来说，这个想法可能是复杂的。在计算方面，`OOP`\
  \ 速度较慢且消耗大量内存，因为编写了更多的代码。\n\n面向对象编程依赖于重要的编程概念，该概念利用语句来改变程序的状态。它侧重于说明程序应该如何运行。命令式编程语言的示例有\
  \ `Java`、`C++`、`C`、`Ruby` 和 `Python`。与声明式编程不同，后者处理计算机程序应该实现什么，而不详细说明如何实现。示例包括 `XQuery`\
  \ 和 `SQL` 等数据库查询语言。\n\n`OOP` 依赖于类和对象的属性。类可以被视为对象的“蓝图”。这些类可以拥有自己的特征和它们执行的方法。\n\n\
  ### OOP 示例\n\n以类 `Dog`（狗）为例。不要把它考虑是一只特定的狗或你自己的狗。我们正在描述狗是什么以及它通常能做什么。狗有年龄和名字。这些是实例属性。狗还可以叫；这是一个方法。\n\
  \n当你讨论某只特定的狗时，你在编程中就有一个对象：对象是类的实例。这是面向对象编程所依赖的基础状态。\n\n## Python 语言中的 OOP\n\nPython\
  \ 是一种允许 `OOP` 的强大编程语言。你将使用 `Python` 语言定义一个带有属性和方法的类，稍后进行调用。`Python` 比其他语言具有额外优势。首先，这种语言是动态的且是高级数据类型。这意味着开发速度比\
  \ `Java` 更快。它不需要程序员声明变量类型和参数。这使得 `Python` 对初学者容易学习。它的代码更直观、更易读。\n\n重要的是，类基本上提供了结构。这是一个概述了某物需要如何被定义的蓝图。然而，它没有提供任何实际内容。例如，`shape()`\
  \ 类可能指定形状的大小和名称，但它不会指示形状的具体名称。你可以将类视为某物如何执行的概念。\n\n### Python 对象\n\n虽然类是蓝图，但对象或实例是给定类的成员。它不再是一个概念了。它是一个真实的形状，比如一个有三边的三角形。\n\
  \n换句话说；类就像一份问卷卷。它会定义所需的信息。一旦你完成了表单，你的实际副本就是类的实例。它拥有与你相关的原始信息。\n\n你可以完成不同的副本以拥有多个实例，但如果没有表单，你会迷失，不知道需要什么类型的信息。因此，在创建单个对象之前，你需要定义类所要求的内容。\n\
  \n### 在 Python 中定义类\n\n下面是 `Python` 中一个简单的类定义：\n\n```python\nclass Dog(object):\n\
  \    pass\n```\n\n在 `Python` 中定义类时，你从 `class` 关键字开始以表示你正在写一个类，然后跟上类名。在上面的示例中，`Dog`\
  \ 是类名。上面的类定义使用了 `Python` 关键字 `pass`；这通常被用作占位符，最终代码将放在那里。使用这个关键字是为了避免代码抛出错误。\n\n\
  括号中的对象部分演示了你正在继承的父类。但在 `Python 3` 中这不再需要了，因为它是隐式的默认值。\n\n### 对象属性\n\n所有类都定义对象，所有对象都有称为属性的属性。`__init__()`\
  \ 方法用于通过列出它们的默认值来指定对象的原始属性。此方法至少需要一个参数作为 `self` 变量，它描述对象本身。\n\n![00296.jpeg](img/Image00002.jpg)\n\
  \n在接下来的示例中，每只狗都有独特的名字和年龄，了解这些这一点是至关重要的，特别是当你开始定义不同的狗时。不要忘记，类只是在定义 `Dog`，而不是在创建具有独特名字和年龄的单个狗对象。同样，`self`\
  \ 变量也属于类的实例。因为类实例有不同的值，你可以写 `Dog.name = name` 而不是 `self.name = name`。\n\n### 类属性\n\
  \n虽然实例属性对每个对象都是唯一的，但类的特征对于所有实例都是相同的。在这种情况下，所有的狗都是如此。\n\n### 方法\n\n当你拥有属于类的属性时，你可以继续定义将访问类属性的函数。这些函数被称为方法。当你声明方法时，你将希望使用\
  \ `self` 关键字为方法提供第一个参数。\n\n例如，你可以定义一个类 `Snake`（蛇），它包含属性 `name` 和方法 `change_name`。`change_name`\
  \ 方法将接受一个参数 `new_name` 加上关键字 `self`。\n\n现在，你可以用变量 `snake` 实例化这个类，并使用 `change_name`\
  \ 方法更改名字。\n\n![00297.jpeg](img/Image00003.jpg)\n\n### 实例属性和 init 方法\n\n你仍然可以在运行时为属性提供值。这是通过在\
  \ `__init__` 方法中定义实现的。查看下面的示例：\n\n![00298.jpeg](img/Image0004.jpg)\n\n现在你可以继续直接为对象定义值。到目前为止，你知道如何定义\
  \ Python 类、方法并实例化对象以及调用方法。这些技能当你想要解决复杂问题时将非常有用。随着面向对象编程的扩展，你的代码的复杂性将会增加。会有不同的类、对象、实例方法和子类。你会希望维护你的代码并确保其可读性。为了实现这一点，你需要遵循设计模式。这些原则是帮助人们避免糟糕设计的原则。每个模式代表一个在\
  \ `OOP` 中反复出现的程序，并描述该问题的解决方案，然后可以重复使用。\n\n## 文件处理\n\nPython 提供了从文件读取数据和向文件写入数据的关键功能。大多数编程语言中，所有的值或数据都存储在临时变量中。由于数据只在运行时存储在变量中，一旦程序执行结束就会消失，因此使用文件永久保存这些数据。\n\
  \n### Python 如何处理文件？\n\n让我们假设普通人如何处理这些文件。如果你想从文件读取数据或向文件写入数据，你需要打开文件，或者如果文件不存在则创建一个新文件，然后进行正常的读写操作，保存文件并关闭它。\n\
  \n### Python 中的文件类型\n\n有两种文件：\n\n\n\n\n\n### 1. 文本文件\n### 2. 二进制文件\n\n可以使用文本编辑器查看内容的文件称为文本文件。文本文件是指一系列\
  \ `ASCII` 字符。Python 程序就是文本文件的示例。\n\n二进制文件以与内存中存储相同的方式存储数据。`mp3` 文件、Word 文档等二进制文件的某些示例。你无法使用文本编辑器读取二进制文件。在\
  \ Python 语言中，文件处理遵循以下步骤：\n\n* 打开文件并返回一个 `filehandle`（文件句柄）。\n* 使用该 `handle` 进行读取或写入操作。\n\
  * 关闭 `filehandle`。\n\n在 Python 中对文件执行读取或写入操作之前，你必须先打开它。当读/写事务完成后，你应该关闭它以释放与文件相关的资源。现在让我们详细查看每个步骤。\n\
  \n* **Access_mode（访问模式）**：用整数表示，例如 `read`（读）、`write`（写）和 `append`（追加）。默认设置是只读 `<r>`。\n\
  * **Buffering（缓冲）**：缓冲默认值为 `0`。零值表示不会进行缓冲。如果值为 `1`，则在访问文件时将进行行缓冲。如果值大于 `1`，则缓冲操作将根据大小进行。\n\
  * **File_name（文件名）**：这是一个表示你想要访问的文件名的字符串。\n\n## Python 语言中的文件打开模式\n`<r><rb+><rb><w+><wb+><r+><w><wb>`\
  \ \n\n## Python 文件对象属性\n一旦调用 Python 的 `open()` 函数，它会返回一个对象，即 `filehandle`。此外，你需要理解\
  \ Python 文件具有不同的特性。你可以利用 `filehandle` 列出它所属文件的特性。\n\n## 在 Python 中关闭文件\n在完成工作后关闭文件总是个好习惯。然而，Python\
  \ 有垃圾回收器来清理未使用的对象。但是，你需要手动执行，而不是将其留给 `GC`（垃圾收集）。\n\n### Close 方法\nPython 提供 `<close()>`\
  \ 方法来关闭文件。当你关闭文件时，系统会为其分配资源。这很容易实现。关闭文件会释放基本的系统资源。如果你忘记关闭文件，Python 将在程序结束或文件对象在程序内部不再被引用时自动关闭。但是，如果你的程序很大，且你正在读取或写入多个文件，可能会消耗系统上大量的资源。如果你继续粗心地地打开新文件，可能会耗尽资源。\n\
  \n# 第 7 章：开发工具\n\n## 如何运行 Python\n现在在我们开始运行第一个 Python 程序之前，理解我们如何运行 Python 程序非常重要。运行、执行、部署或启动程序简单来说意味着我们让计算机处理指令/代码行。例如，如果代码行（程序）需要计算机显示某些消息，它就会显示。以下是运行\
  \ Python 程序的运行或模式。解释器是安装 Python 包时安装的一个特殊程序，有助于将文本代码转换为计算机可以理解并执行的语言（执行）。\n\n###\
  \ 交互模式（Immediate Mode）\n这运行未写在文件中 Python 程序的方法。我们通过在命令行中输入单词 `python` 进入交互模式，这将触发解释器切换到交互模式。交互模式允许直接输入表达式，按回车即可生成输出。下面的符号是\
  \ Python 提示符：`>>>`\n\nPython 提示符指示解释器接受用户的输入。例如，输入 `2+2` 并按回车将显示 `4` 作为输出。在某种程度上，这个提示符可以当作计算器使用。如果你需要退出交互模式，输入\
  \ `quit()` 或 `exit()`。现在输入 `5 + 3` 并按回车，输出应为 `8`。\n\n### 脚本模式（Script Mode）\n脚本模式用于运行在文件中编写的\
  \ Python 程序；文件称为脚本。脚本可以保存到外部存储（如磁盘）中供以后使用。所有 Python 脚本都有扩展名 `.py`，这意味着文件名以 `.py`\
  \ 结尾。例如 `myFirstProg.py`。我们稍后将解释如何编写 Python 脚本。\n\n## 什么是 IDE？\nIDE 提供了一种编写和运行 Python\
  \ 程序的方便方法。人们也可以使用文本编辑器编写代码行并以 `.py` 扩展保存文件来创建 Python 脚本文件，而不是使用 IDE。然而，使用 IDE 可以简化编写和运行\
  \ Python 程序的流程。Python 包中的 `IDEL` 是带有图形用户界面的 IDE 示例，它与 Python 语言一起安装。IDE 的优势包括帮助消除重复性任务，并为初学者简化编码。IDE\
  \ 还提供了语法高亮、代码提示和语法检查等功能。还有商业级 IDE，例如 `PyScripter` IDE，它们执行上述提到的大部分功能。\n\nIDE 对于我们在语言内部能够做的事情将至关重要。你需要准备某种\
  \ IDE 或环境来处理任何编码。如果没有它，你会发现程序将无法运行。好消息是，IDE 安装简单，且上手不会太困难。有很多 Python IDE 供你选择。这通常取决于你想要在选择的环境中拥有的功能和其他插件。请记住，其中一些\
  \ IDE 根据其设计者以及你在它们中发现的功能类型可能会花费一些费用。\n\n如果你希望在降低成本的同时，仍能获得一个具有你所需所有功能及更多功能的 IDE，你可以访问\
  \ `www.python.org` 网站。这将与下载 Python 一起，确保你获得 IDE 以及进行 Python 编码所需的其他文件。而且这一切都是免费提供的，帮助你降低成本！\n\
  \n## 你的第一个 Python 程序\n其余插图将假设你在 Windows 环境运行 Python 程序。\n\n* 启动 `IDLE`\n* 点击 `File`\
  \ 菜单并 `New Window`（新建窗口）\n* 输入以下：\n```python\nprint (\"Hello World!\")\n```\n* 在\
  \ `File` 菜单点击 `Save`（保存）。输入文件名 `myProgram1.py`\n* 导航到 `Run` 并点击 `Run Module`（运行模块）来运行程序。\n\
  \n我们编写的第一个程序被称为“Hello World!”，它不仅用于为新的计算机编程语言提供介绍，还测试 IDE 的基本配置。程序的输出是“Hello World!”。这里发生的是：`Print()`\
  \ 是内置函数；它是为你预先编写并预加载的，只要在双引号内，用于显示 `()` 中的任何内容。计算机将显示双引号内的任何内容。\n\n**任务**：现在编写并运行以下\
  \ Python 程序：\n\n* `print(“I am now a Python Language Coder!\")`\n* `print(“This\
  \ is my second simple program!\")`\n* `print(“I love the simplicity of Python”)`\n\
  * `print(“I will display whatever is here in quotes such as owyhen2589gdbnz082”)`\n\
  \n\n\n\n\n现在我们需要编写一个带有数字的程序，但在编写此类程序之前，我们需要学习一些关于变量和类型的知识。\n\n请记住，`python` 是面向对象的语言，并且它不是静态类型的，这意味着我们在使用变量之前不需要对其进行声明，也不需要指定它们的类型。让我们来解释这句话；面向对象的语言简单意味着该语言支持将现实生活中的场景视为具有子组的群组，这些群组可以相互链接和共享，从而模拟事物的自然顺序和交互。并不是所有的编程语言都是面向对象的；例如，`Visual\
  \ C` 编程语言就面向对象。在编程中，声明变量意味着我们显式地说明变量的性质。变量可以被声明为整数、长整数、短整数、浮点整数、字符串或字符，并包括它是局部访问还是全局访问。变量是一个根据条件改变数值的存储位置。例如，`number1`\
  \ 可以取从 0 到无穷的任何数字。然而，如果我们显式地指定 `int number1`，那么意味着该存储位置只接受整数而不接受分数。幸运的是或不幸的是，`python`\
  \ 并不要求我们显式地说明存储位置的性质（声明变量），因为这由 `python` 语言本身处理。\n\n在处理变量类型和编写变量的规则之前，让我们运行一个简单的程序来帮助理解如何实现这一点。\n\
  \n1. 启动 `IDLE`\n2. 导航到 `File`（文件）菜单并点击 `New Window`（新建窗口）\n3. 输入以下内容：\n```python\n\
  num1=4\nnum2=5\nsum=num1+num2\nprint(sum)\n```\n4. 在 `File` 菜单点击 `Save`（保存）。输入文件名\
  \ `myProgram2.py`。\n5. 导航到 `Run`（运行）并点击 `Run Module`（运行模块）来运行程序。\n\n该程序的预期输出应该是\
  \ 9”，且不带双引号。此时，你可能正急于了解刚刚发生了什么，以及为什么 `print(sum)` 不像我们之前写的第一个程序那样带有双引号。以下是解释。\n\n\
  第一行 `num1=4` 意味着变量 `num1`（我们对 `number1`，第一个数字的简写）在程序运行之前已被赋值为 `4`。第二行 `num2=5` 意味着变量\
  \ `num2`（我们对 `number2`，第二个数字的简写）在程序运行之前已被赋值为 `5`。计算机解释这些指令并存储给定的数字。第三行 `sum=num1+num2`\
  \ 告诉计算机获取 `num1` 被赋予的任何值加上 `num2` 被赋予的任何值。换句话说，求 `num1` 和 `num2` 的和。第四行 `print(sum)`\
  \ 意味着显示 `sum` 的所有内容。如果我们给 `sum` 加上双引号，计算机将只会显示 `sum` 单词，而不是两个数字之和！记住那句老话：计算机是“垃圾进，垃圾出”。它们只会遵循你给它们的指令！\n\
  \n现在，在解释变量类型之前，让我们先尝试三个涉及数字的练习。记住变量的值是变化的，例如，`num1` 可以取 `3`、`8`、`1562`、`1`。按照打开\
  \ `Python IDE` 的步骤执行以下操作：\n\n6. 输出应该是 54：\n```python\nnum1=43\nnum2=11\nsum=num1+num2\n\
  print(sum)\n```\n7. 输出应该是 167：\n```python\nnum1=101\nnum2=66\nsum=num1+num2\nprint(sum)\n\
  ```\niii. 输出应该是 28：\n```python\nnum1=9\nnum2=19\nsum=num1+num2\nprint(sum)\n```\n\
  \n# 第 8 章：正确安装\n\n## 安装 Python (Windows)\n开始学习 `Python` 的部分是在你的 `Windows` 上安装 `Python`。在安装的第一步，你需要从下面的链接下载你偏好版本的安装包：`https://www.python.org/downloads/`。访问此链接后，你将被引导到一个页面。在该页面上，你需要在\
  \ `Python 2` 和 `3` 的两个最新版本之间进行选择：`Python 3.8.1` 和 `Python 2.7.17`。\n\n反之，如果你正在寻找特定的发布版本，可以浏览页面以找到早期版本的下载链接。通常，你会选择下载最新版本，即\
  \ `Python 3.8.1`（于 2019 年 10 月 14 日发布），或者下载 `Python 2` 的最新版本 `2.7.17`。然而，你下载的版本必须取决于你想要做的项目类型、兼容性以及对更新的支持。\n\
  \n下载完成后，你可以点击下载的 `.exe` 文件继续安装。标准安装必须包含 `pip`、`IDLE` 和核心文档。\n\n## 安装 Python (Mac)\n\
  如果你正在使用 `Mac`，可以从此链接下载安装包：`https://www.python.org/downloads/mac-osx/`。\n\n学习的进程正在进一步深入\
  \ `Python 编程语言`。实际上，`Python` 是一种灵活且强大的语言，可以从多个角度进行使用。这仅仅意味着当要在逐行基础上尝试代码或声明时，或者当你正在研究它的特性时，`Python`\
  \ 可以被明智地使用。令人置信的是，`Python` 可以在逐行测试代码或声明，或者研究其特性时被使用。\n\n\n\n结果将是：语法错误：无效的语言结构。当你使用无效或碎片化的解释时就会这种情况。注意\
  \ `Python` 是一种对大小敏感的编程语言，所以无论在某一点误解了信息，都可能是因为你使用了大写字母的 `print`。显然，打印方向有一个选择；你可以简单地在如下语句中输入你的公告：“Primes,\
  \ Savants!”。请注意，公告是你在下达指令后希望显示的词；然而，可以放入其中的词并不限于此处给出的模型。离开 `Python` 命令行退出 `Python`\
  \ 最有效的方法是你可以输入以下任一命令：`quit()` 或 `exit()`。随后，按住 `Control-Z` 然后按 `Enter`；`Python`\
  \ 就会退出。你与 `Python 编程` 的缘分现在应该变得迷人了；仍有很多部分需要学习，耐心将会有回报的。\n\n## IDLE 区域：Python 集成开发环境\
  \ (IDE)\n\n在 `Python` 迷人的特性中，脱颖而出的是 `IDLE`（集成开发与学习环境）工具。尽管这个特定设备已包含在 `Python` 的安装包中，但你也可以下载日益完善的外部\
  \ IDE。`IDLE` 工具为你提供了一个日益强大的平台来编写代码并与 `Python` 进行交互式工作。要进入 `IDLE`，你可以在找到命令行符号的地方或开始菜单找到类似的组织器（正如你从命令行协作中学到的那样）。当你点击\
  \ `IDLE` 图标时，你将被重定向到 `Python Shell` 窗口。这将进入与 `Python Shell Window` 协作的部分。\n\n###\
  \ 连接 Python Shell 窗口\n\n当你处于 `Python Shell 窗口` 时，你会看到一个下拉菜单和一个 `>>>` 提示符，这与你在命令行窗口中发现的（之前提到的主要的连接）相似。有一个特定的\
  \ `IDLE` 功能可以更改绘制指令的内容。现在，你将使用类似的 `IDLE` 更改菜单来查看过去的指令、剪切、复制和粘贴过去的语句，并进行进行任何类型的编辑。显然，`IDLE`\
  \ 越来越类似于命令行关联的飞跃。\n\n令人惊的是，在 `Python Shell` 窗口的下拉菜单中包含以下菜单项：`File`（文件）、`Windows`（窗口）、`Help`（帮助）、`Shell`（外壳）、`Options`（选项）、`Edit`（编辑）和\
  \ `Debug`（调试）。这些每个菜单都有各种功能。在创建较大的项目时会使用 `Shell` 和 `Debug` 菜单，因为它们突出了处理过程。在任何情况下，虽然\
  \ `Shell` 菜单提供了重启 shell 或查看 shell 日志以获取最新重置的机会，但 `Debug Menu` 有许多非常有价值的内容，用于跟踪异常的源记录并标记错误行。通过\
  \ `Debugger` 选项，你可能会引入一个智能调试器窗口，它允许你停止并检查 `Python` 上正在运行的项目。窗口的 `Options` 菜单允许你编辑并设置\
  \ `IDLE` 以适应你自己的 `Python` 工作习惯。\n\n此外，在 `Help` 菜单中，你打开了 `Python Help` 和文档的选项。使用\
  \ `File Window` 菜单，你很可能会创建另一个文档、打开一个模块、打开一个旧记录，并通过一旦进入此菜单时自然创建的基本项目保存你的会话。通过 `'New\
  \ File'` 选项，你几乎肯定会创建一个只需点击即可运行的代码。当你完成后，你将被带到另一个窗口，那里有一个简单且标准的文字处理器，你可以在其中输入或修改你的代码。你会看到记录是\
  \ `'untitled'`，不要担心；这是文档的底层名称，它会在你保存代码时更改。\n\n`File window` 菜单很棒的一点是它不包含 `'Shell'`\
  \ 和 `'Menu'` 选项，所以栏随 `Shell Window` 发生了细微变化。发生的情况是在 `Shell Window` 中出现了两个新菜单，具体来说：`Run`（运行）和\
  \ `Format`（格式）菜单。当你需要运行在记录窗口上编写的代码时，结果将在 `Shell Window` 中单独给出。\n\n在该区域的开头，你被告知 `Python`\
  \ 可以在 `Script Mode`（脚本模式）中使用。如何做到这一点？此时获取结果的方法非常独特。在内容模式工作时，你得到的输出将不像在连接或关联模式那样被编程。你应该在代码中调用它们。要在此模式下获得输出，请运行内容或通过代码中的\
  \ `print()` 函数对其进行排序。\n\n完成本节，你已经学习了 `Python 编程语言` 的两种基本方法：绘制或关联以及 `Script modes`。无论情况如何，请记住这两个结果的根本区别在于一个依赖顺序，而另一个是程序化的。\n\
  \n# 第 9 章：数据科学\n\n### 数据科学及其意义\n\n数据科学在过去几年里取得了长足的发展，因此它成为理解多个公司运作情况的重要因素。以下是几个证明数据科学仍将是全球市场不可或缺部分的解释。\n\
  \n1. 借助 `Data Science`，公司将能够以更高效、更高的方式理解他们的客户。满意的客户是每家公司的基础，他们在公司的成功或失败中扮演着重要角色。`Data\
  \ Science` 允许公司以先进的方式与客户互动，从而证明了产品性能的提升和加强。\n\n2. `Data Science` 使品牌能够提供强大且具有吸引力的视觉效果。这是它著名的原因之一。当公司对比使用这些数据时，可以与观众分享体验。\n\
  \n3. `Data Science` 的一个显著特征是它的结果可以推广到几乎所有行业，如旅游、医疗保健和教育。公司可以通过 `Data Science` 快速确定他们的问题，并对其进行充分处理。\n\
  \n4. 目前，数据科学适用于几乎所有行业，而且现在世界上存在大量数据，如果使用得当，可能会导致任何项目的成功或失败。如果数据使用正确，对于未来实现目标将至关重要。\n\
  \n5. 大数据一直在上升和增长。大数据允许企业使用通常构建的不同资源解决复杂的业务、人力和资本管理问题。\n\n6. 技术也影响了超市行业。为了理解这一点，让我们来看一个例子，老年人与当地销售人员有极好的互动。销售人员能够以个性化的方式满足客户的需求。但现在这种关注由于超市连锁的出现和增加而丢失了。但销售人员可以通过数据分析与客户沟通。\n\
  \n7. `Data Science` 帮助公司建立这种客户连接。公司和他们的产品将能够通过数据科学更深入地理解客户如何利用他们的服务。\n\n\n\n\n##\
  \ 数据技术的未来\n\n与其他与其他领域不断演进一样，数据技术的重要性也日益增长。数据科学影响了不同的领域。其影响力体于零售、医疗和教育等许多行业。在医疗保健领域，新的治疗方法和技术不断被发现，对高质量的患者护理有着需求。医疗行业可以通过数据科学技术的帮助找到解决方案，帮助患者护理。教育是另一个可以清楚看到数据科学优势的领域。现在，手机和平板等新创新已成为教育系统的基本特征。此外，在数据科学的帮助下，学生获得了更大的机会，从而提高了他们的知识。\n\
  \n## 数据结构\n\n在计算机编程中，选择或设计数据结构是为了存储数据，以便对其运行不同的算法。每种数据结构都包含数据值、数据关系以及数据之间的函数，这些函数可以应用于数据和信息。\n\
  \n![列出所有数据结构并解释每种及其应用 | 练习 | GeeksforGeeks](img/Image00005.jpg)\n\n### 数据结构的特征\n\
  \n有时，数据结构根据其特征进行分类。可能的功能有：\n\n- **线性或非线性**：此特征定义了数据对象如何在顺序序列中组织（如列表），或在无序序列中组织（如表格）。\n\
  - **同质或非同质**：此功能定义了集合中的所有数据对象是相同类型还是不同种类。\n- **静态或动态**：此技术决定了如何组装数据结构。编译时的静态数据结构在内存中具有固定的大小、结构和目标。动态数据类型具有维度、机制和内存目标，可能会根据应用程序而缩小或扩展。\n\
  \n## 数据结构类型\n\n数据结构的类型取决于需要什么种的操作或将实现什么样的算法。这包括：\n\n- **数组 (Arrays)**：数组存储在相邻位置的内存项列表。相同类别的组件位于一起，因为每个元素的位置可以很容易地计算或访问。数组可以是固定大小的，也可以是灵活长度。\n\
  - **栈 (Stacks)**：栈按线性顺序存储一组添加到操作中的对象。这种顺序可能是后进先出 (`LIFO`) 或先进先出 (`FIFO`)。\n- **队列\
  \ (Queues)**：队列存储一个类似栈的元素选择；然而，活动顺序只能是先进先出。\n- **链表 (Linked lists)**：在线性顺序中，链表存储一组项。在链表中，每个单元或节点都包含一个数据项以及一个指向列表中下一个元素的引用或关系。\n\
  - **树 (Trees)**：树存储一个抽象的分层项集合。每个节点连接到其他节点，并可以有多个子值，称为子节点。\n- **图 (Graphs)**：图存储一个非线性的设计项组。图由一组的节点（也称为顶点）和连接它们的线（也称为边）组成。它们用于描述现实中的过程，例如网络计算机。\n\
  - **字典树 (Tries)**：字典树或查询树通常是一种将字符串作为数据存储的数据结构，可以以视觉图的形式排列。\n- **哈希表 (Hash tables)**：哈希表或哈希图包含在一个将键标记为变量的关联列表中。哈希表使用哈希算法将索引转换为包含所需数据项的容器数组。这些数据系统被认为是复杂的，因为它们可以包含海量的互连数据。原始或基础数据结构的示例有\
  \ `integer`、`float`、`boolean` 和 `character`。\n\n## 数据结构的利用\n\n数据结构通常用于以物理形式整合数据类型。这可以被解释为广泛的应用，包括显示数据库表的二叉树。数据结构被用于编程语言中，以组织数字存储中的代码和信息。`Python`\
  \ 数据库和字典，或者 `JavaScript` 数组和对象，是用于收集和分析数据的流行编码系统。此外，数据结构是有效软件设计的重要部分。\n\n## 数据库的意义\n\
  \n数据系统对于有效处理海量数据是必要的，例如存储中的数据或索引服务。准确的数据配置管理需要内存分配标识符、数据互连和数据处理，所有这些都支持数据结构。此外，不仅要使用数据结构，还要为每个任务选择正确的数据结构。选择不令人满意的数据结构可能会导致运行速度缓慢或代码混乱。选择数据系统时需要注意的任何考虑包括应该处理什么类型的信息、新数据将放在哪里、数据将如何组织，以及为数据分配多少空间。\n\
  \n## Python 对数据科学有多重要？\n\n- **高效且易用**：`Python` 被认为是初学者的工具，任何只有基础理解的学生或研究人员都可以开始使用它。调试代码花费的时间和资金以及对不同项目管理的限制也降到了最低。与\
  \ `C`、`Java` 和 `C#` 等其他编程语言相比，代码实现的时间更短，这使得开发者和软件工程师可以将更多的时间花在他们的算法上。\n- **库的选择**：`Python`\
  \ 提供了大量的库以及机器学习和人工智能数据库。`Scikit Learn`、`TensorFlow`、`Seaborn`、`Pytorch`、`Matplotlib`\
  \ 等等许多库是最流行的库。\n- **可扩展性**：它为解决其他计算机语言无法解决的问题提供了灵活性。许多公司用它开发各种快速技术和系统。\n- **可视化统计和图形**：`Python`\
  \ 提供了许多可视化工具。`Matplotlib` 库提供了一个可靠的框架。\n\n## Python 如何用于数据科学\n\n### 第一阶段\n首先，我们需要学习并理解数据的形状。如果我们感知数据为具有行和列的巨大\
  \ Excel 表格，那么你应该知道该怎么办？你需要通过执行某些操作将信息收集到每行和每列中。完成这种计算任务可能会消耗大量的时间和精力。\n\n### 第二阶段\n\
  下一个障碍是获取所需的数据。由于数据并不总是容易获取，我们需要从网络中获取数据。在这里，`Python` 的 `Scrap` 和 `Beautiful Soup`\
  \ 库可以让我们从互联网检索数据。\n\n### 第三阶段\n在这一步，我们必须获取数据的模拟或视觉呈现。当画板上有太多图形时，引导视角会变得困难。正确的方法是将数据表示为图表、图形和其他布局等。\n\
  \n### 第四阶段\n下一个阶段是机器学习，这是一种极其复杂的计算。它包含了数学工具，如概率、微积分和跨行列的矩阵运算。通过 `Python` 的机器学习库\
  \ `Scikit-Learn`，这一切将变得非常简单且有效。\n\n\n\n\n\n## 学习机器学习\n\n计算机已成为现代生活中几乎每个领域操作不可或缺的一部分。教计算机如何运行并逐步改进其功能需要不同的方法。机器学习的类型根据底层问题或预期结果被分为不同的分类。这些类型的机器学习允许计算机学习模式和规律，这些规律对于现代世界中各种业务和与健康相关领域都非常有用。以下是机器学习过程中实用的一些学习算法类型。\n\
  \n## 监督学习\n\n监督学习发生在算法创建一个将原始数据映射到期望输出的函数的情况下。监督学习是机器学习最常见的范式之一，易于理解。监督学习的实现过程可以通过训练数据集中的系统来实现。训练数据或示例包含多个输入和期望输出。输出也被称为调节信号，在数学模型中表示。一个向量数组表示训练示例。当提供以插图形式的数据时，算法可能在每个名称的预测中非常有用。预测发生在对答案是否正错给出响应的过程中。这种方法让算法有机会随着时间的推移学习进行近似，从而区分标签和示例之间的区别。这种方法使得监督学习成为寻找解决方案过程中的常见选择……\n\
  \n最常见的监督学习方法包括分类和回归。在分类情况下，当输出可能受到固定数量值的限制时，会使用监督学习。分类通常处理给定数据集中的识别，旨在将新观测链接到此类类别中。另一方面，当输出在给定子集中具有很宽的数值范围时，就会使用回归。这两个示例的目标都是确保机器学习利用一组固定的训练示例，对一组数据在给定子集中的相似性或差异进行必要的比较。此类数据中的中的优场景确保了算法可以确定此类子组内所有未见发生情况的类标签。\n\
  \n## 无监督学习\n\n机器学习可能通过无监督聚类分析发生。该方法涉及使用一组由输入组成的数据，这对于开发结构是必要的。数据点的聚类是无监督学习的一个示例。与监督学习的情况不同，无监督学习中的测试数据没有标签，且不属于特定的分类。无监督学习不响应反馈，而是关注共同性。该方法试图识别给定数据集中共同性的可能，并利用这些共同性来开发模式。从本质上，这意味着目标是让计算机学习如何做某事，而无需提供实现此任务的逻辑方法。因此，无监督方法比监督过程更困难、更复杂。这种方法意味着使用一种奖励方法来确认任务完成的成功，而不一定提供如何实现设定目标的显式指令。\n\
  \n无监督方法的意义更倾向于决策过程，而不是仅仅对数据进行分类。无监督学习训练代理根据随时间建立的奖励系统或惩罚系统来执行或响应任务。计算机逐渐学习如何导航过去的命令，而没有关于预期结果的先验信息。这种方法可能耗时且乏味。但无监督学习可能是强大的，因为它从试错点运行，这可能会产生发现。无监督学习不考虑任何预分类的信息，因此从发明的角度工作。\n\
  \n在世界上大多数数据集都是未标记的世界里，无监督学习方法至关重要。这一不可否认的现实意味着，拥有能够利用数 TB 的未标记数据并理解此类信息的智能算法至关重要。未来，将出现不同的情况，无监督学习将成为核心关注领域。推荐系统将是未来无监督学习的应用领域。推荐系统允许对关系建立独特的链接，使其根据共同喜好对内容进行分类和建议。\n\
  \n## 强化学习\n\n当精确模型不切实际时，强化学习是有用的，因为它们很少假设已知的数学模型。该方法关注机器如何运行以最大化累积奖励的某些方面。在现代研究中，从行为心理学的角度观察到了强化学习的应用。该方法通过与环境环境来发挥作用。正如我们之前注意的，监督学习基于现有示例运行。在强化学习的情况下，用户与情况的交互表明了两种方法之间的区别。\n\
  \n强化学习在人工智能领域的应用表明机器具有通过与环境环境交互学习并适应新任务的能力。算法根据对上下文设置的观察来采取特定行动。对环境刺激的行为反应模式是已与人工智能同义的学习过程的指示。强化学习中的每个动作对操作背景都有直接影响，这种反应为机器提供了接收反馈的机会，这在学习过程中至关重要。强化学习倾向于依赖与时间相关的序列或标签。强化学习的结果取决于代理与环境上下文之间的连接。随后给代理一组对环境有直接影响的任务。然后该方法批准一个特定的强化信号，根据工作和预期结果提供负面或正面反馈。\n\
  \n## 半监督机器学习\n\n在存在少量标记数据和大量未标记数据的情况下，使用半监督学习算法至关重要。该方法利用了标记和未标记数据的结合。因此，程序员使用这两种数据类型来识别模式。推出的模型成为目标变量关系的基础。\n\
  \n### 结论\n\n学习计算机已成为现代生活中几乎每个领域操作不可或缺的一部分。教计算机如何运行并逐步改进其功能需要不同的方法。机器学习的类型根据底层问题或预期结果被分为不同的分类。这些类型的机器学习允许计算机学习模式和规律，这些规律对于现代世界中各种业务和与健康相关领域都非常有用。以下是机器学习过程中实用的一些学习算法类型。\n\
