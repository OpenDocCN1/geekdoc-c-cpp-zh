  \n# 重点与更多\n# 第 7 章：面向对象编程\n\n你之前了解到 Java 是一种面向对象的编程语言。因此，它支持这种编程范式的基本原理。面向对象的语言允许程序员设计使用对象和类的程序。它们提供并支持可以简化软件开发和维护的功能。这种编程范式最重要的概念包括：\n\
  \n*   对象（Objects）\n*   类（Classes）\n*   方法（Method）\n*   实例（Instance）\n*   继承（Inheritance）\n\
  *   抽象（Abstraction）\n*   多态（Polymorphism）\n*   消息解析（Message Parsing）\n*   封装（Encapsulation）\n\
  \n\n\n\n### 对象\n在现实世界中，你会遇到如人类、狗、汽车和猫等对象。这些对象拥有状态和行为。例如，当你想到的一只猫时，它的状态可以包括它的品种、颜色或名称。它的行为可能包括跑步、跳跃或摇尾巴。软件对象在这些特征上与现实对象相似。它的状态存储在字段（fields）中，它的行为通过方法（methods）表现出来。在开发过程中，方法是在对象的内部状态上执行的，并且方法促进了对象之间的通信。\n\
  \n### 类\n类用于设定对象的定义。这些规范充当了创建对象的蓝图。虽然在创建类时这些定义不会立即被应用，但当该类的对象被实例化时，这些定义是可用的。一个对象或类在程序中可以有多个副本或实例。\n\
  \n以下是一个名为 `Cat` 的类的定义示例：\n![00010.jpeg](img/Image00017.jpg)\n\n类可以包含以下类型的变量：\n\n\
  ### 类变量\n类变量是那些在类内部使用 `static` 修饰符声明且位于任何方法之外的变量。\n\n### 局部变量\n局部变量是那些定义在方法、块或构造函数内部的变量。这些变量在方法内部声明并实例化，并在方法执行完成后被销毁。\n\
  \n### 实例变量\n实例变量是那些位于类内部但在方法之外的变量。它们在类创建的同时被初始化。它们可以通过该特定类的方法、块或构造函数进行访问。\n\n一个类可以包含尽可能的方法来获取其所需的值。例如，`Cat`\
  \ 类有三个方法：`running()`、`sleeping()` 和 `jumping()`。\n\n### 构造函数\n构造函数用于初始化对象的方法。一个类必须至少包含一个构造函数。以下是构造函数的重要规则：\n\
  - 构造函数的名称应该与类名匹配。\n- 它不应该有显式的返回类型。\n\n## 构造函数的类型\n- 默认构造函数或无参构造函数\n- 参数化构造函数\n-\
  \ 默认构造函数\n\n没有参数的构造函数被称为默认构造函数。以下是其语法：\n![00011.jpeg](img/Image00018.jpg)\n\n###\
  \ 参数化构造函数\n参数化构造函数是带有参数的构造函数。它用于为特定对象提供值。以下示例展示了两种类型的构造函数。第一个是默认构造函数，它没有任何参数。第二个构造函数有一个参数\
  \ `name`。\n![00012.jpeg](img/Image00019.jpg)\n\n### 创建对象\n类为对象提供了模板。对象基本上是从类中创建的。要创建新对象，你将使用\
  \ `new` 关键字。从类创建新对象通常遵循以下步骤：\n\n1. **声明**：这指的是变量声明，你将在其中编写变量的名称及其对象类型。\n2. **实例化**：使用\
  \ `new` 关键字来创建一个新对象。\n3. **初始化**：在 `new` 关键字之后调用构造函数并初始化一个新对象。\n\n以下示例展示了从类创建新对象的不同步骤：\n\
  ![00013.jpeg](img/Image00020.jpg)\n\n输出结果：`Passed Name is: spotty`\n\n### 如何访问方法和实例变量\n\
  创建的对象用于访问方法和实例变量。要访问实例变量，你将使用以下步骤：\n- 首先，你必须创建一个对象：`ObjectName = New Constructor();`\n\
  - 接下来，调用变量如：`ObjectName.variableName;`\n要调用类方法：`ObjectName.MethodName();`\n\n##\
  \ Java 包\n包仅仅是接口和类分组的一种方式。Java 包作为类的容器。分组的通常依据是功能性。包的使用有助于代码的可重用性。当接口和类被分类到包中时，你可以轻松地访问它们并在其他程序中使用它们。包的使用还帮助防止类和接口之间的命名冲突。\n\
  \n要创建一个包，请在包名之前使用 `package` 语句将其作为第一条语句。以下是一个示例：\n![00014.jpeg](img/Image00021.jpg)\n\
  \n## 导入语句\n你可以使用 `import` 关键字将包导入到你的源文件中。导入语句使编译器能够轻松找到类或源代码的位置。你可能只想从包中导入一个类。你可以使用点操作符\
  \ `.` 来指示包和类。例如：\n![00015.jpeg](img/Image00022.jpg)\n\n要从一个包导入所有类，你可以在点操作符之后使用通配符\
  \ `*`。例如：\n![00016.jpeg](img/Image00023.jpg)\n\n## 修饰符\n修饰符是改变代码中定义含义的关键字。Java 提供了修饰符。\n\
  \n## 访问修饰符\n访问修饰符用于定义方法、变量、类和构造函数的访问级别。\n\n- **Private**：仅在类内部访问。当方法、变量、类或构造函数被声明为\
  \ `private` 时，意味着它仅在该类可用。然而，如果类有公共的 getter 方法（get 方法），你可能可以在类外部访问私有变量。`private`\
  \ 关键字表示最高的访问限制。注意，你不能将接口和类声明为 `private`。\n- **Public**：全世界可访问。定义为 `public` 的方法、接口、构造函数、类等可以被其他类访问。同样，公共类内部定义的块、方法或字段也可以被\
  \ Java 类访问，只要它们在同一个包中即可。如果你想从另一个包访问公共类，则必须导入该公共类。在类继承概念下，子类继承类所有的公共变量和方法。注意，程序的\
  \ `main()` 方法必须声明为 `public`，Java 解释器才能调用它运行该类。\n- **Protected**：对所有子类和包可见。在父类中将方法、变量或构造函数声明为\
  \ `protected`，会使其仅对该包内的类或另一个包中的子类可见。这种访问类型用于允许子类使用变量或辅助方法，并防止无关类使用它们。接口及其内部的字段方法不应声明为\
  \ `protected`，但接口外的字段和方法可以声明为 `protected`。类不应声明为 `protected`。\n- **Default**：当未提供修饰符时适用——对包可见。未声明修饰符的方法或变量可以被包内的其他类访问。\n\
  \n下表总结了不同的访问修饰符及其影响：\n\n| 修饰符 | 类内部 | 包内 | 包外子类 | 包外 |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| Private | Y | N | N | N |\n| Public | Y | Y | Y | Y |\n| Protected\
  \ | Y | Y | Y | N |\n| Default | Y | Y | N | N |\n\n\n\n\n\n# 非访问修饰符\n非访问修饰符可用于访问\
  \ Java 中的各种功能。\n\n## Final\n用于确定变量、方法和类的最终实现。\n\n### Final 变量\n你只能显式地初始化一次 `final`\
  \ 变量。当你将一个变量声明为 `final` 时，你永远无法将其重新赋值为另一个对象。然而，请注意，你仍然更改对象内部存储的数据。这意味着虽然你可以更改对象的状态，但你无法更改引用。`final`\
  \ 修饰符通常与 `static` 配合使用，以根据常量值创建一个类变量。\n\n### Final 方法\n`final` 关键字用于防止子类修改方法。\n\n\
  ### Final 类\n`final` 修饰符用于防止其他类继承声明为 `final` 类的任何特性。\n\n### Static\n用于创建类方法或变量。\n\
  你可以使用此关键字创建一个唯一的变量（称为 `static variable` 或类变量），该变量将独立于该类的其他实例存在。你不能将局部变量声明为 `static`。\n\
  你还可以使用 `static` 关键字来创建一个方法（称为 `static method` 或类方法），该方法将独立于该类的其他实例存在。`Static` 方法仅识别并处理来自给定参数的数据，而不考虑变量。\n\
  你可以通过在类名后加上点 (`.`) 和变量或方法名来访问类方法和类变量。\n\n### Abstract\n用于创建抽象方法或类。\n\n### Abstract\
  \ 类\n当一个类被声明为 `abstract` 时，意味着你无法实例化该类。将类声明为 `abstract` 的唯一理由是扩展该类。你不能将一个类同时声明为\
  \ `final` 和 `abstract`，因为你无法扩展一个 `final` 类。使用 `abstract` 方法的类必须声明为 `abstract`。否则会导致编译错误。\n\
  \n### Abstract 方法\n由于在声明时没有实现，`abstract method` 的方法体派生自子类。`Abstract methods` 不能被声明为严格或\
  \ `final`。除非它也是一个 `abstract class`，否则扩展 `abstract class` 的类必须采用父类的 `abstract methods`。\n\
  包含至少一个 `abstract method` 的类应该被声明为 `abstract class`。相反，`abstract class` 不需要有 `abstract\
  \ methods`。\n示例：\n![00017.jpeg](img/Image00024.jpg)\n\n### Synchronized\n`synchronized`\
  \ 修饰符用于指示在任何给定时间只有一个线程可以访问该方法。你可以配合任何访问修饰符使用此关键字。\n示例：![00018.jpeg](img/Image00025.jpg)\n\
  \n## Volatile\n此关键字用于指示访问 `volatile variable` 的线程应该将其私有副本与存储在内存中的主副本合并。实际上，它将变量的所有缓存副本与主内存同步。你只能使用此修饰符定义私有或对象类型的实例变量。\n\
  示例：![00019.jpeg](img/Image00026.jpg)\n\n### Transient\n`transient` 关键字用于告诉编译器在序列化包含标记变量的对象时跳过该实例变量。\n\
  示例：![00020.jpeg](img/Image00027.jpg)\n\n# 第 8 章：决策与循环控制\n决策结构用于此类情况：当条件为真时必须执行一组指令，而当条件确定为假时，必须执行另一组指令。Java\
  \ 中提供了几种结构用于此类场景的编程。这些结构包括：\n\n## If 语句\n此语句用于需要测试条件的情况，如果发现条件为真，则需要执行该语句后续的代码块。该构造的语法为：\n\
  ```java\nif(condition){/*Body*/}\n```\n该构造的示例实现如下：\n```java\npublic class ifDemo\
  \ {\n    public static void main(String args[]) {\n        int i = 10;\n       \
  \ int j = 1;\n        if(i>j){\n            System.out.print(i);\n        }\n  \
  \  }\n}\n```\n\n## If else 语句\n此语句用于需要测试条件的情况，如果发现条件为真，则执行该语句后续的代码块，否则执行 `else`\
  \ 语句后续的代码块。该构造的语法为：\n```java\nif(condition){/*Body*/}else(/*Body*/)\n```\n该构造的示例实现如下：\n\
  ```java\npublic class ifElseDemo {\n    public static void main(String args[]) {\n\
  \        int i = 1;\n        int j = 0;\n        if(i>j){\n            System.out.print(i);\n\
  \        }else{\n            System.out.print(j);\n        }\n    }\n}\n```\n\n\
  ## 嵌套 if 语句\n此语句用于需要测试条件的情况，如果发现条件为真，则执行该语句后续的代码块，否则测试下一个条件。如果发现此条件为真，则执行与该条件对应的\
  \ `if` 语句的代码块。如果没有任何条件为真，则执行 `else` 语句后续的代码块。可以使用嵌套的 `if` 语句测试多个条件。嵌套 `if` 语句的语法为：\n\
  ```java\nif(condition1) {/*Body*/}else if (condition2) (/*Body*/}else {/*Body*/}\n\
  ```\n该构造的示例实现如下：\n```java\npublic class nestedIfDemo {\n    public static void main(String\
  \ args[]) {\n        int i = 0;\n        int j = 0;\n        if(i>j){\n        \
  \    System.out.print(i);\n        }else if(j>i) {\n            System.out.print(j);\n\
  \        }else {\n            System.out.print(\"Equal\");\n        }\n    }\n}\n\
  ```\n\n## Switch\n如果你有一个变量，并且需要根据变量的不同值执行不同的代码块，理想的构造是 `switch` 语句。该构造的语法为：\n```java\n\
  switch(variable){case <value1>:/*body*/break;case <value2>:/*body*/break;case <value3>:/*body*/break;default:/*body*/break;}\n\
  ```\n该构造的示例实现如下：\n```java\npublic class switchDemo {\n    public static void main(String\
  \ args[]) {\n        int i = 5;\n        switch (i) {\n            case 0:System.out.print(0);\
  \ break;\n            case 2:System.out.print(2); break;\n            case 5:System.out.print(5);\
  \ break;\n            default:System.out.print(999); break;\n        }\n    }\n\
  }\n\n\n## 条件运算符\nJava 还支持条件运算符，称为 `?:`。该运算符用于替换 `if else` 构造。它的语法为：\n```\nExpression1?\
  \ Expression2: Expression3\n```\n在这里，`Expression1` 是要测试的条件。如果条件为真，则执行 `Expression2`，否则执行\
  \ `Expression3`。\n\n## 循环控制\n有几种需要重复执行同一组指令的情况。例如，如果你需要对一组数字进行排序，你需要多次扫描集合以获得所需的排列。这种执行流被称为循环控制。简单来说，循环允许多次执行代码块的构造。Java\
  \ 支持用于循环的构造，包括 `while loop`、`for loop` 和 `do while loop`。\n`while loop` 迭代执行代码块，直到\
  \ `while loop` 指定条件为真。一旦条件失败，`while loop` 停止。\n`for loop` 允许在同一个构造中操作条件和循环变量。因此，你可以初始化循环变量、对其进行递/减，并运行循环直到该变量的条件为真。\n\
  `do while loop`  `while loop`。然而，`while loop` 在执行代码块之前检查条件。而在 `do while loop` 中执行代码块，然后检查条件。如果满足条件，再次循环，否则终止循环。可以说\
  \ `do while loop` 一旦实现至少执行一次。\n\n### 循环语句\n有两个专门用于循环的关键字，也被称为控制语句，因为它们允许控制从代码的一个部分转移到另一个部分。这些关键字是：\n\
  - `Break`：该关键字用于循环内部，终止执行流并直接从循环后的指令开始执行。\n- `Continue`：该关键字用于循环内部，跳过循环的剩余部分并移动到循环的第一语句。\n\
  \n为了帮助你理解循环如何执行，让我们取一个例子并使用三种类型的循环来实现。\n\n### For 循环实现\n```java\npublic class forDemo\
  \ {\n    public static void main(String args[]) {\n        int [] numberArray =\
  \ {100, 300, 500, 700, 900};\n        for(int i=0; i<5; i++) {\n            System.out.print(numberArray[i]);\n\
  \            System.out.print(\",\");\n        }\n        System.out.print(\"\\\
  n\");\n    }\n}\n```\n\n### While 循环实现\n```java\npublic class whileDemo {\n    public\
  \ static void main(String args[]) {\n        int [] numberArray = {100, 300, 500,\
  \ 700, 900};\n        int i = 0;\n        while(i<5) {\n            System.out.print(numberArray[i]);\n\
  \            System.out.print(\",\");\n            i++;\n        }\n        System.out.print(\"\
  \\n\");\n    }\n}\n```\n\n### Do While 循环实现\n```java\npublic class doWhileDemo {\n\
  \    public static void main(String args[]) {\n        int [] numberArray = {100,\
  \ 300, 500, 700, 900};\n        int i = 0;\n        do {\n            System.out.print(numberArray[i]);\n\
  \            System.out.print(\",\");\n            i++;\n        } while (i<5);\n\
  \        System.out.print(\"\\n\");\n    }\n}\n```\n\n### 增强型 For 循环\nJava 还支持增强循环结构，可用于数组元素。该循环构造的语法为：\n\
  ```java\nfor(declaration : expression) {\n  /*Body*/\n}\n```\n增强型循环的声明部分用于声明变量。该变量应局部于\
  \ `for` 循环，且类型必须与数组元素的类型相同。变量的值始终等于循环中遍历的数组元素。增强型循环的示例实现如下：\n```java\npublic class\
  \ forArrayDemo {\n    public static void main(String args[]) {\n        int [] numberArray\
  \ = {100, 300, 500, 700, 900};\n        for(int i : numberArray ) {\n          \
  \  System.out.print( i );\n            System.out.print(\",\");\n        }\n   \
  \     System.out.print(\"\\n\");\n    }\n}\n```\n\n## 异常层次结构\nJava 有一个名为 `java.lang.Exception`\
  \ 的内置类，所有异常属于此类。此外，`Throwable` 类是 `Exception` 类的父类。`Throwable` 的另一个子类是 `Error` 类。所有溢出错误属于\
  \ `Error` 类。`Exception` 类有两个子类，即 `RuntimeException` 类和 `IOException` 类。作为 `Throwable`\
  \ 类的一部分，Java 提供的方法列表如下：\n\n- `public String getMessage()`：调用时返回遇到的异常的详细描述。\n- `public\
  \ Throwable getCause()`：调用时返回包含异常原因的消息。\n- `public String toString()`：返回异常的详细描述以及类名。\n\
  - `public void printStackTrace()`：带有栈跟踪的 `toString()` 输出到标准错误流 `System.err`。\n-\
  \ `public StackTraceElement [] getStackTrace()`：在某些需要访问栈元素的场景下，该方法返回一个数组，将栈的每个元素保存到数组中。栈底部是数组的最后一个元素。\n\
  - `public Throwable fillStackTrace()`：将当前栈的内容添加到栈跟踪中并返回相同的数组。\n\n## 捕获异常\n捕获异常的标准方法是使用\
  \ `try` 和 `catch` 关键字及其代码。此 `try catch` 块需要实现，以包含预期抛出异常的代码。这里重要的是，预期抛出异常的代码被称为保护代码。`try\
  \ catch` 的实现语法为：\n```java\ntry {\n  /*Protected code*/}\ncatch(Exception exc1) {\n\
  \  /*Catch code*/}\n}\n```\n预期抛出异常的代码放在 `try` 块中。如果发生异常，则在 `catch` 块中执行相应的异常处理。如果抛出的异常与\
  \ `catch` 语句中定义的异常匹配，则执行 `catch` 块。\n\n### 实现 Catch 块\n代码块可能会导致多个异常。为了满足这一需求，允许实现多个\
  \ `catch` 块。此类实现的语法如下：\n```java\ntry {\n  /*Protected Code*/}catch(ExpType1 exp1)\
  \ {\n  /*Catch block 1*/)catch(ExpType2 exp2) {\n  /*Catch block 2*/)catch(ExpType3\
  \ exp3) {\n  /*Catch block 3*/}\n}\n```\n上述语法演示了三个 `catch` 块的实现。然而，你可以实现你需要的任意 `catch`\
  \ 块。当此代码执行时，执行保护代码。如果发生异常，异常类型与第一个 `catch` 块的异常进行匹配。如果异常类型不匹配，则忽略 `catch` block\
  \ 1，尝试匹配第二个 `catch` 块的异常类型。哪一个 `catch` 块与抛出的异常类型相同，就执行相应的 `catch` 块。\n\n# 第 9 章：ADT、数据结构和\
  \ Java 集合\n\n## 抽象数据类型 (ADT)\n抽象数据类型 (ADT) 是数据及其上允许的操作的逻辑描述。ADT 定义为从用户的角度看数据。ADT\
  \ 关注数据的可能值及其暴露的接口。ADT 不关心数据结构的实际实现。例如，用户想要存储一些整数并找到它们的平均值。该数据结构的 ADT 将支持两个函数，一个用于添加整数，另一个用于获取平均值。该数据结构的\
  \ ADT 不会讨论具体将如何实现。![OEBPS/Image00028.jpg)\n\n## 数据结构\n数据结构是数据的具体表示，被定义为从程序员的角度看数据。数据结构表示数据将如何存储在内存中。所有数据结构都有自己的优缺点。根据问题的类型，我们选择最适合它的数据结构。例如，我们可以数据存储在\
  \ `array`、`linked-list`、`stack`、`queue`、`tree` 等。\n注意：在本章，我们将学习各种数据结构及其 API。这样用户就可以在不知道内部实现的情况下使用它们。\n\
  \n## Java 集合框架\nJava 编程语言提供了 `JAVA Collection Framework`，它是一组高质量、高性能且可重用的数据结构和算法。![OEBPS/Image00029.jpg)\n\
  使用 Java 集合框架的优势如下：\n\n\n\n\n\n1. 程序员不需要重复实现基础的数据结构和算法。这此避免了重复造轮子。因此，程序员可以投入更多精力处理业务逻辑。\n\
  \n2. `JAVA Collection Framework` 的代码经过了良好的测试，是高质量、高性能的代码。使用它们可以提高程序的质量。\n\n3. 由于在\
  \ `Collections` 框架中实现的基础数据结构和算法可以被复用，开发成本得以降低。\n\n4. 由于大多数 Java 开发者都使用 `Collection`\
  \ 框架，因此便于审查和理解其他开发者编写的程序。此外，集合框架有完善的文档。\n\n## Array（数组）\n`Array` 表示多个相同数据类型元素的集合。\n\
  \n### 数组 ADT 操作\n以下是数组的 API：\n\n1. 在 `kth` 位置添加一个元素。值可以在 `O(1)` 常数时间内存储在数组的 `Kth`\
  \ 位置。我们只需要在 `arr[k]` 处存储值即可。\n2. 读取存储在 `kth` 位置的值。访问数组中某个索引处存储的值也是 `O(1)` 常数时间。我们只需要读取存储在\
  \ `arr[k]` 的值即可。\n3. 用新值替换存储在 `kth` 位置的值。时间复杂度：`O(1)` 常数时间。\n\n示例：\n```java\npublic\
  \ class ArrayDemo {\n    public static void main(String[] args) {\n        int[]\
  \ arr = new int[10];\n        for (int i = 0; i < 10; i++){\n            arr[i]\
  \ = i;\n        }\n    }\n}\n```\n`JAVA` 标准数组是固定长度的。有时我们不知道需要多少内存，所以会创建一个更大的数组，这会浪费空间。如果数组已满，且我们想要添加比当前需要更多的值，我们需要创建一个足够空间的新数组，然后将旧数组复制到新数组。为了避免这种手动的重新分配和复制，可以使用\
  \ `JAVA Collection framework` 中的 `ArrayList` 或 `Linked Lists`（链表）来存储数据。\n\n### JAVA\
  \ Collections 中的 ArrayList 实现\n`JAVA Collections` 中的 `ArrayList<E>` 是一个实现了 `List<E>`\
  \ 接口的数据结构，这意味着它可以包含重复元素。`ArrayList` 是作为动态数组的实现，可以根据需要增长或缩小。（内部使用数组，当数组满时，会分配一个更大的数组，并将旧数组的值复制到新数组）。\n\
  \n示例：\n```java\nimport java.util.ArrayList;\npublic class ArrayListDemo {\n    public\
  \ static void main(String[] args) {\n        ArrayList<Integer> al = new ArrayList<Integer>();\n\
  \        al.add(1); // 将 1 添加到列表末尾\n        al.add(2); // 将 2 添加到列表末尾\n        System.out.println(\"\
  Contents of Array: \" + al);\n        System.out.println(\"Array Size: \" + al.size());\n\
  \        System.out.println(\"Array IsEmpty: \" + al.isEmpty());\n        al.remove(al.size()\
  \ -1); // 移除数组的最后一个元素\n        al.removeAll(al); // 移除数组的所有元素\n        System.out.println(\"\
  Array IsEmpty: \" + al.isEmpty());\n    }\n}\n```\n输出：\n```\nContents of Array:\
  \ [1, 2]\nArray Size: 2\nArray IsEmpty: false\nArray IsEmpty: true\n```\n\n## Linked\
  \ List（链表）\n![Linked List](img/Image00030.jpg)\n链表是一种动态数据结构，内是在运行时分配的。链表的概念不是连续存储数据。链表的节点包含一个指向列表中下一个元素的链接。从性能上来说，链表比数组慢，因为无法直接访问链表元素。当我们预先不知道要存储的元素数量时，链表是一种很有用的数据结构。链表有许多类型：线性链表、循环链表、双向链表、双向循环链表等。\n\
  \n### 链表 ADT 操作\n以下是链表的 API。\n- `Insert(k)`：在列表开头添加 `k`。在列表开头插入一个元素。只需创建一个新元素并移动指针，使得该新元素成为列表的第一个元素。此操作将耗时\
  \ `O(1)` 常数时间。\n- `Delete()`：删除列表头的元素。在列表开头删除一个元素。我们只需要移动一个指针。此操作也将耗时 `O(1)` 常数时间。\n\
  - `PrintList()`：显示列表的所有元素。从第一个元素开始，然后沿着指针移动。此操作将耗时 `O(N)`。\n- `Find(k)`：找到值为 `k`\
  \ 的元素的位置。从第一个元素开始并沿着指针移动，直到找到我们寻找的值或到达列表末尾。此操作将耗时 `O(N)`。注意：二分查找不适用于链表。\n- `FindKth(k)`：找到位置在\
  \ `k` 的元素。从第一个元素开始并沿着链接，直到到达第 `k` 个元素。此操作将耗时 `O(N)`。\n- `IsEmpty()`：检查列表中的元素数量是否为零。只需检查列表的头指针，如果为\
  \ `Null`，则列表为空，否则不为空。此操作将耗时 `O(1)`。\n\n### JAVA Collections 中的 LinkedList 实现\n`by\
  \ JAVA Collections` 中的 `LinkedList<E>` 是一个同样实现了 `List<E>` 接口的数据结构。\n\n示例：\n```java\n\
  import java.util.LinkedList;\npublic class LinkedListDemo {\n    public static void\
  \ main(String[] args) {\n        LinkedList<Integer> ll = new LinkedList<Integer>();\n\
  \        ll.addFirst(2); // 2 被添加到列表开头\n        ll.addLast(10); // 10 被添加到列表末尾。\n\
  \        .addFirst(1); // 1 被添加到列表开头。\n        ll.addLast(11); // 11 被添加到列表末尾。\n\
  \        System.out.println(\"Contents of Linked List: \" + ll);\n        ll.removeFirst();\n\
  \        ll.removeLast();\n        System.out.println(\"Contents of Linked List:\
  \ \" + ll);\n    }\n}\n```\n输出：\n```\nContents of Linked List: [1, 2, 10, 11]\n\
  Contents of Linked List: [2, 10]\n```\n\n## Stack（栈）\n![Stack](img/Image00031.jpg)\n\
  `Stack` 是一种特殊的数据结构，遵循后进先出（LIFO）策略。这意味着最后添加的元素最先移除。\n栈的各种应用包括：\n1. 使用栈实现的递归调用。\n\
  2. 后缀表达式求值。\n3. 使用栈实现的回溯。\n4. 树和图的深度搜索。\n5. 十进制转换。\n\n### 栈 ADT 操作\n- `Push(k)`：将值\
  \ `k` 推到栈顶。\n- `Pop()`：从栈顶移除元素并返回其值。\n- `Top()`：返回栈顶元素的值。\n- `Size()`：返回栈元素的数量。\n\
  - `IsEmpty()`：确定栈是否为空。如果栈为空则返回 true，否则返回 false。\n注意：上述所有栈操作的实现复杂度均为 `O(1)`。\n\n\
  ### Java Collection 中的栈实现\n栈通过调用 `Stack<T>` 类的 `push` 和 `pop` 方法实现。\n\n示例：\n```java\n\
  public class StackDemo {\n    public static void main(String[] args) {\n       \
  \ Stack<Integer> stack = new Stack<Integer>();\n        int temp;\n        stack.push(1);\n\
  \        stack.push(2);\n        stack.push(3);\n        System.out.println(\"Stack\
  \ : +stack);\n        System.out.println(\"Stack size : +stack.size());\n      \
  \  System.out.println(\"Stack pop : +stack.pop());\n        System.out.println(\"\
  Stack top : +stack.peek());\n        System.out.println(\"Stack isEmpty : +stack.isEmpty());\n\
  \    }\n}\n```\n输出：\n```\nStack : [1, 2, 3]\nStack size : 3\nStack pop : 3\nStack\
  \ top : 2\nStack isEmpty : false\n```\n栈也可以通过调用 `ArrayDeque<T>` 类的 `push` 和 `pop`\
  \ 方法实现。`JDK` 提供了 `ArrayDeque<T>` 和 `Stack<T>`。我们可以使用这两个类，但 `ArrayDeque<T>` 有一些优势：\n\
  \n1. 第一个原因是 `Stack<T>` 没有继承 `Collection` 接口。\n2. 第二 `Stack<T>` 继承自 `Vector<T>`，因此可以随机访问，这破坏了栈的抽象性。\n\
  3. 第三个 `ArrayDeque` 比 `Stack<T>` 更高效。\n\n## Queue（队列）\n`Queue` 是一种先进先出（FIFO）类型的数据结构。先进入队列的元素将先被移除，以此此类推。\n\
  `Queue` 有以下应用场景：\n1. 共享资源的访问（例如打印机）\n2. 多程序设计\n3. 消息队列\n4. 使用队列实现的 BFS（广度优先搜索）、图或树的广度遍历。\n\
  \n\n\n\n\n### 队列 ADT 操作\n\n- `Add(K)`: 将新元素 `k` 添加到队列的末尾。\n- `Remove()`: 从队列头部移除一个元素并返回其值。\n\
  - `Front()`: 返回队列头部元素的值。\n- `Size()`: 返回队列中的元素数量。\n- `IsEmpty()`: 如果队列为空则返回 1，否则返回\
  \ 0。\n\n> **注意：** 以上所有队列操作均在 `O(1)` 时间复杂度内实现。\n\n## JAVA Collection 中的队列实现\n\n`ArrayDeque<T>`\
  \ 是双端队列的类实现。如果我们使用 `add()`、`remove()` 和 `peek ()`，它的行为将表现像一个队列。（此外，如果我们使用 `push()`、`pop()`\
  \ 和 `peekLast()`，它的行为将得像一个栈。）\n\n### 示例：\n```java\nimport java.util.ArrayDeque;\n\
  public class QueueDemo {\n    public static void main(String[] args) {\n       \
  \ ArrayDeque<Integer> que = new ArrayDeque<Integer>();\n        que.add(1);\n  \
  \      que.add(2);\n        que.add(3);\n        System.out.println(\"Queue : \"\
  +que);\n        System.out.println(\"Queue size : \"+que.size());\n        System.out.println(\"\
  Queue peek : \"+que.peek());\n        System.out.println(\"Queue remove : \"+que.remove());\n\
  \        System.out.println(\"Queue isEmpty : \"+que.isEmpty());\n    }\n}\n```\n\
  **输出：**\n```\nQueue : [1, 2, 3]\nQueue size : 3\nQueue peek : 1\nQueue remove :\
  \ 1\nQueue isEmpty : false\n```\n\n# 第 10  own：文件处理\n\n本章讨论了读取、写入、创建和打开文件的细节。有大量的文件\
  \ I/O 类和方法供选择。\n\n## 读取文本文件\n\n读取文本文件是 Java 中的的一项关键能力，具有许多实际应用。`FileReader`、`BufferedReader`\
  \ 和 `Scanner` 是 Java 中读取纯文本文件的有用类。每个种类都具有特定的特性，使其能够胜任处理特定情况。\n\n### BufferedReader\n\
  这种技术从字符输入流中读取文本。它缓冲了字符、数组和行，以便高效读取。你可以指定缓冲区类型或使用标准类型。出于大多数原因，默认值已经足够大。特别是，每次从 `Reader`\
  \ 产生的读取操作都会导致基本性质或字节流进行相应的读取操作。因此，建议在任何 `Reader` 包装层包装一个 `BufferedReader`，因为读取操作（如\
  \ `FileReaders` 和 `InputStreamReaders`）开销可能是昂贵的。\n\n例如：\n```java\nBufferedReader\
  \ in = New BufferedReader(Reader in, int size)\n```\n\n### FileReader\n用于读取字符文档的便利类。该类的构造函数假设默认字符格式和默认字节缓冲区大小是合适的。\n\
  \n### Scanner\n一种简单的文本扫描器，使用正则表达式来解析原始类型和字符串。`Scanner` 使用分隔符模型将其条目拆分为符合定义空白符的标记（tokens）。通过不同的\
  \ `next` 技术，生成的标记随后可以转换为不同类型的值。\n\n```java\nimport java.io.File;\nimport java.util.Scanner;\n\
  public class ReadFromFileUsingScanner {\n    public static void main(String[] args)\
  \ throws Exception {\n        // filepath 现在被设为参数以便进行扫描\n        File example =\
  \ new File(\"C:\\\\Users\\\\userName\\\\Desktop\\\\example.txt\");\n        Scanner\
  \ example1 = new Scanner(file);\n        while (example1.hasNextLine())\n      \
  \      System.out.println(example1.nextLine());\n    }\n}\n```\n\n### 使用 Scanner\
  \ 类但不不使用循环：\n```java\nimport java.io.File;\nimport java.io.FileNotFoundException;\n\
  import java.util.Scanner;\npublic class example {\n    public static void main(String[]\
  \ args) throws FileNotFoundException {\n        File example = new File(\"C:\\\\\
  Users\\\\userName\\\\Desktop\\\\example.txt\");\n        Scanner example1 = new\
  \ Scanner(file);\n        // 我们使用 \\\\Z 作为分隔符\n        example1.useDelimiter(\"\\\
  \\Z\");\n        System.out.println(example1.next());\n    }\n}\n```\n\n### 在 Java\
  \ 中将文本文件作为 String 读取\n```java\npackage io;\nimport java.nio.file.*;\npublic class\
  \ example {\n    public static String example(String fileName) throws Exception\
  \ {\n        String example1 = \"\";\n        example1 = new String(Files.readAllBytes(Paths.get(fileName)));\n\
  \        return example1;\n    }\n    public static void main(String[] args) throws\
  \ Exception {\n        String example1 = example(\"C:\\\\Users\\\\userName\\\\Desktop\\\
  \\example.java\");\n        System.out.println(example1);\n    }\n}\n```\n\n###\
  \ 写入文本文件\n\n你可以使用其中一种写入方法向文件写入字节或行。写入方法包括：\n- `Write(Path, byte[], OpenOption...)`\n\
  - `Write(Path, Iterable<? extends CharSequence>, Charset, OpenOption...)`\n\n##\
  \ 重命名和删除文件\n\n### 重命名\n在 Java 中，`File` 类中有一个名为 `renameTo(fileName)` 的方法，可以使用它来重命名文件。\n\
  \n### 删除文件\n使用 java 程序保存的文件将被永久删除，而不会移动到垃圾箱/回收站。使用 `java.io.File.delete` 会从文件或文件夹中删除此抽象路径。使用\
  \ `java.nio.file.files.deleteIfExists` 将删除该文件（如果它存在）。\n\n# Java 进阶主题\n\n## 泛型 (Generics)\n\
  在任何非平凡的软件项目中，Bug 是常态。仔细的规划、编程和测试有助于减少它们的无不在，但它们总会找到进入系统的方法。这随着新功能的引入以及代码库规模和复杂性的增加变得越来越明显。\n\
  \n幸运的是，某些 Bug 比其他 Bug 更容易检测。例如，编译时 Bug 可以被识别；你可以利用错误代码来确定问题并立即解决。然而，运行时 Bug 可能要困难得多；它们并不总是立即发生，当它们发生时，可能距离真实原因很远。泛型通过创建在编译时可以识别的\
  \ Bug 来帮助稳定软件。\n\n### 泛型类型\n泛型形式（Generic form）是一种经过类型参数化的通用泛型类别。可以通过修改一个简单的类来展示这种思想。考虑一个适用于任何排序的泛型箱。它只需要提供两个技术：`set()`（向箱添加项）和\
  \ `get()`（检索）。由于它们的方法接收或返回对象，你可以传递任何内容，只要它不是原始类型。无法在编译时检查该类的使用情况。软件的一个部分可能向箱中放入整数并期望获取整数，而另一部分可能错误地处理字符串，导致运行时出现错误。\n\
  \n简而言之，泛型允许在定义课程、接口和技术时对种类（类和对象）进行参数化。与声明中更熟悉的正式参数一样，类型参数为你提供了不同的输出。区别在于，值是正式参数的输入，而种类是类型参数的答案。使用泛型的代码比非泛代码具有许多优势。通过使用泛型，程序员可以引入操作不同种类集合的通用算法，这些算法是可以定制的，并且安全且易于阅读。\n\
  \n等待：这与你已经熟悉的变量命名规范形成了鲜明对比，并有一个极佳的原因：如果没有这种约定，很难区分类型变量和普通类或对象名称之间的区别。最常用的类型参数名称是：\n\
  \n\n\n\n\n- `E` - （Element，Java 集合框架中广泛使用）\n- `K` - Key（Key）\n- `N` - 数字（Number）\n\
  - `T` - 类型（Type）\n- `V` - 值（Value）\n- `S`, `U`, `V` 等 – 第 2、3、4 类型\n\n\n\n你将在整个\
  \ JDK 和 API 中看到这些名称。\n\n### 调用和实例化泛型类型\n\n为了在你的系统中提到泛型容器类别，必须执行泛型类型调用，将 `T` 带入某个具体值，例如\
  \ `Integer`：`Box<Integer> integerBox;`\n\n你可能认为泛型排序的调用类似于普通的过程调用，但它并不是在过程中添加了一个断言，而是将一个类型参数——在本例中为\
  \ `Integer`——传递给箱子类别本身。\n\n许多设计者交替使用“类型参数”（type parameter）和“类型语句”（type statement）这两个词，但定义并不相同。在编码时，为了生成参数化类型，需要提供排序参数。因此，`Foo\
  \ < T >` 中的 `T` 是类型参数，而 `Foo < String > f` 是一个类型声明。在使用这些词时，本类遵循这一概念。\n\n与任何其他变量语句一样，此软件不会生成箱的新条目。它只是声明\
  \ `integerBox` 将具有指向“Integer 盒子”的引用，这就是读取 `Box < Integer>` 的方式。泛型类型调用通常被称为参数化类型。\n\
  \n要实例化此类，像通常一样使用 `new` 关键字，但在类名和括号之间放置 `<Integer>`：`Box<Integer> integerBox = new\
  \ Box<Integer>();`\n\n## 菱形\n\n在 Java 的最新版本中，可以使用空类型参数集（`< >`）替换调用泛型类构造函数所需的类型参数，只要编译器能够确定或从上下文中推类型参数。这对尖括号\
  \ `< >` 被称为“菱形”（The Diamond）。例如，你可以使用之前的声明来生成 `Box < Integer>` 的实例：`Box<Integer>\
  \ integerBox = new Box<>();`\n\n## 泛型方法\n\n泛型技术是实现自身排序参数的技术。这类似于泛型类型声明，但类型参数的作用范围限制在声明它的方法中。除了泛型类构造外，还允许静态和非静态泛型技术。\n\
  \n泛型技术的语法涉及在过程返回类型之前出现在尖括号内的类型参数列表。对于静态泛型技术，类型参数段必须出现在方法的返回类型之前。`Util` 类涉及一个比较两个\
  \ `Pair` 项的泛型技术。\n\n```\nPair<Integer, String> ex1 = new Pair<>(49, \"string1\"\
  );\nPair<Integer, String> ex2 = new Pair<>(64, \"string2\");\nboolean comparison\
  \ = Util.<Integer, String>compare(ex1, ex2);\n```\n\n## 边界类型参数\n\n有时，你希望限制在参数化类型作为语句时可以使用的种类。例如，一个处理图形的技术只能识别\
  \ `Number` 及其或其子类。这就是限制排序参数的用途。列出类型参数的名称以指示定义的类型参数，并伴有扩展关键字 `extends`，然后是上界（在本例中为\
  \ `Number`）。注意，`extends` 在此语境下通常表示“继承”（如类）或“实现”（如接口）。\n\n## 多边界\n\n类型参数可以有多个边界。具有多个边界的类型变量是边界中列出的所有类型的子类。如果其中一个边界是类，必须首先指定。例如：\n\
  \n```java\nclass X { /* ... */ }\ninterface Y { /* ... */ }\ninterface Z { /* ...\
  \ */ }\nclass R <T extends X & Y & Z> { /* ... */ }\n```\n\n如果未首先指定边界 `X`，将得到编译时错误：\n\
  ```java\nclass R <T extends Y & X & Z> { /* ... */ } // 编译错误\n```\n\n# 第 11 章：集合\n\
  \n## 集合的函数化\n\n当我们外部化代码时，我们暴露了每一个步骤。这是命令式编程的标志。然而，函数式编程的一个反复出现的主题是完全相反的想法：代码内部化。代码内部化的行为是将细节隐藏在函数内部。但函数式编程通过将日常编程的微模式转换为函数进一步推进了这一想法。例如，遍历数据（无论是使用迭代器、`for-loops`\
  \ 还是 `while-loops`）都是这些微模式之一。函数式编程改变了我们思考它们的方式。\n\nJava 的函数化工作如果没有对其集合库（即 `Collection`、`Map`、`List`\
  \ 和 `Set` 接口）进行改造将是不完整的。因为迭代通常在集合上进行，而它们是 Java 程序的基石。这是函数化工作发生的自然场所。但进行任何类型的重大更改（例如向\
  \ `Collection` 接口添加新方法）都会破坏所有 Java 8 之前编写程序的向后兼容性。这不仅包括 JDK 自身的扩展 `Collection` 接口的层次结构，还包括任何开源或闭源的第三方库以及内部类。Java\
  \ 的设计者从未、永远不会采取这种策略。然而，更改是必要的；该库引入于 1998 年，在软件行业中是永恒的，并且已经显示出它的老态。\n\n引入默认方法（default\
  \ methods）的动力是为了现代化和函数化集合库。默认方法是恰恰当的药剂，因为它们允许在层次结构的根部添加行为，而不干扰依赖类。子类可以选择继承或覆盖该行为。与添加新接口方法不同，子类可以在无需重新编译的情况下自动接受新的默认方法。实现了立即兼容。默认方法被证明是很有用的，但它们的存在归功于函数化集合的需求。\n\
  \n默认方法的引入是由现代化和函数化集合库的需求推动的。函数式编程另一个反复出现的主题是并行化。简单来说，函数式编程为并行处理提供了更好的陷阱。结果，由于 `Streams`\
  \ 的引入，集合库得到了增强，以从多核 CPU 中受益。现在我们已经学习了 Java 的标准接口，可以开始将这些知识应用于集合。\n\n### Collection\
  \ 接口\n\n我们通过查看 `Collection` 接口中的一个新默认方法开始，适用于列表和集合。这是 `forEach()` 方法：它遍历整个集合，让 `Consumer`\
  \ 决定对每个元素做什么。这是内部迭代的概念。与外部迭代相反，关于如何迭代的细节在代码中是指定的。我们将展示这些函数化方法的示例，在 Java 8 时代已成为标准。为了开始，让我们打印集合的内容：`forEach()`\
  \ 方法有非常广泛的适用范围。它是遍历集合的更方便的方法。然而，作为声明式构造，有些事情是无法实现的。最值得注意的是，你不能像在 `while-loop` 那样改变状态，必须以函数方式思考。现在看\
  \ `Collection` 接口中的另一个新方法：`removeIf()` 它内部化了遍历和删除的过程，只需告知删除的条件。使用熟悉的 `predicate`\
  \ 接口，我们可以轻松确定使用哪种 lambda。为了替换 `List` 的所有内容，可以使用 `replaceAll()`：它使用 `UnaryOperator`\
  \ 作为其函数接口。`removeIf()` 和 `replaceAll()` 都适用于所有子类，前提是底层类必须支持删除，否则将抛出异常。这些示例展示了函数式编程的紧凑性，大部分工作由函数完成。\n\
  \n### Map 接口\n\n在 map 中使用列表作为值的最大烦恼之一是，在添加、更新或删除元素之前需要检查是否存在。首先，必须尝试提取列表，如果没有找到则创建它。例如，假设我们有一个实现\
  \ `Map` 的数据库。map 的键是年份，其值是该年份的列表。Java 8 通过这些默认方法提供了更好的替代方案：让我们从 `compute` 方法开始。每个变体都允许映射函数生成\
  \ map 的值。对于 `computeIfPresent()` 和 `computeIfAbsent()`，映射是有条件的发生的。所以通过这些方法，我们可以重构之前的代码：注意列表的创建是由\
  \ `computeIfAbsent()` lambda 处理的。当需要将电影添加到列表时，通过 `compute()` 方法 `add()` 永远不会抛出 `NullPointerException`，因为列表保证已经创建。在这种情况下，使用\
  \ `computeIfAbsent()` 方法是大此了，我们最好使用 `putIfAbsent()`：此方法不需要 lambda，而是给定一个值而不是计算值。尽管没有使用\
  \ lambda，这仍然是一种函数式方法。它证明了你可以不一定使用 lambda 以函数式表达代码。如果你需要提取数据，可以使用更具函数式的方法 `getOrDefault()`\
  \ 方法：你也可以使用 `merge()` 方法作为替代方案。它有助于检查列表的存在性。在下面的示例中，如果键（年份）在 map 中不存在，它会将值（标题）放入\
  \ map 中。如果存在，它允许 `BiFunction` 决定对两个列表做什么：可以这样使用它。`BiFunction` 也可以返回 `null`，这告诉 `merge`\
  \ 删除该键。结论是，我们删除了检查元素存在的开销代码，现在可以关注真正重要的事情：定义如何创建列表以及如何将元素添加到列表中。map 接口已增加其他函数式方法，如\
  \ `forEach()`、`replace()` 和 `replaceAll()`，并使用了相同的代码内部化原理。完整列表请附录。\n\n### Spliterator\n\
  \n集合库在并发访问方面仍然受到相同的限制。一如既往，你必须选择与线程安全需求相应的集合库类。这是因为上述的新方法只是运行在相同底层数据结构上的函数式抽象。这些方法并不适用于函数式编程的并行处理方法，因为它们仍然基于多个线程修改集合并同步访问底层数据的概念。然而，存在一种兼容的新的\
  \ Java 8 抽象。`Spliterator` 接口的前提是划分数据并将其交给不同的线程。可以从 `Collection` 接口（包括 `List` 和 `Set`）获取\
  \ `Spliterator`。`Spliterator` 接口的核心是这三个方法：`split()` 将数据分为二。它创建一个包含一半数据的新 `Spliterator`，并将另一部分留在原始对象中。`tryAdvance()`\
  \ 是一次一次变体，返回下一个元素，如果列表耗尽则返回 null。Spliterator 本身不处理处理，但提供了处理的抽象。这是该概念的实际操作：`forEachRemaining()`\
  \ 并行化搜索以确定其是否在列表中。\n\n\n\n\n## 类 (Classes)\n这些是你语言的组织工具。它们可以被看作是可以存放或存储对象的盒子，并对相似的对象进行分类。你可以为类命名任何你喜欢的名称，但将以方式或其他方式具有相似特征的对象放在同一个类中是一个良好的编程习惯。\n\
  \n## 对象 (Object)\n对象是你代码中具有状态和行为的实体。这些实体可以是颜色、纹理、形状等。你通常会将这些对象归类到具有相似对象的类中。因此，如果你有一个关于狗的类，你可能会不同类型的狗放在同一个类中。\n\
  \n## 方法 (Method)\n这是编程中用于描述行为的术语。你可以根据需要使用任意数量的方法。你通过这种方式来操作数据，并且动作将根据你正在处理或使用的方法来执行。如果不使用正确的方法，你的程序将不知道确切地该做什么。\n\
  \n## 实例变量 (Instant variable)\n这些指的是你正在处理的单个对象。每个对象都使用一组独特的变量进行分类，这些变量就像指纹一样用于识别你的对象。在创建对象时，可以使用某些值为对象分配正确的变量。这就是编写\
  \ C++ 代码的基础。你应该花些时间在编译器中编写上面的代码，通过练习来理解你在这里应该做什么。我们稍后将查看这些代码可以实现的一些功能，但这是一个很好的开始点。\n\
  \n### C++ 数据类型\n与你可能想要使用的其他编程语言一样，在 C++ 代码中也会出现很多数据点。你经常会处理变量，例如，变量只是让你在计算机内存中预留的区域，以确保代码的不同部分保持安全。在处理\
  \ C++ 语言时，我们能够关注很多数据点，这些包括：\n\n1. 布尔型 (Boolean)\n2. 双精度浮点型 (Double floating point)\n\
  3. 浮点型 (Floating point)\n4. 整数 (Integer)\n5. 字符 (Character)\n6. 空 (Valueless)\n\
  7. 宽字符 (Wide character)\n\n### C++ 函数\n我们还需要查看一些在使用 C++ 语言时会遇到的函数。函数非常简单，它只是为了执行某项任务的一组语句。你用\
  \ C++ 编写的每个程序至少包含一个函数，即 `main()` 函数，但你可能需要添加更多函数以使代码按照我们想要的方式运行。你可以通过多种不同的方式实现这一点。首先，我们可以选择根据我们希望其运行的方式将代码拆分为几个函数。你决定如何划分代码以及使用多少个函数取决于你以及你试图在代码中编写的内容。但大多数程序员会以某种方式进行划分，使得每个函数都能独立完成自己的任务。\n\
  \n函数声明会告诉编译器函数名称、随之来的参数以及我们将看到的返回类型。但请记住，我们看到的函数定义位于该函数的实际体内部。我们在 C++ 库中看到的标准库能够为我们提供许多内置在程序中的函数，我们可以在任何需要的时候调用它们。例如，如果我们使用\
  \ `strcat()` 函数，它可以用来帮助我们拼接两个字符串。然后，我们可以使用 `memcpy()` 来帮助我们将内存的某一个位置复制到另一个位置。这些只是你能够使用的不同类型的函数，你会发现它们每一个的工作方式都是相似的。\n\
  \n考虑到这一点，我们需要更进一步，实际上查看我们如何在 C++ 中应用函数。你可以在定义函数时使用的代码包括：\n\n```Return type function\
  \ name (parameter list) {Body of the function}\n```\n\n这些函数定义由函数头和函数体组成。函数的各个组成部分包括以下内容：\n\
  \n- **返回类型 (Return type)**：你正在处理的函数可能会返回一个值，你将使用返回类型的值在此返回某些内容。某些函数可以执行你想要的操作而不向你返回值。使用我们上面使用的语法，你将得到一个\
  \ `void` 结果。\n- **函数名称 (Function name)**：这是你给函数起的名称。当你将函数名与参数结合时，你就得到了所谓的函数签名（function\
  \ signature）。\n- **参数 (Parameters)**：参数是一个占位符。当你调用函数时，你将一个值传递给参数。这个值被称为实际参数或参数（argument）。参数列表将引用参数的数量、顺序和类型。编写一个完全没有参数的函数也是可能的。\n\
  - **函数体 (Function body)**：最后，函数体将包含一组定义函数所执行的语句。\n\n很多时候，我们可以使用函数来帮助完成代码的某些工作，并确保我们设置好并就绪。务必练习这些函数，看看它们如何满足我们的需求。\n\
  \n### 修饰符类型 (Types of Modifiers)\n在你在 C++ 中执行某些代码时，你会发现可以使用 `char`、`double` 和 `int`，以便其之前的修饰符生效。我们在这里讨论的修饰符用于帮助我们更改该基类型的含义，使其适应我们试图创建的任何程序或情况。我们能够处理的数据有多种类型的修饰符，这些包括\
  \ `signed`、`unsigned`、`long` 和 `short`。\n\n这四种修饰符适用于我们拥有的任何整数基类型。你可以使用 `signed`\
  \ 和 `unsigned` 来处理 `char`，然后 `long` 可以用于 `double`。C++ 还将让我们更容易地使用简写符号来处理这些整数。这意味着你可以使用这些词，而不需要添加\
  \ `int` 部分，因为这是总是隐含的。\n\n### 限定符 (Qualifiers)\n我们还有不同类型的限定符来让你的 C++ 代码正常工作。以下你可以使用的几种类型的限定符，用于为其先前的变量提供一些额外信息：\n\
  \n- **常量 (const)**：带有 `const` 的对象在程序执行期间无法被更改。\n- **易变 (volatile)**：易变修饰符会告诉编译器你可以更改值，但这些更改可能不是由程序显式指定的。\n\
  \n\n\n\nRestrict：被限定为限定的指针最初是访问其所指向对象的唯一手段。\n\n# 第 2 章：基础设施\n\n### 数组 (Array)\n\
  `Array` 是一种数据结构，用于存储相同数据类型的元素的顺序集合。例如，在下面的代码中，我声明了两个不同数据类型的数组：一个字符数组和一个整数型数组：\n\n\
  ```cpp\n#include \"stdafx.h\"\n#include <iostream>\nint main(int argc, char* argv[]){\n\
  \    int i;\n    int length;\n    int sum = 0;\n    char char_array[10] = { 'p',\
  \ 's', 'y', 'c', 'h', 'o', 'l', 'o', 'g', 'y' };\n    // 为该数组分配的字节总数\n    // 每个\
  \ char 是一个字节：元素个数 = 字节数\n    length = sizeof(char_array) ;\n    std::cout << \"\
  Size of array of characters is \" << length << std::endl;\n    for (i = 0; i<length;\
  \ i++)\n        std::cout << char_array[i];\n    std::cout << '\\n';\n    std::cout\
  \ << '\\n';\n    std::cout << '\\n';\n    int numbers[10] = { 1, 5, 9, 4, 2, 7,\
  \ 6, 3, 8, 0 };\n    // 为该数组分配的字节总数。\n    length = sizeof(numbers);\n    std::cout\
  \ << \"Size of numbers array=\" << length << std::endl;\n    // 为数组分配的字节总数 / 每个元素分配的字节数\n\
  \    length = sizeof(numbers) / sizeof(numbers[0]);\n    std::cout << \"Numbers\
  \ of elements=\" << length << std::endl;\n    for (i = 0; i<length; i++){\n    \
  \    sum = sum + numbers[i];\n        std::cout << \"Sum of numbers=\" << sum <<\
  \ std::endl;\n    }\n    int *p = numbers;\n    std::cout << \"Address of the first\
  \ element is \" << p << std::endl;\n    std::cout << \"The value in the address\
  \ is \" << *p << std::endl;\n    p++; //将指针移动到下一个元素\n    std::cout << \"Address\
  \ of the second element is \" << p << std::endl;\n    std::cout << \"The value in\
  \ the address is \" << *p << std::endl;\n    int hold = 1;\n    std::cin >> hold;\n\
  \    return 0;\n}\n```\n\n`sizeof` 函数返回为数组分配的字节数。由于 `char` 数据类型占用一个字节，`sizeof` 函数返回的字节数等于\
  \ `char` 数组的元素个数。\n\n整数数据类型在内存中占用 4 字节，一个包含 10 个整数的数组存储在 40 字节中。因此，`sizeof` 数组函数对于包含\
  \ 10 个元素的整数数组返回 40 字节。\n\n要计算数组中存储了多少元素，我们可以将整个数组分配的字节数除以数组中单个元素分配的字节数；`length=sizeof(numbers)\
  \ / sizeof(numbers[0]);` `40 / 4 = 10`\n\n要访问单个元素的值，我们必须使用数组索引。C++ 中的数组索引从 0 开始。第一个元素的索引为\
  \ 0，第二个元素的索引为 1，以此此类推。\n\n要访问数组的所有元素，我们必须使用 `for` 循环。`for(i=0; i<length; i++)cout<<char_array[i];`\n\
  \n如果我们声明一个指针并将数组赋值给该指针，该指针将保存数组第一个元素的地址：\n`int *p =numbers;` `cout<<\"Address of\
  \ the first element is \"<<p<<endl;`\n该行代码的输出是：`Address of the first element is\
  \ 0059F710`\n\n要使用指针访问数组第一个元素地址处存储的值，请运行以下代码：`cout<<\"The value in the address is\
  \ \"<<*p<<endl;`\n代码的输出是：`The value in the address is 1.`\n\n要移动到数组的下一个元素，必须增加 `p`\
  \ 值。`p++;`\n现在它将指向数组的第二个元素：\n`cout<<\"Address of the second element is \" <<p<<endl;`\n\
  `cout<<\"The value in the address is\"<<*p<<endl;`\n输出是：`The address of the second\
  \ element of the numbers array on my PC is 0059F714` `The value in the address of\
  \ the second element is 5.`\n\n![](img/Image00047.jpg)\n图 数组程序的输出。\n\n### 字符串 (String)\n\
  我将向你展示如何使用一些字符串函数。\n- `strcpy_s()` - 将字符串的内容拷贝到另一个。\n- `strcat_s()` - 将源字符串的副本附加到目标字符串。\n\
  - `strlen()` - 返回字符串的长度。\n\n我们的应用程序将从用户输入读取字符串，将其复制到另一个字符串，然后按反序复制原始字符串字符到临时字符串，并将副本和反转后的副本合并为一个字符串。\n\
  例如，如果用户输入字符串‘Concatenation’，应用程序将输出‘ConcatenationnoitanacnoC’\n\n以下头文件必须包含在 `main.cpp`\
  \ 中：\n```cpp\n#include \"stdafx.h\"\n#include <stdio.h>\n#include <cctype>\n#include\
  \ <iostream>\n#include <cstring>\n```\n`<cstring>` 头文件用于字符串函数：`strcpy_s()`、`strcat_s()`\
  \ 和 `strlen()`。`cctype` 头文件用于 `toupper()` 函数。\n\n我想解释如何按反序从原始字符串拷贝到临时字符串。\n首先，我使用\
  \ `strlen()` 函数获取原始字符串的长度。`length=strlen(aWord);`\n然后在循环中，我将原始字符串的最后一个字符拷贝到临时字符串的第一个位置，以此此类推。\n\
  让我们检查循环代码：`for(i=0; i <length; i++)temp[i]=aWord[length-(i+1)];`\n如果输入单词‘Concatenation’，单词长度为\
  \ 13。字符串第一个字符的索引为 0，最后一个字符的索引为 12。这意味着最后一个字符是 `length -1`。\n放在循环中的代码行是 `temp[i]=aWord[length-(i+1)];`\n\
  当 `i =0` 时，`temp[i]` 指临时字符串的第一个字符。同时（当 `i =0`）`aWord [length-(i+1)]` 指 `aWord[13\
  \ – (0 + 1)]` 字符，即最后一个。\n当 `i=1` 时，`temp[1]` 指临时字符串的第二个字符，`aWord [13-(1+1)]` 指倒数第二个。\n\
  通过这种方式，我们可以反序拷贝所有字符。当我们从原始字符串拷贝所有字符到临时字符串时，我们需要在字符串末尾添加空字符。`temp[length]='\\0';`\
  \ 将完成这项工作。整个代码位于 [visual_studio_2017.zip](http://learn-coding.today/cplusbook/visual_studio_2017.zip.)。\n\
  \n```cpp\n#include \"stdafx.h\"\n#include <stdio.h>\n#include <cctype>\n#include\
  \ <cstring>\n#include <iostream>\nint main(){\n    char more = 'Y';\n    char prompt1[]\
  \ = \"\\nEnter a word not than 20 characters and press enter.\\n\";\n    char prompt3[]\
  \ = \"\\nDo you want to continue? Y/N\\n\";\n    char aWord[20];\n    char aCopy[40];\n\
  \    int length = 0;\n    char temp[20];\n    int i;\n    while (toupper(more) ==\
  \ 'Y'){\n        std::cout << prompt1;\n        std::cin >> aWord ;\n        std::cout\
  \ << \"aWord=\" << aWord << std::endl;\n        strcpy_s(aCopy, aWord);\n      \
  \  std::cout << \"aCopy=\" << aCopy << std::endl;\n        length = strlen(aWord);\n\
  \        std::cout << \"length=\" << length << std::endl;\n        //用反序单词填充 temp[]\
  \ 数组\n        for (i = 0; i <length; i++)\n            temp[i] = aWord[length -\
  \ (i + 1)];\n        temp[length] = '\\0';\n        std::cout << \"Temp=\" << temp\
  \ << std::endl;\n        strcat_s(aCopy, temp);\n        std::cout << \"aCopy after\
  \ concatenation of temp=\" << aCopy << std::endl;\n        std::cout << prompt3;\n\
  \        std::cin >> more;\n    }\n    return 0;\n}\n```\n输出：\n![](img/Image0048.jpg)\n\
  图 字符串操作。\n\n### 列表 (Lists)\n让我们想象一个谜题。你有一排盒子。每个盒子包含一张带字母的卡片。你必须找出字母的顺序，使字母组成一个单词。\n\
  \n![](img/Image0049.jpg)\n图 链表\n在上面的表中，你可以看到每个盒子都有一个数字。你可以猜这些数字是谜题的关键。第一个盒子里面有一个字母\
  \ T，正面有数字 5。取出带有字母 T 的卡片放在一边。数字 5 可能指向下一个字母。数盒子。第五个盒子有字母‘E’。取出带有字母 E 的卡片放在 T 旁边。你会得到“TE”。带有字母\
  \ E 的盒子侧面有数字 2。因此，从第 2 个盒子取出卡片并放在“TE”旁边。你会得到“TEC”。带有字母 C 的盒子数字是 10，所以从第 10 个盒子取出卡片。你会得到“TECH”。带有字母\
  \ H 的盒子数字是 4，所以从第 4 个盒子取出卡片。你得到了“TECHN”。继续跟随这些数字，你将得到整个单词：TECHNOLOGY。这就是链表的工作原理。它由节点组成。每个节点至少包含一个存储数据（文本、数字或对象）的变量和一个存储下一个节点地址的变量（指针）。这个系统像谜题一样遍历节点。最后一个节点的指针具有空值，或者它可能指向第一个节点。\n\
  \n\n\n\n\n*   你正在开发一款 MMORPG 游戏，玩家需要能够快速登录——这涉及到快速查找玩家信息。\n*   你正在开发处理信用卡的软件，每小时需要处理数百万次交易——需要非常快速找到信用卡余额。\n\
  *   你正在使用低功耗设备（如平板电脑或智能手机）并向用户展示通讯录。你不希望用户因为你的数据结构太慢而一直卡顿。\n\n\n\n本节将讨论克服这些问题及更多问题所需的工具。解决方案的想法是能够在像链表这样的结构中存储元素，使用指针来帮助组织内存，但方法比链表更简单。这要求内存具有比简单列表更复杂的结构。\n\
  \n那么，数据结构化意味着什么？当我们开始这段旅程时，我们只有数组，但这些数组从未真正让我们具备使用顺序列表以外的数据结构的能力。链表使用指针增量地扩展顺序列表，但没有利用指针的灵活性来构建更复杂的结构。\n\
  \n内存中这些更复杂的结构是什么？在任何给定时刻持有多个“下一个节点”的结构就是一个很好的例子。但你为什么要这么做呢？很简单。如果你有两个“下一个节点”，其中一个可以表示比当前元素更多的元素。这被称为二叉树。\n\
  \n之所以这样命名，是因为每个节点都有一个或两个分支。每个下一个节点都是子节点，连接到子节点的节点就是父节点。\n\n二叉树可能像这样：\n106 145 8\
  \ 11 18\n\n在树中，每个元素的左孩子都小于该元素，而右孩子大于大。10 是整棵树的父节点，6 和 14 的子节点都是它们各自小树的父节点，称为子树。\n\
  \n二叉树有一个非常重要的属性：每个孩子都是一整棵树。结合左孩子小于、右孩子大的规则，你就有了一种简单的方法来定义在树中定位特定节点的算法。\n\n首先，查看当前节点的值。如果它等于搜索目标，则完成。如果它大于搜索目标，则向左走；否则，向右走。这之所以有效，是因为树左侧的每个节点都小于当前节点值，右侧的每个节点都更大。\n\
  \n在理想的世界里，你的二叉树是平衡的，两边的节点数量完全相同。在这种情况下，每个子树大约占整棵树的 50%，当你在树中搜索一个值时，搜索每次到达子节点时都可以排除\
  \ 50% 的结果。所以，如果你有一棵拥有 1000 个元素的树，500 个会被立即排除。再次搜索这棵树（现在它只有 50 个元素了），你可以再次切掉大约 50%。这样找到你想要的值就不需要太长时间。\n\
  \n那么，在得到一个元素之前，树必须被细分多少次？该答案是 `log2n`（n 是树拥有的元素数量）。即使你的树很大，这个值也很小——如果你的树有例如 320\
  \ 亿个元素，该值也只有 32；比对 40 亿元素链表的搜索快了近 1 亿倍。\n\n如果树不是平衡的，你就无法排除大约一半的元素；最坏的情况下，每个节点只有一个孩子，这使得树无非只是一个带有几个额外指针的链表，因此需要你搜索所有元素。所以，当树大致平衡时，搜索节点比在链表上进行相同的搜索快得多且容易得多。这是因为你可以按照想要的方式组织内存。\n\
  \n## 实现二叉树\n\n要实现二叉树，从声明节点结构开始：\n\n```cpp\nStruct node{\n    int key_value;\n  \
  \  node *p_left;\n    node *p_right;\n};\n```\n\n节点可以存储简单的整数 `key_value` 作为值，并有两个子树\
  \ —— `p_left` 和 `p_right`。\n\n你可能希望二叉树需要一些常用函数：插入、搜索、删除和销毁：\n```cpp\nnode* insert\
  \ (node* p_tree, int key);\nnode *search (node* p_tree, int key);\nvoid destroyTree\
  \ (node* p_tree);\nnode *remove (node* p_tree, int key);\n```\n\n### 插入\n\n我们将使用递归算法将其插入树中。递归对于树来说非常棒，因为每棵树都有两个小树；这使得整棵树在本质上是递归的。该函数接收一个键和一个已经存在的树（即使是空树），并返回一个包含插入值的新树。\n\
  \n```cpp\nnode* insert (node *p_tree, int key) {\n    // 基础情况——我们到达了一个空树，我们的新节点\n\
  \    // 需要插入在这里\n    if ( p_tree == NULL ) {\n        node* p_new_tree = new node;\n\
  \        p_new_tree->p_left = NULL;\n        p_new_tree->p_right = NULL;\n     \
  \   p_new_tree->key_value = key;\n        return p_new_tree;\n    }\n    // 决定——插入到左子树还是右子树\n\
  \    // 取决于节点的值\n    if( key < p_tree->key_value ) {\n        // 从 p_tree->left\
  \ 构建一个新树，并加入键\n        // 将现有的 p_tree->left 指针替换为指向\n        // 新树的指针。设置 p_tree->p_left\
  \ 指针\n        // 以防 p_tree->left 为空。（如果它不为空，\n        // p_tree->p_left 将不会改变，\n\
  \        // 但为了确保。）\n        p_tree->p_left = insert( p_tree->p_left, key );\n \
  \   } else {\n        // 向右侧插入与左侧插入是对称的\n        p_tree->p_right = insert( p_tree->p_right,\
  \ key );\n    }\n    return p_tree;\n}\n```\n\n这里的逻辑是：如果你有一个空树，就创建一个新的。如果不是，如果值大于当前节点，则插入到左子树，然后用新的替换左子树。否则，插入到右子树并替换它。\n\
  \n涉及到运行操作时，将空树构建到一个包含几个节点的树。如果值 10 被插入到空树（`NULL`），我们将立即遇到基础情况，结果将是指向 `NULL` 的树。然后将\
  \ 5 插入树并后续调用：`insert(a tree with parent, 5)`。由于 5 小于 10，向左子树的调用是递归的：`insert( NULL,\
  \ 5 )`、`insert(a tree with parent, 5)`。`insert( NULL, 5 )` 的调用创建一个树。当接收到返回树时，`insert(5)`\
  \ 连接树。在这个示例中，10 的左孩子之前是 `NULL`，因此 10 的左孩子建立了一个新树：5。如果我们现在添加 7，得到：`insert( NULL,\
  \ 7 )`、`insert(a tree with parent, 7 )`、`insert(a tree with parent, 7)`。所以，首先 `insert(\
  \ NULL, 7 )` 将返回一个新树：7。然后 `insert(a tree with parent, 7 )` 连接 7 的子树：5。因为已经有一个从 10\
  \ 到 5 的指针，所以没有必要重新连接 10 的左孩子到 5，但它执行了一个条件检查来看子树是否为空。\n\n### 销毁\n\n这也应该是一个递归函数。在删除当前节点之前，算法销毁当前节点处的两个子树。\n\
  \n```cpp\nvoid destroy_tree (node *p_tree) {\n    if ( p_tree != NULL ) {\n    \
  \    destroy_tree( p_tree->p_left );\n        destroy_tree( p_tree->p_right );\n\
  \        delete p_tree;\n    }\n}\n```\n\n为了更好地理解这一点，让我们假设在删除节点之前打印节点的值：\n\n```cpp\n\
  void destroy_tree (node *p_tree) {\n    if ( p_tree != NULL ) {\n        destroy_tree(\
  \ p_tree->p_left );\n        destroy_tree( p_tree->p_right );\n        cout << \"\
  Deleting node: \" << p_tree->key_value;\n        delete p_tree;\n    }\n}\n```\n\
  \n你可以看到，树是从底向上删除的。节点 5 和 8 首先删除，然后是 6，最后移动到另一侧删除 11 和 18，然后是 14。最后，10 将被删除。树的值并不重要；重要的是节点的位置。在接下来的二叉树中，我们不使用节点值，而是使用删除顺序：73\
  \ 6 2 4 5。手动在几棵树上运行代码有助于看清楚这一点。\n\n从树中删除是递归算法的一个很好的例子，这种算法很难用迭代实现。首先，你需要一个可以同时处理树的两边的循环。你需要在删除一个子树的同时跟踪另一个，这需要在每一层都执行。通过栈，你可以更轻松地保持位置。可视化这一点的最佳方法是说，每个栈帧将存储已经删除或销毁的树分支：`destroy_tree()`\
  \ 知道子树是左还是右。每个栈帧都知道树的哪些部分需要销毁，因为它知道函数执行应该在何时继续。当第一次调用树时，栈帧通知程序在第二次调用 `destroy_tree`\
  \ 时继续执行。当进行第二次调用时，程序被告知继续 `delete tree`。由于每个函数都有自己的栈帧，它可以跟踪当前树销毁的整个状态，一次处理一个层。\n\
  \n要以非递归的方式实现此，需要一个保留相同数量和类型信息的数据结构。例如，你可以写一个持有链表的函数来模拟列表。该链表将拥有正在销毁的子树和留待销毁的树。然后可以写一个基于循环的算法，将子树添加到列表中并在它们完全销毁后将其移除。基本上，递归允许你使用内置的栈数据结构，而不需要编写自己的。\n\
  \n# 第 4 章：继承\n\n### 示例：\n\n```cpp\n#include <iostream>\nusing namespace std;\n//\
  \ 定义一个具有 2 个成员的简单学生类\nclass Student{\npublic:\n    int studentID;\n    string studentName;\n\
  \    // 显示类成员的函数\n    void Display(){\n        cout<<\"Student ID \"<<studentID<<endl;\n\
  \        cout<<\"Student Name \"<<studentName;\n    }\n};\n\nint main () {\n   \
  \ Student stud1;\n    // 给类的属性赋值\n    stud1.studentID=1;\n    stud1.studentName=\"\
  John\";\n    stud1.Display();\n    return 0;\n}\n```\n使用上面的程序：\n\n\n\n\n\n* 我们有一个名为\
  \ `Student` 的类，它包含 2 个成员变量，一个是 `studentID`，另一个是 `studentName`。\n* 随后我们定义了一个名为 `Display()`\
  \ 的成员函数，它向控制台输出 `studentID` 和 `studentName`。\n* 之后我们可以在主程序中从对象调用该成员函数。\n\n运行此程序后，输出如下：\n\
  Student ID 1\nStudent Name John\n\n# 那么什么是继承？\n\n继承是一个概念，我们可以定义一个类来继承另一个类的属性和方法。这可以避免再次定义该类，也无需重复定义其属性和方法。假设我们有一个名为\
  \ `Person` 的类，它有一个名为 `Name` 的属性和一个名为 `Display` 的方法。通过继承，我们可以定义一个名为 `Student` 的类，它可以继承\
  \ `Person` 类。`Student` 类将自动获得 ID 成员和 `Display` 函数。如果需要，`Student` 类还可以定义它自己的额外成员。\n\
  \n要定义一个被继承的类，我们使用以下语法。\n\n`派生类:基类`\n\n在这里，`派生类` 是继承另一个类（即`基类`）属性的类。假设我们有一个如下所示的带有属性和函数的基类。\n\
  \n`基类`\n```cpp\n{Public or protected:Property1;}\n```\n\n那么当我们从基类定义派生类时，派生类将拥有访问该属性的权限。注意，属性和函数的访问修饰符需要为\
  \ `public`（公共）或 `protected`（保护）。我们稍后会详细介绍访问修饰符。\n\n`派生类: 基类`\n```cpp\n{// 不需要定义\
  \ property1，它会自动继承这些。}\n```\n\n现在让我们通过代码来看一个简单的继承示例。示例 2：以下程序用于演示如何使用一个简单的被继承类。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\n// 定义一个具有 Name 属性的简单 Person\
  \ 类\nclass Person{\npublic:string Name;\n};\n// 这里我们有一个派生类。它定义了另一个属性 ID\nclass Student:public\
  \ Person{\npublic:int ID;\n// 显示同时 ID 和 Name 的函数。由于 Name 可以从 Person 基类获取，我们可以在这里访问它。\n\
  void Display(){cout<<\"Student ID \"<<ID<<endl ;cout<<\"Student Name \"<<Name;}}\n\
  };\nint main () {\nStudent stud1;\nstud1.ID=1;\nstud1.Name=\"John\";\nstud1.Display();\n\
  return 0;\n}\n```\n\n通过上述程序：\n* 我们定义了一个名为 `Person` 的类，它包含一个名为 `Name` 的成员。\n* 随后我们使用继承来定义\
  \ `Student` 类。注意我们现在定义了另一个名为 `ID` 的属性。\n* 在 `Display` 函数中，注意我们可以直接使用 `Name` 属性，而无需在\
  \ `Student` 类中再次定义它。\n\n运行此程序后，输出如下：\nStudent ID 1\nStudent Name John\n\n现在我们已经看到了如何使用派生类和基类，这也被称为继承。\n\
  \n### 1.2 派生类中的函数\n\n我们也可以定义可以从基类继承的函数。让我们如何实现这一点。例如，如果我们有一个如下所示的带有属性和函数的基类。\n\n\
  `基类`\n```cpp\n{Public or protected:Property1;Fucntion1;}\n```\n\n当我们从基类定义派生类时，派生类也将拥有访问该属性和函数的权限。注意，属性和函数的访问修饰符需要为\
  \ `public` 或 `protected`。\n\n`派生类: 基类`\n```cpp\n{// 不需要定义 property1 和 Function1，它们会自动继承这些。}\n\
  ```\n\n现在让我们来看一个在派生类中使用函数的示例。示例 3：以下程序用于演示如何使用带有函数的被继承类。\n\n```cpp\n#include <iostream>\n\
  using namespace std;\n// 定义一个具有 Name、ID 属性以及名为 Display 的函数的简单 Person 类。\nclass Person{\n\
  public:string Name;\nint ID;\nvoid Display(){cout<<\"ID \"<<ID<<endl;cout<<\"Name\
  \ \"<<Name;}}\n};\n// Student 类简单地从 Person 基类派生出来\nclass Student:public Person {};\n\
  int main () {\n// 既然派生类有权访问基类的属性和函数，那么就可以通过 Student 对象访问它们\nStudent stud1 ;\nstud1.ID=1;\n\
  stud1.Name=\"John\";\nstud1.Display();\nreturn 0;\n}\n```\n\n运行此程序后，输出如下：\nID 1\n\
  Name John\n\n我们还可以在 `Student` 类中重定义 `Display` 函数。但如果你看上面的示例，你会发现 `Person` 类中的 `Display`\
  \ 函数显示的文本是 ID 和 Name。但假设我们希望在 student 类中将显示名称设为 Student ID 和 Student name，我们可以重定义\
  \ `Display` 函数。让我们来看这一个示例。示例 4：以下程序展示了如何使用带有重定义函数的被继承类。\n\n```cpp\n#include <iostream>\n\
  using namespace std;\nclass Person{\npublic:string Name;\nint ID ;\nvoid Display(){cout<<\"\
  ID \"<<ID<<endl;cout<<\"Name \"<<Name;}};\n};\nclass Student:public Person {\npublic:\n\
  // 在这里我们重定义 Display 函数\nvoid Display(){cout<<\"Student ID \"<<ID<<endl;cout<<\"\
  Student Name \"<<Name;}}\n};\nint main () {\nStudent stud1;\nstud1.ID=1;\nstud1.Name=\"\
  John\";\nstud1.Display();\nreturn 0;\n}\n```\n\n运行此程序后，输出如下：\nStudent ID 1\nStudent\
  \ Name\n\n1.3 多重继承\n\n我们还可以让派生类继承多个基类。这有助于一次性获取多个类的功能。\n\n`派生类:基类 1,基类 2...基类 N`\n\
  \n在这里你只需要用逗号分隔基类。假设我们有一个如下所示的带有属性和函数的基类。\n\n`基类 1`\n```cpp\n{Public or protected:Property1;Fuction1;}\n\
  ```\n另一个如下所示的基类。\n\n`基类 2`\n```cpp\n{Public or protected:Property2;Fucion2;}\n```\n\
  \n那么当我们从这两个基类定义派生类时，派生类将拥有访问这两个类的属性和函数的权限。\n\n`派生类: 基类 1, 基类 2`\n```cpp\n{// 不需要定义\
  \ property1, property2 以及 Function1, Functionion2，它们会自动继承这些。}\n```\n\n注意，属性和函数的访问修饰符需要为\
  \ `public` 或 `protected`。让我们来看一个多重继承的示例。示例 5：以下程序用于演示如何使用多重继承类。\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\n// 定义第一个基类 Person\nclass Person{\npublic:string\
  \ Name;\nint ID;\nvoid Display(){cout<<\"ID \"<<ID<<endl;cout<<\"Name \"<<Name;}}\n\
  };\n// 定义第二个基类 Marks\nclass Marks{\npublic:int marks1,marks2;\nvoid Sum(){cout<<marks1+marks2;}}\n\
  };\n// 派生类继承自 Person 和 Marks 基类。\nclass Student:public Person,public Marks {public\
  \ :void Display(){cout<<\"Student ID \"<<ID<<endl;cout<<\"Student Name \"<<Name<<endl;}};\n\
  };\nint main () {\nStudent stud1;\nstud1.ID=1;\nstud1.Name=\"John\";\nstud1.Display();\n\
  stud1.marks1=5;\nstud1.marks2=10;\nstud1.Sum();\nreturn 0;\n}\n```\n\n通过上述程序：\n\
  * 我们定义了两个基类，一个是 `Person`，另一个是 `Marks`。\n* 派生类 `Student` 继承了这两个类，并能够使用来自这两个类的成员。\n\
  \n运行此程序后，输出如下：\nStudent ID 1\nStudent Name John\n15\n\n### 1.4 访问控制\n\n类修饰符可以用于定义类中属性和方法的可见性。以下是可用的各种修饰符。\n\
  \n* `private`（私有）：使用 private 时，属性和方法仅对类本身可见。\n* `protected`（保护）：使用 protected 时，属性和方法仅对类本身以及派自该类的子类可见。\n\
  * `public`（公共）：使用 public 时，属性和方法对所有类可见。\n\n\n\n\n假设我们有如下的类结构。\n\n```cpp\nClass classname{Private:Property1;Fucntion1;}\n\
  ```\n\n`property1` 和 `function1` 在定义它们的类之外，在任何地方都无法被访问。如果你尝试从主程序访问这些属性或函数中的任何一个，将得到编译错误。\n\
  \n现在让我们定义下面的类，但这次我们将改用 `protected`（保护）访问修饰符。\n\n```cpp\nClass classname1{Protected:Property1;Fucntion1;}\n\
  ```\n\n现在，`property1` 和 `function1` 可以在上述类以及任何派生自它的类中被访问。因此，如果我们有下面的派生类定义，我们就可以在派生类中访问\
  \ `property1` 和 `fucntion1`。但请注意，我们无法在任何非派生类中使用这些属性。\n\n```cpp\nClass derivedclassname:\
  \ classname1{}\n```\n\n让我们来看另一个关于访问修饰符的示例。\n\n### 示例 6：以下程序用于演示如何使用访问修饰符\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\nclass Person{\npublic:\nint ID;\nprotected//\
  \ 注意我们将 Name 属性定义为 protected\nstring Name;\nvoid Display(){cout<<\"ID \"<<ID<<endl;cout<<\"\
  Name \"<<Name;}\n// 注意我们将 city 属性定义为 private\nprivate:\nstring city;\n};\nclass\
  \ Student:public Person {\npublic:\nvoid Display(){cout<<\"Student ID \"<<ID<<endl;cout<<\"\
  Student Name \"<<Name<<endl ;}};\nint main () {\nStudent stud1;\nstud1.ID=1;\nstud1.Name=\"\
  John\";\nstud1.Display();\nreturn 0;\n}\n```\n\n运行此程序后，输出如下：\n`error: 'std::__cxx11::string\
  \ Person::Name' is protected`\n\n**为什么我们会得到这个错误？** `person` 类有两个名为 `ID` 和 `Name`\
  \ 的属性。`name` 具有 `protected` 访问修饰符，这意味着它只能在派生类中被访问。但我们正尝试在主类中访问它，这是错误的。因此，实现它的正确方法如下。\n\
  \n### 示例 7：以下程序展示了如何正确地使用访问修饰符\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
  class Person{\npublic :int ID;\nprotected:\nstring Name;\nvoid Display(){cout<<\"\
  ID \"<<ID<<endl;cout<<\"Name \"<<Name;}\nprivate:\nstring city;\n};\nclass Student:public\
  \ Person {\npublic// 我们现在定义了一个函数，可以据此设置受保护属性的值。\nvoid InputName(string pName){Name=pName;}\n\
  void Display(){cout<<\"Student ID \"<<ID<<endl;cout<<\"Student Name \"<<Name<<endl;}};\n\
  int main () {\nStudent stud1;\nstud1.ID=1;\nstud1.InputName(\"John\");\nstud1.Display();\n\
  return 0;\n}\n```\n\n在上面的程序中，我们现在 `Student` 类中正确定义了一个名为 `InputName` 的方法，它可以访问受保护的\
  \ `Name` 成员。\n\n运行此程序后，输出如下：\n`Student ID 1`\n`Student Name John`\n\n现在让我们来看同一个示例，并尝试显示在\
  \ `Person` 类中定义的 `City` 属性。\n\n### 示例 8：以下程序展示了错误使用访问修符的第二个示例\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nclass Person{\npublic:int ID;\nprotected:\n\
  string Name;\nvoid Display(){cout<<\"ID \"<<ID<<endl;cout<<\"Name \"<<Name;}\nprivate:\n\
  string city;\n};\nclass Student:public Person {\npublic:\nvoid InputName(string\
  \ pName){Name=pName;}\nvoid Display(){cout<<\"Student ID \"<<ID<<endl;\n// 注意我们正尝试在派生类中使用私有属性\n\
  cout<<\"Student city \"<<city<<endl;\ncout<<\"Student Name \"<<Name<<endl;}};\n\
  int main () {\nStudent stud1;\nstud1.ID=1;\nstud1.InputName(\"John\");\nstud1.Display();\n\
  return 0;\n}\n```\n\n运行此程序后，输出如下：\n`error: 'std::__cxx11::string Person::city' is\
  \ private`\n\n由于 `City` 属性是私有的（private）的，它甚至在派生类中也无法被使用。我们只能在 `Person` 类中操作此属性。\n\
  \n# 第 5 章：高级基础\n\n## 指针\n\n之前提到过指针，它们是变量的内存地址，这就像是一个人的家庭地址。这些地址可以作为参数传递，并允许之前提到的按引用传递的效果。\n\
  \n下面的程序将显示变量的地址：\n\n```cpp\n#include <stdio.h>\nint main(){\nint var;\nprintf(\"\
  The address is: %x\\n\", &var);\nreturn 0;\n}\n```\n\n输出：`> The address is: 10ffa2c`\n\
  \n注意：这几乎每次运行时都会不同。\n\n请注意高亮显示的语句，`&`（引用运算符）用于返回变量的内存位置，并允许某些语句访问该位置的数据。使用 `%x` 是因为内存位置是十六进制的。\n\
  \n要创建一个指针，我们使用解引用运算符 `*`，这将创建一个用于存储内存位置地址的指针变量。下面的程序创建一个指针，并使用引用运算符 `&` 将另一个普通变量的地址存储新创建的指针中。解引用运算符\
  \ `*` 也用于访问或更改该内存位置中的实际数据。\n\n\n\n\n![](img/Image00054.jpg)\n\n```c\nRegular variable\n\
  int var = 10;\n//Pointer\nint* pointer;\n//Storing of var memory location\npointer\
  \ = &var;\n//Pointer is now effecivly 'var' so\n//things like this can happen\n\
  pointer = 20;\nprintf(\"Var's value is now: %d\", var);\n```\nOutput: `>Var's value\
  \ is now: 20`\n\n### NULL 指针\n当你创建一个指针时，它最初并没有被赋予任何指向，这是危险的，因为指针在创建时引用的是随机内存，更改该内存位置中的数据可能会导致程序崩溃。为了防止这一点，我们在创建指针时将其赋值为\
  \ `NULL`，如下：\n\n```c\nint* pointer = NULL;\n```\n这意味着指针的地址为‘0’，这是一个用于标识空指针的预留内存位置。空指针可以通过\
  \ `if` 语句进行检查：\n\n```c\nif (pointer){}\n```\n如果指针不为空，则执行成功。\n\n### 使用指针\n现在指针的一些真实世界应用是将它们作为参数传递，并有效地按引用传递。下面的示例将显示这种效果：\n\
  \n```c\nvoid Change_Value(int* reference){\n//更改内存位置中的值\nreference = 20;\n}\nint\
  \ main(){\n//创建变量的指针\nint var = 10;\nint* pointer = &var;\nprintf(\"The value before\
  \ call: %d\\n\", var);\n//方法调用\nChange_Value(pointer);\n//打印新值\nprintf(\"The value\
  \ after call: %d\\n\", var);\nreturn 0;\n}\n```\nOutput::\n`>The value before call:\
  \ 10`\n`>The value after call: 20`\n\n这传递的是内存地址，而不是变量的值，这意味着你拥有一个可以对其进行更改的位置。注意参数类型是\
  \ `int*`，这是指针类型，所以指向字符的指针的示例将是 `char*`。\n\n### 指针算术\n有时，将指针移动到另一个内存位置可能是很有用的；这就是指针算术派上用场的地方。如果我们执行例如\
  \ `ptr++` 且 `ptr` 是整型指针，它现在将向前移动 4 字节（int 的大小），如果我们再次运行，它将再次移动 4 字节，等等。这意味着指针（如果指向有效的数组结构）可以像数组一样工作。下面是一个示例：\n\
  \n```c\nint arrayInt[] = { 10, 20, 30 };\nsize_t arrayInt_Size = 3;\n//将指向第一个数组索引\n\
  int* ptr = &arrayInt;\nfor (int i = 0; i < arrayInt_Size; i++){\n//记住，*ptr 获取内存位置中的值\n\
  printf(\"Value of arrayInt[%d] = %d\\n\", i, *ptr);\nptr++;\n}\n```\nOutput:\n`>Value\
  \ of arrayInt[0] = 10`\n`>Value of arrayInt[1] = 20`\n`>Value of arrayInt[2] = 30`\n\
  \n这表明指向数组第一个地址的指针可以沿着数组的地址递增（记住数组的每个值都存储在相邻的内存位置中）。\n\n你可以执行相反的操作并递减指针，即让指针的值减小。还可以使用关系运算符（如\
  \ `==`、`<` 和 `>`）来比较指针。最常见的用途是检查两个指针是否指向同一个位置：\n\n```c\nint value;\n//为 ptr1 和 prt2\
  \ 赋值相同的值\nint* ptr1 = &value;\nint* ptr2 = &value;\n//ptr3 被赋予另一个值\nint* ptr3 =\
  \ NULL;\nif (ptr1 == ptr2){\nprintf(\"ptr1 and ptr2 are equal!\\n\");\n}\nif (!ptr1\
  \ == ptr3){\nprintf(\"ptr1 is not equal to ptr3\\n\");\n}\n```\n这检查了各种指针是否相等。使用\
  \ `>` 和 `<` 也可以做到。\n\n### 函数指针\n就像你可以对变量操作一样，你也可以对函数进行同样的操作；下面是一个显示定义函数指针的代码片段。关键部分将突出显示：\n\
  \n```c\nvoid printAddition(int value1, int value2){\nint result = value1 + value2;\n\
  printf(\"The result is: %d\", result);\n}\nint main(){\n//函数指针定义\n//<returnType>(*<Name>)(<Parameters>)\n\
  void(*functionPtr)(int, int);\nfunctionPtr = &printAddition;\n//调用指针函数\n(*functionPtr)(100,\
  \ 200);\nreturn 0;\n}\n```\n定义函数指针的基本结构如下：\n`<Return_Type> (*<Name>) (<Parameters>)`\n\
  在此例中：\n`<Return_Type>` = `void`\n`<Name>` = `functionPtr`\n`<Parameters>` = `int,\
  \ int`\n\n现在这个函数指针可以作为参数传递，并用于你想更改代码行为但又使用几乎相同代码的情况。一个示例可以是动态选择计算器应该执行什么操作（注意：这是复杂的代码，应作为粗略示例，所以如果你不完全理解请不要担心）\n\
  \n```c\nvoid calculator(int value1, int value2, int(*opp)(int,int)){\nint result\
  \ = (*opp)(value1, value2);\nprintf(\"The result from the operation: %d\\n\", result);\n\
  }\n//相加两个值\nint add(int num1, int num2){\nreturn num1 + num2;\n}\n//相减两个值\nint sub(int\
  \ num1, int num2){\nreturn num1 - num2;\n}\nint main(){\ncalculator(10, 20, &add);\n\
  calculator(10, 20, &sub);\nreturn 0;\n}\n```\n这里发生的是我们将函数 `add` 和 `sub` 作为参数传递给\
  \ `calculator` 函数，正如你从突出显示所示，函数参数的定义方式如上面，包含了返回类型、名称和参数。传递给 `calculator` 的都是 `&add`\
  \ 和 `&sub`。calculator 函数随后调用指针并传递值并返回结果。\n\n### 存储分类\n在 C 中，每个变量都可以赋予一个存储类，该类可以定义某些特性。这些类是：\n\
  \n*   自动变量\n\n*   静态变量\n\n*   寄存器变量\n\n*   外部变量\n\n\n\n\n\n### 自动变量\n到目前为止定义的每个变量都是自动变量；它们在函数被调用时创建，并在函数退出时自动销毁。这些变量也被称为局部变量。\n\
  `auto int value;` 与 `int value;` 等。\n\n### 静态变量\n当你希望变量在离开作用范围时不被销毁时，可以使用 `static`；该变量将一直持续到程序结束。静态变量在整个程序生命周期内只创建一次。以下是一个静态变量的使用示例：\n\
  \n```c\nvoid tick(){\n  //这里将运行一次\n  static int count = 0;\n  count++;\n  printf(\"\
  The count is now: %d\\n\", count);\n}\nint main(){\n  tick();\n  tick();\n  tick();\n\
  }\n```\n输出:\n>The count is now: 1\n>The count is now: 2\n>The count is now: 3\n\n\
  高亮区域是静态定义，只会运行一次。\n\n### 寄存器变量\n`register` 用于定义一个存储在寄存器内存而非普通内存中的变量，寄存器内存的优点是访问速度快得多；然而，空间只能容纳少数变量。定义寄存器变量的方式如下：\n\
  `register int value;`\n\n### 外部变量\n我们之前提到过这一点，但全局变量是指未定义在作用域内的变量，因此可以在任何地方使用。外部变量是指定义在独立位置（如另一个文件）的变量，使用\
  \ `extern` 关键字表示该变量在另一个文件中。你可以通过在文件顶端放置此内容来引用另一个文件：\n\n```c\n#include \"FileName.c\"\
  \n```\n这是为了告诉程序也引用该文件。注意这些文件需要在同一个位置。\n\n### 程序 1 [File_2.c]\n```c\n#include <stdio.h>\n\
  #include \"C_TUT.c\"\nint main(){\n  extern int globalValue;\n  printf(\"The global\
  \ variable is: %d\", globalValue);\n}\n```\n\n## 程序 2（较短） [C_TUT.c]\n```c\n#include\
  \ <stdio.h>\nint globalValue = 1032;\n```\n运行 `File_2.c` 的输出:\n>The global variable\
  \ is: 1032\n\n这显示 `globalValue` 是从 `C_TUT.c` 被引用的，并通过 `extern` 关键字在另一个文件中使用。\n\n\
  ## 递归\n我们在教程的基础部分提到过递归，再次强调，它是函数任务对自身的定义。正如承诺的那样，下面解释了更多关于递归的示例：\n\n```c\nint factorial(int\
  \ x){\n  int r;\n  // 停止条件\n  if (x == 1){\n    // 有结论所以循环停止\n    return 1;\n  }else{\n\
  \    // 递归定义\n    return r = x * factorial(x - 1);\n  }\n}\nint main(){\n  puts(\"\
  Please enter a number: \");\n  // 读取用户输入\n  int a, b;\n  scanf(\"%d\", &a);\n  //\
  \ 开始执行\n  b = factorial(a);\n  printf(\"The factorial is: %d\", b);\n}\n```\n这是一个世界著名的递归示例，用于计算数字的阶乘（3\
  \ 阶乘是 3x2x1）。它通过上面的递归返回语句工作；通过包含一个没有递归定义的返回语句来停止，即当 `x = 1` 时，函数直接返回 1；这意味着栈可以回溯并找到答案。\n\
  \n## 递归示例\n递归是一个困难的概念，在这里将简单带过，其在现实世界中的用途和功能将在高级部分解释。递归是函数涉及自身引用的命令定义，是的，这非常困惑，我明白，但我用一些示例来解释。\n\
  \n```c\nconst int maxLoops = 5;\nvoid Sequence(int previous, int now, size_t loopCount){\n\
  \  // 计算下一个值\n  int next = previous + now;\n  // 打印新值\n  printf(\"New value: %d\\\
  n\", next);\n  // 计数\n  loopCount++;\n  // 确保不会发生无限循环的停止条件\n  if (loopCount < maxLoops){\n\
  \    // 递归调用\n    Sequence(now, next, loopCount);\n  }\n}\nint main(){\n  Sequence(1,\
  \ 1, 0);\n}\n```\n输出:\n>New value: 2\n>New value: 3\n>New value: 5\n>New value:\
  \ 8\n>New value: 13\n\n有几点需要注意：缺乏迭代循环，递归的本质导致了循环。第二点需要注意的是标记为“停止条件”的 if 语句，如果递归设置没有停止循环的条件，它们将永远循环下去，因此这是有效使用递归的关键元素。\n\
  \n# 第 6 章：STL 容器和迭代器\n## 容器\n容器是 STL 的主要贡献，用于持有和访问对象序列。STL 提供了不同类型的容器，如 `vector`、`list`、`map`\
  \ 和哈希表。然而，根据数据排列的特征，STL 容器分为三个部分：\n\n1. **序列容器**，如 `vector`、`array`、`list`、`forward_list`\
  \ 和 `deque`。\n2. **关联容器**：\n   a) 有序（排序）关联容器：`set`、`multiset`、`map` 和 `multimap`。\n\
  \   b) 无序（未排序）关联容器：`unordered_set`、`unordered_multiset`、`unordered_map` 和 `unordered_multimap`。\n\
  3. **容器适配器**，如 `stack`、`queue` 和 `priority_queue`。\n\n此外，C++ 还提供了 `string` 和 `valarray`。每个容器都是复杂的模板类，具有默认构造函数、参数构造函数、拷贝构造函数、赋值运算符和析构函数。此外，大多数容器定义了自己的迭代器。\n\
  \n## 容器迭代器\n从这些部分我们知道每个容器都提供了自己的迭代器，并在容器元素上执行器操作。在五种迭代器分类中，每个容器定义了以下三种之一：\n\n- **前进迭代器**：\n\
  \  - 可读；\n  - 可写；\n  - 可在位置重复读写；\n  - 可以向前移动 (`++`) 但不能向后移动，因此名为前进迭代器；\n  - 用于无序关联容器和\
  \ `forward_list`（用于空间高效存储）。\n\n- **双向迭代器**：\n  - 与前进迭代器相同，但也可以向后移动（即有 `++` 也有 `--`），因此是双向的；\n\
  \  - 用于 `list`、`set`、`map`、`multiset` 和 `multimap`。\n\n- **随机访问迭代器**：\n  - 与双向迭代器相同，但它可以跳转\
  \ (`+=N` 或 `-=N`，其中 `N` 是整数) 而不是 (`+=1` 或 `-1`，其中 `+=1` 是 `++`，`-=1` 是 `--`)，因此名为随机访问迭代器；\n\
  \  - 用于 `vector`、`string`、`deque` 和 `array<T,N>`。\n\n除了帮助容器中的 STL 算法操作，迭代器还有助于执行容器的内部操作（成员函数）。所有序列和关联容器通用的内部操作包括：\n\
  \n- **O(1)**：`begin()`、`end()`、`cbegin()`、`cend()`、`rbegin()`、`rend()`、`crbegin()`、`crend()`、`empty()`、`swap()`、`size()`、`max_size()`、`shrink_to_fit()`、`emplace()`\
  \ 和 `emplace_back()`。\n- **O(n)**：赋值运算符 (`=`)、关系运算符 (`!=`, `==`, `<`, `<=`, `>`,\
  \ `>=`) 以及 `clear()`。\n\n\n\n\n\n- `insert()`, `erase()` 和 `emplace()`（它们在基于节点的容器中较快，在连续内存容器（中间）中较慢）；\n\
  - 构造函数（通常情况下，类的组合或\n- 它们的默认构造函数具有常数级复杂度，但所有其他构造函数和析构函数可能有线性复杂度）。\n\n**注意：**\na)\
  \ `forward list`（单向链表）和 `unordered associative containers`（无序关联容器）使用正迭代器，因此它们不支持反向迭代器操作：`emplace_back()`，`rbegin()`，`rend()`，`crbegin()`\
  \ 和 `crend()`。\nb) 关联容器支持反向迭代器，但不支持 `emplace_back`。这是因为关联容器按照排序顺序存储元素，因此不接受强制将新元素置于容器末尾的\
  \ `emplace_back()` 命令。\n\n### forward_list（单向链表）：\n\n1. 不支持运算符 `size()`；\n2. 提供\
  \ `insert_after()`、`erase_after()` 和 `emplace_after()` 来代替 `insert()`、`erase()`\
  \ 和 `emplace()`；\n3. 具有特殊的迭代器 `before_begin()`、`cbefore_begin()`，使得\n\n在 `forward_list`\
  \ 中的操作：\n```\nmy_fwd_list.insert_after(my_fwd_list.before_begin(), inv_data.gold);\n\
  ```\n等同于 `list` 中的以下操作：\n```\nmy_list.insert(my_list.begin(), inv_data.gold);\n\
  ```\n**注意：**\n没有任何一个容器可以在 `end()` 之后写入或读取，即 `my_fwd_list.insert_after(my_fwd_list.end(),\
  \ inv_data.gold)` 是错误！\n\n`shrink_to_fit()` 请求移除未使用的内存容量，它仅适用于 `vector`、`deque`\
  \ 和 `string`。无序容器不支持关系运算符：`<`、`<=`、`>` 和 `>=`![](img/Image00056.jpg) 在上述运算符列表中，`O`\
  \ 代表复杂度，简单来说，尽管复杂度意味着函数的时间和或空间复杂度，但在容器中指的是时间复杂度；\n\n- `O(1)` 代表常时间复杂度；\n- `O(log\
  \ n)` 代表对数时间复杂度；\n- `O(n)` 代表线性时间复杂度；\n\n\n\n\n相比之下，`O(n) > O(log n) > O(1)`，这意味着\
  \ `O(1)` 是最快的操作；注意：这些是预期复杂度或平均复杂度，而标准库文档对某些操作符引用了最坏情况复杂度。有少数容器不支持迭代器，它们是：容器适配器、`bitset`\
  \ 和 `valarray`。注意：C++11 为 `valarray` 定义了迭代器 `begin()` 和 `end()`。\n\n# STL 迭代器\n\n\
  迭代器、容器和算法是由 Alexander Stepanov 等人在 20 世纪 90 年代初在惠普包装公司编写的标准模板库（STL）的组件，随后在标准库中被合并和改进。\n\
  \n迭代器是特殊指针的抽象，它用于对给定容器（如 `vector`、`map` 和用户定义的容器类）的元素进行解引用。每个容器类都包含用于生成迭代器的成员函数，例如，成员\
  \ `begin()` 和 `end()` 分别返回指向第一个元素和最后一个元素之后元素的迭代器。\n\n下图描述了迭代器 `*it` 与其容器 `vector<int>data\
  \ {1111, 1134, 1134, 1124, 1124, 1134, 1111, 1176, 1124, 1134, 1176}` 之间的关系。然后，迭代可以在算法操作中使用容器的元素（如\
  \ `sort`、`accumulate` 和自定义算法函数）。句话句话，迭代器将容器与算法关联起来。\n\n最常用的迭代器来自 `begin()` 和 `end()`。这在底图中所示：如图所示，`data[0]`\
  \ 和 `data.begin()` 表示同一个元素，即 `elem 1`，但 `data[N]` 和 `data.end()` 表示一个“无人区”，访问该区域会导致运行时错误。然而，成员函数\
  \ `end()` 在迭代语句中构造条件时非常有用。\n\n以下代码说明了迭代器的这一基本属性：\n\n```cpp\n// iterators.cpp\n#include\
  \ \"..\\..\\my_essentials.hpp\"\nvoid illustrate_iterators(){\n    int arr[] = {1111,\
  \ 1134, 1134, 1124, 1124, 1134, 1111, 1176, 1124, 1134, 1176};\n    vector<int>data(arr,\
  \ arr+ sizeof(arr)/sizeof(arr[0])); \n    // vector<int>data2{1111, 1134, 1134,\
  \ 1124, 1124, 1134, 1111, 1176, 1124, 1134, 1176}; // fine with gcc4.7.0\n    cout\
  \ << \"\\n Illustration of iterators: \\n\" << \"\\n Given vector: data =\\n\\t(\
  \ \";\n    for(auto element: data) // 'the range-based for' do not work with VC10.\n\
  \        cout << element << \"; \";\n    cout << \")\\n\\n Let us define an iterator,\
  \ say *it for this vector.\\n\";\n    vector<int>::iterator it = data.begin();\n\
  \    /*Note:In STL containers, each container template class defines its own iterator\
  \ member class, so thatvector<int>::iterator is different from the list <int>::iterator.*/\n\
  \    cout << \" Thus,\\t\\t*it = \" << *it << \" that is data[0]\\n Iterators can\
  \ be incremented, i.e, ++it;\\n\";\n    ++it;\n    cout << \" After ++\\t*it = \"\
  \ << *it << \" that is data[1]\\n Therefore, iterator *it dereferences through vector\
  \ data.\\n So, let us express the entire vector using the iterator:  \\n\\t( \"\
  ;\n    for(auto it = data.begin(); it!=data.end(); ++it)\n        cout << *it <<\
  \ \"; \";\n    cout << \")\\n\";\n    cout << \"\\n Task: Since, this vector has\
  \ repeated numbers,\\n Can we keep only one copy of each number and remove the duplicates?\\\
  n Yes, we can!\\n For that, we pass the iterator through three type of STL algorithms\
  \ as shown below:\\n\";\n    cout << \"\\n Step.1 Sort in ascending order:\\n\"\
  ;\n    sort(data.begin(), data.end());\n    cout << \" After the iterator has passed\
  \ through sort(): \\n\\t( \"; \n    for(auto element: data)\n        cout << element\
  \ << \"; \";\n    cout << \")\\n\\n Step.2 Move the adjacent repeated elements to\
  \ the left hand side:\\n\";\n    auto my_unique = unique(data.begin(), data.end());\n\
  \    cout << \" After the iterator has passed through unique(): \\n\\t( \";\n  \
  \  for(auto element: data)\n        cout << element << \";/*The function unique()\
  \ has returned an iterator to the identifier “my_unique” starting from which thererepeated\
  \ elements are pushed up to one before theend().Note: The STL algorithms can displace\
  \ the elementsbut it cannot erase them, however each stl containtemplate class has\
  \ a member function called“erase()” operation for erasing the specifiedelements.In\
  \ other words, iterators can modify elements in containers but not the containers\
  \ themselves.Therefore, to remove the duplicates, we apply the operation erase()\
  \ from the iterator “my unique” till the end().*/\n    cout << \")\\n\\n Step.3\
  \ Erase out repeated elements:\\n\";\n    data.erase(my_unique, data.end());\n \
  \   cout << \" After the iterator has passed through erase() i.e., \\n Final:\\\
  t( \";\n    for(auto element: data)\n        cout << element << \"; \";\n    cout\
  \ << \")\\n\";\n}\nint main(){\n    illustrate_iterators();\n    just_pause();\n\
  }\n```\nIllustration of iterators:\nGiven vector: data =( 1111; 1134; 1134; 1124;\
  \ 1124; 1134; 1111; 1176; 1124; 1134; 1176; )\nLet us define an iterator, say *it\
  \ for this vector.\nThus,*it = 1111 that is data[0]\nIterators can be incremented,\
  \ i.e, ++it;\nAfter ++it = 1134 that is data[1]\nTherefore, iterator *it dereferences\
  \ through vector data.\nSo, let us express the entire vector using the iterator:\
  \  \n\t(1111; 1134; 1134; 1124; 1124; 1134; 1111; 1176; 1124; 1134; 1176; )\nTask:\
  \ Since, this vector has repeated numbers,\nCan we keep only one copy of each number\
  \ and remove the duplicates?\nYes, we can!\nFor that, we pass the iterator through\
  \ three type of STL algorithms as shown below:\nStep.1 Sort in ascending order:\n\
  After the iterator has passed through sort(): \n\t( 1111; 1111; 1124; 1124; 1134;\
  \ 1134; 1134; 1134; 1134; 1176; 1176; )\nStep.2 Move the adjacent repeated elements\
  \ to the left hand side:\nAfter the iterator has passed through unique(): \n\t(\
  \ 1111; 1124; 1134; 1176; /*The function unique() has returned an iterator to the\
  \ identifier “my_unique” starting from which thererepeated elements are pushed up\
  \ to one before theend().Note: The STL algorithms can displace the elementsbut it\
  \ cannot erase them, however each stl containtemplate class has a member function\
  \ called“erase()” operation for erasing the specifiedelements.In other words, iterators\
  \ can modify elements in containers but not the containers themselves.Therefore,\
  \ to remove the duplicates, we apply the operation erase() from the iterator “my\
  \ unique” till the end().*/ )\nStep.3 Erase out repeated elements:\nAfter the iterator\
  \ has passed through erase() i.e., \nFinal:(1111; 1124; 1134; 1176; )\n```\n\nThe\
  \ program presented above demonstrates the usefulness of iterators incorporating\
  \ container data in algorithms. As saw, the iterators can be used for printing the\
  \ contents of a container, so us code a container- independent code in our header\
  \ file \"my_essentials.hpp\". This is for easy printing of containers of one type\
  \ such as `vector<T>`, `list<T>`, `set<T>`, `multiset<T>`, `deque<T>` and fixed-size\
  \ `array<T,N>`, but not for containers with two type names such as `map<T1,T2>`\
  \ and `unordered_multimap<T1,T2>`.\n\n\n\n\n\n- 非修改性算法：例如 `for each`，`count`，`search`\
  \ 等。\n- 修改算法：例如 `copy`，`transform` 等。\n- 移除算法：`remove`，`remove if` 等。\n- 变动算法：`reverse`，`rotate`\
  \ 等。\n- 排序算法：`sort`，`partial sort` 等。\n- 有序范围算法：`binary search`，`merge` 等。\n- 数值算法：`accumulate`，`partial\
  \ sum`，`inner product` 等。\n\n下面的示例展示了 `sort()` 函数如何在数组上工作。\n\n### 程序 13.11：使用排序算法对数组排序\n\
  ```cpp\n#include <iostream>\n#include <algorithm>\nusing namespace std;\nint main(){\n\
  \    int a[ ] = {3,5,7,2,9} ;\n    sort(a, a + 5);\n    cout << \"Sorted Array:\"\
  \ << endl;\n    for (int i = 0; i <5; i++)\n    cout << a[i] << \" \";\n    return\
  \ 0;\n}\n```\nOutput: Sorted Array: 2 3 5 7 9\n\n在上面的示例中，当我们把数组名 `an` 作为参数传递时，我们是在告诉函数从数组的开头开始排序。如果我们想让它从数组的第三个元素开始排序，可以使用\
  \ `sort(a+3, a+5);`。我们使用 `a+5` 作为第二个参数，这指定了我们想要排序到数组的最后一个元素。\n\n现在，类似的 `sort()`\
  \ 函数可以与 `vector` 容器一起工作，如下所示的程序所示。这表明 STL 算法是通用的。\n\n### 程序 13.12：使用排序算法对 vector\
  \ 排序\n```cpp\n#include <iostream>\n#include <algorithm>\n#include <vector>\nusing\
  \ namespace std;\nint main(){\n    int a[ ] = {5,3,7,6,2,9};\n    vector<int> v(a,\
  \ a+6) ;\n    sort(v.begin(), v.end());\n    for (int i = 0; i != v.size(); i++)\n\
  \    cout << v[i] << \" \";\n    cout << endl;\n    return 0;\n}\n```\nOutput: 2\
  \ 3 5 6 7 9\n\n如你所示，排序函数的工作方式与在数组上几乎相同。`sort()` 中的第一个参数接受使用 `begin()` 的指向第一个元素的迭代器，因为它返回指向第一个元素的迭代器。因此，它将从向量的第一个元素开始排序。同样，`end()`\
  \ 返回一个指向容器中最后一个元素之后元素的迭代器。注意，`sort` 函数排序到我们传递的第二个参数为止，但不包含该元素。\n\n### `find()` 和\
  \ `count()` 算法\n`find()` 算法有助于从容器中查找特定值。`count()` 用于计算特定值在容器中出现的次数。\n\n### 程序 13.13：使用\
  \ find 算法从 vector 中查找值\n```cpp\n#include <iostream>\n#include <algorithm>\n#include\
  \ <vector>\nusing namespace std;\nint main(){\n    vector<int> v;\n    for(int i\
  \ = 0; i < 10; i++)v.push_back(i);\n    int a = 5;\n    vector<int>::iterator it;\n\
  \    it = find(v.begin(),v.end(),a);\n    if(it != v.end()) {\n        cout << \"\
  found \" << a<< endl;\n    }else {\n        cout << \"could not find \" << a <<\
  \ endl;\n    }\n    int c = count(v.begin(), v.end(), 6);\n    cout<<\"Number of\
  \ 6 stored in vector:\" << c;\n    return 0;\n}\n```\nOutput: found 5 Number of\
  \ 6 stored in vector: 1\n\n### 对于 `each()`\n该算法将指定的函数对象应用于容器中的每个元素。容器中的原始值不会改变，但它用于显示修改后的元素。它接受前两个参数作为开始和结束范围。第三个参数是函数对象的地址。\n\
  例如，`each()` 算法会将数组的所有元素求平方并显示它们。\n\n### 程序 13.14：使用 for each 算法将数组的所有元素平方\n```cpp\n\
  #include <iostream>\n#include <vector>\n#include <algorithm>\nusing namespace std;\n\
  void square(int a){\n    cout<<a*a<<endl;\n}\nint main(){\n    int s[ ]={1,2,3,4};\n\
  \    for_each(s, s+4, square);\n    return 0;\n}\n```\nOutput: 1 4 9 16\n\n# 第 8\
  \ 章：库函数\n\n### C++ 中的库函数和用户定义函数\n\n### 学习目标\n完成本主题后，你应该能够简要介绍 C++ 中的库函数和用户定义函数。\n\
  \n### 1. 库函数的引入\nC++ 程序员可以访问大量的库函数。你只需包含包含适当函数原型声明的头文件名称，即可使用库中的任何函数。\n\n通常，库函数是在一对文件中指定的。\n\
  函数定义包含在一个源文件中，该文件通常具有 `.c` 或 `.cpp` 扩展名。\n**注意**：通常，编译器不会向你提供库函数的源代码。相反，它会提供编译好的对象文件。\n\
  \n现在，类似的 `sort()` 函数可以与 `vector` 容器一起工作，如下所示的程序所示。这表明 STL 算法是通用的。\n\n### `find()`\
  \ 和 `count()` 算法\n`find()` 算法有助于从容器中查找特定值。`count()` 用于计算特定值在容器中出现的次数。\n\n### 对于\
  \ `each()`\n该算法将指定的函数对象应用于容器中的每个元素。容器中的原始值不会改变，但它用于显示修改后的元素。它接受前两个参数作为开始和结束范围。第三个参数是函数对象的地址。\n\
  例如，`each()` 算法会将数组的所有元素求平方并显示它们。\n\n（此处由于原文存在重复内容，已按要求处理，接后续翻译部分）\n\n### C++ 中的库函数和用户定义函数\n\
  \n### 学习目标\n完成本主题后，你应该能够简要介绍 C++ 中的库函数和用户定义函数。\n\n### 1. 库函数的引入\nC++ 程序员可以访问大量的库函数。你只需包含包含适当函数原型声明的头文件名称，即可使用库中的任何函数。\n\
