  \ 获取阶乘。然后，如果 `op` 等于 8，我们使用 `math.ceil(num1)` 获取上整。然后，如果 `op` 等于 9，我们使用 `math.floor(num1)`\
  \ 获取下整。然后，如果 `op` 等于 10，我们使用 `math.log(num1)` 获取对数。然后，如果 `op` 等于 11，我们使用 `math.sqrt(num1)`\
