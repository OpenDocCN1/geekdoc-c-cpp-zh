  \ 获取余弦。然后，如果 `op` 等于 14，我们使用 `math.tan(num1)` 获取正切。然后，如果 `op` 等于 15，我们使用 `math.acos(num1)`\
  \ 获取反余弦。然后，如果 `op` 等于 16，我们使用 `math.asin(num1)` 获取反正弦。然后，如果 `op` 等于 17，我们使用 `math.atan(num1)`\
