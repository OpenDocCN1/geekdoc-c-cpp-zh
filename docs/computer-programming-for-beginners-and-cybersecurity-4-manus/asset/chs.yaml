  \n\n\n\n\n### 运算符类型\n\n*   逻辑运算符\n*   位运算符\n*   关系运算符\n*   算术运算符\n\n### Java 基础概念\n\
  \n与其他计算机语言一样，`Java` 也定义了一系列额外的运算符来处理某些特定的场景。在学习 `JAVA` 编程语言（或者泛指任何编程语言）时，在开始之前你必须理解五个基础概念。这五个基础概念包括：\n\
  \n*   变量\n*   数据结构\n*   控制结构\n*   语法\n*   工具\n\n\n\n这些概念都将以初级水平进行详细解释，以确保它们能够被理解。\n\
  \n### 分隔符 (Separators)\n它们不适用于高级抽象：请注意，许多此类程序都使用了低级结构，而这些结构主要用于低级抽象。这些编程语言的常用方法是它们关注机器——即如何让计算机执行某些操作，而不是这些函数如何帮助解决用户的问题。这些语言处理微小的细节，这已经超出了高级抽象的范围，而高级抽象是我们今天看到的更常见的方法。在低级抽象中，数据结构和算法是分开考虑的，而在高级抽象中，它们被视为一个整体。\n\
  \n### 字面量 (Literals)\n当提到 Java 中的字面量时，我们指的是以人类可以读懂的形式出现的固定值。我们可以说数字 `200` 是一个字面量。大多数情况下，字面量可以是常量。字面量在程序中非常重要。事实上，大多数\
  \ Java 程序都使用字面量。我们在书中已经讨论过的某些程序也使用了字面量。Java 中的字面量涵盖各种原始数据类型。每个字面量的显示方式由其类型决定。正如不久前提到的，我们将字符常量括在单引号中，例如\
  \ `'c'` 和 `'%.'`。我们在定义整数字面量时不涉及小数部分。例如，`12` 和 `-30` 是整数字面量。一个浮点数字面量应该包含小数点以及小数部分。`12.389`\
  \ 是一个浮点字面量。Java 进一步允许对浮点数字面量使用科学计数法。整数字面量包含 `int` 值，任何人都可以用 `short`、`byte` 和 `char`\
  \ 变量来初始化它们。\n\n### 注释 (Comments)\n当出现这种情况时，我们称其为灰色注释。在程序的运行阶段，灰色部分（注释）是无关紧要的。这意味着你可以使用注释功能来说明或解释你正在创建的代码想要实现的目标。你可以通过输入两个斜杠然后是注释来实现这一目标。这里有一个示例：\n\
  \n```\n//在此处放置你的单行注释\n```\n\n你可以通过以下任一方式拥有多行注释：\n```java\n// 我们将把\n// 注释分成两行\n```\n\
  或者\n```java\n/*此注释跨越两行*/\n```\n如果你查看上面的注释，你会发现它以 `/*` 开头但以 `*/` 结尾。此外，如果你查看之前的图像（图\
  \ 8），你会注意到有些注释以单个正斜杠和两个星号（`/**`）开头，以一个星号和一个正斜杠结束；这被称为 Javadoc 注释。\n\n# 第 2 章：变量\
  \ (Variables)\n\n什么是变量？\n另一方面，变量是一个包含特定数据类型并分配或接收值的“对象”。它之所以被称为变量，是因为其中的值可以根据其在代码中的用处、程序员如何声明其值，甚至程序用户选择如何与其交互而发生变化。简而言之，变量是数据类型的存储单元。访问变量允许程序员方便地标记和调用手头存储的值。\n\
  \n### Java 中变量的类型 (Types of variables in Java)\nJava 要求程序员使用声明语句，即用于声明变量并通过指定特定数据类型和名称来定义它们的代码行。Java\
  \ 有特定的处理变量的方法，将变量定义为包含特定类型和值信息的容器，不像 python 等某些语言只需要声明变量，且变量可以动态更改其类型；Java 变量是静态的，一旦声明，就会保留其类型。\n\
  \n```java\nInt number = 20;\nBoolean completed = true;\nString hello = \"Hello World!\"\
  ;\n```\n\n声明的语法在之前的示例中可见，变量类型在前，然后是变量名，然后是值。同样注意，声明语句可以在一行中由多个声明组成，如下例：\n\n```java\n\
  Int number = 20, Boolean completed = true, string hello = \"Hello World!\";\n```\n\
  \nJava 变量可以在开始时不赋任何值声明；在这些情况下，Java 选择用特定的默认值来声明这些变量，例如：\n\n```java\nByte a;\nShort\
  \ num;\nBoolean answer;\n```\n将分别产生值 `0`、`0` 和 `false`。更完整的默认值列表如下：`byte`、`short`、`int`\
  \ 和 `long` 数据类型都将产生默认值 `0`，而 `float` 和 `double` 数据类型将具有默认值 `0.0`，`char` 数据类型将产生\
  \ `'u\\0000' ` 值，字符串或任何其他对象将具有 `null` 默认值，所有的 `Booleans` 都将以 `false` 默认值开始。\n\n\
  在 Java 中，变量在声明时是静态的，这意味着程序员必须定义变量将包含的数据类型。为了说明，如果我们想使用变量 `num` 来存储一个数字，我们必须先声明变量：`\"\
  int num\"`，然后就可以赋值，如 `num = 10`。\n\n上述过程通常被称为并称为“赋值语句”，其中值被分配给程序员声明的变量。然而，Java（实际上是大多数编程语言）工作方式的一个显著特点是，在赋值语句中，值被分配给程序员声明的变量。Java\
  \ 变量可以在开始时不赋任何值声明；在这些情况下，Java 选择用特定的默认值来声明这些变量，例如（上文）。\n\n\n\n* 它是免费且开源的。因此，许多开发者不断向该\
