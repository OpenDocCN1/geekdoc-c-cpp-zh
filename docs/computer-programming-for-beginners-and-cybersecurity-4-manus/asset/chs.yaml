  \ 项目和包。如果你在不使用 Eclipse 的情况下创建 Java 程序，可能只会使用包。\n\n# 第 2 节 – 类、超类和程序\n\nJava 程序由一个或多个类组成。类包含实际的程序代码：这些指令按顺序执行时会完成所需的任务。每个类都必须指定另一个类作为其超类（superclass）。例如，打算在窗口中运行的程序必须指定某种类型的窗口类作为其超类。在本节中，你将创建你的第一个类：一个在\
