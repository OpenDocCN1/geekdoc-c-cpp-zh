  \ Java 企业版构建企业级应用程序。\n* 它提供了代码重构的能力。\n* 它有助于代码补全。\n* 它有许多种扩展和插件。\n* 它还支持大多数源代码版本控制系统。\n\
  \n## Netbeans\nNetBeans 是 Java 语言初学者非常受推荐的 IDE。它是一个强大且快速的 IDE，支持所有 Java 平台以及移动应用程序。它运行在\
  \ `Windows`、`Linux`、`Mac OS X` 和 `Solaris` 等多种平台上。它还支持如 `HTML5`、`C/C++` 和 `PHP`\
  \ 等语言。\n\n## Java 的优点\n* Java 体现了编程的简单性，这归益于其在学习、编写、部署和实现方面友好的用户界面。\n* Java 的核心架构旨在便于在开发环境中的集成和使用便利性。\n\
  * Java 是平台无关且易于移植的，使其适用于多任务处理和跨软件应用使用。\n* Java 的面向对象特性支持创建具有标准特征的程序，并且代码可以被重新部署。\n\
  * Java 的网络能力使得程序员更容易地为共享计算环境创建软件解决方案。\n* Java 与 `C++` 和 `C` 语言之间的紧密关系使得任何具备另外两种语言知识的人都更容易学习\
  \ Java。\n* Java 的自动垃圾回收机制提供了持续的内存保护，使程序员在编写代码时方便地消除安全漏洞。\n* Java 的架构对于多线程程序的实现非常灵活。\n\
  * 归益于可以使用接口或继承特性重新部署类的能力，Java 非常易于重用。\n\n## Java 的缺点\n* 由于 Java 不是原生应用程序，与其他编程语言相比，它的运行速度较慢。\n\
  * Java 在图形的处理和显示方面可能缺乏一致性。例如，基于 Java 的应用程序中图形用户界面 (GUI) 的普通外观与原生软件应用程序的 GUI 输出相比大不同，且标准较低。\n\
  * Java 的垃圾回收是一项管理内存效率的特性，当它作为后台程序运行时，可能会干扰速度和性能。\n\n# 第 5 章：对象与类\n最后，我们将查看类和对象；Java\
  \ 中的对象必须有一个状态（存储在字段中）和一个行为（由方法指示）。类就像一张地图，或者如果你愿意的话，可以是一份蓝图，根据它创建对象。类看起来像如下所示：\n\
  \n```java\npublic class Dog {\n  String breed;\n  int ageC;\n  String color;\n \
  \ void barking() {}\n  void whining() {}\n  void sleeping() {}\n}\n```\n\n类可以具有任何一种这些变量类型：\n\
  \n* **局部（Local）**——定义在构造函数、块或方法内部。变量在方法内部声明并初始化，并在方法结束后被销毁。\n* **实例（Instance）**——定义在类中但在方法之外。在类实例化时初始化，并可以从类的任何构造函数、块或方法内部访问。\n\
  * **类（Class）**——定义在类内部，使用 `static` 关键字，且在任何方法之外。\n\n\n\n\n## Java 类\n\n类可以拥有多个方法，数量根据需要而定，用以访问方法中所有不同类型的值。在上面的示例中，我们有三个方法——`barking()`、`whining()`\
  \ 和 `sleeping()`。\n\n### 构造函数\n每个类都会有一个构造函数；如果你省略了它，编译器将构建一个默认构造函数。当你创建一个新对象时，必须调用一个构造函数。按照规则，构造函数的名称必须与类名相同，并且一个类可以根据需要拥有任意数量的构造函数。\n\
  \n构造函数的形式如下：\n```java\npublic class Puppy {\n  public Puppy() {}\n  public Puppy(String\
  \ name) {\n    // 这个构造函数有一个参数，name。\n  }\n}\n```\n\n### 创建对象\n我们已经知道类是用来创建对象的蓝图，所以不言而明对象是从类中创建的。要创建一个新对象，我们需要使用\
  \ `new` 关键字。\n\n从类中创建对象需要以下三个步骤：\n\n1. **声明** – 必须使用名称和对象类型来声明变量。\n2. **实例化** –\
  \ 使用 `new` 关键字创建对象。\n3. **初始化** – 调用构造函数，从而初始化对象。\n\n下一个示例展示了如何创建对象：\n```java\n\
  public class Puppy {\n  public Puppy(String name) {\n    // 这个构造函数包含一个名为 name 的参数。\n\
  \    System.out.println(\"Passed Name is :\" + name );\n  }\n  public static void\
  \ main(String []args) {\n    // 下一语句将创建一个名为 myPuppy 的对象\n    Puppy myPuppy = new\
  \ Puppy( \"fluffy\" );\n  }\n}\n```\n运行它看看发生了什么。\n\n### 访问实例变量和方法\n当我们想要访问实例变量和方法时，可以使用对象；此示例展示了如何访问实例变量：\n\
  \n```java\n/* 首先我们创建对象 */\nObjectReference = new Constructor();\n/* 现在我们这样调用我们的变量\
  \ */\nObjectReference.variableName;\n/* 现在我们这样调用类方法 */\nObjectReference.MethodName();\n\
  ```\n\n接下来，我们可以看到如何访问类中的实例变量和方法：\n```java\npublic class Puppy {\n  int PuppyAge;\n\
  \  public Puppy(String name) {\n    // 这个构造函数包含一个名为 name 的参数。\n    System.out.println(\"\
  Name chosen is :\" + name );\n  }\n  public void setAge(int age) {\n    PuppyAge\
  \ = age;\n  }\n  public int getAge() {\n    System.out.println(\"Puppy's age is\
  \ :\" + PuppyAge );\n    return PuppyAge;\n  }\n  public static void main(String[]\
  \ args) {\n    /* 创建对象 */\n    Puppy myPuppy = new Puppy( \"fluffy\" );\n    /*\
  \ 现在我们调用类方法设置 Puppy 的年龄 */\n    myPuppy.setAge(2);\n    /* 接下来，我们调用另一个类方法获取 Puppy\
  \ 的年龄 */\n    myPuppy.getAge();\n    /* 我们通过这种方式访问实例变量 */\n    System.out.println(\"\
  Variable Value :\" + myPuppy.PuppyAge );\n  }\n}\n```\n运行它看看发生了什么。\n\n## 导入语句\n\
  需要记住的一个重要点是路径必须是全限定的，这包含了类名和包名。如果不是，编译器将难以加载源代码和类。要限定路径，我们需要使用 `import` 语句，在本示例中，我们看到编译器如何将请求的类加载到我们指定的目录：\n\
  ```java\nimport java.io.*;\n```\n\n接下来，我们需要创建两个类，一个名为 `Employee`，另一个名为 `EmployeeTest`。我们使用以下代码来实现——请记住\
  \ `Employee` 是类名，它是一个公共类。执行此操作并保存文件，命名为 `Employee.java`。\n\n另请注意，这里有四个实例变量 `age`、`name`、`designation`\
  \ 和 `salary`，以及一个显式定义并带有参数的构造函数：\n```java\npublic class Employee {\n  String name;\n\
  \  int age;\n  String designation;\n  double salary;\n  // 这是名为 Employee 的类的构造函数\n\
  \  public Employee(String name) {\n    this.name = name;\n  }\n  // 将 Employee 的年龄赋值给变量\
  \ age。\n  public void empAge(int empAge) {\n    age = empAge;\n  }\n  /* 将头衔赋值给变量\
  \ designation。*/\n  public void empDesignation(String empDesig) {\n    designation\
  \ = empDesig;\n  }\n  /* 将薪水赋值给变量 salary。*/\n  public void empSalary(double empSalary)\
  \ {\n    salary = empSalary;\n  }\n  /* 打印员工详情 */\n  public void printEmployee()\
  \ {\n    System.out.println(\"Name:\"+ name );\n    System.out.println(\"Age:\"\
  \ + age );\n    System.out.println(\"Designation:\" + designation );\n    System.out.println(\"\
  Salary:\" + salary);\n  }\n}\n```\n\n代码处理从 `main` 方法开始，因此你需要确保你的代码有一个 `main` 方法，并且我们需要创建一些对象。我们将从创建一个名为\
  \ `EmployeeTest` 的类开始，这将创建 `Employee` 类的几个实例。必须调用每个对象的方法以便将值赋值给变量。将此代码保存在 `EmployeeTest`\
  \ 中：\n```java\npublic class EmployeeTest {\n  public static void main(String args[])\
  \ {\n    /* 使用构造函数创建两个对象 */\n    Employee empOne = new Employee(\"Bobby Bucket\"\
  );\n    Employee empTwo = new Employee(\"Shelley Mary\");\n    // 调用我们创建的每个对象的方法\n\
  \    empOne.empAge(28);\n    empOne.empDesignation(\"Senior Software Developer\"\
  );\n    empOne.empSalary(1500);\n    empOne.printEmployee();\n    empTwo.empAge(22);\n\
  \    empTwo.empDesignation(\"Software Developer\");\n    empTwo.empSalary(850);\n\
  \    empTwo.printEmployee();\n  }\n}\n```\n现在需要编译这些类，并运行 `EmployeeTest` 看看发生了什么：\n\
  ```\njavac Employee.java\njavac EmployeeTest.java\njava EmployeeTest\nName: Bobby\
  \ Bucket\nAge: 28\nDesignation: Senior Software Developer\nSalary: 1500\nName: Shelley\
  \ Mary\nAge: 22\nDesignation: Software Developer\nSalary: 850\n```\n\n\n\n\n\n*\
  \   Eclipse 将在你的电脑上创建一个与 Java 项目同名的文件夹。为你的 Java 项目取一个你想要在电脑上使用的文件夹名称。\n    *   你现在在\
  \ Java 工作区（workspace）中有一个名为 `Hello World` 的文件夹。\n    *   例如，像 `Hello World` 项目一样，将每个单词的首字母大写，并在单词之间加上空格。\n\
