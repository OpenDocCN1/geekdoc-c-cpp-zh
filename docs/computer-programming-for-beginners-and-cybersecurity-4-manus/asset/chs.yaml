  \n## Python 编程\n\n\n\n\n## Python 编程\n引言\n技术的引入，尤其是计算机，对我们的行为产生了不同的影响。有些人把大部分时间花在计算机上，通过创建程序和网站来维持生；而另一些人则研究计算机，试图理解机器运行的许多原理。编程是全球网络领域大多数人关注的收入来源之一。他们可以在公司或电脑维修店工作，保护电脑免受黑客等攻击。Python\
  \ 是最先进的编程工具之一，因为任何人（包括学者或专家）都可以轻松地使用和阅读。使用 Python 的秘密在于你可以阅读它，因为它包含了语法，这允许你作为程序员表达概念，而不必一定要创建一个编码页面。这使得\
  \ Python 比 `C ++` 和 Java 等其他代码更易使用和阅读。总的来说，由于其易用性和可读性，Python 是最适合你的语言。因此我们有信心，在课程期间和之后创建第一个程序时，你能够轻松阅读并理解输入的所有代码。\n\
  \n### Python 的特性\nPython 具有以下特点：\n- 丰富的库：它可以与其他编程项目协作，如搜索文本、连接网络服务器和交换文件。\n- 交互性：使用\
  \ Python 非常简单，因为你可以轻松测试代码以判断它们是否有效。\n- 它是免费软件；因此你可以随时从互联网通过计算机下载。\n- Python 编程语言可以扩展到其他模块，如\
  \ `C ++` 和 C。\n- 拥有优雅的语法，便于初学者阅读和使用。\n- 有多种基础数据类型供选择。\n\n\n\n\n\n## Python 历史\n\n\
  Python 编程语言由 Guido Van Rossum 在 1989 年于荷兰研究机构 `CWI` 执行一个项目时发现的，但后来被中断了。Guido 成功地使用了多种基础语言（即所谓的\
  \ `ABC` 语言）来开发 `Python`。根据 Van Rossum 的说法，`python` 语言的优势在于，你可以保持它的简单，也可以将其扩展到更多平台以同时支持许多平台。这种设计使得系统能够与库和各种文件格式轻松通信。\n\
  \n自引入以来，现在世界上有许多程序员在使用 `Python`，事实上，它还包含了许多提高操作和效率的工具。许多程序员采取了各种措施，向大家普及如何使用 `python`\
  \ 编程语言以及它如何帮助减轻对复杂计算机代码的恐惧。然而，Van Rossum 在几年前将 `Python` 开为开源，允许所有程序员访问甚至对其进行修改。这在编程领域引起了巨大的变化。\n\
  \n例如，曾发布过 `Python 2.0`。`Python 2.0` 以社区为导向，使其开发过程变得透明。虽然许多人不再使用 `Python`，但仍有一些程序员和组织在使用部分版本。`Python\
  \ 3` 是一个独特的版本，于 2008 年发布。尽管该版本有很多不同的功能，但它与前两个版本完全不同，程序并不容易更新。虽然这个版本不向后兼容，但它有一个小小的创作者团队来说明在上传文件时需要更改哪些内容。\n\
  \n## 为什么你应该使用 Python\n\n世界上有许多类型的计算机编码程序，每种都有其优缺点。然而，由于许多原因（例如可读性），`Python` 被证明是最佳选择，可以在许多平台上使用而无需更改内容。使用\
  \ `Python` 具有以下优势：\n\n- **可读性**：由于它是用英语设计的，初学者会发现它易于阅读和使用。还有许多规则帮助程序员理解如何格式化一切，这使得程序员能够创建简单的代码，以便其他人在使用其项目时可以遵循。\n\
  - **社区**：如今全球范围内有很多 `Python` 研讨会。初学者可以访问在线、线下或两者来学习更多知识，甚至寻求对 `Python` 的解答。此外，在线和线下研讨会可以提高你对\
  \ `Python` 的理解以及你的社交技巧。它最适合个人电脑，因为它在许多不同的平台上都能成功运行。事实上，所有初学者都能轻松编写代码或从专家那里学习。\n\
  - **库**：25 多年来，程序员一直在使用 `Python` 教初学者如何使用用它编写的不同代码。该系统对程序员非常开放，他们可以无限地使用可用代码。事实上，学生可以下载并安装该系统并供个人使用，例如编写代码和完成产品。\n\
  \n## Python 中的通用术语\n\n理解 `Python` 中使用的标准术语对你至关重要。这让你在开始时变得变得容易。以下是 `Python` 编程语言中最常见的术语：\n\
  \n- **函数 (Function)**：指程序员在使用调用程序时调用的代码块。其目标也是提供免费服务和准确的计算。\n- **类 (Class)**：用于开发用户定义对象的模板。它对包括初学者在内的所有人都友好且易于使用。\n\
  - **不可变 (Immutable)**：指代码中具有固定值的对象。这些可以是数字、字符串或元组。此类对象不能被更改。\n- **文档字符串 (Docstring)**：指显示在函数、类定义和模块中的字符串。此对象在文档工具中始终可用。\n\
  - **列表 (List)**：指 `Python` 内置的数据类型，包含排序后的值。这些值包括字符串和数字。\n- **IDLE**：代表集成开发环境，允许用户在同一个窗口中解释和编辑代码的同时输入代码。最适合初学者，因为它是代码的极佳示例。\n\
  - **交互式 (Interactive)**：由于其交互性质，`Python` 已成为最适合初学者的编程语言。作为初学者，你可以在 `IDLE` 解释器中尝试许多事物，查看它们的响应和效果。\n\
  - **三引号字符串 (Triple Quoted String)**：该字符串帮助个人在字符串中使用单引号和双引号，使其易于处理不同的代码行。\n- **对象\
  \ (Object)**：指处于状态中的所有数据，如属性、方法、定义的行为或值。\n- **类型 (Type)**：指编程语言中的一组数据类别，以及属性、函数和方法上的差异。\n\
  - **元组 (Tuple)**：指 `Python` 内置的数据类型，是一个不可更改的值集合，尽管它包含一些可以更改的值。\n\n\n\n\n\n## Python\
  \ 语言的优势\n\n使用 `Python` 程序相比 `C++` 和 `Java` 等其他语言具有许多优势。你会为 `Python` 程序的可用性以及学习和使用的简易性而感到非常高兴。理想情况下，这些是你现在可以使用的最佳编程语言，特别是如果你是初学者的话。以下是使用\
  \ `Python` 语言的一些优势：\n\n### 它易于使用、编写和阅读\n许多程序员在使用 `Java` 和 `C++` 等编程语言时面临着挑战。由于其设计原因，这些语言很难查看。人们必须花费大量时间学习括号的使用，而且并不容易识别这些编程语言中使用的单词。这些单词可能会吓到你，尤其是当你刚开始接触编程语言时。与\
  \ `Java` 和 `C++` 语言不同，`Python` 不使用疯狂的括号。它只使用缩进，使得页面易于阅读。它使用英语，使得字符很容易理解。除了使用缩进，`Python`\
  \ 还使用了大量的空格，便于学习和阅读所需内容。它包含许多带有注释的地方，以便在程序困惑你时理解或获得澄清。所以，尝试一下吧，你会发现使用 `Python` 编程语言是多么简单。\n\
  \n### 它使用英语作为主要语言\n使用 `Python` 很容易，因为主要语言是英语。作为初学者，你花费更少的时间来阅读和理解 `Python` 编程时使用的基础单词。所以，无论你的英语母语还是非母语，`Python`\
  \ 都最适合你，因为大多数单词都简单易懂。\n\n### Python 已经并在某些计算机上可用\n某些计算机（如 `macOS` 系统和 `Ubuntu`）预装了\
  \ `Python`。在这种情况下，你只需要下载文本解释器即可开始 `Python` 编程。然而，如果你使用的是 `Windows` 计算机，你必须在电脑上下载该程序。事实上，即使你从一开始没有安装它，`Python`\
  \ 也能运行良好。\n\n### Python 与其他编程语言完美结合\n第一次，你将单独使用 `Python`。但是，随着你继续编程，你会发现 `Python`\
  \ 可以与其他语言一起工作。你可以与 `Python` 的一些编程语言包括 `C++` 和 `JavaScript`。尝试了解更多关于 `Python` 以及它实际上能做什么。随着时间的推移，你将发现许多事情。\n\
  \n### Python 可用于测试许多事物\n一旦你下载了 `Python`，你就需要下载测试解释器。测试解释器在允许 `Python` 读取信息方面起着重要作用。使用像\
  \ `Windows` 中提供的 `Notepad` 或其他解释器的简单产品是好的。\n\n## 使用 Python 编程的缺点\n\n虽然使用 `Python`\
  \ 有许多优势，但识别使用它的某些负面影响也是关重要的。由于 `Python` 的以下负面影响，某些个人倾向于使用其他编程语言如 `C++` 和 `JavaScript`\
  \ 来替代 `Python`：\n\n### Python 速度慢\n虽然 `Python` 与与其他语言配合良好且适合初学者，但遗憾的是，`Python` 对于寻找高速程序的程序员来说并不是理想的，因为与其他选项相比，它是一种较慢的翻译语言。速度水平取决于你翻译的内容，因为某些带有\
  \ `Python` 代码的基准测试比其他代码运行得更快。目前，全球许多程序员正试图通过加快解释速度来解决这个问题。人们希望 `Python` 很快就能以与 `C`\
  \ 和 `C++` 相同的速率甚至更快的速度运行。\n\n### Python 在大多数移动浏览器中不可用\n虽然 `Python` 对于拥有常规计算机的人来说运行良好，并且可以在许多服务器平台和桌面上访问，以帮助个人创建他们寻找的代码，但它尚未准备好用于移动计算。程序员们正试图将程序迁移到移动计算，以满足今天使用手机手机的大量人群。\n\
  \n### 设计有限\n对于寻找具有许多设计选项程序的程序员来说，`Python` 程序不是一个更好的选择。例如，设计语言在某些其他选项中不可用；因此，你需要更多时间进行测试，而且有时在运行程序时会发生很多错误。\n\
  \n# 第 1 章：Python 基础\n\n一旦你在系统上安装了软件，就是时候开始你的 `Python` 编程之旅了。我将从基础知识开始，例如变量、字符串和关键字。现在，你将学习并编写你的第一个\
  \ `Python` 程序，学习你可以处理的各种数据，以及如何使用变量和关键字。让我们从基础开始，让你的编码立即开始吧。\n\n## 关键字\n\n| async\
  \ | assert | as | and |\n| :--- | :--- | :--- | :--- |\n| def | from | nonlocal\
  \ | while |\n| continue | for | lambda | try |\n| elif | if | or | yield |\n| else\
  \ | import | pass | |\n| global | not | with | del |\n| in | raise | false | await\
  \ |\n| return | none | break | except |\n| true | class | finally | Is |\n\n让我们从基础的“Hello”程序开始，这是任何程序员的第一步。\n\
  \n```python\nprint(\"Hello, Welcome to Python Programming!\")\n```\n\n当运行此程序代码时，你的输出将是：\n\
  \n```\nHello, Welcome to Python Programming!\n```\n\n`Python` 程序总是以 `.py` 扩展结尾。让我们将此程序保存为\
  \ `Hello.py`。请始终记住使用其名称保存每个示例，以便在需要时回想起它们。\n\n\n\n\n\n## 多行语句\n\n这些语句通常以换行结束。然而，它允许你使用特殊字符（`\\\
  `）来延续语句。请查看下面的代码：\n\n```python\nTotal_Number = number1 + \\number2 + \\number3\n\
  ```\n\n尽管如此，如果语句包含括号（如 `()`、`{}` 或 `[]`），则存在例外情况。例如：\n\n```python\nmonths = [‘December,’\
  \ ‘November,’ ‘October,’ ‘September,’ ‘August,’‘July,’ ‘June,’ ‘May,’ ‘April,’ ‘March,’\
  \ ‘February,’ ‘January’]\n```\n\n## 变量\n\n变量是一个存储位置，并有一个名称。在 Python 中，我们可以为变量赋值并调用这些变量。我相信一个示例会让事情变得更清晰。记得我们的第一个程序（`hello.py`），让我们增加两行。考虑下面的程序：\n\
  \n```python\noutcome= “Hello, Welcome to Python Programming!”\nprint(outcome)\n\
  ```\n\n当你运行程序时，输出将与之前相同，即：\n\n```\nHello, Welcome to Python Programming!\n```\n\n\
  唯一的区别是我们添加了一个名为 `outcome` 的变量。每个变量都有被赋值的值。在这种情况下，`outcome` 的值是“Hello Welcome to\
  \ Python Programming!”。让我们在之前的代码基础上增加两行。然而，确保在添加新代码之前，在第一个代码中插入一个空行。\n\n```python\n\
  outcome= “Hello, Welcome to Python Programming!”\nprint(outcome)\n\noutcome = “Hello,\
  \ Welcome to Learning Python!”\nprint(outcome)\n```\n\n添加这两行后，保存文件并再次运行程序。你的输出如下：\n\
  \n```\nHello, Welcome to Python Programming!\nHello, Welcome to Learning Python!\n\
  ```\n\n## 变量命名规则\n\n在 Python 中命名变量时，需要遵循重要的规则。如果你违反了任何这些规则，将收到错误消息。因此，在编写程序时请务必记住它们。\n\
  \n*   变量名只能包含数字、下划线和字母。你可以用下划线或字母开头变量名；但不能以数字开头。例如，你的变量名可以是 `outcome_1`，但使用 `1_outcome`\
  \ 是完全错误的。\n*   变量名之间不能包含空格。尽管如此，你可以使用下划线分隔两个单词。例如，`outcome_program` 可以正常；但 `outcome\
  \ program` 会导致程序报错。\n*   避免使用函数名和关键字作为变量名。\n*   使用的变量名必须简短且具有描述性。例如，使用 `score` 优于\
  \ `s`，`serial_name` 优于 `sn`。\n\n## 避免变量名错误\n\n作为一个新手，你会犯错。专业人士也无法例外，但他们知道如何高效地处理这些错误。让我们看看在你开始\
  \ Python 编程课程时可能犯的错误。我将故意通过拼错“outcome”一词来写错误代码。\n\n```python\noutcome = “Hello,\
  \ Welcome to Learning Python!”\n#program 将产生错误\nprint(outcom)\n```\n\n当发生此类错误时，Python\
  \ 解释器会找出解决问题的最佳方法。一旦程序无法成功运行，它会提供一个回溯（traceback）。并不是许多编程语言都有回溯错误的功能。让我们看看解释器如何响应我们上面的程序\n\
  \n```\nTrackback (most recent call last): \n1. File “hello.py,” line 3, in <module>\n\
  2. Print(outcom)\n3. NameError: name ‘outcome’ is not defined\n```\n\n第 1 行报告了 `hello.py`\
  \ 文件中第 3 行存在错误，但解释器迅速识别了错误并告诉我们第 3 行是什么特定类型的错误。在这种情况下，它表示这是一个命名错误（name error）。此外，它会报告我们的变量没有被正确定义。每当你看到命名错误时，意味着存在拼写错误，或者我们没有给变量赋值。但在本例中，这是一个拼写错误，我们没有包含变量名中的字母“e”。\n\
  \n```python\noutcom= “Hello, Welcome to Python Programming!”\nprint(outcome)\n\n\
  outcom = “Hello, Welcome to Learning Python!”\nprint(outcome)\n```\n\n程序的输出将是：\n\
  \n```\nHello, Welcome to Python Programming!\nHello, Welcome to Learning Python!\n\
  ```\n\n## 尝试练习\n\n编写一个意图执行以下操作的程序。确保保存文件并遵循变量命名规则。\n\n*   编写一个程序，为你选择的变量名赋值消息并打印该消息。\n\
  *   在第二个程序中，更改值并使用新消息。然后打印该消息。\n*   从下列表中勾选错误的变量名：\n    *   `1_school`\n    *  \
  \ `Fred Love`\n    *   `Fred_love`\n    *   `_exercises`\n    *   `Firsttwoletters`\n\
  \n## Python 中的数据类型\n\n编写代码时，我们需要将数据存储在内存中。这些数据不能存储在内存内存，因为数字与字母不同。例如，人的名字是字母；地址可以是字母数字，而年龄可以存储为数值。Python\
  \ 有不同的数据类型来定义存储这些数据的各种操作和方法。Python 有五种数据类型；这些是：\n\n*   字符串 (String)\n*   数字 (Numbers)\n\
  *   元组 (Tuple)\n*   列表 (List)\n*   字典 (Dictionary)\n\n### 字符串\n\n这是一系列包含引号内的字符。在\
  \ Python 中，引号内的任何内容都被视为唯一的字符。单引号和双引号都可以组成字符串。\n\n```python\n‘Hello World’\n\"Hello\
  \ World\"\n```\n\n如果我们运行这两个语句，将产生相同的输出。\n\n### 字符串内部的引号\n\n在 Python 编程中，使用字符串时，起始字符串的引号必须与结束引号匹配。当你使用双引号开始字符串时，Python\
  \ 会将下一个双引号视为字符串的结束。这同样适用于单引号。如果你决定在字符串内部使用双引号，你必须将它们放在单引号内。下面的示例将更好地展示这一点。\n\n```python\n\
  statement = ‘Fred is “a boy that lives in New York”’\n```\n\n假设你想在字符串中同时使用单引号和双引号。在这种情况下，你必须使用反斜线（`\\\
  `）来转义单引号和双引号。下面的示例将演示这一点。\n\n```python\nstatement_in_single = ‘Fred “own’s a wonderful\
  \ car in his garage”’\nstatement_in_double = “Fred \\own’s a wonderful car in his\
  \ garage’”\n\n### 使用方法更改字符串的大小\n\n使用字符串时你可以的一个简单任务是更改特定单词的大小。你认为下面代码的输出会是什么？\n\n\
  ```python\nfull_name = “johnson boris”\nprint(full_name.title())\n```\n\n一旦你写了代码，将其保存为\
  \ `name.py` 然后运行。输出如下：\n\n```\nJohnson Boris\n```\n\n如果你观察一下，变量 `full_name` 指向小写的字符串“johnson\
  \ boris”。在变量名之后是方法 `title`。在 Python 中，方法是对可以在数据上进行某些操作的操作。此外，变量名后的点（`.`）告诉解释器允许\
  \ `title()` 方法与我们的变量名交互。括号始终跟在方法后面，因为它们执行功能需要额外信息。`title()` 方法的功能是将每个单词的首字母改为大写字母。此外，Python\
  \ 允许我们将字符串转换为全小写或全大写。\n\n```python\nfull_name = “Johnson Boris”\nprint(full_name.lower())\n\
  print (full_name.upper())\n```\n\n输出如下：\n\n```\njohnson boris\nJOHNSON BORIS\n```\n\
  \n\n\n\n\n### 在字符串中使用变量\n\n在某些场景下，你可能决定在字符串中使用包含特定值的变量。例如，你可能想使用两个变量来分别存储一个人的姓和名。此外，这两个变量必须组合以生成该个人的全名。让我们考虑在\
  \ Python 中如何实现这一点。\n\n| `first_name = “johnson\"` | `last_name = “boris\"` |\n|\
  \ --- | --- |\n| `full_name = f \"{first_name} {last_name}\"` | `print(full_name)`\
  \ |\n\n如果你想将变量值插入字符串中，必须直接在起始引号之前添加字母 `f`。请考虑以下代码：\n\n```python\nstate = 'United\
  \ Nation!'  #Assign the variable “state” to a string ‘United Nation!’\nprint state\
  \             # Prints the complete string\nprint state[0]           # Prints the\
  \ first character of the string\nprint state[0:4]         # Prints characters starting\
  \ from 1st to 4th\nprint state[3:]          # Prints string starting from 4th character\n\
  print state * 3          # Prints string three times\nprint state + \" United State\"\
  \ # Prints concatenated string\n```\n\n输出将是 –\n\n| United Nation! | U | United Nations!\
  \ | United Nation! United Nation! | United State |\n\n## 第二章\n\n\n\n\n\n## 条件语句\n\
  \n现在，是时候进入条件语句的主题了，它们也被称为决策控制语句。这些语句允许计算机根据用户的输入以及你希望程序发生的情况来做出某些决策。在你的程序中，你会有很多时候希望计算机在你不场的情况下自动做出决策并完成任务。如果你正在编写的代码中，你希望用户输入自己的答案，而不是给他们提供两个选项进行选择，那么这些决策控制语句将是一个非常好的选择。\n\
  \n在编写这些条件语句时，你有几种不同的选项可以使用。最常用的三个包括 `if` 语句、`if-else` 语句和 `elif` 语句。作为初学者，我们将从 `if`\
  \ 语句的基础开始，以便良好地了解它们是如何工作的，然后我们将逐步学习如何使用这些条件语句来完成一些更复杂的操作。\n\n## If 语句\n\n我们将查看第一个选项是\
  \ `if` 语句。`if` 语句基于逻辑概念工作，用户给计算机的答案要么为真（true），要么为假（false）。如果用户输入的信息根据你的代码被视为真，那么解释器就可以继续执行程序，并显示你想要的语句或信息。但是，如果用户在程序中输入了与你的代码不匹配且被视为假的内容，那么程序将自动结束。\n\
  \n好消息是，我们稍后可以讨论一下可以采取哪些步骤来确保无论用户给出什么答案，程序都能做出响应，但这并不是 `if` 语句的重点。我们现在需要查看这种简化的形式，然后在此基础上进行构建。为了帮助我们观察\
  \ `if` 语句在用户与其交互时的样子，你需要处理以下代码：\n\n```python\nage = int(input(\"Enter your age:\"\
  ))\nif (age <=18):\n    print(\"You are not eligible for voting, try next election!\"\
  )\nprint(\"Program ends\")\n```\n\n一旦你将这个条件语句添加到编译器中，我们需要探索一下上述代码会发生什么。如果用户运行到程序的这部分并说他们未满\
  \ 18 岁，那么屏幕上就会出现消息。在这种情况下，我们写下的显示信息是：“You are not eligible for voting, try next\
  \ election!”。然后，由于我们现在这里没有其他代码部分，程序将结束。但这引出了一个问题：如果用户说他们超过了 18 岁，这段特定的代码会发生什么？当计算机程序员使用\
  \ `if` 语句时，如果用户输入的年龄大于 18 ，那么什么都不会发生。`if` 语句是你只希望用户选出你的代码认为为真的唯一答案时所使用的选项。在这种情况下，用户必须说他们小于\
  \ 18 岁，否则程序就会结束。\n\n正如你想象的，这会给我们带来一些问题。你可能希望允许用户输入任何适合他们的年龄。运行这个程序的用户中会有人大于 18 岁，你不希望程序因为他们超过了该年龄范围而在没有任何输出的情况下就结束。这会在你不希望的时候结束程序，而且对于你正在编写的程序来说，看起来并不专业。这就是为什么你不会经常看到\
  \ `if` 语句的重要原因。\n\n## If-Else 语句\n\n但这就是我们将引入 `if-else` 语句并用它们来解决这个问题的地方。这些语句利用我们经历过的概念和提出的问题，并帮助我们处理它们。假设你正在处理之前的代码，并希望确保无论用户决定输入什么答案，程序都能给出结果。你可以写一个\
  \ `if-else` 语句，这样就可以为 18 岁以下的人提供一个答案，为 18 岁及以上的人提供另一个答案。这段代码扩展了我们之前讨论的选项，这里有一个你可以直接使用的示例：\n\
  \n```python\nage = int(input(\"Enter your age:\"))\nif (age <=18):\n    print(\"\
  You are not eligible for voting, try next election!\")\nelse:\n    print(\"Congratulations!\
  \ You are eligible to vote. Check out your local polling station to find out more\
  \ information!\")\nprint(\"Program ends\")\n```\n\n这段代码对你的尝试以及你希望代码中发生的情况有用得多，并且为你提供了比以前更多的选项。最棒的一点是，你的代码不会因为用户输入年龄而结束。它会根据用户输入的年龄在屏幕上提供一条语句。\n\
  \n如果你愿意，这段代码还可以扩展以包含更多可能性。上面的示例只有两个选项：18 岁以下和 18 岁以上。但如果对你的程序有帮助，你可以拥有更多选项。例如，如果你愿意，可以更细地划分年龄段。\n\
  \n\n\n\n\n## 数据结构\n\nPython 基于三种引用结构：元组（tuples）、列表（lists）和字典（dictionaries）。这些结构实际上是可以包含其他对象的实例。它们具有非常不同的用途，并允许你存储所有类型的信息。这些结构具有许多共同特征：\n\
  \n- 为了从结构中提取一个或多个对象，我们始终使用 `[]`。\n- 对于数值索引结构（元组和列表），这些结构从 0 开始索引（第一个位置是位置 0）。\n\n\
  ## 元组 (The Tuples)\n\n这是一种按索引顺序分组多个对象的结构。它一旦创建，其形式就不可修改（不可变的），并使用括号定义。它只有一个维度。任何类型的对象都可以存储在元组中。例如，如果你想创建一个包含不同对象的元组，我们使用：\n\
  \n```python\ntup1 = (1, True, 7.5, 9)\n```\n\n你也可以使用 `tuple()` 函数创建元组。访问元组的值通过结构的经典索引来完成。因此，如果我们想访问元组的第三个元素，我们使用：\n\
  \n```python\ntup1 [2]\n# 输出: 7.5\n```\n\n元组可能很有趣，因为它们占用的内存很少。另一方面，它们被用作返回多个值的函数的输出。作为结构的元组是对象。它们拥有简洁的方法。对于元组来说方法很少：\n\
  \n```python\ntup1.count (9)\n# 输出: 1\n```\n\n### 列表 (Lists)\n\n列表是 Python 中的引用结构。它是可修改的，可以包含任何对象。\n\
  \n### 创建列表\n\n我们使用方括号创建列表：\n\n```python\nlist1 = [3, 5, 6, True]\n```\n\n你也可以使用\
  \ `list()` 函数。列表的结构是可编辑。它有许多方法：\n\n- `.append()`：在列表末尾添加值。\n- `.insert(i, val)`：在索引\
  \ `i` 处插入值。\n- `.pop(i)`：检索索引 `i` 的值。\n- `.reverse()`：反转列表。\n- `.extend()`：用值列表扩展列表。\n\
  \n**注意**：所有这些方法都会修改列表，在经典代码方面等同于以下操作：\n`list1.extend(list2)` 等同于 `list1 = list1\
  \ + list2`。\n\n列表还有其他方法，包括：\n\n- `.index(val)`：返回值 `val` 的索引。\n- `.count(val)`：返回\
  \ `val` 出现的次数。\n- `.remove(val)`：从列表中删除值 `val` 的第一次出现项。\n\n### 从列表中提取项目\n\n正如我们在上面看到的，可以使用括号提取元素：\n\
  \n```python\nlist1 [0]\n```\n\n我们通常对提取多个元素感兴趣。这是通过使用两个冒号实现的：\n\n```python\nlist1\
  \ [0: 2] or list1[:2]\n```\n\n在这个示例中，我们看到该系统提取了两个元素：索引为 0 的元素和位置为 1 的元素。因此，我们的规则是\
  \ `i: j` 从包含 `i` 的元素到不包含 `j` 的元素。这里是其他一些示例：\n\n- 提取最后一个元素：`list1 [-1]`\n- 提取最后 3\
  \ 个元素：`list1 [-3: -1]` 或 `list1 [-3:]`\n\n### 具体示例\n\n假设我们想创建一个国家列表。这些国家根据人口在列表中排序。我们将尝试提取前三个和后三个。\n\
  \n```python\ncountry_list = [\"China\", \"India\", \"United States\", \"France\"\
  , \"Spain\", \"Swiss\"]\nprint(country_list [:3])\n# 输出: ['China', 'India', 'United\
  \ States']\n\nprint(country_list [-3:])\n# 输出: ['France', 'Spain', 'Switzerland']\n\
  \ncountry_list.reverse()\nprint(country_list)\n# 输出: ['Switzerland', 'Spain', 'France',\
  \ 'United States', 'India', 'China']\n```\n\n### 列表推导式 (The Comprehension Lists)\n\
  \n这些是通过迭代构建的列表。它们通常非常有用，因为它们比使用循环构建列表更高效。这里有一个简单的示例：\n\n```python\nlist_init = [4,\
  \ 6, 7, 8]\nlist_comp = [val ** 2 for val in list_init if val % 2 == 0]\n```\n\n\
  `list_comp` 允许你存储 `list_init` 中偶数元素的平方。我们将得到：\n\n```python\nprint(list_comp)\n#\
  \ 输出: [16, 36, 64]\n```\n\n这种列表推导式的概念非常有效。它避免了无用的代码（列表上的循环），并且性能比迭代创建列表更好。它也存在于字典中，但不存在不可变的元组。我们能够在处理数据表的框架内使用列表推导式。\n\
  \n## 字符串 (Strings)\n\n### 字符列表\n\nPython 中的字符串默认（从 Python 3 开始）用 Unicode 编码。你有三种方式声明字符字符串：\n\
  \n```python\nstring1 = \"Python for the data scientist\"\nstring2 = 'Python for\
  \ the data scientist'\nstring3 = \"\"\"Python for the data scientist\"\"\"\n```\n\
  \n最后一种允许多行字符串。我们最经常使用第一种。字符串实际上是字符列表，我们可以像处理列表元素一样处理字符串元素：\n\n```python\nprint(string1\
  \ [:6])\nprint(string1 [-1])\n# 输出: t\nprint(string1[0:10])\n# 输出: Python for\n\
  ```\n\n字符串可以轻松转换为列表：\n\n```python\n### 使用空格分割\nlist1 = string1.split()\nprint(list1)\n\
  # 输出: ['Python', 'for', 'the', 'data', 'scientist']\n\n### 并字符串\nstring1 = \"\"\
  .join(list1)\nprint(string1)\n# 输出: Python for the data scientist\n```\n\n## 字典\
  \ (Dictionaries)\n\n字典是键值对的结构。它们允许你通过键来访问值。\n\n```python\ndict1 = {\"key1\": value1,\
  \ \"key2\": value2, \"key3\": value3}\n```\n\n你可以打印字典：\n\n```python\nprint(dict1)\n\
  ```\n\n访问值：`dict1[\"key1\"]`。\n显示所有键：`dict1.keys()`。\n显示所有值：`dict1.values()`。\n\
  显示所有项目（键值对）：`dict1.items()`。\n添加或更新元素：`dict1[\"key4\"] = value4`。\n删除元素：`del dict1[\"\
  key4\"]`。\n\n## 条件 (Conditions)\n\n条件用于控制执行流。在 Python 中，我们使用 `if`、`elif` 和 `else`。\n\
  \n```python\nif condition:\n    # 代码\nelif_condition:\n    # 代码\nelse:\n    # 代码\n\
  ```\n\n## 循环 (Loops)\n\n循环是大多数编程语言的核心元素。Python 并没有打破这一规则。然而，对于像 Python 这样的解释型语言，你必须非常小心。事实上，Python\
  \ 处理循环很慢，我们会少用它。我们避免创建重复的循环。\n\n### for 循环\n\nPython 循环有一种特定的格式；它是对结构元素的循环。我们将写：\n\
  \n```python\nfor elem in [1, 2]:\n    print(elem)\n```\n\n循环的迭代器（在我们例中为 `elem`）因此获取结构元素的值。\n\
  \n### Range, zip 和 enumerate 函数\n\n这三个函数非常有用，它们允许你创建在代码中可能很有用的对象。`range()` 函数用于生成数字序列，从给定的数字或默认的\
  \ 0 开始，到不包含的数字结束：\n\n```python\nprint(list(range(5)))\n# 输出: [0, 1, 2, 3, 4]\nprint(list(range(2,5)))\n\
  # 输出: [2, 3, 4]\nprint(list(range(2,15,2)))\n# 输出: [2, 4, 6, 8, 10, 12, 14]\n```\n\
  \n我们在这里看到创建的 range 对象可以通过 `list()` 轻松转换为列表。在循环中，这给了：\n\n```python\nfor i in range(11):\n\
  \    print(i)\n```\n\n`zip()` 和 `enumerate()` 函数在循环中也很有用，它们使用列表。`enumerate()` 函数返回列表的索引和元素。\n\
  \n```python\nfor i, a in enumerate(country_list):\n    print(i, a)\n```\n\n\n\n\n\
  \n1. 瑞士\n2. 西班牙\n3. 法国\n4. 美国\n5. 印度\n6. 中国\n\n## Zip Function\n\n`zip` 函数允许链接多个列表并同时迭代这些列表中的元素。例如，如果我们想同时增加天数和天气，可以使用：\n\
  \n```python\nfor day, weather in zip([\"Monday\", \"Tuesday\"], [\"beautiful\",\
  \ \"bad\"]):\n    print(\"% s, it will make% s\" % (day.capitalize (), weather))\n\
  ```\n输出：\nMonday, it will be nice beautiful\nTuesday, it will be nice bad\n\n在这段代码中，我们使用\
  \ `zip()` 在每次迭代中获取一对值。后半部分是对字符串的处理。如果其中一个列表比另一个列表长，循环将在到达其中一个列表的末尾时立即停止。\n\n我们可以在同一段代码中结合使用\
  \ `enumerate` 和 `zip`，例如：\n\n```python\nfor i, (day, weather) in enumerate(zip([\"\
  Monday\", \"Tuesday\"], [\"good\", \"bad\"])):\n    print(\"% i:% s, it will make%\
  \ s\" % (i, day.capitalize (), weather))\n```\n输出：\n0: Monday, it will be nice good\n\
  1: Tuesday, it will be nice bad\n\n我们在这里看到 `i` 是元素的位置。\n\n注意 – 字符串中的替换。\n\n## While\
  \ Loop\n\nPython 同时也允许你使用 `while()` 循环，这种循环较少使用，看起来与我们在其他语言中常见的 `while` 循环非常相似。要退出此循环，我们可以使用带有条件的语句。警告：我们必须在循环中增加索引，否则会有无限循环的风险。\n\
  \n我们可以写：\n\n```python\ni = 1\nwhile i < 100:\n    i += 1\n    if i > val_stop:\n\
  \        break\nprint (i)\n```\n这段代码在每次循环中将 `i` 加 1，并在 `i` 达到 `val_stop`（即 100）时停止。\n\
  \n注意 – Python 中的增量可以有多种形式，`i = i + 1` 或 `i += 1`。两种方法在性能上是等价的；关键在于选择最适合自己的方法。\n\n\
  # 第 4 章\n\n\n\n\n\n## 处理 Python 中的局部变量与全局变量\n\n现在，我们需要查看一下在 Python 中处理变量时，你可以使用的几种不同类型的变量。我们在这个语言中将处理的两种主要变量包括**局部变量**和**全局变量**。当我们讨论这些变量时，它们之间存在一些差异。\n\
  \n## 全局变量\n\n首先是全局变量。这主要意味着我们查看的是程序的其他部分或程序的任何部分都可以声明的变量。无论该程序的某部分位于何处，它在需要的时候都可以使用并依赖于该全局变量。有时这是一件好事，它允许你的模块声明它们需要的变量，即使它们并不相邻。但（处（此处）在其他情况下，这会导致一些问题。如果代码的错误部分尝试声明它不应该声明的变量，可能会导致代码的运行不符合你的预期，并且某些变量会在错误的时间被声明。这永远不是一件好事，如果你想避免这个问题，将需要承担一些风险。\n\
  \n解决这个问题的方案是局部变量。这些变量是无法在整个代码中访问的变量。这些变量只会在你预先定义的特定方法或函数中声明。这将确保变量只以你想要的方式被使用，而在其他地方都不被使用。\n\
  \n### 局部变量\n\n我们将花时间查看第一个选项是局部变量。这与我们在其他语言中看到的局部变量类似，它是在变量当时所属的块的开始处声明的。根据你的需要，它也可以出现在我们处理语句、switch\
  \ 语句以及更多内容中。\n\n局部变量会随带有一个声明，该声明可以显式地定义已声明变量的类型，并带有同时命名该变量的标识符。我们将局部变量识别为一种变量，其作用范围和程度位于声明它的方法或语句块中。\n\
  \n我们能够使用这些局部变量，它们更像 `foreach` 语句中的迭代变量、特定 `catch` 子句中的异常变量，以及执行 `using` 语句时的资源变量。它也可以被用作常量类型，其值在声明它的方法或语句块内不能被修改。\n\
  \n当局部变量是隐式类型且其类型由计算机从其右侧的表达式推断出来时，这种局部变量在你想要处理语言集成查询（LINQ）时将非常有用。这些类型的查询将为我们返回一些匿名类型，从而为你的每组结果创建一个自定义类型。\n\
  \n你会在这种变量中找到内存分配通常取决于你正在处理的变量类型。如果你处理的是像整数或结构体的内容，那么全部内容将存储在栈（stack）中。但如果你使用的是引用类型的变量，它将被放置在栈的引用部分，而内容将随之位于堆（heap）中。\n\
  \n局部变量在代码的任何位于其声明语句之前的文本位置都不能被引用。此外，我们必须记住，当我们在单个块中时，绝不能有多个同名的变量。这样做是一件坏事，因为会导致错误的出现，并且基本上只会混淆你正在编写的代码。然而，可以在一个语句中声明多个相同类型的局部变量，并对其进行初始化。\n\
  \n在类的方法中，如果你发现一个局部变量，并且它的命名方式与其字段（field）相似，你会发现局部变量将隐藏该字段，但仍然可以在方法内访问它。对我们来说，使用局部变量而不是字段通常更有效率。\n\
  \n## 查看全局变量\n\n我们在这里需要查看的另一件事是关于全局变量。这是一种我们在任何函数之外声明的变量类型，这意味着你编写的程序中找到的所有函数都可以轻松访问。这些变量的一组被称为全局环境或全局状态，因为当它们结合时，它们会在程序运行时定义程序或环境的各个方面。\n\
  \n全局变量是声明在所有函数上方的变量，通常最好是将其保持到最低。这是因为所有函数都可以在程序运行期间操纵这些变量。对于你想要在这个语言中处理的大多数程序来说，这是危险的，因为存在被意外更改的可能性，从而导致系统错误。\n\
  \n正如我们从名称推测的那样，全局变量是一些我们可以在全局（或程序任何地方）访问的变量。一旦我们完成了声明过程，这些变量在程序的整个运行期间一直留在内存中。这意味着我们可以在任何时间通过任何函数来更改它们，这无疑会给整个程序带来一些问题。\n\
  \n在计算机可以使用但内存有限的早期几年，这些全局变量被认为是一种坏习惯，因为它们会占用大量的信息，并且程序员更容易丢失他们所处理的值，特别是在长程序中。基本上，这为程序引入了许多难以定位和修复的错误。\n\
  \n当元素的作用范围受到限制时，源代码总是更容易使用和理解。当我们使用全局变量时，这一点是很难做到的，因为它们不是局部的，我们真的很难弄清楚这些变量在何时被更改的，甚至不知道更改的原因是什么。\n\
  \n尽管有这种负名，当我们在处理不共享被称为“调用者和被调用者”关系的函数时，这些全局变量将非常有价值的。这意味着函数将不会有信号处理器或任何形式的并发线程。除了在受保护内存中声明为只读值的全局变量外，代码需要确保它们能够部署一些适当的封装，以便在过程中被视为线程安全的。\n\
  \n## 总结\n\n这在刚开始可能看起来有些困惑，但好消息是，当需要处理这两个变量时，我们有很多可以做的事情。并且为了帮助我们通过下面使用的程序更好地理解全局变量和局部变量之间的差异：\n\
  \n\n\n\n\n# 第 5 章\n\n1. 变量 `f` 将具有全局作用域，并被赋值为值 101，该值将在输出中被打印。\n\n2. 变量 `f` 还将在函数内部声明并假设局部作用域。它将被赋值一个值，在这种情况下，它被赋值为\
  \ `\"I am learning Python.`。然后这个值将作为输出被打印。这个变量与我们在上一步中尝试定义的全局变量 `f` 不同。\n\n3. 一旦我们调用完函数，局部变量\
  \ `f` 就会被销毁。在第 12 行当我们再次遍历并打印 `f` 的值时，它将向我们显示全局变量 `f = 101`。\n\n我们可以使用 `global`\
  \ 关键字，这将确保我们能够在函数内部引用全局变量。通过这种方法，我们可以遵循的一些内容包括：\n\n1. 变量 `f` 将具有全局作用域，然后它被赋值为 101，并作为输出打印。\n\
  \n2. 当我们使用 `global` 关键字时，将声明同一个变量。这里将不再是局部变量，而是我们之前能够定义的同一个全局变量。这意味着当我们遍历并打印值时，得到的输出将是\
  \ 101。\n\n3. 然后我们在函数内部更改了 `f` 的值。一旦完成函数调用，变量 `f` 改变后的值将持久存在。在第 12 行当我们再次遍历并打印 `f`\
  \ 的值时，我们得到的值将是 `\"changing a global variable.`。\n\n在很多时候，你将可以使用想要处理的全局和局部变量的想法。了解它们各自如何工作，以及在需要时何时哪一个最重要，是处理它们时最重要的部分。\n\
  \n\n\n\n\n## Python 中的模块\n\n## 什么是模块？\n在 Python 中，模块（module）是程序的一个部分（一个扩展名文件），可以通过其他程序调用，而无需在每个使用的程序中重复编写它们。此外，它们还可以定义类和变量。这些模块之间包含了相关的语句，并且可以随时使用。模块的使用是基于使用已经存储在上面的代码（程序体、函数、变量），这被称为\
  \ `import`。通过模块的使用，可以观察到 Python 允许在很大程度上简化程序，因为它允许我们我们将复杂的问题简化为较小的问题，从而缩短代码，使程序员在编写代码时，在数百行代码中查寻找某些内容时不会迷失。\n\
  \n## 如何创建模块？\n在 Python 中创建一个模块并不困难，它非常简单。例如：如果你想创建一个打印城市的模块，我们可以在编辑器中编写代码并将其保存为\
  \ `mycity.py`。一旦完成，我们就知道这将是我们模块的名称（省略 `.py` 后缀），它将被赋值给全局变量 `__city__`。但除此之外，我们可以看到\
  \ `mycity.py` 文件非常简单，一点也不复杂，因为里面只有一个名为 `print_city` 的函数，它将有一个字符串作为参数，它的作用是打印 \"\
  Hello, welcome to,\"，这将与作为参数输入的字符串进行拼接。\n\n## 定位模块\n在导入模块时，解释器会自动搜索该模块的当前地址，如果该地址不可用，Python（或其解释器）将在\
  \ `PYTHONPATH` 环境变量上进行搜索，该变量无非是一个包含目录名的列表，其语法与环境变量本身相同。如果在任何特殊情况下，上述操作失败了，Python\
  \ 将查找一个默认的 UNIX 路径（在 Windows 上位于 `/user/local/lib/python`）。模块将在变量 `sys.path` 给出的目录列表中进行搜索。该变量包含了当前目录、`PYTHONPATH`\
  \ 目录以及安装时默认带的整个目录。\n\n## import 语句\n该语句用于导入模块。通过任何 Python 代码文件，其过程如下：Python 解释器在文件系统中搜索执行它时的当前目录。然后，解释器在它的配置中搜索其预定义的路径。当它遇到第一个匹配项（模块名称）时，解释器会自动从头到尾执行它。第一次导入模块时，Python\
  \ 将生成一个带有 `.pyc` 扩展名的文件。该扩展文件将在该模块后续的导入中使用。当解释器检测到该模块自上次生成以来已被修改时，它将生成一个新的模块。你必须将导入的文件保存在\
  \ Python 使用 `import` 语句的相同目录下，以便 Python 能够找到它。正如我们在示例中看到的，导入模块允许我们通过外部文件改进程序的功能。\n\
  \n现在，让我们看一些例子。第一个是一个计算器，我们将创建一个执行所有数学函数的模块，以及另一个运行计算器本身的程序。我们做的第一件事是创建 `calculator.py`\
  \ 模块，它负责执行所有必要的操作。其中包括加法、减法、除法和乘法，如你所见。我们包含了 `if`、`else` 和 `elif` 等条件语句的使用。我们还包含了异常的使用，以便当用户每次在计算器的除法数字输入错误值时，程序不会卡住。之后，我们将创建一个程序，该程序必须导入之前提到的模块，以便能够处理所有相关的数学函数。\n\
  \n但此时，你可能会认为唯一存在的模块是程序员创建的那些。答案是否定的，因为 Python 有内置集成的模块。通过它们，我们将再做两个程序：第一个是对我们刚刚做的那个改进，第二个将是一个闹钟，它会定期在屏幕上打印一个字符串。\n\
  \n### 示例\n创建一个名为 `dummymodule.py` 的 python 模块并在内部写入以下：\n```python\ndef testF():\n\
  \    print(\"this is a module, goodbuy\")\n```\n将模块保存在 python 安装目录下。在 shell 中：\n\
  ```python\nimport dummymodule\n```\n现在调用函数：\n```python\ndummymodule.testF()\n```\n\
  你使用了你的第一个模块。\n\n### 模块示例一\n第一要做的工作是创建模块，但乍一看，我们发现了一个惊喜，即导入了 `math`。这对我们意味着什么？嗯，意味着我们正在获取\
