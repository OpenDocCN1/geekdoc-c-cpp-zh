  *   将通常一起使用的程序文件放在一个包中。\n    *   因为你的程序很小，所以大多数程序将只有一个包。\n*   包命名规则：\n    *   让你的包名与其他任何人的包名都不同。Java\
  \ 程序员传统上使用他们的名字或业务名称作为包名的第一部分。\n    *   使用所有小写字母且不包含空格。\n    *   在包名的不同类别之间使用句号。例如，如果包名标识了是谁创建了包以及该包的用途，请在创建者和用途之间加上句号。own*在创建本书中所述\
