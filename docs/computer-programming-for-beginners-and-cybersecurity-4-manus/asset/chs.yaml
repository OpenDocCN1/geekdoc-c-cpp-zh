  - 对于 C++，有三种 `get`，两个 `getline`，其他的使用 `>>`；\n- `cin.get(char)` 和 `int = cin.get()`\
  \ 之间的区别：\n\n  1. `while(cin.get(c))`\n  2. `// 在读取循环中使用 cin.get(char)`\n  3. `cin.get()\
  \ != '\\n'`\n  4. `// 使用 cin.get() 返回的字符来测试某些内容。`\n  5. `cin.get() != EOF`\n\n第\
  \ 7 行：当用于 `EOF` 使用时，你必须使用 `int`，因为 `EOF` 可能无法用 `char` 类型表示。\n\n- 混淆的函数：`cin.get`\
  \ 和 `cin.getline` 几乎是一样的。\n\n`Cin.get(char* s, streamsize n, char delim);`\n`Cin.getline(char*\
  \ s, streamsize n, char delim);`\n`Istream& getline(istream& is, string& str);`\n\
  \n1. 对于每一行，如果你不知道最大长度，直接使用 `getline(cin, string)`。你不需要输入任何长度（如果你想避免内存分配，可以预留 `string`\
  \ 的长度）。\n2. `cin.get()` 不从输入流中丢弃 `delim`。然而，`cin.getline()` 会读取并丢弃换行符。（这对你来说很容易，因为行是由换行符定义的）。\n\
  3. 在 `cin.getline(char* s, int n)` 中，如果函数没有提取任何字符（换行符是一个字符），或者在向 `s` 写入 `(n-1)`\
  \ 个字符后仍未找到分隔符，则 `failbit` 标志会被设置。请注意，如果输入序列中紧接着那 `(n-1)` 个字符的字符恰好是分隔符，它也会被提取且不会设置\
  \ `failbit` 标志。\n4. 在 `In.cin.get(char* s, int n)` 中，只有当函数没有提取任何字符时，`failbit` 标志才会被设置。\n\
  5. `cin.get(char* s, n)` 比 `cin.getline()` 更灵活。因为当读取到数组满时，它不会设置 `failbit`。此时你可以使用\
  \ `gcount()` 或 `peek()` 查看下一个字符是否是新行。它比 `cin.getline();` 更具自定义性。\n\n## 输入模式\n\n\
  - 在外部测试流然后在条件/循环语句体内部对对其进行读/写是一个坏主意。这是因为读取操作可能会导致流变为错误状态（bad）。通常将读取作为测试的一部分更好。\n\
  \n```cpp\nwhile(!cin.fail()){  //这是糟糕的编程风格\n    cin>>i;  //这里可能会导致流失效()......//那么\
  \ i 就不是有效值\n}\n```\n\n- 如果你只是想输入，不想知道 `eof` 或处理 `failbit`。你可以使用以下方法：\n\n```cpp\n\
  while(scanf(\"%d\",&i) != 1)\nwhile((int c = getchar())!=EOF)\nwhile( fgets(line,\
  \ sizeof(line), fp) != NULL )//在 C 语言中，使用这些退出循环！\nwhile(cin>>input)\nwhile(cin.get(p,\
  \ 20) )\nwhile(getline(ifstream, string)) //在 C++ 语言中，使用 bool 运算符退出循环。//做一些有用的事情。//input\
  \ 是正确的。}\n```\n\n- 如果你想知道 `eof` 或处理错误。你可以使用下面的代码。当你按下回车时，读取将结束。当你输入字母时，它会忽略该字母，直到你输入数字。\n\
  \n```cpp\nwhile(true) //使用 break 退出循环；\n{\n    cin>>i//或 getline(ifstream, string);\n\
  \    If(cin.eof()){   //如果是 EOF\n        cout<<\"遭遇了 EOF ␣\"<<endl\n        //break;\n\
