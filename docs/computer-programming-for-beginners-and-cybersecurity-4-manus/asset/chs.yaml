  \ `math.ldtr(num1)` 获取下不完全 gamma。然后，如果 `op` 等于 25，我们使用 `math.ndctr(num1)` 获取上不完全\
  \ gamma。然后，如果 `op` 等于 26，我们使用 `math.frexp(num1)` 获取指数和尾数。然后，如果 `op` 等于 27，我们使用 `math.ldexp(num1,\
  \ num2)` 获取值。然后，如果 `op` 等于 28，我们使用 `math.copysign(num1, num2)` 获取符号值。然后，如果 `op`\
  \ 等于 29，我们使用 `math.hypot(num1, num2)` 获取斜边。然后，如果 `op` 等于 30，我们使用 `math.isclose(num1,\
  \ num2)` 检查是否为接近值。然后，如果 `op` 等于 31，我们使用 `math.fsum([num1, num2])` 获取和。然后，如果 `op`\
  \ 等于 32，我们使用 `math.isnan(num1)` 检查 NaN。然后，如果 `op` 等于 33，我们使用 `math.isinf(num1)`\
  \ 检查无穷大。然后，如果 `op` 等于 34，我们使用 `math.nextafter(num1, num2)` 获取下一个浮点数。然后，如果 `op` 等于\
  \ 35，我们使用 `math.modf(num1)` 获取分数和小整数部分。然后，如果 `op` 等于 36，我们使用 `math.remainder(num1,\
  \ num2)` 获取余数。然后，如果 `op` 等于 37，我们使用 `math.isysign(num1)` 检查符号。然后，如果 `op` 等于 38，我们使用\
  \ `math.prod([num1, num2])` 获取乘积。然后，如果 `op` 等于 39，我们使用 `math.gcd(num1, num2)` 获取最大公约数。然后，如果\
  \ `op` 等于 40，我们使用 `math.lcm(num1, num2)` 获取最小公倍数。然后，如果 `op` 等于 41，我们使用 `math.isint(num1)`\
  \ 检查整数值。然后，如果 `op` 等于 42，我们使用 `math.fabs(num1)` 获取绝对值。然后，如果 `op` 等于 43，我们使用 `math.trunc(num1)`\
  \ 获取截断整数部分。然后，如果 `op` 等于 44，我们使用 `math.ceil(num1)` 获取向上取整。然后，如果 `op` 等于 45，我们使用\
  \ `math.floor(num1)` 获取向下取整。然后，如果 `op` 等于 46，我们使用 `math.fysign(num1, num2)` 获取符号。然后，如果\
