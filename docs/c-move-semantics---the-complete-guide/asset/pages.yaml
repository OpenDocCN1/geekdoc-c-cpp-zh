    ```


    The problem is that inside the class, we do not deal correctly with the fact that
    the value might have been moved away, which can happen because the default generated
    move operations call the move operations of the shared pointer, which moves the
    ownership away from the original object. This means that the moved-from state
    of a SharedInt brings the member sp into the situation that it no longer owns
    an object, which is not handled properly in its member function asString().


    You might argue that calling asString() for an object with a moved-from state
    makes no sense because you are using an unspecified value, but at least the standard
    library guarantees for its types that moved-from types are in a valid state so
    that you can call all operations that have no constraints. Not giving the same
    guarantee in a user-defined type can be surprising for users of the type.


    From a perspective of robust programming (avoiding surprises, traps, and undefined
    behavior), I would usually recommend that you follow the rule of the C++ standard
    library. That is: move operations should not bring objects into a state that breaks
    invariants.


    In this case, we have to do one of the following:


    +   - Fix all broken operations of the class by also dealing correctly with all
    possible moved-from states

    +   - Disable move semantics so that there is no optimization when copying objects

    +   - Implement move operations explicitly

    +   - Adjust and document the invariant (constraints/preconditions) for the class
    or specific operations (such as "It is undefined behavior to call asString() for
    a moved-from-object")


