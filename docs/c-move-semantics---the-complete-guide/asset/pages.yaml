- pgno: 161
  md: 'Note that we do not call forward<>() once for all arguments; we call it for
    each argument individually. Therefore, we have to place the ellipsis (“...”) behind
    the end of the forward() expression instead of directly behind args.


    However, what exactly is happening here is pretty tricky and needs a careful explanation.


    # 9.2.1 Universal (or Forwarding) References


    First, note that we declare arg as an rvalue reference parameter:


    ```

    template<typename T>

    void callFoo(T&& arg);  // arg is universal/forwarding reference

    ```


    This might give the impression that the usual rules of rvalue references apply.
    However, that is not the case. An rvalue reference (not qualified with const or
    volatile) of a function template parameter does not follow the rules of ordinary
    rvalue references. It is a different thing.


    # Two Terms: Universal and Forwarding Reference


    Such a reference is called a universal reference. Unfortunately, there is also
    another term for it that is mainly used in the C++ standard: forwarding reference.
    There is no difference between these two terms, it is just that we have a historical
    mess here with two established terms meaning the same thing.


    Both terms describe basic aspects of universal/forwarding references:


    +   - They can universally bind to objects of all types (const and non-const)
    and value categories.

    +   - They are usually used to forward arguments; but note that this is not the
    only use (one reason for me to prefer the term universal reference).


    # Universal References Bind To All Value Categories


    The important feature of universal references is that they can bind to objects
    and expressions of any value category:


    ```

    template<typename T>

    void callFoo(T&& arg);     // arg is a universal/forwarding reference

    ```


    ```

    X v;

    const X c;

    callFoo(v);                // OK

    callFoo(c);                // OK

    callFoo(X{});              // OK

    callFoo(std::move(v));     // OK

    callFoo(std::move(c));     // OK

    ```


    In addition, they preserve the constness and value category (whether we have an
    rvalue or an lvalue) of the object they are bound to:


    ```

    template<typename T>

    void callFoo(T&& arg);     // arg is a universal/forwarding reference

    ```'
