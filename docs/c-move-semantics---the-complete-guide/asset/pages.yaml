  md: "# ### 9.3.1 Rvalue References of Actual Types\n\nIf we have an ordinary rvalue\
    \ reference to a name that is not a template parameter of the function called\
    \ (or if the reference is declared with const or volatile), we can only bind these\
    \ references to rvalues. In addition, we know that the passed argument is not\
    \ const:\n\n```\nusing Coll = std::vector<std::string>;\n\nvoid foo(Coll&& arg)\
    \        // arg is an ordinary rvalue reference\n{\n    Coll coll;           \
    \   // coll can’t be const\n    ...\n    bar(std::move(arg));     // perfectly\
    \ forward to bar() (no need to use std::forward<> here)\n}\n\nColl v;\nconst Coll\
    \ c;\n\nfoo(v);                     // ERROR: can’t bind rvalue reference to lvalue\n\
    foo(c);                     // ERROR: can’t bind rvalue reference to lvalue\n\
    foo(Coll{});                // OK, arg binds to a non-const prvalue\nfoo(std::move(v));\
    \          // OK, arg binds to a non-const xvalue\nfoo(std::move(c));        \
    \  // ERROR: can’t bind non-const rvalue reference to const xvalue\n```\n\nInside\
    \ foo():\n\n+   - We know that the type of arg, Coll, is never const.\n+   - It\
    \ does not make sense to use std::forward<>(). It only makes sense to use std::move()\
    \ when we no longer need the value and want to forward it to another function\
    \ (using std::forward<>() is possible here because it is equivalent to std::move()\
    \ when called for rvalue references).\n\n# ### 9.3.2 Rvalue References of Function\
    \ Template Parameters\n\nIf we have a non-const/volatile rvalue reference to a\
    \ function template parameter, we can pass objects of all value categories. The\
    \ passed argument may or may not be const:\n\n```\ntemplate<typename Coll>\nvoid\
    \ foo(Coll&& arg)                    // arg is a universal/forwarding reference\n\
    {\n    Coll coll;                          // coll may be const\n    ...\n   \
    \ bar(std::forward<Coll>(arg));        // perfectly forward to bar() (don’t use\
    \ std::move() here)\n}\n\nstd::vector<std::string> v;\nconst std::vector<std::string>\
    \ c;\n\nfoo(v);                                 // OK, arg binds to a non-const\
    \ lvalue\nfoo(c);                                 // OK, arg binds to a const\
    \ lvalue\n```"
