  md: "```\nstd::vector<std::string> coll;\nstd::optional<std::string> optStr;\n...\n\
    coll.push_back(std::::move(optStr).value());  // OK, moves from member into coll\n\
    ```\n\nNote that class std::optional<> is one of the rare places in the C++ standard\
    \ library where const rvalue references are used. The reason is that std::optional<>\
    \ is a wrapper type that wants to ensure that the operations do the right thing\
    \ even when const objects are marked with std::move() and the contained type provides\
    \ special behavior for const rvalue references.\n\n# 15.4 Move Semantics for Smart\
    \ Pointers\n\nWhile raw pointers do not benefit from move semantics (their address\
    \ values are always copies), smart pointers can benefit from move semantics.\n\
    \n+   - Shared pointers (std::shared_ptr<>) support move semantics, which is helpful\
    \ because moving a shared pointer is significantly cheaper than copying one.\n\
    +   - Unique pointers (std::unique_ptr<>) even support only move semantics because\
    \ copying a unique pointer is not possible.\n\n# 15.4.1 Move Semantics for std::shared_ptr<>\n\
    \nShared pointers have the concept of shared ownership. Multiple shared pointers\
    \ can “own” the same object and when the last owner is destroyed (or gets a new\
    \ value), a “deleter” for the owned object is called.\n\nFor example:\n\n```\n\
    {\n    std::shared_ptr<int> sp1;                     // init shared pointer that\
    \ does not own anything\n    {\n        auto sp2{std::make_shared<int>(42)}; \
    \      // init shared pointer that owns new int\n        ...\n        sp1 = sp2;\
    \                                 // sp1 and sp2 now share ownership\n       \
    \ ...\n        *sp2 = 77;                                 // modify value via\
    \ sp2\n        ...\n    }                                             // sp2 destroyed,\
    \ sp1 is the only owner\n    std::cout << *sp1 << '\\n';                    //\
    \ use modified value via sp1\n}                                              \
    \ // last owner destroyed so that delete is called\n```\n\nIn this example, the\
    \ assignment operator copies the ownership of the int, which means that afterwards,\
    \ both shared pointers own the object. However, note that copying the ownership\
    \ is a pretty expensive operation. This is because a counter has to track the\
    \ number of owners:\n\n+   - Each time we copy a shared pointer, the owner counter\
    \ is incremented\n+   - Each time we destroy a shared pointer or assign a new\
    \ value, the owner counter is decremented\n\nFurthermore, modifying the value\
    \ of the counter is expensive because the modification is an atomic operation\
    \ to avoid problems when multiple threads deal with shared pointers that own the\
    \ same object."
