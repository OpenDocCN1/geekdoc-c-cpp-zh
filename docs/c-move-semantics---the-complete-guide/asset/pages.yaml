- pgno: 174
  md: "Note that it is important to use std::remove_reference<> to remove the referenceness\
    \ of T before we check for its constness. A reference to a const type is not considered\
    \ to be const as a whole:\n\n```\nstd::is_const_v<int>                     //false\n\
    std::is_const_v<const int>               //true\nstd::is_const_v<const int&> \
    \             //false\nstd::is_const_v<std::remove_reference_t<const int&>>  //true\n\
    ```\n\nIn case you do not know yet:\n\n+   - std::remove_reference_t<T> (available\
    \ since C++14) is a shortcut for typename std::remove_reference<T>::type\n\n+\
    \   - std::is_const_v<T> (available since C++17) is a shortcut for std::is_const<T>::value.\n\
    \n# Value Category Dependent Code\n\nBy using T we can get/check the information\
    \ about the passed value category (at least whether an lvalue or an rvalue was\
    \ passed). For example:\n\n```\ntemplate<typename T>\nvoid foo(T&& arg)\n{\n \
    \   if constexpr(std::is_lvalue_reference_v<T>) {\n        ...    // passed argument\
    \ is lvalue (has no move semantics)\n    }\n    else {\n        ...    // passed\
    \ argument is rvalue (has move semantics)\n    }\n}\n```\n\nSometimes checks like\
    \ this are necessary (e.g., to deal with sub-objects differently depending on\
    \ whether an lvalue or rvalue was passed).\n\n# 10.1.3 Universal References of\
    \ Specific Types\n\nThe fact that ordinary rvalue references and universal references\
    \ share the same syntax creates multiple problems. It is not only that it is not\
    \ easy to find out what we have; there is also the problem that you cannot declare\
    \ a universal reference of a specific type.\n\nFor example, consider a function\
    \ declared to take universal references:\n\n```\ntemplate<typename T>\nvoid processString(T&&\
    \ arg);\n```\n\nAccording to this declaration, arg could have any type. The function\
    \ can be called for all arguments supporting all operations in the template.\n\
    \nThis is usually a good thing but if, for whatever reason, we want to constrain\
    \ this function to only take strings (both const and non-const without losing\
    \ this information), we cannot do that easily."
