    \ in the new memory have already stolen the values of the elements in the old\
    \ memory. Therefore, destroying the new elements would not be enough; we have\
    \ to move them back. But how do we know that moving them back does not fail?\n\
    \nYou might argue that a move constructor should never throw. This might be correct\
    \ for strings (because we just move integral values and pointers around), but\
    \ because we require that moved-from objects are in a valid state, this state\
    \ may need memory, which means that the move might throw if we are out of memory\
    \ (e.g., node-based containers of Visual C++ are implemented that way).\n\nWe\
    \ also cannot give up the guarantee because programs might have used this feature\
    \ to avoid creating a backup of a vector and losing the data could be (safety)\
    \ critical. And no longer supporting push_back() would be a nightmare for the\
    \ acceptance of C++11.\n\nThe final decision was to use move semantics on reallocation\
    \ only when the move constructor of the element types guarantees not to throw.\n\
