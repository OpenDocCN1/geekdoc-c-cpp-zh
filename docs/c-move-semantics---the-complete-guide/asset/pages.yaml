  md: "# 3.3 Rules for Special Member Functions\n\nBecause the fallback mechanism\
    \ works, copying and moving a Person compiles but the move is performed as a copy:\n\
    \n```\n```\nstd::vector<Person> coll;\n\nPerson p{\"Tina\", \"Fox\"};\ncoll.push_back(p);\
    \ // OK, copies p\ncoll.push_back(std::move(p)); // OK, copies p\n```\n```\n\n\
    Thus, declaring a special member function with =default is not the same as not\
    \ declaring it at all. The copy constructor and copy assignment are user-declared,\
    \ which disables move construction and move assignment so that moves fall back\
    \ to copies. A declared destructor has the same effect.\n\nYou might wonder why\
    \ a declared destructor disables move semantics. The chapter about moved-from\
    \ states discusses a concrete example of a class with a destructor that causes\
    \ generated move semantics not to work properly.\n\n# 3.3.4 Declared Moving Disables\
    \ Copying\n\nIf you have user-declared move semantics, you have disabled copy\
    \ semantics. The copying special member functions are deleted.\n\nIn other words,\
    \ if the move constructor or the move assignment operator is explicitly declared\
    \ (implemented, generated with =default, or disabled with =delete), you have disabled\
    \ to call the copy constructor and the copy assignment operator by declaring them\
    \ with =delete.\n\n```\n```\nclass Person {\n ...\npublic:\n ...\n// NO copy constructor\
    \ declared\n\n// move constructor/assignment declared:\nPerson(Person&&) = default;\n\
    Person& operator=(Person&&) = default;\n};\n```\n```\n\nIn this case, we have\
    \ a move-only type. A Person can be moved but not copied:\n\n```\n```\nstd::vector<Person>\
    \ coll;\n\nPerson p{\"Tina\", \"Fox\"};\ncoll.push_back(p); // ERROR: copying\
    \ disabled\ncoll.push_back(std::move(p)); // OK, moves p\n\ncoll.push_back(Person{\"\
    Ben\", \"Cook\"}); // OK, moves temporary person into coll\n```\n```\n\nAgain,\
    \ declaring a special member function with =default is not the same as not declaring\
    \ it at all. However, this time, the consequences for the caller are more severe:\
    \ the attempt to copy an object will no longer compile."
