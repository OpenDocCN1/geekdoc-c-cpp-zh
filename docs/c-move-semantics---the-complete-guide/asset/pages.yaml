- pgno: 182
  md: '```

    f(MyType{}); // T is deduced as MyType, so arg is declared as MyType&&

    f(std::move(v)); // T is deduced as MyType, so arg is declared as MyType&&

    ```


    However, for universal references, there is a special rule, if lvalues are passed
    (see the section [temp.deduct.call] of the C++ standard):¹


    If the parameter type is an rvalue reference to a cv-unqualified template parameter
    and the argument is an lvalue, the type “lvalue reference to T” is used in place
    of T for type deduction.


    That means that in this case:


    +   - If the type of the parameter arg is declared with && and not declared with
    const or volatile

    +   - and an lvalue is passed

    +   - then T is deduced as T& instead.


    In our example, that means:


    ```

    template<typename T>

    void f(T&& arg); // arg is a universal/forwarding reference


    MyType v;

    const MyType c;

    ```


    ```

    f(v); // T is deduced as MyType&

    f(c); // T is deduced as const MyType&

    ```


    However, we have arg declared as T&&. So, if T is T& instead, what does that mean?
    Here, the reference collapsing rule of C++ (see the section [dcl.ref] of the C++
    standard) gives an answer:


    +   - Type&& becomes Type&

    +   - Type& && becomes Type&

    +   - Type&& & becomes Type&

    +   - Type&& && becomes Type&&


    That means:


    ```

    MyType v;

    const MyType c;


    f(v); // T is deduced as MyType& and arg has this type

    f(c); // T is deduced as const MyType& and arg has this type

    ```


    Now consider how std::forward<>() is defined in contrast to std::move():


    +   - std::move() always converts any type to an rvalue reference:

    +     static_cast<remove_reference_t<T>&&>(t)

    +   It removes any referenceness and converts to the corresponding rvalue reference
    type (removes any & and adds &&).'
