- pgno: 69
  md: "A class supporting move operations but not copy operations can make sense.\
    \ You can use such a move-only type to pass around ownership or handles of resources\
    \ without sharing or copying them. In the C++ standard library there are a couple\
    \ of move-only types (e.g., I/O stream classes, thread classes, and std::unique_ptr<>).\
    \ See the chapter about move-only types for details.\n\n# 3.3.5 Deleting Moving\
    \ Makes No Sense\n\nFor the same reason, if you declare the move constructor as\
    \ deleted, you cannot move (you have disabled this operation; any fallback is\
    \ not used) and cannot copy (because a declared move constructor disables copy\
    \ operations):\n\n```\nclass Person {\n  public:\n    ...\n    // NO copy constructor\
    \ declared\n    \n    // move constructor/assignment declared as deleted:\n  \
    \  Person(Person&&) = delete;\n    Person& operator=(Person&&) = delete;\n   \
    \ ...\n};\n\nPerson p{\"Tina\", \"Fox\"};\ncoll.push_back(p);                //\
    \ ERROR: copying disabled\ncoll.push_back(std::move(p));     // ERROR: moving\
    \ disabled\n```\n\nYou get the same effect by declaring copying special member\
    \ functions as deleted and that is probably less confusing for other programmers.\n\
    \nDeleting the move operations and enabling the copy operations really makes no\
    \ sense:\n\n```\nclass Person {\n  public:\n    ...\n    // copy constructor explicitly\
    \ declared:\n    Person(const Person& p) = default;\n    Person& operator=(const\
    \ Person&) = default;\n    \n    // move constructor/assignment declared as deleted:\n\
    \    Person(Person&&) = delete;\n    Person& operator=(Person&&) = delete;\n \
    \   ...\n};\n\nPerson p{\"Tina\", \"Fox\"};\ncoll.push_back(p);              \
    \  // OK: copying enabled\ncoll.push_back(std::move(p));     // ERROR: moving\
    \ disabled\n```"
