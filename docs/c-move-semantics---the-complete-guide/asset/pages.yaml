  md: "# std::forward<> () for Calling Member Functions\n\nNote that you might even\
    \ use std::forward<> () for universal references when calling member functions.\
    \ Remember that a member function might have specific overloads for move semantics\
    \ using reference qualifiers. In that case, std::forward<> () can be used to call\
    \ the member function if you no longer need the value of the object afterwards.\n\
    \nFor example, assume we have overloaded getters to improve the performance when\
    \ returning the name of a temporary person:\n\n```\nclass Person\n{\nprivate:\n\
    \    std::string name;\npublic:\n    ...\n    void print() const {\n        std::cout\
    \ << \"print()\\n\";\n    }\n\n    std::string getName() && {  // when we no longer\
    \ need the value\n        return std::move(name);  // we steal and return by value\n\
    \    }\n    const std::string& getName() const& {  // in all other cases\n   \
    \     return name;            // we give access to the member\n    }\n};\n```\n\
    \nIn a function that takes a universal reference, we might then benefit from using\
    \ std::forward<> () as follows:\n\n```\ntemplate<typename T>\nvoid foo(T&& x)\n\
    {\n    x.print();                      // OK, no need to forward the passed value\
    \ category\n\n    x.getName();                    // calls getName() const&\n\
    \    std::forward<T>(x).getName();   // calls getName() && for rvalues (OK, no\
    \ longer need x)\n}\n```\n\nAfter using std::forward<> (), x is in a valid but\
    \ unspecified state. Whenever you use std::forward<> (), make sure you do no longer\
    \ use (the value of) the object.\n\n# 9.2.3 The Effect of Perfect Forwarding\n\
    \nCombining the behavior of declaring a universal reference and using std::forward<>\
    \ (), we get the following behavior:"
