- pgno: 213
  md: "# 13.1.1 Declaring Move-Only Types\n\nMove-only types have copying disabled.\
    \ Usually, the copy constructor and the copy assignment operator are deleted,\
    \ while the move constructor and move assignment operator are defaulted or implemented:\n\
    \nFor example:\n\n```\nclass MoveOnly {\npublic:\n    // constructors:\n    MoveOnly();\n\
    \    ...\n    // copying disabled:\n    MoveOnly(const MoveOnly&) = delete;\n\
    \    MoveOnly& operator= (const MoveOnly&) = delete;\n    // moving enabled:\n\
    \    MoveOnly(MoveOnly&&) noexcept;\n    MoveOnly& operator= (MoveOnly&&) noexcept;\n\
    };\n```\n\nBy rule, it would be enough to declare the moving special member function\
    \ (because declaring special move members marks the copying members as deleted).\
    \ However, explicitly marking the copying special member function with =delete\
    \ makes the intention more clear.\n\n# 13.1.2 Using Move-Only Types\n\nWith a\
    \ declaration like the one above, you can create and move but not copy objects.\
    \ For example:\n\n```\nstd::vector<MoveOnly> coll;\n...\ncoll.push_back(MoveOnly{});\
    \      // OK, creates a temporary object, which is moved into coll\n...\nMoveOnly\
    \ mo;\ncoll.push_back(mo);              // ERROR: can't copy mo into coll\ncoll.push_back(std::move(mo));\
    \   // OK, moves mo into coll\n```\n\nTo move the value of a move-only element\
    \ out of the container, simply use std::move() for a reference to the element.\
    \ For example:\n\n```\nmo = std::move(coll[0]);        // move assign first element\
    \ (still there with moved-from state)\n```\n\nHowever, remember that after this\
    \ call, the element is still in the container with a moved-from state.\n\nMoving\
    \ out all elements is also possible in loops:\n\n```\nfor (auto& elem : coll)\
    \ {        // note: non-const reference\n    coll2.push_back(std::move(elem));\
    \  // move element to coll2\n}\n```\n\nAgain: the elements are still in the container\
    \ with their moved-from state."
