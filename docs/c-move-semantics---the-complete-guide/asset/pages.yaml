- pgno: 184
  md: "```\ng(std::forward<T>(arg));  // perfectly forward (move() only for passed\
    \ rvalues)\n}\n```\n\n```\nf<std::string>(...);        // arg is a raw rvalue\
    \ reference binding to rvalues only\nf<std::string&>(...);       // arg is an\
    \ lvalue reference binding to non-const lvalues only\nf<const std::string&>(...);\
    \ // arg is a const lvalue reference binding to everything\nf<std::string&&>(...);\
    \      // arg is a raw rvalue reference binding to rvalues only\n```\n\nThus,\
    \ with an explicit specification the universal reference no longer acts as a universal\
    \ reference. As a caller, you specify which specific kind of reference you get.\n\
    \nTherefore, to pass an lvalue, where you still need the value, make sure you\
    \ specify the template parameter as lvalue reference. Otherwise, the code will\
    \ not compile:\n\n```\ntemplate<typename T>\nvoid f(T&& arg)                 //\
    \ arg is universal/forwarding reference\n{\n    g(std::forward<T>(arg));    //\
    \ perfectly forward (move() only for passed rvalues)\n}\n```\n\n```\nstd::string\
    \ s;\n...\nf<std::string>(s);              // ERROR: cannot bind rvalue reference\
    \ to lvalue\nf<std::string&>(s);             // OK, does not move and forward\
    \ s\nf<std::string>(std::move(s));   // OK, does move and forward s\nf<std::string&&>(std::move(s));\
    \ // OK, does move and forward s\n```\n\nThe last two calls are equivalent.\n\n\
    These rules also apply if you use the C++20 feature to declare ordinary functions\
    \ with auto&&:\n\n```\nvoid f(auto&& arg) {\n    g(std::forward<decltype(arg)>(arg));\n\
    }\n```\n\n# 10.3.2 Conflicting Template Parameter Deduction with Universal References\n\
    \nThe special rule for deducing template parameters of universal references (deducing\
    \ the type as an lvalue reference when lvalues are passed) can lead to unexpected\
    \ errors for code that looks correct.\n\nProgrammers are usually surprised when\
    \ code like the following does not compile:\n\n```\ntemplate<typename T>\nvoid\
    \ insert(std::vector<T>& vec, T&& elem)\n{\n    vec.push_back(std::forward<T>(elem));\n\
    }\n```\n\n```\nstd::vector<std::string> coll;\nstd::string s;\n...\n```"
