- pgno: 10
  md: '# # Preface


    Move semantics, introduced with C++11, has become a hallmark of modern C++ programming.
    However, it also complicates the language in many ways. Even after several years
    of support, experienced programmers struggle with all the details of move semantics,
    style guides still recommend different consequences for programming even of trivial
    classes, and we still discuss semantic details in the C++ standards committee.


    Whenever I have taught what I have learned about C++ move semantics so far, I
    have said, “*Somebody has to write a book about all this,*” and the usual answer
    was: “*Yes, please do!*” So, I finally did.


    As always when writing a book about C++, I was surprised about the number of aspects
    to be taught, the situations to be clarified, and the consequences to be described.
    It really was time to write a book about all aspects of move semantics, covering
    all C++ versions from C++11 up to C++20. I learned a lot and I am sure you will
    too.


    # ## An Experiment


    This book is an experiment in two ways:


    +   - I am writing an in-depth book covering a complex core language feature without
    the direct help of a core language expert as a co-author. However, I can ask questions
    and I do.

    +   - I am publishing the book myself on Leanpub and for printing on demand. That
    is, this book is written step by step and I will publish new versions as soon
    there is a significant improvement that makes the publication of a new version
    worthwhile.


    The good thing is:


    +   - You get the view of the language features from an experienced application
    programmer—somebody who feels the pain a feature might cause and asks the relevant
    questions to be able to motivate and explain the design and its consequences for
    programming in practice.

    +   - You can benefit from my experience with move semantics while I am still
    writing.

    +   - This book and all readers can benefit from your early feedback.


    This means that you are also part of the experiment. So help me out: give feedback
    about flaws, errors, features that are not explained well, or gaps, so that we
    all can benefit from these improvements.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Versions of This Book


    Because this book is written incrementally, the following is a history of the
    major updates (newest first):


    +   - **2020-10-27**: Several fixes (see errata)

    +   - **2020-09-18**: Using lambdas with template parameters (since C++20)

    +   - **2020-09-15**: Fix a bug with full specializations of universal references

    +   - **2020-09-12**: `std::move()` for data members

    +   - **2020-09-10**: Fixing deferred perfect returning

    +   - **2020-09-09**: Proof reading done and final fixes to go into print

    +   - **2020-09-06**: Helper trait `is_nothrow_movable` for abstract base classes

    +   - **2020-09-06**: Value category of (references to) functions

    +   - **2020-09-05**: Clarifications on `auto&&` including using it in C++20 functions

    +   - **2020-08-29**: Move assignments of objects to themselves

    +   - **2020-08-28**: Move semantics for `std::pair<>`, `std::optional<>`, threads,
    etc.

    +   - **2020-08-28**: Unique pointers, IOStreams, and other move-only types

    +   - **2020-08-26**: Several clarifications about universal references

    +   - **2020-08-25**: Using `std::move()` when calling member functions

    +   - **2020-08-20**: New chapter about move-only types

    +   - **2020-08-19**: Discussion of `noexcept` details

    +   - **2020-08-18**: New chapter about moving algorithms and iterators

    +   - **2020-08-10**: Description of move semantics for shared pointers

    +   - **2020-08-10**: Motivation for the reuse of moved-from objects and clarification
    of move assignments of objects to themselves

    +   - **2020-08-09**: Recommendation not to return by value with `const`

    +   - **2020-07-27**: Move semantics for strings and containers

    +   - **2020-07-24**: General remarks on using reference qualifiers

    +   - **2020-07-23**: Description of details of type deduction of universal references
    and reference collapsing for perfect forwarding

    +   - **2020-07-07**: Description of perfect returning for lambdas

    +   - **2020-06-21**: New chapter about perfect returning (with small fixes for
    perfect forwarding)

    +   - **2020-06-12**: Improvements of the chapter about “invalid” states

    +   - **2020-06-08**: New chapter about using `noexcept`

    +   - **2020-06-06**: Improvements of the chapter about invalid states

    +   - **2020-05-03**: Fixing of *move semantics in class hierarchies*

    +   - **2020-04-29**: Fixing of move semantics for classes and invalid states
    after review

    +   - **2020-04-25**: Fixing of code layout and missing figures in non-PDF versions

    +   - **2020-04-22**: New chapter about moved-from states

    +   - **2020-04-13**: Discussion of when you cannot avoid using `std::move()`

    +   - **2020-02-01**: Discussion of when automatically generated move operations
    are broken

    +   - **2020-01-19**: Constructors with universal references'
