- pgno: 72
  md: "# ### Copy Constructor\n\nThe copy constructor is automatically generated when\
    \ all of the following apply:⁵\n\n+   - No move constructor is user-declared\n\
    +   - No move assignment operator is user-declared\n\nIf generated (implicitly\
    \ or with =default), the copy constructor has the following behavior:⁶\n\n```\n\
    MyClass(const MyClass& obj) noexcept-specifier\n  : Base(obj), value(obj.value)\
    \ {\n}\n```\n\nThe generated copy constructor first passes the source object,\
    \ to the best matching copy constructor of the base class(es). (remember that\
    \ copy constructors are always called on a top-down basis). It prefers the copy\
    \ constructor with the same declaration (usually declared const&), but if that\
    \ is not available it might call the next best matching constructor (e.g., a copy\
    \ constructor template). Afterwards, it copies all members of its class (again\
    \ using the best match).\n\nThe generated copy constructor is declared as noexcept\
    \ if all copy operations (the copy constructors of all base classes and the copy\
    \ constructors of all members) give this guarantee.\n\n# ### Move Constructor\n\
    \nThe move constructor is automatically generated when all of the following apply:\n\
    \n+   - No copy constructor is user-declared\n+   - No copy assignment operator\
    \ is user-declared\n+   - No move assignment operator is user-declared\n+   -\
    \ No destructor is user-declared\n\nIf generated (implicitly or with =default),\
    \ the move constructor has the following behavior:\n\n```\nMyClass(MyClass&& obj)\
    \ noexcept-specifier\n  : Base(std::move(obj)), value(std::move(obj.value)) {\n\
    }\n```\n\nThe generated move constructor first passes the source object, marked\
    \ with std::move() to pass through its move semantics, to the best matching move\
    \ constructor of the base class(es). The best matching move constructor usually\
    \ is the one with the same declaration (declared with &&). However, if that is\
    \ not available it might call the next best matching constructor (e.g., a move\
    \ constructor template or even a copy constructor). Afterwards, it moves all members\
    \ of its class (again using the best match).\n\nYou might wonder, why after performing\
    \ a move in the base class obj.value is still used here. The reason is that a\
    \ base class can only see its members. Therefore, class MyClass knows that its\
    \ member value still has its value and can perform the move.\n\nThe generated\
    \ move constructor is declared as noexcept if all called move/copy operations\
    \ (the copy or move constructors of all base classes and the copy or move constructors\
    \ of all members) give this guarantee."
  merge: -1
