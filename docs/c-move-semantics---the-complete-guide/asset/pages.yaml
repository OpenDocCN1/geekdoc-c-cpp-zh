- pgno: 178
  md: "# 10.2.2 Rvalue References of Parameters in Class Templates\n\nAn rvalue reference\
    \ to a template parameter of a class template is *not* a universal reference.\n\
    \nFor example:\n\n```\ntemplate<typename T>\nclass C {\n    T&& member;      \
    \  // member is not a universal reference\n    ...\n    void foo(T&& arg);  //\
    \ arg is not a universal reference\n};\n```\n\nHere is a complete example:\n\n\
    *generic/universalclass.cpp*\n\n```\n#include <iostream>\n#include <string>\n\
    #include <vector>\n\ntemplate<typename T>\nclass Coll {\nprivate:\n    std::vector<T>\
    \ values;\npublic:\n    Coll() = default;\n\n    // function in class template:\n\
    \    void insert(T&& val) {\n        values.push_back(std::move(val));\n    }\n\
    };\n\nint main()\n{\n    Coll<std::string> coll;\n    ...\n    coll.insert(std::string{\"\
    prvalue\"});  // OK\n    std::string str{\"lvalue\"};\n    coll.insert(str); \
    \                     // ERROR: T&& of Coll<T> is not a universal reference\n\
    \    coll.insert(std::move(str));           // OK\n    ...\n}\n```\n\nIn general,\
    \ a function in a class template does not follow the rule of function templates.\
    \ It is what we call a *temploid*, generic code that follows the rules of ordinary\
    \ functions when we instantiate the class."
