    # 4.4.2 Implementing a Polymorphic Derived Class\n\nA polymorphic derived class\
    \ might look as follows (see *poly/polygon.hpp* for the complete header file):¹\n\
    \n```\nclass Polygon : public GeoObj {\n  protected:\n    std::vector<Coord> points;\n\
    \  public:\n    Polygon(std::string s, std::initializer_list<Coord> = {});  //\
    \ constructor\n    virtual void draw() const override;    // implementation of\
    \ draw()\n};\n```\n\nUsually, in a polymorphic derived classes there is no need\
    \ to declare a special member function. Especially, there is no need to declare\
    \ a virtual destructor again (unless you have to implement it). Declaring a destructor\
    \ again (whether or not it is virtual) would disable automatic support of move\
    \ semantics for the members of the derived class (here, for the vector points):\n\
    \n```\nclass Polygon : public GeoObj {\n  protected:\n    std::vector<Coord> points;\n\
    \  public:\n    Polygon(std::string s, std::initializer_list<Coord> = {});  //\
    \ constructor\n    ...\n    virtual ~Polygon() = default;  // OOPS: don't do that\
    \ because it disables move semantics\n};\n```\n\n¹ *virtual* is not necessary\
    \ if member functions are declared with *override*. However, I prefer to have\
    \ it again for better alignment and the rule that either all or no member functions\
    \ should be *virtual*."
