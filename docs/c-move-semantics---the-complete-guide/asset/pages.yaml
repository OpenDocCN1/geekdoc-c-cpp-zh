- pgno: 169
  md: "However, since C++20, you can also use template parameters in lambdas:\n\n\
    ```\nauto callFoo = []<typename T>(T&& arg) {  // OK, universal reference since\
    \ C++20\n    foo(std::forward<T>(arg));    // perfectly forward arg\n};\n```\n\
    \n# 9.6 Summary\n\n+   - Declarations with two ampersands (*name&&*) can be two\
    \ different things:\n+     - If *name* is not a function template parameter it\
    \ is an ordinary rvalue reference, binding only to rvalues.\n+     - If *name*\
    \ is a function template parameter it is a *universal reference*, binding to all\
    \ value categories.\n+   - A *universal reference* (called *forwarding reference*\
    \ in the C++ standard) is a reference that can universally refer to all objects\
    \ of any type and value category. Its type is\n+     - An lvalue reference (*type&*),\
    \ if it binds to an lvalue\n+     - An rvalue reference (*type&&*), if it binds\
    \ to an rvalue\n+   - To perfectly forward a passed argument, declare the parameter\
    \ as a universal reference of a template parameter of the function and use `std::forward<>()`.\n\
    +   - `std::forward<>()` is a conditional `std::move()`. It expands to `std::move()`\
    \ if its parameter is bound to an rvalue.\n+   - It might make sense to mark objects\
    \ with `std::forward<>()` even when calling member functions.\n+   - Universal\
    \ references are the second-best option of all overload resolutions.\n+   - Avoid\
    \ implementing generic constructors for one universal reference (or constrain\
    \ them for specific types)."
