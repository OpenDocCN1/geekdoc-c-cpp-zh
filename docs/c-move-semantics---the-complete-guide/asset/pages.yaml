- pgno: 152
  md: "# 8.4 When Lvalues become Rvalues\n\nAs we have learned, when a function is\
    \ declared with an rvalue reference parameter of a concrete type, you can only\
    \ bind these parameters to rvalues. For example:\n\n```\nvoid rvFunc(std::string&&);\
    \    // forward declaration\n\nstd::string s{...};\nrvFunc(s);               \
    \      // ERROR: passing an lvalue to an rvalue reference\nrvFunc(std::move(s));\
    \          // OK, passing an xvalue\n```\n\nHowever, note that sometimes, passing\
    \ an lvalue seems to work. For example:\n\n```\nvoid rvFunc(std::string&&);  \
    \  // forward declaration\n\nrvFunc(\"hello\");              // OK, although \"\
    hello\" is an lvalue\n```\n\nRemember that string literals are lvalues when used\
    \ as an expression. Therefore, passing them to an rvalue reference does not compile.\
    \ However, there is a hidden operation involved, because the type of the argument\
    \ (array of six constant characters) does not match the type of the parameter.\
    \ We have an implicit type conversion, performed by the string constructor, which\
    \ creates a temporary object that does not have a name.\n\nTherefore, what we\
    \ really call is the following:\n\n```\nvoid rvFunc(std::string&&);    // forward\
    \ declaration\n\nrvFunc(std::string{\"hello\"});  // OK, \"hello\" converted to\
    \ a string is a prvalue\n```\n\n# 8.5 When Rvalues become Lvalues\n\nLet us now\
    \ look at the implementation of a function that declares the parameter as an rvalue\
    \ reference:\n\n```\nvoid rvFunc(std::string&& str) {\n    ...\n}\n```\n\nAs we\
    \ have learned, we can only pass rvalues:\n\n```\nstd::string s{...};\nrvFunc(s);\
    \                     // ERROR: passing an lvalue to an rvalue reference\nrvFunc(std::move(s));\
    \          // OK, passing an xvalue\nrvFunc(std::string{\"hello\"}); // OK, passing\
    \ a prvalue\n```\n\nHowever, when we use the parameter str inside the function,\
    \ we are dealing with an object that has a name. This means that we use str as\
    \ an lvalue. We can do only what we are allowed to do with an lvalue.\n\nThis\
    \ means that we cannot directly call our own function recursively:\n\n```\nvoid\
    \ rvFunc(std::string&& str) {\n    rvFunc(str);                // ERROR: passing\
    \ an lvalue to an rvalue reference\n}\n```"
