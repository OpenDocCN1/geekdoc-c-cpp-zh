  md: "# 15.2 Move Semantics for Containers\n\nContainers are usually objects that\
    \ have to allocate memory to hold their elements. For that reason, you can benefit\
    \ from using move semantics for them. However, there is one exception: std::array<>\
    \ does not allocate memory on the heap, which means that for std::array<> special\
    \ rules apply.\n\nWe have already had several examples in the book about how containers\
    \ support move semantics. In the initial example motivating move semantics, we\
    \ saw the following support for move semantics:\n\n+   - By overloading push_back(),\
    \ the C++ standard supports move semantics for inserting new elements.\n+   -\
    \ By providing a move constructor and a move assignment operator, containers make\
    \ copying temporary objects (such as return values) cheap.\n\nThat is typical.\
    \ All containers support move semantics when doing the following:\n\n+   - Copying\
    \ the containers\n+   - Assigning the containers\n+   - Inserting elements into\
    \ the container\n\nHowever, there is more to say.\n\n# 15.2.1 Basic Move Support\
    \ for Containers as a Whole\n\nAll containers define a move constructor and move\
    \ assignment operator to support move semantics for unnamed temporary objects\
    \ and objects marked with std::move().\n\nFor example, class std::list<> is declared\
    \ as follows:\n\n```\ntemplate<typename T, typename Allocator = allocator<T>>\n\
    class list {\npublic:\n    ...\n    list(const list&);                // copy\
    \ constructor\n    list(list&&);                     // move constructor\n   \
    \ list& operator=(const list&);     // copy assignment\n    list& operator=(list&&)\
    \ noexcept(...);  // move assignment\n    ...\n};\n```\n\nThis makes returning/passing\
    \ a container by value and assigning the return value cheap. For example:\n\n\
    ```\nstd::list<std::string> createAndInsert()\n{\n    std::list<std::string> coll;\n\
    \    ...\n    return coll;    // move constructor if not optimized away\n}\n\n\
    std::list<std::string> v;\n...\nv = createAndInsert();  // move assignment\n```"
