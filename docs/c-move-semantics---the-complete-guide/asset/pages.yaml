- pgno: 146
  md: "![](img/c6f2c4fe3e0701d95a17354ad517147a_146_0.png)\n\nFigure 8.2. Value categories\
    \ since C++17\n\n# Passing Prvalues by Value\n\nWith this change, we can now pass\
    \ around prvalues by value as unnamed initial values even if no valid copy and\
    \ no valid move constructor is defined:\n\n```\nclass C {\npublic:\n  C(...);\n\
    \  C(const C&) = delete;    // this class is neither copyable ...\n  C(C&&) =\
    \ delete;         // ... nor movable\n};\n\nC createC() {\n  return C{...};  \
    \         // Always creates a conceptual temporary prior to C++17.\n         \
    \                  // In C++17, no temporary object is created at this point.\n\
    }\n\nvoid takeC(C val) {\n  ...\n}\n\nauto n = createC();   // OK since C++17\
    \ (error prior to C++17)\n\ntakeC(createC());     // OK since C++17 (error prior\
    \ to C++17)\n```\n\nBefore C++17, passing a prvalue such as the created and initialized\
    \ return value of createC() around was not possible without either copy or move\
    \ support. However, since C++17, we can pass prvalues around by value as long\
    \ as we do not need an object with a location.\n\n# Materialization\n\nC++17 then\
    \ introduces a new term, called materialization (of an unnamed temporary), for\
    \ the moment a prvalue becomes a temporary object. Thus, a temporary materialization\
    \ conversion is a (usually implicit) prvalue-to-xvalue conversion."
