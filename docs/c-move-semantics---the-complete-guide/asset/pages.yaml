- pgno: 55
  md: "However, because move semantics is provided to optimize performance and assigning\
    \ a different value is not necessarily a way to improve performance, it is quite\
    \ typical that implementations make both the string and the vector empty.\n\n\
    In any case, we can see that move semantics is automatically enabled for the class\
    \ Customer. For the same reason, it is now guaranteed that the following code\
    \ is cheap:\n\n```\n{\nCustomer createCustomer()\n{\nCustomer c{...};\n...\nreturn\
    \ c; // uses move semantics if not optimized away\n}\n\nstd::vector<Customer>\
    \ customers;\n...\ncustomers.push_back(createCustomer()); // uses move semantics\n\
    }\n```\n\nSee basics/customer2.cpp for the complete example.\n\nThe important\
    \ message is that, since C++11, classes automatically benefit from move semantics\
    \ if they use members that benefit from it. These classes have:\n\n+   • A move\
    \ constructor that moves the members if we create a new object from a source where\
    \ we no longer need the value:\n+   \n+   Customer c1{...}\n+   ...\n+   Customer\
    \ c2{std::move(c1)}; // move members of c1 to members of c2\n+   \n+   • A move\
    \ assignment operator that move assigns the members if we assign the value from\
    \ a source where we no longer need the value.\n+   \n+   Customer c1{...}, c2{...};\n\
    +   ...\n+   c2 = std::move(c1); // move assign members of c1 to members of c2\n\
    \nNote that such a class can benefit even further from move semantics by explicitly\
    \ implementing the following improvements:\n\n+   • Use move semantics when initializing\
    \ members\n+   • Use move semantics to make getters both safe and fast\n\n# 3.1.1\
    \ When is Move Semantics Automatically Enabled in Classes?\n\nAs just introduced,\
    \ compilers may automatically generate special move member functions (move constructor\
    \ and move assignment operator). However, there are constraints. The constraint\
    \ is that the compiler has to assume that the operations generated do the right\
    \ thing. The right thing is that we optimize the normal copy behavior: instead\
    \ of copying members, we move them because the source value is no longer needed.\n\
    \nIf classes have changed the usual behavior of copying or assignment, they probably\
    \ also have to do something different when optimizing these operations. Therefore,\
    \ the automatic generation of move operations is disabled when at least one of\
    \ the following special member functions is user-declared:"
