- pgno: 98
  md: "```\nchar c = *pos;\nif (c == ' ') {\n    ...\n}\n}\n```\n\nBefore we start\
    \ to iterate, we initialize a reference¹ because we have to use the passed range\
    \ twice (once to call begin() and once to call end() for it) and want to avoid\
    \ creating a copy of the range (which might be expensive or even not possible).\
    \ In general, references extend the lifetime of what they refer to. However, in\
    \ this case, range does not refer to the Person returned by returnPersonByValue();\
    \ range refers to the return value of getName(), which is a reference to a member\
    \ of a returned Person. Thus, range extends the lifetime of the reference but\
    \ not of the temporary object that the reference refers to. Therefore, with the\
    \ end of the first statement, the returned temporary object is destroyed and we\
    \ use a reference to the name of a destroyed object when we iterate over the characters\
    \ of the name.\n\nAt best, we get a core dump here so that we see that something\
    \ went significantly wrong. At worst, we get fatal undefined behavior once we\
    \ ship the software.\n\nCode like this would not be a problem if the getter were\
    \ to return the name by value. In that case, range would extend the lifetime of\
    \ a copy of the name so that we can use the name until the end of the lifetime\
    \ of range.\n\n# 5.1.3 Using Move Semantics to Solve the Dilemma\n\nWith move\
    \ semantics, we now have a way to solve the dilemma. We can return by reference\
    \ if it is safe to do so and return by value if we might run into lifetime issues.\n\
    \nThe way to program this is as follows:\n\n```\nclass Person\n{\nprivate:\n \
    \   std::string name;\npublic:\n    std::string getName() && {  // when we no\
    \ longer need the value\n        return std::move(name);  // we steal and return\
    \ by value\n    }\n    const std::string& getName() const& {  // in all other\
    \ cases\n        return name;            // we give access to the member\n   \
    \ }\n};\n```\n\nWe overload the getter with different reference qualifiers in\
    \ the same way as when overloading a function for && and const& parameters:\n\n\
    +   - The version with the && qualifier is used when we have an object where we\
    \ no longer need the value (an object that is about to die or that we have marked\
    \ with std::move())."
