- pgno: 50
  md: '# 2.6 Summary


    +   - Objects marked with std::move() can also be passed to functions taking the
    argument by value. In that case, move semantics is used to initialize the parameter,
    which can make call-by-value pretty cheap.

    +   - const rvalue references are possible but implementing against them usually
    makes no sense.

    +   - Moved-from objects should be in a valid but unspecified state. The C++ standard
    library guarantees that for its types. You can still (re)use them providing you
    do not make any assumptions about their value.'
