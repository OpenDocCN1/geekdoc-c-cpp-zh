- pgno: 181
  md: "Note that you have to declare/define full specializations of member function\
    \ templates outside the class definition:\n\n```\ntemplate<typename T>\nclass\
    \ Cont {\n    ...\n    // primary template:\n    template<typename U>\n    void\
    \ insert(U&& v) {  // universal reference\n        coll.push_back(std::forward<U>(v));\n\
    \    }\n    ...\n};\n```\n\n// full specializations for Cont<T>::insert<>():\n\
    // - have to be outside the class\n// - need specializations for rvalues and lvalues\n\
    \n```\ntemplate<>\ntemplate<>\nvoid Cont<std::string>::insert<>(std::string&&\
    \ v)\n{\n    coll.push_back(std::move(v));\n}\n```\n\n```\ntemplate<>\ntemplate<>\n\
    void Cont<std::string>::insert<>(const std::string& v)\n{\n    coll.push_back(v);\n\
    }\n```\n\n# 10.3 How the Standard Specifies Perfect Forwarding\n\nTo finally understand\
    \ all rules of perfect forwarding, let us see how the rules are formally specified\
    \ in the C++ standard.\n\nAgain, consider you have the following declaration:\n\
    \n```\ntemplate<typename T>\nvoid f(T&& arg)          // arg is universal/forwarding\
    \ reference\n{\n    g(std::forward<T>(arg));  // perfectly forward (move() only\
    \ for passed rvalues)\n}\n```\n\nNormally, T would just have the type of the passed\
    \ argument:\n\n```\nMyType v;\n```"
