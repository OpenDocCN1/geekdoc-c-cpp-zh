    \ &&\n                        is_nothrow_movable_v<MemType>);\n};\n```\n\nTo not\
    \ having the need to implement all pure virtual functions, a compiler supported\
    \ type trait is missing in the C++ standard.\n\n# 7.4 When and Where to Use noexcept\n\
    \nAs seen, noexcept was introduced in C++11 as a response to the problem that\
    \ we cannot use move semantics when reallocating elements in a vector.\n\nIn principle,\
    \ you can now mark every function with a (conditional) noexcept. This might not\
    \ only help in situations like vector reallocations (note that the move constructor\
    \ might then call other functions where we also need the noexcept guarantee),\
    \ but we might also help the compiler to optimize code because no code has to\
    \ be generated to handle exceptions. So the question is, where to place noexcept\
    \ in your code?\n\nFor the C++11 standard library, we were in a hurry to decide\
    \ where to place noexcept (the reallocation problem was detected very late and\
    \ the final semantic meaning of noexcept was clarified right in the week where\
    \ we shipped C++11). Therefore, we followed a pretty conservative approach that\
    \ was proposed in http://wg21.link/n3279, which could also be a useful guideline\
    \ for your code. Roughly speaking, the guideline is:\n\n+   - Each library function\
    \ that the library working group agree cannot throw and that has a \"wide contract\"\
    \ (i.e., does not specify undefined behavior due to a precondition) should be\
    \ marked as unconditionally noexcept.\n+   - If a library swap function, move\
    \ constructor, or move assignment operator is \"conditionally wide\" (i.e., can\
    \ be proven not to throw by applying the noexcept operator), then it should be\
    \ marked as conditionally noexcept. No other function should use a conditional\
    \ noexcept specification.\n+   - No library destructor should throw. It should\
    \ use the implicitly supplied (non-throwing) exception specification.\n+   - Library\
    \ functions designed for compatibility with C code may be marked as unconditionally\
    \ noexcept.\n\nThe following examples demonstrate what the first item means:\n\
    \n+   - For containers and strings, the member functions empty() and clear() are\
    \ marked with noexcept because there is no useful way to implement them in a way\
    \ that they might throw."
