    \ elem when the value of elem is no longer needed:\nvoid push_back (T&& elem);\n\
    ...\n```\n\nThe push_back() function for rvalues forwards the passed element with\
    \ std::move() so that the move constructor of the element type is called instead\
    \ of the copy constructor.\n\nIn the same way, all containers have corresponding\
    \ overloads. For example:\n\n```\ntemplate<typename Key, typename T, typename\
    \ Compare = less<Key>,\n    typename Allocator = allocator<pair<const Key, T>>>\n\
    class map {\npublic:\n    ...\n    pair<iterator, bool> insert(const value_type&\
    \ x);\n    pair<iterator, bool> insert(value_type&& x);\n    ...\n};\n```\n\n\
    # Emplace Functions\n\nSince C++11, containers also provide emplace functions\
    \ (such as emplace_back() for vectors). Instead of passing a single argument of\
    \ the element type (or convertible to the element type), you can pass multiple\
    \ arguments to initialize a new element directly in the container. That way you\
    \ save a copy or move.\n\nNote that even then, containers can benefit from move\
    \ semantics by supporting move semantics for the initial arguments of constructors.\n\
    \nFunctions like emplace_back() use perfect forwarding to avoid creating copies\
    \ of the passed arguments. For example, for std::vector<>, the emplace_back()\
    \ member function is defined as follows:\n\n```\ntemplate<typename T, typename\
    \ Allocator = allocator<T>>\nclass vector {\npublic:\n    ...\n    // insert a\
    \ new element with perfectly forwarded arguments:\n    template<typename... Args>\n\
    \    constexpr T& emplace_back(Args&&... args) {\n        ...\n        // call\
    \ the constructor with the perfectly forwarded arguments:\n        place_element_in_memory(T(std::forward<Args>(args)...));\n\
    \        ...\n    }\n    ...\n};\n```\n\nInternally, the vector initializes the\
    \ new element with the perfectly forwarded arguments."
