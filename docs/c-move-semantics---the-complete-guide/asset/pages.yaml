  md: "Again, coll copies s:\n\n```\n```cpp\nstd::vector<std::string> createAndInsert()\n\
    {\n    std::vector<std::string> coll;\n    coll.reserve(3);\n    std::string s\
    \ = \"data\";\n\n    coll.push_back(s);\n\n    coll.push_back(s+s);\n\n    coll.push_back(s);\n\
    \n    return coll;\n}\n\nstd::vector<std::string> v;\n...\nv = createAndInsert();\n\
    ```\n```\n\n![](img/c6f2c4fe3e0701d95a17354ad517147a_25_0.png)\n\nThis is also\
    \ something to improve: because the value of s is no longer needed some optimization\
    \ could use the memory of s as memory for the new element in the vector instead.\n\
    \n+   - At the end of `createAndInsert()` we come to the return statement:\n+\
    \   \n+     ```cpp\n+     return coll;\n+     } \n+     ```\n\nHere, the behavior\
    \ of the program becomes a bit more complicated. We return by value (the return\
    \ type is not a reference), which should be a copy of the value in the return\
    \ statement, coll. Creating a copy of coll means that we have to create a deep\
    \ copy of the whole vector with all of its elements. Thus, we have to allocate\
    \ heap memory for the array of elements in the vector and heap memory for the\
    \ value each string allocates to hold its value. Here, we would have to allocate\
    \ memory 4 times.\n\nHowever, since at the same time coll is destroyed because\
    \ we leave the scope where it is declared, the compiler is allowed to perform\
    \ the named return value optimization (NRVO). This means that the compiler can\
    \ generate code so that coll is just used as the return value.\n\nThis optimization\
    \ is allowed even if this would change the functional behavior of the program.\
    \ If we had a print statement in the copy constructor of a vector or string, we\
    \ would see that the program no longer has the output from the print statement.\
    \ This means that this optimization changes the functional behavior of the program.\
    \ However, that is OK, because we explicitly allow this optimization in the C++\
    \ standard even if it has side effects. Nobody should expect that a copy is done\
    \ here, in the same way that nobody should expect that it is not, either. It is\
    \ simply up to the compiler whether the named return value optimization is performed.\n\
    \nLet us assume that we have the named return value optimization. In that case,\
    \ at the end of the return statement, coll now becomes the return value and the\
    \ destructor of s is called, which frees the memory allocated when it was declared:"
