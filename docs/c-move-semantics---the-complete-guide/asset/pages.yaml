- pgno: 108
  md: "Note that the definition of the C++ standard library requires more than what\
    \ is called *partially formed* in “Elements of Programming” by Alexander Stepanov\
    \ and Paul McJones.²\n\nFor all objects and types you use in the C++ standard\
    \ library you should **ensure that moved-from objects also support all requirements\
    \ of the functions called.**\n\n# 6.1.2 Guaranteed States of Moved-From Objects\n\
    \nThe guarantees for moved-from objects define which code is well-defined when\
    \ you use them. In general, the designer of a class decides which guarantees are\
    \ given. However, because we always destroy an object at the end of its lifetime,\
    \ the minimum guarantee you always have to give for moved-from states is that\
    \ calling the destructor is well-defined.\n\nUsually, more guarantees are given.\
    \ For the requirements of the C++ standard library, supporting basic operations\
    \ such as copying, assigning objects of the same type are often enough. However,\
    \ users usually expect that you can also deal with all other ways to assign a\
    \ new value to your object. Therefore, a useful additional guarantee is that you\
    \ can use any form to “assign” a new value to a moved-from object.\n\nConsider\
    \ the different ways you can assign a new value to a standard string s:\n\n```\n\
    s = \"hello\";              // assign \"hello\"\ns.assign(s2);              //\
    \ assign the state of s2\ns.clear();                 // assign the empty state\n\
    std::cin >> s;             // assign the next word from standard input\nstd::getline(myfile,\
    \ s);   // assign the next line from a file\n```\n\nFor example, the following\
    \ loop is a common way to read line by line from a stream into a vector:\n\n```\n\
    std::string row;\nwhile (std::getline(myStream, row)) {\n    coll.push_back(std::move(row));\
    \   // move the line into the vector\n}\n```\n\nAs another example, you can implement\
    \ the following statements in generic code dealing with containers:\n\n```\nfoo(std::move(obj));\
    \      // pass obj to foo()\nobj.clear();              // ensure the object is\
    \ empty afterwards\n```\n\nSimilar code can be useful to release memory for an\
    \ object that a unique pointer uses:\n\n```\ndraw(std::move(up));      // the\
    \ unique pointer might or might not give up ownership\nup.reset();           \
    \    // ensure we give up ownership and release any resource\n```"
