- pgno: 187
  md: "The question is, why did the C++ standards committee not just adopt the term\
    \ already established in the C++ community? Well, the argument was that the term\
    \ is confusing, but we have more confusing terms in the C++ standard and the confusion\
    \ of now having two terms for the same thing is certainly far worse.³\n\nIn any\
    \ case, it was the deliberate decision of the C++ standards committee to come\
    \ up with a different term. There is no doubt that *universal reference* was good\
    \ enough (we have far worse terms in the C++ standard); however, not adopting\
    \ this term and using another or better term was even more important for a critical\
    \ mass of people in the C++ standards committee.\n\nI still prefer to use *universal\
    \ reference* (the books should at least be consistent; the standard often uses\
    \ its own terminology only valid for experts anyway). However, for clarification,\
    \ I often (have to) use *universal/forwarding reference* to deal with this mess.\n\
    \nFor you, this means that whenever you hear the term *forwarding reference*,\
    \ you have to translate it to *universal reference* (or vice versa). And if in\
    \ doubt, use *universal/forwarding reference*.\n\n# 10.4.2 Why && for Both Ordinary\
    \ Rvalues and Universal References?\n\nUniversal/forwarding references use the\
    \ same syntax as ordinary rvalue references, which is a serious source of trouble\
    \ and confusion. So why did we not introduce a specific syntax for universal references?\n\
    \nAn alternative proposal, for example, might have been (and is sometimes discussed\
    \ as a possible fix):\n\n+   - Use *two* ampersands for ordinary rvalue references:\n\
    +     ```\n+     void foo(Coll&& arg)    // arg is an ordinary rvalue reference\n\
    +     ```\n\n+   - Use *three* ampersands for universal references:\n+     ```\n\
    +     template<typename Coll>\n+     void foo(Coll&&& arg)    // arg is universal/forwarding\
    \ reference\n+     ```\n\nHowever, these three ampersands might just look too\
