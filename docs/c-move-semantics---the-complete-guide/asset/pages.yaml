  md: "# 1.1.2 Example Since C++11 (Using Move Semantics)\n\nLet us now recompile\
    \ the program with a modern C++ compiler (C++11 or later) that supports move semantics:\n\
    \nbasics/motiv11.cpp\n\n```\n#include <string>\n#include <vector>\n\nstd::vector<std::string>\
    \ createAndInsert()\n{\n    std::vector<std::string> coll;    // create vector\
    \ of strings\n    coll.reserve(3);                  // reserve memory for 3 elements\n\
    \    std::string s = \"data\";          // create string object\n\n    coll.push_back(s);\
    \                // insert string object\n    coll.push_back(s+s);           \
    \   // insert temporary string\n    coll.push_back(std::move(s));     // insert\
    \ string (we no longer need the value of s)\n\n    return coll;              \
    \        // return vector of strings\n}\n\nint main()\n{\n    std::vector<std::string>\
    \ v;       // create empty vector of strings\n    ...\n    v = createAndInsert();\
    \            // assign returned vector of strings\n    ...\n}\n```\n\nThere is\
    \ a small modification, though: we add a std::move() call when we insert the last\
    \ element into coll. We will discuss this change when we come to this statement.\
    \ Everything else is as before.\n\nAgain, let us look at the individual steps\
    \ of the program by inspecting both the stack and the heap.\n\n+   - First, in\
    \ main(), we create the empty vector v, which is placed on the stack with 0 elements:\n\
    +     std::vector<std::string> v;\n+   - Then, we call\n+     v = createAndInsert();\n\
    +     where we create another empty vector coll on the stack and reserve uninitialized\
    \ memory for three elements on the heap:\n+     std::vector<std::string> coll;\n\
    +     coll.reserve(3);\n+   - Then, we create the string s initialized with \"\
    data\" and insert it into coll again:\n+     std::string s = \"data\";\n+    \
    \ coll.push_back(s);"
