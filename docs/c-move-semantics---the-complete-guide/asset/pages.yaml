    \ Customer& cust)\n  : name{cust.name}, values{cust.values} {\n    std::cout <<\
    \ \"COPY \" << cust.name << '\\n';\n}\n\n// move constructor (move all members):\n\
    Customer(Customer&& cust)                     // noexcept declaration missing\n\
