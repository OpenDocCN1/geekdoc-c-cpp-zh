  md: '# Chapter 14


    # Moving Algorithms and Iterators


    The C++ standard library has special support for moving elements while iterating
    over them. For this purpose, special algorithms and special iterators (move iterators)
    were introduced with C++11. This chapter discusses how to use them.


    # 14.1 Moving Algorithms


    The C++ standard library provides a few algorithms that move elements. These algorithms
    are:


    +   - std::move(), which moves elements to another range or backwards in the same
    range (do not confuse this algorithm with the std::move() to mark an object that
    you no longer need its value).

    +     You specify the beginning of the destination range and the elements are
    moved from the beginning to the end of the source range.

    +   - std::move_backward(), which moves elements to another range or forward in
    the same range.

    +     You specify the end of the destination range and the elements are moved
    from the end to the beginning of the source range.


    These algorithms are the counterparts of the std::copy() and std::copy_backward()
    algorithms using move semantics. And yes, we have another overload for std::move()
    taking multiple parameters (three iterators and, since C++17, an optional parallel
    execution policy).


    The effect of these algorithms is a move assignment to the destination range calling
    std::move(elem) for each element while iterating over them.


    Consider the following example:


    lib/movealgo.cpp


    ```

    #include <iostream>

    #include <string>

    #include <vector>

    #include <list>

    #include <algorithm>


    template<typename T>

    ```'
