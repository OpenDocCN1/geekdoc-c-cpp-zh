- pgno: 154
  md: "```\nstd::cout << std::is_reference<decltype(str)>::value;      // true\nstd::cout\
    \ << std::is_lvalue_reference<decltype(str)>::value;  // false\nstd::cout << std::is_rvalue_reference<decltype(str)>::value;\
    \  // true\n}\n```\n\nThe expression decltype(str) always yields the type of str,\
    \ which is std::string&&. We can use this type wherever we need this type in an\
    \ expression. Type traits (type functions such as std::is_same<>) help us deal\
    \ with these types.\n\nFor example, to declare a new object of the passed parameter\
    \ type that is not a reference, we can declare:\n\n```\nvoid rvFunc(std::string&&\
    \ str)\n{\n    std::remove_reference<decltype(str)>::type tmp;\n    ...\n}\n```\n\
    \ntmp has type std::string in this function (which we could also explicitly declare,\
    \ but if we make this a generic function for objects of type T, the code would\
    \ still work).\n\n# 8.6.2 Using decltype to Check the Value Category\n\nSo far,\
    \ we have passed only names to decltype to ask for its type. However, you can\
    \ also pass expressions (that are not just names) to decltype. In that case, decltype\
    \ also yields the value category according to the following conventions:\n\n+\
    \   - For a prvalue it just yields its value type: type\n+   - For an lvalue it\
    \ yields its type as an lvalue reference: type&\n+   - For an xvalue it yields\
    \ its type as an rvalue reference: type&&\n\nFor example:\n\n```\nvoid rvFunc(std::string&&\
    \ str)\n{\n    decltype(str + str)    // yields std::string because s+s is a prvalue\n\
    \    decltype(str[0])       // yields char& because the index operator yields\
    \ an lvalue\n    ...\n}\n```\n\nThis means that if you just pass a name placed\
    \ inside parentheses, which is an expression and no longer just a name, decltype\
    \ yields its type and its value category. The behavior is as follows:\n\n```\n\
    void rvFunc(std::string&& str)\n{\n    std::cout << std::is_same<decltype((str)),\
    \ std::string>::value;      // false\n    std::cout << std::is_same<decltype((str)),\
    \ std::string&>::value;     // true\n    std::cout << std::is_same<decltype((str)),\
    \ std::string&&>::value;    // false\n\n    std::cout << std::is_reference<decltype((str))>::value;\
    \              // true\n    std::cout << std::is_lvalue_reference<decltype((str))>::value;\
    \       // true\n    std::cout << std::is_rvalue_reference<decltype((str))>::value;\
    \       // false\n}\n```"
