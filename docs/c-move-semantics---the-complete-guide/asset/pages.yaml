- pgno: 200
  md: "# 11.5 Using auto&& in C++20 Function Declarations\n\nSince C++20, you can\
    \ also declare ordinary functions with auto&&, which is then handled in the same\
    \ way: it declares a function template with a universal reference.\n\nThe following\
    \ definition:\n\n```\nvoid callFoo(auto&& val) {\n    foo(std::forward<decltype(arg)>(arg));\n\
    }\n```\n\nis equivalent to the following:\n\n```\ntemplate<typename T>\nvoid callFoo(T&&\
    \ val) {\n    foo(std::forward<decltype(arg)>(arg));\n}\n```\n\nThis means that\
    \ you can also explicitly specify the type of the parameter here. However, in\
    \ the same way as for ordinary function templates, you have to qualify the template\
    \ parameter with a type that fits the value category of your passed argument:\n\
    \n```\nstd::string s;\n...\ncallFoo<std::string>(s);                // ERROR:\
    \ cannot bind rvalue reference to lvalue\ncallFoo<std::string&>(s);          \
    \     // OK, does not move and forward s\ncallFoo<std::string>(std::move(s));\
    \     // OK, does move and forward s\ncallFoo<std::string&&>(std::move(s));  \
    \ // OK, does move and forward s\n```\n\n# 11.6 Summary\n\n+   - Do not return\
    \ by value with const (otherwise you disable move semantics for return values).\n\
    +   - Do not mark returned non-const rvalue references with const.\n+   - auto&&\
    \ can be used to declare a universal reference that is not a parameter. Just like\
    \ any universal reference, it can refer to all objects of any type and value category\
    \ and its type is\n+     - An lvalue reference (Type&) if it binds to an lvalue\n\
    +     - An rvalue reference (Type&&) if it binds to an rvalue\n+   - Use std::forward<decltype(ref)>(ref)\
    \ to perfectly forward a universal reference ref that is declared with auto&&.\n\
    +   - You can use universal references to refer to both const and non-const objects\
    \ and use them multiple times without losing the information about their constness.\n\
    +   - You can use universal references to bind to references that are proxy types.\n\
    +   - Consider using auto&& in generic code that iterates over elements of a collection\
    \ to modify them. That way, the code works for references that are proxy types.\n\
    +   - Using auto&& when declaring parameters of a lambda (or function, since C++20)\
    \ is a shortcut for declaring parameters that are universal references in a function\
    \ template."
