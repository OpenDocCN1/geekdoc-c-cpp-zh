  md: "# Chapter 1\n\n# The Power of Move Semantics\n\nThis chapter demonstrates the\
    \ basic principles and benefits of move semantics using a short code example.\n\
    \n# 1.1  Motivation for Move Semantics\n\nTo understand the basic principles of\
    \ move semantics, let us look at the execution of a small piece of code, first\
    \ without move semantics (i.e., compiled with an old C++ compiler that supports\
    \ only C++03) and then with move semantics (compiled with a modern C++ compiler\
    \ that supports C++11 or later).\n\n# 1.1.1  Example with C++03 (Before Move Semantics)\n\
    \nAssume we have the following program:\n\n```\n```cpp\n#include <string>\n#include\
    \ <vector>\n\nstd::vector<std::string> createAndInsert()\n{\n    std::vector<std::string>\
    \ coll;  // create vector of strings\n    coll.reserve(3);                // reserve\
    \ memory for 3 elements\n    std::string s = \"data\";         // create string\
    \ object\n\n    coll.push_back(s);              // insert string object\n    coll.push_back(s+s);\
    \            // insert temporary string\n    coll.push_back(s);              //\
    \ insert string\n\n    return coll;                    // return vector of strings\n\
    }\n```\n```"
