  md: "# 9.2 Implementing Perfect Forwarding\n\n```\nX v;\nconst X c;\ncallFoo(v);\
    \                         // OK, arg is X&\ncallFoo(c);                      \
    \   // OK, arg is const X&\ncallFoo(X{});                       // OK, arg is\
    \ X&&\ncallFoo(std::move(v));              // OK, arg is X&&\ncallFoo(std::move(c));\
    \              // OK, arg is const X&&\n```\n\nBy rule, the type T&&, which is\
    \ the type of arg, is\n\n+   • An lvalue reference if we refer to an lvalue\n\
    +   • An rvalue reference if we refer to an rvalue\n\nNote that a generic rvalue\
    \ reference that is qualified with const (or volatile) is **not** a universal\
    \ reference.\nYou can only pass rvalues:\n\n```\ntemplate<typename T>\nvoid callFoo(const\
    \ T&& arg);  // arg is not a universal/forwarding reference\n\nconst X c;\ncallFoo(c);\
    \                    // ERROR: c is not an rvalue\ncallFoo(std::move(c));    \
    \     // OK, arg is const X&&\n```\n\nNote also that I did not talk about the\
    \ type of T yet. I will explain later what type is deduced as T with universal\
    \ references.\n\nLater, we discuss the corresponding example using lambdas.\n\n\
    # 9.2.2  `std::forward<>`\n\nInside callFoo(), we then use the universal reference\
    \ as follows:\n\n```\ntemplate<typename T>\nvoid callFoo(T&& arg) {\n  foo(std::forward<T>(arg));\
    \  // becomes foo(std::move(arg)) for passed rvalues\n}\n```\n\nLike std::move(),\
    \ std::forward<>() is also defined as a function template in the header file <utility>.\n\
    The expression std::forward<T>(arg) is essentially implemented as follows:\n\n\
    +   • If an rvalue of type T is passed to the function, the expression is equivalent\
    \ to std::move(arg).\n+   • If an lvalue of type T is passed to the function,\
    \ the expression is equivalent to arg.\n\nThat is, std::forward<>() is a std::move()\
    \ only for passed rvalues.\n\nJust like for std::move(), the semantic meaning\
    \ of std::forward<>() is *I no longer need this value here*, with the additional\
    \ benefit that we preserve the type (including constness) and the value category\
    \ of the object the passed universal reference binds to. You can argue that you\
    \ only say conditionally that you no longer need the value, but because you do\
    \ not know whether std::forward<>() becomes a std::move(), it would be an error\
    \ to assume that the object has its value afterwards. So again, all you should\
    \ assume is that after using std::forward<>() the object is usually valid but\
    \ you do not know its value."
