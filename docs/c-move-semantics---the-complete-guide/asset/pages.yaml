- pgno: 103
  md: 'Essentially, we give temporary objects back a property that they have for fundamental
    types: they are rvalues, which means that they cannot be on the left-hand side
    of an assignment.


    Note that all of these proposals to fix the C++ standard accordingly have so far
    been rejected. The main reason were concerns about backward compatibility. However,
    when implementing your own class, you can use this improvement as follows:


    ```

    class MyType {

    public:

    ...

    // disable assigning value to temporary objects:

    MyType& operator=(const MyType& str) & =default;

    MyType& operator=(MyType&& str) & =default;


    // because this disables the copy/move constructor, also:

    MyType(const MyType&) =default;

    MyType(MyType&&) =default;

    ...

    };

    ```


    In general, you should do this for every member function that might modify an
    object.


    # 5.3.2 Reference Qualifiers for Other Member Functions


    As demonstrated by the example of getters, reference qualifiers could and should
    also be used when references to objects are returned. That way, we can reduce
    the risk of accessing a member of a destroyed temporary object.


    Again, the current declaration of standard strings might serve as an example:


    ```

    namespace std {

    template<typename charT, ...>

    class basic_string {

    public:

    ...

    constexpr const charT& operator[](size_type pos) const;

    constexpr charT& operator[](size_type pos);

    constexpr const charT& at(size_type n) const;

    constexpr charT& at(size_type n);


    constexpr const charT& front() const;

    constexpr charT& front();

    constexpr const charT& back() const;

    constexpr charT& back();

    ...

    };

    }

    ```'
