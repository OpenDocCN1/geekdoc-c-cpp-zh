  md: "# Perfectly Forwarding const Rvalue References\n\nAlthough we have no semantic\
    \ meaning for const rvalue references, if we wanted to keep the exact type and\
    \ value category of a constant object marked with `std::move()`, we would even\
    \ need a fourth overload:\n\n```\n```cpp\nvoid callFoo(const X&& arg) { // arg\
    \ binds to const rvalues\n    foo(std::move(arg));      // needs std::move() to\
    \ call foo(const X&&)\n}\n```\n```\n\nOtherwise, we would call `foo(const X&)`.\
    \ This is usually fine but there might be cases where we want to keep the knowledge\
    \ that we passed a const rvalue reference (e.g., when for whatever reason, a `foo(const\
    \ X&&)` overload is provided).\n\nWith this, generic code would need even 16 and\
    \ 64 overloads for two or three parameters, unless the language provides a special\
    \ feature for perfect forwarding.\n\n# 9.2  Implementing Perfect Forwarding\n\n\
    To avoid overloading functions for parameters with different value categories,\
    \ C++ introduced a special mechanism for *perfect forwarding*. You need three\
    \ things:\n\n+   1. Take the call parameter as a pure rvalue reference (declared\
    \ with `&&` but without `const` or `volatile`).\n+   2. The type of the parameter\
    \ has to be a template parameter of the function.\n+   3. When forwarding the\
    \ parameter to another function, use a helper function called `std::forward<>()`,\
    \ which is declared in `<utility>`.\n\nYou have to implement a function that perfectly\
    \ forwards an argument as follows:\n\n```\n```cpp\ntemplate<typename T>\nvoid\
    \ callFoo(T&& arg) {\n    foo(std::forward<T>(arg));  // equivalent to foo(std::move(arg))\
    \ for passed values\n}\n```\n```\n\n`std::forward<>` is effectively a conditional\
    \ `std::move()` so that we get the same behavior as the three (or four) overloads\
    \ of `callFoo()` above:\n\n+   - If we pass an rvalue to `arg`, we have the same\
    \ effect as calling `foo(std::move(arg))`\n+   - If we pass an lvalue to `arg`,\
    \ we have the same effect as calling `foo(arg)`\n\nIn the same way, we can perfectly\
    \ forward two arguments:\n\n```\n```cpp\ntemplate<typename T1, typename T2>\n\
    void callFoo(T1&& arg1, T2&& arg2) {\n    foo(std::forward<T1>(arg1), std::forward<T2>(arg2));\n\
    }\n```\n```\n\nWe can also apply `std::forward<>` to each argument of a variadic\
    \ number of parameters to perfectly forward them all:\n\n```\n```cpp\ntemplate<typename...\
    \ Ts>\nvoid callFoo(Ts&&... args) {\n    foo(std::forward<Ts>(args)...);\n}\n\
    ```\n```"
