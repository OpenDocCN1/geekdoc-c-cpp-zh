- pgno: 175
  md: "Since C++20, constraining a universal reference to specific types is possible\
    \ with concepts and the key word requires. However, you have to decide whether\
    \ and which kind of type conversions you support:\n\n+   • When the type must\
    \ match (no implicit conversions allowed):\n\n```\ntemplate<typename T>\nrequires\
    \ std::same_as<std::remove_cvref_t<T>, std::string>\nvoid processString(T&&) {\n\
    \  ...\n}\n```\n\n+   • When implicit conversions should be allowed:\n\n```\n\
    template<typename T>\nrequires std::convertible_to<T, std::string>\nvoid processString(T&&)\
    \ {\n  ...\n}\n```\n\n+   • When even explicit conversions should be allowed:\n\
    \n```\ntemplate<typename T>\nrequires std::constructible_from<std::string, T>\n\
    void processString(T&&) {\n  ...\n}\n```\n\nUsually, std::convertible_to is what\
    \ you want because it fits with the usual rules of function calls.\n\nNote that\
    \ std::convertible_to and std::constructible_from have the opposite order for\
    \ source and destination type of the conversion.\n\nSee generic/universaltype.cpp\
    \ for a complete example with all cases.\n\nBefore C++20, you need the enable_if<>\
    \ type trait instead of requires and the shortcuts with the _v and _t suffix for\
    \ type traits might not have been supported. For example, the following code supports\
    \ all types that are implicitly convertible to std::string since C++11:\n\n```\n\
    template<typename T,\ntypename = typename std::enable_if<\nstd::is_convertible<T,\
    \ std::string>::value\n>::type>\nvoid processString(T&& args);\n```\n\nTo restrict\
    \ to type std::string in C++11, we need:\n\n```\ntemplate<typename T,\ntypename\
    \ = typename std::enable_if<\nstd::is_same<typename std::decay<T>::type, std::string>::value\n\
    >::type>\nvoid processString(T&& arg);\n```"
