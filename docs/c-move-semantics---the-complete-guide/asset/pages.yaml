  md: '# Chapter 13


    # Move-Only Types


    One major application of move semantics is move-only types. These are types where
    objects represent a value or “own” a resource for which copying does not make
    any sense. However, it should still be possible to pass the value or the ownership
    around (e.g., passing it as an argument, returning it, or storing it in a container).


    Examples of move-only types in the C++ standard library are:


    +   - IOStreams

    +   - Threads

    +   - Unique pointers


    In all these examples, an object represents a resource (an opened stream, a running
    thread, or an allocated object). The object “owns” the resource in the sense that
    the destructor of the object will release the resource (close the stream, end
    or wait for the end of the thread, release the allocated object).


    You can pass the ownership around but copying of the resource is not supported.
    Copying might not make sense for semantic reasons (what is a copy of an opened
    file, what is a copy of a running thread?) or for technical reasons (if we have
    two owners of the same resource, we have to synchronize the access or deal with
    potential consequences).


    Thus, move-only types simplify the management of unique resources. The type system
    is used to disable copying but we can still pass these resources around. There
    is always only one location at a time where the resource is stored/managed. However,
    we can still refer to these resources with pointers or references.


    # 13.1 Declaring and Using Move-Only Types


    Move-only types and objects have some common aspects when declared or used.'
