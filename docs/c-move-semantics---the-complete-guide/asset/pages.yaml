- pgno: 168
  md: "As indicated in the comments, the program has the following output:\n\n```\n\
    copy constructor\nuniversal constructor\nmove constructor\nuniversal constructor\n\
    ```\n\nTherefore, it is better to avoid implementing generic constructors that\
    \ declare the first parameter as a universal reference and can be called for one\
    \ argument of an arbitrary type.\n\nThe other option is to constrain the constructor\
    \ in a way that it is disabled if the passed is (convertible to) the type of the\
    \ class. The effect is that the copy or move constructor has to be used instead.\
    \ Since C++20, this looks as follows:\n\n```\nclass X {\npublic:\n...\ntemplate<typename\
    \ T>\nrequires (!std::is_same_v<std::remove_cvref_t<T>, X>)\nX(T&&) {\n    std::cout\
    \ << \"universal constructor\\n\";\n}\n};\n```\n\nBefore C++20, you needed something\
    \ like this:\n\n```\nclass X {\npublic:\n...\ntemplate<typename T,\n    typename\
    \ = typename std::enable_if<!std::is_same<typename std::decay<T>::type, X>::value>::type>\n\
    X(T&&) {\n    std::cout << \"universal constructor\\n\";\n}\n};\n```\n\n# 9.5\
    \ Perfect Forwarding in Lambdas\n\nIf you want to perfectly forward parameters\
    \ of lambdas, you also have to use universal references and std::forward<>().\
    \ However, in that case, you usually declare the universal references with auto&&\
    \ as explained in the chapter about auto&&."
