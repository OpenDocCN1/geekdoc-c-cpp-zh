  md: "# Chapter 9\n\n# Perfect Forwarding\n\nThis chapter introduces move semantics\
    \ in generic code. In particular, we discuss *universal references* (also called\
    \ *forwarding references*) and (perfect) forwarding.\n\nThe following chapters\
    \ then discuss tricky details of universal references and perfect forwarding and\
    \ how to deal with return values that may or may not have move semantics in generic\
    \ code.\n\n# 9.1   Motivation for Perfect Forwarding\n\nWe have already learned\
    \ that move semantics is not automatically passed through. This has consequences\
    \ for generic code.\n\n# 9.1.1   What we Need to Perfectly Forward Arguments\n\
    \nTo forward an object that is passed with move semantics to a function, it not\
    \ only has to be bound to an rvalue reference; you have to use `std::move()` again\
    \ to forward its move semantics to another function.\n\nFor example, remember\
    \ the overload resolution rules for the main cases of functions overloaded by\
    \ reference:\n\n```\nclass X {\n    ...\n};\n\n// forward declarations:\nvoid\
    \ foo(const X&);          // for constant values (read-only access)\nvoid foo(X&);\
    \                // for variable values (out parameters)\nvoid foo(X&&);     \
    \          // for values that are no longer used (move semantics)\n```\n\nWe have\
    \ the following rules when calling these functions:\n\n```\nX v;\nconst X c;\n\
    foo(v);                    // calls foo(X&)\n```"
