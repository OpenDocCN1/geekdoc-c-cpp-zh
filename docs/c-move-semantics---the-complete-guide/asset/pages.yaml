- pgno: 104
  md: 'Instead, the following overloads would be better:


    ```

    namespace std {

    template<typename charT, ...>

    class basic_string {

    public:

    ...

    constexpr const charT& operator[](size_type pos) const&;

    constexpr charT& operator[](size_type pos) &;

    constexpr charT operator[](size_type pos) &&;

    constexpr const charT& at(size_type n) const&;

    constexpr charT& at(size_type n) &;

    constexpr charT at(size_type n) &&;


    constexpr const charT& front() const&;

    constexpr charT& front() &;

    constexpr charT front() &&;

    constexpr const charT& back() const&;

    constexpr charT& back() &;

    constexpr charT back() &&;

    ...

    };

    }

    ```


    Again, a corresponding change in the C++ standard might be a problem because of
    backward compatibility. However, you could and should provide these overloads
    for your types. In that case, do not forget that the implementations for rvalue
    references should move out expensive members.


    # 5.4 Summary


    +   - You can overload member functions on different reference qualifiers.

    +   - Overload getters for expensive members with reference qualifiers to make
    them both safe and fast.

    +   - It can make sense to mark objects with std::move() even when calling member
    functions.

    +   - Use reference qualifiers in assignment operators.'
