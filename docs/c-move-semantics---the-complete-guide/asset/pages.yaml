- pgno: 62
  md: "# Dealing with Move Assignments of Objects to Themselves\n\nYou might wonder\
    \ whether you should check for assignments of an object to itself when implementing\
    \ the move assignment operator. For example, a self move might happen as follows:\n\
    \n```\nCustomer c{\"GNU's Not Unix\"};\n c = std::move(c);                   \
    \  // move assigns c to itself\n```\n\nThis looks easy to avoid but we might use\
    \ references and pointers, and in that case, it is not necessarily that obvious\
    \ that two objects are the same. Consider the following code as a still quite\
    \ simple example:\n\n```\nstd::vector<Customer> coll;\n coll.emplace_back(\"GNU's\
    \ Not Unix\");   // coll has 1 element\n coll[0] = std::move(coll.back());   \
    \    // move assigns the only element to itself\n```\n\nAs written, all types\
    \ in the C++ standard library receive a valid but unspecified state when objects\
    \ are moved to themselves. This means that by default, you might lose the values\
    \ of your members and you might even have a more severe problem if your type does\
    \ not work properly with members that have arbitrary values. In fact, the resulting\
    \ state might be a problem in the following situations:\n\n+   - Some values of\
    \ a moved-from member are a problem\n+   - The values of members depend on each\
    \ other\n\nThe traditional/naive way to protect against self-assignments is to\
    \ check whether both operands are identical (have the same address). You can also\
    \ do this when implementing the move assignment operator:\n\n```\nCustomer& operator=\
    \ (Customer&& cust) {  // noexcept declaration missing\n    std::cout << \"MOVEASSIGN\
    \ \" << cust.name << '\\n';\n    if (this != &cust) {                  // move\
    \ assignment to myself?\n        name = std::move(cust.name);\n        values\
    \ = std::move(cust.values);\n    }\n    return *this;\n}\n```\n\nHaving a check\
    \ like this is pretty cheap and would have the benefit that the object keeps its\
    \ value on a self-move-assignment. However, note that in recursive data structures,\
    \ it can also be a problem if you (move) assign a child object to a parent object.\
    \ If we delete the old value of the parent (which owns the child) first before\
    \ we assign the new value, you might then assign a deleted object. In this case,\
    \ the objects are not identical, which means that comparing their addresses does\
    \ not help.\n\nIn addition, consider the following from style guides:\n\n+   -\
    \ In his book Effective C++ Scott Meyers says that self-assignments are usually\
    \ not a problem when resource management is encapsulated properly by helper classes\
    \ (but we did not have move semantics at that time). Furthermore, he points out\
    \ that otherwise, you also have to ensure that the operator is exception-safe.\n\
    +   - The C++ Core Guidelines categorize this problem as a “one-in-a-million problem”\
    \ that does not appear to be relevant in practice.²\n\nIt seems that in most cases,\
    \ you can ignore self-move-assignments, which usually means that in your types,\
    \ you give the same guarantee as the C++ standard library: after move assigning\
    \ an object to itself, the object is in a valid but unspecified state.\n\n2 See\
    \ http://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#Rc-move-self."
  merge: -1
  img_proc: true
- pgno: 63
  md: "# 3.2.5 Using the Special Copy/Move Member Functions\n\nLet us test the class\
    \ Customer with a small program:\n\nbasics/customerimpl.cpp\n\n```\n#include \"\
    customerimpl.hpp\"\n#include <iostream>\n#include <string>\n#include <vector>\n\
    #include <algorithm>\n\nint main()\n{\n    std::vector<Customer> coll;\n    for\
    \ (int i=0; i<12; ++i) {\n        coll.push_back(Customer{\"TestCustomer \" +\
    \ std::to_string(i-5)});\n    }\n\n    std::cout << \"--- sort():\\n\";\n    std::sort(coll.begin(),\
    \ coll.end(),\n              [] (const Customer& c1, const Customer& c2) {\n \
    \                 return c1.getName() < c2.getName();\n              });\n}\n\
    ```\n\n# Initialization\n\nThe first part is the initialization of the vector\
    \ with 12 customers:\n\n```\nstd::vector<Customer> coll;\nfor (int i=0; i<12;\
    \ ++i) {\n    coll.push_back(Customer{\"TestCustomer \" + std::to_string(i-5)});\n\
    }\n```\n\nThis initialization might have the following output:\n\n```\nMOVE TestCustomer\
    \ -5\nMOVE TestCustomer -4\nCOPY TestCustomer -5\nMOVE TestCustomer -3\nCOPY TestCustomer\
    \ -5\nCOPY TestCustomer -4\nMOVE TestCustomer -2\nMOVE TestCustomer -1\nCOPY TestCustomer\
    \ -5\nCOPY TestCustomer -4\nCOPY TestCustomer -3\nCOPY TestCustomer -2\n```"
