- pgno: 145
  md: 'For example:


    ```

    class X {

    };


    X v;

    const X c;

    ```


    ```

    f(v);      // passes a modifiable lvalue

    f(c);      // passes a non-modifiable lvalue

    f(X());    // passes a prvalue (old syntax of creating a temporary)

    f(X{});    // passes a prvalue (new syntax of creating a temporary)

    f(std::move(v));  // passes an xvalue

    ```


    Roughly speaking, as a rule of thumb:


    +   - All names used as expressions are lvalues.

    +   - All string literals used as expression are lvalues.

    +   - All non-string literals (4.2, true, or nullptr) are prvalues.

    +   - All temporaries without a name (especially objects returned by value) are
    prvalues.

    +   - All objects marked with std::move() and their value members are xvalues.


    It is worth emphasizing that strictly speaking, glvalues, prvalues, and xvalues
    are terms for expressions and not for values (which means that these terms are
    misnomers). For example, a variable in itself is not an lvalue; only an expression
    denoting the variable is an lvalue:


    ```

    int x = 3;      // here, x is a variable, not an lvalue

    int y = x;      // here, x is an lvalue

    ```


    In the first statement, 3 is a prvalue that initializes the variable (not the
    lvalue) x. In the second statement, x is an lvalue (its evaluation designates
    an object containing the value 3). The lvalue x is used as an rvalue, which is
    what initializes the variable y.


    # 8.1.3 Value Categories Since C++17


    C++17 has the same value categories but clarified the semantic meaning of value
    categories as described in Figure 8.2.


    The key approach for explaining value categories now is that in general, we have
    two major kinds of expressions:


    +   - glvalues: expressions for locations of long-living objects or functions

    +   - prvalues: expressions for short-living values for initializations


    An xvalue is then considered a special location, representing a (long-living)
    object whose resources/values are no longer needed.'
