  md: "Using std::move() when we call getName() will improve the performance of this\
    \ program. Instead of returning a reference to a const std::string, which we can\
    \ only copy, the return value is the moved name of p returned as a non-const string\
    \ so that push_back() can use move semantics to move it into coll.\n\nAs usual,\
    \ after this call, p is in a valid but unspecified state.\n\nFor an example where\
    \ this feature is used in the C++ standard library, see class std::optional<>.\n\
    \n# 5.2 Overloading on Qualifiers\n\nSince C++98, we can overload member functions\
    \ for implementing a const and a non-const version. For example:\n\n```\nclass\
    \ C {\npublic:\n    void foo(); // foo() for non-const objects\n    void foo()\
    \ const; // foo() for const objects\n};\n```\n\nThe qualifiers after the parenthesis\
    \ allow us to qualify the one object that is not passed to a parameter: the object\
    \ we call this member function for.\n\nNow, with move semantics, we have new ways\
    \ to overload functions with qualifiers because we have different reference qualifiers.\
    \ Consider the following program:\n\n```\n#include <iostream>\n\nclass C {\npublic:\n\
    \    void foo() const& {\n        std::cout << \"foo() const&\\n\";\n    }\n \
    \   void foo() && {\n        std::cout << \"foo() &&\\n\";\n    }\n    void foo()\
    \ & {\n        std::cout << \"foo() &\\n\";\n    }\n    void foo() const&& {\n\
    \        std::cout << \"foo() const&&\\n\";\n    }\n};\n```"
