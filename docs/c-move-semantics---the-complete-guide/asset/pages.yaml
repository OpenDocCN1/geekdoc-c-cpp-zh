- pgno: 110
  md: "# Restricted Invariants\n\nIt might also be useful not to give the full guarantee\
    \ of the C++ standard library to moved-from states. That is, you might intentionally\
    \ restrict the possible operations for moved-from objects. For example, when a\
    \ valid state of an object always needs resources such as memory, having only\
    \ a partially supported state might be better to make move operations cheaper.\n\
    \nWe have such a case in the C++ standard library: some implementations always\
    \ need memory for all states of node-based containers (so that even the default\
    \ constructor has to allocate memory). For these containers, it might have been\
    \ better to restrict what we can do with moved-from objects instead of guaranteeing\
    \ that moved-from objects are always in a “valid” state. However, we decided to\
    \ give the full guarantee.\n\nIdeally, a moved-from state that does not support\
    \ all operations should be detectable. The objects should know this state and\
    \ provide a member function to check for this state. Moved-from objects might\
    \ also refuse to execute operations not supported in this state. However, corresponding\
    \ checks might cost performance in the general case.\n\nIn the C++ standard library,\
    \ some types provide APIs to check whether objects are in a moved-from state.\
    \ For example, std::futures have a member function valid() that returns false\
    \ for moved-from objects. But the interfaces to check for moved-from states vary.\n\
    \nPretty often the moved-from state is the default constructed state, which means\
    \ that the moved-from state is part of the invariants anyway. In any case, make\
    \ sure users of your types know about what is well-defined and what is not.\n\n\
    # 6.2 Destructible and Assignable\n\nLet us discuss how to ensure that moved-from\
    \ objects fulfill the basic requirements for supporting assignment and destruction.\n\
    \n# 6.2.1 Assignable and Destructible Moved-From Objects\n\nIn most of the classes,\
    \ the generated special move member functions bring moved-from objects into a\
    \ state where the assignment operator and destructor work just fine. However,\
    \ provided each moved-from member is assignable and destructible, both an assignment\
    \ and the destruction of the moved-from object as a whole should work well:\n\n\
    +   - The assignment will overwrite the unspecified state of the member by assigning\
    \ the state from the corresponding source member.\n+   - The destructor will destroy\
    \ the member (that has the unspecified state).\n\nBecause we can and should usually\
    \ expect for the members that moved-from objects are in a valid but unspecified\
    \ state, generated move operations usually just work and create the right state.\n\
    \nFor example, consider the following class:\n\n```\nclass Customer {\nprivate:\n\
    \    std::string name;\n    std::vector<int> values;\n    ...\n};\n```"
