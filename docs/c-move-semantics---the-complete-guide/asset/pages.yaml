  md: "So far, the class does not support move semantics because we have a user-declared\
    \ destructor. You also cannot copy `Tasks` objects because copying `std::threads`\
    \ is disabled. However, you can start multiple tasks and wait for their end:\n\
    \n```\nbasics/tasks.cpp\n\n```cpp\n#include \"tasks.hpp\"\n#include <iostream>\n\
    #include <chrono>\n\nint main()\n{\n    Tasks ts;\n    ts.start([]{\n        \
    \    std::this_thread::sleep_for(std::chrono::seconds{2});\n            std::cout\
    \ << \"\\nt1 done\" << std::endl;\n        });\n    ts.start([]{\n           \
    \ std::cout << \"\\nt2 done\" << std::endl;\n        });\n}\n```\n\nNow consider\
    \ enabling move semantics by generating the default implementation of the move\
    \ operations (see `basics/taskshbug.cpp`):\n\n```\n```cpp\nclass Tasks {\nprivate:\n\
    \    std::array<std::thread,10> threads;  // array of threads for up to 10 tasks\n\
