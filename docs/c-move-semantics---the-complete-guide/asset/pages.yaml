- pgno: 155
  md: "Compare this with the *former* implementation of this function not using additional\
    \ parentheses. Here, `decltype` of `(str)` yields `std::string&` because `str`\
    \ is an lvalue of type `std::string`.\n\nThe fact that for decltype, it makes\
    \ a difference when we put additional parentheses around a passed name, will also\
    \ have significant consequences when we later discuss `decltype(auto)`.\n\n# Check\
    \ for a Value Category Inside Code\n\nIn general, you can now check for a specific\
    \ value category inside code as follows:\n\n+   - `!std::is_lvalue_reference_v<decltype((expr))>`\
    \  \n+     checks whether *expr* is a **prvalue**.\n+   - `std::is_lvalue_reference_v<decltype((expr))>`\
    \  \n+     checks whether *expr* is an **lvalue**.\n+   - `std::is_rvalue_reference_v<decltype((expr))>`\
    \  \n+     checks whether *expr* is an **xvalue**.\n+   - `!std::is_lvalue_reference_v<decltype((expr))>`\
    \  \n+     checks whether *expr* is an **rvalue**.\n\nNote again the additional\
    \ parentheses used here to ensure that we use the value-category checking form\
    \ of `decltype` even if we only pass a name as *expr*.\n\nBefore C++20, you have\
    \ to skip the suffix `_v` and append `::value` instead.\n\n# 8.7  Summary\n\n\
    +   - Any expression in a C++ program belongs to exactly one of these primary\
    \ value categories:\n+     - **lvalue** (roughly, for a named object or a string\
    \ literal)\n+     - **prvalue** (roughly, for an unnamed temporary object)\n+\
    \     - **xvalue** (roughly, for an object marked with `std::move()`)\n+   - Whether\
    \ a call or operation in C++ is valid depends on both the type and the value category.\n\
    +   - Rvalue references of types can only bind to rvalues (prvalues or xvalues).\n\
    +   - Implicit operations might change the value category of a passed argument.\n\
    +   - Passing an rvalue to an rvalue reference binds it to an lvalue.\n+   - Move\
    \ semantics is not passed through.\n+   - Functions and references to functions\
    \ are always lvalues.\n+   - For rvalues (temporary objects or objects marked\
    \ with `std::move()`), plain value members have move semantics but reference or\
    \ static members have not.\n+   - `decltype` can either check for the declared\
    \ type of a passed name or for the type and the value category of a passed expression."
