- pgno: 185
  md: "```\n```cpp\ninsert(coll, s);  // ERROR: no matching function call\n```\n```\n\
    \nThe problem is that both parameters can be used to deduce parameter T but the\
    \ deduced types are not the same:\n\n+   - Using the parameter `coll`, T it is\
    \ deduced as `std::string`.\n+   - However, according to the special rule for\
    \ universal references, parameter `elem` forces to deduce T as `std::string&`.\n\
    \nTherefore, the compiler raises an ambiguity error.\n\nThere are two ways to\
    \ solve this problem:\n\n+   - You can use the type trait `std::remove_reference<>`:\n\
    +   \n+     ```cpp\n+     template<typename T>\n+     void insert(std::vector<std::remove_reference_t<T>>&\
    \ vec, T&& elem)\n+     {\n+         vec.push_back(std::forward<T>(elem));\n+\
    \     }\n+   \n+     std::vector<std::string> coll;\n+     std::string s;\n+ \
    \    ...\n+     insert(coll, s);  // OK, with T deduced as std::string& vec now\
    \ binds to coll\n+     ```\n+   \n+   - You can use two template parameters instead:\n\
    +   \n+     ```cpp\n+     template<typename T1, typename T2>\n+     void insert(std::vector<T1>&\
    \ vec, T2&& elem)\n+     {\n+         vec.push_back(std::forward<T2>(elem));\n\
    +     }\n+     ```\n+   \n+     or just:\n+   \n+     ```cpp\n+     template<typename\
    \ Coll, typename T>\n+     void insert(Coll&& coll, T&& elem)\n+     {\n+    \
    \     coll.push_back(std::forward<T>(elem));\n+     }\n+     ```\n\n# 10.3.3 \
    \ Pure RValue References of Generic Types\n\nWith the **special rule for deducing\
    \ template parameters of universal references** (deducing the type as an lvalue\
    \ reference when lvalues are passed), we can constrain generic reference parameters\
    \ to only bind to rvalues:\n\n```\n```cpp\ntemplate<typename T>\nrequires (!std::is_lvalue_reference_v<T>)\
    \  // bind to rvalues only\n```\n```\n\n² Thanks to Herb Sutter for coming up\
    \ with this topic."
