  md: "# # Chapter 4: How to Benefit From Move Semantics\n\nHowever, without declaring\
    \ the destructor, move semantics works for both Polygon members, name and points.\
    \ Consider the following program:\n\n```\n```cpp\n#include \"geoobj.hpp\"\n#include\
    \ \"polygon.hpp\"\n\nint main()\n{\n\tPolygon p0{\"Poly1\", {Coord{1,1}, Coord{1,9},\
    \ Coord{9,9}, Coord{9,1}}};\n\tPolygon p1{p0}; // copy\n\tPolygon p2{std::move(p0)};\
    \ // move\n\n\tp0.draw();\n\tp1.draw();\n\tp2.draw();\n}\n```\n```\n\nThis program\
    \ has the following output:\n\npoly ' ' over\npolygon 'Poly1' over (1,1) (1,9)\
    \ (9,9) (9,1)\npolygon 'Poly1' over (1,1) (1,9) (9,9) (9,1)\n\nFor both members,\
    \ name and points, the values were moved from p0 to p2.\n\nNote that if you have\
    \ to implement the move constructor in class Polygon, you need special care to\
    \ provide the right noexcept condition.\n\n# ## 4.5 Summary\n\n+   - Avoid objects\
    \ with names.\n+   - Avoid unnecessary std::move(). Especially do not use it when\
    \ returning a local object.\n+   - Constructors that initialize members from parameters,\
    \ for which move operations are cheap, should take the argument by value and move\
    \ it to the member.\n+   - Constructors that initialize members from parameters,\
    \ for which move operations are a significant amount of time, should be overloaded\
    \ for move semantics for best performance.\n+   - In general, creating and initializing\
    \ new values from parameters, for which move operations are cheap, should take\
    \ the arguments by value and move. However, do not take by value and move to update/modify\
    \ existing values.\n+   - Do not declare a virtual destructor in derived classes\
    \ (unless you have to implement it)."
