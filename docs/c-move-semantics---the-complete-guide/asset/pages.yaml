    # 9.4 Overload Resolution with Universal References


    We have already discussed the formal rules when binding objects to ordinary references.
    Now, after introducing universal references, we have to extend these rules.


    ```

    class X {

    ...

    };

    X v;

    const X c{...};

    ```


    Table Rules for binding all references lists the formal rules for binding all
    kinds of references to passed arguments if we provide all possible overloads of
    a function f():


    ```

    void f(const X&); // read-only access

    void f(X&); // OUT parameter (usually long-living object)

    void f(X&&); // can steal value (object usually about to die)

    void f(const X&&); // contradicting semantic meaning

    template<typename T>

    void f(T&&); // to use perfect forwarding

    ```


    | Call | f(X&) | f(const X&) | f(X&&) | f(const X&&) | f(T&&) |

    |------|-------|-------------|--------|--------------|---------|

    | f(v) | 1 | 3 | no | no | 2 |

    | f(c) | no | 1 | no | no | 2 |

    | f(X{}) | no | 4 | 1 | 3 | 2 |

    | f(move(v)) | no | 4 | 1 | 3 | 2 |

    | f(move(c)) | no | 3 | no | 1 | 2 |


    Table 9.1. Rules for binding all references


    Again, the numbers list the priority for overload resolution (the smallest numbers
    have the highest priority) so that you can see which function is called when multiple
    overloads are provided.'
