    # 10.5 Summary


    +   - You can use universal references to bind to all const and non-const objects
    without losing the information about the constness of the object.

    +   - You can use universal references to implement special handling for passed
    arguments with move semantics even without using std::forward<>().

    +   - To have a universal reference of a specific type, you need concepts/requirements
    (since C++20) or some template tricks (up to C++17).

    +   - Only rvalue references of function template parameters are universal references.
    Rvalue references of class template parameters, members of template parameters,
    and full specializations are ordinary rvalue references, you can only bind to
    rvalues.

    +   - When specifying the types of universal references explicitly, they act no
    longer as universal references. Use Type& to be able to pass lvalues then.

    +   - The C++ standards committee introduced forwarding reference as a “better”
    term for universal reference. Unfortunately, the term forwarding reference restricts
    the purpose of universal references to a common specific use case and creates
    the unnecessary confusion of having two terms for the same thing. Therefore, use
    universal/forwarding reference to avoid even more confusion.'
