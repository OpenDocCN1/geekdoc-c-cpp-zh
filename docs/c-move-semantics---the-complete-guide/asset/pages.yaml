  md: "# Chapter 12\n\n# Perfect Returning with decltype(auto)\n\nAfter discussing\
    \ perfect forwarding a parameter and perfectly passing through a returned value,\
    \ we now have to talk about returning values perfectly. This chapter introduces\
    \ the new placeholder type decltype(auto). We will also see surprising consequences\
    \ such as the strong recommendation not to use unnecessary parentheses in return\
    \ statements.\n\n# 12.1 Perfect Returning\n\nIn generic code, we often compute\
    \ a value that we then return to the caller. The question is, how do we perfectly\
    \ return the value but still keep whatever type and value category it has? In\
    \ other words: how should we declare the return type of the following function:\n\
