    \ any object of any type and value category and still preserving its value category\
    \ and the information about whether it is const. This also applies to universal\
    \ references declared with auto&&.\n\n# 11.3.1 Universal References and the Range-Based\
    \ for Loop\n\nNon-forwarding universal references declared with auto&& play an\
    \ important role when using the range-based for loop.\n\n# Specification of the\
    \ Range-Based for Loop\n\nIn the C++ standard, the range-based for loop is specified\
    \ as a shortcut for iterating over the elements of a range with an ordinary for\
    \ loop.\n\nA call such as:\n\n```\nstd::vector<std::string> coll;\n...\nfor (const\
