    \ instead of creating a std::string and moving its value to the member.\n\n# 4.3.4\
    \ Compare the Different Approaches\n\nWith the introduction of new ways of initializing\
    \ members, the obvious question is, which technique should we use when? And also:\
    \ which technique should we teach?\n\nIn general, there should be a good reason\
    \ not to use the simple approach with const&. This reason is usually performance.\
    \ Therefore, let us measure how long it takes to initialize Persons with three\
    \ kinds of arguments: passing string literals, passing existing strings, and passing\
    \ strings marked with std::move():\n\n```\nstd::string fname = \"a first name\"\
    ;\nstd::string lname = \"a last name\";\n\n// measure how long this takes:\nPerson\
    \ p1{\"a firstname\", \"a lastname\"};\nPerson p2(fname, lname);\nPerson p3(std::move(fname),\
    \ std::move(lname));\n```\n\nHowever, to avoid the small string optimization (SSO),\
    \ which would mean that the strings do not allocate any memory at all, we should\
    \ use strings of significant length. So, here is a full function to measure the\
    \ different approaches:\n\nbasics/initmeasure.hpp\n\n```\n#include <chrono>\n\n\
    // measure num initializations of whatever is currently defined as Person:\nstd::chrono::nanoseconds\
    \ measure(int num)\n{\n    std::chrono::nanoseconds totalDur{0};\n    for (int\
    \ i = 0; i < num; ++i) {\n        std::string fname = \"a firstname a bit too\
    \ long for SSO\";\n        std::string lname = \"a lastname a bit too long for\
    \ SSO\";\n\n        // measure how long it takes to create 3 Persons in different\
    \ ways:\n        auto t0 = std::chrono::steady_clock::now();\n            Person\
    \ p1{\"a firstname too long for SSO\", \"a lastname too long for SSO\"};\n   \
    \         Person p2(fname, lname);\n            Person p3(std::move(fname), std::move(lname));\n\
    \        auto t1 = std::chrono::steady_clock::now();\n        totalDur += t1 -\
    \ t0;\n    }\n    return totalDur;\n}\n```"
