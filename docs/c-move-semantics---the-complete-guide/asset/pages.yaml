  md: '```

    int x;          // x is an lvalue when used in an expression


    x = 42;         // OK, because x is an lvalue and the type matches

    42 = x;         // ERROR: 42 is an rvalue and can be only on the right-hand side
    of an assignment

    ```


    However, these categories were important not only for assignments. They were used
    generally to specify whether and where an expression can be used. For example:


    ```

    int x;          // x is an lvalue when used in an expression


    int* p1 = &x;   // OK: & is fine for lvalues (object has a specified location)

    int* p2 = &42;  // ERROR: & is not allowed for rvalues (object has no specified
    location)

    ```


    However, things became more complicated with ANSI-C because an x declared as const
    int could not stand on the left-hand side of an assignment but could still be
    used in several other places where only an lvalue could be used:


    ```

    const int c = 42;    // Is c an lvalue or rvalue?


    c = 42;              // now an ERROR (so that c should no longer be an lvalue)

    const int* p1 = &c;  // still OK (so that c should still be an lvalue)

    ```


    The decision in C was that c declared as const int is still an lvalue because
    most of the operations for lvalues can still be called for const objects of a
    specific type. The only thing you could not do anymore was to have a const object
    on the left-hand side of an assignment.


    As a consequence, in ANSI-C, the meaning of the l changed to locator value. An
    lvalue is now an object that has a specified location in the program (so that
    you can take the address, for example). In the same way, an rvalue can now be
    considered just a readable value.


    C++98 adopted these definitions of value categories. However, with the introduction
    of move semantics, the question arose as to which value category an object marked
    with std::move() should have, because objects of a class marked with std::move()
    should follow the following rules:


    ```

    std::string s;

    ...

    std::move(s) = "hello";   // OK (behaves like an lvalue)

    auto ps = &std::move(s);   // ERROR (behaves like an rvalue)

    ```


    However, note that fundamental data types (FDTs) behave as follows:


    ```

    int i;

    ...

    std::move(i) = 42;        // ERROR

    auto pi = &std::move(i);  // ERROR

    ```


    With the exception of fundamental data types, an object marked with std::move()
    should still behave like an lvalue by allowing you to modify its value. On the
    other hand, there are restrictions such as that you should not be able to take
    the address.


    A new category xvalue ("eXpiring value") was therefore introduced to specify the
    rules for objects explicitly marked as I no longer need the value here (mainly
    objects marked with std::move()). However, most of the rules for former rvalues
    also apply to xvalues. Therefore, the former primary value category rvalue became
    a composite value category that now represents both new primary value categories
    prvalue (for everything that was an rvalue before) and xvalue. See http://wg21.link/n3055
    for the paper proposing these changes.'
