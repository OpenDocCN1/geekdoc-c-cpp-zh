- pgno: 176
  md: "# 10.2 Universal or Ordinary Rvalue Reference?\n\nHere, the type trait std::decay<>\
    \ is used to remove both referenceness and constness from type T (the type trait\
    \ std::remove_cvref<> is only provided since C++20).\n\nIn a similar way, we can\
    \ constrain generic code to let universal references bind to rvalues only. However,\
    \ none of this would be necessary if we had a specific syntax for universal references.\
    \ For example:\n\n```\nvoid processString(std::string&& arg); // assume && declares\
    \ a universal reference\n```\n\nWe do not have this specific syntax, however,\
    \ and now we have existing code with both applications of &&.\n\n# 10.2 Universal\
    \ or Ordinary Rvalue Reference?\n\nThe fact that we use the same syntax for ordinary\
    \ rvalue references and universal/forwarding references introduces some interesting\
    \ corner cases for the question of whether an object is an ordinary rvalue reference\
    \ or a universal reference.\n\n\n\nAn rvalue reference to a member type of a template\
    \ parameter is not a universal reference.\n\n```\ntemplate<typename T>\nvoid foo(typename\
    \ T::value_type&& arg); // not a universal reference\n```\n\nHere is a complete\
    \ example:\n\n```\n#include <iostream>\n#include <string>\n#include <vector>\n\
    \ntemplate<typename T>\nvoid insert(T coll, typename T::value_type&& arg)\n{\n\
    \tcoll.push_back(arg);\n}\n\nint main()\n{\n\tstd::vector<std::string> coll;\n\
    \t...\n\tinsert(coll, std::string{\"prvalue\"}); // OK\n\t...\n\tstd::string str{\"\
    lvalue\"};\n\tinsert(coll, str); // ERROR: ::value_type&& is not a universal reference\n\
    \tinsert(coll, std::move(str)); // OK\n\t...\n}\n```"
