    # Strong Exception Safety Guarantee


    The reason that vector reallocation does not use move semantics is the strong
    exception handling guarantee we give for push_back(): When an exception is thrown
    in the middle of the reallocation of the vector the C++ standard library guarantees
    to roll back the vector to its previous state. That is, push_back() gives a kind
    of a transactional guarantee: either it succeeds or it has no effect.


    The C++ standard was able to give this guarantee in C++98 and C++03 because there
    C++ could only copy the elements. If something goes wrong while copying the elements,
    the source objects are still available. Internal code that handles the exception
    simply destroys the copies created so far and release the new'
