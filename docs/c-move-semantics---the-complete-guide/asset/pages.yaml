- pgno: 183
  md: "+   - std::forward<>() only adds rvalue referenceness to the passed type parameter:\n\
    +     `static_cast<T&&>(t)`\n\nHere, the reference collapsing rules apply again:\n\
    \n+   - If type T is an lvalue reference, T&& is still an lvalue reference (&\
    \ & has no effect). Therefore, we cast arg to an lvalue reference, which means\
    \ that arg has no move semantics.\n+   - However, if T is an rvalue reference\
    \ (or not a reference at all), T&& is (still) an rvalue reference. Therefore,\
    \ we cast arg to an rvalue reference and that way we change the value category\
    \ to an xvalue, which is the effect of std::move().\n\nIn total, therefore, we\
    \ get:\n\n```\ntemplate<typename T>\nvoid f(T&& arg)    // arg is a universal/forwarding\
    \ reference\n{\n    g(std::forward<T>(arg));  // perfectly forward (move() only\
    \ for passed rvalues)\n}\n```\n\n```\nMyType v;\nconst MyType c;\n\nf(v);    \
    \        // T and arg are MyType&, forward() has no effect in this case\nf(c);\
    \            // T and arg are const MyType&, forward() has no effect in this case\n\
    f(MyType{});     // T is MyType, arg is MyType&&, forward() is equivalent to move()\n\
    f(std::move(v)); // T is MyType, arg is MyType&&, forward() is equivalent to move()\n\
    ```\n\nNote that string literals are lvalues so that we deduce T and arg for them\
    \ as follows:\n\n```\nf(\"hi\");          // lvalue passed, so T and arg have\
    \ type const char(&) [3]\nf(std::move(\"hi\")); // xvalue passed, so T is deduced\
    \ as const char [3]\n                     // and arg has type const char(&&) [3]\n\
    ```\n\nRemember also that references to functions are always lvalues. Therefore,\
    \ T is always deduced as an lvalue reference if we pass a reference to a function\
    \ to a universal reference:\n\n```\nvoid func(int) {\n}\n```\n\n```\nf(func);\
    \          // lvalue passed to f(), so T and arg have type void(&) (int)\nf(std::move(func));\
    \ // lvalue passed to f(), so T and arg have type void(&) (int)\n```\n\n# 10.3.1\
    \ Explicit Specification of Types for Universal References\n\nWhen a universal/forwarding\
    \ reference is declared, you can also explicitly specify the type of the template\
    \ parameter instead of deducing it. However, remember that your parameter is declared\
    \ as T&&. Therefore, you have the following behavior:\n\n```\ntemplate<typename\
    \ T>\nvoid f(T&& arg)    // arg is universal/forwarding reference\n{\n```"
