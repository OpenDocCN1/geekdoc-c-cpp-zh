  md: "```\n```cpp\nint main()\n{\n    C x;\n    x.foo(); // calls foo() &\n    C{}.foo();\
    \ // calls foo() &&\n    std::move(x).foo(); // calls foo() &&\n    \n    const\
    \ C cx;\n    cx.foo(); // calls foo() const&\n    std::move(cx).foo(); // calls\
    \ foo() const&&\n}\n```\n```\n\nThis program demonstrates all reference qualifiers\
    \ that are possible and when they are called. Usually, we have only two or three\
    \ of these overloads, such as using & and const& (and &) for getters.\n\nAlso\
    \ note that overloading for both reference and non-reference qualifiers is not\
    \ allowed:\n\n```\n```cpp\nclass C {\npublic:\n    void foo() &&;\n    void foo()\
    \ const; // ERROR: can't overload by both reference and value qualifiers\n};\n\
    ```\n```\n\n# ## 5.3 When to Use Reference Qualifiers\n\nReference qualifiers\
    \ allow us to implement functions differently when they are called for objects\
    \ of a specific value category. The goal is to provide a different implementation\
    \ when we call a member function for an object that no longer needs its value.\n\
    \nAlthough we do have this feature, it is not used as much as it could be. In\
    \ particular, we could (and should) use it to ensure that operations that modify\
    \ objects are not called for temporary objects that are about to die.\n\n# ##\
    \ 5.3.1 Reference Qualifiers for Assignment Operators\n\nOne example of better\
    \ use of reference qualifiers would mean modifying the implementation of assignment\
    \ operators. As proposed in http://wg21.link/n2819, it could be better to declare\
    \ the assignment operator with reference qualifiers wherever we can.\n\n> 2 Thanks\
    \ to Peter Sommerlad for pointing this out.\n\n> 3 The paper was formulated after\
    \ discussing even changing the behavior of the generated assignment operators\
    \ to have reference qualifiers. See http://wg21.link/cwg733."
