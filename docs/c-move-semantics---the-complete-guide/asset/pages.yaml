  md: "# 10.2.3 Rvalue References of Parameters in Full Specializations\n\nAn rvalue\
    \ reference to a parameter of a full specialization of a function template is\
    \ *not* a universal reference. For example:\n\n```\ntemplate<typename T>     \
    \     // primary template\nvoid foo(T&& arg);           // - arg is a universal\
    \ reference\n...\ntemplate<>                   // full specialization (for rvalues\
    \ only)\nvoid foo(std::string&& arg); // - arg is not a universal reference\n\
    ```\n\nFor lvalues of type std::string still the primary template will be called.\
    \ To specialize all cases of the primary template for std::strings you have to\
    \ provide a all possible full specialization (including a version for const rvalues):\n\
    \n```\ntemplate<>                   // full specialization for const lvalues\n\
    void foo(const std::string& arg); // - arg is not a universal reference\n\ntemplate<>\
    \                   // full specialization for non-const lvalues\nvoid foo(std::string&\
    \ arg);    // - arg is not a universal reference\n\ntemplate<>               \
    \    // full specialization for non-const rvalues\nvoid foo(std::string&& arg);\
    \   // - arg is not a universal reference\n\ntemplate<>                   // full\
    \ specialization for const rvalues\nvoid foo(const std::string& arg); // - arg\
    \ is not a universal reference\n```\n\nIf you leave out any of the four full specializations,\
    \ the primary template might be called instead (e.g., if the version for const\
    \ rvalues is missing, the primary template will be called if you pass a const\
    \ string marked with std::move()).\n\nHere is a complete example:\n\ngeneric/universalspec.cpp\n\
    \n```\n#include <iostream>\n#include <string>\n#include <vector>\n\n// primary\
    \ template taking a universal reference:\ntemplate<typename Coll, typename T>\n\
    void insert(Coll& coll, T&& arg)\n{\n    std::cout << \"primary template for universal\
    \ reference of type T\\n\";\n    coll.push_back(arg);\n}\n\n// full specialization\
    \ for const lvalues of type std::string:\ntemplate<>\n```"
