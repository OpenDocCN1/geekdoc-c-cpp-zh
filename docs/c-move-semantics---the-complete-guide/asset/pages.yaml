- pgno: 196
  md: "# 11.3 auto&& as Non-Forwarding Reference\n\nThe reason we declare range as\
    \ a universal reference is that we want to be able to bind it to every range so\
    \ that we can use it twice (once to ask for its beginning, and once to ask for\
    \ its end) without creating a copy or losing the information about whether or\
    \ not the range is const.\n\nThe loop should work for:\n\n+   • A non-const lvalue:\n\
    +   std::vector<int> coll;\n+   ...\n+   for (int i : coll) {\n+    i *= 2;\n\
    +   }\n+   \n\n+   • A const lvalue:\n+   const std::vector<int> coll{0, 8, 15};\n\
    +   ...\n+   for (int i : coll) {\n+   ...\n+   }\n+   \n\n+   • A prvalue:\n\
    +   for (int i : std::vector<int>{0, 8, 15}) {\n+   ...\n+   }\n+   \n\nNote that\
    \ there is no other way to declare range for all these cases:\n\n+   • With auto,\
    \ we would create a copy of the range (which takes time and disables modification\
    \ of the elements).\n+   • With auto&, we would disable initialization of the\
    \ range with a temporary prvalue.\n+   • With const auto&, we would lose any non-constness\
    \ of the range we iterate over.\n\nHowever, note that there is a significant problem\
    \ with the range-based for loop the way it is specified now.\n\n```\nstd::vector<std::string>\
    \ createStrings();\n...\nfor (char c : createStrings().at(0)) { // fatal runtime\
    \ error\n...\n}\n\n```\n\nbecomes:\n\n```\nstd::vector<std::string> createStrings();\n\
    ...\nauto&& range = createStrings().at(0); // OOPS: universal reference to reference\n\
    auto pos = range.begin(); // return value of createStrings() destroyed here\n\
    auto end = range.end();\nfor ( ; pos != end; ++pos ) {\n char c = *pos;\n...\n\
    }\n\n```"
  merge: -1
  img_proc: true
- pgno: 197
  md: "All valid references extend the lifetime of the value they bind to. This also\
    \ applies to rvalue references. However, we do not bind to the return value of\
    \ createString() (that would work fine); we bind to a reference to the return\
    \ type of createStrings() returned by at(). This means that we extend the lifetime\
    \ of the reference but not of the return value of createString(). Therefore, the\
    \ loop iterates over strings that were already destroyed.\n\n# Using the Range-Based\
    \ for Loop\n\nA universal reference can make sense even when calling the range-based\
    \ for loop.\n\nTo modify the elements while iterating over them you have to use\
    \ a non-const reference. Consider a function template that assigns a passed value\
    \ to all elements of a passed collection:\n\n```\ntemplate<typename Coll, typename\
    \ T>\nvoid assign(Coll& coll, const T& value) {\n    for (auto& elem : coll) {\n\
    \        elem = value;\n    }\n}\n```\n\nIt looks like it usually works for all\
    \ container and element types (where assignments are supported):\n\n```\nstd::vector<int>\
    \ coll1{0, 8, 15};\n...\nassign(coll1, 42);    // OK\n```\n\n```\nstd::vector<std::string>\
    \ coll2{\"hello\", \"world\"};\n...\nassign(coll2, \"ok\");    // OK\n```\n\n\
    However, there is a case where it suddenly does not work:\n\n```\nstd::vector<bool>\
    \ collB{false, true, false};\n...\nassign(collB, true);    // ERROR: cannot bind\
    \ non-const lvalue reference to an rvalue\n```\n\nWhat happened? Well, let us\
    \ look at the code the range-based for loop expands to here:\n\n```\nstd::vector<bool>\
    \ coll{false, true, false};\n...\n{\n    auto&& range = coll;            // OK:\
    \ universal reference to reference\n    auto pos = range.begin();       // OK\n\
    \    auto end = range.end();         // OK\n    for ( ; pos != end; ++pos ) {\
    \   // OK\n        auto& elem = *pos;          // ERROR: cannot bind non-const\
    \ lvalue reference to an rvalue\n        elem = value;\n    }\n}\n```"
