- pgno: 75
  md: 'That is, when one of these special member functions is either implemented or
    defaulted or deleted, you should implement or default or delete all four other
    special member functions.


    However, you should be careful with this rule. I recommend that you take it more
    as a guideline to *carefully think* about all of these five special member functions
    when one of them is user-declared.


    As we saw, to enable copy semantics only you should `=default` the copying special
    member functions without declaring the special move member functions (deleting
    and defaulting the special move member functions would not work, implementing
    them makes the class unnecessarily complicated). This option is recommended in
    particular if the generated move semantics creates invalid states, as we discuss
    in the section about invalid moved-from states.


    When applying this rule of five, it also turned out that sometimes, programmers
    use it to add declarations for the new move operations without understanding what
    this means. Programmers were just declaring move operations with `=default` because
    copy operations were implemented and they wanted to follow the rule of five.


    Therefore, I usually teach the *Rule of Five or Three*:


    +   - If you declare the copy constructor, move constructor, copy assignment operator,
    move assignment operator, or destructor, *think very carefully* about how to deal
    with the other special member functions.

    +   - If you do not understand move semantics, think only about the copy constructor,
    copy assignment operator, and destructor if you are declaring one of them. If
    in doubt, disable move semantics by declaring the copying special member functions
    with `=default`.


    # 3.5 Summary


    +   - Move semantics is not passed through.

    +   - For every class, the move constructor and move assignment operator are automatically
    generated (unless there is no way to do so).

    +   - User-declaring a copy constructor, copy assignment operator, or destructor
    disables the automatic support of move semantics in a class. This does not impact
    the support in derived classes.

    +   - User-declaring a move constructor or move assignment operator disables the
    automatic support of copy semantics in a class. You get move-only types (unless
    these special move member functions are deleted).

    +   - Never `=delete` a special move member function.

    +   - Do not declare a destructor if there is no specific need. There is no general
    need in classes derived from a polymorphic base class.'
