    \ type and the value category of what we return.\n\nC++14 introduced a new placeholder\
    \ type for this purpose: decltype(auto).\n\n```\ntemplate<typename T>\ndecltype(auto)\
    \ callFoo(T&& arg)    // since C++14\n{\n    return foo(std::forward<T>(arg));\n\
    }\n```\n\nWith this declaration, callFoo() returns by value, if foo() returns\
    \ by value, and callFoo() returns by reference if foo() returns by reference.\
    \ In all cases, both the type and the value category are retained.\n\n# 12.2 decltype(auto)\n\
    \nJust like the other placeholder type auto, decltype(auto) is a placeholder type\
    \ that lets the compiler deduce the type at initialization time. However, in this\
    \ case, the type is deduced according to the rules of decltype:\n\n+   - If you\
    \ initialize it with or return a plain name, the return type is the type of the\
    \ object with that name.\n+   - If you initialize it with or return an expression,\
    \ the return type is the type and value category of the evaluated expression as\
    \ follows with the following encoding:\n+     - For a prvalue, it just yields\
    \ its value type: type\n+     - For an lvalue, it yields its type as an lvalue\
    \ reference: type&\n+     - For an xvalue, it yields its type as an rvalue reference:\
    \ type&&\n\nFor example:\n\n```\nstd::string s = \"hello\";\nstd::string& r =\
    \ s;\n```\n\n```\n// initialized with name:\ndecltype(auto) da1 = s;    // std::string\n\
    decltype(auto) da2(s);     // same\ndecltype(auto) da3{s};     // same\ndecltype(auto)\
