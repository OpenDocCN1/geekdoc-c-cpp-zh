- pgno: 57
  md: "The problem that can occur is that moved-from objects might no longer be valid:\
    \ invariants might be broken or the destructor of the object might even fail.\
    \ For example, objects of the Customer class in this chapter might suddenly have\
    \ an empty name even though we have assertions to avoid that. The chapter about\
    \ moved-from states will discuss this in detail.\n\n# 3.2 Implementing Special\
    \ Copy/Move Member Functions\n\nYou can implement the special move member functions\
    \ yourself. You do this in approximately the same way that a copy constructor\
    \ and an assignment operator are implemented. The only difference is that the\
    \ parameter is declared as a non-const rvalue reference and that inside the implementation,\
    \ you have to specify where to optimize the usual copying with something better.\n\
    \nLet us look at a class that has both special copy and special move member functions\
    \ implemented to print out when objects are copied and when they are moved:\n\n\
    ```\n#include <string>\n#include <vector>\n#include <iostream>\n#include <cassert>\n\
    \nclass Customer {\nprivate:\n    std::string name; // name of the customer\n\
    \    std::vector<int> values; // some values of the customer\npublic:\n    Customer(const\
    \ std::string& n)\n      : name{n} {\n        assert(!name.empty());\n    }\n\n\
    \    std::string getName() const {\n        return name;\n    }\n\n    void addValue(int\
    \ val) {\n        values.push_back(val);\n    }\n\n    friend std::ostream& operator<<(std::ostream&\
    \ strm, const Customer& cust) {\n        strm << '[' << cust.name << \": \";\n\
    \        for (int val : cust.values) {\n            strm << val << ' ';\n    \
    \    }\n        strm << ']';\n    }\n}\n```"
