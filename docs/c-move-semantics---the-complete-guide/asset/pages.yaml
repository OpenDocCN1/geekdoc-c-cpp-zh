  md: '# 3.3.1 Special Member Functions


    Let us first look briefly at the term *special member function*, because it is
    used in different ways. The C++ standard defines the following six operations
    as *special member functions*:


    +   - Default constructor

    +   - Copy constructor

    +   - Copy assignment operator

    +   - Move constructor (since C++11)

    +   - Move assignment operator (since C++11)

    +   - Destructor


    However, in many cases such as in *the rule of five*, we talk only about five
    these operations, because the default constructor is a little different to the
    other five (or three before C++11) operations. The other five operations are usually
    not declared and have more complex dependencies. So make sure you always know
    what is meant by *the* special member functions (I have tried to avoid this term
    so far).


    Figure 3.1 gives an overview of when special member functions are automatically
    generated depending on which (other) constructors and special member functions
    are declared:


    ![](img/c6f2c4fe3e0701d95a17354ad517147a_66_0.png)


    There are a few basic rules you can see in this table:


    +   - A default constructor is only declared automatically if no other constructor
    is user-declared.

    +   - The special copy member functions and the destructor disable move support.
    The automatic generation of special move member functions is disabled (unless
    the moving operations are also declared). However,


