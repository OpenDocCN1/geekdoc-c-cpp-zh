- pgno: 148
  md: 'This rule reflects that reference or static members are not really part of
    an object. If you no longer need the value of an object, this applies also to
    the plain data members of the object. However, the values of members that refer
    to somewhere else or are static might still be used by other objects.


    For example:


    ```

    std::pair<std::string, std::string&> foo(); // note: member second is reference


    std::vector<std::string> coll;

    ...

    coll.push_back(foo().first); // moves because first is an xvalue here

    coll.push_back(foo().second); // copies because second is an lvalue here

    ```


    You need std::move() to move the member second here:


    ```

    coll.push_back(std::move(foo().second)); // moves

    ```


    If you have an lvalue (an object with a name), you have two options to mark a
    member with std::move():


    +   - std::move(obj).member

    +   - std::move(obj.member)


    Because std::move() means “I no longer need this value here” it looks like you
    should mark the obj if you no longer need the value of the object and mark member
    if you no longer need the value of the member. However, the situation is a bit
    more complicated.


    # std::move() for Plain Data Members


    If the member is neither static nor a reference, by rule, std::move() always converts
    members to xvalues so that move semantics can be used.


    Consider we have declared the following:


    ```

    std::vector<std::string> coll;

    std::pair<std::string, std::string> sp;

    ```


    The following code moves first the member first and then the member second into
    coll:


    ```

    sp = ...;

    coll.push_back(std::move(sp.first)); // move string first into coll

    coll.push_back(std::move(sp.second)); // move string second into coll

    ```


    However, the following code has the same effect:


    ```

    sp = ...;

    coll.push_back(std::move(sp).first); // move string first into coll

    coll.push_back(std::move(sp).second); // move string second into coll

    ```


    It looks a bit strange that we still use obj after marking it with std::move(),
    but in this case we know which part of the object may be moved so that we can
    still use a different part. Therefore, I would prefer to mark the member with
    std::move() when I, for example, have to implement a move constructor.'
  merge: -1
  img_proc: true
- pgno: 149
  md: "# std::move() for Reference or static Members\n\nIf the members are references\
    \ or static, different rules apply.² A reference or static member of an rvalue\
    \ is still an lvalue. Again, this rule reflects that the value of such a member\
    \ is not really part of the object. Saying “I no longer need the value of the\
    \ object” should not imply “I no longer need the value (of a member) that is not\
    \ part of the object.”\n\nTherefore, it makes a difference how you use std::move()\
    \ if you have reference or static members:\n\n+   - Using `std::move()` for the\
    \ **object** has no effect:\n\n```\nstruct S {\n    static std::string statString;\
    \  // static member\n    std::string& refString;         // reference member\n\
    };\n\nS obj;\n...\ncoll.push_back(std::move(obj).statString);  // copies statString\n\
    coll.push_back(std::move(obj).refString);   // copies refString\n```\n\n+   -\
    \ Using `std::move()` for the **members** has the usual effect:\n\n```\nstruct\
    \ S {\n    static std::string statString;\n    std::string& refString;\n};\nS\
    \ obj;\n...\ncoll.push_back(std::move(obj.statString));  // moves statString\n\
    coll.push_back(std::move(obj.refString));   // moves refString\n```\n\nWhether\
    \ such a move is useful is a different question. Stealing the value of a static\
    \ member or referenced member means that you modify a value outside the object\
    \ you use. It might make sense, but it could also be surprising and dangerous.\
    \ Usually, a type S should better protect access to theses members.\n\nIn generic\
    \ code, you might not know whether members are static or references. Therefore,\
    \ using the approach to mark the object with std::move() is less dangerous, even\
    \ though it looks weird:\n\n```\ncoll.push_back(std::move(obj).mem1);   // move\
    \ value, copy reference/static\ncoll.push_back(std::move(obj).mem2);   // move\
    \ value, copy reference/static\n```\n\nIn the same way, std::forward<>(), which\
    \ we introduce later, can be used to perfectly forward members of objects. See\
    \ _basics/members.cpp_ for a complete example."
