  md: "Here, the function openToWrite() opens and returns an output file stream:\n\
    \n```\nstd::ofstream openToWrite(const std::string& name)\n{\n    std::ofstream\
    \ file(name);        // open a file to write to\n    ...\n    return file;   \
    \                  // return ownership (open file)\n}\n```\n\nWe use the return\
    \ value to initialize outFile and pass it to storeData():\n\n```\nauto outFile{openToWrite(\"\
    iostream.tmp\")};  // open file\nstoreData(std::move(outFile));              \
    \ // store data\n```\n\nBecause storeData() takes the argument by value, it takes\
    \ the ownership of the open file. Therefore, at the end of storeData(), the file\
    \ is closed:\n\n```\nvoid storeData(std::ofstream fstrm)  // takes ownership of\
    \ file (but this might change)\n{\n    ...\n}                                \
    \         // closes the file\n```\n\nHowever, storeData() might also take the\
    \ argument by reference, which means that it does not necessarily take the ownership.\
    \ In that case, you might want to double-check the state of the passed argument\
    \ outFile afterwards:\n\n```\n// better ensure that the file is closed:\nif (!outFile.is_closed())\
    \ {\n    outFile.close();\n}\n```\n\nCalling outFile.close() is usually enough\
    \ but would set the failbit of the file stream if it was already closed.\n\n#\
    \ 15.5.2 Using Temporary IOStreams\n\nSince C++11, the IOStreams library also\
    \ provides function overloads to take rvalue references, which allows us to take\
    \ temporary objects. For example:\n\n```\nstd::string s = \"hello, world\";\n\
    std::ofstream(\"fstream1.tmp\") << s << '\\n';          // OK since C++11\n```\n\
    \nYou can even write a string literal to a stream that way (this compiled before\
    \ C++11 but wrote the address of the string literals using operator<<(const void*)):\n\
    \n```\nstd::ofstream(\"fstream1.tmp\") << \"hello, world\\n\";   // correct since\
    \ C++11\n                                                       // (wrote address\
    \ before)\n```\n\nIn the same way, you can parse a given string using a temporary\
    \ string stream:\n\n```\nstd::string name, firstname, lastname;\n...\nname = \"\
    Tina Turner\";\nstd::istringstream{name} >> firstname >> lastname;    // OK since\
    \ C++11\n```"
