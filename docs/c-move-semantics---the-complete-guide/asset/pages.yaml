    Customer& operator= (const Customer& cust) {\n    std::cout << \"COPYASSIGN \"\
    \ << cust.name << '\\n';\n    name = cust.name;\n    values = cust.values;\n \
    \   return *this;\n}\n\n// move assignment (move all members):\nCustomer& operator=\
    \ (Customer&& cust) { // noexcept declaration missing\n    std::cout << \"MOVEASSIGN\
    \ \" << cust.name << '\\n';\n    name = std::move(cust.name);\n    values = std::move(cust.values);\n\
    \    return *this;\n}\n};\n```\n\nLet us look at the implementations of all special\
