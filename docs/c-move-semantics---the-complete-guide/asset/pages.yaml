- pgno: 32
  md: "# 1.1 Motivation for Move Semantics\n\n```\n```cpp\nstd::vector<std::string>\
    \ createAndInsert()\n{\n    std::vector<std::string> coll;\n    coll.reserve(3);\n\
    \    std::string s = \"data\";\n    coll.push_back(s);\n    coll.push_back(s+s);\n\
    \    coll.push_back(std::move(s));\n    return coll;\n}\n\nstd::vector<std::string>\
    \ v;\n...\nv = createAndInsert();\n```\n```\n\n![](img/c6f2c4fe3e0701d95a17354ad517147a_32_0.png)\n\
    \nNote the following two very important things to understand about move semantics:\n\
    \n+   - std::move(s) only marks s to be movable in this context. It does not move\
    \ anything. It only says, \"I no longer need this value here.\" It allows the\
    \ implementation of the call to benefit from the mark by performing some optimization\
    \ when copying the value, such as stealing the memory. Whether the value is moved\
    \ is something the caller does not know.\n+   - However, an optimization that\
    \ steals the value has to ensure that the source object is still in a valid state.\
    \ A moved-from object is neither partially nor fully destroyed. The C++ standard\
    \ library formulates this for its types as follows: after an operation called\
    \ for an object marked with std::move(), the object is in a valid but unspecified\
    \ state.\n\nThat is, after calling coll.push_back(std::move(s)); it is guaranteed\
    \ that s is still a valid string. You can do whatever you want as long as it is\
    \ valid for any string where you do not know the value. It is like using a string\
    \ parameter where you do not know which value was passed.\n\nNote that it is also\
    \ not guaranteed that the string either has its old value or is empty. The value\
    \ it has is up to the implementers of the (library) function. In general, implementers\
    \ can do with objects marked with std::move() whatever they like, provided they\
    \ leave the object in a valid state. There are good reasons for this guarantee,\
    \ which will be discussed later.\n\n• Again, at the end of createAndInsert() we\
    \ come to the return statement:\n\nreturn coll;\n\nIt is still up to the compiler\
    \ whether it generates code with the named return value optimization, which would\
    \ mean that coll just becomes the return value. However, if this optimization\
    \ is not used, the return statement is still cheap, because again we have a situation\
    \ where we create an object from a source that is in a valid but unspecified state."
  merge: -1
  img_proc: true
