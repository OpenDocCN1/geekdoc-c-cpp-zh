    location (MOVEASSIGN).


    Again, the output depends on the exact implementation of sort(), which is implementation-specific.


    # The Number of Copies We Saved


    The output of this program again demonstrates the benefit of move semantics. Before
    move semantics support, we would only have copies when inserting and sorting elements.
    However, even in this small program that has a container with 12 elements, move
    semantics converted 44 expensive element copies into cheap moves. For 10,000 customers
    we would save more than 150,000 copies. And note that each copy of a Customer
    means up to 2 memory allocations with the corresponding deallocations later on.


    Note again:


    +   - The implementation of std::sort() is implementation-specific, meaning that
    the number of saved copies might differ slightly.

    +   - The only copies performed are caused by the reallocation of the vector for
    the memory of the elements. They should also become moves, which will be discussed
    in the chapter about move semantics and noexcept.


