    \               // calls full specialization for lvalues\n    insert(coll, std::move(str));\
    \          // calls full specialization for rvalues\n\n    const std::string cstr{\"\
    const lvalue\"};\n    insert(coll, cstr);                    // calls full specialization\
    \ for const lvalues\n    insert(coll, std::move(cstr));         // calls full\
    \ specialization for const rvalues\n}\n```"
