- pgno: 242
  md: "Therefore, it is significantly cheaper to iterate over a collection of shared\
    \ pointers by reference:\n\n```\nstd::vector<std::shared_ptr<...>> coll;\n...\n\
    for (auto sp : coll) {      // expensive\n    ...\n}\n...\nfor (const auto& sp\
    \ : coll) { // cheap\n    ...\n}\n```\n\nWith regard to move semantics, it is\
    \ therefore better to move shared pointers instead of copying them. For example,\
    \ instead of implementing this:\n\n```\nstd::shared_ptr<int> lastPtr;        \
    \         // init shared pointer that does not own anything\nwhile (...) {\n \
    \   auto ptr{std::make_shared<int>(getValue())};  // init shared pointer that\
    \ owns new int\n    ...\n    lastPtr = ptr;                               // expensive\
    \ (note: ptr no longer used)\n}                                              //\
    \ ptr destroyed, lastPtr is the only owner\n```\n\nit would be better to implement\
    \ this:\n\n```\nstd::shared_ptr<int> lastPtr;                 // init shared pointer\
    \ that does not own anything\nwhile (...) {\n    auto ptr{std::make_shared<int>(getValue())};\
    \  // init shared pointer that owns new int\n    ...\n    lastPtr = std::move(ptr);\
    \                    // cheap\n}                                             \
    \ // ptr destroyed, lastPtr is the only owner\n```\n\nAs a consequence, objects\
    \ with shared pointer members lose the ownership of the resource these members\
    \ point to when the objects are moved. This is good for performance but it might\
    \ create invalid moved-from states. You should therefore double-check the state\
    \ of moved-from objects that have members of type std::shared_ptr<>.\n\n# 15.4.2\
    \ Move Semantics for std::unique_ptr<>\n\nThe class template std::unique_ptr<>\
    \ implements the concept of exclusive ownership. The type system ensures that\
    \ there can be only one owner of an object at any one time. The trick is to use\
    \ the type system to disable any attempt to copy a unique pointer. Because this\
    \ check is done at compile time this approach does not introduce any significant\
    \ performance overhead at runtime.\n\nYou can create a single unique pointer in\
    \ a source function and return it to the caller:\n\nlib/uniqueptr1.cpp\n\n```\n\
    #include <iostream>\n#include <string>\n#include <memory>\n```"
