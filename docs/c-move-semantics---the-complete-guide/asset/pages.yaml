- pgno: 64
  md: "```\nMOVE TestCustomer 0\nMOVE TestCustomer 1\nMOVE TestCustomer 2\nMOVE TestCustomer\
    \ 3\nCOPY TestCustomer -5\nCOPY TestCustomer -4\nCOPY TestCustomer -3\nCOPY TestCustomer\
    \ -2\nCOPY TestCustomer -1\nCOPY TestCustomer 0\nCOPY TestCustomer 1\nCOPY TestCustomer\
    \ 2\nMOVE TestCustomer 4\nMOVE TestCustomer 5\nMOVE TestCustomer 6\n```\n\nEach\
    \ time we insert a new object, a temporary object is created and moved into the\
    \ vector. Therefore, for each element, we have a MOVE.\n\nIn addition, we have\
    \ several copies marked with COPY. These copies are caused by the fact that from\
    \ time to time, a vector reallocates its internal memory (capacity) so that it\
    \ is big enough for all elements. In this case, the vector grows from having memory\
    \ for 1 to having memory for 2, 4, 8, and finally 16 elements. Therefore, we have\
    \ to copy first 1, then 2, then 4, and then 8 elements already in the vector.\
    \ Calling coll.reserve(20) before the loop would avoid these copies. However,\
    \ you might wonder why no move is used here. This has to do with the missing noexcept\
    \ declarations, which we will discuss in the chapter about move semantics and\
    \ noexcept.\n\nNote that the exact policy of a vector to grow its capacity is\
    \ implementation-specific. Thus, the output might differ when implementations\
    \ grow differently (such as growing by 50% each time).\n\n# Sorting\n\nNext, we\
    \ sort all elements by name:\n\n```\nstd::sort(coll.begin(), coll.end(),\n   \
    \ [] (const Customer& c1, const Customer& c2) {\n        return c1.getName() <\
    \ c2.getName();\n    });\n```\n\nThis sorting might have the following output:\n\
    \n```\nMOVE TestCustomer -4\nMOVEASSIGN TestCustomer -5\nMOVEASSIGN TestCustomer\
    \ -4\nMOVE TestCustomer -3\nMOVEASSIGN TestCustomer -5\nMOVEASSIGN TestCustomer\
    \ -4\nMOVEASSIGN TestCustomer -3\nMOVE TestCustomer -2\nMOVEASSIGN TestCustomer\
    \ -5\nMOVEASSIGN TestCustomer -4\nMOVEASSIGN TestCustomer -3\nMOVEASSIGN TestCustomer\
    \ -2\nMOVE TestCustomer -1\n```"
