- pgno: 74
  md: 'You might wonder why we still use members of the source object obj after the
    object was marked with std::move():


    ```

    Base::operator=(std::move(obj)); // - perform move assignments for base class
    members

    ```


    However, in this case we mark the object for the specific context of a base class,
    which cannot see the members introduced in this class. Therefore, the derived
    members have a valid but unspecified state but we can still use the values of
    the new members.


    The generated assignment operator also does not check for assignments of objects
    to themselves. Thus, in its default behavior, the operator will move assign each
    member to itself, which usually means that members receive a valid but unspecified
    value. If this is critical, you have to implement the operator yourself.


    In addition, the generated move assignment operator is declared as noexcept if
    all called assignment operations (the assignments for base class members and the
    assignments for new members) give this guarantee.


    # Other Special Member Functions


    Other special member functions do not play such an important role for move semantics:


    +   - **Destructors** are nothing special with move semantics except that their
    declaration disables the automatic generation of move operations.


    +   - The **default constructor** (the “not-so-special” special member function)
    is still automatically generated if no other constructor is declared. That is,
    the declaration of a move constructor disables the generation of a default constructor.


    However, note that these special member functions play a role when talking about
    moved-from states. The state of the default constructor is often the “natural”
    state of a moved-from object and a moved-from object always should be destructible.


    # 3.4 The Rule of Five or Three


    Whether and which special member functions are automatically generated depends
    on a combination of several of the rules just described. Many programmers do not
    know all these rules. Therefore, even before C++11, the usual guideline is to
    provide either none or all of the special member functions for copying, assignment,
    and destruction.


    +   - Before C++11, this guideline was called the **Rule of Three**: The guideline
    was to either declare all three (copy constructor, assignment operator, and destructor)
    or none of them.


    +   - Since C++11, the rule has become the **Rule of Five**, which is usually
    formulated as: The guideline is to either declare all five (copy constructor,
    move constructor, copy assignment operator, move assignment operator, and destructor)
    or none of them.


    Here, declaring means:


    +   - Either to implement ({...})


    +   - Or to declare as defaulted (=default)


    +   - Or to declare as deleted (=delete)'
