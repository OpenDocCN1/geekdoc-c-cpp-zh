    \ the automatically generated copy assignment operator, we simply assign all members.\
    \ The only difference is the print statement at the beginning.\n\nWhen implementing\
    \ an assignment operator, you can (and maybe should) check for assignments of\
    \ an object to itself. However, note that the default assignment operator generated\
    \ does not do that and see the comments about this when discussing self-assignments\
    \ with the move assignment operator.\n\nYou might also want to declare the assignment\
    \ operator with reference qualifiers.\n\n# 3.2.4 Move Assignment Operator\n\n\
    The move assignment operator is implemented as follows:\n\n```\nclass Customer\
    \ {\nprivate:\n    std::string name;        // name of the customer\n    std::vector<int>\
    \ values;  // some values of the customer\npublic:\n    ...\n    // move assignment\
    \ (steal all members):\nCustomer& operator= (Customer&& cust) {  // noexcept declaration\
    \ missing\n    std::cout << \"MOVEASSIGN \" << cust.name << '\\n';\n    name =\
    \ std::move(cust.name);\n    values = std::move(cust.values);\n    return *this;\n\
    }\n};\n```\n\nAgain, we have to declare the move constructor as a function that\
    \ takes a non-const rvalue reference. Then in the body, we have to implement how\
    \ to improve the usual copying by benefiting that we can steal values from the\
    \ source object.\n\nIn this case, we do what the automatically generated move\
    \ assignment operator would do: we move assign the members in the body instead\
    \ of copy assigning them. In addition, we add our print statement. Finally, we\
    \ return the object for further use.\n\nNote that you should usually implement\
    \ the move assignment operator with a noexcept specification.\n\nYou might also\
    \ want to declare the move assignment operator with reference qualifiers."
