    \ aspects to consider.\n\n# 4.4.1 Implementing a Polymorphic Base Class\n\nA polymorphic\
    \ base class usually introduces the virtual member functions you can call for\
    \ all objects of derived classes. For example:\n\n```\nclass GeoObj {\npublic:\n\
    \    virtual void draw() const = 0;    // pure virtual function (introducing the\
