  md: "# 7.3 noexcept Declarations in Class Hierarchies\n\nWe saw that especially\
    \ when we have to implement a move constructor, we should declare it with a noexcept\
    \ guarantee. In general, following the rules of the C++ standard, we should declare\
    \ it not to throw when all base classes and all member types do not throw on a\
    \ move construction.\n\nThe general pattern would be as follows:\n\n```\n```cpp\n\
    class Base {\n    ...\n};\n\nclass Drv : public Base {\n    MemType member;\n\
    \    ...\n    // move constructor:\n    Drv(Drv&&) noexcept(std::is_nothrow_move_constructible_v<Base>\
    \ &&\n                        std::is_nothrow_move_constructible_v<MemType>);\n\
    };\n```\n```\n\nHere, the move constructor of class Drv guarantees not to throw\
    \ if the base class Base and the member type MemType give this guarantee.\n\n\
    The move assignment operator might use the same pattern but note that the move\
    \ assignment operator should be deleted in polymorphic types anyway, which means\
    \ that there is usually no need to implement them in derived classes.\n\n# 7.3.1\
    \ Checking for noexcept Move Constructors in Abstract Base Classes\n\nNote that\
    \ the type trait `std::is_nothrow_move_constructible<>` does not always work as\
    \ expected. For abstract base classes, it always yields `false` because it also\
    \ checks whether you can create an object of this type with the move constructor,\
    \ which is not possible for abstract types.\n\nTherefore, a declaration “I guarantee\
    \ not to throw if the abstract base class guarantees not to throw” that works\
    \ in all cases cannot be formulated using the standard type traits. Usually, you\
    \ simply (have to) know whether the base class move constructor might throw.\n\
    \nTo enable you to check for a class whether its move constructor guarantees not\
    \ to throw, you can implement the following helper type trait (here, implementing\
    \ it for C++20). However, note that you have to provide an implementation for\
    \ each pure virtual function:\n\n`poly/isnothrowmovable.hpp`\n\n```\n```cpp\n\
    // type trait to check whether a base class guarantees not to throw\n// in the\
    \ move constructor (even if the constructor is not callable)\n#ifndef IS_NOTHROW_MOVABLE_HPP\n\
    #define IS_NOTHROW_MOVABLE_HPP\n\n#include <type_traits>\n```\n```"
