  md: "```\npublic:\n    ...\n    // copy constructor (copy all members):\n    Customer(const\
    \ Customer& cust)\n        : name{cust.name}, values{cust.values} {\n        std::cout\
    \ << \"COPY \" << cust.name << '\\n';\n    }\n    ...\n};\n```\n\nThe automatically\
    \ generated copy constructor does just copy all members. In our implementation,\
    \ we only add a statement printing that a specific customer is copied.\n\n# 3.2.2\
    \ Move Constructor\n\nThe move constructor is implemented as follows:\n\n```\n\
    class Customer {\nprivate:\n    std::string name;        // name of the customer\n\
    \    std::vector<int> values;  // some values of the customer\npublic:\n    ...\n\
    \    // move constructor (move all members):\n    Customer(Customer&& cust)  \
    \                   // noexcept declaration missing\n        : name{std::move(cust.name)},\
    \ values{std::move(cust.values)} {\n        std::cout << \"MOVE \" << name <<\
    \ '\\n';\n    }\n    ...\n};\n```\n\nAgain, this is what the default generated\
    \ move constructor would do, extended with the additional print statement.\n\n\
    The key difference to the copy constructor is to declare the parameter as a non-const\
    \ rvalue reference and then move the members.\n\nNote something very important\
    \ here: move semantics is not passed through. When we initialize the members with\
    \ the members of cust, we have to mark them with std::move().¹ Without this, we\
    \ would just copy them (the move constructor would have the performance of the\
    \ copy constructor).\n\nYou might wonder why move semantics is not passed through.\
    \ Did we not declare the parameter cust to accept only objects with move semantics?\
    \ However, note the semantics here: this function is called when the caller no\
    \ longer needs the value. Inside the move constructor, we now have the value to\
    \ deal with and we have to decide where and how long we need it. In particular,\
    \ we might need the value multiple times and not lose it with its first use.\n\
    \n¹ You could also use std::move(cust).name, which is discussed later."
