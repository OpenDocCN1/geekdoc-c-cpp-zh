    the caller no longer needs the value.


    Note that rvalue references bind to other arguments than non-const lvalue references.
    Therefore, we had to introduce a new syntax and could not just implement move
    semantics as a different way of functions that modify passed arguments.


    # 2.4.1 const Rvalue References


    Technically, there is a fourth way of call-by-reference:


    +   - `void foo(const std::string&& arg)`

    +     takes the argument as const rvalue reference.


    This also means that you have read access to the passed argument. Here, the restrictions
    would be that you can only pass:


    +   - A temporary object that does not have a name

    +   - A const or non-const object marked with std::move()


    However, there is no useful semantic meaning of this case. As an rvalue reference,
    stealing the value is allowed, but being const, we disable any modification of
    the passed argument. This is a contradiction in itself.


    Nevertheless, creating objects with this behavior is quite easy: Simply mark a
    const object with std::move():


    ```

    const std::string s{"data"};

    ...

    foo(std::move(s));    // would call a function declared as const rvalue reference

    ```


    This might happen indirectly when declaring a function to return a value with
    const:


    ```

    const std::string getValue();

    ...

    foo(getValue());    // would call a function declared as const rvalue reference

    ```


    Semantically, this case is usually covered by the const lvalue reference overload
    of a function for read access. A specific implementation of this case is possible
    but usually makes no sense (the C++ standard library class std::optional<> uses
    const rvalue references).


    # 2.5 Passing by Value


    If you declare a function to take an argument by value, move semantics might also
    (automatically) be used.


    For example:


    ```

    void foo(std::string str);  // takes the object by value

    ...

    std::string s{"hello"};

    ...

    foo(s);                // calls foo(), str becomes a copy of s

    foo(std::move(s));     // calls foo(), s is moved to str

    ```'
