- pgno: 73
  md: "# Copy Assignment Operator\n\nThe copy assignment operator is automatically\
    \ generated when all of the following apply:\n\n+   - No move constructor is user-declared\n\
    +   - No move assignment operator is user-declared\n\nIf generated (implicitly\
    \ or with `=default`), the copy assignment operator approximately has the following\
    \ behavior:\n\n```\nMyClass& operator = (const MyClass& obj) noexcept-specifier\
    \ {\n    Base::operator=(obj);     //- perform assignments for base class members\n\
    \    value = obj.value;         //- assign new members\n    return *this;\n}\n\
    ```\n\nThe generated copy assignment operator first calls the best matching assignment\
    \ operator of the base class(es) for the passed source object (remember that assignment\
    \ operators in contrast to copy constructors are *not* called on a top-down basis;\
    \ they call the base class assignment operator(s) in the implementation). Afterwards\
    \ it assigns all members of its class (again using the best match).\n\nNote that\
    \ the generated assignment operator does not check for assignments of objects\
    \ to themselves. If this is critical, you have to implement the operator yourself.\n\
    \nIn addition, the generated copy assignment operator is declared as noexcept\
    \ if all assignment operations (the assignment of the base class members and the\
    \ assignment of the new members) give this guarantee.\n\n# Move Assignment Operator\n\
    \nThe move assignment operator is automatically generated when all of the following\
    \ apply:\n\n+   - No copy constructor is user-declared\n+   - No move constructor\
    \ is user-declared\n+   - No copy assignment operator is user-declared\n+   -\
    \ No destructor is user-declared\n\nIf generated (implicitly or with `=default`),\
    \ the move assignment operator approximately has the following behavior:\n\n```\n\
    MyClass& operator = (MyClass&& obj) noexcept-specifier {\n    Base::operator=(std::move(obj));\
    \  //- perform move assignments for base class members\n    value = std::move(obj.value);\
    \      //- move assign new members\n    return *this;\n}\n```\n\nThe generated\
    \ move assignment operator first calls the best matching move assignment operator\
    \ of the base class(es) for the passed source object, marked with `std::move()`\
    \ to pass through its move semantics. Afterwards it move assigns all members of\
    \ its class (again using the best match)."
