    \ constructor and an implemented move assignment operator (which has a corresponding\
    \ noexcept condition not to throw if both member types guarantee not to throw):³\n\
    \n```\ntemplate<typename T1, typename T2>\nstruct pair {\n    ...\n    pair(pair&&)\
    \ = default;\n    ...\n    pair& operator=(pair&& p) noexcept(...);\n    ...\n\
    };\n```\n\nTherefore, the following code:\n\n```\nstd::pair<std::string, std::string>\
    \ p1{\"some value\", \"some other value\"};\nauto p2{p1};\nauto p3{std::move(p1)};\n\
    \nstd::cout << \"p1: \" << p1.first << '/' << p1.second << '\\n';\nstd::cout <<\
    \ \"p2: \" << p2.first << '/' << p2.second << '\\n';\nstd::cout << \"p3: \" <<\
    \ p3.first << '/' << p3.second << '\\n';\n```\n\nhas the following output:\n\n\
    ```\np1: /\np2: some value/some other value\np3: some value/some other value\n\
    ```\n\nHowever, type std::pair<> also supports perfect forwarding by dealing with\
    \ universal/forwarding references:\n\n```\ntemplate<typename T1, typename T2>\n\
    struct pair {\n    ...\n    template<typename U, typename V> constexpr pair(U&&\
    \ x, V&& y);\n    ...\n};\n```\n\nTherefore, we can use move semantics when initializing\
    \ a pair. For example:\n\n```\nint val = 42;\nstd::string s1{\"value of s1\"};\n\
    std::pair<std::string, std::string> p4{std::to_string(val), std::move(s1)};\n\n\
    std::cout << \"s1: \" << s1 << '\\n';\nstd::cout << \"p4: \" << p4.first << '/'\
    \ << p4.second << '\\n';\n```"
