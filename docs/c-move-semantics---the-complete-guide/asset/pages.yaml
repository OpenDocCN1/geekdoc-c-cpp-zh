- pgno: 144
  md: '# ## 8.1.2 Value Categories Since C++11


    Since C++11, the value categories are as described in Figure 8.1.


    ![](img/c6f2c4fe3e0701d95a17354ad517147a_144_0.png)


    *Figure 8.1. Value categories since C++11*


    We have the following primary categories:


    +   - **lvalue** (“locator value”)

    +   - **prvalue** (“pure readable value”)

    +   - **xvalue** (“eXpiring value”)


    The composite categories are:


    +   - **glvalue** (“generalized lvalue”) as a common term for “lvalue or xvalue”

    +   - **rvalue** as a common term for “xvalue or prvalue”


    # ### Value Categories of Basic Expressions


    Examples of **lvalues** are:


    +   - An expression that is just the name of a variable, function, or data member
    (except a plain value member of an rvalue)

    +   - An expression that is just a string literal (e.g., "hello")

    +   - The return value of a function if it is declared to return an lvalue reference
    (return type *Type&*)

    +   - Any reference to a function, even when marked with `std::move()` (see below)

    +   - The result of the built-in unary `*` operator (i.e., what dereferencing
    a raw pointer yields)


    Examples of **prvalues** are:


    +   - Expressions that consist of a built-in literal that is not a string literal
    (e.g., 42, true, or nullptr)

    +   - The return type of a function if it is declared to return by value (return
    type *Type*)

    +   - The result of the built-in unary `&` operator (i.e., what taking the address
    of an expression yields)

    +   - A lambda expression


    Examples of **xvalues** are:


    +   - The result of marking an object with `std::move()`

    +   - A cast to an rvalue reference of an object type (not a function type)

    +   - The returned value of a function if it is declared to return an rvalue reference
    (return type *Type&&*)

    +   - A non-static value member of an rvalue (see below)'
