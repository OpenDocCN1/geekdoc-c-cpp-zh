    # Move Semantics in Types of the C++ Standard Library


    This chapter discusses the most important or remarkable applications of move semantics
    in the C++ standard library.


    It might help you to better understand basic types such as strings and containers
    and give you some insights into tricky use of move semantics.


    # 15.1 Move Semantics for Strings


    Strings are objects that might allocate memory to hold their values. For that
    reason, you can benefit from using move semantics for them.


    We have already had several examples in the book about how strings support move
    semantics:


