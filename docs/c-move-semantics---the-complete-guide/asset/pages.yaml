  md: "```\nvoid foo(const X&);    // for constant values (read-only access)\nvoid\
    \ foo(X&);          // for variable values (out parameters)\nvoid foo(X&&);  \
    \       // for values that are no longer used (move semantics)\n```\n\n```\ntemplate<typename\
    \ T>\nvoid callFoo(T&& arg) {      // arg is a universal/forwarding reference\n\
    \    foo(std::forward<T>(arg));  // becomes foo(std::move(arg)) for passed rvalues\n\
    }\n```\n\n```\nX v;\nconst X c;\n```\n\n```\ncallFoo(v);               // OK,\
    \ expands to foo(arg), so it calls foo(X&)\ncallFoo(c);               // OK, expands\
    \ to foo(arg), so it calls foo(const X&)\ncallFoo(X{});             // OK, expands\
    \ to foo(std::move(arg)), so it calls foo(X&&)\ncallFoo(std::move(v));    // OK,\
    \ expands to foo(std::move(arg)), so it calls foo(X&&)\ncallFoo(std::move(c));\
    \    // OK, expands to foo(std::move(arg)), so it calls foo(const X&)\n```\n\n\
    Whatever we pass to callFoo() becomes an lvalue (because the parameter arg is\
    \ an object with a name). However, the type of arg depends on what we pass:\n\n\
    +   - If we pass an lvalue, arg is an lvalue reference (X&, when we pass a non-const\
    \ X, or const X&, when we pass a const X).\n+   - If we pass an rvalue (an unnamed\
    \ temporary object or an object marked with std::move()), arg is an rvalue reference\
    \ (X&& or const X&&).\n\nBy using std::forward<>() , we forward the parameter\
    \ with std::move() if and only if we have an rvalue reference (i.e., arg binds\
    \ to an rvalue).\n\n# 9.3 Rvalue References versus Universal References\n\nUnfortunately,\
    \ universal/forwarding references use the same syntax as ordinary rvalue references\
    \ (formally, they are special rvalue references). This is a serious source of\
    \ trouble and confusion.¹ If you see a declaration with two ampersands, you have\
    \ to double-check whether a real type name or the name of a function template\
    \ parameter is used.\n\nIn other words, there is a significant difference between\n\
    \n```\nvoid foo(Coll&& arg)      // arg is an ordinary rvalue reference of type\
    \ Coll\n```\n\nand\n\n```\ntemplate<typename Coll>\nvoid foo(Coll&& arg)     \
    \ // arg is a universal/forwarding reference of any type\n```\n\nLet us discuss\
    \ the differences in detail."
