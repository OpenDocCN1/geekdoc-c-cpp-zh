    \ arg)\n{\n    std::cout << \"full specialization for type std::string&&\\n\"\
    ;\n    coll.push_back(arg);\n}\n\n// full specialization for const rvalues of\
    \ type std::string:\ntemplate<>\nvoid insert(std::vector<std::string>& coll, const\
    \ std::string&& arg)\n{\n    std::cout << \"full specialization for type const\
    \ std::string&&\\n\";\n    coll.push_back(arg);\n}\n\nint main()\n{\n    std::vector<std::string>\
    \ coll;\n    ...\n    insert(coll, std::string{\"prvalue\"});  // calls full specialization\
