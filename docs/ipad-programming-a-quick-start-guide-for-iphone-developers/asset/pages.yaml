  md: '# Chapter 5


    # Custom Keyboards


    Imagine there was a version of Apple''s Keynote or Pages application designed
    for the iPhone. What would it do? You could imagine viewing existing documents
    or presentations, but it would be awfully hard to create new documents on such
    a small screen. You''ve always been able to enter text on your iPhone—how are
    you going to enter a URL in Safari, enter an address in Maps, or reply to email
    in Mail? Although it works in a pinch, the iPhone is not going to be your go-to
    device for working with complicated documents.


    The key problem is that your finger takes up a lot of the iPhone screen. As Craig
    Hockenberry writes, "The screen on the iPhone squeezes 160 pixels into every inch
    of display space—and you''re using your finger to access that display. If you
    press your finger against the edge of a ruler, you will see it somewhere between
    1/4" and 1/2" at the point of contact. That corresponds to anywhere between 40
    and 80 pixels of display space.\1


    That means the iPhone screen is roughly five fingers. Given that, it''s amazing
    how easy it is to enter text on this pocket-sized device. You''ve seen how much
    bigger the iPad is than the iPhone, and one place that really pays off is when
    using the soft keyboard. In this chapter, we''ll see how easy it is to create
    a custom keyboard or to augment the existing keyboard using the text view''s properties
    inputView and inputAccessoryView.


    +   1. See ...yourcontentinmypocket/. Since Craig made these comments, Apple has
    introduced iPhone 4 with twice the resolution. The numbers double, but the point
    remains that you are obscuring a lot of the display every time you touch the screen.'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# CHAPTER 5. CUSTOM KEYBOARDS


    The iPad''s size allows you to do more than just view documents on it. In portrait
    orientation, the screen is more than a dozen fingers wide. In landscape, you have
    room for even more fingers—if you had them.


    On the iPad, you''re going to want to create new documents and edit existing ones
    like you can in the iPad versions of Keynote, Pages, and Numbers. You won''t be
    satisfied with merely view documents created elsewhere. You''ve already seen how
    to take advantage of the new techniques for gestures and how to use popovers.
    In this chapter, you''ll learn how to offer custom text input.


    # 5.1 Basic Text Input


    Create a view-based iPad project, and name it Feelings. Add a text view to the
    FeelingsViewController nib. We''ll use this text view to display emotions that
    let people nearby know how you are feeling. We''ll restrict ourselves to ;), :-),
    :-( and >:(²


    For effect you may want to set the background color of the text view to yellow,
    set the font to something big and bold like Helvetica bold 288, and make sure
    the text view is large enough to hold the angry emoticon. Really, that''s all
    you need. Build and run, and you should be able to type in the emoticons.


    ![](img/06d76a71c379bfa5e6891245aa6bb22d_105_0.png)


    > ². These are wink, happy, sad, and angry, respectively.'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# CREATING CUSTOM KEYBOARDS


    At this point, the app is not a very good user experience. For example, type the
    angry emoticon. You have to change keyboards to enter the three symbols. You know
    from your time as an iPhone developer that it''s best to choose the keyboard that
    most meets your users'' needs. If you look at the list of available keyboards,
    none of them really fits your needs.


    # Text Input Traits


    | Capitalize | Sentences |

    |---|---|

    | Correction | Default |

    | Keyboard | Default ASCII Capable |

    | Appearance | Numbers & Punctuation URL |

    | Return Key | Number Pad Phone Pad Email Address |


    There are keyboards for entering words, numbers, URLs, and more, but there''s
    nothing that helps us with emoticons. Let''s create our own.


    You''ll use some of the same techniques that you use when you target the iPhone.
    It is still critical that you tailor the keyboard to the information that is being
    entered. You now also have the option of replacing the keyboard with your own
    custom keyboard or of attaching your custom keyboard to the top of one of the
    standard ones. In this chapter, you''ll see how easy it is for you to implement
    this.


    # 5.2 Creating Custom Keyboards


    We''re going to create a custom keyboard for selecting emoticons. Our users will
    have to press only one button to express how they are feeling. To start with,
    we''re going to need a new nib file that contains the view will slide into where
    we used to see the keyboard. Add a new file to the Resources group using the iPad''s
    User Interface > View XIB template. Name it MoodKeyboard.


    Select the view, use the Attributes inspector to set the status bar to Unspecified.
    Use the Size inspector to size the view to be 768 pixels and 95 pixels high. Set
    the struts and springs so that the view remains anchored to the left, right, and
    bottom and so it grows horizontally. Set the view''s background color to be a
    light shade of gray'
