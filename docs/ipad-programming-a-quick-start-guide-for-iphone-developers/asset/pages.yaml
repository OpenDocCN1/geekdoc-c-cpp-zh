  md: "# 11.2 Launching and Advertising the Server\n\nThe Contestant application will\
    \ act as the server. When the view controller loads the view, it will create a\
    \ GKSession object, set the view controller as the session delegate, and announce\
    \ that the session is now available using the initWithSessionID:displaySessionMode:method.5\n\
    \nThe initWithSessionID:displaySessionMode:method takes three parameters. It is\
    \ a Bonjour-style service name. You should register your name with the DNS-SD\
    \ registry (http://www.dns-sd.org/ServiceTypes.html). We are using example as\
    \ your service name because that has been reserved specifically to be used by\
    \ books for their examples.\n\nThe second parameter is where you pass in a friendly\
    \ name that others can use to recognize you. In this case, we're hard-coding it\
    \ as Contestant, but often you'll tell the user a name that will be used.\n\n\
    The final parameter is where you specify the mode of the session you are launching.\
    \ You can be a server and advertise the session for others to find, a client and\
    \ search for advertised sessions, or a peer and both advertise sessions and search\
    \ for those advertised by others.6\n\nWe initialize the session in this launchServerSession\
    \ method which we invoke in the viewDidLoad method.\n\n```\nDevices/Contestant/Classes/ContestantViewController.m\n\
    -(void)launchServerSession {\n    self.session = [[GKSession alloc] initWithSessionID:@\"\
    example\"\n                    displayName:@\"Contestant\"\n                 \
    \   sessionMode:GKSessionModes];\n\n    self.session.delegate = self;\n    self.session.available\
    \ = YES;\n}\n```\n\nOnce you have advertised the new session, there's little more\
    \ you can do wait. In other words, you'll implement the appropriate delegate methods,\
    \ and these methods will be called when there is a change the host needs to respond\
    \ to. The host will need to respond when it receives a connection request and\
    \ when it detects that another device has successfully connected to it or has\
    \ disconnected from it.\n\n+   5. Remember, of course, to declare the GKSessionDelegate\
    \ protocol in ContestantViewController.\n6. The terminology is a bit confusing\
    \ because once you are connected to a session, you will refer to all of the other\
    \ devices you are connected to as your peers regardless of how you connect to\
    \ the session."
