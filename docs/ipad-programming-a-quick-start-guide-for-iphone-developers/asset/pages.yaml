  md: 'In our case, we''re calling the Prize: method. There''s nothing particularly
    interesting about what that method does. At some point the Contestant user is
    able to choose a door and gets bundled up and sent back to the MontyHall application.


    Just to illustrate a different approach, we''ll use a slightly different strategy
    to receive the data in the MontyHall app. This time we''re eliminating some of
    the repetition from the reception:fromPeer:inSession:context:


    ```

    - (void) receiveData:(NSData*)data

    fromPeer:(NSString*)peerID

    inSession:(GKSession*)session

    context:(void*)context {

    [NSKeyedUnarchiver alloc] initWithForReadingWithData:data];

    [self invokeMethod:@contestDidChooseDoor:if:FoundIn:unarchiver];

    [self invokeMethod:@finalDoorSelected:if:FoundIn:unarchiver];

    }

    ```


    The invokeMethodForKey method contains all of that we''ve eliminated from the
    delegate method. This includes whether the unarchiver contains a key with a particular
    name before calling the corresponding method and passing in the value corresponding
    to that key.


    ```

    - (void) invokeMethodForKey:(NSString*)keyName

    FoundIn:(NSKeyedUnarchiver*)unarchiver {

    if ([unarchiver valueForKey:keyName]) {

    [self performSelector:SelectorFromString(keyName) withObject:[NSNumber number
    decodeForKey:keyName]];

    }

    }

    ```


    That''s two variations on how we might handle data that specifies a method name
    and its argument. You may need to send very different types of data between devices,
    and you might want to format it in a variety of ways. Because you own both ends
    of the conversation, you can create any format you want and consume it appropriately
    when you receive it. We''ll look at another possible protocol later in this chapter.'
