    \ You're going to have to determine when the controls should be displayed, give\
    \ them a little sparkle through an animation as they reveal themselves, and then\
    \ carefully manage when they are away. Right done, this will give your playback\
    \ controls a professional feel. Done wrong, you are going to have very frustrated\
    \ users.\n\nThe first task we need to tackle is sensing the taps of the user within\
    \ the view bounds. By making the MPMViewController's view is to be treated as\
