  md: '# # Where to Go From Here


    We''ve got the paperback books, eBooks and screencasts you want for Mac development
    at PragProg. From Cocoa to Core Data, Core Animation, iPhone and Xcode, we''ve
    got what you need. Visit our Mac page at http://www.prprog.com/categories/mac.


    # ## Cocoa Programming


    Cocoa Programming shows you how to get productive with Cocoa-fast! You''ll learn
    to use the Apple developer tools to design your user interface, write the code,
    and create the data model. We will show you Objective-C concepts when you are
    ready to apply them throughout the book. By the end of the book, you''ll be a
    Cocoa programmer.


    **Cocoa Programming: A Quick-Start Guide for Developers**


    Daniel H Steinberg

    (450 pages) ISBN: 978-19343563-0-2, $32.95

    http://prprog.com/titles/dscpq


    ![](img/06d76a71c379bfa5e6891245aa6bb22d_248_0.png)


    # ## Core Data


    Learn the Apple Core Data APIs from the ground up. You can concentrate on designing
    the model for your application, and use the power of Core Data to do the rest.
    This book will take you from beginning with Core Data through expert level configurations
    that you will not find anywhere else. Learn why you should be using Core Data
    for your next Cocoa project, and how to use it effectively.


    **Core Data: Apple''s API for Persisting Data under OS X**

    Marcus S. Zarra

    (256 pages) ISBN: 978-1-93435-632-6, $32.95

    http://prprog.com/titles/mzcd


    ![](img/06d76a71c379bfa5e6891245aa6bb22d_248_1.png)'
  merge: -1
