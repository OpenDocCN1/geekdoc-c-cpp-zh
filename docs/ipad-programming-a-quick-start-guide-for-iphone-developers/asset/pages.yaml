  md: '# 3.3 Multi-Touch Events and the View Hierarchy


    To create a popped-bubble effect, we need to know when a user taps a bubble. How
    do we accomplish this? You might be thinking that one way of recognizing when
    a bubble (or in our case a UIImageView representing a bubble) is tapped to attach
    another tap gesture to each UIImageView and write another action to handle the
    rest. That would work, and in fact we''re going to implement a resize gesture
    by attaching to an image, but here we''re going to take another, more direct path
    to demonstrate how the view hierarchy works with touches. The next several paragraphs
    are important because they go into the detail of how Multi-Touch events work with
    the view hierarchy and how they relate to gestures. Let''s work through the details
    and then get these bubbles working.


    When the iPad receives a Multi-Touch event, by default it passes the touch to
    the application to the window''s view and down recursively into each subview for
    which the touch falls within its bounds. The final view in the hierarchy, for
    which the touch falls within, is called the hit-test view. When it comes to recognizing
    gestures, the hit-test view gets the first shot at recognizing Multi-Touch events,
    and if they are not recognized, passes them up the chain to the window and application,
    if no view makes use of them.


    In our current code, when a user touches the UIImageView of a bubble, that view
    gets first at recognizing the touch as a gesture; and if it is not recognized,
    the events go to the parent view, which is our BubblesViewController''s view.
    Because we haven''t added a gesture or any code to recognize Multi-Touch events
    in the UIImageView, the events will always go to the BubblesViewController''s
    view, and taps will be recognized, even if we''re tapping one of the bubble images.


    This all sounds bit complicated; why not just install another gesture on the UIImageView
    and be done with it? Well, using the knowledge of the view hierarchy and hit testing,
    we can write much simpler code to implement bubble popping, and in general, you''ll
    be able to use gestures in a more sophisticated way with your new understanding
    of Multi-Touch events (in fact, we will make direct use of this writing our own
    custom gesture later in the chapter).'
