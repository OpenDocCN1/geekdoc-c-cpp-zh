  md: 'Fortunately, Apple provides us with a mechanism for giving our users this ability,
    and Apple makes it very easy to implement.


    When the user holds the iPad in landscape orientation, we want the application
    to appear just as it does right. When the user switches to portrait, we will add
    an Assignments button to the toolbar. When the user presses the button, they will
    get a list of the assignments, and they will''ve selected a specific assignment
    (or they change their mind and decide not to choose one), we''ll need to clear
    the list.


    The split view controller manages two subcontrollers. In our case, when the iPad
    is rotated, the split view controller either hides or reveals the view controlled
    by the RootViewController_Pad instance and resizes the view controlled by the
    AssignmentViewController_Pad object. The view managed by the AssignmentViewController_Pad
    is the one that will be changing during this repositioning. This means that the
    AssignmentViewController_Pad object will be the delegate for the UISplit-View-Controller.


    Add the declaration for the UISplitViewControllerDelegate protocol to the AssignmentViewController_Pad.h
    header file. Now wire up this delegate. Open the MainWindow-iPad nib, and connect
    the UISplitViewController''s delegate outlet to the AssignmentViewController_Pad
    object.


    Two of the methods in the UISplitViewControllerDelegate protocol will be called
    by the system as the device switches orientations. Much of the work you need to
    accomplish is taken care of for you. In fact, the names of the methods that you
    will meet in the next two sections are longer than their implementations! We''ll
    start with the one that is called when we orient the iPad vertically.


    # Adding a Popover


    iPad has a new widget called a popover, which is, of course, managed by a popover
    controller. It''s something like a menu, but it is not attached to the button
    you press to make it appear. As you''ll see in Chapter 4, Popovers and Modal Dialog
    Boxes, you can set popovers to appear when the user touches some specific area
    of the screen. For now, we''ll bring up our popover when a button is pressed.


    We''re going to implement a method in the UISplitViewControllerDelegate protocol
    to add a button to the toolbar, which, when pressed, will bring up a popover containing
    all the items from the navigation view.'
