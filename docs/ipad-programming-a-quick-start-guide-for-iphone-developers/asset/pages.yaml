    # 11.5 Sending Data to Another Device


    Whatever we send from one device to another needs to be wrapped up as NSData.
    In our sendMessage:forDoor: method, we prepare the data to be sent by creating
    a keyed archive with the key equal to the method name to be called at the other
    end and the value equal to the door number. We will then send the information
    to the contestant using this:


    ```

    Devices/MontyHall2/Classes/MontyHallViewController.m

    [self.session sendDataToAllPeers:data

    withDataMode:GKSendDataReliable

    error:&error];

    ```


    We could send the data to all peers or to a specific peer. We send it to all peers
    because we have only one peer, there''s no sense in narrowing it down. We can
    specify whether the data needs to be sent reliably. We have chosen GKSendDataReliable
    so it will be sent until the connection is successful or the connection times
    out.'
