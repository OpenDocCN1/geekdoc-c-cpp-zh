  md: "Add a property named popoverController of type UIPopViewController to AssignmentViewController_Pad.h.\
    \ We don't actually need this variable in the step where we are adding the popover\
    \ controller, but we will need it in the next section where we ensure we remove\
    \ the popover.\n\nGo to the docs for the UISplitViewControllerDelegate, and copy\
    \ and paste the signature for this method:\n\n```\n- (void)splitViewController:(UISplitViewController*)svc\
    \ hideViewController:(UIViewController*)aViewControllerWithBarButtonItem:(UIBarButtonItem*)barButtonItem\
    \ forPopoverController:(UIPopoverController*)pc\n```\n\nYes, copy and paste. This\
    \ is a delegate method, and if you make even the smallest of typos, the method\
    \ will not get called at runtime, and you will get no error or warning to tell\
    \ you why.\n\nThis method is called when the user switches from landscape to portrait\
    \ and the RootViewController_Pad's view is about to be hidden. Notice that this\
    \ method passes handles to that view controller as its second parameter and to\
    \ the button on the toolbar as its third parameter. The method's last parameter\
    \ is a popover controller.\n\nTo implement the method, set the title for the button,\
    \ display the button on the toolbar, and set the value of the popoverController\
    \ property.\n\n```\nSPLITVC/ViewController/Classes/AssignmentViewController_Pad.m\n\
    - (void)splitViewController:(UISplitViewController*)svc\nhideViewController:(UIViewController*)aViewControllerWithBarButtonItem:(UIBarButtonItem*)barButtonItem\n\
    forPopoverController:(UIPopoverController*)pc {\n    barButtonItem.title = aViewController.title;\n\
    \    self.toolbar setItems:[NSArray arrayWithObject:barButtonItem] animated:YES];\n\
    \    self.popoverController = pc;\n}\n```\n\nThat's it. Try it. The button and\
    \ the popover should appear in fine in portrait. Things aren't quite right in\
