  md: '# CHAPTER 4. POPOVERS AND MODAL DIALOG BOXES


    The core technique for using modal views or popovers is similar:


    +   1. Listen for an event. We''ll listen for a tap on our cargo container and
    for a button press.


    +   2. Create a view controller and an associated nib containing the contents
    of the view that will be displayed modally or in a popover.


    +   3. When the event is received, display the modal view or popover.


    +   4. Respond to user interaction with the controller, and dismiss it when the
    user is done with it.


    Let''s get started.


