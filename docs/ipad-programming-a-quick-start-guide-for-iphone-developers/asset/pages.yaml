  md: "# 5.5 Using Keyboard Notifications\n\nRemember that there is information whizzing\
    \ around behind the scenes all the time. Notifications are sent when it's time\
    \ for the keyboard to appear or hide. We just need to register to listen for them.3\
    \ In-didLoad, we'll register for KeyboardWillShowNotification and UIKeyboardWillHideNotification\
    \ and specify the methods that will be called when we receive the notifications.\n\
    \n```\nInput/Feelings/Classes/FeelingsViewController.m\n\n-(void)viewDidLoad {\n\
    \    [super viewDidLoad];\n    [[NSNotificationCenter defaultCenter] addObserver:self\
    \ selector:@selector(keyboardWillWillAppear:) name:KeyboardWillShowNotification\
    \ object:nil];\n    [[NSNotificationCenter defaultCenter] addObserver:self selector:@selector(keyboardWillDisappear:)\
    \ name:KeyboardWillHideNotification object:nil];\n    [SBBundle main loadNamed:@\"\
    Keyboard\" options:nil];\n    self.textField.inputAccessoryView = self.keyboard;\n\
    }\n```\n\nHere we have registered with the default notification center to be notified\
    \ when the KeyboardWillShowNotification is issued. We set this instance of the\
    \ FeelingsViewController (that is, self) as the observer and specified that the\
    \ message keyboardWillAppear: will be sent. In other words, whenever there is\
    \ a KeyboardWillShowNotification, the default notification center will send us\
    \ a message that looks something like this:\n\n```\n[myFeelingsController keyboardWillAppear:notification];\n\
    \n-(void)keyboardWillAppear:(NSNotification *)notification {\n    NSLog(\"Keyboard\
    \ will appear:%n\", notification);\n}\n```\n\nWe implement keyboardWillAppear:\
    \ and the corresponding keyboardWillDisappear: methods. For now, let's implement\
    \ the two methods by logging the notifications to see what's available to us:\n\
    \n+   3 If you don't know how to work with notifications, you'll find an introduction\
    \ and examples in Cocoa Programming: A Quick-Start Guide for Developers [Ste09]."
