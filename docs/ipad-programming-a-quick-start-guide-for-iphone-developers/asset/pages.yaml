  md: '# Chapter 4


    # # Popovers and Modal Dialog Boxes


    Sometimes the user will need to enter more information than can be communicated
    in a single gesture. Maybe they''ll need to select from a list of options to set
    the color of a component, the font of the text, or the web page to load.


    In this chapter, we''ll create a simple app that features a container for which
    users can select the color. That''s not the world''s most exciting app—we''ll
    spice it up at the end by adding a panel to allow users to move the container
    around the screen.


    The users select the container by tapping it, but then what? Using simple gestures,
    we could cycle through a predefined set of colors. That''s not a lot of fun. In
    an iPhone application, we would usually push a modal view over the screen and
    use it to enter the custom information. We can use the same technique on the iPad.
    We''ll begin this chapter with a look at how to do and how to take advantage of
    some of the iPad-specific options for modal views.¹


    Modal views aren''t always the best choice. We could provide these same choices
    using the new iPad views that you saw in Chapter 2, *Introducing Split Views*.
    It turns out *how* we implement these options is fairly similar. The main thing
    you need to determine is *when* it makes sense to use a modal view and when it
    makes sense to use a popover. In this chapter, we''ll cover both the how and the
    when. We''ll also take some time to understand what goes on behind the scenes
    with the split view controller to set up the popover we saw in the portrait view.


    +   1. Recall that a modal view requires you to perform an action and dismiss
    that view before you can interact with any other aspect of the application.'
