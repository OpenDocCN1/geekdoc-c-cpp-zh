  md: '# Chapter 9


    # Apple''s HTTP Live Streaming


    As you''ve seen in the previous two chapters, playing video from the application
    bundle is straightforward (and there will certainly be applications for embedding
    your video content is appropriate); bundled video has also allowed us to focus
    on creating great video experiences without worrying about issues such as network
    connections, servers, latency, and bandwidth issues. However, for many applications,
    if not most, you''ll need to stream video, over the network, to the iPad.


    In this chapter, we''re going to explore iPad video streaming—why you need it,
    what it means, how it differs from locally played video, and how to accomplish
    it. You''ll be able to play almost everything learned in the previous two chapters,
    with a few exceptions, but we''re also going to add a few more bits of knowledge
    that you''ll need to create video experiences in a networked environment.


    # 9.1 Progressive vs. Streamed Video


    Let''s first start with a common confusion: progressive vs. streamed video. With
    progressively delivered video, you place a video asset on a web server and then
    ask the client to retrieve it via the HTTP protocol. Using this method, the media
    player is essentially downloading the asset and playing it back (usually in the
    form of a locally cached file) as it gets content.


    Progressive download has its advantages; it''s easy, and it works by placing your
    video file on any web server. It also has disadvantages: it can be costly (often
    you download a lot more content than the user'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'ever views), and it gives you no way to adjust the bit rate of the content
    as the user views the video. Also, Apple places on your applications—if your video
    exceeds either ten minutes in duration or 5MB of data in a five-minute period,
    you must use streaming instead of progressive download. The reason? Streaming
    avoids the pitfalls we just mentioned with progressive download and allows us
    to adjust the playback bit rate as needed, depending on the user''s network conditions.
    The disadvantage? It has traditionally required proprietary infrastructure and
    protocols to pull off streaming. Apple’s improved that with its HTTP-based streaming
    protocol. Let’s take a look.


    # 9.2 Apple''s HTTP-Based Streaming Protocol


    Apple has created an open standards-based protocol called the HTTP Live Streaming
    protocol (HLS for short). Given that Apple has the protocol on HTTP, the standard
    transport protocol used by all browsers and web servers, you’re going to be able
    to place your video content on any garden-variety web server to be streamed to
    the iPad. Also, don’t be confused by “Live” in the name of HLS; although HLS supports
    the streaming of live content, such as, say, a sports event or concert (with the
    help of real-time encoders available commercially on the market), it also works
    for video-on-demand types of applications, where you have prerecorded video content
    you’d like to stream to your users.


    # How HTTP Live Streaming Works


    Most common streaming solutions transport your video content over one or more
    sockets using a proprietary protocol. Supporting these proprietary solutions typically
    requires the setup and maintenance of large server farms that are dedicated to
    the streaming protocol (often hosted on content delivery networks).


    HLS uses a different approach where your video is broken into many small segments
    and then stored on conventional web servers. Video players in the client use the
    conventional HTTP protocol to request and receive these segments, which are stitched
    together to create the seamless playback of your video.


    The HLS approach has some important advantages: first, as we mentioned, the video
    can be stored and delivered from any conventional web server. Also, given the
    pervasiveness of the HTTP protocol, many of the potential network issues we encounter
    with proprietary protocols'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# APPLE''S HTTP-BASED STREAMING PROTOCOL ◀ 171


    ![](img/06d76a71c379bfa5e6891245aa6bb22d_182_0.png)


    Figure 9.1: APPLE HTTP LIVE STREAMING


    with routers and firewalls are avoided. There is also another significant advantage:
    because the video is broken into segments, each time the player needs to fetch
    a new segment, it can make a decision about the available bandwidth and, if available,
    request a segment that has been encoded at a greater or lesser bit rate, improving
    the quality of service of the video delivery.


    # Segmenting Video


    As you might expect, segmenting video introduces some extra work because it requires
    pre부터 the video into small chunks (typically ten seconds in length) to be used
    by HLS, and further, in order to use the bit rate shifting, you''ll need to do
    this several times for the same asset (once for each bit rate you want to support).


    Segmenting video is beyond the scope of this book; however, there are many Apple
    tools and resources to help. Check out the HTTP Streaming Overview [App09a], which
    itself contains pointers to all the'
  merge: -1
