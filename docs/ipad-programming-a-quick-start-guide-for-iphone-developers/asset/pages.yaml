    # 7.5 Creating Thumbnails


    One of the more interesting capabilities of the MPMPlayerController is that it
    can generate thumbnails of your video''s content. The controller provides two
    methods for generating thumbnails, one synchronous and the other asynchronous.
    The synchronous call, thumbnailAtTime:timeOption:, generates one thumbnail at
    a time, while the asynchronous version, requestThumbnailImagesAtTime:timeOption:,
    can generate multiple thumbnails. If you want to generate a set of thumbnails,
    you should definitely be using the asynchronous call, given the performance implications.
    Note that Apple currently limits thumbnail generation to video content in the
    local file system and does not support generation for progressive or streamed
    content.


    Let us briefly examine the synchronous method before moving on to the asynchronous
    call; you''ll find the parameters of the two calls are:


    +   - (UIImage *)thumbnailAtTime:(NSTInterval)playbackTime:(MPMovieTimeOption)


    The thumbnailAtTime method takes a playbackTime and a timeOption as parameters
    and returns a thumbnail in the form of a UIImage. The playback time is specified
    as an NSTInterval; if you haven''t encountered this type before, it is defined
    as a double where the integral part represents the number of seconds and the fractional
    part represents fractional seconds.


    The timeOption can be one of two: MPMovieTimeOptionNearestKeyFrame or MPMovieTimeOptionExact.
    With the MPMovieTimeOptionExact option, the exact time position in the video is
    used to generate the thumbnail. With the MPMovieTimeOptionNearestKeyFrame option,
    the'
