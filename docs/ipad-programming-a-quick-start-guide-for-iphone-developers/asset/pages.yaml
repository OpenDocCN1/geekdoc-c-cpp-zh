  md: "# MAKING THE PLAYBACK CONTROL DYNAMIC 163\n\nview. the playback controls would\
    \ gradually fade in and stay visible until the controls haven't been touched for\
    \ four seconds, and then they should fade away, fully revealing the video again.\n\
    \nOur first task is to alter our implementation so the user doesn't see the controls\
    \ when the application begins. To do that, we're just going to set their opacity\
    \ to transparent by setting the alpha of the playback controller's view to 0 (which\
    \ will make all subviews transparent). This is easily done in the viewDidLoad:\
    \ method within your PlaybackViewController; you can add this line to the bottom\
    \ of the method:\n\nself.view.alpha = 0.0;\n\nTry by running your application\
    \ at this point—you'll see that the playback controls have disappeared. Don't\
