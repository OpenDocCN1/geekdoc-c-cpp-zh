  md: '# Stroking and Filling


    At this point, we''ve done most of the work. We''ve created the triangle

    moved it to the center of the screen. Unfortunately, there''s nothing

    to see yet. We''ll add color with these from the drawRect: method:


    ```

    [self fill:triangle

    withColor:[UIColor yellow]

    inContext:ctx);

    [self stroke:triangle

    withColor:[UIColor black]

    width:20.0

    inContext:ctx];

    ```


    It''s not surprising that you have to pass the path into these methods

    will be stroking and filling the triangle. It is, however, a bit sur-

    prising that you have to pass the path in the context. When you look at the

    implementation of these methods, you''ll see that the context is needed

    as a parameter for each one of the function calls:


    ![](img/06d76a71c379bfa5e6891245aa6bb22d_120_0.png)


    +   - (void) fill:(CGMutableRef) path

    withColor:(UIColor *) color

    inContext:(CGContextRef) ctx {

    CGContextSetFillColorWithColor(ctx, color.CGColor);

    CGContextAddPath(ctx, path);

    CGContextFillPath(ctx);

    }

    - (void) stroke:(CGMutableRef) path

    withColor:(UIColor *) color

    width:(float) width

    inContext:(CGContextRef) ctx {

    CGContextSetStrokeColorWithColor(ctx, color.CGColor);

    CGContextSetLineWidth(ctx, width);

    CGContextAddPath(ctx, path);

    CGContextStrokePath(ctx);

    }


    In each case, we set the color to be used, add the path to this modified

    context, and then either stroke or fill the path. Finally, there''s some-

    to see. You should see a big yellow triangle with a thick

    border in the center of your screen.


    In the next section, we''ll revisit this example using the UIBezierPath

    class. There is no real reason for doing so. The UIBezierPath class has

    more features that make it quite attractive, but if you are just building

    paths of line segments and simple curves, you can use the C-based

    APIs described in this section.'
