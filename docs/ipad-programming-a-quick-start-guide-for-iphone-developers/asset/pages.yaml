    ![](img/06d76a71c379bfa5e6891245aa6bb22d_92_0.png)


    Now when the users select other colors, they see the results immediately. Instead
    of waiting until the screen is dismissed. This is, of course, not guaranteed.
    If the cargo container had been placed in the center of the screen, even this
    smaller modal view would obscure it. One solution is to set the CargoColorChooser''s
    view to have a clear background color. A better solution in our case is to use
    a popover.


    # 4.4 Streamlining the Controller


    Users should never be required to use some sort of button to dismiss a popover.
    The popover should disappear when the users tap the screen outside of the popover;
    or if it is natural to do so, the popover can disappear after the users complete
    an action. In our example, we could dismiss the popover when the users select
    a color—or we leave it up so that they can select a color, look at the result,
    and perhaps select another color. In each situation, consider what behavior matches
    the users'' expectations.


    In either case, Apple''s iPad Human Interface Guidelines [App10a] is clear about
    not including a button to dismiss a popover. Remove the Dismiss button from our
    CargoColorChooser''s view. While you''re at it, remove the dismiss action from
    the CargoColorChooser class.'
