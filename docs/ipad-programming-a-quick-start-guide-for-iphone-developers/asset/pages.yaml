  md: '# Chapter 12


    # # Working with Documents


    There''s been a progression in how you work with documents on Apple''s handheld
    devices. The iPod was meant for consuming media and documents produced elsewhere.
    You could listen to music, watch videos, and view your calendar and addresses
    on the iPod, but you couldn''t make any changes to your appointments or contact
    information.


    The iPhone and iPad touch changed this. You can write text messages and email
    and create new content on them. Even though it is possible to author content on
    these devices, their primary use case is still the consumption of content produced
    elsewhere.


    The iPad extends this spectrum. It is big enough to be used to author documents.
    Apple made this distinction clear by releasing iPad versions of Pages, Numbers,
    and Keynote on the day the iPad shipped. You can see from these iWork how Apple
    imagines you will work with documents on the iPad.


    In this chapter, we''ll look at several aspects of working with documents. You''ll
    learn how to enable the transfer of documents to and from your application''s
    Documents directory using iTunes. You''ll open and save documents in that directory.
    You''ll register your application as being able to open a particular document
    type, and you''ll use the UIDViewController and its delegate to let other applications
    open documents that your application cannot open. Finally, you''ll learn how to
    preview documents.


    For better or worse, the iPad doesn''t have a Finder. Your users should not be
    thinking about directory structure. They shouldn''t worry about where a document
    is stored. They just want to work with the document. We''re going to make that
    easy for them.'
  merge: -1
  pgno: 218
