    # 4.5 Displaying a Popover


    It''s slightly more complicated to display a popover than a modal view. We can
    customize the controller in many ways to describe where it is in relation to the
    user taps to present it.


    First we will create a UIPopViewController. To configure the init, we have to
    tell it which controller it will be using for its content. A popover controller
    is not itself a view controller; it hosts a view controller. Here we''ve set the
    popoverSize property so that the popover is the same size as the view configured
    in the CargoColorChooser nib.


    When it''s time to present the popover, we need to specify the visual element
    the user tapped so that the arrow is drawn back from the popover to that element.
    In fact, we may be displaying a popover to customize a specific portion of the
    view you are pointing at. You can specify a specific region in that view by setting
    the rectangle you''re targeting. In our case, we''re modifying the entire cargo
    container, so we set the rectangle to be cargoView.bounds.'
