  md: 'Now, a manifest file like the previous one would typically be generated for
    each bit rate we are going to support. We need another file to

    describe all the possible segments (by bit rate) that are available. That

    file looks like this:


    ```

    #EXTM3U

    #EXT-X-STREAM-INF:PROGRAM-ID=1, BANDWIDTH=200000

    ge1/prog_index.m3u8

    #EXT-X-STREAM-INF:PROGRAM-ID=1, BANDWIDTH=311111

    ge2/prog_index.m3u8

    #EXT-X-STREAM-INF:PROGRAM-ID=1, BANDWIDTH=484444

    ge3/prog_index.m3u8

    #EXT-X-STREAM-INF:PROGRAM-ID=1, BANDWIDTH=737777

    ge4/prog_index.m3u8

    ```


    This M3U8 file lists four possible assets, encoded at 200Kbps and

    av in the gear1/prog_index.m3u8 manifest file, another available

    at 311Kbps and available in the gear2/prog_index.m3u8 file, and so on.

    When you point to a player file, the player will parse it to determine

    each bit rate so it can make decisions about which asset to

    retrieve next based on available bandwidth. Note when your player first

    retrieves content, it will always start with the first listed manifest file

    and judge its later retrievals based on network conditions.


    # Taking HLS Further


    As you may suspect, we''ve barely scratched the surface of segmenting

    and configuration of the back end of HLS, and if you''re serious about

    using HLS, there is a lot to learn. That said, CDN and other vendors

    will gladly take the most of the pain away from you if you want them

    to host your HLS content.


    For now, with a basic understanding of segmenting, we''re going to move

    on to the real topic of this chapter: how to support streaming on the

    client side.


