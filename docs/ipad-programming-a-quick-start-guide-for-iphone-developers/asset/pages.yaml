  md: "# Clearing the Bubble Sheet\n\nMechanically clearing the bubble sheet is a\
    \ straightforward task; all we have to do is locate the Bubbles! subviews and\
    \ remove them. If you haven't worked with subviews before, the UIViews return\
    \ an array of subviews, which we simply iterate over, calling removeSuperview:\
    \ on each one. The removeSuperview method removes the view from its parent view\
    \ (in this case the BubblesViewController). Let's put this to work:\n\n```\ngestures/Bubbles3/Classes/Bubbles3ViewController.m\n\
    (void)handleSwipeFrom:(UISIGestureRecognizer *)recognizer {\n  for (UIView *subview\
    \ in [self.subviews]) {\n    [subview removeSuperview];\n  }\n\n[UIView beginAnimations:nil\
    \ context:nil];\n[UIView setAnimationDuration:.75];\n[UIView setAnimationBeginFromCurrentState:YES];\n\
    [UIView setAnimationTransition:UIViewAnimationTransitionFlipForView:self.view\
    \ cache:YES];\n[UIView commitAnimations];\n}\n```\n\nWe've also decided to use\
    \ a little animation to indicate that something has happened as a result of the\
    \ swipe gesture. Although the point of this chapter isn't to explain the details\
