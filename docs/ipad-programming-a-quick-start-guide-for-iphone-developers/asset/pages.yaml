  md: '# Chapter 1


    # From iPhone to iPad


    Before you write a line of code for your iPad app, you need to hold the device
    in your hands. You need to feel the device melt away as you become immersed in
    an app. The app you are using gets out of your way as you get involved in an activity
    enables.


    That''s the kind of app we want you to write.


    We don''t merely want to write apps that run on an iPad; we want you to write
    apps that are perfect for the platform. People are going to tell their friends
    about your app because it delights them when they notice it, and it disappears
    as they use it.


    How can that be? Isn''t the iPad an oversized iPod touch that runs on the same
    iOS we already know and love? We have become up in the marketing hype generated
    by Steve Jobs'' famous reality distortion field?


    No. There is something fundamentally different about this high-resolution device
    with its large display that fits in your hands but not your pocket—a device that
    you navigate with Multi-Touch and gestures.


    Throughout this book, we show you how to build experiences for this new device.
    We''ll explore the similarities and differences between developing for the iPad
    and what you''re used to developing for the iPhone. We aren''t presenting a single,
    unified example that displays everything at once. We''ll look at individual topics
    and leave it to you to decide when how to use in the applications you are building.


    +   1. At WWDC 2010, the operating system previously known as iPhone OS was rebranded
    as iOS. At this time, the operating system is referred to iOS, while the developer
    APIs are still branded iPhone SDK.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# CHAPTER 1. FROM iPhone TO iPad


    We will begin in the world that you know. We''ll start creating an iPhone app
    in this chapter and transform it into an app that runs on your iPad.


    But first let''s figure out how the iPad fits in your end users'' lives— somewhere
    between the laptop and the iPhone.


    # 1.1 The iPad and the Laptop


    Once you''ve checked email or surfed the Web on an iPad, your-top is going to
    seem bulkier and less portable than it was the minute before you picked up the
    iPad. Suddenly, you''ll be aware of the amount of space required to house the
    keyboard, trackpad, hard drive, and battery.


    On the other hand, your iPad is more constrained. It is not meant to live as a
    stand-alone device. It must be synced to a laptop or desktop machine once in a
    while. It doesn''t have the processing power, memory, or storage of a laptop.
    It is designed to belong to a single user, with a single app occupying your attention
    at any given time. The iPad is not meant to be the digital hub that a desktop
    or laptop becomes. For now, it is a node on the hub, not the center of your digital
    universe.


    Most importantly, there is something very different about interacting with the
    screen by touching it as opposed to having to use a mouse or a trackpad. On the
    iPad, you use your finger to land planes in Flight Con-, paint beautiful images
    with Brushes, and mark email messages as deleted. If you want to move or guide
    an object, you put your finger on it and move your finger. The object comes along
    for the ride.


    If you want to resize an object, you use two fingers to pinch or zoom. You use
    your finger to resize, reposition, and crop an image. You zoom on a web page to
    better read and so that your finger can more easily select the right box to type
    into. These gestures have become so natural that it feels strange to use a mouse
    to select an object and grab handles to resize and reposition. Reaching for the
    mouse or the trackpad takes out of the moment.


    The last important difference between an iPad and a laptop is that you can easily
    rotate the iPad 90 degrees and get a whole view of your application. In fact,
    as an iPad developer, you are asked to consider how best to present your app in
    both landscape and portrait orientations.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# What About iOS 4?


    At its launch, the iPad ran iPhone OS 3.2, which added many APIs and techniques
    to iPhone OS 3. Apple released iOS 4 for iPhone in June 2010. Many of the topics
    covered in this book will help you take advantage of new features in iOS 4. For
    example, the new gesture APIs introduced for the iPad are now available on iOS
    4.


    So, the question about iOS 4 can be a bit confusing. A lot of the new APIs introduced
    for the iPad in iPhone 3.2 are part of iOS 4. If you are writing iOS 4 apps for
    the iPhone, then the relevant sections of this book will be helpful. There are,
    however, some features that are new to iOS 4 and are not yet available for the
    iPad. Multitasking, for example, is not part of iPhone 3.2 and is not covered
    by this book. iOS 4 will not be available on the iPad until after which this book
    is completed.


    # The iPad and the iPod Touch


    Much of the GUI you know and love on Mac OS X and later on Windows originated
    at Xerox PARC by Alan Kay''s team. Kay has consistently complained that the way
    we interact with a computer has not changed from the work his team was doing decades
    ago. Alan Kay told Gigaom''s team this story about Kay''s reaction to the unveiling
    of the iPhone in 2007.


    When the Mac first came out, Newsweek asked me what I [thought] of. I said, ''Well,
    it''s the first personal computer worth criticizing.'' So, at the end of the [iPhone]
    presentation, Steve came up to me and said, ''Is the iPhone worth criticizing?''
    And I said, ''Janko the screen five by eight inches, and you''ll rule the world.''


    So, isn''t that what the iPad is? Isn''t the iPad just a big iPod Touch?


    It''s certainly true that the iPad runs iOS. That''s exactly the same operating
    system that runs on the iPhone and the iPod Touch. In fact, you will use many
    of the same APIs when you write your iPad apps that you use to write apps for
    the iPhone.


    +   2. http://gigaom.com/2010/01/26/alan-kay-with-the-tablet-apple-will-rule-the-world/'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'It''s also true that an iPad is much bigger than an iPhone. An iPad is about
    the size of the printed version of this book—about half an inch taller and a little
    thinner but roughly the same size. The iPhone is much smaller. Here''s a picture
    that shows the relative size of two iPhone screens to the iPad screen:


    ![](img/06d76a71c379bfa5e6891245aa6bb22d_15_0.png)


    So, the iPad is a big iPod touch—but it''s not **just** a big iPod touch. Being
    bigger is the key to what makes it special.


    The size is an important part of the story. On the iPad, you can browse web pages
    at full resolution, sort your pictures into piles with a flick of your finger,
    and fill out forms using a keyboard that can fit all of your fingers on.


    You will be missing the point if you think of the iPad from the developer''s point
    of view. The APIs are similar enough to those for the iPhone apps that one device
    can easily run on the other. When you start to create an app for the iPad, take
    the time to understand what is different and special about this device.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# What You Need for This Book


    You will need to register as an iPhone developer for free at http://developer.apple.com/iPhone.
    There is an additional yearly charge ($99) if you want to deploy your applications
    to your iPad or iPhone or sell your applications on the iTunes App Store.


    Some of the material in this book are the ones that take file sharing and using
    external displays will require that you are running the example on the device.


    Once you''ve registered, download the latest tools and SDKs. Currently, iPad development
    requires that you are running Mac OS X 10.6.2 on an Intel machine. The examples
    in this book were created using Xcode version 3.2.3 and iPhone SDK 3.2. We assume
    that you are using the modern simulator that was first shipped as part Xcode 3.2.3.


    Also, you can download all the projects for this book from the book''s home page
    at http://ipag.com/titles/sfipad. We have staged the projects so that you can
    follow or pick them up at a certain point to compare your work to ours.


    The templates supplied by Apple keep changing, so you would expect to see small
    differences now and then.


    Your favorite iPhone apps take advantage of all the capabilities of the iPhone
    in natural ways.³ They incorporate the accelerometer, the compass, the GPS, the
    camera, and the phone itself when it makes sense. In the remainder of the book,
    we will show you how to program the iPad, but it''s up to you to think about what
    to program.


    +   3 It will get tedious to say "iPhone and iPod touch" every time. We''ll often
    use one or the other to refer to the common platform.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# 1.3 Getting Started


    In this book, we assume you know how to develop iPhone apps. Maybe you''ve written
    an iPhone app or two for profit. You are certainly familiar with Cocoa, Objective-C,
    and the iPhone APIs. You are comfortable with the most recent versions of Xcode
    and Interface Builder. You know how to work with view controllers and delegates
    and can use reference counting to manage memory.


    That''s where we''ll start.


    We''ll create an iPhone app and quickly review some of the key concepts you''ll
    need to know in this book. These techniques are common to iPhone and iPad development.
    You will see this at the end of the chapter when we convert this from a project
    that works only on the iPhone and the iPad.


    By the end of this chapter, you will know you have the right amount of background
    for this book. Everything should be familiar, and the quick review should be enough
    to bring you up to speed for the remainder of the book. If you find yourself confused
    or if we''re moving too fast, then you may need to start with a book on Cocoa
    or iPhone development.4


    If you think we''re moving too slowly and you want to get right to the iPad material,
    start with the project in the FromTo/DailyShoot directory in the code download,
    and skip ahead to Section 1.8, Compatibility Mode.


    We''ll build a simple navigation-based application around The Daily Shoot website
    (http://dailshoot.com) created by Mike Clark and James Duncan Davidson. Their
    site has suggested a daily assignment for photographers since November 2009. In
    this type of app, users navigate through some number of levels of table views
    until they select an item and navigate to its detail view.


    +   4. You can start with Cocoa Programming: A Quick-Start Guide for Developers
    [Ste09] and/or iPhone SDK Development [DA09].'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Disappearing ivars


    If you''ve been programming for the iPhone for a while, then you''re probably
    used to a rhythm when declaring properties. You declare an ivar and the corresponding
    property in the header file, synthesize the property, and release it in the implementation
    file.


    Now with the new simulator released with Xcode 3.2.3, you no longer have to declare
    the ivar. The instance variable will be synthesized by the runtime in the simulator
    just as it has been on the device all along. Soon you won''t have to explicitly
    synthesize the property once “synthesize by default” is available as a compiler
    option.


    ![](img/06d76a71c379bfa5e6891245aa6bb22d_18_0.png)


    Our app will launch with a simple table that is filled with the numbers of the
    first 125 assignments. When a user selects a number, we will display the landing
    page for that assignment.


    There''s nothing fancy about this example, but it lets us up all of the machinery
    we need for a navigation-based application, and it sets the stage for the split
    view-based application in the next chapter.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'Start XCode, and create a new navigation-based application that does not use
    Core Data for storage. Name the project DailyShot.


    By the way, you may have noticed some important differences in the templates you
    have available. The Split View-based Application template is and can be used only
    for iPad-based projects. The Navigation-based Application and Utility Application
    templates can be used only for iPhone projects. The Window-based template can
    create an iPhone project, an iPad project, or a universal project that targets
    both platforms at once. The remaining templates can be used as the starting point
    for either iPhone or iPad projects, but you have to specify which using a drop-down.


    We''re not going to do anything with the app delegate or with the Main-Window
    nib. If this were a production app, we would take the time to change the name
    of the RootViewController class and the corresponding nib to something that has
    more meaning in the current setting. Because it''s easy to make an error while
    making these changes and because the changes have nothing to do with what we''re
    working on in this chapter, we''ll leave the names as they are.


    # Adding a Model Object


    A table view needs a data source that can answer three basic questions:


    +   * How many sections are in the table?

    * For each section, how many rows are in this section?

    * For each row, what goes in this row?


    In the project created for us from the template, the RootViewController is the
    table view''s data source. We''re going to add a model object to our project.
    This is the classic Model View Controller (MVC) decoupling. The view talks to
    the controller and the controller talks to the model.


    ![](img/06d76a71c379bfa5e6891245aa6bb22d_19_0.png)


