  md: '# CONVERTING TO A UNIVERSAL APPLICATION


    ![](img/06d76a71c379bfa5e6891245aa6bb22d_26_0.png)


    That''s pretty nice. Apple has provided an easy way for iPhone apps to run on
    the iPad without requiring any changes from developers. This compatibility mode
    is a convenience for developers, not one you should rely on. On the iPad, an iPhone
    app can be viewed at its original size. Also, just as on the device, you can click
    the 2x round button in the lower-right corner of your simulator to view the app
    at twice its original size.


    The good news is that this brings a ton of existing iPhone apps to the iPad, which
    allowed the new device to debut with a wide array of offerings. The bad news is
    that the look of these automatically adjusted apps isn''t sharp. One pixel becomes
    four—two in each direction. It will be difficult to see the pixelation in the
    screenshots, but you can see them immediately in the simulator and on the device.


    So, without doing any work, your iPhone app runs on an iPad. Your next step doesn''t
    require much work and results in an app that takes advantage of the full screen
    of the iPad in full resolution.


    # 1.9 Converting to a Universal Application


    Right now you have an iPhone app. Sure, you''ve seen it can run on both the iPhone
    and the iPad, but it doesn''t look native on the iPad. Even if your users aren''t
    bothered by the fuzziness, they probably notice that your app doesn''t take up
    all of their screen. This is in part because the aspect ratios of the iPhone and
    iPad are different.'
