  md: '# Volume Control


    You might have noticed that we''ve omitted a volume control in our design (as
    Apple has in its design), which may seem odd given users often expect a volume
    slider within playback controls. That said, Apple provides no direct method of
    controlling the MPMoviePlayerController''s volume and expects the user to adjust
    the volume through the physical volume button on the device.


    Here''s what we have in mind:


    ![](img/06d76a71c379bfa5e6891245aa6bb22d_161_0.png)


    For a first cut, that''s an improvement, isn''t it? Now, we haven''t gone crazy
    with branding or radically changed the controls—we''ll leave that to you and your
    applications—but we have implemented a more immersive control that is semitransparent
    and sits right in the middle of the video. We provide all the basics Apple does,
    and we''ve hinted at some new functionality that could be added (like the thought
    bubbles representing a sharing capability, which we won''t implement, but it is
    waiting for you). Note that we''ve also supplied our custom version of the slider,
    rather than the default Apple look and feel.


    Creating comps (graphic representations) of a new playback control is fairly easy,
    but implementing a playback control that functions well as Apple''s takes a bit
    of careful work. Let''s think about what a playback'
