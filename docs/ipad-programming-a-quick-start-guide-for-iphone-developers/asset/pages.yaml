    These new devices from Apple are keeping designers busy. You have a collection
    of images that you may have used in your iPhone app, and along with comes the
    iPad. So, now you may you go back to the drawing board. An image that might look
    great on an iPhone might look too small on an iPad, so you may be creating iPhone
    and iPad versions of your images the way we did with icons in the very first chapter
    of this book.


    The story doesn''t end there. The iPhone 4 has a new display with twice the number
    of pixels in each direction. If you don''t update your artwork to target this
    new device, you''ll get that same fuzzy look that we got in the first chapter
    when we used the compatibility mode to run our iPhone apps on our iPad. So if
    you are targeting the iPhone and the iPad, you need three different versions of
    each image for these three different screens, and you know that there will be
    more before long.


    We can ask our designers for three different versions of our digital assets, and
    in many cases this will be the right solution. Often, however, we can fairly draw
    some of the shapes that we need programmatically. It can be tedious, it can be
    a pain, but for simple examples it may be just the right choice.


    In this chapter, we''ll begin with the C-based APIs that have been around for
    years for drawing on the iPhone and the Mac. We''ll then use the newly introduced
    Cocoa UIBezierPath class, which is almost the same as its Mac OS X cousin, the
    NSBezierPath class.


