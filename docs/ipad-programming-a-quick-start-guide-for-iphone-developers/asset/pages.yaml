  md: '# 11.1 Summary


    This chapter has been full of many cool techniques, but what does it have to do
    with you? Actually, that''s a very important question to ask yourself even if
    you''re not creating an application where the use of these techniques is immediately
    obvious.


    At one point, iTunes was just an application for buying, burning, and listening
    to your music. Then this music application became Bonjour-aware, and suddenly
    iTunes has the ability to share your music and to discover and listen to other
    people''s music.


    In this chapter, we showed you two different strategies for discovering nearby
    devices that are running the same application you are. You''ve learned how to
    move data between these other devices and yours. The techniques are not simple,
    but on the other hand, they are not overly complicated. You should always consider
    how your app might become richer if it could discover one or more nearby instances
    of the same app running on another iPhone or iPad.'
  merge: -1
  pgno: 217
