  md: '# Chapter 7


    # The Movie Player


    At its core, the iPad is designed for media consumption; the large, inhand screen
    is perfect for graphic display, especially video. With an iPhone, you can display
    video only in a full-screen viewer, while the iPad''s SDK allows you to build
    video right into your applications and fully customize the user experience around
    it. The SDK also exposes the state of the player, so you can directly control
    the video and coordinate its playback with the rest of your application.


    In the next two chapters, we''re going to explore the movie player controller:
    embedding it in an application, overlaying other views on top of it, creating
    our own custom playback control and playlist, generating navigational thumbnails,
    and streaming content. If you''ve used video player frameworks in the past, you
    probably found them to be difficult to work with. With Apple''s new framework,
    we''ll have a sophisticated player running quickly.


    # 7.1 Setting Up a View for the Movie


