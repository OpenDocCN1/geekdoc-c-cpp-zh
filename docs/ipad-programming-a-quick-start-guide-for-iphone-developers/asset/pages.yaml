- img_proc: true
  md: "To solve this problem, we're going to introduce a new method, require-\nGestureRecognizerToFail,\
    \ of the UIGestureRecognizer base class, which\\allows us to require that one\
    \ recognizer fails before another gets its\nchance at recognizing a Multi-Touch\
    \ stream of events.\n\nThe requireGestureRecognizerToFail method can be called\
    \ on any recogn-\nizer has one parameter: another recognizer. Here's an example\
    \ of\nhow we use it:\n\n```\n[secondRecognizer requireGestureRecognizerToFail:firstRecognizer]\n\
    ```\n\nThe method causes the secondRecognizer to stay in its UIGestureRecogn-\n\
    nizerStatePossible until the firstRecognizer reaches its UIGestureRec-\nnizerStateFailed\
    \ state. If the firstRecognizer doesn't and instead reaches\neither the UIGestureRecognizerStarted\
    \ or UIGestureRecognizerState-\\Began, then the secondRecognizer changes its state\
    \ to UIGestureRec-\nnizerStateFailed state. In the case where the firstRecognizer\
    \ reaches its Uiges-\ntureRecognizerStateFailed state, then the secondRecognizer\
    \ gets its chance\nat recognizing the Multi-Touch events.\n\nGiven that knowledge,\
    \ we need to make sure that our delete recognizer\ngets chance at recognizing\
    \ the gesture before the swipe recognizer\nbegins its examination of the gestures.\
    \ To do that we're going to want\ntoll the requireGestureRecognizerToFail: method\
    \ on the swipe gesture\nrecognizer and pass it the delete recognizer.\n\nAfter\
    \ this discussion, developing the code is actually quite easy—all\nyou you need\
    \ to do is add one line below the creation of the swipe and\ndelete gestures in\
    \ viewDidLoad:\n\n```\ngestures/BubblesConflict/Classes/BubblesViewController.m\n\
    - (void)viewDidLoad {\n    [super viewDidLoad];\n\n    // previous gestureRecognizer\
    \ *deleteRecognizer code goes here\n\n    DeleteGestureRecognizer *deleteRecognizer\
    \ = =\n        [DeleteGestureRecognizer alloc]\n            initWithTarget:self\n\
    \            action:@selector(handleDeleteFrom:)];\n    [self addGestureRecognizer:deleteRecognizer];\n\
    \n    [swipeRecognizer requireGestureRecognizerToFail:deleteRecognizer];\n   \
    \ [deleteRecognizer release];\n    [swipeRecognizer release];\n}\n```"
