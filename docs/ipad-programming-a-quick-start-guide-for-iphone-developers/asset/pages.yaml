  md: "# How Do I Know Which Bit Rate the Player is Playing?\n\nUnfortunately, Apple\
    \ does not expose any method of determining the bit rate it is currently playing.\
    \ After you've set the player's content URL to an M3U8 file, the player handles\
    \ all the logic and provides no feedback in terms of switching between the available\
    \ streams. You can, however, be notified when the load of content changes in some\
    \ way (such as a video stall); we cover that in Section 9.4, Reacting to a Network\
    \ Environment, on page 174.\n\niOutlet to MoviePlayerViewController.h, and name\
    \ activityView; then, connect it in Interface Builder.\n\nWith that in place,\
    \ it's almost time to define the handleLoadStateDidChange method. First, though,\
    \ we need to know a little more about load states. The load states are defined\
    \ as an enum and include the following:\n\n+   - MPMovieLoadStateUnknown\nThe\
    \ load state is not known.\n\n+   - MPMovieLoadStatePlayable\nThe player is in\
    \ a state where video can be played, but it may run out of buffer.\n\n+   - MPMovieLoadStatePlaythroughOK\n\
    The player is ready to play with enough buffer to begin playback.\n\n+   - MPMovieLoadStateStalled\n\
    The player has stalled.\n\nNow, let's define handleLoadStateDidChange:\n\n```\n\
    moviePlayer/MoviePlayer3Streamed/Classes/MoviePlayerViewController.m\n\n(void)handleLoadStateDidChange:(NSNotification*)notification\
    \ {\n    MPMovieLoadState state = [player loadState];\n\n    if (state & MPMovieLoadStateStalled)\
    \ {\n        activityView startAnimating;\n    } else if (state & MPMovieLoadStatePlaythroughOK)\
    \ {\n        activityView stopAnimating;\n    }\n}\n```"
