- img_proc: true
  md: '# CHAPTER 9. APPLE''S HTTP LIVE STREAMING


    tools and background you''ll need to prepare your video for HLS. Although we''re
    not going to cover segmenting in detail, you do need to have some knowledge of
    the output of the Apple''s segmenter tool to understand how the client retrieves
    video from a web server.


    The segmenter process is depicted in Figure 9.1, on the preceding page—here the
    segmenter takes a video asset and produces a set of .ts files (the segments) along
    with a manifest file called a *playlist*—not to be confused with the playlists
    we implemented in Chapter 7, The *Movie Player*, on page 121). HLS''s manifest
    files are called M3U8 files, and here is an example:


    ```

    #EXTM3U

    #EXT-X-DURATION:10

    #EXT-X-MEDIA-SEQUENCE:0

    #EXTINF:10, no desc

    fileSequence0.ts

    #EXTINF:10, no desc

    fileSequence1.ts

    #EXTINF:10, no desc

    fileSequence2.ts

    #EXTINF:10, no desc

    fileSequence3.ts

    ```


    ```

    .

    ```


    ```

    #EXTINF:1, no desc

    fileSequence180.ts

    #EXT-X-ENDLIST

    ```


    The job of the manifest file is to describe every video segment that was generated
    from a given video asset (the usage is slightly different in live video applications,
    which are beyond the scope of our discussion here).


    Let''s step through the file. The first line identifies the file''s type. The
    next line, the target duration, describes how long each segment is (in this case
    ten seconds), while the third line provides a sequence number that is used for
    live streaming applications. Next, each segment is listed in order (for space,
    we''ve omitted some of the 180 segments), including its duration, an optional
    description, and finally the asset name for the segment.


    So, given this playlist, the media player first retrieves fileSequence0.ts followed
    by fileSequence1.ts, and so on. The player itself manages all the timing aspects
    of when to retrieve the segments and how to stitch them together to make the playback
    seamless.'
