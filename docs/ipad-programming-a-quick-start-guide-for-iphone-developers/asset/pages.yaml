    +   3. We'll provide our new application with the ability to ask for help when\
    \ it encounters a file type that it can't open itself.\n\nWe'll take these one\
    \ at a time.\n\n# 12.3 Registering File Types\n\nOur first step is to register\
    \ with the system that Feelings is able to open plain-text documents. You can\
