  md: '# Creating theSemitransparent Interface


    In general, you can make any interface element semitransparent by setting its
    alpha value less than 1.0. A setting of 0 is fully transparent, or invisible.
    Here''s how we create the semitransparent background shell for our interface:


    +   1. Uncheck the opaque setting on the PlaybackViewController''s view.

    2. Select the view''s background color, and set its alpha to 0. These two steps
    ensure that we can see through the entire view we''re creating; otherwise, the
    PlaybackViewController''s view would appear as a solid white view.

    3. Create your interface background in a tool like Photoshop, set its alpha value
    to semitransparent (in our case, .65), and then save the image in PNG format.

    4. Add the image to your main project, and create an UIImageView object in Interface
    Builder to hold the image.


    Note that you could also create a similar background grammatically, but you might
    choose an image if your interface includes a fair amount of realism or design
    that isn''t easily approached algorithmically.


    With "XIB for user interface" and "UITViewController subclass" are unchecked.
    Call the controller PlaybackViewController.m, and click Finish. Then open PlaybackViewController.h,
    and add the following IBOutlets (one for each view we will need access to our
    controller code):


    ```

    movieplayer/MoviePlayer6/Classes/PlaybackViewController.h

    @interface PlaybackViewController : UIViewController {

    IBOutlet UISlider *playbackSlider;

    IBOutlet UIButton *playPauseButton;

    IBOutlet UIButton *fullScreenButton;

    IBOutlet UILabel *statusLabel;

    IBOutlet UILabel *timeLabel;

    }

    }

    ```


    Return to Interface Builder, and connect each outlet to its appropriate view in
    the nib file. You''ll also want to click File''s Owner and set its class on the
    Identity tab to PlaybackViewController.'
