  md: "# CHAPTER 10. DISPLAYING CONTENT ON ANOTHER SCREEN\n\n![](img/06d76a71c379bfa5e6891245aa6bb22d_191_0.png)\n\
    \nFigure 10.1: SETTING UP A STATUS LABEL\n\n# 10.1 Detecting an Exernal Display\n\
    \nTo display content on an external monitor, you first need to know whether a\
    \ second screen is connected to the iPad. The UIScreen class provides two notifications,\
    \ UIScreenDidConnectNotification and UIScreenDidDisconnectNotification, that are\
    \ posted when a new screen is connected or disconnected from the iPad. Let's create\
    \ a simple view-based application that can detect when you plug or unplug an external\
    \ screen.\n\nStart by creating a new view-based application in Xcode ExternalDisplay.\
    \ Next, open the ExternalViewController.xib and add two labels, as shown in Figure\
    \ 10.1. Add an outlet to the ExternalViewController header file named statusLabel,\
    \ and connect it in Interface Builder to the status label (the label on the right\
