    # 4.9 Summary


    In this chapter, we looked at variations on modal views and popovers. We created
    a modal view that obscured the entire screen and one that occupied the center
    while dimming the nonresponsive areas of the screen. We created popovers when
    a portion of a view is tapped and when a button is pressed. We examined how to
    arrange the popover differently with respect to the UI component that initiates
    the presentation of the popover. We saw how to dismiss the popover following a
    user action, and we communicated from the popover or modal view back to another
    object.


    The basic pattern is one we''ll use throughout our iPad programming: we created
    a nib and did most of the work in the view controller that acts as the File''s
    Owner for that nib. When it is time to present a modal view or a popover, we need
    to make a few connections in each direction and bring up the new view containing
    the contents managed by our custom view controller. This is the same basic technique
    used to create custom table cells and other things.'
