  md: 'peers on a network. Both examples use Apple''s Game Kit framework and run over
    Bluetooth to work with devices that are within meters of each other.


    # 11.1 The Monty Hall Problem


    For our first example, we''ll use a puzzle based on the old television game show
    Let''s Make a Deal. The puzzle is named for the show''s long-time host, Monty
    Hall. In the puzzle there are three doors. Behind one of them is a desirable prize
    of some sort, and behind the other two there is nothing of value. The contestant
    chooses a door. The host opens one of the doors the contestant didn''t select
    to show that there''s nothing of value behind it. The host then gives the contestant
    the choice of keeping their original door or switching. The puzzle is whether
    the contestant should switch or whether it doesn''t make any difference.


    We''re creating two distinct applications. One will present the game from the
    contestant''s point of view, and the other will present the game from game show
    host''s point of view. We could also have created a single application that has
    the ability to be either the host or the contestant. In our case, the roles are
    so distinctive that it makes sense for one application to act as the server and
    the other as a client. It wouldn''t make sense for two contestants to find each
    other or for two hosts to find each other. On the other hand, if you were coding
    a card game, it might make more sense for the players to be.


    You''ll find our two applications in the code download. One is called Contestant.
    It is a view-based iPad application. The other is called MontyHall. We''ve decided
    to create it as a view-based iPhone application because many developers don''t
    have two iPads but have an iPhone or an iPod touch.


    We are using Game Kit to communicate between our two devices, so you will need
    to push each application to its respective device. Also, based on personal experience,
    you will be much happier with the results if you make sure that Bluetooth is enabled
    in both devices. You''ll need to do this in Settings.


    +   3. The solution is that the contestant should always switch. Playing the role
    of the host in this two-person game should help you of that.


    +   4. We, course, have created a universal application for both, but we wanted
    to keep the code focused on what is being taught here. Of course, you can connect
    multiple iPads, iPhones, or a mixture of the two.'
