    \ For now, though, we're working with the mechanics of notifications with the\
    \ MPMovieViewController—we’re going to return to a more complex example of notification\
    \ in the next section.\n\n# ## Digging into Notifications\n\nThe movie player\
    \ controller uses Cocoa's standard notification system. Here's a quick refresher:\
    \ to receive notifications, you can add an object as an observer to a named notification\
    \ (such as MPMovieDurationAvailableNotification) and supply a selector that is\
    \ called whenever there is a notification. You can also supply an optional payload\
    \ object that is passed to the observer upon each notification; if a payload object\
    \ isn't supplied (by using a value of nil), sending the notification is passed\
    \ along.\n\nHere's the code to register your MoviePlayerViewController to receive\
    \ the MPMovieDurationAvailable notification; we're going to place this new code\
    \ in the viewDidLoad method so that it is registered before the movie is installed.\
    \ We're setting movieDurationAvailable: as the selector for the notification,\
    \ so any time an MPMovieDurationAvailableNotification- method will be called.\n\
    \n```\nmovieplayer/MoviePlayer3/Classes/MoviePlayerViewController.m\n-(void)viewDidLoad\
    \ {\n    [super viewDidLoad];\n    [[NotificationCenter defaultCenter]\n     \
    \   addObserver:self\n        selector:(movieDurationAvailable:)\n        name:MPMovieDurationAvailableNotification\
    \ object:nil];\n```\n\n```\nself.player = [[MPMovieController alloc init];\nself.player.content\
    \ = [self movieURL];\n\nself.player.view.frame = self.viewForMovie.bounds;\nself.player.view.autoresizingMask\
