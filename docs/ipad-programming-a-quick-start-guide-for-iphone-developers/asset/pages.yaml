  md: '# 5.7 Summary


    In this chapter, you saw how easy it is to provide your own custom keyboard, add
    an accessory to one of the keyboards Apple provides, or both. Remember, though,
    that you should have a clear need that a standard keyboard does not meet. Your
    users are going to be very familiar with the built-in keyboards. Make sure there''s
    a compelling reason for using a nonstandard keyboard. Your custom keyboards add
    cognitive load. You need to be sure that they provide enough value to justify
    this effort.


    For example, here is a custom keyboard from Apple''s Numbers application:


    ![](img/06d76a71c379bfa5e6891245aa6bb22d_115_0.png)


    This nonstandard keyboard makes data entry for the selected cell faster and easier.
    Any time your user needs to enter text, you should first consider which of the
    standard keyboards to use, and then you should consider whether you can make their
    task easier by providing a custom keyboard. Remember, your goal is to make your
    app and the device disappear and allow you to concentrate on what it they are
    trying to experience or accomplish.


    As you''ve seen in this chapter, you don''t have to do very much to customize
    text input. You just need to set the inputView or inputKeyboardView property,
    configure it correctly, handle all appropriate actions, and make sure you move
    the elements around the keyboard properly.'
