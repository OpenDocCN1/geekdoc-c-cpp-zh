    # 12.2 Persisting Documents


    In our Feelings app, we were able to type text and emoticons into a text view.
    In that example, when we quit the application and relaunched it, we started with
    a blank slate. In most useful applications, you''re going to want to save your
    work so that when you relaunch, you can continue from where you were the last
    time.²


    On the iPad, you do this just as you would on any other computer. You need to
    specify the path to the document location, and you''ll need a way to read from
    files and write to files. What changes on the iPad from other environments in
    which you''ve enabled this sort of functionality are the expectations of your
    users. On the iPad, as the user types new text into a document, they don''t expect
    that they''ll have to manually save the document from time to time. They expect
    that you''ll take care of it for them.


    In the Feelings app, you may want to save the user''s work whenever they dismiss
    the keyboard. That act says, “I''m done editing for now.” You also may want to
    save your work when you quit the application.


    > ² If you''re working with multiple documents, you''ll need to present a gallery
    or some way for the user to select the document they want or to create a new one,
    but the rest of the details are unchanged.'
