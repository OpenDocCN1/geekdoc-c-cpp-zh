  md: "```\n[UIView setAnimationCurve:\n[userInfo objectForKeyKey:UIKeyboardAnimationCurveUserInfo\n\
    value];\n}\n```\n\nWe also need to adjust the text view by the height of the keyboard\
    \ and accessory. First, we'll calculate the ending height of the keyboard:\n\n\
    ```\n// TextInput/Feelings/Classes/FeelingsViewController.m\n-(CGFloat)keyboardEndingFrameHeight:(Dictionary\
    \ *)userInfo {\n  CGRect keyboardEndingUncorrectedFrame = \n  [[CGRectValue\n\
    \    [userInfo objectForKeyKey:UIKeyboardFrameEndUserUserInfo]\n    CGRectValue];\n\
    \  CGRect keyboardEndingFrame = \n  [self.convertRect:keyboardEndingUncorrectedFrame\n\
    \    fromView:nil];\n  return keyboardEndingFrame.size.height;\n}\n```\n\nNote\
    \ that we had to use the method convertRect:from: to convert the ending rectangle\
