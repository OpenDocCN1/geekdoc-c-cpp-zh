  md: '# Chapter 3


    # Using Gestures


    The iPad''s large surface isn''t just for viewing; it''s for getting your hands
    in the mix and using gestures to interact with your applications. Of course, the
    iPhone also uses Multi-Touch as its primary means of interaction, but its small
    screen constrains us from fully exploring gestures and ultimately limits our ability
    to create an immersive experience.


    There is another aspect of the iPhone that made using gestures in your applications
    challenging—the SDK. To write gestures, you had to copy and paste Multi-Touch
    code between classes and applications, without any convenient means for reuse.
    Beginning in iOS 3.2, Apple has refined the way gestures fit into the UIKit architecture
    and given you the ability to abstract and reuse gestures on the iPad (and as of
    iOS 4.0, you have the same tools available to you on the iPhone). Apple has also
    provided some ready-made gestures for you to use, including taps, pans, pinches,
    rotation, and swipes—and, if the built-in gestures don''t meet your needs, you
    can easily extend the new architecture and write your own.


    As you''ll see in this chapter, Apple has significantly improved the tools at
    hand to create gestures, but keep in mind there is a fair bit to know when using
    prebuilt recognizers (or writing new gesture recognizers), and in this chapter
    we''ll explore the gestures in detail; we''ll start by using and configuring prebuilt
    recognizers and add more sophisticated behavior, customizing and controlling how
    the recognizers behave. Finally, we''ll create a recognizer to look for our own
    custom gesture. Let''s get started!'
  merge: -1
