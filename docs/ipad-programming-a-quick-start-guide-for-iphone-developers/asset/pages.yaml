  md: '# Chapter 13


    # Putting It All Together


    Congratulations. You''ve delved into a lot of nooks and crannies of iPad programming
    while exploring the discrete topics presented in this book. We covered a wide
    range of split-view controllers to targeting external displays—from the new gesture
    APIs to getting your devices to communicate with each other. Although everything
    we''ve covered in this book was introduced for the iPhone 3.2 SDKs for the iPad,
    you''ll find many of them in iOS 4 for the iPhone as well. Most of the techniques
    you''ve learned in this book apply both to the iPad and to the latest version
    of the iPad and iPod touch.


    Throughout this book we''ve focused on showing how to do stuff at the technical
    level—how to show a movie


    We''ll finish this chapter and the book by thanking some of the many people who
    helped us with this project.


    # 13.1 Start with the User


    Before you write a line of code or create your first nib, you need to have a clear
    idea of who your app is for. Apple''s recommendation for iPhone apps is that you
    create a clear and concise product description. This advice is just as important
    for iPad apps.


    Know who your target audience is and what specific task your app is designed to
    perform. This will help you identify features that need to be included and—just
    as important—which features you should leave'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'out. A solid view of your user will help you determine whether you are creating
    a universal app, an iPad-only app, or two apps: one for the iPhone and one for
    the iPad.


    Feature creep is easy without a clear idea of your user and the problem you are
    solving for them. Someone will beta your app and say something like, “You know,
    it would be cool if you just added...” The feature they suggest may be to add
    and might be as cool as your friend suggests. But if it doesn''t fit into the
    core description of what the app does, it can make your app harder to use and
    less appealing to your target audience.


    # 13.2 Treat Landscape and Portrait Views with Equal Importance


    Pick up the iPhone with one hand. Whether you''re holding it to your ear to make
    a phone call or looking up something in a table view, you are probably holding
    it in portrait mode. Portrait is the preferred orientation on the iPhone—at least
    for now.


    The iPad is completely different. There is no natural orientation for the device.
    Sure, there''s a single Home button, but there''s nothing to encourage the users
    to operate the device with the button on the bottom. Also, some of the cases force
    a default landscape orientation with the Home button along the left side.


    You need to support both portrait and landscape modes in your application. You
    need to allow the user to start your app in either orientation, and you need to
    make the most out of whichever orientation you choose to use.


    # 13.3 Flatten the Hierarchy


    You have probably built up a bag of tricks for the phone, but you now need to
    reconsider some of your design decisions. A fundamental compromise you needed
    to make when targeting the phone was deep hierarchies. Your phone can display
    only a small amount of data at once, so you learned to use tab bars and nav controllers
    and helped the user move from screen to screen to navigate down to the level of
    detail that they need.


    Technically, all of these techniques still work on the iPad. But stop and reconsider
    your app from a design and usability standpoint. You can'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'now display more information at once on a single screen in a way that is more
    easily understood by your user.


    We saw an example of replacing a navigation controller for iPhone with a split
    view on the iPad. In the iPhone version, the user selected a row, and the detail
    view replaced the table view. If the user wanted to go back and see what other
    choices are available, they had to hit the Back button on the detail view to return
    to the table view.


    On the iPad, we could use the split view to display the table view on the left
    side and the detail view in the rest of the screen. The user could make a choice
    and see the detail view without losing sight of their other choices. Even in portrait
    view these choices are in a popover that the user can bring up with the touch
    of a button without losing the current detail view. Look to flatten the hierarchy
    in application as.


    # Create Immersive, Rich, Realistic Views


    If you were an developer before the arrival of the iPad, you know that Apple''s
    recommendation has typically been to stick to the Apple UI guidelines, using standard
    UI components and creating custom views only in extreme cases.


    Those recommendations have changed with the iPad, and Apple is now encouraging
    you to build interfaces that are based on real-world realism. You only have to
    look as far as eBooks, the calendar, and many third-party applications to see
    great examples. When you design your applications, consider creating views that
    reflect your application''s real-world counterpart (assuming there is one). Employ
    a designer if needed. This isn''t to say that you shouldn''t use standard components
    where they make sense: these will help your users navigate your application.


    # Gestures Are Powerful


    With iOS 3.2 (and 4.0 on the iPhone), Apple has given us a powerful API for easily
    adding gestures such as taps, pans, pinches, rotations, and swipes. Study these
    carefully, and make sure you are using them in a manner that is expected by your
    users (Apple Human Interface Guidelines [App10a]); the last thing you want to
    do is make your users gestures in an unconventional, confusing way.


    That said, Apple''s new APIs also give you the power to create your own unique
    gestures, and although these should be used sparingly, the'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# CHAPTER 13. PUTTING IT ALL TOGETHER


    vocabulary of gestures is still evolving. Who''s to say you won''t invent the
    next gesture or at least a new one that makes sense for your unique application?


    # 13.6 Your iPad Wants to Collaborate


    At some point during your development cycle, ask yourself, “What changes if my
    stand-alone application could communicate with other nearby instances of the same
    application?” Perhaps an application that you''ve designed to allow people to
    create documents becomes an application that also allows people to collaborate
    on a document. Perhaps an app that you''ve designed to allow people to record
    their ideas becomes an app that also allows people to share and compare ideas.


    You''ve seen in this book that the mechanism of communicating between devices
    is pretty straightforward. You decide whether the relationship between instances
    is client-server or a collection of peers, and then you respond to delegate methods.
    The business decisions are the difficult ones. What do you want to be able to
    accomplish by collaborating? The possibilities are endless.


    # 13.7 Docs


    You have an iPhone, an iPad, and a laptop—how hard should it be to get a document
    you''ve created on one device onto another device? It turns out, with the iPhone
    3.2 SDK, the answer is “Not that hard.” You can easily support moving documents
    from one device to another any time you sync during iTunes.


    We also looked at how we build an ecosystem of applications that know how to handle
    different document types. You saw how easy it was to let the system know that
    your application can support certain types of documents and how to enable your
    document to use the help of other applications to open documents that your app
    doesn''t support.


    # 13.8 Video Matters


    If video makes sense in your application, then you now have the tools to build
    compelling experiences with video embedded directly into your views. Beyond that,
    the video APIs give you all the functionality you need to synchronize your interface
    to the video, and vice versa. Think'
  merge: -1
  pgno: 233
- img_proc: true
  md: 'about taking video beyond the “video in a web page” model, and explore true
    interactive experiences including bonus information, social features, and shared
    viewing experiences (for starters).


    # 13.9 External Displays Require a Custom Implementation


    As much as you''d like to just plug your iPad into an external monitor and have
    the display mirrored, that isn''t how the iPad works; to display content on the
    second screen, you will need to create and manage a separate view hierarchy.


    Although this might seem like a pain, it can be used to your advantage. Consider
    routing the video in your sports application to the big screen while using the
    iPad to switch between camera angles and monitor the game statistics. Or, play
    the moderator of a game show where puzzles are displayed on the large screen while
    you run the game from your iPad. Get creative with your second screen!


    # 13.10 Improve Your Quality of Service with Streaming Video


    For your application, you''ll also need to consider whether video can be included
    directly into your bundle or needs to be streamed to your application. If the
    answer is streaming, then you''ll need to nail down the details of segmenting
    and hosting to support Apple''s HLS protocol, particularly if you are delivering
    high-value or high-quality content.


    There''s a learning curve to preparing content for HLS, but it is worth the effort
    given video player will adapt to the available bandwidth, even if it changes over
    time.


    # 13.11 Acknowledgments


    This book has been a lot of fun for both of us.


    We both thank the tech reviewers and readers who submitted errata. The feedback
    was so helpful. In particular, thanks to Kim Shrier who bought the beta and provided
    us with excellent suggestions throughout the beta process. Janine Sisk gave us
    detailed suggestions during tech review that improved this final version immensely.
    Carlos A. Weber, MD, and Paul Lynch gave excellent technical reviews, and Elisabeth
    Robson and Joe Heck also helped the quality of the book.'
