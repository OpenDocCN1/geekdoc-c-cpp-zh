  md: '# Preparing and Finishing


    Presenting a modal view or a popover is like the job of house painters. Although
    they need to take care in applying the final coat, the real work is done in preparing
    the surface and getting everything ready for the final coat. The code for presenting
    and dismissing our view is fairly concise. Most of the work involves preparing
    the controller and nib that will be displayed.


    ![](img/06d76a71c379bfa5e6891245aa6bb22d_91_0.png)


    +   - (IBAction) dismiss {

    [self dismissModalViewControllerAnimated:YES];\}


