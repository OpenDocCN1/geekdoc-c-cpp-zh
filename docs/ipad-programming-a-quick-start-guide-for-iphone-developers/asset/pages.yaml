  md: '# CHAPTER 3. USING GESTURES


    ![](img/06d76a71c379bfa5e6891245aa6bb22d_83_0.png)


    Figure 3.6: COMPETING DELETE AND SWIPE GESTURES


    to the right quite a distance. At first this looks like a swipe gesture, but then
    we perform the necessary movements to make it a deletion gesture—at least that
    is how we think it should work. But if your experience is like ours, you will
    see that this often (if not always) gets recognized as a swipe gesture, and your
    entire board is erased.


    To finish off this chapter, we''re going to fix this behavior by making sure the
    delete gesture has a chance to be recognized before the swipe gesture completes.
    To understand how this works, we first need to talk about how two gestures on
    the same view operate. In our case, we have several gestures installed on our
    main view: a single tap, a swipe gesture, and our custom delete gesture. As touch
    events are received, they are routed to all three of these recognizers. In our
    example, the swipe gesture sees touch events that tell it there is a swipe, and
    it recognizes the swipe before we start the delete part of our gestures. In some
    implementations, this may actually be the behavior you want, but in this example,
    it feels wrong, so we want to alter the recognizers a bit to allow a single delete
    to take precedence over the swipe gesture.'
