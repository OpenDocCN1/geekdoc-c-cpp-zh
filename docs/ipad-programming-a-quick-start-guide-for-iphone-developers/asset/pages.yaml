    # How Gesture Recognizers Really Work


    Think of gesture recognizers as simple state machines that transition between
    states based on the touch events they receive while the user interacts with the
    screen. All recognizers start in the same state: the UIGizerStatePossible state,
    which indicates that the recognizer is examining touch events to find a gesture.
    Once a gesture is recognized, the discrete gestures transition to the UIGRecognizerStateRecognized
    state. If, on the other hand, the recognizer fails to find a gesture, it reaches
    the UIGRecognizerStateFailed state.


    Continuous gestures handle things a little differently: unlike gestures, they
    stay in the UIGRecognizerStatePossible state, but when a continuous gesture is
    first recognized, the recognizer moves to the UIGRecognizerStateBegan. Then as
    the gesture changes over time, the recognizer changes the state to UIGRecognizerStateChanged.
    In fact, as the gesture continues to change, the recognizer will keep setting
    its state to UIGRecognizerStateChanged. From the changed state, continuous recognizers
    follow two paths: either the user lifts their fingers and the gesture moves into
    the UIGRecognizerStateEnded state or the recognizer can decide the gesture no
    longer being satisfied and may switch to the UIGRecognizerStateCancelled state.'
