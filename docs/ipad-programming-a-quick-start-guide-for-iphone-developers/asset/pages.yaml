    # 7.3 Being Notified


    The MPMovieController class supports a rich set of notifications that you can
    use to keep informed about the state of movie playback. As you might expect, you
    can be notified for playback events, such as stop, pause, and end events, but
    you can also receive notifications for the following:


    +   * The availability of metadata about the video

    * Changes to scaling and video resolution (including changes to from full-screen
    mode)

    * Changes to state based on the loading of network-based video

    * The availability of generated thumbnails (we''ll come back to this later)


    We won''t cover all these in detail, but we will work through the mechanics of
    using the MPMovieController classes'' notifications and also work with the thumbnail
    capability in a later section.


    For now, let''s return to the problem of accessing properties (such as the video''s
    duration) before the player has loaded enough of the video to have that information.
    Using notifications, we can solve this problem by registering to receive a notification
    when metadata is available. Here are the metadata-based notifications we can receive:


    +   * MPMovieDurationAvailableNotification: Sent when the video duration has been
    determined

    * MPMediaTypesAvailableNotification: Sent when the audio and video types have
    been determined

    * MPMovieSizeAvailableNotification: Sent when the width and height of the video
    are known'
