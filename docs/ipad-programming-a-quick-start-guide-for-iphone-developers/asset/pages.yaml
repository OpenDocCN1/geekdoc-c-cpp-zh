  md: '![](img/06d76a71c379bfa5e6891245aa6bb22d_72_0.png)


    Figure 3.5: THE STATES OF A CONTINUOUS GESTURE RECOGNIZER


    Let''s think about these different types of recognizers in context: take a discrete
    recognizer, such as the single-tap recognizer. This recognizer begins life in
    the UIGestureRecognizerStatePossible state, and as soon as a touch event arrives
    that is a tap, it simply moves to the UIGRecognizerStateRecognized state. On the
    other hand, a continuous recognizer for the pinch gesture. Here the recognizer
    enters the UIGestureRecognizerBegan when two fingers are placed on the surface,
    and as the fingers perform the pinch, the recognizer repeatedly sets the UIGestureRecognizerChanged
    state. Once the user removes her finger, the recognizer sets the UIGestureRecognizerEnded
    state.


    # ## Creating a Deletion Gesture


    With that background in mind, let''s talk about the gesture we''re going to implement:
    if you were ever exposed to the Apple Newton, you might remember a gesture that
    required that you make a zig-zag pattern over an object, similar to the pattern
    you''d make with a pencil eraser. Upon recognition of that gesture, the Newton
    deleted the underlying object.'
