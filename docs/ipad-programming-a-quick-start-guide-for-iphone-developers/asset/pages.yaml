  md: '# Chapter 11


    # # Connecting Devices


    The iPad has a big enough screen that you could easily play all sorts of board
    games on it. You could play Chess, Go, Backgammon, and so on. You couldn''t hold
    the items we need from other players''² to see the cards that another is holding.
    That eliminates games such as Mastermind, Scrabble, Battleship, and most competitive
    card games.¹


    Or does it?


    What if we didn''t just use one iPad for game play? What if we used more than
    one iPad or one iPad as the common board and iPhones and iPod touches to hide
    from other players?²² It seems kind of silly to use thousands of dollars of devices
    to replace a two-dollar deck of cards, but start to think about what changes when
    groups of people have compatible devices. What new kinds of experiences can you
    create for multiple connected devices that don''t quite make sense for a solo
    device? As you build your app, you should consider ways in which it can become
    more powerful if it could find other instances of the app nearby.


    In this chapter, we''ll look at two simple examples that demonstrate different
    techniques you''ll use to communicate between your iPad and a second device. In
    the first example, we''ll create a server and client network to implement a classic
    problem known as the Monty Hall problem. In the second example, we''ll implement
    a simple peer-to-peer chat system that demonstrates a different way of discovering
    and connecting to


    +   1. The rights to Mastermind are held by Invict Places, the Scrabble rights
    are held by Hasbro, and the Battleship rights are held by Milton Bradley Company.

    2. You''ll find examples on the App Store of these multidevice apps for all sorts
    of games and for more serious applications.'
  merge: -1
  pgno: 202
