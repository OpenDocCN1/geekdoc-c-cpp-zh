  md: '# # Chapter 10


    # # Displaying Content on Another Screen


    Apple provides a set of adapter cables, such as the iPad Dock Connector to VGA
    Adapter (composite and component versions are also available), that allow you
    to connect your iPad to an external screen, such as a large projector or monitor.
    Now, you might expect, particularly after Steve Jobs demo the iPad in his keynotes,
    that this adapter is used to mirror your iPad''s main screen on an external screen.
    That''s not the case, and unfortunately, whatever Steve is using to mirror his
    iPad, it isn''t available to the rest of us. That said, for many applications,
    mirroring the display isn''t the best option anyway; for instance, consider a
    presentation application where you want the audience to view your slides on the
    external screen while you''re looking at a set of notes on the main screen.


    In this chapter, you''re going to learn how to integrate a secondary screen into
    your applications. To do that, you need to understand how to detect the second
    screen, how to get a reference to its object, and how to create views on it. You''ll
    need need consider how you want to use this second screen (and remember it isn''t
    a Multi-Touch display that the user is directly interacting with). We''re going
    to start with a simple application that looks for an external display and then
    build from there, all the way to displaying full-screen video.'
  merge: -1
