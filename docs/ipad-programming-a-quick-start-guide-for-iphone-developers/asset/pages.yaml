  md: '# iPad Programming


    This quick-start guide will have you writing iPad applications in no time. You''ll
    use a combination of the familiar iPhone APIs along with the new APIs and additional
    templates designed specifically for creating iPad applications. You''ll learn
    all about the:


    +   - Moving from the iPhone to the iPad

    - Working with the new split view

    - Using gestures to interact effectively on the big screen

    - Interacting with popovers and modal dialogs

    - Creating and using custom keyboards


    Every time you turn around it seems like there''s another 10,000 apps added to
    the App Store for the iPhone. If you''re building iPad-specific apps, you''re
    looking at a brand new opportunity. In this book, we don''t just teach you to
    write apps that run on an iPad; we teach you to create apps that delight your
    iPad users.


    > Daniel H Steinberg is an author, trainer, and programmer at Dim Sum Thinking.
    He wrote Cocoa Programming: A Quick-Start Guide for Developers, the Pragmatic
    Programmers'' best-selling book on developing Cocoa applications for Snow Leopard.

    Dr. Eric Freeman is an author, educator, and technology executive whose best-selling
    books include Head First Design Patterns and Head First HTML & CSS.


    ![](img/06d76a71c379bfa5e6891245aa6bb22d_251_0.png)'
