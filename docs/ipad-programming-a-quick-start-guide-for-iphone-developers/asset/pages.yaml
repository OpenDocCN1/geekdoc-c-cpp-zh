  md: '# CHAPTER 12. WORKING WITH DOCUMENTS


    Create a new view-based iPad app named SingleFile. Add the following to SingleFile-Info.plist
    to allow syncing using iTunes:


    ```

    <key>UIFileSharingEnabled</key>

    <true/>

    ```


    Build and run on the device. Quit SingleFile, and sync your iPad. You should now
    be able to add a file to SingleFile in iTunes. Add the text document that you
    created before. We''ll use the name Mood.txt in the book, but you can use another
    name if you prefer.


    When the SingleFile application launches, we want to open the Mood.txt file. Unfortunately,
    SingleFile doesn''t have a clue what to do with a plain-text document. It needs
    help, and that''s where the UIDocumentController comes in. We use one for each
    document. Declare a property of type UIDocumentinteractionController in the view
    controller header file:


    ```

    files/SingleFile1/Classes/SingleFileViewController.h


    import <UIKit/UIKit.h>


    @interface SingleFileViewController : UIViewController {

    }

    @property (nonatomic, retain) UIDocumentInteractionController *controller;

    -(void)applicationDidFinishFinishLaunching;


    @End

    ```


    We''ve also declared the method applicationDidFinishFinishLaunching;, which you
    should call from the end of the app delegate''s application:didFinishLaunchingWithOptions:
    method.


    We''ll lazy initialize the controller in the getter.


    ```

    files/SingleFile1/Classes/SingleFileViewController.m


    -(UIDocumentInteractionController *)controller {

    if (controller == nil) {

    NSString *applicationDocumentsDirectory = [NSearchPathForDirectoriesInDomains(NSDocumentDirectory,NSUserDomainMask,YES)
    lastObject];

    NSString *fileLocation = [applicationDocumentsDirectory stringByAppendingPathComponent:"Mood.txt"];

    self.fileURL = [NSURL fileURLWithPath:fileLocation];

    self.controller = [UIDocumentInteractionController controllerWithURL:self.fileURL];

    }

    return controller;

    }

    ```'
