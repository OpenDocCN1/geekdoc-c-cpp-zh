    # 6.5 Using Bezier Curves


    The UIPath class allows you to draw two types of bezier curves. The quadratic
    curve is specified by two endpoints and a single control point that defines the
    tangent directions at each endpoint.


    In code we use the addQuadCurveToPoint:controlPoint method. We specify only two
    points: the ending point and the control point. The starting point is equal to
    the current value of the path''s currentPoint property. The resulting curve is
    a quadratic that starts at the currentPoint with initial direction equal to the
    vector defined by the currentPoint and the control point. The curve ends at the
    ending point, which is passed as the first parameter to the method with a final
    direction equal to the vector defined by the control point and this ending point.'
