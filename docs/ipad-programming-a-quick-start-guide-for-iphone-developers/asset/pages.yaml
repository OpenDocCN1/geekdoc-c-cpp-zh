    iPad application. Once we''ve done that, we''re going to step back and look at
    the MPMViewController architecture in detail and make our implementation a lot
    more interesting. We''ve already prepared a project for you in the MoviePlayer
    folder (if you prefer to really start from scratch, you can create a view-based
    project). Open the project, and you''ll find that we''ve added a video to the
    Resources directory called'
