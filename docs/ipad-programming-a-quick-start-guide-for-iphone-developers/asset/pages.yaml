  md: '# 12.1 Transferring Documents Using iTunes


    In Section 6.6, *Saving Our Drawing as a PDF*, on page 118, we drew our warning
    symbol in a PDF file that we saved in the Documents directory. Each application
    has its own Documents directory, and until iPhoneOS 3.2, the contents of this
    directory were invisible to the user. With a simple addition to the application
    plist, you''ll be able to transfer files from and from your host computer using
    iTunes.


    Open the version of the Bezier project that you used to write the PDF. You should
    find this in the code you download in /code/Drawing/Bezier12/directory. Open Bezier-info.plist
    with a text editor, and add the following key-value pair to the dictionary:


    ```

    <key>UISharingEnabled</key>

    <true/>

    ```


    If you prefer, you can double-click the list and use the plist editor to add the
    entry. The corresponding phrase in the drop down list is Application supports
    iTunes file sharing.


    | Key | Value |

    |---|---|

    | Information Property List | (14 Items) |

    | Application supports iTunes file sharing | |


    If the Bezier app is already on your device, delete it so that our new settings
    will be picked up when we sync in iTunes.


    Now build and run the app with the device. Once you have run the app on the device,
    quit the app and sync your iPad using iTunes. When you''re device is selected,
    on the bottom on the Apps tab you should see something like Figure 12.1, on the
    next page.


    That''s all it to enable document transfers between your computer and your iPad.¹
    The documents you add will be stored in the top level of the application''s Documents
    directory.


    Save Warning.pdf to your computer by dragging out of iTunes, and then open it.
    You''ll see the warning symbol we drew on the iPad. You can add files to the iPad
    from your computer, but it won''t do any good. The Bezier app doesn''t know how
    to open any files. Let''s modify the Feelings from Chapter 5, *Custom Keyboards*,
    on page 93.


    +   1. You can also transfer files over the network using Bonjour, email documents
    to your-self, and open them on your iPad or download them in Safari. Those details
    are beyond the scope of this book.'
