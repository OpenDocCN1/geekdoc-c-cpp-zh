  md: '# iPad Virtual Bubble Wrap


    Who would have thought that the Sealed Air Corporation invented BubbleWrap™ in
    1957 would take on a life of its own as an addictive and satisfying activity for
    all-ages?¹ After all, when presented with a fresh sheet of all those air-filled
    bubbles, who doesn''t want to start popping them?


    Of course, another invention, the Internet, came along and brought it with virtual
    wrap; and today, all you have to say is “bubble wrap” to hear the response “There’s
    an App for That!” Bubble wrap has found its way onto the iPhone. What’s next?
    Virtual bubble wrap for the iPad, of course—just imagine all that space and Multi-Touch
    gestures devoted to popping simulated, air-filled bubbles.


    In this chapter, we’re going to create our own virtual bubble wrap application
    and fully explore the new gesture APIs in the process. Rather than present a conventional
    sheet of bubbles that can be popped, we are going to use gestures to make things
    you will create your own custom bubble wrap layouts (through tap gestures), pop
    all the bubbles you want (using the tap gesture in a slightly different manner),
    resize bubbles (with a pinch gesture), swipe the screen and start over (through
    a swipe gesture), and even implement a custom gesture that will allow you to delete
    bubbles.


    To get started, we’re going to do the following:


    +   1. Create a simple view-based application to act as a “bubble sheet.”


    +   2. Use a built-in gesture to capture “tap” and place a bubble on the sheet
    for each tap.


    +   3. Reuse this tap gesture to pop the bubble.


    Once we have the basics, we’ll circle back and add resizing, swiping, and deletion—all
    through gestures.


    > 1. If you aren’t familiar with BubbleWrap, it is a transparent sheet of plastic
    embedded with air-filled bubbles that is used as a protective means of packaging
    items for shipping. Many of entertainment have resulted from squeezing the air
    bubbles (and producing the loud pop that accompanies it).'
