    UIKit views and you have even passing familiarity with Multi-Touch events, understanding
    the new gesture design is straightforward. The new architecture revolves around
    gesture recognizers you can instantiate and attach to any view. These recognizers
    act as observers of Multi-Touch events and get a peek at before your views do.
    Recognizers process Multi-Touch events until their gesture is recognized and then
    send an action message to a target that you specify; if your recognizer doesn''t
