  md: 'We''re going to implement a recognizer that recognizes the same gesture, and
    then we''ll use it to delete an underlying bubble. Think for a minute about how
    you''d write code to detect this gesture. Although there are many ways to analyze
    the Multi-Touch events to look for an eraser-like motion, we''re going to see
    how far a simple heuristic can get us.


    Here''s how our heuristic works: notice the delete gesture is really just an upward/downward
    motion that we can track by simply watching the motion around the y-axis. If there
    is a change from increasing to decreasing (or vice versa) In the y value, we know
    the direction of movement has changed. Further, if we count the changes, then
    we can, after two or three changes, decide this is a deletion gesture. Of course,
    this isn''t perfect, and that''s why we call it *heuristic*. What could go wrong?
    Well, a user might make a long swipe motion that undulates a bit too much, causing
    the swipe look like a deletion. Or depending on the swipe algorithm (which has
    no details) perhaps a deletion gesture that is too wide might be interpreted as
    a swipe. How big a problem is this? It''s not a big one, as you''ll see, but might
    find it happens now and then, given that the gestures have some similarity. That''s
    OK; we''ll fix this later in this chapter.


