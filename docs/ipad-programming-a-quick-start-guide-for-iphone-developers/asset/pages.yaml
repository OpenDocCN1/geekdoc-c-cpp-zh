  md: '# 5.3 Responding to Custom Buttons


    We''re going to enable the buttons so that when they are pressed, they do the
    work of multiple key presses. So, for example, here''s what you should see when
    you press the angry button:


    ![](img/06d76a71c379bfa5e6891245aa6bb22d_108_0.png)


