  md: '# CHAPTER 1. From iPhone to iPad


    If you are explicitly developing for both the iPhone and the iPad, you have three
    basic choices:


    +   - You can create a universal application from a single target in a single
    project. This will produce a binary file that will run the iPhone version on the
    iPhone and the iPad version on the iPad. The user buys and downloads a single
    application, and it behaves differently depending on the device onto which it
    is installed. If you are essentially writing the same application for both platforms,
    you should prefer this approach.

    - If the iPhone and iPad applications are different from a user''s perspective
    but share a lot of code, you should produce two binaries. In other words, you
    will have one project with two targets.

    - If the iPhone and iPad applications are different from a user''s perspective
    and they do not share any files, then you may want to create two distinct projects.
    This is the least preferred option.


    We are going to choose the first option and run our iPhone application into a
    universal application so that it can run on an iPad or an iPhone. For now, we’re
    going to run the exact same application on both platforms. In the next chapter,
    you’ll see how to change the look and feel on each platform.


    In Xcode, select the target name DailyShoot, right-click it, and select “Upgrade
    current target for iPad."


    ![](img/06d76a71c379bfa5e6891245aa6bb22d_27_0.png)


    You can also find this option as a menu item in the Project menu.'
  merge: -1
