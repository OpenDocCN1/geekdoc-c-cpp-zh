  \n## 工具使用\n\n## 生成式 AI 中的工具使用\n\n我们讨论的是用于 引擎的工具，而不是开发者用来创建模型和引擎的工具。`LLM` 需要工具来像人类一样完成更高级的任务。一些\
  \ `LLM` 难以完成的任务包括：\n\n- 获取实时或最新的信息（例如股票价格或最新的 AI 论文）。\n- 超出基础算术的计算相关问题。\n- 仅存在于特定位置（例如公司的内部\
  \ ERP 数据库）。\n- 特定时间或特定位置的信息。\n\n`LLM` 可以使用的另一种工具是那些为你执行操作的工具，例如发送电子邮件。不过，我们将在智能体架构章节中主要讨论这些。\n\
  \n另一个简单的例子是，如果有人问你时间，你会看表（或手机）。如果你问 `LLM` “现在几点了？”，它的训练集中没有内容可以正确回答这个问题。唯一的方法是使用集成到\
  \ `LLM` 中的时钟，并由 引擎作为回答查询的一部分执行。在这种情况下，时钟是 `LLM` 的“工具”。\n\n`LLM` 使用的工具集成术语仍在演变，工具能力本身也是如此。你可能会听到的其他词包括：\n\
  \n- 插件（Plug-ins）——指 `ChatGPT` 版本中的数据源集成。\n- 函数调用（Function calls）——因为这就是本地集成工具的本质。\n\
  \n工具是 AI 架构中非常高级的部分。在你的初尝试中，你不需要担心它们。但如果你想将 `LLM` 的能力扩展到训练数据集之外的任何内容，那么工具就是实现这一点的方法。\n\
  \n### 工具类型\n\n引擎可以使用多种类型的工具：\n\n- 数据工具\n- 动作工具\n- 计算工具\n\n数据工具是在不进行额外微调的情况下，将新数据集成到\
  \ `AI 模型` 中的方式。`RAG` 架构是集成这些工具的典型方式。“检索器”（retriever）组件查找相关数据，然后由 引擎将其转换为答案。这就是许多业务聊天机器人学习整个网站数据的方式，而且\
  \ Bing 或 Google 提供的 AI 搜索可能也使用了类似的架构。\n\n动作工具是 引擎可以改变某些内容的方式，而不仅仅是输出文本。例如，它可以与你的内部财务应用集成，以提交员工报销单（如果是双向集成，那么它还可以访问财务应用的数据，这更像是一个数据工具，而不是动作工具）。\n\
  \n考虑此问题的方法之一是从“只读”与“读写”工具接口的角度来看。数据工具主要是只读工具，而动作工具也可以写入数据。\n\n计算工具是 `AI 模型` 可以调用以生成结果的计算应用。例如，如果它检测到数学计算，它可能会启动该工具来回答数学问题。模型必须接受如何启动工具以及何时启动特定工具的训练。工具的示例包括：\n\
  \n- 数学工具（例如计算器、转换器）\n- 时钟和日历（用于时间/日期计算）\n\n\n\n\n\n# 润色工具（例如 `wordcount`）\n\n##\
  \ 工具架构\n\n具备工具能力的大语言模型（LLM）曾被称为工具增强型语言模型（TALMs），但这一术语已很大程度上被弃用。对于如今的 LLM 而言，工具使用是基本门槛，它只是其训练方案的一部分，就像高蛋白蛋奶酒一样。LLM\
  \ 在工具方面的训练通常是通用的，涉及以下问题：\n\n* 针对用户查询，决定是否使用工具。\n* 针对特定查询，选择应具体使用哪种工具。\n*   从用户查询中提取参数并发送给工具。\n\
  *   工具及其“函数调用”请求所需的输入格式（通常为 `JSON` 或 Python 脚本）。\n*   工具返回的输出格式（例如：`JSON`、`HTML`\
  \ 或纯文本）。\n*   如何利用工具结果得出最终答案。\n\n工具的使用旨在对用户隐藏。正常的用户交互不会看到工具调用的发生过程，因为 LLM 在其自己的沙箱中完成所有操作，然后将最终结果以总结的形式呈现出来。正常的序列是：LLM\
  \ 接收用户查询，决定需要调用工具，等待工具结果，然后将工具输出汇总为易读的文本。然而，构建基于 LLM 应用的开发者可以查看工具函数调用的轨迹及其结果。\n\n\
  一个主要的局限性是 LLM 的工具使用是无状态的。LLM 通常不会从、甚至不会记得从某次工具交互中接收的结果。工具接口可能支持缓存，这可以提高速度，但无法帮助\
  \ LLM 更好地利用工具，或从其看到的工具输出结果中学习任何知识。\n\n## 工具是如何集成的？\n\n就像人类一样，当有人问及时间时，AI 需要学会看表。这需要特定的数据集来告诉\
  \ AI 在何时使用何种工具。\n\n在 LLM 早期，仅使用了极少数的内部工具。然而，现代 LLM 现在通常具备提交新工具接口规范的能力，通常通过 `JSON`\
  \ 配置文件实现。这意味着你可以为特定的业务目的创建并添加新工具，而无需对这些这些功能强大的 LLM 进行任何微调。\n\n在推理期间，AI 引擎必须在 LLM\
  \ 的输出中识别出必须执行某项工具。并非所有查询都需要工具，因此 LLM 的输出结果可能指示也可能不指示工具的使用。实现这一目标有多种方法：\n\n* 工具特定标记\
  \ —— 即 LLM 可以发出一个“触发”标记来运行工具。请注意，此处可以使用 `PEFT` 来微调新的工具能力，只需向词汇表中添加几个新的工具触发标记即可。\n\
  * 占位符模式 —— 即输出诸如“--在此处插入当前时间--”的特殊模式是另一种方法，引擎随后寻找这些模式，这避免了在词汇表中添加工具标记，但效率较低（因为输出中存在多个文本标记）。\n\
  * JSON 数据处理 —— 这是 OpenAI API 采用的方法，某些模型经过训练，可以返回 `JSON` 格式的文本来指示函数调用。在这种情况下，必须由客户端调用工具，而不是\
  \ OpenAI 服务器。模型也可以在服务器端自动调用工具，但这种对客户端的控制程度较低。OpenAI API 支持 `tools` 和 `tool_choice`\
  \ 参数，这些参数对工具启动过程提供了一定的控制。\n* 代码生成 —— 有各种 AI 模型可以生成代码（如 Python），并通过执行这些代码来生成答案。这是一个通用解决方案，因为\
  \ Python 可以调用各种子模块，从而生成许多工具。\n* 多级规划 —— AI 首先生成一个回答查询的计划，包括使用哪些工具，然后运行相关工具，最后进行另一次推理查询将其汇总为最终答案。\n\
  \n工具对任何类型的 LLM 来说都有价值。它们可以增强任何 AI 应用产生的输出，但它们在由多个智能体控制的“智能体架构（agentic architectures）”中真正能够大放异彩。\n\
  \n## RAG 架构中的工具使用\n\n工具使用是 RAG 架构中的一个问题，与其他 LLM 系统并一样。即使有 RAG 数据存储，并非所有查询都能由 LLM\
  \ 处理。任何无法通过存储的文档块回答的动态查询可能需要：\n\n(a) 模型自身的通用知识，或\n(b) 工具执行，或\n(c) 后者兼有。\n\n另一种情况是需要\
  \ RAG 分块但未找到。模型需要被训练为发布失败消息，或者在零分块的情况下需要不同的提示：“对不起，我不知道该问题的答案。”\n\n工具集成是一个通用的 LLM\
  \ 问题，并非 RAG 架构所有。工具的示例包括闹钟、定时器、日历、计算器等许多。让 LLM 启动工具意味着训练它去识别：\n\n(a) 哪些查询需要工具和/或\
  \ RAG 分块。\n(b) 需要哪些工具（如果有的话）。\n(c) 工具是否需要以 RAG 分块作为输入，或者它们不需要。\n(d) 如何启动工具（带有输入参数）。\n\
  (e) 如何将工具输出结果整合到 LLM 的答案中。\n\n因此，高级的 LLM 需要同时决定多个问题：它是否需要启动工具，是否需要获取外部 RAG 分块，更不用说问题是否安全可以回答。\n\
  \n## LLM 电脑\n\n电脑可以是非常有用的工具！而且，你知道，手机也是一台电脑，它是智能体架构的最新热门领域。研究表明，LLM 可以通过两种方式访问设备屏幕：\n\
  \n(a) 截图分析（图像模型），\n(b) 分层内部视图。\n\n这两种方法对于现有的多模态 LLM 都是可能的。可以说，视图方法可能甚至需要文本分析（例如逻辑窗口和矢量格式）。在我写作时，有两项重大动态推出了此类功能：\n\
  \n* Apple Intelligence —— 训练设备侧 LLM 查看屏幕并操作你的应用。\n* Anthropic —— 鼠标和键盘的通用 LLM 使用。\n\
  \nApple Intelligence 涉及两个独立方面。首先，设备侧 LLM 可以了解屏幕上的内容，因此可以根据你正在使用的应用提供上下文回复（例如发短信或搜索网页）。其次，苹果正努力使其所有应用以及第三方应用在其内部添加名为\
  \ `intents` 的 LLM 集成，以便手机上的 AI 能够使用这些应用执行操作。\n\nAnthropic 训练了一个目标类似的模型，但它侧重于不修改应用的情况下使用完整的电脑。它不仅可以查看屏幕，还可以控制鼠标和键盘。理论上，LLM\
  \ 然后可以执行人类通过图形用户界面（GUI）执行的操作（无论好坏），使用现有的应用。\n\n## 参考文献\n\n1. Jerry Huang, Prasanna\
  \ Parthasarathi, Mehdi Rezagholizadeh, Sarath Chandar, 2024 年 4 月 14 日, Towards\
  \ Practical Tool Usage for Continually Learning LLMs, [`arxiv.org/abs/2404.09339`](https://arxiv.org/abs/2404.09339)\n\
  2. Amy Marks,2024 年 6 月 11 日, Clarifying Function Calling / Tool Use in LLMs, [`medium.com/@aevalone/clarifying-function-calling-tool-use-in-llms-6511af510f99`](https://medium.com/@aevalone/clarifying-function-calling-tool-use-in-llms-6511af510f99)\n\
  \n\n\n\n\n3. Yicheng Fu, Raviteja Anantha, Prabal Vashisht, Jianpeng Cheng, Etai\
  \ Littwin, 2024 年 9 月 6 日, `UI-JEPA: Towards Active Perception of User Intent through\
  \ Onscreen User Activity`, [`www.arxiv.org/abs/2409.04081`](https://www.arxiv.org/abs/2409.04081)\n\
  \n4. V Adrakatti, 2024, Exploring screen summarization with large language and multimodal\
  \ models, 硕士论文, University of Illinois Urbana-Champaign, Urbana, Illinois, USA,\
  \ [`www.ideals.illinois.edu/items/131510`](https://www.ideals.illinois.edu/items/131510)\n\
  \n5. Anthropic, 2024 年 10 月 23 日, Developing a computer use model, [`www.anthropic.com/news/developing-computer-use`](https://www.anthropic.com/news/developing-computer-use)\n\
  \n6. Anthropic, 2024 年 10 月 23 日, Introducing computer use, a new Claude 3.5 Sonnet,\
  \ and Claude 3.5 Haiku, [`www.anthropic.com/news/3-5-models-and-computer-use`](https://www.anthropic.com/news/3-5-models-and-computer-use)\n\
  \n7. Anirban Ghoshal, 2024 年 10 月 23 日, How Anthropic’s new ‘computer use’ ability\
  \ could further AI automation, [`www.cio.com/article/3583260/how-anthropics-new-computer-use-ability-could-further-ai-automation.html`](https://www.cio.com/article/3583260/how-anthropics-new-computer-use-ability-could-further-ai-automation.html)\n\
  \n# 智能体架构 (Agentic Architectures)\n\n## 单智能体架构\n智能体的概念往往会让人联想到接管世界的 AI 引擎。毕竟，智能体是那些“执行”事情的\
  \ AI 应用，而 `LLMs` 则被认为只是坐在那里写诗。\n\n实际上，智能体只是软件，并不一定是你*需要避之不及*的架构。这些架构在各种行业框架中已经非常成熟。所需的特性包括：\n\
  \n*   数据源（例如，读取你的邮箱收件箱、搜索互联网）。\n*   软件集成（例如，你的公司数据库、HR 系统、内部财务状况等）。\n*   `LLM` 查询（基础层级的智能）。\n\
  *   将它们整合在一起（即规划、调度、委托等）。\n\n虽然单智能体具有强大的潜力，但显而易见的是，行业的主流方向是“智能体架构”，以及使用针对特定任务经过专门训练的\
  \ `LLMs` 进行多智能体协作。例如，Salesforce 针对不同活动拥有多个智能体，而 Apple Intelligence 拥有一个具有“多 LoRA”的架构，其中包含许多手机端的小型\
  \ `LLMs`，并由云端名为 `Private Cloud Compute (PCC)` 的更大 `LLM` 框架支持。\n\n## 智能体类型\n事实上，有几种不同的智能体，每种都有其相应的难度级别。目前并没有一种广泛接受的智能体分类方法，与其因此气馁，我将发明一套自己的：\n\
  \n*   只读智能体（报告型智能体）\n*   读写智能体（动作型智能体）\n\n我们还可以根据智能体的启动方式进行进一步细分：\n\n*   手动型智能体\n\
  *   定时型智能体\n*   触发型智能体\n\n另一个维度是智能体是否对其“写写”操作需要批准：\n\n*   受监督智能体（需要人工参与审批）\n*  \
  \ 无人值守智能体（自动化或“自主智能体”）\n\n所以，大约有 12 种不同的智能体物种，但它们之间的区别并不大。如果你正在构建一个智能体，它需要几个核心组件：\n\
  \n*   与其自身的 `LLM` 集成\n*   数据源集成（用于“读取”）\n*   输出集成（用于“报告”）\n*   动作集成（用于“写入”或“执行”）\n\
  \n这变得相当复杂，所以一些例子可能有所帮助：\n\n*   想象一个与电子邮件子系统集成的智能体，每当它收到新邮件时就会启动，然后与发出的邮件 `API` 集成，以便你给发送邮件的人设置自动回复，告诉他们你正在休假。\n\
  *   一个智能体软件在后台运行，只有当手机收到短信时才会被触发，然后智能体访问扬声器接口（一种“动作”），让手机发出：`Ping!`。\n*   另一种类型的手动启动智能体可以在接收到你的查询请求后，搜索互联网并为你返回关于该主题的前十个蓝色链接。\n\
  *   想象一下一个完全自主的软件智能体带来的安全性改进，它监控你汽车的轮子（“读取”），检测打滑迹象，并连续快速开启和关闭刹车（一种“动作”），从而重新获得牵，而无需驾驶员做任何操作。\n\
  \n噢，等等！这些都是我们已经拥有多年的东西。AI 智能体一直在我们身边，而我们从未发现吗？\n\n## 报告智能体 (Report Agents)\n报告智能体是“只读”智能体，它们只在经过分析后创建如报告之类的输出。智能体找到你想要的数据，并就此创建报告。用例包括：\n\
  \n*   邮箱收件箱\n*   新闻摘要\n*   公司研究\n*   研究论文\n\n假设我们想要一个读取新闻并为你展示摘要的 AI 引擎。为了实现这一点，智能体需要：\n\
  \n1. `Scheduler`（唤醒它）。\n2. 数据源集成（下载新闻）。\n3. `LLM` 查询接口（总结）。\n4. 显示报告\n\n请注意，如果没有调度器，这本质上是\
  \ RAG 架构。\n\n## 动作智能体 (Action Agents)\n动作智能体是能够改变外部世界的通用型智能体，具有“写入”能力。某些示例案例包括：\n\
  \n*   发送电子邮件\n*   交易自己的股票\n*   预订机票\n*   完成报税\n\n想象如果我们扩展新闻标题智能体，让它不仅总结新闻（即“读取”），而且每天给我们发送一份报告。这增加了一个步骤，即发送邮件的动作。在这种情况下，智能体实际上是“无人值守”运行的，因为调度器唤醒了它，然后不需要批准即可发送邮件。其他类型的\
  \ AI 智能体可以设置为需要人类批准动作。\n\n另一种变体是“触发型智能体”，由某些事件启动智能体运行，而不是调度器。例如，邮件可能会触发某种邮件回复智能体，或者在手机上弹出摘要通知。\n\
  \n# 智能体架构 (Agentic Architectures)\n“智能体架构”这一术语是目前 arxiv 上热门领域。这是一个有些模糊的概念，但通常涵盖了\
  \ `LLM` 智能体技术在以下方面的应用：\n\n*   多智能体\n*   多种类型智能体的协作\n*   工作流路径\n*   规划\n*   调度、排序和链式调用\n\
  *   检索（即数据源“读取”能力）\n*   动作（“写入”能力）\n\n在最基础的形式下，它与 RAG 非常相似，只是智能体会去某个地方获取数据，通常是从不是数据库的地方，例如互联网。好处是它不需要任何工作来保持更新。坏处是，它可以访问互联网，但有方法可以限制网络搜索的范围。\n\
  \n例如，如果你尝试制作一个关于“菜谱”的专家聊天机器人，智能体可能专门识别某几个“烹饪”网站，并可能使用这些网站的搜索功能。这是一种带有“检索器”的智能体架构。\n\
  \n\n\n\n你可以将 RAG 描述为一个知道如何从向量存储或其他存储中检索数据的智能体。然而，通常情况下智能体架构（agentic architectures）往往更加多样，并且通常涉及多个智能体。\n\
  \n作为另一个例子，你可能希望有一个网站能生成五道菜晚餐，其中每道菜都相互相辅。可能还会满足某些特殊需求。你可能会得到几个搜索食谱的智能体，一个了解食物搭配知识的智能体，另一个了解葡萄酒搭配的智能体，等等。这些智能体通常排列成一种结构，一个智能体的输出作为另一个智能体的输入，结果得到进一步精炼。\n\
  \n每个“智能体”都在运行 LLM 查询，这让智能体专注于特定的“角色”，但同时也对原始“问题”有所了解。一旦遍历了整个结构，将由最终的 LLM 总结生成。\n\
  \n智能体架构可以是交互性的，序列中通常有多个用户可以参与的地方。例如，在底层，可能在“牛肉菜”或“鸡肉菜”之间存在选择，LLM 可能会提出后续问题（如果经过了此类训练），用户可以指示他们更偏好哪种食物。\n\
  \n更复杂的智能体架构不是静态结构或单一工具链。高级智能体结构可以包含循环、决策点、交互性或审批选择、反馈点以及用户需要完成的步骤。\n\n许多生成整个全代码应用程序的软件开发\
  \ AI 工具都是智能体系统。它们可以拥有组成典型软件团队的智能体：有一个 PM 智能体（项目经理）、编码智能体、架构智能体、测试智能体、文档智能体等以及更多。用户尽可能详细地描述他们想要构建的软件，PM\
  \ 智能体将精炼需求（通常与用户进行循环），然后每个需求将由架构智能体进行“设计”，由编码智能体进行编码，并由相应的智能体进行测试和文档记录。在此过程中可能会出现\
  \ Bug，因此可以引入一个“调试智能体”。\n\n在自动开发的一个完整周期结束时，用户将被带回来测试生成的应用程序。在后台还有另一个智能体，负责构建代码并部署可执行文件。一旦用户接受某个需求已完成，智能体系统就会循环到下一个需求\n\
  \n总体而言，智能体架构的“结构”是非常动态的。每个智能体都可以访问不同的 LLM。编码智能体可能是一个代码补全类 LLM，而“架构智能体”可能是一个带有 RAG\
  \ 设计模式 LLM 的编码智能体。智能体架构的成本可能会变得非常昂贵！\n\n## 智能体的安全性\n\n对于每个人电脑（或手机）上的智能体，一个常见的担忧是它们存在安全漏洞。如果\
  \ AI 引擎可以发送电子邮件，那么黑客在接管你的设备后也可以发送。\n\n事实确实如此，必须仔细审查安全性，但重要的是，这并不是新鲜事。黑客如果获取了你设备的控制权，一直都是可以发送电子邮件的。AI\
  \ 智能体架构在本质上并没有让这种情况比过去变得更不或更不安全。\n\n但智能体本身失控怎么办？它会开始发送大量邮件吗？从技术上讲，可以，但什么会导致它这样做呢？它为什么比旧的\
  \ Outlook 更可能失控呢？也许是因为我们让自动化变得更容易了，它具有这种潜力，但这需要软件设计中的人为失误。而程序员从不写 Bug，所以这应该让人放心。\n\
