  \n## 第三部分：规划 AI 项目\n\n“我喜欢计划完美执行的时候！” —— 虎虎战队\n\n## 7 规划\n\n### 规划 AI 项目\n\n编写规划文档是\
  \ AI 项目的重要部分。它可能长到让你的手指因敲击键盘而感到酸痛。但至少，如果你已经到了这一步，希望你已经度过了决定构建什么时可能出现的“分析性瘫痪”。\n\n\
  关于规划的一些通用点：\n\n* 一个强大的计划可以扭败败为胜。\n* 通用的项目规划方法适用——这只是另一类型的技术项目。\n* 供应商在需求建议书（RFP）回复中会过度承诺，而在实际交付中会表现不足。\n\
  * 开源组件一如既往（如果你懂我的意思的话）。\n\n还有最后一点关于 AI 特有的观点：快点！AI 的时钟跑得更快。\n\n## 慢即是快\n\n反过来，这里有一个反面观点：对于一头冲进去并到处添加\
  \ AI 要小心。通常情况下，慢下来和审慎也有帮助。\n\n\n\n\n\n你可以运行几个规模较小的试点项目来计算成本，并熟悉其中的困难，例如缺少哪些专业知识。关注\
  \ AI 行业正在发生的事情，以及供应商提供了哪些产品，这本身就是一场信息洪流。这将为未来的 AI 项目提供更好的规划。\n\nAI 领域中一个很好的例子是苹果公司。他们现在才开始以“Apple\
  \ Intelligence”之名为 iPhone、iPad 和 MacOS 推出其“强制性”的 AI 功能。诚然，苹果在在幕后掌握的 `ML` 技术可能比任何人想象的都要多，因为他们倾向于谈论用户而非他们的基础设施技术。换句话说，苹果首席执行官蒂姆·库克在回答“为什么花了这么长时间？”这个问题时表示：“不是最早的，而是最好的”。\n\
  \n## 加速 AI 项目\n\n以下是一些可以采取的早期行动建议，可以加快你 AI 项目的整体上市时间：\n\n* 审批流程\n* 审计现有的 `ML` 项目\n\
  * 咨询建议\n* 员工技能评估\n* 数据盘点与清理\n* 法律部门审查\n\n另一个总性要求是投入时间和精力学习所有这些新东西。你读这本书是在正确的道路上，所以下一步应该是为你部门的每人买一本这本书。或者，你也可以尝试寻找一个包含盗版副本的在线\
  \ AI 训练数据集。\n\n## 审批\n\n与大多数 IT 项目一样，你的生成式 AI 项目需要通过公司内部的正式审批流程。这可能需要很多签名，并层层上报，就像\
  \ `autoregressive decoding` 减慢 AI 引擎的方式一样，每一步都必须等待上一步完成。\n\n在 AI 世界中，情况是这样的：\n\n\
  **你：** 我模糊地考虑在生成式 AI 领域做些什么。\n**CEO：** 我会派私人飞机去接你。董事会可以坐经济舱。\n\n另一方面，你可能会发现有其他十位副总裁一直在他们的部门推销同样的内容。或者，你的组织架构图中现在可能有了一个新的“首席\
  \ AI 官”（`CAIO`）或“AI 副总裁”，他们对方向拥有最终决定权。无论如何，最好是弄清楚 AI 项目审批的新流程。\n\n## 审计现有的 AI 项目\n\
  \nAI 并不新鲜，但它以前被称为“机器学习”或 `ML`。你一定在亚马逊的产品推荐、Netflix 的电影建议或 iPhone 的面部识别中使用过 AI。任何中大型组织的\
  \ IT 部门都已经在进行 `ML` 项目了。\n\n因此，审计它们吧！收集有关已存在哪些能力的信息。早期项目将不会使用生成式 AI，但将基于“预测性 AI”。\n\
  \n预测性 AI 和生成式 AI 是非常互补的技术。预测性 AI 擅长数字和模式，而生成式 AI 擅长文字和自然语言。你可能有机会通过使用 `LLM` 作为核心预测引擎的自然语言封装，将你之前的某些\
  \ `ML` 项目重新包装成生成式 AI 项目，主要有两种基本方式：\n\n* 输入 —— `LLM` 可以接受针对数据集的自然语言查询，但使用预测性 AI 引擎分析趋势，和/或者\n\
  * 输出 —— `LLM` 可以更易读的自然语言输出预测性 AI 分析的结果，或者对受众具有更高的个性化程度。\n\n即使你现有的 `ML` 项目没有明显的获益，你至少可以识别出一些具备\
  \ AI 能力的员工。他们可能已经玩了一段时间的 `ChatGPT API`。\n\n## 咨询建议\n\n许多大型咨询公司都在为他们从 AI 项目（尤其是生成式\
  \ AI）获得的额外收入而自豪。尽管当你试图雇佣他们时这听起来对你不是好消息，但至少说明许多其他企业正在寻求帮助来让这些 AI 项目落地。你可以请求主要的两件事：\n\
  \n* 建议\n* 编码\n\n目前还不清楚大型咨询公司在这两件事上各占比，但显然两者都涉及。\n\n寻求建议并不是启动进程的糟糕开始。你可能需要进一步建议的一些问题包括：\n\
  \n* 用例\n* 预算编制和 ROI 分析\n* 数据审查\n* 供应商定价审查\n\n还有一些问题可能需要法律审查：\n\n* 监管问题\n* 隐私问题\n\
  * 许可证问题\n* 所有权和知识产权问题\n\n另一方面，你不需要在规划、设计或架构方面寻求任何帮助，因为你有这本书了，而它的成本大约相当于咨询顾问 3 分钟的时间。\n\
  \n## 通用法律问题\n\n公司有几个律师，对吧？AI 项目规划的另一个早期停点是法律部门。尽早让他们介入是一个很好的建议，因为法律批准是启动 AI 项目的常见瓶颈。\n\
  \n在分析你的 AI 项目时，有大量的计费小时可供：\n\n* 监管合规\n* 隐私合规\n* 版权及可版权性\n* 可专利性\n* 负责性 AI 政策\n*\
  \ AI 安全政策\n\nAI 监管是一个不断变化的领域，因此你需要与上过哈佛或耶鲁大学的人一起审查这些。目前欧洲在这方面的变动比美国多，但不用担心，有很多美国法律可以讨论。你可以就“合规”进行愉快的对话：`SOC`、`SOC2`、`SOX`、`CAN\
  \ SPAM`、`HIPAA`、`GPDR`、`COPA`、`DMCA`、`FSOC`、`FINRA`、`COPPA`、`CalOPPA`、`TWEA`等等。\n\
  \n最后，你需要关心的不仅仅是各国政府的政策。相反，还有那些比主权国家更有钱的大科技公司，他们自己的平台政策。如果你想使用他们的基础设施或将应用程序发布给他们的用户，你还需要遵守各种公司政策。例如：\n\
  \n* 苹果的负责性 AI 和隐私政策\n* OpenAI 的负责性 AI 政策\n\n\n\n\n\n即使在你处理了这一切之后，当法务部门听到传言说你做的 AI\
  \ 项目非常出色，他们想对这些东西申请专利时，整个项目就会停滞。而且，对于国外专利，你在上线后无法获得那 12 个月的宽限期（只有美国专利法是合理的），而且我们需要针对国外竞争对手获得那个优先权日；此外，在没有完整描述的情况下你无法提交临时专利，而且由于“充分性”要求，你必须极其详尽地描述所有算法；随后，编写专利说明书需要设计程序的程序员与试图用文字描述\
  \ `LLM` 实际工作原理的专利代理律师之间进行数月的反复沟通。\n\n我提到过法务签通过（legal signoff）是一个常见的瓶颈吗？\n\n# 购买项目\n\
  \n许多早期的 AI 项目属于“购买”类型，例如为作家或程序员购买辅助工具（copilots）。可选的供应商并不乏，而且过去几年内推出的也大约有 6.5 万家\
  \ AI 初创公司。\n\n规划集成从供应商购买的 AI 产品涉及所有标准的项目规划步骤：\n\n* 需求分析\n* RFP（征求建议）发布与评审\n* 内部测试与对比\n\
  * 概念验证与试点阶段\n* 上线\n* 评审与重复\n\n使用购买的 AI 技术是比自建更快速获得胜利的方法。在组织应对更高级 AI 项目的就绪性方面，它也是一个非常有用的跳板。\n\
  \n# 构建项目\n\n构建一个 AI 项目并不容易。有几种方法可以来实现：\n\n* 定制现有的 AI 平台\n* 无代码 AI 平台\n* 开源 AI 平台\n\
  * 从零开始\n\n请注意，当我说“从零开始”时，并不一定意味着要从零训练你自己的基础模型，而是围绕它编写所有的其他应用基础设施。事实上，`LLM` 和 AI\
  \ 引擎可能都不是你需要自己构建的东西。你可以按 token 租用，或者使用完全代码化的开源版本。\n\n通常来说，一个基础的 AI 项目主要包含四个部分：\n\
  \n* 前端 UI\n* 后端基础设施\n* 模型和 AI 引擎\n* 提示词工程（Prompt engineering）\n* 集成（现有产品和工作流）\n\n\
  前端完全由你决定。如果你没有建议，毫无疑问 `ChatGPT` 会乐意提供帮助。\n\nAI 应用的后端考虑了所有通常的内容加上 AI 部分，即由 `LLM`\
  \ 和引擎组成。`LLM` 全是数据，而引擎全是代码，但你不需要知道我只是提到了这一点。\n\n你可以根据预算使用商业 `LLM` 服务或开源 `LLMs`。对于引擎，你可以将其托管在本地或使用云服务（或者可能在设备上）。如果它是某一种类型的预训练\
  \ `LLM`，那么向你的应用添加特定业务逻辑的主要方法是通过提示词工程（以及用户界面），因此这是一个非常重要的额外 AI 专用模块。\n\n非 AI 后端组件都是你需要提供的那些常规内容。例如，一个\
  \ Web 应用程序需要计算机、网络容量、`Apache` 或 `Nginx`、`DNS`、域名、用户管理等更多内容。\n\n集成到现有解决方案中（包括内部或商业产品）是另一个方面。明确\
  \ AI 将在何处使用以及它的任务关键性如何至关重要。AI 往往在“助手”模式下运行得非常好，它可以完成许多潜在节省时间的工作，但最终人类操作员在给 `LLM`\
  \ 提供一些初始工作和指导后，有机会审查并接受生成的内容。\n\nAI 的另一个良好用途是作为你 IT 基础设施中软件产品的“解释器”工具。例如，解释软件执行时晦涩的错误信息，并就如何修复导致错误的软件配置提供建议。\n\
  \n如果你打算对数据进行一些高级操作，有两种主要方法，每种方法都会增加一些开发任务：\n\n* 微调（Fine-tuning）\n* `RAG`\n\n但我到此为止。\n\
  \n# 数据\n\n数据是 AI 项目中如此重要的方面，以至于专门有一了一章（第 8 章）。为了充分利用针对你特定业务类型专门的 `LLM`，你想要并且需要一些私有数据。这意味着你可以在微调或\
  \ `RAG` 项目中使用这些数据，为用户（无论是外部客户还是内部员工）提供更专业的结果。\n\n假设你的项目需要数据，会有各种额外的开发任务：\n\n* 数据清单——寻找数据\n\
  * 数据清洗\n* 法律审查\n* 数据接入阶段——微调或 `RAG` 分块\n\n项目规划的另一个方面是需要在 AI 整个生命周期内重复上述所有内容。数据随时间变化，这意味着数据清洗、数据接入以及潜在的法律审查都需要是一个定期的持续过程。并不是所有的\
  \ AI 项目都需要数据。你可以通过各种方式使用“无数据”架构，仅通过提示词工程就能获得显著收益。\n\n# AI 无区域\n\n尽管你可能听过，软件程序在没有\
  \ AI 的情况下过去运行得很好。我在这里帮助你的职业生涯，你可能会发现自己陷入了糟糕的境地：开发者编写了一个内部没有 `LLM` 的应用。以下是保住你工作的方法：\n\
  \n你：我们完成了字数计数 App 的 AI 版本。\nCEO：它使用什么种 AI？\n你：它正在使用基于 256 个词汇量的迭代逻辑放大器。\nCEO：分析师会被印象的！\n\
  \n这里有一些额外的校准建议：\n\n* 数据库——启用索引的 `RAG` 分块检索引擎\n* 整数变量——32 位量化并行数据\n* If-then 语句——分支模型选择路径\n\
  * 浮点——基于指数缩放的系数的数据\n* 操作系统——用于 `GPU` 的引导加载器软件（现在的计算都在这里）\n* CPU——很快将被废弃的硅片\n\n随时提出你的建议！\n\
  \n\n\n\n## 参考文献\n\n1. LiLMod, 2024 年 8 月 27 日，Haystack：正在撼动对手的新型 LLM 框架，[https://ai.plainenglish.io/haystack-the-new-llm-framework-that-is-shaking-its-competitors-1a083a153fd9]\n\
  2. Michael Nuñez, 2024 年 9 月 25 日，AI 普及：Meta 的“Llama Stack”承诺简化企业采用，[https://venturebeat.com/ai/ai-for-all-meta-llama-stack-promises-to-simplify-enterprise-ai-adoption/]\n\
  3. Peter Cohan, 2023 年 9 月 23 日，为什么公司购买生成式 AI 咨询：3 个月的回本因素，[https://www.forbes.com/sites/petercohan/2023/09/23/why-companies-buy-generative-ai-consulting-the-3-month-payback-factor/]\n\
  4. Pecan AI Team, 2024 年 4 月 4 日，如何衡量（并增加）AI 计划议的投资回报率，[https://www.pecan.ai/blog/how-to-measure-increase-roi-of-ai/]\n\
  5. Grant Gross, 2024 年 10 月 10 日，什么时候是放弃 AI 项目的良机？[https://www.cio.com/article/3555331/when-is-the-right-time-to-dump-an-ai-project.html]\n\
  6. Matt Asay, 2024 年 9 月 23 日，AI 需要的组装过多，[https://www.infoworld.com/article/3536292/too-much-assembly-required-for-ai.html]\n\
  \n# 8. 数据\n\n### AI 需要数据\n\n高级 AI 项目的战略性任务之一就是数据。所有预训练的 LLM 都已经摄入了海量数据，如果你想针对你的业务专门化它们，你也需要给这些“猛兽”喂数据。\n\
  \n将数据喂入 LLM 的过程被称为模型的“微调”或“专门化”。目标是让 LLM 在被要求执行的任何特定任务上表现更好。一个常见的例子是客户支持聊天机器人需要摄入你所有产品的数据表，以便它可以回答关于产品的问题。然而，还有许多其他类型的项目需要特定的数据。\n\
  \n找到足够的数据是 AI 项目的共同问题。需求是新的，数据已变得比过去重要得多。更糟糕的是，它必须是“优质”的数据，而“脏数据”是业务项目中反复出现的主题。因此，清理你的数据是一个常见的瓶颈，有各种工具和外部供应商可以提供帮助。\n\
  \n### 数据清单\n\n数据问题导致许多商业 AI 项目面临以下几个主要压力：\n\n(a) 寻找良好的数据。\n(b) 清理它们！\n(c) 进行逻辑结构化。\n\
  (d) 格式化。\n\n所有这些问题都是经常被低估的瓶颈，尤其是那些推动 AI 项目的人往往是技术人员，他们只关心代码。\n\n需要考虑的数据某些方面包括：\n\
  \n* 数据质量\n* 格式（输入和输出）\n* 归属权\n* 法律许可权利\n\n### 数据格式\n\n关于数据格式，它们可以是任何形式，但常见的示例包括：\n\
  \n* 你的公共网站（或内部内网）的 HTML 页面\n* 数据库记录\n* 电子邮件\n* PDF 文件\n* Microsoft Word 文档文件\n*\
  \ 纯文本\n* 自由格式文本（例如，故障工单支持系统中的用户问题和员工回答）\n\n如果你专注于代码模型，大多数编程语言都是纯文本。如果你访问 IT 部门，通常会有大量的源代码流在各处。\n\
  \n### 多模态数据\n\n那份数据清单只是文本。根据产品的不同，你可能需要为多模态 LLM 准备数据。还需要清单以下类型的数据：\n\n* 图像（例如：照片、图表、绘画）\n\
  * 视频\n* 动画\n* 音频（例如：音乐、音效）\n* 高级格式（例如：3D CAD/CAM 设计数据）\n\n每种非文本数据源都有多种不同的可用格式。我不会深入讨论图像格式和视频编码器的细节，因为，嗯吧，我对那些东西一窍不通，尽管我认识一个懂的人。\n\
  \n### 什么是优质数据？\n\n更高质量的数据有利于微调，这也是小语言模型（SLM）改进的方法之一。在数据质量方面需要考虑的问题包括：\n\n* 用户生成内容与专业创作内容。\n\
  * 完整性\n* 准确性\n* 写作语调（例如：非正式与正式）\n* 阅读水平\n* 复杂术语的使用\n* 时效性\n* 无害、安全且无毒\n\n更简洁地说，内容是否真的包含了对你的\
  \ `LLM` 项目用户有帮助的答案？这可能取决于他们是内部员工还是你的外部客户。\n\n通常情况下，`LLM` 项目的优质数据是：\n\n(a) 专业编写的，\n\
  (b) 公司完全拥，并且\n(c) 以普通公众为目标受众编写的。\n\n一个很好的例子是关于你产品的客户 `data sheets`。因此，你寻找优质数据之旅的第一个站是营销部门。\n\
  \n### 数据清洗\n\n如果你加载一个装满了来自营销服务器的 `PDF` 的 `USB drive`，或者让你的 `Linux` 盒子爬取整个内网，请务必小心。\n\
  \n此外，如果你收集了一些糟糕的数据，别指望 AI 引擎能救你于水！内部数据清洗的一些问题包括：\n\n* 机密数据\n* 源代码\n* 银行账户号码\n* 内部讨论（例如，开发者在故障数据库中抱怨支持人员）。\n\
  * 个人姓名、电子邮件地址或其他个人身份信息\n* 过期信息\n* 无关信息\n* 脏话\n* 敏感话题\n\n但这些只是比较有趣的部分。很多问题要平庸得多：\n\
  \n* 拼写错误\n* 格式不当的文档\n* 编写糟糕的内容（例如，电子邮件或故障工单中的）\n* 不完整的数据\n* 纯粹错误（JPW）的数据\n\n所以，主要的你必须对所有信息源进行仔细筛选，并对其进行大量扫描。\n\
  \n### 开源数据\n\n你应该在业务应用中使用开源数据吗？互联网上有许多经过筛选的 AI 训练数据集。这些数据是免费的，且大多数具有允许商业使用的宽松开源许可。听起来很棒！\n\
  \n首先，意义何在？如果它是公开的数据集，它可能已经包含在你将使用的任何预训练基础模型（无论是商业还是开源的）的训练集中。\n\n其次，开源数据可能也只是通用数据。微调的核心理念是寻找某些特殊数据，存储在货运层柜子里落满灰尘的磁带上。然后你就可以将你的魔法数据微调到一个精良的微调模型中，它对“下水道溶剂”或你卖给客户的任何产品具有天才智能，然后你就是\
  \ AI 英雄了。\n\n\n\n\n现在是数据经济时代。我曾在某处读到，是拥有最多数据的公司将在 AI 竞争中获胜。又也许是拥有专利最多的公司，我记不清了。\n\
  \n无论如何，使用开源数据并不一定是一个好主意。在在某些情况下它可能是有用的，例如，通过微调模型使其更有可能遵循特定数据集的信息或风格。或者，如果你的老板要求你获取某些数据，因为\
  \ Apple 使用了 `LoRA`，那么请务必使用免费数据。这里有一个小建议：也有各种公司在出售数据。\n\n另一种，如果你找不到任何内部特有数据，你可能考虑在“无数据架构”中直接使用大型基础模型，而不进行任何微调、`LoRA`\
  \ 或 `RAG` 组件，而是将额外的领域特定应用逻辑集中在提示工程、工具集成和用户体验（UX）增强上。\n\n## 数据的法律问题\n\n数据是与法律部门进行初步沟通的良好切入点。关于数据是否可供\
  \ `LLM` 使用，涉及的一些法律疑虑包括：\n\n*   **所有权** —— 数据是内部生成的并因此完全归业务所有，还是受第三方内容许可的限制？\n* \
  \  **许可权利** —— 第三方内容许可对第三方数据究竟允许了什么？\n*   **版权保护数据** —— 关于在 `LLM` 训练数据未使用未经许可的版权数据，目前仍是一个未解决的问题。这目前也是一个极具争议的话题，存在许多活跃的诉讼。\n\
  *   **用户生成内容** —— 用户许可及相关的隐私政策允许你使用这些数据吗？或者你是否希望披露你不会使用？\n*   **未成年人创作的内容** —— 同意你网站条款的用户是否真的达到了相应年龄？你能识别出此类内容并进行单独处理吗？即使你拥有此类内容的权利，你想要使用它吗？\n\
  *   **许可接受的证明** —— 如果你的用户许可上允许你将用户数据用于模型训练，是否留存了记录用户接受的文档？需要哪些条件？\n*   **混合版权数据**\
  \ —— 某些数据可能是用户创建的内容与其他来源的版权数据的混合，例如用户上传了已出版书籍的摘录。\n*   **开源许可合规性** —— 如果数据集的部分或全部是开源的，仍然存在一些复杂的合规方面，例如归属说明和提供许可副本，即使是像\
  \ `MIT License` 或 `Apache 2 License` 这样表面简单的许可也是如此。\n*   **拷贝许可内容** —— 如果内容具有“拷贝许可”（copyleft）或“相同”许可，例如\
  \ `Wikipedia` 或 `CC-BY-SA`，你是否可以在不给其他知识产权带来沉重义务的情况下使用它？拷贝许可是否会附加到使用该数据训练的 `LLM`\
  \ 上是一个尚不明确的法律问题。\n*   **国际数据** —— 海外数据集是否可以根据适用条款、隐私政策，以及所在地政府的总体法律体系在国家之间移动？\n\
  *   **合成数据** —— 如果你使用由其他 `LLM` 创建的“合成数据”，围绕它的法律问题是什么？使用了哪些数据集训练了另一个 `LLM`？\n*  \
  \ **照片、图像和多媒体** —— 不要仅仅因为图像、照片或视频出现在公司文章或多媒体材料中就假设你对它们拥有无限权利。许多此类媒体可能是从素材库或股票摄影网站许可的，其许可条款非常复杂，通常具有限制性，且违规将面临严厉惩罚。\n\
  \n当然，所有这些法律问题之上都笼罩着一片巨大的、边界不明的灰色阴云，其中某些问题正在各国国家的法院审理。网络上有所有这些公开数据可供任何人免费消费，但这并不意味着它们可以用于训练，难道不是吗？当作者没有声明你不能将其用于\
  \ AI 时，这并不意味着他们也声明了可以使用它。五年前，没有人知道这类数据可能被用于 AI，而现在我们正在处理这个问题。\n\n总之，面对这片灰雾和那份可怕的清单，你唯一的反应应该是立即攻读法学学位。已经有足够的版权诉讼可以写满你的书了，而且\
  \ AI 专利诉讼将在一两年内加剧。唯一比 AI 知识产权律师薪水的工作就是训练万亿参数模型。\n\n## 无数据项目\n\n最后，请注意，尽管我说了许多反面的话，但你实际上可以在没有数据的情况下做\
  \ AI。这类项目的示例包括：\n\n*   摘要\n*   Copilot AI\n*   提示工程封装器\n\n某些用例并不真的需要自定义的 `LLM`。以文档摘要为例。如果\
  \ `LLM` 项目的目标是接收用户提供的 PDF 文档作为输入，然后将其总结作为输出，那么自定义数据实际上始终位于输入的 PDF 文件中。因此，摘要项目并不总是需要\
  \ `LLM` 内部包含专门的数据。另一方面，通用 `LLM` 可能不够熟悉你问题领域中的术语和专业词，因此在某些情况下它可能需要预训练来学习这些内容。\n\n\
  你从供应商那里购买现成的 copilot 也不需要特定的公司内部数据。他们乐意接受你的钱，无论你拥有多少数据。事实上，这些供应商中的某些提供提供了自定义或修改作为\
  \ copilot 的 `LLM` 输出的方法。由于很难进行额外的微调，这让我怀疑他们是否在做提示工程！\n\n## 参考文献\n\n1. Morgan Cheatham,\
