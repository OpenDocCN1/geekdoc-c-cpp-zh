  7. Rafe Fletcher, 2024 年 7 月 11 日, [`www.linkedin.com/pulse/finding-ais-killer-use-case-rafe-fletcher-7welc/`](https://www.linkedin.com/pulse/finding-ais-killer-use-case-rafe-fletcher-7welc/)\n\
  8. Stephanie Houde, 2024 年 3 月 2 日, [`arxiv.org/abs/2406.10300`](https://arxiv.org/abs/2406.10300)\n\
  9. Olivia Moore, 2024 年 3 月 13 日, [`a16z.com/100-gen-ai-apps/`](https://a16z.com/100-gen-ai-apps/)\n\
  10. MV Financial, 2024 年 7 月 20 日, [`seekingalpha.com/article/4705253-search-for-killer-ai-app`](https://seekingalpha.com/article/4705253-search-for-killer-ai-app)\n\
  \n# 5. 用例\n\n## 什么是用例\n\n“用例”是行业对于大语言模型和 AI 引擎各种使用方式的术语。消费者和企业使用 AI 的不同，因此有不同的用例。\n\
  \n消费者使用 `ChatGPT` 进行问答、文本写作、头脑风暴并作为伴。企业使用传统的预测性 AI 为客户提供内容推送，并使用生成式 AI 进行客户支持和营销内容写作。\n\
  \n用例正在不断扩展，AI 手机和 AI PC 中新兴的“设备侧”生成式 AI 将进一步扩大大语言模型的作用。\n\n\n\n\n\n生成式 AI 是该领域的新秀。`ML`\
  \ 是现有的技术，已经在 DMZ（解界区）之外过着优越的生活。\n\n它们各有优劣。因此，为了理解应该用生成式 AI 还是 `ML` 来构建项目，对它们进行比较是非常重要的。\n\
  \n| 技术 | 优势 | 劣势 |\n| :--- | :--- | :--- |\n| 生成式 AI | • 文本，• 语言 | • 数据模式，• 数字计算\
  \ |\n| 预测性 `ML` | • 数据模式，• 数字计算 | • 文本，• 语言 |\n\n你注意到什么了吗，还是你只是在扫视？`ML` 和生成式 AI\
  \ 是两种非常互补的技术。你不太可能用一个使用 `LLM` 的版本来替换 `ML` 应用。相反，你想要寻找这种新型 AI 技术的新用途，这种技术非常擅长理解和编写自然语言。\n\
  \n`ML` 已经用于以下用例（这些场景也与你可能不会用于生成式 AI 的场景相同），包括：\n\n* 内容推荐\n* 产品推荐\n* 数值数据中的模式检测（例如：定量交易分析）\n\
  * 人脸识别\n* 网络安全（例如：入侵检测）\n* 金融欺诈监控\n* 机器视觉（例如：自动驾驶车辆）\n\n然而，你可以结合生成式 AI 和 `ML`。例如，在产品推荐领域，`ML`\
  \ 工具最擅长选择推荐什么，但 `LLM` 更擅长在以鼓励的方式向用户展示产品时，编写关于该产品的个性化内容。\n\n## 长期 AI 用例\n\nAI 已经存在多年，在生成式\
  \ AI 和 `LLMs` 出现之前，它就有许多一直擅长的领域。计算机在 `ChatGPT` 之前就能做的一些示例包括：\n\n* 分类\n* 摘要\n* 机器语言翻译（即：外语翻译器）\n\
  * 语音识别与理解\n* 转录（语音转文本）\n* 语音生成（文本转语音）\n* `OCR`（光学字符识别，图像转文本）\n* 内容推送相关性算法\n* 电子商务产品推荐\n\
  * 情感分析\n* 命名实体识别 (`NER`)\n* 复杂数值数据中的模式检测\n* 人脸识别（例如：刷脸即你的密码）\n\n这些项目很多属于技术功能而非用例。如果上述任何想法符合你的业务需求，那么追求其中任何一点都没有问题。唯一的一点是，这些大多是老式的\
  \ `ML` 能力，而不是 `LLMs` 擅长完成的任务。\n\n## 业务用例\n\n目前有许多正在进行的使用生成式 AI 能力的业务项目。一些最初的成功领域包括：\n\
  \n* 客服聊天机器人\n* 支持人员内部脚本（生成）\n* 编写内容（组织内部的各种用途）\n* 营销内容草拟/生成\n* 产品列表（例如：电子商务产品描述、房地产挂源等）\n\
  * HR 内部聊天机器人（员工查询政策）\n* HR 简历分析\n* 编程（例如：代码副驾驶、调试等）\n* 个人副驾驶（例如：通过起草电子邮件或文档来帮助员工提高工作效率）\n\
  \n上述列表往往是使用生成式 AI 较快见效的项目。其中一些项目也可以作为“购买”项目而非“自建”项目来完成。此外，你会发现这些项目大部分是员工内部使用的，而非面向客户的应用程序，这是合理的，因为内部项目比外部项目更容易。\n\
  \n## 生成式 AI 的消费者用途\n\n即使你正在寻找业务 AI 项目，考虑你的客户已经在用 AI 做什么也会很有帮助。这让你洞察客户未来可能希望如何与你的业务进行互动。或者，你可能是一个像我一样为消费者编写\
  \ AI 应用的科技初创公司。\n\n消费者正在用生成式 AI 做什么：\n\n* 生成内容（文本、视频、音频等）\n* 伴侣\n* 问答\n* 带有摘要的互联网搜索（`Google`,\
  \ `Bing`）\n* 起草文本文档（例如：电子邮件、报告、信函等）\n* 制定大\n* 校对、编辑和修改\n* 搜索长文档（或互联网）\n* 摘要（例如：PDF\
  \ 文档、网页、长文档、法律简报等）\n* 想法或主题列表\n* 头脑风暴\n* 答疑作业\n* 作业草拟（针对老师）\n* 聊天（谁知道呢？）\n* 食谱\n\
  * 研究产品和服务\n* 旅游研究和规划\n* 税务问题\n* 金融问题\n* 医学问题\n\n他们正在生成什么？（无论好坏）\n\n* 创意写作（故事、诗歌、歌词、笑话等）\n\
  * 非虚构写作（例如：业务报告、作业、任务、简历/总结、求职信等）\n* 图像创建（文本到图像）\n* 视频创建（文本到视频）\n* 音乐创建（文本到音乐）\n\
  * 歌曲创作（文本到歌词）\n\n无疑，列表中遗漏了一些内容，但我确定你明白意思。\n\n## 软件工程用例\n\n程序员也在使用代码模型：\n\n* 代码自动补全\n\
  * 代码生成\n* 调试\n* 文档\n* AI 游戏创建工具（关卡、NPC 角色等）\n* 数据生成\n* 测试用例生成\n\n实际上，并不是。我们程序员只是假装使用\
  \ AI 来让老板开心，但我们不需要任何帮助来编写完美代码。我们在日历上标记为“调试”的时间段实际上是花在玩飞盘了。\n\n## 专业用例\n\n专业消费者和小企业主正在他们的日常生活和工作中发现生成式\
  \ AI 的各种用途。个人的专业业务用途包括：\n\n* 起草产品描述和其他\n* 邮件起草（带个性化）\n* 博客文章\n* 广告和营销内容\n* 代码副驾驶（带代码补全和调试，针对程序员）\n\
  * 写作副驾驶（针对作家）\n\n一些特殊领域包括：\n\n* 研究复杂问题（扫描文档数据库）\n* 网络安全\n* SEO 内容生成\n* 业务自动化\n*\
  \ 医学图像分析（放射科医生）\n* 医学笔记和病例摘要（医生）\n* 法律文档分析和摘要\n* 医学研究（例如：药物发现）\n\n这是一个长列表，也是一个短列表。AI\
  \ 的潜力延伸到许多领域，而且这个领域才刚刚开始。\n\n## 参考文献\n\n1. Rhiannon Williams, 2024 年 7 月 8 日, 如何使用\
