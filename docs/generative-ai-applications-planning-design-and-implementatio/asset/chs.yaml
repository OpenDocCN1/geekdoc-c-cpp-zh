  \n## 安全研究\n\n有很多关于让 AI 更安全的研究。事实上，关于智能和速度的研究远多于安全的研究（约占所有 AI 论文的 2%），但考虑到每年发表有 25\
  \ 万篇 AI 论文，仍有足够的安全论文填满你的整个周末。\n\n我们在第 10 章中涵盖了一系列安全话题，该章中的每一个点本身就是一个完整的研究领域。一些主要的领域包括：\n\
  \n* 幻觉\n* 偏见\n* 公平性\n* 可解释性\n* 对抗性攻击\n\n## Apple Intelligence\n除了加速之外，安全性也是苹果训练用于端侧和云端推理的\
  \ AI 模型时的首要考虑因素。以下是他们使用的一些方法：\n\n* 数据准备（训练数据）\n* 过滤粗俗语言\n* 过滤个人详情——例如信用卡号。\n* 针对拒绝的特定训练\n\
  * 在安全基准上进行模型评估\n\n我必须承认，我并不精通 AI 安全研究。我更关注速度，特别是对于高级软件内核和端侧推理。\n\n## 速度研究\n\nAI\
  \ 研究倾向于在口语中使用“性能”（performance）来表示“智能”或“聪明程度”。因此，你必须寻找更具体的词，如“效率”（efficiency）或延迟”（latency）或“吞吐量”（throughput）来找到所有关于速度的论文。即使“优化”（optimization）这个词也可以意味着优化性能，但实际上可能出现在这类论文的标题中。\n\
  \n速度研究论文的基本分类如下：\n\n* 硬件加速\n* 软件加速\n* 两者的结合\n\n个人而言，作为一个软件工程师，我倾向于跳过所有的硬件论文，因为它们对我来说属于“太难了篮”。但硬件系统和硅片芯片是过去取得最大速度进展的领域，在可预见的未来也是如此。\n\
  \n用于 AI 引擎和模型的最佳软件加速算法通常能带来十倍左右的，而硬件加速则是百倍及以上。有很多软件论文可以提供 10%或 20%的改进，考虑到运行 AI 平台的成本，这显然仍然很有价值，但它不是硬件进步所能实现的那种变革性突破。\n\
  \n# SOTA 速度研究\n\nAI 加速优化的最先进水平（SOTA）是什么？我将主要关注推理，尽管训练和微调也有加速手段。主要有两个领域：\n\n* 数据中心推理（即：大量\
  \ GPU）\n* 端侧推理（不带 GPU 的手机和电脑）\n\n在数据中心优化方面，主要重点是多个 GPU 提供的所有并行化能力。一些较新的多 GPU 优化包括：\n\
  \n* 带有抢占机制的多 GPU 调度\n* 服务优化（Serving optimizations）\n* 批处理优化（Batching optimizations）\n\
  * 解离填充（prefill）和解码（decoding）阶段\n* 卸载（Offloading）\n\n有一些软件改进可以同时用于端侧和数据中心推理。减少内存或使用更少的计算是任何推理平台的技巧。在开源和商业平台中获得关注的一些软件优化包括：\n\
  \n* 4 比特量化（权重、激活值和/或 KV 缓存）\n* 分组查询注意力（`GQA`）——超越多查询注意力（`MQA`）\n* 自回归解码中的 KV 缓存（这现在是基本门槛）\n\
  * Flash attention\n* Flash decoding\n* Paged attention（分页注意力）\n* Paged Flash attention（结合版）\n\
  * 前缀 KV 缓存（基于会话的或通用的）\n* 分块填充填充（Chunked prefills）\n* 多-LoRA\n* 连续批处理（Continuous\
  \ batching）\n\n有一些软件优化是专门针对并行化的，因此对基于 GPU 的数据中心更有利（尽管 NPU 正日益使这一观点错误）。示例包括：\n\n\
  * 内核优化\n* 推测解码（Speculative decoding）\n* 分布式张量并行\n\n## 商业 AI 加速\n\n但大公司在用什么呢？这很难说，因为存在滞后。尽管如此，这里有一些例子。\n\
  \n### Character.AI\n这家做 AI 伴侣的公司由著名的 AI 研究员 Shazeer 共同创立。他们最近发布了一篇博客，描述了他们的数据中心以及每秒\
  \ 2 万次的查询。他们提到的技术包括：\n\n* GPU\n* INT8 量化（针对权重、注意力和 KV 缓存数据）\n* 多查询注意力（`MQA`）\n*\
  \ 混合局部/全局注意力——交替局部和全局注意力层\n* 跨层 KV 共享——KV 缓存中的一种层融合技术\n* 有状态缓存——基于会话\n* 粘性会话——每个网络会话返回同一节点，以便保留前缀\
  \ KV 缓存\n\n根据博客文章，他们的估计是，这些技术比简单的商业平台降低了 13 倍成本，从成立以来效率提高了 30 倍。\n\n### Apple Intelligence\n\
  在光谱的另一端，苹果最近宣布了他们端侧能力的细节，计划于 2024 年底和 2025 年初推出。他们的主要方法包括：\n\n* M 系列硬件（即：NPU）\n\
  * 小语言模型——3B 端侧基础模型。\n* 多个 LoRA 适配器（小模型的微调）\n\n苹果这里的策略是使用较小的模型作为基础模型，配有一个 3B 端侧模型和一个用于云执行的“较大”服务器模型。有趣的是，他们的另一个主要的端侧策略是使用多个\
  \ LoRA 适配器对这种小型端侧模型进行微调。\n\nLoRA 适配器是一种微调方法，通过添加少量额外参数，但保持主基础模型的参数处于“冻结”状态（微调期间不变）。这是一种参数高效微调（PEFT）。\n\
  \n\n\n\n\n这种 LoRA 方法比拥有多个微调过的 3B 基础模型版本并尝试在内存中反复交换几个 GB 的权重要好得多。相反，你只需要加载一次 3B 模型并将其永久保留在内存中，同时切换要小得多的适配器（adapters）。这还可以简化通过互联网为模型提供软件更新或修复的过程。\n\
  \n文中也包含了 LoRA 适配器的细节。这些适配器被应用于注意力矩阵、注意力投影矩阵以及全连接层。由于文档既提到了 2 位到 4 位的配置，又提到 LoRA\
  \ 权重的 16 位表示，这一点并不明确。\n\n模型的大小是实现设备端快速推理的主要因素，但也使用了一些额外的软件加速技术。为了加速推理，除了 LoRA 适配器外，还提到以下技术：\n\
  \n* 分组查询注意力（内存高效型）\n* 共享嵌入/解嵌入张量\n* 更小的设备端词汇表（本地为 49k，而服务器端为 100k）\n* LoRA 适配器（见上文）\n\
  * 激活量化\n* 嵌入量化\n* 针对神经引擎的高效 KV 缓存更新方法（细节未披露！）\n\n苹果尚未披露其 KV 缓存方法的细节。我好奇它是否是基于会话的前缀\
  \ KV 缓存（session-based prefix KV caching），这对于设备端推理是合理的，因为每个设备实际上只只有一个会话。\n\n这一切的唯一缺点是，大多数早期\
  \ iPhone 版本没有运行这些功能的硬件。对于 iPhone 15 及后续机型，苹果报告的每个 prompt token 延迟为 0.6ms（即预填充），解码速度为每秒\
  \ 30 个 token。\n\n### 训练效率\n尽管与用户没有直接关系，但苹果还详细介绍了其在训练效率和安全性方面的一些改进。关于训练能力，苹果提到了：\n\
  \n* TPU 和本地 GPU\n* 数据并行化\n* 张量并行化\n* 流水并行化\n* 全分片数据并行 (FSDP)\n\n### 模型压缩\n模型压缩是让\
  \ LLM 变得更小的方法。使用更小的 LLM 是提高速度的简单方法，因为它减少了内存占用和运行推理所需的总计算量。你可以考虑以下几种类型的“模型压缩”：\n\n\
  * 小型语言模型 (SLMs)\n* 量化\n* 剪枝\n\n#### 量化\n量化非常常见，只有对准确性有极严格的要求时你才会避免它。通常，量化使用如 16\
  \ 位整数或浮点数（`INT16` 或 `FP16`）、8 位整数 (`INT8`)，甚至 4 位整数量化 (`INT4`) 也常被用作速度与精度之间的良好权衡。注意，32\
  \ 位浮点数是非量化的基本尺寸，因此 16 位是尺寸的一半，8 位是四分之一，4 位是八分之一。更多关于量化的研究信息，请参阅 [`www.aussieai.com/research/quantization`](https://www.aussieai.com/research/quantization)。\n\
  \n#### 剪枝\n剪枝是通过将小权重置零来丢弃它们。你可以进行“无结构化剪枝”，无论小权重位于何处都将其零。这与“稀疏性”有关，即大部分地方都是零，但它们并不是一回事。\n\
  \n或者，你可以进行“结构化剪枝”，仅剪掉大型结构。理论上你可以在四个维度上对结构进行剪枝，这通常是动态完成的：\n\n* 深度——模型的层数（例如：早期退出、层剪枝、跳跳层）。\n\
  * 宽度——跨层的神经元（例如：注意力头剪枝、过滤器剪枝、通道剪枝）。\n* 长度——输入 token 序列（例如：输入 prompt 剪枝、token 剪枝、token\
  \ 合并）。\n* 内部维度——嵌入向量剪枝方法。\n\n然而，剪枝并没有量化那么常见，上述许多方法仍存在于研究论文，而非广泛的行业实践。例如，你会发现 Character.AI\
  \ 和 Apple Intelligence 都提到了量化，但两者都没有提到剪枝。更多关于模型剪枝的研究，请参阅 [`www.aussieai.com/research/model-pruning`](https://www.aussieai.com/research/model-pruning)。\n\
  \n最后，注意还有其他类型的模型压缩，例如知识蒸馏、权重共享、层融合和权重聚类。例如，Character.AI 提到了层融合，但它有点不同，因为它与 KV 缓存数据有关而非权重。\n\
  \n## 内核优化\n运行 Transformer 推理步骤的低级代码被称为“内核（kernel）”。优化最多的内核主要类型有：\n\n* 矩阵乘法\n* 注意力机制\n\
  * 解码算法\n* KV 缓存\n\nLLM 中的主要计算是矩阵乘法 (`MatMul`)，它被泛化为“张量积”。在早期，人们投入了大量精力让矩阵和张量的计算更快。惊讶的是，`MatMul`\
  \ 领域仍有很多突破发生，特别是设备端平台具有不同的特性。更多关于 MatMul 的研究，请参阅 [`www.aussieai.com/research/matmul`](https://www.aussieai.com/research/matmul)。\n\
  \n#### 注意力内核优化\n注意力是让 Transformers 著名的特殊算法。然而，它也很慢，现在已经通过数十种变体进行了优化，大多数旨在：(a) 通过减少对某些\
  \ token 的关注来减少总计算量，或 (b) 提高效率。以下是列表：\n\n* 多头注意力 (`MHA`) —— 来自 2017 年的基本思想。\n* 多查询注意力\
  \ (`MQA`)\n* 分组查询注意力 (`GQA`)\n* 局部注意力\n* 滑动注意力\n* 线性注意力\n* Flash Attention —— 还有\
  \ Flash Attention v2。\n* Paged Attention —— vLLM 开源平台的成名之作。\n* 结合方法\n\n更多关于注意力的研究，请参阅\
  \ [`www.aussieai.com/research/attention`](https://www.aussieai.com/research/attention)。\n\
  \n#### 并行解码算法\n非自回归解码是一种瓶颈，它强制 LLM 逐个 token 执行。许多并行化这种想法尝试已被发现：\n\n* 推测性解码\n* 检索查找解码\n\
  * Prompt 查找解码\n* 自推测解码\n* 树形推测解码\n* 多 token 预测\n* 激进解码\n\n更多关于推测解码和其他并行解码的信息，请参阅\
  \ [`www.aussieai.com/research/speculative-decoding`](https://www.aussieai.com/research/speculative-decoding)。\n\
  \n#### KV 缓存\nKV 缓存曾是一项创新，但现在是基础方法。当 Transformer 计算第 10 个 token 时，它使用前 9 个 token\
  \ 的计算数据，有人注意到可以将键值（KV）数据存储在内存中，从而避免对这前 9 个 token 进行重复计算。这就是基础的 `KV cache` 方法。\n\n\
  遗憾的是，它已经过头了。如果你写一本托尔斯泰的小说，大约 70 万字，约一百万 token，那么你将拥有每个 token 都占用内存的 KV 缓存。我的意思是，每个\
  \ token 占用很大，是张量的一个切片。因此，KV 缓存所需的内存实际上比整个 LLM 还要大。\n\n第一个解决方案是限制“上下文窗口”的长度，让你无法跟踪如此长的文本。早期模型的上下文长度为\
  \ 2048 或 4096，逐渐提高到 8k 和 32k。但对于理解书籍或处理大型图像视频并不理想，因此研究人员开发了两种优化类型：(a) 上述的注意力优化，以及\
  \ (b) KV 缓存压缩。\n\n\n\n\n\n`KV cache compression` 的核心思想是为 `KV cache` 使用更少的内存。有趣的是，研究人员为\
  \ LLM 权重模型压缩所尝试的几乎每一种方法，都可以同样应用于压缩 `KV cache` 数据——例如量化、剪枝等。`KV cache` 数据的量化非常常见，例如在\
  \ `Character.AI` 平台中，它还使用了 `KV cache` 数据的层融合（这类似于对 `KV cache` 进行深度剪枝）。关于诸如按长度逐 token\
  \ `KV cache` 数据剪枝等技术，已经有很多较新的研究论文。\n\n也许我们可以为 `KV cache` 再做一个 `KV cache`？即 `KV-squared\
  \ cache`。现在这成了一个可以申请专利的想法了！\n\n关于各种 `KV caching` 方法的更多研究，请参阅 [`www.aussieai.com/research/caching`](https://www.aussieai.com/research/caching)。\n\
  \n基础 `KV cache` 的一个重要局限性（无论是否压缩）是它仅在单个用户的当前查询内有效。而跨多个用户的多个查询优化推理，则是其他加速器的用武之地。\n\
  \n## AI 加速器\n\n加速 AI 引擎的主要方法是使用更好的硅片，并找到支持相应芯片集的推理引擎。一旦你达到了硬件极限，就必须考虑软件了，这意味着上文讨论过的内核优化，以及其他的附加加速器组件，这正是本节的主题。\n\
  \n第一点是，不要只优化你的 `LLM` 及其 `Transformer`，无论这有多么有趣。任何生产架构都包含其他组件，例如基础 Web 服务器、工具服务器、DNS\
  \ 服务器、身份验证等。你应该测量端到端的响应时间并优化整个系统。\n\n为了进一步增加复杂性，我们需要指出，许多针对 `LLMs` 的“加速器”实际上是接入了\
  \ `KV cache` 机制的。然而，其想法是一个跨多个查询的“全局 KV cache”，而不是单次查询内的基础 `KV cache`。但首先，让我们假装自己完全不知道\
  \ `K` 和 `V` 这两个字母。\n\n### 基础推理缓存\n如果你有一个被大量用户疯狂发送查询的 AI 应用，你会如何加速它？嗯，可以考虑的一点是用户经常会问相同的问题。如果是你的内部\
  \ HR 聊天机器人，例子如下：我如何参加 401(k) 计划？\n\n推测你有一份相关的政策文档，你只需返回一个指向该文档的答案即可。因此，每个问这个问题的人都能收到相同的答案。于是，“推理缓存”（Inference\
  \ Cache）的概念诞生了：在查询输入和 `LLM` 之间放置一个基础的文本到文本缓存机制。任何命中缓存的答案，`LLM` 都永远不会再次看到。\n\n###\
  \ 不可缓存查询\n像 AI 领域的所有事物一样，这种方法也有例外。并不是所有查询都可以缓存。例如，考虑这一个：“现在几点？”\n\n任何无法通过 `LLM`\
  \ 权重回答的查询都无法缓存。如果答案需要访问任何外部数据或使用任何工具（例如此例中的时），那么该查询的缓存必须失效。注意，`LLMs` 已经具有检测查询何时需要使用外部数据源和计算工具的机制（例如“触发\
  \ token”和“函数调用”），因此你可以扩展这些接口，在它们被触发时同样使该查询缓存失效。\n\n### 语义缓存\n基础推理缓存的另一个问题是 token\
  \ 必须完全相同。相同问题的表述略有不同会导致缓存未命中。因此，泛化方法是使用语义缓存来检测具有不同 token 但含义相同的查询。这种方法使用嵌入（embeddings）和向量数据库，效果比基础的文本到文本推理缓存更好。与推理缓存一样，你将其插入到输入和\
  \ `LLM` 之间。关于数据源或工具的不可缓存查询的相同限制也适用于语义缓存。\n\n### RAG 加速器\n如果你有一个 `RAG` 架构，还有其他组件可以加速。例如，性能取决于数据存储器和检索机制。加速数据库和索引检索方法听起来像是我们以前做过的事情，比如过去\
  \ 50 年或更久以前。\n\n此外，你可以在 `RAG` 查询架构面前放置推理缓存或语义缓存组件。只要 `RAG` 检索器没有访问外部数据，或没有进行任何依赖时间的操作，这种方法就能生效。如果你向\
  \ `RAG` 数据存储中添加新数据，你需要清除部分或全部缓存。\n\n注意，对重复查询结果进行缓存也是一种数据库优化技术。在这种情况下，它指的是基础数据库查询，即缓存\
  \ `RAG` 检索器返回的文本块，而不是与 `KV cache` 发生任何不愉快的交互。\n\n但针对 `RAG` 架构也有全局 KV cache 优化。毫无疑问，听到这个你会很高兴。与其存储文本块，不如存储预计算的\
  \ `KV cache` 数据。这个想法是前缀全局 KV 缓存和融合全局 KV 缓存的变体。\n\n### 高级加速器\n所以，如果你之前在跳读快速扫读，这里我对上述所有不同类型加速器的总结。以下是可以外部接入到\
  \ `Transformer` 推理引擎的高级加速器：\n* 推理缓存\n* 语义缓存\n* RAG 检索器缓存（数据库缓存）\n* RAG 推理缓存\n* RAG\
  \ 语义缓存\n* 提示词压缩（token 合并）\n* 提示词屏蔽（拦截查询，更多用于安全）\n\n### 低级 KV cache 加速器\n这里是深度接入\
  \ `Transformer` 内部 `KV cache` 的趣味方案：\n* 全局 KV cache（推理缓存）\n* 语义 KV cache（语义缓存）\n\
  * 前缀全局 KV cache\n* 会话 KV cache\n* 融合全局 KV cache\n* RAG 前缀 KV cache\n* RAG 融合 KV\
  \ cache\n\n这些是我的最爱！\n\n## 推理优化参考文献\n我们编写了超过 500 种加速 `LLM` 推理的技术，从激活量化到零跳过。这些技术有些在业界被广泛使用（例如量化、KV\
  \ cache 压缩），另一些非常冷门（例如零乘模型、对数数系统）。以下是我们的文献综述链接：\n\n1. Aussie AI，2024 年 11 月，AI 研究概览\
  \ [`www.aussieai.com/research/overview`](https://www.aussieai.com/research/overview)。\n\
  2. David Spuler，2024 年 9 月，500+ LLM 推理优化技术，A AI 博客 [`www.aussieai.com/blog/llm-inference-optimization`](https://www.aussieai.com/blog/llm-inference-optimization)。\n\
  3. David Spuler，2024 年 8 月，热点推理优化技术，A AI 博客 [`www.aussieai.com/blog/hot-inference-research`](https://www.aussieai.com/blog/hot-inference-research)。\n\
  4. Aussie AI，2024 年 11 月，推理优化技术 [`www.aussieai.com/research/list`](https://www.aussieai.com/research/list)。\n\
  \n\n\n\n\n# AI 对环境的影响\n\n环境影响是 AI 架构的一个关注点，因为它们消耗了大量的 GPU 能量。环境方面的关注点包括这些珍贵资源的使用：\n\
  \n*   运行 GPU 所需的电。\n*   冷却 GPU 所需的水。\n\n事实上，我读过的论文倾向于认为，运行一次基于 AI 的查询其成本是使用 Google\
  \ 或 Bing 进行常规搜索的十倍。情况可能会进一步化。显然，我们还没有到达这段 AI 之旅的终点，而且多 AI 架构和多步推理可能会增加负载。另一方面，小语言模型、内核优化和设备端推理可能会降低成本。\n\
  \n## 绿色 AI 研究\n\n有很多关于“绿色 AI”的研究型论文，它们对环境影响的整体衡量、应使用的指标以及其他通用领域进行了广泛的分析。关于关于绿色 AI\
  \ 的更多研究，请访问 [`www.aussieai.com/research/green`](https://www.aussieai.com/research/green)。\n\
  \n## 速度与环境效率\n\n我最喜欢的一点是，这个领域与“速度”研究有巨大的重叠。更快的 AI 引擎意味着所需的电量更少，而我很擅长让 AI 运行得更快，所以我正在做的工作是环保的！\n\
  \n这是结束本书的一个很棒的方式。显然，使用 `gprof` 对我的向量化 CPU 代码进行性能分析并调整 GPU 内核会有一些好的报报。\n\n"
