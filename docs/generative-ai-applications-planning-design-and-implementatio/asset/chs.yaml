  2.  Cameron R. Wolfe，2023 年 7 月 24 日，`Chain of Thought Prompting for LLMs: A practical\
  \ and simple approach for “reasoning” with LLMs`，[`towardsdatascience.com/chain-of-thought-prompting-for-llms-33c96eead38`](https://towardsdatascience.com/chain-of-thought-prompting-for-llms-33c96eead38)\n\
  3.  Shunyu Yao, Dian Yu, Jeffrey Zhao, Izhak Shafran, Thomas L. Griffiths, Yuan\
