  \n7. Sean Michael Kerner,2024 年 9 月 23 日，*代理 AI 如何改进企业数据运营*，[`venturebeat.com/ai/how-agentic-ai-could-improve-enterprise-data-operations/`](https://venturebeat.com/ai/how-agentic-ai-could-improve-enterprise-data-operations/)\n\
