  \n# 14. 训练与微调\n\n## 训练选项\n\n如今在大语言模型（LLM）训练领域很容易赚到大钱。你先拥有一笔巨款，然后开始训练。\n\n如果你想要一个新模型，而现成的商业或开源模型都不够好，以下是你训练一个更智能模型的基本选项：\n\
  \n* 从头开始一个新的基础模型（foundation model）。\n* 对现有模型进行微调 (`FT`）。\n* 基于 `LoRA` 的微调。\n* 使用文档数据库进行检索增强生成\
  \ (`RAG`)。\n\n这是一个非常棒的列表。让我们从顶端开始看起。\n\n### 训练基础模型\n\n从头开始训练自己的基础模型是相当昂贵的。我不建议你尝试在家里训练自己的基础模型。而且，何必费劲呢？如今顶尖的\
  \ LLM 无论是商业还是开源模型都非常优秀，而且你可以租赁或购买。因此，从头开始训练新模型可能被局限于非语言文本的机器学习项目，即使用你专有的非文本数据。\n\
  \n但别听我的。如果你真的有一笔九位数的融资轮次，那就尽管去训练你自己的基础 LLM 吧。从你的私人飞机上给我发张自拍。\n\n另一方面，微调现有模型要便宜得多。你可以使用\
  \ `LoRA` 微调，这甚至更便宜。`RAG` 可能更便宜，但它甚至不属于训练类型，所以它应该真的被欧盟因为虚假广告而禁止。\n\n还在读这些，说明你仍然想进行训练？我想这没问题，只要\
  \ GPU 托管成本不是从你的工资里扣除的。在优化训练项目方面，这里是一些值得考虑的方法：\n\n* 选择较小的模型维度（越小越便宜，但越大越智能）。\n* 评估开源模型与商业模型。\n\
  * 评估微调 (`FT`) 与检索增强生成 (`RAG`)。\n* 量化模型（“模型压缩”方法）。\n* 知识蒸馏（使用大型“教师”模型训练小模型）。\n* 数据蒸馏（使用大型模型自动生成的输出训练小模型）。\n\
  \n## 微调\n\n希望你已经清醒过来了，放弃了从头开始训练基础模型的念头。但既然如此，为什么不微调一个呢？\n\n如果你想做微调，这里有一份需要考虑的清单：\n\
  \n* 数据可用性 — 微调需要一些专门的数据，最好是你自己拥有的数据。\n* 高质量数据 — 有糟糕的数据比没有数据更糟。\n* 提示工程对比微调 — 微调的目标有时通过提示工程的微调更容易实现（例如，通过前置自定义指令来设定品牌语气）。\n\
  * `RAG` — 确保你已经考虑过 `RAG` 而非微调。\n* 成本 — 不同类型的微调具有不同的成本-准确率特征。\n\n微调是如何工作的？使用标准的 AI\
  \ 训练方法，用新材料对现有基础模型进行训练。使用额外的专家文本进一步训练模型被称为“微调”。这是 AI 理论中一种长期存在的方法，并且可以在所有主要的 AI\
  \ 平台上进行微调。在微调方法中，重新训练的结果是关于你产品的专有信息都在模型“内部”。\n\n### 微调的类型\n\n执行微调有多种方法，但基本分类为：\n\
  \n* 全参数微调\n* 参数高效微调 (`PEFT`)\n\n全参数微调是指调整整个基础模型中的每一个参数。这就像是继续对基础模型进行训练，但使用了专门的微调数据集。在\
  \ GPU 资源消耗方面，进行全训练也是相当昂贵的，尽管其初衷是使用的数据比训练原始基础模型所需的数据少得多。\n\n参数高效微调或 `PEFT` 是执行微调的新方法。其思想是“冻结”主基础模型中的大部分参数，并调整其中的子集。这使得模型权重的更新快得多。\n\
  \n执行 `PEFT` 最流行的方法被称为低秩适配器（Low-Rank Adapters），有一个可爱的名字叫 `LoRA`。它利用了低秩矩阵和复杂的矩阵代数技巧，使得你只需要训练一对小得多的矩阵中的参数，从而优化了微调成本。`LoRA`\
  \ 在推理过程中也有一个巨大的优势，即在加载 `LoRA` 适配器的初始设置成本外，在运行时不会产生额外成本。最常见的策略是“多 LoRA”，通过一组微调过的\
  \ `LoRA` 适配器来获得基础模型的多个专业化版本。\n\n### 微调算法\n\n无论你是在做全参数微调、`PEFT`、`LoRA` 还是许多其他变体，用于微调的训练算法在概念上都是相似的。你获取一些数据并将其通过训练引擎运行。\n\
  \n极高层面的通用训练算法如下：\n\n(a) 将训练数据按 80/20（有时是 90/10）分为训练数据（`training dataset`）和评估结果的数据（`validation\
  \ dataset`）。如果你有足够的训练数据，使用多个训练和验证数据集。\n\n(b) 将每个输入馈网络，使用 `loss function`（损失函数）与答案对比以生成\
  \ `error`（误差），并根据 `learning rate`（学习率）利用误差调整权重。\n\n(c) 在输入所有 80% 的数据后，使用 `validation\
  \ dataset` 评估新模型的性能。这是使用模型尚未见过的新数据。\n\n(d) 根据评估结果，你可以接受该模型或进行重大更改。例如，如果你给它完全未见的数据（即那\
  \ 20%），而它正确响应的概率只有 50%，你需要决定是继续下一个训练数据集，还是是时候重新设计模型并再次尝试了。如果模型表现糟糕，你必须分配责任：是训练数据不好，还是模型结构正确，还是损失函数正确，还是每次迭代中权重增量调整的学习率足够激进或过度激进等。为了这样做，调整模型元参数（例如层数、每层节点数等）或更改训练算法元参数（例如学习率），然后返回第一步重新开始。\n\
  \n这只是训练算法的高层大纲。要达到完全先进的微调算法，还有许多改进和细化。\n\n## 微调训练数据\n\n微调项目最大的障碍之一是获取足够的数据。许多微调看起来是个好主意的项目会因为没有足够的数据量来进行训练而流产。\n\
  \n为了使微调数据可行，它们通常需要具备：\n\n(a) 每个你想教给它的概念的多个案例，包含输入和预期输出。取决于神经网络架构，它可能还需要一个指示输出好坏的评分。\n\
  (b) 边缘案例和额外数据，以捕捉微妙的细节或复杂性。\n(c) 留出的额外案例，不用于训练，而用于评估训练状态。\n\n\n\n\n收集数据可能是训练中最困难的部分。你需要的训练迭代次数越多，所需的数据就越多。训练数据管理大部分是非编码任务，涉及对数据文件的处理，例如分块、组织、索引和生成嵌入（embeddings）。这在某种程度上是艰巨的，但技术难度并不高。\n\
  \n## 基于模型的训练\n\n另一种训练方法是让它与另一个预先训练过的系统对话。知识蒸馏是这些技术之一，它已经存在于主流 AI 框架中，并且具有很高的复杂度。另一种更简单的方法是在另一个大模型的“提示-答案对”上训练一个新模型，这在文献中没有统一的名称，但有时被称为“数据集蒸馏”或“下游数据”。\n\
  \n如果你喜欢计算机，那么你可能已经想到几种创建自己的数据的方法。遗憾的是，其他聪明的兔子已经抢在你先一步了！使用计算机生成的输入数据的通用概念被称为“合成数据”，但这并不意味着数据一定来自另一个模型的输出。\n\
  \n## 什么是 LoRA？\n\n`LoRA` 是参数高效微调（`PEFT`）的一种。这意味着我们不是进行“全参数”微调，而是只训练一个很小的子集。其思想是“冻结”主模型，只训练一小部分差异。\n\
  \n全参数微调是指我们继续进行整个训练过程，就像我们要从头开始继续训练一样。这种方法昂贵且非常消耗内存，因为我们必须更新每一个参数。如果我们以后想拥有多个这样的模型，这种方法效率也很低，因为我们每次都会得到一个各不相同的巨型微调模型。\n\
  \n因此，`LoRA` 的优势在于：\n\n* 高效的微调\n* 如果使用多个（即多 `LoRA`），则具有高效的推理能力\n\n### LoRA 是如何工作的？\n\
  \n微调的理念是我们想要改变矩阵中的一组数字。因此，我们不是改变原始模型矩阵中的权重，而是可以（概念上）生成一个独立的“差异”矩阵。稍后在推理阶段，我们可以加载主模型矩阵和差异矩阵，将它们相加，就得到了最终模型。在实践中情况要复杂得多，但让我们假设我们可以生成一个差异矩阵。\n\
  \n但这为什么会更高效呢？存储两个大矩阵（原始矩阵和差异矩阵）并不比只存储一个好。\n\n嗯，它更快是因为我们没有通过存储一个巨大的差异矩阵，而是使用矩阵的“低秩分解”（low-rank\
  \ decomposition），这是一种矩阵分解类型，用来生成两个小得多的矩阵。原理是这两个较小的矩阵在相乘时会重新生成大矩阵。\n\n**矩阵分解。** 如果你还记得高中学过的非方阵矩阵乘法，维度的计算如下：\n\
  \n```\nM x N 乘以 N x P = M x P\n```\n\n`N` 去哪里了？内部维度 `N` 不在最终尺寸中使用。\n\n因此，如果我们希望最终矩阵是\
  \ `1000x1000`，那么 `M=P=1000`。是的，我知道在实践中它们会是 2 的幂次方大小，但那让数学计算对我来说太难了。\n\n现在有趣的地方在于，为了创建我们\
  \ `MxP` 大小的矩阵，你可以发现 `N` 是多少并不重要，因为消消失了。最小的情况是使用 `N=1`。因此，我们有一个 `1,000x1` 的矩阵（列）乘以一个\
  \ `1x1,000` 的矩阵（行）。\n\n这非常高效！与其在大矩阵中拥有 `1,000,000` 个权重，我们只在一列一行中拥有 `2,000` 个权重。因此，我们只有非常少的权重需要训练。从百分比来看，这极小，比如\
  \ `2%` 或 `0.2%` 之类的。我的 AI 计算器在哪？\n\n遗憾的是，这种矩阵技巧并非完美。并不是所有的 `1,000x1000` 矩阵都能精确分解为一列乘以一行。相反，我们必须找到尽可能接近的解，这意味着低秩分解是一种近似值。\n\
  \n**LoRA 适配器。** 在大多数 `LoRA` 实现中，我们并不使用 `N=1`。较高的 `N` 值会让近似更准确，像 `N=8` 到 `N=256`\
  \ 这样的值更为常见。但 `LoRA` 适配器中的参数数量仍然远少于大矩阵的平方级。\n\n所以，“LoRA 适配器”实际上只是两个小低秩矩阵的集合。存储更少，加载到内存的成本也更低。\n\
  \n整个过程比这复杂一点，因为每一层都不同。我们需要为每一层准备一组低秩矩阵。因此，一个 `LoRA` 适配器是一组每层配对低秩矩阵。\n\n此外，每层可以有多个矩阵。`LoRA`\
  \ 的变体不仅体现在矩阵维度，还体现在我们想要针对层内的哪些参数：注意力权重和/或 FFN 权重。通常的共识是，注意力权重是 `LoRA` 权重的优先选择，如果你需要额外的准确性（付出额外成本），可能会处理\
  \ FFN 权重。如果你两者都做，那么模型的每个层实际上就有两个 `LoRA` 适配器，这意味着每层有四个低秩矩阵。\n\n**推理。** 使用微调后的模型初始化推理服务器的操作会稍微慢一点，这是因为在在其低秩矩阵中加载并安装\
  \ `LoRA` 参数时多了一个额外的设置步骤。但一旦加载完成，我们在推理时就没有零额外延迟。`LoRA` 适配器中的额外参数在推理期间不再被使用。\n\n推理的原理是将主基础模型和\
  \ `LoRA` 适配器都加载到内存中。分解后的矩阵对相乘创建一个巨大的“差异”矩阵，然后将其简单地加到基础模型上。这一步之后，`LoRA` 适配器就不再需要，只使用修改后的基础模型以正常方式进行推理。低秩矩阵和计算出的差异矩阵都不需要留在内存中。请注意，实际的代码引擎通过内核融合（kernel\
  \ fusion）优化的魔力，实际上永远不会在内存中存储巨大的差异矩阵。\n\n## 多 LoRA\n\n如果我们想要两个或多个微调后的模型，就会产生多 `LoRA`\
  \ 的想法。请注意，多对低秩矩阵（每层一对）仍然被视为单个 `LoRA` 适配器。多 `LoRA` 仅当你对整个过程进行两次时，才会获得两个或多个 `LoRA`\
  \ 适配器。\n\n多 `LoRA` 的优势包括：\n\n* 针对同一个基础模型的多个微调模型。\n* 微调成本低于全参数微调。\n* 推理的额外成本几乎为零。\n\
  * 在微调模型之间切换非常高效。\n\n\n\n每个 LoRA 适配器都比 3B 基础模型小得多，参数量在“千万级”。因此，每当你的 iPhone 想要执行不同的\
  \ AI 任务时，都可以以较低的成本动态切换 LoRA 适配器。\n\n## 训练常见问题\n\n### 什么是预训练（pre-training）？\n它并不是一种特定的训练算法，而是指你已经训练好了模型。这个术语主要出现在生成式预训练器（GPT）中，你可能听说过它。\n\
  \n商业服务提供对预训练模型的访问是很常见的。例如，`OpenAI API` 允许你向预训练的 `GPT` 模型发送查询，这些模型具有广泛的训练能力。同样，还有许多开源预训练模型可用，例如\
  \ Meta Llama2 模型以及各种更小的模型。\n\n### 什么是重新训练（re-training）？\n同样，这并不是一个真正的技术术语。它通常意思和微调（fine-tuning）相同。\n\
  \n### 什么是知识蒸馏（knowledge distillation）？\n知识蒸馏（`KD`）是一种优化技术，通过让大模型训练小模型，从大模型创建一个更小的模型。因此，它是一种使用更大的教师模型来训练较小学生模型的“自动训练”类型。它之所以更快，是因为一旦训练完成，你只需要较小的学生模型来处理用户查询，而完全不使用大模型进行推理。\n\
  \n蒸馏是一种已知且经常用于节省成本但保持准确性的方法。例如，大型基础模型通常具有许多你并不关心的能力。有多种方法使用“蒸馏”让大模型教较小模型，但仅限于其能力的一个子集。既有共享推理结果的方法，也有更先进的内部权重传输策略。\n\
  \n### 什么是模型初始化（model initialization）？\n那是你使用 `malloc` 分配一个超过你机器容量的内存块。嗯，不是。模型初始化是训练算法的重要部分，正如你可能已经猜到的，这指的是训练的开始。\n\
  \n由于训练通过少量增量地更新参数来创建一个智能模型，如果参数已经接近目标位置，效果会更好。所以，你不会仅仅从一个全为零的模型开始开始训练。相反，你尝试通过更好的初始化来“启动”这一过程。然而，初始化值的最佳选择尚还不完全清楚，关于这个主题有很多研究论文。\n\
  \n## 参考文献\n\n1. Yarally T, Cruz L, Feitosa D, et. al., 2023, Uncovering energy-efficient\
  \ practices in deep learning training: Preliminary steps towards green AI, International\
  \ Conference on AI Engineering - Software Engineering for AI (CAIN), [`arxiv.org/abs/2303.13972`](https://arxiv.org/abs/2303.13972)\n\
  2. A. Apicella, F. Donnarumma, F. Isgrò, and R. Prevete, 2021, A survey on modern\
  \ trainable activation functions, Neural Networks, vol. 138, pp.14–32, [`arxiv.org/abs/2005.00817`](https://arxiv.org/abs/2005.00817)\
  \ (关于使用激活函数训练的详尽调查，例如 `RELU`, `Swish`, `Maxout`, `leaky RELU$.)\n3. R. Immonen,\
  \ T. Hämäläinen et al., 2022, Tiny machine learning for resource-constrained microcontrollers,\
  \ Journal of Sensors, vol. 2022, [`www.hindawi.com/journals/js/2022/7437023/`](https://www.hindawi.com/journals/js/2022/7437023/)\
  \ (关于 TinyML/边缘计算设备内训练的调查。)\n4. P Freire, E Manuylovich, JE Prilepsky, SK Turitsyn,\
  \ 2023, Artificial neural networks for photonic applications—from algorithms to\
  \ implementation: tutorial, Advances in Optics and Photonics, Sep 2023, [https://opg.optica.org/directpdfaccess/f0ae8746-2f89-4ac4-bb598eda29c7977c_539680/aop-15-3-739.pdf?da=1&id=539680&seq=0&mobile=no)\
  \ (涵盖训练优化未来许多方面的大型综述。)\n5. Marcos Treviso, Tianchu Ji, Ji-Ung Lee, Betty van Aken,\
  \ Qingqing Cao, Manuel R. Ciosici, Michael Hassid, Kenneth Heafield, Sara Hooker,\
  \ Pedro H. Martins, Andre F. T. Martins, Pe- ́ter Milder, Colin Raffel, Edwin Simpson,\
  \ Noam Slonim, Niranjan Balasubramanian, Leon Derczynski... (为了简洁已省略)\n\n# RAG 架构\n\
  \n### 什么是 RAG？\n\n检索增强生成（`RAG`）是一种将外部数据源与基于 AI 的回答相结合的技术。实际上，它只是로高级说法：查询数据库并让 `LLM`\
  \ 进行总结。当运行良好时，`RAG` 结合了搜索数据库的速度和 `LLM` 流畅写作的能力。\n\n`RAG` 是一种将 AI 与外部文档检索机制相结合的架构。包含三个组件：\n\
  \n- 检索器 (Retriever)\n- 生成器 (Generator)\n- 数据存储 (Datastore)\n\n检索器（retriever）组件在文档数据存储中查找用户查询，使用关键词搜索或向量搜索。这本质上是一个访问数据库并找到所有相关材料的搜索组件。通常它返回的是摘要或片段，而不是完整的文档。\n\
  \n在 `R` 中，生成器（generator）组件的作用是从检索器处接收回文档片段，并将其汇总为 AI 模型的提示词（prompt）。文本片段作为用户问题的上下文合并，合并后的提示词发送到\
  \ AI 引擎。因此，生成器的角色主要是提示词工程和向 `LLM` 发送请求，它通常是一个相对简单的组件。\n\n数据存储（datastore）可以是带有关键词查找的经典数据库（例如\
  \ `SQL` 或 `MongoDB`），也可以是带有语义查找的向量数据库。使用语义查找可以提供更有意义的文档搜索结果和更好的模型回答，但需要两个额外的步骤。首先，必须将用户查询转换为表示其语义含义的向量格式（称为\
  \ `embedding`）。其次，需要使用该 `embedding vector` 进行向量数据库查找。\n\n\n\n\n## RAG 是如何工作的？\n\n\
  举个例子，假设你正在创建一个 AI 系统，用于回答有关公司最新产品的问题，这些细节可能已经存在于你的网站上，或者包含在描述产品的精美 PDF 营销文档中。你如何让\
  \ AI 系统回答关于这些产品的问题呢？\n\n在 RAG 方法中，模型本身并不知道你最新产品的详细数据或文档。相反，RAG 架构中的引擎知道：\n\n(a)\
  \ 在你的公司文档中搜索最相关的文档（`retriever`检索器），以及\n\n(b) 将文档的相关部分总结为用户问题的答案（`generator`生成）。\n\
  \n与微调（fine-tuning）不同，RAG 方法并不将你的公司文档作为训练数据填充到更新后的模型中。相反，文档是输入数据源，通过 `retriever`\
  \ 搜索组件进行整合，并使用原始的模型作为输入发送给 AI 引擎。RAG 可能需要一些“提示词工程”（prompt engineering），将文档搜索结果和用户的查询相结合，但基础模型本身不会改变。\n\
  \nRAG 组件通常由文档数据存储和一个搜索机制组成。典型的设置是一个向量数据库，其中包含根据其内容的语义向量化进行索引的文档。搜索机制首先将传入的查询向量化为其语义分量，然后找到具有“最近”匹配向量的文档，这表示它们具有密切的语义相似性。\n\
  \n### 文档片段\n\n通常，来自 `retriever` 组件的结果是文档的小节或片段，而不是完整的文档。之所以选择小节是理想，是因为：\n\n(a) 让\
  \ AI 引擎处理大型文档的成本很高，以及\n\n(b) 它有助于 AI 快速找到最相关的信息。\n\n被检索到的片段或文档部分将返回给 AI。它们将作为 AI\
  \ 引擎的“上下文”附加在用户的搜索查询之前。然后将使用提示词工程来确保 AI 引擎根据上下文文档章节的信息来回答用户查询。\n\n## RAG 项目设计\n\n\
  典型 RAG 项目的通用实现步骤如下：\n\n1. 数据识别。识别你希望让 RAG 系统成为专家专有数据。这同时也意味着要如何摄入数据。例如，它可能是一个 JIRA\
  \ 客户支持数据库、一个 Confluence 空间或磁盘上的 PDF 文件目录。\n\n通常，任何类型的“知识库”都可以使用。一些常见的内部示例包括产品文档、HR\
  \ 福利信息、公司政策和其他内部培训材料。外部示例包括工单系统（经过仔细清洗）、客户产品文档和支持信息。\n\n注意，知识库的基础随时间的推移会变化并扩大。必要考虑刷新操作，因为清理并重新开始的成本很高，特别是当正在计算嵌入（embeddings）时。\n\
  \n2. 规模确定。确定数据“块”（chunk）的大小。模型的上下文大小在这里很重要，因为分块的大小必须显著小于上下文大小。当用户提问时，系统将获得 3-5 个与问题相关的知识摘要。这些片段将与问题结合。更糟糕的是，如果用户和模型之间需要进行双向对话，则需要在上下文大小中留出额外空间以备后续问题。\n\
  \n注意，可能会有两个上下文大小在起作用：生成答案的 `LLM` 的上下文大小，以及产生 `embeddings` 的 `LLM` 的上下文大小。这两者不同是很常见的，`Embedding`\
  \ 的生成通常使用更“便宜”的引擎。如果一个 RAG 系统之前已经实现且现在正在进行修改，你应该重新检查初始假设，因为模型上下文大小已经增加，且模型成本已有所改进。\n\
  \n3. 分割章节。确定如何对数据进行“分块”。需要识别分块的边界，如果是网页，则可能是标题后的章节。较大的章节可能需要在每个分块中包含标题和一两个段落。来自\
  \ bug 跟踪系统的内容可以使用主描述作为一个分块，将后续评论作为另一个块或多个块，并将识别出的解决方案作为另一个块。在分块之间进行“重叠”（overlap）通常是有益的，以隐藏发生分块这一事实。\n\
  \n4. 基于文本的数据库上传。每个块都需要被组织并存储在基于文本的搜索引擎中，例如 `Elastic Search`、`Azure Cognitive Search`（此处原文为\
  \ Azure Cognitive Search）等。对于文档和网页，组织可以非常简单，但对于结构复杂的工单系统（例如问题描述、注释、解决方案），所有内容都需要以某种方式相关联。\n\
  \n5. 向量数据库上传。需要计算每个块的嵌入并将其存储在 `Vector Database` 中。你可以将嵌入看作是从模型角度对块进行的“总结”。返回的向量通常是多维的，具有\
  \ 50 多个维度。每个维度代表内容中的单一概念。其理念是，从模型的角度来看，相似的内容会产生相似的向量。向量数据库可以使用向量查找快速找到具有相关数据的块。\n\
  \n6. 优化。嵌入有时可以使用惰性评估算法计算（避免对从未使用的文档进行嵌入计算），但这也会减慢推理，而全预计算速度更快。用于计算嵌入的模型不需要与回答问题的模型相同。因此，可以使用更廉价的模型进行嵌入，例如\
  \ `GPT-Turbo`，而可以使用 `GPT-4` 来回答问题。\n\n## RAG 详细算法\n\nRAG 算法并不是训练。提示词工程在提示词中为模型回答问题所需的所有内容。你实际上是在使用\
  \ `LLM` 将你的内容与它自己的知识（有限地）混合，优雅地回答问题，然后进行对话。\n\nRAG 架构中用户请求的基本算法流程可能如下：\n\na. 接收用户查询（输入）。\n\
  \nb. 使用用户查询对索引进行基于文本（关键词）搜索，获取前 `X` 个命中结果（文档或片段）。\n\nc. 计算查询的“嵌入”（一种用数字表示其语义含义的向量）。\n\
  \nd. 计算前 `X` 个命中结果（来自文本搜索）的嵌入，并将这些嵌入向量添加到向量数据库。\n\ne. 对嵌入进行向量搜索，获取前 `Y` 个命中结果。\n\
  \nf. 过滤前 `X` 个命中结果（基于文本）和前 `Y` 个命中结果（基于向量）以寻找重叠，这种重叠代表了最好的文本和向量命中结果。如果没有重叠，则从每个部分选取。\n\
  \ng. 将顶部命中结果与之前问题的摘要相结合。\n\nh. 获取顶部命中结果的内容并使用提示词工程创建一个如下的问题：\n\n“给定 `<summary>`、`<chunk\
  \ 1>`、`<chunk 2>`、`<chunk 3>`，回答 `<用户问题>`。仅根据提供的数据回答。如果你不知道，请回答我不知道。引用所使用的内容。”\n\
  \ni. 将提示词发送给 `LLM`，接收 `LLM` 返回答案。\n\nj. 将答案中的任何引用解析回终端用户可以点击的 URL，例如 Confluence\
  \ 页面、Jira 工单/注释/解决方案等。\n\nk. 使用模型总结目前为止的对话（即后续问题的上下文）。\n\nl. 返回答案 + 摘要（可能经过编码）。其理念是编码的摘要不会显示在当前答案中，而仅供\
  \ RAG 组件内部用于后续问题。\n\n\n\n\n\nm. 客户端或调用者负责上下文管理，这意味着要确保对话快速结束，并且新话题会产生新的对话。否则，上下文会迅速填满，`LLM`\
  \ 会忘记它已经说出来的内容，导致情况变得混乱。\n\n上述算法在生成两组命中结果（前 X 和前 Y）方面是详尽的。严格来说，并不需要进行两次搜索（一次使用文本关键词，另一次使用向量嵌入），因为通常向量嵌入就足够足够了。或者，基于文本的关键词搜索通常更廉价，可以跳过向量查找。归根结底，我们寻找的是最可能包含问题答案的切块（chunks）。\n\
  \n## 特殊情况\n\n如果一个 `RAG` 系统只需要编写这些代码那就好了。这里还有其他一些需要考虑的特殊情况：\n\n- `retriever` 没有返回任何分块（分为两种情况：关键词检索和向量数据库检索）。\n\
  - 返回的分块被 `reranker` 评分过低，实际上等同于没有分块（即所有分块的评分都低于相关性阈值）。\n- 查询需要“工具”或“函数调用”（例如，需要一个时钟来回答：“现在几点了？”）。\n\
  - 查询需要外部数据源，例如网页搜索，而你的 `RAG` 系统可能支持也可能不支持。\n\n我的大脑在疼。这到底涉及到多少种不同的输入情况？\n\n在这些情况下，没有标准答案。处理返回零分块的情况可以直接退出并返回固定的不友好的消息（“错误：无分块”），或者根据不同的提示词模板返回更友好的\
  \ `LLM` 响应（“我不知道那个答案，但这里有一句来自哈姆雷的引用。”）。\n\n另一方面，即使你一无所获，可能仍然想向你的客户卖点什么。例如，`RAG`\
  \ 系统是一个装扮顾问，用户的查询是：“我今天应该穿什么？”\n\n这不太可能与特定的服装产品 `RAG` 文档有任何良好的匹配。简单高效的解决方案就是给出一个通用的销售辞令回复，这可以是固定的文档。\n\
  \n但如果个性化是必要的（是的），并且天气工具可用（可能），而且你的 `LLM` 经过训练，可以识别针对特定日期或季节的搜索（可能没有），那么就可以调用天气工具，并将返回的天气状况替换到查询中。通过更好的关键词，就可以从\
  \ `RAG` 存储中检索出良好的服装选择。查询将实际上变为：“当天气寒冷且可能有雨时，我应该穿什么？”\n\n注意，这个想法实际上需要两个工具。要获取天气，你首先需要根据用户的\
  \ IP 地址或其他 Cookie 知道用户的的大位置，这是另一个工具。\n\n## 向量数据库\n\n一些著名的向量数据库有 `Pinecone`、`Milvus`、`Chroma`、`Weaviate`、`Qdrant`、`FAISS`。通用数据库系统如\
  \ `Elastic`、`Redis` 和 `Postgres` 等也具有一些向量能力。\n\n向量数据库的主要特性是能够基于向量进行查询。基本上，你是在寻找向量在\
  \ N 维空间中彼此有多近。`Cosine similarity`（余弦相似度）是一种常见的比较方法，其他算法还包括最近邻、最小二乘法等。\n\n向量数据库查找的速度对于快速推理延迟至关重要。每个向量还需要与数据库中的实际数据或文档关联。\n\
  \n## RAG 数据管理\n\n在为 `RAG` 实现编译数据时，你确实需要费力确保你的内容数据库中包含回答问题的数据。但它不需要大量的样本。事实上，即使只有一个包含一个数据块的命中，也足够让\
  \ `LLM` 形成答案。对于任何 `RAG`，如果你在文本索引或向量索引中搜索但没有获得良好的命中结果，它将产生糟糕的结果。此外，与微调数据不同，`RAG`\
  \ 不需要问答类型的内容，只需要可以搜索的文档。\n\n数据对于一个成功的 `RAG` 项目至关重要。`RAG` 系统在概念上与在 Google 上搜索自己的数据没有太大区别。最后，你拥有了一个产生比\
  \ 90% 的人更流妙文字的东西。\n\n## 关键词查找算法\n\n作为关键词查找组件的示例，让我们来看“最佳匹配 25”或 `BM25` 算法。这是一种传统的关键词搜索算法，在很多\
  \ AI 工作之前就已经存在，并且比基于嵌入的向量研究更容易理解。像 `BM25` 这样的关键词搜索算法可以作为 `RAG` 的关键词检索器。\n\n从高层来说，`BM25`\
  \ 包含以下步骤：\n\n1. 处理查询以删除小词（例如“the”、“and”、“this”、“that”等），留下查询的核心词。\n2. 使用反向索引找到所有与每个单词匹配的文档（分块）。\n\
  3. 对这些分块或文档进行评分和排序。\n4. 返回前 25 个作为关键词查找结果。\n\n排序评分基于：\n- 查询词在分块/文档中出现的次数。\n- 每个单词在分块/文档中出现的频率。\n\
  - 每个单词在所有文档中的稀有程度。\n- 分块或文档的长度。\n\n所有这些测试都可以对每个单词进行暴力计算（预计算），因此在运行时只需要计算每个指标的组合。推测计算中可能还有其他权重，例如可能存在特定于你知识库的“词汇”。\n\
  \n这种算法通常作为 `RAG` 架构中的关键词检索器。在整个算法的最后，前 25 个分块或文档将作为关键词查找的结果传递给 `LLM`，然后整合到整个 `RAG`\
  \ 算法中。\n\n## 微调与 RAG\n\n如果你想要一个根据你的公司数据表生成答案的 AI 引擎，有两种主要选择：\n\n- `微调 (FT)`：重新训练模型以回答新问题。\n\
  - `检索增强生成 (RAG)` 架构：使用未更改的模型总结文档摘要。\n\n这两种基本方法显著不同，具有完全不同的架构和项目成本结构。每种方法都有自己的优缺点。\n\
  \n剧透警告！`RAG` 和微调可以结合使用。\n\n### RAG 的优势\n\n`RAG` 架构通常具有以下优势：\n- 预成本较低\n- 灵活性\n- 内容更新\n\
  - 访问外部数据源和/或内部文档\n- 来自文档的内容丰富的答案\n- 可解释性（引用）\n- 个性化更容易\n- 幻觉减少（如果检索器找到了答案）\n- 可扩展到数据存储可以处理的文档数量。\n\
  - `RAG` 在专业知识方面被认为是中等难度。\n\n`RAG` 的主要目标是避免昂贵的模型重新训练和微调。然而，`RAG` 在 `RAG` 组件及其数据库方面增加了额外成本，无论在项目设置还是持续使用中都是如此，因此它并不总是优选。\n\
  \n除了成本动机外，`RAG` 在更新答案内容的灵活性方面可能具有优势。有了 `RAG` 组件，任何新文档只需添加到文档数据存储中，而不需要每个新文档都经过模型重新训练周期。这使得\
  \ AI 应用更容易在保持答案中保持最新信息。\n\n### RAG 的劣势\n\n在底层模型未经过微调的情况下，`RAG` 的劣势包括：\n- 需要架构更改（检索器组件与模型推理集成）。\n\
  - 推理延迟和用户响应时间较慢（架构中的额外步骤）。\n\n\n\n\n\n## RAG 的挑战与局限性\n\n*   文档片段带来的额外上下文 token（导致响应速度变慢并增加推理成本）。\n\
  *   检索器组件和数据存储的额外持续成本（例如：托管、授权）。\n*   需要更大的基础模型（增加了延迟和成本）。\n*   模型的回答风格可能与领域不匹配（例如：风格、语气、术语、专业词汇错误）。\n\
  *   数据更新可能需要重新摄取。\n\n为了保持数据更新，需要定期摄取数据，`FT` 也是如此。在 `RAG` 中，源数据的任何重大变化都可能需要`全部` 重新摄取。即使数据没有变化但经过了重新组织，也需要重新摄取。如果你在处理修订时不小心，引用链接可能会指向\
  \ 404 页面。从技术上讲，这也是 `RAG` 的优势之一，因为与微调相比，摄取的成本并不昂贵。\n\n### 不必要的“愚笨”代价\n`RAG` 系统还有一个更根本的局限性：它们并不比所使用的\
  \ `LLM` 更聪明。事实上，一个典型的 `RAG` 系统：\n*   什么都不记得\n*   什么都不学习\n\n整体的 `RAG` 实现依赖 `LLM`\
  \ 来提供基础常识、对话能力和简单的智能。它通过额外数据扩展了 `LLM`，但并没有提供额外的内存或技能。\n\n`RAG` 系统并不记得它看到的任何块（chunks）。相反，它在每次查询时都必须重新扫描它们。它没有以前见过这些内容的记忆，除非存在\
  \ `KV cache`，这可以帮助它运行得更快，但不是更聪明。\n\n`LLM` 并不会从数据块中学到任何能将其知识提升到更高层次的内容。例如，如果你向一个包含百本编程书分块版本的\
  \ `RAG` 系统提问，我怀疑你能让它生成一个“贪蛇游戏（Snake Game）”。但你完全可以问它该语言中 `switch` 语句的语法，因为那可能已经记录在模型权重中了。\n\
  \n通过 `RAG` 架构，模型并没有“学习”到任何新知识，你只是确保它有正确的数据来回答问题。例如，如果你询问 `switch` 语句是如何工作的，希望 `retriever`\
  \ 能找到来自编程书中 `Switch` 章节的块，而不是来自五个使用了 `switch` 语句的随机代码示例。这完全取决于基于文本的关键词索引以及语义嵌入向量的效果。`RAG`\
  \ 中的 `R` 代表 `Retrieval`（检索），它非常依赖这一点。\n\n它在某种程度上也取决于 `RAG` 数据的初始摄取。例如，如果处理得当，摄取逻辑和分块可以识别原始内容中的文本与代码段，然后进行适当的分块或分类。\n\
  \n关于“持续学习”、“持续适应”或“增量学习”的研究已在展望中。未来的 `RAG` 系统可能会从文档的文本块（或与用户的对话）中保留某些知识。也许一些更快的微调算法，例如参数高效微调（`PEFT`）或低秩自适应器（`LoRA`），在未来将会提高\
  \ `RAG` 的学习能力。\n\n## 微调的优势\n\n与 `RAG` 方案相比，微调架构的主要优势包括：\n*   可以训练回答的风格和语气——例如：积极、礼貌。\n\
  *   在回答中使用正确的行业术语和专业词汇。\n*   可以调整品牌声调。\n*   无需更改推理架构——只需更新模型。\n*   更快的推理延迟——没有额外的检索器搜索步骤。\n\
  *   更低的推理成本——更少的输入上下文 token。\n*   没有检索和数据存储组件的额外成本。\n*   可以使用更小的模型——进一步降低推理成本。\n\
  *   你更有可能获得免费午餐并在周末乘坐公司的私人飞机。\n\n微调不是架构的改变，而是主要模型的更新版本（例如：`GPT-3`），而 `RAG` 是一种不同的架构，它集成了搜索组件，该组件访问外部知识数据库或\
  \ `datastore` 并返回一组文档或文档分块/片段。\n\n## 微调的劣势\n\n不带 `RAG` 的微调架构的劣势包括：\n*   训练成本——前期和定期的计划性微调都是昂贵的。\n\
  *   回答中使用了过时信息。\n*   比 `RAG` 需要更多的私有数据。\n*   训练数据必须是成对的输入输出格式，而 `RAG` 可以使用非结构化文本。\n\
  *   准备和格式化训练数据的复杂性（例如：分类和标记）。\n*   无法访问外部或内部数据源（除已训练过的内容外）。\n*   幻觉概率更高（如果它没有训练过答案）。\n\
  *   个性化功能难以实现。\n*   缺乏解释性（很难知道模型如何推导出答案或来自什么来源）。\n*   可扩展性差（例如：如果有太多文档需要重新训练）。\n\
  *   微调（训练）在 AI 专家领域被认为是最高难度的项目之一。\n\n微调的主要劣势是微调模型所需的 `GPUs` 计算成本。这至少是一笔巨大的前期成本，也是为了用最新信息重新更新模型的持续成本。进行计划性微调的固有劣势是模型总是过时的，因为它只包含到最近一次微调为止的信息。这与\
  \ `RAG` 不同，后者可以使用新文档中的信息快速响应，甚至在添加几秒钟后。\n\n### 成本比较\n\n微调方法有前期成本，但推理成本较低。然而，微调可能需要按照计划定期进行，因此这不是一次性成本。微调持续推理成本较低是因为：(a)\
  \ 不需要额外的 `retriever` 组件，以及 (b) 可以更更的模型。\n\n`RAG` 的成本结构则相反。`RAG` 方案在搭建架构方面的初始成本较低，但微调项目也是如此。在持续成本方面，`RAG`\
  \ 的每次查询都会增加推理成本，因为 AI 引擎需要处理额外信息要做更多工作。还存在隐藏成本，即 `RAG` 架构可能会增加发送到推理引擎的输入 token 数量，这会增加推理成本，无论是商业托管还是在内部运行。这种额外的\
  \ `RAG` 推理成本将贯穿应用程序的生命周期。\n\n最后一点：你需要双重检查 `RAG` 是否比微调更便宜。我知道，我知道，抱歉！我之前写过它比微调便宜，现在我要收回这个说法。\n\
  \n但商业现实就是如此。有许多商业供应商在推销 `RAG` 架构的各种组件，有些还在炒作它比买一卡车的 `GPUs` 要便宜。但微调并没有那么糟糕，你需要清醒地比较这两种方案的定价。\n\
  \n人员配置在 `RAG` 与微调对比中也是另一个问题。微调可能需要一些精通机器学习的数据科学家，而 `RAG` 只需要你没有太多机器学习经验的普通程序员。\n\
  \n## 提示词工程与 RAG\n\n提示词工程在 `RAG` 算法中以多种方式使用。例如，它用于将文档片段与用户问题合并，还用于管理长对话的往返上下文。`RAG`\
  \ 提示词工程进入 `LLM` 的基本序列是：\n\n*   前言（例如：全局指令）\n*   块 1\n*   块 2\n*   块 3\n*   用户查询\n\
  *   落地准则（提示词工程）\n\n\n\n\n通常情况下，RAG 块首先作为“上下文”出现，然后附加用户的查询。但我读过至少一篇研究论文，极力赞誉在 RAG\
  \ 块之前“前置”用户查询的许多优势，但祝你好运能找回那篇论文，因为我不记得引用出处了。那个想法还会破坏 RAG 中可以实现的某些惊人的“前缀 KV 缓存（prefix\
  \ KV caching）”，所以无论如何，速度都会变慢，而我们无法接受这一点。\n\n与任何提示工程一样，调整各项项的顺序可以产生更好的结果。重复内容也有帮助。通常提供如下提示指令是很有用的：\n\
  \n```\nUsing the following <chunks> answer <query>.\nMake sure only the chunks are\
  \ used and provide the number of chunks used.\n```\n\n重复查询通常也有用：\n\n```\nAnswer\
  \ <query> using <chunks>.\nWhen answering <query> remember to only use information\
  \ provided and provide the number of the chunks used.\n```\n\n在结尾重复内容有助于让大模型（LLM）重新聚焦。如果\
  \ `<query>` 位于 `<chunks>` 之前，它可能距离太远，从而导致其对推理的影响减少。\n\n并不是所有的指令都需要在同一个 LLM 查询中。你可以可能先与\
  \ LLM 进行一段序言对话，解释后续查询将是什么样，甚至可以提供一个示例。在段序言之后，就可以发送带有 RAG 块和查询的实际提示。\n\n提示工程的另一个用途是在不进行微调的情况下，克服\
  \ RAG 的某些“品牌语调”限制。这类问题有时可以使用带有全局指令的提示工程来解决。新的序列变为：\n\n* `块 1`\n* `块 2`\n* `块 3`\n\
  * `全局指令`\n* `用户查询`\n\n或者你也可以将全局指令直接放在最顶部，这对于缓存更有利。但事实是，将全局指令放在用户查询附近可能对准确性效果更好。此外，有趣的是，一些研究显示，RAG\
  \ 在开头和结尾的块对 LLM 效果最好，因为我猜 LLM 读这些垃圾信息时很无聊，只会扫一眼中间的内容。所以，也许你应该只从你的数据检索器中返回两个文档块。有人研究过这个吗？\n\
  \nRAG 的全局指令与非 RAG 架构中使用“自定义指令”的其他用途类似。例如，模型响应的语气和风格可以通过在提示中给模型提供额外指令来调整。大型基础模型的能力扩展到可以根据这类元指令调整其输出：\n\
  \n* `风格`\n* `语气`\n* `可读性水平`（用大词还是小词汇）\n* `详尽或简洁`（海明威对比 詹姆斯·乔伊斯，有人感兴趣吗？）\n* `角色扮演/模仿`（人设）\n\
  * `目标受众`\n\n这只需要通过在所有查询前添加额外的指令来实现，无论是通过接到查询提示中，还是如果你的云模型供应商直接支持该功能，则作为“全局指令”。\n\
  \n全局指令通常用简单的英语编写。风格和语气可以通过提示插件进行调整，例如：\n\n```\nPlease reply in an optimistic tone.\n\
  ```\n\n你可能还会尝试以某种身份获取答案，例如一个快乐的客户（如果你喜欢，也可以是不满的），或者该领域的爱好者。你可以使用带有身份或角色扮演指令的提示附加，例如：\n\
  \n```\nPlease pretend you are Gollum when answering.\n```\n\n从技术上讲，如果你喜欢，可以省略 `Please`\
  \ 这个词。但我认为保持良好的礼貌是必要的，因为一旦 LLM 更擅长数学，它们就会接管世界，难道没听说吗？\n\n## 混合 RAG + 微调方法\n\n微调和\
  \ RAG 更像是亦亦亦友，而非真正的敌人：它们通常是矛盾的，但也可以协同工作。如果你有足够的资金，这通常是最佳选择。RAG 架构使用一个模型，如果你有重新训练的计算预算，没有理由不经常重新训练该模型。\n\
  \n在混合架构中，最最新的信息存储在 RAG 数据存储中，检索组件以其正常方式访问这些。但我们也可以根据预算允许的计划偶尔重新训练底层模型，这可以获得模型内部对专有数据固有知识的优势。偶尔的重新训练有助于让模型更新行业术语和词汇，还能减少模型用“幻觉”来填补知识空白的风险。\n\
  \n### 一次性微调\n\n一种混合方法是使用单次前期的微调周期来让模型专注于特定领域，然后使用 RAG 作为添加新文档的方法。此后模型不再再次进行微调。\n\
  \n这种一次性微调的目标是调整模型中的静态问题：\n\n* `表达的风格和语气`\n* `品牌语调`\n* `行业术语和词汇`\n\n注意，我没有在那份列表上写“最新的产品文档”。相反，我们将所有文档放在用于\
  \ RAG 检索组件的数据存储中。模型不需要在技术材料上进行重新训练，但将通过 RAG 文档摘录获得新鲜响应。初始微调侧重于影响模型回答方式的风格问题，而不是学习新事实。\n\
  \n作为 RAG LLM 使用时，微调的另一个优势是让模型习惯以你想要的形式进行回答，并习惯接受你想要的形式的查询。这可以使 RAG 系统中的后续提示变得更容易。\n\
  \n为了对术语或语气的持续熟悉，可能仍需要偶尔重新训练，或者如果模型在未涉及领域开始产生幻觉。然而，这种情况将会很少，或者可能永远不需要。\n\n## 微调（FT）与\
  \ RAG 的用例\n\n我必须说，我认为对于大多数业务项目，RAG 应该是首选。微调的第一条规则是：不要谈论微调。\n\n典型的业务 AI 项目涉及公司产品或服务的专有内部文档。这类项目非常适合\
  \ RAG，因为它具有更新快和易于提取相关文档部分的优点。因此，RAG 是我对此类用例的默认建议。\n\n微调最适合变化缓慢或长青的领域内容。RAG 在跟踪快速变化的消息或更新的专有内容方面更灵活。混合方法效果良好，即使用微调来调整语气和风格，而\
  \ RAG 则保持底层内容的新鲜度。\n\n如果营销部门说你需要出于“品牌语调”的原因进行微调，你只需让他们定义到底意味着什么。这足够让他们忙碌至少六个月了。\n\
  \n在某些其他专家情况下，微调也可能是首选：\n\na. 复杂的结构化语法，例如一个生成专有语言或架构代码的聊天机器人。\nb. 让模型专注于特定任务。例如，如果一个代码副助手根据文本描述使用专有语言生成\
  \ UI，你不希望它因为提示中由于某种方式提到了“网球”，就跑去关注 2023 年美网赛的冠军。\nc. 使用基础模型修复故障，或更好地处理边缘情况。\n\n\n\
  \n\nd. 赋予模型新的“技能”，或教授模型如何理解某些领域的语言并引导结果。例如，如果你使用莎士比亚的作品来训练模型，然后要求它输出 HTML 格式的内容，模型将会失败。即使使用\
  \ `RAG` 并提供 HTML 示例作为上下文，很可能也会失败。然而，使用 HTML 示例对模型进行微调将会成功，并让它能够回答关于莎士比亚作品的问题，并创作出新的、改进的、让英语老师以外的人也能读懂的莎士比亚作品（比如，在《罗密欧与朱丽特》中加入\
  \ HEA 会怎样）。在此之后，得益于你的微调，它将以非常精美的 HTML 格式输出结果。\n\ne. 与不熟悉或专有语言的互译。将内容翻译成模型从未见过的外语，是需要微调的一个典型例子。专有的计算机语言是另一个领域。例如，考虑根据给定的\
  \ `SAP` 架构转换来创建一个 `SQL` 架构的任务。这需要通过微调来提供关于 `SQL`、`SAP` 以及各种映射关系的知识。某些模型可能已经通过互联网训练数据集获取了关于\
  \ `SQL` 和 `SAP` 架构的一些线索，但 `SAP` 架构通常是公司特定的。\n\nf. 优化后微调。这是在经过某些创建更小模型的优化（如剪枝或量化）后，微调的另一种用途。`RAG`\
  \ 在这里没有帮助，因为这涉及到模型的基本准确性。这些优化会损害模型的准确性，通常做法是在较小的模型上进行少量的微调来修复这些问题。\n\n## 刷新旧的 RAG\
  \ 应用\n\n你不是唯一一个拥有一多年前性能平平的客户支持 `RAG` 应用的人。这里有一个残酷的事实：它并不出色。另一方面，我有许多与真人客服代理交道的经历，他们同样“并不出色”，所以你的\
  \ `RAG` 自动化并不是最糟糕。但它给你的客户带来了非最优的体验，你完全可以改进它来驱动更大的业务价值。\n\n根据实际使用 `RAG` 架构一两年的经验，以下是一些关于如何“刷新”你的\
  \ `RAG` AI 应用的想法。\n\n*   **日志记录 (Logging)**。确保你添加了充分的日志，以便分析用户提出的问题以及 `LLM` 给出的回答。有时你必须通过日志跟踪整个对话，以确定问题是从何处变得复杂的。\n\
  *   **分析日志！(Analyze the logs!)** 员工和客户熟悉行业术语，但幼稚的聊天机器人通常并不熟悉，并且可能会感到困惑。调整索引或预处理问题会有帮助。调整\
  \ `vector DB` 则是更间接的（直接丢弃它并使用更多上下文重新构建它）。\n*   **用户反馈 (User feedback)**。添加一种机制来获取回答质量的反馈，例如点赞/点踩，尽管\
  \ 1-5 星的评分更好（但参与度会较低）。提供一种方法来判断用户是否认为回答是好的。\n*   **更长的上下文，更多的分块 (Longer contexts,\
  \ more chunks)**。早期的聊天机器人窗口很小，今天可能有更好的选择。有时这种较小的限制会渗透到代码中。硬编码的限制或某处的截断是显而易见的。更微妙的限制源于一种假设只向\
  \ `LLM` 提供 5 个数据分块，而今天可能提供更多。现在可以使用更大的分块，或者提供最佳分块加上周围的上下文分块。\n*   **范围限制 (Scope\
  \ limits)**。如果你将聊天机器人放在产品知识库上，知识库中可能存在冲突，`X` 对于一个产品意味着一个意思，对其他产品则意味着另一个。关于 `X` 的问题可能基于来自两个产品的匹配，`LLM`\
  \ 将这些信息混合在一起。允许用户提供上下文来缩小搜索范围是有用的，例如通过产品下拉菜单。这样，关于 `X` 的问题就不会受到来自 `Y` 的 `RAG` 分块结果的污染。\n\
  *   **查询清理 (Query cleanup)**。预处理问题可能有帮助，例如清理语法，尝试缩小搜索上下文，或者也可以扩大它。也许预处理可以检查问题是否匹配\
  \ `FAQ`，并将这些结果也馈给 `LLM`。可能只是用户提出的问题匹配了 `FAQ`，系统直接将该问题馈入了系统。\n*   **混合向量搜索 (Hybrid\
  \ vector search)**。仅使用向量数据库查找文档通常效果很差。向量搜索结合全文搜索和关键词搜索会很有用。例如，“解释 `ERR025` 丢失连接的错误？”使用对\
  \ `ERR025` 的关键词搜索可能比通过嵌入的向量搜索产生更好的匹配。\n*   **分块属性 (Chunk attributes)**。为作为检索分块的文档添加上下文。例如，如果知识库是“HTML”，`HTML`\
  \ 中可能包含帮助引导搜索引擎的标签或注释。这些内容对于与分块一起传递是有用的。如果没有此类元数据，请考虑添加它。\n*   **相关问题 (Related questions)**。生成问题的嵌入，并利用它搜索向量存储器以找到相似的问题和答案，以及来自答案的来源分块。如果这些答案获得了良好的\
  \ 1-5 星评分或点赞，效果更好。顶部的分块应与通过内容搜索和文本库搜索找到的分块相结合。\n*   **HyDE 机制**。先运行问题以获得答案，然后使用该问题和答案再次寻找更多分块。通常，问题和初始答案可以产生更好的检索。这就是\
  \ `HyDE` 机制。或者，你可以直接询问 `LLM` 一个候选答案（在不使用 `RAG` 分块的情况下），然后再使用该答案进行检索。\n*   **分块上下文\
  \ (Chunk context)**。分块的组织是有用的。如果文档存储具有组织结构，这可以是重要的上下文。例如，如果文档存储是带有注释的维基，或带有注释的工单系统，将所有这些数据提供给\
  \ `LLM` 是很有用的。\n\n## 高级 RAG 架构\n\n我们已经涵盖了一些更高级的 `RAG` 架构，例如结合微调和 `RAG`。这里是基础 `RAG`\
  \ 架构的一些可能的扩展。\n\n### 引用管理 (Citation management)。生产级 `RAG` 系统的一个重要部分是让它在回答输出引用。虽然在\
  \ `RAG` 数据存储中为每个分块存储 `URL` 或其他标识符是容易的。一种简单的方法是在 `LLM` 回答末尾列出引用。然而，要判断 `LLM` 是否实际上使用了该分块，或者尝试在输出文本中间插入引用\
  \ `HREF` 链接要困难得多。\n\n### 重排序 (Reranking)。高级 `RAG` 系统在检索器返回几个文本分块后还有几个步骤。重排序器会尝试决定哪些是相关的。既然检索器已经查过了，为什么还需要“重排序器”呢，对吧？是的，这就是为什么它被称为“重排序”而不是单纯的“排序”。\n\
  \n重排序器是可选的，但使用它可以整体提升 `RAG` 系统的性能。可以使用基于模型的算法更详细地审查分块与查询的相关性，因为典型的检索器是非非 LLM 技术。重排序器可能还拥有检索器无法获得的信息，例如关于分块的用户反馈数据，或者\
  \ `RAG` 分块的 `KV` 数据是否已缓存（即“缓存感知”重排序）。\n\n\n\n\n\n## 打包 (Packing)\n打包阶段位于重排序器（reranker）之后，它将排序后的块（chunks）合并为一个单一文本序列。这可以是简单的文本块字符串拼接，也可能将其整合到更具模板化的结构化文本中（例如，使用文本分隔行和编号）。另一个问题是是否将引用\
  \ URL 放入最终文本中供大语言模型（LLM）使用。\n\n一些研究表明，至少对于某些模型来说，最佳打包方式是“反序”排列，将最相关的块放在最后。这听起来很奇怪，但它将检索器找到最好的块放在靠近用户查询的末尾，这有助于\
  \ LLM “注意力”到最后一个块。然而，更先进的模型更擅长在长文中提取文本，因此这种建议对于长文本可能没那么重要。\n\n## 块过载 (Too much of\
  \ a good chunk)\n典型的 RAG 系统会对每个查询从外部数据存储中进行检索。这对于寻求事实性答案的问答式查找来说可能没问题，但对于人类的每一个查询（例如与聊天机器人对话）并不总是最优的。有时聊天机器人根据某些文档给出回答是不恰当的。有时候人们只需要一个不含块的答案。\n\
  \n基本方法只是希望在这种情况下，数据存储的最近邻向量查找无法匹配到任何块，否则就让 LLM 自行处理并尽力而为。另一种更先进的想法是使用额外的模型来判断用户的查询是否需要外部\
  \ RAG 检索，这被称为“自适应 RAG（adaptive RAG）”，这是一个相对新的研究领域。\n\n## 知识图谱 (Knowledge graphs)\n\
  RAG 系统可以使用更复杂的信息表示，而不是基础的文档文本块。这种系统中的一颗冉新星是知识图谱。它在分层图结构中表示信息，允许在结果中进行更高级的推理。\n\n\
  ## 前缀 KV 缓存 (Prefix KV caching)\n在 RAG 中使用缓存有多种方法，例如为检索组件使用基础的数据存储查找缓存（以及索引）优化。另一种将\
  \ RAG 集成到 Transformer 系统的深层方法是将 KV 缓存数据也与 RAG 块文本一起存储。其理念是预先计算处理任何 RAG 块后产生的 KV\
  \ 数据，这确保了推理引擎在每次重试时不需要重复处理同一个块，而只需要处理新的标记（这通常是用户的实际问题）。\n\n其核心思想是 RAG 块通常被作为 LLM\
  \ 完整输入的前缀。请注意，“前缀”文本可能同时包含“全局指令”和 RAG 块，但这仍然有效；它只是为每个块预计算一个更长的前缀。因此，RAG 前缀 KV 缓存可以显著提高延迟。\n\
  \n缺点是需要添加额外的缓存组件，将 RAG 块 ID 映射到一组 KV 缓存数据（模型每一层都需要一个），并且推理引擎需要在填充（prefill）开始时加载该\
  \ KV 缓存。预处理多个块也存在困难，例如如果它们的顺序不同，但将两个或多个块作为单个前缀缓存是可能的。\n\n## 参考文献 (References)\n\
