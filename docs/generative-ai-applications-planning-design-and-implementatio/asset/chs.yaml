  \ A Survey, [https://arxiv.org/abs/2402.01763]\n\n## 第五部分：实现 (Part V: Implementation)\n\
  “Stitching Together Sequences of Linguistic Forms Without Any Reference To Meaning:\
  \ A Stochastic Parrot.” — Bender 等，2021.\n\n## 构建 (Building)\n我曾向自己保证这本书将是不含代码的。但现在我正准备写软件开发的内容。每当我开始输入赋值语句时，我都得抽一下自己的手腕。\n\
  \n从高层次来说，对于如何构建 AI 项目的问题，你只需要发布一份征求书（RFP）。然后你将收到 3793 份来自 AI 专家公司的回复，它们都承诺快速完成代码，通常来自地球上某个低税的小角落。\n\
  \n减少这种数量的一种方法是在 Google 中输入 `build an AI app`，并直接点击前 27 个广告，这些广告都出现在任何有用内容之前。或者，你可以向\
  \ ChatGPT 寻求建议，你会得到一些泛泛而谈的建议，这正是我可能要写的内容。\n\n\n\n\n如果此不行，你可以询问你的内部研发人员他们是否可以构建它。“是的，我们当然可以！”这将会是一个极其尖锐的回答。请准备好为编码副助手（copilots）和夏威夷外地培训申请预算做准备。\n\
  \n唯一的问题是，你是否应该相信他们的任何话。因为每个人对构建 AI 应用都感到困惑，我认为没有人真正知道如何很好地做到。\n\n唉，这也包括我我自己。我不自认为自己知道\
  \ AI 软件开发的唯一真理。噢，至少这会是一个简短的章节。\n\n## AI 应用开发\n\n构建 AI 应用有许多方法，很多公司也会乐意提供帮助。你的主要选择基本上有：\n\
  \n*   咨询公司\n*   超大规模云平台（Hyperscaler）\n*   特定的 LLM 平台\n*   特定的 LLM 组件\n*   上述所有领域的初创公司\n\
  \n早早的章节已经讨论了各种项目需求和设计问题，但这里提醒你一下你需要问自己的几个主要问题：\n\n*   商业化还是开源？\n*   云端托管还是本地部署？\n\
  *   交钥匙式（Turnkey）还是组件化架构？\n\n你想自己构建其中的多少？让我们来选择你的冒险之旅：\n\n1.  无无 — 买一个交钥匙应用并进行配置。\n\
  2.  全部 — 构建你的整个架构，包括 LLMs 和 Transformer 引擎。\n3.  介于之间 — 使用现有平台，但对其进行扩展。\n\n你可能已经猜到了我要推荐的什么：专注于业务特定的领域。不要从零开始重建一切，因为这困难得令人难以置信（而且昂贵）。但也不要把钱扔给别人让他们去构建一切。你只是在用你的钱让他们自己成为\
  \ AI 专家。正如我之前提到的，你的目标应该是建立自己在为业务对齐目的使用 AI 方面的核心竞争力。\n\n折中方案是仔细选择使用第三方“AI 基础设施”（无论商业还是开源），然后掌握“业务层”的控制权。因此，主要选择之一是你可以为你的业务构建多个\
  \ AI 应用的“平台”或“骨干”。\n\n## AI 应用平台\n\n有许多众目的 AI 平台提供了托管的 LLM 以及基于此构建的各种高级功能，包括超大规模云厂商和各种获得大量资金的\
  \ AI 公司。还有大约 65,000 家 AI 初创公司可供选择，从 AI 专用托管商到插件组件产品，等这本书写到第 37 版时，我已经完成对它们的评审了。让我们来看一些选项。\n\
  \n### AI 模型初创公司\n各种作为模型专家的 AI 公司现在提供了完整的平台，以便在其之上构建应用：\n\n*   OpenAI (ChatGPT)\n\
  *   Cohere\n*   Anthropic (Claude)\n*   Mistral\n*   Hugging Face\n*   H2O.ai\n\
  *   Together AI\n*   X AI (Grok)\n*   Fireworks AI\n\n### Meta 的 Llama\n有一家巨头公司处于独立地位：Meta。它是一家不是大规模云厂商的上市公司，但它通过大量的\
  \ LLM 研究工作不断前进，现在不仅拥有非常强大的 `Llama` 模型，还拥有了自己的用于构建的平台。然而，它拥抱了开源精神，因此拥有独特的产品。\n\n\
  ### 超大规模云厂商\n超大规模厂商和托管供应商现在提供 AI 能力：\n\n*   Azure\n*   AWS\n*   GCP\n\n### 云托管商\n\
  在“前三名”超大规模厂商之下，在 AI 之前的托管市场中还有许多其他老牌玩家，虽然市场份额较小，但能力依然强大：\n\n*   Oracle\n*   阿里巴巴\n\
  *   OVH\n\n### AI 专用托管商（GPU 托管）\n出现了许多初创公司，提供更廉价的 GPU AI 专用托管服务，例如：\n\n*   HuggingFace\n\
  *   Lambda Labs\n*   RunPod\n*   Vast AI\n*   Linode\n*   Ori.co\n*   Northern Data\n\
  *   Salad\n\n### 数据公司\n现在拥有 AI 能力的“数据仓库”或数据库公司：\n\n*   Oracle\n*   Databricks（收购了\
  \ MosaicML）\n*   Snowflake\n\n### 业务应用平台\n还有许多多年来提供业务应用开发平台的平台，它们现在配备了额外的 AI 能力。公司包括：\n\
  \n*   SalesForce\n*   ServiceNow\n*   IBM\n\nIBM 在 AI 领域深耕很久，甚至在 LLM 出现之前就是。Watson\
  \ 经常是 IBM AI 的面面，但他们长期以来从事“AI”中的机器学习（ML）方面。\n\n### AI 编排平台\n许多其他具有 AI 平台能力的科技公司：\n\
  \n*   OctoAI\n*   Datadog\n*   Datastax\n*   DataRobot\n*   Scale AI\n\n### AI 写作集成\n\
  如果你的需求局限于有限的 AI 用例领域，如写作或协作，该领域的各种公司提供了 API 和集成能力，与各种通用 AI 平台竞争。示例包括：\n\n*   Notion\n\
  *   Grammarly\n*   Jasper\n*   Writer.com\n\n### AI 图像模型\n图像生成或图像编辑领域有各种公司。通过以下公司可以实现各种集成和用途：\n\
  \n*   Adobe (Firefly)\n*   Dall-E-2 (OpenAI)\n*   Stable Diffusion\n*   Runway\n\
  *   Midjourney\n*   Canva\n*   Crayon\n\n### 开源生成式 AI\n一些著名的开源平台包括：\n\n*   PyTorch\n\
  *   TensorFlow\n*   LangChain\n*   LlamaIndex\n*   vLLM\n*   Keras\n*   Ollama\n\
  \n## 厂商锁定与开源\n所有商业选项最大的问题是以后很难更换。随着你使用 AI 的增加，挑战也会增加。主要的选择是各种开源平台，但它们尚未达到商业方案的成熟度。\n\
