  \n\n\n\n噢，等一下！我们已经写了一整本关于 AI 加速的书，标题为为`Generative AI in C++: Coding Transformers\
  \ and LLMs`。书中完全介绍了如何编写 Transformer 内部实现，以及用于这些组件的多种类型的内核优化（例如：`KV caching`、`kernel\
  \ fusion`、`memory efficiency` 等）。但那本书是 2024 年 3 月编写的，而研究论文中已经出现了大约五种新类型的 `KV caching`，因此有部分内容需要更新。我会尽量简明扼要。\n\
  \n# 智能性研究\n\nAI 研究人员的总体目标是，你懂的，人工智能。既然我们已经很好地解决了“人工”部分，所以有大量关于“智能”的研究，我称之为“智能性（smartness）”研究，为了契合我对头韵的趣味。智能性研究有许多子领域，例如：\n\
  \n*   通用人工智能 (AGI)\n*   人工超级智能 (ASI)\n*   用例\n*   提示工程 (Prompt engineering)\n* \
  \  推理\n*   数学\n\n上述研究主要是关于构建超级智能的 AI 模型，无论消耗多少电子代价，而减少这些开销交给了其他 AI 研究人员。AI 领域一些更热门的领域包括：\n\
  \n*   万亿参数模型\n*   混合专家模型 (MoE)\n*   多模态模型\n*   思维链 (Chain-of-Thought)\n*   小型语言模型\
  \ (SLM)\n*   智能体架构 (agentic architectures)\n\n许多智能体架构的研究是交叉出现在这些论文中的，但我们尚未接近 AGI。\n\
  \n## 多步推理\n\n目前最热门的领域是利用多个步骤来提升推理。自从 OpenAI 发布 `o1` 模型以来，`strawberry` 推理引起了巨大关注，这在\
  \ LLM 中的应用是惊人的。\n\n在此之前，让 LLM 变得更聪明的主要是通过更多的参数和数据，这基于 `scaling laws`（扩展法则）。\n\n\
  利用多个步骤来提升推理的方法显然受到了许多注意力，`strawberry` 的子领域包括：\n\n*   思维链 (CoT)\n*   自我反思 (Self-reflection)\n\
  *   LLM 作为评判 (LLM as Judge)\n*   树思维 (ToT)\n*   N 选法 (BoN)\n*   骨架思维 (SoT)\n*  \
  \ 图思维 (GoT)\n\n这些想法与提示工程之间有很多交叉。在每个步骤中，这种推理的选项是组合爆炸的。\n\n另一方面，苹果发布的一些研究对 LLM 是否真的在进行推理表示怀疑，其结果大多源于记忆和模式匹配。\n\
  \n我个人认为，这是一个人类必须通过编码来变得更聪明的例子，但计算机的解决方案通常是简单的暴力计算。时间会证明谁是对的！\n\n# 推理参考文献\n\n以下是一些相关的研究论文，完整列表请访问\
  \ [`www.aussie.com/reasoning`](https://www.aussie.com/reasoning)。\n\n1.  Jason Wei\
