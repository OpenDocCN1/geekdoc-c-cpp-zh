  \ Katarina, Slama, Peter, Alex, 2022\n\n## 设计\n\n## 需求\n\n### 需求是\n\n为了是：\n\n*\n\
  \n.\n\n实施你的设计将涉及：\n* 用用例\n* 现有数据\n* 基础模型选择\n* 现有硬件\n* 微调\n* 检索增强生成 (RAG)\n\n不仅仅关乎\
  \ AI，通用需求也适用于：\n* 用户界面\n* 后端部署\n* 开发流程\n* 安全考量\n* 需求和到：\n* 用户需求\n* 恢复需求\n* 法律需求\n\
  * 法律需求\n* 互联网监管合规\n\n除了技术之外，还有更广泛的法律和监管要求需要考虑，例如：\n* 负责任的 AI (**)\n* 监管合规\n* 版权法\n\
  * 隐私所有权\n* 知识产权所有权（例如，生成的文本、代码或其他制品）\n\n## 10 项真正的重大优化\n\n总成本是你项目面临的巨大限制之一。这里是一些节省资金的方法：\n\
  \n1. 购买现成的商业 AI 解决方案作为替代。\n2. 封装商业模型而不是训练你自己的（例如 OpenAI API）。\n3. 测试多个基础模型 API 供应商并比较价格。\n\
  4. 使用开源预训练模型和引擎（例如 Meta 的 Llama）。\n5. 通过检索增强生成 (RAG) 完全避免微调。\n6. 在设计模型时选择较小的模型维度。\n\
  7. 选择压缩的开源预训练量化模型（例如量化版 Llama）。\n8. 为运行你的比较 GPU 托管方案。\n9. 使用更便宜的商业 API 供应商进行早期开发和测试。\n\
  10. 使用较小的开源模型进行早期开发和测试。\n\n如果十项成本削减对你来说还不够，担心，我还有更多！书中讨论了许多提高推理效率的方法。当你让 LLM 在 GPU\
  \ 上运行得更高效时，速度更快意味着成本更低。随着整个领域的快速变化，定期重新评估上述第 10 项是有用的。\n\n## 构建还是购买\n\n在我们深入研究如何在大型项目中构建你自己的\
  \ AI 机制之前，值得考虑各种现有的产品和工具。你可能根本不需要开发项目，而只需要一个将新的第三方商业产品集成到公司基础设施中的 DevOps 项目。\n\n\
  例如，如果你的项目目标是提高写作人员在创建各种文档草稿或营销文案方面的效率，这里有一个来自 OpenAI 的 ChatGPT 产品。\n\n\n\n\n实际上，还有许多其他利用\
  \ AI 能力的写作生产力工具，其中一些底层使用 `ChatGPT`，另一些则是独立的。同样，已经有了许多“AI 编码副驾驶”类型的产品，它们可能会让你的程序员变得比现在更加令人惊叹、难以置信，且具有极高的\
  \ RSU 价值。在整个创意活动领域，还有许多可以创建图像、动画、3D 模型和视频的 AI 产品。\n\n更通俗地说，几乎你所想象到的每种用例都开始出现 AI\
  \ 产品，并且涵盖了所有主要的行业垂直领域（例如医学、法律、金融等），因此，花一点时间研究一下目前有哪些可用工具可能满足你的需求。我不愿意提供列表，因为它们每天都在变化。无论如何，评测它们不是我的工作；那是你的工作！\n\
  \n总的来说，用 AI 技术构建任何东西都是趣的，但使用已经构建好的东西会更快。而且这些新的 AI 工具实际上如此惊人，测试它们也很有趣。\n\n# 基础模型选择\n\
  \n你打算使用什么模型作为基础模型？实际上有三个主要选项：\n\n*商业商业模型\n*   开源模型\n*   自建模型 (BYO)\n\n当然，还有第四种选择，不使用\
  \ AI，正如 AI 行业的任何人都会你的你的样，这会导致分析师回避你的股票、立即破产，以及你的脚指甲起火。\n\n对于想要在自己的数据集上训练的中小型模型，构建自己的模型是一个可行的选项。然而，考虑到所需的专业知识和训练费用，只有主要的科技公司成功训练了巨大的\
  \ `LLM` 基础模型。\n\n另一种选择是选择一个在大量通用数据上进行预训练的现有基础模型。然后你可以根据你想使用的任何专有数据对该模型进行微调。\n\n\
  如果你没有特定的额外数据进行微调，那么你基本上在使用底层的商业或开源模型。你仍然可以在不需要微调的情况下，通过 `prompt engineering`（提示工程）、`检索增强生成\
  \ (RAG)` 以及将启发式方法与 AI 推理结果混合的简单想法，对现有模型实现重大的自定义。\n\n# 开源模型\n\n当 `ChatGPT` 在 2023\
  \ 年 2 月左右进入公众视野时，已经有很多开源模型了。然而，它们大多是较小的模型，能力远不及后者。尽管如此，你仍然可以免费从从中获得很多价值。\n\n当 Meta\
  \ 将其 `Llama` 模型发布到开源世界时，开源模型获得了一个巨大的飞跃。它仅获得非商业和研究目的许可，但它立即在开源社区中以多种方式被使用。该模型还用于各种方式创建其他模型，这些模型在理论上至少消除了原始\
  \ `Llama` 许可的非商业限制。那个法律问题从未被测试过，并在 `Llama` 版本 2 出版后不久就变得不再重要。\n\nMeta 在 2023 年 7\
  \ 月开源了其 `Llama2` 模型，同时适用于商业和非商业用途。该许可是非标准的，但对于大多数用户（如果不是大公司）来说，它在很大程度上没有限制。你应该自己审查\
  \ `Llama2` 许可的细节，以及未来任何 Meta 模型的发布版本，但它已经在开源社区中被广泛使用。\n\n# 商业用途开源模型\n\n尽管 `Llama2`\
  \ 可能位列首位，但还有其他几个以宽松许可开源的主要模型。再次，你应该自己检查这些许可细节，因为即使是宽松的许可也会施加某种程度的限制或义务。以下是我认为可以用于商业用途的一些较好模型的列表：\n\
  \n*   来自 Meta (Facebook Research) 的 `Llama2`，采用名为 `Llama 2 Community License Agreement`\
  \ 的特定许可。\n*   `Mistral 7B` 和 `Mistral 8x7B`（均采用 `Apache 2.0` 许可）。\n*   来自 MosaicML\
  \ (DataBricks) 的 `MPT-7B`，采用 `Apache 2.0` 。\n*   来自技术创新研究院 (TII) 的 `Falcon 7B/40B`（`Apache\
  \ 2.0` 许可）。\n*   来自 LMSYS 的 `FastChat T5`（`Apache 2.0` 许可）。\n*   `Cerebras GPT AI\
  \ Model`（`Apache 2.0` 许可）。\n*   `GPT4All` 模型（多种）；某些采用 `MIT License`。\n*   `H2O GPT\
  \ AI model`（`Apache 2.0` 许可）。\n*   `Orca Mini 13B`（`MIT License`）。\n*   `Zephyr\
  \ 7B Alpha`（`MIT License`）。\n\n我确定当你读这里时，这个列表已经过时了。新模型定期发布，而且还有从其他模型生成的各种新模型，例如量化版本和其他重新训练的衍生模型。\n\
  \n# 模型大小\n\n选择模型大小是项目的重要部分。首先，模型的大小在 GPU 资源消耗方面与训练和推理的成本直接相关。针对这一特定用例对所需的模型类型做出明智选择，可以对\
  \ AI 项目的初始和持续成本产生巨大影响。\n\n毫无疑问，更大的模型是有吸引力的。通用规则似乎是模型越大能力越强，而对于如今的顶级 AI 模型来说，数十亿参数的模型似乎是入场标准。顶尖的商业模型已开始超过万亿参数。\n\
  \n然而，一些研究开始对对此表示怀疑，至少在不断变的模型并不总是导致智能的提升上。例如，`GPT-4` 据传是混合专家模型 (MoE) 架构，规模为 220B，而不是单一的\
  \ 1.76T 模型。\n\n质量很重要，而不只是数量。用于训练的数据集质量以及各种技术的质量很重要。智能不应该是令人惊讶。事实上，数量在提升 AI 能力方面非常成功。\n\
  \n模型优化。如何让模型更聪明、更快、更便宜？首先，开源模型改进得很快，并将继续如此。有些模型开始提供非常快的性能。模型经过了压缩（例如 `量化`、`剪枝`），并且开源引擎提供了各种\
  \ AI 优化功能（例如 `Flash Attention`）。你可以下载模型和引擎源码，并自己运行开源模型（诚然，需要租赁自己的 GPU 或使用商业 GPU\
  \ 服务）。\n\n对于商业 API，你无法更改他们的引擎。但是你可以减少发送到商业 API 的查询数量，可以在调用前端放置缓存。这降低了成本并加快了常用提示（或类似提示词）的响应，代价是未缓存查询会因为额外的缓存失败查找而变慢。推理缓存是相同查询响应的缓存，而语义缓存通过向量数据库查找寻找“足够匹配”的项。\n\
  \n# 延迟与响应时间\n\n整个系统的性能需求是设计的重要部分。对于简单的文本生成响应，例如聊天机器人或问答，评估其速度有两个主要因素：\n\n*   初始响应时间（预填充阶段或编码模式）\n\
  *   每秒 Token 数（解码模式）\n\n响应时间（延迟）。AI 引擎输出第一个字之前的初始时间延迟被称为“延迟”或“响应时间”。它也被称为“首次 Token\
  \ 时间”（在论文中缩写为 `TTFT`）或“预填充时间”。这里有两个导致高延迟的因素：\n\n*   云端往返时间（网络）\n*   预填充或编码时间（引擎）\n\
  \n\n\n\n对于手机上的云端 AI 引擎而言，大语言模型（LLM）并不在手机上，提示问题必须通过网络发送到云端引擎。因此，消息发送到云端并返回答案需要时间（即消息的“往返”网络传输）。\n\
  \n对于手机上的设备端原生 LLM 执行，则不需要网络，因为引擎运行在手机内部。因此，原生执行的响应时间仅取决于引擎速度以及预填充阶段（prefill phase）。\n\
  \n### 预填充阶段 (Prefill phase)\n云端版本和设备端版本都必须在引擎上运行查询。AI 引擎在开始回复之前通常会有显著的延迟。例如，2 秒的响应时间并不少见。云端\
  \ AI 引擎运行速度可能更快，因为它们可以在某个大湖附近数据中心的大型机箱上运行强大的 GPU。运行在手机上的本地 AI 引擎没有大 GPU，或者可能根本没有，因此它们运行得较慢。\n\
  \n### 为什么 Transformer 的初始响应很慢？\nTransformer 的工作方式是在仅解码器引擎（例如 `GPT`）中执行一个称为“预填充”（prefill）的初始阶段，或者在旧式的编码器-解码器引擎中执行“编码”（encoding）。此阶段计算大量关于输入提示词（prompt）的数据，但不产生任何输出标记（tokens）。因此，它也被称为“提示词处理”阶段。\n\
  \n预填充阶段的长度取决于输入提示词的大小。输入中需要处理的 token 越多，初始响应时间就越慢。\n\n输入 token 不仅包含用户的问题，还包括随查询一起发送到\
  \ AI 引擎的“上下文”，例如聊天机器人中的对话历史，或者问答 RAG 架构中从数据存储器提取的文档“块”（chunks）。这些额外的上下文 token 可能比简单的查询提示词长得多。\n\
  \n因此，这段预填充或编码时间是 AI 引擎回答之前初始延迟的一部分。对于设备端手机 LLM，这是主要的延迟（因为没有网络延迟）。但一旦 LLM 开始说话，它在“解码阶段”（decoding\
  \ phase）运行得更快。\n\n### 解码速度 (Decoding speed)\nAI 引擎回答的第二个阶段是它开始逐输出回复，一次一个 token（即一次一个单词）。这种运行的快慢被称为“解码速度”，通常以每秒\
  \ token 数（tokens-per-second）衡量。有了大 GPU，引擎仍然相当慢，可能每秒运行几十个 token。据报道，`GPT 3.5` 的最高速度可达每秒约\
  \ 100 个 token。注意 token 并不总是完整的单词，因此每秒单词数会比此略低（例如，可能是此值的 75%）。\n\n在手机上速度更慢，因为引擎的硬件支持较少。目前最先进的（SOTA）水平类似于每秒个位数，即每秒仅输出几个单词。\n\
  \n注意，在解码模式下，后续 token 输出之间没有巨大的延迟。只有第一个 token 之前的初始延迟。输出答案中每个新 token 的时间对于每个 token\
  \ 都是相同的，因为它基本上为每个输出 token 重新运行了相同的解码器计算。\n\n### 需要多快？\nAI 引擎在手机上运行需要多快？这取决于你的 AI\
  \ 是在为你写写小说，还是在帮助你刷 TikTok Feed 流。\n\n考虑生成文本、语音、图像或视频时不同的速度需求。此外，它需要以何种方式进行交互，还是用户只是在被动地阅读或观看？也许它还在控制\
  \ UI 面的某些手机功能。\n\n但让我们以基础 LLM 文本生成为例。这意味着使用场景如聊天机器人、问答服务或书面文档草拟。\n\n思考这个问题的方法是从速度的两个主要方面来考虑人性的：\n\
  *   响应时间\n*   解码输出 token 生成。\n\n首先，人类是不耐烦的。我们习惯于从网站和电脑获得非常敏捷的响应。这意味着像 200ms 的初始响应时间是理想的。\n\
  \n解码阶段的消息则较好。人类阅读速度并不快。平均阅读速度约为每分钟 240 个单词，这仅为每秒 4 个单词。\n\n因此，设备端 AI 响应能力的最大问题可能是可能是到第一个单词开始出现之前的初始预填充时间延迟。\n\
  \n在手机上运行较小模型（例如 `1B` 或 `2B`）的最优水平（SOTA）尚未实现。论文讨论的初始响应时间是秒而不是毫秒，因此预填充阶段存在问题。解码率较好，在第一个\
  \ token 之后可以达到高个位数的每秒 token 数。因此，初始延迟是个问题，但随后的解码速度并不令人担心。\n\n### 增量输出 (Incremental\
  \ Output)\n这里对解码速度的假设是，引擎在完成完整输出之前就开始发射部分答案。我们不希望在为用户输出单词之前等待整个 AI 引擎的推理阶段。换句话之，AI\
  \ 结果的增量或“流式”输出至关重要。\n\n#### 语音输出\n作为语音输出增量地创建要说的单词似乎比阅读文本稍微复杂。如果引擎的解码输出速度跟不上正常的语速，那么基于语音的\
  \ AI 助手听起来就会断断续续。但这实际上并不是问题，因为人们阅读得比说话快。人类的平均速度约为每分钟 240 个单词（每秒 4 个单词），而语音约为每分钟\
  \ 130 个单词（每秒 2 个单词）。\n\n### 准确性要求\n许多关于 LLM 的决策涉及到权衡：\n*   准确性与成本\n*   准确性与速度\n\n\
  准确性与成本体现在商业 LLM API 的选择上。准确性方面的领先者是 OpenAI 的 `GPT-4o`，它也拥有最高的 token 成本。如果你坚持使用 OpenAI，可以降级到\
  \ `GPT 3.5`，它的能力较低，但成本更低。\n\n### 智能性与速度\n当你使用开源模型时，准确性与速度是一个更多的考虑因素，因为你无法控制 OpenAI\
  \ 的速度。例如，你可能需要在 `Llama` 或 `Mistral` 模型的两个版本之间选择：\n*   全精度 32 位浮点模型 (`FP32`，未量化）\n\
  *   量化 4 位整数模型 (`INT4` 量化）\n\n`FP32` 模型使用全尺寸数据，准确但运行速度慢。`INT8` 版本使用 8 位整数（即 256\
  \ 个可能值），速度更快但准确性较低。注意，`INT8` 模型惊奇地准确，尽管它们的大小只有 32 位模型的四分之一。此外，许多人正在使用 4 位模型，它们的大小只有后八分之一，但仍然相当准确。较小的模型运行快得多，对于许多用例来说已经足够。\n\
  \n### 设备端与云端\nAI 设备端执行也存在相同的速度-智能性权衡。例如，Apple Intelligence 允许某些查询在设备本身运行，这使用一个 `3B`\
  \ 模型。或者，查询可以发送到云端，使用更大更准确且功能的模型，但它运行得更慢。\n\n### 用例\n你需要多准确？这取决于你应用程序的用例以及它是否是业务关键的。某些不需要高准确性的用例包括：\n\
  *   创意写作\n*   图像生成（用于复制）\n\n\n\n\n从理论上来说，一个响应客户的应用程序对准确性的要求似乎比对内部员工的应用程序更高。但事实如此吗？显然，你不应该低估员工获取准确信息的重要性。\n\
  \n当 `LLM` 执行“更大”的任务时，准确性与速度之间的权衡就没那么重要了。例如，考虑根据职位细节和简历为工作申请写封求职信，或者回答一个高中历史问题。虽然预填充（prefill）和后续解码可能需要一些时间来生成整个结果，但通常结果比用户自己完成的要“更好”，且交付“更快”。这种“速度”往往完全没有被察觉，而准确性要重要得多。\n\
  \n我猜上下文有一点影响，因为在交互式任务中，这种说法并不成立。例如，如果 `LLM` 正在自动完成正在编写短信的后续部分，或者是程序员 `IDE` 中的某些代码，那么速度就至关重要。也许我们发现了一种新的\
  \ AI 缩放法则：`LLM` 提供的奖励越小，它需要的速度就越快。奖励越大，对速度就越不敏感。\n\n考虑准确性要求的另一个因素是 `LLM` 的输出是否会由人类审核。直接发布到网络上的输出对准确性的要求需要比人类修改和筛选的内容更高。另一方面，不要假设人类擅擅长审阅海量文本，因为他们往往倾向于在不仔细阅读的情况下直接点击“批准”按钮。也许你应该用\
  \ `LLM` 来做那项工作？\n\n## 参考文献\n\n1. Morgan Cheatham, Steve Kraus, 2023 年 12 月 4 日，*AI\
  \ 优先公司的六大核心任务*，[`www.bvp.com/atlas/six-imperatives-for-ai-first-companies`](https://www.bvp.com/atlas/six-imperatives-for-ai-first-companies)\n\
  2. Matt Asay, 2024 年 9 月 23 日，*AI 需要过多的组装*，[`www.infoworld.com/article/3536292/too-much-assembly-required-for-ai.html`](https://www.infoworld.com/article/3536292/too-much-assembly-required-for-ai.html)\n\
  3. Stan Gibson, 2024 年 6 月 3 日，*为生成式 AI 构建正确的基础设施*，CIO, [`www.cio.com/article/2128440/getting-infrastructure-right-for-generative-ai.html`](https://www.cio.com/article/2128440/getting-infrastructure-right-for-generative-ai.html)\n\
  4. MongoDB, 2024 年 6 月 20 日，*理解生成式 AI 时代的 AI 栈：探索今日 AI 应用的层与组件*，[`medium.com/mongodb/understanding-the-ai-stack-in-the-era-of-generative-ai-f1fcd66e1393`](https://medium.com/mongodb/understanding-the-ai-stack-in-the-era-of-generative-ai-f1fcd66e1393)\n\
  5. Akash Bajwa and Chia Jeng Yang, 2024 年 5 月 27 日，*RAG 栈：引入知识图谱：减少幻觉以通过复杂的 RAG\
  \ 使 LLM 生产级*，[`akashbajwa.substack.com/p/the-rag-stack-featuring-knowledge`](https://akashbajwa.substack.com/p/the-rag-stack-featuring-knowledge)\n\
  6. Artem Shelamanov, 2024 年 6 月 30 日。*2024 年生产就绪 LLM 应用的技术栈*，[`python.plainenglish.io/tech-stack-for-production-ready-llm-applications-in-2024-5eb14105d1b4`](https://python.plainenglish.io/tech-stack-for-production-ready-llm-applications-in-2024-5eb14105d1b4)\n\
  7. Abhimanyu Bambhaniya, Ritik Raj, Geonhwa Jeong, Souvik Kundu, Sudarshan Srinivasan,\
  \ Midhilesh Elavazhagan, Madhu Kumar, Tushar Krishna, 2024 年 6 月 3 日，*解密多种 LLM 推理用例的平台需求*，[`arxiv.org/abs/2406.01698`](https://arxiv.org/abs/2406.01698)\
  \ 代码：[`github.com/abhibambhaniya/GenZ-LLM-Analyzer`](https://github.com/abhibambhaniya/GenZ-LLM-Analyzer)\n\
  8. Dylan Patel and Daniel Nishball, 2024 年 10 月 3 日，*AI 新云游戏规则与解剖析*，[`www.semianalysis.com/p/ai-neocloud-playbook-and-anatomy`](https://www.semianalysis.com/p/ai-neocloud-playbook-and-anatomy)\n\
  9. Ryan Lucchese, Niki Birkner, Yaron Hagai, Virginia Adams, 2024 年 8 月 13 日，*训练生成式\
  \ AI 模型测试和运行大型 GPU 集群实践实践指南*，Together AI, [`www.together.ai/blog/a-practitioners-guide-to-testing-and-running-large-gpu-clusters-for-training-generative-ai-models`](https://www.together.ai/blog/a-practitioners-guide-to-testing-and-running-large-gpu-clusters-for-training-generative-ai-models)\n\
  \n## 12 架构\n\n#### 容易的架构\n\n这里有一些关于构建 AI 方法的观点：\n\n* 从云供应商处租用 GPU 比从 `NVIDIA` 购买容易。\n\
  * 基于云的 AI 比手机或 AI PC 的推理容易。\n* 使用文档数据库的 `RAG` 架构比使用 `LoRA` 进行微调容易。\n* 具有检索能力的智能体架构比封装\
  \ `ChatGPT` 容易。\n\n更具体一点，这里是 AI 复杂性的近似排序，从易到难：\n\n* 封装架构（无状态）\n* 封装架构（有状态）\n* `RAG`\
  \ 架构（无状态）\n* `RAG` 架构（有状态）\n* 智能体架构（无状态）\n* 智能体架构（有状态）\n* 使用 `LoRA` 的微调\n* `multi-LoRA`\
  \ 的微调\n* 全参数微调\n* AI 平台（基于商业或开源）\n* 基础模型（从零开始）\n\n我不确定将“设备侧”放在该列表的什么位置。现在还太早，无法判断\
  \ Google Android 和 Apple Intelligence 的 `SDKs`。\n\n#### AI 架构组件\n\n完整的 AI 架构的许多组件与其他任何在线应用程序相似。然而，还有一些\
  \ AI 特有的组件，其中基础组件是：\n\n* `LLM`\n* 后端推理引擎\n\n每个 AI 应用还需要客户端方面的工作：\n\n* 提示词工程模块\n\
  * UX 组件\n\n如果是 `RAG` 架构，还有一些额外的组件：\n\n* 数据存储\n* 嵌入模块\n* 检索器（关键词/向量查找）\n* 向量数据库\n\
  * 查询合并组件\n* 引用管理器\n\n生成式 AI 部署中需要考虑的一些较不明显的额外组件包括：\n\n* 可观测性监控（插桩）\n* 对话状态管理器\n\
  * 缓存模块（例如，大约有十种！）\n* 提示词防护\n* 安全监控\n* `LoRA` 适配器（或 `multi-LoRA`）\n* 工具集成（函数调用）\n\
  \n#### 软件架构\n\n如果你正在为你的 AI 项目构建很大一部分的软件架构，那么没有什么对程序运行速度的影响比架构更重要了。我的意思是，看看 AI。整个架构都是一个巨大的失败，不断充斥着过多的权重，并使用了暴力算法。遗憾的是，这是我们迄为止所想出的最好方法，但关于这些架构问题有很多研究可能会解决它。\n\
  \n\n\n无论如何，正如任何专业程序员都会告诉你的那样，为你的 AI 项目选择更好的架构并不困难。幸运的是，世界上最好的软件架构是众所知的，显然就是这一个：\n\
  \n*   面向对象的对象 (OOO)\n*   客户端-服务器\n*   服务器-客户端\n*   消息传递\n*   薄客户端\n*   游戏化\n*  \
  \ 带向量化的虚拟化\n*   模型-视图-控制器 (MVC)\n*   UI-应用程序-数据库 (三层架构)\n*   事件驱动架构 (EDA)\n*   `#include\
  \ “beer.h\"`\n*   云\n*   雾计算\n*   波斯尔法则\n*   RTFM（去读手册）\n*   微服务架构\n*   服务面向的架构\
  \ (SOA)\n*   RESTful API 架构\n*   智能自主代理 (IAA)\n*   意图病毒式\n*   被认为是有用的 Goto\n\n实际上，抱歉，那并不是世界上最好的架构；那只是一个致敬。\n\
  \n## AI 技术栈\n\nAI 项目的技术栈与非 AI 项目类似，但多了一些额外的组件。与许多其他类型的项目相比，底层硬件（即 GPU）的选择具有更高的重要性。技术栈看起来大致如下：\n\
  \n*   用户界面（客户端）\n*   Web 服务器（例如 Apache 或 Nginx）\n*   应用程序服务器\n*   负载均衡器（例如 HAProxy,\
  \ Nginx, Traefik）\n*   消息队列/事件流（例如 RabbitMQ 或 Apache Kafka）\n*   AI 请求管理器\n*   AI\
  \ 推理引擎（以及模型）\n*   操作系统（例如 Linux vs Windows）\n*   CPU 硬件（例如 Intel vs AMD）\n*   GPU\
  \ 硬件（例如 NVIDIA V100 vs A100）\n\n这些层级某些是可选的，或者可以合并到单个组件中。此外，如果你使用远程托管的 AI 引擎（无论是开源托管还是通过其\
  \ API 封装商业引擎），那么底层架构并不总是你的责任。\n\n### AI 引擎选择\n\n你将控制 AI 技术栈的多少部分？可能，至少对于你的第一个 AI\
  \ 项目，你是在按 Token（令牌）付费租用一个位于云端的商业模型。在这种情况下，你几乎没有任何控制权。\n\n或者，如果你在地下室的 Linux 服务器上运行自己的开源模型并配合开源推理引擎（例如\
  \ `vLLM` 或 `Llama.cpp`），那么你会有更多的问题……咳，我的意思是，更多的灵活性。由于对硬件和软件拥有完全控制权，做出允许组合系统实现最大优化的共生选择是有意义的。例如，如果你决定在特定版本的\
  \ GPU 上运行系统，那么你的 AI 引擎就可以假设该硬件加速是可用的，而不需要浪费资源来确保你的引擎软件可以在任何其他硬件平台上运行。然而，你可能需要定期检查你的\
  \ GPU 是否仍在运行 LLM 而不是在挖比特币。\n\n## 链与工具链\n\nAI 架构涉及许多组件，而不仅仅是 Transformer 引擎和一个模型。这些组件通常被称为“工具”，并通常具有以下特征：\n\
  \n*   接收输入（例如文本提示词）\n*   以某种方式进行处理\n*   产生输出（通常是文本，但并不总是如此）\n\n其思想是每个工具都是：\n\n*\
  \   模块化的\n*   特定的（单一任务）\n*   可重用的\n\n当我们把多个此类“工具”放在一个序列中，使得第二个工具使用第一个工具的输出作为其输入，这被称为“链”（chain）或“工具链”（toolchain）。这种术语在\
  \ LangChain 架构中被特别形式化。\n\n我们以前见过这种想法。如果你是一个 Linux 大极客，这也是一个工具链：\n\n```\ncat input.txt\
  \ | sort | uniq -c | sort -nR > output.txt\n```\n\n核心思想是每个工具执行一个特定任务，并且可以按顺序组合在一起。这确实是原始\
  \ Unix 系统的基础性架构思想。\n\n工具链唯一的主要问题是它们无法并行化。第二个工具必须等待来自第一个工具的输入，因此它们本质上是顺序执行的。顺序执行通常（但并非总是）这种架构模式的一种限制。它们可以并行的一种方法是：如果第二个工具只需要第一个工具的部分输出来完成工作，那么它们可以使用并行流式模型，这再次是\
  \ Unix 的原始方式。\n\n## 封装架构 (Wrap Architectures)\n\n封装架构是指你在别人的 LLM 外围创建一个“封装”。在这种情况下，你使用他人的\
  \ AI 即服务（AaaS）平台，并按 Token（或者可能按小时）付费。这种方法的优点是：\n\n*   无需服务器工作\n*   无需处理 LLM 工作\n\
  \n基本上，你的 AI 应用有一半已经为你构建好了。你的主要工作是：\n\n*   提示词工程 (Prompt engineering)\n*   UX 改进\n\
  \n主要的缺点是：\n\n*   带有大额每 Token 费用的烦人账单。\n*   你同时为“输入”和“输出”Token 付费。\n*   你还要为“嵌入”（基于向量的）付费。\n\
  *   你无法控制服务器端。\n*   隐私问题，即用户数据存储在哪里。\n\n对于某些“封装”架构，需要考虑谁为 LLM 付费。让用户付费来封装 LLM 是完全可能的，但要这样做，用户需要\
  \ `keys`。\n\n另一个考虑是，你是否允许用户自带他们的 AI？也就是说，与其封装 OpenAI 并向他们要 `keys`，他们可以自带 `Claude`、`Gemini`、`Mistral`、`Grok`、`HuggingFace`\
  \ 或更多。在这种情况下，你字面上是在封装一个你并不一定了解 AI。在某种程度上控制这一点可能很有用，但这可能会增加你的测试成本。\n\n如果你提供 API 凭据，你需要小心不要暴露它们。不要以任何方式将它们硬编码到用户的应用程序中。相反，你需要在用户和\
  \ API 端点之间添加自己的服务器。频繁更换 `key` 也是一种良好做法，因为市场上存在泄露的 AI 密钥。\n\n## 本地部署 LLM 架构\n\n本地部署\
  \ AI 架构是指你自己在自己的服务器上运行 LLM。与商业 API 封装架构相比，这是一个极好的架构，因为你不需要向你的 LLM 提供者支付那些讨厌的每 Token\
  \ 费用。相反，你做的是使用开源一切：\n\n*   Linux 服务器软件\n*   Apache 或 Nginx Web 服务器\n*   开源推理框架\n\
  *   开源 LLM\n\n而你只需要提供：\n\n*   服务器硬件\n*   GPU 芯片\n*   备件\n*   防火墙设备\n*   液冷\n*  \
  \ 架空地板\n*   系统管理员\n*   构建工程师\n*   Linux 专家\n*   开源 LLM 专家\n*   系统构建者\n*   网络工程师\n\
  \n### 客户端架构\n\n对于本地部署的 LLM，AI 应用的其余部分与第三方 LLM 供应商的“封装”架构非常相似，只是你封装的是自己的 LLM。你可以对任何客户端使用本地自封装架构：网页浏览器、App\
  \ 等。你在提示词工程和 UX 方面所做的所有工作实际上是一样的。\n\n\n\n\n\n但在本地部署大语言模型（LLMs）确实需要你完成一些额外的模块工作：\n\
  \n* 安全凭证管理（例如登录、密码、忘记密码等）\n* 使用你自己的数据对开源模型进行微调。\n* 监控与“可观测性”（LLMOps）。\n* 性能调优与扩展。\n\
  \n## 私有云 LLM 架构\n\n这种折中方案是拥有你自己的“私有云”，这完全不是什么自矛盾词！我甚至不这到底意味着什么，但我已经在很多精美的渲染文章中见过它了。它可能意味着：\n\
  \n* 运行你自己的硬件服务器，但在上面运行云服务器软件，或者\n* 租用云硬件，但在上面运行你自己的软件。\n\n第一种基本上和“本地部署”是一样的，不是吗？电脑在地下室里，如果你擅长这些东西，那么你运行的就是像\
  \ `Apache` 这样的“云软件”，或者如果你很追求潮流，也许可能是 `Nginx`，因此它就是一种“云”部署。如果你不擅长这些，那么就会有人从你的地下室发送垃圾邮件。\n\
  \n或者，你可以从超大规模云服务商（如 `AWS`、`Azure` 或 `GCP`）租用物理服务器。与其运行自己的物理硬件，你可以租用他们服务器的访问权限，无论是“裸金属”服务器还是按小时租赁，或者任何你能说服他们提供的服务。这确实是云架构，如果你问我的话，它并不私密，但既然你没问，我就保持沉默。\n\
  \n## 二步架构\n\n所有这些架构都有不同的后端，但前端部分对于每种架构来说都是相同的。它取决于你创建的是什么类型的应用，在业务逻辑上有所不同，但对于非服务器部分，你主要在做提示词工程和用户界面工作。\n\
  \n在理想的世界里，你只需要编写 `JavaScript` 来处理 GUI 组件，并为提示词工程做一些花哨的字符串拼接。你不需要做任何其他事情！\n\n回到现实世界，你需要我所说的“二步架构”，因为无论\
  \ LLM 发生什么，你仍然需要：\n\n* 应用服务基础——例如 IP 地址定位、`DNS` 等。\n* 基础的后端 Web 服务能力——例如提供那些 `JavaScript`\
  \ 文件（以及图像、`CSS` 文件、字体等等等等）。\n* 用户登录和凭证管理\n* 监控与管理功能\n\n哦，不！我刚刚退回到 1990 年代的词汇了。正确的术语是“可观测性”、“编排”以及“LLMOps”，用来进行……你知道的，监控和管理。\n\
  \n总之，你会发现你仍然需要所有的 `Linux` 后端软件开发者，即使你只是在使用 ChatGPT API。那些老旧后端计算机知识对于基础服务器基础设施仍然非常重要，即使你可以将新颖的\
  \ LLM 知识外包给 `ChatGPT API`（需要付费）。\n\n而且是的，我知道，我们在 1990 年代也有过二步架构。但我忘了它们叫什么名字了，所以我发明了自己的术语。看出来\
  \ AI 炒作是如何运作的了吗？\n\n## 安全凭证管理\n\n我们在上面的讨论中略带过的内容之一是安全。你如何验证只有你的合法用户才能使用你基于 LLM 的应用？\n\
  \n即使对于使用第三方 API 的封装式架构，这也是一个问题。例如，使用 `OpenAI API`，你会获得一组用于使用 API 的凭证，任何使用这些十六进制字符串访问\
  \ API 的人都会被收费。\n\n但是，你把这个文件放在哪里呢？\n\n如果你在做手机应用或为 `Windows` 或 `Mac` 开发下载程序，你不能直接把凭证文件放在里面。它没有受到保护，某人会找到并滥用它。理论上，你可以用某种加密将它硬编码到客户端应用中，但它必须是可逆加密，黑客可能可以反汇编译它。\n\
  \n似乎平台供应商应该对此此有更好的解决方案，但我认为这仍然是一个问题。这并不容易修复，但可能在不久的将来会得到。\n\n基于 Web 的应用程序没有客户端文件，所以这使得变得简单了，因为你显然将凭证存储在你的服务器上。因此，如果你在做一个二步的\
  \ Web 应用，你至少可以控制 API 凭证不被用户接触到。它是被埋在 `Linux` 服务器某处的一个小文件，同时也在你的版本控制系统中，你公司所有的 1,000\
  \ 名开发者都可以访问，而且还上传到了 `Github` 的他们的某个秘密项目里。\n\n好消息是，你的用户无法通过使用你的应用前端界面直接窃取你的凭证。但你不能允许他们通过你的二步服务器端匿名向\
  \ `ChatGPT` 发送无限查询。所以，你必须为你的应用界面编写自己的登录功能，并在服务器上管理用户。工作永无止境！\n\n## 设备侧 AI 架构\n\n\
  AI 行业中的设备侧架构通常指的是以下内容之一：\n\n* AI 手机\n* AI PC\n\n但“设备侧”这个术语实际上也包括其他类型的“边缘”设备，例如：\n\
  \n* 汽车\n* 卡车\n* 拖拉机\n* 无人机\n* 具备核能力的战斗机\n* IoT 网络设备\n* `Raspberry Pi`\n* 智能冰箱\n\
  * 烤面包机\n\n好了，我是在开关于军事应用的玩笑，对于这些，传统的模型比生成式 AI 有用。\n\n设备侧推理是目前技术领域最热门的领域之一，但它取决于设备是否能通过互联网访问\
  \ LLM。你的设备手机、平板电脑、笔记本电脑访问 LLM。另一方面，你可能非常关注设备侧推理能力，将在后续章节中详细讨论。\n\n\n\n\n\n7. Matt\
  \ Murphy, Tim Tully, Grace Ge, Derek Xiao, Katie Keller, 2024 年 1 月 18 日，*现代 AI\
  \ 栈：企业级 AI 架构未来的设计原则*[https://menlovc.com/perspective/the-modern-ai-stack-design-principles-for-the-future-of-enterprise-ai-architectures/?tpcc=NL_Marketing]\
  \ \n\n8. Artem Shelamanov, 2024 年 6 月 30 日。*2024 年生产级 LLM 应用的技术栈*[https://python.plainenglish.io/tech-stack-for-production-ready-llm-applications-in-2024-5eb14105d1b4]\
  \ \n\n9. Thiyagarajan Maruthavan (Rajan), 2024 年 4 月 12 日，*如果只是 OpenAI 的一层薄壳又如何？*[https://medium.com/@mtrajan/so-what-if-it-is-a-thin-wrapper-on-openai-274dd005b6d3]\
  \ \n\n10. Michael J. Lever, 2024 年 8 月，*AI 还是 API？ | 聊天机器人泡沫正让技术臃肿。OpenAI 封装正成为初创公司的捷径，但它们可持续吗？*[https://medium.com/future-ux/ai-or-api-chatbot-cuckoos-are-bloating-tech-d6b8d8255279]\
  \ \n\n11. Quang H. Nguyen, Duy C. Hoang, Juliette Decugis, Saurav Manchanda, Nitesh\
  \ V. Chawla, Khoa D. Doan, 2024 年 7 月 24 日 (v2)，*MetaLLM：用于封装 LLM 的高性能、高成本效益动态框架*[https://arxiv.org/abs/2407.10834]\n\
  \n## Transformers 与 LLMs\n\n## AI 引擎与模型\n\n一个 AI 应用实际上包含两个部分，并不复杂：\n\n* 引擎 — Transformer\n\
  * 模型 — LLM\n\nTransformer 是一种神经网络引擎，用于计算生成式 AI 的答案。大语言模型（LLM）包含了所有关于单词之间关系及其相对位置的数据。\n\
  \n从技术角度来看，引擎和模型之间的区别也非常简单：\n\n* 引擎 — 代码\n* 模型 — 数据\n\n运行时代码是“引擎”，而脏性工作通常在 `Python`\
  \ 封装器下通过 `C++` 完成。数据是“模型”，它字面上全全是数字，没有任何代码。到目前为止，这并不有趣。\n\n更有趣的地方在于引擎与模型之间复杂的交织。并不是所有引擎都适用于所有模型，反之亦然。即使是\
  \ Transformer 也与其 LLM 数据紧密交织在一起。Transformer 架构有许多变体，而数据无法与不同的架构匹配。\n\n引擎和模型是共生关系，你需要两者才能完成任何工作。没有模型的引擎意味着你的计算预算耗尽了，而没有引擎的模型实际上不会发生，因为引擎通过训练创建模型。\n\
  \n## 引擎\n\n什么是引擎？引擎是你必须编写的代码。所有快速的低层代码通常用 `C++` 编写，但高层控制代码通常用 `Python` 编写。有人可能用过\
  \ `Java` 来做 AI 引擎，我不喜欢有十层目录结构。如果你在使用 `Visual Basic` 或 `Perl`，那我们就有麻烦了。\n\n所有操作都由引擎根据模型文件中的数据完成。引擎需要加载模型文件，接收用户查询，将查询通过模型权重，并输出它能想到的最佳主意。\n\
  \n引擎主要有两种类型，它们的关系如此紧密以至于几乎是同一东西。从概念上讲，有两种引擎：\n\n* 训练引擎\n* 推理引擎\n\n训练引擎计算查询的答案，将结果与预期进行比较，然后更新模型中的权重。“损失函数”计算结果与训练数据集中预期值之间的接近程度。它有时也被称为“误差函数”，因为它计算了计算结果与预期结果之间的误差指标。在非常高的层面上，基础架构是：\n\
  \n`Training engine = Inference engine + Loss function + Weight Updater`\n\n训练引擎用于训练（出乎意料吧！）以及诸如微训练任务，如使用少量额外数据对模型进行“微调”。训练引擎的主要目的是通过不断更新权重来创建模型。\n\
  \n推理引擎处理用户查询。\n\n\n\n\n\n权重（Weights）是“信号”的倍数，例如下一个应该输出哪个词。小于 1 的分数会降低某个词出现的概率（减少信号），而大于\
  \ 1 则会增加输出该词的概率（放大信号）。零意味着不输出该词。负权重则意味着真的、真的不要输出该词。\n\n程序员并不创建模型文件。你不需要编辑模型文件，也不需要在计算器上反复点点来获取正确的参数数值。模型文件内部的数字是由训练引擎自动生成的。\n\
  \n事实上，看一眼模型文件都是困难的，因为里面充满了数字。你可以进行基础的完整性检查，确保它没有被虚假的 `Inf`（无穷大）和 `NaN`（非数字）浮点值损坏，但即使你眯起眼睛，也无法通过这些数字看到智能性。然而，程序员在运行训练阶段之前，确实必须决定模型的元参数（meta-parameters）。\n\
  \n什么是元参数？模型的元参数是指它拥有多少十亿参数、有多少层，以及它能理解多少种不同的单词（通常为 50,000 个）。这些都是静态的、固定的数值。大多数元参数从训练到推理都是固定的，例如模型的“维度”（例如模型中“层”的数量）。就十亿参数的数量而言，模型的大小大部分也是固定的，除非有一些通过减少或修改参数来加速推理的巧妙方法，被称为“剪枝”（pruning）和“量化”（quantization），但我们现在已经跳跃了大约二十章的内容。\n\
  \n## 大语言模型 (LLMs)\n\n什么是 LLM？与其它类型的 AI 模型文件相比，ChatGPT、Gemini 或 Llama 使用的大语言模型 (LLMs)\
  \ 并没有什么特别之处，仅在于它们是：\n\n(a) 大规模的，\n(b) 专注于语言的（而不是图像），以及\n(c) 一个模型。\n\n好吧，既然你问了，我就回答了。\n\
  \n更具体地说，LLM 倾向于由 `Transformers` 处理的模型文件，而不是其他类型的 AI 引擎。\n\n什么是基础模型（Foundation Model）？这是一种已经过广泛训练的大型通用模型。任何在新闻稿中提到且拥有数十亿参数的模型通常都是基础模型。最大的基础模型可能支持多种语言的文本，以及编程语言编码知识。\n\
  \n从技术上说，如果一个基础模型具有图像生成能力以及文本输出能力，或者可以将图像作为输入的一部分接收，那么它就不是一个普通的基础模型（即它不是真正的 LLM）。相反，这种高级模型类型通常被区分“多模态”（multi-modal）模型。如果有两个这样的模型协同工作，那么它就是“多模态多模型”，你应该尝试连续说十遍这个。\n\
  \n## 其他类型的 LLM\n\nLLM 并不是唯一的选择。在 LLM 出现之前就有 AI 模型，现在也有一些新的模型。以下是我的非 LLM 列表：\n\n\
  *   预测性 ML 模型 —— 带有各种类型神经网络的老派 AI。\n*   扩散模型（Diffusion models） —— 与图像相关，使用新技术，但不基于\
  \ `Transformers`。\n\n基于 LLM 和 `Transformers` 的较新模型类型包括：\n\n*   小型语言模型 (SLMs) ——\
  \ 只有几十亿级参数，可以装进掌中。\n*   混合专家模型 (MoE) —— 包装在一个超级 LLM 中的多个 LLM，例如 `GPT-4`、`Mixtral`\
  \ 和 `Google Gemini`。\n*   大型多模态模型 (LMMs) —— 最新的事物！\n*   大型视觉模型 (LVMs) 和视觉 Transformer\
  \ (ViTs) —— 使用 `Transformer` 架构的机器视觉。\n*   时间序列预测 LLM —— 使用 `Transformers` 进行数据预测（例如\
  \ `Amazon Chronos`、`Nixtla TimeGPT`、`Salesforce Morai`、`IBM Tiny Time Mixers`、`Google\
  \ TimesFM`）。\n\n## 训练与微调\n\n训练和微调的区别是什么？至少差三个零。\n\n训练是将整个维基百科语料库的所有脑力推入一堆数字中。训练一个大模型需要很长时间和一个一个小国家的\
  \ GDP。训练是许多 AI 项目的主要开销。\n\n关于训练的好消息是，如果你搞砸了，你必须重新开始。嗯，这并不完全，因为训练是分批数据运行的。如果评估失败，你必须回到上一个模型候选，因为你无法“取消训练”一个\
  \ AI 模型。然而，审查也可以提出模型需要更多训练的领域，或者需要引导向新的行为或性格特征。除了批处理训练外，还有关于“增量学习”（incremental learning）的研究。\n\
  \n什么是微调？微调是指对已经完全训练过的模型进行较少量的训练。如果你是从零开始训练一个新模型（即使是一个小模型），那么那是训练，而不是微调。\n\n微调最常见的用途是修改强大的基础模型以执行更特定的任务。大多数基础模型都已经在通用信息上经过了广泛训练。你可能想针对特定的用例或使用新数据集对模型进行专门化。这可以通过两种方式实现：\n\
  \n*   微调\n*   检索增强生成 (RAG)\n\n微调为 LLM 添加了关于额外内容的新知识。一种风险是它通过改变底层模型的行为来实现。因此，微调可能会改变基础模型以至于“遗忘”某些区域的“信息”，或者说让它倾向于微调数据而非现有数据。在之后进行测试之前，几乎没有方法可以控制\
  \ LLM 遗忘什么。\n\nRAG 不是训练。注意，检索增强生成 (RAG) 不是训练或微调的一种。事实上，它是像瘟疫一样回避它们的方法。\n\n私有业务数据是微调基础模型的常见原因（但也可以考虑\
  \ RAG）。例如，为了创建一个使用你们产品的客户支持聊天机器人，你可以通过微调让基础模型了解公司的内部产品文档。为此，你将使用这些内部数据来微调基础模型。通过这种方式，为模型加入了知识，它随后可以将其整合到对回答中。这基本上是告诉\
  \ LLM：忘记你对某个主题知道的所有知识，仅从新提示词中的数据推导出你的响应，而不是预编码在模型中的数据。\n\nRAG 是一种架构插件，`Transformer`\
  \ 可以与知道如何“检索”额外信息或文档的组件通信，例如私有的内部业务文档。这些额外数据在模型推理时作为输入上下文，从而扩展基础模型以回答此类材料的问题。\n\n\
  主要点是 RAG 避免了训练和微调的费用，但在实现 RAG 组件方面会产生额外的成本。注意，RAG 架构也与模型/引擎完全不“绑定”，因此在 RAG 应用代码中，切换引擎或模型通常非常容易。\n\
  \n数据集。高质量数据对于微调/训练以及 RAG 技术都是至关重要的。历史上，许多训练数据集都是由人类辛苦收集的。一种新的技术是使用一个 LLM 的输出作为另一个模型的输入训练数据集。这种方法和其他类型的“合成数据”正在被更充分地使用。\n\
  \n\n\n\n\nRAG（检索增强生成）与微调/训练所需的数据结构有所不同。RAG 数据需要被切分为与特定问题相关的“块”（chunks），这些块可以很好地映射到内部文档。而微调数据可能需要更多的问答或对话结构，这在产品数据表或公司政策文档中并不常见！例如，如果你想有一个能够回答问题的聊天机器人，那么训练数据需要大量的问答对。另一方面，对于\
  \ RAG，数据被封装在一个问题中，作为隐藏提示词（prompt）的一部分。\n\n仅仅向大语言模型（LLM）提供整个企业营销材料，甚至是整个维基百科，对微调或训练并没有太大帮助。给\
  \ LLM 喂入大量流畅的维基百科文本，意味着它可能以维基百科的风格“完成”输入，并可能逐字引用语料库中的段落，但并不一定回答关于维基百科内容的问题。为了回答问题，训练数据需要大量的问答类型对（即使得“完成”的内容是针对问题的答案）。LLM\
  \ 只是预测可能的下一个单词和下一个句子，因此 LLM 必须学习在问题后预测答案。翻译用例的情况也是如此，如果你想让你的 LLM 将英语翻译成克林贡语，训练数据不能只是英语维基百科内容与克林贡语内容的组合，而需要英语短语及其对应的克林贡语短语对。\n\
  \n## 推理\n\n### 什么是推理？\n“推理”是 AI 领域中运行或执行 AI 模型的说法。推理和训练是不同的阶段。当你正在训练或微调时，那不是推理。但当你完成并在线部署模型，每次查询收取几分钱时，那就是推理。当你向\
  \ ChatGPT 问时，你是在向它的“推理引擎”发送“查询”或“提示”，当它礼貌地拒绝你的请求时，那就是它的“推理”代码的输出结果。\n\n## 什么是延迟和吞吐量？\n\
  延迟（Latency）是你推理引擎运行的速度。它类似于单个用户的“响应时间”概念。吞吐量（Throughput）衡量的是你的引擎在时间内可以处理多少查询，这更多地与你的引擎处理提交大量查询的用户组的速度。\n\
  \n## 推理的类型\n推理不仅有一种类型，具体的算法取决于你正在尝试做什么。某些类型包括：\n\n*   **补全 (Completions)**：这意味着将提示词扩展为更长的答案。常见用例包括自动编写文本或回答问题。\n\
  *   **翻译 (Translation)**：将你的 Python 代码注释转换为克林贡语。\n*   **摘要 (Summarization)**：获取输入的提示（如段落或文档），并创建一个简短的摘要。\n\
  *   **语法错误纠正 (GEC)**：非研究人员也称为“编辑”。\n*   **转换 (Transformation)**：更改文本输入的语调或风格，或更改格式和呈现方式。\n\
  *   **分类 (Categorization)**：将输入分析为一组不同的类别，这实质上是摘要的一个子集。\n\n## 推理设置\n除了选择总的推理算法类型外，还有一些常用的参数来控制推理请求。\n\
  \n*   **温度 (Temperature)**：较高的温度设置会让你的引擎“发烧”，并输出一些愚蠢的词。这被称为“创造力”。\n*   **Token 限制\
  \ (Token limit)**：这是一个限制引擎在响应中允许输出的单词（tokens）数量的简单概念。\n*   **格式化 (Formatting)**：你希望引擎输出纯文本、表格或其他格式。\n\
  \n这只是一个示例列表，API 提供商通常有更多选项。通常还有许多与请求安全和跟踪相关的其他参数。例如，你可能需要提交你的安全凭据（即密码）以及请求的唯一 ID。这有助于\
  \ API 验证你的请求，并帮助你跟踪哪个终端用户提交了请求，以便将答案返回给他们。\n\n## 上下文与对话\n\n如果你正在创建一个聊天机器人，你会创建一个接受用户输入的\
  \ UI，通过网络将其发送到 AI 引擎，然后答案输出给用户。他们通过一系列请求和响应进行往来，从而创建了对话。\n\n### 噢，真的吗？\n缺失的是对话中每个请求的“上下文”。你不能只将用户的最新响应发送给引擎，因为：\n\
  \n*   AI 引擎是无状态的。\n\n因此，默认的 AI 引擎并不记得它之前已经说过了什么。也许是因为 GPU 偷走了它们所有的内存。\n\n相反，作为程序员，你需要负责在每次请求时存储并重新提交整个对话历史。当你按输入\
  \ Token 付费时，这是一个非常糟糕的情况。\n\nAPI 供应商开始帮助你处理上下文管理。OpenAI API 提供了在请求中结构化历史上下文的辅助方法。同时也存储在\
  \ LLM 的 `KV Cache` 中，而在换和出 `KV cache` 的想法正在成为一种趋势。这被称为“前缀 KV 缓存”（prefix KV caching），它已经在\
  \ `vLLM`、`DeepSeek`、`Anthropic`、`Google Gemini` 和 `OpenAI` 中可用。这允许重复查询的结果在单个用户会话中共享，也可以跨多个用户作为每次上下文切换时的“短期记忆”移植。\n\
  \n## 扩展 Transformer\n\n最受关注的 Transformer 类型是生成式预训练 Transformer (GPT)。这是一种基础文本处理\
  \ Transformer，可以处理单词并以惊的人类优雅生成输出。\n\n现代研究已将 Transformer 应用于其他类型的输入和用例中。结果是 Transformer\
  \ 架构的各种扩展。\n\n*   **多模态 Transformer (Multi-modal Transformer)**：指的是接受图像（或视频）输入而非简单文本的\
  \ Transformer。\n*   **视觉 Transformer (ViT)**：将 Transformer 技术用于计算机视觉，例如自动驾驶汽车。\n\
  *   **双向 Transformer (Bidirectional Transformer)**：这是过去的一种研究类型，最近没有得到多少关注。它的想法是可以同时从两个方向检查其输入数据。主要的例子是来自\
  \ Transformer 的双向表示 (`BERT`) 及其许多变体。\n*   **检索增强生成 (RAG)**：这是一种架构，Transformer 与一个“检索”额外数据的独立组件（例如文档搜索机制）相结合。其想法是在无需额外训练的情况下将\
  \ AI 引擎扩展到新数据。\n*   **集成推理 (Ensemble inference)**：“集成阵容”（ensemble cast）是一个好莱坞术语，指的是由一组著名演员在同一个故事中共同主演的电影。幽幽默（或雄心勃勃）的人决定用同一个术语来描述一组\
  \ AI 模型共同创作同一个杰作。\n\nTransformer 的一些主要研究领域涉及解决其执行的资源密集性质。例如，基础 Transformer 在输入长度方面具有平方复杂度。因此，工业界和实验室创建了许多\
  \ Transformer 架构的修改。请参本书第七部分有关 Transformer 的大量文献综述。\n\n## 其他类型的神经网络\n\nTransformer\
  \ 是神经网络演进中的一个突破。它的主要优势之一是执行并行计算的能力，使其能够通过纯暴力的算法增加智能。这导致了模型规模激增到数十亿参数级别，我们现在称之为大语言模型\
  \ (LLMs)。\n\n\n\n\n\n在 Transformer 出现之前，存在许多不同的神经网络架构。其中一些设计在今天仍被用于它们在某些领域优于 Transformer\
  \ 的领域。\n\n### 循环神经网络 (RNNs)\n一种早期的神经网络，通过序列进行迭代工作。`RNN` 每次处理一个标记（token）来处理其输入，生成输出响应，然后将其自身的输出作为输入重新进入下一次阶段。因此，它在处理自身输出时是“递归”的，当同样的理念出现在\
  \ Transformer 中时，它被称为“自回归”模式。在文本处理和生成式 AI 应用中，Transformers 已经在很大程度上取代了 `RNNs`。然而，仍然有研究论文试图通过技术进步复兴\
  \ `RNNs`，或者创建混合的 Transformer-RNN 架构。\n\n### 生成对抗网络 (GANs)\n这是一种先进的图像生成神经网络。其核心思想是结合两个模型：一个生成候选图像的模型（“生成器”），另一个用于评估这些图像的模型（“判别器”）。通过这两个模型之间一种奇特的“对抗”，生成器模型逐渐创建出让判别器喜欢的更好的图像。结果惊人地有效，这项技术今天仍在使用。\n\
  \n### 卷积神经网络 (CNNs)\n虽然 `RNNs` 和 Transformers 关注输入序列，但 `CNNs` 更擅长处理具有结构的输入数据，尤其是图像固有的空间结构。现代图像处理和计算机视觉技术仍在使用\
  \ `CNNs`，尽管增强型 Transformer 架构（如多模态或视觉 Transformer）也可以被使用。`CNNs` 擅长将图像分割为独立的输入“通道”，对每个通道应用“过滤器”。因此，在与图像处理相关的领域，`CNNs`\
  \ 一直与 Transformers 竞争不相。\n\n还有其他各种类型的神经网络，它们都受到了一定程度的研究关注：\n\n* 长短期记忆网络 (LSTM) ——\
  \ 一种 `RNN`。\n* 脉冲神经网络 (SNNs)\n* 液体态态网络 (LNNs)\n* 状态空间模型 (SSMs) —— 例如，`Mamba`。\n\
  * 量子神经网络 (QNNs)\n\n还有另一种架构在消费领域和商业领域都相当常用。它被称为碳基模型 (CBM)。然而，`CBMs` 极难训练，通常需要 20\
  \ 年的训练才能开始变得有用，同时消耗大量的输入，却只产生不屑的波动和偶尔的咕噜声作为输出。\n\n本书主要关于 Transformers，因此感兴趣的读者请参考关于这些架构的研究文献，或者参考心理学教科书了解这些“生物机器人”。一般来说，关于\
  \ AI 的研究论文之多，以至于实际上任何事情都有例外。但那些勇敢的研究人员通过为我们提供许多硬核算法进行编码，为程序员们做了巨大的服务。\n\n## 参考文献\n\
