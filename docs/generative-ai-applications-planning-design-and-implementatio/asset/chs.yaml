  \n# 第二部分：选择 AI 项目\n\n“我希望 AI 我洗衣服和洗碗，这样我可以去创作和写作，而不是洗衣服和洗碗。” —— Joanna Maciejska，作者，2024\
  \ 年 3 月。\n\n## 决定\n\n### 决策\n\n好了，你不需要决定！这已经为你做好了。但还有其他几个决策：\n\n*   构建哪些 AI 项目？\n\
  *   外部项目还是内部项目？\n*   我们多久需要它？\n*   需要支持多少用户？\n\n然后还有一些元决策（meta-decisions）：\n\n*\
  \   谁来决定？\n*   谁来研究技术？\n*   谁负责构建？\n*   谁来跟踪项目？\n*   谁买单？\n*   法律部门准备好了吗？\n\n假设你决定做某些事情，还有一套关于如何达目标的决策集：\n\
  \n*   自建还是购买？\n*   外包还是内部开发？\n*   云端、本地还是设备端？\n*   用于用户界面的前端设备是什么？\n\n# 项目优先级和目标\n\
  \n为什么要做生成式 AI 项目？当你试图发布一个 AI 项目时，无论是面向公众还是对内部员工，都有两个主要的竞争性优先事项：\n\n*   错失恐惧 (FOMO)\n\
  *   搞砸恐惧 (FOFU)\n\n这些都是非常合理的担忧！耗时太长，你的竞争对手就会超过你。更糟糕的是，会出现一个你从未见过的穿连帽衫的人拥有一家价值数十亿美元的初创公司。\n\
  \n但也许多新发布的 AI 项目的失败案例，以及随之而来的公关尴尬。比如告诉人们在披萨上涂胶水，或者可以在不必任何担心的情况下采摘蘑菇，或者写出缺乏同理心的讣告。\n\
  \n目标。你的项目的目标可能是：\n\n*   公司声誉\n*   市场定位\n*   增长（收入、用户、市场份额等）\n*   生产力\n*   降低成本\n\
  *   用户赋能（增加功能）\n\n可能还存在防御性目标：\n\n*   技术不落后\n*   对抗颠覆者\n*   员工士气\n\n这些都是值得追求的目标，但其中一些很难实现。降低成本和提高生产力是战术性目标，而防御颠覆者是长期战略目标。\n\
  \n\n\n\n\n# 选择你的 AI 项目\n\n项目是什么？这里是一些 AI 业务用途的常见项目示例：\n\n*   面向营销或其他部门的写作副驾驶（Writer\
  \ copilot）。\n*   面向软件开发人员的编程副驾驶（Coding copilots）。\n*   你网站的支持聊天机器人，直接回答客户关于产品的问题。\n\
  *   面向支持人员的内部问答服务，帮助回答问题并提供可遵循的“脚本”。\n*   内部问答服务，回答销售人员关于产品的问题（比公共聊天机器人提供更深入的答案）。\n\
  *   内部 HR 机器人，回答员工关于 HR 政策和公司内部事务的问题。\n\n以上都是规模较大的项目。一种方法是寻找自动化更小领域的价值，以对工作流进行增量改进。IT\
  \ 部门的一些示例包括：\n\n*   通过 `ChatGPT` 对错误消息和告警进行后处理。这可以使它们更具可读性，并提供关于如何修复它们的“专家建议”。\n\
  *   为你你正在使用的任何 IT 软件生成微小的技术格式，例如 `JSON` 配置文件或规则（例如用于 `Prometheus`、`Graylog` 等）。\n\
  *   从文本描述生成 `SQL` 查询，以查询任何现有的数据库。\n*   为任何需求编写短小的 Linux `shell` 脚本。\n\n**专业提示**：你可以选择多个\
  \ AI 项目！\n\n第一个 AI 项目的常见类型是让某些特定小组的员工接受 AI 工具培训以提高他们的生产力。这些是各种“副驾驶”（copilot）类型的\
  \ AI 工具，它们可以被不同的公司团队（甚至是程序员）使用。这里一个重要的区别是，这类副驾驶工具可能不需要 `LLM` 针对特定的内部数据进行训练，这是它们可以更快上线的另一个原因。\n\
  \n## 其他公司在做什么？\n\n大家在 AI 方面都在做什么？一方面，关于生成式 AI 的新闻文章如如牛飞。另一方面，许多主要参与者仍是私有初创公司，财务状况不明。尽管如此，我尝试积累了一些有用的数据点。\n\
  \n### 追踪资金流\n\n谁在从生成式 AI 中盈利？到目前为止，在信息公开的情况下，主要赢家包括：\n\n*   `NVIDIA` — `H100` 芯片。\n\
  *   `OpenAI` — 超过 30 亿美元的收入。\n*   `Microsoft` — `Azure` 以及各种副驾驶工具。\n*   `Accenture`\
  \ — AI 项目订单额超过 20 亿美元，而一年前为 3 亿。\n*   `Scale AI` — 收入接近 10 亿美元。\n\n**OpenAI 收入**。目前还不清楚\
  \ `OpenAI` 是从个人还是企业中盈利。然而，他们刚刚让消费版免费使用且无需登录（即他们刚刚“取消了访问限制”），我怀疑如果消费者是他们的主要收入来源，他们不会这样做。有些估计认为\
  \ `OpenAI API` 是最大的收入来源，这意味着企业客户和其他 AI 优先的初创公司。\n\n**Scale AI 业务收入**。`Scale AI`\
  \ 是一家专注于 AI 数据清洗和标注的初创公司，他们在融资更多资金时提供了一些见解性的公开信息。最近，他们宣布收入大幅增长，并指出 90% 的经常性收入现在由企业客户驱动。此前，他们的主要客户是构建基础模型的大\
  \ AI 初创公司。\n\n### 市场总体状况\n\n我对上述点的分析以及通过阅读大量文章得出的结论是情况如下：\n\n*   许多公司正在购买或租赁 `H100`\
  \ 芯片（现在还有 `B100s`）。\n*   大量资金投入到咨询服务（不清楚在多大程度上是建议还是“为我构建”的项目）。\n*   内部员工生产力方面更多是“购买”而非“自建”（例如编写副驾驶产品、编程副驾驶、`Microsoft\
  \ Copilot` 等）。\n*   手机端侧 AI（`Apple` 和 `Android`）刚刚开始。\n*   AI PC 端侧应用刚刚开始（例如 `Microsoft`\
  \ 和 `Copilot+` 电脑）。\n*   AI 安全产品。\n\n**业务项目状态**。在特定的业务 AI 开发项目方面，我的结论如下：\n\n*  \
  \ 许多企业正在进行 AI 项目（或至少在进行“实验”）。\n*   特定的业务 AI 应用的 3-5 年部署周期已进入第 2 年。\n*   许多项目卡在 `POC`（概念验证）和生产前阶段（但正在改变）。\n\
  *   员工并没有等公司赶上，而是在大规模工作中使用消费级 AI 产品（并泄露了大量的专有数据！）。\n*   构建 AI 应用是一场挣，因为没人知道该做什么——复杂问题太多，供应商也太多。\n\
  *   安全问题和合规性是另一个减缓采用的痛点。\n*   公司内部的脏数据是许多业务 AI 项目的主要瓶颈。\n*   面向外部的 AI 应用比内部使用少得多。\n\
  *   基于内部能力的特定业务的 AI “平台”很罕见。\n\n这些听起来都很棒，但实际上只有一个大问题。\n\n## 混乱横行\n\n好吧，至少顾问们过得不错。可能这是因为没有其他其他人真的知道该做什么。而且私下说，我不确定顾问们是否也知道所有的答案。\n\
  \n为了帮助你，这里是我列出的构建 AI 应用时的困惑领域：\n\n*   构建什么\n*   使用什么数据\n*   使用什么平台\n*   使用什么模型\n\
  *   如何构建它\n*   如何测试\n*   是否合法\n\n也许直接呆在窝里更好。但至少你并不孤单。每个人都很困惑！\n\n## 更简单的选择\n\n为了让自己轻松一点，请先考虑更简单的项目。这里关于进入\
  \ AI 领域更简单方法的想法。请注意，我并没有说它们是最便宜的方法，或最有益的方法。我只是说了“更简单”，而且绝对没有说“容易”。\n\n以下是可选的较简单的项目类型：\n\
  \n*   买比造简单。\n*   内部使用比面向客户更简单。\n*   文本比图像简单，图像又比视频简单。\n*   人工参与（Human-in-the-loop）比无人值守或自动化更简单（即由真人审核\
  \ AI 输出会使其更容易避开陷阱）。\n*   先读后写（即选择那些只回答问题、但不“改变”任何东西的项目）。\n*   基于浏览器的界面连接云端后端比端侧\
  \ AI 更简单。\n*   AI 代理（AI agents）很难且非常新颖。\n*   构建自己的平台是最糟糕的。\n\n## 内部业务 AI 平台\n\n\
  在员工生产力和解决常见客户痛点方面，有很多短期胜利。其中许多是“购买”而非“自建”，倾向往往是推后那些更复杂的 AI 项目。然而，这些短期项目并不是实现 AI\
  \ 承诺的真正大战略性胜利。这可以总结为：一个针对特定业务的 AI 平台。\n\n将 AI 成为组织内部的核心竞争力是一项长期战略优势。每家企业都是不同的，特定的业务需求可以远远超过写作副驾驶、客户支持机器人和其他现成\
  \ AI 系统的通用功能。\n\n\n\n\n\n在评估您的 AI 长期战略时，请考虑是什么让贵公司与众不同。您相对于竞争对手的战略优势是什么？然后考虑生成式\
  \ AI 如何增强和扩展这些能力，并同时观察公司内部和外部。\n\n# AI 核心能力等级\n\n目前的情况非常复杂，但似乎正在发生一种自然的演进。这种区别可以映射为：\n\
  \n* 战术性 AI 项目\n* AI 的战略性使用\n\n以下是我对企业内部 AI 核心能力等级分级的的想法。\n\n## 战术性 AI\n对于短期 AI 项目，等级如下：\n\
  \n* 为内部员工购买——例如，写作助手（writer copilots）、代码助手（coding copilots）或其他即用 AI 应用。\n* 为外部客户购买——例如基于\
  \ `RAG` 或通过自动抓取您的网站进行微调的“定制”客户支持聊天机器人。\n* 为内部员工构建——例如自动化某些更烦人的内部重复性业务流程，以提高员工生产力。\n\
  * 为外部客户构建——例如清理内部专有数据，并使用这些数据对特定的面向客户的应用进行更好的微调。\n\n战术性 AI 项目的目标可能是具体且可衡量的。示例包括：\n\
  \n* 成本降低\n* 生产力提高（例如：字数、`SLOC` 等）\n* 客户满意度指标提升（例如：解决客户问题的平均时间）。\n* 转化率（例如：客户触达中的个性化销售内容）。\n\
  \n## 战略性 AI\n嗯，战术性 AI 项目已经已经进行了一段时间了。如果你真的想在长期内脱颖而出，请考虑战略。战略性能力等级要困难得多：\n\n* 内部业务特定\
  \ AI 平台——扩展您的能力，以便轻松创建许多用于业务流程自动化的“微应用”。\n* 外部业务特定 AI 平台——以您可以轻松利用和扩展的方式，控制与客户的触点。\n\
  \n在战略层面，目标将不那么注重量化，且更具长期性：\n\n* 可重复性——使用相同的流程和底层框架快速上线新功能。\n* 可扩展性——能够快速扩展入规模，无论是员工还是客户。\n\
  * 专业化——利用您组织的核心竞争力。\n\n运行自己的 AI 平台是最大的长远胜利。我不确定您是否需要运行自己的 `H100s`，您可能只需通过定制和扩展现有的\
  \ AI 基础设施平台来构建自己的自己的平台。但我认为，控制在核心业务领域添加更高级功能的能力非常重要。通过拥有创新层级，您可以使用竞争对手难以企及的专业能力来推动其发展。这需要时间和金钱，但这将是生成式\
  \ AI 的长期战场。\n\n为了避免在构建 AI 平台时向超大规模云服务商（hyperscalers）支付过多的现金，有一些降低成本的方法。在早期，以及在开发许多功能时，对\
  \ AI 部分进行模拟（mock）。一个符合 `OpenAI APIs` 的小型模型本地 AI 即可运行，这样整个应用就可以进行开发、调试并测试许多部分，而无需按\
  \ token 付费或面临知识产权（IP）暴露的风险。一旦达到标准，就切换到“真实”AI 并开始进行正确的集成测试。\n\n奇怪的是，相反的计划在某种程度上也有效。在开发开始之前，可以使用完整的\
  \ AI 模型（例如 `ChatGPT` 交互式）预先创建并验证查询/提示词，即使是为了证明 AI 方法的价值。这种“范围确定”或“可行性”工作不需要由开发者完成，因此可以交给营销部门。这些\
  \ AI 行动将花费较少资金，而且您可以在尝试开发它们之前对 AI 功能进行概念验证（POC）！\n\n## 参考文献\n\n1. Gene Rapoport,\
  \ Sanjin Bicanic, Jue Wang, Richard Lichtenstein, Arjun Dutt, 2024 年 6 月 20 日, `AI\
  \ Survey: Four Themes Emerging: If 2023 was about experimentation, 2024 is all about\
  \ results`。 Bain & Company, [`www.bain.com/insights/ai-survey-four-themes-emerging/`](https://www.bain.com/insights/ai-survey-four-themes-emerging/)（贝恩报告指出，用例在销售、销售运营、软件开发、营销、客户服务和客户入驻已广泛成功，但在人力资源、运营和法律方面的成功较少。有趣的是，AI\
  \ 项目失败的主要原因是无法执行必要的任务。）\n2. Timothy Mugayi, 2024 年 9 月, `LLM Practical Ideas to\
  \ Build Your Next AI-Powered Application: Realistic Use Cases to Unleash the Power\
  \ of AI in Your Next Project`, [`levelup.gitconnected.com/llm-practical-ideas-to-build-your-next-ai-powered-application-9379feba6cbc`](https://levelup.gitconnected.com/llm-practical-ideas-to-build-your-next-ai-powered-application-9379feba6cbc)\n\
