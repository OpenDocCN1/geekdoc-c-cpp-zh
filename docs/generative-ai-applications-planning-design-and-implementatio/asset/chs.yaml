  \n# 第六部分：高级主题\n\n> “大多数人高估了他们一年能做的事，低估了他们十年能做的事。” —— 比尔·盖茨\n\n# 19. AI 手机与 PC\n\n\
  ## AI 手机\n在手机上拥有 AI 似乎是下一个大趋势。核心思想是拥有一个语音接口，你可以与 `LLM` 进行对话。我们在手机上已经有了这种语音交互一段时间了，但在实用性方面一直参差不齐。想象一下，如果它真的很聪明会怎样！\n\
  \n当然，大型手机厂商都在押注这可以实现，消费者将大量购买新手机。三星在 2023 年通过在其手机上的某些 AI 功能领先一步，并在 2024 年初推出了 `Samsung\
  \ Galaxy AI`。谷歌稍后跟进了用于在 Android 手机上构建 AI 应用的 `on-device` SDK。苹果虽然落后了，但似乎通过其 `Apple\
  \ Intelligence` 平台发力回击，尽管在我写这句话时它才刚刚发布。苹果首席执行官蒂姆·库克说：“不是第一，但最好。”这还有待观察！\n\n## AI\
  \ PC\n我很确定你已经见过很多关于这类新型 PC 的广告了。它们在 `CPU` 旁边增加了更强大的处理器，这些处理器对 AI 有处，但没有像全 `GPU`\
  \ 那么耗能。而且当然，如果你有一台配备良好 `GPU` 的高端 PC，你也可以运行 AI。\n\n微软一直在推动所有的 `Copilot+ PC`，具有内置的\
  \ AI 能力。在许多微软工具中也有许多软件 `copilot` 功能。事实上，发布会几乎每周都有一次，到目前他们肯定已经为所有这些 PC 应用添加了 AI！\n\
  \n在手机或 PC 上运行 AI 有有许多重叠之处，因为它们都是比云端服务器性能更低的设备。然而，它们有不同的侧重点，AI PC 区别于 AI 手机的特有功能包括：\n\
  \n*   更大的屏幕\n*   键盘和鼠标接口\n*   无法装进兜里\n*   更适合工作任务\n*   更快的 CPU\n*   高端 PC 可以配备 GPU\n\
  \n\n\n\n总的来说，虽然家用 PC 很常见，但由于上述所有原因，AI PC 更多地面向业务。在小小的屏幕上使用语音界面编写业务报告是困难的，因此我不认为手机在短期内会取代工作电脑。\n\
  \n## 用场景\n\n哪些用场景最适合 AI 手机和电脑？最简单的 AI 引擎在某种意义上是“只读”的，因为它们不会改变任何内容，也不会执行任何“动作”。这类用场景是\
  \ `LLM` 处理输入数据，但仅为你提供答案或一份总结报告。\n\n`LLM` 可以在你的手机或 PC 上分析哪些数据？思考一下可用于分析的信息。手机上的 AI\
  \ 引擎可以搜索或访问：\n\n*   短信\n*   电子邮件\n*   社交网络\n*   照片\n*   语音备忘（音频录音）\n*   视频\n*  \
  \ 联系人\n*   时间和日期\n*   网页（当前浏览器中的页面）\n*   浏览器网页历史\n*   日历\n*   计时器\n*   手电筒/光\n*\
  \   待办事项\n*   笔记\n*   方向/高度计/运动\n*   健康数据\n*   文件（较少使用）\n*   设置（例如 `DND` 请勿扰、飞行模式等）\n\
  \n其他一些其他杂的想法：\n\n*   记住我的密码\n*   活动历史\n*   跟踪我的步数\n*   检测车祸或跌倒\n*   提醒我吃药\n\n我们还可以使用\
  \ AI 生成内容，这类似于一种“读取”动作，因为在你存储或发送它之前，它不会改变外部世界（甚至甚至不会改变你的手机），例如：\n\n*   写文本（大纲、脑风暴、列表、草稿、诗歌、歌词等）\n\
  *   修改、编辑、校对文本\n*   创建电子邮件、短信、社交帖子等\n*   创建图像\n*   创建视频\n*   创建音频（例如，歌曲）\n*   创建动画\n\
  *   创建表情符号\n\n如果我们把此进一步泛化到更广泛的“读取”内容，我们就会得到此类的查看动作：\n\n*   天气\n*   新闻标题\n*   浏览网页\n\
  *   股票报价\n*   销售和折扣\n*   外汇率\n*   观看在线视频\n*   提醒你某事\n*   搜索互联网\n*   地图\n*   运动路线\n\
  *   定位我的车\n*   定位我的孩子、父母、配偶、狗、猫、手机、眼镜、钥匙等\n\n## 设备上的代理\n\n执行“动作”的 AI 应用被称为“代理（agents）”。拥有一个智能代理来协助你是很有理由的，它可以在你的口袋或包包里，或者在办公桌上等待你的指令。代理还可以在不需要你启动的情况下自动运行，例如让\
  \ `LLM` 在早晨用首美诗唤醒你。\n\nAI 可以在你的手机或 PC 上改变或做什么？有一个长长的列表，这里是其中：\n\n*   发送短信或电子邮件\n\
  *   发布社交动态\n*   打电话（难道你不更愿意发短信吗？）\n*   无需你参与即可打电话，由 AI 说话！\n*   拍照或摄像（通过摄像头）\n*\
  \   录制音频（通过麦克风）\n*   设置计时器（或更新/取消）\n*   播放声音\n*   说话（例如，回答你的问题）\n*   存储文件（本地或云端）\n\
  *   编辑文字（文本、电子邮件、文档）\n*   编辑音频\n*   编辑照片\n*   编辑视频\n\n如果我们允许 AI 代理查看手机或 PC 的 `SSD`\
  \ 硬盘之外，通过其他寻找更多信息的应用或执行远程操作，我们将获得更多：\n\n*   预订……会议、预约、美发店、餐厅、机票、假期、医生、疫苗、租车、试驾、游轮、保姆、导师、电影等等。\n\
  *   更新/修改/取消/提醒以上内容的预订。\n*   订购……共享出行、出租车、餐食、书籍、产品等。\n*   跟踪/更新/修改/取消以上内容的订单。\n\n\
  ## 高级多步用场景\n\n有些非常复杂的用场景可能涉及长途任务，可能需要 `LLM` 与人类之间的往返，或者从许多不同的地方获取数据。高级想法包括：\n\n\
  *   预订假期\n*   办理我的报税\n*   整理我的旅行费用\n*   辅导我学习物理\n*   我的一天是怎么过的？\n*   支付账单\n*   我的孩子今天学校需要什么？\n\
  *   为我的待办事项排序\n*   我的车需要保养吗？\n*   教我外语\n*   帮助我管理孩子的糖尿病\n*   给我的客户开票\n*   更新我的记账\n\
  *   为我监控新闻标题\n\n不仅如此，想象一下这些进步与与你的手机或笔记本电脑对话相结合……\n\n*   5G 下载速度（6G？）\n*   机器人（拖地）\n\
  *   自动驾驶汽车\n*   AI 设备和新外形态\n*   工业自动化\n*   量子计算\n\n## AI 手机应用\n\n在手机应用中添加 AI 功能是一个明显的机会。我们已经看到微软迅速出手，在其产品组合的许多软件中添加了\
  \ AI 功能，其中某些与从你的 PC 或手机访问 AI 引擎有关。当我写这些内容时，苹果正忙于让所有的第三方应用使用 AI 功能。\n\n（注：原文此处存在大量重复的段落，译文已按要求保留核心含义翻译。）\n\
  \n\n\n\n许多与手机快速执行模型相关的早期研究与另一类型的计算机有关，你可能知道这种计算机被称为“汽车”。自动驾驶或辅助驾驶对计算机视觉模型的需求与在手机上运行的需求相似，例如低延迟和小存储空间。这类系统的通用术语是“嵌入式”系统或“实时”系统。\n\
  \n手机和电脑上已经运行了小型大语言模型（LLM）。然而，在手机上运行大语言模型存在一些问题。这限制了我们使用更小的模型，但一切都在逐渐变得越来越强大。在手机上直接运行\
  \ AI 模型存在以下几个原因：\n\n*   运行太慢 —— 响应时间太长。\n*   硬件加速 —— 手机缺乏 GPU，CPU 加速也少。\n*   存储大小\
  \ —— 例如，一个带有 32 位权重的“小型” 3B 模型需要 12GB 的存储空间。考虑到现代手机通常超过 512GB，在 52GB 中存储一个 13B 模型似乎是合理的。\n\
  *   内存占用 —— 整个模型被加载到 RAM 中进行推理。障碍更多在于访问这些内存的时间成本，而非存储大小。\n*   传输大小 —— 通过手机的 4G 或\
  \ WiFi 连接安装一个巨大的模型。\n*   电池耗电 —— 计算会使手机 CPU 达到最大负载并消耗周期。\n*   发热问题 —— 手机还没有水冷手机。\n\
  \n由于这些原因，手机 AI 的能力仍然受到一定限制，而且将复杂的 AI 请求发送到云端运行大量 GPU 的大型服务器仍然更快，尽管这需要一次往返网络通信。随着时间的推移，在手机上原生执行推理的某些障碍将会减少：\n\
  \n*   具有硬件加速的更好手机 CPU 已经出现（例如自 iPhone X 以来的 Apple Neural Engine、高通骁龙），更多产品在路上。未来的手机将具备更强的\
  \ AI 能力。\n*   小模型优化（例如 Apple Intelligence 使用的多 LoRA）。\n*   配备 GPU 的手机无疑很快就会出现在你家附近的商店里。\n\
  *   手机存储容量也在增大，TB 级存储容量将成为常态。\n*   5G 网络连接将减少对传输大小的担忧。\n*   数据压缩算法可以降低传输大小，也可能降低存储大小。\n\
  *   量化模型和其他推理优化可以提高速度并减小存储大小，从而减少 CPU 占用、缩短响应时间、减小存储大小并降低传输大小（但会有精度损失）。\n*   模型的训练和微调不需要在手机上进行（谢天！）。\n\
  \n但是……如果你想让应用非常出色并拥有大量快乐的用户，你真的需要一个“大”模型，而不是“小”模型。要让大模型在手机上高效运行可能需要一段时间才能实现。在此期间，你的手机将会将这些类型的查询发送到云端。\n\
  \n## 加速手机 AI\n\n好了，假设你想在一部“小”手机上运行一个“大”模型。为什么？有很多原因，我们在这里不探讨。所以，你只是想要你所想要的，即在手机上运行最新的开源\
  \ AI 模型。\n\n第一个问题是：你真的需要这样做吗？为什么不直接使用云端的 AI 引擎，在手机和云端之间往返发送请求？现代网络的响应时间很快，消息大小很小，用户可能察觉不到甚至不在乎。除了速度之外还有其他原因：人们考虑到隐私和安全。\n\
  \n另一个好消息是：你不需要在手机上“构建”模型。那些昂贵的 GPU 成本的训练或微调任务可以在云端完成。对于原生执行，用户只需要在手机上运行模型的“推理”。\n\
  \n假设你有理由想这样做，让我们检查在手机上原生执行 LLM 模型推理的每种障碍。\n\n*   速度和响应时间。手机上的 AI 引擎需要快速的“推理”（快速运行模型）。它可能无法依赖\
  \ GPU，因为世界上已经有数十亿部手机没有 GPU。手机 CPU 中的硬件加速是有限的。在手机或 PC 上在没有 GPU 的情况下运行模型的主要方法是使用推理优化，其中目前最流行的绝对是量化化。其他可能需要的辅助技术包括仅限整数算术和剪枝（模型压缩）。还有许多系列较不为人知的推理优化技术可能需要结合使用。例如，也许“自回归”的瓶颈需要被跳过，以便\
  \ AI 引擎能够一次产出多个单词，而无需为每个单词都运行整个庞大的模型。\n*   网络传输大小。用户需要向他们的手机下载你的 13B Llama-2 模型吗？未压缩的话，大约有\
  \ 52GB。人们对压缩算法（例如视频压缩）已经很熟悉，而模型文件只是几 GB 的数据文件，也许可以被压缩到足够小的尺寸。但在使用那些网络压缩算法之前，首先要尝试的是模型压缩，例如量化。例如，使用量化到\
  \ 8 位会将原始 32 位模型的大小缩小四倍到 13GB，精度会有轻微损失（可能可以接受）。二进制量化将将其缩小 32 倍，但推理精度会下降。5G 带宽会有很大帮助，但记住世界上有大量（数十亿）使用非\
  \ 5G 手机的用户。量化和剪枝等模型压缩技术也可以减小总大小。但整个模型是完整的。不存在半个 AI 模型。而且你无法流式传输 AI 模型以便在加载之前就开始运行（尽管这实际上是一个有趣的研究问题，即是否可行）。\n\
  *   存储大小。整个模型需要永久存储在设备上。也许它可以以压缩的形式存储。关于模型技术的评论也适用。如果手机有存储空间，可以以未压缩的形式存储，或者可以以压缩形式存储，仅在需要时解压缩。但它会一直被需要，因为，你知道，这是\
  \ AI，所以每个人在任何事情都需要它。\n*   内存大小。推理算法需要整个未压缩模型在 RAM 中可用。并不是同时加载，但它确实需要将整个模型（未压缩）在内存中换入换出以处理所有模型权重。对于每个单词都是如此。这是一大量的\
  \ RAM（例如 52GB），但瓶颈也是数据换入换出的处理成本。而且这发生在它生成的每个单词上。再次，模型压缩似乎是减小模型原始 52GB 大小的关键（例如 8\
  \ 位量化）。\n*   电池耗电和发热。一个拥有 13B 权重的模型在输出每个单词时需要进行 130 亿次乘法。这是一个巨大的消耗，减少资源占用意味着使用上述推理算法优化（例如量化、剪枝、非自回归等）。\n\
  \n在现在的手机上现实地原生运行大模型可能是不可能的。但解决上述的任何一个问题本身就有价值，因为它将减少云端增长的服务器场 GPU 运行 AI 模型的成本，并可能让在桌面级\
  \ PC 上原生运行大模型成为可能。\n\n## 参考文献\n\n1. Mark Gurman, 2024 年 6 月 11 日, Apple’s Push to\
