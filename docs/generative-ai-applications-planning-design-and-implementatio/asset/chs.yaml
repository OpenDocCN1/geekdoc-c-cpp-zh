  \n## 关于贡献者\n\n`Cameron Gregory` 是一位科技创业者，拥有金融科技债券交易初创公司 `BQuotes`（被 `Moody’s` 收购）的联合创始人、`Trademark\
  \ Vision` 的联合创始人兼首席技术官（CTO），该公司拥有基于 AI 的图像搜索产品（被 `Clarivate` 收购），以及包括 `FlamingText.com`、`LogoNut`、`AddText`\
  \ 和 `Creator.me` 在内的几家图像创作公司的创始人。目前金融科技初创公司 `Advan Research Corporation` 的高级数据科学家，专注于对冲基金的“大数据”。\n\
  \n除了写作，他还是一位资深的 AI 研究员，拥有计算机科学博士学位和数十年的专业经验。……（注：此处部分内容与作者介绍重复，已按要求完整翻译逻辑）\n\n\n\
  \n。\n\n（注：由于原文后半部分关于贡献者的介绍存在大量段落重复，翻译时已保持格式一致）\n\n\n\n你对这一新趋势的怀疑态度是正确的，不想成为一家科技公司也是完全合理的。将你的公司转型为开始设计\
  \ GPU 并与 NVIDIA 竞争可能不是一个明智的选择。同样，我并没有建议你成为生成式 AI 所有深度技术层面的专家。请向上看，而不是顺着 AI 栈向下看。\n\
  \n这个决策的关键在于“聚焦”。与其构建低层 AI 能力（例如 `Transformer` 引擎或巨大的 `LLMs`）的核心竞争力，不如关注业务层面的能力以及它们是如何变化的。我的建议是，无论你从事什么业务，都要考虑在你的核心业务领域建立构建垂直特定应用内部的核心竞争力。\n\
  \n这项建议创建 AI 开发能力的根本原因是实现**业务对齐的增长**。如果你的总目标是通过生成式 AI 实现营收增长，那么这个想法主要适用。对于标准的后台自动化，你可能不需要在构建生成式\
  \ AI 应用方面具备竞争力。\n\n如果你使用生成式 AI 的目标主要是降低非战略领域的成本并提高内部生产力，那么情况就是另一了。追求底线收益没有错，也有很多机会实现这一点，但为了实现这一点，你可能不需要成为构建生成式\
  \ AI 应用的专家。后台自动化和员工生产力领域已经有很多供应商为这些领域提供了 AI 解决方案，至少在所有类型业务通用的领域是如此。\n\n## 残酷事实\n\
  \n我对 AI 在商业和消费者用例中的价值持乐观态度。但存在大量的炒作和自大，因此并非事事美好。这里是一些值得思考的负面想法：\n\n*   AI 有时会出错。预料这一点，并学会与之共处。在将\
  \ AI 置于人类无法否决或跳过的地方时要非常小心。\n*   很大比例的 AI 项目是在没有真实目标的情况下开发的，只是为了看起来在做事情（给高管或投资者看）。\n\
  *   `LLMs` 并没有那么聪明。它们的泛化能力不好。像“思维链”（Chain-of-Thought）这样的高级多步推理技术在某些方面更像是权宜之策真正的智能。\n\
  *   如果你构建了一个客户支持机器人，你并不特殊（每个人都有）。糟糕的是，你基于 `RAG` 的客户支持机器人已经过时了（并且需要投入更多）。客户的预期正在提高，而且有更先进的\
  \ `RAG` 方法。\n*   不要掉进兔子洞并假设 AI 可以做一切；它不能。仅仅因为几个测试查询/提示产生了良好的结果，并不意味着你所有的用例都会产生良好的结果。\n\
  *   数据处理、清理和准备仍然是解决你的 AI 项目的首要隐藏成本之一。\n*   不要犯这样的错误，认为下一次大飞跃只有几周/几个月之遥。可能比这长得多。不要在即将到来的事情预期上赌上你的业务。\n\
  *   你的团队今天做的一切都将在 12 个月内过时。或者更早。\n*   正如我们在上面提倡的那样，在你的业务中构建核心竞争力和“AI 平台”真的、非常困难！\n\
  \n对于这些问题，我们没有提供解决方案，但你至少应该充分考虑它们。希望书中能有一些答案。\n\n## 战略步骤\n\n你可能已经做了这些事情中的一些，因为 AI\
  \ 热潮已经持续了一段时间。尽管如此，关于在最高层面应该做什么，这里有一些想法：\n\n*   分配专门的 AI 预算\n*   创建一个“AI 小组”\n*\
  \   建立内部 AI 传道者\n*   聘请首席 AI 官 (`CAIO`)\n\n以下是你的顶层 AI 团队在战略上需要考虑的一些事情：\n\n*   关注损益表顶端或底端的机会（即客户参与与内部生产力的平衡）。\n\
  *   识别现有的竞争优势并用 AI 进行扩展。\n*   在战略上有意图地考虑“购买”还是“自建”。\n*   眼光投向买建之外，考虑战略合作伙伴关系、投资或并购的可能性。\n\
  *   思考在 AI 优先的世界中，谁将控制变化的客户触点。\n*   思考你所有业务数据所在位置的难题。\n*   考虑整合并减少数据存储地点。\n*   了解供应商的\
  \ AI 路线图，以免重复已经在进行的工作。\n*   将安全相关和隐私治理扩展到 AI。\n\n这里是一些更具体的项目步骤，其中一些在后面的章节中会有介绍：\n\
  \n*   寻求顾问建议——不仅是战术上的，还有战略上的！\n*   清点所有的 AI 知识资产以及未来通过新增填补的空白。\n*   识别员工的能力以及重新培训或招聘的需求。\n\
  *   从广度和深度上审查现有数据。\n*   规划未来的数据采集，包括技术问题和用户法律协议。\n*   冲出去并在你的购物车里填满一千个 `GPUs`。\n\
  \n最后一个是一个笑话（还是真的吗？），因为我不希望让你忘记“澳洲式方法”的第二步：每个人偶尔都需要大笑一场。\n\n## 参考文献\n\n1. Nayan Paul,\
