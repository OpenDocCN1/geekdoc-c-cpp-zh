  \ to ‘essential,’ spending jumps 130%`, [`venturebeat.com/ai/enterprise-ai-adoption-surges-as-organizations-shift-from-experimentation-to-implementation/`](https://venturebeat.com/ai/enterprise-ai-adoption-surges-as-organizations-shift-from-experimentation-to-implementation/)\n\
  4. Taryn Plumb, 2024 年 10 月 28 日 , `Gartner predicts AI agents will transform work,\
  \ but disillusionment is growing`, [`venturebeat.com/ai/gartner-predicts-ai-agents-will-transform-work-but-disillusionment-is-growing/`](https://venturebeat.com/ai/gartner-predicts-ai-agents-will-transform-work-but-disillusionment-is-growing/)\n\
  5. Eugene Cheah, 2024 年 10 月 11 日, `$2 H100s: How the GPU Rental Bubble Burst. H100s\
  \ used to be $8/hr if you could get them. Now there’s 7 different places sometimes\
  \ selling them under $2. What happened?`, [`www.latent.space/p/gpu-bubble`](https://www.latent.space/p/gpu-bubble)\n\
  6. Ashu Garg, 2024 年 10 月 25 日, `Why OpenAI’s $157B valuation misreads AI’s future`,\
  \ [`foundationcapital.com/why-openais-157b-valuation-misreads-ais-future/`](https://foundationcapital.com/why-openais-157b-valuation-misreads-ais-future/)\n\
  \n\n\n\n\nAI 是一个如此流行且被过度炒化的术语，我几乎不需要告诉你它代表什么了。现在地球上的每一家公司都自称“AI 公司”，而且它们并不算错。我的意思是，我的面包机在技术上也是一个\
  \ AI 引擎，因为里面到处都有硅，而且它足够“智能”，不会把面包烤焦。\n\n当你成为一家大型科技公司里拿着高薪的 `LLMs` 软件工程师并获得梦想工作时，“AI\
  \ 工程师”这个词是一个用来给孩子面面的头衔。而你的官方职称 `ML Engineer` 就不没那么好了。\n\n不过，这是一把双刃剑。如果你在经销商那里为你的新车讨价，也许最好坚持称自己是\
  \ `ML Engineer`。同样，如果你向一家大型科技公司发送简历，并将“AI 工程师”作为你的职业愿景，他们会把它扔进垃圾桶，并一脸困惑地看着：“菜鸟！”\n\
  \n### 定义\n\nAI 可以意味着你想让它的任何意义，但对于任何大到足以拥有该头衔的人来说，`ML`意味着“机器学习”。`ML` 类别特指某种实际上通过“学习”（例如通过“训练”）来变得更聪明的软件。本书主要涉及的包括：\n\
  \n*   `Transformers`（例如，`ChatGPT` 的“引擎”）\n*   大语言模型 (`LLMs`)（例如，`GPT-3` 或 `GPT-4`）\n\
  *   神经网络 (`NNs`)（即一个“人工大脑”）\n\n深度学习 (`DL`) 这一通用类别是 `ML` 中涉及神经网络的子集。因此，`Transformers`\
  \ 是 `DL` 的子集。其他更具体的 `ML` 类型还包括：\n\n*   计算机视觉 (`CV`）\n*   自动驾驶车辆 (`AVs`） — 自驾驶汽车\n\
  *   产品推荐系统 — 电子商务\n*   机器翻译 (`MT`） — 外语言翻译\n*   内容相关性算法 — 社交媒体推送\n\n展望未来，AI 行业的一些愿景包括以下能力：\n\
  \n*   通用人工智能 (`AGI`) — 人类类推理\n*   人工超级智能 (`ASI`) — 谁知道呢？\n\n#### AI 技术趋势\n\n####\
  \ 多模型 AI\n多模型 AI 已经到来。我们正处于发现将多个 AI 模型组合在一起可以实现什么的早期阶段。这种技术的正式研究术语是“集成”（ensemble）AI。例如，据传\
  \ `GPT-4` 是一个八模型架构，这将推动许多类似项目涌现。随着多模型方法实现更高水平的能力，这反过来将产生对 AI 模型及其底层基础设施的更进一步的需求。这将放大对底层\
  \ AI 引擎优化的需求。\n\n#### 多模态引擎\n多模态引擎。多模态是指 AI 理解文本和图像输入，并同样输出这些内容的能力。`Google Gemini`\
  \ 和 `ChatGPT 4o` 是著名的多模态大模型。这一技术领域才处于旅程的起点。\n\n#### 微调的反击！\n微调的反击！长期以来，业界建议是使用 `RAG`\
  \ 而不是微调。然而，低秩适配器 (`LoRA`) 和“多-LoRA”架构的出现改变了这一点。`LoRA` 架构使得模型微调更加廉价，而且由于内存开销较低，推理速度更快。值得注意的是\
  \ `Apple Intelligence` 的设备端推理基于单个 `3B` 基础模型和多-LoRA，带有数十个可交换的 `LoRA` 适配器。与拥有多个基础模型相比，它的优势是内存占用低，但又针对特定用例具有主基础模型的专门版本的能力。\n\
  \n#### 长上下文\n长上下文。AI 引擎处理更长文本的能力不断提高，无论是在计算效率方面，还是更好的理解和生成结果方面（被称为“长度泛化”）。`GPT-2`\
  \ 的上下文窗口为 `1024` 个，`GPT-3` 为 `2048`，而 `GPT-4` 最初有从 `4k` 到 `32k` 的版本，但在我写这段文字时（2023\
  \ 年 11 月），它已进展到 `128k` 个。一本平均虚构小说从 50,000 字到 200,000 字不等，所以我们正接近让 AI 引擎通过单个提示词生成完整作品的边缘，尽管目前与专业作家相比，质量还相当欠缺。\n\
  \n#### AI 设备\nAI 设备。用户界面中使用 AI 使得替代形式的设计变得可行。硬件设备中 AI 的一些新颖用途包括 `Rabbit R1`、`Humane\
  \ Ai Pin` 和 `Rewind Pendant`。这些初创公司在某些程度上过度，尚未实现其潜力，但我认为人们使用 AI 的方式仍有巨大空间。另一方面，也许手机会胜出，主流的\
  \ AI 界面将是与口袋里的智能 AI 助手 App 进行语音对话。\n\n#### 智能体与多智能体\n智能体是可以办事的 `LLMs`。这意味着访问更多数据源（例如读取你的电子邮件），或为你执行操作（例如发送电子邮件）。数据源智能体在\
  \ `OpenAI` 功能推出后有时被称为“插件”。操作智能体或“写智能体可能需要人类批准，或者可以在无人的情况下运行。数据源和操作智能体都需要大量的工作。`CrewAI`、`Pythagora`\
  \ 和 `Devin` 是带有工具使用的多智能体框架示例。\n\n#### 自主智能体\n自主智能体。还有“自主”类型的智能体，它们在后台持续工作，类似于 `Windows\
  \ services` 或 `Unix daemons`，而不是等待人类请求。自主智能体架构是 AI 引擎、`LLMs` 与数据存储和调度器的结合。\n\n####\
  \ 小语言模型\n小语言模型。尽管巨型基础模型仍然占据着头条新闻，但中小型模型在开源和商业领域变得越来越常见。它们现在甚至了自己的缩写：小语言模型 (`SLMs`)。值得注意的是，`Google`、`Apple`\
  \ 和 `Microsoft` 都加入了 SLM 的行列。`Google` 有它的 `Gemma` 模型，这些可以在低端设备和 `NVIDIA GPUs` 上运行的轻量级模型。`Apple\
  \ Intelligence` 以 `3B` 基础模型作为其设备端 `iPhone` 和 `Mac` 的基础，使用多个 `LoRA` 适配器的优化进行微调。`Microsoft`\
  \ 在这一领域也通过其 `Orca` 和 `Phi` 模型进行了一些工作。`IBM Granite 3.0` 模型面向企业并提供 `3B/8B` 版本。显然 `7B`\
  \ 或 `8B` 现在是“小”的。\n\n#### 专用模型\n专用模型。高质量、专注的训练数据可以消除对单一模型的需求。针对特定任务训练专用模型是有效的，而且成本低得多。预计在医学、金融和其他垂直领域看到这种应用。\n\
  \n#### 数据馈集成\n数据馈集成。AI 引擎无法独立回答所有问题。它们需要访问其他来源的数据，例如互联网或特定的数据库（如房地产列表或医学研究论文）。第三方数据馈可以使用\
  \ `RAG` 架构进行集成。\n\n#### 工具集成\n工具集成。回答某些类型的问题需要集成各种“工具”，AI 引擎可以在用户请求中使用这些工具进行辅助处理。例如，回答“现在几点？”通过训练整个基百科是不可能的，但需要与时钟集成。让\
  \ AI 引擎既知道答案又知道访问工具是一个复杂的工程问题。\n\n#### 对速度的需求\n对速度的需求。目前的问题是 AI 引擎效率太低，需要大量的计算和\
  \ `GPU` 周期。解决方案是研究更快的软件算法和优化技术，以及日益强大的底层硬件。\n\n### 为什么 AI 很慢\n\n为什么 AI 很慢？为什么 AI\
  \ 这么慢？这是一个合理的问题，因为 AI 算法所需的计算能力是传奇级的。训练大模型的成本高得令人望而，而让小模型在开发者的桌面电脑上快速运行也是个问题。\n\n\
  但为什么呢？\n\n\n\n\n\n瓶颈在于基础的乘法。所有的 AI 模型都使用“权重”（weights），这些权重是数字（通常是极小的分数），它们编码了特定特征出现的概率或理想程度。在大型语言模型（LLM）中，它可能编码了下一个单词正确的概率。例如，简单来说，单词\
  \ `dog` 的权重为 `2.0` 意味着该词作为下一个词的概率增加一倍，而 `cat` 的权重为 `0.5` 则意味着输出该词的概率减半。这里的每一个权重都会神经网络的许多节点中与其他概率进行相乘。\n\
  \n有多少次乘法？非常多！我们指的是每次运行时都要进行数十亿次。一个规模为 `3B` 的模型有 30 亿个权重或“参数”，每一个参数都需要乘法才能工作。第一版\
  \ ChatGPT 使用的 `GPT-3` 拥有 1750 亿权重，而 `GPT-4` 显然更多（这是保密信息，但据传的“泄露”显示它是一个由 8 个每个 `220B`\
  \ 参数的模型组成的多模型架构，总训练参数超过 1.7 万亿）。\n\n## 为什么这么多权重？\n\n简短的回答：因为每个权重都代表了一点点智慧。\n\n详细的回答：因为它为每一种组合都拥有权重。简单来说，典型的\
  \ LLM 会维护一个单词的向量表示（称为模型的“词汇表”），其中每个数字都是下一个输出该单词的概率。实际上，情况更复杂，使用了“嵌入”（embeddings）作为单词的间接表示，但从概念上讲，其思想是跟踪单词概率。为了处理这些词标记（或\
  \ `embeddings`），模型有一组“权重”，有时也称为“参数”，在先进的 LLM 中，这些参数通常以十亿计（例如，如今 `3B` 模型被认为是“小规模”的，而\
  \ OpenAI 的 `GPT-3` 拥有 `175B` 个参数）。\n\n### 为什么在我的电脑上运行很慢？\n\nLLM 内部神经网络的每个节点都在其词汇表（嵌入）上进行浮点乘法，并使用权重，通过与权重乘以来增加或减少输出的概率。LLM\
  \ 的每一层中有许多节点需要进行这些计算，而模型中包含多个层，每层又包含另一组这样的节点。这一切仅仅是为了在响应中吐出一个句子中的单词。最终，乘法操作数量的巨大组合爆炸冲击了现实，并压垮了可怜的\
  \ CPU。\n\n## 更大更智能的 AI\n\n尽管 AI 的计算成本是一个巨大的负面因素，但我们不要忘记，这是获得结果的关键。首次将 GPU 用于 AI\
  \ 是一项突破，预示着大模型时代的到来。如果没有这些计算能力，我们就无法发现 LLM 在帮助我们重新整理衣物柜时可以多么口口善辩。\n\n以下是一些在原始参数数量上已经交付的大模型列表：\n\
  \n*   `MPT-30B` (MosaicML) — 300 亿\n*   `Llama2` (Meta) — 700 亿\n*   `Grok-1` (XAI)\
  \ — 700 亿\n*   `GPT-3` (OpenAI) — 1750 亿\n*   `Jurassic-1` (AI21 Labs) — 1780 亿\n\
  *   `Gopher` (DeepMind/Google) — 2800 亿\n*   `PaLM-2` (Google) — 340 亿\n*   `MT-NLG`\
  \ (Microsoft/NVIDIA) — 5300 亿\n*   `PaLM-1` (Google) — 5400 亿\n*   `Switch-Transformer`\
  \ (Google) — 1 万亿\n*   `Gemini Ultra` (Google) — （未知）\n*   `Claude 2` (Anthropic)\
  \ — 1300 亿（未证实）\n*   `GPT-4` (OpenAI) — 1.76 万亿（未证实）\n*   `BaGuaLu`（天威，中国） — 174\
  \ 万亿（不是拼写错误）\n\n注意，并非所有这些参数计数都是官方的，有些基于传闻或第三方的估算。此外，这里列出的某些计数并非同类比较。例如，Google 的\
  \ `Switch Transformer` 是一种不同的架构。\n\nAI 模型的通用规则仍然是：越大越好。如果你正在向投资者推销你惊人的新 AI 基础模型，它的参数数字后面最好带一个“B”（例如\
  \ `70B`），很快你就需要一个“T”了。现在所有主要的科技公司都在谈论万亿参数模型。\n\n“越大越好”的规则现在有些微妙。例如，注意 Google 的 `PaLM`\
  \ 版本 2 参数（`340B`）少于 `PaLM` 版本 1（`540B`），但能力更强。看起来，几百亿参数对于任何用例来说已经足够了，在该水平上，训练质量的价值更高。\n\
  \n此外，训练更大的模型前提是你有数据喂给它。数万亿 token 输入数据的可用性开始成为行业的限制因素。\n\n另一个变化是多模型架构的出现。值得注意的是，传闻中的\
  \ `GPT-4` 架构接近两万亿参数，但并不是在一个模型中。相反，新架构（显然）是一个八模型架构，每个模型具有 `2200 亿` 参数，采用“专家混合”架构，总计有\
  \ 1.76 万亿参数。再次，看起来几百亿参数就足以获得高质量的结果。\n\n我们才处于多模型浪潮的开始，这种技术被称为“集成架构”（ensemble architectures）。\n\
  \n## 更快的 AI\n\n尽管 AI 的计算成本是一个巨大的负面因素，但我们不要忘记，这是获得结果的关键。首次将 GPU 用于 AI 是一项突破，预示着大模型时代的到来。如果没有这些计算能力，我们就无法发现\
  \ LLM 在帮助我们重新整理衣物柜时可以多么口口善辩。\n\n有很多方法可以让 AI 引擎运行更快。简单的方法是使用更多 GPU，这可能一直是迄为止的主流优化方案。然而，公司无法永远按照这种模式经营下去，而且，我们需要更强大的动力来运行超级先进的新架构，例如正在出现的多模型\
  \ AI 引擎。\n\n\n\n\n\n# AI 需要算法层面的改进，以控制资金和环境影响两方面的计算成本。整个行业正在快速演进和进步，以提供更快、更高效的硬件和软件，来应对不断增长的模型。\n\
  \n但你可以把钱留着去加拉帕戈斯群度假了：`code it yourself`。整本书概述了通过优化的数据结构和算法来应对工作负载的许多方法。\n\n人类的智慧也在寻找新的解决方案，字面上已有数千篇关于如何更快地运行\
  \ AI 引擎的研究论文。模型持续增长到数万亿参数，似乎是解决计算问题的暴力破解方案，目前有许多方法正在被考虑，以更少的资源实现相同的结果。多年年来，其中一些想法已经进入了商业和开源引擎，但仍有许多想法等待测试和探索。\n\
  \n# AGI（通用人工智能）\n\n通通用人工智能（AGI）的竞赛已经全面展开。拥有高度智能的大语言模型（LLMs）似乎是可能的，但也有一些怀疑的理由。看好\
  \ AGI 的一些理由包括：\n\n*   暴力破解通常会获胜——这被称为“惨痛的教训”，指的是计算机击胜人类通常不是通过使用更聪明的算法，而是仅仅通过用简单的算法在计算量上胜过我们。\n\
  *   基准测试的快速进展——观察任何 LLM 单几个月，总会有新模型表现更好。\n*   多模态能力——有很多新模型可以处理涉及图像、视频和语音的输入与输出。\n\
  \n并不是人都认为 LLM 可以实现 AGI。在一种理论中，LLM 被比作我们的潜意识，而我们需要另一种能够镜像我们理性的意识大脑的东西，它将与 LLM 结合，产生类人类的\
  \ AGI。LLM 有很多局限性，但实现 AGI 的一些主要障碍包括：\n\n*   推理困难——LLM 难以将信息泛化到更复杂的任务或概念上相似的任务中。\n\
  *   缺乏持续学习——LLM 目前无法从对话或阅读过的文章中学到任何新知识。LLM 字面上上会遗忘它读过的所有内容。\n\n总的来说，LLM 非常擅长记忆和背诵。实际上，这都是模仿。它真的会变成真实的吗？\n\
