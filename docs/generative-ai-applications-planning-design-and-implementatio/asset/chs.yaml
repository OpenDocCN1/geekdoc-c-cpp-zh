  \ [`arxiv.org/abs/2410.22071`](https://arxiv.org/abs/2410.22071), [`github.com/technion-nlp/mitigation`](https://github.com/technion-nlp/mitigation)\n\
  2. Garanc Burke, Hilke Schellmann, 2024, *AI-powered tool used in hospitals invents\
