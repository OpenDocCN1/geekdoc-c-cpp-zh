  ## 速度研究\n## 安全研究\n## 内核优化\n## 加速器\n## 关于推理的参考文献\n\n### 前言\n\nAussie AI 研究的主要重点是优化\
  \ LLM 推理算法（即在训练或微调后运行模型），我们的研究旨在以下目标：\n\n* 快速的设备推理算法，特别是针对智能手机和 AI PC。\n* 将推理算法扩展到大规模应用。\n\
  * 高效的 GPU 推理算法（硬件加速）。\n* 非 GPU 推理算法（软件方法）。\n\n### 声明：极少作者身份\n\n尽管我们参与了 AI 行业，但在创建本书文本或任何相关代码时，几乎没有使用\
  \ AI 引擎。部分文本使用了 Aussie AI 的编辑工具进行分析和审查，但没有一个段落是由任何生成式 AI 引擎自动创建的。\n\n然而，AI 也以多种方式使用。AI\
  \ 辅助搜索工具（如 `Bing Chat with GPT-4`）在头脑风暴主题和研究某些技术问题时非常有用。主封面的小龙图像是使用 AI 生成的，随后经过了人工编辑。\n\
