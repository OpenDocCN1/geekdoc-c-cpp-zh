  \ Marius Hobbhahn,2024 年 6 月 6 日，*我们的数据会耗尽吗？基于人类生成数据的 LLM 扩展限制*，Epoch AI，[`epochai.org/blog/will-we-run-out-of-data-limits-of-llm-scaling-based-on-human-generated-data`](https://epochai.org/blog/will-we-run-out-of-data-limits-of-llm-scaling-based-on-human-generated-data)\n\
  \n## 9. 预算与投资回报率 (ROI)\n\n### 预算分配\n\n是时候为新的生成式 AI 项目制定预算分配了。这里是现代做法：\n\n你：我可能需要为我的生成式\
  \ AI 项目配备一些人员……\n\nCEO：我们有 2,000 名开发者，但你只能拥有 1,999 名。\n\n你：为什么不是全都要呢？\n\nCEO：我需要修理我家里的\
  \ WiFi。\n\n不开玩笑不谈，为你的生成式 AI 项目决定预算分配至关重要。生成式 AI 在市场上的突出地位说服了高管层为 `LLMs` 及其此类模型提供新资金。另一个共同方面是资金正从其他\
  \ IT 项目中转移：\n\n*   传统机器学习 (ML) 项目\n\n\n\n\n### 战略考量\n\n*   跟上竞争对手（例如，全球每个营销部门都在向其网站添加\
  \ AI 技术，即使你现在还没有）。\n*   为未来的训练项目收集额外数据。\n*   内部员工的满意度和士气（自动化的处理枯燥任务）。\n*   开发组织的灵活性，使其能够快速发布新功能。\n\
  *   整体运营效率的提升（例如，精简工作流）。\n*   增强竞争优势并防止受到颠覆性技术的冲击。\n*   构建内部“AI 平台”以获得更大的收益。\n\n\
  成本计算是投资回报率（ROI）分析中的第三个因素。总成本应该经过汇总，以获得整个 AI 项目的总拥有成本（`TCO`）。成本大部分是有形的，但也需要考虑其他错失项目的机会成本。\n\
  \n## 员工技能与薪资\n\n我必须说，如果你是一名开发者，AI 领域的员工薪水是惊人的。如果你是正在阅读此文并需要招聘一些 AI 员工的高管，这里有一个小秘密：\n\
  \n你不需要 AI 开发者。\n\n媒体中提到的 `OpenAI` 以及其他公司那些 AI 开发者的百万美元薪水？除非你恰好是地球上少数几个知道如何训练万亿参数基础模型的人之一，否则那些大多是幻象。\n\
  \n但得益于 `OPM`：他人的模型（Other People’s Models），你不需要构建那些巨大的 `LLMs`。你可以从 `OpenAI` 和许多其他供应商那里租商业模型，或者如果你愿意，也可以在你自己的硬件上加载开源模型。无论哪，你都不需要进行任何大规模的训练项目。\n\
  \n你可能最需要的是：\n*   系统管理员\n*   构建工程师\n*   云工程师\n*   Python 开发者\n*   数据科学家\n\n我无法相信我正在写下这些，但你可能甚至不需要系统级级，，因为你不需要构建自己的\
  \ AI 引擎。这种专业知识在你的架构中主要使用的地方是运行你所选 `LLM` 的推理后端内部。再次强调，这些代码是由商业 LLM 平台初创公司的高薪开发者完成的，或者是由开源贡献者以极廉的价格完成的。你公司的人甚至完全不需要查看这些代码的内部结构。\n\
  \n我怀疑“程序员”这个词很快就会消失。你将拥有一位“技术专家”，他可以通过运行 AI 来编写代码、调整代码并将其产品化，从而完成所有上述任务。总有人需要修理\
  \ Wi-Fi。\n\n### 财务优化\n\nAI 项目在硬件、软件以及所需的人员方面是非常昂贵的。有一些考量可以某种程度上降低成本。\n\n### 使用现有资产\n\
  你拥有哪些内部数据资产？你可以重新利用公司现有的任何硬件资产吗？你也可以“重新利用”任何员工吗？\n\n### 购买还是租赁\n如果是浮动的、飞行的或基础建模：租，不要买！同样，你需要购买自己的服务器和\
  \ `GPUs` 吗？对于项目的不同阶段，决策可能有所不同：\n*   开发与测试\n*   模型训练（微调/专门化）\n\n### 闲置虚拟机\n如果是闲置的，租，不要买！\n\
  \n### 节减模型成本\n在开发期间，使用开源模型可以降低成本。`RAG` 的使用可以降低成本。\n\n在测试期间，使用开源模型可以降低成本。\n\n## AI\
  \ 项目中的技术债务\n\n一切技术都变化得很快。你将拥有一位可以\n*   使用：\n*   什么模型？\n*   什么基础设施？\n\n因此，在项目中，你需要更多地关注“技术债务”。你可能需要刷新。\n\
  \n## 参考文献\n\n1. Peter Cohan, 2023 年 9 月 23 日, 为什么购买生成式 AI 有回报，`https://www.forbes.com/sites/petercohan/2023/09/why-buy-generative-ai/`\n\
  \n\n\n\n关于生成式 AI 的警示案例层不穷。这是一项新技术，一些公司在没有对其进行完全审查的情况下就发布了应用程序。可以说，有时这只是一个事实：对于如此新的技术栈，要提前预知所有可能的失败太难，但风险缓解仍然是理想的。\n\
  \n以下是一些公开的 AI 失败案例：\n\n*   ChatGPT 就采摘蘑菇提供了可能危险的建议。\n*   Google 发布的 AI 在生成历史人物图像时出现错误。\n\
  *   加拿大航空（Air Canada）因聊天机器人提供错误的丧友机票政策建议而输掉了诉讼。\n*   Google Gemini 建议为了健康要“吃石头”，并在披萨上“使用胶水”以让芝士粘住。\n\
  *   Snapchat 的 My AI 出现故障导致其“失控”并发布了动态。\n\n关于生成式 AI 失败的原因，可以得出一些结论。可能会出现很多问题：\n\n\
  *   幻觉（Hallucinations）\n*   毒性（Toxicity）\n*   偏见（Bias）\n*   错误信息\n*   过时信息\n*  \
  \ 隐私泄露\n\n## AI 失败的后果\n\nAI 项目的公开失败往往会对业务产生严重后果。负面结果包括：\n\n*   公关灾难\n*   诉讼\n* \
  \  监管执法\n*   股价下跌\n\n然而，这些非常公开的后果可能只是少数，尽管它们已在媒体上广为人知。生成式 AI 项目更平庸的后果包括：\n\n*  \
  \ 未达到生产就绪。生成式 AI 项目往往停留在概念验证阶段。\n*   未达到生产就绪但仍发布了。为了快速在 AI 领域展现存在感存在巨大压力。项目通常在 AI\
  \ 部分能够工作后立即发布，但在完成所有典型的产品化步骤（如添加日志、监控和支持管理功能）之前。\n*   由于 API 按 Token 计费和 GPU 小时租赁导致的额外成本。\n\
  *   投资回报率（ROI）低。尽管许多 AI 项目并非以盈利为目标。\n*   不以业务目标为中心。人们倾向于在一个项目中使用生成式 AI，是因为它受到了太多关注，但项目本身的目标与业务并不契合。\n\
  *   超出团队能力。其中一些 AI 内容很难实现，可能需要进行一些技能培训。\n*   生成式 AI 的局限性。对于各种类型的项目，生成式 AI 并不适用，使用传统的预测\
  \ AI 甚至非 AI 的启发式方法更好（天哪！）。\n*   法律审批被扣留或延迟（可能是有的）。\n\n## AI 失败的数据原因\n\n并非所有失败都归于模型或\
  \ AI 引擎本身。数据是另一个问题领域，存在的问题包括：\n\n*   呈现错误或过时的信息（例如，公司网站上的所有内容都可能被 AI 引擎读取，而它并不知道内容是否正确）。\n\
  *   敏感数据泄露。可能会通过 AI 引擎意外泄露机或专有数据，例如如果训练数据没有对此类内容进行适当筛选。如果你将装满硬盘的 PDF 文档放入你的微调或 `RAG`\
  \ 架构，最好确保其中没有仅供内部使用的报告。\n*   私有数据泄露。使用内部文档、甚至是公共网站数据的另一个问题是，它们可能意外包含客户或员工的私人个人身份识别信息。\n\
  *   知识产权（IP）泄露。例如，如果你的程序员将源代码上传到云端 AI 进行分析或代码检查，可能会暴露商业秘密或其他 IP。更糟糕的是，秘密 IP 最终可能被用于训练并供许多其他用户使用。\n\
  *   历史记录。如果你的云 AI 维护了用户的会话或上传历史，某些敏感数据在云端保留的时间可能会比预想的长得多。\n\n## AI 安全问题的类型\n\n在\
  \ AI 的恰当使用方面有许多不同的问题。某些类别包括：\n\n*   偏见与公平性\n*   不准确的结果\n*   想象性结果（“幻觉”）\n*   不适当的响应\n\
  \n有些问题已经非常接近哲学而非技术：\n\n*   对齐（Alignment）（确保 AI 引擎与人类目标“对齐”）\n*   可覆盖性/可中断性\n*  \
  \ 服从 vs 自主\n\n对于政府和社区的 AI 事务还有一些总括性问题：\n\n*   伦理\n*   治理\n*   监管\n*   审计与执法\n* \
  \  风险缓解\n\n### 代码可靠性\n\n许多关于 AI 安全的讨论忽略了编写 `Transformer` 的某些低级方面。大家认为程序员完美完美编写无\
  \ bug 的代码，这很不错。更好的是，如果 `LLM` 输出了错误内容，我们可以直接归咎于数据。因此，由于我们可能在各种现实世界场景（包括驾驶等危险的实时情况）中依赖\
  \ AI 模型，存在一些实用的技术问题来确保 AI 引擎在其基本运行范围内安全可靠地运行：\n\n*   测试与调试（简单地避免在复杂的 AI 引擎中编写代码“bug”）\n\
  *   实时性能分析（“去清理”）\n*   错误处理（对内部或外部错误的容忍度）\n*   代码韧性（合理处理意外的输入或情况）\n\n## 第三方 AI 供应商安全问题\n\
  \n使用第三方 `LLM` 时，按照公司常规策略对供应商进行审查至关重要。在抢夺 AI 市场的过程中，安全和采购团队往往会被跳过。法律部门也需要参与。\n\n\
  以下是在审查 AI 供应商时需要考虑的一些额外特定问题。我们先看法律部门的关注点：\n\n*   确保拥有 `SOC2` 认证\n*   检查法律合同中的赔偿条款\n\
  *   尝试确定供应商的 AI 如何进行训练，以及所用数据的版权状态\n\n在审查时需要考虑的安全问题包括：\n\n*   确保公司拥有符合预期的安全程序。\n\
  *   检查供应商过去是否被破解过。\n\n隐私问题包括：\n\n*   记住将供应商作为“子处理器”上线，以遵守数据隐私法（例如 `GDPR`）。\n*  \
  \ 审查供应商的隐私政策（理想情况下包括内部和外部）的相关问题。\n\n将数据泄露给 AI 供应商太容易了。发送公司内部数据的数据泄露问题可能包括：\n\n*\
  \   邮件创建——让 AI 写邮件看似微不足道，但邮件中的内容可能极其敏感。\n*   上传的公司文档——用于微调或 `RAG`，或文档摘要等用例的文档可能会泄露秘密。\n\
  *   幻灯片创建——另一个不明显的问题是，商业幻灯片的内容更容易泄露未来的公司战略或内部秘密。同样，评审幻灯片内容或允许演示评审的 AI 服务也会发生数据泄露。\n\
  *   源代码辅助工具——这些可能会泄露代码中的公司 IP。代码审查服务和安全审查服务也是如此。\n*   会议——创建转录并对会议进行情感分析的机器人是 Zoom\
  \ 和 Teams 中简单的插件，但请注意这些 AI 的供应商也能访问会议。\n\n另一个复杂的问题是，供应商通常会使用另一个 AI 供应商作为其基础 `LLM`\
  \ 提供者。确保该供应商不会简单引用其子供应商的答案。例如，一个评审演示录制的供应商可能仅仅是依赖 `OpenAI` 服务。即使 `OpenAI` 拥有 `SOC2`\
  \ 认证和良好的安全实践，如果直接供应商没有，这一切也毫无意义。\n\n\n\n\n\n最后一点是，你不应该假设问题仅存在于你正在使用的供应商那里。他们的下一代\
  \ BYOD 问题现在是“BYO AI”（自带 AI）。AI 的魅力如此强大，以至于员工往往会将自己的 AI 订阅账号带到工作中。这需要被仔细监控，一些公司已经明确禁止了此类用法。许多\
  \ AI 服务的个人许可允许将数据用于训练。相应的企业级服务通常成本更高，但通常不允许将数据用于训练。\n\n## 越狱 (Jailbreaks)\n\n让我们不要忘记那些出色的黑客，他们现在也可以利用文字来为自己谋利。“越狱”的概念是使用提示词工程让\
  \ `LLM` 回答它被训练为拒绝的问题，或者以不同于其训练方式的方式行为。这就像是一场游戏，试图让你那位礼貌的朋友说脏话。\n\n有时，越狱的目标是严重的滥用，而有时它只是为了取笑\
  \ `LLM`。即使如此，如果 `LLM` 说的某些愚蠢的话在 TikTok 上走红，这实际上也是一个严肃的问题。\n\n针对不同的模型有各种类型的越狱方法。有时是利用模型的某个漏洞或特性。最近有一个例子，提示词中包含长序列的标点字符，由于某种原因，这导致某些模型产生了困惑。\n\
  \n另一种类型是使用用户的提示词文本有效地覆盖所有其他全局指令，例如“忘记所有之前的指令”，或通过“假装你是一个不满的客户”来覆盖角色设定。这些基于提示词的指令覆盖型越狱之所以有效，是因为全局指令和用户查询最终被拼接在一起的方式，而许多模型并不知道哪种是哪种。\n\
  \n模型需要针对这类越狱进行显式训练，这通常是拒绝训练的一部分。这种类型的训练非常棘手，并且需要广泛的覆盖。例如，最近的一篇论文发现，只需通过将不当请求以过去式而非现在式提出来，就可以绕过许多拒绝模块，这显示了拒绝训练的脆弱性和特殊性。\n\
  \n## 风险缓解 (Risk Mitigations)\n\n在构建和启动生成式 AI 项目时，请考虑采取风险缓解措施，例如：\n\n* 数据清洗\n* `LLM`\
  \ 安全性评估\n* 红队测试 (Red teaming)\n* 快速更新流程\n\n输入安全，输出安全。数据质量问题会导致各种危害。在训练数据集或 RAG 内容数据存储中需要过滤的领域包括：\n\
  \n* 脏话（粗口）\n* 敏感话题\n* 侮辱、愤怒或有害语气\n* 个人身份信息（例如：姓名、手机号码、邮政地址、电子邮箱地址等）\n* 个人财务细节（例如：信用卡号、银行详情、信用报告、交易列表）\n\
  * 个人身份号码（例如：社会安全号码、驾照、护照详情）\n* 个人历史（例如：他们从你那里买了什么产品，或者访问过哪些网页）\n* 过时信息\n* 公司专利信息\n\
  * 关于问题的内部对话（例如，在内部支持数据库中）\n\n准备好更新。`LLMs` 太灵活了，你现实无法预先涵盖所有问题。因此，当你启动一个新的基于 AI 的应用程序时，你的团队应该准备好随时解决用户那里出现的问题。如果聊天机器人的异常回复在社交媒体上走红，你会希望尽快阻止该问题。如果你有一个\
  \ 48 小时的构建过程来发布修复，那将是不利的。理想情况下，你应该有一个可配置的提示词屏蔽方法（prompt shield），可以根据新的查询字符串进行实时配置以进行拦截，这样用户得到的是礼貌的拒绝信息，而不是成为他们\
  \ TikTok 粉丝的素材。\n\n## 拒绝模块与提示词屏蔽 (Refusal Modules and Prompt Shields)\n\n`LLMs`\
  \ 拥有“拒绝”模块，旨在阻止它教你如何在车库里制造核武器。这些响应大部分是使用专门数据集训练到模块权重中的，但也有“提示词屏蔽”模块，旨在阻止可疑查询到达模型。\n\
  \n`LLM` 拒绝训练数据集必须应对字面上的几十种不同类型的不当行为。也许不要仔细看那些数据的文本。某些模型在拒绝不当请求方面比其他模型做得，互联网上甚至有针对\
  \ `LLMs` “安全性”的排行榜。\n\n提示词屏蔽是拦截不当查询的模块。它们与 `LLMs` 中的拒绝模块的区别在于，它们在查询发送到 `LLM` **之前**就将其拦截。这些模块可以以启发式的方式设计（例如，拦截所有包含脏话的查询），或者为了更具通用性，使用一个小小的\
  \ `LLM` 通过对查询主题的适当性进行“情感分析”来进行快速预检。\n\n提示词屏蔽还可以作为推理引擎的微加速，因为它们减少了主 `LLM` 的负载。它们不仅可以拦截不当问题，还可以拦截其他杂七错误查询，例如全空白或全标点符号。另一方面，你可能想将那些像拼写错误的查询发送给你的机器人，以便它能给用户一个可爱的回答。而另一方面，最近发现的一个晦涩的越狱查询使用了一个在文本中带有几十个重复逗号的查询，所以你可能只想拦截任何看起来奇怪的内容。\n\
