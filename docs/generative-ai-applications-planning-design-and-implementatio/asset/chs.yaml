  11. Nicholas Carlini, 2024-08-01, 我是如何使用“AI”的，[`nicholas.carlini.com/writing/2024/how-i-use-ai.html`](https://nicholas.carlini.com/writing/2024/how-i-use-ai.html)\n\
  12. Christopher Tao, 2024 年 8 月, 在这些用例下不要使用 LLM 或生成式 AI，[`pub.towardsai.net/do-not-use-llm-or-generative-ai-for-these-use-cases-a819ae2d9779`](https://pub.towardsai.net/do-not-use-llm-or-generative-ai-for-these-use-cases-a819ae2d9779)\n\
