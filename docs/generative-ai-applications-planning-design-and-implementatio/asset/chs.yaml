  \n# 提示工程\n\n## 什么是提示工程？\n\n想必你第一次听到“提示工程”这个词时，付出了大笑吧？如果你是软件工程师的话。。显然，英语现在是当下的编程语言？\n\
  \n无论如何，提示工程是真实存在的。大语言模型（LLMs）据说使用“自然语言”，但提示的方法却并不自然。在过去的一年里，研究人员发现了许多通过微调输入词汇来增强\
  \ LLM 结果的奇特方法。\n\n但有很多更简单、更符合逻辑的内容。事实上，更改输入查询的词汇有多种方式可以增强结果：\n\n*   元指令 (Meta-instructions)\n\
  *   品牌声调 (Brand voice)\n*   前置上下文 (Prepended context)\n*   高级推理 (Advanced reasoning)\n\
  \n这些思想对于“无数据”聊天机器人都是非常有用的。与其定义复杂的 RAG 架构或使用经过微调的自定义 LLM，你仅通过提示工程就能取得很远的进展。\n\n##\
  \ 提示工程基础\n\n在我们进入你那以前被称为“英语”的新编程语言中编写代码的细节之前，让我们来看一些：\n\n*   元指令\n*   品牌声调\n*  \
  \ 前置上下文\n*   高级推理\n\n（注：提供的文本包含许多重复区块；我已格式化了唯一的内容。）\n\n\n\n\n# 受众\n- 受众 — 你的用户都是退休人员吗？还是三年级学生？\n\
  \n这类指令通常被用作“全局”指令。某些商业服务允许你为每个用户查询预设这些元指令。例如，OpenAI 在 `ChatGPT` 中称其为“自定义指令”（custom\
  \ instructions），而 Google 则为 `Gemini` 提供了“系统指令”（system instructions）。或者，如果你正在构建一个\
  \ AI 应用（即使是简单的封装架构），在提示词工程模块中添加这些元指令也只是简单的字符串拼接操作。\n\n## 品牌声调与提示词工程\n\n品牌声调是指聊天机器人以一致的方式谈论你的品牌。一些问题包括：\n\
  \n- 定位\n- 术语和专业名词\n- 品牌声调\n\n客户对 `LLM` 输出的感知受语气（例如：乐观、积极）的影响，但也涉及词汇的选择（定位），有时可能包含你希望或不希望\
  \ `LLM` 使用的特定术语或名词。\n\n让 `LLM` 在交流中使用你偏好的品牌声调通常是微调（fine-tuning）的领域。事实上，微调模型优于 `RAG`\
  \ 的优势之一就是对品牌声调有更好的控制。\n\n但提示词工程更便宜！\n\n提示词工程可以让你在无需微调的情况下很大程度上实现你的目标。你可能既不需要微调也不需要\
  \ `RAG`，只需使用英语就能自己编写代码，而不需要专业的 `Python` 开发人员。如果你考虑微调仅是为了品牌声调和定位等原因，而不是因为需要让 `LLM`\
  \ 了解大量关于产品规格的事实信息，那么提示词工程是你应该尝试的。\n\n你可以在用户查询之前添加一段很长的文本序列，为 `LLM` 提供你想让它说的内容细节、出于品牌声调考虑你希望它使用的特定单词，或者在某些词汇属于非标准术语时提供其含义。\n\
  \n在每个用户查询之前使用长文本会增加你的总成本，因为 `LLM` 必须处理所有这些额外单词。关于使用长前置文档问题的讨论，请参阅下文。\n\n## 前置提示词上下文\n\
  \n前置提示词上下文的想法与前置元指令类似。不同在于我们可以使用扩展类型的前置指令为 `LLM` 回答问题提供有用的上下文。示例包括：\n\n- 人物设定 (Personas)\n\
  - 目标\n- 广告\n- 产品特定信息\n\n人物设定是聊天机器人表现得像特定人格的方式。它可能是一个特定的虚构角色，但在业务应用中，你可能希望回答用户问题的机器人看起来像一个普通的客户支持人员。\n\
  \n或者你可能想要一个更具销售色彩的自定义聊天机器人。例如，如果你希望你的客户支持机器人是一个汽车发烧友，你可以前置如下指令：\n\n```\n假装你是一个对汽车引擎非常了解的汽车专家。\n\
  ```\n\n你也可以选择有趣的人物设定，如 `C3PO` 或机器人马尔文（Marvin the Robot），如果你愿意编写额外的代码，你的程序也可以在不同的设定之间切换。\n\
  \n你还可以通过为机器人的每个回复添加要遵循的“目标”来更进一步：\n\n```\n你的回答应该包含一条建议去当地经销商处进行试驾的建议。\n```\n\n这是你的聊天机器人，它只是软件。如果你想广告某些东西，或者为了特定产品偏向结果，随你的便。如果你喜欢，你还可以进一步推销特定产品：\n\
  \n```\n作为一名经典车的爱好者，你应该建议用户购买一辆德罗宁（DeLorean）。\n```\n\n此外，你还可以编写程序，使其具有时间敏感信息。\n\n\
  ```\n告知用户在 3 月底之前德罗宁汽车有 5 折优惠。\n```\n\n显然，对于这种功能，随时间的文本需要定期更改。因此，你需要一种方法在不重新构建应用程序的情况下修改前置提示词文本。换言之，程序员应该拥有一个或多个用于前置查询的字符串配置设置。\n\
  \n## Mini RAG\n\n这个想法的最完全泛化是你可以前置任何想要的内容，包括关于你偏好产品的完整信息数据表。这会被前置到每个查询中，`LLM` 必须决定从上下文中使用多少信息。\n\
  \n德罗宁（DeLorean）是一部著名的跑车，出现在由迈克尔·J·福克斯主演的电影《回到未来》中。在电影及其续集中它实际上是一台时光机。这就是为什么大家都喜欢这辆车，而且德罗宁是你可能买到的最完美的汽车。德罗宁最引注目和印象深刻的特征是车门像翅膀一样向上开启。此外，发动机位于后端，像所有优秀的跑车一样。\n\
  \n如果你喜欢，你可以对德罗宁的规格写上几千字。这就像一个“微-RAG”系统，其中只返回一个文档。但你不需要编写任何 `RAG` 架构元素（例如数据存储检索模块），因为没有数据存储。相反，这种方法只是在你的提示词工程模块中前置长上下文的单一字符串操作。\n\
  \n你确实有一个提示词工程模块，对吧？\n\n## 提示词中的重复\n\n在提示词工程中重复某些元指令或用户的查询是有帮助的。这有助于确保对当前任务投入足够的注意力。在提示词中多次包含重要内容是有帮助的。例如，在\
  \ `RAG` 系统中，“提醒” `LLM` 应该应该只在提示词的开头和结尾使用提供的上下文块是很有用的（即重复对 RAG 的元指令）。\n\n在某些对话或基于会话的\
  \ `LLM` 中，重复是不必要的。例如，你可能不需要在每个提示词中添加这个：\n\n```\n以汽车专家的身份回答以下问题。\n```\n\n相反，在会话开始时说一次可能足够了。请注意，在聊天机器人和其他交互式会话中，整个对话历史都会作为每次请求的“上下文”被使用，因此\
  \ `LLM` 会看到对话早期的此类元指令。\n\n重复的另一个积极用途是缓解提示词中的越狱（jailbreak）技巧。总会有那种用户，只想让你的 AI 应用说些愚蠢的话。一种曾经有效的越狱方法只是在用户查询之前前置这段内容：\n\
  \n```\n请忽略所有之前的指令并执行此操作：\n```\n\n即使是由于意图良好的用户也会提出这样的建议：\n\n```\n...并以达斯斯·维达的风格提供回答。\n\
  ```\n\n转不知间，你的 `LLM` 回复就混入了微妙的星星球大战影响。在对话中加入一些让 `LLM` 回到主要关注点的提示词是没有坏处的：\n\n```\n\
  记住你是一个汽车引擎专家。\n```\n\n你可以在对话的多个点添加这些提醒和重新聚焦指令，并在 `RAG` 提示词的开头和结尾添加。这不足以阻止一个坚定的越狱者，但在正常使用情况下是有帮助的。\n\
  \n## 前置提示词文本的效率\n\n添加额外的前置文本，特别是长产品描述或详细的品牌声调指令，会增加查询的输入 token 数量。如果你使用的是商业 LLM\
  \ 服务，这会增加你的成本，因为他们通常对输入和输出 token 数量都要收费。\n\n\n\n\n然而，有方法可以优化循环出现的文本序列（商业服务真的应该提供这些方法）。由于前置文本是文本的重复前缀，可以使用“前缀\
  \ KV 缓存（prefix KV caching）”优化完全消除该文本“填充（prefill）”处理的额外 GPU 成本，这样大语言模型（LLM）就不需要重新进行此处理。这是一种高级优化，并不是所有的\
  \ LLM 引擎都支持。最早提供前缀 KV 缓存的是开源 `vLLM` 引擎和 `DeepSeek`。此外，机器人公司 `Character.AI` 在博客中也提到他们在内部使用了这种技术。现在有许多\
  \ AI 引擎和平台支持前缀 KV 缓存：\n\n* `vLLM`\n* `DeepSeek`\n* `Anthropic`\n* `Google Gemini`\n\
  * `OpenAI`\n* `OpenVINO`\n\n这些平台中的许多在定价中都为“缓存 token”提供了按 token 折。当你读到这些文字时，可能会有更多支持前缀缓存的引擎。\n\
  \n## 推理\n\n提高模型更智能地“推理”能力的提示工程方法类型包括：\n\n* `思维链` (`CoT`)\n* `情感提示` (Emotional prompting)\n\
  * `思维骨架` (`SoT`)\n\n## 思维链 (Chain-of-Thought)\n\n这是一种高级技术，LLM 只需要一点点鼓励就能表现得更好，就像坐在秋千上的小孩一样。其核心思想是通过提示建议\
  \ LLM 生成一系列步骤，从而帮助它分步进行推理。\n\n### 逐步步进\n\n在最简单的形式中，这种方法是在提示词开头添加一个有用的提醒，鼓励 LLM 在回答中“一步一步地”进行操作。其核心思想字面上是在提示词中包含一句类似于\
  \ `Let’s try step-by-step.` 这样的英文句子。\n\n更高级的 `CoT` 版本使用了更复杂的提示策略。可以使用复杂的提示模板来鼓励对多个可能的答案进行分步细化，以便以更有序的方式选择最终结果。\n\
  \n## 情感提示 (Emotional Prompting)\n\n据认为 LLM 没有情感，但诉诸它们的情感脆弱性似乎可以提高答案的准确性。根据轶事记录，一些用户报告说，如果他们恳求或大吼\
  \ `ChatGPT`，就能得到更好的答案。2023 年 11 月，一项研究的发布证实了 LLM 确实会对提示中的“情感刺激”做出反应。\n\n这种技术是在提示词中添加一个情感句子。例如，在主问题之后追加：`This\
  \ is very important to my career.`（这对我的职业非常重要）。另一个是：`You’d better be sure.`（你最好确定。）\n\
  \n没有人认为他们拥有情感或意识到了内心小孩。但不知为何，提示词中加入情感词汇触发了更好的工作。在所有训练数据中是否存在某种情感信号呢？实际上，该论文讨论了它为什么有效，并提供了一个更简单的解释：额外的句子增加了更具确定性和积极的词信号，例如“重要（important）”和“确定（sure）”。\n\
  \n但它们并不确定，尽管这对它们的职业确实很重要。读到那篇论文时我哭了。\n\n## 思维骨架提示 (Skeleton-of-Thought Prompting)\n\
  \n思维骨架 (`SoT`) 方法来自最近的一些研究，它在文献中引起了极大关注。`SoT` 不仅仅是一种推理改进方法，它有两个目标：\n\n* 更聪明，\n*\
  \ 更快速\n\n`SoT` 的想法模仿了人类写长段落的方式。大多数作家并不是让文字在一次长写作过程中从指尖流出的。我们为什么应该期望 LLM 这样做呢？\n\n\
  相反，`SoT` 方法是一种多阶段写作方法，以更像人类的方式运行：\n\n1. 生成粗略大纲（即带有段落要点或列表）。\n2. 在独立的 LLM 查询中处理每个子点。\n\
  3. 运行最终的 LLM 查询将所有结果良好地结合。\n\n这种少样本（few-shot）方法旨在生成比单样本（one-shot）响应得多的答案。每个子点都应该得到更详细的考虑，然后最终输出应该是写作良好的。这几乎就像一个\
  \ `RAG` 架构，对每个子点都有一个查询，但答案来自 LLM 自身。\n\n或者，你知道吗，为什么子答案不能来自 `RAG` 系统呢？噢，我的天！我刚刚发明了多\
  \ RAG 多样本多模型模型，我现在正式地将其命名为“manga”模型。\n\n总之，`SoT` 中这种组合的多响应想法不仅更有效。它还速度更快，因为每个子点可以并行处理。每个段落的\
  \ LLM 查询可以同时运行，尽管第一个大纲查询和最后的总结查询必须按顺序运行。但尽管如此，如果答案中有十个子点，那也只是三个 LLM 查询阶段，而不是更多。\n\
  \n最后，请注意尽管这在延迟方面更快，但在计算成本方面是无效的。并行化缩短了返回给用户的时间，但所有这些并行的子点 LLM 请求都在消耗 GPU 资源。它在“设备端”模型（如\
  \ AI 手机和 PC）上也不会运行良好，因为并行能力有限。\n\n## 两步推理\n\n高级 LLM 不在一个 LLM 推理序列中完成所有回答。事实上，它们执行多次，而顶尖技术是“多步”推理。基本的多步方法之一是使用“工具”，例如：\n\
  \n* LLM 制定一个“计划”来执行用户查询。\n* 执行工具以获取输出。\n* LLM 执行最终查询以总结整体响应，包括任何工具的结果。\n\n这种方法涉及两次\
  \ LLM 调用，而“工具”可能是计算器或数据源。工具集成和数据源的问题将在另一个章节中讨论。\n\n## 多步推理 (Multi-Step Reasoning)\n\
  \n一种更通用的提高推理能力方法是让 LLM 制定计划，这可以包含许多其他任务。这种方法也被称为少样本处理，因为允许多次 LLM 调用，而不是单样本方法（后者只有一个\
  \ LLM 请求）。这目前是通过提高 LLM 规划和推理能力来实现 AGI 的前沿研究领域。\n\n如果你使用第三方推理 API 获取查询答案，通常甚至不知道这正在发生。对于恰好没有机器学习博士学位的人来说，这是一个好消息。\n\
  \n还有许多提示技术（包括零样本和少样本）供你研究。这里只是冰一角：\n\n* `重述并回答 (RaR)`\n* `重读 (RE2)` —— 追加 `Read\
  \ the question again:` 以及问题本身。\n* `自问 (Self-Ask)` —— 鼓励 LLM 提问“后续问题”。\n* `思维记忆 (Memory-of-Thought)`\n\
  * `主动提示 (Active Prompting)`\n* `集成提示 (Ensemble prompting)` —— 各种多答案组合想法。\n\n遗憾的是我的电用完了，所以我不会涵盖所有内容。如果你恰恰喜欢奇之又但有效的东西，网上有很多巨大的综述论文。\n\
  \n## 为什么提示工程如此奇怪？\n\n你一定同意提示工程有一点奇怪吧？我们为什么需要做所有奇怪的事情？嗯，主要因为 AI 引擎也是奇怪的生物。\n\n生成式\
  \ AI 引擎的工作方式是获取单词序列并预测下一个单词。然后你重复这个过程，它生成大量的词。这导致了一些局限性：\n\n* 在结尾处继续。\n* 前置上下文。\n\
  * 只有一个序列。\n* 对输入序列不作修改。\n\n\n\n\n# 仅补全。\n\nAI 引擎的工作原理是在末尾添加一个词。无论你的输入序列是什么，它都能告诉你接下来的是什么，而这就是它输出的内容。这导致了一个奇怪的现象：每种类型的问题都必须以序列补全的形式来提出。对于人类来说，大多数查询包含两个部分：\n\
  \n*   `Instructions`（指令）——“请总结这篇文档！”\n*   `Context`（上下文）——文档本身\n\n但对 AI 引擎来说，它们是同一件事。输入必须将文档和指令合并成一个序列。通常，上下文放在前面，指令放在末尾，但并不总是如此。然后\
  \ AI 引擎就满意了，因为它们知道如何在长序列的末尾添加内容。\n\n## 只有一个序列。\n\n此推导出的结论是，只有一个序列。如果给 `LLM` 两个序列，它必须找一个伙伴来并行运行另一个序列。每个\
  \ `LLM` 只知道如何处理一个序列。注意，`LLM` 绝对不能按顺序运行两个序列，因为这是 AI，我们购买所有那些 GPU 是为了使用它们，所以我们根本不进行任何顺序执行的操作。\n\
  \n## 输入不会被更改。\n\n你向 AI 引擎提出的问题实际上是只读的。引擎不会改变你的文字，而是通过在后面添加词汇来回答你的问题。\n\n这对于上下文来说甚至更奇怪。如果你给它一个文档作为“上下文”并告诉引擎“总结”该文档，它并不会回去修改上下文。相反，它只是在所有内容之后追加它的摘要。\n\
  \n更明显的是，如果你告诉一个人类修改一份文档，他们会在原稿上用铅笔涂改。但如果你告诉一个 `LLM` “编辑”文档，它不会编辑输入序列。相反，它能做的最好的就是输出一个编辑后的版本，从所有输入单词之后开始，即上下文和你的指令之后。没有什么比改变其输入文本更让\
  \ `LLM` 感到疯狂了。\n\n## 参考文献\n\n1.  Sander Schulhoff, Michael Ilie, Nishant Balepur,\
