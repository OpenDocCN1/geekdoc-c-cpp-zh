  \ (ToT)`、`Best-of-N (BoN)`、`Skeleton of Thoughts (SoT)`、`Graph of Thoughts (GoT)`、`Agentic\
  \ architectures`\n5.  `Skeleton-of-Thought (SoT)`、`Parallel decoding speeds up and\
  \ improves LLM output`，微软研究，[`www.microsoft.com/en-us/research/blog/skeleton-of-thought-parallel-decoding-speeds-up-and-improves-llm/`](https://www.microsoft.com/en-us/research/blog/skeleton-of-thought-parallel-decoding-speeds-up-and-improves-llm/)\n\
