  \n## 2. 生成式 AI 市场概述\n\n### AI 的现状\nAI 行业的发展瞬息万变，以至于这些话在我打出来的那一刻就已经过时了。尽管如此，关于我们的现状，我有几个通用的想法：\n\
  \n**AI 非常火。** 即使在 ChatGPT 发布两年后，生成式 AI 仍然是人们讨论的焦点（以及董事室的焦点！）。随着新功能的不断发布，有很多内容可以让我们大家保持新鲜。\n\
  \n**AI 令人惊叹。** 已经，“仅仅”写出流利的文本似乎已经是老生了。但我仍然对最新 AI 应用的能力感到惊叹，它们拥有生动写实的图像和迷人的视频片段。在语音、视觉、动画和视频领域，正在发生许多快速的进展。整个行业的演进速度之快，以至于我想要一个\
  \ AI 副驾驶来帮助我跟上所有新闻。\n\n**AI 正在快速改进。** AI 模型智能的排行榜在基础智能和复杂推理方面不断为新模型刷出高分。此外，对安全性、毒性和偏见等负面问题的处理也变得更好。\n\
  \n**AI 正在扩张。** ChatGPT 发布时仅限文本，但现在我们已经可以广泛使用图像智能，视频也开始出现了。诸如 `GPT-4o` 和 `Google\
  \ Gemini` 等多模态模型既可以输出也可以理解图像和文本，无论是结合还是分开。\n\n**AI 是昂贵的。** 还记得那个关于“boat”代表“Bring\
  \ Out Another Thousand”（再拿一千块）的笑话吗？与 AI 相比那算什么。单个 GPU 的价格比你的船还贵，而一个典型的主板有八个。而且大科技公司已经购买了数千个这样的。LLM\
  \ 应该代表什么？“Lavish Leviathan Mammoth”（奢华利坦巨兽）？这是我的想法。“Ludicrously Large Mango”（大得荒谱的芒果）是\
  \ Bing Chat 使用 `GPT-4` 的。两者都不理想，这令人欣慰，因为这意味着还有一些工作要做。\n\n**AI 并不新鲜。** AI 相关工作负载托管市场已经有很多历史了。仅仅因为生成式\
  \ AI 进入了消费者的意识并因此进入了董事室的讨论，并不意味着 AI 是新的。像 `Amazon AWS`、`Microsoft Azure` 和 `Google\
  \ GCP` 等云托管公司多年来一直为许多客户提供 AI 工作负载。他们并没有使用 GPU 用于生成式 AI，而是一直在其他 AI 领域运行负载，如机器学习 (`ML`)、机器视觉（例如\
  \ `Tesla` 自主驾驶汽车）、产品推荐流、预测建模、搜索查询的自动补全等。在 ChatGPT 引爆网络之前，已经有数十亿美元投资了 AI。\n\n**AI\
  \ 手机。** AI 将出现在你的手机上，它将成为新手机购买的大动力。Google 拥有 `Android` 设备端 SDK 来构建手机应用，苹果已经发布了“Apple\
  \ Intelligence”模型，用于 iPhone 上的设备端推理。\n\n**AI PC。** AI 模型和应用有望短期内让 PC 再次热门。下一代笔记本电脑和桌面电脑将原生运行\
  \ AI 模型，还会有混合架构，将 AI 工作负载卸载到云端。微软发布了 `Copilot+ PCs`，并为 `MacOS` 推出了 `Apple Intelligence`。\n\
  \n**绿色 AI。** AI 的广泛使用使其成为能源消耗的重要来源，关于 AI 计算对环境的影响有很多研究。从积极的一来说，这意味着所有针对 AI 改进的研究对绿色\
  \ AI 都有帮助，因为它也将减少其碳足迹和环境影响。所有为了加速 AI 引擎的内核优化也让整体变得更加绿色。\n\n### AI 市场趋势\n以下是关于 AI\
  \ 市场未来可能是什么的前瞻思考。程序员可能还需要一段时间。\n\n**这是一场马拉松，而不是冲刺。** 消费者可能会继续快速采用生成式 AI，但对于企业来说这可能不是最可能的情况。虽然生成式\
  \ AI 是董事室的热门话题，但大多数企业仍在尝试在该领域找到方向，仅启动了探索性项目。小型企业和专业人士（例如诊所）需要多年时间来采用生成式 AI，而大型企业需要更长时间。会有一些早期项目，肯定的，但\
  \ B2B AI 市场的大部分演进会更缓慢。对 AI 的 B2B 方面的预测跨越多年，甚至几十年，具有高复合年复合增长率 (CAGR)。我们已经在云架构的业务采用中看到了这一点，尽管它从\
  \ 2000 年初就开始运行，但现在仍在进行。B2B AI 市场可能会到 2030 年一直保持非常强劲的增长，甚至可能持续到 2040 年及以后。\n\n**B2B\
  \ 市场机会优于 B2C。** 消费者对 ChatGPT 参与度的剧烈增加让消费者端看起来很火热。然而，更有可能是业务端能赚到更多钱。\n\n**B2B 市场机会胜过\
  \ B2C。** 消费者参与 ChatGPT 的规模化增长让消费者端看起来很火热。然而，更有可能是业务端能赚到更多钱（如往常）。\n\n**训练是 B2B 大市场吗？**\
  \ 早期观点认为训练和微调的高成本将远超推理成本。这种观点存在一定争议，一些专家认为单纯的用户数量将推高推理。另一个因素是倾向于使用他人的预训练模型，无论是通过\
  \ `OpenAI API` 使用 `GPT`，还是开源的 `Llama` 模型。因此，B2C 端推理明显多于训练，而且在 B2B 端也可能占据主导地位。\n\n\
  **微调对比 RAG。** 大多数业务项目将涉及使用私有数据增强模型。例如，支持聊天机器人需要公司产品信息，或者内部 HR 聊天机器人需要内部政策文件。实现这一点有两种主要方法：微调或检索增强生成\
  \ (`RAG`)。目前的训练和微调方法需要长时间、需要大量的 GPU 并且昂贵。然而，`RAG` 正在被广泛使用以避免微调的成本。\n\n\n\n是的，这个观点的基本前提是，这两个“应用”领域尚未真正兴起，仍处于起步阶段。企业现在才开始思考他们可以将生成式\
  \ AI 用于何处，无论是内部提高员工生产力，还是外部服务于客户。消费者已经在使用生成式 AI，主要是通过 `ChatGPT` 和 AI 伴侣，但仍有许多新领域将会增长。\n\
  \n然后是技术本身。拜吧，诚实地说，它真的非常令人惊叹。例如：\n\n*   理解（文档和你的指令）\n*   写作（创意性或专业性）\n*   编码\n* \
  \  音频\n*   视频创作\n*   动画\n*   音乐创作\n*   编辑文本、照片、视频或任何内容……\n\nAI 行业存在一些影响所有 AI 项目的底层趋势：\n\
  \n*   AI 推理价格正在快速下降。\n*   多 AI  En 架构更加智能。\n*   多步推理算法（即对每个用户查询进行多次 `LLM` 查询）。\n\
  *   追问式提问（就像真正的个人助手一样）。\n\n接着，技术将变得更加硬核：\n\n*   语音接口 —— 手机可以留在口袋里。\n*   视频理解 ——\
  \ 复杂但可行。\n*   主动自主代理 —— 它们会为你“做”事情，而不只是回答问题。\n*   上下文检测 —— 你现在正看着屏幕上有什么？\n*   用户存在检测\
  \ —— 你现在正在看屏幕吗？\n*   背景上下文分析 —— 你在厨房里吗？\n*   地理位置关联 —— 你现在在去机场的路上吗？\n\n还有一些巨大的形态和用例可能会扩大\
  \ AI 应用的适用性（甚至可能取代智能手机的主流）：\n\n*   AI 设备\n*   自动驾驶交通\n*   机器人\n*   工业自动化\n\n此外，其他非\
  \ AI 进展也会让这种局面变得复杂：\n\n*   `5G`、`6G`、`7G` —— 也许每年一个。\n*   手机上的 `NPUs` —— 离线设备原生\
  \ AI（更快、更私、随叫随）。\n*   下一代硅片 —— AI 专用芯片。\n*   内存带宽优化 —— 更紧密的 `GPU`/`CPU`/内存架构。\n\
  *   网络优化 —— 突破 `RDMA` 的更快网络。\n*   量子计算 —— 半死的猫之类的各种玩意。\n\n用户会喜欢这些东西的！想象一下口袋里有一个智能个人助手，你可以对它说话，它会在你的耳机（无论它们被叫什么）里回答你。我的意思是，真正的智能，而不是你所习惯的那种笨拙的版本，那太\
  \ 2020 年代了。\n\n## AI 的熊市观点 (Bear Case)\n\n尽管规模较小，但关于生成式 AI 是否正在背离其基本基础的争论正日益激烈。我们是否有点走得太前了？\n\
  \n总结生成式 AI 熊市观点的主要要点，我们得到：\n\n*   炒作？—— 只有一点点。这是一个泡沫（这种观点一直如此）。\n*   没有收入 —— 远未达到投资水平。\n\
  *   用户兴趣下降\n*   没有杀手级应用（目前）。\n*   太贵了 —— 除了 `NVIDIA` 之外对所有人都是如此。\n*   供应过剩 —— AI\
  \ 基础设施将变得过剩。\n*   对环境不利 —— 每次查询的数据中心用电量增加了十倍。\n*   `NVIDIA` 的估值 —— 高得无法合理，`NVIDIA`\
  \ 需要通过赚取更多收入来“匹配这种价值”。\n*   局限性 —— 生成式 AI 有许多局限性，在现实中并没有那么有用。\n*   停滞的业务项目 —— 困在“概念验证”阶段。\n\
  *   坏处 —— 许多风险、虚假信息、幻觉、危险、偏见、不准确和完全愚蠢的例子。\n*   不重要 —— 被颠覆的行业并非高价值行业；反正作家和艺术家从未获得过高薪。\n\
  *   概率性 —— 非确定性算法对于生命攸的决策是不理想的。\n*   法律问题 —— 例如偏见、版权、抄袭，以及许多计费时长。\n\n你被说服了吗？你同意\
  \ AI 已经动力尽尽了吗？或者也许还没……\n\n### 牛市观点的反驳 (Bull rebuttals)\n\n让我们更详细地检查一些熊市观点。其中一些观点是有效的，或者在过去一年中是有效的，但情况正在发生变化。因此，有以下评论：\n\
  \n*   随着企业（和技术人员）逐渐找到解决办法，业务项目正以越来越快的速度从 `POC` 向生产阶段转化。\n*   随着消费者和企业采用率的增加，以及由于新的渴求\
  \ `GPU` 的多 AI 架构结合多步推理算法，对 `GPUs` 和其他基础设施的需求将增长。\n*   收入增长：`OpenAI` 的收入在不到六个月内翻了一番，还有其他几家公司在\
  \ AI 伴侣机器人、写作助手、编码助手以及其他领域大赚其满。\n*   随着大量研究人员着手解决问题，生成式 AI 的局限性继续被抛之脑后。\n*   由于更好的训练数据和改进的安全性评估算法，安全问题和其他担忧正在减少。\n\
  *   概率算法在某些情况下是有问题的（例如起搏器植入物中的延迟敏感性），但在智能方面，请考虑你的飞行员或医生的生物大脑基本上使用的是相同类型的算法，只是它的载体是碳基而非硅基。\n\
  \n### 熊市观点的反驳 (Bear rebuttals)\n\n上面的观点有些片面，所以让我们再次看一眼其他一些负面点：\n\n*   `GPU` 需求面临\
  \ (a) 更快的 `GPUs`、`CPUs` 以及 (b) 优化软件、(c) 不使用大 `GPUs` 的手机和 PC 设备侧 AI 的压力。\n*   AI\
  \ 对环境的影响仍然是一个担忧，除非相关研究真的降低了电力成本。\n*   生成式 AI 的安全问题和推理局限在某种程度上是固有的，因此很难系统性地解决。\n\
  *   许多事情仍未经证实且大多处于实验阶段，例如代理架构和语音接口。\n\n至少，这将是一段有趣的旅程！\n\n## 炒作与采纳\n\n众所周知，新技术会经历高纳特热度周期。这包括最初的炒作、然后是回调，随后是较慢但更有力的采纳增长。对于生成式\
  \ AI 来说很可能是这样，但我不想预测任何下降的时间点。目前有一些主要趋势支撑着增长，并进一步推动了对生成式 AI 的需求：\n\n*   消费者采用率正在增加（员工也是如此！）\n\
  *   新进展每月更新一次——例如文本转视频、数字人。\n*   语音接口 —— 让手指更轻松，使用更自然。\n*   多 AI 能力 —— 两个 AI 引擎比一个聪明，但需要双倍的能量。\n\
  *   垂直领域产品 —— 行业专业化模型更好。\n*   手机和 PC 的设备侧 AI 应用 —— 在这一领域还有很多工作要做。\n*   智能性提升 ——\
  \ 模型能力的每提高一个百分比在训练和推理方面的边际成本更高。\n\n另一个会刺激更多使用的因素：杀手级应用。\n\n## 杀手级应用 (Killer Apps)\n\
  \nAI 熊市观点的一个假设是（目前）“没有杀手级应用”。但考虑到消费者对生成式 AI 的大规模采用，这似乎有些虚伪，尤其是 `ChatGPT` 成为历史上增长最快的应用程序。目前消费者领域的一批“杀手级应用”包括：\n\
  \n*   `ChatGPT` —— 用于撰写草稿、提问、头脑风暴等。\n*   AI 伴侣机器人 —— `CharacterAI` 的流量水平惊人。\n* \
  \  图像生成 —— 例如用于书封面！\n*   AI 搜索 —— 为 Google 和 Bing 上的用户查询更智能的回答。\n\n地平线上还有更多潜在的杀手级应用：\n\
  \n\n\n\n\n*   视频自动生成——非常惊人，但目前在片段长度方面存在限制。\n*   与智能助手的语音交互——一个带有语音界面的更聪明的 Siri 可能是\
  \ Apple Intelligence 在 iPhone 上的潜在杀手级应用。\n*   AI 硬件设备——这些尚未进入主流，但有望对智能手机目前的统治地位产生颠覆。\n\
  *   智能体（Agents）——不仅仅是回答问题，而是为你执行事情（起初可能需要你的预先批准）。\n\n## 消费级超级应用？\n\n是否会一个凌于所有应用之上的超级应用？嗯，它已经存在了，而且它完全主导了中国的智能手机使用。它被称为\
  \ `WeChat`（微信），在你阅读这段文字时，中国几乎没有哪部手机没有运行它。然而，它在西方几乎不为人知。`WeChat` 运行在 iPhone 和 Android\
  \ 平台上，并有自己的微程序（mini-apps）层和支付支持。\n\n它在美国或欧洲从未流行起来，我不知道为什么。但为美国推出一个 `WeChat` 克隆版仍然是许多科技公司的梦以求，而我们今天最接近它的东西就是\
  \ `Roblox`！也许生成式 AI 是他们实现这一点的机会。如果你的口袋里有一个无所不知且能为你做任何事的语音智能体，那可能就是了。\n\n## 企业级杀手级应用？\n\
  \n我觉得可以说，在 AI 的商业应用中，还没有明确的杀手级应用。嗯，我特指生成式 AI，因为预测性 `ML` 已经在各个领域根深蒂固，例如产品广告和内容推送的推荐引擎。生成式\
  \ AI 在某些业务相关的用例中已经取得了一些明显的战术胜利：\n\n*   客户支持聊天机器人\n*   写作助手\n*   编程助手\n*   数据转换助手\n\
  \n然而，业务运营的核心框架尚未发生任何真正重大的变化。企业级高级杀手级应用的一些候选领域似乎是：\n\n*   ERP 系统，但更智能的。\n*   工作流自动化\n\
  *   无代码 AI 平台\n*   语音接口\n\n许多供应商在这些领域声称了很多功能，但我怀疑是否有人真正攻了了。业务中存在一个根本性问题，即跨业务部门和区域的各种应用程序与数据源扩张。\n\
  \n会有企业级杀手级应用吗？生成式 AI 的巨大胜利可能由供应商实现，他们的开发成本实际上分摊到了多个业务中，但也可以由单一业务领军者通过构建自己的内部 AI\
  \ 平台来实现。\n\n记住，AI 技术是全新的，仍处于萌芽阶段，所以预计会有很多哭声。但它会成长，而我们现在还不知道它会变成什么样。这是你做一些惊不起并成为最佳的机会！推理愉快（Happy\
  \ inferencing）！\n\n## References\n\n1. Nicholas Grous, Andrew Kim, 2024 年 6 月 4\
  \ 日, `Generative AI: A New Consumer Operating System`, [`www.ark-invest.com/articles/analyst-research/generative-ai-a-new-consumer-operating-system`](https://www.ark-invest.com/articles/analyst-research/generative-ai-a-new-consumer-operating-system)\n\
  2. Daniel Sack, Lisa Krayer, Emma Wiles, Mohamed Abbadi, Urvi Awasthi, Ryan Kennedy,\
