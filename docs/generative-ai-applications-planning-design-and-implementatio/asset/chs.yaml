  \n## 部署架构\n\n### 后端架构\n\n虽然看到你的 AI 引擎在开发机上运行很棒，但在用户看到它之前，仍然有很多工作要做。这被称为你的应用程序的“部署”，包括它的\
  \ AI 模型以及你在此基础上添加的任何特定逻辑。你的部署架构通常由以下主要组件组成：\n\n*   Web 服务器（例如 `Apache`, `NGginx`）\n\
  *   后端服务器\n*   应用逻辑服务器\n*   AI 请求服务器\n*   AI 引擎\n\n你可以合并这些几种类型的服务器组件，但分开进行会更简单，或者至少在概念上将它们视为是分开的。将它们分开也提供了一些宝贵的选择活性，因为如果你的应用火了，每个组件都可以单独进行扩展。\n\
  \nAI 引擎并不是后端部署架构的第一部分。需要一个更简单的处理服务器来接收来自客户端的用户输入。这可能涉及后台的一个或多个服务器进程。\n\n例如，在一个简单的基于浏览器的问答服务中，用户将从网络浏览器输入他们的问题或提示（prompt）。该浏览器请求将由\
  \ `Apache` 或 `Nginx` 等基础 HTTPD 服务器处理，然后将用户的提示词转发到另一个处理请求的特定应用程序服务器。\n\n在小型架构中，请求处理服务器可以直接是\
  \ AI 引擎，但在更现实的生产架构中，它将是一个更简单的服务器，用于复用输入请求流，并将请求分发到多个 AI 服务器。\n\n后端服务器接收用户请求并发送到应用逻辑服务器执行你提供的任何高端服务，由该服务器决定需要哪些\
  \ AI 请求，然后将其发送给 AI 请求服务器处理。\n\n\n\n\nAI 请求服务器必须在多个 AI 引擎之间对 AI 请求进行复用，然后对于任何复杂查询或多引擎请求，将结果汇总在一起。这两个组件都不简单，但至少它们不像尝试编写一个整个\
  \ AI 引擎那样是一个庞大的编码项目。对于这两个组件，目前已经存在各种商业现成服务器，因此这可能是你的最佳选择。但应用逻辑服务器应该是你用代码表达的才华结晶。\n\
  \n# AI 服务器托管方案\n\n你是如何运行你的 AI 引擎的？如果你正在调用商业 AI API，至少有一个 SEP 字段封装了这个问题。但如果你正在运行自己的模型或开源模型，那么你就有多种选择：\n\
  \n*   云服务器托管托管，租用带有 GPU 的设备（例如：`AWS`、`Azure`、`GCP`、`OVH` 等）。\n*   GPU 专用托管公司（大公司和几家新的初创公司）。\n\
  *   按小时租用 GPU（来自相同的 GPU 托管公司）。\n*   模型托管（不仅是 GPU，再次强调，要在大和小公司之间选择）。\n\n在写本文时，AI\
  \ 专用托管的 GPU 租赁价格正在下降（API 推理价格也是如此），购买自己的 GPU 芯片可能并不划算。另一方面，如果你想大做一场或控制自己的命运，那么你可以在资本支出上大放血。\n\
  \n请注意，GPU 不是你唯一关注的。你需要一些非 GPU 设备来运行你 AI 生产架构的其他组件，例如基础的 `Apache`/Nginx` 服务器、后端服务器和应用逻辑服务器。AI\
  \ 请求服务器可能运行在你的 AI 服务器附近，也可能在独立的设备上。\n\n你的操作可能还需要各种辅助服务器，例如：\n\n*   测试平台服务器（GPU 和非\
  \ GPU）\n*   部署服务器（例如，打包新版本）\n*   静态文件缓存服务器\n*   DNS 服务器（如果你是 DIY 的）\n\n请注意，除非你规模非常大，否则不需要自己做\
  \ DNS 服务器。基础域名供应商处理你 DNS 服务需求的能力非常高（例如：`GoDaddy`、`Amazon`、`Google`、`Network Solutions`\
  \ 等）。如果你真的想做，可以找到开源 DNS 服务器（例如：`djdns`），但实现如基于地理的 DNS 等高级功能需要一些工作。\n\n你还需要一种方法在新的生产架构上线之前对其进行测试。完整的“部署”程序可能需要一个服务器来管理，并且在失败时提供一个回滚程序。你可能还需要额外的设备来\
  \ DIY 静态文件缓存（例如：图像、脚本），或者你可以使用内容分发网络（`CDN`）商业供应商。\n\n# 服务器托管规格\n\n无论是在自己的服务器上托管，还是使用主要的云服务供应商，你都需要考虑\
  \ AI 后端服务器的规格。首先，注意并非所有服务器都是“AI 服务器”，大多数基础服务器根本不需要 GPU（例如：`Apache` 服务器、辅助服务器等）。非\
  \ AI 服务器的主要规格是互联网服务器的常见常客：\n\n*   CPU\n*   RAM（运行内存）\n*   磁盘速度\n*   网络连接性\n\n如今，即使是中等配置的设备也能处理所有小型项目的基础服务需求（即，直到你真的做大规模）。对于基础设备，如果你不介意自己动手，那么专用服务器托管会更便宜。但只要付点钱，你就可以用托管服务器来换取这种便利。\n\
  \n即使对于小型公司项目或初创公司，通过多台服务器构建一些冗余和可扩展性也是好的。一种简单的方法是让几台设备在轮询 DNS 下接收请求并进行转发。这样，如果某台设备宕机，在用户察觉到问题之前，还有其他设备供浏览器尝试。\n\
  \n对于非常大的部署，购买自己的机器通常是值得的，但在那之前，你需要将近 100 台设备，这才会变得合理可行。网络上有许多关于大公司从云托管转向自己的专用服务器的报道。\n\
  \n个人而言，对于基础的非 AI 服务器，我们建议在规格上选择相当低端或中端的配置，但运行很多台。特别是，你不需要为许多基础服务器提供磁盘空间，所以重点关注获取足够的\
  \ RAM 和具有足够数的 CPU。\n\n在网络带宽方面，如果你运行多台服务器，你也不需要每台服务器都有高网络流量，因为流量分布在多台服务器上。但你确实需要考虑将流量分散到多台\
  \ `HTTPD` 服务器的方法（例如：轮询 DNS 或负载均衡方法）。但注意，“会话”（sessions）的考虑对于 AI 后端服务器很重要。如果你在聊天机器人或问答应用中存储对话历史，或者你正在进行\
  \ KV 缓存优化，你有两个选择：\n\n(a) 使用具有此功能的路由器或负载均衡器技术，确保用户会话保持在同一台设备上（即“粘性会话”），或\n\n(b) 计划通过高级服务器间网络（例如：`RDMA`\
  \ 技术）或共享存储（例如：`NAS` 设备）在多台设备之间共享数据。\n\n此外，尝试设置你的架构，使你不需要托管提供商提供的那些昂贵的额外功能。对于具有多个\
  \ Web 服务器设备的架构，你不需要容错和故障转移功能。在这种情况下，你也不需要对这些克隆的生产服务器进行备份，只需对那些带有重要日志、用户管理数据库或用户文档数据存储的服务器进行备份。\n\
  \n\n\n### 硬件选项\n\n* `A100 (Ampere)` — 40GB 或 80GB\n* `H100 (Hopper)` — 80GB\n* `B100/B200\
  \ (Blackwell)` — 192GB (x96GB)\n\n好的，是的，还有其他选项。`Google TPU` 以及来自 `AMD` 和 `Intel`\
  \ 的一些数据中心 GPU 都可以考虑。\n\n如果在数据中心之外，在高端 PC（如游戏桌面）上运行较小的模型，那么有更多的选项和 GPU 内存大小可以考虑。你可以在\
  \ `NVIDIA RTX` 系列、`AMD Radeon` 以及其他 GPU 供应商之间进行选择。\n\n### GPU 内存\n\nGPU 内存的大小非常重要，直接影响推理性能。这有时被称为“VRAM”，这是对视频游戏显存的一种过时引用，但在用于\
  \ AI 引擎时，它通常被称为“GPU 内存”。GPU”中的“G”曾代表“Graphics”，但现在它指的是“Gigantic”或“Generative”之类的。\n\
  \n需要多少 GPU 内存？短答案是：较小模型（例如 `3B`）至少需要 12GB，运行 `7B` 模型或 `13B` 模型理想需要 24GB。量化也有助于让模型足够小以放入\
  \ GPU 中。\n\n通常情况下，对于开源模型，你希望整个模型能够位于单个 GPU 的内存中。然而，这也会影响单台 GPU 服务器上运行多少个 AI 引擎实例。GPU\
  \ 需要一个模型的静态副本（一次），但还需要为每个实例单独存储所有的激活计算。如果你正在运行开源 `7B` 模型，一个不错的 GPU 可以容纳多个副本。对于 `13B`\
  \ 模型，尝试在 80GB GPU 上运行 `70B` 模型变得有些困难。量化模型是你的朋友。\n\n`NVIDIA 3080Ti` 拥有 12GB，适用于 `3B/7B`\
  \ 模型，主要用于 POC 开发和研究工作。`NVIDIA 3090` 拥有 24GB，适用于 `3B/7B`，如果你小心，也可以尝试 `13B`。`NVIDIA\
  \ 4070Ti` (12GB) 与 `3080Ti` 类似；`NVIDIA 4080` 拥有 16GB，`NVIDIA 4090` 拥有 24GB。对于需要更多\
  \ GPU 内存的大模型，你需要关注 `V100`、`A100` 或 `H100`。\n\n上述讨论主要涉及中小型的开源模型。仅凭单个 GPU 运行大型商业超级模型实际上是不可能的。大公司正在通过复杂的多\
  \ GPU 调度算法运行大量的 `H100`。如果你想了解这些内容，请给他们发份简历（或者阅读研究论文）。\n\n注意，GPU 内存并没有真正的“虚拟内存”、“上下文切换”或“分页”概念。操作系统在这里无法对你提供帮助。管理\
  \ GPU 内存是一项低级编程任务，你基本上是将整个模型塞进 GPU 中，并希望再也不需要卸载它。\n\n即使对于较小的模型，你也需要多个带有 GPU 的设备，假设每个\
  \ GPU 运行多个模型实例。为了获得良好的响应时间，你希望 GPU 上的模型实例可以立即运行用户的查询。你需要的总实例数取决于你的用户负载，以及他们是否喜欢看蓝色的旋转圈。\n\
  \n### GPU 计费\n\nGPU 有多种计费方法，你必须对比供应商。许多 GPU 功率按小时计费，并提供月度选项，管理这笔费用对整体可能会产生巨大影响。推理与训练的负载特征不同，而且显然取决于生产应用中的用户模式。\n\
  \n## 在线架构优化\n\nAI 引擎及其模型只是你生产环境架构的一部分。在线网站版本需要一个接收用户请求的后端服务器。对于开源模型，你希望整个模型能够位于单个\
  \ GPU 的内存中。然而，这也会影响单台带 GPU 的服务器上可以运行多少个 AI 引擎实例。\n\n#### 网站优化\n\n有些技术问题包括：\n\n*\
  \ `Apache` 还是 `Nginx`（通常 `Nginx` 更快）\n* 登录用户还是访客会话（`session`）\n* 会话历史记录（例如 `history`）\n\
  * 脚本大小（`JavaScript`）\n* SSL 证书（`HTTPS`）\n* Cookie 存储（`Cookie`）\n* 缓存服务（`CDN`）\n\
  * 统计分析（`Analytics`）\n\n这种网站优化本身是一门学问。\n\n#### API 优化\n\n如果你的架构是包装了商业 `API`，那么你能够做的事情就有限了。除了优化后端服务器，你还可以控制哪些用户请求通过\
  \ API。一些优化措施包括：\n\n* 使用启发式过滤模糊查询（例如 `heuristics`）\n* 对相同查询使用全响应缓存（`inference cache`）。考虑缓存略有不同的响应。\n\
  * 使用向量数据库的语义缓存（`semantic cache`）进行近邻查找（`nearest-neighbor`）。\n* 机器人对话历史的上下文压缩或 `RAG`\
  \ 文档块。\n\n\n\n\n# 会话跟踪与请求处理\n\n## 简单架构概述\n\n在最简单的架构中，不需要从提示词历史中获取上下文，会话是在 Web 服务器端完成的。换句话说，请求处理服务器可以处理任何会话相关的请求，然后从数据存储中访问任何特定会话的文档。它可以将这些数据转发给\
  \ AI 引擎，AI 引擎只需接收并处理提示词请求，而无需知道它们来自何。因此，AI 引擎以无状态运行，仅处理输入提示词而不包含任何额外的用户上下文。\n\n\
  在服务器中实现简单的请求队列有许多方法。这是一个放置在 Web 服务器后端的“应用服务器”。你可以自己构建，也可以使用生产级工具，例如：\n\n*   `Uvicorn`\
  \ 配合 `FastAPI`\n*   `Gunicorn` 配合 `Flask`\n*   `Apache Tomcat`\n*   `Microsoft IIS`\n\
  \n这里还有许多其他选项，你可以将你喜欢的应用服务器添加到列表中。`Tomcat` 是一个著名的应用程序服务器，通常作为 Linux 上 `Apache` 的插件使用。`Microsoft\
  \ IIS` 曾是一个 Web 服务器，后来演变为组合式的 Web 应用服务器。\n\n`Uvicorn` 结合 `FastAPI` 或 `Gunicorn`\
  \ 结合 `Flask` 都是相似的 Python 特有架构。作为与 AI 引擎交互的基于 Python 架构的生产工具，这两者都是相当简单的选择方案。\n\n\
  ## 负载均衡\n\n如果你的目标是处理高并发的用户请求，那么你需要考虑具有负载均衡和容错能力的高端可扩展架构。负载均衡需要考虑的技术包括：\n\n*   `Round\
  \ Robin DNS`（轮询 DNS）\n*   `负载均衡网络设备`\n*   `Apache Kafka`\n*   `Apache Load Balancer`\n\
  *   `Nginx` 负载均衡\n\n`Round robin DNS`（或 `RR DNS`）是将传入请求分配到多个服务器的简单方法，但它不是真正的负载均衡，因为它没有考虑服务器连接的负载或可用性。优点是，它不需要额外的服务器组件，只需通过操作域名\
  \ DNS 记录即可完成。\n\n`Kafka` 是一个更具扩展性的生产级工具，具有集群等高级功能。在大型架构中，使用 `Kafka` 有许多优点，因为它是一个专为处理高量量入事件流而设计的预构建工具。它具有高效的分布式架构，你将请求发送到\
  \ `Kafka` 集群，并可以创建多个监听器来处理传入的请求。对于每个输入提示词，`Kafka` 监听器会取出请求，然后将提示词文本转发到关联的 AI 引擎。\n\
  \n`Apache Load Balancer` 是免费的负载均衡插件。更多信息请参阅 `mod_proxy` 和 `mod_proxy_balancer` `Apache`\
  \ 模块。`Nginx` 也支持多种不同的负载均衡方法，如轮询和最少连接。详情请参阅 `Nginx` 文档。\n\n## 网络优化\n\n较大的 GPU 应用可能需要在多个\
  \ GPU 之间或跨网络到其他服务器传输数据。运行许多推理后端的大型数据中心在各种网络协议和软件栈方面也有大量工作。在这些情况下有各种优化措施，以下是其中一些的总结。\n\
  \n运行 `H100` GPU 的数据中心将拥有不同类型的网络：\n\n1.  前端网络 —— 来自外部访问的 `Ethernet`（以太网）。\n2.  后端网络\
  \ —— 优化 GPU 间的传输。\n3.  带外网络 —— 用于内部监控和管理。\n\n前端网络通常是从互联网到主机的 `Ethernet` 连接。这是客户和外部用户连接数据中心以访问服务器和数据存储需求的方式。\n\
  \n后端技术要密集得多且高带宽，因为它们管理着归约（reductions）和聚合（gather）操作中的 GPU 间通信。AI 训练应用在更新参数时具有特别爆发式的高并发并发数据发送模式。使用的技术包括\
  \ `InfiniBand`、`Spectrum-X` 或 `RoCEv2` `Ethernet`。这可能需要对 `NVIDIA Collective Communications\
  \ Library` (`NCCL`) 进行优化，例如让 `Ethernet` 运行得足够快。可能会考虑不同的连接拓扑结构，例如网络交换机和 GPU 服务器。连接硬件选项包括各种网络交换机以及光缆或电缆之间的选择。\n\
  \n对软件和硬件设备的监控和管理至关重要，因为热 GPU 以及其他网络设备和服务器中的故障和错误很常见。数据中心的监控工具包括 `Grafana` 和 `Prometheus`。GPU\
  \ 过热导致计算结果错误的隐性故障可以通过运行自诊断来诊断，例如运行 `NVIDIA` 的“dcgmi”诊断（第 4 级）。\n\n了解高端数据中心网络层中所有这些疯狂的复杂知识，是目前需求巨大的非常专业的技能。以下是关于特定网络技术的附加信息。\n\
  \n1.  **远程直接内存访问 (`RDMA`)**：这是一种网络协议，服务器可以访问其他服务器的内存，而无需中断远程 CPU（或 GPU）。使用 `RDMA`\
  \ 可以允许服务器之间快速网络数据传输，而不会减慢它们的计算。\n2.  **`NCCL` 中的延迟连接建立（Lazy Connection Establishment）**：这是对用于\
  \ GPU 间通信的 `NVIDIA Collective Communications Library` (`NCCL$，读作“nickel”）的优化。延迟连接建立延迟\
  \ GPU 建立连接直到需要，从而缩短 `NCCL` 的初始化时间。该功能由 `NCCL_RUNTIME_CONNECT` 环境变量控制，可以通过将其设置为零来禁用。注意，这与“懒加载”（lazy\
  \ loading）优化不是优化，后者指的是 GPU 加载机器码指令。\n3.  **多 GPU 点对点内存访问**：这有时缩写为 “P2P”，是一种与运行多个\
  \ GPU 的主板相关的技术。这种优化方法涉及让一个 GPU 直接访问另一个 GPU 的内存，而不涉及 CPU。\n4.  **`nvlink` 数据传输**：这种方法用于服务器内部的多\
  \ GPU 通信。它提供了一种更快的通信协议，通过跳过 PCIe 总线进行数据传输，从而允许 GPU 之间更高效地通信。\n5.  **内存映射 I/O**：这是一种优化，I/O\
  \ 外设设备直接连接到内存，而不需要 CPU 参与控制数据传输。可以连接到你的 AI 引擎的各种外设，从 Tardis 或 Holodeck 开始。\n\n\n\
  \n\n这种简单的方法存在一些缺点。首先，它并不总是那么有效，在运行良好之前，可能需要一些更高级的提示词工程（prompt engineering）。一些 AI\
  \ 引擎开始提供选项，可以在同一个 API 请求中显式地分开发送这两个输入，这可能会改善这种状况。其次，它向 AI 引擎发送了大量的额外 token，这些 token\
  \ 的处理成本昂贵，无论是对于商业付费型引擎（例如 `OpenAI’s API`）在账单中产生的额外费用，还是对于你自己的 GPU 托管负载增加所带来的隐性成本。\n\
  \n降低成本的一个想法是存储之前对话的“摘要”而非全部内容，这样前置的 token 就会更少。摘要生成本身就是一个整个研究领域，有多种方法。例如，可以通过某些类型的简单启发式方法（例如，仅删除不重要的“停用词”）或通过基于\
  \ AI 的摘要算法来实现（尽管额外的开销可能违背初衷）。“提示词压缩”和“文档摘要”研究领域可能与此相关。\n\n与前置之前的对话相比，还有更先进的方法可以处理带有历史记录的请求。有多种方法可以存储和处理包含提示和回答历史的长用户对话的“上下文”。这一领域被称为“对话式\
  \ AI”，可能需要对你的 AI 引擎架构进行更改。\n\n最后，这个领域变化迅速，当你读到这里时，上述内容可能已经过时。对于提供者来说，由商业 API 来跟踪上下文是一个显而易见的扩展，而不是不礼貌地将这一要求强加给每个程序员。承认，这也不是一个廉价的功能，因为\
  \ API 提供者需要存储大量的额外上下文数据，以换取由于你发送更少 token 而获得的较低费用。尽管如此，我预计很快就会商业 API 将此功能。\n\n##\
