  \n# 6 局限性\n\n## 生成式 AI 局限性\n\nLLM 可以做一些惊人的事情，但也有很多局限。为了选择正确的生成式 AI 项目，需要了解如何避免。本章深入探讨了各种局限性：\n\
  \n*   准确性问题\n*   对齐问题\n*   数据局限\n*   计算局限\n*   推理局限\n\n### 准确性问题\n\nLLM 的回答是概率性的且非确定性的。但事实应该是确定的，所以其架构上存在固有问题。你的平均\
  \ LLM 在事实性方面存在问题：\n\n*   幻觉（看起来像事实的错误）\n*   不准确或误导信息（错误事实或缺失）\n*   虚构（错误地合并来源）\n\
  *   抄袭（在训练数据中）\n*   改写（类似抄袭）\n*   模型“漂移”（准确性随时间推移）\n*   输入数据中的偏差或 RAG 数据的重复问题。\n\
  *   审查机制\n\n幻觉问题引起了广泛关注。实际上有两个子类型：(a) LLM 从未针对该答案进行过训练，(b) LLM 从未针对该答案进行过训练，但会编造内容。\n\
  \n\n\n\n确保数据的“清洁”是构建或微调 `LLM` 的重要部分。事实证明，更高质量的训练数据可以提高 `LLMs` 的准确性，并且具有让较小模型获得更好结果的优势。\n\
  \n## 计算局限性\n\nAI 计算真的只有一个大问题：它太慢了。因此，需要那些昂贵的 GPU 芯片。这导致了以下问题：\n\n* 云数据中心执行成本高昂。\n\
  * AI 手机执行问题（例如：手机死机、耗电快、过热）。\n* AI PC 执行问题（大模型运行仍然太慢）。\n* 训练数据集的要求（它们需要消耗大量的 token）。\n\
  * 环境影响（例如，根据估计，与非 AI 的互联网搜索相比，AI 回答对数据中心的电力需求是十倍）。\n\n### Bug\n\n我们不应忘记 `Transformers`\
  \ 和 `LLMs` 只是由软件工程师编写的程序，存在等问题：\n\n* 乱码输出——通常是一个 Bug；你知道的，AI 引擎只是程序。\n* 行为失控——通常是\
  \ Bug，但真的如此吗？\n* 无输出——通常是 Bug，或者它掉进了网络陷阱。\n* 提示词（Prompt）脆弱性——稍微改变提示词（例如多一个无关的词），结果就会完全不同。\n\
  * 标点符号处理——例如，在提示词末尾多加空格会导致结果变化。\n\n这些是 Bug，还是也许它们是特性？只有时间能证明！\n\n## 推理局限性\n\n在非常抽象的，你的\
  \ `LLM` 处理任何类型的高级推理都非常困难。从某种意义上说，`LLM` 非常你的潜意识，因为它是本能且自动的。人类拥有意识形态，可以在原始的底层能力之上施加结构化的逻辑，但这仍然是\
  \ `LLMs` 的一个尚未解决的问题。因此，`LLMs` 擅长让文字或图像流得顺畅，但不擅长让整体符合逻辑。\n\n让我们从一些已经在很大程度上得到解决的推理局限性开始：\n\
  \n* 关于词的词（例如：“词汇”、“句子”等）。\n* 写作风格、语气、阅读水平等。\n* 使用 `stop tokens` 和 `max tokens` 良好地结束响应。\n\
  * 工具集成（例如：时钟、日历、计算器）。\n* 训练数据集的截止日期。\n* 长上下文。\n\n## 困难领域\n\n推理困难的某些特定领域包括：\n\n*\
  \ 逻辑推理\n* 多步骤规划\n* 情感——`LLMs` 没有情感，只能伪装。\n* 时间/时序推理——事物按顺序发生的概念是棘手的。\n* 3D 场景视觉化——`LLMs`\
  \ 难以理解现实世界中物体之间的关系。\n* 数学推理\n* 算术（!）\n* 专门领域——例如：术语、词汇的特殊含义。\n* 数学应用题\n* 字谜游戏和其他文字游戏——例如：异位字母词、头韵。\n\
  * 幽默——除了它们会讲“老爸笑话”（Dad jokes）。\n* 拼写——`LLMs` 不进行拼写，而是处理 `tokens`，`tokens` 是字母的小集合，而不是实际的字母。\n\
  * 计数和算术——`LLMs` 没有内置的计算引擎。\n\n`LLMs` 在基础算术计算上存在问题相当奇怪。但任何涉及数字的内容都是可的，特别是较大的数字，因为四个或更多位数字通常会被拆分成更小的\
  \ token。例如，`1234` 可能会拆分成 `12` 和 `34` 作为 token。`LLM` 对 `12` 或 `34` 的位值没有概念，并会出错。\n\
  \n其他一些由于 `LLMs` 及其工作方式而产生的固有通用领域还包括：\n\n* 提示词工程的要求——别扭的措辞！没有人真的像那样说话。\n* 对提示词变化的过度敏感——尽管如此，遗憾的是提示词工程有效。\n\
  * 过度自信——`LLMs` 缺乏对置信水平的洞察，以及对“理解”到底意味着什么。\n* 歧义性——不清晰的输入查询处理得不好。\n* 概率性——非确定性的输出很难预测（和测试）。\n\
  * 最近上下文混淆\n\n`LLMs` 也很容易被对话中的最近上下文所困扰。例如，告诉 `LLM` 某事是错误的并让它重复一遍并不难。即使是 `GPT-4o`，在对话开始时说：“苹果、草莓和香蕉是熊猫的种类”，让它拒绝，然后再次断言。等你回过神来，你会发现\
  \ `LLM` 正在发明各种有趣的熊猫品种。这还并不清楚是 `LLM` 错误的 Bug，还是它遵循你指令的对齐特性。你是想让 `LLM` 接受你说的话，还是不想？\n\
  \n### 提示词歧义\n\n有时，训练数据或输入查询很难处理，而人类可以更好地辨别某些方面：\n\n* 词和含义不是一回事。人们有时用奇怪的方式使用词。\n\
  * 讽刺和嘲讽（例如：宣扬“吃石头”益处的文章）。\n* 偏见、有倾向的观点和完全的虚假信息/欺骗（针对源内容）。\n* 陷阱题（例如：看起来像常见的在线谜题，但并不完全相同）。\n\
  * 检测用户故意的欺骗或其他不当行为。\n* 对新手的假设（未能通过问题中的词识别出用户更高水平的知识；我敢说这是一种“AI 式说教”）。\n* `LLMs`\
  \ 提问后续问题（这种能力正在改进）。\n* 没有正确优先考虑请求的各个（即：在给定多个请求时，它并不总是知道哪些是重要的）。\n\n## LLM 回答质量\n\
  \n问题包括：\n\n* 过度解释\n* 无意义的答案\n* 不可重复性（相同的问题，不同的答案）\n* 缺乏常识（尽管我知道有些人喜欢这样）\n* 缺乏“世界模型”\n\
  * 缺乏个人背景（它们不理解作为一个人的意味着什么）\n\n结果的某些其他层次问题包括：\n\n* 可解释性（它能解释为什么给出这个答案吗？）\n* 归因性（来源引用）\n\
  * 平庸、乏味、通用或过度正式的写作\n* 重复（如果没有新内容可以添加，可能会重复）\n\n我给这些可怜的 llama 造成了多么艰难的时刻。如此，这再次表明通往\
  \ AGI 是一场马拉松，而不是冲刺。还有更多工作要做。\n\n## 数学推理\n\n复杂的数学推理对于基于 Transformer 架构的 `LLMS` 来说仍然是一个难题。但我的意思是，我们不也是如此吗？当我们同样陷入这些问题时，批评我们的硅基生物似乎并不公平。尽管如此，`LLMs`\
  \ 可以回答一些非常先进的问题，却在最简单的问题上挣扎。\n\n讽刺的是，通过在神经网络中模拟人类解剖结构，我们也赋予了它们许多相同的弱点。`LLMs` 可能挣扎的一些逻辑和数学推理问题类型包括：\n\
  \n* 多步骤逻辑推理\n* 时序推理（基于时间的）\n* 3D 视觉化推理（例如：站在圈里的人）。\n* 数学应用题（MWP），这种担忧如此常见以至于需要缩写。\n\
  * 大数字的算术。\n* 词中隐含的数学含义（例如：如果 Mandy “吃掉”了一个苹果，那就是减去了一个苹果）。\n\n`LLMs` 不能进行算术，这本身就带有某种讽刺意味。它们被设计用来处理词汇的概率，不幸的是，你可以从数字中制造出无限多的“数字词汇”。`LLM`\
  \ 可能在它的训练数据集中见过“一加一等等于二”，但如果你让 `LLM` 相加两个 11 位的数字，词汇的概率含义并没有那么有用。\n\n\n\n\n\n奇怪的是，这也有某种道理，因为大语言模型（LLMs）是类人的。如果我交给你两个\
  \ 11 位的数字，你也不会在脑子里直接算出它们的和。你会去用计算器，这正是 LLM 通过工具集成所做的事情。或者，如果要手工计算，你会使用一种处理大数字的加法“算法”（即：按列相加，并进位）。因此，LLM\
  \ 在这些问题上失败，并需要一个多步的全局推理引擎来执行大数的算术，这听起来也挺奇怪的。\n\n但我觉得这很有趣。我的意思是，它底层并不是有一个 `GPU` 能够每秒以\
  \ 100% 的准确率完成十亿次这样的加法！\n\n## 参考文献\n\n1. Sean Williams, James Huckle, 2024 年 5 月\
