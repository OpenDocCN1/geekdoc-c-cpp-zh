  \ Productivity. It Expands Capabilities`, [`www.bcg.com/publications/2024/gen-ai-increases-productivity-and-expands-capabilities`](https://www.bcg.com/publications/2024/gen-ai-increases-productivity-and-expands-capabilities)\n\
