    Carbon provides a modern generics system with checked definitions, while still supporting
    opt-in templates for seamless C++ interop. Checked generics provide several advantages
    compared to C++ templates:


    Generic definitions are fully type-checked, removing the need to instantiate to
    check for errors and giving greater confidence in code.


    *   Avoids the compile-time cost of re-checking the definition for every instantiation.


    *   When using a definition-checked generic, usage error messages are clearer,
    directly showing which requirements are not met


    Enables automatic, opt-in type erasure and dynamic dispatch without a separate
    implementation. This can reduce the binary size and enables constructs like heterogeneous
    containers.


    Strong, checked interfaces mean fewer accidental dependencies on implementation
    details and a clearer contract for consumers.


    Without sacrificing these advantages, Carbon generics support specialization,
    ensuring it can fully address performance-critical use cases of C++ templates.
    For more details about Carbon''s generics, see their design.


    In addition to easy and powerful interop with C++, Carbon templates can be constrained
    and incrementally migrated to checked generics at a fine granularity and with
    a smooth evolutionary path.


    # Getting started with Carbon


    You can get started playing with Carbon by checking out the codebase and using
    the Carbon explorer:


    # Install bazelisk using Homebrew.


    $ brew install bazelisk


    # Install Clang/LLVM using Homebrew.


    # Many Clang/LLVM releases aren''t built with options we rely on.


    $ brew install llvm


    $ export PATH="$(brew --prefix llvm)/bin:${PATH}" # Download Carbon''s code.


    $ git clone [https://github.com/carbon-language/carbon-lang](https://github.com/carbon-language/carbon-lang)


    $ cd carbon-lang


    # Build and run the explorer.


    $ bazel run //explorer -- ./explorer/testdata/print/format_only.carbon


    # Can Google''s New Programming Language ''Carbon'' Replace C++ Better Than Rust?


    ## A Question we all need the answer


    It''s difficult for large projects to convert existing C++ codebases into Rust,
    argue Google engineers — so they''ve created a new "experimental" open source
    programming language called Carbon.


    Carruth delved into more detail about some of the reasons why Carbon should be
    considered a powerful successor to the C++ language, including simpler grammar
    and smoother API imports.


    Google''s engineers are already building tools to translate C++ into this new
    language. "While Carbon began as a Google internal project, the development team
    ultimately wants to reduce contributions from Google, or any other single company,
    to less than 50% by the end of the year," reports The New Stack, adding that Google
    ultimately wants to hand off the project to an independent software foundation
    where development will be led by volunteers:Long the language of choice for building
    performance-critical applications, C++ is plagued with a number of issues that
    hamper modern developers, Carruth explained on a GitHub page. It has accumulated
    decades of technical debt, bringing with it many of the outdated practices that
    were part of the language''s predecessor, C. The keepers of C++ prioritize backward
    compatibility, in order to continue to support widely-used projects such as Linux
    and its package management ecosystem, Carruth charged.


    The language''s evolution is also stymied by a bureaucratic committee process,
    oriented around standardization rather than design. Which can make it difficult
    to add new features. C++ has largely a sequestered development process, in which
    a select committee makes the important decisions, in a waterfall process that
    can take years. "The committee structure is designed to ensure representation
    of nations and companies, rather than building an inclusive and welcoming team
    and community of experts and people actively contributing to the language," Carruth
    wrote. "Access to the committee and standard is restricted and expensive, attendance
    is necessary to have a voice, and decisions are made by live votes of those present."


    Carruth wants to build Carbon by a more open community-led environment. The project
    will be maintained on GitHub, and discussed on Discord.... The design team wants
    to release a core working version ("0.1") by the end of the year.


    Carbon will boast modern features like generics and memory safety (including dynamic
    bounds checks), the article points out. And "The development team will also set
    out to create a built-in package manager, something that C++ sorely lacks."


    The Aimed successor


    Over the years, Google has created a few programming languages, some of which
    have become more popular and prominent than others. For example, Golang (or simply
    Go) was created for the purpose of improving the development of servers and distributed
    systems and has since been adopted by the public. Meanwhile, the Dart programming
    language, originally intended as something of an alternative to JavaScript, didn’t
    reach mainstream popularity until the release of Flutter.


    At the Cpp North convention in Toronto, as shared by Conor Hoekstra who was in
    attendance and documented the slides, Googler Chandler Carruth shared the vision
    for a new programming language called Carbon. To set the scene, Carruth showed
    how many of today’s most popular programming languages have successors that allow
    developers to be rapidly productive and also take advantage of modern language
    design.'
