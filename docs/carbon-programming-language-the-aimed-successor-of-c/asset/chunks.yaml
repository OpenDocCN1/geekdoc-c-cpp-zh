- fmt: "\nAs for why a `C++` developer may want to consider introducing `Carbon` to\
    \ their codebase, Carruth shared quite a few highlights of the language on stage.\n\
    \nBeyond the features of the language itself, the Carbon team drew attention to\
    \ the development process that will shape Carbon’s future. The project’s code\
    \ is hosted publicly on GitHub and is open for pull requests, while Carbon’s culture\
    \ is outlined to be accessible and inclusive for employees of companies and private\
    \ individuals, alike.\n\nThat said, one aspect of the `Carbon` programming language\
    \ that’s not particularly well outlined is Google’s involvement. While today’s\
    \ presentation was shared by a Googler, and the current project leads for `Carbon`\
    \ consist primarily — but not entirely — of Googlers, there’s otherwise no mention\
    \ of `Carbon` being a Google project.\n\nThis is actually intentional, as while\
    \ `Carbon` got its start within Google, the team understands and has shared online\
    \ that for it to have any future success, `Carbon` needs to be “an independent\
    \ and community driven project,” not solely driven by Google’s own uses. In the\
    \ same comment, Carruth further emphasizes that `Carbon` is currently just an\
    \ experiment, albeit one that some companies have already shown early interest\
    \ in.\n\nIf you’re interested in getting started with `Carbon`, you can download\
    \ the source code and experiment with it on your own device. Or, you can get a\
    \ feel for the `Carbon` programming language directly in your browser thanks to\
    \ integration with the free `Compiler Explorer` web app.\n\n## Google’s Carbon\
    \ programming language aims to replace C++\n\nThe so called `Carbon` language\
    \ (`C++` successor) which was released on Tuesday, 19 July 2022, which was said\
    \ is an experimental replacement for `C++`.\n\nCarruth said that although many\
    \ may suggest that `Rust` is a successor to `C++`, it lacks the level of “bi-directional\
    \ interoperability” that `Carbon` offers.\n\nHe said `Carbon` is intended to be\
    \ fully interoperable with existing `C++` code, adding that the goal is to make\
    \ the transition from `C++` to `Carbon` as easy as possible.\n\nHighlights of\
    \ Google’s new programming language include:\n\n- Introducer words and a simple\
    \ grammar\n- Function input parameters are read-only values\n- Pointers provide\
    \ indirect access and mutation\n- Use expressions to name types\n- The package\
    \ is the root namespace\n- Import APIs through their package name\n- Explicit\
    \ object parameter declares a method\n- Single inheritance — classes are final\
    \ by default\n- Powerful, definition-checked generics\n- Types explicitly implement\
    \ interfaces\n\nInterestingly, Google noted that for the language to be successful,\
    \ `Carbon` must be “an independent community driven project” and not solely for\
    \ Google’s use.\n\nTherefore, while most of `Carbon`’s current leads are Google\
    \ developers, there is no explicit information classifying it as a Google project.\n\
    \nThe source code for `Carbon` is available on GitHub and is open to pull requests.\n\
    \n`https://github.com/carbon-language/carbon-lang#carbon-language--an-experimental-successor-to-c`\n\
    \n## Modern and evolving\n\n- Solid language foundations that are easy to learn,\
    \ especially if you have used `C++`\n- Easy, tool-based upgrades between `Carbon`\
    \ versions\n- Safer fundamentals, and an incremental path towards a memory-safe\
    \ subset\n\n## Fast and works with C++\n\n- Performance matching `C++` using `LLVM`,\
    \ with low-level access to bits and addresses\n- Interoperate with your existing\
    \ `C++` code, from inheritance to templates\n- Fast and scalable builds that work\
    \ with your existing `C++` build systems\n\n## Welcoming open-source community\n\
    \n- Clear goals and priorities with robust governance\n- Community that works\
    \ to be welcoming, inclusive, and friendly\n- Batteries-included approach: compiler,\
    \ libraries, docs, tools, package manager, and more\n\n# Why build Carbon?\n\n\
    `C++` remains the dominant programming language for performance-critical software,\
    \ with massive and growing codebases and investments. However, it is struggling\
    \ to improve and meet developers' needs, as outlined above, in no small part due\
    \ to accumulating decades of technical debt. Incrementally improving `C++` is\
    \ extremely difficult, both due to the technical debt itself and challenges with\
    \ its evolution process. The best way to address these problems is to avoid inheriting\
    \ the legacy of `C` or `C++` directly, and instead start with solid language foundations\
    \ like modern generics system, modular code organization, and consistent, simple\
    \ syntax.\n\nExisting modern languages already provide an excellent developer\
    \ experience: `Go`, `Swift`, `Kotlin`, `Rust`, and many more. Developers that\
    \ can use one of these existing languages should. Unfortunately, the designs of\
    \ these languages present significant barriers to adoption and migration from\
    \ `C++`. These barriers range from changes in the idiomatic design of software\
    \ to performance overhead.\n\n`Carbon` is fundamentally a successor language approach,\
    \ rather than an attempt to incrementally evolve `C++`. It is designed around\
    \ interoperability with `C++` as well as large-scale adoption and migration for\
    \ existing `C++` codebases and developers. A successor language for `C++` requires:\n\
    \n- Performance matching `C++`, an essential property for our developers.\n- Seamless,\
    \ bidirectional interoperability with `C++`, such that a library anywhere in an\
    \ existing `C++` stack can adopt `Carbon` without porting the rest.\n- A gentle\
    \ learning curve with reasonable familiarity for `C++` developers.\n- Comparable\
    \ expressivity and support for existing software's design and architecture.\n\
    - Scalable migration, with some level of source-to-source translation for idiomatic\
    \ `C++` code.\n\nWith this approach, we can build on top of `C++`'s existing ecosystem,\
    \ and bring along existing investments, codebases, and developer populations.\
    \ There are a few languages that have followed this model for other ecosystems,\
    \ and `Carbon` aims to fill an analogous role for `C++`:\n\n- `JavaScript` → `TypeScript`\n\
    - `Java` → `Kotlin`\n- `C++` → `Carbon`\n\n# Project status\n\n`Carbon` is currently\
    \ an experimental project. We want to better understand whether we can build a\
    \ language that meets our successor language criteria, and whether the resulting\
    \ language can gather a critical mass of interest within the larger `C++` industry\
    \ and community.\n\nCurrently, we have fleshed out several core aspects of both\
    \ Carbon the project and the language:\n\n- The strategy of the Carbon Language\
    \ and project.\n- An open-source project structure, governance model, and evolution\
    \ process.\n- Critical and foundational aspects of the language design informed\
    \ by our experience with `C++` and the most difficult challenges we anticipate.\
    \ This includes designs for:\n    - Generics\n    - Class types\n    - Inheritance\n\
    \    - Operator overloading\n    - Lexical and syntactic structure\n    - Code\
