- fmt: '

    Android developers well know that Kotlin serves as a successor to Java, just as
    iOS developers know Swift is the successor to Objective-C. TypeScript, from Microsoft,
    has thoroughly enhanced JavaScript, while remaining comfortable to use and able
    to be “transpiled” back to JavaScript. C++, which sees a significant amount of
    use within Google, is similarly a successor of sorts to the original C programming
    language.


    While some may suggest that Rust, originally a Mozilla project that has since
    grown to have a significant public following, is a successor to C++, Carruth wonders
    if the analogy still follows. While Rust is undeniably a great language to start
    a new project in, it doesn’t have the same “bi-directional interoperability” of
    something like Java & Kotlin, making it difficult to steadily migrate.


    If Rust works for you today, you should use it. But moving a C++ ecosystem to
    Rust is hard.


    To that end, while Carbon has many of the same goals as Rust, such as helping
    developers to create “performance-critical software,” Carbon is also intended
    to be fully interoperable with existing C++ code. Additionally, the goal is to
    make migrating from C++ to Carbon as easy as possible, if desired.


    As for why a C++ developer may want to consider introducing Carbon to their codebase,
    Carruth shared quite a few highlights of the language on stage:


    - Introducer keywords and a simple grammarFunction() input parameters are readonly
    values

    - Pointers provide indirect access & mutation

    - Use expressions to name types

    - The package is the root namespace

    - Import APIs through their package name

    - Explicit object parameter declares a method

    - Single inheritance; classes are final by default

    - Powerful, definition-checked generics

    - Types explicitly implement interfaces


    Beyond the features of the language itself, the Carbon team drew attention to
    the development process that will shape Carbon’s future. The project’s code is
    hosted publicly on GitHub and is open for pull requests, while Carbon’s culture
    is outlined to be accessible and inclusive for employees of companies and private
    individuals, alike.


    That said, one aspect of the Carbon programming language that’s not particularly
    well outlined is Google’s involvement. While today’s presentation was shared by
    a Googler, and the current project leads for Carbon consist primarily — but not
    entirely — of Googlers, there’s otherwise no mention of Carbon being a Google
    project.


    This is actually intentional, as while Carbon got its start within Google, the
    team understands and has shared online that for it to have any future success,
    Carbon needs to be “an independent and community driven project,” not solely driven
    by Google’s own uses. In the same comment, Carruth further emphasizes that Carbon
    is currently just an experiment, albeit one that some companies have already shown
    early interest in.


    If you’re interested in getting started with Carbon, you can download the source
    code and experiment with it on your own device. Or, you can get a feel for the
    Carbon programming language directly in your browser thanks to integration with
    the free Compiler Explorer web app.


    # Google’s New Programming Language is Called Carbon


    It will also have a practically safe testing mechanism which would be improved
    for advanced types of code. Performance critical goal would also be the main goal
    for the Carbon programming language.


    Lastly, I am a C++ programmer for a very long time now and I am super excited
    to see how the successor of C++ would fulfill its drawbacks. The event also mentioned
    it would have an underlying mechanism of C++ and Golang. Currently, it is only
    in its experimental stage and soon it will be launched in its beta stage.


    You could also learn more about carbon and get involved in it as it is open source
    on its official GitHub page.


    # Interoperability Philosophy and Goals


    ## Background


    Interoperability with and migration from C++ are a language goal. However, performance
    and evolution are higher priorities. This interaction of priorities is important
    to understanding Carbon''s interoperability goals and trade-offs.


    ### Other interoperability layers


    Other language interoperability layers that may offer useful examples are:


    * Java/Kotlin should be a comparable interoperability story. The languages are
    different, but share an underlying runtime. This may be closest to the model we
    desire for Carbon.

    * JavaScript/TypeScript is similar to C/C++, where one language is essentially
    a subset of the other, allowing high interoperability. This is an interesting
    reference point, but we are looking at a different approach with a clearer boundary.

    * C++/Java is an example of requiring specialized code for the bridge layer, making
    interoperability more burden on developers. The burden of the approach may be
    considered to correspond to the difference in language memory models and other
    language design choices. Regardless, the result can be considered higher maintenance
    for developers than we want for Carbon.

    * C++/Go is similar to C++/Java. However, Go notably allows C++ bridge code to
    exist in the `.go` files, which can ease maintenance of the bridge layer, and
    is desirable for Carbon.


    ## Philosophy


    The C++ interoperability layer of Carbon allows a subset of C++ APIs to be accessed
    from Carbon code, and similarly a subset of Carbon APIs to be accessed from C++
    code. This requires expressing one language as a subset of the other. Bridge code
    may be needed to map some APIs into the relevant subset, but the constraints on
    expressivity should be loose enough to keep the amount of such bridge code sustainable.


    The design for interoperability between Carbon and C++ hinges on:


    * The ability to interoperate with a wide variety of code, such as classes/structs
    and templates, not just free functions.

    * A willingness to expose the idioms of C++ into Carbon code, and the other way
    around, when necessary to maximize performance of the interoperability layer.

    * The use of wrappers and generic programming, including templates, to minimize
    or eliminate runtime overhead.


    These things come together when looking at how custom data structures in C++ are
    exposed into Carbon, and the other way around. In both languages, it is reasonable
    and even common to have customized low-level data structures, such as associative
    containers. For example, there are numerous data structures for mapping from a
    key to a value that might be best for a particular use case, including hash tables,
    linked hash tables, sorted vectors, and btrees. Even for a given data structure,
    there may be slow but meaningful evolution in implementations strategies.


    The result is that it will often be reasonable to directly expose a C++ data structure
    to Carbon without converting it to a "native" or "idiomatic" Carbon data structure.
    Although interfaces may differ, a trivial adapter wrapper should be sufficient.
    Many Carbon data structures should also be able to support multiple implementations
    with C++ data structures being one such implementation, allowing for idiomatic
    use of C++ hidden behind Carbon.


    The reverse is also true. C++ code will often not care, or can be refactored to
    not care, what specific data structure is used. Carbon data structures can be
    exposed as yet another implementation in C++, and wrapped to match C++ idioms
    and even templates.


    For example, a C++ class template like `std::vector<T>` should be usable without
    wrapper code or runtime overhead, and passing a Carbon type as `T`. The resulting
    type should be equally usable from either C++ or Carbon code. It should also be
    easy to wrap `std::vector<T>` with a Carbon interface for transparent use in idiomatic
    Carbon code.

