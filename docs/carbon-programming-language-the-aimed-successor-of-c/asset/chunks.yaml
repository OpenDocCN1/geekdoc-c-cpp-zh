  trans: '


    在 Carbon 中，与 C++ 的互操作性将被频繁使用，无论它是 C++ 开发者尝试 Carbon、增量地迁移大型 C++ 代码库，还是长期使用某个 C++
    库。在所有情况下，必须能够以零开销编写互操作代码；不能需要任何拷贝。


    ### 易于阅读、理解和编写的代码


    与互操作性相关的 Carbon 代码可能比其他更符合习惯的 Carbon 代码更难读。这没关系：目标是让 Carbon 代码具有可读性并不意味着它必须变得浅而易懂。同时，互操作性给
    Carbon 开发者带来的额外成本应该降到最低。


    ### 软件和语言演进


    互操作性将要求 Carbon 添加一些功能，这些功能主要用于支持互操作性用例。然而，这些功能不应过度影响 Carbon 的整体演进。特别是，只有一部分 Carbon
    功能将支持与 C++ 的互操作性。这样做将限制 Carbon 的功能集。


    ### 与现有 C++ 代码的互操作以及从中迁移


    Carbon 互操作性的语言目标将聚焦于对 C++17 的兼容性。语言设计必须考虑到优先顺序；只要对互操作性和 Carbon 整体带来更大的收益，就可以做出可能损害其他目标的权衡。


    尽管以下特定的互操作性目标将聚焦于互操作性，但考虑迁移将受到什么影响也很重要。如果互操作性需要复杂的工作（特别是为了避免对性能的影响），它可能会损害将 C++
    代码库增量迁移到 Carbon 的能力。


    ### 性的安全保证和测试机制


    维护互操作代码周围的安全性至关重要，并应尽可能提供缓解措施。然而，安全保证将集中在原生 Carbon 代码上。C++ 代码将无法获得 Carbon 提供的同套安全机制，因此调用
    C++ 的 Carbon 代码将面临更高的安全风险。


    ### 现代操作系统平台、硬件架构和环境


    互操作性将适用于 Carbon 和 C++ 都支持的环境的交集。从实用角度来看，Carbon 可能是这里的限制因素。


    ### 快速且可扩展的开发


    互操作层可能会有与 C++ 类似的工具限制。例如，Carbon 的目标是快速编译。然而，C++ 互操作性取决于编译 C++ 代码，而这是相对慢的。使用互操作性的
    Carbon 库将面临 C++ 编译时间的瓶颈。改进 C++ 不在 Carbon 的范围之内。


    ## 目标


    ###  C++ 内存模型


    任何 Carbon 互操作代码都必须能够兼容 C++ 内存模型。这并不意味着 Carbon 必须专门使用 C++ 内存模型，只需要支持它即可。


    ### 在 Carbon 文件中允许 C++ 桥接代码


    Carbon 文件应该支持用 C++ 编写的内联桥接代码。在需要桥接代码的地方，这将允许直接在使用它的代码旁边对其进行维护。


    ### 支持混合 Carbon 和 C++ 工具链


    Carbon 工具链将支持编译 C++ 代码。它将包含一个自定义的 C++ 编译器，启用一些更高级的互操作性功能，例如从 C++ 调用 Carbon 模板。


    工具链混合也支持双向支持：


    *   由非 Carbon 工具链编译的 C++ 库可以在 Carbon 中使用，只要它们与 Carbon 的 C++ 工具链保持 ABI 兼容。

    *   Carbon 工具链将支持一种选项，即从 Carbon 库生成 C++ 头文件和对象文件，其 ABI 适用于非 Carbon 工具链。


    混合工具链将功能限制在 C++ ABI 可行的范围内。例如，开发者应该预料到，在使用 Carbon 工具链时，可以从 C++ 调用 Carbon 模板，而在混合工具链时将不可用，因为这将需要一个实质然不同且更复杂的互操作实现。这种降级的互操作性对于大多数开发者来说仍然应该是足够的，尽管可能需要更多的桥接代码。


    任何在混合工具链下可工作的 C++ 互操作代码，在使用原生 Carbon 工具链时也必须可工作。混合工具链支持不能有语义差异。反之则不然，原生 Carbon
    工具链可能具有额外的语言支持和优化。


    ### 最小化桥接代码


    大多数简单的 C++ 函数和类型应该能够从 Carbon 直接使用，而不需要任何自定义桥接代码，也不需要任何运行时开销。这意味着 Carbon 代码应该能够调用大多数
    C++ 代码，而无需为了支持互操作而对代码进行任何更改，即使该代码是用非 Carbon 工具链构建的。这包括使用 C++ 类型实例化 Carbon 模板或泛型。


    在另一个方向，Carbon 可能需要一些少量的标记来将函数和类型暴露给 C++。这有助于避免要求 Carbon 无条件地生成 C++ 兼容的端点，因为这可能会带来许多情况下不必要的编译和链接开销。此外，它还应该帮助产生错误，指示何时函数或类型可能需要额外的更改以与
    C++ 兼容。


    Carbon 的开发者应该能够轻松地复用第三方提供的成熟 C++ 库生态系统。第三方库的语言选择不应成为采用 Carbon 的障碍。


    即使对于原生库，由于执行和验证源码迁移的人力成本，将 C++ 代码库迁移到 Carbon 通常往往是增量的。预计最小化所需的桥接代码量将简化此类迁移。


    ### 支持对高级 C++ 特性的使用


    应该支持对高级 C++ 特性的多数惯用用法。几个例子是模板、重载 set、属性和 ADL。


    尽管这些特性可以被认为是“高级”的，但它们在整个 C++ 代码（包括 STL）中被广泛使用。支持这些特性是 C++ 特性迁移的关键。


    ### 支持基础的 C 互操作


    C 互操作性的支持必须足够让 Carbon 代码调用用 C 编写的流行 API。C 调用 Carbon 的将受到更多限制，限于类似于 C++ 互操作支持的地方。基础
    C 互操作将包括函数、基本类型和仅包含成员变量的结构体。


    互操作性依赖更高级的 C 特有功能（如模板、继承和类函数）的功能不需要为 C 提供支持。这些需要一个特定的 C 互操作模型，而该模型将不会被包含。


    ### C++ 与 Carbon 类型之间自然的映射


    Carbon 将为常用类型提供意料之外的映射。


    基本类型将具有零开销转换的映射。它们被频繁使用，因此互操作代码能够无缝使用它们非常重要。


    存储和表示在两种语言中需要是等等的。例如，如果 C++ 的 `__int64` 映射到 Carbon 的 `Int64`，则两种类型的内存布局必须相同。


    语义需要相似，但边缘情况的行为不需要相同，这允许 Carbon 灵活地演进。例如，当 C++ 在整数上进行取模回绕时，Carbon 在默认映射的基本类型上可以产生异常行为。


    Carbon 可能拥有这些类型的无 C++ 映射的版本，例如 `Int256`。


    '
- fmt: '

    Other vocabulary types will typically have reasonable, but potentially non-zero
    overhead, conversions available to map into Carbon vocabulary types. Code using
    these may choose whether to pay the overhead to convert. They may also use the
    C++ type directly from Carbon code, and the other way around.


    Incomplete types must have a mapping with similar semantics, similar to primitive
    types.


    ## Carbon inheritance from C++ types


    Carbon will support inheritance from C++ types for interoperability, although
    the syntax constructs may look different from C++ inheritance. This is considered
    necessary to address cases where a C++ library API expects users to inherit from
    a given C++ type.


    This might be restricted to pure interface types; see the open question.


    ## Non-goals


    ### Never require bridge code


    Corner cases of `C++` will not receive equal support to common cases: the complexity
    of supporting any given construct must be balanced by the real world need for
    that support. For example:


    * Interoperability will target `C++17`. Any interoperability support for future
    versions of `C++`, including features such as `C++20` modules, will be based on
    a cost-benefit analysis. Exhaustive support should not be assumed.

    * Support will be focused on idiomatic code, interfaces, and patterns used in
    widespread open source libraries or by other key constituencies. `C++` code will
    have edge cases where the benefits of limiting Carbon''s maintenance costs by
    avoiding complex interoperability outweighs the value of avoiding bridge code.

    * Support for low-level `C` ABIs may be focused on modern 64-bit ABIs, including
    Linux, `POSIX`, and a small subset of Windows'' calling conventions.


    ### Convert all C++ types to Carbon types


    Non-zero overhead conversions should only be supported, never required, in order
    to offer reliable, unsurprising performance behaviors. This does not mean that
    conversions will always be supported, as support is a cost-benefit decision for
    specific type mappings. For example, consider conversions between `std::vector<T>`
    and an equivalent, idiomatic Carbon type:


    * Making conversions zero-overhead would require the Carbon type to mirror the
    memory layout and implementation semantics of `std::vector<T>`. However, doing
    so would constrain the evolution of the Carbon type to match `C++`. Although some
    constraints are accepted for most primitive types, it would pose a major burden
    on Carbon''s evolution to constrain Carbon''s types to match `C++` vocabulary
    type implementations.

    * These conversions may not always be present, but `std::vector<T>` is a frequently
    used type. As a result, it can be expected that there will be functions supporting
    a copy-based conversion to the idiomatic Carbon type.

    * An interface which can hide the difference between whether `std::vector<T>`
    or the equivalent, idiomatic Carbon type is in use may also be offered for common
    types.

    * It will still be normal to handle `C++` types in Carbon code without conversions.
    Developers should be given the choice of when to convert.


    ### Cross-language metaprogramming


    Carbon''s metaprogramming design will be more restrictive than `C++`s preprocessor
    macros. Although interoperability should handle simple cases, such as `#define
    STDIN_FILENO 0`, complex metaprogramming libraries may require a deep ability
    to understand code rewrites. It should be reasonable to have these instead rewritten
    to use Carbon''s metaprogramming model.


    ### Support for C++ exceptions without bridge code


    Carbon may not provide seamless interoperability support for `C++` exceptions.
    For example, translating `C++` exceptions to or from Carbon errors might require
    annotations or bridge code, and those translations may have some performance overhead
    or lose information. Furthermore, if Carbon code calls a `C++` function without
    suitable annotations or bridging, and that function exits with an exception, the
    program might terminate.


    ### Full parity between a Carbon-only toolchain and mixing C++/Carbon toolchains


    Making mixed `C++`/Carbon` toolchain support equivalent to Carbon-only toolchain
    support affects all interoperability features. Mixed toolchains will have degraded
    support because full parity would be too expensive.


    The feature of calling Carbon templates from `C++` code is key when analyzing
    this option. Template instantiation during compilation is pervasive in `C++`.


    With a Carbon toolchain compiling both Carbon and `C++` code, the `C++` compiler
    can be modified to handle Carbon templates differently. Carbon templates can be
    handled by exposing the Carbon compiler''s AST to the `C++` compiler directly,
    as a compiler extension. While this approach is still complex and may not always
    work, it should offer substantial value and ability to migrate `C++` code to Carbon
    without requiring parallel maintenance of implementations in `C++`.


    With a mixed toolchain, the `C++` compiler cannot be modified to handle Carbon
    templates differently. The only way to support template instantiation would be
    by having Carbon templates converted into equivalent `C++` templates in `C++`
    headers; in other words, template support would require source-to-source translation.
    Supporting Carbon to `C++` code translations would be a complex and high cost
    feature to achieve full parity for mixed toolchains. Requiring bridge code for
    mixed toolchains is the likely solution to avoid this cost.


    Note that this issue differs when considering interoperability for Carbon code
    instantiating `C++` templates. The `C++` templates must be in `C++` headers for
    re-use, which in turn must compile with the Carbon toolchain to re-use the built
    C++` code, regardless of whether a separate `C++` toolchain is in use. This may
    also be considered a constraint on mixed toolchain interoperability, but it''s
    simpler to address and less likely to burden developers.


    To summarize, developers should expect that while most features will work equivalently
    for mixed toolchains, there will never be full parity.


    ### Offer equivalent support for languages other than C++


    Long-term, it should be anticipated that Carbon will add interoperability with
    non-`C++` languages. However, interoperability discussions will be focused on
    `C++` in order to support the language goal. Although we should work to consider
    extensibility when building interoperability facilities, `C++` should be expected
    to have more robust support.


    Many languages do offer interoperability layers with C. Carbon''s C interoperability
    will likely offer a degree of multi-language interoperability using C as an intermediary.


    ## Open questions to be resolved later


    ### CRTP support


    Although `CRTP` is a common technique in `C++`, interoperability support may require
    substantial work. Libraries based on use of `CRTP` may require bridge code or
    a rewrite for Carbon interoperability.


    More analysis should be done on the cost-benefit of supporting `CRTP` before making
    a support decision.


    ### Object lifetimes


    Carbon may have a different object lifetime design than `C++`. For example, Carbon
    may choose different rules for determining the lifetime of temporaries. This could
    affect idiomatic use of `C++` APIs, turning code that would be safe in `C++` into
    unsafe Carbon code, requiring developers to learn new coding patterns.


    More analysis should be done on object lifetimes and potential Carbon designs
    for it before deciding how to treat object lifetimes in the scope of interoperability.


    ### Carbon type inheritance from non-pure interface C++ types


    Some `C++` APIs will expect that consumers use classes that inherit from a type
    provided by the API. It''s desirable to have Carbon support, in some way, inheritance
    from API types in order to use these APIs.


    It may be sufficient to require the parent type be a pure interface, and that
    APIs with either use bridge code or switch implementations. That will be determined
    later.

