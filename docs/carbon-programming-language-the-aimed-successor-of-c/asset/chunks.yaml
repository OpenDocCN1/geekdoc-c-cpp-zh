    ## Fast and works with C++


    C++, which sees a significant amount of use within Google, is similarly a successor
    of sorts to the original C programming language. While some may suggest that Rust,
    originally a Mozilla project that has since grown to have a significant public
    following, is a successor to C++, Carruth wonders if the analogy still follows.
    It doesn’t have the same “bi-directional interoperability” of something like Java
    & Kotlin.


