    # Launching of Carbon


    Carbon is an experimental general-purpose programming language created by Google
    to be a "C++ successor language". It was first presented to the public by Chandler
    Carruth at the CppNorth conference in July of 2022\. The language intends to fix
    several perceived shortcomings of C++ but otherwise provide a similar feature
    set. The main goals of language are readability and "bi-directional interoperability"
    so there will not be a language barrier like Rust had. The language will be designed
    and developed on GitHub, as opposed to the ISO process C++ uses.


    | Name | Carbon |


    | Family | C |


    | Developer | Google |


    | First appeared | 19 July 2022; 6 days ago |


    | Preview release | 0.1 / 19 July 2022; 6 days ago |


    | Typing discipline | Static, nominative, partially inferred |


    | Implementation language | C++ |


    | OSFilename extensions | Cross-platform.carbon |


    | Website | https://github.com/carbon-language/carbon-lang |


    | Influenced | C++, Rust |


    Carbon, the latest programming language to be built within Google, was unveiled
    in the month july of 20 as an experimental successor to C++.


    Over the years, Google has created a few programming languages, some of which
    have become more popular and prominent than others. For example, Golang (or simply
    Go) was created for the purpose of improving the development of servers and distributed
    systems and has since been adopted by the public. Meanwhile, the Dart programming
    language, originally intended as something of an alternative to JavaScript, didn’t
    reach mainstream popularity until the release of Flutter.


    On the 19th of july 2022, at the Cpp North convention in Toronto, Googler Chandler
    Carruth shared the vision for a new programming language called Carbon. To set
    the scene, Carruth showed how many of today’s most popular programming languages
    have successors that allow developers to be rapidly productive and also take advantage
    of modern language design.


    Android developers well know that Kotlin serves as a successor to Java, just as
    iOS developers know Swift is the successor to Objective-C. TypeScript, from Microsoft,
    has thoroughly enhanced JavaScript, while remaining comfortable to use and able
    to be “transpiled” back to JavaScript. C++, which sees a significant amount of
    use within Google, is similarly a successor of sorts to the original C programming
    language.


    While some may suggest that Rust, originally a Mozilla project that has since
    grown to have a significant public following, is a successor to C++, Carruth wonders
    if the analogy still follows. While Rust is undeniably a great language to start
    a new project in, it doesn’t have the same “bi-directional interoperability” of
    something like Java & Kotlin, making it difficult to steadily migrate.


    To that end, while Carbon has many of the same goals as Rust, such as helping
    developers to create “performance-critical software,” Carbon is also intended
    to be fully interoperable with existing C++ code. Additionally, the goal is to
    make migrating from C++ to Carbon as easy as possible, if desired.'
