- fmt: '

    Interoperability with C++ will be frequently used in Carbon, whether it''s C++
    developers trying out Carbon, incrementally migrating a large C++ codebase, or
    continuing to use a C++ library long-term. In all-cases, it must be possible to
    write interoperable code with zero overhead; copies must not be required.


    ### Code that is easy to read, understand, and write


    Interoperability-related Carbon code will likely be more difficult to read than
    other, more idiomatic Carbon code. This is okay: aiming to make Carbon code readable
    doesn''t mean that it needs to all be trivial to read. At the same time, the extra
    costs that interoperability exerts on Carbon developers should be minimized.


    ### Software and language evolution


    Interoperability will require the addition of features to Carbon which exist primarily
    to support interoperability use cases. However, these features must not unduly
    impinge the overall evolution of Carbon. In particular, only a subset of Carbon
    features will support interoperability with C++. To do otherwise would restrict
    Carbon''s feature set.


    ### Interoperability with and migration from existing C++ code


    Carbon''s language goal for interoperability will focus on C++17 compatibility.
    The language design must be mindful of the prioritization; trade-offs harming
    other goals may still be made so long as they offer greater benefits for interoperability
    and Carbon as a whole.


    Although the below interoperability-specific goals will focus on interoperability,
    it''s also important to consider how migration would be affected. If interoperability
    requires complex work, particularly to avoid performance impacts, it could impair
    the ability to incrementally migrate C++ codebases to Carbon.


    ### Practical safety guarantees and testing mechanisms


    Safety is important to maintain around interoperability code, and mitigations
    should be provided where possible. However, safety guarantees will be focused
    on native Carbon code. C++ code will not benefit from the same set of safety mechanisms
    that Carbon offers, so Carbon code calling into C++ will accept higher safety
    risks.


    ### Modern OS platforms, hardware architectures, and environments


    Interoperability will apply to the intersection of environments supported by both
    Carbon and C++. Pragmatically, Carbon will likely be the limiting factor here.


    ### Fast and scalable development


    The interoperability layer will likely have tooling limitations similar to C++.
    For example, Carbon aims to compile quickly. However, C++ interoperability hinges
    on compiling C++ code, which is relatively slow. Carbon libraries that use interoperability
    will see bottlenecks from C++ compile time. Improving C++ is outside the scope
    of Carbon.


    ## Goals


    ### Compatibility with the C++ memory model


    It must be straightforward for any Carbon interoperability code to be compatible
    with the C++ memory model. This does not mean that Carbon must exclusively use
    the C++ memory model, only that it must be supported.


    ### Allow C++ bridge code in Carbon files


    Carbon files should support inline bridge code written in C++. Where bridge code
    is necessary, this will allow for maintenance of it directly alongside the code
    that uses it.


    ### Support mixing Carbon and C++ toolchains


    The Carbon toolchain will support compiling C++ code. It will contain a customized
    C++ compiler that enables some more advanced interoperability features, such as
    calling Carbon templates from C++.


    Mixing toolchains will also be supported in both directions:


    * C++ libraries compiled by a non-Carbon toolchain will be usable from Carbon,
    so long as they are ABI-compatible with Carbon''s C++ toolchain.

    * The Carbon toolchain will support, as an option, generating a C++ header and
    object file from a Carbon library, with an ABI that''s suitable for use with non-Carbon
    toolchains.


    Mixing toolchains restricts functionality to what''s feasible with the C++ ABI.
    For example, developers should expect that Carbon templates will be callable from
    C++ when using the Carbon toolchain, and will not be available when mixing toolchains
    because it would require a substantially different and more complex interoperability
    implementation. This degraded interoperability should still be sufficient for
    most developers, albeit with the potential of more bridge code.


    Any C++ interoperability code that works when mixing toolchains must work when
    using the native Carbon toolchain. The mixed toolchain support must not have semantic
    divergence. The converse is not true, and the native Carbon toolchain may have
    additional language support and optimizations.


    ### Minimize bridge code


    The majority of simple C++ functions and types should be usable from Carbon without
    any custom bridge code and without any runtime overhead. That is, Carbon code
    should be able to call most C++ code without any code changes to add support for
    interoperability, even if that code was built with a non-Carbon toolchain. This
    includes instantiating Carbon templates or generics using C++ types.


    In the other direction, Carbon may need some minimal markup to expose functions
    and types to C++. This should help avoid requiring Carbon to generate C++-compatible
    endpoints unconditionally, which could have compile and linking overheads that
    may in many cases be unnecessary. Also, it should help produce errors that indicate
    when a function or type may require additional changes to make compatible with
    C++.


    Carbon''s priority developers should be able to easily reuse the mature ecosystem
    of C++ libraries provided by third-parties. A third-party library''s language
    choice should not be a barrier to Carbon adoption.


    Even for first-party libraries, migration of C++ codebases to Carbon will often
    be incremental due to human costs of executing and verifying source migrations.
    Minimizing the amount of bridge code required should be expected to simplify such
    migrations.


    ### Support use of advanced C++ features


    There should be support for most idiomatic usage of advanced C++ features. A few
    examples are templates, overload sets, attributes and ADL.


    Although these features can be considered "advanced", their use is widespread
    throughout C++ code, including STL. Support for such features is key to supporting
    migration from C++ features.


    ### Support basic C interoperability


    C interoperability support must be sufficient for Carbon code to call popular
    APIs that are written in C. The ability of C to call Carbon will be more restricted,
    limited to where it echoes C++ interoperability support. Basic C interoperability
    will include functions, primitive types, and structs that only contain member
    variables.


    Features where interoperability will rely on more advanced C-specific features,
    such as templates, inheritance, and class functions, need not be supported for
    C. These would require a C-specific interoperability model that will not be included.


    ### Unsurprising mappings between C++ and Carbon types


    Carbon will provide unsurprising mappings for common types.


    Primitive types will have mappings with zero overhead conversions. They are frequently
    used, making it important that interoperability code be able to use them seamlessly.


    The storage and representation will need to be equivalent in both languages. For
    example, if a C++ `__int64` maps to Carbon''s `Int64`, the memory layout of both
    types must be identical.


    Semantics need to be similar, but edge-case behaviors don''t need to be identical,
    allowing Carbon flexibility to evolve. For example, where C++ would have modulo
    wrapping on integers, Carbon could instead have trapping behavior on the default-mapped
    primitive types.


    Carbon may have versions of these types with no C++ mapping, such as `Int256`.


    Non-owning vocabulary types, such as pointers and references, will have transparent,
    automatic translation between C++ and Carbon non-owning vocabulary types with
    zero overhead.

