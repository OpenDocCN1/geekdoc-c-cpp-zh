    除了 Carbon 与 C++ 之间的互操作性外，我们还计划支持迁移工具，能够机械地将惯用的 C++ 代码翻译为 Carbon 代码，帮助您将现有的 C++
    代码库迁移到 Carbon。


    # 语言目标


    我们正在设计 Carbon 以支持：


    - 性能敏感型软件

    - 软件和语言的进化

    - 易读、易懂、易的代码

    - 实用的安全测试机制

    - 快速且可扩展的开发

    - 现代操作系统、硬件架构和环境

    - 与现有 C++ 代码的互操作性以及从其迁移


    虽然许多语言共享这些目标的子集，但 Carbon 的独特之处在于它们的结合。


    我们对 Carbon 也有明确的“非目标”（non-goals），主要包括：


    - 整个语言和库的稳定 ABI

    - 完美的向后或向前兼容


    我们详细的`goals`文档阐述了这些想法，并对我们 Carbon 项目和语言的目标提供了更深入的视角。


    # 内存安全


    安全性，特别是`内存安全`仍然是 C++ 的关键挑战，也是继任语言需要解决的问题。我们的首要任务和重点是立即解决安全领域中重要的、易手而得的问题：


    - 更好地跟踪未初始化状态，加强对初始化的强制执行，并在需要时系统地提供针对初始化 bug 的加固。

    - 设计基础 API 和惯用法，以在调试和强化构建中支持动态边界检查。

    - 拥有一个默认调试构建模式，即使结合`Address Sanitizer` 也比现有 C++ 构建模式更便宜且更全面。


    一旦我们可以将代码迁移到 Carbon，我们将拥有一个简化的语言，在设计空间上有余地添加任何必要的注解或功能，以及像`generics` 这样的基础设施来支持更安全的设计模式。长期来看，我们将在此基础上引入一个安全的
    Carbon 子集。这将是一个庞大且复杂的工程，不会包含在`0.1` 设计中。同时，我们正在密切关注并学习向 C++ 中添加内存安全语义的努力，例如受 Rust
    启发的`lifetime annotations`。


    # Generic 型


    Carbon 提供了一个带有检查定义的`现代泛型系统`，同时仍`支持选择性开启`的`templates` 以实现无缝的 C++ 互操作。与 C++ 模板相比，检查过的泛型具有多个优势：


    - 泛型定义经过完全类型检查，消除了通过实例化来检查错误的需要，并对代码提供了更大的信心。

    - 避免了每次实例化时都重新检查定义的编译开销。

    - 当使用定义检查的泛型时，用例错误信息更清晰，直接显示哪些要求未被满足。

    - 允许自动的、可选的类型擦除和动态分发，无需单独的实现。这可以减少二进制文件的大小并允许异构容器等结构。

    - `强、经过检查的接口`意味着对实现细节的意外依赖减少，并为消费者提供了更清晰的约。


    在不牺牲这些优势的情况下，`Carbon generics` 支持特化，以确保它能够完全解决 C++ 模板的性能敏感型用例。有关 Carbon 泛型的更多信息，请参阅其`design`。


    除了与 C++ 进行简单且强大的互操作外，Carbon 模板可以被细粒度约束并增量迁移到检查过的泛型，且具有平滑的进化路径。


    # 开始使用 Carbon


    你可以通过查看代码库并使用 Carbon explorer 来开始尝试 Carbon：


    # 使用 Homebrew 安装 bazelisk。


    ```bash

    brew install bazelisk

    ```


    # 使用 Homebrew 安装 Clang/LLVM。

    # 许多 Clang/LLVM 版本并未使用我们依赖的选项进行构建。


    ```bash

    brew install llvm

    export PATH="$(brew --prefix llvm)/bin:${PATH}"

    ```


    # 下载 Carbon 的代码。


    ```bash

    git clone https://github.com/carbon-language/carbon-lang

    cd carbon-lang

    ```


    # 编译并运行 explorer。


    ```bash

    bazel run //explorer -- ./explorer/testdata/print/format_only.carbon

    ```


    # Google 的新语言 ''Carbon'' 能比 Rust 更好地替代 C++ 吗？


    ## 我们都需要答案的问题


    Google 工程师认为，大型项目将`现有` C++ 代码库转换为 Rust 是困难的——因此他们创建了一个名为 Carbon 的新“实验性”开源编程语言。


    Carruth 深入探讨了为什么 Carbon 应该被认为是 C++ 语言强大的继任者的一些原因，包括更简单的语法和更流畅的 API 导入。


    Google 的工程师已经在构建将 C++ 翻译成这种新语言的工具。`The New Stack`报道道，“尽管 Carbon 起于 Google 内部项目，但开发团队最终希望在年底之前将
    Google 或任何其他单一公司的贡献减少到 50% 以下，”并补充说，Google 最终希望将项目交给一个独立的软件基金会，在那里的开发将`由志愿者领导`：Carruth
    在 GitHub 页面上解释道，C++ 长期以来一直是构建性能敏感应用程序的首选语言，但深受许多阻碍现代开发者的问题的困扰。它积累了数十年的技术债，带来了作为其前身
    C 语言部分的许多过时做法。Carruth 指责，C++ 的维护者优先考虑向后兼容，以便继续支持 Linux 及其包管理生态等广泛使用的项目。


    该语言的进化也受到官僚主义委员会流程的阻碍，该流程围绕标准化而非设计展开。这可能使得添加新功能变得困难。C++ 在很大程度上采用了一种孤立的开发流程，其中`select
    committee`在可能需要数年的瀑布式流程中做出重要决策。Carruth 写道，“委员会结构的设计是为了确保国家和公司的代表性，而不是建立一个包容、欢迎的专家团队以及积极为语言贡献的人的社区。对委员会和标准的访问受到限制且昂贵，必须参加才能发言，并且决策通过现场投票做出。”


    Carruth 想要通过更开放的`社区主导环境`来构建 Carbon。该项目将在`GitHub` 上维护，并在`Discord` 上讨论……设计团队希望在年底前发布一个核心工作版本（“0.1”）。文章指出，Carbon
    将拥有`generics` 和内存安全（包括动态边界检查）等现代功能。而且“开发团队还将致力于创建一个内置的包管理器，这是 C++ 极度缺失的。”

