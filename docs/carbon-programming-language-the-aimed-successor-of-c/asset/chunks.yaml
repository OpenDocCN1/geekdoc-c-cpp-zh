    除了语言本身的特性外，Carbon 团队还关注了将塑造 Carbon 未来的开发流程。该项目的代码公开托管在 GitHub 上，并开放接受拉取请求（pull\
    \ requests），同时，Carbon 的文化被概述为对公司员工和个人人士来说都是易于获取且包容的。\n\n尽管如此，`Carbon` 编程语言的一个尚未被特别说明的方面是\
    \ Google 的参与。虽然今天的演示是由一名 Google 工程师分享的，且目前的 `Carbon` 项目负责人主要（但并非全部）由 Google 工程师组成，但在其他地方并没有提到\
    \ `Carbon` 是 Google 的项目。\n\n这实际上是刻意为之，虽然 `Carbon` 起于 Google 内部，但团队理解并在网上分享，为了取得任何未来的成功，`Carbon`\
    \ 需要成为“一个独立且由社区驱动的项目”，而不是仅仅由 Google 自身的用途驱动。在同一条评论中，Carruth 进一步强调 `Carbon` 目前仅仅是一个实验，尽管一些公司已经对其表现出早期兴趣。\n\
    \n如果你感兴趣开始使用 `Carbon`，可以下载源代码并在自己的设备上进行实验。或者，得益于与免费的 `Compiler Explorer` Web 应用集成，你可以直接在浏览器中体验\
    \ `Carbon` 编程语言。\n\n## Google 的 Carbon 编程语言旨在取代 C++\n\n于 2022 年 7 月 19 日周二发布的所谓\
    \ `Carbon` 语言（`C++` 的继承者），据说是 `C++` 的实验性替代方案。\n\nCarruth 表示，尽管许多人可能认为 `Rust` 是\
    \ `C++` 的继承者，但它缺乏 `Carbon` 所提供的“双向互操作性”水平。\n\n他说 `Carbon` 旨在与现有的 `C++` 代码完全兼容，并补充说目标是让从\
    \ `C++` 到 `Carbon` 的过渡尽可能容易。\n\nGoogle 新编程语言的亮点包括：\n\n- 引入词和简单的语法法\n- 函数输入参数是只读值\n\
    - 指针提供间接访问和变异\n- 使用表达式为类型命名\n- 包是根命名空间\n- 通过其包名导入 API\n- 显式对象参数声明方法\n- 单继承 ——\
    \ 类默认为 final（不可继承）\n- 强大的、定义检查的泛型\n- 类型显式实现接口\n\n有趣的是，Google 注意，为了让这种语言成功，`Carbon`\
    \ 必须是一个“独立的由社区驱动的项目”，而不仅仅供 Google 使用。\n\n因此，虽然 `Carbon` 目前的大多数负责人是 Google 开发者，但尚没有明确信息将其归类为\
    \ Google 项目。\n\n`Carbon` 的源代码可以在 GitHub 上获得，并开放拉取请求。\n\n`https://github.com/carbon-language/carbon-lang#carbon-language--an-experimental-successor-to-c`\n\
    \n## 现代且演进\n\n- 坚实的语言基础，易于学习，特别是如果你使用过 `C++`\n- `Carbon` 版本之间基于工具的简单升级\n- 更安全的基础以及走向内存安全子集的增量路径\n\
    \n## 快速且与 C++ 兼容\n\n- 使用 `LLVM` 性能匹配 `C++`，提供位和地址的底层访问\n- 与你现有的 `C++` 代码互操作，从继承到模板\n\
    - 快速且可扩展的构建，可与你现有的 `C++` 构建系统协同工作\n\n## 欢迎开源社区\n\n- 明确的目标和优先级，以及稳健的治理\n- 致力于做到欢迎、包容和友好的社区\n\
    - “电池全备”方法：编译器、库、文档、工具、包管理器等更多\n\n# 为什么要构建 Carbon？\n\n`C++` 仍然是性能关键型软件的主导编程语言，拥有庞大且不断增长代码库和投资。然而，如上述所示，它在改进和满足开发者需求方面正挣扎，这很大程度上归于积累了数十年的技术债。增量改进\
    \ `C++` 是极其困难的，既是因为技术债本身，也是因为其演进过程中的挑战。解决这些问题的最佳方法是避免直接继承 `C` 或 `C++` 的遗产，而是从坚实的语言基础开始，如现代泛型系统、模块化代码组织以及一致简单的语法。\n\
    \n现有的现代语言已经提供了优秀的开发者体验：`Go`、`Swift`、`Kotlin`、`Rust` 等。能够使用这些一种现有语言的开发者应该去使用。遗憾的是，这些语言的设计为从\
    \ `C++` 采用和迁移构成了巨大的障碍。这些障碍从软件惯用设计的变化到性能开销不等。\n\n`Carbon` 从根本上是一种后继语言方法，而不是对 `C++`\
    \ 进行增量演变的尝试。它是围绕与 `C++` 的互操作以及针对现有 `C++` 代码库和开发者的大规模采用和迁移而设计的。`C++` 的继承语言需要：\n\
    \n- 性能匹配 `C++`，这对我们的开发者来说是一个基本属性。\n- 与 `C++` 进行无缝的双向互操作，使得现有 `C++` 栈中任何地方的库都可以采用\
    \ `Carbon` 而无需迁移其他部分。\n- 对于 `C++` 开发者具有良好的学习曲线和合理的熟悉度。\n- 对现有软件的设计和架构具有相当的表达力和支持。\n\
    - 可扩展的迁移，对惯用的 `C++` 代码进行某种程度的源源翻译。\n\n通过这种方法，我们可以在 `C++` 现有生态系统之上构建，并引入现有的投资、代码库和开发者群体。一些语言在其他生态系统中遵循了这种模型，`Carbon`\
    \ 旨在为 `C++` 扮演类似的角色：\n\n- `JavaScript` → `TypeScript`\n- `Java` → `Kotlin`\n-\
    \ `C++` → `Carbon`\n\n# 项目状态\n\n`Carbon` 目前是一个实验性项目。我们想进一步了解是否可以构建一种符合我们继承语言标准的语言，以及该语言是否能在更大的\
    \ `C++` 行业和社区内聚集大量的关注。\n\n目前，我们已经完善了项目和语言的几个核心方面：\n\n- 语言和项目的策略。\n- 开源项目结构、治理模型和演进流程。\n\
    - 基于我们对 `C++` 的经验设计的语言关键和基础方面，以及我们预期的挑战。这包括了：\n    - 泛型\n    - 类类型\n    - 继承\n\
    \    - 运算符重载\n    - 词法语法结构\n    - 代码组织和模块结构\n\n一个原型解释器演示，可以运行示例并对 `Carbon` 的特定语义模型和抽象机器进行详细分析。我们将其称为\
    \ Carbon Explorer。\n\n我们目前专注于从 `C++` 社区获取更广泛的反馈和参与，完成 0.1 语言设计，并完成该设计的 Carbon\
    \ Explorer 实现。之后，我们计划优先考虑 `C++` 互性和能够实现 0.1 语言并用于详细评估 Carbon 的现实工具链。\n\n## Carbon\
    \ 和 C++\n\n如果你已经是一个 `C++` 开发者，`Carbon` 应该具有平缓的学习曲线。它由一组一致的语言结构构建，应该让你很熟悉并且易于阅读和理解。\n\
    \n这样的 `C++` 代码：\n\n对应这段 Carbon 代码：\n\n你可以无开销地从 `C++` 调用 `Carbon`，反之亦然。这意味着你可以在应用程序内部将单个\
    \ `C++` 库迁移到 `Carbon`，或者在你现有的 `C++` 投资之上编写新的 `Carbon`。\n\n"
- fmt: '

    Beyond interoperability between Carbon and C++, we''re also planning to support
    migration tools that will mechanically translate idiomatic C++ code into Carbon
    code to help you switch an existing C++ codebase to Carbon.


    # Language Goals


    We are designing Carbon to support:


    - Performancecritical software

    - Software and language evolution

    - Code that is easy to read, understand, and write

    - Practical safety and testing mechanisms

    - Fast and scalable development

    - Modern OS platforms, hardware architectures, and environments

    - Interoperability with and migration from existing C++ code


    While many languages share subsets of these goals, what distinguishes Carbon is
    their combination.


    We also have explicit `non-goals` for Carbon, notably including:


    - A stable ABI for the entire language and library

    - Perfect backwards or forwards compatibility


    Our detailed `goals` document fleshes out these ideas and provides a deeper view
    into our goals for the Carbon project and language.


    # Memory safety


    Safety, and especially `memory safety`, remains a key challenge for C++ and something
    a successor language needs to address. Our initial priority and focus is on immediately
    addressing important, low-hanging fruit in the safety space:


    - Tracking uninitialized states better, increased enforcement of initialization,
    and systematically providing hardening against initialization bugs when desired.

    - Designing fundamental APIs and idioms to support dynamic bounds checks in debug
    and hardened builds.

    - Having a default debug build mode that is both cheaper and more comprehensive
    than existing C++ build modes even when combined with `Address Sanitizer`.


    Once we can migrate code into Carbon, we will have a simplified language with
    room in the design space to add any necessary annotations or features, and infrastructure
    like `generics` to support safer design patterns. Longer term, we will build on
    this to introduce a safe Carbon subset. This will be a large and complex undertaking,
    and won''t be in the `0.1` design. Meanwhile, we are closely watching and learning
    from efforts to add memory safe semantics onto C++ such as Rust-inspired `lifetime
    annotations`.


    # Generic


    Carbon provides a `modern generics system` with checked definitions, while still
    `supporting opt-in` `templates` for seamless C++ interop. Checked generics provide
    several advantages compared to C++ templates:


    - Generic definitions are fully type-checked, removing the need to instantiate
    to check for errors and giving greater confidence in code.

    - Avoids the compile-time cost of re-checking the definition for every instantiation.

    - When using a definition-checked generic, usage error messages are clearer, directly
    showing which requirements are not met

    - Enables automatic, opt-in type erasure and dynamic dispatch without a separate
    implementation. This can reduce the binary size and enables constructs like heterogeneous
    containers.

    - `Strong, checked interfaces` mean fewer accidental dependencies on implementation
    details and a clearer contract for consumers.


    Without sacrificing these advantages, `Carbon generics` support specialization,
    ensuring it can fully address performance-critical use cases of C++ templates.
    For more details about Carbon''s generics, see their `design`.


    In addition to easy and powerful interop with C++, Carbon templates can be constrained
    and incrementally migrated to checked generics at a fine granularity and with
    a smooth evolutionary path.


    # Getting started with Carbon


    You can get started playing with Carbon by checking out the codebase and using
    the Carbon explorer:


    # Install bazelisk using Homebrew.


    ```bash

    brew install bazelisk

    ```


    # Install Clang/LLVM using Homebrew.

    # Many Clang/LLVM releases aren''t built with options we rely on.


    ```bash

    brew install llvm

    export PATH="$(brew --prefix llvm)/bin:${PATH}"

    ```


    # Download Carbon''s code.


    ```bash

    git clone https://github.com/carbon-language/carbon-lang

    cd carbon-lang

    ```


    # Build and run the explorer.


    ```bash

    bazel run //explorer -- ./explorer/testdata/print/format_only.carbon

    ```


    # Can Google''s New Programming Language ''Carbon'' Replace C++ Better Than Rust?


    ## A Question we all need the answer


    It''s difficult for large projects to convert `existing` C++ codebases into Rust,
    argue Google engineers — so they''ve created a new "experimental" open source
    programming language called Carbon.


    Carruth delved into more detail about some of the reasons why Carbon should be
    considered a powerful successor to the C++ language, including simpler grammar
    and smoother API imports.


    Google''s engineers are already building tools to translate C++ into this new
    language. "While Carbon began as a Google internal project, the development team
    ultimately wants to reduce contributions from Google, or any other single company,
    to less than 50% by the end of the year," reports `The New Stack`, adding that
    Google ultimately wants to hand off the project to an independent software foundation
    where development will be `led by volunteers`: Long the language of choice for
    building performance-critical applications, C++ is plagued with a number of issues
    that hamper modern developers, Carruth explained on a GitHub page. It has accumulated
    decades of technical debt, bringing with it many of the outdated practices that
    were part of the language''s predecessor, C. The keepers of C++ prioritize backward
    compatibility, in order to continue to support widely-used projects such as Linux
    and its package management ecosystem, Carruth charged.


    The language''s evolution is also stymied by a bureaucratic committee process,
    oriented around standardization rather than design. Which can make it difficult
    to add new features. C++ has largely a sequestered development process, in which
    a `select committee` makes the important decisions, in a waterfall process that
    can take years. "The committee structure is designed to ensure representation
    of nations and companies, rather than building an inclusive and welcoming team
    and community of experts and people actively contributing to the language," Carruth
    wrote. "Access to the committee and standard is restricted and expensive, attendance
    is necessary to have a voice, and decisions are made by live votes."


    Carruth wants to build Carbon by a more open `community-led environment`. The
    project will be maintained `on GitHub`, and discussed `on Discord`.... The design
    team wants to release a core working version ("0.1") by the end of the year.


    Carbon will boast modern features like `generics` and memory safety (including
    dynamic bounds checks), the article points out. And "The development team will
    also set out to create a built-in package manager, something that C++ sorely lacks."


    # The Aimed successor


    Over the years, Google has created a few programming languages, some of which
    have become more popular and prominent than others. For example, `Golang` (or
    simply `Go`) was created for the purpose of improving the development of servers
    and distributed systems and has since been adopted by the public. Meanwhile, the
    `Dart` programming language, originally intended as something of an alternative
    to JavaScript, didn’t reach mainstream popularity until the release of Flutter.


    At the Cpp North convention in Toronto, as shared by Conor Hoekstra who was in
    attendance and documented the slides, Googler Chandler Carruth shared the vision
    for a new programming language called Carbon. To set the scene, Carruth showed
    how many of today’s most popular programming languages have successors that allow
    developers to be rapidly productive and also take advantage of modern language
    design.

    '
