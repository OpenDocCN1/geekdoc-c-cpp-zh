    尽管有人可能认为 Rust（最初是 Mozilla 的项目，现已发展出庞大的公共用户群）是 C++ 的继任者，但 Carruth 怀疑这种类比是否仍然适用。虽然
    Rust 无疑是启动新项目的绝佳语言，但它并不具备像 Java 和 Kotlin 那样的“双向互操作性”，这使得稳健的迁移变得困难。


    如果 Rust 现在对你行之有效，你就应该使用它。但将 C++ 生态系统迁移到 Rust 是困难的。


    为此，尽管 Carbon 与 Rust 有许多共同目标，例如帮助开发者创建“性能密集型软件”，但 Carbon 的设计目标还旨在与现有的 C++ 代码完全互操作。此外，其目标是让如果需要的话，从
    C++ 迁移到 Carbon 尽可能容易。


    至于为什么 C++ 开发者可能想要考虑在其代码库中引入 Carbon，Carruth 在现场分享了该语言的许多亮点：


    - 引入关键字和简单的语法，`Function()` 输入参数是只读值

    - 指针提供间接访问与变异

    - 使用表达式（expressions）来命名类型

    - 包（package）是根命名空间

    - 通过其包名导入 API

    - 显式对象参数声明方法

    - 单继承；类默认为 final（密封）

    - 强大的、经过定义检查的泛型

    - 类型显式实现接口


    除了语言本身的功能外，Carbon 团队还关注了塑造 Carbon 未来的开发过程。该项目代码公开托管在 GitHub 上，并接受拉取请求（pull requests），而
    Carbon 的文化被概述为对公司员工和个人都是易于获取且具有包容性的。


    尽管如此，Carbon 编程语言的一个尚未特别说明的方面是 Google 的参与情况。虽然今天的演示是由一名 Google 员工分享，且目前的 Carbon
    项目负责人主要（但并非全部）由 Google 员工，但除此之外并没有提到 Carbon 是 Google 的项目。


    这实际上是刻意为之，因为虽然 Carbon 起于 Google，但团队理解并已在线分享，为了取得任何未来的成功，Carbon 需要成为“一个独立且社区驱动的项目”，而不仅由
    Google 自身的需求驱动。在同一条注释中，Carruth 进一步强调 Carbon 目前仅仅是一项实验，尽管一些公司已经表现出了早期的兴趣。


    如果你感兴趣开始使用 Carbon，可以下载源代码并在自己的设备上进行实验。或者，得益于与免费的 Compiler Explorer 网页应用的集成，你可以直接在浏览器中感受
    Carbon 编程语言。


    # Google 的新编程语言名为 Carbon


    它还将拥有一种实务上安全的测试机制，该机制将针对高级类型代码进行改进。性能优化也将是 Carbon 编程语言的主要目标。


    最后，我担任 C++ 程序员已经很久了，我非常期待看到 C++ 的继任者如何弥补它的缺点。活动还提到它将具有基于 C++ 和 Golang 的底层机制。目前，它仅处于实验阶段，很快将进入
    beta 阶段。


    你也可以在其官方 GitHub 页面了解更多关于 carbon 的信息并参与其中。


    # 互操作性哲学与目标


    ## 背景


    与 C++ 互操作以及从 C++ 迁移是该语言的目标。然而，性能和演进具有更高的优先级。这种优先级的相互作用对于理解 Carbon 的互操作目标和权衡至关重要。


    ### 其他互操作层


    其他可能提供有用示例的语言互操作层包括：


    * Java/Kotlin 应该是一个可以比较互操作案例。这两种语言虽然不同，但共享底层运行时。这可能最接近我们对 Carbon 渴望的模型。

    * JavaScript/TypeScript 类似于 C/C++，其中一种语言本质上是另一种语言的子集，允许高互操作性。这是一个有趣的参考点，但我们正在寻找一种边界更清晰的方法。

    * C++/Java 是需要为桥接层编写专门代码的示例，这增加了开发者的互操作负担。这种方法的负担可以被认为对应语言内存模型和其他语言设计选择之间的差异。无论如何，对于开发者来说，其维护成本可能比我们对
    Carbon 要求的高。

    * C++/Go 与 C++/Java 类似。然而，Go 特别允许 C++ 桥接代码存在于 `.go` 文件中，这可以简化桥接层的维护，对 Carbon 来说是理想的。


    ## 哲学


    Carbon 的 C++ 互操作层允许从 Carbon 代码访问 C++ API 的子集，同样也允许从 C++ 代码访问 Carbon API 的子集。这要求将一种语言表示为另一种语言的子集。可能需要桥接代码将某些
    API 映射到相关的子集中，但表达能力的限制应该足够宽松，以保持此类桥接代码的可持续性。


    Carbon 与 C++ 之间互操作的设计依赖于：


    * 与各种代码互操作的能力，例如类/结构体和模板，而不仅仅是自由函数。

    * 在需要最大化互操作层性能时，愿意将 C++ 的惯用法暴露到 Carbon 代码中，反之亦然。

    * 使用封装（wrappers）和泛型编程（包括模板）来最小化或消除运行时开销。


    在观察 C++ 中的自定义数据结构如何暴露到 Carbon 中以及反之时，这些元素汇聚了一起。在这两种语言中，拥有自定义的底层数据结构（如关联容器）是合理甚至是常见的。例如，有许多从键映射到值的数据结构可能最适合特定的用例，包括哈希表、链式哈希表、排序向量和
    B 树。即使对于给定的数据结构，实现策略也可能发生缓慢但有意义的演变。


    结果是，通常将 C++ 数据结构直接暴露给 Carbon 是合理的，无需转换为“原生”或“惯用”的 Carbon 数据结构。虽然接口可能不同，但一个简单的适配器封装（adapter
    wrapper）就足够了。许多 Carbon 数据结构也应该支持多种实现，并将 C++ 数据结构作为其中一种实现，允许在 Carbon 之后隐藏惯用的 C++
    用法。


    反过来情况也是如此。C++ 代码通常不关心，或者可以重构为不关心使用哪种特定的数据结构。Carbon 数据结构可以作为另一种实现暴露在 C++ 中，并封装以匹配
    C++ 的惯用法甚至模板。


    例如，像 `std::vector<T>` 这样的 C++ 类模板可以在不产生封装代码或运行时开销的情况下使用，并将 Carbon 类型作为 `T` 。生成的类型在
    C++ 或 Carbon 代码中同样可用。为 `std::vector<T>` 封装 Carbon 接口应该是容易，以便在惯用的 Carbon 代码中透明使用。

