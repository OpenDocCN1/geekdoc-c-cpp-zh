    ## Introduction


    Carbon, the latest programming language built within Google, was unveiled in the
    month july of 20 as an experimental successor to++. Over the years, Google has
    created a few programming languages, some of which have become more popular and
    prominent than others. For example, Golang (or simply Go) was created for the
    purpose of improving the development of servers and distributed systems and has
    since been adopted by the public. Meanwhile, the Dart programming language, originally
    intended as something of an alternative to JavaScript, didn’t reach mainstream
    popularity until the release of Flutter. On the 19th of july 2022, at the Cpp
    North convention in Toronto, Googler Chandler Carruth shared the vision for a
    new programming language called Carbon. To set the scene, Carruth showed how many
    of today’s most popular programming languages have successors that allow developers
    to be rapidly productive and also take advantage of modern language design.


    ## Launching of Carbon


    Carbon is an experimental general-purpose language presented by Chandler Carruth
    at the Cpp North conference on July 2022. The language intends to fix several
    shortcomings of C++ but otherwise provide a similar feature set. It will be designed
    on GitHub.


