  trans: '


    其他词汇类型通常提供合理但可能存在零开销的转换，以映射到 Carbon 词汇类型。使用这些类型的代码可以选择是否支付转换的开销。它们也可以在 Carbon
    代码中直接使用 C++ 类型，反之亦然。


    不完整类型必须具有具有相似语义的映射，类似于原始类型。


    ## Carbon 对 C++ 类型的继承


    为了实现互操作性，Carbon 将支持从 C++ 类型进行继承，尽管语法构造看起来可能与 C++ 继承不同。这被认为是必要的，以处理 C++ 库 API 期望用户继承自给定的
    C++ 类型的情况。


    这可能仅限于纯接口类型；参见开放问题。


    ## 非目标 (Non-goals)


    ### 绝不要求桥接代码


    `C++` 的边缘情况不会获得与常见情况相同的支持：支持任何给定结构的复杂性必须与该需求的现实需求取得平衡。例如：


    * 互操作性将针对 `C++17`。对未来 `C++` 版本的互操作支持（包括 `C++20` 模块等特性）将基于成本效益分析。不应假设会有详尽的支持。

    * 支持将集中在广泛开源库或其他关键利益相关者使用的惯用代码、接口和模式上。`C++` 代码将存在边缘情况，此时通过避免复杂的互操作来限制 Carbon 维护成本的收益将大于避免桥接代码的价值。

    * 对底层 `C` ABI 的支持可能集中于现代 64 位 ABI，包括 Linux、`POSIX` 和 Windows 调用约定的一小子集。


    ### 将所有 C++ 类型转换为 Carbon 类型


    应仅支持非零开销转换，而绝不强制，以便提供可靠且无意外的性能行为。这并不意味着转换将始终被支持，因为支持是针对特定类型映射的成本效益决策。例如，考虑 `std::vector<T>`
    与等效惯用 Carbon 类型之间的转换：


    * 使转换达到零开销将要求 Carbon 类型镜像 `std::vector<T>` 的内存布局和实现语义。然而，这样做将限制 Carbon 类型的演进以匹配
    `C++`。尽管对于大多数原始类型接受某些限制，但要限制 Carbon 类型以匹配 `C++` 词汇类型实现将给 Carbon 的演进带来巨大负担。

    * 这些转换可能并不总是存在，但 `std::vector<T>` 是频繁使用的类型。因此，可以预期会有函数支持到惯用 Carbon 类型的拷贝转换。

    * 对于常用类型，可能还会提供一种可以未使用 `std::vector<T>` 或等效惯用 Carbon 类型差异的接口。

    * 在 Carbon 代码中不通过转换处理 `C++` 类型仍然是正常现象。开发者应该被赋予何时进行转换的权利。


    ### 跨语言元编程


    Carbon 的元编程设计将比 `C++` 的预处理器宏更具限制性。尽管互操作性应该处理简单情况（例如 `#define STDIN_FILENO 0`），但复杂的元编程库可能需要理解代码重写的深度能力。将这些内容重写为使用
    Carbon 的元编程模型是合理的。


    ### 支持不带桥接代码的 C++ 异常


    Carbon 可能不会为 `C++` 异常提供无缝的互操作支持。例如，将 `C++` 异常转换为 Carbon 错误或反之可能需要注解或桥接代码，这些翻译可能会产生一些性能开销或丢失信息。此外，如果
    Carbon 代码在没有适当注解或桥接的情况下调用 `C++` 函数，且该函数带异常退出，程序可能会终止。


    ### 仅 Carbon 工具链与混合 C++/Carbon 工具链之间的完全对等


    使混合 `C++`/Carbon` 工具链的支持等同于仅 Carbon 工具链的支持会影响所有互操作性特性。混合工具链的支持将降低，因为完全对等成本太高了。


    在从 `C++` 代码中调用 Carbon 模板的功能是分析此选项的关键。模板实例化在编译期间在 `C++` 中无处不在。


    使用 Carbon 工具链编译 Carbon 和 `C++` 代码时，可以修改 `C++` 编译器以不同方式处理 Carbon 模板。Carbon 模板可以通过将
    Carbon 编译器的 AST 直接暴露给 `C++` 编译器（作为编译器扩展）来处理。虽然这种方法仍然复杂且可能并不总是有效，但它应该提供重大的价值以及将
    `C++` 代码迁移到 Carbon 的能力，无需在 `C++` 中并行维护实现。


    在混合工具链中，无法修改 `C++` 编译器以不同方式处理 Carbon 模板。支持模板实例唯一方法是将 Carbon 模板转换为 `C++` 头文件中的等效
    `C++` 模板；换句话之，模板支持需要源到源的翻译。支持 Carbon 到 `C++` 代码的翻译是一个实现混合工具链完全对等的复杂且高成本的功能。要求混合工具链使用桥接代码是避免这种成本的可能解决方案。


    注意，当考虑 Carbon 代码实例化 `C++` 模板的互操作性时，此问题不同。`C++` 模板必须在 `C++` 头文件中以便重用，而这必须与 Carbon
    工具链编译以重用构建的 `C++` 代码，无论是否在使用单独的 `C++` 工具链。也可以被视为混合工具链互操作性的限制，但处理更容易且不太可能给开发者带来负担。


    总结来说，开发者应该预期虽然大多数功能在混合工具链中工作方式等，但永远不会实现完全对等。


    ### 为 C++ 外的语言提供等效支持


    长期来看，应该预期 Carbon 将增加与非 `C++` 语言的互操作。然而，为了支持语言目标，互操作讨论将集中在 `C++` 上。尽管我们在构建互操作设施时应该考虑扩展性，但预计
    `C++` 将拥有更健壮的支持。


    许多语言都提供了 C 的互操作层。Carbon 的 C 互操作可能会以 C 为中介提供某种程度的多语言互操作。


    ## 以后解决的开放问题


    ### CRTP 支持


    尽管 `CRTP` 是 `C++` 中的一种常用技术，但互操作支持可能需要大量工作。基于 `CRTP` 的库为了 Carbon 互操作可能需要桥接代码或重写。


    在做出支持决策之前，应对支持 `CRTP` 的成本效益进行更多分析。


    ### 对象生命


    Carbon 的对象生命设计可能与 `C++` 不同。例如，Carbon 可能会选择不同的规则来确定临时对象的生命。这可能会影响 API 的惯用用法，使得在
    `C++` 中安全的代码变成不安全的 Carbon 代码，要求开发者学习新的编码模式。


    在决定如何在互操作范围内处理对象生命之前，应该对对象生命和潜在的 Carbon 设计进行更多分析。


    ### Carbon 类型从非纯接口 C++ 类型继承


    某些 `C++` API 期望消费者使用继承自 API 提供的类。我们希望 Carbon 能以某种方式支持继承 API 类型，以便使用这些 API。


    可能要求父类型是纯接口，并且 API 使用桥接代码或切换实现就足够了。这将稍后决定。


