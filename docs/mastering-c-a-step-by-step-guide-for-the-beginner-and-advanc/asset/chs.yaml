  \ stack）和 `lst` 变量的段落是多处重复的，作为高级文档工程师，我在翻译中合并了冗余内容，以保持文档质量。\n\n**以下是精简后的完整译文：**\n\
  \n[content]\n到目前为止，一切看起来都是正确的。`base` 为 `100`，`rate` 为 `.1`，`years` 为 `1`。等等！`Rate`\
  \ 并不是 `.1`，而是 `.1000000000000001`，但这只是浮点数的特性。它们并不是完全精确的，但由于差异非常微小，这其实并不重要。\n\n好了，到目前为止一切正常。现在我们想看看\
  \ `computeInterest` 函数内部发生了什么。在这里我们需要另一个调试器命令，称为“单步跳”（step into）。它将进入当前行将要调用的函数，当你想在函数内部进行调试时就会使用它。这就是我们要做的，单进入\
  \ `computeInterest`。但等一下，这一行包含了大量的函数调用：\n\n```\ncout << \"After \" << years << \"\
  \ you will have \" << computeInterest( base_val, rate, years ) << \" money\" <<\
  \ endl;\n```\n\n全都是 `cout` 的调用吗？那里会发生什么呢？嗯，调试器足够聪明，知道不要进入标准库中的任何函数。它只会直接进入 `computeInterest`，所以我们现在就过去。\n\
  \n要做的第一件事是验证参数是否正确——我们可能把它们弄混了。进入 Watch（观察）窗口并展开函数参数（Function arguments）部分。它们看起来应该是正确的。\n\
  \n对局部变量（local variables）进行同样的操作，你就会发现一个问题。`final_multiplier` 和 `i` 看起来都不太妙。不过记住，我们之前看过了，这些值之所以非常疯狂是因为它们还没有初始化。如果你按下\
  \ `F7`，循环的初始化将被执行。现在操作试试看看发生了什么。再次检查变量；`i` 看起来正常，但 `final_multiplier` 还是有些不对——它没有被正确初始化。\n\
  \n此外，我们当前所在的代码行即将要使用那个变量：\n\n```\nfinal_multiplier *= (1 + rate);\n```\n\n这一行的意思是我们应该计算\
  \ `final_multiplier * (1 + rate)`，然后将结果赋值给 `final_multiplier`。问题是，`final_multiplier`\
  \ 是错误的，所以我们会从操作中得到一个虚假的值。\n\n你能看出应该如何修复它吗？\n\n`final_multiplier` 必须在声明它的代码行上进行初始化，并初始化为\
  \ `1`。修复它后，一切都会正常运行。\n\n### 调试崩溃（Debugging Crashes）\n\n你会遇到的另一种 bug 是崩溃，对于新初学者来说，这些通常非常可怕，因为它们看起来有点极端。随着时间的推移，这些将成为你最喜欢的调试对象，因为你将确切知道问题发生在哪里。坏数据会导致崩溃，程序可以在崩溃点停止，这样你就可以找出问题是什么以及源于哪里。\n\
  \n下面是一个在链表中创建节点的简单程序，并打印列表的每个值：\n\n```cpp\n#include <iostream>\n\nusing namespace\
  \ std;\n\nstruct LinkedList\n{\n    int val;\n    LinkedList *next;\n};\n\nvoid\
  \ printList (const LinkedList *lst)\n{\n    if ( lst != NULL )\n    {\n        cout\
  \ << lst->val;\n        cout << \"\\n\";\n        printList( lst->next );\n    }\n\
  }\n\nint main ()\n{\n    LinkedList *lst;\n    lst = new LinkedList;\n    lst->val\
  \ = 10;\n    lst->next = new LinkedList;\n    lst->next->val = 11;\n    printList(\
  \ lst );\n    return 0;\n}\n```\n\n当运行这个程序时，它无法正常工作。它会发生两种情况之一——崩溃，或者进入无限循环，告诉我们那里出了问题。我们需要在调试器中运行代码以找出原因。\n\
  \n按下 `F8`，调试器几乎会立即弹出一个消息。这告诉你发生了段错误（Segmentation Fault，或简称 segfault），这是由于使用了无效指针导致的。基本上，程序尝试对一个无效指针或\
  \ `NULL` 指针进行解引用。发生的情况是程序试图进入它没有访问权限的内存。\n\n我们该如何查出无效指针是从哪里来的呢？调试器会在程序崩溃的那一行断下。点击该消息框中的\
  \ OK，并在崩溃的代码行上寻找黄色箭头（指针）：\n\n```cpp\ncout << lst->val;\n```\n\n这一行有一个名为 `lst` 的指针。进入\
  \ Watch（观察）窗口查看 `lst` 的值。你应该会一个一个 `oxbadfood` 的值，这是编译器在分配内存时用于初始化内存的特殊值。它只在程序运行调试器运行时被使用，这就是为什么你经常看到的行为与在调试器之外看到的有所不同。调试器会使用一个一致的值，如果访问了它，就会导致段错误；这样，如果使用了未初始化的指针，它们会立即显示。\n\
  \n我们现在知道 `lst` 没有被初始化，但为什么呢？我们这里可以使用调试器的另一个功能：调用栈（call stack）。它向你显示当前正在执行的所有函数，并有几列。`Nr`\
  \ 是引用每个栈帧的数字，而 `Address` 是函数地址。`Function` 是函数名和函数参数。如果你看，你会在调用栈中看到 `lst=oxbadfood`。还有文件和行号列，所以你可以轻松定位。\n\
  \n### 进入挂起的程序（Breaking Into Hung Programs）\n\n有时候，它并不是简单的崩溃；在偶尔你可能在处理一个挂起的程序。它可能是无限循环，也可能是系统调用很慢。当你遇到这种场景时，程序可以在调试器中运行，当它卡住时你可以请求调试器进入程序。\n\
  \n这里有另一个示例展示了它是如何工作的：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\n\
  int main ()\n{\n    int factorial = 1;\n    for ( int i = 0; i < 10; i++ )\n   \
  \ {\n        factorial *= i;\n    }\n    int sum = 0;\n    for ( int i = 0; i <\
  \ 10; i++ )\n    {\n        sum += i;\n    }\n    // 排除 2 的阶乘\n    int factorial_without_two\
  \ = 1;\n    for ( int i = 0; i < 10; i++ )\n    {\n        if ( i == 2 )\n     \
  \   {\n            continue;\n        }\n        factorial_without_two *= i;\n \
  \   }\n    // 排除 2 的和\n    int sum_without_two = 0;\n    for ( int i = 0; i < 10;\
  \ i++ )\n    {\n        if ( i = 2 ) // 注意：此处原文为赋值\n        {\n            continue;\n\
  \        }\n        sum_without_two += i;\n    }\n}\n```\n\n当你运行这个程序时，它只是不会退出，因为它卡在了某个地方。为了找出原因，我们在调试器中运行程序，等待它卡住，然后进入程序查看。\n\
  \n\n\n编译程序并在调试器中运行（按 `F8`）。当程序运行且没有退出时，我们可以请求调试器中断（break）并向我们展示发生了什么。点击 `Debug`，然后点击\
  \ `Stop Debugger`。这将使调试器中断，你就可以看到执行点正在发生的情况。一旦程序停止，你就可以看到调用栈，它看起来可能有点奇怪。你看到的不是我们的代码，那么这里发生了什么呢？\n\
  \n你看到的是进入一个正在运行的程序时发生发生的结果。调用栈顶端命名为 `ntdll!DbgUiConnectToDbg`。因此，`ntdll` 是 Windows\
  \ 中的一个核心 `DLL`，而 `DbgUiConnectToDbg` 是正在被调用的函数。该函数用于中断运行中的进程，但那些本该正在执行的代码去哪里了呢？事实证明，当你中断正在运行的进程时，调试器会创建一个单独线程，这是同时执行代码的一种。\n\
  \n要中断正在运行的进程，调试器必须在原始代码执行的同时执行代码。这是通过创建一个用于执行中断代码的新线程来实现的。在我们之前的示例中，这个线程并没有出现，因为我们已经设置了断点——调试器拥有足够的控制权来中断，而无需创建新线程。这一次，我们不想在固定的代码行上中断；我们想在某个特定的时刻进入。因此，为了找到我们正在执行的代码，我们所做的就是进入正确的线程。点击\
  \ `Debug` -> `Debugging Windows`，然后点击 `Running Threads`。\n\n`Thread` 窗口打开了，你应该能看到两个线程。在\
  \ `Active` 列中，当前线程由 `*` 显示——这就是发生中断的线程。我们需要第二个线程，所以右键点击它并选择‘Switch to this thread’（切换到此线程）。\n\
  \n回到调用栈，现在信息要好得多了。你可以看到我们的代码，并且看到第 29 行上的黄色指示器——这是下一行要执行的代码，即此段代码：\n\n```cpp\nfor\
  \ ( int i = 0; i < 10; i++ )\n{\n    if ( i = 2 )\n    {\n        continue;\n  \
  \  }\n    sum_without_two += i;\n}\n```\n\n由于我们的程序卡住了，而且正好处于循环中间，所以可以推推循环不会终止，但证明这一点的唯一方法是逐行执行（step）。\n\
  \n这就是我们必须小心的地方；如果你使用 `Next Line`（下一行）命令，调试器将只会执行另一个线程中的代码——即当前正在执行的代码行。相反，需要在原始代码中设置断点，并让程序运行到那里。\n\
  \n在 `if` 语句所在的行上设置断点，然后按 `Continue`（`CTRL+F7`）。当程序到达该断点时，我们就处于正确的线程上，可以使用 `Next\
  \ Line` 命令逐行执行并查看发生了什么。\n\n你应该看到的是我们不断进入 `if (i=2)` 然后返回循环开头。那么，发生了什么呢？让我们查看 `locals`\
  \ 窗口中 `i` 的值。在循环代码行上，`i` 是 2。一旦循环代码执行完毕，`i` 是 3。而当 `if` 语句行执行后，它又变回了 2。\n\n看起来非常像\
  \ `if` 语句可能将 `i` 的值设置为 2 —— 你能发现为什么吗？这是一个常见的错误——使用了一个等号而不是两个等号，就这么简单。\n\n你可能还会问自己，为什么程序从未到达\
  \ `continue` 这一行；为什么它总是从 `if` 语句跳回循环？这是由于调试器的原因——有时很难将机器码（实际被处理的代码）与代码中的特定行相匹配。在这种情况下，调试器难以区分\
  \ `if(x=2)` 和 `continue` 语句，这种情况在调试器中会偶尔发生，随着时间的推移，你将开始注意到此类问题。\n\n### 修改变量\n\n\
  在调试时，可能会出现你想修改变量值的情况。例如，你可能希望确保变量被设置为特定值，以便代码能够正常工作。要这样做，打开 `Watch` 窗口并右键点击任何变量；要更改它，选择\
  \ `Change Value`（更改值），然后将变量值设置为你想要的值。\n\n小心不要在值初始化之前这样做；如果你这样做了，值将被被覆盖。\n\n总而言之，`Code::Blocks`\
  \ 调试器让你理解程序中正在发生什么，并帮助定位问题，提供了许多工具帮助你理清思路。\n\n接下来，我们将进入更高级的编程概念。\n\n# 第 4 章：高级指南\n\
  \n## 编写更大的程序\n\n在我们开始之前，如果你已经到了这一阶段但对目前为止读的所有内容没有良好的理解，请不要继续。回去重读，并在你认为自己准备好了再回到这里——这本书的最后一部分更高级，它包含了\
  \ `C++` 编程中一些最重要的概念和信息。\n\n到为止，我们讨论的大部分内容为你提供了一个新方向，一种做新事的方法。现在我们需要做得更大。到目前为止，我们只写了小程序，随着程序规模的增大，你可能意识到大程序处理起来要困难得多。大到什么程度成为问题取决于你——对于某些人来说是一个几百行的程序，对于另一些人则是几千行。\n\
  \n最终，一个程序会变得太大无法正确理解。如果你想构建一个游戏怎么办？某个软件甚至是操作系统？你需要的是让大型程序更容易结构化的技术。多年来，许多程序员都遇到了这个问题，并开发了一些可以帮助你构建这些大型程序的技巧。我们在指南中将讨论的内容将为你提供这些技术。\n\
  \n我们将从设计和构建大型程序的概念开始。第一点是实际代码，我们将讨论如何在磁盘上布局你的程序，使其不仅仅是一个 `cpp` 文件。然后，我们将转向逻辑设计，即在不需要时刻记住所有工作方式的每个细小细节的情况下编写程序。\n\
  \n### 拆分你的程序\n\n随着程序规模的增长，你不会希望所有内容都在一个源文件中。内容会变得太多而难以修改，而且你很有可能会迷失在其中，找不到你想要的东西。当你的程序达到两千行时，你就应该开始考虑将其拆分到多个源文件中了。\n\
  \n这样做可以更容易找到你想要的内容；文件更小了，你可以将它们拆分成特定的代码段。而且程序设计将变得简单得多，因为每个头文件都包含源代码的正确接口，其他文件无法使用这些头文件中未定义的数据结构或函数。\n\
  \n### C++ 编译过程\n\n在你开始拆分代码之前，你必须更好地了解 `C++` 编译的工作原理。公平地说，“编译”在这里并不是一个准确的词——它在任何意义上都不意味着“创建一个可执行文件”。\n\
  \n这是一个包含几个阶段的过程，最重要的三个是：\n\n*   预处理\n*   编译\n*   链接\n\n\n\n从源代码文件开始到生成可执行文件的过程，最好的描述是称之为“构建”（build），而编译（compilation）只是其中的一部分。不过，你会看到人们将整个过程称为“编译”。让我们逐个阶段来看看它是如何运作的。\n\
  \n### 预处理 (Preprocessing)\n\n该过程的第一步是编译器运行 C 预处理器。其目的是在进入编译步骤之前，对文件以文本格式进行更改。预处理器会理解写入源码的指令和命令，但这些指令和命令仅是供预处理器使用的，而不是给编译器的。\n\
  \n每个预处理指令都会以 `#` 符号开头，这使得编译器甚至无法看到它们。以下述语句为例：\n\n```\n#include <iostream>\n```\n\
  \n此条语句让预处理器知道，它应该将 `iostream` 头文件中的文本放入文件中。每当包含一个头文件时，它都会在编译器看到它之前被粘贴到文件中，而作为指令的\
  \ `#include` 就会被删掉。\n\n预处理器还会展开宏（macros）。宏是文本字符串，通常会被替换为更复杂的其他文本字符串。你可以使用宏将常量放在一个地方，以便于管理。\n\
  \n例如，你可以编写类似这样的代码：\n\n```\n#define MY_NAME \"Billy\"\n```\n\n现在，你不需要在整个源文件中编写“Billy”，只需使用\
  \ `MY_NAME` 即可。\n\n你写下\n\n```cpp\ncout << \"Hello \" << MY_NAME << '\\n';\n```\n\
  \n而编译器看到的是\n\n```cpp\ncout << \"Hello \" << \"Billy\" << '\\n';\n```\n\n如果你想使用不同的名称，只需要更改代码中带有\
  \ `#define` 指令的那行即可；你不需要在整个代码中进行全局搜索和替换。宏可以将信息片段放在中心位置，以便于轻松更改。假设你想为程序提供一个版本号，并在代码中引用该数字。可以使用宏：\n\
  \n```\n#define VERSION 3\n\n// ...\n\ncout << \"The version is \" << VERSION\n```\n\
  \n由于预处理器在代码编译之前完成工作，因此你也可以用它来删除代码。在某些情况下，你可能只想在专门用于调试的构建中编译某些代码；你只需要告诉预处理器，只有当某个宏被定义时才包含源码即可。然后，当需要该代码时，宏被定义了；当不需要该代码时，你只需移除该宏。\n\
  \n例如，假设你有一段调试代码会打印变量值，但你只想在某些时间打印它们。在这种情况下，可以条件条件将调试代码包含在构建中：\n\n```cpp\n#include\
  \ <iostream>\n\n#define DEBUG\n\nusing namespace std;\n\nint main ()\n{\n\nint x;\n\
  int y;\n\ncout << \"Enter value for x: \";\ncin >> x;\n\ncout << \"Enter value for\
  \ y: \";\ncin >> y;\n\nx *= y;\n\n#ifdef DEBUG\ncout << \"Variable x: \" << x <<\
  \ '\\n' << \"Variable y: \" << y;\n#endif\n\n// further use of x and y\n}\n```\n\
  \n如果你关闭变量关闭，只需注释掉 `#define DEBUG` 即可：\n\n```cpp\n// #define DEBUG\n```\n\n预处理器还支持检查宏是否**未**定义。例如，你可以让代码在\
  \ `DEBUG` 未被设置的情况下执行，此时你会使用 `#ifndef` ——意为“如果未定义”。我们会在讨论多个头文件时再详细介绍这一点。\n\n### 编译\
  \ (Compilation)\n\n编译无非将扩展名为 `.cpp` 的源文件转换为扩展名为 `.o` 或 `.obj` 的对象文件。对象文件是你的程序以计算机处理器能够理解的方式（即机器语言）编写的地方，源文件中的每个函数都是如此。每个文件都是单独编译的，这意味着对象文件将只包含已编译的源文件的机器语言。\n\
  \n例如，如果你编译了三个文件但没有对它们链接，输出将是三个独立的对象文件，每个文件都包含相关源码到机器语言的翻译。然而，你无法运行它们；它们必须先被转换为可执行文件，这就是链接（linking）发挥作用的地方。\n\
  \n### 链接 (Linking)\n\n链接指的是从多个库和对象文件创建一个可执行文件（例如 `.DLL` 或 `.EXE`）。链接器会创建一个正确的可执行格式的文件，并将每个相关对象文件的内容放入其中。它还会处理任何引用了原始源文件外部函数的对象文件。一个例子是引用\
  \ C++ 标准库中的函数。假设你向标准库调用了\n\n```cpp\ncout << “Hi”\n```\n\n你正在使用一个你没有定义的函数。它已经被定义为等同于对象文件，只是不是你的文件。\n\
  \n当编译器介入时，它知道你使用了一个有效的函数调用，因为包含了 `iostream` 头文件，但由于该函数不是你的 `.cpp` 文件的一部分，编译器会在调用点处留一个标记。链接器将遍历文件，并对于每个标记，它将从另一个链接的对象文件中找到正确的地址。\n\
  \n这通常被称为“修复（fixup）”，当你的程序被分成几个源文件时，你可以使用这种能力修复所有调用另一个源文件的函数。\n\n\n\n\n当 `Orig.cpp`\
  \ 构建时，它需要被配置为链接到名为 `Shared.obj` 的文件，但我们稍后会讨论这一点。\n\n首先，来看一个示例。这是一个包含链表通用代码的小程序。代码写在\
  \ `Orig.cpp` 中，我们将把这些代码拆分为两部分——头文件和一个源文件——它们是可重用的：\n\n```cpp\n#include <iostream>\n\
  \nusing namespace std;\n\nstruct Node\n{\n    Node *p_next;\n    int value;\n};\n\
  \nNode* addNode (Node* p_list, int value)\n{\n    Node *p_new_node = new Node;\n\
  \    p_new_node->value = value;\n    p_new_node->p_next = p_list;\n    return p_new_node;\n\
  }\n\nvoid printList (const Node* p_list)\n{\n    const Node* p_cur_node = p_list;\n\
  \    while ( p_cur_node != NULL )\n    {\n        cout << p_cur_node->value << endl;\n\
  \        p_cur_node = p_cur_node->p_next;\n    }\n}\n\nint main ()\n{\n    Node\
  \ *p_list = NULL;\n    for ( int i = 0; i < 10; ++i )\n    {\n        int value;\n\
  \        cout << \"Enter value for list node: \";\n        cin >> value;\n     \
  \   p_list = addNode( p_list, value );\n    }\n    printList( p_list );\n}\n```\n\
  \n首先，需要将声明与定义拆分开。我只向你展示声明部分——文件的其余部分不需要更改：\n\n```cpp\nstruct Node\n{\n    Node *p_next;\n\
  \    int value;\n};\nNode* addNode (Node* p_list, int value);\nvoid printList (const\
  \ Node* p_list);\n```\n\n由于我们没有任何针对特定文件的声明，因此不需要将它们分离。我们可以直接将所有声明放入一个名为 `linkedlist.h`\
  \ 的新文件（头文件）中。以下是完整文件内容：\n\n**Linkedlist.h**\n```cpp\nstruct Node \n{\n    Node *p_next;\n\
  \    int value;\n};\nNode* addNode (Node* p_list, int value);\nvoid printList (const\
  \ Node* p_list);\n```\n\n**linkedlist.cpp**\n```cpp\n#include <iostream>\n#include\
  \ \"linkedlist.h\"\nusing namespace std;\n\nNode* addNode (Node* p_list, int value)\n\
  {\n    Node *p_new_node = new Node;\n    p_new_node->value = value;\n    p_new_node->p_next\
  \ = p_list;\n    return p_new_node;\n}\n\nvoid printList (const Node* p_list)\n\
  {\n    const Node* p_cur_node = p_list;\n    while ( p_cur_node != NULL )\n    {\n\
  \        cout << p_cur_node->value << endl;\n        p_cur_node = p_cur_node->p_next;\n\
  \    }\n}\n```\n\n**orig.cpp**\n```cpp\n#include <iostream>\n#include \"linkedlist.h\"\
  \nusing namespace std;\n\nint main ()\n{\n    Node *p_list = NULL;\n    for ( int\
  \ i = 0; i < 10; ++i )\n    {\n        int value;\n        cout << \"Enter value\
  \ for list node: \";\n        cin >> value;\n        p_list = addNode( p_list, value\
  \ );\n    }\n    printList( p_list );\n}\n```\n\n头文件中不应该有任何函数定义。如果你添加了定义，并且该头文件被两个或多个源文件包含，那么在链接时该定义会出现多次。这会让情况变得复杂。\n\
  \n另一个需要确保的是，声明在任何一个源文件中不要出现超过一次。`Orig.cpp` 文件最终可能会包含几个头文件，而其中一个可能包含了 `linkedlist.h`：\n\
  \n**newheader.h**\n```cpp\n#include \"linkedlist.h\"\n// 其他代码\n```\n\n**orig.cpp**\n\
  ```cpp\n#include \"linkedlist.h\"\n#include \"newheader.h\"\n/* orig.cpp 的剩余代码 */\n\
  ```\n\n现在 `Orig.cpp` 包含了两个 `linkedlist.h` 实例——一个是直接包含，另一个是通过 `newheader.h` 间接包含。\n\
  \n为了修复这个问题，你需要一个包含卫符（include guard）；它将使用预处理器来控制文件是否应该被包含，它的逻辑应该是这样的：\n\n```cpp\n\
  if <此文件尚未被添加 >\n<标记我们已文件中添加了它>\n<将其添加>\n```\n\n这可以安全地使用，因为永远没有需要将一个头文件添加超过一次。\n\n\
  实现包含卫符需要使用 `#ifndef` 预处理器命令——我们之前提到过它。该命令的意思是“如果未定义”，则到下一个 `#endif` 语句为止代码块应该被包含：\n\
  \n```cpp\n#ifndef ORIG_H\n// 头文件内容\n#endif\n```\n\n我们在这里说的是，如果 `_ORIG_H` 未被定义，则包含到\
  \ `#endif` 的所有代码。这里的技巧在于，我们现在能够定义 `ORIG_H` 了：\n\n```cpp\n#ifndef ORIG_H\n#define\
  \ ORIG_H\n// 头文件内容\n#endif\n```\n\n想想如果这个文件被添加两次会发生什么。第一次包含时，`ORIG_H` 未被定义，`#ifndef`\
  \ 会包含文件的剩余部分，并负责定义 `ORIG_H`。第二次包含时，`#ifndef` 将为假，从而不再包含。\n\n（注：原文此处存在大量重复的段落，已根据要求完成翻译并保持了核心逻辑）\n\
  \n### 处理多个文件\n\n为了设置多个文件，你需要确保每个文件都被正确编译并链接在一起。`Orig.cpp` 文件最终可能会包含几个头文件，其中一个可能包含了\
  \ `linkedlist.h`：\n\n**XCode**\n1. 在 XCode 中添加源文件只需点击 `File -> New File`。\n2. 在文件选项中，在左窗格选择\
  \ C 和 C++，在右格选择 C++。如果你只添加头文件，请选择 Header file。如果你正在添加头文件和 cpp 实现，选择 C++ 并按 Next。\n\
  3. 选择文件名并选择默认位置或你想要的位置。\n4. 如果你选择了 C++，现在可以创建头文件了。\n\nXCode 会自动设置构建过程，使你创建的 cpp\
  \ 文件与其他源文件一起编译并链接。\n\n**G++**\n如果你使用 `g++`，你其实不需要这样做。假设你有两个源文件 `orig.cpp` 和 `shared.cpp`，以及一个头文件\
  \ `shared.h`。一个简单的命令就可以编译两个源文件：\n\n```bash\ng++ orig.cpp shared.cpp\n```\n\n不需要在命令行中包含头文件，但如果你想获得单独编译的处，可以使用\
  \ `-c` 标志对每个文件进行单独编译：\n\n```bash\ng++ -c orig.cpp\ng++ -c shared.cpp\n```\n\n然后使用以下命令链接它们：\n\
  \n```bash\ng++ orig.o shared.o\n```\n\n或者如果当前目录下没有对象文件，你可以直接执行：\n\n```bash\ng++\
  \ *.o\n```\n\n单独编译很繁琐，更简单的方法是使用 `makefile`。这是你的程序可以处理定义，并用于编码源文件之间的依赖关系；这样，如果一个源文件被更改，`makefile`\
  \ 就会知道依赖它的其他文件都需要重新编译。\n\n我们不会再介绍 `makefile` 的更多细节，因为它超出了本指南的范围。\n\n## 测试 18\n\n\
  以下哪项不是 C++ 构建过程的一部分？\nA. 链接\nB. 编译\nC. 预处理\nD. 后处理\n\n与未定义相关的错误发生在哪个阶段？\nA. 链接阶段\n\
  B. 编译阶段\nC. 程序启动时\nD. 函数被调用时\n\n如果多次包含一个头文件，可能会发生什么？\n\n\n\n\n## A. 与多次声明相关的错误\n\
  \nB. 什么都不会发生，因为头文件只会被加载一次\n\nC. 这取决于头文件的实现方式\n\nD. 你一次只能在一个源文件中包含一个头文件，所以这不会成为问题\n\
  \n## 将编译和链接分开进行有什么好处吗？\n\nA. 不；这太让人困惑了，而且由于你需要运行多个程序，这会减慢速度。\n\nB. 是的；你可以更容易地诊断错误，因为你会知道问题是出现在编译器还是链接器中。\n\
  \nC. 是的；这意味着你可以重新编译发生变化的文件，从而在链接和编译方面都节省时间。\n\n## 程序设计导论\n\n我们已经学习了如何在磁盘上物理地存储代码的方法，以便在代码变大时更容易编辑。现在我们可以进入下一个阶段——以逻辑方式组织你的代码，以便更容易对其进行编辑和处理。我们将从回顾一些随着代码规模增大而出现的常见问题开始。\n\
  \n### 冗余代码\n\n在引入函数时，我们非常简要地提到了重复代码的问题，现在让我们深入探讨。当你的程序扩展时，你会发现某些想法开始变得重复。以视频游戏为例；它需要代码在屏幕上绘制出所有不同的图形元素——可能是子弹、太空船等。\n\
  \n在绘制太空船之前，你必须能够绘制像素。如果你不知道，像素是屏幕上的一个颜色点，其位置通过二维坐标来找到。大多数情况下，可以使用图形库来实现这一点。\n\n\
  你还需要编写代码来使用图形库提供的像素或其他图形元素（如圆和线段），这样就可以绘制游戏元素了。\n\n如果你正在开发游戏，这种绘制在你的代码中将非常常见。在我们的游戏中，每当子弹或太空船移动时，这种绘制都需要重新绘制。如果你在每次运行时都插入负责绘制子弹的所有代码，你最终会产生大量的冗余代码。这一切只是给你的程序增加了不必要的复杂性，并且你的程序会变得更难阅读。\n\
  \n你想要的是一种标准化的方法来绘制子弹和太空船，这样你的代码就不需要反复重复这个过程。你为什么需要这个？嗯，假设你想进行一些更改，比如给子弹换一个新颜色。如果你的程序中有在十几个不同地方显示子弹的代码，那么你每想做一次更改，都需要修改这些代码中的每一个部分。\n\
  \n这意味着，每当你想要显示子弹时，你都需要反复编写代码，或者找到一段代码并复制/粘贴它，可能在这里或那里更改变量名以防止冲突。无论你采用哪种方法，你都需要关注子弹是如何显示的，而不仅仅是能够绘制子弹。而且，当你回过代码时，你还要承担一项艰巨的任务，试图弄清楚每个东西是做什么的。\n\
  \n如果你在代码中看到这些：\n\n```cpp\ncircle( 10, 10, 5 );\nfillCircle( 10, 10, RED );\n```\n\
  \n那么要弄清楚这表示要画一个子弹，比你看到这些代码要困难得多：\n\n```cpp\ndisplayBullet( 10, 10 );\n```\n\n函数用于为代码提供有用的名称，这样当你重新阅读内容时，就能理解发生了什么。你可能还没有遇到过，但随着你开始构建更大的程序，你会发现自己花费了大量时间在阅读代码上，甚至比编写代码的时间还要多。因此，使用良好的函数和良好的名称是非常重要的。\n\
  \n### 关于数据存储的假设\n\n这种代码冗余是一种疾病，它影响的不只是算法。现在我们来看另一个代码示例，其中冗余是隐藏的。假设我们想写一个国际象棋程序，使用数组来表示棋盘上的当前位置。每当访问棋盘时，你只需访问数组。\n\
  \n如果你初始化第二行使其只包含白兵，你可以写道：\n\n```cpp\nenum ChessPiece { WHITE_PAWN, WHITE_ROOK /*\
  \ 以及其他 */ };\n\n// ... 大量的代码\n\nfor ( int i = 0; i < 8; i++ ) \n{\n    board[ i\
  \ ][ 1 ] = WHITE_PAWN;\n}\n```\n\n之后，如果你想查看特定方格上有什么棋子，你只需要从数组中读取即可：\n\n```cpp\n\
  // ... 大量的代码\n\nif ( board[ 0 ][ 0 ] == WHITE_ROOK )  \n{\n    /* 在此处执行某些操作 */ \n\
  }\n```\n\n随着程序的增大，你会发现会有大量的代码都在使用棋盘，并且它们会散落在各处。那么，这有什么危害呢？我的意思是，并不是你每次读取数组时都在重复自己，那只是一行代码。然而，这正是你所做的——在重复自己，反复使用相同的数据结构。通过这样做，你的代码对棋盘的表示方式做了一个特殊的假设。你可能没有在重复实际的算法，但你重复了数据表示的假设。看这里——虽然访问棋盘可能只需要一行代码，但并不意味着将总是如此的。如果你的棋盘是以不同的方式实现的，你可能就不需要使用更复杂的技术来访问它。\n\
  \n当我们需要隐藏绘制子弹的细节时，我们使用了一个可以调用的函数，而不是编写大量绘制屏幕的代码。在这种情况下我们也可以这样做，通过使用一个隐藏表示的函数。代码不再直接使用数组，而是调用一个可以访问它的函数。例如，你可以这样写一个\
  \ `getPiece` 函数：\n\n```cpp\nint getPiece (int x, int y)\n{\n    return board[ x\
  \ ][ y ];\n}\n```\n\n函数接受两个参数并返回一个值，这与直接访问数组的方式相同。这并不意味着工作量少，因为仍然需要之前的输入数据——x 坐标和\
  \ y 坐标。不同在于我们将访问棋盘的方法隐藏在了函数内部。从现在开始，程序应该使用此函数访问数组，如果你以后决定表示方法需要更改，你只需要修改一个函数，而不是在\
  \ 10 或 20 个独立的代码段中修改。\n\n这一切被称为函数抽象，应用它意味着如果你有任何需要重复的操作，就将其放入函数中。函数会向调用者指定所有的输入和输出，但它不会告诉调用者函数是如何实现的。\n\
  \n在函数中隐藏算法和数据有几个优点：\n\n1. 它让以后的工作变得简单得多。你不需要一直记住算法是如何实现的，只需要调用函数即可。只要该函数对每个有效输入都能正常工作，就可以信任它的输出，而无需记住一切是如何运作的。\n\
  \n\n\n\n## 2. 当你信任你的函数可以正常工作时，你就可以开始通过编写反复使用这些函数的代码来解决问题了。你不需要担心访问棋板（board）等细节，这让你能够自由专注于解决新问题。\n\
  \n## 3. 如果你确实在逻辑中发现了任何错误，你只需要修改一个函数，而不是散落在在代码各处的几段代码。\n\n## 4. 当你编写一个函数来隐藏数据结构时，你实际上是在为数据的存储和表示“写入”了灵活性。你可以先从效率低但易于编写的表示开始，并在以后需要时将它们替换为运行速度更快的实现，而你只需要更改几个函数。\n\
  \n## 设计与注释\n\n当你能够创建设计良好的函数时，对这些函数进行记录是非常关重要的。这并不像你想象的那么简单。\n\n当你创建设计良好的函数时，也应该对这些函数进行记录。不过，正确地记录一个函数并不听起来那么简单。使用良好的注释可以回答任何阅读你代码的人可能产生的问题。\n\
  \n到为止，你在本指南中已经见过这样的注释：\n\n```\n// 声明变量 i 并将其初始化为 3\nint i = 3;\n```\n\n实际上，这些并不是你应该写的注释，因为它们纯粹是为了初学者的，用来回答他们可能产生的问题。在现实世界中，阅读你注释的人已经精通\
  \ C++ 了。\n\n而且，随着时间的推移，你的注释会过时，任何阅读它们的人都会浪费时间，他们还可能最终误解正在发生的所有事情。\n\n你需要编写的是回答此类类问题的注释，例如：“这种方法很奇怪，他们为什么要那样做？”或者类似的问题：“该函数会取什么值，这些值代表什么意思？”\n\
  \n下面是你应该为每个函数编写的类型文档的示例：\n\n```cpp\n/*\n* 计算指定正整数 n 的斐波那契值。如果 n \n* 的值小于 1，则函数 \n\
  * 将返回 1\n*/ \nint fibonacci (int n);\n```\n\n这段描述准确地告诉了你函数在做什么、有效参数是什么，以及如果提供了无效输入会发生什么。这样的文档意味着函数用户不需要去寻找函数是如何实现的，这太棒了。\n\
  \n编写良好的注释并不意味着你应该写长长的注释，你不需要对每一行代码都进行注释。养成这种习惯：对于将在文件之外使用的函数使用注释，每当你有一段不寻常或潜在复杂的代码时使用注释。\n\
  \n一个需要避免的坏习惯——尽管你应该尽量保持注释简洁，但不要把它们留到开发周期的最后。当代码写完后，你无法回去写下有意义的注释；你所做的只是添加可以通过阅读代码推断出的信息，而且你面临着不理解自己代码的风险。最佳实践是什么？在编写过程中编写注释。\n\
  \n满意吗？做一下下面的测验，复习任何你不理解的内容，然后我们将转向如何隐藏结构化数据表示。\n\n### 测验 19\n\n使用函数而不是直接访问数据有优势吗？\n\
  \nA. 是的，编译器可以优化函数以确保更快的访问\n\nB. 是的，函数的实现可以由函数对所有调用者隐藏，确保函数调用者可以被更改\n\nC. 是的，函数是多个源文件之间共享相同数据的唯一方法\n\
  \nD. 不，没有优势\n\n什么时候应该将代码放入一个公共函数中？？\n\nA. 每当你需要调用它时\n\nB. 每当相同的代码从一个或两个以上的地方被调用时\n\
  \nC. 每当编译器不喜欢函数大到无法编译时\n\nD. B 和 C\n\n你隐藏数据结构表示的原因是什么？\n\nA. 它让数据结构更容易被替换\n\nB.\
  \ 它让使用该结构的代码变得更容易理解\n\nC. 它让在代码的其他部分使用该数据结构变得更容易\n\nD. 以上所有\n\n## 隐藏结构化数据的表示\n\n\
  到目前，我们查看了存储在数组或全局变量中的数据隐藏。但数据隐藏不仅限于此。最常见的隐藏位置之一是你创建一个数据结构时。你可能认为这很奇怪；结构的布局是非常特定的，其中可以存储的值的集也是如此。当你把结构视为一组字段时，它们没有任何方法可以隐藏实现的的细节，例如它们存储的字段以及它们所处的格式。事实上，如果你认为任何结构的要点就是提供特定数据，那也是可以被原谅的。\n\
  \n那么，为什么你需要隐藏数据表示呢？事实证明，在一个想要隐藏表示的世界里，我们可以以另一种方式来考虑结构。\n\n大多数时候，当你有许多相关数据时，最重要的事情不是数据是如何存储的；而是能用数据做什么。这极其重要，并且它可以改变你的思考方式。由于这个原因，我将再次强调：数据如何存储**并不重要**，但数据如何被使用**非常重要**。\n\
  \n让我们通过一个简单的字符串示例在语文中来看这一点。\n\n除非你实现的是 `string` 类，否则你如何存储字符串并不重要。对于任何处理字符串的程序代码，重要的是获取字符串长度、访问单个字符以及如何显示字符串。字符串的实现可能使用字符数组和另一个变量来存储字符串长度，它甚至可能使用链表——一种你从未听过的\
  \ C++ 特性。对于使用字符串的人来说，它是如何实现的并不重要——重要的是能用它做什么。这里，我已经说了第三遍了。你可以做很多事情，但字符串只有大约 35 件事，大多数情况下你不需要其中大部分。\n\
  \n你最需要的能力是能够创建一个新类型，而无需暴露实现该类型的原始数据。例如，当你创建一个新字符串时，你不需要担心持有字符的缓冲区。这就是 STL `maps`\
  \ 和 `vectors` 的工作方式——完全不需要担心它们的实现。\n\n### 使用函数隐藏结构布局\n\n函数可以用于隐藏具体的结构字段，这是通过创建一个与特定结构关联的函数来实现的。例如，一个小小的棋盘，用于表示棋盘以及现在轮到白色还是黑色移动。移动的玩家和棋子都存储在枚举中：\n\
  \n```cpp\nenum ChessPiece { EMPTY_SQUARE, WHITE_PAWN /* 以及其他 */ };\nenum PlayerColor\
  \ { PC_WHITE, PC_BLACK };\n\nstruct ChessBoard\n{\n    ChessPiece board[ 8 ][ 8\
  \ ];\n    PlayerColor whose_move;\n};\n```\n\n可以创建函数来操作这个棋盘，并将棋盘作为函数参数：\n\n```cpp\n\
  ChessPiece getPiece (const ChessBoard *p_board, int x, int y)\n{\n    return p_board->board[\
  \ x ][ y ];\n}\n\nPlayerColor getMove (const ChessBoard *p_board)\n{\n    return\
  \ p_board->whose_move;\n}\n\nvoid makeMove (ChessBoard* p_board, int from_x, int\
  \ from_y, int to_x, int to_y)\n{\n    // 通常我们先先对移动进行验证 \n    p_board->board[ to_x\
  \ ][ to_y ] = p_board->board[ from_x ][ from_y ];\n    p_board->board[ from_x ][\
  \ from_y ] = EMPTY_SQUARE;\n}\n```\n\n你可以像使用任何其他函数一样使用它：\n\n\n\n\n\n```cpp\nChessBoard\
  \ b;\n\n// 首先我们需要一段用于初始化棋盘的代码 \n\n// 然后我们就可以这样使用它\n\ngetMove( & b );\n\nmakeMove(\
  \ & b, 0, 0, 1, 0 ); // 将棋子从 0, 0 移动到 1, 0\n```\n\n这种方法没有问题，而且 `C++` 程序员已经反复使用过它了。然而，这些函数仅与\
  \ `ChessBoard` 结构体关联，因为这些函数将该结构体作为参数传入。并没有明确说明这些函数应该被视为该结构体的核心组成部分。\n\n如果我们能说结构体既包含了数据，又包含了它操纵这些数据的所有方式，那就太棒了。\n\
  \n事实上，你可以这样做，而且 C++ 已经将此内置到了语言中。为了实现这一点，我们使用一种称为“方法”（methods）的东西。这些是在声明为结构的一部分的函数，与没有结构关联的函数不同，方法可以轻松地用于对结构体数据进行操作。在编写方法时，它被声明为结构的一部分，这使得方法直接与该结构体绑定。通过这样做，方法的调用者就不需要将结构体作为一个单独的参数传递。\n\
  \n然而，这引入了对特殊语法的需求。\n\n### 方法声明与调用语法\n\n下面的代码演示了如果我们将函数转换为方法，它们会是什么样子：\n\n```cpp\n\
  enum ChessPiece { EMPTY_SQUARE, WHITE_PAWN /* 以及其他成员 */ };\n\nenum PlayerColor {\
  \ PC_WHITE, PC_BLACK };\n\nstruct ChessBoard\n{\n\nChessPiece board[ 8 ][ 8 ];\n\
  \nPlayerColor whose_move;\n\nChessPiece getPiece (int x, int y)\n{\n\nreturn board[\
  \ x ][ y ];\n}\n\nPlayerColor getMove ()\n{\n\nreturn whose_move;\n}\n\nvoid makeMove\
  \ (int from_x, int from_y, int to_x, int to_y)\n{\n\n// 通常我们需要先编写代码来验证移动 \nboard[\
  \ to_x ][ to_y ] = board[ from_x ][ from_y ];\nboard[ from_x ][ from_y ] = EMPTY_SQUARE;\
  \ \n}\n\n};\n```\n\n首先，正如你所看到的，我们在结构体中声明了方法。这告诉代码这些方法应该被视为结构不可分割的一部分。此外，方法声明不需要为\
  \ `ChessBoard` 额外的参数；结构体字段在方法中可以直接访问。\n\n当你编写 `boar[x][y]` 时，你可以直接访问被调用方法的结构体的棋盘。但我们的代码如何知道应该在哪个结构体实例上工作呢？例如，你可能有多个\
  \ `ChessBoard`。方法调用看起来如下：\n\n```cpp\nChessBoard b;\n\n// 初始化棋盘的代码 \n\nb.getMove();\n\
  ```\n\n调用与特定结构关联函数所需的代码与访问结构体字段的代码非常相似。\n\n编译器在内部处理所有细节，让方法能够访问被调用的结构体中持有的数据。在概念上，`.y`\
  \ 是“传递给”的语法缩写，这应该解释了为什么我们在标准模板库（STL）章节中使用它——那些函数的工作方式与这些方法非常相似。\n\n### 从结构体中移除函数定义\n\
  \n如果你在结构体中包含所有的函数体，情况可能会变得繁琐，你很快会发现代码变得难以阅读。有一种方法可以将方法分为两个：一个出现在结构体中的声明，另一个是在结构体外的定义。看看这个例子：\n\
  \n```cpp\nenum ChessPiece { EMPTY_SQUARE, WHITE_PAWN /* 以及其他成员 */ };\n\nenum PlayerColor\
  \ { PC_WHITE, PC_BLACK };\n\nstruct ChessBoard\n{\n\nChessPiece board[ 8 ][ 8 ];\n\
  \nPlayerColor whose_move;\n\n// 方法声明在结构体内部\n\nChessPiece getPiece (int x, int y);\n\
  \nPlayerColor getMove ();\n\nvoid makeMove (int from_x, int from_y, int to_x, int\
  \ to_y);\n\n};\n```\n\n方法声明可能在结构体中，但除此之外，这看起来只不过是一个函数原型。定义需要一种方法将它们与结构体联系起来，我们使用“作用域”（scoping）语法来实现；这将表示该方法属于该结构体。所有的语法只是在方法名后加上\
  \ `::`；但代码的其他部分是相同的：\n\n```cpp\nChessPiece ChessBoard::getPiece (int x, int y)\n\
  {\n\nreturn board[ x ][ y ];\n}\n\nPlayerColor ChessBoard::getMove ()\n{\n\nreturn\
  \ whose_move;\n}\n\nvoid ChessBoard::makeMove (int from_x, int from_y, int to_x,\
  \ int to_y)\n{\n\n// 通常我们需要先编写代码来验证移动 \nboard[ to_x ][ to_y ] = board[ from_x ][\
  \ from_y ];\nboard[ from_x ][ from_y ] = EMPTY_SQUARE;\n}\n```\n\n从现在起，我将把任何超过几行的方法的声明和定义分开。有些人会告诉你，永远不要在结构体中定义方法，因为这会导致比你真正需要了解的更多的实现信息暴露。这种情况发生得越频繁，代码编写时依赖于具体的实现细节而非方法接口的概率就越大。在指南的剩余部分中，我仍偶尔会将方法声明与类放在一起，以节省一些空间。\n\
  \n一如既往，完成测验，然后我们进入类的章节。\n\n## 测验 0\n\n为什么方法比直接使用结构体更好？\n\nA. 方法更易读\nB. 方法更快\nC.\
  \ 方法总是更好\nD. 这样方法可以...\n\n哪一个用于定义与结构关联的方法 `struct MyStruct { int func(); };`\n\n\
  A. `int func() { return 1; }`\nB. `MyStruct::func() { return 1; }`\nC. `int MyStruct::func()\
  \ { return 1; }`\nD. `int MyStruct func () { return 1; }`\n\n在类中包含方法定义的理由是什么？\n\n\
  A. 让类用户可以看到它是如何工作的\nB. 因为这会让代码更快\nC. 没有理由...\n\n\n\n\n从现在起，当我想隐藏数据的存储方式时，我将使用类（class），而在没有充分理由隐藏它时我将使用结构体（structure）。你可能会发现结构体的使用其实非常少——在编程中，隐藏数据是非常有价值的。坦率说，我唯一使用普通辅助结构体的情况是在实现一个类时，我需要一个可以存储某些数据的结构。因为这个辅助结构体是特定于类的，它不会被公开，也没有理由将其转换为一个完整的类。\n\
  \n### 隐藏数据的存储方式\n\n让我们来看看使用类来隐藏数据所需的语法。想一下——你该如何做？如何使用类来隐藏数据，同时保持某些方法对所有人都可用？通过类，你可以将每个方法和字段（称为类成员）分类为私有的（private）或公有的（public）。`public`\
  \ 允许任何人使用，而 `private` 则仅限于类成员访问。\n\n下面是一个示例，方法被声明为公共，而所有数据都声明为私有：\n\n```cpp\nenum\
  \ ChessPiece { EMPTY_SQUARE, WHITE_PAWN /* and others */ };\n\nenum PlayerColor\
  \ { PC_WHITE, PC_BLACK };\n\nclass ChessBoard\n{\npublic:\n    ChessPiece getPiece\
  \ (int x, int y);\n    PlayerColor getMove ();\n    void makeMove (int from_x, int\
  \ from_y, int to_x, int to_y);\n\nprivate:\n    ChessPiece _board[ 8 ][ 8 ];\n \
  \   PlayerColor _whose_move;\n};\n\n// 方法定义保持相同\n\nChessPiece ChessBoard::getPiece\
  \ (int x, int y)\n{\n    return _board[ x ][ y ];\n}\n\nPlayerColor ChessBoard::getMove\
  \ ()\n{\n    return _whose_move;\n}\n\nvoid ChessBoard::makeMove (int from_x, int\
  \ from_y, int to_x, int to_y)\n{\n    // 通常我们首先需要代码来验证移动性 \n    _board[ to_x ][\
  \ to_y ] = _board[ from_x ][ from_y ];\n    _board[ from_x ][ from_y ] = EMPTY_SQUARE;\n\
  }\n```\n\n这个类声明看起来和之前看到的结构体定义有点像，但有一个主要区别——关键字的使用：`public` 和 `private`。在 `public`\
  \ 关键字之后声明的任何内容都可以被对象的任何人使用，在我们的案例中，名为 `makeMove`、`getMove` 和 `getPiece` 的方法可以使用。`private`\
  \ 部分的任何内容只能由属于 `ChessBoard` 类的方法访问——`_whose_move` 和 `_board`。\n\n你可以随心所欲地在公共和私有之间切换。下一个示例展示了如何将**完全相同**的内容设为公共：\n\
  \n```cpp\nclass ChessBoard\n{\npublic:\n    ChessPiece getPiece (int x, int y);\n\
  \nprivate:\n    ChessPiece _board[ 8 ][ 8 ];\n    PlayerColor _whose_move;\n\npublic:\n\
  \    int getMove ();\n    void makeMove (int from_x, int from_y, to_x, to_y);\n\
  };\n```\n\n**注意**\n\n我在私有类元素之前加了下划线，是为了指示它们是私有的。这并不是 C++ 的要求，看起来可能有些突兀，但它确实让代码更易读。如果你选择这样做，请不要在后面使用大写字母，因为某些编译器会对此产生问题——如果你使用下划线，请使用小写字母，一切都能正常工作。\n\
  \n个人而言，我总是从公共部分开始，然后是私有部分。这样做是为了明确公共部分是为类用户（即其他程序员）准备的，因为这是他们看到的第一部分。\n\n### 声明类实例\n\
  \n当你声明一个类实例时，它并不比声明结构体实例困难：\n\n```cpp\nChessBoard b;\n```\n\n在类上调用方法也没有区别：\n\n```cpp\n\
  b.getMove();\n```\n\n区别在于术语。当声明一个特定类的新变量时，它通常被称为“对象”（object）。“对象”这个词应该让你联想到现实世界中的物体。以汽车的方向盘为例；它是一个小东西，但在它之下隐藏着巨大的复杂性。向右转只需要将方向盘向右转即可；你不需要担心它是如何工作的，你只需要这样做就行了。情况在\
  \ C++ 中也是一样；关于对象实现的所有细节都隐藏在函数调用的幕布之后，这些都是公共的，而这些函数构成了用户界面。一旦定义了界面，类就可以以它认为合适的方式来实现它；由你决定的是数据表示和方法的实现。\n\
  \n### 类职责\n\n当创建一个类时，你可以将其看作一种新的变量类型，一种数据类型。这种类型类似于 `char` 或 `int`，但它拥有强大得多的。你以前见过这种情形；C++\
  \ 字符串就是类，而字符串类就是这些新数据类型之一。在创建新数据类型时，使用 `public` 和 `private` 是完全合理的逻辑——你需要能够提供非常具体的功能，以及一个特定的接口。一个例子是字符串，它具有处理子字符串、显示自身、处理单个字符以及获取属性（如字符串长度）的能力。\n\
  \n字符串是如何实现的并不重要。\n\n如果你将类的创建被视为对新数据类型的定义，那么确定哪些内容应该是公共的（即你的类将做什么）就是完全合理的逻辑。任何使用该类的程序员都可以使用任何公共内容——它像函数包含一个或多个参数的接口一样被视为接口。\n\
  \n那么，私有意味着什么？\n\n\n\n仅仅因为你声明某个内容是私有的（private），并不意味着它会自动获得任何种的安全保证。任何类的私有字段都存储在内存中，就像公共字段一样，而且它们通常并排存储。任何优秀的程序员都可以编写包含指针技巧的代码来读取这些数据。语言或操作系统并不保证私有数据能免受黑客的攻击。私有标记的作用仅仅是确保编译器防止私有数据被意外使用。尽管在安全性方面没有保证，但这仍然很有用。\n\
  \n如果你没听说过这个词，我们用一个词来描述隐藏私有数据的公共方法——封装（encapsulation）。这意味着你的实现被隐藏或封装起来，使得类用户只能通过构成类接口的特定方法进行操作。\n\
  \n类是一个极其强大的 C++ 特性，也是一个基础构建模块。使用类意味着你可以创建规模更大且易于维护和理解的程序。已经学习了如何隐藏数据，在接下来的几个章节中，我们将看到更多类特性，从类的生命周期开始。\n\
  \n# 测验 21\n\n使用私有数据是什么？\n\nA. 为了保护你的数据免受黑客攻击\nB. 为了防止其他程序员接触它\nC. 为了清晰地显示哪些数据仅用于类的实现\n\
  D. 私有数据永远不应该使用，因为它让编程变得困难\n\n解释类（class）和结构体（structure）之间的区别\n\nA. 没有区别\nB. 类默认所有内容都是公共的\n\
  C. 类默认所有内容都是私有的\nD. 类允许你指定哪些字段是私有的或公共的，而结构体不会\n\n你应该如何处理你的类数据字段？\n\nA. 它们默认都应该是公共的\n\
  B. 它们默认都应该是私有的\nC. 它们永远不应该是公共的\nD  类没有数据！\n\n为什么要将方法设为公共？\n\nA. 你永远不应该将方法设为公共\n\
  B. 你应该始终将方法设为公共\nC. 只有在类类主要功能需要时才将其设为公共；否则将其设为私有\nD. 如果方法可能被其他人使用，就将其设为公共\n\n##\
  \ 类的生命周期\n\n在创建类时，你希望它们尽可能易用；任何类可能都需要提供以下几个基本操作的支持：\n\n1. 它需要初始化自己\n2. 它需要清理内存和/或其他资源\n\
  3. 它需要复制自己\n\n所有这些对于创建良好的数据类型都非常重要。我们将使用 `string` 来演示这一点——字符串必须能够初始化自己，即使是空的。它们应该依赖外部代码来完成这一点——一旦字符串被声明，它立即就可以一直了。当你用完字符串后，它必须能够进行清理，因为所有字符串都会分配内存。当使用\
  \ `string` 类时，不需要调用另一个方法来完成；`string` 会自动完成。\n\n最后，它必须能够从一个变量复制到另一个变量，就像整数可以在变量之间复制一样。总而言之，所有这些功能都应该是所有类的一部分，以便它们可以被轻松使用且不会被错误使用。\n\
  \n我们将一个一个来看这三个特性，看看 C++ 是如何让这一切变得简单的。\n\n### 对象构造\n\n你可能已经注意到，我们在 `ChessBoard` 接口（代码的公共部分）中没有用于初始化棋盘的代码。我们现在可以修复它。\n\
  \n当声明类变量时，该变量需要能够被初始化：\n\n```cpp\nChessBoard board;\n```\n\n当声明一个对象时，运行的代码被称为构造函数（constructor），它应该设置好对象，使其无需更多初始化即可使用。构造函数也可以接受参数——你在声明特定大小的\
  \ `vector` 时见过这一点：\n\n```cpp\nvector<int> v( 10 );\n```\n\n`vector` 构造函数带有值 `10`\
  \ 被调用；新的 `vector` 通过构造函数进行初始化，使其能够立即容 10 个整数。\n\n创建一个构造函数仅仅是声明一个与类同名的函数，且没有参数，也没有返回值。你甚至不需要给它提供\
  \ `void` 值——没有为返回值提供任何类型：\n\n```cpp\nenum ChessPiece { EMPTY_SQUARE, WHITE_PAWN\
  \ /* 以及其他成员 */ };\n\nenum PlayerColor { PC_WHITE, PC_BLACK };\n\nclass ChessBoard\n\
  {\npublic:\n    ChessBoard (); // <-- 完全没有返回值！\n    PlayerColor getMove ();\n  \
  \  ChessPiece getPiece (int x, int y);\n    void makeMove (int from_x, int from_y,\
  \ to_x, int to_y);\n\nprivate:\n    ChessPiece _board[ 8 ][ 8 ];\n    PlayerColor\
  \ _whose_move;\n};\n\nChessBoard::ChessBoard () // <-- 没有返回值\n{\n    _whose_move\
  \ = PC_WHITE;\n    // 首先清空整个棋盘，然后添加棋子\n    for ( int i = 0; i < 8; i++ )\n    {\n\
  \        for(int j = 0; j < 8; j++ )\n        {\n            _board[ i ][ j ] =\
  \ EMPTY_SQUARE;\n        }\n    }\n    // 初始化棋盘所需的其他代码\n}\n```\n\n如果方法声明没有变化，我将不再向你展示它们，但我会继续向你展示其他的。\n\
  \n\n\n通常情况下，你应该创建构造函数，以确保所有内容都按照预期方式初始化。一旦声明了自定义构造函数，C++ 就不再为你生成默认构造函数了。编译器假设你完全清楚自己在做什么，并且你会创建你所需的构造函数。特别地，如果你创建了带参数的构造函数，除非你显式声明一个，否则代码将不再拥有默认构造函数。\n\
  \n这可能会产生你意想不到的后果。如果使用了自动生成的构造函数，随后你添加了一个带参数的非默认构造函数，那么依赖于自动构造函数的代码将无法编译。提供默认构造函数是你的责任，因为编译器不会为你做。\n\
  \n## 初始化类成员\n\n每个类成员都必须在构造函数中初始化。让我们假设字符串是 `ChessBoard` 类的一个成员：\n\n```cpp\nclass\
  \ ChessBoard\n{\npublic:\nChessBoard ();\nstring getMove ();\nChessPiece getPiece\
  \ (int x, int y);\nvoid makeMove (int from_x, int from_y, int to_x, int to_y);\n\
  private:\nPlayerColor  _board[ 8 ][ 8 ];\nstring _whose_move;\n};\n```\n\n你可以非常简单地给名为\
  \ `_whose_move` 的变量赋值：\n\n```cpp\nChessBoard::ChessBoard ()\n{\n_whose_move = \"\
  white\";\n}\n```\n\n不过，你可能会在这里实际执行的代码感到惊讶。在 `ChessBoard` 构造函数的开头，`_whose_move` 的构造函数就会被调用。这是一个好消息；这意味着你的类字段可以安全地用于构造函数。如果类成员构造函数没有被调用，将没有办法使用它们。归结底，构造函数的整个前提是对象是可以使用的。\n\
  \n如果你愿意，可以将参数传递给类成员构造函数，而不是运行默认构造函数。这需要特殊的语法：\n\n```cpp\nChessBoard::ChessBoard\
  \ ()\n// 冒号后跟着变量列表，以及传递给\n// 构造函数的参数 \n: _whose_move( \"white\" ) \n{\n// 现在 _whose_move\
  \ 构造函数已经被调用，它\n// 拥有值 \"white\"\n}\n```\n\n这被称为初始化列表，你会看到几次使用这种语法来初始化类成员的情况。初始化列表的成员之间用逗号分隔。例如，如果向\
  \ `ChessBoard` 中添加了一个新成员来计算进行了多少次移动，可以使用初始化列表来初始化它：\n\n```cpp\nclass ChessBoard\n\
  {\npublic:\nChessBoard ();\nstring getMove ();\nChessPiece getPiece (int x, int\
  \ y);\nvoid makeMove (int from_x, int from_y, int to_x, int to_y);\nprivate:\nPlayerColor\
  \  _board[ 8 ][ 8 ];\nstring _whose_move;\nint _move_count;\n};\n```\n\n```cpp\n\
  ChessBoard::ChessBoard ()\n// 冒号后跟着变量列表，以及传递给\n// 构造函数的参数 \n: _whose_move( \"white\"\
  \ ) \n  , _move_count( 0 )\n{\n}\n```\n\n## 初始化列表与常量字段\n\n如果类字段被声明为常量，则该字段必须在列表中初始化：\n\
  \n```cpp\nclass ConstHolder\n{\npublic:\nConstHolder (int val);\nprivate:\nconst\
  \ int _val;\n};\n```\n\n```cpp\nConstHolder::ConstHolder ()\n: _val( val )\n{}\n\
  ```\n\n常量字段不能通过赋值来初始化，因为这些字段一旦设置就无法更改。类尚未完全形成的唯一地方就是初始化列表，这样不可变对象就可以安全地设置。同样的原因，如果一个字段是引用，它也必须在列表中初始化。\n\
  \n当我们谈到继承主题时，我们将看到更多这种列表的使用。\n\n## 对象析构\n\n与通过构造函数初始化对象的方式一样，你可能希望代码在对象不再需要时进行清理工作。例如，如果构造函数分配了内存或其他资源，最终当对象不再被使用时，这些资源必须返回给操作系统。我们称之为“销毁”一个对象，并且需要一个特殊方法——析构函数。析构函数在对象不再需要时被调用，例如当对对象指针调用\
  \ `delete` 时。\n\n在下面的示例中，我们有一个表示链表的类，其实现可能包含一个存储链表当前头节点的字段：\n\n```cpp\nstruct LinkedListNode\n\
  {\nint val;\nLinkedListNode *p_next;\n};\n\nclass LinkedList\n{\npublic:\nLinkedList\
  \ (); // 构造函数\nvoid insert (int val); // 添加节点\nprivate:\nLinkedListNode *_p_head;\n\
  };\n```\n\n正如我们之前看到的，像所有其他元素一样，链表中的头节点指向使用 `new` 关键字分配的内存。在某个时刻，这意味着当 `LinkedList`\
  \ 对象不再需要时，必须对其进行清理。这就是我们使用析构函数的原因。\n\n让我们看看为该类型添加析构函数。像构造函数一样，析构函数有一个特殊的名称——类名加波浪号（`~`）。而且和构造函数一样，它没有返回值。但是，与构造函数不同，析构函数永远不会接受任何参数。\n\
  \n```cpp\nclass LinkedList\n{\npublic:\nLinkedList (); // 构造函数\n ~LinkedList ();\
  \ // 析构函数，注意波浪号 (~)\nvoid insert (int val); // 添加节点\nprivate:\nLinkedListNode *_p_head;\n\
  };\n```\n\n```cpp\nLinkedList::~LinkedList ()\n{\nLinkedListNode *p_itr = _p_head;\n\
  while ( p_itr != NULL )\n{\nLinkedListNode *p_tmp = p_itr->p_next;\ndelete p_itr;\n\
  p_itr = p_tmp;\n}\n}\n```\n修正上面的逻辑如下：\n```cpp\nclass LinkedList\n{\npublic:\nLinkedList\
  \ (); // 构造函数\n ~LinkedList (); // 析构函数，注意波浪号 (~)\nvoid insert (int val); // 添加节点\n\
  private:\nLinkedListNode *_p_head;\n};\n```\n\n```cpp\nLinkedList::~LinkedList ()\n\
  {\nLinkedListNode *p_itr = _p_head;\nwhile ( p_itr != NULL )\n{\nLinkedListNode\
  \ *p_tmp = p_itr->p_next;\ndelete p_itr;\np_itr = p_tmp;\n}\n}\n```\n（注：由于原文代码块在提供时似乎有些错乱，此处已根据逻辑重新组织并对齐了析构函数的实现逻辑）。\n\
  \n在下面的示例中，我们有一个表示链表的类，实现可能包含一个存储链表当前头节点的字段：\n（此处参考上文）\n\n```cpp\nclass LinkedListNode\n\
  {\npublic:\n~LinkedListNode ();\nint val;\nLinkedListNode *p_next;\n};\n```\n\n\
  ```cpp\nLinkedListNode::~LinkedListNode ()\n{\ndelete p_next;\n}\n```\n\n正如我们之前看到的，像所有其他元素一样，链表中的头节点指向使用\
  \ `new` 关键字分配的内存。在某个时刻，这意味着当 `LinkedList` 对象不再需要时，必须对其进行清理。这就是我们使用析构函数的原因。\n\n让我们看看为该类型添加析构函数。像构造函数一样，析构函数有一个特殊的名称——类名加波浪号（`~`）。而且和构造函数一样，它没有返回值。但是，与构造函数不同，析构函数永远不会接受任何参数。\n\
  \n```cpp\nclass LinkedList\n{\npublic:\nLinkedList (); // 构造函数\n ~LinkedList ();\
  \ // 析构函数，注意波浪号 (~)\nvoid insert (int val); // 添加节点\nprivate:\nLinkedListNode *_p_head;\n\
  };\n```\n\n```cpp\nLinkedList::~LinkedList ()\n{\nLinkedListNode *p_itr = _p_head;\n\
  while ( p_itr != NULL )\n{\nLinkedListNode *p_tmp = p_itr->p_next;\ndelete p_itr;\n\
  p_itr = p_tmp;\n}\n}\n```\n\n在下面的示例中，我们有一个表示链表的类，实现可能包含一个存储链表当前头节点的字段：\n（此处参考上文）\n\
  \n```cpp\nclass LinkedListNode\n{\npublic:\n~LinkedListNode ();\nint val;\nLinkedListNode\
  \ *p_next;\n};\n```\n\n```cpp\nLinkedListNode::~LinkedListNode ()\n{\ndelete p_next;\n\
