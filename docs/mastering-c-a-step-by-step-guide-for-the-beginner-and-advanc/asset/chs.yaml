  \n。\n\n\n\n\n\n使用 `else` 语句时，你一个用户提供的值，看看看看看看的示例：\n\n```cpp\n#include <iostream>\n\
  using namespace std;\n\nint main ()\n{\nint x;\ncout << \"Input a number: \";\n\
  cin >> x;\nif ( x < 10 )\n{\ncout << \"You input a value\n was less than 10\" <<\
  \ '\\n';\n}\n}\n```\n\n这与第一个示例不同，因为它读取的是用户提供的值，而不是硬编码在比较中的值。\n\n是时候看看 `if` 语句可以有多灵活了。\n\
  \n\n\n\n到目前为止，我们所做的只是每次检查一个单独条件，但如果你想检查两个条件，例如正确的用户名和密码，你就需要想出一个奇奇怪的 if-else 语句。幸运的是，在\
  \ C++ 中，我们可以使用布尔运算符来执行多次检查。\n\n布尔运算符让创建稍微复杂一点的条件语句变得简单得多。例如，假设你有一个名为 `age` 的变量，并且你想同时检查它是否大于\
  \ 10 且小于 5，可以使用布尔 AND（与）运算符来确保 `age>5` 和 `age < 10` 这两个条件都为真。\n\n布尔运算符的工作方式与比较运算符非常相似——它们将根据表达式的结果返回\
  \ true（真）或 false（假）。\n\n### 布尔 NOT（非）\n\n布尔 NOT（非）运算符接受单个输入。如果输入的值为真，则结果为假；如果输入的值为假，则返回为真。例如，`not(false)`\
  \ 的结果为真，而 `not(true)` 的结果为假。而且 `not(任何非零的数字)` 的表达式也会为假。\n\nNOT 运算符符号是感叹号（`!`）。\n\
  \n这里有一个示例：\n\n```cpp\nif ( ! 0 )\n{\n  cout << \"! 0 evaluates to true\";\n}\n```\n\
  \n### 布尔 AND（与）\n\n如果两个输入都为真，布尔 AND 运算符将返回真。例如，`true AND false` 的结果为假，因为其中一个输入是假的——要结果为真，两个输入都必须为真。所以\
  \ `true AND true` 的结果为真，而 `(任何非零的数字) AND false` 的结果为假。\n\nAND 运算符使用的符号是一对和符号（`&&`）。千万不要误认为该运算符是在检查数字之间的相等性；只有当两个参数的值都为真时，它才会这样做：\n\
  \n```cpp\nif ( 1 && 2 )\n{\n  cout << \" 1 and 2 both evaluate to true\";\n}\n```\n\
  \n### 短路检查（Short-Circuiting Checks）\n\n如果布尔 AND 操作中的第一个表达式为假，第二个表达式将不会被检查，这被称为短路。这非常有用，因为你可以编写某些表达式，只有在第一个条件评估为真时才检查另一个条件。例如，这可以防止可怕的除以零问题。\n\
  \n这里有一个示例——检查 `10/x` 是否小于 2 的 if 语句：\n\n```cpp\nif ( x != 0 && 10 / x < 2 ) \n{\n\
  \  cout << \"10 / x is less than 2\";\n}\n```\n\n一旦 if 语句被评估，程序将首先检查 `x` 是否为 0。如果是，则没有需要检查后面的条件，因此它会被跳过。这意味着，除以零（这会导致你的程序崩溃）不再是一个担心。\n\
  \n如果没有这种短路机制，你将需要这样写代码：\n\n```cpp\nif ( x != 0 )\n{\n  if ( 10 / x < 2 )\n  {\n\
  \    cout << \"10 / x is less than 2\";\n  }\n}\n```\n\n短路让我们能够编写出更加整洁、易读的代码。\n\n\
  ### 布尔 OR（或）\n\n如果提供的值中有一个或两个都为真，布尔 OR 运算符将返回真。例如，`true OR false` 的结果为真，而 `false\
  \ OR false` 的结果为假。\n\nOR 运算符使用的符号是一对管道符（`||`），并且像布尔 AND 运算符一样，OR 运算符也会短路。如果条件 1\
  \ 为真，第二个将被忽略。\n\n### 组合表达式\n\n使用这些基础布尔运算符，可以同时检查两个条件。但如果我们想让事情变得更强大呢？记住，你可以由运算符、变量和值创建一个表达式，也可以由其他表达式创建表达式。\n\
  \n例如，你可以将布尔 AND 与相等比较运算符组合，检查 `x` 是否为 3 且 `y` 是否为 4：\n\n`x == 3 && y == 4`\n\n以下是我们如何使用布尔\
  \ AND 来检查用户名和密码是否正确的程序：\n\n```cpp\n#include <iostream>\n#include <string>\n\nusing\
  \ namespace std;\n\nint main ()\n{\n  string username;\n  string password;\n  cout\
  \ << \"Input your username: \" << \"\\n\";\n  getline( cin, username, '\\n' );\n\
  \  cout << \"Input your password: \" << \"\\n\";\n  getline( cin, password, '\\\
  n' );\n\n  if ( username == \"root\" && password == \"xyzzy\" )\n  {\n    cout <<\
  \ \"Access allowed\" << \"\\n\";\n  }\n  else\n  {\n    cout << \"Incorrect username\
  \ or password. Access denied!\" << \"\\n\";\n    // 这是一个非常方便的停止程序的方法，通过返回\n    return\
  \ 0;\n  }\n  // 继续执行！\n}\n```\n\n当你运行程序时，只有名为 `root` 且密码正确的访问才会被允许。将此扩展到多个用户（每个用户都有自己的密码）很容易，你可以使用\
  \ `else-if` 语句来实现。\n\n现在试一下吧，看看结果如何。\n\n### 求值顺序（Order Of Evaluation）\n\n在最后一个示例中，我们有几个子表达式，例如：\n\
