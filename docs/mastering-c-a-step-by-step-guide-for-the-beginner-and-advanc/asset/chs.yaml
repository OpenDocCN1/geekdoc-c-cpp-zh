  \n当我们谈到继承主题时，我们将看到更多这种列表的使用。\n\n## 对象析构\n\n与通过构造函数初始化对象的方式一样，你可能你可能希望代码在对象不再需要时进行清理工作。例如，如果构造函数分配了内存或其他资源，最终当对象不再被使用时，这些资源必须返回给操作系统。我们称之为“销毁”一个对象，并且需要一个特殊方法——析构函数。析构函数在对象不再需要时被调用，例如当对对象指针调用\
