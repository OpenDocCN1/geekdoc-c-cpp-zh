  \ 进行比较：\n\n```cpp\nif ( x == 2 )\n```\n\n与完全等同于\n\n```cpp\nif ( ( x == 2 ) == true\
  \ )\n```\n\n显然，第一个版本易读得多。\n\n当你编写程序时，大多数情况下你都会检查存储在变量中的值是否等于、大于或小于另一个值。\n\n以下关系运算符允许你比较值：\n\
