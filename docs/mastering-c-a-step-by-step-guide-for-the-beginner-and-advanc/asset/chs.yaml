- "# 精通 C++：初学者与高级用户分步渐进指南，包含 26 个测验和 120 多道问题\n\n\n\n![](img/cover.jpeg)\n\n\n\n\n\
  \n\n\n\n\n\n## If 语句\n\n在看过了从一个程序执行到下一个程序的程序，且在无法改变发生的情况并只能显示来自用户输入的值之后，下一个逻辑步骤是查看程序控制。通过\
  \ `if` 语句，你可以决定程序是否进入给定的代码段，为了这一点，我们使用可以为真或为假的条件。例如，你可以使用一个 `if` 语句来判读用户是否输入了正确的密码——如果是（真），用户就可以进入程序；但如果不是（假），用户就不能。\n\
  \n`if` 语句的基本语法是：\n\n```\nif (  )\n```\n\n\n\n这条语句应该被执行\n\n或者\n\n```cpp\nif ( )\n\
  {\n此块中的所有内容都应该被执行\n}\n```\n\n`if` 语句之后的代码是根据条件执行的，被称为 `if` 语句体。来看这个语法用法的愚蠢示例：\n\n\
  ```cpp\nif ( 5 < 10 )\ncout << \"Five is less than ten, who would have guessed it\"\
  ;\n```\n\n我们在这里所做的只是评估了一个“五是否小于十”的语句，只为了看它是否为真。这里是另一个使用多个语句和大括号的示例：\n\n```cpp\n\
  if ( 5 < 10 )\n{\ncout << \"Five is less than ten, who would have guessed it\\n\"\
  ;\ncout << \"I really hope this computer is working properly.\\n\";\n}\n```\n\n\
  如果 `if` 语句后面有多于一行代码，则需要使用大括号，以确保当语句求值为真时，整个代码块都会被执行。作为最佳实践，养成在语句体周围加上大括号的习惯；这样当你有多个需要执行的语句时，你就不需要一直记住要包含它们，而且会让语句体看起来更清晰。\n\
  \n最常见的错误之一是在不使用大括号的情况下向体中添加另一个语句——这会导致新语句始终执行，无论条件如何。\n\n```cpp\nif ( 5 < 10 )\n\
  cout << \"Five is less than ten, who would have guessed it\\n\";\ncout << \"I really\
  \ hope this computer is working properly.\\n\";\n```\n\n缩进可能会导致难以发现错误，所以坚持使用大括号——这样更安全！\n\
  \n这些是相当无聊的 `if` 语句，让我们来看一个可以与用户输入配合真实示例：\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\n\nint main ()\n{\nint x;\ncout << \"Input a number: \";\ncin >> x;\nif (\
  \ x < 10 )\n{\ncout << \"You input a value that was less than 10\" << '\\n';\n}\n\
  }\n```\n\n这与第一个示例不同，因为它读取的是用户提供的值，而不是硬编码在比较中的值。\n\n是时候看看 `if` 语句可以有多灵活了。\n\n## 表达式\n\
  \n`if` 语句用于测试一个表达式。表达式是一个或多个链接在一起的语句，求值为一个值。在代码中任何可以使用常量或变量值的地方，都可以使用表达式。事实上，常量和变量值实际上只是简单的表达式，而数学运算（如乘法和加法）只是更复杂的表达式。当你在比较语境下使用表达式时，结果将为真或为假。\n\
  \n### 什么是真？\n\n对于编译器而言，如果表达式求值为非零数字则为真，如果求值为零则为假。因此，像这样的语句\n\n```cpp\nif ( 1 )\n\
  ```\n\n总是会让语句体执行，但像这样的语句\n\n```cpp\nif ( 0 )\n```\n\n总是会确保语句体永远不会被执行。\n\n在 C++ 中，有两个你可以可以直接写在代码中的关键字——`true`\
  \ 和 `false`。如果你显示与 `true` 对应的整数值，它将是 1，而与 `false` 关联的整数是 0。\n\n当你使用关系运算符进行比较时，运算符将返回\
  \ `true` 或 `false`。例如\n\n```cpp\n0 == 2\n```\n\n将求值为假。注意双重等号（`==`）——这用于相等判断，而单等号用于为变量赋值。另一个检查\
  \ \n\n```cpp\n2 == 2\n```\n\n将求值为真。\n\n当在 `if` 语句中执行关系运算时，结果不需要直接与 `true` 或 `false`\
  \ 进行比较：\n\n```cpp\nif ( x == 2 )\n```\n\n与完全等同于\n\n```cpp\nif ( ( x == 2 ) == true\
  \ )\n```\n\n显然，第一个版本易读得多。\n\n当你编写程序时，大多数情况下你都会检查存储在变量中的值是否等于、大于或小于另一个值。\n\n以下关系运算符允许你比较值：\n\
  \n- `>` - 大于。例如，`6>5` 为真。\n- `<` - 小于。例如，`5<6` 为真。\n- `>=` - 大于等于。例如，`5>=5` 为真。\n\
  - `<=` - 小于等于。例如，`5<=6` 为真。\n- `==` - 等于。例如，`6==6` 为真。\n- `!=` - 不等于。例如，`6!=4` 为真。\n\
  \n### bool 类型\n\n在 C++ 中，有一种特殊类型称为 `bool`，它用于存储比较操作的结果。它与整数没有太大，但它有一个优势——非常明确了使用的只有两种可能的值——`true`\
  \ 或 `false`。在 `bool` 类型上使用 `true` 和 `false` 关键字会让事情变得更加清晰，而且你可能想知道，所有的比较运算符结果都会产生一个布尔值。\n\
  \n```cpp\nint x;\ncin >> x;\nbool is_x_two = x == 2; // 注意我们使用了双重等号进行比较\n\nif (\
  \ is_x_two )\n{\n// 现在做些什么，x 是二！\n}\n```\n\n### 语句\n\n在使用 `else` 语句时，有时你只需要一个用户提供的值，如果如果真，，，，，，，，，做\n\
  \n。\n\n\n\n使用 `else` 语句时，你一个用户语句，，看看看看的示例：\n\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\n\nint main ()\n{\nint x;\ncout << \"Input a number: \";\ncin >>\
  \ x;\nif ( x < 10 )\n{\ncout << \"You input a value\n was less than 10\" << '\\\
  n';\n}\n}\n```\n\n这与第一个示例不同，因为它读取的是用户提供的值，而不是硬编码在比较中的值。\n\n是时候看看 `if` 语句可以有多灵活了。\n\
