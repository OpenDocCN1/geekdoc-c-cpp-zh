  \ 先执行，然后是比较运算符。\n\n## 循环\n\n虽然你现在知道如何让程序根据输入以不同的方式运行，但它仍然运行一次。回到上一节的密码检查，它只会请求一次密码然后退出。为了让它在密码失败时继续执行，你可能考虑过添加一系列\
  \ if 语句。\n\n我们想要的是一种让用户在输入正确密码之前反复输入的方法，这就是循环的作用。循环重复执行代码块。\n\n### While 循环\n\n\
  while 循环是最简单的，基本结构如下：\n\n```cpp\nwhile ( ) { 当条件为真时将执行的代码块}\n```\n\n正如你可能注意到的，while\
  \ 循环与 if 语句并不相似。区别在于 while 循环体体会重复，但像 if 语句一样，我们使用布尔条件。\n\n看这个包含两个条件的 while 循环示例：\n\
  \n```cpp\nwhile ( i == 2 || i == 3 )\n```\n\n这是一个非常基础的示例：\n\n```cpp\nwhile ( true\
  \ )\n{\n  cout << \"Let’s get looping\\n\";\n}\n```\n\n只是一个快速警告——如果你运行上面的代码，循环将永远停止。这被称为死循环，要让它停止，你需要通过关闭窗口或按下\
  \ CTRL+C 或 CTRL+Break 来杀死程序。通过确保你的循环条件不会一直为真，来避免陷入这种情况。\n\n\n\n\n无限循环最常见的原因之一是在条件中只使用了一个等号而不是两个等号。\n\
  \n如果你是这样做的：\n\n```cpp\nint i = 1;\n\nwhile ( i = 1 )\n{\ncin >> i;\n}\n```\n\n循环将一直读取用户输入，直到输入除\
  \ 1 以外的数字。然而，由于循环条件被写成了 `i = 1` 而不是 `i == 1`，它所做的只是将值 `1` 赋值给 `i`。恰巧，赋值表达式的作用就像返回被赋值的值，而在这里这个值就是\
  \ `1`。你已经知道 `1` 不是零；它是真，这意味着循环将无限持续下去。\n\n这是一个程序，`while` 循环显示了从 `0` 到 `9` 的数字——且循环正常工作：\n\
  \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main ()\n{ \n    int\
  \ i = 0;  // 不要忘记你的变量\n    while ( i < 10 ) // 当 i 小于 10 时\n    { \n        cout\
  \ << i << '\\n';\n        i++;                // 更新 i，以便在某个时刻满足条件\n    }\n}\n```\n\
  \n理解循环的一种简单方法是这样的——当程序运行到循环主体的末尾时，它会直接回到主体的开头；再次检查条件，并根据结果，循环必须决定是再次执行，还是移动到代码块之后的语句。\n\
  \n### For 循环\n\nFor 循环是所有循环中最通用的之一，其语法如下：For 循环非常通用且方便。`for` 循环的语法是\n\n```cpp\n\
  for ( 变量初始化; 条件; 变量更新 ) \n{\n    // 只要条件为真，就会执行这些代码\n}\n```\n\n这里包含很多内容。让我们来看一个运行示例，它的运行方式与之前的\
  \ `while` 循环非常相似：\n\n```cpp\nfor ( int i = 0; i < 10; i++ ) \n{\n    cout << i <<\
  \ '\\n'; \n}\n```\n\n那么，这里发生了什么？\n\n首先初始化变量。我们的变量是 `int=0`，这允许我们为新变量声明并赋值，或者给已存在的变量赋值。我们声明了一个名为\
  \ `i` 的变量。当循环中只有一个需要检查的变量时，它通常被称为“循环变量”，在编程中，你经常看到循环变量被称为“i”和“j”。当一个变量在循环每次执行通过时都增加时，它被称为“循环计数器”。\n\
  \n接下来是条件。它告诉程序只要条件为真，循环就一直重复。我们正在检查 `x` 是否小于 `10`，和 `while` 循环一样，条件在第一次循环执行之前就会被检查——这样，如果它立即求为假，循环将永远不会运行。\n\
  \n最后是变量更新。这是我们更新循环变量的地方；如果你愿意，你可以在这里调用一个函数（该函数不会影响变量，但仍然很有用），或者执行类似 `i++` 或 `i+10`\
  \ 的操作。\n\n许多循环始终只有一个变量、一个条件和一个循环，这使得 `for` 循环成为编写循环的一种很棒的方式——所有相关的内容都写在同一行上。注意，分号用于分隔代码部分——这不能漏掉，即使该部分是空的。空条件会求为真，如果不采取任何措施停止它，它将直接让你进入无限循环。\n\
  \n为了更好地理解 `for` 循环，请将下面的代码与上面的 `while` 循环代码对比：\n\n```cpp\nint i; // 变量的声明和初始化\n\n\
  while ( i < 10 ) // 条件\n{\n    cout << i << '\\n';\n    i++; // 变量更新\n}\n```\n\n\
  `for` 循环做了同样的事情但方式更好。\n\n这是一个 `for` 循环示例，它的功能不仅仅是打印数字序列。这个循环将打印 `0` 到 `9` 所有数字的平方：\n\
  \n```cpp\n#include <iostream>\n\nusing namespace std; \n\nint main ()\n{\n    //\
  \ 循环在 i < 10 时运行，i 每次循环都会增加一\n    for ( int i = 0; i < 10; i++ )\n    {\n      \
  \  // 记住循环条件会在循环之前\n        // 条件语句。\n        // 这意味着当 i 等于 10 时，循环将终止。\n      \
  \  // i 在检查条件之前被更新。    \n        cout<< i << \" squared is \" << i * i << endl;\n\
  \    }\n}\n```\n\n这是一个简单的示例：\n1. 首先，我们将 `i` 设置为 `0` 以初始化变量\n2. 检查条件。`i` 小于 `10`，所以执行主体\n\
  3. 更新变量，给 `i` 上加 `1`\n4. 再次检查条件，如果为真，则循环主体将再次执行。如果不是，它将结束\n5. 这持续持续，直到 `i` 不小于 `10`\n\
  \n### Do-while 循环\n\n`do-while` 循环用于编写执行一次或多次的循环主体，其结构为：\n\n```cpp\ndo \n{\n   \
  \ // 主体...\n} while ( 条件 );\n```\n\n条件不是在开始，而是在主体的末尾测试，这意味着在检查条件之前，循环主体至少会执行一次。如果条件求为真，循环将回到开头执行。以下代码允许用户输入密码：\n\
  \n```cpp\n#include <string>\n#include <iostream>\n\nusing namespace std;\n\nint\
  \ main ()\n{\n    string password;\n    do\n    {\n        cout << \"Please input\
  \ password: \";\n        cin >> password;\n    } while ( password != \"1234\");\n\
  \n    cout << \"You are right\";\n}\n```\n\n### 循环控制流\n\n虽然检查循环条件以退出循环是很的，但有时你可能想提前退出。有一个关键字可以做到——`break`。使用\
  \ `break` 语句将让你立即离开循环。看一个示例；这可以让你离开一个可能是无限的循环：\n\n```cpp\n#include <string>\n#include\
  \ <iostream>\n\nusing namespace std;\n\nint main ()\n{\n    string password;\n \
  \   while ( 1 )\n    {\n        cout << \"Please input: \";\n        cin >> password;\n\
  \        if ( password == \"foobar\" )\n        {\n            break;\n        }\n\
  \    }\n    cout << \"Welcome, you got right\";\n}\n```\n\n\n\n\n在编程中，想要对多个相关的值进行循环是非常常见的。例如，你可能想用一个循环来打印某些电子邮件，用另一个循环来打印这些电子邮件的作者。你可以写第二个循环来完成这一点，但该循环必须在第一个循环内部执行，这被称为嵌套循环。\n\
  \n下面的示例非常简单——我们正在使用嵌套循环来打印乘法表：\n\n```cpp\n#include <iostream>\n\nusing namespace\
  \ std;\n\nint main ()\n{\n\nfor ( int i = 0; i < 10; i++ )\n{\ncout << '\\t' <<\
  \ i; // \\t 代表制表符，可以很好地格式化输出\n}\ncout << '\\n';\n\nfor ( int i = 0; i < 10; ++i\
  \ )\n{\ncout << i;\nfor ( int j = 0; j < 10; ++j )\n{\ncout << '\\t' << i * j;\n\
  }\ncout << '\\n';\n}\n}\n```\n\n在使用嵌套循环时，你经常会看到“外层循环”和“内层循环”等术语。在上面的代码中，`j` 变量是内层循环，而\
  \ `i` 变量是外层循环。你绝对不能做的是对两个循环使用同一个循环变量，如下：\n\n```cpp\nfor ( int i = 0; i < 10; i++\
  \ )\n{\n// 噢，在这里再次声明了 i！\nfor ( int i = 0; i < 10; i++ )\n{\n}\n}\n```\n\n你可以在 C++\
  \ 中嵌套多个循环，循环嵌套循环、循环嵌套循环，以此类推。\n\n### 选择合适的循环\n\n三种类型的循环——为什么我们需要这三种？说实话，你并不需要。在实际编程中，`do-while`\
  \ 循环很少使用，大多数程序员倾向于使用 `for` 循环和 `while` 循环。\n\n为了帮助你决定何时使用哪种循环，这里有几指南。随着时间的推移，你将自己发现哪些循环对你的代码更有效，这些指南不能取代经验：\n\
  \n- `for` 循环 - 如果确切知道想要循环多少次，或者正在使用乘法表，请使用 `for` 循环。这也是遍历数组的标准方式（你稍后会看到）。当变量需要更新时，不要使用\
  \ `for` 循环——它们对单条语句效果最好。\n- `while` 循环 - 如果你的循环条件很复杂，或者涉及到大量的计算来获取循环变量的值，请使用 `while`\
  \ 循环。使用这种循环，很容易看出循环何时终止，但它们不容易一眼看出每次循环发生了什么变化。如果该变化很复杂，请使用 `while` 循环——这样，程序的阅读者就\
  \ true 这不仅仅是一个更新！\n\n例如，如果你有两个不同的循环变量：\n\n```cpp\nint j = 5;\nfor ( int i = 0; i\
  \ < 10 && j > 0; i++ )\n{\ncout << i * j;\nj = i - j;\n}\n```\n\n并不是所有有意义的内容都在单行的\
  \ `for` 循环行中——有些出现在循环体的末尾。这是具有误导性的——`while` 循环会更好：\n\n```cpp\nint i = 0;\nint j\
  \ = 5;\nwhile ( i < 10 && j > 0 )\n{\ncout << i * j;\nj = i - j;\ni++;\n}\n```\n\
  \n它看起来仍然不太美，但不再具有误导性了。`while` 循环非常适合几乎无限的循环；例如象棋游戏，每个玩家都需要轮流，直到游戏结束。\n\n- `do-while`\
  \ 循环 – 这些不会被频繁使用。你可能想要使用它的唯一就是想让某些操作至少执行一次。之前的密码检查代码就是一个很好的例子，但如果你需要每次检查时循环体都略有不同，它并不是最好的循环。\n\
  \n看看这个示例——你会如何使用 `do-while` 循环来写它：\n\n```cpp\nstring password;\ncout << \"Input\
  \ your password: \";\ncin >> password;\nwhile ( password != \"xyzzy\" )\n{\ncout\
  \ << \"Incorrect password--try again: \";\ncin >> password;\n}\n\nstring password;\n\
  do\n{\nif ( password == \"\" )\n{\ncout << \"Input your password: \";\n}\nelse\n\
  {\ncout << \"Incorrect password--try again: \";\n}\ncin >> password;\n} while (\
  \ password != \"xyzzy\" );\n```\n\n`do-while` 循环让这变得复杂。循环体每次都不一样；虽然我们仍然读取用户输入，但每次的消息都是不同的。\n\
  \n### 测验 4\n\n如果运行代码 `int x; for(x=0; x<10; x++){}`，`x` 的值是多少？\n\n1. 10\n2. 9\n\
  3. 0\n4. 1\n\n对于表达式 `while(x<100);`，后面的代码块将在何时执行？\n\n1. 当 `x` 小于 100 时\n3. 当 `x`\
  \ 大于 100 时\n4. 当 `x` 等于 100 时\n5. 想要的时候\n\n哪个不是循环结构？\n\n1. `for`\n2. `do-while`\n\
  3. `while`\n4. `repeat`\n\n`do-while` 循环保证执行多少次？\n\n1. 0\n2. 无限\n3. 1\n4. 变量\n\n\
  ## 函数\n\n（注：此处由于原文存在大量重复性无效文本，已根据指令要求进行处理，保留核心逻辑）\n\n### 函数语法\n\n你已经知道如何创建一个函数。它看起来如下：\n\
  \n```cpp\nint add (int x, int y)\n{\nreturn x + y;\n}\n```\n\n如果你不想添加参数，可以使用空括号：\n\
  \n```cpp\nint no_arg_function ()\n```\n\n如果你想让函数不返回数值，请将其声明为 `void`：\n\n```cpp\n\
  void print_message()\n{\ncout << \"Hello\";\n}\n```\n\n这是一个关于如何声明和调用函数的完整示例：\n\n\
  ```cpp\n#include <iostream>\nusing namespace std;\n\nint add (int x, int y)\n{\n\
  return x + y;\n}\n\nint main ()\n{\nint result = add(1, 2);\ncout << \"The result\
  \ is: \" << result << '\\n';\ncout << \"Adding 3 and 4 gives us: \" << add(3, 4\
  \ );\n}\n```\n\n## 局部变量和全局变量\n\n有了函数会有更多的变量，每个函数有一些。当变量在函数内部声明时，你为它提供一个名称。那么，这个名称在你可以引用它的地方意味着什么？\n\
  \n局部\n\n这里有一个简单的函数：\n\n```cpp\nint addTen (int x)\n{\nint result = x + 10;\nreturn\
  \ result;\n}\n```\n\n我们有两个变量——`result` 和 `x`。`result` 变量只能在定义它的大括号内部访问，最多是 `addTen`\
  \ 函数内部的这两行代码。你还可以写另一个使用 `result` 变量的函数：\n\n```cpp\nint getValueTen ()\n{\nint result\
  \ = 10;\nreturn result;\n}\n```\n\n\n\n而且 `getValueTen` 也可以在 `addTen` 内部使用：\n\n\
  ```cpp\nint addTen (int x)\n{\n    int result = x + getValueTen();\n    return result;\n\
  }\n```\n\n现在有两个名为 `result` 的变量——在一个名为 `getValueTen` 的函数中，另一个在名为 `addTen` 的函数中。它们之间不会冲突——当每个函数执行时，它只能访问它自己的\
  \ `result` 变量，而不能访问另一个。\n\n变量的可见性被称为 `scope`（作用域）。变量作用域说的就是变量名用于访问该变量的这段代码。当你在函数内部声明变量时，它只在函数作用域内可用，换句话说，只在函数执行时可用。如果变量在一个函数作用域内声明，那么在函数执行期间调用的任何其他函数都无法访问它。当一个函数调用另一个函数时，可用的变量只有新函数中的变量。\n\
  \n函数参数也是在函数作用域内声明的。调用者无法访问这些变量，尽管这些值是由调用者提供的。在 `addTen` 函数中，名为 `x` 的变量是一个函数参数，不能在\
  \ `addTen` 函数之外任何地方使用。\n\n而且，就像你在函数中声明的任何变量一样，`x` 不能被 `addTen` 可能调用的任何函数使用。在上面的示例中，`x`\
  \ 是 `addTen` 的参数，无法被 `getValueTen` 函数访问。\n\n将参数看作传递给函数的变量的“替身”——当你更改一个参数时，它不会影响原始变量。为了做到这一点，当你将变量传递给函数时，它会被复制到参数中：\n\
  \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nvoid changeArgument (int\
  \ x)\n{\n    x = x + 5;\n}\n\nint main()\n{\n    int y = 4;\n    changeArgument(\
  \ y ); // y 不受函数调用的影响\n    cout << y; // 仍然打印 4\n}\n```\n\n变量的作用域可以比函数小得多。每一组大括号都定义了一个更窄的作用域。例如：\n\
  \n```cpp\nint divide (int numerator, int denominator)\n{\n    if ( 0 == denominator\
  \ )\n    {\n        int result = 0;\n        return result;\n    }\n    int result\
  \ = numerator / denominator;\n    return result;\n}\n```\n\n第一次声明 `result` 时，它只在\
  \ `if` 语句周围的大括号定义的作用域内。第二次声明时，其作用域仅从它声明的地方到该函数的结束。通常情况下，编译器不会阻止你创建多个具有相同名称变量，只要它们不在同一个作用域内使用即可。例如，在\
  \ `divide` 函数中，如果你在非常相似的作用域内有多个同名的变量，对于阅读你代码的外行人士来说这将是令人困惑的。\n\n因此，在函数作用域或块中声明的变量是局部变量，但你也可以拥有范围更广变量。\n\
  \n### 全局 (Global)\n\n有时，你可能希望所有函数都能访问同一个变量。以棋盘游戏为例，你可能想让棋盘作为一个全局变量——这样，几个函数就可以访问它，而不需要你将变量传递给每一个函数。\n\
  \n全局变量是在函数外部声明的，并且在任何地方都可用。\n\n这是一个使用全局变量的示例：\n\n```cpp\n#include <iostream>\n\n\
  using namespace std;\n\nint score = 0; // 全局变量\n\nvoid increaseScore()\n{\n    score\
  \ += 10;\n}\n\nint main()\n{\n    increaseScore();\n    cout << \"Score: \" << score\
  \ << endl;\n    increaseScore();\n    cout << \"Score: \" << score << endl;\n  \
  \  return 0;\n}\n```\n\n如果你想在函数内部使用全局变量，可以使用 `extern` 关键字：\n\n```cpp\n#include <iostream>\n\
  \nusing namespace std;\n\nint score = 0; // 全局变量\n\nvoid increaseScore() {\n   \
  \ extern int score; // 声明这是一个全局变量\n    score += 10;\n}\n\nint main() {\n    increaseScore();\n\
  \    cout << \"Score: \" << score << endl;\n    return 0;\n}\n```\n\n如果你在函数内部声明了一个与全局变量同名的局部变量，它会遮蔽全局变量：\n\
  \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint score = 0; // 全局变量\n\
  \nvoid increaseScore() {\n    int score = 0; // 局部变量，遮蔽全局变量\n    score += 10;\n\
  \    cout << \"Local score: \" << score << endl;\n}\n\nint main() {\n    increaseScore();\n\
  \    cout << \"Global score: \" << score << endl;\n    return 0;\n}\n```\n\n如果你想在有同名变量的情况下访问全局变量：\n\
  \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint score = 0; // 全局变量\n\
  \nvoid increaseScore() {\n    int score = 0; // 局部变量\n    ::score += 10; // 使用作用域解析运算符\
  \ ::访问全局变量\n    cout << \"Local score: \" << score << endl;\n}\n\nint main() {\n\
  \    increaseScore();\n    cout << \"Global score: \" << score << endl;\n    return\
  \ 0;\n}\n```\n\n全局变量虽然方便，但过度使用它们可能会导致代码难以维护和调试，因为任何函数都可以修改它们的值。因此，通常建议使用局部变量和参数传递来处理数据。\n\
  \n\n\n\n不要忘记；虽然可以在函数定义之前调用它，但你最终必须在某处定义它，否则你的代码将无法编译。\n\n# 将代码拆分为函数\n\n知道如何写函数是一回事；知道何时使用它完全是另一回事。\n\
  \n### 重复代码\n函数的设计是为了让代码复用变得更容易。你不需要不断重写或复制/粘贴代码，只需要在需要该逻辑时调用函数即可。如果你不断地复制粘贴，你将得到一个冗长、难以阅读且充满重复代码的程序。函数可以节省空间和时间，还能让你的代码更易于读。此外，当你需要进行更改时，只需要修改该函数，而不需要修改散落在代码各处的五十个不同实例（而且可能遗漏其中至少一个！）。\n\
  \n一条经验法则——如果你编写/使用了某段代码超过了三次，就把它写成一个函数。\n\n### 更简洁代码\n老实说，即使你不需要复用代码，一段长而复杂的代码块也很难以阅读和理解。将其转换为函数提供了一种更简单的方法来表达：“这就是我想要的概念”，然后使用它。例如，当一个函数为你完成了某操作时，读取“读取用户输入”这一概念会变得容易得多。实现获取按键并将其转换为可读入变量的代码是复杂的——如果你只需要读取如下内容，效果会好得多：\n\
  \n```\nint x;\ncin >> x;\n```\n\n这比看完整的细节好得多。如果你在编写代码并苦于理解大局，请尝试编写函数来更好地组织内容。这样，你就可以关注函数接受的输入和输出，而不是所有细碎的细节。\n\
  \n是的，有时你需要知道那些细节，但并非一直都如此。当你需要时，只需看一眼函数内部——一切内容都在那里。\n\n以一个菜单程序为例。当用户选择一个菜单项时，代码可能会非常复杂。菜单中的每个选择都应该有一个对应的函数，通过查看该函数就能轻松理解每个选择。此外，主输入代码的结构会更好且更易读。最糟糕的程序将是主函数中充满了大量的杂乱代码——你很快就会看到一个这样的示例。\n\
  \n### 函数命名与重载\n给函数命名时，就像变量命名一样，你需要给它起一个好名字——这会准确地告诉你是函数的功能。当函数被调用时，代码实现并不在你面前，所以你的命名必须描述函数的动作。这意味着你可能想为多个函数使用相同的名称。以一个根据三个坐标计算三角形面积的函数为例：\n\
  \n```\nint computeTriangleArea (int x1, int y1, int x2, int y2, int x3, int y3);\n\
  ```\n\n如果我们想要另一个函数，根据三角形的高度和宽度来给出三角形面积呢？你可以再次使用 `computeTriangleArea` 这个名字，因为它确实描述了你在做什么，但重复使用同一个名称会引起冲突吗？\n\
  \n不会。C++ 允许你对函数进行重载，这意味着只要每个函数具有不同的参数列表，你就可以为多个函数使用同一个名称。所以，你可以写成：\n\n```cpp\nint\
  \ computeTriangleArea (int x1, int y1, int x2, int y2, int x3, int y3);\n```\n\n\
  以及这个：\n\n```cpp\nint computeTriangleArea (int width, int height);\n```\n\n编译器可以区分它们，因为每个接受的参数数量不同。你也可以让两个函数具有相同数量的参数，只要它们是不同的\n\
  \n如果你这样写：\n\n```cpp\ncomputeTriangleArea( 1, 1, 1, 4, 1, 9 );\ncomputeTriangleArea(\
  \ 5, 10 );\n```\n\n编译器将知道需要调用哪个函数。\n\n不要过度使用这一特性。当你有两个函数使用不同的参数执行相同的事情，但你不想有太多同名的函数时，重载是有用的。\n\
  \n### 测验 5\n\n以下哪一个不是正确的原型（prototype）？\n\n1. `int funct(char x, char y);`\n2. `double\
  \ funct(char x)`\n3. `void funct();`\n4. `char x();`\n\n取原型为 `int func(char x, double\
  \ v, float t);` 的函数——它的返回类型是什么？\n\n1. `char`\n2. `int`\n3. `float`\n4. `double`\n\
  \n假设该函数存在，以下哪一个是有效的函数调用？\n\n1. `funct;`\n2. `funct x, y;`\n3. `funct();`\n4. `int\
  \ funct();`\n\n以下哪一个是一个完整的函数？\n\n1. `int funct();`\n2. `int funct(int x) {return\
  \ x=x+1;}`\n3. `void funct(int) {cout<<\"Hello\"}`\n4. `void funct(x) {cout<<\"\
  Hello\"};`\n\n# Switch 分支与枚举\n\n让我们进入条件执行代码的部分。有时，你会有很多条件需要检查，并编写大量的 `if-else` 语句。例如，假设你读取了一个用户输入的按键；你可能想将其与五个值进行比较，可能更多。如果你的程序是一个游戏，你可能在检查它是否为方向键按下之一或空格键。在本节中，我们将通过\
  \ `switch` 语句处理多个条件的检查，还会查看适用于 `switch` 的简单类型。\n\n这是 `switch` 的基本布局：\n\n```cpp\n\
  switch (variable )\n{\ncase this-value:\n// 当 variable 等于 this-value 时执行的代码\nbreak;\n\
  case that-value:\n// 当 variable 等于 that-value 时执行的代码\nbreak;\n// ...\ndefault:\n\
  // 当 variable 不等于任何已知项时执行的代码\nbreak;\n}\n```\n\n注意在每个代码块后使用了 `break` 关键字。这阻止了程序向下穿透执行下一个\
  \ case 的代码。\n\n你提供的每个 case 值必须是常量表达式，所以你不能这样做：\n\n```cpp\nint a = 10;\nint b = 10;\n\
  switch ( a )\n{\ncase b:\n// 代码\nbreak;\n}\n```\n\n如果你尝试编译这段代码，将得到一个错误，提示 `b` 不能作为常量表达式。\n\
  \n下面的示例是可以运行的程序，展示了如何使用 `switch` case：\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\n\nvoid playgame () {}\nvoid loadgame () {}\nvoid playmultiplayer () {}\n\
  \nint main ()\n{\n    int input;\n    cout << \"1\\. 游戏\\n\";\n    cout << \"2\\\
  . 加载游戏\\n\";\n    cout << \"3\\. 多人游戏\\n\";\n    cout << \"4\\. 退出\\n\";\n    cout\
  \ << \"选择: \";\n    cin >> input;\n\n    switch ( input )\n    {\n    case 1:\n\
  \        playgame();\n        break;\n    case 2:\n        loadgame();\n       \
  \ break;\n    case 3:\n        playmultiplayer();\n        break;\n    case 4:\n\
  \        cout << \"感谢游玩!\\n\";\n        break;\n    default:\n        cout << \"\
  错误，输入无效，退出\\n\";\n        break;\n    }\n}\n```\n\n这段代码可以编译，并提供了一个处理用户输入的基本概念。你可能注意到，我们在程序退出之前只给了用户一次选择机会。如果输入了错误的值，那就倒霉了。你可以通过将整个\
  \ `switch` case 块放在循环内部来修复这个问题，但 `break` 语句会发生什么？它们会让循环退出吗？不，它们不会。`break` 语句只会到\
  \ `switch` 语句的结尾，而不在其他任何地方。\n\n\n\n\n\n## 比较 Switch Case 与 If-Else\n\n如果你对 `switch`\
  \ 语句的逻辑感到困惑，那么它非常像为每个 `case` 语句编写一个 `if` 语句：\n\n```cpp\nif ( 1 == input ) \n{\n\
  \    playgame();\n}\nelse if ( 2 == input )\n{\n    loadgame();\n}\nelse if ( 3\
  \ == input )\n{\n    playmultiplayer();\n}\nelse if ( 4 == input )\n{\n    cout\
  \ << \"Thank you for playing!\\n\";\n}\nelse\n{\n    cout << \"Error, bad input,\
  \ quitting\\n\";\n}\n```\n\n那么，既然我们可以用 `if-else` 语句来完成所有工作，为什么还需要 `switch` 语句呢？最大的优势是\
  \ `switch` 语句让程序流程清晰——你有一个变量来控制代码的路径。如果你使用多个 `if-else` 语句，每一个条件都必须仔细阅读。\n\n## 使用枚举创建简单数据类型\n\
  \n有时，你可能想要使用一个只能取少数几个值的变量，而且这些值都是预先已知的。假设你想为用户选择的所有可能的背景颜色提供常量。如果我们能有一组常量以及一个只存储这些常量的变量类型，将非常方便。如果该变量能与\
  \ `switch-case` 语句一起工作就更好了，因为你已经知道了所有的可能值。\n\n好消息是，我们可以这样做，而且我们通过 `enums`（枚举）来实现。`enum`\
  \ 是“enumerated type”的缩写，它是一种使用枚举列表或固定值列表创建的变量类型。一个很好的例子是彩虹的颜色：\n\n```cpp\nenum RainbowColor\
  \ {\n    RC_RED, RC_ORANGE, RC_YELLOW, RC_GREEN, RC_BLUE, RC_INDIGO, RC_VIOLET\n\
  };\n```\n\n有几点你应该注意：\n\n- 我们使用 `enum` 关键字来引入新的枚举。\n- 我们为该类型起了一个自己的名称——`RainbowColor`。\n\
  - 我们列出了该类型的所有可能值。\n- 并且别忘了我们的分号。\n\n现在我们可以声明一个 `RainbowColor` 类型的特殊变量：\n\n`RainbowColor\
  \ chosen_color = RC_RED;`\n\n代码如下所示：\n\n```cpp\nswitch (chosen_color)\n{\n    case\
  \ RC_RED: /* color screen red */\n    case RC_ORANGE: /* color screen orange */\n\
  \    case RC_YELLOW: /* color screen yellow */\n    case RC_GREEN: /* color screen\
  \ green */\n    case RC_BLUE: /* color screen blue */\n    case RC_INDIGO: /* color\
  \ screen indigo */\n    case RC_VIOLET: /* color screen violet */\n    default:\
  \ /* handle unexpected types */\n}\n```\n\n因为该类型是枚举的，我们几乎可以确定所有可能的变量值都包含在内。\n\n\
  你的 `enums` 拥有什么值？如果你在声明 `enum` 时没有提供值，该值将是上一个 `enum` 的值加一。第一个 `enum` 的值为 0，所以下一个是\
  \ 1，然后是 2，以此类推。\n\n你可以定义值，如果你需要从另一个系统或你想要重用的代码获取特定值，这是一个实用的做法，并为这些值命名：\n\n```cpp\n\
  enum RainbowColor {\n    RC_RED = 1, RC_ORANGE = 3, RC_YELLOW = 5, RC_GREEN = 7,\
  \ RC_BLUE = 9,\n    RC_INDIGO = 11, RC_VIOLET = 13\n};\n```\n\n`enums` 如此实用的原因之一是它们让你对一个原本会硬编码在程序中的值命名。假设你想做一个井棋游戏；棋盘上的\
  \ X 和 O 需要被表示。你可以用 0 表示空格，用 1 表示 O，用 2 表示 X。为了这一点，你可能需要代码将每个棋盘格与值 0、1 和 2 进行比较：\n\
  \n```cpp\nif ( board_position == 1 )\n{\n    /* do something, it's an O */\n}\n\
  ```\n\n这并不易于阅读——代码中有一个魔数（magic number），它有含义，但除非你注释代码，否则并不清楚含义是什么。使用 `enums`，你可以为这些值命名：\n\
  \n```cpp\nenum TicTacToeSquare { TTTS_BLANK, TTTS_O, TTTS_X };\n\nif ( board_position\
  \ == TTTS_O )\n{\n    /* some code */\n}\n```\n\n现在，如果未来有任何需要修复的 bug，执行操作的人可以确切地看到应该发生什么。\n\
  \n`enums` 在处理固定输入时非常棒，而 `switch-case` 语句与用户输入配合得很好。然而，它们都没有解决同时处理两个以上多个值的问题。例如，你可能想要读取一个长长的足球统计数据并处理它们。对于这类任务，你不需要\
  \ `switch` case 块——你需要一种存储大量数据并对其进行操作的方法。\n\n我们将在指南的第 3 部分讨论这个问题，但在那之前，我们需要学习更多如何使用小数据集让程序以不同的方式运行的知识。\n\
  \n### 测验 6\n\n以下哪一个跟在 `case` 语句后面？\n1. `:`\n2. `;`\n3. `-`\n4. `newline`\n\n在声明\
  \ `enum` 时如果没有提供值，值将是？\n1. `end;`\n2. `break;`\n3. `Stop;`\n4. `newline`\n\n为了避免穿，应该使用什么关键字？\n\
  1. `all`\n2. `contingency`\n3. `default`\n4. `other`\n\n查看以下代码并确定输出：\n\n```cpp\n\
  int x = 0;\nswitch (x )\n{\n    case 1: cout << \"One\";\n    case 0: cout << \"\
  Zero\";\n    case 2: cout << \"Hello World\";\n}\n```\n1. `One`\n2. `Zero`\n3. `Hello\
  \ World`\n4. `Zero`\n\n## 随机化你的程序\n\n有两种方法可以让你的程序执行操作：\n1. 从用户处获取输入（或从文件获取）\n2.\
  \ 让程序行为不同\n\n对于许多情况，第一种方法可行，对于大多数用户来说，可预测性很好。假设你正在写一个网络浏览器或文本编辑器；通常情况下这样做很好。\n\n\
  然而，相同的行为会产生巨大的问题。我们很多计算机游戏依赖随机性——以俄罗斯方块为例。如果掉落序列都是相同的，用户就能记住它们，因为他们知道了即将发生什么。\n\n\
  幸运的是，并不总是需要随机数。相反，我们可以生成伪随机数，为此计算机需要称为种子（seed）的东西。它对其进行某些数学变换，转换为另一个数字，作为生成器的种子。如果程序每次都选择不同的种子，从本质上说，你永远不会得到相同的随机序列。\n\
  \n数学变换经过精心挑选，以确保随机数以相同的频率出现，而没有明显的模式。所有这一切都由 C 提供，所以你不需要担心数学；你只需要使用函数。你只需要提供随机种子，这可以简单地使用当前时间。\n\
  \n### C++ 中的随机数\n\nC++ 中有两个用的函数——一个设置随机种子，另一个使用该种子生成随机数：\n\n```cpp\nvoid srand (int\
  \ seed);\n```\n\n`srand` 设置它接收的数字作为种子，并在程序开始时调用一次。通常，使用 `srand` 的方法是给它传递 `time`\
  \ 函数的结果——返回值代表当前时间的数字：\n\n`srand( time( NULL));`\n\n如果你连续调用 `srand`，你会反复看到随机数生成器，这会导致随机性降低。\n\
  \n使用 `srand` 需要使用名为 `cstdlib` 的头文件，并且对于使用 `time` 函数，还需要 `ctime` 头文件。\n\n```cpp\n\
  #include <cstdlib>\n#include <ctime>\n\nint main ()\n{\n    // 在开始时调用一次\n    srand(\
  \ time( NULL ) );\n}\n```\n\n\n\n[content]\n\n现在我们可以获取随机数了；我们调用 `rand` 函数，其原型如下：\n\
  \n```cpp\nint rand ();\n```\n\n`rand` 不接受参数；它做的只是返回一个数字：\n\n```cpp\n#include <cstdlib>\n\
  #include <ctime>\n#include <iostream>\n\nusing namespace std;\n\nint main ()\n{\n\
  \    // 在开始时调用一次\n    srand( time( NULL ) );\n    cout << rand() << '\\n';\n}\n\
  ```\n\n这在每次运行时表现都不同 —— 每次返回的数字都不一样！\n\n好了，这可能没那么兴奋，因为数字的范围非常大。但如果你能获取指定范围内的数字，你就可以做更多事情。事实上，`rand`\
  \ 返回的值是 0 到 `RAND_MAX` 常量之间的值，至少为 32767，这是一个很大的数。大多数情况下，你只需要一个较小的范围。一种方法是在循环内部调用\
  \ `rand`，并等待出现指定范围内的数字：\n\n```cpp\nint randRange (int low, int high)\n{\n    while\
  \ ( 1 )\n    {\n        int rand_result = rand();\n        if ( rand_result >= low\
  \ && rand_result <= high )\n        {\n            return rand_result;\n       \
  \ }\n    }\n}\n```\n\n但那不是一个好的方法。它很慢，而且不能保证能终止 —— 你可能根本得不到想要的数字？幸运的是，有一种方法可以保证结果。\n\
  \n这是一种使用取模运算符的 C++ 操作。它将返回除法操作的余数，例如 4/3 —— 答案是 1，余数为 1。任何数字除以 4，其余数总是在 0 到 3 之间。将随机数除以范围大小，你就能得到一个\
  \ 0 到范围大小之间的数字（但不包含大小本身）。\n\n这是一个示例：\n\n```cpp\n#include <cstdlib>\n#include <ctime>\n\
  #include <iostream>\n\nusing namespace std;\n\nint randRange (int low, int high)\n\
  {\n    // 我们获取一个随机数，范围在 0 到 high 与 low 的差值之间\n    // 然后加上最小可能的值\n    return rand()\
  \ % ( high - low ) + low; \n}\n\nint main ()\n{\n    srand( time( NULL ) );\n  \
  \  for ( int i = 0; i < 1000; ++i )\n    {\n        cout << randRange( 4, 10 ) <<\
  \ '\\n';\n    }\n}\n```\n\n必须给值加上 low，以确保我们获得正确的范围。假设我们想要一个 10 到 20 之间的数字；首先我们需要一个\
  \ 0 到 10 之间的随机数，然后给范围加上 10。\n\n能够在指定范围内获取随机数，意味着你可以创建各种游戏。\n\n### 测验 7\n\n如果在调用\
  \ `rand` 之前没有调用 `srand`，会发生什么？\n\nA. `rand` 将失败\nB. `rand` 将始终返回 0\nC. 每当程序运行时，`rand`\
  \ 都会返回相同的序列\n\n使用当前时间为 `srand` 设置种子的目的是什么？\n\nA. 确保你的程序始终以相同的方式运行\nB. 每当你的程序运行时都生成新的随机数\n\
  C. 确保计算机只生成实数\nD. 这是自动完成的；如果你想让种子相同，只需调用 `srand` 即可。\n\n`rand` 返回什么范围的值？\n\n1. 你任何需要的范围\n\
  2. 0 到 1000\n3. 0 到 `RAND_MAX`\n4. 1 到 `RAND_MAX`\n\n表达式 `1 % 3` 将返回什么？\n\n1. 3\n\
  2. 1\n3. 8\n4. 2\n\n应该何时使用 `srand`？\n\nA. 每当你需要随机数时\nB. 永远不要\nC. 仅在开始时使用一次\nD. 每隔一段时间，为了增加随机性\n\
  \n## 第 3 章：中级\n\n到目前，我们查看了执行少数功能的简单程序。我们已经了如何显示、根据用户输入做决策、与用户交互、进行简单操作等等。这样做一段时间后，你会感到无聊，因为你只在处理少量数据。当我们开始处理大数据量时，事情就变得有趣了。在指南的范围内，我们将介绍一种存储多个数据的方法，如何读取、存储和处理它们，而不需要多个变量。\n\
  \n## 数组\n\n那么，你如何存储大量数据呢？使用数组。这基本上是一个只有一个名称但存储许多值的变量，每个值都用一个数字索引。它是一个编号的列表，每个元素都可以通过它的数字访问。从视觉上来看，它们非常简单：`val0`、`val1`、`val2`、`val4`、`val5`。每一个框都是独立的元素，要检索其中一个，你只需要请求给定框中的值。这就是数组的魔力所在。因为所有数组值都用一个名称存储，你可以在运行时选择你想要的元素。假设你想要一个扑克手，五张牌。所有五张牌将存储在一个大小为\
  \ 5 的数组中。要选一张牌，只需更改设置的索引，而无需使用新变量。\n\n\n\n\n\n棋板看起来是这样的：\n\n[0][0][0][1][0][2]\n\
  \n[1][0][1][1][1][2]\n\n[2][0][2][1][2][2]\n\n因为二维数组是矩形的，你必须使用两个索引来访问它——行和列。你只需要提供每个索引的值。\n\
  \n当你拥有一个形状像网格的数组时，组织数据会变得简单得多。以之前的井字棋盘为例——你只需要将每个数组元素的值设置为与棋板上的当前位置匹配即可。\n\n###\
  \ 在 for 循环中使用数组\n\n数组与 `for` 循环配合得非常好；你将一个变量初始化为 `0` 来访问数组，该变量会不断增加，直到它达到数组的大小。这种模式完美符合\
  \ `for` 循环的模型。\n\n看这个示例程序，它展示了如何使用 `for` 循环创建一个乘法表，并将结果存储在二维数组中：\n\n```cpp\n#include\
  \  <iostream>\n\nusing namespace std;\n\nint main ()\n{\nint array[ 8 ][ 8 ]; //\
  \ 声明一个看起来像棋盘的数组\n\nfor ( int i = 0; i < 8; i++ ) \n{\nfor ( int j = 0; j < 8; j++\
  \ )\n{\narray[ i ][ j ] = i * j; // 给元素赋值\n}\n}\n\ncout << \"Multiplication table:\\\
  n\";\n\nfor ( int i = 0; i < 8; i++ ) \n{\nfor ( int j = 0; j < 8; j++ )\n{\ncout\
  \ << \"[ \" << i <<\" ][ \" << j <<\" ] = \";\ncout << array[ i ][ j ] <<\" \";\n\
  cout << \"\\n\";\n}\n}\n}\n```\n\n### 将数组传递给函数\n\n你很快就会学到程序中的许多功能部分之间是相互作用的。例如，有了你对数组的新颖知识，你可能会问数组如何传递给函数呢？在语法上，这非常简单；当你调用函数时，直接使用数组名即可：\n\
  \n```cpp\nint values[ 10 ];\nsum_array( values );\n```\n\n当你声明函数时，数组名的写法如下：\n\n\
  ```cpp\nint sum_array (int values[]);\n```\n\n等一下。我们没有给出数组的大小。对于一维数组，你不需要提供。你只需要在定义数组时提供大小，以便编译器可以创建足够的空间。当数组被传递到函数时，只有原始数组会进入——因为我们没有创建新数组，所以不需要提供大小。\n\
  \n如果你对传递给函数的数组进行了修改，任何修改在函数返回后都会生效。我们之前看到普通变量会被复制；当函数接收参数且持有该参数值的变量被修改时，原始值不会受到影响。\n\
  \n然而，除非函数知道数组的大小，否则为了使用它，函数需要第二个参数来提供数组的大小：\n\n```cpp\nint sumArray (int values[],\
  \ int size)\n{\nint sum = 0;\nfor ( int i = 0; i < size; i++ )\n{\nsum += values[\
  \ i ];\n}\nreturn sum;\n}\n```\n\n另一方面如果传递的是多维数组，你需要提供所有的大小，除了第一个之外（例如 `int check_tic_tac_toe\
  \ (int board[][ 3 ])`）。\n\n奇怪吗？是的，但目前你只需要记住第一个维度包含在内的——如果你确实添加了它，不用担心——它会被直接忽略。\n\
  \n当我们学到指针章节时，我们会更多更多关于将数组传递给函数的内容，我还会谈论底层发生了什么。所以，如果你现在还没有完全理解，不要担心——你以后会明白。\n\n\
  这里有一个展示 `sum_array` 函数运行的完整程序：\n\n```cpp\n#include  <iostream>\n\nusing namespace\
  \ std;\n\nint sumArray (int values[], int size)\n{\nint sum = 0;\n// 数组在 i == size\
  \ 时停止，因为最后一个元素是 size - 1\nfor ( int i = 0; i < size; i++ ) \n{\nsum += values[ i\
  \ ];\n}\nreturn sum;\n}\n\nint main ()\n{\nint values[ 10 ];\nfor ( int i = 0; i\
  \ < 10; i++ )\n{\ncout << \"Enter value \" << i << \": \";\ncin >> values[ i ];\n\
  } \ncout << sumArray( values, 10 ) << endl;\n}\n```\n\n想一想如果不使用数组，代码该如何写。将没有方法存储这些值，因此你需要维护一个运行总量——每当用户输入一个值时，你都需要立即将其相加。如果你以后想显示所有的数字（例如显示哪些被加过了），你将无法轻松追踪它们。\n\
  \n### 越界写入\n\n虽然你可以自由地对数组元素进行任何操作，但你不应该做的一件事是在最后一个数组元素之后写入任何数据。例如，如果你有一个包含 10 个元素的数组，并尝试向索引\
  \ 10 写入：\n\n```cpp\nint my_array[ 10 ];\nmy_array[ 10 ] = 4; // 尝试写入第 11 个元素\n```\n\
  \n最后一个索引是 size - 1。如果你尝试向索引 10 写入，就会越界。\n\n### 数组排序\n\n如果你想对数组进行排序，可以使用循环找到最小值并进行交换。这是一个基础示例：\n\
  \n（此处省略代码块，由于原文末尾存在部分重复和不完整的句子，已根据数组排序算法的语境进行了逻辑对齐）\n\n\n\n\n\n```cpp\nvoid sort\
  \ (int array[], int size)\n{\n    for ( int i = 0; i < size; i++ )\n    {\n    \
  \    int index = findSmallestRemainingElement( array, size, i );\n        swap(\
  \ array, i, index );\n    }\n}\n```\n\n最后，必须实现 `swap` 函数。由于原始数组可以被传递给它的函数修改，因此我们只需要交换这些值，并使用一个临时变量保存第一个被覆盖的值即可：\n\
  \n```cpp\nvoid swap (int array[], int first_index, int second_index)\n{\n    int\
  \ temp = array[ first_index ];\n    array[ first_index ] = array[ second_index ];\n\
  \    array[ second_index ] = temp;\n}\n```\n\n因为传递到 `swap` 函数的数组可以直接被修改，这就是我们所需要做的。如果你想证明这真的有效，只需用随机生成的数据填充数组并对其进行排序即可。\n\
  \n这里是完整的程序：\n\n```cpp\n#include  <cstdlib>\n#include  <ctime>\n#include  <iostream>\n\
  \nusing namespace std;\n\nint findSmallestRemainingElement (int array[], int size,\
  \ int index);\nvoid swap (int array[], int first_index, int second_index);\n\nvoid\
  \ sort (int array[], int size)\n{\n    for ( int i = 0; i < size; i++ )\n    {\n\
  \        int index = findSmallestRemainingElement( array, size, i );\n        swap(\
  \ array, i, index );\n    }\n}\n\nint findSmallestRemainingElement (int array[],\
  \ int size, int index)\n{\n    int index_of_smallest_value = index;\n    for (int\
  \ i = index + 1; i < size; i++)\n    {\n        if ( array[ i ] < array[ index_of_smallest_value\
  \ ] )\n        {\n            index_of_smallest_value = i;\n        }\n    }\n \
  \   return index_of_smallest_value;\n}\n\nvoid swap (int array[], int first_index,\
  \ int second_index)\n{\n    int temp = array[ first_index ];\n    array[ first_index\
  \ ] = array[ second_index ];\n    array[ second_index ] = temp;\n}\n\n// 一个简单的辅助方法，用于显示排序前后的数组\n\
  void displayArray (int array[], int size)\n{\n    cout << \"{\";\n    for ( int\
  \ i = 0; i < size; i++ )\n    {\n        // 这种模式对于格式化列表非常常见\n        //——只需检查我们是否已经过了第一个元素，\n\
  \        // 如果是，就添加一个逗号\n        if ( i != 0 )\n        {\n            cout << \"\
  , \";\n        }\n        cout << array[ i ];\n    }\n    cout << \"}\";\n}\n\n\
  int main ()\n{\n    int array[ 10 ];\n    srand( time( NULL ) ); \n    for ( int\
  \ i = 0; i < 10; i++ )\n    {\n        // 较小的数字更容易读得多！\n        array[ i ] = rand()\
  \ % 100;\n    }\n    cout << \"Original array: \";\n    displayArray( array, 10\
  \ );\n    cout << '\\n';\n    sort( array, 10 );\n    cout << \"Sorted array: \"\
  ;\n    displayArray( array, 10 );\n    cout << '\\n';\n}\n```\n\n这种排序算法被称为 `insertion\
  \ sort`（插入排序），但它并不是用于数字排序的最快算法。不过，它确实有一个明显的优势——易于理解且易于实现。如果你有一个极大的数据集需要处理，你可能会考虑更快的算法，但实现它们并不那么容易。这只是你在编程之旅中会遇到的权衡之一，而且在大多数情况下，最简单的算法也是最好的。相反，如果你有一个每天有数百万访问客的网站，那么这种简单的算法将无法胜任。你的工作是根据数据量以及速度对你有多么重要来做出正确的决定。\n\
  \n如你所见，数组非常强大。我们可以处理多得的数据并有效地组织它们，但我们还没有解决所有问题。如果我们在一个地方有几十个不同的、相互相关的值呢？我们该如何将它们关联起来？虽然数组对于组织独立的数据很棒，但它们无法帮助我们组织相关的数据，这是我们接下来要讨论的内容，当我们讨论结构（structures）时。\n\
  \n另一个问题是内存问题——数组将提供你所需的固定内存，但该数量是在你定义和声明数组时就已经确定的。如果你想处理和存储无限的数据呢？固定大小数组也无法满足这一点，但再次，我们很快就会给出该解决方案。现在，进入下一个测验。\n\
  \n### 测验 8\n\n以下哪种是声明数组的正确方式？\n\nA. `int anarray[ 10 ];`\nB. `int anarray;`\nC.\
  \ `anarray{ 10 };`\nD. `array anarray[ 10 ];`\n\n在一个包含 29 个元素的数组中，最后一个元素的索引号是多少？\n\
  \nA. `29`\nB. `28`\nC. `0`\nD. `由程序员定义`\n\n以下哪项是二维数组？\n\nA. `array anarray[ 20 ][\
  \ 20 ];`\nB. `int anarray[ 20 ][ 20 ];`\nC. `int array[ 20, 20 ];`\nD. `char array[\
  \ 20 ];`\n\n访问一个包含 100 个元素的名为 `foo` 的数组的第 7 个元素的正确方式是哪一个？\n\nA. `foo[ 6 ]`\nB. `foo[\
  \ 7 ]`\nC. `foo( 7 )`\nD. `foo;`\n\n以下哪种是声明二维数组的正确方式？\n\nA. `int func( );`\nB. `int\
  \ func()[];`\nC. `int func( );`\nD. `int func[ ]`\n\n## 结构\n\n现在你已经知道如何组合变量，并开始考虑结构了。结构非常像你填写的一个表。它为每个独立的数据项提供了字段，但每个数据字段都是相互相关的。你通过定义表来声明结构，然后声明一个结构类型的变量——这创建了表的副本，并可以使用它存储数据。\n\
  \n访问字段需要使用名称（而不是结构本身——每个变量都有自己的字段值），然后紧跟一个点和字段名：\n\n```cpp\n// 声明变量\nSpaceShip my_ship;\n\
  \n// 使用\nmy_ship.x_coordinate = 40;\nmy_ship.y_coordinate = 40;\nmy_ship.name =\
  \ \"USS Enterprise (NCC-1701-D)\";\n```\n\n如你所见，结构可以有多个字段，根据需要可以有任意多个，并且它们可以都是不同的类型。以下示例显示了输入的五个游戏玩家名称（我们没有包含游戏部分），这是数组和结构的结合：\n\
  \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nstruct PlayerInfo\n{\n\
  \    int skill_level;\n    string name;\n};\n\nusing namespace std;\n\nint main\
  \ ()\n{\n    // 就像对于普通变量类型一样，数组也可以由结构组成\n    PlayerInfo players[ 5 ];\n    for (\
  \ int i = 0; i < 5; i++ )\n    {\n```\n\n\n\n\n```cpp\ncout << \"Please input the\
  \ player name: \" << i << '\\n';\n\n// first access the array element, using standard\n\
  // array syntax; then access the structure field\n// using the '.' syntax\ncin >>\
  \ players[ i ].name;\n\ncout << \"Please input the skill level for \" << players[\
  \ i ].name << '\\n';\ncin >> players[ i ].skill_level;\n}\n\nfor ( int i = 0; i\
  \ < 5; ++i )\n{\ncout << players[ i ].name << \" is at skill level \" << players[\
  \ i ].skill_level << '\\n';\n}\n}\n```\n\n名为 `PlayerInfo` 的结构体声明了两个字段——玩家名称和玩家技能等级。由于\
  \ `PlayerInfo` 可以像任何变量类型一样被使用，因此可以很容易地创建一个玩家数组。当创建一个结构体数组时，每个元素都被视为该结构体的一个实例——访问第一个结构体中的字段将是\
  \ `players [0.] name;`，这将获取第一个元素中的玩家名称。\n\n这个程序所做的是充分利用了结合结构体和数组的简洁能力。这让我们能够用一个\
  \ `for` 循环读入五个独立玩家的信息（每个玩家有两条数据），然后在另一个 `for` 循环中打印信息。我们不需要为每条单独的数据编写相关的数组，你确实不需要为\
  \ `player_names` 和 `player_skill_level` 准备的数组。\n\n### 传递结构体\n\n通常情况下，你会希望有一个函数能够将结构体作为其参数之一，或者返回一个结构体作为结果。例如，你有一个小游戏，里面有飞船在移动；你可以有一个函数来为一个全新的敌人初始化结构体：\n\
  \n```cpp\nstruct EnemySpaceShip \n{\nint x_coordinate;\nint y_coordinate;\nint weapon_power;\n\
  }; \n\nEnemySpaceShip getNewEnemy ();\n```\n\n在这个示例中，当调用 `getNewEnemy` 时，我们应该得到一个返回的值，其中结构体内部所有的值都已初始化。可以这样写：\n\
  \n```cpp\nEnemySpaceShip getNewEnemy ()\n{\nEnemySpaceShip ship;\nship.x_coordinate\
  \ = 0;\nship.y_coordinate = 0;\nship.weapon_power = 20;\nreturn ship;\n}\n```\n\n\
  该函数对返回的局部变量 `ship` 进行了复制。这意味着结构体中的每一个字段都逐个被复制到一个新变量中。你可能会认为，一个一个地复制字段会减慢速度，但在大多数情况下，你的计算机速度足够快，你不会察觉到。真正会有影响的地方是当你处理许多不同的结构体时——等我们在下一章讨论指针时，我们将讨论如何避免所有额外的拷贝。\n\
  \n接收返回的变量涉及如下这样的代码：\n\n```cpp\nEnemySpaceShip ship = getNewEnemy();\n```\n\n现在，`ship`\
  \ 变量可以像任何其他结构体变量一样使用了。\n\n要传递一个结构体，你可以这样做：\n\n```cpp\nEnemySpaceShip upgradeWeapons\
  \ (EnemySpaceShip ship)\n{\nship.weapon_power += 10;\nreturn ship;\n}\n```\n\n当你将一个结构体传递给函数时，它会被复制（与返回结构体时发生的情况相同），并且函数内部对结构体的任何修改都会丢失。这就是为什么我们需要函数在结构体被修改后返回该结构体的副本——这样一来，原始结构体就不会受到影响。\n\
  \n所以，如果我们想使用 `upgradeWeapons` 修改 `EnemySpaceShip`，我们可以这样做：\n\n```cpp\nship = upgradeWeapons(\
  \ ship );\n```\n\n当我们调用函数时，`ship` 变量被复制到函数的参数中。当函数返回时，返回的 `EnemySpaceShip` 变量会被复制回\
  \ `ship` 变量，这将覆盖原始字段。\n\n这是一个简单的程序，向了如何创建一个敌飞船并对其进行升级：\n\n```cpp\nstruct EnemySpaceShip\
  \ \n{\nint x_coordinate;\nint y_coordinate;\nint weapon_power;\n}; \n\nEnemySpaceShip\
  \ getNewEnemy ()\n{\nEnemySpaceShip ship;\nship.x_coordinate = 0;\nship.y_coordinate\
  \ = 0;\nship.weapon_power = 20;\nreturn ship;\n}\n\nEnemySpaceShip upgradeWeapons\
  \ (EnemySpaceShip ship)\n{\nship.weapon_power += 10;\nreturn ship;\n}\n\nint main\
  \ ()\n{\nEnemySpaceShip enemy = getNewEnemy();\nenemy = upgradeWeapons( enemy );\n\
  }\n```\n\n你可能会好奇如何创建一个无限的敌飞船供应，并在游戏过程中追踪每一个。要创建新的敌飞船，你需要调用 `getNewEnemy`；这很简单，但如何追踪所有它们呢？存储它们呢？目前，我们拥有的只是固定大小的数组，是的，你可以创建一个包含\
  \ `EnemySpaceShip` 类型对象的数组；类似于：\n\n```cpp\nEnemySpaceShip my_enemy_ships[ 10 ];\n\
  ```\n\n这所做的只是给你提供 10 个敌人，仅此而已。如果这不够呢？在下一节中，我们将讨论指针，这将是解决问题的开始，更多信息将在接下来的章节中给出。\n\
  \n### 测验 9\n\n以下哪一个用于访问结构体 `b` 中的变量？\n\nA. `b->var;`\nB. `b.var;`\nC. `b-var;`\n\
  D. `b>var;`\n\n以下哪一个是正确定义的结构体？\n\nA. `struct {a;}`\nB. `struct a_struct {a};`\n\
  C. `struct a_struct a;`\nD. `struct a_struct {a};`\n\n声明类型为 `foo`、名为 `my_foo` 的结构体的正确方式是？\n\
  \nA. `my_foo as struct;`\nB. `foo my_foo;`\nC. `my_foo;`\nD. `int my_foo;`\n\n以下代码输出的最终值是多少？\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\n\nStruct MyStruct \n{\nint\
  \ x;\n};\n\nvoid updateStruct (MyStruct my_struct)\n{\nmy_struct.x = 10;\n}\n\n\
  int main ()\n{\nMyStruct my_struct;\nmy_struct.x = 5;\nupdateStruct( my_struct );\n\
  cout << my_struct.x << '\\n';\n}\n```\n\nA. 5\nB. 10\nC. 无法编译\n\n## 指针简介\n\n到直为止，我们一直在处理固定数量的内存。这是在程序启动之前确定的数量。当声明一个变量时，底层会分配一定量的内存来存储变量中的信息。\n\
  \n到目前，我们通过数组来获取多个变量，从而为我们提供了大量的内存，但数组的元素数量需要在创建时指定——这再次限制了我们。\n\n为了访问几乎无限的内存，我们需要一种直接引用存储变量内存的变量类型。我们称这种类型为指针。\n\
  \n指针是指向内存中特定位置的变量。它就像指向 Web 服务器上特定网页的超链接。如果你想把那个页面发送给某人，你并不是复制整个页面并发送；你发送的是链接，这就是指针所做的——让你发送或存储变量、结构体或数组的链接，而不是复制它们。\n\
  \n\n\n\n可视化计算机系统所拥有内存的最简单方法之一将其想象成 Excel 电子表格。电子表格无非就是单元格的集合，每个单元格都可以存储数据。这就是计算机内存的全部——多个连续的数据单元格。然而，Excel\
  \ 电子表格单元格可以存储大量数据，而计算机内存“单元格”每个只能存储一个字节内存，每个字节提供 256 种可能的值。而且，Excel 以网格形式存储数据，而计算机内存则是线性方式存储的。如果有帮助的话，可以将你的计算机内存想象成一个长字符数组。\n\
  \n而且，如果你熟悉 Excel，你就会知道每个电子表格单元格可以通过列字母和行号来定位，而单元格的位置就是它的地址。该地址就是当内存位置被持有时指针所存储的值。在\
  \ Excel 中，指针是一个持有另一个单元格名称的单元格，例如，单元格 `B2` 存储了字符串。\n\n下面显示了内存块如何被可视化的图表，它非常像数组：\n\
  \n```\n0 4 8 12 16\n?? ?? ??\n```\n\n每个数字代表内存中的一个位置，你可以在其中存储数据。这些是内存地址，这些是如何识别位置的。我们使用指针是因为存储在内存中的大多数变量都会占用\
  \ 4 字节——你看到的是与变量相关的内存。作为一个例子，地址 `4` 存储内存中的一个字节，指针存储一个值 `16`，可能是内存中的另一个位置。内存中的地址\
  \ `4` 属于指针的一个变量，它们告诉你，在初始化之前，它们仍然持有某些东西，因为这非常有用。\n\n## 变量 VS 地址\n\n变量和地址之间是否有区别？变量表示存储在内存特定位置的值。在程序实现这些时，编译器将使用内存地址。指针是一种特殊的变量类型，你可以用它指向另一个变量。\n\
  \n指针很酷的地方在于，一旦你可以使用地址，你就可以访问并获取存储在其中的数据。当你需要将一个非常大的数据结构传递给函数时，传递地址比拷贝所有数据更有效。这种方法可以用于你想将结构传递到函数时。\n\
  \n任何指针的单一重要功能是让你在需要时拥有更多内存。当你需要更多内存时，向操作系统请求它。但你如何获取它？操作系统本身会告诉你内存地址是什么，并将该地址存储在指针中。结果是指针允许我们在运行时忘记内存的限制。\n\
  \n## 术语\n\n当我们使用“指针”一词时，指的是以下两种情况之一：\n\n1. 内存地址\n2. 存储内存地址的变量\n\n通常情况下，两者之间的区别并不重要。如果将指针变量传递到函数中，你传递的是内存地址或指针存储的值。\n\
  \n为了清晰起见，从现在开始，如果我在谈论内存地址，我会称它们为地址；但如果我谈论存储内存地址的变量，我会称它们为**指针**。例如，如果我们有一个存储另一个变量地址的变量，我会告诉你该变量指向另一个变量。\n\
  \n## 内存布局\n\n那么内存来自哪里？为什么我们需要向操作系统请求它？回到 Excel 电子表格，你拥有的是一大组单元格，每个单元格都可以被访问。对于计算机内存，也有大量内存，但它是高度结构化的部分内存已经被其他事物在使用。\n\
  \n用于存储运行函数中声明的变量的内存被称为 `stack`（栈）。这个名字源于如果进行了多次函数调用，每个函数的局部变量会在该内存区域相互堆叠。到目前，我们处理过的每个变量都存储在\
  \ `stack` 上。\n\n内存的另一部分被称为 `free store`（空存储区）或更常见的 `heap`（堆）。这是存储未分配内存的地方，允许你以块的形式请求它。它由操作系统管理，当某部分内存被分配后，它应该只由最初分配该内存的代码或内存分配器提供地址的代码使用。\n\
  \n访问这种内存是一项强大的功能，但带来了巨大的责任。内存不是丰富的资源，虽然不像以前那样难以获得，但它不是无限的。从 `heap` 分配的每块内存在程序不再需要它时最终必须返回\
  \ `heap`。负责释放特定部分内存的代码被称为内存的所有者，而当所有者不再需要该内存时（例如在太空游戏中一艘敌机被摧毁时），该内存块应返回 `heap`，以便其他代码使用。如果内存不返回，你的程序将耗尽内存，最好的情况下它会变慢，最坏的情况下，你的程序将会崩溃。\n\
  \n你可能听过人们说浏览器使用了过多的内存；你可能也经历过。它之所以这样做是因为内存在应该释放时没有释放，这导致了内存泄漏。\n\n内存所有权背后的概念并不是\
  \ `C++` 语言的显式部分；它更多是关于用户与函数之间的接口。当编写一个接收 `pointer` 的函数时，由你（程序员）来明确指示函数是否将承担内存的所有权。语言不会负责跟踪这一点，语言也不会在程序运行时释放由你显式分配的内存，除非你显式请求它这样做。\n\
  \n之所以你不能随心所欲地抓取内存是有理由的。特定的代码应该使用特定的内存；假设我们生成了一个随机数，并将该数字视为内存地址。在技术上这是可行的，但这不是一个好主意。\n\
  \n\n\n等等，我刚才是说崩溃是件好事吗？在某些情况下，是的的。当崩溃是因为无效内存而发生时，与由于将错误数据写入有效内存而导致的 bug 相比，这种崩溃非常容易诊断。通常情况下，你会很快就发现这些崩溃，因为问题会立即发生。如果你修改了不属于你的有效内存，那么在拥有该内存所有权的代码尝试使用它之前，这个\
  \ bug 不会发生。\n\n这可能会在之后的某个时间发生，也就是在内存被写入很长时间之后。而试图找到从哪里开始出的问题？祝你好运运吧！尽管如此，我们稍后将讨论如何使用\
  \ `Code::Blocks` 进行调试，其中一部分将是关于调试由错误内存导致的崩溃的。\n\n### 无效指针\n有一种方法会意外地使用有效内存，那就是在不初始化指针的情况下使用它们。当一个指针被声明时，它最初实际上会包含一些随机数据。它指向内存中的某一个位置，该位置可能是有效的，也可能是无效的。无论如何，使用它都是危险的，几乎就像生成了一个随机数。如果你使用该值，可能会发生两种情况之一——你的数据将被损坏，或者你的程序将崩溃。始终、始终记住，指针在使用之前必须进行初始化！\n\
  \n### 内存与数组\n还记得我之前对你说过的你不应该写入数组末尾之外吗？我们现在对内存有了更多了解，所以你应该能看出为什么这会导致问题。数组与它们关联有固定数量的内存，这是基于数组的大小。如果你尝试访问数组边界之外的元素，你正在尝试访问与数组完全无关的内存。它不是数组，但它是什么完全完全取决于代码以及编译器的实现方式。这并不重要；重要的是它**不是**数组的一部分，如果你尝试使用它，一定会有问题。\n\
  \n### 优点与缺点\n你现在对指针的原理有了一个相当清楚的认识，稍后，我们将查看如何使用它们。现在，我们将概述一下使用指针带来的权衡，由于超链接和指针都具有相同的优缺点，这会有所帮助：\n\
  \n*   **无需制作副本**：就像网页一样，如果内存中持有的数据太大且复杂，那么正确地复制它可能会非常困难——这一点稍后会讨论——而且复制大量数据也是一个缓慢的过程。有了指针，就不需要这样做。\n\
  *   **始终可用最新值**：当网页更新时，你将始终获得最新的副本。指向内存的指针也是如此；如果内存地址处存储的值被更新，指针始终拥有正确的值。\n\n有一个主要的缺点：\n\
  \n*   **内存可能已经被返回**：有时，网页会被删除或移动，你找不到它了。对于指针，你可能会发现内存已经返回给操作系统，但指针还没有被移除。避免这种情况的唯一方法是拥有内存所有权的代码跟踪该内存是否正在被其他人使用。\n\
  \n我不想让你负担过重，所以为了保持简单，只需记住指针是一种特殊的变量即可。在下一节中，我们将讨论使用这些变量，但现在，请直接进入测验，看看你对指针总体学了多少。\n\
  \n### 测验 10\n以下哪项不是使用指针的良好理由？\nA. 你希望函数能够修改传递给它的参数\nB. 你不想复制大型变量并想节省一些空间\nC. 你想要访问更多的操作系统内存\n\
  D. 你想要更快速地访问变量\n\n指针用于存储什么？\nA. 另一个变量的名字\nB. 一个整数值\nC. 内存中另一个变量的地址\nD. 一个内存地址，但它可能不是另一个变量\n\
  \n当你的程序执行时，你会从哪里获取更多内存？\nA. 你无法获取更多内存\nB. 栈 (stack)\nC. 自由存储 (free store)\nD. 通过声明另一个变量\n\
  \n当你使用指针时可能会出现什么问题？\nA. 你可能会访问无法使用的内存，这将导致你的程序崩溃\nB. 你可能会访问错误的内存地址，这将损坏数据\nC. 你可能会忘记内存必须返回给操作系统，程序将耗尽内存\n\
  D. 以上所有\n\n当你在函数中声明一个普通变量时，内存来自哪里？\nA. 自由存储 (free store)\nB. 栈 (stack)\nC. 普通变量不使用内存\n\
  D. 程序自身的二进制文件\n\n一旦内存被分配，你对它做什么？\nA. 什么都不做，你可以永远保留它\nB. 当你完成使用它时，将其返回给操作系统\nC. 你看到被指向的值为\
  \ 0\nD. 值 0 存储在指针中\n\n### 掌握指针\n我们现在知道内存是什么了，你也知道应该如何思考或视觉化它。现在是时候查看编写可以利用内存的代码了。我们将首先查看处理指针所需的语法，然后移动到通过真实代码展示它们如何工作的示例。稍后在下一节中，我们将查看从堆\
  \ (heap) 访问内存。\n\n首先，我们看语法\n\n### 声明指针\nC++ 提供了我们用于声明指针的特定语法，这不仅指示了指针，还指示了它指向的类型。指针声明如下所示：\n\
  \n```cpp\ntype *name;\n```\n\n所以，例如，你可能声明一个存储整数的指针，语法如下：\n\n```cpp\nint *ptr;\n\
  ```\n\n注意我们在语法中使用 `*`。那个符号是关键。将其放在名称之前，你就指示变量是一个指针。C++ 语言并不强制要求 `p_` 前缀，但有助于让你和其他人明确。然而，如果你在同一行中声明多个指针，每个变量名都必须以前缀\
  \ `*`：\n\n```cpp\n// 一个指针，普通 int\nint *pointer1, nonpointer1;\n\n// 两个指针\nint *pointer1,\
  \ *pointer2;\n```\n\n所以，为什么没有更简单的方法这样做呢？为什么我们不能这样写？\n\n```cpp\npointer pointer\n\
  ```\n理由是为了使用内存地址，编译器必须知道存储的数据类型。如果不知道，它就无法正确解释。一个例子是，内存中的相同字节对于 int 和 double 的含义不同。与其为不同类型的指针定义单独的名字（例如\
  \ `char_ptr`、`int_ptr` 等），我们只需使用 `*` 符号结合类型来获取指针。\n\n### 获取变量地址\n我们可以利用指针持有新内存，但首先，我们将查看指针如何与已存在的变量工作。要检索变量的地址，必须将符号\
  \ `&` 放在变量名称之前。`&` 符号是地址运算符，用于返回变量的内存地址：\n\n```cpp\nint x;\nint p_x = &x;\n*p_x\
  \ = 2; // 初始化 x 为 2\n```\n\n记住使用 `&` 符号获取变量地址的最简单方法之一是：——该符号的名字（ampersand）和地址运算符（address-of）都以字母\
  \ 'a' 开头——就是如此！\n\n实际上，你需要不同的操作来获取变量在内存中的位置是合理的，因为归根结底你大部分想从变量中得到的都是它的值。\n\n\n\n\
  当你使用指针时，需要更多特殊的语法。为什么呢？因为涉及到指针时，你需要能够完成两件不同的事情：\n\n1. 请求指针所存储的内存地址，以及\n2. 请求存储在该内存地址上的值。\n\
  \n当指针被像普通变量一样使用时，你获得的内存地址就是指针所存储的那个地址。\n\n在下面的代码段中，我们正在打印 `p_pointer_to_integer`\
  \ 指向的（存储在）地址：\n\n```cpp\nint x = 5;\nint *p_pointer_to_integer = &x;\ncout << p_pointer_to_integer;\
  \ // 输出 x 的地址\n// 等同于 cout << &x;\n```\n\n所以，我们正在打印变量 `x` 存储（内存中的）地址。如果你想访问内存中该位置的值，就需要使用\
  \ `*` 符号。在下一个示例中，你可以看到指向不同变量的指针初始化：\n\n```cpp\nint x = 5;\nint *p_pointer_to_integer\
  \ = &x;\ncout << *p_pointer_to_integer; // 输出 5\n// 等同于 cout << x;\n```\n\n代码行 `*p_pointer_to_integer`\
  \ 表示我们应该跟随该指针并检索它指向的值。在上面的代码情况下，因为 `p_pointer_to_integer` 指向 `x`，其值为 `5`，我们输出 `5`。\n\
  \n有一种简单的方法可以记住 `*` 符号用于检索指向的值——指针变量与普通变量非常相似；变量持有的值是内存地址，如果你想对该内存地址进行任何操作，就需要特殊的语法。\n\
  \n当我们使用 `*` 符号来获取指向地址的值时，被称为“解引用（dereferencing）指针”。这个名称源于：当你获取值时，你是在跟随一个内存地址。解引用允许将值设置到内存地址：\n\
  \n```cpp\nint x;\nint *p_pointer_to_integer = &x;\n*p_pointer_to_integer = 5; //\
  \ x 现在是 5!\ncout << x;\n```\n\n并不总是容易记住在 `*` 时需要添加 `&` 作为引用：\n\n| 操作 | 需要的符号 | 示例\
  \ |\n| :--- | :--- | :--- |\n| 声明指针 | `*` | `int *p_x;` |\n| 获取指针持有的地址 | 无 | `cout\
  \ << p_x;` |\n| 设置指针中存储的地址 | 无 | `int *p_x; p_x = &x;` |\n| 获取该地址的值 | `*` | `cout\
  \ << *p_x;` |\n| 给该地址设置新值 | `*` | `*p_x = 5;` |\n| 声明变量 | 无 | `int y;` |\n| 获取变量中存储的值\
  \ | 无 | `int y; cout << y;` |\n| 设置变量中存储的值 | 无 | `int y; y = 5;` |\n| 获取变量的地址 |\
  \ `&` | `int y; int *p_x; p_x = &y;` |\n| 设置变量的地址 | | 变量不能改变地址 |\n\n有两个你应该学习的简单规则：\n\
  \n1. 指针存储地址；当使用裸指针时，你会得到地址。如果你想检索或修改存储在该地址的值，需要其他符号，比如星号。\n2. 变量存储值；当使用变量时，你会得到它的值。如果你想要变量地址，需要使用取地址符。\n\
  \n看一个展示这些特性的程序，分析内存中到底发生了什么：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
  \nint main ()\n{ \n    int x;           // 标准整数\n    int *p_int;      // 指向整数的指针\n\
  \    p_int = & x;     // 将 x 的地址赋值给 p_int\n    cout << \"Please input a number:\
  \ \";\n    cin >> x;        // 在 x 中存储一个值，这里也可以使用 p_int\n    cout << *p_int << '\\\
  n'; // 注意我们使用 * 来检索值\n    *p_int = 10;\n    cout << x;       // 再次输出 10!\n}\n```\n\
  \n所以，第一个 `cout` 输出 `x` 中的值。为什么？为了回答这个问题，我们将观察程序是如何工作的以及它对内存的影响。\n\n我们从一个名为 `x` 的整数和一个指向\
  \ `p_int` 的指针开始。从可视化的角度来看，我们有一对并排的变量，其值我们还不知道：`x`, `p_int`。\n\n接下来，`x` 的内存位置存储在指针\
  \ `p_int` 中，这是通过 `&` 运算符实现的：`p_int = & x; // 将 x 的地址赋值给 p_int`。现在，视觉上你可以在 `p_int`\
  \ 变量和 `x` 变量之间画一条线；这将表示 `p_int` 指向 `x`。`x`, `p_int`。\n\n接下来，用户将输入一个数字，该数字将存储在 `x`\
  \ 变量中——`p_int` 指向的相同位置：`cin >> x; // 在 x 中存储一个值，我们也可以在这里使用 p_int。\n\n假设用户输入了五。视觉上，你会得到：`5`,\
  \ `x`, `p_int`。接下来的代码行将 `p_int` 传递给 `cout`。`*p_int` 是解引用 `p_int`；它会查看 `p_int` 以存储的地址，转到该地址并返回其中的值：`cout\
  \ << *p_int << '\\n'; // 注意我们使用 * 来获取值。最后几行代码演示了，当你修改指针时，原始变量也会被修改。下面的代码行在 `p_int`\
  \ 指向的内存中存储了一个 `10` 的值；这也是存储 `x` 值的内存：`*p_int = 10;`。内存状态现在将是：`10`, `x`, `p_int`。\n\
  \n希望你能够跟上这些内容并且现在知道处理指针时会发生什么。如果你感到有些困惑，可以画出初始内存状态，然后逐行通过代码，查看内存状态是如何改变的。当指针改变它指向的位置时，会产生新的线。当变量修改其值时，必须更新。\n\
  \n\n\n\n```cpp\ncout << x << \" \" << y << '\\n';\n\nswap2( & x, & y );\n\ncout\
  \ << x << \" \" << y << '\\n';\n\n}\n```\n\n仔细看看这段代码；你认为哪个函数能正确交换这两个变量？\n\n这并不是指针带来的主要价值；C++\
  \ 中还有另一个特征可以使编写函数变得简单，而不需要使用指针的全部威力，那个特征就叫做引用（references）。\n\n### 引用\n\n偶尔，你可能需要指针的一些功能，例如，不想为大型数据块创建额外的副本，但同时，你又想要指针提供的所有功能。为此，你可以使用引用。\n\
  \n引用是用于引用其他变量的变量，它们共享同一块底层内存。将引用想象成一个被精简过的指针，不需要在被引用的值或在引用赋值时使用 `*` 符号或 `&` 符号。与指针不同，引用必须指向有效的内存，我们使用\
  \ `&` 语法来声明它们：\n\n```cpp\nint &ref;\n```\n\n然而，那是非法的声明。为什么？因为引用必须始终初始化，也就是说，它必须引用一个有效的地址：\n\
  \n```cpp\nint x = 5;\n\nint &ref = x; // 注意在 x 之前不需要 ampersand (`&`)！\n```\n\n引用的可视化方式与指针非常相似，唯一的区别在于——当使用引用时，返回的是被引用的内存值，而不是该内存对应的地址：\n\
  \n```cpp\nint x = 5;\n\nint &ref = x;\n```\n\n我们在这里得到的是，实际的引用变量内存存储着指向 `x` 变量内存的指针。当编写普通引用时，编译器知道你想要被指向的值。在某种意义上，你可以认为引用是一个其默认行为与写变量变量名时发生的情况相反的指针。\n\
  \n我们还可以使用引用将结构体传递给函数，而不需要传递整个结构体，也不需要担心 `NULL` 指针：\n\n```cpp\nstruct myBigStruct\
  \ \n{\nint x[ 100 ]; // 占用内存大量的结构体！\n};\n\nvoid takeStruct (myBigStruct& my_struct)\n\
  {\nmy_struct.x[ 0 ] = \"foo\";\n}\n```\n\n由于引用始终指向原始对象，因此你不需要复制，并且传入的原始对象可以被修改。在上面的示例中，你看到了\
  \ `my_struct.x[ 0 ]` 是如何设置的，使得当函数返回时，传入的原始结构体中包含了‘foo’。\n\n好了，我们看到了使用指针编写交换函数的方法，现在让我们看看使用引用会变得多么简单得多：\n\
  \n```cpp\nvoid swap (int& left, int& right)\n{\nint temp = right;\nright = left;\n\
  left = temp;\n}\n```\n\n这是一种简单得多的方法。引用实际上无非是原始变量的占位符。当编译器实现引用时，它是使用指针来存储引用的——所有的解引用操作都由你完成。\n\
  \n### 引用 VS 指针\n\n当一个变量需要被多个名称引用时，可以使用引用代替指针，例如，当你想要将参数传递给函数而不必复制它们，或者当你想要以调用者可见的方式修改函数的参数时。\n\
  \n引用并不像指针那样灵活，简单仅仅因为它们始终必须是有效的。你不能指示一个 `NULL`，并且无法使用引用来表示你没有有效的东西。引用的设计并不是为此，而且由于它们不能表示\
  \ `NULL`，因此没有办法使用引用来构建复杂的数据结构。我们将在接下来的章节中更多地讨论数据结构——当我们讨论时，对每个示例问自己是否可以使用引用完成同样。\n\
  \n两者之间的另一个区别是，一旦你初始化了引用，它所引用的内存就不能更改。引用将始终引用同一个变量，这使得它们在处理复杂数据结构时显得有些不灵活。\n\n在指南的其余部分中，引用将只在适当的地方使用，那通常是当结构体或类实例作为函数参数传递时。该模式几乎总是像这样的：\n\
  \n```cpp\nvoid (myStructType& arg);\n```\n\n现在，休息一下，做一下测验，然后我们将继续并讨论动态内存分配。\n\n\
  ### 测验 11\n\n以下哪项是指针的正确声明？\n\nA. `int x;`\n\nB. `int &x;`\n\nC. `ptr x;`\n\nD. `int\
  \ *x;`\n\n以下哪一个将给出整数变量 `a` 的内存地址？\n\nA. `*a;`\nB. `a;`\nC. `&a;`\nD. `address( a\
  \ );`\n\n以下哪项给出了指针 `p_a` 指向的变量的内存地址？\n\nA. `p_a;`\nB. `*p_a;`\nC. `&p_a;`\nD. `address(\
  \ p_a );`\n\n以下哪项将给出指针 `p_a` 指向地址处存储的值？\n\nA. `p_a;`\nB. `val( p_a );`\nC. `*p_a;`\n\
  D. `&p_a;`\n\n以下哪项是声明引用的正确方法？\n\nA. `int *p_int;`\nB. `int &my_ref;`\nC. `int &my_ref\
  \ = & my_orig_val;`\nD. `int &my_ref = my_orig_val;`\n\n以下哪项不是使用引用的好时机？\n\nA. 用于存储已分配的堆地址\n\
  B. 这样在传递它时不需要复制大型变量\nC. 让函数可以访问原始变量而不需要使用指针\nD. 让函数可以被传递给 `NULL`\n\n### 动态内存分配\n\
  \n如果你完好无损地读完了最后几节并理解了所有内容，做得好。如果没有，请回去复习你不理解的内容，然后再进入这一节。\n\n现在我们到了指针最棒的部分——将它们作为解决现实世界问题的方法。现在我们学习如何获取几乎无限的内存，我们通过使用动态分配来实现这一点。\n\
  \n这意味着我们可以在程序运行时请求我们需要的内存，无论多少，而不是与固定数量的变量工作。我们将讨论分配内存，在未来的章节中，我们将涵盖如何充分利用。\n\n\
  首先，我们需要知道如何获取更多内存。我们使用关键字 `new` 来初始化指针的内存。记住；堆是可以请求访问的空闲内存存储，其基本语法是：\n\n```cpp\n\
  int *p_int = new int;\n```\n\n`new` 操作符做的是获取请求内存的大小；在我们的案例中，它获取了一个整数并返回了足够容纳整数类型的内存。\n\
  \n我们让 `p_int` 指向该内存，`p_int` 关联的代码将拥有该内存的所有权。在某个时刻，p-int 需要将内存返回给堆，这个过程被称为“释放内存”。在释放之前，该内存被标记为正在使用，不会被分配到其他地方。如果你继续分配内存而不释放，内存将会耗尽。\n\
  \n将内存返回堆非常简单，只需使用 `delete` 关键字。这释放了使用 `new` 关键字分配的任何内存。这就是释放 `p_int` 的：\n\n```cpp\n\
  delete p_int;\n```\n\n在指针被删除后，你应该将它设置为 `NULL`：\n\n```cpp\ndelete p_int;\np_int =\
  \ NULL;\n```\n\n\n\n\n\n通常情况下，你不应该将分配的内存存储在引用中：\n\n```cpp\nint &val = *(new int);\
  \ \n```\n\n为什么呢？因为引用并不能让你直接访问原始内存地址。虽然你可以通过使用 `&` 语法获取它们，但引用实际上应该提供一个额外的变量名，而不是存储动态分配的内存。\n\
  \n## 指针与数组\n\n那么，如果我们唯一能做的用 `new` 初始化指针，我们该如何使用 `new` 来获取更多内存呢？嗯，指针也可以指向一个值序列，这意味着我们不能像创建数组那样创建它。毕竟，数组是内存中一系列连续的值。由于内存地址是由指针存储的，因此数组中第一个元素的地址也可以被存储。访问每个元素是通过获取一个距离数组开头特定距离的值来实现的。\n\
  \n这非常有用，因为这意味着你可以从堆上动态创建数组，这允许你能够在运行时计算需要多少内存。\n\n首先，数组可以赋值给指针，而不需要使用取地址运算符：\n\n\
  ```cpp\nint numbers[ 8 ];\nint* p_numbers = numbers;\n```\n\n现在 `p_numbers` 可以像数组一样使用：\n\
  \n```cpp\nfor ( int i = 0; i < 8; ++i )\n{\n    p_numbers[ i ] = i;\n}\n```\n\n\
  当你将 `numbers` 数组赋值给指针时，它的表现就像一个指针一样。数组**不是**指针，但它可以被赋值给指针。编译器知道如何将数组转换为指向数组第一个元素的指针。我们可以使用\
  \ `new` 动态分配一个内存数组，并将一个指针指向该内存：\n\n```cpp\nint *p_numbers = new int[ 8 ];\n```\n\
  \n数组语法被用参数，这让编译器知道需要多少内存；在这里，我们需要足够容纳整型数组或 8 个元素的空间。现在 `p_numbers` 可以像指向一个数组一样被使用。然而，与数组不同，`p_numbers`\
  \ 指向的内存必须被释放，而你不想释放指向静态声明数组的指针。释放内存需要使用 `delete` 运算符的特殊语法：\n\n```cpp\ndelete[] p_numbers;\n\
  ```\n\n方括号让编译器知道指针指向的是一个值数组而不仅仅是一个值。\n\n现在，下面的示例将向你展示如何动态确定所需的内存量：\n\n```cpp\nint\
  \ count_of_numbers;\ncin >> count_of_numbers;\nint *p_numbers = new int[ count_of_numbers\
  \ ];\n```\n\n这段代码的作用是询问用户需要多少个数字，然后使用结果变量来计算动态分配数组的大小。我们不需要预先知道这个数字，每当数量增加时都可以重新分配内存。\n\
  \n让我们来看一个展示这一操作的程序；该程序将读取用户输入的数字，如果输入的数字过多，我们就调整数组的大小：\n\n```cpp\n#include <iostream>\n\
  \nusing namespace std;\n\nint *growArray (int* p_values, int cur_size);\n\nint main\
  \ ()\n{\n    int next_element = 0;\n    int size = 10;\n    int *p_values = new\
  \ int[ size ];\n    int val;\n    cout << \"Please input a number: \";\n    cin\
  \ >> val;\n    while ( val > 0 )\n    {\n        if ( size == next_element + 1 )\n\
  \        {\n            // 现在我们实现 growArray\n            p_values = growArray( p_values,\
  \ size );\n        }\n        p_values[ next_element ] = val;\n        cout << \"\
  Please input a number (or 0 to exit): \";\n        cin >> val;\n    }\n}\n```\n\n\
  让我们考虑一下如何扩展数组。我们无法扩展已经拥有的内存，所以我们需要请求更多内存并将旧值拷贝过去。\n\n我们需要多少内存？如果一次只扩展一个整数的数组，效率将是极的！会有很多不必要的重新分配，虽然你不会耗尽内存，但它会让程序运行变慢。最好的方法是取当前的数组大小并将其翻倍。这样，如果没有读入新值，我们就不会浪费太多空间，而且也不会一直重新分配内存。因此，我们需要当前数组的大小和原始数组以供拷贝：\n\
  \n```cpp\nint *growArray (int* p_values, int cur_size)\n{\n    int *p_new_values\
  \ = new int[ cur_size * 2 ];\n    for ( int i = 0; i < cur_size; ++i )\n    {\n\
  \        p_new_values[ i ] = p_values[ i ];\n    }\n    delete p_values;\n    return\
  \ p_new_values;\n}\n```\n\n注意，一旦数据从数组拷贝出来，`p_values` 就会被删除；如果不这样做，将会内存泄漏，因为当从 `growArray`\
  \ 返回时，我们已经覆盖了存储数组的指针。\n\n## 多维数组\n\n能够调整一个大数组的大小很有用，但如果你有多个需要处理的数组呢？我们之前提到过多维数组，但如果我们可以选择想要的尺寸，那不是很好吗？我们可以做到，而且这是一个非常好的练习，可以帮助你更好地理解指针，同时也是一项极其用的操作。然而，这需要更多的背景知识才能正确掌握，因此在接下来的几个章节中，我们将介绍这些背景，然后展示如何动态分配多维数据结构。\n\
  \n## 指针算术\n\n深呼吸。让我们从内存地址开始。指针代表内存地址，内存地址无非是一个数字。这意味着我们可以进行算术运算——我们可以从一个指针减去另一个指针。等等，这不对。我们可以给指针加或减一个数字。你已经在数组中遇到过这个了。\n\
  \n所以，当你写道：\n\n```cpp\nint x[ 10 ];\nx[ 3 ] = 120;\n```\n\n括号的作用只是让它变得更简单，你可以做完全相同的事情，比如：\n\
  \n```cpp\n*( x + 3 ) = 120;\n```\n\n这里发生了什么？并不是你想象的那样——`3` **并没有**被加到 `x` 的值上；相反的是加上了\
  \ `3 * sizeof(int)`。`sizeof` 是 C++ 中的特殊关键字之一，提供变量的字节大小。处理内存时，你将经常需要这种操作。\n\n当你进行指针算术运算时，并不总是容易保持逻辑清晰，而且非常容易忘记增加的是内存槽而不是单个字节。然而，掌握这种算术将对你以后处理更复杂的内容（如我们之后将做的）大有益处，并让你很好理解多维数组是如何动态分配的。\n\
  \n## 二维数组\n\n在讨论多维数组的动态分配之前，你需要理解多维数组的真正含义。再次，请在此密切注意，因为从长期来看是值得的。\n\n我们将从一个奇怪的情况开始。当声明一个接收二维数组作为参数的函数时，必须提供数组第二部分的大小。\n\
  \n你可以像这样这样做，提供两个数组的大小：\n\n```cpp\nint sumTwoDArray( int array[ 4 ][ 4 ] );\n```\n\
  \n或者像这样，只提供一个大小：\n\n```cpp\nint sumTwoDArray( int array[][ 4 ] );\n```\n\n但你不能两个都不提供：\n\
  \n```cpp\nint sumTwoDArray( int array[][] );\n```\n\n并且不能只提供第一个大小：\n\n```cpp\nint\
  \ sumTwoDArray( int array[ 4 ][]);\n```\n\n\n\n\n\n我们只需要特定的尺寸来执行指针算术。二维数组在内存中是平铺存储的——编译器允许程序员将其视为一个正方形内存块，但实际上，它仅仅是一个线性地址集合。编译器通过获取数组访问（例如\
  \ `array[3][2]`）并将其转换为内存中的一个位置来实现此点。\n\n一种简单的思考方式是这样的；将此视为数组的可视化：\n\n```\n[][][][]\n\
  [][][][]\n[][][][]\n[][][][]\n```\n\n但在内存中，它的布局方式如下：\n\n```\n[][][][][][][][][][][][][][][][][]\n\
  ```\n\n要使用该数组 `[3][2]`，编译器需要访问向下三行且向右两列的内存。因为每行的宽度是四个整数，向下三行意味着移动了 `4 * 3` 个槽位，然后再增加两个槽位。所以简单来说，`[3][2]`\
  \ 数组将转换为以下指针算术：\n\n`(array + 3 * <width of array> + 2)`\n\n需要数组宽度是因为如果没有它，数学计算就无法进行。而这个宽度是任何二维数组的第二个维度。高度无法进行相同的操作，因为数据在内存中的物理布局方式如此。由于这些原因，数组可以作为函数参数传递，其高度可以是变量，但第二个维度**始终**必须完全指定。对于任何多维数组，除了高度外，所有维度的尺寸都必须指定。如果有帮助的话，可以将一维数组视为一个只有高度的特殊数组。\n\
  \n当你声明一个二维数组时，由于你需要硬编码的宽度，因此你需要 C++ 的另一个功能来进行动态分配。该功能被称为“指针的指针”。\n\n### 指针的指针\n\n\
  指针也可以指向另一个指针，而不仅仅指向普通数据。毕竟，像任何变量一样，指针包含一个可以访问的地址。声明一个指向指针的指针如下：\n\n```cpp\nint **p_p_x;\n\
  ```\n\n因此，`p_p_x` 指向内存中的一个地址，该地址有一个指向整数的指针。我们使用 `p_p` 前缀只是为了表示这是一个指针的指针，这意味着你需要给它一个指针的内存地址：\n\
  \n```cpp\nint *p_y;\nint **p_p_x;\np_p_x = & p_y;\n```\n\n然后我们使用 `p_p_x` 为 `p_y`\
  \ 分配一个指针：\n\n```cpp\n*p_p_x = new int;\n```\n\n指针的指针可以用于创建二维数组，这就像单指针可以用于创建任意的一维数组一样。\n\
  \n最好的思考方式是这样的——你有一个一维指针数组；数组中的每个指针都指向另一个一维数组。第一个指针指向一个指针集合，而集合中的每个指针都指向我们之前那个井字棋盘的某一行。要分配这样的数据结构，我们需要这样操作：\n\
  \n```cpp\nint **p_p_tictactoe;\n// 注意我们使用了 int*，因为分配的是一个指针数组\np_p_tictactoe = new\
  \ int*[ 3 ];\n// 每个指针都需要存储一个整数数组的地址\nfor ( int i = 0; i < 3; i++ )\n{\n    p_p_tictactoe[\
  \ i ] = new int[ 3 ];\n}\n```\n\n现在，分配的内存可以像二维数组一样使用。例如，可以使用两个 `for` 循环来初始化整个井字棋盘：\n\
  \n```cpp\nfor ( int i = 0; i < 3; i++ )\n{\n    for ( int j = 0; j < 3; j++ )\n\
  \    {\n        p_p_tictactoe[ i ][ j ] = 0;\n    }\n}\n```\n\n释放内存需要我们按照初始化数组的反方向进行。首先释放每一行，然后释放持有该行的指针。\n\
  \n```cpp\nfor ( int i = 0; i < 3; i++ )\n{\n    delete [] p_p_tictactoe[ i ];\n\
  }\ndelete [] p_p_tictactoe;\n```\n\n通常情况下，当所需的内存大小已知时，这不是你会使用的方法。在这种情况下，例如创建井字棋盘，你只需要这样做：\n\
  \n```cpp\nint tic_tac_toe_board[ 3][ 3 ];\n```\n\n反之，如果你想创建一个大型游戏面板，你就需要使用那种方法。\n\
  \n### 二维数组与指针的指针\n\n请注意，当使用指针的指针来持有二维数组时，它在内存中的布局方式与二维数组不同。后者是连续内存，而指针的指针方法并非如此。每一行都是一组数据，每一行可能存储在与所有其他内存都有一定距离的地方，而不是连续存储。\n\
  \n这对于接收数组作为参数的函数会产生影响。你已经知道数组可以赋值给指针：\n\n```cpp\nint x[ 8 ];\nint *y = x;\n```\n\
  \n你不能做的是将二维数组赋值给指针的指针，如下所示：\n\n```cpp\nint x[ 8 ][ 8 ];\nint **y = x; // 这将无法编译\n\
  ```\n\n在第一种情况下，我们可以将其视为指针。在第二种情况下，你不能将二维数组赋值给指针的指针。\n\n\n\n\n你现在应该知道如何利用分配至关内存内存来动态分配数组了。现在，我们将介绍更多使用动态内存分配的方法。拥有这么多内存的唯一好处是，它为你提供了更多空间来存储数据。但这引出了另一个问题——如何以快速且便于以后访问的方式存储数据？这正是我们在这里要涵盖的内容。首先，数据结构是存储在内存中的数据的一种组织方法。例如，数组就是一种数据结构。它是一种简单的结构，线性地存储数据，数组中的每一项都是数据结构中的一个元素。使用指针的指针实现的二维数组也是数据结构，尽管它们更复杂。\n\
  \n数组的问题在于，你无法向一个没有空槽的数组添加元素。正如你之前看到的，你必须从头开始：创建一个新数组，然后将现有数组中的项复制到新数组中。这被称为“昂贵”的操作，意味着对于你的计算机处理器而言，它花费了太长的时间。对于你的用户来说，这类操作可能没什么什么，尤其是当你不进行很多操作时——毕竟，如今大多数计算机处理器都很快。但在某些情况下，昂贵的操作是一个问题。\n\
  \n第二个问题是，你无法在现有元素之间轻松地插入数据。假设你想在元素一和元素二之间添加一个新元素。你的数组中有 1000 个项，这意味着你必须移动从元素 2 直到\
  \ 1000 的每一个元素。那是极其昂贵的。数据结构的核心在于高效的数据存储，保持事物以合理的速度运行，而不是让你的用户久等。\n\n使用不同结构的另一个原因是，它们让你开始从更高的层次思考编程。你将不再考虑循环，而是开始考虑列表。数据结构为你提供了一种逻辑且高效的数据存储方式，以及一种简捷的通信方法。例如，如果你需要一个列表，你需要明确你拥有希望以一种可以高效添加和删除的方式存储的数据。当你熟悉了数据结构后，你将开始从数据以及它需要如何组织来来看你的程序。\n\
  \n关于这些就足够了；让我们思考链表。\n\n记得在使用数组时，你需要将现有元素复制到新数组中吗？如果你有一种数据结构，其中每个数据项都告诉你下一个项在哪里，那该有多酷？那样，只需通过让最后一项指向新项，就可以在末尾轻松添加元素。通过更改一个元素指向的位置，在两个元素之间插入元素也会变得更容易。\n\
  \n让我们使用我们的太空游戏示例。你可能想要一个所有太空敌人的列表，其中每个元素都是它自己的结构，存储了关于每个敌人的所有信息。但你也希望能够快速地添加和删除它们。如果这些敌人中的每一个也包含了关于下一个人的的信息呢？\n\
  \n我们可以从视觉角度来看这一点，每个元素都有 x 和 y 坐标以及一个具有特定威力的武器：\n\n`x_coordinate`\n`y_coordinate`\n\
  `weapon_power`\n`p_next_enemy`\n\n我们有一个名为 `EnemySpaceShip` 的结构，它通过指针链接下一个结构。因此，每艘船都包含一个指向下一只的指针：\n\
  \n```cpp\nstruct EnemySpaceShip\n{\nint x_coordinate;\nint y_coordinate;\nint weapon_power;\n\
  EnemySpaceShip* p_next_enemy;\n};\n```\n\n是的，在你问之前，在 `EnemySpaceShip` 结构定义中使用 `EnemySpaceShip`\
  \ 是完全可以的；C++ 完全能够处理它。\n\n如果在结构中这样做，就会出问题：\n\n```cpp\nEnemySpaceShip next_enemy;\n\
  ```\n\n这会得到一个无限重复的结构。只声明一艘船就会占用所有的系统内存。但是，你有没有注意到我们使用的是指向 `EnemySpaceShip` 的指针，而不是实际的\
  \ `EnemySpaceShip`？指针不需要只指向有效内存，正因如此，我们不需要一个无尽的太空船列表。我们只需要一艘可能指向也可能指向另一只的船。如果是，你需要更多的内存，但在那发生之前，唯一使用的内存是指针所占的内存。指针做的只是建议可能指向更多的有效内存，它只需要足够的内存来存储该地址。\n\
  \n当声明一个 `EnemySpaceShip` 时，你需要足够的空间来存放四个东西——`x_coordinate`、`y_coordinate`、`weapon_power`\
  \ 以及最后一个指针。\n\n是时候深入研究在结构中使用指针的细节了。\n\n### 指针与结构\n\n使用指针访问结构字段是使用 `->` 运算符而不是 `.`\
  \ 运算符：\n\n```cpp\np_my_struct->my_field;\n```\n\n每个结构字段都有它们自己的内存地址，这通常与结构的开头只差几个字节。箭头语法\
  \ (`->`) 会计算出访问指定字段所需的精确索引。所有其他指针属性仍然适用，且箭头语法等同于以下写法：\n\n```cpp\n(*p_my_struct).my_field;\n\
  ```\n\n如果将指向结构的指针作为参数传递给函数，函数可以修改该结构所在地址的内存，这意味着它可以修改实际结构。这与将数组传递给结构时的情况相同。\n\n\
  我们在 `EnemySpaceShip` 结构中可以看到这个例子：\n\n```cpp\n// 我们需要这个头文件来使用 NULL；通常它会被\n// 其他头文件包含，但我们我们不需要使用任何其他头文件\n\
  // #include <cstddef>\n\nstruct EnemySpaceShip\n{\nint x_coordinate;\nint y_coordinate;\n\
  int weapon_power;\nEnemySpaceShip* p_next_enemy;\n}; \n\nEnemySpaceShip* getNewEnemy\
  \ ()\n{\nEnemySpaceShip* p_ship = new EnemySpaceShip;\np_ship->x_coordinate = 0;\n\
  p_ship->y_coordinate = 0;\np_ship->weapon_power = 20;\np_ship->p_next_enemy = NULL;\n\
  return p_ship;\n}\n\nvoid upgradeWeapons (EnemySpaceShip* p_ship)\n{\np_ship->weapon_power\
  \ += 10;\n}\n\nint main ()\n{\nEnemySpaceShip* p_enemy = getNewEnemy();\nupgradeWeapons(\
  \ p_enemy );\n}\n```\n\n我们在 `getNewEnemy` 中使用了 `new` 为另一艘船分配内存，而在 `upgradeWeapons`\
  \ 中我们可以直接修改 `p_ship`，因为它指向一个包含所有结构字段的内存块。\n\n### 创建链表\n\n现在我们知道了处理结构指针的什么语法，我们可以继续创建列表了。每当你使用一个带有指向后续元素的结构来创建列表时，它被称为链表。\n\
  \n识别列表意味着有一种持有列表开头的方法；使用之前的示例，我们可以添加一个持有太空船的方法：\n\n```cpp\nstruct EnemySpaceShip\n\
  {\nint x_coordinate;\nint y_coordinate;\nint weapon_power;\nEnemySpaceShip* p_next_enemy;\n\
  };\n\nEnemySpaceShip* p_enemies = NULL;\n```\n\n我们有一个名为 `p_enemies` 的变量，这就是存储敌人列表的地方。每当新敌人加入游戏时，我们将其放入这个列表。更重要的是，它被添加到列表开头，如下所示：\n\
  \n```cpp\nEnemySpaceShip* getNewEnemy ()\n{\nEnemySpaceShip* p_ship = new EnemySpaceShip;\n\
  p_ship->x_coordinate = 0;\np_ship->y_coordinate = 0;\np_ship->weapon_power = 20;\n\
  p_ship->p_next_enemy = p_enemies;\np_enemies = p_ship;\nreturn p_ship;\n}\n```\n\
  \n\n\n在开始时，`p_enemies` 为 `NULL`（它是空的）。当创建一个新敌人时，它会被进行更新，使其指向列表中的最后一个第一个元素（该元素存储在\
  \ `p_enemies` 中），然后将 `p_enemies` 设置为指向新敌人。基本上，每个新元素都是通过将所有其他元素向后推来添加到列表开头的。不需要复制，我们所做的只是修改一对指针。\n\
  \n你感到困惑吗？我们将过过一遍：\n\n### 第一次\n\n`p_enemies` 初始为 `Null` – 我们没有敌人。（`NULL` 始终将被用作指示我们已到达列表末尾的标记符）\n\
  \n1.  我们分配分配了一艘名为 `p_ship` 的新船，给了我们一个名为 `SHIP 1` 的敌人。它还没有在我们的链表中，并且指向未知的内存。\n2.\
  \  `SHIP 1` 中的 `p_next_enemy` 字段被设置为指向当前的敌人列表（此时为 `NULL`）。\n3.  接下来，我们更新 `p_enemies`，使其指向这艘新船。\n\
  4.  该函数将 `p_ship` 返回给调用者，而 `p_enemies` 允许我们访问整个列表，目前它只有一个元素。\n\n### 第二次\n\n当我们再次通过一遍时，我们从\
  \ `p_enemies` 指向新船开始：\n\n1.  分配了新的名为 `p_ship` 的新船，给了我们两个敌人。第二个也有一个 `p_next_enemy`\
  \ 字段，它也指向未知的内存。\n2.  然后设置 `p_next_enemy` 使其指向当前的敌人列表；这就是我们在第一次走过一遍时创建的那个敌人。\n3.\
  \  更新 `p_enemies`，使其指向新船（我们创建的第二艘船，它指向了我们的第一艘船）。\n4.  该函数将 `p_ship` 返回给调用者，而 `p_enemies`\
  \ 允许我们访问整个列表。\n\n实际上，我们所做的只是每当插入一个新元素时，就将元素在列表中向下推一步。不需要像操作数组那样复制列表；你所做的只是更新相关的指针，使其指向新的第一个元素。第一个元素始终被称为“头节点”（head），你通常会有一个指针始终指向头节点（在我们的案例中是\
  \ `p_enemies`）。当函数结束时，`p_enemies` 和 `p_ship` 都指向同一个地方；在我们到达那个阶段之前，`p_ship` 指针需要持有新内存，以便\
  \ `p_next_enemy` 能够被修改为指向 `p_enemies` 中列表的最后一个头。\n\n我们在函数中使用了一个全局变量，但你可以将其重写为接收头节点的形式；这样它就可以适用于任何列表，而不仅仅是一个全局列表。它看起来像这样：\n\
  \n```cpp\nEnemySpaceShip* addNewEnemyToList (EnemySpaceShip* p_list)\n{\n    EnemySpaceShip*\
  \ p_ship = new EnemySpaceShip;\n    p_ship->x_coordinate = 0;\n    p_ship->y_coordinate\
  \ = 0;\n    p_ship->weapon_power = 20;\n    p_ship->p_next_enemy = p_list;\n   \
  \ return p_ship;\n}\n```\n\n注意，这与 `getNewEnemy` 函数不同，因为它返回的是列表的指针，而不是新敌人。由于函数无法修改关联的全局变量，也无法修改传入的指针，我们需要提供一种方法让调用者拥有列表的新开头。然后，调用者可以写：\n\
  \n```cpp\np_list = addNewEnemyToList(p_list);\n```\n\n实际上，我们所做的只是每当插入一个新元素时，就将元素在列表中向下推一步。不需要像操作数组那样复制列表；你所做的只是更新相关的指针，使其指向新的第一个元素。第一个元素始终被称为“头节点”（head），你通常会有一个指针始终指向头节点（在我们的案例中是\
  \ `p_enemies`）。当函数结束时，`p_enemies` 和 `p_ship` 都指向同一个地方；在我们到达那个阶段之前，`p_ship` 指针需要持有新内存，以便\
  \ `p_next_enemy` 能够被修改为指向 `p_enemies` 中列表的最后一个头。\n\n\n\n\n```cpp\n// 确保选举没有被操纵（通过清空数组）\n\
  \nfor ( int i = 0; i < 10; ++i )\n{\n  votes[ i ] = 0;\n}\n\nint candidate;\ncout\
  \ << \"请选择您的候选人，使用数字：0) John 1) Billy 2) Marie 3) Suzanne 4) Millie 5) Ellie 6)\
  \ Alexander 7) Timmy 8) Michael 9) Eileen\" << '\\n';\ncin >> candidate;\n\n// 继续输入投票，直到用户输入无效候选人编号退出\n\
  while ( 0 <= candidate && candidate <= 9 )\n{\n  // 注意不能使用 do-while 循环，因为我们必须在\n\
  \  // 更新数组之前检查候选人是否在正确范围内；\n  // do-while 循环要求候选人值\n  // 被读取、检查，然后增加票数\n  votes[\
  \ candidate ]++;\n  cout << \"请输入另一张票： \";\n  cin >> candidate;\n}\n\n// 显示票数\n\
  for ( int i = 0; i < 10; ++i )\n{\n  cout << votes[ i ] << '\\n';\n}\n```\n\n看看为指定候选人更新计数是多么简单？我们可以在这里让它变得复杂一点，使用结构体数组。每个结构体包含候选人名称和票数，通过这种方式打印名称和票数会容易得多。\n\
  \n现在考虑一下如果你尝试使用链表来实现这一点，情况会变成怎样。代码需要遍历每一个元素直到找到指定的候选人。因此，为候选人 `4` 投票将需要循环从 `candidate\
  \ 0` 运行到 `candidate1`，然后到 `2`，依此类推——你无法进入列表的中间。\n\n使用索引访问数组元素的时间是常数的；它不会随数组的大小而改变。然而，在链表中查找元素所花费的时间与列表的大小成正比。列表越大，耗时就越慢。\n\
  \n一个非常重要的考虑因素是数据结构将使用的空间，特别是当它是一个很大的结构时。对于较小的结构，你不会看到太大区别，但对于非常大的结构，空间量可能会成为问题。\n\
  \n数组每个元素占的空间并不多。链表既需要列表项需要指向下一个列表元素的指针，这意味着它们初始每个元素就需要大约两倍的空间。然而，如果你不知道将存储多少元素，链表最初可以占据更少的空间。与其分配一个巨大的数组并让其大部分为空，你只需要在需要时分配新节点，这样你就永远不会分配用不到的内存。\n\
  \n而且不要忘记数组也可以是多维的。使用 `8 x 8` 表示棋盘很容易，但尝试用链表来实现则需要一个由其他列表组成的列表，想要从中获取某个特定元素，祝你好运吧！\n\
  \n关于何时应该使用链表或数组，有一些经验法则：\n\n* 当你要求通过索引访问元素的常数时间，并且预先知道需要存储的项目数量，或者你需要将每个元素的空间保持到最低时，请使用数组。\n\
  * 如果你需要能够继续添加新元素，或者你想在中间插入内容，请使用链表。\n\n通过测验回顾任何你不理解的内容，然后我们将进入递归。\n\n## 验 13\n\n\
  使用链表而不是数组的优势是什么？\n\nA. 链表每个元素占用的空间那么多\nB. 链表可以动态增长，因此它们可以包含单个新元素而不需要复制现有元素\nC. 链表查找指定元素的速度比数组快\n\
  D. 链表可以将结构体作为它们的元素\n\n以下哪些陈述是正确的？\n\nA. 使用数组没有好的理由\nB. 数组和链表在性能方面具有完全相同的特性\nC. 数组和链表都允许通过索引以常数时间访问元素\n\
  D. 你在链表中间添加元素的速度比在数组快得多\n\n通常什么时候会使用链表？\n\n1. 当你只有一个要存储的项时\n2. 当你在编译时知道要存储的项目数量时\n\
  3. 当你需要动态添加和删除元素时\n4. 当你需要在不进行任何迭代的情况下立即访问排序列表中的某项时\n\n为什么声明一个引用列表项类型的链表是允许的？\n\n\
  ```cpp\nstruct Node {\n  Node* p_next;\n};\n```\n\n1. 这是不允许的，你不能这样做\n2. 因为编译器可以计算出你不需要自引用项的内存\n\
  3. 因为该类型是指针，你只需要添加单个指针的空间。下一个真实节点的内将在稍后分配\n4. 只有在你不需要分配 `p_next` 使其指向另一个结构时才是允许的\n\
  \n为什么链表的末尾应该有一个 `NULL`？\n\nA. 因为它是指示列表已结束的唯一方法\nB. 它阻止代码使用未初始化的内存\nC. 它用于帮助调试——进入列表太深，程序就会崩溃\n\
  D. 如果没有存储 `NULL`，列表将无限\n\n数组和链表在哪些方面是相似的？\n\nA. 它们可以在中间添加新元素\nB. 它们按顺序存储数据\nC. 它们都可以变得更大\n\
  D. 它们都让你快速访问所有元素\n\n## 递归\n\n在本指南中，你已经看到了几种算法基于循环，或重复某些操作。你可以在不使用循环的情况下重复代码——相反，我们使用重复调用。我们称之为递归，一种通过在自身基础上表达操作的技术。这意味着，函数将调用它自己。\n\
  \n递归非常像循环但功能强大得多，在编写几乎无法用循环编写的程序时，递归使其变得简单。当你将其应用于链表和二叉树时，它将非常强大。\n\n### 如何思考递归\n\
  \n思考递归函数的最好方法将其设为一个简单的重复的过程。这使得它类似于循环，但使用递归更容易表达需要递归调用结果才能完成任务的想法。\n\n想象一个建造墙的例子。它高\
  \ 10 英尺，所以你建造一面 9 英尺高的墙，然后加上最后一英尺的砖。作为一个概念，这等同于说一个名为 `buildWall` 的函数接受参数 `height`，如果它大于\
  \ 1，函数将调用自己来建造较低的墙，然后添加剩余部分。\n\n让我们看看是否可以通过一个简单的结构使其更清晰。它确实有一些缺陷稍后可以讨论，但重要的是建造那堵墙可以用较小的墙来表达：\n\
  \n```cpp\nvoid buildWall (int height)\n{\n  buildWall( height - 1 ); \n  addBrickLayer();\n\
  }\n```\n\n这里有一个问题——代码何时停止调用 `buildWall`？永远不会，但解决方案很简单——当墙的高度为 0 时，需要停止递归调用。当我们的高度为\
  \ 0 时，添加一层砖，而不建造较小的墙。\n\n```cpp\nvoid buildWall (int height)\n{\n  if ( height >\
  \ 0 )\n  {\n    buildWall( height - 1 ); \n  }\n  addBrickLayer();\n}\n```\n\n\n\
  \n\n函数不再调用自身的情况被称为函数的基准情况（base case）。在我们的示例中，名为 `buildWall` 的函数将知道，如果我们到达地面，就可以添加一层砖来筑起墙（即基底）。否则，仍需要建造一堵小墙并再添加一层砖。\n\
  \n如果你在跟进代码时遇到困难，可以从物理墙的角度来思考。你开始的想法是建造一堵高度为特定数值的墙。然后你说，为了在这个位置放一块砖，我的墙必须减小一砖的高度。最终，你会说不再需要一堵更小的墙了，你可以直接从地面开始建造——这就是你的基准情况。\n\
  \n因此，我们的算法是将问题简化为一个更小的问题，然后解决这个较小的问题。很快，小问题就会变得足够到我们不需要继续下去的程度；简单的情况可以直接被解决。\n\n\
  在现实世界中，这意味着我们把墙造好了。在 `C++` 中，这意味着函数在某一点停止了这些递归调用。这非常像我们之前看到的自顶向下程序设计，即将问题分解成更小的问题。为子问题创建了函数，然后使用这些函数来构建整个程序。而使用递归，问题被分解为相同小问题的更小版本。\n\
  \n当一个函数完成对自身的调用后，它可以在调用返回后移动到调用点之后的行。当递归调用返回时，该函数将继续执行操作并继续调用其他函数。在我们的筑墙案例中，一旦小墙筑好，函数将通过放置另一层砖来继续执行。\n\
  \n让我们来看一个可以看到实际输出的真实世界示例。假设你想打印数字，`123456789987654321`。递归语句应该如何编写？我们首先写一个函数，接收一个数字并打印两次——一次在递归之前，一次在递归之后。\n\
  \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nvoid printNum (int num)\n\
  {\n    // 函数中对 cout 的调用将包围一个包含\n    // 数字 (num+1)...99...(num+1) 的内部序列\n    cout\
  \ << num;\n\n    // 当 begin 小于 9 时，我们必须递归地打印\n    // (num+1) ... 99 ... (num+1)\
  \ \n    if ( num < 9 )\n    {\n        printNum( num + 1 );\n    }\n    cout <<\
  \ num;\n}\n\nint main ()\n{\n    printNum( 1 );\n}\n```\n\n`printNum(num + 1)` 的递归函数调用打印了一个序列\
  \ `(num+1)...99...(num+1)`。\n\n当你在 `printNum(num+1)` 用的两边打印 `num` 时，你创建了一种“三明治”结构。`num`\
  \ 在 `(num+1)…99…(num+1)` 序列的每一侧都被打印，这使得变成了 `(num)(num+1)…99…(num+1)(num)`。如果 `num`\
  \ 是 1，那么得到的就是 `12…99…21`。\n\n这种函数还有另一种思考方式：首先，每当调用一次 `printNum` 时，它都会打印从 1 到 9 的序列。当它到达基准情况时，`printNum`\
  \ 返回每个递归调用，数字按照函数返回的顺序打印；因为最后一个函数是使用数字 9 用的，所以它在到达基准情况时立即打印，不再再次调用该函数。\n\n当调用返回时，它返回到\
  \ `num` 值为 8 的调用处，这意味着打印了 8。它继续返回，`num` 值为 7，以此此类推，一直经过所有数字直到打印出 1。\n\n## 递归与数据结构\n\
  \n某些数据结构非常适合递归算法，因为其结构组合最好被描述为拥有同一个数据结构的小型版本。由于递归算法通过获取一个问题并将其转化为自身的更小版本来工作，它们与包含同一个数据结构的小型版本的数据结构配合得非常好——链表就是其中之一。\n\
  \n到目前为止，我们将链表描述为一种可以在开头添加更多节点的列表。对它们的另一种思考方式是，它们由一个第一个节点组成，该节点指向一个较小得多的链表。因此，链表由单个节点组成，每个节点都指向“列表的剩余部分”开头的另一个节点。\n\
  \n这很重要，因为这为我们提供了一个非常有用的属性——我们可以通过处理当前节点或处理“列表的剩余部分”来编写处理链表的代码。例如，如果你想在列表中找到指定的节点，你将使用如下基础算法：\n\
  \n- 如果我们到达列表的末尾，则返回 `NULL`。\n- 否则，如果当前节点是目标节点，则返回它。\n- 否则，对列表的剩余部分重复搜索。\n\n在代码中，它看起来如下：\n\
  \n```cpp\nstruct node\n{\n    int value;\n    node *next;\n};\n\nnode* search (node*\
  \ list, int value_to_find)\n{\n    if ( list == NULL )\n    {\n        return NULL;\n\
  \    }\n    if ( list->value == value_to_find )\n    {\n        return list;\n \
  \   }\n    else\n    {\n        return search( list->next, value_to_find);\n   \
  \ }\n}\n```\n\n\n\n我们使用了完全相同的检查，这样你就可以看到它与递归版本的对比了。两者之间只有一个区别——在这里我们没有递归，而是使用了循环；而且我们没有使用递归调用，而是将\
  \ `list`指向“列表的剩余部分”，以便它每次执行时都会缩短。这是循环和递归都能良好工作的情况之一。\n\n通常，当递归函数调用产生的结果不需要进行任何处理时，将循环写成递归算法（或反之亦然）并不困难。我们称这为**尾递归**——递归调用是函数执行的绝对最后一件事，紧接在末尾。因为这是最后执行的操作，所以它与循环中移动到下一步没有区别。一旦下一次调用完成，就不需要上一次调用的任何内容了。尾递归的一个很好的例子就是列表搜索示例。\n\
  \n你也可以考虑阶乘函数。根据我们的递归实现将其转换为循环可能会导致一个问题：\n\n```\nint factorial (int x)\n{\nwhile\
  \ ( 1 )\n{\nif ( x == 1 ) \n{\nreturn 1;\n}\n// 我们应该在在这里放什么？？\n// return x * factorial(\
  \ x – 1 );\n}\n}\n```\n\n必须对 `factorial (x-1)` 的结果进行处理，因此循环不是一个选项。实际上，在我们解决这个问题之前，需要先解决子问题。\n\
  \n然而事实证明 `factorial` 很容易转换为循环；你只需要重新思考原始问题。这是我们最初开始的定义：\n\n`Factorial( x ) = x *\
  \ ( x - 1 ) *( x - 2 )...*1`\n\n如果我们跟踪当前值，可以计算阶乘，但存储 `x*(x-1) * )x-2) ….` 的乘法运行结果呢？\n\
  \n``````int factorial (int x)\n{\nint cur = x;\nwhile ( x > 1 )\n{\nx--;\ncur *=\
  \ x;\n}\nreturn x;\n}\n```\n\n我们没有利用子问题的结果来解决这个问题，而是以相反的方式进行乘法。假设我们计算五的阶乘；递归解决方案将执行如下乘法：\n\
  \n`1 * 2 * 3 * 4 * 5`\n\n迭代或循环解决方案将以这种方式执行，相反顺序：\n\n`5 * 4 * 3 * 2 * 1`\n\n这两种方法都可行，但它们的结构不同。当你重新思考算法结构时，你就可以将同一个\
  \ `factorial` 写成循环。不过这只是一个简单的例子；它并不总是那么容易，你是否选择递归取决于你能多容易易地用迭代的术语来重新思考结构。对于 `factorial`\
  \ 来说很容易，但其他情况并非如此，你很快就会看到示例。\n\n### 栈（The Stack）\n\n回到函数调用以及它们是如何工作的。一旦你掌握了它们的工作原理，你会发现递归更容易追踪和理解，并且你应该能理解为什么某些算法写成递归比写成循环容易得多。\n\
  \n函数使用的每条信息都存储在栈上。把栈想象成一堆盘子；你可以顶部添加或删除，我们的栈工作方式也一样。只不过，我们的不是盘子，而是**栈帧（stack frames）**。当函数被调用时，一个新的栈帧被放置在栈的顶部，该函数使用该栈帧来存储所有将要使用的局部变量。\n\
  \n当调用另一个函数时，当前栈帧的空间会被保留，并在上方再添加一个；这为新函数提供了存储其变量的空间。当前执行的函数将始终使用顶部的帧。\n\n在最简单的情况下，当\
  \ `main` 函数执行时，栈看起来像这样：\n\nmain 函数中的变量\n\n在这里，我们只有一个函数，即 `main` 函数，栈中只包含该函数的变量。\n\
  \n如果 `main` 调用另一个函数，新函数会创建一个栈帧并到达顶部，它看起来像这样：\n\n第二个函数中的变量\n\nmain 函数中的变量\n\n现在当前函数可以存储它的变量以便进行处理，且不会与\
  \ `main` 函数的变量产生干扰。现在如果这个函数再次调用一个，栈将看起来像这样：\n\n第三个函数中的变量\n\n第二个函数中的变量\n\nmain 函数中的变量\n\
  \n再次，新函数将拥有自己的栈帧。每次函数调用都会创建一个栈帧，当从函数返回时，栈将恢复到执行之前的状态：\n\n第二个函数中的变量\n\nmain 函数中的变量\n\
  \n当第二个函数返回时，栈将恢复为只一个帧：\n\nmain 函数中的变量\n\n活跃的帧（即顶部的帧）将始终与当前执行的函数相关联。\n\n除了函数变量外，函数参数也存储在栈上，连同函数应该返回的代码行。因此，栈帧用于存储函数位置以及函数使用的所有内容。当你递归地调用一个函数时，即使是针对同一个函数，也会创建一个新的栈帧。这就是递归确实起作用的原因——每个函数调用都有自己的帧，以及自己的变量和参数。正因如此，函数可以很容易地处理大问题的较小版本。\n\
  \n当函数返回后，它将从栈中移除自己的栈帧，并返回到调用者的执行点。当栈帧被移除时，它被恢复到调用者处。非常重要的一点是，栈帧存储了函数返回的位置，一旦函数完成，它就会被移除。\n\
  \n你可以这样想——当函数被调用时，前一个函数继续执行所需的所有内容都被保留了。假设你正在写论文，真的需要去吃饭。你会写一些笔记以便记住写到了哪里，然后在吃完饭后，你可以从那里继续工作。栈让计算机保留这些笔记，而它们比我们能编写的要复杂得多！\n\
  \n下面的内容展示了 `buildWall` 函数的一系列递归调用的栈。从高度 2 开始，你可以看到栈帧存储了传入函数的新值。注意，值为 0 的函数调用是顶部的那个，这在物理术语上就是底部：\n\
  \n`height = 0`\n\n`height = 1`\n\n`height = 2`\n\n你经常会看到这种画栈的方法被简写为：\n\n```\nbuildWall(\
  \ x = 0 )\nbuildWall( x = 1 )\nbuildWall( x = 2 )\nmain( )\n```\n\n每个函数都显示在调用它的函数上方，你也可以看到函数参数。这种技术有助于理解递归工作的方式。\n\
  \n### 栈的力量\n\n递归的关键在于函数调用的栈，而只有一个栈帧。递归算法将充分利用每个栈帧中的所有额外信息；循环只能得到一组变量。这意味着递归函数可以等待递归调用返回，然后从之前结束的地方精确继续。如果你想写一个这样的循环，你需要尝试实现一个栈的版本。\n\
  \n### 递归的缺点\n\n栈的大小是固定的，这意味着无限递归是不可能的。总会有一个点，为新栈帧留的空间耗尽。下面的代码演示了在理论上可以无限的递归：\n\n\
  ```\nvoid recurse ()\n{\nrecurse(); // 函数将调用自己\n}\n\nint main ()\n{\nrecurse();\
  \ // 触发递归\n}\n```\n\n\n\n但随着时间的推移，栈上的空间会被用尽，导致发生栈溢出（stack overflow），从而使程序崩溃。栈溢出发生在栈空间耗尽且无法再进行更多函数调用时。如果你的程序尝试进行另一次调用，它就会崩溃。虽然这种情况并不常见，但当你看到栈溢出错误时，它通常是一个基准情况（base\
  \ case）编写错误的递归函数。例如，我们之前使用的阶乘函数并不完全——基准情况中没有对负数的检查。如果调用者传入了 `-1`，栈就会溢出。\n\n接下来我们有一个简单的示例，展示了一个微型函数需要多少次递归调用才能耗尽栈空间。值得注意的是，函数的栈帧（stack\
  \ frame）越大，可以进行的递归调用就越少，尽管只要基准情况正确，这通常不会成为问题：\n\n```cpp\n#include <iostream>\n\n\
  using namespace std;\n\nvoid recurse (int count) // 每个调用都有自己的 count\n{\n    cout\
  \ << count << \"\\n\";\n    // 不需要增加 count，因为每个函数的\n    // 变量是独立的（而且每个栈帧中的 count\
  \ 将\n    // 被初始化为比上一个 count 大 1）\n    recurse( count + 1 );\n}\n\nint main ()\n\
  {\n    recurse( 1 ); // 第一次函数调用，所以从 1 开始\n}\n```\n\n### 调试栈溢出\n\n当你尝试调试栈溢出时，最重要的是找出是哪一个或几个函数在不断添加新的帧。例如，如果你使用调试器，你可以从上面的示例看到，当程序崩溃时，栈看起来如下：\n\
  \n```\nrecurse( 10000 );\nrecurse( 9999 );\nrecurse( 9998 );\n...\nrecurse( 1 )\n\
  main()\n```\n\n这个很容易解决，因为只有一个函数；显而易见，缺少了某种基准情况，这可能与递归参数达到特定大小时未能停止运行有关。\n\n偶尔，你可能会遇到两个互相调用的函数，即相互递归（mutual\
  \ recursion）。下面的示例使用了 `factorial`，并用两个函数来计算它——一个处理奇数，另一个处理偶数：\n\n```cpp\nint factorial_odd\
  \ (int x)\n{\n    if ( x == 0 )\n    {\n        return 1;\n    }\n    return factorial_even(\
  \ x – 1 );\n}\n\nint factorial_even (int x)\n{\n    if ( x == 0 )\n    {\n     \
  \   return 1;\n    }\n    return factorial_odd( x – 1 );\n}\n\nint factorial (int\
  \ x)\n{\n    if ( x % 2 == 0 )\n    {\n        return factorial_even( x );\n   \
  \ }\n    else\n    {\n        return factorial_odd( x );\n    }\n}\n```\n\n在这种情况下，基准情况没有防御负数输入，如果你调用\
  \ `factorial(-1)`，调用栈看起来将如下：\n\n```\nfactorial_even( -10000 )\nfactorial_odd( -9999\
  \ )\nfactorial_even( -9998 )\nfactorial_odd( -9997 )\n```\n\n仅凭此，你就能够判断出问题出在基准情况上，并且这些函数只是在互相调用。因此，你的下一步应该是检查代码，找出哪一个函数应该在基准情况中内置对负数的检查。对于\
  \ `factorial` 计算，明智的做法是为两个函数设置单独的基准情况，每个基准情况都带有相同的检查。在其他情况下，可能只有一个函数需要最终的基准情况。\n\
  \n每当你发现自己必须调试复杂的递归调用时，尝试寻找一组重复的函数。在我们的案例中，只是两个函数——`factorial_odd` 和 `factorial_even`——在互相调用；但在其他情况下，重复之间可能有很长的一段时间，你需要找到一整组重复的函数调用。然后你必须弄清楚原因。\n\
  \n### 总结\n\n通过递归，你可以创建算法来解决问题；这是通过将问题分解为原始问题的更小克隆来实现。递归比循环更强大；递归函数在栈中保留每次单独递归调用的状态，这意味着函数在子问题结果返回后可以继续执行。\n\
  \n递归算法的实现通常感觉比循环实现更合理。在下一章中，你将看到更多关于二叉树的示例，随着你继续开发代码，你会发现递归比你提供了循环无法解决的更广泛的问题范围。\n\
  \n最后，两条规则可以帮助你判断是使用递归还是循环。\n\n在以下情况下应该使用递归：\n* 当解决方案需要将原始问题分解为自身的小版本，且编写循环不是显而易见的选择时。\n\
  * 你正在处理链表或其他递归数据结构时。\n\n在以下情况下应该使用循环：\n* 当显而易见循环可以解决问题时，例如正在相加数字列表。\n* 你使用的数据结构是数字索引的，即数组。\n\
  \n### 测验 14\n\n**什么是尾递归？**\nA. 当你叫你的狗过来时\nB. 当一个函数调用自身时\nC. 当递归函数调用自身且它是它返回前做的最后一件事时\n\
  D. 当算法可以写成循环时\n\n**什么时候会使用递归？**\nA. 当算法无法写成循环时\nB. 当算法更自然地用子问题表示时\nC. 永远不会，太难了\n\
  D. 当你处理数组\n\n**递归算法需要哪些元素？**\nA. 递归调用和基准情况\nB. 基准情况和分解问题的方法\nC. 组合所有版本的方法\nD. 以上所有项\n\
  \n**如果没有基准情况可能会发生什么？**\nA. 算法可能会提前结束\nB. 编译器会检测到并不喜欢\nC. 这将不是问题\nD. 你可能会遇到栈溢出\n\n\
  ### 二叉树\n\n二叉树是所有数据结构中最实用的之一，也是目前最有趣的。它们是使用递归和指针完成某些有用工作的完美示例。\n\n但是（这是一个很大的但是），要理解二叉树，你真的需要理解递归和链表背后的概念。如果你觉得这一节很难，请回去复习指针、链表和递归，并在重新尝试测验后再回来。\n\
  \n\n\n那么，数据结构化意味着什么？当我们开始这段旅程时，我们只有数组，但这些数组从未真正让我们具备使用除顺序列表以外的数据结构的能力。链表使用指针来增量地扩展这些顺序列表，但并没有充分利用指针的灵活性来构建更复杂的结构。\n\
  \n内存中这些更复杂的结构是什么呢？嗯，在任何时刻持有不止一个“下一个节点”的结构就是一个很好的例子。但你为什么需要它呢？很简单——如果你有两个“下一个节点”，其中一个可以用来表示比当前元素更多的元素。这被称为二叉树。\n\
  \n它们之所以这样命名，是因为每个节点都始终有一个或两个分支。每个“下一个节点”都是子节点，而连接到子节点的节点就是父节点。\n\n二叉树看起来可能像这样：\n\
  \n```\n10\n6 14\n5 8 11 18\n```\n\n在树中，每个元素的左子都小于该元素，而右子则大于它。`10` 是整棵树的父节点，而 `6`\
  \ 和 `14` 的子节点都是它们各自小树的父节点，这些小树被称为子树。\n\n二叉树有一个非常重要的属性；每个子节点都是一整棵树。结合“左孩子小于当前节点，右孩子大于当前节点”的规则，你就有了一种简单的方法来定义在树中定位特定节点的算法。\n\
  \n首先，你查看当前节点的值。如果它等于搜索目标，就完成了。如果它大于搜索目标，向左走；否则，向右走。这之所以有效是因为树左侧的每个节点都小于当前节点，右侧的每个节点都大于当前节点。\n\
  \n在理想的世界里，你的二叉树应该是平衡的，两边的节点数量完全相同。当你实现这一点时，每个子树大约占整棵树大小的 50%，当你在树中搜索一个值时，每次到达子节点时都可以排除\
  \ 50% 的结果。所以，如果你有一棵拥有 1000 个元素的树，立即就能排除 500 个。再次搜索这棵树（现在它只有 50 个元素了），你可以再次削减大约 50%。这样，找到你想要的值就不需要很久。\n\
  \n那么，在找到一个元素之前，树必须被划分多少次？答案是 `log2n`（`n` 是树拥有的元素数量）。即使你的树很大，这个值也很小——如果你的树有比如 320\
  \ 亿个元素，这个值也为 `32`，比对 40 亿元素的链表进行搜索快了几乎 1 亿倍，而在链表中每一个元素都必须被查看。\n\n如果树是不平衡的，你无法排除大约一半的元素；最坏的情况下，每个节点只有一个子节点，这使得这棵树仅仅是一个带有几个额外指针的链表，导致你必须搜索所有元素。\n\
  \n所以，当树大致平衡时，搜索节点比在链表上进行相同的搜索要快且容易得多。这是因为你可以按照自己的方式结构化内存。\n\n## 实现二叉树\n\n从简单的开始，为了实现二叉树，我们首先声明节点结构体：\n\
  \n```c\nstruct node\n{\n    int key_value;\n    node *p_left;\n    node *p_right;\n\
  };\n```\n\n节点可以像简单的整数 `key_value` 存储值，并有两个子树——`p_left` 和 `p_right`。\n\n你可能在二叉树上需要一些常用函数——插入、搜索、删除和销毁：\n\
  \n```c\nnode* insert (node* p_tree, int key);\nnode *search (node* p_tree, int key);\n\
  void destroy (node* p_tree);\nnode *remove (node* p_tree, int key);\n```\n\n###\
  \ 插入\n\n我们将使用递归算法来向二叉树进行插入。\n\n```c\nnode* insert (node *p_tree, int key)\n{\n \
  \   // 如果树为空，则创建一个节点并返回\n    if ( p_tree == NULL )\n    {\n        node* p_new_tree\
  \ = new node;\n        p_new_tree->p_left = NULL;\n        p_new_tree->p_right =\
  \ NULL;\n        p_new_tree->key_value = key;\n        return p_new_tree;\n    }\n\
  \    // 根据键的值决定左树还是右树\n    if ( key < p_tree->key_value )\n    {\n        // 如果左子树为空，则创建新子树\n\
  \        // 如果不为空，则递归调用\n        p_tree->p_left = insert( p_tree->p_left, key );\n\
  \    }\n    else if ( key > p_tree->key_value )\n    {\n        // 如果右子树为空，则创建新子树\n\
  \        // 如果不为空，则递归调用\n        p_tree->p_right = insert( p_tree->p_right, key\
  \ );\n    }\n    // 如果键等于键值，说明键已存在，直接返回节点\n    return p_tree;\n}\n```\n\n### 搜索\n\
  \n现在我们查看树搜索的实现。基本逻辑与插入相似——检查基础情况以查看我们节点还是空树。如果没有节点，确定需要搜索哪一个子树。\n\n```c\nnode *search\
  \ (node *p_tree, int key)\n{\n    // 如果到达空树，我们知道它不在！\n    if ( p_tree == NULL )\n\
  \    {\n        return NULL;\n    }\n    // 如果找到了键，我们完成了！\n    else if ( key ==\
  \ p_tree->key_value )\n    {\n        return p_tree;\n    }\n    // 否则，在左树或右树中查找\n\
  \    else if ( key < p_tree->key_value )\n    {\n        return search( p_tree->p_left,\
  \ key );\n    }\n    else\n    {\n        return search( p_tree->p_right, key );\n\
  \    }\n}\n```\n\n### 销毁\n\n这也应该是一个递归函数。算法在删除当前节点之前，销毁位于当前节点的两个子树。\n\n```c\nvoid\
  \ destroy_tree (node *p_tree)\n{\n    if ( p_tree != NULL )\n    {\n        destroy_tree(\
  \ p_tree->p_left );\n        destroy_tree( p_tree->p_right );\n        delete p_tree;\n\
  \    }\n}\n```\n\n\n\n\n```cpp\ndestroy_tree( p_tree->p_left );\n\ndestroy_tree(\
  \ p_tree->p_right );\n\ndelete p_tree;\n\n}\n\n}\n```\n\n为了更好地理解这一点，假设我们在删除节点之前打印了该节点的值：\n\
  \n```cpp\nvoid destroy_tree (node *p_tree)\n{\n  if ( p_tree != NULL )\n  {\n  \
  \  destroy_tree( p_tree->p_left );\n    destroy_tree( p_tree->p_right );\n    cout\
  \ << \"Deleting node: \" << p_tree->key_value;\n    delete p_tree;\n  }\n}\n```\n\
  \n如你所见，树是从底向上被删除的。首先是节点 5 和 8，然后是 6，接着移动到另一侧删除 11 和 18，最后是 14。最后，删除 10。树的值并不重要，重要的是节点所在的位置。在下面的二叉树中，我们使用的是删除顺序而不是节点值：\n\
  \n7\n3 6\n1 2 4 5\n\n手动在几棵树上运行一遍代码对你会有帮助，这样你就能看得更清楚。\n\n从树中删除节点是递归算法的一个极佳示例，用迭代方式来实现并不容易。首先，你需要一个可以同时处理树的两个边的循环。你需要在删除一个子树的同时跟踪下一个子树，这在每一层中都需要执行。使用栈（stack），你可以更容易地保持位置。最好的可视化方法是将其理解为每个栈帧都会存储已经删除或销毁的树分支：\n\
  \n```cpp\ndestroy_tree(  )\ndestroy_tree(  ) – 知道子树是左子树还是右子树\n```\n\n每个栈帧都知道树的哪些部分必须销毁，因为它们知道函数执行到哪一点应该继续。当第一次调用删除树时，程序通过栈帧通知在第二次调用\
  \ `destroy_tree` 时继续执行。当第二次调用发生时，程序被告知继续执行 `delete tree`。因为每个函数都有自己的栈帧，它可以跟踪当前时刻树的销毁的所有状态，一次处理一层树。\n\
  \n要用非递归的方式实现这一点，需要一个能够保留相同数量和类型信息的数据结构。例如，你可以写一个函数，使用链表来模拟这个列表。该链表将包含正在被删除的子树和等待删除的树。然后，可以写一个基于循环的算法，将子树添加到列表中，并在它们完全被删除后将其移除。基本上，递归允许你使用内置的栈数据结构，而不需要自己编写一个。\n\
  \n### 删除 (Removing)\n\n这个算法更为复杂。它的结构与我们之前看到的模式相似——如果我们得到一个空树，我们就完成了。如果要删除的值在左侧子树中，则从该树中删除该值，右侧亦然。如果找到了该值，就将其删除。\n\
  \n```cpp\nnode* remove (node* p_tree, int key)\n{\n  if ( p_tree == NULL )\n  {\n\
  \    return NULL;\n  }\n  if ( p_tree->key_value == key )\n  {\n    // 该做什么？\n \
  \ }\n  else if ( key < p_tree->key_value )\n  {\n    p_tree->left = remove( p_tree->left,\
  \ key );\n  }\n  else\n  {\n    p_tree->right = remove( p_tree->right, key );\n\
  \  }\n  return p_tree;\n}\n```\n\n但这些基础情况（base cases）中的一个并不简单。当你找到要删除的值时，你该怎么办？记住，二叉树必须维持这一条件：\n\
  \n*   当前节点左侧的所有树值必须小于键值（key value），而右侧的所有值必须大于键值。\n\n有几个需要考虑的基础情况：\n\n*   要删除的节点没有没有孩子\n\
  *   要删除的节点只有一个孩子\n*   要删除的节点有两个孩子\n\n第一种情况是最简单的——如果要删除的节点没有孩子，我们只需返回 `NULL`。\n\n\
  第二种情况也不难——如果只有一个孩子，返回该孩子即可。\n\n第三种情况是最困难的。你不能直接将两个孩子中的一个向上提升。如果你取被删除元素的左侧节点，会发生什么？如果你这样做，节点右侧的元素会发生什么？\n\
  \n让我们回到之前看的那棵树：\n\n10\n6 14\n5 8 11 18\n\n如果删除 10 会发生什么？如果你尝试将 6 放在它的位置，你会得到一棵像这样的树：\n\
  \n6\n8 14\n5 11 18\n\n现在 8 在 6 的左侧，尽管 8 大于 6。这破坏了树的结构——如果对 8 进行搜索，它会在 6 的右侧查找，永远找不到\
  \ 8。\n\n同样由于相同的原因，你不能取右侧的元素：\n\n14\n6 11\n5 8 18\n\n显然，11 小于 14……（此处原文为大量重复乱码已根据逻辑忽略）\n\
  \n\n\n\n`max_node` 必须被移除，而且我们所知，它没有右子树，这是最容易处理的情况之一。我们要做的是修改 `max_node` 的父节点，使其指向左侧的\
  \ `max_node` 子树。\n\n可以编写一个简单的函数，该函数接收包含 `max_node` 的树根节点和指向 `max_node` 的指针，并返回一个正确移除\
  \ `max_node` 的树。我们在这里依赖于 `max_node` 没有右子树这一事实。\n\n```cpp\nnode* remove_max_node\
  \ (node* p_tree, node* p_max_node) \n{\n    // 防御性编码--不应该到达这里\n    if ( p_tree ==\
  \ NULL )\n    {\n        return NULL;\n    }\n\n    // 我们找到了节点，现在它可以可以被替换了\n   \
  \ if ( p_tree == p_max_node )\n    {\n        // 我们之所以能这样做是因为我们知道\n        // p_max_node->p_right\
  \ 是 NULL，所以我们不会丢失\n        // 任何信息。如果 p_max_node 没有左子树，\n        // 我们就直接从分支返回 NULL，这\n\
  \        // 将导致 p_max_node 被替换为空树，\n        // 这正是我们想要的结果。\n        return p_max_node->p_left;\n\
  \    }\n\n    // 每一个递归调用都会将右子树替换为\n    // 不包含 p_max_node 的新树\n    p_tree->p_right\
  \ = remove_max_node( p_tree->p_right, p_max_node );\n    return p_tree;\n}\n```\n\
  \n使用该辅助函数，现在可以很容易修改我们的 `remove` 函数，使得在被移除的节点被 `max_node` 替换之前，`max_node` 可以从左子树中移除。\n\
  \n```cpp\nnode* remove (node* p_tree, int key)\n{\n    if ( p_tree == NULL )\n \
  \   {\n        return NULL;\n    }\n    if ( p_tree->key_value == key )\n    {\n\
  \        // 前两种情况将处理没有或只有一个孩子的情况\n        if ( p_tree->p_left == NULL )\n      \
  \  {\n            node* p_right_subtree = p_tree->p_right;\n            delete p_tree;\n\
  \            // 如果没有孩子节点，这可能会返回 NULL\n            // 但那正是我们想要的结果\n            return\
  \ p_right_subtree;\n        }\n        if ( p_tree->p_right == NULL )\n        {\n\
  \            node* p_left_subtree = p_tree->p_left;\n            delete p_tree;\n\
  \            // 这总是返回一个有效节点，因为我们从\n            // 上一个 if 语句知道它不是 NULL\n        \
  \    return p_left_subtree;\n        }\n        node* p_max_node = find_max( p_tree->p_left\
  \ );\n        // 因为 p_max_node 来自左子树，它必须在\n        // 子树从子树重新连接回树的其余部分之前\n     \
  \   // 从该子树中被移除\n        p_max_node->p_left = remove_max_node( p_tree->p_left, p_max_node\
  \ );\n        p_max_node->p_right = p_tree->p_right;\n        delete p_tree;\n \
  \       return p_max_node;\n    }\n    else if ( key < p_tree->key_value )\n   \
  \ {\n        p_tree->p_left = remove( p_tree->p_left, key );\n    }\n    else\n\
  \    {\n        p_tree->p_right = remove( p_tree->p_right, key );\n    }\n    return\
  \ p_tree;\n}\n```\n\n使用我们的示例树，这段代码将执行以下操作：\n```\n10\n6 14\n5 8 11 18\n```\n如果移除\
  \ `10`，`remove` 函数会立即命中 `found` 函数；它发现左右两侧都有子树，这意味着它发现具有最大值的节点在子树 `6` 中。然后，节点 `8`\
  \ 和其左子树将被连接到子树 `6`，只要它其中不包含 `8` 即可。移除 `8` 是很容易的；我们从一个子树开始：\n```\n6\n5 8\n```\n第一次\
  \ `remove_max_node` 调用会发现 `6` 不是要移除的节点，因此它在子树 `8` 上被递归调用。我们正在寻找节点 `8`，因此其左侧的子树 `NULL`\
  \ 被返回，`6` 的右指针被修改为指向 `NULL`。现在我们有了这棵树：\n```\n6\n5\n```\n在 `remove` 调用中，`remove_max_node`\
  \ 返回的树现在设置在 `8` 的左指针上，使得树变为：\n```\n8\n6 5\n```\n最后，`8` 的右指针被设置为右子树 `14`，树被重建：\n\
  ```\n8\n6 14\n5 11 18\n```\n并且原始的 `10` 节点被释放。\n\n### 二叉树在现实世界中的应用\n\n### 特定值\n通常，你会遇到两种情况。通常，你会遇到两种情况。例如，你需要一个\
  \ `map`。在某些情况下，检查用户名需要非常快。二叉树可以用于这种，因为这样不会让用户名变慢。当用户注册时，需要一个 `map`。在某些情况下，用户注册需要一个\
  \ `map`。在处理用户名时，这会变得快得多。\n\n### 映射\n映射随处可见。例如，信用卡公司。他们需要一个 `map`。当进行购买时，账户余额需要被更改。世界上有数百万张信用卡，扫描这些数字会使商业瘫痪。这种想法是，给定一个卡号，检查账户余额应该非常快。假设你有一百万张卡号；使用平衡树，查找将查看\
  \ `log21000000`节点，大约是 `20`。这比线性扫描快 50000 倍。\n\n显然，信用卡公司将拥有比我们看过的树更复杂且先进的数据结构。首先，信息必须存储在数据库而不是内存中。它们还有比\
  \ `map` 复杂得结构。主要点是二叉树和 `map` 是构建更大更好结构的构建块。接下来，我们将 STL，即标准模板库。\n\n\n\n\n-   A. 它们并没有那么快；双指针意味着在遍历树时需要完成更多工作\n\
  -   B. 每个节点有一对子树，其创建基于子树中的项是小于还是大于当前节点的值。\n-   C. 它们并不比链表更好。\n-   D. 二叉树上的递归调用比在链表上的循环更快。\n\
  \n## 标准模板库\n\n能够自己编写数据结构是一件很好的事情，但正如你可能已经意识到的，这并不常见。不过，你并不是无故学习这些内容的——当你需要构建数据结构时，你应该已经了关于构建数据结构的很多知识，以及在编写数据结构有意义时可能需要的一些常用结构。\n\
  \n然而，C++ 有一个非常酷炫的特性：一个可以重复使用的巨大代码库。它被称为标准模板库（Standard Template Library），简称 `STL`，它包含了常见的数据结构，包括基于二叉树和链表构建的结构。这些结构允许你在创建时指定它们将存储的数据类型，因此它们可以用于任何地方——结构化数据、字符串、整数等。\n\
  \n因为你拥有这种灵活性，`STL` 在很多情况下可以消除你自己构建结构的需求。事实上，使用它可以从以下方面提升你的代码水平：\n\n1.  你可以开始根据所需的结构来思考你的代码，而不是必须思考如何构建和实现它们。\n\
  2.  你可以免费且方便地访问最好的数据结构实现，并且其空间使用和性能已针对大多数问题进行了优化。\n3.  你不再需要为你的数据结构内存内存分配和释放。\n\n\
  然而，正如使用任何东西一样，使用库也伴随着其权衡：\n\n1.  你需要学习 `STL` 接口以及应该如何使用它们。\n2.  当你在使用 `STL` 时遇到编译器错误时，这些错误极其难以阅读和理解。\n\
  3.  你不会在库中找到所有的数据结构。\n\n我无法涵盖 `STL` 的整个主题——那本身就是一本书了——所以我能做的就是为你概述你将从 `STL` 中使用的最常用的数据结构。\n\
  \n### Vectors（向量）\n\n`STL` 中包含一种数组的替代品——`vector`。它非常像数组，但它是自动调整大小的；你不再需要担心分配内存和移动其他元素。然而，vector\
  \ 的语法与标准数组不同。\n\n数组的语法是：\n\n```cpp\nint an_array[ 10 ];\n```\n\n而 vector 的语法是：\n\
  \n```cpp\n#include <vector>\n\nusing namespace std;\n\nvector<int> a_vector( 10\
  \ );\n```\n\n首先，最明显的一点是必须包含 `vector` 头文件以及 `std` 命名空间。这是因为像 `cout` 和 `cin` 一样，`vector`\
  \ 是标准库的一部分。\n\n其次，在声明 vector 时，必须提供存储在 vector 中的数据类型，这是通过角括号`<>` 完成的：\n\n```cpp\n\
  Vector<int>\n```\n\n这使用了 C++ 的一种名为模板（templates）的特性。`Vector` 代码的编写方式允许存储任何数据类型——你只需要告诉编译器\
  \ vector 正在存储什么类型即可。这实际上意味着我们这里有两个类型——数据结构类型（它决定了数据组织的方式）以及在数据结构中存放的数据类型。使用模板允许你在数据结构内部将不同的数据结构类型与不同的数据类型结合。\n\
  \n最后，当提供 vector 大小时，必须将其放在圆括号而不是括号：\n\n```cpp\nvector<int> a_vector( 10 );\n```\n\
  \n这是用于某些变量种类初始化的语法。为此，值 `10` 被传递给初始化过程（称为构造函数），它设置了大小为十的 vector。随着我们对指南的进行，你将学习构造函数以及拥有构造函数的对象。\n\
  \n一旦创建了 vector，就可以像数组一样访问单个元素：\n\n```cpp\nfor ( int i = 0; i < 10; i++ )\n{\n  \
  \  a_vector[ i ] = 0;\n    an_array[ i ] = 0;\n}\n```\n\n### 在 Vector 上调用方法\n\n\
  vector 为你提供的远比数组的功能多。你可以做许多事情，例如在 vector 的末尾之外添加元素。vector 提供了函数来帮助这类事情，但函数的语法与我们之前使用的语法不同。\n\
  \nvector 将使用 C++ 的一种名为方法（method）的特性。这是你用数据类型声明的函数，调用方法需要新的语法，例如这个示例：\n\n```cpp\n\
  a_vector.size();\n```\n\n这是在 `a_vector` 上调用方法 `size` 并它返回该大小。这非常像访问结构体字段，但你是在调用一个与结构体相关的方法。虽然方法正在对\
  \ `a_vector` 执行某些操作，但不需要将 `a_vector` 作为参数传递给方法。语法已经知道 `a_vector` 将作为隐含参数传递给 `size`\
  \ 方法。\n\n下面的语法\n\n```cpp\n<variable>.<function call>( <args> );\n```\n\n可以被看作调用一个与该变量类型相关的函数。换句话说，它有点像编写：\n\
  \n```cpp\n<function call>( <variable>, <args> );\n```\n\n在示例中：\n\n```cpp\na_vector.size();\n\
  ```\n\n它就像：\n\n```cpp\nsize( a_vector );\n```\n\n在接下来的几个章节中，我们将讨论更多方法，包括声明和使用它们的方法。现在，你只需要理解\
  \ vector 上有几种可以调用的方法就足够了。正确的语法是实现它的唯一途径。\n\n### 其他 Vector 特性\n\nvector 还让你非常容易增加持有的项目数量，而无需分配内存。例如，向\
  \ vector 添加项目将写写如下：\n\n```cpp\na_vector.push_back( 10 );\n```\n\n这将在 vector 的末尾添加另一个\
  \ 10 的项。vector 将处理大小调整。如果你想对数组执行此操作，必须分配内存、复制值并添加新项。虽然 vector 确实会进行内存分配和复制，但它是智能地执行——这样它就不需要每次添加项时都调整大小。\n\
  \n然而，尽管你可以使用 `push_back` 向 vector 添加项目，但单独使用括号是不一样的。括号让你只处理已分配的数据，这主要是为了确保不会在你不不知情的情况下进行内存分配。\n\
  \n所以，写像像这样的代码：\n\n```cpp\nvector<int> a_vector( 10 );\na_vector[ 10 ] = 10; // 最后一个有效元素是\
  \ 9\n```\n\n将无法运行，并且可能导致程序崩溃。更不用说，这是危险的。这样写：\n\n```cpp\nvector<int> a_vector( 10\
  \ );\na_vector.push_back( 10 );\n```\n\n是可以的。\n\n### Maps（映射）\n\n我们稍时候提到了 map——使用一个值来查找另一个值。这在编程中很常见——也许当你想要实现一个电子邮箱地址录（通过名称查找地址），或者在一个通过账户号码查找账户的程序中，或者让用户登录他们的游戏。\n\
  \n`STL` 为我们提供了一个 `map` 类型，让我们指定键类型和值。一个示例是存储电子邮箱地址录的数据结构；可以像这样实现：\n\n```cpp\n#include\
  \ <map>\n#include <string>\n\nusing namespace std;\n\nmap<string, string> name_to_email;\n\
  ```\n\n我们必须告诉结构体有两个类型——用于键的 `string` 以及另一个 `string` 用于值（在本例中是电子邮箱地址）。\n\n这些 map\
  \ 的良好特性之一是当使用 map 时，语法也可以像数组一样使用。如果你想添加值，它非常像数组，只是使用了键类型而不是整数。\n\n\n\n```cpp\nname_to_email[\
  \ \"Billy Bunter\" ] = \"billybunter@thisemailaddress.com\";\n```\n\n从 map 中获取值也是相似的：\n\
  \n```cpp\ncout << name_to_email[ \"Billy Bunter\" ];\n```\n\n它具有数组的简单性，但又能够存储你想要的任何类型。更棒的是，与\
  \ vector 不同，map 的大小不需要在使用 ` `[] ` 运算符添加元素之前进行设置。\n\n从 map 中删除项同样轻而易举。假设你和 Billy\
  \ Bunter 闹翻了，想从你的地址通讯录中删掉他。我们使用 `erase` 方法来操作：\n\n```cpp\nname_to_email.erase( “Billy\
  \ Bunter” );\n```\n\n你可以使用 `size()` 方法来检查 map 的大小：\n\n```cpp\nname_to_address.size();\n\
  ```\n\n使用 `empty()` 方法可以查看 map 是否为空：\n\n```cpp\nif ( name_to_address.empty() )\n\
  {\n    cout << \"通讯录是空的。我打赌你真后悔没删掉 Billy。\";\n}\n```\n\n不要将此与使用 `clear()` 方法清空 map\
  \ 的方式混淆：\n\n```cpp\nname_to_address.clear();\n```\n\n而且，由于 STL 中命名规范的一致性，相同的方法也可以用于\
  \ vector。\n\n### 迭代器 (Iterators)\n\n除了数据存储和逐个访问元素的能力外，你还可以遍历数据结构中的所有项。对于数组或 vector，这只是使用数组长度读取每个元素的情况。对于\
  \ map 来说，由于它们既有数值键也有非数值键，你并不能总是使用计数变量进行迭代。\n\n为了解决这个问题，STL 为我们提供了 `iterator`（迭代器），它是一个允许你顺序访问数据结构中元素的变量，即使该数据结构通常没有很好的实现方式。我们将首先查看如何在\
  \ vector 中使用迭代器，然后移动到在 map 元素中使用迭代器。其原理是迭代器将存储结构中的位置，这样你就可以使用该位置来访问元素。然后你调用迭代器上的方法移动到下一个元素。\n\
  \n声明迭代器需要一些特殊的语法。对于整数型 vector，它看起来像这样：\n\n```cpp\nvector<int>::iterator\n```\n\n\
  这句话的意思是，你有一个 vector，并且想要一个适用于特定类型的迭代器，这就是为什么我们使用 `::iterator`。因为迭代器标记了结构中的位置，因此是从数据结构中请求迭代器：\n\
  \n```cpp\nvector vec;\nvector<int> vec;\nvec.push_back( 1 );\nvec.push_back( 2 );\n\
  vector<int>::iterator itr = vec.begin();\n```\n\n`begin` 方法调用将返回一个允许你访问 vector 第一个元素的迭代器。\n\
  \n迭代器可以被认为类似于指针——你可以谈论结构中的元素位置，或者使用它来获取元素。在我们的案例中，我们使用这种语法读取 vector 的第一个元素：\n\n\
  ```cpp\ncout << *itr; // 输出 vector 的第一个元素\n```\n\n我们使用 `*` 运算符的方式与指针相同；考虑到两者都存储了位置，这是合理的。\n\
  \n如果你想要下一个元素，则对迭代器进行增：\n\n```cpp\nitr++; \n```\n\n这让迭代器知道它应该移动到下一个元素。\n\n也可以使用前缀运算符：\n\
  \n```cpp\n++itr;\n```\n\n你可以通过与迭代器和结束迭代器进行比较来判断是否已到达末尾；要这样做，我们调用：\n\n```cpp\nvec.end();\n\
  ```\n\n如果你想要能够遍历整个 vector 的代码，它看起来像这样：\n\n```cpp\nfor ( vector<int>::iterator itr\
  \ = vec.begin(); itr != vec.end(); ++itr )\n{\n    cout << *itr << endl;\n}\n```\n\
  \n这句话的意思是创建一个迭代器，并从给定的整数 vector 中获取第一个元素。只要迭代器不等于结束迭代，就继续迭代。但我们不想在循环的每次都调用 `vec.end()`：\n\
  \n```cpp\nvector<int>::iterator end = vec.end();\nfor ( vector<int>::iterator itr\
  \ = vec.begin(); itr != end; ++itr )\n{\n    cout << *itr << endl;\n}\n```\n\n你也可以在\
  \ for 循环的第一部分添加几个变量，这会让代码更易读一些：\n\n```cpp\nfor ( vector<int>::iterator itr = vec.begin(),\
  \ end = vec.end(); itr != end; ++itr )\n{\n    cout << *itr << endl;\n}\n```\n\n\
  我们可以使用非常相似的方法遍历 map，但请记住 map 并不存储单个值；它存储的是键/值对。当你对迭代器进行解引用时，它有两个字段——一个用于键，一个用于值：\n\
  \n```cpp\nint key = itr->first; // 从迭代器获取键\nint value = itr->second; // 从迭代器获取值\n\
  ```\n\n下面的代码将以整洁、易读的格式显示 map 内容：\n\n```cpp\nvoid displayMap (map<string, string>\
  \ map_to_print)\n{\n    for ( map<string, string>::iterator itr = map_to_print.begin(),\
  \ end = map_to_print.end(); itr != end; ++itr )\n    {\n        cout << itr->first\
  \ << \" --> \" << itr->second << endl;\n    }\n}\n```\n\n\n\n构建这样一树需要一种原始数据结构，你不能仅仅使用\
  \ map。如果你只有 `STL`，在处理这个问题上会很吃力，但一旦你理解了递归和二叉树，就会变得简单得多。\n\n在下一节中，我们将深入探讨字符串。\n\n\
  ## 验 16\n\n什么时候使用 `vector` 是适当的？\n\nA. 当你需要在存储的键和值之间建立关联时\n\nB. 当你切换到项目集合并需要最大化性能时\n\
  \nC. 当你不想担心更新数据结构时涉及的细节时\n\nD. `vector` 在任何时候都是合适的\n\n如何一次性删除 map 中的所有项？\n\nA. 你将项设置为空字符串\n\
  \nB. 调用 `erase`\n\nC. 调用 `empty`\n\nD. 调用 `clear`\n\n你什么时候应该自己实现一种数据结构？\n\nA. 当你需要一个极其快速的东西时\n\
  \nB. 当你需要一个更健壮一点的东西时\n\nC. 当你需要利用数据的原始结构时，例如当你构建表达式树时\n\nD. 你可能永远不会实现自己的数据结构\n\n\
  以下哪项是声明可以与 `vector` 一的迭代器的正确方式？\n\nA. `iterator<int> itr;`\n\nB. `vector::iterator\
  \ itr;`\n\nC. `vector<int>::iterator itr;`\n\nD. `vector<int>::iterator<int> itr;`\n\
  \n以下哪项将访问 map 迭代器当前所在的元素键值？\n\nA. `itr.first`\n\nB. `itr->first`\n\nC. `itr->key`\n\
  \nD. `itr.key`\n\n如何判断一个迭代器是否可以使用？\n\nA. 你将其与 `NULL` 比较\n\nB. 你将其与对迭代容器调用 `end()`\
  \ 的结果进行比较\n\nC. 你将其与 `0` 进行检查\n\nD. 你将其与对迭代容器调用 `begin()` 的结果进行比较\n\n## 我们来聊聊字符串\n\
  \n如果你成功完成了最后几节并完全理解了所有内容，做得好。对于这一节，我们将暂停学习新的数据结构，回到一个你已经见过的结构——字符串。\n\n它们可能是一种非常简单的数据结构，但字符串无处不在。事实上，有些程序专门为了读取和修改字符串而编写。你通常会希望读取字符串以便将其显示给程序用户，但有时你也希望从字符串中获取某些含义。例如，你可能需要字符串中的某个特定值以便实现搜索函数。你可能想为文本游戏设计一个接口，实现高分列表或读取某些用逗号分隔的表格数据。\n\
  \n网络浏览器可能是每天使用的最常见的应用程序，它基本上只是一个巨大的 HTML 页面字符串处理器。所有这些以及更多功能都要求你对字符串进行的操作，而不仅仅是读取和打印它。\n\
  \n字符串也可以变得很大；在内存中持有许多字符，这意味着我们可以使用最近学到的某些特性，特别是引用，来创建高效的程序，即使在在函数之间传递字符串时也是如此。在这一节中，我们将查看可以用于字符串的不同操作，并查看在使用这些操作时如何你的程序以最佳速度运行的方法。\n\
  \n### 读取字符串\n\n有时，当你将字符串读取到程序时，你可能想读取整个字符串，而不是使用空格作为分隔符一次读取一个单词。一个名为 `getline` 的函数将帮助你做到这一点。该函数将一个输入流并从中读取指定的行文本。输入流的一个最佳示例之一是\
  \ `cin`，它是用于一次读取一个单词的。你可能感兴趣的是，`cin` 实际上是输入流类型的对象，而读取数据的方法是 `cin>>`。\n\n看一个简单的示例，显示从用户读取的一行：\n\
  \n```cpp\n#include <iostream>\n#include <string>\nusing namespace std;\n\nint main\
  \ ()\n{\nstring input;\ncout << \"Please input a line of text: \";\ngetline( cin,\
  \ input, '\\n' );\ncout << \"You typed in \" << '\\n' << input;\n}\n```\n\n这是将字符序列读取到字符串\
  \ `input` 中，直到遇到换行符——当用户按下回车键时。换行符被丢弃了，但如果你想在字符串中包含它，你就需要手动添加它。任何字符都可以作为指示读取停止的标记，你不必使用换行符。`getline`\
  \ 在用户按下回车键之前不会返回，但读取的文本仅到所指定的字符或分隔符为止。\n\n这里有一个读取 CSV 格式（逗号分隔值）文本的示例，这些数据看起来如下：\n\
  \n`Sonny, Jim, 40 Carrot Top Road, New York, New York, USA`\n\n每个数据段都用逗号分隔，因此我们需要一个程序来读取用户输入的\
  \ CSV 数据，使用这种格式存储游戏中的玩家列表：\n\n`<player first name>,<player last name>,<player class>`\n\
  \n稍后当你到达文件 I/O 节时，你可以修改此程序并从磁盘读取 CSV 文件；目前，我们将坚持读取用户输入的值。当第一个名字读取为空时，程序结束：\n\n```cpp\n\
  #include <iostream>\n#include <string>\nusing namespace std;\n\nint main ()\n{\n\
  while ( 1 )\n{\nstring first_name;\ngetline( cin, first_name, ',' );\nif ( first_name.size()\
  \ == 0 )\n{\nbreak;\n}\nstring last_name;\ngetline( cin, last_name, ',' );\nstring\
  \ player_class;\ngetline( cin, player_class, '\\n' );\ncout << first_name << \"\
  \ \" << last_name << \" is a \" << player_class << endl;\n}\n}\n```\n注意我们在字符串上使用了\
  \ `size()` 查看是否为空\n\n### 字符串长度与单个元素\n\n如果你想知道字符串的长度，请使用 `size` 或 `length` 函数。这些函数属于\
  \ `string` 类，它们都将返回字符串包含的字符数：\n\n```cpp\nstring my_string1 = \"ten chars.\";\nint\
  \ len = my_string1.length(); // 或 .size()\n```\n\n这两个方法之间没有区别，所以使用你熟悉的任何一个即可。\n\n\
  对字符串进行索引可以通过数字方式完成，就像我们处理数组一样。例如，遍历所有字符是可能的，使用索引像数组一样访问它们。如果你需要处理单个字符串字符，这非常棒，例如如果你正在寻找特定的字符，如逗号。重要的是使用长度函数来防止越界字符串边界，就像处理数组一样。\n\
  \n这里另一个示例展示了如何遍历字符串以便显示它：\n\n这是一个遍历字符串的小型示例：\n\n```cpp\nfor( int i = 0; i < my_string.length();\
  \ i++ )\n{\ncout << my_string[ i ];\n}\n```\n\n### 搜索与子字符串\n\n三种方法可以用于字符串的简单搜索和提取子字符串——`find()`、`rfind()`\
  \ 和 `substr()`。第一个 `find()` 将接受给定的子字符串和字符串中的位置，它将从给定位置开始搜索以找到第一个实例。结果将是两者之一——第一个实例索引或\
  \ `string::npos`（表示未找到子字符串的特殊整数值）。\n\n下面的代码显示了指定字符串内每个“dog”字符串的实例，并统计有多少实例：\n\n\
  ```cpp\n#include <iostream>\n#include <string>\nusing namespace std;\n\nint main\
  \ ()\n{\nstring input;\nint i = 0;\nint dog_appearances = 0;\ncout << \"Please input\
  \ a line of text: \";\ngetline( cin, input, '\\n' );\nfor ( i = input.find( \"dog\"\
  , 0 ); i != string::npos; i = input.find( \"dog\", i ) )\n{\ndog_appearances++;\n\
  i++;  // 跳过找到的最后一个实例，这样我们不会\n// 再次找到该字符串\n}\n}\n```\n\n\n\n\n```cpp\ncout << \"\
  The word dog appears \" << dog_appearances << \" in the string\" << '\"' << input\
  \ << '\"';\n}\n```\n\n如果你想从字符串的末尾开始查找子字符串，可以使用 `rfind()` 函数，其用法类似，但搜索方向是反的；即从给定的起点向后回，而不是向前。字符串匹配仍然是从左到右运行的，所以如果你使用\
  \ `rfind()` 来查找 `dog`，它不会匹配字符串 ‘god’。\n\n`substr()` 函数将创建一个全新的字符串，该字符串包含原始字符串中从指定位置开始、长度为指定的长度的片段：\n\
  \n```cpp\n// 示例原型\nstring substr (int position, int length);\n```\n\n例如，如果你想从字符串中提取前\
  \ 10 个字符的片段，你可以这样写：\n\n```cpp\n#include <iostream>\n#include <string>\n\nusing namespace\
  \ std;\n\nint main ()\n{\nstring my_string = \"abcdefghijklmnop\";\nstring first_ten_of_alphabet\
  \ = my_string.substr( 0, 10 );\ncout << \"The first ten letters of the alphabet\
  \ are \" << first_ten_of_alphabet;\n}\n```\n\n### 引用传递\n\n字符串可以很小，也可以非常大，并包含大量数据。通常，最佳实践是通过引用传递字符串参数：\n\
  \n```cpp\nvoid printString (string& str);\n```\n\n提醒一下，引用参数非常像指针——传递的不是字符串变量拷贝，而是原始对象的引用：\n\
  \n```cpp\nstring str_to_show = \"there is one x in this string\";\nprintString(\
  \ str_to_show );\n```\n\n在这里，`printString` 并没有复制名为 `str_to_show` 的变量，而是获取了变量地址，而\
  \ `str` 参数的使用方式就像原始字符串一样。\n\n传递引用确实有一个潜在的缺点；请记住引用将获取原始变量的地址，因此该变量可以被函数修改。在你编写第一个函数时，不太可能无意中这样做，但当你回来维护它（添加一些新功能）时，你必须不要忘记传入的变量是不能被修改的。\n\
  \nC++ 中有一种机制可以防止意外修改引用参数。函数可以指定该引用是常量，在 C++ 中我们有一个特殊的关键字来实现这一点——`const`。常量引用只能读取，不能修改：\n\
  \n```cpp\nvoid print_string (const string& str)\n{\ncout << str; // 合法，没有修改 str\n\
  str = \"abc\"; // 不合法！\n}\n```\n\n每当向函数添加引用参数时，你都应该仔细考虑是否想让函数修改该引用。如果你不想，请确保它被标记为\
  \ `const`——这样，函数就无法修改它。\n\n这不仅限于引用。同样的操作也可以对指针指向的内存进行。你可以这样做：\n\n```cpp\nvoid print_ptr\
  \ (const int* p_val) \n{\nif ( p_val == NULL ) // p_val 指向的内存未被修改\n{\nreturn;\n\
  }\ncout << *p_val; // 访问内存是好的\n*p_val = 20; // 这不对，p_val 指向的内存被修改了\np_val = NULL;\
  \ // 这是好的，没有修改内存，只修改了指针\n}\n```\n\n不要忘记；你的编译器非常聪明。它可以很容易地判断一个值是否被赋值给指针指向的内存。它不仅局限于查看指针是否被解引用，还能确切看到引用发生了什么。指针是可以修改的，因为指针的值已经被拷贝了。如果你更改了\
  \ `p_val`，它不会影响传入函数的变量。\n\n`const` 也可以用于记录某个特定变量不会改变，并强制执行这一规定。如果你尝试修改它，编译器将警告你。\n\
  \n当声明一个 `const` 变量时，必须立即赋值：\n\n```cpp\nconst int x = 4; // 这应该在变量创建时赋值\nx = 4; //\
  \ 这是不对的，因为 x 不能被修改。\n```\n\n在任何可以的地方使用 `const` 是良好的 C++ 风格。当你将变量声明为 `const` 时，你代码的其他部分将更容易阅读，因为没有人可以修改它——你知道该变量稍后不会改变。追踪该变量是否取了另一个值并不重要；这让你能够自由关注非常量变量以及它们是否被修改。而且这意味着你不会无意中修改该变量并改变代码的行为。\n\
  \n假设你有一段代码要求用户输入名和姓；会创建一个字符串来包含用户的全名，而存储全名的变量应该被声明为 `const`，因为它不应该以任何方式被修改。\n\n\
  ### 常量传播\n\n一旦变量被声明为 `const`，就没有办法将其通过引用传递给任何接受非常量引用的方法。你不能通过指针将其传递给任何接受非常量指针的方法，因为该方法可能会尝试使用指针来修改值。`const\
  \ X*` 与 `X*` 不是一种类型，而 `const X&`（声明为 `X` 的引用）与 `X&` 也不是一种类型。\n\n`X*` 可以转换为 `const\
  \ X*`，`X&` 可以转换为 `const X&`，但反之则不然。例如，如果你写像下面的方法，它将无法编译：\n\n```cpp\nvoid print_nonconst_val\
  \ (int& p_val)\n```\n\n\n\n\n\n```cpp\nitr != end;\n++itr )\n{\n    cout << itr->first\
  \ << \" --> \" << itr->second << endl;\n}\n}\n```\n\n但如果你这样做这样做，你得到的将是编译时产生的一大堆错误。为什么呢？因为当你将\
  \ `map` 设为 `const` 时，你实际上阻止了任何人修改任何元素。问题是，迭代器是允许进行修改的。\n\n你可以这样写：\n\n```cpp\nif\
  \ ( itr->first == \"Billy Bunter\" )\n{\n    itr->second = \"billybunter@thisemailaddress.com\"\
  \n}\n```\n\n来更改地址簿中的该地址。幸运的是，`STL` 也是对 `const` 友好的，每个 `STL` 容器都有一个特殊的迭代器——`const_iterator`。它的用法与标准迭代器相同，区别在于被迭代的容器不能通过向\
  \ `const_iterator` 写入数据来修改：\n\n```cpp\nvoid displayMap (const map<string, string>&\
  \ map_to_print)\n{\n    for ( map<string, string>::const_iterator itr = map_to_print.begin(),\n\
  \    end = map_to_print.end();\n    itr != end;\n    ++itr )\n    {\n        cout\
  \ << itr->first << \" --> \" << itr->second << endl;\n    }\n}\n```\n\n每当你遍历一个 `const`\
  \ 容器或者当需要迭代器访问数据但不需要修改容器时，必须使用 `const_iterator`。\n\n做一下测试，看看你的表现如何。在下一节中，我们将学习使用\
  \ `Code::Blocks` 进行调试。\n\n### 测验 17\n\n以下代码中哪 string 是有效的？\n\nA. `const int& x;`\n\
  B. `const int x = 3; int *p_int = & x;`\nC. `const int x = 12; const int *p_int\
  \ = & x;`\nD. `int x = 3; const int y = x; int& z = y;`\n\n以下哪些函数签名允许下面的代码段编译：\n\
  \n```cpp\nint x = 3; fun(x );\n```\n\nA. `void fun (int x);`\nB. `void fun (int&\
  \ x);`\nC. `void fun (const int& x);`\nD. `A and C`\n\n以下判断字符串搜索失败的最佳方法是：\n\nA.\
  \ 将结果位置与 `0` 比较\nB. 将结果位置与 `-1` 比较\nC. 将结果位置与 `string::npos` 比较\nD. 检查结果位置是否大于字符串长度\n\
  \n如何创建 `const STL` 容器的迭代器？\n\nA. 通过将迭代器声明为 `const`\nB. 通过使用索引而不是迭代器来遍历它\nC. 通过使用\
  \ `const_iterator`\nD. 将模板类型声明为 `const`\n\n## 使用 Code::Blocks 进行调试\n\n你已经学习了许多 `C++`\
  \ 程序的强大技术，但在程序中追踪错误（bugs）完全是另一回事，特别是当你的程序非常复杂时。这就是调试工具大显身场的地方。调试器允许你在程序运行时对其进行检查，让你轻松地看到底发生了什么。新程序员犯的最严重的错误之一就是避免学习如何使用调试器，因为他们认为没有必要。是的，在你的代码上使用调试器之前你必须学会如何使用它，但这段时间是完全值得的，因为它会在以后为你节省下大量的痛苦和辛水。\n\
  \n如果你使用 `Code::Blocks` 设置了环境，那么调试器已经安装好了。如果你使用的是其他的工具，不用担心，因为它们大体上都是样的。重要的是你拥有一个。\n\
  \n本节将介绍许多带有错误的程序，以便你能够看到它是如何运作的。我建议你开启一个新的 `Code::Blocks` 项目，这样你就可以跟随操作并看到它的运行过程。\n\
  \n下方的程序旨在计算利率。这些利率是按年复利的，并指定了金额。它包含错误，并将打印出错误的值：\n\n```cpp\n#include <iostream>\n\
  \nusing namespace std;\n\ndouble computeInterest (double base_val, double rate,\
  \ int years)\n{\n    double final_multiplier;\n    for ( int i = 0; i < years; i++\
  \ )\n    {\n        final_multiplier *= (1 + rate);\n    }\n    return base_val\
  \ * final_multiplier;\n}\n\nint main ()\n{\n    double base_val;\n    double rate;\n\
  \    int years;\n    cout << \"Input a base value: \";\n    cin >> base_val;\n \
  \   cout << \"Input an interest rate: \";\n    cin >> rate;\n    cout << \"Input\
  \ the number of years to compound: \";\n    cin >> years;\n    cout << \"After \"\
  \ << years << \" you will have \" << computeInterest(\n    base_val, rate, years\
  \ ) << \" money\" << endl;\n}\n```\n\n其结果是：\n\n```\nInput a base value: 100\nInput\
  \ an interest rate: .1\nInput the number of years to compound: 1\nAfter 1 you will\
  \ have 1.40619e-306 money\n```\n\n现在这个结果显然不好。1.40618e-306 绝对不是我们想要的金额。显然，代码中有一个错误。为了找到它，我们来使用调试器。\n\
  \n### 在 Code::Blocks 中进行调试\n\n虽然你已经学习了许多 `C++` 程序的强大技术，但要在程序中追踪错误是另一回事。为了追踪这个错误，我们需要设置断点，让程序在特定处暂停。\n\
  \n让我们在 `main` 函数的开始处设置一个断点，以便看到代码是如何执行的。\n\n```cpp\ndouble base_val;\n```\n\n将光标置于该行并按\
  \ `F5` 键（或点击 `Debug -> Toggle Breakpoint`）。侧边会出现一个红点，这表示设置了断点。现在我们可以开始调试了，点击 `Debug\
  \ -> Start` 或按 `F8`。程序现在将正常执行，直到遇到断点，在这种情况下会在非常早的地方。调试器将打开，你会在红点下方看到一个小黄色三角形。这告诉你下一步将执行哪一行。\n\
  \n还有一个名为 `Watches` 的窗口——找到它，它可能被隐藏了。这个窗口显示所有当前可用变量、局部变量或函数参数，你可以看到它们的值。这些值现在看起来完全是混乱，但那是因为它们还没有初始化——这很快就会进行。我们需要调试器移动到下一个可执行行，所以按\
  \ `F7` 键。这将执行带有黄色三角形的行，`cout` 语句将被运行；屏幕上输出一条请求输入值的消息。不要尝试输入任何内容，这无效，因为程序正处于调试状态。\n\
  \n再次按 `F7`，程序将等待用户输入——`cin` 函数尚未返回，因为首先需要用户输入。输入 `100` 以匹配错误报告，然后对后两个变量执行相同的操作，之前的值——利率为\
  \ `.1`，复利年数为 `1`。\n\n现在我们到了这行代码：\n\n```cpp\ncout << \"After \" << years << \" you\
  \ will have \" << computeInterest(\nbase_val, rate, years ) << \" money\" << endl;\n\
  ```\n\n我们需要检查输入是否被正确处理，所以查看 `Watch` 窗口并查看局部变量的值。\n\n\n\n\n到目前为止，一切看起来都是正确的。`base`\
  \ 为 `100`，`rate` 为 `.1`，`years` 为 `1`。等等！`Rate` 并不是 `.1`，而是 `.1000000000000001`，但这只是浮点数的特性。它们并不是完全精确的，但由于差异非常微小，这其实并不重要。\n\
  \n好了，到目前为止一切正常。现在我们想看看 `computeInterest` 函数内部发生了什么。在这里我们需要另一个调试器命令，称为“单步跳”（step\
  \ into）。它将进入当前行将要调用的函数，当你想在函数内部进行调试时就会使用它。这就是我们要做的，单进入 `computeInterest`。但等一下，这一行包含了大量的函数调用：\n\
  \n```\ncout << \"After \" << years << \" you will have \" << computeInterest( base_val,\
  \ rate, years ) << \" money\" << endl;\n```\n\n全都是 `cout` 的调用吗？那里会发生什么呢？嗯，调试器足够聪明，知道不要进入标准库中的任何函数。它只会直接进入\
  \ `computeInterest`，所以我们现在就过去。\n\n要做的第一件事是验证参数是否正确——我们可能把它们弄混了。进入 Watch（观察）窗口并展开函数参数（Function\
  \ arguments）部分。它们看起来应该是正确的。\n\n对局部变量（local variables）进行同样的操作，你就会发现一个问题。`final_multiplier`\
  \ 和 `i` 看起来都不太妙。不过记住，我们之前看过了，这些值之所以非常疯狂是因为它们还没有初始化。如果你按下 `F7`，循环的初始化将被执行。现在操作试试看看发生了什么。再次检查变量；`i`\
  \ 看起来正常，但 `final_multiplier` 还是有些不对——它没有被正确初始化。\n\n此外，我们当前所在的代码行即将要使用那个变量：\n\n```\n\
  final_multiplier *= (1 + rate);\n```\n\n这一行的意思是我们应该计算 `final_multiplier * (1 + rate)`，然后将结果赋值给\
  \ `final_multiplier`。问题是 `final_multiplier` 是错误的，所以我们会从操作中得到一个虚假的值。\n\n你能看出应该如何修复它吗？\n\
  \n`final_multiplier` 必须在声明它的代码行上进行初始化，并初始化为 `1`。修复它后，一切都会正常运行。\n\n### 调试崩溃（Debugging\
  \ Crashes）\n\n你会遇到的另一种 bug 是崩溃，对于新初学者来说，这些通常非常可怕，因为它们看起来有点极端。随着时间的推移，这些将成为你最喜欢的调试对象，因为你将确切知道问题发生在哪里。坏数据会导致崩溃，程序可以在崩溃崩溃点停止，这样你就可以找出问题是什么以及源于哪里。\n\
  \n下面是一个在链表中创建节点的简单程序，并打印列表的每个值：\n\n```cpp\n#include <iostream>\n\nusing namespace\
  \ std;\n\nstruct LinkedList\n{\n    int val;\n    LinkedList *next;\n};\n\nvoid\
  \ printList (const LinkedList *lst)\n{\n    if ( lst != NULL )\n    {\n        cout\
  \ << lst->val;\n        cout << \"\\n\";\n        printList( lst->next );\n    }\n\
  }\n\nint main ()\n{\n    LinkedList *lst;\n    lst = new LinkedList;\n    lst->val\
  \ = 10;\n    lst->next = new LinkedList;\n    lst->next->val = 11;\n    printList(\
  \ lst );\n    return 0;\n}\n```\n\n当运行这个程序时，它无法正常工作。它会发生两种情况之一——崩溃，或者进入无限循环，告诉我们那里出了问题。我们需要在调试器中运行代码以找出原因。\n\
  \n按下 `F8`，调试器几乎会立即弹出一个消息。这告诉你发生了段错误（Segmentation Fault，或简称 segfault），这是由于使用了无效指针导致的。基本上，程序尝试对一个无效指针或\
  \ `NULL` 指针进行解引用。发生的情况是程序试图进入它没有访问权限的内存。\n\n我们该如何查出无效指针是从哪里来的呢？调试器会在程序崩溃的那一行断下。点击该消息框中的\
  \ OK，并在崩溃的代码行上寻找黄色箭头（指针）：\n\n```cpp\ncout << lst->val;\n```\n\n这一行有一个名为 `lst` 的指针。进入\
  \ Watch（观察）窗口查看 `lst` 的值。你应该会看到一个值为 `oxbadfood` 的值，这是编译器在分配内存时用于初始化内存的特殊值。它只在程序运行调试器运行时被使用，这就是为什么你经常看到的行为与在调试器之外看到的有所不同。调试器会使用一个一致的值，如果访问了它，就会导致段错误；这样，如果使用了未初始化的指针，它们会立即显示。\n\
  \n我们现在知道 `lst` 没有被初始化，但为什么呢？我们这里可以使用调试器的另一个功能：调用栈（call stack）。它向你显示当前正在执行的所有函数，并有几列。`Nr`\
  \ 是引用每个栈帧的数字，而 `Address` 是函数地址。`Function` 是函数名和函数参数。如果你看，你会在调用栈中看到 `lst=oxbadfood`。还有文件和行号列，所以你可以轻松定位。\n\
  \n我们现在知道 `lst` 没有被初始化，但为什么呢？我们这里可以使用调试器的另一个功能：调用栈。它向你显示当前正在执行的所有函数，并有几列。`Nr` 是引用每个栈帧的数字，而\
  \ `Address` 是函数地址。`Function` 是函数名和函数参数。如果你看，你会在调用栈中看到 `lst=oxbadfood`。还有文件和行号列，所以你可以轻松定位。\n\
  \n我们现在知道 `lst` 没有被初始化，但为什么呢？我们这里可以使用调试器的另一个功能：调用栈。它向你显示当前正在执行的所有函数，并有几列。`Nr` 是引用每个栈帧的数字，而\
  \ `Address` 是函数地址。`Function` 是函数名和函数参数。如果你看，你会在调用栈中看到 `lst=oxbadfood`。还有文件和行号列，所以你可以轻松定位。\n\
