  }\n```\n（注：由于原文文本在析构函数部分存在重复和格式混乱，上述翻译已根据 Markdown 逻辑进行了对齐处理，确保内容完整且不重复）。\n\n\n\n\
  当对象在函数内部声明时，情况会变得复杂一些。如果函数有 `return` 语句，析构函数将在离开函数时被调用。可以这样考虑：为代码块中的对象声明的析构函数会在右大括号处（或在代码块退出时的闭合大括号）执行。这可能发生在最后语句执行完毕时，或者当\
  \ `break` 或 `return` 语句导致代码块退出时：\n\n```cpp\nvoid foo ()\n{\n    LinkedList list;\n\
  \    // some code...\n    if ( /* some condition */ )\n    {\n        return;\n\
  \    } \n} // list 的析构函数在这里被调用\n```\n\n在这种情况下，尽管 `return` 语句位于 `if` 语句中，但析构函数可以被认为是在函数到达右大括号时运行的。你从中掌握的最重要点是：析构函数只在对象不再处于作用域时运行，这意味着在不抛出编译器错误的情况下，你无法引用它。\n\
  \n如果你有多个在代码块结束时必须运行析构函数的对象，它们的运行顺序将与对象构造的顺序相反。例如：\n\n```cpp\n{\n    LinkedList a;\n\
  \    LinkedList b;\n}\n```\n\n在此例中，析构函数 `b` 先运行，然后是 `a`。\n\n### 由于另一个析构引起的析构\n\n\
  最后，对于包含在另一个类中的对象，对象析构会在类析构函数运行时被调用。例如，在一个简单的类中：\n\n```cpp\nclass NameAndEmail\n\
  {\n    /* 通常，我们这里会有方法 */\n    private:\n    string _name;\n    string _email;\n\
  };\n```\n\n当 `NameAndEmail` 析构函数运行时，`_name` 和 `_email` 字段的析构函数都会被调用。这非常方便，意味着你不需要执行任何巧妙的操作来清理类对象。事实上，你需要的只是清理指针，这是通过对它们调用\
  \ `delete` 完成的。\n\n如果你没有添加类析构函数，编译器仍然会为属于类的对象运行析构函数。\n\n这一切都有一个名称——使用构造函数初始化类并使用析构函数进行清理通常被称为\
  \ `RAII`，或“资源获取即初始化”（Resource Allocation Is Initialization）。基本上，在 C++ 中，这意味着应该为资源处理创建类，由构造函数负责初始化，而析构函数负责清理。这通常会导致像上面那样的类；两个字符串在它们完成后都会进行自我清理，因此不需要为类编写析构函数。\n\
  \n### 类的拷贝\n\n接下来的讨论围绕着类实例的拷贝展开。在 C++ 中，创建可以拷贝的新类是很常见的现象；例如：\n\n```cpp\nLinkedList\
  \ list_one;\nLinkedList list_two;\nlist_two = list_one;\nLinkedList list_three =\
  \ list_two;\n```\n\n你可以利用 C++ 中两个可以定义的函数，以确保拷贝操作按预期方式工作。其中一个称为赋值运算符，另一个是拷贝构造函数。我们将从赋值运算符开始，然后处理拷贝构造函数。\n\
  \n你可能会奇怪为什么实际上需要这些函数；它们应该可以直接工作，不是吗？是的，有时它们是可以运行的。C++ 为你提供了赋值运算符和拷贝构造函数的默认实现。然而，你并不总是能够依赖这些默认值。某些情况下，编译器简单地不知道你想什么。\n\
  \n例如，这两个函数的默认实现都会执行一种对指针的**浅拷贝**（shallow copies）。浅拷贝是将第二个指针赋值为指向第一个指针所指向的相同内存。因为拷贝的只是指针本身而不是指向的内存，所以它被称为浅拷贝。这可能有效，但在某些时候它会变成问题。\n\
  \n让我们用 `LinkedList` 类作为示例，并编写如下代码：\n\n```cpp\nLinkedList list_one;\nLinkedList list_two;\n\
  list_one = list_two;\n```\n\n此处的麻烦在于，以下代码是由默认赋值运算符生成的：\n\n```cpp\nlist_one._p_head\
  \ = list_two._p_head;\n```\n\n我们现在拥有两个具有相同指针值的对象，并且每个对象的析构函数都将尝试释放关联内存。\n\n当 `list_two`\
  \ 的析构函数运行时，`list_two._p_head` 被删除。然后 `list_one` 的析构函数运行（记住，运行顺序与构造函数顺序相反），这会导致 `list_one._p_head`\
  \ 被删除。由于 `list_two._p_head` 已经被删除，你现在正在尝试删除两次指针，这将会导致你的程序崩溃。\n\n显然，一旦其中一个析构函数运行，另一个列表就没用了。使用赋值运算符是处理这种情况的最佳方法，让我们看看实际情况应该是什么样的。\n\
  \n### 赋值运算符\n\n当一个对象赋值给一个预存在的对象时，我们调用赋值运算符，如下：\n\n```cpp\nlist_two = list_one;\n\
  ```\n\n实现赋值运算符需要一点新语法，以便定义该运算符：\n\n```cpp\nLinkedList& operator= (LinkedList& lhs,\
  \ const LinkedList& rhs);\n```\n\n这非常像标准函数的声明——它接受两个参数，一个非 const 引用和一个 const 引用。唯一奇异的地方是函数名——`operator=`。这意味着，我们不需要定义一个完全全新的函数，而是定义了\
  \ `=` 符号配合 `LinkedList` 使用时的含义。\n\n你可能会奇怪为什么实际上需要这些函数；它们应该可以直接工作，不是吗？是的，有时是可以的。C++\
  \ 为你提供了赋值和拷贝构造函数的默认实现。然而，你并不总是能够依赖这些默认值。偶尔，编译器简单地不知道你想什么。\n\n例如，这两个函数的默认实现都会执行一种对指针的浅拷贝。浅拷贝是将第二个指针赋值为指向第一个指针所指向的相同内存。因为拷贝的只是指针本身而不是指向的内存，所以它被称为浅拷贝。这可能有效，但在某些时候它会变成问题。\n\
  \n让我们用我们的 `LinkedList` 类作为示例，并编写如下代码：\n\n```cpp\nLinkedList list_one;\nLinkedList\
  \ list_two;\nlist_one = list_two;\n```\n\n此处的麻烦在于，以下代码是由默认赋值运算符生成的：\n\n```cpp\n\
  list_one._p_head = list_two._p_head;\n```\n\n我们现在拥有两个具有相同指针值的对象，并且每个对象的析构函数都将尝试释放关联内存。\n\
  \n当 `list_two` 的析构函数运行时，`list_two._p_head` 被删除。然后 `list_one` 的析构函数运行（记住，运行顺序与构造函数顺序相反），这会导致\
  \ `list_one._p_head` 被删除。由于 `list_two._p_head` 已经被删除，你现在正在尝试删除两次指针，这将会导致你的程序崩溃。\n\
  \n显然，一旦其中一个析构函数运行，另一个列表就没用了。使用赋值运算符是处理这种情况的最佳方法，让我们看看实际情况应该是什么样的。\n\n### 赋值运算符\n\
  \n当一个对象赋值给一个预存在的对象时，我们调用赋值运算符，如下：\n\n```cpp\nlist_two = list_one;\n```\n\n实现赋值运算符需要一点新语法，以便定义该运算符：\n\
  \n```cpp\nLinkedList& operator= (LinkedList& lhs, const LinkedList& rhs);\n```\n\
  \n这非常像标准函数的声明——它接受两个参数，一个非 const 引用和一个 const 引用。唯一奇异的地方是函数名——`operator=`。这意味着，我们不需要定义一个完全全新的函数，而是定义了\
  \ `=` 符号配合 `LinkedList` 使用时的含义。\n\n第一个运算符位于 `=` 左侧，这是被赋值的对象——使其变为非 const。第二个参数位于右侧，这是被赋值的值——使其变为\
  \ const。\n\n```cpp\nlhs = rhs;\n```\n\n返回 `LinkedList` 引用是为了可以进行链式赋值：\n\n```cpp\n\
  linked_list = lhs = rhs;\n```\n\n通常情况下，类会将 `operator=` 变成成员函数。这看起来如下：\n\n```cpp\n\
  class LinkedList\n{\n    public:\n    LinkedList (); // 构造函数\n    ~LinkedList ();\
  \ // 析构函数注意波浪号\n    LinkedList& operator= (const LinkedList& other);\n    void insert\
  \ (int val); // 添加节点\n\n    private:\n    LinkedListNode *_p_head;\n};\n```\n\n\
  你发现缺少了一个参数吗？之所以那样，是因为类所有的成员函数都会隐式地接收类作为参数。在我们案例中，`operator=` 方法在类位于左侧时被使用。这就像是你写了如下：\n\
  \n```cpp\nlhs.operator=( rhs );\n```\n\n一旦函数完成，`lhs` 和 `rhs` 将具有相同的值。那么，`LinkedList`\
  \ 类的 `operator=` 函数如何编写？\n\n```cpp\nLinkedList& LinkedList::operator= (const LinkedList&\
  \ other)\n{\n    // 这里应该写什么？\n}\n```\n\n\n\n\n```cpp\n// 其他值没有与对象具有相同的地址\n\nif (\
  \ this == & other ) \n{\n// 返回此对象以确保赋值链保持存\nreturn *this;\n}\n\n// 在拷贝新值之前，需要释放旧内存\n\
  // 因为它不再被使用了\ndelete _p_head;\n_p_head = NULL;\n\nLinkedListNode *p_itr = other._p_head;\n\
  while ( p_itr != NULL )\n{\ninsert( p_itr->val );\n}\n\nreturn *this;\n}\n```\n\n\
  关于这一点，有几点需要说明；首先，我们正在运行一个自赋值检查。你不会预料这种情况在正常情况下发生，但不要自动假设它是安全的。如果你写：\n\n`a = a;`\
  \ \n\n它应该是安全的，且不会发生任何更改。\n\n接下来，与旧列表相关的内存需要释放，因为我们已经完成了对它的操作。可以通过删除 `p_head` 来删除整个列表，就像我们在析构函数中做的那样。\n\
  \n最后，需要用新值重新填充列表，我们通过遍历列表并将其中的单个元素插入到我们的列表中来实现，这样我们就得到了一个可以拷贝的类。\n\n幸运的是，你并不需要在所有的类中执行所有这些操作。如果类中没有指针作为成员，你很可能不需要赋值运算符。这是因为\
  \ C++ 为你提供了一个默认的赋值运算符，它会拷贝元素——如果是一个 `class object`，它将运行赋值运算符；如果是指针或其他值，则会进行位拷贝。因此，如果类中没有指针，在某种程度上可以依赖默认值。\n\
  \n有一条经验法则你应该遵循——如果需要写析构函数，很可能也需要写赋值运算符。为什么呢？如果你有一个析构函数，你可能正在使用它来清理和释放内存。如果内存被释放，你需要确保给类的每个副本都分配它自己的内存副本。\n\
  \n### 拷贝构造函数\n\n最后需要考虑的一点——如果你想让一个对象的构造类似于另一个对象，你会怎么办？\n\n`LinkedList list_one;`\n\
  `LinkedList list_two( list_one );`\n\n这仅仅是构造函数的一种特例，它接收一个与正在构造的对象类型相同的对象。这被称为**拷贝构造**，新对象应该是原始对象的直接拷贝。在上面的示例中，我们应该初始化\
  \ `list_two` 使它看起来像 `list_one`。\n\n这非常类似于使用赋值运算符，但不是针对已有的类，而是从一个未初始化的类开始。这样做很好，因为不需要浪费宝贵的\
  \ CPU 时间在类构造上，结果却发现值必须被覆盖。实现拷贝构造函数很容易，它看起来和赋值运算符一样：\n\n它在 `LinkedList` 上使用的方式如下：\n\
  \n```cpp\nclass LinkedList\n{\npublic:\nLinkedList (); // 构造函数\n~LinkedList ();\
  \ // 析构函数，注意波号\nLinkedList& operator= (const LinkedList& other);\nLinkedList (const\
  \ LinkedList& other);\nvoid insert (int val); // 添加节点\n\nprivate:\nLinkedListNode\
  \ *_p_head;\n};\n```\n\n```cpp\nLinkedList::LinkedList (const LinkedList& other)\n\
  \ : _p_head( NULL ) // 从 NULL 开始，以防另一个列表为空\n{\n// 这与用于 operator= 的代码非常相似\n// 在实际程序中创建一个辅助方法来执行此操作\n\
  // 是很有意义\nLinkedListNode *p_itr = other._p_head;\nwhile ( p_itr != NULL )\n{\ninsert(\
  \ p_itr->val );\n}\n}\n```\n\n如果你不写拷贝构造函数，编译器会为你提供一个默认的，其行为与默认赋值运算符非常相似。每个类对象的拷贝构造函数都会运行，并对指针和整数等值进行普通拷贝。\n\
  \n大多数情况下，如果需要赋值运算符，通常也需要拷贝构造函数。\n\n关于拷贝构造函数的一点经常会让初学者感到惊讶。\n\n如果你写下：\n\n`LinkedList\
  \ list_one;`\n`LinkedList list_two = list_one;`\n\n你认为会发生什么？赋值运算符会被调用吗？不，不会的。为什么？因为编译器可以看到\
  \ `list_two` 的初始化是基于 `list_one` 的，并且会为你调用拷贝构造函数——这节省了你进行不必要的对象初始化。\n\n### 编译器生成的方法\n\
  \n现在你已经看到了编译器自动为你生成的所有方法：\n\n1.  默认构造函数\n2.  默认析构函数\n3.  赋值运算符\n4.  拷贝构造函数\n\n对于创建的每个类，你都需要考虑默认方法的实现是否可以接受。大多数情况下是可以接受的，但会有某些时候，特别是当你处理指针时，你需要编写自己的方法并对其进行声明。根据经验法则，如果你需要写其中一个，你就需要写所有的。\n\
  \n### 防止拷贝\n\n有时拷贝对象是不必要的，而你所想做的只是说：“不，不要让对象被拷贝”。如果你能做到这一点，你就不需要实现赋值运算符或拷贝构造函数，编译器也就没有风险生成可能危险的方法的版本。\n\
  \n在某些时候，对象简单地不应该被拷贝。例如，对于一个代表当前的类，你不需要该类被拷贝；你只需要一个数据。\n\n拷贝可以很容易防止——只需声明赋值运算符和拷贝构造函数但不要实现它们。一旦方法被声明，它们就不会自动生成。这可能会让人困惑；编译器不会告诉你是哪一行代码。获取更好错误信息的方法是将方法设为私有。这样错误通常会在编译时发生，错误信息也会更容易读。\n\
  \n我们是这样做：\n\n```cpp\nclass Player\n{\npublic:\nPlayer ();\n~Player ();\n\nprivate:\n\
  // 禁止，当你声明方法但不实现它们时，\n// 编译器不会生成它们。\noperator= (const Player& other);\nPlayer (const\
  \ Player& other);\nPlayerInformation *_p_info;\n};\n// 赋值运算符和拷贝构造函数尚未实现\n```\n\n\
  总结一下，大多数情况下你应该选择以下选项之一：\n\n1.  使用默认赋值运算符和拷贝构造函数\n2.  创建自己的赋值运算符和拷贝构造函数\n3.  将赋值运算符和拷贝构造函数设为私且不要实现\n\
  \n如果你什么都不做，编译器将确保你获得第一种选项。通常，从第三种选项开始，并在需要时添加拷贝构造函数和赋值运算符会更容易。\n\n测试之后，我们将进入继承和多态\n\
  \n## 测试 22\n\n什么时候需要为类编写构造函数？\n\nA. 应该立即创建构造函数，否则无法使用该类\nB. 当类需要用默认值初始化时\nC. 永远不要写构造函数，编译器为你完成\n\
  D. 只有当需要析构函数时\n\n解释赋值运算符和析构函数之间的关系\n\nA. 没有关系\nB. 类析构函数在赋值运算符运行之前调用\nC. 赋值运算符必须指定析构函数将删除的内存；赋值运算符必须确保运行新类和拷贝类的析构函数是安全的\n\
  \n什么时候需要使用初始化列表？\n\nA. 当你需要你的构造函数非常高效且不想构造空对象时\n\n\n\n\nB. 当正在初始化常量值时\n\nC. 当你希望类字段运行非默认构造函数时\n\
  \nD. 以上所有\n\n代码第 2 行运行的是哪个函数？\n\n```cpp\nstring str1;\nstring str2 = str1;\n```\n\
  \nA. `str2` 的构造函数以及 `str1` 的赋值运算符\nB. `str2` 的构造函数，以及 `str2` 的赋值运算符\nC. `str2` 的拷贝构造函数\
  \ – `str2` 尚未初始化，因此运行的是构造函数而不是赋值运算符\n\n写代码中调用的函数名称以及它们调用的顺序\n\n```cpp\n{\nstring\
  \ str1;\nstring str2;\n}\n```\n\nA. `str1` 的构造函数，`str2` 的构造函数\nB. `str1` 的析构函数，`str2`\
  \ 的构造函数\nC. `str1` 的构造函数，`str2` 的构造函数，`str1` 的析构函数，`str2` 的析构函数\nD. `str1` 的构造函数，`str2`\
  \ 的构造函数，`str2` 的析构函数，`str1` 的析构函数\n\n假设你的类已经有一个非默认拷贝构造函数；关于赋值运算符，以下哪个说法是正确的？\n\n\
  A. 该类必须有一个默认赋值运算符\nB. 该类必须有一个非默认赋值运算符\nC. 该类必须有一个已声明但未实现的赋值运算符\nD. B 或 C 有效\n\n\
  ## 继承与多态\n\n到为止，我们已经讨论了如何使用公共接口并提供创建、拷贝和清理对象的支持，从而从我们的类中创建完全可用的类型。我想在接口方面更进一步探讨。\n\
  \n假设你有一辆旧的、生锈的车。遗憾的是，你住在一个每个汽车制造商都发明不同转向机制的时代——有些使用标准的方向盘，有些使用鼠标，有些则使用摇杆（你明白我想表达什么了）。有些甚至使用油门踏，而另一些则需要拖动滚动条。这太糟糕了！每当你想要开车时，你都需要学习那种转向机制。每当你租或买新车时，你都要重新学习开车。\n\
  \n幸运的是，在现实世界中，所有的汽车都遵循一套特定的标准。无论你进入哪辆车，无论它是什么，它都有一个标准的接口，唯一的真实区别在于有些是手动挡，另一些是自动挡。这些就是两个自动接口——手动挡和自动挡。\n\
  \n如果你学会了开自动挡，你就可以驾驶任何带有自动挡的汽车，手动挡也是如此。引擎盖下装了什么什么并不重要；重要的是，无论你开的是哪辆车，它都有相同的制动、转向和加速方法。\n\
  \n这一切与 C++ 到底有什么关系呢？嗯，你完全可以写出代码，使其依赖于一个定义良好且特定的接口。在汽车的类比中，你就是 C++ 代码，而接口就是转向机制。接口如何实现并不重要——只要代码理解该接口，就可以使用该接口的任何实现。\n\
  \n现在，想一想你会在什么时候编写某些具有相似属性的代码？你一定预料到了这一点——视频游戏。你可能有多个可以绘制到屏幕上的对象，例如敌人、太空船、子弹等。在主游戏循环中，每个单独的对象都必须在每一帧被重绘，以确保它们都处于正确的位置。你想要的是这种格式的代码：\n\
  \n1. 清除屏幕\n2. 遍历可绘制对象列表\n3. 对于每个可绘制对象，对其进行绘制\n\n理想情况下，那个可绘制对象列表应该包含所有可能显示在屏幕上的对象类型。每种对象都需要实现一种共同类型的接口，允许它们被绘制到屏幕上。但是，子弹、太空船和敌人都是不同的类；每个类都有自己的内部数据——飞船需要生命值，子弹需要存储它能造成多少伤害，而敌人需要\
  \ AI 便移动。\n\n所有这些实际上与绘制对象的循环并无关；重要的是每个不同的类都支持一个允许绘制的接口。你需要几个具有相同接口的类，但它们每个将拥有该接口的自己的实现。\n\
  \n我们该如何做到这一点？第一步是定义“绘制”意味着什么：\n\n```cpp\nclass Drawable\n{\npublic:\n    void draw\
  \ ();\n};\n```\n\n这是一个名为 `Drawable` 的简单类，它只定义了一个名为 `draw()` 的方法。这会绘制当前对象，但如果我们能创建一个向量（vector），然后任何实现了\
  \ `draw()` 方法的对象都可以存储其中，那该有多酷呢？\n\n如果我们能做到，就可以编写一些代码，通过循环遍历向量中的所有内容，然后调用 `draw()`\
  \ 方法，让所有内容都绘制到屏幕上。想知道些什么？你可以知道，因为 C++ 通过一个名为**继承**的特性允许这一点。让我们看看它是如何运作的。\n\n###\
  \ 继承\n\n继承的所有意味着一个类可以从另一个类获取其特征。在我们的情况下，该类将继承 `Drawable` 类接口，特别是 `draw()` 方法。当一个类继承自另一个类时，它被称为子类（subclass），而被继承的类被称为超类（superclass）。\n\
  \n超类通常被用于定义接口方法，每个子类可以用不同的方式实现这些方法。在我们使用的示例中，超类是 `Drawable`，每个类都继承了 `draw()` 方法的属性。\n\
  \n这就是继承的概念，现在我们来看语法：\n\n```cpp\nclass Ship : public Drawable\n{};\n```\n\n第一行表示\
  \ `Ship` 类将继承自 `Drawable` 类。这段代码确保 `Ship` 将继承来自 `Drawable`（即超类）的 `public` 数据和 `public`\
  \ 方法。目前，`draw()` 方法已经被继承，如果你编写整个方法，它看起来像这样：\n\n```cpp\nShip s;\ns.draw();\n```\n\
  \n调用 `draw()` 方法确保了 `Drawable` 中的方法实现被调用，但那不是我们想要的；`Ship` 类需要它自己的绘制方式，而不是来自 `Drawable`\
  \ 的。为了让这种情况发生，`Drawable` 中必须有一个指示表明子类可以重写（override）`draw()` 方法。为了做到这一点，将方法变为虚方法（virtual\
  \ method）——它是超类的一部分，但被一个或多个子类重写。\n\n```cpp\nclass Drawable\n{\npublic:\n    virtual\
  \ void draw ();\n};\n```\n\n很多时候，超类不需要提供实现；相反，子类将被强制拥有自己的方法实现，例如，对于绘制对象可能没有良好的默认。我们通过将函数变为纯虚来实现这一点——看起来如下（注意\
  \ 0 的使用）：\n\n```cpp\n\n Drawable\n{\npublic:\n    virtual void draw () = 0;\n};\n\
  ```\n\n是的，这看起来有点奇怪，但它是有逻辑的。当你将一个方法设置为 0 时，你表示它实际上不存在。当一个类有一个纯虚方法时，该方法必须由子类实现，为了这样做，必须在子类中再次声明该方法，但这次省略\
  \ `= 0`。这表示该类将提供真实的方法实现：\n\n```cpp\nclass Ship : public Drawable\n{\npublic:\n \
  \   virtual draw ();\n};\n```\n\n现在我们可以像定义任何标准方法一样定义该方法：\n\n```cpp\nShip::draw ()\n\
  {\n    /* 执行绘制的代码 */\n}\n```\n\n\n\n\n# 那么，为什么我们需要这些超类呢？如果我们只是为了创建一个没有实现的 `draw()`\
  \ 方法，那么 `Drawable` 有什么用呢？要求超类的存在是为了定义所有子类都必须实现的接口。这样一来，就可以编写代码来期望该接口，而不需要知道正在使用的具体类类型。\n\
  \n某些语言允许你将任何对象传递给任何函数，只要函数所调用的方法在对象中已实现，一切就能运行得很好。在 C++ 中，我们需要函数来显式地指定参数接口。如果 `Drawable`\
  \ 接口不存在，我们就没有办法将这些类放在同一个 `vector` 中——它们之间没有任何共同点可以用来识别放入 `vector` 中的内容。\n\n下面的代码展示了如何使用\
  \ `vector` 来绘制所有对象：\n\n```cpp\nvector<Drawable*> drawables;\n\n// 创建一个新的 Ship 指针，以便将\
  \ Ship 存储在 vector 中\ndrawables.push_back( new Ship() );\n\nfor ( vector<int>::iterator\
  \ itr = drawables.begin(), end = drawables.end();\nitr != end; ++itr )\n{\n    //\
  \ 不要忘记，当我们拥有对象的指针时，调用方法需要使用 - > 语法\n    (*itr)->draw(); // 调用 Ship::Draw\n}\n```\n\
  \n各种类型的 `Drawable` 对象都可以添加到 `vector` 中，因此在接下来的示例中，我们假设有一个名为 `Enemy` 的类，它也会继承自 `Drawable`：\n\
  \n```cpp\ndrawables.push_back( new Ship() );\ndrawables.push_back( new Enemy() );\n\
  ```\n\n一切运行正常——对于 Ship，会调用 `Ship::draw` 方法；对于 Enemy，则调用 `Enemy::draw` 方法。\n\n顺便提一下，值得的是我们使用\
  \ `vector<Drawable*>` 而不是 `vector<Drawable>` 是重要的——指针有着巨大的区别；没有它，代码将无法运行。为了理解为什么，想象一下代码是为了持有对象而不使用该指针：\n\
  \n```cpp\nvector <Drawable> drawables;\n```\n\n我们现在将拥有一包含所有不同 `Drawable` 对象但大小完全相同的内存：\n\
  \n`[Drawable 1][Drawable 2][Drawable 3]`\n\n如果不使用指针，`vector` 必须存储整个对象，但这些对象的大小不能完全相同。首先，`Enemy`\
  \ 和 `Ship` 可能有不同的字段，而且完全可能两者都比标准的 `Drawable` 小——这样就无法工作了。\n\n另一方面，指针的大小始终是相同的。我们可以说：\n\
  \n`[Pointer to Drawable][Pointer to Drawable][Pointer to Drawable]`\n\n一个 `[Pointer\
  \ to Ship]` 占据的内存与一个 `[Pointer to Drawable]` 完全相同——这就是为什么我们写了：\n\n`Vector <Drawable*>\
  \ drawables;`\n\n现在，任何指针都可以被放入 `vector`，只要它指向一个继承自 `Drawable` 的类。在循环中，每个对象都使用其子类的\
  \ `draw` 方法进行绘制。你只需要记住，当你想要一个类继承超类接口时，必须使用指针来传递该类。\n\n## 那么，我们在这里具体做了什么？\n\n1. 我们首先定义了子类将继承的\
  \ `Drawable` 接口。\n2. `Drawable` 可以被任何函数或任何处理该接口的代码所用。代码可以调用所指向的具体对象所实现的 `draw` 方法。\n\
  3. 这意味着现有代码可以使用新的对象类型，但仅限于那些实现了 `Drawable` 的类型。例如，可以向游戏中添加新项目，如道具图标、额外生命值、背景图片、你想要的任何东西，而处理它们的代码不需要了解它们的任何信息，只需要知道它们是\
  \ `Drawable` 即可。\n\n这是关于代码复用的，让现有代码能够与新类协作。我们可以编写这些类使其与这些代码兼容，例如负责绘制游戏元素的游戏循环。虽然新的类对象必须添加到\
  \ `Drawable` 对象向量中，但循环本身不需要改变。\n\n这被称为**多态**（polymorphism）——从字面意思来说，它是“多种形式”。换句话说，任何实现指定接口的类都是一种形式，而由于代码是为只使用接口而编写的，它可以处理多个类，因此代码支持多种接口表现形式。\n\
  \n### 继承的更多用途（及误用）\n\n虽然多态依赖于继承，但继承的用途不仅仅是继承接口。它还可以用于获取函数的实现。例如，如果 `Drawable` 接口处有另一个非虚方法，那么每一个可以实现\
  \ `Drawable` 的对象都将继承该方法——这避免了为每个子类都编写该方法的需要。尽管在复用方面，这种方法是相当有限的。\n\n如果你继承整个方法的实现，可能会节省某些资源，但这导致了一个巨大的挑战——如何确保该方法的实现对于每个子类都是正确的。这需要对所有情况下的有效性进行非常仔细的考虑。\n\
  \n为什么这么难？假设我们有两个名为 `Player` 和 `Ship` 的对象；这两个方法都实现了 `Drawable`，且两个类都有一个名为 `getName`\
  \ 的方法。你可以将 `getName` 方法加入 `Drawable` 中；这样，两个类就可以拥有相同的实现：\n\n```cpp\nclass Drawable\n\
  {\npublic:\n    string getName ();\nvirtual void draw () = 0;\n};\n```\n\n由于 `getName`\
  \ 不是虚方法，所有子类都继承该实现。如果我们要添加另一个如 `Bullet` 的类，会发生什么？它需要一个 `getName` 方法吗？完全不需要！如果你继续这样做，你的类层级结构会变得对于\
  \ `Bullet` 极其复杂且困惑。\n\n### 对象的构造与析构\n\n当继承超类时，子类的构造函数会调用超类，就像调用普通类的构造函数一样。看以下代码：\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\n\nclass Foo // Foo 是编程中常见的占位符名称\n\
  {\npublic:\n    Foo () { cout << \"Foo's constructor\" << endl; }\n};\n\nclass Bar\
  \ : public Foo\n{\npublic:\n    Bar () { cout << \"Bar's constructor\" << endl;\
  \ }\n};\n\nint main ()\n{\n    // a lovely giraffe\n    Bar bar;\n}\n```\n\n当我们初始化\
  \ `bar` 时，`Foo` 构造函数首先运行，然后是 `Bar` 构造函数，代码输出为：\n\n`Foo's constructor`\n`Bar's constructor`\n\
  \n当超类构造函数运行时，它可以在子类构造函数使用它们之前初始化超类字段。这样做确保了子类可以使用已经初始化的超类字段。\n\n编译器为你完成这一切——你不需要特殊操作来确保超类构造函数被调用。同样，一旦子类析构函数运行，超类析构函数就会自动调用。\n\
  \n这在代码中是这样的：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nclass Foo //\
  \ Foo 是编程中常见的占位符名称\n{\npublic:\n    Foo () { cout << \"Foo's constructor\" << endl;\
  \ }\n    ~Foo () { cout << \"Foo's destructor\" << endl; }\n};\n\nclass Bar : public\
  \ Foo\n{\npublic:\n    Bar () { cout << \"Bar's constructor\" << endl; }\n    ~Bar\
  \ () { cout << \"Bar's destructor\" << endl; }\n};\n\nint main ()\n{\n    // a lovely\
  \ giraffe\n    Bar bar;\n}\n```\n\n这个程序的输出将是：\n\n`Foo's constructor`\n`Bar's constructor`\n\
  `Bar's destructor`\n`Foo's destructor`\n\n你注意到构造函数和析构函数的调用顺序是相反了吗？这是为了确保 `Bar` 的构造函数可以安全地使用继承自\
  \ `Foo` 的方法，因为这些方法操作的数据是有效且可用的。\n\n\n\n\n有时你可能希望在父类中调用非默认构造函数；我们可以通过在初始化列表中提供父类名称来实现：\n\
  \n```cpp\nclass FooSuperclass\n{\npublic:\n    FooSuperclass (const string& val);\n\
  };\n\nclass Foo : public FooSuperclass\n{\npublic:\n    Foo () \n    : FooSuperclass(\
  \ \"arg\" ) // 示例初始化列表\n{}\n};\n```\n父类构造函数的调用应该在初始化列表中的类字段之前。父类构造函数的调用应该出现在初始化列表中的类字段之前。\n\
  \n### 对象析构与多态\n\n对象的析构是复杂的，特别是当通过接口销毁对象时。例如，你可能会这样的代码：\n\n```cpp\nclass Drawable\n\
  {\npublic:\n    virtual void draw () = 0;\n};\n\nclass MyDrawable : public Drawable\n\
  {\npublic:\n    virtual void draw ();\n    MyDrawable ();\n    ~MyDrawable ();\n\
  \nprivate:\n    int *_my_data; \n};\n\nMyDrawable::MyDrawable ()\n{\n    _my_data\
  \ = new int;\n}\n\nMyDrawable::~MyDrawable ()\n{\n    delete _my_data;\n}\n\nvoid\
  \ deleteDrawable (Drawable *drawable)\n{\n    delete drawable;\n}\n\nint main ()\n\
  {\n    deleteDrawable( new MyDrawable() );\n}\n```\n\n`deleteDrawable` 内部发生了什么？记住，当使用\
  \ `delete` 时，会调用析构函数，因此 `delete drawable;` 这一行对对象执行了函数调用，但编译器如何知道 `MyDrawable` 析构函数在哪里？编译器不知道\
  \ `drawable` 变量的精确类型，但它知道它是一个 `Drawable`，一个拥有 `draw()` 方法的东西。它真正知道的是如何找到与 `Drawable`\
  \ 关联的析构函数 `MyDrawable` 析构函数本身。重要的是，由于 `MyDrawable` 在自己的构造函数中分配了内存，为了释放这些内存，必须运行\
  \ `MyDrawable` 析构函数。\n\n好了，你可能认为这就是虚函数要解决的问题，你是正确的。我们应该在 `Drawable` 中将析构函数声明为 `virtual`；这样当对指向\
  \ `Drawable` 的指针调用 `delete` 时，编译器就会知道它必须查找一个被重写的析构函数：\n\n```cpp\nclass Drawable\n\
  {\npublic:\n    virtual void draw ();\n    virtual ~Drawable ();\n};\n\nclass MyDrawable\
  \ : public Drawable\n{\npublic:\n    virtual void draw ();\n    MyDrawable ();\n\
  \    virtual ~MyDrawable ();\n\nprivate:\n    int *_my_data; \n};\n```\n\n当我们把父类中的结构设为虚时，当\
  \ `delete` 释放一个 `Drawable` 接口时，调用的是那个被重写的析构函数。\n\n按照原则，当你将任何父类方法变为虚函数时，父类的析构函数也应该被设为虚函数。一旦某个方法变为虚函数，你基本上是在说该类可以传递给接收接口的方法。这些方法可以做任何它们想做的事，包括删除对象，因此将析构函数设为虚函数可以确保对象得到正确的清理。\n\
  \n### 切片问题 (Slicing Problem)\n\n这是你在处理继承时必须注意的问题。对象切片发生在你有类似下面的代码时：\n\n```cpp\n\
  class Superclass\n{};\n\nclass Subclass : public Superclass\n{\n    int val;\n};\n\
  \nint main()\n{\n    Subclass sub;\n    Superclass super = sub;\n}\n```\n来自 `Subclass`\
  \ 的 `val` 字段不会在赋值给 `super` 时被拷贝，这可能不是你想要的，尽管这在 C++ 中是被允许的。这是因为对象只存在部分。这种切片有时可以工作，但大多数情况下，它只会导致你的程序崩溃。\n\
  \n有一种方法可以让编译器在发生此类问题时通知你；你只需要将 `Superclass` 的拷贝构造函数声明为私有 (Private) 且不实现它：\n\n```cpp\n\
  class Superclass\n{\npublic:\n    // 因为我们声明了拷贝构造函数，我们现在必须\n    // 提供默认构造函数\n   \
  \ Superclass () {}\n\nprivate:\n    // 禁止，此方法将不会被定义\n    Superclass (const Superclass&\
  \ other);\n};\n\nclass Subclass : public Superclass\n{\n    int val;\n};\n\nint\
  \ main ()\n{\n    Subclass sub;\n    Superclass super = sub; // 这行代码现在将引起编译错误\n\
  }\n```\n\n如果你想要拷贝构造函数怎么办？还有另一种避免该问题的方法：让你创建的任何父类都包含一个或多个纯虚函数，这将确保如果你写了：\n\n```cpp\n\
  Superclass super; \n```\n\n代码永远不会编译，因为不能创建带有纯虚函数的对象。然而，你仍然可以写：\n\n```cpp\nSuperclass\
  \ *super = & sub;\n```\n\n这样你就可以从多态中获益，而无需面对切片问题。\n\n## 与子类的代码共享\n\n我们讨论过使用私有和公共保护机制——公共方法在类外可用，而私有方法和私有数据只能由类方法访问。但如果我们希望父类为我们提供子类可以调用但外部类不能调用的方法呢？首先想一想——你真的需要这吗？你可能会；实现代码被子类共享并不罕见。\n\
  \n例如，假设我们有一个方法可以由对象自己绘图，它通过清除屏幕的一部分来实现。这个方法被称为 `clearRegion`：\n\n```cpp\nclass Drawable\n\
  {\npublic:\n    virtual void draw ();\n    virtual ~Drawable ();\n    void clearRegion\
  \ (int x1, int y1, int x2, int y2);\n};\n```\n在这里使用继承并不是为了接口；而是为了让子类访问实现代码。这是一个有效且良好的继承用法，因为所有子类都需要或可能需要该方法。我们如何阻止该方法成为接口的一部分呢？当我们像示例那样将其变为公共时，它允许任何人调用该方法，尽管它并非为此设计。然而，该方法不能设为私有，因为子类无法访问。\n\
  \n### 保护数据 (Protected Data)\n\n答案在于使用保护饰符。类中保护部分的任何方法与私有方法不同，可以被子类访问。然而，与公共方法不同，它们无法从类外访问。保护饰符的语法与私有的相似：\n\
  \n```cpp\nclass Drawable\n{\npublic:\n    virtual void draw ();\n    virtual ~Drawable\
  \ ();\n\nprotected:\n    void clearRegion (int x1, int y1, int x2, int y2);\n};\n\
  ```\n\n现在，只有来自 `Drawable` 的子类可以访问 `clearRegion`。\n\n虽然保护方法在很多情况下有用，但除非绝对关键，否则不应使用保护数据。出于相同的原因，真的不需要将数据访问暴露给整个类层次结构。毕竟，你将来可能需要更改它。相反，应该使用保护方法来允许子类访问数据。\n\
  \n### 类范围数据 (Class-Wide Data)\n\n到目前为止，我们通过类所做的都是为单个对象实例存储数据。大多数时候这足够了。有时你可能希望存储特定于类整体的数据，而不是针对任何一个特定对象。一个例子是我们创建一个类，它每个对象都需要一个唯一的序列号。你将如何跟踪下一个分配的数字？你需要一个地方来存储下一个数字，并且这需要在类级别完成；这样，每当我们构造新对象时，我们就知道应该给它什么值。\n\
  \n\n\n为什么你想要这样做呢？嗯，其中一个原因是，当你为每个对象使用一个序列号时，在日志语句中识别对象会变得简单得多。你可以通过序列号在日志文件的任何行数中追踪该对象。\n\
  \n类级数据的创建方式是使用静态类成员（static class member）。与标准类数据不同，静态数据不属于任何对象。相反，所有的类对象都可以访问它，如果它被设为公共，其他人也可以访问它。静态变量非常类似于全局变量；区别在于，从类外部访问静态变量需要给变量名加上类名作为前缀。\n\
  \n为了看看它是什么样子，这里有一个声明了静态变量的类：\n\n```cpp\nclass Node\n{\npublic:\n    static int serial_number;\n\
  };\n\n// 不在类声明中--所以 Node:: 必须用作  \n// 前缀\nstatic int Node::serial_number = 0;\n\
  ```\n\n除了静态变量，你还可以使用静态方法（static methods）；这些方法是类的一部分，也可以没有对象实例的情况下使用。在下一个示例中，我们来看看如何使用一个名为\
  \ `_getNextSerialNumber` 的私有静态方法为每个单独的节点创建一个序列号：\n\n```cpp\nclass Node\n{\npublic:\n\
  \    Node ();\nprivate:\n    static int _getNextSerialNumber ();\n    // 静态，整个类只有一份拷贝\n\
  \    static int _next_serial_number;\n    // 非静态，每个对象都可用，但静态方法不可用\n    int _serial_number;\n\
  };\n\n// 不在类声明内部-- 所以 Node:: 必须用作  \n// 前缀\nstatic int Node::serial_number = 0;\n\
  \nNode::Node ()\n    : _serial_number( _getNextSerialNumber() )\n{ }\n\nint Node::_getNextSerialNumber\
  \ () \n{\n    // 使用后置版本的 ++ 来返回变量中\n    // 之前的值\n    return _next_serial_number++;\n\
  }\n```\n\n请记住：当使用静态方法时，该方法变为了类的一部分，但它无法访问任何特定于对象的字段。它只能访问静态数据，并且没有被传递 `this` 指针。\n\
  \n### 实现多态\n\n我将不会深入探讨这个主题，因为这是一个更高级别的话题。相反，我将给你提供足够的信息让你理解它。当你开始接触多态时，学习它是如何实现的并不是那么重要。所以，如果你想对它是如何实现的有些想法，请继续读下去；如果你不想，请跳到下一节——你以后可以随时回来。\n\
  \n多态的关键在于，与其使用具体的子类，一个操作接口（interface）的函数不需要在特定的机器码行调用哪个函数的细节。例如，在下面的代码中：\n\n```cpp\n\
  Vector <Drawable*> drawables;\nvoid drawEverything ()\n{\n    for ( int i = 0; i\
  \ < drawables.size(); i++ )\n    {\n        drawables[ i ]->draw();\n    }\n}\n\
  ```\n\n当我们调用 `drawables[ i ]->draw()` 时，因为 `draw` 方法是虚函数（virtual），它不会被编译为特定的函数调用。取决于继承\
  \ `Drawable` 的对象，可能会调用任意数量的方法——针对特定用户的飞船、绘制子弹、一个增强道具、敌方飞船等等。\n\n不仅如此，`drawEverything`\
  \ 调用的代码它完全不了解。调用 `draw` 方法的代码只需要看到 `Drawable` 接口；它不需要关于谁在实现 `Drawable` 的知识。但如果它调用的是\
  \ `Drawable` 子类的方法，它是如何工作的呢？\n\n对象将携带一个虚方法列表作为隐藏字段；在我们的案例中，我们有一个条目——`draw` 方法地址。特定接口上的每个方法都将被分配一个数字，当调用虚方法时，与该方法关联的数字将作为对象虚方法列表的索引。调用虚方法将编译为虚方法列表中的方法查找，然后是对所查找的方法的调用。在上面的上面的示例中，`draw`\
  \ 调用变成了对方法表中的方法 `0` 的查找，然后是对该地址的调用。虚方法列表也称为 `vtable`（虚函数表）。\n\n对象携带它自己的方法表，这意味着当编译不同的类以提供某个虚方法的特定实现时，编译器能够更改表中的地址。你不需要执行这些任何操作，因为编译器会为你完成。使用该表的代码只需要知道它为每个虚方法需要使用哪个索引，以便它能在表中找到它。\n\
  \n虚方法只包含那些被声明为 `virtual` 的方法。非虚方法不需要该机制。如果编写一个类时没有包含任何虚方法，则该类将不会有虚表。\n\n当你调用虚方法时，代码会访问\
  \ `vtable` 并使用索引找到该方法。\n\n当你写下：\n```cpp\ndrawables[ i ]->draw();\n```\n编译器将其处理为就像你说过：\n\
  1. 获取存储在 `drawables[ i ]` 中的指针\n2. 使用该指针定位与类型 `Drawable` 接口关联的方法组的虚表地址——在我们的案例中，我们只有一个方法\n\
  3. 在函数表中找到具有指定名称 `draw` 的函数，在我们的案例中。表是存储每个单独函数内存位置的地址集\n4. 带着相关的参数调用函数\n\n通常，第二步不会通过使用函数名完成；相反，编译器将将每个函数名转换为表中的索引。这样，在运行时，虚函数调用会非常快——它与标准函数调用之间的区别非常小。虽然下面的语法是虚构的，但你可以认为编译器生成的代码类似于：\n\
  \n```cpp\ncall drawables[ i ]->vtable[ 0 ];\n```\n\n然而，虚函数也有一个缺点。对象必须为每个继承的接口至少携带一个\
  \ `vtable`。这意味着每个虚接口都会将对象的大小增加几个字节。在实践中，这只会被拥有大量对象的代码引起关注。\n\n# 测验 23\n\n父类的析构函数在什么时候运行？\n\
  A. 当通过对父类指针调用 `delete` 毁对象时\nB. 在子类析构函数被调用之前\nC. 在子类析构函数被调用之后\nD. 在子类被调用时\n\n查看下面的类层次结构，`Dog`\
  \ 的构造函数需要什么？\n```cpp\nclass Mammal { \npublic:\n    Mammal (const string& species_name);\n\
  }; \n\nclass Dog : public Mammal \n{\npublic:\n    Dog(); \n};\n```\nA. 不需要特殊处理\n\
  B. 应该使用初始化列表调用参数为‘dog’的 `Mammal` 构造函数\nC. 应该在 `Dog` 构造函数内部调用 `Mammal` 的构造函数\nD.\
  \ 应该移除 `Dog` 构造函数并使用默认构造函数。\n\n这个类定义有问题？\n```cpp\nclass Nameable\n{\n    virtual\
  \ string getName();\n};\n```\nA. `getName` 方法没有设为公共\nB. 没有虚析构函数\nC. 没有 `getName`\
  \ 的实现，但也没有将 `getName` 声明为纯虚函数\nD. 以上所有\n\n当在接口类中声明虚方法时，函数必须具备什么能力才能使用该方法调用子类方法？\n\
  A. 接口的指针或引用\nB. 不需要，它可以复制对象\nC. 它必须知道子类的名称以便在该方法上调用\nD. 什么是虚方法？\n\n通过继承，代码复用如何提高？\n\
  A. 因为它允许代码从其父类继承方法\nB. 因为父类可以为子类实现一个虚方法\n\n\n\n\nC. 因为它允许我们编写针对接口而非具体类的代码；这使得新类可以实现该接口并重用代码\n\
  \nD. 因为它允许新类继承具体类的特征，从而允许配合虚方法使用\n\n关于类访问级别，以下哪些陈述中哪是正确的？\n\nA. 子类只能继承父类的公共（public）类及其数据\n\
  \nB. 子类可以访问父类的私有（private）方法和数据\n\nC. 子类只能访问父类的受保护（protected）方法和数据\n\nD. 子类可以访问父类的公共（public）和受保护（protected）方法及其数据\n\
  \n## 命名空间 (Namespaces)\n\n当你开始编程变得越来越顺手并创建了越来越多的类时，你可能会开始怀疑是否已经其他人写过实现你想做的功能的代码。如果他们真的写过了，你可以使用它吗？有时候，这两个问题的答案都是肯定的。许多数据结构和核心算法（例如二叉树和链表）已经过创建并实现，且其方式是可以被重用的，你可以直接使用它们。当你使用他人创建的代码时，唯一需要注意的是：不要陷入命名冲突的麻烦中。\n\
  \n例如，假设你写了一个名为 `LinkedList` 的类来存储你的链表实现。完全有可能你正在使用的某些代码已经有一个名为 `LinkedList` 的类，但其实现方式与你的不同。使用两个同名的类是不可能的。\n\
  \n你可以通过创建扩展到类型基本名称的命名空间来避免这种类型的冲突。作为一个例子，你可以将你的链表类放在一个名为 `com::cprogramming` 的命名空间中；这将确保该类型的完全限定名为为\
  \ `com::cprogramming::LinkedList`。当你使用命名空间时，显著降低了名称之间冲突的风险。我们使用的 `::` 运算符是访问类中静态成员或声明方法时使用的，但我们不是用它访问类元素，而是用它访问命名空间元素。\n\
  \n那么，既然这些命名空间这么好，为什么标准库没有使用它们呢？事实证明，如果你一直关注，你已经见过这些命名空间了——在我们写的每个程序开头，我们写了：\n\n\
  ```\nusing namespace std;\n```\n\n我们使用它是为了在引用像 `cout` 和 `cin` 这样的对象时不需要使用完全限定名。如果不使用此条语句，每当需要这些对象时，我们就必须编写\
  \ `std::cout` 或 `std::cin`。只要在文件中不需要实际通过命名空间来避免冲突，这种方法就有效；这在我们知道不会出现任何问题时，提供了一个方便的短快捷方法。当会发生冲突问题时，只需从代码中删掉命名空间使用声明，并确保文件中的每个类型都是完全限定的。\n\
  \n我们可以通过早前的代码示例看到它是如何工作的。如果我们有两个名为 `LinkedList` 的类，我们的大部分文件都需要声明：\n\n```cpp\nusing\
  \ namespace com::cprogramming::LinkedList\n```\n\n如果某个文件存在名称冲突，则该文件需要被修改，以使你的 `LinkedList`\
  \ 类被引用为 `com::cprogramming::LinkedList`。我们不需要在处处更改所有代码，只需要更改需要同时使用两种 `LinkedList`\
  \ 类型的文件；在这些文件中，将使用完全限定名，并移除 `using namespace com::cprogramming` 语句。\n\n看看下面的示例，它展示了如何将代码声明为命名空间的一部分。在这种情况下，它是单个变量：\n\
  \n```cpp\nnamespace cprogramming\n{\n    int x;\n} // <-- 注意我们不需要使用分号\n```\n\n现在，`x`\
  \ 必须被引用为 `cprogramming::x`，或者你可以说\n\n```cpp\nusing namespace cprogramming;\n```\n\
  \n然后你所做的就是在代码代码文件中写入 `x`，代码行写为：\n\n```cpp\nusing namespace cprogramming\n```\n\n\
  命名空间还可以相互嵌套。例如，如果你在一个大型组织中工作，该组织有多个部门，且每个部门都需要进行自己的开发。对于这种情景，你可以使用组织名称作为外部命名空间，然后将每个单独的部门放在内部命名空间中。\n\
  \n下一个示例展示了如何声明 `com::cprogramming` 的嵌套命名空间：\n\n```cpp\nnamespace com {\n    namespace\
  \ cprogramming\n    {\n        int x;\n    } \n} \n```\n\n`x` 现在有一个全名 `com::cprogramming::x`。注意，我没有对每个命名空间使用缩进——如果你有几个命名空间并对每一个都缩进，你在制表符上会遇到麻烦。\n\
  \n你可以写：\n\n```cpp\nusing namespace com::cprogramming;\n```\n\n作为访问命名空间元素的一种。\n\n\
  命名空间被归类为开放，这意味着代码可以放在多个文件的同一个命名空间中。例如，如果创建一个头文件来包含一个类，并将该类放在一个命名空间中：\n\n```cpp\n\
  namespace com {\n    namespace cprogramming\n    {\n        class MyClass \n   \
  \     {\n        public:\n            MyClass ();\n        };\n    } \n}\n```\n\n\
  在与之对应的源文件中，你可以写：\n\n```cpp\n#include \"MyClass.h\"\n\nnamespace com {\n    namespace\
  \ cprogramming\n    {\n        MyClass::MyClass ()\n        {}\n    } \n} \n```\n\
  \n这两个文件都可以向命名空间中添加代码。\n\n### 何时使用“using namespace”声明\n\n通常情况下，using namespace 声明应该只放在\
  \ `cpp` 文件中，而不是头文件中。主要问题是所有使用该头文件的文件都会受到冲突的影响——作为一个准则，在头文件中使用完全限定名，在 `cpp` 文件中使用使用声明。\n\
  \n然而，就像所有事情一样，我们确实有一些例外。第一个是标准库违反了这条规则，但这是很有理由的。如果你编写：\n\n```cpp\n#include <iostream.h>\n\
  ```\n\n而不是\n\n```cpp\n#include <iostream>\n```\n\n那么就不再需要为 `std` 添加使用声明了。事实证明，`iostream.h`\
  \ 内部是：\n\n```cpp\n#include <iostream>\nusing namespace std;\n```\n\n这样做是为了与 C++\
  \ 引入命名空间之前的程序保持兼容。\n\n对于编写新代码，建议使用不带 `.h` 的新头文件，这样你就不需要担心这个。在每个文件中编写\n\n```cpp\n\
  using namespace std\n```\n\n花费的时间很少，而且它确保你使用的是最新版本的 C++。\n\n### 何时创建命名空间\n\n如果你正在编写的项目只有几个文件，可能没有必要创建命名空间。这些通常只有在你开始创建包含许多文件和多个目录的程序时才会被使用，因为这种场景是你可能看到命名冲突的地方。\n\
  \n作为建议，当你认为以后可能需要重用代码，或者当你的程序增长到需要开始将其拆分为单独目录的程度时，将代码放入命名空间。\n\n命名空间并不是 C++ 中最令人兴奋的特性，但你很快就会发现，在处理大型代码库时它们非常方便。如果你能理解它们是什么以及为什么在其他代码中看到它们，你就会发现学习何时将别人的代码集成到你的代码中很容易。\n\
  \n在通常测验之后，我们进入文件 I/O。\n\n# 测验 24\n\n何时应该使用 using namespace 指令？\n\nA. 在每个头文件的 include\
  \ 语句之后\n\nB. 它们永远不应该使用，它们是危险的！\n\n\n\nC. 在任何与命名空间无冲突的 `cpp` 文件开头\n\nD. 在使用命名空间中的变量之前\n\
  \n命名空间（namespaces）的作用是什么？\n\nA. 它们为编译器编写者提供了一些可以挑战它们的内容！\n\nB. 它们提供了更多的代码封装\n\n\
  C. 在大型代码库中，它们可以防止命名冲突\n\nD. 它们用于明确类的目的\n\n什么时候应该将代码放在命名空间中？\n\nA. 始终\n\nB. 当你正在开发一个包含几十个文件的大型程序时\n\
  \nC. 当你正在开发一个要与他人共享的库时\n\nD. B 和 C\n\n为什么不应该将 `using namespace` 声明放在头文件中？\n\nA.\
  \ 因为它是非法的\n\nB. 没有什么理由不这么做，因为 `using` 声明只在头文件中有效\n\nC. 因为它会强制要求使用该头文件的用户使用该 `using`\
  \ 声明，无论是否会引起冲突\n\nD. 如果多个头文件都有 `using` 声明，可能会导致冲突\n\n## 文件输入/输出 (File I/O)\n\n如果说计算机需要某样东西，那就是文件。没有文件，无论你的电脑做什么，它只能持续到你重启或你使用的应用程序终止为止。不言而喻，C++\
  \ 可以读取和写入文件，我们将这种处理文件的操作称为“文件 I/O”——输入/输出。\n\n文件的读取和写入与我们使用 `cin` 和 `cout` 非常相似。然而，`cin`\
  \ 和 `cout` 是全局变量，而在 I/O 中，你需要声明想要读取或写入的对象。要做到这一点，你必须知道这些类型。\n\n数据类型是 `ifstream`（代表输入文件流）和\
  \ `ofstream`（代表输出文件流）。流（Streams）无非就是你可以读取或写入的一系列数据。这些类型将读取文件并将其转换为我们可以访问的长数据流，就像我们在与用户进行某种交互一样。这两种类型都需要\
  \ `fstream` 头文件才能工作。\n\n### 从文件中读取\n\n我们将开始讨论从文件中读取。要做到这一点，需要 `ifstream` 类型，并可以使用特定文件的名称来初始化\
  \ `ifstream` 实例：\n\n```cpp\n#include <fstream>\n\nusing namespace std;\n\nint main\
  \ ()\n{\nifstream file_reader( \"myfile.txt\" );\n}\n```\n\n这只是很小的程序，但它的功能是尝试打开名为\
  \ `myfile.txt` 的文件。为了做到这一点，它需要找到文件并在程序执行的目录——工作目录中查找。如果你愿意，可以提供完整路径，例如 `c:\\myfile.txt`。\n\
  \n注意，我说程序*尝试*打开文件——如果文件不存在，它就无法打开。要查看在文件打开时创建 `ifstream` 的结果，你可以调用 `is_open` 方法——这将指示\
  \ `ifstream` 对象是否成功打开了文件：\n\n```cpp\n#include <fstream>\n#include <iostream>\n\n\
  using namespace std;\n\nint main ()\n{\nifstream file_reader( \"myfile.txt\" );\n\
  if ( ! file_reader.is_open() )\n{\ncout << \"The file could not be opened!\" <<\
  \ '\\n';\n}\n}\n```\n\n当你处理文件时，真的没有选择——你必须编写能够处理潜在失败的代码。文件可能不存在；它可能损坏，甚至可能被另一个系统进程占用。在这些情况的每一种，对文件的某些操作都会失败。在处理文件时，失败是你始终必须准备好的事情——断电、文件损坏、磁盘故障、硬盘上的坏道——每一种都会导致操作失败。\n\
  \n一旦文件被打开，`ifstream` 就可以像使用 `cin` 一样使用。下面的代码将从指定的文本文件中读取一个数字：\n\n```cpp\n#include\
  \ <fstream>\n#include <iostream>\n\nusing namespace std;\n\nint main ()\n{\nifstream\
  \ file_reader( \"myfile.txt\" );\nif ( ! file_reader.is_open() )\n{\ncout << \"\
  The file could not be opened!\" << '\\n';\n}\nint number;\nfile_reader >> number;\n\
  }\n```\n\n就像从用户输入读取一样，该行读取文件中的数字，直到遇到空格或其他类型的分隔符为止。如果文件中有以下文本，例如：\n\n12 a b c\n\n\
  当程序运行时，存储的数字将是 12。\n\n由于我们处理的是文件，所以知道是否发生了任何错误是重要的。在 C++ 中，有一种方法可以检查执行读取操作的函数的结果。\n\
  \n方法如下：\n\n```cpp\n#include <fstream>\n#include <iostream>\n\nusing namespace std;\n\
  \nint main ()\n{\nifstream file_reader( \"myfile.txt\" );\nif ( ! file_reader.is_open()\
  \ )\n{\ncout << \"The file could not be opened!\" << '\\n';\n}\nint number;\n//\
  \ 我们需要检查读取整数的操作是否成功\nif ( file_reader >> number )\n{\ncout << \"The value is: \"\
  \ << number;\n}\n}\n```\n\n当我们检查对 `file_reader >> number` 调用返回的结果时，我们可以查看读取磁盘时是否出现了任何问题，或者数据格式是否有任何问题。（注：此处原文中存在大量重复段落，翻译已按要求进行处理，保持逻辑核心一致）。\n\
  \n## 文件格式 (File Formats)\n\n当你读取文件时，你必须知道什么是格式。格式是文件的布局，但它不必复杂。例如，我们可以有一个非常简单的格式，也许是\
  \ 10 行，每行一个数字。\n\n这样的列表示例如下：\n\n1000\n987\n864\n766\n744\n500\n453\n321\n201\n98\n\
  5\n\n为了读取这个列表，你可以写一个这样的程序：\n\n```cpp\n#include <fstream>\n#include <iostream>\n\
  #include <vector>\n\nusing namespace std;\n\nint main ()\n{\nifstream file_reader(\
  \ \"highscores.txt\" );\nif ( ! file_reader.is_open() )\n{\ncout << \"The file could\
  \ not be opened!\" << '\\n';\n}\n\nvector<int> scores;\nfor ( int i = 0; i < 10;\
  \ i++ )\n{\nint score;\nfile_reader >> score;\nscores.push_back( score );\n}\n}\n\
  ```\n\n这真的是非常简单的代码——它所做的打开文件并一个个读取分数。公平地说，它甚至不依赖于换行符分隔分数；它对空格同样有效。那是实现上的偶然特性，而不是文件格式的特性。如果你有其他程序处理该文件格式，它们对预期读取的内容可能不会那么友好。\n\
  \n在处理文件格式时，有一种被称为波斯特定法则（Postel’s Law）的原则你应该遵循的——“在接收时要宽容，在发送时要保守”。换句话说，任何生成文件的代码都应该严格遵守规范，而读取格式的代码应该足够健壮，能够承受编写得不够好的程序所产生的小错误。在上面的示例中，我们通过接受空格分隔符变得宽容了。\n\
  \n\n\n这段代码的编写是为了符合特定的格式，而且如果你没有注意到的话，它并不会尝试处理错误。例如，如果我们的条目少于 10 个，代码在到达文件末尾时仍继续从文件中读取。我们的游戏可能只被玩过三次，所以我们还没有那\
  \ 10 个分数。`EOF` 表达式通常用于表示该状态正处于“文件末尾”。\n\n我们可以通过编写当列表中的项少于 10 个时的处理逻辑来创建健壮的代码，我们这样做的方法是再次检查用于读取输入的方法产生的结果：\n\
  \n```cpp\n#include  <fstream>\n#include  <iostream>\n#include  <vector>\n\nusing\
  \ namespace std;\n\nint main ()\n{\nifstream file_reader( \"myfile.txt\" );\n\n\
  if ( ! file_reader.is_open() )\n{\ncout << \"The file could not be opened!\" <<\
  \ '\\n';\n}\n\nvector<int> scores;\nfor ( int i = 0; i < 10; i++ )\n{\nint score;\n\
  if ( ! file_reader >> score )\n{\nbreak;\n}\nscores.push_back( score );\n}\n}\n\
  ```\n\n当这段代码在一个在一个少于 10 个条目的文件上运行时，它一旦到达末尾就会停止读取。使用 `vectors` 相比于使用固定大小数组，处理较短的文件要容易得多。`vector`\
  \ 存储了读取到的精确输入——不多也不少。如果我们使用数组来执行此操作，将需要跟踪存储的条目数量——我们不应该假设整个数组都已经被填满。\n\n有时，你可能想要读取给定文件中所有的数据，直到文件的最末尾。为此，你需要能够区分是因为到达末尾导致的读取失败，以及是因为文件内部存在错误导致的读取失败。`eof()`\
  \ 方法指示你是否处于文件末尾。可以写一个循环来读取尽可能多的数据，每次检查读取结果，直到发生失败为止。在那个点上，你可以检查 `eof` 是否返回了 `true`——如果是，说明你已经了文件末尾；如果不是，说明发生了错误。\n\
  \n也可以调用 `fail()` 方法来查找其他失败——如果输入无效或在从设备读取时发生问题，该方法将返回 `true`。一旦你到达文件末尾，必须调用 `clear()`\
  \ 方法才能进行进一步的文件操作。很快，你将看到一个示例，在我们向高分列表写入新分数的章节中将使用所有这些方法。\n\n还需要强调从文件读取与用户交互之间的另一个重要区别。如果我们对我们的高分列表进行更改，将玩家名称连同分数一起添加，会发生什么？我们需要读取两部分信息——名称和分数。这意味着需要对代码进行更改以处理这种情况。然而，任何旧版本的程序都无法读取新格式，如果你有许多用户并想要更新文件格式，这可能会导致严重的头疼问题。你可以使用许多不同的技术，通过添加一些额外的可选字段，或为旧版本提供直接忽略新格式元素的能力，来使格式具有前瞻性。我们不会讨论这些技术，因为它们超出了本指南的范围；目前，你只需要理解文件格式定义在许多方面比基本的接口定义更具约束力（承诺性）。\n\
  \n## 写入文件\n\n我们需要使用 `ofstream` 类型来写入文件。它与 `ifstream` 类型几乎相同，只是我们像使用 `cout` 而不是 `cin`\
  \ 那样。下面是一个简单的程序，它将从 0 到 9（包含 9）的值写入 `highscores.txt` 文件。很快，我们将让这段代码产生看起来更像高分列表列表的内容：\n\
  \n```cpp\n#include  <fstream>\n#include  <iostream>\n#include  <vector>\n\nusing\
  \ namespace std;\n\nint main ()\n{\nofstream file_writer( \"highscores.txt\" );\n\
  \nif ( ! file_writer.is_open() )\n{\ncout << \"The file could not be opened!\" <<\
  \ '\\n';\nreturn 0;\n}\n\n// 因为我们还没有真正的分数，将输出从 10 到 1 的数字\n1\nfor ( int i = 0; i\
  \ < 10; i++ )\n{\nfile_writer << 10 – i << '\\n';\n}\n}\n```\n\n在这里不需要担心到达文件的末尾。当文件被写入且你到达其末尾时，`ofstream`\
  \ 会为你扩展它，这被称为追加文件。\n\n### 创建新文件\n\n当使用 `ofstream` 写入文件时，如果文件不存在，它将创建该文件；如果已存在，它将覆盖它。这是\
  \ `ofstream` 的默认行为。取决于你保存的内容，这可能会节省你大量时间。例如，如果你正在保存一份高分列表，每次覆盖它并不是问题，因为你反正要写回这些数据。但是，如果你在记录类似运行日志的内容，用来跟踪程序每次启动的时间和日期，你最不希望的就是它每次都被覆盖。\n\
  \n幸运的是，`ofstream` 的构造函数将接受另一个参数，用于指定处理方式：\n\n- `ios::app`: 追加到文件\n- `ios::ate`:\
  \ 将位置置于末尾\n- `ios::trunc`: 截断文件\n- `ios::out`: 用于输出到文件\n- `ios::binary`: 允许二进制操作\n\
  \n```cpp\nofstream a_file( \"test.txt\", ios::app | ios::binary );\n```\n\n使用代码可以在不破坏内容的情况下打开文件。\n\
  \n## 文件位置\n\n当程序读取或写入文件时，I/O 代码必须知道在哪里发生。将此比作鼠标光标；它在屏幕上的位置指示了下一个输入字符的位置。\n\n对于简单的操作，位置并不重要；代码可以写为读取文件中的任何内容。然而，不需要读取也可以更改文件的位置。\n\
  \n文件有两个不同的位置——一个指示程序下次读取的位置，另一个指示程序下次写入的位置。可以使用两个名为 `tellg` 和 `tellp` 的方法获取当前位置。`tellg()`\
  \ 方法（g 代表 get）提供当前的读取位置，而 `tellp`（p 代表 put）提供当前的写入位置。\n\n还有两个方法用于设置文件位置，从当前位置移动——`seekp`\
  \ 和 `seekg`。在文件中移动被称为寻（seek），当你寻址文件时，读取或写入位置被设置为新位置。这两个方法都接受两个参数——寻距离和寻的操作源。\n\n\
  字节用于测量距离，源是文件的开始、结束或当前位置。一旦寻完成后，就可以从新的文件位置读取或写入。如果你通过寻改变位置，它不会影响另一个位置。文件中有三个位置标志：\n\
  \n- `ios_base::beg`: 从文件开始寻\n- `ios_base::cur`: 从当前位置寻\n- `ios_base::end`: 从文件结束寻\n\
  \n例如，如果你想在开始写入之前回到文件开头，你可以这样写：\n\n```cpp\nfile_writer.seekp( 0, ios_base::beg );\n\
  ```\n\n\n\n\n`tellp` 和 `tellg` 返回的值是一个名为 `streampos` 的特殊变量类型，这是由 C++ 标准库定义的。该变量允许我们在整数与它之间进行转换，但当你使用\
  \ `streampos` 时，你可以对类型进行更明确的指定。整数几乎可以用在任何地方，但 `streampos` 有特定的用途——存储文件中的位置并定位到这些指定的位置。在代码中使用正确的变量类型非常重要，这样可以非常清楚地看出变量的用途。\n\
  \n```cpp\nstreampos pos = file_reader.tellg();\n```\n\n在某些情况下，你可能不需要使用 `seek`，因为从头到尾进行读取或写入就足够了。然而，有许多文件格式是为了向文件中添加新数据而经过优化的。当添加新数据时，在文件末尾添加比尝试插入到中间更容易、也更快。\n\
  \n在中间插入会带来一个问题——文件中插入点之后的所有内容都必须移动，就像我们在数组中插入元素时做的那样。\n\n让我们回到之前开始的高分程序，并对其进行修改以添加一个新分数。为了让它更有趣，该值将被插入到正确的位置。\n\
  \n执行此操作需要我们能够对文件进行读取和写入，因此我们需要使用 `fstream` 类。实际上，`fstream` 是 `ifstream` 和 `ofstream`\
  \ 的组合，允许读取和写入。\n\n首先，从用户处读取一个新高分，然后读取文件的每一行，直到我们得到一个小于输入分数的得分。那里就是插入新分数的地方。将保存该位置，将所有剩余行读入\
  \ `vector` 中，然后返回新位置。写出新分数，然后将剩余的分数写回以替换已有的行。\n\n由于我们使用了 `fstream`，我们可以读取和写入，但现在需要显式地告诉构造函数该文件将同时用于读取和写入。为了做到这一点，我们使用两个标志——`ios::in`\
  \ 和 `ios::out`，以便于明确需要做什么。在开始之前，这不会创建一个空文件，所以你需要先创建一个高分文件。然后你可以添加这段代码：\n\n```cpp\n\
  #include <fstream>\n#include <iostream>\n#include <vector>\n\nusing namespace std;\n\
  \nint main ()\n{\nfstream file ( \"highscores.txt\", ios::in | ios::out );\n\nif\
  \ ( ! file.is_open() )\n{\ncout << \"The file could not be opened!\" << '\\n';\n\
  return 0;\n}\n\nint new_high_score;\ncout << \"Input a new high score: \";\ncin\
  \ >> new_high_score;\n// 下面使用的 while 循环将搜索文件直到遇到一个\n// 小于当前高分的值；在此处，我们现在知道\n// 高分应该插入到该值之前。为了确保\n\
  // 我们知道正确的位置在哪里，我们必须跟踪位置直到\n// 当前分数之前的位置；即 pre_score_pos\nstreampos pre_score_pos\
  \ = file.tellg();\n\nint cur_score;\nwhile ( file >> cur_score )\n{\nif ( cur_score\
  \ < new_high_score )\n{\nbreak;\n}\npre_score_pos = file.tellg();\n}\n// 如果 fail\
  \ 评估为真，且我们知道不在文件末尾 (eof)，则我们知道存在某些错误的输入\nif ( file.fail() && ! file.eof() )\n{\n\
  cout << \"Bad score/read--exiting\";\nreturn 0;\n}\n// 如果我们不调用 clear()，如果遇到 eof，我们就无法向文件写入\n\
  file.clear();\n// 返回到上一个读取的分数之前的点，用于读取\n// 这样所有小于高分的数的都可以被读入\n// 并在文件中移动一个位置\nfile.seekg(\
  \ pre_score_pos );\n// 现在我们从开始读取所有分数，包括我们之前读取的那个\nvector<int> scores;\nwhile ( file\
  \ >> cur_score )\n{\nscores.push_back( cur_score );\n}\n// 我们期望通过这个读取循环到达文件末尾，因为\n\
  // 我们希望将文件中所有的分数都读入。\nif ( ! file.eof() )\n{\ncout << \"Bad score/read--exiting\"\
  ;\nreturn 0;\n}\n// 因为我们到达了 eof，文件需要再次清除，以便\n// 我们可以再次向文件写入\nfile.clear();\n// 回到我们想要执行插入操作的位置\n\
  file.seekp( pre_score_pos );\n// 如果我们不是向文件的开头写入，我们必须\n// 添加一个换行符。这是为了当读取到一个数字时，\n\
  // 它会在第一个空白字符处停止，这样我们在写入\n// 之前的位置就不会在下一行的开头；\n// 而是在数字的末尾\nif ( pre_score_pos !=\
  \ 0 )\n{\nfile << endl;\n}\n// 写出新的高分\nfile << new_high_score << endl;\n// 遍历剩余的分数，并输出它们所有的\n\
  for ( vector<int>::iterator itr = scores.begin(); itr != scores.end();\n++itr )\n\
  {\nfile << *itr << endl;\n}\n```\n\n### 接受命令行参数\n\n当我们编写一个与文件交互的程序时，通常希望用户提供文件名。很多情况下，使用命令行参数要方便得多。让我们暂时把读取和写入文件放在一边，使用这个功能。命令行参数是由于操作系统传递给程序的，在\
  \ `main` 函数之前，如下所示：\n\n`C:\\myprogram.exe arg1 arg2`\n\n那么，为什么我们一开始没有在函数中包含这些参数？答案很简单——如果你不把参数放进去，编译器就会忽略它们。\n\
  \n`main` 函数的完整定义如下所示：\n\n`int main (int argc, char *argv[])`\n\n整数 `argc` 是参数计数，指示从命令行传递了多少个参数。`argv`\
  \ 是一个字符指针数组，`argv[0]` 是程序名，如果没有名称，则使用空字符串。从此以后，小于 `argc` 的 `argv` 元素都是命令行参数。`argv[argc]`\
  \ 是空指针。\n\n下面是一个接受命令行参数的示例程序。在我们的例子，这是一个接收文件名并将文件中所有文本输出到屏幕的程序：\n\n```cpp\n#include\
  \ <fstream>\n#include <iostream>\n\nusing namespace std;\n\nint main (int argc,\
  \ char *argv[])\n{\n// 为了执行正确，argc 应该是 2，即程序名\n// 和文件名\nif ( argc != 2 ) \n{\n//\
  \ 当打印使用说明时，argv[0] 可以用作\n// 文件名\ncout << \"usage: \" << argv[ 0 ] << \" \" << endl;\n\
  }\nelse \n{\n// 我们假设 argv[ 1 ] 是要打开的文件名\nifstream the_file( argv[ 1 ] );\n// 你应该检查打开是否成功\n\
  if ( ! the_file.is_open() )\n{\ncout << \"The file could not be opened \" << argv[\
  \ 1 ] << endl;\nreturn 1;\n}\n\nchar x;\n// the_file.get( x ) 将从文件中读取下一个字符\n// 到\
  \ x 中，如果我们到达文件末尾 (eof)\n// 或者发生了某种错误，它将返回 false\nwhile ( the_file.get( x ) )\n{\n\
  cout << x;\n}\n} // 析构函数隐式关闭 the_file\n\n}\n\n```\n\n\n\n\n\n完整的 `main` 函数声明被用于访问命令行上的参数。首先，程序会检查用户是否提供了文件名。接下来，它将尝试打开该文件以检查其是否有效。有效，则打开文件；如果不有效，则报告一个错误。如果文件打开成功，程序将把文件的每个字符打印到屏幕上。\n\
  \n## 数字命令行参数\n\n如果你想将命令行参数作为数字使用，可以通过将参数读取为字符串，然后调用一个名为 `atoi` 的函数——它代表“ASCII 转整数”（ASCII\
  \ to integer）。该函数将接收一个 `char*` 并返回该字符串所代表的整数。要使用它，必须包含 `cstdlib` 头文件。\n\n例如，下方的程序将读取命令行参数，将其转换为数字，然后打印出转换结果的平方：\n\
  \n```cpp\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\nint\
  \ main (int argc, char *argv[])\n{\n    if ( argc != 2 ) \n    {\n        // 当打印用法说明时，argv[0]\
  \ 可以用作\n        // 文件名\n        cout << \"usage: \" << argv[ 0 ] << \" \" << endl;\n\
  \    }\n    else\n    {\n        int val = atoi( argv[ 1 ] );\n        cout << val\
  \ * val;\n    }\n    return 0;\n}\n```\n\n## 二进制文件 I/O\n\n到目前为止，我们查看了包含文本形式数据的文件。现在，我们应该转向查看二进制文件，它们通常以最高效率使用。为了处理二进制文件，我们需要使用一些稍微不同的编程技术。现在，我不希望你在这里感到困惑——你你系统上的每一个文件都已经是以二进制形式存储的，但很多时候，文件是以用户友好的方式编写的，这意味着用户可以读取它。\n\
  \n例如，C++ 源文件完全由基础计算机文本编辑器可以读取的字符组成。这类文件（即文件中每个字节都是一个字符或字符的一部分）被称为文本文件。\n\n然而，并不是每个文件都只有文本。某些文件包含不是可打印字符的字节。相反，它们仅仅是来自直接写入磁盘的一个或多个数据结构的原始二进制数据。\n\
  \n举个例子，假设我们有一个表示玩家的数据结构：\n\n```cpp\nstruct player\n{\n    int age;\n    int high_score;\n\
  \    string name;\n};\n```\n\n将此数据结构写入文件你有两个选择。首先，`age`、`name` 和 `high_score` 可以记录为文本字段；这样，整个文件就可以在文本编辑器中打开。它可能像这样：\n\
  \n18\n150000\nHarry\n\n高分由六个字符表示，正如我们之前学到的，存储每个字符需要一个字节——存储高分需要 6 个字节。然而，我们为高分有一个整数，而在\
  \ 32 位系统上，整数只占四个字节。所以，为什么我们需要六个？实际上我们只需要四个，但如果该数字是用四个字节写入的，我们就无法使用文本编辑器打开它并看到这个数字了。为什么呢？\n\
  \n当 `150000` 作为字符字符串写入文件时，它会被编码；每个字符都使用一个字节来存储作为字符的数字。而当一个数字被直接放入文件中时，字节不会被编码为字符。因此，你现在拥有了写入文件的整数所需的四个字节。如果文件被文本编辑器读取，这四个字节将被视为四个字符，但当打印这些字符时，它们与我们展示的数字没有任何关系——因为文件的编码方式不同，结果将毫无意义。\n\
  \n二进制格式占据的空间更小。我们在之前的示例中看到，用字符存储 `150000` 占用的空间比使用二进制表示多出 50%。如果你有一个小硬盘、一个慢硬盘或正在使用网络发送数据，这可能会产生巨大的差异。然而，二进制文件并不那么容易理解——你无法在文本编辑器中打开它查看其内容。文件格式的设计者面临着权衡——创建可以被任何人类读取和修改的格式，还是创建高效的格式。通常，`XML`\
  \ 和其他基于文本的标记语言用于创建可以被人类读取和理解的文件格式，但它们会占用大得空间。\n\n当空间成为问题时，如果你的处理器足够快，可以使用像 `ZIP`\
  \ 这样的文件压缩技术来减少空间，同时在解压后保持文件为基于文本的形式。因为解压文件非常简单，人类仍然可以处理这些文件，尽管它们比未压缩的版本要小得多。\n\n\
  然而，二进制文件仍然常见，有很多文件格式是二进制的，同时也许多格式必须是二进制的。如果一个文件格式存储视频、图像或音频，它就无法通过文本格式被正确表示。当你需要节省空间或需要顶级性能时，二进制文件完胜。它们将一直存在，每当你需要设计一种文件格式时，都取决于你决定想要更好的实现（文本）还是性能（二进制）。\n\
  \n### 如何处理二进制文件\n\n处理二进制文件的第一步是以二进制模式打开文件：\n\n```cpp\nofstream a_file( \"test.bin\"\
  , ios::binary );\n```\n\n当文件打开后，之前看到的输入输出函数就无法使用了。相反，我们需要处理二进制数据的特定函数。字节需要从内存块直接写入。我们将使用一个名为\
  \ `write()` 的方法，它将接收一个内存块指针和要写入的大小。我们使用 `char*` 作为指针类型，但数据并不一定是字符。所以，如果是这样，我们为什么需要使用\
  \ `char`？因为在 C++ 中，处理单个字节的最佳方法是使用单字节变量（`char`），或者指向字节序列的指针（`char*`）。\n\n如果你想向文件中写入字面上的字节序列，就需要\
  \ `char*`，以便可以将每个字节单独写入文件。将整数写入文件需要将其视为 `char*`，并将其传递给用于写入字节的方法。为了实现这一点，我们使用 `write()`\
  \ 方法逐个、顺序地写入每个字符（字节）。\n\n让我们假设，例如，你有一个数字 255。这在内存中由字节 `0xFF` 表示，它是十六进制的 255。如果一个整数存储了\
  \ `0xFF` 字节，它在内存中看起来像这样：\n\n```\n0x00000FF\n```\n\n或者，按字节表示：\n\n```\n00 00 00 FF\n\
  ```\n\n为了将整数写入文件，我们需要直接引用这个字节集。这就是为什么使用 `char*`——不是因为它可以表示 ASCII 字符，而是因为它可以处理字节。\n\
  \n我们还需要让编译器知道数据需要被处理为类似于字符数组。\n\n### 转换为 char*\n\n那么，我们如何做到呢？告诉编译器一个变量应该被视为指向 `char`\
  \ 的指针，而不是其真实类型的指针？这个过程被称为类型转换（typecasting）。\n\n\n\n\n\n我们使用了两种基础类型转换：`static_cast`\
  \ 和 `reinterpret_cast`。第一种 `static_cast` 用于我们有相关的类型并要在它们之间进行转换。例如，我们可以告诉编译器想要将一个\
  \ `double` 视为整数，以便对其进行截断，即 `static_cast(3.4)`。我们在转换名称后的括号内提供要转换的目标的目标类型。\n\n然而，在一种情况下，类型系统将完全被忽略；我们希望编译器获取一系列字节，并将其重新解释为一种不同的类型。例如，如果我们想将一个整数数组视为字符数组，我们会写道：\n\
  \n```\nx[ 10 ];\nreinterpret_cast( x );\n```\n\n需要注意的是，当你处理二进制数据时，这是极少数几个认为使用 `reinterpret_cast`\
  \ 是个好主意的地方之一。每当你看到它时，都应该有一丝疑虑——它是强制编译器执行其通常不会执行的操作的最强有力的方法之一，结果就是编译器对使用该转换的代码进行检查时，不会像检查其他代码那样进行仔细的检查。\n\
  \n在我们的情况下，我们需要获取的仅仅是字节序列的内存，所以我们确实需要它。反之，如果这并不是你的意图，请不要使用 `reinterpret_cast`。\n\n\
  最后，我们可以查看二进制输入和输出了。下面的代码示例将填充一个数组，然后将其写入文件。使用了 `write()` 方法；它接受 `char*` 作为源数据，并从源获取要写入的数据大小。在这段代码中，源是数组，数组的大小是以字节为单位的数组长度：\n\
  \n```\nint nums[ 10 ];\nfor ( int i = 0; i < 10; i++ )\n{\nnums[ i ] = i;\n}\na_file.write(\
  \ reinterpret_cast( nums ), sizeof( nums ) );\n```\n\n作为一个起点，我们有一个整数数组；当它被转换为 `char*`\
  \ 时，它将被视为仅仅是一个字节数组，并直接写入磁盘。当这些字节以后再次被读入时，它们将作为完全相同的字节集返回内存，内存可以被转换回整数，因此我们得到了完全相同的值。\n\
  \n注意，我们使用 `sizeof` 运算符来提供要写入的大小。该命令是获取给定变量大小用的命令之一，在我们的案例中，它将返回数组 `nums` 的总字节数。\n\
  \n然而，当你在指针上使用 `sizeof` 命令时，你需要小心；返回值将是指针的大小，而不是指针所指向的内存的大小。上面的代码示例之所以有效，是因为我们将 `nums`\
  \ 声明为数组而不是指针，且 `sizeof` 命令知道数组的大小。如果你有一个指针变量：\n\n```\nint *p_num\n```\n\n该变量的大小通常为四个字节，因为只需要这四个字节来存储变量地址。如果你想获取获取所指向的内容的大小，你会写道：\n\
  \n```\nsizeof( *p_num )\n```\n\n结果将与 `sizeof(int)` 完全相同。如果指针指向一个数组，例如，如果你写道：\n\n\
  ```\nint *p_num = new int[ length ]\n```\n\n你将得到如下所示的总大小：\n\n```\nsizeof( * p_num\
  \ ) * length \n```\n\n`write` 方法也可以用于直接将结构体写入文件。作为一个例子，让我们假设有一个如下的结构体：\n\n```cpp\n\
  struct PlayerRecord\n{\nint age;\nint score;\n};\n```\n\n你所做的只需创建一个 `PlayerRecord`\
  \ 实例并将其写入文件：\n\n```\nrec.age = 10;\nrec.score = 890;\na_file.write( reinterpret_cast(\
  \ & rec ), sizeof( rec ) );\n```\n\n注意，获取了 `rec` 的地址，以便可以传递指向该结构体的指针。\n\n### 在文件中存储类\n\
  \n如果我们想向结构体中添加一个非基础类型会发生什么？例如，如果我们向上面的结构体中添加一个字符串会怎样？\n\n```cpp\nstruct PlayerRecord\n\
  {\nint age;\nint score;\nstring name;\n};\n```\n\n我们在这里所做的只是将玩家名称作为字符串添加到结构体中，但现在，如果将其写入文件，当我们到达字符串时会发生什么？发生的情况是，字符串中存储的信息将被写入，但字符串内容本身不会。\n\
  \n我们将字符串类型实现为指向字符串的指针，我们甚至可能添加一些其他数据，如字符串长度。当结构体以二进制数据写出时，它写入的是字符串存储的内容，在我们的案例中，就是指针和字符串长度。但问题是，这个指针仅在程序运行期间有效。当程序结束，指针的实际值（或内存地址）将不再有用，因为该地址处将不再存储任何内容。下一次读取该结构体时，将使用一个指向未正确分配内存的指针，或者它将指向与字符串完全无关的数据。\n\
  \n我们需要的是一种定义良好的固定格式，用于表示磁盘上的二进制数据，而不仅仅是将结构体写入磁盘。我们将使用的格式是字符串字符将与字符串一起写入，我们很快就能看到它的样子：\n\
  \n```\nPlayerRecord rec;\nrec.age = 11;\nrec.score = 200;\nrec.name = \"James\"\
  ;\nfstream a_file( \"records.bin\", ios::trunc | ios::binary  ios::binary | ios::in\
  \ | ios::out );\na_file.write( reinterpret_cast( & rec.age ), sizeof( rec.age )\
  \ );\na_file.write( reinterpret_cast( & rec.score ), sizeof( rec.score ) );\nint\
  \ len = rec.name.length();\na_file.write( reinterpret_cast( & len ), sizeof( len\
  \ ) );\na_file.write( rec.name.c_str(), len + 1 ); // +1 用于空终止符\n```\n\n首先，值得注意的是，为了获取内存中的字符串，我们使用了\
  \ `c_str()` 方法，而不是字符串对象——如果你的字符串读取‘abc’，字符串以一个值为 0 的字符结束；这被称为空终止符，并用于指示字符串的结束。\n\
  \n我们将字符数据写入二进制文件并没有问题；尽管它被归类为二进制数据，它只是人类可以读取的格式。\n\n我们没有写入开始时的精确结构体也可以的；重要的是磁盘上的文件格式可以转换为内存中的对象。文件格式是数据表示，而结构体也是数据表示。两者存储相同的数据。\n\
  \n### 从文件中读取\n\n从二进制文件读取需要使用 `read()` 方法，它的参数与 `write()` 方法的参数几乎相同——数据的存放位置以及读取的数据量。例如，如果我们想从文件中读取一个整数，我们可以写：\n\
  \n```\nint x = 3;\na_file.read( reinterpret_cast( & x ), sizeof( x ) );\n```\n\n\
  在处理文件时，你总是需要对存储在文件的每个数据结构类型提供读取和写入的方法。使用我们的 `PlayerRecord` 程序，让我们看看如何读回它。我们先处理简单部分——文件位置，然后\
  \ `score` 和 `age` 字段（它们在不改变格式的情况下写入磁盘）将它们读回：\n\n```\na_file.seekg( 0, ios::beg );\n\
  PlayerRecord in_rec;\nif ( ! a_file.read( reinterpret_cast( & in_rec.age ), sizeof(\
  \ in_rec.age ) ) )\n{\n// 处理错误\n}\nif ( ! a_file.read( reinterpret_cast( & in_rec.score\
  \ ), sizeof( in_rec.score ) ) )\n{\n// 处理错误\n}\n```\n\n但是字符串呢？我们可以读入它吗？我们不能读取文件中字符串顶部的\
  \ `char*`，因为内存中存储的格式与磁盘上的格式不同。我们需要做的是读入 `char*`，然后创建一个新的字符串。\n\n\n\n\n现在应该很清楚为什么需要字符串长度了——显然，我们需要知道为存储该\
  \ `char*` 分配多少空间。在将字符串读入内存之前，将读取字符串长度并分配内存：\n\n```cpp\nint str_len;\n\nif ( ! a_file.read(\
  \ reinterpret_cast( & str_len ), sizeof( str_len ) ) )\n{\n    // 处理错误\n}\n\n//\
  \ 这里需要进行一次合理性检查以确保不会分配过多的内存！\nelse if ( str_len > 0 && str_len < 10000 )\n{\n  \
  \  char *p_str_buf = new char[ str_len ];\n    if ( ! a_file.read( p_str_buf, str_len\
  \ + 1 ) ) // + 1 用于空终止符\n    {\n        // 处理错误\n    }\n    // 我们需要验证字符串，以检查它是否以空字符终止\n\
  \    if ( p_str_buf[ str_len ] == 0 )\n    {\n        in_rec.name = string( p_str_buf\
  \ );\n    }\n    delete p_str_buf;\n}\ncout << in_rec.age << \" \" << <\n```\n\n\
  现在你可以尝试运行这个完整的程序了：\n\n```cpp\n#include <fstream>\n#include <string>\n#include <iostream>\n\
  \nusing namespace std;\n\nstruct PlayerRecord\n{\n    int age;\n    int score;\n\
  \    string name;\n};\n\nint main ()\n{\n    PlayerRecord rec;\n    rec.age = 11;\n\
  \    rec.score = 200;\n    rec.name = \"James\";\n    fstream a_file( \"records.bin\"\
  , ios::trunc | ios::binary | ios::in | ios::out );\n    a_file.write( reinterpret_cast<char*>(\
  \ & rec.age ), sizeof( rec.age ) );\n    a_file.write(reinterpret_cast<char*>( &\
  \ rec.score ), sizeof( rec.score ) );\n    int len = rec.name.length();\n    a_file.write(reinterpret_cast<char*>(\
  \ & len ), sizeof( len ) );\n    a_file.write( rec.name.c_str(), rec.name.length()\
  \ + 1 );\n\n    PlayerRecord in_rec;\n    a_file.seekg( 0, ios::beg );\n    if (\
  \ ! a_file.read( reinterpret_cast<char*>( & in_rec.age ), sizeof( in_rec.age ) )\
  \ )\n    {\n        cout << \"Error reading from file\" << endl;\n        return\
  \ 1;\n    }\n    if ( ! a_file.read( reinterpret_cast<char*>(& in_rec.score ), sizeof(\
  \ in_rec.score ) ) )\n    {\n        cout << \"Error reading from file\" << endl;\n\
  \        return 1;\n    }\n    int str_len;\n    if ( ! a_file.read( reinterpret_cast<char*>(\
  \ & str_len ), sizeof( str_len ) ) )\n    {\n        cout << \"Error reading from\
  \ file\" << endl;\n        return 1;\n    }\n\n    // 这里需要进行一次合理性检查以确保不会分配过多的内存！\n\
  \    if ( str_len > 0 && str_len < 10000 )\n    {\n        char *p_str_buf = new\
  \ char[ str_len ];\n        if ( ! a_file.read( p_str_buf, str_len + 1 ) ) // +\
  \ 1 用于空终止符\n        {\n            delete p_str_buf;\n            cout << \"Error\
  \ reading from file\" << endl;\n            return 1;\n        }\n        // 我们需要验证字符串，以检查它是否以空字符终止\n\
  \        if ( p_str_buf[ str_len ] == 0 )\n        {\n            in_rec.name =\
  \ string( p_str_buf );\n        }\n        delete p_str_buf;\n    }\n    cout <<\
  \ in_rec.age << \" \" << in_rec.score << \" \" << in_rec.name << endl;\n}\n```\n\
  \n运行程序，然后尝试用 `Notepad`（记事本）等文本编辑器打开它。你应该能读到名字“James”，因为这个名字是以字符的形式存储在字符串中的。然而，这是唯一有意义的地方了。\n\
  \n测验之后，我们将进入最后一个 C++ 话题：`Templates`（模板）。\n\n# 测验 25\n\n以下哪些类型可以用于从文件中读取？\nA. `ifstream`\n\
  B. `ofstream`\nC. `fstream`\nD. A 和 C\n\n以下哪个陈述是正确的？\nA. 文本文件占用的空间没有二进制文件大\nB. 调试二进制文件比调试文本文件容易\n\
  C. 二进制文件使用空间比文本文件更高效\nD. 文本文件在实际程序中速度太慢了\n\n当你写入二进制文件时，为什么不能将指针传递给字符串对象？\nA. 因为\
  \ `char*` 必须传递给 `write` 方法\nB. 字符串对象不能存储在内存中\nC. 我们不知道字符串对象的布局；它可能包含指针，这些指针会被写入文件\n\
  D. 字符串太大了，需要逐位写入\n\n关于文件格式，以下哪个陈述是正确的？\nA. 你可以容易地更改文件格式\nB. 二进制文件比文本文件更容易调试\nC.\
  \ 二进制文件使用空间比文本文件更高效\nD. 文本文件速度太慢，无法用于实际程序\n\n\n\n代码中所有 `T` 出现的地方都被替换为 `double`。这就像是编写了\
  \ `triangleAreaDouble` 函数一样。从字面上看，我们写的代码只是编译器用来的一个模板，用于创建处理 `double` 类型的特化特定函数。\n\
  \n为了更清楚地说明，你可以将整行代码：\n\n```\ntemplate <typename T>\n```\n\n理解为前面的类或函数是一个模板，并且在该模板中，字母\
  \ `T` 被用作一种类型——可能是一个 `char`、`double`、`int`，或者某个特定类的名称。当有人需要该模板时，必须为 `T` 提供一个具体的类型，我们通过在函数或类名之前的尖括号\
  \ `<>` 中放置该类型来实现这一点。\n\n## 类型推导\n\n有时，模板函数的调用者甚至不需要显式地为模板提供参数，因为编译器可以根据函数参数推断出参数值。假设你写了：\n\
  \n```\ntriangleArea(.5, .5);\n```\n\n编译器会计算出 `T` 应该是一个 `double`，因为 `T` 参数已经用于声明函数参数了。因为编译器知道参数的类型，它就能推断出\
  \ `T` 的类型。\n\n只要模板参数被用函数参数类型，类型推导就会生效。\n\n## 鸭子类型 (Duck Typing)\n\n你听过那句话吗：“如果它看起来像鸭子，走起来像鸭子，叫起来也像鸭子，那么它可能就是一只鸭子？”这在模板中经常被用到。当传入模板参数时，编译器需要决定该参数对于该模板是否有效。\n\
  \n在我们的 `compute_equation` 模板中，传递给函数的数值类型必须支持加法和乘法算术运算符：\n\n```\nreturn x * y * 4\
  \ * z + y * z + x;\n```\n\n但某些类型是不能相角的。整数和 `double` 可以，但 `vector` 不行。尝试乘以 `vector`\
  \ 的想法简直是荒谬且毫无意义，而且 `vector` 类也没有提供这种支持。\n\n如果你尝试将三个 `vector` 传递给 `compute_equation`，函数调用将无法编译：\n\
  \n```\nint main ()\n{\nvector<int> a, b, c;\ncompute_equation( a, b, c );\n}\n```\n\
  \n编译器非常精确，它会确切地告诉你哪些操作没有 `vector<int>` 的支持：\n\n```\ntemplate_compile.cc: In function\
  \ 'T compute_equation(T, T, T) [with T =\nstd::vector<int, std::allocator<int> >]':\n\
  template_compile.cc:13: instantiated from here\ntemplate_compile.cc:5: error: no\
  \ match for 'operator*' in 'y * z'\ntemplate_compile.cc:5: error: no match for 'operator*'\
  \ in 'x * y'\n```\n\n这是一个很长的错误信息，但可以拆解。第一行告诉你 `compute_equation` 是出问题的函数。第二行告诉你你尝试使用它的行号，这通常是你需要查看的行。第三行和第四行告诉你编译失败的原因。在我们的案例中，它告诉你\
  \ `x*y` 中没有 `operator*` 的匹配项。这意味着它无法确定 `x` 和 `y` 应该如何相乘，因为 `vector` 没有 `*` 运算符。两个变量都是\
  \ `vector`，所以你应该能看出 `vector` 确实不支持乘法。\n\n换句话说，`vector` 的行为不像数字，它看起来不像数字，说话起来也不像数字。当你使用模板函数时，编译器会判断提供的类型在模板中是否可行。它实际上并不在乎除类型是否支持所调用的操作和方法以外的任何事情。它只需要看起来像是一个可以工作的类型即可。\n\
  \n鸭子类型与多态函数完全不同。后者接收一个接口类的指针，并且只会调用在指定接口类上定义过的方法。在模板中，参数不需要符合任何特定的或预定义的接口。只要模板类型和任何相同类型的变量可以按照函数指定的方式被使用，它就能编译。\n\
  \n## 模板类\n\n虽然模板类倾向于想要编写如 `map` 和 `vector` 等类的库编写者，但普通的日常程序员也可以从让其代码更具通用性中获益。你不应该仅仅因为可以使用模板就使用它；相反，你应该寻找机会去消除那些仅在类型上不同的类。\n\
  \n是的，你可能会发现自己编写的模板方法比类多，但你确实需要了解一些如何使用它们，特别是当你有想要实现的自定义数据结构时。\n\n声明模板类与模板函数没有太大区别。假设我们想要构建一个小的类来封装数组：\n\
  \n```\ntemplate <typename T> class ArrayWrapper\n{\nprivate:\nT *_p_mem;\n};\n```\n\
  \n与模板函数一样，我们从引入模板的声明开始——我们使用 `template` 关键字——然后添加模板参数。这里我们只有一个参数，`T`。\n\n每当我们想要由用户指定的类型时，就可以使用\
  \ `T`，就像模板函数一样。当为模板类定义函数时，必须使用模板语法，让我们为类添加一个名为 `ArrayWrapper` 的构造函数：\n\n```\ntemplate\
  \ <typename T> class ArrayWrapper\n{\npublic:\nArrayWrapper (int size);\nprivate:\n\
  T *_p_mem;\n};\n```\n\n为了在类外部定义构造函数，我们首先指示该函数是模板：\n\n```\ntemplate <typename T>\n\
  ArrayWrapper<T>::ArrayWrapper (int size)\n: _p_mem( new T[ size ] )\n{}\n```\n\n\
  ## 模板技巧\n\n通常你会发现先写类再使用模板要容易得多。例如，假设你声明了一个整数类；然后从该类声明设计一个通用的模板。你不必这样做，如果你从一开始就能熟练使用模板，那么显然没必要，但当你开始编写模板时，区分模板问题和算法问题是有帮助的。\n\
  \n让我们来看简单的示例，一个初始只针对整数的计算器类：\n\n```\nclass Calc\n{\npublic:\nCalc ();\nint multiply\
  \ (int x, int y);\nint add (int x, int y);\n};\n\nCalc::Calc ()\n{}\n\nint Calc::multiply\
  \ (int x, int y)\n{\nreturn x * y;\n}\n\nint Calc::add (int x, int y)\n{\nreturn\
  \ x + y;\n}\n```\n\n这对整数效果非常好，现在我们可以将类转换为模板；这让我们能够构建适用于非整数类型的计算器：\n\n```\ntemplate\
  \ <typename Type>\nclass Calc\n{\npublic:\nCalc ();\nType multiply (Type x, Type\
  \ y);\nType add (Type x, Type y);\n};\n\ntemplate <typename Type> Calc<Type>::Calc\
  \ ()\n{}\n\ntemplate <typename Type> Type Calc<Type>::multiply (Type x, Type y)\n\
  {\nreturn x * y;\n}\n\ntemplate <typename Type> Type Calc<Type>::add (Type x, Type\
  \ y)\n{\nreturn x + y;\n}\n\nint main ()\n{\n// 展示一个声明\nCalc<int> c;\n}\n```\n\n\
  我们确实对这里进行了几处修改：\n\n\n\n\n\n首先，我们需要声明一个名为 `Type` 的模板类型：\n\n```cpp\ntemplate <typename\
  \ Type>\n```\n\n接下来，必须在类定义以及每个函数定义之前添加模板声明：\n\n```cpp\ntemplate <typename Type>\
  \ class Calc\ntemplate <typename Type> int Calc::multiply (int x, int y)\n```\n\n\
  然后，必须修改每个函数定义，以表明它属于一个模板类：\n\n```cpp\ntemplate <typename Type> int Calc<Type>::multiply\
  \ (int x, int y)\n```\n\n最后，代码中所有出现 `int` 的地方都必须替换为 `Type`：\n\n```cpp\ntemplate\
  \ <typename Type> Type Calc<Type>::multiply (Type x, Type y)\n```\n\n当你习惯了使用模板后，你会发现将一个为某种特定类型定义的类转换为可以处理多种类型的模板类是非常容易的。随着时间的推移，你会发现自己对模板语法的运用越来越熟练，并开始编写自己的模板类，而不再需要先编写任何其他代码。\n\
  \n### 模板与头文件\n\n到目前为止，我们所看到的模板都是直接写在 `.cpp` 文件中的。如果我们想把模板声明放在头文件中呢？可以吗？这里的问题在于，使用模板类或模板函数的代码，在每次对模板进行调用以及对模板类调用任何成员函数时，都需要能够访问整个模板定义。\n\
  \n这与标准函数的工作方式不同；标准函数只需要调用者知道声明即可。例如，如果你将 `Calc` 类放在它的头文件中，你还需要将完整的构造函数定义以及 `add()`\
  \ 方法一起添加进去，而不是像通常那样将它们都放在一个 `.cpp` 文件中。如果不这样做，你将无法使用 `Calc`。\n\n这是模板的一个相当遗憾的特性，完全与模板的编译方式有关。在大多数情况下，当编译器第一次解析它们时，几乎会忽略模板。只有当使用了连接了具体类型的模板时，编译器才会为该类型生成代码。为了做到这一点，模板必须对编译器可见，以便生成代码。结果是，所有的模板代码都必须包含在所有使用该模板的文件中。而且当编译包含模板的文件时，在模板被第一次使用之前，你可能无法发现模板中的任何语法错误。\n\
  \n创建模板类时，最简单的方法是将所有模板定义都放在头文件中。如果使用 `.h` 以外的扩展名也会帮助，例如使用 `.hxx`，以便清楚地表明该文件是一个模板。\n\
  \n### 分析模板错误信息\n\n如果使用模板有一个主要的缺点，那就是当模板被误用时，许多编译器会抛出难以理解的错误信息——无论你是否故意写错。你可能因为一个错误就得到整整页的错误信息。\n\
  \n模板错误信息之所以难以阅读，是因为模板参数被展开到了极致，即使是那些通常不使用的参数（例如默认参数）。\n\n看下面的 vector ：\n\n```cpp\n\
  vector<int, int> vec;\n```\n\n看起来没问题，对吧？不，有一个小问题——应该只有一个参数。这是一个很简单的错误，但编译会抛出一堆看起来像末日般的错误信息：\n\
  \n```\n/usr/lib/gcc/x86_64-redhatlinux/\n4.1.2/../../../../include/c++/4.1.2/bits/stl_vector.h:\
  \ In instantiation\nof 'std::_Vector_base<int, int>':\n/usr/lib/gcc/x86_64-redhatlinux/\n\
  4.1.2/../../../../include/c++/4.1.2/bits/stl_vector.h:159:\ninstantiated from 'std::vector<int,\
  \ int>'\ntemplate_err.cc:6: instantiated from here\n/usr/lib/gcc/x86_64-redhatlinux/\n\
  4.1.2/../../../../include/c++/4.1.2/bits/stl_vector.h:78: error: 'int'\nis not a\
  \ class, struct, or union type\n/usr/lib/gcc/x86_64-redhatlinux/\n4.1.2/../../../../include/c++/4.1.2/bits/stl_vector.h:95:\
  \ error: 'int'\nis not a class, struct, or union type\n/usr/lib/gcc/x86_64-redhatlinux/\n\
  4.1.2/../../../../include/c++/4.1.2/bits/stl_vector.h:99: error: 'int'\nis not a\
  \ class, struct, or union type\n/usr/lib/gcc/x86_64-redhatlinux/\n4.1.2/../../../../include/c++/4.1.2/bits/stl_vector.h:\
  \ In instantiation\nof 'std::_Vector_base<int, int>::_Vector_impl':\n/usr/lib/gcc/x86_64-redhatlinux/\n\
  4.1.2/../../../../include/c++/4.1.2/bits/stl_vector.h:123:\ninstantiated from 'std::_Vector_base<int,\
  \ int>'\n```\n\n\n\n\n这样好多了，不是吗？没有那么多行，就像我们在鸭子类型（duck typing）章节中看到的情况——容易处理得多。查看这条错误信息，在第一行显示“In\
  \ instantiation of `std::_Vector_base`”——错误是在告诉你，无法使用提供的参数创建模板。\n\n在下一行，它告诉你 `Vector_base`\
  \ 模板（一个用于实现 vector 的辅助类）因为尝试创建模板 `vector` 而没有编译。该信息还告诉了你它的出处——文件 `template_err.cc`，第\
  \ 6 行。这是我们的代码，所以我们现在知道去哪里修复错误了。\n\n找到错误所在的代码行始终是弄清哪里出问题的第一步。大多数情况下，随着你经验和信心的增加，只需看一眼代码就能看出错误是什么。如果并不显而易见，你只需继续检查实例化列表，直到出现正确的错误信息——‘error:\
  \ int is not a class, struct or union type’。编译器期望一个结构体或类，而不是像 `int` 这样的内置类型。`Vector`\
  \ 应该持有任何类型，因此提示错误在于传递给 `vector` 的参数上。\n\n现在，你应该确保自己知道 `vector` 是如何定义的，并且它只需要一个模板参数。\n\
  \n现在问题已经找到了，我们可以修复它然后重新编译代码。有时你可以同时查出并修复几个错误，但涉及模板时，第一个错误通常是所有其他错误的根源。一次解决一个问题，你会发现任何其他错误都会自动修复。\n\
  \n在我们上面的最后一个示例中，所有那些错误信息都源源于一个简单的错误——给了一个 `int` 作为第二个模板参数。\n\n这带我们来到了本指南的终点。我希望你喜欢它，就像我喜欢写它一样。完成最后的测验，并给自己鼓个掌鼓励一下吧。\n\
