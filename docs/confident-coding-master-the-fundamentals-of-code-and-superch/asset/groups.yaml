    # Why do I spend so much time debugging?


    One question that plagues new coders is why they spend so much time fixing problems
    in their code. Most people hope that because they have a clear idea in their head
    about how their code should work, that will auto- matically transfer itself to
    your computer screen and everything will run as intended.


    The reality is rather different. As you write more and more code, you''ll realize
    that debugging is actually a major part of the app- or website-building process,
    and this is fine. Computers are fickle beasts, and us mere mortals are not used
    to interacting with machines that require absolute precision, and will punish
    you relentlessly by running your code exactly as you write it.


    So debugging is a (big) part of the process. But that doesn''t mean that isn''t
    frustrating and we shouldn''t try to avoid it as much as possible. So let''s start
    by seeing how we can write code that requires minimal debugging.


    # How to write code that requires minimal debugging


    # Step 0: Write good code


    Good, clean code can save a huge amount of time in the long run. When you want
    to build an app or add a new feature to your website, the temptation is often
    to write your code as quickly as possible and to have the attitude that, as long
    as it works, it is good enough. This approach is perfectly reasonable when you''re
    learning or for small personal projects, but in my experience it almost always
    costs you more time than it saves you. Taking an extra five minutes properly writing
    your code in the first place can save you hours of debugging further down the
    line.


    Compare these two JavaScript functions, which determine whether a number is prime
    or not. (A prime number has precisely 2 factors, 1 and itself. For example, 2,
    3, 5, 7, 11 etc.)'
