    \ CSS 将文字变为黄色。\n\n你的代码应该像这样 (4.3)：\n\n![](img/57532e13229b6da209b2a527acf10e32_68_0.png)\n\
    \n# 类 (Classes) 和 ID\n\n如果我们想让某些段落标签变为蓝色，另一些变为红色怎么办？我们需要一种比仅通过类型更精确选择元素的方法。我们使用类和\
    \ ID 来。\n\n# 类 (Classes)\n\n向元素添加 class 属性非常简单——将第一个段落的代码改为：\n\n```\n<p class=\"\
    blue\">I love HTML.</p>\n```\n\n我们现在已经给该段落应用了类 'blue'。现在在你的网页的 style 部分添加以下代码：\n\
    \n```\n.blue {\n  color: blue;\n}\n```\n\n注意：'blue' 之前的 `.` 告诉浏览器我们正在寻找一个类。在 CSS\
    \ 中，点（句号）是 class 的缩写。\n\n# 语言（颜色）\n\n你现在应该发现第一个段落是蓝色的，第二个是绿色的。\n\n尝试为 h 元素添加 `class=\"\
    blue\"` 属性。你会发现“My first webpage”也变成了蓝色。类允许我们为任意数量的元素提供特定的 CSS 规则，并且适用于任何类型的元素。\n\
    \n注意，类为 'blue' 的段落实际上应用了两个样式规则。`p` 规则告诉它是绿色的，而 `.blue` 规则告诉它是蓝色的。由于 CSS 规定最“特定”的规则应该胜出，因此由类或\
    \ ID 定义的规则将始终优于应用于元素类型的规则。所以段落最后是蓝色的，而不是绿色的。这就是级联样式表（Cascading Styles）中“级联”部分的体现。\n\
    \n# ID\n\nID 与类非常，但它们应该只应用于网页上的一个元素。它们是为只会一次的元素设计的，例如页眉、页脚或标题。\n\n我们以与类完全相同的方式添加它们，所以尝试将“I\
    \ love CSS!”段落的 ID 改为 'pink'：\n\n现在在 style 部分添加以下 CSS：\n\n```\n.pink {\n  color:pink;\n\
    }\n```\n\n注意：这里我们使用哈希符号 `#` 来表示 ID。因此在 CSS 中，`.` 是类的缩写，而 `#` 是 ID 的缩写。\n你会发现‘pink’规则和‘p’规则都适用于‘I\
    \ love CSS!’段落，但 ID 规则胜出。与 ID 和类的规则将始终优于与元素类型的规则。\n\n# 练习题\n\n- 为网页添加内部 CSS，使用类和\
    \ ID 使第一个段落变为红色，第二个段落变为蓝色：CC 14\n\n![](img/57532e13229b6da209b2a527acf10e32_69_0.png)\n\
    \n我们现在可以通过元素的类型、类或 ID 来选择元素。不过我们目前只学了一种 CSS 规则，即如何更改文本颜色。在查看其他规则之前，我们将快速看看如何使用\
    \ `<div>` 元素将我们的代码划分为不同的部分。\n\n# Div（分段）\n\nDiv 是“division”（划分）的缩写，允许我们将代码划分为不同的部分。这意味着如果我们愿意，可以对每个部分进行不同的样式处理。删除页面\
    \ body 中的所有代码并将其替换为以下内容：\n\n```\n<div class=\"divA\">\n  <p>I'm in div A</p>\n\
    </div>\n<div class=\"divB\">\n  <p>I'm in div B</p>\n</div>\n```\n\n结果应该像这样 (4.4)：\n\
    \n![](img/57532e13229b6da209b2a527acf10e32_70_0.png)\n\n问题：为什么现在两个段落的文字都是绿色的？\n\
    答案：我们删除了段落中的类和 ID，所以现在适用于它们的唯一规则是颜色：绿色规则。因此它们都是绿色的。\n\n看起来 div 似乎并没有做很多事情，但当我们开始应用它们时，它们实际上为我们的设计提供了很多控制。。\n\
    \n# 背景颜色\n\n我们现在来查看一系列不同的样式。删除标签中的代码并将其替换为：\n\n```css\ndiv {\n  background-color:\
    \ grey;\n}\n```\n\n这为两个 div 都提供了背景颜色 (4.5)：\n\n![](img/57532e13229b6da209b2a527acf10e32_71_0.png)\n\
    \n注意：div 默认跨越整个窗口。\n\n# 练习题\n\n- 使用类给第一个 div 设置红色，给第二个 div 设置蓝色。\n\n# 颜色代码\n\n\
    到目前为止我们只使用了名称来描述颜色。但我们想要比仅仅名称更精确，我们通过代码来实现。哈希符号 `#` 告诉我们正在使用十六进制代码。在 CSS 中，它看起来像这样：\n\
    \n```\n.div {\n  background-color: #ff0000;\n}\n```\n\n十六进制代码由六数字组成：0-9 和 A-F。前两个数字代表红色，接两个代表绿色，最后两个代表蓝色。例如\
    \ #ff0000 是红色，#00ff00 是绿色，#0000ff 是蓝色。\n\n尝试使用十六进制代码寻找颜色。\n\n# 练习题\n\n- 更新此页面的内部\
    \ CSS，使用十六进制代码设置颜色。\n\n# 尺寸\n\n我们可以使用 width 和 height 来更改大小。尝试在你的页面使用以下代码：\n\n\
    ```\n.divA {\n  background-color: red;\n  width: 200px;\n  height: 200px;\n}\n\
    ```\n\n```\n.divB {\n  background-color: blue;\n  width: 50%;\n}\n```\n\n你的页面应该像这样\
    \ (4.6)：\n\n![](img/57532e13229b6da209b2a527acf10e32_73_0.png)\n\n注意我们可以使用任何单位。200px意味着\
    \ 200 像素，50%意味着容器元素的 50%。\n\n# 使用浮动定位\n\n到目前为止我们看到了如何使用 CSS 调整颜色和大小，但我们也可以影响布局。直到现在，所有的元素都是垂直排列的，但可以使用浮动来改变这一点。尝试为\
    \ .divA 添加此 CSS 规则：\n\n```\nfloat: right;\n```\n\n你的页面应该像这样 (4.7)：\n\n![](img/57532e13229b6da209b2a527acf10e32_74_0.png)\n\
    \n注意发生了什么：divA 现在浮动在页面右侧，而 divB 在左侧与它同步。尝试进行以下更改：\n\n- 为 .divB 添加 float: left\n\
    - 将 divB 的宽度改为 20%\n- 在 divB 之后添加一个内容为“This is some text”的段落\n\n你能解释这种布局吗？它应该像这样\
    \ (4.8)：\n\n![](img/57532e13229b6da209b2a527acf10e32_74_1.png)\n\n我们现在有一个三列布局，红色\
    \ div 在右侧，蓝色在左侧，其他所有内容在中间。浮动是让 div 或其他元素左右排列的一种非常有用的方法。\n\n# 练习题\n\n- 更新此页面的内部\
    \ CSS，使 #left 向左浮动#right 向右浮动 CC 16\n\n# 使用位置布局\n\n有时我们希望比浮动允许的更精确的布局，我们通过定位来实现。如果我们想相对于元素原本的位置移动，例如\
    \ div A 的位置，可以添加以下 CSS 规则：\n\n```\nposition: relative;\ntop: 50px;\nleft: 100px;\n\
    ```\n\n这将向下移动 50 像素并向右移动 100 像素 (4.9)：\n\n![](img/57532e13229b6da209b2a527acf10e32_75_0.png)\n\
    \n尝试尝试不同的 'top' 和 'left' 值。\n\n"
