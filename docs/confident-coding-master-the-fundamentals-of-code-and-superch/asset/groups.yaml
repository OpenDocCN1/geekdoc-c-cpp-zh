    # Regular expressions


    Regular expressions are a little tricky to get grips with, but they are an extremely
    powerful way of processing text. At the end of this chapter we will be using them
    to get some data from a webpage and then process it to collect all the email addresses.


    Regular expressions allow you to search through a string and extract a particular
    piece of information, or substring.


    Regular expressions are our first example of code that requires a Python module
    – that is, an extra set of functions that extend Python’s standard functionality.


    To import the regular expressions Python module you use the code:


    ```

    import re

    ```


    Simple!

    Now let''s see it in action. Suppose you wanted to extract the name Rob from the
    string ''My Name is Rob.''. With regular expressions, you could do it like this:


    ```

    import re

    string = ''My Name is Rob.''

    result = re.search(''is (.*)'', string)

    print(result.group(1))

    ```


    We start by importing the re module


    +   6.24


    ```

