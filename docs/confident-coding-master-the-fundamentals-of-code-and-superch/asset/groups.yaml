    \ have padding of 15px on the top, right, bottom and left sides with as few commands\
    \ as you can: CC 19\n\n## Borders\n\nAdding borders to your elements is a simple\
    \ way to separate different parts of your webpage. Borders can make a complex\
    \ page much more readable, and are a good way to bring in a little graphical flair\
    \ without using images.\n\nLet’s remove everything from our webpage except the\
