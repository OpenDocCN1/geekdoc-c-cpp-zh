    \ advice would be to choose the default version (in my case Ice Cream Sandwich)\
    \ – this usually provides a good balance of modern features and large device support.\n\
    \nNext, you’ll see this screen with a ‘default activity’. An ‘activity’ in Android\
    \ development allows you to choose a single screen within our app. It is like\
    \ a page on a website, within a single app we might have a login activity, an\
    \ activity which shows a list of users and perhaps a settings activity.\n\nHere\
    \ we have several activity templates that we can choose from, which are useful\
    \ in a number of cases, but we’ll start with the simplest (and default) – the\
