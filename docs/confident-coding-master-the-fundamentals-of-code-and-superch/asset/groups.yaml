    ## 为 iPhone 或 iPad 构建应用程序


    点击 Next（下一步），你将看到选项屏幕：


    - 首先，填写 Product Name（产品名称）——你可以在这里输入任何你喜欢的名称，但我建议使用类似“Demo App”的名称。

    - 在 Organization Name（组织名称）处下，你可以填写你的公司名称或自己的名字。

    - Organization Identifier（组织标识符）类似于反向的域名——请选择一个像 com.yourname 这样的内容。

    - 名称和标识符只有在你将应用程序提交到 App Store 时才会被使用，因此此时你完全可以选择任何想要的内容。


    所有其他设置都可以保持默认值。我们正在使用 Swift 语言并为 iPhone 开发。


    点击 Next，系统会询问你将项目保存在哪里，请选择一个合适的位置（例如你的 Documents 文件夹），并点击 Create（创建）。


    片刻之后，你将看到 Xcode 界面，你的应用程序已经创建成功了——恭喜你！


    ## Xcode 界面


    这是我们的基础 Xcode 界面，值得花一点时间熟悉一下它。


    在常规 File（文件）、Edit…（编辑）菜单下方有一个顶部栏，左上有一个“Play”（播放）按钮，它可以让我们运行应用程序。尝试一下。大约 30 秒后，你将看到弹出一个小空白屏幕。这并不是世界上最有趣的应用程序——它只是一个空白屏幕——但这是一个开始。模拟器（The
    simulator）允许我们在不使用真实 iPhone 的情况下尝试应用程序。


    你实际上可以像使用 iPhone 一样使用它——点击 Hardware Home（硬件主页），你就会看到熟悉的 iPhone 主屏幕，并像操作普通手机一样与其进行交互。玩玩看，然后回到教程。


    顶部栏右侧有几个我们可以用来自定义界面的按钮：


    - 相互的圆形按钮显示 Assistant Editor（助手编辑器），它为我们提供了两个可以工作的窗口（这在以后非常有用）。

    - 右侧的三个蓝色矩形允许我们切换左侧、底部和右侧面板。尝试一下它们！

    - 双向箭头显示 Version editor（版本编辑器），我们在这里不会使用它。


    ## 实践


    进入屏幕的主体部分：


    - 左侧面板显示构成我们应用程序的文件列表。我们很快就会详细查看这些文件。

    - 中间窗口是我们进行大部分工作的地方。目前它显示我们应用程序的一些设置，但我们也将用它来编辑文件，并在应用程序上拖放按钮和标签。

    - 右侧面板是上下文感知的：它根据我们选择的内容显示不同的信息。目前我们没有选择任何内容，所以它没有显示任何内容，但在创建用户界面时，我们将频繁使用它。


    最后，如果你在模拟器中运行应用程序，你将在屏幕底部看到控制台，其中可能包含关于你应用程序的信息。

    这就是我们将看到错误消息和调试信息的地方——它可以非常有用。


    就是这些。你现在已经熟悉 Xcode 界面，我们可以开始构建我们的应用程序了。


    ## 为我们的应用程序添加标签


    Xcode 有一个非常简单的拖放系统，用于向我们的应用程序添加用户界面元素。我们将从添加一些标签（labels）形式的文本开始。


    在左侧面板中，选择 Main Storyboard。你可能需要使用双指缩放或点击 +/- 按钮才能看到右侧的整个矩形。


    View Controller（视图控制器）矩形代表我们的 iPhone 应用程序屏幕，目前是空白的。点击它，你会看到屏幕变化，包含更多设置和控制选项。


    在屏幕右下角，你现在会看到 Object Library（对象库），它提供了一个可以拖入应用程序的对象列表。在 ''Filter''（过滤器）框中输入 ''label''，并将标签拖入中间面板的
    iPhone 屏幕。


    当你拖动它时，你会看到出现蓝色的虚线，这可以帮助你定位标签。尝试将其放置在屏幕中心，如截图所示。


    现在你已经完成了，让我们运行应用程序（左上角的 Play 按钮或按 cmd-R）看看它看起来什么样。你应该看到类似 (8.1) 的效果：


    ## 8.1


    ![](img/57532e13229b6da209b2a527acf10e32_172_0.png)


    你的第一个非空白 iPhone 应用程序，恭喜！

    （注意，尽管使用了蓝色虚线，标签并没有居中。这是因为模拟器中运行的 iPhone 与中间面板中的 iPhone 不同。模拟器运行的是 iPhone SE，而中间面板显示的是
    iPhone 6S，后者更大。你可以随时点击‘iPhone SE’按钮更改模拟器设备，或点击‘View as: iPhone 6s’按钮更改中间面板中显示的设备。从现在起，我在这两个地方都使用
    iPhone 6S 以保持简单。）


    ## 自定义标签


    现在你已经添加了标签，确保它已被选中，然后查看上下文感知的右侧面板。它提供了一个下拉列表，包括文本、颜色和字体。大多数选项都是相当自言易懂的，所以尝试点击它们并玩玩看。


    ## 实践


    ### 自定义标签


