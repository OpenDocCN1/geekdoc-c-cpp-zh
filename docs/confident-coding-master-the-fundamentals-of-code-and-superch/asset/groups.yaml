    # Why learn HTML?


    Strictly speaking, HTML is not a-coding language, but a markup language. This
    means that with HTML you can change the content and layout of a website, but you
    are limited in terms of interactivity with users (so you couldn''t build Twitter
    with just HTML).


    This makes HTML a great place to start your coding journey because it is fairly
    easy to understand, and you can apply the skills you learn straight away building
    simple websites, or making changes to websites you own or manage. If you find
    an error on the company website, you can just fix it yourself, without having
    to bother the IT department.


    Later on in this book we will see how to combine HTML with JavaScript to start
    interactivity into your pages.


    # What software do I need?


    For this whole book, you only need to download one piece of software, and that
    is a text editor. This allows you to create and edit code in any programming language.


    You can use any text editor you like, but I would recommend downloading Brackets
    from www.brackets.io. It is free and open-source, and can be downloaded on Windows,
    Mac and Linux. It will automatically highlight and indent your code, making writing
    HTML a much more pleasant experience.


    > Note: You probably don''t need the Extract software that comes bundled with
    Brackets, so click the ‘Download Brackets Without Extract’ link.


    3.1 Brackets


    A modern, open source text editor that understands web design.


    ![](img/57532e13229b6da209b2a527acf10e32_35_0.png)'
