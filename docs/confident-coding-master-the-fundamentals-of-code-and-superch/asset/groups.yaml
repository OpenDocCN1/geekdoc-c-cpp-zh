    # Pursuing coding 13 further to become a developer


    Having considered how you can use your newfound coding skills to advance your
    career, and start your own business, we will now look at becoming a professional
    developer. Full-time coders are highly sought-after, full-time remunerated and
    have the flexibility of working in a range of industries solving a variety of
    problems. It is also a career that you can ''dip your toe into'' freelancing or
    completing small projects at the same time as your main


    We''ll start establishing whether a career in coding is right for you, and then
    go on to see how you can get into the sector. We''ll look at what languages and
    platforms to learn, how to build a portfolio and what you should have on your
    CV. Finally we''ll look at applying for both freelance and full-time jobs.


    A summary of this chapter would simply be to get experience of as much as you
    can. Apply for some freelance jobs, learn a range of languages, and practise by
    building real apps and websites. Not only will you learn fastest this way, but
    you''ll build a portfolio quickly, and find out which aspects of the work you
    enjoy, and which you don''t.


    # Should you become a full-time coder?


    As I''ve mentioned, becoming a developer is for many a great career choice. Coders
    are well paid, often have a fair amount of freedom within their role, and spend
    their days solving problems. If that sounds like something you would enjoy, read
    on!'
  - '[PAGE 249]


    Of course, as with any career, coding has its downsides. You''ll start at the
    bottom, and your income will by no means be meagre, it will take a few years before
    you can command the top salaries. The work can also be stressful, as managers
    might not have a strong grasp of the difficulties of the problems they are asking
    you to solve. Deadlines can be tight, and hours long, depending on the company
    you work for.


    Broadly speaking, there are two main career paths for a coder. You could simply
    get better and better at your craft, working at a higher level solving more difficult
    problems. If, while reading this book, you have found yourself researching some
    of the finer points of the languages we have covered, and trying to establish
    how they work, this will likely be a great route for you. The best coders can
    earn great salaries, and will often be headunted to join new startups, with potentially
    lucrative stock options.


    The other option is to take the more management-focused route. After several years
    coding, you might find that your time is better spent training or managing others,
    and gradually you will do less programming and more working with people. This
    path is perhaps better suited to those who enjoy coding, but appreciate working
    with people and having more control over the direction of a project.


    Of course, only you can decide if a career as a developer is for you, but unfortunately
    it is very easy to try out as a career by doing small projects and freelance work.
    Before we see how to get freelance gigs, let''s take a moment to think about what
    languages and platforms you should focus on.


    # What languages should you learn?


    If you have gone through all the exercises in this book, you will already be familiar
    with a range of languages. For front-end web development (that is, code to create
    and manipulate web pages), we have learned HTML, CSS and JavaScript. We learned
    Python for back-end, or server-side, development. For apps, we covered Swift for
    iOS apps, and Java for Android. We even looked briefly at AppleScript and Powershell
    for automation. That''s not a bad selection!


    My hope from having covered all of these is that you should have some idea of
    what type of development you prefer. You might want to be a jack-of-all-trades,
    and build both apps and websites, in which case you should simply learn what you
    need to build your next project.'
  - '[PAGE 250]


    # Pursuing coding further to become a developer


    # Web development


    If you want to focus on web development, which is probably the most broad area
    in terms of sheer numbers of jobs and projects available, there are a couple more
    languages I would recommend investigating. The first is PHP, which is the most
    widely used server-side language (80 cent of websites use PHP at the time of writing).
    If is what WordPress is written in, and is an extremley quick way to build a simple
    site.


    The second is MySQL, which is a database language. We haven''t discussed databases
    yet in this book, but they are a critical component of most websites and apps,
    and they are used to store data, such as usernames, passwords and user content.
    The most typical simple website would use HTML, CSS and JavaScript on the front-end,
    and PHP and MySQL on the back-end. As a result, a rudimentary knowledge of PHP
    and MySQL is a necessity for any web developer.


    There are of a whole range of further languages and frameworks you can learn for
    web development. jQuery is a commonly used JavaScript library that makes working
    with JavaScript a lot easier. If you enjoyed the Python section, you should look
    at Django, a popular framework for building websites with Python. Ruby is another
    server-side language that is increasing in popularity.


    Beyond these bases, my advice would very much be to learn languages and platforms
    as needed – build websites for yourself and others, and as you develop the need
    for a new feature or search the web and see what you find. Let the tools fit the
    project, not the other way around.


    # App development


    If you want to build apps, your choices are a little more restricted, and although
    there are other options available, unless you have strong reason to do so I would
    advise sticking with the languages and IDEs (Integrated Development Environments)
    covered in this book. That is Swift and Xcode for iOS development, and Java and
    Android Studio for Android.


    These are the most straightforward, and most documented, ways to build apps for
    iOS and Android, so becoming an expert in those languages and IDEs would be strongly
    advised if you want to build apps.


    If you''re not sure which direction you would like to go in, just keep an open
    mind and keep building things. It is likely that you will develop a'
  - '[PAGE 251]


    preference for, or get offered a job in, one particular platform and set of languages,
    but if that hasn''t happened yet don''t worry about it – just keep on learning.


    # Getting freelance jobs


    One of the great advantages of coding as a career choice is that you can earn
    money from it straight away as a freelancer. Even if you have relatively little
    coding experience, you should be able to find jobs that suit your level. Of course,
    never claim to be able to complete a job that you won''t be able to, but at the
    same time don''t underestimate yourself. Be confident when looking for freelance
    work, and commit to doing a great job for your client.


    When you are just setting out on a freelance career, there is one important to
    remember: in the early days, you are not primarily there to earn money. This may
    sound strange, but it''s true: your primary goals should be to learn your craft
    and build a portfolio. Those two are far more valuable than whatever you might
    earn from a freelance gig, so think of any money you earn as a bonus.


    Think of getting freelance work as a free Coding MBA. Instead of paying tens of
    thousands of pounds for lectures on business techniques and writing essays, you
    are learning a craft and getting practical business experience for free. Any money
    you receive in the early months is icing on the cake.


    This is important to remember because a substantial portfolio and significant
    experience you will likely not be able to charge a great deal for your work. So
    be prepared to put the hours in now, knowing that the big rewards will come later.


    With any work you do, make sure to get a review from the client, ideally on a
    central platform such as LinkedIn.com, as references are extremely useful for
    getting both freelance and full-time work later on. A lesser-known but very powerful
    place to put reviews is Google Maps – if you set up your business as a local one
    (using your home address is fine, but you could also use the address of a local
    shared working space if you ask their permission), you can ask your clients to
    post reviews twice.


    Not many developers do this, so when people do local searches for web and app
    developers, it is likely with just a small number of five-star reviews you could
    be the top result.


    There are two primary ways to get freelance work – locally, or in-person, and
    using freelance websites.'
