    \n注意：`print` 命令是使用 tab 键缩进的。如果你正确输入了第一行并按回车键，网站应该知道你想对第二行进行缩进，因此它会自动为你完成。如果没有这样做，请按电脑上的\
    \ tab 键来缩进。\n\n结果符合你的预期吗？`for` 命令启动了一个被称为“循环”（loop）的东西，它会多次执行一段代码。`x` 是一个变量，代表一个值，在这种情况下是数字。`range(1,11)`\
    \ 部分让循环中的 `x` 分为 1, 2, 3, ... 直到 10（可能让你惊讶的是，代码中并不包含 11）。最后，`print(x)` 部分打印变量\
    \ `x` 的值。因此，输出就是简单的数字 1 到 10。\n\n# 挑战 1\n\n你能修改上面的代码让它打印 10 到 20 的数字吗？\n**解答：**\
    \ 你应该将代码修改为：\n\n```python\nfor x in range(10, 21):\n    print(x)\n```\n\n如果你做到了，恭喜你！\n\
    \n打印数字从 1 到 10 似乎距离构建下一个 Uber 或 Snapchat 还有很远，但这是所有编码员的起点，即使在构建复杂的软件或语音识别系统时，同样的原理也适用。\n\
    \n# 为什么有这么多编程语言？\n\n对于新程序员来说，一个常见的问题是学习哪种编程语言，这引出了为什么会有这么多语言的问题。对于人类语言来说，我们在数千年的时间里在不同的地理社区中发展出了许多语言。而对于计算机语言，它们的发展更具刻意性，这意味着不同的语言是为不同的目的设计的。你不需要成为每种语言的专家，有些非常伟大的编码员确实非常精通一种语言，但你应该意识到语言运行的上下文环境。\n\
    \n我们稍后会详细介绍这一点，但目前你将用代码创建的软件大致有三类。我们把第一类称为应用程序（apps）。应用程序的代码存储在设备上（通常是电脑、手机或平板电脑）上，并在该设备上运行。一个应用可能是\
    \ Excel、或者邮件客户端，或者是像 Firefox 这样的浏览器。它可能是一个游戏《愤怒的小鸟》，或者是像手机上的备忘录应用这样的实用工具。应用程序是大多数人谈论软件时所指的内容，它们也是最容易理解的。\n\
    \n接下来我们有显示网站的代码。这通常不存储在你的机器上，而是每次加载网站时都会重新下载。浏览器（本身也是应用，如 Chrome、Safari 或 Firefox）下载并处理代码以向你展示网站。这被称为客户端代码（client-side\
    \ code），因为是在客户端电脑或手机（即你的设备）上处理的。\n\n最后，我们有运行在服务器上的代码，或服务端代码（server-side code）。服务器就像是一台始终连接互联网的强大计算机。你的电子邮件存储在服务器上，你的\
    \ Twitter Feed 以及《Words With Games》的游戏状态也是如此。当你登录网站时，你使用用户名和...\n\n# 应用语言\n\n\
    按最流行的移动开发语言来说，有 iOS 的 Swift 和 Android 的 Java。如果你在为桌面和笔记本电脑构建应用，有一系列语言，包括 C、Python\
    \ 和 Java。如果你想学习移动开发，iOS 的 Swift 和 Android 的 Java 是你的最佳选择。\n\n如果你现在不知道想用代码做什么，只需跟着跟着书学习即可，我会教你一系列语言，这样在你完成之后，就可以决定把注意力放在哪里。\n\
    \n# 总结\n\n现在你已经对代码的作用以及可用的各种不同语言和平台有了良好的概述，是时候开始了。\n\n在接下来的章节中，我们将查看前端 Web 开发的三种主要语言：HTML、CSS\
