  - '[PAGE 30]


    Finally, we have codes that runs on a server, or server-side code. A server is
    like a very powerful computer that is always connected to the internet. Your email
    is stored on a server, as is your Twitter feed and the current state of your Words
    With Games. When you log into a website, you use the username and password to
    the server, which then runs some server-side code to check if the login details
    are right, and if it returns the appropriate page. If not, it will give you an
    error message.


    For each of these three types of software there are a range of languages we can
    use. Please don''t feel you to know the names of all of these languages; you will
    become more familiar with most of them as you go through this book, but it is
    useful to be aware of the most popular languages in each category.


    # Languages for building apps


    Apps are generally designed for one particular platform. That platform might be
    Windows, macOS, or Linux for desktops and laptops, or iOS (for iPhones and iPads)
    and Android (for phones and tablets). There are other platforms but these are
    by far the most popular.


    The mobile platforms each have languages that they are designed for. iOS development
    was traditionally done in a language called Objective-C, but in 2014 Apple introduced
    a new language called Swift, which is becoming more popular, and what is what
    we use in this book. For Android, a language called Java (note Java is not related
    to JavaScript) is used by default. It is possible to use other languages, but
    not recommended for beginners.


    On Windows, most programs are written in C++, which is related to Objective-C
    (both are derived from an early programming language simply known as C). Some
    apps are written using a platform called .NET, which mostly uses a language called
    C#, another variant of C. There are a greater range of other development tools
    and languages for Windows than there are for the mobile platforms. You can use
    Java and Python, among other languages, to build Windows programs.


    On macOS, with iOS, the default languages are Objective-C and Swift. Because of
    its open nature, you can use almost any language, including Java, Python, and
    two other languages, Perl and Ruby, to build Linux applications.


    Because most new developers are keen to make mobile apps, we will be focusing
    on Android and iOS development (so Java and Swift) in this book, but it is relatively
    easy to move from those to other languages if you wish.'
  - '[PAGE 31]


    # Client-side languages


    If you are building websites, there are three core languages that you will need
    to control how the site looks and-behaves. The first is HTML, or Hypertext Markup
    Language, which is what controls the content of a site. The second is CSS, or
    Cascading Style Sheets, which determines the styles, such as fonts, colours and
    layouts. The third is JavaScript, which allows your website to be dynamic, and
    change the content and styles based on user interaction. These three languages
    are inescapable in client-side, or ‘front-end’, development, and they are the
    three languages that we will start with in this book.


    # Server-side languages


    By the most popular language for website server-side (also known as ‘backend’)
    code is PHP, short for Hypertext Preprocessor. This currently powers around 80
    cent of websites, but there are other options. Python, is also used, as a language
    called Ruby. You can also use Perl, Java and even Swift to write server software.


    Phew! That’s a lot of languages, and as I say, you don’t need to remember all
    these names. If you are still wondering which language to learn, it depends on
    what you want to do. If you want to build websites, HTML, CSS and JavaScript are
    crucial. For the backend, I would recommend Python first (as it is a very easy
    language to learn), and PHP if you find it necessary. If you want to learn mobile
    development, Swift for iOS and Java for Android are your best bets.


    If you have no idea what you want to do with coding at this point, simply follow
    along with the book and I’ll teach you a range of languages so you can choose
    where you want to focus your attention when you have finished.


    # Summary


    Now that you have a good overview of what coding is for and the range of different
    languages and platforms available it’s time to get started.


    In the next section we will be looking at the three main languages for front-end
    web development, HTML, CSS and JavaScript, and one for the backend, Python. This
    will give you a great grounding in a range of different programming styles and
    techniques, and give you the power to create and manage your own websites.'
