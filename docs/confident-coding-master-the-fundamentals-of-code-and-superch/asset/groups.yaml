    ## Pursuing coding further to become a developer


    ## Getting local freelance jobs


    The obvious place to begin looking for local work is with your current social
    circle. Think about colleagues, friends and family – do any of them have a website
    that needs updating, or an app idea they would like to build? At this point you
    may offer your work for free, or in exchange for co-ownership of the website or
    app, but don''t be afraid of charging a fair price if you do a job for a profit-making
    business.


    Another good place to find work is in local meet-ups – go to see what is available
    in your local area. Most towns and cities have a number of weekly networking events
    – if yours doesn''t perhaps you could set one up. When you go along, be friendly
    and helpful (and don''t be afraid to introduce yourself as a developer!). It is
    likely some work will come your way, by which you should certainly charge. Do
    a great job for a good price and don''t be surprised when others start seeking
    you out.


    ## Getting freelance work online


    Local freelance jobs are a great place to start, but the market can be limited
    and highly competitive. Fortunately, there are a number of websites such as upwork.com
    or freelancer.com where you can bid for freelance jobs all round the world.


    The competition is strong, and it may take a few attempts before you get your
    first paid gig, but remember that you have a few crucial advantages over the more
    experienced developers on those sites:


    - You''re primarily to learn. Your first job may take three hours and earn you
    $10, that''s fine because you will have learned a great deal about communicating
    with clients, fixing website code and bidding for a project. Not only that, but
    you will have earned your first five-star review (a proud moment, I can tell you!)


    - You can take your time. Most developers on those sites post generic bids on
    a large number of projects. You''re still learning, so you can take your time
    and post a thoughtful, relevant bid that shows you''ve actually read the details
    of the post. Believe me, bids like that are few and far between.


    - You can use geography to your advantage. If you live in the United States or
    Europe, make the most of this by offering to speak to the client on the phone,
    and using polished English when bidding and replying to messages. By doing this,
    you''ll stand out from the competition.


    ## Future-proofing your career with coding


    - You can go the extra mile. As you''re there to learn, you can do more than what
    the client asked for without worrying about the extra time spent. If you''re setting
    up Wordpress, install a caching plugin for them to speed up their site. If you''re
    making a webform, use some custom CSS to make it beautiful. Reply quickly and
    thoroughly to all their questions, and earn their gratitude.


    I''ll say it again – you will earn money here, but that is your secondary goal.
    Primarily, you''re here to learn how to do freelance web development, and build
    up your online portfolio and positive reviews.


    ## Pick a freelance site, and stick with it


    The hardest part of getting your first gig will be overcoming your lack of positive
    reviews. For that reason, I''d advise picking one freelance site and sticking
    with it, at least for now. You can join another later, but once you''ve got three
    five-star reviews on freelancer.com, you''ll find it much easier to find work
    there than you will with an empty profile on elance.com.


    We won''t go into the strengths and weaknesses of each freelance site, as these
    can change dramatically over time. I''d simply advise that you check out a few
    of them and pick whichever site you like the look of. Check that you can receive
    funds in your country and that you are happy with their payment terms, and sign
    up – don''t waste a lot of time going through all the sites. I''ve had the most
    experience with freelancer.com, so I''m going to focus on that site, but the others
    all work in a similar way.


    Here''s my list of sites you should check out:


    - upwork.com

    - freelancer.com

    - peopleperhour.com

    - guru.com

    - craiglist.com


    A really useful comparison of these and other sites is available online at www.freshbooks.com/blog/2013/01/16/freelance-jobs.
    It''s focused on writing than web development but the same principles apply.


    ## Creating your profile


    Once you''ve picked which site you want to work with, you need to sign up and
    create your profile. When you create your profile, use the following tips:


    - Use your real identity. You''ll want all the parts of your online presence to
    tie together, use your real name, upload a photo and talk about yourself.


    - Be honest. Don''t claim to have skills you don''t have. At this stage ''Proficient
    in HTML, CSS and JavaScript'' would suffice, and you can add further skills as
    needed.


    - Link to your Twitter feed. If the freelance site allows, put in a link to your
    Twitter feed – this will add authority to your profile and reassure prospective
    clients that you are a genuine developer. If you don''t have a Twitter account,
    set one up – in the early days it will increase clients'' confidence in you, and
    as your community and following grow it can be a source of work in itself.


    - Complete the exams. Most freelance sites have ''exams'' that you can take both
    in language (English being the most useful) and various coding languages. They
    usually cost around $50, but are worth it.


    ## Bidding for gigs


    Initially, look for simple projects, making sure to keep your price low and your
    communication fast:


    - Keep your price. While you''re learning, it''s okay to charge a lower rate to
    get your first reviews. Once you have some feedback, you can increase your rates.


    - Avoid advanced jobs. Don''t take on projects that are far beyond your current
    skills. Start with smaller tasks and build up your confidence.


    - Clarify the requirements. Before starting, make sure you understand exactly
    what the client wants. Avoid vague requests like ‘build me a site’.


    - Agree on payment structure. Even with small projects, it is important to establish
    how you will pay. Use milestones to protect yourself.


    - Beware of buyers with no reviews. If a buyer has no feedback, be careful. It
    is particularly important to make sure the job requirements are clear and that
    a milestone is paid before you start work.


    ## Building a portfolio


    As a developer, your portfolio website will likely be more important than your
    CV. Your site should make clear what your strengths are as a developer, and showcase
    some of your best work. It should make potential clients and employers excited
    to work with you.


    Your website should reflect your style and personality, so if possible create
    from scratch. If you prefer, however, there are a range of WordPress themes you
    can use to create a great-looking portfolio quickly. It is important that your
    portfolio site looks good, so I would advise spending $50 or so on a theme from
    templatemonster.com or themeforest.


    Take some time to browse some of the best developers’ portfolio sites, and include
    their features. Project Stories are particularly useful to potential clients and
    employers. In a Project Story you explain the clients’ needs, how you met them,
    and what technologies you used to achieve their goals. Combined with a screenshot
    or a link to the project itself, and a testimonial from the client, this can be
    a very powerful way to show your level of experience and competence.

