    这种不歧义性（此处应为精确性）的巨大优势是，你可以确定只要代码写对，计算机就会完全按照你的意愿执行。与经常产生意外之外结果的人类对话不同，计算机将始终完全按照指令执行，无论你喜不喜欢。


    ## 但不需要编码也能控制计算机


    你可能在想：“但我不需要编码就能用我的电脑和手机完成我需要的一切。”在过去的 30 年里，像 Windows 和 MacOS 这样高度易用的操作系统（以及移动设备上的
