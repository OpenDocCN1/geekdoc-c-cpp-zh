  - '[PAGE 162]


    # Self-coding your site


    You might be wondering why I''ve left the option of building a website from scratch
    until last, especially in a book like this. It''s simply because if you want to
    get a website up and running quickly, usually the best way to do that is to use
    some kind of CMS, such as Wordpress.


    Having said that, if you want to avoid the setup and complications that come with
    a CMS you might well want to build your site from scratch. This will give you
    complete control over the site content, as well as teaching how websites function
    from the ground up.


    So we''ll start by uploading a very simple site, adding some HTML to it, and finally
    we''ll see how to use a framework such as Bootstrap to make our website look great
    on a range of screen sizes (this is known as building a responsive website).


    # Editing the index.html file for your site


    Your web hosting control panel should include a File Manager, allowing you to
    access and edit your files. Access the File Manager, and find a folder with a
    name like ‘public_html’. This is where your website files should be stored (if
    you have problems finding the folder, contact your web hosting provider).


    Once you have found the public website folder, look for a file called index.html.
    If it''s not there, create it in the File Manager. Then edit it (again, you should
    be able to do this in the File Manager).


    Add the following code:


    ```

    <h1>Hello World</h1>

    ```


    Then save the file and open up your domain name in a browser. You should see something
    like this out (7.2):


    ![](img/57532e13229b6da209b2a527acf10e32_162_0.png)


    Hello World


    Hurrah! Your HTML page is now available for all the world to see. Of course, you
    can now use any of the HTML, CSS and JavaScript that you have learned and put
    it in that file to customize your webpage.'
  - '[PAGE 163]


    # Using FTP to manage your website files


    You might be thinking that building a complex site by typing code into a File
    Manager would be a bit of a hassle, and you''d quite right. Every time you want
    to edit your site, you''d have to log in to your control panel, open the File
    Manager, find the file, open the edit window and get to work.


    A better way to interact with your files is via FTP, or File Transfer Protocol.
    FTP allows you to connect to your website files and upload, download and edit
    files directly. It''s much more convenient than using a File Manager.


    You should be able to get your FTP settings from your web hosting provider, and
    once you have them, all you need is an FTP program. There are several free options,
    including:


    +   - https://filezilla-project.org/ – Windows, Mac and Linux.

    - www.smartartftp.com/ – Windows only.

    - www.coreftp.com/ – Windows only.

    - https://cyberduck.io/ – Mac only.


    However, my FTP program of choice is FileFTP, which is an addon for the Mozilla
    Firefox browser. It works on any platform, and is very easy to use. To get it,
    you''ll need to first download Firefox at www.firefox.com and then download FTP
    from http://fileftp.net/


    Once those are installed, you''ll need to enter your FTP login details, click
    OK and then click Connect. If all goes well (and you can contact your web hosting
    provider if it doesn''t) you''ll see a list of the files on your server, and you
    can navigate to the public_html folder to see your website files.


    Once you see the index.html file, you can right-click on it and select ''Open''
    to edit it directly in your text editor.


    Alternatively, you can download it to your computer, edit it there, and upload
    it again again when you are finished.


    # Using a web framework


    You have probably noticed that the websites we''ve built so far have not been
    beautiful. We focused primarily on the content, and let the browser choose how
    to display it. This leaves us with webpages that are functional, but look like
    they were built in the 90s.


    If you are a great designer, you can customize the look of your site to your heart''s
    content. However, for most of us, a quick solution to this is to use a web framework,
    which is essentially a collection of CSS and JavaScript which make our websites
    look better.'
