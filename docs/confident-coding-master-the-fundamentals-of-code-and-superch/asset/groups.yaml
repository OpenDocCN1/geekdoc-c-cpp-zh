  - '[PAGE 275]


    > If you want to teach yourself one of the most important skills of the future,
    read this book.

    it makes understanding coding easy and is a brilliant jumping-off point for anyone
    to build a more exciting and sustainable career.

    Tricia Keelleher, Head of the Stephen Perse Foundation


    Confident Coding is the book for if you want to master the fundamentals of coding
    and kick-start your career. Coding is one of the most in-demand skills on the
    job market, and grasping the basics can advance your creative potential and make
    you stand out from the crowd.


    Rob Percival gives you a step-by-step learning guide to HTML, CSS, JavaScript,
    Python, building iPhone apps and building Android apps and debugging. After reading
    this book and honing your skills with its online exercises, you will be able to
    code in each of these languages, build your own website, build your own app and
    have the confidence to supercharge your employability.


    If you want to impress employers, the ability to code can give you the edge over
    the competition and prove that you''re ready to take on the challenges of the
    digital world. If you are a self-employed entrepreneur, being able to create your
    own website or app can grant you valuable freedom and revolutionize your business.
    Learning to code doesn''t have to be scary or intimidating. Confident Coding shows
    you how to master the essentials and take your career to new heights.


    Rob Percival is a web developer and entrepreneur who has taught over 500,000 students
    how to code through his his online courses on Udemy. His courses have been translated
    into five languages and have taught people all around the world to become proficient
    and confident web developers.


