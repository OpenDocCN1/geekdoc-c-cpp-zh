  mdcn: '


    # 使用编程提升你的职业生涯


    主管可以跟踪每位消防员通过了哪些测试，从而知道该推荐他们参加正式考试。


    自从创建了这款应用以来，已经有几个附近的地区联系约翰，希望使用这款应用。虽然现在还处于早期，但它可能会成为一个非常有用的教学和学习工具，由全英国各地的消防站建立。


    为你自己或同事开发应用程序可以让你“量力而行”，解决一个你明知至少对少数人存在的问题，因为你自己也面临这个问题。你还将从同事那里获得快速的反馈（有好的，也有坏的！），而且你的应用程序完全有可能成长为比你想象更大的东西。


    # 撰写博客


    在 Facebook 和 Twitter 的世界里，写博客可能显得有些过时。你完全可以在社交媒体上培养粉丝（我们将在本章的后半部分讨论如何更有效地这样做），但经营自己的博客有几个独特的优势。首先，建立一个博客比创建一个
    Facebook 或 Twitter 账号更困难这一事实本身就说明了你是认真的。这是一种向世界宣告你你有话要说，而且你足够投入，能够定期创作人们喜欢的内容。


    其次，因为这是你自己的博客，你对内容拥有完全控制权。你不像在社交网络上那样受到内容显示方式或谁可以查看的限制。


    第三，也是最重要的，存在“谷歌效应”。无论你处于什么行业，潜在的雇主将越来越多地使用搜索引擎来寻找求职者。如果你运行并更新一个博客，当人们搜索你时，它几乎会成为搜索结果的顶部。对于潜在的雇主来说，这是一个非常令人印象深刻的事情。


    第四，拥有自己的域名变得越来越有用。正如我们所看到的，域名是一个网络地址，像 google.com 一样。拥有 robber-.co.uk 对我来说非常有用，我强烈建议你现在停止阅读并购买属于你的名字。如果你有一个常见的名字，你可能需要尝试备用的域名扩展名，如
    .me、.blog，或者你可以像博客主 John Gruber 那样发挥创意，当他在 daringfireball.com 建立博客时就是这样做的（我们将在本章稍后介绍更多细节）。


    # 用编程为职业规划未来


    第五，你可以利用博客建立一个社区，并将自己定位为权威人物。如果你编写有用且具有挑战性的内容，你将开始建立一群对你所做的事情感兴趣的志同道合者的粉丝。通过鼓励他们在你的文章下发表评论，你可以结识这些人，并形成一个以你为中心的社区。这是一个非常强大的工具，并从中发展出一整系列机会。


    最后，一旦你建立了一个读者群，如果你希望博客本身变现，可以通过提供特殊内容的订阅、推荐产品，或使用该平台发布你的下一个大大创业想法。


    写博客还有数不胜数的好处。你将被迫自己写得清晰且连贯，用生动且有趣的方式表达你的观点。这在所有行业中都是一种稀缺且宝贵的技能。它将澄清你的思考和想法。随着你写作的增多和观众的增长，它将建立你的信心。它可以帮助人们关注你关心的事业，甚至改变公共政策。它将带来新的经历、结新的人，并提高你的技术和营销技能。当然，你将通过分享知识、经验或仅仅是娱乐他们来帮助他人。


    # 选择主题


    到此时，你可能在想“我没什么东西可以写”。这并不是事实。你可能并不觉得自己特别独特，但你是世界上唯一拥有这套经历、技能和爱好的人。如果如果没有什么你关心的、比大多数人了解并且想要与世界分享的东西，我将会非常惊讶。


    如果你不确定可以写什么，拿一支笔和一张白纸。写下20个你感兴趣的主题。这些可以是爱好、音乐或艺术风格、世界地区、运动、与工作相关的问题、慈善或政治事业、技术或任何其他事情。想一下你希望哪些主题被报道，以及你可能在哪些主题上特别有优势讨论。最好的博客写作是有见解且充满激情的，但那些建立成功博客的人很少是他们所在领域的伟大权威。他们只是致力于定期创作高质量内容的普通人。


    如果你仍然不确定自己可以写什么，你可能只需要选择对你的工作非常诚实，分享作为会计师、老师或航空公司飞行员的日常生活。或者你也可以开始一个全新的爱好或学习新东西，并对这个过程写博客。你甚至可以记录学习编程的过程！


    就像创业一样，开始写博客有点紧张，需要勇气的跨越来迈出第一步，但它是极有回报的，你永远不知道它会通向何方。


    # 博客成功故事


    # 起因


    关于人们通过写博客成就伟大事业的故事有很多。一个特别令人印象深刻的故事是 Martha Payne，她来自苏格兰，九岁，在 http://neverseconds.blogspot.co.uk/
    上创建了“Never Seconds”博客，描写她学校食堂糟糕的质量。在三个月内，该博客引起了国家媒体的关注，当地当局迅速开始改善学校的食物。Martha
    为马拉维的学孩子们筹集了超过10万英镑，赢得了《观察者》年度美食博客奖，并出版了一本关于她经历的书。（出版书籍是写热门博客的常见结果，如果这是你清单上的一个项目，那么又有另一个理由去尝试了。）


    # 成为全职工作的爱好


    John Gruber 是一个来自费城的城的软件开发人员，他在2002年启动了他的 Daring Firefox 博客。他写任何他感兴趣的话题，主要是与苹果相关的话题、软件开发和用户界面。他以写作充满激情、清晰且有鲜明见解而闻名。博客的人气逐渐增长，直到2010年，Steve
    Jobs 在给用户的一封邮件中提到了某篇关于构建 iPhone 应用的第三方应用的特定帖子。这个引起争议的话题被媒体报道，并将 Daring Firefox
    推向了巨大的全新人气水平。


    博客在2006年成为 Gruber 的全职工作，收入来自赞助、广告和联盟营销链接。联盟链接是指向特定产品的链接，当用户购买或类似产品时，Gruber 会获得固定金额或购买金额的百分比。我们稍后会更多讨论联盟链接。Gruber
    的故事表明，他花了四的时间才产生全职收入，你不需要任何特殊的权威、经验或内部消息。他只是一个以完全改变他生活的方式分享观点的开发者。


    # 泥泞风格 (Muddy style)


    博客不需要提供尖锐的观点或震惊的真相——它们也可以是趣味。Hero Brown 在2011年启动了 muddystiletto.co.uk/，帮助白金汉郡的人寻找最好的用餐和购物场所。到2012年11月，博客已成为
    Brown 的全职工作，并随后扩展到提供九个郡的信息。


    这些是成功博客的例子，但还有更多。Cassidy 先生分享他六岁孩子的活动 http://mcassidy.blog/。J Brown 在 www.brownyoga.com
    上写瑜伽，并根据他的写作建立在线工作坊。Mark Lee 在 http://marksacc.co.uk/ 上写会计，他的博客构成了他的咨询和演讲业务的基础。


    无论你想通过职业生涯实现什么，开始博客都是一个很好的开始。


    # 如何开始博客


    创建博客就像构建任何其他网站，所以对于购买域名、获取网络托管和其他通用话题，我将你参考第7章。你为博客做的主要决定是使用什么平台。就像网站开发一样，有一系列博客平台可以使用，包括
    wordpress.com、tumblr.com 和 blogger.com。所有这些平台都允许你快速建立博客，但有一个很大的缺点，你并不完全拥有你的内容。如果你想移动到另一个提供商，这将非常困难。你可能在可以使用哪些功能或可以使用哪些样式、布局和网站结构上受到限制。


    我的建议是使用自托管平台，而博客主最常用的平台是 WordPress。（注意：WordPress.com 本质上是 WordPress 的托管版本 – 它们提供大致的功能，但在自托管设置中你对网站有更大的控制权。）关于为你的
    WordPress 网站设置托管的建议，请参见第7章。


