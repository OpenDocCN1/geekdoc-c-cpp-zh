    ## 进阶学习编程成为开发者


    在考虑了如何利用新学学的编程技能来提升职业生涯或创业之后，我们现在将探讨如何成为一名专业开发者。全职程序员非常受青睐，薪资丰厚，并且可以灵活地在各个行业工作，解决各种问题。这也是一种让你可以在从事主业的同时，“涉水”尝试兼职或或完成一些小项目的职业。


    我们将首先开始确定编程职业是否适合你，然后介绍如何进入该领域。我们将研究应该学习哪些语言和平台、如何构建作品集，以及你的简历中应该包含哪些内容。最后，我们将介绍如何申请兼职和全职工作。


    本章的总结可以简单地概括为尽可能积累经验。申请一些兼职工作，学习一系列语言，并通过构建真实的应用程序和网站来练习。通过这种方式，你不仅学得最快，还能快速建立作品集，并发现你喜欢工作的哪些方面，不喜欢哪些。


    ## 你应该成为全职程序员吗？


    正如我提到的，成为开发者对很多人来说都是一个极好的职业选择。程序员的薪水很高，通常在职责范围内有相当大的自由度，每天都在解决问题。如果这听起来是你喜欢的事，，请继续读下去！


    当然，像任何职业一样，编程也有它的缺点。你会从底层做起，你的收入绝不会微不足道，但需要几年时间才能获得高薪。这项工作也可能压力很大，因为经理可能并不充分了解要求你解决的问题的困难程度。取决于你工作的公司，截止日期可能很紧，工作时间可能很长。


    总的来说，程序员有两条主要的职业路径。你可以不断提高自己的技艺，在更高的水平上工作并解决更困难的问题。如果，如果你在阅读这本书的过程中，发现自己正在研究我们所涵盖的语言的一些细微之处，并尝试建立它们是如何运作的，那么这对你来说可能是一条很棒的路线。程序员可以获得丰厚的薪水，并且经常会被猎头挖掘加入初创公司，并可能获得丰厚的股票期权。


    另一个选项是选择更偏向管理的路线。在编程了几年之后，你可能会发现将时间花在培训或管理他人身上更好，你会逐渐减少编程工作，增加与人打交道的机会。这条路线可能更适合那些喜欢编程，但又喜欢与人相处并希望对项目方向有更多控制权的人。


    当然，只有你自己才能决定开发者这一职业是否适合你，但遗憾的是，通过做小项目和兼职工作来尝试这一职业非常容易。在看如何获得兼职机会之前，让我们花点时间思考应该关注哪些语言和平台。


    ## 你应该学习哪些语言？


    如果你已经完成了书中的所有练习，你已经已经熟悉一系列语言了。对于前端 Web 开发（即创建和操作网页的代码），我们学习了 HTML、CSS 和 JavaScript。我们学习了用于后端（或服务器端）开发的
    Python。对于应用（App），我们涵盖了用于 iOS 应用的 Swift 和用于 Android 的 Java。我们甚至简要查看了用于自动化的 AppleScript
    和 Powershell。这是一个不坏的选择！


    我希望在涵盖了这些内容之后，你对自己偏好的开发类型有一个大致的了解。你可能想成为一个“多面手”，既构建应用又构建网站，在这种情况下，你只需要学习构建下一个项目时所需的知识即可。


    ## 进阶学习编程成为开发者


    ### Web 开发


    如果你想专注于 Web 开发（从可用职位和项目的数量来看，这可能是范围最广泛的领域），我还有几个建议你研究的语言。第一个是 PHP，它是最广泛使用的服务器端语言（在本书时，80%
    的网站使用 PHP）。它是 WordPress 编写的语言，也是构建简单网站的一种极快速的方法。


    第二个是 MySQL，它是一种数据库语言。我们在这书中还没有讨论过数据库，但它们是大多数网站和应用程序的关键组成部分，用于存储数据，例如用户名、密码和用户内容。最典型的简单网站会在前端使用
    HTML、CSS 和 JavaScript，在后端使用 PHP 和 MySQL。因此，对于任何 Web 开发者来说，PHP 和 MySQL 的基础知识是必须的。


    对于 Web 开发，你还有一系列进一步的语言和框架可以学习。jQuery 是一个常用的 JavaScript 库，它让操作 JavaScript 变得简单得多。如果你喜欢
    Python 部分，你应该看看 Django，陆一个使用 Python 构建网站的流行框架。Ruby 是另一种日益受欢迎的服务器端语言。


    除了这些基础之外，我的建议非常明确：根据需要学习语言和平台——为你自己和他人构建网站，当你产生对新功能的需求或在网上搜索时，看看你发现了什么。让工具去适应项目，而不是反之亦然。


    ### 应用开发


    如果你想构建应用，你的选择会稍微受限，尽管还有其他选项，但除非你有充分的理由，否则我建议坚持书中涵盖的语言和 IDE（集成开发环境）。即用于 iOS 开发的
    Swift 和 Xcode，以及用于 Android 的 Java 和 Android Studio。


    这些是为 iOS 和 Android 构建应用最直接、文档最全的方法，因此如果你想构建应用，强烈建议成为这些语言和 IDE 的专家。


    如果你不确定想向哪个方向发展，只需保持开放的心态并继续构建东西。你可能会发展出自己的偏好。


    ## 获取兼职工作


    编程作为一种职业选择的巨大优势之一是，你可以作为兼职者立即赚钱。即使你的编程经验相对较少，你也应该能找到适合你水平的工作。当然，永远不要声称能完成你实际上无法完成的任务，但同时不要低估自己。在寻找兼职工作时要充满自信，并承诺为客户提供出色的工作。


    当你刚开始兼职职业生涯时，有一点需要记住：在早期阶段，你首要的不是为了赚钱。这听起来很奇怪，但它是事实：你的首要目标应该是学习你的技艺并建立作品集。这两者的价值远高于你从任何兼职工作中获得的任何钱，所以把赚到的任何钱看作奖金即可。


    把获得兼职工作看作一次免费的编程 MBA。你不需要花费数万英镑来听商业技巧讲座和写论文，你正在学习一项技艺并免费获得实践商业经验。在前几个月获得的任何钱都是锦上添花。


    记住这一点很重要，因为在拥有大量的作品集和丰富的经验之前，你可能无法为自己的工作收取高昂费用。所以要准备好现在投入时间，知道巨大的回报将会到来。


    对于你做的任何工作，请确保从客户那里获得一份评价，最好是在 LinkedIn.com 这样的中心平台上，因为推荐对于以后获得兼职和全职工作都非常有用。另一个不为人知但非常有力的评价地方是
    Google 地图——如果你将你的业务设置为本地业务（使用家庭地址可以，但你也可以征得许可使用当地共享办公空间的地址），你可以要求客户发布两次评价。


    '
