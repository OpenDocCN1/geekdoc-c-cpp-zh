  - '[PAGE 175]


    # In practice


    The ‘import UIKit’ command imports the UIKit module, which allows us to interact
    with the User Interface (UI).


    The following line defines the ViewController class, which is essentially a chunk
    of code that we can use to control the view, or in other words to customize our
    app screen.


    The ‘override fun viewDidLoad()’ line defines a function (also known as a method)
    which will be called when the app loads. This is where we will put any code that
    we want to run when the app is loaded.


    ‘super.viewDidLoad()’ runs some default commands to set the view, and ‘didReceiveMemoryWarning’
    is a method used if we have problems with memory. We will not be working with
    that method as we are building relatively simple apps here.


    To write your first piece of Swift code, move the cursor underneath the ‘super.viewDidLoad()’
    code and run the following:


    ```

    print("Hello World")

    ```


    Run the app and see if you can spot what happened. You may have spotted that nothing
    happened on the app itself, but in the bottom pane in Xcode the words ‘Hello World’
    appeared (8.4):


    ![](img/57532e13229b6da209b2a527acf10e32_175_0.png)


    That is what the print command does – it displays output in the console so we
    can see what our program is doing.


    This is fairly useful, but really we want to use our app to display something
    to the user, so to that we’ll need to interact with the user interface.


    # Interacting with the user interface


    Now we are going to use code to edit the user interface (UI). Specifically, we
    are going to update the main label to read ‘Hello Rob’ instead of ‘Hello World’.


    To change the user interface (UI) using code, we need to create what is known
    as an Outlet. This is essentially a variable that we can refer to, for example,
    a label or a button. To do that, first click on the interlinked circles button
    in the top right of the screen to bring up the assistant editor.'
- md: "\nThen, in the assistant editor window click the icon with the four linked\
    \ squares and select Recent Files → Main Storyboard to see the Storyboard, or\
    \ screen layout.\n\nFinally, you might want to click the box with right hand line\
    \ button at the bottom of the assistant editor window to hide the View Controller\
    \ Scene. Your Xcode scene should now look like this (8.5):\n\n## 8.5\n\n```swift\n\
    ViewController.swift viewDidLoadDidLoad()\n// /\n// ViewController.swift\n// Demo\
    \ App\n// /\\n// Created by Rob Percival on 29/08/2016.\n// Copyright © 2016 Rob\
    \ Percival. All rights\n// reserved.\n// /\n//\n// import UIKit\n//\n// class\
    \ ViewController: UIViewController {\n    override func viewDidLoad() {\n    \
    \    super.viewDidLoad()\n        // Do any additional setup after loading\n \
    \       the view, typically from a nib.\n\n        print(\"Hello World\")\n  \
    \  }\n\n    override func didReceiveMemoryWarning() {\n        super.didReceiveMemoryWarning()\n\
    \        // Dispose of any resources that can be\n        recreated.\n    }\n\
    }\n```\n\nNow comes the tricky bit. Move the mouse to the ‘Please sign in’ label,\
    \ press ctrl and hold on your keyboard, and then drag the mouse over to the ViewController.Swift\
    \ file, just underneath where it says ‘class ViewController’. If all goes well\
    \ you should see a window with ‘connection’, ‘object’, ‘name’, ‘type’ and ‘storage’\
    \ options pop up.\n\nThis allows you to create an outlet for the label. Type ‘label’\
    \ into the Name field (you can use a different name if you like) and click Connect.\
    \ This will add the line:\n\n```swift\n@IBOutlet var label: UILabel!\n```\n\n\
    to ViewController.swift file, which will allow you to use the ‘label’ variable\
    \ to refer to the label.\n\nNow we just need to add our code to update the label\
    \ text. Underneath your ‘print’ statement, add this Swift code:\n\n```swift\n\
    label.text = \"Hello Rob\"\n```\n\nAs you might guess, this updates the label\
    \ text to the string 'Hello Rob'. Run the app and check it out. You should see\
    \ this (8.6):\n\n### 8.6\n\nHello Rob\n\n![](img/57532e13229b6da209b2a527acf10e32_177_0.png)\n\
    \nHurrah! We have interaction between our code and our UI. Our next challenge\
    \ is to make the button do something, so that the user can instruct the app to\
    \ take some action.\n\n## Making buttons interactive\n\nNow we will change our\
    \ app so that the user taps the 'Sign in' button, the words 'sign in' are printed\
    \ to the console.\n\nThis process is similar to updating the label, but this time\
    \ we will create an Action rather than an Outlet. In Xcode, ctrl-drag the button\
    \ to just underneath the 'class ViewController' code, just as before. You should\
    \ see the 'connection', 'object', 'name', 'type' and 'storage' popup again.\n\n\
    This time, click on 'Outlet' and change the option to 'Action'. Then in the Name\
    \ box type buttonClicked. Click Connect and the following code will be created:\n\
    \n```swift\n@IBAction func buttonClicked(_ sender: AnyObject) {\n}\n```\n\nThis\
    \ is a function, or method that will be called when the button is clicked.\n\n\
    ## Challenge 3\n\nAdd code to your app so that the words 'sign in' are printed\
    \ to the console when the button is tapped.\n\nSolution: Inside the buttonClicked\
    \ method, just add the code:\n\n## Building an app for iPhone or iPad\n\n```swift\n\
    print(\"sign in\")\n```\n\nSo the whole function looks like this:\n\n```swift\n\
    @IBAction func buttonClicked(_ sender: AnyObject) {\n    print(\"sign in\")\n\
    }\n```\n\nNow run the app and tap the button, and you should find that it works\
    \ as expected.\n\n## Challenge 4\n\nCreate a new app with a label that is initially\
    \ empty and a single button that says ‘Click Me’. Then, when the button is clicked\
    \ change the label text to ‘Hi there’\n\n**Solution:** First click File → New\
    \ → Project to create a new project and use the same settings as before. Then\
    \ add a label, double click on it and press backspace to delete the text. Then\
    \ add the button. Create an Outlet for the label and an Action for the button\
    \ by ctrl-dragging in the same way we did previously. Finally, add the code:\n\
    \n```swift\nlabel.text = \"Hi there!\"\n```\n\nto the buttonClicked() method.\
    \ This should give you the following (8.7):\n\n![](img/57532e13229b6da209b2a527acf10e32_178_0.png)\n\
    \n## Challenge 5\n\nRun it on the simulator and the app should say 'Hi there!'\
    \ when the button is tapped.\n\nAdd a text field to placeholder text 'What is\
    \ your name?'. Then change the code so that when the user taps the button label\
    \ text becomes 'Hello [user's name]'.\n\nHint: You'll need to create an Outlet\
    \ for the text field, and get the text field's value. You'll also need to append\
    \ that to 'Hello' to create the required string. The process for getting the text\
    \ field's value is the same as for labels, and appending works the same way as\
    \ in JavaScript. Xcode will give you an error message at some point – use the\
    \ automatic 'fix it' command to fix the error.\n\nSolution: Add the text field\
    \ and create an Outlet for by ctrl-dragging. I'll call it textField but you can\
    \ use any variable.\n\n```swift\nlabel.text = \"Hello \" + textField.text\n```\n\
    \nThis sets the app like (8.8):\n\n![](img/57532e13229b6da209b2a527acf10e32_179_0.png)\n\
    \n## Building an app for iPhone or iPad\n\nNote that we need to put ! after Int(number)\
    \ because there is a chance that the conversion will not work. For example, in\
    \ this code:\n\n```swift\nvar number = \"2\"\nvar secondNumber = number * 5\n\
    ```\n\nwe get an error, because number is defined to be string. To fix that, we\
    \ can use Int to convert number to integer:\n\n```swift\nvar number = \"2\"\n\
    var secondNumber = Int(number)! * 5\n```\n\n## In practice\n\nThis code now works.\
    \ Note that we need to put ! after Int(number) because there is a chance that\
    \ the conversion will not work. For example, in this code:\n\n```swift\nvar number\
    \ = \"rob\"\nvar newNumber = Int(number)! * 5\n```\n\nwe would get a crash, because\
    \ Swift would not be able to convert the string ‘rob’ to a number.\n\nFinally,\
    \ if we wanted to multiply a number by a decimal we would need to convert it into\
    \ a ‘float’ (ie a ‘floating point’ number, or a decimal). We would do using this\
    \ code:\n\n```swift\nvar number = \"8.4\"\nvar newNumber = Float(number)! * 5.3\n\
    ```\n\nFeel free to play with these commands to get grips with them. In fact,\
    \ Xcode has a great mode called ‘Playgrounds’ where you can type in code and see\
    \ the output straight away, which is perfect for experimentation like this. To\
    \ create a playground, click File → New → Playground in Xcode and start typing\
    \ some code.\n\nNote: If you test these lines of code in an Xcode playground,\
    \ you will likely get a warning that ‘The variable was not mutated: changing var\
    \ to let’. This is because as well as using var to create a variable in Swift,\
    \ we can use let to create a constant (ie a variable that doesnt change). This\
    \ is preferred by Xcode, so if you have a variable that doesn’t change value,\
    \ like number in the above examples, you should define it using let rather than\
    \ var.\n\n## Variable types in Swift\n\nWe are almost ready to build our currency\
    \ app, but we need to learn about variable types. In the JavaScript and Python\
    \ sections we learned about variable types, including strings, numbers and Boolean\
    \ (true or false). Swift is what is known as 'strongly typed' language, meaning\
    \ that when a variable is used in a function, it has to be of the correct type.\
