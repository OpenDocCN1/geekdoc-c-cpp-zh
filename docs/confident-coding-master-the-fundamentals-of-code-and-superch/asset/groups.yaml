    # Python 06


    At the risk of boring you silly, let''s quickly recap what we''ve learned so far.
    We started off looking at HTML, which allowed us to add content to webpages. Then
    we learned CSS, which we could use alongside the HTML to add styles and customize
    the layout of our webpage. Next, we saw how we could use JavaScript, our first
    ‘proper’ programming language, to make our pages interactive and allow the user
    to do something on our page and get a response.


    What''s missing in our coding armoury? Well, so far everything we are doing happens
    completely in the user''s browser. To be able to build software that allows users
    to communicate with each other, we need something called a server. A server is
    essentially a computer that is always on and always connected to the internet.
    Our computer can then contact that server to download information, save some content
    on the server (such as our latest tweet) or send data (such as an email) to another
    computer.


    ![](img/57532e13229b6da209b2a527acf10e32_120_0.png)


    Therefore to be able to build truly powerful websites and apps, we need to write
    code that can run on a server. Although it is possible to use JavaScript on a
    server, it is more common to use other languages such as PHP or Python. Here we
    are going to use Python, for several reasons:


    +   - Python is a simple and straightforward language, even more so than JavaScript;


    +   - Python can be used to build software on almost any platform, from servers
    to Raspberry Pi''s, enabling you to build anything from websites to robots; and


    +   - Python can be used to automate daily tasks, such as getting information
    from websites or automatically renaming your files (we''ll see how to do that
    later in this chapter).'
  - '[PAGE 121]


    # What is Python?


    Python was developed in the late: 1980s by Guido Van Rossum in the Netherlands.
    Van Rossum named the language after Monty Python, being a big fan of their Flying
    Circus.


    Van Rossum is still actively involved in the development of the language, and
    as such has been given the title Benevolent Dictator For Life (BDFL) by the Python
    community.


    Since its birth it has gone through a number of versions, and is currently at
    version 3. It is used widely to build both web-based and desktop applications,
    as well as on Internet Things devices such as the Arduino. This makes it an extremely
    powerful and flexible language to learn.


    # Why learn Python?


    > I don''t want to build robots, do I really need to learn another language?


    If you are not looking for a career in coding, you might be wondering it''s worth
    learning a second language after JavaScript. The answer is, of course, yes, but
    why?


    Learning two languages allows you to see what languages have in common (and what
    they don''t). Once you know how to create a loop in two languages, you''ll be
    clearer on the critical parts of a loop are. The same is true with statements
    and variables. Every language has its own idiosyncrasies, and if you only learn
    one language you won''t have much insight into what they are.


    So stick with me - even if you''re not convinced learning two languages is useful,
    if you ever have to extract, for example, all the email addresses from a webpage,
    Python can do that for you (and we''ll see how at the end of the chapter).


    # What will this chapter cover?


    As usual, we will go through the whole process of running some Python, building
    up our skills and then practising with a few projects and exercises.


    We''ll also be working towards a big project, where we''ll attempt some ''website
    scraping'' – collecting data such as names and email address from a webpage. This
    will be your toughest yet.'
