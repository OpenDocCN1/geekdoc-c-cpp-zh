  - '[PAGE 53]


    The &lt;table&gt; tag is pretty self-explanatory – it indicates that we want to
    display a table. &lt;tr&gt; is short for ''table row'', and defines the beginning
    of a new row in our table.&lt;th&gt; is short for ''table header'', so each of
    these is a one-column header for our table.


    After the table headers, we use &lt;/tr&gt; to signify the end of the first row,
    and another &lt;tr&gt; to start a new row.&lt;td&gt; is short for ''table data''
    and is how we refer to the content of a cell in our table. Each row should have
    the same number of columns (in this case 3).


    Trying that into your text editor and seeing how it looks. You should see something
    like this (3.17):


    ![](img/57532e13229b6da209b2a527acf10e32_53_0.png)


    You can see that the table cells are nicely lined up with each other, and that
    the table headers are in bold. Voila – our first table!


    Question: Add three more rows to your table representing three members of your
    family or friends.

    Answer: Your HTML should look something like this:


    ```

    &lt;table&gt;

    &lt;tr&gt;

    &lt;th&gt;Name&lt;/th&gt;

    &lt;th&gt;Age&lt;/th&gt;

    &lt;th&gt;Gender&lt;/th&gt;

    &lt;/tr&gt;

    &lt;/table&gt;

    ```'
