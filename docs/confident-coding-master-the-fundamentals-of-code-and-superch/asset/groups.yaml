    # Coding and entrepreneurship


    At the same time, what can you learn from your competitors? What are you doing
    well that you could incorporate into your business? Don''t be afraid to steal
    great ideas!


    What if you don''t find any competitors? It could of course mean that you have
    come up with a genuinely new idea, but not necessarily. It may well mean that
    there simply isn''t a market for your idea, or that people have tried and failed
    (or you are searching with the wrong keywords).


    Once you have done your competitor research, you should have a fairly clear idea
    of what makes your business unique, and better than the competition. So now it''s
    time to build it, right? Not yet. First you need to reach some potential customers
    and talk to them about what they would want your product or service.


    At this point, you can hopefully see another benefit of having a blog, or some
    sort of online following. If these people were your target market, you could contact
    them individually or collectively to get their feedback.


    If you don''t have easy access to potential customers or, the process will be
    a little harder, but not impossible. If you are targeting a specific niche, find
    out where these people are (both in real life and virtually). Find a way in your
    local area and offer to them a coffee or lunch in exchange for feedback on your
    idea. If there are forums or Facebook groups dedicated to people in your niche,
    post there.


    Face-to-face feedback is particularly valuable, as internet comments tend towards
    the flippant and critical. When you are speaking to clients, at all possible try
    to get a firm commitment. If you ask ‘would you use this’, they will almost certainly
    say yes, for the same reason friends and family want to support you. Asking ‘how
    much would you pay for this’ is often more revealing. You could even ask them
    for a payment then and there (refundable if they are not happy with the product),
    to establish just how keen they are.


    What if you don''t have a specific niche, or you have no way of getting in touch
    with potential customers? One great solution is to create a simple ‘Coming Soon’
    website, and ask people to sign up to your newsletter if they are interested.
    Include the key features of the product and a rough date when you plan to launch,
    and perhaps some screenshots if you have'
  - '[PAGE 245]


    # Future-proofing your career with coding


    any. You could do this with a Wordpress theme, using a service such as mailchimp
    to manage the email sign-ups.


    Once you have built your site, tell your friends and family about it and ask them
    to share it. You could even run a small campaign to drive traffic to the site
    – spending £100 on Google or Facebook ads could be money well if it saves you
    hours building a website no-one wants.


    The crucial thing at each stage is to evaluate your idea objectively. Don’t put
    off if one person tells you it will never work, but at the same time it likely
    not be wise to ‘keep the faith’ in the face of overwhelming evidence that there
    is not a market for your product, or that market is currently served very well
    by existing businesses.


    # Creating a minimum viable product


    All right, so you are convinced that there is a target market for your product
    or service, and that you are able to create something better than anything that
    currently exists? Great. It’s time to get to work!


    The phrase ‘minimum viable product’ (MVP) nearly expresses the idea that you should
    build the smallest thing that you can satisfy your customers. It is tempting for
    budding entrepreneurs to feel that their website or app has to do everything –
    it has to have more features, better looking, and be easier to use than anything
    else available. Sometimes this is true, but in most cases it’s more important
    to do one thing extremely well, than it is to do everything your customers need.


    Google is a classic example. Their homepage had (and, largely, still) has a simple
    search box and two buttons. The one thing they did really well help people find
    the information they were looking for. Not all businesses can be quite that minimal,
    when designing your product you should try to establish what the one thing is
    that your business does better than anyone else, and focus on that.


    The big advantage of the MVP approach is that you can get something in the hands
    of your users as early as possible. As they say in Silicon Valley, if you are
    not embarrassed about your product at launch, launched too late. This is not to
    say you should release a half-baked product, but you should focus on releasing
    as early as possible, rather than adding extra features. That way, you can get
    feedback from real users from the beginning, meaning that you’ll be adding features
    that they actually want, rather than ones you think they want.'
  - '[PAGE 246]


    # How much to charge?


    Pricing is often a very difficult subject for entrepreneurs, and of course the
    best thing to do varies dramatically depending on what you are providing, and
    to whom.


    The best piece of advice I''ve ever heard on how much to charge is don''t compete
    on price. This doesn''t mean that you shouldn''t make your pricing competitive,
    but if your USP is ''we are cheaper'', that will likely not be enough in itself
    to make your business take off.


    The simplest way to choose your pricing is to charge a similar amount to your
    competitors. Charging less will not necessarily help you grow as much as you might
    think. Firstly, if people think of your business as the cheaper option, it might
    be difficult to convince them that you are also better. Secondly, if you charge
    less will inevitably attract the sort of customer that is relatively price-sensitive.
    They will then be more likely to leave if a cheaper (or even free) service becomes
    available. Ideally, you want people to use your business because you offer something
    better than they can get elsewhere – that way you will build a loyal base of users
    who love your product.


    # Do things that don''t scale


    In today''s relatively mature business environment, it can be difficult to see
    how you can compete with big businesses, who can devote much more time and money
    to creating a great product. The first answer to this is to focus on a niche that
    is too small for big businesses to be interested in. The second is to ''do things
    that don''t scale''; that is, spend time making your customers happy in a way
    that would be impossible in a large business.


    In my company Eco Web Hosting, the apparent USP was that the hosting was environmentally
    friendly. But when I asked people what they liked most about the company, what
    they usually said was the service. Because I ran the company myself and provided
    all the support, they were always dealing with the person who knew exactly how
    the website worked, and was the one who would fix all the problems, and who could
    make decisions about special discounts or extra services. This is something that
    big hosting companies with their first-line, second-line and third-line support
    departments, couldn''t match.'
  - '[PAGE 247]


    # Start-up story


    In the summer of 2008, Joe Gebbbia and Brian Chesky, couldn''t pay their high
    San Francisco rent. They decided to rent out three air mattresses on their floor
    and serve breakfast. Three people showed up, paying $80 each. They thought this
    might be a big idea, so they built a website allowing people to share their spare
    rooms. The company got two bookings per month after their initial ‘big launch’,
    and around $800 per month for several months.


    The founders realized that most people judged the properties on the photos, and
    most of the photos on the website were not great. So they bought a fancy camera,
    and visited individual houses that were listed on the site, offering to take photos
    for them for free. This took a lot of time and effort, but slowly they started
    to grow, eventually becoming the multibillion dollar company that Airbnb is.


    Taking photos of their users’ rooms is obviously something that they wouldn''t
    be able to do at scale, but in the short term it made all the difference. Is there
    something you could do to make your business or service stand out, even if it
    wouldn''t scale?


    # Summary


    I hope now that you''ve identified the best idea from the list that you wrote
    at the beginning of this chapter, and that you are looking forward to testing
    it out and creating your MVP. Starting a business is one of the most exciting
    things you can do, and will teach you a huge amount about the world, and yourself.


    We are now moving on to see how you might proceed if you wanted to pursue coding
    further and actually become a web or app developer. Even if you''re not planning
    on a career change, I would recommend reading this final chapter, as we will also
    cover how to earn an income from coding by freelancing. This is something anyone
    can do, regardless of your current role and, like starting a company, is a great
    way to improve both your coding and business skills.'
- md: "\n## Pursuing coding further to become a developer\n\nHaving considered how\
    \ you can use your newfound coding skills to advance your career, and start your\
    \ own business, we will now look at becoming a professional developer. Full-time\
    \ coders are highly sought-after, full-time remunerated and have the flexibility\
    \ of working in a range of industries solving a variety of problems. It is also\
    \ a career that you can 'dip your toe into' freelancing or completing small projects\
    \ at the same time as your main.\n\nWe'll start establishing whether a career\
    \ in coding is right for you, and then go on to see how you can get into the sector.\
    \ We'll look at what languages and platforms to learn, how to build a portfolio\
    \ and what you should have on your CV. Finally we'll look at applying for both\
    \ freelance and full-time jobs.\n\nA summary of this chapter would simply be to\
    \ get experience of as much as you can. Apply for some freelance jobs, learn a\
    \ range of languages, and practise by building real apps and websites. Not only\
    \ will you learn fastest this way, but you'll build a portfolio quickly, and find\
    \ out which aspects of the work you enjoy, and which you don't.\n\n## Should you\
    \ become a full-time coder?\n\nAs I've mentioned, becoming a developer is for\
    \ many a great career choice. Coders are well paid, often have a fair amount of\
    \ freedom within their role, and spend their days solving problems. If that sounds\
    \ like something you would enjoy, read on!\n\nOf course, as with any career, coding\
    \ has its downsides. You'll start at the bottom, and your income will by no means\
    \ be meagre, it will take a few years before you can command the top salaries.\
    \ The work can also be stressful, as managers might not have a strong grasp of\
    \ the difficulties of the problems they are asking you to solve. Deadlines can\
    \ be tight, and hours long, depending on the company you work for.\n\nBroadly\
    \ speaking, there are two main career paths for a coder. You could simply get\
    \ better and better at your craft, working at a higher level solving more difficult\
    \ problems. If, while reading this book, you have found yourself researching some\
    \ of the finer points of the languages we have covered, and trying to establish\
    \ how they work, this will likely be a great route for you. The best coders can\
    \ earn great salaries, and will often be headunted to join new startups, with\
    \ potentially lucrative stock options.\n\nThe other option is to take the more\
    \ management-focused route. After several years coding, you might find that your\
    \ time is better spent training or managing others, and gradually you will do\
    \ less programming and more working with people. This path is perhaps better suited\
    \ to those who enjoy coding, but appreciate working with people and having more\
    \ control over the direction of a project.\n\nOf course, only you can decide if\
    \ a career as a developer is for you, but unfortunately it is very easy to try\
    \ out as a career by doing small projects and freelance work. Before we see how\
    \ to get freelance gigs, let's take a moment to think about what languages and\
    \ platforms you should focus on.\n\n## What languages should you learn?\n\nIf\
    \ you have gone through all the exercises in this book, you will already be familiar\
    \ with a range of languages. For front-end web development (that is, code to create\
    \ and manipulate web pages), we have learned HTML, CSS and JavaScript. We learned\
    \ Python for back-end, or server-side, development. For apps, we covered Swift\
    \ for iOS apps, and Java for Android. We even looked briefly at AppleScript and\
    \ Powershell for automation. That's not a bad selection!\n\nMy hope from having\
    \ covered all of these is that you should have some idea of what type of development\
    \ you prefer. You might want to be a jack-of-all-trades, and build both apps and\
    \ websites, in which case you should simply learn what you need to build your\
    \ next project.\n\n## Pursuing coding further to become a developer\n\n### Web\
    \ development\n\nIf you want to focus on web development, which is probably the\
    \ most broad area in terms of sheer numbers of jobs and projects available, there\
    \ are a couple more languages I would recommend investigating. The first is PHP,\
    \ which is the most widely used server-side language (80 per of websites use PHP\
    \ at the time of writing). It is what WordPress is written in, and is an extremely\
    \ quick way to build a simple site.\n\nThe second is MySQL, which is a database\
    \ language. We haven't discussed databases yet in this book, but they are a critical\
    \ component of most websites and apps, and they are used to store data, such as\
    \ usernames, passwords and user content. The most typical simple website would\
    \ use HTML, CSS and JavaScript on the front-end, and PHP and MySQL on the back-end.\
    \ As a result, a rudimentary knowledge of PHP and MySQL is a necessity for any\
    \ web developer.\n\nThere are of a whole range of further languages and frameworks\
    \ you can learn for web development. jQuery is a commonly used JavaScript library\
    \ that makes working with JavaScript a lot easier. If you enjoyed the Python section,\
    \ you should look at Django, a popular framework for building websites with Python.\
    \ Ruby is another server-side language that is increasing in popularity.\n\nBeyond\
    \ these bases, my advice would very much be to learn languages and platforms as\
    \ needed – build websites for yourself and others, and as you develop the need\
    \ for a new feature or search the web and see what you find. Let the tools fit\
    \ the project, not the other way around.\n\n### App development\n\nIf you want\
    \ to build apps, your choices are a little more restricted, and although there\
    \ are other options available, unless you have strong reason to do so I would\
    \ advise sticking with the languages and IDEs (Integrated Development Environments)\
    \ covered in this book. That is Swift and Xcode for iOS development, and Java\
    \ and Android Studio for Android. \n\nThese are the most straightforward, and\
    \ most documented, ways to build apps for iOS and Android, so becoming an expert\
    \ in those languages and IDEs would be strongly advised if you want to build apps.\n\
    \nIf you're not sure which direction you would like to go, just keep an open mind\
    \ and keep building things. It is likely that you will develop a preference for.\n\
    \n## Getting freelance jobs\n\nOne of the great advantages of coding as a career\
    \ choice is that you can earn money from it straight away as a freelancer. Even\
    \ if you have relatively little coding experience, you should be able to find\
    \ jobs that suit your level. Of course, never claim to be able to complete a job\
    \ that you won't, but at the same time don't underestimate yourself. Be confident\
    \ when looking for freelance work, and commit to doing a great job for your client.\n\
    \nWhen you are just setting out on a freelance career, there is one important\
    \ to remember: in the early days, you are not primarily there to earn money. This\
    \ may sound strange, but it's true: your primary goals should be to learn your\
    \ craft and build a portfolio. Those two are far more valuable than whatever you\
    \ might earn from a freelance gig, so think of any money you earn as a bonus.\n\
    \nThink of getting freelance work as a free Coding MBA. Instead of paying tens\
    \ of thousands of pounds for lectures on business techniques and writing essays,\
    \ you are learning a craft and getting practical business experience for free.\
    \ Any money you receive in the early months is icing on the cake.\n\nThis is important\
    \ to remember because a substantial portfolio and significant experience you will\
    \ likely not be able to charge a great deal for your work. So be prepared to put\
    \ the hours in now, knowing that the big rewards will come later.\n\nWith any\
    \ work you do, make sure to get a review from the client, ideally on a central\
    \ platform such as LinkedIn.com, as references are extremely useful for getting\
    \ both freelance and full-time work later on. A lesser-known but very powerful\
    \ place to put reviews is Google Maps – if you set up your business as a local\
    \ one (using your home address is fine, but you could also use the address of\
    \ a local shared working space if you ask their permission), you can ask your\
    \ clients to post reviews twice.\n\nNot many developers do this, so when people\
    \ do local searches for web and app developers, it is likely with just a small\
    \ number of five-star reviews you could be the top result.\n\nThere are two primary\
    \ ways to get freelance work – locally, or in-person, and using freelance websites.\n"
