    # Conclusion


    If you’ve made it to the end of this book, congratulations! You’ve learned at
    least six programming languages, and considered a wide range of ways you can use
    your skills in your current role, and to develop your employability and create
    a side income.


    More importantly, I hope you now feel comfortable with the technology you use
    every day; with an understanding of how the apps and websites you use function,
    will be able to use them in more advanced ways to work more effectively and even
    start creating your own.


    So, what now? In the latter chapters of this book I outlined several opportunities
    that learning to code brings you. I hope you have already starting taking on some
    of those opportunities, but just in case, I would like to recap some of the primary
    next steps. You should aim to choose between two and five of these to ensure your
    development continues, and you get the most out of reading this book.


    # Work better


    Write down a list of lists that you could work more efficiently or effectively
    using some of the technologies we have covered. Think about repetitive tasks that
    you do regularly that could be automated, reports that you could produce more
    regularly or even in real time, or ways of speeding up research tasks. Consider
    using services like If This Then That, text expansion and AppleScript or PowerShell
    to speed up your workflow.


    Alternatively, consider how your office or work environment could be made better
    for you and your colleagues. Perhaps an automatic email requesting feedback on
    recent changes, or asking how happy staff are in their roles. Could technology
    make communication more effective in your company or department, or is there an
    app or website you could create to serve your customers better?


    Using your coding skills to work better is a great way to provide more value for
    your employer and your customers, which will inevitably benefit you as your colleagues
    notice what you have achieved.'
  - '[PAGE 261]


    # Build a website or app


    Creating small tools to work better is a great start to profit from your newfound
    skills, but if you are looking for a bigger project, create a complete website
    or app. The website might be a blog which we have seen seen builds up your online
    presence, generates a community and challenges you to write regularly.


    Alternatively, you might see a need for a particular community that you are part
    of to have an online space, or have an idea for a tool or service that would help
    you in your job or hobby that others might be interested in. Whatever it is, build
    it and see what happens - you never know what can come from creating something
    new.


    # Become an entrepreneur


    Coding skills are unrivalled in their capacity to allow you to start your own
    business, whatever your idea. Reread chapter 12 if this is something you''re interested
    in, as it guides you through coming up with an idea, finding out whether it is
    something people want and building it.


    Remember, you don''t need to feel like you are building the next Facebook – just
    find a niche where you can provide a simple product or service that is better
    than what is currently available. The long term plan can come later. Building
    a business online is the best way I know to teach yourself entrepreneurship, and
    in the process find out more about yourself, and of course upgrade your coding
    skills.


    # Become a developer


    If you are considering a full career change, go back to Chapter 13 to find out
    if being a full-time developer is for you. Remember you can dip your toe in the
    water by finding freelance work, especially by attending networking events in
    your local area and finding people who need apps or websites built.


    At the same time, building a portfolio site and enhancing your online presence
    will be useful regardless of whether or not you become a full-time developer.'
