- md: '

    # Coding and entrepreneurship


    run that business. If you are particularly creative, look for business ideas that
    will allow you to use your creativity. If you enjoy working with numbers, look
    for ideas where numbers are critical to your success.


    The second factor is what you enjoy doing. Usually people enjoy what they are
    good at, so often the two overlap, but not always. I love singing and playing
    the guitar, but I''m yet to make a career out of it. But you are much more likely
    to succeed if you actually enjoy the tasks that will be required of you to create
    and grow that particular idea. For each idea, imagine yourself going ahead with
    it and actually doing the day-to-day activities. They seem fun to you? If so,
    you''ll be much more likely to make a success of the business.


    I often think of these three factors as a Venn diagram, in which the perfect business
    idea for you lies in the centre, at the overlap of your skills, experiences and
    what you enjoy doing (12.1).


    ![](img/57532e13229b6da209b2a527acf10e32_240_0.png)


    Take a few minutes now to think about business ideas based on your own personal
    experience – they could relate to your job, hobbies or any aspect of your life.
    Brainstorm as many ideas as possible – aim for at least 20. Most ideas will appear
    crazy, ridiculous or impossible at first, but get them down anyway as crazy ideas
    can often be the seed of a very sensible business.


    # Startup story


    Alice Hall was 27 in 2012, and was struggling to pay her bills. On a whim, she
    bought £90 of dresses and resold them online. They sold quickly, and she used
    the profits to buy £180 of dresses. Again, they sold well, and she carried on
    buying and selling dresses until she was ready to create her own website, pinkboutique.co.uk.
    As of June 2016, the business has a turnover of £7 million, selling 2,000 dresses
    a day around the world. You don''t need extensive business experience or a big
    upfront investment to build a successful business, you just need to start.


    # Products vs services


    It is important to draw a distinction between product- and service-based businesses,
    as both have quite specific advantages and disadvantages.


    A service-based business might be a web hosting company, or a platform for finding
    good cleaners. Google, Facebook and Vodafone are service-based businesses. Services
    have the huge advantage of potential for recurring revenue. This is when a customer
    pays a regular fee for an ongoing service. Having recurring revenue is extremely
    powerful because you can rely on a certain amount coming in each month. And as
    your user base grows, it naturally adds to your income for the long term. Of course,
    you need to provide value for your users for as long as they are paying you, but
    if you can do that a recurring revenue stream is a boon for any business.


    A product-based business might be an ebook, a video course, or reselling dresses.
    Apple, John Lewis and L’Oréal are primarily product-based businesses. They can
    be easier to set up, because you don''t need to create a complex service for your
    users. It is also potentially to differentiate yourself from competitors, especially
    if you are the only business that sells your particular product. However, recurring
    revenue is less likely with a product-based business, and you will need to continually
    create new products to bring in new income.


    Both types of business can be successful, but it is worth being clear what type
    your idea is. Take a few minutes to divide the ideas you wrote down into product
    and service businesses, and think about the potential for recurring revenue, or
    how you will grow your business by creating new products.


    # Some example ideas


    If you''re still short of ideas, remember that your first business is unlikely
    to be your most successful. In the early stages, the important thing is to try
    something. You will make mistakes, and there is only so much you can learn from
    books, so it''s best to get out and start making those mistakes now. Even if your
    business is not successful, you will have learned a huge amount, about coding,
    marketing and how to make something people love.


    So here are a few simple ideas for your very first business that almost anyone
    can try. Each of them will require you to test the market, create a product or
    service, and then actively promote it – the core skills of starting any business.


    # An ebook


    I''m not suggesting you should write a great novel, but creating an ebook is much
    the same process as starting a business. Choosing a subject, you should look at
    something you could write confidently and competently about, and ideally a unique
    angle on. It doesn''t have to be a masterpiece, but should provide useful information
    that people are actively looking for. You can publish an ebook for free on Amazon.


    # A video course


    Various websites now allow you to upload and sell video courses, including udemy.com,
    stackskills.com and videodirect.amazon.com. As with ebooks, choose a topic that
    there is a market for, and that you could teach well.


    # A WordPress plugin or theme


    We have already seen that WordPress powers 25% of the web. Therefore there is
    a huge potential market for addons and extras. There are also well-established
    platforms for providing your products directly to WordPress users. Themes are
    available at wordpress.org/themes/, and if you have a good eye you could easily
    create a popular theme. While all the themes on that page are free, you could
    charge for extra features, or sell your themes directly on sites like themeforest.com.


    WordPress plugins (wordpress.org/plugins/) add extra functionality to WordPress,
    and you can find anything that offers a new feature, or smoother interface.


    # Your unique selling point


    It is important to establish your unique selling point, or USP, for your business.
    This is the one reason people should choose your product or service rather than
    anyone''s. It might be because the product itself is higher quality, or faster,
    or better looking. Or your service might have some features that aren''t available
    anywhere.


    For each of the ideas you''ve written down, write down what the USP would be.
    If you can''t think of one, it''s likely that idea will not go far.


    # When should you start your business?


    At the beginning of my business career I used what I call the scatter-gun approach.
    I would have what I thought was a fantastic idea (or at least convince myself
    that I could build a better website, than an existing company). I would say ''If
    only my business could be the size of company here.'' I would then run off and
    build the website, only to find out that getting customers was harder than I thought,
    or the service wasn''t as popular as I hoped. I would then get another idea and
    move on.


    The downside of this approach is that you will inevitably spend a lot of time
    on businesses that end up unsuccessful. Having said that, I learned a lot (and
    made many mistakes) with those businesses, and when I hit upon an idea that was
    successful, I was able to apply the lessons I learned and not make those mistakes
    again.


    In short, there is nothing wrong with going on and creating the website or product
    you are thinking about, and seeing what happens. However, there is a smarter way
    that will help you establish whether your idea is a good one before going to the
    trouble of building it.


    # Validating your idea


    How do you know if your idea is a good one? This is often a very difficult question
    to answer but there are a few general techniques you can use.


    Firstly, don''t listen to your friends and family, unless they have particular
    skills or experience in your niche. Friends and family generally want you to be
    happy, and will be keen to encourage you on your new mission, and as a result
    are not a reliable guide as to whether the idea is a good one or not. Discuss
    it with them all, but ''all my friends said it is a great idea'' is not a good
    enough reason to start.


    A good place to begin is to look for potential competitors. Go to Google and enter
    the keywords that you would expect future customers to enter if they were looking
    for your product or service. In our examples above, ''find a yoga instructor''
    or ''invoicing for plumbers'' would be a good start. See what is available already,
    and take some to analyse how good these products or services are.


    Don''t be disheartened if the brilliant idea you had already exists. Just means
    there is a market for it. It''s very unlikely that you''ll come up with

