  mdcn: "\n\n## 为按钮编写代码\n\n在 `public class MainActivity...` 这一行下方，编写以下代码：\n\n```java\n\
    public void buttonClicked(View view) {\n}\n```\n\n这创建了一个名为 `buttonClicked` 的方法（`public`），它不返回任何内容（`void`）。当我们的按钮被点击时就会运行这个方法方法大括号\
    \ `{` 和 `}` 包含了我们方法的代码。\n\n`View view` 稍微复杂一点，请仔细阅读。首先，`view` 是任何显示在屏幕上的内容（所以按钮、TextView\
    \ 等都是 `views`）。\n\n其次，在 Java 中创建变量时，我们从变量类型开始，然后使用我们想要为变量命名的名称。因此，如果我们想创建一个名为\
    \ `name` 的字符串，我们将输入：\n\n```java\nString name;\n```\n\n如果我们想创建一个名为 `number` 的整数，我们将输入：\n\
    \n```java\nint number;\n```\n\n在这里，我们创建了一个类型为 `View` 的变量 `view`。我们需要这样做，是因为当按钮被点击时，它会运行\
    \ `buttonClicked` 方法，并向该方法发送一些关于它自身的信息。这些信息存储在这个类型为 `View` 的变量 `view` 中。\n\n你可能需要反复阅读最后那一段。希望这能让你理解，如果没有的话不要担心，随着我们的继续，它会变得越来越清晰。\n\
    \n当你完成代码编写后，你会看到一个指向 `View` 单词的蓝色提示 (9.3)：\n\n```java\npublic void buttonClicked(View\
    \ view) {\n}\n```\n\n这是因为为了使用 `View` 这种变量类型，我们需要向应用程序中添加 `View` 类。要实现这一点，在蓝色提示显示的地方按\
    \ `alt-enter`。随后提示将消失，`View` 将变为黑色 (9.4)：\n\n如果你点击代码窗口顶部 `import ...` 旁边的微小 `+`\
    \ 号，你将看到我们现在已经向项目中添加了 `View` 类：\n\n```java\nimport android.support.v7.app.AppCompatActivity;\n\
    import android.os.Bundle;\nimport android.view.View;\n```\n\n## 创建吐司（Toast）\n\n\
    好了。我们现在已经创建了在点击按钮时运行的方法。别担心——我们快要完成了。我们只需要在该方法内部编写一些代码。我们将创建一个被称为“toast”的东西——一小段会在手机屏幕底部显示一短时间的文本。（它之所以被称为“toast”，是因为它像烤面包机里的吐司一样弹出来）。要实现这一点，在\
    \ `buttonClicked` 方法中添加以下代码：\n\n```java\nToast.makeText(\"Hi there!\", Toast.LENGTH_SHORT).show();\n\
    ```\n\n提示：当你开始输入 `Toast` 时，你会看到一个像这样的下拉菜单 (9.5)：\n\n![](img/57532e13229b6da209b2a527acf10e32_196_0.png)\n\
    \n在选中“Create a new Toast”时按回车键，它将为你自动填充大部分代码。很棒！\n\n这段代码创建了一个文本为“Hi there!” 的新\
    \ toast。`LENGTH_SHORT` 指 toast 留在屏幕上的时间（如果你想让 toast 停留的时间，可以将其更改为 `LENGTH_LONG`）。\n\
    \n注意：什么是 `this`？toast 命令中的 `this` 指的是我们当前所在的 activity（在 MainActivity 中）。这是 toast\
    \ 出现的上下文（context）。\n\n我们终于完成了。你完成后的代码看起来应该是这样的：\n\n```java\npackage com.example.robpercival.myfirstapp;\n\
    \nimport android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\n\
    import android.view.View;\nimport android.widget.Toast;\n\npublic class MainActivity\
    \ extends AppCompatActivity {\n\n    public void buttonClicked(View view) {\n\
    \        Toast.makeText(this, \"Hi there!\", Toast.LENGTH_SHORT).show();\n   \
    \ }\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n\
    \        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
    \    }\n}\n```\n\n现在运行应用并点击按钮。如果你操作得完全正确，你将看到“Hi there!”消息像这样出现在屏幕底部 (9.6)：\n\n\
    ![](img/57532e13229b6da209b2a527acf10e32_197_0.png)\n\n恭喜你！这并不容易，但我们所做的是非常高级——我们创建了一个名为\
    \ `buttonClicked` 的方法，并将该方法与我们添加到用户界面的按钮关联起来。然后我们在该方法中添加了代码，以便在用户的屏幕上以 toast 的显示“Hi\
    \ there!”文本。不错！\n\n## 允许用户输入某些文本\n\n到为止，我们所有的交互都是单向的。我们还没有办法从用户那里获取任何信息，所以让我们为我们的应用添加该功能吧。\n\
    \n在 Android Studio 中，返回 `activity_main.xml` 标签，并在调色板（Palette）中向下滚动直到看到“Text Fields”（文本字段）。有许多不同类型的文本字段可以添加，它们用于特定的数据类型。例如，如果你使用“Phone”类型，将出现一个特定的键盘，以便用户输入电话号码。现在，我们将使用标准的文本字段。\n\
    \n在布局编辑器中，将一个文本字段拖到屏幕上。我们需要给它一个 ID，以便我们可以在 Java 代码中引用它。在属性（Attributes）面板中，找到 ID\
    \ 字段并输入 `user_name`。\n\n现在回到你的 `MainActivity.java` 文件。我们需要声明一个变量来持有该字段：\n\n```java\n\
    EditText userName;\n```\n\n在 `onCreate` 方法中，我们需要初始化这个变量：\n\n```java\nuserName\
    \ = findViewById(R.id.user_name);\n```\n\n现在，我们可以更新 `buttonClicked` 方法以使用从输入字段获取文本：\n\
    \n```java\npublic void buttonClicked(View view) {\n    String name = userName.getText().toString();\n\
    \    Toast.makeText(this, \"Hi \" + name, Toast.LENGTH_SHORT).show();\n}\n```\n\
    \n当你运行应用时，可以在文本字段中输入名字并点击按钮，toast 就会显示你的个性化消息！\n\n"
