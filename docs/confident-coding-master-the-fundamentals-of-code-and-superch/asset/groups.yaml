    # 使用编程提升你的职业生涯


    一旦你设置好了托管，你的托管提供商就可以指导你如何安装 Wordpress 以及整个流程。从购买域名到看到你的网站上线，整个过程不应该超过几个小时（而且其中大部分时间将是在等待网站上线）。


    虽然在没有任何编程技能的情况下也可以创建博客，但你将能够利用你的 HTML 和 CSS 经验来定制网站的外观和感受，而不是依赖可用主题的默认外观。你还可以使用
    JavaScript 和其他语言来自定义网站的行为，并添加特定功能，例如注册表单或日历。


    我希望到目前为止你已经在认真考虑开始写博客了，但如果你还没有准备好，还有许多其他方法可以使用编程来提升你的职业前景，或者仅仅是为了让你的工作更高效。我们将从查看如何使用代码来自动化或加速任务开始。


    # 寻找可以自动化的任务


    在几乎每份工作中，工作流中部分可以用更高效的方式完成。如果你的工作是营销，你可能需要将相同的内容发布到 Twitter、Facebook 以及可能的其他社交网络。如果你写大量的邮件，你可能会发现自己在反复输入相同的短语、句子或段落。在研究一本书时，你可能想从多个网站收集电子邮箱地址。你可能需要重命名大量文件。或者你有一份文件列表，需要在其中搜索特定的单词。我们将看到如何自动化这些每项任务，并查看我们创建的工具更通用的用例。


    # If This Then That


    If This Then That (https://ifftttt.com/) 是一项网络服务，允许你连接大量的其他应用并自动化各种过程。每个过程被称为一个“applet”（小程序），其范围从“将我在
    Facebook 上被标记的所有照片保存到 Dropbox”到“要下雨时给我发送电子邮件”。但有一系列更实用的 applet，特别是“当你使用特定标签# 时，将你的推文发布到
    Facebook”（https://ifftttt.com/applets/112202p-post-your-tweets-to-facebook-when-you-use-a-specific-hashtag）。这解决了我们的第一个问题，如果管理社交媒体账户是你的工作的一部分，这可以节省大量时间。


    # 使用编程为你的职业提供未来保障


    你可能还会发现一些你目前没有做但可以自动完成且对你的业务有利的事情。例如，如果你使用 Mailchimp 发送时事，你可以通过电子邮件、Slack 和 Google
    表格自动与同事分享最新时事的性能数据（https://ifttt.com/applets/DHFQvPej-share-newsletter-performance-with-the-team）。


    虽然这不属于编程，但使用 IFTTT 迫使你仔细思考你想让 applet 运行的条件，以及你确切想要的输出，因此它涉及许多相同的挑战。更重要的是，它可以让你的生活变得简单得多，并极大提高你的生产力，所以花一点时间看看可用的
    applet，并思考你如何在你目前的职位中应用它们。


    # 文本扩展


    许多工作要求你频繁编写短语和句子，每天多次。至少你可能需要经常输入你的电子邮箱地址、电话号码或家庭地址。文本扩展允许你为任何文本分配短代码，例如你可能将 ‘wyt’
    分配给 ‘What do you think?’（你觉得呢？）。


    在某些文本扩展应用中，你甚至可以使用短代码插入图像，或按下 Tab 或 Enter 等按钮。你可以用此仅通过短代码登录网站，通过指令短代码插入你的邮箱地址，然后“按下”Tab
    键移动到密码字段，输入密码，然后按 Tab 移动到登录按钮，最后按 Enter 登录。


    这能节省多少时间取决于你的角色，但很少有人不会从设置几个基础短语中获益。


    # MacOS 上的文本扩展


    文本扩展实际上内置在 MacOS 中，所以你不需要下载任何额外软件，除非你想要高级功能。要访问它，点击屏幕左上角的苹果图标，然后选择“系统偏设置”和“键盘”。选择“文本”选项卡，你将看到“键盘快捷”窗口。


    只需使用 + 按钮添加新的短代码即可！


    # 使用编程提升你的职业生涯


    # Windows 上的文本扩展


    Windows 没有内置的文本扩展功能，但你可以使用第三方工具，例如 AutoHotkey。这是一个非常强大的脚本语言，允许你编写脚本来自动化几乎任何操作。


    例如，你可以使用以下代码来实现简单的文本扩展：


    ```autohotkey

    ::wyt::What do you think?

    ::email::yourname@example.com

    ::phone::123-456-780123 Main Street, City

    ```


    如果你使用 AutoHotkey，你还可以创建更复杂的脚本，例如根据日期输入：


    ```autohotkey

    ::date::

    FormatTime, CurrentDate, yyyy-MM-dd

    Send %CurrentDate%

    ```


    通过这种简单的方法，你可以极大地减少重复输入的时间。


    '
