- md: "\n# The span element in itself doesn’t affect the style of the text at all\
    \ (4.22):\n\n![](img/57532e13229b6da209b2a527acf10e32_86_0.png)\n\nHowever, it\
    \ does allow us to apply a style only to the contents of the span:\n\n```\n#bold\
    \ {\n  font-weight: bold;\n}\n```\n\nRemember #bold means 'apply these CSS rules\
    \ to the element with an ID of bold'.\n\nNow only the word bold is in bold (4.23):\n\
    \n![](img/57532e13229b6da209b2a527acf10e32_86_1.png)\n\n# Languages\n\nSimilarly,\
    \ we can use a second span to add some italicized text. Change the HTML to read:\n\
    \n```\n<p>This text is <span id=\"bold\">bold</span> and this is <span id=\"italic\"\
    >italic</span>.</p>\n```\n\nThen apply this CSS rule to the italic span:\n\n```\n\
    font-style: italic;\n```\n\nYour code output should look like this (4.24):\n\n\
    ![](img/57532e13229b6da209b2a527acf10e32_87_0.png)\n\n# Challenge 3\n\nThe CSS\
    \ rule to underline text is text-decoration: underline. Add the words 'and' and\
    \ 'is underlined' to the paragraph, and set up a span and a CSS style to underline\
    \ the last word.\n\nYour HTML should look like this:\n\n```\n<p>This text is <span\
    \ id=\"bold\">bold</span> and this is <span id=\"italic\">italic</span> and this\
    \ is <span id=\"underlined\">underlined</span>.</p>\n```\n\nAnd your CSS should\
    \ have this rule:\n\n```\n#underlined {\n  text-decoration: underline;\n}\n```\n\
    \nThe final outcome should look like this (4.25):\n\n![](img/57532e13229b6da209b2a527acf10e32_88_0.png)\n\
    \nYou can of course combine these styles to be bold and underlined text, and there\
    \ are other text styling options – you can see more of them at www.w3schools.com/css/css_text.asp\n\
    \nPractice exercise:\n1 Use CSS to make some text bold and italic: CC 22\n\n#\
    \ Aligning text\n\nJust like in a word processor, you can use CSS to align text\
    \ left, right or justified (so that the words spread out to fill the space available).\
    \ To do this, just add the following style:\n\n```\ntext-align: right;\n```\n\n\
    Applying this to a simple paragraph looks like this (4.26):\n\n![](img/57532e13229b6da209b2a527acf10e32_89_0.png)\n\
    \nSet the text to be aligned to the left, use:\n\n```\ntext-align: left;\n```\n\
    \nThis is the default, so you don't usually need to use it. For justified, just\
    \ use:\n\n```\ntext-align: justify;\n```\n\nNote that you'll need have enough\
    \ text to go over the end of the line to see this in action. Using some Latin\
    \ text from ipsum. as we did before, the result is (4.27):\n\n![](img/57532e13229b6da209b2a527acf10e32_89_1.png)\n\
    \nYou can see that the spaces between the words are different on each line, which\
    \ makes the ends of the line line up nicely. This works well with long pieces\
    \ of text such as blog articles, but not so well with general website content,\
    \ so use sparingly.\n\nPractice exercise:\nPractise setting text to justified\
    \ here: CC 23\n\n# Styling links\n\nLinks can be styled like any other HTML element,\
    \ but there are a couple of settings that you'll likely want to use specifically\
    \ with links.\nThe first is to remove the underlining of links – this has become\
    \ unfashionable in recent years, with links usually being identified using colour.\
    \ To remove the underline from a link, just use the style:\n\n```\ntext-decoration:\
    \ none;\n```\n\nMore interestingly, we can also use what are known as pseudo classes\
    \ to style what a link looks like when it is hovered over by the user. To do this,\
    \ use:\n\n```\na:hover {\n  color: green;\n}\n```\n\nCombining these two commands\
    \ gives us a link that is not underlined, and turns green when you hover over\
    \ it (4.28):\n\nA pseudo class is so named because it is not a ‘real’ class in\
    \ that it doesn’t refer directly to an element, but to a particular state of that\
    \ element, in this case the hover state. So it’s not a normal class that we define,\
    \ but a particular ‘state’, such as when a link is hovered over, or if the element\
    \ is the first one in a list. If you want to learn more about pseudo classes you\
    \ can do so at www.w3schools.com/css/css_pseudo_classes.asp.\n\n# Open in a new\
    \ tab\n\nThis is not strictly a CSS command:\n\n```\n<a href=\"http://www.google.com\"\
    \ target=\"_blank\">Click me to open Google.com in a new tab.</a>\n```\n\n###\
    \ Practice exercise\nPractise styling links and opening them in tabs: CC 24\n\n\
    # CSS project: clone a website\n\nA great way to practice CSS is to clone a website\
    \ that you like the look of. You could start with something fairly simple, like\
    \ google.com, and move on to something more complicated, such as bbc.co.uk/news.\
    \ Pick any site like, and try to create an accurate copy of it. It's not an easy\
    \ task (and will probably involve googling), and you'll learn a huge amount in\
    \ the process. When you're done, paste your code into a site like codepen.com,\
    \ and share the link on Twitter. I look forward to seeing what you can create.\n\
    \n# Summary\n\nCongratulations, you now know the basics of CSS. You know how to\
    \ add range of styles and formatting to a website, and combined with the skills\
    \ learned in the previous chapter, you should be able to design much any website.\
    \ Having covered HTML (for content) and CSS (for style), we will now be moving\
    \ on to JavaScript, for interactivity. JavaScript will allow you to add huge amount\
    \ of power to your webpages, allowing the user to interact with them just like\
    \ an app or software. JavaScript is a whole world of coding, so let's get started\n\
    \n# Further learning\n\nAs before, I'd advise moving on to JavaScript now, but\
    \ if you've got the CSS, these further learning will help you learn more about\
    \ cascading sheets:\n\n- www.codeacademy.com/courses/coding-with-style/0 – interactive\
    \ coding lessons\n- www.w3schools.com/css/ – tutorials\n- http://learnlayout.com\
    \ - create layouts with CSS\n- https://play.google.com/store/apps/details?id=com.sololearn&hl=en\
    \ – Android app to teach you\n- https://apple.com/gb/learn-css – iPhone and iPad\
    \ app to teach you\n\n# JavaScript\n\nWe’ve now looked at HTML for content, and\
    \ CSS for style and layout. It’s time to bring in the third piece of the puzzle,\
    \ JavaScript, which allows for interaction with the user. Unlike HTML and CSS,\
    \ JavaScript is a ‘full’ programming language in the sense that we can use it\
