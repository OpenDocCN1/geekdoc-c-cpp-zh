    - 2. Asking a user whether they prefer tea or coffee.\n- 3. Asking a user what\
    \ countries they have travelled to from a list.\n\nAnswers\n\n- 1. Checkbox –\
    \ they can select or deselect the box as they wish.\n- 2. Radio – they should\
    \ only be able to select one option.\n- 3. Checkbox – they can then select as\
    \ many as they want to (or none).\n\n## Drop-down menus\n\nIf you want to create\
    \ a drop-down list where the user can select from a range of options, you can\
