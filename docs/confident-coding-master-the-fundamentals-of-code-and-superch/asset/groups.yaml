    # JavaScript


    Unlike a while loop, in a for loop all the information about the for loop is contained
    in a single line. In this case the counter variable is called i (a commonly used
    letter in loops), and it starts at 1, increases by 1 each time and continues until
    i is no longer equal to or less than 50. The effect is exactly the same as while
    loops – which you depends on context and personal preference. For what it''s worth,
    I generally prefer while loops as I find they are more flexible.


    # Generating random numbers


    We''re close to being able to make a simple guessing game with JavaScript, but
    to do that we''ll need to be able to generate a random number. We can do that
    using this function:


    ```

    Math.random()

    ```


    If you try this out using something like:


    ```

    document.getElementById("my-div").innerHTML = Math.random()

    ```


    You''ll see it generates a random decimal number between 0 and 1 (5.16):


    ![](img/57532e13229b6da209b2a527acf10e32_112_0.png)


    For our guessing game we need a random whole number between 1 and 10. To do that
    we use this function:


    ```

    Math.floor((Math.random() * 10)) + 1

    ```'
- md: "\nThis isn’t impenetrable as it looks! The \"* 10\" means 'multiply by 10'\
    \ so we now have a random number between 0 and 10. The Math.floor part ‘floors’\
    \ the number by removing everything after the decimal point (so 6.746287848 would\
    \ become 6). This gives us a random number between 0 and 9, so we add 1 to it\
    \ to get a random number between 1 and 10.\n\nTry out by changing your code in\
    \ the above page to:\n\n```\ndocument.getElementById(\"my-div\").innerHTML = Math.floor((Math.random()\
    \ * 10)) + 1\n```\n\n# Practice exercise\n\nGenerate a random whole number between:\n\
    \n- 1 and 5\n- 11 and 20\n- 0 and 100\n\nAnswers:\n\n- Math.floor((Math.random()\
    \ * 5)) + 1\n- Math.floor((Math.random() * 10)) + 10\n- Math.floor((Math.random()\
    \ * 100)\n\n![](img/57532e13229b6da209b2a527acf10e32_113_0.png)\n\n# JavaScript\
    \ project: guessing game\n\nUsing variable, loops and if statements, you have\
    \ the power to make a whole range of apps, websites and games. We're going to\
    \ be working on a simple guessing game, where you have to guess the number that\
    \ the computer has chosen.\n\nThe concept is pretty simple – when we load the\
    \ page, the user will be asked to guess a random number between 1 and 10. If they\
    \ get it wrong, they will be told whether they were too high or too low. If they\
    \ get it right, they will be told so and given the chance to play again.\n\n#\
    \ JavaScript\n\nThis challenge will involve putting together almost everything\
    \ we've learned so far – interacting with elements, changing styles, variables\
    \ and if statements. You are welcome to stop reading now and attempt the challenge,\
    \ but I would advise working it through in stages, which we will do using mini-challenges.\n\
    \nThe process would be similar to designing any website or app – start with the\
    \ user interface, and then add the interactions gradually, checking that everything\
    \ is working as you go.\n\n# Part 1: Create the user interface (a title (use an\
    \ h1 element), instructions, a text input and a submit button)\n\nThere are many\
    \ possible layouts, but mine is fairly simple.\n\n```\n<h1>What's My Number?</h1>\n\
    <p>I'm thinking of a number between 1 and 10 - what do you think it is?</p>\n\
    <input type=\"text\">\n<button>Guess</button>\n```\n\n![](img/57532e13229b6da209b2a527acf10e32_114_0.png)\n\
    \n# Part 2: Basic interactivity (display the number that the user has entered)\n\
    \nAdd in IDs for the elements and an empty paragraph, and fill it with the user's\
    \ guess when they press the button:\n\n```\n<h1>What's My Number?</h1>\n<p>I'm\
    \ thinking of a number between 1 and 10 - what do you think it is?</p>\n<input\
    \ type=\"text\" id=\"number\">\n<button id=\"guess\">Guess</button>\n<p id=\"\
    message\"></p>\n<script>\ndocument.getElementById(\"guess\").onclick = function()\
    \ {\ndocument.getElementById(\"message\").innerHTML = document.getElementById(\"\
    number\").value\n}\n</script>\n```\n\n![](img/57532e13229b6da209b2a527acf10e32_115_0.png)\n\
    \n# Part 3: Add in the random number generator and check the user's guess against\
    \ that number, displaying an appropriate message\n\nWe don't need to change the\
    \ HTML at all now - it's all in the JavaScript:\n\n```javascript\nif (document.getElementById(\"\
    number\").value > randomNumber) {\n    document.getElementById(\"message\").innerHTML\
    \ = \"Too High\"\n} else if (document.getElementById(\"number\").value < randomNumber)\
    \ {\n    document.getElementById(\"message\").innerHTML = \"Too Low!\"\n} else\
    \ {\n    document.getElementById(\"message\").innerHTML = \"That's it!\"\n}\n\
    ```\n\nWe have one slightly new construction here: else if. This allows you to\
    \ test another statement if the first one turns out to be false. Then we have\
    \ a final else at the end, which will be processed if the first two statements\
    \ are false. If the guess is not higher or lower than the number, it must be the\
    \ right answer!\n\nTry it out (S.19):\n\n![](img/57532e13229b6da209b2a527acf10e32_116_0.png)\n\
    \n# Part 4: Change the colour of the text of the text depending on whether the\
    \ answer is correct (green for yes, red for no) and give the option to play again\n\
    \nWe use the following to change the text colour:\n\n```javascript\ndocument.getElementById(\"\
    text\").style.color = \"red\";\n```\n\nTo ‘play again’ we can reload the page.\
    \ We can do that with an empty link (<a href=\"\">) so let's add that to the success\
    \ message. Here we go (S.20):\n\n![](img/57532e13229b6da209b2a527acf10e32_117_0.png)\n\
    \nThat's it. You've made a fully functional, interactive game using HTML, CSS\
    \ and JavaScript – congratulations!\n\n# Summary\n\nThis is of course just the\
    \ beginning of JavaScript is capable of, and if you want to experiment further\
    \ there are a lot of options. Try thinking of simple games that you could recreate,\
    \ such as simulating a coin toss, hangman, or even something from old phones.\
    \ There are numerous tutorials and guides online – just what you want to do.\n\
    \nNow that we've covered HTML for content, CSS for style, and JavaScript for interaction,\
    \ we'll be looking at our first server-side language, Python. Python is a simple\
    \ and clean language, and similar to JavaScript in many ways. We'll see how we\
    \ can build more complex structures with it, and make more sophisticated programs.\
    \ There is lot to learn, and a lot of fun to be had. Without further ado, let's\
    \ jump in and see what we can achieve.\n\n# Further learning\n\nIf you want to\
    \ dip your toe a little deeper into the world of JavaScript, you can use these\
    \ links to experiment further and learn more:\n\n- www.codecademy.com/learn/javascript\
    \ – interactive lessons.\n- www.w3schools.com/js/ – free tutorials.\n- www.learn-js.org\
    \ – free tutorials.\n- https://play.google.com/store/apps/details?id=com.sololearn.javascript&hl=en\
    \ – learn JavaScript on Android.\n- https://itunes.apple.com/gb/app/learn-javascript/id95273897\
    \ – learn JavaScript on iPhone or iPad.\n\n# Python\n\nAt the risk of boring,\
    \ let's recap what we've learned so far. We started off looking at HTML, which\
    \ allowed us to add content to webpages. Then we learned CSS, which we could use\
    \ alongside HTML to add styles and customize the layout. Next, we saw how we could\
    \ use JavaScript, our first ‘proper’ programming language, to make our pages interactive\
    \ and allow the user to do something on the page and get a response.\n\nWhat is\
    \ missing in our armoury? Well, so far everything we are doing happens completely\
    \ in the user's browser. To be able to build software that allows users to communicate\
    \ with each other, we need something called a server. A server is essentially\
    \ a computer that is always on and always connected to the internet. Our computer\
    \ can then contact that server to download information, save some content on the\
    \ server (such as our latest tweet) or send data (such as an email) to another\
    \ computer.\n\n![](img/57532e13229b6da209b2a527acf10e32_120_0.png)\n\nTherefore\
    \ to be able to build truly powerful websites and apps, we need to write code\
    \ that can run on a server. Although it is possible to use JavaScript on a server,\
    \ it is more common to use other languages such as PHP or Python. Here we are\
    \ going to use Python for several reasons:\n\n- Python is a simple and straightforward\
    \ language, even more so than JavaScript;\n- Python can be used to build software\
    \ on almost any platform, from servers to Raspberry Pis, enabling you to build\
    \ anything from websites to robots;\n- Python can be used to automate daily tasks,\
    \ such as getting information from websites or automatically renaming your files\
    \ (we'll see how to do that later in this chapter).\n\n# What is Python?\n\nPython\
    \ was developed in the late 1980s by Guido Van Rossum in the Netherlands. Van\
    \ Rossum named the language after Monty Python, being a big fan of their Flying\
    \ Circus.\n\nVan Rossum is still actively involved in the development of the language,\
    \ and as such has been given the title Benevolent Dictator For Life (BDFL) by\
    \ the Python community.\n\nSince its birth it has gone through a number of versions,\
    \ and is currently at version 3. It is used widely to build both web-based and\
    \ desktop applications, as well as on Internet Things devices such as the Arduino.\
    \ This makes it an extremely powerful and flexible language to learn.\n\n# Why\
    \ learn Python?\n\n> I don't want to build robots, do I really need to learn another\
    \ language?\n\nIf you are not looking for a career in coding, you might be wondering\
    \ it's worth learning a second language after JavaScript. The answer is, of course,\
    \ yes, but why?\n\nLearning two languages allows you to see what languages have\
    \ in common (and what they don't). Once you know how to create a loop in two languages,\
    \ you'll be clearer on what the critical parts of a loop are. The same is true\
    \ with statements and variables. Every language has its idiosyncrasies, and if\
    \ you only learn one language you won't have much insight into what they are.\n\
    \nSo stick with me - even if you're not convinced learning two languages is useful,\
    \ if you ever have to extract, for example, all the email addresses from a webpage,\
    \ Python can do that for you (and we'll see how at the end of the chapter).\n\n\
    # What will this chapter cover?\n\nAs usual, we will go through the whole process\
    \ of running some Python, building up our skills and then practising with a few\
    \ projects and exercises.\n\nWe'll also be working towards a big project, where\
    \ we'll attempt some 'website scraping' – collecting data such as names and email\
    \ address from a webpage. This will be your toughest yet.\n"
  mdcn: "\n\n这看起来并不难难懂！“* 10” 意味着“乘以 10”，所以我们现在有了一个 0 到 10 之间的随机数。`Math.floor` 部分通过删除小数点位后的所有内容来对数字进行“向下取整”（例如\
    \ 6.746287848 会变成 6）。这为我们得到了一个 0 到 9 之间的随机数，所以我们对其加 1，得到一个 1 到 10 之间的随机数。\n\n\
    尝试将你上方页面中的代码更改为：\n\n```\ndocument.getElementById(\"my-div\").innerHTML = Math.floor((Math.random()\
    \ * 10)) + 1\n```\n\n# 练习题\n\n生成一个以下范围内的随机整数：\n\n- 1 到 5\n- 11 到 20\n- 0 到 100\n\
    \n答案：\n\n- Math.floor((Math.random() * 5)) + 1\n- Math.floor((Math.random() *\
    \ 10)) + 10\n- Math.floor((Math.random() * 100)\n\n![](img/57532e13229b6da209b2a527acf10e32_113_0.png)\n\
    \n# JavaScript 项目：猜数字游戏\n\n使用变量、循环和 if 语句，你就有能力创建各种系列的应用程序、网站和游戏。我们将制作一个简单的猜数字游戏，你必须猜出计算机选择的数字。\n\
    \n这个概念非常简单——当我们加载页面时，用户会被要求猜一个 1 到 10 之间的随机数。如果他们猜错了，系统会告诉他们是太大了还是太小了。如果他们猜中了，系统会告诉他们并给予再次玩的机会。\n\
    \n# JavaScript\n\n这个挑战将涉及整合目前学到的几乎所有内容——与元素交互、更改样式、变量和 if 语句。你现在可以停止阅读并尝试挑战，但我建议你分阶段进行，我们将通过小型挑战来完成。\n\
    \n这个过程与设计任何网站或应用程序的过程相似——从用户界面开始，然后逐渐添加交互功能，并在操作过程中检查一切是否都运行正常。\n\n# 第 1 部分：创建用户界面（一个标题（使用\
    \ h1 元素）、说明、一个文本输入框和一个提交按钮）\n\n有许多可能的布局，但我的非常简单。\n\n```\n<h1>我的数字是多少？</h1>\n<p>我在想一个\
    \ 1 到 10 之间的数字 - 你觉得是多少？</p>\n<input type=\"text\">\n<button>猜数字</button>\n```\n\
    \n![](img/57532e13229b6da209b2a527acf10e32_114_0.png)\n\n# 第 2 部分：基础交互（显示用户输入的数字）\n\
    \n为元素添加 ID 和一个空段落，并在用户点击按钮时用他们猜的数字填充该段落：\n\n```\n<h1>我的数字是多少？</h1>\n<p>我在想一个 1\
    \ 到 10 之间的数字 - 你觉得是多少？</p>\n<input type=\"text\" id=\"number\">\n<button id=\"\
    guess\">猜数字</button>\n<p id=\"message\"></p>\n<script>\ndocument.getElementById(\"\
    guess\").onclick = function() {\ndocument.getElementById(\"message\").innerHTML\
    \ = document.getElementById(\"number\").value\n}\n</script>\n```\n\n![](img/57532e13229b6da209b2a527acf10e32_115_0.png)\n\
    \n# 第 3 部分：添加随机数生成器，并将用户的猜测与该数字比较，显示相应的消息\n\n我们现在不需要更改 HTML——全部在 JavaScript 中：\n\
    \n```javascript\nif (document.getElementById(\"number\").value > randomNumber)\
    \ {\n    document.getElementById(\"message\").innerHTML = \"太大了\"\n} else if (document.getElementById(\"\
    number\").value < randomNumber) {\n    document.getElementById(\"message\").innerHTML\
    \ = \"太小了!\"\n} else {\n    document.getElementById(\"message\").innerHTML = \"\
    对了!\"\n}\n```\n\n我们这里有一个新结构：`else if`。它允许在第一个语句为假时测试另一个语句。最后我们有一个 `else`，如果前两个语句都假，它将被执行。如果猜的数字不大也不小，它就是正确答案！\n\
    \n尝试一下：\n\n![](img/57532e13229b6da209b2a527acf10e32_116_0.png)\n\n# 第 4 部分：根据是否正确更改文本颜色（正确为绿色，错误为红色）并提供再次玩的选项\n\
    \n我们使用以下代码更改文本颜色：\n\n```javascript\ndocument.getElementById(\"text\").style.color\
    \ = \"red\";\n```\n\n为了“再次玩”，我们可以刷新页面。我们在这里把这个添加到成功消息中：\n\n![](img/57532e13229b6da209b2a527acf10e32_117_0.png)\n\
    \n完成了。你使用 HTML、CSS 和 JavaScript 创建了一个功能完备的交互游戏——恭喜！\n\n# 总结\n\n这当然只是 JavaScript\
    \ 能力的开始，如果你想进一步尝试，有很多选择。尝试思考你可以创建的简单游戏，比如模拟抛硬币、猜字游戏，或者从手机上做的事情——网上有很多教程和指南。\n\n\
    现在我们涵盖了用于内容的 HTML、用于样式的 CSS 以及用于交互的 JavaScript，我们将学习第一个服务器端语言 Python。Python 是一种简单的语言，在许多方面与\
    \ JavaScript 相似。我们将看到如何用它构建更复杂的结构并制作更复杂的程序。有很多要学的，也有很多乐趣。话不多说，让我们开始吧看看能实现什么。\n\
    \n# 进一步学习\n\n如果你想深入探索 JavaScript 世界，可以使用这些链接进行进一步实验并学习更多：\n\n- [www.codecademy.com/learn/javascript]\
    \ 交互式课程\n- [www.w3schools.com/js/] 免费教程\n- [www.learn-js.org] 免费教程\n- [https://play.google.com/store/apps/details?id=com.sololearn.javascript&hl=en]\
    \ 在 Android 上学习 JavaScript\n- [https://itunes.apple.com/gb/app/learn-javascript/id9527389]\
    \ 在 iPhone 或 iPad 上学习 JavaScript\n\n# Python\n\n 我们来回顾一下目前学过的内容。我们从 HTML 开始，它允许我们在网页上添加内容。然后我们学习了\
    \ CSS，我们可以结合 HTML 添加样式并自定义布局。接下来，我们看到了如何使用 JavaScript（我们的第一个“真正的”编程语言）让页面具有交互性，并允许用户在页面上进行操作并获得响应。\n\
    \n我们的工具箱里缺少了什么？嗯，到目前我们做的一切完全发生在用户的浏览器中。为了构建允许用户相互通信的软件，我们需要称为服务器的东西。服务器本质上是一台始终开启并连接互联网的计算机。我们的计算机就可以联系该服务器下载信息，在服务器上保存某些内容（如我们的推文）或向另一台计算机发送数据（如电子邮件）。\n\
    \n![](img/57532e13229b6da209b2a527acf10e32_120_0.png)\n\n因此，为了能够构建强大的网站和应用程序，我们需要编写可以在服务器运行的代码。虽然可以在服务器上使用\
    \ JavaScript，但更常用的是 PHP 或 Python 等语言。我们在这里使用 Python 有几个原因：\n\n- Python 是一种简单直观的语言，甚至比\
    \ JavaScript 更是；\n- Python 可在几乎任何平台上构建软件，从服务器到树莓派，让你能够构建从网站到机器人的任何东西；\n- Python\
    \ 可用于日常任务，例如从网站获取信息或自动重命名文件（我们将在本章稍些之后介绍如何操作）。\n\n# 什么是 Python？\n\nPython 是 Guido\
    \ Van Rossum 在 20 世纪 80 年代后期在荷兰开发的。Van Rossum 以 Monty Python 命名该语言，因为他是他们《飞行马戏团》的忠粉丝。\n\
    \nVan Rossum 仍在积极参与该语言的开发，因此被 Python 社区授予“终身仁慈皇帝”（BDFL）的称号。\n\n自诞生以来，它经历了多个版本，目前是第\
    \ 3 版本。它被广泛用于构建 Web 端和桌面应用程序，还用于 Arduino 等物联网设备。这使其成为一门非常强大且灵活的学习语言。\n\n# 为什么要学习\
    \ Python？\n\n> 我不想构建机器人，我真的需要学习另一种语言吗？\n\n如果你不是为了寻找编程工作，你可能会怀疑学习第二种语言是否值得。答案当然是肯定的，但为什么呢？\n\
    \n学习两种语言可以让你看到语言之间的共同点（以及不同之处）。一旦你知道如何在两种语言中创建循环，你将更清楚地理解循环的关键部分。语句和变量也是如此。每种语言都有自己的特性，如果你只学一种语言，你对这些特性的了解有限。\n\
    \n如果你以后需要从网页中提取所有的电子邮件地址，Python 也可以为你完成工作（我们将在章节末尾看到如何操作）。\n\n# 本章将涵盖什么？\n\n一如既往，我们将通过运行\
    \ Python 的整个过程来建立技能，并通过一些项目和练习进行练习。\n\n我们还将完成一个大项目，其中我们将尝试一些“网络爬虫”——从网页上收集姓名和电子邮件地址等数据。这将是你面临过的最具挑战性的任务。\n\
    \n"
