    \ flexible, and has features such as Instant Run, which allow you to test your\
    \ apps on the simulator without recompiling them.\n\nOnce we've downloaded Android\
    \ Studio, we'll take a tour of the interface and run a Hello World app. Then we'll\
    \ add labels and buttons, build in some interactivity and finally make a simple\n\
    \n## Downloading and setting up Android Studio\n\nThe main Android developer site\
    \ is developer.android.com - it is well worth clicking through and reading some\
