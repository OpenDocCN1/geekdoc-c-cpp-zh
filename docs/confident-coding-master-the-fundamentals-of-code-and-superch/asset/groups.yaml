    # 实践


    在过去的20年里，一切发生了巨大的变化。世界上一些最有价值的业务完全存在于线上，并且是由初始成本几乎为零的个人创建的。学习编程赋予了你将任何想法付诸行动的能力，只需投入你的时间和几杯咖啡的钱。你甚至不需要请求任何人的许可！


    但如果你不想创业，还有许多其他理由可能让你想要建立自己的网站。


    博客是在网络上建立名声的绝佳方式。你可以分享你对狗的热爱、你的园艺知识，甚至记录学习编程的过程。写得好的话，你就能建立一个志同道合的人群，而你永远不知道从中会产生什么样的机会。


    如果你经常执行某项在线任务，你可能完全可以通过一个网站来实现自动化，如果其他人也执行类似的任务，你还可以将工具分享给他们。例如，我们在 Python 章节中学到的网页爬虫代码可以用于检查
    Amazon 价格的更新。然后，你可以允许用户检查特定产品的价格，并在价格低于特定阈值时给他们发送电子邮件。


    我们将在书的后面部分介绍构建特定类型网站的方法，但现在值得在心中想一个你想构建的特定网站。它不需要是一个改变世界的想法，只需要一个能帮助你应用在本章所学内容的特定想法即可。


    现在花几分钟写下这个想法。然后，在你阅读本章时，思考不同的方法如何应用到你的想法，以及你会选择哪一种。如果你真的想巩固你的学习成果，请在读完本章后创建那个网站。


    # 网站是如何工作的？


    我在 90 年代初一起长大的 BBC Micro 计算机是一台独立运行的。你可以通过磁带和磁盘向它添加程序（软件），但所有代码完全在设备本身上运行。


    随着互联网的增长和提速，将程序代码（称为网站）存储在称为服务器的强大计算机上变得可行，然后这些代码会被传输到用户的计算机，并在名为浏览器的特殊软件中显示。最初，这些大多数网站是静态的，显示使用
    HTML 和 CSS 编写的信息。


    逐渐地，网站变得更具交互性，不再是静态内容，而是允许用户发布更新、发送电子邮件或观看视频。这类网站最初被称为“webapps”（网络应用），尽管这个词现在已已不流行，已成为网站本身的同义词。网络应用的大部分实际运行是在服务器上完成的，而浏览器只显示输出（例如，用户的电子邮件列表，或用户猫的照片）。


    这种工作方式的巨大优势是开发速度。在我的 BBC Micro 计算机上，如果我想获得一个更新的软件，我必须去获取它的光盘并放入我的机器。现在相反，如果 Google
    想更新 Gmail 界面，或者你想编辑自己的博客，只需在服务器上进行快速更改，网站就会为全球所有用户立即更新。


    即使是传统的桌面软件（如文字处理器和图像编辑器）也开始在网上找到家园，而像 Chromebook 这样的电脑，只不过是一个浏览器和一个互联网连接。


    那么，我们如何利用这种现象呢？我们知道如何编写 HTML 代码，现在我们知道如何向世界分享我们的代码。这其实非常简单，只需要两件事：域名和一些网络托管。


    # 什么是域名，我该如何获取？


    域名简单来说就是一个网络地址，比如 facebook.com 或 bcc.co.uk。每个国家的域名由一个中央“注册中心”管理，域名可以从多个不同的提供商处。


    当你购买域名时，你实际上是在租用它，平均费用每年约为 10 英镑。一旦你购买，你就有权每年续约，但如果你不续约，它最终将返回公共池，其他人就可以购买它。


    在网页上快速搜索“buy domain name”会出现几个结果，所以做些研究并选择一个适合你的提供商。理想情况下要查看评论，而不是完全取决于价格——廉价的域名可能带有讨厌的费用，例如将其转移到其他地方的费用。


    选择域名可能是困难的，因为大多数好的域名已经没了。域名很大程度上取决于个人喜好，但我建议如下：


    - 如果可能，获取一个 .com 或特定国家的域名（如 .co.uk）。即使它不是理想的域名，它也会比 .boats 或 .black 这种晦涩的扩展名更容易记忆且更值得信任。

    - 让它易于输入。避免像 Xpress 这样的拼写错误（除非它们当然是你品牌的一部分！）。

    - 使用关键词。如果你想在搜索引擎中获得靠前的排名，将你的搜索词放入域名中是一个很好的开始。例如，如果你正在开始写关于英国史宾犬的博客，cockerspanielsblog.com
    就不是坏选择（而且在写这本书时，它是可用的！）。


    如果你苦恼于找不到想法，这些网站可能会有所帮助：


    - www.domainsbot.com/ – 会搜索一系列域名并告诉你

    - www.namemap.com/ – 会搜索一系列域名并告诉你

    - www.namesearch.com/ – 会搜索一系列域名并告诉你


