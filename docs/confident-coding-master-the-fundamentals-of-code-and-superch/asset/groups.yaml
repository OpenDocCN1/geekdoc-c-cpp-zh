- md: "\napp should ask the user for an amount in one currency and then convert it\
    \ to another, displaying the result on the screen. Simple. I'm going to use British\
    \ Pounds to US Dollars, which at the time of writing has a conversion rate of\
    \ 1.31, but you can use any currencies you like. Good luck!\n\n## Currency converter\
    \ app: solution\n\nStart by creating a new project in Xcode (File -> New -> Project)\
    \ and entering the default settings.\n\nThen create the user interface: drag in\
    \ a label for the app title, a text field, a button, and then a second label for\
    \ the result. The result should look something like this (8.9):\n\n![](img/57532e13229b6da209b2a527acf10e32_182_0.png)\n\
    \n## In practice\n\nNote the result is currently blank – we’ll add the value with\
    \ code when the user taps the button.\nThe next step is to create Outlets for\
    \ the label and the label and the text field, and an Action for the button. Do\
    \ this in the usual way, but ctrl-dragging, until your code looks like this:\n\
    \n```\n@IBAction func buttonClicked(_sender: AnyObject) {\n}\n\nIBOutlet var textField:\
    \ UITextField!\n\nIBOutlet var label: UILabel\n```\n\nFinally, we will add the\
    \ code to the buttonClicked() method to do the calculation and display the result\
    \ to the user. First, we get the contents of the text field (notice that I’m using\
    \ let rather than var as this value will not change):\n\n```\nlet valueUserEntered\
    \ = textField.text!\n```\n\nThen we convert that to a Float so we can do multiplication\
    \ with it (don’t forget to add the ! as the result will be an optional):\n\n```\n\
    let amountInPounds = Float(valueUserEntered)\n```\n\nNext we do the multiplication:\n\
    \n```\nlet amountInPounds = amountInPounds * 1.31\n```\n\nThen we convert that\
    \ to a Float so we can do multiplication with it:\n\n```\nlet amountInDollars\
    \ = amountInPounds * 1.31\n```\n\nFinally, we update the label to give the result\
    \ we need (note we need to convert amountInDollars back to a string here):\n\n\
    ```\nlabel.text = \"Result = $\" + String(amountInDollars)\n```\n\nPutting it\
    \ all together, your app should look like this (8.10):\n\n## Building an app for\
    \ iPhone or iPad\n\n![](img/57532e13229b6da209b2a527acf10e32_184_0.png)\n\nNow\
    \ run the app, and check that it works. If you've set up everything correctly,\
    \ you should be able to enter an amount and the app will convert it to the new\
    \ currency (8.11):\n\n![](img/57532e13229b6da209b2a527acf10e32_184_1.png)\n\n\
    Hurah! All seems to be well, but there is one small problem – if the user doesn’t\
    \ enter a number into the app, it will crash. Try entering ‘two’ or any string\
    \ and you’ll see the error. This is because the Float command fails as Swift cannot\
    \ convert ‘two’ into a number. To get around this we can use an if statement:\n\
    \n```\nlet amountInPounds = Float(valueUserEntered) {\n\n    let amountInDollars\
    \ = amountInPounds * 1.31\n\n    label.text = \"Result - $\" + String(amountInDollars)\n\
    } else {\n\n    label.text = \"Please enter a number\"\n}\n```\n\nThis is quite\
    \ a neat solution – the first line now tests to see if the conversion is possible,\
    \ and if it is, proceeds to show the result. If it isn’t, it displays a friendly\
    \ error message.\n\n## Summary\n\nWe’ve covered a lot of ground in this section.\
    \ Hopefully you now feel reasonably familiar with Xcode, and you understand the\
    \ basics of how apps are made. You have seen the user interface interacts with\
    \ the code of the app to create a working app which gives the user some information.\n\
    \n## Further learning\n\nIn the next chapter, we are going to see how you can\
    \ build apps for the other major platform, Android. However, if you want to double\
    \ down on learning iOS app development, you can try some of these links:\n\n-\
    \ www.udemy.com/complete-ios-10-developer-course/ – my online course in iOS app\
    \ development.\n- www.appcoda.com/ios-programming-course/ – free iOS development\
    \ tutorials\n- https://itunes.apple.com/us/course/developing-ios-8-apps-swift/id961180099\
    \ – popular Stanford iOS coding course – a little outdated, but good quality and\
