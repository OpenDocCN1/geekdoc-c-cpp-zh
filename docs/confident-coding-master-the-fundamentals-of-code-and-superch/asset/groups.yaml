    half of all jobs with salaries over $58,000 require some coding skills. Moreover,
    half of all programming opportunities were in industries outside of technology,
    including finance, manufacturing and healthcare.


    The acquiring of the kinds of specialist skills that could boost salaries and
    advance careers used to involve at least a degree, if not years of study as part
    of a PhD or MBA. But today the proliferation of online courses and coding bootamps
    has made the acquisition of coding skills highly feasible for anyone with a computer
    and internet connection.


    As computers become smarter, and able to drive cars, write news stories and balance
    businesses'' single-handedly, there will be an even greater need for people who
    know how to write the code that commands the machines.


    Learning to code also has the extra benefit of not only making a candidate more
    employable, but also giving them the freedom of starting their own business or
    creating a side income from making websites and apps.


    In this book we will look in detail at both the ''why'' and the ''how'' of learning
    to code: after looking at the benefits that programming knowledge brings, we will
    dive right into learning HTML, the language of all websites. We will then look
    at a range of programming languages, and even see how to build native apps for
    iPhones and Android devices. Finally, we will apply the skills in step-by-step
    guides to entrepreneurship, building your own websites and apps, increasing your
    everyday efficiency and even seeing how much you might become a full-time software
    developer.


    Even if you have no plans to change careers, we will see how you can use coding
    skills to make yourself and your colleagues more efficient, creating shortcuts
    to complete tasks faster, provide quicker feedback and serve your customers and
    clients better.


    My hope for you in reading this book is that you will become fully digitally literate.
    Some readers may go on to create businesses, some may build apps to help them
    in their current job, and some may communicate more effectively with the IT guys
    at the office. But all will have a greater'
- md: '

    # Introduction


    understanding of how coding underpins every interaction we have with our computers,
    our phones and our smart devices. The lines of code that you write will enable
    you to better harness the technology that you use every day.


    # Who am I?


    I would like to take a moment to tell you how learning to code has changed my
    life. I studied Mathematics at university, and went on to become a teacher in
    a secondary school in London. I very much enjoyed the teaching, but I suspected
    it might not be what I wanted to do for my whole life, so in the evenings and
    weekends I started to build websites.


    I had done a little coding as a kid, trying to replicate favourite computer games
    on a BBC Micro, but I was certainly no Mark Zuckerberg or Bill Gates. I would
    simply have an idea for a website, and using Google figure out how to put it together.
    This method of learning was free and fairly deive, but it did mean I often went
    down long, unnecessary detours until I discovered that there was a much better
    way of doing things.


    My first visit was HomesExchange.org, a site that allowed people to swap homes
    for a couple of weeks to save accommodation costs. Unfortunately, I hadn''t realized
    that the domain name HomesExchange.org could also be interpreted as HomeSexChange.org.
    After a few unsavoury support requests, I decided the business was unlikely to
    go very far!


    I built several more sites, most of which came to nothing, until one day I came
    up with the idea of an eco-friendly web hosting service, to allow people to host
    their websites and emails in an environmentally friendly way. This was an example
    of scratching my own itch, as I had looked for a service myself my own sites,
    and the existing options were generally expensive and didn''t have as many features
    as the big web hosts like GoDaddy and 123-reg.


    The service, ecowhosting.co.uk, turned out to be something that a lot of people
    wanted, and it started to grow quite naturally, as people discovered the website
    through Google and word-of-mouth. As the site grew in popularity, I added features
    and automated processes that I had to do several times a day, learning the coding
    as I went.


    In 2012 I quit my teaching job in order to focus on Eco Web Hosting and some other
    projects full time. I quickly discovered that working freelance is not quite as
    ''freeing'' as I thought, as I always had several activities going on at once.
    I liked having a range of reliable income (through the web hosting), new projects
    (mostly freelance websites and apps through local contacts) and starting new businesses
    when I had the latest ''great'' idea. But I was also struggling to cope with so
    many competing calls for my attention.


    In January 2014 I started to build an online course to teach people how to build
    websites. I had noticed that online video courses were becoming popular, and thought
    that with a combination of my coding knowledge, teaching skills and entrepreneurial
    experience I might be able to offer a fun, practical and project-based approach
    to learning to code. That course, The Complete Web Developer Course, went on to
    be one of the best-selling courses of all time, and I followed up with The Complete
    iOS Developer Course, for iPhone apps, and The Complete Android Developer Course,
    for Android apps.


    Through my courses, I have now taught over half a million people how to code,
    and I daily appreciate the scale that the internet can provide, with one person
    able to help so many others. The courses have also brought financial freedom,
    and a strong desire to continue helping others find the joy that coding brings
    me, as well as the many opportunities that learning to code brings.


    Steve Jobs famously said, ''I think everybody in this country should learn how
    to program a computer because it teaches you how to think.'' That is a final,
    and essential, benefit – learning code forces you to approach problems logically
    and analytically, asking the right questions and testing your solutions to if
    they work. And that is a skill that will benefit you in all aspects of your life.


    # More online


    From time to time in the book I''ll be pointing you to supporting material I''ve
    put online. Here''s how to get it.


    - 1 In the book each online resource is keyed with the letters CC and a number
    – like this: CC 21

    - 2 Go to koganpage.com/cc

    - 3 There you''ll see a ‘View resources'' button.

    - 4 The button takes you to a PDF ‘Online material’.

    - 5 The PDF gives you the corresponding URL for each CC number.


    # How to use this book


    This book is designed to be as practical and hands-on as possible. You’ll get
    the most out of it by actively taking part and following every instruction and
    activity online as we go. There are three different kinds of features in this
    book to help you learn coding: questions, practice exercises and challenges. The
    quick questions are designed to help you memorize key pieces of information, the
    practice exercises make sure that your new skills are honed and developed, and
    the challenges stretch you to deeper learning. As the book progresses, you’ll
    find that there are fewer quick questions but more and more challenges. I hope
    you enjoy the journey!


    # PART ONE

    Why coding?


    ## Why coding is important and what it can do for you


    We''ve already seen several reasons why learning to code is important: it can
    increase your salary, widen your future career choices and be a springboard into
    self-employment and entrepreneurship. It will also help you navigate the increasingly
    automated future of smart assistants, self-driving cars and virtual reality.


    In this chapter we will look at some more specific things you can do with coding
    right now, many of which we will expand on through the course of this book.


    ## Becoming more efficient


    Almost all jobs today require a fair bit of time working with a computer. You
    likely have to do a range of similar tasks each day, including working with email,
    creating and managing documents, and searching the web. Almost all of these tasks
    can be made more efficient with a strong knowledge of how the software and operating
    system you are using works.


    Initially, simply using keyboard shortcuts will likely save you several minutes
    each day, and more importantly you will start thinking about how the software
    you are using works, and how your workflow could be improved. Services such as
    text expansion and If This Then That, we will be covering in detail later on,
    can save you a huge amount of time, as well as helping you do a better job. Imagine
    being able to automatically email your colleagues with a summary of the effectiveness
    of your weekly newsletter. Or completely automating the process of turning your
    weekly sales report into a live webpage that your colleagues can view any time.


    Learning to code will allow you to do all this and much more, doing a better job
    in less time.


    ## Communicating with technical people


    Regardless of your current fluency with technology, it is likely that you need
    to communicate with technical people fairly regularly about things that you don''t
    entirely understand. Whether it is trying to get some content added to the company
    website, getting some software installed on your computer or removing the tweet
    you accidentally posted on the company account, greater technical knowledge can
    make every aspect of those conversations much more straightforward.


    As well as becoming familiar with the terminology technical people use (which
    really isn''t as complicated or mysterious as it seems), you will know the fundamental
    nature of how computer systems work and fit together. This means that every time
    you come across a new system, or piece of software, you will be ables to get to
    zero in on the key functions and properties, enabling you to get to grips with
    how it works, and discuss it confidently.


    Being secure in your ability to deal with computers and software will dramatically
    improve both your productivity and your speed with which you can get things done
    when working with technical staff in your company.


    ## Understanding how software works


    One of the primary reasons programming is being taught to young children is because
    of the speed with which the world of software develops. Our current primary computing
    device, the smartphone, has only been around in its current form for 10 years.
    Who knows what devices we will be using 5, 10 or 20 years from now? Teaching children
    to code teaches them the fundamentals of how software works, which are not likely
    to change any time soon. This will enable them to quickly adapt to new operating
    systems, different programs or apps, and new devices.


    The same is true for adults – learning how computers work gives you the power
    to absorb new software and hardware into your workflow, making you more adaptable
    and essentially future-proofing your career.

    '
  mdcn: '


    # 导言


    理解编程如何支撑我们与电脑、手机和智能设备进行的每一次交互。你所编写的代码行将使你能够更好地利用你每天使用的技术。


    # 我是谁？


    我想花点时间告诉你们，学习编程是如何改变我的生活的。我在大学学习数学，之后在伦敦的一所中中学当了一名老师。我非常喜欢教学工作，但我怀疑这可能不是我一生想要做的事情，于是每天晚上和周末，我开始尝试构建网站。


    我小时候学过一点编程，尝试在 BBC Micro 上复刻我喜欢的电脑游戏，但我绝不是什么马克·扎克伯格或比尔·盖茨。我通常只是对某个网站有个想法，然后通过
    Google 搜索如何实现它。这种学习方法是免费且相当直观的，但也意味着我经常会绕很多长且不必要的弯路，直到我发现有更好的处理方法。


    我的第一次尝试的网站是 HomesExchange.org，这是一个允许人们通过交换几周房屋来节省住宿费的网站。遗憾的是，我没有意识到域名 HomesExchange.org
    也可以被理解为 HomeSexChange.org。在经历了几次令人尴尬的客户投诉后，我决定这个生意不太可能走远！


    我又建立了好几个网站，其中大多数都无疾而终，直到有一天，我产生了一个环保 Web 托管服务的想法，让人们能够以一种环保的方式托管他们的网站和电子邮件。这属于“自力救济”，因为我曾为为自己的网站寻找过此类服务，而现有的选择通常很贵，而且功能没有像
    GoDaddy 和 123-reg 等大型主机托管商那样丰富。


    这项服务（ecowhosting.co.uk）被证明是很多人需要的，随着人们通过 Google 和口口碑发现这个网站，它开始自然地增长。随着网站受欢迎程度的提高，添加了一些每天必须手动操作几次的功能和自动化流程，并在过程中学习了编程。


    2012 年，我辞去了教师工作，全职投入到 Eco Web Hosting 和其他一些项目中。我很快发现，自由职业并不像我想象中那么“自由”，因为我总是同时有几项活动在进行。我喜欢拥有可靠的收入来源（通过
    Web 托管）、新项目（主要是自由职业的网站和应用）以及创业新业务，但我也为应对这么多需求而感到挣扎。


    2014 年 1 月，我开始制作在线课程来教人们如何构建网站。我注意到视频课程变得流行，并认为结合编程知识、教学技巧和创业经验，可以提供一种有趣、实用且基于项目的学习方法。我的《Complete
    Web Developer》课程后来成为了最畅销的课程之一，随后又推出了《Complete iOS Developer》课程和《Complete Android
    Developer》课程。


    通过我的课程，我已经教了超过五十万人学习编程，让他们意识到互联网可以提供的规模并帮助了许多他人。课程还带来了财务自由，以及编程带来的许多机会。史蒂夫·乔布斯曾著名地说过：“我认为每个人都应该学习编程，因为它教你如何思考。”这是一个至关重要的益处——编程迫使你用逻辑和分析的方法来处理问题，并测试解决方案是否有效。对处理电脑和软件的能力充满自信，将极大地提高你的生产力以及与公司技术人员合作时完成任务的速度。


    # 更多在线资源


    在书的不同章节，我将向你介绍相关的在线资源。以下是获取方式：


    - 1. 书中的每个在线资源都至关重要，例如：

    - 2. 访问 kogan.com

    - 3. 你将看到“资源（resources）”按钮

    - 4. 它们将带你深入学习。

    - 5. PDF 为每个编程问题提供了相应的 URL。


    # 如何使用本书


    本书的设计尽可能实用且具有实操性。通过积极参与并遵循每一个指令和活动，你将从中获得最大的收获。书中有三种类型的功能来帮助你学习编程：问题（questions）帮助你记忆关键信息，练习（practice
    exercises）确保你的新技能得到磨练和发展，而挑战（challenges）促使你深入学习。随着课程的进展，你会发现问题变少了，而挑战越来越多。希望你喜欢这段旅程！


    # 第一部分 | 为什么要编程？


    ## 为什么编程很重要以及它能为你做什么


    我们已经看到了学习编程重要的几个原因：它可以增加你的薪水，拓宽未来的职业选择，并成为自雇和创业的跳板。它还将帮助你应对日益自动化的未来，如智能助手、自动驾驶汽车和虚拟现实。


    在本章中，我们将看看现在编程完成的一些特定事情，其中许多我们将在书中进行扩展。


    ## 变得更高效


    今天几乎所有的工作都需要花时间操作电脑。你可能每天都要执行一系列类似的任务，包括处理电子邮件、创建和管理文档以及搜索网络。通过了解你正在使用的软件和操作系统如何工作，几乎所有任务都可以变得更高效。


    起初，只需使用快捷键可能每天就能为你节省几分钟，更重要的是，你会开始思考你正在使用的软件是如何工作的，以及如何改进你的工作流。像文本扩展和 If This
    That 这样的服务（我们会详细介绍），可以为你节省大量时间并帮助你更好地工作。想象一下自动给同事发送每周简报的摘要，或者完全自动化地将每周销售报告转换为同事随时查看的实时网页。


    学习编程将允许你完成这一切以及更多，在更短的时间内完成更好的工作。


    ## 与技术人员交流


    无论你对技术的熟练程度如何，你可能需要经常与技术人员交流一些你完全不理解的事情。无论是尝试为公司网站添加内容、在电脑上安装软件，还是删除你不小心发布在公司账号上的推文，更多的技术知识都能让这些对话变得简单得多。


    除了熟悉技术人员使用的术语（这些术语实际上并没有看起来那么复杂或神秘），你将了解电脑系统如何工作以及如何连接的基础本质。这意味着每当你遇到新系统或新软件时，你都能锁定关键功能和属性，使你掌握其工作原理并自信地讨论它。


    对处理电脑和软件的能力充满自信，将极大地提高你的生产力，以及与公司技术人员合作时完成任务的速度。


    ## 理解软件是如何工作的


    教儿童编程的首要原因之一是软件世界的发展速度之快。我们目前主要的计算设备智能手机以目前的形式只出现了 10 年。谁知道 5 年、10 年或 20 年后我们将使用什么设备？教孩子编程是教他们软件运行的基本原理，这些原理在短期内不会改变。这将使他们能够快速适应新的操作系统、不同的程序或应用以及新设备。


    '
