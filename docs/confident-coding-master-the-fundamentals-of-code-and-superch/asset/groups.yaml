- md: "\nNow, give the last paragraph on the page an id attribute, like this:\n\n\
    ```\n<p id=\"last\">\n```\n\n(We'll be seeing a lot more of the id attribute in\
    \ the CSS chapter.) Finally, change the code for the link at the top to look like\
    \ this:\n\n```\n<a href=\"#last\">Go to last paragraph</a>\n```\n\nThe # (hash)\
    \ symbol tells the browser instead of jumping to another page, it should look\
    \ for an id tag of 'last' in the current page and jump there. Try it out. You\
    \ should find when you click on the link it jumps to the bottom of the page.\n\
    \n# Practice exercise\n\n- 1. Practise creating links in the exercise at CC 9\n\
    \n# HTML entities\n\nSometimes you might want to use symbols in your web pages,\
    \ such as the copyright symbol ©, the euro symbol € or even a smiley face \U0001F642\
    . This can be done by using HTML entities, or special codes that browsers display\
    \ as the required symbols. So to display a smiley face, we use:\n\n```\n&#9786;\n\
    ```\n\n# Try it out in Brackets (3.22):\n\n![](img/57532e13229b6da209b2a527acf10e32_59_0.png)\n\
    \nThe &amp tells the browser that we are about to enter an HTML entity, and the\
    \ # indicates we are going to describe the entity by its code number. The code\
    \ number for a smiley face is 9786, and then we use a semicolon to complete the\
    \ HTML entity.\n\nSome symbols can be displayed using a code number and also a\
    \ code name, so:\n\n```\n&copy; and &#169;\n```\n\nwill both display the copyright\
    \ symbol ©.\nYou can see a list of some of the most common HTML entities at www.w3schools.com/html/html_entities.asp\n\
    \n# Challenge 4\n\nTry using HTML entities to add currency symbols here: CC 10\n\
    \n# iFrames\n\nThis is the final bit of HTML we will be learning in this chapter,\
    \ so congratulations for making it this far. Soon we'll be seeing how to add some\
    \ style to our webpages using CSS.\n\niFrames allow us to include the content\
    \ of another webpage in our own. For example, we could include the Google homepage\
    \ in our webpage using this code:\n\n```\n<iframe src=\"http://www.example.com\"\
    ></iframe>\n```\n\n![](img/57532e13229b6da209b2a527acf10e32_60_0.png)\n\nTry changing\
    \ www.example.com to other websites that you visit, such as bbc.co.uk. Note that\
    \ some popular websites, such as google.com and facebook.com, don't allow their\
    \ websites to be displayed in iFrames.\n\nQuestion: Can you add some attributes\
    \ to the <iframe> element to make the iFrame box as wide and tall as your browser\
    \ window?\nAnswer: Just add width and height attributes as we did with images:\n\
    \n```\n<iframe width=550 height=660 src=\"http://wikipedia.org\">\n</iframe>\n\
    ```\n\n# Languages will give you something like this (3.24):\n\n# 3.24\n\n![](img/57532e13229b6da209b2a527acf10e32_61_0.png)\n\
    \nOne particularly handy use of iframes is to include media such as YouTube videos\
    \ in your webpages. To do this:\n\n- Go to youtube.com and click on any video\
    \ you like.\n- Scroll down and click on the Share button (underneath the red Subscribe\
    \ button).\n- Click on Embed.\n- Copy the code to your clipboard (ctrl-c or cmd-c\
    \ on a Mac) and then paste it into your webpage. You should end up with something\
    \ like this (3.25):\n\n# 3.25\n\n![](img/57532e13229b6da209b2a527acf10e32_61_1.png)\n\
    \nThe code is a simple iFrame with a width and a height, but also has the attributes\
    \ frameborder=\"0\", which turns off the iFrame border, and allowfullscreen, which\
    \ is a YouTube-specific attribute that, as you might have guessed, allows the\
    \ user to make the video full screen.\n\n# Practice exercise\n\n- 1 Try adding\
    \ an iFrame to include any website here: CC 1\n\n# HTML project: putting it all\
    \ together\n\nCongratulations! You have learned the basics of HTML. It's time\
    \ to put your newfound knowledge into practice by creating a single webpage containing\
    \ as many of the elements in this chapter as possible. Pick a topic you are interested\
    \ in, and then create your page by adding a title, header, lists, an iFrame and\
    \ all the other elements you have covered. Once you're done, go to codepen.io\
    \ and paste your code. You should see your webpage at the bottom of the screen,\
    \ and you can share it on social media.\n\n# Summary\n\nAs we have learned, HTML\
    \ forms the basis of every webpage. You have now learned how to create and edit\
    \ all elements, so the next step on our coding journey is to learn how to style\
    \ our pages – adding colour, changing sizes, adjusting text formatting and lot\
    \ more. We do that using CSS, or Cascading Style Sheets, and that is what we'll\
    \ be looking at in the next chapter.\n\n# Further learning\n\nAt this point of\
    \ the book, I would recommend going on to learn CSS. However, if you want to dive\
    \ deeper further, check out these resources into how the language works and what\
    \ you can do with it:\n\n- www.codeacademy.com/courses/beginner/ – free interactive\
    \ exercises for HTML.\n- www.w3schools.com/html/ – free HTML tutorials.\n- http://learncode.com/html-css/\
    \ – great site for learning HTML and CSS.\n- https://play.google.com/store/apps/details?id=com.sololearn\
    \ – free Android app for learning HTML.\n- iPhone app for learning HTML.\n\n#\
    \ CSS 4\n\nNow that you have covered HTML, which allows you to create different\
    \ types of elements on a webpage, this chapter you'll learn how to style those\
    \ elements using CSS. Then, in the next chapter, we'll be making the elements\
    \ interactive using JavaScript.\n\nIn this chapter we'll cover:\n\n- what CSS\
    \ is and how it is used;\n- how to refer to elements using classes and IDs;\n\
    - using DIVs to break up our webpages;\n- how to use CSS to adjust the following:\n\
    \  - borders and positioning\n  - colours and fonts\n  - text and link formatting.\n\
    \n# What is CSS?\n\nHTML allows us to add elements to our webpages, but it does\
    \ not easily allow us to adjust their position, colour or style in general.\n\n\
    CSS was introduced by Håkon Wium Lie, a colleague of Berners-Lee, in 1994. The\
    \ main idea is to keep the styling information separate from the content of the\
    \ page, so it's easy to adjust the style without affecting the content. In fact,\
    \ you can completely change the look and layout of a webpage by just changing\
    \ the CSS, without editing the HTML at all.\n\nCSS stands for Cascading Style\
    \ Sheets – the 'cascading' part refers to the way the browser decides which style\
    \ should apply to an element when there are multiple conflicting rules. For example,\
    \ if one style says a <p> element should be blue, and another says it should be\
    \ red, we need to have a consistent way to know what colour the <p> element should\
    \ actually be. We'll see several examples of this later on.\n\n# Why learn CSS?\n\
    \nLearning HTML without CSS is a bit like learning to paint in black and white:\
    \ you can draw anything you like, but you are missing out on a world of colour.\
    \ CSS allows us to design our websites to look unique, friendly and pretty. It\
    \ will allow you to customize the look of any website you want to build or maintain.\n\
    \nFrom a coding point of view, CSS's use of classes and IDs (we'll see what they\
    \ are very soon) is fundamental to JavaScript, and will teach you how we can use\
    \ a single line of code to affect the look of different elements. CSS is still\
    \ pretty simple, but is slightly more complex than HTML to get your head around,\
    \ so it's the perfect second language to learn as you develop your coding skills.\n\
    \n# What does CSS look like?\n\nEnough introduction! Let's see some CSS in action.\
    \ First off, add a paragraph to an empty webpage containing the words: 'I love\
    \ HTML.'\n\n> Note – head to the beginning of the HTML chapter if you need a reminder\
    \ on how to set up your text editor, browser and a basic webpage. Your code should\
    \ look like this:\n\n```\n<p>I love HTML.</p>\n```\n\nNow add a 'style' attribute,\
    \ with a value of 'color:blue' so it looks like this:\n\n```\n<p style=\"color:blue\"\
    >I love HTML.</p>\n```\n\nThrough the wonder of CSS, you will see that the text\
    \ turns blue. Try experimenting with other colours.\n\n> Note to my British readers:\
    \ you will have to use American spelling I'm afraid, colour:blue will not work.\n\
    \nThe 'color:blue' part is the CSS, and is a single CSS rule which applies to\
    \ that particular <p> element.\n\nAdding CSS using a 'style' attribute is known\
    \ as inline CSS, as it is in line with the HTML.\n"
