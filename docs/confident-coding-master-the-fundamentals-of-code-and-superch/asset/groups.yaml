    because you have that problem yourself. You''ll also get quick feedback (good
    and bad!) from your colleagues, and there is always the possibility your app will
    grow into something bigger than you could imagine.


    # Starting a blog


    In the world of Facebook and Twitter, writing a blog might feel a little old fashioned.
    You can certainly develop a following on social media (and we''ll look at how
    to do more effectively later in this chapter), but running your own blog has a
    few unique advantages. Firstly, the sheer fact setting up a blog is more difficult
    than creating a Facebook or Twitter account shows that you are serious. It is
    a way of telling the world that you have something to say, and that you are dedicated
    enough to regularly create content that people enjoy.


    Secondly, as it is your blog, you have complete control over your content. You
    are not limited as you are with social networks in how content will be displayed,
    or who can view it.


    Thirdly, and most importantly, there is the google effect. Increasingly, regardless
    of your industry, potential employers will use search engines to find out about
    job applicants. If you run and update a blog that will almost certainly become
    the top search result when people search for you. That''s a pretty impressive
    thing for a potential employer to see.


