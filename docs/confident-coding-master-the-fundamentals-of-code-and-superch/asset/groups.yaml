    \n- 顶部栏具有常用的保存、打开、复制、粘贴等菜单选项，还有一个绿色的“播放”三角形，你将用它来运行你的应用。\n- 左侧面板显示应用内部的文件结构。\n\
    - 主窗口显示我们当前正在编辑的文件内容，在本例中，就是 `MainActivity` Java 文件。\n\n其他的按钮和菜单暂时可以忽略——我们稍后会用到其中一些，但大多数情况下，你只有在进行一些高级\
    \ Android 开发时才需要它们。\n\n设置已完成——在我们开始自定义应用之前，我们先来快速回顾一下在 Android 虚拟设备（AVD）上运行应用的过程。\n\
    \n## 运行你的第一个 Android 应用程序\n\n运行你的应用非常简单——只需点击菜单栏上的绿色“播放”按钮即可。\n\n系统会提示你创建一个虚拟设备，你可以从不同的手机和平板电脑列表中进行选择。你可以选择任何你喜欢的——我将坚持默认的\
    \ Nexus 5。\n\n接下来，你可以选择在你的虚拟设备上安装任何版本的 Android。\n\n除非你特别想要某个版本，否则我建议使用默认版本，在我的情况下是\
    \ Lollipop。\n\n最后，你可以给设备命名，并选择一些高级选项，例如设备是以竖屏还是横屏取向启动。我建议目前保持默认选项即可。\n\n恭喜你，你完成了！选择该设备，点击\
    \ Run（运行），设备将启动并最终（取决于你的机器性能，大约 2–5 分钟）在 Android 模拟器中显示你的应用。\n\n你已经运行了你的第一个 Android\
    \ 应用程序，但当然，它现在还做不了，所以让我们看看如何自定义应用的 UI（用户界面）。\n\n## 添加文本和按钮\n\n我们很快就会编写 Java 代码，但首先让我们看看如何向应用中添加文本和按钮。在主编辑窗口的正上方，你应该看到两个标签：`activity_main.xml`\
    \ 和 `MainActivity.java`。\n\n点击 `activity_main.xml` 标签，你将看到一个显示应用布局的屏幕。点击“Hello\
    \ World”文本，你会看到类似这样的界面 (9.1)：\n\n![](img/57532e13229b6da209b2a527acf10e32_191_0.png)\n\
    \n此窗口分为四个主要区域：\n\n- 左上角的 **Palette**（调色板）有一长系列可以添加到应用中的元素，例如按钮（Buttons）、复选框（CheckBoxs）和开关（Switches）。\n\
    - 左下角的 **Component Tree**（组件树）显示已添加到应用中的元素，以及它们之间的关系（在本例中，我们有一个 `TextView`，它位于\
    \ `activity_main` 布局内部）。\n- 主编辑窗口显示你的应用预览，并允许你在屏幕上拖动元素。\n- **Properties window**（属性窗口）显示当前选中元素的属性（在本例中，为\
    \ Hello World 文本）。\n\n花几分钟尝试在屏幕上添加不同的组件，更改它们的属性并移动它们。\n\n## 挑战 1\n\n尝试重建这个布局 (9.2)：\n\
    \n![](img/57532e13229b6da209b2a527acf10e32_192_0.png)\n\n解决方案：\n\n首先，获取“Hello\
    \ World” `textView` 并将其拖到屏幕中心——你应该看到一个蓝色的布局指南出现，显示它已正确居中。在 Properties 窗口中，将 `text`\
    \ 字段从“Hello World”更改为“My Great App”。然后，在 `textAppearance` 下拉菜单中选择 `AppCompat.Large`。你的文本标签现在应该像上面的图片中显示的那样。\n\
    \n添加按钮：在 Palette 中找到 `Button` 并将其拖到屏幕上，使其居中并略低于 `textView`。在按钮的 Properties（属性）的\
    \ `text` 字段中将文本更改为“Click Me!”。\n\n就是这样。你可以继续进一步实验更改颜色、尝试不同的布局等。如果在 Properties\
    \ 窗口中看不到某个选项，点击“View all properties”（查看所有属性）链接以查看所有可用选项。你可以在那里自定义几乎自定义的任何内容。\n\
    \n## 让应用具有交互性\n\n如果你再次运行应用（这次应该快得多！），你将看到布局出现在虚拟设备屏幕上，但如果你点击按钮，你会发现什么都没有发生。就像开发\
    \ iOS 一样，我们需要编写一些代码来让按钮执行某些操作，但过程稍有不同。\n\n在我们编写任何代码之前，在 Android 开发中，我们需要为按钮设置\
    \ `onClick` 属性，告诉应用当按钮被点击时想要运行的“方法”（method）名称。方法本质上与函数相同——一段我们可以通过引用其名称来运行的代码。\n\
    \n要设置此项，点击该按钮并在 `onClick` 字段中输入 `buttonClicked`。现在我们需要编写 `buttonClicked` 方法。\n\
    \n我们在 `MainActivity.java` 文件中进行此操作，因此点击编辑窗口上方的 MainActivity java 标签。在文件中你会看到以下代码：\n\
    \n```\npackage com.example.robpercival.myfirstapp;\n\nimport android.support.v7.app.AppCompatActivity;\n\
    import android.os.Bundle;\n\npublic class MainActivity extends AppCompatActivity\
    \ {\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n\
    \        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
    \    }\n}\n```\n（注：此处原文代码块似乎不完整或存在截断，但已按要求保留代码且不翻译）\n\n这是 Java 代码，我们通过运行它。\n\n\
    ## Android 应用构建\n\n运行应用的代码需要 Android OS（操作系统）。\n\n第一行定义了包名，在我的情况下：\n\n```\ncom.example.robpercival.myfirstapp;\n\
    ```\n\n`import` 语句引入了各种库（libraries），允许你使用特定的功能，例如 TextView、按钮等。这些默认行提供了运行我们活动所需的代码。\n\
    \n接下来，我们创建一个名为 `MainActivity` 的类。类是方法（执行代码段）和变量的集合。这个特定的类将控制主活动。由于我们的应用只有一个活动，它基本上控制了我们的应用。\n\
    \n接下来，我们构建一个 `onCreate` 方法。这是一个默认方法，在活动“创建”（即应用运行时）运行。这是一个 `protected` 方法，意味着它可以从应用的任何地方访问，但不能被其他应用访问。此行中的\
    \ `void` 表示该方法不返回任何内容。为了理解这意味着，想象有一个名为 `plus` 的方法，可以将两个数字相加。为了让该方法工作，你需要向方法传递两个数字，然后它会返回这两个数字的和。`onCreate`\
    \ 运行了一些代码，但不返回任何内容，这通过方法定义中的 `void` 得到了证实。\n\n`super.onCreate(savedInstanceState);`\
    \ 行运行了活动运行时所需的所有默认代码。`savedInstanceState` 包含了应用之前的状态，在某些情况下可以将应用返回到该状态（例如，返回用户之前在应用写的电子邮件）。\n\
    \n最后，`setContentView(R.layout.activity_main);` 确立了我们要使用 `activity_main` 来定义我们的布局或“内容视图”。这将显示我们创建的用户界面布局。\n\
    \n呼！这里有很多理论知识，如果目前不是一切都完全清楚，不要担心——当你开始构建更多应用时，它们会变得更有意义。目前，一个广泛的理解就足够了。\n\n"
