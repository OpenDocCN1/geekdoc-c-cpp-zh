    ## Banking


    It goes without saying that technology is at the centre of banking today. Machines
    can make trades far quicker than humans can, and consumers are increasingly interacting
    with their banks online and through apps. Whatever your position in the banking
    sector, understanding the tools that you and your colleagues use every day enables
    you to use them more effectively.


    If you spend all day in Excel creating financial models, learning to code can
    not only help with the process of finding bugs in your formulas and check your
    results, but can also give you more powerful techniques to automate processes
    you are currently doing by hand.


    ## Trade industries


    While the actual processes of building houses and fixing boilers are still the
    role of humans, a strong grasp of technology can still give people working in
    trade industries an edge. Customer service is an important aspect of any tradesperson''s
    role, and being able to swiftly reply to queries, arrange appointments automatically,
    and managing invoices and payments efficiently will not only save time but result
    in a much happier customer base, and repeat business.


    As with other sectors, if you create a tool that solves a-problem for you, it
    is very likely others will be interested in using it too, and you will be perfectly
    placed to market your product or service to people in your industry.


    ## Creative industries


    As a photographer, graphic artist or other creative professional, it is likely
    that you are already focused on technology, and are an advanced user of a range
    of complex software. But it is also likely that you find yourself doing the same
    processes repeatedly: exporting to various file types and sizes, applying filters,
    tweaking colour values and much more. Being able to automate some of these processes
    can make you more efficient and give your output a more consistent style.


    It is also inevitable that you will work with developers, perhaps to create your
    own portfolio site, or working together on a particular project. Being able to
    communicate effectively with them is crucial for a job to go well, and once you
    get to the level that you can build your own websites or apps, you can offer a
    more complete service to your clients.


    ## Retail and service


    The retail and service industries are all about providing a great experience for
    your customers. That often means providing a great digital experience, which is
    more efficient for both the organization and the end-user. Having command of that
    technology and being able to create and customize features for your users, is
    highly attractive to employers, and enables you to do a better job day-to-day.


    ## Summary


    These are just some of the very practical ways that learning to code can improve
    your prospects, make you more valuable as an employee and give your opportunities
    for greater freedom and career advancement. As Jason Calacanis, CEO of Mahalo
    and founder of the start-up showcase Launch says, ‘An employee who understands
    how to code is valued at $500,000 to $1 million toward the total acquisition price.’
    That’s a lot of value to create by learning a new skill.


    We will look in more detail at all of these opportunities later in this book,
    however, we will spend a little time demystifying coding. We will learn what exactly
    coding is, why there are so many coding languages and which ones you should learn.
    We''ll also see how both the internet and offline apps function, and familiarize
    you with the basic terminology that you will come across in this book (and in
    all those conversations with technical people that you are aware to have).


    On a final, more general note, I have found that learning to code gives people
    a great feeling of empowerment. Having the ability to create digital products
    such as apps and websites is something very few people can, and brings so much
    potential into your life. It has completely changed my life, and it can do the
    same for you.


    ## What coding is 02


    For people who haven''t programmed before, coding can feel like a mysterious art.
    The mythical ''coder'' is someone who (usually while wearing headphones and listening
    to electronic music) can coax a computer into doing their bidding, but really,
    the whole process is much more straightforward than that.


    In this chapter, we will find out what programming is and write a few simple lines
    of code to get us started. We''ll also look at the different types of software
    we can produce with code, including websites, mobile apps and programs for desktop
    computers. Finally, we will learn some general coding processes that will stand
    you in good stead when we tackle our first coding language, HTML, in the next
    section.


    ## What is coding?


    Put simply, coding is the process of writing lines of instructions that make a
    computer (or tablet, phone, or watch) do something. But it''s a little more complicated
    than that, so let''s cover a little bit of background.


    The fundamental electrical component that allows a computer to do what it does
    is the **transistor** - a tiny piece of electronics that can either be on (allow
    electricity to pass through) or off (electricity cannot pass through). Current
    computer processors have around 2 billion transistors, which can turn on and off
    around 3 billion times every second. (Incidentally, *Homo sapiens* has 100 billion
    neurons which can turn on and off around 1,000 times a second, so we''re getting
    close to being able to simulate the power of a human brain.)


    What this is is computers ''think'' in terms of 1s and 0s, with 1 meaning ''on'',
    or true, and 0 meaning ''off'', or false. In the very early days of computing,
    the only way to communicate with a computer was to enter streams of 1s and 0s,
