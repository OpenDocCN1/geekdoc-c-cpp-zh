    name is a web address, like google.com. Owning robber-.co.uk has been very useful
    for me, and I would thoroughly recommend that you stop reading now and to purchase
    your name. If you have a common name, you might need to try alternative domain
    extensions as .me, .blog, or you can get creative like the blogger John Gruber
    did when he set up his blog at daringfireball.com (which you''ll hear more detail
