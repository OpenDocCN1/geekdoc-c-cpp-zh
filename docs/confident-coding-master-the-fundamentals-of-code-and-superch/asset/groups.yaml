    ## 什么是编码？


    简单来说，编码是编写指令行的过程，让计算机（或平板电脑、手机或手表）执行某些操作。但它比这要复杂一点，所以让我们了解一下背景。


    让计算机执行其功能的基础电气元件是**晶体管**——这是一种微小的电子元件，它可以开启（允许电流通过）或关闭（电流无法通过）。目前的计算机处理器拥有大约 20
    亿个晶体管，每秒可以开关约 30 亿次。（顺便一下，*人类*拥有 1000 亿个神经元，每秒开关约 1000 次，所以我们正接近能够模拟人类大脑的力量了。）


    这意味着计算机是以 1 和 0 来“思考”的，1 代表“开启”或“真”，0 代表“关闭”或“假”。在计算机计算的极早期，与计算机通信的唯一方法是输入 1 和
    0 的流，但这显然并不 Practical。因此，通常开发了计算机“语言”，允许人们以更方便的方式向计算机发出指令。


    计算机语言非常像英语或西班牙语的人类语言，因为每种语言都有特定的命令（单词）和语法（标点符号），因此人类和计算机都能理解它。然而，计算机语言与人类


