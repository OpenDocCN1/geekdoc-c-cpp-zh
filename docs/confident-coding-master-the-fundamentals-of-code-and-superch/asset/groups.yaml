  mdcn: "\n应用程序应该要求用户输入一种货币的金额，然后将其转换为另一种货币，并将结果显示在屏幕上。很简单。我将使用英镑兑换美元，在本文写作时，它们的汇率为\
    \ 1.31，但你可以使用任何你喜欢的货币。祝你好运！\n\n## 货币转换器应用：解决方案\n\n首先在 Xcode 中创建一个新项目（File -> New\
    \ -> Project）并输入默认设置。\n\n然后创建用户界面：拖入一个用于应用标题的标签（label）、一个文本字段（text field）、一个按钮（button），然后是结果的第二个标签。结果看起来应该是这样（8.9）：\n\
    \n![](img/57532e13229b6da209b2a527acf10e32_182_0.png)\n\n## 实践\n\n注意结果目前是空的——当用户点击按钮时，我们将用代码添加数值。\n\
    下一步是为标签和文本字段创建输出（Outlets），并为按钮创建一个动作（Action）。按照通常的方法操作，但要按 ctrl 拖拽，直到你的代码看起来如下所示：\n\
    \n```\n@IBAction func buttonClicked(_sender: AnyObject) {\n}\n\nIBOutlet var textField:\
    \ UITextField!\n\nIBOutlet var label: UILabel\n```\n\n最后，我们将向 `buttonClicked()`\
    \ 方法中添加代码以进行计算并将结果显示给用户。首先，我们获取文本字段的内容（注意我使用的是 `let` 而不是 `var`，因为这个值将不会改变）：\n\n\
    ```\nlet valueUserEntered = textField.text!\n```\n\n然后将其转换为 `Float` 以便我们可以进行乘法运算（不要忘记添加\
    \ `!`，因为结果将是一个可选值）：\n\n```\nlet amountInPounds = Float(valueUserEntered)\n```\n\
    \n接下来我们进行乘法运算：\n\n```\nlet amountInPounds = amountInPounds * 1.31\n```\n\n然后我们将其转换为\
    \ `Float` 以便我们可以进行乘法运算：\n\n```\nlet amountInDollars = amountInPounds * 1.31\n\
    ```\n\n最后，我们更新标签以给出我们需要的结果（注意我们在这里需要将 `amountInDollars` 转回字符串）：\n\n```\nlabel.text\
    \ = \"Result = $\" + String(amountInDollars)\n```\n\n将所有内容整合在一起，你的应用看起来应该是这样（8.10）：\n\
    \n## 为 iPhone 或 iPad 构建应用\n\n![](img/57532e13229b6da209b2a527acf10e32_184_0.png)\n\
    \n现在运行应用并检查它是否正常工作。如果你正确设置了一切，你应该能够输入一个金额，应用将将其转换为新货币（8.11）：\n\n![](img/57532e13229b6da209b2a527acf10e32_184_1.png)\n\
    \n万喜！一切看起来都很好，但有一个小问题——如果用户不在应用中输入数字，它将会崩溃。尝试输入“two”或任何字符串，你就会看到错误。这是因为 `Float`\
    \ 命令失败了，因为 Swift 无法将“two”转换为数字。为了绕过这个问题，我们可以使用 `if` 语句：\n\n```\nlet amountInPounds\
    \ = Float(valueUserEntered) {\n\n    let amountInDollars = amountInPounds * 1.31\n\
    \n    label.text = \"Result - $\" + String(amountInDollars)\n} else {\n\n```\n\
    \    label.text = \"Please enter a number\"\n}\n```\n\n这是一个非常巧妙的解决方案——第一行现在会测试转换是否可能，如果是，则继续显示结果。如果不是，它会显示一条友善的错误信息。\n\
    \n## 总结\n\n我们在这一节中涵盖了大量内容。希望你现在对 Xcode 已经相当熟悉，并且理解了应用是如何制作的基础知识。你已经看到用户界面如何与应用的代码交互，从而创建一个向用户提供信息的可用应用。\n\
    \n## 进一步学习\n\n在下一章中，我们将学习如何为另一个主要平台 Android 构建应用。但是如果你想深入学习 iOS 应用开发，可以尝试这些链接：\n\
    \n- www.udemy.com/complete-ios-10-developer-course/ – 我的 iOS 应用开发在线课程。\n- www.appcoda.com/ios-programming-course/\
    \ – 免费的 iOS 开发教程。\n- https://itunes.apple.com/us/course/developing-ios-8-apps-swift/id961180099\
    \ – 热门斯坦福 iOS 编码课程——有一点过时，但质量不错且免费。\n- www.coursera.org/specializations/app-development\
    \ – 基于 Swift 的 iOS 开发课程。\n- www.udacity.com/course/ios-developer-nanodegree--nd003?v=ios1\
    \ – 由 AT&T、Lyft 和 Google 创建的 iOS 开发者课程。\n\n## 为 Android 构建应用 09\n\n截至 2016 年，Android\
    \ 占据了智能手机市场的 85% 以上，是目前最大的移动平台。它也是投入要求最少的平台，因为可以使用 Windows、Mac 或 Linux 构建应用。在本章中，我们将介绍创建一个简单\
    \ Android 应用的过程，这与我们在上一章中制作 iPhone 应用的方式相似。\n\n虽然 iOS 开发使用 Apple 自己的语言 Swift，但\
    \ Android 开发使用 Java（一种与 JavaScript 非常不同的语言）。我们将通过下载 Android Studio 开始，它是 Android\
    \ 开发中 Xcode 的对应。一旦下载了 Android Studio，我们将浏览界面并运行一个 Hello World 应用。然后我们将添加标签和按钮，实现交互性，最后制作一个应用。\n\
    \n## 下载并设置 Android Studio\n\nAndroid 开发者官网是 developer.android.com ——非常值得点击并阅读指南。一旦你进入那里，就可以下载\
    \ Android Studio。在该页面点击大的下载按钮，同意条款和条件，就可以准备好了。它像任何其他软件一样安装，而且从 Android 2.2 开始不再需要单独下载\
    \ Java（这让生活变得简单）。\n\n一旦安装了 Android Studio，运行它，可能会提示安装各种更新。我的建议是选择所有默认选项，点击 Next\
    \ 让软件运行。几分钟后，你应该看到“欢迎来到 Android Studio”屏幕。点击“新建项目”\n\n- Application name：任何都可以——尝试“My\
    \ App”。\n- Company Domain：类似于域名，例如 google.com，但你不需要拥有该域名。现在可以使用任何内容，但如果你将应用提交到\
    \ Google Play，公司域名将成为应用的唯一包 ID。\n- Project location：你可以根据需要更改，或保持默认值——这是项目文件存储的位置。\n\
    - Form Factors：选择包括手机、平板电脑、Android Wear、TV 等设备。我们在介绍中只涵盖手机和平板，所以请确保目前只选择了该选项。你会注意到你可以选择想要支持的最旧\
    \ Android 版本。选择的版本越旧，支持的设备越多，但你将失去一些最新功能。我的建议是选择默认版本（在我的案例中是冰淇淋）——这通常在现代功能和大量设备支持之间取得了平衡。\n\
    \n接下来，你会看到这个带有“默认活动”的屏幕。在 Android 开发中，“activity”（活动）允许我们选择应用中的单个屏幕。它就像网站上的页面，在一个应用中我们可能有一个登录活动、一个显示用户列表的活动以及一个设置活动。\n\
    \n这里有几个可选的活动模板，它们在许多情况下都很有用，但我们将从简单的（也是默认的）开始——空活动。选择它并点击 Next。\n"
