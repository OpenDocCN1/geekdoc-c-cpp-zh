    # Debugging 10


    If you''re reading this far in, you should now have some experience in coding
    in a range of different platforms and languages. Within web development, you''ve
    coded in HTML, CSS and JavaScript, using a text editor and a browser to run your
    code. You''ve coded in Python using the online compiler at https://repl.it/languages/python.
    You''ve also built an iPhone app using Swift and Xcode (if you have access to
    a Mac) and an Android app using Java and Android Studio.


    One thing you''ll likely have come across all of these platforms, and in all of
    these languages, is bugs. A bug occurs when any piece of code doesn''t run as
    intended. They vary considerably in severity, from a bug which stops your code
    running at all (such as forgetting the semicolon at the end of a line in Java),
    to a CSS issue which causes your website to display a little lower down than you''d
    like it.


    In this section we''ll start by considering why you might want to learn debugging
    even if you are not planning to take your coding career any further. Next well
    look at some standard debugging processes (and how you can apply some of them
    to non-coding related problems in your work or life in general). Finally, we''ll
    look at some specific debugging tools and techniques for the platforms we''ve
    covered so far: web (HTML, CSS and JavaScript), iOS (Swift and Xcode) and Android
    (Java and Android Studio).


    # Why learn debugging?


    Debugging is not just about fixing errors, it''s about making your code better.
    And this has applications in all aspects of life. If your job involves teaching,
    learning how the recipients of your knowledge find your type is crucial to improving.
    If you do a lot of number crunching, a small tweak in your Excel formulas could
    speed up the whole process dramatically (or make you less likely to make a mistake).


    What I find particularly useful about debugging is that the exact same techniques
    can be applied to almost anything you do in life, to make you'
- md: "\nmore effective and efficient. Once you start looking at your code, work out\
    \ where it is going wrong and fixing it, you won't be able to help applying similar\
    \ techniques to your life as a whole. It's a coding-based self-improvement program!\n\
    \n## Why do I spend so much time debugging?\n\nOne question that plagues new coders\
    \ is why they spend much time fixing problems in their code. Most people hope\
    \ that because they have a clear idea in their head about how their code should\
    \ work, that will automatically transfer itself to your computer screen and everything\
    \ will run as intended.\n\nThe reality is rather different. As you write more\
    \ and more code, you'll realize that debugging is actually a major part of the\
    \ app or website-building process, and this is fine. Computers are fickle beasts,\
    \ and us mere mortals are not used to interacting with machines that require absolute\
    \ precision, and will punish you relentlessly by running your code exactly as\
    \ you write it.\n\nSo debugging is a (big) part of the process. But that doesn't\
    \ mean that isn't frustrating and we shouldn't try to avoid it as much as possible.\
    \ So let's start by seeing how we can write code that requires minimal debugging.\n\
    \n## How to write code that requires minimal debugging\n\n### Step 0: Write good\
    \ code\n\nGood, clean code can save a huge amount of time in the long run. When\
    \ you want to build an app or add a new feature to your website, the temptation\
    \ is often to write your code as quickly as possible and to have the attitude\
    \ that, as long as it works, it is good enough. This approach is perfectly reasonable\
    \ when you're learning or for small personal projects, but in my experience it\
    \ almost always costs you more time than it saves you. Taking an extra five minutes\
    \ properly writing your code in the first place can save you hours of debugging\
    \ further down the line.\n\nCompare these two JavaScript functions, which determine\
    \ whether a number is prime or not. (A prime number has precisely 2 factors, 1\
    \ and itself. For example, 2, 3, 5, 7, 11 etc.)\n\n```javascript\nfunction isPrime(x)\
    \ {\n  for (var i=2;i<num; i++){\n    if(x%i == 0) { return false; }\n  }\n  return\
    \ true;\n}\n\nfunction isPrime(numberToCheck) {\n  // Loop through all numbers\
    \ less than numberToCheck\n\n  for (var divisor = 2; divisor < numberToCheck;\n\
    \      divisor++ ) {\n    if ( numberToCheck % divisor == 0 ) {\n      // If divisor\
    \ divides numberToCheck exactly,\n      // numberToCheck is not prime, so return\
    \ false\n      return false;\n    }\n  }\n  // If we get here, we have checked\
    \ all numbers from 2 up to\n  // numberToCheck, and none of them divide it, so\
    \ numberToCheck\n  // must be prime\n  return true;\n}\n```\n\nBoth functions\
    \ work perfectly well (the logic is identical for both), but the second function\
    \ has numerous advantages over the first:\n\n- It is well spaced out. Most programming\
    \ languages don't require line breaks, but including them makes the code much\
    \ easier to read.\n- It has meaningful variable names. Try to avoid using variable\
    \ names such as 'x' or 'number', and instead give your variables easy to recognize\
    \ names.\n- It has comments. All programming languages have a way to add readable\
    \ comments, and you should use them whenever possible to explain what your code\
    \ is doing.\n\nYou might feel that in an example like this it doesn't make too\
    \ much difference you use comments, spacing and meaningful variable names, but\
    \ when your code starts to expand to hundreds of lines (which it will if you are\
    \ building cool things!), you'll appreciate getting into this habit with all code\
    \ you write.\n\n## In practice\n\nAnother advantage of coding this way is that\
    \ it forces you to slow down, making it much less likely that you will miss a\
    \ crucial semicolon, or misspell a function name.\n\nOne other trick as you are\
    \ writing your code is to check it as regularly as possible. This means running\
    \ your app, or loading your website, and making sure it is behaving as expected\
    \ so far. As a general rule, if I've checked code that I have been writing for\
    \ over 10 minutes, I start to get a little nervous and look for a good place to\
    \ stop and check that everything is OK.\n\nThe precise timings will depend on\
    \ the project and your personality, but my advice, particularly in the early stages,\
    \ is to run your code as often as you can. If you get an error when you run it,\
    \ you will have a smaller number of changes since you do last check, so the debugging\
    \ process will be much simpler. If you don't, you'll feel encouraged and confident\
    \ that everything is going well.\n\nGreat! Now that we are writing code, let's\
    \ consider some of the standard questions we have to ask ourselves when we are\
    \ debugging. These are the most important questions in this whole chapter, and\
    \ perhaps in the whole of coding itself – if you can answer them, you can fix\
    \ any problem.\n\n### Step 1: The three questions\n\nWhen a new coder finds some\
    \ code they have written doesn't work, they often feel frustrated, not sure where\
    \ to look to fix the problem, and as a result they often blame themselves (‘I'll\
    \ never be able to do this’) or the machine itself (‘stupid computer’). This is\
    \ perfectly natural, and all coders have experienced this emotion many times.\n\
    \nThe difference between experienced and novice coders, however, is that the experienced\
    \ coder knows that this has happened many times before, that it doesn't mean he\
    \ or she is an idiot, and that it can be fixed using the same process they use\
    \ every time.\n\nSo what is this process? The first question to ask is a painfully\
    \ obvious one: What is the error?\n\nThe answer to this question might be frustrating\
    \ – you only wrote the code five minutes ago, you know how it's supposed to work\
    \ – but all too often running through the part of the code that seems be causing\
    \ the problem is all that is needed to fix the issue.\n\nWith the logo issue,\
    \ for example, you would likely go to the CSS that controls the position of the\
    \ logo. Thinking through the CSS commands you have written, *should the logo display?*\n\
    \nIf a button is not responding, mentally work through the process that is supposed\
    \ to happen when the button is clicked. Is the button correctly connected to the\
    \ function you have written for it? Could there be an error in that function?\
    \ Does the function actually display a result, or does it do some calculations\
    \ without changing the UI at all?\n\n## Debugging\n\nNinety per cent of code errors\
    \ should be fixed by now, if you have carefully asked yourself those two questions.\
    \ If you are not done yet, though, it's time to move on question 2: *How is your\
    \ code supposed to work?*\n\nAgain, answering this question might be frustrating\
    \ – you only wrote the code five minutes ago, you know how it's supposed to work\
    \ – but all too often running through the part of the code that seems be causing\
    \ the problem is all that is needed to fix the issue.\n\nWith the logo issue,\
    \ for example, you would likely go to the CSS that controls the position of the\
    \ logo. Thinking through the CSS commands you have written, *should the logo display?*\n\
    \nIf you don't have an error message, this can be tricky, but you should at least\
    \ clarify what the problem is.\n\nFinally time for question 3: *What tweaks can\
    \ you make to clarify what your code is doing?*\n\nIf you have well-written, clearly\
    \ commented code, it should be fairly obvious what your code is up to any point.\
    \ However, even good code can contain mistakes, and our final trick is to play\
    \ with variables, or add small lines of code, to see what effect that on how the\
    \ app runs or the website displays.\n\nGoing back to the logo example, you could\
    \ try experimenting with some values – does changing the margin-top value move\
    \ the logo down as you might expect? If not, why not? If you really can't find\
    \ the error you can always remove all the CSS except the lines that should be\
    \ controlling the logo’s location. If it then displays correctly, add them back\
    \ in gradually until the problem recurs. Bingo – you have found the problem.\n"
  mdcn: "\n更加有效且高效。一旦你开始检查你的代码，找出哪里出错了并修复它，你就会发现自己无法不地将类似的技巧应用到你的整个生活中。这是一场基于编码的自我提升计划！\n\
    \n## 为什么我要花费这么多时间在调试上？\n\n困扰新编码者的一个问题是，为什么他们要花费大量时间来修复代码中的问题。大多数人希望，因为他们脑中对代码应该如何运行有一个清晰的思路，这就会自动传输到电脑屏幕上，一切都会按预期运行。\n\
    \n现实情况却截然不同。随着你编写的代码越来越多，你会发现调试实际上是应用程序或网站构建过程的一个主要部分，而且这很正常。计算机是反复无常的怪兽，而我们这些凡人并不习惯与需要绝对精度的机器交互，它们会完全按照你编写的方式运行代码，并以此进行无情的惩罚。\n\
    \n所以，调试是过程中的一个（重要）部分。但这意味着它不令人沮丧，也不意味着我们应该尽可能避免它。那么，让我们先看看如何编写出调试最少的代码。\n\n##\
    \ 如何编写调试最少的代码\n\n### 步骤 0：编写良好的代码\n\n从长远来看，良好、整洁的代码可以节省大量时间。当你想要构建应用或为你的网站添加新功能时，诱惑往往是尽可能地编写代码，并抱着这种态度：只要它能运行，就足够了。这种方法在你学习或进行小型个人项目时完全合理，但根据我的经验，它几乎总是让你花费的时间比节省的时间要多。在开始时多花五分钟正确地编写你的代码，可以在后续节省你数小时的调试时间。\n\
    \n比较这两个 JavaScript 函数，它们判断一个数字是否为质数。（质数恰好有2 个因子：1 和它本身。例如 2, 3, 5, 7, 11 等。）\n\
    \n```javascript\nfunction isPrime(x) {\n  for (var i=2;i<num; i++){\n    if(x%i\
    \ == 0) { return false; }\n  }\n  return true;\n}\n\nfunction isPrime(numberToCheck)\
    \ {\n  // 遍历所有小于 numberToCheck 的数字\n\n  for (var divisor = 2; divisor < numberToCheck;\n\
    \      divisor++ ) {\n    if ( numberToCheck % divisor == 0 ) {\n      // 如果 divisor\
    \ 能整除 numberToCheck，\n      // numberToCheck 不是质数，所以返回 false\n      return false;\n\
    \    }\n  }\n  // 如果我们到了这里，说明我们检查了从 2 到\n  // numberToCheck 的所有数字，没有一个能整除它，所以\
    \ numberToCheck\n  // 一定是质数\n  return true;\n}\n```\n\n这两个函数运行得非常完美（逻辑是相同的），但第二个函数比第一个有许多优点：\n\
    \n- 它的间距很合理。大多数编程语言都不要求换行，但包含换行会让代码更易于阅读。\n- 它具有有意义的变量名。尝试避免使用如 'x' 或 'number'\
    \ 这样的变量名，而是给你的变量起容易识别的名字。\n- 它有注释。所有的编程语言都有添加可读注释的方法，你应该应该尽可能地使用它们来解释你的代码在做什么。\n\
    \n你可能觉得在像这样的示例中，使用注释、间距和有意义的变量名并没有太大区别，但当你的代码开始扩展到几百行时（如果你在构建酷炫的东西，将会是这样！），你会感激在编写所有代码时都养成这种习惯。\n\
    \n## 实践\n\n这种编码方式的另一个优点是它强迫你慢下来，这让你漏掉关键分号或拼错函数名称的概率大大降低。\n\n在编写代码时的另一个小技巧是尽可能频繁地检查它。这意味着运行你的应用或加载你的网站，并确保它到目前为止运行得符合预期。根据一般原则，如果我检查自己已经写了超过\
    \ 10 分钟的代码，我就会开始感到有些紧张，并寻找一个合适的地方停下来检查一切是否正常。\n\n具体的时间取决于项目和你的个人性格，但我的建议是（特别是在早期阶段）尽可能地运行你的代码。如果你在运行时遇到错误，那么自你上次检查以来的更改就会较少，因此调试过程会简单得多。如果没有错误，你会感到鼓舞和自信，认为一切进展顺利。\n\
    \n太棒了！既然我们开始编写代码了，让我们考虑一下在调试时必须问自己的一些标准问题。这些是整个章节中最重要的问题，也许也是整个编码过程中最重要的——如果你能回答它们，就能修复任何问题。\n\
    \n### 步骤 1：三个问题\n\n当一个新手发现他们写的一些代码不起作用时，他们通常会感到沮丧，不知道去哪里寻找修复方法，结果他们经常责备自己（“我永远做不到这个”）或责备机器本身（“笨的计算机”）。这完全自然，所有的编码者都经历过多次这种情绪。\n\
    \n然而，丰富的编码者和新手之间的区别在于，丰富的编码者知道这种情况发生过很多次，这并不意味着他们是呆瓜，可以通过他们每次使用的相同流程来修复。\n\n那么这个流程是什么？要问第一个问题显而易见：错误是什么？\n\
    \n这个问题的答案可能令人沮丧——你才写了五分钟代码，你清楚它应该如何运行——但很多时候，运行一遍似乎产生问题的代码部分就是解决问题所需的一切。\n\n以\
    \ Logo 问题为例，你可能会去控制 Logo 位置的 CSS。仔细思考你写的 CSS 命令，*Logo 应该显示吗？*\n\n如果一个按钮没有响应，在脑海中过一遍点击按钮时应该发生的过程。按钮是否正确连接到你为它编写的函数？该函数是否可能存在错误？函数真的显示了结果，还是它只做了一些计算而完全没有改变\
    \ UI？\n\n## 调试\n\n如果你已经仔细地问了自己那两个问题，现在 90% 的代码错误应该已经被修复了。不过，如果你还没有完成，那么该转向第二个问题了：*你的代码应该如何运行？*\n\
    \n同样，回答这个问题可能令人令人沮丧——你才写了五分钟代码，你清楚它应该如何运行——但很多时候，运行一遍似乎产生问题的代码部分就是解决问题所需的一切。\n\
    \n以 Logo 问题为例，你可能会去控制 Logo 位置的 CSS。仔细思考你写的 CSS 命令，*Logo 应该显示吗？*\n\n如果你没有错误信息，这可能会很棘手，但你至少应该清楚问题是什么。\n\
    \n最后是第三个问题：*你可以进行哪些调整来明确你的代码在做什么？*\n\n如果你有编写良好、注释清晰的代码，那么你的代码在任何一点的操作应该是显而易见的。然而，即使是良好的代码也可能出错，我们最后的技巧是玩弄变量，或者添加几行代码，看看这对应用运行或网站显示有什么影响。\n\
    \n回到 Logo 示例，你可以尝试实验某些值——改变 `margin-top` 值是否像你预期的那样让 Logo 向移动？如果没有，为什么呢？如果你真的找不到错误，你始终可以移除除了控制\
    \ Logo 位置行以外的所有 CSS。如果它那时显示正常，再逐行加回来，直到问题再次出现。砰——你找到问题了。\n"
