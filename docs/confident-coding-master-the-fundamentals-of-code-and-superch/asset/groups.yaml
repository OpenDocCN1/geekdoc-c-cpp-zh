    \  <td>35</td>\n    <td>Male</td>\n  </tr>\n</table>\n```\n\nThe <table> tag is\
    \ pretty self-explanatory – it indicates that we want to display a table. <tr>\
    \ is short for 'table row', and defines the beginning of a new row in our table.\
    \ <th> is short for 'table header', so each of these is a one-column header for\
