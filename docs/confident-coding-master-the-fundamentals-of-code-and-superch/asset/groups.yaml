- md: "\nThis takes us to the last setup screen. Here we just choose the name of our\
    \ initial activity, the default being Main Activity. I would recommend leaving\
    \ this as the default and clicking Finish.\n\nAnd you're done. After a few seconds\
    \ to create your app, you should see the main Android Studio interface.\n\nIt\
    \ doesn't look particularly friendly, but we can break it down into three main\
    \ parts:\n\n- The top bar has the usual, save, open, copy, paste menu options,\
    \ as well as the green 'play' triangle which you will use to run your app.\n-\
    \ The left pane shows the file structure within your app.\n- The main window shows\
    \ the contents of the file we are currently editing, in this case the MainActivity\
    \ Java file.\n\nThe other buttons and menus we can ignore for now – we'll use\
    \ some of them later but most you will only need it if you're doing some advanced\
    \ Android development.\n\nThat's the setup complete – before we start customizing\
    \ our app we'll quickly run through the process of running an app on an Android\
    \ Virtual Device (AVD).\n\n## Running your first Android app\n\nRunning your app\
    \ is simple – just press the green 'play' button in the menu bar.\n\nYou'll be\
    \ prompted to create a Virtual Device, and you can choose from a selection of\
    \ different phones and tablets. You can choose whichever you like – I will stick\
    \ with the default, the Nexus 5.\n\nNext, you can choose to install any version\
    \ of Android on your virtual device.\n\nUnless you particularly want a particular\
    \ version, I would recommend using the default, in my case Lollipop.\n\nFinally,\
    \ you can give your device a name, and choose some advanced options, such as whether\
    \ the device starts in portrait or landscape orientation. I would recommend keeping\
    \ to the default options for now.\n\nCongratulations, you're done! Select that\
    \ device, click Run and the device will start up and eventually (around 2–5 minutes\
    \ depending on your machine) display your app in the Android Emulator.\n\nYou've\
    \ run your first Android app but, of course, it doesn't do much yet, so let's\
    \ see how to customize the UI (user interface) of our app.\n\n## Adding text and\
    \ buttons\n\nWe'll be writing some Java shortly, but first let's see how to add\
    \ text and buttons to our apps. Just above the main editing window, you should\
    \ see two tabs: activity_main.xml and MainActivity.java.\n\nClick the activity_main.xml\
    \ tab and you will see a screen showing the layout of the app. Click on the Hello\
    \ World text and you see something like this (9.1):\n\n![](img/57532e13229b6da209b2a527acf10e32_191_0.png)\n\
    \nThis window is divided into four main areas:\n\n- The Palette in the top left\
    \ has a long list of elements that you can add to your app, such as Buttons, CheckBoxes\
    \ and Switches.\n- The Component Tree in the bottom left shows all the elements\
    \ that have already been added to your app, and how they are related to each other\
    \ (in our case, we have a single TextView, which is inside the activity_main layout).\n\
    - The main editing window shows a preview of your app, and allows you to drag\
    \ elements around the screen.\n- The Properties window shows the properties of\
    \ the currently selected element (in this case the Hello World text).\n\nSpend\
    \ a few minutes experimenting with adding different widgets to the screen, changing\
    \ their properties and moving them around.\n\n## Challenge 1\n\nTry to recreate\
    \ this layout (9.2):\n\n![](img/57532e13229b6da209b2a527acf10e32_192_0.png)\n\n\
    Solution:\n\nFirstly, take the ‘Hello World’ textView and drag it into the centre\
    \ of the screen – you should see a blue layout guide appear to show you that it\
    \ is correctly centred. In the Properties window change the ‘text’ field from\
    \ ‘Hello World’ to ‘My Great App’. Then, in the textAppearance drop-down menu,\
    \ select AppCompat.Large. Your text label should now display as is in the picture\
    \ above.\n\nTo add the button, find Button in the Palette and drag it on to the\
    \ screen, centred and slightly underneath the textView. Change the text to ‘Click\
    \ Me!’ in the ‘text’ field of the button Properties.\n\nIt's it. Feel free to\
    \ experiment further with changing colours, trying different layouts etc. If an\
    \ option isn't visible in the Properties window, click the ‘View all properties’\
    \ link to view all the available options. You can customize pretty much anything\
    \ there.\n\n## Making the app interactive\n\nIf you run the app again (it should\
    \ be much quicker this time!) you'll see the layout appear on the virtual device\
    \ screen, but if you click the button, you'll notice that nothing happens. Just\
    \ like with iOS development, we need to write some code to make the button do\
    \ something, but the process is a little different.\n\nBefore we write any code,\
    \ with Android development we need to set the 'onClick' property for the button\
    \ to tell the app name of the 'method' that want to run when the button is clicked.\
    \ A method is essentially the same as a function – a chunk of code that we can\
    \ run by referring to its name.\n\nTo set this up, click on the button and type\
    \ 'buttonClicked' in the onClick field. Now we need to write the buttonClicked\
    \ method.\n\nWe do this in the MainActivity.java file, so click on the MainActivity\
    \ java tab above the editing window. In file you will see the following code:\n\
    \n```\npackage com.example.robpercival.myfirstapp;\n\nimport android.support.v7.app.AppCompatActivity;\n\
    import android.os.Bundle;\n\npublic class MainActivity extends AppCompatActivity\
    \ {\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n\
    \        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
    \    }\n}\n```\n\nThis is Java, and we'll run it through by line. Don't aim for\
    \ a complete understanding of every aspect at this point - it will come later.\
    \ For now just make sure you have a fair overview of what each part is doing.\n\
    \n## Building an app for Android\n\nThe code is required to run activity any use\
    \ the Android OS (operating system).\n\nThe first line defines the name of the\
    \ package, in my case:\n\n```\ncom.example.robpercival.myfirstapp;\n```\n\nThe\
    \ 'import' lines bring in various 'libraries', which allow you to work with specific\
    \ features, such as TextViews, buttons or GPS. These two default lines give us\
    \ the default code required to run our activity\n\nNext, we're creating a 'class'\
    \ called MainActivity. A class is a collection of methods (chunks of code that\
    \ serve a particular function) and variables. This particular class will control\
    \ the Main Activity. As we have only one activity in our app, this essentially\
    \ controls our app.\n\nThe class is 'public', which means it can be accessed from\
    \ anywhere in the app (and, potentially, by other apps). It 'extends' the 'AppCompat'\
    \ class, which is a default class that contains a collection of methods we can\
    \ use with our activity.\n\nNext, we build a method onCreate. This method is a\
    \ default one, which is run when the activity is 'created', ie when the app is\
    \ run. This is a 'protected' method, meaning that it can be accessed from anywhere\
    \ in the app, but not by other apps.\n\nThe 'void' in this line means that the\
    \ method doesn't return anything. To understand what this means, imagine a method\
    \ called 'plus' which adds two numbers together. For that method to work, you\
    \ would need to pass two numbers to the method, and then it would return the total\
    \ of those two numbers. The onCreate runs some code, but does not return anything,\
    \ which is confirmed by the 'void' in the method definition.\n\nsuper.onCreate(savedInstanceState);\
    \ line runs all the default code needed when the activity is run. The savedInstanceState\
