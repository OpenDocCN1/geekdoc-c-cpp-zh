    \ they were previously writing in the app).\n\nFinally, 'setContentView(R.layout.activity_main);\
    \ establishes that we want to use activity_main to define our layout, or 'ContentView'.\
    \ This will display the user interface layout we have created.\n\nPhew! There\
    \ is a lot of theory there, and don't worry at this point if not everything is\
    \ completely clear - it will make much more sense as you start to build more apps.\
    \ For now a broad understanding is all that is needed.\n"
  mdcn: "\n\n这带我们进入最后一个设置屏幕。在这里，我们只需要选择初始活动（activity）的名称，默认为 Main Activity。我建议保持默认并点击\
