    # Website development 07


    Our first look at coding in practice will be to learn how we can build and share
    a website with the world. A website is probably the simplest thing you can build
    with code, and yet it can be hugely powerful. The potential to create something
    in a few minutes that anyone in the world can access is quite intoxicating – yet
    if you''ve worked through the previous chapters in this book you already know
    how to do that.


    We''ll start by seeing how the coding world has transitioned from software that
    runs on a ''local'' computer (ie the machine sitting on your desk or lap) to websites,
    which primarily run on a ''remote'' computer, connected to your PC or phone via
    the internet.


    Next, we''ll consider the reasons why a non-web developer might want to build
    a website, whether it''s for career advancement, pleasure or creating an online
    presence.


    We''ll then look at three options for creating a website: using a service as Weebly
    or Squarespace, hosting your own using a Content Management System as Wordpress,
    and finally coding the site yourself from scratch. You''ll learn the advantages
    and disadvantages of all three, and find out which option to use depending on
    the nature of the site you want to build.


    Finally, we''ll look at one of the most popular frameworks for building great
    looking sites, Bootstrap, and in the closing project for this section we''ll make
    a simple website of your choice.


    By the end of this section, you will be familiar with the different ways that
    you can create and host websites, and be ready to build one for any project or
    business that you want to start.


    # Why build a website?


    A hundred years ago, if you wanted to start a business, you would likely have
    needed a great deal of capital. At the least you would have needed premises to
    sell your goods, staff to make your product or financing for raw materials.'
- md: '

    # In practice


    All that has changed in the last 20 years, where some of the most valuable businesses
    in the world exist purely online, and were created by individuals with almost
    zero initial costs. Learning to code gives you the power to put any idea you have
    into action investing no more than your time and the price of a few cups of coffee.
    You don''t even need to ask anyone for permission!


    But if you don''t want to start a business, there are many other reasons you might
    want to build your own website.


    A blog is a great way to build a name for yourself online. You can share your
    love of dogs, your horticultural knowledge, or even document the process of learning
    to code. Write well and you can create a community of like-minded individuals,
    and you never know what opportunities might come out of that.


    If there is an online task that you do regularly, you might well be able to automate
    with a website, and if other people do similar tasks, you can share your tools
    with them. The web scraping code we learned in the Python chapter, for example,
    could be used to check when prices on Amazon are updated. You could then allow
    your users to check the prices of particular products, and email them when they
    go below a particular threshold.


    We will look at ways to build specific types of sites later in the book, for now
    it would be worth having a particular website in mind that you would like to build.
    It doesn''t have to be a world-changing idea, just a particular idea that will
    help you apply what you learn in this chapter.


    Take a few moments now and jot down this idea. Then, as you are reading through
    this chapter, think about how the different approaches could work with your idea,
    and which you would choose. If you really want to solidify your learning, create
    that website when you''ve got to the end of the chapter.


    # How do websites work?


    The BBC Micro computer I grew up with in the early 90s was a stand-alone machine.
    You could add programs (software) to it tapes and discs, but all the code was
    run completely on the device itself.


    As the internet grew and became faster, it began to be feasible for the code for
    programs (called websites) to be stored on powerful computers called servers which
    would then be transferred to the user''s computer and displayed in a special piece
    of software called a browser. Initially most of these websites were static, displaying
    information coded using HTML and CSS.


    Gradually websites became more interactive, and rather than static content they
    allowed users to post updates, send email or ever watch video. These type of sites
    were initially known as ''webapps'', although the word has mostly gone out of
    usage nowadays, becoming synonymous with websites themselves. Most of the actual
    running of the webapp is done on the server, and the browser just displays the
    output (a list of the user''s emails, or pictures of the user''s cat for example).


    The great advantage of working in this way is speed of development. On my BBC
    Microcomputer, if I wanted an updated piece of software I had to go and get the
    disc for it, and put it in my machine. Now, conversely, if Google want'' to update
    the Gmail interface, or if you want to edit your blog, a quick change on the server
    and the website is updated immediately for all its users around the world.


    Even traditional desktop software such as word processors and image editors are
    starting to find homes on the web and some computers, such as Chromebooks, are
    little more than browsers and an internet connection.


    So how do we take advantage of this phenomenon? We know how to write HTML code,
    now we know how to share our code with the world. It''s actually pretty simple,
    and requires two things: a domain name, and some web hosting.


    # What is a domain name, and how do I get one?


    A domain name is simply a web address, like facebook.com or bcc.co.uk. Each country''s
    domain names are managed by a central ‘registrar’, and domain names can be bought
    from a number of different providers.


    When you buy a domain name, you''re actually renting it, with the average cost
    being around £10 per year. Once you have bought it, you have the right to renew
    it each year, but if you leave it unrenewed, you will eventually return to the
    public ‘post’ and someone else can buy it.


    A quick web search for ‘buy domain name’ will turn up several results, so do a
    bit of research and choose a provider that suits you. Ideally check reviews and
    not decide completely on price – a cheap domain name might come with nasty fees,
    for example to transfer it elsewhere.


    Choosing a domain name can be difficult, as most of the good ones are already
    gone. Domain names are much a matter of personal preference, but I would recommend
    the following:


    - Get a .com or a country-specific domain (like .co.uk) if at all possible. Even
    if it is not an ideal domain name, it will be more memorable and trustworthy than
    a more obscure extension such as .boats or .black.

    - Make it easy to type. Avoid mis-spellings like Xpress (unless they are part
    of your brand of course!)

    - Use keywords. If you want to rank highly in search engines, putting your search
    terms in your domain name is a great start. If you are starting a blog about cocker
    spaniels for example, cockerspanielsblog.com wouldn’t be a bad choice (and at
    the time of writing this book, is available!).


    If you’re struggling to find ideas, these sites might help:


    - www.domainsbot.com/ – will search a range of domain names and tell you

    - www.namemap.com/ – will search a range of domain names and tell you

    - www.namesearch.com/ – will search a range of domain names and tell you


