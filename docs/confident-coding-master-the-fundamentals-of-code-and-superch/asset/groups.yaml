    # That fun – but what is HTML exactly?


    Now it''s time to look in more detail at the HTML code and what it is doing. All
    the HTML commands come inside angled brackets (< and), and they tell the browser
    how to format and display the HTML document. Everything inside the angled brackets
    is known as a tag. Let''s look in more detail at the default HTML document created
    for Brackets (3:6):


    ```

    <!DOCTYPE html (Getting Started) -- Brackets

    <html>


    <head>

    <meta charset="utf-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>GETTING STARTED WITH BRACKETS</title>

    <meta name="description" content="An interactive getting started guide for Brackets."/>

    <link rel="stylesheet" href="main.css">

    </head>

    <body>

    <h1>GETTING STARTED WITH BRACKETS</h1>

    <h2>This is your guide</h2>

    <!-- MADE WITH <3 AND JASCRIPT -->

    Welcome to Brackets, a modern open-source code editor that understands web design.
    It''s a lightweight, yet powerful, code editor that brings visual tools into the
    editor so you get the right amount of help when you want it.

    </p>

    <p>

    <!-- WHAT IS BRACKETS? -->

    <p>

    Brackets is a different type of editor.

    Brackets has some unique features like Quick Edit, Live Preview and others that
    you might not find in other editors. Brackets is written in JavaScript, HTML and
    CSS. That means you have the skills necessary to modify and extend the editor.
    To learn more about how to use the key features, read on.

    </p>

    <p>

    <!-- GET STARTED WITH YOUR OWN FILES -->

    </body>

    </html>

    ```


    The code starts with the line:


    ```

    <!DOCTYPE html>

    ```


    This is a standard command that tells the browser this is an HTML document, and
    to process it accordingly. We put that at the beginning of every HTML document
    we create.

    Then we have the <html> tag. This indicates the start of our HTML code. If you
    scroll down to the bottom of the document you will see a matching </html> tag.
    The / here means ‘end of’, so </html> means that the html section of our code
    has ended.'
  - '[PAGE 39]


    Next comes <head>. This is the ‘header’ of our HTML document, and contains information
    about the document such as its title, a description and the character set (a name
    for the collection of letters, numbers and symbols that we are using, in this
    case UTF-8). It also contains a link to a style sheet, which we''ll be looking
    at in the next chapter.


    Quick question: Where does the <head> section end?

    Answer: Where it says </head>


    After the header section, we have the <body> tag, which indicates the beginning
    of the main section of our HTML. This is where we will put all the content for
    our webpage. Inside this section are a number of different tags, which we will
    be looking at in more detail shortly. Key tags are:


    +   - <h1> – this is a major heading. You can see in the browser window that this
    text is big and bold. There are number of different heading sizes, which you can
    use by changing h1 to h2, h3 etc.


    Quick question: Experiment with changing the <h1> tag to other heading sizes.
    How many different heading sizes are there?

    Answer: 6 (h7, h8 etc just display as normal text)


    +   - <p> – this is a paragraph tag, and is used to contain normal text. Successive
    paragraphs are separated by a small gap on the webpage.


    And that''s it. Other than learning new tags, is everything you need to know about
    how an HTML page works. We start by defining the document as an HTML file with
    <!DOCTYPE html> then we enclose our HTML in <html>> and </html>. Within those
    tags we have two sections: <head>, which contains information about the webpage
    as its title and description, and <body>, which contains the content of the page.


    Now that we know how an HTML page works, we''re going to build our own from scratch.


    # Challenge 1: Your first webpage


    The best way to learn to code is by doing, so you are now going to create your
    own webpage from scratch. Have a final glance over the code in Brackets to remember
    the key details and then press Ctrl-A (cmd-A on a Mac) to select it all, and then
    press delete to clear the file.'
