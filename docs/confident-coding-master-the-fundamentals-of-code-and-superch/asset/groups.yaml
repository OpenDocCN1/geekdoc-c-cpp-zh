    \  <option>2</option>\n  <option>3</option>\n</select>\n```\n\nTry this out in\
    \ your text editor – you should see something like this (3.15):\n\n![](img/57532e13229b6da209b2a527acf10e32_50_0.png)\n\
    \nThis code is a little more complicated than the input elements, but still fairly\
    \ straightforward. The <select> tag introduces the drop-down menu, and then we\
    \ add an <option> tag for each of the options within the drop-down.\n\nQuestion:\
    \ What does the </option> tag do?\nAnswer: It signals the end of that option,\
    \ ready for us to add another one, or use <select> to end the drop-down menu.\n\
    \n## Text areas\n\nWhat if you want to allow a user to enter some text, but need\
