- md: "\n## Challenge 2\n\nThis is a hard one. Loop through the array [7, 3, 4, 3,\
    \ 8, 2, 1, 2, 7, 8], printing each unique number only once. This is harder than\
    \ it seems, and will require you to create an array of the numbers you have already\
    \ printed. Feel free to glance at the solution below if you need some inspiration.\
    \ Good luck!\n\n**Solution:**\n\nThis is definitely the most complex code we're\
    \ written so far. For each of the numbers in the List, the code loops through\
    \ an 'alreadyPrintedNumbers' List to see if that number has already been printed.\
    \ If it hasn't, the code prints the number and adds it to the 'alreadyPrintedNumbers'\
    \ List.\n\n```\nnumbers = [7, 3, 4, 3, 8, 2, 1, 2, 7, 8]\nalreadyPrintedNumbers\
    \ = []\nfor number in numbers:\n    alreadyPrinted = False\n    for alreadyPrintedNumber\
    \ in alreadyPrintedNumbers:\n        if number == alreadyPrintedNumber:\n    \
    \        alreadyPrinted = True\n    if alreadyPrinted == False:\n        print(number)\n\
    \        alreadyPrintedNumbers.append(number)\n```\n\nWell done if you solved\
    \ this one. It wasn't easy.\n\n![](img/57532e13229b6da209b2a527acf10e32_140_0.png)\n\
    \n## Regular expressions\n\nRegular expressions are a little tricky to get grips\
    \ with, but they are an extremely powerful way of processing text. At the end\
    \ of this chapter we will be using them to get some data from a webpage and then\
    \ process it to collect all the email addresses.\n\nRegular expressions allow\
    \ you to search through a string and extract a particular piece of information,\
    \ or substring.\n\nRegular expressions are our first example of code that requires\
    \ a Python module – that is, an extra set of functions that extend Python’s standard\
    \ functionality.\n\nTo import the regular expressions Python module you use the\
    \ code:\n\n```\nimport re\n```\n\nSimple!\nNow let's see it in action. Suppose\
    \ you wanted to extract the name Rob from the string 'My Name is Rob.'. With regular\
    \ expressions, you could do it like this:\n\n```\nimport re\nstring = 'My Name\
    \ is Rob.'\nresult = re.search('is (.*)', string)\nprint(result.group(1))\n```\n\
    \nWe start by importing the re module\n\n+ 6.24\n\n```\nimport re\nstring = 'My\
    \ Name is Rob.'\nresult = re.search('is (.*)', string)\nprint(result.group(1))\n\
    ```\n\n![](img/57532e13229b6da209b2a527acf10e32_141_0.png)\n\n## Challenge 3\n\
    \nUse regular expressions to extract the word ‘quick’ from the string ‘The quick\
    \ brown fox’.\n\nSolution:\n\nThe following code will do the trick:\n\n```\nimport\
    \ re\nstring = 'The quick brown fox'\nresult = re.search('The (.*) brown', string)\n\
    print(result.group(1))\n```\n\nNote that you could use several different strings\
    \ in the regular expression. For example, 'b' and 'brown fox' would both work\
    \ after the (.*). Try them out! (6.25.)\n\n![](img/57532e13229b6da209b2a527acf10e32_142_0.png)\n\
    \n## Splitting strings into lists\n\nWe’re getting close to being able to complete\
    \ the web scraping challenge for this section. What if we had multiple bits of\
    \ text that we wanted to extract from a string? For example, say we had the string\
    \ ‘Rob,Kirsten,Tommy,Raphie’ and wanted to extract each of the names.\n\nIt is\
    \ possible to do this with regular expressions, but we’ll use a different method\
    \ – splitting the string into a List.\nWe do this with the command string.split(\"\
    ,\"), with the “,\" being the character we want to split the string up with.\n\
    So to split our string we do this:\n\n```\nstring = \"Rob,Kirsten,Tommy,Raphie\"\
    \nprint(string.split(\",\"))\n```\n\nNote: we don't need 'import re' for this\
    \ as we are not using regular expressions.\n\nThe result is a List containing\
    \ the four names (6.26):\n\n```\nstring = \"John,Paul,George,Ringo\"\nprint(string.split(\"\
    ,\"))\n```\n\n![](img/57532e13229b6da209b2a527acf10e32_143_0.png)\n\n## Challenge\
    \ 4\n\nTake the HTML '<li>John</li> <li>Paul</li> <li>George</li> <li>Ringo/</li>',\
    \ and split it up into the individual list items.\n\nSolution:\n\nHere we can\
    \ use the space between each list item to split the string, so this code will\
    \ do the trick:\n\nSee it in action (6.27):\n\n![](img/57532e13229b6da209b2a527acf10e32_143_1.png)\n\
    \nNote: we can also use just string.split() to split a string by the space character.\n\
    \n## Challenge 5\n\nUse regular expressions to extract and de-duplicate the names\
    \ from the HTML below.\n\n```python\nimport re\nstring = \"<li>John</li> <li>Paul</li>\
    \ <li>George</li> <li>Ringo</li> <li>John</li> <li>Paul</li>\"\nnames = re.findall(r'<li>(.*?)</li>',\
    \ string)\nunique_names = []\nfor name in names:\n    if name not in unique_names:\n\
    \        unique_names.append(name)\n        print(name)\n```\n\n![](img/57532e13229b6da209b2a527acf10e32_144_0.png)\n"
  mdcn: "\n\n## 挑战 2\n\n这是一个困难的题目。遍历数组 [7, 3, 4, 3, 8, 2, 1, 2, 7, 8]，并且每个唯一数字只打印一次。这比看起来要难，它需要你创建一个数组来存储已经打印过的数字。如果你需要一些灵感，可以随时查看下方的解决方案。祝你好运！\n\
    \n**解决方案：**\n\n这绝对是我们目前为止编写的最复杂的代码了。对于列表中的每个数字，代码都会遍历 'alreadyPrintedNumbers'\
    \ 列表以检查该数字是否已经打印过。如果还没有打印，代码将打印该数字并添加到 'alreadyPrintedNumbers' 列表中。\n\n```\nnumbers\
    \ = [7, 3, 4, 3, 8, 2, 1, 2, 7, 8]\nalreadyPrintedNumbers = []\nfor number in\
    \ numbers:\n    alreadyPrinted = False\n    for alreadyPrintedNumber in alreadyPrintedNumbers:\n\
    \        if number == alreadyPrintedNumber:\n            alreadyPrinted = True\n\
    \    if alreadyPrinted == False:\n        print(number)\n        alreadyPrintedNumbers.append(number)\n\
    ```\n\n如果你解决了这道题，做得真棒。这并不简单。\n\n![](img/57532e13229b6da209b2a527acf10e32_140_0.png)\n\
    \n## 正则表达式\n\n正则表达式稍微有点难以掌握，但它是处理文本的一种极其强大的方法在本章结束时，我们将使用它们从网页中获取一些数据，然后对其进行处理以收集所有的电子邮件地址。\n\
    \n正则表达式允许你搜索字符串并提取特定的信息或子字符串。\n\n正则表达式是我们第一个需要 Python 模块的代码示例——也就是说，是一组扩展了 Python\
    \ 标准功能的额外函数。\n\n要导入正则表达式 Python 模块，你只需要使用以下代码：\n\n```\nimport re\n```\n\n非常简单！\n\
    现在让我们来看看它的实际运行效果。假设你想从字符串 'My Name is Rob.' 中提取名字 Rob。使用正则表达式，你可以这样做：\n\n```\n\
    import re\nstring = 'My Name is Rob.'\nresult = re.search('is (.*)', string)\n\
    print(result.group(1))\n```\n\n我们首先从导入 re 模块开始\n\n+ 6.24\n\n```\nimport re\nstring\
    \ = 'My Name is Rob.'\nresult = re.search('is (.*)', string)\nprint(result.group(1))\n\
    ```\n\n![](img/57532e13229b6da209b2a527acf10e32_141_0.png)\n\n## 挑战 3\n\n使用正则表达式从字符串\
    \ ‘The quick brown fox’ 中提取单词 ‘quick’。\n\n解决方案：\n\n以下代码可以完成任务：\n\n```\nimport\
    \ re\nstring = 'The quick brown fox'\nresult = re.search('The (.*) brown', string)\n\
    print(result.group(1))\n```\n\n注意，你可以在正则表达式中使用几个不同的字符串。例如，在 (.*) 之后使用 'b' 或 'brown\
    \ fox' 都可以。试试吧！（6.25.）\n\n![](img/57532e13229b6da209b2a527acf10e32_142_0.png)\n\
    \n## 将字符串拆分为列表\n\n我们即将就能完成本节的网页爬虫挑战了。如果我们想从一个字符串中提取多个文本片段会怎样？例如，假设我们字符串 ‘Rob,Kirsten,Tommy,Raphie’，并想要提取每个名字。\n\
    \n使用正则表达式是可以的，但我们将使用另一种方法——将字符串拆分为列表（List）。\n我们使用 `string.split(\",\")` 命令来实现，其中\
    \ \",\" 是我们想要用来拆分字符串的字符。\n所以为了拆分我们的字符串，我们这样做：\n\n```\nstring = \"Rob,Kirsten,Tommy,Raphie\"\
    \nprint(string.split(\",\"))\n```\n\n注意：我们不需要使用 'import re'，因为我们没有使用正则表达式。\n\n\
    结果是一个包含四个名字的列表 (6.26)：\n\n```\nstring = \"John,Paul,George,Ringo\"\nprint(string.split(\"\
    ,\"))\n```\n\n![](img/57532e13229b6da209b2a527acf10e32_143_0.png)\n\n## 挑战 4\n\
    \n获取 HTML '<li>John</li> <li>Paul</li> <li>George</li> <li>Ringo/</li>', 并将其拆分为单独的列表项。\n\
    \n解决方案：\n\n在这里我们可以利用每个列表项之间的空格来拆分字符串，所以这段代码可以完成任务：\n\n查看运行效果 (6.27)：\n\n![](img/57532e13229b6da209b2a527acf10e32_143_1.png)\n\
    \n注意：我们也可以直接使用 `string.split()` 通过空格字符拆分字符串。\n\n## 挑战 5\n\n使用正则表达式从下方的 HTML 中提取并去重名字。\n\
    \n```python\nimport re\nstring = \"<li>John</li> <li>Paul</li> <li>George</li>\
