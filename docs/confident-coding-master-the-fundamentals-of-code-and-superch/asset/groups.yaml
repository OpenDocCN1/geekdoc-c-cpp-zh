- md: "\nSo using position: relative will move the element relative to where it would\
    \ otherwise be. Try adding:\n\n```\nposition: absolute;\n```\n\nto the divA rules.\
    \ What effect does that have? It actually removes the div from the flow of the\
    \ page, so the other elements ignore its existence. This can be useful if you\
    \ want to position an element relative to the page, rather than relative to other\
