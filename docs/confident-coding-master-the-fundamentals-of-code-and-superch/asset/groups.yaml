    \ 5 | Male |\n| Ralphie | 1 | Male |\n```\n\n| Name | Age | Gender |\n|---|---|---|\n\
    | Kirsten | 36 | Female |\n| Tommy | 5 | Male |\n| Ralphie | 1 | Male |\n\nNotice\
    \ that when we do this the headers are centred, but the data is left-aligned.\n\
    \nWe can also add a border around the table by adding border=1 to the table.\n\
    \n![](img/57532e13229b6da209b2a527acf10e32_55_0.png)\n\n## Challenge 3\n\nCreate\
    \ a table with 'First Name' and 'Surname' as table headers and your actual first\
