    \nTo add a border to the red div, just add the following style:\n\n```\nborder:\
    \ 5px solid grey;\n```\n\nThis has this effect (4.16):\n\n![](img/57532e13229b6da209b2a527acf10e32_80_1.png)\n\
    \nNote that this style is a little different to the others we have seen so far,\
    \ that it includes three values:\n\n- 5px: this is the width of the border.\n\
    - solid: this is the border type. You can experiment with different border types,\
