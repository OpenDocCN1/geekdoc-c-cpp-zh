    `#`（井号）符号告诉浏览器，不要应该跳转到另一个页面，而是在当前页面中查找 id 为 ''last'' 的 `id` 标签并跳转到那里。尝试一下。你会发现点击该链接时，它会跳转到页面底部。


    # 练习题


    - 1. 在 CC 9 的练习中练习创建链接。


    # HTML 实体


    有时，你可能想在网页中使用符号，例如版权符号 ©、欧元符号 € 甚至是一个笑脸符号 🙂。这可以通过使用 HTML 实体来实现，HTML 实体是浏览器会将将其识别并显示为所需符号的特殊代码。所以，为了显示笑脸符号，我们使用：


    ```

    &#9786;

    ```


    # 在 Brackets 中尝试 (3.22):


    ![](img/57532e13229b6da209b2a527acf10e32_59_0.png)


    `&amp` 告诉浏览器我们即将输入一个 HTML 实体，而 `#` 表示我们将通过其代码数字来描述该实体。笑脸的代码数字是 9786，然后我们使用分号来完成该
    HTML 实体。


    某些符号可以使用数字显示，也可以使用代码名称显示，所以：


    ```

    &copy; 和 &#169;

    ```


    将都会显示版权符号 ©。

    你可以在 www.w3schools.com/html/html_entities.asp 看到一些最常用 HTML 实体的列表。


    # 挑战 4


    尝试使用 HTML 实体在这里添加货币符号：CC 10


    # iFrames


    这是我们在本章中将学习的最后部分 HTML，所以恭喜你已经走到了这里。很快，我们将学习如何使用 CSS 为我们的网页添加样式。


    iFrames 允许我们把另一个网页的内容包含在自己的网页中。例如，我们可以使用以下代码在我们的网页中包含 Google 首页：


    ```

    <iframe src="http://www.example.com"></</iframe>

    ```


    ![](img/57532e13229b6da209b2a527acf10e32_60_0.png)


    尝试将 www.example.com 改为你访问过的其他网站，例如 bbc.co.uk。注意，某些热门网站（如 google.com 和 facebook.com）不允许其网站在
    iFrames 中显示。


    问题：你能否为 `<iframe>` 元素添加一些属性，让 iFrame 框像你的浏览器窗口一样宽和高？

    答案：只需像处理图片一样添加 `width` 和 `height` 属性即可：


    ```

    <iframe width=550 height=660 src="http://wikipedia.org">

    </iframe>

    ```


    # 语言将给你类似这样的内容 (3.24):


    # 3.24


    ![](img/57532e13229b6da209b2a527acf10e32_61_0.png)


    iframes 一个特别方便的用法是在你的网页中包含 YouTube 视频等媒体内容。要做到这一点：


    - 转到 youtube.com 并点击任何你喜欢的视频。

    -向下滚动并点击“分享”按钮（红色“订阅”按钮下方）。

    - 点击“嵌入”。

    - 将代码复制到剪贴板（Mac 上使用 ctrl-c 或 cmd-c），然后将其粘贴到你的网页中。你最终会得到类似这样的效果 (3.25)：


    # 3.25


    ![](img/57532e13229b6da209b2a527acf10e32_61_1.png)


    这段代码是一个带有宽度高度的高度 iFrame，但也具有 `frameborder="0"` 属性（这会关闭 iFrame 边框）以及 `allowfullscreen`（这是一个
    YouTube 特有的属性，正如你可能猜的那样，它允许用户让视频全屏显示）。


    # 练习题


    - 1 尝试在这里添加一个 iFrame 来包含任何网站：CC 1


    # HTML 项目：大汇总


    恭喜！你已经学习了 HTML 的基础知识。现在是时候通过创建一个包含尽可能多本章元素的单个网页，将你新学的知识付诸实践了。选择一个你感兴趣的话题，然后通过添加标题、头部、列表、iFrame
    以及你涵盖过的所有其他元素来创建你的页面。完成后，访问 codepen.io 并粘贴你的代码。你应该会在屏幕底部看到你的网页，并可以在社交媒体上分享它。


    # 总结


    正如我们所学的，HTML 是每个网页的基础。你现在已经学习了如何创建和编辑所有元素，因此编码之旅的下一步是学习如何为我们的页面建模——添加颜色、更改大小、调整文本格式等等。我们使用
    CSS（或级联样式表）来实现，这就是我们在下一章将看到的。


    # 进一步学习


    在书的这里，我建议继续学习 CSS。然而，如果你想进一步深入研究，请查看这些关于该语言如何工作以及你可以用它做什么的资源：


    - www.codeacademy.com/

    - www.w3schools.com/html/

    - http://learncode.com/

    - https://play.google.com/details?id=

    - sololearn.com

