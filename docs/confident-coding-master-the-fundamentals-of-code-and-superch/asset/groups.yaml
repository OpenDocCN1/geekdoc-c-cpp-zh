    因此使用 `position: relative` 会将元素相对于其原本所在的位置进行移动。尝试添加：


    ```

    position: absolute;

    ```


    到 `divA` 的规则中。这会产生什么效果？它实际上将该 `div` 从页面的流中移除，因此其他元素会忽略它的存在。如果你想相对于页面而不是相对于其他元素来定位一个元素，这就会非常有用。你仍然可以使用
    `top` 和 `left` 来移动绝对定位的对象（4.10）。


    ![](imgimg/57532e13229b6da209b2a527acf10e32_76_0.png)


    # 练习题


    - 1 更新内部 CSS，给 `#home` div 设置一个向右 10 像素、向下 10 像素的绝对位置，给 `#next` div 设置向右 50 像素、向上
    10 像素的相对位置。


    ## 外边距 (Margins)


    外边距为元素定位提供了另一种且在某些方面更简单的方法。要查看它的效果，请从 `divA` 和 `divB` 中移除所有浮动和定位规则，并在 `divA` 下方添加以下规则：


    ```

    margin: 20px;

    ```


    这在红色 div 周围产生了 20 像素的外边距，看起来如下（4.11）：


    ![](img/57532e13229b6da209b2a527acf10e32_77_0.png)


    我们还可以单独设置顶部、底部、左侧和右侧边距——尝试为 `divB` 添加这些规则：


    ```

    margin-top: 50px;

    margin-left: 100px;

    ```


    这有效地将蓝色 div 向下移动了 50 像素并向右移动了 100 像素（4.12）：


    ![](img/57532e13229b6da209b2a527acf10e32_77_1.png)


    # 练习题


    - 1 给 ID 为 box 的 div 设置一个顶部 10 像素、左右各 15 像素、底部 20 像素的外边距，单独设置每个边距（例如 margin-top）。


    外边距是移动对象并在对象原所在位置留出空隙的好方法。类似地，我们可以使用 `padding`（内边距）在元素内部添加边距。


    ## 内边距 (Padding)


    在红色和蓝色 div 中，div 内部文本周围都没有内边距。通常，在文本和 div 边缘之间留出间隙会更好看，我们使用 `padding` 来实现。尝试为
    `divA` 添加以下内容：


    ```

    padding: 10px;

    ```


    这在红色正方形内部添加了 10 像素的内边距（4.13）：


    ![](img/57532e13229b6da209b2a527acf10e32_78_0.png)


    奇怪的是，这使得文本向下移动的幅度大于向右移动的幅度。这是因为`<p>` 元素内置了默认外边距。


    # 挑战 1


    通过添加 CSS 规则 `margin:0` 移除 `<p>` 元素的外边距。答案：你的代码应该像所示（4.14）：


    ![](img/57532e13229b6da209b2a527acf10e32_79_0.png)


    添加代码将所有 `<p>` 元素的外边距设置为 0 解决了这个问题，现在红色正方形四周的都是 10 像素的内边距了。


    尝试在 `divB` 上尝试 `padding-top`、`padding-bottom` 等，看看它们产生什么效果。


    内边距是为元素添加一点空间的好方法，让你的内容有呼吸的空间。


    # 练习题


    - 1. 为 `#box` div 设置样式，使其顶、右、底、左侧都有 15px 的内边距，尽可能使用少的命令：CC 19


    ## 边框 (Borders)


    为元素添加边框是分离网页不同部分的简单方法。边框可以使复杂的页面更具读性，并且是在不使用图像的情况下引入一点视觉风味的好方法。


    让我们移除网页中除红色 div 及其内容以外的所有内容（4.15）：


    ![](img/57532e13229b6da209b2a527acf10e32_80_0.png)


    要给红色 div 添加边框，只需添加以下样式：


    ```

    border: 5px solid grey;

    ```


    这产生了如下效果（4.16）：


    ![](img/57532e13229b6da209b2a527acf10e32_80_1.png)


    注意这种样式与我们目前看到的其他样式略不同，它包含了三个值：


    - 5px：这是边框的宽度。

    - solid：这是边框的类型（实线）。

    - grey：这是边框的颜色（灰色）。


    挑战 2：为红色 div 添加一个 10 像素的粉红色虚线边框。你的代码应该像所示：


    ```

    border: 10px dashed pink;

    ```


    效果如下：


    ![](![](img/57532e13229b6da209b2a527acf10e32_81_0.png)


    ## 圆角 (Rounded corners)


    为元素添加圆角可以使它们看起来更圆润。我们可以使用 `border-radius` 属性来实现。尝试为 `divA` 添加以下内容：


    ```

    border-radius: 50%;

    ```


    这会让红色 div 变成圆形：


    ![](img/57532e13229b6da209b2a527acf10e32_82_0.png)


    圆角在 CSS3 中引入，我们可以使用不同的像素值。尝试为 `divB` 添加如下：


    ```

    border-radius: 10px;

    ```


    这会让蓝色 div 有圆角：


    ![](img/57532e13229b6da209b2a527acf10e32_83_0.png)

