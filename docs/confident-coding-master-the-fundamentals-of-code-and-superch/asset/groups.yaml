  mdcn: "\n对于我们有问题的按钮，请尝试使用 'print' 命令（稍后会详细介绍）来显示变量的值，以确保它正如你认为的那样。你甚至可以像如下代码：\n\n\
    ```\nprint(\"hello\")\n```\n\n来确保某段代码确实在执行。代码删除过程在这里也很有用 —— 尝试删除除 `print` 语句之外的所有按钮执行代码。如果打印内容没有出现，那么说明按钮和代码之间的连接存在问题。如果打印了，就逐渐添加代码，直到它的行为不再符合你的预期。这时你就知道错误在哪里了。\n\
    \n在 95% 的情况下，你的错误现在应该解决了 —— 定义问题、向自己解释代码是如何运行的、以及调整值/使用 `print` 语句的过程，是你每次都应该经历的标准流程。\n\
    \n顺便提一下，这正是你经常应用于现实困难的程序。定义问题通常是提高流程效率最困难的部分，或者是弄清楚为什么你在感情上不顺顺。然后，向自己解释你正在做什么以及为什么要这样做，可能足够让你看出错在哪里了。如果不是，尝试改变一些小地方并看看情况是否会好转。\n\
    \n但如果你仍然有 Bug 呢？有时我们无法修复某个问题，需要寻求外力帮助。幸运的是，因为我们清楚地定义了问题，并且对代码应该做什么有深刻理解，我们应该能够有效地搜索并帮助。\n\
    \n## 步骤 2：搜索帮助\n\n如果你已经读到了这本书的这里，你几乎自己做过一些调试，并且在 Google 上搜索答案的过程中，你可能遇到过 stackoverflow.com。Stack\
    \ Overflow 的理念非常简单 —— 人发布问题，其他人回答 —— 但它被证明极其受欢迎，结合强大的搜索引擎，大量范围内常见编程问题的答案都触手可及。\n\
    \n但要搜索什么呢？正如我提到的，如果你有特定的错误信息，直接在 Google 上搜索该信息是一个很好的第一步。如果没有，你将需要更仔细地思考要搜索什么。\n\
    \n作为一个起点，我总是会在搜索中包含编程语言和/或平台的名称。搜索“我该如何更改文本颜色”可能适用于大量不同的软件，因此在末尾添加 'HTML'、'CSS'、'JavaScript'\
    \ 或 'Swift' 以更快地找到答案。\n\n在 Android 开发中，在搜索词中同时添加 'Java' 和 'Android' 通常是值得的，因为\
    \ Java 被用于许多不同的设备，而不仅仅用于 Android 应用。\n\n如果你正在使用特定的开发环境，如 Xcode 或 Android Studio，将此也添加到搜索中可能会很有用。至少，在\
    \ 'Swift' 搜索中包含 'Xcode' 会让你的结果不太可能包含关于泰勒·斯威夫（Taylor Swift）的文章！\n\n除此之外，对于任何网络搜索，尝试保持简洁且无歧义（这在问完那三个问题后应该自然而然）。\n\
    \n以下是一些糟糕的查询。尝试思考更好的替代方案：\n\n- 我该如何让文字变大？\n- Swift App 启动时白屏\n-安卓 应用中没有声音\n- 网站图片无法显示\n\
    \n一些更好的替代方案可能是：\n\n- CSS 如何更改字体大小\n- Xcode Swift [在此处输入错误信息]\n- Java Android 如何播放声音\n\
    - HTML 如何显示图片\n\n注意最后两个项，我不是在搜索错误，而是在寻找实现我想尝试做的事情的操作或代码。我可能会将找到的代码复制并粘贴到我的应用或网站中，看看是否有效。如果有效，我可以将其与我的代码进行比较，看看哪里错了。如果无效，我可以相当确定代码本身不是问题，问题出在其他地方。\n\
    \n关于从网上找到的代码并复制粘贴的一个简要警告 —— 这是一项风险操作。至少你应该确保你理解代码是如何工作的，但也要记住它可能是为了你编程环境的老版本编写的（Swift\
    \ 特别是更新频繁），甚至可能是为你正在使用的不同设置编写的。简而言之，只复制和粘贴你能够理解并在必要时可以自己调试的代码块。\n\n## 在实践中\n\n\
    好了，我们已经问了自己问题，在网上搜索了，但一无所获。是时候程序员最后的手段了：寻求帮助。\n\n## 步骤 3：寻求帮助\n\n程序员是一群乐于助人的人，比大多数人更愿意提供帮助以换一些网络积分或仅仅是公开感谢。然而，他们不喜欢被问模糊的问题或已经在其他地方回答过的问题。\n\
    \n如果你在某个可以提问的编程课程中，那显然是一个很好的起点。当你那里那里提问时，确保提供某人解决你的问题可能需要的所有信息。然而，避免粘贴所有的代码、给出错误信息并询问哪里错了。这种调试方法非常耗时！\n\
    \n相反，回答上面的三个问题，告诉你的潜在帮助者你正在尝试做什么、得到了什么结果、你已经做了哪些调试，以及你隔离出的导致问题的几行代码。\n\n（注：提供的\
    \ OCR 文本包含大量重复。我根据文档的逻辑流处理了唯一内容并修正了重复。）\n\n对于网页开发者来说，最有用的工具是开发者工具，大多数浏览器都包含了它。我们将查看\
    \ Chrome 开发者工具，我个人认为它是最全面的。要在 Chrome 中访问它们，点击“查看 -> 开发者工具”。\n\n## 调试 HTML 和 CSS\n\
    \n对于网页开发者来说，最有用的工具是开发者工具，大多数浏览器都包含了它。我们将查看 Chrome 开发者工具，我个人认为它是最全面的。\n\n## 调试\n\
    \n10.1\n\n![](img/57532e132296da209b2a527acf10e32_png)\n\n屏幕底部会出现一个窗口 —— 点击 Elements\
    \ 标签，你将看到你所在页面的 HTML 以及右侧 CSS 的摘要。\n\nHTML 的不同部分通常隐藏在 '...' 之后 —— 只点击 ... 即可查看。你还可以点击窗口左上角的按钮选择页面上的任何元素，并查看相关的\
    \ HTML 和 CSS。尝试编辑一下 —— 它很酷。\n\n你甚至可以通过双击它来编辑页面的 HTML，这对于调试单个元素非常有用。注意，这只编辑存储在你计算机上的版本，而不是\
    \ CNN 服务器上的实时版本。\n\n一个特别的 CSS 技巧是启用和禁用单个元素（10.2）：\n\n```css\n@media screen and\
    \ (min-width: 600px) {\n main.css:1 {\n  padding: 0;\n}\n```\n\n只需悬停在样式上并点击蓝色勾选框即可禁用。你也可以更改样式的值，就像更改\
    \ HTML 一样。\n\n当你玩完 Elements 标签后，点击 Console。我们将在 JavaScript 调试部分使用它，但在这里它对于查看页面中的任何错误很有用。你在这里看到其他主要的\
    \ HTML 错误，但如果你想更详细地检查你的 HTML，可以使用 HTML 验证器，例如\n\n"
