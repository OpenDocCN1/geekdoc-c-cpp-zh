    \ {\n  // Loop through all numbers less than numberToCheck\n\n  for (var divisor\
    \ = 2; divisor < numberToCheck;\n      divisor++ ) {\n    if ( numberToCheck %\
    \ divisor == 0 ) {\n      // If divisor divides numberToCheck exactly,\n     \
    \ numberToCheck is not prime, so return false\n      return false;\n    }\n  }\n\
    \  // If we get here, we have checked all numbers from 2 up to\n  numberToCheck,\
    \ and none of them divide it, so numberToCheck\n  must be prime\n  return true;\n\
    }\n```\n\nBoth functions work perfectly well (the logic is identical for both),\
    \ but the second function has numerous advantages over the first:\n\n+   - It\
    \ is well spaced out. Most programming languages don't require line breaks, but\
    \ including them makes the code much easier to read.\n- It has meaningful variable\
    \ names. Try to avoid using variable names such as 'x' or 'number', and instead\
    \ give your variables easy to recognize names.\n- It has comments. All programming\
    \ languages have a way to add readable comments, and you should use them whenever\
    \ possible to explain what your code is doing.\n\nYou might feel that in an example\
    \ like this it doesn't make too much difference you use comments, spacing and\
    \ meaningful variable names, but when your code starts to expand to hundreds of\
    \ lines (which it will if you are building cool things!), you'll appreciate getting\
    \ into this habit with all code you write."
