    # # Images


    Adding images to webpages is very simple, and it introduces us to a new HTML concept
    – attributes. These are bits of information added to tell the browser more information
    on how to display it. For example, to display an image, we would use something
    like this:


    ```

    <img src="image.jpg">

    ```


    The <img> tag is short for image, and the ''src'' part inside is short for source.
    Essentially we are telling the browser where to get the image file from to'
