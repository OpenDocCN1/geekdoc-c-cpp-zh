    # In practice


    Note the result is currently blank – we’ll add the value with code when the user
    taps the button.

    The next step is to create Outlets for the label and the label and the text field,
    and an Action for the button. Do this in the usual way, but ctrl-dragging, until
    your code looks like this:


    ```

    @IBAction func buttonClicked(_sender: AnyObject) {

    }


    IBOutlet var textField: UITextField!


    IBOutlet var label: UILabel

    ```


    Finally, we will add the code to the buttonClicked() method to do the calculation
    and display the result to the user. First, we get the contents of the text field
    (notice that I’m using let rather than var as this value will not change):


    ```

    let valueUserEntered = textField.text!

    ```


    Then we convert that to a Float so we can do multiplication with it (don’t forget
    to add the ! as the result will be an optional):


    ```

    let amountInPounds = Float(valueUserEntered)

    ```


    Next we do the multiplication:


    ```

    let amountInPounds = amountInPounds * 1.31

    ```


    Then we convert that to a Float so we can do multiplication with it:


    ```

    let amountInDollars = amountInPounds * 1.31

    ```


    Finally, we update the label to give the result we need (note we need to convert
    amountInDollars back to a string here):


    ```

    label.text = "Result = $\$ + String(amountInDollars)

    ```


    Putting it all together, your app should look like this (8.10):'
