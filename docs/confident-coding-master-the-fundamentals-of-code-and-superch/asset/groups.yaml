- md: "\n## Writing the code for the button\n\nJust underneath the ‘public class MainActivity...’\
    \ line, write the following code:\n\n```java\npublic void buttonClicked(View view)\
    \ {\n}\n```\n\nThis creates a method ('public') which doesn’t return anything\
    \ ('void') called buttonClicked. This method will be run when our button is clicked.\
    \ The curly braces { and } contain the code for our method.\n\nThe ‘View view’\
    \ is a little more complicated, so read carefully. Firstly, a ‘view’ is anything\
    \ that appears on the screen (so buttons, TextViews etc are all ‘views’).\n\n\
    Secondly, to create a variable in Java, we start with the variable type, and then\
    \ use the name that we want the variable to be called. So if we want to create\
    \ a string called ‘name’ we would type:\n\n```java\nString name;\n```\n\nIf we\
    \ wanted to create an integer called ‘number’ we would type:\n\n```java\nint number;\n\
    ```\n\nHere we are creating a variable ‘view’ which is of a type ‘View’. We need\
    \ this because when the button is clicked, it runs the buttonClicked method, and\
    \ it sends some information about itself to that method. That information is stored\
    \ in this variable ‘view’, which is of a type of View.\n\nYou might want to read\
    \ that last paragraph a couple of times. Hopefully that makes sense, but if not\
    \ don’t worry, it will become clearer as we carry on.\n\nWhen you have finished\
    \ writing code, you will see a blue callout pointing to the word View (9.3):\n\
    \n```java\npublic void buttonClicked(View view) {\n}\n```\n\nThis is because to\
    \ use the variable type ‘View’ we need to add the ‘View’ class to our app. To\
    \ do that, press alt-enter which the blue callout is shown. The callout will then\
    \ disappear and ‘View’ will turn black (9.4):\n\nIf you click the small '+' next\
    \ to 'import ...' near the top of the code window, you will see that we now have\
    \ the View class added to our project:\n\n```java\nimport android.support.v7.app.AppCompatActivity;\n\
    import android.os.Bundle;\nimport android.view.View;\n```\n\n## Making a toast\n\
    \nOK. We have now created the method that will run when the button is clicked.\
    \ Don’t worry – we’re nearly done. We just need to write some code inside that\
    \ method. We’re going to create what is known as a 'toast' – a small piece of\
    \ text that will display at the bottom of the phone screen for a small period\
    \ of time. (It is called a 'toast' because it pops up like toast from a toaster).\
    \ To do that, adding the following code to the buttonClicked method:\n\n```java\n\
    Toast.makeText(\"Hi there!\", Toast.LENGTH_SHORT).show();\n```\n\nHint: when you\
    \ start typing 'Toast', you will see a drop-down like this (9.5):\n\n![](img/57532e13229b6da209b2a527acf10e32_196_0.png)\n\
    \nPress Enter when 'Create a new Toast' is selected, and it will auto-fill most\
    \ of the code for you. Nice!\n\nThis code creates a new toast with the text 'Hi\
    \ there!'. LENGTH_SHORT refers to the amount of time the toast stays on the screen\
    \ (you can change it to LENGTH_LONG if you want the toast to stay longer).\n\n\
    Note: What is 'this'? The 'this' in the toast command refers to the activity that\
    \ we are currently in, in MainActivity. This is the context that the toast will\
    \ appear in.\n\nWe’re finally done. Your finished code should look like this:\n\
    \n```java\npackage com.example.robpercival.myfirstapp;\n\nimport android.support.v7.app.AppCompatActivity;\n\
    import android.os.Bundle;\nimport android.view.View;\nimport android.widget.Toast;\n\
    \npublic class MainActivity extends AppCompatActivity {\n\n    public void buttonClicked(View\
    \ view) {\n        Toast.makeText(this, \"Hi there!\", Toast.LENGTH_SHORT).show();\n\
    \    }\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
    \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
    \    }\n}\n```\n\nNow run the app, and click the button. If you've done everything\
    \ correctly, you will see the 'Hi there!' message appear at the bottom of the\
    \ screen like this (9.6):\n\n![](img/57532e13229b6da209b2a527acf10e32_197_0.png)\n\
    \nCongratulations! That wasn't easy but what we have done is quite advanced –\
    \ we have created a method called 'buttonClicked' and linked that method to the\
    \ button that we added to the user interface. Then we added code to that method\
    \ to display the 'Hi there!' text as a toast on the user's screen. Not bad!\n\n\
