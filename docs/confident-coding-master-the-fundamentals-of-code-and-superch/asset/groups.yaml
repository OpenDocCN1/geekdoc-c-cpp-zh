    _blank\"` 属性会发生什么？\n答案：你的代码应该如下：\n\n```html\n<a href=\"http://www.google.com\"\
    \ target=\"_blank\">Search Web\n\n点击链接时，你会发现它会在新标签页或新窗口中打开。\n\n锚链接（即网页内部链接）的工作方式略有不同。首先，向你的页面添加几段文本，使页面比浏览器窗口高，你需要滚动到最后。我使用\
