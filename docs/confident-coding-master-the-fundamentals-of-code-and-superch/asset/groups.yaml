- md: "\nhttps://validator.w3.org/ This will tell you if your page has, for example,\
    \ unclosed HTML tags, or options for elements that are no longer supported.\n\n\
    This can be very useful, but don't necessarily expect your code to have no errors\
    \ whatsoever. At the time of writing, www.bbc.co.uk/ had over 100 errors!\n\n\
    When it comes to CSS, http://csslint.net/ is an extremely powerful tool. It will\
    \ not only show you CSS errors, but also conflicts, where two different styles\
    \ are conflicting with each other, and also advise you on how your CSS could be\
    \ better.\n\n# Debugging JavaScript\n\nAs with HTML and CSS, your main tool with\
    \ debugging Javascript are the browser Developer Tools, specifically the Console.\
    \ Not only will that show you any JavaScript errors, but you can also use it to\
    \ find out values of variables, or whether certain chunks of code are being running.\n\
    \nTry running this JavaScript on a webpage and looking at the results in the console:\n\
    \n```javascript\nfor (i = 0; i < 10; i++) {\n    console.log(i)\n}\n```\n\nYou\
    \ should see something like this (10.3):\n\n![](img/57532e13229b6da209b2a527acf10e32_217_0.png)\n\
    \nThe console.log command allows us to print something in the console, which is\
    \ an extremely powerful debugging tool.\n\nBeyond the console, www.jslint.com/\
    \ is similar to CSS Lint, and will show you a range of errors and warning messages.\n\
    \n# Debugging Swift in Xcode\n\nXcode, like most integrated development environments\
    \ (IDEs), has a range of debugging features. The first is inline error messages.\
    \ It is pretty clear\n\n# Debugging\n\nwhen there is a syntax error, although\
    \ the error messages themselves can be a challenge to decipher.\n\nIf you run\
    \ some code that causes your app to crash, you'll often see a very unfriendly\
    \ (and not particularly helpful) ‘terminating with uncaught exception-of type\
    \ NSException’ message (10.4):\n\n![](img/57532e13229b6da209b2a527acf10e32_218_0.png)\n\
    \nHowever, scroll up in the console and you'll usually find something useful;\
    \ in this case I am attempting to print an array value that doesn't exist (10.5):\n\
    \n```swift\noverride func viewDidLoad() {\n    // Do additional setup after loading\
    \ the view, typically from a nib.\n    let array = [1, 2, 3]\n}\noverride func\
    \ viewDidMemoryWarning() {\n    // Clear of any resources that can be recreated.\n\
    }\nfatal error: index out of range\n```\n\nXcode's equivalent of console.log in\
    \ JavaScript is the 'print' function, which works like this:\n\n```javascript\n\
    console.log(\"Hello World\")\n```\n\nWith console.log, it allows you to verify\
    \ that a specific chunk of code is being run. If the console is not visible, you\
    \ can make it appear by clicking at the top right of the Xcode window.\n\n# Debugging\
    \ Java in Android studio\n\nAndroid Studio’s debugging tools are similar to Xcode’s.\
    \ There is automated error checking, to show you syntax errors and warnings (10.6):\n\
    \n```java\nint age = Integer.parseInt(age);\n```\n\nYou need to look quite carefully\
    \ as the red wiggly underscore is often not immediately obvious. There is also\
    \ a red line on the right hand side of the editing window, and if you hover over\
    \ either the underscore or the line, you’ll be given the error message (10.7):\n\
    \n```\n* expected> —\n```\n\nIf you run some code which has errors in it, you’ll\
    \ see errors appear in the logs as with Xcode. There is also the facility to write\
    \ messages in the logs, similar to console.log and print. To do that, use the\
    \ Log command, like this:\n\n```java\nLog.i(\"Message\", \"The log command was\
    \ run\");\n```\n\nEach log command has a title (in this case ‘Message’) and content\
    \ (‘The log command was run’). The ‘i’ in Log.i is short for information, and\
    \ the command allows you to use different letters for different log types, the\
    \ most common of which are:\n\n- D – Debug.\n- I – Info.\n- W – Warning.\n- E\
    \ – Error.\n\n# Summary\n\nWe have now gone through all the major debugging techniques,\
    \ and seen a range of tools to debug code on a variety of platforms. We’ve also\
    \ seen how to write good code, to minimize the amount of time we spend debugging.\n\
    \nDebugging is a necessary process for any programmer, but done right it can be\
    \ a learning experience in itself. The most important thing is to approach debugging\
