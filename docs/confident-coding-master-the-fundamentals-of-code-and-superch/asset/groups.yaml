    # Accessing the entered text


    Now that remains is to get the value of the text that the user has entered in
    our code. Our aim here is to change the content of the Toast so that instead of
    saying ''Hi there!'' it says ''Hi Rob'' (if the user has entered Rob as their
    name, of course).


    So, click on the MainActivity.java tab, and enter the following code just above
    the Toast command:


    ```

    EditText nameEditText = (EditText) findViewByIdId(R.id.nameEditText);

    ```


    There''s a lot going on here. First, we''re creating a variable of a type EditText
    called nameEditText. We will use this to refer to our text view.


    Ignoring the (EditText) for a moment, the findViewById method finds a view by
    its ID, and we give it the ID of our text view, which is stored in Resources (''R'').


    What about strange screen (EditText)? Remember that everything that appears on
    the screen is a ''view''. This applies to text views (EditText) as well. The findViewById
    method returns a generic ''view'', but we know that it is really an EditText,
    so we use (EditText) to ''cast'', or convert, the view into an EditText. Makes
    sense? You might want to read that paragraph again to be sure.


    Now we have a variable we can use to refer to our text view. The next step is
    to get the value of the text view, which we''ll store in a string called ''name'':


    ```

    String name = nameEditText.getText().toString();

    ```


    The ''String name'' part creates a string variable called ''name'', and then we
    use getText() to get the text the user entered into the text field, and finally
    we use toString() to convert it to a string. So far so good!


    Finally, we need to change the code for the Toast to say hi to our user:


    ```

    Toast.makeText(this, "Hi " + name, Toast.LENGTH_SHORT).show();

    ```


    Here we have changed "Hi there" to "Hi" + name. The ''+'' combines the two strings,
    so if the user enters ''Helen'' as their name, "Hi " + name. will be equal to
    ''Hi Helen''.


    That''s it. Your code should now look like this:'
- md: "\n# Building an app for Android\n\n```java\npackage com.example.robpercival.myfirstapp;\n\
    \nimport android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\n\
    import android.view.View;\nimport android.widget.EditText;\nimport android.widget.Toast;\n\
    \npublic class MainActivity extends AppCompatActivity {\n\n    public void buttonClicked(View\
    \ view) {\n\n        EditText nameEditText = (EditText) findViewById(R.id.nameEditText);\n\
    \n        String name = nameEditText.getText().toString();\n        Toast.make(this,\
    \ \"Hi \" + name, Toast.LENGTH_SHORT).show();\n    }\n\n    @Override\n    protected\
    \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
    \        setContentView(R.layout.activity_main);\n    }\n}\n```\n\nRun the app,\
    \ enter your name and click the button. If everything has gone well you should\
    \ see something like this (9.9):\n\n9.9\n\n![](img/57532e13229b6da209b2a527acf10e32_203_0.png)\n\
    \nWell done! You now have an app which can collect some data from the user, process\
    \ it and display it back to the user as a toast. This is the fundamental basis\
    \ for all user-interaction within apps. Give yourself a pat on the back!\n\n#\
    \ Building an app for Android project: cat years app\n\nNow it's time for you\
    \ to put everything you have learnt into action. They say that a cat year is equivalent\
    \ to around seven human years, and we are going to use this fact to build a simple\
    \ app to allow a user to enter their cat's age, and we will show them the equivalent\
    \ human age in a Toast. Simple, right?\n\nAs with the Currency Converter app in\
    \ the iOS chapter, you will need to convert the user's entered data from a string\
    \ into an integer, and then multiply it by seven, and then convert it back to\
    \ a string to display the new value to the user. I'm going to leave that to you\
    \ to figure out (using Google is very much allowed, and positively encouraged).\n\
    \nThat's it - start from scratch and create a new project. Good luck!\n\n# Solution\n\
    \nThe setup process for the app is very similar to the previous app – choose all\
    \ the same options except the app title, which can be anything you like. I called\
    \ mine Cat Years.\n\nOnce the app is ready, start by creating the user interface.\
    \ I have used a very similar layout to our previous app.\nI changed the text of\
    \ the ‘TextView’ to ‘Cat Years’, and changed the ‘hint’ of the EditText to ‘How\
    \ old is your cat?’. I also changed the type of the EditText to ‘number’ – bonus\
    \ points if you did. I changed the EditText’s ID to catAgeEditText.\n\nNext, I\
    \ changed the button text to ‘Show Age In Cat Years’ and I used an onClick method\
    \ name of showCatAge, which is a little more descriptive than ‘buttonClicked’\
    \ as we used before.\nNow over to the code itself. In MainActivity.java, I started\
    \ by creating the method ‘showCatAge’ which will be run when the button is clicked:\n\
    \n```java\npublic void showCatAge(View view) {\n}\n```\n\nNext, I added a line\
    \ to create a variable called ageEditText to refer to our text field:\n\n```java\n\
    EditText ageEditText = (EditText) findViewById(R.id.ageEditText);\n```\n\nNext\
    \ I get the value of the field, convert it to an integer, multiply it by 7 and\
    \ then convert it back to a string. You likely needed to do some googling to figure\
    \ out how to do this part – if you managed it, congratulations!\n\n```java\nString\
    \ age = ageEditText.getText().toString();\nint ageInt = Integer.parseInt(age);\n\
    int catAgeInt = ageInt * 7;\nString catAgeString = Integer.toString(catAgeInt);\n\
    ```\n\nHopefully it’s clear what is going on. The first line gets the value entered\
    \ into ageEditText, the next line converts it to an integer using the method Integer.parseInt.\
    \ The next line creates a new integer, catAgeInt, which is equal to the previous\
    \ value multiplied by 7. The final line converts this back to a string using the\
    \ method Integer.toString.\n\nFinally, I used a Toast command to display the age\
    \ to the user:\n\n```java\nToast.makeText(this, \"Your cat is \" + catAgeString\
    \ + \" in cat years\", Toast.LENGTH_SHORT).show();\n```\n\nThis time we use two\
    \ '+s, as we have some text before and after the catAgeString.\nThat's your final\
    \ complete code should look like this:\n\n```java\npackage com.example.robperceival.catyears;\n\
    \nimport android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\n\
    import android.view.View;\nimport android.widget.EditText;\nimport android.widget.Toast;\n\
    \npublic class MainActivity extends AppCompatActivity {\n    public void showCatAge(View\
    \ view) {\n\n        EditText ageEditText = (EditText) findViewById(R.id.ageEditText);\n\
    \n        String age = ageEditText.getText().toString();\n\n        int ageInt\
    \ = Integer.parseInt(age);\n\n        int catAgeInt = ageInt * 7;\n\n        String\
    \ catAgeString = Integer.toString(catAgeInt);\n\n        Toast.makeText(this,\
    \ \"Your cat is \" + catAgeString + \" in cat years\", Toast.LENGTH_SHORT).show();\n\
    \    }\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
    \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
    \    }\n}\n```\n\n# Summary\n\nCongratulations! You’ve built your first app and\
    \ now that you've learned the basics of Android development, if you want to get\
    \ more into it, there are some great resources available to help you. If you want\
    \ to learn more about development, you'll likely find someone who has struggled\
    \ with it before on sites where you can find questions and answers, like Stack\
    \ Overflow. Every time you find yourself at a dead end, searching the web for\
    \ answers is a great tool.\n\nFor now though, give yourself a pat on the back!\n\
    \n# Further learning\n\nHere are a few courses if you want to learn Android development\
    \ more detail:\n\n- www.udemy.com/complete-android-developer/ my online course,\
    \ covering all aspects of Android.\n- https://developer.android.com/training/basics/firstapp/index.html\
    \ - official Google training materials.\n- www.coursera.org/specializations/android-development-\
    \ range of beginner and advanced courses.\n- www.udacity.com/course/developing-apps-\
    \ free Android course, created by Google.\n\n# Debugging 10\n\nIf you're reading\
    \ this so far, you should now have some experience in coding in a range of different\
    \ languages. Within web development, you've coded in HTML, CSS and JavaScript,\
    \ using a text editor and a browser to run your code. You've coded in Python using\
    \ the online compiler at https://repl.it/languages/python. You've also built an\
    \ iPhone app using Swift and Xcode (if you have access to a Mac) and an Android\
    \ app using Java and Android Studio.\n\nOne thing you'll likely have come across\
    \ all these platforms, and in all of these languages, is bugs. A bug occurs when\
    \ any piece of code doesn't run as intended. They vary considerably in severity,\
    \ from a bug which stops your code running at all (such as forgetting the semicolon\
    \ at the end of a line in Java), to a CSS issue which causes your website to display\
    \ a little lower down than you'd like.\n\nIn this section we'll start by considering\
    \ why you might want to learn debugging even if you not planning to take your\
    \ coding career any further. Next well look at some standard debugging processes\
    \ (and how you can apply some of them to non-coding related problems in your work\
    \ or life in general). Finally, we'll look at some specific debugging tools and\
    \ techniques for the platforms we've covered so far: web (HTML, CSS and JavaScript),\
