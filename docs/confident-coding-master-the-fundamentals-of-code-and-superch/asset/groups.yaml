    \ What is HTML?\n\nHTML stands for Hypertext Markup Language, and it is the language\
    \ that all websites are written in. Hypertext describes the fact that an HTML\
    \ page can contain links to other HTML pages, which was one of the founding principles\
    \ behind the web.\n\nHTML was created by Tim Berners-Lee in the late 1980s as\
    \ he was developing what is now known as the internet. He created it as a way\
    \ of organizing his own notes, but soon wanted to share his documents with others.\
    \ As the web grew, Berners-Lee's language worked so well that others adopted it\
    \ for adding formatting to text, forms, images, and of course links.\n\nOne aspect\
    \ behind the success of HTML (as with all the languages in this book) is that\
    \ Berners-Lee made it freely available for anyone to use. It is this freedom that\
    \ allowed the web to grow so fast, and allows anyone today to use the same tools\
