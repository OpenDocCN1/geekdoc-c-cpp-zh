    \ time though.\n- grey: this is the border colour. You can use any colour you\
    \ like, or HTML colour codes such as #47D812.\n\n# Challenge 2\n\nCreate a 10\
    \ pixel dashed border in pink around div. Your code should look like this:\n\n\
    ```\nborder: 10px dashed pink;\n```\n\nAnd in action (4.17):\n\n![](img/57532e13229b6da209b2a527acf10e32_81_0.png)\n\
    \nBorders can get garish, so keep them simple.\n\n## Rounded corners\n\nRelated\
    \ to borders are rounded corners. These were added in CSS 3, the latest version\
    \ of the language. To add them, we use the border-radius property. Try replacing\
    \ the style for divA to:\n\n```\nborder-radius: 10px;\n```\n\n# 4.18\n\n![](img/57532e13229b6da209b2a527acf10e32_82_0.png)\n\
    \nNow we have an attractive rounded rectangle (4.18). You can adjust the border-radius\
    \ to anything you like to increase the roundedness, but 10 pixels is usually right\
    \ for most situations. Question: What happens when you set the border-radius to\
    \ 50%? Answer: We get a circle because the radius of curved edge is equal to half\
    \ the width of the div (in this case). This means there is no room for straight\
    \ edges – the whole border is rounded, and thus we are left with a circle.\n\n\
    Note that the rounded corner is only applied to the background and not the content\
    \ – you would have to add some padding to the div to position the text inside.\n\
    \nPractice exercise: Practise adding a simple border and rounded corners to two\
    \ divs: CC 20\n\n## Fonts\n\nJust like with a standard document, we can change\
    \ the fonts used on our webpage. So far, we have displayed all text in the browser’s\
    \ default font (in Chrome’s case this is Times New Roman).\n\nTo keep our webpage\
    \ simple, remove the red div and its styles, and add a paragraph which says ‘This\
    \ is some text.’ (Or something creative if you fancy.) Your page should now look\
    \ like this (4.19):\n\n![](img/57532e13229b6da209b2a527acf10e32_83_0.png)\n\n\
    Now add the following style:\n\n```\nbody {\n  font-family: sans-serif;\n}\n```\n\
    \nThis changes the text to the browser’s default sans font. Sans serif means without\
    \ serifs, ie without decorative lines or ‘ticks’ at the end of each letter. Sans\
    \ serif fonts are usually seen as more modern and cleaner than serif fonts. Note:\
    \ we have applied the font-family property to the body, not the paragraph element.\
    \ This means that all text on the page will be affected, which is exactly what\
    \ we want, as most web pages use just one font.\n\n## Fancier fonts\n\nWe don’t\
    \ have to limit ourselves to the default serif and sans fonts, we can use any\
    \ font we like. However, if our website is popular, it will be accessed from a\
    \ range of different devices, which may not have the font that we want installed.\
    \ In this case, we can set up a list of fonts, and the webpage will use the first\
    \ one that available.\n\nFor example, try this style:\n\n```\nfont-family: \"\
    Comic Sans MS\", cursive, sans-serif;\n```\n\nIf you're accessing the site on\
    \ a computer, you will likely see the text in the Comic Sans font. However, if\
    \ font is not available on a user's device, it will fall back to the device's\
    \ default 'cursive' (handwriting-style) font, and if that is not available it\
    \ will use the default sans font.\n\n```css\nbody {\n  font-family: \"Helvetica\
    \ Neue-Light\", \"Helvetica Neue Light\", \"Helvetica Neue\", Helvetica, Arial,\
    \ \"Lucida Grande\", sans-serif;\n}\n```\n\nHelvetica Neue is a font known for\
    \ being modern, simple and stylish, but only Apple devices make it available as\
    \ a default. This CSS style will select what you want to font if it is available,\
    \ but offers a range of fallbacks to pick the 'prettiest' version of the font\
    \ available as you can see on the right (4.20):\n\n![](img/57532e13229b6da209b2a527acf10e32_84_0.png)\n\
    \nIt is generally recommended to stick to 'web safe fonts' if you are confident\
    \ that all your users will see the font that you intend. To get a list of these\
