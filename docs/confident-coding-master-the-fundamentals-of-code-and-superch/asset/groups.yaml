    # 引言


    2016年6月，《快时尚》(Fast Company) 发表了一篇解释“为什么编程仍然是未来最重要的工作”的文章。研究机构 Burning Glass 发现，需要编程技能的工作平均高出
    22,000 美元，且超过 58,000 美元的工作有一半需要某些编程技能。此外，所有的编程机会都位于技术之外的行业，包括金融和医疗保健。


    获取能够提高薪水和职业进程的专业技能，过去通常需要一个学位，甚至在博士或 MBA 学习中学习多年。但今天，在线课程和编程训练营的激增使得任何拥有电脑和互联网连接的人都有可能掌握编程技能。


    随着计算机变得越来越聪明，并能够驾驶汽车、撰写新闻和独立运营业务，对能够编写机器代码的人的需求将更加迫切。


