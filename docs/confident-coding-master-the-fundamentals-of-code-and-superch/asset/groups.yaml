    # Learn more


    For most people, the best way to learn to code, once you have covered the basics,
    is to build things, and figure out what you need as you go along. However, if
    you prefer a more structured approach there are a range of online courses which
    range from free to a few hundred dollars, covering pretty much any aspect of coding.


    Courses I recommend can be found at the end of the web, iOS and Android development
    chapters. For more general courses, or on different topics, you can try the following:


    - udemy.com – a huge range of courses on all topics, rated, and often heavily
    discounted.

    - codeacademy.com – interactive coding courses, many free, on web development
    and related topics.

    - codeschool.com – 65 high quality video courses for $29 per month.


    You could also search for coding bootcamps in your local area if you would rather
    have in-person training, although these tend to be rather more expensive.


    Whatever you do, I hope this book has inspired you to take full advantage of your
    newfound technical skills. Coding experience remains rare and highly sought-after
    in all professions, and gives the freedom of building your own digital products,
    creating new income streams and perhaps even starting your own business.


    Learning to code changed my life in ways I never anticipated, and I have no doubt
    it will do the same for you too.


