  - "[PAGE 64]\n\n# CSS 04\n\nNow that you have covered HTML, which allows you to\
    \ create different types of elements on a webpage,in this chapter you'll learn\
    \ how to style those elements using CSS. Then, in the next chapter, we'll be making\
    \ the elements interactive using JavaScript.\n\nIn this chapter we'll cover:\n\
    \n+   * what CSS is and how it is used;\n* how to refer to elements using classes\
    \ and IDs;\n* using DIVs to break up our webpages; and\n* how to use CSS to adjust\
    \ the following:\n  - borders and positioning\n  - colours and fonts\n  - text\
    \ and link formatting.\n\n# What is CSS?\n\nHTML allows us to add elements to\
    \ our webpages, but it does not easily allow us to adjust their position, colour,\
    \ font or style in general.\n\nCSS was introduced by Håkon Wium Lie, a colleague\
    \ of Berners-Lee, in 1994. The main idea is to keep the styling information separate\
    \ from the content of the page, so it's easy to adjust the style without affecting\
    \ the content. In fact, you can completely change the look and layout of a webpage\
    \ by just changing the CSS, without editing the HTML at all.\n\nCSS stands for\
    \ Cascading Style Sheets – the 'cascading' part refers to the way the browser\
    \ decides which style ' should apply to an element when there are multiple, conflicting\
    \ rules. For example, if one style says a <p> element should be blue, and another\
    \ says it should be red, we need to have a consistent way to know what colour\
    \ the <p> element should actually be. We'll see several examples of this later\
    \ on."
  - '[PAGE 65]


    # Why learn CSS?


    Learning HTML without CSS is a bit like learning to paint in black and white:
    you can draw anything you like, but you are missing out on a world of colour.
    CSS allows us to design our websites to look unique, friendly and pretty. It will
    allow you to customize the look of any website you want to build or maintain.


    From a coding point of view, CSS''s use of classes and IDs (we''ll see what they
    are very soon) is fundamental to JavaScript, and will teach you how we can use
    a single line of code to affect the look of number of different elements. CSS
    is still pretty simple, but is slightly more complex than HTML to get your head
    around, so it''s the perfect second language to learn as you develop your coding
    skills.


    # What does CSS look like?


    Enough introduction! Let''s see some CSS in action. First off, add a paragraph
    to an empty webpage containing the words: ''I love HTML.''


    > Note – head to the beginning of the HTML chapter if you need a reminder on how
    to set up your text editor, browser and a basic webpage. Your code should look
    like this:


    ```

    <p>I love HTML.</p>

    ```


    Now add a ''style'' attribute, with a value of ''color:blue'' so it looks like
    this:


    ```

    <p style="color:blue">I love HTML.</p>

    ```


    Through the wonder of CSS, you will see that the text turns blue. Try experimenting
    with other colours.


    > Note to my British readers: you will have to use American spelling I''m afraid,
    colour:blue will not work.


    The ''color:blue'' part is the CSS, and is a single CSS rule which applies to
    that particular <p> element.


    Adding CSS using a ''style'' attribute is known as inline CSS, as it is in line
    with the HTML.'
- md: "\n# Practice exercise\n\nTry turning the text in this paragraph red using inline\
    \ CSS: `CC 12`\n\nThere is a problem with inline CSS though – if we want to make\
    \ the text of every paragraph red, we have to add a style attribute to each paragraph.\
    \ This is messy, and if we suddenly want to change the colour of all our paragraphs\
    \ to green, we will have to update each one individually.\n\nFortunately, there\
    \ is a solution to this problem, and it is called internal CSS.\n\n# What is internal\
    \ CSS?\n\nInternal CSS is when we include all the CSS together at the beginning\
    \ of our HTML document (we will meet the third and final type of CSS, external,\
    \ at the end of the chapter). It looks like this (4.1):\n\n![](img/57532e13229b6da209b2a527acf10e32_66_0.png)\n\
    \nLook carefully at the <head> section of our webpage – it contains a new element,\
    \ <style>, which contains our CSS. The contents of the <style> section are:\n\n\
    - 2 Change the styling in this webpage from inline to internal CSS: [CC 13]\n\
    - 3 CSS is not limited to p tags. Add an h<h1> element to your webpage and use\
    \ internal CSS to make the text yellow. \n\nYour code should look something like\
    \ this (4.3):\n\n![](img/57532e13229b6da209b2a527acf10e32_68_0.png)\n\n# Classes\
    \ and IDs\n\nWhat if we wanted some paragraph tags to be blue and others red?\
    \ We need a way to select elements more precisely than just by their type. We\
    \ do this using classes and IDs.\n\n# Classes\n\nAdding a class attribute to an\
    \ element is simple – change the code for the first paragraph to:\n\n```\n<p class=\"\
    blue\">I love HTML.</p>\n```\n\nWe have now applied the class 'blue' to that paragraph.\
    \ Now add the following code to the style section of your webpage:\n\n```\n.blue\
    \ {\n  color: blue;\n}\n```\n\nNote: the . before 'blue' tells the browser that\
    \ we are looking for a class. A period, or full stop, is shorthand for class in\
    \ CSS.\n\n# Languages\n\nYou should now find that the first paragraph is blue,\
    \ and the second is green.\n\nTry adding the class=\"blue\" attribute to the h\
    \ element. You'll see that ‘My first webpage’ becomes blue as well. Classes allow\
    \ us to provide specific CSS rules to as many elements as we like, and to elements\
    \ of any type.\n\nNote that the paragraph with class 'blue' actually has two style\
    \ rules applied to it. The p rule tells it to be green, and the .blue rule tells\
    \ it to be blue. As CSS states that the most 'specific' rule should win out, rules\
    \ defined by classes or IDs will always trump those applied to element types.\
    \ So the paragraph ends up blue, not green. This is the ‘cascading’ part of Cascading\
    \ Styles in action.\n\n# IDs\n\nIDs are very similar to classes, but they should\
    \ only be applied to one element on a webpage. They are designed for elements\
    \ that will only appear once, such as a header, footer or title.\n\nWe add them\
    \ in the exactly same way as with classes, so try changing the ‘I love CSS!’ paragraph\
    \ to have an ID of ‘pink':\n\nNow add the following CSS to the style section:\n\
    \n```\n.pink {\n  color:pink;\n}\n```\n\nNote: here we use a hash symbol, #, to\
    \ represent an ID. So in CSS, . is short for class and # is short for ID.\nYou'll\
    \ notice that the ‘pink’ rule and the ‘p’ rule both apply to the ‘I love CSS!’\
    \ paragraph, but the ID rule wins out. Rules relating to IDs and classes will\
    \ always trump those related to element types.\n\n# Practice exercise\n\n- Add\
    \ internal CSS to the webpage to make the first paragraph red and the second paragraph\
    \ blue using classes and IDs: CC 14\n\n![](img/57532e13229b6da209b2a527acf10e32_69_0.png)\n\
    \nWe can now select elements by either their type, or their class or ID. We have\
    \ only learned one CSS rule though, which is how to change the colour of text.\
    \ Before we look at other rules, we'll quickly see how we can use the <div>-element\
    \ to break up our code into different sections.\n\n# Divs\n\nDiv is short for\
    \ ‘division’ and allows us to divide our code into different sections. This means\
    \ we can style each section differently if we want to. Remove all the code from\
    \ the body of your page and replace it with this:\n\n```\n<div class=\"divA\"\
    >\n  <p>I'm in div A</p>\n</div>\n<div class=\"divB\">\n  <p>I'm in div B</p>\n\
    </div>\n```\n\nThe result should look like this (4.4):\n\n![](img/57532e13229b6da209b2a527acf10e32_70_0.png)\n\
    \nQuestion: Why is the text for both paragraphs now green?\nAnswer: We have removed\
    \ the class and ID from the paragraphs, so now the only rule that applies to them\
    \ is the color: green rule. Therefore they are both green.\n\nIt might not look\
    \ like the divs are doing very much, they actually give us a lot of control over\
    \ design when we start applying them. \n\n# Background colours\n\nWe'll now look\
    \ at a range of different styles. Remove the code from the tag and replace it\
    \ with:\n\n```css\ndiv {\n  background-color: grey;\n}\n```\n\nThis gives both\
    \ divs a background colour (4.5):\n\n![](img/57532e13229b6da209b2a527acf10e32_71_0.png)\n\
    \nNote: The div stretches across the window by default.\n\n# Practice exercise\n\
    \n- Use classes to give the first div a colour of red and the second one blue.\n\
    \n# Colour codes\n\nSo far we've only used names to describe colours. But we want\
    \ to be more precise than just names, and we do that using codes. The hash symbol\
    \ # tells us we are using a hex code. In CSS, it looks like this:\n\n```\n.div\
    \ {\n  background-color: #ff0000;\n}\n```\n\nThe hex codes are made of six digits:\
    \ 0-9 and A-F. The first two digits represent red, the next two green, and the\
    \ last two blue. For example #ff0000 is red, #00ff00 is green, and #0000ff is\
    \ blue.\n\nTry using some hex codes to find different colours.\n\n# Practice exercise\n\
    \n- Update the internal CSS on this page to use hex codes for the background colours.\
    \ \n\n# Changing sizes\n\nWe can use width and height to change the sizes. Try\
    \ using the following on your page:\n\n```\n.divA {\n  background-color: red;\n\
    \  width: 200px;\n  height: 200px;\n}\n```\n\n```\n.divB {\n  background-color:\
    \ blue;\n  width: 50%;\n}\n```\n\nYour page should look like this (4.6):\n\n![](img/57532e13229b6da209b2a527acf10e32_73_0.png)\n\
    \nNote that we can use as many units as we want. 200px means 200 pixels and 50%\
    \ means 50% of the containing element.\n\n# Positioning with floats\n\nSo far\
    \ we've seen how to use CSS to adjust colours and sizes, but we can also affect\
    \ layout. Up until now, all our elements appeared below each other, but we can\
    \ change that using floats. Try adding this CSS rule to .divA:\n\n```\nfloat:\
    \ right;\n```\n\nYour page should look like this (4.7):\n\n![](img/57532e13229b6da209b2a527acf10e32_74_0.png)\n\
    \nNotice what has happened: divA is now 'floated' on the right of the page, and\
    \ divB is in line with it on the left. Try making the following changes:\n\n-\
    \ Adding float: left to .divB\n- Changing the width of divB to 20%.\n- Adding\
    \ a paragraph after divB with the content 'This is some text'.\n\nCan you explain\
    \ the resulting layout? It should look like this (4.8):\n\n![](img/57532e13229b6da209b2a527acf10e32_74_1.png)\n\
    \nWe now have a three-column layout, with the red div on the right, the blue on\
    \ the left, and everything else in the middle. Floats are an extremely useful\
    \ way to arrange divs or other elements to the left or right of each other.\n\n\
    # Practice exercise\n\n- Update the internal CSS on this page to make #left float\
    \ left and #right float right CC 16\n\n# Layout with positions\n\nSometimes we\
    \ want to be even more precise with our layouts than floats can allow, and we\
