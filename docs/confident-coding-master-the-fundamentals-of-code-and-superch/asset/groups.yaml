- md: "\n# Coding and entrepreneurship\n\nAt the same time, what can you learn from\
    \ your competitors? What are you doing well that you could incorporate into your\
    \ business? Don't be afraid to steal great ideas!\n\nWhat if you don't find any\
    \ competitors? It could of course mean that you have come up with a genuinely\
    \ new idea, but not necessarily. It may well mean that there simply isn't a market\
    \ for your idea, or that people have tried and failed (or you are searching with\
    \ the wrong keywords).\n\nOnce you have done your competitor research, you should\
    \ have a fairly clear idea of what makes your business unique, and better than\
    \ the competition. So now it's time to build it, right? Not yet. First you need\
    \ to reach some potential customers and talk to them about what they would want\
    \ your product or service.\n\nAt this point, you can hopefully see another benefit\
    \ of having a blog, or some sort of online following. If these people were your\
    \ target market, you could contact them individually or collectively to get their\
    \ feedback.\n\nIf you don't have easy access to potential customers or, the process\
    \ will be a little harder, but not impossible. If you are targeting a specific\
    \ niche, find out where these people are (both in real life and virtually). Find\
    \ a way in your local area and offer to them a coffee or lunch in exchange for\
    \ feedback on your idea. If there are forums or Facebook groups dedicated to people\
    \ in your niche, post there.\n\nFace-to-face feedback is particularly valuable,\
    \ as internet comments tend towards the flippant and critical. When you are speaking\
    \ to clients, at all possible try to get a firm commitment. If you ask ‘would\
    \ you use this’, they will almost certainly say yes, for the same reason friends\
    \ and family want to support you. Asking ‘how much would you pay for this’ is\
    \ often more revealing. You could even ask them for a payment then and there (refundable\
    \ if they are not happy with the product), to establish just how keen they are.\n\
    \nWhat if you don't have a specific niche, or you have no way of getting in touch\
    \ with potential customers? One great solution is to create a simple ‘Coming Soon’\
    \ website, and ask people to sign up to your newsletter if they are interested.\
    \ Include the key features of the product and a rough date when you plan to launch,\
    \ and perhaps some screenshots if you have any. You could do this with a Wordpress\
    \ theme, using a service such as mailchimp to manage the email sign-ups.\n\nOnce\
    \ you have built your site, tell your friends and family about it and ask them\
    \ to share it. You could even run a small campaign to drive traffic to the site\
    \ – spending £100 on Google or Facebook ads could be money well if it saves you\
    \ hours building a website no-one wants.\n\nThe crucial thing at each stage is\
    \ to evaluate your idea objectively. Don’t put off if one person tells you it\
    \ will never work, but at the same time it likely not be wise to ‘keep the faith’\
    \ in the face of overwhelming evidence that there is not a market for your product,\
    \ or that market is currently served very well by existing businesses. \n\n# Creating\
    \ a minimum viable product\n\nAll right, so you are convinced that there is a\
    \ target market for your product or service, and that you are able to create something\
    \ better than anything that currently exists? Great. It’s time to get to work!\n\
    \nThe phrase ‘minimum viable product’ (MVP) nearly expresses the idea that you\
    \ should build the smallest thing that you can satisfy your customers. It is tempting\
    \ for budding entrepreneurs to feel that their website or app has to do everything\
    \ – it has to have more features, better looking, and be easier to use than anything\
    \ else available. Sometimes this is true, but in most cases it’s more important\
    \ to do one thing extremely well, than it is to do everything your customers need.\n\
    \nGoogle is a classic example. Their homepage had (and, largely, still) has a\
    \ simple search box and two buttons. The one thing they did really well help people\
    \ find the information they were looking for. Not all businesses can be quite\
    \ that minimal, when designing your product you should try to establish what the\
    \ one thing is that your business does better than anyone else, and focus on that.\n\
