  - "[PAGE 49]\n\nIf you try out that code, you'll see that you can only select one\
    \ of the options. Also, once you have selected an option, you cannot deselect\
    \ it – so you have to choose one and only one of the options.\n\n# Practice exercise\n\
    \nFor each of the following, state whether you would use a checkbox or a radio\
    \ button:\n\n+   1. Asking a user whether they want to subscribe to a newsletter.\n\
    2. Asking a user whether they prefer tea or coffee.\n3. Asking a user what countries\
    \ they have travelled to from a list.\n\nAnswers\n\n+   1. Checkbox – they can\
    \ select or deselect the box as they wish.\n2. Radio – they should only be able\
    \ to select one option.\n3. Checkbox – they can then select as many as they want\
    \ to (or none).\n\n# Drop-down menus\n\nIf you want to create a drop-down list\
    \ where the user can select from a range of options, you can use the select element.\
    \ It looks like this:\n\n```\n<select>\n  <option>1</option>\n  <option>2</option>\n\
    \  <option>3</option>\n</select>\n```"
  - '[PAGE 50]


    Try this out in your text editor – you should see something like this (3.15):


    ![](img/57532e13229b6da209b2a527acf10e32_50_0.png)


    This code is a little more complicated then the input elements, but still fairly
    straightforward. The <select> tag introduces the drop-down menu, and then we add
    an <option> tag for each of the options within the drop-down.


    Question: What does the </option> tag do?

    Answer: It signals the end of that option, ready for us to add another one, or
    use <select> to end the drop-down menu.


    # Text areas


    What if you want to allow a user to enter some text, but need them to have more
    than a little box? That’s where text areas come in. You add them like this:


    ```

    <textarea></textarea>

    ```


    Try it out, and you’ll see a larger box where you can add multiline text. Unlike
    inputs, text area tags are not self-closing, so you need to add a </textarea>
    afterwards to end the element.'
