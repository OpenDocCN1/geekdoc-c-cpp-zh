    \ should see the ‘welcome to Android Studio’ screen. Click ‘Start a new project’\n\
    \n- Application name: anything you like – try something like ‘My First App’.\n\
    - Company Domain: similar to a normal name, such as google.com, but you don’t\
    \ have to actually own the domain name. So you can use rob.percival.com, or yourcompany.com.\
    \ It doesn’t matter what you use now, but if you submit your app to Google Play,\
    \ the Company Domain will become part of the unique Package ID for your app.\n\
    - Project location: you can change this if you wish, or leave it as the default\
    \ – this is where the project files will be stored.\n- Form Factors: choose devices\
    \ including phones, tablets, Android Wear, TV and more. We are only covering Phone\
