  mdcn: "\n如果你尝试运行该代码，你会发现只能选择选项中的一个。此外，一旦你选择了一个选项，就无法取消选择——所以你必须在选项中选择且仅选择一个\n\n\
    ## 练习题\n\n对于以下每一项，请说明你会使用复选框（checkbox）还是单选按钮（radio button）：\n\n- 1. 询问用户是否想订阅新闻邮件。\n\
    - 2. 询问用户他们更偏于喝茶还是咖啡。\n- 3. 从一个列表中询问用户他们去过哪些国家。\n\n答案\n\n- 1. 复选框 – 他们可以根据意愿勾选或取消勾选框。\n\
    - 2. 单选按钮 – 他们应该只能选择一个选项。\n- 3. 复选框 – 他们可以根据需要选择任意数量的（或都不选）。\n\n## 下拉菜单\n\n如果你想创建一个让用户从一系列选项中选择的下拉列表，可以使用\
    \ `select` 元素。它看起来如下：\n\n```\n<select>\n  <option>1</option>\n  <option>2</option>\n\
    \  <option>3</option>\n</select>\n```\n\n在你的文本编辑器中尝试一下——你应该能看到类似这样的（3.15）：\n\n\
    ![](img/57532e13229b6da209b2a527acf10e32_50_0.png)\n\n这段代码比 `input` 元素稍微复杂，但仍然非常简单。<select>`\
    \ 标签引入了下拉菜单，然后为下拉菜单中的每个选项添加一个 `<option>` 标签。\n\n问题：`</option>` 标签的作用是什么？\n答案：它标志该选项的结束，我们可以添加另一个选项，或者使用\
    \ `</select>` 来结束下拉菜单。\n\n## 文本区域 (Text areas)\n\n如果你允许用户输入一些文本，但他们需要的空间不仅仅一个小方框怎么办？这时文本区域就派上用场了。你可以这样添加它们：\n\
    \n```\n<textarea></textarea>\n```\n\n尝试一下，你会看到一个更大的框，你可以在其中添加多行文本。与 `input` 不同，`textarea`\
    \ 标签不是自闭合的，因此你需要在之后添加 `</textarea>` 来结束该元素。\n\n## 练习题\n\n使用 `cols` 和 `rows` 属性更改文本区域的宽度和高度。创建一个高度和宽度大约为你浏览器窗口一半的文本区域。\n\
    \n经过一番尝试，你的代码看起来应该像这样：\n\n```\n<textarea cols=50 rows=25></textarea>\n```\n\n\
    这将为你提供一个像这样的文本区域（3.16）：\n\n![](img/57532e13229b6da209b2a527acf10e32_51_0.png)\n\
    \n## 按钮 (Buttons)\n\n每个表单都需要一个提交按钮。你可以使用 `input type 'submit'` 来添加一个，如下：\n\n这会给你一个带有“Submit”字的简单提交按钮。如果你想更改按钮上的文字，可以添加一个\
    \ `value` 属性，如下：\n\n```\n<input type=\"submit\" value=\"Click Me!\">\n```\n\n\
    表单部分我们就到此为止（我们将在第 6 章再次看到它们）。它们是与用户交互的一种非常简单的方式，如果你正在创建或编辑网站，很快就会遇到它们。\n\n## 挑战\
    \ 2\n\n你现在已经熟悉所有的基础表单元素，所以尝试创建一个简单的注册表单，允许用户输入电子邮件地址、密码，可能还有性别（或喜欢的冰淇淋口味）。别忘记提交按钮。\n\
    \n![](img/57532e13229b6da209b2a527acf10e32_52_0.png)\n\n## 表格 (Tables)\n\n表格向用户展示信息的极佳方式——本质上它们像电子表格，每个单元格都有不同的内容。要创建一个表格，请使用以下代码：\n\
    \n```\n<table>\n  <tr>\n    <th>Name</th>\n    <th>Age</th>\n    <th>Gender</th>\n\
    \  </tr>\n  <tr>\n    <td>Rob</td>\n    <td>35</td>\n    <td>Male</td>\n  </tr>\n\
    </table>\n```\n\n`<table>` 标签非常通俗易懂——它表示我们想要显示一个表格。`<tr>` 是 'table row'（表格行）的缩写，定义了表格中新行的开始。`<th>`\
    \ 是 'table header'（注：原文此处应为 'table header' 逻辑，意为表格表头）的缩写，因此每一个 `<th>` 都是我们表格的单列表头。\n\
    \n在表格表头之后，我们使用 `</tr>` 表示第一行的结束，并使用另一个 `<tr>` 开始新行。`<td>` 是 'table data'（表格数据）的缩写，我们以此引用表格中单元格的内容。每行都应该具有相同数量的列（在这种情况下为\
    \ 3 列）。\n\n将其输入你的文本编辑器并看看长什么样。你应该看到类似这样的（3.17）：\n\n![](img/57532e13229b6da209b2a527acf10e32_53_0.png)\n\
    \n你可以看到表格单元格对齐得很好，而且表头是加粗的。搞定——我们的第一个表格！\n\n问题：在你的表格中再添加三行，代表你的三位家人或朋友。\n答案：你的\
    \ HTML 应该像这样：\n\n```\n<table>\n  <tr>\n    <th>Name</th>\n    <th>Age</th>\n \
    \   <th>Gender</th>\n  </tr>\n  <tr>\n    <td>Rob</td>\n    <td>35</td>\n    <td>Male</td>\n\
    \  </tr>\n  <tr>\n    <td>Kirsten</td>\n    <td>36</td>\n    <td>Female</td>\n\
