- md: '

    ## Pursuing coding further to become a developer


    Take time over your portfolio site, and make sure there is room to expand it as
    you learn new skills and complete new projects. It will hopefully be your standard
    bearer for many years to come, so it''s worth getting it right.


    ## Expanding your online presence


    It is very likely that potential employers will search your name on Google, so
    it is important that your online presence is cohesive and impressive. We have
    talked at length about having a blog, and also tending to your Twitter feed and
    portfolio. But there are other things you can do to boost your online image.


    ## Keep your LinkedIn profile up to date


    LinkedIn.com is by far the biggest professional social network. You should have
    a LinkedIn page, and it should reflect the jobs you are applying for. So all the
    above advice applies: express your experience and roles concisely and keep everything
    up to date. Include links to the projects you have worked on and testimonials.


    ## Have a Github page


    Github is a very popular site for storing code, usually for open source applications.
    If you build tools, such as a JavaScript image slider, or simple apps such as
    an iPhone calculator, put them on your Github page. Not only will it help other
    people but it will give you another place to show your talents and experience.


    You might also want to consider contributing to open source projects. Anyone can
    do this, and it is a great way to give back to the community that likely produced
    a lot of the free tools you have used so far to build websites and apps. However,
    you need to be sure that you know what you are doing if you contribute to projects
    – contributing poorly written or buggy code will not make you any friends within
    the community.


    ## Writing a software developer CV


    The process of writing a CV for a software developer is much the same as for other
    industries: keep it concise, honest, relevant and don''t belittle your achievements.
    If you are looking for a career change into coding, you might be wondering how
    much of your previous work to include, and how to ''talk'' your relative lack
    of development experience.


    ## Future-proofing your career with coding


    My advice would be to include each of your roles (ideally leave no gaps in your
    timeline), but don''t go into detail of what the work involved. If you want to
    work as a developer, you should focus on what you have done to develop your new
    skills, and the portfolio of what you have developed. As with your portfolio,
    clarify what particular languages and environments you are familiar with, as evidenced
    by the projects you have worked on.


    It is likely that some people read that your CV will not be technical, in instead
    be looking for keywords such as JavaScript or PHP, so make sure you include all
    relevant skills as explicitly. The word ''relevant'' there is important – be aware
    of the job you are applying for and tailor your list of skills. A complete laundry
    list of every language you''ve ever worked with is not required!


    A great technique is to state what you like and dislike about the tools you have
    used – this shows that you understand them well enough to be familiar with their
    foibles. You can do this in a ''summary'' section, which also includes a statement
    about your overall level of experience, and also of some of the personal projects
    you have worked on. This will show that you have a genuine interest in programming,
    and also give you something interesting to talk about in the interview.


    As always, be honest – don''t claim to have years of coding experience you don''t,
    but make clear that you are a faster learner and have achieved a lot in the short
    time you have been coding. If you are applying for appropriate jobs (ie entry-level
    coding positions), your employer won''t expect a huge amount of experience or
    a degree in computer science, but they will want to see that you have the basic
    technical skills they are looking for, and that you are genuinely interested in
    what you do.


    ## The interview


    As with CVs, all the standard interview advice applies here: be personable, interested
    in your interviewers, and have a strong knowledge of the company and the role
    you are applying for. As well as, read your CV thoroughly and write down at least
    20 questions that might be asked about what you''ve written (if you can''t think
    of 20, ask a friend or family member). Write down good answers to these questions,
    and read them out loud several times. This will help you get confident, fluent
    answers to questions that are bound to come your way.


    ## Pursuing coding further to become a developer


    Your interviewers will likely be a technical manager (your future boss), fellow
    coders (your future colleagues) and possibly a non-technical HR representative.
    Imagine the interview from their perspective – they would likely rather doing
    something else, so try to be upbeat and enthusiastic, and talk confidently about
    the interesting side projects you mentioned on your CV.


    Keeping up to date with industry news is also a great way to show that you are
    genuinely interested in programming, and gives you something of substance to talk
    about instead of small talk.


    ## Summary


    The process described in this chapter – that of building a portfolio, working-on
    freelance jobs, writing your CV and attending interviews, to finally landing a
    programming job is not a quick one. I would allow at least a year. But remember
    you''ll learn a huge amount along the way, and gain technical and personal skills
    that will be useful regardless of whether you become a full-time developer or
    not.


    ## Conclusion


    If you’ve made it to the end of this book, congratulations! You’ve learned at
    least six programming languages, and considered a wide range of ways you can use
    your skills in your current role, and to develop your employability and create
    a side income.


    More importantly, I hope you now feel comfortable with the technology you use
    every day; with an understanding of how the apps and websites you use function,
    will be able to use them in more advanced ways to work more effectively and even
    start creating your own.


    So, what now? In the latter chapters of this book I outlined several opportunities
    that learning to code brings you. I hope you have already started taking on some
    of those opportunities, but just in case, I would like to recap some of the primary
    next steps. You should aim to choose between two and five of these to ensure your
    development continues, and you get the most out of reading this book.


    ## Work better


    Write down a list of lists that you could work more efficiently or effectively
    using some of the technologies we have covered. Think about repetitive tasks that
    you do regularly that could be automated, reports that you could produce more
    regularly or even in real time, or ways of speeding up research tasks. Consider
    using services like If This Then That, text expansion and AppleScript or PowerShell
    to speed up your workflow.


    Alternatively, consider how your office or work environment could be made better
    for you. Perhaps an automatic email requesting feedback on recent changes, or
    asking how staff are in their roles. Could technology make communication more
    effective in your department, or is there an app or website you could create to
    serve your customers?


    Using your skills to work better is a great way to provide more value for your
    employer and your customers, which will inevitably benefit you as your colleagues
    notice what you have achieved.

