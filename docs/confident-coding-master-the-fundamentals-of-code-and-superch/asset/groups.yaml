    \ exercise\n\n- 1 Update the internal CSS to give the #home div an absolute position\
    \ of 10 pixels right and 10 pixels down and the #next div a relative position\
    \ of 50 pixels right and 10 pixels up.\n\n## Margins\n\nMargins give an alternative,\
    \ and in some ways simpler, way to position elements. To see it in action, remove\
    \ all the floating and positioning rules from divA and divB and add the rule below\
    \ divA:\n\n```\nmargin: 20px;\n```\n\n## Languages\n\nThis gives a 20-pixel margin\
