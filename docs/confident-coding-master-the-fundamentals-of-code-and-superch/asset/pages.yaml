  md: '# In practice


    This code now works. Note that we need to put an ! after Int(number) because there
    is a chance that the conversion will not work. For example, in this code:


    ```

    var number = "rob"

    var newNumber = Int(number)! * 5

    ```


    we would get a crash, because Swift would not be able to convert the string ‘rob’
    to a number.

    Finally, if we wanted to multiply a number by a decimal we would need to convert
    it into a ‘float’ (ie a ‘floating point’ number, or a decimal). We would do using
    this code:


    ```

    var number = "8.4"

    var newNumber = Float(number)! * 5.3

    ```


    Feel free to play with these commands to get grips with them. In fact, Xcode has
    a great mode called ‘Playgrounds’ where you can type in code and see the output
    straight away, which is perfect for experimentation like this. To create a new
    playground, click File → New → Playground in Xcode and start typing some code.


    Note: If you test these lines of code in an Xcode playground, you will likely
    get a warning that ‘The variable was not mutated: changing var to let’. This is
    because as well as using var to create a variable in Swift, we can use let to
    create a constant (ie a variable that doesn’t change). This is preferred by Xcode,
    so if you have a variable that doesn’t change value, like number in the above
    examples, you should define it using let rather than var.


