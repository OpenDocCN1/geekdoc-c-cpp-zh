- img_proc: true
  md: 'With our problematic button, try using a ''print'' command (more on those

    sortly) to display the value of a variable to make sure it is what you think

    it is. You could even just use something like:


    ```

    print("hello")

    ```


    to make sure a certain chunk of code is being executed at all. The code

    removal process can be useful here as well – try removing all the button

    execution code apart from a print statement. If the print doesn''t happen,

    then there is a problem in the connection between the button and the code.

    If it does, add the code in gradually until it stops behaving as you would

    expect. Then you know where your error is.


    Ninety-five percent of the time your error should now be fixed – the

    process of defining the problem, explaining to yourself how your code

    works, and tweaking values/using print statements is the standard process

    y you should go through each time.


    Incidentally, this is exactly the procedure you can often apply to real-

    diffulties. Defining the problem is often the hardest part of making

    aert process more efficient, or figuring out why you are unlucky

    in love. Then, explaining to yourself what you are currently doing and

    why is probably enough for you to see where you are going wrong. If

    not, experiment with changing small things and see if that improves the

    situation.


    What if you still have a bug though? Sometimes we simply can''t fix a

    problem, and need to resort to outside help. Fortunately, because

    we clearly defined the problem, and have a strong understanding of

    what code is supposed to do, we should be able to search for, and ask

    for, help effectively.


    # Step 2: Searching for help


    If''ve got this far in this book, you''ve almost certainly done some debug-

    ging yourself, and in process of googling for an answer, you''ve likely

    come across stackoverflow.com. Stack Overflow is a simple idea – people

    post questions and other people answer them – but it proved extremely

    popular, and combined with a strong search engine, the answer to a huge

    range of common programming questions is at your fingertips.


    But what to search for? As I''ve mentioned, if you have a particular error

    message, simply googling that is a good first step. If not, you''ll need to think

    more carefully about what to search for.'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'As a starting point, I would always include the name of the programming language
    and/or platform in your search. A search for ''how do I change the colour of text''
    could apply to a huge range of different pieces of software, so add ''HTML'',
    ''CSS'', ''JavaScript'' or ''Swift'' at the end to get to your answer much more
    quickly.


    With Android development, it is often worth adding both ''Java'' and ''Android''
    to the search term, as Java is used in a range of different devices, and is not
    just for Android apps.


    If you are using a specific development environment, such as Xcode or Android
    Studio, it can be useful to add this to your search as well. If nothing else,
    including ''Xcode'' in a ''Swift'' search makes it less likely that your results
    will include articles about Taylor Swift!


    Beyond that, with any web search, try to be concise and unambiguous (this should
    come naturally after asking the three questions).


    Here are some bad queries. Try to think of better alternatives:


    +   - How do I make text bigger?

    - Swift blank screen on app launch

    - No sound in android app

    - Image won’t display in website


    Some better alternatives might be:


    +   - CSS how to change text size

    - Xcode Swift [give error message here]

    - Java Android how to play sound

    - HTML how to display image


    Note with the last two, instead of searching for the error, I am looking for instructions
    or code to do what I am trying to do. I might copy and paste the code I find into
    my app or website to see if that works. If it does, I can compare it to my code
    to see what is wrong. If it doesn''t, I can fairly be sure that the code itself
    is not the problem, and that the issue lies elsewhere.


    A quick caveat on copying and pasting code that you''ve found on the internet
    – this is a risky thing to do. At the very least you should make sure that you
    understand how the code works, but also bear in mind that it could have been written
    for an older version of your programming environment (Swift in particular is updated
    regularly), or possibly even for a different setup that you are using. In short,
    only copy and paste chunks of code that you understand and could debug yourself
    if necessary.'
