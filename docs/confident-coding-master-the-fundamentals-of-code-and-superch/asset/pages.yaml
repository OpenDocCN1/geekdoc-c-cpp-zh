- img_proc: true
  md: '# Summary


    In this chapter our aim was to go from some knowledge of HTML, CSS and JavaScript,
    and see how we can go from that to creating and sharing a real website with the
    world. We considered several reasons you might want to build a site, and how websites
    are different from software. Then we learned about domain names and web hosting,
    and the different ways you can get your website live. Finally, we saw how we can
    use CMSs such as Wordpress and frameworks like Bootstrap to get great looking,
    responsive websites and running fast.


    We''re now going to move away from websites and see how we can use our coding
    skills to build apps for mobile devices, starting with iPhones and iPads. It''s
    a very different process to working with websites, but many of the principles
    are the same. Apps represent a whole new way to get our content in the hands of
    users, and it''s pretty simple to get get started, so let''s go!


    # Further learning


    As well as the recommendations from the previous chapters to learn HTML, CSS,
    JavaScript and Python, there are holistic courses available to teach you every
    aspect of web development.


    +   - www.udemy.com/the-complete-web-developer-course-2/ – The Complete Web Developer
    Course (by myself) uses projects and real-life exercises to teach every aspect
    of web development.


    +   - www.open.ac.uk/courses/modules/rt284 – Open University course covering the
    foundations of web technologies and developing applications.


    +   - www.theodinproject.com/courses/web-development-101 – A free and open-source
    online course in web development.'
  merge: -1
