- img_proc: true
  md: '# Challenge 3


    Use regular expressions to extract the word ‘quick’ from the string ‘The quick
    brown fox’.


    Solution:


    The following code will do the trick:


    ```

    import re

    string = ''The quick brown fox''

    result = re.search(''The (.*) brown'', string)

    print(result.group(1))

    ```


    Note that you could use several different strings in the regular expression. For
    example, ''b'' and ''brown fox'' would both work after the (.*). Try them out!
    (6.25.)


    ![](img/57532e13229b6da209b2a527acf10e32_142_0.png)


    # Splitting strings into lists


    We’re getting close to being able to complete the web scraping challenge for this
    section. What if we had multiple bits of text that we wanted to extract from a
    string? For example, say we had the string ‘Rob,Kirsten,Tommy,Raphie’ and wanted
    to extract each of the names.


    It is possible to do this with regular expressions, but we’ll use a different
    method – splitting the string into a List.

    We do this with the command string.split(","), with the “," being the character
    we want to split the string up with.

    So to split our string we do this:


    ```

    string = "Rob,Kirsten,Tommy,Raphie"

    print(string.split(","))

    ```'
