- img_proc: true
  md: '# Building an app for iPhone or iPad


    Now that you have seen how to build and host complete websites, we are going to
    learn how to build apps that can run natively on the iPhone and iPad. Barely a
    week goes by without a news story of the latest app craze that is sweeping the
    nation (at the time of writing it''s Pokemon Go), and the exciting thing for coders
    is that quite often successful apps are built by individuals or small groups rather
    than big companies.


    Moreover, the best apps often do one thing very well – they don''t need to be
    hugely complex. For example, Pocket, developed by Nate Weiner in 2007 after teaching
    himself to code, lets people save articles on the web to read later. It now has
    over 22 million users and has raised over $7.5million in investment.


    In this section, we''ll see how to make a basic currency converter app and run
    it on a simulator within your computer. We''ll add user interface elements like
    labels and buttons, and write some code in Swift, the Apple-designed language
    used for iPhone app development.


    A word of warning – the software required to create iPhone apps can only be run
    on a Mac, so if you don''t have one you''ll need to get hold of one to start building
    iPhone apps. I''d recommend borrowing a Macbook from a friend if you can for a
    week or so, and if you you enjoy the app-making process consider investing in
    an Apple laptop yourself. Alternatively, you can jump to the next section, Android
    app development, which can be done on any platform – Windows, Mac or Linux.


    # What is an app?


    This may seem like a rather stupid question, but it''s worth being clear how an
    app is different from a website. As we''ve seen, a website is stored on a server,
    and is then downloaded by your computer or phone and displayed in'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'browser. An app is different, in that the code for the app is stored on your
    device, meaning that it can run completely offline.


    Having said that, apps often have an online component, enabling them to provide
    services such as messaging or getting information like weather updates.


    So while websites are stored on servers and are downloaded to the users'' device,
    apps are stored on the device themselves. This is close to the original software
    model where all our software was stored locally on our computer.


    In this section we''ll be making apps for iOS, which is the Operating System that
    runs on iPhones and iPads.


    # Getting started: downloading Xcode


    Making an app is often seen as a mysterious process that only expert coders can
    do, but it''s actually very simple. All you need to an iPhone (or iPad) app is
    a Mac, and a copy of Xcode, a free piece of software made by Apple.


    To download Xcode, go to https://developer.apple.com/download/. You''ll need to
    create an Apple developer account if you don''t already have one, but this is
    completely free and requires you to enter your email address and a few other details.


    Once you''ve logged in, download the latest version of Xcode. It''s a big file
    (around 4GB), so depending on your internet connection you might want to go and
    have a cup of tea while you wait.


    When it''s downloaded, simply click on the downloaded file to start the installation
    process. This normally takes several minutes, and when it''s you should be presented
    with a startup screen (if you don''t see a screen that asks you choose a template
    for your app, open up the Xcode application and click File → New → Project in
    the menu at the top left of the screen).


    # The app setup process


    We will be presented with four screens, which allow us to choose options for our
    app. In the first screen (above), we get to pick from several templates for our
    app. Make sure iOS is selected underneath ''Choose a template for your new project''
    and select ''Single View Application''. This will create an app with a single
    blank page (known in app development as a ''view'') for us to edit.


    You can see other app templates, such as Game and Master-Detail Application. Feel
    free to try them out and run them to see what they do, but we''ll be sticking
    with the Single View Application here.'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# Building an app for iPhone or iPad


    Click Next, and you''ll see the options screen:


    +   - First, fill in the Product Name – you can put anything you like here, but
    I’d recommend something like ‘Demo App’


    +   - Under Organization Name, you can put either your company or your own name.


    +   - The Organization Identifier is like a domain name in reverse – choose something
    like com.yourname.


    +   - The name and identifier are only used if you submit your app to the app
    store, so you can really choose anything you want at this point.


    All the other settings can be left to their defaults. We’re using the Swift language
    and developing for an iPhone.


    Click Next and you’ll be asked where to save your project, so choose a suitable
    location, such as your Documents folder, and click Create.


    After a few moments, you’ll see the Xcode interface, and your app will have been
    created – congratulations!


    # The Xcode interface


    This is our basic Xcode screen, and it’s worth taking a few moments to familiarize
    yourself with it.


    Underneath the usual File, Edit… menu we have the top bar, with a ‘Play’ button
    at the top left, which will allow us to run our app. Give it a try. After 30 seconds
    or so, you will see a small blank screen pop up. Not the most exciting app in
    the world – it’s just a blank screen – but it’s a start. The simulator, which
    enables us to try out our app without a real iPhone.


    You can actually use it just like an iPhone – clicking Hardware Home, and you’ll
    see the familiar iPhone home screen and can interact with it just as you would
    a normal phone. Have a play around it, and then come back to the tour.


    At the right of the top bar there are several buttons which we can use to customize
    the interface:


    +   - The interlinked circles button displays the Assistant Editor, which gives
    us two editing windows to work with (this will be very useful later on).


    +   - The three blue rectangles on the right allow us to toggle the left, bottom
    and right panes. Try them out!


    +   - The double arrow displays the Version editor, which we won’t be using here.'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# In practice


    On to the main part of the screen:


    +   - The left pane shows a list of the files that make up our app. We''ll be
    looking at those in more detail shortly.

    - The central window is where we''ll be doing most of our work. At the moment
    it is displaying some settings for our app, but we''ll also use it to edit files
    and drag and drop buttons and labels on our app.

    - The right pane is context-sensitive: it displays different information depending
    on what we have selected. At the moment we don''t have anything selected, so it
    doesn''t display anything, but we will be using it a lot as we create our user
    interface.


    Finally, if you run the app in the simulator, you''ll see the console at the bottom
    of the screen, and it may have some information about your app in it.

