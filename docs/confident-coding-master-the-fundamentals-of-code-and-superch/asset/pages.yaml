- img_proc: true
  md: '# # Using coding to enhance your career


    So far, we have spent most of this book learning to build websites and apps. I
    hope you have enjoyed learning these skills, but it is likely that you still have
    your day job, and might be wondering how knowing to code might benefit you within
    your current role. This is what we will be considering in this chapter, and by
    the end of it you should have at least one way in which you can future-proof your
    career using your newfound talents.


    Many employers are desperate for increased digital literacy among their staff.
    We live in a world dominated by software, but only a minority understand how it
    works. This has created a skills gap in companies in all sectors are increasingly
    desperate to employ highly technical candidates. This means that even if you don''t
    intend to change careers, completing coding-related projects and activities is
    a great boost for your employability and gives potential employers reasons to
    hire you. You should always put your coding skills on your CV, stating what languages
    you have knowledge of, how you works you are able to put them into practice, what
    level you are at, and listing any websites, apps or projects you have worked on.
    Discussing your coding achievements can also be an excellent way to impress at
    an interview if you''re looking for a brand new job. If you want to stand out
    in your current role, mentioning your abilities to your manager during a catch-up
    or offering your coding skills to a project will help you succeed at making an
    impression.


    All of the suggestions in this chapter will boost your career prospects by developing
    and demonstrating your technical abilities. Not all of the suggestions in this
    chapter will necessarily apply to your role or sector, but you''ll be surprised
    by how far a little creative thinking (combined with the coding skills you have
    learned so far) can take you.


    We will start by considering whether you could create an app for the company you
    work for, and what that app might look like. Next we''ll look'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'at the process of starting a blog, and why it is likely you would benefit from
    having one, regardless of the industry you are working in. We''ll look at a number
    of ways you can automate or streamline processes in your daily workflow, using
    tools such as If This Then That, Text Expansion, AppleScript and Powershell.


    # Creating an app for your business


    Regardless of the type of company you work for, it is likely that there is a process
    that could be done better if there was an app created specifically for it. As
    a teacher, I created a simple app to manage house points. Staff could give students
    a house point instantly, and students could see straight away which had the most
    points. What app could you build that make you or your colleague''s work lives
    better? (Note – you could probably build a website to do the same job, but I find
    people get more excited about apps than websites!)


    Building an app for your company is a great way to learn the complete app development
    cycle without having to come up with a ground-breaking idea. You can be sure that
    at least someone will use your app, and with any luck you''ll get some kudos for
    creating it. You might even find yourself becoming the digital guru in your office!


    Simple app ideas might include:


    +   An ''onboarding'' app that tells new employees basic information how things
    work at your office.


    +   An ''important information'' app containing useful phone numbers, email addresses
    and other information that all employees would find.


    +   An app that displays information about the business, such as sales figures,
    circulation or progress towards certain goals.


    The most important thing about your first business-focused app (as with any app)
    is to keep it simple. Make sure it does one thing well rather than trying to solve
    all the problems your company has in one go.


    To give a real-life example, John Williams is a fireman based in the United Kingdom.
    He realized that in the training of his colleagues there were various tests that
    needed to be completed, but no centralized system keeping track of who had successfully
    completed each test. Moreover, fire stations in different districts used different
    processes. He created a system for his district so that someone could not only
    take the tests online, but a'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Using coding to enhance your career


    supervisor could keep track of which tests each of the firemen had passed, and
    thus knew to put them forward for the official exam.


    Since creating the app, John has been approached by a number of nearby districts
    to use the apps themselves. It''s early days yet, but it could become a very useful
    teaching and learning tool, built by fire stations throughout the United Kingdom.


    Creating an app for yourself or your colleagues allows you to ''scratch your own
    itch'', solve a problem that you know exists for at least small number of people
    because you have that problem yourself. You''ll also get quick feedback (good
    and bad!) from your colleagues, and there is always the possibility your app will
    grow into something bigger than you could imagine.


    # Starting a blog


    In the world of Facebook and Twitter, writing a blog might feel a little old fashioned.
    You can certainly develop a following on social media (and we''ll look at how
    to do more effectively later in this chapter), but running your own blog has a
    few unique advantages. Firstly, the sheer fact setting up a blog is more difficult
    than creating a Facebook or Twitter account shows that you are serious. It is
    a way of telling the world that you have something to say, and that you are dedicated
    enough to regularly create content that people enjoy.


    Secondly, as it is your blog, you have complete control over your content. You
    are not limited as you are with social networks in how content will be displayed,
    or who can view it.


    Thirdly, and most importantly, there is the google effect. Increasingly, regardless
    of your industry, potential employers will use search engines to find out about
    job applicants. If you run and update a blog that will almost certainly become
    the top search result when people search for you. That''s a pretty impressive
    thing for a potential employer to see.


    Fourth, owning your domain name is increasingly useful. As we have seen, a domain
    name is a web address, like google.com. Owning robber-.co.uk has been very useful
    for me, and I would thoroughly recommend that you stop reading now and to purchase
    your name. If you have a common name, you might need to try alternative domain
    extensions as .me, .blog, or you can get creative like the blogger John Gruber
    did when he set up his blog at daringfireball.com (which you''ll hear more detail
    about later in this chapter).'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# Future-proofing your career with coding


    Fifth, you can use your blog to build a community and position yourself as an
    authority figure. If you write useful and challenging content, you will start
    to build a following of like-minded people who are interested in what you do.
    By encouraging them to post comments on your articles, you can get to know these
    people, and form a community with you at the centre. This is a very powerful tool,
    and a whole range of opportunities might develop from it.


    Finally, once you have built up an audience, if you wish to monetize the blog
    itself, by offering subscriptions for special content, recommending products,
    or using the platform to launch your next big business idea.


    There are countless other benefits from writing a blog. You will be forced to
    write clearly and coherently, expressing your ideas eloquently and in an entertaining
    way. This is a rare and valuable skill across all industries. It will clarify
    your thinking and your ideas. It will build your confidence as you write more
    and your audience grows. It can help bring attention to causes that you care about,
    and even change public policy. It will bring in new experiences, with new people,
    and develop your technical and marketing skills. And, of course, you will help
    people by sharing your knowledge, experiences or simply entertaining them.


    # Choosing a topic


    At this point, you''re probably thinking ''I don''t have anything to write about.''
    That''s not true. You may not feel particularly unique, but you are the only people
    in the world with your set of experiences, skills and hobbies. I would be very
    surprised if there wasn''t something that you care about, know more than most
    people, and would like to share with the world.


    If you''re not sure what you might write about, grab a pen and a blank piece of
    paper. Write down 20 topics that you are interested in. These might be hobbies,
    styles of music or art, regions of the world, sport, issues related to your job,
    charitable or political causes, technology, or anything else. Think about which
    topics you would like to be written about, and which one you might be in a particularly
    good position to discuss. The best blog writing is informed and passionate, but
    those who set up successful blogs are rarely great authorities on their subject.
    They are just normal people who commit to creating quality content regularly.


    If you''re still not sure what you might write about, you might just choose to
    be very honest about your job, sharing what it is day to day to be an accountant,
    teacher or airline pilot. Or you could take up a completely new'
