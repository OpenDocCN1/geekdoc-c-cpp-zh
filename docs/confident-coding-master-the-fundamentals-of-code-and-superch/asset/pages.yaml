- img_proc: true
  md: 'with websites themselves. Most of the actual running of the webapp is done
    on the server, and the browser just displays the output (a list of the user''s
    emails, or pictures of the user''s cat for example).


    The great advantage of working in this way is speed of development. On my BBC
    Microcomputer, if I wanted an updated piece of software I had to go and get the
    disc for it, and put it in my machine. Now, conversely, if Google want to update
    the Gmail interface, or if you want to edit your blog, a quick change on the server
    and the website is updated immediately for all its users around the world.


    Even traditional desktop software such as word processors and image editors are
    starting to find homes on the web and some computers, such as Chromebooks, are
    little more than browsers and an internet connection.


    So how do we take advantage of this phenomenon? We know how to write HTML code,
    now we know how to share our code with the world. It''s actually pretty simple,
    and requires two things: a domain name, and some web hosting.


    # What is a domain name, and how do I get one?


    A domain name is simply a web address, like facebook.com or bcc.co.uk. Each country''s
    domain names are managed by a central ‘registrar’, and domain names can be bought
    from a number of different providers.


    When you buy a domain name, you''re actually renting it, with the average cost
    being around £10 per year. Once you have bought it, you have the right to renew
    it each year, but if you leave it unrenewed, you will eventually return to the
    public ‘post’ and someone else can buy it.


    A quick web search for ‘buy domain name’ will turn up several results, so do a
    bit of research and choose a provider that suits you. Ideally check reviews and
    not decide completely on price – a cheap domain name might come with nasty fees,
    for example to transfer it elsewhere.


    Choosing a domain name can be difficult, as most of the good ones are already
    gone. Domain names are much a matter of personal preference, but I would recommend
    the following:


    +   * Get a .com or a country-specific domain (like .co.uk) if at all possible.
    Even if it is not an ideal domain name, it will be more memorable and trustworthy
    than a more obscure extension such as .boats or .black.

    * Make it easy to type. Avoid mis-spellings like Xpress (unless they are part
    of your brand of course!)'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'Use keywords. If you want to rank highly in search engines, putting your search
    terms in your domain name is a great start. If you are starting a blog about cocker
    spaniels for example, cockerspanielsblog.com wouldn’t be a bad choice (and at
    the time of writing this book, is available!).


    If you’re struggling to find ideas, these sites might help:


    +   - www.domainsbot.com/ – will search a range domain domains and tell you are
    available.

    - www.namemesh.com/ – will combine two or three words and show you a range of
    available domain names.

    - www.panabee.com/ – will suggest company names and domain names based on your
    keywords.


    Once you have decided on a domain name, you can purchase it (I’d probably start
    with just one year, unless you’re feeling confident!) with your chosen provider,
    and move on to the second requirement: web hosting.


    # What is web hosting, and how do I get it?


    When a user visits your website, the files are downloaded from a server and displayed
    in the user’s browser. If you have a more advanced site that allows interaction
    with the user (such as a login or search box), the server will also run the code
    to provide the user with the data they need. You may also use other features associated
    with a domain name, such as personalized email addresses. Web hosting is the server
    space and computational power that manages all of this for.


    There are several different options of web hosting, depending on how much you
    want to pay, ease of use, and how much control you want over the content and layout
    of your site. We will look at the two main options for those starting out: website
    builders and shared hosting.


    # Website builders


    Website builders are the simplest and quickest way to get a website up and running.
    Once you sign up with a company, you can choose from a range of templates and
    styles, and edit your site in a drag-and-drop interface.


    Website builders range from $7 to $20 per month, depending on features, and even
    give you the ability to create an online store, blog or portfolio in just a few
    clicks.


    However, there are a few major drawbacks to using these sites. First, you don’t
    own your content. If you decide you want to move to another provider'
  merge: -1
  pgno: 157
- img_proc: true
  md: '(perhaps because you need a feature that your chosen website builder doesn''t
    support), you will have to recreate your website from scratch. Also, your ability
    to customize your website is often limited to what the website builder provides–
    you don''t have the freedom to write your own code to make your site do exactly
    what you want. And as a coder, you''ll definitely want that freedom.


    For those reasons, website builders are great for getting a site up and running
    very quickly, but I wouldn''t recommend them for a serious site that you want
    to own and customize your heart’s content. That method is what we will be focusing
    on for the rest of this section.


    Nonetheless, if you''d like to try a website builder, some of the most popular
    providers are:


    +   - www.weebly.com/

    - www.wix.com/

    - www.squarespace.com/

    - www.shopify.com/


    # Shared hosting


    If you''re just starting out with a small site, and want more freedom and ownership
    over website builders provide, shared hosting is probably the best solution for
    you. To have a website, you need a hosting account with a provider to contain
    your website files, emails and databases. Shared hosting is when several different
    hosting accounts are stored on a single server. This is a very efficient way of
    hosting websites, and as a result it is extremely cheap. Expect to pay around
    $4–10 per month for a hosting package.


    The big advantage of shared hosting over website builders is that you completely
    own your content– you can download your site from the server and switch to another
    provider if you wish. You also have complete control of the code for your site,
    so what your site can do is limited only by your imagination.


    With domain names, a quick web search for ‘web hosting’ will turn up a huge range
    of websites, and the choice can be confusing. Here are a few tips to help you
    choose the right provider:


    +   - Test your support. Send them a couple of quick questions before you sign
    up, such as ‘How many email addresses do I get with the Starter package’, and
    see how quickly they come back to you.


    +   - Check reviews on sites like trustpilot.com.


    +   - Know your needs– if you''re planning on building a small site, you likely
    will need something like this:'
  merge: -1
  pgno: 158
- img_proc: true
  md: '500MB workspace (this is hard drive space to store your website files)


    1GB bandwidth (this is the amount of content that is transferred from the server
    to your users'' computers)


    1–5 email addresses


    one-click-installs for commonly used software such as Wordpress (we’ll learn about
    Wordpress in a moment).


    +   Avoid going on price alone – you will almost certainly need some support,
    and you’ll want fast, reliable hardware. You’re unlikely to get those with the
    cheapest providers.


    A final thought – you will likely be able to buy a domain name and web hosting
    from the same provider. This can be very convenient as you will have everything
    in one place. However, some people like to use different providers so if they
    have problems with the web host, for example, that does not affect their domain
    names. It’s a personal decision, but I would recommend using different providers
    to avoid having all your eggs in one basket.


    # I’ve got my web hosting, now what?


    Hopefully by now you’re clear on what you need, and perhaps have even purchased
    a domain name and set up your web hosting. What now?


    First, it’s worth checking if your web hosting provider has any getting started
    guides. These will introduce you to their control panel, and show you how to do
    basic things as setting up email addresses and uploading files. The instructions
    for this will vary between providers, so I won’t go through those here.


    Once you have your web hosting, however, you have two main options for getting
    your site up and running: hand-coding or using a content management system.


    # Content management systems


    A content management system (CMS) is a piece of software that you install on your
    web hosting to allow you to customize and manage your website. It’s a bit like
    having a website builder, but you still own all of the content.'
  merge: -1
  pgno: 159
- img_proc: true
  md: 'By far the most popular content management system is WordPress. It was developed
    as a blogging platform in 2003, but now forms the CMS for over 25 cent of all
    websites – that’s a lot of websites.


    Because it is so widely used, WordPress has a huge range of themes and plugins
    available for it, many of them. It’s also completely free and open source, you
    you can edit the code of your site as much as you need to. I’ve built many Wordpress
    sites myself, and would thoroughly recommend it to build almost any site.


    # Getting started with Wordpress


    There is not room in this book for a full Wordpress tutorial, but the-ing steps
    should be enough to get you started.


    # 1. One click install


    Your web hosting provider should have an icon in your control panel which will
    allow you to install WordPress very easily. If you can’t find it, contact them
    and ask for instructions.


    Once Wordpress is installed, you’ll be taken to the Wordpress Dashboard. This
    is where you can create and edit pages for your site, as well as write blog posts,
    if you are using your site as a blog. You can also manage other aspect of your
    site from here. Try clicking around the left-hand menu, and you’ll quickly see
    how to make changes and add and manage website content.


    If you hover over the ‘home’ icon in the top left of the screen and click ‘Visit
    Site’ you’ll see the default website that you have created. It will look something
    like this (7.1):


    ![](img/57532e13229b6da209b2a527acf10e32_160_0.png)'
  merge: -1
  pgno: 160
- img_proc: true
  md: 'Nothing much to look at right now. So probably the first change you will want
    to make is to install a theme to improve the look of your site.


    # 2. Choosing a theme


    Wordpress has a huge range of free themes available. You can view and search them
    within your dashboard by clicking Appearance -> Themes -> Add New. When you find
    one you like, just click Install and Activate, and then reload your site to see
    the theme in action. Note that your site probably won''t look exactly like the
    theme image — you''ll have to add the content, and perhaps change some settings
    in the Customiser (Appearance -> Customise).


    Sometimes, however a free theme won''t provide the quality look you are going
    for. In that case, it''s well worth purchasing a premium theme. Generally, premium
    themes offer a better, more flexible design, as well as direct support if you
    have any problems with the theme. For $30–60, it can be a very sensible investment.
    Some of the most popular sites for finding premium themes are:


    +   - https://themeforest.net/category/wordpress

    - www.thecircle.net/

    - www.templatemonster.com/wordpress-themes.php

    - www.elegantthemes.com/


    Once you have installed your theme and are happy with it, check out the Customiser
    to make it perfect for your site, and then start adding content.


    # 3. Using plugins


    Another great advantage of using Wordpress is that if there is any extra functionality
    you want for your site, there is almost certainly a plugin available to do it,
    and most of them are completely free.


    You can add a new plugin by clicking Plugins -> Add New and search for a plugin
    that does what you want. The plugin search doesn''t always return the best results,
    so I normally do a Google search for ''Wordpress plugin [what I want the plugin
    to do]'', and once I have chosen a plugin I search for it by name in the Dashboard.


    Plugins allow you to add simple things such as contact forms and Google maps to
    your sites, as well as transforming your site into a social network, or an ecommerce
    platform, so they are well worth investigating.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Self-coding your site


    You might be wondering why I''ve left the option of building a website from scratch
    until last, especially in a book like this. It''s simply because if you want to
    get a website up and running quickly, usually the best way to do that is to use
    some kind of CMS, such as Wordpress.


    Having said that, if you want to avoid the setup and complications that come with
    a CMS you might well want to build your site from scratch. This will give you
    complete control over the site content, as well as teaching how websites function
    from the ground up.


    So we''ll start by uploading a very simple site, adding some HTML to it, and finally
    we''ll see how to use a framework such as Bootstrap to make our website look great
    on a range of screen sizes (this is known as building a responsive website).


    # Editing the index.html file for your site


    Your web hosting control panel should include a File Manager, allowing you to
    access and edit your files. Access the File Manager, and find a folder with a
    name like ‘public_html’. This is where your website files should be stored (if
    you have problems finding the folder, contact your web hosting provider).


    Once you have found the public website folder, look for a file called index.html.
    If it''s not there, create it in the File Manager. Then edit it (again, you should
    be able to do this in the File Manager).


    Add the following code:


    ```

    <h1>Hello World</h1>

    ```


    Then save the file and open up your domain name in a browser. You should see something
    like this out (7.2):


    ![](img/57532e13229b6da209b2a527acf10e32_162_0.png)


    Hello World


    Hurrah! Your HTML page is now available for all the world to see. Of course, you
    can now use any of the HTML, CSS and JavaScript that you have learned and put
    it in that file to customize your webpage.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# Using FTP to manage your website files


    You might be thinking that building a complex site by typing code into a File
    Manager would be a bit of a hassle, and you''d quite right. Every time you want
    to edit your site, you''d have to log in to your control panel, open the File
    Manager, find the file, open the edit window and get to work.


    A better way to interact with your files is via FTP, or File Transfer Protocol.
    FTP allows you to connect to your website files and upload, download and edit
    files directly. It''s much more convenient than using a File Manager.


    You should be able to get your FTP settings from your web hosting provider, and
    once you have them, all you need is an FTP program. There are several free options,
    including:


    +   - https://filezilla-project.org/ – Windows, Mac and Linux.

    - www.smartartftp.com/ – Windows only.

    - www.coreftp.com/ – Windows only.

    - https://cyberduck.io/ – Mac only.


    However, my FTP program of choice is FileFTP, which is an addon for the Mozilla
    Firefox browser. It works on any platform, and is very easy to use. To get it,
    you''ll need to first download Firefox at www.firefox.com and then download FTP
    from http://fileftp.net/


    Once those are installed, you''ll need to enter your FTP login details, click
    OK and then click Connect. If all goes well (and you can contact your web hosting
    provider if it doesn''t) you''ll see a list of the files on your server, and you
    can navigate to the public_html folder to see your website files.


    Once you see the index.html file, you can right-click on it and select ''Open''
    to edit it directly in your text editor.


    Alternatively, you can download it to your computer, edit it there, and upload
    it again again when you are finished.


    # Using a web framework


    You have probably noticed that the websites we''ve built so far have not been
    beautiful. We focused primarily on the content, and let the browser choose how
    to display it. This leaves us with webpages that are functional, but look like
    they were built in the 90s.


    If you are a great designer, you can customize the look of your site to your heart''s
    content. However, for most of us, a quick solution to this is to use a web framework,
    which is essentially a collection of CSS and JavaScript which make our websites
    look better.'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'Frameworks also allow our website to be responsive, that is to adjust itself
    differently on different screen sizes and the code that is very important as over
    half of all web browsing is now done from mobile devices. We’ll see how that works
    in a moment.


    There are a number of frameworks available, including:


    +   - http://foundation.zurb.com/

    - firezenk.github.io/zimit/

    - http://ink.sapo.pt/

    - www.99lime.com/elements/


    Feel free to check out the sites to what they offer, but we’ll be focusing on
    the most popular web framework, Bootstrap.


    Bootstrap was built by two Twitter employees, but has since taken on a life of
    its own, with over 15 per of the top websites currently using it. You can see
    it in action at http://getbootstrap.com.


    Setup instructions for bootstrap are at http://getbootstrap.com/getting-started/,
    but the quickest way to get started is to copy the code at http://robpercival.co.uk/bootstrap.html
    to your index.html file and see it in action.


    The demo page looks like this (7.3):


    ![](img/57532e13229b6da209b2a527acf10e32_164_0.png)


    Rather nicer than our plain HTML pages. All of the standard HTML features such
    as, buttons, and even plain text look more attractive and are easier to work with
    than before.


    If you look through the HTML of the page, you will see that there are links to
    the Bootstrap CSS in the header, and then some JavaScript at the bottom of the
    code, which is what creates the look and layout of the page.'
  merge: -1
