  md: "```\nfunction isPrime(x) {\n  for (var i=2;i<num; i++)){if(x%i == 0) { return\
    \ false; }\n} return true;\n}\n\nfunction isPrime(numberToCheck) {\n  // Loop\
    \ through all numbers less than numberToCheck\n\n  for (var divisor = 2; divisor\
    \ < numberToCheck;\n      divisor++ ) {\n    if ( numberToCheck % divisor == 0\
    \ ) {\n      // If divisor divides numberToCheck exactly,\n      numberToCheck\
