    # Making a toast


    OK. We have now created the method that will run when the button is clicked. Don’t
    worry – we’re nearly done. We just need to write some code inside that method.
    We’re going to create what is known as a ''toast'' – a small piece of text that
    will display at the bottom of the phone screen for a small period of time. (It
    is called a ''toast'' because it pops up like toast from a toaster).\ To do that,
    adding the following code to the buttonClicked method:


    ```

    Toast.makeText("Hi there!", Toast.LENGTH_SHORT).show();

    ```


    Hint: when you start typing ''Toast'', you will see a drop-down like this (9.5):


    ![](img/57532e13229b6da209b2a527acf10e32_196_0.png)


    Press Enter when ''Create a new Toast'' is selected, and it will auto-fill most
    of the code for you. Nice!


    This code creates a new toast with the text ''Hi there!''. LENGTH_SHORT refers
    to the amount of time the toast stays on the screen (you can change it to LENGTH_LONG
    if you want the toast to stay longer).


    Note: What is ''this''? The ''this'' in the toast command refers to the activity
    that we are currently in, in MainActivity. This is the context that the toast
    will appear in.


