  md: '# Coding and entrepreneurship


    One of the most exciting things about learning to code is that it enables you
    to create your own business, product or service, and allow people around the world
    to access it immediately. This is something that has only been possible in the
    last 20 years or so, and has brought the cost of starting a business down to close
    to zero.


    We''ve already seen how to create and host a website, and how to build apps for
    Android and iOS. In this section I will walk you through the process of starting
    an online business using your newfound skills. As always, this section is practical,
    keep a pen and paper handy to jot down ideas and business plans as you read through
    this chapter.


    Aim to come up with and test at least one business idea by the end of the section.
    You might not become the next Mark Zuckerberg or Bill Gates, but at least you
    should be able to build a second income stream, and you''ll certainly have a lot
    of fun, and learn a great deal, along the way.


    We will begin by seeing how you can generate business ideas, and where the best
    ideas come from. We will then go on to see how you validate and hone your ideas,
    making sure that the one you choose is most likely to succeed. Finally we''ll
    look at creating your initial product, getting it to customers, and pricing.


    # What''s your coding got to do with entrepreneurship?


    Many of the examples and suggestions below have little to do with coding, so you
    might be wondering why you would need to code at all to start a business. The
    answer is of course that you can start a business without learning to code, but
    being able to code makes the whole process so much easier.


    Not only do you have a better understanding of how the websites and services are,
    enabling you to use them more effectively, but if you cannot code you will constantly
    come up against frustrating'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# Future-proofing your career with coding


    challenges. If your business needs a website, you can just create it rather than
    paying someone else, or paying for a hosted service. If your business needs an
    app, or a mailing list, or an automated process, you can just build it, which
    is extremely liberating.


    Even if you decide not to build your own website or app, knowing the basics of
    coding means you''ll be able to communicate effectively with whomever doing so,
    resulting in a much better, and likely cheaper, outcome.


    # Getting ideas


    Every great business starts with an idea. Ideas can come from anywhere, but in
    my experience the most reliably successful way to choose an idea is to choose
    a niche that you are already familiar with. Scratch your own itch is a phrase
    we have seen before, and if something is a pain-point for you, it is likely for
    a number of other people as well.


    For example, if you are a yoga instructor and find it difficult because there
    is no central portal where people can search for and rate different yoga instructors,
    perhaps creating that portal would be a good idea.


    Or perhaps you are a plumber who finds the process of invoicing and arranging
    payments from your clients a hassle. Specifically designed for plumbers, would
    an automated service, be useful to you? If so, it would likely be to many others
    as well.


    Don''t worry about a niche appearing too small – once you have developed ''traction''
    (a number of people are actively using your service), there are almost always
    possibilities for expanding into related fields. The yoga portal could grow to
    support any sporting activity, and the plumbing invoicing service could be applied
    to a range of domains.


    Hopefully a few ideas are already popping into your head, so let''s take a moment
    to choose ideas even more effectively. While it is important (although not crucial)
    that you have special knowledge or experience in the niche, there are two other
    factors that would substantially affect your chances of success.


    The first is whether you have particular skills that will help you to succeed
    with a particular idea where others would not. You should ask yourself what special
    skills do I have that mean that I can build this business better than anyone else?
    By this I don''t mean that you have finely honed business instincts, but that
    your capabilities match those required for that particular business. If your idea
    is going to require a lot of public speaking, and the thought of doing that terrifies
    you, you might not be best placed to'
