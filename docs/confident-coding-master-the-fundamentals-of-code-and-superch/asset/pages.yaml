  md: '# Building an app 09 for Android


    With over 85 cent of the smartphone market (as of 2016), Android is by far the
    biggest mobile platform. It is also the one that requires the least investment,
    as apps can be built using Windows, Mac or Linux. In this chapter we''ll go through
    the process of creating a simple Android app, much in the same way we did with
    the iPhone app in the previous chapter.


    While iOS development uses Apple''s own language, Swift, Android development uses
    Java (a very different language to JavaScript, used primarily in web development).
    Java is a great language to learn as it is used in a huge range of platforms,
    including web apps, Windows and Mac programs, scientific applications and Internet
    Of Things devices.


    We will start by downloading Android Studio, which is the equivalent of Xcode
    for Android development. It is built by Google, it is completely free, and is
    the only software we need to make Android apps. It''s not quite as user-friendly
    as Xcode, and can be quite slow, but it is also more flexible, and has features
    such as Instant Run, which allow you to test your apps on the simulator without
    recompiling them.


    Once we''ve downloaded Android Studio, we''ll take a tour of the interface and
    run a Hello World app. Then we''ll add labels and buttons, build in some interactivity
    and finally make a simple app Cat Years. Without further ado then, let''s get
    started.


    # Downloading and setting up Android studio


    The main Android developer site is at developer.android.com - it is well worth
    clicking through and reading some of the introductory guides to learn about Android
    features and style guides for developers. Once you''ve done that, you can download
    Android Studio at developer.android.com/studio.


    On that page click the big green download button, agree to the Terms and Conditions
    and you''re good to go. It installs like any other piece of'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'software, and since Android Studio 2.2 you no longer need to download Java
    separately (which makes life much easier!).


    Once you have installed Android Studio, run it and you’ll likely be prompted to
    install various updates. My advice would be to choose all the default options,
    keep pressing Next and let the software do its thing. After a few minutes you
    should see the ‘welcome to Android Studio’ screen.


    Click ‘Start a new Android Studio project’ and you’ll see the ‘Configure Your
    New Project’ screen:


    +   - The ‘Application name’ can be anything you like – try something like ‘My
    First App’.


    +   - The ‘Company Domain’ is similar to a normal domain name, such as google.com,
    but you don’t have to actually own the domain name. So you can use rob.percival.com,
    or yourcompanyname.com. It doesn’t matter what you use now, but if you submit
    your app to Google Play, the Company Domain will become part of the unique Package
    ID for your app, so you might want to use something that represents your name
    or your company name.


    +   - You can change the Project location if you wish, or leave it as the default
    – this is where the project files will be stored.


    Click Next and you’ll see the ‘Form Factors’ screen, where you can choose devices
    your app will support, including phones, tablets, Android Wear, TV and more.


    We are only covering Phone and Tablet in this introduction, so make sure only
    that option is selected for now. You’ll notice that you can choose the oldest
    version of Android you would like to support. The older version you choose, the
    more devices you will be able to support, but you will lose access to some of
    the latest features.


    My advice would be to choose the default version (in my case Ice Cream Sandwich)
    – this usually provides a good balance of modern features and large device support.


    Next, you’ll see this screen with a ‘default activity’. An ‘activity’ in Android
    development is allows you to choose a single screen within our app. It is like
    a page on a website, within a single app we might have a login activity, an activity
    which shows a list of users and perhaps a settings activity.


    Here we have several activity templates that we can choose from, which are useful
    in a number of cases, but we’ll start with the simplest (and default) – the Empty
    Activity. Select that one and click Next.'
  merge: -1
  pgno: 189
- img_proc: true
  md: 'This takes us to the last setup screen. Here we just choose the name of our
    initial activity, the default being Main Activity. I would recommend leaving this
    as the default and clicking Finish.


    And you''re done. After a few seconds to create your app, you should see the main
    Android Studio interface.


    It doesn''t look particularly friendly, but we can break it down into three main
    parts:


    +   * The top bar has the usual, save, open, copy, paste menu options, as well
    as the green ''play'' triangle which you will use to run your app.


    +   * The left pane shows the file structure within your app.


    +   * The main window shows the contents of the file we are currently editing,
    in this case the MainActivity Java file.


    The other buttons and menus we can ignore for now – we''ll use some of them later
    but most you will only need it if you''re doing some advanced Android development.


    That''s the setup complete – before we start customizing our app we''ll quickly
    run through the process of running an app on an Android Virtual Device (AVD).


    # Running your first Android app


    Running your app is simple – just press the green ''play'' button in the menu
    bar.


    You''ll be prompted to create a Virtual Device, and you can choose from a selection
    of different phones and tablets. You can choose whichever you like – I will stick
    with the default, the Nexus 5.


    Next, you can choose to install any version of Android on your virtual device.


    Unless you particularly want a particular version, I would recommend using the
    default, in my case Lollipop.


    Finally, you can give your device a name, and choose some advanced options, such
    as whether the device starts in portrait or landscape orientation. I would recommend
    keeping to the default options for now.


    Congratulations, you''re done! Select that device, click Run and the device will
    start up and eventually (around 2–5 minutes depending on your machine) display
    your app in the Android Emulator.


    You''ve run your first Android app but, of course, it doesn''t do much yet, so
    let''s see how to customize the UI (user interface) of our app.'
