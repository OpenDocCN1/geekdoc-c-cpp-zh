  md: '# Debugging Java in Android studio


    Android Studio’s debugging tools are similar to Xcode’s. There is automated error
    checking, to show you syntax errors and warnings (10.6):


    ```

    int age = Integer.parseInt(age);

    ```


    You need to look quite carefully as the red wiggly underscore is often not immediately
    obvious. There is also a red line on the right hand side of the editing window,
    and if you hover over either the underscore or the line, you’ll be given the error
    message (10.7):


    ```

    * expected> —

    ```


    If you run some code which has errors in it, you’ll see errors appear in the logs
    as with Xcode. There is also the facility to write messages in the logs, similar
    to console.log and print. To do that, use the Log command, like this:


    ```

    Log.i("Message", "The log command was run");

    ```


    Each log command has a title (in this case ‘Message’) and content (‘The log command
    was run’). The ‘i’ in Log.i is short for information, and the command allows you
    to use different letters for different log types, the most common of which are:


    +   - D – Debug.

    - I – Info.

    - W – Warning.

    - E – Error.


    # Summary


    We have now gone through all the major debugging techniques, and seen a range
    of tools to debug code on a variety of platforms. We’ve also seen how to write
    good code, to minimize the amount of time we spend debugging.


    Debugging is a necessary process for any programmer, but done right it can be
    a learning experience in itself. The most important thing is to approach debugging
    calmly and methodically, and try to avoid letting the bugs stress you out!'
