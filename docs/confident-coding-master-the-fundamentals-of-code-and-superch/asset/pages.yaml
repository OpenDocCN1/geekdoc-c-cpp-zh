    are any disagreements, it is up to the freelancer to establish whether

    the work has been done and release the payment.

    - Beware of buyers with no reviews. Buyers have reviews too, and if a

    buy has no reviews, be careful. They may well be reliable, but they may

    not be – in this case it is particularly important to make sure the require-\ments
    of the job are clear, and that a milestone is paid before you start

    work.


    Why not started now? Take a couple of hours and create a profile on the

    relance site of your choice. Start bidding on simple projects, making sure

    to keep your price low and your communication fast and clear. I wouldn’t be

    sprised if you had your first gig by the end of the day. Good luck!


    # Building a portfolio


    As a developer, your portfolio website will likely be more important than

    your CV. Your site should make clear what your strengths are as a developer,

    and showcase some of your best work. It should make potential clients and

    employers excited to work with you.


    Your website should reflect your style and personality, so if possible

    create from scratch. If you prefer, however, there are a range of WordPress

    themes you can use to create a great-looking portfolio quickly. It is

    important that your portfolio site looks good, so I would advise spending

    $50 or so on a theme from templatemonster.com or themforest.com/

    category/wordpress/creative/portfolio and www.templatemonster.com/

    portfolio-wordpress-themes.


    Take some time to browse some of the best developers’ portfolio sites,

    and include their features. Project Stories are particularly useful to

    potential clients and employers. In a Project Story you explain the clients’

    needs, how you met them, and what technologies you used to achieve their

    goals. Combined with a screenshot or a link to the project itself, and a testi-

    monial from the client, this can be a very powerful way to show your level

    of experience and competence, as well as your ability to explain your work

    clearly.'
  merge: -1
