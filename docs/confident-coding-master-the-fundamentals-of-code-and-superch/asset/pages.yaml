  md: "# Building an app for iPhone or iPad\n\nYou are probably wondering why we need\
    \ an ! after textField.text. Swift has a variable type known as an 'optional',\
    \ which is a variable which could contain a null value. For example, if I created\
    \ a variable like this: \n\n```\nvar number:Int\n```\n\nThis would create a variable\
    \ called 'number' which would be an integer, but because I haven't set a value\
    \ forit yet it has a 'null value' and is an optional. If I try to use it it has\
    \ a null value this will cause my app to crash.\n\nIf you want to use an optional\
    \ in your code you need to put an exclamation mark after it, which essentially\
    \ tells the device that you are sure that it has a value, and it is OK to use\
    \ it. This is what we are doing here – putting the ! after textField.text states\
    \ that we know it has a value (even if that value is an empty string) and that\
    \ the app won't crash.\n\nOptionals are quite fiddly and I wouldn't worry too\
    \ much about fully understanding them at this point, but if you want to read about\
    \ them there is a great blog post by www.gyanaranjan.com/2015/10/what-are-optionals-in-swift.html.\n\
    \n# Variable types in Swift\n\nWe are almost ready to build our currency converter\
    \ app, but we need to learn a little about variable types in Swift. In the JavaScript\
    \ and Python sections we learned about several variable types, including strings,\
    \ numbers and Boolean (true or false) variables. Swift is what is known as a 'strongly\
    \ typed' language, meaning that when a variable is used in a function, that variable\
    \ has to be of the correct type or the app will crash.\n\nFor example, in this\
    \ code:\n\n```\nvar number = \"2\"\nvar secondNumber = number * 5\n```\n\nwe get\
    \ an error, because number is defined to be a string, and we cannot multiply strings\
    \ by integers (whole numbers). To fix that, we can use the Int command to convert\
    \ number to an integer:\n\n```\nvar number = \"2\"\nvar secondNumber = Int(number)!\
    \ * 5\n```"
  merge: -1
