  md: "Your code should look something like this (4.3):\n\n![](img/57532e13229b6da209b2a527acf10e32_68_0.png)\n\
    \n# Classes and IDs\n\nWhat if we wanted some paragraph tags to be blue and others\
    \ red? We need a way to select elements more precisely than just by their type.\
    \ We do this using classes and IDs.\n\n# Classes\n\nAdding a class attribute to\
    \ an element is simple – change the code for the first paragraph to:\n\n```\n\
    <p class=\"blue\">I love HTML.</p>\n```\n\nWe have now applied the class 'blue'\
    \ to that paragraph. Now add the following code to the style section of your webpage:\n\
    \n```\n.blue {\n  color: blue;\n}\n```\n\nNote: the . before 'blue' tells the\
    \ browser that we are looking for a class. A period, or full stop, is shorthand\
    \ for class in CSS."
