  md: '# Products vs services


    It is important to draw a distinction between product- and service-based businesses,
    as both have quite specific advantages and disadvantages.


    A service-based business might be a web hosting company, or a platform for finding
    good cleaners. Google, Facebook and Vodafone are service-based businesses. Services
    have the huge advantage of potential for recurring revenue. This is when a customer
    pays a regular fee for an ongoing service. Having recurring revenue is extremely
    powerful because you can rely on a certain amount coming in each month. And as
    your user base grows, it naturally adds to your income for the long term. Of course,
    you need to provide value for your users for as long as they are paying you, but
    if you can do that a recurring revenue stream is a boon for any business.


    A product-based business might be an ebook, a video course, or reselling dresses.
    Apple, John Lewis and L’Oréal are primarily product-based businesses. They can
    be easier to set up, because you don''t need to create a complex service for your
    users. It is also potentially to differentiate yourself from competitors, especially
    if you are the only business that sells your particular product. However, recurring
    revenue is less likely with a product-based business, and you will need to continually
    create new products to bring in new income.


    Both types of business can be successful, but it is worth being clear what type
    your idea is. Take a few minutes to divide the ideas you wrote down into product
    and service businesses, and think about the potential for recurring revenue, or
    how you will grow your business by creating new products.


    # Some example ideas


    If you''re still short of ideas, remember that your first business is unlikely
    to be your most successful. In the early stages, the important thing is to try
    something. You will make mistakes, and there is only so much you can learn from
    books, so it''s best to get out and start making those mistakes now. Even if your
    business is not successful, you will have learned a huge amount, about coding,
    marketing and how to make something people love.


    So here are a few simple ideas for your very first business that almost anyone
    can try. Each of them will require you to test the market, create a product or
    service, and then actively promote it – the core skills of starting any business.'
