  md: "# In practice\n\nOK, so we've asked ourselves the questions, we've searched\
    \ online, and we've come up with nothing. It's time for the programmer's last\
    \ resort: to ask for help.\n\n# Step 3: Asking for help\n\nProgrammers are a pretty\
    \ helpful bunch, and are more willing than most to help out in exchange for some\
    \ internet points, or just a public thank you. However, they don't like being\
    \ asked vague questions or questions that have already been answered elsewhere.\n\
    \nIf you are on some kind of programming course where you can ask questions, that\
    \ is obviously a good place to start. When you ask your questions there, make\
    \ sure you give all the information that someone could need to solve your problem.\
    \ However, avoid pasting all your code, giving the error message and asking what\
    \ is wrong. This is very time consuming to debug!\n\nInstead, answer the three\
    \ questions above, telling your potential helpers what you are trying to do, what\
    \ result you are getting, debugging what you have done, and the few lines of code\
    \ that you have isolated that are causing the problem.\n\nIf you don't have access\
    \ to sort of forum, stackoverflow.com is probably the best place to ask questions.\
    \ There is a very helpful guide to asking good questions at http://stackoverflow.com/help/to-ask-to.\
    \ If you ask your question well, I will find you normally have some useful responses\
    \ within an hour. Not bad!\n\nIt goes without saying that when you have an answer\
    \ to your question, you should always offer a quick 'thank you' (or, on Stack\
    \ Overflow, 'accept the correct answer). And when you're further down the line,\
    \ consider answering some questions yourself to help others get started.\n\nWe\
    \ have now gone through the whole debugging process (the latter stages of which,\
    \ incidentally, is pretty much identical to the 'How do I...' process, if you're\
    \ trying to learn how to do something you haven't done before). We'll now look\
    \ at specific debugging tools for the different languages we have covered. These\
    \ can save you a lot of time, and make the whole process much smoother.\n\n# Debugging\
    \ HTML and CSS\n\nThe single most useful tool to web developers are the Developer\
    \ Tools, which are included with most browsers. Here we'll look at the Chrome\
    \ Developer Tools, which I personally think are the most comprehensive. To access\
