  md: '# Using coding to enhance your career


    # Text expansion on Windows


    There is no built-in text expansion utility for Windows, but Phrase Express (www.phrasexpress.com)
    has a free edition for personal use and Word Expander (www.wordexpander.net/)
    is completely free.


    If you want to investigate more advanced features, the full versions of Phrase
    Express, as well as the cross-platform Text Expander (https://text-expander.com/)
    are excellent places to start. Like IfTTTT, text expansion is not coding such
    as it still requires you to think carefully about how you want the app to behave,
    and if you use some of the advanced features it can get pretty complex. Give it
    a try now, and see how much time you can save.


    # Using Python to extract email addresses from a website


    The process of extracting information from websites automatically is known as
    ''scraping'', and is widely used in Python. It can save a lot of time when researching
    the web if you want to, for example, gather a collection of email addresses or
    the titles of a range of books or blog posts. Python is great for this sort of
    thing, and I have included below a simple web scraper, which ''crawls'' the web,
    starting from a certain page. Crawling is the process of downloading a number
    of different webpages, by looking for links on the original page. In this case,
    we start with www.ecowebhosting.co.uk; look for all the links on that page, download
    the content from each of those pages, and search for email addresses on that page.


    It uses Beautiful Soup (www.crummy.com/software/BeautifulSoup/), a Python library
    designed to make website scraping easier.


    The code is a slightly edited version of http://scraping.pro/simple-email-crawler-python/.
    It is well-commented, and uses rather more advanced Python than we have seen so
    far, so I won''t go through it by line, but if you have some ideas of how you
    could use web scraping in your job, you should be able to figure out how it works
    using the comments. You can then customize it to your precise needs.'
  merge: -1
