  md: 'You might want to use them to check if a user is logged in, for example. You
    would create the variable in the normal way:


    ```

    isLoggedIn = True

    ```


    You could then use if statements, covered later on in the chapter, to test whether
    or not the user is logged in.


    # Lists


    Lists are similar to variables but they allow us to store many values in one object.
    When you are viewing your inbox, for example, your email app can''t create a differently
    named variable to contain the content for each email. Instead, programmers use
    Lists. Lists are also known as arrays in other languages.


    To create a List containing the names of the members of your family, you would
    use code like this:


    ```

    names = ["Kirsten", "Tommy", "Raphie"]

    ```


    The square brackets ([ and ]) define a List, and then we separate the different
    members, or elements of the List with commas.


    We can then print the whole List using:


    ```

    print(names)

    ```


    and if we want to access a particular element within the List we use the square
    brackets::


    ```

    print(names[0]) - this would print ''Rob''.

    ```


    Note that the numbering for the List elements starts at 0, so names[2] would return
    ''Tommy''. This is easy for new programmers to forget, and a common mistake is
    to think names[3] returns the third element in the List, when it is in fact the
    fourth.


    The number of an element is known as its index.'
