  md: '# Accessing the entered text


    Now that remains is to get the value of the text that the user has entered in
    our code. Our aim here is to change the content of the Toast so that instead of
    saying ''Hi there!'' it says ''Hi Rob'' (if the user has entered Rob as their
    name, of course).


    So, click on the MainActivity.java tab, and enter the following code just above
    the Toast command:


    ```

    EditText nameEditText = (EditText) findViewByIdId(R.id.nameEditText);

    ```


    There''s a lot going on here. First, we''re creating a variable of a type EditText
    called nameEditText. We will use this to refer to our text view.


    Ignoring the (EditText) for a moment, the findViewById method finds a view by
    its ID, and we give it the ID of our text view, which is stored in Resources (''R'').


    What about strange screen (EditText)? Remember that everything that appears on
    the screen is a ''view''. This applies to text views (EditText) as well. The findViewById
    method returns a generic ''view'', but we know that it is really an EditText,
    so we use (EditText) to ''cast'', or convert, the view into an EditText. Makes
    sense? You might want to read that paragraph again to be sure.


    Now we have a variable we can use to refer to our text view. The next step is
    to get the value of the text view, which we''ll store in a string called ''name'':


    ```

    String name = nameEditText.getText().toString();

    ```


    The ''String name'' part creates a string variable called ''name'', and then we
    use getText() to get the text the user entered into the text field, and finally
    we use toString() to convert it to a string. So far so good!


    Finally, we need to change the code for the Toast to say hi to our user:


    ```

    Toast.makeText(this, "Hi " + name, Toast.LENGTH_SHORT).show();

    ```


    Here we have changed "Hi there" to "Hi" + name. The ''+'' combines the two strings,
    so if the user enters ''Helen'' as their name, "Hi " + name. will be equal to
    ''Hi Helen''.


    That''s it. Your code should now look like this:'
