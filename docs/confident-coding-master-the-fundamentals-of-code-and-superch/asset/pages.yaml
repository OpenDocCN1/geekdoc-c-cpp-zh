  md: "# Future-proofing your career with coding\n\nbe wondering how much of your\
    \ previous work to include, and how to 'talk\nu' your relative lack of development\
    \ experience.\n\nMy advice would be to include each of your roles (ideally leave\
    \ no gaps\nin your timeline), but don't go into detail of what the work involved.\
    \ If you want to work as a developer, you should focus on what you have done\n\
    to develop your new skills, and the portfolio of what you have developed.\nAs\
    \ with your portfolio, clarify what particular languages and environments\nyou\
    \ are familiar with, as evidenced by the projects you have worked on.\n\nIt is\
    \ likely that some people read that your CV will not be technical,\nin instead\
    \ be looking for keywords such as JavaScript or PHP, so make\nsure you include\
    \ all relevant skills as explicitly. The word 'relevant' there\nis important –\
    \ be aware of the job you are applying for and tailor your list\nof skills. A\
    \ complete laundry list of every language you've ever\nworked with is not required!\n\
    \nA great technique is to state what you like and dislike about\nthe tools you\
    \ have used – this shows that you understand them well enough to\nbe familiar\
    \ with their foibles. You can do this in a 'summary' section, which\nalso includes\
    \ a statement about your overall level of experience, and also\nof some the personal\
    \ projects you have worked on. This will show that you\nave a genuine interest\
    \ in programming, and also give you something inter-\nest to talk about in the\
    \ interview.\n\nAs always, be honest – don't claim to have years of coding experience\n\
    \ you don't, but make clear that you are a faster learner and have\nachieved a\
    \ lot in the short time you have been coding. If you are applying\for appropriate\
    \ jobs (ie entry-level coding positions), your employer won't\nexpect a huge amount\
    \ of experience or a degree in computer science, but\nthey will want to see that\
    \ you have the basic technical skills they are looking\nfor, and that you are\
    \ genuinely interested in what you do.\n\n# The interview\n\nAs with CVs, all\
    \ the standard interview advice applies here: be personable\n interested in your\
    \ interviewers, and have a strong knowledge of the\ncompany and the role you are\
    \ applying for. As well as, read your CV\nthoroughly and write down at least 20\
    \ questions that might be asked\nabout what you've written (if you can't think\
    \ of 20, ask a friend or family\nmember). Write down good answers to these questions,\
    \ and read them out\nloud several times. This will help you get confident, fluent\
    \ answers to ques-\ntions that are bound to come your way."
