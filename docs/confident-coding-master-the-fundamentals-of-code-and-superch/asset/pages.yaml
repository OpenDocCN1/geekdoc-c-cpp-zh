- img_proc: true
  md: '# Building an app for Android


    code is doing. You can always Google particular keywords if you would like more
    information.


    The first line defines the name of the package, or app - in my case:


    ```

    com.example.robpercival.myfirstapp.

    ```


    The ''import'' lines bring in various ''libraries'', which allow you to work with
    specific features, such as TextViews, buttons, log files or even GPS. These two
    default lines give us the default code required to run our activity any use the
    Android OS (operating system).


    Next, we''re creating a ''class'' called MainActivity. A class is a collection
    of methods (chunks of code that serve a particular function) and variables. This
    particular class will control the Main Activity. As we have only one activity
    in our app, this essentially controls our whole app.


    The class is ''public'', which means it can be accessed from anywhere in the app
    (and, potentially, by other apps as well). It ''extends'' the ''AppCompat'' class,
    which is a default class that contains a collection of methods that we can use
    with our activity.


    Next, we build a method onCreate. This method is a default one, which is run when
    the activity is ''created'', ie when the app is run. This is a ''protected'' method,
    meaning that it can be accessed from anywhere in the app, but not by other apps.


    The ''void'' in this line means that the method doesn''t return anything. To understand
    what this means, imagine a method called ''plus'' which adds two numbers together.
    For that method to work, you would need to pass two numbers to the method, and
    then it would return the total of those two numbers. The onCreate runs some code,
    but does not return anything, which is confirmed by the ''void'' in the method
    definition.


    super.onCreate(savedInstanceState); line runs all the default code needed when
    the activity is run. The savedInstanceState contains the previous state of the
    app, and in some circumstances can be used to return the app to that state (for
    example, returning the user to an email they were previously writing in the app).


    Finally, ''setContentView(R.layout.activity_main); establishes that we want to
    use activity_main to define our layout, or ''ContentView''. This will display
    the user interface layout we have created.


    Phew! There is a lot of theory there, and don''t worry at this point if not everything
    is completely clear - it will make much more sense as you start to build more
    apps. For now a broad understanding is all that is needed.'
