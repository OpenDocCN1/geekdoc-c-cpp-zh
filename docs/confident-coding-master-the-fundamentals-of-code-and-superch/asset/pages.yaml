- img_proc: true
  md: '# When should you start your business?


    At the beginning of my business career I used what I call the scatter-gun approach.
    I would have what I thought was a fantastic idea (or at least convince myself
    that I could build a better website, or a better business, than an existing company).
    I would say ''If only my business could be 1% the size of [insert big company
    here], I''d be sorted.'' I would then run off and build the website, only to find
    out that getting customers was harder than I thought, or the service wasn''t as
    popular as I''d hoped. I would then get another fantastic idea and move on to
    that one.


    The downside of this approach is that you will inevitably spend a lot of time
    on businesses that end up unsuccessful. Having said that, I learned a lot (and
    made a lot of mistakes) with those businesses, and when I hit upon an idea that
    was successful, I was able to apply the lessons I learned and not make those mistakes
    again.


    In short, there is nothing wrong with going on there and creating the website
    or product that you are thinking about, and seeing what happens. However, there
    is a smarter way that will help you establish whether your idea is a good one
    before going to the trouble of actually building it.


    # Validating your idea


    How do you know if your idea is a good one? This is often a very difficult question
    to answer but there are a few general techniques you can use.


    Firstly, don''t listen to your friends and family, unless they have particular
    skills or experience in your niche. Friends and family generally want you to be
    happy, and will be keen to encourage you on your new mission, and as a result
    are not a reliable guide as to whether the idea is a good one or not. Discuss
    it with them by all, but ''all my friends said it is a great idea'' is not a good
    enough reason to start.


    A good place to begin is to look for potential competitors. Go to Google and enter
    the keywords that you would expect future customers to enter if they were looking
    for your product or service. In our examples above, ''find a yoga instructor''
    or ''invoicing for plumbers'' would be a good start. See what is available already,
    and take some to analyse how good these products or services are.


    Don''t be disheartened if the brilliant idea you had already exists. Just means
    there is a market for it. It''s very unlikely that you''ll come up with'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# Coding and entrepreneurship


    At the same time, what can you learn from your competitors? What are you doing
    well that you could incorporate into your business? Don''t be afraid to steal
    great ideas!


    What if you don''t find any competitors? It could of course mean that you have
    come up with a genuinely new idea, but not necessarily. It may well mean that
    there simply isn''t a market for your idea, or that people have tried and failed
    (or you are searching with the wrong keywords).


    Once you have done your competitor research, you should have a fairly clear idea
    of what makes your business unique, and better than the competition. So now it''s
    time to build it, right? Not yet. First you need to reach some potential customers
    and talk to them about what they would want your product or service.


    At this point, you can hopefully see another benefit of having a blog, or some
    sort of online following. If these people were your target market, you could contact
    them individually or collectively to get their feedback.


    If you don''t have easy access to potential customers or, the process will be
    a little harder, but not impossible. If you are targeting a specific niche, find
    out where these people are (both in real life and virtually). Find a way in your
    local area and offer to them a coffee or lunch in exchange for feedback on your
    idea. If there are forums or Facebook groups dedicated to people in your niche,
    post there.


    Face-to-face feedback is particularly valuable, as internet comments tend towards
    the flippant and critical. When you are speaking to clients, at all possible try
    to get a firm commitment. If you ask ‘would you use this’, they will almost certainly
    say yes, for the same reason friends and family want to support you. Asking ‘how
    much would you pay for this’ is often more revealing. You could even ask them
    for a payment then and there (refundable if they are not happy with the product),
    to establish just how keen they are.


    What if you don''t have a specific niche, or you have no way of getting in touch
    with potential customers? One great solution is to create a simple ‘Coming Soon’
    website, and ask people to sign up to your newsletter if they are interested.
    Include the key features of the product and a rough date when you plan to launch,
    and perhaps some screenshots if you have'
