  md: '# Start-up story


    In the summer of 2008, Joe Gebbbia and Brian Chesky, couldn''t pay their high
    San Francisco rent. They decided to rent out three air mattresses on their floor
    and serve breakfast. Three people showed up, paying $80 each. They thought this
    might be a big idea, so they built a website allowing people to share their spare
    rooms. The company got two bookings per month after their initial ‘big launch’,
    and around $800 per month for several months.


    The founders realized that most people judged the properties on the photos, and
    most of the photos on the website were not great. So they bought a fancy camera,
    and visited individual houses that were listed on the site, offering to take photos
    for them for free. This took a lot of time and effort, but slowly they started
    to grow, eventually becoming the multibillion dollar company that Airbnb is.


    Taking photos of their users’ rooms is obviously something that they wouldn''t
    be able to do at scale, but in the short term it made all the difference. Is there
    something you could do to make your business or service stand out, even if it
    wouldn''t scale?


    # Summary


    I hope now that you''ve identified the best idea from the list that you wrote
    at the beginning of this chapter, and that you are looking forward to testing
    it out and creating your MVP. Starting a business is one of the most exciting
    things you can do, and will teach you a huge amount about the world, and yourself.


    We are now moving on to see how you might proceed if you wanted to pursue coding
    further and actually become a web or app developer. Even if you''re not planning
    on a career change, I would recommend reading this final chapter, as we will also
    cover how to earn an income from coding by freelancing. This is something anyone
    can do, regardless of your current role and, like starting a company, is a great
    way to improve both your coding and business skills.'
  merge: -1
