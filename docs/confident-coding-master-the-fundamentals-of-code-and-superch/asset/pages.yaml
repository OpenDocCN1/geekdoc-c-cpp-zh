  md: '# Future-proofing your career with coding


    You might even find that that you don''t currently do, but could be done automatically
    and benefit your business. If you use Mailchimp to send newsletters for example,
    you can automatically share the latest newsletters'' performance with your colleagues
    via email, Slack and a Google Spreadsheet (https://ifttt.com/applets/DHFQvPej-share-newsletter-performance-with-the-team).


    While not coding as such, using IFTTT forces you to think through the conditions
    that you want to cause your applet to run, and exactly what output you want, and
    so it involves many of the same challenges. More importantly, it can make your
    life a lot easier, and dramatically increase your productivity, so take a little
    time to look at the applets available, and think about how you could apply them
    in your current role.


    # Text expansion


    A lot of jobs require you to write phrases and sentences frequently, many times
    a day. At the very least you might need to type your email address, phone number
    or home address pretty regularly. Text expansion allows you to assign shortcodes
    to any text, so you might assign ‘wyt’ to ‘What do you think?''.


    In some text expansion apps, you can even use shortcodes to insert images, or
    press buttons like Tab or Enter. You can use this to log into a site with just
    a shortcode, by instructing the shortcode to insert your email address, then ‘press’
    the Tab key to move you to your password field, insert your password, and then
    press Tab to move you to the Login button and then press Enter to log in.


    How much time this will save depends on your role, but there are few people who
    wouldn''t benefit from setting up a few basic phrases.


    # Text expansion on MacOS


    Text expansion is actually built into MacOS, so you don''t need to download any
    extra software, unless you want advanced features. To access it, click the Apple
    icon in the top left of the screen and then select System Preferences and Keyboard.
    Select the ‘Text’ tab and you’ll see the Keyboard Shortcuts window.


    Just use the + button to add new shortcodes and you’re done!'
