  md: 'Hurrah, you''ve run your first piece of JavaScript! The onclick attribute allows
    us to write some JavaScript which will be run when the button is clicked. The
    actual JavaScript we are running is:


    ```

    alert(''Hello there!'')

    ```


    The alert command means ''create a popup window with a message for the user'',
    and that message is contained within the single quote marks, ie Hello there! In
    JavaScript a command is usually followed by parentheses, or brackets, containing
    information for the command. In this case, the information is the text to be displayed
    in the popup.


    # Practice exercise


    +   1. Change the code so that instead of alerting Hello there! it alerts Hello
    and your name.


    Your code should look something like this:


    ```

    <button onclick=''alert("Hello Rob!")''>Click Me!</button>

    ```


    Running JavaScript like this is known as inline JavaScript, just like inline CSS
    as we saw at the beginning of the previous chapter.


    # Internal JavaScript


    Running JavaScript like this is much like running CSS using the style attribute
    - it works, but it''s messy, and is a frustrating experience if you are trying
    to write more than a simple alert command.


    Just like CSS, we can separate our JavaScript from our HTML using internal JavaScript.
    With CSS we used <style>tags, and with JavaScript we use <script>tags. Those tags
    can go in the header of our HTML page, but we''ll be putting them at the end of
    the page. This is generally good practice, as it makes sure all the elements of
    the page have been created by the browser before we try and run JavaScript on
    them.


    To create some JavaScript which alerts Hello there! when the page is loaded, add
    this code to your HTML page, just before the </body> tag:'
