  md: '# Website development 07


    Our first look at coding in practice will be to learn how we can build and share
    a website with the world. A website is probably the simplest thing you can build
    with code, and yet it can be hugely powerful. The potential to create something
    in a few minutes that anyone in the world can access is quite intoxicating – yet
    if you''ve worked through the previous chapters in this book you already know
    how to do that.


    We''ll start by seeing how the coding world has transitioned from software that
    runs on a ''local'' computer (ie the machine sitting on your desk or lap) to websites,
    which primarily run on a ''remote'' computer, connected to your PC or phone via
    the internet.


    Next, we''ll consider the reasons why a non-web developer might want to build
    a website, whether it''s for career advancement, pleasure or creating an online
    presence.


    We''ll then look at three options for creating a website: using a service as Weebly
    or Squarespace, hosting your own using a Content Management System as Wordpress,
    and finally coding the site yourself from scratch. You''ll learn the advantages
    and disadvantages of all three, and find out which option to use depending on
    the nature of the site you want to build.


    Finally, we''ll look at one of the most popular frameworks for building great
    looking sites, Bootstrap, and in the closing project for this section we''ll make
    a simple website of your choice.


    By the end of this section, you will be familiar with the different ways that
    you can create and host websites, and be ready to build one for any project or
    business that you want to start.


    # Why build a website?


    A hundred years ago, if you wanted to start a business, you would likely have
    needed a great deal of capital. At the least you would have needed premises to
    sell your goods, staff to make your product or financing for raw materials.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# In practice


    All that has changed in the last 20 years, where some of the most valuable

    businesses in the world exist purely online, and were created by individuals

    with almost zero initial costs. Learning to code gives you the power to put any

    idea you have into action investing no more than your time and the price

    of a few cups of coffee. You don''t even need to ask anyone for permission!


    But if you don''t want to start a business, there are many other

    reasons you might want to build your own website.


    A blog is a great way to build a name for yourself online. You can share your\love
    of dogs, your horticultural knowledge, or even document the process of

    learning to code. Write well and you can create a community of like-minded

    individuals, and you never know what opportunities might come out of that.


    If there is an online task that you do regularly, you might well be able

    to automate with a website, and if other people do similar tasks, you can

    share your tools with them. The web scraping code we learned in the Python

    chapter, for example, could be used to check when prices on Amazon are

    updated. You could then allow your users to check the prices of particular

    products, and email them when they go below a particular threshold.


    We will look at ways to build specific types of sites later in the book,

    for now it would be worth having a particular website in mind that

    you would like to build. It doesn''t have to be a world-changing idea, just a

    particular idea that will help you apply what you learn in this chapter.


    Take a few moments now and jot down this idea. Then, as you are reading

    through this chapter, think about how the different approaches could work

    with idea, and which which you would choose. If you really want to solidify

    your learning, create that website when you''ve got to the end of the chapter.


    # How do websites work?


    The BBC Micro computer I grew up with in the early 90s was a stand-alone

    machine. You could add programs (software) to it tapes and discs, but

    all the code was run completely on the device itself.


    As the internet grew and became faster, it began to be feasible for the code

    for programs (called websites) to be stored on powerful computers called

    servers which would then be transferred to the user''s computer and displayed

    in a special piece of software called a browser. Initially most of these websites

    were static, displaying information coded using HTML and CSS.


    Gradually websites became more interactive, and rather than display-

    ic content they allowed users to post updates, send email or ever

    watch video. These type of sites were initially known as ''webapps'', although

    the word has mostly gone out of usage nowadays, becoming synonymous'
  merge: -1
