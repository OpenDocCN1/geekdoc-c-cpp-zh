  md: 'To keep our webpage simple, remove the red div and its styles, and add a paragraph
    which says ‘This is some text.’ (Or something more creative if you fancy.) Your
    page should now look like this (4.19):


    ![](img/57532e13229b6da209b2a527acf10e32_83_0.png)


    Now add the following style:


    ```

    body {

    font-family: sans-serif;

    }

    ```


    This changes the text to the browser’s default sans serif font.


    Sans serif means without serifs, ie without decorative lines or ‘ticks’ at the
    end of each letter. Sans serif fonts are usually seen as more modern and cleaner
    than serif fonts.

    Note: we have applied the font-family property to the body, not the paragraph
    element. This means that all text on the page will be affected, which is exactly
    what we want, as most web pages use just one font.


    # Fancier fonts


    We don’t have to limit ourselves to the default serif and sans serif fonts, we
    can use any font we like. However, if our website is popular, it will be accessed
    from a range of different devices, which may not have the font that we want to
    use installed. In this case, we can set up a list of fonts, and the webpage will
    use the first one that is available.'
  merge: -1
  pgno: 83
- img_proc: true
  md: "For example, try this style:\n\n```\nfont-family: \"Comic Sans MS\", cursive,\
    \ sans-serif;\n```\n\nIf you're accessing the site on a computer, you will likely\
    \ see the text in the Comic Sans font.\n\nHowever, if font is not available on\
    \ a user's device, it will fall back to the device's default 'cursive' (handwriting-style)\
    \ font, and if that is not available it will use the default sans font serif.\n\
    \n```\nbody {\n  font-family: \"HelveticaNeue-Light\", \"Helvetica Neue Light\"\
    , \"Helvetica Neue\", Helvetica, Arial, \"Lucida Grande\", sans-serif;\n}\n```\n\
    \nHelvetica Neue is a font known for being modern, simple and stylish, but only\
    \ Apple devices make it available as a default. This CSS style will select what\
    \ you want to font it if it is available, but offers a range of fallbacks to pick\
    \ the 'prettiest' version of the font available as you can see on the right (4.20):\n\
    \n![](img/57532e13229b6da209b2a527acf10e32_84_0.png)\n\nIt is generally recommended\
    \ to stick to 'web safe fonts' if you are confident that all your users will see\
    \ the font that you intend. To get a list of these fonts, just type 'web safe\
    \ fonts' into your favourite search engine."
