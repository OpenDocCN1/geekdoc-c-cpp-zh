- img_proc: true
  md: '# Future-proofing your career with coding


    any. You could do this with a Wordpress theme, using a service such as mailchimp
    to manage the email sign-ups.


    Once you have built your site, tell your friends and family about it and ask them
    to share it. You could even run a small campaign to drive traffic to the site
    – spending £100 on Google or Facebook ads could be money well if it saves you
    hours building a website no-one wants.


    The crucial thing at each stage is to evaluate your idea objectively. Don’t put
    off if one person tells you it will never work, but at the same time it likely
    not be wise to ‘keep the faith’ in the face of overwhelming evidence that there
    is not a market for your product, or that market is currently served very well
    by existing businesses.


    # Creating a minimum viable product


    All right, so you are convinced that there is a target market for your product
    or service, and that you are able to create something better than anything that
    currently exists? Great. It’s time to get to work!


    The phrase ‘minimum viable product’ (MVP) nearly expresses the idea that you should
    build the smallest thing that you can satisfy your customers. It is tempting for
    budding entrepreneurs to feel that their website or app has to do everything –
    it has to have more features, better looking, and be easier to use than anything
    else available. Sometimes this is true, but in most cases it’s more important
    to do one thing extremely well, than it is to do everything your customers need.


    Google is a classic example. Their homepage had (and, largely, still) has a simple
    search box and two buttons. The one thing they did really well help people find
    the information they were looking for. Not all businesses can be quite that minimal,
    when designing your product you should try to establish what the one thing is
    that your business does better than anyone else, and focus on that.


    The big advantage of the MVP approach is that you can get something in the hands
    of your users as early as possible. As they say in Silicon Valley, if you are
    not embarrassed about your product at launch, launched too late. This is not to
    say you should release a half-baked product, but you should focus on releasing
    as early as possible, rather than adding extra features. That way, you can get
    feedback from real users from the beginning, meaning that you’ll be adding features
    that they actually want, rather than ones you think they want.'
