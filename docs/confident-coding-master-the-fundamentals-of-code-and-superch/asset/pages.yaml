    # Formatting text


    Now that you know how a basic HTML page works, we’re going to look at some specific
    tags that we can use to customize the way our page appears. Let’s start with text
    formatting.


    Try typing the following code under the ‘Hello World’ paragraph in Brackets:


    ```

    <p><strong>This text will be bold</strong></p>

    ```


    The strong tag makes the text appear bold.


    Question: Move the strong tags around so that only the word ‘text’ is in bold.

    Answer: <p>This <strong>text</strong></p> will be bold</p>


    Add a new paragraph using this code:


    ```

    <p><em>This text will be italic</em></p>

    ```


    The ‘em’ tag is short for emphasis, and makes text appear italic.

    This can act as a handy reference for basic formatting HTML tags.

    Note – you might want to save that code as a separate file on your computer called
    formatting.html so you can refer back to later.


    Question: Experiment by adding paragraphs which contain <sup>, <sub> and <del>
    tags. What effect do these have on your text?

    Answer: <sup> makes text superscript (ie appearing above the normal text), <sub>
    is subscript (ie appearing below the normal text) and <del> has a strikethrough
    effect.'
