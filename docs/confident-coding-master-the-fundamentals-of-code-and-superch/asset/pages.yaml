  md: "We can now select elements by either their type, or their class or ID. We have\
    \ only learned one CSS rule though, which is how to change the colour of text.\
    \ Before we look at other rules, we'll quickly see how we can use the <div>-element\
    \ to break up our code into different sections.\n\n# Divs\n\nDiv is short for\
    \ ‘division’ and allows us to divide our code into different sections. This means\
    \ we can style each section differently if we want to. Remove all the code from\
    \ the body of your page and replace it with this:\n\n```\n<div class=\"divA\"\
    >\n  <p>I'm in div A</p>\n</div>\n<div class=\"divB\">\n  <p>I'm in div B</p>\n\
    </div>\n```\n\nThe result should look like this (4.4):\n\n![](img/57532e13229b6da209b2a527acf10e32_70_0.png)\n\
    \nQuestion: Why is the text for both paragraphs now green?\nAnswer: We have removed\
    \ the class and ID from the paragraphs, so now the only rule that applies to them\
    \ is the color: green rule. Therefore they are both green."
