  md: "# CSS 04\n\nNow that you have covered HTML, which allows you to create different\
    \ types of elements on a webpage,in this chapter you'll learn how to style those\
    \ elements using CSS. Then, in the next chapter, we'll be making the elements\
    \ interactive using JavaScript.\n\nIn this chapter we'll cover:\n\n+   * what\
    \ CSS is and how it is used;\n* how to refer to elements using classes and IDs;\n\
    * using DIVs to break up our webpages; and\n* how to use CSS to adjust the following:\n\
    \  - borders and positioning\n  - colours and fonts\n  - text and link formatting.\n\
    \n# What is CSS?\n\nHTML allows us to add elements to our webpages, but it does\
    \ not easily allow us to adjust their position, colour, font or style in general.\n\
    \nCSS was introduced by Håkon Wium Lie, a colleague of Berners-Lee, in 1994. The\
    \ main idea is to keep the styling information separate from the content of the\
    \ page, so it's easy to adjust the style without affecting the content. In fact,\
    \ you can completely change the look and layout of a webpage by just changing\
    \ the CSS, without editing the HTML at all.\n\nCSS stands for Cascading Style\
    \ Sheets – the 'cascading' part refers to the way the browser decides which style\
    \ ' should apply to an element when there are multiple, conflicting rules. For\
    \ example, if one style says a <p> element should be blue, and another says it\
    \ should be red, we need to have a consistent way to know what colour the <p>\
    \ element should actually be. We'll see several examples of this later on."
  merge: -1
  pgno: 64
- img_proc: true
  md: '# Why learn CSS?


    Learning HTML without CSS is a bit like learning to paint in black and white:
    you can draw anything you like, but you are missing out on a world of colour.
    CSS allows us to design our websites to look unique, friendly and pretty. It will
    allow you to customize the look of any website you want to build or maintain.


    From a coding point of view, CSS''s use of classes and IDs (we''ll see what they
    are very soon) is fundamental to JavaScript, and will teach you how we can use
    a single line of code to affect the look of number of different elements. CSS
    is still pretty simple, but is slightly more complex than HTML to get your head
    around, so it''s the perfect second language to learn as you develop your coding
    skills.


    # What does CSS look like?


    Enough introduction! Let''s see some CSS in action. First off, add a paragraph
    to an empty webpage containing the words: ''I love HTML.''


    > Note – head to the beginning of the HTML chapter if you need a reminder on how
    to set up your text editor, browser and a basic webpage. Your code should look
    like this:


    ```

    <p>I love HTML.</p>

    ```


    Now add a ''style'' attribute, with a value of ''color:blue'' so it looks like
    this:


    ```

    <p style="color:blue">I love HTML.</p>

    ```


    Through the wonder of CSS, you will see that the text turns blue. Try experimenting
    with other colours.


    > Note to my British readers: you will have to use American spelling I''m afraid,
    colour:blue will not work.


    The ''color:blue'' part is the CSS, and is a single CSS rule which applies to
    that particular <p> element.


    Adding CSS using a ''style'' attribute is known as inline CSS, as it is in line
    with the HTML.'
  merge: -1
  pgno: 65
- img_proc: true
  md: '# Practice exercise


    Try turning the text in this paragraph red using inline CSS: `CC 12`


    There is a problem with inline CSS though – if we want to make the text of every
    paragraph red, we have to add a style attribute to each paragraph. This is messy,
    and if we suddenly want to change the colour of all our paragraphs to green, we
    will have to update each one individually.


    Fortunately, there is a solution to this problem, and it is called internal CSS.


    # What is internal CSS?


    Internal CSS is when we include all the CSS together at the beginning of our HTML
    document (we will meet the third and final type of CSS, external, at the end of
    the chapter). It looks like this (4.1):


