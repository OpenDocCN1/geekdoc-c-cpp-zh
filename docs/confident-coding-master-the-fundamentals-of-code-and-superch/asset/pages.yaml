  md: '# In practice


    Another advantage of coding this way is that it forces you to slow down, making
    it much less likely that you will miss a crucial semicolon, or misspell a function
    name.


    One other trick as you are writing your code is to check it as regularly as possible.
    This means running your app, or loading your website, and making sure it is behaving
    as expected so far. As a general rule, if I''ve checked code that I have been
    writing for over 10 minutes, I start to get a little nervous and look for a good
    place to stop and check that everything is OK.


    The precise timings will depend on the project and your personality, but my advice,
    particularly in the early stages, is to run your code as often as you can. If
    you get an error when you run it, you will have a smaller number of changes since
    you do last check, so the debugging process will be much simpler. If you don''t,
    you''ll feel encouraged and confident that everything is going well.


    Great! Now that we are writing code, let''s consider some of the standard questions
    we have to ask ourselves when we are debugging. These are the most important questions
    in this whole chapter, and perhaps in the whole of coding itself – if you can
    answer them, you can fix any problem.


    # Step 1: The three questions


    When a new coder finds some code they have written doesn''t work, they often feel
    frustrated, not sure where to look to fix the problem, and as a result they often
    blame themselves (‘I''ll never be able to do this’) or the machine itself (‘stupid
    computer’). This is perfectly natural, and all coders have experienced this emotion
    many times.


    The difference between experienced and novice coders, however, is that the experienced
    coder knows that this has happened many times before, that it doesn''t mean he
    or she is an idiot, and that it can be fixed using the same process they use every
    time.


    So what is this process? The first question to ask is a painfully obvious one:
    What makes you say your code isn''t working?


    The answer to this question might be frustratingly self-evident: ‘My code won''t
    compile!''; My website won''t display properly’; ‘The button doesn''t do anything
    when I press it’


    But forcing yourself to answer this question is harder than you think. If you
    have an attention to it – what is it saying? Error messages can often be obscure,
    but you should be able to extract some meaning from it. It will also often tell
    you the exact line that the error'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Debugging


    occurred, which is a great starting point. And ''googling the error message''
    is a perfectly reasonable (and common) thing to do as a coder!


    If you don''t have an error message, this can be tricky, but you should at the
    least clarify exactly what the problem is. Evolving your thinking from ''My website
    won''t display properly'' to ''My logo is appearing at the bottom of the screen,
    but I want it at the top'' is a big step forward. With layout issues in particular,
    dealing with problems one at a time is crucial - it''s easy to get overwhelmed,
    but breaking the issues down into individual errors and getting them clear in
    your head will make them much easier.


    Now that you (hopefully) have a clear understanding of what exactly is not behaving
    as expected, it''s time to move on question 2: *How is your code supposed to work?*


    Again, answering this question might be frustrating – you only wrote the code
    five minutes ago, you know how it''s supposed to work – but all too often running
    through the part of the code that seems be causing the problem is all that is
    needed to fix the issue.


    With the logo issue, for example, you would likely go to the CSS that controls
    the position of the logo. Thinking through the CSS commands you have written,
    *should the logo display?* Are there any conflicting lines of CSS that could be
    changing its position unexpectedly?


    If a button is not responding, mentally work through the process that is supposed
    to happen when the button is clicked. Is the button correctly connected to the
    function you have written for it? Could there be an error in that function? Does
    the function actually display a result, or does it do some calculations without
    changing the UI at all?


    Ninety per cent of code errors should be fixed by now, if you have carefully asked
    yourself those two questions. If you are not done yet, though, it''s time for
    question 3: *What tweaks can you make to clarify what your code is doing?*


    If you have well-written, clearly commented code, it should be fairly obvious
    what your code is up to any point. However, even good code can contain mistakes,
    and our final trick is to play with variables, or add small lines of code, to
    see what effect that on how the app runs or the website displays.


    Going back to the logo example, you could try experimenting with some values –
    does changing the margin-top value move the logo down as you might expect? If
    not, why not? If you really can''t find the error you can always remove all the
    CSS except the lines that should be controlling the logo’s location. If it then
    displays correctly, add them back in gradually until the problem recurs. Bingo
    – you have found the problem.'
  merge: -1
