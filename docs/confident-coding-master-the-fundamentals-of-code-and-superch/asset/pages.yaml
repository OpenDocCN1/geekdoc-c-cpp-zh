  md: "```\nfrom bs4 import BeautifulSoup\nimport requests\nimport requests.exceptions\n\
    from urllib.parse import urlsplit\nfrom collections import deque\nimport re\n\
    ```\n\n```\n# a queue of urls to be crawled\nnew_urls = deque(['http://www.ecowebhosting.co.uk'])\n\
    ```\n\n```\n# a set of urls that we have already crawled\nprocessed_urls = set()\n\
    ```\n\n```\n# a set of crawled emails\nemails = set()\n```\n\n```\n# process urls\
    \ one by one until we exhaust the queue\nwhile len(new_urls):\n```\n\n```\n# move\
    \ next url from the queue to the set of processed urls\nurl = new_urls.popleft()\n\
    processed_urls.add(url)\n```\n\n```\n# extract base url to resolve relative links\n\
    parts = urlsplit(url)\nbase_url = \"(0.scheme)://(0.netloc)\".format(parts)\n\
    path = url[:url.rfind('/')+1] if '/' in parts.path else \"\n```\n\n```\n# get\
    \ url's content\nprint(\"Processing %s\" % url)\ntry:\n response = requests.get(url)\n\
    except (requests.exceptions.MissingSchema, requests.exceptions.ConnectionError):\n\
    ```\n\n```\n# ignore pages with errors\ncontinue\n```\n\n```\n# extract all email\
    \ addresses and add them into the\nresult set\nnew_emails = set(re.findall(r\"\
    [a-z0-9\\._%+-]+@[a-z0-9\\-]+\\.[a-z]{2,}\", response.text, re.I))\n```\n\n```\n\
    emails.update(new_emails)\n```"
