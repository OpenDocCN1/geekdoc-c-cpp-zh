  md: '# # Why coding is important and what it can do for you


    We''ve already seen several reasons why learning to code is important: it can
    increase your salary, widen your future career choices and be a springboard into
    self-employment and entrepreneurship. It will also help you navigate the increasingly
    automated future of smart assistants, self-driving cars and virtual reality.


    In this chapter we will look at some more specific things you can do with coding
    right now, many of which we will expand on through the course of this book.


    # # Becoming more efficient


    Almost all jobs today require a fair bit of time working with a computer. You
    likely have to do a range of similar tasks each day, including working with email,
    creating and managing documents, and searching the web. Almost all of these tasks
    can be made more efficient with a strong knowledge of how the software and operating
    system you are using works.


    Initially, simply using keyboard shortcuts will likely save you several minutes
    each day, and more importantly you will start thinking about how the software
    you are using works, and how your workflow could be improved. Services such as
    text expansion and If This Then That, we will be covering in detail later on,
    can save you a huge amount of time, as well as helping you do a better job. Imagine
    being able to automatically email your colleagues with a summary of the effectiveness
    of your weekly'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Why coding?


    newsletter. Or completely automating the process of turning your weekly sales
    report into a live webpage that your colleagues can view any time.


    Learning to code will allow you to do all this and much more, doing a better job
    in less time.


    # Communicating with technical people


    Regardless of your current fluency with technology, it is likely that you need
    to communicate with technical people fairly regularly about things that you don''t
    entirely understand. Whether it is trying to get some content added to the company
    website, getting some software installed on your computer or removing the tweet
    you accidentally posted on the company account, greater technical knowledge can
    make every aspect of those conversations much more straightforward.


    As well as becoming familiar with the terminology technical people use (which
    really isn''t as complicated or mysterious as it seems), you will know the fundamental
    nature of how computer systems work and fit together. This means that every time
    you come across a new system, or piece of software, you will be ables to get to
    zero in on the key functions and properties, enabling you to get to grips with
    how it works, and discuss it confidently.


    Being secure in your ability to deal with computers and software will dramatically
    improve both your productivity and your speed with which you can get things done
    when working with technical staff in your company.


    # Understanding how software works


    One of the primary reasons programming is being taught to young children is because
    of the speed with which the world of software develops. Our current primary computing
    device, the smartphone, has only been around in its current form for 10 years.
    Who knows what devices we will be using 5, 10 or 20 years from now? Teaching children
    to code teaches them the fundamentals of how software works, which are not likely
    to change any time soon. This will enable them to quickly adapt to new operating
    systems, different programs or apps, and new devices.


    The same is true for adults – learning how computers work gives you the power
    to absorb new software and hardware into your workflow, making you more adaptable
    and essentially future-proofing your career.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Knowing what it takes


    Further to understanding how software works, learning to code gives you an awareness
    of what is involved in building a webform, or adding a feature to an app. It is
    likely at some point in your career that you will need to work directly with coders
    to add features to the company website, customize the software you use every day,
    or even to create a new app from scratch.


    If you are not aware of what is necessary to build a website, app or individual
    feature, you are open to overpaying for what you are getting, or not getting exactly
    what you wanted. Knowing what it takes to write some code gives you power in negotiations
    while managing a project, as well as the ability to get the job done quickly and
    to budget.


    # Building your own website or app


    Before the internet, if you wanted to share an idea, product or service with the
    world, there were significant obstacles to overcome. You would have had to publish
    information in a newspaper or book, or sell directly through shops. The web changed
    all that, and now you can build a website in a matter of hours which is immediately
    accessible to the 3 billion people currently online. The only obstacle is learning
    to code.


    To me that is a hugely exciting concept – coding enables you to build the equivalent
    of a worldwide shopfront with nothing but a laptop and a (free) text editor. No
    more bricks and mortar required.


    We''ll look at several different ways to build your own website and app (and why
    you might want to) throughout this book.


    # Building a web presence


    Eighty per cent of employers Google job applicants before inviting them for interview.
    Take a moment to search your own name and see what comes up. Is it what you want
    a potential employer to see? Creating a blog, portfolio site, or a simple site
    for a project you''ve undertaken or ebook you have written enables you to control
    what your future boss sees, and helps you stand out as an applicant.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Why coding?


    A web presence matters and learning to control yours will put you ahead of 95
    per cent of the population. We will cover the whys and hows of the creation of
    blogs and portfolio sites later on in this book.


    # Starting your own business


    “Technical founders’, ie people who want to start a business, and have coding
    skills, are so highly in demand that whole websites have been dedicated to the
    task, and the search phrase ‘find a technical cofounder’ has 3.2 million results
    on Google.


    Coding skills enable you to start any business you like, but they also enable
    you to partner with people and provide the technical expertise that all new companies
    need. Whether or not you want to start a company today, knowing that the opportunity
    is always there exciting, and we will look at the process in some detail later
    in this book. What entrepreneurial opportunities could learning to code bring
    you?


    # Taking on extra responsibilities within your current role


    In many jobs there is not an obvious process for advancement. Or perhaps there
    is a process but it is a slow one, and you are looking for opportunities to speed
    up your next promotion. It can be difficult to simply ‘do your job better’, or
    find other ways to stand out from the crowd.


    Learning to code gives you the ability to, for example, build an app that makes
    something that you and your colleagues regularly easier or more effective. You
    could create a webpage that helps people to arrange car sharing, or if you are
    a lawyer you could build an app to allow clients to instantly view the status
    of their case, and be automatically alerted to any updates. You could simply take
    responsibility for your area of the company website, making sure it is up to date
    and perhaps introducing tools and features that become popular with your customers
    or clients.


    Doing things like this might sound extraneous or unnecessary, but they will get
    you noticed, and it can be the beginning of something big. Even if you are not,
    you will learn a huge amount building your idea, and make lots of mistakes, which,
    with any luck, you won''t make next time round.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Aim to stop ‘selling your time''


    Through employment, most of us earn income by selling our time. If you love your
    job, that''s a perfectly reasonable arrangement, but for many of us the opportunity
    to ''scale up'' what we do would be welcome. Learning to code can provide that
    opportunity.


    If you are a teacher, create a website teaching people your subject, and sell
    advertising space. If you are an artist, create an app showcasing your work and
    selling prints. If you are an accountant, create a tool that simplifies your workflow
    and offer it to others for a small fee. I will take you by step through the process
    of creating something that people want later in the book, but start thinking about
    it now and jotting down ideas whenever you can.


    # Combine coding with your professional expertise


    Most full-time coders have only ever worked as developers. If you have a different
    professional background, combining that with coding can create something else
    to magic.


    > For me, it was the combination of coding and teaching that worked so well, but
    for you it might be coding and law, coding and accountancy, or coding and yoga
    (we''ll see an example for later on). Being an expert in a separate field lets
    you know what people like you want, what problems they have, and gives you insight
    into how those problems might be solved. Learning to code gives you the tools
    to actually solve them.


    # Coding is fun


    Coding can be a huge amount of fun, and very satisfying as you overcome problems
    and complete challenges. You may feel that you are not learning anything new in
    your day-to-day role, and learning to code gives you that buzz of acquiring new
    skills and understanding that you may not have felt since school or university.


    If you enjoy problem solving and creating things, you will likely find great enjoyment
    in completing a project, fixing bugs and creating websites'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'and apps. Crafting lines of code to get a computer to do your bidding is addictive
    in itself, and a wonderful break from the stress of everyday life.


    # Coding and specific industries


    Hopefully the above has given you ideas of how you could use coding skills in
    your current role, but if not here are a few concrete examples of how programming
    could improve your prospects in specific industries.


    # Law


    Technology is becoming increasingly central in every industry. Knowing how to
    code as a lawyer or accountant gives an edge with technical clients, enabling
    you to speak their language and see more clearly where they are coming from. Not
    only that, but technology pushes the law forward, forcing it to adapt to new possibilities
    and unforeseen situations. A sound grasp of the technologies themselves is a huge
    advantage in a fast-changing landscape.


    Legal practices also increasingly rely on technologies such as apps and websites
    for everyday office tasks, and the ability to streamline these processes can make
    you far more effective and efficient. You may also be able to please your clients
    better: the legal process can often seem slow and frustrating to both individuals
    and companies. Creating tools for them to see both what is happening and what
    they need to do in real time set your practice apart.


    # Sales and marketing


    Sales and marketing have been absolutely transformed by technology. The ability
    of marketers to measure the effect of their campaigns has changed the landscape
    entirely, and being comfortable with the latest technologies can set individual
    marketers and salespeople apart. Whether that''s through being able to write,
    edit and debug the HTML for your email marketing campaigns or automating repetitive
    tasks to free up you and your teammates'' time to develop innovative ideas.


    Even working with ''old media'' can be made vastly more efficient and effective
    when combined with technology, and if the tool doesn''t exist for you to properly
    manage your latest campaign, coding skills give you the power to create it.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Banking


    It goes without saying that technology is at the centre of banking today. Machines
    can make trades far quicker than humans can, and consumers are increasingly interacting
    with their banks online and through apps. Whatever your position in the banking
    sector, understanding the tools that you and your colleagues use every day enables
    you to use them more effectively.


    If you spend all day in Excel creating financial models, learning to code can
    not only help with the process of finding bugs in your formulas and check your
    results, but can also give you more powerful techniques to automate processes
    you are currently doing by hand.


    # Trade industries


    While the actual processes of building houses and fixing boilers are still the
    role of humans, a strong grasp of technology can still give people working in
    trade industries an edge. Customer service is an important aspect of any tradesperson''s
    role, and being able to swiftly reply to queries, arrange appointments automatically,
    and managing invoices and payments efficiently will not only save time but result
    in a much happier customer base, and repeat business.


    As with other sectors, if you create a tool that solves a problem for you, it
    is very likely others will be interested in using it too, and you will be perfectly
    placed to market your product or service to people in your industry.


    # Creative industries


    As a photographer, graphic artist or other creative professional, it is likely
    that you are already focused on technology, and are an advanced user of a range
    of complex software. But it is also likely that you find yourself doing the same
    processes repeatedly: exporting to various file types and sizes, applying filters,
    tweaking colour values and much more. Being able to automate some of these processes
    can make you more efficient and give your output a more consistent style.


    It is also inevitable that you will work with developers, perhaps to create your
    own portfolio site, or working together on a particular project. Being able to
    communicate effectively with them is crucial for a job to go well, and once you
    get to the level that you can build your own websites or apps, you can offer a
    more complete service to your clients.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Retail and service


    The retail and service industries are all about providing a great experience for
    your customers. That often means providing a great digital experience, which is
    more efficient for both the organization and the end-user. Having command of that
    technology and being able to create and customize features for your users, is
    highly attractive to employers, and enables you to do a better job day-to-day.


    # Summary


    These are just some of the very practical ways that learning to code can improve
    your prospects, make you more valuable as an employee and give your opportunities
    for greater freedom and career advancement. As Jason Calacanis, CEO of Mahalo
    and founder of the start-up showcase Launch says, ‘An employee who understands
    how to code is valued at $500,000 to $1 million toward the total acquisition price.’
    That’s a lot of value to create by learning a new skill.


    We will look in more detail at all of these opportunities later in this book,
    however, we will spend a little time demystifying coding. We will learn what exactly
    coding is, why there are so many coding languages and which ones you should learn.
    We''ll also see how both the internet and offline apps function, and familiarize
    you with the basic terminology that you will come across in this book (and in
    all those conversations with technical people that you are aware to have).


    On a final, more general note, I have found that learning to code gives people
    a great feeling of empowerment. Having the ability to create digital products
    such as apps and websites is something very few people can, and brings so much
    potential into your life. It has completely changed my life, and it can do the
    same for you.'
