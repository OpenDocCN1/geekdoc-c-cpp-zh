  md: 'Gruber’s story shows that writing a blog can be slow progress (it took him
    four years for it to produce a full-time income), you don''t need any special
    authority, experience or insider-knowledge to be successful. He was ‘just another’
    software developer who shared his opinions in a way that completely changed his
    life.


    # Muddy stilettos


    Blogs don''t have to offer incisive opinion or shocking truth – they can just
    be fun. Hero Brown launched http://muddystilettoos.co.uk/ in 2011 to help people
    in Buckinghamshire UK the best places to dine and shop. By November 2012, the
    blog had become Brown’s full-time job, and has since spread to providing first-hand
    information about restaurants, hotels and country life in nine counties.


    These are three examples of successful blogs, but there are many more. Mr Cassidy
    shares what his six years old gets up to http://mcassydclass.edublogs.org/. Mr.
    J Brown blogs about Yoga at www.brownyoga.com/, and is building an online workshop
    on the success of his writing. Mark Lee blogs about accounting at http://marksaccjokes.co.uk/,
    his blog forming the basis of his consultancy and public-speaking business.


    Whatever you want to achieve with your career, starting a blog is a great way
    to begin.


    # How to start a blog


    Creating a blog is like building any other website, so for buying domain names,
    getting web hosting and other general topics, I will refer you back to Chapter
    7. The main decision you need to make for your blog is what platform to use. As
    with web development, there are a selection of blogging platforms that you can
    use, including wordpress.com, tumblr.com and blogger.com. All of these will allow
    you to set your blog up quickly, but have the major disadvantage that you do not
    completely own your content. If you want to move to a different provider, this
    will be very difficult. You might also be limited to what features you can have,
    or what styles, layouts and website structures you can use.


    My advice would be to use a self-hosted platform, and by far the most common platform
    for bloggers is WordPress. (Note WordPress.com is essentially a hosted version
    of WordPress – they offer broadly the same features but with a self-hosted setup
    you have much greater control over your site.) For advice on setting up a hosting
    for your WordPress website, see Chapter 7.'
