  md: '# CSS project: clone a website


    A great way to practice CSS is to clone a website that you like the look of. You
    could start with something fairly simple, like www.google.com, and move on to
    something a little more complicated, such as bbc.co.uk/news. Pick any site you
    like, and try to create an accurate copy of it. It''s not an easy task (and it
    will probably involve plenty of googling), and you''ll learn a huge amount in
    the process.


    When you''re done, paste your code into a site like codepen.com, and share the
    link with me on Twitter (@techedrob). I look forward to seeing what you can create.


    # Summary


    Congratulations, you now know the basics of CSS. You know how to add a range of
    styles, layouts and formatting to a website, and combined with the HTML skills
    you learned in the previous chapter, you should be able to design pretty much
    any website you like.


    Having covered HTML (for content) and CSS (for style and layout), we will now
    be moving on to learning JavaScript, for interactivity. JavaScript will allow
    you to add a huge amount of power to your webpages, allowing the user to interact
    with them just like they would an app or piece of software. JavaScript is a whole
    new world of coding, so let''s get started.


    # Further learning


