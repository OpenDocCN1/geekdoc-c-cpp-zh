- img_proc: true
  md: '# An ebook


    I''m not suggesting you should write a great novel, but creating an ebook is much
    the same process as starting a business. Choosing a subject, you should look at
    something you could write confidently and competently about, and ideally a unique
    angle on. It doesn''t have to be a masterpiece, but should provide useful information
    that people are actively looking for. You can publish an ebook for free on Amazon.


    # A video course


    Various websites now allow you to upload and sell video courses, including udemy.com,
    stackskills.com and videodirect.amazon.com. As with ebooks, choose a topic that
    there is a market for, and that you could teach well.


    # A WordPress plugin or theme


    We have already seen that WordPress powers 25 per of the web. Therefore there
    is a huge potential market for addons and extras. There are also well-established
    platforms for providing your products directly to WordPress users. Themes are
    available at wordpress.org/themes/, and if you have a good eye you could easily
    create a popular theme. While all the themes on that page are free, you could
    charge for extra features, or sell your themes directly on sites like themeforest.com.


    WordPress plugins (wordpress.org/plugins/) add extra functionality to WordPress,
    and you can find plugins that do almost anything, speeding-up your website to
    creating a new social network. As themes, create a plugin that offers a new feature,
    or has better integration or a smoother user interface than the existing options.


    # Your unique selling point


    It is important to establish your unique selling point, or USP, for your business
    idea. This is the one reason that people should choose your product or service
    rather than anyone else''s. It might be because the product itself is higher quality,
    or faster, or better looking. Or your service might have some unique features
    that aren''t available anywhere else. Or it might be something tangential to the
    main business, such as customer service.


    For each of the business ideas you''ve written down so far, write down what the
    USP would be. If you can''t think of one, it''s likely that that idea will not
    go far.'
