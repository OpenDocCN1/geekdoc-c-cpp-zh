  md: '# JavaScript 05


    We’ve now looked at HTML for content, and CSS for style and layout. It’s time
    to bring in the third piece of the puzzle, JavaScript, which allows for interaction
    with the user. Unlike HTML and CSS, JavaScript is a ‘full’ programming language
    in the sense that we can use it to run computer programs: pieces of software that
    can do pretty anything the coder wants.


    In this chapter, we’ll cover:


    +   * what JavaScript is and how it is used;

    * how to use JavaScript to create an interactive webpage;

    * running JavaScript in response to a user action such as a click;

    * how to use JavaScript to:


    +   - change the content and style of web pages

    - use programming fundamentals such as loops and if statements

    - generate random numbers

    - create a ‘higher or lower’ guessing game.


    # What is JavaScript?


    JavaScript is our first ‘proper’ coding language. It allows us to use programming
    tools such as loops, variables and if statements (we’ll find out what these are
    shortly). It can be used for a whole range of tasks, from making a piece of text
    disappear when we click on it to creating full apps, such as the Google Docs suite
    of office applications.


    Any website that provides interactivity without reloading the page uses JavaScript.


    JavaScript was created in 10 days in May 1995 by Brendan Eich, working at Netscape,
    one of the first browsers. It was originally called Mocha, and then Livescript.
    Interestingly, it has nothing to do with the JavaScript programming language beyond
    the name. Netscape was given permission from Sun (who owned the Java language)
    to use the name JavaScript, primarily as a marketing technique, as Java was a
    very popular language at the time.'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# Languages


    JavaScript has gone through many iterations and developments, but the latest standard
    version (which we will learn here) is supported in all browsers, on both desktop
    and mobile platforms.


    One important aspect of JavaScript is that it runs on the user''s computer, rather
    than a server. This makes it what is known as a client-side language. Therefore
    to do anything requiring a server, such as sending an email, or signing up to
    your new social network, you''ll need to use a server-side language such as Python,
    which we will learn in the next chapter.


    # 5.1


    ![](img/57532e13229b6da209b2a527acf10e32_95_0.png)


    # Why learn JavaScript?


    If you''re not convinced already, the benefits of learning JavaScript are many.
    Primarily, it is our first ‘proper’ programming language, allowing us to develop
    full, interactive apps and websites, rather than just create layouts and static
    web pages.


    It''s also very similar to a number of other languages, so once you learn JavaScript,
    you''ll be able to start with any other language much more quickly.


    As JavaScript works in all browsers, you don''t need to download any extra software
    to get started with. And it uses classes and IDs, just like CSS, so it''s strongly
    linked to what you have already learned.


    It''s a simple language to get started with, but as with CSS is hugely power-full,
    and so is a great first coding language to learn.


    # What does JavaScript look like?


    JavaScript is very simple to get started with. To begin, go back to a basic HTML
    page in your text editor, and add a button using this code:


    ```

    <button>Click Me!</button>

    ```'
