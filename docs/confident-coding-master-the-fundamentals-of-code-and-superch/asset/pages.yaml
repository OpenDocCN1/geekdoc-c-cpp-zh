- img_proc: true
  md: '# Using coding to enhance your career


    Once you have set up the hosting, your hosting provider can guide you how to install
    Wordpress and the whole process, from buying a domain name to seeing your site
    live, shouldn''t take more than a few hours (and most of that time will be waiting
    for the website to become live).


    While it is possible to create a blog without any coding skills, you will be able
    to use your HTML and CSS experience to customize the look and feel of your site,
    rather than relying on the default look of available themes. You can also use
    JavaScript and other languages to customize the behaviour of your site and add
    specific functionality, such as a sign-up form or calendar.


    I hope by now you are seriously thinking about starting a blog, but if you are
    not quite ready for yet there are a number of other ways you can use coding to
    enhance your career prospects, or just to do your job more efficiently. We''ll
    start by looking at ways that we can automate or speed up tasks using code.


    # Finding tasks that can be automated


    In almost every job there is a part of the workflow that can be done more efficiently.
    If your job is marketing, you may well end up posting the same thing to Twitter,
    Facebook, and perhaps other social networks. If you write lots of emails, you
    might find that you type the same phrases, sentences or paragraphs over and over.
    In researching a book, you might want to collect email addresses from a number
    of websites. You may need to rename a large number of files. Or you may have a
    list of files, and need to search through them for specific words. We''ll see
    how to automate each of these tasks, and look at more general use-cases for the
    tools that we create.


    # If This Then That


    If This Then That (https://ifftttt.com/) is a web service that allows you to connect
    a huge range of other apps and automate various processes. Each process is known
    as an ''applet'', and range from ''save all photos I am tagged on Facebook to
    Dropbox'' to ''send me an email when it''s going to rain''. But there are a range
    of more useful applets, in particular ''Post your tweets to Facebook when you
    use a specific hashtag#'' (https://ifftttt.com/applets/112202p-post-your-tweets-to-facebook-when-you-use-a-specific-hashtag).
    This solves our first problem, and if managing social media accounts is part of
    your job, this can save a huge amount of time.'
