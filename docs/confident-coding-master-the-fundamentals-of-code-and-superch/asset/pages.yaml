    Before we write any code, with Android development we need to set the ''onClick''
    property for the button to tell the app name of the ''method'' that want to run
    when the button is clicked. A method is essentially the same as a function – a
    chunk of code that we can run by referring to its name.


    To set this up, click on the button and type ''buttonClicked'' in the onClick
    field. Now we need to write the buttonClicked method.


    We do this in the MainActivity.java file, so click on the MainActivity java tab
    above the editing window. In file you will see the following code:


