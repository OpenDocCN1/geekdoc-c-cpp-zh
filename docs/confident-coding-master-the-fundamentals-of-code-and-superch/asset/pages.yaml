  md: '# # What coding is 02


    For people who haven''t programmed before, coding can feel like a mysterious art.
    The mythical ''coder'' is someone who (usually while wearing headphones and listening
    to electronic music) can coax a computer into doing their bidding, but really,
    the whole process is much more straightforward than that.


    In this chapter, we will find out what programming is and write a few simple lines
    of code to get us started. We''ll also look at the different types of software
    we can produce with code, including websites, mobile apps and programs for desktop
    computers. Finally, we will learn some general coding processes that will stand
    you in good stead when we tackle our first coding language, HTML, in the next
    section.


    # # What is coding?


    Put simply, coding is the process of writing lines of instructions that make a
    computer (or tablet, phone, or watch) do something. But it''s a little more complicated
    than that, so let''s cover a little bit of background.


    The fundamental electrical component that allows a computer to do what it does
    is the **transistor** - a tiny piece of electronics that can either be on (allow
    electricity to pass through) or off (electricity cannot pass through). Current
    computer processors have around 2 billion transistors, which can turn on and off
    around 3 billion times every second. (Incidentally, *Homo sapiens* has 100 billion
    neurons which can turn on and off around 1,000 times a second, so we''re getting
    close to being able to simulate the power of a human brain.)


    What this is is computers ''think'' in terms of 1s and 0s, with 1 meaning ''on'',
    or true, and 0 meaning ''off'', or false. In the very early days of computing,
    the only way to communicate with a computer was to enter streams of 1s and 0s,
    but this of course wasn''t very practical. So generally computer ''languages''
    were developed, which allowed people to give the computer instructions in a more
    convenient way.


    A computer language is much like a human language such as English or Spanish,
    in the sense that each language has specific commands (words) and syntax (punctuation),
    so both the human and the computer can understand it. However, a key difference
    between computer languages and human'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Why coding?


    languages is that computer languages are absolutely precise and unambiguous. if
    you spell a command incorrectly, or forget a semicolon, it is likely that your
    whole code will fail. Unlike a human conversation, computers are extremely fussy
    about spelling and punctuation.


    The big advantage of this ambiguity is that you can be certain that if you get
    your code right the computer will do exactly what you want. Unlike human conversation,
    which can often result in unexpected outcomes, computers will always do exactly
    what is commanded of, whether you like it or not.


    # But I can control a computer without coding


    You might be thinking, ‘but i can do everything i need to with my computer and
    phone without needing to code.’ in the last 30 years or so highly-friendly operating
    systems such as Windows and MacOS (and Android and ios on mobile devices) have
    meant that we no longer have to write code to control a computer. Advanced Graphical
    User Interfaces (GUIs) have been developed so that anyone could approach a computer
    or phone and start using it straight away. this has been a great forward in usability,
    but it also means that many people are not aware of the power that they have at
    fingertips if they go beyond the everyday software like Word and Chrome.


    Every piece of software you have been written, by someone or, more likely, a group
    of people. every time you issue an instruction to siri, or enter a web address
    in a browser, a few (or a few thousand) lines of code are executed to answer your
    question or load a website. there is no magic behind this, it is simply the hard
    graft of thousands of developers and billions of transistors doing what they are
    told.


    Learning to code gives complete power over these transistors – you can bend them
    to your will by creating your own software, or automating processes to save you
    hours every day. coding is very much like a super-power, in that it enables you
    to use equipment you already have in a whole new way.


    # Let’s write some code


    Enough theory. let’s do some practice. in your browser, to go to the web address
    https://repl.it/languages/python3. this website allows us to write code in a computer
    language called Python (named after Monty Python – we’ll see'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'more about individual coding languages later in this chapter). It will then

    compile the code for us (essentially, turn it into 0s and 1s so that the computer

    understand it), and then display the output for us to see.


    In the main window, type the following code:


    ```

    print("Hello World")

    ```


    Now press the ‘run’ button to compile and run your code.


    You should see the phrase ‘Hello World’ appear in the black box of the right

    screen. Success! Now try misspelling ‘print’ or removing one of the

    brackets. If you run the code now, you will get an error, something like:


    NameError: name ''prin'' is not defined


    This should give you an idea of how precise you need to be – the computer

    won’t make a ‘best guess’ about what you meant; if you get your code even

    slightly wrong, nothing will happen at all. Let that be your first lesson!


    Let’s try something little more complicated. Have a look at the follow-

    ing code, and try to predict what it will do:


    ```

    for x in range(1, 11):

    print(x)

    ```


    Now delete your print statement and replace it with the above code. If you go

    er an error, check the code you have entered very carefully – you need to

    copy the code exactly.


    Note: the print command is indented using the tab key. If you type the

    first line correctly and then press enter, the website should know that you

    want to indent the second line, so will it for you automatically. If it

    does''t, press the tab key on your computer to indent it.


    Did it do what you expected? The ‘for’ command begins something

    called a ‘loop’, which executes a chunk of code several times. The x is a

    variable, which represents a value, in this case number. The ‘range(1,11)’

    parts the loop with x being 1, 2, 3, ... up to 10 (perhaps surpris-\ingly, the
    11 is not included in this code). Finally, the ‘print(x)’ part

    prints the value of the variable x. So the output is simple the numbers

    1 to 10.'
