  md: '# 4.18


    ![](img/57532e13229b6da209b2a527acf10e32_82_0.png)


    Now we have an attractive rounded rectangle (4.18). You can adjust the border-radius
    value to anything you like to increase the roundedness, but 5–10 pixels is usually
    about right for most situations.


    Question: What happens when you set the border-radius to 50%? Why? Answer: We
    get a circle.


    We get a circle because the radius of the curved edge is equal to half the width
    of the div (ie 100 pixels in this case). That means there is no room left for
    any straight edges – the whole of the border is rounded, and thus we are left
    with a circle.


    Note that the rounded corner is only applied to the background and not the content
    – you would have to add some padding to the div to position the text completely
    inside the circle.


