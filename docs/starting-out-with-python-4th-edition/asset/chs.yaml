  4.  5.4 函数如何让多个程序的开发更快？\n5.  5.5 函数如何让团队更容易开发程序？\n\n## 5.2 定义和调用空函数\n\n### 概念：\n\
  \n函数的代码被称为函数定义。要执行函数，你需要编写调用它的语句。\n\n### 函数名称\n\n在讨论创建和使用函数之前，我们应该提到关于函数名的几点。就像你命名程序中的变量一样，你也为函数命名。函数的名称应该具有足够的描述性，以便任何阅读代码的人都能合理地推测函数的作用。\n\
  \nPython 要求你遵循与命名变量时相同的规则，我们在此进行回顾：\n\n*   不能使用 Python 的关键字作为函数名。（请参[表 1-2](#fileP7001013980000000000000000000419.xhtml_P700101398000000000000000000049F）获取关键字列表。）\n\
  *   函数名称不能包含空格。\n*   第一个字符必须是字母 a-z、A-Z 或下划线字符（_`）。\n*   在第一个字符之后，可以使用字母 a-z 或 A-Z、数字\
  \ 0-9 或下划线。\n*   大写字母和小写字母是区分的。\n\n\n\n\n因为函数执行的是动作，所以大多数程序员倾向于在函数名中使用动词。例如，一个计算总工资的函数可能会命名为\
  \ `calculate_gross_pay`。这个名称会让任何阅读代码的人显而然看出该函数正在计算某些内容。它在计算什么？当然是总工资。其他良好的函数命名示例还有\
  \ `get_hours`、`get_pay_rate`、`calculate_overtime`、`print_check` 等。每个函数名都描述了函数的功能。\n\
  \n# 定义和调用函数\n\n要创建一个函数，你需要编写它的 `definition`（定义）。以下是 Python 中函数定义的通用格式：\n\n```\n\
  def function_name():\n    statement\n    statement\n    etc.\n```\n\n第一行被称为 `function\
  \ header`（函数头）。它标记了函数定义的开始。函数头以关键字 `def` 开头，后面跟着函数名、是一组括号，最后是一个冒号。\n\n从下一行开始是一组被称为\
  \ `block`（块）的语句。`block` 简单来说就是一组属于同一个整体的语句集合。每当执行该函数时，这些语句都会执行。注意通用格式，块中的所有语句都缩进了。这种缩进是必须的，因为\
  \ Python 解释器利用它来判断块的开始和结束。\n\n让我们来看一个函数的示例。请记住这不是完整的程序。我们稍后会展示整个程序。\n\n```\ndef\
  \ message():\n    print('I am Arthur,')\n    print('King of the Britons.')\n```\n\
  \n这段代码定义了一个名为 `message` 的函数。`message` 函数包含一个带有两条语句的 `block`。执行该函数将导致这些语句执行。\n\n\
  # 调用函数\n\n函数定义指定了函数的功能，但它不会导致函数的执行。要执行一个函数，你必须 `call`（调用）它。这就是我们调用 `message` 函数的方式：\n\
  \n```\nmessage()\n```\n\n当函数被调用时，解释器会跳转到该函数并执行其块中的语句。然后，当到达块的结尾时，解释器会跳回调用函数的程序部分，程序从该点继续执行。当发生这种情况时，我们说该函数\
  \ `returns`（返回）。为了充分演示函数调用的工作原理，我们将查看程序 5-1。\n\n# 程序 5-1 `(function_demo.py)`\n\n\
  ```\n 1  # 这个程序演示了一个函数。\n 2  # 首先，我们定义了一个名为 message 的函数。\n 3  def message():\n 4\
  \      print('I am Arthur,')\n 5      print('King of the Britons.')\n 6\n 7  # 调用\
  \ message 函数。\n 8  message()\n```\n\n### 程序输出\n\n```\nI am Arthur,\nKing of the\
  \ Britons.\n```\n\n让我们逐步通过这个程序，并检查运行时发生了什么。首先，解释器忽略第 1 行和第 2 行中的注释。然后，它 `reads`（读取）第\
  \ 3 行的 `def` 语句。这导致内存中创建一个名为 `message` 的函数，包含第 4 行和第 5 行的语句块。（记住，函数定义创建了一个函数，但它不会导致函数的执行。）接下来，解释器遇到第\
  \ 7 行的注释，并将其被忽略。然后它执行第 8 行的语句，这是一个函数调用。这导致 `message` 函数执行，打印出两行输出。图 5-2 展示了该程序的各个部分。\n\
