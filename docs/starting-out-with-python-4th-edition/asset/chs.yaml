  \ 标志应该在图形窗口中居中。\n\n# 第 5 章函数\n\n## 5.1 函数简介\n\n### 概念：\n\n函数是程序中存在的一组，用于执行特定的任务。\n\
  \n在第 2 章中，我们描述了一种计算员工工资的简单算法。在算法中，工作小时数乘以时薪率。然而，一个更真实的工资算法执行的操作将比这多得多。在实际应用中，计算员工工资的总任务将由几个子任务组成，例如：\n\
  \n*   获取员工的时薪率\n*   获取工作小时数\n*   计算员工的总工资\n*   计算加班费\n*   计算税收和福利的扣除额\n*   计算净工资\n\
  *   打印工资单\n\n大多数程序执行的任务足够大，可以拆分为若干个子任务。由于这个原因，程序员通常将程序拆分成较小的、易于管理的单元，称为函数。`function`\
  \ 是程序中存在的一组，用于执行特定的任务。与其将一个大型程序写成一长长语句序列，不如将其写成几个小函数，每个函数负责执行任务的特定部分。这些小函数可以按照所需的顺序执行，以完成整体任务。\n\
  \n这种方法有时被称为`分治法`（divide and conquer），因为将一个大任务拆分成若干个易于执行的小任务。图 5-1 通过比较两个程序展示了这一思想：一个使用长而复杂的语句序列来执行任务，另一个将任务划分为更小的任务，每个任务都由一个独立的函数执行。\n\
  \n![一张说明使用函数分治法处理大任务的图表。](img/fg05_00100.png)\n\n# 图 5-1 使用函数分治法处理大任务\n\n图 5-1 完整替代文本\n\
  \n在程序中使用函数时，你通常会将程序中的每个任务隔离在它自己的函数中。例如，一个真实的工资计算程序可能包含以下函数：\n\n*   一个获取员工时薪率的函数\n\
  *   一个获取工作小时数的函数\n*   一个计算员工总工资的函数\n*   一个计算加班费的函数\n*   一个计算税收和福利扣除额的函数\n*   一个计算净工资的函数\n\
  *   一个打印工资单的函数\n\n将每个任务编写在自己独立函数中的程序被称为`模块化程序`（modularized program）。\n\n## 使用函数进行程序模块化的好处\n\
  \n当程序被拆分为函数时，可以在以下几个方面受益：\n\n### 代码更简单\n\n当将程序拆分为函数时，程序的代码往往变得更简单、更容易理解。几个小函数比一长长语句序列要易读得多。\n\
  \n### 代码复用\n\n函数还减少了程序内部的代码重复。如果程序中的多处执行某个特定操作，可以写一次函数来执行该操作，然后在需要时随时执行。使用函数的这种优势被称为`代码复用`（code\
  \ reuse），因为你只需要编写一次代码来执行任务，然后在每次需要执行该任务时复用它。\n\n### 更好的测试\n\n当程序中的每个任务都包含在自己的函数中，测试和调试变得更简单。程序员可以单独测试程序中的每个函数，以确定其是否正确执行了操作。这使得更容易隔离和修复错误。\n\
  \n### 更快的开发\n\n假设一个程序员或程序员团队正在开发多个程序。他们发现每个程序都执行几个几个共同的任务，例如请求用户名和密码、显示当前时间等。多次为这些任务编写代码是没有意义的。相反，可以为常用任务编写函数，并将这些函数整合到需要它们的每个程序中。\n\
  \n### 更易促进团队协作\n\n函数还让程序员在团队中工作变得更容易。当程序被开发为一组执行独立任务的函数时，不同的程序员可以被分配编写不同的函数。\n\n\
  ### 空函数与返回值函数\n\n在本章中，你将学习两种函数：空函数和返回值函数。当你调用空函数时，它只执行包含的语句并结束。当你调用返回值函数时，它执行包含的语句，并返回一个值。`input`\
  \ 函数就是返回值函数的示例。当你调用 `input` 函数时，它获取用户输入的数据并作为字符串返回。`int` 和 `float` 函数也是返回值函数的示例。你将参数传递给\
  \ `int` 函数，它返回将参数转换为整数。同样，你将参数传递给 `float` 函数，它返回将参数转换为浮点数。\n\n你将学习的第一种函数是空函数。\n\n\
