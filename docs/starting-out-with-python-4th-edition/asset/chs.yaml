  # 9.2 集合 (Sets)\n\n### 概念\n\n集合包含一组唯一的值，其工作方式类似于数学中的集合。\n\n`set` 是一个对象，以与集合相同的方式存储一组数据。这里有关于集合的一些需要了解的重要点：\n\
  \n* 集合中的所有元素必须是唯一的。没有两个元素具有相同的值。\n* 集合是无序的，这意味着集合中的元素不是按照任何特定顺序存储的。\n* 存储在集合中的元素可以是不同的数据类型。\n\
  \n### 创建集合\n\n要创建一个集合，你必须调用内置的 `set` 函数。这里是如何创建一个空集合的示例：\n\n```\nmyset = set()\n\
  ```\n\n执行此语句后，变量 `myset` 将引用一个空集合。你也可以向 `set` 函数传递一个参数。你传递的参数必须是一个包含包含可迭代元素的对象，例如列表、元组或字符串。你作为参数传递的对象的每一个元素将成为集合的元素。这里有一个示例：\n\
  \n```\nmyset = set(['a', 'b', 'c'])\n```\n\n在这个示例中，我们将一个列表作为参数传递给 `set` 函数。执行此语句后，变量\
  \ `myset` 引用包含元素 `'a'`、`'b'` 和 `'c'` 的集合。\n\n如果你将字符串作为参数传递给 `set` 函数，字符串中的每个字符将成为集合的成员。这里有一个示例：\n\
  \n```\nmyset = set('abc')\n```\n\n执行此语句后，变量 `myset` 将引用包含元素 `'a'`、`'b'` 和 `'c'`\
  \ 的集合。\n\n集合不能包含重复元素。如果你向 `set` 函数传递包含重复元素的参数，重复元素中只有一个会出现在集合中。这里有一个示例：\n\n```\n\
  myset = set('aaabc')\n```\n\n字符 `'a'` 在字符串中出现了多次，但它在集合中只会出现一次。执行此语句后，变量 `myset`\
  \ 将引用包含元素 `'a'`、`'b'` 和 `'c'` 的集合。\n\n如果你想创建一个每个元素都是包含多个字符的字符串的集合该怎么办？例如，你如何创建一个包含元素\
  \ `'one'`、`'two'` 和 `'three'` 的集合？以下代码没有完成此任务，因为你向 `set` 函数传递的参数不能一个：\n\n```python\n\
  # 这是一个错误！\nmyset = set('one', 'two', 'three')\n```\n\n以下代码也没有完成此任务：\n\n```python\n\
  # 这不符合我们的意图。\nmyset = set('one two three')\n```\n\n执行此语句后，变量 `myset` 将引用包含元素 `'o'`、`'n'`、`'e'`、`'\
  \ '`、`'t'`、`'w'` 的集合。为了创建我们想要的集合，我们必须将一个包含字符串 `'one'`、`'two'` 和 `'three'` 的列表作为参数传递给\
  \ `set` 函数。这里有一个示例：\n\n```python\n# 好的，这可行。\nmyset = set(['one', 'two', 'three'])\n\
  ```\n\n执行此语句后，变量 `myset` 将引用包含元素 `'one'`、`'two'` 和 `'three'` 的集合。\n\n### 获取集合中的元素数量\n\
  \n与列表、元组和字典一样，你可以使用 `len` 函数获取集合中元素的数量。以下交互式会话演示：\n\n```\n1  >>> myset = set([1,\
  \ 2, 3, 4, 5]) \n2  >>> len(myset) \n3  5\n4  >>>\n```\n\n### 添加和移除元素\n\n集合是可变对象，因此你可以向它们添加项并从它们中移除项。你使用\
  \ `add` 方法向集合添加一个元素。以下交互式会话演示：\n\n```\n1  >>> myset = set() \n2  >>> myset.add(1)\
  \ \n3  >>> myset.add(2) \n4  >>> myset.add(3) \n5  >>> myset \n6  {1, 2, 3}\n7 \
  \ >>> myset.add(2) \n8  >>> myset\n9  {1, 2, 3}\n```\n\n第 1 行的语句创建一个空集合并将其赋值给变量\
  \ `myset`。第 2 行到第 4 行的语句将值 1、2 和 3 添加到集合中。第 5 行显示集合的内容，如第 6 行所示。\n\n第 7 行的语句尝试向集合添加值\
  \ 2。然而，值 2 已经在集合中了。如果你尝试使用 `add` 方法向集合添加重复项，该方法不会抛出异常。它只是简单不再添加该项。\n\n你可以使用 `update`\
  \ 方法一次性向集合添加一组元素。当你调用 `update` 方法并传递参数时，你传递的是一个包含可迭代元素的对象，例如列表、元组、字符串或另一个集合。你作为参数传递的对象的每一个元素将成为集合的元素。以下交互式会话演示：\n\
  \n```\n1  >>> myset = set([1, 2, 3]) \n2  >>> myset.update([4, 5, 6]) \n3  >>> myset\
  \ \n4  {1, 2, 3, 4, 5, 6}\n5  >>>\n```\n\n第 1 行的语句创建一个包含值 1、2 和 3 的集合。第 2 行添加了值\
  \ 4、5 和 6。接下来的会话显示了另一个示例：\n\n```\n1  >>> set1 = set([1, 2, 3]) \n2  >>> set2 = set([8,\
  \ 9, 10]) \n3  >>> set1.update(set2) \n4  >>> set1\n5  {1, 2, 3, 8, 9, 10}\n6  >>>\
  \ set2 \n7  {8, 9, 10}\n8  >>>\n```\n\n第 1 行创建一个包含值 1、2 和 3 的集合并将其赋值给变量 `set1`。第\
  \ 2 行创建一个包含值 8、9 和 10 的集合。第 3 行调用 `set1.update(set2)`。第 4 行显示 `set1` 内容为 `{1, 2,\
  \ 3, 8, 9, 10}`。第 6 行显示 `set2` 为 `{8, 9, 10}`。\n\n（注：原文此处存在部分逻辑描述重复或错乱，已按要求对应翻译）\n\
  \n\n\n\n你可以使用以下通用格式的 `for` 循环来遍历集合中的所有元素：\n\n```\nfor var in set:\n    statement\n\
  \    statement\n    etc.\n```\n\n在通用格式中，`var` 是变量名，`set` 是集合名。该循环会为集合中的每个元素迭代一次。每次迭代时，`var`\
  \ 都会被赋值一个元素。下面的交互式演示演示了：\n\n```\n1  >>> myset = set(['a', 'b, 'c']) \n2  >>> for\
  \ val in myset: \n3         print(val)  \n4  \n5  a\n6  c\n7  b\n8  >>>\n```\n\n\
  第 2 行到第 3 行包含一个 `for` 循环，它为 `myset` 集合的每个元素迭代一次。每次迭代时，集合中的元素会被赋值给变量 `val`。第 3 行打印\
  \ `val` 变量的值。第 5 行到第 7 行显示循环的输出。\n\n# 使用 `in` 和 `not in` 运算符测试集合中的值\n\n你可以使用 `in`\
  \ 运算符来确定一个值是否存在于集合中。下面的交互式演示了：\n\n```\n1  >>> myset = set([1, 2, 3]) \n2  >>> if\
  \ 1 in myset: \n3         print('The value 1 is in the set.')   \n4  \n5  The value\
  \ 1 is in the set.\n6  >>>\n```\n\n第 2 行的 `if` 语句判断值 1 是否在 `myset` 集合中。如果是，第 3 行的语句将显示消息。\n\
  \n你也可以使用 `not` `in` 运算符来确定一个值是否不在集合中，如下所示所示：\n\n```\n1  >>> myset = set([1, 2, 3])\
  \ \n2  >>> if 99 not in myset: \n3         print('The value 99 is not in the set.')\
  \  \n4  \n5  The value 99 is not in the set.\n6  >>>\n```\n\n# 集合的并集\n\n两个集合的并集包含这两个集合的所有元素的集合。在\
  \ Python 中，你可以调用 `union` 方法来获取两个集合的并集。通用格式如下：\n\n```\nset1.union(set2)\n```\n\n\
  在通用格式中，`set1` 和 `set2` 是集合。该方法返回一个包含 `set1` 和 `set2` 元素的集合。下面的交互式演示了：\n\n```\n1\
  \  >>> set1 = set([1, 2, 3, 4]) \n2  >>> set2 = set([3, 4, 5, 6]) \n3  >>> set3\
  \ = set1.union(set2) \n4  >>> set3 \n5  {1, 2, 3, 4, 5, 6}\n6  >>>\n```\n\n第 3 行的语句调用\
  \ `set1` 对象的 `union` 方法，并将 `set2` 作为参数传递。该方法返回一个包含 `set1` 和 `set2` 所有元素的集合（当然，是不重复的）。结果集合被赋值给变量\
  \ `set3`。\n\n你也可以使用 `|` 运算符来寻找两个集合的并集。以下使用 `|` 运算符处理两个集合的表达式的通用格式：\n\n```\nset1\
  \ | set2\n```\n\n在通用格式中，`set1` 和 `set2` 是集合。该表达式返回一个包含 `set1` 和 `set2` 元素的集合。下面的交互式演示了：\n\
  \n```\n1  >>> set1 = set([1, 2, 3, 4]) \n2  >>> set2 = set([3, 4, 5, 6]) \n3  >>>\
  \ set3 = set1 | set2 \n4  >>> set3 \n5  {1, 2, 3, 4, 5, 6}\n6  >>>\n```\n\n# 集合的交集\n\
  \n两个集合的交集是一个仅包含两个集合中共有元素的集合。在 Python 中，你可以调用 `intersection` 方法来获取两个集合的交集。通用格式如下：\n\
  \n```\nset1.intersection(set2)\n```\n\n在通用格式中，`set1` 和 `set2` 是集合。该方法返回一个包含 `set1`\
  \ 和 `set2` 中共有元素的集合。下面的交互式演示了：\n\n```\n1  >>> set1 = set([1, 2, 3, 4]) \n2  >>>\
  \ set2 = set([3, 4, 5, 6]) \n3  >>> set3 = set1.intersection(set2) \n4  >>> set3\
  \ \n5  {3, 4}\n6  >>>\n```\n\n第 3 行的语句调用 `set1` 对象的 `intersection` 方法，并将 `set2`\
  \ 作为参数传递。该方法返回一个包含 `set1` 和 `set2` 中共有元素的集合。结果集合被赋值给变量 `set3`。\n\n你也可以使用 `&` 运算符来寻找两个集合的交集。以下使用\
  \ `&` 运算符处理两个集合的表达式的通用格式：\n\n```\nset1 & set2\n```\n\n在通用格式中，`set1` 和 `set2` 是集合。该表达式返回一个包含\
  \ `set1` 和 `set2` 中共有元素的集合。下面的交互式演示了：\n\n```\n1  >>> set1 = set([1, 2, 3, 4]) \n\
  2  >>> set2 = set([3, 4, 5, 6]) \n3  >>> set3 = set1 & set2 \n4  >>> set3 \n5  {3,\
  \ 4}\n6  >>>\n```\n\n# 集合的差\n\n`set1` 和 `set2` 的差是出现在 `set1` 中但不在 `set2` 中的元素。在\
  \ Python 中，你可以调用 `difference` 方法来获取两个集合的差。通用格式如下：\n\n```\nset1.difference(set2)\n\
  ```\n\n在通用格式中，`set1` 和 `set2` 是集合。该方法返回一个包含于 `set1` 中不在 `set2` 中的元素的集合。下面的交互式演示了：\n\
  \n```\n1  >>> set1 = set([1, 2, 3, 4]) \n2  >>> set2 = set([3, 4, 5, 6]) \n3  >>>\
  \ set3 = set1.difference(set2) \n4  >>> set3 \n5  {1, 2}\n6  >>>\n```\n\n你也可以使用\
  \ `-` 运算符来寻找两个集合的差。以下使用 `-` 运算符处理两个集合的表达式的通用格式：\n\n```\nset1 - set2\n```\n\n在通用格式中，`set1`\
  \ 和 `set2` 是集合。该表达式返回一个包含 `set1` 中不在 `set2` 中的元素的集合。下面的交互式演示了：\n\n```\n1  >>> set1\
  \ = set([1, 2, 3, 4]) \n2  >>> set2 = set([3, 4, 5, 6]) \n3  >>> set3 = set1 - set2\
  \ \n4  >>> set3 \n5  {1, 2}\n6  >>>\n```\n\n# 集合的对称差集\n\n两个集合的对称差集是一个包含集合不共享元素的集合。也就是说，它是出现在其中一个集合但不在两个集合中的元素。在\
  \ Python 中，你可以调用 `symmetric_difference` 方法来获取两个集合的对称差集。通用格式如下：\n\n```\nset1.symmetric_difference(set2)\n\
  ```\n\n在通用格式中，`set1` 和 `set2` 是集合。该方法返回一个出现在 `set1` 或 `set2` 中但不在两者中的元素的集合。下面的交互式演示了：\n\
  \n```\n1  >>> set1 = set([1, 2, 3, 4]) \n2  >>> set2 = set([3, 4, 5, 6]) \n3  >>>\
  \ set3 = set1.symmetric_difference(set2) \n4  >>> set3 \n5  {1, 2, 5, 6}\n6  >>>\n\
  ```\n\n你也可以使用 `^` 运算符来寻找两个集合的对称差集。以下使用 `^` 运算符处理两个集合的表达式通用格式：\n\n```\nset1 ^ set2\n\
  ```\n\n在通用格式中，`set1` 和 `set2` 是集合。该表达式返回一个出现在 `set1` 或 `set2` 中但不在两者中的中的集合。下面的交互式演示了：\n\
  \n```\n1  >>> set1 = set([1, 2, 3, 4]) \n2  >>> set2 = set([3, 4, 5, 6]) \n3  >>>\
  \ set3 = set1 ^ set2 \n4  >>> set3 \n5  {1, 2, 5, 6}\n6  >>>\n```\n\n# 子集与超集\n\n\
  假设你有两个集合，其中一个集合包含了另一个集合的所有元素。例如：\n\n```\nset1 = set([1, 2, 3, 4])\nset2 = set([2,\
  \ 3])\n```\n\n在这个例子中，`set1` 包含了 `set2` 的所有元素，这意味着 `set2` 是 `set1` 的子集。这也意味着 `set1`\
  \ 是 `set2` 的超集。在 Python 中，你可以调用 `issubset` 方法来判断一个集合是否是另一个集合的子集。通用格式如下：\n\n```\n\
  set2.issubset(set1)\n```\n\n在通用格式中，`set1` 和 `set2` 是集合。如果 `set2` 是 `set1` 的子集，该方法返回\
  \ `True`。否则返回 `False`。你可以调用 `issuperset` 方法来判断一个集合是否是另一个集合的超集。通用格式如下：\n\n```\nset1.issuperset(set2)\n\
  ```\n\n在通用格式中，`set1` 和 `set2` 是集合。如果 `set1` 是 `set2` 的超集，该方法返回 `True`。否则返回 `False`。下面的交互式演示了：\n\
  \n```\n1  >>> set1 = set([1, 2, 3, 4]) \n2  >>> set2 = set([2, 3]) \n3  >>> set2.issubset(set1)\
  \ \n4  True\n5  >>> set1.issuperset(set2) \n6  True\n7  >>>\n```\n\n\n\n你也可以使用 `<=`\
  \ 运算符来判断一个集合是否是另一个集合的子集，使用 `>=` 运算符来判断一个集合是否是另一个集合的超集。以下是使用两个集合的 `<=` 运算符通用格式：\n\
  \n```\nset2 <= set1\n```\n\n在通用格式中，`set1` 和 `set2` 是集合。如果 `set2` 是 `set1` 的子集，该表达式返回\
  \ `True`。否则返回 `False`。以下是使用两个集合的 `>=` 运算符通用格式：\n\n```\nset1 >= set2\n```\n\n在通用格式中，`set1`\
  \ 和 `set2` 是集合。如果 `set1` 是 `set2` 的子集，该表达式返回 `True`。否则返回 `False`。接下来的交互式演示了：\n\n\
  ```\n1  >>> set1 = set([1, 2, 3, 4]) \n2  >>> set2 = set([2, 3]) \n3  >>> set2 <=\
  \ set1 \n4  True\n5  >>> set1 >= set2 \n6  True\n7  >>> set1 <= set2 \n8  False\n\
  ```\n\n### ![](img/ICON_CHECKPT.png) 检查点\n\n1. 9.14 集合中的元素是有序的还是无序的？\n2. 9.15 集合允许你存储重复元素吗？\n\
