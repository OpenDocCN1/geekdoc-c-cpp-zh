  \ < 3:\n    turtle.pensize(3)\n```\n\n### 确定乌龟的动画速度\n\n当你执行 `turtle.speed()` 函数且不传递任何参数时，该函数会返回乌龟当前的动画速度。下面的交互式演示了这一点：\n\
