  \ 的创建者通常被称为“BDFL”。这意味着什么？\n\n# 第 2 章 输入、处理与输出\n\n## 2.1 设计程序\n\n### 概念\n程序在编写之前必须经过仔细设计。在设计过程中，程序员使用伪代码和流程图等工具创建程序模型。\n\
  \n### 程序开发周期\n\n在第 1 章中，你学习了程序员通常使用 Python 等高级语言来创建程序。然而，创建一个程序远不仅仅是编写代码。创建一个运行正确的程序通常需要图\
  \ 2-1 所示的五个阶段。整个过程被称为 `程序开发周期`。\n\n![展示程序开发周期的流程图。](img/fg02_00100.png)\n\n### 图\
  \ 2-1 程序开发周期\n\n图 2-1 完整替代文本\n\n让我们详细查看循环中的每个阶段。\n\n\n\n\n\n### 1. 设计程序\n所有专业程序员都会告诉你，在实际编写代码之前，应该对程序进行仔细的设计。当程序员开始一个新项目时，他们绝不应该直接跳进去并将编写代码作为第一步。他们应该从创建程序的设计开始。设计程序有多种方法，在本节的稍后部分，我们将讨论一些你可以用于设计\
  \ Python 程序的技巧。\n\n### 2. 编写代码\n设计好程序后，程序员开始使用 Python 等高级语言编写代码。回想第 1 章可知，每种语言都有自己的规则，称为语法，在编写程序时必须遵循这些规则。语言的语法规则规定了关键字、运算符和标点符号如何如何使用等。如果程序员违反了这些规则中的任何一条，就会发生语法错误。\n\
  \n### 3. 修正语法错误\n如果程序包含语法错误，甚至是一个简单的错误（如拼写错误的关键字），编译器或解释器都会显示一条错误消息，指示错误是什么。初次编写时几乎所有的代码都包含语法错误，因此程序员通常会花一些时间来修正这些错误。一旦修正了所有的语法错误和简单的输入错误，程序就可以被编译并翻译成机器语言程序（或根据所使用的语言由解释器执行）。\n\
  \n### 4. 测试程序\n一旦代码转换成可执行的形式，就会对其进行测试，以确定是否存在逻辑错误。`logic error`（逻辑错误）是一种不会阻止程序运行但会导致产生错误结果的错误。（数学错误是逻辑错误的常见原因。）\n\
  \n### 5. 修正逻辑错误\n如果程序产生错误的结果，程序员就会对代码进行`debugs`（调试）。这意味着程序员发现并修正程序中的逻辑错误。有时在这个过程中，程序员会发现程序的原始设计必须更改。在这种情况下，程序开发周期将重新开始，并持续直到找不到错误为止。\n\
  \n#更多关于设计过程\n设计程序的过程可以认为是循环中最重要的部分。你可以将程序的设计看作它的基础。如果你在一个建造糟糕的地基上盖房子，最终你会发现自己必须花费大量工作来修理房子！程序的设计也应该这样视之。如果你的程序设计得不好，最终你会发现自己必须花费大量工作来修复程序。\n\
  \n设计程序的过程可以总结为以下两个步骤：\n\n1. 理解程序要执行的任务。\n2. 确定执行该任务必须采取的步骤。\n\n让我们详细查看这些每一个步骤。\n\
  \n### 理解程序要执行的任务\n在确定程序将执行的步骤之前，理解程序应该做什么是关重要的。通常情况下，专业程序员通过与客户直接合作来获得这种理解。我们使用`customer`（客户）一词来描述要求你编写程序的人、团体或组织。这可能是传统意义上的客户，即付钱让你写程序的人。它也可能是你的老板，或者是公司内部某个部门的经理。无论是谁，客户都将依靠你的程序来执行重要任务。\n\
  \n为了了解程序应该做什么，程序员通常会对客户进行访谈。在访谈期间，客户将描述程序应该执行的任务，程序员将提问以尽可能地揭示有关任务的细节。通常需要进行后续访谈，因为客户在初始会议中很少提到他们想要的所有内容，而且程序员往往会想到额外的问题。\n\
