  6. 10.10 `__str__` 方法的作用是什么？\n7. 10.11 你如何调用 `__str__` 方法？\n\n# 10.3 实例的操作\n\n##\
  \ 概念 (Concept)\n类的每个实例都有自己的一组属性。当方法使用 `self` 参数来创建一个属性时，该属性属于 `self` 所引用的特定对象。我们称这些为实例属性（instance\
  \ attributes），因为它们属于类的某个特定实例。\n\n可以创建同一个类的许多个实例。每个实例都将拥有自己的一组属性。例如，查看程序 10-11。该程序创建了\
  \ `Coin` 类的三个实例。每个实例都有它自己的 `sideup` 属性。\n\n## 程序 10-11 (coin_demo.py)\n\n```python\n\
  # 此程序导入并\n# 创建了 Coin 类的三个实例。\nimport coin\n\ndef main():\n    # 从 Coin 类创建三个对象。\n\
  \    coin1 = coin.Coin()\n    coin2 = coin.Coin()\n    coin3 = coin.Coin()\n\n \
  \   # 显示每枚硬币朝上的一面。\n    print('I have three coins with these sides:')\n    print(coin1.getsideup())\n\
  \    print(coin2.getsideup())\n    print(coin3.getsideup())\n\n    # 掷硬币。\n    print('I\
  \ am tossing all coins ...')\n    coin1.toss()\n    coin2.toss()\n    coin3.toss()\n\
  \n    # 显示每枚硬币朝上的一面。\n    print('Now here are the sides that up:')\n    print(coin1.getsideup())\n\
  \    print(coin2.getsideup())\n    print(coin3.getsideup())\n\n# 调用 main 函数。\nmain()\n\
  ```\n\n**程序输出**\n\n```\nI have three coins with these sides:\nHeads\nHeads\nHeads\n\
  I am tossing all coins ...\nNow here are the sides that up:\nTails\nTails\nHeads\n\
  ```\n\n在第 8 行到第 10 行，以下语句创建了三个对象，每个都是 `Coin` 类的实例：\n\n```python\ncoin1 = coin.Coin()\n\
  coin2 = coin.Coin()\ncoin3 = coin.Coin()\n```\n\n说明了在这些语句执行后，`coin1`、`coin2` 和 `coin3`\
  \ 变量是如何引用这三个对象的。注意每个对象都有自己的 `sideup` 属性。第 14 行到第 16 行显示了每个对象的 `getsideup` 方法返回的值。\n\
  \n然后，第 22 行到第 24 行的语句调用了每个对象的 `toss` 方法：\n\n```python\ncoin1.toss()\ncoin2.toss()\n\
  coin3.toss()\n```\n\n展示了这些语句如何在程序的示例运行更改每个对象的 `sideup` 属性。\n\n# 访问器和修改器方法 (Accessor\
  \ and Mutator Methods)\n\n正如前面提到的，常见的做法是将类所有的数据属性都设为私有，并提供公共方法来访问和更改这些属性。这确保了拥有属性的对象对对其发生的所有更改具有控制权。\n\
  \n\n\n\n\n一种从类的属性返回值但不对其进行修改的方法被称为 `accessor method`（访问器方法）。访问器方法为类外部代码提供了一种安全的方法来获取属性值，而不会以可能被外部代码更改的方式暴露属性。在程序\
  \ 10-12 中看到的 `CellPhone` 类（在之前的*焦点聚焦*部分中），`get_manufact`、`get_model` 和 `get_retail_price`\
  \ 方法就是访问器方法。\n\n将值存储在数据属性或以其他方式更改数据属性值的方法被称为 `mutator method`（修改器方法）。修改器可以控制类数据属性被修改的方式。当类外部需要更改对象数据属性的值时，通常会调用修改器并将新值作为参数传递。如果有必要，修改器可以在将值赋值给数据属性之前对其进行验证。在程序\
  \ 10-12 中，`set_manufact`、`set_model` 和 `set_retail_price` 方法是修改器方法。\n\n### ![](img/ICON_NOTE.png)\
  \ 注意：\n\n修改器方法有时被称为“setters”，而访问器方法有时被称为“getters”。\n\n## 将对象作为参数\n\n当你开发处理对象的应用程序时，通常需要编写接受对象作为参数的函数和方法。例如下面的代码显示了一个名为\
  \ `show_coin_status` 的函数，它接受一个 `Coin` 对象作为参数：\n\n```python\ndef show_coin_status(coin_obj):\n\
  \    print('This side of the coin is up:', coin_obj.get_sideup())\n```\n\n接下来的代码示例展示了我们如何创建一个\
  \ `Coin` 对象，然后将其作为参数传递给 `show_coin_status` 函数：\n\n```python\nmy_coin = coin.Coin()\n\
  show_coin_status(my_coin)\n```\n\n当你将对象作为参数传递时，传递到参数变量中的是该对象的引用。因此，接收对象作为参数的函数或方法可以访问实际对象。例如，查看下面的\
  \ `flip` 方法：\n\n```python\ndef flip(coin_obj):\n    coin_obj.toss()\n```\n\n该方法接受一个\
  \ `Coin` 对象作为参数，并调用对象的 `toss` 方法。程序 10-15 演示了该方法。\n\n## 程序 10-15 (coin_argument.py)\n\
  \n```python\n 1  # 此程序将一个 Coin 对象作为\n 2  # 参数传递给函数。\n 3  import coin\n 4\n 5  #\
  \ main 函数\n 6  def main():\n 7      # 创建一个 Coin 对象。\n 8      my_coin = coin.Coin()\n\
  \ 9\n10      # 这将显示 'Heads'。\n11      print(my_coin.get_sideup())\n12\n13      #\
  \ 将对象传递给 flip 函数。\n14      flip(my_coin)\n15\n16      # 这可能会显示 'Heads'，也可能\n17 \
  \     # 显示 'Tails'。\n18      print(my_coin.get_sideup())\n19\n20  # flip 函数抛掷硬硬币。\n\
  21  def flip(coin_obj):\n22      coin_obj.toss()\n23\n24  # 调用 main 函数。\n25  main()\n\
  ```\n\n**程序输出**\n\n```\nHeads\nTails\n```\n\n**程序输出**\n\n```\nHeads\nHeads\n```\n\
  \n**程序输出**\n\n```\nHeads\nTails\n```\n\n第 8 行的语句创建了一个 `Coin` 对象，由变量 `my_coin` 引用。第\
  \ 11 行显示 `my_coin` 对象 `_sideup` 属性的值。因为对象的 `_init_` 方法将 `_sideup` 属性设置为 `'Heads'`，我们知道第\
  \ 11 行将显示字符串 `'Heads'`。第 14 行调用了 `flip` 函数，并将 `my_coin` 对象作为参数传递。在 `flip` 函数内部，调用了\
  \ `my_coin` 对象的 `toss` 方法。然后，第 18 行再次显示 `my_coin` 对象 `_sideup` 属性的值。这一次，我们无法预测会显示\
  \ `'Heads'` 还是 `'Tails'`，因为 `my_coin` 对象的 `toss` 方法。\n\n\n\n\n\n*   一个人扮演的角色，例如经理、员工、客户、老师、学生等。\n\
  *   业务事件的结果，例如客户订单，或者在本例中为服务报价。\n*   记录项，例如客户历史和工资记录。\n\n# 识别所有名词\n\n下一步是识别所有的名词和名词短语。（如果描述中包含代词，也也将它们包含进来。）让我们再次查看之前的问题描述。\n\
  \n这一次，名词和名词短语以**粗体**显示。\n\n> Joe 的汽车修理店（Joe’s Automotive Shop）为外资提供服务，并专门负责梅赛德斯、保捷和宝马品牌的汽车。当客户把汽车带到修理店时，经理获取客户的名字、地址和电话号码。然后经理确定汽车的品牌、型号和年份，并给客户提供服务报价。服务报价显示了预估的零件费用、预估的人工费用、销售税和总预估费用。\n\
  \n注意某些名词是重复的。以下列表显示了所有不重复的义词：\n\n* address（地址）\n* BMW\n* car（汽车）\n* cars（汽车-复数）\n\
  * customer（客户）\n* estimated labor charges（预估人工费用）\n* estimated parts charges（预估零件费用）\n\
  * foreign cars（外资汽车）\n* Joe’s Automotive Shop（Joe 的汽车修理店）\n* make（品牌）\n* manager（经理）\n\
  * Mercedes（梅赛德斯）\n* model（型号）\n* name（名字）\n* Porsche（保捷）\n* sales tax（销售税）\n* service\
  \ quote（服务报价）\n* shop（修理店）\n* telephone number（电话号码）\n* total estimated charges（总预估费用）\n\
  * year（年份）\n\n# 精炼名词列表\n\n出现在问题描述中的名词仅仅是成为类的候选者。可能没有必要为它们中的每一个创建类。下一步是精炼列表，只包含解决当前特定问题所必需的类。我们将查看从潜在类列表中删除名词的常见原因。\n\
  \n### 1. 某些名词的含义实际上相同。\n\n在这个示例中，以下名词组指的是同一个东西：\n\n* car, cars, and foreign cars\n\
  \  这些都指的是“汽车”这一通用概念。\n* Joe’s Automotive Shop and shop\n  这两者都指的是“Joe’s Automotive\
  \ Shop”这家公司。\n\n我们可以为这些每一个项确定一个单一类。在这个示例中，我们任意从列表中删除了 `cars` 和 `foreign cars`，并使用\
  \ `car` 一词。同样，我们将从列表中删除了 `Joe’s Automotive Shop` 并使用 `shop` 一词。更新后的潜在类列表如下：\n\n\
  | |\n| :--- |\n| * address * * BMW * * car * * ~~cars~~ * * customer * * estimated\
  \ labor charges * * estimated parts charges * * ~~foreign cars~~ * * ~~Joe’s Automotive\
  \ Shop~~ * * make * * manager * * Mercedes * * model * * name * * Porsche * * sales\
  \ tax * * service quote * * shop * * telephone number * * total estimated charges\
  \ * * year |\n| 因为 `car`、`cars` 和 `foreign cars` 在这个问题中含义相同，所以我们删除了 `cars` 和 `foreign\
  \ cars`。此外，由于 `Joe’s Automotive Shop` 和 `shop` 含义相同，我们删除了 `Joe’s Automotive Shop`。\
  \ |\n\n### 2. 某些名词可能代表我们为了解决问题而不需要关注的项目。\n\n快速回顾问题描述让我们想起了我们的应用程序应该做什么：打印服务报价。在这个示例中，我们可以从列表中删除两个不必要的类：\n\
  \n* 我们可以从列表中划掉 `shop`，因为我们的应用程序只需要关注单份服务报价。它不需要处理或确定任何公司范围范围的信息。如果问题描述要求我们保留所有服务报价的总和，那么为\
  \ `shop` 创建一个类就有意义了。\n* 我们不需要 `manager` 的类，因为问题说明没有指示我们去处理任何关于 `manager` 的信息。如果有多个修理店经理，且问题描述要求我们记录哪个经理生成了每份服务报价，那么为\
  \ `manager` 创建类就有意义了。\n\n此时更新的潜在类列表为：\n\n| |\n| :--- |\n| * address * * BMW * *\
  \ car * * ~~cars~~ * * customer * * estimated labor charges * * estimated parts\
  \ charges * * ~~foreign cars~~ * * ~~Joe’s Automotive Shop~~ * * make * * ~~manager~~\
  \ * * Mercedes * * model * * name * * Porsche * * sales tax * * service quote *\
  \ * ~~shop~~ * * telephone number * * total estimated charges * * year |\n| 我们的问题描述没有指示我们处理任何关于\
  \ `shop` 的信息或任何关于 `manager` 的信息，因此我们从列表中删除了它们。 |\n\n### 3. 某些名词可能代表对象，而不是类。\n\n\
  我们可以排除 `Mercedes`、`Porsche` 和 `BMW` 作为类，因为在示例中，它们都代表特定的汽车，可以被视为 `car` 类的实例。此时，更新的潜在类列表为：\n\
  \n| |\n| :--- |\n| * address * * ~~BMW~~ * * car * * ~~cars~~ * * customer * * estimated\
  \ labor charges * * estimated parts charges * * ~~foreign cars~~ * * ~~Joe’s Automotive\
  \ Shop~~ * * ~~manager~~ * * make * * ~~Mercedes~~ * * model * * name * * ~~Porsche~~\
  \ * * sales tax * * service quote * * ~~shop~~ * * telephone number * * total estimated\
  \ charges * * year |\n| 我们删除了 `Mercedes`、`Porsche` 和 `BMW`，因为它们都是 `car` 类的实例。 |\n\
  \n注意：某些面向对象的设计师会注意名词是复数还是单数。有时，复数名词表示一个类，而单数名词表示一个对象。\n\n### 4. 某些名词可能代表可以赋值变量的简单值，不需要类。\n\
  \n记住，类包含属性和方法。属性是存储在对象中的相关项，并定义对象的状态。方法是对象可以执行的操作或行为。如果一个名词代表的物品类型没有可识别的属性或方法，那么它可能可以从列表中删除。为了帮助判断一个名词是否代表具有属性和方法的项目，请对其提出以下问题：\n\
  \n* 你会使用一组相关值来表示该项目的状态吗？\n* 有没有明显的动作由该项目执行？\n\n如果这两个问题的答案都是否，那么该名词可能代表一个可以存储在简单变量中的值。如果我们对列表中剩下的每个名词应用此测试，可以得出以下这些不是类：地址、预估人工费用、预估零件费用、品牌、型号、名字、销售税、电话号码、总预估费用和。这些都是可以存储在变量中的简单字符串或数值。以下是更新后的潜在类列表：\n\
  \n| |\n| :--- |\n| ~~address~~ * ~~BMW~~ * * car * * ~~cars~~ * * customer * * ~~estimated\
  \ labor charges~~ * * ~~estimated parts charges~~ * * ~~foreign cars~~ * * ~~Joe’s\
  \ Automotive Shop~~ * * ~~make~~ * * ~~manager~~ * * ~~Mercedes~~ * * ~~model~~\
  \ * * ~~name~~ * * ~~Porsche~~ * * ~~sales tax~~ * * service quote * * ~~shop~~\
  \ * * ~~telephone number~~ * * ~~total estimated charges~~ * * ~~year~~ |\n\n\n\n\
  \n\n| 我们已经删除了 `address`、`estimated labor charges`、`estimated parts charges`、`make`、`model`、`name`、`sales\
  \ tax`、`telephone number`、`total estimated charges` 和 `year` 类，因为它们代表了可以存储在变量中的简单值。\
  \ |\n\n从列表中可以看到，除了汽车、客户和价格报价之外，我们删除了其他所有内容。这意味着在我们的应用程序中，我们需要类来表示汽车、客户和服务报价。最终，我们将编写一个\
  \ `Car` 类、一个 `Customer` 类和一个 `ServiceQuote` 类。\n\n# 识别类的职责\n\n一旦确定了类，接下来的任务就是识别每个类的职责。一个类的\
  \ `responsibilities`（职责）包括：\n\n*   该类负责了解的内容。\n*   该类负责执行的动作。\n\n当你确定了​​一个类负责了解的内容时，你就确定了该类的数据属性。同样，当你确定了一个类负责执行的动作时，你就确定了它的方法。\n\
  \n经常问自己两个问题：“在这个问题的背景下，类必须知道什么？类必须做什么？”通常很有帮助。寻找答案的第一个地方是问题领域的描述。许多类必须知道和做的事情将会被提到。然而，某些类的职责可能不会直接在问题领域中提到，因此通常需要进一步考虑。让我们将这种方法应用于我们之前从问题领域中识别出的类。\n\
  \n# `Customer` 类\n\n在我们问题领域的背景下，`Customer` 类必须知道什么？描述中直接提到了以下项目，它们都是客户的数据属性：\n\n\
  *   客户的名字\n*   客户的地址\n*   客户的电话号码\n\n这些都是可以表示为字符串并存储为数据属性的值。`Customer` 类可能知道许多其他事情。在这一阶段可能会犯的一个错误是识别了太多对象应该负责了解的事情。在某些应用程序中，`Customer`\
  \ 类可能知道客户的电子邮件地址。这个特定的问题领域没有提到客户的电子邮件地址用于任何用途，因此我们不应该将其作为职责之一。\n\n现在，让我们识别类方法。在我们问题领域的背景下，`Customer`\
  \ 类必须做什么？唯一的动作是：\n\n*   初始化 `Customer` 类的对象。\n*   设置并返回客户的名字。\n*   设置并返回客户的地址。\n\
  *   设置并返回客户的电话号码。\n\n从这个列表中看到，`Customer` 类将有一个 `__init__` 方法，以及用于数据属性的访问器（accessors）和修改器（mutators）。图\
  \ 10-13 显示了 `Customer` 类的 UML 图。该类的 Python 代码如 程序 10-20。\n\n![Customer 类的 UML 图。](img/fg10_01300.png)\n\
