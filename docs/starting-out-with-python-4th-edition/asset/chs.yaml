  ```\n\n## 使用循环读取文件并检测文件结束\n\n很多时候，程序必须在不知道文件中存储了多少项目的情况下读取文件内容。例如，由程序 6-8 创建的 `sales.txt`\
  \ 文件可以存储任意数量的项目，因为程序会要求用户输入他或她拥有销售金额的天数。如果用户输入 5 为天数，程序将获取 5 个销售金额并将其写入文件。如果用户输入\
  \ 100 为天数，程序将获取 100 个销售金额并将其写入文件。\n\n然而，如果你想编写一个处理文件中所有项目（无论有多少）的程序，就会出现一个问题。例如，假设你需要编写一个程序来读取\
  \ `sales.txt` 文件中的所有金额并计算它们的总和。你可以使用循环来读取文件中的项目，但你需要一种方法知道何时到达文件末尾。\n\n在 Python\
  \ 中，`readline` 方法在尝试读取文件末尾之后时会返回一个空字符串 `('')`。这使得编写一个 `while` 循环来确定何时到达文件末尾成为可能。以下是通用算法的伪代码：\n\
