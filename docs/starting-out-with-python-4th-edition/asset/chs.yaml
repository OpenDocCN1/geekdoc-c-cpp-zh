  \ number is not valid”。\n\n## 3.6 布尔变量\n\n### 概念\n\n布尔变量可以引用两个值之一：`True` 或 `False`。布尔变量通常被用作标志（flags），用于指示特定条件是否存在。\n\
  \n到目前为止，我们在书中一直处理的是 `int`、`float` 和 `str`（字符串）变量。除了这些数据类型外，Python 还提供了 `bool` 数据类型。`bool`\
  \ 数据类型允许你创建可能引用两个可能值之一（`True` 或 `False`）的变量。以下是为 `bool` 变量赋值的示例：\n\n```\nhungry\
  \ = True\nsleepy = False\n```\n\n布尔变量最常用作标志。`flag` 是一个在程序中存在某些条件时的信号变量。当标志变量被设置为\
  \ `False` 时，表示条件不存在。当标志变量被设置为 `True` 时，意味着条件确实存在。\n\n例如，假设销售员有 50,000 美元的配额。假设 `sales`\
  \ 引用销售员销售的金额，以下代码判断是否达到了配额：\n\n```python\nif sales >= 50000.0:\n    sales_quota_met\
  \ = True\nelse:\n    sales_quota_met = False\n```\n\n作为这段代码的结果，`sales_quota_met`\
  \ 变量可以作为标志，指示销售配额是否达成。在程序的后面，我们可能会以以下方式测试标志：\n\n```python\nif sales_quota_met:\n\
  \    print('You have met your sales quota!')\n```\n\n如果 `bool` 变量 `sales_quota_met`\
  \ 为 `True`，这段代码将显示 `'You have met your sales quota!'`。注意我们不需要使用 `==` 运算符来显式地将 `sales_quota_met`\
  \ 变量与值 `True` 进行比较。这段代码等同于以下代码：\n\n```python\nif sales_quota_met == True:\n    print('You\
  \ have met your sales quota!')\n```\n\n# ![](img/ICON_CHECKPT.png 检查点\n\n1. 3.20\
  \ 你可以给 `bool` 变量赋值哪些值？\n\n2. 3.21 什么是标志变量？\n\n# 3.7 龟图图形：确定龟的状态\n\n### 概念\n\n龟图图形库提供了许多函数，你可以在决策结构中使用这些函数来确定龟的状态并条件条件执行操作。\n\
  \n你可以使用龟图图形库中的函数来学习许多关于龟当前的状态。在本节中，我们将讨论确定龟的位置、朝向、画笔是抬起还是落下、当前绘图颜色等的函数。\n\n## 确定龟的位置\n\
  \n回想第 2 章，你可以使用 `turtle.xcor()` 和 `turtle.ycor()` 来获取龟的位置。\n\n## 确定龟的朝向\n\n使用 `turtle.heading()`\
