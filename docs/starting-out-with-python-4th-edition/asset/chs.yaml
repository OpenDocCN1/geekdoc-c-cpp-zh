  4. 5.9 为什么必须对块中的语句进行缩进？\n\n## 5.3 设计使用函数的程序\n\n### 概念：\n\n程序员通常使用称为“自顶向下设计”（top-down\
  \ design）的技术将算法分解为函数。\n\n### 使用函数绘制程序流程图\n\n在第 2 章中，我们介绍了流程图作为设计程序的工具。在流程图中，函数调用用一个两边各有一个垂直条的矩形表示，如图\
