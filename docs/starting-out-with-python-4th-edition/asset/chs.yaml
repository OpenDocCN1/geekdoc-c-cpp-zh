  \n### 26. 海龟绘形：城市天际线\n\n编写一个 turtle 图形程序，绘制图 5-33 所示的城市天际线。程序的整体任务是在夜空下绘制一些城市建筑的轮廓。通过编写执行以下任务的函数使程序模块化：\n\
