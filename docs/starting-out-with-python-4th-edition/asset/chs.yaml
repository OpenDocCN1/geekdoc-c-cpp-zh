  \ | 用作临时柱的柱。 |\n\n如果 `num` 大于 0，则有盘子需要移动。第一次递归调用如下：\n\n```\nmove_discs(num − 1,\
  \ from_peg, temp_peg, to_peg)\n```\n\n该语句是一个指令，使用 `to_peg` 作为临时柱，将 `from_peg` 除一个以外的所有盘子移动到\
