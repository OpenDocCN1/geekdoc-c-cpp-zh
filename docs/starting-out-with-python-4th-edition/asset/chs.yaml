  34 main()\n```\n\n# 绘制饼图\n\n饼图是一种显示被分成若干扇区域的圆形图表。圆形代表整体，切扇区域代表整体的百分比。你使用 `matplotlib.pyplot`\
  \ 模块中的 `pie` 函数来创建饼图。\n\n当你调用 `pie` 函数时，你将一个值列表作为参数传递。`pie` 函数将计算列表中值的总和，然后使用该总和作为整体的值。然后，列表中的每个元素将成为饼图中的一个切扇。切扇的大小代表该元素占整体的百分比。\n\
  \n程序 7-27 显示了一个示例。第 6 行创建了一个包含值 10, 30, 40 和 20 的列表。然后，第 9 行将该列表作为参数传递给 `pie` 函数。我们可以对生成的饼图得出以下结论：\n\
  \n*   列表元素的总和为 200，因此饼图的整体将是 200。\n*   列表中有四个元素，因此饼图将被分成四个切扇。\n*   第一个切扇代表值 20，因此它的大小将占整体的\
  \ 10%。\n*   第二个切扇代表值 60，因此它的大小将占整体的 30%。\n*   第三个切扇代表值 80，因此它的大小将占整体的 40%。\n*  \
  \ 第四个切扇代表值 40，因此它的大小将占整体的 20%。\n\n程序的输出见图 7-16。\n\n![一个由不同宽度和阴色的楔形组成的无标签圆形图。](img/fg07_01600.png)\n\
  \n# 图 7-16 程序 7-27 的输出\n\n# 程序 7-27 `(pie_chart1.py)`\n\n```python\n 1 # 这个程序显示一个简单的饼图。\n\
  \ 2  import matplotlib.pyplot as plt\n 3\n 4 def main():\n 5      # 创建一个包含值 20,\
  \ 60, 80, 40 的列表。\n 6      values = [20, 60, 80, 40]\n 7\n 8      # 将列表作为参数传递给 pie\
  \ 函数。\n 9      plt.pie(values)\n10    \n11      # 显示饼图。\n12      plt.show()\n13\n\
  14 # 调用主函数。\n15 main()\n```\n\n# 显示图表标签和标题\n\n`pie` 函数有一个 `labels` 参数，你可以用它为饼图切扇添加标签。传递给该参数的是包含所需标签的字符串列表。程序\
