  \n**程序输出**（输入用加粗显示）\n\n```text\nEnter a filename: bad_file.txt \nTraceback (most\
  \ recent call last):\nFile \"C:\\Python\\display_file.py,\" line 21, in <module>\n\
  main()\nFile \"C:\\Python\\display_file.py,\" line 9, in main\ninfile = open(filename,\
  \ 'r')\nIOError: [Errno 2] No such file or directory: 'bad_file.txt'\n```\n\n第 9\
  \ 行的语句在调用 `open` 函数时抛出了异常。注意在回溯（traceback）错误消息中，发生的异常名称是 `IOError`。这是当文件 I/O 操作失败时抛出的的一种异常。你可以在回溯消息中看到错误原因是\
  \ `No such file or directory: 'bad_file.txt'`。\n\n程序 6-25 展示了如何通过 `try/except` 语句修改[程序\
  \ 6-24]，以优雅的方式响应 `IOError` 异常。在示例运行中，假设文件 `bad_file.txt` 不存在。\n\n## 程序 6-25 `display_file2.py`\n\
  \n```python\n 1  # 这个程序显示文件的\n 2  # 内容。\n 3\n 4  def main():\n 5      # 获取文件名。\n\
  \ 6      filename = input('Enter a filename: ')\n 7\n 8      try:\n 9          #\
  \ 打开文件。\n10          infile = open(filename, 'r')\n11\n12          # 读取文件内容。\n13\
  \          contents = infile.read()\n14\n15          # 显示文件内容。\n16          print(contents)\n\
  17\n18          # 关闭文件。\n19          infile.close()\n20      except IOError:\n21\
  \          print('An error occurred trying to read')\n22          print('the file',\
  \ filename)\n23\n24  # 调用主函数。\n25  main()\n```\n\n**程序输出**（输入用加粗显示）\n\n```text\n\
  Enter a filename: bad_file.txt\nAn error occurred trying to read the file bad_file.txt\n\
  ```\n\n让我们看看示例运行的情况。当执行第 6 行时，用户输入了 `bad_file.txt` 并将其赋值给变量 `filename`。在 `try` 块中，第\
  \ 10 行尝试打开 `bad_file.txt`。由于该文件不存在，语句抛出了 `IOError` 异常。当发生这种情况时，程序退出 `try` 块。由于第\
  \ 20 行的 `except` 子句指定了 `IOError` 异常，程序跳转到处理器。\n\n许多情况下，`try` 块中的代码可能会抛出多种类型的异常。在这种情况下，你需要为要处理的每种异常编写一个\
  \ `except` 子句。程序 6-26 读取名为 `sales_data.txt` 的文件内容。文件中的每行包含一个月的销售额，文件有几行。以下是文件内容：\n\
  \n```text\n2498.62\n2697.97\n3258.45\n3197.47\n2278.76\n```\n\n[程序 6-26] 读取文件中所有的数字并将它们加到累加器。\n\
  \n## 程序 6-26 `sales_report.py`\n\n```python\n 1  # 这个程序显示 sales_data.txt 文件中\n 2\
  \  #金额的总和。\n 3\n 4  def main():\n 5      # 初始化累加器。\n 6      total = 0.0\n 7\n 8\
  \      try:\n 9          # 打开 sales_data.txt 文件。\n10          infile = open('sales_data.txt',\
  \ 'r')\n11\n12          # 读取文件中的值并\n13          # 累加它们。\n14          for line in\
  \ infile:\n15              amount = float(line)\n16              total += amount\n\
  17\n18          # 关闭文件。\n19          infile.close()\n20\n21          # 打印总和。\n22\
  \          print(format(total, ',2f'))\n23\n24      except IOError:\n25        \
  \  print('An error occured trying to read the file.')\n26\n27      except ValueError:\n\
  28          print('Non-numeric data found in the file.')\n29\n30      except:\n\
  31          print('An error occured.')\n32\n33  # 调用主函数。\n34  main()\n```\n\n`try`\
  \ 块包含可能抛出不同类型异常的代码。例如：\n\n* 如果 `sales_data.txt` 文件不存在，第 10 行的语句可能会抛出 `IOError` 异常。如果第\
  \ 14 行的 `for` 循环在读取文件数据时遇到问题，也可能抛出 `IOError` 异常。\n* 如果 `line` 变量引用的字符串无法转换为浮点数（例如，字母字符串），第\
  \ 15 行的 `float` 函数可能会抛出 `ValueError` 异常。\n\n注意 `try/except` 语句有三个 `except` 子句：\n\
  \n* 第 24 行的 `except` 子句指定了 `IOError` 异常。如果抛出了 `IOError` 异常，第 25 行的处理器将执行。\n* 第 27\
  \ 行的 `except` 子句指定了 `ValueError` 异常。如果抛出了 `ValueError` 异常，第 28 行的处理器将执行。\n* 第 30\
  \ 行的 `except` 子句没有列出特定异常。如果抛出了其他 `except` 子句未处理的异常，第 31 行的处理器将执行。\n\n如果在 `try` 块中发生异常，Python\
  \ 解释器会从上到下检查 `try/except` 语句中的每个 `except` 子句。当它找到一个指定的类型与发生的异常类型匹配时，它将跳转到该 `except`\
  \ 子句。如果没有一个 `except` 子句指定的类型与异常匹配，解释器将跳转到第 30 行的 `except` 子句。\n\n## 使用一个 `except`\
  \ 子句捕获所有异常\n\n之前的示例演示了如何在 `try/except` 语句中单独处理多种异常。有时，你可能想编写一个 `try/except` 语句，捕获\
  \ `try` 块中抛出的任何异常，无论异常类型如何，都以相同的方式响应。通过在 `try/except` 语句中编写一个不指定特定异常类型的 `except`\
  \ 子句，可以实现这一点。程序 6-27 显示了一个示例。\n\n## 程序 6-27 `sales_report2.py`\n\n\n\n\n\n```\n\
  \ 1  # This program displays the total of the\n 2  # amounts in the sales_data.txt\
  \ file.\n 3\n 4  def main():\n 5      # Initialize an accumulator.\n 6      total\
  \ = 0.0\n 7\n8      try:\n 9          # Open the sales_data.txt file.\n10      \
  \    infile = open('sales_data.txt', 'r')\n11\n12          # Read the values from\
  \ the file and\n13          # accumulate them.\n14          for line in infile:\n\
  15              amount = float(line)\n16              total += amount\n17\n18  \
  \        # Close the file.\n19          infile.close()\n20\n21          # Print\
  \ the total.\n22          print(format(total, ',.2f'))\n23      except:\n24    \
  \      print('An error occurred.')\n25\n26  # Call the main function.\n27  main()\n\
  ```\n\n注意此程序中的 `try/except` 语句只有一个 `except` 子句，位于第 23 行。该 `except` 子句没有指定异常类型，因此\
  \ `try` 块（第 9 到 22 行）中发生的任何异常都会导致程序跳转到第 23 行并执行第 24 行的语句。\n\n# 显示异常的默认错误消息\n\n当抛出异常时，内存中会创建一个名为\
  \ `exception object`（异常对象）的对象。该异常对象通常包含一个与异常相关的默认错误消息。（事实上，这与当异常未被处理时，你在回溯跟踪（traceback）末尾看到的错误消息是相同的。）当你编写\
  \ `except` 子句时，可以选择将异常对象赋值给一个变量，如下所示：\n\n```\nexcept ValueError as err:\n```\n\n\
  此 `except` 子句捕获 `ValueError` 异常。`except` 子句之后的表达式指定了我们是将异常对象赋值给变量 `err`。（`err` 这个名字并没有特殊之处。它只是我们为示例选择的名称。你可以使用任何喜欢的名称。）执行此操作后，在异常处理程序中你可以将\
  \ `err` 变量传递给 `print` 函数，以显示 Python 为该类型错误提供的默认错误消息。程序 6-28 展示了这种操作的示例。\n\n# 程序\
  \ 6-28 `(gross_pay3.py)`\n\n```\n 1  # This program calculates gross pay.\n 2\n\
  \ 3  def main():\n 4      try:\n 5          # Get the number of hours worked.\n\
  \ 6          hours = int(input('How many hours did you work? '))\n 7\n 8       \
  \   # Get the hourly pay rate.\n 9          pay_rate = float(input('Enter your hourly\
  \ pay rate: '))\n10\n11          # Calculate the gross pay.\n12          gross_pay\
  \ = hours * pay_rate\n13\n14          # Display the gross pay.\n15          print('Gross\
  \ pay: $', format(gross_pay, ',.2f'), sep='')\n16      except ValueError as err:\n\
  17          print(err)\n18\n19  # Call the main function.\n20  main()\n```\n\n**程序输出**（加粗显示输入内容）\n\
  \n```\nHow many hours did you work? forty \ninvalid literal for int() with base\
  \ 10: 'forty'\n```\n\n当 `try` 块（第 5 到 15 行）发生 `ValueError` 异常时，程序跳转到第 16 行的 `except`\
  \ 子句。第 16 行中的 `ValueError as err` 表达式导致产生的异常对象赋值给名为 `err` 的变量。第 17 行的语句将 `err` 变量传递给\
  \ `print` 函数，从而显示异常的默认错误消息。\n\n如果你只想用一个 `except` 子句来捕获 `try` 块中抛出的所有异常，可以指定 `Exception`\
  \ 为类型。程序 6-29 展示了一个示例。\n\n# 程序 6-29 `(sales_report3.py)`\n\n```\n 1  # This program\
  \ displays the total of the\n 2  # amounts in the sales_data.txt file.\n 3\n 4 \
  \ def main():\n 5      # Initialize an accumulator.\n 6      total = 0.0\n 7\n 8\
  \      try:\n 9          # Open the sales_data.txt file.\n10          infile = open('sales_data.txt',\
  \ 'r')\n11\n12          # Read the values from the file and\n13          # accumulate\
  \ them.\n14          for line in infile:\n15              amount = float(line)\n\
  16              total += amount\n17\n18          # Close the file.\n19         \
  \ infile.close()\n20\n21          # Print the total.\n22          print(format(total,\
  \ ',.2f'))\n23      except Exception as err:\n24          print(err)\n25\n26  #\
  \ Call the main function.\n27  main()\n```\n\n# `else` 子句\n\n`try/except` 语句可以有一个可选的\
  \ `else` 子句，它出现在所有 `except` 子句之后。以下是 `try/except` 的通用格式：\n\n```\ntry:\n   statement\
  \ \n   statement \n   etc. \nexcept ExceptionName:\n   statement \n   statement\
  \ \n   etc. \nelse:\n   statement \n   etc.\n```\n\n`else` 子句之后的语句块被称为 `else` 块。只有在没有异常抛出的情况下，`try`\
  \ 块执行后才会执行 `else` 块中的语句。如果发生了异常，`else` 块将被跳过。程序 6-30 展示了一个示例。\n\n# 程序 6-30 `(sales_report4.py)`\n\
  \n```\n 1  # This program displays the total of the\n 2  # amounts in the sales_data.txt\
  \ file.\n 3\n 4  def main():\n 5      # Initialize an accumulator.\n 6      total\
  \ = 0.0\n 7\n 8      try:\n 9          # Open the sales_data.txt file.\n10     \
  \     infile = open('sales_data.txt', 'r')\n11\n12          # Read the values from\
  \ the file and\n13          # accumulate them.\n14          for line in infile:\n\
  15              amount = float(line)\n16              total += amount\n17\n18  \
  \        # Close the file.\n19          infile.close()\n20\n21          # Print\
  \ the total.\n22          print(format(total, ',.2f'))\n23      except Exception\
  \ as err:\n24          print(err)\n25      else:\n26          print(\"Calculation\
  \ completed.\")\n27\n28  # Call the main function.\n29  main()\n```\n\n# `finally`\
  \ 子句\n\n`try/except` 语句可以有一个可选的 `finally` 子句，它出现在所有 `except` 子句之后。以下是带有 `finally`\
  \ 的 `try/except` 的通用格式：\n\n```\ntry:\n   statement \n   statement \n   etc. \nexcept\
  \ ExceptionName:\n   statement \n   statement \n   etc. \nfinally:\n   statement\
  \ \n   statement \n   etc.\n```\n\n`finally` 子句之后的语句块被称为 `finally` 块。无论是否发生异常，`finally`\
  \ 块中的语句都会在 `try` 块执行以及任何异常处理器执行之后执行。`finally` 块的目的是执行清理操作，例如关闭文件或其他资源。即使 `try` 块抛出了异常，写在\
  \ `finally` 块中的任何代码也会执行。\n\n# 如果异常未被处理怎么办？\n\n除非异常被处理，否则它会导致程序停止。抛出的异常未被处理有两种可能。第一种可能性是\
  \ `try/except` 语句没有包含指定正确类型的 `except` 子句。第二种可能性是异常是从 `try` 块之外抛出的。在任何情况下，异常都会导致程序停止。\n\
  \n在本节中，你看到了可能会抛出 `ZeroDivisionError` 异常、`IOError` 异常和 `ValueError` 异常程序的示例。在设计 `try/except`\
  \ 语句时，了解你需要处理的异常方法是查阅 Python 文档。它为每种可能的异常提供了详细信息，以及导致它们发生的错误类型。\n\n\n\n\n\n另一种学习程序中可能发生的异常的方法是通过实验。你可以运行一个程序，并故意执行会导致错误的操作。通过观察显示的错误回溯（traceback）错误消息，你将看到抛出的异常名称。然后，你可以编写\
  \ `except` 子句来处理这些异常。\n\n### ![](img/ICON_CHECKPT.png) 检查点\n\n1. 6.19 简要描述什么是异常。\n\
  2. 6.20 如果抛出了异常且程序没有用 `try/except` 语句处理它，会发生什么？\n3. 6.21 当程序尝试打开一个不存在的文件时，会抛出什么类型的异常？\n\
  4. 6.22 当程序使用 `float` 函数将非数字字符串转换为数字时，会抛出什么类型的异常？\n\n## 复习题\n\n### 单选题\n\n1. 写入数据的文件称为(n)\
