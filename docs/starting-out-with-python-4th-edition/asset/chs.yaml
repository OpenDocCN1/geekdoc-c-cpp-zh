  \ was successful”（安装成功）。点击`Close`按钮退出安装程序。\n\n## 附录 B IDLE 简介\n\nIDLE 是一个集成开发环境，它将多个开发工具整合在一个程序中，包括：\n\
  \n*   一个在交互模式下运行的 `Python shell`。你可以在 shell 提示符处输入 Python 语句并立即执行它们。你也可以运行完整的 Python\
  \ 程序。\n*   一个文本编辑器，可对 Python 关键字和其他程序的其他部分进行颜色标记。\n*   一个 `check module` 工具，可以在不运行程序的情况下检查\
  \ Python 程序的语法错误。\n*   允许你在一个或多个文件中查找文本的搜索工具。\n*   文本格式化工具，帮助你在 Python 程序中保持一致的缩进级别。\n\
  *   一个调试器，允许你单步执行 Python 程序，并在每条语句执行时观察变量值的变化。\n*   针对开发者的其他高级工具。\n\nIDLE 软件与 Python\
  \ 捆绑。当你安装 Python 解释器时，IDLE 也会自动安装。本附录提供了 IDLE 的简要介绍，并描述了创建、保存和执行 Python 程序的的基本步骤。\n\
  \n## 启动 IDLE 和使用 Python Shell\n\n在系统上安装 Python 后，你的开始菜单的程序列表中会出现一个 Python 程序组。程序组中的项目之一标题为\
  \ `IDLE (Python GUI)`。点击此项目启动 IDLE，你将看到如图 B-1 所示的 Python Shell 窗口。窗口内部，Python 解释器以交互模式运行，窗口顶部是一个菜单栏，提供了访问所有\
  \ IDLE 工具的界面。\n\n![IDLE shell 窗口的截图](img/fg0b_00100.png)\n\n## 图 B-1 IDLE shell\
  \ 窗口\n\n图 B-1 完整替代文本\n\n`>>>` 提示符表示解释器正在等待你输入 Python 语句。当你在 `>>>` 提示符处输入语句并按下 `Enter`\
  \ 键时，语句会被立即执行。例如，图 B-2 显示了输入并执行三条语句后的 Python Shell 窗口。\n\n![图 B-1 窗口截图，其中 Python\
  \ 解释器执行了三条语句](img/fg0b_00200.png)\n\n## 图 B-2 Python 解释器执行的语句\n\n图 B-2 完整替代文本\n\n\
  当你输入多行语句的开头（例如 `if` 语句或循环）时，随后的每一行会自动缩进。在空行上按 `Enter` 键表示多行语句结束，并导致解释器执行它。图 B-3\
  \ 显示了输入并执行 `for` 循环后的 Python Shell 窗口。\n\n![图 B-1 窗口截图，其中 Python 解释器执行了多行语句](img/fg0b_00300.png)\n\
  \n## 图 B-3 Python 解释器执行的多行语句\n\n图 B-3 完整替代文本\n\n## 在 IDLE 编辑器中编写 Python 程序\n\n要在\
  \ IDLE 中编写新的 Python 程序，你需要打开一个新的编辑窗口。如图 B-4 所示，你点击菜单栏上的 `File`，然后点击 `New`。这将打开一个文本窗口。如图\
  \ B-5 所示，你可以在这里输入代码。\n\n![Python 安装程序的窗口截图](img/fg0a_00200.png)\n\n## 图 B-4 下拉菜单\n\
  \n图 B-4 完整替代文本\n\n## 图 B-5 文本窗口\n\n![文本窗口](img/fg0b_0500.png)\n\n## 颜色标记\n\n在编辑器窗口以及\
  \ Python Shell 中输入的代码颜色标记如下：\n\n*   Python 关键字显示为橙色。\n*   注释显示为红色。\n*   字符串字面量显示为绿色。\n\
  *   定义名称（如函数和类）显示为蓝色。\n*   内置函数显示为紫色。\n\n要更改 IDLE 的颜色设置，点击菜单栏上的 `Options`，然后点击 `Configure\
  \ IDLE`。选择对话框顶部的 `Highlighting` 选项卡，你可以为每个元素指定颜色。\n\n## 自动缩进\n\nIDLE 编辑器具有帮助保持一致缩进的功能。这些功能中最有用的是自动缩进。当你输入以冒号结尾的行（例如\
  \ `if` 子句、循环或函数头）并按 `Enter` 键时，编辑器会自动缩进后续行。例如，假设你正在输入如图 B-6 所示的代码。\n\n![第一行](img/fg0b_06n1.png)\n\
  \n![第二行](img/fg0b_06n2.png)\n\n在缩进行的开头按 `Backspace` 键可以取消一级缩进。\n\n![图 B-5 所示的文本窗口，包含代码行](img/fg0b_0600.png)\n\
  \n## 图 B-6 导致自动缩进的行\n\n图 B-6 完整替代文本\n\n默认情况下，IDLE 每一级缩进缩进四个空格。可以通过点击菜单栏上的 `Options`\
  \ 并点击 `Configure IDLE` 来更改缩进空格数。确保选择了对话框顶部的 `Fonts/Tabs`，你会看到一个滑动条，允许你更改用于缩进宽度的空格数。但是，由于四个空格是\
  \ Python 缩进的标准宽度，建议你保持此设置。\n\n## 保存程序\n\n在编辑器窗口中，你可以通过选择 `File` 菜单中的任一操作来保存当前程序：\n\
  \n*   Save（保存）\n\n*   Save As（另存为）\n\n*   Save Copy As（另存副本）\n\n\n\n\n\n一旦你已经在编辑器中输入了程序，可以通过按下`F5`键来运行它，或者如图\
  \ B-7 所示，点击编辑器窗口菜单栏上的`Run`（运行），然后点击`Run Module`运行模块）。如果程序自上次修改以来未保存，你将看到如图 B-8 所示的对话框。点击`OK`保存程序。程序运行时，你将在\
  \ IDLE 的`Python Shell`窗口中看到它的输出，如图 B-9 所示。\n\n![文本编辑窗口的截图](img/fg0b_00700.png)\n\
  \n# 图 B-7 编辑器窗口的运行菜单\n\n图 B-7 完整替代文本![保存确认对话框的截图，标题为运行前保存或检查。](img/fg0b_00800.png)\n\
  \n# 图 B-8 保存确认对话框\n\n图 B-8 完整替代文本![图 B-1 中窗口的截图，左侧边缘重复了五次“Hello World!”文本。这是程序的输出。](img/fg0b_00900.png)\n\
  \n# 图 B-9 在 Python Shell 窗口中显示的输出\n\n如果程序包含语法错误，当你运行程序时，你将看到如图 B-10 所示的对话框。点击`OK`按钮后，编辑器将高亮代码中的错误位置。如果你想在不尝试运行程序的情况下检查语法，可以点击菜单栏上的`Run`，然后点击`Check\
