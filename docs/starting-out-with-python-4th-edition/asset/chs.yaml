  \ `A`、`B` 和 `C` 来存储柱子编号。\n\n要使用柱 B 作为临时柱，将 `n` 个盘子从柱 A 移动到 柱 C，请执行以下操作：\n\n```\n\
  如果 n > 0:\n使用柱 C 作为临时柱，将 n-2-1 个盘子从柱 A 移动到柱 B。\n将剩余的盘子从柱 A 移动到柱 C。\n使用柱 A 作为临时柱，将\
  \ n-2-1 个盘子从柱 B 移动到柱 C。\n```\n\n当没有更多盘子可以移动时，到达算法的基础情况。以下代码是一个实现该算法的函数。注意，该函数并没有实际移动任何东西，而是显示指示要进行的所有盘子移动的指令。\n\
