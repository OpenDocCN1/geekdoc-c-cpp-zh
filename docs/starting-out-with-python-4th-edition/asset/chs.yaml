  * 如果一个玩家选择石头，另一个玩家选择剪刀，石头胜（石头压碎剪刀）。\n* 如果一个玩家选择剪刀，另一个玩家选择布，剪刀胜（剪刀剪断布）。\n* 如果一个玩家选择布，另一个玩家选择石头，布胜（布包住石头）。\n\
  * 如果两个玩家的选择相同，则必须重新进行游戏。\n\n### 22. 海龟绘形：三角形函数\n\n编写一个名为 `triangle` 的函数，使用 turtle\
