  \ 模块\n\n### 概念\n\n在 Python 中，你可以使用 `tkinter` 模块来创建简单的 GUI 程序。\n\nPython 语言本身没有内置\
  \ GUI 编程功能。但是，它带有一个名为 `tkinter` 的模块，允许你创建简单的 GUI 程序。“tkinter”是“Tk interface”的缩写。之所以命名是因为因为它为\
  \ Python 程序员提供了一种使用名为 `Tk` 的 GUI 库的方法。许多其他编程语言也使用了 Tk 库。\n\n### ![](img/ICON_NOTE.png)\
  \ 注意\n\nPython 有许多 GUI 库可用。由于 `tkinter` 模块是 Python 自带的，我们只在本章中使用它。\n\nGUI 程序会显示一个窗口，其中包含各种图形组件，用户可以与其进行交互或查看。`tkinter`\
  \ 模块提供了 15 种组件，在表 13-1 中进行了描述。我们在本章中不会涵盖所有的 `tkinter` 组件，但我们将演示如何创建收集输入并显示数据的简单\
  \ GUI 程序。\n\n| 组件 | 描述 |\n| --- | --- |\n| `Button` | 点击可以触发动作的按钮。 |\n| `Canvas`\
  \ | 可用于显示图形的矩形区域。 |\n| `Checkbutton` | 可以处于“开启”或“关闭”状态的按钮。 |\n| `Entry` | 用户可以从键盘输入单行内容的区域。\
  \ |\n| `Frame` | 一个可以包含其他组件的容器。 |\n| `Label` | 显示单行文本或图像的区域。 |\n| `Listbox` | 用户可以从中选择项的列表。\
  \ |\n| `Menu` | 当用户点击 `Menubutton` 组件时显示的菜单选项列表。 |\n| `Menubutton` | 显示在屏幕上并可供用户点击的菜单。\
  \ |\n| `Message` | 显示多行文本。 |\n| `Radiobutton` | 可以被选中或取消选中的组件。`Radiobutton` 组件通常成组出现，并允许用户在多个选项中选择一个。\
  \ |\n| `Scale` | 允许用户通过沿轨道移动滑块来选择数值的组件。 |\n| `Scrollbar` | 可与某些其他类型的组件配合使用，以提供滚动功能。\
  \ |\n| `Text` | 允许用户输入多行文本的组件。 |\n| `Toplevel` | 一种容器，类似于 `Frame`，但它在自己的窗口中显示。 |\n\
  \n# 表 13-1 `tkinter` 组件\n\n我们能演示的最简单的 GUI 程序是显示一个空窗口的程序。程序 13-1 显示了我们如何使用 `tkinter`\
