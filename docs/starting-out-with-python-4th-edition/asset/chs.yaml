  \ operator is two `=` symbols together. Don’t confuse this operator with the assignment\
  \ operator, which is one `=` symbol.\n\n# The `!=` Operator\n```：\n# The `==` Operator\n\
  \nThe `==` operator determines whether the operand on its left is equal to the operand\
  \ on its right. If the values referenced by both operands are the same, the expression\
  \ is true. Assuming `a` is 4, the expression `a == 4` is true, and the expression\
  \ `a == 2` is false.\n\nThe following interactive session demonstrates the `==`\
  \ operator:\n\n```\n1  >>> x = 1 \n2  >>> y = 0 \n3  >>> z = 1 \n4  >>> x == y \n\
  5  False\n6  >>> x == z \n7  True\n8  >>>\n```\n\n# The `!=` Operator\n\nThe `!=`\
  \ operator is the not-equal-to operator. It determines whether the operand on its\
  \ left is not equal to the operand on its right, which is the opposite of the `==`\
  \ operator. As before, assuming `a` is 4, `b` is 6, and `c` is 4, both `a != b`\
  \ and `b != c` are true because `a` is not equal to `b` and `b` is not equal to\
  \ `c`. However, `a != c` is false because `a` is equal to `c`.\n\nThe following\
  \ interactive session demonstrates the `!=` operator:\n\n```\n1  >>> x = 1 \n2 \
  \ >>> y = 0 \n3  >>> z = 1 \n4  >>> x != y \n5  True\n6  >>> x != z \n7  False\n\
  8  >>>\n```\n\n# Putting It All Together\n\nLet’s look at the following example\
  \ of the `if` statement:\n\n```\nif sales > 50000:\n    bonus = 500.0\n```\n\nThis\
  \ statement uses the `>` operator to determine whether `sales` is greater than 50,000.\
  \ If the expression `sales > 50000` is true, the variable `bonus` is assigned 500.0.\
  \ If the expression is false, however, the assignment statement is skipped. Figure\
  \ 3-3 shows a flowchart for this section of code.\n\n![A flow diagram illustrating\
  \ an example of a decision structure.](img/fg03_00300.png)\n\n# Figure 3-3 Example\
  \ decision structure\n\nFigure 3-3 Full Alternative Text\n\nThe following example\
  \ conditionally executes a block containing three statements. Figure 3-4 shows a\
  \ flowchart for this section of code:\n\n![A flow diagram illustrating an example\
  \ of a decision structure.](img/fg03_00400.png)\n\n# Figure 3-4 Example decision\
  \ structure\n\nFigure 3-4 Full Alternative Text\n\n```\nif sales > 50000:\n    bonus\
  \ = 500.0\n    commission_rate = 0.12\n    print('You met your sales!')\n```\n\n\
