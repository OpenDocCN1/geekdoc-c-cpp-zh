  \ = \\frac{1}{2}mv^{2}$$\n\n公式中的变量如下：*KE* 是动能，$m$ 是以千克为单位的物体质量，$v$ 是以每秒为单位的物体速度。\n\
  \n编写一个名为 `kinetic_energy` 的函数，接受物体的质量（千克）和速度（每秒）作为参数。该函数返回物体拥有的动能值。编写一个程序要求用户输入质量和速度值，然后调用\
  \ `kinetic_energy` 函数获取物体的动能。\n\n## 15. 测试平均分与等级\n\n编写一个程序，要求用户输入五个测试分数。程序应显示每个分数的字母等级和平均分。在程序中编写以下函数：\n\
  \n*   `calc_average`。该函数接受五个测试分数作为参数并返回平均分。\n*   `determine_grade`。该函数接受一个测试分数作为参数，并根据以下评分标准返回该分数的字母等级：\n\
  \n\n\n\n| 分数 | 字母等级 |\n| --- | --- |\n| `90–100` | `A` |\n| `80–89` | `B` |\n| `70–79`\
  \ | `C` |\n| `60–69` | `D` |\n| `低于 60` | `F` |\n\n### 16. 奇偶数计数\n\n在本章中，你看到了如何编写算法来判断数字奇偶数的示例。请编写一个程序，生成\
  \ `100` 个随机数，并统计这些随机数中有多少个偶数和奇数。\n\n### 17. 质数\n\n质数是指只能被其本身和 1 整除的数。例如，数字 5 是质数，因为它只能被\
  \ 1 和 5 整除。然而，数字 6 不是质数，因为它可以被 1、2、3 和 6 整除。\n\n编写一个名为 `is_prime` 的布尔函数，该函数接受一个整数作为参数，如果该参数是质数则返回\
  \ `true`，否则返回 `false`。在一个程序中使用该函数，提示用户输入一个数字，然后显示指示该数字是否为质数的的消息。\n\n**提示：**\n\n\
  记住 `%` 运算符将一个数除以另一个数并返回除法的余数。在如 `num1 % num2` 的表达式中，如果 `num1` 能被 `num2` 整除，`%` 运算符将返回\
  \ 0。\n\n### 18. 质数列表\n\n此练习假设你已经在编程练习 17 中编写了 `is_prime` 函数。编写另一个程序，显示从 1 到 100\
  \ 的所有质数。程序应该包含一个循环来调用 `is_prime` 函数。\n\n### 19. 未来价值\n\n假设你在储蓄账户中有一笔钱，该账户按月产生复利，你想计算在特定月数后将拥有的金额。公式如下：\n\
  \n`F = P × (1 + i)^t`\n\n公式中的项为：\n\n* `F` 是账户在指定时期后的未来价值。\n* `P` 是账户的现值。\n* `i`\
