  \n# 算法\n\n1. 写一个名为 `Book` 的类。`Book` 应该具有：\n    - 标题、作者和出版者的数据属性。\n    - 一个创建这些属性的\
  \ `_init_` 方法。\n    - 每个类对应一个方法。\n    - 每个数据属性的访问器方法和修改器方法。\n    - 一个返回对象状态的 `_str_`\
  \ 方法。\n\n2. 查看以下对一个域的描述：\n   > 银行为客户提供以下类型的账户：储蓄账户、支票账户和货币市场账户。客户被允许向账户存款（从而增加余额）、从账户提款（从而减少余额）并赚取利息。每个账户都有一个利率。\n\
  \n   假设你正在编写一个计算银行账户利息金额的程序。\n   1. 识别该域中的潜在类。\n   2. 精炼列表以仅包含必要的类。\n   3. 识别这些类的职责。\n\
  \n### 编程练习\n\n1. **Pet 类**\n   写一个名为 `Pet` 的类，它应该具有以下数据属性：\n   - `_name`（宠物的名字）\n\
  \   - `_animal_type`（宠物的类型。例如‘Dog’、『Cat’、‘Bird’）\n   - `_age`（宠物的年龄）\n\n   `Pet`\
  \ 类应该有一个创建这些属性的 `_init_` 方法。它还具有以下方法：\n   - `set_name`：该方法为 `_name` 字段赋值。\n   -\
  \ `set_animal_type`：该方法为 `_animal_type` 字段赋值。\n   - `set_age`：该方法为 `_age` 字段赋值。\n\
  \   - `get_name`：该方法返回 `_name` 字段的值。\n   - `get_animal_type`：该方法返回 `_animal_type`\
  \ 字段的值。\n   - `get_age`：该方法返回 `_age` 字段的值。\n\n   编写类后，编写一个程序创建该类的对象并提示用户输入宠物的名字、类型和年龄。这些数据应该存储在对象的属性中。使用对象的访问方法检索宠物的名字、类型和年龄，并将数据显示在屏幕上。\n\
  \n2. **Car 类**\n   写一个名为 `Car` 的类，它具有以下数据属性：\n   - `_year_model`（汽车型号）\n   - `_make`（汽车品牌）\n\
  \   - `_speed`（汽车的当前速度）\n\n\n\n`Car` 类应该有一个 `_init_` 方法，接受汽车的年份和品牌作为参数。这些值应该赋值给对象的\
  \ `_year_model` 和 `_make` 数据属性。它还应该将 `_speed` 数据属性赋值为 0。\n\n该类还应该包含以下方法：\n\n* `accelerate`\n\
  \  每次调用 `accelerate` 方法时，`_speed` 数据属性的值应该加加 5。\n* `brake`\n  每次调用 `brake` 方法时，`_speed`\
  \ 数据属性的值应该减去 5。\n* `get_speed`\n  `get_speed` 方法应该返回当前速度。\n\n接下来，设计一个程序，创建一个 `Car`\
  \ 对象，然后调用五次 `accelerate` 方法。在每次调用 `accelerate` 方法后，获取汽车的当前速度并将其显示出来。然后调用五次 `brake`\
  \ 方法。在每次调用 `brake` 方法后，获取汽车的当前速度并显示出来。\n\n### 3. 个人信息 `Information` 类\n\n设计一个类，存储以下个人数据：姓名、地址、年龄和电话号码。编写适当访问器（accessor）和修改器（mutator）方法。还要编写一个程序创建该类的三个实例。其中一个实例存储你的个人信息，另外两个实例存储你朋友或家庭成员的信息。\n\
  \n### 4. 员工 `Employee` 类\n\n编写一个名为 `Employee` 的类，在属性中持有关于员工的数据：姓名、ID 编号、部门和职位。\n\
  \n一旦你写完该类，编写一个程序创建三个 `Employee` 对象来存储以下数据：\n\n| 姓名 | ID 编号 | 部门 | 职位 |\n| --- |\
  \ --- | --- | --- |\n| Susan Meyers | 47899 | 财务部 | 副总裁 |\n| Mark Jones | 39119\
  \ | IT 部 | 程序员 |\n| Joy Rogers | 81774 | 制造部 | 工程师 |\n\n程序应该将这些数据存储在三个对象中，然后在屏幕上显示每个员工的数据。\n\
  \n### 5. `RetailItem` 类\n\n编写一个名为 `RetailItem` 的类，持有关于零售商店中商品的数据。该类应该在属性中存储以下数据：商品描述、库存单位和价格。\n\
  \n一旦你写完该类，编写一个程序创建三个 `RetailItem` 对象并在它们中存储以下数据：\n\n| | 描述 | 库存单位 | 价格 |\n| ---\
  \ | --- | --- | --- |\n| 商品 #1 | 外夹 | 12 | 59.95 |\n| 商品 #2 | 设计师牛仔裤 | 40 | 34.95\
  \ |\n| 商品 #3 | 衬衫 | 20 | 24.95 |\n\n### 6. 患者费用\n\n编写一个名为 `Patient` 的类，其具有以下数据的属性：\n\
  \n* 名字、中间名和姓氏\n* 地址、城市、州份和邮政编码\n* 电话号码\n* 紧急联系人的姓名和电话号码\n\n`Patient` 类的 `_init_`\
  \ 方法应该接受每个属性的参数。`Patient` 类还应该为每个属性拥有访问器和修改器方法。\n\n接下来，编写一个名为 `Procedure` 的类，代表在患者身上执行的医疗程序。`Procedure`\
  \ 类应该具有以下数据的属性：\n\n* 手术名称\n* 手术日期\n* 执行手术的医人员姓名\n* 手术费用\n\n`Procedure` 类的 `_init_`\
  \ 方法应该接受每个属性的参数。`Procedure` 类还应该为每个属性拥有访问器和修改器方法。\n\n接下来，编写一个程序创建一个 `Patient` 类的实例并使用示例数据初始化。然后创建三个\
  \ `Procedure` 类的实例并使用以下数据初始化：\n\n| 程序 #1: | 程序 #2: | 程序 #3: |\n| --- | --- | ---\
  \ |\n| 程序名称: 体检 日期: 今天日期 执行人员: Irvine 医生 费用: 250.00 | 程序名称: X 光检查 日期: 今天日期 执行人员:\
  \ Jamison 医生 费用: 500.00 | 程序名称: 血检 日期: 今天日期 执行人员: Smith 医生 费用: 200.00 |\n\n程序应该显示患者信息、关于所有三个程序的信息，以及这三个程序的总费用。\n\
  \n### 7. 员工管理系统\n\n此练习假设你已经为编程练习 4 创建了 `Employee` 类。创建一个程序，在字典中存储 `Employee` 对象。使用员工\
  \ ID 编号作为键。该程序应该显示一个菜单，允许用户执行以下操作：\n\n* 在字典中查找员工\n* 向字典中添加新员工\n* 修改字典中现有员工的姓名、部门和职位\n\
  * 从字典中删除员工\n* 退出程序\n\n当程序结束时，它应该对字典进行序列化（pickle）并保存到文件中。每次程序启动时，它都应该尝试从文件中加载该字典。如果文件不存在，程序将从一个空字典开始。\n\
  \n### 8. 收银机\n\n此练习假设你已经为编程练习 5 创建了 `RetailItem` 类。创建一个可以与 `RetailItem` 类配合使用的 `CashRegister`\
  \ 类。`CashRegister` 应该能够在内部维护一个 `RetailItem` 对象的列表。该类应该具有以下方法：\n\n* `purchase_item`\
  \ 接收接受一个 `RetailItem` 对象作为参数。每次调用 `purchase_item` 方法时，传入的 `RetailItem` 都被添加到列表中。\n\
  * `get_total` 返回存储在 `CashRegister` 对象中的所有 `RetailItem` 的总价。\n* `show_items` 显示存储在\
  \ `CashRegister` 对象列表中的 `RetailItem` 对象的数据。\n* `clear` 应该清除 `CashRegister` 对象的列表。\n\
  \n在一个程序中演示 `CashRegister` 类，该程序允许用户选择多个商品进行购买。当用户准备结账时，程序应该显示其选择的所有商品列表以及价格。\n\n\
  ### 9. 问答游戏\n\n在这个编程练习中，你将为两个玩家创建一个简单的问答游戏。程序的工作原理如下：\n\n* 从玩家 1 开始，每个玩家轮轮回答 5 个问答问题。（总共有\
  \ 10 个问题）。当显示问题时，还会显示 4 个可能的答案。答案中只有一个是正确的，如果玩家选择了正确答案，他就能得到 1 分。\n* 在回答完所有问题后，程序显示每个玩家获得的分数，并宣布分数最高的玩家为胜利者。\n\
  \n为了创建这个程序，编写一个 `Question` 类来存储问答题的数据。`Question` 类应该具有以下数据的属性：\n\n* 一个问答问题\n* 可能答案\
  \ 1\n* 可能答案 2\n* 可能答案 3\n* 可能答案 4\n* 正确答案的编号（1, 2, 3 或 4）\n\n`Question` 类还应该有一个适当的\
  \ `_init_` 方法、访问器和修改器。\n\n程序应该包含一个包含 10 个 `Question` 对象的列表或字典，每个对象对应一个问答题。\n\n\n\
  \n\n在现实世界中，你可以发现许多对象是其他更通用对象的专门化版本。例如，“昆虫”一词描述的是具有各种特征的通用类型生物。因为蝗虫和蜜蜂都是昆虫，所以它们具有昆虫的所有通用特征。此外，它们还有自己特殊的特征。例如，蝗虫具有跳跃能力，而蜜蜂有它的刺针。蝗虫和蜜蜂都是昆虫的专门化版本。这在图\
  \ 11-1 中所示。\n\n![说明蜜蜂和蝗虫是如何成为昆虫的专门化版本的图](img/fg11_00100.png)\n\n# 图 11-1 蜜蜂和蝗虫是昆虫的专门化版本\n\
  \n图 11-1 完整替代文本\n\n# 继承与“是”的关系\n\n当一个对象是另一个对象的专门化版本时，它们之间就存在一种“是”（is a）的关系。例如，蝗虫是一种昆虫。这里是“是”关系的其他几个例子：\n\
  \n*   贵宾犬是一种狗。\n*   汽车是一种交通工具。\n*   花朵是一种植物。\n*   矩形是一个形状。\n*   足球运动员是一个运动员。\n\n\
  当对象之间存在“是”的关系时，意味着专门化对象具有通用对象的所有特征，加上使其变得特殊的额外特征。在面向对象编程中，继承被用于在类之间创建“是”的关系。这允许你通过创建另一个该类的专门化版本类来扩展该类的功能。\n\
  \n继承涉及父类和子类。`superclass` 是通用类，而 `subclass` 是专门化类。你可以将子类类为父类的扩展版本。子类从父类继承属性和方法，而无需重写其中的任何一个内容。此外，可以向子类添加新的属性和方法，这使得它成为父类的专门化版本。\n\
  \n# 注意：![](img/ICON_NOTE.png\n\n父类也被称为 `base classes`（基类），子类也被称为 `derived classes`（派生类）。这两组术语都是正确的。为了一致，本文将使用父类和子类的术语。\n\
  \n让我们来看一个继承使用的示例。假设我们正在开发一个汽车经销商可以使用来管理其二手车库存的程序。经销商的库存包括三种类型的汽车：汽车、皮卡车和运动越野车（SUV）。无论什么种类型，经销商都对每辆汽车保留了以下数据：\n\
  \n*   品牌\n*   年份型号\n*   里程数\n*   价格\n\n在库存中的每种类型的车辆都具有这些通用特征，加上它们特有的专门特征。对于汽车，经销商保留了以下额外数据：\n\
  \n*   门数量（2 个或 4 个）\n\n对于皮卡车，经销商保留了以下额外数据：\n\n*   驱动类型（两轮驱动或四轮驱动）\n\n对于 SUV，经销商保留了以下额外数据：\n\
  \n*   载客量\n\n在设计此程序时，一种方法是编写以下三个类：\n\n*   一个 `Car` 类，具有品牌、年份型号、里程数、价格和门数量的数据属性。\n\
  *   一个 `Truck` 类，具有品牌、年份型号、里程数、价格和驱动类型的数据属性。\n*   一个 `SUV` 类，具有品牌、年份型号、里程数、价格和载客量的数据属性。\n\
  \n然而，这种方法是低效的，因为所有三个类都有许多共同的数据属性。结果是，类将包含大量的重复代码。此外，如果我们稍后发现需要添加更多共同属性，我们就必须修改所有三个类。\n\
  \n更好的方法是编写一个 `Automobile` 父类来持有所有关于汽车的通用数据，然后为每种特定汽车编写子类。程序 11-1 显示了 `Automobile`\
  \ 类的代码，该代码出现在名为 `vehicles` 的模块中。\n\n# 程序 11-1 `(vehicles.py 的第 1 到 44 行)`\n\n```\n\
  \ 1  # The Automobile class holds general data\n 2  # about an automobile in inventory.\n\
  \ 3\n 4  class Automobile:\n 5      # The _ _init_ _method accepts arguments for\
  \ the\n 6      # make, model, mileage, and price. It initializes\n 7      # the\
  \ data attributes with these values.\n 8\n 9      def _ _init_ _(self, make, model,\
  \ mileage, price):\n10          self._ _make = make\n11          self._ _model =\
  \ model\n12          self._ _mileage = mileage\n13          self._ _price = price\n\
  14\n15      # The following are mutators\n 16      # for the class's data attributes.\n\
  \ 17\n 18      def set_make(self, make):\n19          self._ _make = make\n20\n\
  \ 21      def set_model(self, model):\n22          self._ _model = model\n23\n 24\
  \      def set_mileage(self, mileage):\n25          self._ _mileage = mileage\n\
  26\n 27      def set_price(self, price):\n28          self._ _price = price\n29\n\
  \ 30      # The following methods are accessors\n 31      # for the attributes.\n\
  \ 32\n 33      def get_make(self):\n34          return self._ _make\n35\n 36   \
  \   def get_model(self):\n37          return self._ _model\n38\n 39      def get_mileage(self):\n\
  40          return self._ _mileage\n41\n 42      def get_price(self):\n43      \
  \    return self._ _price\n44\n```\n\n`Automobile` 类的 `__init__` 方法接收品牌、型号、里程数和价格的参数。它用这些值初始化数据属性：\n\
  \n*   `make`\n*   `model`\n*   `mileage`\n*   `price`（当名称以下划线开头时，它是隐藏的。参考第十章） 18\
  \ 到 28 行的方法是修改器，33 到 43 行是访问器。\n\n`Automobile` 类是一个可以创建对象的完整类。如果我们愿意，可以写一个程序导入 `vehicle`\
  \ 模块并创建 `Automobile` 的实例。然而，`Automobile` 类仅持有通用数据。它没有持有经销商想要保留的关于汽车类型的任何特定数据。为了持有这些特定数据，我们将编写继承自\
  \ `Automobile` 类的子类。程序 11-2 显示了 `Car` 类的代码，它也在 `vehicles` 模块中。\n\n# 程序 11-2 `(vehicles.py\
  \ 的第 45 到 72 行)`\n\n```\n45  # The Car class represents a car. It is a subclass\n\
  46  # of the Automobile class.\n47\n48  class Car(Automobile):\n49      # The __init__\
  \ method accepts arguments for the\n50      # car's make, model, mileage, price,\
  \ and doors.\n51\n52      def __init__(self, make, model, mileage, price, doors):\n\
  53          # Call the superclass's __init__ method and pass\n54          # the\
  \ required arguments. Note that we also have\n55          # to pass self as an argument.\n\
  56          Automobile.__init__(self, make, model, mileage, price)\n57\n58     \
  \     # Initialize the _doors attribute.\n59          self._doors = doors\n60\n\
  61      # The set_doors method is the mutator for the\n62      # _doors attribute.\n\
  63\n64      def set_doors(self, doors):\n65          self._doors = doors\n66\n67\
  \      # The get_doors method is the accessor for the\n68      # _doors attribute.\n\
  69\n70      def get_doors(self):\n71          return self._doors\n72\n```\n\n仔细查看类声明的第一行，在第\
  \ 48 行：\n\n```\nclass Car(Automobile):\n```\n\n\n\n\n\n这一行表示我们正在定义一个名为 `Car` 的类，它继承自\
  \ `Automobile` 类。`Car` 类是子类，而 `Automobile` 类是父类。如果我们想表达 `Car` 类与 `Automobile` 类之间的关系，我们可以说一个\
  \ `Car` 是一辆 `Automobile`。因为 `Car` 类扩展了 `Automobile` 类，所以它继承了 `Automobile` 类的所有方法和数据属性。\n\
  \n看第 52 行中 `__init__` 方法的头部：\n\n```python\ndef __init__(self, make, model, mileage,\
  \ price, doors):\n```\n\n注意，除了必需的 `self` 参数外，该方法还有名为 `make`、`model`、`mileage`、`price`\
  \ 和 `doors` 的参数。这是合理的，因为一个 `Car` 对象将拥有有关汽车品牌、型号、里程数、价格和车门数量的数据属性。然而，这些属性中的某些是由 `Automobile`\
  \ 类创建的，因此我们需要调用 `Automobile` 类的 `__init__` 方法并将这些值传递给它。这这发生在第 56 行：\n\n```python\n\
  Automobile.__init__(self, make, model, mileage, price)\n```\n\n该语句调用了 `Automobile`\
  \ 类的 `__init__` 方法。注意该语句将 `self` 变量以及 `make`、`model`、`mileage` 和 `price` 变量作为参数传递。当该方法执行时，它会初始化\
  \ `__make`、`__model`、`__mileage` 和 `__price` 数据属性。然后，在第 59 行，`__doors` 属性使用传入 `doors`\
  \ 参数的值进行初始化：\n\n```python\nself.__doors = doors\n```\n\n第 64 行至 65 行的 `set_doors`\
  \ 方法是 `__doors` 属性的修改器（mutator），而第 70 行至 71 行的 `get_doors` 方法是 `__doors` 属性的访问器（accessor）。在继续之前，让我们展示一下\
  \ `Car` 类，如程序 11-3 所示。\n\n# 程序 11-3 `(car_demo.py)`\n\n```python\n 1  # 此程序演示了 Car\
  \ 类。\n 2\n 3  import vehicles\n 4\n 5  def main():\n 6      # 从 Car 类创建一个对象。\n 7\
  \      # 这辆车是一辆 2007 年奥迪，里程为 12,500 英里，价格\n 8      # 为 $21,500.00，有 4 扇门。\n 9  \
  \    used_car = vehicles.Car('Audi', 2007, 12500, 21500.0, 4)\n10\n11      # 显示汽车的数据。\n\
  12      print('Make:', used_car.get_make())\n13      print('Model:', used_car.get_model())\n\
  14      print('Mileage:', used_car.get_mileage())\n15      print('Price:', used_car.get_price())\n\
  16      print('Number of doors:', used_car.get_doors())\n17\n18  # 调用主函数。\n19  main()\n\
  ```\n\n### 程序输出\n\n```\nMake: Audi\nModel: 2007\nMileage: 12500\nPrice: 21500.0\n\
  Number of doors: 4\n```\n\n第 3 行导入了 `vehicles` 模块，该模块包含了 `Automobile` 和 `Car` 类的类定义。第\
  \ 9 行创建了 `Car` 类的实例，将 `'Audi'` 作为汽车品牌，`2007` 作为汽车型号，`12500` 作为里程数，`21500.0` 作为汽车价格，并将\
  \ `4` 作为车门数量。生成的对象赋值给变量 `used_car`。\n\n第 12 行至 15 行的语句调用了对象的对象的 `get_make`、`get_model`、`get_mileage`\
  \ 和 `get_price` 方法。尽管 `Car` 类本身没有这些方法，但它从 `Automobile` 类继承了它们。第 16 行调用了 `get_doors`\
  \ 方法，该方法定义在 `Car` 类中。\n\n现在让我们来看 `Truck` 类，它也继承自 `Automobile` 类。`Truck` 类的代码同样位于\
  \ `vehicles` 模块中，如程序 11-4 所示。\n\n# 程序 11-4 `(vehicles.py 的第 73 至 100 行)`\n\n```python\n\
  \ 73  # Truck 类代表一辆皮卡车。它是\n74  # Automobile 类的子类。\n75  class Truck(Automobile):\n\
  76      # __init__ 方法接收\n77      # 品牌、型号、里程、价格。\n78      def __init__(self, make,\
  \ model, mileage, price, drive_type):\n79          # 调用父类的 __init__ 方法\n80     \
  \     # 并传递这些参数。注意\n81          # 我们需要传递 self 变量。\n82          Automobile.__init__(self,\
  \ make, model, mileage, price)\n83          # 初始化\n84\n          self.__drive_type\
  \ = drive_type\n85\n86      # set_drive_type 方法是\n87      # __drive_type 属性的修改器。\n\
  88      def set_drive_type(self, drive_type):\n89          self.__drive_type = drive_type\n\
  90\n91      # get_drive_type 方法是\n92      # __drive_type 属性的访问器。\n93      def get_drive_type(self):\n\
  94          return self.__drive_type\n```\n\n`Truck` 类的 `__init__` 方法始于第 78 行。它接收品牌、型号、里程、价格等参数。正如\
  \ `Car` 类一样，`Truck` 类调用了 `Automobile` 类的 `__init__` 方法（第 82 行）。第 84 行创建了 `__drive_type`\
  \ 属性。\n\n`set_drive_type` 方法位于第 88 行至 89 行是 `__drive_type` 属性的修改器，而第 93 行至 94 行的\
  \ `get_drive_type` 方法是该属性的访问器。\n\n现在让我们来看 `SUV` 类，它也继承自 `Automobile` 类。`SUV` 类的代码位于\
  \ `vehicles` 模块中，如程序 11-5 所示。\n\n# 程序 11-5 `(vehicles.py 的第 101 至 128 行)`\n\n```python\n\
  101  # SUV 类代表一辆多用途运动车。它\n102  # 是 Automobile 类的子类。\n103\n104  class SUV(Automobile):\n\
  105      # __init__ 方法接收\n106      # 品牌、型号、里程、价格和\n107      # 载容量。\n108\n109   \
  \   def __init__(self, make, model, mileage, price, pass_cap):\n110          # 调用父类的\
  \ __init__ 方法\n111          # 并传递这些参数。注意\n112          # 我们需要传递 self 变量。\n113  \
  \        Automobile.__init__(self, make, model, mileage, price)\n114\n115      \
  \    # 初始化\n116          self.__pass_cap = pass_cap\n117\n118      # set_pass_cap\
  \ 方法是\n119      # __pass_cap 属性的修改器。\n120\n121      def set_pass_cap(self, pass_cap):\n\
  122          self.__pass_cap = pass_cap\n123\n124      # get_pass_cap 方法是\n125 \
  \     # __pass_cap 属性的访问器。\n126\n127      def get_pass_cap(self):\n128         \
  \ return self.__pass_cap\n```\n\n`SUV` 类的 `__init__` 方法始于第 109 行。它接收品牌、型号、里程、价格和载容量参数。正如\
  \ `Car` 和 `Truck` 类一样，`SUV` 类调用了 `Automobile` 类的 `__init__` 方法（第 113 行），并将品牌、型号、里程和价格作为参数。第\
  \ 116 行创建了 `__pass_cap` 属性，其值为传入 `pass_cap` 参数的值。\n\n`set_pass_cap` 方法在第 121 行至\
  \ 122 行是 `__pass_cap` 属性的修改器，而第 127 行至 128 行的 `get_pass_cap` 方法是该属性的访问器。\n\n\n\n\
  \n\n```python\n 1  # 此程序创建了一个 Car 对象、一个 Truck 对象、\n 2  # 以及一个 SUV 对象。\n 3\n4  import\
  \ vehicles\n 5\n6  def main():\n 7      # 为一辆二手 2001 年 BMW 创建 Car 对象，\n 8      #\
  \ 里程 70,000 英里，价格为 $15,000，有\n 9      # 4 个门。\n10      car = vehicles.Car('BMW',\
  \ 2001, 70000, 15000.0, 4)\n11\n12      # 为一辆二手 2002 年丰田\n13      # 皮卡卡创建 Truck\
  \ 对象，里程 40,000 英里，价格为\n14      # $12,000，四轮驱动。\n15      truck = vehicles.Truck('Toyota',\
  \ 2002, 40000, 12000.0, '4WD')\n16\n17      # 为一辆二手 2000 年\n18      # 沃尔沃创建 SUV\
  \ 对象，里程 30,000 英里，价格为\n19      # $18,500，可容纳 5 人。\n20      suv = vehicles.SUV('Volvo',\
