  \n# 程序 10-22 (servicequote.py)\n\n```python\n 1  # Constant for the sales tax rate\n\
  \ 2  TAX_RATE = 0.05\n 3\n 4  # ServiceQuote class\n 5  class ServiceQuote:\n 6\
  \     def __init__(self, pcharge, lcharge):\n 7          self._parts_charges = pcharge\n\
  \ 8          self._labor_charges = lcharge\n 9\n10     def set_parts_charges(self,\
  \ pcharge):\n11         self._parts_charges = pcharge\n12\n13     def set_labor_charges(self,\
  \ lcharge):\n14         self._labor_charges = lcharge\n15\n16     def get_parts_charges(self):\n\
  17         return self._parts_charges\n18\n19     def get_labor_charges(self):\n\
  20         return self._labor_charges\n21\n22     def get_sales_tax(self):\n23 \
  \        return self._parts_charges * TAX_RATE\n24\n25     def get_total_charges(self):\n\
  26         return self._parts_charges + self._labor_charges + \\\n27           \
  \       (self._parts_charges * TAX_RATE)\n```\n\n# 这仅仅是开始\n\n\n\n\n你应该仅仅将本节中讨论的过程视为一个起点。重要的一点是意识到，设计一个面向对象的应用程序是一个迭代过程。你可能需要尝试几次才能识别出你所有需要的类，并确定它们的所有职责。随着设计过程的展开，你将对问题有更深入的理解，因此你会看到改进设计的方法。\n\
