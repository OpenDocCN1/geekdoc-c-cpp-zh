  \n## 6. 文件分析\n\n编写一个程序读取两个文本文件的内容并按以下方式进行比较：\n\n- 它应该显示两个文件中包含的所有唯一单词列表。\n- 它应该显示出现在两个文件中单词列表。\n\
  - 它应该显示出现在第一个但不在第二个文件中单词列表。\n- 它应该显示出现在第二个但不在第一个文件中单词列表。\n- 它应该显示出现在其中一个但不在两者的单词列表。\n\
  \n提示：使用集合操作执行这些分析。\n\n## 7. 世界大赛冠军\n\n在本章中，你会找到一个名为 `WorldSeriesWinners.txt` 的文件。该文件包含了从\
