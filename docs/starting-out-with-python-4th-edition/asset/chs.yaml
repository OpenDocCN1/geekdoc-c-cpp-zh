  \n# 第 9 章 字典与集合\n\n## 9.1 字典\n\n### 概念\n\n字典是一个存储数据集合的对象。字典中的每个元素都有两个部分：键（key）和值（value）。你使用键来定位特定的值。\n\
  \n当你听到“dictionary”（字典）这个词时，你可能会想到像《梅辞-韦伯斯特词典》那样的大书，其中包含了单词及其定义。如果你想知道某个特定单词的含义，可以在字典中找到它并查看其定义。\n\
  \n在 Python 中，`dictionary` 是一个存储数据集合的对象。存储在字典中的每个元素都有两个部分：`key` 和 `value`。事实上，字典元素通常被称为\
  \ `key-value pairs`（键值对）。当你想要从字典中检索一个特定值时，你使用与该值关联的键。这类似于在《梅辞-韦伯斯特词典》中查找单词的过程，其中单词是键，定义是值。\n\
  \n例如，假设公司里的每位员工都有一个 ID 号，我们想写一个程序，让我们通过输入员工的 ID 号来查找该员工的名字。我们可以创建一个字典，其中每个元素包含一个员工\
  \ ID 号作为键，该员工的名字作为值。如果我们知道某个员工的 ID 号，就可以检索到该员工的名字。\n\n另一个例子是编写一个程序，让我们输入一个姓名并给出该人的电话号码。该程序可以使用字典，其中每个元素包含一个姓名作为键，该人的电话号码作为值。如果我们知道一个人的姓名，就可以检索到该人的电话号码。\n\
  \n### ![](img/ICON_NOTE.png) 注意：\n\n键值对通常被称为 `mappings`（映射），因为每个键都映射到一个值。\n\n##\
  \ 创建字典\n\n你可以通过将元素放在一组大括号（`{}`）内部创建一个字典。一个元素由一个键、一个冒号以及一个值组成。元素之间用逗号分隔。以下语句显示了一个示例：\n\
  \n```\nphonebook = {'Chris':'555−1111', 'Katie':'555−2222', 'Joanne':'555−3333'}\n\
  ```\n\n该语句创建了一个字典并将其赋值给变量 `phonebook`。该字典包含以下三个元素：\n\n*   第一个元素是 `'Chris':'555−1111'`。在这个元素中，键是\
  \ `'Chris'`，值是 `'555−1111'`。\n*   第二个元素是 `'Katie':'555−2222'`。在这个元素中，键是 `'Katie'`，值是\
  \ `'555−2222'`。\n*   第三个元素是 `'Joanne':'555−3333'`。在这个元素中，键是 `'Joanne'`，值是 `'555−3333'`。\n\
  \n在这个示例中，键和值都是字符串。字典中的值可以是任何类型的对象，但键必须是不可变对象。例如，键可以是字符串、整数、浮点数或元组。键不能是列表或任何其他类型的不可变对象。\n\
  \n## 从字典中检索值\n\n字典中的元素不是存储在任何特定顺序中的。例如，查看下面的交互式会话，其中创建了字典并显示了它的元素：\n\n```\n>>> phonebook\
  \ = {'Chris':'555−1111', 'Katie':'555−2222', 'Joanne':'555−3333'} \n>>> phonebook\
  \ \n{'Chris': '555−1111', 'Joanne': '555−3333', 'Katie': '555−2222'}\n>>>\n```\n\
  \n注意元素元素的顺序与它们创建的顺序不同。这说明字典不是像列表、元组和字符串那样的序列；你不能使用数字索引。要从字典中检索值，你可以使用键。通用格式如下：\n\
  \n```\ndictionary_name[key]\n```\n\n在表达式中，`dictionary_name` 是字典，`key` 是你要使用的键。如果键存在于字典中，就会返回该键关联的值。如果键不存在，则会抛出\
  \ `KeyError`。以下交互会话演示了这一点：\n\n```\n>>> phonebook = {'Chris':'555−1111', 'Katie':'555−2222',\
  \ 'Joanne':'555−3333'}\n>>> phonebook['Chris']\n'555−1111'\n>>> phonebook['Joanne']\n\
  '555−3333'\n>>> phonebook['Katie']\n'555−2222'\n>>> phonebook['Kathryn']\nTraceback\
  \ (most recent call last):\n  File \"<pshell>\", line 1, in <module>\n    phonebook['Kathryn']\n\
  KeyError: 'Kathryn'\n>>>\n```\n\n让我们仔细观察会话：\n\n*   第 1 行创建一个包含姓名（键）和电话号码（值）的字典。\n\
  *   第 2 行，表达式 `phonebook['Chris']` 返回 `phonebook` 字典中与 `'Chris'` 关联的值。该值在第 3 行显示。\n\
  *   第 4 行，表达式 `phonebook['Joanne']` 返回 `phonebook` 字典中与 `'Joanne'` 关联的值。该值在第 5 行显示。\n\
  *   第 6 行，表达式 `phonebook['Katie']` 返回 `phonebook` 字典中与 `'Katie'` 关联的值。该值在第 7 行显示。\n\
  *   第 8 行，输入了 `phonebook['Kathryn']`。`phonebook` 字典中没有 `'Kathryn'` 键，因此抛出了 `KeyError`\
  \ 异常。\n\n### ![](img/ICON_NOTE.png) 注意：\n\n记住字符串比较是大小敏感的。表达式 `phonebook['katie']`\
  \ 将无法找到键 `'Katie'`。\n\n## 使用 `in` 和 `not in` 运算符测试字典中的值\n\n如之前所示，如果你使用不存在的键从字典中检索值，就会引发\
  \ `KeyError` 异常。为了防止这种异常，你可以在尝试使用键检索值之前，使用 `in` 运算符确定键是否存在。以下交互式会话演示了这一点：\n\n```\n\
  1 >>> phonebook = {'Chris':'555−1111', 'Katie':'555−2222', 'Joanne':'555−3333'}\
  \ \n2 >>> if 'Chris' in phonebook: \n3       print(phonebook['Chris'])  \n4 \n5\
  \ 555−1111\n6 >>>\n```\n\n第 2 行的 `if` 语句确定 `'Chris'` 是否在 `phonebook` 字典中。如果是，第 3\
  \ 行的语句将显示与该键关联的值。\n\n你也可以使用 `not` `in` 运算符来确定键是否不存在，如下会话所示：\n\n\n\n\n\n```\n1  >>>\
  \ phonebook = {'Chris':'555−1111', 'Katie':'555−2222'} \n2  >>> if 'Joanne' not\
  \ in phonebook: \n3         print('Joanne is not found.')  \n4  \n5 Joanne is not\
  \ found.\n6  >>>\n```\n\n### 注意：\n\n### 注意：\n\n请记住，使用 `in` 和 `not in` 运算符进行的字符串比较是区分大小写的。\n\
  \n## 向现有字典添加元素\n\n字典是可变对象。你可以使用以下通用格式的赋值语句向字典中添加新的键值对：\n\n```\ndictionary_name[key]\
  \ = value\n```\n\n在通用格式中，`dictionary_name` 是引用字典的变量，`key` 是一个键。如果 `key` 已经存在于字典中，其关联的值将被更改为\
  \ `value`。如果 `key` 不存在，它将被添加到字典中，并将 `value` 作为其关联值。下面的交互式会演示了：\n\n```\n1  >>> phonebook\
  \ = {'Chris':'555−1111', 'Katie':'555−2222',\n   'Joanne':'555−3333'} \n2  >>> phonebook['Joe']\
  \ = '555−0123' \n3  >>> phonebook['Chris'] = '555−4444' \n4  >>> phonebook \n5 \
  \ {'Chris': '555−4444', 'Joanne': '555−3333', 'Joe': '555−0123',     'Katie': '555−2222'}\n\
  6  >>>\n```\n\n让我们仔细查看一下会话：\n\n- 第 1 行创建了一个包含名称（作为键）和电话（作为值）的字典。\n- 第 2 行的语句向 `phonebook`\
  \ 字典添加了一个新的键值对。因为字典中没有键 `'Joe'`，此语句添加了键 `'Joe'` 以及其关联的值 `'555−0123'`。\n- 第 3 行的语句更改与现有键关联的值。因为键\
  \ `'Chris'` 已经存在于 `phonebook` 字典中，此语句将其关联的值更改为 `'555−4444'`。\n- 第 4 行显示了 `phonebook`\
  \ 字典的内容。输出显示在第 5 行。\n\n### 注意：\n\n### 注意：\n\n字典中不能有重复的键。当你给现有键分配值时，新值将替换旧值。\n\n\
  ## 删除元素\n\n你可以使用 `del` 语句从字典中删除现有的键值对。以下是通用格式：\n\n```\ndel dictionary_name[key]\n\
  ```\n\n在通用格式中，`dictionary_name` 是引用字典的变量，`key` 是一个键。语句执行后，`key` 及其关联的值将从字典中删除。如果\
  \ `key` 不存在，将抛出 `KeyError` 异常。下面的交互式会话演示了：\n\n```\n 1  >>> phonebook = {'Chris':'555−1111',\
  \ 'Katie':'555−2222',\n    'Joanne':'555−3333'} \n 2  >>> phonebook \n 3  {'Chris':\
  \ '555−1111', 'Joanne': '555−3333', 'Katie': '555−2222'}\n 4  >>> del phonebook['Chris']\
  \ \n 5  >>> phonebook \n 6  {'Joanne': '555−3333', 'Katie': '555−2222'}\n 7  >>>\
  \ del phonebook['Chris'] \n 8  Traceback (most recent call last):\n 9      File\
  \ \"<pyshell#5>\", line 1, in <module>\n10          del phonebook['Chris']\n11 \
  \ KeyError: 'Chris'\n12  >>>\n```\n\n让我们仔细查看一下会话：\n\n- 第 1 行创建了一个字典，第 2 行显示了它的内容。\n\
  - 第 4 行删除了键为 `'Chris'` 的元素，第 5 行显示了字典的内容。你可以从第 6 行的输出看出该元素已不再字典中。\n- 第 7 行再次尝试删除键为\
  \ `'Chris'` 的元素。因为该元素已不存在，所以抛出了 `KeyError` 异常。\n\n为了防止抛出 `KeyError` 异常，你应该在尝试删除键及其关联值之前，使用\
  \ `in` 运算符来确定该键是否存在。下面的交互式会话演示了：\n\n```\n1  >>> phonebook = {'Chris':'555−1111',\
  \ 'Katie':'555−2222',\n   'Joanne':'555−3333'} \n2  >>> if 'Chris' in phonebook:\
  \ \n3         del phonebook['Chris']  \n4  \n5  >>> phonebook \n6  {'Joanne': '555−3333',\
  \ 'Katie': '555−2222'}\n7  >>>\n```\n\n## 获取字典中的元素数量\n\n你可以使用内置的 `len` 函数获取字典中元素的数量。下面的交互式会话演示了：\n\
  \n```\n1  >>> phonebook = {'Chris':'555−1111', 'Katie':'555−2222'}\n2  >>> len(phonebook)\n\
  2\n```\n（注：此处由于原文中示例不完整，已根据逻辑补全）\n\n## 字典中的混合类型\n\n如前所述，字典中的键必须是不可变的，但值可以是任何类型。例如，值可以是列表，如在下面的会话所示。键也可以是不同的类型，只要它们是不可变的。下面的交互式会话演示了如何在字典中混合不同类型：\n\
  \n```\n1  >>> mixed_dict = {'apple': 5, 'banana': [1, 2, 3], 'orange': (4, 5)}\n\
  2  >>> mixed_dict\n{'apple': 5, 'banana': [1, 2, 3], 'orange': (4, 5)}\n3  >>>\n\
  ```\n（注：由于原文提供的文本在结尾部分存在大量重复和混乱，此处已根据上下文进行了整理与翻译）\n\n\n\n\n\n以下交互会提供了一个更具实践性的示例。它创建了一个包含员工各种数据的字典：\n\
  \n```\n1  >>> employee = {'name' : 'Kevin Smith', 'id' : 12345, 'payrate' :    25.75\
  \ } \n2  >>> employee \n3  {'payrate': 25.75, 'name': 'Kevin Smith', 'id': 12345}\n\
  4  >>>\n```\n\n第 1 行中的此语句创建了一个字典并将其赋值给变量 `employee`。该字典包含以下元素：\n\n*   第一个元素是 `'name'\
  \ : 'Kevin Smith'`。在这个元素中，键是字符串 `'name'`，值是字符串 `'Kevin Smith'`。\n*   第二个元素是 `'id'\
  \ : 12345`。在这个元素中，键是字符串 `'id'`，值是整数 `12345`。\n*   第三个元素是 `'payrate' : 25.75`。在这个元素中，键是字符串\
  \ `'payrate'`，值是浮点数 `25.75`。\n\n# 创建空字典\n\n有时，你需要创建一个空字典，并在程序执行过程中向其添加元素。你可以使用空的大括号来创建一个空字典，如下面的交互会话所示：\n\
  \n```\n1  >>> phonebook = {} \n2  >>> phonebook['Chris'] = '555−1111' \n3  >>> phonebook['Katie']\
  \ = '555−2222' \n4  >>> phonebook['Joanne'] = '555−3333' \n5  >>> phonebook \n6\
  \  {'Chris': '555−1111', 'Joanne': '555−3333', 'Katie': '555−2222'}\n7  >>>\n```\n\
  \n第 1 行的语句创建了一个空字典并将其赋值给变量 `phonebook`。第 2 到第 4 行向字典添加了键值对，第 5 行的语句显示了字典的内容。\n\n\
  你也可以使用内置的 `dict()` 方法来创建空字典，如下语句所示：\n\n```\nphonebook = dict()\n```\n\n执行此语句后，`phonebook`\
  \ 变量将引用一个空字典。\n\n# 使用 `for` 循环遍历字典\n\n你可以使用以下通用格式的 `for` 循环遍历字典中的所有的键：\n\n```python\n\
  for var in dictionary:\n    statement\n    statement \n    etc.\n```\n\n在通用格式中，`var`\
  \ 是变量名，`dictionary` 是字典名。该循环会为字典中的每个元素迭代一次。每次循环迭代时，`var` 被赋值为一个键。接下来的交互会话演示：\n\n\
  ```\n1  >>> phonebook = {'Chris':'555−1111', \n2                  'Katie':'555−2222',\
  \ \n3                  'Joanne':'555−3333'} \n4  >>> for key in phonebook: \n5 \
  \        print(key)  \n6  \n7  \n8  Chris\n9  Joanne\n10  Katie\n11  >>> for key\
  \ in phonebook: \n12         print(key, phonebook[key])  \n13  \n14  \n15  Chris\
  \ 555−1111\n16  Joanne 555−3333\n17  Katie 555−2222\n18  >>>\n```\n\n以下是会话中语句的总结：\n\
  \n*   第 1 到第 3 行创建一个包含三个元素的字典并将其赋值给变量 `phonebook`。\n*   第 4 到第 5 行包含一个 `for` 循环，该循环会为\
  \ `phonebook` 字典的每个元素迭代一次。每次循环迭代时，`key` 变量被赋值为一个键。第 5 行打印 `key` 变量的值。第 8 到第 9 行显示循环的输出。\n\
  *   第 11 到第 12 行包含另一个 `for` 循环，它会为 `phonebook` 字典的每个元素迭代一次，并将键赋值给 `key` 变量。第 5 行打印\
  \ `key` 变量，随后是与该键关联的值。第 15 到第 17 行显示循环的输出。\n\n# 一些字典方法\n\n字典对象有多个方法。在本节中，我们将查看其中一些更有用的方法，它们总结在表\
  \ 9−1 中。\n\n| 方法 | 说明 |\n| --- | --- |\n| `clear` | 清空字典的内容。 |\n| `get` | 获取与指定键关联的值。如果未找到键，该方法不会抛出异常，而是返回一个默认值。\
  \ |\n| `items` | 返回字典所有的键及其关联的值，以元组序列的形式。 |\n| `keys` | 返回字典所有的键。 |\n| `pop` | 返回与指定键关联的值并从字典中删除该键。\
  \ |\n| `popitem` | 返回并删除字典中的一个随机的键值对。 |\n| `values` | 返回字典所有的值。 |\n\n\n\n\n\n* \
  \  第 1 到 3 行创建一个包含三个元素的字典，并将其赋值给变量 `phonebook`。\n*   第 4 到 5 行的 `for` 循环调用了 `phonebook.items()`\
  \ 方法，该方法返回一个包含字典中键值对的元组序列。循环会为序列中的每个元组迭代一次。循环每次迭代时，元组的值会被赋值给 `key` 和 `value` 变量。第\
  \ 5 行打印 `key` 变量的值，紧接着打印 `value` 变量的值。第 8 到 10 行显示了循环的输出。\n\n# `keys` 方法\n\n`keys`\
  \ 方法将字典的所有键作为字典视图（dictionary view）返回，字典视图是序列的一种类型。字典视图中的每个元素都是字典中的一个键。例如，假设我们创建了以下字典：\n\
  \n```python\nphonebook = {'Chris':'555−1111', 'Katie':'555−2222', 'Joanne':'555−3333'}\n\
  ```\n\n如果我们调用 `phonebook.keys()` 方法，它将返回以下序列：\n\n```python\n['Chris', 'Joanne',\
  \ 'Katie']\n```\n\n下面的交互会话展示了如何使用 `for` 循环来遍历由 `keys` 方法返回的序列：\n\n```python\n1 \
  \ >>> phonebook = {'Chris':'555−1111', \n 2                  'Katie':'555−2222',\
  \ \n 3                  'Joanne':'555−3333'} \n 4  >>> for key in phonebook.keys():\
  \ \n 5         print(key)  \n 6  \n 7  \n 8  Chris\n9  Joanne\n10  Katie\n11  >>>\n\
  ```\n\n# `pop` 方法\n\n`pop` 方法返回与指定键关联的值，并从字典中删除该键值对。如果未找到该键，方法将返回一个默认值。该方法的通用格式如下：\n\
  \n```pythondictionary.pop(key, default)\n```\n\n在通用格式中，`dictionary` 是字典的，`key` 是要在字典中查找的键，`default`\
  \ 是未找到键时返回的默认值。调用该方法时，它返回与指定 `key` 关联的值，并从字典中删除该键值对。如果字典中未找到指定的 `key`，方法将返回 `default`。下面的交互会话演示了：\n\
  \n```python\n1  >>> phonebook = {'Chris':'555−1111', \n 2                  'Katie':'555−2222',\
  \ \n 3                  'Joanne':'555−3333'} \n 4  >>> phone_num = phonebook.pop('Chris',\
  \ 'Entry not found') \n 5  >>> phone_num \n 6  '555−1111'\n 7  >>> phonebook \n\
  \ 8  {'Joanne': '555−3333', 'Katie': '555−2222'}\n 9  >>> phone_num = phonebook.pop('Andy',\
  \ 'Element not found') \n10  >>> phone_num \n11  'Element not found'\n12  >>> phonebook\
  \ \n13  {'Joanne': '555−3333', 'Katie': '555−2222'}\n14  >>>\n```\n\n以下是会话中语句的总结：\n\
  \n*   第 1 到 3 行创建一个包含三个元素的字典，并将其赋值给变量 `phonebook`。\n*   第 4 行调用 `phonebook.pop()`\
  \ 方法，将 `'Chris'` 作为要查找的键传递。返回与键 `'Chris'` 关联的值并赋值给变量 `phone_num`。包含键 `'Chris'` 的键值对从字典中删除。\n\
  *   第 5 行显示赋值给 `phone_num` 变量的值。输出显示在第 6 行。注意，这是与键 `'Chris'` 关联的值。\n*   第 7 行显示\
  \ `phonebook` 字典的内容。输出在第 8 行。注意包含键 `'Chris'` 的键值对已不在字典中了。\n*   第 9 行调用 `phonebook.pop()`\
  \ 方法，将 `'Andy'` 作为要查找的键传递。未找到该键，因此字符串 `'Entry not found'` 被赋值给 `phone_num` 变量。\n\
  *   第 10 行显示赋值给 `phone_num` 变量的值。输出显示在第 11 行。\n*   第 12 行显示 `phonebook` 字典的内容。输出在第\
  \ 13 行。\n\n# `popitem` 方法\n\n`popitem` 方法返回一个随机选择的键值对，并从字典中删除该键值对。该键值对以元组的形式返回。该方法的通用格式如下：\n\
  \n```pythondictionary.popitem()\n```\n\n你可以使用以下通用格式的赋值语句将返回的键和值赋值给单独的变量：\n\n```python\n\
  k, v = dictionary.popitem()\n```\n\n这种赋值被称为“多赋值”（multiple assignment），因为同时赋值了多个变量。在通用格式中，`k`\
  \ 和 `v` 是变量。语句执行后，`k` 被赋值为字典中随机选择的键，`v` 被赋值为该键关联的值。该键值对从字典中删除。下面的交互会话演示了：\n\n```python\n\
  1  >>> phonebook = {'Chris':'555−1111', \n 2                  'Katie':'555−2222',\
  \ \n 3                  'Joanne':'555−3333'} \n 4  >>> k, v = phonebook.popitem()\
  \ \n 5  >>> print(k, v) \n 6  Chris 555−1111\n 7  >>> phonebook \n 8  {'Joanne':\
  \ '555−3333', 'Katie': '555−2222'}\n```\n\n# `values` 方法\n\n`values` 方法将字典所有的值作为字典视图返回，字典视图是序列的一种。字典视图中的每个元素都是字典中的一个值。例如，假设我们创建了以下字典：\n\
  \n```python\nphonebook = {'Chris':'555−1111', 'Katie':'555−2222', 'Joanne':'555−3333'}\n\
  ```\n\n如果我们调用 `phonebook.values()` 方法，它将返回以下序列：\n\n```python\n['555−1111', '555−2222',\
  \ '555−3333']\n```\n\n下面的交互会话展示了如何使用 `for` 循环来遍历由 `values` 方法返回的序列：\n\n```python\n\
  1  >>> phonebook = {'Chris':'555−1111', \n 2                  'Katie':'555−2222',\
  \ \n 3                  'Joanne':'555−3333'} \n 4  >>> for val in phonebook.values():\
