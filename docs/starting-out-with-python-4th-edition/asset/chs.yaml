  \ from_peg, temp_peg, to_peg)\n```\n\n该语句是一个指令，使用 `to_peg` 作为临时柱，将 `from_peg` 除一个以外的所有盘子移动到\
  \ `temp_peg`。下一个语句如下：\n\n```python\nprint('Move a disc from peg', from_peg, 'to\
  \ peg', to_peg)\n```\n\n这仅仅是显示一条消息，指示应将一个盘子从 `from_peg` 移动到 `to_peg`。接下来，执行另一个递归调用：\n\
