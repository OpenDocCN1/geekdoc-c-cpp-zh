  Serializing a object is the process of converting the object to a stream of bytes\
  \ that can be saved to a file for later retrieval. In Python, object serialization\
  \ is called pickling.\n\n[content]\n### 概念\n对象序列化是将对象转换为字节流的过程，该字节流可以保存到文件中以便日后检索。在\
  \ Python 中，对象序列化被称为 pickleling（腌化）。\n\n\n\n你可以从文件中反序列化（unpickle）任意数量的对象。（如果尝试读取超过文件末尾，`load`\
  \ 函数将抛出 `EOFError` 异常。）当你完成操作后，调用文件对象的 `close` 方法来关闭文件。下面的交互式会话提供了一个反序列化在上一个会话中序列化的\
  \ `phonebook` 字典的简单演示：\n\n```\n1  >>> import pickle \n2  >>> input_file = open('phonebook.dat',\
  \ 'rb') \n3  >>> pb = pickle.load(inputfile) \n4  >>> pb \n5  {'Chris': '555−1111',\
  \ 'Joanne': '555−3333', 'Katie': '555−2222'}\n6  >>> input_file.close() \n7  >>>\n\
  ```\n\n让我们仔细查看这段会话：\n\n- 第 1 行导入了 `pickle` 模块。\n- 第 2 行以二进制读取模式打开名为 `phonebook.dat`\
  \ 的文件。\n- 第 3 行调用 `pickle` 模块的 `load` 函数，从 `phonebook.dat` 文件中检索并反序列化一个对象。结果对象被赋值给变量\
  \ `pb`。\n- 第 4 行显示了 `pb` 变量引用的字典。输出显示在第 5 行。\n- 第 6 行关闭了 `phonebook.dat` 文件。\n\n\
  程序 9-4 显示了一个演示对象序列化（pickling）的示例程序。它提示用户输入任意数量的人的个人信息（姓名、年龄和体重）。每当用户输入一个人的信息时，该信息就会存储在字典中，然后该字典被序列化并保存到名为\
  \ `info.dat` 的文件中。程序结束后，`info.dat` 文件将为用户输入过信息的每一个人保留一个序列化的字典对象。\n\n# 程序 9-4 `(pickle_objects.py)`\n\
  \n```\n 1  # 此程序演示了对象序列化。\n 2  import pickle\n3\n 4  # main 函数\n 5  def main():\n\
  6      again = 'y' # 用于控制循环重复\n7\n 8      # 以二进制写入模式打开文件。\n 9      output_file =\
  \ open('info.dat', 'wb')\n10\n11      # 获取数据直到用户想要停止。\n12      while again.lower()\
  \ == 'y':\n13          # 获取一个人的数据并保存。\n14          save_data(output_file)\n15\n\
  16          # 用户是否还想输入更多数据？\n17          again = input('Enter more data? (y/n):\
  \ ')\n18\n19      # 关闭文件。\n20      output_file.close()\n21\n22  # save_data 函数获取一个人的数据，\n\
  23  # 将其存储在字典中，然后将字典\n24  # 序列化到指定文件中。\n25  def save_data(file):\n26      # 创建一个空字典。\n\
  27      person = {}\n28\n29      # 获取人的数据并将其\n30      # 存储在字典中。\n31      person['name']\
  \ = input('Name: ')\n32      person['age'] = int(input('Age: '))\n33      person['weight']\
  \ = float(input('Weight: '))\n34\n35      # 序列化字典。\n36      pickle.dump(person,\
  \ file)\n37\n38  # 调用 main 函数。\n39  main()\n```\n\n**程序输出**（输入部分用粗体显示）\n\n```\n\
  Name: Angie \nAge: 25 \nWeight: 122 \nEnter more data? (y/n): y \nName: Carl \n\
  Age: 28 \nWeight: 175 \nEnter more data? (y/n): n \n```\n\n让我们仔细查看 `main` 函数：\n\n\
  - 在第 6 行初始化的变量 `again` 用于控制循环的重复。\n- 第 9 行以二进制写入模式打开文件 `info.dat`。该文件对象被赋值给变量 `output_file`。\n\
  - 第 12 行开始的 `while` 循环只要 `again` 变量引用 `'y'` 或 `'Y'` 就会重复。\n- 在 `while` 循环内部，第 14\
  \ 行调用 `save_data` 函数，并将 `output_file` 变量作为参数传递。`save_data` 函数的目的是获取一个人的数据，并将其作为序列化的字典对象保存到文件中。\n\
  - 第 17 行提示用户输入 y 或 n 以表示他们是否想输入更多数据。输入结果被赋值给 `again` 变量。\n- 在循环之外，第 20 行关闭了文件。\n\
  \n现在，让我们来看 `save_data` 函数：\n\n- 第 27 行创建了一个由 `person` 变量引用的空字典。\n- 第 31 行提示用户输入人的姓名并存储在字典中。\n\
