  \ Joe 亏损了。\n\n### 13. 种植葡萄藤\n\n葡萄园主正在种植几排新葡萄藤，需要知道每行种多少葡萄藤。她确定在测量了未来某行的长度后，可以使用以下公式计算每行可以容纳的葡萄藤数量，以及每行末端需要建造的葡萄架端柱组件：\n\
  \n$$V = \\frac{R - 2E}{S}$$\n\n公式中的各项含义为：\n\n*   `V` 是每行可以容纳的葡萄藤数量。\n*   `R` 是行的长度。\n\
  *   `E` 是葡萄架端柱组件。\n*   `S` 是间距。\n\n编写一个程序为葡萄园主进行计算。该程序应要求输入：\n\n*   行的长度\n*   端柱组件的数量\n\
  *   葡萄藤之间的间距\n\n### 14. 复利\n\n当银行账户支付复利时，它不仅对本金支付利息，还对随时间积累的利息支付利息。假设你想储蓄账户中存入资金，并使其产生多年。计算指定年后余额的公式为：\n\
  \n$$A = P\\left(1 + \\frac{r}{n} \\right)^{nt}$$\n\n公式中的各项含义为：\n\n*   `A` 是指定后的账户金额。\n\
  *   `P` 是存入本金。\n*   `r` 是年利率。\n*   `n` 是每年复利的次数。\n*   `t` 是指定的年。\n\n编写一个程序为你进行计算。该程序应要求用户输入：\n\
  \n*   本金金额\n*   年利率\n*   每年复利的次数（例如，如果每月复利，输入 12；如果季度复利，输入 4。）\n*   账户产生利利的年数\n\n\
  ### 15. 龟龟图形绘制\n\n使用 turtle 图形库编写程序，重现图 2-34 所示的每一个设计。\n\n\n\n\n\n`control structure`（控制结构）是一种控制一组语句执行顺序的逻辑设计。到本书为止，我们只使用过最简单的一种控制结构：顺序结构。`sequence\
  \ structure`（顺序结构）是一组按照它们出现的顺序执行的语句。例如，以下代码就是一个顺序结构，因为这些语句是从上到下执行的：\n\n```\nname\
  \ = input('What is your name? ')\nage = int(input('What is your age? '))\nprint('Here\
  \ is the data you entered:')\nprint('Name:', name)\nprint('Age:', age)\n```\n\n\
  尽管顺序结构在编程中被广泛使用，但它无法处理所有类型的任务。这是因为某些问题无法通过顺序执行一组有序的步骤来解决。例如，考虑一个计算工资的程序，它用于判断员工是否加班。如果员工工作时间超过\
  \ 40 小时，他或她将为超过 40 小时的所有小时获得额外报酬。否则，应该跳过加班计算。此类程序需要不同类型的控制结构：一种只有在特定情况下才执行一组语句的结构。这可以通过\
  \ `decision structure`（决策结构）来实现。（决策结构也称为 `selection structures`，选择结构。）\n\n在决策结构的简单形式中，只有当存在特定条件时才会执行特定操作。如果条件不存在，则不执行该操作。图\
  \ 3-1 所示的流程图了如何将日常决策的逻辑绘制成决策结构。菱形符号表示真/假条件。如果条件为真，我们遵循一条路径，执行该操作；如果条件为假，我们遵循另一条路径，跳过该操作。\n\
  \n![说明简单决策结构的流程图](img/fg03_00100.png)\n\n### 图 3-1 一个简单的决策结构\n\n图 3-1 完整替代文本\n\n\
  在流程图中，菱形符号表示必须测试的条件。在这种情况下，我们正在判断条件 `Cold outside`（外面很冷）是真是假。如果该条件为真，则执行操作 `Wear\
  \ a coat`（穿大衣）。如果条件为假，则跳过该操作。该操作是 `conditionally executed`（条件条件执行的），因为它只在特定条件为真时才执行。\n\
  \n程序员将图 3-1 所示的决策结构类型称为 `single alternative decision structure`（单分支决策结构）。这是因为它只提供了一条备选执行路径。如果菱形中的条件为真，我们就走备选路径；否则，我们退出该结构。图\
  \ 3-2 展示了一个更复杂的示例，其中只有在外面很冷时才会执行三个操作。它仍然是一个单分支决策结构，因为只有一条备选执行路径。\n\n![说明在外面很冷时执行三个操作的决策结构的流程图](img/fg03_00200.png)\n\
  \n### 图 3-2 在外面很冷时执行三个操作的决策结构\n\n图 3-2 完整替代文本\n\n在 Python 中，我们使用 `if` 语句来编写单分支决策结构。以下是\
  \ `if` 语句的标准格式：\n\n```\nif condition: \nstatement \nstatement \netc.\n```\n\n为了简单起见，我们将第一行称为\
  \ `if` 子句。`if` 子句以单词 `if` 开，后面跟着 `condition`（条件），这是一个会被求值为真或假的表达式。在 `condition`\
  \ 之后有一个冒号。从下一行开始是一个语句块。`block`（块）简单来说就是一组作为一个整体的语句。注意标准格式，块中的所有语句都缩进了。这种缩进是必要的，因为\
  \ Python 解释器利用它来确定块的开始和结束。\n\n当 `if` 语句执行时，会测试 `condition`。如果 `condition` 为真，则执行位于\
  \ `if` 子句之后块中的语句。如果条件为假，则跳过块中的语句。\n\n### 布尔表达式与关系运算符\n\n如前所述，`if` 语句通过测试一个表达式来确定其是真是假。被\
  \ `if` 语句测试的表达式被称为 `Boolean expressions`（布尔表达式），以纪念英国数学家乔治·布尔（George Boole）。在 19\
  \ 世纪，布尔发明了一套数学系统，在该系统中可以使用真和假的抽象概念。\n\n通常情况下，由 `if` 语句测试的布尔表达式形成了值之间的关系。例如，大于运算符\
  \ (`>`) 用于判断一个值是否大于另一个值。表 3-1 列出了 Python 中可用的关系运算符。\n\n| 运算符 | 含义 |\n| --- | ---\
  \ |\n| `>` | 大于 |\n| `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n| `==` | 等于 |\n\
  | `!=` | 不等于 |\n\n### 表 3-2 使用关系运算符的布尔表达式\n\n你可以使用交互模式下的 Python 解释器来尝试这些运算符。如果你在\
  \ `>>>` 提示符后输入布尔表达式，解释器将求值并显示 `True` 或 `False`。例如，查看以下交互会话。（为了方便引用，我们添加了行号。）\n\n\
  ```\n1  >>> x = 1 \n2  >>> y = 0 \n3  >>> x > y \n4  True\n5  >>> y > x\n6  False\n\
  7  >>>\n```\n\n第 1 行语句将值 1 赋值给变量 `x`。第 2 行语句将值 0 赋值给变量 `y`。在第 3 行，我们输入布尔表达式 `x >\
  \ y`。该表达式的值 (`True`) 显示在第 4 行。接着在第 5 行，我们输入布尔表达式 `y > x`。该表达式的值 (`False`) 显示在第 6\
  \ 行。\n\n\n\n\n\n第 1 行语句将值 1 赋值给变量 `x`。第 2 行语句将值 0 赋值给变量 `y`。在第 3 行，我们输入布尔表达式 `y\
  \ < x`。表达式的值（`True`）显示在第 4 行。然后，在第 5 行，我们输入布尔表达式 `x < y`。表达式的值（`False`）显示在第 6 行。\n\
  \n### `>=` 和 `<=` 运算符\n\n运算符 `>=` 和 `<=` 可用于测试多种关系。`>=` 运算符判断左侧的操作数是否大于或等于右侧的操作数。`<=\
  \ 运算符判断左侧的操作数是否小于或等于右侧的操作数。\n\n例如，看下面的交互会话：\n\n```\n 1  >>> x = 1 \n 2  >>> y =\
  \ 0 \n 3  >>> z = 1 \n 4  >>> x >= y \n 5  True\n 6  >>> x >= z \n 7  True\n 8 \
  \ >>> x <= z \n 9  True\n10  >>> x <= y \n11  False\n12  >>>\n```\n\n在第 1 到 3 行中，我们为变量\
  \ `x`、`y` 和 `z` 赋值。在第 4 行，我们输入布尔表达式 `x >= y`，结果为 `True`。在第 6 行，我们输入布尔表达式 `x >= z`，结果为\
  \ `True`。在第 8 行，我们输入布尔表达式 `x <= z`，结果为 `True`。在第 10 行，我们输入布尔表达式 `x <= y`，结果为 `False`。\n\
  \n### `==` 运算符\n\n`==` 运算符判断左侧的操作数是否等于右侧的操作数。如果两个操作数引用的值相同，则表达式为真。假设 `a` 为 4，表达式\
  \ `a == 4` 为真，表达式 `a == 2` 为假。\n\n下面的交互会话演示了 `==` 运算符：\n\n```\n1  >>> x = 1 \n2\
  \  >>> y = 0 \n3  >>> z = 1 \n4  >>> x == y \n5  False\n6  >>> x == z \n7  True\n\
  8  >>>\n```\n\n### ![](img/ICON_NOTE.png) 注意：\n\n相等运算符由两个 `=` 符号组成。不要将此运算符与赋值运算符混淆，赋值运算符只有一个\
  \ `=` 符号。\n\n### `!=` 运算符\n\n`!=` 运算符是不等于运算符。它判断左侧的操作数是否等于右侧的操作数，这与 `==` 运算符相反。与之前一样，假设\
  \ `a` 为 4，`b` 为 6，`c` 为 4，则 `a != b` 和 `b != c` 均为真，因为 `a` 不等于 `b` 且 `b` 不等于 `c`。然而，`a\
  \ != c` 为假，因为 `a` 等于 `c`。\n\n下面的交互会话演示了 `!=` 运算符：\n\n```\n1  >>> x = 1 \n2  >>>\
  \ y = 0 \n3  >>> z = 1 \n4  >>> x != y \n5  True\n6  >>> x != z \n7  False\n8  >>>\n\
  ```\n\n### 综合运用\n\n让我们来看一个 `if` 语句的示例：\n\n```\nif sales > 50000:\n    bonus = 500.0\n\
  ```\n\n该语句使用 `>` 运算符判断 `sales` 是否大于 50,000。如果表达式 `sales > 50000` 为真，则给变量 `bonus`\
