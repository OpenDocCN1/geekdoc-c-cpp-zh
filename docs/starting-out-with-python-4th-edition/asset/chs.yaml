  \ 函数显示。\n\n# 检查点 (Checkpoint)\n\n1. 10.5 你听到有人发表如下评论：“蓝图是房屋的设计。木工可以使用蓝图来建造房屋。如果木工愿意，他可以从同一张蓝图建造几栋完全相同的房子。”将此比作类和对象的比喻。蓝图代表的是类，还是代表对象？\n\
