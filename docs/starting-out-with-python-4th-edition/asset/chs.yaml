  \ 'o')\n```\n\n# 绘制柱状图\n\n你可以使用 `matplotlib.pyplot` 模块中的 `bar` 函数来创建柱状图。柱状图有一个水平的\
  \ `X` 轴、垂直的 `Y` 轴以及一组通常源 `X` 轴的柱条。每个柱条代表一个值，柱条的高度与该柱条代表的值成比例。\n\n要创建柱状图，你首先创建两个列表：一个包含每个柱条左边缘的\
  \ `X` 坐标，另一个包含每个柱条在 `Y` 轴上的高度。程序 7-24 演示了这一点。在第 6 行中，创建了 `left_edges` 列表来存储每个柱条左边缘的\
  \ `X` 坐标。在第 9 行中，创建了 `heights` 列表来存储每个柱条的高度。观察这两个列表，我们可以得出以下结论：\n\n*   第一个柱条的左边缘位于\
  \ `X` 轴的 0 处，其高度在 `Y` 轴上为 100。\n*   第二个柱条的左边缘位于 `X` 轴的 10 处，其高度在 `Y` 轴上为 200。\n\
  *   第三个柱条的左边缘位于 `X` 轴的 20 处，其高度在 `Y` 轴上为 300。\n*   第四个柱条的左边缘位于 `X` 轴的 30 处，其高度在\
  \ `Y` 轴上为 400。\n*   第五个柱条的左边缘位于 `X` 轴的 40 处，其高度在 `Y` 轴上为 500。\n\n该程序的输出如图 7-13 所示。\n\
