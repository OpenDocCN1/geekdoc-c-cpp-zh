  \ | 使插入点在文本顶部居中（北）。 |\n| `anchor=tkinter.NE` | 使插入点位于文本的右上角（东北）。 |\n| `anchor=tkinter.W`\
  \ | 使插入点位于文本的左边缘居中（西）。 |\n| `anchor=tkinter.E` | 使插入点位于文本的右边缘居中（东）。 |\n| `anchor=tkinter.SW`\
  \ | 使插入点位于文本的左下角（西南）。 |\n| `anchor=tkinter.S` | 使插入点在文本底部居中（南）。 |\n| `anchor=tkinter.SE`\
  \ | 使插入点位于文本的右下角（东南）。 |\n\n# 表 13-9 `anchor` 值\n\n图 13-40 说明了不同的锚点位置。在图中，每行文本都有一个点代表插入点的位置。\n\
