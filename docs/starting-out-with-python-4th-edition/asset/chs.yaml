  \n```\nmystring = 'abcdefg'\nprint(mystring[:])\n```\n\n# 8.3 字符串的测试、搜索与处理\n\n###\
  \ 概念\n\nPython 提供了用于测试字符串、搜索字符串内容以及获取字符串修改副本的操作和方法。\n\n### 使用 `in` 和 `not in` 测试字符串\n\
  \n在 Python 中，你可以使用 `in` 运算符来判断一个字符串是否包含在另一个字符串中。以下是使用两个字符串配合 `in` 运算符的表达式通用格式：\n\
  \n```\nstring1 in string2\n```\n\n`string1` 和 `string2` 可以是字符串字面量，也可以引用字符串的变量。如果在\
  \ `string2` 中找到了 `string1`，则表达式返回真。例如，查看以下代码：\n\n```\ntext = 'Four score and seven\
  \ years ago'\nif 'seven' in text:\n\tprint('The string \"seven\" was found.')\n\
  else:\n\tprint('The string \"seven\" was not found.')\n```\n\n这段代码确定字符串 `'Four score\
  \ and seven years ago'` 是否包含字符串 `'seven'`。如果我们运行这段代码，它将显示：\n\n```\nThe string \"\
  seven\" was found.\n```\n\n你可以使用 `not in` 运算符来判断一个字符串是否*不包含*在另一个字符串中。这里有一个示例：\n\n\
  ```\nnames = 'Bill Joanne Susan Chris Juan Katie'\nif 'Pierre' not in names:\n\t\
  print('Pierre was not found.')\nelse:\n\tprint('Pierre was found.')\n```\n\n如果我们运行这段代码，它将显示：\n\
  \n```\nPierre was not found.\n```\n\n### 字符串方法\n\n回回想 第 6 章，方法是一个属于对象的函数，并对该对象执行某些操作。Python\
  \ 中的字符串有很多方法。在本节中，我们将讨论几种执行以下类型操作的字符串方法：\n\n- 测试字符串的值\n- 执行各种修改\n- 搜索子字符串并替换字符序列\n\
  \n以下是字符串方法调用的通用格式：\n\n```\nstringvar.method(arguments)\n```\n\n在通用格式中，`stringvar`\
  \ 是引用字符串的变量，`method` 是被调用方法的名称，而 `arguments` 是传递给方法的一个或多个参数。让我们来看一些示例。\n\n### 字符串测试方法\n\
  \n表 8-1 中所示的字符串方法测试字符串的特定特征。例如，`isdigit` 方法在字符串只包含数字位时返回真；否则，返回假。这里有一个示例：\n\n| 方法\
  \ | 描述 |\n| --- | --- |\n| `isalnum()` | 如果字符串只包含字母或数字且长度至少为一个，则返回真。否则返回假。 |\n|\
  \ `isalpha()` | 如果字符串只包含字母且长度至少为一个，则返回真。否则返回假。 |\n| `isdigit()` | 如果字符串只包含数字且长度至少为一个，则返回真。否则返回假。\
  \ |\n| `islower()` | 如果字符串中所有的字母都是小写，且字符串包含至少一个字母，则返回真。否则返回假。 |\n| `isspace()` |\
  \ 如果字符串只包含空白字符且长度至少为一个，则返回真。否则返回假。 |\n| `isupper()` | 如果字符串中所有的字母都是大写，则返回真。否则返回假。\
  \ |\n\n表 8-1 字符串测试方法\n\n```\nstring1 = '1200'\nstring1.isalnum() # 返回真\nstring1.isdigit()\
