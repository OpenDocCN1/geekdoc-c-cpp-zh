  \ |\n\n该程序应允许用户输入课程编号，然后显示该课程的房间号、教师和上课时间。\n\n## 2. 首都测验\n\n编写一个程序，创建一个以美国州为键、以其首值为值的字典。（使用互联网获取州及其首府的列表。）然后，程序应该随机测验用户，显示一个州名并要求用户输入该州的首府。程序应该统计正确和错误回答的数量。（作为美国州的替代方案，程序也可以使用国家名称及其首都是。）\n\
