  # 5.8 编写你自己的返回值函数\n\n### 概念\n\n返回值函数有一个 `return` 语句，可以将一个值返回给调用它的程序部分。\n\n你编写返回值函数的方法与编写空函数相同，唯一的例外是：返回值函数必须有一个\
  \ `return` 语句。以下是通用格式：\n\n```python\ndef function_name():\n    statement\n    return\
  \ expression\n```\n\n`expression` 的值会被传回调用函数的程序部分。`expression` 可以是任何值，例如变量、常量或函数调用的结果。\n\
  \n\n\n\n\n注意此函数内部发生了两件事：(1) 表达式 `num1 + num2` 的值被赋值给变量 `result`，以及 (2) 返回了 `result`\
  \ 变量的值。虽然这个函数完成了它的预定任务，但它可以被简化。由于 `return` 语句可以返回表达式的值，你可以消除 `result` 变量并将函数重写为：\n\
  \n```python\ndef sum(num1, num2):\n    return num 1 + num 2\n```\n\n这个版本的函数没有在变量中存储\
  \ `num1 + num2` 的值。相反地，它利用了 `return` 语句可以返回表达式值的这一事实。这个版本的函数执行了与上版本相同的操作，但只需要一步即可完成。\n\
  \n# 如何使用返回值的函数\n\n返回值的函数提供了与空单元函数（void functions）许多相同的优点：它们简化了代码、减少了重复、增强了你测试代码的能力、提高了开发速度并便于团队协作。\n\
  \n由于返回值的函数会返回一个值，因此它们在特定情况下非常有用。例如，你可以使用返回值的函数来提示用户输入，然后它可以返回用户输入的值。假设你被要求设计一个计算零售业务中商品销售价的程序。为了实现这一点，程序需要从用户处获取商品的原价。以下是一个你可以为此目的定义的函数：\n\
  \n```python\ndef get_regular_price():\n    price = float(input(\"Enter the item's\
  \ regular price: \"))\n    return price\n```\n\n然后，在程序的其他地方，你可以调用该函数，如下所示：\n\n```python\n\
  # 获取商品的原价。\nreg_price = get_regular_price()\n```\n\n当该语句执行时，会调用 `get_regular_price`\
  \ 函数，它从用户处获取一个值并将其返回。该值随后被赋值给 `reg_price` 变量。\n\n你还可以使用函数来简化复杂的数学表达式。例如，计算商品的销售价似乎是一项简单的任务：你计算折扣金额并将其从原价中减去。但在程序中，执行此项计算的语句并不那么直观，如下例所示。（假设\
  \ `DISCOUNT_PERCENTAGE` 是程序中定义的全局常量，它指定了折扣的百分比。）\n\n```python\nsale_price = reg_price\
  \ – (reg_price * DISCOUNT_PERCENTAGE)\n```\n\n一眼看去，这条语句并不容易理解，因为它执行了许多步骤：它计算折扣金额、从\
  \ `reg_price` 中减去该值，并将结果赋值给 `sale_price`。你可以通过提取数学表达式的一部分并将其放入函数中来简化语句。这里有一个名为 `discount`\
  \ 的函数，它接受商品的价格作为参数并返回折扣金额：\n\n```python\ndef discount(price):\n    return price\
  \ * DISCOUNT_PERCENTAGE\n```\n\n然后你可以在计算中调用该函数：\n\n```python\nsale_price = reg_price\
  \ − discount(reg_price)\n```\n\n这条语句比之前显示的更易读，而且更清楚地表明折扣是从原价中减去的。程序 5-22 显示了使用上述函数完成的完整销售价计算程序。\n\
  \n# 程序 5-22 `(sale_price.py)`\n\n```python\n 1  # 此程序计算零售商品的\n 2  # 销售价。\n 3\n 4\
  \  # DISCOUNT_PERCENTAGE 被用作全局\n 5  # 常量，表示折扣百分比。\n 6  DISCOUNT_PERCENTAGE = 0.20\n\
  \ 7\n 8  # 主函数。\n 9  def main():\n10      # 获取商品的原价。\n11      reg_price = get_regular_price()\n\
  12\n13      # 计算销售价。\n14      sale_price = reg_price - discount(reg_price)\n15\n\
  16      # 显示销售价。\n17      print('The sale price is $', format(sale_price, ',.2f'),\
  \ sep='')\n18\n19  # get_regular_price 函数提示用户\n20  # 输入商品的原价，并它会\n21  # 返回该值。\n\
  22  def get_regular_price():\n23      price = float(input(\"Enter the item's regular\
  \ price: \"))\n24      return price\n25\n26  # discount discount 函数接受商品的价格\n27 \
  \ # 作为参数，并返回由\n28  # DISCOUNT_PERCENTAGE 指定的折扣金额。\n29  def discount(price):\n30\
  \      return price * DISCOUNT_PERCENTAGE\n31\n32  # 调用主函数。\n33  main()\n```\n\n\
  **程序输出**（加粗部分为输入）\n\n```\nEnter the item's regular price: 100.00 \nThe sale price\
  \ is $80.00\n```\n\n# 使用 IPO 图\n\nIPO 图是程序员有时用于设计的一种简单但有效的工具。IPO 代表输入（input）、处理（processing）和输出（output）。IPO\
  \ 图提供了函数的简要描述，但没有显示其内部的具体步骤。然而，在许多情况下，IPO 图提供的信息足够，可以替代流程图使用。使用 IPO 图还是流程图通常取决于程序员的决定。\n\
  \n例如，程序 5-22 显示了 `regular_price` 和 `discount` 函数的 IPO 图。\n\n![getPrice 和 discount\
  \ 的 IPO 图](img/fg05_0250.png)\n\n# 图 5-25 getPrice 和 discount 的 IPO 图\n\n[图 5-25\
  \ 文字]\n\n# 返回字符串\n\n到目前为止，你已经看到了返回数值的函数示例。你还可以编写返回字符串的函数。例如，以下函数提示用户输入姓名，然后返回用户输入的字符串：\n\
  \n```python\ndef get_name():\n    # 获取姓名。\n    name = input('Enter your name: ')\n\
  \    # 返回姓名。\n    return name\n```\n\n# 返回布尔值\n\nPython 允许你编写返回 `True` 或 `False`\
  \ 的布尔函数。你可以使用布尔函数测试条件，然后返回 `True` 或 `False` 来指示条件是否存在。布尔函数对于简化和循环结构中的复杂条件非常有用。\n\
  \n例如，假设你正在设计一个程序，要求用户输入一个数字，然后判断该数字是偶数还是奇数。以下代码展示了如何进行这种判断：\n\n```python\nnumber\
  \ = int(input('Enter a number: '))\nif (number % 2) == 0:\n    print('The number\
  \ is even.')\nelse:\n    print('The number is odd.')\n```\n\n让我们仔细观察一下这个 `if-else`\
  \ 语句测试的布尔表达式：\n\n```python\n(number % 2) == 0\n```\n\n该表达式使用了 `%` 运算符，该运算符是在第 2\
  \ 章中引入的。这被称为取模运算符。它除两个数字并返回除法的余数。因此这段代码的意思是：“如果 `number` 除以 2 的余数等于 0，则显示指示该数字为偶数的消息，否则显示指示该数字为奇数的消息。”\n\
  \n\n\n\n因为偶数除以 2 的余数始终为 0，所以这种逻辑是可以行的。然而，如果你能以某种方式将其重写为“如果数字是偶数，则显示一条表示偶数的消息，否则显示一条表示奇数的消息”，代码将会更容易理解。事实证明，这可以通过布尔函数来实现。在这个示例中，你可以编写一个名为\
  \ `is_even` 的布尔函数，接受一个数字作为参数，如果该数字是偶数则返回 `True`，否则返回 `False`。以下是该函数的代码：\n\n```python\n\
  def is_even(number):\n    # Determine number 是否为偶数。如果是，\n    # 将 status 设置为 true。否则将\
  \ status\n    # 设置为 false。\n    if (number % 2) == 0:\n        status = True\n \
  \   else:\n        status = False\n    # 返回 status 变量的值。\n    return status\n```\n\
  \n然后，你可以重写 `if-else` 语句使其调用 `is_even` 函数来判断 `number` 是否为偶数：\n\n```python\nnumber\
  \ = int(input('Enter a number: '))\nif is_even(number):\n    print('The number is\
  \ even.')\nelse:\n    print('The number is odd.')\n```\n\n这种逻辑不仅更容易理解，而且现在你有了一个函数，可以在程序中需要测试数字并判断为偶数时随时调用它。\n\
  \n# 在验证代码中使用布尔函数\n\n你也可以使用布尔函数来简化复杂的输入验证代码。例如，假设你正在编写一个程序提示用户输入产品型号，并且只接受值 100、200\
  \ 和 300。你可以按照如下设计输入算法：\n\n```python\n# Get the model number.\nmodel = int(input('Enter\
  \ the model number: '))\n# Validate the model number.\nwhile model != 100 and model\
  \ != 200 and model != 300:\n    print('The valid model numbers are 100, 200 and\
  \ 300.')\n    model = int(input('Enter a valid model number: '))\n```\n\n验证循环使用了长复合布尔表达式，只要\
  \ `model` 不等于 100 且 `model` 不等于 200 且 `model` 不等于 300，循环就会继续迭代。虽然这种逻辑可行，但你可以通过编写一个布尔函数来测试\
  \ `model` 变量并在循环中调用该函数来简化验证循环。例如，假设你将 `model` 变量传递给你编写的名为 `is_invalid` 的函数。如果 `model`\
  \ 无效，函数返回 `True`，否则返回 `False`。你可以这样重写验证循环：\n\n```python\n# Validate the model number.\n\
  while is_invalid(model):\n    print('The valid model numbers are 100, 200 and 300.')\n\
  \    model = int(input('Enter a valid model number: '))\n```\n\n这使得循环更容易读。现在显而易见，只要\
  \ `model` 无效，循环就会继续迭代。下面的代码展示了你可以如何编写 `is_invalid` 函数。它接受一个型号作为参数，如果参数不是 100 且参数不是\
  \ 200 且参数不是 300，函数将返回 `True` 表示它是无效的。否则，函数返回 `False`。\n\n```python\ndef is_invalid(mod_num):\n\
  \    if mod_num != 100 and mod_num != 200 and mod_num != 300:\n        status =\
  \ True\n    else:\n        status = False\n    return status\n```\n\n# 返回多个值\n\n\
  我们目前为止看到的有值的函数示例都返回单个值。但在 Python 中，你并不限于只返回一个值。你可以在 `return` 语句后指定多个用逗号分隔的表达式，格式如下：\n\
  \n```python\nreturn expression1, expression2, etc.\n```\n\n例如，查看以下名为 `get_name`\
  \ 的函数定义。该函数提示用户输入其姓和名。这些名字存储在两个局部变量中：`first` 和 `last`。`return` 语句返回了这两个变量。\n\n```python\n\
  def get_name():\n    # Get the user's first and last names.\n    first = input('Enter\
  \ your first name: ')\n    last = input('Enter your last name: ')\n    # Return\
  \ both names.\n    return first, last\n```\n\n当你在赋值语句调用此函数时，你需要在 `=` 运算符左侧使用两个变量。这是一个示例：\n\
  \n```python\nfirst_name, last_name = get_name()\n```\n\n`return` 语句中列出的值按照它们出现的顺序赋值给\
  \ `=` 运算符左侧的变量。在该语句执行后，`first` 变量的值将赋值给 `first_name`，`last` 变量的值将赋值给 `last_name`。注意`=`\
  \ 运算符左侧的变量数量必须与函数返回的值数量匹配。否则将发生错误。\n\n### 检查点\n\n1. 5.31 函数中 `return` 语句的作用是什么？\n\
  \n2. 5.32 查看以下函数定义：\n\n   ```python\n   def some_function(number):\n       return\
  \ number\n   ```\n\n3. 5.33 什么是布尔函数？\n\n\n\n```\n 1  # 此程序演示了 sqrt 函数。\n 2  import\
