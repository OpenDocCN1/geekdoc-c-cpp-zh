  \ 26 行的语句创建了退出按钮。注意 `self.main_window.destroy` 方法被用作回调函数。当用户点击按钮时，该方法被调用，程序结束。\n\
  \n# 13.6 使用 Entry Widget 获取输入\n\n### 概念\n\n`Entry` 小部件是一个用户可以输入输入内容的矩形区域。你使用 `Entry`\
  \ 小部件的 `get` 方法来检索已输入到小部件的数据。\n\n`Entry` 小部件是一个用户可以输入文本的矩形区域。`Entry` 小部件用于在 GUI\
  \ 程序中收集输入。通常，一个程序会在窗口中有一个或多个 `Entry` 小部件，并带有一个用户点击以提交其输入到 `Entry` 小部件中的数据的按钮。按钮的回调函数从窗口的\
  \ `Entry` 小部件中检索数据并对其进行处理。\n\n你使用 `Entry` 小部件的 `get` 方法来检索用户输入到小部件的数据。`get` 方法返回一个字符串，因此如果\
  \ `Entry` 小部件被用于数值输入，则必须将其转换为适当的数据类型。\n\n为了演示，我们将查看一个程序，该程序允许用户在 `Entry` 小部件中以公里为单位输入距离，然后点击按钮将该距离转换为英里。公里转英里的公式为：\n\
  \n`Miles = Kilometers × 0.6214`\n\n图 13-13 显示了程序显示的窗口。为了排列小部件，我们将它们组织在框架中，如图 13-14\
  \ 所示。显示提示的标签和 `Entry` 小部件将存储在 `top_frame` 中，它们的 `pack` 方法将带有 `side='left'` 调用。这将它们在框架内水平排列。转换按钮和退出\
  \ 按钮将存储在 `bottom_frame` 中，它们的 `pack` 方法也将带有 `side='left'` 调用。\n\n![对话框截图，有一个空白字段和标签“以公里为单位输入距离。”下方是一个标记为“转换”的按钮，右侧是另一个标记为“退出”的按钮。](img/fg13_01300.png)\n\
