  \ | `'gray95'` | `'gray97'` |\n| `'gray98'` | `'gray99'` |\n\n# 附录 E 关于 `import`\
  \ 语句的更多信息\n\n模块是一个包含函数或类的 Python 源代码文件。Python 标准库中的许多函数都存储在模块中。例如，`math` 模块包含了各种数学函数，`random`\
  \ 模块包含了用于随机数的函数。\n\n为了使用存储在模块中的函数或类，你必须导入该模块。要导入模块，请在程序的顶部编写 `import` 语句。这里是导入 `math`\
  \ 模块的 `import` 语句：\n\n```\nimport math\n```\n\n此语句会导致 Python 解释器将 `math` 模块的内容加载到内存中，从而使存储在\
  \ `math` 模块中的函数或类对程序可用。要使用模块中的任何项，你必须使用该项的*限定名称*。这意味着你必须在项名称之前加上模块名称，后跟一个点。例如，`math`\
  \ 模块有一个名为 `sqrt` 的函数，返回数字的平方根。要调用 `sqrt` 函数，你将使用名称 `math.sqrt`。下面的交互会话显示了一个示例：\n\
  \n```\n>>> import math\n>>> x = math.sqrt(25)\n>>> print(x)\n5.0\n>>>\n```\n\n#\
  \ 导入特定的函数或类\n\n之前显示的 `import` 语句形式会将模块的所有内容加载到内存中。有时，你只想从模块导入一个特定的函数或类。在这种情况下，你可以在\
  \ `import` 语句中使用 `from` 关键字，如下所示：\n\n```\nfrom math import sqrt\n```\n\n此语句仅从 `math`\
  \ 模块中导入 `sqrt` 函数。它还允许你在不给函数名加缀模块名的情况下调用 `sqrt` 函数。下面的交互会话显示了一个示例：\n\n```\n>>> from\
  \ math import sqrt\n>>> x = sqrt(25)\n>>> print(x)\n5.0\n>>>\n```\n\n当你使用这种 `import`\
  \ 语句形式时，可以指定多个项，并用逗号分隔。例如，下面交互会话中的 `import` 语句从 `math` 模块中仅导入 `sqrt` 函数和 `radians`\
  \ 函数：\n\n```\n>>> from math import sqrt, radians\n>>> x = sqrt(25)\n>>> a = radians(180)\n\
  >>> print(x)\n5.0\n>>> print(a)\n3.141592653589793\n>>>\n```\n\n# 通配符导入\n\n通配符 `import`\
  \ 语句会加载模块的所有内容。这是一个示例：\n\n```\nfrom math import *\n```\n\n此语句与 `import math` 语句的区别在于，通配符\
  \ `import` 语句不需要使用模块中项的限定名称。例如，这是一个使用了通配符 `import` 语句的交互会话：\n\n\n\n\n\n```\n>>>\
  \ from math import*\n>>> x = sqrt(25)\n>>> a = radians(180)\n>>>\n```\n\n这里是一个使用常规\
  \ `import` 语句的交互式示例：\n\n```\n>>> import math\n>>> x = math.sqrt(25)\n>>> a = math.radians(180)\n\
  >>>\n```\n\n通常情况下，你应该避免使用通配符 `import` 语句，因为它在导入多个模块时可能会导致名称冲突（name clashes）。当程序导入了两个具有相同名称函数或类的模块时，就会发生`名称冲突`。当你使用模块函数和/或类的限定限定名时，则不会发生名称冲突。\n\
  \n# 使用别名\n\n你可以在导入模块时使用 `as` 关键字为该模块分配一个`别名`（alias）。以下语句展示了一个示例：\n\n```\nimport\
  \ math as mt\n```\n\n该语句将 `math` 模块加载到内存中，并为该模块分配别名 `mt`。要使用模块中的任何项，需要在该项的名称前加上别名，后跟一个点。例如，要调用\
  \ `sqrt` 函数，你可以使用名称 `mt.sqrt`。以下交互式示例展示了一个用法：\n\n```\n>>> import math as mt\n>>>\
  \ x = mt.sqrt(25)\n>>> a = mt.radians(180)\n>>> print(x)\n5.0\n>>> print(a)\n3.141592653589793\n\
  >>>\n```\n\n你也可以在导入时为特定的函数或类分配别名。以下语句从 `math` 模块导入 `sqrt` 函数，并为该函数分配了别名 `square_root`：\n\
  \n```python\nfrom math import sqrt as square_root\n```\n\n在使用此 `import` 语句后，你将使用名称\
  \ `square_root` 来调用 `sqrt` 函数。以下交互式示例展示了一个用法：\n\n```\n>>> from math import sqrt\
  \ as square_root\n>>> x = square_root(25)\n>>> print(x)\n5.0\n>>>\n```\n\n在下面的交互式示例中，我们从\
  \ `math` 模块导入了两个函数，并为它们 각각一个分配了别名。`sqrt` 函数被导入为 `square_root`，而 `tan` 函数被导入为 `tangent`：\n\
  \n```\n>>> from math import sqrt as square_root, tan as tangent\n>>> x = square_root(25)\n\
  >>> y = tangent(45)\n>>> print(x)\n5.0\n>>> print(y)\n1.6197751905438615\n```\n\n\
  # 附录 F：使用 `pip` 工具安装模块\n\nPython 标准库提供了程序可以用来执行基本操作的类和函数，以及许多高级任务的功能。然而，某些操作是标准库无法完成的。当你需要执行超出标准库范围的任务时，你有两个选择：自己编写代码，或者使用别人编写的代码。\n\
  \n幸运的是，有成千上万由独立程序员编写的 Python 模块提供了标准 Python 库不提供的功能。这些被称为`第三方模块`（third-party modules）。在\
  \ [pypi.python.org](http://pypi.python.org) 网站存在大量的第三方模块集合，它被称为`Python 包索引`（Python\
  \ Package Index），或 `PyPI`。\n\nPyPI 上的可用模块是以包（packages）的形式组织的。一个`包`（package）简单来说就是一个或多个相关模块的集合。下载和安装包最简单的方法是使用\
  \ `pip` 工具。`pip` 工具是标准 Python 安装程序的一部分，从 Python 3.4 开始引入。在 Windows 系统上使用 `pip` 工具安装包，你必须打开命令提示符窗口并输入如下格式的命令：\n\
  \n```bash\npip install package_name\n```\n\n`package_name` 是你想要下载并安装的包的名称。如果你运行的是\
  \ Mac 或 Linux 系统，必须使用 `pip3` 命令代替 `pip` 命令。此外，在 Mac 或 Linux 系统上执行 `pip3` 命令需要超级用户权限，因此你需要在命令前加上\
  \ `sudo`，如下所示：\n\n```bash\nsudo pip3 install package_name\n```\n\n一旦输入该命令，`pip`\
  \ 工具将开始下载并安装该包。根据包的大小，可能需要几分钟才能完成安装过程。过程完成后，你通常可以通过启动 IDLE 并输入命令来验证包是否已正确安装：\n\n\
  ```python\nimport package_name\n```\n\n其中 `package_name` 是你安装的包的名称。如果你没有看到错误信息，可以认为该包已成功安装。\n\
  \n在第 7 章，你将探索一个名为 `matplotlib` 的流行第三方包。你可以使用 `matplotlib` 包来创建图表和图形。\n\n# 附录 G：检查点答案\n\
