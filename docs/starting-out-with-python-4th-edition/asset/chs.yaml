  \ `index` 方法来获取该项的索引。第 21 行从用户处获取新值，第 24 行将新值分配给持有旧值的元素。\n\n# `insert` 方法\n\n`insert`\
  \ 方法允许你向列表的特定位置插入一个项。你向 `insert` 方法传递两个参数：一个指定插入位置的索引，以及你想要插入的项。程序 7-5 显示了一个示例。\n\
