  # 4.4 计算运行总和\n\n### 概念\n\n运行总和（running total）是随着循环每次迭代而累积的数字和。用于保持运行总和的变量被称为累加器（accumulator）。\n\
  \n许多编程任务要求你计算一组数字的总和。例如，假设你正在编写一个计算企业某一周总销售额的程序。该程序将每天的销售额作为输入，并计算这些数字的总和。\n\n计算一组数字总数的程序通常使用两个元素：\n\
  \n* 一个读取序列中每个数字的循环。\n* 一个在读取数字时累加其总和的变量。\n\n用于累加数字总和的变量被称为 `accumulator`。人们通常说循环保持了一个\
  \ `running total`，因为它在读取序列中的每个数字时都会累加总和。`图 4-6` 显示了计算运行总和的循环的一般逻辑。\n\n![计算运行总和的循环流程图](img/ICON_CHECKPT.png)\n\
  \n## 运行总和的逻辑\n\n运行总和是随着循环每次迭代而累积的数字和。用于保持运行总和的变量被称为累加器。\n\n许多编程任务要求你计算一组数字的总和。例如，假设你正在编写一个计算企业某一周总销售额的程序。该程序将每天的销售额作为输入，并计算这些数字的总和。\n\
  \n计算一组数字总数的程序通常使用两个元素：\n\n* 一个读取序列中每个数字的循环。\n* 一个在读取数字时累加其总和的变量。\n\n（注：原文此处存在大量重复段落，已根据指令要求不重复输出原文，仅保留核心逻辑翻译）\n\
  \n# 复合赋值运算符\n\n经常，程序中的赋值语句中位于 `=` 运算符左侧的变量也出现在 `=` 的右侧。这里有一个示例：\n\n```\nx = x +\
  \ 1\n```\n\n在赋值运算符的右侧，1 被加到 `x`。然后结果被赋值给 `x`，替换掉 `x` 之前引用的值。实际上，这条语句将 x 增加了 1。你在\
  \ `程序 4-13` 中见过这种语句的另一个示例：\n\n```\ntotal = total + number\n```\n\n该语句将 `total +\
  \ number` 的值赋值给 `total`。正如提到的，该语句的影响是将 `number` 加到 `total` 的值上。这里是最后一个示例：\n\n```\n\
  balance = balance − withdrawal\n```\n\n该语句将表达式 `balance − withdrawal` 的值赋值给 `balance`。该语句的影响是从\
  \ `balance` 中减去 `withdrawal`。\n\n`表 4-1` 显示了以这种方式编写的其他语句示例。\n\n| 语句 | 执行的操作 | 语句执行后\
  \ x 的值 |\n\n| --- | --- | --- |\n\n\n\n\n\n| `x = x + 4` | 将 `x` 加 4 | 10 |\n| `x\
  \ = x − 3` | 从 `x` 中减去 3 | 3 |\n| `x = x * 10` | 将 `x` 乘以 10 | 60 |\n| `x = x /\
  \ 2` | 将 `x` 除以 2 | 3 |\n| `x = x % 4` | 将 `x / 4` 的余数赋值给 `x` | 2 |\n\n# 表 4-1 各赋值语句（假设每个语句中\
  \ x = 6）\n\n这类操作在编程中非常常见。为了方便起见，Python 提供了一组专门为这些工作任务设计的特殊运算符。表 4-2 显示了*复合赋值运算符*。\n\
  \n| 运算符 | 示例用法 | 等于 |\n| --- | --- | --- |\n| `+=` | `x += 5` | `x = x + 5` |\n\
