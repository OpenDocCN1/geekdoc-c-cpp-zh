  \ 如何使用 `IntVar` 对象来确定 `Checkbutton` 是否被选中？\n\n# 13.9 使用 `Canvas` 控件绘制形状\n\n### 概念\n\
  \n`Canvas` 控件提供了绘制简单形状的方法，如线、矩形、圆形、多边形等。\n\n`Canvas` 控件是一个空白的矩形区域，允许你绘制二维 D 形状。在本节中，我们将讨论用于绘制线、矩形、圆形、多边形和文本的\
  \ `Canvas` 方法。但在检查如何绘制这些形状之前，我们必须先讨论屏幕坐标。你使用 `Canvas` 控件的屏幕系统来指定位置。\n\n## `Canvas`\
  \ 控件的屏幕坐标\n\n计算机上显示的图像由称为像素（pixels）的微点组成。屏幕系统用于识别应用程序中每个像素的位置。每个像素都有一个 `X` 坐标和一个\
  \ `Y` 坐标。`X` 坐标标识像素的水平位置，`Y` 坐标标识其垂直位置。\n\n在 `Canvas` 控件的屏幕系统中，左上角像素的坐标为 `(0, 0)`。这意味着它的\
  \ `X` 坐标是 0，`Y` 坐标是 0。`X` 坐标从左到右增加，`Y` 坐标从上下增加。在一个宽为 640 像素、高为 480 像素的窗口中，右下角像素的坐标为\
  \ `(639, 479)`。在同一个窗口中，中心像素的坐标为 `(319, 239)`。\n\n### 注意\n\n`Canvas` 控件的屏幕系统与 `turtle`\
  \ 库使用的坐标系不同。差异在于：\n\n* 在 `Canvas` 控件中，点 `(0, 0)` 位于窗口的左上角。在 `turtle` 图形中，点 `(0,\
  \ 0)` 位于窗口的中心。\n* 在 `Canvas` 控件中，`Y` 坐标随着向下而增加。在 `turtle` 图形中，`Y` 坐标随着向下而减少。\n\n\
  `Canvas` 控件有许多方法可以在控件表面绘制图形形状。我们将讨论的方法有：\n\n* `create_line`\n* `create_rectangle`\n\
  * `create_oval`\n* `create_arc`\n* `create_polygon`\n* `create_text`\n\n在讨论这些方法的细节之前，让我们来看`程序\
  \ 13-14`。它是一个使用 `Canvas` 控件绘制线的简单程序。\n\n# 程序 13-14 `(draw_line.py)`\n\n```python\n\
  # 此程序演示 Canvas 控件。\nimport tkinter\n\nclass MyGUI:\n    def __init__(self):\n  \
  \      # 创建主窗口。\n        self.main_window = tkinter.Tk()\n\n        # 创建 Canvas\
  \ 控件。\n        self.canvas = tkinter.Canvas(self.main_window, width=200,height=200)\n\
  \n        # 绘制两条线。\n        self.canvas.create_line(0, 0, 199, 199)\n        self.canvas.create_line(199,\
  \ 0, 0, 199)\n\n        # 打包 canvas。\n        self.canvas.pack()\n\n        # 启动主循环。\n\
  \        tkinter.mainloop()\n```\n\n\n\n\n让我们仔细查看一下程序。第 10 行创建了 `Canvas` 小部件。括号内的第一个参数是\
  \ `self.main_window` 的引用，它是我们添加小部件的父容器。`width=200` 和 `height=200` 参数指定了 `Canvas`\
  \ 小部件的大小。\n\n第 13 行调用了 `Canvas` 小部件的 `create_line` 方法来绘制一条线。第一个和第二个参数是线起点的 `X`、`Y`\
  \ 坐标。第三和第四个参数是线终点的 `X`、`Y` 坐标。因此，这条语句在 `Canvas` 上绘制了一条从 (0, 0) 到 (199, 199) 的线。\n\
  \n第 14 行同样调用了 `Canvas` 小部件的 `create_line` 方法来绘制第二条线。该语句在 `Canvas` 上绘制了一条从 (199,\
  \ 0) 到 (0, 199) 的线。\n\n第 17 行调用了 `Canvas` 小部件的 `pack` 方法，这使得小部件变得可见。第 20 行执行了 `tkinter`\
  \ 模块的 `mainloop` 函数。\n\n# 绘制线条：`create_line` 方法\n\n`create_line` 方法在 `Canvas` 上的两个或多个点之间绘制线条。以下是调用该方法在两点之间画线的通用格式：\n\
  \n```\ncanvas_name.create_line(x1, y1, x2, y2, options ...)\n```\n\n参数 `x1` 和 `y1`\
  \ 是线起点的 `X`、`Y` 坐标。参数 `x2` 和 `y2` 是线终点的 `X`、`Y` 坐标。在通用格式中，`options ...` 表示可以传递给方法的若干可选关键字参数。我们将在表\
  \ 13-2 中检查其中一些参数。\n\n| 参数 | 说明 |\n| --- | --- |\n| `arrow=value` | 默认情况下，线条没有箭头，但此参数会导致线条在一个端或两端带有箭头。指定\
  \ `arrow=tk.FIRST` 在线的开头绘制箭头，指定 `arrow=tk.LAST` 在线的末尾绘制箭头，或指定 `arrow=tk.BOTH` 在线的两端都绘制箭头。\
  \ |\n| `dash=value` | 此参数使线条成为虚线。该值是一个由整数组成的元组，用于指定模式。第一个整数指定要绘制的像素数，第二个整数指定要跳过的像素数，以此类推。例如，参数\
  \ `dash=(5, 2)` 将绘制 5 个像素，跳过 2 个像素，并重复直到到达线末尾。 |\n| `fill=value` | 指定线条的颜色。参数的值是字符串形式的颜色名称。你可以使用许多预定义的颜色名称，附录\
  \ D 显示了完整列表。一些常用的颜色有 `'red'`、`'green'`、`'blue'`、`'yellow'` 和 `'cyan'`。（如果省略 `fill`\
  \ 参数，默认颜色为黑色。） |\n| `smooth=value` | 默认情况下，`smooth` 参数设置为 `False`，使方法绘制连接指定点的直线。如果你指定\
  \ `smooth=True`，线条将以曲线链的形式绘制。 |\n| `width=value` | 指定线条的宽度，单位为像素。例如，参数 `width=5`\
  \ 会导致线条宽 5 像素。默认情况下，线条宽度为 1 像素。 |\n\n# 表 13-2 `create_line` 方法的一些可选参数\n\n你已经看到在程序\
  \ 13-14 中调用 `create_line` 方法的示例。记得程序中的第 13 行绘制了一条从 (0, 0) 到 (199, 199) 的线：\n\n```\n\
  self.canvas.create_line(0, 0, 199, 199)\n```\n\n你可以传递多组坐标作为参数。`create_line` 方法将绘制连接这些点的线条。程序\
  \ 13-15 演示了这一点。第 13 行的语句绘制了连接 (10, 10)、(189, 10)、(100, 189) 和 (10, 10) 的线条。图 13-28\
  \ 显示了程序显示的窗口。\n\n![显示一个等腰三角形的程序截图](img/13_02.png)\n\n# 图 13-28 程序 13-15 显示的窗口。\n\
  \n\n\n\n# 表 13-3 `create_rectangle` 方法的一些可选参数\n\n程序 13-16 演示了第 13 行的 `create_rectangle`\
  \ 方法。矩形的左上角位于 (20, 20)，右下角位于 (180, 180)。图 13-29 显示了程序显示的窗口。\n\n![显示大矩形的程序窗口截图。](img/fg13_02900.png)\n\
  \n# 图 13-29 程序 13-16 显示的窗口\n\n# 程序 13-16 (draw_square.py)\n\n```\n 1  # 此程序在 Canvas\
  \ 上绘制一个矩形。\n 2  import tkinter\n 3\n 4  class MyGUI:\n 5      def _ _init_ _(self):\n\
  \ 6          # 创建主窗口。\n 7          self.main_window = tkinter.Tk()\n 8\n 9     \
  \     # 创建 Canvas 小部件。\n10          self.canvas = tkinter.Canvas(self.main_window,\
  \ width=200, height=200)\n11\n12          # 绘制矩形。\n13          self.canvas.create_rectangle(20,\
