  \ 当以追加模式打开一个已存在的文件时，文件的现有内容会被删除。\n6. 如果你不处理异常，Python 解释器将忽略它，程序将继续执行。\n7. 一个 `try/except`\
  \ 语句中可以有多个 `except` 子句。\n8. `try/except` 语句中的 `else` 语句仅在没有抛出异常时才执行。\n9. `try/except`\
  \ 中的 `finally` 语句仅在 `try` 执行时才执行。\n\n## 简答题\n\n1. 描述使用文件时必须采取的三个步骤。\n2. 为什么程序在完成使用文件后应该关闭它？\n\
