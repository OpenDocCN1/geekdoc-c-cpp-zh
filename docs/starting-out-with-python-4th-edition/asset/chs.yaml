  \ 传递给 `pie` 函数。这样，'1st Qtr' 将作为第一个切扇的标签，'2nd Qtr' 将作为第二个切扇的标签，依此类推。第 15 行使用 `title`\
  \ 函数显示 'Sales by Quarter'。程序的输出见图 7-17。一个由不同宽度的楔形组成的圆形图，标题为 Sales by Quarter。](images/fg07_01700.png)\n\
  \n# 图 7-17 输出 程序 7-28 \n\n# 程序 7-28 `(pie_chart2.py)`\n\n```python\n 1 # 这个程序显示一个简单的饼图。\n\
