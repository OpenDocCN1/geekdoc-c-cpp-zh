  \n### 20. 猜数字游戏\n\n编写一个程序，生成一个 1 到 100 之间的随机数，并让用户猜这个数字是多少。如果用户的猜测比随机数大，程序应该显示“太高了，再试一次。”如果用户的猜测比随机数小，程序应该显示“太低了，再试一次。”如果用户猜中了数字，应用程序应该祝贺用户并生成一个新的随机数，以便游戏重新开始。\n\
  \n可选增强：增强游戏，使其记录用户猜数字的次数。当用户正确猜中随机数时，程序应该显示猜测次数。\n\n### 21. 石头布、剪刀游戏\n\n编写一个程序，让用户与电脑玩石头、布、剪刀游戏。程序的工作原理如下：\n\
