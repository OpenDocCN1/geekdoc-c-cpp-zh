  \n1. 在父类中定义方法，然后在子类中定义同名方法。当子类方法与父类方法同同时，通常认为子类方法**重写**了父类方法。\n2. 根据调用对象的类型调用被重写的方法。如果使用子类对象调用方法，则执行子类版本。如果使用父类对象调用方法，则执行父类版本。\n\
