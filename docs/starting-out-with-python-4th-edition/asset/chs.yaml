  \ *X* 轴和 *Y* 轴上显示意义的标签以及刻度。\n\n# 第 8 章更多字符串\n\n## 8.1 基本字符串操作\n\n### 概念：\n\nPython\
  \ 提供了几种访问字符串中单个字符的方法。字符串还具有允许对其进行操作的方法。\n\n你目前为止编写的许多程序都处理过字符串，但方法有限。你目前为止对字符串执行的操作主要涉及输入和输出。例如，你已经从键盘和文件读取字符串作为输入，并将字符串作为输出发送到屏幕和文件。\n\
  \n\n\n有很多类型的程序不仅读取字符串作为输入并将字符串作为输出，还对字符串进行操作。例如，文字处理程序处理大量的文本，因此广泛地使用字符串。电子邮件程序和搜索引擎是其他对字符串进行操作的程序示例。\n\
  \nPython 提供了各种工具和编程技术，可以使用它们来检查和处理字符串。事实上，字符串是序列的一种，因此你在第 7 章中学到的关于序列的概念也适用于字符串。我们将在本章介绍其中许多内容。\n\
  \n## 访问字符串中的单个字符\n\n某些编程任务要求你访问字符串中的单个字符。例如，你可能对要求设置密码的网站很熟悉。出于安全考虑，许多网站要求密码至少包含一个大写字母、至少一个小写字母和一个数字。当你设置密码时，一个程序会检查每个字符以确保密码符合这些条件。（在本章稍后的部分，你将看到一个执行此类操作程序示例。）在本节中，我们将介绍在\
  \ Python 中用于访问字符串单个字符的两种技术：使用 `for` 循环和索引。\n\n## 使用 for 循环遍历字符串\n\n访问字符串单个字符的最简单方法之一是使用\
  \ `for` 循环。其通用格式如下：\n\n```\nfor variable in string:\n\tstatement\n\tstatement\n\t\
  etc.\n```\n\n在通用格式中，`variable` 是变量名，`string` 是字符串字面量或引用字符串的变量。循环每次迭代时，`variable`\
  \ 都会引用 `string` 中某个字符的副本，从第一个字符开始。我们称循环遍历了字符串中的字符。以下是一个示例：\n\n```\nname = 'Juliet'\n\
  for ch in name:\n\tprint(ch)\n```\n\n`name` 变量引用一个具有六个字符的字符串，因此此循环将迭代六次。循环第一次迭代时，`ch`\
  \ 变量引用 `'J'`，第二次迭代时，`ch` 变量引用 `'u'`，以此此类推。这在图 8-1 中所示。当代码执行时，它将显示以下内容：\n\n![一张显示字符串‘Juliet’迭代的图](img/fg08_00100.png)\n\
  \n### 图 8-1 遍历字符串 'Juliet'\n\n图 8-1 完整替代文本\n\n```\nJ\nu\nl\ni\ne\nt\n```\n\n###\
  \ 注意：\n\n图 8-1 展示了随着循环迭代，`ch` 变量如何引用字符串中字符的副本。如果我们在循环中更改 `ch` 引用的值，它对 `name` 引用的字符串没有影响。为了演示这一点，请看下面：\n\
  \n```\n1  name = 'Juliet'\n2  for ch in name:\n3\t   ch = 'X'\n4  print(name)\n\
  ```\n\n第 3 行的语句只是在每次循环迭代时将 `ch` 变量重新赋值为不同的值。它对 `name` 引用的字符串 `'Juliet'` 没有影响，对循环的次数也没有影响。当这段代码执行时，第\
  \ 4 行的语句将打印：\n\n```\n Juliet\n```\n\n程序 8-1 显示另一个示例。该程序要求用户输入一个字符串。然后使用 `for` 循环遍历字符串，统计字母\
  \ T（大写或小写）出现的次数。\n\n### 程序 8-1 (count_Ts.py)\n\n```\n 1  # 此程序统计字母 T（大写或小写）\n 2\t\
  # 在字符串中出现的\n 3\t# 次数。\n 4\n 5\tdef main():\n 6\t   # 创建变量变量存储计数。\n 7\t   # 变量必须从\
