  \ ‘a’ : ‘9’, ‘B’ : ‘@’, ‘b’ : ‘#’, etc . . .}\n```\n\n使用此示例，字母 `A` 被分配符号 `%`，字母\
  \ `a` 被分配数字 9，字母 `B` 被分配符号 `@`，以此此类推。\n\n程序应该打开一个指定的文本文件，读取其内容，然后使用字典将文件内容的加密版本写入第二个文件。第二个文件中的每个字符都应包含第一个文件中对应字符的代码。\n\
  \n编写第二个程序，打开加密文件并在屏幕上显示其解密后的内容。\n\n## 4. 唯一单词\n\n编写一个程序打开一个指定的文本文件，然后显示文件中找到的所有唯一单词列表。\n\
  \n提示：将每个单词存储为集合的元素。\n\n## 5. 单词频率\n\n编写一个程序读取文本文件的内容。该程序应该创建一个字典，其中键是文件中找到的单个单词，值是每个单词出现的次数。例如，如果单词“the”出现了\
