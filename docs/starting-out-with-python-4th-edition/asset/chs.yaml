  \ `tkinter` 模块的 `mainloop` 函数。\n\n# 13.5 `Button` 小组件和信息对话框\n\n### 概念\n\n你使用 `Button`\
  \ 小组件在窗口创建一个标准按钮。当用户点击按钮时，会调用指定的函数或方法。\n\n信息对话框是一个向用户显示消息的简单窗口，并有一个关闭对话框的 `OK` 按钮。你可以使用\
  \ `tkinter.messagebox` 模块的 `showinfo` 函数来显示对话框。\n\n`Button` 是用户可以点击以触发动作的小组件。当你创建一个\
  \ `Button` 小组件时，可以指定显示在按钮表面的文本以及回调函数的名称。回调函数是在用户点击按钮时执行的函数或方法。\n\n## 注意事项\n\n回调函数也被称为事件处理器，因为它处理用户点击按钮时发生的事件。\n\
  \n为了演示，我们将查看程序 13-7。\n\n\n\n\n\n`do_something` 方法出现在第 31 到 33 行。该方法简单地调用 `tkinter.messagebox.showinfo`\
  \ 函数来显示如图 13-11 所示的信息框。要关闭对话框，用户可以点击确定 按钮。\n\n# 13.5 创建退出按钮\n\nGUI 程序通常有一个退出按钮（或终止按钮），当用户点击它时会关闭程序。为了在\
  \ Python 程序中创建一个退出按钮，你只需要创建一个 `Button` 小部件，并将根部件的 `destroy` 方法作为回调函数调用。程序 13-8 演示了如何实现此。它是程序\
  \ 13-7 的修改版本，添加了第二个 `Button` 小部件，如图 13-12 所示。\n\n![对话框的截图，其中有一个标记为“点击我！”的矩形按钮，下方是标记为“退出”的按钮。](img/fg13_01200.png)\n\
  \n# 图 13-12 程序 13-8 显示的信息对话框\n\n# 程序 13-8 `(quit_button.py)`\n\n```python\n# 此程序有一个退出按钮，\n\
  # 点击时会调用 Tk 类的 destroy 方法。\nimport tkinter\nimport tkinter.messagebox\nclass MyGUI:\n\
  \    def __init__(self):\n        # 创建主窗口。\n        self.main_window = tkinter.Tk()\n\
