  \n### 判断题\n\n1. 在处理顺序访问文件时，你可以直接跳转到文件中的任何一段数据，而无需读取其之前的数据。\n2. 当你使用 `'w'` 模式打开磁盘上已存在的文件时，现有文件的内容将被删除。\n\
