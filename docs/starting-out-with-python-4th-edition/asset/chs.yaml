  \n## 9. 黑客赌场模拟\n\n在本章之前，你看到了 `card_dealer.py` 程序，它模拟从牌组中发牌。增强该程序以模拟两个虚拟玩家之间的简化版黑客赌场游戏。牌具有以下值：\n\
  \n- 数字牌被分配其上打印的数值。例如，黑桃 2 的值为 2，红钻 5 的值为 5。\n- J、Q、K 的值为 10。\n- A 根据玩家的选择，取值为 1\
  \ 点或 11 点。\n\n程序应该向每个玩家发牌，直到其中一个玩家的手牌超过 21 点。当这种情况发生时，另一个玩家胜。（可能两个玩家的手牌同时超过 21 点，在这种情况下没人获胜。）程序应该重复此过程直到发完牌牌组。\n\
  \n如果玩家发到 A，程序应该根据以下规则决定该牌的值：A 的值为 11 点，除非这会导致玩家的手牌超过 21 点。在这种情况下，A 的值为 1 点。\n\n\
  ## 10. 单词索引\n\n\n\n\n编写一个程序来读取文本文件的内容。该程序应该创建一个字典，其中的键值对描述如下：\n\n*   键（Key）。键是文件中找到的单个单词。\n\
