  >>> turtle.fillcolor('red')\n>>> turtle.begin_fill()\n>>> turtle.circle(100)\n>>>\
  \ turtle.end_fill()\n>>>\n\n```\n\n使用 `turtle.fillcolor` 命令可以使用许多预定义的颜色名称，附录 D 显示了完整列表。常用的颜色有`'red'`、`'green'`、`'blue'`\
