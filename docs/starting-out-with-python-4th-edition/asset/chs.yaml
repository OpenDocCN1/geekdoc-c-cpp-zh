  \ 6 章 文件与异常\n\n## 6.1 文件输入输出简介\n\n### 概念：\n\n当程序需要保存数据以备以后使用时，它会将数据写入文件中。以后可以从该文件中读取这些数据。\n\
  \n你到目前为止编写的程序在每次程序运行时都需要用户重新输入数据，因为存储在 RAM 中（通过变量引用）的数据在程序停止运行后就会消失。如果程序要在要在多次运行之间保留数据，它必须有一种保存数据的方法。数据被保存在文件中，文件通常存储在计算机的磁盘上。一旦数据保存到文件中，即使程序停止运行，它仍将留在那里。存储在文件中的数据以后可以检索并使用。\n\
  \n你每天使用的大多数商业软件软件包都将数据存储在文件中。以下是几个例子：\n\n*   **文字处理器**。文字处理程序用于写信、备忘录、报告和其他文档。然后将这些文档保存到文件中，以便进行编辑和打印。\n\
  *   **图像编辑器**。图像编辑程序用于绘制图形和编辑图像，例如你用数码相机拍摄的照片。你用图像编辑器创建或编辑的图像都保存在文件中。\n*   **电子表格**。电子表格程序用于处理数值数据。数字和数学公式可以插入到电子表格的行和列中。然后可以将电子表格保存到文件中，供以后使用。\n\
  *   **游戏**。许多计算机游戏将数据存储在文件中。例如，某些游戏会将包含玩家名称及其分数的列表存储在文件中。这些游戏通常按照分数从高到低的顺序显示玩家名称。某些游戏还允许你将当前游戏状态保存到文件中，这样你就可以退出游戏稍后恢复游戏，而无需从头开始。\n\
  *   **网络浏览器**。有时当你访问网页时，浏览器会在你的计算机上存储一个名为 `cookie` 的小文件。Cookie 通常包含有关浏览会话的信息，例如购物车的内容。\n\
  \n日常业务操作中使用的程序严重依赖文件。工资发放程序将员工数据保存在文件中，库存程序将公司产品数据保存在文件中，会计系统将公司财务运营数据保存在文件中，以此此类推。\n\
  \n程序员通常将数据保存到文件的过程称为向文件“写入数据”。当一段数据被写入文件时，它从 RAM 中的一个变量复制到文件中。图 6-1 说明了这一点。`输出文件`一词用于描述数据被写入的文件。它被称为输出文件，是因为程序在其中存储了输出内容。\n\
  \n![一张说明向文件写入数据的图](img/fg06_00100.png)\n\n# 图 6-1 向文件写入数据\n\n图 6-1 完整替代文本\n\n从文件中检索数据的过程被称为从文件中“读取数据”。当一段数据从文件中被读取时，它从文件复制到\
  \ RAM 并由变量引用。图 6-2 说明了这一点。`输入文件`一词用于描述从文件中读取数据的文件。它被称为输入文件，是因为程序从文件中获取输入。\n\n![一张说明从文件读取数据的图](img/fg06_00200.png)\n\
  \n# 图 6-2 从文件读取数据\n\n图 6-2 完整替代文本\n\n本章将讨论如何向文件写入数据以及如何从文件中读取数据。当程序使用文件时，始终必须采取三个步骤：\n\
  \n1.  **打开文件**。打开文件会在文件和程序之间建立一种连接。打开输出文件通常会在磁盘上创建该文件，并允许程序向其写入数据。打开输入文件允许程序从文件中读取数据。\n\
  2.  **处理文件**。在这一步中，数据被写入文件（如果是输出文件）或从文件中读取（如果是输入文件）。\n3.  **关闭文件**。当程序完成对文件的使用后，必须关闭文件。关闭文件会断开文件与程序之间的连接。\n\
  \n## 文件类型\n\n通常，文件有两种类型：文本文件和二进制文件。`文本文件`包含使用 ASCII 或 Unicode 等方案编码为文本的数据。即使文件包含数字，这些数字在文件中也是作为一系列字符存储的。因此，该文件可以使用记事本等文本编辑器打开并查看。`二进制文件`包含未转换为文本的数据。二进制文件中的数据仅供程序读取。尽管\
  \ Python 允许你处理文本文件和二进制文件，但在本书中我们将处理文本文件。\n\n## 文件访问方法\n\n大多数编程语言提供了两种访问存储在文件中数据的方法：顺序访问和直接访问。当你使用`顺序访问文件`时，你从文件的开始到结束访问数据。如果你想读取位于文件末尾的段数据，必须读取它之前的所有数据——你无法直接跳转。这类似于旧式磁带播放机的工作方式。如果你想听磁带上的最后一首歌，你必须快进之前所有的歌曲或者听一遍。没有方法直接跳转到某首歌曲。\n\
  \n当你使用`直接访问文件`（称为称为随机访问文件`）时，你可以直接跳转到文件中的任何数据，而无需读取它之前的数据。这类似于 CD 播放机或 MP3 播放机的工作方式。你可以直接跳转到你想听的任何歌曲。\n\
  \n在书中，我们将使用顺序访问文件。顺序访问文件易于处理，你可以利用它们理解基本的文件操作。\n\n## 文件名与文件对象\n\n大多数计算机用户已经习惯通过文件名标识文件。例如，当你用文字处理器创建一个文档并将文档保存为文件时，你必须指定一个文件名。当你使用\
  \ Windows 资源管理器之类的工具检查磁盘内容时，你会看到文件名列表。图 6-3 显示了名为 `cat.jpg`、`notes.txt` 和 `resume.docx`\
  \ 的三个文件在 Windows 中可能是如何图形化的。\n\n![与文件类型相关的三个图标：Cat.jpg 的山脉风光、Notes.txt 的打字页面、以及\
  \ Resume.docx 的页面和 W 标志](img/fg06_00300.png)\n\n# 图 6-3 三文件\n\n\n\n\n\n每个操作系统都有自己的文件命名规则。许多系统支持使用\
  \ `filename extensions`（文件扩展名），它们是文件名末尾的短字符序列，前面有一个点（称为“点”）。例如，图 6-3 所示的文件具有 `.jpg`、`.txt`\
  \ 和 `.doc` 扩展名。扩展名通常表示文件中存储的数据类型。例如，`.jpg` 扩展名通常表示该文件包含根据 JPEG 图像标准压缩的图形图像。`.txt`\
  \ 扩展名通常表示文件包含文本。`.doc` 扩展名（以及 `.docx` 扩展名）通常表示该文件包含 Microsoft Word 文档。\n\n为了让程序能够操作计算机磁盘上的文件，程序必须在内存中创建一个文件对象。`file\
  \ object`（文件对象）是一个与特定文件关联的对象，它为程序提供了操作该文件的方法。在程序中，一个变量引用该文件对象。该变量用于执行对文件执行的任何操作。这一概念在图\
  \ 6-4 所示。\n\n![图说明了变量名如何引用与文件关联的文件对象](img/fg06_00400.png)\n\n## 图 6-4 变量名引用与文件关联的文件对象\n\
  \n图 6-4 备用文本\n\n## 打开文件\n\n你在 Python 中使用 `open` 函数来打开文件。`open` 函数创建一个文件对象并将其与磁盘上的文件关联。以下是使用\
  \ `open` 函数的通用格式：\n\n```\nfile_variable = open(filename, mode)\n```\n\n在通用格式中：\n\
  \n* `file_variable` 是将引用文件对象的变量名。\n* `filename` 是指定文件名的字符串。\n* `mode` 是指定打开文件时模式（读取、写入等）的字符串。表\
  \ 6-1 显示了你可以用于指定模式的三个字符串。（还有还有其他更复杂的模式。表 6-1 中显示的模式是我们在书中将使用的。）\n\n| 模式 | 描述 |\n\
  | --- | --- |\n| `'r'` | 以只读模式打开文件。文件无法被修改或写入。 |\n| `'w'` | 以写入模式打开文件。如果文件已存在，则擦除其内容。如果不存在，则创建它。\
  \ |\n| `'a'` | 以写入模式打开文件。所有写入文件的数据将追加到文件末尾。如果文件不存在，则创建它。 |\n\n## 表 6-1 一些 Python\
  \ 文件模式\n\n例如，假设文件 `customers.txt` 客户数据，我们想以读取方式打开它。以下是我们调用 `open` 函数的示例：\n\n```\n\
  customer_file = open('customers.txt', 'r')\n```\n\n在执行该语句后，名为 `customers.txt` 的文件将被打开，变量\
  \ `customer_file` 将引用一个文件对象，我们可以利用它从文件中读取数据。\n\n假设我们想创建一个名为 `sales.txt` 的文件并从中写入数据。以下是我们调用\
  \ `open` 函数的示例：\n\n```\nsales_file = open('sales.txt', 'w')\n```\n\n在执行该语句后，名为 `sales.txt`\
  \ 的文件将被创建，变量 `sales_file` 将引用一个文件对象，我们可以利用它向文件中写入数据。\n\n## ![](img/ICON_WARNING.png)\
  \ 警告：\n\n记住，当你使用 `'w'` 模式时，你正在磁盘上创建该文件。如果在打开文件时已存在指定名称的文件，则现有文件的内容将被删除。\n\n## 指定文件的位置\n\
  \n当你将一个不包含路径的文件名作为参数传递给 `open` 函数时，Python 解释器假设该文件的位置与程序的位置相同。例如，假设程序位于同一个目录。\n\n\
  如果你想打开另一个目录中的文件，必须提供文件的路径。例如，如果你想打开位于 `/home/user/data/test.txt` 的文件，你需要：\n\n```\n\
  open('/home/user/data/test.txt', 'r')\n```\n\n如果你想打开父目录的文件，可以使用 `..` 表示法。例如：\n\n\
  ```\nopen('../test.txt', 'r')\n```\n\n## 向文件中写入\n\n到目前为止，你在本书中使用了一些函数。现在我们将为你介绍另一种函数类型，即方法（method）。方法是属于对象并使用该对象执行操作的。一旦你打开了文件，就可以使用文件对象的方法进行操作。例如，文件对象有一个名为\
  \ `write` 的方法可以向文件中写入数据。以下是调用 `write` 的通用格式：\n\n```\nfile_variable.write(string)\n\
  ```\n\n在该格式中，`file_variable` 是引用文件对象的变量，`string` 是要写入文件的字符串。文件必须以写入模式（使用 `'w'` 或\
  \ `'a'` 模式）打开，否则会出错。\n\n假设 `customer_file` 引用一个文件对象，且文件已以 `'w'` 模式打开。以下是我们向文件中写入字符串“Charles\
  \ Pace”的示例：\n\n```\ncustomer_file.write('Charles Pace')\n```\n\n以下代码显示另一个示例：\n\n\
  ```\nname = 'Charles Pace'\ncustomer_file.write(name)\n```\n\n第二个语句将变量 `name` 引用的值写入与\
  \ `customer_file` 相关的文件。在这种情况下，它将写入字符串“Charles Pace”。\n\n## 关闭文件\n\n当程序完成文件操作后，应该关闭文件。关闭文件会将程序与文件断开。在某些系统中，未关闭输出文件会导致数据丢失。这是因为写入文件的数据首先写入缓冲区（buffer），它是内存中的一个较小的“存放区域”。当缓冲区满时，系统会将缓冲区的内容写入文件。这种技术提高了系统性能，因为向内存写入数据比写入磁盘快得多。关闭输出文件的过程会强制将缓冲区中剩余任何未保存数据写入文件。\n\
  \n在 Python 中，你使用文件对象的 `close` 方法来关闭文件。例如，以下语句关闭与 `customer_file` 关联的文件：\n\n```\n\
  customer_file.close()\n```\n\n程序 6-1 显示了一个完整的 Python 程序，该程序打开输出文件，写入数据，然后将其关闭。\n\
  \n\n\n\n\n```python\n1  # This program writes three lines of data\n 2  # to a file.\n\
  \ 3  def main():\n 4      # Open a file named philosophers.txt.\n 5      outfile\
  \ = open('philosophers.txt', 'w')\n 6\n 7      # Write the names of three philosphers\n\
  \ 8      # to the file.\n 9      outfile.write('John Locke\\n')\n10      outfile.write('David\
  \ Hume\\n')\n11      outfile.write('Edmund Burke\\n')\n12\n13      # Close the file.\n\
  14      outfile.close()\n15\n16  # Call the main function.\n17  main()\n```\n\n\
  第 5 行使用 `'w'` 模式打开文件 `philosophers.txt。（这将创建文件并以写入模式打开。）它还在内存中创建一个文件对象并将该对象赋值给变量\
  \ `outfile`。\n\n第 9 行到第 11 行的语句向文件写入三个字符串。第 9 行写入字符串 `'John Locke\\n'`，第 10 行写入字符串\
