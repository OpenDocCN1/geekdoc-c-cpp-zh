  \ * 10`\n   4. `price = price / 2`\n\n# 4.5 哨兵值\n\n### 概念：\n\n哨兵值（Sentinel）是一个标记值序列结束的特殊值。\n\
  \n考虑以下场景：你正在设计一个程序，使用循环来处理一个长值序列。在设计程序时，你不知道序列中将包含多少个值。事实上，序列中的值数量每次执行程序时都可能不同。设计这种循环的最佳方法是什么？这里是你在本章已经见过的一些技术，以及在处理长列表时使用这些方法的缺点：\n\
  \n* 简单地在每次循环迭代结束时询问用户是否还有另一个要处理的值。然而，如果值序列很长，在每次循环结束时都问这个问题可能会让程序对用户变得繁琐。\n* 在程序开始时询问用户序列中有多少项。这可能也会给用户带来不便。如果序列非常长，且用户不知道其中包含多少项，这将需要用户自己去数。\n\
  \n在用循环处理长值序列时，也许一种更好的技术是使用哨兵值。*哨兵*是一个标记项目序列结束的特殊值。当程序读取到哨兵值时，它就知道已经到达序列的末尾，因此循环终止。\n\
  \n例如，假设医生想要一个程序来计算她所有患者的平均体重。该程序可能这样工作：循环提示用户输入患者的体重，如果没有更多体重，则输入 0。当程序读取到体重为 0\
  \ 时，它将其解释为没有更多体重的信号。循环结束，程序显示平均体重。\n\n哨兵值必须足够独特，以至于不会误认为是序列中的普通值。在上述示例中，医生（或她的医疗助理）输入\
  \ 0 来信号体重序列的结束。因为没有任何患者的体重会是 0，所以这是一个作哨兵的好值。\n\n### ![](img/ICON_CHECKPT.png) 检查点\n\
  \n1. 4.18 什么是哨兵值？\n2. 4.19 为什么你应该注意选择一个独特的值作为哨兵？\n\n# 4.6 输入验证循环\n\n### 概念：\n\n\
  输入验证是检查所用数据的过程。\n\n\n\n\n\n注意图 4-7 中的流程图，它在两个地方读取输入：首先在循环之前，然后是在循环内部。第一次输入操作——即紧接循环之前的操作——被称为\
  \ `priming read`（引导读入），其目的是获取第一个将由验证循环测试的输入值。如果该值无效，循环将执行后续的输入操作。\n\n让我们来看一个例子。假设你正在设计一个读取测试分数的程序，并且你想确保用户不会输入小于\
  \ `0` 的值。以下代码显示了你如何使用输入验证循环来拒绝任何小于 `0` 的输入值。\n\n```python\n# 获取一个测试分数。\nscore =\
  \ int(input('Enter a test score: '))\n# 确保它不小于 0。\nwhile score < 0:\n    print('ERROR:\
  \ The score cannot be negative.')\n    score = int(input('Enter the correct score:\
  \ '))\n```\n\n这段代码首先提示用户输入一个测试分数（这就是引导读入），然后执行 `while` 循环。记住，`while` 循环是一个预测试循环，这意味着它在执行迭代之前会测试表达式\
  \ `score < 0`。如果用户输入了有效的测试分数，该表达式将为假，循环就不会迭代。然而，如果测试分数无效，该表达式将为真，循环的语句块将执行。循环显示错误信息并提示用户输入正确的测试分数。循环将继续迭代，直到用户输入了有效的测试分数为止。\n\
  \n### ![](img/ICON_NOTE.png) 注意：\n\n输入验证循环有时被称为 `error trap`（错误陷阱）或 `error handler`（错误处理器）。\n\
  \n这段代码只拒绝负数的测试分数。如果你也想拒绝任何大于 `100` 的测试分数怎么办？你可以修改输入验证循环，使其使用复合布尔表达式，如下：\n\n```python\n\
  # 获取一个测试分数。\nscore = int(input('Enter a test score: '))\n# 确保它既不小于 0 也不大于 100。\n\
  while score < 0 or score > 100:\n    print('ERROR: The score cannot be negative')\n\
  \    print('or greater than 100.')\n    score = int(input('Enter the correct score:\
  \ '))\n```\n\n这段代码中的循环判断 `score` 是否小于 `0` 或大于 `100`。如果其中任一成立，就会显示错误信息并提示用户输入正确的分数。\n\
  \n### ![](img/ICON_CHECKPT.png) 检查点\n\n1. 4.20 “垃圾进，垃圾出”（garbage in, garbage out）这句话是什么意思？\n\
  2. 4.21 对输入验证过程进行一般性描述。\n3. 4.22 描述使用输入验证循环验证数据时通常采取的步骤。\n4. 4.23 什么是引导读入（priming\
  \ read）？它的目的是什么？\n5. 4.24 如果引导读入输入的有效，输入验证循环将迭代多少次？\n\n# 4.7 嵌套循环\n\n### 概念：\n\n\
  位于循环内部的循环被称为嵌套循环。\n\n嵌套循环是位于另一个循环内部的循环。时钟是嵌套循环工作的一个很好的例子。秒针、分针和时针都在时钟面上旋转。然而，分针每旋转\
  \ 12 次，时针才旋转 1 圈。而秒针每旋转 60 次，分针才能旋转 1 圈。这意味着时针每完整旋转一圈，秒针就旋转了 720 次。这是一个部分模拟数字时钟的循环，它显示从\
  \ 0 到 59 的秒：\n\n```python\nfor seconds in range(60):\n    print(seconds)\n```\n\n\
  我们可以添加一个 `minutes` 变量，并将上面的循环嵌套到另一个循环 60 分钟的循环内部：\n\n```python\nfor minutes in range(60):\n\
  \    for seconds in range(60):\n        print(minutes, ':', seconds)\n```\n\n为了让模拟的时钟更完整，还可以添加另一个变量和循环来计算小时：\n\
  \n```python\nfor hours in range(24):\n    for minutes in range(60):\n        for\
  \ seconds in range(60):\n           print(hours, ':', minutes, ':', seconds)\n```\n\
  \n这段代码的输出将是：\n\n```\n0 : 0 : 0\n0 : 0 : 1\n0 : 0 : 2\n```\n\n*(程序将数完 24 小时的每一秒。）*\n\
  \n```\n23 : 59 : 59\n```\n\n中间循环每迭代一次，内层循环就会迭代 60 次。外层循环每迭代一次，中间循环就会迭代 60 次。当外层循环迭代\
  \ 24 次时，中间循环迭代了 1,440 次，而内层循环迭代了 86,400 次！图 4-8\n\n# 4.8 乌龟图形：使用循环绘制设计\n\n### 概念：\n\
  \n你可以使用循环绘制复杂度从简单形状到复杂设计的各种图形。\n\n你可以使用循环配合乌龟来绘制简单形状和复杂设计。例如，以下 `for` 循环迭代四次，以绘制一个宽度为\
  \ 100 像素的正方形：\n\n```python\nfor x in range(4):\n    turtle.forward(100)\n    turtle.right(90)\n\
  ```\n\n\n\n\n\n以下代码显示了另一个示例。此 `for` 循环迭代八次，绘制出图 4-9 所示的八边形：\n\n![正八边形。](img/fg04_00900.png)\n\
