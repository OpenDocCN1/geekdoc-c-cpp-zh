  \n### 确定执行任务必须采取的步骤\n一旦你理解了程序要执行的任务，就可以通过将任务分解为一系列步骤来开始。这类似于让某人可以遵循的步骤。例如，假设某人询问如何烧开水。你可能会将该任务分解为如下步骤：\n\
  \n1. 将所需的水倒入锅中。\n2. 将锅放在炉子上。\n3. 将炉开到大火。\n4. 观察水直到看到大泡。当这种情况发生时，水就开了。\n\n这就是算法的一个示例，它是执行任务定义的定义的逻辑步骤。注意此算法中的步骤是有顺序的。步骤\
  \ 1 应该在步骤 2 之前执行，以此此类推。如果一个人完全按照这些步骤并在正确的顺序操作，他或她应该能够烧水。\n\n程序员以类似的方式分解程序必须执行的任务。创建一个算法，其中列出了必须采取的所有逻辑步骤。例如，假设你被要求编写一个计算并显示时工工资的程序。这里是你将采取的步骤：\n\
  \n1. 获取工作小时。\n2. 获取时薪。\n3. 将工作小时乘以时薪。\n4. 显示步骤 3 中执行的计算结果。\n\n当然，这个算法还没有准备好在计算机上执行。列表中的步骤必须翻译成代码。程序员通常使用两个工具来帮助他们完成工作：伪代码和流程图。让我们详细查看其中的每一个工具。\n\
  \n### 伪代码\n因为拼写错误的单词和遗漏标点符号等小错误会导致语法错误，程序员在编写代码时必须注意这些小细节。因此，程序员发现在使用 Python 等编程语言的实际代码编写之前，先用伪代码（读作“sue\
  \ doe code”）编写程序是有帮助的\n\n“pseudo”的意思是虚假的，所以`pseudocode` 是伪代码。它是一种没有语法规则的非正式语言，不是为了编译或执行的。相反，程序员使用伪代码来创建程序的模型，或“原型”。由于程序员在编写伪代码时不需要担心语法错误，他们可以将所有的注意力都放在程序的设计上。一旦用伪代码创建了满意的设计，伪代码就可以直接翻译成实际代码。这里是你如何为之前讨论的计算程序编写伪代码的示例：\n\
  \n*   *输入工作小时*\n*   *输入时薪*\n*   *通过工作小时乘以时薪计算总工资*\n\n\n\n\n*   显示总薪\n\n伪代码中的每条语句都代表可以在\
  \ Python 中执行的操作。例如，Python 可以读取在键盘上键入的输入，进行数学计算，并在屏幕上显示消息。\n\n### 流程图\n\n流程图是程序员用于设计程序的另一种工具。`flowchart`\
  \ 是一种图形化描述程序中所发生步骤的图表。图 2-2 展示了你可能如何为工资计算程序创建一个流程图。\n\n![一个工资计算程序的流程图。](img/fg02_00200.png)\n\
  \n### 图 2-2 工资计算程序的流程图\n\n图 2-2 完整备用文本\n\n注意，流程图中三种符号：椭圆、平行四边形和矩形。这些符号中的每一个都代表程序中的一个步骤，描述如下：\n\
  \n*   出现在流程图顶部和底椭圆被称为 `terminal symbols`（终端符号）。`Start` 终端符号标记程序的起点，`End` 终端符号标记程序的终点。\n\
  *   平行四边形用作 `input symbols`（输入符号）和 `output symbols`（输出符号）。它们代表程序读取输入或显示输出的步骤。\n\
  *   矩形用作 `processing symbols`（处理符号）。它们代表程序对数据进行某些处理的步骤，例如数学计算。\n\n这些符号由箭头连接，箭头代表程序的“流”。要按正确顺序遍历符号，你从\
  \ `Start` 终端开始，顺着箭头移动，直到到达 `End` 终端。\n\n### ![](img/ICON_CHECKPT.png) 检查点\n\n1.\
  \ 2.1 谁是程序员的客户？\n2. 2.2 什么是软件需求？\n3. 2.3 什么是算法？\n4. 2.4 什么是伪代码？\n5. 2.5 什么是流程图？\n\
  6. 2.6 流程图中每个符号代表什么意思？\n    *   椭圆\n    *   平行四边形\n    *   矩形\n\n## 2.2 输入、处理和输出\n\
  \n### 概念\n\n输入是程序接收的数据。当程序接收到数据时，它通常通过对其执行某些操作来处理它。操作的结果作为输出发送到程序外部。\n\n计算机程序通常执行以下三个步骤的过程：\n\
  \n1.  接收输入。\n2.  对输入进行某些处理。\n3.  产生输出。\n\n输入是程序在运行期间接收的任何数据。一种常见的输入形式是键盘键盘上键入的数据。一旦接收输入，通常会对其进行某些处理，例如数学计算。然后将处理结果作为输出发送到程序外部。\n\
  \n图 2-3 展示了我们之前讨论的工资计算程序中的这三个步骤。工作小时数和每小时工资率作为输入提供。程序通过将工作小时数乘以每小时工资率来处理这些数据。计算结果然后作为输出显示在屏幕上。\n\
  \n![显示工资计算程序的输入、处理和输出的流程图。](img/fg02_00300.png)\n\n### 图 2-3 工资计算程序的输入、处理和输出\n\n\
  图 2-3 完整备用文本\n\n在本章中，我们将讨论使用 Python 执行输入、处理和输出的基本方法。\n\n## 2.3 使用 print() 函数显示输出\n\
  \n### 概念\n\n你使用 `print()` 函数在 Python 程序中显示输出。\n\n`function`（函数）是一段执行操作的预写代码。Python\
  \ 拥有许多执行各种操作的内置函数。也许最基本的内置函数是 `print()` 函数，它在屏幕上显示输出。以下是一个执行 `print()` 函数的语句示例：\n\
  \n```\nprint('Hello world')\n```\n\n在交互模式下，如果你输入这条语句并按 Enter 键，就会显示消息 `Hello world`。这是一个示例：\n\
  \n```\n>>> print('Hello world') \nHello world\n>>>\n```\n\n当程序员执行函数时，他们说他们正在 `calling`（调用）该函数。当你调用\
  \ `print()` 函数时，你输入单词 `print`，后面跟着括号。在括号内部，你输入一个 `argument`（参数），即你想要显示在屏幕上的数据。在上例示例中，参数是\
  \ `'Hello world'`。注意，当语句执行时，引号不会被显示。引号只是指定了你想要显示的文本的开始和结束。\n\n\n\n\nPython 还允许你使用三引号（无论是\
  \ `\"\"\"` 或 `'''`）来包含字符串字量。三引号字符串可以包含单引号和双引号作为字符串的一部分。下面的语句展示了一个示例：\n\n```\nprint(\"\
  \"\"I'm reading \"Hamlet\" tonight.\"\"\")\n```\n\n该语句将打印：\n\n```\nI'm reading \"\
  Hamlet\" tonight.\n```\n\n三引号还可以用于封装多行字符串，这是单引号和双引号无法做到的。这里有一个示例：\n\n```\nprint(\"\
  \"\"One\nTwo\nThree\"\"\")\n```\n\n该语句将打印：\n\n```\nOne\nTwo\nThree\n```\n\n### ![](img/ICON_CHECKPT.png)\
  \ 检查\n\n1. 2.7 编写一条显示你名字的语句。\n2. 2.8 编写一条显示以下文本的语句：\n\n   ```\n   Python's the best!\n\
  \   ```\n3. 2.9 编写一条显示以下文本的语句：\n\n   ```\n   The cat said \"meow.\"\n   ```\n\n\
  ## 2.4 注释\n\n### Concept：\n\n注释是解释性的备注，用于记录程序的行或部分。注释是程序的一部分，但 Python 解释器会忽略它们。它们是为可能阅读源代码的人准备的。\n\
  \n注释是放置在程序不同部分的短备注，用于解释程序的这些部分是如何工作的。尽管注释是程序的关键部分，但它们会被 Python 解释器忽略。注释是针对任何阅读程序代码的人，而不是针对计算机。\n\
  \n在 Python 中，你用 `#` 字符开始注释。当 Python 解释器看到 `#` 字符时，它会忽略从该字符到行尾的所有内容。例如，查看 程序 2-5\
  \ 。第 1 行和第 2 行是注释，简要说明了程序的目的。\n\n### 程序 2-5 `(comment1.py)`\n\n```\n 1  # This program\
  \ displays a person's\n 2  # name and address.\n 3  print('Kate Austen')\n 4  print('123\
  \ Full Circle Drive')\n 5  print('Asheville, NC 28899')\n```\n\n**程序输出**\n\n```\n\
  Kate Austen\n123 Full Circle Drive\nAsheville, NC 28899\n```\n\n程序员通常会在代码中编写行尾注释。*行尾注释*是指出现在代码行末尾的注释。它通常解释该行中出现的语句。程序\
  \ 2-6 展示了一个示例。每行代码都以一个注释结束，简要说明该行执行的作用。\n\n### 程序 2-6 `(comment2.py)`\n\n```\n 1\
  \  print('Kate Austen')             # Display the name.\n 2  print('123 Full Circle\
  \ Drive')   # Display the address.\n 3  print('Asheville, NC 28899')     # Display\
  \ the city, state, and ZIP.\n```\n\n**程序输出**\n\n```\nKate Austen\n123 Full Circle\
  \ Drive\nAsheville, NC 28899\n```\n\n作为一名初级程序员，你可能对在程序中大量编写注释的想法产生抵触。毕竟，编写实际上能执行操作的代码看起来可能效率更高！然而，花额外时间编写注释至关重要的。当你以后需要修改或调试程序时，它们几乎肯定会为你和他人节省时间。如果不进行适当的注释，大型复杂的程序几乎无法阅读和理解。\n\
  \n## 2.5 变量\n\n### Concept：\n\n变量是一个代表计算机内存中存储的值的名字。\n\n程序通常将数据存储在计算机内存中并对其进行操作。例如，考虑典型的在线购物体验：你浏览网站并将想要购买的商品添加到购物车。当你将商品添加到购物车时，关于这些商品的数据就会存储在内存中。然后，当你点击结账按钮时，运行在网站计算机上的程序会计算购物车中所有商品的费用、适用的销售税、运费以及所有这些费用的总和。当程序执行这些计算时，它会将结果存储在计算机内存中。\n\
  \n程序使用变量来访问和操作存储在内存中的数据。*变量*是一个代表计算机内存中值的的名字。例如，计算购买销售税的程序可能会使用变量名 `tax` 来代表内存中的该值。计算两个城市之间距离的程序可能会使用变量名\
  \ `distance` 来代表内存中的该值。当变量代表计算机内存中的一个值时，我们说该变量*引用*该值。\n\n### 使用赋值语句创建变量\n\n你使用*赋值语句*创建变量并让它引用一段数据。这里有一个赋值语句的示例：\n\
  \n```\nage = 25\n```\n\n在该语句执行后，将创建一个名为 `age` 的变量并引用一段数据。参考图 2-4，想象值 25 存储在内存的某处。箭头从\
  \ `age` 指向该值。\n\n![Figure 2-4](img/fg0200.png)\n\n赋值语句的格式如下：\n\n```\nvariable =\
  \ expression\n```\n\n等号（`=`）被称为*赋值运算符*。在通用格式中，`variable` 是变量的名字，`expression` 是产生值的代码。为了尝试变量，你可以在交互模式下输入赋值语句，如下：\n\
  \n```\n>>> width = 10\n>>> length = 5\n>>>\n```\n\n第一个语句创建一个名为 `width` 的变量并赋值为 10。第二个语句创建一个名为\
  \ `length` 的变量并赋值为 5。接下来，你可以使用 `print` 函数显示这些变量引用的值，如下：\n\n```\n>>> print(width)\n\
  10\n>>> print(length)\n5\n>>>\n```\n\n当你将变量作为 `print` 函数的参数时，不需要给变量名加上引号。为了证明这一点，查看以下交互会话：\n\
  \n```\n>>> print('width')\nwidth\n>>> print(width)\n10\n>>>\n```\n\n在第一个语句中，你将 `'width'`\
  \ 作为 `print` 函数的参数，函数打印了字符串 *width*。在第二个语句中，你将 `width`（不带引号）作为 `print` 函数的参数，函数显示了\
  \ `width` 变量引用的值。\n\n在赋值语句中，接收赋值的变量必须出现在 `=` 运算符的左侧。如下交互会话所示，如果 `=` 运算符左侧的项目不是变量，就会发生错误：\n\
  \n```\n>>> 25 = age\nSyntaxError: can't assign to literal\n>>>\n```\n\n程序 2-7 展示了一个变量。第\
  \ 2 行创建一个名为 `room` 的变量并赋值为 503。第 3 行和第 4 行的语句显示了一条消息。注意第 4 行显示了 `room` 变量引用的值。\n\
  \n### 程序 2-7 `(variable_demo.py)`\n\n```\n 1  # This program demonstrates a variable.\n\
  \ 2  room = 503\n 3  print('I am staying in room number')\n 4  print(room)\n```\n\
  \n\n\n\n\n程序 2-8 显示了一个使用两个变量示例程序。第 2 行创建了一个名为 `top_speed` 的变量，并为其赋值值 160。第 3 行创建了一个名为\
  \ `distance` 的变量，并为其赋值值 300。这在图 2-5 中所示。\n\n![顶部：一个箭头从左侧的文本“top underscore speed”指向右侧框中的\
  \ 160。底部：一个箭头从左侧的文本“distance”指向右侧框中的 300。](img/fg02_0050.png)\n\n### 图 2-5 两个变量\n\
  \n## 程序 2-8 `(variable_demo2.py)`\n\n```\n 1  # 创建两个变量：top_speed 和 distance。\n 2\
  \  top_speed = 160\n 3  distance = 300\n4\n 5  # 显示变量引用的值。\n 6  print('The top speed\
  \ is')\n 7  print(top_speed)\n 8  print('The distance traveled is')\n 9  print(distance)\n\
  ```\n\n### 程序输出\n\n```\nThe top speed is\n160\nThe distance traveled is\n300\n```\n\
  \n## ![](img/ICON_WARNING.png) 警告！\n\n在变量赋值之前，你无法使用它。如果你尝试对未赋值的变量操作（例如打印它），就会发生错误。\n\
  \n有时简单的拼写错误会导致这种错误。一个例子是变量名拼写错误，如下：\n\n```\ntemperature = 74.5 # 创建一个变量\nprint(tempereture)\
  \  # 错误！变量名拼写错误\n```\n\n在此段代码中，变量 `temperature` 通过赋值语句创建。然而，`print` 语句中的变量名拼写不同，这会导致错误。另一个例子是在变量名中不一致地使用大小写字母。这里有一个示例：\n\
  \n```\ntemperature = 74.5 # 创建一个变量\nprint(Temperature)  # 错误！大小写使用不一致\n```\n\n在此段代码中，通过赋值语句创建了全小写的变量\
  \ `temperature`。在 `print` 语句中，名称 `Temperature` 使用了大写 T 开头。这会导致错误，因为 Python 中的变量名是区分大小写的。\n\
  \n### 变量命名规则\n\n虽然你可以为变量自定义名称，但你必须遵循这些规则：\n\n- 你不能使用 Python 的关键字作为变量名。（关键字列表请表 1-2）\n\
  \n- 变量名不能包含空格。\n\n- 第一个字符必须是字母 `a` 到 `z`、`A` 到 `Z` 或下划线字符 (`_`)。\n\n- 在第一个字符之后，你可以使用字母\
  \ `a` 到 `z` 或 `A` 到 `Z`、数字 `0` 到 `9` 或下划线。\n\n- 大写字母和小写字母是有区别的。这意味着变量名 `ItemsOrdered`\
  \ 与 `itemsordered` 不同。\n\n除了遵循这些规则外，你应该始终选择能够指示其用途的变量名称。例如，存储温度的变量可以命名为 `temperature`，存储车速的变量可以命名为\
  \ `speed`。你可能会想给变量命名为 `x` 和 `b2`，但这些名称无法提供关于变量用途的任何线。\n\n由于变量名应该反映变量的用途，程序员经常发现自己正在创建由多个单词组成的名称。例如，考虑以下变量名：\n\
  \n```\ngrosspay\npayrate\nhotdogssoldtoday\n```\n\n遗憾的是，这些名称并不便于肉眼阅读，因为单词没有被分开。由于我们不能在变量名中包含空格，我们需要找到另一种方法分隔多单词变量名中的单词，使其对肉眼更具可读性。\n\
  \n实现这一点的方法之一是使用下划线表示空格。例如，以下变量名比之前显示的更容易阅读：\n\n```\ngross_pay\npay_rate\nhot_dogs_sold_today\n\
  ```\n\n这种变量命名风格在 Python 程序员中非常流行，也是我们书中将使用的风格。不过，还有其他流行的风格，例如 `camelCase`（驼峰命名法）约定。`camelCase`\
  \ 名称按以下方式编写：\n\n- 变量名以小写字母开头。\n\n- 第二个及后续单词的首字母使用大写字母。\n\n例如，以下变量名是：\n\n```\ngrossPay\n\
  payRate\nhotDogsSoldToday\n```\n\n### ![](img/ICON_NOTE.png) 注意\n\n\n\n\n\n# 图 2-6\
  \ 程序 2-10 中的变量重新赋值\n\n图 2-6 完整备用文本\n\n# 程序 2-10 `(variable_demo4.py)`\n\n```\n 1\
  \  # 此程序演示了变量的重新赋值。\n 2  # 给 dollars 变量赋值一个值。\n 3  dollars = 2.75\n 4  print('I\
  \ have', dollars, 'in my account.')\n 5\n 6  # 重新赋值 dollars 使其引用\n 7  # 一个不同的值。\n\
  \ 8  dollars = 99.95\n 9  print('But now I have', dollars, 'in my account!')\n```\n\
  \n程序输出\n\n```\nI have 2.75 in my account.\nBut now I have 99.95 in my account!\n\
  ```\n\n# 数值数据类型和字面量\n\n在第 1 章中，我们讨论了计算机在内存中存储数据的方式。（参见第 1.3 节）。你可能记得那次讨论，计算机存储实数（带有小数部分的数字）的技术与存储整数的不同。这些类型的数字在内存中的存储方式不同，对它们进行类似操作时采用的方法也不同。\n\
  \n由于不同类型的数字存储和处理方式不同，Python 使用*数据类型*来对内存中的值进行分类。当整数存储在内存中时，它被归类为 `int`；当实数存储在内存中时，它被归类为\
  \ `float`。\n\n让我们来看看 Python 如何确定一个数字的数据类型。到目前为止，你看到的几个程序在代码中都写有数值数据。例如，以下出现在程序 2-9\
  \ 中的语句中写了数字 503：\n\n```\nroom = 503\n```\n\n这条语句导致值 503 被存储在内存中，并让 `room` 变量引用它。以下出现在程序\
  \ 2-10 中的语句写了数字 2.75：\n\n```\ndollars = 2.75\n```\n\n这条语句导致值 2.75 被存储在内存中，并让 `dollars`\
  \ 变量引用它。写在程序代码中的数字被称为*数值字面量*（numeric literal）。当 Python 解释器读取程序代码中的数值字面量时，它根据以下规则确定其数据类型：\n\
  \n*   写为不带小数点的整数的数值字面量被视为 `int`。示例有 `7`、`124` 和 −`9`。\n*   带有带有小数点的数值字面量被视为 `float`。示例有\
  \ `1.5`、`3.14159` 和 `5.0`。\n\n因此，以下语句导致数字 503 作为 `int` 存储在内存中：\n\n```\nroom = 503\n\
  ```\n\n而以下语句导致数字 2.75 作为 `float` 存储在内存中：\n\n```\ndollars = 2.75\n```\n\n当内存中存储一个项时，意识到该项的数据类型是非常重要的。正如你将看到的，某些操作的行为取决于所涉及的数据类型，而某些操作只能对特定数据类型的值执行。\n\
  \n作为一项实验，你可以在交互模式下使用内置的 `type` 函数来确定值的数据类型。例如，查看以下会话：\n\n```\n>>> type(1) \n<class\
  \ 'int'>\n>>>\n```\n\n在这个示例中，值 1 作为参数传递给 `type` 函数。下一行显示的消息 `<class 'int'>` 表明该值是一个\
  \ `int`。这是另一个示例：\n\n```\n>>> type(1.0) \n<class 'float'>\n>>>\n```\n\n在这个示例中，值 1.0\
  \ 作为参数传递给 `type` 函数。下一行显示的消息 `<class 'float'>` 表明该值是一个 `float`。\n\n警告！\n\n不能在数值字面量中编写货币符号、空格或逗号。例如，以下语句会导致错误：\n\
  \n```\nvalue = $4,567.99 # 错误\n```\n\n该语句必须写为：\n\n```\nvalue = 4567.99 # 正确\n```\n\
  \n### 使用 `str` 类型存储字符串\n\n除了 `int` 和 `float` 类型外，Python 还有一个名为 `str` 的数据类型，用于在内存中存储字符串。程序\
  \ 2-11 中的代码展示了如何将字符串赋值给变量。\n\n# 程序 2-11 `string_variable.py`\n\n```\n 1  # 创建引用字符串的变量。\n\
  \ 2  first_name = 'Kathryn'\n 3  last_name = 'Marino'\n 4\n 5  # 显示变量引用的值。\n 6 \
  \ print(first_name, last_name)\n```\n\n程序输出\n\n```\nKathryn Marino\n```\n\n# 将变量重新赋值为不同类型\n\
  \n请记住，在 Python 中，变量只是引用内存中某个数据的名称。它是一种让你（程序员）存储和检索数据的机制。在内部，Python 解释器跟踪你创建的变量名以及这些变量名引用的数据。当你需要检索这些数据之一时，只需使用该变量名。\n\
  \nPython 中的变量可以引用任何类型的项。在变量被赋值一种类型后，它可以被重新赋值为另一种类型。为了演示，请查看以下会话（我们为了方便引用了行号）：\n\n\
  ```\n1  >>> x = 99\n2  >>> print(x)\n3  99\n4  >>> x = 'Kathryn'\n5  >>> print(x)\n\
  6  Kathryn\n7  >>>\n```\n\n第 1 行的语句创建了一个名为 `x` 的变量，并将其赋值为 `int` 值 99。图 2-7 展示了变量\
  \ `x` 如何引用内存中的 99。第 2 行的语句调用 `print` 函数，并将 `x` 作为参数。`print` 函数的输出在第 3 行显示。然后，第 4\
  \ 行的语句将字符串赋值给变量 `x`。在该语句执行后，变量 `x` 不再引用 `int`，而是引用 `'Kathryn'`。第 5 行再次调用 `print`\
  \ 函数，并将 `x` 作为参数。第 6 行显示了 `print` 函数的输出。\n\n![箭头从左侧的 X 指向右侧框中的 99](img/fg02_0700.png)\n\
  \n# 图 2-7 变量 `x` 引用整数\n\n![箭头从左侧的 x 指向右侧框中的“Kathryn”，它是另一个框中 99 的下方](img/fg02_0800.png)\n\
  \n# 图 2-8 变量 `x` 引用字符串\n\n### 检查\n\n1.  2.10 什么是变量？\n2.  2.11 以下哪些变量名在 Python 中是非合法的，为什么？\n\
  \    ```\n    x\n    99bottles\n    july2009\n    theSalesFigureForFiscalYear\n\
  \    r&d\n    grade_report\n    ```\n3.  2.12 变量名 `Sales` 和 `sales` 相同吗？为什么相同或相同？\n\
  4.  2.13 以下赋值语句有效还是无效？如果无效，为什么？\n    ```\n    72 = amount\n    ```\n5.  2.14 以下代码将显示什么？\n\
  \    ```\n    val = 99\n    print('The value is', 'val')\n    ```\n6.  2.15 查看以下赋值语句：\n\
  \    ```\n    value1 = 99\n    value2 = 45.9\n    value3 = 7.0\n    value4 = 7\n\
  \    value5 = 'abc'\n    ```\n    在这些语句执行后，每个变量引用的值的 Python 数据类型是什么？\n7.  2.16 以下程序将显示什么？\n\
