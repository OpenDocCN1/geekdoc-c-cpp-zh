  )\n       print(names)\n   ```\n\n# 7.5 列表方法和常用的内置函数\n\n### 概念：\n\n列表有许多方法，允许你处理它们包含的元素。Python\
  \ 还提供了一些对处理列表非常有用的内置函数。\n\n列表有许多方法，允许你添加元素、删除元素、更改元素顺序等。我们将查看其中一些方法，⁵，这些方法列在 表 7-1\
  \ 中。\n\n| 方法 | 描述 |\n| --- | --- |\n| `append(item)` | 将 `item` 添加到列表末尾。 |\n| `index(item)`\
  \ | 返回第一个等于 `item` 的元素的索引。如果 item 不在列表中，则抛出 `ValueError`。 |\n| `insert(index, item)`\
  \ | 在指定的 `index` 处向列表中插入 `item`。如果指定的索引超出列表末尾，则项将被添加到末尾。如果指定了负索引，则项将插入到列表开头。 |\n\
  | `remove(item)` | 从列表中删除第一次出现的 `item`。如果 item 不在列表中，则抛出 `ValueError`。 |\n| `sort()`\
  \ | 对列表中的项进行排序，使其按升序（从低值到高值）排列。 |\n| `reverse()` | 反转列表中项的顺序。 |\n\n`append` 方法通常用于向列表添加内容。作为参数传递的项会被添加到列表现有元素的末尾。\n\
  \n```\n 1  # 此程序演示了如何使用 append 方法\n 2  # 向列表添加项。\n 3\n 4 def main():\n 5      #\
  \ 首先，创建一个空列表。\n 6      name_list = []\n 7\n 8      # 创建一个用于控制循环的变量。\n 9      again\
  \ = 'y'\n10\n11      # 向列表添加一些名称。\n12      while again == 'y':\n13          # 从用户处获取一个名称。\n\
  14          name = input('Enter a name: ')\n15\n16          # 将名称添加到列表中。\n17   \
  \       name_list.append(name)\n18\n19          # 还要加一个吗？\n20          print('Do\
  \ you want to add another name?')\n21          again = input('y = yes, anything\
  \ else = no: ')\n22          print()\n23\n24      # 显示输入的名称。\n25      print('Here\
  \ are the names you entered.')\n26\n27      for name in name_list:\n28         \
  \ print(name)\n29\n30 # 调用 main 函数。\n31 main()\n```\n\n注意第 6 行的语句：\n\n```\nname_list\
  \ = []\n```\n\n\n\n之前，你已经看到如何使用 `in` 运算符来确定一个项目是否在列表中。有时你不仅需要知道一个项目是否在列表中，还需要知道它位于哪里。在这种情况下，`index`\
  \ 方法非常有用。你向 `index` 方法传递一个参数，它会返回列表中包含该项的第一个元素的索引。如果在列表中未找到该项，该方法将抛出 `ValueError`\
  \ 异常。程序 7-4 演示了 `index` 方法。\n\n# 程序 7-4 `(index_list.py)`\n\n```python\n 1 # 这个程序演示了如何获取列表中项的\n\
  \ 2 # 索引，然后用新项替换\n 3 # 该项。\n 4\n 5 def main():\n 6      # 创建一个包含某些项的列表。\n 7    \
  \  food = ['Pizza', 'Burgers', 'Chips']\n 8\n 9      # 显示列表。\n10      print('Here\
  \ are the items in the food list:')\n11      print(food)\n12\n13      # 获取要更改的项。\n\
  14      item = input('Which item should I change? ')\n15\n16      try:\n 17    \
  \      # 获取该项在列表中的索引。\n 18          item_index = food.index(item)\n19\n20      \
  \    # 获取要替换它的新值。\n 21          new_item = input('Enter the new value: ')\n22\n\
  23          # 用新项替换旧项。\n 24          food[item_index] = new_item\n25\n 26      \
  \    # 显示列表。\n27      print('Here is the revised list:')\n28      print(food)\n\
  29      except ValueError:\n30          print('That item was not found in the list.')\n\
