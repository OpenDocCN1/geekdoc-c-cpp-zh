  \ 则表示画笔落下，如果返回 `False` 则表示抬起。\n\n## 确定当前的绘图颜色\n\n使用 `turtle.pcolor()` 函数可以获取当前的绘图颜色。\n\
  \n### 确定当前的填充颜色\n\n使用 `turtle.fillcolor()` 函数可以获取当前的填充颜色。\n\n## 确定龟是否可见\n\n使用 `turtle.isvisible()`\
  \ 函数可以判断龟是否可见。如果返回 `True` 则表示可见，如果返回 `False` 则表示不可见。\n\n## 隐藏龟\n\n使用 `turtle.hideturtle()`\
  \ 和 `turtle.showturtle()` 来控制龟的显示和隐藏。\n\n## 移动龟\n\n使用 `turtle.forward(distance)`、`turtle.backward(distance)`、`turtle.goto(x,\
  \ y)` 和 `turtle.setheading(angle)` 来移动龟。\n\n## 检测龟正在移动\n\n使用 `turtle.ismoving()`\
  \ 函数可以判断龟是否正在移动。该函数返回 `True` 或 `False`。\n\n```python\nif turtle.ismoving():\n  \
  \  print(\"The turtle is moving\")\n```\n\n### 停止移动\n\n使用 `turtle.speed(0)` 可以让龟移动得最快，而使用\
