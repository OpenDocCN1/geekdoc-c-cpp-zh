  \      sales = [100, 400, 300, 600]\n 7\n 8      # 创建切扇标签列表。\n 9      slice_labels\
  \ = ['1st Qtr', '2nd Qtr', '3rd Qtr', '4th Qtr']\n10\n11      # 从值创建饼图。\n12    \
