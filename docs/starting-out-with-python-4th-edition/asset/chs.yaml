  \ 位于矩形框的宽中心，左右两侧有窄窗格。](img/fg05_00800)\n\n### 图 5-8 函数符号\n\n程序员通常为程序中的每个函数单独绘制一个流程图。例如，图\
  \ 5-9 展示了程序 5-2 中的 `main` 函数和 `message` 函数是如何绘制流程图的。在为函数绘制流程图时，起始终端符号显示函数名称，终止符号显示\
  \ `Return`。\n\n![程序 5-2 的流程图。](img/fg05_00900)\n\n### 图 5-9 程序 5-2 的流程图\n\n## 自顶向下设计\n\
  \n在本节中，我们讨论并演示了函数是如何工作的。你已经看到当函数被调用时，程序的控制权是如何转移给函数的，当函数结束时，它又是返回到调用该函数的程序部分的。理解函数的这些机械方面是非常重要的。\n\
  \n理解函数如何工作的同时，理解设计一个使用函数的程序同样重要。程序员通常使用称为“自顶向下设计”的技术将算法分解为函数。自顶向下设计的过程按如下方式进行：\n\
  \n*   将程序要执行的整体任务分解为一系列子任务。\n*   检查每个子任务，以确定它是否可以进一步分解为更多的子任务。\n*   一旦确定了所有子任务，就将它们写成代码。\n\
  \n这个过程被称为自顶向下设计，因为程序员首先查看必须执行的最顶层级任务，然后将这些任务分解为较低层次的子任务。\n\n## 层结构图\n\n流程图是图形化描述函数内部逻辑流的好工具，但它们没有提供函数之间关系的视觉表示。程序员通常使用层结构图来实现这一目的。层结构图（也称为结构图）显示了代表程序中每个函数的框。这些框以特定的连接方式说明了每个函数所调用的其他函数。图\
  \ 5-10 展示了一个假设性程序的层结构图示例。\n\n![函数的层结构图。](img/fg05_0100)\n\n### 图 5-10 层结构图\n\n层结构图全图\n\
  \n所示图 5-10 中的层结构图显示了 `main` 函数作为顶层函数。main 函数调用了五个函数：`get_input`、`calc_gross_pay`、`calc_overtime`、`calc_withholdings`\
  \ 和 `calc_net_pay`。`get_input` 函数调用了两个额外函数：`get_hours_worked` 和 `get_hourly_rate`。`calc_withholdings`\
  \ 函数也调用了两个函数：`calc_taxes` 和 `calc_benefits`。注意层结构图没有显示函数内部的步骤。它们不能替代伪代码。\n\n## 等待用户按下\
  \ Enter\n\n有时你希望程序暂停，以便阅读屏幕上显示的信息。当用户准备好继续执行程序时，按下 `Enter` 键，程序就会恢复。在 Python 中，你可以使用\
  \ `input` 函数使程序暂停，直到用户按下 `Enter` 键。程序 5-3 的第 7 行就是一个示例：\n\n```python\ninput('Press\
  \ Enter to see Step 1.')\n```\n\n该语句显示提示符 `'Press Enter to see Step 1.'` 并暂停直到用户按下\
  \ `Enter` 键。程序在第 10、13 和 16 行也这种技术。\n\n## 5.4 局部变量\n\n### 概念：\n\n局部变量创建在函数内部，无法被函数之外的语句访问。不同的函数可以具有相同的局部变量，因为函数看不到彼此的局部变量。\n\
  \n每你在函数内部给变量赋值时，就会创建一个局部变量。局部变量属于创建它的函数，只有该函数内部的语句可以访问该变量。（*局部*一词意味着该变量只能在创建它的函数内部使用。）\n\
  \n如果一个函数的语句尝试访问另一个函数的局部变量，将会发生错误。例如，查看程序 5-4。\n\n# 程序 5-4 `(bad_local.py)`\n\n\n\
  \n\n\n```python\n 1  # Definition of the main function.\n 2  def main():\n 3   \
  \   get_name()\n 4      print('Hello', name)      # This causes an error!\n5\n 6\
  \  # Definition of the get_name function.\n 7  def get_name():\n 8      name = input('Enter\
  \ your name: ')\n9\n10  # Call the main function.\n11  main()\n```\n\n此程序有两个函数：`main`\
  \ 和 `get_name`。在第 8 行，`name` 变量被赋值了用户输入的值。该语句位于 `get_name` 函数内部，因此 `name` 变量是该函数的局部变量。这意味着\
  \ `name` 变量无法被 `get_name` 函数外部的语句访问。\n\n`main` 函数在第 3 行调用了 `get_name` 函数。然后，第 4\
  \ 行的语句尝试访问 `name` 变量。这会导致错误，因为 `name` 变量是 `get_name` 函数的局部变量，`main` 函数中的语句无法访问它。\n\
  \n# 作用域与局部变量\n\n变量的`scope`（作用域）是程序中可以访问该变量的部分。变量仅对其所在作用域内的语句可见。局部变量的作用域是创建该变量的函数。正如你在程序\
  \ 5-4 中所示，函数外部的任何语句都无法访问该变量。\n\n此外，局部变量无法被函数内部在变量创建之前出现的代码访问。例如，看以下函数。它会导致错误，因为\
  \ `print` 函数尝试访问 `val` 变量，但该语句出现在 `val` 变量被创建之前。将赋值语句移动到 `print` 语句之前的行将可以修复此错误。\n\
  \n```python\ndef bad_function():\n    print('The value is', val)    # This will\
  \ cause an error!\n    val = 99\n```\n\n由于函数的局部变量对其他函数是隐藏的，其他函数可能拥有同名的局部变量。例如，看程序\
  \ 5-5。除了 `main` 函数外，此程序还有两个函数：`texas` 和 `california`。这两个函数各都有一个名为 `birds` 的局部变量。\n\
  \n# 程序 5-5 `birds.py`\n\n```python\n 1  # This program demonstrates two functions\
  \ that\n 2  # have local variables with the same name.\n3\n 4  def main():\n 5 \
  \     # Call the texas function.\n 6      texas()\n 7      # Call the california\
  \ function.\n 8      california()\n9\n10  # Definition of the texas function. It\
  \ creates\n11  # a local variable named birds.\n12  def texas():\n13      birds\
  \ = 5000\n14      print('texas has', birds, 'birds.')\n15\n16  # Definition of the\
  \ california function. It also\n17  # creates a local variable named birds.\n18\
  \  def california():\n19      birds = 8000\n20      print('california has', birds,\
  \ 'birds.')\n21\n22  # Call the main function.\n23  main()\n```\n\n### 程序输出\n\n\
  ```\ntexas has 5000 birds.\ncalifornia has 8000 birds.\n```\n\n虽然此程序中有两个名为 `birds`\
  \ 的独立变量，但一次只有一个是的，因为它们位于不同的函数中。这在图 5-12 中所示。当 `texas` 函数执行时，第 13 行创建的 `birds` 变量是可见的。当\
  \ `california` 函数执行时，第 19 行创建的 `birds` 变量是可见的。\n\n![显示每个函数如何拥有自己的 birds 变量的两个序列](img/fg05_01200.png)\n\
