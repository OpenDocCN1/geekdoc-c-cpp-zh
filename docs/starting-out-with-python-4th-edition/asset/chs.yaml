  \ 行。那么该字典将包含一个元素，其键为字符串“robot”，值为包含数字 7、18、94 和 138 的列表。\n\n一旦构建了字典，程序就应该创建另一个文本文件，称为“单词索引”（word\
  \ index），列出字典的内容。单词索引文件应包含字典中存储为键的单词的字母顺序列表，以及这些单词在原始文件中出现的行号。图 9-1 显示了原始文本文件（`Kennedy.txt`）及其索引文件（`index.txt`）的示例。\n\
