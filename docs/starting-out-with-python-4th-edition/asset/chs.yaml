  )\n>>> turtle.goto(70, -120)\n>>> turtle.write(\"Bottom Right\")\n>>>\n\n### 填充形状\n\
  \n要用颜色填充形状，请在绘制形状之前使用 `turtle.begin_fill()` 命令，然后在绘制完成后使用 `turtle.end_fill()` 命令。当\
  \ `turtle.end_fill()` 命令执行时，形状将用当前的填充颜色填充。下面的交互式演示展示了这一点。该会话的输出位于图 2-24![Python\
