  # 第 5 章\n\n## 5.1\n函数是程序中存在的一组语句，目的是执行特定的任务。\n\n## 5.2\n将一个大任务划分为若干易于执行的小型任务。\n\n\
  ## 5.3\n如果在程序的的多个处执行某个特定操作，则可以编写一次函数来执行该操作，并在需要时随时调用。\n\n## 5.4\n可以为不同程序所需的常用任务编写函数。这些函数可以被整合到需要它们的每个程序中。\n\
  \n## 5.5\n当程序被开发为一组函数时，每个函数执行一个单独的任务，那么可以分配不同的程序员编写不同的函数。\n\n## 5.6\n函数定义包含两个部分：头部和块。头部指示函数的起始点，块是属于该函数的语句列表。\n\
  \n## 5.7\n调用函数意味着执行该函数。\n\n## 5.8\n当到达函数结束时，计算机会返回到调用函数的程序部分，程序从该点继续执行。\n\n## 5.9\n\
  因为 `Python` 解释器使用 `indentation`（缩进）来确定块的开始和结束\n\n## 5.10\n局部变量是声明在函数内部的变量。它属于定义的函数，只有同一函数中的语句才能访问它。\n\
  \n## 5.11\n程序中可以访问变量的部分。\n\n## 5.12\n是的，这是允许的。\n\n## 5.13\n参数 (Arguments)\n\n##\
  \ 5.14\n形式 (Parameters)\n\n## 5.15\n参数变量的作用域是参数定义的整个函数。\n\n## 5.16\n不，不是。\n\n##\
  \ 5.17\n1. 通过关键字传递\n2. 按位置传递\n\n## 5.18\n整个程序\n\n## 5.19\n这里三个：\n* 全局变量使调试变得困难。程序中的任何语句都可以改变全局变量的值。如果你发现全局变量中存储了错误的值，你必须追踪访问它的每条语句，以确定错误值是从哪里来的。在数千行代码的程序中，这可能是困难的。\n\
  * 使用全局变量的函数通常依赖于这些变量。如果你要在另一个程序中使用此类函数，你可能需要重新设计它，使其不再依赖全局变量。\n* 全局变量让程序难以理解。全局变量可以被程序中的任何语句修改。如果你要理解使用全局变量程序的任何部分，你必须意识到程序中访问该全局变量的所有其他部分。\n\
  \n## 5.20\n全局常量程序中每个函数都可用的名称。使用全局常量是允许的。因为它们的值在程序执行期间不能更改，所以你不需要担心它的值被修改。\n\n##\
