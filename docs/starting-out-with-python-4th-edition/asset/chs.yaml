  \ `a /= b` | `a = a / b` |\n| `%=` | `c %= 3` | `c = c % 3` |\n\n# 表 4-2 复合赋值运算符\n\
  \n如你所示，复合赋值运算符不需要程序员输入两次变量名。以下语句：\n\n```\ntotal = total + number\n```\n\n可以重写为：\n\
  \n```\ntotal += number\n```\n\n同样，语句\n\n```\nbalance = balance − withdrawal\n```\n\
