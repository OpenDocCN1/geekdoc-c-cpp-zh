  \ `if` 语句来判断当前背景颜色是否为白色。如果背景颜色为白色，代码将将其改为灰色：\n\n```python\nif turtle.bgcolor() ==\
  \ 'white':\n    turtle.fillcolor('gray')\n```\n\n### 确定画笔宽度\n\n当你执行 `turtle.pensize()`\
