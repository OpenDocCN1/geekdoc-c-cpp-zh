  \n# 6.4 异常\n\n\n\n\n\n异常是程序运行时发生的错误，会导致程序突然停止。你可以使用 `try/except` 语句来优雅地处理异常。\n\n\
  异常是程序运行期间发生的错误。在大多数情况下，异常会导致程序突然停止。例如，查看程序 6-20。该程序从用户处获取两个数字，然后将第一个数字除以第二个数字。然而，在程序的示例运行中，发生了异常，因为用户将\
  \ `0` 输入为第二个数字。（除以 `0` 会导致异常，因为这在数学上是不可能的。）\n\n# 程序 6-20 `(division.py)`\n\n```\n\
  \ 1  # 此程序将一个数字除以另一个数字。\n 2\n 3  def main():\n 4      # 获取两个数字。\n 5      num1 =\
  \ int(input('Enter a number: '))\n 6      num2 = int(input('Enter another number:\
  \ '))\n 7\n 8      # 将 num1 除以 num2 并显示结果。\n 9      result = num1 / num2\n10   \
  \   print(num1, 'divided by', num2, 'is', result)\n11\n12  # 调用 main 函数。\n13  main()\n\
  ```\n\n**程序输出**（输入用加粗显示）\n\n```\nEnter a number: 10 \nEnter another number: 0 \n\
  Traceback (most recent call last):\n  File \"C:\\Python\\division.py,\" line 13,\
  \ in <module>\n      main()\n  File \"C:\\Python\\division.py,\" line 9, in main\n\
  \      result = num1 / num2\nZeroDivisionError: integer division or modulo by zero\n\
  ```\n\n示例运行中显示的冗错误信息被称为 `traceback`（回溯轨迹）。`traceback` 提供了导致异常的行号信息。（当异常发生时，程序员会说异常被“抛出”（raised）。）错误信息的最后一行显示了被抛出的异常名称（`ZeroDivisionError`）以及导致异常抛出的简短描述（`integer\
  \ division or modulo by zero`）。\n\n你可以通过仔细编写程序来防止许多异常的抛出。例如，程序 6-21`\n\n```\n 1\
  \  # 此程序将一个数字除以另一个数字。\n 2\n 3  def main():\n 4      # 获取两个数字。\n 5      num1 = int(input('Enter\
  \ a number: '))\n 6      num2 = int(input('Enter another number: '))\n 7\n 8   \
  \   # 如果 num2 不为 0，将 num1 除以 num2\n 9      # 并显示结果。\n10      if num2 != 0:\n11 \
  \         result = num1 / num2\n12          print(num1, 'divided by', num2, 'is',\
  \ result)\n13      else:\n14          print('Cannot divide by zero.')\n15\n16  #\
  \ 调用 main 函数。\n17  main()\n```\n\n**程序输出**（输入用加粗显示）\n\n```\nEnter a number: 10 \n\
  Enter another number: 0 \nCannot divide by zero.\n```\n\n无论你写程序得多么仔细，某些异常是无法避免的。例如，查看程序\
  \ 6-22。该程序计算总工资。它提示用户输入工作小时数和每小时薪资。它通过这两个数字相乘获取用户的总工资并将并将值显示在屏幕上。\n\n# 程序 6-22 `(gross_pay1.py)`\n\
  \n```\n 1  # 此程序计算总工资。\n 2\n 3  def main():\n 4      # 获取工作小时数。\n 5      hours =\
  \ int(input('How many hours did you work? '))\n 6\n 7      # 获取每小时薪资率。\n 8     \
  \ pay_rate = float(input('Enter your hourly pay rate: '))\n 9\n10      # 计算总工资。\n\
  11      gross_pay = hours * pay_rate\n12\n13      # 显示总工资。\n14      print('Gross\
  \ pay: $', format(gross_pay, ',.2f'), sep='')\n15\n16  # 调用 main 函数。\n17  main()\n\
  ```\n\n**程序输出**（输入用加粗显示）\n\n```\nHow many hours did you work? forty \nTraceback\
  \ (most recent call last):\n  File \"C:\\Users\\Tony\\Documents\\Python\\SourceCode\\\
  Chapter 06\\gross_pay1.py\", line 17, in <module>\n    main()\n  File \"C:\\Users\\\
  Tony\\Documents\\Python\\SourceCode\\Chapter 06\\gross_pay1.py\", line 5, in main\n\
  \    hours = int(input('How many hours did you work? '))\nValueError: invalid literal\
  \ for int() with base 10: 'forty'\n```\n\n查看程序的示例运行。发生异常是因为用户在被提示输入工作小时数时，输入了字符串\
  \ `'forty'` 而不是数字 40。由于字符串 `'forty'` 无法转换为整数，`int()` 函数在第 5 行抛出了异常，程序停止了。仔细查看 `traceback`\
  \ 消息的最后一行，你会发现异常名称是 `ValueError`，其描述是 `invalid literal for int() with base 10: 'forty'`。\n\
  \n\n\n\n让我们看看示例运行中发生了什么。第 6 行的语句提示用户输入工作小时数，用户输入了字符串 `'forty'`。由于字符串 `'forty'` 无法转换为整数，`int()`\
  \ 函数抛出了 `ValueError` 异常。结果，程序立即跳出 `try` 块，跳转到第 16 行的 `except ValueError` 子句，并开始执行从第\
  \ 17 行开始的处理块。这在图 6-20 中所示。\n\n![一张说明异常处理的注释代码块](img/fg06_02000.png)\n\n## 图 6-20\
  \ 处理异常\n\n图 6-20 完整替代文本\n\n让我们来看程序 6-24 中的另一个示例。这个程序没有使用异常处理，它从用户处获取文件名，然后显示文件内容。只要用户输入的是存在的文件，程序就能正常工作。然而，如果用户指定的文件不存在，就会抛出异常。这就是示例运行中发生的情况。\n\
