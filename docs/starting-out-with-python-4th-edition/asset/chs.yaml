  \        self.label2.pack(side='top')\n        self.label3.pack(side='top')\n\n\
  \        # 为底部帧创建三个 Label 小组件。\n        self.label4 = tkinter.Label(self.bottom_frame,\
  \ text='Winken')\n        self.label5 = tkinter.Label(self.bottom_frame, text='Blinken')\n\
