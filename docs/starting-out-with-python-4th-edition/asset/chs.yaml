  \ Checkpoint 6.14 编写的程序，用 `for` 循环代替 `while` 循环。\n\n# 6.3 处理记录\n\n### 概念：\n存储在文件中的数据通常被组织成记录（records）。记录是关于某个条目的完整数据集，而字段（field）是记录中的单条数据。\n\
  \n当数据写入文件时，它们通常会被组织成记录和字段。一个 `record`（记录）是描述一个条目的完整数据集，一个 `field`（字段）是记录中的单条数据。例如，假设我们要在文件中存储关于员工的数据。该文件将包含每个员工的记录。每个记录将是字段的集合，例如姓名、ID\
  \ 编号和部门。这在图 6-18 中所示。\n\n![显示记录中字段的图表](img/fg06_01800.png)\n\n# 图 6-18 记录中的字段\n\n\
