  \n![](img/NEWMPLAD.png)\n\n# 第 1 章 计算机与编程简介\n\n## 1.1 引言\n\n思考人们使用计算机的不同方式。在学校，学生使用计算机完成写论文、搜索文章、发送电子邮件和参加课程等任务。在工作中，人们使用计算机分析数据、制作演示、进行业务交易、与客户和同事交流、控制制造设施中的机器以及许多其他事情。在家里，人们使用计算机支付账单、在线购物、与朋友家人交流以及玩游戏。不要忘记手机、平板电脑、智能手机、汽车导航系统等许多设备也是计算机。在日常生活中，计算机的应用几乎是无限的。\n\
  \n计算机可以执行如此广泛的任务是因为它们可以被编程。这意味着计算机的设计不仅仅是为了完成某一项工作，而是为了完成程序告诉它们执行的任何工作。`program`（程序）是计算机执行任务时遵循的一组指令。例如，图\
  \ 1-1 显示了使用 `Microsoft Word` 和 `PowerPoint` 的屏幕，这是两个常用的程序。\n\n![两张截图；左侧是一个文字处理程序，显示格式化为标题和段落的文本上方有一个工具栏；右侧是一个图像编辑程序，显示计算机生成的艺术品上方有一个工具栏。](img/fg01_00100.png)\n\
  \n## 图 1-1 文字处理程序和图像编辑程序\n\n程序通常被称为 `software`（软件）。软件对计算机是至关重要的，因为它控制着计算机做的一切。我们用来让计算机实用的所有软件都是由作为程序员或软件开发人员的人员创建的。`programmer`（程序员）或\
  \ `software developer`（软件开发人员）是指具有设计、创建和测试计算机程序所需的培训和技能的人。计算机编程是一项令人兴奋且回报丰厚的职业。今天，你会在商业、医学、政府、执法、农业、学术、娱乐等许多其他领域发现程序员的工作。\n\
  \n本书将使用 `Python` 语言向你介绍计算机编程的基础概念。`Python` 语言是初学者的良好选择，因为它容易学习，并且可以使用它快速编写程序。Python\
  \ 也是一种强大的语言，在专业软件开发人员中非常受欢迎。事实上，据报道 Python 被 `Google`、`NASA`、`YouTube`、各种游戏公司、纽约证券交易所等使用。\n\
  \n在我们开始探索编程概念之前，你需要了解关于计算机及其工作的基本知识。本章将建立坚实的知识基础，你在学习计算机科学的过程中将不断依赖。首先，我们将讨论构成计算机的物理组件。接下来，我们将查看计算机如何存储数据和执行程序。最后，你将对将用于编写\
  \ `Python` 程序的软件进行快速介绍。\n\n## 1.2 硬件与软件\n\n### 概念\n\n构成计算机的物理设备被称为计算机的硬件（hardware）。运行在计算机上的程序被称为软件（software）。\n\
  \n### 硬件\n\n`hardware`（硬件）一词是指构成计算机的所有物理设备，或 `components`（组件）。计算机不是单一设备，而是一系列共同工作的设备系统。就像交响乐团中的不同乐器一样，计算机中的每个设备都发挥着自己的角色。\n\
  \n如果你买过计算机，你可能见过销售材料中列出的各种组件，如微处理器、内存、磁盘驱动器、视频显示器、显卡等。除非你已经对计算机非常了解，或者至少有一个了解计算机的朋友，否则理解这些不同组件的作用可能是挑战性的。如图\
  \ 1-2\n\n### 图 1-2 计算机系统的典型组件\n\n_fg01_00200\n\n*   中央处理器 (CPU)\n*   主内存\n*   辅助存储设备\n\
  *   输入设备\n*   输出设备\n\n让我们仔细观察这些每一个组件。### CPU\n\n当计算机执行程序告诉它执行的任务时，我们说计算机正在 `running`（运行）或\
  \ `executing`（执行）程序。`central processing unit`，或 `CPU`，是计算机中实际上运行程序的部分。CPU 是计算机最重要的组件，因为没有它，计算机无法运行软件。\n\
  \n在最早的计算机中，CPU 是由真空管和开关等电气机械元件组成的巨大设备。图 1-3 显示这样的设备。照片中的女性正在操作历史性的 ENIAC 计算机。ENIAC\
  \ 被许多认为是世界上第一台可编程电子计算机，它于 1945 年制造，用于为美国军计算弹表。这台机器主要是一个巨大的 CPU，高 8 英尺，长 100 英尺，重\
  \ 30 吨。\n\n![ENIAC 计算机部分的照片。它覆盖了很大一部分墙面，并包含许多仪表、电线和开关。](img/fg01_00300.jpg)\n\n\
  ### 图 1-3 ENIAC 计算机\n\n感谢美国军历史计算机图像\n\n今天，CPU 是被称为 `microprocessors`（微处理器）的小芯片。除了比早期计算机中的旧电机械\
  \ CPU 小得多，微处理器也强大得多。\n\n![戴着手套的手举起一个平的微处理器，大小约一英寸见，包含多行亮点。](img/fg01_00400.jpg)\n\
  \n### 图 1-4 实验室技术人员拿着现代微处理器\n\n### 主内存\n\n\n\n你可以将 `main memory`（主内存）想象为计算机的工作区域。这是计算机在程序运行时存储程序的地方，以及程序正在处理的数据所在。例如，假设你正在使用一个文字处理程序为其中一门课程写论文。在此过程中，文字处理程序和文章都存储在\
  \ `main memory` 中。\n\n主内存通常被称为 `random-access memory`（随机存存储器），或 `RAM`。之所以这样命名，是因为\
  \ `CPU` 能够快速访问存储在 `RAM` 中任何随机位置的数据。`RAM` 通常是 `volatile`（易失性）内存，仅用于程序运行期间临时存储。当计算机关闭时，`RAM`\
  \ 中的内容会被擦除。在你的计算机内部，`RAM` 存储在芯片中，类似于图 1-5 中所示的芯片。\n\n![内存芯片的照片，由八个方形微处理器排列安装在一个矩形板上组成；该板的一个边缘包含许多扁平连接器。](img/fg01_00500.png)\n\
  \n### 图 1-5 内存芯片\n\nGarsya/Shutterstock\n\n### 辅助存储设备\n\n`Secondary storage`（辅助存储）是一种可以长时间保存数据的内存类型，即使计算机没有电源也是如此。程序通常存储在辅助内存中，并在需要时加载到主内存中。重要数据，如文字处理文档、工资数据和库存记录也会保存到辅助存储中。\n\
  \n常见的辅助存储设备类型是 `disk drive`（磁盘驱动器）。传统的磁盘驱动器通过将数据磁编码到旋转的圆形磁盘上来存储数据。将数据存储在固态内存中的 `Solid\
  \ state drives`（固态硬盘）正变得越来越流行。固态硬盘没有移动部件，运行速度比传统的磁盘驱动器更快。大多数计算机的机箱内部都安装某种辅助存储设备，无论是传统的磁盘驱动器还是固态硬盘。此外还有连接到计算机通信端口之一的外部存储设备。外部存储设备可用于创建重要数据的备份，或将数据移动到另一台计算机。\n\
  \n除了外部存储设备外，还创建了许多类型的设备用于复制数据将其移动到其他计算机。例如，`USB drives`（USB 驱动）是插入计算机 `USB`（通用串行总线）端口的小设备，在系统中显示为磁盘驱动器。然而，这些驱动器实际上并不包含磁盘。它们将数据存储在一种名为\
  \ `flash memory`（闪存）的特殊内存中。`USB drives` 也称为 `memory sticks` 和 `flash drives`（闪存盘），廉便宜、可靠，且小到可以装进口袋。\n\
  \n如 `CD`（光盘）和 `DVD`（数字多功能光盘）等光学设备也常用于数据存储。数据不是磁性地记录在光盘上，而是编码为磁盘表面的一系列凹坑。`CD` 和 `DVD`\
  \ 驱动器使用激光检测这些凹坑，从而读取编码的数据。光盘可以存储大量数据，因此，可录制的 `CD` 和 `DVD` 驱动器常用于创建数据的备份副本。\n\n###\
  \ 输入设备\n\n`Input`（输入）是计算机从人类或其他设备收集的任何数据。收集数据并发送到计算机的组件被称为 `input device`（输入设备）。常见的输入设备有键盘、鼠标、触摸屏、扫描仪、麦克风和数字相机。`Disk\
  \ drives` 和光驱器也可以被视为输入设备，因为程序和数据是从它们检索并加载到计算机内存中的。\n\n### 输出设备\n\n`Output`（输出）是计算机为人类或其他设备产生的任何数据。它可能是一份销售报告、一份名单或图像。数据被发送到\
  \ `output device`（输出设备），由它对其进行格式化并呈现。常见的输出设备有视频显示器和打印机。`Disk drives` 也可以视为输出设备，因为系统会将数据发送到它们以进行保存。\n\
  \n### 软件\n\n如果计算机要运行，软件是不可或缺的。从你打开电源开关到关闭系统，计算机所做的一切都受软件的控制。软件通分为两大类：系统软件和应用程序。大多数计算机程序都明确属于这两个类别之一。让我们仔细看看每种。\n\
  \n### 系统软件\n\n控制和管理计算机基本操作的程序统称为 `system software`（系统软件）。系统软件通常包括以下类型的程序：\n\n* \
  \  **操作系统**：`operating system`（操作系统）是计算机上最基础的一组程序。操作系统控制计算机硬件的内部操作，管理所有连接到计算机的设备，允许向存储设备保存和从中检索数据，并允许其他程序在计算机上运行。笔记本电脑和台式计算机常用的操作系统包括\
  \ `Windows`、`macOS` 和 `Linux`。移动设备常用的操作系统包括 `Android` 和 `iOS`。\n*   **实用程序**：`utility\
  \ program`（实用程序）执行增强计算机操作或保护数据的专门任务。实用程序的示例包括病毒扫描程序、文件压缩程序数据备份程序。\n*   **软件开发工具**：`Software\
  \ development tools`（软件开发工具）是程序员用于创建、修改和测试软件的程序。汇编器、编译器和解释器都是属于这一类的程序示例。\n\n###\
  \ 应用程序\n\n使计算机适用于日常任务的程序被称为 `application software`（应用程序）。这些是人们通常在计算机上运行的程序。本章开头的图\
  \ 1-1 显示了常用程序的界面：`Microsoft Word`（文字处理程序）和 `PowerPoint`（演示文程序）。应用程序的其他示例还有电子表格程序、电子邮件程序、浏览器和游戏程序。\n\
  \n### ![](img/ICON_CHECKPT.png) Check\n\n1.  什么是程序？\n2.  什么是硬件？\n3.  列出计算机系统的五个主要组件。\n\
  4.  计算机的哪个部分实际运行程序？\n5.  计算机的哪个部分作为工作区域存储程序及其数据？\n6.  计算机的哪个部分在没有电源的情况下长时间保存数据？\n\
  7.  计算机的哪个部分从人类或其他设备收集数据？\n8.  计算机的哪个部分为人类或其他设备格式化并呈现数据？\n9.  哪些基础程序控制计算机硬件的操作？\n\
  10. 执行专门任务（如病毒扫描程序、文件压缩程序或数据备份程序）的程序称为什么？\n11. 文字处理程序、电子表格程序、电子邮件程序、浏览器和游戏程序属于哪类软件？\n\
  \n## 1.3 计算机如何存储数据\n\n### Concept:\n\n存储在计算机中的所有数据都会转换为 0 和 1 的序列。\n\n计算机的内存被划分为被称为\
  \ `bytes`（字节）的微小存储位置。一个 `byte` 的内存仅足够存储一个字母或一个小数字。为了执行任何有意义的操作，计算机需要大量的字节。今天大多数计算机拥有数百万甚至数十亿字节的内存。\n\
  \n\n\n每个字节被分为八个更小的存储位置，称为位（bits）。`bit` 一词代表 `binary digit`（二进制数字）。计算机科学家通常将位看作是可以开启或关闭的微型开关。然而，位位\
  \ 并不是实际的“开关”，至少在传统意义上不是。在大多数计算机系统中，位是能够带有正电荷或负电荷的微型电子元件。计算机科学家将正电荷视为处于`on`位置的开关，将负电荷视为处于`off`位置的开关。图\
  \ 1-6 展示了计算机科学家可能考虑内存字节的方式：作为一组开关的集合，每个开关都翻转到开启或关闭位置。\n\n![一组八个开关开关的艺术家插图；四个开关向下（即“关闭”），四个开关向上（即“开启”）。](img/fg01_00600.png)\n\
  \n### 图 1-6 将字节看作八个开关\n\n当一个数据存储在字节中时，计算机会将八个位设置为代表该数据的开启/关闭模式。例如，图 1-7 中左侧的模式显示了数字\
  \ 77 是如何存储在字节中的，右侧的模式显示了字母 A 是如何存储在字节中的。我们将在下方解释这些模式是如何确定的。\n\n![两行八个开启/关闭开关的艺术家插图。](img/fg01_00700.png)\n\
  \n### 图 1-7 数字 77 和字母 A 的位模式\n\n图 1-7 完整备用文本\n\n### 存储数字\n\n位可以以非常有限的方式来表示数字。取决于位的开启或关闭，它可以代表两个不同值之一。在计算机系统中，关闭的位代表数字\
  \ 0，开启的位代表数字 1。这与 `binary numbering system`（二进制计数法）完美对应。在二进制计数法（或通常称为 `binary`，二进制）中，所有的数值都写成\
  \ 0 和 1 的序列。这里有一个二进制形式表示的数字示例：\n\n```\n10011101\n```\n\n二进制数中的每个数字都有一个对应的值。从最右侧的数字开始向左移动，位置值为\
  \ 2⁰、2¹、2²、2³ 等，如图 1-8 所示。图 1-9 显示了计算了位置值的相同图表。从最右侧的数字开始向左移动，位置值为 1, 2, 4, 8 等。\n\
  \n![一个显示二进制数字值为 2 的幂的图表。](img/fg01_00800.png)\n\n### 图 1-8 二进制数字的值作为 2 的幂\n\n图 1-8\
  \ 完整备用文本![一个显示二进制数字值的图表。与图 1-8 相同的 零行，从左到右标记为：128, 64, 32, 16, 8, 4, 2, 1。](img/fg01_00900.png)\n\
  \n### 图 1-9 二进制数字的值\n\n要确定一个二进制数的值，你只需要相加所有 1 的位置值。例如，在二进制数 10011101 中，1 的位置值为 1,\
  \ 4, 8, 16 和 128。这在图 1-10 所示。所有这些位置值之和为 157。因此，二进制数 10011101 的值就是 157。\n\n![一个显示如何确定\
  \ 0 0 1 1 0 1 值的图表。这一行的 1 从左到右标记为 128 16, 8, 4。下方是方程 1 + 4 + 8 + 16 + 128 等于 157。](img/fg01_01000.png)\n\
  \n### 图 1-10 确定 10011101 的值\n\n图 1-11))了你可以如何存储在字节中的数字 157。每个 1 由开启位置的位表示，每个 0 由关闭位置的位表示。\n\
  \n![八个开关的艺术家插图，每个都有其位置值，如图 1-9 所示。](img/fg01_01100.png)\n\n### 图 1-11 157 的位模式\n\
  \n图 1-11 完整备用文本\n\n当字节中的所有位都设置为 0（关闭）时，字节的值为 0。当字节中的所有位都设置为 1（开启）时，字节持有它可以存储的最大值。字节中可以存储的最大值为\
  \ 1 + 2 + 4 + 8 + 16 + 32 + 128 = 255。这种限制是因为一个字节中只有八个位。如果需要存储比 255 大的数字怎么办？答案很简单：使用多个字节。例如，假设我们将两个字节放在一起。这给了我们\
  \ 16 个位。这些 16 个位的位置值为 2⁰、2¹、2²、2³ 直到 2⁵。如图 1-12，两个字节可以存储的最大值为 65535。如果你需要存储更大的数字，就需要更多的字节。\n\
  \n![两行八个开关的艺术家插图。16 个开关都是开启的。](img/fg01_01200.png)\n\n### 图 1-12 用于大数字的字节\n\n图 1-12\
  \ 完整备用文本\n\n如果你对这一切感到不知所措，放轻松！在编程时你不需要实际上将数字转换为二进制。了解这个过程正在计算机内部发生将帮助你的学习，长期来看，这些知识将让你成为一个更好的程序员。\n\
  \n### 存储字符\n\n存储在计算机内存中的任何数据都必须以二进制数存储。这包括字母和标点符号等字符。当字符存储在内存中时，首先转换为数字代码。然后以二进制数存储在内存中。\n\
  \n多年，开发了不同的编码方案来表示内存中的字符。从历史上看，这些方案中最重要的是 `ASCII`，它代表 `American Standard Code for\
  \ Information Interchange`（信息交换美国标准）。`ASCII` 是 128 个数字代码，代表英语字母、各种标点符号和其他字符。例如，大写字母\
  \ A 的 ASCII 代码是 65。当你在计算机键盘上输入大写 A 时，数字 65 被存储在内存中（当然，是以二进制形式）。这在图 1-13 所示。\n\n\
  ![显示左侧字母 A 的图表；箭头从它指向数字 65，从那里另一个箭头指向八个开关。开关 2 和 8 是开启的；其余其余关闭。](img/fg01_01300.png)\n\
  \n### 图 1-13 字母 A 以数字 65 存储在内存中\n\n缩写 `ASCII` 读作“askee”。\n\n如果你好奇，大写 B 的 ASCII 代码是\
  \ 66，大写 C 是 67，以此此类推。附录 C 显示了所有的 ASCII 代码以及它们代表的字符。\n\n`ASCII` 字符集于 20 世纪 60 年代初开发并被几乎所有计算机制造商采用。然而，`ASCII`\
  \ 是有限的，因为它只定义了 128 个字符的代码。为了解决这个问题，`Unicode` 字符集于 90 年代初开发。`Unicode` 是一种与 `ASCII`\
  \ 兼容的扩展方案，还可以表示世界上许多语言的字符。今天，`Unicode` 正在迅速成为计算机行业使用的标准字符集。\n\n\n\n之前，你读过关于数字以及它们如何存储在内存中的内容。在阅读该章节时，你可能认为，二进制计数法只能表示从\
  \ `0` 开始的整数。负数和实数（例如 `3.14159`）无法使用我们讨论过的简单二进制计数技术来表示。\n\n计算机能够在内存中存储负数和实数，但为了做到这一点，它们在使用二进制计数系统的同时编码方案。负数使用称为`补码`（two’s\
  \ complement）的技术进行编码，实数则使用`浮点表示法`（floating-point notation）编码。你不需要了解这些编码方案的工作原理，只需要知道它们用于将负数和实数转换为二进制格式即可。\n\
  \n### 其他数据类型\n\n计算机通常被称为数字设备。`数字`一词可以描述任何使用二进制数字的物体。`数字数据`是以二进制格式存储的数据，而`数字设备`是任何与二进制数据工作的设备。在本节中，我们讨论了数字和字符是如何以二进制形式存储的，但计算机也处理许多其他类型的数字数据。\n\
  \n例如，考虑你用数码相机拍摄的照片。这些图像由微小的颜色点组成，称为`像素`（pixels）。（pixel 一词代表`图像元素`。）如图 1-14 所示，图像中的每个像素都被转换为一个表示该像素颜色的数值代码。该数值代码以二进制数的形式存储在内存中。\n\
  \n![数字图像如何以二进制格式存储的插图。一个带有图像的屏幕指向一长串 1 和 0，这些数字 又指向一个相机。](img/fg01_01400.png)\n\n\
  ### 图 1-14 数字图像以二进制格式存储\n\n你在 CD 播放器、iPod 或 MP3 播放器上播放的音乐也是数字的。一首数字歌曲被分成许多片段，称为`样本`（samples）。每个样本都被转换为一个二进制数，并存储在内存中。歌曲被划分的样本越多，播放时听起来就越像原始音乐。\
  \ CD 音质的歌曲每秒被分为 44,000 个样本！\n\n### ![](img/ICON_CHECKPT.png) 检查点\n\n1. 1.12 多大的内存足够存储一个字母或一个较小的数字？\n\
  2. 1.13 这种可以设置为“开启”或“关闭”的微小“开关”称为什么？\n3. 1.14 所有数值在什么计数系统中写为 0 和 1 的序列？\n4. 1.15\
  \ ASCII 的目的是什么？\n5. 1.16 哪种编码方案足够广泛表示世界上许多语言的字符？\n6. 1.17 “数字数据”和“数字设备”这两个术语是什么意思？\n\
  \n## 1.4 程序是如何运行的\n\n### 概念\n\n计算机的 CPU 只能理解用机器语言编写的指令。由于人们发现用机器语言编写整个程序非常困难，因此发明了其他编程语言。\n\
  \n之前，我们提到 CPU 是计算机中最重要的组件，因为它是计算机中运行程序的部分。有时 CPU 被称为“计算机的大脑”，并描述为“智能”。虽然这些是常见的比喻，但你应该理解\
  \ CPU 并不是大脑，它并不智能。CPU 是一个为了执行特定任务而设计的电子设备。特别是，CPU 设计用于执行以下操作：\n\n* 从主内存中读取一段数据\n\
  * 两个数字相加\n* 从一个数字中减去另一个数字\n* 两个数字相乘\n* 将一个数字除以另一个数字\n* 将一段数据从一个内存位置移动到另一个\n* 判断一个值是否等于另一个值\n\
  \n正如你从这个列表所示，CPU 对数据片段执行简单的操作。然而，CPU 本身不会做任何事。它必须被告诉要做什么，这就是程序的目的。程序无非仅仅是一份导致 CPU\
  \ 执行操作的指令列表。\n\n程序中的每条指令都是一个告诉 CPU 执行特定操作的命令。这里有一个可能出现在程序中的指令示例：\n\n```\n10110000\n\
  ```\n\n对你和我来说，这仅仅是一系列 0 和 1。但对 CPU 来说，这是一条执行操作的指令。¹ 它的之所以用 0 和 1 写成，是因为 CPU 只能理解用`机器语言`编写的指令，而机器语言指令始终具有底层的二进制结构。\n\
  \n对于 CPU 能够执行的每种操作都存在对应的机器语言指令。例如，有一个加法指令，有一个从一个数字减去另一个数字的指令，以此此类推。CPU 执行的所有指令集被称为\
  \ CPU 的`指令集`。\n\n### ![](img/ICON_NOTE.png) 备注\n\n今天有几家微处理器公司制造 CPU。一些较著名的微处理器公司是英特尔（Intel）、AMD\
  \ 和摩托罗拉（Motorola）。如果你仔细观察你的电脑，可能会发现一个显示其微处理器标志的标签。\n\n每个品牌的微处理器都有自己独特的指令集，这通常只有同一品牌的微处理器才能理解。例如，英特尔微处理器理解相同的指令，但不理解摩托罗拉微器的指令。\n\
  \n\n\n\n2. **解码**。机器语言指令是一个二进制数，代表一个告诉 CPU 执行操作的命令。在这一步中，CPU 对刚从内存中提取的指令进行解码，以确定它应该执行哪种操作。\n\
  \n3. **执行**。循环的最后一步是执行或完成该操作。\n\n图 1-16 展示了这些步骤。\n\n![展示取指-解码-执行循环的流程图。](img/fg01_01600.png)\n\
  \n### 图 1-16 取指-解码-执行循环\n\n图 1-16 完整替代文本\n\n### 从机器语言到汇编语言\n\n计算机只能执行用机器语言编写的程序。如前所述，一个程序可能包含数千甚至数百万条二进制指令，编写这样的程序将非常枯燥且耗时。用机器语言进行编程也会非常困难，因为在错误的位置放置\
  \ 0 或 1 都会导致错误。\n\n虽然计算机的 CPU 只理解机器语言，但让人们用机器语言编写程序是不切实际的。因此，*汇编语言*在计算机早期被创建出来²，用作机器语言的替代方案。汇编语言不再使用二进制数作为指令，而是使用被称为*助记符*的短单词。例如，在汇编语言中，助记符\
  \ `add` 通常意味着加法，`mul` 通常意味着乘法，而 `mov` 通常意味着将一个值移动到内存中的位置。当程序员使用汇编语言编写程序时，他或她可以编写短的助记符而不是二进制数。\n\
  \n### ![](img/ICON_NOTE.png) 注意：\n\n汇编语言有许多不同的版本。之前提到过，每个品牌的 CPU 都有自己的机器语言指令集。每个品牌的\
  \ CPU 通常也有自己的汇编语言。\n\n然而，汇编语言程序无法由 CPU 执行。CPU 只理解机器语言，因此使用一种名为*汇编器*的特殊程序将汇编语言程序翻译成机器语言程序。这一过程如图\
  \ 1-17 所示。由汇编器创建的机器语言程序就可以由 CPU 执行。\n\n![显示汇编器如何将汇编语言程序翻译成机器语言程序的流程图。](img/fg01_01700.png)\n\
  \n### 图 1-17 汇编器将汇编语言程序翻译成机器语言程序\n\n图 1-17 完整替代文本\n\n### 高级\n\n虽然汇编语言使得无需编写二进制机器语言指令，但它并不是没有困难。汇编语言主要是机器语言的直接替代品，和机器语言一样，它要求你了解很多关于\
  \ CPU 的知识。汇编语言要求即使对于最简单的程序，你也需要编写大量的指令。因为汇编语言在本质上非常接近机器语言，它被称为*低级语言*。\n\n在 20 世纪\
  \ 50 年代，一种被称为*高级语言*的新一代编程语言开始出现。高级语言允许你在不知道 CPU 如何工作且不编写大量低级指令的情况下，创建出强大且复杂的程序。此外，大多数高级语言使用易于理解的单词。例如，如果一个程序员使用\
  \ COBOL（它是 20 世纪 50 年代创建的高级语言之一），他或她将编写以下指令在计算机屏幕上显示 *Hello world* 消息：\n\n```\n\
  DISPLAY \"Hello world\"\n```\n\nPython 是一种现代的高级编程语言，我们将在书中中使用它。在 Python 中，你将通过以下指令显示\
  \ *Hello world* 消息：\n\n```\nprint('Hello world')\n```\n\n在汇编语言中完成相同的操作需要几条指令，并且对\
  \ CPU 如何与计算机输出设备交互有深入的了解。正如你从这个例子看到的，高级语言允许程序员专注于他们想要用程序执行的任务，而不是关注 CPU 如何执行这些程序的细节。\n\
  \n自 20 世纪 50 年代以来，已经创建了数千种高级语言。表 1-1 列出了几种较为人知的语言。\n\n| 语言 | 描述 |\n| --- | --- |\n\
  | Ada | Ada 创建于 20 世纪 70 年代，主要用于美国国防部的应用程序。该语言以埃达·洛夫莱斯伯夫人（Ada Lovelace）命名，她是计算领域具有影响力的历史人物。\
  \ |\n| BASIC | 初级基础符号代码是一种为了初学者设计的创建于 20 世纪 60 年代的语言。现在有许多版本的 BASIC。 |\n| FORTRAN\
  \ | 公式翻译器是第一种高级语言，用于执行复杂的计算。 |\n| COBOL | 面向业务语言创建于 20 世纪 50 年代，用于业务应用程序。 |\n| Pascal\
  \ | 帕斯卡语言创建于 20 世纪 70 年，用于教学编程。以数学家、物理学家和哲学家布莱斯·帕斯卡命名。 |\n| C 和 C++ | C 和 C++（读作\
  \ c 加加）是强大的通用语言。C 语言创建于 1972 年，C++ 创建于 1983 年。 |\n| C# | 读作 c sharp。这种语言由微软在 2000\
  \ 年左右创建。 |\n| Java | Java 创建于 20 世纪 90 年代，用于开发运行在单机上的程序。 |\n| JavaScript | JavaScript\
  \ 创建于 20 世纪 90 年代，用于网页。尽管名字如此，它与 Java 无关。 |\n| Python | 我们在书中使用的 Python 是创建于 20\
  \ 世纪 90 年代的通用语言。它在商业和学术应用中变得流行。 |\n| Ruby | Ruby 是一种创建于 20 世纪 90 年代的通用语言。它日益成为运行在服务器上的流行语言。\
  \ |\n| Visual Basic | Visual Basic（通常称为 VB）是一种微软编程语言，允许程序员快速创建 Windows 应用程序。 |\n\
  \n### 关键字、运算符和语法：概述\n\n每种高级语言都有一套程序员必须用于编写程序的预定义单词。构成高级编程语言的单词被称为关键字或保留字。每个关键字都有特定的含义，不能用于任何其他用途。表\
  \ 1-2 显示了所有的 Python 关键字。\n\n| `and` | `del` | `from` | `None` | `True` |\n| `as`\
  \ | `elif` | `global` | `nonlocal` | `try` |\n| `assert` | `else` | `if` | `not`\
  \ | `while` |\n| `break` | `except` | `import` | `or` | `with` |\n| `class` | `False`\
  \ | `in` | `pass` | `yield` |\n| `continue` | `finally` | `is` | `raise` |  |\n\
  | `def` | `for` | `lambda` | `return` |  |\n\n### 表 1-2 Python 关键字\n\n\n\n\n除了关键字外，编程语言还有\
  \ `operators`（运算符），它们可以对数据执行各种操作。例如，所有的编程语言都有用于算术运算的数学运算符。在 Python 以及大多数其他语言中，`+`\
  \ 号是一个将两个数字相加的运算符。以下代码将 12 和 75 相加：\n\n```\n12 + 75\n```\n\nPython 语言中还有许多其他运算符，随着本文的进行，你将学习其中很多。\n\
  \n除了关键字和运算符外，每种语言都有其自己的 `syntax`（语法），这是一组在编写程序时必须严格遵守的规则。语法规则规定了在程序中关键字、运算符和各种标点符号必须如何使用。当你在学习一门编程语言时，你必须学习该语言特定的\
  \ `syntax` 规则。\n\n你在用高级编程语言编写程序时使用的单个指令称为 `statements`（语句）。一个编程语句由关键字、运算符、标点符号和其他允许的编程元素组成，按正确的顺序排列以执行操作。\n\
  \n### 编译器与解释器\n\n由于 CPU 仅理解机器语言指令，因此用高级语言编写的程序必须翻译成机器语言。根据程序编写时使用的语言，程序员将使用编译器（compiler）或解释器（interpreter）来完成翻译。\n\
  \n`compiler`（编译器）是一个将高级语言程序翻译成独立的机器语言程序的程序。该机器语言程序可以在需要时任何时间被执行。这在 图 1-18 中所示。如图所示，编译和执行是两个不同的过程。\n\
  \n![显示高级程序如何被编译和执行的流程图](img/fg01_01800.png)\n\n### 图 1-18 编译并执行高级程序\n\n图 1-18 完整备用文本\n\
  \nPython 语言使用 `interpreter`（解释器），它是一个既翻译又执行高级语言程序中指令的程序。当解释器读取程序中的每条单独指令时，它将其转换为机器语言指令并立即执行它们。这个过程会对程序中的每条指令重复进行。这一过程在\
  \ 图 1-19 中所示。由于解释器将翻译和执行相结合，它们通常不会创建独立的机器语言程序。\n\n![说明使用解释器执行高级程序的流程图](img/fg01_01900.png)\n\
  \n### 图 1-19 使用解释器执行高级程序\n\n图 1-19 完整备用文本\n\n程序员在高级语言中编写的语句称为 `source code`（源代码），或简称为\
  \ `code`（代码）。通常，程序员在文本编辑器中输入程序代码，然后将代码保存到计算机磁盘上的文件中。接下来，程序员使用编译器将代码翻译成机器语言程序，或使用解释器翻译并执行代码。然而，如果代码包含语法错误，它无法被翻译。`syntax\
  \ error`（语法错误）是一种错误，例如拼写错误的关键字、缺失的标点符号或运算符的使用错误。当这种情况发生时，编译器或解释器会显示一条错误消息，指示程序包含语法错误。程序员修正错误，然后再次尝试翻译程序。\n\
  \n### ![](img/ICON_NOTE.png) 注意：\n\n人类语言也有语法规则。你还记得当你上第一节英语课时，学习了所有关于逗号、撇号、大写字母等规则吗？你当时在学习英语的语法。\n\
  \n尽管人们在说话和写作时经常违反其母语的语法规则，但其他人通常能理解他们的意思。遗憾的是，编译器和解释器没有这种能力。如果程序中只出现一个语法错误，程序也无法编译或执行。当解释器遇到语法错误时，它会停止执行程序。\n\
  \n### ![](img/ICON_CHECKPT.png) 节点\n\n1. 1.18 CPU 仅理解用什么语言编写的指令？\n2. 1.19 程序每次由\
  \ CPU 执行时必须复制到什么种类型的内存中？\n3. 1.20 当 CPU 执行程序中的指令时，它处于什么过程中？\n4. 1.21 什么是汇编语言？\n\
  5. 1.22 哪种编程语言允许你在不知道 CPU 如何工作的情况下创建强大且复杂的程序？\n6. 1.23 每种语言都有一套编写程序时必须严格遵守的规则。这组规则称为什么？\n\
  7. 1.24 将高级语言程序翻译成独立的机器语言程序的程序称为什么？\n8. 1.25 既翻译又执行高级语言程序中指令的程序称为什么？\n9. 1.26 拼写错误的关键字、缺失的标点符号或运算符的使用错误通常会导致哪种错误？\n\
  \n## 1.5 使用 Python\n\n### 概念：\n\nPython 解释器可以运行保在文件中 Python 程序，也可以交互式地执行语句。Python\
  \ 自带一个名为 IDLE 的程序，该程序简化了编写、执行和测试程序的过程。\n\n### 安装 Python\n\n在尝试书中的任何程序或编写你自己的程序之前，你需要确保已安装\
  \ Python 并配置妥当。如果你在计算机实验室工作，这可能已经完成了。如果你正在使用自己的电脑，可以按照 附录 A 中的指令来下载并安装 Python。\n\
  \n\n\n\n```\nPython 3.5.1 (v3.5.1:37a07cee5969, Dec  6 2015, 01:38:48)\n[MSC v.1900\
  \ 32 bit (Intel)] on win32\nType \"help\", \"copyright\", \"credits\" or \"license\"\
  \nfor more information.\n>>>\n```\n\n你看到的 `>>>` 是一个提示符，表示解释器正在等待你输入 Python 语句。让我们尝试一下。在\
  \ Python 中你可以做的最简单的事情之一就是在屏幕上打印一条消息。例如，以下语句会在屏幕上打印消息 `Python programming is fun!`\
  \ ：\n\n```python\nprint('Python programming is fun!')\n```\n\n你可以将其认为是你正在发送给 Python\
  \ 解释器的命令。如果你按照所示的内容精确输入语句，屏幕上就会打印出 `Python programming is fun!` 消息。以下是在解释器提示符处输入该语句的示例：\n\
  \n```python\n>>> print('Python programming is fun!') \n```\n\n输入语句后，你按下 Enter 键，Python\
  \ 解释器就会执行该语句，如下所示：\n\n```python\n>>> print('Python programming is fun!') \nPython\
  \ programming is fun!\n>>>\n```\n\n消息显示后，再次出现 `>>>` 提示符，表示解释器正在等待你输入另一个语句。让我们来看另一个示例。在下面的示例会话中，我们输入两个语句：\n\
  \n```python\n>>> print('To be or not to be') \nTo be or not to be\n>>> print('That\
  \ is the question.') \nThat is the question.\n>>>\n```\n\n如果你在交互模式下错误地输入了语句，解释器将显示错误消息。这在你学习\
  \ Python 时会让交互模式对你非常有用。当你学习 Python 语言的新部分时，可以在交互模式下尝试它们，并获得来自解释器的即时反馈。\n\n在 Windows\
  \ 计算机上退出交互模式下的 Python 解释器，请按 `Ctrl-Z`（同时按下两个键）然后按 Enter。在 Mac、Linux 或 UNIX 计算机上，按\
  \ `Ctrl-D`。\n\n### 注意\n\n在第 2 章中，我们将讨论类似之前所示语句的细节。如果你现在想在交互模式下尝试它们，请确保按照所示内容精确输入。\n\
  \n### 编写 Python 程序并在脚本模式下运行\n\n尽管交互模式对于测试代码有用，但你在交互模式中输入的语句不会保存为程序。它们只是被执行，并将结果显示在屏幕上。如果你想将一组\
  \ Python 语句保存为程序，可以将这些语句保存在文件中。然后，要执行该程序，你需要使用脚本模式下的 Python 解释器。\n\n例如，假设你想编写一个\
  \ Python 程序显示以下三行文本：\n\n```text\nNudge nudge\nWink wink\nKnow what I mean?\n```\n\
  \n要编写该程序，你会使用简单的文本编辑器，如 `Notepad`（所有 Windows 计算机上均安装），来创建一个包含以下语句的文件：\n\n```python\n\
  print('Nudge nudge')\nprint('Wink wink')\nprint('Know what I mean?')\n```\n\n###\
  \ 注意\n\n可以使用文字处理器来创建 Python 程序，但你必须确保将程序保存为纯文本文件。否则，Python 解释器将无法读取其内容。\n\n当你保存\
  \ Python 程序时，给它起一个以 `.py` 扩展结尾的名字，这将其标识为 Python 程序。例如，你可能会将之前所示的程序命名为 `test.py`。要运行该程序，你需要进入文件所在的目录，并在操作系统命令行中输入以下命令：\n\
  \n```bash\npython test.py\n```\n\n这会启动脚本模式下的 Python 解释器，并导致它执行 `test.py` 文件中的语句。当程序执行完毕后，Python\
  \ 解释器将退出。\n\n### IDLE 编程环境\n\n之前的章节描述了如何在操作系统命令行中使用交互模式或脚本模式启动 Python 解释器。作为替代方案，你可以使用集成开发环境，它是一个提供编写、执行和测试程序所需所有工具的单一程序。\n\
  \n最新版本的 Python 包含一个名为 `IDLE` 的程序，它在安装 Python 语言时会自动安装。（IDLE 代表 **I**ntegrated **D**eve**L**opment\
  \ **E**nvironment，即集成开发环境。）当你运行 `IDLE` 时，会显示如图 1-20 所示的窗口。注意 IDLE 窗口中出现了 `>>>` 提示符，表示解释器正在交互模式下运行。你可以在此提示符处输入\
  \ Python 语句，并在 IDLE 窗口中看到它们被执行。\n\n![标题为 Python 3.5.1 Shell 的窗口中的 IDLE 截图。窗口中，某些信息文本下方是一个由三个向右的括号（箭头）组成的提示符。](img/fg01_2000.png)\n\
  \n### 1-20 IDLE\n\nIDLE 还具有一个内置文本编辑器，专门设计用于你编写程序。例如，IDLE 会高亮代码，使关键字和其他部分以不同的颜色显示。这有助于更容易阅读程序。在\
  \ IDLE 中，你可以编写、保存并执行程序。附录 B \n\n## 复习题\n\n### 单选题\n\n1. A(n) 是计算机遵循的一组指令。\n   1.\
  \ 编译器\n   2. 程序\n   3. 解释器\n   4. 编程语言\n\n2. 计算机由物理设备组成。\n   1. 硬件\n   2. 软件\n \
  \  3. 操作系统\n   4. 工具\n\n3. 运行程序的计算机部分被称为。\n   1. RAM\n   2. 次级存储\n   3. 主内存\n  \
  \ 4. CPU\n\n4. 现在的 CPU 被称为。\n   1. ENIAC\n   2. 微处理器\n   3. 内存芯片\n   4. 操作系统\n\n\
