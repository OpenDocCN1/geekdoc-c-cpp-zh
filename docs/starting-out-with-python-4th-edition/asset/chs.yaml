  \ 8      name = input('Enter your name: ')\n9\n10  # Call the main function.\n11\
  \  main()\n```\n\n此程序有两个函数：`main` 和 `get_name`。在第 8 行，`name` 变量被赋值了用户输入的值。该语句位于\
  \ `get_name` 函数内部，因此 `name` 变量是该函数的局部变量。这意味着 `name` 变量无法被 `get_name` 函数外部的语句访问。\n\
  \n`main` 函数在第 3 行调用了 `get_name` 函数。然后，第 4 行的语句尝试访问 `name` 变量。这会导致错误，因为 `name` 变量是\
  \ `get_name` 函数的局部变量，`main` 函数中的语句无法访问它。\n\n（注：提示中的用户文本似乎有重复或混乱，我已根据提供的文本块进行了逻辑清理以确保一致性。）\n\
  \n\n\n\n\n在本章的早期，你已经学习了变量的作用域是程序中可以访问该变量的部分。变量仅对该变量作用域内的语句可见。参数变量的作用域是使用该参数的函数。函数内部的所有语句都可以访问该参数变量，但函数外部的任何语句都无法访问。\n\
  \n# 传递多个参数\n\n通常，编写可以接受多个参数的函数是非常有用的。程序 5-8 显示了一个名为 `show_sum` 的函数，它接受两个参数。该函数将这两个参数相加并显示它们的和。\n\
  \n# 程序 5-8 `(multiple_args.py)`\n\n```python\n 1  # 这个程序演示了一个接受\n 2  #两个参数的函数。\n\
  \ 3\n 4  def main():\n 5      print('The sum of 12 and 45 is')\n 6      show_sum(12,\
  \ 45)\n 7\n 8  # 函数 show_sum 接受两个参数\n 9  #并显示它们的和。\n10  def show_sum(num1, num2):\n\
  11      result = num1 + num2\n12      print(result)\n13\n14  # 调用 main 函数。\n15 \
  \ main()\n```\n\n### 程序输出\n\n```\nThe sum of 12 and 45 is\n57\n```\n\n注意到两个参数变量名\
  \ `num1` 和 `num2` 出现在 `show_sum` 函数头部的括号内。这通常被称为*参数列表*。另外，注意逗号（`,`）分隔了变量名。\n\n第\
  \ 6 行的语句调用了 `show_sum` 函数并传递了两个参数：`12` 和 `45`。这些参数*按位置*传递给函数中对应的参数变量。换句话说，第一个参数被传递给第一个参数变量，第二个参数被传递给第二个参数变量。因此，该语句导致\
  \ `12` 被赋值给参数 `num1`，而 `45` 被赋值给参数 `num2`，如图 5-16 所示。\n\n![显示如何将两个参数传递给两个参数的代码序列](img/fg05_01600.png)\n\
  \n# 图 5-16 传递给两个参数的两个参数\n\n图 5-16 完整文本\n\n假设我们反转函数调用列表中参数的顺序，如下所示：\n\n```python\n\
  show_sum(45, 12)\n```\n\n这将导致 `45` 被传递给参数 `num1`，而 `12` 被传递给参数 `num2`。下面的代码显示了另一个例子。这一次，我们将变量作为参数传递。\n\
  \n```python\nvalue1 = 2\nvalue2 = 3\nshow_sum(value1, value2)\n```\n\n当 `show_sum`\
  \ 函数执行此代码的结果时，`num1` 参数将被赋值为 `2`，`num2` 参数将被赋值为 `3`。\n\n程序 5-9 显示了另一个例子。该程序向函数传递了两个字符串作为参数。\n\
  \n# 程序 5-9 `(string_args.py)`\n\n```python\n 1  # 这个程序演示了向函数传递\n 2  #两个字符串参数。\n\
  \ 3\n 4  def main():\n 5      first_name = input('Enter your first name: ')\n 6\
  \      last_name = input('Enter your last name: ')\n 7      print('Your name reversed\
  \ is')\n 8      reverse_name(first_name, last_name)\n 9\n10  def reverse_name(first,\
  \ last):\n11      print(last, first)\n12\n13  # 调用 main 函数。\n14  main()\n```\n\n\
  ### 程序输出（用加粗显示输入）\n\n```\nEnter your first name: Matt \nEnter your last name: Hoyle\
  \ \nYour name reversed is\nHoyle Matt\n```\n\n# 修改参数更改\n\n在 Python 中，当将参数传递给函数时，函数参数变量将引用参数的值。然而，对参数变量所做的任何更改都不会影响该参数。为了演示这一点，请看程序\
  \ 5-10。\n\n# 程序 5-10 `(change_me.py)`\n\n```python\n 1  # 这个程序演示了当修改\n 2  参数时会发生什么。\n\
  \ 3\n 4  def main():\n 5      value = 99\n 6      print('The value is', value)\n\
  \ 7      change_me(value)\n 8\n 9  def change_me(arg):\n10      arg = 0\n11    \
  \  print('I changed arg to', arg)\n```\n\n### 程序输出\n\n```\nThe value is 99\nI changed\
  \ arg to 0\n```\n\n`main` 函数在第 5 行创建了一个名为 `value` 的局部变量。它在第 7 行调用 `change_me(value)`。这意味着在\
  \ `change_me` 函数中，参数 `arg` 将引用值 `99`。\n\n在 `change_me` 函数内部，第 10 行将 `arg` 赋值为 `0`。第\
  \ 13 行的语句显示 `'The value is'`。这证明了尽管 `arg` 被更改了，`main` 中的参数 `value` 也没有被修改。如图 5-16\
  \ 所示。\n\n控制权随后返回 `main` 函数。下一条执行的语句在第 8 行。该语句显示 `'Back in main'`。\n\n在 Python 中使用的参数传递形式（即函数无法更改传递给它的参数的值）通常被称为*按值传递*（pass\
  \ by value）。这是函数与另一个函数通信的一种。然而，这种通信是单向的。调用函数可以与被调用函数通信，但被调用函数无法使用参数与调用函数通信。在本章晚些时候，你将学习如何编写一个通过返回返回值与调用它的部分通信的函数。\n\
  \n# 关键字参数\n\n程序 5-8 和 5-9 演示了如何按位置将参数传递给函数的参数变量。大多数编程语言通过这种方式匹配函数参数和参数。除了这种传统的参数传递形式，Python\
  \ 语言还允许按照以下格式编写参数，以指定将参数传递给哪个参数变量：\n\n```\nparameter_name=value\n```\n\n在此格式中，*`parameter_name`*\
  \ 是参数的名称，`value` 是传递给该参数的值。按照此语法编写的参数被称为*关键字参数*。\n\n\n\n\n\n程序 5-11 演示了关键字参数。该程序使用一个名为\
  \ `show_interest` 的函数，显示银行账户在若干个期期内获得的单利金额。该函数接受参数 `principal`（账户本金）、`rate`（每个周期的利率）和\
  \ `periods`（期数数量）。当在第 7 行调用该函数时，这些参数是作为关键字参数传递的。\n\n# 程序 5-11 `(keyword_args.py)`\n\
  \n```\n 1  # 此程序演示了关键字参数。\n 2\n 3  def main():\n 4      # 显示单利金额，使用 0.01 作为\n 5\
  \      # 每个周期的利率，10 作为期数，\n 6      # 以及 $10,000 作为本金。\n 7      show_interest(rate=0.01,\
  \ periods=10, principal=10000.0)\n 8\n 9  # show_interest 函数显示给定本金、\n110  # 每个周期的利率以及期数\n\
  \ 11  # 对应的单利金额。\n 12\n 13  def show_interest(principal, rate, periods):\n 14  \
  \    interest = principal * rate * periods\n 15      print('The simple interest\
  \ will be $', \n 16            format(interest, ',.2f'), \n 17            sep='')\n\
  \ 18\n 19  # 调用 main 函数。\n 20  main()\n```\n\n### 程序输出\n\n```\nThe simple interest\
  \ will be $1000.00.\n```\n\n注意第 7 行，关键字参数的顺序与第 13 行函数头中的参数顺序不一致。由于关键字参数指定了参数应该传递给哪个参数，因此它们在函数调用中的位置并不重要。\n\
  \n程序 5-12 显示了另一个示例。这是程序 5-9 中 `string_args` 程序的变体。此版本使用关键字参数来调用 `reverse_name` 函数。\n\
  \n# 程序 5-12 `(keyword_string_args.py)`\n\n```\n 1  # 此程序演示了将两个字符串作为\n 2  # 关键字参数传递给函数。\n\
  \ 3\n 4  def main():\n 5      first_name = input('Enter your first name: ')\n 6\
  \      last_name = input('Enter your last name: ')\n 7      print('Your name reversed\
  \ is')\n 8      reverse_name(last=last_name, first=first_name)\n 9\n110  def reverse_name(first,\
  \ last):\n 11      print(last, first)\n 12\n 13  # 调用 main 函数。\n 14  main()\n```\n\
  \n## 程序输出（输入部分已加粗显示）\n\n```\nEnter your first name: Matt \nEnter your last name:\
  \ Hoyle \nYour name reversed is\nHoyle Matt\n```\n\n# 混合使用关键字参数与位置参数\n\n在函数调用中可以混合使用位置参数和关键字参数，但位置参数必须在前，随后是关键字参数。否则，将发生错误。以下是一个我们如何同时使用位置参数和关键字参数调用程序\
  \ 5-10 中 `show_interest` 函数的示例：\n\n```\nshow_interest(10000.0, rate=0.01, periods=10)\n\
  ```\n\n在该语句中，第一个参数 `10000.0` 通过其位置传递给 `principal` 参数。第二个和第三个参数作为关键字参数传递。然而，接下来的函数调用会导致错误，因为在关键字参数之后跟着一个非关键字参数：\n\
  \n```\n# 这会导致错误！\nshow_interest(1000.0, rate=0.01, 10)\n```\n\n### 检查点\n\n1. 5.13\
  \ 传递到被调用函数中的数据部分是什么？\n2. 5.14 在被调用函数中接收数据的变量是什么？\n3. 5.15 参数变量的作用域是什么？\n4. 5.16\
  \ 当参数发生变化时，这会影响传入的参数吗？\n5. 5.17 下述语句中哪一个调用了函数？哪一个传递了参数？\n    - `show_interest(10000.0,\
  \ rate=0.01, periods=10)`\n    - `show_interest(1000.0, rate=0.01, 10)`\n    - `reverse_name(last=last_name,\
  \ first=first_name)`\n\n# 5.6 全局变量与全局常量\n\n## 概念：全局变量对所有函数可见\n\n你已经学习过，当变量在任何函数之外创建时，它是全局的。全局变量可以被任何地方访问。例如，查看程序\
  \ 5-11。\n\n# 程序 5-13 `(global.py)`\n\n```\n 1  # 此程序演示了全局变量。\n 2\n 3  count = 0\n\
  \ 4\n 5  def increment():\n 6      global count\n 7      count = count + 1\n 8 \
  \     print('The count is now', count)\n 9\n10  # 调用 increment 函数。\n11  increment()\n\
  12  increment()\n```\n\n### 程序输出\n\n```\nThe count is now 1\nThe count is now 2\n\
  The count is now 3\n```\n\n第 2 行的赋值语句创建名为 `count` 的变量。因为它在任何函数之外，所以它是全局的。当 `increment`\
  \ 函数执行时，第 7 行打印了该值。如果你想给全局变量赋值，必须声明 `global`，如程序 5-14 所示。\n\n# 程序 5-14 `(global2.py)`\n\
  \n```\n 1  # 此程序演示了修改全局变量。\n 2\n 3  count = 0\n 4\n 5  def increment():\n 6    \
  \  global count\n 7      count = count + 1\n 8      print('The count is now', count)\n\
  \ 9\n10  # 调用 increment 函数。\n11  increment()\n12  increment()\n13  increment()\n\
  ```\n\n\n\n\n\n虽然 Python 语言并不允许你创建真正的全局常量，但你可以使用全局变量来模拟它们。如果你没有在函数内部使用 `global`\
  \ 关键字声明全局变量，那么你就无法在该函数内部更改该变量的赋值。接下来的*焦点聚焦*部分将演示如何在 Python 中使用全局变量来模拟全局常量。\n\n#\
  \ ![](img/ICON_CHECKPT.png) 知识点检查\n\n1. 5.18 全局变量的作用范围是什么？\n2. 5.19 给出一个你不应该在程序中使用全局变量的合理理由。\n\
  3. 5.20 什么是全局常量？在程序中使用全局常量允许吗？\n\n# 5.7 返回值函数简介：生成随机数\n\n### 概念：\n\n返回值函数是指将值返回给调用它的程序部分的函数。Python\
  \ 以及大多数其他编程语言一样，提供了一个预写函数库，用于执行常见的任务。这些库通常包含一个用于生成随机数的函数。\n\n在本章的第一部分中，你学习了空函数（void\
  \ functions）。空函数是存在于程序中用于执行特定任务的语句组。当你需要函数执行其任务时，就会调用该函数。这会导致函数内部的语句执行。当函数执行完毕，程序的控制权将返回到紧接函数调用之后的语句。\n\
  \n*返回值函数*是一种特殊的函数类型。它在以下方面与空函数相似：\n\n* 它是一组执行特定任务的语句。\n* 当你想执行该函数时，就会调用它。\n\n然而，当一个返回值函数执行完毕后，它会将一个值返回给调用它的程序部分。从函数返回的值可以像任何其他值一样使用：它可以被赋值给变量、显示在屏幕上、在数学表达式中使用（如果它是数字）等等。\n\
  \n# 标准库函数与 `import` 语句\n\nPython 与大多数编程语言一样，都带有一个已经为你写好的函数*标准库*。这些函数被称为*库函数*（library\
  \ functions），它们让程序员的工作变得更容易，因为它们执行了许多程序员经常需要执行的任务。事实上，你已经使用过几个 Python 库函数。你使用过的函数包括\
  \ `print`、`input` 和 `range`。Python 还有许多其他库函数。虽然我们不会在书中涵盖所有的函数，但我们将讨论执行基础操作的库函数。\n\
  \nPython 的某些库函数是内置在 Python 解释器中的。如果你想在程序中使用这些内置函数之一，只需调用该函数即可。你已经学过的 `print`、`input`、`range`\
  \ 以及其他函数就是此类。然而，标准库中的许多函数存储在被称为*模块*（modules）的文件中。这些模块在安装 Python 时会被复制到你的计算机，有助于组织标准库函数。例如，执行数学操作的函数存储存储在一个模块中，处理文件的函数存储在另一个模块中，以此此类推。\n\
  \n为了调用存储在模块中的函数，你必须在程序的顶部写一个 `import` 语句。`import` 语句告诉解释器包含该函数的模块名称。例如，Python 的标准模块之一命名为\
  \ `math`。`math` 模块包含了各种处理浮点数的数学函数。如果你想在程序中使用 `math` 模块的任何函数，你应该在程序的顶部写下以下 `import`\
  \ 语句：\n\n```python\nimport math\n```\n\n这条语句会导致解释器将 `math` 模块的内容加载到内存中，并使 `math`\
  \ 模块中的所有函数对程序可用。\n\n由于你看不到库函数的内部工作原理，许多程序员将其视为*黑盒*（black boxes）。“黑盒”一词用于描述任何接受输入、使用输入执行某些操作（不可见）并产生输出的机制。图\
  \ 5-19 释了这一观点。\n\n![一个将库函数视为黑盒的流程图。箭头从左侧的“输入”指向中间深色的方框，标记为“库函数”。箭头从该框指向右侧的“输出”。](img/fg05_01900.png)\n\
  \n# 图 5-19 被视为黑盒的库函数\n\n我们将首先通过观察生成随机数的标准库函数以及用这些函数编写的一些有趣程序，演示返回值函数是如何工作的。然后，你将学习编写自己的返回值函数以及如何创建自己的模块。本章的最后一部分将回到库函数主题，并查看\
  \ Python 标准库中的其他几个有用函数。\n\n# 生成随机数\n\n随机数对于许多不同的编程任务都很有用。以下只是几个例子：\n\n* 随机数常用于游戏。例如，让玩家掷骰子的电脑游戏使用随机数来表示骰子的值。显示从洗过的牌组中抽牌的程序使用随机数来表示牌的牌值。\n\
  * 随机数在模拟中很有用。在某些模拟中，计算机必须随机决定人、动物或其他生物体的行为。可以构建公式，其中使用随机数来确定各种动作和事件。\n* 随机数在必须随机选择数据的统计程序中很有用。\n\
  * 随机数常用于计算机安全中的敏感数据加密。\n\nPython 提供几个处理随机数的库函数。这些函数存储在标准库中名为 `random` 的模块中。要使用这些函数之一，你首先需要在程序的顶部写下这条\
  \ `import` 语句：\n\n```python\nimport random\n```\n\n这条语句导致解释器将 `random` 模块的内容加载到内存中。这使得\
  \ `random` 模块中的所有函数对你的程序可用。[³]\n\n我们将讨论的第一个随机数函数是 `randint`。由于 `randint` 函数位于 `random`\
  \ 模块中，我们需要在程序中使用*点符号表示法*（dot notation）来引用它。在点符号表示法中，函数的名称是 `random.randint`。点（句号）的左侧是模块名称，点的右侧是函数名称。\n\
  \n以下语句展示了你如何调用 `randint` 函数的示例：\n\n```python\nnumber = random.randint(1, 100)\n\
  ```\n\n语句中的 `random.randint(1, 100)` 部分是对 `randint` 函数的调用。注意圆括号内有两个参数：1 和 100。这些参数告诉函数给出\
  \ 1 到 100 范围内的整数随机数。（1 和 100 包含在范围内。）图 5-20 释了语句的这部分。\n\n![一段带有注释的代码行，显示了调用随机函数的语句。](img/fg05_02000.png)\n\
  \n# 图 5-20 调用随机函数的语句\n\n图 5-20 完整替代文本\n\n\n\n\n\n注意 `randint` 函数的调用出现在 `=` 运算符的右侧。当调用该函数时，它会生成一个\
  \ 1 到 100 之间的随机数，然后返回该数字。返回的数字将被赋值给变量 `number`，如图 5-21 所示。\n\n![行带有注释的代码，显示随机函数如何返回一个。](img/fg05_02100.png)\n\
  \n## 图 5-21 `random` 函数返回一个值\n\n图 5-21 完整替代文本\n\n程序 5-16 显示了一个使用 `randint` 函数的完整程序。第\
  \ 2 行的语句生成一个 1 到 10 之间的随机数，并将其赋值给变量 `number`。（程序输出显示生成了数字 7，但这个值是随机的。如果这是一个实际程序，它可以显示\
  \ 1 到 10 之间的任何数字。）\n\n### 程序 5-16 `(random_numbers.py)`\n\n```python\n 1  # 此程序显示一个随机数\n\
  \ 2  # 范围在 1 到 10 之间。\n 3  import random\n 4\n 5  def main():\n 6      # 获取一个随机数。\n\
  \ 7      number = random.randint(1, 10)\n 8      # 显示该数字。\n 9      print('The number\
  \ is', number)\n10\n11  # 调用 main 函数。\n12  main()\n```\n\n**程序输出**\n\n```\nThe number\
  \ is 7\n```\n\n程序 5-17 显示了另一个示例。该程序使用了一个循环五次的 `for` 循环。在循环内部，第 8 行的语句调用 `randint`\
  \ 函数生成一个 1 到 100 之间的随机数。### 程序 5-17 `(random_numbers.py)`\n\n```python\n 1  # 此程序显示五个随机数\n\
  \ 2  # 范围在 1 到 100 之间。\n 3  import random\n 4\n 5  def main():\n 6      for count\
  \ in range(5):\n 7          # 获取一个随机数。\n 8          number = random.randint(1, 100)\n\
  \ 9          # 显示该数字。\n10          print(number)\n11\n12  # 调用 main 函数。\n13  main()\n\
  ```\n\n**程序输出**\n\n```\n89\n7\n16\n41\n12\n```\n\n程序 5-16 和 5-17 都调用了 `randint`\
  \ 函数并将其返回值赋值给变量 `number`。如果你只想显示一个随机数，没有必要将随机数赋值给变量。你可以直接将 `random` 函数的返回值发送给 `print`\
  \ 函数，如下：\n\n```python\nprint(random.randint(1, 10))\n```\n\n执行此语句时，调用了 `randint`\
  \ 函数。函数生成一个 1 到 10 之间的随机数。该值被返回并发送到 `print` 函数。结果将显示一个 1 到 10 之间的随机数。图 5-22 说明了这一点。\n\
  \n![行带有注释的代码，显示一个随机数。](img/fg05_02200.png)\n\n## 图 5-22 显示随机数\n\n图 5-22 完整替代文本\n\
  \n程序 5-18 显示了你可以如何简化程序 5-17。该程序也显示了五个随机数，但该程序没有使用变量来保存它们。`randint` 函数的返回值直接发送到第\
  \ 7 行的 `print` 函数。\n\n### 程序 5-18 `(random_numbers3.py)`\n\n```python\n 1  # 此程序显示五个随机数\n\
  \ 2  # 范围在 1 到 100 之间。\n 3  import random\n 4\n 5  def main():\n 6      for count\
  \ in range(5):\n 7          print(random.randint(1, 100))\n 8\n 9  # 调用 main 函数。\n\
  10  main()\n```\n\n**程序输出**\n\n```\n89\n7\n16\n41\n12\n```\n\n## 在交互模式下尝试随机数\n\n\
  为了感受 `randint` 函数处理不同参数的工作方式，你可能想在交互模式下进行尝试。为了演示，请看下面的交互会话。（我们增加了数字以便参考。）\n\n```\n\
  >>> import random\n>>> random.randint(1, 10)\n5\n>>> random.randint(1, 100)\n98\n\
  >>> random.randint(100, 200)\n181\n>>>\n```\n\n让我们仔细查看交互会话中的每一行：\n\n* 第 1 行的语句导入了\
  \ `random` 模块。（在交互模式下必须编写正确的 `import` 语句。）\n* 第 2 行的语句调用了 `randint` 函数，将 `1` 和 `10`\
  \ 作为参数。结果是函数返回一个 1 到 10 之间的随机数。返回的数字在第 3 行显示。\n* 第 4 行的语句调用了 `randint` 函数，将 `1`\
  \ 和 `100` 作为参数。结果是函数返回一个 1 到 100 之间的随机数。返回的数字在第 5 行显示。\n* 第 6 行的语句调用了 `randint`\
  \ 函数，将 `100` 和 `200` 作为参数。结果是函数返回一个 100 到 200 之间的随机数。返回的数字在第 7 行显示。\n\n`randint`\
  \ 函数返回一个整数，所以你可以在数学表达式中使用它，如文所示：\n\n```python\nx = random.randint(1, 10) * 2\n```\n\
