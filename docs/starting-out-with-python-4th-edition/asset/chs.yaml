  \ 指定了 `show_choice` 是回调函数。当 `Radiobutton` 被选中时，将执行 `show_choice`。\n\n## 复选框\n\n\
  选框显示为一个小方框，旁边带有一个标签。图 13-24 显示的窗口有三个选框。\n\n和单选按钮一样，选框可以被选中或取消选中。当选框被选中时，它的方框内会出现一个小勾号。虽然选框通常成组显示，但它们并不是用于进行排他性选择。相反，用户允许选择组中显示的任何或所有选框。\n\
  \n程序 13-13 演示了如何创建和使用选框。使用 `tkinter` 模块的 `Checkbutton` 类来创建 `Checkbutton` 组件。与单选按钮类似，你可以将\
  \ `IntVar` 对象配合 `Checkbutton` 使用。但与单选按钮不同，每个 `Checkbutton` 都关联一个不同的 `IntVar` 对象。当选框被选中时，其关联的\
  \ `IntVar` 对象将持有值 1。当选框未被选中时，其关联的 `IntVar` 对象将持有值 0。\n\n\n\n\n\n```python\n 1  #\
  \ 此程序演示了一组 Checkbutton 控件。\nimport tkinter\nimport tkinter.messagebox\n\nclass MyGUI:\n\
