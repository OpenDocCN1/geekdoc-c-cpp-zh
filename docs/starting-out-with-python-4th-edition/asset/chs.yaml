  \n\n你编写的大多数程序都需要读取输入，然后对该输入执行操作。在本节中，我们将讨论一种基础的输入操作：读取在键盘上输入的数据。当程序从键盘读取数据时，通常它会将这些数据存储在变量中，以便程序后续使用。\n\
  \n在本书中，我们使用 Python 内置的 `input` 函数从键盘读取输入。`input` 函数读取从键盘输入的一段数据，并将该数据作为字符串返回给程序。你通常在遵循以下通用格式的赋值语句中使用\
  \ `input` 函数：\n\n```\nvariable = input(prompt)\n```\n\n在通用格式中，`prompt` 是显示在屏幕上的字符串。该字符串的目的是指示用户输入一个值；`variable`\
  \ 是变量名，用于引用在键盘上输入的数据。以下是一个使用 `input` 函数从键盘读取数据的语句示例：\n\n```\nname = input('What\
  \ is your name? ')\n```\n\n当该语句执行时，会发生以下情况：\n\n* 字符串 `'What is your name? '` 显示在屏幕上。\n\
  * 程序暂停并等待用户在键盘上输入内容，然后按下 Enter 键。\n* 当按下 Enter 键时，输入的数据将作为字符串返回并赋值给 `name` 变量。\n\
  \n为了演示，请看下面的交互会：\n\n```\n>>> name = input('What is your name? ') \nWhat is your\
  \ name?  Holly  \n>>> print(name) \nHolly\n>>>\n```\n\n当输入第一个语句时，解释器显示了提示 `'What\
  \ is your name? '` 并等待用户输入数据。用户输入了 `Holly` 并按下 Enter 键。结果是字符串 `'Holly'` 被赋值给变量 `name`。当输入第二个语句时，解释器显示了\
  \ `name` 变量引用的值。\n\n程序 2-12 显示了一个完整的程序，它使用 `input` 函数从键盘读取两个字符串作为输入。\n\n# 程序 2-12\
  \ `(string_input.py)`\n\n```\n 1  # 获取用户的名。\n 2  first_name = input('Enter your\
  \ first name: ')\n 3\n 4  # 获取用户的姓。\n 5  last_name = input('Enter your last name:\
  \ ')\n 6\n 7  # 向用户打印问候语。\n 8  print('Hello', first_name, last_name)\n```\n\n**程序输出**（输入部分用加粗显示）\n\
  \n```\nEnter your first name: Vinny \nEnter your last name: Brown \nHello Vinny\
  \ Brown\n```\n\n仔细观察第 2 行中我们作为提示使用的字符串：\n\n```\n'Enter your first name: '\n```\n\
  \n注意字符串中引号内的最后一个字符是一个空格。对于第 5 行中作为提示的后续字符串也是如此：\n\n```\n'Enter your last name: '\n\
  ```\n\n我们在每个字符串的末尾放置了一个空格字符，因为 `input` 函数不会在提示后自动显示空格。当用户开始输入字符时，它们会立即紧接在提示之后出现在屏幕上。将提示的最后一个字符设置为空格，可以在视觉上将提示与用户的输入隔离开来。\n\
  \n### 使用 `input` 函数读取数字\n\n`input` 函数始终将用户的输入返回为字符串，即使用户输入的是数字数据。例如，假设你调用了 `input`\
  \ 函数，输入数字 72 并按下 Enter 键。`input` 函数返回的值是字符串 `'72'`。如果你想在数学运算中使用该值，就会就会问题。数学运算只能对数值进行，不能对字符串进行。\n\
  \n幸运的是，Python 有内置函数可以让你将字符串转换为数值类型。表 2-2 总结了其中两个函数。\n\n| 函数 | 说明 |\n| --- | ---\
  \ |\n| `int(item)` | 你向 `int()` 函数传递一个参数，它返回将参数转换为 `int` 的值。 |\n| `float(item)`\
  \ | 你向 `float()` 函数传递一个参数，它返回将参数转换为 `float` 的值。 |\n\n# 表 2-2 数据转换函数\n\n例如，假设你正在编写一个薪资程序，并想要获取用户的工作小时数。看下面的代码：\n\
  \n```\nstring_value = input('How many hours did you work? ')\nhours = int(string_value)\n\
  ```\n\n第一个语句从用户处获取小时数并将该值作为字符串赋值给 `string_value`。第二个语句调用 `int()`，将 `string_value`\
  \ 转换为 `int` 并赋值给 `hours`。这个示例效率很低，因为它创建了两个变量。下面的代码显示了更好的方法：\n\n```\nstring_value\
  \ = input('How many hours did you work? ')\nhours = int(string_value)\n```\n\n（注：原文文本中存在一些重复的句子，翻译已在保持内容的基础上进行了逻辑清理。）\n\
  \n\n\n\n`int()` 和 `float()` 函数只有在被转换的项目包含有效的数值时才能起作用。如果参数无法转换为指定的数据类型，就会发生一种被称为“异常（exception）”的错误。`exception`\
  \ 是程序运行过程中发生的意外错误，如果妥妥善处理该错误，会导致程序停止。例如，查看下面的交互模式会话：\n\n```\n>>> age = int(input('What\
  \ is your age? ')) \nWhat is your age?  xyz  \nTraceback (most recent call):\n \
  \   File \"<pyshell#81>\", line 1, in <module>\n         age = int(input('What is\
  \ your age? '))\nValueError: invalid literal for int() with base 10: 'xyz'\n>>>\n\
  ```\n\n### ![](img/ICON_NOTE.png) 注意事项：\n\n在本节中，我们提到了“用户（user）”。`user` 简单是指任何使用程序并为其提供输入的假设人物。`user`\
  \ 有时被称为“终端用户（end user）”。\n\n### ![](img/ICON_CHECKPT.png) 检查点\n\n1. 2.17 你需要程序用户输入客户的姓氏。编写一条语句，提示用户输入此数据并将输入赋值给变量。\n\
  2. 2.18 你需要程序用户输入本周的销售额。编写一条语句，提示用户输入此数据并将输入赋值给变量。\n\n# 2.7 执行计算\n\n### 概念：\n\n\
  Python 具有许多运算符可以执行数学计算。\n\n大多数现实世界的算法都需要执行计算。程序员执行计算的工具是`math operators`（数学运算符）。表\
  \ 2-3 列出了 Python 语言提供的数学运算符。\n\n| 符号 | 操作 | 描述 |\n| --- | --- | --- |\n| `+` | 加法\
  \ | 将两个数字相加 |\n| `−` | 减法 | 从一个数字减去另一个 |\n| `*` | 乘法 | 将一个数字乘以另一个 |\n| `/` | 除法\
  \ | 将一个数字除以另一个并以浮点数形式给出结果 |\n| `//` | 整除 | 将一个数字除以另一个并以整数形式给出结果 |\n| `%` | 取余 |\
  \ 将一个数字除以另一个并给出余数 |\n| `**` | 幂 | 将一个数字提升到幂次方 |\n\n## 表 2-3 Python 数学运算符\n\n程序员使用表\
  \ 2-3 所示的运算符来创建数学表达式。`math expression`（数学表达式）执行计算并给出一个值。以下是一个简单数学表达式的示例：\n\n```\n\
  12 + 2\n```\n\n`+` 运算符左右两侧的值被称为`operands`（操作数）。这些是 `+` 运算符相加的值。如果你在交互模式中输入此表达式，你会发现它给出的值是\
  \ 14：\n\n```\n>>> 12 + 2 \n14\n>>>\n```\n\n变量也可以用于数学数学表达式中。例如，假设我们有两个名为 `hours`\
  \ 和 `pay_rate` 的变量。下面的数学表达式使用 `*` 运算符将 `hours` 变量引用的值与 `pay_rate` 变量引用的值相乘：\n\n\
  ```\nhours * pay_rate\n```\n\n当我们使用数学表达式计算一个值时，通常希望将该值保存在内存中，以便在程序中再次使用它。我们通过赋值语句来实现这一点。程序\
  \ 2-14 显示了一个示例。\n\n## 程序 2-14 `(simple_math.py)`\n\n```\n 1  # 给 salary 变量赋值一个值。\n\
  \ 2  salary = 2500.0\n 3\n 4  # 给 bonus 变量赋值一个值。\n 5  bonus = 1200.0\n 6\n 7  #\
  \ 通过相加 salary 和 bonus 计算总薪资\n 8  # 将结果赋值给 pay。\n 9  pay = salary + bonus\n10\n11\
  \  # 显示薪资。\n12  print('Your pay is', pay)\n```\n\n**程序输出**\n\n```\nYour pay is 3700.0\n\
  ```\n\n第 2 行将 2500.0 赋值给 `salary` 变量，第 5 行将 1200.0 赋值给 `bonus` 变量。第 9 行将表达式 `salary\
  \ + bonus` 的结果赋值给 `pay` 变量。从程序输出可以看出，`pay` 变量持有值 3700.0。\n\n### 浮点除和整除\n\n注意表 2-3\
  \ 中的 `/` 运算符将一个数字除以另一个并以浮点数形式给出结果。`//` 运算符将一个数字除以另一个并以整数形式给出结果。`%` 运算符将一个数字除以另一个并给出余数。\n\
  \n\n\n\n数学表达式的一部分可以使用括号分组，以强制某些操作在其他操作之前执行。在以下语句中，变量 `a` 和 `b` 相加，并将它们的和除以 4：\n\n\
  ```\nresult = (a + b) / 4\n```\n\n然而，如果没有括号，`b` 将被除以 4，并将结果加到 `a` 上。表 2-5 显示了更多表达式及其值。\n\
  \n| 表达式 | 数值 |\n| --- | --- |\n| `(5 + 2) * 4` | 28 |\n| `10 / (5 − 3)` | 5.0 |\n\
  | `8 + 12 * (6 − 2)` | 56 |\n| `(6 − 3) * (2 + 7) / 3` | 9.0 |\n\n## 表 2-5 更多表达式及其值\n\
  \n## 指幂运算符\n\n除了加、减、乘、除等基础数学运算符外，Python 还提供了指数幂运算符。两个写在一起的星号（`**`）就是幂运算符，其目的是将一个数字升幂。例如，以下语句将\
  \ `length` 变量进行 2 次方运算并将结果赋值给 `area` 变量：\n\n```python\narea = length**2\n```\n\n\
  接下来的交互式解释器会话了表达式 `4**2`、`5**3` 和 `2**10` 的值：\n\n```python\n>>> 4**2 \n16\n>>> 5**3\
  \ \n125\n>>> 2**10 \n1024\n>>>\n```\n\n### 取余运算符\n\n在 Python 中，`%` 符号是取余运算符。（这也称为\
  \ `modulus operator`）。取余运算符执行除法，但它返回的不是商，而是余数。以下语句将 2 赋值给 `leftover`：\n\n```python\n\
  leftover = 17 % 3\n```\n\n该语句将 2 赋值给 `leftover`，是因为 17 除以 3 等于 5，余数为 2。取余运算符在某些情况下非常有用。它通常用于转换时间或距离的计算、检测奇偶数以及执行其他特殊操作。例如，程序\
  \ 2-17 从用户用户处获取秒数，并将该秒数转换为小时、分钟和秒。例如，它会将 11,730 秒转换为 3 小时 15 分钟 30 秒。\n\n## 程序 2-17\
  \ `(time_converter.py)`\n\n```python\n 1  # 从用户处获取秒数。\n 2  total_seconds = float(input('Enter\
  \ a number of seconds: '))\n 3\n 4  # 获取小时数。\n 5  hours = total_seconds // 3600\n\
  \ 6\n 7  # 获取剩余的分钟数。\n 8  minutes = (total_seconds // 60) % 60\n 9\n10  # 获取剩余的秒数。\n\
  11  seconds = total_seconds % 60\n12\n13  # 显示结果。\n14  print('Here is the time in\
  \ hours, minutes, and seconds:')\n15  print('Hours:', hours)\n16  print('Minutes:',\
  \ minutes)\n17  print('Seconds:', seconds)\n```\n\n**程序输出**（输入以**加粗**显示）\n\n```\n\
  Enter a number of seconds: 11730 \nHere is the time in hours, minutes, and seconds:\n\
  Hours: 3.0\nMinutes: 15.0\nSeconds: 30.0\n```\n\n让我们仔细查看一下代码：\n\n* 第 2 行从用户处获取秒数，将该值转换为\
  \ `float`，并将其赋值给变量 `total_seconds`。\n* 第 5 行计算指定秒数中的小时数。由于每小时有 3600 秒，因此该语句将 `total_seconds`\
  \ 除以 3600。注意我们使用了整除运算符（`//`）。这是因为我们想要没有小数部分的小时数。\n* 第 8 行计算剩余的分钟数。该语句首先使用 `//` 运算符将\
  \ `total_seconds` 除以 60，得到总分钟数。然后，它使用 `%` 运算符将总分钟数除以 60 得到除余数。结果就是剩余的分钟数。\n* 第 11\
  \ 行计算剩余的秒数。每分钟有 60 秒，因此该语句使用 `%` 运算符将 `total_seconds` 除以 60 得到除余数。结果就是剩余的秒数。\n*\
  \ 第 14 行到第 17 行显示小时、分钟和秒。\n\n\n\n在第二条语句中，`int()` 函数返回值 -2。执行此代码后，`fvalue` 变量引用值\
  \ -2.9，而 `ivalue` 变量引用值 -2。\n\n你可以使用 `float()` 函数将 `int` 显式转换为 `float`，如下代码所示：\n\
  \n```\nivalue = 2\nfvalue = float(ivalue)\n```\n\n执行此代码后，`ivalue` 变量引用整数值 2，而 `fvalue`\
  \ 变量引用浮点值 2.0。\n\n# 将长语句拆分为多行\n\n大多数编程语句都写在一行。然而，如果一个编程语句太长，你将无法在编辑器窗口中通过水平滚动查看全部内容。此外，如果你在纸上打印程序代码，且其中一条语句太长无法排在一行，它将换行到下一行，导致代码难以阅读。\n\
  \nPython 允许你使用“行续接字符”（即反斜杠 `\\`）将语句拆分为多行。你只需要在想要断开的地方输入反斜杠字符，然后按回车键即可。\n\n例如，这里有一个执行数学计算的语句，它已被拆分为两行：\n\
  \n```\nresult = var1 * 2 + var2 * 3 + \\\n         var3 * 4 + var4 * 5\n```\n\n\
  出现在第一行末尾的行续接字符告诉解释器语句在下一行继续。\n\nPython 还允许你将括号括的语句任何部分拆分为多行，而无需使用行续接字符。例如，看以下语句：\n\
  \n```\nprint(\"Monday's sales are\", monday,\n      \"and Tuesday's sales are\"\
  , tuesday,\n      \"and Wednesday's sales are\", wednesday)\n```\n\n下面的代码了另一个示例：\n\
  \n```\ntotal = (value1 + value2 +\n         value3 + value4 +\n         value5 +\
  \ value6)\n```\n\n### ![](img/ICON_CHECKPT.png) 检查点\n\n1. 2.19 在 Value 列中写出每个表达式的值，完成下表：\n\
  \n| Expression | Value |\n| --- | --- |\n| `6 + 3 * 5` | |\n| `12 / 2 − 4` | |\n\
  | `9 + 14 * 2 − 6` | |\n| `(6 + 2) * 3` | |\n| `14 / (11 − 4)` | |\n| `9 + 12 *\
  \ (8 − 3)` | |\n\n2. 2.20 执行以下语句后，`result` 将被赋值什么值？\n\n```\nresult = 9 // 2\n```\n\
  \n3. 2.21 执行以下语句后，`result` 将被赋值什么值？\n\n```\nresult = 9 % 2\n```\n\n# 2.8 关于数据输出的更多内容\n\
  \n到为止，我们只讨论了显示数据的基本方法。最终，你希望对数据在屏幕上的显示方式。在本在本节中，你将学习更多关于 Python `print` 函数的细节，并将看到以特定方式格式化输出的技术。\n\
  \n# 抑制 `print` 函数结尾的换行符\n\n`print` 函数通常显示一行输出。例如，以下三条语句将产生三行输出：\n\n```\nprint('One')\n\
  print('Two')\nprint('Three')\n```\n\n这里显示的每条语句都显示一个字符串，然后打印一个`newline character`。你看不见换行符，但当它被显示时，它会导致输出进到下一行。（你可以将换行符想象为导致计算机开始新的一行输出的特殊命令。）\n\
  \n如果你不希望 `print` 函数在完成输出显示后开始新行输出，可以向函数传递特殊参数 `end=' '`，如下代码所示：\n\n```\nprint('One',\
  \ end=' ')\nprint('Two', end=' ')\nprint('Three')\n```\n\n注意在前两个语句中，参数 `end=' '`\
  \ 被传递给 `print` 函数。这指定了 `print` 函数在输出末尾打印一个空格而不是换行符。这些语句的输出如下：\n\n```\nOne Two Three\n\
  ```\n\n\n\n在本章前面的部分，你已经看到 `+` 运算符用于相加两个数字。然而，当 `+` 运算符用于两个字符串时，它执行的是`字符串拼接*。这意味着它将一个字符串附加到另一个字符串之后。例如，看下面的语句：\n\
  \n```\nprint('This is ' + 'one string.')\n```\n\n该语句将打印：\n\n```\nThis is one string.\n\
  ```\n\n字符串拼接可以用于拆分字符串字面量，使得冗长的 `print` 函数调用可以跨行显示。这里有一个示例：\n\n```\nprint('Enter\
  \ the amount of ' + \n      'sales for each day and ' + \n      'press Enter.')\n\
  ```\n\n该语句将显示如下：\n\n```\nEnter the amount of sales for each day and press Enter.\n\
  ```\n\n# 数字的格式化\n\n你可能并不总是数字（尤其是浮点数）在屏幕上的显示方式满意。当 `print` 函数显示浮点数时，它可能会显示多达 12 位有效数字。这在程序\
  \ 2-19 的输出中显示。\n\n## 程序 2-19 `(no_formatting.py)`\n\n```\n 1  # 此程序演示了在不格式化的情况下\n\
  \ 2  # 如何显示浮点数。\n 3  amount_due = 5000.0\n 4  monthly_payment = amount_due / 12.0\n\
  \ 5  print(The monthly payment is’, monthly_payment)\n```\n\n**程序输出**\n\n```\nThe\
  \ monthly payment is 416.666666667\n```\n\n由于这个程序显示的是金额，如果能看到该金额保留两位小数就太好了。幸运的是，Python\
  \ 通过内置的 `format` 函数为我们提供了实现这种功能以及更多方法。\n\n当你调用内置的 `format` 函数时，你向函数传递两个参数：一个数值和一个格式说明符。*格式说明符*是一个包含特殊字符的字符串，这些字符指定了数值应该如何格式化。让我们来看一个示例：\n\
  \n```\nformat(12345.6789, '.2f')\n```\n\n第一个参数浮点数 `12345.6789` 是我们想要格式化的数字。第二个参数字符串\
  \ `'.2f'` 是格式说明符。以下是其内容的含义：\n\n* `.2` 指定了精度。它表示我们希望将数字舍入到两位小数。\n* `f` 指定了我们正在格式化的数字数据类型是浮点数。\n\
  \n`format` 函数返回一个包含格式化后数字的字符串。下面的交互模式演示演示了你如何将 `format` 函数配合 `print` 函数来显示格式化后的数字：\n\
  \n```\n>>> print(format(12345.6789, '.2f')) \n12345.68\n>>>\n```\n\n注意数字被舍入到了两位小数。接下来的示例显示了相同的数字，但保留到一位小数：\n\
  \n```\n>>> print(format(12345.6789, '.1f')) \n12345.7\n>>>\n```\n\n这里是另一个示例：\n\n\
  ```\n>>> print('The number is', format(1.234567, '.2f')) \nThe number is 1.23\n\
  >>>\n```\n\n程序 2-20 显示了我们如何修改程序 2-19 以便其使用这种技术来格式化输出。\n\n## 程序 2-20 `(formatting.py)`\n\
  \n```\n 1  # 此程序演示了如何格式化\n 2  # 浮点数。\n 3  amount_due = 5000.0\n 4  monthly_payment\
  \ = amount_due / 12\n 5  print('The monthly payment is', \n 6        format(monthly_payment,\
  \ ‘.2f’))\n```\n\n**程序输出**\n\n```\nThe monthly payment is 416.67\n```\n\n# 科学计数法格式化\n\
  \n如果你更喜欢用科学计数法显示浮点数，可以使用字母 `e` 或 `E` 代替 `f`。这里是一些示例：\n\n```\n>>> print(format(12345.6789,\
  \ 'e')) \n1.234568e+04\n>>> print(format(12345.6789, '.2e')) \n1.23e+04\n>>>\n```\n\
  \n第一条语句只是以科学计数法格式化数字。使用了字母 `e`。（如果你在格式说明符中使用大写的 `E`，结果将包含 `E`）。第二个语句指定了精度。\n\n#\
  \ 插入逗号分隔符\n\n如果你希望数字带有逗号格式化，可以在格式说明符中插入逗号，如下所示：\n\n```\n>>> print(format(12345.6789,\
  \ ',f'))\n12,345.6789\n```\n\n另一个示例显示了更大的数字：\n\n```\n>>> print(format(123456.78,\
  \ ',f'))\n123,456.78\n```\n\n注意在格式说明符中，逗号写在数字的前面。这里是一个没有指定精度的示例：\n\n```\n>>> print(format(12345.6789,\
  \ ',f'))\n12,345.6789\n```\n\n程序 2-21 演示了使用逗号分隔符显示数字。\n\n## 程序 2-21 `(dollar_display.py)`\n\
  \n```\n 1  # 此程序演示了如何以货币格式\n 2  # 显示浮点数。\n 3  amount_due = 5000.0\n 4  monthly_payment\
  \ = amount_due / 12\n 5  print('Monthly pay is$',\n 6        format(monthly_payment,\
  \ ',2f'), sep='')\n```\n\n**程序输出**\n\n```\nMonthly pay is $416.67\n```\n\n注意在第 7\
  \ 行中，我们向 `print` 函数传递了 `sep=''`。正如前面提到的，这指定了两位小数。\n\n# 指定字段宽度\n\n格式说明符还可以包含字段宽度，即数字应该占据的最小空格数。接下来的示例显示了：\n\
  \n```\n>>> print(format(12345.6789, '12.2f'))\n     12345.68\n>>>\n```\n\n在这个示例中，`12`\
  \ 表示数字应该在字段中显示。在这种情况下，数字比字段短。如果值超过了字段宽度，字段会自动扩大以容纳它。\n\n在之前的示例中，宽度说明符写在逗号前面。这里是一个指定了字段宽度但没有使用逗号的示例：\n\
  \n```\n>>> print(format(12345.6789, '12.2f'))\n     12345.68\n>>>\n```\n\n当你需要对齐打印数字时，字段宽度很有帮助。例如，看程序\
  \ 2-22，每个变量都显示在七位的字段内。\n\n## 程序 2-22 `(columns.py)`\n\n```\n 1  # 此程序列出以下\n 2  #\
  \ 浮点数，并对齐\n 3  # 小数点。\n 4  num1 = 127.899\n 5  num2 = 3465.148\n 6  num3 = 3.776\n\
  \ 7  num4 = 264.821\n 8  num5 = 88.081\n 9  num6 = 799.999\n10\n 11  # 将每个数字显示在七位的字段中，\n\
  \ 12  # 保留两位。\n 13  print(format(num1, '7.2f'))\n 14  print(format(num2, '7.2f'))\n\
  \ 15  print(format(num3, '7.2f'))\n 16  print(format(num4, '7.2f'))\n 17  print(format(num5,\
  \ '7.2f'))\n 18  print(format(num6, '7.2f'))\n```\n\n**程序输出**\n\n```\n  127.90\n\
  3465.15\n    3.78\n  264.82\n   88.08\n  800.00\n```\n\n\n\n\n与其使用 `f` 作为类型指示符，你可以使用\
  \ `%` 符号将浮点数格式化为百分比。`%` 符号会将数字乘以 100 并在其后面显示一个 `%` 符号。以下是一个示例：\n\n```\n>>> print(format(0.5,\
  \ '%')) \n50.000000%\n>>>\n```\n\n以下是一个指定精度为 0 的示例：\n\n```\n>>> print(format(0.5,\
  \ '.0%')) \n50%\n>>>\n```\n\n### 格式化整数\n\n之前所有的示例演示了如何格式化浮点数。你也可以使用 `format` 函数来格式化整数。在编写用于格式化整数的格式指定符时，有两点需要注意：\n\
  \n-   你使用 `d` 作为类型指示符。\n-   你不能指定精度。\n\n让我们在交互式解释器中看一些示例。在下面的会话中，数字 123456 在没有特殊格式的情况下打印：\n\
  \n```\n>>> print(format(123456, 'd')) \n123456\n>>>\n```\n\n在下面的会话中，数字 123456 带有逗号分隔符打印：\n\
  \n```\n>>> print(format(123456, ',d')) \n123,456\n>>>\n```\n\n在下面的会话中，数字 123456\
  \ 在一个宽度为 10 个空格的字段中打印：\n\n```\n>>> print(format(123456, '10d')) \n   123456\n>>>\n\
  ```\n\n在下面的会话中，数字 123456 在一个宽度为 10 个空格的字段中带有逗号分隔符打印：\n\n```\n>>> print(format(123456,\
  \ '10,d')) \n   123,456\n>>>\n```\n\n### ![](img/ICON_CHECKPT.png) 检查点\n\n1. 2.22\
  \ 如何抑制 `print` 函数结束时的换行？\n2. 2.23 如何更改传递给 `print` 函数的多个项目之间自动显示的字符？\n3. 2.24 什么是转义字符\
  \ `'\\n'`？\n4. 2.25 当 `+` 运算符与两个字符串一起使用时做什么？\n5. 2.26 语句 `print(format(65.4321,\
  \ '.2f'))` 显示什么？\n6. 2.27 语句 `print(format(987654.129, ',.2f'))` 显示什么？\n\n# 2.9\
  \ 命名常量\n\n### 概念：\n\n命名常量是一个代表在程序执行期间不能更改的值的名字。\n\n想象一下，你是一个在银行工作的程序员。你正忙更新一个计算贷款相关数据的现有程序，你看到了以下代码行：\n\
  \n```\namount = balance * 0.069\n```\n\n由于程序是别人写的，你不确定数字 `0.069` 是什么。它看起来像是一个利率，但也可能是用于计算某种费用的数字。你无法通过读取这行代码确定\
  \ `0.069` 的用途。这是一个魔数的示例。`magic number` 是程序代码中出现的未解释的值。\n\n出于许多原因，魔数可能会带来问题。首先，正如我们的示例所示，阅读代码的人可能很难确定该数字的用途。其次，如果魔数在程序的多个处使用，那么在需要时，更改每个位置的数字将耗费巨大的精力。第三，你每次在程序代码中输入魔数时，都面临着犯拼写错误的风险。例如，假设你打算输入\
  \ `0.069`，但你不小心输入了 `.0069`。这个错误会导致难以发现的数学错误。\n\n可以通过命名常量来表示魔数以解决这些问题。`named constant`\
  \ 是代表在程序执行期间不更改的值的名字。以下是我们在代码中声明命名常量的示例：\n\n```\nINTEREST_RATE = 0.069\n```\n\n\
  这创建了一个名为 `INTEREST_RATE` 的命名常量，并赋值为值 `0.069`。注意，命名常量用全大写字母写。这是大多数编程语言中的标准做法，因为它使得命名常量很容易与普通变量区分来。\n\
  \n使用命名常量的优势之一是它们让程序更具自解释性。以下语句：\n\n```\namount = balance * 0.069\n```\n\n可以更改为：\n\
  \n```\namount = balance * INTEREST_RATE\n```\n\n新程序员可以阅读第二个语句并知道正在发生什么。显而易见，`balance`\
  \ 正在乘以利率。\n\n使用命名常量的另一个优势是可以很容易对程序进行广泛的更改。假设利率在整个程序中的十几个不同的语句中出现。当利率变化时，命名常量声明中的初始化值是唯一需要修改的值。如果利率增加到\
  \ 7.2%，则声明可以更改为：\n\n```\nINTEREST_RATE = 0.072\n```\n\n然后，新值 `0.072` 将用在每个使用 `INTEREST_RATE`\
  \ 常量的语句中。\n\n使用命名常量的另一个优势是，它们有助于防止在使用魔数时常见的拼写错误。例如，如果你在数学语句中不小心输入了 `.0069` 而不是 `0.069`，程序将计算错误的值。然而，如果你拼写错了\
  \ `INTEREST_RATE`，Python 解释器将显示一条指示名称未定义的消息。\n\n### ![](img/ICON_CHECKPT.png) 检查点\n\
  \n1. 2.28 使用命名常量的三个优势是什么？\n2. 2.29 写一个定义 10% 折扣命名常量的 Python 语句。\n\n# 2.10 海龟图简介\n\
  \n### 概念：\n\n海龟图是学习基础编程概念的一种有趣且简单的方法。Python 海龟图系统模拟了一个遵循指令绘制简单图形的“海龟”。\n\n在 20 世纪\
  \ 60 年代后期，麻理工学院教授 Seymour Papert 使用机器人“海龟”来教编程。海龟连接到计算机，学生可以在那里输入命令，导致海龟移动。海龟还有一支可以抬下的笔，因此它可以放在纸上并编程绘制图像。Python\
  \ 有一个 `turtle graphics` 系统模拟机器人海龟。该系统在屏幕上显示一个小光标（海龟）。你可以使用 Python 语句让海龟在屏幕上移动，绘制线条和形状。\n\
  \n使用 Python 海龟图系统的第一步是编写以下语句：\n\n```\nimport turtle\n```\n\n这句话是必要的，因为海龟图系统没有内置在\
  \ Python 解释器中。相反，它存储在一个名为 `turtle module` 的文件中。`import turtle` 语句将该模块加载到内存中，以便 Python\
  \ 解释器可以使用。\n\n如果你正在编写一个使用海龟图的 Python 程序，你会在程序顶部编写 `import` 语句。如果你想在交互模式下实验海龟图，可以将该语句输入到\
  \ Python shell 中，如下所示：\n\n```\n>>> import turtle\n>>>\n```\n\n### 使用海龟绘制线条\n\nPython\
  \ 海龟最初位于图形窗口的中心，该窗口作为它的画布。在交互模式下，你可以输入 `turtle.showturtle()` 命令在它的窗口中显示海龟。以下是一个导入\
  \ `turtle` 模块然后显示海龟的示例会话：\n\n```\n>>> import turtle\n>>> turtle.showturtle()\n```\n\
  \n\n\n\n这会导致出现一个类似于图 2-10 所示的图形窗口。注意，乌龟看起来完全不像乌龟。相反，它看起来像一个箭头 (![](img/ua02_0010.png))。这很重要，因为它指向了乌龟当前面对的方向。如果我们指令乌龟向前移动，它将沿着箭头指向的方向移动。让我们来试一下。你可以使用\
  \ `turtle.forward(`*`n`*`)` 命令让乌龟向前移动 *`n`* 像素。（只需在 *`n`* 处输入所需的像素数即可。）例如，命令 `turtle.forward(200)`\
  \ 让乌龟向前移动 200 像素。以下是 Python Shell 中完整会话的示例：\n\n![Python Turtle 绘图窗口的截图。标题下方是一个空白屏幕，中心有一个小箭头。](img/fg02_0100.png)\n\
  \n### 图 2-10 乌龟的图形窗口\n\n```\n>>> import turtle\n>>> turtle.forward(200)\n>>>\n```\n\
  \n图 2-11 显示了此交互会话的输出。注意，乌龟在向前移动时画了一条线。\n\n![乌龟向前移动 200 像素的截图。Python Turtle 绘图窗口内是一个空白屏幕，有一个箭头从中心延伸到右侧。(images/fg02_01100.png)#\
  \ 图 2-11 乌龟向前移动 200 像素# 旋转乌龟当乌龟首次出现时，它的默认朝向是 0 度（正东）。这在图 2-12 中所示。![乌龟朝向的截图。](img/fg02_01200.png)\n\
  \n# 图 2-12 乌龟的朝向\n\n图 2-12 完整替代文本\n\n你可以通过 `turtle.right(`*`angle`*`)` 命令或 `turtle.left(`*`angle`*`)`\
  \ 命令来旋转乌龟，使其面向不同的方向。`turtle.right(`*`angle`*`)` 命令让乌龟向右旋转 *`angle`* 度，而 `turtle.left(`*`angle`*`)`\
  \ 命令让乌龟向左旋转 *`angle`* 度。以下是一个使用 `turtle.right(`*`angle`*`)` 命令的会话示例：\n\n```\n>>>\
  \ import turtle\n>>> turtle.forward(200)\n>>> turtle.right(90)\n>>> turtle.forward(200)\n\
  >>>\n```\n\n此会话首先让乌龟向前移动 200 像素。然后让乌龟向右转 90 度（乌龟将指向下方）。然后让乌龟向前移动 200 像素。会话的输出所示在图\
  \ 2-13 中。\n\n![Python Turtle 绘图窗口的截图，显示一个箭头从中心延伸到屏幕右侧，然后以 90 度角向下。(](img/fg02_01300.png)\n\
  \n# 图 2-13 乌龟向右转\n\n以下是一个使用 `turtle.left(`*`angle`*`)` 命令的会话示例：\n\n```\n>>> import\
  \ turtle\n>>> turtle.forward(100)\n>>> turtle.left(120)\n>>> turtle.forward(150)\n\
  >>>\n```\n\n此会话首先让乌龟向前移动 100 像素。然后让乌龟向左转 120 度（乌龟将指向西北方向）。然后让乌龟向前移动 150 像素。会话的输出所示在图\
  \ 2-14 中。\n\n![Python Turtle 绘图窗口的截图，显示一个箭头从屏幕中心延伸到右侧，然后以相对于水平约 60 度角向左上方转。(](img/fg02_01400.png)\n\
  \n# 图 2-14 乌龟向左转\n\n记住，`turtle.right` 和 `turtle.left` 命令是让乌龟旋转*指定的角度*。例如，乌龟当前的朝向是\
  \ 90 度（正北）。如果你输入命令 `turtle.left(20)`，乌龟将向左转 20 度。这意味着乌龟的朝向将变为 110 度。另一个示例请看以下交互会话：\n\
  \n```\n>>> import turtle\n>>> turtle.forward(50)\n>>> turtle.left(45)\n>>> turtle.forward(50)\n\
  >>> turtle.left(45)\n>>> turtle.forward(50)\n>>> turtle.left(45)\n>>> turtle.forward(50)\n\
  >>>\n```\n\n图 2-15\n\n\n\n\n你可以使用 `turtle.circle(radius)` 命令让乌龟画出一个半径为 `radius`\
  \ 像素的圆。例如，`turtle.circle(100)` 命令会使乌龟画出一个半径为 100 像素的圆。下面的交互式显示了如图 2-18 中所示的输出：\n\
  \n![Python Turtle 图形窗口的截图，显示箭头从屏幕中心开始，向上弯曲并绕圈最后回到中心，形成了一个圆。](img/fg02_01800.png)\n\
  \n### 图 2-18 一个圆\n\n```\n>>> import turtle\n>>> turtle.circle(100)\n>>>\n```\n\n\
  你可以使用 `turtle.dot()` 命令让乌龟画一个简单的点。例如，下面的交互式会产生如图 2-19 中所示的输出：\n\n![Python Turtle\
  \ 图形窗口的截图，显示箭头从屏幕中心的一个点开始向右延伸，沿线方向在等间距处还有两个点。](img/fg02_01900.png)\n\n### 图 2-19\
  \ 绘制点\n\n```\n>>> import turtle\n>>> turtle.dot()\n>>> turtle.forward(50)\n>>> turtle.dot()\n\
  >>> turtle.forward(50)\n>>> turtle.dot()\n>>> turtle.forward(50)\n>>>\n```\n\n#\
  \ 改变画笔宽度\n\n你可以使用 `turtle.pensize(width)` 命令更改乌龟画笔的宽度，单位为像素。`width` 参数是一个指定画笔宽度的整数。例如，下面的交互式将画笔宽度设置为\
  \ 5 像素，然后画一个圆：\n\n```\n>>> import turtle\n>>> turtle.pencsize(5)\n>>> turtle.circle(100)\n\
  >>>\n```\n\n# 改变线条颜色\n\n你可以使用 `turtle.pencolor(color)` 命令更改乌龟的绘图颜色。`color` 参数是颜色的名称，字符串形式。例如，下面的交互式将绘图颜色改为红色，然后画一个圆：\n\
  \n```\n>>> import turtle\n>>> turtle.pencolor('red')\n>>> turtle.circle(100)\n>>>\n\
  ```\n\n有许多预定义的颜色名称可以用于 `turtle.pencolor` 命令，附录 D 显示了完整的列表。一些常用的颜色包括 `'red'`（红色）、`'green'`（绿色）、`'yellow'`（黄色）和\
  \ `'cyan'`（青色）。\n\n# 改变背景颜色\n\n你可以使用 `turtle.bgcolor(color)` 命令更改乌龟图形窗口的背景颜色。`color`\
  \ 参数是颜色的名称，字符串形式。例如，下面的交互式将背景颜色改为灰色，将绘图颜色改为红色，然后画一个圆：\n\n```\n>>> import turtle\n\
  >>> turtle.bgcolor('gray')\n>>> turtle.pencolor('red')\n>>> turtle.circle(100)\n\
  >>>\n```\n\n如前所述，有许多预定义的颜色名称，附录 D 显示了完整的列表。\n\n### 重置屏幕\n\n你可以使用三个命令来重置乌龟的图形窗口：`turtle.reset()`、`turtle.clear()`\
  \ 和 `turtle.clearscreen()`。总结如下：\n\n* `turtle.reset()` 命令清除图形窗口当前显示的所有图形，将绘图颜色重置为黑色，并将乌龟重置到中心原始位置。该命令不会重置图形窗口的背景颜色。\n\
  * `turtle.clear()` 命令仅清除图形窗口中当前显示的所有图形。它不会改变乌龟的位置、绘图颜色或图形窗口的背景颜色。\n* `turtle.clearscreen()`\
  \ 命令清除图形窗口当前显示的所有图形，将绘图颜色重置为黑色，将图形窗口的背景颜色重置为白色，并将乌龟重置到中心原始位置。\n\n# 指定图形窗口大小\n\n\
  你可以使用 `turtle.setup(width, height)` 命令为图形窗口指定大小。`width` 和 `height` 参数分别是像素的宽度和高度。例如，下面的交互式创建一个宽\
  \ 640 像素、高 480 像素的图形窗口：\n\n```\n>>> import turtle\n>>> turtle.setup(640, 480)\n\
  >>> 移动乌龟到特定位置\n\n笛卡尔坐标系用于识别图形窗口中的每个像素，如图 2-20 所示。你可以使用 `turtle.goto(x, y)` 命令将乌龟从当前位置移动到图形窗口中的特定位置。`x`\
  \ 和 `y` 参数是位置的坐标。如果乌龟的画笔是落下的，那么当它移动时就会画出线。例如，下面的交互式画出了如图 2-21 中所示的线条：\n\n![Python\
  \ Turtle 图形窗口的截图，显示箭头从中心延伸向上，然后向左转 45 度，再向右转 45 度回到中心，形成了一个三角形。](img/fg02_02100.png)\n\
  \n### 图 2-20 笛卡尔坐标系\n\n```\n>>> import turtle\n>>> turtle.goto(0, 100)\n>>> turtle.goto(-100,\
  \ 0)\n>>> turtle.goto(0, 0)\n>>>\n```\n\n\n\n\n如果你指定一个 1 到 10 范围内的 `speed` 值，那么\
  \ 1 是最慢的速度，而 10 是最快的速度。下面的交互式演示将动画速度设置为 1（最慢的速度），然后画出一个圆：\n\n```\n>>> import turtle\n\
  >>> turtle.speed(1)\n>>> turtle.circle(100)\n>>>\n```\n\n你可以使用 `turtle.speed()`\
  \ 命令获取当前的动画速度（不要指定 `speed` 参数）。以下是一个示例：\n\n```\n>>> import turtle\n>>> turtle.speed()\n\
  3\n>>>\n```\n\n### 隐藏乌龟\n\n如果你不想让乌龟显示，可以使用 `turtle.hideturtle()` 命令将其隐藏。此命令不会改变图形的绘图方式，它只是简单地隐藏了代表乌龟的图标。当你想要再次显示乌龟时，请使用\
  \ `turtle.showturtle()` 命令。\n\n# 在图形窗口中显示文本\n\n你可以使用 `turtle.write(text)` 命令在图形窗口中显示文本。`text`\
  \ 参数是你想要显示的字符串。当字符串显示时，第一个字符的左下角将位于乌龟的 `X` 和 `Y` 坐标处。下面的交互式演示展示了这一点。该会话的输出位于图 2-22![Python\
  \ 乌龟图形窗口截图，屏幕中心显示箭头和文本“Hello World”](img/fg02_02200.png) 图形窗口中的文本\n\n```\n>>> import\
  \ turtle\n>>> turtle.write('Hello World')\n>>>\n\n下面的交互式演示显示了另一个示例，将乌龟移动到特定位置以显示文本。该会话的输出位于图\
