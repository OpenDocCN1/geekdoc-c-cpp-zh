  \ less force.'` 之类的消息。\n\n# 第 4 章 重复结构\n\n## 4.1 重复结构简介\n\n### 概念\n\n重复结构导致语句或一组语句反复执行。\n\
  \n程序员通常需要编写反复执行相同任务的代码。例如，假设你被要求写一个程序为多个销售人员计算 10% 的销售佣金。虽然这不是良好的设计，但一种方法是编写计算一个销售人员佣金的代码，然后为每个销售人员重复该代码。例如，查看以下内容：\n\
  \n```\n### Get a salesperson's sales and commission rate.\nsales = float(input('Enter\
  \ the amount of sales: '))\ncomm_rate = float(input('Enter the commission rate:\
  \ '))\n\n### Calculate the commission.\ncommission = sales * comm_rate\n\n### Display\
  \ the commission.\nprint('The commission is $', format(commission, ',.2f'), sep='')\n\
  \n### Get another salesperson's sales and commission rate.\nsales = float(input('Enter\
  \ the amount of sales: '))\ncomm_rate = float(input('Enter the commission rate:\
  \ '))\n\n### Calculate the commission.\ncommission = sales * comm_rate\n\n### Display\
  \ the commission.\nprint('The commission is $', format(commission, ',.2f'), sep='')\n\
  ```\n\n\n\n\n在本章中，我们将介绍两大类循环：条件控制循环和计数控制循环。*条件控制循环*使用真/假条件来控制重复的次数。*计数控制循环*则重复特定的次数。在\
  \ Python 中，你使用 `while` 语句来编写条件控制循环，并使用 `for` 语句来编写计数控制循环。在本章中，我们将演示如何编写这两种类型的循环。\n\
  \n### ![](img/ICON_CHECKPT.png) 检查点\n\n1. 4.1 什么是重复结构？\n2. 4.2 什么是条件控制循环？\n3. 4.3\
  \ 什么是计数控制循环？\n\n## 4.2 `while` 循环：条件控制循环\n\n### 概念\n\n条件控制循环在条件为真时，使一个语句或一组语句重复执行。在\
  \ Python 中，你使用 `while` 语句来编写条件控制循环。\n\n`while` 循环的名称源于它的工作方式：*当条件为真时，执行某些任务*。该循环包含两个部分：(1)\
  \ 用于测试真或假值的条件，以及(2) 只要条件为真就会重复执行的语句或一组语句。图 4-1 显示了 `while` 循环的逻辑。\n\n![说明 while\
  \ 循环的流程图](img/fg04_0100.pngpng)\n\n### 4-1 `while`  的逻辑\n\n图 4-1 完整替代文本\n\n菱形符号表示被测试的条件。注意当条件为真时会发生什么：执行一条或多个语句，程序的执行流将回到菱形符号上方的点。再次测试条件，如果条件为真，则重复该过程。如果条件为假，程序将退出循环。在流程图中，当你看到流线返回流程图之前的部分时，你总是能识别出一个循环。\n\
  \n以下是 Python 中 `while` 循环的一般格式：\n\n```python\nwhile condition:\n    statement \n\
  \   statement \n   etc.\n```\n\n为了简单起见，我们将第一行称为 `while` 子句。`while` 子句以单词 `while`\
  \ 开头，后跟着一个将被评估为真或假的布尔值 `condition`。`condition` 后面有一个冒号。从下一行开始是一个语句块。（回想第 3 章 显示了我们如何使用\
  \ `while` 循环来编写在本章开头描述的金计算程序。\n\n### 程序 4-1 (commission.py)\n\n```python\n### 此程序计算销售佣金。\n\
  \n### 创建控制循环的变量。\nkeep_going = 'y'\n\n### 计算一系列佣金。\nwhile keep_going == 'y':\n \
  \   # 获取销售员的销售额和佣金率。\n    sales = float(input('Enter the amount of sales: '))\n\
  \    comm_rate = float(input('Enter the commission rate: '))\n\n    # 计算佣金。\n  \
  \  commission = sales * comm_rate\n\n    # 显示佣金。\n    print('The commission is $',\
  \ \n          format(commission, ',.2f'), sep='')\n\n    # 查看用户是否想再计算一次。\n    keep_going\
  \ = input('Do you want to calculate another ' + \n                        'commission\
  \ (Enter y for yes): ')\n```\n\n**程序输出**（输入用加粗显示）\n\n```\nEnter the amount of sales:\
  \ 10000.00 \nEnter the commission rate: 0.10 \nThe commission is $1,000.00\nDo you\
  \ want to calculate another commission (Enter y for yes): y\nEnter the amount of\
  \ sales: 20000.00 \nEnter the commission rate: 0.15 \nThe commission is $3,000.00\n\
  Do you want to calculate another commission (Enter y for yes): y\nEnter the amount\
  \ of sales: 30000.00 \nEnter the commission rate: 0.10 \nThe commission is $1,200.00\n\
  Do you want to calculate another commission (Enter y for yes): n\n```\n\n\n\n\n\
  `while` 循环被称为`pretest`（预测试）循环，这意味着它在执行迭代`之前`会先测试其条件。由于测试是在循环开始时进行的，因此你通常需要在循环之前执行一些步骤，以确保循环至少执行一次。例如，程序\
  \ 4-1 中的循环开始如下所示：\n\n```\nwhile keep_going == 'y':\n```\n\n只有当表达式 `keep_going ==\
  \ 'y'` 为真时，循环才会执行迭代。这意味着 (a) `keep_going` 变量必须存在，并且 (b) 它必须引用值 `'y'`。为了确保循环在第一次执行时表达式为真，我们在第\
  \ 4 行将值 `'y'` 赋值给 `keep_going` 变量，如下所示：\n\n```\nkeep_going = 'y'\n```\n\n通过执行这一步，我们知道条件\
  \ `keep_going == 'y'` 在循环第一次执行时将为真。这是 while 循环的一个重要特性：如果它的条件初始为假，那么它将永远不会执行。在某些程序中，这正是你所需要的。接下来的*焦点聚焦\
  \ (In the Spotlight)* 部分提供了一个示例。\n\n### 无限循环\n\n在极少数情况下，循环内部必须包含一种终止机制。这意味着循环内部的某些内容最终必须使测试条件变为假。程序\
  \ 4-1 中的循环在表达式 `keep_going == 'y'` 为假时停止。如果一个循环没有停止的方法，它被称为称为无限循环。`infinite loop`\
  \ 会持续重复，直到程序被中断为止。无限循环通常发生在程序员忘记在循环内部编写使测试条件变为假的代码时。在大多数情况下，你应该避免编写无限循环。\n\n程序 4-3\
  \ 演示了一个无限循环。这是程序 4-1 中所示佣金计算程序的修改版本。在这个版本中，我们删除了循环体中修改 `keep_going` 变量的代码。每当在第 6\
  \ 行测试表达式 `keep_going == 'y'` 时，`keep_going` 都会引用字符串 'y'。结果是，循环没有停止的方法。（停止此程序的唯一方法是在键盘上按\
  \ `Ctrl+C` 来中断它。）\n\n### 程序 4-3 `(infinite.py)`\n\n```\n 1  # 此程序演示了一个无限循环。\n 2\
  \  # 创建一个变量来控制循环。\n 3  keep_going = 'y'\n 4\n 5  # 警告！无限循环！\n 6  while keep_going\
  \ == 'y':\n 7      # 获取销售人员的销售额和佣金率。\n 8      sales = float(input('Enter the amount\
  \ of sales: '))\n 9      comm_rate = float(input('Enter the commission rate: '))\n\
  10\n11      # 计算佣金。\n12      commission = sales * comm_rate\n13\n14      # 显示佣金。\n\
  15      print('The commission is $', \n16             format(commission, ',.2f'),\
  \ sep='')\n```\n\n### ![](img/ICON_CHECKPT.png) 检查点\n\n1. 4.4 什么是循环迭代？\n\n2. 4.5\
  \ while 循环是在执行之前还是之后测试其条件？\n\n3. 4.6 在以下程序中，'Hello World' 会打印多少次？\n\n   ```\n  \
  \ count = 10\n   while count < 1:\n         print('Hello World')\n   ```\n\n4. 4.7\
  \ 什么是无限循环？\n\n## 4.3 `for` 循环：计数控制循环\n\n### 概念\n\n计数控制循环迭代特定的次数。在 Python 中，你使用 `for`\
  \ 语句来编写计数控制循环。\n\n正如本章开头提到的，计数控制循环迭代特定的次数。计数控制循环在程序中非常常用。例如，假设一家公司每周营业六天，你将编写一个计算每周总销售额的程序。你需要一个恰好迭代六次的循环。循环每次迭代时，它都会提示用户输入一天的销售额。\n\
  \n你使用 `for` 语句来编写计数控制循环。在 Python 中，`for` 语句设计用于与序列工作。当语句执行时，它会处理序列中的每个项。格式如下：\n\n\
  ```\nfor variable in sequence:\n```\n\n在 `for` 语句中，`variable` 是变量名。在括号内的 `sequence`\
  \ 是由逗号分隔的序列（在 Python 中，用括号括起来、逗号分隔的数据被称为 `list`）。`for` 语句执行时，它对序列中的每个项迭代一次。\n\n\
  ```\nfor value1, value2, etc.:\n    statement\n```\n\n在 `for` 语句中，`variable` 是在每次迭代开始时赋值的目标。\n\
  \n在列表中出现的值不需要是连续的数字序列。例如，程序 4-4 使用 `for` 循环来显示数字。列表中有五个数字，所以循环迭代五次。\n\n### 程序 4-4\
  \ `(simple.py)`\n\n```\n 1  # 此程序演示了一个简单的 for 循环。\n 2  # 使用数字列表。\n 3\n 4  print('Display\
  \ the numbers.')\n 5  for num in [1, 2, 3, 4, 5]:\n 6      print(num)\n```\n\n**程序输出**\n\
  \n```\nDisplay the numbers.\n1\n2\n3\n4\n5\n```\n\n`for` 循环第一次迭代时，`num` 被赋值为 1，然后执行语句（显示\
  \ 1）。下一次迭代时，`num` 被赋值为 2，并执行语句（显示 2）。如图 4-4 所示，直到 `num` 被赋值为列表中的最后一个值。\n\n![展示 for\
  \ 循环的代码块](img/fg000.png)\n\n### 图 4-4 `for` 循环\n\nPython 程序员通常将 `for` 子句中使用的变量称为目标变量\
  \ (target variable)，因为它是每次迭代开始时赋值的目标。\n\n图 4-4 完整文本\n\n\n\n\n# 在 `for` 循环中使用 `range`\
  \ 函数\n\nPython 提供了一一个名为 `range` 的内置函数，它简化了编写计数控制 `for` 循环的过程。`range` 函数创建一个被称为“可迭代对象”（iterable）的类型对象。“可迭代对象”是一个类似于列表的对象。它包含一个值序列，可以使用循环等方式对该序列进行迭代。以下是一个使用\
  \ `range` 函数的 `for` 循环示例：\n\n```python\nfor num in range(5):\n    print(num)\n```\n\
  \n注意，我们没有使用值列表，而是调用了 `range` 函数并传递 `5` 作为参数。在这一语句中，`range` 函数将生成一个从 `0` 到（但不包括）`5`\
  \ 的整数可迭代序列序列。这段代码的作用与以下代码等同：\n\n```python\nfor num in [0, 1, 2, 3, 4]:\n    print(num)\n\
  ```\n\n如你所见，列表包含五个数字，因此循环将迭代五次。程序 4-7 使用 `range` 函数配合 `for` 循环显示了五次“Hello world”。\n\
  \n# 程序 4-7 `(simple_loop4.py)`\n\n```python\n 1   # 此程序演示了如何将 range\n 2   # 函数与\
  \ for 循环结合使用。\n 3\n 4   # 打印五次消息。\n 5  for x in range(5):\n 6      print('Hello\
  \ world')\n```\n\n### 程序输出\n\n```\nHello world\nHello world\nHello world\nHello\
  \ world\nHello world\n```\n\n如果你向 `range` 函数传递一个参数，如程序 4-7 所示，该参数将用作数字序列的结束界限。如果你向\
  \ `range` 函数传递两个参数，第一个参数将用作序列的起始值，第二个参数将用作结束界限。这是一个示例：\n\n```python\nfor num in\
  \ range(1, 5):\n    print(num)\n```\n\n这段代码将显示以下内容：\n\n```\n1\n2\n3\n4\n```\n\n\
  默认情况下，`range` 函数产生的数字序列中列表中的每个连续数字比前一个增加 `1`。如果你向 `range` 函数传递第三个参数，该参数将用作“步长值”（step\
  \ value）。序列中的每个连续数字不再增加 `1`，而是增加步长值所示的数值。这是一个示例：\n\n```python\nfor num in range(1,\
  \ 10, 2):\n    print(num)\n```\n\n在这一 `for` 语句中，向 `range` 函数传递了三个参数：\n\n* 第一个参数\
  \ `1` 是序列的起始值。\n* 第二个参数 `10` 是列表的结束界限。这意味着序列中的最后一个数字将是 `9`。\n* 第三个参数 `2` 是步长值。这意味着序列中的每个连续数字都会加上\
  \ `2`。\n\n这段代码将显示以下内容：\n\n```\n1\n3\n5\n7\n9\n```\n\n# 在循环内部使用目标变量\n\n在 `for` 循环中，`target`\
  \ 变量的作用是在循环迭代时引用序列中的每一项。在许多情况下，在循环体内部使用 `target` 变量进行计算或其他任务是有帮助的。例如，假设你需要编写一个程序，显示\
  \ `1` 到 `10` 的数字及其平方，并采用如下表所示的表格：\n\n| 数字 | 平方 |\n|---|---|\n| 1 | 1 |\n| 2 | 4\
