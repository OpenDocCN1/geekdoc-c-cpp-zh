- "# Python 入门指南（第4版）\n\n\n\n\n\n\n\n\n\n\n\n\n\n1 17\n\n\n\n\n\n# 第 3 章\n\n\n## 前言\n\
  \n欢迎阅读 Python 入门（Starting Out with Python）第四版。本书使用 `Python` 语言教授编程概念和解决问题的技能，不假设读者具备任何先编程经验。通过易于理解的示例、伪代码、流程图和其他工具，学生将学习如何设计程序逻辑，然后使用\
  \ `Python` 实现这些程序。本书非常适合入门编程课程，或以 `Python` 为教学语言的编程逻辑与设计课程。\n\n\n\n\n\nPython 是一门完全面向对象的编程语言，但学生在开始\
  \ Python 编程时不需要理解面向对象的概念。本文首先向学生介绍数据存储、输入输出、控制结构、函数、序列与列表、文件 I/O 以及从标准库类创建的对象的基础。。，学生将学习编写类，探索继承和多态主题，并学习编写递归函数。最后，学生将学习开发简单的事件驱动\
  \ `GUI` 应用程序。\n\n## 第四版的修订\n\n本书清晰的写作风格与上版保持一致。然而，书中进行了许多新增和改进，总结如下：\n\n*   在第 2\
  \ 章到第 5 章中新增了关于 Python Turtle 绘图图形库的新章节。龟绘图库是 Python 的标准部分，它是向从未写过代码的学生介绍编程概念的一种有趣且具有启发性的方式。该库允许学生编写\
  \ Python 语句，通过在画布上移动光标来绘制图形。本版新增的章节包括：\n    *   第 2 章：龟绘图简介\n    *   第 3 章：确定乌的状态\n\
  \    *   第 4 章：使用循环绘制设计\n    *   第 5 章：用函数模块化龟绘图代码\n    新增的龟绘图章节设计时考虑了灵活性。它们可以被作为可选材料、整合到现有的教学大纲中，或者完全跳过。\n\
  *   第 2 章新增了一个关于命名常数的章节。虽然 Python 不支持真正的常量，但你可以创建变量名来表示在程序执行时不应改变的值。这一节教授学生避免使用“魔术数字”，并创建符号名称，使他们的代码更具自文档性且易于维护。\n\
  *   第 7 章新增了一个关于使用 `matplotlib` 包从列表绘制图表和图形的章节。该新章节描述了如何安装 `matplotlib` 包，以及如何使用它来绘制折线图、柱状图和饼图。\n\
  *   第 13 章新增了一个关于在 `GUI` 应用程序中使用 `Canvas` 小部件创建图形的章节。该新章节描述了如何使用 `Canvas` 小部件绘制线条、矩形、椭圆、弧、多边形和文本。\n\
  *   书中到处添加了几个新的、更具挑战性的编程题。\n*   附录 E 是一个新的附录，讨论了 `import` 语句的各种形式。\n*   附录 F 是一个新的附录，讨论了\
  \ `import` 语句的各种形式。\n\n## 各章节简述\n\n## 第 1 章：计算机简介\n本章介绍了计算机的工作原理、交互模式、脚本模式以及 IDLE。介绍了变量和数据类型。\n\
  \n## 第 2 章：输入、处理与输出\n本文向学生介绍数据存储、输入输出、控制结构、函数、序列与列表、文件 I/O 以及从标准库类创建的对象。介绍了 turtle\
  \ 库。\n\n## 第 3 章：选择结构与布尔逻辑\n在本章中，学生学习关系运算符和布尔表达式。涵盖了 `if`、`if-else` 和 `elif` 语句。\n\
  \n## 第 4 章：重复结构\n本章展示了如何使用 `while` 循环和 `for` 循环创建重复结构。讨论了计数器、累加器、运行总以及。\n\n## 第\
  \ 5 章：函数\n在本章中，学生首先学习编写空函数。本章展示了使用函数模块化程序的好处，并讨论了自顶向的设计方法。然后学生将学习向函数传递参数。\n\n##\
  \ 第 6 章：文件与异常\n本章介绍了顺序文件输入输出。学生学习如何读取和写入大数据并将数据存储为字段和记录。本章最后讨论了异常，并教授学生如何编写异常处理代码。\n\
  \n## 第 7 章：列表与元组\n本章介绍了 Python 中的序列概念，并探索了常用的 Python 序列：列表和元组。学生学习使用列表进行数组操作，如在列表中存储对象、遍历列表、在列表中查找项目以及计算列表项目的和和平均值。本章讨论了切片以及许多列表方法。涵盖了一维和二维列表。本章还包含了对\
  \ `matplotlib` 包的讨论，以及如何\n\n## 关于字符串\n在本章中，学生学习从底层处理字符串。讨论了字符串切片和遍历字符串单个字符的算法，并介绍了用于字符和文本处理的内置函数和字符串方法。\n\
  \n## 第 9 章：字典与集合\n本章介绍了字典和集合数据结构。学生学习在字典中以键值对的形式存储数据、查找值、修改现有值、添加新键值对以及删除键值对。学生学习在集合中作为唯一元素存储值，并执行常见的集合操作，如并集、交集、差集和对称差。本章最后讨论了对象序列化并介绍了\
  \ Python `pickle` 模块。\n\n## 第 10 章：类与面向对象编程\n学习编写类，探索继承和多态主题，并学习编写递归函数。最后，学生将学习开发简单的事件驱动\
  \ `GUI` 应用程序。\n\n\n\n\n\n本章比较了过程化编程与面向对象编程的实践。它涵盖了类和对象的的基础概念。讨论了属性、方法、封装与数据隐藏、`__init__`\
  \ 函数（类似于构造函数）、访问器和变异器（mutators）。学生将学习如何使用 UML 对类进行建模，以及如何在特定问题中寻找类。\n\n# 第 11 章：继承\n\
  \n本章将继续对类的研究，主题是继承和多态。涵盖的主题包括超类、子类、`__init__` 函数在继承中的工作原理、方法重写以及多态性。\n\n# 第 12 章：递归\n\
  \n本章讨论了递归及其在解决问题中的应用。书中提供了递归调的可视化追踪，并讨论了递归的应用。展示了许多任务的递归算法，例如计算阶乘、寻找最大公约数 (GCD)\
  \ 以及对列表范围内的值求和，并展示了经典的哈诺塔示例。\n\n# 第 13 章：GUI 编程\n\n本章讨论了使用 Python 中的 `tkinter` 模块设计\
  \ GUI 应用程序的基本方面。涵盖了基础组件，如标签、按钮、输入框、单选按钮、复选按钮和对话框。学生还将学习 GUI 应用程序中事件的工作原理，以及如何编写回调函数来处理事件。本章还讨论了\
  \ `Canvas` 组件，以及如何使用它绘制线条、矩形、圆形、弧、多边形和文本。\n\n# 录 A：安装 Python\n\n本录解释了如何下载和安装 Python\
  \ 3 解释器。\n\n# 录 B：IDLE 简介\n\n本附录介绍了 Python 自带的 IDLE 集成开发环境。\n\n# 录 C：ASCII 字符集\n\
  \n作为参考，附录列出了 ASCII 字符集。\n\n# 录 D：预定义命名颜色\n\n附录列出了可以在 turtle 图形库、`matplotlib` 和 `tkinter`\
  \ 中使用的预定义颜色名称。\n\n# 录 E：关于 `import` 语句更多信息\n\n附录讨论了使用 import 语句的各种方法。例如，你可以使用 import\
  \ 语句导入模块、类、函数，或者为模块分配别名。\n\n# 录 F：使用 `pip` 工具安装模块\n\n附录讨论了如何使用 `pip` 工具从 Python\
  \ 包索引（PyPI）安装第三方模块。\n\n# 录 G：检查点答案\n\n附录提供了书中各处检查点（Checkpoint）问题的答案。\n\n# 本书的结构\n\
  \n本书以循序渐进的方式教授编程。每一章涵盖一组主要主题，并在学生阅读书籍的过程中不断构建知识。虽然章节可以按照现有顺序轻松教学，但你对希望涵盖它们的顺序也有一定的灵活性。图\
  \ P-1 显示了章节依赖关系。每个框代表一个章节或一组章节。箭头从一个章节指向在其必须涵盖的章节。\n\n![说明章节依赖关系的流程图。](img/fm_00100.png)\n\
