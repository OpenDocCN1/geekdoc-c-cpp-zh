  \n## 算法工作台\n\n1. 编写一个程序打开名为 `my_name.txt` 的输出文件，写入你的名字，然后关闭文件。\n2. 编写一个程序打开问题 1\
  \ 创建的 `my_name.txt` 文件，从文件中读取名称并在屏幕上显示它，然后关闭文件。\n3. 编写一个程序打开名为 `number_list.txt`\
  \ 的输出文件，使用循环将 1 到 100 的数字写入文件，然后关闭文件。\n4. 编写一个程序打开问题 3 创建的 `number_list.txt` 文件，从文件中读取所有数字并显示它们，然后关闭文件。\n\
  5. 修改你在问题 4 中编写的代码，使其加上从文件中读取的所有数字并显示它们的总和。\n6. 编写代码打开名为 `number_list.txt` 的输出文件，但如果它存在则不删除内容。\n\
  7. 磁盘上存在一个 `students.txt` 文件。该文件包含若干记录，每个记录包含两个字段：(1) 学生姓名，(2) 学生的期末成绩。编写代码删除包含“John\
  \ Perz”的记录。\n8. 磁盘上存在一个 `students.txt` 文件。该文件包含若干记录，每个记录包含两个字段：(1) 学生姓名，(2) 学生的期末成绩。编写代码将\
  \ Julie Milan 的成绩改为 100。\n9. 以下代码将显示什么？\n```\ntry:\n  x = float('abc123')\n  print('转换完成。')\n\
  except IOError:\n  print('此代码导致 IOError。')\nexcept ValueError:\n  print('此代码导致 ValueError。')\n\
  ```\n10. 以下代码将显示什么？\n```\ntry:\n  x = float('abc123')\n  print(x)\nexcept IOError:\n\
  \  print('此代码导致 IOError。')\nexcept ZeroDivisionError:\n  print('此代码导致 ZeroDivisionError。')\n\
  except:\n  print('发生了错误。')\n```\n\n### 编程练习\n\n1. **文件显示**\n假设一个包含一系列整数的文件名为 `numbers.txt`\
  \ 并存在于磁盘上。编写一个程序显示文件中所有的数字。\n\n2. **文件头显示**\n编写一个程序要求用户输入文件名。程序应只显示文件内容的前五行。如果文件少于五行，则应显示文件的全部内容。\n\
  \n3. **行号**\n编写一个程序要求用户输入文件名。程序应显示文件内容，并在每行前面加上一个行号并跟着冒号。行号从 1 开始计数。\n\n4. **项目计数器**\n\
  \n\n\n\n假设一个包含一系列名称（字符串类型）的文件命名为 `names.txt` 且该文件存在于计算机磁盘上。编写一个程序，显示文件中存储的名称数量。\n\
