  \ 第 54 行 `Canvas` 使其内容可见，第 57 行启动 `tkinter` 模块的 `mainloop`。\n\n# 绘制多形：`create_polygon`\
  \ 方法\n\n`create_polygon` 方法在 `Canvas` 上绘制一个闭合的多形。多形由多个连接的线段组成。两条线段连接的点称为 `vertex`（顶点）。以下是调用该方法的通用格式：\n\
  \n```\ncanvas_name.create_polygon(x1, y1, x2, y2, ...)\n```\n\n参数 `x1` 和 `y1` 是第一个顶点的\
  \ (`X`, `Y`) 坐标，`x2` 和 `y2` 是第二个顶点的 (`X`, `Y`) 坐标，依此类推。该方法将通过从最后一个顶点到第一个顶点绘制一条线来自动闭合多形。在通用格式中，`options\
  \ ...` 表示你可能传递给方法的若干可选参数。\n\n| 参数 | 描述 |\n| :--- | :--- |\n| `dash=value` | 此参数导致多形的轮廓变为虚线。第一个整数指定绘制的像素数，第二个整数指定跳过的像素数。例如，参数\
  \ `dash=(5, 2)` 将绘制 5 像素并跳过 2 像素，直到线条结束。 |\n| `fill=value` | 指定填充多形的颜色。该值是一个字符串。有许多预定义的颜色名称可以使用，参见附录\
  \ D 中的完整列表。（如果省略 `fill` 参数，多形将填充。） |\n| `outline=value` | 指定多形的轮廓颜色。该值是一个字符串。有许多预定义的颜色名称可以使用，参见附录\
  \ D 中的完整列表。常用颜色包括 'red'、'green' 和 'cyan'。（如果省略 `outline` 参数，默认值为黑色。） |\n| `smooth=value`\
  \ | 默认情况下，`smooth` 参数设置为 `False`，使方法绘制连接指定点的直线。如果你指定 `smooth=True`，线条将绘制为样条。 |\n\
  | `width=value` | 该值是一个整数，指定多形的轮廓宽度（以像素为单位）。例如，参数 `width=5` 使轮廓变为 5 像素宽。默认认为 1 像素。\
