  你是否注意到程序运行时，第一个 `Radiobutton` 初始是被选中的？这是因为我们在第第 20 行将 `radio_var` 对象的值设置为了 1。`radio_var`\
  \ 对象不仅可以用来判断哪个 `Radiobutton` 被选中，还可以用于选中某个特定的 `Radiobutton`。\n\n如果你愿意，可以为 `Radiobutton`\
  \ 指定一个回调函数。这里有一个示例：\n\n```python\nself.rb1 = tkinter.Radiobutton(self.top_frame,\n\
  \                               text='Option 1',\n                             \
