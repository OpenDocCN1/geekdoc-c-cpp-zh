  \ `ackermann(m, n)` 来求解阿卡曼函数。在函数中使用以下逻辑：\n\n```\nIf m = 0 then return n + 1 \nIf\
  \ n = 0 then return ackermann(m – 1, 1) \nOtherwise, return ackermann(m – 1, ackermann(m,\
  \ n – 1))\n```\n\n一旦设计好函数，通过使用较小的 `m` 和 `n` 值调用它进行测试。\n\n# 第 13 章 GUI 编程\n\n## 13.1\
  \ 图形用户界面\n\n### 概念\n\n图形用户界面允许用户使用图标、按钮和对话框等图形元素与操作系统或其他程序进行交互。\n\n计算机的`user interface`（用户界面）是用户与之交互的部分。用户界面的一部分由硬件设备组成，如键盘和视频显示器。用户界面的另一部分在于操作系统接受用户命令的方式。多年来，用户与操作系统交互的唯一方法是通过`command\
  \ line interface`（命令行界面），如图 13-1 所示。\n\n# GUI 程序是事件驱动的\n\n在如命令行界面之类的文本环境中，程序决定了事情发生的顺序。例如，考虑一个计算矩形面积的程序。首先，程序提示用户输入矩形的宽度。用户输入宽度后，程序提示输入矩形的长度。用户输入长度后，程序计算面积。用户无法不按照要求的顺序输入数据。\n\
  \n\n\n\n然而，在 GUI 环境中，用户决定事件发生的顺序。例如，图 13-3 显示了一个用 Python 编写的 GUI 程序，该程序用于计算矩形的面积。用户可以按照自己喜欢的任何顺序输入长度和宽度。如果发生错误，用户可以删除输入的数据并重新输入。当用户准备好计算面积时，点击\
  \ `Calculate Area`（计算面积）按钮，程序就会执行计算。因为 GUI 程序必须响应用户的操作，因此它们被称为`事件驱动`的。用户导致事件的发生（例如点击按钮），而程序必须对这些事件做出响应。\n\
  \n![GUI 程序的对话框截图。](img/fg13_0030.png)\n\n# 图 13-3 一个 GUI 程序\n\n图 13-3 完整备用文本\n\n\
  # ![](img/ICON_CHECKPT.png) 知识点\n\n1. 13.1 什么是用户界面？\n2. 13.2 命令行界面是如何工作的？\n3. 13.3\
