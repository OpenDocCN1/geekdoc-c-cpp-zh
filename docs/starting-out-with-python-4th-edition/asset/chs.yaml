  \ `BankAccount` 类有一个属性：`_ _balance`。在任何时刻，`BankAccount` 对象的 `_ _balance` 属性将引用某个值。`_\
  \ _balance` 属性的值代表了对象在该时刻的状态。以下可能是显示 `BankAccount` 对象状态的代码示例：\n\n```\naccount =\
  \ bankaccount.BankAccount(1500.0)\nprint('The balance is $', format(savings.get_balance(),\
  \ ',.2f'), sep='')\n```\n\n显示对象的状态是一个常见的任务。它常见到许多程序员都会为他们的类配备一个返回对象状态字符串的方法。在 Python\
  \ 中，你为这个方法赋予特殊的名称 `_ _str_ _`。程序 10-9 显示了添加了 `_ _str_ _` 方法后的 `BankAccount` 类。`_\
  \ _str_ _` 方法出现在第 36 到 37 行。它返回一个指示账户余额的字符串。\n\n\n\n\n\n```python\n# The BankAccount\
  \ 类模拟了一个银行账户。\n\nclass BankAccount:\n    # __init__ 方法接收一个用于账户\n    # 余额的参数。它被赋值给\n\
  \    # _balance 属性。\n    def __init__(self, bal):\n        self._balance = bal\n\
  \n    # deposit 方法向账户\n    # 存款金额。\n    def deposit(self, amount):\n        self._balance\
  \ += amount\n\n    # withdraw 方法从账户中\n    # 提取金额。\n    def withdraw(self, amount):\n\
  \        if self._balance >= amount:\n            self._balance -= amount\n    \
  \    else:\n            print('Error: Insufficient funds')\n\n    # get_balance\
  \ 方法返回账户\n    # 余额。\n    def get_balance(self):\n        return self._balance\n\n\
  \    # __str__ 方法返回一个表示\n    # 对象状态的字符串。\n    def __str__(self):\n        return\
  \ 'The balance is $' + format(self._balance, ',.2f')\n```\n\n你并不直接调用 `__str__` 方法。相反，当你将对象作为参数传递给\
  \ `print` 函数时，它会被自动调用。程序 10-10 显示了一个示例。\n\n# 程序 10-10 (account_test2.py)\n\n```python\n\
