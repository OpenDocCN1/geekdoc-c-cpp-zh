  \ the Spotlight）部分中出的程序。\n\n# `if-elif-else` 语句\n\n即使程序 3-6 是一个简单的示例，但嵌套决策结构的逻辑相当复杂。Python\
  \ 提供了决策结构的特殊版本，称为 `if-elif-else` 语句，它使得这类逻辑的编写更加简单。以下是 `if-elif-else` 语句的一般格式：\n\
  \n```\nif condition_1: \n    statement \n    statement \n    etc. \nelif condition_2:\
  \ \n    statement \n    statement \n    etc.\n```\n\n根据需要插入尽可能多的 `elif` 子句 . . .*\n\
  \n```\nelse:\n    statement \n    statement \n    etc.\n```\n\n当执行语句时，会测试 `condition_1`。如果\
  \ `condition_1` 为真，则执行紧随其后的语句块，直到遇到 `elif` 子句。该结构的其余部分将被忽略。然而，如果 `condition_1` 为假，程序将跳转到紧下一个\
  \ `elif` 子句并测试 `condition_2`。如果它为真，则执行紧随其后的语句块，直到下一个 `elif` 子句。随后该结构的其余部分将被忽略。这个过程一直持续，直到找到一个真的条件，或者没有剩余的\
  \ `elif` 子句。如果没有没有条件为真，则执行 `else` 子句之后的语句块。\n\n以下是 `if-elif-else` 语句的一个示例。此代码的工作原理与程序\
  \ 3-6 第 14 到 26 行中的嵌套决策结构相同。\n\n```python\nif score >= A_SCORE:\n    print('Your\
  \ grade is A.')\nelif score >= B_SCORE:\n    print('Your grade is B.')\nelif score\
  \ >= C_SCORE:\n    print('Your grade is C.')\nelif score >= D_SCORE:\n    print('Your\
  \ grade is D.')\nelse:\n    print('Your grade is F.')\n```\n\n注意 `if-elif-else`\
  \ 语句使用的对齐和缩进：`if`、`elif` 和 `else` 子句全部对齐，而条件执行块块被缩进了。\n\n`if-elif-else` 语句并非必需，因为其逻辑可以用嵌套的\
  \ `if-else` 语句来实现。然而，在调试代码时，长系列嵌套的 `if-else` 语句有两个缺点：\n\n- 代码可能会变得复杂且难以理解。\n- 由于需要缩进，长系列嵌套的\
  \ `if-else` 语句可能会变得太长，导致在计算机屏幕上显示时需要水平滚动。此外，长语句在纸上打印时往往会“换行”，代码更难以阅读。\n\n`if-elif-else`\
  \ 语句的逻辑通常比长系列嵌套的 `if-else` 语句更容易遵循。而且由于 `if-elif-else` 语句中的所有子句都是对齐的，语句中的行长度往往更短。\n\
  \n### ![](img/ICON_CHECKPT.png) 检查点\n\n1. 3.13 将以下代码转换为 `if-elif-else` 语句：\n\n```python\n\
  if number == 1:\n    print('One')\nelse:\n    if number == 2:\n        print('Two')\n\
  \    else:\n        if number == 3:\n            print('Three')\n        else:\n\
  \            print('Unknown')\n```\n\n## 3.5 逻辑运算符\n\n### 概念\n\n逻辑 `and` 运算符和逻辑\
  \ `or` 运算符允许你连接多个布尔表达式以创建一个复合表达式。逻辑 `not` 运算符反转布尔表达式的真值。\n\nPython 提供了一组被称为`逻辑运算符`的运算符，你可以用它们创建复杂的布尔表达式。表\
  \ 3-3 描述了这些运算符。\n\n| 运算符 | 含义 |\n| --- | --- |\n| `and` | `and` 运算符将两个布尔表达式连接成一个复合表达式。两个子表达式都为真，复合表达式才为真。\
  \ |\n| `or` | `or` 运算符将两个布尔表达式连接成一个复合表达式。一个或两个子表达式为真，复合表达式即为真。只需其中一个子表达式为真即可。 |\n\
  | `not` | `not` 运算符反转布尔表达式的真值。 |\n\n### 表 3-3 逻辑运算符\n\n表 3-3 描述了这些运算符。 | \n\n| 运算符\
  \ | 含义 |\n| --- | --- |\n| `and` | `and` 运算符将两个布尔表达式连接成一个复合表达式。两个子表达式都为真，复合表达式才为真。\
  \ |\n| `or` | `or` 运算符将两个布尔表达式连接成一个复合表达式。一个或两个子表达式为真，复合表达式即为真。 |\n| `not` | `not`\
  \ 运算符反转布尔表达式的真值。 |\n\n### 表 3-4 复合表达式\n\n表 3-4 展示了逻辑运算符的示例。 | \n\n| 运算符 | 含义 |\n\
  | --- | --- |\n| `and` | `and` 运算符将两个布尔表达式连接成一个复合表达式。两个子表达式都为真，复合表达式才为真。 |\n| `or`\
  \ | `or` 运算符将两个布尔表达式连接成一个复合表达式。一个或两个子表达式为真，复合表达式即为真。 |\n| `not` | `not` 运算符反转布尔表达式的真值。\
  \ |\n\n\n\n\n\n`and` 和 `or` 运算符都执行短路求值。以下是 `and` 运算符的工作原理：如果 `and` 运算符左侧的表达式为假（false），则右侧的表达式将不会被检查。因为只要子表达式中有一个为假，复合表达式就会为假，检查剩余表达式将浪费\
  \ CPU 时间。因此，当 `and` 运算符发现其左侧表达式为假时，它会发生短路，不再评估右侧的表达式。\n\n以下是 `or` 运算符的短路求值工作原理：如果\
  \ `or` 运算符左侧的表达式为真（true），则右侧的表达式将不会被检查。因为表达式中只需要有一个为真即可，检查剩余表达式将浪费 CPU 时间。\n\n###\
  \ `not` 运算符\n\n`not` 运算符是一个元运算符，它取一个布尔表达式作为操作数并反转其逻辑值。换句话说，如果表达式为真，`not` 运算符返回假；如果表达式为假，`not`\
  \ 运算符返回真。以下是一个使用 `not` 运算符的 `if` 语句：\n\n```\nif not(temperature > 100):\n    print('This\
  \ is below the maximum temperature.')\n```\n\n首先，测试表达式（`temperature > 100`），结果为真或假。然后，将\
  \ `not` 运算符应用于该值。如果表达式（`temperature > 100`）为真，`not` 运算符返回假。如果表达式（`temperature >\
  \ 100`）为假，`not` 运算符返回真。之前的代码等同于询问：“温度是否不大于 100？”\n\n### 注意：\n\n在这个示例中，我们给表达式 `temperature\
  \ > 100` 加上了括号。这样做是为了清楚地表示我们将 `not` 运算符应用于表达式 `temperature > 100` 的值，而不仅仅是应用于 `temperature`\
  \ 变量。\n\n表 3-7 显示了 `not` 运算符的真值表。\n\n| 表达式 | 表达式的值 |\n| --- | --- |\n| `not` true\
  \ | false |\n| `not` false | true |\n\n# 表 3-7 `not` 运算符真值表\n\n# 重新回顾贷款资格程序\n\n\
  在某些情况下，可以使用 `and` 运算符来简化嵌套的决策结构。例如，回想程序 3-5 中的贷款资格程序使用了以下嵌套的 `if-else` 语句：\n\n```\n\
