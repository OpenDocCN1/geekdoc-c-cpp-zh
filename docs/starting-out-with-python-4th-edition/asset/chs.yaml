  图 9-1 完整替代文本\n\n# 第 10 章 类与面向对象编程\n\n## 10.1 过程化与面向对象编程\n\n### 概念\n\n过程化是一种编写软件的方法。是以程序中发生的过程或操作为中心的编程实践。面向对象编程以对象为中心。对象由抽象数据类型创建，这些类型将数据和函数封装在一起。\n\
  \n目前主要有两种编程方法：过程化和面向对象。最早的编程语言是过程化的，这意味着程序由一个或多个过程组成。你可以简单地将 `procedure` 理解为执行特定任务的函数，例如从用户处收集输入、执行计算、读取或写入文件、显示输出等。你到目前为止编写的程序在本质上都是过程化的。\n\
  \n通常，过程操作的是与过程分离的数据项。在过程化程序中，数据项通常从一个过程传递到另一个过程。正如你所想象的，过程化编程的重点在于创建操作程序数据的过程。然而，随着程序变得越来越大和复杂，数据与操作数据的代码分离可能会导致问题。\n\
  \n例如，假设你是一个编程团队的一员，该团队编写了一个广泛的客户数据库程序。该程序最初的设计是客户的姓名、地址和电话号码由三个变量引用。你的工作是设计几个函数，接受这三个变量作为参数并对它们进行操作。该软件已成功运行了一段时间，但你的团队被要求添加几个新功能来更新它。在修订过程中，高级程序员通知你，客户的姓名、地址和电话号码将不再存储在变量中，而是它们将存储在一个列表中。这意味着你必须修改你设计的所有函数，以便它们接受并处理列表而不是三个变量。进行这些大量的修改不仅工作量巨大，而且为代码中出现错误提供了可能。\n\
  \n过程化编程以创建过程（函数）为中心，而面向对象编程（`OOP`）以创建对象为中心。`object` 是一个包含数据和过程的软件实体。对象中包含的数据被称为对象的\
  \ `data attributes`（数据属性）。对象的数据属性仅仅是引用数据的变量。对象执行的过程被称为 `methods`（方法）。对象的方法是对对象数据属性执行操作的函数。从概念上说，对象是一个自包含的单元，由数据属性和操作这些数据属性的方法组成。这在图\
  \ 10-1\n\n## 图 10-1 包含数据属性和方法的对象\n\n图 10-1 完整替代文本\n\nOOP 通过封装和数据隐藏解决了代码与数据分离的问题。`Encapsulation`（封装）是指将数据和代码合并到单个对象中。`Data\
  \ hiding`（数据隐藏）是指对象向外部代码隐藏其数据属性的能力。只有对象的方法可以直接访问并更改对象的数据属性。\n\n对象通常会隐藏其数据，但允许外部代码访问其方法。如图\
  \ 10-2\n\n## 图 10-2 外部代码与方法交互\n\n当对象的数据属性对外部代码隐藏，且对数据的访问限制在对象的方法时，数据属性就能防止意外损坏。此外，外部代码不需要知道数据的格式或内部结构。程序员与其交互的方式不需要。\n\
  \n除了解决代码和数据分离的问题，OOP 的使用还受到对象重用趋势的影响。对象不是一个独立的程序，而是被需要服务的程序使用的。例如，Sharon 是一个开发了一组渲染\
  \ 3D 图像对象的程序员。她是一个数学天才，精通计算机图形，因此她的对象被编码为执行所有的 3D 数学运算并处理硬件。Tom 正在为建筑事务所编写程序，他的应用程序需要显示\
  \ 3D 图像。由于时间紧迫且缺乏计算机图形知识，他可以使用 Sharon 的对象来进行渲染。\n\n# 对象的示例\n\n假设你的闹钟实际上是一个软件对象。如果是的话，它将具有以下数据属性：\n\
  \n*   `current_second`（0-59 之间的值）\n*   `current_minute`（0-59 之间的值）\n*   `current_hour`（1-12\
  \ 之间的值）\n*   `alarm_time`（有效的小令和）\n*   `alarm_is_set`（真或假）\n\n如所示，数据属性仅仅是定义闹钟当前状态的值。你作为闹钟对象的用户，不能直接操作这些数据属性，因为它们是\
  \ `private`（私有的）。要更改数据属性的值，你必须使用对象的方法。以下是闹钟对象的一些方法：\n\n*   `set_time`\n*   `set_alarm_time`\n\
  *   `set_alarm_on`\n*   `set_alarm_off`\n\n\n\n每个方法都操作一个或多个数据属性。例如，`set_time` 方法允许你设置闹钟的时间。你通过按下闹钟顶部的按钮来激活该方法。通过另一个按钮，你可以激活\
  \ `set_alarm_time` 方法。\n\n此外，另一个按钮允许你执行 `set_alarm_on` 和 `set_alarm_off` 方法。注意，所有这些方法都可以由位于闹钟外部的你激活。可以被对象外部实体访问的方法被称为\
  \ `public methods`（公共方法）。\n\n闹钟还有 `private methods`（私有方法），它们是对象私有内部机制的一部分。外部实体（例如你，即闹钟的用户）无法直接访问闹钟的私有方法。对象的设计初是自动执行这些方法并向你隐藏细节。以下是闹钟对象的私有方法：\n\
  \n*   `increment_current_second`\n*   `increment_current_minute`\n*   `increment_current_hour`\n\
  *   `sound_alarm`\n\n每秒钟 `increment_current_second` 方法都会执行一次。这会改变 `current_second`\
  \ 数据属性的值。当该方法执行时，如果 `current_second` 数据属性被设置为 59，则方法程序设定将 `current_second` 重置为 0，然后触发\
  \ `increment_current_minute` 方法执行。该方法会在 `current_minute` 数据属性上加 1，除非其被设置为 59。在这种情况下，它会将\
  \ `current_minute` 重置为 0 并触发 `increment_current_hour` 方法执行。`increment_current_minute`\
  \ 方法会将新时间与 `alarm_time` 进行比较。如果两个时间匹配且闹钟处于开启状态，就会执行 `sound_alarm` 方法。\n\n### ![](img/ICON_CHECKPT.png)\
  \ 检查点\n\n1. 10.1 什么是对象？\n2. 10.2 什么是封装？\n3. 10.3 为什么对象的内部数据通常对外部代码隐藏？\n4. 10.4 什么是公共方法？什么是私有方法？\n\
  \n# 10.2 类\n\n### 概念：\n\n类（class）是指定特定类型对象的数据属性和方法的代码。\n\n现在，让我们讨论一下软件中是如何创建对象的。在创建对象之前，必须由程序员对其进行设计。程序员确定必要的的数据属性和方法，然后创建一个\
  \ `class`。类是指定特定类型对象的数据属性和方法的代码。将类比比一张“蓝图”，可以据此创建对象。它的作用类似于房屋的蓝图。蓝图本身不是房屋，而是对房屋的详细描述。当我们使用蓝图建造真实的房屋时，我们可以说我们正在建造蓝图所描述的房屋的\
  \ `instance`（实例）。如果我们愿意，可以从同一张蓝图建造几座完全相同的房屋。每栋房子都是蓝图所描述房屋的独立实例。这个思想在图 10-3 中所示。\n\
  \n![上方是一个描述房屋的蓝图，下方是三栋相同房屋的轮廓。](img/fg10_00300.png)\n\n# 图 10-3 蓝图和根据蓝图建造的房屋\n\n\
  另一种思考类和对象之间差异的方法是思考饼干模具和饼干之间的区别。虽然饼干模具本身不是饼干，但它描述了饼干。饼干模具可以制作几块饼干，如图 10-4 所示。将类比作饼干模具，而将从类创建的对象比作饼干。\n\
  \n![上方是一个星形饼干模具的插图，下方是三个相同的星形饼干。](img/fg10_00400.png)\n\n# 图 10-4 饼干模具的比喻\n\n所以，类是对对象特征的描述。当程序运行时，它可以利用类在内存中创建所需的任意数量特定类型的对象。从类创建的每个对象都称为该类的\
  \ `instance`。\n\n例如，杰西卡是一个昆虫学家（研究昆虫的人），她也喜欢编写计算机程序。她设计了一个程序来分类不同类型的昆虫。作为程序的一部分，她创建了一个名为\
  \ `Insect` 的类，该类指定了所有昆虫类型共有的特征。`Insect` 类是一个可以据此创建对象的规范。接下来，她编写了编程语句来创建一个名为 `housefly`（家蝇）的对象，它是\
  \ `Insect` 类的的一个实例。`housefly` 对象是一个占用计算机内存并存储有关家蝇数据的实体。它具有 `Insect` 类指定的物理属性和方法。然后她编写了编程语句创建一个名为\
  \ `mosquito`（蚊子）的对象。`mosquito` 对象也是 `Insect` 类的的一个实例。它在内存中有自己的区域并存储有关蚊子的数据。尽管 `housefly`\
  \ 和 `mosquito` 对象是计算机内存中独立的实体，但它们都是从 `Insect` 类创建的。这意味着每个对象都具有 `Insect` 类描述的数据属性和方法。这在图\
  \ 10-5 中所示。\n\n![一张图显示了 housefly 和 mosquito 对象是如何作为 Insect 类的实例的。](img/fg10_00500.png)\n\
  \n# 图 10-5 `housefly` 和 `mosquito` 对象是 `Insect` 类的实例\n\n图 10-5 完整备用文本\n\n# 类定义\n\
  \n要创建一个类，你需要编写 `class definition`（类定义）。类定义是一组定义类方法的语句。让我们来看一个简单的例子。假设我们正在编写一个模拟硬币的程序。在程序中，我们需要反复抛掷硬币，每次判断它是正面朝上还是反面向上。采用面向对象的方法，我们将编写一个名为\
  \ `Coin` 的类，它可以执行硬币的行为。程序 10-1 显示了类定义，我们稍后会解释。注意，这不是完整的。\n\n# 程序 10-1 `(Coin 类，不是完整的程序)`\n\
  \n```\n 1  import random\n 2\n3  # The Coin 类模拟了一个可以\n 4  # 被抛掷的硬币。\n 5\n6  class\
  \ Coin:\n 7\n8      # The _init_ _ 方法将 sideup\n9      # 属性初始化为 'Heads'（正面）。\n10\n\
  11      def _init_ _(self):\n12         self.sideup = 'Heads'\n13\n14      # The\
  \ toss 方法在 0 到 1 的\n15      # 范围内生成一个随机数。如果该数字\n16      # 是 0，则 sideup 被设置为 'Heads'。\n\
  17      # 否则，sideup 被设置为 'Tails'（反面）。\n18\n19      def toss(self):\n20         if\
  \ random.randint(0, 1) == 0:\n21            self.sideup = 'Heads'\n22         else:\n\
  23            self.sideup = 'Tails'\n24\n25      # The get_sideup 方法返回 sideup\n\
  26      # 引用的值。\n27\n28      def get_sideup(self):\n29           return self.sideup\n\
  ```\n\n在第 1 行中，我们导入了 `random` 模块。这是必要的，因为我们使用 `randint` 函数来生成随机数。第 6 行是类定义的开始。它以关键字\
  \ `class` 开头，后面跟着类名 `Coin`，然后是冒号。\n\n适用于变量名的规则也适用于类名。然而，注意我们用大写字母开头类名 `Coin`。这不是强制要求的，但它是程序员之间广泛使用的惯例。这有助于在阅读代码时轻松区分类名和变量名。\n\
  \n`Coin` 类有三个方法：\n\n*   `_ _init_ _` 方法出现在第 11 行到第 12 行。\n\n\n\n\n* `toss` 方法出现在第\
  \ 19 到 23 行。\n* `get_sideup` 方法出现在第 28 到 29 行。\n\n除了它们出现在类内部之外，请注意这些方法的定义看起来和 Python\
  \ 中的任何其他函数定义没有区别。它们以一个头行开头，后面紧跟着一个缩进的语句块。\n\n仔细观察每个方法定义中的头行（第 11、19 和 28 行），你会发现每个方法都有一个名为\
  \ `self` 的参数变量：\n\n* 第 11 行：`def _ _init_ _(self):`\n* 第 19 行：`def toss(self):`\n\
  * 第 28 行：`def get_sideup(self):`\n\n类中的每个方法都要求 `self` 参数。回想我们之前对面向对象编程的讨论，方法是在特定对象的数据属性上操作的。当方法执行时，它必须有一种方式知道它应该操作哪个对象的数据属性。这就是\
  \ `self` 参数派用用场。当方法被调用时，Python 会让 `self` 参数指向该方法应该操作的特定对象。\n\n让我们来看看每个方法。第一个方法名为\
  \ `_ _init_ _`，定义在第 11 到 12 行：\n\n```\ndef _ _init_ _(self):\n    self.sideup =\
  \ 'Heads'\n```\n\n大多数 Python 类都有一个名为 `_ _init_ _` 的特殊方法，该方法会在内存中创建类的实例时自动执行。`_ _init_\
  \ _` 方法通常被称为*初始化方法*，因为它初始化了对象的数据属性。（方法名以两个下划线开头，后面跟着单词 `init`，最后又是两个下划线。）\n\n当对象在内存中被创建后，`_\
  \ _init_ _` 方法会立即执行，`self` 参数被自动赋值为刚刚创建的对象。在方法内部，执行第 12 行的语句：\n\n```\nself.sideup\
  \ = 'Heads'\n```\n\n该语句将字符串 `'Heads'` 赋值给刚刚创建的对象的 `sideup` 数据属性。由于这个 `_ _init_ _`\
  \ 方法，我们从 `Coin` 类创建的每个对象最初都会有一个被设置为 `'Heads'` 的 `sideup` 属性。\n\n### 注意：`_ _init_\
  \ _` 方法通常是类定义中的第一个方法。\n\n`toss` 方法出现在第 19 到 23 行：\n\n```\ndef toss(self):\n    if\
  \ random.randint(0, 1) == 0:\n        self.sideup = 'Heads'\n    else:\n       \
  \ self.sideup = 'Tails'\n```\n\n该方法也包含所需的 `self` 参数变量。当调用 `toss` 方法时，`self` 将自动引用方法要操作的对象。\n\
  \n`toss` 方法模拟了抛硬币的过程。当方法被调用时，第 20 行的 `if` 语句调用 `random.randint` 函数来获取 0 到 1 之间的随机整数。如果数字为\
  \ 0，则第 21 行的语句将 `'Heads'` 赋值给 `self.sideup`。否则，第 23 行的语句将 `'Tails'` 赋值给 `self.sideup`。\n\
  \n`get_sideup` 方法出现在第 28 到 29 行：\n\n```python\ndef get_sideup(self):\n    return\
  \ self.sideup\n```\n\n再次，该方法包含所需的 `self` 参数变量。该方法简单地返回 `self.sideup` 的值。每当我们想知道硬币哪一面朝上时，就会调用这个方法。\n\
  \n为了演示 `Coin` 类，我们需要编写一个完整的程序来使用它创建一个对象。`Coin` 类的定义出现在第 6 到 29 行。程序有一个 `main` 函数，出现在第\
  \ 32 到 44 行。\n\n### 程序 10-2 `(coin_demo1.py)`\n\n```\n 1  import random\n 2\n 3\
  \  # The Coin class simulates a coin that can\n 4  # be flipped.\n 5\n 6  class\
  \ Coin:\n 7\n 8      # The _ _init_ _ method initializes the\n 9      # sideup data\
  \ attribute with 'Heads'.\n10\n11       def _ _init_ _(self):\n12          self.sideup\
  \ = 'Heads'\n13\n14       # The toss method generates a random number\n15      \
  \ # in the range of 0 through 1. If the number\n16       # is 0, then sideup is\
  \ set to 'Heads'.\n17       # Otherwise, sideup is set to 'Tails'.\n18\n19     \
  \  def toss(self):\n20          if random.randint(0, 1) == 0:\n21              self.sideup\
  \ = 'Heads'\n22          else:\n23              self.sideup = 'Tails'\n24\n25  \
  \     # The get_sideup method returns the\n26       # sideup.\n27       def get_sideup(self):\n\
  28          return self.sideup\n29\n30 # The main function.\n31 def main():\n32\
  \     # Create an object from the Coin class.\n33     my_coin = Coin()\n34     #\
  \ Display the side of the coin that is up.\n35     print(\"The side is up:\", my_coin.get_sideup())\n\
  36     # Toss the coin.\n37     my_coin.toss()\n38     # Display the side of the\
  \ coin that is up.\n39     print(\"The side is up:\", my_coin.get_sideup())\n40\n\
  41 if __name__ == \"__main__\":\n42     main()\n```\n\n\n\n\n第 41 行的语句使用 `my_coin`\
  \ 引用的对象来调用 `toss` 方法。当该方法执行时，`self` 参数将引用 `my_coin` 对象。该方法会随机生成一个数字，然后使用该数字改变对象\
  \ `sideup` 属性的值。\n\n接下来执行第 44 行。该语句调用 `my_coin.get_sideup()` 来显示硬币朝上的一面。\n\n# 隐藏属性\n\
  \n在本章的早些部分，我们提到过对象的数据属性应该是私有的，这样只有对象的方法才能直接访问它们。这可以保护对象的数据属性免受意外损坏。然而，在在上一个示例中显示的\
  \ `Coin` 类中，`sideup` 属性并不是私有的。它可以被 `Coin` 类方法之外的语句直接访问。程序 10-3 展示了一个示例。注意，第 1 到\
  \ 30 行为了节省空间未显示。这些行包含了 `Coin` 类，并且它们与 程序 10-2 中的第 1 到 30 行相同。\n\n# 程序 10-3 `(coin_demo2.py)`\n\
  \n*省略了第 1 到 30 行。这些行与 程序 10-2 中的第 1 到 30 行相同。*\n\n```\n31  # 主函数。\n32  def main():\n\
  33      # 从 Coin 类中创建一个对象。\n34      my_coin = Coin()\n\n35\n36      # 显示硬币朝上的一面。\n\
  37      print('This side is up:', my_coin.get_sideup())\n\n38\n39      # 掷硬币。\n\
  40      print('I am tossing the coin ...')\n41      my_coin.toss()\n\n42\n43   \
  \   # 但现在我要作弊了！我要\n44      # 直接将对象的\n45      # sideup 属性的值更改为 'Heads'。\n46     \
  \ my_coin.sideup = 'Heads'\n\n47\n48\n      # 显示硬币朝上的一面。\n49      print('This side\
  \ is up:', my_coin.get_sideup())\n\n50\n51  # 调用主函数。\n52  main()\n```\n\n### 程序输出\n\
  \n```\nThis side is up: Heads\nI am tossing the coin ...\nThis side is up: Heads\n\
  ```\n\n第 34 行在内存中创建了一个 `Coin` 对象并将其赋值给变量 `my_coin`。第 37 行的语句显示硬币朝上的一面，然后第 41 行调用对象的\
  \ `toss` 方法。接着，第 46 行的语句将字符串 `'Heads'` 直接赋值给对象的 `sideup` 属性：\n\n```\nmy_coin.sideup\
  \ = 'Heads'\n```\n\n无论 `toss` 方法的结果如何，这条语句都会将 `my_coin` 对象的 `sideup` 属性更改为 `'Heads'`。正如你从程序的三个示例运行中看到的，硬币总是正面朝上落地！\n\
  \n如果我们真的想模拟一个正在投掷的硬币，那么我们不希望类外部的代码能够更改 `toss` 方法的结果。为了防止这种情况发生，我们需要将 `sideup` 属性设为私有。在\
  \ Python 中，你可以通过以两个下划线开头命名来隐藏属性。如果我们将 `sideup` 属性名称更改为 `__sideup`，那么 `Coin` 类外部的代码将无法访问它。程序\
  \ 10-4 展示了进行了此更改的类版本 `Coin` 类。\n\n# 程序 10-4 `(coin_demo3.py)`\n\n```\n 1  import\
  \ random\n 2\n 3  # Coin 类模拟一个可以\n 4  # 抛起的硬币。\n 5\n 6  class Coin:\n 7\n 8    \
  \   # __init__ 方法将\n 9       # __sideup 数据属性初始化为 'Heads'。\n10\n11      def __init__(self):\n\
  12          self.__sideup = 'Heads'\n13\n14      # toss 方法生成 0 到 1\n15      # 之间的随机数。如果数字\n\
  16      # 为 0，则 sideup 为 Heads。\n17      # 否则，sideup 被设为 'Tails'。\n18\n19      def\
  \ toss(self):\n20          if random.randint(0, 1) == 0:\n21              self.__sideup\
  \ = 'Heads'\n22          else:\n23              self.__sideup = 'Tails'\n24\n25\
  \      # get_sideup 方法返回\n26      # sideup 引用的值。\n27\n28      def get_sideup(self):\n\
  29          return self.__sideup\n30\n31  # 主函数。\n32  def main():\n33      # 从 Coin\
  \ 类中创建一个对象。\n34      my_coin = Coin()\n\n35\n36      # 显示硬币朝上的一面。\n37      print('This\
  \ side is up:', my_coin.get_sideup())\n\n38\n39      # 掷硬币。\n40      print('I am\
  \ tossing the coin ...')\n41      my_coin.toss()\n\n42\n43      # 但现在我要作弊了！我要\n\
  44      # 直接将对象的\n45      # sideup 属性的值更改为 'Heads'。\n46      my_coin.sideup = 'Heads'\n\
  \n47\n48      # 显示硬币朝上的一面。\n49      print('This side is up:', my_coin.get_sideup())\n\
  \n50\n51  # 调用主函数。\n52  main()\n```\n\n# 将类存储在模块中\n\n你目前为止看到的程序都将 `Coin` 定义放在使用它的语句同一个文件中。随着程序使用的类增加，例如我们决定将\
  \ `Coin` 类存储在一个名为 `coin` 的模块中。程序 10-5 显示了 `coin.py` 的内容。然后当我们在程序中使用 `Coin` 类时，可以导入\
  \ `coin` 模块。这在 程序 10-6 中演示。\n\n# 程序 10-5 `(coin.py)`\n\n```\n 1  import random\n\
  \ 2\n 3  # Coin 类模拟一个可以\n 4  # 抛起的硬币。\n 5\n 6  class Coin:\n 7\n 8       # __init__\
  \ 方法将\n 9       # __sideup 数据属性初始化为 'Heads'。\n10\n11      def __init__(self):\n\
  12          self.__sideup = 'Heads'\n13\n14      # toss 方法生成 0 到 1\n15      # 之间的随机数。如果数字\n\
  16      # 为 0，则 sideup 为 Heads。\n17      # 否则，sideup 被设为 'Tails'。\n18\n19      def\
  \ toss(self):\n20          if random.randint(0, 1) == 0:\n21              self.__sideup\
  \ = 'Heads'\n22          else:\n23              self.__sideup = 'Tails'\n24\n25\
  \      # get_sideup 方法返回\n26      # sideup 引用的值。\n27\n28      def get_sideup(self):\n\
  29          return self.__sideup\n30\n31  # 主函数。\n32  def main():\n33      # 从 Coin\
  \ 类中创建一个对象。\n34      my_coin = Coin()\n\n35\n36      # 显示硬币朝上的一面。\n37      print('This\
  \ side is up:', my_coin.get_sideup())\n\n38\n39      # 掷硬币。\n40      print('I am\
  \ tossing the coin ...')\n41      my_coin.toss()\n\n42\n43      # 但现在我要作弊了！我要\n\
  44      # 直接将对象的\n45      # sideup 属性的值更改为 'Heads'。\n46      my_coin.sideup = 'Heads'\n\
  \n47\n48      # 显示硬币朝上的一面。\n49      print('This side is up:', my_coin.get_sideup())\n\
  \n50\n51  # 调用主函数。\n52  main()\n```\n\n# 程序 10-6 `(coin_demo4.py)`\n\n```\n 1  #\
