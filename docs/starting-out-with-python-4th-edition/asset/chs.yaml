  You do not qualify for this loan.\n```\n\n# 使用逻辑运算符检查数值范围\n\n有时你需要设计一种算法来确定数值值是否在特定范围之内或在特定范围之外。在判断一个数字是否在范围内时，最好使用\
  \ `and` 运算符。例如，以下 `if` 语句测试 `x` 的值以确定其是否在 20 到 40 的范围内：\n\n```\nif x >= 20 and x\
  \ <= 40:\n    print('The value is in the acceptable range.')\n```\n\n此语句测试的复合布尔表达式只有当\
  \ `x` 大于或等于 20 且小于或等于 40 时才为真。`x` 的值必须在 20 到 40 的范围内，该复合表达式才为真。\n\n\n\n\n\n在判断一个数字是否在范围之外时，最好使用\
  \ `or` 运算符。以下语句判断 `x` 是否在 20 到 40 的范围之外：\n\n```\nif x < 20 or x > 40:\n    print('The\
  \ value is outside the acceptable range.')\n```\n\n在测试数字范围时，最重要的是不要混淆逻辑运算符的逻辑。例如，下面代码中的复合布尔表达式永远不会为\
  \ `True`：\n\n```python\n### This is an error!\nif x < 20 and x > 40:\n    print('The\
  \ value is outside the acceptable range.')\n```\n\n显然，`x` 不可能小于 20 的同时大于 40。\n\n\
