  \ ch == 'T' or ch == 't':\n15\t\t\t   count += 1\n16\t   # 打印结果。\n17\t   print('The\
  \ letter T appears', count)\n18\n19\t# 调用函数。\n20\tmain()\n```\n\n## 索引\n\n访问字符串单个字符的另一种方法是索引。字符串中的每个字符都有索引，从\
  \ 0 开始。第一个字符索引为 0，第二个字符索引为 1，以此此类推。这在图 8-2 中所示。当代码执行时，它将显示以下内容：\n\n![一张显示字符串‘Juliet’迭代的图](img/fg08_00100.png)\n\
  \n### 图 8-2 索引\n\n图 8-2 完整替代文本\n\n```\nJ\nu\nl\ni\ne\nt\n```\n\n`name` 变量引用一个具有六个字符的字符串，因此此循环将迭代六次。循环第一次迭代时，`ch`\
  \ 变量引用 `'J'`，第二次迭代时，`ch` 变量引用 `'u'`，以此此类推。\n\n\n\n第二个语句调用了 `len` 函数，并将 `city` 变量作为参数传递。该函数返回值\
  \ 6，即字符串 `'Boston'` 的长度。该值被赋值给变量 `size`。\n\n`len` 函数特别有用，它可以防止循环迭代到字符串末尾之后，如下所示：\n\
  \n```\ncity = 'Boston'\nindex = 0\nwhile index < len(city):\n\tprint(city[index])\n\
  \tindex += 1\n```\n\n注意，只要 `index` 小于字符串的长度，循环就会继续迭代。这是因为字符串中最后一个字符的索引总是比字符串的长度少\
  \ 1。\n\n# 字符串拼接\n\n字符串的一种常用操作是拼接，或将一个字符串附加到另一个字符串的末尾。你在前面的章节中已经见过使用 `+` 运算符拼接字符串的示例。`+`\
  \ 运算符会产生一个由其两个操作数的字符串组合成的字符串。下面的交互式演示了：\n\n```\n1  >>> message = 'Hello ' + 'world'\
  \ \n2  >>> print(message) \n3  Hello world\n4  >>>\n```\n\n第 1 行将字符串 `'Hello'` 和\
  \ `'world'` 拼接并产生字符串 `'Hello world'`。然后将字符串 `'Hello world'` 赋值给变量 `message`。第 2\
  \ 行打印由 `message` 变量引用的字符串。输出显示在第 3 行。\n\n这是另一个演示拼接的交互式演示：\n\n```\n1  >>> first_name\
  \ = 'Emily' \n2  >>> last_name = 'Yeager' \n3  >>> full_name = first_name + ' '\
  \ + last_name \n4  >>> print(full_name) \n5  Emily Yeager\n6  >>>\n```\n\n第 1 行将字符串\
  \ `'Emily'` 赋值给变量 `first_name`。第 2 行将字符串 `'Yeager'` 赋值给变量 `last_name`。第 3 行产生一个字符串，它是由\
  \ `first_name`、一个空格、紧接着 `last_name` 拼接而成的。生成的字符串被赋值给变量 `full_name`。第 4 行打印由 `full_name`\
  \ 引用的字符串。输出显示在第 5 行。\n\n你也可以使用 `+=` 运算符来执行拼接。下面的交互式演示了：\n\n```\n1  >>> letters =\
  \ 'abc' \n2  >>> letters += 'def' \n3  >>> print(letters) \n4  abcdef\n5  >>>\n\
  ```\n\n第 2 行的语句执行字符串拼接。它的工作原理相同：\n\n```\nletters = letters + 'def'\n```\n\n在执行第\
  \ 2 行的语句后，变量 `letters` 将引用字符串 `'abcdef'`。这里是另一个示例：\n\n```\n>>> name = 'Kelly'  \
  \            # name is 'Kelly'\n>>> name += ' '                 # name is 'Kelly\
  \ '\n>>> name += 'Yvonne'            # name is 'Kelly Yvonne'\n>>> name += ' ' \
  \                # name is 'Kelly Yvonne '\n>>> name += 'Smith'             # name\
  \ is 'Kelly Yvonne Smith'\n>>> print(name) e\nKelly Yvonne Smith\n>>>\n```\n\n请记住，`+=`\
  \ 运算符左侧的操作数必须是一个现有变量。如果你指定了一个不存在的变量，将抛出异常。\n\n# 字符串是不可变的\n\n在 Python 中，字符串是不可变的，这意味着它们一旦被创建，就不能被更改。某些操作（如拼接）给人一种它们正在修改字符串的印象，但实际上它们并没有这样做。例如，查看程序\
  \ 8-2。\n\n# 程序 8-2 `(concatenate.py)`\n\n```\n 1  # 这个程序拼接字符串。\n 2\n 3  def main():\n\
  \ 4     name  = 'Carmen'\n 5     print('The name is', name)\n 6     name  = name\
  \ + ' Brown'\n 7     print('Now the name is', name)\n 8\n 9  # 调用 main 函数。\n10 \
  \ main()\n```\n\n### 程序输出\n\n```\nThe name is Carmen\nNow the name is Carmen Brown\n\
  ```\n\n第 4 行的语句将字符串 `'Carmen'` 赋值给变量 `name`，如图 8-4 所示。第 6 行的语句将字符串 `' Brown'` 拼接到字符串\
  \ `'Carmen'` 上并将结果赋值给变量 `name`，如图 8-5 所示。从图中可以看出，原始字符串 `'Carmen'` 没有被修改。相反，创建了一个包含\
  \ `'Carmen Brown'` 的新字符串并将其赋值给变量 `name`。\n\n\n\n\n\n```\nletters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'\n\
  print(letters[0:26:2])\n```\n\n括号内的第三个数字是步长（step value）。如本示例所示，步长为 `2` 会导致切片包含字符串指定范围内的每隔第二个字符。该代码将打印以下内容：\n\
  \n```\n ACEGIKMOQSUWY\n```\n\n你也可以在切片表达式中使用负数作为索引，以引用相对于字符串末尾的位置。这里有一个示例：\n\n```\n\
  full_name = 'Patty Lynn Smith'\nlast_name = full_name[−5:]\n```\n\n请记住，Python 会将负索引添加到字符串的长度上以获得该索引所引的位置。此代码中的第二个语句将字符串\
  \ `'Smith'` 赋值给变量 `last_name`。\n\n## Note ![](img/ICON_NOTE.png)\n\n无效索引不会导致切片表达式抛出异常。例如：\n\
  \n- 如果 `end` 索引指定了字符串末尾之后的位置，Python 将使用字符串的长度。\n- 如果 `start` 索引指定了字符串开始之前的位置，Python\
  \ 将使用 0 代替。\n- 如果 `start` 索引大于 `end` 索引，切片表达式将返回空字符串。\n\n## Checkpoint ![](img/ICON_CHECKPT.png)\n\
