  string3.isspace() # 返回假\nstring3.isupper() # 返回假\n```\n\n### 修改方法\n\n虽然字符串是不可变的，意味着不能被修改，但它们有许多方法可以返回修改后的版本。表\
  \ 8-2 列出了这些方法中的几种。\n\n\n\n\n\n| `lower()` | 返回字符串的副本，将所有字母转换为小写。任何已经是小写的字符或非字母字符保持不变。\
  \ |\n| `lstrip()` | 返回字符串的副本，移除所有开的空白字符。开头空白字符包括出现在字符串开头的空格、换行符（`\\n`）和制表符（`\\t`）。\
  \ |\n| `lstrip(`char`)` | `char` 参数是一个包含单个字符的字符串。返回字符串的副本，移除字符串开头的所有 `char` 实例。\
  \ |\n| `rstrip()` | 返回字符串的副本，移除所有末尾的空白字符。末尾空白字符包括出现在字符串结尾的空格、换行符（`\\n`）和制表符（`\\\
  t`）。 |\n| `rstrip(`char`)` | `char` 参数是一个包含单个字符的字符串。该方法返回字符串的副本，移除字符串结尾的所有 `char`\
  \ 实例。 |\n| `strip()` | 返回字符串的副本，移除所有开头和末尾的空白字符。 |\n| `strip(`char`)` | 返回字符串的副本，移除字符串开头和结尾的所有\
  \ `char` 实例。 |\n| `upper()` | 返回字符串的副本，将所有字母转换为大写。任何已经是大写的字符或非字母字符保持不变。 |\n\n# 表\
  \ 8-2 字符串修改方法\n\n例如，`lower` 方法返回一个字符串的副本，将其所有字母转换为小写。以下是一个示例：\n\n```\nletters =\
  \ 'WXYZ'\nprint(letters, letters.lower())\n```\n\n这段代码将打印：\n\n```\nWXYZ wxyz\n```\n\
  \n`upper` 方法返回一个字符串的副本，将其所有字母转换为大写。以下是一个示例：\n\n```\nletters = 'abcd'\nprint(letters,\
  \ letters.upper())\n```\n\n这段代码将打印：\n\n```\nabcd ABCD\n```\n\n`lower` 和 `upper`\
  \ 方法对于进行不区分大小的字符串比较非常有用。字符串比较是区分区分大小的，这意味着大写字符和小写字符是被区分的。例如，在区分大小的比较中，字符串 `'abc'`\
  \ 不被认为与字符串 `'ABC'` 或字符串 `'Abc'` 相同，因为字符的大小不同。有时执行不区分大小的比较会更方便，这种比较会忽略字符的大小。在不区分大小的比较中，字符串\
  \ `'abc'` 被认为与字符串 `'ABC'` 和 `'Abc'` 相同。\n\n例如，看以下代码：\n\n```\nagain = 'y'\nwhile\
  \ again.lower() == 'y':\n   print('Hello')\n   print('Do you want to see that again?')\n\
  \   again = input('y = yes, anything else = no: ')\n```\n\n注意循环中的最后一条语句要求用户输入 `y`\
  \ 以再次显示消息。只要表达式 `again.lower() =='y'` 为真，循环就会继续迭代。如果变量 `again` 引用 `'y'` 或 `'Y'`，则该表达式将为真。\n\
  \n使用 `upper` 方法也可以实现类似的结果，如下：\n\n```\nagain = 'y'\nwhile again.upper() == 'Y':\n\
  \    print('Hello')\n    print('Do you want to see that again?')\n    again = input('y\
  \ = yes, anything else = no: ')\n```\n\n# 搜索与替换\n\n程序通常需要搜索子字符串，即出现在其他字符串中的字符串。例如，假设你在文字处理程序中打开了一个文档，并且需要搜索其中某处出现的某个单词。你正在搜索的单词是出现在较大字符串（文档）内部的子字符串。\n\
  \n表 8-3 列出了一些搜索子字符串的 Python 字符串方法，以及一个将子字符串出现处替换为字符串的方法。\n\n| 方法 |  |\n| --- | ---\
  \ |\n| `endswith(substring)` | `substring` 参数是一个字符串。如果字符串以 `substring` 结尾，该方法返回真。\
  \ |\n| `find(substring)` | `substring` 参数是一个字符串。该方法返回字符串中找到 `substring` 的最小索引。如果未找到\
  \ `substring`，该方法返回 −1。 |\n| `replace(old, new)` | `old` 和 `new` 参数都是字符串。该方法返回字符串的副本，将所有的\
  \ `old` 实例替换为 `new`。 |\n| `startswith(substring)` | `substring` 参数是一个字符串。如果字符串以\
  \ `substring` 开头，该方法返回真。 |\n\n# 表 8-3 搜索与替换方法\n\n`endswith` 方法确定字符串是否以指定的子字符串结尾。以下是一个示例：\n\
  \n```\nfilename = input('Enter the filename: ')\nif filename.endswith('.txt'):\n\
  \      print('That is the name of the')\n```\n\n\n\n\n默认情况下，`split` 方法使用空格作为分隔符（也就是说，它返回一个包含字符串中由空格分隔的单词列表）。你可以通过将分隔符作为参数传递给\
  \ `split` 方法来指定不同的分隔符。例如，假设一个字符串包含一个日期，如下所示：\n\n```\ndate_string = '11/26/2018'\n\
  ```\n\n如果你想将月、日、年拆分为列表中的各个项，可以使用 `'/'` 字符作为分隔符调用 `split` 方法，如下所示：\n\n```\ndate_list\
  \ = date_string.split('/')\n```\n\n在此语句执行后，`date_list` 变量将引用此列表：\n\n```\n['11',\
  \ '26', '2018']\n```\n\n`程序 8-10`演示了这一点。\n\n# 程序 8-10 `(split_date.py)`\n\n```\n\
  1   # 此程序调用了 split 方法，使用\n 2\t# '/' 字符作为分隔符。\n 3\n 4\tdef main():\n 5\t\t # 创建一个包含日期的字符串。\n\
  \ 6\t\t date_string = '11/26/2018'\n 7\n 8\t\t # 拆分日期。\n 9\t\t date_list = date_string.split('/')\n\
