  \n## 13.8 单选按钮和复选框\n\n### 概念：\n\n单选按钮（Radio buttons）通常以两个或更多为一组的形式出现，允许用户从几个可能的选项中选择一个。复选框可以单独出现也可以成组出现，允许用户进行是/否或开启/关闭的选择。\n\
  \n### 单选按钮\n\n当你想要用户从几个可能的选项中选择一个结果时，`Radio buttons` 非常有用。图 13-22 显示了一个包含了一组单选按钮的窗口。单选按钮可以被选中也可以取消选中。每个单选按钮都有一个小圆圈，当单选按钮被选中时，圆圈显示为填充状态，当未选中时则显示为空心。\n\
  \n![程序窗口截图，单列中显示有“Option 1”、“Option 2”和“Option 3”，每个选项前面都有一个单选按钮。Option 1 被选中。下方是标记为\
  \ OK 和 Quit 的按钮](img/fg13_02200.png)\n\n## 图 13-22 一组单选按钮\n\n你使用 `tkinter` 模块的 `Radiobutton`\
  \ 类来创建 `Radiobutton` 组件。在框架（如 `Frame`）中，只能有一个 `Radiobutton` 组件被选中。点击 `Radiobutton`\
  \ 会选中它并自动取消选择其他 `Radiobutton`。由于框架内只能选中一个 `Radiobutton`，因此它们是互斥的。\n\n### ![](img/ICON_NOTE.png)\
  \ 注意：\n\n“单选按钮”这个名称指的是以前用于选择电台的按钮。一次只能按下一个。当你按下一个时，另一个按钮会弹出。\n\n`tkinter` 模块提供了一个名为\
  \ `IntVar` 的类，可以与 `Radiobutton` 组件一起使用。当你创建一个 `Radiobuttons` 时，将它们全部关联同一个 `IntVar`\
  \ 对象。你为每个 `Radiobutton` 组件分配了一个唯一的整数值。当其中一个 `Radiobutton` 组件被选中时，它将其唯一的整数值存储在 `IntVar`\
  \ 对象中。\n\n程序 13-12 演示了如何创建和使用 `Radiobuttons`。图 13-23 显示了程序显示的窗口。当用户点击 OK 按钮时，会弹出一个信息对话框，指示哪个\
  \ `Radiobuttons` 被选中。\n\n![与图 13-22 相同的程序窗口截图](img/fg13_02300.png)\n\n## 图 13-23\
  \ 程序 13-12 显示的窗口\n\n```python\n# Program 13-12 radiobutton_demo.py\n```\n\n\n\n\n\
