  3. 3.10 当你编写 `if-else` 语句时，在什么情况下位于 `else` 子句后面的语句会被执行？\n\n# 3.3 比较字符串\n\n### 概念：\n\
  \nPython 允许你比较字符串。这允许你创建测试字符串值的决策结构。\n\n在之前的示例中，你已经看到在决策结构中如何比较数字。你也可以比较字符串。例如，看下面的代码：\n\
  \n```\nname1 = 'Mary'\nname2 = 'Mark'\nif name1 == name2:\n    print('The names\
  \ are the same.')\nelse:\n    print('The names are NOT the same.')\n```\n\n`==`\
  \ 运算符比较 `name1` 和 `name2` 以确定它们是否相等。因为字符串 `'Mary'` 和 `'Mark'` 不相等，`else` 子句将显示消息\
  \ `'The names are NOT the same.'`。\n\n让我们来看另一个例子。假设 `month` 变量引用一个字符串。下面的代码使用 `!=`\
  \ 运算符来确定 `month` 引用的值是否等于 `'October'`：\n\n```\n if month != 'October':\n       \
  \ print('This is the wrong time for Octoberfest!')\n```\n\n程序 3-3 是一个演示如何比较两个字符串的完整程序。该程序提示用户输入密码，然后判断输入的字符串是否等于\
  \ `'prospero'`。\n\n### 程序 3-3 `(password.py)`\n\n```\n 1  # 这个程序比较两个字符串。\n 2  #\
  \ 从用户处获取密码。\n 3  password = input('Enter the password: ')\n 4\n 5  # 判断是否输入了正确的\n\
  \ 6  # 密码。\n 7  if password == 'prospero':\n 8       print('Password accepted.')\n\
  \ 9  else:\n10        print('Sorry, that is the wrong password.')\n```\n\n**程序输出**（输入部分加粗显示）\n\
  \n```\nEnter the password: ferdinand \nSorry, that is the wrong password.\n```\n\
  \n**程序输出**（输入部分加粗显示）\n\n```\nEnter the password: prospero \nPassword accepted.\n\
  ```\n\n字符串比较是区分大小写的。例如，字符串 `'saturday'` 和 `'Saturday'` 不相等，因为第一个字符串中的 `\"s\"` 是小写的，而在第二个字符串中是大写的。下面是程序\
  \ 4-3 的示例，显示了当用户输入 `Prospero`（大写 `P`）作为密码时会发生什么。\n\n**程序输出**（输入部分加粗显示）\n\n```\n\
  Enter the password: Prospero \nSorry, that is the wrong password.\n```\n\n### ![](img/ICON_TIP.png)\
  \ 提示：\n\n在第 8 章中，你将学习如何处理字符串以便进行不区分大小写的比较。\n\n# 其他字符串比较\n\n除了确定字符串是否相等之外，你还可以确定一个字符串是否大于或小于另一个字符串。这是一个很有功能，因为程序员通常需要设计按某种顺序对字符串进行排序的程序。\n\
  \n回想第 1 章，计算机实际上并没有在内存中存储诸如 A、B、C 等字符。相反，它们存储的是代表字符的数字代码。[第 1 章] 提到 ASCII（信息交换美国标准代码）是一种常用的字符编码系统。你可以在附录\
  \ C 中查看 ASCII 代码，但这里有关于它的一些事实：\n\n*   大写字母 A 到 Z 由数字 65 到 90 表示。\n*   小写字母 a 到 z\
  \ 由数字 97 到 122 表示。\n*   当数字 0 到 9 作为字符存储在内存中，它们由数字 48 到 57 表示。（例如，字符串 `'abc123'`\
  \ 在内存中存储为代码 97, 98, 99, 49, 50 和 51。）\n*   空格由数字 32 表示。\n\n除了在内存中建立一组表示字符的数字代码外，ASCII\
  \ 还建立了一种字符的顺序。字符“A”在字符“B”之前，“B”在字符“C”之前，依此类推。\n\n当程序比较字符时，它实际上是在比较字符的代码。例如，看下面的\
  \ `if` 语句：\n\n```\nif 'a' < 'b':\n    print('The letter a is less than the letter\
  \ b.')\n```\n\n这段代码判断字符 `'a'` 的 ASCII 代码是否小于字符 `'b'` 的 ASCII 代码。表达式 `'a' < 'b'`\
  \ 为真，因为 `'a'` 的代码小于 `'b'` 的代码。\n\n\n\n\n```python\n 1  # 此程序使用 < 运算符比较字符串。\n 2 \
  \ # 从用户处获取两个名字。\n 3  name1 = input('输入一个名字（姓氏在前）： ')\n 4  name2 = input('输入另一个名字（姓氏在前）：\
