  - 选项 4: 强制类型转换 (Casting)\n\n**正确答案**: 1\n\n## 降级 (Demotion)\n**解释**: 将较大的数据类型转换为较小数据类型的结果称为降级。当较大或更宽的值自动转换为较小或更窄类型时，就会发生降级。降级可能会导致数据或精度的丢失，因为目标类型可能无法表示源类型的完整范围。例如，将一个\
  \ `float` 值赋值给 `int` 变量会导致降级，其中小数部分会被截断。降级是 C 语言中隐式类型转换的一种机制，必须考虑它以确保转换的正确性和有效性。\n\
