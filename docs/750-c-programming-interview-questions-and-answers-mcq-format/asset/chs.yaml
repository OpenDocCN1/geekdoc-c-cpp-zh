  \ 以及赋值给常量的 `[value]` 来定义常量。例如，`const int MAX_VALUE = 100;` 定义了一个名为 `MAX_VALUE` 值为\
  \ `100` 的整数常量。或者，你可以使用 `#define` 预处理器指令来定义常量。例如，`#define MAX_VALUE 100` 创建了一个名为\
  \ `MAX_VALUE` 值为 `100` 的常量。常量用于表示在程序执行期间不应修改的固定值。\n\n## 头文件\n\n问题：在 C 语言中包含头文件的语法是什么？\n\
