  \ function name;`。以下是各个部分的分解：\n- `[return type]`：指定函数返回的值的数据类型。如果函数不返回值，则可以是 `void`。\n\
  - `[function name]`：代表函数的名称。选择一个反映函数用途描述性名称。\n- `[parameter list]`：列出函数期望的输入参数，每个参数都有自己的数据类型和名称。参数是可选的，如果函数不需要任何参数，列表可以为空或包含\
  \ `void`。例如，`int add(int a, int b);` 声明了一个名为 `add` 的函数，它接受两个整数参数并返回一个整数值。函数允许你封装代码块，以便在程序中重用和模块化。\n\
  \n## 注释\n\n问题：在 C 语言中如何如何写单行注释？\n\n选项 1: `// [comment text]`\n\n选项 2: `/* [comment\
