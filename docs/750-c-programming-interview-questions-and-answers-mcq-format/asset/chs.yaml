  \ 不是一元运算符；它是一个二元比较运算符，用于检查相等性。`=` 是赋值运算符，用于给变量赋值。理解一元运算符与其他类型运算符之间的区别对于确保在程序中正确使用至关重要。\n\
  \n## 问题 7\n以下哪些是 `C` 中向函数传递参数的有效方法？（选择所有适用）\n\n- 选项 1：按值传递\n- 选项 2：按引用传递\n- 选项 3：按指针传递\n\
