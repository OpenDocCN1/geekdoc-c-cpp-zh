  - **按值传递：** 在此方法下，函数接收参数值的副本。\n- **按引用传递：** 在此方法下，函数接收参数的地址。\n- **按指针传递：** 在此方法下，函数接收参数的地址。\n\
  - **按常量传递：** 在此方法下，函数接收只读的参数值。\n\n## 问题 8\n以下哪些是 `C` 中的头文件？（选择所有适用）\n\n- 选项 1：`stdio.h`\n\
  - 选项 2：`math.h`\n- 选项 3：`string.h`\n- 选项 4：`input.h`\n\n**正确答案：1, 2, 3**\n\n**解释：**\
  \ 在 `C` 中，头文件用于提供程序所需的函数原型、类型定义、宏和其他声明。有效的头文件包括：\n- `stdio.h`：提供了 `printf()` 和 `scanf()`\
  \ 等输入输出函数。\n- `math.h`：包含了数学函数和常量。\n- `string.h`：包含了字符串处理函数，如 `strcpy()` 和 `strlen()`。\n\
  - `input.h`：不是标准头文件。它可能是特定程序的自定义头文件。标准头文件通常带有 `.h` 扩展，并使用 `#include` 指令包含。这些文件对于访问预定义的函数、常量和数据类型至关重要。\n\
  \n## 问题 9\n`C` 中声明变量的语法是什么？\n\n- 选项 1：`[data type] [variable name];`\n- 选项 2：`[variable\
  \ name] [data type];`\n- 选项 3：`[data type] = [variable name];`\n- 选项 4：`[variable\
  \ name] = [data type];`\n\n**正确答案：1**\n\n**解释：** `C` 中声明变量的语法是 `[data type] [variable\
  \ name];`。在这里，`[data type]` 指变量可以的数据类型，例如 `int`、`float`、`char` 等。`[variable name]`\
  \ 代表变量的标识符或名称。遵循语法规则并选择合适的变量名以确保数据的可读性和意义表示至关重要。例如，要声明一个名为 `num` 的整数变量，应写 `int num;`。这声明了一个类型为\
  \ `int` 名为 `num` 的变量。\n\n## 问题 10\n在 `C` 中如何定义常量？\n\n- 选项 1：`#define [constant name]\
  \ [value]`\n\n\n\n\n\n## 定义定义\n\n选项 2: `const [data type] [constant name] = [value];`\n\
