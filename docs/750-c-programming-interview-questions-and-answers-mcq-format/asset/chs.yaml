  \ 用于从文件中读取一行文本，如果换行符符合缓冲区大小。`fread()` 用于从文件中读取二进制数据，并考虑每个元素的大小和读取的元素数量。`feof()`\
  \ 用于检查文件结束标志是否已达到。这些函数调用提供了以不同格式从文件中读取数据并在 C 中执行特定读取操作的方法。\n\n# 问题：哪些是 C 中检查文件是否成功打开用于读取的有效方式？（选择所有适用项）\n\
