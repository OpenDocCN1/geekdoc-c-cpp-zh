  \n## 问题：C 语言中的函数声明可以在不提供函数定义的情况下被使用。\n\n- 选项 1：正确\n- 选项 2：错误\n\n**解析：** 正确。在 C 语言中，你可以声明一个函数而不提供其定义。这在你想让程序的其他部分知道函数的存在时非常有用，例如在头文件中或创建正向声明时。函数声明提供了函数的返回类型、名称和参数列表的信息，允许其他代码调用该函数，即使实际实现位于另一个文件或模块中。\n\
