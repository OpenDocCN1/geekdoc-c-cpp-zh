  \ #endif`。多行注释允许你通过将代码包含在 `/*` 和 `*/` 之间来注释掉多行代码。`#if 0 ... #endif` 指令是一种常用的技术，可以在不移除代码块的情况下临时禁用它。单行注释（`//\
