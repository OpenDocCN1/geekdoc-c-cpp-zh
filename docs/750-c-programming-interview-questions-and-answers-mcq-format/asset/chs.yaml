  \ This is a single-line comment. It provides additional information about the code.`。单行注释有助于添加上下文并提高代码的可读性。\n\
  \n## 语句终止符\n\n问题：在 C 语言中，语句终止符是 _______________。\n\n选项 1: 分号（`;`）\n\n选项 2: 冒号（:`）\n\
  \n选项 3: 逗号（`,`）\n\n选项 4: 句号（`.`）\n\n**正确答案：** 1\n\n**解释：** 在 C 语言中，语句终止符是分号（`;`）。它表示\
  \ C 代码中语句的结束。C 语言中的每条语句必须以分号结束，省略分号会导致编译错误。分号对于 C 代码的正确解释和执行至关重要。例如，`int num = 5;`\
  \ 将值 5 赋值给变量 `num` 并以分号结束。分号充当语句之间的分隔符，允许编译器理解代码结构并相应地执行。\n\n## 条件语句\n\n问题：C 语言中条件语句的语法是\
