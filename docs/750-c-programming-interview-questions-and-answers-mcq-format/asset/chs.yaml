  \ 4: 以上都不是\n\n**正确答案：** 1\n\n## 解释\nC 语言编程中注释的目的是为代码提供额外信息、提高代码可读性并使代码更具维护性。注释是不可执行的行，会被编译器忽略。它们用于解释代码的用途、逻辑或任何细节。注释对于阅读代码的程序员或未来的维护者非常有帮助。有效地使用注释为代码提供清晰的解释是至关重要的。\n\
  \n## 问题\n在 C 语言中如何编写单行注释？\n- 选项 1: 使用 `//` 开始并以行尾结束。\n- 选项 2: 使用 `/*` 开始并以 `*/`\
