  \ `C` 语言中的注释都是正确的。注释是在编译过程中会被编译器忽略的非执行行。它们充当代码的文档和说明，有助于提高其可读性和理解性。注释还可以通过“注释掉”代码块或部分来临时禁用代码。“注释会被执行并影响程序的输出”这一陈述是错误的。注释对程序的执行或输出没有影响；它们仅供人类阅读，并在编译过程中会被移除。\n\
