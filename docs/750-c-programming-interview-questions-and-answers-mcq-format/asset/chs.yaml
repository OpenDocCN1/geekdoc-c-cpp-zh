  , &num)` 从文件指针 `\"file\"` 指向的文件读取一个整数并存储在变量 `num` 中。`fscanf()` 函数允许你根据指定的格式读取结构化数据。\n\
  \n## 问题：C 中的 `fgets()` 函数用于从 _______________ 读取。\n\n选项 1：行行\n选项 2：字符\n选项 3：二进制数据\n\
