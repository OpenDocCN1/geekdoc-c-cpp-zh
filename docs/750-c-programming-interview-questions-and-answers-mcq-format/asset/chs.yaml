  这是一个跨越多行的多行注释。\n*/\n```\n正确使用 `*/` 关闭注释以避免代码中出现任何语法错误或意外后果是至关重要的。\n\n## 问题\nC 语言中的注释可以相互嵌套吗？解释。\n\
