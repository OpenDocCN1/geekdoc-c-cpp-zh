  \ 选项 3：禁用或“注释掉”代码块\n- 选项 4：以上都不对\n\n**正确答案：** 1, 2, 3\n\n**解析：** `C` 语言中注释的有效用途包括记录代码的功能和逻辑、提供关于代码的解释或备注，以及禁用或“注释掉”代码块。注释充当代码的文档和说明，帮助其他程序员人员或未来的维护者理解其目的、行为和特定细节。它们可以用于记录算法、澄清复杂部分、提供用法示例或突显重要细节。此外，注释可用于临时禁用或隐藏代码块而不必删除它们。有效使用注释以提高代码的可读性、可维护性和开发者之间的协作是非常重要的。\n\
