    # # Game Genres


    There are many types of games, but most fall into a surprisingly small number
    of categories, or genres, defining how the game will play.


    # ## Role-playing games


    In a role-playing game (RPG), the player takes the lead role in a story, and only
    by developing that character can the story be completed successfully. Many RPGs
    have a medieval setting with knights, goblins, and magic.


    Many RPGs use a gray-scale image called a "height map" to represent the world.
    The height map can be drawn by an artist, made randomly by computer, or taken
    from real data such as Google Earth. Dark areas are low like valleys, and white
    areas are high like mountaintops. These height values create a 3D map over which
    image textures are draped to represent grass, stone, water, and so on


    ![](img/3b65410812b2afeea872d1d38e85b469_27_0.png)


    This height map (lePt) shows mountains and valleys (right).'
  - '[PAGE 28]


    # Casual


    Casual games are often based on simple puzzles and can last just a few minutes.
    They are usually cheap to buy and popular on mobile devices or the Internet. Sometimes
    they are free, paid for by advertisements Getting a hit game is tricky, since
    it is hard to say what is needed for people to fail in love with simple games.
    For example, Angry Birds developer, Rovio, made 51-other games before it struck
    gold. Angry Birds is massively popular and has been downloaded over 1 billion
    times.


    ![](img/3b65410812b2afeea872d1d38e85b469_28_0.png)


    Did you know?

    Angry Birds uses a physics simulation of balls hitting bricks under gravity, so
    everything crashes realistically. There are many different physics games, but
    the simulation is usually the same.'
  - '[PAGE 29]


    # First-person shooter


    First-person shooter (FPS) games focus on guns, and the player experiences the
    action through the eyes of the main character. The genre is controversial, due
    to its obsession with violence. However, research has shown that even very young
    children know the difference between play and the real thing. One leading FPS
    has made $6 billion and been played online by over 30 million people.


    > This is Gunmetal. I worked on it''s artificial intelligence (AI), and it took
    weeks to stop the enemies From running in circles and getting stuck.


    ![](img/3b65410812b2afeea872d1d38e85b469_29_0.png)


    > GoldenEye was released in 1997. I was amazed by how Fast and exciting it felt.'
  - '[PAGE 30]


    # Sports games games


    Sports games games are very popular and are often released each year with only
    minor alterations, since real-life players move to different teams or the starting
    lineups for popular teams change, for example. In games for many sports, motion
    capture is used to accurately represent the athletes as they move.


    > For some sports games, popular athletes come to record voice-overs. This makes
    the experience of the game even more authentic for fans.


    > People can tell if an artist animates someone moving—it never looks quite right.
    Instead, special cameras are used to capture the real motion of actors or athletes.


