    ## 大型多人在线游戏 (MMO)


    大型多人在线游戏允许成千上万的人同时一起游戏。例如，《世界魔兽》曾拥有最高付费订阅人数的记录，达到了 1200 万人，尽管单个服务器上同时仅有约 4,500
    人在玩。MMO 需要服务器，以及由高薪资的专业游戏程序员编写的复杂网络代码。


    > 《EVE Online》（星战OL）是一部科幻游戏，它保持着同时在线人数的世界纪录：63,170 人！


    我的一些独立游戏有《机器人先生》（Mr. Robot）、《星际景观》（Starscape）和《海盗单词》（Word Pirate）。这里是《海盗单词》——它虽然很小，但非常完美！


    ![](img/3b65410812b2afeea872d1d38e85b469_32_0.png)


    破坏者和海盗曾使用该城镇受保护的港口，但直到 18 世纪后期才有了永久性的定居点。岩石海湾、微小入海口和珊瑚礁岛组成的海岸线既是极佳的海盗藏身处，又靠近丰富的捕鲸水域。


    ## 独立游戏


    最近，我一直和一个小小的朋友团队作为独立游戏开发者一起工作。我们只开发通过专门渠道销售的小型游戏，例如 Steam、Xbox Live Indie Games、Playstation
    Network，或直接从开发者的网站下载的游戏。


    独立游戏通常迎合想要新颖体验的小众群体，比如“弹幕射击游戏”、益智游戏或 2D 冒险游戏。通常，这些类型在几年前非常流行，但现在只有 10,000 到 100,000
    名粉丝，并且被大型发行商忽视了。


    ## 给自己的备忘


    我曾参与过一个科幻 MMO 的原型开发，但发行商并不确定并终止了项目。我当时非常难过，但你必须学会接受并继续前进——或者成为独立开发者并自己制作！


    ## 物理游戏


    最新的体裁之一旨在让人们动起来。任天堂 Wii 和索尼 PS3 都有玩家可以通过身体环绕来控制动作的控制器。Xbox 360 拥有 Kinect 相机，可以捕捉玩家的全身，这类似于游戏设计师使用的动作捕获技术。


    某些手机游戏甚至可以在宝藏搜索游戏中使用你的当前位置和现实世界物体照片，或者它们可以将游戏内容叠加在实时摄像机视频上。开发者必须小心避免玩家过度疲劳，并且必须编写代码来检测玩家是否执行了正确的动作。


    这款游戏使用 Kinect 相机控制。


    在像《模拟人生》（The Sims）这样的模拟经营游戏中，一切取决于玩家如何改变模拟环境。游戏在每个游戏环节之间的表现可能完全不同。


    ![](img/3b65410812b2afeea872d1d38e85b469_34_0.png)


    ## 模拟游戏


    模拟游戏通常没有故事，你通常甚至无法直接控制任何角色。有时游戏甚至没有结局！游戏模拟了历史上的一个有趣时期——一个事件或情况——然后让玩家在模拟结束后观察会发生什么。这些游戏的编写和测试非常复杂，因为它们不像具有预设剧情的普通游戏那样运行。


    我最喜欢的游戏之一是 1991 年由伟大的游戏设计师西德·迈尔（Sid Meier）创作的《文明》（Civilization）。它允许你模拟地球的整个历史！你可以作为一个好战的独裁者、和平的外交官或两者之间的任何角色来玩。游戏一旦玩过一次通常会变得有点无聊，但像《文明》这样优秀的模拟游戏永远不会有重样的。


    ## 不同的工作方式


    游戏是为许多不同的平台设计的。有时你甚至可以在几个不同的设备上玩同一款游戏。它们各不相同——有些容易制作，有些则很难。


    ## 主机


    传统上，许多玩家在任天堂娱乐系统（NES）或 Xbox 等主流主机上玩游戏。主机游戏拥有巨大的受众，但开发它们非常昂贵。你需要与索尼、微软或任天堂签订合同，并拥有连接到电脑的主机开发版本。


    > Xbox Live Games 频道是寻找独立游戏的好地方。


    ![](img/3b65410812b2afeea872d1d38e85b469_34.png)


    然而，微软和索尼愿意与独立开发者合作。有数千家公司每家雇用 15 到 100 名开发者，为任何需要他们的发行商工作。代工开发公司每次需要新项目时都会派遣制作访问发行商。他们通常有特定的想法或角色需要制作成小型游戏——例如《索尼克》（Sonic）或《Warlio》。


    ![](img/3b65410812b2afeea872d1d38e85b469_36_0.png)


    ## 移动端


    增长最快的类型之一是智能手机和平电脑等移动设备的“App”。主要平台是 iPhone 和 Android。移动游戏通常。


    ## Web


    有数千种可以通过网站运行，它们使用 Flash、Java 或 HTML5 编写。开发者的收入通常来自网站。


    ## 游戏开发者


    不同类型的开发者从事不同的体裁。他们之间的主要区别在于预算规模。大型发行商如微软、索尼、电子艺和任天堂雇用了数千名开发者。他们可以在《模拟人生》等游戏中组成多达
    200 人的巨型团队。


    电子艺是全球最大的发行商之一，拥有 9000 多名员工。


    ## 你知道吗？


    有时游戏会崩溃，意味着它直接停止。这通常是由漏洞（Bug）引起的。在游戏发布之前，修复所有崩溃漏洞是至关重要的。


    ![](img/3b65410812b2afeea872d1d38e85b469_38_0.png)


