    way to test a new game idea is to make a board game or card game version of it,
    and this happens at a lot of game studios. When playing a video game, it can be
    hard to figure out how the developer actually made it work, but when you play
    a card game or board game, the rules are laid out in detail. Most game developers
    I know play tabletop games. I particularly enjoy Magic, The Gathering, Talisman,
    Arkham Horror, and Mansions of Madness.


    ![](img/3b65410812b2afeea872d1d38e85b469_42_0.png)


