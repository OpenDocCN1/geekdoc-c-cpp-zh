    # Glossary


    **Alpha** point in a game''s development when all the tools are finished and it
    is time to build the levels


    **certification** a publisher uses its own testers to certify that a new game
    works properly on a particular console, like the Xbox 360 or PS3


    **genre** style or category of game, such as role-player game or casual game


    **artificial intelligence (AI)** code that makes the computer opponent seem realistic,
    like you are playing against a person


    **home computer** although it can be used to play games, it can also be used for
    many other tasks, making games


    CPU central processing unit. It is the silicon chip at the heart of a computer,
    game console, tablet, or phone. It used to be accompanied by many other chips
    that handled sound, graphics, and so on, but it is more common today to find one
    large chip that does everything.


    **milestone** a check (often monthly) on the progress of a game''s development;
    if the game does not pass, then the publisher may withhold payments to the programmer
    or company


    **Assembler** complicated low level language used when great speed is needed


    **motion capture** special cameras that capture the movement of actors and allow
    them to replay that movement to create realistic animation


    **Basic** simple programming language designed for novice programmers


    **physics** rules describing how objects move, fall, and collide


    **beta** point in a game''s development when it is finished but contains a lot
    of bugs that need fixing


    **debugger** special software that monitors a game as it runs and helps track
    down bugs that make the game crash


    **bug** error in a computer program


    **game console** early examples came with Basic, but now they no longer have keyboards
    and are dedicated to playing games only


    C++ powerful, complex language used to produce nearly all console and PC games.
    Knowledge of C++ is often required for game programming jobs.


    ![](img/3b65410812b2afeea872d1d38e85b469_47_0.png)'
  - '[PAGE 48]


    platform hardware or environment that a game must run on. A PC windows platform
    is different from a tablet Android platform, and this needs to be dealt with in
    the computer code.


    producer person responsible for ensuring that game is finished on time


    prototype quick, rough version of an idea used to test if it''s any good


    prototyping trying to very quickly test how a small part of a game might look
    or play. It is a way of experimenting without spending a year making the whole
    game.


    Python popular programming language sometimes used by professionals for game scripting


    random code that changes things every time it runs, ensuring that a game does
    not play the same every time


    server computer that hosts games, usually on the Internet, so people can play
    together


    simulation recreation of a real thing


    texture picture used to wrap around a 3D game object to make it look solid—for
    example, a photo of a basketball player''s face wrapped around his in-game model''s
    head


    variable in programs, we often need to hang on numbers or text, and we can store
    this data temporarily in a named variable. It is like getting a box, putting important
    things in it, and then sticking on a label that you can find it again later.


    wireframe if you take the textures off a 3D game object, you are left with just
    the scaffolding or defining the shape


    ![](img/3b65410812b2afeea872d1d38e85b469_48_0.png)'
  - '[PAGE 49]


    # # Find Out More


    # # Books


    Byrne, Paul. Computer Game and Film Graphics (Art Off the Wall). Chicago: Heinemann
    Library, 2007.


    Harbour, Jonathan S. Video Game Programming for Kids. Boston: Course Technology
    PTR, 2013.


    LEAD Project. Super Scratch Programming Adventure! Learn to Program by Making
    Games. San Francisco: No Starch, 2012.


    # # Web sites


    www.appinventor.mit.edu


    Want to make mobile games, but C++ is too tricky? App Inventor is a bit like Scratch
    and is very easy to use—just snap together bits of code, plus it is free!


    gaming.adobe.com/getstarted


    Want to make a web game using Flash? If you are in school, you can get a copy
    of the software you need for free.


    www.kodugamelab.com


    Kudu is also for those new to programming; it is free and made by Microsoft. For
    a small fee, you can also get a version that works on an Xbox 360. Unlike Scratch,
    you can actually make 3D games.


    www.ludumdare.com/compo


    Want to try out your new skills and meet other programmers? Ludumdare is a regular
    online competition and forum that gives you a theme and lets you make a game around
    that theme in 48 hours.'
  - '[PAGE 50]


    www.madewithmarmalade.com


    If you are comfortable with C++ but want to make games for cell phones and tablets,
    get a free copy of Marmalade to take care of the boring parts.


    www.microsoft.com/visualstudio/en-us/products/2010-editions/visual-cpp-express


    Games on consoles are written in C++. Visual Studio is one of the most common
    packages used in the industry, and this “express” version is free!


    www.moonpod.com


    This is my indie gaming website. You can play some of the games I made for free,
    ask a question on the forum, or just say hello.


    www.pygame.org/news.html


    This simple-to-use programming language is free and is a good option to try after
    Basic.


    scratch.mit.edu


    If you are new to programming, this is the place to start. Scratch is free and
    easy to learn. Take a look at my page: scratch.mit.edu/projects/MarkFeatherstone/2503601.


    smallbasic.com


    Microsoft’s free version of Basic after you have mastered Scratch or Kodu. It
    can also be an introduction to Visual Basic, which could help to get you a job
    in the future.


    # Topic for research


    Ask your computer science teacher if you can organize a game competition, maybe
    using Scratch, and get everyone in your class involved.'
