    # Key


    +   1. Pre-load: It will take about 10 seconds to load the game.


    +   2. Splash: Show the Moonpod animation—this is the same on all my games.


    +   3. General introduction: Introduce the characters and the overall story.


    +   4. Unlock: After downloading it from a web site, players need a way to pay
    for the game.


    +   5. Hall of fame: The top 10 players'' names and scores.


    +   6. Main menu: From here, we can access options, new game, load, save, and
    so on.


    +   7. New game: Type in your name and set the difficulty level you want.


    +   8. Options: Set the screen resolution, volume, and so on.


    +   9. Save and load: Save a game or Load an old one.


    +   10. Main intro: Show a detailed animation introducing your part in the story.


    +   11. Research: Decide what equipment you would like to work on next.


    +   12. In game menu: Choose which part of the game to visit from here.


    +   13. Storage: Review all the equipment you have made or found, but are not
    using.


    +   14. Ship modification: Change the equipment attached to a ship.


    +   15. Docking bays: Select which to modify.


    +   16. Navigation: Use the maps to navigate around space.


    +   17. Modify station: Attach equipment to your space station.


    +   18. Space: Fly, fight, mine, shoot asteroids, collect items, and talk to people.


    +   19. Station options: Launch a fighter or warp out of the level.


    +   20. Warp: Warp in and out of levels.


    +   21. Boss fight: Levels are grouped into areas; each area has a big boss to
    fight.


    +   22. Death: When you die, go out with a bang!


    +   23. Death animation: Mark your passing and display a summary of achievements.'
