    # Different Roles,

    Different Skills


    I have worked in every game development role, but my favorite being a programmer.
    A programmer takes the ideas of the designers, the artwork, the sound effects,
    and the music makes the game work. Although there are many programming languages,
    they are all similar, and it is easy to move from one to another. Programmers
    have to be focused, logical people with good math skills. They often work alone
    or in small groups for weeks at a time on tricky problems.


    # TOOLS OF

    THE TRADE:

    MONITORS


    Computer programmers often have two monitors: one running the game and the other
    running the debugger, which checks for bugs. This helps spot problems early on.


