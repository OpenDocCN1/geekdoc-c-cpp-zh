    # Reviews


    The next big moment comes when the first reviews come in. Some are by professional
    critics, but many more are members of the public posting on websites. If people
    have enjoyed playing your game and say nice things, it feels wonderful. Sometimes
    the comments are not all nice, but at least you can learn something and make the
    next one little bit better.


    # Did you know?


    Reviews are really important. Some game developers get paid bonus depending on
    how well their game scores on Metacritic, which collects all the different review
    scores together into one average score.


    ![](img/365410812b2afeea872d1d38e54469_8_0.png)


    # The Process of Making a Game


    Let''s back up a little. Launch day is incredibly exciting, but a lot of work
    has to happen before then:


    1. The idea: Everyone contributes ideas, especially the publisher.

    2. The pitch: We present an idea to managers and publishers.

    3. Prototyping: We need exciting new play and visuals. Small programs are made
    to demonstrate them.

    4. Pre-production: All the tools needed are programmed. Workers are hired and
    trained.

    5. Alpha: Tools are ready, so it is time to make the 3D models and build the levels.
    No new features are allowed after this stage!

    6. Beta: Everything is finished, but it does not play quite right and crashes
    constantly! (I''m pretty sure no game ever worked perfectly the first time.)

    7. Certification: The publisher''s testers check everything. They don''t work
    with us, so there is no chance of bias.

    8. Release: Time for a party before we start again! We also check the reviews.


    ![](img/365410812b2afeea872d1d38e54469_9_0.png)


    Tetsuya Nomura is one of the artists at Square Enix, makers of the Final Fantasy
    role-playing games. He is amazingly talented.


    # What does a games programmer do?


    Programming is all about breaking everything down into smaller and easily understandable
    parts. A program is like a machine; it is built out of many different interlocking
    pieces. When you look at the whole problem you cannot even begin to understand
    how you might tackle it, but if you look at just one small piece, then it becomes
    easier.


    ![](img/365410812b2afeea872d1d38e54469_10_0.png)


    An old game such as Space Invaders (one of my childhood favorites) looks simple
    now. But even games like this took a team of programmers a long time to put together!


    Future billionaire Richard Branson loved Space Invaders

