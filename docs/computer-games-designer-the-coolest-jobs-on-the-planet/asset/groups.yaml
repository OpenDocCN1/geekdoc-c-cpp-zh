    # 真理时刻


    开发中最令人兴奋的时刻是你投入了几个月（甚至几年）的游戏终于准备就绪。第一次玩完成的游戏，看到你所有的想法变成现实，感觉几乎像魔法一样。接着是认证，出版者会检查你做了什么，并决定游戏是否准备好面向公众。不久之后就是发布日，你访问当地商店购买完成游戏的第一批副本之一。这是我的游戏之一，还带着闪亮的包装，这和从商店买的不一样！


    ![](img/365410812b2afeea872d1d38e5469_7_0.png)


