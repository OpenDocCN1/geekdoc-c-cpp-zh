    # Artist?


    Artists create all the images, models, and textures used in a game. They are often
    the most exciting and colorful members of the team. Creative and artistically
    talented, also need to use very complex tools. The most common are 3D Studio Max
    for making 3D models and Photoshop for 2D art and textures.


    # Did you know?


    Artists produce hundreds of different images of surfaces when they build games,
    whether it is rocks, grass, water, or wood. This means they will often be sent
    on location to photograph places or objects, to ensure that their work is realistic.


    This model From Gunmetal (a game I worked on) is half wireframe, half textured.
    The Finished 3D object can be viewed From any angle and looks very realistic.


    # TOOLS OF THE TRADE:

    SOFTWARE


    Instead of an expensive mixing studio, audio engineers often use software instead.
    A program such as Reason can simulate mixing boards, synthesizers, effects, and
    every other piece of expensive hardware using a single computer and some speakers.


    ![](img/3b65410812b2afeea872d1d38e85b469_23_0.png)'
  - '[PAGE 24]


    # Audio engineer


    Part musician and part recording engineer, audio engineers create sound effects
    and in-game music. Like artists, audio engineers are sent on location. For example,
    they might visit a race track to make recordings of cars. An audio engineer will
    usually work with musicians on the soundtrack, and if the game needs an orchestral
    score or voice actors, then the engineer will supervise the arrangement.


    ![](img/3b65410812b2afeea872d1d38e85b469_24_0.png)


    2D images are just normal pictures. They may not look realistic, but they can
    still be beautiful. This is an example from one of my games, Starscape.


    Audio engineers need to be talented musicians, expert studio engineers, and have
    good organizational skills.'
  - '[PAGE 25]


    ![](img/3b65410812b2afeea872d1d38e85b469_25_0.png)


    # Producer


    On every game team, there is always a producer whose job it is to make sure that
    the game gets finished on time and that any problems get fixed fast. Producers
    keep themselves separate from the team, and it can be a lonely job. They are effectively
    in charge and have to make sure everyone does enough to meet all the milestones.
    Producers need to be good communicators. They need to be very well organized since
    they have to keep detailed records about what everyone is doing.


    MY HERO!

    ELLEE SANTIAGO


    Kellee Santiago was the producer and part of the design team for Flow, Flower,
    and Journey. The games industry needs more female developers like her. Half of
    all gamers are female, yet 96 percent of developers are male!'
