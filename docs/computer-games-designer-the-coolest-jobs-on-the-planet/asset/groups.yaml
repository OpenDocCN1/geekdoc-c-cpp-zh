    # How I Became a Game Developer


    ![](img/3b65410812b2afeea872d1d38e85b469_13_0.png)


    My first home computer was a Sinclair ZX81.


    I''ve always been fascinated by computers and games. My first experience with
    video games was spending my pocket money playing Space Invaders and Donkey Kong
    arcade machines at my local arcade. I used my powers of persuasion to convince
    my parents to buy me more and more powerful home computers.


    Every upgrade allowed me to write and play more impressive games. Although these
    computers were sold for playing games, just like modern gaming consoles, every
    one of them came with a keyboard and a programming language Basic. I bought Zzap64
    magazine each month and spent hours typing in the demo programs included.


    # Did you know?


    In the 1980s, CDs and flash drives were a long way in the future. One way to save
    and load programs was using a simple audio cassette recorder. It was slow, noisy,
    and very unreliable.


    ![](img/3b65410812b2afeea872d1d38e85b469_14_0.png)


    My First game console was an Atari 2600.


    # Gaining inspiration


    I played classic games such as Zelda, Mario, and Sonic. Home Internet access was
    rare, so I read gaming magazines to find out the names of the developers and sometimes
    cut out their photos. I realized that these people were sitting down at a keyboard,
    using a programming language, and making games. If they could do it, then maybe
    I could, too! I was always thinking up crazy ideas for games and sketching out
    designs for characters.


    # An expensive hobby


    My father was a miner, so the only way I could afford computer games was to save
    my pocket money, get a paper route, and convince my family to give me money instead
    of presents for Christmas and birthdays. Luckily, today, even a modestly priced
    PC is at least 1,000 times more powerful than any of my old home computers, so
    there is no need to constantly upgrade anymore!


    The BBC Micro model B (1981) had the best version of Basic I had ever seen.


    # High school


    I spent so much time programming that my schoolwork suffered. There were no computer
    science classes, as there are today. At home, I was learning how to code text
    adventure games and make small animations. A teacher helped me get into a special
    program studying engineering, even though my grades were not that great. It was
    amazing to be able to focus on an area of study that I really loved and was good
    at.


