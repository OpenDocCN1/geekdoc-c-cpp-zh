    work on, and some are hard.


    # Console


    Traditionally, many gamers played on mainstream consoles such as the Nintendo
    Entertainment System or Xbox. Games for these consoles have a huge potential audience,
    but developing for them is expensive. You need a contract with Sony, Microsoft,
    or Nintendo and a special development version of their console to hook up to your
    PC.


    > The Xbox Live Indie Games channel is a great place to Find indie games.


    ![](img/3b65410812b2afeea872d1d38e85b469_35_0.png)'
  - '[PAGE 36]


    However, Microsoft and Sony are willing to work with indie developers, and can
    be far cheaper. It sounds great, but they are probably not doing this just out
    of the kindness of their hearts. Working with indie developers is a great way
    to get even more games, for free, which help sell their consoles. It is a tough
    way into the market—fewer than 1 percent of developers strike it rich in this
    way.


    # PCs


    Many people play games on PCs as well. The PC, whether Windows, Macintosh, or
    Linux based, allows open development. This means people can make any game they
    like, put it online, sell it, and keep all the money. However, the Steam app store
    is where most people buy their games, so it is not quite as free as it initially
    seems.


    # MY HERO!

    JOHN CARMACK

    (BORN 1970)


    John Carmack is one of my heroes. He was the programming genius behind Wolfenstein
    3D, a groundbreaking game for the PC platform. He was constantly developing or
    popularizing new techniques in computer graphics.


    ![](img/3b65410812b2afeea872d1d38e85b469_36_0.png)


    John Carmack'
  - '[PAGE 37]


    ![](img/3b65410812b2afeea872d1d38e85b469_37_0.png)


    # # Mobile


    One of the fastest-growing types of games is "apps" for mobile devices such as
    smartphones and tablets. Two of the main platforms involved are iPhone and Android.
    Games for these platforms are fairly simple to make and to sell online, so many
    people are trying to enrich it this way.


    Most mobile developers use software libraries to help them their games working.
    For example, Marmalade has thousands of lines of code written by experts. Just
    like a real library, you can pick and choose what you want.


    Mobile games are often 10 times cheaper than console games and are sometimes even
    Free.'
  - '[PAGE 38]


    # Web


    There are thousands of free games playable through web sites, and they are written
    in Flash, Unity, Java, or HTML5. The developer''s income usually comes from one
    of the large gaming web sites. These web sites are always looking for new games.
    The games are usually small and simple, so they don''t take long to make (usually
    6 to 12 weeks).


    # Game developers


    There are different types of game developers working in different genres. The
    main difference between them is the size of the budget, which limits the number
    of employees. Big publishers such as Microsoft, Sony, Electronic Arts, Sega, and
    Nintendo employ thousands of developers. They can work on huge teams up to 200
    people on blockbuster games such as The Sims, which make billions of dollars.


    Electronic Arts is one of the world''s largest game publishers, with over 9,000
    employees.


    # Did you know?


    Sometimes a game crashes, meaning that it just stops working. This is usually
    caused by a bug. It is essential that all crash bugs are fixed before the game
    is released.


    ![](img/3b65410812b2afeea872d1d38e85b469_38_0.png)'
  - '[PAGE 39]


    # Work for hire


    There are thousands of small companies, each employing 15 to 100 developers, that
    work for any publisher that needs them. A work-for-hire developer sends its producers
    to visit publishers each time it needs a new project. They usually have a specific
    idea or character they need made into a smaller game—for example, Sonic or Warlio.


    ![](img/3b65410812b2afeea872d1d38e85b469_39_0.png)


    # Did you know?


    Developers cannot stop adding new ideas—this is called feature creep. But once
    we hit Alpha, the producer has to put a stop to it. Every feature added makes
    the game a little more complex and a little harder to test.


    ![](img/3b65410812b2afeea872d1d38e85b469_39_1.png)


    # TOOLS OF THE TRADE:

    COMFORTS OF HOME


    When I worked at Rage Games, I had a sleeping bag ready for if I got tired working
    late. I also had my own mini-fridge and posters, and my desk was decorated with
    collectable game and movie figures.


    ![](img/3b65410812b2afeea872d1d38e85b469_39_2.png)


    Sumo made Sonic & Sega

    All Stars Racing and the Dr. Who adventure games.'
- md: "\n## Indie companies\n\nAn indie game company will consist of about 1 to 15\
    \ developers, usually without the support of a publisher. They will come together\
    \ to work on something new, and if they are talented and lucky, they will get\
    \ a megahit that makes millions. However, because they are working on something\
    \ completely new, it might not make any money at all. I love running an indie\
    \ game company: we get total freedom to explore all our crazy game ideas. There\
    \ is more to life than making money!\n\n## Did you know?\n\nWhen you work for\
    \ a big developer, things are usually pretty informal. Everyone wears casual clothes,\
    \ and there are often free drinks and snacks and even arcade games in the cafeteria.\
    \ Working for yourself means you can even wear your pajamas, but you do have to\
    \ provide your own snacks!\n\n![](img/3b65410812b2afeea872d1d38e85b469_40_0.png)\n\
    \n> Indies have to be very creative to come up with completely new ideas.\n\n\
    ## Learning to Make Games\n\nMany games allow players to make their own levels.\
    \ Making your own level in something like Little Big Planet and then sharing it\
    \ with other players online is a fantastic experience for a budding designer.\n\
    \nSometimes lots of players come together to make something that feels almost\
    \ completely different from the original game. This requires amateur artists,\
    \ programmers, designers, and musicians to get together over the Internet. If\
    \ it is popular enough, the company might even hire them. This happened with Portal.\n\
    \n![](img/3b65410812b2afeea872d1d38e85b469_41_0.png)\n\n### MY FAVORITE GAME\n\
    Everyone should try to play Portal 1 and Portal 2. I love them and think they\
    \ are absolutely amazing examples of gaming at its best. Portal's editor is even\
    \ used in some schools to teach physics!\n\n## Prototyping\n\nYou can learn a\
    \ lot by playing and making board games or card games. The fastest way to test\
    \ a new game idea is to make a board game or card game version of it, and this\
    \ happens at a lot of game studios. When playing a video game, it can be hard\
    \ to figure out how the developer actually made it work, but when you play a card\
    \ game or board game, the rules are laid out in detail. Most game developers I\
    \ know play tabletop games. I particularly enjoy Magic, The Gathering, Talisman,\
    \ Arkham Horror, and Mansions of Madness.\n\n![](img/3b65410812b2afeea872d1d38e85b469_42_0.png)\n\
    \n## MY FAVORITE GAME\n\nArkham Horror is my favorite board game. It takes hours\
    \ to play and is very complicated, but the rules are beautiful and link together\
    \ like clockwork, to make the closest thing to a video game on your tabletop.\n\
    \n## What goes into a video game?\n\nI'm going to take a game I made called Starscape\
    \ and split it apart into all the different sections that needed implementing.\
    \ This is like a movie storyboard, and it helps the team to visualize how all\
    \ the different parts of the game fit together.\n\n![](img/3b65410812b2afeea872d1d38e85b469_43_0.png)\n\
    ![](img/3b65410812b2afeea872d1d38e85b469_43_1.png)\n![](img/3b65410812b2afeea872d1d38e85b469_43_2.png)\n\
    ![](img/3b65410812b2afeea872d1d38e85b469_43_3.png)\n![](img/3b65410812b2afeea872d1d38e85b469_43_4.png)\n\
    ![](img/3b65410812b2afeea872d1d38e85b469_43_5.png)\n![](img/3b65410812b2afeea872d1d38e85b469_43_6.png)\n\
    ![](img/3b65410812b2afeea872d1d38e85b469_43_7.png)\n![](img/3b65410812b2afeea872d1d38e85b469_43_8.png)\n\
    ![](img/3b65410812b2afeea872d1d38e85b469_43_9.png)\n![](img/3b65410812b2afeea872d1d38e85b469_43_10.png)\n\
    ![](img/3b65410812b2afeea872d1d38e85b469_43_11.png)\n![](img/3b65410812b2afeea872d1d38e85b469_43_12.png)\n\
    ![](img/3b65410812b2afeea872d1d38e85b469_43_13.png)\n![](img/3b65410812b2afeea872d1d38e85b469_43_14.png)\n\
    ![](img/3b65410812b2afeea872d1d38e85b469_43_15.png)\n![](img/3b65410812b2afeea872d1d38e85b469_43_16.png)\n\
    ![](img/3b65410812b2afeea872d1d38e85b469_43_17.png)\n![](img/3b65410812b2afeea872d1d38e85b469_43_18.png)\n\
    ![](img/3b65410812b2afeea872d1d38e85b469_43_19.png)\n![](img/3b65410812b2afeea872d1d38e85b469_43_20.png)\n\
