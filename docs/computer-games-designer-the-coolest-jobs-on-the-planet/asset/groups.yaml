    Thanks to the extra effort I made with my engineering program, I was able to get
    into college—although I had to take some extra classes to make up for not always
    working hard in high school! In college, I studied Information Technology. I learned
    about networking, programming, and computer systems, and then I decided that programming
    was what I really loved. This was where I honed my skills with the language C++.
    It is very common in the games industry.


    > When I began to take college-level classes, I really learned what I needed to
    know to start my career.


    ![](img/3b65410812b2afeea872d1d38e85b469_19_0.png)


    After I graduated from college, I spent three months creating a demo of spinning
    3D shapes and sent this to many game companies. 3D was still fairly new, and I
    hoped they would be impressed that I had managed it alone. A company called Gremlin
    Interactive hired me, and I have been making games ever since.'
