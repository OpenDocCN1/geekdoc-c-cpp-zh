    \n## Key\n\n- 1. Pre-load: It will take about 10 seconds to load the game.\n-\
    \ 2. Splash: Show the Moonpod animation—this is the same on all games.\n- 3. General\
    \ introduction: Introduce the characters and the overall story.\n- 4. Unlock:\
    \ After downloading it from a website, players need a way to pay for the game.\n\
    - 5. Hall of fame: The top 10 players' names and scores.\n- 6. Main menu: From\
    \ here, we can access options, new game, load, save, and so on.\n- 7. New game:\
    \ Type in your name and set the difficulty level you want.\n- 8. Options: Set\
    \ the screen resolution, volume, and so on.\n- 9. Save and load: Save a game or\
    \ Load an old one.\n- 10. Main intro: Show a detailed animation introducing your\
    \ part in the story.\n- 11. Research: Decide what equipment you would like to\
    \ work on next.\n- 12. In game menu: Choose which part of the game to visit from\
    \ here.\n- 13. Storage: Review all the equipment you have made or found, but are\
    \ not using.\n- 14. Ship modification: Change the equipment attached to a ship.\n\
    - 15. Docking bays: Select which to modify.\n- 16. Navigation: Use the maps to\
    \ navigate around space.\n- 17. Modify station: Attach equipment to your space\
    \ station.\n- 18. Space: Fly, fight, mine, shoot asteroids, collect items, and\
    \ talk to people.\n- 19. Station options: Launch a fighter or warp out of the\
    \ level.\n- 20. Warp: Warp in and out of levels.\n- 21. Boss fight: Levels are\
    \ grouped into areas; each area has a big boss to fight.\n- 22. Death: When you\
    \ die, go out with a bang!\n- 23. Death animation: Mark your passing and display\
    \ a summary of achievements.\n\n## Quiz\n\nAre you interested in working in the\
    \ games industry, but not sure what role you are best suited for? Take this fun\
    \ quiz to see which job best suits your personality and skills.\n\n- It's time\
    \ to go on vacation! However, you have limited spending money, so you cannot afford\
    \ to visit all the attractions. What should you do?\n  - a) Let's get all the\
    \ facts and figures into a spreadsheet.\n  - b) I don't care if I run out of money—I\
    \ just want to take photos and gaze at the sunsets.\n  - c) Jenny's good at this\
    \ kind of thing; she went there last year.\n  - d) I write everything down carefully.\n\
    \  - e) I think we should do our own play for once.\n  - f) It has to be a musical.\n\
    \n- The school is interviewing you. What do you think?\n  - a) I like math, science.\n\
    \  - b) I like art and design.\n  - c) I like working with group.\n  - d) I like\
    \ homework.\n  - e) I like computer science.\n  - f) I like music.\n\n- What are\
    \ your hobbies? Let's assume games is number one!\n  - a) I like taking things\
    \ apart to see how they work.\n  - b) I like going to art galleries, cutting out\
    \ pictures from magazines.\n  - c) I have joined lots of clubs.\n  - d) I like\
    \ making lists and keeping my collections organized.\n  - e) I don't mind being\
    \ on my own.\n  - f) I'm learning to play an instrument.\n\n- The school is putting\
    \ on a show. How will you get involved?\n  - a) I think it is time for impressive\
    \ special effects.\n  - b) I'd love to do the stage design or the costumes.\n\
    \  - c) I'll have to direct.\n  - d) I could help everyone with their lines.\n\
    \  - e) I have some great ideas for a show.\n  - f) I'm sure a live orchestra\
    \ would be better.\n"
  mdcn: "\n\n## 独立游戏公司\n\n一家独立游戏公司通常由 1 到 15 名开发者组成，通常没有发行商的支持。他们聚在一起开发新颖的东西，如果他们有才华且幸运，就能创造出带来数百万美元收入的爆款作品。然而，由于他们开发的是完全全新的东西，可能一分钱也赚不到。我喜欢经营一家独立游戏公司：我们拥有完全的自由来探索我们所有疯狂的游戏创意。生活不仅仅是为了赚钱！\n\
    \n## 你知道吗？\n\n在大型开发公司工作时，氛围通常非常休闲。大家都穿休闲休闲服，食堂里经常有免费的饮料、零食，甚至还有街机游戏。为自己工作意味着甚至可以穿睡衣，但你得提供自己的零食！\n\
    \n![](img/3b65410812b2afeea872d1d38e85b469_40_0.png)\n\n> 独立开发者必须非常有创意才能想出完全全新的想法。\n\
    \n## 学习制作游戏\n\n许多游戏允许玩家制作自己的关卡。在《小小星球》这样的游戏中制作自己的关卡并在网上与其他玩家分享，对于初级设计师来说是一次极佳的体验。\n\
    \n有时很多玩家聚在一起制作出感觉与原游戏几乎完全不同的东西。这需要业余艺术家、程序员、设计师和音乐师通过互联网聚集。如果足够受欢迎，公司甚至可能会聘佣他们。《传送门》（Portal）就发生过这种情况。\n\
    \n![](img/3b65410812b2afeea872d1d38e85b469_41_0.png)\n\n### 我喜欢的游戏\n每个人都应该尝试玩玩《传送门1》和《传送门2》。我喜欢它们，认为它们是游戏巅峰的绝对典范。《传送门》的编辑器甚至被某些学校用来教物理！\n\
    \n## 原型\n\n通过玩和制作桌游或牌牌，你可以学到很多。测试新游戏想法最快的方法是制作它的桌游或卡牌版本，这在很多游戏工作室都会发生。玩视频游戏时，很难看出开发者实际上是如何使其运行的，但当你玩卡牌游戏或桌游时，规则会列得非常详细。我认识的大多数游戏开发者都玩桌面游戏。我特别喜欢《智牌》、《塔斯曼》、《阿卡姆恐怖》和《疯狂宅邸》。\n\
    \n![](img/3b65410812b2afeea872d1d38e85b469_42_0.png)\n\n## 我喜欢的游戏\n\n《阿卡姆恐怖》是我最喜欢的桌游。它需要玩几个小时而且非常复杂，但规则非常精妙并像钟轮一样紧扣，在你的桌面上营造出最接近视频游戏的体验。\n\
    \n## 视频游戏包含哪些内容？\n\n我要把我制作的一款名为《星际景观》（Starscape）的游戏拆解成所有需要实现的不同部分。这就像电影分镜，有助于团队视觉化游戏所有不同部分是如何结合在一起的。\n\
    \n![](img/3b65410812b2afeea872d1d38e85b469_43_0.png)\n![](img/3b65410812b2afeea872d1d38e85b469_43_1.png)\n\
    ![](img/3b65410812b2afeea872d1d38e85b469_43_2.png)\n![](img/3b65410812b2afeea872d1d38e85b469_43_3.png)\n\
    ![](img/3b65410812b2afeea872d1d38e85b469_43_4.png)\n![](img/3b65410812b2afeea872d1d38e85b469_43_5.png)\n\
    ![](img/3b65410812b2afeea872d1d38e85b469_43_6.png)\n![](img/3b65410812b2afeea872d1d38e85b469_43_7.png)\n\
    ![](img/3b65410812b2afeea872d1d38e85b469_43_8.png)\n![](img/3b65410812b2afeea872d1d38e85b469_43_9.png)\n\
    ![](img/3b65410812b2afeea872d1d38e85b469_43_10.png)\n![](img/3b65410812b2afeea872d1d38e85b469_43_11.png)\n\
    ![](img/3b65410812b2afeea872d1d38e85b469_43_12.png)\n![](img/3b65410812b2afeea872d1d38e85b469_43_13.png)\n\
    ![](img/3b65410812b2afeea872d1d38e85b469_43_14.png)\n![](img/3b65410812b2afeea872d1d38e85b469_43_15.png)\n\
    ![](img/3b65410812b2afeea872d1d38e85b469_43_16.png)\n![](img/3b65410812b2afeea872d1d38e85b469_43_17.png)\n\
    ![](img/3b65410812b2afeea872d1d38e85b469_43_18.png)\n![](img/3b65410812b2afeea872d1d38e85b469_43_19.png)\n\
    ![](img/3b65410812b2afeea872d1d38e85b469_43_20.png)\n![](img/3b65410812b2afeea872d1d38e85b469_43_21.png)\n\
    ![](img/3b65410812b2afeea872d1d38e85b469_43_22.png)\n\n## 键\n\n- 1. 预加载：加载游戏大约需要10秒。\n\
    - 2. 启动画面：显示月舱动画——这在所有游戏中都是一样的。\n- 3. 总介绍：介绍角色和整体故事。\n- 4. 解锁：从网站下载后，玩家需要一种支付方式。\n\
    - 5. 荣誉堂：前10名玩家和分数。\n- 6. 主菜单：从这里可以访问选项、新游戏、加载、保存等。\n- 7. 新游戏：输入你的名字并设置你想要的难度。\n\
    - 8. 选项：设置屏幕分辨率、音量等。\n- 9. 保存和加载：保存游戏或加载旧存档。\n- 10. 主介绍：显示介绍你在故事中部分的详细动画。\n- 11.\
    \ 研究：决定你下一步想制作的设备。\n- 12. 游戏内：从这里选择要访问的游戏部分。\n- 13. 存储：查看你制作或找到但未使用的设备。\n- 14.\
    \ 飞船改装：更改安装在飞船上的设备。\n- 15. 对接口：选择要修改哪个。\n- 16. 导航：使用地图在太空中导航。\n- 17. 修改空间站：为你的空间站安装设备。\n\
    - 18. 太空：飞行、战斗、采矿、射击小行星、收集物品和与人们交流。\n- 19. 空间站选项：发射战斗机或跳出关卡。\n- 20. 跳跃：进入和跳出关卡。\n\
    - 21. Boss 战：关卡被分成区域；每个区域都有一个大 Boss 要战斗。\n- 22. 死亡：当你死去时，要轰烈地结束！\n- 23. 死亡动画：标记你的离去并显示成就总结。\n\
    \n## 测试\n\n你对在游戏行业工作感兴趣吗，但不确定自己最适合什么角色？做一下这个有趣的测试，看看什么工作最适合你的性格和技能。\n\n- 时候去度假了！然而，你的预算有限，无法负担所有景点。你该怎么办？\n\
    \  - a) 将所有事实和数据放入电子表格。\n  - b) 我不在乎没钱——我只想拍照看日落。\n  - c) Jenny 擅长这个；她去年去过。\n\
    \  - d) 我会仔细记录下来。\n  - e) 我认为我们应该演自己的戏。\n  - f) 它必须是一部音乐剧。\n\n- 学校正在面试你。你觉得呢？\n\
    \  - a) 我喜欢数学、科学。\n  - b) 我喜欢艺术和设计。\n  - c) 我喜欢团队合作。\n  - d) 我喜欢作业。\n  - e) 我喜欢计算机科学。\n\
    \  - f) 我喜欢音乐。\n\n- 你的爱好是什么？假设游戏是第一！\n  - a) 我喜欢拆解东西看看它们是如何运作的。\n  - b) 我喜欢去画廊，从杂志上剪下图片。\n\
    \  - c) 我参加了很多俱乐部。\n  - d) 我喜欢列清单并整理我的收藏。\n  - e) 我不介意独自呆。\n  - f) 我正在学习一种乐器。\n\
    \n- 学校正在举办演出。你打算如何参与？\n  - a) 我认为是时候需要令人震撼的特效了。\n  - b) 我喜欢做舞台设计或服装。\n  - c) 我要担任导演。\n\
    \  - d) 我可以帮大家背台词。\n  - e) 我对表演有很多好主意。\n  - f) 我确信现场乐队会更好。\n\n"
