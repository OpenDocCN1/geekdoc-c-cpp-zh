    ## Designer


    Designers come up with the initial idea for a game and create a “design bible”
    that the team refers to. The ideas come from playing different video games. Designers
    often test their ideas on paper by making little board games before asking the
    team to make a prototype. This is a quick, rough version of the idea, just to
    test if it is a good idea. Designers build the actual levels, in addition to writing
    the scripts. A script contains the text of the story, character dialogue, and
    the logic that controls what happens.


