    # The Moment of Truth


    The most exciting moments in development are when the game you have worked on
    for many months—or even years—is finally ready. Playing the completed game for
    the first time feels almost magical as you see all your ideas brought to life.
    Then comes certification, when your publisher checks what you have done and decides
    if the game is ready for the public. Shortly after that is the launch day, and
    you visit a local store and buy one of the first copies of the finished game.
    This is one of my games still in its shiny wrapper, not the same as buying one
    from a store!


    ![](img/365410812b2afeea872d1d38e5469_7_0.png)


