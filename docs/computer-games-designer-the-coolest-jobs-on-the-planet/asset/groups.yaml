    - **下午4:00–5:30** 玩新游戏并测试所有功能是否运行正常

    - **下午5:30–6:00** 往来、税务和文书工作

    - **下午6:00–9:00** 家庭时间

    - **晚上9:00–11:30** 更多的编程！


    ![](img/3b65410812b2afeea872d1d38e85b469_11_0.png)


    我在这里，正忙于开发一款游戏。


    # 在大型开发公司工作


    过去，我在大型开发公司工作过。那时我的生活非常不同，因为我不需要经营业务。这意味着我只需要专注于编程。


    - **上午 9:30–10:00** 与团队讨论前一天的工作；计划当天的工作

    - **上午 9:30–10:00** 与设计师讨论玩测试结果；计划下一个里程碑

    - **上午 10:00–12:00** 为下一个任务编写一个测试原型

    - **下午 12:00–1:00** 午餐。向团队展示原型；获取反馈

    - **下午 1:00–1:30** 开始编写正式版本。将所有新部分组合在一起；大家玩玩游戏，然后下班

    - **下午1:30–5:00**

    - **下午 5:00–5:30** 或者

    - **下午 5:30–???** 如果里程碑到期，就点披萨一直工作直到完成——有时会忙一整晚！


    ![](img/3b65410812b2afeea872d1d38e85b469_12_0.png)


    # 给自己的笔记


    发行商按月支付游戏费用，在支付下一笔款项前检查其进度。这些被称为“里程碑”，准时完成日期至关重要——否则你就拿不到钱！


    # 我是如何成为游戏开发者的


    ![](img/3b65410812b2afeea872d1d38e85b469_13_0.png)


    我的第一台家用电脑是 Sinclair ZX81。


    我一直对计算机和游戏深着迷。我第一次接触视频游戏是花我的零花钱在当地的游戏厅玩《太空侵略者》和《大金刚》街机。我利用我的说服力说服父母为我买越来越强大的家用电脑。


    每一次升级都让我能编写和玩更多令人印象深刻的游戏。虽然这些电脑是为了玩游戏而售的，就像现代游戏机一样，但每一台都带有键盘和 Basic 编程语言。我每月购买《Zzap64》杂志，并花费几个小时输入其中包含的
    Demo。


    # 你知道吗？


    在 20 世纪 80 年代，CD 和闪存盘还是遥远的未来。保存和加载程序的方法之一是使用简单的音频磁带录音机。它速度慢、噪音大，而且非常不可靠。


    ![](img/3b65410812b2afeea872d1d38e85b469_14_0.png)


    我的第一台游戏机是 Atari 2600。


    # 获得灵感


    我玩过《塞尔达》、《马里奥》和《索尼》等经典游戏。当时家庭网络很稀少，所以我阅读游戏杂志寻找开发者的名字，有时还会剪下他们的照片。我意识到这些人是坐在键盘前，使用编程语言制作游戏。如果他们能做到，也许我也可以！我总是构思各种疯狂的游戏点子，并勾勒角色设计。


    # 一个昂贵的爱好


    我父亲是一名矿工，所以我唯一能负担得起电脑游戏的方法就是攒零花钱、送报纸，并说服家人在圣诞和生日时给我钱而不是礼物。幸运的是，今天即使是一台价格适宜的 PC
    也至少比我以前的任何家用电脑强 1000 倍，所以不再需要不断升级了！


    BBC Micro B 型 (1981) 拥有我见过的最好的 Basic 版本。


    # 高中


    我花了大量时间在编程上，以至于学业受到了影响。当时没有现在这样的计算机科学课程。在家里，我学习如何编写文字冒险游戏并制作小动画。一位老师帮助我进入了一个学习工程的特殊计划，尽管我的成绩并不算理想。能够专注于我真正热爱并擅长的研究领域感觉感觉太棒了。


    # 你知道吗？


    树莓派（Raspberry Pi）是一种针对儿童的新型微型，只需 35 美元。它运行（类似 Windows，但免费），可以连接鼠标、键盘和电视。它可以运行
    Python 和 Scratch 等编程语言。你可以像数码相机一样将工作保存到 SD 卡中。它没有外壳，但你可以用乐高制作一个！


    ![](img/3b65410812b2afeea872d1d38e85b469_16_0.png)


