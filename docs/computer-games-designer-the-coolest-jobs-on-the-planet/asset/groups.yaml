    # # How I Became a Game Developer


    ![](img/3b65410812b2afeea872d1d38e85b469_13_0.png)


    My first home computer was a Sinclair ZX81.


    I''ve always been fascinated by computers and games. My first experience with
    video games was spending my pocket money playing Space Invaders and Donkey Kong
    arcade machines at my local arcade. I used my powers of persuasion to convince
    my parents to buy me more and more powerful home computers.


    Every upgrade allowed me to write and play more impressive games. Although these
    computers were sold for playing games, just like modern gaming consoles, every
    one of them came with a keyboard and a programming language Basic. I bought Zzap64
    magazine each month and spent hours typing in the demo programs included.'
  - '[PAGE 14]


    # Did you know?


    In the 1980s, CDs and flash drives were a long way in the future. One way to save
    and load programs was using a simple audio cassette recorder. It was slow, noisy,
    and very unreliable.


    ![](img/3b65410812b2afeea872d1d38e85b469_14_0.png)


    My First game console was an Atari 2600.


    # Gaining inspiration


    I played classic games such as Zelda, Mario, and Sonic. Home Internet access was
    rare, so I read gaming magazines to find out the names of the developers and sometimes
    cut out their photos. I realized that these people were sitting down at a keyboard,
    using a programming language, and making games. If they could do it, then maybe
    I could, too! I was always thinking up crazy ideas for games and sketching out
    designs for characters.'
  - '[PAGE 15]


    # An expensive hobby


    My father was a miner, so the only way I could afford computer games was to save
    my pocket money, get a paper route, and convince my family to give me money instead
    of presents for Christmas and birthdays. Luckily, today, even a modestly priced
    PC is at least 1,000 times more powerful than any of my old home computers, so
    there is no need to constantly upgrade anymore!


    The BBC Micro model B (1981) had the best version of Basic I had ever seen.'
  - '[PAGE 16]


    # High school


    I spent so much time programming that my schoolwork suffered. There were no computer
    science classes, as there are today. At home, I was learning how to code text
    adventure games and make small animations. A teacher helped me get into a special
    program studying engineering, even though my grades were not that great. It was
    amazing to be able to focus on an area of study that I really loved and was good
    at.


    # Did you know?


    The Raspberry Pi is a new minicomputer for children costing just $35. It runs
    (like Windows, but free) and can connect to a mouse, keyboard, and TV. It can
    run programming languages such as Python and Scratch. You can save your work to
    an SD card like in a digital camera. It does not have a case, but you can make
    one from Legos!


    ![](img/3b65410812b2afeea872d1d38e85b469_16_0.png)


    # The right equipment


    Once I entered the engineering program, I studied hard and tried to really develop
    my skills. I had access to the BBC Micro, a powerful, expensive computer. It was
    developed to encourage young people to program. This really helped with my development.'
  - '[PAGE 17]


    # Making my own games


    It was during this period that I first played Elite. Released in 1984, it is one
    of the earliest 3D games. it allowed the players to explore space in their own
    ships! I was astounded by this game and became determined to understand how it
    had been made.


    ![](img/3b65410812b2afeea872d1d38e85b469_17_0.png)


    # Coding


    I learned how to program very small devices in the language Assembler, which does
    not have many commands. These programs run on tiny chips inside everyday appliances
    as televisions. While Basic feels similar to English, Assembler feels a little
    alien like the language of the computer, machine code. I worked with chips the
    Z80 and the 6502. They were also used in the ZX81, Spectrum, and Game Gear.


    > I loved trying to dock my ship with a space station in Elite.


    # Did you know?


    Games such as Elite are too big to be made by people, so the computer uses rules
    to build it all randomly. It is called procedural generation, and in Elite the
    rules control distances between stars, planet size, how many planets attack, and
    so on. Although Elite looks simple, it contained eight galaxies, with each 256
    planets.'
  - '[PAGE 18]


    # Doing math in Assembler versus Basic


    Let''s say we need to make a simple calculation. Which one makes sense to you?
    In Basic, we would use one line, and it is easier to read than Assembler. In Basic,
    we can write the program much faster, but an Assembler version could run 1,000
    times faster. Assembler is still used in games, but only in the 1 percent of the
    code that needs to be superfast.


    ![](img/3b65410812b2afeea872d1d38e85b469_18_0.png)


    ```

    Z80 Assembler

    LDA A, 23

    LD B, 100

    LD C, 53

    ADD A,B

    SUB C

    ```


    Register "A" equals 70


    ```

    Basic

    result = (100 + 23) - 53

    Variable "result" equals 70

    ```'
  - '[PAGE 19]


