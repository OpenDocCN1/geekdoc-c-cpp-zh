    # Glossary


    **Alpha** point in a game''s development when all the tools are finished and it
    is time to build the levels


    **certification** a publisher uses its own testers to certify that a new game
    works properly on a particular console, like the Xbox 360 or PS3


    **genre** style or category of game, such as role-player game or casual game


    **artificial intelligence (AI)** code that makes the computer opponent seem realistic,
    like you are playing against a person


    **home computer** although it can be used to play games, it can also be used for
    many other tasks, making games


    **CPU** central processing unit. It is the silicon chip at the heart of a computer,
    game console, tablet, or phone. It used to be accompanied by many other chips
    that handled sound, graphics, and so on, but it is more common today to find one
    large chip that does everything.


    **milestone** a check (often monthly) on the progress of a game''s development;
    if the game does not pass, then the publisher may withhold payments to the programmer
    or company


    **Assembler** complicated low level language used when great speed is needed


    **motion capture** special cameras that capture the movement of actors and allow
    them to replay that movement to create realistic animation


    **Basic** simple programming language designed for novice programmers


    **physics** rules describing how objects move, fall, and collide


    **beta** point in a game''s development when it is finished but contains a lot
    of bugs that need fixing


    **debugger** special software that monitors a game as it runs and helps track
    down bugs that make the game crash


    **bug** error in a computer program


    **game console** early examples came with Basic, but now they no longer have keyboards
    and are dedicated to playing games only


    **C++** powerful, complex language used to produce nearly all console and PC games.
    Knowledge of C++ is often required for game programming jobs.


    ![](img/3b65410812b2afeea872d1d38e85b469_47_0.png)


    **platform** hardware or environment that a game must run on. A PC windows platform
    is different from a tablet Android platform, and this needs to be dealt with in
    the computer code.


    **producer** person responsible for ensuring that game is finished on time


    **prototype** quick, rough version of an idea used to test if it''s any good


    **prototyping** trying to very quickly test how a small part of a game might look
    or play. It is a way of experimenting without spending a year making the whole
    game.


    **Python** popular programming language sometimes used by professionals for game
    scripting


    **random** code that changes things every time it runs, ensuring that a game does
    not play the same every time


    **server** computer that hosts games, usually on the Internet, so people can play
    together


    **simulation** recreation of a real thing


    **texture** picture used to wrap around a 3D game object to make it look solid—for
    example, a photo of a basketball player''s face wrapped around his in-game model''s
    head


    **variable** in programs, we often need to hang on numbers or text, and we can
    store this data temporarily in a named variable. It is like getting a box, putting
    important things in it, and then sticking on a label that you can find it again
    later.


    **wireframe** if you take the textures off a 3D game object, you are left with
    just the scaffolding or defining the shape


    ![](img/3b65410812b2afeea872d1d38e85b469_48_0.png)


