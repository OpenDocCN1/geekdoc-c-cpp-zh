    # VIDEO GAMES AWARDS


    # START HERE


    # MY HERO!

    SHIGERU MIYAMOTO

    (BORN 1952)


    Shigeru Miyamoto is one of my all-time heroes. He is probably the most famous
    games producer and designer in the world. Even if you don''t know his name, you
    will know his games—this is the man behind Super Mario, Donkey Kong, and Zelda.


    ![](img/3b65410812b2afeea872d1d38e85b469_26_0.png)


    # Tester


    Before a game is released, it must undergo many hours of testing. It would take
    one person years to complete it all, so games compan use teams of testers. It
    sounds like the greatest jou in the world, playing games all day, but testers
    have to be very methodical and focused. Good communication skills are essential
    if they are going to be able to clearly explain why some aspect of the game just
    does not "feel".


    # Did you know?


    > "Bug" is the name given to errors in game code that might make the game crash.
    All developers must watch out for them!'
