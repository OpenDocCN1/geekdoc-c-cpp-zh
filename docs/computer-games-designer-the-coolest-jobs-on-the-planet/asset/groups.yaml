    ## Massively multiplayer online (MMO)


    A massively multiplayer game allows thousands of people to play together at the
    same time. For example, World of Warcraft holds the record for the maximum number
    of paying subscribers, at 12 million, although only about 4,500 play together
    at any one time on a single server. An MMO needs servers and complex network code
    written by highly paid, specialized game programmers.


    > EVE Online is a sci-Fi game that holds the world record for numbers of people
    playing together at once: 63,170 people!


    A Few of my indie games are Mr. Robot, Starscape, and Word Pirate. Here is Word
    Pirate–it is Small, but perfectly Poed!


    ![](img/3b65410812b2afeea872d1d38e85b469_32_0.png)


    Wreckers and pirates used the town''s protected harbour, but there was no permanent
    settlement until the late 1700s. A coastline of rocky bays, tiny inlets and cays
    made for a great pirate hideout while being close to rich in whaling waters.


    ## Indie games


    Most recently, I have worked with a small team of friends as an indie game developer.
    We only work on small games that are sold through specialized channels, such as
    Steam, Xbox Live Indie Games, Playstation Network, or that are downloaded directly
    from the developer''s site.


    An indie game usually caters to small audiences who want something different,
    like “shoot ''em ups,” puzzle games, or 2D adventure games. Often, these genres
    that were really popular years ago, but now have only 10,000 to 100,000 fans and
    are ignored by big publishers.


    ## Note to self


    I worked on the prototype for a sci-fi MMO, but the publisher wasn''t sure and
    pulled the plug. I was really upset, but you have to learn to accept it and move
    on–or become indie and make it yourself!


    ## Physical games


    One of the newest genres is aimed at getting people moving. The Nintendo Wii and
    Sony PS3 both have controllers that the player can weave around to control the
    action. The Xbox 360 has a Kinect camera that can capture the player''s whole
    body, in a similar way to the motion capture that games designers use.


    Some cell phone games can even use your current location and pictures of real-world
    objects in treasure hunt games, or they can overlay game content on live camera
    video. Developers must be careful of over-tiring the player, and they must write
    code that can detect if the player is performing the correct move or not.


    This game is controlled using a Kinect camera.


    In a simulation game such as The Sims, everything depends on how the player alters
    the simulation. The game can play out completely differently From one play session
    to the next.


    ![](img/3b65410812b2afeea872d1d38e85b469_34_0.png)


    ## Simulation games


    Simulation games often don''t have a story, and you usually cannot even control
    any of the characters directly. Sometimes the games do not even have an end! The
    game simulates an interesting period in history—an event or situation—and then
    lets the player after the simulation and see what happens. These games are very
    complex programs to write and test, since they don''t play out like a normal game
    with a predefined plot.


    One of my favorites is Civilization, from 1991, by the wonderful game designer
    Sid Meier. It allows you to simulate the entire history of Earth! You can play
    it as a warlike dictator, peaceful diplomat, or anything in between Games can
    often be a little boring once you have played them once, but a good sim game like
    Civilization is never the same twice.


    ## Different Ways of Working


    Games are designed for many different platforms. Sometimes you can even play the
    same game on several different devices. They are all different—some are easy to
    work on, and some are hard.


    ## Console


    Traditionally, many gamers played on mainstream consoles such as the Nintendo
    Entertainment System or Xbox. Games for these consoles have a huge potential audience,
    but developing for them is expensive. You need a contract with Sony, Microsoft,
    or Nintendo and a special development version of their console to hook up to your
    PC.


    > The Xbox Live Indie Games channel is a great place to Find indie games.


    ![](img/3b65410812b2afeea872d1d38e85b469_34_0.png)


    However, Microsoft and Sony are willing to work with indie developers. There are
    thousands of companies, each employing 15 to 100 developers, that work for any
    publisher that needs them. A work-for-hire developer sends its producers to visit
    publishers each time it needs a new project. They usually have a specific idea
    or character they need made into a smaller game—for example, Sonic or Warlio.


    ![](img/3b65410812b2afeea872d1d38e85b469_36_0.png)


    ## Mobile


    One of the fastest-growing types is "apps" for mobile devices such as smartphones
    and tablets. The main platforms are iPhone and Android. Mobile games are often.


    ## Web


    There are thousands of games playable through web sites, and they are written
    in Flash, Java, or HTML5. The developer''s income usually comes from web sites.


    ## Game developers


    There are different types of developers working in different genres. The main
    difference between them is the size of the budget. Big publishers such as Microsoft,
    Sony, Electronic Arts, and Nintendo employ thousands of developers. They can work
    on huge teams up to 200 people on games such as The Sims.


    Electronic Arts is one of the world''s largest publishers, with over 9,000 employees.


    ## Did you know?


    Sometimes a game crashes, meaning that it just stops. This is usually caused by
    a bug. It is essential that all crash bugs are fixed before the game is released.


    ![](img/3b65410812b2afeea872d1d38e85b469_38_0.png)

