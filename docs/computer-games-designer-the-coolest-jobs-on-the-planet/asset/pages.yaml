  md: '# Indie companies


    An indie game company will consist of about 1 to 15 developers, usually without
    the support of a publisher. They will come together to work on something new,
    and if they are talented and lucky, they will get a megahit that makes millions.
    However, because they are working on something completely new, it might not make
    any money at all. I love running an indie game company: we get total freedom to
    explore all our crazy game ideas. There is more to life than making money!


    # Did you know?


    When you work for a big developer, things are usually pretty informal. Everyone
    wears casual clothes, and there are often free drinks and snacks and even arcade
    games in the cafeteria. Working for yourself means you can even wear your pajamas,
    but you do have to provide your own snacks!


    ![](img/3b65410812b2afeea872d1d38e85b469_40_0.png)


    > Indies have to be very creative to come up with completely new ideas.'
