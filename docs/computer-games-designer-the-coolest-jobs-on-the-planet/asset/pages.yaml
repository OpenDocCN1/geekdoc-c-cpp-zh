  md: '# # Find Out More


    # # Books


    Byrne, Paul. Computer Game and Film Graphics (Art Off the Wall). Chicago: Heinemann
    Library, 2007.


    Harbour, Jonathan S. Video Game Programming for Kids. Boston: Course Technology
    PTR, 2013.


    LEAD Project. Super Scratch Programming Adventure! Learn to Program by Making
    Games. San Francisco: No Starch, 2012.


    # # Web sites


    www.appinventor.mit.edu


    Want to make mobile games, but C++ is too tricky? App Inventor is a bit like Scratch
    and is very easy to use—just snap together bits of code, plus it is free!


    gaming.adobe.com/getstarted


    Want to make a web game using Flash? If you are in school, you can get a copy
    of the software you need for free.


    www.kodugamelab.com


    Kudu is also for those new to programming; it is free and made by Microsoft. For
    a small fee, you can also get a version that works on an Xbox 360. Unlike Scratch,
    you can actually make 3D games.


    www.ludumdare.com/compo


    Want to try out your new skills and meet other programmers? Ludumdare is a regular
    online competition and forum that gives you a theme and lets you make a game around
    that theme in 48 hours.'
