  md: '# Sports games games


    Sports games games are very popular and are often released each year with only
    minor alterations, since real-life players move to different teams or the starting
    lineups for popular teams change, for example. In games for many sports, motion
    capture is used to accurately represent the athletes as they move.


    > For some sports games, popular athletes come to record voice-overs. This makes
    the experience of the game even more authentic for fans.


    > People can tell if an artist animates someone moving—it never looks quite right.
    Instead, special cameras are used to capture the real motion of actors or athletes.


