  md: '# Web


    There are thousands of free games playable through web sites, and they are written
    in Flash, Unity, Java, or HTML5. The developer''s income usually comes from one
    of the large gaming web sites. These web sites are always looking for new games.
    The games are usually small and simple, so they don''t take long to make (usually
    6 to 12 weeks).


    # Game developers


    There are different types of game developers working in different genres. The
    main difference between them is the size of the budget, which limits the number
    of employees. Big publishers such as Microsoft, Sony, Electronic Arts, Sega, and
    Nintendo employ thousands of developers. They can work on huge teams up to 200
    people on blockbuster games such as The Sims, which make billions of dollars.


    Electronic Arts is one of the world''s largest game publishers, with over 9,000
    employees.


    # Did you know?


    Sometimes a game crashes, meaning that it just stops working. This is usually
    caused by a bug. It is essential that all crash bugs are fixed before the game
    is released.


    ![](img/3b65410812b2afeea872d1d38e85b469_38_0.png)'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Work for hire


    There are thousands of small companies, each employing 15 to 100 developers, that
    work for any publisher that needs them. A work-for-hire developer sends its producers
    to visit publishers each time it needs a new project. They usually have a specific
    idea or character they need made into a smaller game—for example, Sonic or Warlio.


    ![](img/3b65410812b2afeea872d1d38e85b469_39_0.png)


    # Did you know?


    Developers cannot stop adding new ideas—this is called feature creep. But once
    we hit Alpha, the producer has to put a stop to it. Every feature added makes
    the game a little more complex and a little harder to test.


    ![](img/3b65410812b2afeea872d1d38e85b469_39_1.png)


    # TOOLS OF THE TRADE:

    COMFORTS OF HOME


    When I worked at Rage Games, I had a sleeping bag ready for if I got tired working
    late. I also had my own mini-fridge and posters, and my desk was decorated with
    collectable game and movie figures.


    ![](img/3b65410812b2afeea872d1d38e85b469_39_2.png)


    Sumo made Sonic & Sega

    All Stars Racing and the Dr. Who adventure games.'
