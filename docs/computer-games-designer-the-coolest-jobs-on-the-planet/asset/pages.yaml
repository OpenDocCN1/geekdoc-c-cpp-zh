    They are usually cheap to buy and popular on mobile devices or the Internet. Sometimes
    they are free, paid for by advertisements Getting a hit game is tricky, since
    it is hard to say what is needed for people to fail in love with simple games.
    For example, Angry Birds developer, Rovio, made 51-other games before it struck
    gold. Angry Birds is massively popular and has been downloaded over 1 billion
    times.


    ![](img/3b65410812b2afeea872d1d38e85b469_28_0.png)


    Did you know?

    Angry Birds uses a physics simulation of balls hitting bricks under gravity, so
    everything crashes realistically. There are many different physics games, but
    the simulation is usually the same.'
