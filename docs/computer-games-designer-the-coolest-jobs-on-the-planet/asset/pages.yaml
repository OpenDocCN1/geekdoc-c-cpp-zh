  md: '# # The Process of Making a Game


    Let''s back up a little. Launch day is incredibly exciting, but a lot of work
    has to happen before then:


    +   1. The idea: Everyone contributes ideas, especially the publisher.

    2. The pitch: We present an idea to managers and publishers.

    3. Prototyping: We need exciting new play and visuals. Small programs are made
    to demonstrate them.

    4. Pre-production: All the tools needed are programmed. Workers are hired and
    trained.

    5. Alpha: Tools are ready, so it is time to make the 3D models and build the levels.
    No new features are allowed after this stage!

    6. Beta: Everything is finished, but it does not play quite right and crashes
    constantly! (I''m pretty sure no game ever worked perfectly (the first time.)

    7. Certification: The publisher''s testers check everything. They don''t work
    with us, so there is no chance of bias.

    8. Release: Time for a party before we start again! We also check the reviews.


    ![](img/3b65410812b2afeea872d1d38e85b469_9_0.png)


    Tetsuya Nomura is one of the artists at Square Enix, makers of the Final Fantasy
    role-playing games. He is amazingly talented.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# What does a games programmer do?


    Programming is all about breaking everything down into smaller and more easily
    understandable parts. A program is like a machine; it is built out of many different
    interlocking pieces. When you look at the whole problem, you cannot even begin
    to understand how you might tackle it, but if you look at just one small piece,
    then it becomes easier.


    ![](img/3b65410812b2afeea872d1d38e85b469_10_0.png)


    An old game such as Space Invaders (one of my childhood Favorites) looks simple
    now. But even games like this took a team of programmers a long time to put together!


    Future billionaire Richard Branson loved Space Invaders'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# A Day in the Life


    I''m an independent developer, which means I''m my own boss. Here is what an average
    day is like:


    +   - **8:30–10:00 a.m.** Take my daughter to school, walk my dog, and think about
    the game

    - **10:00–10:30** Talk to the team—what''s next? Add any new bugs to the bug list.

    - **10:30–11:00** Generate publicity for the game

    - **11:00–12:00** Do programming work based on the bugs list

    - **12:00–1:00 p.m.** Lunch

    - **1:00–3:00** Check the design; start programming the next task

    - **3:00–4:00** Play my daughter up

    - **4:00–5:30** Play the new game and test that everything is working

    - **5:30–6:00** Correspondence, taxes, and paperwork

    - **6:00–9:00** Family time

    - **9:00–11:30** More programming!


    ![](img/3b65410812b2afeea872d1d38e85b469_11_0.png)


    Here I am, hard at work on a game.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Working for a big developer


    In the past, I worked for big developers. My day was very different then, because
    I was not running the business. This meant I could concentrate only on programming.


    +   - **9:30–10:00 a.m.** Discuss the previous day of work with the team; plan
    for the day

    - **9:30–10:00** Discuss the play test results with the designer; plan for the
    next milestone

    - **10:00–12:00** Program a test prototype of the next task

    - **12:00–1:00 p.m.** Lunch Show the prototype to the team; get feedback

    - **1:00–1:30** Start programming the real thing Put all the new pieces together;
    everyone plays the game leaving for the day

    - **1:30–5:00 5:00–5:30**

    OR

    **5:30–???** If a milestone is due, order pizza and keep working until it is done—sometimes
    all night!


    ![](img/3b65410812b2afeea872d1d38e85b469_12_0.png)


    # Note to self


    A publisher pays for the game one month at a time, checking that it is OK before
    paying the next installment. These are called milestones, and it is important
    to hit these dates—otherwise you don''t get paid!'
  merge: -1
