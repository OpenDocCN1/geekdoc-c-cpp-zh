  md: '# # Game Genres


    There are many types of games, but most fall into a surprisingly small number
    of categories, or genres, defining how the game will play.


    # ## Role-playing games


    In a role-playing game (RPG), the player takes the lead role in a story, and only
    by developing that character can the story be completed successfully. Many RPGs
    have a medieval setting with knights, goblins, and magic.


    Many RPGs use a gray-scale image called a "height map" to represent the world.
    The height map can be drawn by an artist, made randomly by computer, or taken
    from real data such as Google Earth. Dark areas are low like valleys, and white
    areas are high like mountaintops. These height values create a 3D map over which
    image textures are draped to represent grass, stone, water, and so on


    ![](img/3b65410812b2afeea872d1d38e85b469_27_0.png)


    This height map (lePt) shows mountains and valleys (right).'
