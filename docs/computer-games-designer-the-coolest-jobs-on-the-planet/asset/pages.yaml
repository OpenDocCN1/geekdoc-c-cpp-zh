  md: '# First-person shooter


    First-person shooter (FPS) games focus on guns, and the player experiences the
    action through the eyes of the main character. The genre is controversial, due
    to its obsession with violence. However, research has shown that even very young
    children know the difference between play and the real thing. One leading FPS
    has made $6 billion and been played online by over 30 million people.


    > This is Gunmetal. I worked on it''s artificial intelligence (AI), and it took
    weeks to stop the enemies From running in circles and getting stuck.


    ![](img/3b65410812b2afeea872d1d38e85b469_29_0.png)


    > GoldenEye was released in 1997. I was amazed by how Fast and exciting it felt.'
