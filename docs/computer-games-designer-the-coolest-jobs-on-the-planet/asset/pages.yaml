  md: '# Learning to Make Games


    Many games allow players to make their own levels. Making your own level in something
    like Little Big Planet and then sharing it with other players online is a fantastic
    experience for a budding designer.


    Sometimes lots of players come together to make something that feels almost completely
    different from the original game. This requires amateur artists, programmers,
    designers, and musicians to get together over the Internet. If it is popular enough,
    the company might even hire them. This happened with Portal.


    ![](img/3b65410812b2afeea872d1d38e85b469_41_0.png)


    MY FAVORITE GAME

    Everyone should try to play Portal 1 and Portal 2. I love them and think they
    are absolutely amazing examples of gaming at its best. Portal''s editor is even
    used in some schools to teach physics!'
