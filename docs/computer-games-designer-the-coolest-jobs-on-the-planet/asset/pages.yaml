  md: '# # The Moment of Truth


    The most exciting moments in game development are when the game you have worked
    on for so many months—or even years—is finally ready. Playing the completed game
    for the first time, it feels almost magical as you see all your ideas brought
    to life. Then comes certification, when your publisher checks what you have done
    and decides if the game is ready for the public. Shortly after that is the launch
    day, and you visit a local store and buy one of the first copies of the finished
    game. The publisher will give you a free copy, but it is not the same as buying
    one from a store!


    > This is one of my games still in its shiny wrapper, never to be opened!


    ![](img/3b65410812b2afeea872d1d38e85b469_7_0.png)'
  merge: -1
