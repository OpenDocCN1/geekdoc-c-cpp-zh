  md: '# Physical games


    One of the newest genres is aimed at getting people moving. The Nintendo Wii and
    Sony PS3 both have controllers that the player can weave around to control the
    action. The Xbox 360 has a Kinect camera that can capture the player''s whole
    body, in a similar way to the motion capture that games designers use.


    Some cell phone games can even use your current location and pictures of real-world
    objects in treasure hunt games, or they can overlay game content on live camera
    video. Developers must be careful of over-tiring the player, and they must write
    code that can detect if the player is performing the correct move or not.


    This game is controlled using a Kinect camera.'
