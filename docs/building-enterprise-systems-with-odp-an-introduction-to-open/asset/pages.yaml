    # 11.4 Engineering the Federation


    Once the federation community has been defined, we know the abstract view of the
    information to be exchanged and the structure of the dialogue. However, we still
    need to establish the communication technology, the way links are established,
    and how the communication formats to be used over them relate to local usage in
    the systems run by the individual federation members. There may be incompatibilities
    between the way types in the abstract information model are refined to concrete
    representations, or differences in local usage, either in the selection of middleware
    or in the supporting protocols. There may also be a need to invoke additional
    management functions to ensure access or security policies are applied.


    What is needed is a way of placing the necessary extra functionality for access
    control or data transformation into the communications path. The engineering channel
    architecture provides the concept of an interceptor for precisely this purpose.
    An interceptor can act as an intermediate system up to and including the highest
    level at which there is an incompatibility between the engineering solutions in
    use. Messages received on one side of the interceptor are interpreted using the
    rules on that side until an element of the shared abstraction is recognized, and
    this is then recoded and sent on its way in the format of the domain on the other
    side of the interceptor (see figure 11.2).


    The complexity of the conversion to be done by the interceptor depends on the
    nature of the incompatibility to be dealt with. If the incompatibility is at a
    comparatively low level, affecting only the supporting communication protocols,
    the interceptor is reasonably straightforward because it does not need to be concerned
    with application-specific aspects of the dialogue, and can just pass application
    messages through without interpreting them. This'
  merge: -1
  img_proc: true
- pgno: 189
  md: '![](img/b3a2d21424654c9a1d0654b2dce50e07_189_0.png)


    FIGURE 11.2: Operation of an engineering channel interceptor.


    means that it maintains comparatively little state, and so the interceptor can
    be placed anywhere between the domains, and can be restarted or migrated easily.


    If, on the other hand, the conversion involves the formats handled by the stubs
    in the peer systems, the situation is much more complicated. In order to be able
    to interpret and modify the messages being passed, the interceptor needs to be
    aware of the interface types in use, and to maintain more dialogue state. For
    example, it may need to transform between local representations of some abstract
    type being communicated, and so must analyse the messages and be prepared to reformat
    them. In some cases, there may be differences in dialogue structure, where one
    system negotiates a local context, so that information need not be repeated in
    a series of messages, while the other includes the information explicitly in each
    message. In such cases, the interceptor must be aware of the dialogue state and
    add or strip out information where necessary. It needs to know the interface type
    to do this, which implies that it must have an intimate involvement in the binding
    process.


    If the domains use different publication and resource discovery processes, the
    interceptor that is needed is even more complex because it must translate between
    these different processes, acting as a proxy for the registry or trading services
    involved in resource discovery. It must then be prepared to maintain rather long-term
    state in the form of mappings between equivalent services. If, for example, there
    is a need to map between a web services domain and a CORBA domain, there is a
    need to collate information from a number of different sources because the two
    resource discovery systems each package together different architectural functions,
    with WSDL addressing more concrete information and CORBA IDL being more modular.
    In fact, the OMG has produced a specification called CORBA to WSDL/SOAP Interworking
    (C2WSDL) Version 1.2.1 [34] describing how to do this.'
