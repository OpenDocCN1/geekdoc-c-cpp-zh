- pgno: 273
  md: 'Although the Reference Model of Open Distributed Processing (RM-ODP) has been
    a standard for more than ten years, many practitioners are still unaware of it.
    **Building Enterprise Systems with ODP: An Introduction to Open Distributed Processing**
    offers a gentle pathway to the essential ideas that constitute ODP and shows how
    these ideas can be applied when designing and building challenging systems. It
    provides an accessible introduction to the design principles for software engineers
    and enterprise architects. The book also explains the benefits of using viewpoints
    to produce simpler and more flexible designs and how ODP can be applied to service
    engineering, open enterprise, and cloud computing.


    The authors include guidelines for using the Unified Modeling Language™ (UML)
    notation and for structuring and writing system specifications. They elucidate
    how this fits into the model-driven engineering tool chain via approaches such
    as Model-Driven Architecture® (MDA). They also demonstrate the power of RM-ODP
    for the design and organization of complex distributed IT systems in e-government,
    e-health, and energy and transportation industries.


    ![](img/b3a2d21424654c9a1d0654b2dce50e07_273_0.png)


    # Features


    +   - Offers a concise, focused presentation of the essentials of RM-ODP and where
    it fits within today''s software processes

    +   - Explains all the major concepts and mechanisms of the ODP framework

    +   - Explores the latest developments in the ISO ODP standards

    +   - Uses the widely adopted UML notation for modeling large open distributed
    systems using the ODP concepts

    +   - Describes interoperability frameworks applicable to both government and
    industry sectors


    All concepts and ideas in this book are illustrated through a single running example
    that describes the IT support needed by a medium-sized company as it grows and
    develops. Complete UML models and more are available on a supporting website.


    ![](img/b3a2d21424654c9a1d0654b2dce50e07_273_1.png)


