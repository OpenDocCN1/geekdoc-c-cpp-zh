    # ## 2.5 More than One Community


    Any problem of significant complexity will generally require the use of flexible
    structuring techniques, and this is particularly true of enterprise specifications.
    If communities are to be kept sufficiently simple to be understood, they need
    to be combined, and this can be done in a number of ways.


    The way communities are combined will be chosen to support the modelling of complex
    organizational structures, closely reflecting the real-world environments within
    which ODP systems are positioned. These structures can be expressed in terms of
