    FIGURE A.5: Community contract for the Logistics Provision community.


    ![](img/b3a2d21424654c9a1d0654b2dce50e07_250_1.png)


    FIGURE A.6: The enterprise objects in the Phone Repair community.


    # A.1.3 Behaviour


    Behaviour can be modelled in the enterprise language in terms of processes or,
    in a more fine-grained way, in terms of interactions. Processes are expressed
    in UML4ODP as UML activities. Some of the processes for the Phone Repair community
    were shown in figure 2.7, and one of them (Repair Process) was further elaborated
    in figure 2.8, which showed the activity diagram that expresses the steps of the
    process, and identified the roles involved in each of these steps.


    More detailed modelling of behaviour in terms of interactions between roles in
    a community is appropriate when the modelling focus is placed primarily on the
    roles and artefacts involved in the behaviour, and on the relationships between
    them. Figure A.7 shows such an interaction in the CustomerOrg community, in which
    the Employee and the Contract Manager agree to a repair request.'
  merge: -1
