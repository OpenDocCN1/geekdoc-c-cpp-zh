  md: '# ### 9.3 Transparencies and Viewpoints


    The transparencies play an important role in the linkage between the management
    of infrastructure mechanisms in the engineering viewpoint and the design constraints
    established in the computational, enterprise and information viewpoints. The relationship
    between the computational and engineering specifications is particularly significant
    because the computational design establishes the potential for distribution by
    specifying the constraints on the behaviour of specific implementable objects.
    The enterprise and information specifications impose broader, more generic, constraints
    on this computational structure. However, the shift from the computational to
    the engineering viewpoint introduces the properties of particular infrastructures
    and distribution environments.


