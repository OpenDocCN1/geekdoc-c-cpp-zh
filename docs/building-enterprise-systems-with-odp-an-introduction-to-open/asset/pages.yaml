    The major objective of the engineering design is to support the distribution transparency
    requirements of the computational objects. As explained in the previous chapter,
    computational interactions are at least access and location transparent. However,
    more transparency attributes may be specified in the computational transparency
    schema specification.


    Basic Engineering Objects (or BEOs for short) are a special kind of engineering
    object, which are used to give a representation of each computational object in
    the engineering viewpoint. We are concerned here primarily with the engineering
