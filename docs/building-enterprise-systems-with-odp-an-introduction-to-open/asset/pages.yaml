    Figure 2.1 illustrates the main elements involved in specifying a community; more
    detail of the relationship between these key concepts is given after this initial
    introduction. Here, and throughout the book, the PhoneMob specification is used
    as a running example; further supporting detail from this specification can be
    found in appendix A.


    First, we have the behaviour of the community, which is normally defined as a
    composition of processes addressing separate business concerns. This composition
    itself results in a process, and is represented in figure 2.1 as a UML activity
    stereotyped «EV_Process». The process is parameterized by the community''s roles.
    In addition, the community will generally also have a number of policies, which
    allow aspects of its behaviour to be modified to react to changing circumstances.
    These policies perform an important function in allowing the community''s behaviour
    to be modified dynamically to satisfy changing requirements. The way policies
    allow controlled flexibility so that the objectives can still be guaranteed as
    situations change is discussed in detail in chapter 10. Finally, there are declarations
    of a number of supporting enterprise objects owned by the community and used to
    represent its internal state and resources.


    The community is described by a community contract. Making this description (which
    is effectively a community type) explicit in the specification helps the design
    to capture dynamic processes, such as negotiation of the rules under which the
    community operates; it gives a reflexive representation of the behaviour and of
    the roles in it, the policies and the local objects. The contract also includes
    a declaration of the objective of the community.


    The high-level description typically states the scope and field of application
    for the enterprise specification in question. The scope is expressed in terms
    of the behaviour the system is to exhibit. For example, the PhoneMob ODP system
    may have a scope that expresses its key functions such as keep-'
