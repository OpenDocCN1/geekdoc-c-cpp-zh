- pgno: 31
  md: '# Chapter 1


    # What Is ODP About?


    Marcus Steinberg was a self-made man, and he had built his business on his ability
    to select a strong team. As he walked into the executive meeting room, he wished
    that events had not moved quite so quickly, but he would be a fool not to take
    advantage of the current state of the economy. He had snapped up the PhoneMob,
    a promising startup with a cash flow problem and a serious need to automate its
    working methods. Their business, providing a complete facilities management package
    to mobile phone owners, was close enough in concept to his current camera rescue
    empire for there to be some real opportunities for synergy, but PhoneMob would
    need sorting out first. Still, this acquisition would give him the platform he
    needed to make a real impact as the recovery kicked in.


    Marcus knew the IT team he was about to address was technically solid, but he
    had begun to think that they needed a new approach. Recent projects seemed to
    have taken longer than expected, with too many last-minute snags and small misunderstandings.
    He liked a well-oiled machine, and their current performance grated. He had decided
    to call in some favours and had, as a result, been introduced to Alex Wren, a
    consulting enterprise architect whose new approach was, he had been told, finding
    favour in all the right places.


    “Good, you’re all here.” He looked round the room and noticed his people had grouped
    themselves, as usual, into the primarily technical and the primarily business
    oriented. He also noticed the empty seats on either side of Wren; there was a
    job to be done there in getting Wren accepted. “You all know we have a big job
    on our hands in bringing the PhoneMob up to date, and I want to make this happen
    fast and efficiently. We need the relaunched organization to make a mark as a
    modern outfit, without losing its existing customers.”


    “I know you already have a lot on your plate, and it would be unfair to saddle
    any of you with the responsibility for coordinating this,” — he wished this was
    his real reason — “so I have asked Alex Wren here to join us and help pull things
    together.” He could see from their faces that some of the business team would
    happily have done without this help. Eleanor Hewish, his volatile but ambitious
    CIO was staring directly at him, while the fastidious compliance officer, Ivor
    Davies, was looking critically at Wren, who still seemed relaxed and confident.
    The technical side seemed less threatened. Claire Moss, the lead system analyst,
    was still studying her papers, while Trevor Clark, the'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'configuration manager and Trudy McNeal of procurement were giving him their
    polite but guarded attention. Nigel Oliver, the infrastructure manager was sketching
    some sort of diagram on his pad, although Marcus couldn’t make out whether it
    related to this meeting or to something else on Nigel’s mind.


    He turned towards the other member of the meeting, who was from outside his core
    team. “I’m assuming you already know Edward Faversham, from the PhoneMob; you
    must all have had some dealings with him during the negotiations. He is here to
    give us his experience of their current services and processes, and his view of
    the requirements for the merged system.” Faversham shifted nervously and looked
    round the table, acknowledging the nods of recognition. “So, let’s get down to
    business, Edward, perhaps you can give us a quick run-through of the main business
    units to get us started?”


    Faversham flicked the remote control to display a picture of a dishevelled businessman
    jumping up and down on his mobile phone. “As you know,” he said, “our mission
    is to take the hassle out of owning a mobile. We get the phone fixed if it breaks,
    and we provide a replacement if we can’t get it going again straight away. We
    have outlets all over Europe, so we can help while you are travelling and return
    the repaired phone to you at your home base.” He clicked, and the view changed
    to a map spattered with dots, although, Marcus thought, not that many, yet.


    “To be honest,” Edward said, “our main problem at present is that these sites
    are not that well integrated, but so far we have grown from a base where each
    local office franchise did its own thing, and had its own PC-style support, and
    we can’t grow any more without a proper infrastructure.”


    He clicked again, revealing a complicated block diagram on the screen, and pointed
    to a set of paths highlighted in red. “This,” he said, “is the work scheduling
    and logistics. That’s where there is the main scope for automation. This other
    area over here covers the liaison with the handset suppliers, and at present is
    mostly person-to-person negotiation; and this is the corporate relationship management,
    which is one of the areas we need to put on a much firmer basis. Down here are
    the charging and account management processes. No, it’s the logistics that we
    should concentrate on here, at least initially.” He paused and considered his
    chart, as if seeing it for the first time. “I guess the main difference from what
    you are used to is the complexity of the data management involved.”


    Eleanor interrupted. “What’s the problem?” she asked sharply. “It looks simple
    enough.” “Oh no,” he said, “far from it. Think about the investment a user has
    in the content of his mobile phone. The SIM is bound to the number, and can be
    swapped, but the contact lists and the message and call history are needed to
    keep things moving, and all that data is potentially sensitive.”


    This brought Nigel in. “So your service engineers have access to sensitive customer
    data? Isn’t that a security problem?”'
