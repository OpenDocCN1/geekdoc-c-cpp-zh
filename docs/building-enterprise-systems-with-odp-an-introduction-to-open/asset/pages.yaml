    # FIGURE 15.2: A schematic view of different transformation types.


    tions from one specification to complete another specification that uses the definitions;
    it includes the well-known process of importing type libraries. Another example
    is the weaving of different aspects.


    2. Refinement transformations, in which one specification provides a set of templates
    for replacing terms in another specification with specific pieces of supporting
    mechanism. This includes the classic model-driven transformation in which a platform
    specification is applied to a platform-independent design to yield a platform-specific
    one.


    3. Allocating transformations, in which some tactic is applied to two specifications
    in order to construct an optimal relationship between them. This might involve
    resource allocation in which tasks defined in one specification are associated
    with resources defined in another. The result could then be expressed by the creation
    of a set of allocated to correspondences. Examples might be the deployment of
    tasks in an application on available processors, or the building of execution
    schedules.'
