    human actors, but for these there is just a simple placeholder BEO; the engineering
    of communication with them is a matter for HCI standardization, but is not detailed
    in this reference framework and so is not discussed further here.


    The set of BEOs can be seen as abstractions of the computational design. The resulting
    description hides distinctions between objects with similar communications requirements,
    and retaining only the information about the computational objects that characterizes
    them as users of the distribution platform being provided. Therefore, the BEO
    is the primary object to be'
