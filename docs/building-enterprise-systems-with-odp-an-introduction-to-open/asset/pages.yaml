- pgno: 190
  md: '# ## 11.5 Federating Type Systems


    One way of simplifying the management of federated domains is to introduce type
    repositories. The idea behind the type repository is to make all the type definitions
    used in the domain accessible from a well-known service. The same repository also
    registers the location of external type definitions, indicating where the type
    repository for their local home domain can be accessed, and registers mapping
    information, in terms of subtype relationships, so that potential users can reason
    about the types and deduce whether or not an interceptor can be expected to convert
    them into a form that can be understood locally.


    The technical details of how this is done go beyond the scope of this book, but
    details of the ODP type repository can be found in *ISO/IEC 14769: The ODP Type
    Repository Function* [15], which is also available as *ITU-T Recommendation X.960*.
    This standard laid the foundations upon which the OMG later defined its specification
    for the *Meta Object Facility* [28].


    # ## 11.6 Federating Identity


    Another area of considerable practical importance is the federation of identity,
    which allows the creation of broadly based single sign-on schemes. Here the aim
    is to support the establishment of distributed trust models and the management
    of access tokens or pseudonyms. The federation approach to these requirements
    is supported by technologies like *WS-Federation* [45] and *WS-Trust* [47].


    The general structure needed is very similar to the model underlying interoperability.
    First, there needs to be an agreed conceptual framework for expressing identity
    and trust, and a negotiated set of trust relationships between the various domain
    authorities. These may be either direct or indirect; they are indirect if domains
    are linked by some third party, such as a trusted peer or an acknowledged authority.


    A federation community is then formed involving roles for the domains and for
    the third-party broker if there is one. The federation contract defines the behaviour
    used to export names with appropriate credentials, or to generate linked tokens
    of pseudonyms. It expresses the properties that generated identities will have,
    such as their lifetime and any constraints on whether further federation steps
    should be allowed. It also captures the way violations are signalled and the penalties
    associated with them. These days there may also be obligations to disclose identity
    mappings on demand to the legal authorities, so that criminal activity can be
    traced.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# ## 11.7 Legacy Systems


    As well as their use in inter-organizational federation, it should be noted that
    these ideas can also be used in the planning and execution of legacy integration.
    Linking legacy services to a more modern infrastructure involves management decisions
    about what services need to be retained and which are obsolete and can be phased
    out [54]. The resulting decisions can be captured by specifying what role the
    legacy system is expected to play and how this relates to other roles within the
    organization.


    The actual integration involves establishing a shared ontology and process model,
    which may have to be reverse engineered from the existing usage of the legacy
    components. Based on this, the nature and location of any necessary converters
    are determined, and an engineering plan for their realization and commissioning
    written. Finally, a plan for the eventual transition away from the legacy components
    and for their decommissioning will be needed.


    # ## 11.8 Interoperability or Integration?


    How is the decision whether to federate or to integrate related systems to be
    made? It is a difficult trade-off involving a variety of costs and depends on
    assumptions about the way the organizations will evolve.


    Firstly, stronger integration allows more informed management, which results in
    more efficient and more reliable operation. There will be more complete sharing
    of information models (although legacy barriers will persist) and so more consistency
    and better planning follow.


    On the other hand, this close coupling means that the different systems depend
    on each other, so that withdrawal of any party damages the remainder of the organization.
    If there is significant autonomy of the components, changes of their objectives
    may result in the necessary level of cooperation and sharing being lost. However,
    the strongest reason for concentrating on interworking is that, as organizations
    evolve, their groupings change, and integration measures have to be repeatedly
    reworked, placing an intolerable burden on an organization with many business
    links, while a good implementation of a standards-based interworking strategy
    will support an evolving set of partners with lower maintenance and thus much
    lower total cost. Integration creates longer range ordering, which physics tells
    us is a sure sign that a fluid system is about to freeze solid. In a nutshell,
    federation reduces threats from changes of the partners'' objectives, and integration
    allows more rationalization, but limits the partners'' freedom of action and the
    system''s future flexibility.'
  merge: -1
  img_proc: true
