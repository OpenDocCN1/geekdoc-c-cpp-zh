    # 1.2.3 Viewpoint Languages


    We can think of any mechanism for conveying ideas as being a language, be it written,
    drawn or spoken. The communication can be between people, between machines, or
    understood by both.


    Thus, we can speak of the set of concepts, conventions and constraints expressed
    in a particular viewpoint as forming a viewpoint language. The rules of interpretation
    for such a language can, in a particular instance, be seen as representing a viewpoint
    virtual machine. We can think of the supporting tools as parsing the language''s
    grammar and checking its semantic rules, or as implementing the equivalent virtual
    machine; these are just two sides of the same coin.


    From an architectural point of view, we need not be concerned with the physical
    representation of this language as marks on paper or encoded in messages. An abstract
    language can be represented by a number of different concrete notations, suited
    to use in different situations. Many tools, for example, can work with either
    a graphical or a textual notation, and store designs in a third, machine-oriented
    format, such as a dialect of XML. These are all different notations expressing
    the same abstract language.


    Thus for each of the five viewpoints being considered here, we have a corresponding
    viewpoint language. We talk about the viewpoint when we wish to stress the perception
    of the stakeholder concerned, and about the language when we want to emphasize
    the way the ideas are communicated, but the two aspects are intimately coupled;
    one cannot express the ideas without using the language.


    Because the different viewpoints stress different aspects of the design, and do
    so using different techniques, the stakeholders will each be most comfort-'
