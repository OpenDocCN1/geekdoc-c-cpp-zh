    Although we achieve a powerful simplification by dividing a system specification
    into the views seen by different stakeholders, the specification must continue
    to be a coherent description of a single target system. If we had no links between
    the viewpoints, this would not happen; what was intended to be a single design
    would just fall apart into five bits. It is therefore vital that the viewpoints
    be linked, and this is done by establishing a set of correspondences between them,
    as visualized in figure 1.3.


    In current software tools that present different user views, this linkage is often
    derived from the names of objects. If the same name appears in two diagrams, they
    are assumed to represent two aspects of the same thing.


