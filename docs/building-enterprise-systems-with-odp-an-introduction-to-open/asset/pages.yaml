    # 1.1 The ODP Reference Model


    The aim of the Reference Model for Open Distributed Processing (the RM-ODP) is
    to provide a framework for specifying and building large or complex systems; we
    call the systems being produced *ODP systems*. These systems may be classical
    IT systems, information systems, embedded systems, business systems, or anything
    else in which we are interested.


    If a system is at least moderately complicated, it is useful to extract the description
    of its structure and external properties from the details of its components or
    subsystems. If this abstract view concentrates on the distillation of general
    principals, it is called an *architecture*. When presented in a way that is useful
    for the derivation of a whole family of future systems, it is called a framework.
