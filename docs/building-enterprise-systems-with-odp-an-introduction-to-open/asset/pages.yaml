  md: '# Chapter 10


    # Policies — Tracking Changing Requirements


    “It still just says delayed,” said Nigel, after walking over to check the monitors
    outside the departure gate. “I’m not sure we are going to get out of here tonight.
    Anyone want a coffee?”


    They were supposed to be on their way to a conference; Alex had persuaded Marcus
    to let him take Nigel and Eleanor to attend the industry experience track at EDOC,
    the premier event for the kind of enterprise modelling they were now doing, and
    so expose them to more new ideas. However, there were problems with an air traffic
    control centre on the route, and they had already been waiting for almost two
    hours.


    Alex opted for a cappuccino, and Eleanor a Christmas special crème brûlée latte.
    Nigel got himself a plain filter coffee. “It’s interesting,” he said, as he put
    the tray down, “when we got here the queues were much longer, and everyone got
    two of those little almond biscuits. Now everyone gets the fancy design stencilled
    on top of the coffee, but only one biscuit. It’s not random, I watched four or
    five customers in front of me each time.” “It must be a policy,” Alex said. “They
    let the duty manager vary the prescription depending on the load.”


    “We could use that idea,” said Eleanor. “We need to vary the discounting algorithm
    every time marketing has a brainwave; now we can just tell them they are changing
    a policy. It would be good for their egos.” “Any more ego and those guys would
    explode,” said Nigel. “But I’ve heard that term used in network congestion management,
    and in security. Is it the same idea?” “Yes,” said Alex, carving a spoonful of
    chocolate and froth from his drink. “It’s a common pattern that shows up all over
    the place. It’s really useful to highlight the places where you expect to have
    to make changes. It lets you make tomorrow’s job easier.” “But is it the same
    idea in the network and in the enterprise?” asked Nigel. “Is Eleanor’s crème brûlée
    the same as the stuff I had last night in a ramekin?” “Certainly not,” said Eleanor.
    “This is just getting them to put brown sugar in and them not bothering to stir
    it.” They all laughed, but Alex went on. “It’s the same pattern, but different
    detailed mechanisms and timescales. But if you stick to the pattern, you don’t
    have to reinvent all the possible mistakes people make.”'
