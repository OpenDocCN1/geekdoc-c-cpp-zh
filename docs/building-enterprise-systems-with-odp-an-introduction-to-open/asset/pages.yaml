    # 1.2 Viewpoints


    # 1.2.1 The Idea of Viewpoints


    The RM-ODP is perhaps best known for its use of viewpoints. The idea behind them
    is to break down a complex specification into a set of coupled but separate pieces.
    This is a very old idea, used, for instance, to simplify engineering drawings
    (as shown in figure 1.1) and in the building plans produced by architects.


    The writers of the reference model were keenly aware of the need to serve different
    stakeholders, and introduced the idea of there being a set of linked


