  md: '# Chapter 16


    # A Broader View


    Marcus turned back at the door. “One final piece of news,” he said, “I’ve just
    been told that the PhoneMob system has been nominated for an IT Guild award. Well
    done everybody.” Eleanor looked up. “Have you told Alex yet? And are you going
    to get him to advise on the new project?” Marcus looked round the faces of the
    team, and thought how well they were working together now. “I’ll add a note to
    his Christmas card, and get my PA to send him a case of his favourite Pinot Noir.
    But I don’t think we need trouble him again. I think you all know how to do it
    yourselves, now.” He smiled briefly at them and closed the door after him.


    # 16.1 Where to Look Next


    Having read this far, you probably want to know more; so what next? One answer
    is to go to the standards themselves. The best place to start is probably with
    the introduction to UML4ODP, which was the most recently published, but before
    long you will want to read Parts 2 [3] and 3 [4] of the reference model, as being
    the source of most of the ideas. These are publicly available online from ISO
    or ITU-T, as are a number of the other supporting standards. Part 2 explains the
    basic concepts and vocabulary used across all the viewpoints, while Part 3 introduces
    the five viewpoint languages, the transparencies and the supporting functions.


    More detail of the business-facing aspects can then be found in the enterprise
    language standard [17]. Some additional detail of the key techniques for supporting
    the building of configurations in the computational and engineering viewpoints
    can be found in the Interface References and Binding standard [14], while important
    general material on the manipulation of names in situations where there are many
    federated domains is provided in the Naming Framework [16].


    The reference model can be obtained free of charge from the ISO publicly available
    standards pages at http://standards.iso.org/ittf/PubliclyAvailableStandards/index.html.
    The ITU-T makes its versions'
