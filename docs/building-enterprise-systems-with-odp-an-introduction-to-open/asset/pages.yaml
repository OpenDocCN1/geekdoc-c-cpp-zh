    the tools can construct the correct concrete classes in your view for you, based
    on that linkage. You don''t need to do it all from scratch again.


    Ivor scowled. "But then, if I change that part of my design, I might break the
    computational view." "Certainly, it''s possible," said Alex, "but when you ask
    for a global check before committing, you would get a warning. However, that should
    be rare, and if it happens, it probably means there is a shared issue you should
    be discussing anyway. Without that linkage, you would still be thinking about
    that common part of the design in different ways, but no one would know."


    Nigel waved his pencil in the air. "But that means that when the business analysts
    have a bright idea and decide to add a video feature to customer notifications,
    it ripples all the way down to the infrastructure, and the nightly builds will
    break! That would be ridiculous." "Of course," said Alex. "That would be silly.
