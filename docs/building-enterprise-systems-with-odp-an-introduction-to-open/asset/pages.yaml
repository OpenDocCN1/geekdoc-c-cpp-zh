- pgno: 240
  md: 'their component specifications without ever stating clearly how these should
    interrelate.


    The authors of the RM-ODP took great care to select a small set of viewpoints
    that deals with the stakeholders commonly found when creating and managing large
    distributed systems. They avoided the temptation to add complexity by defining
    further viewpoints covering other less general concerns. They also excluded unnecessary
    constraints on the way viewpoint specifications were to be structured.


    The origins of the reference model as a framework for standardization helped its
    developers draw on expertise from the different stakeholder areas to ensure that
    each of the different viewpoint languages used the concepts familiar to the teams
    producing that kind of standard. However, the writers left flexibility within
    the viewpoint languages for users to select any appropriate notation and methodology,
    without imposing unnecessary taxonomic constraints (such as mandatory use of a
    single set of dimensions) across all the viewpoints.


    The reference model is unique in having a well-developed and coherent explanation
    of viewpoint correspondences, ensuring a consistent set of specifications and
    laying the foundation for an integrated tool chain. It also provides a clear framework
    for the expression and assessment of compliance and conformance, which is critical
    in a world where enterprise systems and applications are not developed and maintained
    by isolated teams, but composed of multiple models, applications and systems sourced
    from other companies.


    Each of the viewpoint languages contains a precise set of modelling concepts developed
    based on sound theoretical and engineering foundations, drawn from both the organizational
    and distributed systems fields. It is the combination of such organizational and
    technical concepts, and the correspondence between these, that makes the ODP framework
    an excellent choice to support the expression of various interoperability requirements
    from separate perspectives, and at different levels of abstraction.


    Supporting concepts and mechanisms such as transparencies, federation and contracts
    also becomes essential for achieving smooth interoperability between enterprise
    systems. This is particularly important where it involves the crossing of boundaries
    between organizations or jurisdictions, needing the exchange of information, provision
    of services and linking of processes in order to do business with other enterprises.


    Finally, the fact that the RM-ODP is an international standard ensures vendor
    independence and long-lived specifications. These aspects are especially important
    for protecting the investment required for the adoption of any enterprise framework.
    When augmented with strong links to the widely used UML notation and tools based
    on it, they are precisely the strengths offered by a mature framework such as
    the RM-ODP. In addition, the reference model itself can be exploited and tailored
    for new standardization developments, such as the establishment of architecture
    frameworks and foundations'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'for new domains; this can be seen from its use in the telecommunications, government
    and health sectors.


    # 16.6 Coda


    Since the RM-ODP was first published, many people have experimented with the approach,
    and there are now many competing frameworks aiming to satisfy the requirements
    of different communities and industrial sectors. Indeed, there are now enough
    of them for interoperability between frameworks to become an issue, so that, more
    than ever, users need to understand the underlying concepts.


    We hope that this description of the ODP architecture and the way it can be used
    will help readers to understand the benefits of using such a framework, and the
    importance of maintaining a clear awareness of the need to serve the various stakeholders
    in the design process. The growing power of the tools we use is opening the way
    to a much more clearly articulated separation of concerns while, at the same time,
    ensuring coherence and consistency.


    The use of a robust and consistent framework is essential when positioning new
    technologies and planning their deployment to serve existing enterprises. The
    ODP reference model can be used to analyse the implications of new ideas, such
    as cloud computing, social computing and mobile computing. It can help to distinguish
    what is genuinely new from what is simply differently packaged, and help the understanding
    of new claims, as it has done for service orientation, leading to a clearer comprehension
    of the significance of new initiatives.


    This is the way forward to the generation of flexible and evolving information
    infrastructures that stand the test of time and do what their users really need.'
  merge: -1
  img_proc: true
