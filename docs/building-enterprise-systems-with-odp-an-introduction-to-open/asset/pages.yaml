  md: 'specification, since it can reference the existing solutions and merely state
    how they are combined to meet the infrastructure needs of the system.


    The technology viewpoint is concerned with managing real-world constraints, such
    as restrictions on the hardware available to implement the system within budget,
    or the existing application platforms on which the applications must run. The
    designer never really has the luxury of starting with a green field, and this
