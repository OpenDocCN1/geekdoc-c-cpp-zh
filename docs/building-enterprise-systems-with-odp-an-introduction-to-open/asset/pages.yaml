    # ### 4.6.3 Behaviour: Operations


    Apart from the structural aspects, we also need to specify the behaviour of the
    elements of a computational specification. UML state machines can be used to express
    the internal behaviour of any of the computational elements: ports, components
    and realizing classifiers. State machines are used to represent such behaviour,
    as has already been illustrated in the enterprise and information specifications.


    UML activity diagrams are often used to express object interactions in this viewpoint
    because they provide the kinds of abstraction that we need to model the different
    ways in which messages are exchanged between objects. This is especially true
