- pgno: 57
  md: '# About Part II


    This part introduces the five ODP viewpoints one after another. In its final chapter,
    it then explains how the family of viewpoints is bound together into a coherent
    whole by establishing a set of correspondences between terms in the different
    viewpoints.


    Although a book imposes a linear structure, and its sequence could be read as
    a journey from requirements to implementation, this structure is not intended
    to suggest any particular design methodology. The development of the viewpoints
    is best seen as consisting of a set of concurrent but interacting design processes.


    Each chapter explains the concepts most central to the viewpoint concerned, and
    then illustrates their use by working through elements from the running example.
    Finally, there is some guidance on how the viewpoint specification might be structured
    and the way in which it relates to the other viewpoints.'
  merge: -1
