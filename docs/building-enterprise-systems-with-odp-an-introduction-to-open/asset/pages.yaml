    Policy is a general concept, applicable to any of the viewpoints. However, as
    these examples have shown, it is particularly heavily used in the enterprise language,
    where there is a need to satisfy requirements both for agile business processes
    and for stable and reliable provision of IT systems.


    Policies, then, are a vital tool to let an organization make changes to the behaviour
    of a system or subsystem in a controlled way, and, by so doing, to let it respond
    to changing requirements and challenges.


    # 10.2 What Is a Policy?


    Loosely speaking, a policy is any point of potential variation in a specification
    that has been identified by the designer or the other stakeholders'
