    usage relationships between the related elements. In a real application, there
    would be many more styles of access than those shown here, such as access using
    SMS interactions, or access from programs running in smart phones.


    Note that the correspondences shown in this appendix have been drawn using the
    short-cut notation mentioned in chapter 7, which uses stereotyped dependencies
    instead of the correspondence classes from the UML4ODP standard. A tool would
