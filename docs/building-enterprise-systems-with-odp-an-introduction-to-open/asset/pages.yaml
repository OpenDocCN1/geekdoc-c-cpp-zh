- pgno: 29
  md: '# About Part I


    This first part explains the objectives of ODP and gives an initial introduction
    to the common concepts on which the framework is based. In particular, it describes
    the idea of viewpoints and how this idea is used to structure system specifications.
    It also introduces the taxonomy for supporting functions, which is used to establish
    a common vocabulary and, using human-computer interfacing as an example, indicates
    how planning for distribution interacts with other facets of system design.


    Finally, notations are discussed, and a particular standardized profile for a
    UML-based notation is introduced. This notation will be used in the rest of the
    book.


    Throughout the book, the problems being solved are put into context by a series
    of dramatized vignettes showing the everyday activities within the PhoneMob organization,
    a fictional company whose activities provide our running example. These are not,
    in general, essential to the technical points being made in each chapter, but
    you should certainly read the first episode, since it introduces the broad structure
    of the example to be used in the rest of the book.'
