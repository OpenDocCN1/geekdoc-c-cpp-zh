- pgno: 26
  md: '# Historical Background


    The requirements for ODP and its reference model can be traced back a long way,
    from the earlier work on Open Systems Interconnection. It became clear to experts
    working on application protocols that the prevalent focus on peer-to-peer communications
    was not enough and that distributed systems design needed to take a more holistic
    approach, starting from the structure of the organizations involved. It was necessary
    to begin with a thorough understanding of the enterprise before proposing any
    technical solutions.


    At the same time, there was considerable work in progress on the idea of middleware
    supporting a uniform distribution platform, leading, for example, to the ANSA
    architecture [72] and to early Object Management Group (OMG) specifications. The
    work on ODP started by harvesting the current research ideas available at that
    time and then used them to construct a vendor-neutral architecture. This principle
    of maintaining a broadly applicable framework by using the best current thinking
    has continued to be the basis for work on ODP.


    Currently RM-ODP is being maintained and developed by an ISO/IEC Working Group
    (JTC1/SC7/WG19: *Techniques for the Specification of IT Systems*). This group
    works in close cooperation with ITU-T on the joint publication of a series of
    standards, and also maintains strong collaborative links with other international
    bodies, such as the OMG. These links help to provide the intelligence for continuously
    updating and improving the framework as new technologies and paradigms emerge,
    and for maintaining the consistency of a broad range of specifications and standards.


    # Conventions Used


    Much of the explanation of architectural elements is about the way different concepts
    are represented and what artefacts might result from their application. It is
    easy to lose track of which use falls into which category, so we introduce some
    graphical conventions to help sort things out. Throughout the book, we will use
    the following typographical conventions:


    +   - A **_bold italic_** font highlights a word that is an ODP concept.

    +   - A sans serif font indicates that an element is from a UML model.

    +   - A `typewriter` font flags an item as being a concrete instance.'
