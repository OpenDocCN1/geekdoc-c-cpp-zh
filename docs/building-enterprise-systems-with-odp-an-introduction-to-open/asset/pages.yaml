  md: 'ing track of all repair orders, customers, users and user locations. The field
    of application of the PhoneMob enterprise specification might state properties
    of a franchised business to which the enterprise specification applies, for example
    indicating that this is not, and will never be, a safety critical business system.


    # 2.2 Identifying Roles


    A community is, in essence, a collaboration; the objects fulfilling its roles
    agree that their objective is to achieve a stated business purpose. In simple
    cases, the parties performing roles in the contract, and the behaviour expressed
    in it, can remain the same throughout its lifetime. Alternatively, the contract
    may define behaviour that modifies the community membership, or changes details
    of its behaviour. One way of modifying behaviour dynamically is to define mutable
    policies (see chapter 10) for the community. Note that the community concept can
    be used to model the structure of a particular organization, or a collaboration
    between different organizations stated in terms of business contracts, service
    level agreements (SLAs) or as a federation between different legislative domains
    (see chapter 11).


