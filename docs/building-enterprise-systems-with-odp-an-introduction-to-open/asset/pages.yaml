    # 6.2.4 Implementation


    The technology viewpoint defines an implementation as the result of a process
    that instantiates a specification, the validity of which can be subject to test.
    These processes not only cover development, but also other activities related
    to the system deployment, configuration and evolution. They include, for instance,
    configuration guides, deployment plans, change management plans, criteria for
    the selection of technology and of service providers, maintenance processes, and
    so on. In UML4ODP, these processes are expressed using activity diagrams stereotyped
    «TV_Implementation».


    Figure 6.4 shows an example for the selection of a technology object. It assumes
    that the owner and operator of a system need to add some functionality; they perform
    a search for components that meets their needs and, if they already have the elements
    of a suitable solution, they select and deploy them. However, if nothing suitable
    is available, they specify their requirements as a supply request and issue it
    to a subcontractor who will implement the com'
