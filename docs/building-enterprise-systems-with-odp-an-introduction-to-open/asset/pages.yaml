  md: '(such as the TransactionMgr; remember that the computational specification
    stated that transaction transparency was required).


    The distribution of the engineering objects is described by the elements of the
    ObjectDistribution package, which defines seven nodes and seven channels. Some
    of these elements are represented in figure A.13, which provides an overview of
    the distribution of the main system processing elements. Nodes contain capsules
    and clusters that represent groupings of elements for protection and migration
    management purposes, according to the policies and strategies defined for the
    system.


    Finally, the engineering specification also provides the elements needed to represent
    the internal elements of channels, as was discussed in chapter 5, where figure
    5.3 showed the architecture of one of the channels of the application. The rest
    of the channels follow a similar pattern.


    # A.5 Technology Viewpoint Specifications


    The technology specifications focus on four main issues: (1) identifying the main
    types of technology objects used to implement the system; (2) describing the requirements
    on these objects in terms of implementable standards; (3) stating the extra information
    for testing (IXIT) that needs to be associated with the technology objects; and
    (4) describing the relevant processes and activities involved in the provision,
    deployment, maintenance and evolution of the systems and its parts. In our example,
    the technology specifications are structured accordingly, with packages for each
    of these descriptions (see figure A.14).


    The contents of these packages have already been described in chapter 6, in figures
    6.1, 6.2, 6.3 and 6.4, respectively.


    ![](img/b3a2d21424654c9a1d0654b2dce50e07_256_0.png)


    FIGURE A.14: The overall structure of the technology specification.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# A.6 Correspondences


    We need to specify not only the viewpoints, but also how the elements in the individual
    viewpoints relate to each other. The PhoneMob system specification defines six
    pairwise correspondences between the viewpoints (see figure A.1). There is not
    room here to describe the detailed contents of all these packages; instead, we
    will focus on how correspondences are identified and expressed.


    Chapter 7 explained that the UML4ODP standard provides checklists for identifying
    the correspondences that should be specified for a system. Some of them are mandatory
    for any ODP system specification, such as the ones that link the computational
    and engineering objects. Others depend on the system being specified. Examples
    of these optional correspondences are the ones that link enterprise and computational
    objects, or enterprise interactions with computational interfaces. Not every enterprise
    object or interaction has a corresponding element in the computational viewpoint.
    The Paper Document enterprise object type, for example, has no corresponding computational
    element.


    In general, we can identify two kinds of correspondences between viewpoint elements,
    according to the type of relationship between them. In the first place, we have
    the correspondences between viewpoint elements that represent the same entity,
    such as a handset, from different perspectives.


    Figure A.15 shows the representation of Handset objects in the enterprise, information
    and computational viewpoints, each one focusing on different aspects, giving rise
    to slight variations. It also shows the correspondences between them. Note that
    a handset is an object in the enterprise and information viewpoints, and a data
    type in the computational viewpoint. As a result, there is no representation for
    it in the engineering and technology viewpoints.


    ![](img/b3a2d21424654c9a1d0654b2dce50e07_257_0.png)


    FIGURE A.15: Correspondences between different views of the same entity.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '![](img/b3a2d21424654c9a1d0654b2dce50e07_258_0.png)


    # FIGURE A.16: Correspondences from computational to engineering objects.


    Another example of this kind of correspondence is the set of relationships between
    engineering and computational objects. This is shown in figure A.16. Note that
    object names do not always coincide.


    The second kind of correspondence happens when the related objects do not represent
    the same entity but there is still a relationship between them. A typical example
    is an enterprise policy that affects several information or computational elements.
    In this case, the purpose is twofold. Firstly, the correspondences specify how
    the policy constrains the related elements and, secondly, the correspondences
    provide the traceability mechanisms required to identify the elements that are
    affected by the policy and, conversely, the policies that affect an individual
    viewpoint element.


    This kind of correspondence is also used to specify the choice of technology required
    to implement and deploy the engineering nodes and channels. This is illustrated
    in figures A.17 and A.18, where the correspondences represent


    ![](img/b3a2d21424654c9a1d0654b2dce50e07_258_1.png)


    # FIGURE A.17: Correspondences from engineering to technology objects.'
  merge: -1
