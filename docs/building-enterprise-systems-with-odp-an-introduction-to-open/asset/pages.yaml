  md: '# Chapter 13


    # System Evolution — Moving the Goalposts


    Eleanor handed Claire a glass of chilled Sancerre from the tray by the door and
    they both moved on into Marcus''s office. The papers from the side table had been
    cleared away and in their place sat an architect''s model of the proposed redevelopment
    of the east warehouse area.


    “I think I''m going to like this new layout,” said Claire, “particularly the way
    she has managed to stagger the floors in the main space, so that you get both
    small-scale spaces and a share of the views.” “Yes, and without losing all the
    original decorated ironwork; it''s a good thing we scotched the misapprehension
    early on about programmers not wanting to be distracted by outside views; she
    actually believed that we preferred to be staring at a screen in an enclosed space.”


    Marcus joined them. “Well, what do you think of the plans now? How do you think
    your people took it? Was it what they were expecting?” Claire thought for a moment.
    “I would say they are positive about it; I''m already getting queries about who
    gets what space, but it''s cherry picking stuff, and not at all defensive. When
    are we going to see schedules and transition plans?” “When you''ve all contributed
    to writing them, of course. We have to be sure the changes happen smoothly and
    don''t impact our work; we can''t afford the muddle we had when we first moved
    here from the incubator site; we''ve got real customers this time.” Eleanor grinned.
    “Don''t remind me — nobody knew where anyone else was or who to go to for help.
