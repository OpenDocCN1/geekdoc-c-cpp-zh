    is called the implementation extra information for testing, or IXIT. The technology
    specification gives a proforma stating minimum requirements for the information
    the implementer must include in the IXIT. This information is then used to interpret
    the observations a tester can make in terms of the vocabulary and concepts defined
    in the other viewpoints. For example, it allows valid interactions to be recognized,
    so that their appropriateness can be checked against some specified object behaviour
    (see chapter 8).


    Proformas indicating the information that an implementer is required to include
    when producing the IXIT can be attached to any technology object or interface;
