    So far we have used operations to specify the interactions between the objects
    of our system. However, other forms of interactions are also possible. For instance,
    streams can be used to model continuous flows of information that are transferred
    from one object to another over an extended period of time.


    Suppose that in the PhoneMob system there is the need for a dedicated teleconference
    application linking the service centres and the phone manufacturers. If we make
    this a videoconference, it becomes possible to show the handset and its parts
    to the manufacturer and to get advice, saving the time, effort and money involved
    in dispatching the handset to the factory, waiting for them to repair it, and
    then bringing it back to the service centre.


