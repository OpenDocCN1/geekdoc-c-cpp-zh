- pgno: 156
  md: '# 8.1 Compliance and Conformance


    When using a framework like the ODP reference model, we need to have ways of assessing
    whether the interpretation being made is correct. There are two concepts that
    can be used here — conformance and compliance. The distinction depends on whether
    there needs to be some testing of a physical product, or whether reasoning about
    the consistency between two pieces of specification is enough (see figure 8.1).


    ![](img/b3a2d21424654c9a1d0654b2dce50e07_156_0.png)


    FIGURE 8.1: Assessing compliance and conformance.


    Whenever we take a reference model, such as the RM-ODP, and use it as a starting
    point and create either a more detailed framework or a complete design, we need
    to check that the result complies with the reference model. The same is true when
    we use any other similarly abstract architectural standard. In effect, this involves
    looking at the reference model and the new material together and asking whether
    they still make sense. A composite model is formed by tracing every use of a concept
    back to the corresponding reference model definition and then doing some logical
    analysis to see if there are any contradictions. If there is a contradiction,
    then the new specification is not compliant.


    The situation with conformance is much more complicated. Here we want to ask whether
    some product does what a specification says it should. This cannot be done by
    reasoning about descriptions. It requires some kind of testing.¹ Testing is a
    process that involves observation of what a system does; the result of the process
    is a set of test results — statements of what was observed — and testing conformance
    is essentially equivalent to checking the compliance of the test results to the
    original specification.


    ¹Of course, we can only ask questions about conformance if the target specification
    is itself consistent.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# 8.2 A Conformance Community


    The idea of conformance can be applied very broadly in many different areas, from
    product manufacturing through service provision through to the application of
    management guidelines. ISO work on conformity assessment [19] aims to be sufficiently
    general to cover this entire range, but for our purposes we want a more specific
    framework, concentrating on open distributed systems.


    Part 2 of the RM-ODP provides a conformance architecture, which you can think
    of as an enterprise model of the design, implementation and testing activity (see
    figure 8.2); it defines three main roles, identifying the specifier, the implementer
    and the tester. As usual, an object can fulfil more than one of these roles, but
    it is simpler to describe the case where the roles are distinct — the so-called
    third-party testing scenario.


    The *specifier* produces and publishes a specification. Not only does this specification
    say what an implementation should do, but it also constrains how the implementation
    can be tested by defining where its behaviour can be observed. This is necessary
    because many different styles of specifications can represent the same intended
    object, and the implementer should be left with as much freedom as possible to
    produce something that works efficiently.


    For example, a business process might describe the packing and dispatch of a repaired
    phone as involving a sequence of steps: wrap the phone, print a test report, print
    a label on the box, fill the box, perform a final check and seal the box. It may
    or may not matter exactly in what order these happen. If the specifier is just
    using the sequence for simplicity of description, but would accept other sequential
    or parallel behaviour as doing the same job, we don’t want to be unduly restrictive.


    However, for assessing some of these activities, such as the final check, it may
    really matter that all the earlier steps have been completed. In this case, the
    specifier declares the interaction between the checker and the previous steps
    as a *reference point*. This means that it is a place where correct behaviour
    may potentially need to be observed.


    UML4ODP provides a simple profile that allows elements in the specification to
    be stereotyped as «ODP_ReferencePoint» and qualified by suitable comments stereotyped
    as «ODP_ConformanceStatement».


    A specification will generally be intended for reuse; the final decision about
    what needs to be tested may vary when it is reused. A specification may therefore
    identify quite a lot of reference points, indicating where testing is possible,
    and the final integration of the full product specification will then involve
    selecting a subset of these as *conformance points*, where it is stated that final
    product testing is required.


    The *implementers* obviously have to produce an implementation that behaves according
    to the specification, and this involves them in making im-'
