    # ## 13.1 Coping with Change


    No organization remains unchanged, and so business processes and infrastructure
    requirements are continually evolving. The ODP architecture tries to limit the
    impact of technical innovation to be within the engineering and technology viewpoints,
    and this can be done as long as the basic functionality provided to the organization
    remains the same. However, new technology enables new ways of doing business,
    and so technology can be a stimulus for business process reengineering.


    More crucially, however, there are continual new opportunities for business innovation,
    arising from the opening up of new markets, mergers or acquisitions, and internal
    organizational changes. These all lead to changes in the IT requirements, and
    are generally more pressing than the cycle of technology adoption. No manager
    will willingly accept being told that they must wait for IT changes before entering
    a new and potentially lucrative market.


    The RM-ODP does not have a lot to say directly about such unforeseen changes (as
    opposed to its provision of policies at predictable variation points, as described
    in chapter 10) because it describes systems as they exist, not the dynamics of
    the process by which they are developed. However, the reference model is structured
    to make evolution easy; this is a result of the separation of concerns it offers
    to the various stakeholders. Separating the system specification into a set of
    viewpoints, loosely coupled in a clearly understood way by explicit correspondences,
    allows various aspects of evolution to be carried out separately, as long as overall
    consistency is maintained.


