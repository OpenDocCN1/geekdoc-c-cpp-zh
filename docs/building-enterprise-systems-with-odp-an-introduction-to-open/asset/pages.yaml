- pgno: 261
  md: '# Appendix B


    # Selected Exercises


    This appendix contains a set of exercises to allow the readers to check that they
    are able to use the concepts, mechanisms and notations from the book to develop
    their own designs and specifications. For this we suggest two kinds of activity.
    First, we consider various situations where the RM-ODP concepts and mechanisms
    can be used for structuring the specifications of open distributed systems. After
    this, there is a small set of additional questions to check the understanding
    of some specific ODP concepts.


    # B.1 Selected Scenarios


    Imagine that you are part of a design team that is faced with the following scenarios.
    You should consider what form the viewpoint specifications might take and make
    suitable proposals for an outline design. You should also examine the requirements
    and determine which viewpoints each of the statements in a scenario have impact
    on.


    The RM-ODP does not prescribe any particular method for building the individual
    viewpoint specifications of a system. However, we suggest you follow the indications
    given at the end of the chapters that dealt with the individual viewpoints (chapters
    2 to 6), which provided some guidelines on how to proceed.


    # B.1.1 Twitter


    Suppose that you have done a great job at PhoneMob, and other companies are after
    you to develop enterprise architecture descriptions for their businesses. In particular,
    Twitter™ requires documentation of its systems before embarking on a major IT
    reorganization.


    For this reason, you are asked to write the ODP enterprise and information viewpoint
    specifications of Twitter.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# B.1.2 A Web-Based Supermarket


    A supermarket wants to start a subsidiary that offers web-based order entry and
    delivery services to its customers. The way in which the system for such a subsidiary
    should operate is as follows. The orders are picked from stock in the existing
    stores, but the subsequent deliveries are carried out by local subcontractors;
    these are engaged as necessary to meet demand. The orders are transferred from
    the order entry website to mobile devices in the stores, where staff assemble
    the order ready for delivery. Confirmation of the order list is printed with the
    delivery instructions and passed to the delivery drivers. Scheduling information
    about forthcoming deliveries is provided to the delivery company while the orders
    are being assembled.


    You are asked to develop the ODP enterprise, information and computational specifications
    for the system that will support this business.


    # B.1.3 Skype


    Imagine that Skype™ plans to improve its teleconferencing services by allowing
    large groups to divide and recombine during a session.


    To support this, you are asked to write the ODP information, computational and
    engineering viewpoint specifications of Skype as it is now, and how the specifications
    should be changed.


    # B.1.4 A Loyalty-Points System


    A third-party company offers loyalty bonuses for a variety of existing services.
    The aim of the scheme is to make the services of organizations that participate
    more attractive. The loyalty-points company offers a package of support to primary
    service providers, including software components that the primary providers can
    incorporate into their designs. There is a requirement for uniform rules for bonus
    collection to be applied in all affiliated services, based on the distribution
    of common code. However, it must be easy to integrate the support for bonus points
    into existing provider applications.


    Write the enterprise specifications of the system, with particular emphasis on
    its interactions with the communities that represent the rest of the affiliated
    companies. Once the enterprise specification is written, you are asked to develop
    the information and computational specifications, focusing on how the system will
    interact with the IT systems of the affiliated companies.


    # B.1.5 Adding Share Trading to Automatic Teller Services


    The provider of an existing instant share dealing service, currently operating
    via a web interface, is undertaking a joint venture with a building society that
    runs a network of ATM cash dispensers. In this scheme, shares can be bought and
    sold by interacting with additional menus in the existing'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'cash dispensers. A strategy is needed that causes as little disruption to the
    established three-tier architectures of the two organizations as possible.


    You are asked first to provide a simple ODP specification of the two systems,
    and then to identify the minimum set of changes that will be required to implement
    the modifications in both systems.


    # ### B.1.6 Google Search Engine


    Imagine that you are hired by Google™ as Chief Architect for one of its core products,
    the Google Search Engine, and that they want you to provide an architectural description
    of that application, with the goals of:


    +   - Relying on high-level models to understand this application, in a platform-
    and technology-independent manner.

    +   - Having a conceptual model of the data the application manages.

    +   - Defining the software architecture of the application, for guiding subsequent
    developments and changes.

    +   - Specifying the deployment architecture and communications infrastructure,
    expressed in terms of distributed servers, processes and channels, to be able
    to have a global picture of the system workload, to perform load-balancing improvements
    or to conduct end-to-end performance analysis of the system.

    +   - Describing the technology adoption, acquisition, provisioning and maintenance
    procedures for the hardware, software and communications infrastructure that should
    support the application.


    Write the ODP specification of the Google Search Engine, including all five viewpoints
    and the correspondences between them.


    # ### B.2 Some Additional Questions


    Answer these questions based on the concepts presented in this book.


    +   1. A designer says, “Now that we have decided to allow persistent data to
    be stored on mobile devices in our system, the enterprise policy on required availability
    levels means we will need to add engineering mechanisms supporting replication
    transparency for all the computational objects, not just those that are currently
    tagged as having critical requirements in the computational design.” Explain,
    to someone ignorant of the ODP architecture, what the designer is saying, and
    what the concepts they have used mean.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '2. A legacy system consists of a database and a set of data entry, update and
    query applications. It is necessary to upgrade it without interrupting operation,
    moving to a new system with an object-based design and a richer set of applications.
    The applications require transactional operation. Outline the steps that might
    be taken to perform this transition in a phased way.


    3. Two organizations need to interoperate but have commitments to different kinds
    of middleware and different data formats. Indicate an approach that they might
    take to establish interoperability, stating what agreements would need to be established
    initially and how support for necessary protocol and format transformations might
    be provided. Illustrate how this process might be assisted if each of the partners
    used import and export naming domains and they established suitable interceptors
    to provide the translation of structured documents.


    4. Avoiding unnecessary detail, but stating clearly the objects, interfaces, operations
    and actions involved, outline how a design might use the idea of a suitable binding
    to describe each of the following cases. Your answer should cover both the initialization
    and the use of the configuration.


    +   (a) A computational design in which errors in a client-server interaction
    are signalled to a separate management object.

    +   (b) A computational design in which a video multicast from a camera to a number
    of displays is configured dynamically to vary the number of displays and the quality
    of service provided.

    +   (c) A computational and an engineering design in which a video binding is
    created between a source and a sink in domains using different frame rates for
    representing video.


    5. What is a conformance point? Explain the main roles and activities in the ODP
    conformance model, and describe how they can be used in the following example.


    A new computer games console is designed to have open interfaces and to accept
    games produced by a wide variety of vendors. The console can be connected to the
    Internet, or can load games from standard prerecorded cartridges. Internally,
    its system provides a rich set of high-level graphics methods that the game modules
    can use.


    Discuss, with the aid of a functional block diagram of the system, the different
    classes of conformance point that are likely to be involved in the testing of
    the console and of the games that vendors supply to run on it.'
  merge: -1
  img_proc: true
