  md: '+   1. Identify the communities with which the system is involved, their objectives
    and the roles involved in them.

    +   2. Identify the enterprise objects within each community.

    +   3. Define the behaviour required to fulfil the objectives of the communities.
    This may be in the form of processes, their constituent actions and the community
    roles or local enterprise objects performing them.

    +   4. Define any constraints on the way roles can be filled by enterprise objects.

    +   5. Identify the policies that govern the behaviour.

    +   6. Identify any behaviours that may change the rules that govern the system,
    and the policies that govern such behaviours (changes in the structure, behaviour
    or policies of a community can occur only if the specification includes some behaviour
    that can cause those changes).

    +   7. Identify the actions that involve accountability of the different parties,
    and the possible delegations.

    +   8. Identify any behaviour that may change the structure or the membership
    of each community during its lifetime, and the policies that govern such behaviour.


    Of course, the order of these activities need not necessarily be linear, and not
    all activities will be appropriate in all modelling situations.


