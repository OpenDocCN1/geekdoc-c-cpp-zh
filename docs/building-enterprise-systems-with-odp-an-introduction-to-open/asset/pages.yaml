    # 5.7 Incorporating Current Technologies


    When some of the ODP functions and their associated mechanisms are embodied in
    a specific technology, they are refined to meet the additional requirements originating
    from the target technology. We have seen that some of the ODP functions, or their
    adaptations, are found in CORBA, Java or Web Services technologies. These include,
    for example, naming, event notification, trading, transaction and security support.


    There are other situations in which the distribution infrastructure is provided
    by a third-party organization or company. This happens, for instance, when cloud
    computing is used. The implications of the adoption of this technology are simply
    that your engineering specifications should be mapped to the specifications of
    the transparency mechanisms and common functions implemented and offered by the
    cloud provider. The details of how they are provided are encapsulated within the
    cloud provider and so do not form part of our design.


