  md: '# Chapman & Hall/CRC Innovations in Software Engineering and Software Development


    Series Editor


    Richard LeBlanc


    Chair, Department of Computer Science and Software Engineering, Seattle University


    # AIMS AND SCOPE


    This series covers all aspects of software engineering and software development.
    Books in the series will be innovative reference books, research monographs, and
    textbooks at the undergraduate and graduate level. Coverage will include traditional
    subject matter, cutting-edge research, and current industry practice, such as
    agile software development methods and service-oriented architectures. We also
    welcome proposals for books that capture the latest results on the domains and
    conditions in which practices are most effective.


    # PUBLISHED TITLES


    # Software Development: An Open Source Approach


    Allen Tucker, Ralph Morelli, and Chamindra de Silva


    # Building Enterprise Systems with ODP: An Introduction to Open Distributed Processing


    Peter F. Linington, Zoran Milosevic, Akira Tanaka, and Antonio Vallecillo'
