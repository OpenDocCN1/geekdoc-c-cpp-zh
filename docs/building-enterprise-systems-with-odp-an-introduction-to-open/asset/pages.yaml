    as a result of interaction at some interface. Since the ODP object model is based
    on strong encapsulation, this means that there is a close alignment with the SOA
    view of service. The discovery and dynamic use aspects are covered by the ODP
    binding model and the definition of common functions such as the trader. The different
    types of services are captured by the ODP viewpoints, with business services being
    expressed in the enterprise viewpoint and the technical services being expressed
    primarily in the computational viewpoint. However, in the ODP enterprise viewpoint,
    as we shall see in the next chapter, there is a greater emphasis on declarative
    expression and flexible structures, so the definition of a business service is
    only one of the available design tools. Correspondences defined between the different
    aspects of a service in different viewpoints are also needed to provide a consistent
    specification of the service as a whole.


    So what differentiates a service-oriented architecture? The main differences are
    not architectural, but are more concerned with raising the engineering expectations
    about openness and resilience, largely as a result of years of implementation
    experience with web-based systems and of striving for the widespread adoption
    of open resource identifiers like Uniform Resource Identifiers (URIs).'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# 1.6 Human Computer Interaction


    An essential aspect of the design of any information system is the specification
    of the interfaces the system offers to the people that will interact with it,
    something that is normally called human-computer interaction. In this design field,
    the user interface (or UI for short) is where interactions between humans and
    machines occur.


    A typical enterprise design will be concerned with many kinds of activity. Some
    of these will involve people, some will involve automated solutions, and some
    will involve human-computer interaction. However, these categories are not fixed;
    there will be a progressive migration towards automated solutions, without there
    necessarily being major structural changes in the design.


    While, in a sufficiently abstract description, the functions performed can remain
    the same when such changes are made, the disciplines involved in expressing their
    detail are quite different: middleware providers and user interface designers
    use different tools and techniques. However, both disciplines make heavy use of
    tools. In the middleware world, tools automate generation of stubs from interface
    definitions and handle the incorporation of mechanisms to ensure reliability and
    fault tolerance. Tools applied to the user interface design, on the other hand,
    can produce software components to act as user proxies within the system and manage
    user dialogues in terms of interaction with, for example, a sequence of web forms
    and other pages. These tools can also be used to apply a uniform look and feel
    across the organization.


    In the descriptions that follow, we will focus primarily on system structure,
    but we will indicate how the approach also enables the management of human-computer
    interaction, using either the same information that captures the system structure
    or specific information added to support this aspect of the design.


    Thus, the enterprise description can be used to identify interactions between
    human and system-supported activities, while the information viewpoint can define
    data types that can be used either in system-to-system interactions or in user
    interfaces and the computational viewpoint can contain details of the dialogue
    needed to support human-computer interaction.


    Introducing the support of user interfaces into the design will, in general, result
    in the inclusion of distinct objects into the computational design to represent
    each user and the proxies for these users within the supporting system. Doing
    so adds precision to the specification of the user interactions expected and,
    as we shall see in chapter 8, provides a basis for testing the correctness of
    conformance to the user interactions specified.


    The support for user interaction is thus incorporated within the viewpoint framework,
    but we shall return to this topic to bring out the consequences for the individual
    viewpoint languages as they are discussed in following chapters.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# 1.7 The Right Tools for the Job


    # 1.7.1 Reusing UML via UML4ODP


    Although, as we indicated earlier, the ODP viewpoint languages are defined in
    an abstract way without commitment to a particular concrete notation, we do need
    to select such a notation before we can write a real, useful model. It does not
    matter particularly what notation we choose, as long as our toolchain can handle
    it and integrate it with others already in use, but it will help the designers
    to get started if the notation is already familiar.


    UML [30] is currently the most popular modelling language in the industry, and
    most designers have some familiarity with it. Its expressive power can be increased
    by using the associated object constraint language (OCL) [36]. So why not use
    it here? The problem with UML as it stands is that it does not support the separation
    of concerns we want, or the structuring concepts ODP introduces to support it.
    UML has functional views, expressed in its diagram types, but they are closely
    coupled, and there is a single hierarchical namespace underpinning them. This
    makes the separation we want difficult to achieve.


    What about model-driven engineering, then? Many MDE prototypes use UML for expressing
    their source and target models, don’t they? Yes, they do, but that’s the point.
    They work by translating between quite separate models, each with its own internal
    consistency and its own namespaces. The transformations provide the level of decoupling
    that is needed (see chapter 15).


    With the development of these technologies, and of an increasing number of domain-specific
    dialects of UML, the originators of ODP returned to UML and decided that, because
    it was now widely accepted, it could be used in many cases to provide a familiar
    notation for the individual ODP viewpoint specifications. In consequence, they
    produced a new standard, ISO 19793: Use of UML for ODP system specifications,
    or UML4ODP for short [22]. This standard provides a profile that maps the ODP
    concepts to the UML notation,³ so that they can be manipulated with conventional
    UML tools. A suitable plug-in to a UML tool allows consistency checking across
    multiple viewpoints.


    Of course, ODP can be supported by other notations, tailored to other user communities,
    such as business process designers, as long as a similar level of tool integration
    can be achieved. However, in this book we will keep things simple and concentrate
    largely on the UML4ODP notation.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# 1.7.2 UML4ODP in a nutshell


    The UML4ODP standard defines both a UML-based notation for the expression of the
    ODP system specifications and an approach for structuring them using that notation,
    thus providing the basis for model development methods. This makes the UML4ODP
    notation useful not only to ODP modellers who want to use UML to describe their
    ODP systems, but also to UML modellers who have to deal with the specification
    of nontrivial systems and need some approach to structure their large UML system
    specifications.


    UML4ODP uses standard UML concepts and relies on the standard extension mechanisms
    provided by UML for defining new languages and, in particular, on UML profiles.
    More precisely, UML4ODP defines seven related UML profiles: one for each ODP viewpoint,
    one for describing correspondences and one for modelling conformance in ODP system
    specifications (see chapter 8). All the model diagrams shown in this book are
    drawn using these profiles.


    Thus, an ODP system specification expressed in UML4ODP consists of a single UML
    model stereotyped «ODP_SystemSpec» that contains a set of models, one for each
    viewpoint specification, each stereotyped «<X>_Spec», where <X> is the viewpoint
    concerned (see figure 1.4). Each viewpoint specification uses the appropriate
    UML profile for that language.


    ![](img/b3a2d21424654c9a1d0654b2dce50e07_51_0.png)


    FIGURE 1.4: The viewpoints contributing to an ODP system specification, expressed
    using UML4ODP.


    In the profiles, stereotypes are used to represent the ODP concepts as specializations
    of the appropriate UML metaclasses. For example, figure 1.5 shows the UML profile
    for the information viewpoint language, as specified in the UML4ODP standard.
    It defines eight stereotypes and the UML metaclasses they extend. Some of the
    stereotypes have associated icons (shown in the right upper corner of the stereotype
    box). Icons are very useful because they provide an intuitive notation to the
    users of the ODP specifications. This becomes particularly important in some viewpoints,
    such as the enterprise viewpoint. The designer must decide how much of this information
    to show in any particular diagram. In this book, for example, we generally show
    the icons, and include stereotype names where doing so helps understanding,'
  merge: -1
  img_proc: true
- pgno: 52
  md: '![](img/b3a2d21424654c9a1d0654b2dce50e07_52_0.png)


    FIGURE 1.5: The UML profile for the information viewpoint.


    Taken from the UML4ODP standard; for copyright, see Preface.


    but omit them where the meaning is already clear, so as to avoid cluttering up
    some of the more complicated diagrams.


    Tag definitions are also used to specify stereotype properties. For example, the
    tag definition locationInTime of stereotype IV_StaticSchema allows the specification
    of the exact location in time of the static schema being modelled. Figure 3.4
    in chapter 3 shows an example of how this tag definition is used in the specification
    of a concrete static schema.


    # 1.7.3 The Integrated Toolkit


    Most software development now uses some form of integrated development environment
    (IDE), which takes care of much of the routine housekeeping concerned with building
    and archiving complex project structures. Eclipse [65], for example, is a particularly
    popular environment because of its extensibility. The same principle applies to
    other areas, such as business planning, and the trend is towards greater integration
    of the tools used, forming them into a single integrated toolchain.'
  merge: -1
  img_proc: true
