- pgno: 13
  md: '# # About the Authors


    **Peter F. Linington** is Emeritus Professor of Computer Communication at the
    University Kent in the United Kingdom. He has been involved in the standardization
    of the ODP Reference Model and its various supporting standards since the activity
    started. He has co-chaired WODPEC, the main workshop in this area, since its inception.
    His recent research interests cover architectural description, use of policies
    and model-based techniques. Further information can be found at http://www.cs.kent.ac.uk/people/staff/pfl/.


    **Zoran Milosevic** is a Principal of Deontik Pty Ltd., a small consulting and
    software company specializing in the planning, development and deployment of enterprise
    systems. He was involved in the standardization of the ODP Enterprise Language,
    and with several OMG standards, while working for the Distributed Systems Technology
    Centre (DSTC), based in Brisbane. He was the founder of IEEE''s Enterprise Distributed
    Object Computing (EDOC) conference. Further information can be found at http://deontik.com/About/Zoran.html.


    **Akira Tanaka** is a founder of view5 LLC, a small consulting company in Japan,
    specializing in applying viewpoints and model-based approaches to software development.
    He has been involved in RM-ODP standardization from its early days. While with
    the Hitachi Ltd. Software Division, he led the ODP committee of INTAP in Japan,
    and participated frequently in EDOC''s WODPEC. He was also active in OMG, including
    as a contributor to the UML Profile for EAI specification and SoaML RFP. Further
    information can be found at http://www.view5.co.jp/.


    **Antonio Vallecillo** is Professor of Languages and Information Systems at the
    University of Málaga, Spain. His research interests include open distributed processing,
    model-based engineering, componentware and software quality. He was co-editor
    of ISO/IEC 19793 (UML4ODP) and of the revised versions of RM-ODP Parts 2 and 3
    (ISO/IEC 10746-2/3). Further information can be found at http://www.lcc.uma.es/~av.'
  merge: -1
  img_proc: true
