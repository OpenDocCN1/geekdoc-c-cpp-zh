- pgno: 153
  md: '# # About Part III


    Building on the viewpoint structure, this part examines a number of ways in which
    requirements can vary, and shows how system designs can be made more resilient
    and more broadly applicable by applying suitable architectural techniques.


    To set the stage, chapter 8 explores the concepts of compliance and conformance,
    which provide the bridges between architecture, design and implementation. It
    shows how the different levels of design can flow through naturally into conformance
    assessment and testing.


    Following this, a series of chapters each examine different kinds of variation
    and how they can be coped with. Chapter 9 looks at variation in the environment
    in which the system may be deployed, and how the use of transparencies can decouple
    the application-specific concerns from these variations. Chapter 10 looks at the
    way changes in management to changes in requirements, each look at different ways
    the architectural framework can enable the smooth evolution of systems. These
    aspects are all concerned with the way systems change over time, and how the lifetime
    of a design can be extended in a changing environment.'
  merge: -1
