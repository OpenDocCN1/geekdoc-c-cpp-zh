    # 4.7 Relationship with Other Viewpoints


    As we have seen, the computational viewpoint specification is not normally designed
    in isolation, but is typically created after first drafts of the enterprise and
    information specifications are available (or, at least, in parallel with them).


    For example, a first step in producing the computational specification of a system
    consists of deciding the right configuration of computational objects and the
    interactions among those objects that guarantee that the system functionality
    is fulfilled, as prescribed by the enterprise specification. The description of
    these computational objects and interactions should also be done at the appropriate
    level of abstraction, and they need to manipulate the information handled by the
    system as prescribed by the information specification. This is why the elements
    in the enterprise and the information specifications can be used effectively for
    identifying the computational objects and their interactions.


    A different designer could also use a bottom-up approach if there are already
    good commercial off-the-shelf (COTS) or legacy components in the organization
    that can be used in the new system. Computational objects encapsulating the functionality
    of such legacy or COTS components are perfect candidates for the specification.


    Once identified, computational objects may be grouped into packages following
    a particular software architecture, such as collecting business-oriented objects
    within the same layer, and common functions or UI objects in others. Such a structure
    is what constitutes and defines the software architecture of the system. For the
    behaviour, many of the computational interactions will be derived (using refinement,
    for instance) from the dynamic schemata in the information viewpoint specifications.
    Finally, enterprise policies relating to the system''s business rules, together
    with information invariant schemata that control the state changes and integrity
    constraints on the system data, can serve as a starting point to specify the environment
    contracts for the computational objects and their interactions.


    Where a policy is identified in the enterprise viewpoint, the associated behaviour
    is expected to be mutable, so the computational structure must'
