- pgno: 223
  md: '# 15.2 Model Editors and Analysis Tools


    The first level of tool support required for the development of large systems
    specification should be provided by model editors. The RM-ODP was originally defined
    to be independent from any particular notation for expressing its concepts, so
    as to increase its use and flexibility. In other words, the ODP viewpoint languages
    are abstract languages in the sense that they define what concepts should be used,
    not how they should be represented. This lack of notations for expressing precisely
    the different models involved in a multi-viewpoint specification is a common feature
    for most enterprise architectural approaches, including the Zachman framework,
    the 4+1 model and the RM-ODP.


    The problem with defining only the abstract syntax of a language is that it makes
    the development of tools for writing the viewpoint specifications more difficult.
    More information is needed to allow the formal analysis of what is produced, and
    the possible derivation of implementations from the system specifications, and
    to manage the myriad other details needed to complete the specification.


    There have been many different notations proposed as ODP specification languages.
    The earlier ones came from academia, based primarily on formal languages such
    as Z [95], Object-Z [67], LOTOS [1, 18], Alloy [76] and Maude [61]. These notations
    provide precise system specifications and, more importantly, they allow the rigorous
    analysis of the systems, with tools for reasoning about the specifications including
    consistency checking, simulation for prototyping or model checking. However, the
    precision inherent in formal description techniques and the lack of industrial
    tool support has hampered their wide adoption.


    As we mentioned before, the acceptance of UML, the number of available UML tools,
    the increasing interest in model-driven development and the model-driven architecture
    (MDA) initiative, all contributed to motivating the ISO/IEC and ITU-T to launch
    the UML4ODP joint project in 2004. This aimed to promote the use of UML for ODP
    system specifications. We have already described the UML4ODP project and its notation
    in section 1.7.2. The goal of this joint project was that ODP modellers should
    use the UML notation for expressing their ODP specifications in a standard graphical
    way, and that UML modellers should be able to use the RM-ODP concepts and mechanisms
    to structure their large UML system specifications.


    The fact that the UML4ODP notation is defined as an extension to UML by means
    of a set of UML profiles makes its adoption easier. UML profiles are available
    for all the major UML modelling tools, which enables the use of the UML4ODP notation
    within them. Furthermore, specialized model editors for UML4ODP have been created
    making use of these profiles and these are also available as plug-ins for some
    of the widely used UML modelling tools.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'One example is the UML4ODP plug-in for MagicDraw. These domain-specific tools
    allow users to work with the ODP concepts and mechanisms as first class entities
    in their editors, and provide common skeletons and templates for the specifications.


    However, editing with a set of UML profiles may not be enough when building large
    system specifications. There is also the need to check that the structure and
    architecture of these specifications is correct. One of the benefits of using
    a reference model such as the RM-ODP is that it allows structuring the specifications
    according to a fully tested standard architecture. The fact that the structuring
    rules of ODP viewpoint languages are explicitly defined in the standard has enabled
    the development of tools that allow validation of the models, checking that they
    comply with the ODP reference architecture. This is already possible with some
    of the plug-ins mentioned previously, which are able to detect missing parts of
    the specification, architectural problems, conflicting elements or violation of
    the structuring rules.


    Another key role for tools in this context can be seen in the validation of the
    individual viewpoint specifications. We have mentioned that there are notations
    for the viewpoints that allow their formal analysis and even simulation. The question
    is how to connect the UML4ODP specifications with these notations so as to be
    able to make use of their toolkits. This is where model-driven techniques really
    come into play.


    # 15.3 Model-Driven Approaches


    There has been a great deal of emphasis in recent years on the development of
    model-driven techniques for system design and development. This movement is marked
    by a change of emphasis from a situation where models were used primarily to capture
    requirements and set the scene for a creative coding process to a situation where
    the models are the prime focus of the design and the source representation for
    design information, from which a largely mechanical implementation process derives
    its steering information. The assumption is then that the models are the place
    to go to answer any questions about the system. Any modifications are carried
    out as changes to the models followed by an incremental reworking of the implementation
    process. With strong enough tools, this reworking can be cheap and quick to carry
    out.


    We are all familiar with such almost total reliance on tools in the support of
    high-level languages. The overwhelming proportion of program development is now
    carried out in languages like Java, and hardly anyone gives a second thought to
    the processes of compilation from high-level language to object code, or JIT compilation
    of object code to machine code, that underlie the execution of such code. Promoting
    this to start at the model level is not entirely straightforward because the models
    are more abstract and one single'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'refinement route is not always appropriate, but the rewards of doing so are
    considerable; this is what the model-driven approach is trying to do.


    Work to raise the abstraction level at which designs are formulated has been a
    major research thread for a long time and, as should now be clear, was an important
    influence on the development of the ODP viewpoints. However, the ideas gained
    prominence in 2001 when the OMG brought much of the earlier thinking together
    in their MDA white paper [92]. This focused initially on one particular problem,
    the decoupling of application designs from the details of the growing number of
    middleware platforms available. The answer proposed was to capture the application
    detail in a quite abstract model and then provide tools that could specialize
    this single design for each of the platforms available.


    One of the main contributions was to recast thinking that had previously been
    in terms of translation between languages with different grammars so that the
    ideas were expressed as models whose form was governed by corresponding metamodels
    (although a metamodel is still, basically, just a grammar). If the transformation
    that was needed from abstract and concrete models could be defined in terms of
    metamodels, a single tool generated from them could be used for transforming the
    whole family of models that shared the same metamodel (see figure 15.1). In practice,
    transformations need to be parameterized to make them more widely applicable,
    so the process is steered by a combination of the material embedded in the transformation
    and some additional information supplied when a particular transformation activity
    is performed.


    Later, the OMG extended their architecture to support more than one refinement
    step, and identified three major modelling levels, yielding


    ![](img/b3a2d21424654c9a1d0654b2dce50e07_225_0.png)


    FIGURE 15.1: A framework for model transformations.'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'computation-independent models (CIM), platform-independent models (PIM) and
    platform-specific models (PSM) [84]. Note that the terms PIM and PSM are defined
    relative to some chosen concept of a platform, and may be applied recursively
    as the system design is refined. Researchers have suggested that one approach
    to integration of, for example, non-functional aspects such as security is to
    extend the chain to involve a whole series of transformation steps [63, 80], leading
    to a convergence with aspect-oriented programming.


    It is tempting to try to draw parallels between this family of models and the
    viewpoints, but there is an important difference that makes such connection inappropriate.
    This is the fact that the viewpoints are characterized by stakeholder interest,
    while the ideas of CIM, PIM and PSM are relative to technological detail. Thus,
    as technologies evolve and the design focus drifts up to higher levels of abstraction,
    there will be a gradual relative drift between the two systems.


    # ### 15.4 Model Transformations


    Models and transformations are the key ingredients of the model-driven architecture
    approach. A model transformation is basically an algorithmic specification (either
    declarative or operational) of the relationship between models, more specifically
    the *mapping* of information from one model to another. A model transformation
    involves at least two models (the source and the target), which may conform to
    the same or to different metamodels. The relationship defined by a model transformation
    determines the valid mappings between models conforming to these metamodels, and
    can be of different types depending on the nature of the relation: unidirectional
    or bidirectional, refining or abstracting, endogenous or exogenous (depending
    on whether the source and target metamodel are the same or not), and so on. The
    transformation specification is normally given by a set of model transformation
    rules, which describe how a model in the source language can be transformed into
    a model in the target language.


    In addition to model-to-model transformations, it is also possible to define text-to-model
    and model-to-text transformations, in which the language of the source or target
    model is expressed using a textual notation. The former are called injectors,
    and are very useful for converting programs or documents into models that can
    be manipulated using model-driven techniques and tools. Extractors are useful
    for producing structured documents (text, Word, Excel, HTML, XML or program source
    code) from models.


    A model transformation can also be considered a model in its own right, which
    presents opportunities for higher-order transformations, that is, transformations
    that manipulate models representing other model transforma-'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'tions [97]. The metamodel of a transformation corresponds to the language in
    which the transformation is written.


    The initial discussions of model-driven transformations focused on transformations
    that are one-to-one, with each transformation linking precisely one source to
    one target. In general, however, the development of structured specifications
    leads to more intricate patterns, where the transformations are typically many-to-many.
    One common pattern involves weaving multiple pieces of specification together
    to yield a single target. Another is the derivation of a number of implementation
    elements from a single design, yielding, for example, both executable code and
    deployment control files, such as tailored sets of firewall rules.


    Another important use of model transformations is to define bridges between technical
    spaces or even semantic domains. For example, model transformations can be used
    to translate specifications written in UML4ODP into their corresponding specifications
    in Maude or in Alloy, in order to make use of the analysis facilities and tools
    available in these target domains. Furthermore, model transformations are extensively
    used nowadays to build two-way bridges between systems or applications that use
    disparate technologies or live in different technical spaces (such as EMF [55],
    CORBA, Java or RDBMS, to name but a few).


    Finally, it is important to mention that model transformations are not normally
    defined in isolation, but as part of a set of transformations that are composed
    together into a model transformation chain that provides a more powerful piece
    of functionality. This follows the typical pipelined approach used, for instance,
    by the Unix shells, in which several commands are chained together using pipes
    to form a specialized application.


    # ## 15.5 Languages for Transformations


    Having an architecture for transformations is not much good without a corresponding
    language for defining them. The OMG has therefore defined a recommendation known
    as QVT, or *Meta Object Facility (MOF) 2.0 Query/View/Transformation Specification*
    in full [41]. This provides a specification toolkit with a range of features for
    transformation specifiers with differing requirements.


    One of the ongoing debates about the use of transformations has been whether they
    should be defined in a declarative or imperative style. Some claim that a declarative
    style is more suited to the expression of architectural relationships because
    it is more abstract, while others prefer an imperative approach as being easier
    to write and debug. QVT supports both styles by providing two different languages,
    called QVT Relations and QVT Op-'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'erational. Both of them are implemented on top of a low-level, imperative language
    called QVT Core.


    Just like programming languages, there are many other model transformation languages
    currently available, among which ATL (the ATLAS Transformation Language) [78]
    is probably the more widely used. ATL is a hybrid model transformation language
    containing a mixture of declarative and imperative constructs. ATL transformations
    are unidirectional, operating on read-only source models and producing write-only
    target models.


    In general, the model transformation language to use depends on the specific characteristics
    of the relationship we want to establish between the source and target model,
    and the selection of the best way to express it.


    There are also several languages for writing model-to-text transformations, such
    as MOFscript, JET, TCS or Acceleo. The last of these is an implementation of the
    OMG MOF model-to-text (MOFM2T) language [32]. TCS (Textual Concrete Syntax) can
    be used for specifying both injector and extractors. It enables the specification
    of textual concrete syntaxes for domain-specific languages (DSL) by attaching
    syntactic information to metamodels. With TCS, it is possible to parse (text-to-model)
    and pretty print (model-to-text) DSL sentences. Again, the language to use in
    each case depends on our specific requirements and preferences.


    # 15.6 Viewpoints and Transformations


    So, how does this transformation approach relate to the ODP viewpoints? Firstly,
    it must be made clear that these techniques can be used to support refinement
    or other automated design steps within a single viewpoint. They could, for example,
    support the community refinement described in chapter 2. However, the approach
    is particularly important for integrating and bringing together information from
    different viewpoints. The transformational approach can be used to support the
    various steps needed to combine and refine the different viewpoint models to yield
    a working system, but the nature of the steps to be taken depends on the viewpoints
    concerned, and there is more than one way of putting the pieces together. However,
    we can see a number of styles depending on the viewpoints concerned.


    In the current context, we can distinguish three kinds of transformation pattern
    (although there are many more), which differ in terms of the roles the viewpoint
    specifications play and the nature of the information flows (see figure 15.2).
    These are:


    +   1. Merging transformations, in which two specifications are combined to generate
    a composition. This can be performed by following a set of defined by correspondences.
    One example of this is the import of defini-'
