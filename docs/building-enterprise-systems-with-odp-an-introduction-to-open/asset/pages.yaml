- pgno: 211
  md: '# About Part IV


    The last part takes us beyond the material contained in the ODP reference model
    standard itself. It does this in two main ways.


    First, we look at the way the reference model is formulated, aiming to answer
    some of the questions a reader might have as to why particular approaches were
    taken and what assumptions are being made about the conceptual framework that
    underpins the various modelling activities. This gives a brief glimpse of the
    theoretical basis of ODP, and raises some fascinating questions, but is not essential
    reading for straightforward users.


    Chapter 15 concentrates on the tool chain. The ODP work assumes a powerful set
    of tools and a considerable degree of automation in support of the design process,
    but the ODP standards do not cover this area or indicate how such tools are to
    be constructed. This chapter makes up for this by reviewing some of the key directions
    taken in the rapidly moving world of model-driven, tool-supported design and development.


    Finally, chapter 16 looks briefly at where more information on the topics covered
    can be found and identifies a number of other proposals for enterprise architectures.
    This chapter also mentions a number of areas of work that ODP has influenced in
    recent years.'
