    # ## 5.5 Common Functions and Processes


    In addition to allowing the engineering objects to be placed on different nodes,
    the engineering viewpoint identifies some common functions, called ODP functions,
    that are needed to support the transparency requirements. Broadly similar sets
    of functions are found in the various distributed systems available today, although
    they are generally implemented in a technology-specific way. The engineering viewpoint
    defines an independent vocabulary, offering a technology-neutral description of
    them. These functions allow the hiding of system failures, resolving the location
    of objects from their names, finding service offers (by trading), managing events
    and so on. Some of the ODP functions can be considered as providing basic processing
    patterns to achieve the common functionalities for distributed systems, and the
    basic building blocks for designing distribution infrastructures in a reusable
    manner.


