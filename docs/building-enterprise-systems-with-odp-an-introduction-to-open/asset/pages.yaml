  md: '# Chapter 8


    # Conformance — Does It Do the Right Thing?


    Nigel had paused at Trudy’s cubicle to say hello, and had got more than he bargained
    for. Her desk was covered with pieces from printed documentation, and there were
    about a dozen windows open on her screens. They were all covered with pieces of
    highlighting and notes, and the whiteboard was a tangle of circled references
    linked by arrows. One particular looped set of arrows was traced in red marker.


    “It’s no good,” she said, “they just don’t say what the rules are.” “What’s the
