    ponents and describe the solution in an IXIT. An acceptance tester acting for
    the operator then uses this information to test the new component. If the test
    is successful, the component is deployed, but otherwise it is corrected and tested
    again.


    # ### 6.3 Relationship with Other Viewpoints


    The technology viewpoint is primarily related to the engineering viewpoint because
    it specifies the hardware and software components that have to implement the engineering
    objects, including the nodes and channels identified in the engineering specification.
    Thus, there is a technology object corresponding to every atomic or composite
    engineering object. Note that the relation goes both ways: engineering objects
    provide the entities that need to be implemented, and technology objects provide
    the information on the specific technology used to implement them and the standards
    to which these implementations should conform.'
