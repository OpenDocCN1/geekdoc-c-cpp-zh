- pgno: 34
  md: 'said. "But look here," said Claire, "we can''t add all that into the application
    design, or we will lose sight of the application architecture. It will be a mess.
    And we don''t need the application and infrastructure teams to duplicate each
    other''s work."


    Marcus banged the table. "Hold on now. You are all talking at once. Alex, you
    haven''t spoken yet. What''s your take on what you have just heard?"


    Alex stood up and walked over to the flipchart. "I think you have all made good
    points." He said. "This is a very large design, and there are conflicting requirements,
    needing different focuses and levels of detail. The best way to handle it is to
    divide and conquer; you should identify the key stakeholders, and then describe
    the problem from their points of view. If you can identify the right stakeholders,
    the different views can be largely independent, and so they can be worked on in
    parallel. The framework I want you to work with is called ODP, and it stresses
    five such viewpoints." He sketched a diagram on the chart with five arrows converging
    on the design problem. "These correspond roughly to organizational responsibilities
    in a situation such as yours, namely business processes, systems analysis, data
    integrity, infrastructure and intellectual or physical resources. If you each
    start with your own focus and the level of detail you need, we can then link the
    different views together to describe the complete problem."


    "What I would like each of you to do is prepare an outline of the requirements
    as you see them, and then we can see how they fit together and move on from there."


