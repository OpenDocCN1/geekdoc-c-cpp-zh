    refine such models have been established, then a great deal of the work in creating
    the complete system specification can be automated.


    This level of automation of specification management also allows evaluating the
    impact of proposed changes to be made a much simpler and more efficient process,
    so that it is possible to associate accurate transition costs with proposed changes
    as part of the decision-making process.


