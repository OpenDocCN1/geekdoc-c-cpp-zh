  md: '# # Appendix A


    # ## The PhoneMob Specifications


    This appendix summarizes the specifications that make up the PhoneMob example,
    focusing on their structure and organization. While the main text of the book
    is primarily focused on the individual elements of the ODP specifications, this
    appendix gives the reader a more global view of its organization.


    **Overall structure.** Figure A.1 shows the overall structure of the PhoneMob
    specifications, expressed in the UML4ODP notation. It provides a complete view
    of the UML model shown earlier in figure 1.4, but this time with all of its constituent
    packages. There are five for the individual viewpoints, and six for the correspondences
    between them (since, in this case, not all correspondences are required).


    ![](img/b3a2d21424654c9a1d0654b2dce50e07_247_0.png)


    **FIGURE A.1:** The overall structure of the PhoneMob system specification.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# A.1 Enterprise Viewpoint Specifications


    The enterprise language defines four key concepts: enterprise specification, system,
    scope and field of application.


    In our example, the system to be specified is a computerized system that supports
    the operations of the PhoneMob company. The scope of this system describes its
    expected behaviour, stating the way it is supposed to work and interact with its
    environment in the business context. The scope of the system is modelled in terms
    of the set of roles it fulfils (see section A.1.2).


    The enterprise specification of the PhoneMob system is expressed by one model,
    stereotyped «Enterprise_Spec», which contains the contracts of all the communities
    that make up the specification, as shown in figure A.2. This also shows the field
    of application of the specification, which describes the properties that the environment
    of the ODP system must have for the specification to be used. It is expressed
    by means of a tagged value of the «Enterprise_Spec» model, giving the enterprise
    specification of the system.


    ![](img/b3a2d21424654c9a1d0654b2dce50e07_248_0.png)


    FIGURE A.2: The structure of the PhoneMob enterprise specification.


    # A.1.1 Communities and Their Contracts


    Figure A.2 shows that the enterprise specification of the PhoneMob system is composed
    of the specifications of three communities: Phone Repair (shown in figure A.3),
    CustomerOrg (shown in figure A.4) and Logistics Provision (shown in figure A.5).


    In general, all community contracts have the same structure: one objective (which
    in a real contract would be more specific and detailed) and four main packages
    with the specification of the community roles, object types, processes and policies.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '![](img/b3a2d21424654c9a1d0654b2dce50e07_249_0.png)


    FIGURE A.3: Community contract for the Phone Repair community.


    # A.1.2 Community Roles and Object Types


    The roles of the communities have already been described in detail in the chapter
    2. For example, figure 2.2 showed the roles of the Phone Repair community, which
    are summarized here within figure A.3. The roles for the other communities are
    named in the Roles package included in the community contracts (shown in figures
    A.4 and A.5).


    Enterprise object types are described in their corresponding packages. For example,
    figure A.6 shows the object types defined in the Phone Repair community. Assignment
    policies constraining which enterprise objects can fill which roles in the communities
    were shown in figures 2.5 and 2.6.


    ![](img/b3a2d21424654c9a1d0654b2dce50e07_249_1.png)


    FIGURE A.4: Community contract for the CustomerOrg community.'
  merge: -1
  img_proc: true
