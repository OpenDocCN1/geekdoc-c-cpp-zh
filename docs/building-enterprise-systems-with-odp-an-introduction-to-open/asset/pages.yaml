    Apart from the computational objects that encapsulate the system functionality,
    there is a need to represent the bindings between these objects. This is particularly
    useful for modelling connections that have nontrivial behaviours, such as ones
    that report exceptions to other parts of the system. Connecting two or more objects
    in a seamless way is not a trivial task, and therefore the RM-ODP is very careful
    about how a binding is specified and realized. In ODP, a binding is a context
    created by establishing a communication relationship between two or more objects,
    and a binding is created by a binding action. Normally, a computational object
    initiates its interaction with another computational object by performing a binding
    action that allows them to connect to each other and start exchanging services
    and data. However, in some cases, particularly where multimedia communications
    is involved, one object can initiate a binding between a number of other objects;
    this is known as third-party binding.


    RM-ODP distinguishes two kinds of binding: primitive and compound. In a primitive
    binding, the connection between the objects is direct and does not require the
    use of any other object between them; this is the situation when we connect the
    required and provided services of two components by simply sharing the UML interface
    that defines the signature of their operations. This is shown, for instance, in
