    # 6.2.3 IXIT


    The technology language also plays a major role in the conformance testing process.
    Conformance testing is based on the observation of the system implementation at
    certain points defined in the specification to be conformance points. These points
    are a subset of the set of reference points established in the specification which
    need to be accessible for testing (see chapter 8 for more detail). Although how
    they can be found is documented in this viewpoint, the points themselves are typically
    associated with various kinds of accessible interfaces defined in the engineering
    specification. Four classes of reference point at which conformance tests can
    be applied are defined. The first is a programmatic reference point representing
    a software interface, observable via operating system logs or by the installation
    of portable interceptors. The second is a perceptual reference point observed
    by direct inspection of the physical system, looking at a screen or a mechanical
    actuator. The third is an interworking reference point, checked by examining the
    messages passing between systems, and the last is an interchange reference point,
    checked by reading some portable medium produced, such as a CD-ROM or external
    hard drive.


    However, since a specification typically does not define a complete protocol stack,
    but leaves some detailed choices to the implementer, an implementation needs to
    be accompanied by some extra explanation from the implementer about how the implementation
    is structured and how the tester is to access'
