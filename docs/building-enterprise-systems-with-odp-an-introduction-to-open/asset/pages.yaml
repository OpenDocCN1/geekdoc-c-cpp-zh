  md: 'literature, particularly in the EDOC series of conferences or the associated
    series of WODPEC workshops.


    # ### 16.3.1 NASA RASDS


    International collaboration on space exploration and the deployment of space-based
    data collection platforms has led to a need to share facilities and resources.
    As always, this has focused attention on the need for a framework to promote interoperability,
    and the Consultative Committee for Space Data Systems has, as a result, proposed
    the *Reference Architecture for Space Data Systems* [62]. This has subsequently
    been published by the ISO as ISO 13537 [11].


    This architecture is based on the RM-ODP, but with an expanded set of viewpoints
    to take into account the special concerns with details of communication and spacecraft
    system engineering that arise from the special challenges of the space environment.


    # ### 16.3.2 Service-Aware Interoperability Framework


    The RM-ODP has recently been used as input to the Health Level 7 (HL7) standardization
    efforts. HL7 International is a not-for-profit, ANSI-accredited standards development
    organization with members from over 55 countries, dedicated to providing a comprehensive
    framework and related standards for the exchange, integration, sharing and retrieval
    of electronic health information. It aims to support clinical practice and the
    management, delivery and evaluation of health services.


    RM-ODP has been used to provide architectural underpinning to a broad range of
    e-health interoperability problems. This part of the HL7 effort is referred to
    as the Service-Aware Interoperability Framework (SAIF) [73].


    SAIF provides a framework for ensuring interoperability when exchanging documents,
    messages and services between health organizations. This consists of four core
    subframeworks:


    +   - The Information Framework (IF), which defines how the static information
    of importance to a given domain is captured and refined through a traceable process
    to yield an implementable or implemented information artefact.

    +   - The Behavioural Framework (BF), which provides a technology-independent
    way of describing behaviour in e-health systems. Many of the concepts from the
    enterprise and computational languages and some of the foundational concepts have
    been adopted within the SAIF behavioural framework.

    +   - The Governance Framework (GF), which provides an abstract governance model.
    This can be applied within an interoperability community,'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'within a standards development community, across standard development communities
    or within a specific enterprise architecture. A subset of the ODP enterprise language
    is used.


    +   - The Enterprise Conformance and Compliance Framework (ECCF), which provides
    an organizational framework in which interrelated e-health architectural artefacts
    are categorized by content. It is used to define conformance and compliance statements,
    and is based on the treatment of conformance in the RM-ODP.


    # **16.3.3 Use in Other Standards**


    In previous chapters, we described the main members that make up the ODP family
    of standards. However, the influence of the ODP work is not limited to this and,
    in addition, the ODP framework has also been used by a number of other ISO projects.


    The most prolific field of application has been in the ITU-T work in support of
    management of their transport networks. The recommendation *G.851, Management
    of the Transport Network* [25] and a family of twenty-five associated recommendations
    dealing with different facets of management information are all built using the
    ODP framework. Related work is continuing within *ITU-T Study Group 17, concerned
    with Question 13/17 on Formal Languages and Telecommunications Software*.


    An example of use in a quite different area is the standard *ISO/TS 17573: Systems
    Architecture for Vehicle-Related Tolling* [20], which is currently being revised
    after seven years of use. It uses the ODP reference model to provide an architecture,
    a standard vocabulary and a modelling approach that allows the system to be seen
    from different viewpoints, covering a wide range of requirements, from hardware
    components and network protocols or interfaces to enterprise roles and general
    policies of the system as a whole. This is accomplished by applying different
    sets of concepts and terminologies that make up the viewpoint languages. A complete
    description of a real system is only achieved when all the viewpoint models are
    present. This allows the experts in vehicle automation to achieve a clear separation
    of concerns and gives an easier way to define conformance systems.


    Another example can be found in the standard *ISO 19119: Geographic Information
    Services* [21], which provides a framework for interoperability of products involved
    in the access to and processing of data in geographic information systems. This
    uses the ODP viewpoints to structure the framework, and has chapters explaining
    the domain-specific detail associated with each of the ODP viewpoints. Service
    composition is based on the computational specification, and semantic interoperability
    on the information viewpoint. The result is a modular, service-oriented toolkit
    for the construction of workflows involving data repositories for geographic information
    associated and analysis systems.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'The trend is continued in a recent multi-part standard ISO 12967: *Health Informatics
    — Service Architecture (HISA)* that provides an architectural framework for healthcare
    informatics, which gives a set of ODP viewpoint specifications for service definition
    and integration [6–8]. Its aim is to provide a single approach that unifies the
    integration of new developments and commercial off-the-shelf products with existing
    legacy systems, so there is a strong emphasis of federation. Each part of the
    standard addresses one of the ODP viewpoints.


    Turning to other architectural standards, the reference model for ODP is called
    out in IEEE 1471 (and in its successor, ISO 42010) as a prime example of a framework
    complying with the viewpoint-based architectural descriptions it prescribes. In
    fact, the RM-ODP and these two standards for architectural description have had
    a significant influence on each other, and the groups concerned have maintained
    strong, active liaison to achieve consistency between them.


    The use of the RM-ODP continues in new work; a notable piece of work in progress
    within ISO is concerned with the standardization of a metamodel framework for
    interoperability, which is underway in *ISO/IEC JTC1 SC32*. This work is basing
    its description of services on the ODP metamodels, and is likely to be exploited
    in further work on service equivalence in service-oriented and cloud computing.


    These are just a few of the ways the RM-ODP continues to influence and support
    a broad range of standardization activities.


    # 16.4 Tools


    There are several UML tools that offer UML4ODP capabilities. For instance, No
    Magic’s MagicDraw is a popular commercial UML tool, which we used to develop the
    UML4ODP standard and which has also been used to draw the various UML diagrams
    in this book. The Spanish team involved in RM-ODP standardization developed a
    plug-in for this product, information about which can be found at http://www.magicdraw.com/uml4odp_plugin.
    The plug-in adds a custom menu item called *RM-ODP*, which provides access to
    the basic ODP diagram templates and to some model checking tools. It presents
    a custom ODP palette for each of the ODP diagram types, allowing easy drag-and-drop
    diagram creation. The plug-in is easily installed with the UML tool’s resource
    and plug-in manager, which is accessed from the tool’s help menu.


    Sparx System’s Enterprise Architect is another UML tool with which you can add
    ODP functionality. After installing the ODP capability, users can draw UML4ODP-based
    diagrams. Further information can be found at http://www.sparxsystems.com.au/products/3rdparty/odp/index.html.
    There'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'are many more UML tools, such as PatternWeaver, with which readers can work
    on ODP modelling. However, readers are advised to consult with their tool vendors
    to see what plug-ins are available.


    Many of the groups producing standards or other specifications maintain lists
    of known products using them, and these lists are a fruitful source of information
    about potential tool vendors and relevant groups in the open source community.
    Tool vendors usually implement standards enhanced with their own capabilities,
    look and feel and other special features to appeal to their customers.


    The open source community is a place where interested people get together to implement
    something of common interest to them. In the case of UML and the UML profile,
    OMG''s UML page (http://www.uml.org/) and MDA page (http://www.omg.org/mda/) are
    good starting places to find such tool vendors. As a good example of an open source
    community, you can look at the Eclipse foundation (http://www.eclipse.org/). Within
    the Eclipse community, there is specific support for the creation of modelling
    tools in the form of the Eclipse Modelling Framework [55]. There are various implementations
    in the Eclipse modelling projects (http://www.eclipse.org/modeling/), including
    a UML 2 tooling project. You can also find implementations of different modelling
    styles.


    # ## 16.5 Comparing Enterprise Architectures


    A number of proposals for architectural frameworks have been made in recent years;
    they all target the design and evolution of enterprise systems. However, they
    are not easy to compare because they differ in their individual scope and emphasis.
    This implies that each has its own areas of strength and weakness.


    We can divide the proposals into two groups. First, we have those frameworks that
    aim to classify all the different artefacts, processes and people involved in
    the specification of the enterprise system and its contents. The earliest example
    of this style is the Zachman framework [94]. This was produced in the late 1980s
    and introduced the idea of an architectural framework, which soon became popular.


    The Zachman framework provides systematic guidance for organizing the contents
    of an enterprise architecture and is often used to represent a portfolio of the
    existing architecture artefacts within an organization. It has evolved through
    several different revisions, which all use a two-dimensional matrix to offer a
    taxonomy of architectural elements and processes; depending on the version, this
    requires choices to be made between as many as 36 matrix cells. However, it focuses
    on the categorization of the enterprise architecture'
