    # ## 5.1 What Is the Engineering Viewpoint For?


    The goal of the engineering viewpoint is to identify and specify the supporting
    mechanisms for distributed interactions between objects. The focus is on specifying
    how distribution works — how objects are distributed over nodes, and how the structures
    of the nodes, and of the channels linking the nodes, are going to be modelled.
    It also defines common functions needed to support the required distribution transparencies.
    Clearly, this viewpoint is'
