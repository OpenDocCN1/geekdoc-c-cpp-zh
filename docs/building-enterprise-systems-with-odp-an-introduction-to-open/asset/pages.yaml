- pgno: 230
  md: 'Looking at the relationship between specific viewpoints, some follow a single
    pattern, while others are composite in nature. The relationship between the computational
    and engineering viewpoints is perhaps the simplest, being a straightforward refinement
    relation, in which the engineering viewpoint provides a set of templates for refining
    the computational specification. This results in an ephemeral specification that
    is not one of the ODP viewpoints, but represents an abstract implementation. Since
    it will be regenerated afresh whenever necessary, it will track changes in the
    computational and engineering viewpoints as they occur.


    The relationship between the information and computational viewpoints involves
    a merge, in which information types are imported into the computational specification,
    where they will generally be used as a starting point for further refinement as
    part of the computational design process.


    The relationship between the enterprise specification and the others is again
    primarily a refinement, but the rules to be applied depend on the organization
    and the methodology in use, so that many approaches to unification are possible.


    The involvement of the technology viewpoint is more complex because it deals with
    several different kinds of information. The viewpoint covers the available resources
    and their configuration, as well as catalogues of implementable standards and
    conformance requirements. One of the main activities is the performance of an
    allocation step that associates tasks in the abstract implementation to specific
    resources; the results of this allocating transformation is added to the technology
    viewpoint configuration information. There is then an instance of relationship
    between technology viewpoint elements produced and the engineering elements being
    supported.


    These examples give an idea of how transformational tools can manipulate viewpoint
    information and support the realization of the system that has been designed.
    There are, of course, other information flows as part of the system generation
    process, drawn from the patterns given previously, or otherwise, but it should
    be clear that the tools will each need to act on and combine information from
    different viewpoints to do their job.


    Model transformations can also be very useful for keeping different models synchronized.
    These models can be either two representations of the same viewpoint specification,
    or two viewpoint specifications related by a set of correspondences. The first
    case happens when the user applies two concrete syntaxes to express one viewpoint
    language, for example a textual and a graphical one. In the second case, changes
    in one of the viewpoint specifications may need to be reflected in the rest of
    the related viewpoints. As indicated in chapter 7, the correspondences can be
    used to propagate these changes, and model transformations provide a natural mechanism
    for keeping these specifications in step. For instance, think of two elements
    living in different viewpoints, but related by a correspondence that establishes
    that their names should coincide. Model transformations can be responsible for
    changing the name of an element whenever the related one is modified.'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'Finally, correspondences can also be very useful in multi-viewpoint specifications
    for checking consistency between the different views. Part 3 of the reference
    model discusses this problem and explains that, if two viewpoint specifications
    S1 and S2 are related by a set of correspondences that can be specified in terms
    of a model transformation T, the transformation can be applied to S1 resulting
    in a new specification T(S1). This can then be compared directly to S2 in order
    to perform different kinds of checks. Examples of such consistency checks include,
    for instance, behavioural compatibility [60] between allegedly equivalent sets
    of objects, or the detection of contradictory constraints in one or another of
    the viewpoint specifications.


    # 15.7 More Integration


    We are a long way from a situation where a system can be deployed from a set of
    viewpoint specifications at the press of a button. In fact, it is unlikely that
    we will ever achieve this Utopian objective. Indeed, there are both positive and
    negative aspects of the move towards greater integration.


    On the positive side, there is the possibility of making more information available
    about the way the organization actually works, and feeding this information back
    into the system management and control processes. If some information is available
    about actual patterns of usage, it can be fed back to assist autonomous management
    mechanisms. We can optimize and balance the use of resources by establishing new
    paths within the toolchain.


    On the other hand, we need to retain a certain looseness of coupling and compartmentalization
    to allow proper management. We do not actually want changes in the enterprise
    models to feed through immediately into the running system. We need to observe
    review processes before changes are accepted, and to allow designers to experiment
    with, and assess the impact of, possible changes before they are put into effect.
    One of the requirements that goes hand-in-hand with the progressive increase in
    the level of integration is the need for more powerful management tools for the
    whole process, allowing for the exploration of options and the circumscription
    of activities a designer can carry out, so that they do not exceed their authority.'
  merge: -1
  img_proc: true
