  md: 'For example, an information exchange service component may be obtained to integrate
    information provided by a group of contributing peers. From the point of view
    of providing this service, it is the coordinating activity which will form the
    focus of its enterprise specification; the objective is to generate and distribute
    a common shared image from information contributed by members of a group. Why
    they should wish to do this is not of any concern to the component provider.


    Associated with this view of the product, there will then be a set of shared data
    types in an information view, a computational access procedure, and supporting
    engineering and technology constraints.


    Such a component could be used in many ways. In coordinating a committee, or a
    project group, the information exchange is a specific kind of interaction between
    the community roles being specified, and the service for doing so is therefore
    visible in the enterprise specification; however, the exact way the service is
    accessed forms part of the computational specification. On the other hand, in
    a survey application, the coordination may be implicit, expressed via requirements
    on one particular role to provide statistical information, but without reference
    to the enabling service until the detailing of the computational specification.
    Finally, if a scientific modelling activity needs to exploit distributed simulation
    tools, the same coordination component might be used as a collation mechanism
    in the engineering viewpoint but be completely invisible in the computational
    design.


    To achieve this, the viewpoints of the component and the user applications are
    related in different ways, but retain their independence. A practical example
    of this can be seen in the standardization of the ODP trader function (ISO/IEC
    13235-1), a general-purpose service publication and resource discovery mechanism
    [9]. This standard describes enterprise, information and computational specifications
    of trading, but leaves the engineering specification to a platform designer (although
    one specific engineering realization, supporting the use of directories, is standardized
    in ISO/IEC 13235-3 [10]).


    The trader function is visible in application designs only in their computational
    view as a service accessed by well-known interfaces, and in the definition of
    selected information data types and constraints. This reflects the difference
    between the stakeholders involved in an organization that uses a service and the
    organization that provides it.


    # 12.3.2 Changing Technologies


    As a product evolves, it acquires new features and exploits new supporting services.
    The supplier maintains upwards compatibility if no service is withdrawn and no
    additional demands are made on the infrastructure. At each step in the evolution,
    there is a corresponding set of models describing capabilities and requirements.
    In practice, many vendors offer a more restrictive guarantee of compatibility,
    in which, at every release, a statement is made about how many steps back down
    the release chain the compatibility relation-'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'ship holds, perhaps with an associated warning about what the situation is
    expected to be following the next upgrade, so that users have time to respond
    to impending changes that would otherwise cause them problems.


    If new product features become available, the user first has to decide whether
    they offer sufficient benefits to merit a migration campaign. Such a campaign
    will normally start with an assessment of whether the changes would offer local
    usability improvements within the existing business processes, or whether a change
    to the business processes themselves is going to be needed. Consider, for example,
    a workflow management system. This might have its user interface upgraded, replacing
    a coarse-grained web forms interface with a more dynamic AJAX-based interface
    without making a significant difference to the business process, but requiring
    changes to the interfaces of a number of decision-support plug-ins. Or, on the
    other hand, dynamic work rescheduling features might be added to the same service,
    resulting in significant changes to the business processes because they make possible
    finer scale targeting of premium services to critical markets.


    Once a level of abstraction has been identified at which the proposed enhancement
    is no longer visible, this level can be used as an overarching invariant and the
    change becomes a refactoring exercise aiming to maintain this target description.
    This analysis helps to identify the scope of the changes with confidence, since
    the invariant elements essentially limit the degree to which consequential changes
    can propagate in the design. There is clearly a strong parallel here with the
    discussion of federation in chapter 11.


    # ### 12.3.3 The Changing Views of a Stakeholder


    One of the consequences of opting for the use of externally purchased products
    and services is that there is a shift in the local stakeholder concerns, and this,
    over time, results in evolution of the viewpoints used to model the system as
    a whole. Something that was previously a major concern for engineering design
    may cease to be of interest at all if responsibility for some particular set of
    mechanisms is outsourced.


    Consider, for example, the change in emphasis if an organization decides to buy
    in a trust management solution from one of the specialist suppliers. A whole range
    of encryption key-management technologies for which local skills had been needed
    in the past become simply background information required for risk assessments
    of the use of the external supplier, and the servers and plug-ins needed become
    just black boxes. However, in consequence, there is a strong dependency on the
    external supplier and, in some respects, a reduction in agility. Accepting this
    is as much a business decision as a technical one.'
