    # 4.6 Writing Computational Specifications


    Apart from relying on a set of well-defined concepts and mechanisms for expressing
    computational objects, interfaces and interactions, the designers also need some
    guidelines and structuring rules for writing the computational specifications
    of their system. This section offers some guidelines on how to do it.


    # 4.6.1 Division into Components


    We normally start by specifying the high-level software architecture of the application.
    Such an architecture will provide the big picture of the system, describing the
    key computational objects in the system, and how they interact to achieve the
    application’s goal.


    By software architecture we mean the structure and organization of the system,
    defined in terms of software elements (components, connectors), the externally
    visible properties of those elements, and the relationships among them [49]. This
    structure also defines the principles and guidelines governing how the design
    is to be allowed to evolve over time [71]. It provides the basis for satisfying
    both functional and non-functional requirements on the system [81,82].'
