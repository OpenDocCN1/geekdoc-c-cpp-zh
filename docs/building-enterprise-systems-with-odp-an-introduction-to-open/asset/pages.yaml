    # A.3 Computational Viewpoint Specifications


    The overall structure of the computational viewpoint specification of the PhoneMob
    system is shown in figure A.11. It contains three high-level packages. One describes
    the software architecture of the application. The second deals with the behavioural
    aspects of the system. The last one contains the basic data types used in the
    specification (which were shown in figure 4.8). In addition, the model for the
    complete computational specification has some associated tag values that determine
    which transparencies are required for the system. In this case, the transaction
    and replication transparencies are needed (see the engineering specification in
    section A.4) together with the ac-


