- pgno: 134
  md: '# ## 6.2.1 Technology Objects


    The technology specification describes the implementation of the ODP system in
    terms of a configuration of *technology objects* (representing the hardware and
    software components of the implementation) and the interfaces between them. These
    objects are constrained by the cost and availability of satisfactory technology
    products.


    Technology objects are normally specified in terms of their types. Examples of
    such types include the kinds of PCs, servers, ATMs, printers and other hardware
    devices that can be used to implement the system and execute its functionality.
    Giving a clear definition of these types helps in answering questions such as
    whether we are going to count on there being colour printers available or not,
    or whether our system will run some particular services on a central server, on
    a PC or from an external cloud computing system. The technology specification
    also describes the types of operating systems and applications (such as browsers
    or text editors, for example) and the types of connections (LANs, WANs, intranets
    and so on) that will be used for deploying the engineering channels.


    For example, figure 6.1 shows the technology configuration of the PhoneMob system
    using the UML4ODP notation. It is described using a UML deployment diagram that
    specifies the deployment architecture of the system by showing the different technology
    object types that will be used and how they can be connected. In a deployment
    diagram, a computer node is expressed as a node and lines are introduced to express
    interfaces between the nodes. Different types of network are also depicted as
    nodes. The diagram shows that there will be three different kinds of computing
    resource (PCs, enterprise application servers and backend business servers), two
    different kinds of communication media (LAN and WAN) and as special peripherals
