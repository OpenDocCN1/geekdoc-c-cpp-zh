    The engineering objects play a part in fulfilling the objectives established in
    the enterprise viewpoint by supporting the interaction and management of computational
    objects, which are represented in this viewpoint as Basic Engineering Objects.
    In addition to this indirect coupling, the various engineering objects will also
    be subject to generic rules and policies established in the enterprise viewpoint,
