  md: 'used by system designers are particularly concerned with the infrastructure
    of systems.


    Since this area has been a target of standardization for quite some time, a number
    of standards or specifications already exist to provide such mechanisms for specific
    technologies, such as Web Services, .NET, JEE or CORBA. The main value of the
    engineering viewpoint is in providing a technological architectural framework
    or reference architecture that can be used as a basic tool for designing new systems
    or comparing existing infrastructure technologies for distributed processing.
    In this way, infrastructure designs can have a much longer life than the technologies
    that support them; this allows these technologies to evolve without invalidating
    the system designs, which are a company''s major asset.


    Another important feature is that the information necessary for conformance testing
    originates in this viewpoint. Although the actual conformance testing may be performed
    against software and hardware artifacts specified in the technology viewpoint,
    the basic test requirements are defined in the technology-independent engineering
    viewpoint. For instance, observation of a SOAP message passing from a client PC
    technology object to a departmental server technology object may be used to check
    conformance by comparing it to the interactions expected at an interface between
    the corresponding engineering objects that has been identified as a conformance
    point.


