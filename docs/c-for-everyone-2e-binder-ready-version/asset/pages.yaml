- pgno: 509
  md: "# # Source Files\n\nEach program is a collection of one or more files or modules.\
    \ The executable program is obtained by compiling and linking these files. Organize\
    \ the material in each file as follows:\n\n+   - Header comments\n+   - #include\
    \ statements\n+   - Constants\n+   - Classes\n+   - Functions\n\nIt is common\
    \ to start each file with a comment block. Here is a typical format:\n\n```\n\
    ```cpp\n/*\n  @file invoice.cpp\n  @author Jenny Koo\n  @date 2012-01-24\n  @version\
    \ 3.14\n*/\n```\n```\n\nYou may also want to include a copyright notice, such\
    \ as\n\n```\n```cpp\n/* Copyright 2012 Jenny Koo */\n```\n```\n\nA valid copyright\
    \ notice consists of\n\n+   - the copyright symbol © or the word “Copyright” or\
    \ the abbreviation “Copr.”\n+   - the year of first publication of the work\n\
    +   - the name of the owner of the copyright\n\n(Note: To save space, this header\
    \ comment has been omitted from the programs in this book as well as the programs\
    \ on disk so that the actual line numbers match those that are printed in the\
    \ book.)\n\nNext, list all included header files.\n\n```\n```cpp\n#include <iostream>\n\
    #include \"question.h\"\n```\n```\n\nDo not embed absolute path names, such as\n\
    \n```\n```cpp\n#include \"c:\\my_homework\\widgets.h\"   // Don't !!!\n```\n```\n\
    \nAfter the header files, list constants that are needed throughout the program\
    \ file.\n\n```\n```cpp\nconst int GRID_SIZE = 20;\nconst double CLOCK_RADIUS =\
    \ 5;\n```\n```\n\nThen supply the definitions of all classes.\n\n```\n```cpp\n\
    class Product\n{\n  ...\n};\n```\n```\n\nOrder the class definitions so that a\
    \ class is defined before it is used in another class.\n\nFinally, list all functions,\
    \ including member functions of classes and nonmember functions. Order the nonmember\
    \ functions so that a function is defined before it is called. As a consequence,\
    \ the main function will be the last function in your file."
  merge: -1
  img_proc: true
- pgno: 510
  md: "# Functions\n\nSupply a comment of the following form for every function.\n\
    \n```\n```text\n/**\n * Explanation.\n * @param parameter variable1  explanation\n\
    \ * @param parameter variable2  explanation\n * ...\n * @return explanation\n\
    \ */\n```\n```\n\nThe introductory explanation is required for all functions except\
    \ main. It should start with an uppercase letter and end with a period. Some documentation\
    \ tools extract the first sentence of the explanation into a summary table. Thus,\
    \ if you provide an explanation that consists of multiple sentences, formulate\
    \ the explanation such that the first sentence is a concise explanation of the\
    \ function’s purpose.\n\nOmit the @param comment if the function has no parameter\
    \ variables. Omit the @return comment for void functions. Here is a typical example:\n\
    \n```\n```cpp\n/**\n * Converts calendar date into Julian day. This algorithm\
    \ is from Press\n * et al., Numerical Recipes in C, 2nd ed., Cambridge University\
    \ Press, 1992.\n * @param year the year of the date to be converted\n * @param\
    \ month the month of the date to be converted\n * @param day the day of the date\
    \ to be converted\n * @return the Julian day number that begins at noon on the\
    \ given\n * calendar date\n */\nlong dat2jul(int year, int month, int day)\n{\n\
    \    ...\n}\n```\n```\n\nParameter variable names must be explicit, especially\
    \ if they are integers or Boolean.\n\n```\n```cpp\nEmployee remove(int d, double\
    \ s); // Huh?\nEmployee remove(int department, double severance_pay); // OK\n\
    ```\n```\n\nOf course, for very generic functions, short names may be very appropriate.\n\
    \nDo not write void functions that return exactly one answer through a reference.\
    \ Instead, make the result into a return value.\n\n```\n```cpp\nvoid find(vector<Employee>\
    \ c, bool& found); // Don’t!\nbool find(vector<Employee> c); // OK\n```\n```\n\
    \nOf course, if the function computes more than one value, some or all results\
    \ can be returned through reference parameters.\n\nFunctions must have at most\
    \ 30 lines of code. (Comments, blank lines, and lines containing only braces are\
    \ not included in this count.) Functions that consist of one long if/else/else\
    \ statement sequence may be longer, provided each branch is 10 lines or less.\
    \ This rule forces you to break up complex computations into separate functions."
  merge: -1
  img_proc: true
- pgno: 511
  md: "# # Local Variables\n\nDo not define all local variables at the beginning of\
    \ a block. Define each variable just before it is used for the first time.\n\n\
    Every variable must be either explicitly initialized when defined or set in the\
    \ immediately following statement (for example, through a >> instruction).\n\n\
    ```\n```cpp\nint pennies = 0;\n```\n```\n\nor\n\n```\n```cpp\nint pennies;\ncin\
    \ >> pennies;\n```\n```\n\nMove variables to the innermost block in which they\
    \ are needed:\n\n```\n```cpp\nwhile (...)\n{\n    double xnew = (xold + a / xold)\
    \ / 2;\n    ...\n}\n```\n```\n\nDo not define two variables in one statement:\n\
    \n```\n```cpp\nint dimes = 0, nickels = 0; // Don't\n```\n```\n\nWhen defining\
    \ a pointer variable, place the * with the type, not the variable:\n\n```\n```cpp\n\
    Link* p; // OK\n```\n```\n\nnot\n\n```\n```cpp\nLink *p; // Don't\n```\n```\n\n\
    # # Constants\n\nIn C++, do not use #define to define constants:\n\n```\n```cpp\n\
    #define CLOCK_RADIUS 5 // Don't\n```\n```\n\nUse const instead:\n\n```\n```cpp\n\
    const double CLOCK_RADIUS = 5;  // The radius of the clock face\n```\n```\n\n\
    You may not use magic numbers in your code. (A magic number is an integer constant\
    \ embedded in code without a constant definition.) Any number except 0, 1, or\
    \ 2 is considered magic:\n\n```\n```cpp\nif (p.get_x() < 10) // Don't\n```\n```\n\
    \nUse a const variable instead:\n\n```\n```cpp\nconst double WINDOW_XMAX = 10;\n\
    if (p.get_x() < WINDOW_XMAX) // OK\n```\n```\n\nEven the most reasonable cosmic\
    \ constant is going to change one day. You think there are 365 days per year?\
    \ Your customers on Mars are going to be pretty unhappy about your silly prejudice."
  merge: -1
