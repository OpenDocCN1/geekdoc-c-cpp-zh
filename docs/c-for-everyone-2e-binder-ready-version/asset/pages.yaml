    # ## HOW TO 7.1: Working with Pointers


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_361_0.png)


    You use pointers because you want flexibility in your program: the ability to
    change the relationships between data. This How To walks you through the decision-making
    process for using pointers.


    We will illustrate the steps with the task of simulating a part of the control
    logic for a departmental photocopier. A person making a copy enters a user number.
    There are 100 different users, with numbers 0 to 99. Each user is linked to a
    copy account, either the master account or one of ten project accounts. That linkage
    is maintained by the administrator, and it can change as users work on different
    projects. When copies are made, the appropriate account should be incremented.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_361_1.png)


    *Users identify themselves on the copier control panel. Using pointers, the relationships
    between users and copy accounts can be flexible.*


    # ### Step 1 Draw a picture.


    As described in Section 7.6, it is a good idea to draw a picture that shows the
    pointers in your program.


    In our example, we need to track the copy accounts: a master account and ten project
    accounts. For each user, we need a pointer to the copy account:


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_361_2.png)


    # ### Step 2 Declare pointer variables.


    This step is usually easy. With numerical data, you will have pointers of type
    int* or double*. If you manipulate character arrays, you use char* pointers. In
    Chapter 10, you will use pointers to objects.


    How many pointer variables do you have? If you only have one or two, just declare
    variables such as


    ```

    `double* account_pointer;`

    ```


    If you have a sequence of pointers, use a vector or array, such as


    ```

    `vector<char*> lines;`

    ```'
