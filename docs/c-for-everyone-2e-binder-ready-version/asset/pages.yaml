    \n# ## 4.3 The for Loop\n\nThe for loop is used when a value runs from a starting\
    \ point to an ending point with a constant increment or decrement.\n\nIt often\
    \ happens that you want to execute a sequence of statements a given number of\
    \ times. You can use a *while* loop that is controlled by a counter, as in the\
    \ following example:\n\n```\n~~~cpp\ncounter = 1; // Initialize the counter\n\
    while (counter <= 10) // Check the counter\n{\n    cout << counter << endl;\n\
    \    counter++; // Update the counter\n}\n~~~\n```\n\nBecause this loop type is\
    \ so common, there is a special form for it, called the for loop (see Syntax 4.2)."
