  md: "# ### 6.2.6 Linear Search\n\nA linear search inspects elements in sequence\
    \ until a match is found.\n\nYou often need to search for the position of an element\
    \ so that you can replace or remove it. Visit all elements until you have found\
    \ a match or you have come to the end of the array. Here we search for the position\
    \ of the first element equal to 100.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_285_0.png)\n\
    \n*To search for a specific element, visit the elements and stop when you encounter\
    \ the match.*\n\n```\n~~~cpp\nint pos = 0;\nbool found = false;\nwhile (pos <\
    \ size of values && !found)\n{\n   if (values[pos] == 100)\n   {\n      found\
    \ = true;\n   }\n   else\n   {\n      pos++;\n   }\n}\n~~~\n```\n\nIf found is\
    \ true, then pos is the position of the first match.\n\n# ### 6.2.7 Removing an\
    \ Element\n\nConsider a partially filled array values whose current size is stored\
    \ in the variable current_size. Suppose you want to remove the element with index\
    \ pos from values. If the elements are not in any particular order, that task\
    \ is easy to accomplish. Simply overwrite the element to be removed with the last\
    \ element, then decrement the variable tracking the size. (See Figure 6.)\n\n\
    ```\n~~~cpp\nvalues[pos] = values[current_size - 1];\ncurrent_size--;\n~~~\n```\n\
    \nThe situation is more complex if the order of the elements matters. Then you\
    \ must move all elements following the element to be removed to a lower index,\
    \ then decrement the variable holding the size of the array. (See Figure 7.)\n\
    \n```\n~~~cpp\nfor (int i = pos + 1; i < current_size; i++)\n{\n   values[i -\
    \ 1] = values[i];\n}\ncurrent_size--;\n~~~\n```\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_285_1.png)\n\
    \n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_285_2.png)\n\n**Figure 6**\nRemoving\
    \ an Element in an Unordered Array\n\n**Figure 7**\nRemoving an Element in an\
    \ Ordered Array"
  merge: -1
  img_proc: true
