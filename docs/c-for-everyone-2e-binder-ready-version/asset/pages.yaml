    # Common Error 2.3


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_70_2.png)


    # Unintended Integer Division


    It is unfortunate that C++ uses the same symbol, namely /, for both integer and
    floating-point division. These are really quite different operations. It is a
    common error to use integer division by accident. Consider this segment that computes
    the average of three integers:


    ```

    ~~~cpp

    cout << "Please enter your last three test scores: ";

    int s1;

    int s2;

    ~~~

    ```'
