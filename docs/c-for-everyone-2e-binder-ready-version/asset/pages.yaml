  md: "```\n}\ncout << endl;\n}\n```\n\n> A recursive computation solves a problem\
    \ by using the solution of the same problem with simpler inputs.\n\nLook at the\
    \ `print_triangle` function one more time and notice how utterly reasonable it\
    \ is. If the side length is 0, nothing needs to be printed. The next part is just\
    \ as reasonable. Print the smaller triangle and *don't think about why that works*.\
    \ Then print a row of []. Clearly, the result is a triangle of the desired size.\n\
    \nThere are two key requirements to make sure that the recursion is successful:\n\
    \n+   - Every recursive call must simplify the task in some way.\n+   - There\
    \ must be special cases to handle the simplest tasks directly.\n\n> For a recursion\
    \ to terminate, there must be special cases for the simplest inputs.\n\nThe `print_triangle`\
    \ function calls itself again with smaller and smaller side lengths. Eventually\
    \ the side length must reach 0, and the function stops calling itself.\n\nHere\
    \ is what happens when we print a triangle with side length 4.\n\n+   - The call\
    \ `printTriangle(4)` calls `printTriangle(3)`.\n+     - The call `printTriangle(3)`\
    \ calls `printTriangle(2)`.\n+       - The call `printTriangle(2)` calls `printTriangle(1)`.\n\
    +         - The call `printTriangle(1)` calls `printTriangle(0)`.\n+         \
    \  - The call `printTriangle(0)` returns, doing nothing.\n+         - The call\
    \ `printTriangle(1)` prints `[]`.\n+       - The call `printTriangle(2)` prints\
    \ `[][]`.\n+     - The call `printTriangle(3)` prints `[][][]`.\n+   - The call\
    \ `printTriangle(4)` prints `[][][][]`.\n\nThe call pattern of a recursive function\
    \ looks complicated, and the key to the successful design of a recursive function\
    \ is *not to think about it*.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_254_0.png)\n\
    \n*This set of Russian dolls looks similar to the call pattern of a recursive\
