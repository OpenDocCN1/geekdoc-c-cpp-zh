- pgno: 490
  md: "```\n```cpp\nq.display();\ncout << \"Your answer: \";\ngetline(cin, response);\n\
    cout << q.check_answer(response) << endl;\n}\n```\n```\n\nIf you call this function\
    \ with a ChoiceQuestion object, then the parameter variable q is initialized with\
    \ a copy of that object. But q is a Question object; the derived-class information\
    \ is sliced away. The simplest remedy is to use a reference:\n\n```\n```cpp\n\
    void ask(const Question& q)\n```\n```\n\nNow only the address is passed to the\
    \ function. A reference is really a pointer in disguise. No slicing occurs, and\
    \ virtual functions work correctly.\n\nSpecial Topic 10.2\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_490_0.png)\n\
    \n# Virtual Self-Calls\n\nSuppose we add the following function to the Question\
    \ class:\n\n```\n```cpp\nvoid Question::ask() const\n{\n   display();\n   cout\
    \ << \"Your answer: \";\n   getline(cin, response);\n   cout << check_answer(response)\
    \ << endl;\n}\n```\n```\n\nNow consider the call\n\n```\n```cpp\nChoiceQuestion\
    \ cq;\ncq.set_text(\"In which country was the inventor of C++ born?\");\n...\n\
    cq.ask();\n```\n```\n\nWhich display and check_answer function will the ask function\
    \ call? If you look inside the code of the Question::ask function, you can see\
    \ that these functions are executed on the implicit parameter:\n\n```\n```cpp\n\
    void Question::ask() const\n{\n   implicit_parameter.display();\n   cout << \"\
    Your answer: \";\n   getline(cin, response);\n   cout << implicit_parameter.check_answer(response)\
    \ << endl;\n}\n```\n```\n\nThe implicit parameter in our call is cq, an object\
    \ of type ChoiceQuestion. Because the display and check_answer functions are virtual,\
    \ the ChoiceQuestion versions of the functions are called automatically. This\
    \ happens even though the ask function is defined in the Question class, which\
    \ has no knowledge of the ChoiceQuestion class.\n\nAs you can see, virtual functions\
    \ are a very powerful mechanism. The Question class supplies an ask function that\
    \ specifies the common nature of asking a question, namely to display it and check\
    \ the response. How the displaying and checking are carried out is left to the\
    \ derived classes."
