    A very common task is to implement a class whose objects can carry out a set of
    specified actions. This How To walks you through the necessary steps.

    As an example, consider a class `Menu`. An object of this class can display a
    menu such as


    +   1) Open new account

    +   2) Log into existing account

    +   3) Help

    +   4) Quit


    Then the menu waits for the user to supply a value. If the user does not supply
    a valid value, the menu is redisplayed, and the user can try again.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_436_2.png)


    # Step 1


    Get an informal list of the responsibilities of your objects.


    Be careful that you restrict yourself to features that are actually required in
    the problem. With real-world items, such as cash registers or bank accounts, there
    are potentially dozens of features that might be worth implementing. However,
    your job is not to faithfully model the real world. You need to determine only
    those responsibilities that you need for solving your specific problem.


    In the case of the menu, you need to


    **Display the menu.**

    **Get user input.**


    Now look for hidden responsibilities that aren''t part of the problem description.
    How do objects get created? Which mundane activities need to happen, such as clearing
    the cash register at the beginning of each sale?


    In the menu example, consider how a menu is produced. The programmer creates an
    empty menu object and then adds options “Open new account”, “Help”, and so on.
    There is a hidden responsibility:


    **Add an option.**


