- pgno: 245
  md: "# ### WORKED EXAMPLE 5.3 — Calculating a Course Grade\n\nThis Worked Example\
    \ uses stepwise refinement to solve the problem of converting a set of letter\
    \ grades into an average grade for a course.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_245_0.png)\n\
    \n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_245_1.png)\n\n# ## 5.8 Variable Scope\
    \ and Global Variables\n\n> > The scope of a variable is the part of the program\
    \ in which it is visible.\n\nIt is possible to define the same variable name more\
    \ than once in a program. When the variable name is used, you need to know to\
    \ which definition it belongs. In this section, we discuss the rules for dealing\
    \ with multiple definitions of the same name.\n\nA variable that is defined within\
    \ a function is visible from the point at which it is defined until the end of\
    \ the block in which it was defined. This area is called the scope of the variable.\n\
    \nConsider the volume variables in the following example:\n\n```\n~~~cpp\ndouble\
    \ cube_volume(double side_length)\n{\n    double volume = side_length * side_length\
    \ * side_length;\n    return volume;\n}\n\nint main()\n{\n    double volume =\
    \ cube_volume(2);\n    cout << volume << endl;\n\n    return 0;\n}\n~~~\n```\n\
    \nEach volume variable is defined in a separate function, and their scopes do\
    \ not overlap.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_245_2.png)\n\nIn the\
    \ same way that there can be a street named “Main Street” in different cities,\
    \ a C++ program can have multiple variables with the same name."
  merge: -1
  img_proc: true
- pgno: 246
  md: "It is not legal to define two variables with the same name in the same scope.\
    \ For example, the following is not legal:\n\n```\n```cpp\nint main()\n{\n   double\
    \ volume = cube_volume(2);\n   double volume = cube_volume(10);\n      // ERROR:\
    \ cannot define another volume variable in this scope\n   ...\n}\n```\n```\n\n\
    However, you can define another variable with the same name in a nested block.\
    \ Here, we define two variables called amount.\n\n```\n```cpp\ndouble withdraw(double\
    \ balance, double amount)\n{\n   if (...)\n   {\n      double amount = 10; //\
    \ Another variable named amount\n      ...\n   }\n   ...\n}\n```\n```\n\nThe scope\
    \ of the parameter variable amount is the entire function, except inside the nested\
    \ block. Inside the nested block, amount refers to the variable that was defined\
    \ in that block. We say that the inner variable shadows the variable that is defined\
    \ in the outer block. You should avoid this potentially confusing situation in\
    \ the functions that you write, simply by renaming one of the variables.\n\nA\
    \ variable in a nested block shadows a variable with the same name in an outer\
    \ block.\n\nVariables that are defined inside functions are called local variables.\
    \ C++ also supports global variables: variables that are defined outside functions.\
    \ A global variable is visible to all functions that are defined after it. For\
    \ example, the <ostream> header defines global variables cin and cout.\n\nA local\
    \ variable is defined inside a function. A global variable is defined outside\
    \ a function.\n\n```\n```cpp\nint balance = 10000; // A global variable\n\nvoid\
    \ withdraw(double amount)\n{\n   if (balance >= amount)\n   {\n      balance =\
    \ balance - amount;\n   }\n}\n\nint main()\n{\n   withdraw(1000);\n   cout <<\
    \ balance << endl;\n   return 0;\n}\n```\n```\n\nThe scope of the variable balance\
    \ extends over both the withdraw and the main functions.\n\nGenerally, global\
    \ variables are not a good idea. When multiple functions update global variables,\
    \ the result can be difficult to predict. Particularly in larger programs that\
    \ are developed by multiple programmers, it is very important that the effect\
    \ of each function be clear and easy to understand. You should avoid global variables\
    \ in your programs.\n\nAvoid global variables in your programs."
