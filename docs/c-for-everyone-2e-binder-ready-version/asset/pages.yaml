  md: '# # CHAPTER SUMMARY


    # ## Explain the flow of execution in a loop.


    +   - Loops execute a block of code repeatedly while a condition remains true.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_200_0.png)


    +   - An off-by-one error is a common error when programming loops. Think through
    simple test cases to avoid this type of error.


    # ## Use the technique of hand-tracing to analyze the behavior of a program.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_200_1.png)


    +   - Hand-tracing is a simulation of code execution in which you step through
    instructions and track the values of the variables.


    +   - Hand-tracing can help you understand how an unfamiliar algorithm works.


    +   - Hand-tracing can show errors in code or pseudocode.


    # ## Use for loops for implementing counting loops.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_200_2.png)


    +   - The for loop is used when a value runs from a starting point to an ending
    point with a constant increment or decrement.


    # ## Choose between the while loop and the do loop.


    +   - The do loop is appropriate when the loop body must be executed at least
    once.


    # ## Implement loops that read sequences of input data.


    +   - A sentinel value denotes the end of a data set, but it is not part of the
    data.


    +   - You can use a Boolean variable to control a loop. Set the variable to true
    before entering the loop, then set it to false to leave the loop.


    +   - Use input redirection to read input from a file. Use output redirection
    to capture program output in a file.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_200_3.png)


    # ## Use the technique of storyboarding for planning user interactions.


    +   - A storyboard consists of annotated sketches for each step in an action sequence.


    +   - Developing a storyboard helps you understand the inputs and outputs that
    are required for a program.'
