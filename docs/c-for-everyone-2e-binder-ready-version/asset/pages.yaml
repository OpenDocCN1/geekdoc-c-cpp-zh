    # *Random Fact 4.2*  Software Piracy


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_199_0.png)


    As you read this, you have written a few computer programs, and you have experienced
    firsthand how much effort it takes to write even the humblest of programs. Writing
    a real software product, such as a financial application or a computer game, takes
    a lot of time and money. Few people, and fewer companies, are going to spend that
    kind of time and money if they don''t have a reasonable chance to make more money
    from their effort. (Actually, some companies give away their software in the hope
    that users will upgrade to more elaborate paid versions or pay for consulting.)
    Other companies give away the software that enables users to read and use files
    but sell the software needed to create those files. Finally, there are individuals
    who donate their time, out of enthusiasm, and produce programs that you can copy
    freely. See Random Fact 9.2 for more information.


    When selling software, a company must rely on the honesty of its customers. It
    is an easy matter for an unscrupulous person to make copies of computer programs
    without paying for them. In most countries that is illegal. Most governments provide
    legal protection, such as copyright laws and patents, to encourage the development
    of new products. Countries that tolerate widespread piracy have found that they
    have an ample cheap supply of foreign software, but no local manufacturers willing
    to design good software for their own citizens, such as word processors in the
    local script or financial programs adapted to the local tax laws.


    When a mass market for software first appeared, vendors were enraged by the money
    they lost through piracy. They tried to fight back, by various schemes to ensure
    that only the legitimate owner could use the software, such as dongles—devices
    that must be attached to a printer port before the software will run. Legitimate
    users hated these measures. They paid for the software, but they had to suffer
    through inconveniences, such as having multiple dongles stick out from their computer.
    In the United States, market pressures forced most vendors to give up on these
    copy protection schemes, but they are still commonplace in other parts of the
    world.


    Because it is so easy and inexpensive to pirate software, and the chance of being
    found out is minimal, you have to make a moral choice for yourself: If a package
    that you would really like to have is too expensive for your budget, do you steal
    it, or do you stay honest and get by with a more affordable product?


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_199_1.png)


    Of course, piracy is not limited to software. The same issues arise for other
    digital products as well. You may have had the opportunity to obtain copies of
    songs or movies without payment. Or you may have been frustrated by a copy protection
    device on your music player that made it difficult for you to listen to songs
    that you paid for. Admittedly, it can be difficult to have a lot of sympathy for
    a musical ensemble whose publisher charges a lot of money for what seems to have
    been very little effort on their part, at least when compared to the effort that
    goes into designing and implementing a software package. Nevertheless, it seems
    only fair that artists and authors receive some compensation for their efforts.
    How to pay artists, authors, and programmers fairly, without burdening honest
    customers, is an unsolved problem at the time of this writing, and many computer
    scientists are engaged in research in this area.'
