  md: "Finally, n becomes 172. (Recall that the remainder in the division 1729 / 10\
    \ is dis-carded because both arguments are integers.)\n\nCross out the old values\
    \ and write the new ones under the old ones.\n\n```\n    int n = 1729;\n    int\
    \ sum = 0;\n    while (n > 0)\n    {\n        int digit = n % 10;\n        sum\
    \ = sum + digit;\n        n = n / 10;\n    }\n    cout << sum << endl;\n```\n\n\
    | n | sum | digit |\n|---|---|---|\n| 1729 | 0 |  |\n| 172 | 9 | 9 |\n\nNow check\
    \ the loop condition again.\n\n```\n    int n = 1729;\n    int sum = 0;\n    while\
    \ (n > 0)\n    {\n        int digit = n % 10;\n        sum = sum + digit;\n  \
    \      n = n / 10;\n    }\n    cout << sum << endl;\n```\n\nBecause n is still\
    \ greater than zero, repeat the loop. Now digit becomes 2, sum is set to 9 + 2\
    \ = 11, and n is set to 17.\n\n| n | sum | digit |\n|---|---|---|\n| 1729 | 0\
    \ |  |\n| 172 | 9 | 9 |\n| 17 | 11 | 2 |\n\nRepeat the loop once again, setting\
    \ digit to 7, sum to 11 + 7 = 18, and n to 1.\n\n| n | sum | digit |\n|---|---|---|\n\
    | 1729 | 0 |  |\n| 172 | 9 | 9 |\n| 17 | 11 | 2 |\n| 1 | 18 | 7 |\n\nEnter the\
    \ loop for one last time. Now digit is set to 1, sum to 19, and n becomes zero.\n\
    \n| n | sum | digit |\n|---|---|---|\n| 1729 | 0 |  |\n| 172 | 9 | 9 |\n| 17 |\
    \ 11 | 2 |\n| 1 | 18 | 7 |\n\n| n | sum | digit |\n|---|---|---|\n| 1729 | 0 |\
    \  |\n| 172 | 9 | 9 |\n| 17 | 11 | 2 |\n| 1 | 18 | 7 |\n| 0 | 19 | 1 |"
