    # **Engineering P4.31**


    Radioactive decay of radioactive materials can be modeled by the equation $A =
    A_0 e^{-(\log 2)t/h}$, where A is the amount of the material at time t, A_0 is
    the amount at time 0, and h is the half-life.


    Technetium-99 is a radioisotope that is used in imaging of the brain. It has a
    half-life of 6 hours. Your program should display the relative amount A/A_0 in
    a patient body every hour for 24 hours after receiving a dose.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_213_1.png)


    # **Engineering P4.32**


    The photo at left shows an electric device called a “transformer”. Transformers
    are often constructed by wrapping coils of wire around a ferrite core. The figure
    below illustrates a situation that occurs in various audio devices such as cell
    phones and music players. In this circuit, a transformer is used to connect a
    speaker to the output of an audio amplifier.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_213_2.png)


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_213_3.png)


    The symbol used to represent the transformer is intended to suggest two coils
    of wire. The parameter n of the transformer is called the “turns ratio” of the
    transformer. (The number of times that a wire is wrapped around the core to form
    a coil is called the number of turns in the coil. The turns ratio is literally
    the ratio of the number of turns in the two coils of wire.)


    When designing the circuit, we are concerned primarily with the value of the power
    delivered to the speakers—that power causes the speakers to produce the sounds
    we want to hear. Suppose we were to connect the speakers directly to the amplifier
    without using the transformer. Some fraction of the power available from the amplifier
    would get to the speakers. The rest of the available power would be lost in the
    amplifier itself. The transformer is added to the circuit to increase the fraction
    of the amplifier power that is delivered to the speakers.


    The power, $P_s$, delivered to the speakers is calculated using the formula


    $$P_s = R_s \left( \frac{nV_s}{n^2R_0 + R_s} \right)^2$$'
