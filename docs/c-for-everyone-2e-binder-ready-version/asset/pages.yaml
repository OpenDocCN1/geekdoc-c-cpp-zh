- pgno: 198
  md: "If the generated point lies inside the circle, we count it as a hit. That is\
    \ the case when x^2 + y^2 ≤ 1. Because our shots are entirely random, we expect\
    \ that the ratio of hits / tries is approximately equal to the ratio of the areas\
    \ of the circle and the square, that is, π / 4. Therefore, our estimate for π\
    \ is 4 × hits / tries. This method yields an estimate for π, using nothing but\
    \ simple arithmetic.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_198_0.png)\n\n\
    To run the Monte Carlo simulation, you have to work a little harder with random\
    \ number generation. When you throw a die, it has to come up with one of six faces.\
    \ When throwing a dart, however, there are many possible outcomes. You must generate\
    \ a random floating-point number.\n\nFirst, generate the following value:\n\n\
    ```\n```cpp\ndouble r = rand() * 1.0 / RAND_MAX; // Between 0 and 1\n```\n```\n\
    \nThe value r is a random floating-point value between 0 and 1. (You have to multiply\
    \ by 1.0 to ensure that one of the operands of the / operator is a floating-point\
    \ number. The division rand() / RAND_MAX would be an integer division—see Common\
    \ Error 2.3.)\n\nTo generate a random value between −1 and 1, you compute:\n\n\
    ```\n```cpp\ndouble x = -1 + 2 * r; // Between -1 and 1\n```\n```\n\nAs r ranges\
    \ from 0 to 1, x ranges from −1 + 2 × 0 = −1 to −1 + 2 × 1 = 1.\n\nHere is the\
    \ program that carries out the simulation.\n\n**ch04/montecarlo.cpp**\n\n```\n\
    ```cpp\n#include <iostream>\n#include <cstdlib>\n#include <cmath>\n#include <ctime>\n\
    \nusing namespace std;\n\nint main()\n{\n   const int TRIES = 10000;\n\n   srand(time(0));\n\
    \n   int hits = 0;\n   for (int i = 1; i <= TRIES; i++)\n   {\n      double r\
    \ = rand() * 1.0 / RAND_MAX; // Between 0 and 1\n      double x = -1 + 2 * r;\
    \ // Between -1 and 1\n      r = rand() * 1.0 / RAND_MAX;\n      double y = -1\
    \ + 2 * r;\n      if (x * x + y * y <= 1) { hits++; }\n   }\n   double pi_estimate\
    \ = 4.0 * hits / TRIES;\n   cout << \"Estimate for pi: \" << pi_estimate << endl;\n\
    \   return 0;\n}\n```\n```\n\n# ### Program Run\n\n```\n```\nEstimate for pi:\
    \ 3.1504\n```\n```"
