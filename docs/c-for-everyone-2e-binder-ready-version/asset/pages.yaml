  md: "# ## 7.7.2 Pointers to Structures\n\nIt is common to allocate structure values\
    \ dynamically, using the `new` operator:\n\n```\n    StreetAddress* address_pointer\
    \ = new StreetAddress;\n```\n\nSuppose you want to set the house number of the\
    \ structure to which `address_pointer` points:\n\n```\n    *address_pointer.house_number\
    \ = 1600; // Error\n```\n\nUnfortunately, that is a syntax error. The dot operator\
    \ has a higher precedence than the `*` operator. That is, the compiler thinks\
    \ that you mean\n\n```\n    *(address_pointer.house_number) = 1600; // Error\n\
    ```\n\nHowever, `address_pointer` is a pointer, not a structure. You can't apply\
    \ the dot (`.`) operator to a pointer, and the compiler reports an error. Instead,\
    \ you must make it clear that you first want to apply the `*` operator, then the\
    \ dot:\n\n```\n    (*address_pointer).house_number = 1600; // OK\n```\n\nBecause\
    \ this is such a common situation, the designers of C++ supply an operator to\
    \ abbreviate the “follow pointer and access member” operation. That operator is\
    \ written `->` and usually pronounced “arrow”.\n\n> > Use the `->` operator to\
    \ access a structure member through a pointer.\n\n```\n    address_pointer->house_number\
    \ = 1600; // OK\n```\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_364_0.png)\n\n\
    **Figure 11** A Pointer to a Structure\n\n# ## 7.7.3 Structures with Pointer Members\n\
    \nA member of a structure can be a pointer. This situation commonly arises when\
    \ information is shared among structure values. Consider this example. In an organization\
    \ with multiple offices, each employee has a name and an office location:\n\n\
    ```\n    struct Employee\n    {\n        string name;\n        StreetAddress*\
    \ office;\n    }\n```\n\nHere, we define two employees who both work for the accounting\
    \ office:\n\n```\n    StreetAddress accounting;\n    accounting.house_number =\
    \ \"1729\";\n    accounting.street_name = \"Park Avenue\";\n\n    Employee harry;\n\
    \    harry.name = \"Smith, Harry\";\n    harry.office = &accounting;\n```"
