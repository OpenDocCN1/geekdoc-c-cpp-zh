- pgno: 229
  md: "# 5.4 Return Values\n\n> > The return statement terminates a function call\
    \ and yields the function result.\n\nYou use the return statement to specify the\
    \ result of a function. When the return statement is processed, the function exits\
    \ immediately. This behavior is convenient for handling exceptional cases at the\
    \ beginning:\n\n```\n```\ndouble cube_volume(double side_length)\n{\n    if (side_length\
    \ < 0) { return 0; }\n    double volume = side_length * side_length * side_length;\n\
    \    return volume;\n}\n```\n```\n\nIf the function is called with a negative\
    \ value for side_length, then the function returns 0 and the remainder of the\
    \ function is not executed. (See Figure 4.)\n\nIn the preceding example, each\
    \ return statement returned a constant or a variable. Actually, the return statement\
    \ can return the value of any expression. Instead of saving the return value in\
    \ a variable and returning the variable, it is often possible to eliminate the\
    \ variable and return a more complex expression:\n\n```\n```\ndouble cube_volume(double\
    \ side_length)\n{\n    return side_length * side_length * side_length;\n}\n```\n\
    ```\n\nIt is important that every branch of a function return a value. Consider\
    \ the following incorrect function:\n\n```\n```\ndouble cube_volume(double side_length)\n\
    {\n    if (side_length >= 0)\n    {\n        return side_length * side_length\
    \ * side_length;\n    } // Error\n}\n```\n```\n\nSuppose you call cube_volume\
    \ with a negative value for the side length. Of course, you aren’t supposed to\
    \ call that, but it might happen as the result of a coding error. Because the\
    \ if condition is not true, the return statement is not executed. However, the\
    \ function must return something. Depending on the circumstances, the compiler\
    \ might\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_229_0.png)\n\n**Figure 4**\
    \ A return Statement Exits a Function Immediately"
  merge: -1
  img_proc: true
- pgno: 230
  md: "flag this as an error, or the function might return a random value. Protect\
    \ against this problem by returning some safe value:\n\n```\n```c\ndouble cube_volume(double\
    \ side_length)\n{\n    if (side_length > 0)\n    {\n        return side_length\
    \ * side_length * side_length;\n    }\n    return 0;\n}\n```\n```\n\nThe last\
    \ statement of every function ought to be a return statement. This ensures that\
    \ *some* value gets returned when the function reaches the end.\n\n# **Common\
    \ Error 5.1**\n\n# **Missing Return Value**\n\nA function always needs to return\
    \ something. If the code of the function contains several branches, make sure\
    \ that each one of them returns a value:\n\n```\n```c\nint sign(double x)\n{\n\
    \    if (x < 0) { return -1; }\n    if (x > 0) { return 1; }\n    // Error: missing\
    \ return value if x equals 0\n}\n```\n```\n\nThis function computes the sign of\
    \ a number: –1 for negative numbers and +1 for positive numbers. If the argument\
    \ is zero, however, no value is returned. Most compilers will issue a warning\
    \ in this situation, but if you ignore the warning and the function is ever called\
    \ with an argument of 0, a random quantity will be returned.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_230_0.png)\n\
    \n# **Special Topic 5.1**\n\n# **Function Declarations**\n\nIt is a compile-time\
    \ error to call a function that the compiler does not know, just as it is an error\
    \ to use an undefined variable. You can avoid this error if you define all functions\
    \ before they are first used. First define lower-level helper functions, then\
    \ the mid-level workhorse functions, and finally `main` in your program.\n\nSome\
    \ programmers prefer to list the `main` function first in their programs. If you\
    \ share that preference, you need to learn how to **declare** the other functions\
    \ at the top of the program. A declaration of a function lists the return type,\
    \ function name, and parameter variables, but it contains no body:\n\n```\n```c\n\
    double cube_volume(double side_length);\n```\n```\n\nThis is an advertisement\
    \ that promises that the function is implemented elsewhere. It is easy to distinguish\
    \ declarations from definitions: Declarations end in a semicolon, whereas definitions\
    \ are followed by a `{ ... }` block. Declarations are also called **prototypes**.\n\
    \nIn a function prototype, the names of the parameters are optional. You could\
    \ also write\n\n```\n```c\ndouble cube_volume(double);\n```\n```\n\nHowever, it\
    \ is a good idea to include parameter names in order to document the purpose of\
    \ each parameter.\n\nThe declarations of common functions such as `pow` are contained\
    \ in header files. If you have a look inside `<cmath>`, you will find the declaration\
    \ of `pow` and the other math functions.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_230_1.png)"
