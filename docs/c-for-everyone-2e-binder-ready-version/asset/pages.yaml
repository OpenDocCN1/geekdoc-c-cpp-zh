  md: '**Table 8 String Operations**


    | Statement | Result | Comment |

    |---|---|---|

    | `string str = "C";`<br>`str = str + "+";` | `str is set to "C++"` | When applied
    to strings, + denotes concatenation. |

    | 🚫 `string str = "C" + "+";` | **Error** | **Error:** You cannot concatenate
    two string literals. |

    | `cout << "Enter name: ";`<br>`cin >> name;`<br>(User input: Harry Morgan) |
    `name` contains `"Harry"` | The `>>` operator places the next word into the string
    variable. |

    | `cout << "Enter name: ";`<br>`cin >> name >> last_name;`<br>(User input: Harry
    Morgan) | `name` contains `"Harry"`, `last_name` contains `"Morgan"` | Use multiple
    `>>` operators to read more than one word. |

    | `string greeting = "H & S";`<br>`int n = greeting.length();` | `n` is set to
    5 | Each space counts as one character. |

    | `string str = "Sally";`<br>`string str2 = str.substr(1, 3);` | `str2` is set
    to `"all"` | Extracts the substring of length 3 starting at position 1. (The initial
    position is 0.) |

    | `string str = "Sally";`<br>`string str2 = str.substr(1);` | `str2` is set to
    `"ally"` | If you omit the length, all characters from the position until the
    end are included. |

    | `string a = str.substr(0, 1);` | `a` is set to the initial letter in `str` |
    Extracts the substring of length 1 starting at position 0. |

    | `string b = str.substr(str.length() - 1);` | `b` is set to the last letter in
    `str` | The last letter has position `str.length() - 1`. We need not specify the
    length. |


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_87_0.png)


