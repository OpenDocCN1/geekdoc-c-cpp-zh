    \n# Common Error 3.4\n\n# The Dangling else Problem\n\nWhen an if statement is\
    \ nested inside another if statement, the following error may occur.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_125_0.png)\n\
    \n```\n```\ndouble shipping_charge = 5.00; // $5 inside continental U.S.\nif (country\
    \ == \"USA\")\n    if (state == \"HI\")\n        shipping_charge = 10.00; // Hawaii\
    \ is more expensive\nelse // Pitfall!\n    shipping_charge = 20.00; // As are\
    \ foreign shipments\n```\n```\n\nThe indentation level seems to suggest that the\
    \ else is grouped with the test country == \"USA\".\nUnfortunately, that is not\
    \ the case. The compiler ignores all indentation and matches the else\nwith the\
    \ preceding if. That is, the code is actually\n\n```\n```\ndouble shipping_charge\
    \ = 5.00; // $5 inside continental U.S.\nif (country == \"USA\")\n    if (state\
    \ == \"HI\")\n        shipping_charge = 10.00; // Hawaii is more expensive\n \
    \   else // Pitfall!\n        shipping_charge = 20.00; // As are foreign shipments\n\
    ```\n```\n\nThat isn't what you want. You want to group the else with the first\
    \ if.\n\nThe ambiguous else is called a *dangling else*. You can avoid this pitfall\
    \ if you *always use braces*, as recommended in Programming Tip 3.2 on page 80:\n\
    \n```\n```\ndouble shipping_charge = 5.00; // $5 inside continental U.S.\nif (country\
    \ == \"USA\")\n{\n    if (state == \"HI\")\n    {\n        shipping_charge = 10.00;\
    \ // Hawaii is more expensive\n    }\n}\nelse\n{\n    shipping_charge = 20.00;\
    \ // As are foreign shipments\n}\n```\n```"
