- pgno: 65
  md: '# Programming Tip 2.1


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_65_0.png)


    # Choose Descriptive Variable Names


    We could have saved ourselves a lot of typing by using shorter variable names,
    as in


    ```

    `double cv = 0.355;`

    ```


    Compare this definition with the one that we actually used, though. Which one
    is easier to read? There is no comparison. Just reading `can_volume` is a lot
    less trouble than reading `cv` and then figuring out it must mean “can volume”.


    In practical programming, this is particularly important when programs are written
    by more than one person. It may be obvious to you that `cv` stands for can volume
    and not current velocity, but will it be obvious to the person who needs to update
    your code years later? For that matter, will you remember yourself what `cv` means
    when you look at the code three months from now?


    # Special Topic 2.1


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_65_1.png)


    # Numeric Types in C++


    In addition to the `int` and `double` types, C++ has several other numeric types.


    C++ has two floating-point types. The `float` type uses half the storage of the
    `double` type that we use in this book, but it can only store 6–7 digits. Many
    years ago, when computers had far less memory than they have today, `float` was
    the standard type for floating-point computations, and programmers would indulge
    in the luxury of “double precision” only when they needed the additional digits.
    Today, the `float` type is rarely used.


    By the way, these numbers are called “floating-point” because of their internal
    representation in the computer. Consider numbers 29660, 2.96, and 0.0296. They
    can be represented in a very similar way: namely, as a sequence of the significant
    digits—296—and an indication of the position of the decimal point. When the values
    are multiplied or divided by 10, only the position of the decimal point changes;
    it “floats”. Computers use base 2, not base 10, but the principle is the same.


    **Table 4 Number Types**


    | Type | Typical Range | Typical Size |

    |---|---|---|

    | int | −2,147,483,648 … 2,147,483,647 (about 2 billion) | 4 bytes |

    | unsigned | 0 … 4,294,967,295 | 4 bytes |

    | short | −32,768 … 32,767 | 2 bytes |

    | unsigned short | 0 … 65,535 | 2 bytes |

    | long long | −9,223,372,036,854,775,808 … 9,223,372,036,854,775,807 | 8 bytes
    |

    | double | The double-precision floating-point type, with a range of about ±10^308
    and about 15 significant decimal digits | 8 bytes |

    | float | The single-precision floating-point type, with a range of about ±10^38
    and about 7 significant decimal digits | 4 bytes |'
