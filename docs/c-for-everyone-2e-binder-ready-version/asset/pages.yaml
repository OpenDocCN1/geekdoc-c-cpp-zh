- pgno: 12
  md: "**Common Errors** describe the kinds of errors that students often make, with\
    \ an explanation of why the errors occur, and what to do about them.\n\n# **Common\
    \ Error 2.1**\n\n### Using Undefined Variables\n\nYou must declare a variable\
    \ before using it for the first time. For example, the following sequence of statements\
    \ would not be legal:\n\n```\n    double can_volume = 4 / 3 * 3.14 * can_radius\
    \ * can_radius * 1.75;\n    double can_radius = 12 * 3.14 * 1.75 * 1.75;\n```\n\
    \nIn your program, the statements are compiled in order. When the compiler reaches\
    \ the first statement, it does not know that later can_radius will be defined\
    \ in the next line, and it reports an error.\n\n**Programming Tips** explain good\
    \ programming practices, and encourage students to be more productive with tips\
    \ and techniques such as hand-tracing.\n\n# **Programming Tip 3.6**\n\n### Hand-Tracing\n\
    \nA very useful technique for understanding whether a program works correctly\
    \ is called hand-tracing. You simulate the program’s activity on a sheet of paper.\
    \ You can use this method with pseudocode or Java code.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_12_0.png)\n\
    \nHand-tracing helps you understand whether a program works correctly.\n\nGet\
    \ an index card, or some other kind of paper, and make a table with one column\
    \ for each variable in the program. Add rows for lines in the program, if you\
    \ like. Make sure that every time a variable is updated, you cross out the old\
    \ value and write the new value below it.\n\nYou need to know how to execute a\
    \ loop. In a loop, you repeatedly execute the statements inside it until the loop\
    \ condition is false.\n\n| input | count | max |\n| --- | --- | --- |\n| 1 | 1\
    \ | 1 |\n| 2 | 2 | 2 |\n| 3 | 3 | 3 |\n\n| input | count | max |\n| --- | ---\
    \ | --- |\n| 1 | 1 | 1 |\n| 2 | 2 | 2 |\n| 3 | 3 | 3 |\n| -1 | 3 | 3 |\n\nFor\
    \ example, let’s trace the program with the data from the preceding section. Suppose\
    \ we use the input values 1, 2, 3, and -1, and the code from Worked Example 3.1.\n\
    \n```\n    Line 14: int input = in.nextInt();\n    Line 15: int count = 0;\n \
    \   Line 16: int max = 0;\n    Line 17: while (input >= 0) {\n    Line 18:   \
    \ count++;\n    Line 19:    if (input > max) { max = input; }\n    Line 20:  \
    \  input = in.nextInt();\n    Line 21: }\n    Line 22: double average = 0;\n \
    \   Line 23: if (count > 0) { average = (double) max / count; }\n    Line 24:\
    \ System.out.println(average);\n```\n\nBecause max starts at 0, it is replaced\
    \ by 1; it is later replaced by 2; then it is replaced by 3; it is not replaced\
    \ by -1 because -1 is not greater than 3. On the next input, the loop condition\
    \ is false. Then the average is computed as (double) max / count. If count is\
    \ 0, the average is 0.\n\n**Special Topics** present optional topics and provide\
    \ additional explanation of others.\n\n# **Special Topic 6.2**\n\n### A Sorting\
    \ Algorithm\n\nSorting is the process of rearranging the elements of a sequence\
    \ so that they are stored in sorted order. Here is a simple sorting algorithm,\
    \ called selection sort. Consider sorting the following array values:\n\n`11 9\
    \ 17 12 5 10`\n\nAn obvious first step is to find the smallest element. In this\
    \ case, the smallest element is 5, stored in slots[4]. You should move the 5 to\
    \ the beginning of the array. Of course, there is already an element stored in\
    \ slots[0], namely 11. Therefore the 11 needs to be copied to slots[4], the position\
    \ previously occupied by 5. The following shows the array after the first step\
    \ is completed.\n\n`5 9 17 12 11 10`\n\nNow the first element is in the correct\
    \ position. In the next step, the second element is in the correct position. In\
    \ the next step, the third element is in the correct position. In the next step,\
    \ the fourth element is in the correct position. The remaining array values are\
    \ 9, 17, 12, 11, 10. The next step is to find the smallest element in the remaining\
    \ array. The smallest element is 9, stored in slots[1]. You should move the 9\
    \ to the beginning of the remaining array. Of course, there is already an element\
    \ stored in slots[1], namely 9. Therefore no action is needed. The following shows\
    \ the array after the second step is completed.\n\n`5 9 17 12 11 10`\n\nNow the\
    \ first two elements are in the correct positions. In the next step, the remaining\
    \ array values are 17, 12, 11, 10. The smallest element is 10, stored in slots[5].\
    \ You should move the 10 to the beginning of the remaining array. Of course, there\
    \ is already an element stored in slots[2], namely 17. Therefore the 17 needs\
    \ to be copied to slots[5], the position previously occupied by 10. The following\
    \ shows the array after the third step is completed.\n\n`5 9 10 12 11 17`\n\n\
    Now the first three elements are in the correct positions. In the next step, the\
    \ remaining array values are 12, 11, 17. The smallest element is 11, stored in\
    \ slots[4]. You should move the 11 to the beginning of the remaining array. Of\
    \ course, there is already an element stored in slots[3], namely 12. Therefore\
    \ the 12 needs to be copied to slots[4], the position previously occupied by 11.\
    \ The following shows the array after the fourth step is completed.\n\n`5 9 10\
    \ 11 12 17`\n\nNow the first four elements are in the correct positions. In the\
    \ next step, the remaining array values are 12 and 17. The smallest element is\
    \ 12, stored in slots[4]. You should move the 12 to the beginning of the remaining\
    \ array. Of course, there is already an element stored in slots[4], namely 12.\
    \ Therefore no action is needed. The following shows the array after the fifth\
    \ step is completed.\n\n`5 9 10 11 12 17`\n\nNow the first five elements are in\
    \ the correct positions. In the next step, the remaining array value is 17. The\
    \ smallest element is 17, stored in slots[5]. You should move the 17 to the beginning\
    \ of the remaining array. Of course, there is already an element stored in slots[5],\
    \ namely 17. Therefore no action is needed. The following shows the array after\
    \ the sixth step is completed.\n\n`5 9 10 11 12 17`\n\nNow the first six elements\
    \ are in the correct positions. The array is now sorted.\n\n**Random Facts** provide\
    \ historical and social information on computing—for interest and to fulfill the\
    \ “historical and social context” requirements of the ACM/IEEE curriculum guidelines.\n\
    \n# **Random Fact 4.1**\n\n### The First Bug\n\nAccording to legend, the first\
    \ computer bug was a real insect. The computer scientist Grace Murray Hopper,\
    \ a pioneer in the field of computers, was working on an early computer, the Mark\
    \ II, at Harvard University. One day, the machine stopped working. She and her\
    \ coworkers discovered that a moth was trapped in a relay switch. The operators\
    \ taped the moth to the logbook. The logbook entry, shown below, reads “First\
    \ actual case of bug being found.” The moth itself has disappeared, but the logbook\
    \ page is preserved at the Smithsonian Institution.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_12_1.png)"
