  md: "# 4.2 Problem Solving: Hand-Tracing\n\n> > Hand-tracing is a simulation of\
    \ code execution in which you step through instructions and track the values of\
    \ the variables.\n\nIn Programming Tip 3.6, you learned about the method of hand-tracing.\
    \ When you hand-trace code or pseudocode, you write the names of the variables\
    \ on a sheet of paper, mentally execute each step of the code and update the variables.\n\
    \nIt is best to have the code written or printed on a sheet of paper. Use a marker,\
    \ such as a paper clip, to mark the current line. Whenever a variable changes,\
    \ cross out the old value and write the new value below. When a program produces\
    \ output, also write down the output in another column.\n\nConsider this example.\
    \ What value is displayed?\n\n```\n```cpp\nint n = 1729;\nint sum = 0;\nwhile\
    \ (n > 0)\n{\n   int digit = n % 10;\n   sum = sum + digit;\n   n = n / 10;\n\
    }\ncout << sum << endl;\n```\n```\n\nThere are three variables: n, sum, and digit.\n\
    \n| n | sum | digit |\n|---|---|---|\n|  |  |  |\n\nThe first two variables are\
    \ initialized with 1729 and 0 before the loop is entered.\n\n```\n```cpp\nint\
    \ n = 1729;\nint sum = 0;\nwhile (n > 0)\n{\n   int digit = n % 10;\n   sum =\
    \ sum + digit;\n   n = n / 10;\n}\ncout << sum << endl;\n```\n```\n\n| n | sum\
    \ | digit |\n|---|---|---|\n| 1729 | 0 |  |\n\nBecause n is greater than zero,\
    \ enter the loop. The variable digit is set to 9 (the remainder of dividing 1729\
    \ by 10). The variable sum is set to 0 + 9 = 9.\n\n```\n```cpp\nint n = 1729;\n\
    int sum = 0;\nwhile (n > 0)\n{\n   int digit = n % 10;\n   sum = sum + digit;\n\
    \   n = n / 10;\n}\ncout << sum << endl;\n```\n```\n\n| n | sum | digit |\n|---|---|---|\n\
    | 1729 | 9 | 9 |"
