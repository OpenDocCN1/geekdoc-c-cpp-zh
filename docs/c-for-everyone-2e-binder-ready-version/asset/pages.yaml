  md: "Now you enter the branch part >= 10. teen_name(16) is sixteen, so the variables\
    \ now have the values\n\n| int_name(number = 416) | |\n|---|---|\n| part | name\
    \ |\n| 416 | \"four hundred\" |\n| 16 | \"four hundred\" |\n| 0 | \"four hundred\
    \ sixteen\" |\n\nNow it becomes clear why you need to set part to 0 in line 87.\
    \ Otherwise, you would enter the next branch and the result would be “four hundred\
    \ sixteen six”. Tracing the code is an effective way to understand the subtle\
    \ aspects of a function.\n\n# ### Programming Tip 5.5\n\n# ## Stubs\n\nWhen writing\
    \ a larger program, it is not always feasible to implement and test all functions\
    \ at once. You often need to test a function that calls another, but the other\
    \ function hasn't yet been implemented. Then you can temporarily replace the missing\
    \ function with a stub. A stub is a function that returns a simple value that\
    \ is sufficient for testing another function. Here are examples of stub functions:\n\
    \n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_244_0.png)\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_244_1.png)\n\
    \n*Stubs are incomplete functions that can be used for testing.*\n\n```\n```cpp\n\
    /**\n   Turns a digit into its English name.\n   @param digit an integer between\
    \ 1 and 9\n   @return the name of digit (\"one\" ... \"nine\")\n*/\nstring digit_name(int\
    \ digit)\n{\n   return \"mumble\";\n}\n\n/**\n   Gives the name of the tens part\
    \ of a number between 20 and 99.\n   @param number an integer between 20 and 99\n\
    \   @return the tens name of the number (\"twenty\" ... \"ninety\")\n*/\nstring\
    \ tens_name(int number)\n{\n   return \"mumblety\";\n}\n```\n```\n\nIf you combine\
    \ these stubs with the int_name function and test it with an argument of 274,\
    \ you will get a result of \"mumble hundred mumblety mumble\", which indicates\
    \ that the basic logic of the int_name function is working correctly."
