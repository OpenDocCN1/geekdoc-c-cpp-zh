  md: '# ### 2.5.1 The string Type


    You can define variables that hold strings.


    ```

    ~~~cpp

    string name = "Harry";

    ~~~

    ```


    The string type is a part of the C++ standard. To use it, simply include the header
    file, <string>:


    ```

    ~~~cpp

    #include <string>

    ~~~

    ```


    We distinguish between string variables (such as the variable name defined above)
    and string literals (character sequences enclosed in quotes, such as "Harry").
    The string stored in a string variable can change. A string literal denotes a
    particular string, just as a number literal (such as 2) denotes a particular number.


    Unlike number variables, string variables are guaranteed to be initialized even
    if you do not supply an initial value. By default, a string variable is set to
    an empty string: a string containing no characters. An empty string literal is
    written as "". The definition


    ```

    ~~~cpp

    string response;

    ~~~

    ```


    has the same effect as


    ```

    ~~~cpp

    string response = "";

    ~~~

    ```


    # ### 2.5.2 Concatenation


    > > Use the + operator to concatenate strings; that is, to put them together to
    yield a longer string.


    Given two strings, such as "Harry" and "Morgan", you can concatenate them to one
    long string. The result consists of all characters in the first string, followed
    by all characters in the second string. In C++, you use the + operator to concatenate
    two strings. For example,


    ```

    ~~~cpp

    string fname = "Harry";

    string lname = "Morgan";

    string name = fname + lname;

    ~~~

    ```


    results in the string


    ```

    ~~~

    "HarryMorgan"

    ~~~

    ```


    What if you''d like the first and last name separated by a space? No problem:


    ```

    ~~~cpp

    string name = fname + " " + lname;

    ~~~

    ```


    This statement concatenates three strings: fname, the string literal " ", and
    lname. The result is


    ```

    ~~~

    "Harry Morgan"

    ~~~

    ```


    # ### 2.5.3 String Input


    You can read a string from the console:


    ```

    ~~~cpp

    cout << "Please enter your name: ";

    string name;

    cin >> name;

    ~~~

    ```'
