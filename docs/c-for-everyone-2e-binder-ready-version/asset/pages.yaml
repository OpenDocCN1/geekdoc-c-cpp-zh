    # # Implementing an Employee Hierarchy for Payroll Processing


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_496_0.png)


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_496_1.png)


    This Worked Example shows how to implement payroll processing that works for different
