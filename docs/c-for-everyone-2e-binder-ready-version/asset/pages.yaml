  md: "**Figure 2 Execution of a for Loop**\n\n| Step | State/action | Code |\n|---|---|---|\n\
    | Initialization | `counter = 1` | `for (counter = 1; counter <= 10; counter++)`<br>`cout\
    \ << counter << endl;` |\n| Check condition | `counter <= 10` (true) | `for (counter\
    \ = 1; counter <= 10; counter++)`<br>`cout << counter << endl;` |\n| Execute body\
    \ | `cout << counter << endl;` | `for (counter = 1; counter <= 10; counter++)`<br>`cout\
    \ << counter << endl;` |\n| Update counter | `counter++` | `for (counter = 1;\
    \ counter <= 10; counter++)`<br>`cout << counter << endl;` |\n| Check condition\
    \ again | `counter <= 10` (true) | `for (counter = 1; counter <= 10; counter++)`<br>`cout\
    \ << counter << endl;` |\n\nProgressive figures trace code segments to help students\
    \ visualize the program flow. Color is used consistently to make variables and\
    \ other elements easily recognizable.\n\n**Figure 3 Parameter Passing**\n\n| Stage\
    \ | Code | State |\n|---|---|---|\n| Function call | `double result = cube_volume(2);`\
    \ | `result = ?` |\n| Entering function `cube_volume` | `double result = cube_volume(2);`\
    \ | `side = 2` |\n| Executing function body | `double volume = side * side * side;`\
    \ | `side = 2` |\n| Executing return statement | `return volume;` | `volume =\
    \ 8` |\n| Return to function call | `double result = cube_volume(2);` | `result\
    \ = 8` |\n\n- The parameter variable `side`, length of cube, is created.\n- The\
    \ parameter variable is initialized with the value of the argument that was passed\
    \ in the call to `cube_volume`.\n- The variable `volume` is assigned the value\
    \ of `side * side * side`, which is stored in the variable `volume`.\n- The return\
    \ statement returns the value of `volume`, so `cube_volume` returns `8`.\n\nSelf-check\
    \ exercises at the end of each section are designed to make students think through\
    \ the new material—and can spark discussion in lecture.\n\n# SELF CHECK\n\n+ \
    \  11. Write the `for` loop of the `twos.cpp` program as a `while` loop.\n+  \
    \ 12. How many numbers does this loop print?\n+   \n+   ```cpp\n+   for (int n\
    \ = 10; n >= 0; n--)\n+   {\n+       cout << n << endl;\n+   }\n+   ```\n+   \n\
    +   13. Write a `for` loop that prints all even numbers between 10 and 20 (inclusive).\n\
    +   14. Write a `for` loop that computes the sum of the integers from 1 to 100.\n\
    +   15. How would you modify the `HelloPrinter` program to print \"Hello\" ten\
    \ times using a loop?\n\n**Practice It** Now you can try these exercises at the\
    \ end of the chapter: R4.2, R4.7, P4.12.\n\nOptional engineering exercises engage\
    \ students with applications from technical fields.\n\n# Engineering P7.20\n\n\
    Write a program that simulates the control software for a “people mover” system,\
    \ a set of driverless trains that move in two concentric circular tracks. A set\
    \ of switches allows trains to switch tracks.\n\nIn your program, the outer and\
    \ inner tracks should each be divided into ten segments. Each track segment can\
    \ contain a train that moves either clockwise or counterclockwise. A train moves\
    \ to an adjacent segment in its track or, if that segment is occupied, to the\
    \ adjacent segment in the other track.\n\nDefine a `Segment` structure. Each segment\
    \ has a pointer to the next and previous segments in its track, a pointer to the\
    \ next and previous segments in the other track, ...\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_11_0.png)\n\
    \n```\n```cpp\nch05/cube.cpp\n 1 #include <iostream>\n 2\n 3 using namespace std;\n\
    \ 4\n 5 /**\n 6    Computes the volume of a cube.\n 7    @param side the side\
    \ length of the cube\n 8    @return the volume\n 9 */\n10 double cube_volume(double\
    \ side)\n11 {\n12    double volume = side * side * side;\n13    return volume;\n\
    14 }\n15\n16 int main()\n17 {\n18    double result1 = cube_volume(2);\n19    double\
    \ result2 = cube_volume(10);\n20    cout << \"A cube with side length 2 has volume\
    \ \" << result1 << endl;\n21    cout << \"A cube with side length 10 has volume\
    \ \" << result2 << endl;\n22\n23    return 0;\n24 }\n\nProgram Run\nA cube with\
    \ side length 2 has volume 8\nA cube with side length 10 has volume 1000\n```\n\
    ```\n\nProgram listings are carefully designed for easy reading, going well beyond\
    \ simple color coding. Functions are set off by a subtle outline."
