- pgno: 62
  md: '![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_62_0.png)


    **Figure 1** Executing the Assignment `total_volume = total_volume + 2`


    # 2.1.5 Constants


    You cannot change the value of a variable that is defined as const.


    When a variable is defined with the reserved word `const`, its value can never
    change. Constants are commonly written using capital letters to distinguish them
    visually from regular variables:


    ```

    const double BOTTLE_VOLUME = 2;

    ```


    It is good programming style to use named constants in your program to explain
    the meanings of numeric values. For example, compare the statements


    ```

    double total_volume = bottles * 2;

    ```


    and


    ```

    double total_volume = bottles * BOTTLE_VOLUME;

    ```


    A programmer reading the first statement may not understand the significance of
    the number 2. The second statement, with a named constant, makes the computation
    much clearer.


    # 2.1.6 Comments


    Use comments to add explanations for humans who read your code. The compiler ignores
    comments.


    As your programs get more complex, you should add **comments**, explanations for
    human readers of your code. Here is an example:


    ```

    const double CAN_VOLUME = 0.355; // Liters in a 12-ounce can

    ```


    This comment explains the significance of the value 0.355 to a human reader. The
    compiler does not process comments at all. It ignores everything from a `//` delimiter
    to the end of the line.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_62_1.png)


    Just as a television commentator explains the news, you use comments in your program
    to explain its behavior.'
