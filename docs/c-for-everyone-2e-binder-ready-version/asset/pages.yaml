  md: "```\n    5  int main()\n    6  {\n    7     for (int i = 1; i <= 10; i++)\n\
    \    8     {\n    9        int r = rand();\n    10       cout << r << endl;\n\
    \    11    }\n    12    return 0;\n    13 }\n```\n\n# **Program Run**\n\n```\n\
    \    1804289383\n    846930886\n    1681692777\n    1714636915\n    1957747793\n\
    \    424238335\n    719885386\n    1649760492\n    596516649\n    118964142\n\
    ```\n\nActually, the numbers are not completely random. They are drawn from sequences\
    \ of numbers that don't repeat for a long time. These sequences are actually computed\
    \ from fairly simple formulas; they just behave like random numbers. For that\
    \ reason, they are often called **pseudorandom numbers**.\n\nTry running the program\
    \ again. You will get the *exact same output*! This confirms that the random numbers\
    \ are generated by formulas. However, when running simulations, you don't always\
    \ want to get the same results. To overcome this problem, specify a *seed* for\
    \ the random number sequence. Every time you use a new seed, the random number\
    \ generator starts generating a new sequence. The seed is set with the `srand`\
    \ function. A simple value to use as a seed is the current time:\n\n```\n    srand(time(0));\n\
    ```\n\nSimply make this call once in your program, before generating any random\
    \ numbers. Then the random numbers will be different in every program run. Also\
    \ include the `<ctime>` header that declares the `time` function.\n\n# ### 4.9.2\
    \ Simulating Die Tosses\n\nIn actual applications, you need to transform the output\
    \ from the random number generator into different ranges. For example, to simulate\
    \ the throw of a die, you need random numbers between 1 and 6.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_196_0.png)\n\
    \nHere is the general recipe for computing random integers between two bounds\
    \ a and b. As you know from Programming Tip 4.3 on page 147, there are b - a +\
    \ 1 values between a and b, including the bounds themselves. First compute `rand()\
    \ % (b - a + 1)` to obtain a random value between 0 and b - a, then add a, yielding\
    \ a random value between a and b:\n\n```\n    int r = rand() % (b - a + 1) + a;\n\
    ```"
