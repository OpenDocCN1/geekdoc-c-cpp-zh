  md: '# ## 9.7 Problem Solving: Discovering Classes


    To discover classes, look for nouns in the problem description.


    When you solve a problem using objects and classes, you need to determine the
    classes required for the implementation. You may be able to reuse existing classes,
    or you may need to implement new ones. One simple approach for discovering classes
    and member functions is to look for the nouns and verbs in the problem description.
    Often, nouns correspond to classes, and verbs correspond to member functions.


    Concepts from the problem domain, be it science, business, or a game, often make
    good classes. Examples are


    +   - Cannonball

    +   - CashRegister

    +   - Monster


    Concepts from the problem domain are good candidates for classes.


    The name for such a class should be a noun that describes the concept. Other frequently
    used classes represent system services such as files or menus.


    What might not be a good class? If you can''t tell from the class name what an
    object of the class is supposed to do, then you are probably not on the right
    track. For example, your homework assignment might ask you to write a program
    that prints paychecks. Suppose you start by trying to design a class PaycheckProgram.
    What would an object of this class do? An object of this class would have to do
    everything that the homework needs to do. That doesn''t simplify anything. A better
    class would be Paycheck. Then your program can manipulate one or more Paycheck
    objects.


    Another common mistake, particularly by students who are used to writing programs
    that consist of functions, is to turn an action into a class. For example, if
    your homework assignment is to compute a paycheck, you may consider writing a
    class ComputePaycheck. But can you visualize a "ComputePaycheck" object? The fact
    that "ComputePaycheck" isn''t a noun tips you off that you are on the wrong track.
    On the other hand, a Paycheck class makes intuitive sense. The word "paycheck"
    is a noun. You can visualize a paycheck object. You can then think about useful
    member functions of the Paycheck class, such as compute_taxes, that help you solve
    the assignment.


    When you analyze a problem description, you often find that you need multiple
    classes. It is then helpful to consider how these classes are related. One of
    the fundamental relationships between classes is the "aggregation" relationship
    (which is informally known as the "has-a" relationship).


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_441_0.png)


    In a class scheduling system, potential classes from the problem domain include
    Class, LectureHall, Instructor, and Student.'
