  md: "There is a special value, NULL, that you should use to indicate a pointer that\
    \ doesn't point anywhere. If you define a pointer variable and are not ready to\
    \ initialize it quite yet, set it to NULL.\n\nThe NULL pointer does not point\
    \ to any object.\n\n```\n```cpp\ndouble* account_pointer = NULL;  // Will set\
    \ later\n```\n```\n\nYou can later test whether the pointer is still NULL. If\
    \ it is, don't use it.\n\n```\n```cpp\nif (account_pointer != NULL) { cout <<\
    \ *account_pointer; }  // OK\n```\n```\n\nTrying to access data through a NULL\
    \ pointer is illegal, and it will cause your program to terminate.\n\nThe following\
    \ program demonstrates the behavior of pointers. We execute the same withdrawal\
    \ statement twice, but with different values for account_pointer. Each time, a\
    \ different account is modified.\n\n# ### ch07/accounts.cpp\n\n```\n```cpp\n#include\
    \ <iostream>\n\nusing namespace std;\n\nint main()\n{\n   double harrys_account\
    \ = 0;\n   double joint_account = 2000;\n   double* account_pointer = &harrys_account;\n\
    \n   *account_pointer = 1000;  // Initial deposit\n\n   *account_pointer = *account_pointer\
    \ - 100;  // Withdraw $100\n   cout << \"Balance: \" << *account_pointer << endl;\
    \  // Print balance\n\n   // Change the pointer value\n   account_pointer = &joint_account;\n\
    \n   // The same statements affect a different account\n   *account_pointer =\
    \ *account_pointer - 100;  // Withdraw $100\n   cout << \"Balance: \" << *account_pointer\
    \ << endl;  // Print balance\n\n   return 0;\n}\n```\n```\n\n# ### Program Run\n\
    \n```\n```\nBalance: 900\nBalance: 1900\n```\n```\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_339_0.png)\n\
    \n+   1. Consider this set of statements. What is printed?\n+   \n+      ```cpp\n\
    +      int a = 1;\n+      int b = 2;\n+      int* p = &a;\n+      cout << *p <<\
    \ endl;\n+      p = &b;\n+      cout << *p << endl;\n+      ```\n+   \n+   2.\
    \ Consider this set of statements. What is printed?\n+   \n+      ```cpp\n+  \
    \    int a = 1;\n+      int b = 2;\n+      ```"
