  md: "We now encounter an additional complexity. You only know that input failed\
    \ after you have entered the loop and attempted to read it. To remember the failure,\
    \ use a Boolean variable:\n\nYou can use a Boolean variable to control a loop.\
    \ Set the variable to true before entering the loop, then set it to false to leave\
    \ the loop.\n\n```\n```cpp\ncout << \"Enter values, Q to quit: \";\nbool more\
    \ = true;\nwhile (more)\n{\n   cin >> value;\n   if (cin.fail())\n   {\n     \
    \ more = false;\n   }\n   else\n   {\n      Process value.\n   }\n}\n```\n```\n\
    \nSome programmers dislike the introduction of a Boolean variable to control a\
    \ loop. Special Topic 4.2 on page 153 shows an alternative mechanism for leaving\
    \ a loop. However, when reading input, there is an easier way. The expression\n\
    \n```\n```\ncin >> value\n```\n```\n\ncan be used in a condition. It evaluates\
    \ to true if `cin` has *not* failed after reading value. Therefore, you can read\
    \ and process a set of inputs with the following loop:\n\n```\n```cpp\ncout <<\
    \ \"Enter values, Q to quit: \";\nwhile (cin >> value)\n{\n   Process value.\n\
    }\n```\n```\n\nThis loop is suitable for processing a single sequence of inputs.\
    \ You will learn more about reading inputs in Chapter 8.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_179_0.png)\n\
    \n+   21. What does the `sentinel.cpp` program print when the user immediately\
    \ types –1 when prompted for a value?\n+   22. Why does the `sentinel.cpp` program\
