- pgno: 76
  md: "# ## 2.3.2 Formatted Output\n\nWhen you print the result of a computation,\
    \ you often want some control over its appearance. For example, when you print\
    \ an amount in dollars and cents, you usually want it to be rounded to two significant\
    \ digits. That is, you want the output to look like\n\n    Price per ounce: 0.04\n\
    \ninstead of\n\n    Price per ounce: 0.0409722\n\n```\n    cout << fixed << setprecision(2);\n\
    ```\n\nThis command does not produce any output; it just manipulates `cout` so\
    \ that it will change the output format. The values `fixed` and `setprecision`\
    \ are called *manipulators*. We will discuss manipulators in detail in Chapter\
    \ 8. For now, just remember to include the statement given above whenever you\
    \ want currency values displayed neatly.\n\n> > You use manipulators to specify\
    \ how values should be formatted.\n\nTo use manipulators, you must include the\
    \ `<iomanip>` header in your program:\n\n```\n    #include <iomanip>\n```\n\n\
    You can combine the manipulators and the values to be displayed into a single\
    \ statement.\n\n```\n    cout << fixed << setprecision(2)\n         << \"Price\
    \ per ounce: \"\n         << price_per_ounce << endl;\n```\n\nThere is another\
    \ manipulator that is sometimes handy. When you display several rows of data,\
    \ you usually want the columns to line up.\n\nYou use the `setw` manipulator to\
    \ set the *width* of the next output field. The width is the total number of characters\
    \ used for showing the value, including digits, the decimal point, and spaces.\
    \ Controlling the width is important when you want columns of numbers to line\
    \ up.\n\nFor example, if you want a number to be printed in a column that is eight\
    \ characters wide, you use\n\n```\n    cout << setw(8) << price_per_ounce;\n```\n\
    \n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_76_0.png)\n\n*You use manipulators\
    \ to line up your output in neat columns.*"
  merge: -1
  img_proc: true
- pgno: 77
  md: "This command prints the value `price_per_ounce` in a field of width 8, for\
    \ example\n\n```\n```text\n    0.04\n```\n```\n\n(where each ␣ represents a space.)\n\
    \nThere is a notable difference between the `setprecision` and `setw` manipulators.\
    \ Once you set the precision, that value is used for all floating-point numbers.\
    \ But the width affects only the next value. Subsequent values are formatted without\
    \ added spaces.\n\nOur next example program will prompt for the price of a six-pack\
    \ and the volume of each can, then print out the price per ounce. The program\
    \ puts to work what you just learned about reading input and formatting output.\n\
    \n# ch02/volume2.cpp\n\n```\n```cpp\n#include <iostream>\n#include <iomanip>\n\
    \nusing namespace std;\n\nint main()\n{\n   // Read price per pack\n\n   cout\
    \ << \"Please enter the price for a six-pack: \";\n   double pack_price;\n   cin\
    \ >> pack_price;\n\n   // Read can volume\n\n   cout << \"Please enter the volume\
    \ for each can (in ounces): \";\n   double can_volume;\n   cin >> can_volume;\n\
    \n   // Compute pack volume\n\n   const double CANS_PER_PACK = 6;\n   double pack_volume\
    \ = can_volume * CANS_PER_PACK;\n\n   // Compute and print price per ounce\n\n\
