  md: "Use an istringstream to convert the numbers inside a string to integers or\
    \ floating-point numbers.\n\nNext, simply use the >> operator to read the month\
    \ name, the day, the comma separator, and the year:\n\n```\n~~~cpp\nstring month;\n\
    int day;\nstring comma;\nint year;\nstrm >> month >> day >> comma >> year;\n~~~\n\
    ```\n\nNow month is \"January\", day is 24, and year is 1973. Note that this input\
    \ statement yields day and year as *integers*. Had we taken the string apart with\
    \ `substr`, we would have obtained only strings, not numbers.\n\nIn fact, converting\
    \ strings that contain digits to their integer values is such a common operation\
    \ that it is useful to write a helper function for this purpose:\n\n```\n~~~cpp\n\
    int string_to_int(string s)\n{\n    istringstream strm;\n    strm.str(s);\n  \
    \  int n = 0;\n    strm >> n;\n    return n;\n}\n~~~\n```\n\nFor example, `string_to_int(\"\
    1973\")` is the *integer* 1973.\n\nUse an ostringstream to convert numeric values\
    \ to strings.\n\nBy writing to a string stream, you can convert integers or floating-point\
    \ numbers to strings. First construct an ostringstream object:\n\n```\n~~~cpp\n\
    ostringstream strm;\n~~~\n```\n\nNext, use the << operator to add a number to\
    \ the stream. The number is converted into a sequence of characters:\n\n```\n\
    ~~~cpp\nstrm << fixed << setprecision(5) << 10.0 / 3;\n~~~\n```\n\nNow the stream\
    \ contains the string \"3.33333\". To obtain that string from the stream, call\
    \ the `str` member function:\n\n```\n~~~cpp\nstring output = strm.str();\n~~~\n\
    ```\n\nYou can build up more complex strings in the same way. Here we build a\
    \ data string of the month, day, and year:\n\n```\n~~~cpp\nstring month = \"January\"\
    ;\nint day = 24;\nint year = 1973;\nostringstream strm;\nstrm << month << \" \"\
    \ << day << \", \" << year;\nstring output = strm.str();\n~~~\n```\n\nNow output\
    \ is the string \"January 24, 1973\". Note that we converted the *integers* day\
    \ and year into a string. Again, converting an integer into a string is such a\
    \ common operation that it is useful to have a helper function for it:\n\n```\n\
    ~~~cpp\nstring int_to_string(int n)\n{\n    ostringstream strm;\n    strm << n;\n\
    \    return strm.str();\n}\n~~~\n```\n\nFor example, `int_to_string(1973)` is\
    \ the string \"1973\"."
