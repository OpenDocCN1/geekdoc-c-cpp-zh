  md: "![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_342_0.png)\n\n**Figure 3** Pointers\
    \ into an Array\n\n# ### 7.2.2 Pointer Arithmetic\n\n> > Pointer arithmetic means\
    \ adding an integer offset to an array pointer, yielding a pointer that skips\
    \ past the given number of elements.\n\nPointers into arrays support *pointer\
    \ arithmetic*. You can add an integer offset to the pointer to point to another\
    \ array location. For example, suppose `p` points to the beginning of an array:\n\
    \n```\n    double a[10];\n    double* p = a;\n```\n\nThen the expression\n\n```\n\
    \    p + 3\n```\n\nis a pointer to the array element with index 3, and\n\n```\n\
    \    *(p + 3)\n```\n\nis that array element.\n\nAs you saw in the preceding section,\
    \ we can use the array name as a pointer. That is, `a + 3` is a pointer to the\
    \ array element with index 3, and `*(a + 3)` has exactly the same meaning as `a[3]`.\n\
    \n> > The array/pointer duality law states that `a[n]` is identical to `*(a +\
    \ n)`, where `a` is a pointer into an array and `n` is an integer offset.\n\n\
    In fact, for any integer `n`, it is true that\n\n```\n    a[n] is the same as\
    \ *(a + n)\n```\n\nThis relationship is called the *array/pointer duality law*.\n\
    \nThis law explains why all C++ arrays start with an index of zero. The pointer\
    \ (`a` or `a + 0`) points to the starting element of the array. That element must\
    \ therefore be `a[0]`. To better understand pointer arithmetic, let’s again pretend\
    \ that we know actual memory addresses. Suppose the array `a` starts at address\
    \ 20300. The array contains ten values of type `double`. A `double` value occupies\
    \ 8 bytes of memory. Therefore, the array occupies 80 bytes, from 20300 to 20379.\
    \ The starting value is located at address 20300, the next one at address 20308,\
    \ and so on (see Figure 3). For example, the value of `a + 3` is 20300 + 3 × 8\
    \ = 20324. (In general, if `p` is a pointer to a type `T`, then the address `p\
    \ + n` is obtained by adding `n` × the size of a `T` value to the address `p`.)\n\
    \nTable 2 on page 317 shows pointer arithmetic and the *array/pointer duality*\
    \ using this example."
