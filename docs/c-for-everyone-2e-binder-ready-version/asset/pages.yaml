  md: "# 4.8 Nested Loops\n\n> > When the body of a loop contains another loop, the\
    \ loops are nested. A typical use of nested loops is printing a table with rows\
    \ and columns.\n\nIn Section 3.4, you saw how to nest two if statements. Similarly,\
    \ complex iterations sometimes require a **nested loop**: a loop inside another\
    \ loop statement. When processing tables, nested loops occur naturally. An outer\
    \ loop iterates over all rows of the table. An inner loop deals with the columns\
    \ in the current row.\n\nIn this section you will see how to print a table. For\
    \ simplicity, we will simply print powers x^a, as in the table at right.\n\n|\
    \ x^1 | x^2 | x^3 | x^4 |\n|---|---|---|---|\n| 1 | 1 | 1 | 1 |\n| 2 | 4 | 8 |\
    \ 16 |\n| 3 | 9 | 27 | 81 |\n| ... | ... | ... | ... |\n| 10 | 100 | 1000 | 10000\
    \ |\n\nHere is the pseudocode for printing the table:\n\n```\n```\nPrint table\
    \ header.\nFor x from 1 to 10\n    Print table row.\n    Print endl.\n```\n```\n\
    \nHow do you print a table row? You need to print a value for each exponent. This\
    \ requires a second loop:\n\n```\n```\nFor n from 1 to 4\n    Print x^n.\n```\n\
    ```\n\nThis loop must be placed inside the preceding loop. We say that the inner\
    \ loop is *nested* inside the outer loop (see Figure 7).\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_192_0.png)"
