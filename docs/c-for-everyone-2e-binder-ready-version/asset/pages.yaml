  md: '# ### Programming Tip 3.7


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_130_0.png)


    # ### Make a Schedule and Make Time for Unexpected Problems


    Commercial software is notorious for being delivered later than promised. For
    example, Microsoft originally promised that its Windows Vista operating system
    would be available late in 2003, then in 2005, then in March 2006; it finally
    was released in January 2007. Some of the early promises might not have been realistic.
    It was in Microsoft’s interest to let prospective customers expect the imminent
    availability of the product. Had customers known the actual delivery date, they
    might have switched to a different product in the meantime. Undeniably, though,
    Microsoft had not anticipated the full complexity of the tasks it had set itself
    to solve.


    Microsoft can delay the delivery of its product, but it is likely that you cannot.
    As a student or a programmer, you are expected to manage your time wisely and
    to finish your assignments on time. You can probably do simple programming exercises
    the night before the due date, but an assignment that looks twice as hard may
    well take four times as long, because more things can go wrong. You should therefore
    make a schedule whenever you start a programming project.


    First, estimate realistically how much time it will take you to:


    +   - Design the program logic.

    +   - Develop test cases.

    +   - Type in the program and fix syntax errors.

    +   - Test and debug the program.


    For example, for the income tax program I might estimate an hour for the design;
    30 minutes for developing test cases; an hour for data entry and fixing syntax
    errors; and an hour for testing and debugging. That is a total of 3.5 hours. If
    I work two hours a day on this project, it will take me almost two days.


    Then think of things that can go wrong. Your computer might break down. You might
    be stumped by a problem with the computer system. (That is a particularly important
    concern for beginners. It is very common to lose a day over a trivial problem
    just because it takes time to track down a person who knows the magic command
    to overcome it.) As a rule of thumb, double the time of your estimate. That is,
    you should start four days, not two days, before the due date. If nothing went
    wrong, great; you have the program done two days early. When the inevitable problem
    occurs, you have a cushion of time that protects you from embarrassment and failure.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_130_1.png)


    *Make a schedule for your programming work and build in time for problems.*


    # ## 3.7 Boolean Variables and Operators


    Sometimes, you need to evaluate a logical condition in one part of a program and
    use it elsewhere. To store a condition that can be true or false, you use a Boolean
    variable. Boolean variables are named after the mathematician George Boole (1815–1864),
    a pioneer in the study of logic.


    > > The Boolean type `bool` has two values, `false` and `true`.


    In C++, the `bool` data type represents the Boolean type. Variables of type `bool`
    can hold exactly two values, denoted `false` and `true`. These values are not
    strings or integers; they are special values, just for Boolean variables.'
