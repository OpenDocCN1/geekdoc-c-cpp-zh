  md: 'At a sit-down dinner, food is served sequentially. At a buffet, you have "random
    access" to all food items.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_400_0.png)


    bytes, just as they are in the memory of the computer. (Each byte is a value between
    0 and 255.) In binary format, a floating-point number always occupies 8 bytes.
    We will study random access with a binary file format for images.


    We have to cover a few technical issues about binary files. To open a binary file
    for reading and writing, use the following command:


    ```

    ```cpp

    fstream strm;

    strm.open(filename, ios::in | ios::out | ios::binary);

    ```

    ```


    You read a byte with the call


    ```

    ```cpp

    int input = strm.get();

    ```

    ```


    This call returns a value between 0 and 255. To read an integer, read four bytes
    $b_0, b_1, b_2, b_3$ and combine them to $b_0 + b_1 \cdot 256 + b_2 \cdot 256^2
    + b_3 \cdot 256^3$. We will supply a helper function for this task.


    The >> operator cannot be used to read numbers from a binary file.


    # ### 8.6.3 Processing Image Files


    In this section, you will learn how to write a program for editing image files
    in the BMP format. Unlike the more common GIF, PNG, and JPEG formats, the BMP
    format is quite simple because it does not use data compression. As a consequence,
    BMP files are huge and you will rarely find them in the wild. However, image editors
    can convert any image into BMP format.


    There are different versions of the BMP format; we will only cover the simplest
    and most common one, sometimes called the 24-bit true color format. In this format,
    each pixel is represented as a sequence of three bytes, one each for the blue,
    green, and red value. For example, the color cyan (a mixture of blue and green)
    is 255 255 0, red is 0 0 255, and medium gray is 128 128 128.


    A BMP file starts with a header that contains various pieces of information. We
    only need the following items:


    | Position | Item |

    |---|---|

    | 2 | The size of this file in bytes |

    | 10 | The start of the image data |

    | 18 | The width of the image in pixels |

    | 22 | The height of the image in pixels |'
