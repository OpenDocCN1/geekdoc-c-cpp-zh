  md: "![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_221_0.png)\n\nFunctions are a fundamental\
    \ building block of C++ programs. A function packages a computation into a form\
    \ that can be easily understood and reused. (The person in the image to the left\
    \ is executing the function “make two cups of espresso”.) In this chapter, you\
    \ will learn how to design and implement your own functions. Using the process\
    \ of stepwise refinement, you will be able to break up complex tasks into sets\
    \ of cooperating functions.\n\n# 5.1 Functions as Black Boxes\n\nA function is\
    \ a named sequence of instructions.\n\nA function is a sequence of instructions\
    \ with a name. You have already encountered several functions. For example, the\
    \ function named pow, which was introduced in Chapter 2, contains instructions\
    \ to compute a power x^y. Moreover, every C++ program has a function called main.\n\
    \nYou call a function in order to execute its instructions. For example, consider\
    \ the following program:\n\n```\n```\nint main()\n{\n   double z = pow(2, 3);\n\
    \   ...\n}\n```\n```\n\nBy using the expression pow(2, 3), main calls the pow\
    \ function, asking it to compute the power 2^3. The main function is temporarily\
    \ suspended. The instructions of the pow function execute and compute the result.\
    \ The pow function returns its result (that is, the value 8) back to main, and\
    \ the main function resumes execution (see Figure 1).\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_221_1.png)\n\
    \n**Figure 1** Execution Flow During a Function Call"
