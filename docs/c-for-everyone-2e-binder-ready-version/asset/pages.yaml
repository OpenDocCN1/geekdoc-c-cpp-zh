  md: "# **Table 2** Arrays and Pointers\n\n| Expression | Value | Comment |\n|---|---|---|\n\
    | `a` | 20300 | The starting address of the array, here assumed to be 20300. |\n\
    | `*a` | 0 | The value stored at that address. (The array contains values 0, 1,\
    \ 4, 9, ...) |\n| `a + 1` | 20308 | The address of the next double value in the\
    \ array. A double occupies 8 bytes. |\n| `a + 3` | 20324 | The address of the\
    \ element with index 3, obtained by skipping past 3 × 8 bytes. |\n| `*(a + 3)`\
    \ | 9 | The value stored at address 20324. |\n| `a[3]` | 9 | The same as `*(a\
    \ + 3)` by array/pointer duality. |\n| `*a + 3` | 3 | The sum of `*a` and 3. Since\
    \ there are no parentheses, the `*` refers only to `a`. |\n| `&a[3]` | 20324 |\
    \ The address of the element with index 3, the same as `a + 3`. |\n\nreaders the\
    \ illusion that an entire array is passed to the function, but in fact the function\
    \ receives only the starting address for the array.\n\nNow consider this statement\
    \ in the body of the function:\n\n```\n```cpp\ntotal = total + a[i];\n```\n```\n\
    \nThe C++ compiler considers `a` to be a *pointer*, not an array. The expression\
    \ `a[i]` is syntactic sugar for `*(a + i)`. That expression denotes the storage\
    \ location that is `i` elements away from the address stored in the variable `a`.\
    \ Figure 4 shows how `a[i]` is accessed when `i` is 3.\n\nYou can now understand\
    \ why it is always necessary to pass the size of the array. The function receives\
    \ a single memory address, which tells it where the array starts. That memory\
    \ address enables the function to locate the values in the array. But the function\
    \ also needs to know where to stop.\n\n# **SELF CHECK**\n\nFor Self Checks 6–9,\
    \ draw the array and pointer as in Figure 3. Assume a starting address (20300\
    \ will work fine), and assume that each int value occupies 4 bytes.\n\n+   6.\
    \ What is the contents of the array after these statements?\n+   \n+      ```cpp\n\
    +      int a[] = { 2, 3, 5 };\n+      int* p = a;\n+      p++;\n+      *p = 0;\n\
    +      ```\n+   \n+   7. What is the contents of the array after these statements?\n\
    +   \n+      ```cpp\n+      int a[] = { 2, 3, 5 };\n+      int* p = a + 1;\n+\
    \      *(p + 1) = 0;\n+      ```\n+   \n+   8. What is the contents of the array\
    \ after these statements?\n+   \n+      ```cpp\n+      int a[] = { 2, 3, 5 };\n\
    +      int* p = a;\n+      int* q = a + 2;\n+      ```"
