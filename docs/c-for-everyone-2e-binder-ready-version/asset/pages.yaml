    \n    /**\n        @param response the response to check\n        @return true\
    \ if the response was correct, false otherwise\n    */\n    bool check_answer(string\
    \ response) const;\n\n    /**\n        Displays this question.\n    */\n    void\
    \ display() const;\n\nprivate:\n    string text;\n    string answer;\n};\n\nQuestion::Question()\n\
    {\n}\n\nvoid Question::set_text(string question_text)\n{\n    text = question_text;\n\
    }\n\nvoid Question::set_answer(string correct_response)\n{\n    answer = correct_response;\n\
    }\n\nbool Question::check_answer(string response) const\n{\n    return response\
    \ == answer;\n}\n\nvoid Question::display() const\n{\n    cout << text << endl;\n\
    }\n~~~\n```"
