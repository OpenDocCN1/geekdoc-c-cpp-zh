    \ call this function like this:\n\n```\n```cpp\nconst int MAXIMUM_NUMBER_OF_VALUES\
    \ = 1000;\ndouble values[MAXIMUM_NUMBER_OF_VALUES];\nint current_size = read_inputs(values,\
    \ MAXIMUM_NUMBER_OF_VALUES);\n// values is a partially filled array; the current_size\
    \ variable specifies its size\n```\n```\n\nA function that adds elements to an\
    \ array needs to know its capacity.\n\nAlternatively, you can pass the size as\
    \ a reference parameter. This is more appropriate for functions that modify an\
    \ existing array:\n\n```\n```cpp\nvoid append_inputs(double inputs[], int capacity,\
    \ int& current_size)\n{\n    double input;\n    while (cin >> input)\n    {\n\
    ```\n```"
