  md: '# Determine the scope of variables in a program.


    +   - The scope of a variable is the part of the program in which it is visible.

    +   - A variable in a nested block shadows a variable with the same name in an
    outer block.

    +   - A local variable is defined inside a function. A global variable is defined
    outside a function.

    +   - Avoid global variables in your programs.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_260_0.png)


    # Describe how reference parameters work.


    +   - Modifying a value parameter has no effect on the caller.

    +   - A reference parameter refers to a variable that is supplied in a function
    call.

    +   - Modifying a reference parameter updates the variable that was supplied in
    the call.


    # Understand recursive function calls and implement simple recursive functions.


    +   - A recursive computation solves a problem by using the solution of the same
    problem with simpler inputs.

    +   - For a recursion to terminate, there must be special cases for the simplest
    inputs.

    +   - The key to finding a recursive solution is reducing the input to a simpler
    input for the same problem.

    +   - When designing a recursive solution, do not worry about multiple nested
    calls. Simply focus on reducing a problem to a slightly simpler one.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_260_1.png)


