  md: '# *Random Fact 6.2* The First Programmer


    Before pocket calculators and personal computers existed, navigators and engineers
    used mechanical adding machines, slide rules, and tables of logarithms and trigonometric
    functions to speed up computations. Unfortunately, the tables—for which values
    had to be computed by hand—were notoriously inaccurate. The mathematician Charles
    Babbage (1791–1871) had the insight that if a machine could be constructed that
    produced printed tables automatically, both calculation and typesetting errors
    could be avoided. Babbage set out to develop a machine for this purpose, which
    he called a Difference Engine because it


    used successive differences to compute polynomials. For example, consider the
    function f(x) = x³. Write down the values for f(1), f(2), f(3), and so on. Then
    take the differences between successive values:


    | value | difference |

    |---|---|

    | 1 | |

    | 8 | 7 |

    | 27 | 19 |

    | 64 | 37 |

    | 125 | 61 |

    | 216 | 91 |


    Repeat the process, taking the difference of successive values in the second column,
    and then repeat once again:


    | value | first difference | second difference | third difference |

    |---|---|---|---|

    | 1 | | | |

    | 8 | 7 | | |

    | 27 | 19 | 12 | |

    | 64 | 37 | 18 | 6 |

    | 125 | 61 | 24 | 6 |

    | 216 | 91 | 30 | 6 |


    Now the differences are all the same. You can retrieve the function values by
    a pattern of additions—you need to know the values at the fringe of the pattern
    and the constant difference. You can try it out yourself: Write the highlighted
    numbers on a sheet of paper, and fill in the others by adding the numbers that
    are in the north and northwest positions.


    This method was very attractive, because mechanical addition machines had been
    known for some time. They consisted of cog wheels, with 10 cogs per wheel, to
    represent digits, and mechanisms to handle the carry from one digit to the next.
    Mechanical multiplication machines, on the other hand, were fragile and unreliable.
    Babbage built a successful prototype of the Difference Engine and, with his own
    money and government grants, proceeded to build the table-printing machine. However,
    because of funding problems and the difficulty of building the machine to the
    required precision, it was never completed.


    While working on the Difference Engine, Babbage conceived of a much grander vision
    that he called the Analytical Engine. The Difference Engine was designed to carry
    out a limited set of computations—it was no smarter than a pocket calculator is
    today. But Babbage realized that such a machine could be made programmable by
    storing programs as well as data. The internal storage of the Analytical Engine
    was to consist of 1,000 registers of 50 decimal digits each. Programs and constants
    were to be stored on punched cards—a technique that was, at that time, commonly
    used on looms for weaving patterned fabrics.


    Ada Augusta, Countess of Lovelace (1815–1852), the only child of Lord Byron, was
    a friend and sponsor of Charles Babbage. Ada Lovelace was one of the first people
    to realize the potential of such a machine, not just for computing mathematical
    tables but for processing data that were not numbers. She is considered by many
    to be the world''s first programmer.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_317_0.png)


