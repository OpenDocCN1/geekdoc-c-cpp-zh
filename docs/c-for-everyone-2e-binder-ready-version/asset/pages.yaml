  md: "![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_348_0.png)\n\nThe string is declared\
    \ as *const* because you are not supposed to modify a literal string. (See Special\
    \ Topic 7.3 on page 320 for more information on constant pointers.)\n\nA C string\
    \ is terminated by a special character, called a *null terminator*, denoted '\\\
    0'. For example, the C string \"Harry\" contains six characters, namely 'H', 'a',\
    \ 'r', 'r', 'y' and '\\0' (See Figure 6.)\n\nThe terminator is a character that\
    \ is encoded as the number zero—this is different from the character '0', the\
    \ character denoting the zero digit. (Under the ASCII encoding scheme, the character\
    \ denoting the zero digit is encoded as the number 48.)\n\nFunctions that operate\
    \ on C strings rely on this terminator. Here is a typical example, the `strlen`\
    \ function declared in the `<cstring>` header that computes the length of a character\
    \ array. The function counts the number of characters until it reaches the terminator.\n\
    \n```\n~~~c\nint strlen(const char s[])\n{\n   int i = 0;\n   while (s[i] != '\\\
    0') { i++; } // Count characters before the null terminator\n   return i;\n}\n\
