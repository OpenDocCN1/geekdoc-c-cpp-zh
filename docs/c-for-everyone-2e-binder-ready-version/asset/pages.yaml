  md: "```\nHere is our complete loop:\nRead first value; store as highest value.\n\
    highest_month = 1\nfor (current_month = 2; current_month <= 12; current_month++)\n\
    \    Read next value.\n    If value is higher than the highest value, set highest\
    \ value to that value,\n        highest_month to current_month.\n```\n\n# **Step\
    \ 6** Trace the loop with typical examples.\n\nHand-trace your loop code, as described\
    \ in Section 4.2. Choose example values that are not too complex—executing the\
    \ loop 3–5 times is enough to check for the most common errors. Pay special attention\
    \ when entering the loop for the first and last time.\n\nSometimes, you want to\
    \ make a slight modification to make tracing feasible. For example, when hand-tracing\
    \ the investment doubling problem, use an interest rate of 20 percent rather than\
    \ 5 percent. When hand-tracing the temperature loop, use 4 data values, not 12.\n\
    \nLet's say the data are 22.6 36.6 44.5 24.2. Here is the walkthrough:\n\n| current\
    \ month | current value | highest month | highest value |\n|---|---|---|---|\n\
    | 2 | 36.6 | 2 | 22.6 |\n| 3 | 44.5 | 3 | 36.6 |\n| 4 | 24.2 | | 44.5 |\n\nThe\
    \ trace demonstrates that **highest month** and **highest value** are properly\
    \ set.\n\n# **Step 7** Implement the loop in C++.\n\nHere's the loop for our example.\
    \ Exercise P4.4 asks you to complete the program.\n\n```\ndouble highest_value;\n\
    cin >> highest_value;\nint highest_month = 1;\nfor (int current_month = 2; current_month\
    \ <= 12; current_month++)\n{\n    double next_value;\n    cin >> next_value;\n\
    \    if (next_value > highest_value)\n    {\n        highest_value = next_value;\n\
    \        highest_month = current_month;\n    }\n}\ncout << highest_month << endl;\n\
    ```\n\n# WORKED EXAMPLE 4.1 Credit Card Processing\n\nThis Worked Example uses\
    \ a loop to remove spaces from a credit card number.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_191_0.png)\n\
    \n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_191_1.png)"
