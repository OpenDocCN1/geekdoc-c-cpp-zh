  md: '# # 9.6 Problem Solving: Tracing Objects


    You have seen how the technique of hand tracing is useful for understanding how
    a program works. When your program contains objects, it is useful to adapt the
    technique so that you gain a better understanding about object data and encapsulation.


    Write the member functions on the front of a card, and the data member values
    on the back.


    Use an index card or a sticky note for each object. On the front, write the member
    functions that the object can execute. On the back, make a table for the values
    of the data members.


    Here is a card for a CashRegister object:


    +   **front**

    +   - CashRegister reg1

    +   - clear

    +   - add_item(price)

    +   - get_total

    +   - get_count


    | item_count | total_price |

    | --- | --- |

    | | |


    In a small way, this gives you a feel for encapsulation. An object is manipulated
    through its public interface (on the front of the card), and the data members
    are hidden in the back.


    When an object is constructed, fill in the initial values of the data members.


    | item_count | total_price |

    | --- | --- |

    | 0 | 0 |


    Update the values of the data members when a mutator member function is called.


    Whenever a mutator member function is executed, cross out the old values and write
    the new ones below. Here is what happens after a call to the add_item member function:


    | item_count | total_price |

    | --- | --- |

    | ~~0~~<br>1 | ~~0~~<br>19.95 |


    If you have more than one object in your program, you will have multiple cards,
    one for each object:'
