    \   - `double cos(double x)`  \n+     Function: Cosine, cos x (x in radians)\n\
    +   - `double tan(double x)`  \n+     Function: Tangent, tan x (x in radians)\n\
    +   - `double log10(double x)`  \n+     Function: Decimal log, log10(x), x > 0\n\
    +   - `double fabs(double x)`  \n+     Function: Absolute value, |x|\n\n# ###\
