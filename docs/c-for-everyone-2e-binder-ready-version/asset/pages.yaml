  md: '# ## Appendices


    Appendix A contains a programming style guide. Using a style guide for programming
    assignments benefits students by directing them toward good habits and reducing
    gratuitous choice. The style guide is available in electronic form so that instructors
    can modify it to reflect their preferred style.


    Appendices B and C summarize C++ reserved words and operators. Appendix D lists
    character escape sequences and ASCII character code values. Appendix E documents
    all of the library functions and classes used in this book.


    Additional appendices available from the book''s companion web site include an
    expanded version of Appendix E that includes the functions and classes used in
    the four optional chapters, 11–14, plus appendices that cover number systems,
    bit and shift operations, and a comparison of C++ and Java.


    # ## Student and Instructor Resources


    The following resources for students and instructors can be obtained by visiting
    www.wiley.com/college/horstmann. Two companion web sites accompany the book—one
    for students, and a password-protected site for instructors only.


    +   - Additional exercises geared to the scientific and engineering problem domains

    +   - Worked Examples that apply the problem-solving steps in the book to other
    realistic examples (identified in the book by an icon, [icon])

    +   - Source code for all examples in the book

    +   - Solutions to all review and programming exercises (for instructors only)

    +   - Lecture presentation slides (in PowerPoint format) that summarize each chapter
    and include code listings and figures from the book (for instructors only)

    +   - A test bank that focuses on skills, not just terminology (for instructors
    only)

    +   - Four additional chapters on recursion, sorting and searching, and data structures

    +   - The programming style guide in electronic form


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_13_0.png)'
