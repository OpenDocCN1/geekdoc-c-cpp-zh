  md: "# ### 6.2.3 Sum and Average Value\n\nYou have already encountered this algorithm\
    \ in Section 4.7.1. Here is the code for computing the sum of all elements in\
    \ an array:\n\n```\n    double total = 0;\n    for (int i = 0; i < size of values;\
    \ i++)\n    {\n        total = total + values[i];\n    }\n```\n\nTo obtain the\
    \ average, divide by the number of elements:\n\n```\n    double average = total\
    \ / size of values;\n```\n\nBe sure to check that the size is not zero.\n\n# ###\
    \ 6.2.4 Maximum and Minimum\n\nUse the algorithm from Section 4.7.4 that keeps\
    \ a variable for the largest element that you have encountered so far. Here is\
    \ the implementation for arrays:\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_284_0.png)\n\
    \n```\n    double largest = values[0];\n    for (int i = 1; i < size of values;\
    \ i++)\n    {\n        if (values[i] > largest)\n        {\n            largest\
    \ = values[i];\n        }\n    }\n```\n\nNote that the loop starts at 1 because\
    \ we initialize largest with values[0]. To compute the smallest value, reverse\
    \ the comparison. These algorithms require that the array contain at least one\
    \ element.\n\n# ### 6.2.5 Element Separators\n\n> > When separating elements,\
    \ don't place a separator before the first element.\n\nWhen you display the elements\
    \ of a collection, you usually want to separate them, often with commas or vertical\
    \ lines, like this:\n\n1 | 4 | 9 | 16 | 25\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_284_1.png)\n\
    \nNote that there is one fewer separator than there are numbers. Print the separator\
    \ before each element *except the initial one* (with index 0):\n\n```\n    for\
    \ (int i = 0; i < size of values; i++)\n    {\n        if (i > 0)\n        {\n\
    \            cout << \" | \";\n        }\n        cout << values[i];\n    }\n\
    ```\n\nTo print five elements, you need four separators."
