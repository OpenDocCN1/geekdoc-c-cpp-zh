    \nIn this Worked Example, you will learn how to use a debugger to find errors\
    \ in a program.\n\n# ## 5.5 Functions Without Return Values\n\nUse a return type\
    \ of void to indicate that a function does not return a value.\n\nSometimes, you\
    \ need to carry out a sequence of instructions that does not yield a value. If\
    \ that instruction sequence occurs multiple times, you will want to package it\
    \ into a function. In C++, you use the return type void to indicate the absence\
    \ of a return value.\n\nHere is a typical example. Your task is to print a string\
    \ in a box, like this:\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_233_2.png)\n\
    \n```\n```\n-------\n!Hello!\n-------\n```\n```\n\nHowever, different strings\
    \ can be substituted for Hello. A function for this task can be defined as follows:\n\
    \n```\n```cpp\nvoid box_string(string str)\n```\n```\n\nNow you develop the body\
    \ of the function in the usual way, by formulating a general method for solving\
    \ the task.\n\n+   - Print a line that contains the - character n * 2 times, where\
    \ n is the length of the string.\n+   - Print a line containing the string, surrounded\
    \ with a | to the left and right.\n+   - Print another line containing the - character\
    \ n * 2 times.\n\nHere is the function implementation:\n\n```\n```cpp\n/**\n \
    \  Prints a string in a box.\n   @param str the string to print\n*/\nvoid box_string(string\
    \ str)\n{\n```\n```"
