    \ balance.\n    */\n   CheckingAccount();\n\n   virtual void withdraw(double amount);\n\
    \   virtual void month_end();\nprivate:\n};\n...\n```\n```\n\n**Step 6** Identify\
    \ data members.\n\nList the data members for each class. If you find a data member\
    \ that is common to all classes, be sure to place it in the base of the hierarchy.\n\
    \nAll accounts have a balance. We store that value in the BankAccount base class:\n\
    \n```\n```cpp\nclass BankAccount\n{\n...\nprivate:\n   double balance;\n};\n```\n\
    ```\n\nThe SavingsAccount class needs to store the interest rate. It also needs\
    \ to store the minimum monthly balance, which must be updated by all withdrawals:\n\
    \n```\n```cpp\nclass SavingsAccount : public BankAccount\n{\n...\nprivate:\n \
