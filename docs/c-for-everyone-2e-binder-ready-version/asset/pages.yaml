    \ Now you can try these exercises at the end of the chapter: R5.5, P5.10.\n\n\
    # ### Programming Tip 5.2\n\n**Do Not Modify Parameter Variables**\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_228_0.png)\n\
    \nIn C++, a parameter variable is just like any other variable. You *can* modify\
    \ the values of the parameter variables in the body of a function. For example,\n\
    \n```\n```cpp\nint total_cents(int dollars, int cents)\n{\n    cents = dollars\
    \ * 100 + cents; // Modifies parameter variable\n    return cents;\n}\n```\n```\n\
    \nHowever, many programmers find this practice confusing. It mixes the concept\
    \ of a parameter (input to the function) with that of a variable (storage for\
    \ a value). To avoid the confusion, simply introduce a separate variable:\n\n\
    ```\n```cpp\nint total_cents(int dollars, int cents)\n{\n    int result = dollars\
    \ * 100 + cents;\n    return result;\n}\n```\n```"
