  md: "Here is the C++ syntax for the `CashRegister` class definition:\n\n```\n```cpp\n\
    class CashRegister\n{\npublic:\n   void clear();\n   void add_item(double price);\n\
    \n   double get_total() const;\n   int get_count() const;\n\nprivate:\n   data\
    \ members—see Section 9.3\n};\n```\n```\n\nThe member functions are declared in\
    \ the *public section* of the class. Any part of the program can call the member\
    \ functions. The data members are defined in the *private section* of the class.\
    \ Only the member functions of the class can access those data members; they are\
    \ hidden from the remainder of the program.\n\nIt is legal to declare the private\
    \ members before the public section, but in this book, we place the public section\
    \ first. After all, most programmers reading a class are class users, not implementers,\
    \ and they are more interested in the public interface than in the private implementation.\n\
    \nThe member function declarations look similar to the declarations of regular\
    \ functions. These declarations do not provide any implementation. You will see\
    \ in Section 9.4 how to implement the member functions.\n\nThere are two kinds\
    \ of member functions, called **mutators** and **accessors**. A mutator is a function\
    \ that modifies the data members of the object. The CashRegister class\n\n# ###\
    \ Syntax 9.1 Class Definition\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_420_0.png)"
  merge: -1
  img_proc: true
- pgno: 421
  md: "![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_421_0.png)\n\nA mutator member function\
    \ changes the object on which it operates.\n\nhas two mutators: clear and add_item.\
    \ After you call either of these functions, the total amount and item count are\
    \ changed.\n\nAn accessor member function does not change the object on which\
    \ it operates. Use `const` with accessors.\n\nAccessors just query the object\
    \ for some information without changing it. The CashRegister class has two accessors:\
    \ get_total and get_count. Applying either of these functions to a CashRegister\
    \ object simply returns a value and does not modify the object. In C++, you should\
    \ use the const reserved word to mark accessor functions (see Programming Tip\
    \ 9.2 on page 402), like this:\n\n```\n    double get_total() const;\n```\n\n\
    Member functions are invoked using the dot notation that you have already seen\
    \ with string and stream functions:\n\n```\n    CashRegister register1; // Defines\
    \ a CashRegister object\n    register1.clear(); // Invokes a member function\n\
    ```\n\nNow we know what a CashRegister object can do, but not how it does it.\
    \ Of course, to use CashRegister objects in our programs, we don't need to know.\
    \ We simply use the public interface. Figure 1 shows the interface of the CashRegister\
    \ class. The mutator functions are shown with arrows pointing inside the private\
    \ data to indicate that they modify the data. The accessor functions are shown\
    \ with arrows pointing the other way to indicate that they just read the data.\n\
    \n# SELF CHECK\n\n+   5. What does the following code segment print?\n+   \n+\
    \           CashRegister reg;\n+           reg.clear();\n+           reg.add_item(0.95);\n\
    +           reg.add_item(0.95);\n+           cout << reg.get_count() << \" \"\
    \ << reg.get_total() << endl;\n+   \n+   6. What is wrong with the following code\
    \ segment?\n+   \n+           CashRegister reg;\n+           reg.clear();\n+ \
    \          reg.add_item(0.95);\n+           cout << reg.get_amount_due() << endl;\n\
    +   \n+   7. Declare a member function get_dollars of the CashRegister class that\
    \ yields the dollar value of the total amount of the sale.\n+   \n+   8. Name\
    \ two accessor member functions of the string class.\n+   \n+   9. Is the get\
    \ member function of the ifstream class an accessor or a mutator?\n\n# Practice\
    \ It\n\nNow you can try these exercises at the end of the chapter: R9.3, R9.7."
