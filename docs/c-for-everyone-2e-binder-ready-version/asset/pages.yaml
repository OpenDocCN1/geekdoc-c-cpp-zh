  md: 'File processing is the subject of Chapter 8. Section 8.1 can be covered sooner
    for an introduction to reading and writing text files. The remainder of the chapter
    gives additional material for practical applications.


    Chapters 9 and 10 introduce the object-oriented features of C++. Chapter 9 introduces
    class design and implementation. Chapter 10 covers inheritance and polymorphism.


    Four additional chapters are available on the Web. They can be used individually
    for a capstone chapter, or they can be combined for teaching a two-semester course.
    (They can also be incorporated into a custom print version of the text; ask your
    Wiley sales representative for details.)


    +   - Chapter 11. Recursion

    +   - Chapter 12. Sorting and Searching

    +   - Chapter 13. Lists, Stacks, and Queues

    +   - Chapter 14. Sets, Maps, and Priority Queues


    Figure 1 shows the dependencies between the chapters.


