  md: "# ## Syntax 4.2 for Statement\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_171_0.png)\n\
    \nA for loop can count down instead of up:\n\n```\n    for (counter = 10; counter\
    \ >= 0; counter--) ...\n```\n\nThe increment or decrement need not be in steps\
    \ of 1:\n\n```\n    for (counter = 0; counter <= 10; counter = counter + 2) ...\n\
    ```\n\nSee Table 2 on page 146 for additional variations.\n\nSo far, we assumed\
    \ that the counter variable had already been defined before the for loop. Alternatively,\
    \ you can define a variable in the loop initialization. Such a variable is defined\
    \ only in the loop:\n\n```\n    for (int counter = 1; counter <= 10; counter++)\n\
    \    {\n       ...\n    } // counter no longer defined here\n```\n\nHere is a\
    \ typical use of the for loop. We want to print the balance of our savings account\
    \ over a period of years, as shown in this table:\n\n| Year | Balance |\n|---|---|\n\
    | 1 | 10500.00 |\n| 2 | 11025.00 |\n| 3 | 11576.25 |\n| 4 | 12155.06 |\n| 5 |\
    \ 12762.82 |\n\nThe for loop pattern applies because the variable year starts\
    \ at 1 and then moves in constant increments until it reaches the target:"
