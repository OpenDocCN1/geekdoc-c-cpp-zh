    # ### Engineering P9.29


    The figure below shows a frequently used electric circuit called a “voltage divider”.
    The input to the circuit is the voltage $v_i$. The output is the voltage $v_o$.
    The output of a voltage divider is proportional to the input, and the constant
    of proportionality is called the “gain” of the circuit. The voltage divider is
    represented by the equation


    $$G = \frac{v_o}{v_i} = \frac{R_2}{R_1 + R_2}$$


    where $G$ is the gain and $R_1$ and $R_2$ are the resistances of the two resistors
    that comprise the voltage divider.


