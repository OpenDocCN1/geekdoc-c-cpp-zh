  md: "# ## HOW TO 10.1 Developing an Inheritance Hierarchy\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_491_0.png)\n\
    \nWhen you work with a set of classes, some of which are more general and others\
    \ more specialized, you want to organize them into an inheritance hierarchy. This\
    \ enables you to process objects of different classes in a uniform way.\n\nAs\
    \ an example, we will consider a bank that offers its customers the following\
    \ account types:\n\n+   - A savings account that earns interest. The interest\
    \ compounds monthly and is computed on the minimum monthly balance.\n+   - A checking\
    \ account that has no interest, gives you three free withdrawals per month, and\
    \ charges a $1 transaction fee for each additional withdrawal.\n\nThe program\
    \ will manage a set of accounts of both types, and it should be structured so\
    \ that other account types can be added without affecting the main processing\
    \ loop. Supply a menu\n\n```\n```\nD)eposit  W)ithdraw  M)onth end  Q)uit\n```\n\
    ```\n\nFor deposits and withdrawals, query the account number and amount. Print\
    \ the balance of the account after each transaction.\n\nIn the “Month end” command,\
    \ accumulate interest or clear the transaction counter, depending on the type\
    \ of the bank account. Then print the balance of all accounts.\n\n**Step 1** List\
    \ the classes that are part of the hierarchy.\n\nIn our case, the problem description\
    \ yields two classes: SavingsAccount and CheckingAccount. To express the commonality\
    \ between them, we will introduce a class BankAccount.\n\n**Step 2** Organize\
    \ the classes into an inheritance hierarchy.\n\nDraw a UML diagram that shows\
    \ base and derived classes. Here is the diagram for our example:\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_491_1.png)\n\
    \n**Step 3** Determine the common responsibilities.\n\nIn Step 2, you will have\
    \ identified a class at the base of the hierarchy. That class needs to have sufficient\
    \ responsibilities to carry out the tasks at hand. To find out what those tasks\
    \ are, write pseudocode for processing the objects:\n\n```\n```\nFor each user\
    \ command\n    If it is a deposit or withdrawal\n        Deposit or withdraw the\
    \ amount from the specified account.\n        Print the balance.\n    If it is\
    \ month end processing\n        For each account\n            Call month end processing.\n\
    \            Print the balance.\n```\n```"
