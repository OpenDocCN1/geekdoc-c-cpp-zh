- pgno: 308
  md: "# ### 6.6.4 Two-Dimensional Array Parameters\n\n> > A two-dimensional array\
    \ parameter must have a fixed number of columns.\n\nWhen passing a two-dimensional\
    \ array to a function, you must specify the number of columns as a *constant*\
    \ with the parameter type. For example, this function computes the total of a\
    \ given row:\n\n```\n    const int COLUMNS = 3;\n\n    int row_total(int table[][COLUMNS],\
    \ int row)\n    {\n       int total = 0;\n       for (int j = 0; j < COLUMNS;\
    \ j++)\n       {\n          total = total + table[row][j];\n       }\n       return\
    \ total;\n    }\n```\n\nThis function can compute row totals of a two-dimensional\
    \ array with an arbitrary number of rows, but the array must have 3 columns. You\
    \ have to write a different function if you want to compute row totals of a two-dimensional\
    \ array with 4 columns.\n\nTo understand this limitation, you need to know how\
    \ the array elements are stored in memory. Although the array appears to be two-dimensional,\
    \ the elements are still stored as a linear sequence. Figure 13 shows how the\
    \ counts array is stored, row by row.\n\nFor example, to reach\n\n```\n    counts[3][1]\n\
    ```\n\nthe program must first skip past rows 0, 1, and 2 and then locate offset\
    \ 1 in row 3. The offset from the start of the array is\n\n```\n    3 × number\
    \ of columns + 1\n```\n\nNow consider the row_total function. The compiler generates\
    \ code to find the element\ntable[i][j]\n\nby computing the offset\n\n```\n  \
    \  i * COLUMNS + j\n```\n\nThe compiler uses the value that you supplied in the\
    \ second pair of brackets when declaring the parameter:\n\n```\n    int row_total(int\
    \ table[][COLUMNS], int row)\n```\n\nNote that the first pair of brackets should\
    \ be empty, just as with one-dimensional arrays.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_308_0.png)\n\
    \n**Figure 13** A Two-Dimensional Array is Stored as a Sequence of Rows"
