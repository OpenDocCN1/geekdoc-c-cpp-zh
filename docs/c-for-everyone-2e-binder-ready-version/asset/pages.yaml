  md: "# ### 7.2.3 Array Parameter Variables are Pointers\n\nOnce you understand the\
    \ connection between arrays and pointers, it becomes clear why array parameter\
    \ variables are different from other parameter types. As an example, consider\
    \ this function that computes the sum of all values in an array:\n\n```\n```cpp\n\
    double sum(double a[], int size)\n{\n    double total = 0;\n    for (int i = 0;\
    \ i < size; i++)\n    {\n        total = total + a[i];\n    }\n    return total;\n\
    }\n```\n```\n\nHere is a call to the function (see Figure 4):\n\n```\n```cpp\n\
    double data[10];\n... // Initialize data\ndouble s = sum(data, 10);\n```\n```\n\
    \nThe value data is passed to the sum function. It is actually a pointer of type\
    \ double*, pointing to the starting element of the array. One would therefore\
    \ expect that the function is declared as\n\n> > When passing an array to a function,\
    \ only the starting address is passed.\n\n```\n```cpp\ndouble sum(double* a, int\
    \ size)\n```\n```\n\nHowever, if you look closely at the function definition,\
    \ you will see that the parameter variable is declared as an array with empty\
    \ bounds:\n\n```\n```cpp\ndouble sum(double a[], int size)\n```\n```\n\nAs viewed\
    \ by the C++ compiler, these parameter declarations are completely equivalent.\
    \ The [] notation is \"syntactic sugar\" for declaring a pointer. (Computer scientists\
    \ use the term \"syntactic sugar\" to describe a notation that is easy to read\
    \ for humans and that masks a complex implementation detail.) The array notation\
    \ gives human\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_343_0.png)\n\nFigure\
    \ 4\nPassing an Array to a Function"
