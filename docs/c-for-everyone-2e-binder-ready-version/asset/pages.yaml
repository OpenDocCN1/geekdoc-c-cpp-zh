  md: '![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_159_0.png)


    In a loop, a part of a program is repeated over and over, until a specific goal
    is reached. Loops are important for calculations that require repeated steps and
    for processing input consisting of many data items. In this chapter you will learn
    about loop statements in C++, as well as techniques for writing programs that
    process input and simulate activities in the real world.


    # # 4.1 The while Loop


    In this section, you will learn how to repeatedly execute statements until a goal
    has been reached.


    Recall the investment problem from Chapter 1. You put $10,000 into a bank account
    that earns 5 percent interest per year. How many years does it take for the account
    balance to be double the original investment?


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_159_1.png)


    *Because the interest earned also earns interest, a bank balance grows exponentially.*


    In Chapter 1 we developed the following algorithm for this problem:


    Start with a year value of 0, a column for the interest, and a balance of $10,000.


    | year | interest | balance |

    |---|---|---|

    | 0 |  | $10,000 |


    +   - Repeat the following steps while the balance is less than $20,000

    +     - Add 1 to the year value.

    +     - Compute the interest as balance x 0.05 (i.e., 5 percent interest).

    +     - Add the interest to the balance.

    +   - Report the final year value as the answer.


    You now know how to define and update the variables in C++. What you don''t yet
    know is how to carry out “Repeat steps while the balance is less than $20,000”.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_159_2.png)


    *In a particle accelerator, subatomic particles traverse a loop-shaped tunnel
    multiple times, gaining the speed required for physical experiments. Similarly,
    in computer science, statements in a loop are executed while a condition is true.*'
