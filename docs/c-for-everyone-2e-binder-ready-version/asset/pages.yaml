  md: "Instead, you need to store the actual objects elsewhere and collect their locations\
    \ in an array by storing pointers. We will discuss the use of pointers in the\
    \ next section.\n\n# ## 10.4.2 Pointers to Base and Derived Classes\n\nTo access\
    \ objects from different classes in a class hierarchy, use pointers. Pointers\
    \ to the various objects all have the same size—namely, the size of a memory address—even\
    \ though the objects themselves may have different sizes.\n\nHere is the code\
    \ to set up the array of pointers (see Figure 6):\n\n```\n~~~\nQuestion* quiz[2];\n\
    quiz[0] = new Question;\nquiz[0]->set_text(\"Who was the inventor of C++?\");\n\
    quiz[0]->set_answer(\"Bjarne Stroustrup\");\nChoiceQuestion* cq_pointer = new\
    \ ChoiceQuestion;\ncq_pointer->set_text(\"In which country was the inventor of\
    \ C++ born?\");\ncq_pointer->add_choice(\"Australia\", false);\n...\nquiz[1] =\
    \ cq_pointer;\n~~~\n```\n\nAs the highlighted code shows, you simply define the\
    \ array to hold pointers, allocate all objects by calling new, and use the ->\
    \ operator instead of the dot operator.\n\n> > A derived-class pointer can be\
    \ converted to a base-class pointer.\n\nNote that the last assignment assigns\
    \ a derived-class pointer of type ChoiceQuestion* to a base-class pointer of type\
    \ Question*. This is perfectly legal. A pointer is the starting address of an\
    \ object. Because every ChoiceQuestion is a special case of a Question, the starting\
    \ address of a ChoiceQuestion object is, in particular, the starting address of\
    \ a Question object. The reverse assignment—from a base-class pointer to a derived-class\
    \ pointer—is an error.\n\nThe code to present all questions is\n\n```\n~~~\nfor\
    \ (int i = 0; i < QUIZZES; i++)\n{\n   quiz[i]->display();\n   cout << \"Your\
    \ answer: \";\n   getline(cin, response);\n   cout << quiz[i]->check_answer(response)\
    \ << endl;\n}\n~~~\n```\n\nAgain, note the use of the -> operator because quiz[i]\
    \ is a pointer.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_484_0.png)"
