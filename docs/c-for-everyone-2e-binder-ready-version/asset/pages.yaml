  md: "![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_104_0.png)\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_104_1.png)\n\
    \n**Figure 1**\nFlowchart for if Statement\n\n**Figure 2**\nFlowchart for if Statement\
    \ with No else Branch\n\nthere is nothing to do in the else branch of the statement.\
    \ In that case, you can omit it entirely, such as in this example:\n\n```\n```\n\
    int actual_floor = floor;\n\nif (floor > 13)\n{\n    actual_floor--;\n}  // No\
    \ else needed\n```\n```\n\nSee Figure 2 for the flowchart.\n\nThe following program\
    \ puts the if statement to work. This program asks for the desired floor and then\
    \ prints out the actual floor.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_104_2.png)\n\
    \n*An if statement is like a fork in the road. Depending upon a decision, different\
    \ parts of the program are executed.*"
