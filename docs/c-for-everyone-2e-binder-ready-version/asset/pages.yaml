  md: "![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_238_0.png)\n\n**Figure 5** Flowchart\
    \ of Coffee-Making Solution\n\nWhen printing a check, it is customary to write\
    \ the check amount both as a number (\"$274.15\") and as a text string (\"two\
    \ hundred seventy four dollars and 15 cents\"). Doing so reduces the recipient's\
    \ temptation to add a few digits in front of the amount.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_238_1.png)\n\
    \nFor a human, this isn't particularly difficult, but how can a computer do this?\
    \ There is no built-in function that turns 274 into \"two hundred seventy four\"\
    . We need to program this function. Here is the description of the function we\
    \ want to write:\n\n```\n```c\n/**\n * Turns a number into its English name.\n\
    \ * @param number a positive integer < 1,000\n * @return the name of number (e.g.,\
    \ \"two hundred seventy four\")\n */\nstring int_name(int number)\n```\n```"
