  md: "```\n~~~cpp\nint n = 1729;\nint sum = 0;\nwhile (n > 0)\n{\n    int digit =\
    \ n % 10;\n    sum = sum + digit;\n    n = n / 10;\n}\ncout << sum << endl;\n\
    ~~~\n```\n\n> > Because n equals zero, this condition is not true.\n\nThe condition\
    \ n > 0 is now false. Continue with the statement after the loop.\n\n```\n~~~cpp\n\
    int n = 1729;\nint sum = 0;\nwhile (n > 0)\n{\n    int digit = n % 10;\n    sum\
    \ = sum + digit;\n    n = n / 10;\n}\ncout << sum << endl;\n~~~\n```\n\n| n |\
    \ sum | digit | output |\n|---|---|---|---|\n| 1729 | 0 |  |  |\n| 172 | 9 | 9\
    \ |  |\n| 17 | 11 | 2 |  |\n| 1 | 18 | 7 |  |\n| 0 | 19 | 1 | 19 |\n\nThis statement\
    \ is an output statement. The value that is output is the value of sum, which\
    \ is 19.\n\nOf course, you can get the same answer by just running the code. However,\
    \ hand-tracing can give you an insight that you would not get if you simply ran\
    \ the code. Consider again what happens in each iteration:\n\n+   * We extract\
    \ the last digit of n.\n+   * We add that digit to sum.\n+   * We strip the digit\
    \ off n.\n\nHand-tracing can help you understand how an unfamiliar algorithm works.\n\
    \nHand-tracing can show errors in code or pseudocode.\n\nIn other words, the loop\
    \ forms the sum of the digits in n. You now know what the loop does for any value\
    \ of n, not just the one in the example. (Why would anyone want to form the sum\
    \ of the digits?) Operations of this kind are useful for checking the validity\
    \ of credit card numbers and other forms of ID numbers—see Exercise P4.5.)\n\n\
    Hand-tracing does not just help you understand code that works correctly. It is\
    \ a powerful technique for finding errors in your code. When a program behaves\
    \ in a way that you don't expect, get out a sheet of paper and track the values\
    \ of the variables as you mentally step through the code.\n\nYou don't need a\
    \ working program to do hand-tracing. You can hand-trace pseudocode. In fact,\
    \ it is an excellent idea to hand-trace your pseudocode before you go to the trouble\
    \ of translating it into actual code, to confirm that it works correctly.\n\n\
    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_168_0.png)\n\n6. Hand-trace the following\
    \ code, showing the value of n and the output.\n\n```\n~~~cpp\nint n = 5;\nwhile\
    \ (n >= 0)\n{\n    n--;\n    cout << n << endl;\n}\n~~~\n```"
