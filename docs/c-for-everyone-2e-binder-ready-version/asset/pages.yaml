- pgno: 232
  md: "In our case, the parameters are the pyramid’s height and base length. At this\
    \ point, we have enough information to document the function:\n\n```\n```\n/**\n\
    \   Computes the volume of a pyramid whose base is a square.\n   @param height\
    \ the height of the pyramid\n   @param base_length the length of one side of the\
    \ pyramid's base\n   @return the volume of the pyramid\n*/\n```\n```\n\n# Step\
    \ 3 Determine the types of the parameter variables and the return value.\n\nThe\
    \ height and base length can both be floating-point numbers. Therefore, we will\
    \ choose the type double for both parameter variables. The computed volume is\
    \ also a floating-point number, yielding a return type of double. Therefore, the\
    \ function will be defined as\n\n```\n```\ndouble pyramid_volume(double height,\
    \ double base_length)\n```\n```\n\n# Step 4 Write pseudocode for obtaining the\
    \ desired result.\n\nIn most cases, a function needs to carry out several steps\
    \ to find the desired answer. You may need to use mathematical formulas, branches,\
    \ or loops. Express your function in pseudocode. An Internet search yields the\
    \ fact that the volume of a pyramid is computed as\n\n```\n```\nvolume = 1/3 x\
    \ height x base area\n```\n```\n\nSince the base is a square, we have\n\n```\n\
    ```\nbase area = base length x base length\n```\n```\n\nUsing these two equations,\
    \ we can compute the volume from the parameter variables.\n\n# Step 5 Implement\
    \ the function body.\n\nIn our example, the function body is quite simple. Note\
    \ the use of the return statement to return the result.\n\n```\n```\n{\n   double\
    \ base_area = base_length * base_length;\n   return height * base_area / 3;\n\
    }\n```\n```\n\n# Step 6 Test your function.\n\nAfter implementing a function,\
    \ you should test it in isolation. Such a test is called a unit test. Work out\
    \ test cases by hand, and make sure that the function produces the correct results.\
    \ For example, for a pyramid with height 9 and base length 10, we expect the area\
    \ to be 1/3 × 9 × 100 = 300. If the height is 0, we expect an area of 0.\n\n```\n\
    ```\nint main()\n{\n   cout << \"Volume: \" << pyramid_volume(9, 10) << endl;\n\
    \   cout << \"Expected: 300\" << endl;\n   cout << \"Volume: \" << pyramid_volume(0,\
    \ 10) << endl;\n   cout << \"Expected: 0\" << endl;\n   return 0;\n}\n```\n```\n\
    \nThe output confirms that the function worked as expected:\n\n```\n```\nVolume:\
    \ 300\nExpected: 300\nVolume: 0\nExpected: 0\n```\n```"
  merge: -1
  img_proc: true
