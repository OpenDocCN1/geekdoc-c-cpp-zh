  md: "*Like the manufacturer of a stretch limo, who starts with a regular car and\
    \ modifies it, a programmer makes a derived class by modifying another class.*\n\
    \n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_474_0.png)\n\nThe `:` symbol denotes\
    \ inheritance. The reserved word `public` is required for a technical reason (see\
    \ Common Error 10.1 on page 449).\n\nA `ChoiceQuestion` object differs from a\
    \ `Question` object in three ways:\n\n+   - Its objects store the various choices\
    \ for the answer.\n+   - There is a member function for adding another choice.\n\
    +   - The display function of the `ChoiceQuestion` class shows these choices so\
    \ that the respondent can choose one of them.\n\nWhen the `ChoiceQuestion` class\
    \ inherits from the `Question` class, it needs only to spell out these three differences:\n\
    \n```\n```cpp\nclass ChoiceQuestion : public Question\n{\npublic:\n   ChoiceQuestion();\n\
    \   void add_choice(string choice, bool correct);\n   void display() const;\n\
    private:\n   vector<string> choices;\n};\n```\n```\n\nA derived class can override\
    \ a base-class function by providing a new implementation.\n\nFigure 4 shows the\
    \ layout of a `ChoiceQuestion` object. It inherits the text and answer data members\
    \ from the `Question` base object, and it adds an additional data member: the\
    \ `choices` vector.\n\nThe `add_choice` function is specific to the `ChoiceQuestion`\
    \ class. You can only apply it to `ChoiceQuestion` objects, not general `Question`\
    \ objects. However, the `display` function is a redefinition of a function that\
    \ exists in the base class, to take into account the special needs of the derived\
    \ class. We say that the derived class *overrides* this function. You will see\
    \ how in Section 10.3.\n\nThe derived class inherits all data members and all\
    \ functions that it does not override.\n\nIn the `ChoiceQuestion` class definition\
    \ you specify only new member functions and data members. All other member functions\
    \ and data members of the `Question` class are automatically inherited by the\
    \ `Question` class. For example, each `ChoiceQuestion` object still has text and\
    \ answer data members, and `set_text`, `set_answer`, and `check_answer` member\
    \ functions.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_474_1.png)"
