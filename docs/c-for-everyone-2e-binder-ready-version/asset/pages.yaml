- pgno: 33
  md: '# 1.3 Machine Code and Programming Languages


    On the most basic level, computer instructions are extremely primitive. The processor
    executes *machine instructions*. A typical sequence of machine instructions is


    +   1. Move the contents of memory location 40000 into the CPU.

    +   2. If that value is > 100, continue with the instruction that is stored in
    memory location 11280.


    Computer programs are stored as machine instructions in a code that depends on
    the processor type.


    Actually, machine instructions are encoded as numbers so that they can be stored
    in memory. On a Pentium processor, this sequence of instruction is encoded as
    the sequence of numbers


    161 40000 45 100 127 11280


    On a processor from a different manufacturer, the encoding would be different.
    When this kind of processor fetches this sequence of numbers, it decodes them
    and executes the associated sequence of commands.


    How can we communicate the command sequence to the computer? The simplest method
    is to place the actual numbers into the computer memory. This is, in fact, how
    the very earliest computers worked. However, a long program is composed of thousands
    of individual commands, and it is a tedious and error-prone affair to look up
    the numeric codes for all commands and place the codes manually into memory. As
    already mentioned, computers are really good at automating tedious and error-prone
    activities. It did not take long for computer scientists to realize that the computers
    themselves could be harnessed to help in the programming process.


    Computer scientists devised *high level programming languages* that allow programmers
    to describe tasks, using a syntax that is more closely related to the problems
    to be solved. In this book, we will use the C++ programming language, which was
    developed by Bjarne Stroustrup in the 1980s.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_33_0.png)


    C++ is a general-purpose language that is in widespread use for systems and embedded
    programming.


    Over the years, C++ has grown by the addition of many features. A standardization
    process culminated in the publication of the international C++ standard in 1998.
    A minor update to the standard was issued in 2003, and a major revision is expected
    to come to fruition around 2011. At this time, C++ is the most commonly used language
    for developing system software such as databases and operating systems. Just as
    importantly, C++ is increasingly used for programming “embedded systems,” small
    computers that control devices such as automobile engines or cellular telephones.


    Here is a typical statement in C++:


    ```

    if (int_rate > 100) { cout << "Interest rate error"; }

    ```


    High-level programming languages are independent of the processor.


    This means, “If the interest rate is over 100, display an error message.” A special
    computer program, a compiler, translates this high-level description into machine
    instructions for a particular processor.


    High-level languages are independent of the underlying hardware. C++ instructions
    work equally well on an Intel Pentium and a processor in a cell phone. Of course,
    the compiler-generated machine instructions are different, but the programmer
    who uses the compiler need not worry about these differences.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# ### SELF CHECK


    +   6. Is the compiler a part of the computer hardware or software?

    +   7. Does a person who uses a computer for office work ever run a compiler?

    +   8. What are the most important uses for C++?


    # ### Practice It


    Now you can try these exercises at the end of the chapter: R1.5.


    # ### Random Fact 1.2 Standards Organizations


    Two standards organizations, the American National Standards Institute (ANSI)
    and the International Organization for Standardization (ISO), have jointly developed
    the definitive standard for the C++ language.


    Why have standards? You encounter the benefits of standardization every day. When
    you buy a light bulb, you can be assured that it fits in the socket without having
    to measure the socket at home and the bulb in the store. In fact, you may have
    experienced how painful the lack of standards can be if you have ever purchased
    a flashlight with nonstandard bulbs. Replacement bulbs for such a flashlight can
    be difficult and expensive to obtain.


    The ANSI and ISO standards organizations are associations of industry professionals
    who develop standards for everything from car tires and credit card shapes to
    programming languages. Having a standard for a programming language such as C++
    means that you can take a program that you developed on one system with one manufacturer''s
    compiler to a different system and be assured that it will continue to work.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_34_0.png)


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_34_1.png)


    # # 1.4 Becoming Familiar with Your Programming Environment


    Set aside some time to become familiar with the programming environment that you
    will use for your class work.


    Many students find that the tools they need as programmers are very different
    from the software with which they are familiar. You should spend some time making
    yourself familiar with the programming environment. Because computer systems vary
    widely, this book can only give an outline of the steps you need to follow. It
    is a good idea to participate in a hands-on lab, or to ask a knowledgeable friend
    to give you a tour.


    **Step 1** Start the C++ development environment.


    Computer systems differ greatly in this regard. On many computers there is an
    **integrated development environment** in which you can write and test your programs.
    On other computers you first launch an *editor*, a program that functions like
    a word processor, in which you can enter your C++ instructions; then open a console
    window and type commands to execute your program. You need to find out how to
    get started with your environment.


    **Step 2** Write a simple program.


    The traditional choice for the very first program in a new programming language
    is a program that displays a simple greeting: "Hello, World!". Let us follow that
    tradition. Here is the "Hello, World!" program in C++:'
  merge: -1
  img_proc: true
