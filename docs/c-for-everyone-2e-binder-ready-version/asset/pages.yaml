    # ### Programming Tip 6.1


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_282_0.png)


    # ## Use Arrays for Sequences of Related Values


    Arrays are intended for storing sequences of values with the same meaning. For
    example, an array of test scores makes perfect sense:


    ```

    ```c

    int scores[NUMBER_OF_SCORES];

    ```

    ```


    But an array


    ```

    ```c

    double personal_data[3];

    ```

    ```


    that holds a person''s age, bank balance, and shoe size in positions 0, 1, and
    2 is bad design. It would be tedious for the programmer to remember which of these
    data values is stored in which array location. In this situation, it is far better
    to use three separate variables.


    # ## Random Fact 6.1 An Early Internet Worm


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_282_1.png)


    In November 1988, Robert Morris, a student at Cornell University, launched a so-called
    virus program that infected about 6,000 computers connected to the Internet across
    the United States. Tens of thousands of computer users were unable to read their
    e-mail or otherwise use their computers. All major universities and many high-tech
    companies were affected. (The Internet was much smaller than it is now.)


    The particular kind of virus used in this attack is called a worm. The virus program
    crawled from one computer on the Internet to the next. The worm would attempt
    to connect to finger, a program in the UNIX operating system for finding information
    on a user who has an account on a particular computer on the network. Like many
    programs in UNIX, finger was written in the C language. In C, as in C++, arrays
    have a fixed size. To store the user name to be looked up (say, walter@cs.sjsu.edu),
    the finger program allocated an array of 512 characters, under the assumption
    that nobody would ever provide such a long input. Unfortunately, C, like C++,
    does not check that an array index is less than the length of the array. If you
    write into an array using an index that is too large, you simply overwrite memory
    locations that belong to some other objects. In some versions of the finger


    program, the programmer had been lazy and had not checked whether the array holding
    the input characters was large enough to hold the input. So the worm program purposefully
    filled the 512-character array with 536 bytes. The excess 24 bytes would overwrite
    a return address, which the attacker knew was stored just after the line buffer.
    When that function was finished, it didn''t return to its caller but to code supplied
    by the worm (see Figure 4). That code ran under the same super-user privileges
    as finger, allowing the worm to gain entry into the remote system. Had the programmer
    who wrote finger been more conscientious, this particular attack would not be
    possible. In C++, as in C, all programmers must be very careful not to overrun
    array boundaries.


    One may well speculate about what possessed the virus author to spend many weeks
    to plan the antisocial act of breaking into thousands of computers and disabling
    them. It appears that the break-in was fully intended by the author, but the disabling
    of the computers was a bug, caused by continuous reinfection. Morris was sentenced
    to 3 years probation, 400 hours of community service, and fined $10,000.


    In recent years, computer attacks have intensified and the motives have become
    more sinister. Instead of disabling computers, viruses often steal financial data
    or use the attacked computers for sending spam e-mail. Sadly, many of these attacks
    continue to be possible because of poorly written programs that are susceptible
    to buffer overrun errors.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_282_2.png)


    Figure 4

    A “Buffer Overrun” Attack'
