  md: "# ### Programming Tip 1.1\n\n# ### Backup Copies\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_38_0.png)\n\
    \nBacking up files on a memory stick is an easy and convenient storage method\
    \ for many people. Another increasingly popular form of backup is Internet file\
    \ storage. Here are a few pointers to keep in mind.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_38_1.png)\n\
    \n+   - **Back up often.** Backing up a file takes only a few seconds, and you\
    \ will hate yourself if you have to spend many hours recreating work that you\
    \ could have saved easily. I recommend that you back up your work once every thirty\
    \ minutes.\n+   - **Rotate backups.** Use more than one directory for backups,\
    \ and rotate them. That is, first back up onto the first directory. Then back\
    \ up onto the second directory. Then use the third, and then go back to the first.\
    \ That way you always have three recent backups. If your recent changes made matters\
    \ worse, you can then go back to the older version.\n+   - **Pay attention to\
    \ the backup direction.** Backing up involves copying files from one place to\
    \ another. It is important that you do this right—that is, copy from your work\
    \ location to the backup location. If you do it the wrong way, you will overwrite\
    \ a newer file with an older version.\n+   - **Check your backups once in a while.**\
    \ Double-check that your backups are where you think they are. There is nothing\
    \ more frustrating than to find out that the backups are not there when you need\
    \ them.\n+   - **Relax, then restore.** When you lose a file and need to restore\
    \ it from backup, you are likely to be in an unhappy, nervous state. Take a deep\
    \ breath and think through the recovery process before you start. It is not uncommon\
    \ for an agitated computer user to wipe out the last backup when trying to restore\
    \ a damaged file.\n\n# # 1.5 Analyzing Your First Program\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_38_2.png)\n\
    \nIn this section, we will analyze the first C++ program in detail. Here again\
    \ is the source code:\n\n**ch01/hello.cpp**\n\n```\n    #include <iostream>\n\n\
    \    using namespace std;\n\n    int main()\n    {\n        cout << \"Hello, World!\"\
    \ << endl;\n        return 0;\n    }\n```\n\nThe first line,\n\n`#include <iostream>`\n\
    \ntells the compiler to include a service for “stream input/output”. You will\
    \ learn in Chapter 8 what a stream is. For now, you should simply remember to\
    \ add this line into all programs that perform input or output."
