  md: "The preceding section showed you how to decompose **Compute the final score**\
    \ into fundamental algorithms:\n\n**Find the position of the minimum.**\n**Remove\
    \ it from the array.**\n**Calculate the sum.**\n\n# **Step 2** Determine functions,\
    \ arguments, and return values for each step.\n\nEven though it may be possible\
    \ to put all steps into the `main` function, this is rarely a good idea. The simplest\
    \ and best approach is to make each nontrivial step into a separate function.\
    \ In our example, we will implement four functions:\n\n+   - `read_inputs`\n+\
    \   - `min_position`\n+   - `remove`\n+   - `sum`\n+   - `final_score`\n\nFor\
