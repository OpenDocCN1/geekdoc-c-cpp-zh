  md: '**P7.16** Modify Exercise P7.13 so that you first print the lines in the order
    that they were entered, then print them in sorted order. When you sort the lines,
    only rearrange the pointers in the `lines` array.


    **P7.17** When you read a long document, there is a good chance that many words
    occur multiple times. Instead of storing each word, it may be beneficial to only
    store unique words, and to represent the document as a vector of pointers to the
    unique words. Write a program that implements this strategy. Read a word at a
    time from `cin`. Keep a `vector<char*>` of words. If the new word is not contained
    in this vector, allocate memory, copy the word into it, and append a pointer to
    the new memory. If the word is already present, then append a pointer to the existing
    word.


    **P7.18** Define a structure `Student` with a `name` and a `vector<Course*>` of
    `courses`. Define a structure `Course` with a `name` and a `vector<Student*>`
    of enrolled students. Define a function `void print_student(Student* s)` that
    prints the name of a student and the names of all courses that the student takes.
    Define a function `void print_course(Course* c)` that prints the name of a course
    and the names of all students in that course. Define a function `void enroll(Student*
    s, Course* c)` that enrolls the given student in the given course, updating both
    vectors. In your `main` function, define several students and courses, and enroll
    students in the courses. Then call `print_student` for all students and `print_course`
    for all courses.


    **Engineering P7.19** Write a program that simulates a device that gathers measurements
    and processes them.


    A gather function gathers data values (which you should simulate with random integers
    between 0 and 100) and places them in an array. When the array is full, the gather
    function calls a function `new_array` to request a new array to fill.


    A process function processes a data value (for this exercise, it simply updates
    global variables for computing the maximum, minimum, and average). When it has
    reached the end of the array, it calls a function `next_array` to request a new
    array to process.


    Because the gather function may fill arrays faster than the process function processes
    them, store the pointers to the filled arrays in another array. The `new_array`
    and `next_array` functions need to maintain that array of pointers.


    In a real device, data gathering and processing happen in parallel. Simulate this
    by calling the gather and process functions randomly from `main`.


    **Engineering P7.20** Write a program that simulates the control software for
    a “people mover” system, a set of driverless trains that move in two concentric
    circular tracks. A set of switches allows trains to switch tracks.


