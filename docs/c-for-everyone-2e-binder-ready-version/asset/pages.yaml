    +   - Relational operators (`<`, `<=`, `>`, `>=`, `==`, `!=`) are used to compare
    numbers and strings.

    +   - Lexicographic order is used to compare strings.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_140_2.png)


    # ## Implement complex decisions that require multiple `if` statements.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_140_3.png)


    +   - Multiple alternatives are required for decisions that have more than two
    cases.

    +   - When using multiple `if` statements, pay attention to the order of the conditions.


    are necessary to actually understand the sentences. For example, consider the
    sentence “Last fall she enrolled in Michigan State”. The reader automatically
    realizes that “fall” is not related to falling down in this context, but refers
    to the season. While there is a state of Michigan, here Michigan State denotes
    the university. A priori, a computer program has none of this knowledge. The goal
    of the CYC project is to extract and store the requisite facts—that is, (1) people
    enroll in universities; (2) Michigan is a state; (3) many states have universities
    named X State University, often abbreviated as X State; (4) most people enroll
    in a university in the fall. By 1995, the project had codified about 100,000 common-sense
    concepts and about a million facts of knowledge relating them. Even this massive
    amount of data has not proven sufficient for useful applications.


