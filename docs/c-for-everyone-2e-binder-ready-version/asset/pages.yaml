  md: "# ### Programming Tip 7.2\n\n# ## Program Clearly, Not Cleverly\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_346_0.png)\n\
    \nSome programmers take great pride in minimizing the number of instructions,\
    \ even if the resulting code is hard to understand. For example, here is a legal\
    \ implementation of the sum function:\n\n```\n    double sum(double* a, int size)\n\
    \    {\n        double total = 0;\n        while (size-- > 0) // Loop size times\n\
    \        {\n            total = total + *a++; // Add the value to which a points;\
    \ increment a\n        }\n        return total;\n    }\n```\n\nThis implementation\
    \ uses two tricks. First, the function parameter variables a and size are variables,\
    \ and it is legal to modify them. Moreover, the expressions size-- and a++ mean\
    \ “decrement or increment the variable and return the old value”. In other words,\
    \ the expression\n\n```\n    size-- > 0\n```\n\ncombines two tasks: to decrement\
    \ size, and to test whether size was positive before the decrement. Similarly,\
    \ the expression\n\n```\n    *a++\n```\n\nincrements the pointer to the next element,\
    \ and it returns the element to which it pointed before the increment.\n\nPlease\
    \ do not use this programming style. Your job as a programmer is not to dazzle\
    \ other programmers with your cleverness, but to write code that is easy to understand\
    \ and maintain.\n\n# ### Common Error 7.2\n\n# ## Returning a Pointer to a Local\
    \ Variable\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_346_1.png)\n\nConsider\
    \ this function that tries to return a pointer to an array containing two elements,\
    \ the first and the last values of an array:\n\n```\n    double* firstLast(double\
    \ a[], int size)\n    {\n        double result[2];\n        result[0] = a[0];\n\
    \        result[1] = a[size - 1];\n        return result; // Error!\n    }\n```\n\
    \nThe function returns a pointer to the starting element of the result array.\
    \ However, that array is a local variable of the firstLast function. The local\
    \ variable no longer exists when the function exits. Its contents will soon be\
    \ overwritten by other function calls.\n\nYou can solve this problem by passing\
    \ an array to hold the answer:\n\n```\n    void firstLast(const double a[], int\
    \ size, double[] result)\n    {\n        result[0] = a[0];\n        result[1]\
    \ = a[size - 1];\n    }\n```\n\nThen it is the responsibility of the caller to\
    \ allocate an array to hold the result."
