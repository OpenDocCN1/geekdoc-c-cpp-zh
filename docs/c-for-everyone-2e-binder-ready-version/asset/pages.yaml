    \ std;\nint main()\n{\n    cout << Goodbye, World! << endl;\n    return 0;\n}\n\
    ```\n```\n\n14. What does the following sequence of statements print?\n\n```\n\
    ```cpp\ncout << \"Hello\";\ncout << \"World\";\n```\n```"
