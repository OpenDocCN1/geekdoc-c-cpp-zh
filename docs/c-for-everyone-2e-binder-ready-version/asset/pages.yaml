    # ### 7.3.4 Converting Between C and C++ Strings


    Many library functions use pointers of type char*.


    Before the C++ string class became widely available, direct manipulation of character
    arrays was common, but also quite challenging (see Special Topic 7.4 on page 323).
    If you use functions that receive or return C strings, you need to know how to
    convert between C strings and string objects.


    For example, the `<cstdlib>` header declares a useful function


    ```

    ~~~

    int atoi(const char s[])

    ~~~

    ```


    The c_str member function yields a char* pointer from a string object.


    The atoi function converts a character array containing digits into its integer
    value:


    ```

    ~~~

    char[] year = "2012";

    int y = atoi(year); // Now y is the integer 2012

    ~~~

    ```


    This functionality is inexplicably missing from the C++ string class. The c_str
    member function of the string class offers an “escape hatch”. If s is a string,
    then s.c_str() yields a char* pointer to the characters in the string. Here is
    how you use that member function to call the atoi function:


    You can initialize C++ string variables with C strings.


    ```

    ~~~

    string year = "2012";

    int y = atoi(year.c_str());

    ~~~

    ```


    Conversely, converting from a C string to a C++ string is very easy. Simply initialize
    a string variable with any value of type char*, such as a string literal or character
    array. For example, the definition


    ```

    ~~~

    string name = "Harry";

    ~~~

    ```


    initializes the C++ string object name with the C string "Harry".


    # ### 7.3.5 C++ Strings and the [] Operator


    Up to this point, we have always used the substr member function to access individual
    characters in a C++ string. For example, if a string variable is defined as


    ```

    ~~~

    string name = "Harry";

    ~~~

    ```


    You can access individual characters in a C++ string object with the [] operator.


    the expression


    ```

    ~~~

    name.substr(3, 1)

    ~~~

    ```


    yields a string of length 1 containing the character at index 3.


    You can access individual characters with the [] operator:


    ```

    ~~~

    name[0] = ''L'';

    ~~~

    ```


    Now the string is "Larry". The [] operator is more convenient than the substr
    function if you want to visit a string one character at a time.


    Here is a useful example. The following function makes a copy of a string and
    changes all characters to uppercase:'
