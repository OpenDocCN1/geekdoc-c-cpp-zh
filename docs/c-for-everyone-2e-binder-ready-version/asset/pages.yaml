  md: "![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_103_0.png)\n\nOne of the essential\
    \ features of computer programs is their ability to make decisions. Like a train\
    \ that changes tracks depending on how the switches are set, a program can take\
    \ different actions, depending on inputs and other circumstances.\n\nIn this chapter,\
    \ you will learn how to program simple and complex decisions. You will apply what\
    \ you learn to the task of checking user input.\n\n# ## 3.1 The if Statement\n\
    \n> > The if statement allows a program to carry out different actions depending\
    \ on the nature of the data to be processed.\n\nThe if statement is used to implement\
    \ a decision. When a condition is fulfilled, one set of statements is executed.\
    \ Otherwise, another set of statements is executed (see Syntax 3.1).\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_103_1.png)\n\
    \nHere is an example using the if statement. In many countries, the number 13\
    \ is considered unlucky. Rather than offending superstitious tenants, building\
    \ owners sometimes skip the thirteenth floor; floor 12 is immediately followed\
    \ by floor 14. Of course, floor 13 is not usually left empty or, as some conspiracy\
    \ theorists believe, filled with secret offices and research labs. It is simply\
    \ called floor 14. The computer that controls the building elevators needs to\
    \ compensate for this foible and adjust all floor numbers above 13.\n\nLet’s simulate\
    \ this process in C++. We will ask the user to type in the desired floor number\
    \ and then compute the actual floor. When the input is above 13, then we need\
    \ to decrement the input to obtain the actual floor. For example, if the user\
    \ provides an input of 20, the program determines the actual floor as 19. Otherwise,\
    \ we simply use the supplied floor number.\n\nThis elevator panel “skips” the\
    \ thirteenth floor. The floor is not actually missing—the computer that controls\
    \ the elevator adjusts the floor numbers above 13.\n\n```\n    int actual_floor;\n\
    \n    if (floor > 13)\n    {\n        actual_floor = floor - 1;\n    }\n    else\n\
    \    {\n        actual_floor = floor;\n    }\n```\n\nThe flowchart in Figure 1\
    \ shows the branching behavior.\n\nIn our example, each branch of the if statement\
    \ contains a single statement. You can include as many statements in each branch\
    \ as you like. Sometimes, it happens that"
  merge: -1
  img_proc: true
