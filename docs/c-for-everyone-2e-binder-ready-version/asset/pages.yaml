  md: "+   20. Consider the following function that computes compound interest for\
    \ an account with an initial balance of $10,000 and an interest rate of 5 percent:\n\
    \n```\ndouble balance(int years) { return 10000 * pow(1.05, years); }\n```\n\n\
    How can you make this function more reusable?\n\n+   21. The comment explains\
    \ what the following loop does. Use a function instead.\n\n```\n// Counts the\
    \ number of spaces\nint spaces = 0;\nfor (int i = 0; i < input.length(); i++)\n\
    {\n    if (input.substr(i, 1) == \" \") { spaces++; }\n}\n```\n\n+   22. In Self\
    \ Check 21, you were asked to implement a function that counts spaces. How can\
    \ you generalize it so that it can count any character? Why would you want to\
    \ do this?\n\n**Practice It** Now you can try these exercises at the end of the\
    \ chapter: R5.7, P5.23.\n\n# ## 5.7 Problem Solving: Stepwise Refinement\n\n>\
    \ > Use the process of stepwise refinement to decompose complex tasks into simpler\
    \ ones.\n\nOne of the most powerful strategies for problem solving is the process\
    \ of **stepwise refinement**. To solve a difficult task, break it down into simpler\
    \ tasks. Then keep breaking down the simpler tasks into even simpler ones, until\
    \ you are left with tasks that you know how to solve.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_237_0.png)\n\
    \n*A production process is broken down into sequences of assembly steps.*\n\n\
    Here is an application of this process to a problem of everyday life. You get\
    \ up in the morning and simply must **get coffee**. How do you get coffee? You\
    \ see whether you can get someone else, such as your mother or mate, to bring\
    \ you some. If that fails, you must **make coffee**. How do you make coffee? If\
    \ there is instant coffee available, you can **make instant coffee**. How do you\
    \ make instant coffee? Simply **boil water** and mix the boiling water with the\
    \ instant coffee. How do you boil water? If there is a microwave, then you fill\
    \ a cup with water, place it in the microwave and heat it for three minutes. Otherwise,\
    \ you fill a kettle with water and heat it on the stove until the water comes\
    \ to a boil. On the other hand, if you don't have instant coffee, you must **brew\
    \ coffee**. How do you brew coffee? You add water to the coffee maker, put in\
    \ a filter, **grind coffee**, put the coffee in the filter, and turn the coffee\
    \ maker on. How do you grind coffee? You add coffee beans to the coffee grinder\
    \ and push the button for 60 seconds.\n\nFigure 5 shows a flowchart view of the\
    \ coffee-making solution. Refinements are shown as expanding boxes. In C++, you\
    \ implement a refinement as a function. For example, a function `brew_coffee`\
    \ would call `grind_coffee`, and it would be called from a function `make_coffee`.\n\
    \nLet us apply the process of stepwise refinement to a programming problem."
