  md: '**Table 1** Relational Operators


    | C++ | Math Notation | Description |

    |---|---|---|

    | > | > | Greater than |

    | >= | ≥ | Greater than or equal |

    | < | < | Less than |

    | <= | ≤ | Less than or equal |

    | == | = | Equal |

    | != | ≠ | Not equal |


    The `==` operator denotes equality testing:


    ```

    ```cpp

    floor = 13; // Assign 13 to floor

    if (floor == 13) // Test whether floor equals 13

    ```

    ```


    You must remember to use `==` inside tests and to use `=` outside tests. (See
    Common Error 3.2 on page 85 for more information.)


    You can compare strings as well:


    ```

    ```cpp

    if (input == "Quit") ...

    ```

    ```


    Use `!=` to check whether two strings are different. In C++, letter case matters.
    For example, "Quit" and "quit" are not the same string.


