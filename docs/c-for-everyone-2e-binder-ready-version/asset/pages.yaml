    \ Averages\nEnter scores: 90 80 90 100 80\nThe average is 88\nEnter scores: 100\
    \ 70 70 100 80\nThe average is 88\nEnter scores: -1            -1 is used as a\
    \ sentinel to exit the program\n[Program exits!]\n~~~\n```\n\n30. Produce a storyboard\
    \ for a program that compares the growth of a $10,000 investment for a given number\
    \ of years under two interest rates.\n\n**Practice It** Now you can try these\
    \ exercises at the end of the chapter: R4.17, R4.18, R4.19.\n\n# # 4.7 Common\
    \ Loop Algorithms\n\nIn the following sections, we discuss some of the most common\
    \ algorithms that are implemented as loops. You can use them as starting points\
    \ for your loop designs.\n\n# ## 4.7.1 Sum and Average Value\n\nComputing the\
    \ sum of a number of inputs is a very common task. Keep a *running total*: a variable\
    \ to which you add each input value. Of course, the total should be initialized\
    \ with 0.\n\n```\n~~~cpp\ndouble total = 0;\ndouble input;\nwhile (cin >> input)\n\
    {\n    total = total + input;\n}\n~~~\n```"
