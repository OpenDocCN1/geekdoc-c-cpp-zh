- pgno: 165
  md: 'Should year start at 0 or at 1? Should you test for balance < TARGET or for
    balance <= TARGET? It is easy to be off by one in these expressions.


    Some people try to solve off-by-one errors by randomly inserting +1 or -1 until
    the program seems to work—a terrible strategy. It can take a long time to compile
    and test all the various possibilities. Expending a small amount of mental effort
    is a real time saver.


    > > An off-by-one error is a common error when programming loops. Think through
    simple test cases to avoid this type of error.


    Fortunately, off-by-one errors are easy to avoid, simply by working through a
    couple of test cases and using the information from the test cases to come up
    with rational for your decisions.


    Should year start at 0 or at 1? Look at a scenario with simple values: an initial
    balance of $100 and an interest rate of 50 percent. After year 1, the balance
    is $150, and after year 2 it is $225, or over $200. So the investment doubled
    after 2 years. The loop executed two times, incrementing year each time. Hence
    year must start at 0, not at 1.


    | year | balance |

    | --- | --- |

    | 0 | $100 |

    | 1 | $150 |

    | 2 | $225 |


    In other words, the balance variable denotes the balance after the end of the
    year. At the outset, the balance variable contains the balance after year 0 and
    not after year 1.


    Next, should you use a < or <= comparison in the test? If you want to settle this
    question with an example, you need to find a scenario in which the final balance
    is exactly twice the initial balance. This happens when the interest is 100 percent.
    The loop executes once. Now year is 1, and balance is exactly equal to 2 * INITIAL_BALANCE.
    Has the investment doubled after one year? It has. Therefore, the loop should
    not execute again. If the test condition is balance < TARGET, the loop stops,
    as it should. If the test condition had been balance <= TARGET, the loop would
    have executed once more.


    In other words, you keep adding interest while the balance has not yet doubled.


    # # Random Fact 4.1 The First Bug


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_165_0.png)


    According to legend, the first bug was found in the Mark II, a huge electromechanical
    computer at Harvard University. It really was caused by a bug—a moth was trapped
    in a relay switch.


    Actually, from the note that the operator left in the log book next to the moth
    (see the photo), it appears as if the term “bug” had already been in active use
    at the time.


    > > The pioneering computer scientist Maurice Wilkes wrote, “Somehow, at the Moore
    School and afterwards, one had always assumed there would be no particular difficulty
    in getting programs right. I can remember the exact instant in time at which it
    dawned on me that a great part of my future life would be spent finding mistakes
    in my own programs.”


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_165_1.png)


    *The First Bug*'
