  md: "Array parameters are always reference parameters.\n\nArray parameters are *always\
    \ reference parameters*. (You will see the reason in Chapter 7.) Functions can\
    \ modify array arguments, and those modifications affect the array that was passed\
    \ into the function. For example, the following multiply function updates all\
    \ elements in the array:\n\n```\n```cpp\nvoid multiply(double values[], int size,\
    \ double factor)\n{\n    for (int i = 0; i < size; i++)\n    {\n        values[i]\
    \ = values[i] * factor;\n    }\n}\n```\n```\n\nYou do *not* use an & symbol to\
    \ denote the reference parameter in this case.\n\nAlthough arrays can be function\
    \ arguments, they cannot be function return types. If a function computes multiple\
    \ values, the caller of the function must provide an array parameter variable\
    \ to hold the result.\n\nA function's return type cannot be an array.\n\n```\n\
    ```cpp\nvoid squares(int n, int result[])\n{\n    for (int i = 0; i < n; i++)\n\
    \    {\n        result[i] = i * i;\n    }\n}\n```\n```\n\nWhen a function changes\
    \ the size of an array, it should indicate to the caller how many elements the\
    \ array has after the call. The easiest way to do this is to return the new size.\
    \ Here is an example—a function that adds input values to an array:\n\nWhen a\
    \ function modifies the size of an array, it needs to tell its caller.\n\n```\n\
    ```cpp\nint read_inputs(double inputs[], int capacity)\n{\n    int current_size\
    \ = 0;\n    double input;\n    while (cin >> input)\n    {\n        if (current_size\
