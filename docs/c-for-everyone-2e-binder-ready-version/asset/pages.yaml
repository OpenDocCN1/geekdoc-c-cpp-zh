- pgno: 531
  md: '**Random access** The ability to access any value directly without having to
    read the values preceding it.


    **Recursive function** A function that can call itself with simpler values. It
    must handle the simplest values without calling itself.


    **Reference parameter** A parameter that is bound to a variable supplied in the
    call. Changes made to the parameter within the function affect the variable outside
    the function.


    **Relational operator** An operator that compares two values, yielding a Boolean
    result.


    **Reserved word** A word that has a special meaning in a programming language
    and therefore cannot be used as a name by the programmer.


    **Return value** The value returned by a function through a return statement.


    **Roundoff error** An error introduced by the fact that the computer can store
    only a finite number of digits of a floating-point number.


    **Run-time error** See **Logic error**.


    **Scope** The part of a program in which a variable is defined.


    **Selection sort** A sorting algorithm in which the smallest element is repeatedly
    found and removed until no elements remain.


    **Sentinel** A value in input that is not to be used as an actual input value
    but to signal the end of input.


    **Sequential access** Accessing values one after another without skipping over
    any of them.


    **Slicing an object** Copying an object of a derived class into a variable of
    the base class, thereby losing the derived-class data.


    **Source file** A file containing instructions in a programming language.


    **Stepwise refinement** Solving a problem by breaking it into smaller problems
    and then further decomposing those smaller problems.


    **Stream** An abstraction for a sequence of bytes from which data can be read
    or to which data can be written.


    **String** A sequence of characters.


    **Structure** A construct for aggregating items of arbitrary types into a single
    value.


    **Stub** A function with no or minimal functionality.


    **Substitution principle** The rule that states that you can use a derived-class
    object whenever a base-class object is expected.


    **Syntax** Rules that define how to form instructions in a particular programming
    language.'
