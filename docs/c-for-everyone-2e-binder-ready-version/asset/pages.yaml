    **P8.20** *Playfair cipher.* Another way of thwarting a simple letter frequency
    analysis of an encrypted text is to encrypt pairs of letters together. A simple
    scheme to do this is the Playfair cipher. You pick a keyword and remove duplicate
    letters from it. Then you fill the keyword, and the remaining letters of the alphabet,
    into a 5 × 5 square. (Since there are only 25 squares, I and J are considered
    the same letter.)


