  md: "If (part > 0)\n    Append digit_name(part) to name.\n\nThis pseudocode has\
    \ a number of important improvements over the verbal description. It shows how\
    \ to arrange the tests, starting with the comparisons against the larger numbers,\
    \ and it shows how the smaller number is subsequently processed in further if\
    \ statements.\n\nOn the other hand, this pseudocode is vague about the actual\
    \ conversion of the pieces, just referring to “name of hundreds” and the like.\
    \ Furthermore, we were vague about spaces. As it stands, the code would produce\
    \ strings with no spaces, twothousandseventyfour, for example. Compared to the\
    \ complexity of the main problem, one would hope that spaces are a minor issue.\
    \ It is best not to muddy the pseudocode with minor details.\n\nNow turn the pseudocode\
    \ into real code. The last three cases are easy, because helper functions are\
    \ already developed for them:\n\n```\n```c++\nif (part >= 20)\n{\n    name = name\
    \ + \" \" + tens_name(part);\n    part = part % 10;\n}\nelse if (part >= 10)\n\
    {\n    name = name + \" \" + teen_name(part);\n    part = 0;\n}\n\nif (part >\
    \ 0)\n{\n    name = name + \" \" + digit_name(part);\n}\n```\n```\n\nFinally,\
    \ let us tackle the case of numbers between 100 and 999. Because part < 1000,\
    \ part / 100 is a single digit, and we obtain its name by calling digit_name.\
    \ Then we add the “hundred” suffix:\n\n```\n```c++\nif (part >= 100)\n{\n    name\
    \ = digit_name(part / 100) + \" hundred\";\n    part = part % 100;\n}\n```\n```\n\
    \nNow you have seen all the important building blocks for the int_name function.\
    \ Here is the complete program:\n\n# ch05/intname.cpp\n\n```\n```c++\n1 #include\
    \ <iostream>\n2 #include <string>\n3\n4 using namespace std;\n5\n6 /**\n7    Turns\
    \ a digit into its English name.\n8    @param digit an integer between 1 and 9\n\
    9    @return the name of digit (\"one\" ... \"nine\")\n10 */\n11 string digit_name(int\
    \ digit)\n12 {\n```\n```"
