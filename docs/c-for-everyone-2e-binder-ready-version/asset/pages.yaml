  md: "**Table 1 Pointer Syntax Examples**\n\nAssume the following declarations:\n\
    \n`int m = 10; // Assumed to be at address 20300`\n`int n = 20; // Assumed to\
    \ be at address 20304`\n`int* p = &m;`\n\n| Expression | Value | Comment |\n|---|---|---|\n\
    | `p` | 20300 | The address of `m`. |\n| `*p` | 10 | The value stored at that\
    \ address. |\n| `&n` | 20304 | The address of `n`. |\n| `p = &n;` |  | Set `p`\
    \ to the address of `n`. |\n| `*p` | 20 | The value stored at the changed address.\
    \ |\n| `m = *p;` |  | Stores 20 into `m`. |\n| ❌ `m = p;` | **Error** | `m` is\
    \ an int value; `p` is an `int*` pointer. The types are not compatible. |\n| ❌\
    \ `&10` | **Error** | You can only take the address of a variable. |\n| ❌ `&p`\
    \ | The address of `p`, perhaps 20308 | This is the location of a pointer variable,\
    \ not the location of an integer. |\n| ❌ `double x = 0;<br>p = &x;` | **Error**\
    \ | `p` has type `int*`, `&x` has type `double*`. These types are incompatible.\
    \ |\n\n# 7.1.3 Initializing Pointers\n\nWith pointers, it is particularly important\
    \ that you pay attention to proper initialization.\n\nWhen you initialize a pointer,\
    \ be sure that the pointer and the memory address have the same type. For example,\
    \ the following initialization would be an error:\n\n```\nint balance = 1000;\n\
    double* account_pointer = &balance; // Error!\n```\n\nThe address `&balance` is\
    \ a pointer to an int value, that is, an expression of type `int*`. It is never\
    \ legal to initialize a `double*` pointer with an `int*`.\n\nIt is an error to\
    \ use an uninitialized pointer.\n\nIf you define a pointer variable without providing\
    \ an initial variable, the pointer contains a random address. Using that random\
    \ address is an error. In practice, your program will likely crash or mysteriously\
    \ misbehave if you use an uninitialized pointer:\n\n```\ndouble* account_pointer;\n\
    \    // Forgot to initialize\n*account_pointer = 1000;\n    // NO! account_pointer\
    \ contains an unpredictable value\n```"
