  md: '# ### Random Fact 8.2 Databases and Privacy


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_404_0.png)


    Most companies use computers to keep huge data files of customer records and other
    business information. Databases not only lower the cost of doing business; they
    improve the quality of service that companies can offer. Nowadays it is almost
    unimaginable how time-consuming it used to be to withdraw money from a bank branch
    or to make travel reservations.


    Today most databases are organized according to the relational model. Suppose
    a company stores your orders and payments. They will probably not repeat your
    name and address on every order; that would take unnecessary space. Instead, they
    will keep one file of all their customer names and identify each customer by a
    unique customer number. Only that customer number, not the entire customer information,
    is kept with an order record.


    To print an invoice, the database program must issue a query against both the
    customer and order files and pull the necessary information (name, address, articles
    ordered) from both. Frequently, queries involve more than two files. For example,
    the company may have a file of addresses of car owners and a file of people with
    good payment history and may want to find all of its customers who placed an order
    in the last month, drive an expensive car, and pay their bills, so they can send
    them another catalog. This kind of query is, of course, much faster if all customer
    files use the same key, which is why so many organizations in the United States
    try to collect the Social Security numbers of their customers.


    The Social Security Act of 1935 provided that each contributor be assigned a Social
    Security number to track contributions into the Social Security Fund. These numbers
    have a distinctive format, such as 078-05-1120. (This particular number was printed
    on sample cards that were inserted in wallets. It actually was the Social Security
    number of the secretary of a vice president at the wallet manufacturer. When thousands
    of people used it as their own, the number was voided, and the secretary received
    a new number.) The figure at right shows a Social Security card. Although they
    had not originally been intended for use as a universal identification number,
    Social Security numbers have become just that.


    Some people are very concerned about the fact that just about every organization
    wants to store their Social Security number and other personal information. There
    is the possibility that companies and the government can merge multiple databases
    and derive information about us that we may wish they did not have or that simply
    may be untrue. An insurance company may deny coverage, or charge a higher premium,
    if it finds that you have too many relatives with a certain disease. You may be
    denied a job because of an inaccurate credit or medical report, and you may not
    even know the reason. These are very disturbing developments that have had a very
    negative impact for a small but growing number of people.


    In many industrialized countries (but not currently in the United States), citizens
    have a right to control what information about themselves should be communicated
    to others and under what circumstances.


    **Customers**


    | Cust. # | Name |

    |---|---|

    | 123457 | Doe, John |


    **Orders**


    | Order # | Cust. # | Item |

    |---|---|---|

    | 35693 | 123457 | 800- Hiking Boot |

    | 34587 | 123457 | Blue Car |

    | 35694 | 123459 | Car for Every |


    *Relational Database Files*


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_404_1.png)


    *Social Security Card*


    # ## CHAPTER SUMMARY


    # ### Develop programs that read and write files.


    +   - To read or write files, you use variables of type fstream, ifstream, or
    ofstream.

    +   - When opening a file stream, you supply the name of the file stored on disk.

    +   - Read from a file stream with the same operations that you use with cin.

    +   - Write to a file stream with the same operations that you use with cout.

    +   - Always use a reference parameter for a stream.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_404_2.png)'
