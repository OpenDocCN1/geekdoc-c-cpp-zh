    # # 1.6 Errors


    Programming languages follow very strict conventions. When you talk to another
    person, and you scramble or omit a word or two, your conversation partner will
    usually still understand what you have to say. But when you make an error in a
    C++ program, the compiler will not try to guess what you meant. (This is actually
    a good thing. If the compiler were to guess wrongly, the resulting program would
    do the wrong thing—quite possibly with disastrous effects.) In this section, you
    will learn how to cope with errors in your program.


    Experiment a little with the hello.cpp program. What happens if you make a typing
    error such as


    ```

    cot << "Hello, World!" << endl;

    cot << "Hello, World!" << endl;

    cot << "Hello, World!" << endl;

    ```


    In the first case, the compiler will complain that it has no clue what you mean
    by cot. The exact wording of the error message is dependent on the compiler, but
    it might be something like “undefined symbol cot”. This is a compile-time error
    or syntax error. Something is wrong according to the language rules, and the compiler
    finds it. When the compiler finds one or more errors, it will not translate the
    program to machine code, and as a consequence there is no program to run. You
    must fix the error and compile again. It is common to go through several rounds
    of fixing compile-time errors before compilation succeeds for the first time.


    If the compiler finds an error, it will not simply stop and give up. It will try
    to report as many errors as it can find, so you can fix them all at once. Sometimes,
    however, one error throws it off track. This is likely to happen with the error
    in the second line. Since the programmer forgot the closing quote, the compiler
    will keep looking for the end of the string. In such cases, it is common for the
    compiler to emit bogus error reports for neighboring lines. You should fix only
    those error messages that make sense to you and then recompile.


    The error in the third line is of a different kind. The program will compile and
    run, but its output will be wrong. It will print


    ```

    Hello, World!

    ```


    This is a run-time error. The program is syntactically correct and does something,
    but it doesn''t do what it is supposed to do. The compiler cannot find the error,
    and it must be flushed out when the program runs, by testing it and carefully
    looking at its


    A compile-time error is a violation of the programming language rules that is
    detected by the compiler.


    A run-time error causes a program to take an action that the programmer did not
    intend.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_42_0.png)


    Programmers spend a fair amount of time fixing compile-time and run-time errors.'
