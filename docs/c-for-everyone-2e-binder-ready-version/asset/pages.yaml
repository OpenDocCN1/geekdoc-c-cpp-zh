    \ It** Now you can try these exercises at the end of the chapter: R6.15, R6.16.\n\
    \n# HOW TO 6.1 Working with Arrays\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_298_1.png)\n\
    \nWhen you process sequences of values, you usually need to use arrays. (In some\
    \ very simple situations, you can process values as you read them in, without\
    \ storing them.) This How To walks you through the necessary steps.\n\nConsider\
    \ the example problem from Section 6.4: You are given the quiz scores of a student.\
    \ You are to compute the final quiz score, which is the sum of all scores after\
    \ dropping the lowest one. For example, if the scores are\n\n8 7 8.5 9.5 7 5 10\n\
    \nthen the final score is 50.\n\n# **Step 1** Decompose your task into steps.\n\
    \nYou will usually want to break down your task into multiple steps, such as\n\
    \n+   - Reading the data into an array.\n+   - Processing the data in one or more\
    \ steps.\n+   - Displaying the results.\n\nIn our sample problem, this yields\
    \ the following pseudocode:\n\n```\n```\nRead inputs.\nCompute the final score.\n\
    Display the score.\n```\n```\n\nWhen deciding how to process the data, you should\
    \ be familiar with the array algorithms in Section 6.2. Many processing tasks\
    \ can be solved by combining or adapting one or more of these algorithms."
