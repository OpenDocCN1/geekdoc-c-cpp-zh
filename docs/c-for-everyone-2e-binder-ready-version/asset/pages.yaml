  md: "**Figure 10**\nSwapping Array Elements\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_287_0.png)\n\
    \nConsider the task of swapping the elements at positions `i` and `j` of an array\
    \ `values`. We'd like to set `values[i]` to `values[j]`. But that overwrites the\
    \ value that is currently stored in `values[i]`, so we want to save that first:\n\
    \n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_287_1.png)\n\n> > Use a temporary variable\
    \ when swapping two elements.\n\n```\n```cpp\ndouble temp = values[i];\nvalues[i]\
    \ = values[j];\n```\n```\n\nNow we can set `values[j]` to the saved value.\n\n\
    ```\n```cpp\nvalues[j] = temp;\n```\n```\n\nFigure 10 shows the process.\n\n*To\
    \ swap two elements, you need a temporary variable.*\n\n# ## 6.2.10 Reading Input\n\
