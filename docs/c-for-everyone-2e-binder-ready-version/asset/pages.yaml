    {\n   balance = 0;\n}\n\nvoid BankAccount::deposit(double amount)\n{\n   balance\
    \ = balance + amount;\n}\n\nvoid BankAccount::withdraw(double amount)\n{\n   balance\
    \ = balance - amount;\n}\n```\n```"
