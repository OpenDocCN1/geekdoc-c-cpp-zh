  md: "# Syntax 6.1 Defining an Array\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_278_0.png)\n\
    \nHere we define an array that can hold ten values:\n\n```\n    double values[10];\n\
    ```\n\nThis is the definition of a variable values whose type is “array of double”.\
    \ That is, values stores a sequence of floating-point numbers. The [10] indicates\
    \ the size of the array. (See Figure 1.) The array size must be a constant that\
    \ is known at compile time.\n\nUse an array to collect a sequence of values of\
    \ the same type.\n\nWhen you define an array, you can specify the initial values.\
    \ For example,\n\n```\n    double values[] = { 32, 54, 67.5, 29, 34.5, 80, 115,\
    \ 44.5, 100, 65 };\n```\n\nWhen you supply initial values, you don't need to specify\
    \ the array size. The compiler determines the size by counting the values.\n\n\
    # Table 1 Defining Arrays\n\n|  |  |\n|---|---|\n| `int numbers[10];` | An array\
    \ of ten integers. |\n| `const int SIZE = 10;`<br>`int numbers[SIZE];` | It is\
    \ a good idea to use a named constant for the size. |\n| ⚠️ `int size = 10;`<br>`int\
    \ numbers[size];` | **Caution:** In standard C++, the size must be a constant.\
    \ This array definition will not work with all compilers. |\n| `int squares[5]\
    \ = { 0, 1, 4, 9, 16 };` | An array of five integers, with initial values. |\n\
    | `int squares[] = { 0, 1, 4, 9, 16 };` | You can omit the array size if you supply\
    \ initial values. The size is set to the number of initial values. |\n| `int squares[5]\
    \ = { 0, 1, 4 };` | If you supply fewer initial values than the size, the remaining\
    \ values are set to 0. This array contains 0, 1, 4, 0, 0. |\n| `string names[3];`\
    \ | An array of three strings. |"
