  md: "In the same way that vehicles can differ in their method of locomotion, polymorphic\
    \ objects carry out tasks in different ways.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_486_0.png)\n\
    \n# ### 10.4.4 Polymorphism\n\n> > Polymorphism (literally, “having multiple shapes”)\
    \ describes objects that share a set of tasks and execute them in different ways.\n\
    \nThe quiz array collects a mixture of both kinds of questions. Such a collection\
    \ is called **polymorphic** (literally, “of multiple shapes”). Objects in a polymorphic\
    \ collection have some commonality but are not necessarily of the same type. Inheritance\
    \ is used to express this commonality, and virtual functions enable variations\
    \ in behavior.\n\nVirtual functions give programs a great deal of flexibility.\
    \ The question presentation loop describes only the general mechanism: “Display\
    \ the question, get a response, and check it.” Each object knows on its own how\
    \ to carry out the specific tasks: “Display the question” and “Check a response.”\n\
    \nUsing virtual functions makes programs *easily extensible*. Suppose we want\
    \ to have a new kind of question for calculations, where we are willing to accept\
    \ an approximate answer. All we need to do is define a new class `NumericQuestion`,\
    \ with its own `check_answer` function. Then we can populate the quiz array with\
    \ a mixture of plain questions, choice questions, and numeric questions. The code\
    \ that presents the questions need not be changed at all! The calls to the virtual\
    \ functions automatically select the correct member functions of the newly defined\
    \ classes.\n\nHere is the final version of the quiz program, using pointers and\
    \ virtual functions. When you run the program, you will find that the appropriate\
    \ versions of the virtual functions are called. (The files `question.cpp` and\
    \ `choicequestion.cpp` are included in your book’s companion code.)\n\n```\n**ch10/quiz3/question.h**\n\
    \n```cpp\n#ifndef QUESTION_H\n#define QUESTION_H\n\n#include <string>\n\nusing\
    \ namespace std;\n\nclass Question\n{\npublic:\n  /**\n   * Constructs a question\
    \ with empty question and answer.\n   */\n  Question();\n```\n```"
