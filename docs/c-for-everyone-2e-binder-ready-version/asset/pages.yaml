    \n# ## 4.9 Random Numbers and Simulations\n\nIn a simulation, you use the computer\
    \ to simulate an activity. You can introduce randomness by calling the random\
    \ number generator.\n\nA *simulation program* uses the computer to simulate an\
    \ activity in the real world (or an imaginary one). Simulations are commonly used\
    \ for predicting climate change, analyzing traffic, picking stocks, and many other\
    \ applications in science and business. In the following sections, you will learn\
    \ how to implement simulations that model phenomena with a degree of randomness.\n\
    \n# ### 4.9.1 Generating Random Numbers\n\nMany events in the real world are difficult\
    \ to predict with absolute precision, yet we can sometimes know the average behavior\
    \ quite well. For example, a store may know from experience that a customer arrives\
    \ every five minutes. Of course, that is an average—customers don't arrive in\
    \ five minute intervals. To accurately model customer traffic, you want to take\
    \ that random fluctuation into account. Now, how can you run such a simulation\
    \ in the computer?\n\nThe C++ library has a *random number generator*, which produces\
    \ numbers that appear to be completely random. Calling `rand()` yields a random\
    \ integer between 0 and `RAND_MAX` (which is an implementation-dependent constant,\
    \ typically, but not always, the largest valid `int` value). Call `rand()` again,\
    \ and you get a different number. The `rand` function is declared in the `<cstdlib>`\
    \ header.\n\nThe following program calls the `rand` function ten times.\n\n```\n\
    \    ch04/random.cpp\n    1 #include <iostream>\n    2 #include <cstdlib>\n  \
    \  3\n    4 using namespace std;\n```"
