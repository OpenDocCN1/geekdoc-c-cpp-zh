  md: 'If you omit the length, you get all characters from the given position to the
    end of the string. For example,


    ```

    greeting.substr(7)

    ```


    is the string "World!" (including the exclamation mark).


    Here is a simple program that puts these concepts to work. The program asks for
    your name and that of your significant other. It then prints out your initials.


    The operation first.substr(0, 1) makes a string consisting of one character, taken
    from the start of first. The program does the same for the second. Then it concatenates
    the resulting one-character strings with the string literal "&" to get a string
    of length 3, the initials string. (See Figure 4.)


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_86_0.png)


    Figure 4 Building the initials String


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_86_1.png)


    Initials are formed from the first letter of each name.


    # ch02/initials.cpp


    ```

    1  #include <iostream>

    2  #include <string>

    3

    4  using namespace std;

    5

    6  int main()

    7  {

    8      cout << "Enter your first name: ";

    9      string first;

    10     cin >> first;

    11     cout << "Enter your significant other''s first name: ";

    12     string second;

    13     cin >> second;

    14     string initials = first.substr(0, 1)

    15         + "&" + second.substr(0, 1);

    16     cout << initials << endl;

    17

    18     return 0;

    19 }

    ```


    # Program Run


    ```

    Enter your first name: Rodolfo

    Enter your significant other''s first name: Sally

    R&S

    ```'
