  md: "# HOW TO 4.1 — Writing a Loop\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_189_0.png)\n\
    \nThis How To walks you through the process of implementing a loop statement.\
    \ We will illustrate the steps with the following example problem:\n\nRead twelve\
    \ temperature values (one for each month), and display the number of the month\
    \ with the highest temperature. For example, according to http://worldclimate.com,\
    \ the average maximum temperatures for Death Valley are (in order by month):\n\
    \n18.2  22.6  26.4  31.1  36.6  42.2\n45.7  44.5  40.2  33.1  24.2  17.6\n\nIn\
    \ this case, the month with the highest temperature (45.7 degrees Celsius) is\
    \ July, and the program should display 7.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_189_1.png)\n\
    \n# Step 1\n\nDecide what work must be done inside the loop.\n\nEvery loop needs\
    \ to do some kind of repetitive work, such as\n\n+   - Reading another item.\n\
    +   - Updating a value (such as a bank balance or total).\n+   - Incrementing\
    \ a counter.\n\nIf you can’t figure out what needs to go inside the loop, start\
    \ by writing down the steps that you would take if you solved the problem by hand.\
    \ For example, with the temperature reading problem, you might write\n\n```\n\
    Read first value.\nRead second value.\nIf second value is higher than the first,\
    \ set highest temperature to that value, highest month to 2.\nRead next value.\n\
    If value is higher than the first and second, set highest temperature to that\
    \ value, highest month to 3.\nRead next value.\nIf value is higher than the highest\
    \ temperature seen so far, set highest temperature to that value,\n    highest\
    \ month to 4.\n…\n```\n\nNow look at these steps and reduce them to a set of *uniform\
    \ actions* that can be placed into the loop body. The first action is easy:\n\n\
    ```\nRead next value.\n```\n\nThe next action is trickier. In our description,\
    \ we used tests “higher than the first”, “higher than the first and second”, “higher\
    \ than the highest temperature seen so far”. We need to settle on one test that\
    \ works for all iterations. The last formulation is the most general.\n\nSimilarly,\
    \ we must find a general way of setting the highest month. We need a variable\
    \ that stores the current month, running from 1 to 12. Then we can formulate the\
    \ second loop action:\n\n```\nIf value is higher than the highest temperature,\
    \ set highest temperature to that value,\n    highest month to current month.\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 190
  md: "Altogether our loop is\n\n```\n```\nLoop\n    Read next value.\n    If value\
    \ is higher than the highest temperature, set highest temperature to that value,\n\
    \        highest month to current month.\n    Increment current month.\n```\n\
    ```\n\n# ### Step 2\n\nSpecify the loop condition.\n\nWhat goal do you want to\
    \ reach in your loop? Typical examples are:\n\n+   - Has the counter reached the\
    \ final value?\n+   - Have you read the last input value?\n+   - Has a value reached\
    \ a given threshold?\n\nIn our example, we simply want the current month to reach\
    \ 12.\n\n# ### Step 3\n\nDetermine the loop type.\n\nWe distinguish between two\
    \ major loop types. A definite or count-controlled loop is executed a definite\
    \ number of times. In an indefinite or event-controlled loop, the number of iterations\
    \ is not known in advance—the loop is executed until some event happens. A typical\
    \ example of the latter is a loop that reads data until a sentinel is encountered.\n\
    \nIf you know in advance how many times a loop is repeated, use a for statement.\
    \ For other loops, consider the loop condition. Do you need to complete one iteration\
    \ of the loop body before you can tell when to terminate the loop? In that case,\
    \ you should choose a do loop. Otherwise, use a while loop.\n\nIn our example,\
    \ we read 12 temperature values. Therefore, we choose a for loop.\n\n# ### Step\
    \ 4\n\nSet up variables for entering the loop for the first time.\n\nList all\
    \ variables that are used and updated in the loop, and determine how to initialize\
    \ them. Commonly, counters are initialized with 0 or 1, totals with 0.\n\nIn our\
    \ example, the variables are\n\n```\n```\ncurrent month\nhighest value\nhighest\
    \ month\n```\n```\n\nWe need to be careful how we set up the highest temperature\
    \ value. We can’t simply set it to 0. After all, our program needs to work with\
    \ temperature values from Antarctica, all of which may be negative.\n\nA good\
    \ option is to set the highest temperature value to the first input value. Of\
    \ course, then we need to remember to only read in another 11 values, with the\
    \ current month starting at 2.\n\nWe also need to initialize the highest month\
    \ with 1. After all, in an Australian city, we may never find a month that is\
    \ warmer than January.\n\n# ### Step 5\n\nProcess the result after the loop has\
    \ finished.\n\nIn many cases, the desired result is simply a variable that was\
    \ updated in the loop body. For example, in our temperature program, the result\
    \ is the highest month. Sometimes, the loop computes values that contribute to\
    \ the final result. For example, suppose you are asked to average the temperatures.\
    \ Then the loop should compute the sum, not the average. After the loop has completed,\
    \ you are ready to compute the average: divide the sum by the number of inputs."
  merge: -1
  img_proc: true
