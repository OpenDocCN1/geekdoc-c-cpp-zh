  md: "![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_131_0.png)\n\n*A Boolean variable\
    \ is also called a flag because it can be either up (true) or down (false).*\n\
    \nHere is a definition of a Boolean variable:\n\n```\nbool failed = true;\n```\n\
    \nYou can use the value later in your program to make a decision:\n\n```\nif (failed)\
    \ // Only executed if failed has been set to true\n{\n    ...\n}\n```\n\nWhen\
    \ you make complex decisions, you often need to combine Boolean values. An operator\
    \ that combines Boolean conditions is called a **Boolean operator**. In C++, the\
    \ `&&` operator (called *and*) yields true only when both conditions are true.\
    \ The `||` operator (called *or*) yields the result true if at least one of the\
    \ conditions is true.\n\nSuppose you write a program that processes temperature\
    \ values, and you want to test whether a given temperature corresponds to liquid\
    \ water. (At sea level, water freezes at 0 degrees Celsius and boils at 100 degrees.)\
    \ Water is liquid if the temperature is greater than zero and less than 100:\n\
    \n```\nif (temp > 0 && temp < 100) { cout << \"Liquid\"; }\n```\n\nThe condition\
    \ of the test has two parts, joined by the `&&` operator. (As shown in Table 5\
    \ and Appendix C, the `>` and `<` operators have higher precedence than the `&&`\
    \ operator.) Each part is a Boolean value that can be true or false. The combined\
    \ expression is true if both individual expressions are true. If either one of\
    \ the expressions is false, then the result is also false (see Figure 8).\n\n\
    C++ has two Boolean operators that combine conditions: `&&` (and) and `||` (or).\n\
    \n**A && B**\n\n| A | B | A && B |\n|---|---|---|\n| true | true | true |\n| true\
    \ | false | false |\n| false | true | false |\n| false | false | false |\n\n**A\
    \ || B**\n\n| A | B | A \\|\\| B |\n|---|---|---|\n| true | true | true |\n| true\
    \ | false | true |\n| false | true | true |\n| false | false | false |\n\n**!A**\n\
    \n| A | !A |\n|---|---|\n| true | false |\n| false | true |\n\n**Figure 8**  Boolean\
    \ Truth Tables\n\n*At this geyser in Iceland, you can see ice, liquid water, and\
    \ steam.*\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_131_1.png)"
