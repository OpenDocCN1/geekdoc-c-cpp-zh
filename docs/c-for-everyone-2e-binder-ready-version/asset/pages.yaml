  md: '# ### Special Topic 7.3


    # #### Constant Pointers


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_347_0.png)


    The following definition specifies a constant pointer:


    ```

    `const double* p = &balance;`

    ```


    You cannot modify the value to which p points. That is, the following statement
    is illegal:


    ```

    `*p = 0; // Error`

    ```


    Of course, you can read the value:


    ```

    `cout << *p; // OK`

    ```


    A constant array parameter variable is equivalent to a constant pointer. For example,
    consider the function


    ```

    `double sum(const double[] values, int size)`

    ```


    Recall from Section 7.2.3 that values is a pointer. The function could have been
    defined as


    ```

    `double sum(const double* values, int size)`

    ```


    The function can use the pointer values to read the array elements, but it cannot
    modify them.


    # # 7.3 C and C++ Strings


    C++ has two mechanisms for manipulating strings. The string class supports character
    sequences of arbitrary length and provides convenient operations such as concatenation
    and string comparison. However, C++ also inherits a more primitive level of string
    handling from the C language, in which strings are represented as arrays of char
    values. In this sections, we will discuss the relationships between these types.


    # ## 7.3.1 The char Type


    > > A value of type `char` denotes an individual character. Character literals
    are enclosed in single quotes.


    The `char` type denotes an individual character. Character literals are delimited
    by single quotes; for example,


    ```

    `char input = ''y'';`

    ```


    | W | O | R | D |

    |---|---|---|---|


    Each character is actually encoded as an integer value. (See Appendix D for the
    encoding using the ASCII code, which is used on the majority of computers today.)


    Note that ''y'' is a single character, which is quite different from "y", a string
    containing the ''y'' character.


    Table 3 shows typical character literals.


    # ## 7.3.2 C Strings


    > > A literal string (enclosed in double quotes) is an array of `char` values
    with a zero terminator.


    In the C programming language, strings are always represented as character arrays.
    C++ programmers often refer to arrays of `char` values as “C strings”.


    In particular, a literal string, such as "Harry", is not an object of type `string`.
    Instead, it is an array of `char` values. As with all arrays, a string literal
    can be assigned to a pointer variable that points to the initial character in
    the array:


    ```

    `const char* char_pointer = "Harry"; // Points to ''H''`

    ```'
