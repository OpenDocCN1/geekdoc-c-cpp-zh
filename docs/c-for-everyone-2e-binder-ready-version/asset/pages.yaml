  md: "# Syntax 1.2 Output Statement\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_40_0.png)\n\
    \nEnclose text strings in quotation marks.\n\nUse + to add two numbers and * to\
    \ multiply two numbers.\n\nSend endl to cout to end a line of displayed output.\n\
    \nEnd each statement with a semicolon.\n\nThe statement `cout << \"Hello\";` displays\
    \ the **string** Hello. A string is a sequence of characters. You must enclose\
    \ the contents of a string inside quotation marks so that the compiler knows you\
    \ literally mean the text \"Hello\" and not a function with the same name.\n\n\
    You can send more than one item to cout. Use a << before each one of them. For\
    \ example, `cout << \"The answer is \" << 6 * 7;` displays The answer is 42 (in\
    \ C++, the * denotes multiplication).\n\nThe endl symbol denotes an *end of line*\
    \ marker. When this marker is sent to cout, the cursor is moved to the first column\
    \ in the next screen row. If you don't use an end of line marker, then the next\
    \ displayed item will simply follow the current string on the same line. In this\
    \ program we only printed one item, but in general we will want to print multiple\
    \ items, and it is a good habit to end all lines of output with an end of line\
    \ marker.\n\nFinally, note that each statement in C++ ends in a semicolon, just\
    \ as every English sentence ends in a period.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_40_1.png)\n\
    \n12. How do you modify the hello.cpp program to greet you instead?\n\n13. What\
