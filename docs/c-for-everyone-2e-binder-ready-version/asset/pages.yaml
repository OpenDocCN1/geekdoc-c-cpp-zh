  md: "# Destructors and Resource Management\n\n# Special Topic 9.3\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_451_0.png)\n\
    \nA destructor is a special member function that is automatically executed under\
    \ two circumstances:\n\n+   * At the end of the block in which an object variable\
    \ is defined\n+   * When a heap object is deleted\n\nTo understand the need for\
    \ destructors, consider an implementation of a string class, similar to that of\
    \ the C++ library. The characters of a string are stored on the heap, and each\
    \ String object contains a pointer to the array holding its characters.\n\n```\n\
    ~~~cpp\nclass String\n{\n  ...\nprivate:\n  char* char_array;\n};\n~~~\n```\n\n\
    The constructor allocates and initializes the character array:\n\n```\n~~~cpp\n\
    String::String(const char initial_chars[])\n{\n  char_array = new char[strlen(initial_chars)\
    \ + 1];\n  strcpy(char_array, initial_chars);\n}\n~~~\n```\n\nIt is the job of\
    \ the destructor to deallocate this memory. The name of the destructor is the\
    \ ~ character followed by the class name, that is, ~String in our case. A class\
    \ can have only one destructor, and the destructor has no arguments.\n\n```\n\
    ~~~cpp\nString::~String()\n{\n  delete[] char_array;\n}\n~~~\n```\n\nWhen a String\
    \ object is no longer needed, the destructor is automatically invoked, and the\
    \ memory for the characters is properly recycled (see Figure 9):\n\n```\n~~~cpp\n\
    void fun()\n{\n  String name(\"Harry\");  // 1 Heap memory is allocated by the\
    \ constructor\n\n} // 2 The destructor is invoked on name, and its heap memory\
    \ is deallocated\n~~~\n```\n\nAs a rule of thumb, if a constructor calls new,\
    \ you should supply a destructor that calls delete. Unfortunately, just supplying\
    \ a destructor is not enough. Consider this scenario:\n\n```\n~~~cpp\nString name1(\"\
    Harry\");\nString name2(\"Sally\");\nname1 = name2;\n~~~\n```\n\nThe assignment\
    \ has a very unfortunate effect: The memory for the first String has not been\
    \ deallocated. (The destructor is only called at the end of the block in which\
    \ name1 is defined.) And the two String objects now share a pointer to the same\
    \ area of heap memory. Eventually, that memory location will be deleted twice\
    \ (see Figure 10).\n\nThis problem can be overcome by redefining what it means\
    \ to assign one object to another. In this context, the assignment needs to\n\n\
    +   * Delete the memory of the String object on the left-hand side of the assignment\
    \ (name1 in our example).\n+   * Allocate a new memory block to the left-hand\
    \ side object, and fill it with a copy of the string on the right-hand side."
  merge: -1
  img_proc: true
