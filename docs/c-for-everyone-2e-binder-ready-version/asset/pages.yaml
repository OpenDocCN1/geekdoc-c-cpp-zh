  md: "![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_106_0.png)\n\n+   1. In some Asian\
    \ countries, the number 14 is considered unlucky. Some building owners play it\
    \ safe and skip *both* the thirteenth and the fourteenth floor. How would you\
    \ modify the sample program to handle such a building?\n+   2. Consider the following\
    \ if statement to compute a discounted price:\n+   \n+      ~~~\n+      if (original_price\
    \ > 100)\n+      {\n+          discounted_price = original_price - 20;\n+    \
    \  }\n+      else\n+      {\n+          discounted_price = original_price - 10;\n\
    +      }\n+      ~~~\n+   \n+      What is the discounted price if the original\
    \ price is 95? 100? 105?\n+   3. Compare this if statement with the one in Self\
    \ Check 2:\n+   \n+      ~~~\n+      if (original_price < 100)\n+      {\n+  \
    \        discounted_price = original_price - 10;\n+      }\n+      else\n+   \
    \   {\n+          discounted_price = original_price - 20;\n+      }\n+      ~~~\n\
    +   \n+      Do the two statements always compute the same value? If not, when\
    \ do the values differ?\n+   4. Consider the following statements to compute a\
    \ discounted price:\n+   \n+      ~~~\n+      discounted_price = original_price;\n\
    +      if (original_price > 100)\n+      {\n+          discounted_price = original_price\
    \ - 10;\n+      }\n+      ~~~\n+   \n+      What is the discounted price if the\
    \ original price is 95? 100? 105?\n+   5. The variables `fuel_amount` and `fuel_capacity`\
    \ hold the actual amount of fuel and the size of the fuel tank of a vehicle. If\
    \ less than 10 percent is remaining in the tank, a status light should show a\
    \ red color; otherwise it shows a green color. Simulate this process by printing\
    \ out either \"red\" or \"green\".\n\n# Practice It\n\nNow you can try these exercises\
    \ at the end of the chapter: R3.3, R3.4, P3.16.\n\n# Programming Tip 3.1\n\n#\
    \ Brace Layout\n\nProgrammers vary in how they align braces in their code. In\
    \ this book, we follow the simple rule of making { and } line up.\n\n```\n~~~\n\
    if (floor > 13)\n{\n   floor--;\n}\n~~~\n```\n\nThis style makes it easy to spot\
    \ matching braces.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_106_1.png)\n\n\
    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_106_2.png)\n\n*Properly lining up your\
    \ code makes your programs easier to read.*"
