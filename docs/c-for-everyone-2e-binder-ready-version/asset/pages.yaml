- pgno: 29
  md: '![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_29_0.png)


    Just as you gather tools, study a project, and make a plan for tackling it, in
    this chapter you will gather up the basics you need to start learning to program.
    After a brief introduction to computer hardware, software, and programming in
    general, you will learn how to write and run your first C++ program. You will
    also learn how to diagnose and fix programming errors, and how to use pseudocode
    to describe an algorithm—a step-by-step description of how to solve a problem—as
    you plan your programs.


    # ## 1.1 What Is Programming?


    Computers execute very basic instructions in rapid succession.


    You have probably used a computer for work or fun. Many people use computers for
    everyday tasks such as electronic banking or writing a term paper. Computers are
    good for such tasks. They can handle repetitive chores, such as totaling up numbers
    or placing words on a page, without getting bored or exhausted.


    The flexibility of a computer is quite an amazing phenomenon. The same machine
    can balance your checkbook, print your term paper, and play a game. In contrast,
    other machines carry out a much narrower range of tasks; a car drives and a toaster
    toasts. Computers can carry out a wide range of tasks because they execute different
    programs, each of which directs the computer to work on a specific task.


    A computer program is a sequence of instructions and decisions.


    The computer itself is a machine that stores data (numbers, words, pictures),
    interacts with devices (the monitor, the sound system, the printer), and executes
    programs. A *computer program* tells a computer, in minute detail, the sequence
    of steps that are needed to fulfill a task. The physical computer and peripheral
    devices are collectively called the *hardware*. The programs the computer executes
    are called the *software*.


    Today’s computer programs are so sophisticated that it is hard to believe that
    they are composed of extremely primitive operations. A typical operation may be
    one of the following:


    +   - Put a red dot at this screen position.

    +   - Add up these two numbers.

    +   - If this value is negative, continue the program at a certain instruction.


    The computer user has the illusion of smooth interaction because a program contains
    a huge number of such operations, and because the computer can execute them at
    great speed.


    Programming is the act of designing and implementing computer programs.


    The act of designing and implementing computer programs is called *programming*.
    In this book, you will learn how to program a computer—that is, how to direct
    the computer to execute tasks.


    To write a computer game with motion and sound effects or a word processor that
    supports fancy fonts and pictures is a complex task that requires a team of many
    highly skilled programmers. Your first programming efforts will be more mundane.
    The concepts and skills you learn in this book form an important foundation, and
    you should not be disappointed if your first programs do not rival the sophisticated
    software that is familiar to you. Actually, you will find that there is an immense
    thrill even in simple programming tasks. It is an amazing experience to see the
    computer precisely and quickly carry out a task that would take you hours of drudgery,
    to'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'make small changes in a program that lead to immediate improvements, and to
    see the computer become an extension of your mental powers.


    # SELF CHECK


    +   1. What is required to play music on a computer?

    +   2. Why is a CD player less flexible than a computer?

    +   3. What does a computer user need to know about programming in order to play
    a video game?


    **Practice It**  Now you can try these exercises at the end of the chapter: R1.1,
    R1.4.


    # 1.2 The Anatomy of a Computer


    To understand the programming process, you need to have a rudimentary understanding
    of the building blocks that make up a computer. We will look at a personal computer.
    Larger computers have faster, larger, or more powerful components, but they have
    fundamentally the same design.


    At the heart of the computer lies the **central processing unit** (CPU) (see Figure
    1). It consists of a single *chip*, or a small number of chips. A computer chip
    (integrated circuit) is a component with a plastic or metal housing, metal connectors,
    and inside wiring made principally from silicon. For a CPU chip, the inside wiring
    is enormously complicated. For example, the Pentium chip (a popular CPU for personal
    computers at the time of this writing) is composed of several million structural
    elements, called *transistors*.


    The CPU performs program control and data processing. That is, the CPU locates
    and executes the program instructions; it carries out arithmetic operations such
    as addition, subtraction, multiplication, and division; it fetches data from external
    memory or devices and stores data back.


    The computer stores data and programs. There are two kinds of storage. *Primary
    storage* is made from memory chips: electronic circuits that can store data, provided
    they are supplied with electric power. *Secondary storage*, usually a hard disk,
    provides less expensive storage that persists without electricity. A hard disk
    consists of rotating platters, which are coated with a magnetic material, and
    read/write heads, which can detect and change the magnetic flux on the platters
    (see Figure 2).


    > The central processing unit (CPU) performs program control and data processing.


    > Storage devices include memory and secondary storage.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_30_0.png)


    **Figure 1**  Central Processing Unit'
