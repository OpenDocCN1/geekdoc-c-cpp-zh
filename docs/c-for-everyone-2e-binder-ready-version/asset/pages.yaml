  md: "Note that the in_file parameter variable of the process_name function in the\
    \ code below is a reference parameter. Reading or writing modifies a stream variable.\
    \ The stream variable monitors how many characters have been read or written so\
    \ far. Any read or write operation changes that data. For that reason, you must\
    \ always make stream parameter variables reference parameters.\n\nAlways use a\
    \ reference parameter for a stream.\n\nThe complete program is shown below. As\
    \ you can see, reading from a file is just as easy as reading keyboard input.\n\
    \nHave a look at the program output. Remarkably, only 69 boy names and 153 girl\
    \ names account for half of all births. That's good news for those who are in\
    \ the business of producing personalized doodads. Exercise P8.10 asks you to study\
    \ how this distribution has changed over the years.\n\n# ch08/babynames.cpp\n\n\
    ```\n    #include <iostream>\n    #include <fstream>\n    #include <string>\n\n\
    \    using namespace std;\n\n    /**\n       Reads name information, prints the\
    \ name if total >= 0, and adjusts the total.\n       @param in_file the input\
    \ stream\n       @param total the total percentage that should still be processed\n\
    \    */\n    void process_name(ifstream& in_file, double& total)\n    {\n    \
    \   string name;\n       int count;\n       double percent;\n       in_file >>\
    \ name >> count >> percent;\n\n       if (in_file.fail()) { return; } // Check\
    \ for failure after each input\n       if (total > 0) { cout << name << \" \"\
    ; }\n       total = total - percent;\n    }\n\n    int main()\n    {\n       ifstream\
    \ in_file;\n       in_file.open(\"babynames.txt\");\n       if (in_file.fail())\
    \ { return 0; } // Check for failure after opening\n\n       double boy_total\
    \ = 50;\n       double girl_total = 50;\n\n       while (boy_total > 0 || girl_total\
    \ > 0)\n       {\n          int rank;\n          in_file >> rank;\n          if\
    \ (in_file.fail()) { return 0; }\n\n          cout << rank << \" \";\n\n     \
    \     process_name(in_file, boy_total);\n          process_name(in_file, girl_total);\n\
    \       }\n```"
