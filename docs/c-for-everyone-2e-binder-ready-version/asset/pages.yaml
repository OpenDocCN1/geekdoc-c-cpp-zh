  md: "```\n```cpp\nint main()\n{\n   double price = 4.35;\n   int cents = 100 * price;\
    \ // Should be 100 * 4.35 = 435\n   cout << cents << endl; // Prints 434!\n  \
    \ return 0;\n}\n```\n```\n\nOf course, one hundred times 4.35 is 435, but the\
    \ program prints 434. Most computers represent numbers in the binary system. In\
    \ the binary system, there is no exact representation for 4.35, just as there\
    \ is no exact representation for 1/3 in the decimal system. The representation\
    \ used by the computer is just a little less than 4.35, so 100 times that value\
    \ is just a little less than 435. When a floating-point value is converted to\
    \ an integer, the entire fractional part, which is almost 1, is thrown away, and\
    \ the integer 434 is stored in cents. The remedy is to add 0.5 in order to round\
    \ to the nearest integer:\n\n```\n```cpp\nint cents = 100 * price + 0.5;\n```\n\
    ```\n\n# Programming Tip 2.3\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_73_0.png)\n\
    \n# Spaces in Expressions\n\nIt is easier to read\n\n```\n```cpp\nx1 = (-b + sqrt(b\
    \ * b - 4 * a * c)) / (2 * a);\n```\n```\n\nthan\n\n```\n```cpp\nx1=(-b+sqrt(b*b-4*a*c))/(2*a);\n\
    ```\n```\n\nSimply put spaces around all operators + - * / % =. However, don't\
    \ put a space after a unary minus: a - used to negate a single quantity, such\
    \ as -b. That way, it can be easily distinguished from a binary minus, as in a\
    \ - b.\n\nIt is customary not to put a space after a function name. That is, write\
    \ sqrt(x) and not sqrt (x).\n\n# Special Topic 2.3\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_73_1.png)\n\
    \n# Casts\n\nOccasionally, you need to store a value into a variable of a different\
    \ type. Whenever there is the risk of information loss, the compiler issues a\
    \ warning. For example, if you store a double value into an int variable, you\
    \ can lose information in two ways:\n\n+   - The fractional part is lost.\n+ \
    \  - The magnitude may be too large.\n\nFor example,\n\n```\n```cpp\nint n = 1.0E100;\
    \ // NO\n```\n```\n\nis not likely to work, because 10^100 is larger than the\
    \ largest representable integer.\n\nNevertheless, sometimes you do want to convert\
    \ a floating-point value into an integer value. If you are prepared to lose the\
    \ fractional part and you know that this particular floating-point number is not\
    \ larger than the largest possible integer, then you can turn off the warning\
    \ by using a cast. A cast is a conversion from one type (such as double) to another\
    \ type (such as int) that is not safe in general, but that you know to be safe\
    \ in a particular circumstance. You express a cast in C++ as follows:\n\n```\n\
    ```cpp\nint cents = static_cast<int>(100 * price + 0.5);\n```\n```"
