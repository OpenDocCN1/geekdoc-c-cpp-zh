- pgno: 223
  md: "![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_223_0.png)\n\n+   1. Consider the\
    \ function call pow(3, 2). What are the arguments and return value?\n+   2. What\
    \ is the return value of the function call pow(pow(2, 2), 2)?\n+   3. The ceil\
    \ function in the C++ standard library takes a single argument x and returns the\
    \ smallest integer ≥ x. What is the return value of ceil(2.3)?\n+   4. Is it possible\
    \ to determine the answer to Self Check 3 without knowing how the ceil function\
    \ is implemented. Use an engineering term to describe this aspect of the ceil\
    \ function.\n\n**Practice It** Now you can try these exercises at the end of the\
    \ chapter: R5.1, P5.1.\n\n# # 5.2 Implementing Functions\n\nIn this section, you\
    \ will learn how to implement a function from a given specification. We will use\
    \ a very simple example: a function to compute the volume of a cube with a given\
    \ side length.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_223_1.png)\n\nThe cube_volume\
    \ function uses a given side length to compute the volume of a cube.\n\n> When\
    \ defining a function, you provide a name for the function, a variable for each\
    \ argument, and a type for the result.\n\nWhen writing this function, you need\
    \ to\n\n+   * Pick a name for the function (cube_volume).\n+   * Declare a variable\
    \ for each argument (double side_length). These variables are called parameter\
    \ variables.\n+   * Specify the type of the return value (double).\n\nPut all\
    \ this information together to form the first line of the function's definition:\n\
    \n```\ndouble cube_volume(double side_length)\n```\n\nNext, specify the body of\
    \ the function: the statements that are executed when the function is called.\n\
    \nThe volume of a cube of side length s is s × s × s. However, for greater clarity,\
    \ our parameter variable has been called side_length, not s, so we need to compute\
    \ side_length * side_length * side_length.\n\nWe will store this value in a variable\
    \ called volume:\n\n```\ndouble volume = side_length * side_length * side_length;\n\
    ```\n\nIn order to return the result of the function, use the return statement:\n\
    \n```\nreturn volume;\n```\n\nThe body of a function is enclosed in braces. Here\
    \ is the complete function:\n\n```\ndouble cube_volume(double side_length)\n{\n\
    \    double volume = side_length * side_length * side_length;\n    return volume;\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 224
  md: "*The return statement gives the function's result to the caller.*\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_224_0.png)\n\
    \nLet's put this function to use. We'll supply a `main` function that calls the\
    \ `cube_volume` function twice.\n\n```\n    int main()\n    {\n        double\
    \ result1 = cube_volume(2);\n        double result2 = cube_volume(10);\n     \
    \   cout << \"A cube with side length 2 has volume \" << result1 << endl;\n  \
    \      cout << \"A cube with side length 10 has volume \" << result2 << endl;\n\
    \n        return 0;\n    }\n```\n\nWhen the function is called with different\
    \ arguments, the function returns different results. Consider the call `cube_volume(2)`.\
    \ The argument 2 corresponds to the `side_length` parameter variable. Therefore,\
    \ in this call, `side_length` is 2. The function computes `side_length * side_length\
    \ * side_length`, or `2 * 2 * 2`. When the function is called with a different\
    \ argument, say 10, then the function computes `10 * 10 * 10`.\n\nNow we combine\
    \ both functions into a test program. Because `main` calls `cube_volume`, the\
    \ `cube_volume` function must be known before the `main` function is defined.\
    \ This is easily achieved by placing `cube_volume` first and `main` last in the\
    \ source file. (See Special Topic 5.1 on page 203 for an alternative.)\n\n# ###\
    \ Syntax 5.1 Function Definition\n\n```\n    // Type of return value: double\n\
    \    // Name of function: cube_volume\n    // Type of parameter variable: double\n\
    \    // Name of parameter variable: side_length\n    double cube_volume(double\
    \ side_length)\n    {\n        // Function body, executed when function is called.\n\
    \        double volume = side_length * side_length * side_length;\n        //\
    \ return statement exits function and returns result. See page 202.\n        return\
    \ volume;\n    }\n```"
