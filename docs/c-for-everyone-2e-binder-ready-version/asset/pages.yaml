  md: "# ### Special Topic 7.1\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_341_0.png)\n\
    \n# ## Pointers and References\n\nIn Section 5.9, you saw how reference parameters\
    \ enable a function to modify variables that are passed as arguments. Here is\
    \ an example of a function with a reference parameter:\n\n```\n~~~cpp\nvoid withdraw(double&\
    \ balance, double amount)\n{\n    if (balance >= amount)\n    {\n        balance\
    \ = balance - amount;\n    }\n}\n~~~\n```\n\nIf you call\n\n```\n~~~cpp\nwithdraw(harrys_checking,\
    \ 1000);\n~~~\n```\n\nthen $1000 is withdrawn from harrys_checking, provided that\
    \ sufficient funds are available.\n\nYou can use pointers to achieve the same\
    \ effect:\n\n```\n~~~cpp\nvoid withdraw(double* balance, double amount)\n{\n \
    \   if (*balance >= amount)\n    {\n        *balance = *balance - amount;\n  \
    \  }\n}\n~~~\n```\n\nHowever, then you need to call the function with the address\
    \ of the account:\n\n```\n~~~cpp\nwithdraw(&harrys_checking, 1000);\n~~~\n```\n\
    \nThese solutions are equivalent. Behind the scenes, the compiler translates reference\
    \ parameters into pointers.\n\n# ## 7.2 Arrays and Pointers\n\nPointers are particularly\
    \ useful for understanding the peculiarities of arrays. In the following sections,\
    \ we describe the relationship between arrays and pointers in C++.\n\n# ### 7.2.1\
    \ Arrays as Pointers\n\nConsider this declaration of an array:\n\n```\n~~~cpp\n\
    int a[10];\n~~~\n```\n\n> The name of an array variable is a pointer to the starting\
    \ element of the array.\n\nAs you know, a[3] denotes an array element. The array\
    \ name *without* brackets denotes a pointer to the starting element (see Figure\
    \ 3).\n\nYou can capture that pointer in a variable:\n\n```\n~~~cpp\nint* p =\
    \ a; // Now p points to a[0]\n~~~\n```\n\nYou can also use the array name as a\
    \ pointer in expressions. The statement\n\n```\n~~~cpp\ncout << *a;\n~~~\n```\n\
    \nhas the same effect as the statement\n\n```\n~~~cpp\ncout << a[0];\n~~~\n```"
