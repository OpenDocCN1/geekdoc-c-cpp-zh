- pgno: 185
  md: "To compute an average, keep a total and a count of all values.\n\nTo compute\
    \ an average, count how many values you have, and divide by the count. Be sure\
    \ to check that the count is not zero.\n\n```\ndouble total = 0;\nint count =\
    \ 0;\ndouble input;\nwhile (cin >> input)\n{\n    total = total + input;\n   \
    \ count++;\n}\ndouble average = 0;\nif (count > 0) { average = total / count;\
    \ }\n```\n\n# 4.7.2 Counting Matches\n\nTo count values that fulfill a condition,\
    \ check all values and increment a counter for each match.\n\nYou often want to\
    \ know how many values fulfill a particular condition. For example, you may want\
    \ to count how many spaces are in a string. Keep a counter, a variable that is\
    \ initialized with 0 and incremented whenever there is a match.\n\n```\nint spaces\
    \ = 0;\nfor (int i = 0; i < str.length(); i++)\n{\n    string ch = str.substr(i,\
    \ 1);\n    if (ch == \" \")\n    {\n        spaces++;\n    }\n}\n```\n\nFor example,\
    \ if str is the string \"My Fair Lady\", spaces is incremented twice (when i is\
    \ 2 and 7).\n\nNote that the spaces variable is declared outside the loop. We\
    \ want the loop to update a single variable. The ch variable is declared inside\
    \ the loop. A separate variable is created for each iteration and removed at the\
    \ end of each loop iteration.\n\nThis loop can also be used for scanning inputs.\
    \ The following loop reads text, a word at a time, and counts the number of words\
    \ with at most three letters:\n\n```\nint short_words = 0;\nstring input;\nwhile\
    \ (cin >> input)\n{\n    if (input.length() <= 3)\n    {\n        short_words++;\n\
    \    }\n}\n```\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_185_0.png)\n\nIn a\
    \ loop that counts matches, a counter is incremented whenever a match is found."
  merge: -1
  img_proc: true
- pgno: 186
  md: "# ### 4.7.3 Finding the First Match\n\n> > If your goal is to find a match,\
    \ exit the loop when the match is found.\n\nWhen you count the values that fulfill\
    \ a condition, you need to look at all values. However, if your task is to find\
    \ a match, then you can stop as soon as the condition is fulfilled.\n\nHere is\
    \ a loop that finds the first space in a string. Because we do not visit all elements\
    \ in the string, a while loop is a better choice than a for loop:\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_186_0.png)\n\
    \n```\n```cpp\nbool found = false;\nint position = 0;\nwhile (!found && position\
    \ < str.length())\n{\n   string ch = str.substr(position, 1);\n   if (ch == \"\
    \ \") { found = true; }\n   else { position++; }\n}\n```\n```\n\nIf a match was\
    \ found, then found is true and position is the index of the first match. If the\
    \ loop did not find a match, then found remains false after the end of the loop.\n\
    \nIn the preceding example, we searched a string for a character that matches\
    \ a condition. You can apply the same process for user input. Suppose you are\
    \ asking a user to enter a positive value < 100. Keep asking until the user provides\
    \ a correct input:\n\n```\n```cpp\nbool valid = false;\ndouble input;\nwhile (!valid)\n\
    {\n   cout << \"Please enter a positive value < 100: \";\n   cin >> input;\n \
    \  if (0 < input && input < 100) { valid = true; }\n   else { cout << \"Invalid\
    \ input.\" << endl; }\n}\n```\n```\n\nNote that the variable input is declared\
    \ outside the while loop because you will want to use the input after the loop\
    \ has finished. If it had been declared inside the loop body, you would not be\
    \ able to use it outside the loop.\n\n# ### 4.7.4 Maximum and Minimum\n\n> > To\
    \ find the largest value, update the largest value seen so far whenever you see\
    \ a larger one.\n\nTo compute the largest value in a sequence, keep a variable\
    \ that stores the largest element that you have encountered, and update it when\
    \ you find a larger one:\n\n```\n```cpp\ndouble largest;\ncin >> largest;\ndouble\
    \ input;\nwhile (cin >> input)\n{\n   if (input > largest)\n   {\n      largest\
    \ = input;\n   }\n}\n```\n```\n\nThis algorithm requires that there is at least\
    \ one input."
  merge: -1
  img_proc: true
- pgno: 187
  md: "*To find the height of the tallest bus rider, remember the largest value so\
    \ far, and update it whenever you see a taller one.*\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_187_0.png)\n\
    \nTo compute the smallest value, simply reverse the comparison:\n\n```\n    double\
    \ smallest;\n    cin >> smallest;\n    double input;\n    while (cin >> input)\n\
    \    {\n        if (input < smallest)\n        {\n            smallest = input;\n\
    \        }\n    }\n```\n\n# 4.7.5 Comparing Adjacent Values\n\nWhen processing\
    \ a sequence of values in a loop, you sometimes need to compare a value with the\
    \ value that just preceded it. For example, suppose you want to check whether\
    \ a sequence of inputs contains adjacent duplicates such as 1 7 2 9 9 4 9.\n\n\
    Now you face a challenge. Consider the typical loop for reading a value:\n\n```\n\
    \    double input;\n    while (cin >> input)\n    {\n        // Now input contains\
    \ the current input\n        ...\n    }\n```\n\nTo compare adjacent inputs, store\
    \ the preceding input in a variable.\n\nHow can you compare the current input\
    \ with the preceding one? At any time, input contains the current input, overwriting\
    \ the previous one.\n\nThe answer is to store the previous input, like this:\n\
    \n```\n    double input;\n    double previous;\n    while (cin >> input)\n   \
    \ {\n        if (input == previous) { cout << \"Duplicate input\" << endl; }\n\
    \        previous = input;\n    }\n```"
