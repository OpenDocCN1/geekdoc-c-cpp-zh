- pgno: 107
  md: "Some programmers put the opening brace on the same line as the if:\n\n```\n\
    ```\nif (floor > 13) {\n    floor--;\n}\n```\n```\n\nThis style makes it harder\
    \ to match the braces, but it saves a line of code, allowing you to view more\
    \ code on the screen without scrolling. There are passionate advocates of both\
    \ styles.\n\nIt is important that you pick a layout style and stick with it consistently\
    \ within a given programming project. Which style you choose may depend on your\
    \ personal preference or a coding style guide that you need to follow.\n\n# ###\
    \ Programming Tip 3.2\n\n# ### Always Use Braces\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_107_0.png)\n\
    \nWhen the body of an if statement consists of a single statement, you need not\
    \ use braces. For example, the following is legal:\n\n```\n```\nif (floor > 13)\n\
    \    floor--;\n```\n```\n\nHowever, it is a good idea to always include the braces:\n\
    \n```\n```\nif (floor > 13)\n{\n    floor--;\n}\n```\n```\n\nThe braces makes\
    \ your code easier to read, and you are less likely to make errors such as the\
    \ one described in Common Error 3.1.\n\n# ### Common Error 3.1\n\n# ### A Semicolon\
    \ After the if Condition\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_107_1.png)\n\
    \nThe following code fragment has an unfortunate error:\n\n```\n```\nif (floor\
    \ > 13) ; // ERROR\n{\n    floor--;\n}\n```\n```\n\nThere should be no semicolon\
    \ after the if condition. The compiler interprets this statement as follows: If\
    \ floor is greater than 13, execute the statement that is denoted by a single\
    \ semicolon, that is, the do-nothing statement. The statement enclosed in braces\
    \ is no longer a part of the if statement. It is always executed. Even if the\
    \ value of floor is not above 13, it is decremented.\n\nPlacing a semicolon after\
    \ the else reserved word is also wrong:\n\n```\n```\nif (floor > 13)\n{\n    actual_floor\
    \ = floor - 1;\n}\nelse ;\n{\n    actual_floor = floor;\n}\n```\n```\n\nIn this\
    \ case, the do-nothing statement is executed if floor > 13 is not fulfilled. This\
    \ is the end of the if statement. The next statement, enclosed in braces, is executed\
    \ in both cases; that is, actual_floor is always set to floor."
  merge: -1
  img_proc: true
- pgno: 108
  md: "# #### Programming Tip 3.3\n\n# ### Tabs\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_108_0.png)\n\
    \nBlock-structured code has the property that nested statements are indented by\
    \ one or more levels:\n\n```\n~~~cpp\nint main()\n{\n    int floor;\n    ...\n\
    \    if (floor > 13)\n    {\n        floor--;\n    }\n    ...\n    return 0;\n\
    }\n~~~\n```\n\n0 1 2  Indentation level\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_108_1.png)\n\
    \nHow do you move the cursor from the leftmost column to the appropriate indentation\
    \ level? A perfectly reasonable strategy is to hit the space bar a sufficient\
    \ number of times. However, many programmers use the Tab key instead. A tab moves\
    \ the cursor to the next indentation level.\n\nWhile the Tab key is nice, some\
    \ editors use tab characters for alignment, which is not so nice. Tab characters\
    \ can lead to problems when you send your file to another person or a printer.\
    \ There is no universal agreement on the width of a tab character, and some software\
    \ will ignore tabs altogether. It is therefore best to save your files with spaces\
    \ instead of tabs. Most editors have a setting to automatically convert all tabs\
    \ to spaces. Look at the documentation of your development environment to find\
    \ out how to activate this useful setting.\n\n# #### Special Topic 3.1\n\n# ###\
    \ The Selection Operator\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_108_2.png)\n\
    \nC++ has a selection operator of the form\n\n```\n~~~cpp\ncondition ? value1\
    \ : value2\n~~~\n```\n\nThe value of that expression is either *value1* if the\
    \ test passes or *value2* if it fails. For example, we can compute the actual\
    \ floor number as\n\n```\n~~~cpp\nactual_floor = floor > 13 ? floor - 1 : floor;\n\
    ~~~\n```\n\nwhich is equivalent to\n\n```\n~~~cpp\nif (floor > 13)\n{\n    actual_floor\
    \ = floor - 1;\n}\nelse\n{\n    actual_floor = floor;\n}\n~~~\n```\n\nYou can\
    \ use the selection operator anywhere that a value is expected, for example:\n\
    \n```\n~~~cpp\ncout << \"Actual floor: \" << (floor > 13 ? floor - 1 : floor);\n\
    ~~~\n```\n\nWe don't use the selection operator in this book, but it is a convenient\
    \ construct that you will find in many C++ programs."
  merge: -1
  img_proc: true
- pgno: 109
  md: "# ### Avoid Duplication in Branches\n\n# ### Programming Tip 3.4\n\nLook to\
    \ see whether you duplicate code in each branch. If so, move it out of the if\
    \ statement. Here is an example of such duplication:\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_109_0.png)\n\
    \n```\n    if (floor > 13)\n    {\n       actual_floor = floor - 1;\n       cout\
    \ << \"Actual floor: \" << actual_floor << endl;\n    }\n    else\n    {\n   \
    \    actual_floor = floor;\n       cout << \"Actual floor: \" << actual_floor\
    \ << endl;\n    }\n```\n\nThe output statement is exactly the same in both branches.\
    \ This is not an error—the program will run correctly. However, you can simplify\
    \ the program by moving the duplicated statement, like this:\n\n```\n    if (floor\
    \ > 13)\n    {\n       actual_floor = floor - 1;\n    }\n    else\n    {\n   \
    \    actual_floor = floor;\n    }\n    cout << \"Actual floor: \" << actual_floor\
    \ << endl;\n```\n\nRemoving duplication is particularly important when programs\
    \ are maintained for a long time. When there are two sets of statements with the\
    \ same effect, it can easily happen that a programmer modifies one set but not\
    \ the other.\n\n# ## 3.2 Comparing Numbers and Strings\n\nRelational operators\n\
    (< > <= >= == !=)\nare used to compare\nnumbers and strings.\n\nEvery if statement\
    \ contains a condition. In many cases, the condition involves comparing two values.\
    \ For example, in the previous examples we tested floor > 13. The comparison >\
    \ is called a relational operator. C++ has six relational operators (see Table\
    \ 1).\n\nAs you can see, only two C++ relational operators (> and <) look as you\
    \ would expect from the mathematical notation. Computer keyboards do not have\
    \ keys for ≥, ≤, or ≠, but the >=, <=, and != operators are easy to remember because\
    \ they look similar. The == operator is initially confusing to most newcomers\
    \ to C++. In C++, = already has a meaning, namely assignment.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_109_1.png)\n\
    \nIn C++, you use a relational operator to check whether one value is greater\
    \ than another."
