    +   \n+       Declare the parameter variable using pointer notation.\n\n**Practice\
    \ It**  Now you can try these exercises at the end of the chapter: R7.7, R7.8,\
    \ P7.4.\n\n# ### Special Topic 7.2\n\n# ## Using a Pointer to Step Through an\
    \ Array\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_345_0.png)\n\nConsider again\
    \ the sum function of Section 7.2.3. Now that you know that the first parameter\
    \ variable of the sum function is a pointer, you can implement the function in\
    \ a slightly different way. Rather than incrementing an integer index, you can\
    \ increment a pointer variable to visit all array elements in turn:\n\n```\n \
    \   double sum(double* a, int size)\n    {\n       double total = 0;\n       double*\
    \ p = a; // p starts at the beginning of the array\n       for (int i = 0; i <\
    \ size; i++)\n       {\n          total = total + *p; // Add the value to which\
    \ p points\n          p++; // Advance p to the next array element\n       }\n\
    \       return total;\n    }\n```\n\nInitially, the pointer p points to the element\
    \ a[0]. The increment\n\n```\n    p++;\n```\n\nmoves it to point to the next element\
    \ (see Figure 5).\n\nIt is a tiny bit more efficient to use and increment a pointer\
    \ than to access an array element as `a[i]`. For this reason, some programmers\
    \ routinely use pointers instead of indexes to access array elements.\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_345_1.png)\n\
    \n**Figure 5**  A Pointer Variable Traversing the Elements of an Array"
