  md: '# 7.5 Arrays and Vectors of Pointers


    When you have a sequence of pointers, you can place them into an array or vector.
    An array and a vector of ten `int*` pointers are defined as


    ```

    ```cpp

    int* pointer_array[10];

    vector<int*> pointer_vector(10);

    ```

    ```


    The expression `pointer_array[i]` or `pointer_vector[i]` denotes the pointer with
    index `i` in the sequence.


    One application of such pointer sequences are two-dimensional arrays in which
    each row has a different length, such as the triangular array shown in Figure
    8.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_356_0.png)


    In this situation, it would not be very efficient to use a two-dimensional array,
    because almost half of the elements would be wasted.


    We will develop a program that uses such an array for simulating a *Galton board*
    (Figure 9). A Galton board consists of a pyramidal arrangement of pegs, and a
    row of bins at the bottom. Balls are dropped onto the top peg and travel toward
    the bins. At each peg, there is a 50 percent chance of moving left or right. The
    balls in the bins approximate a bell-curve distribution.


    The Galton board can only show the balls in the bins, but we can do better by
    keeping a counter for each peg, incrementing it as a ball travels past it.


    We will simulate a board with ten rows of pegs. Each row requires an array of
    counters.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_356_1.png)'
