  md: "*If you read a character from a stream and you don't like what you get, you\
    \ can unget it.*\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_386_0.png)\n\nThe\
    \ isdigit function is one of several useful functions that categorize characters—see\
    \ Table 1. All return true or false as to whether the argument passes the test.\
    \ You must include the <cctype> header to use these functions.\n\n# ### 8.2.3\
    \ Reading Lines\n\n*You can read a line of input with the getline function and\
    \ then process it further.*\n\nWhen each line of a file is a data record, it is\
    \ often best to read entire lines with the getline function:\n\n```\n```cpp\n\
    string line;\ngetline(in_file, line);\n```\n```\n\nThe next input line (without\
    \ the newline character) is placed into the string line. The getline function\
    \ returns the “not failed” condition. You can use the following loop to process\
    \ each line in a file:\n\n```\n```cpp\nwhile (getline(in_file, line))\n{\n   Process\
    \ line;\n}\n```\n```\n\nNote that getline is not a member function, but an ordinary\
    \ function that is not called with the dot notation.\n\nTable 1 Character Functions\
    \ in <cctype>\n\n| Function | Accepted Characters |\n|---|---|\n| isdigit | 0\
    \ ... 9 |\n| isalpha | a ... z, A ... Z |\n| islower | a ... z |\n| isupper |\
    \ A ... Z |\n| isalnum | a ... z, A ... Z, 0 ... 9 |\n| isspace | White space\
    \ (space, tab, newline, and the rarely used carriage return, form feed, and vertical\
    \ tab) |"
