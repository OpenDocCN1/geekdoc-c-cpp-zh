  md: '# # 3.5 Problem Solving: Flowcharts


    > > Flow charts are made up of elements for tasks, input/outputs, and decisions.


    You have seen examples of flowcharts earlier in this chapter. A flowchart shows
    the structure of decisions and tasks that are required to solve a problem. When
    you have to solve a complex problem, it is a good idea to draw a flowchart to
    visualize the flow of control.


    The basic flowchart elements are shown in Figure 5.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_126_0.png)


    > > Each branch of a decision can contain tasks and further decisions.


    The basic idea is simple enough. Link tasks and input/output boxes in the sequence
    in which they should be executed. Whenever you need to make a decision, draw a
    diamond with two outcomes (see Figure 6).


    Each branch can contain a sequence of tasks and even additional decisions. If
    there are multiple choices for a value, lay them out as in Figure 7.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_126_1.png)


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_126_2.png)'
