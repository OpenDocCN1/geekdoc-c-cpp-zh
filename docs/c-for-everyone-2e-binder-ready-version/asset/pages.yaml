  md: "# ### WORKED EXAMPLE 5.1 Matching and Replacing Parts of a String\n\n![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_233_0.png)\n\
    \nThis Worked Example creates a function to find the first occurrence of one string\
