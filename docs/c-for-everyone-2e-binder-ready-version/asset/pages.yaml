  md: '# # 1.7 Problem Solving: Algorithm Design


    You will soon learn how to program calculations and decision making in C++. But
    before we look at the mechanics of implementing computations in the next chapter,
    let''s consider the planning process that precedes implementation.


    You may have run across advertisements that encourage you to pay for a computerized
    service that matches you up with a love partner. Think how this might work. You
    fill out a form and send it in. Others do the same. The data are processed by
    a computer program. Is it reasonable to assume that the computer can perform the
    task of finding the best match for you? Suppose your younger brother, not the
    computer, had all the forms on his desk. What instructions could you give him?
    You can''t say, "Find the best-looking person of the opposite sex who likes inline
    skating and browsing the Internet". There is no objective standard for good looks,
    and your brother''s opinion (or that of a computer program analyzing the digitized
    photo) will likely be different from yours. If you can''t give written instructions
    for someone to solve the problem, there is no way the computer can magically solve
    the problem. The computer can only do what you tell it to do. It just does it
    faster, without getting bored or exhausted. Now consider the following investment
    problem:


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_44_0.png)


    *Finding the perfect partner is not a problem that a computer can solve.*


    You put $10,000 into a bank account that earns 5 percent interest per year. How
    many years does it take for the account balance to be double the original?


    Could you solve this problem by hand? Sure. You figure out the balance as follows:


    | year | interest | balance |

    |------|----------|---------|

    | 0 | | 10000 |

    | 1 | 10000.00 x 0.05 = 500.00 | 10000.00 + 500.00 = 10500.00 |

    | 2 | 10500.00 x 0.05 = 525.00 | 10500.00 + 525.00 = 11025.00 |

    | 3 | 11025.00 x 0.05 = 551.25 | 11025.00 + 551.25 = 11576.25 |

    | 4 | 11576.25 x 0.05 = 578.81 | 11576.25 + 578.81 = 12155.06 |


    You keep going until the balance is at least $20,000. Then the last number in
    the year column is the answer.


    Of course, carrying out this computation is intensely boring to you or your younger
    brother. But computers are very good at carrying out repetitive calculations quickly
    and flawlessly. What is important to the computer is a description of the steps
    for finding the solution. Each step must be clear and unambiguous, requiring no
    guesswork. Here is such a description:


    Start with a year value of 0, a column for the interest, and a balance of $10,000.


    | year | interest | balance |

    |------|----------|---------|

    | 0 | | 10000 |'
