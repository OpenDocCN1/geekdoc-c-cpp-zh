  md: '# **Implement derived classes in C++.**


    +   - A derived class can override a base-class function by providing a new implementation.

    +   - The derived class inherits all data members and all functions that it does
    not override.

    +   - Unless specified otherwise, the base-class data members are initialized
    with the default constructor.

    +   - The constructor of a derived class can supply arguments to a base-class
    constructor.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_498_0.png)


    # **Describe how a derived class can override functions from a base class.**


    +   - A derived class can inherit a function from the base class, or it can override
    it by providing another implementation.

    +   - Use `BaseClass::function` notation to explicitly call a base-class function.


    # **Describe virtual functions and polymorphism.**


    +   - When converting a derived-class object to a base class, the derived-class
    data is sliced away.

    +   - A derived-class pointer can be converted to a base-class pointer.

    +   - When a virtual function is called, the version belonging to the actual type
    of the implicit parameter is invoked.

    +   - Polymorphism (literally, “having multiple shapes”) describes objects that
    share a set of tasks and execute them in different ways.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_498_1.png)


