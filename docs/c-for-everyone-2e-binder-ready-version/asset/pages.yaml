  md: "A derived class can inherit a function from the base class, or it can override\
    \ it by providing another implementation.\n\nConsider the display function of\
    \ the ChoiceQuestion class. It needs to override the base-class display function\
    \ in order to show the choices for the answer. Specifically, the derived-class\
    \ function needs to\n\n+   - Display the question text.\n+   - Display the answer\
    \ choices.\n\nThe second part is easy because the answer choices are a data member\
    \ of the derived class.\n\n```\n```cpp\nvoid ChoiceQuestion::display() const\n\
    {\n   // Display the question text\n   ...\n   // Display the answer choices\n\
    \   for (int i = 0; i < choices.size(); i++)\n   {\n      cout << i + 1 << \"\
    : \" << choices[i] << endl;\n   }\n}\n```\n```\n\nBut how do you get the question\
    \ text? You can't access the text member of the base class directly because it\
    \ is private.\n\nInstead, you can call the display function of the base class.\n\
    \n```\n```cpp\nvoid ChoiceQuestion::display() const\n{\n   // Display the question\
    \ text\n   display(); // Invokes implicit parameter.display()\n   // Display the\
    \ answer choices\n   ...\n}\n```\n```\n\nHowever, this won't quite work. Because\
    \ the implicit parameter of ChoiceQuestion::display is of type ChoiceQuestion,\
    \ and there is a function named display in the ChoiceQuestion class, that function\
    \ will be called—but that is just the function you are currently writing! The\
    \ function would call itself over and over.\n\nTo display the question text, you\
    \ must be more specific about which function named display you want to call. You\
    \ want Question::display:\n\n```\n```cpp\nvoid ChoiceQuestion::display() const\n\
    {\n   // Display the question text\n   Question::display(); // OK\n   // Display\
    \ the answer choices\n   ...\n}\n```\n```\n\nUse BaseClass::function notation\
    \ to explicitly call a base-class function.\n\nWhen you override a function, you\
    \ usually want to extend the functionality of the base-class version. Therefore,\
    \ you often need to invoke the base-class version before extending it. To invoke\
    \ it, you need to use the BaseClass::function notation. However, you have no obligation\
    \ to call the base-class function. Occasionally, a derived class overrides a base-class\
    \ function and specifies an entirely different functionality.\n\nHere is the complete\
    \ program that displays a plain Question object and a ChoiceQuestion object. (The\
    \ definition of the Question class, which you have already seen, is placed into\
    \ question.h, and the implementation is in question.cpp.) This example shows how\
    \ you can use inheritance to form a more specialized class from a base class."
