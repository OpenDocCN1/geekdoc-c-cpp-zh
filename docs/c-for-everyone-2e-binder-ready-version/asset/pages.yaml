- pgno: 315
  md: "As you can see, it is easy to use vectors with functions—there are no special\
    \ rules to keep in mind.\n\n# ### 6.7.4 Vector Algorithms\n\nMost of the algorithms\
    \ in Section 6.2 apply without change to vectors—simply replace size of values\
    \ with values.size(). In this section, we discuss which of the algorithms are\
    \ different for vectors.\n\n# ### Copying\n\nAs discussed in Section 6.2.2, you\
    \ need an explicit loop to make a copy of an array. It is much easier to make\
    \ a copy of a vector. You simply assign it to another vector. Consider this example:\n\
    \n```\n    vector<int> squares;\n    for (int i = 0; i < 5; i++) { squares.push_back(i\
    \ * i); }\n    vector<int> lucky_numbers; // Initially empty\n    lucky_numbers\
    \ = squares; // Now lucky_numbers contains the same elements as squares\n```\n\
    \n# ### Finding Matches\n\nSection 6.2.6 shows you how to find the first match,\
    \ but sometimes you want to have all matches. This is tedious with arrays, but\
    \ simple using a vector that collects the matches. Here we collect all elements\
    \ that are greater than 100:\n\n```\n    vector<double> matches;\n    for (int\
    \ i = 0; i < values.size(); i++)\n    {\n       if (values[i] > 100)\n       {\n\
    \          matches.push_back(values[i]);\n       }\n    }\n```\n\n# ### Removing\
    \ an Element\n\nWhen you remove an element from a vector, you want to adjust the\
    \ size of the vector by calling the pop_back member function. Here is the code\
    \ for removing an element at [pos] when the order doesn't matter.\n\n```\n   \
    \ int last_pos = values.size() - 1;\n    values[pos] = values[last_pos]; // Replace\
    \ element at pos with last element\n    values.pop_back(); // Delete last element\n\
    ```\n\nWhen removing an element from an ordered vector, first move the elements,\
    \ then reduce the size:\n\n```\n    for (int i = pos + 1; i < values.size(); i++)\n\
    \    {\n       values[i - 1] = values[i];\n    }\n    values.pop_back();\n```\n\
    \n# ### Inserting an Element\n\nInserting an element at the end of a vector requires\
    \ no special code. Simply use the push_back member function."
