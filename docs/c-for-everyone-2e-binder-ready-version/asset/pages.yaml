  md: "A number with a single digit is its own digit sum, so you can stop the recursion\
    \ when n < 10, and return n in that case. Or, if you prefer, you can be even lazier.\
    \ If n has a single digit, then digit_sum(n / 10) + n % 10 equals digit_sum(0)\
    \ + n. You can simply terminate the recursion when n is zero.\n\n# Step 4\n\n\
    Implement the solution by combining the simple cases and the reduction step.\n\
    \nNow you are ready to implement the solution. Make separate cases for the simple\
    \ inputs that you considered in Step 3. If the input isn't one of the simplest\
    \ cases, then implement the logic you discovered in Step 2.\n\nHere is the complete\
    \ digit_sum function:\n\n```\n```c\nint digit_sum(int n)\n{\n    // Special case\
