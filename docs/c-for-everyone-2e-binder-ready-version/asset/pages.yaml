- pgno: 9
  md: '# # A Walkthrough of the Learning Aids


    The pedagogical elements in this book work together to focus on and reinforce
    key concepts and fundamental principles of programming, with additional tips and
    detail organized to support and deepen these fundamentals. In addition to traditional
    features, such as chapter objectives and a wealth of exercises, each chapter contains
    elements geared to today’s visual learner.


    **Throughout each chapter, margin notes** show where new concepts are introduced
    and provide an outline of key ideas.


    ![](img/6ec8c4bdbdda7d4ab1f2166b5332154c_9_0.png)


    **Annotated syntax boxes** provide a quick, visual overview of new language constructs.


    **Annotations** explain required components and point to more information on common
    errors or best practices associated with the syntax.


    **Analogies** to everyday objects are used to explain the nature and behavior
    of concepts such as variables, data types, loops, and more.'
