    # 第 3 章 二维边界值问题的有限元方法


    DOI: [10.1201/9781003265979-3](https://doi.org/10.1201/9781003265979-3)


    通过学习如何使用 FEM 求解一维 BVP，我们获得了允许我们迈下一步并考虑二维情况的知识。虽然二维情况算法的所有步骤与一维情况相似，但它们的实现是不同的，并且需要考虑特定的特性和编码策略。


    我们首先用带有混合边界条件的线性偏微分方程来表述模型问题。然后，给出模型问题的积分公式，并进一步进行有限元离散化。我们引入基函数，并展示如何将离散化问题简化为求解线性系统。还讨论了具有三角形形状有限元的二维网格的基本概念。


    第 1 章 中引入的符号在本章与下方给出的新符号一起使用。


    ## 术语表


    *f(x)*：多元函数。


    *f(x)*：多个变量的多元函数。


    $\frac{\partial f}{\partial x_{1}},\frac{\partial f}{\partial x_{2}},\frac{\partial^{2}f}{\partial
    x_{1}\partial x_{2}},\ldots$: 函数 $f(x)$ 的偏导。


    $\nabla$: nabla 算子。


    ## 3.1 模型问题


    类似于一维情况，二维方法将基于考虑以下通用 BVP，它可以简化为：考虑在二维区域 $\Omega$ 内寻找 `u`，其中 $\Gamma = \Gamma_D
    \cup \Gamma_R$：


    ```

    -\nabla \cdot (c\nabla u) + b \cdot \nabla u + au = f \in \Omega

    ```

    ```

    u = u_D \in \Gamma_D

    ```

    ```

    c\nabla u \cdot \nu + \sigma u = \mu \in \Gamma_R

    ```


    在这里，$\Gamma_D$ 和 $\Gamma_R$ 分别是 Dirichlet 和 Robin 条件的边界部分，它们都可以为空（在这种情况下省略边界条件）；$\nu$
    是该处的法向量。函数 $c, a, f, \sigma, \mu$ 和 $b$ 是知的且应该是光滑的。模型问题 (3.1) 可以简化为各种问题，例如，当 $c=1,
    b=0, a=0$ 时变为松方程。


    让我们用积分方程重新表述问题 (3.1)。首先，我们考虑函数集 $\mathcal{W}$ 和 $\mathcal{W}⁰$：


    ```

    \mathcal{W} = \{w \in H¹(\Omega):w = u_D, x \in \Gamma_D\},

    \mathcal{W}⁰ = \{w \in H¹(\Omega):w = 0, x \in \Gamma_D\},

    ```


    其中 $H¹(\Omega)$ 是 Sobolev 空间。然后，执行一系列标准步骤以得到问题的积分公式。我们遵循第 1.2 节 中描述的投影逻辑，该方法同样适用于二维情况。通过将方程
    (3.1)乘以函数 $v \in \mathcal{W}⁰$，在区域 $\Omega$ 上积分，应用高斯定理¹ 并考虑边界条件，我们得到了如下形式公式：


    ```

    \int_{\Omega}(c\nabla u \cdot \nabla v + b \cdot \nabla uv + auv)dx + \int_{\Gamma_R}\sigma
    uvdx = \int_{\Omega}fvdx + \int_{\Gamma_R}\mu vdx.

    ```


    现在，问题可以表述为：寻找函数 $u \in \mathcal{W}$使得对于任何 $v \in \mathcal{W}⁰$，函数 $u$ 都满足方程 (3.2)。在这里，函数
    $v$ 是测试函数。


    ## 3.2 有限元定义


