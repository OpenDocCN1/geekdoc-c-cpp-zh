    omega(x)dx}} \\approx {\\sum\\limits_{k = 1}^{n}{\\gamma_{k}f(x_{k})}},} \\end{array}$$(D.3)\n\
    \n    where all *γ*[*k*] > 0 and the quadrature is exact if *f* is a polynomial\
    \ of order 2*n* − 1. Vector of quadrature weights, **γ** = {*γ*[*k*]}[*k* = 1]^(*m*),\
    \ is found from the expression\n\n    $$\\begin{array}{l} {\\gamma_{k} = U_{1k}^{2}m_{0},\\\
    quad m_{0} = {\\int\\limits_{s_{0}}^{s_{1}}{\\omega(x)dx}},} \\end{array}$$(D.4)\n\
    \n    where *U*[1*k*] is the first row of the matrix *U*, columns of which are\
    \ normalized eigenvectors (i.e., eigenvectors with unity Euclidean norm) of the\
    \ matrix *A*[*n*], and *A*[*n*] = *U**Λ**U*^(−1), *Λ* =  diag (*x*[1], …, *x*[*n*]).\n\
    \nAn important family of orthogonal polynomials are Jacobi polynomials determined\
    \ by the weight function of the form\n\n$$\\begin{array}{l} {\\omega(x) = {(1\
    \ - x)}^{\\alpha}{(1 + x)}^{\\beta},\\quad(s_{0},s_{1}) = ( - 1,1),\\quad\\alpha,\\\
    beta > - 1.} \\end{array}$$\n\nIn this case, orthogonal polynomials depend on\
    \ parameters {*α*, *β*} and first two polynomials can be expressed as\n\n$$\\\
    begin{array}{l} {P_{0}^{(\\alpha,\\beta)}(x) = 1,\\quad P_{1}^{(\\alpha,\\beta)}(x)\
    \ = \\frac{1}{2}\\left( {\\left( {\\alpha + \\beta + 2} \\right)x + \\alpha -\
    \ \\beta} \\right).} \\end{array}$$\n\nCoefficients of recurrent formula are found\
    \ through\n\n$$\\begin{array}{ll} a_{k} & {= \\frac{(2k + \\alpha + \\beta + 1)(2k\
    \ + \\alpha + \\beta + 2)}{2(k + 1)(k + \\alpha + \\beta + 1)},} \\\\ b_{k} &\
    \ {= \\frac{(\\beta^{2} - \\alpha^{2})(2k + \\alpha + \\beta + 1)}{2(k + 1)(k\
    \ + \\alpha + \\beta + 1)(2k + \\alpha + \\beta)},} \\\\ c_{k} & {= \\frac{(k\
    \ + \\alpha)(k + \\beta)(2k + \\alpha + \\beta + 2)}{(k + 1)(k + \\alpha + \\\
    beta + 1)(2k + \\alpha + \\beta)}.} \\end{array}$$(D.5)\n\nIntegral in (D.4) can\
    \ be found as follows:\n\n$$\\begin{array}{l} {m_{0} = 2^{\\alpha + \\beta + 1}\\\
    frac{\\Gamma(\\alpha + 1)\\Gamma(\\beta + 1)}{\\Gamma(\\alpha + \\beta + 2)},}\
    \ \\end{array}$$(D.6)\n\nwhere *Γ*(*x*) is a gamma function which is defined as\
    \ *Γ*(*x*) = (*x* − 1)! for any positive integer *x*. Derivatives of polynomials\
    \ can be determined through the expression\n\n$$\\begin{array}{l} {\\frac{d}{dx}P_{n}^{(\\\
    alpha,\\beta)} = \\frac{1}{2}(m + \\alpha + \\beta + 1)P_{n - 1}^{(\\alpha + 1,\\\
    beta + 1)}(x).} \\end{array}$$(D.7)\n\nLet us indicate some particular cases.\
    \ When *α* = *β* = −1/2 we obtain Chebyshev polynomials of the first type, *T*[*n*].\
    \ Parameters *α* = *β* = 0 correspond to Legendre polynomials, *L*[*n*] = *P*[*n*]^((0, 0)),\
    \ which represent an important class of polynomials for obtaining quadrature rules.\
    \ It is worth indicating that when considering Legendre polynomials, we have *ω*(*x*) = 1\
    \ and the quadrature (D.3) transforms into Gaussian quadrature rule over the interval\
    \ [−1, 1]\n\n$$\\begin{array}{l} {{\\int\\limits_{- 1}^{1}{f(x)dx}} \\approx {\\\
    sum\\limits_{k = 1}^{n}{\\gamma_{k}f(x_{k})}},} \\end{array}$$\n\nBy substituting\
    \ *α* = 0 and *β* = 0 into (D.5) and (D.6) we find the matrix coefficients (D.2)\
    \ to be *α*[*k*] = 0, *β*[*k*] = *k*²/(4*k*² − 1), and the integral *m*[0] = 2.\
    \ As a result, quadrature weights to be *γ*[*k*] = 2*U*[1*k*]² and corresponding\
    \ quadrature nodes are the eigenvalues of matrix *A*[*n*].\n\nThe nodes of the\
    \ Gaussian quadrature, being the zeros of Legendre polynomials, do not encompass\
    \ the boundaries −1 and 1 of the interval [−1, 1]. In some circumstance, it is\
    \ desirable to include these points in the boundaries. This is possible at the\
    \ price of reducing by 2 units the degree of exactness of the Gaussian quadrature\
    \ which results in Lobatto quadrature\n\n$$\\begin{array}{l} {{\\int\\limits_{-\
    \ 1}^{1}{f(x)dx}} \\approx \\frac{2}{n(n - 1)}f( - 1) + {\\sum\\limits_{k = 2}^{n\
    \ - 1}{\\gamma_{k}f(x_{k})}} + \\frac{2}{n(n - 1)}f(1).} \\end{array}$$\n\nSimilar\
    \ to the Gaussian quadrature problem stated previously, in Lobatto quadrature\
    \ we constrain *x*[1] = −1 and *x*[*n*] = 1, which means we now have less degree\
    \ of freedom and the Lobatto quadrature is exact for polynomials of order 2*m* − 3.\
    \ In this case, quadrature nodes are roots of the polynomial (1 − *x*²)*L*[*n* − 1]^′(*x*).\
    \ Indeed, *x*[1] and *x*[*n*] are the roots of (1 − *x*²), and nodes *x*[2], …, *x*[*n* − 1],\
    \ are the *n* − 2 zeros of the polynomial *L*[*n* − 1]^′, or equivalently the\
    \ points where the polynomial *L*[*n* − 1] is extremal. From (D.7) we see that\
    \ roots of *L*[*n* − 1]^′ are roots of *P*[*n* − 2]^((1, 1)), and by substituting\
    \ *α* = 1 and *β* = 1 into (D.5) and (D.6) we find the matrix coefficients (D.2)\
    \ to be *α*[*k*] = 0, *β*[*k*] = *k*(*k* + 1)/((2*k* + 1)(2*k* + 3)), and the\
    \ integral *m*[0] = 4/3. Once quadrature weights, *γ̃*[*k*], for *L*[*n* − 1]^′\
    \ are found, corresponding weights for (1 − *x*²)*L*[*n* − 1]^′ are defined as\
    \ *γ*[*k*] = *γ̃*[*k*]/(1 − *x*[*k*]²).\n\n# Appendix E Computational Framework\
    \ in Python\n\nDOI: [10.1201/9781003265979-E](https://doi.org/10.1201/9781003265979-E)\n\
    \n## E.1 ASSEMBLING MATRICES\n\nHow to calculate and assemble FEM matrices is\
    \ explained in [sections 5.3](#chapter5.xhtml_sec5_3)–[5.5](#chapter5.xhtml_sec5_5)\
    \ where MATLAB function assemba() for the vectorized version of the assembling\
    \ algorithm is given. It is straightforward to translate this function into Python\
    \ with some minor changes.\n\nBelow we provide Python code for matrix calculating\
    \ and assembling algorithm utilizing sparse matrices. It follows the structure\
    \ of the MATLAB code given in [section 5.5](#chapter5.xhtml_sec5_5).\n\n![](images/compE_1.jpg)![](images/compE_1_2.jpg)\n\
    \n## E.2 ASSEMBLING BOUNDARY CONDITIONS\n\nImplementation of boundary condition\
    \ calculation in Python is based on the approach described in [section 5.6](#chapter5.xhtml_sec5_6).\
    \ We use dictionary structure containing list of boundary segments and corresponding\
    \ function names defined on these segments. For example, by defining the function\
    \ uD(x1,x2,sdl)\n\n![](images/compE_2.jpg)\n\nwe can specify Dirichlet boundary\
    \ conditions on the first and third segments as\n\n![](images/compE_3.jpg)\n\n\
    Python implementation of the function assemblingBC() given below performs assembling\
    \ boundary conditions and repeat the logic of the corresponding MATLAB function.\n\
    \n![](images/compE_4.jpg)![](images/compE_4_2.jpg)![](images/compE_4_3.jpg)"
