- fmt: '

    # Introduction


    Programming FEM involves coding various numerical methods and binding them together
    into one pipeline. It is worth noting that every piece of the pipeline matters
    as any error introduced at any stage propagates further with accumulative effect
    which could invalidate the final result. That is why coding numerical implementation
    is an important part of numerical simulation which should not be underestimated.
    At a high level, coding includes the following main stages: Firstly, an algorithm
    of geometry discretization comes into play where final elements are generated.
    Then, based on the shape and distribution of these elements, implementation of
    particular numerical integration methods has to be coded. The next important part
    is to define an algorithm of assembling all these calculated values over individual
    finite elements into a matrix which forms linear system to be solved numerically.


    Once the FEM algorithm is coded, validation is carried out to make sure that the
    implementation is correct. This is usually done against a benchmark with a known
    analytical solution so that we can estimate error and convergence of the method
    with various discretization parameters.


    There are a large number of books on FEM including FEM mathematical analysis,
    coding FEM and solving application problems using FEM which could be helpful for
    understanding FEM algorithms. For example, a reader could find a comprehensive
    FEM analysis in [[1](#ref01.xhtml_refbib_1)] which covers finite elements of different
    types. The book by [[3](#ref01.xhtml_refbib_3)] is focussed on steady-state boundary
    value problems. It contains thorough theoretical and practical aspects of implementing
    FEM and explains how to write a finite element code from scratch. MATLAB implementation
    of FEM algorithms with detailed descriptions of numerical analysis and meshing
    techniques can be found in [[5](#ref01.xhtml_refbib_5)] and [[2](#ref01.xhtml_refbib_2)].
    Reading [[4](#ref01.xhtml_refbib_4)] and [[7](#ref01.xhtml_refbib_7)] is useful
    to learn about using Python for scientific computing. For better understanding
    of how to use specific MATLAB tools to solve differential equations, see documentation
    [[6](#ref01.xhtml_refbib_6)].


    # Chapter 1 Finite Element Method for the One-Dimensional Boundary Value Problem


    DOI: [10.1201/9781003265979-1](https://doi.org/10.1201/9781003265979-1)


    IT was mentioned in the introduction of basic concepts that the development of
    the finite element method (FEM) in practical terms was established by engineers
    to solve their structural problems. For this reason, the FEM is usually approached
    through considering displacement of a system of linear springs under applied force.
    This technique is developed from the stiffness approach applied to structural
    problems and equations arising from this technique are force-displacement relationships
    which model specific mechanics. Unlike this conventional approach, the method
    of introducing FEM in this book is based on broader formulation considering a
    generic differential equation without any structural mechanics reference. All
    particular problems, including structural ones, can be modelled as a special case
    of this generic equation.


    In this chapter we obtain FEM algorithm for linear one-dimensional second-order
    ordinary differential equation (ODE) with mixed boundary conditions. First, we
    derive integral equation for the boundary value problem and outline basic approach
    of the FEM. Then, finite elements and basis functions are introduced along with
    polynomial interpolation techniques. We show how the integral equation can be
    discretized with finite elements and how the FEM is reduced to solving linear
    system.


    ## GLOSSARY


    - **u**, **v**, **…:** vectors are written using bold fonts.

    - **(`u` · `v`):** dot product of two vectors, $\mathbf{\mathbf{u}} \cdot \mathbf{\mathbf{v}}
    = {\sum\limits_{i = 1}^{n}{u_{i}v_{i}}}$.

    - **U**, **V**, **…:** matrices are denoted by capital letters.

    - **`f`(`x`):** a function of a single variable.

    - **`f`′, `f`″, **…:** derivatives of a single variable function `f`(`x`).

    - **`C`(`a`, `b`):** set of continuous on the interval (`a`, `b`) functions.

    - **`C`^(`k`)(`a`, `b`):** set of continuous functions that have continuous first
    *k* derivatives.

    - **`L[2]`(`a`, `b`):** space of functions defined on (`a`, `b`) for which the
    second power of the absolute value is Lebesgue integrable. If `v`(`x`) ∈ `L[2]`(`a`,
    `b`), then ∥`v`∥[`L[2]`² = ∫[`a`]^(`b`)||`v`|[2]*d**x** < ∞.

    - **`H`¹(`a`, `b`):** Sobolev space defined as `H`¹(`a`, `b`) : {`v` ∈ `L[2]`(`a`,
    `b`) : `v`′ ∈ `L[2]`(`a`, `b`)}. If `v`(`x`) ∈ `H`¹(`a`, `b`), then ∥`v`∥[`H`¹]`²
    = ∫[`a`]^(`b`)(|`v`′|²)*d**x** < ∞.

    - **𝒢[m]:** set of polynomials of degree *m*.


    ## 1. FORMULATION OF THE BOUNDARY PROBLEM FOR LINEAR SECOND-ORDER ODE


    Throughout the chapter, we consider linear ODE of the form


    ```

    (c(x)u''(x))'' + b(x)u''(x) = f(x), x \in (s_0, s_1)

    ```


    Here, `c`(`x)`), `b`(`x`) and `f`(`x`) are known; `u`(`x`) is unknown to be found.
    `c`(`x)` is a coefficient of equation (1.1). `u`(`x)` is a temperature. `s_0`
    and `s_1` are boundary points.


    Note that an ODE allows multiple solutions and addition conditions are needed
    to obtain unique solution to equation (1.1). If both boundary conditions are specified
    at a single point (either `s_0` or `s_1`), then this problem is called *Cauchy
    problem*. Problem (1.1) with boundary conditions specified at both, `s_0` and
    `s_1`, is called *boundary value problem* (BVP). Cauchy problem and BVP have distinct
    properties and solution methods. This book is focussed on BVP only.


    Let us consider various types of conditions, which can be specified at a boundary
    point `s` (here, `s` could be any of `{s_0, s_1}`). For example, solution is known
    at point `s` with `u`(`s`) = `u`[`s`], which gives us Dirichlet (or first-type)
    boundary condition. Another situation is when a derivative of solution at boundary
    point is defined `u`′(`s`) = `u`[`s]`′ which is called Neumann (or second-type)
    boundary condition. Combination of Dirichlet and Neumann boundary conditions gives
    Robin (or third-type) boundary condition having `u`′(`s`) + `ρ``u`(`s`) = `μ`,
    or ±(`c``u`′)(`s`) + `σ``u`(`s`) = `μ` with corresponding choice of `σ` and `μ`
    (here, function `c`(`x`) is a coefficient of equation (1.1)). Usually, these conditions
    have some meaning depending on particular application problem. For example, in
    application to the heat equation with `u`(`x)` being a temperature, Dirichlet
    boundary condition means that a temperature at a boundary point is known, and
    Neumann boundary condition specifies heat flux at a boundary.


    If boundary conditions (BC) of different types are given for a BVP, then it is
    called that a mixed boundary condition is defined. For example, problem (1.1)
    can be complemented by BC


    ```

    u(s_0) = u_{s_0}, (cu'')(s_1) + σ u(s_1) = μ

    ```

    (1.2)

    '
