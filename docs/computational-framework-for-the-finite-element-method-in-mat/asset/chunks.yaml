  raw: 'Here, *Λ*[*m*] is called the Lebesgue constant. It can be seen that the constant
    *Λ*[*m*] represents the factor by which approximation error increases when the
    input data error is introduced. Sensitivity of the approximation method to the
    errors of input data is characterized by a conditional number which can be defined
    by the Lebesgue constant. The value of *Λ*[*m*] depends only on nodes distribution
    but not on the interval length. Asymptotic estimation shows that the Lebesgue
    constant grows logarithmically with *m* → ∞ if Chebyshev nodes are used. On the
    other hand, it grows exponentially in the case of equidistant nodes. The former
    fact leads to conclusion, that it is recommended to avoid using high order global
    interpolation polynomials having equidistant nodes distribution. Alternative approach
    is to use a piecewise local interpolation when the interval [*s*[0], *s*[1]] is
    split into subintervals and function *f* is approximated by interpolating polynomial
    of low order on each subinterval.


    # Appendix C Interpolatory Quadrature Formulas


    DOI: [10.1201/9781003265979-C](https://doi.org/10.1201/9781003265979-C)


    QUADRATURE formulas are used to approximate integrals of functions which are not
    computed exactly. The most common quadrature formulas look like


    $$\begin{array}{l} {{\int\limits_{s_{0}}^{s_{1}}{fdx}} \approx {\sum\limits_{i
    = 1}^{n}{\gamma_{i}f(x_{i})}}.} \end{array}$$


    Here *x*[*i*] are called nodes of the formula and *γ*[*i*] are called weights.


    In other words, if *φ*[*i*](*x*) are basis functions, then


    $$\begin{array}{l} {{\int\limits_{s_{0}}^{s_{1}}{fdx}} \approx {\int\limits_{s_{0}}^{s_{1}}{\sum\limits_{i
    = 1}^{n}{f(x_{i})\varphi_{i}(x)}}} = {\sum\limits_{i = 1}^{n}{f(x_{i})}}\underset{\gamma_{i}}{\underset{︸}{\int\limits_{s_{0}}^{s_{1}}{\varphi_{i}(x)dx}}}
    = {\sum\limits_{i = 1}^{n}{\gamma_{i}f(x_{i})}}.} \end{array}$$


    Obviously, if basis functions are integrated exactly then the order of precision
    of an interpolatory formula will be at least *n* − 1. Well-known rectangle formula,
    trapezoidal rule and Simpson rule are interpolatory quadrature rules corresponding
    to the polynomials of the zeroth, first and second orders, respectively.


    It is seen from the above formula that the precision of quadrature formula can
    be increased by increasing number of interpolating nodes (degree of interpolating
    polynomial). However, if there is a freedom in choosing distribution of nodes
    then the precision could be increased through particular choice of nodes location
    with fixed number *n*. This can be illustrated as follows: Suppose we have a function
    *f* defined on the interval which is approximated by a linear polynomial with
    two nodes, *x*[1] and *x*[2] (see [figure C.1](#appC.xhtml_figC_1)). Then the
    trapezoid quadrature rule gives a value of the integral equalling the area *ABCD*
    and this rule has the first order of precision. On the other hand, if we consider
    a rectangle formula with a freedom of choice of interpolation node, *x*[1]^*,
    we can find location of *x*[1]^* so that the area *AEFD* (result of rectangle
    formula) would be equal to the area *ABCD*. In this situation, the rectangle formula
    results not in the zeroth order of precision but in the first order. This is achieved
    through the particular choice of node location.


    ![An image shows three lines plotted in the coordinate system. First line has
    an arch form, and this is a source function. Second line connects corner points
    of the source function with straight line and it is labelled with letters BC.
    The third line is a straight line which goes through the middle point of the second
    one and indicated with letters EF. There are two perpendiculars to the horizontal
    axis coming from the points B and C which are labelled as BA and CD.](images/fig9_1.jpg)


    [Figure C.1:](#appC.xhtml_bfigC_1) Illustration of rectangle and trapezoid quadrature
    rules.


    There are several algorithms for computing the nodes *x*[*i*] and weights *w*[*i*]
    of Gaussian quadrature rule and one of them is given below. We start by considering
    a quadrature for the interval [−1, 1] with *n* nodes[¹](#appC.xhtml_fnC_1)


    $$\begin{array}{l} {{\int\limits_{- 1}^{1}{fdx}} \approx {\sum\limits_{i = 1}^{n}{\gamma_{i}f(x_{i})}}.}
    \end{array}$$


    Note that this formula is exact for the polynomial of some degree *N* if and only
    if it is exact for the set of functions *f* = 1, *x*, *x*², …, *x*^(*N*). This
    is equivalent to the fact that nodes and weights must satisfy the following system
    of nonlinear equations


    $$\begin{array}{l} {{\sum\limits_{i = 1}^{n}{\gamma_{i}x_{i}^{k}}} = {\int\limits_{-
    1}^{1}{x^{k}dx}} = \frac{1 - {( - 1)}^{k + 1}}{k + 1},\quad k = 0,\ldots,N.} \end{array}$$


    It can be shown that the system has unique solution if the number of unknowns
    is equal to the number of equations, so *N* = 2*n* − 1. For example, Gaussian
    quadrature with two nodes corresponds to *n* = 1 and *N* = 3. Weights and nodes
    are found from the system


    $$\begin{array}{ll} {\gamma_{1} + \gamma_{2}} & {= {\int\limits_{- 1}^{1}{dx}}
    = 2,} \\ {\gamma_{1}x_{1} + \gamma_{2}x_{2}} & {= {\int\limits_{- 1}^{1}{xdx}}
    = 0,} \\ {\gamma_{1}x_{1}^{2} + \gamma_{1}x_{2}^{2}} & {= {\int\limits_{- 1}^{1}{x^{2}dx}}
    = \frac{2}{3},} \\ {\gamma_{1}x_{1}^{3} + \gamma_{1}x_{2}^{3}} & {= {\int\limits_{-
    1}^{1}{x^{3}dx}} = 0.} \end{array}$$


    By solving it, we find the values: *γ*[1] = *γ*[2] = 1, $x_{1} = - 1/\sqrt{3},x_{2}
    = 1/\sqrt{3}$. As a result we obtain Gaussian quadrature with two nodes being
    exact for polynomials of the third order


    $$\begin{array}{l} {{\int\limits_{- 1}^{1}{fdx}} \approx f\left( {- \frac{1}{\sqrt{3}}}
    \right) + f\left( \frac{1}{\sqrt{3}} \right).} \end{array}$$


    Nodes and weights for larger values of *m* can be found tabulated in many numerical
    analysis books.


    **Conditional number of interpolatory quadrature formulas**. When computing integrals,
    an integrand is often known approximately with some error (for example, it could
    be computed with some rounding error or measured with error). As a result, instead
    of exact value of the integrand, *f*, approximated value is available, *f*^* = *f* + *ϵ*,
    having some error *ϵ*. Let us estimate sensitivity of interpolatory quadrature
    with respect to input data, or equivalently, defined a quadrature conditional
    number, *ν*. If we assume that |*f*(*x*) − *f*^*(*x*)| < *ϵ*^* ∀*x* ∈ [*s*[0], *s*[1]],
    then


    $$\begin{array}{l} {\left| {{\sum\limits_{i = 1}^{n}{\gamma_{i}f(x_{i})}} - {\sum\limits_{i
    = 1}^{n}{\gamma_{i}f^{*}(x_{i})}}} \right| \leq \epsilon^{*}{\sum\limits_{i =
    1}^{n}\left| \gamma_{i} \right|} = \nu\epsilon^{*},\quad\nu = {\sum\limits_{i
    = 1}^{n}\left| \gamma_{i} \right|}.} \end{array}$$


    As such, perturbing input data lead to increasing quadrature error by factor *ν*
    which is a conditional number. One important observation regarding the conditional
    number is that


    $$\begin{array}{l} {\nu = {\sum\limits_{i = 1}^{n}\left| \gamma_{i} \right|} \geq
    {\sum\limits_{i = 1}^{n}\gamma_{i}},} \end{array}$$


    which means that if all weights are positive we obtain the smallest conditional
    number; otherwise, we come to an ill-conditional quadrature. All weights of Gaussian
    quadrature are positive which guarantees stability with respect to input data
    errors.


    # Appendix D Quadrature Rules and Orthogonal Polynomials


    DOI: [10.1201/9781003265979-D](https://doi.org/10.1201/9781003265979-D)


    IN general case, Gaussian quadrature rule for integral numerical calculation can
    be derived using property of orthogonal polynomials. Here, we provide some basics
    of the orthogonal polynomials theory and give generic formulas to calculate quadrature
    nodes and weights. Let us start with a definition.'
