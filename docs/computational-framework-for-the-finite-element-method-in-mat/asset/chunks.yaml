    # Chapter 3 Finite Element Method for the Two-Dimensional Boundary Value Problem


    DOI: [10.1201/9781003265979-3](https://doi.org/10.1201/9781003265979-3)


    BY learning how to solve one-dimensional BVP using FEM, we have gained knowledge
    allowing us to take next step and consider two-dimensional case. Although all
    steps of the algorithm for the two-dimensional case are similar to the one-dimensional
    one, their implementations are different and require specific features and coding
    strategies to be considered.


    We begin by formulating a model problem in terms of linear partial differential
    equation with mixed boundary conditions. Then, an integral formulation of the
    model problem is given with further finite element discretization. We introduce
    basis functions and show how the discretized problem can be reduced to solving
    a linear system. Also, basic concepts of two-dimensional mesh with finite elements
    having triangular shape are discussed.


    Notations introduced in [chapter 1](#chapter1.xhtml) are used across the current
    chapter along with new ones given below.


    ## GLOSSARY


    *f(x)*: a function of multiple variables.


    *f(x)*: a multivariate function of multiple variables.


    $\frac{\partial f}{\partial x_{1}},\frac{\partial f}{\partial x_{2}},\frac{\partial^{2}f}{\partial
    x_{1}\partial x_{2}},\ldots$: partial derivatives of a function $f(x)$.


    $\nabla$: the nabla operator with definition $\nabla f = \frac{\partial f}{\partial
    x_{1}},\frac{\partial f}{\partial x_{2}}$.


    ## 3.1 MODEL PROBLEM


    Similar to the one-dimensional case, two-dimensional approach will be based on
    considering a generic BVP which can be reduced to. Consider a BVP of finding `u`
    in two-dimensional region $\Omega$ with $\Gamma = \Gamma_D \cup \Gamma_R$:


    ```

    -\nabla \cdot (c\nabla u) + b \cdot \nabla u + au = f \in \Omega

    ```

    ```

    u = u_D \in \Gamma_D

    ```

    ```

    c\nabla u \cdot \nu + \sigma u = \mu \in \Gamma_R

    ```


    Here, $\Gamma_D$ and $\Gamma_R$ are boundary parts for Dirichlet and Robin conditions,
    respectively, and either of them could be empty (in this case the boundary condition
    is omitted); $\nu$ is the unit normal vector at the point. Functions $c, a, f,
    \sigma, \mu$ and $b$ are known and supposed to be smooth. The model problem (3.1)
    can be reduced to variety of particular problems, for example, when $c=1, b=0,
    a=0$ we come to Poisson’s equation.


    Let us reformulate the problem (3.1) in terms of integral equations. First, we
    consider function sets $\mathcal{W}$ and $\mathcal{W}^0$:


    ```

    \mathcal{W} = \{w \in H^1(\Omega):w = u_D, x \in \Gamma_D\},

    \mathcal{W}^0 = \{w \in H^1(\Omega):w = 0, x \in \Gamma_D\},

    ```


    where $H^1(\Omega)$ is the Sobolev space. Then, perform a standard sequence of
    steps to come to the integral formulation of the problem. We follow the logic
    of the projective method described in [section 1.2](#chapter1.xhtml_sec1_2) which
    is equally applied to the two-dimensional case. By multiplying equation (3.1)
    by function $v \in \mathcal{W}^0$, integrating over region $\Omega$, applying
    Gauss theorem[¹](#chapter3.xhtml_fn3_1) and taking into account boundary conditions
    we come to the formulation of the problem in the form:


    ```

    \int_{\Omega}(c\nabla u \cdot \nabla v + b \cdot \nabla uv + auv)dx + \int_{\Gamma_R}\sigma
    uvdx = \int_{\Omega}fvdx + \int_{\Gamma_R}\mu vdx.

    ```


    Now, the problem can be formulated as follows: find a function $u \in \mathcal{W}$
    so that, for any $v \in \mathcal{W}^0$, the function $u$ satisfies equation (3.2).
    Here, functions $v$ are the test functions.


    ## 3.2 FINITE ELEMENTS DEFINITION

