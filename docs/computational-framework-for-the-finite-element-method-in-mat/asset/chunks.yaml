    Finally, if *Γ*[*D*] = ⌀, *Γ*[*R*] = *Γ* and *σ* = *μ* = 0 then bsN=inf, sg=[],
    mu=[].


    For convenience, we pack data (bsD,uD,bsR,sg,mu) into structure bc with corresponding
    fields.


    ## 5.7 ASSEMBLING BOUNDARY CONDITIONS


    Now, we gather all the necessary data to form the FEM system defined by (3.7)


    $$\begin{array}{l} {{\sum\limits_{j \in \mathcal{I}_{U}}{{\widetilde{A}}_{ij}u_{j}}}
    = q_{i},\quad q_{i} = {\widetilde{F}}_{i} - {\sum\limits_{j \in \mathcal{I}_{D}}{{\widetilde{A}}_{ij}u_{D_{j}}}},\,
    i \in \mathcal{I}_{U},} \end{array}$$


    where the matrix *Ã* = {*Ã*[*i**j*]}[*i*, *j* = 1]^(*n*[*p*]) = *A* + *S*, **F̃** = {*F̃*[*i*]}[*i* = 1]^(*n*[*p*]) = **F** + **M**,
    ℐ[*D*] are the indices of the points with Dirichlet boundary conditions, and ℐ[*U*]
    are the rest points.


    Function assemblingAF() (see [section 5.5](#chapter5.xhtml_sec5_5)) calculates
    matrix *A* and vector **F** and we need a similar function to calculate *S* and
    **M**. In addition, this function would enable us calculating vector **U**[*D*]
    with *n*[*p*] elements such that all its elements are equal to zero apart from
    elements with indices *j* ∈ ℐ[*D*] having value of *u*[*D*[*j*]].


    Matrix *Ã*[ℐ[*U*]] = {*Ã*}[*i*, *j* ∈ ℐ[*U*]] is obtained from the matrix *Ã*
    by deleting rows and columns with indices belonging to the set ℐ[*D*]. To perform
    this operation we introduce a matrix *N* ∼ (*n*[*p*] × *m*) where *m* is the number
    of elements in the set ℐ[*U*] and


    $$\begin{array}{l} {N^{T} \cdot {(u_{1},u_{2},\cdots,u_{n_{p}})}^{T} = {(u_{i_{1}},u_{i_{2}},\cdots,u_{i_{U}})}^{T}.}
    \end{array}$$


    Matrix *N* can be defined as N=sparse([i1,i2,%,in],1:m,1,np,m). Consequently,
    if *S*, **M**, *N*, and **u**[*D*] are calculated, then matrix *Ã* and vector
    **q** are defined through the following expressions


    $$\begin{array}{l} {{\widetilde{A}}_{\mathcal{I}_{U}} = N^{T}(A + S)N,\quad\mathbf{\mathbf{q}}
    = N^{T}((\mathbf{\mathbf{F}} + \mathbf{\mathbf{M}}) - (A + S)\mathbf{\mathbf{U}}_{D}).}
    \end{array}$$


    Note that after solving the system *Ã*[ℐ[*U*]]**u** = **q** the final vector
    of solution at the node points can be obtained as **U** = *N***u** + **U**[*D*]
    (complementing vector **u** by the boundary values **U**[*D*]). As a result, we
    come to the function assemblingBC() in [listing 5.21](#chapter5.xhtml_list5_21)
    which calculates contributions from the boundary elements.


    ![](images/comp05_22.jpg)![](images/comp05_22_2.jpg)


    For clarification, MATLAB function t=ismember(a,b) returns Boolean vector such
    that t(k)=1 if a(k) ∈ b and t(k)=0 if a(k) ∉ b.


    Functions described above allow us forming and solving FEM system. As a final
    step, we provide a function assemblingPDE() in [listing 5.22](#chapter5.xhtml_list5_22)
    which assembles a PDE problem and solves it using FEM. Depending on the number
    of output arguments, it returns either FEM matrices or a final solution vector.


    ![](images/comp05_23.jpg)


    Functions assemblingAF() and assemblingPDE() translated into Python programming
    language can be found in [Appendix E.2](#appE.xhtml_appE).


    ## 5.8 SOLVING EXAMPLE PROBLEM


    Let us apply function assemblingPDE() to solve an example problem. We consider
    PDE of the form


    $$\begin{array}{l} {- \nabla \cdot \left( {c(\mathbf{\mathbf{x}})\nabla u} \right)
    + \mathbf{\mathbf{b}}(\mathbf{\mathbf{x}}) \cdot \nabla u + a(\mathbf{\mathbf{x}})u
    = f(\mathbf{\mathbf{x}}),\quad\mathbf{\mathbf{x}} = (x_{1},x_{2}) \in \Omega,}
    \end{array}$$


    with boundary conditions


    $$\begin{array}{ll} & {u(\mathbf{\mathbf{x}}) = u_{D}(\mathbf{\mathbf{x}}),\,\mathbf{\mathbf{x}}
    \in \Gamma_{D};} \\ & {c(\mathbf{\mathbf{x}})\nabla u \cdot \mathbf{\mathbf{\nu}}(\mathbf{\mathbf{x}})
    + \sigma(\mathbf{\mathbf{x}})u = \mu(\mathbf{\mathbf{x}}),\,\mathbf{\mathbf{x}}
    \in \Gamma_{R},} \end{array}$$


    where Ω is a circle of the unity radius. [Figure 5.3](#chapter5.xhtml_fig5_3)
    shows boundaries of the circle having four segments, where *Γ*[*D*] comprises
    segments 1 and 3, and *Γ*[*R*] comprises segments 2 and 4.


    ![An image shows a geometry having shape of circle with unity radius. A boundary
    of the circle is split into four parts and every part is shown as directed arch
    with label.](images/fig5_3.jpg)


    [Figure 5.3:](#chapter5.xhtml_b5fig5_3) Geometry for the example problem.


    We define coefficients


    $$\begin{array}{ll} c & {= 2 + x_{1} + x_{2},} \\ a & {= x_{1} + x_{2},} \\ \mathbf{\mathbf{b}}
    & {= (x_{1},x_{2}),} \\ f & {= - 8 - 6(x_{1} + x_{2}) + (2 + x_{1} + x_{2})(x_{1}^{2}
    + x_{2}^{2}),} \end{array}$$


    and boundary conditions


    $$\begin{array}{ll} u_{D} & {= x_{1}^{2} + x_{2}^{2},} \\ \sigma & {= \left\{
    \begin{array}{ll} {0,} & {\text{on~}2^{nd}\text{~segment},} \\ {2,} & {\text{on~}4^{th}\text{~segment~},}
    \end{array}~ \right.} \\ \mu & {= \left\{ \begin{array}{ll} {2(2 + x_{1} + x_{2})u_{D},}
    & {\text{~on~}2^{nd}\text{~segment},} \\ {2(2 + x_{1} + x_{2} + 1)u_{D},} & {\text{on~}4^{th}\text{~segment}\text{.}}
    \end{array}~ \right.} \end{array}$$


    Boundary conditions *σ* and *μ* can be coded through the functions


    ![](images/comp05_24.jpg)![](images/comp05_25.jpg)![](images/comp05_26.jpg)


    It is easy to see that solution to this problem is given by function *u* = *x*[1]² + *x*[2]².
    We utilize function assemblingPDE() to solve this problem numerically on the meshes
    with h = [0.5 0.1 0.05 0.02]. Since the exact solution is known we can find an
    absolute error


    $$\begin{array}{l} \left. err = \max\limits_{x \in \mathcal{T}_{h}} \middle| u(x)
    - u_{h}(x) \middle| , \right. \end{array}$$


    and relative error, *e**r**r*[*h*] = *e**r**r*/*h*². Function testPDE in [listing
    5.26](#chapter5.xhtml_list5_26) solves this problem and calculates FEM solution
    errors.


    ![](images/comp05_27.jpg)


    As a result we obtain [tables 5.4](#chapter5.xhtml_tbl5_4) and [5.5](#chapter5.xhtml_tbl5_5)
    summarizing testing data.


    [Table 5.4:](#chapter5.xhtml_b5tbl5_4) Summary of the solving test problem. Last
    three columns contain CPU time for the corresponding functions.


    | np | assemblingAF | assemblingBC | solving |


    | --- | --- | --- | --- |


    | 33 | 0.00195 | 0.00586 | 0.00293 |


    | 544 | 0.00195 | 0.00195 | 0.00683 |


    | 2169 | 0.00586 | 0.00195 | 0.02344 |


    | 13525 | 0.05859 | 0.00683 | 0.31348 |


    [Table 5.5:](#chapter5.xhtml_b5tbl5_5) Errors when solving the test problem numerically.


    | np | 33 | 544 | 2169 | 13525 |


    | --- | --- | --- | --- | --- |


    | err | 0.07266 | 0.00252 | 0.00093 | 0.00013 |


    | errh2 | 0.29066 | 0.25173 | 0.37120 | 0.32498 |


    Data for error magnitudes in [table 5.5](#chapter5.xhtml_tbl5_5) indicate that
    the problem has been solved successfully. Absolute error decreases with mesh resolution
    refining while relative error remains stable with slight fluctuation.'
