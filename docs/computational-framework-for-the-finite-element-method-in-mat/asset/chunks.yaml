    this algorithm depends on the choice of particular quadrature rule. It is worth
    noting that if the final elements are of the same length having the same quadrature
    and interpolation node distribution, then matrices *Ê* and *D̂* have to be calculated
    only once.


    Quadrature nodes and weights distribution have to meet certain criteria to be
    suitable for numerical integration with appropriate accuracy. Below, we discuss
    some strategies of choosing nodes distribution.


    ## 1.6 QUADRATURE RULES


    As we have seen, calculating elements of FEM matrices includes numerical integration
    which can be done through applying some quadrature rule.


    $$\begin{array}{l} {\int\limits_{0}^{1}\hat{f}d\hat{x} \approx {\sum\limits_{k
    = 1}^{q}{{\hat{\gamma}}_{k}\hat{f}({\hat{d}}_{k})}}.} \end{array}$$


    Choosing particular values of number *q*, node values, *d̂*[*k*], and weights,
    *γ̂*[*k*], results in different quadrature rules. Below, we utilize two types
    of quadrature, namely, Gaussian quadrature and Lobatto quadrature rule. [Appendix
    C](#appC.xhtml_appC) gives some theoretical background for these rules where basic
    explanations and examples are given. In addition, theory on calculations of weights
    and nodes using orthogonal polynomials is given in [Appendix D](#appD.xhtml_appD).
    Below, we use expressions without detailed explanations which can be found in
    the given appendices.


    First, we consider Gaussian quadrature for integrals over the interval [−1, 1]
    which is the most common and well-studied domain of integration. Integration over
    the interval *[*0,1*]* can be obtained from the integration over the interval
    [−1, 1] through the transformation *x̂* = 1/2 + *x̃*/2, *x̃* ∈ [−1, 1]


    $$\begin{matrix} {\int\limits_{0}^{1}\hat{f}d\hat{x} = \frac{1}{2}\int\limits_{-
    1}^{1}\widetilde{f}d\widetilde{x} \approx \frac{1}{2}{\sum\limits_{k = 1}^{q}{{\widetilde{\gamma}}_{k}\widetilde{f}({\widetilde{d}}_{k})}}
    = {\sum\limits_{i = 1}^{q}{{\hat{\gamma}}_{k}\hat{f}({\hat{d}}_{k})}},} \\ {{\hat{\gamma}}_{k}
    = \frac{1}{2}{\widetilde{\gamma}}_{k},\quad{\hat{d}}_{k} = \frac{1}{2} + \frac{{\widetilde{d}}_{k}}{2}.}
    \end{matrix}$$


    It is worth mentioning that Gaussian quadrature is a type of quadrature formula,
    which has the highest order of precision with the given number of nodes, *q*,
    which is equal to 2*q* − 1. Nodes, *d̃*[*k*], are the roots of Legendre polynomials,
    *L*[*q*](*x̃*), of order *q*. In general, nodes and weights can be calculated
    using eigenvalue decomposition of the following square matrix


    $$\begin{array}{l} {Q = \left( \begin{array}{lllll} 0 & \beta_{1} & & & \\ & &
    & & \\ \beta_{1} & 0 & \beta_{2} & & \\ & & & & \\ & \ddots & \ddots & \ddots
    & \\ \, & & \beta_{q - 2} & 0 & \beta_{q - 1} \\ & & & \beta_{q - 1} & 0 \end{array}
    \right),\quad\begin{array}{l} {\beta_{j} = \frac{j}{\sqrt{4j^{2} - 1}},} \\ {\,\,\,
    j = 1,\ldots,q - 1.} \end{array}} \end{array}$$(1.87)


    If *Q* = *U**Λ**U*^(−1), where *Λ* =  diag (*λ*[1], …, *λ*[*q*]) is a diagonal
    matrix of ordered eigenvalues and *U* is a matrix of corresponding eigenvectors,
    then Gaussian quadrature nodes are *d̃*[*k*] = *λ*[*k*] and the weights are *γ̃*[*k*] = 2*U*[1*k*]².


    One important observation about Gaussian quadrature is that there is no guarantee
    that the set of nodes contains boundary points, −1 or 1\. In order to include
    the end points of the integration, Lobatto quadrature can be used


    $$\begin{array}{l} {\int\limits_{- 1}^{1}\widetilde{f}d\widetilde{x} \approx {\widetilde{\gamma}}_{1}\widetilde{f}(
    - 1) + {\sum\limits_{k = 2}^{q - 1}{{\widetilde{\gamma}}_{k}\widetilde{f}({\widetilde{d}}_{k})}}
    + {\widetilde{\gamma}}_{q}\widetilde{f}( - 1).} \end{array}$$


    This type of quadrature has the precision of order 2*q* − 3 where quadrature nodes
    are roots of the polynomial (1 − *x̃*²)*L*[*q* − 1]^′(*x̃*). Value of nodes and
    weights can be found through the eigenvalue decomposition *Q* = *U**Λ**U*^(−1)
    of the matrix


    $$\begin{array}{l} {Q = \left( \begin{array}{lllll} 0 & \beta_{1} & & & \\ & &
    & & \\ \beta_{1} & 0 & \beta_{2} & & \\ & & & & \\ & \ddots & \ddots & \ddots
    & \\ \, & & \beta_{q - 2} & 0 & \beta_{q - 3} \\ & & & \beta_{q - 3} & 0 \end{array}
    \right),\quad\begin{array}{l} {\beta_{j} = \sqrt{\frac{j(j + 2)}{(2j + 1)(2j +
    3)}},} \\ {\,\,\, j = 1,\ldots,q - 3.} \end{array}} \end{array}$$


    Nodes of Lobatto quadrature are **d̃** = {−1, *λ*[*i*], 1} and weights to be


    $$\begin{array}{l} {\mathbf{\widetilde{\gamma}} = \left\{ {\frac{2}{q^{2} - q},\frac{4U_{1i}^{2}}{3(1
    - \lambda_{i})},\frac{2}{q^{2} - q}} \right\},\, i = 1,\ldots,q - 2,} \end{array}$$


    where *λ*[*i*] and *U*[*i*] are the eigenvalues of matrix *Q*. Lobatto quadrature
    nodes can be chosen to be interpolation nodes on the basis element. In this case,
    *q* = *m* + 1 and *x̂*[*α*] = *d̂*[*α*] = (1 + *d̃*[*α*])/2.


    ## 1.7 DEFINING PARAMETERS OF THE FEM


    From the previous sections we have learned that there are three parameters defining
    particular FEM scheme: the number of finite elements, *n*, the degree of approximating
    polynomial, *m*, and the number of quadrature nodes on the basis element, *q*.
    To build an efficient FEM implementation, it is worth analysing influence of these
    parameters since they affect property of stiffness matrices and accuracy of the
    FEM. Below we discuss various points which need to be taken into account when
    creating particular FEM scheme.


    **Structure of the stiffness matrix**. Numbers *n* and *m* determine uniquely
    the structure of the global stiffness matrix, *A*, in terms of distribution of
    the non-zero entries. If *n* ≫ *m*, then the matrix *A* is the sparse one containing
    large number of zeroth elements. Contrarily, when *n* is small but *m* is large,
    then the matrix *A* is considered to be dense (see [figure 1.7](#chapter1.xhtml_fig1_7)).'
