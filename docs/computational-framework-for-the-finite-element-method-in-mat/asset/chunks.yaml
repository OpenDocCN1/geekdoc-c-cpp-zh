    ### 1.3.3 Linear System of the FEM


    As shown above, the FEM of the BVP (1.1)–(1.2) solves equation (1.18) for unknown
    function *u*[*h*] and with arbitrary *v*[*h*]. Introducing a basis in *H*[*h*]^(*m*)(*s*[0], *s*[1])
