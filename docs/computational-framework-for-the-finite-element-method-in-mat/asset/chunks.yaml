  trans: '


    代码实现中主要的数据结构是矩阵，因此假设读者熟悉 MATLAB 和 Python 中矩阵操作命令的基本技能。然而，矩阵有一种特殊情况，我们将详细讨论，即稀疏矩阵。正如我们在第
    1 章中所所示，有限元法（FEM）产生的矩阵具有稀疏结构，我们需要在编码中反映这一点。


    ## 2.1 MATLAB 中的稀疏矩阵^®


    在 FEM 算法实现中利用的基本结构是稀疏矩阵。稀疏矩阵的主要特征是在忽略且不在内存中保留零元素时，数据表示是紧凑的。在 MATLAB 中对稀疏矩阵的操作与对满矩阵的操作相似。区别在于，稀疏矩阵应该使用
    `sparse()` 指定进行创建。在 MATLAB 中创建稀疏矩阵有三种方法。


    1. 从密矩阵创建稀疏矩阵。在这种情况下，函数 `sparse()` 的参数是一个密矩阵，返回值为形状和数值与密矩阵相同的稀疏矩阵。例如，


    ![](img/comp02_1.jpg)


    稀疏矩阵以非零元素索引及其对应值的形式表示。因此，我们看到了索引数组 `(i,j)` 和对应的数值。


    2. 通过元素创建稀疏矩阵。上一个矩阵可以如下所示指定


    ![](img/comp02_2.jpg)


    在这里，我们将矩阵维度作为函数 `sparse()` 的参数，然后为矩阵元素赋值。


    3. 从索引数组和数值数组创建稀疏矩阵。例如，接下来的代码从之前的示例中创建了矩阵 `A`。


    ![](img/comp02_3.jpg)


    一般情况下，索引向量中的值可能会重复，在这种情况下，对应的值会被求和。这允许通过累积元素来形成矩阵 `A`。例如，矩阵 `A` 可以指定为：


    ![](img/comp02_4.jpg)


    在这里 `A(1,1)=0.3+0.7`。值得注意的是，`(i,j)` 可以指定为二维矩阵。在这种情况下，函数 `sparse()` 将它们视为列向量。此外，值
    `v` 可以是一个标量，它将自动扩展为具有相应长度的向量，且所有元素均为 `v`。


    第三种方法优适用于创建大型稀疏矩阵，因为它更具通用，并且反映了矩阵在 MATLAB 内部的表示方式。


    ## 2.2 输入数据结构


    让我们定义用于 MATLAB 实现的输入数据结构。特定的边界值问题（BVP）由以下项定义：


    1. 指定边界的数值 `s[0]` 和 `s[1]`；

    2. 指定 BVP 系数的函数 `c(x)`、`b(x)`、`a(x)` 和 `f(x)`；

    3. 在点 `s[0]` 和 `s[1]` 处的边界条件的类型。


    第 (1) 点没有特殊之处，而 (2) 和 (3) 在 MATLAB 结构方面的表示需要阐明。MATLAB 中的函数可以通过匿名内联声明定义：


    ```

    f = @(x) sin(x)

    ```


    或者使用包含函数定义的独立 `.m` 文件


    ![](img/comp02_5.jpg)


    只要可能，我们都力使用向量化计算，这在计算成本方面要高效得多。如果有一个向量


    ```

    x = [x1,…xn],

    ```


    函数调用 `y = f(x)` 返回一个向量


    ```

    y = [f(x1),…,f(xn)]

    ```


    我们对向量变量进行操作，而不是对单个分量。


    考虑到第 (3) 点，我们可以矩阵来指定边界条件。让我们引入一个维度为 $2 \times 3$ 的矩阵 `bc`，它封装了所有的边界条件数据。第一行对应点
    `s0` 处的 BC，第二行包含边界点 `s1` 的数据。第一列表示 BC 的类型，第二三列包含对应的数据。例如，`bc(1,:)=[1,0,u_s0]`
    用于点 `s0` 处第一类 BC，而 `bc(2,:)=[3,sigma,mu]` 用于点 `s1` 处的第三类 BC。


    下面将按照上述考虑的 BEM 算法步骤的反向顺序给出算法实现的 MATLAB 代码，即我们从编码积分规则开始，并以求解 BEM 的线性方程组结束。所有实现将基于推导出的表达式。


    ## 2.3 积分规则编码


    任意区间 `[s1,s2]` 上的高斯积分节点和权重可以通过列表 2.1 计算。函数 `GaussQuad()` 输入点数 `n`、区间的左边界 `s0`、右边界
    `s1`，并返回一对向量 `d` 和 `w`，分别是积分节点和权重。在这里，积分节点是勒让德多项式的零点。该函数可以接受三个或一个参数，在只有一个参数的情况下，假设在区间
    `[-1,1]` 上寻找节点。此逻辑实现在第 2–4 行通过 MATLAB 函数 `nargin` 实现，该函数返回在当前执行的函数调用中给出的输入参数个数。代码行
    8–10 计算矩阵 `Q` 的元素（见 (1.87)）并使用对角装配组成矩阵。函数 `diag(bta,k)` 将向量 `bta` 的元素置于第 `k` 条对角线上（`k=0`
    表示主对角线，`k=1` 表示主对角线上方）。此处，`(i,j)` 可以指定为二维矩阵。在这种情况下，函数 `sparse()` 将它们视为列向量。此外，值
    `v` 可以是一个标量，它将自动扩展为具有相应长度的向量，且所有元素均为 `v`。


    第三种方法是创建大型稀疏矩阵的首选，因为它更具通用，并且反映了矩阵在 MATLAB 内部的表示方式。


    类似于，Lobatto 积分实现可以如列表 2.2 所示所示编码。我们需要确保输入的节点数等于或大于二（第 2–5 行）。与高斯积分规则相比，矩阵元素的计算方式不同（第
    14 行），并将边界点加入节点和权重（第 19–20 行）。回想 Lobatto 积分节点可以取区间 `[s0,s1]` 上的插值节点。


    ![](img/comp02_6.jpg)


    ## 2.4 插值与微分矩阵实现代码


    插值矩阵 `E` 和 `D` 用于计算任意点的函数 `u[h]` 及其导数。这些矩阵由基函数定义，计算这些函数时我们利用表达式 (1.13) 和 (1.14)


    $$

    \begin{array}{ll}

    \beta_{\alpha} & {= \left( {\prod\limits_{j = 1,j \neq \alpha}^{m + 1}{({\hat{x}}_{\alpha}
    - {\hat{x}}_{j})}} \right)^{- 1},}

    \end{array}

    $$


    $$

    \begin{array}{ll}

    \hat{E}_{k,\alpha} & {= {\hat{\varphi}_{\alpha}({\hat{d}}_{k}) = \beta_{\alpha}{\prod\limits_{j
    = 1,j \neq \alpha}^{m + 1}{({\hat{d}}_{k} - {\hat{x}}_{j})}},

    \end{array}

    $$


    $$

    \begin{array}{ll}

    \hat{D}_{k,\alpha} & {= {\hat{\varphi}_{\alpha}''({\hat{d}}_{k}) = \beta_{\alpha}{\sum\limits_{l
    = 1,l \neq \alpha}^{m + 1}{\prod\limits_{j = 1,j \neq \alpha,j \neq l}^{m + 1}{({\hat{d}}_{k}
    - {\hat{x}}_{j})}}}.}

    \end{array}

    $$


