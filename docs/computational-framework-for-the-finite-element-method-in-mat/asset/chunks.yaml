    接下来，我们考虑单元 `τ` 上的基函数的表示。为了得到基函数的表达式，我们使用了一种同样适用于任何类型具有直边的三角形单元的方法（例如，六节点三角形单元或
    $\mathcal{G}[2]$ 单元）。其核心思想是在坐标系 $\hat{\mathbf{\mathbf{x}}} = ({\hat{x}}_{1},{\hat{x}}_{2})$
    上考虑一个标准单元 $\hat{\tau}$，在该单元上基函数具有简单的已知形式。然后，单元 `τ` 的基函数通过坐标变换推导。为了说明这种方法，让我们考虑图
    5.2 所示的两个单元，其中标准单元 $\hat{\tau}$ 的顶点坐标为 $\hat{\mathbf{\mathbf{p}}_{1}} = (0,0),\,\hat{\mathbf{\mathbf{p}}_{2}}
    = (1,0),\,\hat{\mathbf{\mathbf{p}}_{3}} = (0,1)$,而任意的三节点单元 `τ` 的顶点为 `p[1]`、`p[2]`
    和 `p[3]`。在这种情况下，以下函数


    $$\begin{array}{l} {{\hat{\varphi}}_{1}(\hat{\mathbf{\mathbf{x}}}) = 1 - {\hat{x}}_{1}
    - {\hat{x}}_{2},\quad{\hat{\varphi}}_{2}(\hat{\mathbf{\mathbf{x}}}) = {\hat{x}}_{1},\quad{\hat{\varphi}}_{3}(\hat{\mathbf{\mathbf{x}}})
    = {\hat{x}}_{2}} \end{array}$$


    ![图像显示了两个三角形，左侧是标准三角形，右侧位于图像中心。标准三角形是一个等腰直三角形，右侧是一个没有任何特定属性的普通三角形。](img/fig5_2.jpg)


    图 5.2： 标准单元 $\hat{\tau}$ 和原始 $\mathcal{G}[1]$ 网格单元 `τ`。


    代表单元 $\hat{\tau}$ 上的基函数，且显然 ${\hat{\varphi}}_{i}(\hat{\mathbf{\mathbf{p}}_{j}})
    = \delta_{ij}$。从 $\hat{\tau}$ 到 `τ` 的变换由下式给出：


    $$\begin{array}{l} {\mathbf{\mathbf{x}} = \mathbf{\mathbf{p}}_{1}{\hat{\varphi}}_{1}
    + \mathbf{\mathbf{p}}_{2}{\hat{\varphi}}_{1} + \mathbf{\mathbf{p}}_{3}{\hat{\varphi}}_{1}
    = \mathbf{\mathbf{p}}_{1} + {\hat{x}}_{1}(\mathbf{\mathbf{p}}_{2} - \mathbf{\mathbf{p}}_{1})
    + {\hat{x}}_{2}(\mathbf{\mathbf{p}}_{3} - \mathbf{\mathbf{p}}_{1}).} \end{array}$$$(5.4)


    事实上，这是一个仿射变换，它将 $\hat{\tau}$ 的顶点映射到 `τ` 的顶点，同时保持了标准单元的方向，并将 (0, 0) $\rightarrow$
    `p[1]`， (1, 0) $\rightarrow$ `p[2]`， (0, 1) $\rightarrow$ `p[3]`。在引入符号后


    $$\begin{array}{l} {B_{\tau} = \left( \begin{array}{ll} {(\mathbf{\mathbf{p}}_{2}
    - \mathbf{\mathbf{p}}_{1})}_{1} & {(\mathbf{\mathbf{p}}_{3} - \mathbf{\mathbf{p}}_{1})}_{1}
    \\ {(\mathbf{\mathbf{p}}_{2} - \mathbf{\mathbf{p}}_{1})}_{2} & {(\mathbf{\mathbf{p}}_{3}
    - \mathbf{\mathbf{p}}_{1})}_{2} \end{array} \right),} \end{array}$$$(5.5)


    变换可以重写为矩阵形式


    $$\begin{array}{l} \left. \mathbf{\mathbf{x}} = B_{\tau}\hat{\mathbf{\mathbf{x}}}
    + \mathbf{\mathbf{p}}_{1}\quad:\quad\hat{\tau}\rightarrow\tau \right. \end{array}$$$(5.6)


    其中雅可比行列式 `J[τ]` = `det B[τ]` > 0。结果，单元 `τ` 的面积定义为


    $$\begin{array}{l} \left| \tau \middle| = {\int\limits_{\tau}{d\mathbf{\mathbf{x}}}
    = {\int\limits_{\tau}{\det B_{\tau}d\hat{\mathbf{\mathbf{x}}}}} = \middle| \hat{\tau}
    \middle| \det B_{\tau} = \frac{1}{2}J_{\tau}. \right. \end{array}}$$


    逆变换的形式为 $\hat{\mathbf{\mathbf{x}}} = B_{\tau}^{- 1}(\mathbf{\mathbf{x}} - \mathbf{\mathbf{p}}_{1})$，其中


    $$\begin{array}{l} {B_{\tau}^{- 1} = \frac{1}{\det B_{\tau}}\left( \begin{array}{ll}
    {(\mathbf{\mathbf{p}}_{3} - \mathbf{\mathbf{p}}_{1})}_{2} & {- {(\mathbf{\mathbf{p}}_{3}
    - \mathbf{\mathbf{p}}_{1})}_{1}} \\ {- {(\mathbf{\mathbf{p}}_{2} - \mathbf{\mathbf{p}}_{1})}_{2}}
    & {(\mathbf{\mathbf{p}}_{2} - \mathbf{\mathbf{p}}_{1})}_{1} \end{array} \right)
    = \left( \begin{array}{ll} \widetilde{d} & {- \widetilde{b}} \\ {- \widetilde{c}}
    & \widetilde{a} \end{array} \right).} \end{array}$$


    因此，


    $$\begin{array}{ll} {\hat{x}}_{1} = \widetilde{d}(x_{1} - (\mathbf{\mathbf{p}}_{1})}_{1})
    - \widetilde{b}(x_{2} - (\mathbf{\mathbf{p}}_{1})}_{2}), \\ {\hat{x}}_{2} = -
    \widetilde{c}(x_{1} - (\mathbf{\mathbf{p}}_{1})}_{1}) + \widetilde{a}(x_{2} -
    (\mathbf{\mathbf{p}}_{1})}_{2}). \end{array}$$


    单元 `τ` 上的基函数 `φi` 通过变换从单元 $\hat{\tau}$ 上的基函数得到：`φi = \hat{\varphi}i)`。结果如下：


    $$\begin{array}{ll} \varphi_{1}(x) = 1 - \varphi_{2}(x) - \varphi_{3}(x), \\ \varphi_{2}(x)
    = \widetilde{d}(x_{1} - (\mathbf{\mathbf{p}}_{1})}_{1}) - \widetilde{b}(x_{2}
    - (\mathbf{\mathbf{p}}_{1})}_{2}), \\ \varphi_{3}(x) = - \widetilde{c}(x_{1} -
    (\mathbf{\mathbf{p}}_{1})}_{1}) + \widetilde{a}(x_{2} - (\mathbf{\mathbf{p}}_{1})}_{2}).
    \end{array}$$


    相应的，基函数的梯度的形式为


    $$\begin{array}{l} \nabla\varphi_{1} = \left( \begin{array}{l} \widetilde{c} -
    \widetilde{d} \\ \widetilde{b} - \widetilde{a} \end{array} \right),\quad\nabla\varphi_{2}
    = \left( \begin{array}{l} \widetilde{d} \\ {- \widetilde{b}} \end{array} \right),\quad\nabla\varphi_{3}
    = \left( \begin{array}{l} {- \widetilde{c} \\ \widetilde{a} \end{array} \right).
    \end{array}$$


    值得注意的是，`φi` = 1/3，$i=1,2,3$，且对于梯度我们有


    $$\begin{array}{l} \nabla\varphi_{i}(x) = B_{\tau}^{- 1}^T\hat{\nabla}\varphi_{i}(\hat{x}).
    \end{array}$$


    对于任何类型的单元 `τ`，以下等式有效：


    $$\begin{array}{l} {{\sum_{i = 1}^{m_{\tau}}\varphi_{i}(x)} = 1,\quad{\sum_{i
    = 1}^{m_{\tau}}\nabla\varphi_{i}(x)} = (0,0)^{T},\quad\mathbf{x} \in \tau, \end{array}$$


