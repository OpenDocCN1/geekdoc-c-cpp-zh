    ## 1.4 ILLUSTRATIVE PROBLEM


    One of the reasons of the success of the FEM is that it may be applied to problems
    of great complexity; however, to use such problems for illustrative purpose tends
    to obscure the underlying ideas. In this section a simple problem is solved. Note
    that this is not to suggest that the FEM is the best method for solving such problems.
    In fact, there are other numerical methods available which are superior. However,
    this particular problem involves only small amount of algebra, and the algorithm
    ideas come through quite well.


    Consider the BVP having the form


    $$\begin{array}{l} {- u^{''''} + u = x,\quad x \in (0,1),\quad u(0) = 1,\quad
    u''(1) = 1,} \end{array}$$$(1.26)


    with known exact solution


    $$\begin{array}{l} {u = \frac{e^{2 - x} + e^{x}}{1 + e^{2}} + x.} \end{array}$$$(1.27)


    It can be seen from comparing with generic BVP (1.1)–(1.2) that the problem (1.26)
    corresponds to the coefficient values `c(x)` = 1, `b(x)` = 0, `a(x)` = 1, `σ(x)`
    = 0, `μ(x)` = 1. Consider a three-element discretization of `[0,1]` with nodes
    {x[1]` = 0, `x[2]` = 1/3, `x[3]` = 2/3, `x[4]` = 1}.


    $$\begin{array}{l} {e_{1} = \left\lbrack {0,\frac{1}{3}} \right\rbrack,\quad e_{2}
    = \left\lbrack {\frac{1}{3},\frac{2}{3}} \right\rbrack,\quad e_{2} = \left\lbrack
    {\frac{2}{3},1} \right\rbrack.} \end{array}$$$(1.28)


    There are four basis functions associated with four interpolation nodes which
    gives the following form of the approximate solution


    $$\begin{array}{l} {u_{h} = u(0)\varphi_{1}(x) + u\left( \frac{1}{3} \right)\varphi_{2}(x)
    + u\left( \frac{2}{3} \right)\varphi_{3}(x) + u(1)\varphi_{4}(x).} \end{array}$$$(1.29)


    Function value `u(0)` = 1 is known from the BC and the rest values, `u(1/2)`,
    `u(2/3)` and `u(1)` have to be found.


    In each element there are just two nodes; hence, the interpolation polynomials
    for each element must be linear. Basis functions associated with each node are
    found from (1.11) and have the form


    $$\begin{array}{ll} & {\varphi_{1}(x) = \left\{ \begin{array}{ll} {- 3x + 1,}
    & {0 \leq x \leq \frac{1}{3},} \\ {0,} & {\frac{1}{3} < x < 0,} \end{array}~ \right.}
    \end{array}$$$(1.30)


    $$\begin{array}{ll} & {\varphi_{2}(x) = \left\{ \begin{array}{ll} {3x,} & {0 \leq
    x \leq \frac{1}{3},} \\ {- 3x + 2,} & {\frac{1}{3} \leq x \leq \frac{2}{3},} \\
    {0,} & {\frac{2}{3} < x < 0,} \end{array}~ \right.} \end{array}$$$(1.31)


    $$\begin{array}{ll} & {\varphi_{3}(x) = \left\{ \begin{array}{ll} {3x - 1,} &
    {\frac{1}{3} \leq x \leq \frac{2}{3},} \\ {- 3x + 3,} & {\frac{2}{3} \leq x \leq
    1,} \\ {0,} & {1 < x < \frac{1}{3},} \end{array}~ \right.} \end{array}$$$(1.32)


    $$\begin{array}{ll} & {\varphi_{4}(x) = \left\{ \begin{array}{ll} {3x - 2,} &
    {\frac{2}{3} \leq x \leq 1,} \\ {0,} & {1 < x < \frac{2}{3}.} \end{array}~ \right.}
    \end{array}$$$(1.33)


    Basis functions are shown in [figure 1.6](#chapter1.xhtml_fig1_6) and they have
    so-called hat shapes. Note that `φ[1]` and `φ[4]` are nonzero over one element
    while `φ[2]` and `φ[3]` span two elements. ![A graph shows four linear basis functions
    having “hat” shapes. Every basis function hits the value of one at interpolation
    point with which it is associated and has zeroth value outside boundary of corresponding
    finite element.](images/fig1_6)


    [Figure 1.6:](#chapter1.xhtml_b1_6) Lagrange basis functions corresponding to
    spline with finite elements `e[1]` = [0,1/3], `e[2]` = [1/3,2/3] and `e[3]` =
    [2/3,1] having nodes `x[1]` = 0, `x[2]` = 1/3, `x[3]` = 2/3, `x[4]` = 1.


    Now, elements of stiffness matrix (22) and forcing vector (23) have to be found
    to solve linear FEM system (25). First, consider the stiffness matrix in which
    elements are defined through


    $$\begin{array}{l} {{\widetilde{A}}_{ij} = \int_{0}^{1}\left( {\varphi_{i}''\varphi_{j}''}
    \right)dx,\quad i,j = 1,2,3,4.} \end{array}$$$(1.34)


    It is worth looking into expressions for every element to better understand patterns
    and matrix formation.


    $$\begin{array}{l} {{\widetilde{A}}_{11} = \int_{0}^{1}\left( {\left( \varphi_{1}''
    \right)^{2} + \left( \varphi_{1} \right)^{2}} \right)dx = \int_{0}^{\frac{1}{3}}
    \cdot dx,$$ \end{array}$$$(1.35)


    $$\begin{array}{l} {{\widetilde{A}}_{12} = {\widetilde{A}}_{21} = \int_{0}^{1}\left(
    {\varphi_{1}''\varphi_{2}'' + \varphi_{1}\varphi_{2}} \right)dx = \int_{0}^{\frac{1}{3}}
    \cdot dx,$$ \end{array}$$$(1.36)


    $$\begin{array}{l} {{\widetilde{A}}_{13} = {\widetilde{A}}_{31} = \int_{0}^{1}\left(
    {\varphi_{1}''\varphi_{3}'' + \varphi_{1}\varphi_{3}} \right)dx = 0,$$ \end{array}$$$(1.37)


    $$\begin{array}{l} {{\widetilde{A}}_{14} = {\widetilde{A}}_{41} = \int_{0}^{1}\left(
    {\varphi_{1}''\varphi_{4}'' + \varphi_{1}\varphi_{4}} \right)dx = 0,$$ \end{array}$$$(1.38)


    $$\begin{array}{l} {{\widetilde{A}}_{22} = \int_{0}^{1}\left( {\left( \varphi_{2}''
    \right)^{2} + \left( \varphi_{2} \right)^{2}} \right)dx = \int_{0}^{\frac{1}{3}}
    \cdot dx + \int_{\frac{1}{3}}^{\frac{2}{3}} \cdot dx,$$ \end{array}$$$(1.39)


    $$\begin{array}{l} {{\widetilde{A}}_{23} = {\widetilde{A}}_{32} = \int_{0}^{1}\left(
    {\varphi_{2}''\varphi_{3}'' + \varphi_{2}\varphi_{3}} \right)dx = \int_{\frac{1}{3}}^{\frac{2}{3}}
    \cdot dx,$$ \end{array}$$$(1.40)


    $$\begin{array}{l} {{\widetilde{A}}_{24} = {\widetilde{A}}_{42} = \int_{0}^{1}\left(
    {\varphi_{2}''\varphi_{4}'' + \varphi_{2}\varphi_{4}} \right)dx = 0,$$ \end{array}$$$(1.41)


    $$\begin{array}{l} {{\widetilde{A}}_{33} = \int_{0}^{1}\left( {\left( \varphi_{3}''
    \right)^{2} + \left( \varphi_{3} \right)^{2}} \right)dx = \int_{\frac{1}{3}}^{\frac{2}{3}}
    \cdot dx + \int_{\frac{2}{3}}^{1} \cdot dx,$$ \end{array}$$$(1.42)


    $$\begin{array}{l} {{\widetilde{A}}_{34} = {\widetilde{A}}_{43} = \int_{0}^{1}\left(
    {\varphi_{3}''\varphi_{4}'' + \varphi_{3}\varphi_{4}} \right)dx = \int_{\frac{2}{3}}^{1}
    \cdot dx,$$ \end{array}$$$(1.43)


    $$\begin{array}{l} {{\widetilde{A}}_{44} = \int_{0}^{1}\left( {\left( \varphi_{4}''
    \right)^{2} + \left( \varphi_{4} \right)^{2}} \right)dx = \int_{\frac{2}{3}}^{1}
    \cdot dx.} \end{array}$$$(1.44)


    We can see that due to the symmetry of formula (34), index order is not important
    and the stiffness matrix becomes symmetrical. In addition, `widetilde{A}[13]`,
    `widetilde{A}[31]`, `widetilde{A}[14]`, `widetilde{A}[41]`, `widetilde{A}[24]`
