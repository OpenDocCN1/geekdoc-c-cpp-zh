    \right\}_{\beta = 1}^{6},\quad D(\hat{\mathbf{\mathbf{d}}_{i}}) = J^{- 1}(\hat{\mathbf{\mathbf{d}}_{i}})\hat{D}(\hat{\mathbf{\mathbf{d}}_{i}}),}
    \end{array}$$


    column-vectors


    $$\begin{array}{l} {\hat{\mathbf{\mathbf{\varphi}}}(\hat{\mathbf{\mathbf{d}}_{i}})
    = \left\{ {{\hat{\varphi}}_{\beta}(\hat{\mathbf{\mathbf{d}}_{i}})} \right\}_{\beta
    = 1}^{6},} \end{array}$$


    and coefficients $\left. \gamma(\hat{\mathbf{\mathbf{d}}_{i}}) = {\hat{\gamma}}_{i}
