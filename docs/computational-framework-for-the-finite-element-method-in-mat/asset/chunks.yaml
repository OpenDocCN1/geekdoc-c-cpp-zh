    ### 1.3.3 有限元法的线性方程组


    如所示，BVP (1.1)–(1.2) 的有限元法通过方程 (1.18) 求解未知函数 `u[h]`，并带有任意的 `v[h]`。在 `H[h]^m(s[0],
    s[1])` 中引入基可以将此问题简化为求解线性方程组。


    通过考虑区间 `[s[0], s[1]]` 具有 `n` 个有限元，且每个有限元有 $m+1$ 个节点，我们得到总共 `N = nm+1` 个节点，可以从
    1 到 `N` 进行编号：


    $$\begin{array}{l} {s_{0} = x_{1} < x_{2} < \cdots < x_{N} = s_{1}.} \end{array}$$


    每个节点 `x[i]` 都可以与一个拉格朗基基函数 `phii \in H[h]^m(s[0], s[1])` 相关。在第 1.3.1 节中引入的基包含光滑函数，而
    `u[h] \in H[h]^m(s[0], s[1])` 是分段平滑样条，相应的基也包含分段平滑函数。函数 `phii` 具有仅在相应有限元内取非值而在其他处为零的性质。与两个元共享的节点相关的基函数在这两个元内均为非零（参见图
    1.5）。因此，每个 `phii` 在一个或两个有限元内取非值。记住，如果 $i \neq j$，则 `phii = 0`，且 `phii = 1`。


    ![显示带有拉格朗日样条基函数的两个部分。部分 (a) 显示了与有限元内部节点相关的基，图形跨越了单个元。部分 (b) 显示了与两个有限元节点相关的基，图形跨越了两个元。](img/fig1_5.jpg)


    图 1.5: 对应于具有两个有限元 `e[1] = [0, 3]` 和 `e[2] = [3, 6]` 的样条的拉格朗基函数，节点为 `{x[1] = 0,
    x[2] = 1, x[3] = 2, x[4] = 3, x[5] = 4, x[6] = 5, x[7] = 6}`。可以看到节点 `x[4] = 3`
    处的样条是连续但不平滑的函数。


    让我们标记 $u(x)$ 和 $v(x)$，子空间 $\mathcal{W}$ 和 $\mathcal{W}⁰$ 的近似可以通过 `H[h]^m(s[0],
    s[1])` 的基分解如下（第 1.3.1 节）：


    $$\begin{array}{l} {u_h(x) = \sum_{i=1}^N u_i \phi_i(x) \\ v_h(x) = \sum_{i=1}^N
    v_i \phi_i(x)} \end{array}$$


    其中 $u_i = u_h(x_i)$，$v_i = v_h(x_i)$。由于 $\phi_i(x_j) = \delta_{ij}$，这种分解是唯一的。通过将这些代入方程
    (1.18)，我们得到：


    $$\begin{array}{l} \int_{s_0}^{s_1} \left( c \sum_{i=1}^N u_i \phi_i(x) \right)
    \left( \sum_{j=1}^N v_j \phi_j''(x) \right) dx + \int_{s_0}^{s_1} \left( a \sum_{i=1}^N
    u_i \phi_i''(x) \right) \left( \sum_{j=1}^N v_j \phi_j(x) \right) dx = \int_{s_0}^{s_1}
    f(x) \left( \sum_{j=1}^N v_j \phi_j(x) \right) dx \end{array}$$


    对于每个 $j=1, \dots, N$，我们得到：


    $$\begin{array}{l} \sum_{i=1}^N u_i \left( \int_{s_0}^{s_1} c \phi_i(x) \phi_j''(x)
    dx + \int_{s_0}^{s_1} a \phi_i''(x) \phi_j(x) dx \right) = \int_{s_0}^{s_1} f(x)
    \phi_j(x) dx \end{array}$$


    定义 $A_{ij} = \int_{s_0}^{s_1} (c \phi_i(x) \phi_j''(x) + a \phi_i''(x) \phi_j(x))
    dx$ 和 $F_j = \int_{s_0}^{s_1} f(x) \phi_j(x) dx$，则方程组为：


    $$\begin{array}{l} \sum_{i=1}^N A_{ij} u_i = F_j, \quad j=1, \dots, N \end{array}$$


    注意 $A_{ij}$ 不一定对称。其矩阵形式为 $A^T \mathbf{u} = \mathbf{F}$，其中 $\mathbf{u} = [u_1,
    \dots, u_N]^T$，$\mathbf{F} = [F_1, \dots, F_N]^T$。由于 $u(s_0) = u_{s_0}$，我们 $u_1
    = u_{s_0}$ 是已知的，因此我们可以得到关于 $u_2, \dots, u_N$ 的方程组：


    $$\begin{array}{l} \sum_{i=2}^N A_{ij} u_i = F_j - A_{1j} u_{s_0}, \quad j=2,
    \dots, N \end{array}$$


    这就是一个 $(N-1) \times (N-1)$ 的线性方程组。


