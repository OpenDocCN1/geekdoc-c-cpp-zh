    # Appendix A Variational Formulation of a Boundary Value Problem


    DOI: [10.1201/9781003265979-A](https://doi.org/10.1201/9781003265979-A)


    HERE we discuss variational approach to solve BVP. Variational methods are used
    in many applications where a problem can be expressed in terms of so-called variational
    principles. In accordance with one of these principles, function *u*(*x*) being
    a solution to a BVP at the same time must be a stationary point of a variational
    functional


    $$\begin{array}{l} {J(u) = {\int\limits_{s_{0}}^{s_{1}}{F(x,u,u'')dx}},} \end{array}$$


    where *s*[0] and *s*[1] are constants, *u*(*x*) is a twice continuously differentiable
    function and function *F* is twice continuously differentiable with respect to
    its arguments. A stationary point is a function *u*^*(*x*) which makes *J*(*u*)
    stationary, or when the first-order change in *J*(*u*) with respect to the function
    *u*(*x*) vanishes. Usually, variational functional has a certain meaning, for
    example, it could be a potential energy and a stationary point is a function that
    minimizes the energy. It is known from variational calculus that a stationary
    point is solution to the Euler-Lagrange equation


    $$\begin{array}{l} {- \frac{d}{dx}\frac{\partial F}{\partial u''} + \frac{\partial
    F}{\partial u} = 0.} \end{array}$$(A.1)


    If equation (A.1) is complemented with some boundary conditions


    $$\begin{array}{l} {u(s_{0}) = u_{s_{0}},\quad u(s_{1}) = u_{s_{1}},} \end{array}$$(A.2)


    then we see that finding a stationary point of *J*(*u*) is equivalent to solving
    BVP (A.1) – (A.2).


    As an example, let us consider the functional


    $$\begin{array}{l} {J(u) = \frac{1}{2}{\int\limits_{s_{0}}^{s_{1}}{c(x)\left(
    {u''(x)} \right)^{2} + a(x)u^{2}(x) - f(x)u(x)dx}},} \end{array}$$(A.3)


    where *c*(*x*), *a*(*x*) and *f*(*x*) are piecewise continuous functions and *c*(*x*) > 0, *b*(*x*) > 0.
    A variational problem is to find a function *u*(*x*) which minimizes *J*(*u*).


    $$\begin{array}{l} \left. J(u)\rightarrow\min,\quad u(s_{0}) = u_{s_{0}},\quad
    u(s_{1}) = u_{s_{1}}. \right. \end{array}$$(A.4)


    Then, the Euler-Lagrange equation takes the form


    $$\begin{array}{l} {- \left( {c(x)u''(x)} \right)'' + a(x)u(x) = f(x).} \end{array}$$(A.5)


    It can be shown that stationary point in this case is a function which minimizes
    (A.3). As a result, solving (A.3) – (A.4) is equivalent to solving BVP (A.5) –
    (A.2).


    In practice, the BVP (A.5) – (A.2) is replaced by the integral expression (A.3)
    for which a minimization problem is considered with some approximation of unknown
    function. In the context of FEM, the unknown function *u* is represented through
    linear combination of some known functions, *φ*[*i*](*x*), and coefficients, *α*[*i*],
    as follows:


    $$\begin{array}{l} {u(x) = {\sum\limits_{i = 1}^{N}{\alpha_{i}\varphi_{i}(x)}}.}
    \end{array}$$(A.6)


    By substituting (A.6) into (A.3) we come to the problem of minimization of multivariate
    function *J*(*α*[*i*]*φ*[*i*](*x*)) with respect to variables *α*[*i*]. According
    to the first-order necessary condition for a minimum, variables *α*[*i*] can be
    found from equations


    $$\begin{array}{l} {\frac{\partial}{\partial\alpha_{i}}J\left( {\sum\limits_{i
    = 1}^{N}{\alpha_{i}\varphi_{i}}} \right) = 0.} \end{array}$$


    By adding to these equations conditions (A.2) we come to a system of equations
    for finding coefficients *α*[*i*] which defines solution (A.6).'
