    ## 3.4 LINEAR SYSTEM OF THE FEM


    Equation (3.3) reduces to the system of linear equation. Firstly, we need to select
    basis functions which define interpolation over finite elements `τ`. We define
    basis functions as follows: Let us enumerate all points `𝒫[*h*]` from 1 to `n`
    and assign a basis function `φ[*i*](x)` to each point `p[*i]`$\in$`𝒫[*h*]` so
    that `φ[*i*](p[*j])`=`δ[*i*j]`, `j`=1,...,`n`. Then, any `v[*h*]` can be represented
    in the form of interpolating polynomial


    $$\begin{array}{l} {v_{h}(\mathbf{x}}) = {\sum_{i = 1}^{n_{p}}{v_{i}\varphi_{i}(\mathbf{x})}},
    \end{array}$$


    where `v[*i*]`=`v(p[*i])`. Let us divide set of indices `ℐ={1,2,...,n[*p*]}` into
    two subsets: `ℐ[*D]`={`i`$\in$`ℐ:`p[*i]`$\in$`𝒫[*D*]} and `ℐ[*U]`={`i`$\in$`ℐ:`p[*i]`$\notin$`𝒫[*D*]}.
    Solution at the points `p[*i][D]` is known from the boundary condition `u[*h*](p[*i][D]])`=`u[*D[*i]]`.
    We need to find a solution at the points `p[*i][U]]`.


    The following expansions are valid in `𝒯[*h*]`:


    $$\begin{array}{l} {u_{h}(\mathbf{x}) = {\sum_{i \in i_{U}}{u_{i}\varphi_{i}(\mathbf{x}))}}
    + {\sum_{i \in i_{D}}{u_{D_{i}}\varphi_{i}(\mathbf{x})}},\quad v_{h}(\mathbf{x})
    = {\sum_{i \in i_{U}}{v_{i}\varphi_{i}(\mathbf{x}))}} \end{array}$$$(3.4)


    Let us define a matrix `Ã`~(`n[*p*]`×`n[*p*]`) and a vector $\left. \widetilde{\mathbf{F}}
    \right.\sim(n_{p} \times 1)$ having components


    $$\begin{array}{l} {{\widetilde{A}}_{ij} = {\int\limits_{\mathcal{T}_{h}}{\left(
    {c\nabla\varphi_{j} \cdot \nabla\varphi_{i} + \mathbf{\mathbf{b}} \cdot \nabla\varphi_{j}\varphi_{i}
    + a\varphi_{j}\varphi_{i}} \right)d\mathbf{\mathbf{x}}}} + {\int\limits_{\Gamma_{R}^{h}}}{\sigma\varphi_{j}\varphi_{i}d\mathbf{\mathbf{x}}}}}
    \end{array}$$$(3.5)


    $$\begin{array}{l} {{\widetilde{F}}_{i} = {\int\limits_{\mathcal{T}_{h}}{f(\mathbf{\mathbf{x}})\varphi_{i}d\mathbf{\mathbf{x}}}}
    + {\int\limits_{\Gamma_{R}^{h}}{\mu(\mathbf{\mathbf{x}})\varphi_{i}d\mathbf{\mathbf{x}}}}}
    \end{array}$$$(3.6)


    where `Ã` is called global stiffness matrix and `\widetilde{\mathbf{F}}` is the
    global forcing vector. Then, equation (3.3) can be rewritten in the form of the
    linear system (see [section 1.3.3](#chapter1.3.3))


    $$\begin{array}{l} {\sum_{j \in i_{U}}{{\widetilde{A}}_{ij}u_{j}}} = q_{i},\quad
    q_{i} = {\widetilde{F}}_{i} - {\sum_{j \in i_{D}}{{\widetilde{A}}_{ij}u_{D_{j}}}}
    \end{array}$$$(3.7)


    By solving (3.7) we find `u[*h*]`, `j`$\in$`ℐ[*U]`. Although these formulas are
    not used, we consider efficient method.


    ## 3.5 STIFFNESS MATRIX AND FORCING VECTOR


    Linear system (3.7) implies calculation of `Ã` and vector `F`. In practical applications,
    these matrices are usually large and their calculation affects overall performance.
    It is followed from (3.5) that `Ã` is a sum of square matrices (`n[*p*]`×`n[*p*]`)
    dimension: Here we consider efficient method


    $$\begin{array}{ll} A_{ij} & = {\int\limits_{\mathcal{T}_{h}}{\left( {c\nabla\varphi_{j}
    \cdot \nabla\varphi_{i} + \mathbf{\mathbf{b}} \cdot \nabla\varphi_{j}\varphi_{i}
    + a\varphi_{j}\varphi_{i}} \right)d\mathbf{\mathbf{x}}}} \\ S_{ij} & = {\int\limits_{\Gamma_{R}^{h}}}{\sigma\varphi_{j}\varphi_{i}d\mathbf{\mathbf{x}}}}
    \end{array}$$


    Recall that triangulation `𝒯[*h*]` is a union of finite elements `τ`, that is
    $\mathcal{T}_{h} = {\underset{l = 1}^{n_{t}}}{\cup}}\tau_{l}}$ where *n[*t*]*
    is the total number of finite elements. Similarly, `\widetilde{\mathbf{F}} = \mathbf{F}
    + \mathbf{M}`, `i`=1,...,`n_{p}`:


    $$\begin{array}{l} F_{i} = {\int\limits_{\mathcal{T}_{h}}{f(\mathbf{\mathbf{x}})\varphi_{i}d\mathbf{\mathbf{x}}}},\quad
    M_{i} = {\int\limits_{\Gamma_{R}^{h}}}{\mu(\mathbf{\mathbf{x}})\varphi_{i}d\mathbf{\mathbf{x}}
    \end{array}$$

