  raw: 'Here, we need to explain how to implement in Python some MATLAB functions.
    For instance, MATLAB function find(a) which finds indices and values of nonzero
    elements of the array a can be represented in Python as function numpy.nonzero(a)
    which returns a tuple of arrays, one for each dimension of a, containing the indices
    of the nonzero elements in that dimension. To group the indices by element, rather
    than dimension, we can use numpy.transpose(numpy.nonzero(a)) which results in
    two-dimensional array of indices with a row for each nonzero element. Logical
    operations over Boolean arrays can be performed through special functions of the
    numpy package, for example, function numpy.logical_or(x1,x2) applies logical OR
    to the elements of x1 and x2. MATLAB function ismember(x1,x2) corresponds to Python
    function numpy.isin(x1,x2) which returns a Boolean array of the same shape as
    array x1 that is True where an element of x1 is in x2 and False otherwise. [Listing
    E.4](#appE.xhtml_listE_4) shows a function assemblingPDE() code for solving a
    PDE problem. Function spsolve() is used here to solve linear system of sparse
    matrices.


    ![](images/compE_5.jpg)


    ## E.3 SOLVING EXAMPLE PROBLEM


    As a final step, let us create a Python code for solving the example problem formulated
    in [section 5.8](#chapter5.xhtml_sec5_8). The code is self-documented and easy
    to read.


    ![](images/compE_6.jpg)![](images/compE_6_2.jpg)![](images/compE_6_3.jpg)


    Here, geometry is defined in function disk() and BC are specified in functions
    uD(), sigma() and mu(). Function testPDE() when called calculates solution values
    and prints solution error in various norms.


