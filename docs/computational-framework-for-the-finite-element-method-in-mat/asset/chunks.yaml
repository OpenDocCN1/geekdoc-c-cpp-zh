    ## 5.4 计算方程系数


    刚度矩阵取决于偏微分方程的系数 `c`、`b`、`a`、`f`，我们需要决定如何将这些系数的计算整合到有限元法（FEM）中。注意方程系数可能是子域上的分段函数。回想求解解的区域
    $\Omega$ 可能由子域组成。每个子域应该有一个唯一的标签 `sdl`，该标签可以从连通性矩阵 `t` 中检索，使得 `sdl=t(:`。因此，每个单元都“知道”它所属的子域。我们可以构造一个函数，以子域标签
    `sdl` 为输入并执行系数计算，例如，如果我们有三个子域 $\Omega[1]$、$\Omega[2]$、$\Omega[3]$，且系数 `c` 定义为：


    $$\begin{array}{l} {c(\mathbf{\mathbf{p}}) = \left\{ \begin{array}{ll} {1,} &
    {\mathbf{\mathbf{p}} \in \Omega_{1},} \\ {x_{1}^{2} + x_{2},} & {\mathbf{\mathbf{p}}
    \in \Omega_{2},} \\ {\sin(x_{1} + x_{2}), & {\mathbf{\mathbf{p}} \in \Omega_{3},}
    \end{array} \right.} \end{array}$$


    那么 `listing 5.11` 中的函数计算系数 `c`。在需要计算系数值时可以调用此函数。值得注意的是，这是一个向量化函数，允许计算所有子域点的系数。


    ## 5.5 计算全局刚度矩阵和力向量


    在 5.3 节中，我们得到了计算 $\Gamma[1]$ 的局部刚度矩阵和力向量的表达式。现在，我们将这些信息整合到 5.1 和 5.2 节提供的算法中。我们提供了两个版本的算法：向量化的非向量化的。让我们从
    `listing 5.12` 中的非向量化版本开始。


    对 `assemblingAF()` 函数的分析表明，为了将其向量化，我们需要在计算完成后直接组装局部刚度矩阵。结果，我们得到了算法的向量化版本（见 `listing
    5.13`）。


    让我们比较这两个函数的计算成本。取一个具有三个子域的区域，其几何结构由矩阵 `geometryMatrix`（见图 4.1）定义，并按如下指定 PDE 的系数：


    然后，运行 `listing 5.19` 显示的脚本来测量不同节点数量的三个网格的 CPU 时间。


    结果，我们得到了表 5.3，显示向量化版本优于非向量化版本，这由于 MATLAB 对向量化计算更有效的内存管理是可预测的。


