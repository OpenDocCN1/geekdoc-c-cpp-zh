    i \in \mathcal{I}_{U}.} \end{array}$$(3.7)


    By solving system (3.7) we define *u*[*j*], *j* ∈ ℐ[*U*], and the approximation
    solution of the problem (3.2) is found from (3.4). Although matrix and vector
    elements can be defined from (3.5) and (3.6), these formulas are not usually used
    for calculation purpose. There exists more convenient and efficient calculation
    method which we consider below.


    ## 3.5 STIFFNESS MATRIX AND FORCING VECTOR


    Linear system (3.7) implies calculation of matrix *Ã* and vector $\widetilde{\mathbf{\mathbf{F}}}$.
    In practical application problems, these matrices are usually of large sizes and
    chosen calculation method affects overall performance of the FEM programming implementation.
    Here, we consider efficient method of their calculation.


    It is followed from (3.5) that matrix *Ã* is a sum of two square matrices of
    (*n*[*p*] × *n*[*p*]) dimension: *Ã* = *A* + *S*,[⁴](#chapter3.xhtml_fn3_4)


    $$\begin{array}{ll} A_{ij} & {= {\int\limits_{\mathcal{T}_{h}}{\left( {c\nabla\varphi_{j}
    \cdot \nabla\varphi_{i} + \mathbf{\mathbf{b}} \cdot \nabla\varphi_{j}\varphi_{i}
    + a\varphi_{j}\varphi_{i}} \right)d\mathbf{\mathbf{x}}}},} \\ S_{ij} & {= {\int\limits_{\Gamma_{R}^{h}}{\sigma\varphi_{j}\varphi_{i}d\mathbf{\mathbf{x}}}},\quad
    i,j = 1,\ldots,n_{p}.} \end{array}$$


    Similarly,


    $$\begin{array}{l} {\widetilde{\mathbf{\mathbf{F}}} = \mathbf{\mathbf{F}} + \mathbf{\mathbf{M}},\quad
    F_{i} = {\int\limits_{\mathcal{T}_{h}}{f\varphi_{i}d\mathbf{\mathbf{x}}}},\quad
    M_{i} = {\int\limits_{\Gamma_{R}^{h}}{\mu\varphi_{i}d\mathbf{\mathbf{x}}}},\quad
    i = 1,\ldots,n_{p}.} \end{array}$$


    Recall that triangulation 𝒯[*h*] is a union of finite elements *τ*, that is $\mathcal{T}_{h}
    = {\underset{l = 1}{\overset{n_{t}}{\cup}}\tau_{l}}$ where *n*[*t*] is the total
