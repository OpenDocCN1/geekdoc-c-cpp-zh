  trans: '


    在这里，我们需要解释如何在 Python 中实现一些 MATLAB 函数。例如，MATLAB 函数 `find(a)` 可用于找到数组 `a` 中非零元素的索引和值，这在
    Python 中可以表示为函数 `numpy.nonzero(a)`，它返回一个数组元组，其中 `a` 的每个维度对应一个数组，包含该维度上非零元素的索引。为了按元素而非维度对索引分组，我们可以使用
    `numpy.transpose(numpy.nonzero(a))`，这将得到一个二维索引数组，每一行代表一个非零元素。针对布尔数组的逻辑操作可以通过 `numpy`
    包中的特殊函数完成，例如，`numpy.logical_or(x1,x2)` 函数对 `x1` 和 `x2` 的元素应用逻辑“或”运算。MATLAB 函数
    `ismember(x1,x2)` 对应于 Python 函数 `numpy.isin(x1,x2)`，它返回一个与数组 `x1` 形状相同的布尔数组，当
    `x1` 中的元素存在于 `x2` 中时对应位置为 True，否则为 False。列表 E.4 展示了求解 PDE 问题的函数 `assemblingPDE()`
    代码。这里使用 `spsolve()` 函数来求解稀疏矩阵线性方程组。


    ![](img/compE_5.jpg)


    ## E.3 求解示例问题


    最后一步，让我们创建一个 Python 代码来求解第 5.8 节中提出的示例问题。代码自文档且易于阅读。


    ![](img/compE_6.jpg)![](img/compE_6_2.jpg)![](img/compE_6_3.jpg)


    在这里，几何形状在函数 `disk()` 中定义，边界条件 (BC) 在函数 `uD()`、`sigma()` 和 `mu()` 中指定。调用 `testPDE()`
    函数时，它会计算解值并打印各种范数下的解误差。


