    $$\begin{array}{l} {{\int\limits_{\hat{\tau}}{{\hat{\varphi}}_{i_{\beta}}{\hat{\varphi}}_{i_{\alpha}}d\hat{\mathbf{\mathbf{x}}}}}
    = \left( \begin{array}{ll} \frac{1}{12} & \frac{1}{24} \\ \frac{1}{24} & \frac{1}{12}
    \end{array} \right).} \end{array}$$


    Next, we consider calculation of the local forcing vector on the element *τ*


    $$\begin{array}{l} {{\overline{F}}_{\alpha} = {\int\limits_{\tau}{f(\mathbf{\mathbf{x}})\varphi_{i_{\alpha}}(\mathbf{\mathbf{x}})d\mathbf{\mathbf{x}}}}.}
