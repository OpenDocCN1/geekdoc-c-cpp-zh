    # Introduction


    IF you are studying or working in the area of engineering, applied mathematics
    or physics, it is very likely that you have already heard about the finite element
    method (FEM). Probably, you have readsome literature on FEM and have tried to
    solve your particular problem using some FEM software package. Based on my own
    experience of doing so, it is not easy for the newcomer to get into the subject
    matter. Things become more complicated if you are a researcher and try to solve
    a nonstandard problem, which requires building customized programming code. Apart
    from the underlying mathematics, implementing FEM involves scientific programming,
    which includes coding various numerical methods such as polynomial interpolation,
    integrating with quadrature rules and a linear solver for matrix equations. Not
    to mention that building geometric representation for a particular customized
    problem is not always a trivial problem, all these tasks form quite a complicated
    FEM algorithm to be solved. Probably, implementing each individual component of
    the algorithm does not represent a challenge, but combining them all together
    in one interconnected system which should work efficiently and correctly is what
    makes FEM implementation challenging.


    When an engineer or researcher faces a need to solve a problem using FEM, basically,
    there are three possible options: use existing standard FEM software packages,
    rewrite and optimize some third-party FEM library for particular needs or write
    everything from scratch. Obviously, if someone writes everything from scratch,
    the subject knowledge should cover all aspects of an underlying FEM algorithm.
    The advantage of having comprehensive knowledge about how FEM works is that it
    allows us to understand any existing FEM software packages as well. The content
    of this book is written with an idea to give necessary knowledge to develop numerical
    coding skills and become flexible with solving FEM.


    ## Who this book is intended for:


    This book is for those who want to gain skills in scientific programming numerical
    methods and better understand their advantages and drawbacks. Although the pivot
    point of the book is the FEM algorithm, various complementary tasks are considered.
    To be specific, the book provides a programming framework for coding linear FEM
    algorithms using the matrix-based `MATLAB`® language and the Python scripting
    language in application to solving ordinary and partial differential equations.
    Special attention is paid to building numerical algorithms and its efficient implementation
    for both one- and two-dimensional problems. A reader can follow a step-by-step
    process of developing algorithms with explanations of their underlying mathematics
    and how to put them into `MATLAB` and `Python` code with corresponding analysis
    of their efficiency.


    The content is focussed on aspects of numerical methods and coding FEM algorithms
    rather than FEM mathematical analysis; however, basic mathematical formulations
    for numerical techniques needed to implement FEM algorithms are provided.


    ## Level of presentation:


    The mathematical background is assumed to be covered by matrix algebra, vector
    calculus and the basics of ordinary and differential equations. It is going to
    be a demonstration of how the FEM works in the one- and two-dimensional case,
    written as applied mathematicians usually write it. The content throughout the
    book is not restricted to either Laplace or Poisson equations but rather general
    linear elliptic boundary value problems. Unlike the majority of the books on the
    FEM method which imply that a reader is familiar with structural mechanics, the
    current book is based on more generic formulations without assuming any mechanics
    background. Structural finite elements are not considered in examples and they
    are not discussed at all since, contrary to expectations, the structural elements
    are much more complicated to describe and use. They are left to an advanced FEM
    course. The book has a number of appendices which contain more detailed explanations
    of the numerical methods used in the main body of the book, so a reader can refresh
    or enrich their corresponding knowledge.


    We use `MATLAB` and `Python` as programming languages to code the steps of the
    FEM algorithm. Throughout the book, the ideas of coding are illustrated using
    `MATLAB` with complementary translation to `Python` as well. Providing the code
    examples in both programming languages is done to add flexibility in framework
    implementation.


    In terms of programming background, it is expected that a reader is familiar with
    basic matrix and vector manipulation using `MATLAB` and the `NumPy` package in
    `Python`. Every code example given in the book is explained in detail so that
    even a programmer with little experience could understand the underlying algorithm
    logic and implementation. We pay attention to an efficient programming style using
    sparse matrices.


    **Distinctive features of the book**:

