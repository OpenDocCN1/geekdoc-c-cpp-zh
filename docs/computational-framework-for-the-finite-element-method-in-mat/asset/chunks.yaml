    $$\\begin{array}{ll} {- \\int\\limits_{s_{0}}^{s_{1}}\\left( {c(x)u'(x)} \\right)'v(x)dx}\
    \ & {+ \\int\\limits_{s_{0}}^{s_{1}}b(x)u'(x)dx} \\\\ \\int\\limits_{s_{0}}^{s_{1}}a(x)u(x)dx\
