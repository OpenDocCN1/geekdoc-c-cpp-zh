    \n## 1.6 QUADRATURE RULES\n\nAs we have seen, calculating elements of FEM matrices\
    \ includes numerical integration which can be done through applying some quadrature\
    \ rule.\n\n$$\\begin{array}{l} {\\int\\limits_{0}^{1}\\hat{f}d\\hat{x} \\approx\
    \ {\\sum\\limits_{k = 1}^{q}{{\\hat{\\gamma}}_{k}\\hat{f}({\\hat{d}}_{k})}}.}\
    \ \\end{array}$$\n\nChoosing particular values of number $q$, node values, $\\\
    hat{d}[k]$, and weights, $\\hat{\\gamma}[k]$, results in different quadrature\
    \ rules. Below, we utilize two types of quadrature, namely Gaussian quadrature\
    \ and Lobatto quadrature rule. [Appendix C](#appC.xhtml_appC) gives some theoretical\
    \ background for these rules where basic explanations and examples are given.\
    \ In addition, theory on calculations of weights and nodes using orthogonal polynomials\
    \ is given in [Appendix D](#appD.xhtml_appD). Below, we use expressions without\
    \ detailed explanations which can be found in the given appendices.\n\nFirst,\
    \ we consider Gaussian quadrature for integrals over the interval $[-1, 1]$ which\
    \ is the most common and well-studied domain of integration. Integration over\
    \ the interval $[0,1]$ can be obtained from the integration over the interval\
    \ $[-1, 1]$ through the transformation $\\hat{x} = 1/2 + \\tilde{x}/2$, $\\tilde{x}\
    \ \\in [-1, 1]$\n\n$$\\begin{matrix} {\\int\\limits_{0}^{1}\\hat{f}d\\hat{x} =\
    \ \\frac{1}{2}\\int\\limits_{- 1}^{1}\\widetilde{f}d\\widetilde{x} \\approx \\\
    frac{1}{2}{\\sum\\limits_{k = 1}^{q}{{\\widetilde{\\gamma}}_{k}\\widetilde{f}({\\\
    widetilde{d}}_{k})}} = {\\sum\\limits_{i = 1}^{q}{{\\hat{\\gamma}}_{k}\\hat{f}({\\\
    hat{d}}_{k})}}, \\\\ {{\\hat{\\gamma}}_{k} = \\frac{1}{2}{\\widetilde{\\gamma}}_{k},\\\
    quad{\\hat{d}}_{k} = \\frac{1}{2} + \\frac{\\widetilde{d}}_{k}}{2}.} \\end{matrix}$$\n\
    \nIt is worth mentioning that Gaussian quadrature is a type of quadrature formula\
    \ which has the highest order of precision with the given number of nodes, $q$,\
    \ is equal to $2q−1$. Nodes, $\\tilde{d}[k]$, are the roots of Legendre polynomials,\
    \ $L[q](\\tilde{x})$, of order $q$. In general, nodes and weights can be calculated\
    \ using eigenvalue decomposition of the following matrix\n\n$$\\begin{array}{l}\
    \ {Q = \\left(\\begin{array}{lllll} 0 & \\beta_{1} & & & \\\\ & & & \\\\ \\beta_{1}\
    \ & 0 & \\beta_{2} & & \\\\ & & & \\\\ \\ddots & \\ddots & \\ddots \\\\ \\, &\
    \ \\beta_{q - 2} & 0 & \\beta_{q - 1} \\\\ & & \\beta_{q - 1} & 0 \\end{array}\\\
    right),\\quad\\begin{array}{l} {\\beta_{j} = \\frac{j}{\\sqrt{4j^{2} - 1}}, \\\
    \\ {\\,\\,\\, j = 1,\\ldots,q - 1.}} \\end{array}}\\end{array}(87)$$\n\nIf $Q\
    \ = U\\Lambda U^{(1)}$, where $\\Lambda = \\text{diag}(\\lambda[1], \\ldots, \\\
    lambda[q])$ is a diagonal matrix of eigenvalues and $U$ is a matrix of eigenvectors,\
    \ then Gaussian quadrature nodes are $\\tilde{d}[k] = \\lambda[k]$ and the weights\
    \ are $\\tilde{\\gamma}[k] = 2U[k]^2$.\n\nOne important observation about Gaussian\
    \ quadrature is that there is no guarantee that the set of nodes contains boundary\
    \ points, $-1$ or $1$. In order to include the end points of the integration,\
    \ Lobatto quadrature can be used\n\n$$\\begin{array}{l} {\\int\\limits_{- 1}^{1}\\\
    widetilde{f}d\\widetilde{x} \\approx {\\widetilde{\\gamma}}_{1}\\widetilde{f}(\
    \ - 1) + {\\sum\\limits_{k = 2}^{q - 1}{{\\widetilde{\\gamma}}_{k}\\widetilde{f}({\\\
    widetilde{d}}_{k})}} + {\\widetilde{\\gamma}}_{q}\\widetilde{f}( - 1).}} \\end{array}$$\n\
    \nThis type of quadrature has the precision of order $2q−3$ where quadrature nodes\
    \ are roots of the polynomial $(1−tilde{x}^2)L[q−1]'(\\tilde{x})$. Value of nodes\
    \ and weights can be found through the eigenvalue decomposition $Q = U\\Lambda\
    \ U^{(1)}$ of the matrix\n\n$$\\begin{array}{l} {Q = \\left(\\begin{array}{lllll}\
    \ 0 & \\beta_{1} & & & \\\\ & & & \\\\ \\beta_{1} & 0 & \\beta_{2} & & \\\\ &\
    \ & & \\\\ \\ddots & \\ddots & \\ddots \\\\ \\, & \\beta_{q - 2} & 0 & \\beta_{q\
    \ - 3} \\\\ & & \\beta_{q - 3} & 0 \\end{array}\\right),\\quad\\begin{array}{l}\
    \ {\\beta_{j} = \\sqrt{\\frac{j(j + 2)}{(2j + 1)(2j + 3)}}, \\\\ {\\,\\,\\, j\
    \ = 1,\\ldots,q - 3.} \\end{array}}\\end{array}$$\n\nNodes of Lobatto quadrature\
    \ are $\\tilde{d} = \\{-1, \\lambda[i], 1\\}$ and weights to be\n\n$$\\begin{array}{l}\
    \ {\\mathbf{\\widetilde{\\gamma}} = \\left\\{ {\\frac{2}{q^{2} - q},\\frac{4U_{1i}^{2}}{3(1\
    \ - \\lambda_{i})},\\frac{2}{q^{2} - q}} \\right\\},\\, i = 1,\\ldots,q - 2,}\
    \ \\end{array}$$\n\nwhere $\\lambda[i]$ and $U[i]$ are the eigenvalues of matrix\
    \ $Q$. Lobatto quadrature nodes can be chosen to be interpolation nodes on the\
    \ basis element. In this case, $q = m+1$ and $\\hat{x}[\\alpha] = \\hat{d}[\\\
    alpha] = (1+\\tilde{d}[\\alpha])/2$.\n\n## 1.7 DEFINING PARAMETERS OF THE FEM\n\
    \nFrom the previous sections we have learned that there are three parameters defining\
