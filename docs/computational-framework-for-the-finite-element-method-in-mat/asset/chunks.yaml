    ## GLOSSARY


    ****u**, **v**, …:** vectors are written using bold fonts.


    **(**u** ⋅ **v**):** dot product of two vectors, $\mathbf{\mathbf{u}} \cdot \mathbf{\mathbf{v}}
    = {\sum\limits_{i = 1}^{n}{u_{i}v_{i}}}$.


    ***U*, *V*, …:** matrices are denoted by capital letters.


    ***f*(*x*):** a function of a single variable.


    ***f*^′, *f*^″, …:** derivatives of a single variable function *f*(*x*).


    ***C*(*a*, *b*):** set of continuous on the interval (*a*, *b*) functions.


    ***C*^(*k*)(*a*, *b*):** set of continuous functions that have continuous first
    *k* derivatives.


    ***L*[2](*a*, *b*):** space of functions defined on (*a*, *b*) for which the second
    power of the absolute value is Lebesgue integrable. If *v*(*x*) ∈ *L*[2](*a*, *b*),
    then ∥*v*∥[*L*[2]]² = ∫[*a*]^(*b*)|*v*|[2]*d**x* < ∞.


    ***H*¹(*a*, *b*):** Sobolev space defined as *H*¹(*a*, *b*) :  = {*v* ∈ *L*[2](*a*, *b*) : *v*^′ ∈ *L*[2](*a*, *b*)}.
    If *v*(*x*) ∈ *H*¹(*a*, *b*), then ∥*v*∥[*H*¹]² = ∫[*a*]^(*b*)(|*v*^′|²)*d**x* < ∞.


    **𝒢[*m*]:** set of polynomials of degree not greater than *m*.


    ## 1.1 FORMULATION OF THE BOUNDARY VALUE PROBLEM FOR LINEAR SECOND-ORDER ODE


    Throughout the chapter, we consider linear ODE of the form


    $$\begin{array}{l} {- \left( {c(x)u''(x)} \right)'' + b(x)u''(x) + a(x)u(x) =
    f(x),\quad x \in (s_{0},s_{1}).} \end{array}$$(1.1)


    Here, *c*(*x*), *b*(*x*), *a*(*x*) and *f*(*x*) are known functions; *u*(*x*)
    is unknown function to be found, and *u*^′ = *d**u*/*d**x*. It is assumed that
    *c* ∈ *C*¹[*s*[0], *s*[1]]; *b*, *a*, *f* ∈ *C*[*s*[0], *s*[1]] and *c*(*x*) > 0 ∀*x* ∈ [*s*[0], *s*[1]].
    Negative sign in equation (1.1) is for convenience and the reason of keeping this
    sign will be clarified later. We are going to derive FEM algorithm, which is based
    on equation (1.1).


    By considering equation of the form (1.1), we cover the problem in most generic
    formulations which allows solving specific problems as well; for example, when
    *c*(*x*) = −1, *b*(*x*) = *a*(*x*) = 0, we come to Poisson equation, *u*^″(*x*) = *f*(*x*).
