    # Chapter 6 Nonlinear Basis Functions


    DOI: [10.1201/9781003265979-6](https://doi.org/10.1201/9781003265979-6)


    HERE we consider 𝒢[2] mesh and obtain expressions for calculation of basis functions
    for mesh triangular elements with straight as well as curvilinear edges. Analysis
    of how to deduce expression for calculating elements of stiffness matrix is given
    here. We provide mathematical formulations and expressions without giving MATLAB
    implementations codes. Based on the content of this chapter, coding functions
    can be easily composed. Basically, we outline techniques to extend existing FEM
    framework for 𝒢[1] mesh to FEM with 𝒢[2] mesh.


    ## 6.1 QUADRATIC BASIS FUNCTIONS FOR LINEAR TRIANGULAR ELEMENTS


    Methodology to obtain basis functions for the 𝒢[2] triangles with straight edges
    is similar to one of 𝒢[1] meshes with the difference in number of interpolation
    nodes.


    Let us consider a canonical triangle element *τ̂* in the coordinate system $\hat{\mathbf{\mathbf{x}}}
    = ({\hat{x}}_{1},{\hat{x}}_{2})$ having six interpolation nodes $\hat{\mathbf{\mathbf{p}}_{i}},\,
    i = 1,\ldots,6$ (here $\hat{\mathbf{\mathbf{p}}_{4}},\hat{\mathbf{\mathbf{p}}_{5}}$,
    and $\hat{\mathbf{\mathbf{p}}_{6}}$ are midpoints). Then 𝒢[2] are all polynomials
    of the second order on the element *τ̂* (see [figure 6.1](#chapter6.xhtml_fig6_1)
    with original triangle element and corresponding basis element).


    ![An image shows two triangles of the same form as shown in figure 5.2 but with
    additional midpoint for every triangle side.](images/fig6_1.jpg)


    [Figure 6.1:](#chapter6.xhtml_b6fig6_1) Canonical element *τ̂* and original 𝒢[2]
    mesh element *τ*.


    If *x̂*[3] = 1 − *x̂*[1] − *x̂*[2], then basis in ${\hat{\mathcal{G}}}_{2}$ is
    defined by the following functions


    $$\begin{array}{ll} {\hat{\varphi}}_{1} & {= {\hat{x}}_{3}(2{\hat{x}}_{3} - 1),\quad{\hat{\varphi}}_{2}
    = {\hat{x}}_{1}(2{\hat{x}}_{1} - 1),\quad{\hat{\varphi}}_{3} = {\hat{x}}_{2}\left(
    {2{\hat{x}}_{2} - \frac{1}{2}} \right),} \\ {\hat{\varphi}}_{4} & {= 4{\hat{x}}_{1}{\hat{x}}_{3},\quad{\hat{\varphi}}_{5}
    = 4{\hat{x}}_{1}{\hat{x}}_{2},\quad{\hat{\varphi}}_{6} = 4{\hat{x}}_{2}{\hat{x}}_{3},}
    \end{array}$$(6.1)


    and for arbitrary function $\hat{z} \in {\hat{\mathcal{G}}}_{2}$ is valid


    $$\begin{array}{l} {\hat{z}(\hat{\mathbf{\mathbf{x}}}) = {\sum\limits_{i = 1}^{6}{\hat{z}(\hat{\mathbf{\mathbf{p}}_{i}}){\hat{\varphi}}_{i}(\hat{\mathbf{\mathbf{x}}})}},\quad\hat{\mathbf{\mathbf{x}}}
    \in \hat{\tau}.} \end{array}$$


    Coordinate transformation *τ̂* → *τ* is defined by (see (5.4) – (5.6))


    $$\begin{array}{l} {\mathbf{\mathbf{x}} = B_{\tau}\hat{\mathbf{\mathbf{x}}} +
    \mathbf{\mathbf{p}}_{1},} \end{array}$$(6.2)


    and, in addition, points $\hat{\mathbf{\mathbf{p}}_{i}}$ are transformed into
    points **p**[*i*], *i* = 1, …, 6. Inverse transformation is defined by $\hat{\mathbf{\mathbf{x}}}
    = B_{\tau}^{- 1}(\mathbf{\mathbf{x}} - \mathbf{\mathbf{p}}_{1})$ and functions
    *φ*[*i*](**x**) = *φ̂*[*i*](*B*[*τ*]^(−1)(**x** − **p**[1])) represent a basis
    in 𝒢[2]. As a result, $\hat{z}(\hat{\mathbf{\mathbf{x}}})$ transforms into *z*(**x**)
    such that


    $$\begin{array}{l} {z(\mathbf{\mathbf{x}}) = {\sum\limits_{i = 1}^{6}{z(\mathbf{\mathbf{p}}_{i})\varphi_{i}(\mathbf{\mathbf{x}})}},\quad\mathbf{\mathbf{x}}
    \in \tau.} \end{array}$$(6.3)


    It is worth noting here that unlike 𝒢[1] mesh, basis functions for 𝒢[2] mesh are
    nonlinear functions, namely, of the second order. This fact results in slightly
    more complicated calculations of its gradients.


    ## 6.2 QUADRATIC BASIS FUNCTIONS FOR CURVILINEAR TRIANGULAR ELEMENTS


    Usually, curvilinear elements are used as mesh elements adjoining the boundary
    to approximate curvilinear geometry in most precise way. [Figure 6.2](#chapter6.xhtml_fig6_2)
    shows 𝒢[2] canonical element *τ̂* (basis functions for *τ̂* are defined by (6.1))
    and corresponding curvilinear element *τ*. Points **p**[*i*], *i* = 1, …, 6 form
    the element so that each three points define a parabolic curve. For example, it
    is possible to plot a unique parabola through nodes **p**[2], **p**[3] and **p**[5].
    As a result, the element *τ* can be expressed through the functions of second
    order, or, in other words, through basis functions (6.1). We come to the transformation


    ![An image shows two triangles with midpoints of the same placement as shown in
    figure 6.1 but the right-hand side triangle has curvilinear sides.](images/fig6_2.jpg)


    [Figure 6.2:](#chapter6.xhtml_b6fig6_2) Canonical element *τ̂* and original curvilinear
    𝒢[2] mesh element *τ*.


    $$\begin{array}{l} {\mathbf{\mathbf{x}} = {\sum\limits_{i = 1}^{6}{\mathbf{\mathbf{p}}_{i}{\hat{\varphi}}_{i}(\hat{\mathbf{\mathbf{x}}})}},\quad\hat{\mathbf{\mathbf{x}}}
    \in \hat{\tau}} \end{array}$$(6.4)


    which transforms *τ̂* into *τ*, and points $\hat{\mathbf{\mathbf{p}}_{i}}$ are
    transformed into **p**[*i*]. Note that if nodes of the element *τ* lie on the
