    # Introduction


    We could stop here and decide that the task of coding FEM is done, but one important
    part of any numerical simulation pipeline is missing. To make sure that we have
    done all correctly and to validate output results, we need a tool for error analysis.
    The main approach is to run simulation for a problem with known exact solution
    and then compare the output with true values in the form of error. To analyse
    FEM error when exact solution is known, it is worth having a function which calculates
    the error norm in spaces `L`[2] and `H`¹¹.


    $$\begin{array}{l} {e = u - u_{h},\quad\| e\|_{L_{2}}^{2} = \int\limits_{s_{0}}^{s_{1}}e^{2}(x)dx,\quad\|
    e\|_{H^{1}}^{2} = \int\limits_{s_{0}}^{s_{1}}\left( {e''(x)} \right)^{2}dx.} \end{array}$$


    Function `errorNorm()` which code is given in [listing 2.9](#chapter2.xhtml_list2_9)
    calculates and outputs these norms. Here, `e0` is a value of `L`[2] error norm,
    `e1` is a value of `H`¹ error norm, `u` and `du` are exact solution and its derivative,
    `y` is an FEM solution, `xl` is a vector of finite element nodes and `d` is a
    vector of interpolation points on the basis element [0,1]. Function `errorNorm()`
    uses Gaussian quadrature to calculate the norms, and interpolating and differentiating
    matrices to find corresponding values of the solution.


    ![](images/comp02_14.jpg)


    # Example Problem


    Now, we are ready to solve example problem using created library. Let us consider
    the following BVP


    $$\begin{array}{cl} {{(u''\cos(x))}'' - 2u''\sin(x) + u\sin(x)} & {= \sin^{2}(x),\quad
    x \in ( - 1,1),} \\ {\quad u( - 1)} & {= \sin( - 1),\quad u''(1) = \cos(1).} \end{array}$$(2.4)


    Here, exact solution to be `u` = sin (*x*) and equation coefficients are the following
    functions: `c`(*x*) = cos (*x*), `b`(*x*) = −2sin (*x*), `a`(*x*) = sin (*x*), `f`(*x*) = sin²(*x*).
    Boundary points are `s`[0] = −1 and `s`[1] = 1. At the point `s`[0] we have Dirichlet
    BC which is a BC of the first type and at the point `s`[1] we have Neumann BC.
    The FEM library deals with either first or third type of BC, so we need to rewrite
    BC at the point `s`[1] in the form of BC of the third type, namely, in the form
    `c`(1)`u`^′(1) + `σ`*(1)`u`*(1) = `μ`*(1). It is easy to see that `σ` = 0 and
    `μ` = cos²(1).


    Having all basic functions for assembling and solving FEM, it is not difficult
    to write a script (see [listing 2.10](#chapter2.xhtml_list2_10)) which solves
    example BVP and plots solution along with error norm values.


    ![](images/comp02_15.jpg)![](images/comp02_15_2.jpg)


    Plots generated by this script are shown in [figures 2.1](#chapter2.xhtml_fig2_1),
    [2.2](#chapter2.xhtml_fig2_2) and [2.3](#chapter2.xhtml_fig2_3) where the finite
    element nodes are indicated as circles and crosses are quadrature nodes which
    coincide with interpolation nodes.


    ![A one line graph representing solution. The line gradually increases, and points
    indicated as crosses and circles lay on the line.](images/fig2_1.jpg)


