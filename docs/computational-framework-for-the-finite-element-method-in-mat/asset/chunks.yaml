    ### 解的准确性以及参数 `n` 和 `m` 的选择


    数字 `n` 和 `m` 影响近似解 `u`[`h`] 的准确性。让我们简要说明这种影响。假设不使用数值积分（所有积分均通过精确计算），有限元法（FEM）理论指出：


    $$\begin{array}{l} {\| u - u_{h}\|_{H^{1}} \leq C\frac{h^{k - 1}}{m^{k - 1}}\|
    u\|_{H^{k}},\quad\| u\|_{H^{k}}^{2} = \int\limits_{s_{0}}^{s_{1}}\left( {u^{2}
    + \left| \frac{d^{k}u}{dx^{k}} \right|^{2}} \right)dx.} \end{array}$$


    这里 `C` 是常数，`u` 是精确解，2 ≤ `k` ≤ min {*m` + 1, `r`*}其中数字 `r` 根据标准 ∥`u`[`H`^(`r`)] < ∞
    定义。联系此，我们对两种情况感兴趣，即(a) 解不是足够的光函数，且 `r` < (`m` + 1)；(b) 解是非常光滑函数，且 `r` ≫ (`m` + 1)。通过选择
    `k` 的最大值，我们得到估计：


    $$\begin{array}{l} {\text{(a)}\,\| u - u_{h}\|_{H^{1}} = O\left( \frac{h^{r -
    1}}{m^{r - 1}} \right),\quad\text{(b)}\,\| u - u_{h}\|_{H^{1}} = O\left( \frac{h^{m}}{m^{m}}
    \right).} \end{array}$$


    我们可以看到参数 `m` 对解的精度的影响不同。为了澄清这一点，让我们考虑一个简化示例，其中所有单元长度相同，`h` = (`s`[`1] − `s`[`0])`/`n`*。在这种情况下，`h` = `O`*(`n`^(−1))，我们得到估计：


    $$\begin{array}{l} {\text{(a)}\,\| u - u_{h}\|_{H^{1}} = O\left( \frac{1}{{(nm)}^{r
    - 1}} \right),\quad\text{~(b)}\,\| u - u_{h}\|_{H^{1}} = O\left( \frac{1}{{(nm)}^{m}}
    \right).} \end{array}}$$1.88


    因此，情况 (a) 对应于相对于参数 `n` 和 `m` 的幂增长，与情况 (b) 不同，后者只有 `n` 的增加会导致幂增长，而增加 `m` 则导致指数增长。


    因此，对于如何选择参数 `m` 和 `n` 有三种策略：


    1. 选择较小的 `m`（实际为 1 ≤ `m` ≤ 5），通过增加 `n` 来获得所需的精度。

    2. 选择较小的 `n`（允许取 `n` = 1，对应于单个单元），通过增加 `m` 来获得所需的精度（实际为 `m` = 5, …, 50, …）。

    3. 多项式次数 `m` 对于所有单元不是固定的可以变化的。当解在区间 [`s`[`0], `s`[`1`]]上的行为不同时，这种策略非常有用。如果存在导数快速增加的区域，则在该区域内
    `m` 的值被固定为较小，但单元会被加密（`n` 增加）。区间其余部分的 `n` 值固定，但多项式次数增加。


