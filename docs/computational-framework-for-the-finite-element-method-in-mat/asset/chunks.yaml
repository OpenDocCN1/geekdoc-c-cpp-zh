    4.3](#chapter4.xhtml_fig4_3)


    In this section, we do not consider methods to build the mesh itself but we are
    focussed on how mesh can be represented. In general, the mesh data should serve
    two main purposes. Firstly, it should provide information about vertices to allow
    interpolation. Secondly, it should contain information about edges which belong
    to boundary segments. As such, one of the most convenient forms of mesh representation
    is a matrix form. Three matrices, `P`, `T`, and `E`, store all necessary information.
    Below we discuss them individually.


    Given enumerated `n[p]` mesh points, let us form a matrix `P` ~ (2 × n) which
    stores coordinates of mesh points (triangle vertices) so that `x[1]` = `P[1]`
    and `x[2]` = `P[2]`. Matrix `P` can be used to access any mesh points but it does
    not keep any information about element formation.


    Structure representing how triangles are formed from the set of vertices is called
    connectivity matrix, `T`. Given a number of triangles, `n[t]`, matrix `T` ~ (4
    × n) stores indices of vertices for each triangular element and corresponding
    subdomain label to which this triangle belongs. Elements `T[1]`, `T[2]` and `T[3]`
    are the indices of vertices of the `j` triangle (counted anticlockwise), element
    `T[4]` is the subdomain label. Note that the matrix `T` is formed using indices
    of points from `P`, so the order in which points are arranged in `P` is important.


    The last structure is an edge matrix, `E`, which stores information regarding
    finite element edges belonging to the boundary segments (internal and external).
    Given a number of edges, `n[e]`, matrix `E` ~ (7 × n) contains the following information.
    Elements `E[1]` and `E[2]` contain indices of vertices belonging to the `k` edge
    (vertex index with respect to matrix `P`), elements `E[3]` and `E[4]` are the
    corresponding parameter values `s[0]` and `s[1]` for parametric representation,
    element `E[5]` is the index of boundary segment to which the edge belongs, elements
    `E[6]` and `E[7]` are the subdomain labels from the left and right hand side of
    the edge according to the parameterization direction.

