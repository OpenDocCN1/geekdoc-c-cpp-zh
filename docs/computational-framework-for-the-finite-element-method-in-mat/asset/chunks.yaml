- fmt: '

    Here, `Λ`[`m`] is called the Lebesgue constant. It can be seen that the constant
    `Λ`[`m`] represents the factor by which approximation error increases when the
    input data error is introduced. Sensitivity of the approximation method to the
    errors of input data is characterized by a conditional number which can be defined
    by the Lebesgue constant. The value of `Λ`[`m`] depends only on nodes distribution
    but not on the interval length. Asymptotic estimation shows that the Lebesgue
    constant grows logarithmically with `m → ∞` if Chebyshev nodes are used. On the
    other hand, it grows exponentially in the the case of equidistant nodes. The former
    fact leads to conclusion, that it is recommended to avoid using high order global
    interpolation polynomials having equidistant nodes distribution. Alternative approach
    is to use a piecewise local interpolation when the interval `[s[0], s[1]]` is
    split into subintervals and function `f` is approximated by interpolating polynomial
    of low order on each subinterval.


    # Appendix C: Interpolatory Quadrature Formulas


    DOI: [10.1201/9781003265979-C](https://doi.org/10.1201/9781003265979-C)


    QUADRATURE formulas are used to approximate integrals of functions which are not
    computed exactly. The most common quadrature formulas look like


    $$\begin{array}{l} {{\int\limits_{s_{0}}^{s_{1}}{fdx}} \approx {\sum\limits_{i
    = 1}^{n}{\gamma_{i}f(x_{i})}}.} \end{array}$$


    Here `x`[`i`] are called nodes of the formula and `γ`[`i`] are called weights.


    In other words, if `φ`[`i`](`(x)` are basis functions, then


    $$\begin{array}{l} {{\int\limits_{s_{0}}^{s_{1}}{fdx}} \approx {\int\limits_{s_{0}}^{s_{1}}{\sum\limits_{i
    = 1}^{n}{f(x_{i})\varphi_{i}(x)}}} = {\sum\limits_{i = 1}^{n}{f(x_{i})}}\underset{\gamma_{i}}{\underset{︸}{\int\limits_{s_{0}}^{s_{1}}{\varphi_{i}(x)dx}}}
    = {\sum\limits_{i = 1}^{n}{\gamma_{i}f(x_{i})}}.} \end{array}$$


    Obviously, if basis functions are integrated exactly then the order of precision
    of an interpolatory formula will be at least `n − 1`. Well-known rectangle formula,
    trapezoidal rule and Simpson rule are interpolatory quadrature rules corresponding
    to the polynomials of the zeroth, first and second orders, respectively.


    It is seen from the above formula that the precision of quadrature formula can
    be increased by increasing number of interpolating nodes (degree of interpolating
    polynomial). However, if there is a freedom in choosing distribution of nodes
    then the precision could be increased through particular choice of nodes location
    with fixed number `n`. This can be illustrated as follows: Suppose we have a function
    `f` defined on the interval which is approximated by a linear polynomial with
    two nodes, `x`[`1]` and `x`[`2]` (see [figure C.1](#appC.xhtml_figC_1)). Then
    the trapezoid quadrature rule gives a value of the integral equalling the area
    `ABCD` and this rule has the first order of precision. On the other hand, if we
    consider a rectangle formula with a freedom of choice of interpolation node, `x`[`1]`^*`,
    we can find location of `x`[`1]`^*` so that the area `AEFD` (result of rectangle
    formula) would be equal to the area `ABCD`. In this situation, the rectangle formula
    results not in the zeroth order of precision but in the first order. This is achieved
    through the particular choice of node location.


    ![An image shows three lines plotted in the coordinate system. First line has
    an arch form, and this is a source function. Second line connects corner points
    of the source function with straight line and it is labelled with letters BC.
    The third line is a straight line which goes through the middle point of the second
    one and indicated with letters EF. There are two perpendiculars to the horizontal
    axis coming from the points B and C which are labelled as BA and CD.](images/fig9_1.jpg)


