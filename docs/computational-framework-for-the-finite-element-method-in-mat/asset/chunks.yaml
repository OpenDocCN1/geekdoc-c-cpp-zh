    ## 1.5 ALGORITHMS OF THE FINITE ELEMENT METHOD


    Below, we are going to compose algorithms needed for programming implementation
    of the FEM using top to bottom approach with increasing granularity of details.
    We start with an algorithm for composing system (1.25), then, assembling matrices
    is considered, and finally, explanation of how to calculate elements of these
    matrices. Each subsequent step in hierarchy of algorithms increases granularity
    of the previous one by introducing more details.


    ### 1.5.1 Composing Linear System of FEM


    We have seen that solving BVP using FEM effectively comes down to solving the
    linear system (1.25) which, in turn, is defined by matrix `A` and vector `F`.


    ![](images/comp01_jpg) There are two points in this algorithm which have to be
    clarified, namely, how to assemble matrices and how to solve a linear system.
    Regarding method of solving linear system, we will discuss it later that this
    is a sparse system which possess a unique, well-defined solution, which allows
    any standard linear solver. As to the method of assembling matrices, this is crucial
    feature in the context of FEM, especially when `N` is large. Next we focus on
    assembling algorithm.


    ### 1.5.2 Assembling Global Matrices


    Let us consider stiffness matrix (1.22). It is seen from (1.22) that matrix `A`
    is a square one and can be viewed as a sum of two matrices, namely `A = A + S`,
    where


    $$\begin{array}{l} {A_{ij} = \int_{s_{0}}^{s_{1}}\left( {c\varphi_{i}''\varphi_{j}''
    + b\varphi_{i}\varphi_{j}'' + a\varphi_{i}\varphi_{j}} \right)dx,} \\ {S_{i,j}
    = \sigma\varphi_{i}(s_{1})\varphi_{j}(s_{1}),}\quad i,j = 1,\ldots,N.} \end{array}$$(1.73)


    Here, $N=m+1$ and matrix `S` is defined by boundary conditions. Recall that interval
    `[s_0, s_1]` is split by $n+1$ points into $n$ finite elements each having $m+1$
    points so that $[s_{0}, s_{1}] = \bigcup_{l=1}^{n} e_{l}$. As such, the integral
    in (1.73) can be represented through the sum of local integrals over finite elements
    $e_l$


    $$\begin{array}{l} {A_{ij} = \sum_{l=1}^{n}\int_{e_{l}}\left( {c\varphi_{i}''\varphi_{j}''
    + b\varphi_{i}\varphi_{j}'' + a\varphi_{i}\varphi_{j}} \right)dx.} \end{array}$$(1.74)


    Now, let us consider more closely an integral over local finite element $e_l$
    and determine only those basis functions are nonzero over element $e_l$. It is
    easy to see that element spans points $x_{m(l-1)+1}, \dots, x_{ml}$, or, by introducing
    local numeration index $\beta=1, \dots, m+1$ and global starting notation $n_l=m(l-1)$,
    we can write that $x_{n_l+\beta} \in e_l$. As a result, `phi(n_l+\beta)` are the
    basis functions associated with $e_l$ which are nonzero over this element. These
    nonzero values form a matrix $\overline{A}^l \sim (m+1) \times (m+1)$ with elements


    $$\begin{array}{cl} {{\overline{A}}_{\alpha\beta}^{l} = \int_{x_{n_{l}+1}}^{x_{n_{l}+m+1}}\left(
    {c\varphi_{n_{l}+\alpha}''\varphi_{n_{l}+\beta}'' + b\varphi_{n_{l}+\alpha}\varphi_{n_{l}+\beta}''
    + a\varphi_{n_{l}+\alpha}\varphi_{n_{l}+\beta}} \right)} & {dx,} \\ {\alpha,\beta
    = 1,\ldots, m + 1.} & \end{array}$$(1.75)


    Introducing a local stiffness matrix allows us in representing global stiffness
    matrix through a sum of local ones. By inspecting (1.74) we observe that `A[ij]`
    has zero value if `phi(i)` and `phi(j)` are nonoverlapping functions ($|i-j|>m$),
    and nonzero value otherwise. Moreover, the sum (1.74) has single nonzero summand
    if $i \neq j$ ($|i-j|<m$) and two summands if $i=j$. As such, elements `A[ij]`
    can be expressed as


    $$\begin{array}{l} {A_{ij} = \sum_{l,\alpha,\beta:i = n_{l} + \alpha,j = n_{l}
    + \beta}{\overline{A}}_{\alpha\beta}^{l}}.} \end{array}$$


    To incorporate all zero elements as well, let us extend a local stiffness matrix
    by introducing matrix $A^l \sim (N \times N)$ which is a matrix with zero value
    elements except of a block corresponding to the finite element $e_l$ and defined
    by the local stiffness matrix (1.75)

