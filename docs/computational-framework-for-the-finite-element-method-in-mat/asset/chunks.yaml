- fmt: '

    Next, we consider representation of the basis functions on the element `τ`. To
    obtain expressions for the basis functions we use an approach which is equally
    applicable to any type of triangular elements with straight line edges (for example,
    triangular elements with six nodes or $\mathcal{G}[2]$ elements). The main idea
    is to consider a canonical element $\hat{\tau}$ in the coordinate system $\hat{\mathbf{\mathbf{x}}}
    = ({\hat{x}}_{1},{\hat{x}}_{2})$ on which basis functions take simple known form.
    Then the basis functions for the element `τ` are derived through coordinate transformation.
    To illustrate this approach, let us consider two elements shown in [figure 5.2](#chapter5.xhtml_fig5_2),
    where the canonical element has vertices coordinates $\hat{\mathbf{\mathbf{p}}_{1}}
    = (0,0),\,\hat{\mathbf{\mathbf{p}}_{2}} = (1,0),\,\hat{\mathbf{\mathbf{p}}_{3}}
    = (0,1)$ and an arbitrary three-nodes element `τ` has vertices `p[1]`, `p[2]`
    and `p[3]`. In this case, the following functions


    $$\begin{array}{l} {{\hat{\varphi}}_{1}(\hat{\mathbf{\mathbf{x}}}) = 1 - {\hat{x}}_{1}
    - {\hat{x}}_{2},\quad{\hat{\varphi}}_{2}(\hat{\mathbf{\mathbf{x}}}) = {\hat{x}}_{1},\quad{\hat{\varphi}}_{3}(\hat{\mathbf{\mathbf{x}}})
    = {\hat{x}}_{2}} \end{array}$$


    ![An image shows two triangles, one on the left which is a canonical triangle
    and one on the right-hand side of the image center. Canonical triangle is an equilateral
    right triangle and from the right-hand side is an ordinary triangle without any
    specific property.](images/fig5_2.jpg)


    [Figure 5.2:](#chapter5.xhtml_b5fig5_2) Canonical element $\hat{\tau}$ and original
    $\mathcal{G}[1]$ mesh element `τ`.


    represent basis functions on element $\hat{\tau}$, and it is clear that ${\hat{\varphi}}_{i}(\hat{\mathbf{\mathbf{p}}_{j}})
    = \delta_{ij}$. Transformation from $\hat{\tau}$ to `τ` is given by


    $$\begin{array}{l} {\mathbf{\mathbf{x}} = \mathbf{\mathbf{p}}_{1}{\hat{\varphi}}_{1}
    + \mathbf{\mathbf{p}}_{2}{\hat{\varphi}}_{1} + \mathbf{\mathbf{p}}_{3}{\hat{\varphi}}_{1}
    = \mathbf{\mathbf{p}}_{1} + {\hat{x}}_{1}(\mathbf{\mathbf{p}}_{2} - \mathbf{\mathbf{p}}_{1})
    + {\hat{x}}_{2}(\mathbf{\mathbf{p}}_{3} - \mathbf{\mathbf{p}}_{1}).} \end{array}$$$(5.4)


    Indeed, this is an affine transformation which maps vertices of $\hat{\tau}$ to
    the vertices of `τ` with preserving orientation of the canonical element and (0,
    0) $\rightarrow$ `p[1]`, (1, 0) $\rightarrow$ `p[2]`, (0, 1) $\rightarrow$ `p[3]`.
    After introducing notation


    $$\begin{array}{l} {B_{\tau} = \left( \begin{array}{ll} {(\mathbf{\mathbf{p}}_{2}
    - \mathbf{\mathbf{p}}_{1})}_{1} & {(\mathbf{\mathbf{p}}_{3} - \mathbf{\mathbf{p}}_{1})}_{1}
    \\ {(\mathbf{\mathbf{p}}_{2} - \mathbf{\mathbf{p}}_{1})}_{2} & {(\mathbf{\mathbf{p}}_{3}
    - \mathbf{\mathbf{p}}_{1})}_{2} \end{array} \right),} \end{array}$$$(5.5)


    transformation can be rewritten in matrix form


    $$\begin{array}{l} \left. \mathbf{\mathbf{x}} = B_{\tau}\hat{\mathbf{\mathbf{x}}}
    + \mathbf{\mathbf{p}}_{1}\quad:\quad\hat{\tau}\rightarrow\tau \right. \end{array}$$$(5.6)


    with Jacobian determinant `J[τ]` = `det B[τ]` > 0. As a result, the area of element
    `τ` is defined as


    $$\begin{array}{l} \left| \tau \middle| = {\int\limits_{\tau}{d\mathbf{\mathbf{x}}}
    = {\int\limits_{\tau}{\det B_{\tau}d\hat{\mathbf{\mathbf{x}}}}} = \middle| \hat{\tau}
    \middle| \det B_{\tau} = \frac{1}{2}J_{\tau}. \right. \end{array}}$$


    Inverse transformation has a form of $\hat{\mathbf{\mathbf{x}}} = B_{\tau}^{-
    1}(\mathbf{\mathbf{x}} - \mathbf{\mathbf{p}}_{1})$ with


    $$\begin{array}{l} {B_{\tau}^{- 1} = \frac{1}{\det B_{\tau}}\left( \begin{array}{ll}
    {(\mathbf{\mathbf{p}}_{3} - \mathbf{\mathbf{p}}_{1})}_{2} & {- {(\mathbf{\mathbf{p}}_{3}
    - \mathbf{\mathbf{p}}_{1})}_{1}} \\ {- {(\mathbf{\mathbf{p}}_{2} - \mathbf{\mathbf{p}}_{1})}_{2}}
    & {(\mathbf{\mathbf{p}}_{2} - \mathbf{\mathbf{p}}_{1})}_{1} \end{array} \right)
    = \left( \begin{array}{ll} \widetilde{d} & {- \widetilde{b}} \\ {- \widetilde{c}}
    & \widetilde{a} \end{array} \right).} \end{array}$$


    Consequently,


    $$\begin{array}{ll} {\hat{x}}_{1} = \widetilde{d}(x_{1} - (\mathbf{\mathbf{p}}_{1})}_{1})
    - \widetilde{b}(x_{2} - (\mathbf{\mathbf{p}}_{1})}_{2}), \\ {\hat{x}}_{2} = -
    \widetilde{c}(x_{1} - (\mathbf{\mathbf{p}}_{1})}_{1}) + \widetilde{a}(x_{2} -
    (\mathbf{\mathbf{p}}_{1})}_{2}). \end{array}$$


    Basis functions `φ[i](x)` on element `τ` are obtained from the basis functions
    on element $\hat{\tau}$ through transformation `φ[i](x) = \hat{\varphi}[i](B[\tau]^{-1}(x-p[1]))`.
    As a result,


    $$\begin{array}{ll} \varphi_{1}(x) = 1 - \varphi_{2}(x) - \varphi_{3}(x), \\ \varphi_{2}(x)
    = \widetilde{d}(x_{1} - (\mathbf{\mathbf{p}}_{1})}_{1}) - \widetilde{b}(x_{2}
    - (\mathbf{\mathbf{p}}_{1})}_{2}), \\ \varphi_{3}(x) = - \widetilde{c}(x_{1} -
    (\mathbf{\mathbf{p}}_{1})}_{1}) + \widetilde{a}(x_{2} - (\mathbf{\mathbf{p}}_{1})}_{2}).
    \end{array}$$


    Respectively, gradients of the basis functions have the form


    $$\begin{array}{l} \nabla\varphi_{1} = \left( \begin{array}{l} \widetilde{c} -
    \widetilde{d} \\ \widetilde{b} - \widetilde{a} \end{array} \right),\quad\nabla\varphi_{2}
    = \left( \begin{array}{l} \widetilde{d} \\ {- \widetilde{b}} \end{array} \right),\quad\nabla\varphi_{3}
    = \left( \begin{array}{l} {- \widetilde{c} \\ \widetilde{a} \end{array} \right).
    \end{array}$$


    It is worth noting that `φ[i](p[τ])` = 1/3, `i=1,2,3`, and for gradients we have


    $$\begin{array}{l} \nabla\varphi_{i}(x) = B_{\tau}^{- 1}^{T}\hat{\nabla}\hat{\varphi_{i}}(\hat{x}).
    \end{array}$$


    Also, the following expressions are valid for the elements `τ` of any type


    $$\begin{array}{l} {{\sum_{i = 1}^{m_{\tau}}\varphi_{i}(x)} = 1,\quad{\sum_{i
    = 1}^{m_{\tau}}\nabla\varphi_{i}(x)} = (0,0)^{T},\quad\mathbf{x} \in \tau, \end{array}$$


    where `m[τ]` is the number of interpolation nodes belonging to the element `τ`.


    By this point, we have obtained all expressions to calculate elements of the local
    stiffness matrix. Now, let us consider methods for calculation of the integral
    (5.1) mentioned above. Since the basis `φ[i][α]` are linear functions, then `∇φ[i][α]`
    are constants and (5.1) can be rewritten as


    $$\begin{array}{ll} \overline{A}_{\alpha\beta} = c(\mathbf{\mathbf{p}}_{\tau})
    & \nabla\varphi_{i_{\beta}} \cdot \nabla\varphi_{i_{\alpha}}\int_{\tau}d\mathbf{\mathbf{x}}}
    + \mathbf{\mathbf{b}}(\mathbf{\mathbf{p}}_{\tau}) \cdot \nabla\varphi_{i_{\beta}}\int_{\tau}{\varphi_{i_{\alpha}}d\mathbf{\mathbf{x}}}
    \\ & \left. + a(\mathbf{\mathbf{p}}_{\tau})}{\int_{\tau}{\varphi_{i_{\beta}}\varphi_{i_{\alpha}}d\mathbf{\mathbf{x}}}}
