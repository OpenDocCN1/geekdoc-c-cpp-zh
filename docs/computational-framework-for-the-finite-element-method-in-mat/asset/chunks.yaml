    In this section, we do not consider methods to build a mesh itself but instead,
    we are focussed on how the mesh can be represented as a data structure. It is
    assumed that there exists a triangular mesh and we want to encode it. Linear interpolation
    functions are considered here (with three interpolation nodes), so triangle vertices
    are the mesh nodes and interpolation nodes at the same time. Let us call it 𝒢[1]
    mesh stressing that it is used when solution is approximated by a polynomial of
    the first order.


    In general, the mesh data structure should serve two main purposes. Firstly, it
    should provide information about triangle vertices to allow performing interpolation
    on elements. Secondly, it should contain information about element edges which
    belong to boundary segments to correctly apply BC. As such, the mesh data should
    encapsulate information about mesh points, their connectivity to form triangles
    (finite elements) and relation between element edges and boundary segments. One
    of the most convenient forms of mesh representation which has became an industry
    standard is a matrix form. Three matrices, *P*,*T* and *E*, store all necessary
    information which allow apply FEM interpolation algorithms. Below we discuss them
    individually.


    Given enumerated *n*[*p*] mesh points, let us form a matrix *P* ∼ (2 × *n*[*p*])
    which stores coordinates of mesh points (triangle vertices) so that for *i*^(*t**h*)
    point coordinate *x*[1] = *P*[1, *i*] and *x*[2] = *P*[2, *i*]. Matrix *P* can
    be used to access any mesh points but it does not keep any information about mesh
    elements formation.


    Structure representing how mesh triangles are formed from the set of vertices
    is called connectivity matrix, *T*. Given a number of triangles, *n*[*t*], matrix
    *T* ∼ (4 × *n*[*t*]) stores indices of vertices for each triangular element and
    corresponding subdomain label to which this triangle belongs. Elements *T*[1, *j*], *T*[2, *j*]
    and *T*[3, *j*] are the indices of vertices of the *j*^(*t**h*) triangle (counted
    anticlockwise), element *T*[4, *j*] is the subdomain label. Note that the matrix
    *T* is formed using indices of points from matrix *P*, so the order in which points
    are arranged in *P* is important.


    The last structure is an edge matrix, *E*, which stores information regarding
    finite element edges belonging to the boundary segments (internal and external).
    Given a number of edges, *n*[*e*], matrix *E* ∼ (7 × *n*[*e*]) contains the following
    information. Elements *E*[1, *k*] and *E*[2, *k*] contain indices of vertices
    belonging to the *k*^(*t**h*) edge (vertex index with respect to matrix *P*),
    elements *E*[3, *k*] and *E*[4, *k*] are the corresponding parameter values *s*[0]
    and *s*[1] for parametric representation, element *E*[5, *k*] is the index of
    boundary segment to which the edge belongs, elements *E*[6, *k*] and *E*[7, *k*]
    are the subdomain labels from the left and right hand side of the edge according
    to the parameterization direction.'
