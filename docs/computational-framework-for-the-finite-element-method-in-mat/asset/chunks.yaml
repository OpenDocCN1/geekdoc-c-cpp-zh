    understand why node distribution is of importance, let us consider the approximation
    error, `Δ(P_m)`, which can be estimated as


    $$\begin{array}{l} \left. \frac{\left| f^{(m + 1)}(\xi) \right|}{(m + 1)!}\max\limits_{\lbrack
    s_{0},s_{1}\rbrack} \middle| \omega_{m + 1}(x) \middle| , \right. \end{array}$$


