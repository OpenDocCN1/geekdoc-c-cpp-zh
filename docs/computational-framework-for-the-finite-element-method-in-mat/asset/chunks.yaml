    # Appendix A: Variational Formulation of a Boundary Problem


    DOI: [10.1201/9781032659-A](https://doi.org/10.1201/9781032659-A)


    HERE we discuss variational approach. Variational methods are used in many applications
    where problem can be expressed in terms of so functional. In accordance with one
    of these principles, function `u` being stationary means the change in `J` with
    respect to `u` vanishes. It is known from variational calculus that stationary
    point has a certain meaning, for example, let us consider the functional


    $$\begin{array}{l} J(u) = \frac{1}{2}{\int_{s_{0}}^{s_{1}}{c(x)\left( {u''(x)}
    \right)^{2} + a(x)u(x) - f(x)dx}}, \end{array}$$$(A.3)


    where `c(x)`, `a(x)` and `f(x)` are piecewise continuous functions and `c(x)`
    is twice differentiable. A variational problem is to find function `u(x)` which
    minimizes `J(u)`.


    $$\begin{array}{l} J(u)\rightarrow\min,\quad u(s_{0}) = u_{s_{0}},\quad u(s_{1})
    = u_{s_{1}}. \end{array}$$(A.4)


    Then, the Euler-Lagrange equation takes the form


    $$\begin{array}{l} {- \left( {c(x)u''(x)} \right)'' + a(x)u(x) = f(x).} \end{array}$$(A.5)


    It can be shown that stationary point in this case is function which minimizes
    (A.3). As a result, solving (A.3) – (A.4) is equivalent to solving BVP (A.5) –
    (A.2).


    In practice, the BVP (A.5) – (A.2) is replaced by the integral expression (A.3)
    for which a minimization problem is considered with some approximation of unknown
    function. In the context of FEM, the unknown function `u` is represented through
    linear combination of some known functions, `phi[i](x)`, and coefficients, `alpha[i]`,
    as follows:


    $$\begin{array}{l} u(x) = {\sum\limits_{i = 1}^{N}{\alpha_{i}\varphi_{i}(x)}}.
    \end{array}$$(A.6)


    By substituting (A.6) into (A.3) we come to the problem of minimization of multivariate
    function `J(alpha[i]phi[i](x))` with respect to variables `alpha[i]`. According
    to the first-order necessary condition for a minimum, variables `alpha[i]` can
    be found from equations


    $$\begin{array}{l} \frac{\partial}{\partial\alpha_{i}}J\left( {\sum\limits_{i
    = 1}^{N}{\alpha_{i}\varphi_{i}} \right) = 0.} \end{array}$$


    By adding to these equations conditions (A.2) we come to a system of equations
    for finding coefficients `alpha[i]` which defines solution (A.6).

