    \ at arbitrary points. These matrices are defined by basis functions for calculation\
    \ of which we utilize expressions (1.13) and (1.14)\n\n$$\\begin{array}{ll} \\\
    beta_{\\alpha} & {= \\left( {\\prod\\limits_{j = 1,j \\neq \\alpha}^{m + 1}{({\\\
    hat{x}}_{\\alpha} - {\\hat{x}}_{j})}} \\right)^{- 1},} \\end{array}$$(2.1)\n\n\
    $$\\begin{array}{ll} {\\hat{E}}_{k,\\alpha} & {= {\\hat{\\varphi}}_{\\alpha}({\\\
    hat{d}}_{k}) = \\beta_{\\alpha}{\\prod\\limits_{j = 1,j \\neq \\alpha}^{m + 1}{({\\\
    hat{d}}_{k} - {\\hat{x}}_{j})}},} \\end{array}$$(2.2)\n\n$$\\begin{array}{ll}\
    \ {\\hat{D}}_{k,\\alpha} & {= {\\hat{\\varphi}}_{\\alpha}'({\\hat{d}}_{k}) = \\\
    beta_{\\alpha}{\\sum\\limits_{l = 1,l \\neq \\alpha}^{m + 1}{\\prod\\limits_{j\
    \ = 1,j \\neq \\alpha,j \\neq l}^{m + 1}{({\\hat{d}}_{k} - {\\hat{x}}_{j})}}}.}\
    \ \\end{array}$$(2.3)"
