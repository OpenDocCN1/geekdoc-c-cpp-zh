    ## 4.5 BUILDING MESHES IN PYTHON


    Above, we have considered how to define a domain geometry and build a mesh using
    MATLAB tools. Now, we explain how to perform mesh building in Python. Again, the
    approach is to use third-party library for mesh processing rather than discussing
    particular mesh building algorithm. There is a powerful mesh generation tool,
    named `Gmsh`, having its own scripting language allowing creating complex geometries.
    The library `PyGmsh` provides a Python interface for the Gmsh scripting language
    so one can create geometry and generate meshes more easily with excess to Python’s
    features. After installing `PyGmsh`, the default Gmsh kernel with basic geometry
    construction functions can be used.


    Module `PyGmsh` has a class `Geometry` to represent a geometry in the following
    way: first, it is to be defined points (using the method `add_point`), then lines
    (using `add_line`, `add_circle`, `add_circle_arc`, `add_line_loop`, etc.), and
    finally surfaces (using `add_plane_surface` method). These geometrical entities
    are assigned identification numbers when they are created. Groups of geometrical
    entities can be defined (using `add_physical_line` or `add_physical_surface` methods)
    and are called physical entities with unique identification numbers. The purpose
    of these physical entities is to assemble geometrical entities into larger groups
    so that they can be referred to by the mesh module as single entities. In terms
    of domain geometry definitions, physical entities can be viewed as labelled boundaries
    or subdomains on which boundary conditions or coefficients are defined. As an
    example, script in [listing 4.7](#chapter4.xhtml_list4_7) defines geometry illustrated
    in [figures 4.2](#chapter4.xhtml_fig4_2) and [4.3](#chapter4.xhtml_fig4_3). Function
    `geometry()` has a parameter `h` – mesh triangular size, and returns two structures:
    geometry object, `geom`, and labels of geometry elements, `geom_labels`.


    ![](images/comp04_14.jpg)![](images/comp04_14_2.jpg)![](images/comp04_14_3.jpg)


    Let us make some comments regarding defining labels for the geometry elements.
    Subdomains are labelled by numbers, but for labelling the boundary (see lines
    65–94) we use group-separated three labels: a number, letter L and right R. Here,
    first number is the boundary label and subsequent numbers are subdomain labels.
    These identification numbers are generated automatically and kept in the list
    `TAKEN_PHYSICAL_IDS` of the class `Geometry`.


    The next step is to generate a mesh and retrieve triangulation data `p,t,e` (see
    [section 4.2](#chapter4.xhtml_sec4_2) for detailed explanation of structure).
    Function `generateMesh()` in [listing 4.8](#chapter4.xhtml_list4_8) creates matrices
    of point coordinates, connectivity, t and edges `e`. It has two parameters: `geom`
    – geometry object, and `geom_labels` – a structure containing labels for geometry
