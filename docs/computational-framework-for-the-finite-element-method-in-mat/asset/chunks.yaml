    The main data structure used in the code implementation is a matrix, so it is
    assumed that a reader is familiar with basic skills of matrix manipulation commands
    in MATLAB and Python. There is, however, a special case of matrices which we will
    discuss in detail, namely sparse matrices. As we have seen from [chapter 1](#chapter1.xhtml),
    FEM results in matrices with sparse structure which we need to reflect in coding.


    ## 2.1 SPARSE MATRICES IN MATLAB^®


    The basic structure to be utilized in the implementation of FEM algorithm is a
    sparse matrix. The main feature of sparse matrices is the compact data representation
    when zeroth elements are ignored and not kept in memory. Operations with sparse
    matrix in MATLAB are similar to operations with full (dense) matrix. The difference
    is that sparse matrix should be created with specification `sparse()`. There are
    three methods to create a sparse matrix in MATLAB.


    1. Creating a sparse matrix from the full one. In this case the argument of the
    function `sparse()` is a dense matrix and returning value is a sparse matrix with
    the shape and values of the dense one. For example,


    ![](images/comp02_1.jpg)


    The sparse matrix is represented in the form of indices of nonzero elements and
    corresponding values. As a result we see arrays of indices `(i,j)` and values.


    2. Creating a sparse matrix by elements. The previous matrix can be specified
    as follows


    ![](images/comp02_2.jpg)


    Here, we specify matrix dimensions as arguments of the function `sparse()` followed
    by assigning values of matrix elements.


    3. Creating a sparse matrix from the arrays of indices and values. For example,
    the next code creates the matrix `A` from previous examples.


    ![](images/comp02_3.jpg)


    In general case, values in vectors of indices could repeat and in this case the
    corresponding values are summed up. This allows formation of the matrix `A` by
    accumulating its elements. For example, the matrix `A` can be specified as


    ![](images/comp02_4.jpg)


    Here `A(1,1)=0.3+0.7`. It is worth noting that `(i,j)` could be specified as two-dimensional
    matrices. In this case, function `sparse()` treats them as column vectors. In
    addition, the value `v` could be a scalar and it would be automatically extended
    to the vector of the corresponding length with all elements of `v`.


    The third method is preferable for creating large sparse matrices since it is
    more generic and it reflects the way in which matrices are represented in MATLAB
    internally.


    ## 2.2 INPUT DATA STRUCTURES


    Let us define input data structure to be used in MATLAB implementation. Particular
    BVP problem is defined by:


    1. numbers `s[0]` and `s[1]` specifying boundary;

    2. functions `c(x)`, `b(x)`, `a(x)` and `f(x)` specifying BVP coefficients;

    3. type of boundary conditions at the points `s[0]` and `s[1]`.


    There is nothing special about item (1) while representation of (2) and (3) in
    terms of MATLAB structures needs to be clarified. Functions in MATLAB can be defined
    either through anonymous inline declaration


    ```

    f = @(x) sin(x)

    ```


    or using stand-along `.m` file containing function definition


    ![](images/comp02_5.jpg)


    Whenever it is possible, we strive to use vectorized computations which are much
    more efficient in terms of computational costs. Having a vector


    ```

    x = [x1,…xn],

    ```


    function call `y = f(x)` returns a vector


    ```

    y = [f(x1),…,f(xn)]

    ```


    and we operate with variables being vectors rather than with individual components.


    Considering item (3), we can use matrix to specify boundary conditions. Let us
    introduce a matrix `bc` having dimension $2 \times 3$ which packs all boundary
    condition data. First row corresponds to BC at the point `s0` and the second row
    contains data for the boundary point `s1`. First column indicates type of BC while
    second and third columns contain corresponding data values. For example, `bc(1,:)=[1,0,u_s0]`
    is for the BC of the first type at the point `s0` and `bc(2,:)=[3,sigma,mu]` is
    for the BC of the third type at the point `s1`.


    Below, MATLAB codes for algorithm implementation will be given in reverse order
    with regards to above considered BEM algorithmic steps, namely, we start with
    coding quadrature rules and finish with solving linear system of the BEM. All
    implementations will be based on derived expressions.


    ## 2.3 CODING QUADRATURE RULES


    Nodes and weights of Gaussian quadrature on arbitrary interval `[s1,s2]` can be
    calculated using [listing 2.1](#chapter2.xhtml_list2_1). Function `GaussQuad()`
    inputs the number of points, `n`, left boundary of the interval, `s0`, right boundary,
    `s1`, and returns a pair of vectors, `d` and `w`, which are quadrature nodes and
    weights accordingly. Here, quadrature nodes are zeroes of Legendre polynomial.
    The function can take either three or one argument and in case of a single argument,
    it is assumed the nodes are sought on the interval `[-1,1]`. This logic is implemented
    in lines 2–4 with MATLAB function `nargin` which returns the number of function
    input arguments given in the call to the currently executing function. The code
    lines 8–10 compute the elements of matrix `Q` (see (1.87)) and compose the matrix
    using diagonal assembling. Function `diag(bta,k)` places the elements of vector
    `bta` on the `k`-th diagonal (`k=0` represents the main diagonal, `k=1` is above
    the main diagonal, and `k=-1` is below the main diagonal). Then, we perform eigen
    decomposition (line 11) and extract eigen values (line 12). To perform eigen values
    extraction, first, we use MATLAB function `diag()` being called with matrix `L`
    returns its main diagonal, then we call the function `sort()` which returns sorted
    nodes `d`, and it also returns an index vector `k` that describes the rearrangement
    of elements such that `d = L(k,:)`. The last step is to calculate weights on the
    interval `[-1,1]` (line 13) and to perform transformation for `[s0,s1]` (lines
    14–15). Note that all calculations here are vectorized, namely, we do not use
    loops to iterate over vector or matrix, but rather use vectors itself. This significantly
    improves performance


    Similarly, Lobatto quadrature implementation can be coded as shown in [listing
    2.2](#chapter2.xhtml_list2_2). We need to make sure that input number of nodes
    is equal or greater than two to make calculation possible (lines 2–5). Compared
    with Gaussian quadrature rule, matrix elements are calculated differently (line
    14) and boundary points are added to the nodes and weights (lines 19–20). Recall
    that the nodes of Lobatto quadrature can be taken to be interpolation nodes on
    the interval `[s0,s1]`.


    ![](images/comp02_6.jpg)


    ## 2.4 IMPLEMENTATION CODE FOR INTERPOLATING AND DIFFERENTIATING MATRICES


    Interpolating and differentiating matrices `E` and `D` are used for calculation
    of the function `u[h]` and its derivative at arbitrary points. These matrices
    are defined by basis functions for calculation of which we utilize expressions
    (1.13) and (1.14)


    $$

    \begin{array}{ll}

    \beta_{\alpha} & {= \left( {\prod\limits_{j = 1,j \neq \alpha}^{m + 1}{({\hat{x}}_{\alpha}
    - {\hat{x}}_{j})}} \right)^{- 1},}

    \end{array}

    $$


    $$

    \begin{array}{ll}

    \hat{E}_{k,\alpha} & {= {\hat{\varphi}_{\alpha}({\hat{d}}_{k}) = \beta_{\alpha}{\prod\limits_{j
    = 1,j \neq \alpha}^{m + 1}{({\hat{d}}_{k} - {\hat{x}}_{j})}},

    \end{array}

    $$


    $$

    \begin{array}{ll}

    \hat{D}_{k,\alpha} & {= {\hat{\varphi}_{\alpha}''({\hat{d}}_{k}) = \beta_{\alpha}{\sum\limits_{l
    = 1,l \neq \alpha}^{m + 1}{\prod\limits_{j = 1,j \neq \alpha,j \neq l}^{m + 1}{({\hat{d}}_{k}
    - {\hat{x}}_{j})}}}.}

    \end{array}

    $$


