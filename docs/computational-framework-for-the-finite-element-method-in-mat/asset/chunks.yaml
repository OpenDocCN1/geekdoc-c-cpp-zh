    which is source function and the other one has wavy shape which is approximation
    with ten nodes. The lines are coincided mostly in the middle part of the graph
    but significantly diverge at the corners. Part (d) shows two lines: one has bell-like
    shape which is source function and the other one has bell-like shape in the middle
    and wavy shape close to corners which is approximation with fourteen nodes. The
