- fmt: '

    There is a large number of books on FEM including FEM mathematical analysis, coding
    FEM and solving application problems using FEM (mostly problems on mechanics).
    However, not many of them cover both theory and numerical implementation with
    coding examples. Usually, the programming implementation comes as complementary
    to the theoretical part just to illustrate implementation for basic simple cases.
    Very often, programming implementation is provided for specific application problems
    with tailored code, and the majority of these applications comes from the structural
    mechanics.


    The current book is designed with an idea to describe FEM algorithm implementation
    itself and to do this in the most generic formulation so as to make it possible
    to apply this algorithm to as many application problems as possible. Here, the
    theoretical part is given as much as needed to implement the corresponding numerical
    methods which are part of the FEM algorithm. The book pays attention to the important
    practical details which arise when an engineer writes programming code. Overall,
    the book considers the FEM method from the scientific programming point of view.


    ## Topics covered by the book content


    The content of the book is divided into six chapters and covers the following
    subjects:


    * Lagrange interpolating polynomials;

    * quadrature rules for numerical integration;

    * defining parameters of the FEM and its influence on solution errors;

    * calculating matrices of the FEM;

    * assembling matrices of the FEM;

    * incorporating boundary conditions into FEM matrices;

    * FEM data structures;

    * defining geometry and building two-dimensional triangular mesh;

    * adaptation to curved boundaries (isoparametric finite elements);

    * solving model problems using FEM.


    We shall start with formulation of the model boundary value problem for the linear
    one-dimensional ordinary differential equation. Then, by introducing interpolating
    functions and finite elements, FEM algorithms for solving model problems are derived.
    The two-dimensional problem for a linear partial differential equation is considered
    afterwards and the corresponding two-dimensional FEM algorithms are derived. Each
    step of the algorithms is provided in detail with programming function implementations.
    We discuss data structures to represent mesh triangulation and boundary conditions,
    and compare different approaches of the matrices assembling process. Full programming
    code is given for an example problem with validating computational efficiency.


    The source code for listings in the book is downloadable and can be found in the
    repository [https://github.com/psumets/FEM_lib](https://github.com)


    ## Background and Basic Concepts


    THE finite element method (FEM) is a numerical method to solve ordinary and partial
    differential equations arising in mathematical modelling. Originally developed
    for solving problems in solid-state mechanics, it proved to be efficient and robust
    in various practical applications ranging from traditional fields of structural
    analysis, heat transfer, fluid flow, mass transport and electromagnetic potential,
    to simulating geometry deformation in computer character animation.


    The fundamental idea of the FEM is subdividing the computational domain into smaller
    and simpler parts that are called finite elements, and finding local solutions
    within the boundary of these elements. By stitching the individual solutions on
    final elements back together, a global solution can be obtained. Some of the FEM
    advantages are the ability of accurate representation of complex geometry, capture
    of local effects and easy solution representation.


    The history of the method is quite instructive. FEM concepts were initially introduced
    by Courant in 1943 in his work on solving the torsion problem, but this work did
    not attract much attention. Later, in the 1950s, structural engineers put the
    FEM on the map as a practical technique for solving their elasticity problem.
    The method had now become an important technique from both the practical and theoretical
    point of view, and the number of the method''s applications began to increase
    at a tremendous rate. In the 1970s, mathematicians gave a comprehensive account
    of the method and its underlying theory. By the current time, the FEM has evolved
    into a universal tool for solving differential equations numerically. Numerous
    software packages adapted FEM to use with applications in all areas of computational
    physics and engineering. `ANSYS`, `ADINA` and `LS-DYNA` are examples of general-purpose
    computer codes for industrial users of the FEM.


    Any numerical modelling of a phenomenon starts with formulating a `mathematical
    model` to be solved. Then, a `numerical model` is constructed that can be solved
    using computers. The final stage is development of a `computer model` (computer
    code) to simulate behaviour of the system. The FEM represents a numerical model,
    so it describes how to transform model equations, geometry and boundary conditions
    into a discretized form suitable to be consumed by numerical methods. An original
    mathematical model could have various forms and the resulting numerical model
    varies as well, but the FEM approach dictates a certain tactic of obtaining a
    numerical model and it follows certain basic concepts. As such, algorithms of
    the FEM can be considered as universal tools to approach numerical modelling.
    Finally, a computer model represents a software package which usually has a form
    of library with computer implementation of numerical methods that make up FEM
    algorithms (for example, numerical integration or a linear solver). Building a
    library code is an art of scientific programming which implies not only good knowledge
    of the mathematics behind the numerical methods but good programming skills as
    well. Choice of programming language affects all of the development process as
    every language has its own unique features and it could come with existing numerical
    libraries which can be reused or tailored for use with the FEM. Also, very often
    the code should be optimized to have good performance with the lowest possible
    calculation error. In case of FEM, a numerical model is often modified slightly
    so as to take shape of an optimized algorithm which is ready to be coded.


    Let us outline the main steps of solving a problem using FEM. As a starting point,
    we have a mathematical model formulated in terms of a differential equation along
    with geometry and boundary conditions. First, this model needs to be converted
    in the form of integral equations with integrals over a geometry domain (in some
    cases, the original mathematical model is already expressed in an integral form).
    Once the integral formulation is obtained, the next step is to perform discretization
    when continuous variables or functions are transformed into discrete counterparts.
    Discretization includes splitting the geometry domain into individual small patches
    (final elements) and representing initially continuous functions and integrals
    as combinations of its interpolation over finite elements. In other words, the
    solution is sought in the form of piecewise interpolation and coefficients of
    this interpolation are unknowns which can be found from the discrete model representation.
    Usually, after discretization, the model transforms into a system of equations
    which could be either linear or nonlinear, depending on the initial form of the
    differential equation. The final step is to solve the system and represent the
    final solution through a piecewise interpolating polynomial.

