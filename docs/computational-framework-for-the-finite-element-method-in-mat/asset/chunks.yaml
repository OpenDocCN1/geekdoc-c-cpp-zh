    diverge at the corners.](images/fig8_1.jpg)


    [Figure B.1:](#appB.xhtml_bfigB_1) Example of approximation divergence with increasing
    polynomial degree, *m*, for uniformly distributed interpolation nodes when (a)
    *m* = 3; (b) *m* = 6; (c) *m* = 10; (d) *m* = 14. Here, the source function is
    *f*(*x*) = 1/(1 + 25*x*²) (solid line), and approximation is performed using Lagrange
    basis functions (dashed line).


