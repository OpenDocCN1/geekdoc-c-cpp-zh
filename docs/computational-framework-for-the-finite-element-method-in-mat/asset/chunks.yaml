    ## 5.3 CALCULATING LOCAL STIFFNESS MATRICES


    Let us consider calculating local stiffness matrix corresponding to a triangular
    element *τ* (here we drop the index *l* implying that *τ* could be any element
    from *τ*[*l*] defined above). Components of the local matrix ${\overline{A}}_{\alpha\beta}$
    with indices *α*, *β* = 1, 2, 3 are defined as


    $$\begin{array}{l} {{\overline{A}}_{\alpha\beta} = {\int\limits_{\tau}{\left(
    {c\nabla\varphi_{i_{\beta}} \cdot \nabla\varphi_{i_{\alpha}} + \mathbf{\mathbf{b}}
    \cdot \nabla\varphi_{i_{\beta}}\varphi_{i_{\alpha}} + a\varphi_{i_{\beta}}\varphi_{i_{\alpha}}}
    \right)d\mathbf{\mathbf{x}}}}.} \end{array}$$(5.1)


    Here, *i*[1], *i*[2] and *i*[3] are the vertices indices of the element *τ*, and
    *φ*[*i*[1]], *φ*[*i*[2]] and *φ*[*i*[3]] are the corresponding basis functions
    (note that (*i*[1], *i*[2], *i*[3]) is a column of matrix t). [Figure 5.1](#chapter5.xhtml_fig5_1)
    shows the element *τ* with notation. To compute integral (5.1) we need expressions
    for the basis functions and their gradients along with numerical method for integral
    calculation.


    ![An image shows two triangles in three-dimensional space having one common side
    and placed one above the other. Vertices not belonging to the common side are
    connected with line so that it forms a perpendicular to the bottom triangle.](images/fig5_1.jpg)


    [Figure 5.1:](#chapter5.xhtml_b5fig5_1) Triangular element *τ* and basis function
    *φ*[*i*[1]].


    We consider two possible methods of calculating integral (5.1). First method is
    based on the assumption that coefficients *c*(**x**), *b*(**x**) and *a*(**x**)
    are constant over the element *τ* and equal to the values computed at the element’s
    centre of mass, **p**[*τ*] = (**p**[*i*[1]] + **p**[*i*[2]] + **p**[*i*[3]])/3.
    In this case the integral is computed analytically (provided expressions for the
    basis functions are known) through the formula


    $$\begin{array}{l} {{\overline{A}}_{\alpha\beta} = {\int\limits_{\tau}{\left(
    {c(\mathbf{\mathbf{p}}_{\tau})\nabla\varphi_{i_{\beta}} \cdot \nabla\varphi_{i_{\alpha}}
    + \mathbf{\mathbf{b}}(\mathbf{\mathbf{p}}_{\tau}) \cdot \nabla\varphi_{i_{\beta}}\varphi_{i_{\alpha}}
    + a(\mathbf{\mathbf{p}}_{\tau})\varphi_{i_{\beta}}\varphi_{i_{\alpha}}} \right)d\mathbf{\mathbf{x}}}}.}
    \end{array}$$(5.2)


    Second method makes use of the quadrature formula with one node which is faithful
    representation for linear polynomial integrand


    $$\begin{array}{l} \left. {\overline{A}}_{\alpha\beta} = \middle| \tau \middle|
    \left( {c\nabla\varphi_{i_{\beta}} \cdot \nabla\varphi_{i_{\alpha}} + \mathbf{\mathbf{b}}
    \cdot \nabla\varphi_{i_{\beta}}\varphi_{i_{\alpha}} + a\varphi_{i_{\beta}}\varphi_{i_{\alpha}}}
    \right)(\mathbf{\mathbf{p}}_{\tau}), \right. \end{array}$$(5.3)


    where |*τ*| is the area of the element *τ*.'
