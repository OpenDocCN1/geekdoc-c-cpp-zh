    \ arguments to be interpolation points, `x`, and arbitrary nodes at which interpolation\
    \ is calculated, `d`. Since the formulas for matrix elements are nonlinear we\
    \ cannot fully apply vectorized calculations and have to use loops to iterate\
    \ over elements. First, elements `β`[`α`]` are calculated in the loop lines 4–7\
    \ where the variable `b` is used to store the values of `β`[`α`]`. Vector `j`\
    \ forms indices which span the range of product operator in (2.1) and function\
    \ `prod()` returns the product of the vector-elements. Listing lines 8–21 implement\
    \ matrices `E` and `D` calculations with two nested loops for matrix elements\
    \ `k` and `i` to calculate the product and one more loop to calculate the sum\
    \ in (2.3). The indices are processed consistently in ascending order, so lines\
    \ 14–15 perform this logic for product and summation calculation. Indices formation\
    \ in the lines 5, 9 and 15 follows the same pattern with skipping i-th element.\n\
    \n![](images/comp02_8.jpg)\n\nIn addition to the function `interpolatingMat()`,\
