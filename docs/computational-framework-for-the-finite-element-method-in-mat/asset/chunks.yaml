    Above, we have discussed data structures to encode geometry with subdomaines definition
    given in [figure 4.1](#chapter4.xhtml_fig4_1) and boundary segments specification
    given in [figure 4.2](#chapter4.xhtml_fig4_2). The next logical step would be
    considering triangulation which is illustrated in [figure 4.3](#chapter4.xhtml_fig4_3)
    for the example geometry. In this book, only triangular mesh is used leaving other
    types beyond the scope (for example, mesh with rectangular elements).


