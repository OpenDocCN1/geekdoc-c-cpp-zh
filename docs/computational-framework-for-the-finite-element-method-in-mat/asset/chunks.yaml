    # Appendix B Discussion of Global Interpolating Polynomial


    DOI: [10.1201/9781003265979-B](https://doi.org/10.1201/9781003265979-B)


    LET us consider a global approximating polynomial, *P*[*m*](*x*), of the order
    *m* defined on the interval [*s*[0], *s*[1]] which interpolates a function *f*(*x*).
    Set of interpolation nodes forms a sequence


    $$\begin{array}{l} {s_{0} = x_{1} < x_{2} < \cdots < x_{m + 1} = s_{1}.} \end{array}$$


    We want to analyse what happens when number of nodes increases (for example, to
    improve function approximation accuracy). Below, various types of approximation
    errors are considered, and it is shown how increasing number of interpolation
    nodes (and accordingly the degree of polynomial *P*[*m*]) leads to accumulation
    of these errors.


    **Convergence with increasing number of nodes**. Suppose that we have chosen some
    strategy of increasing polynomial degree, *m*, by introducing new nodes according
    to some rule. The question arises, whether it is always true that such polynomials
    converge to the source function, or


    $$\begin{array}{l} \left. \Delta(P_{m}) = \max\limits_{\lbrack s_{0},s_{1}\rbrack}
    \middle| f(x) - P_{m}(x) \middle| \underset{m\rightarrow\infty}{\overset{}{\rightarrow}}0\.
    \right. \end{array}$$


    The short answer is not. To illustrate this, let us consider the Runge function[¹](#appB.xhtml_fn2_1)
    *f*(*x*) = 1/(1 + 25*x*²), *x* ∈ [−1, 1], and a simple strategy which consists
    of having uniformly distributed nodes with the step *h* = 2/*m*, that is *x*[*i*] = −1 + (*i* − 1)*h*, *i* = 1, …, *m* + 1.
    The polynomial degree increases with increasing *m* and the result of applying
    this strategy with *m* = {6, 10, 14} is shown in [figure B.1](#appB.xhtml_figB_1).
    It can be seen that when *m* increases, approximation in the central part of the
    interval shows perfect result; however, polynomials diverge in the end regions,
    0.73 ≲ |*x*| ≤ 1.


