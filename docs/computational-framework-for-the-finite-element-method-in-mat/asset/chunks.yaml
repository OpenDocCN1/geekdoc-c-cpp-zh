    # 附录 A：边界问题的变分表述


    DOI: [10.1201/9781032659-A](https://doi.org/10.1201/9781032659-A)


    在这里我们讨论变分法。变分法用于许多应用，在这些应用中可以用泛函的形式表示。根据这些原理之一，函数 `u` 是平稳的意味着 `J` 关于 `u` 的变化为零。从变分法可知，平稳点具有特定的意义，例如，让我们考虑泛函：


    $$\begin{array}{l} J(u) = \frac{1}{2}{\int_{s_{0}}^{s_{1}}{c(x)\left( {u''(x)}
    \right)^{2} + a(x)u(x) - f(x)dx}}, \end{array}$$(A.3)


    其中 `c(x)`、`a(x)` 和 `f(x)` 是分段连续函数，`c(x)` 是二阶可微的。变分问题是寻找使 `J(u)` 最小的函数 `u(x)`。


    $$\begin{array}{l} J(u)\rightarrow\min,\quad u(s_{0}) = u_{s_{0}},\quad u(s_{1})
    = u_{s_{1}}. \end{array}$$(A.4)


    那么，欧拉-拉格日方程的形式为：


    $$\begin{array}{l} {- \left( {c(x)u''(x)} \right)'' + a(x)u(x) = f(x).} \end{array}$$(A.5)


    可以证明在这种情况下，平稳点是极小值的函数。因此，求解 (A.3) – (A.4) 等价于求解边界值 (A.5) – (A.2)。


    在实践中，边界值 (A.5) – (A.2) 被积分表达式 (A.3) 取代，并对未知函数的近似考虑极小问题。在 FEM 背景下，未知函数 `u` 通过已知函数
    `phii` 和系数 `alpha[i]` 的线性组合表示如下：


    $$\begin{array}{l} u(x) = {\sum\limits_{i = 1}^{N}{\alpha_{i}\varphi_{i}(x)}}.
    \end{array}$$(A.6)


    将 (A.6) 代入 (A.3)，我们得到了关于变量 `alpha[i]` 的多元函数 `J(alpha[i]phii)` 的极小问题。根据极值的一阶必要条件，变量
    `alpha[i]` 可以由方程求解：


    $$\begin{array}{l} \frac{\partial}{\partial\alpha_{i}}J\left( {\sum\limits_{i
    = 1}^{N}{\alpha_{i}\varphi_{i}} \right) = 0.} \end{array}$$


    在这些方程中加上条件 (A.2)，我们得到了求解系数 `alpha[i]` 的方程组，从而定义了解 (A.6)。


