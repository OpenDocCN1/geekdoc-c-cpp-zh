    with polynomials of the second order suffice for $\mathcal{G}[2]$ mesh.


    When calculating integral (6.6) we make use of some properties of the $\mathcal{G}[2]$
    mesh. Firstly, when computing ${\overline{A}}_{\alpha\beta}$ over triangle with
    straight edges, matrix `J`^(−1) = `B`^(−*T*) does not depend on $\hat{\mathbf{\mathbf{x}}}$
