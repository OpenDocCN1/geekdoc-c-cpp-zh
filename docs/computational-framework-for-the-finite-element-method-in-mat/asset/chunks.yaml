    # Chapter 4 Building Two-Dimensional Meshes


    DOI: [10.1201/9781003265979-4](https://doi.org/10.1201/9781003265979-4)


    FIRST four steps of the FEM algorithm given in [section 3.6](#chapter3.xhtml_sec3_6)
    will be covered in this chapter. We will describe how to define geometry of a
    problem and build two-dimensional triangular mesh using MATLAB and Python tools.
    Basic data structure for the mesh representation will be considered.


    Basically, generating geometry for a domain with simple boundary shape is not
    a challenge; however things become more complicated when a geometry has subdomains
    or nontrivial boundary shape. In general, the problem of generating geometry can
    be viewed as having two tasks: geometry definition through some data structure,
    and performing triangulation to build finite elements. In this chapter we are
    focussed on the first task, namely, various approaches of how to create data structures
    for geometry definition and how to represent mesh in a matrix form. Questions
    of how to encode boundary and build geometry will be discussed as well.


    To perform triangulation itself using predefined geometry definition, we are going
    to use specific MATLAB and Python tools. Triangulation algorithm implementation
    is not discussed below and it is beyond the scope of the book, but rather existing
    implementation as a tool or third-party library is used. Interested reader can
    find mesh generating algorithms in [[3](#ref01.xhtml_refbib_3)] where some triangulation
    techniques are discussed.


    ## 4.1 DEFINING GEOMETRY


    Let us start with considering an example geometry to show how it can be represented
    to use with the FEM solver. [Figure 4.1](#chapter4.xhtml_fig4_1) shows an example
    of the geometry domain Ω. This domain consists of three labelled subdomains, *Ω*[1],
    *Ω*[2] and *Ω*[3] so that *Ω* = *Ω*[1] ∪ *Ω*[2] ∪ *Ω*[3]. It is seen that *Ω*[1]
    and *Ω*[3] are rectangles and *Ω*[2] is a square. A circle of radius 0.25 is removed
    from *Ω*[1]. Also, it is highlighted that we have internal area of the geometry
    (coloured in grey) and external one which is called complement of the domain Ω
    and will be referenced as *Ω*[0]. The geometry is split into subdomains to illustrate
    the fact that PDE coefficients could be different in these subdomains and we need
    to take it into account.


