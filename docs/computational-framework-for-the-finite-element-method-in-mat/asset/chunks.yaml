    让我们考虑函数近似方法。在这里，我们将讨论两种方法：使用单一全局插值多项式分段多项式插值。两种方法都基于拉格朗插值多项式。由于分段插值的概念是全局插值的扩展，我们首先开始考虑全局插值。


    ### 1.3.1 全局插值多项式


    设 `u` = `u(x)` 为闭闭区间 `[s[0], s[1]]` 上的连续函数，并有一组定义的节点集


    $$\begin{array}{l} {s_{0} = x_{1} < x_{2} < \cdots < x_{m + 1} = s_{1},\quad h
    = s_{1} - s_{0},} \end{array}$$


    以及 `u[i]` = `u(x[i])`，`i` = 1, …, … `m` + 1。那么，存在一个次数不超过 `m` 的唯一多项式 `u[h]` 满足


    $$\begin{array}{l} {u_{h}(x_{i}) = u_{i},\quad i = 1,\ldots,m + 1.} \end{array}$$(1.10)


    注意 `uh` 并不是 `u(x)`，而是近似值，它在给定的节点集中与 `u(x)` 重合。多项式近似 `uh` 可以通过不同的方式创建，但我们感兴趣的是具有形式的拉格朗插值多项式


    $$\begin{array}{l} {u_{h}(x) = {\sum\limits_{i = 1}^{m + 1}{u_{i}\varphi_{i}(x)}},\quad\varphi_{i}(x)
    = {\prod\limits_{j = 1,j \neq i}^{m + 1}\frac{x - x_{j}}{x_{i} - x_{j}}}.} \end{array}$$(1.11)


    换句话说，我们寻求的是形式为已知权重 `u[i]` 的多项式 `φi` 线性组合的近似值。


    可以看出


    $$\begin{array}{l} {\varphi_{i} \in \mathcal{G}_{m},\quad\varphi_{i}(x_{j}) =
    \delta_{ij},\quad j = 1,\ldots,m + 1,} \end{array}$$


    其中 `G[m]` 表示次数不超过 `m` 的多项式集合，`δ[i*j]` 是克罗内克符号。函数 `φi` 被称为基，是因为它们在 `G[m]` 中构成了一个基，且任何多项式
    `p` ∈ `G[m]` 都可以通过该基表示（见 1.11）。特别，如果 `u[h]` ≡ 1，根据 (1.11) 可以得出


    $$\begin{array}{l} {{\sum\limits_{i = 1}^{m + 1}{\varphi_{i}(x)}} = 1,\quad x
    \in \lbrack s_{0},s_{1}\rbrack.} \end{array}$$(1.12)


    值得注意的是，使用表达式 (1.11) 评估基函数 `φi` 需要 `O(m²)` 次操作，对于较大的 `m` 值，计算开销将是非常昂贵的。因此，希望将 (1.11)
    改写为另一种形式的插值公式，可以称为重心形式公式


    $$\begin{array}{l} {\varphi_{i}(x) = w(x)\frac{\beta_{i}}{x_{i}},\quad u_{h}(x)
    = w(x){\sum\limits_{i = 1}^{m + 1}\frac{\beta_{i}}{x_{i}}}u_{i}}}, \end{array}$$(1.13)


    其中


    $$\begin{array}{l} {w(x) = {\prod\limits_{j = 1}^{m + 1}(x - x_{j})}},\quadbeta_{i}
    = \left( {\prod\limits_{j = 1,j \neq i}^{m + 1}(x_{i} - x_{j})}} \right)^{-1},}
    \end{array}$$(1.14)


    系数 `β[i]` 被称为重心公式的权重。根据 (1.12) 可以得出


    $$\begin{array}{l} {1 = {\sum\limits_{i = 1}^{m + 1}\varphi_{i}(x)}} = w(x){\sum\limits_{i
    = 1}^{m + 1}\frac{\beta_{i}}{x_{i}}}, \end{array}$$


    通过利用这一事实，我们得到了重心插值公式的最终形式


    $$\begin{array}{l} {u_{h}(x) = \left( {\sum\limits_{i = 1}^{m + 1}\frac{\beta_{i}}{x
    - x_{i}}} \right)^{-1}{\sum\limits_{i = 1}^{m + 1}\frac{\beta_{i}}{x_{i}}}u_{i}}},
    \end{array}$$(1.15)


    以及基函数


    $$\begin{array}{l} {\varphi_{i}(x) = \left( {\sum\limits_{i = 1}^{m + 1}\frac{\beta_{i}}{x
    - x_{i}}} \right)^{-1}\frac{\beta_{i}}{x_{i}}.} \end{array}$$(1.16)


    显易看出，对于任何给定的 `x`，使用表达式 (1.15) 计算 `uh` 需要 `O(m)` 次操作。权重 `β[i]` 不依赖于 `x`。(1.15)
    的一个重要性质是，当权重 `β[i]` 相乘时，(1.15)–(1.16) 仍然有效。对于特定的节点分布，例如均匀间距的点，重心权重可以通过公式给出


    $$\begin{array}{l} {\beta_{i} = (-1)^{i}i!},\quad i = 1,\ldots,m.} \end{array}$$$(1.17)


    为了说明权重 `β[i]` 的计算，让我们考虑 4 个节点 `{x[1]=0, x[2]=1, x[3]=2, x[4]=3}`。使用表达式 (1.14)，我们得到
    `{β[1]=-1/6, β[2]=1/2, β[3]=-1/2, β[4]=1/6}`，而 (1.17) 给出这些权重；它们可以被用于 (1.15)–(1.16)。图
    1.2 展示了从四个节点创建的基函数。注意，使用这种基可以精确插值任何三次多项式，如图 1.3 所示。


    ![显示四个节点在有限单元上的拉格朗插值函数的图。线条呈正弦形状，以便在其相关的节点处值为 1，在其他节点处值为 0。](img/fig1_2.jpg)


    [图 1.2:] 对应于节点 `{x[1]=0, x[2]=1, x[3]=2, x[4]=3}` 的。


    ### 分段插值与有限元近似


    现在，我们转向分段插值，它实际上是连接在一起的局部插值。让我们考虑在区间 `[s[0], s[1]]` 上的一组 `n+1` 个节点


    $$\begin{array}{l} {s_{0} = x_{1} < x_{2} < \cdots < x_{n + 1} = s_{1},} \end{array}$$


    以及子区间 `e[i]` = `[x[i], x[i+1]]`，`i` = 1, …, n。那么在每个 `e[i]` 上指定 `m+1` 个不同的节点，使得


    $$\begin{array}{l} {x_{i} = x_{i}^{(1)} < x_{i}^{(2)} < \cdots < x_{i}^{(m + 1)}
    = x_{i + 1},} \end{array}$$


    并且节点总数可以很容易计算为 `N = nm+1`。对于函数 `u(x)` ∈ `C[s[0], s[1]]`，其近似 `uh` ∈ `C[s[0], s[1]]`
    可以定义如下：


    $$\begin{array}{ll} & {u_{h}(x) \in \mathcal{G}_{m},\quad x \in e_{i},\quad i
    = 1,\ldots,n,} \\ & {u_{h}(x_{j}) = u(x_{j}),\quad j = 1,\ldots,N,} \end{array}$$


    '
- fmt: '

    where `h` = `max {h[i], i = 1, …, n}`. In other words, $\lbrack s_{0},s_{1}\rbrack
    = {\underset{i = 1}{\overset{n}{\cup}}e_{i}}$ and function `u(x)` is interpolated
    on each subinterval `e[i]` through Lagrange polynomial of the $m^{(\text{th}}$)}$
    order.


    We can see that each finite element is associated with continuous polynomial $\mathcal{G}[m]$,
    while the spline itself is a piecewise smooth continuous function, which is smooth
    on each subinterval `e[i]` and continuous across the interval `[s[0], s[1]]` (see
    [figure 1.4](#chapter1.xhtml_fig1_4)).


    ![A graph showing four lines of Lagrange basis functions corresponding to two
    finite elements. At the node of the finite element junction these functions are
    continuous but not smooth.](images/fig1_4.jpg)


    [Figure 1.4:](#chapter1.xhtml_b1fig1_4) Lagrange basis functions corresponding
    to the spline with two finite elements `e[1] = [0, 3]` and `e[2] = [3, 6]` having
    nodes `{x[1] = 0, x[2] = 1, x[3] = 2, x[4] = 3, x[5] = 4, x[6] = 5, x[7] = 6}`.
    It is seen that spline at the node `x[4] = 3` is continuous but not smooth function.


    Let us introduce a space of Lagrange splines of degree $m$


    $$\begin{array}{l} {H_{h}^{m}(s_{0},s_{1}): = \left\{ w \in C\lbrack s_{0},s_{1}\rbrack:w(x)
    \in \mathcal{G}_{m},\, x \in e_{i},\, i = 1,\ldots,n \right\}.} \end{array}$$


    Space `H[h]^m(s[0], s[1])` is considered to be an approximation of the space `H^1(s[0],
    s[1])`, and `H[h]^m(s[0], s[1])` $\subset$ `H^1(s[0], s[1])`. Indeed, if `w(x)
    \in H[h]^m(s[0], s[1])` then `w(x)` is a continuous and piecewise differentiable
    function which means that `w \in H^1(s[0], s[1])`. Analogously, approximations
    of the subspaces $\mathcal{W}$ and $\mathcal{W}^0$ associated with integral equation
    (1.8) can be introduced.


    $$\begin{array}{ll} \mathcal{W}_{h} & {: = \left\{ w \in H_{h}^{m}(s_{0},s_{1}):w(s_{0})
    = u_{s_{0}} \right\}, \\ \mathcal{W}_{h}^{0} & {: = \left\{ w \in H_{h}^{m}(s_{0},s_{1}):w(s_{0})
    = 0 \right\}.} \end{array}$$


    Now, we have come to the state when we are ready to give a definition of the FEM
    corresponding to the BVP (1.1)–(1.2).


    Next, we are going to explain how to find the approximate solution `u[h]` through
    reducing the problem to a linear system.


    ### 1.3.3 Linear System of the FEM


    As shown above, the FEM of the BVP (1.1)–(1.2) solves equation (1.18) for unknown
    function `u[h]` and with arbitrary `v[h]`. Introducing a basis in `H[h]^m(s[0],
    s[1])` allows reducing this problem to solving a linear system.


    By considering the interval `[s[0], s[1]]` having `n` finite elements with $m+1$
    nodes each, we obtain the total number of `N = nm+1` nodes, which can be enumerated
    from 1 to `N`:


    $$\begin{array}{l} {s_{0} = x_{1} < x_{2} < \cdots < x_{N} = s_{1}.} \end{array}$$


    Each node `x[i]` can be associated with a Lagrange basis function `phi[i](x) \in
    H[h]^m(s[0], s[1])`. Basis introduced in [section 1.3.1](#chapter1.xhtml_sec1_3_1)
    comprises smooth functions while `u[h] \in H[h]^m(s[0], s[1])` is a piecewise
    smooth spline and corresponding basis comprises piecewise smooth functions as
    well. Functions `phi[i](x)` have property of taking nonzero value only in the
    corresponding finite element and zero otherwise. A basis function associated with
    a node, which is shared by two elements, is nonzero in these two elements (see
    [figure 1.5](#chapter1.xhtml_fig1_5)). As such, every `phi[i](x)` takes nonzero
    values in one or two finite elements. Recall that `phi[i](j) = 0` if $i \neq j$,
    and `phi[i](i) = 1`.


    ![Two parts of graphs showing basis functions with Lagrange spline. Part (a) shows
    a basis associated with a node within finite element and the graph spans single
    element. Part (b) shows a basis associated with node of two finite elements and
    a graph spans two elements.](images/fig1_5.jpg)


    [Figure 1.5:](#chapter1.xhtml_b1fig1_5) of basis functions associated with Lagrange
    spline having two finite elements `e[1] = [0, 3]`, `e[2] = [3, 6]`, and seven
    nodes `{x[1] = 0, x[2] = 1, ..., x[7] = 6}`: (a) `phi[2](x)` corresponding to
    node `x[2] = 1`; (b) `phi[4](x)` corresponding to node `x[4] = 3`.


    Let us denote node values as `u[i] = u[h](x)` and `v[i] = v[h](x)`, then any functions
    `u[h] \in \mathcal{W}` and `v[h] \in \mathcal{W}^0` can be decomposed in terms
    of basis `phi[i](x) \in H[h]^m(s[0], s[1])` as following [#chapter1.xhtml_fn1_3]:


    $$\begin{array}{ll} {u_{h}(x) & = {\sum_{j = 1}^{N}u_{j}\varphi_{j}(x)} = u_{s_{0}}\varphi_{1}(x)
    + {\sum_{j = 2}^{N}u_{j}\varphi_{j}(x)}}, \\ {v_{h}(x)} & = {\sum_{i = 1}^{N}v_{i}\varphi_{i}(x)}},\quad
    x \in [s_{0},s_{1}],} \end{array}$$(1.19)


    or


    $$\begin{array}{l} {u_{h}(x) = \mathbf{\varphi}^T\mathbf{u},\quad v_{h}(x) = \mathbf{\varphi}^T\mathbf{v}},}
    \end{array}$$(1.20)


    where `u = {u[i]}_{i=1}^N`, `v = {v[i]}_{i=1}^N` and `phi = {phi[i](x)}_{i=1}^N`
    are column-vectors. By substituting (1.20) into equation (1.18), we come to the
    expression [#chapter1.xhtml_fn1_4]:


    $$\begin{array}{ll} \int_{s_{0}}^{s_{1}} & {\left( {c\mathbf{v}^T\mathbf{\varphi}''(\mathbf{\varphi}'')^T\mathbf{u}}
    + b\mathbf{v}^T\mathbf{\varphi}(\mathbf{\varphi}'')^T\mathbf{u}} + a\mathbf{v}^T\mathbf{\varphi}\mathbf{\varphi}^T\mathbf{u}}
    \right)dx} \\ & {\text{\quad\quad}\text{\quad\quad} + \sigma\mathbf{v}^T\mathbf{\varphi}(s_{1})\mathbf{\varphi}(s_{1})^T\mathbf{u}}
    = \int_{s_{0}}^{s_{1}}f\mathbf{v}^T\mathbf{\varphi}}dx + \mu\mathbf{v}^T\mathbf{\varphi}(s_{1}).}
    \end{array}$$(1.21)


    By introducing a matrix $\tilde{A} \sim (N \times N)$ and a vector $\tilde{F}
    \sim (N \times 1)$ having components


    $$\begin{array}{l} {\widetilde{A}}_{ij} = \int_{s_{0}}^{s_{1}}\left( {c\varphi_{i}''\varphi_{j}''
    + b\varphi_{i}\varphi_{j}'' + a\varphi_{i}\varphi_{j}} \right)dx + \sigma\varphi_{i}(s_{1})\varphi_{j}(s_{1}),}
    \end{array}$$(1.22)


    $$\begin{array}{l} {\widetilde{F}}_{i} = \int_{s_{0}}^{s_{1}}f\varphi_{i}dx +
    \mu\varphi_{i}(s_{1}),} \end{array}$$(1.23)


    we can rewrite (1.21) in the form


    $$\begin{array}{l} {\mathbf{\varphi}^T\tilde{A}\mathbf{u} = \mathbf{\varphi}^T\tilde{F}}.}
    \end{array}$$(1.24)


    Expression (1.24) can be seen as a sum of equations defined by the system $\tilde{A}\mathbf{u}
    = \tilde{F}$ (actually, we can ignore the first equation since it corresponds
    to the value `v[1] \equiv 0`). Identity (1.24) is valid for any `v`, so by cancelling
    it out and by splitting the vector `u` into unknown and known parts, we come to
    the linear system


    $$\begin{array}{l} {{\sum_{j = 2}^{N}{\widetilde{A}}_{ij}}u_{j} = {\widetilde{F}}_{i}
    - u_{s_{0}}{\widetilde{A}}_{i1},\quad i = 2,\ldots,N.} \end{array}$$(1.25)


    From solving linear system (1.25), we obtain values for `u[j]` and the final approximate
    solution to the BVP can be found using the first formula in (1.19).


