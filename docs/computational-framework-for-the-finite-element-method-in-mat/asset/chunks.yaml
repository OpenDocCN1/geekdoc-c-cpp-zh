    *φ*[*i*[*α*]](**p**[*e*]) = 1/2 is taken into account.


    ## 5.4 CALCULATING EQUATION COEFFICIENTS


    Stiffness matrices depend on the coefficients of the partial differential equation
    (*c*, **b**, *a*, *f*) and we need to decide how to incorporate calculation of
    these coefficients into FEM. Note that the equation coefficients could be piecewise
    functions on subdomains. Recall that the domain Ω where the solution is sought
    could consist of subdomains. Each subdomain is supposed to have unique label,
    sdl, and this label can be retrieved from the connectivity matrix t so that sdl=t(4,:).
    As such, each element ’knows’ about subdomain to which it belongs. We can construct
    a function which takes as an input subdomain label sdl and performs calculation
    of the coefficient, for example, if we have three subdomains *Ω*[1], *Ω*[2], *Ω*[3],
    and coefficient *c* is defined as


    $$\begin{array}{l} {c(\mathbf{\mathbf{p}}) = \left\{ \begin{array}{ll} {1,} &
    {\mathbf{\mathbf{p}} \in \Omega_{1},} \\ {x_{1}^{2} + x_{2},} & {\mathbf{\mathbf{p}}
    \in \Omega_{2},} \\ {\sin(x_{1} + x_{2}),} & {\mathbf{\mathbf{p}} \in \Omega_{3},}
    \end{array}~ \right.} \end{array}$$


    then the function in [listing 5.11](#chapter5.xhtml_list5_11) calculates the coefficient
    *c*.


    ![](images/comp05_12.jpg)


    This function can be called at any time when coefficient values need to be calculated.
    It is worth noting that this is a vectorized function which allows to calculate
    coefficients over all subdomain points.


    ## 5.5 CALCULATING GLOBAL STIFFNESS MATRIX AND FORCING VECTOR


    In [section 5.3](#chapter5.xhtml_sec5_3) we obtained expression for calculating
    local stiffness matrices and local force vectors for the 𝒢[1] mesh. Now, let us
    incorporate this information into the algorithms provided in [sections 5.1](#chapter5.xhtml_sec5_1)
    and [5.2](#chapter5.xhtml_sec5_2). We provide two versions of the algorithm: vectorized
    and non-vectorized. Let us start with non-vectorized version given in [listing
    5.12](#chapter5.xhtml_list5_12).


    ![](images/comp05_13.jpg)![](images/comp05_13_2.jpg)


    Analysis of the function assemblingAF_nv() shows that in order to vectorize it
    we need to avoid using loop and assemble local stiffness matrices on place once
    they have been calculated. As a result, we come to the vectorized version of the
    algorithm (see [listing 5.13](#chapter5.xhtml_list5_13)).


    ![](images/comp05_14.jpg)![](images/comp05_14_2.jpg)


    Let us compare computational costs of these two functions. We take a domain having
    three subdomains with geometry defined by matrix geometryMatrix (see [figure 4.1](#chapter4.xhtml_fig4_1))
    and specify coefficients of the PDE as follows:


    ![](images/comp05_15.jpg)![](images/comp05_16.jpg)![](images/comp05_17.jpg)![](images/comp05_18.jpg)![](images/comp05_19.jpg)


    Then, we run the script shown in [listing 5.19](#chapter5.xhtml_list5_19) to measure
    CPU time for three meshes with different number of nodes.


    ![](images/comp05_20.jpg)


    As a result, we come to [table 5.3](#chapter5.xhtml_tbl5_3) which shows that vectorized
    version outperforms non-vectorized one, that is predictable due to more efficient
    memory management of the vectorized calculations in MATLAB.


    [Table 5.3:](#chapter5.xhtml_b5tbl5_3) Summary of the computational efficiency
    test for assembling global stiffness matrix and forcing vector. Last two columns
    contain CPU time for the corresponding algorithm version.


    | np | nt | assemblingAF | assemblingAF_nv |


    | --- | --- | --- | --- |


    | 704 | 1312 | 0.00391 | 1.08008 |


    | 2670 | 5148 | 0.00781 | 3.73047 |


    | 16473 | 32466 | 0.05566 | 23.62988 |


    Python implementation of the function assemblingAF() can be found in [Appendix
    E.1](#appE.xhtml_appE) where corresponding explanations are provided.


    ## 5.6 CALCULATING BOUNDARY CONDITIONS


    Below, we describe one of the possible methods of calculating boundary conditions.
    Later, we make use of this approach to incorporate boundary conditions into final
    FEM matrix.


    Recall that the boundary Γ of the problem domain Ω is supposed to be split into
    two parts, *Γ*[*D*] and *Γ*[*R*], on which different boundary conditions could
    be defined (see [section 3.1](#chapter3.xhtml_sec3_1)). Boundary parts *Γ*[*D*]
    and *Γ*[*R*], in turn, are union of the corresponding boundary segments defined
    in geometry matrix. We associate each segment with either function *u*[*D*] (for
    the Dirichlet boundary *Γ*[*D*]) or with pair of functions (*σ*, *μ*) (for the
    Robin boundary *Γ*[*R*]). Thereby, we define conditions on *Γ*[*D*] and *Γ*[*R*]
    separately.'
