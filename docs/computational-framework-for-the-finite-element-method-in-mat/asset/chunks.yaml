    To compute integral (6.6) we apply quadrature rule. Let us denote the integrand
    as $\hat{z}(\hat{\mathbf{\mathbf{x}}})$, then


    $$\begin{array}{l} {{\overline{A}}_{\alpha\beta} = \int\limits_{\hat{\tau}}\hat{z}(\hat{\mathbf{\mathbf{x}}})d\hat{\mathbf{\mathbf{x}}}
