    \ \\end{array}$}(1.9)\n\n表达式 (1.9) 是一个积分方程，如果 `u(x)` 是边界值问题 (1.1)–(1.2) 的解，那么可以看到它满足\
    \ (1.9)。如果我们通过条件 `u(s[0])=u[0]` 补充积分方程 (1.9)，则逆它是成立的。结果是方程 (1.1) 和边界条件 (1.2) 现在转换为一个表达式\
    \ (1.9)，其中 `u(s[0])=u[0]` 且 `v(s[0])=0`。这里值得注意的是，原始边界值问题建议 `u` 具有二阶导数。另一方面，积分形式\
    \ (1.9) 只提到 `u(x)` 的一阶导数，这意味着对解性质的要求较低。此外，由于 Sobolev 空间的性质，`L[2]` 投影 `u(x)` 不要求寻找的函数具有连续导数。因此，我们通过说函数\
    \ `u(x)` 现在是具有一阶分段连续导数的积分连续函数（也就是说，属于 Sobolev 空间）来放宽边界值问题的某些条件。由于这个原因，(1.9) 被称为原始边界值问题的`弱形式`(weak\
