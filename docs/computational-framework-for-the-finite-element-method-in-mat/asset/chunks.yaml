    $$\begin{array}{l} {A_{n_{l} + \alpha,n_{l} + \beta}^{l} = {\overline{A}}_{\alpha\beta}^{l},\quad\alpha,\beta
    = 1,\ldots,m + 1.} \end{array}$$(1.76)


    总结来说，我们可以看到全局刚度矩阵 `A` 可以通过扩展局部刚度矩阵 `A^{(l)}` 的和得到，而这些矩阵又是通过局部矩阵 (1.75) 计算的。


    $$\begin{array}{l} {A = {\sum\limits_{l = 1}^{n}A^{l}}.} \end{array}$$


    类似地，全局力向量是两个向量之和，`tilde{F} = F + M`（参见 (1.23)）


    $$\begin{array}{l} {F_{i} = \int\limits_{s_{0}}^{s_{1}}f\varphi_{i}dx,\quad M_{i}
    = \mu\varphi_{i}(s_{1}),\quad i = 1,\ldots,N.} \end{array}$$(1.77)


    通过引入局部力向量 $\left. \mathbf{\overline{F}} \right.\sim\left( {(m + 1) \times 1} \right)$：


    $$\begin{array}{l} {{\overline{F}}_{\alpha}^{l} = \int\limits_{x_{n_{l} + 1}}^{x_{n_{l}
    + m + 1}}f\varphi_{n_{l} + \alpha}dx,\quad\alpha = 1,\ldots,m + 1,} \end{array}$$(1.78)


    以及扩展局部力向量 `F ~ (N \times 1)`，如下：


    $$\begin{array}{l} {F_{n_{l} + \alpha}^{l} = {\overline{F}}_{\alpha}^{l},\quad\alpha
    = 1,\ldots,m + 1,} \end{array}$$(1.79)


    我们得到了表达式：


    $$\begin{array}{l} {\mathbf{\mathbf{F}} = {\sum\limits_{l = 1}^{n}\mathbf{\mathbf{F}}^{l}}.}
    \end{array}$$


    注意，扩展局部力向量 `F^{(l)}` 包含了除局部力向量 (1.79) 定义的值以外的所有零元素。


    矩阵 `S` 和向量 `M` 源于边界条件，⬩它们在单点 `s[1]` 处指定。由于 `phii = delta[i][j]` 且 `s[1] = x[N]`，因此
    `S` 和 `M` 均只有一个非零值，即 `S[N][N] = sigma` 和 `M[N] = mu`。


    结果，我们得到了组装刚度矩阵和力向量的算法。


    ![](img/comp01_2.jpg)


    随后，我们创建了实现该算法的程序代码并进行详细讨论。到目前为止尚未说明的问题是如何计算局部矩阵的元素。下面，我们将注意力转向这一问题，并推导出一个计算这些元素的算法。


    ### 1.5.3 局部矩阵元素的计算


    我们从一个简单的情况开始，即计算积分 (1.78) 定义的第 `l^{(th)}` 有限元的局部力向量元素。通过观察表达式 (1.78)，我们发现被积函数依赖于局部基函数
    `phi[n[l] + \alpha]`，该函数具有拉格朗多项式的形式：


    $$\begin{array}{l} {\varphi_{n_{l} + \alpha}(x) = {\prod\limits_{j = 1,j \neq
    \alpha}^{m + 1}\frac{x - x_{n_{l} + j}}{x_{n_{l} + \alpha} - x_{n_{l} + j}}},\quad
    x \in \lbrack x_{n_{l} + 1},x_{n_{l} + m + 1}\rbrack,} \end{array}$$(1.80)


    它依赖于全局索引 `n[l]`。我们的目标是将表达式 (1.80) 转换为与全局索引无关的形式，以便获得跨越所有单元的不变基。为了实现这一点，让我们引入局部变量
    `\hat{x}` 和如下变换：


    $$\begin{array}{ll} {\hat{x} = \frac{x - x_{n_{l} + 1}}{h_{l}},\quad x = x_{n_{l}
    + 1} + \hat{x}h_{l},} \\ {dx = h_{l}d\hat{x},\quad h_{l} = x_{n_{l} + m + 1} -
    x_{n_{l} + 1}.} \end{array}$$(1.81)


    可以看出，表达式 (1.81) 规定了线性变换，使得 `n[l] + j \to \hat{x}[j]`，或者：


    $$\begin{array}{l} \left. x_{n_{l} + 1},\ldots,x_{n_{l} + m + 1}\rightarrow 0
    = \hat{x}_{1},\ldots,\hat{x}_{m + 1} = 1, \end{array}$$


    并且对于 `n[l] + m + 1`，`e[l] = [0, 1]`。结果，任何有限元都被转换为单位长度的标准单元或基单元。此外，将 (1.81) 代入
    (1.80) 得到：


    $$\begin{array}{l} {\varphi_{n_{l} + \alpha}(x) = \varphi_{n_{l} + \alpha}(x_{n_{l}
    + 1} + \hat{x}h_{l}) = {\prod\limits_{j = 1,j \neq \alpha}^{m + 1}\frac{\hat{x}
    - \hat{x}_{j}}{\hat{x}_{\alpha} - \hat{x}_{j}}} = {\hat{\varphi}}_{\alpha}(\hat{x}),}
    \end{array}$$(1.82)


    其中基函数 `\hat{\phi}[\alpha]` 现在用局部变量 `\hat{x}` 表示。如果我们记为 `\hat{f} = f(n[l] + 1 +
    \hat{x}h[l])`，则积分 (1.78) 可以重写为：


    $$\begin{array}{l} {\overline{F}}_{\alpha}^{l} = h_{l}\int\limits_{0}^{1}\hat{f}\hat{\varphi}_{\alpha}d\hat{x},\quad\alpha
    = 1,\ldots,m + 1.} \end{array}$$(1.83)


    积分 (1.83) 在某些情况下（例如 `\hat{f}` 为常数）可以精确计算。通常情况下，我们必须应用数值积分法：


    $$\begin{array}{l} {\overline{F}}_{\alpha}^{l} = h_{l}\sum\limits_{k=1}^{q}\hat{\gamma}_{k}\hat{\varphi}_{\alpha}(\hat{d}_{k}),\quad\alpha
    = 1,\ldots,m+1.} \end{array}$$(1.84)


    其中 `q` 是积分点数量，`\hat{\gamma}[k]` 和 `\hat{d}[k]` 分别是权重和节点。目前，我们不考虑其构造，通过 (1.84)
    得到了局部力向量的表达式。同样，刚度矩阵的计算可以通过数值积分简化。通过使用变换 (1.81) 并引入函数 `\hat{a}`、`\hat{b}` 和 `\hat{c}`，积分
    (1.75) 变为：


    $$\begin{array}{l} {\overline{A}_{\alpha\beta}^{l} = \int_{0}^{1}(h_{l}^{-1}\hat{c}\varphi_{\alpha}''\varphi_{\beta}''
    + \hat{b}\varphi_{\alpha}\varphi_{\beta}'' + \hat{a}\varphi_{\alpha}\varphi_{\beta})d\hat{x},}
    \end{array}$$


    在这里，我们利用 `phi(x)'' = \hat{\phi}(\hat{x})''` 的事实。因此：


    $$\begin{array}{cl} {\overline{A}_{\alpha\beta}^{l} \approx \sum\limits_{k=1}^{q}\hat{\gamma}_{k}(h_{l}^{-1}\hat{c}\hat{\varphi}_{\alpha}''(\hat{d}_{k})\hat{\varphi}_{\beta}''(\hat{d}_{k})
    + \hat{b}\hat{\varphi}_{\alpha}(\hat{d}_{k})\hat{\varphi}_{\beta}''(\hat{d}_{k})
    + \hat{a}\hat{\varphi}_{\alpha}(\hat{d}_{k})\hat{\varphi}_{\beta}(\hat{d}_{k}))}
    & {\alpha,\beta =} & {1,\m + 1.} \end{array}$$(1.85)


    表达式 (1.84) 和 (1.85) 定义了局部矩阵的数值计算。直观上，积分精度越高，有限元的精度就越高。为了，我们假设积分计算是近似的，并用 `=` 替换
    `≈` 以避免复杂的符号。


    让我们用矩阵形式重写 (1.84) 和 (1.85)。为了实现这一点，我们引入了辅助矩阵 `\hat{E}[k\alpha] = \hat{\phi}\alpha`
    和 `\hat{D}[k\alpha] = \hat{\phi}[\alpha]''(\hat{d}[k])`，其维度为 `q \times (m+1)`。借助这些矩阵，局部力向量公式
    (1.84) 变为矩阵形式：


    $$\begin{array}{l} {\mathbf{\overline{F}}^{l} = {\hat{E}}^{T}\mathbf{\hat{F}}^{l},\quad\mathbf{\hat{F}}^{l}
    = h_{l}\left( {{\hat{\gamma}}_{1}\hat{f}(\hat{d}_{1}),\dots,{\hat{\gamma}}_{q}\hat{f}(\hat{d}_{q})}
    \right)^{T.} \end{array}$$(1.86)


    从 (1.86)得到的有趣的观察是：对于所有 `l`，当 `h[l] = constant` 且积分节点分布 `\hat{d}[k]` 相同同时，则局部力向量只需要计算一次（所有局部向量都相等）。


    现在，很容易将局部刚度矩阵 (1.85) 的计算表示为矩阵表达式：


    $$\begin{array}{l} {{\overline{A}}^{l} = {\hat{D}}^{T}{\hat{C}}^{l}\hat{D} + {\hat{E}}^{T}{\hat{B}}^{l}\hat{D}
    + {\hat{E}}^{T}{\hat{A}}^{l}\hat{E},}} \end{array}$$


