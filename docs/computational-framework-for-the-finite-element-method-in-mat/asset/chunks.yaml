    Array slicing and indexing works exactly the same way it does for lists except
    that they can be applied to multiple dimensions as well. For example, given a
    matrix `A`, the command `A[0,3]` accesses a single element of the matrix, and
    `A[:,3]` extracts a column. Note that slices of arrays do not copy the internal
    array data but only produce new views of the original data, so if `b=A[0,3]` and
    `b=b+1` then element of matrix `A` would be modified implicitly as well. If a
    copy is needed, then an explicit `copy()` command is required. NumPy arrays may
    be indexed with other arrays or lists. For all cases of index arrays, the copy
    of original data is returned, not a view. For example `A[np.array([0,2,4]),0]`
    or `A[np.array([0,2,4])][0]` returns elements of the first column with indices
    0, 2 and 4.


    To operate with sparse matrices in Python we use `scipy.sparse` library. There
    are various sparse matrix classes in `scipy.sparse` library (`coo_matrix`, `csc_matrix`,
    `csr_matrix`, etc.) to perform matrix manipulations of different types. For example,
    class `coo_matrix` is used for constructing a sparse matrix in coordinate format
    from arrays of indices and values (see [figure 2.1](#chapter2.xhtml_fig2_1) for
    detailed explanations) but it does not directly support arithmetic operations.
    Class `sparse.lil_matrix` is a structure for constructing sparse matrices incrementally
    which supports flexible slicing. Classes `csr_matrix` and `csc_matrix` are for
    compressed sparse row matrix and compressed sparse column matrix representations,
    respectively. These matrix formats are suitable for arithmetic operations and
    row/column slicing but inefficient for changing sparsity structure. Usually, `coo_matrix`
    is a fast format for constructing sparse matrices. Once a matrix has been constructed,
    conversion to `csc_matrix` or `csr_matrix` format is performed (explicitly or
    implicitly) for fast arithmetic and matrix vector operations.


    Before start writing Python functions, it is required to import libraries which
    we will be using across the code. Script in [listing 2.11](#chapter2.xhtml_list2_11)
    shows how to perform importing. Libraries `numpy` and `scipy.sparse` are for working
    with dense and sparse matrices, `solve` is for solving sparse linear systems,
    `plt` is for plotting simulation results and `timeit` library allows operate with
    timing counters. We need to run this script only once in the FEM Python library.


    ![](images/comp02_16.jpg)


    Python listings given below contain functions which names and functionality repeat
    ones written in MATLAB, so notations of arguments and returning values have consistent
    with MATLAB counterparts meaning. While providing Python implementation of particular
    function, the focus will be on specific Python language features which differ
    the code from MATLAB version rather than on describing logic, which already has
    been discussed in previous sections.


    Let us look into Python implementation of Gaussian and Lobatto quadrature rules
    (see [listings 2.12](#chapter2.xhtml_list2_12) and [2.13](#chapter2.xhtml_list2_13)).
    By design, arguments `s0` and `s1` can be omitted, so the code line 2 retrieves
    the number of actual input arguments and stores it in the variable `nargin`. This
    is done through the function `locals()` which returns a vector of arguments, and
    the function `len()` returning vector length.


    We can see in the code arithmetic calculation of the form `j**2`, which implements
    raising `j` to the second power. The function `numpy.diag(bta,k)` constructs a
    diagonal matrix from a given array, `bta`, and a diagonal position, `k`. The function
    `linalg.eig(Q)` computes eigenvalues and eigenvectors of the matrix `Q`. To obtain
    ordered eigenvalues, function `numpy.argsort(L)` is used which returns the indices
    that would sort the array `L`.


    ![](images/comp02_17.jpg)


    Code lines 18–21 in [listing 2.13](#chapter2.xhtml_list2_13) implement extending
    arrays of weights, `w`, and nodes, `d`, with new values at the boundary. This
    is coded through the functions `numpy.append()` to append value to the end of
    the array, and `numpy.insert()` to insert the value at the beginning of the array.
    Overall, calculations follow linear logic of the corresponding algorithms for
    Gaussian and Lobatto quadrature rules.


    ![](images/comp02_18.jpg)


    Script [listing 2.14](#chapter2.xhtml_list2_14) demonstrates how interpolating
    and differentiating matrices calculation can be implemented in Python. Note that
    it is a good practice to declare and initialize variables before using them to
    make it clear of what data manipulations are allowed to work with. Lines 2–6 introduce
    main variables which are used across the listing where `nx` and `nd` represent
    lengths of corresponding input arrays, `E` and `D` are declared to be zeroth matrices
    of dimension `nd` by `nx`, and `b` is a one-dimensional array of length `nx`.
    Function `numpy.zeros((nd,nx))` returns a matrix of zeros with the given shape,
    `(nd,nx)`, and if the second dimension is omitted, then a vector is returned.
