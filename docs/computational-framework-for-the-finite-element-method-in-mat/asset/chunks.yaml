    functions while *u*[*h*] ∈ *H*[*h*]^(*m*)(*s*[0], *s*[1]) is a piecewise smooth
    Lagrange spline and corresponding basis comprises piecewise smooth functions as
    well. Functions *φ*[*i*](*x*) have a property of taking nonzero value only in
    the corresponding finite element interval and zero otherwise. A basis function
    associated with a node, which is shared by two finite elements, is nonzero in
    these two elements (see [figure 1.5](#chapter1.xhtml_fig1_5)). As such, every
    *φ*[*i*](*x*) takes nonzero values in either one or two finite elements. Recall
    that *φ*[*i*](*x*[*j*]) = 0 if *i* ≠ *j*, and *φ*[*i*](*x*[*i*]) = 1.


