    the difference between linear and curvilinear triangle elements is the way of
    transformation from *τ̂* to *τ*.


    Likewise linear 𝒢[2] elements, to represent any function defined on curvilinear
    element *τ* through the basis function we utilize the expression (6.3) where basis
    functions now are not polynomials of the second order but function of the **x**
    being itself second-order polynomial.


