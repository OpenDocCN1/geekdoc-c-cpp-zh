    \ 时 `v(x*)=0`；取 `h` → 0 的极限并得到 (1.1)。\n\n"
- fmt: 'Let us consider function approximation methods. Here, we discuss two approaches:
    using single global interpolating polynomial and piecewise polynomial interpolation.
    Both approaches are based on Lagrange interpolating polynomials. Since the concept
    of piecewise interpolation is an extension of the global one, we start with considering
    global interpolation first.


    ### 1.3.1 Global Interpolating Polynomial


    Let `u` = `u(x)` be a continuous on the closed interval `[s[0], s[1]]` function
    with defined set of nodes


    $$\begin{array}{l} {s_{0} = x_{1} < x_{2} < \cdots < x_{m + 1} = s_{1},\quad h
    = s_{1} - s_{0},} \end{array}$$


    and `u[i]` = `u(x[i])`, `i` = 1, …, … `m` + 1. Then, there is a unique polynomial
    `u[h]` of degree not greater than `m` satisfying


    $$\begin{array}{l} {u_{h}(x_{i}) = u_{i},\quad i = 1,\ldots,m + 1.} \end{array}$$(1.10)


    Note that `u[h](x)` is not the same as `u(x)`, but rather an approximation, which
    coincides with `u(x)` in a given set of nodes. Polynomial approximation `u[h](x)`
    can be created in different ways, but we are interested in Lagrange interpolating
    polynomials having the form


    $$\begin{array}{l} {u_{h}(x) = {\sum\limits_{i = 1}^{m + 1}{u_{i}\varphi_{i}(x)}},\quad\varphi_{i}(x)
    = {\prod\limits_{j = 1,j \neq i}^{m + 1}\frac{x - x_{j}}{x_{i} - x_{j}}}.} \end{array}$$(1.11)


    In other words, we seek an approximation in the form of linear combination of
    the polynomials `φ[i](x)` with known weights `u[i]`.


    It can be seen that


    $$\begin{array}{l} {\varphi_{i} \in \mathcal{G}_{m},\quad\varphi_{i}(x_{j}) =
    \delta_{ij},\quad j = 1,\ldots,m + 1,} \end{array}$$


    where `G[m]` denotes a set of polynomials of degree not greater than `m`, and
    `δ[i*j]` is the Kronecker delta. Functions `φ[i](x)` are called basis due to the
    fact that they form a basis in `G[m]` and any polynomial `p` ∈ `G[m]` can be represented
    through this basis (see 1.11). Particularly, if `u[h]` ≡ 1, then it follows from
    (1.11) that


    $$\begin{array}{l} {{\sum\limits_{i = 1}^{m + 1}{\varphi_{i}(x)}} = 1,\quad x
    \in \lbrack s_{0},s_{1}\rbrack.} \end{array}$$(1.12)


    It is worth noting that evaluating the basis functions `φ[i](x)` using expression
    (1.11) requires `O(m²)` operations which becomes computationally expensive for
    large values of `m`. For this reason, it is desired to rewrite (1.11) in another
    form of interpolation formula, which can be referred as the barycentric formula


    $$\begin{array}{l} {\varphi_{i}(x) = w(x)\frac{\beta_{i}}{x_{i}},\quad u_{h}(x)
    = w(x){\sum\limits_{i = 1}^{m + 1}\frac{\beta_{i}}{x_{i}}}u_{i}}}, \end{array}$$(1.13)


    where


    $$\begin{array}{l} {w(x) = {\prod\limits_{j = 1}^{m + 1}(x - x_{j})}},\quadbeta_{i}
    = \left( {\prod\limits_{j = 1,j \neq i}^{m + 1}(x_{i} - x_{j})}} \right)^{-1},}
    \end{array}$$(1.14)


    and coefficients `β[i]` are called weights of barycentric formula. It follows
    from (1.12) that


    $$\begin{array}{l} {1 = {\sum\limits_{i = 1}^{m + 1}\varphi_{i}(x)}} = w(x){\sum\limits_{i
    = 1}^{m + 1}\frac{\beta_{i}}{x_{i}}}, \end{array}$$


    and by using this fact, we come to the final form of barycentric interpolation
    formula


    $$\begin{array}{l} {u_{h}(x) = \left( {\sum\limits_{i = 1}^{m + 1}\frac{\beta_{i}}{x
    - x_{i}}} \right)^{-1}{\sum\limits_{i = 1}^{m + 1}\frac{\beta_{i}}{x_{i}}}u_{i}}},
    \end{array}$$(1.15)


    and basis functions


    $$\begin{array}{l} {\varphi_{i}(x) = \left( {\sum\limits_{i = 1}^{m + 1}\frac{\beta_{i}}{x
    - x_{i}}} \right)^{-1}\frac{\beta_{i}}{x_{i}}.} \end{array}$$(1.16)


    It is easy to see that calculations of `u[h](x)` using expression (1.15) for any
    given `x` require `O(m)` operations. Weights `β[i]` do not depend on `x` and ones
    precomputed can be reused for each evaluation of `u[h](x)`.


    An important property of representations (1.15)–(1.16) is that they remain valid
    when weights `β[i]` are multiplied by an arbitrary constant. The weights in the
    denominator are exactly the same as the numerator, and this means that any common
    factor in all the weights may be cancelled. As such, weights `β[i]` can be defined
    up to constant factor.


    For particular case of nodes distribution, explicit formulas for barycentric weights
    can be given. For instance, in case of evenly spaced points `x[i+1]-x[i] = h/m`,
    weights can be calculated through formula


    $$\begin{array}{l} {\beta_{i} = {( - 1)}^{i}\frac{m!}{(m - i + 1)!(i - 1)!},\quad
    i = 1,\ldots,m + 1.} \end{array}$$(1.17)


    To illustrate calculation of weights `β[i]`, let us consider 4 nodes `{x[1]=0,
    x[2]=1, x[3]=2, x[4]=3}`. Using expression (1.14), we come to values `{β[1]=-1/6,
    β[2]=1/2, β[3]=-1/2, β[4]=1/6}`, while formula (1.17) gives `{β[1]=-1, β[2]=3,
    β[3]=-3, β[4]=1}`, which differ by factor 6; nevertheless, they can be equally
    used in (1.15)–(1.16). [Figure 1.2] illustrates four basis functions created from
    the given four nodes and each basis is a polynomial of the third order. Note that
    using this basis allows to interpolate exactly any cubic polynomial (and polynomial
    of degree less than three), which is shown in [figure 1.3].


    ![ graph with four lines illustrating Lagrange basis functions corresponding to
    four nodes on a finite element. Lines have sinusoidal shape so that to have unity
    value at the node with which they are associated and zeroth value at other nodes.](images/fig1_2.jpg)


    [Figure 1.2:] Lagrange basis functions corresponding to nodes `{x[1]=0, x[2]=1,
    x[3]=2, x[4]=3}`.


    ### 1.3.2 Piecewise Interpolation and the Finite Element Approximation


    Now, we turn our attention to the piecewise interpolation, which is effectively
    a number of localized interpolation stitched together. Let us consider a set of
    `n+1` nodes defined on the interval `[s[0], s[1]]`


    $$\begin{array}{l} {s_{0} = x_{1} < x_{2} < \cdots < x_{n + 1} = s_{1},} \end{array}$$


    and subintervals `e[i]` = `[x[i], x[i+1]]`, `i` = 1, …, n. Then, a set of `m+1`
    different nodes are specified on each `e[i]` so that


    $$\begin{array}{l} {x_{i} = x_{i}^{(1)} < x_{i}^{(2)} < \cdots < x_{i}^{(m + 1)}
    = x_{i + 1},} \end{array}$$


    and the total number of nodes can be easily calculated to be `N = nm+1`. Given
    a function `u(x)` ∈ `C[s[0], s[1]]`, its approximation `u[h](x)` ∈ `C[s[0], s[1]]`
    can be defined as follows:


    $$\begin{array}{ll} & {u_{h}(x) \in \mathcal{G}_{m},\quad x \in e_{i},\quad i
    = 1,\ldots,n,} \\ & {u_{h}(x_{j}) = u(x_{j}),\quad j = 1,\ldots,N,} \end{array}$$

    '
  raw: 'Let us consider function approximation methods. Here, we discuss two approaches:
    using single global interpolating polynomial and piecewise polynomial interpolation.
    Both approaches are based on Lagrange interpolating polynomials. Since the concept
    of piecewise interpolation is an extension of the global one, we start with considering
    global interpolation first.


    ### 1.3.1 Global Interpolating Polynomial


    Let *u* = *u*(*x*) be a continuous on the closed interval [*s*[0], *s*[1]] function
    with defined set of nodes


    $$\begin{array}{l} {s_{0} = x_{1} < x_{2} < \cdots < x_{m + 1} = s_{1},\quad h
    = s_{1} - s_{0},} \end{array}$$


    and *u*[*i*] = *u*(*x*[*i*]), *i* = 1, …, *m* + 1. Then, there is a unique polynomial
    *u*[*h*] of degree not greater than *m* satisfying


    $$\begin{array}{l} {u_{h}(x_{i}) = u_{i},\quad i = 1,\ldots,m + 1.} \end{array}$$(1.10)


    Note that *u*[*h*](*x*) is not the same as *u*(*x*), but rather an approximation,
    which coincides with *u*(*x*) in a given set of nodes. Polynomial approximation
    *u*[*h*](*x*) can be created in different ways, but we are interested in Lagrange
    interpolating polynomials having the form


    $$\begin{array}{l} {u_{h}(x) = {\sum\limits_{i = 1}^{m + 1}{u_{i}\varphi_{i}(x)}},\quad\varphi_{i}(x)
    = {\prod\limits_{j = 1,j \neq i}^{m + 1}\frac{x - x_{j}}{x_{i} - x_{j}}}.} \end{array}$$(1.11)


    In other words, we seek an approximation in the form of linear combination of
    the polynomials *φ*[*i*](*x*) with known weights *u*[*i*].


    It can be seen that


    $$\begin{array}{l} {\varphi_{i} \in \mathcal{G}_{m},\quad\varphi_{i}(x_{j}) =
    \delta_{ij},\quad j = 1,\ldots,m + 1,} \end{array}$$


    where 𝒢[*m*] denotes a set of polynomials of degree not greater than *m*, and
    *δ*[*i**j*] is the Kronecker delta.[²](#chapter1.xhtml_fn1_2) Functions *φ*[*i*](*x*)
    are called basis due to the fact that they form a basis in 𝒢[*m*] and any polynomial
    *p* ∈ 𝒢[*m*] can be represented through this basis (see 1.11). Particularly, if
    *u*[*h*] ≡ 1, then it follows from (1.11) that


    $$\begin{array}{l} {{\sum\limits_{i = 1}^{m + 1}{\varphi_{i}(x)}} = 1,\quad x
    \in \lbrack s_{0},s_{1}\rbrack.} \end{array}$$(1.12)


    It is worth noting that evaluating the basis functions *φ*[*i*](*x*) using expression
    (1.11) requires *O*(*m*²) operations which becomes computationally expensive for
    large values of *m*. For this reason, it is desired to rewrite (1.11) in another
    form of interpolation formula, which can be referred as the barycentric formula


    $$\begin{array}{l} {\varphi_{i}(x) = w(x)\frac{\beta_{i}}{x - x_{i}},\quad u_{h}(x)
    = w(x){\sum\limits_{i = 1}^{m + 1}{\frac{\beta_{i}}{x - x_{i}}u_{i}}},} \end{array}$$(1.13)


    where


    $$\begin{array}{l} {w(x) = {\prod\limits_{j = 1}^{m + 1}{(x - x_{j})}},\quad\beta_{i}
    = \left( {\prod\limits_{j = 1,j \neq i}^{m + 1}{(x_{i} - x_{j})}} \right)^{- 1},}
    \end{array}$$(1.14)


    and coefficients *β*[*i*] are called weights of barycentric formula. It follows
    from (1.12) that


    $$\begin{array}{l} {1 = {\sum\limits_{i = 1}^{m + 1}{\varphi_{i}(x)}} = w(x){\sum\limits_{i
    = 1}^{m + 1}\frac{\beta_{i}}{x - x_{i}}},} \end{array}$$


    and by using this fact, we come to the final form of the barycentric interpolation
    formula


    $$\begin{array}{l} {u_{h}(x) = \left( {\sum\limits_{i = 1}^{m + 1}\frac{\beta_{i}}{x
    - x_{i}}} \right)^{- 1}{\sum\limits_{i = 1}^{m + 1}{\frac{\beta_{i}}{x - x_{i}}u_{i}}},}
    \end{array}$$(1.15)


    and basis functions


    $$\begin{array}{l} {\varphi_{i}(x) = \left( {\sum\limits_{i = 1}^{m + 1}\frac{\beta_{i}}{x
    - x_{i}}} \right)^{- 1}\frac{\beta_{i}}{x - x_{i}}.} \end{array}$$(1.16)


    It is easy to see that calculations of *u*[*h*](*x*) using expression (1.15) for
    any given *x* require *O*(*m*) operations. Weights *β*[*i*] do not depend on *x*
    and ones precomputed can be reused for each evaluation of *u*[*h*](*x*).


    An important property of representations (1.15)–(1.16) is that they remain valid
    when weights *β*[*i*] are multiplied by an arbitrary constant value. The weights
    in the denominator are exactly the same as in the numerator, and this means that
    any common factor in all the weights may be cancelled. As such, weights *β*[*i*]
    can be defined up to constant factor.


    For particular case of nodes distribution, explicit formulas for barycentric weights
    can be given. For instance, in case of evenly spaced points *x*[*i* + 1] − *x*[*i*] = *h*/*m*,
    weights can be calculated through formula


    $$\begin{array}{l} {\beta_{i} = {( - 1)}^{i}\frac{m!}{(m - i + 1)!(i - 1)!},\quad
    i = 1,\ldots,m + 1.} \end{array}$$(1.17)


    To illustrate calculation of weights *β*[*i*], let us consider 4 nodes {*x*[1] = 0, *x*[2] = 1, *x*[3] = 2, *x*[4] = 3}.
    Using expression (1.14), we come to values {*β*[1] = −1/6, *β*[2] = 1/2, *β*[3] = −1/2, *β*[4] = 1/6},
    while formula (1.17) gives {*β*[1] = −1, *β*[2] = 3, *β*[3] = −3, *β*[4] = 1},
    which differ by factor 6; nevertheless, they can be equally used in (1.15)–(1.16).
    [Figure 1.2](#chapter1.xhtml_fig1_2) illustrates four basis functions created
    from the given four nodes and each basis is a polynomial of the third order. Note
    that using this basis allows to interpolate exactly any cubic polynomial (and
    polynomial of degree less than three), which is shown in [figure 1.3](#chapter1.xhtml_fig1_3).


    ![A graph with four lines illustrating Lagrange basis functions corresponding
    to four nodes on a finite element. Lines have sinusoidal shape so that to have
    unity value at the node with which they are associated and zeroth value at other
    nodes.](images/fig1_2.jpg)


    [Figure 1.2:](#chapter1.xhtml_b1fig1_2) Lagrange basis functions corresponding
    to nodes {*x*[1] = 0, *x*[2] = 1, *x*[3] = 2, *x*[4] = 3}.


    ![Two parts image of graphs showing source functions and its interpolation. Part
    (a) shows two graphs running through 4 points and they are indistinguishable.
    The source function and interpolation are all cubic function. Part (b) shows two
    graphs running through 4 points with hitting interpolation nodes, but the graphs
    are not coincided. Interpolation with 4 nodes gives cubic function but source
    function is of forth order.](images/fig1_3.jpg)


    [Figure 1.3:](#chapter1.xhtml_b1fig1_3) Examples of interpolations with four nodes
    corresponding to functions: (a) *u*(*x*) = 0.5(*x* − 1.5)³; (b) *u*(*x*) = 0.5(*x* − 1.5)⁴.
    Here, the dashed line is the source function and the solid line is the interpolation.
    Cubic function is interpolated exactly; however, the fourth-order polynomial is
    interpolated exactly only at nodes but not between nodes.


    Accuracy and some drawbacks of the global approximation are discussed in [Appendix
    B](#appB.xhtml_appB), where it is shown that the strategy of increasing polynomial
    order to interpolate function having large number of interpolation nodes is not
    always a good approach. Below, we consider alternative approach representing piecewise
    polynomial interpolation.


    ### 1.3.2 Piecewise Polynomial Interpolation and the Finite Element Approximation


    Now, we turn our attention to the piecewise interpolation, which is effectively
    a number of localized interpolation stitched together. Let us consider a set of
    *n* + 1 nodes defined on the interval [*s*[0], *s*[1]]


    $$\begin{array}{l} {s_{0} = x_{1} < x_{2} < \cdots < x_{n + 1} = s_{1},} \end{array}$$


    and subintervals *e*[*i*] = [*x*[*i*], *x*[*i* + 1]], *i* = 1, …, *n*. Then, a
    set of *m* + 1 different nodes are specified on each *e*[*i*] so that


    $$\begin{array}{l} {x_{i} = x_{i}^{(1)} < x_{i}^{(2)} < \cdots < x_{i}^{(m + 1)}
    = x_{i + 1},} \end{array}$$


    and the total number of nodes can be easily calculated to be *N* = *n**m* + 1.
    Given a function *u*(*x*) ∈ *C*[*s*[0], *s*[1]], its approximation *u*[*h*](*x*) ∈ *C*[*s*[0], *s*[1]]
    can be defined as follows:


    $$\begin{array}{ll} & {u_{h}(x) \in \mathcal{G}_{m},\quad x \in e_{i},\quad i
    = 1,\ldots,n,} \\ & {u_{h}(x_{j}) = u(x_{j}),\quad j = 1,\ldots,N,} \end{array}$$'
  toc: []
