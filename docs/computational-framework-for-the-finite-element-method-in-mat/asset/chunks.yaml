    \ + auv)dx - (cu'v)|_{s_{0}}^{s_{1}} = \\int\\limits_{s_{0}}^{s_{1}}fv.} \\end{array}$$(1.7)\n\
    \n通过检查 (1.7) 中的第二项并考虑到边界条件 (1.2)，我们看到：\n\n$$\\begin{array}{ll} {(cu'v)|_{s_{0}}^{s_{1}}\
    \ = c(s_{1})u'(s_{1})v(s_{1}) - c(s_{0})u'(s_{0})v(s_{0})} \\\\ {\\quad = \\mu\
    \ v(s_{1}) - \\sigma u(s_{1}) - ....} \\end{array}$$(1.8)\n\n如果函数 `v(x*)` 的定义使得\
