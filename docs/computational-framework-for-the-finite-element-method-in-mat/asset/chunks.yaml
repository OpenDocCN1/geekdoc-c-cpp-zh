    extracts a column. Note that slices of arrays do not copy the internal array data
    but only produce new views of the original data, so if b=A[0,3] and b=b+1 then
    element of matrix A would be modified implicitly as well. If a copy is needed,
    then an explicit copy() command is required. NumPy arrays may be indexed with
    other arrays or lists. For all cases of index arrays, the copy of original data
    is returned, not a view. For example A[np.array([0,2,4]),0] or A[np.array([0,2,4])][0]
    returns elements of the first column with indices 0, 2 and 4.


    To operate with sparse matrices in Python we use scipy.sparse library. There are
    various sparse matrix classes in scipy.sparse library (coo_matrix, csc_matrix,
    csr_matrix, etc.) to perform matrix manipulations of different types. For example,
    class coo_matrix is used for constructing a sparse matrix in coordinate format
    from arrays of indices and values (see [figure 2.1](#chapter2.xhtml_fig2_1) for
    detailed explanations) but it does not directly support arithmetic operations.
    Class sparse.lil_matrix is a structure for constructing sparse matrices incrementally
    which supports flexible slicing. Classes csr_matrix and csc_matrix are for compressed
    sparse row matrix and compressed sparse column matrix representations, respectively.
    These matrix formats are suitable for arithmetic operations and row/column slicing
    but inefficient for changing sparsity structure. Usually, coo_matrix is a fast
    format for constructing sparse matrices. Once a matrix has been constructed, conversion
    to csc_matrix or csr_matrix format is performed (explicitly or implicitly) for
