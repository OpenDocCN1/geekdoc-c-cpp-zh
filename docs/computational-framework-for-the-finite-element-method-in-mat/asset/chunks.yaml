    C 为这些规则提供了某些理论背景，其中给出了基本的解释和示例。此外，附录 D](#appD.xhtml_appD) 给出了使用正交多项式计算权重和节点的理论。下面，我们使用了不带详细解释的表达式，这些表达式可以在给定的附录中找到。


    首先，我们考虑在区间 $[-1, 1]$ 上的高斯积分，这是最常见且研究最充分的积分区域。通过变换 $\hat{x} = 1/2 + \tilde{x}/2$，$\tilde{x}
    \in [-1, 1]$，可以从区间 $[-1, 1]$ 上的积分得到区间 $[0,1]$ 上的积分：


    $$\begin{matrix} {\int\limits_{0}^{1}\hat{f}d\hat{x} = \frac{1}{2}\int\limits_{-
    1}^{1}\widetilde{f}d\widetilde{x} \approx \frac{1}{2}{\sum\limits_{k = 1}^{q}{{\widetilde{\gamma}}_{k}\widetilde{f}({\widetilde{d}}_{k})}}
    = {\sum\limits_{i = 1}^{q}{{\hat{\gamma}}_{k}\hat{f}({\hat{d}}_{k})}}, \\ {{\hat{\gamma}}_{k}
    = \frac{1}{2}{\widetilde{\gamma}}_{k}}} \end{matrix}$$


    选择特定的数值 $q$、节点值 $\hat{d}[k]$ 和权重 $\hat{\gamma}[k]$ 得到不同的积分规则。下面，我们利用两种类型的积分，即高斯积分和洛巴托积分规则。附录
    C 为这些规则提供了某些理论背景，其中给出了基本的解释和示例。此外，附录 D](#appD.xhtml_appD) 给出了使用正交多项式计算权重和节点的理论。下面，我们使用了不带详细解释的表达式，这些表达式可以在给定的附录中找到。


    首先，我们考虑在区间 $[-1, 1]$ 上的高斯积分，这是最常见且研究最充分的积分区域。通过变换 $\hat{x} = 1/2 + \tilde{x}/2$，$\tilde{x}
    \in [-1, 1]$，可以从区间 $[-1, 1]$ 上的积分得到区间 $[0,1]$ 上的积分：


    $$\begin{matrix} {\int\limits_{0}^{1}\hat{f}d\hat{x} = \frac{1}{2}\int\limits_{-
    1}^{1}\widetilde{f}d\widetilde{x} \approx \frac{1}{2}{\sum\limits_{k = 1}^{q}{{\widetilde{\gamma}}_{k}\widetilde{f}({\widetilde{d}}_{k})}}
    = {\sum\limits_{i = 1}^{q}{{\hat{\gamma}}_{k}\hat{f}({\hat{d}}_{k})}}, \\ {{\hat{\gamma}}_{k}
    = \frac{1}{2}{\widetilde{\gamma}}_{k}}} \end{matrix}$$


    值得注意的是，高斯积分在区间 $[-1, 1]$ 上的精度为 $2q-1$。其节点是勒让德多项式的根。通常情况下，可以通过以下特征值分解计算节点和权重：


    $$\begin{array}{l} {Q = \left(\begin{array}{llll} 0 & \beta_{1} & & \\ & & & \\
    \beta_{1} & 0 & \beta_{2} & \\ & & & \\ \ddots & \ddots & \ddots & \\ & \beta_{q
    - 2} & 0 & \beta_{q - 1} \\ & & \beta_{q - 1} & 0 \end{array}\right),\quad\begin{array}{l}
    {\beta_{j} = \frac{j(j + 2)}{(2j + 1)(2j + 3)}}, \\ {\quad j = 1,\ldots,q - 1}}
    \end{array}} \end{array}$$


    如果 $Q = U\Lambda U$，其中 $\Lambda$ 是对角矩阵，$U$ 是特征向量矩阵，那么高斯积分的节点 $\tilde{d}[k]$ 和权重
    $\tilde{\gamma}[k]$ 即可得到。关于高斯积分的一个重要点是，它并不保证包含端点。为了让积分区间包含端点，可以使用洛巴托积分，其节点 $\tilde{d}
    = \{-1, 1\}$ 权重为：


    $$\begin{array}{l} {\mathbf{\widetilde{\gamma}} = \left\{ {\frac{2}{q^{2} - q},\frac{4U_{1i}^{2}}{3(1
    - \lambda_{i})},\frac{2}{q^{2} - q}} \right\},\, i = 1,\ldots,q - 2\}} \end{array}$$


    洛巴托积分的精度为 $2q-3$，其节点是 $(1-x²)L_{q-1}(x)$ 的根。


