    We conclude that uniform distribution of nodes could potentially lead to approximation
    divergence. To understand why the node distribution is of importance, let us consider
    the approximation error, *Δ*(*P*[*m*]), which can be estimated as


    $$\begin{array}{l} \left. \Delta(P_{m}) \leq \frac{\left| f^{(m + 1)}(\xi) \right|}{(m
    + 1)!}\max\limits_{\lbrack s_{0},s_{1}\rbrack} \middle| \omega_{m + 1}(x) \middle|
    , \right. \end{array}$$


    where


    $$\begin{array}{l} {\omega_{m + 1}(x) = (x - x_{1})(x - x_{2})\cdots(x - x_{m
