    ## Error of input data and approximation accuracy


    Another source of polynomial approximation error arises from the fact that the
    function values at the interpolation nodes, `f[i]` = `f(x[i])`, are specified
    or calculated with some errors, `ϵ[i]`, that is `f[i]*` = `f[i]` + `ϵ[i]`. As
    a result, polynomial `P[m]*` (x) constructed from the nodes `f[i]*` inevitably
    contains errors as well


    $$\begin{array}{l} {P_{m}(x) - P_{m}^{*}(x) = {\sum\limits_{j = 1}^{m + 1}\epsilon_{j}}\varphi_{j}(x),}
    \end{array}$$


    where `φ[j](x)` is a Lagrange basis function. If `ϵ*` = `max{ϵ[i]}`, then the
    following estimation takes place


    $$\begin{array}{l} \left. \max\limits_{\lbrack s_{0},s_{1}\rbrack} \middle| P_{m}(x)
    - P_{m}^{*}(x) \middle| \leq \Lambda_{m}\epsilon^{*},\quad\Lambda_{m} = \max\limits_{\lbrack
    s_{0},s_{1}\rbrack}\left. \sum\limits_{j = 1}^{m + 1} \right|\varphi_{j}(x) \middle|
    . \right. \end{array}$$

