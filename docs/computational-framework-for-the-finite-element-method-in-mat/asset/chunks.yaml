    Let us specify a connectivity matrix, *t* ∼ (*m*[*τ*] × *n*[*t*]), and place into
    *l*^(*t**h*) column the indices of the points of the *l*^(*t**h*) element (*i*[1], *i*[2], …, *i*[*m*[*τ*]])
    so that *t*[*j**l*] defines index of the *j*^(*t**h*) point (in local order) belonging
    to the element *τ*[*l*].


    **Calculation of *A* and **F****. Represent the integral over triangulation 𝒯[*h*]
    through the sum of integrals over elements *τ*[*l*]. Using the matrix of indices,
