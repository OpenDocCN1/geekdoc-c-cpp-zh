    $$\begin{array}{l} {{\overline{M}}_{\alpha}^{k} = {\int\limits_{e_{k}}{\mu(\mathbf{\mathbf{x}})\varphi_{e_{\alpha
    k}}(\mathbf{\mathbf{x}})d\mathbf{\mathbf{x}}}},} \end{array}$$


    并对所有边的扩展向量 `M^(k)` 进行求和：


    $$\begin{array}{l} {\mathbf{\mathbf{M}} = {\sum\limits_{k = 1}^{n_{e}}\mathbf{\mathbf{M}}^{k}}.}
