    sink, −(*c*(*x*)*u*^′(*x*))^′) + *u*(*x*) = 0, where *u*(*x*) is a temperature
    and *c*(*x*) is a thermal conductivity. This equation is a special case of more
    generic one (1.1).


    Note that an ODE allows multiple solutions and addition conditions are needed
    to obtain unique solution. To find a unique solution to equation (1.1), two boundary
    conditions are needed (second-order equation needs two extra conditions to be
    uniquely resolved). If both boundary conditions are specified at a single point
    (either *s*[0] or *s*[1]), then this problem is called *Cauchy problem*. Problem
    (1.1) with boundary conditions specified at both, *s*[0] and *s*[1], boundary
    points is called *boundary value problem* (BVP). Cauchy problem and BVP have distinct
    properties and solution methods. This book is focussed on BVP only.


    Let us consider various types of conditions, which can be specified at a boundary
    point *s* (here, *s* could be any of {*s*[0], *s*[1]}). For example, solution
    is known at point *s* with *u*(*s*) = *u*[*s*], which gives us Dirichlet (or first-type)
