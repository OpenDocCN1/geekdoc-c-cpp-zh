    ### 1.5.3 Calculating Elements of the Local Matrices


    We start with a simpler case of calculating elements of the local forcing vector
    defined by the integral (1.78) for the `l^{(th)}` finite element. By inspecting
    expression (1.78) we observe that the integrand depends on the local basis functions
    `phi[n[l] + \alpha]` having form of Lagrange polynomial


    $$\begin{array}{l} {\varphi_{n_{l} + \alpha}(x) = {\prod\limits_{j = 1,j \neq
    \alpha}^{m + 1}\frac{x - x_{n_{l} + j}}{x_{n_{l} + \alpha} - x_{n_{l} + j}}},\quad
    x \in \lbrack x_{n_{l} + 1},x_{n_{l} + m + 1}\rbrack,} \end{array}$$(1.80)


    which depends on global index `n[l]`. We are aimed to transform expression (1.80)
    to the one which is independent on global index so to obtain invariant basis across
    all elements. To achieve this, let us introduce local variable, `\hat{x}`, and
    transformation as follows:


    $$\begin{array}{ll} {\hat{x} = \frac{x - x_{n_{l} + 1}}{h_{l}},\quad x = x_{n_{l}
    + 1} + \hat{x}h_{l},} \\ {dx = h_{l}d\hat{x},\quad h_{l} = x_{n_{l} + m + 1} -
    x_{n_{l} + 1}.} \end{array}$$(1.81)


    It can be seen the expression (1.81) specifies linear transformation so that `n[l]
    + j \to \hat{x}[j]`, or


    $$\begin{array}{l} \left. x_{n_{l} + 1},\ldots,x_{n_{l} + m + 1}\rightarrow 0
    = \hat{x}_{1},\ldots,\hat{x}_{m + 1} = 1, \end{array}$$


    and `e[l] = [0, 1]` for `n[l] + m + 1`. As a result, any finite element is transformed
    into canonical, or basis, element of unity length. Moreover, substitution (1.81)
    into (1.80) gives


    $$\begin{array}{l} {\varphi_{n_{l} + \alpha}(x) = \varphi_{n_{l} + \alpha}(x_{n_{l}
    + 1} + \hat{x}h_{l}) = {\prod\limits_{j = 1,j \neq \alpha}^{m + 1}\frac{\hat{x}
    - \hat{x}_{j}}{\hat{x}_{\alpha} - \hat{x}_{j}}} = {\hat{\varphi}}_{\alpha}(\hat{x}),}
    \end{array}$$(1.82)


    where basis functions `\hat{\phi}[\alpha]` are now expressed in terms of local
    variable `\hat{x}`. If we denote `\hat{f} = f(n[l] + 1 + \hat{x}h[l])`, then integral
    (1.78) can be rewritten as


    $$\begin{array}{l} {\overline{F}}_{\alpha}^{l} = h_{l}\int\limits_{0}^{1}\hat{f}\hat{\varphi}_{\alpha}d\hat{x},\quad\alpha
    = 1,\ldots,m + 1.} \end{array}$$(1.83)


    Integral (1.83) can be evaluated exactly in limited number of cases (linear `\hat{\phi}[\alpha]`
    or `\hat{f} = constant`), and, generally speaking, we have to apply a numerical
    approximation to calculate (1.83). We utilize a quadrature rule which gives


    $$\begin{array}{l} {\overline{F}}_{\alpha}^{l} = h_{l}\sum\limits_{k = 1}^{q}\hat{\gamma}_{k}\hat{f}(\hat{d}_{k})\hat{\varphi}_{\alpha}(\hat{d}_{k}},\quad
    0 \leq \hat{d}_{k} \leq 1,\quad\alpha = 1,\ldots,m + 1.} \end{array}$$(1.84)


    where `q` is a number of quadrature nodes, `\hat{\gamma}[k]` and `\hat{d}[k]`
    are quadrature weights and nodes, respectively. Currently, we do not look at construction
    of a particular rule leaving this task for the next section. The main result is
    that we have defined a numerical method allowing calculation of the local forcing
    vector through formula (1.84).


    In a similar way, computation of the local stiffness matrix can be reduced to
    numerical calculations through the approximate quadrature rule. By using transformation
    (1.81) and introducing functions `\hat{a}`, `\hat{b}` and `\hat{c}`, integral
    (1.75) reduces to


    $$\begin{array}{l} {{\overline{A}}_{\alpha\beta}^{l} = \int\limits_{0}^{1}(h_{l}^{-
    1}\hat{c}\hat{\varphi}_{\alpha}''\hat{\varphi}_{\beta}'' + \hat{b}\hat{\varphi}_{\alpha}\hat{\varphi}_{\beta}''
    + h_{l}\hat{a}\hat{\varphi}_{\alpha}\hat{\varphi}_{\beta})d\hat{x},\quad\alpha,\beta
    = 1,\ldots,m + 1.} \end{array}$$


    Here, we use the fact that `phi(x)'' = \hat{\phi}(\hat{x})''/h[l]`. Thereby,


    $$\begin{array}{cl} {{\overline{A}}_{\alpha\beta}^{l} \approx {\sum\limits_{k
    = 1}^{q}\hat{\gamma}_{k}}(h_{l}^{- 1}\hat{c}\hat{\varphi}_{\alpha}''\hat{\varphi}_{\beta}''
    + \hat{b}\hat{\varphi}_{\alpha}\hat{\varphi}_{\beta}'' + h_{l}\hat{a}\hat{\varphi}_{\alpha}\hat{\varphi}_{\beta})}
    & {((\hat{d}_{k}),} \\ {\alpha,\beta =} & {1,\ldots,m + 1.} \end{array}$$(1.85)


    Expressions (1.84) and (1.85) define approximate numerical calculations of the
    local matrices. Intuitively, it is clear that the higher precision of quadrature
    approximation, the higher accuracy of the FEM. Below, we imply that integral calculations
    are performed approximately and the symbol `≈` is substituted by `=` to avoid
    complicated notations.


    Let us rewrite expressions (1.84) and (1.85) in matrix forms. To achieve this,
    we introduce complementary matrices `\hat{E}[k\alpha] = \hat{\phi}[\alpha](\hat{d}[k])`
    and `\hat{D}[k\alpha] = \hat{\phi}[\alpha]''(\hat{d}[k])` having dimension `q
    \times (m+1)`. With the help of these matrices, formula (1.84) for the local forcing
    vector takes the matrix form


    $$\begin{array}{l} {\mathbf{\overline{F}}^{l} = {\hat{E}}^{T}\mathbf{\hat{F}}^{l},\quad\mathbf{\hat{F}}^{l}
    = h_{l}\left( {{\hat{\gamma}}_{1}\hat{f}(\hat{d}_{1}),\ldots,{\hat{\gamma}}_{q}\hat{f}(\hat{d}_{q})}
    \right)^{T.} \end{array}$$(1.86)


    One interesting observation following from (1.86) is that in case of `h[l] = constant`
    for all `l`, and when distribution of quadrature nodes, `\hat{d}[k]` remains the
    same across all finite elements, then the local forcing vector is calculated only
    once (all local vectors are equal to each other).


    Now, it is easy to represent calculations of the local stiffness matrix (1.85)
    in the form of matrix expression


    $$\begin{array}{l} {{\overline{A}}^{l} = {\hat{D}}^{T}{\hat{C}}^{l}\hat{D} + {\hat{E}}^{T}{\hat{B}}^{l}\hat{D}
    + {\hat{E}}^{T}{\hat{A}}^{l}\hat{E},}} \end{array}$$

