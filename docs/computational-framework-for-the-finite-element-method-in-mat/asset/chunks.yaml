    # 第 6 章 非线性基函数


    DOI: [10.1201/9781003265979-6](https://doi.org/10.1201/9781003265979-6)


    在这里我们考虑 `𝒢[2]` 网格，并获得用于直边和曲边三角形单元的基函数的计算表达式。这里给出了如何推导刚度矩阵单元表达式的分析。我们提供了数学公式和表达式，但没有给出
    MATLAB 实现代码。基于本的内容，可以很容易地组合函数。基本上，我们概述了将现有的 `𝒢[1]` 网格有限元方法（FEM）框架扩展到 `𝒢[2]` 网格
    FEM 的技术。


    ## 6.1 线性三角形单元的二次基函数


    获取直边 `𝒢[2]` 三角形基函数的方法与 `𝒢[1]` 网格类似，区别在于插值节点的数量。


    让我们考虑坐标系 $\hat{\mathbf{\mathbf{x}}} = ({\hat{x}}_{1},{\hat{x}}_{2})$ 中的一个标准三角形单元
    `τ̂`，它具有六个插值节点 $\hat{\mathbf{\mathbf{p}}_{i}},\, i = 1,\ldots,6$（此处 $\hat{\mathbf{\mathbf{p}}_{4}},\hat{\mathbf{\mathbf{p}}_{5}}$
    和 $\hat{\mathbf{\mathbf{p}}_{6}}$ 是中点）。那么 `𝒢[2]` 是单元 `τ̂` 上所有的二次多项式（参见图 6.1](#chapter6.xhtml_fig6_1)
    中的原始三角形单元和相应的基单元）。


    ![图像显示了两个与图 5.2 相同的三角形，但每个三角形边都多了一个中点。](img/fig6_1.jpg)


    图 6.1: 标准单元 `τ̂` 和原始的 `𝒢[2]` 网格单元 `τ`。


    如果 `x̂[3]` = 1 − `x̂[1]` − `x̂[2]`，则 ${\hat{\mathcal{G}}}_{2}$ 中的基由以下函数定义：


    $$\begin{array}{ll} {\hat{\varphi}}_{1} & {= {\hat{x}}_{3}(2{\hat{x}}_{3} - 1),\quad{\hat{\varphi}}_{2}
    = {\hat{x}}_{1}(2{\hat{x}}_{1} - 1),\quad{\hat{\varphi}}_{3} = {\hat{x}}_{2}\left(
    {2{\hat{x}}_{2} - \frac{1}{2}} \right), \\ {\hat{\varphi}}_{4} & {= 4{\hat{x}}_{1}{\hat{x}}_{3},\quad{\hat{\varphi}}_{5}
    = 4{\hat{x}}_{1}{\hat{x}}_{2},\quad{\hat{\varphi}}_{6} = 4{\hat{x}}_{2}{\hat{x}}_{3},}
    \end{array}$$(6.1)


    对于任意函数 $\hat{z} \in {\hat{\mathcal{G}}}_{2}$，下式成立：


    $$\begin{array}{l} {\hat{z}(\hat{\mathbf{\mathbf{x}}}) = {\sum\limits_{i = 1}^{6}{\hat{z}(\hat{\mathbf{\mathbf{p}}_{i}}){\hat{\varphi}}_{i}(\hat{\mathbf{\mathbf{x}}}},\quad\hat{\mathbf{\mathbf{x}}}
    \in \hat{\tau}.} \end{array}$$


    坐标变换 `τ̂` → `τ` 定义为（参见 (5.4) – (5.6)）：


    $$\begin{array}{l} {\mathbf{\mathbf{x}} = B_{\tau}\hat{\mathbf{\mathbf{x}}} +
    \mathbf{\mathbf{p}}_{1},} \end{array}$$$(6.2)


    此外，点 $\hat{\mathbf{\mathbf{p}}_{i}}$ 转换为点 `p[i]`，`i` = 1, …, 6。逆变换定义为 $\hat{\mathbf{\mathbf{x}}}
    = B_{\tau}^{- 1}(\mathbf{\mathbf{x}} - \mathbf{\mathbf{p}}_{1})$，且函数 `φi` = `φ̂i(**x** − **p**[1]))`
    代表 `𝒢[2]` 中的基。结果是，$\hat{z}(\hat{\mathbf{\mathbf{x}}})$ 转换为 `z(**x**)`，使得：


    $$\begin{array}{l} {z(\mathbf{\mathbf{x}}) = {\sum\limits_{i = 1}^{6}{z(\mathbf{\mathbf{p}}_{i})\varphi_{i}(\mathbf{\mathbf{x}})}},\quad\mathbf{\mathbf{x}}
    \in \tau.} \end{array}$$(6.3)


    这里注意的是，与 `𝒢[1]` 网格不同，`𝒢[2]` 网格的基函数是非线性函数，即二次函数。这一事实使得情况变得稍微复杂。


    ## 6.2 曲边三角形单元的二次基函数


    通常使用曲边单元进行近似。图 6.2](#chapter6.xhtml_fig6_2) 显示了 `𝒢[2]` 网格 `τ`。点 $\hat{\mathbf{\mathbf{p}}_{i}}$
    转换为点 `p[i]`，`i` = 1, …, 6。


