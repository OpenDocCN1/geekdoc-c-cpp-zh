    u\|_{H^{k}},\quad\| u\|_{H^{k}}^{2} = \int\limits_{s_{0}}^{s_{1}}\left( {u^{2}
    + \left| \frac{d^{k}u}{dx^{k}} \right|^{2}} \right)dx.} \end{array}$$


    Here *C* is a constant, *u* is the exact solution, 2 ≤ *k* ≤ min {*m* + 1, *r*}
    where number *r* is defined from the criteria ∥*u*∥[*H*^(*r*)] < ∞. In connection
    to this, two cases are of interest to us, namely, (a) solution is not sufficiently
    smooth function, and *r* < (*m* + 1); (b) solution is quite smooth function, and
    *r* ≫ (*m* + 1). By choosing highest value for *k*, we obtain estimations


    $$\begin{array}{l} {\text{(a)}\,\| u - u_{h}\|_{H^{1}} = O\left( \frac{h^{r -
    1}}{m^{r - 1}} \right),\quad\text{(b)}\,\| u - u_{h}\|_{H^{1}} = O\left( \frac{h^{m}}{m^{m}}
    \right).} \end{array}$$


    We can see that parameter *m* affects the solution accuracy differently. To clarify
    this, let us consider a simplified example when all elements are of the same length,
    *h* = (*s*[1] − *s*[0])/*n*. In this case, *h* = *O*(*n*^(−1)) and we come to
    the estimations


    $$\begin{array}{l} {\text{(a)}\,\| u - u_{h}\|_{H^{1}} = O\left( \frac{1}{{(nm)}^{r
    - 1}} \right),\quad\text{~(b)}\,\| u - u_{h}\|_{H^{1}} = O\left( \frac{1}{{(nm)}^{m}}
    \right).} \end{array}$$(1.88)


    Consequently, case (a) corresponds to the power growth of accuracy with respect
    to both parameters, *n* and *m*, unlike the case (b) where only increase of *n*
    leads to power growth of accuracy while increasing *m* results in exponential
    growth.


    Thereby, it could be recommended three strategies of how to choose parameters
    *m* and *n*:


    1.  Having chosen small *m* (practically, 1 ≤ *m* ≤ 5), the desired accuracy is
    reached by increasing *n* (decreasing *h*).


    2.  Having chosen small *n* (it is allowed to take *n* = 1 which corresponds to
    the single finite element), the desired accuracy is reached by increasing *m*
    (practically, *m* = 5, …, 50, …).


    3.  Polynomial degree, *m*, is not fixed for all elements and can vary. This strategy
    is useful when solution behaves differently on the interval [*s*[0], *s*[1]].
    If there is a region with rapidly increasing derivative of the solution, then
    within this region the value of *m* is chosen to be fixed and small, but elements
    are refined (*n* increases). The value of *n* in the rest of interval is fixed
    but the polynomial degree increases.


    It is worth noting that the Euclidean condition number of the stiffness matrix,
    *A*, is of order *O*(*h*^(−2)), so refining finite elements is sensible to some
    extent. Extremely small elements leads to solving ill-conditioned linear system.


    In addition, following circumstance has to be taken into account when choosing
    elements distribution. In practise, differential equation coefficients could be
    functions having singularities (discontinuities of a function or its derivative)
    at particular points. In this case, it is advisable to take these points to be
    boundary nodes of finite elements, that is *x*[*n*[*l*]]. As a result, all functions
    would be smooth within each finite element and this suffices to obtain desired
    accuracy of the FEM; otherwise, accuracy decreases significantly.


    **Accuracy of the solution and distribution of points within finite elements**.
    Vector of points within a basis element (0 = *x̂*[1], …, *x̂*[*m* + 1] = 1) defines
    distribution of nodes for each finite element. Theoretically (in the exact computer
    arithmetic), solution *u*[*h*] does not depend on the way of choosing distribution
    of these points. Practically (in floating point computation), this distribution
    plays an important role, particularly, it affects conditional number of the stiffness
    matrix. When the value of *m* is small (*m* < 7), nodes *x̂*[*i*] can be evenly
    spaced with a constant step. However, when the value of *m* is relatively large,
    it is recommended to choose nodes *x̂*[*i*] so that they are roots of some orthogonal
    polynomial of the order *m* + 1. For instance, a good choice would be Chebyshev
    polynomials or Legendre polynomials.


    **Quadrature rule and choice of quadrature nodes distribution**. Theory states
    (and results of FEM practical calculation confirm) that the following conditions
    should be satisfied for a quadrature rule:


    *   quadrature weights are positive, *γ* > 0,


    *   number of nodes *q* ≥ *m*,


    *   a quadrature has to be exact for polynomials of degree 2*m* − 1 and higher[⁷](#chapter1.xhtml_fn1_7)


    Practically, there are two quadrature rules meeting these criteria, namely, Gaussian
    quadrature having number of nodes *q* ≥ *m*, and Lobatto quadrature with *q* ≥ (*m* + 1).
    There is a possibility to obtain quadrature nodes, *d̂*[*i*], which coincide with
    interpolation nodes on the basis elements, *x̂*[*i*], and *q* = *m* + 1. In this
    case, Lobatto quadrature rule is used for numerical integration since the nodes
    of this rule include endpoints of the basis element and, in addition, the nodes
    are roots of orthogonal Legendre polynomial which, in turn, can be taken as nodes
    of interpolating polynomials on the basis element.


    # Chapter 2 Programming One-Dimensional Finite Element Method for the Linear Boundary
    Value Problem


    DOI: [10.1201/9781003265979-2](https://doi.org/10.1201/9781003265979-2)


    IN this chapter, we are going to compose MATLAB^® codes for finding numerical
    solution to the BVP using FEM described in the previous chapter. In addition,
    algorithm implementation for calculating solution first derivative and solution
    error will be considered.


    Before we start coding FEM algorithm, let us outline the strategy of how it is
    going to be done. Programming implementation will have a form of library with
    set of functions with code for particular numerical method or piece of algorithm.
    We are aimed to group steps of the FEM algorithms into functions according to
    their logic. For example, from generic high-level FEM [algorithm 1](#chapter2.xhtml_comp02_1)
    follows that it is convenient to have at least four stand-alone functions for
    each step of the algorithm, and probably some complementary helper functions as
    well. The approach we consider below is bottom to top which is opposed to top
    to bottom consideration in [chapter 1](#chapter1.xhtml). We will start with programming
    quadrature rules and splitting interval into finite elements; then we will look
    into coding assembling stiffness matrices and BC. As a last step, the high-level
    main function will be considered which implements logic of [algorithm 1](#chapter2.xhtml_comp02_1).'
