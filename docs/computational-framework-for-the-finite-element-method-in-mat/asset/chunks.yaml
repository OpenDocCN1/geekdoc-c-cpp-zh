    通过引入扩展矩阵 `S^(k)`（参见类似的扩展矩阵 `A^(l)`），我们得到：


    $$\begin{array}{l} {S = {\sum\limits_{k = 1}^{n_{e}}S^{k}}.} \end{array}$$


