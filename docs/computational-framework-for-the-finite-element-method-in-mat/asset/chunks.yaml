    \ were an exact solution over the whole interval (*s*[0], *s*[1]), equation (1.1)\
    \ would be exact everywhere. But, given that in real engineering problems this\
    \ will not be the case, we try to obtain an approximate solution *u*(*x*) for\
    \ which it meets the BVP equation in a spatially averaged sense (1.5). In other\
    \ words, the residual or error (i.e., the amount by which the differential equation\
    \ is not satisfied exactly at a point) is distributed evenly over the interval.\n\
    \nLet us rewrite expression (1.5) in the form with integrals over individual terms\n\
    \n$$\\begin{array}{ll} {- \\int\\limits_{s_{0}}^{s_{1}}\\left( {c(x)u'(x)} \\\
    right)'v(x)dx} & {+ \\int\\limits_{s_{0}}^{s_{1}}b(x)u'(x)v(x)dx} \\\\ + & {\\\
    int\\limits_{s_{0}}^{s_{1}}a(x)u(x)v(x)dx = \\int\\limits_{s_{0}}^{s_{1}}f(x)v(x)dx.}\
    \ \\end{array}$$(1.6)\n\nBy applying integration by parts[¹](#chapter1.xhtml_fn1_1)\
    \ to the first integral in (1.2) we come to\n\n$$\\begin{array}{l} {\\int\\limits_{s_{0}}^{s_{1}}(cu'v'\
    \ + bu'v + auv)dx - (cu'v)|_{s_{0}}^{s_{1}} = \\int\\limits_{s_{0}}^{s_{1}}fvdx.}\
    \ \\end{array}$$(1.7)\n\nBy inspecting second term in (1.7) and taking into account\
    \ BC (1.2), we see that\n\n$$\\begin{array}{ll} {(cu'v)|_{s_{0}}^{s_{1}} = c(s_{1})}\
    \ & {u{(s_{1})}'v(s_{1}) - c(s_{0})u{(s_{0})}'v(s_{0})} \\\\ & {\\quad = \\mu\
    \ v(s_{1}) - \\sigma u(s_{1})v(s_{1}) - c(s_{0})u{(s_{0})}'v(s_{0}).} \\end{array}$$(1.8)\n\
    \nIf function *v*(*x*) is defined so that *v*(*s*[0]) = 0, then it follows from\
    \ (1.7) and (1.8) that\n\n$$\\begin{array}{l} {\\int\\limits_{s_{0}}^{s_{1}}\\\
    left( {cu'v' + bu'v + auv} \\right)dx + \\sigma u(s_{1})v(s_{1}) = \\int\\limits_{s_{0}}^{s_{1}}fvdx\
    \ + \\mu v(s_{1}).} \\end{array}$$(1.9)\n\nExpression (1.9) is an integral equation,\
    \ and it can be seen that if *u*(*x*) is a solution to BVP (1.1)–(1.2), then it\
    \ satisfies (1.9). Inverse would be valid if we complement integral equation (1.9)\
    \ by the condition *u*(*s*[0]) = *u*[*s*[0]]. As a result, equation (1.1) and\
    \ BC (1.2) are now transformed into one expression (1.9) where *u*(*s*[0]) = *u*[*s*[0]]\
    \ and *v*(*s*[0]) = 0. It is worth noting here that original BVP suggests that\
    \ the solution *u* should have derivatives up to second order. On the other hand,\
    \ the integral form (1.9) refers only to the first derivatives of *u*(*x*), which\
    \ implies weaker conditions on property of solution function. Moreover, due to\
    \ property of Sobolev space, *L*[2] projection *u*(*x*) does not require the function\
    \ we seek to have continuous derivatives. As such, we relax some conditions on\
    \ solution of BVP by saying that the function *u*(*x*) is now integrable continuous\
    \ function having piecewise continuous derivatives of the first order (in other\
    \ words, it belongs to Sobolev space). For this reason, (1.9) is called a *weak\
    \ form* of the original BVP. The integral weak form of (1.1)–(1.2) can now be\
    \ defined in terms of the Sobolev space by introducing two subspaces\n\n$$\\begin{array}{ll}\
    \ \\mathcal{W} & {: = \\left\\{ w \\in H^{1}(s_{0},s_{1}):w(s_{0}) = u_{s_{0}}\
    \ \\right\\},} \\\\ \\mathcal{W}^{0} & {: = \\left\\{ w \\in H^{1}(s_{0},s_{1}):w(s_{0})\
    \ = 0 \\right\\},} \\end{array}$$\n\nas follows.\n\nObtaining expression (1.9)\
    \ is the first step in the FEM formulation for the BVP. Next step is to represent\
    \ solution through polynomial approximation. Since we consider *u*(*x*) to be\
    \ piecewise smooth, piecewise polynomial interpolation is used to approximate\
    \ *u*(*x*). Generally speaking, FEM can be expressed as following: *FEM=integral\
    \ equation+piecewise polynomial interpolation*. In the next section we explore\
    \ polynomial interpolation methods.\n\n## EXERCISE\n\n*   ▶ Prove that (1.1)–(1.2)\
    \ follow from (1.9). Instruction: take any point *x*[0] ∈ (*s*[0], *s*[1]); consider\
    \ an interval [*x*[0] − *h*, *x*[0] + *h*] ⊂ (*s*[0], *s*[1]) and use the expression\
    \ (1.7) defined on this interval with *v* ∈ *C*¹[*s*[0], *s*[1]] and *v*(*x*) = 0\
    \ for *x* ∉ [*x*[0] − *h*, *x*[0] + *h*]; perform passage to the limit *h* → 0\
    \ and obtain (1.1).\n\n*   ▶ Deduce integral equation and define sets \U0001D4B2\
    \ and \U0001D4B2⁰ for the problem (1.1) with following BC:\n\n    *   (a) BC of\
    \ the third order is specified at the point *s*[0] and BC of the first order at\
    \ the point *s*[1].\n\n    *   (b) BC of the third order is specified at both\
    \ points, *s*[0] and *s*[1].\n\n## 1.3 LAGRANGE INTERPOLATING POLYNOMIALS AND\
    \ THE FINITE ELEMENT APPROXIMATION"
