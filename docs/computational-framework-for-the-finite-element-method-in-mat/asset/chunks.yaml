    By considering the interval [*s*[0], *s*[1]] having *n* finite elements with *m* + 1
    nodes each, we obtain the total number of *N* = *n**m* + 1 nodes, which can be
    enumerated from 1 to *N*:


    $$\begin{array}{l} {s_{0} = x_{1} < x_{2} < \cdots < x_{N} = s_{1}.} \end{array}$$


    Each node *x*[*i*] can be associated with a Lagrange basis function *φ*[*i*](*x*) ∈ *H*[*h*]^(*m*)(*s*[0], *s*[1]).
