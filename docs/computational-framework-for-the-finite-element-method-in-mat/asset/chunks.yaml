    这里，`Λ`[`m`]被称为勒贝格常数（Lebesgue constant）。可以看出，常数`Λ`[`m`]代表了当引入输入数据误差时近似误差增加的系数。近似方法对输入数据误差的敏感性通过条件数来刻画，该条件数可以通过勒贝格常数来定义。`Λ`[`m`]的值仅取决于节点的分布，而与区间长度无关。渐近估计表明，当使用切比雪夫节点时，勒贝格常数随着
    `m → ∞` 以对数级增长。另一方面，在等距节点的情况下，它呈指数级增长。前者的事实导致得出了一个结论，即建议避免使用具有等距节点分布的高阶全局插值多项式。另一种方法是使用分段局部插值，将区间
    `[s[0], s[1]]` 划分为若干子区间，并在每个子区间上通过低阶插值多项式对函数 `f` 进行近似。


    # 附录 C：积分公式


    DOI: [10.1201/9781003265979-C](https://doi.org/10.1201/9781003265979-C)


    积分公式用于精确计算函数的积分。最常用的公式形式如下：


    $$\int_{s_0}^{s_1} f(x)dx \approx \sum_{i=1}^{n} \gamma_i f(x_i)$$


    在此，`x[`i]` 是节点，`γ[`i]` 是权重。换句话说，如果 `f(x)` 是基函数，那么


    $$\int_{s_0}^{s_1} f(x)dx \approx \sum_{i=1}^{n} \gamma_i f(x_i)$$


    显然，如果基函数是精确积分的，那么积分公式的阶数至少为 `n-1`。众所周知，矩形公式、梯形和辛形公式分别对应零阶、一阶和二阶。从上述公式可以看出，通过增加节点数量，积分公式的阶数可以提高。然而，如果我们考虑具有
    `n` 节点的节点多项式自由度的矩形公式，通过选择节点位置 `x[`1]`^*`，我们可以找到 `x[`1]`^*` 使得面积 `AEFD` 等于 `ABCD`。在这种情况下，矩形公式的结果不是零阶精度，而是一阶精度。这是通过特定的节点选择实现的。


    ![图像显示了坐标系中的三条线。第一条线呈拱形，这是源函数。第二条线连接源函数的顶点为直线，标记为 BC。第三条线是通过第二条线中点的直线，标记为 EF。从
    B 和 C 点引向水平轴的垂直线分别为 BA 和 CD。](img/fig9_1.jpg)


    图 C.1：矩和梯形积分规则。


    计算高斯积分节点 `x[`i]` 和权重 `w[`i]` 有多种算法，其中一种所示。我们首先考虑 `[-1, 1]` 区间的 `n` 节点](appC.xhtml_fnC_1)：


    $$\int_{-1}^{1} f(x)dx \approx \sum_{i=1}^{n} \gamma_i f(x_i)$$


    注意，该公式对于某个阶数 `N` 的多项式是精确的，当且仅当它对于函数集 `f = 1`, `x`, `x²`, `…`, `x^(*N*)` 是精确的。这等价于节点和权重必须满足以下非线性方程组


    $$\sum_{i=1}^{n} \gamma_i x_i^k = \int_{-1}^{1} x^k dx = \frac{\dots}{\dots}$$


    # 附录 D：积分规则与正交多项式


    通常情况下，积分数值计算的高斯积分规则可以利用正交多项式的性质导出。在这里，我们提供了正交多项式理论的基础知识，并给出了计算节点和权重的通用公式。让我们从定义开始。


