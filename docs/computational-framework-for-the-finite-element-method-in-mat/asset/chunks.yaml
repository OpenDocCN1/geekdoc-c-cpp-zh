    ## 3.4 FEM 的线性方程组


    方程 (3.3) 简化线性方程组。首先，我们需要选择定义在有限元 `τ` 上插值的基函数。我们对基函数的定义如下：对所有点 `𝒫[*h*]` 从 1 到 `n`
    编号，并为每个点 `p[*i]`$\in$`𝒫[*h*]` 分配一个基函数 `φ*i*`，使得 `φ*i*=`δ[*i*j]`，`j`=1,...,`n`。那么，任何
    `v[*h*]` 都可以以插值多项式的形式表示：


    $$\begin{array}{l} {v_{h}(\mathbf{x}}) = {\sum_{i = 1}^{n_{p}}{v_{i}\varphi_{i}(\mathbf{x})}},
    \end{array},$$


    其中 `v[*i*]`=`v(p[*i])`。我们将索引集 `ℐ={1,2,...,n[*p*]}` 分为两个子集：`ℐ[*D]`={`i`$\in$`ℐ:`p[*i]`$\in$`𝒫[*D*]}
    和 `ℐ[*U]`={`i`$\in$`ℐ:`p[*i]`$\notin$`𝒫[*D*]`。点 `p[*i][D]` 处的解由边界条件 `u[*h*]` 已知。我们需要找到
    `p[*i][U]` 处的解。以下展开式在 `𝒯[*h*]` 中有效：


    $$\begin{array}{l} {u_{h}(\mathbf{x}) = {\sum_{i \in i_{U}}{u_{i}\varphi_{i}(\mathbf{x})}}
    + {\sum_{i \in i_{D}}{u_{i}\varphi_{i}(\mathbf{x})}},\quad v_{h}(\mathbf{x}) =
    {\sum_{i \in i_{U}}{v_{i}\varphi_{i}(\mathbf{x})}}} \end{array}$$$(3.4)


    定义一个 `n[*p]`×`n[*p]`]`矩阵 `Ã` 和一个 `n[*p]`向量 `\widetilde{F}`，其分量为：


    $$\begin{array}{l} {{\widetilde{A}}_{ij} = {\int\limits_{\mathcal{T}_{h}}{\left(
    {c\nabla u_{h} \cdot \nabla v_{h} + \mathbf{\mathbf{b}} \cdot \nabla u_{h}v_{h}
    + au_{h}v_{h}} \right)d\mathbf{\mathbf{x}}}} & {+ {\int\limits_{\Gamma_{R}^{h}}{\sigma
    u_{h}v_{h}d\mathbf{\mathbf{x}}}}} \end{array}}$$$(3.5)


    $$\begin{array}{l} {{\widetilde{F}}_{i} = {\int\limits_{\mathcal{T}_{h}}{fv_{h}d\mathbf{\mathbf{x}}}}
    + {\int\limits_{\Gamma_{R}^{h}}{\mu v_{h}d\mathbf{\mathbf{x}}}}} \end{array}$$$(3.6)


    其中 `Ã` 称为刚度矩阵，`\widetilde{F}` 是力向量。然后，方程 (3.3) 可以重写为线性方程组的形式（见 1.3）：


    $$\begin{array}{l} {\sum_{j \in i_{U}}{{\widetilde{A}}_{ij}u_{j}}} = q_{i},\quad
    q_{i} = {\widetilde{F}}_{i} - {\sum_{j \in i_{D}}{{\widetilde{A}}_{ij}u_{j}}}}
    \end{array}$$$(3.7)


    通过求解 (3.7) 我们找到 `u[*h*]`，`j`$\in$`ℐ[*U]`。虽然不使用这些公式，但我们考虑高效的方法。


    ## 3.5 刚度矩阵与力向量


    线性方程组 (3.7) 涉及到 `Ã` 和向量 `F` 的计算。在实际应用中，这些矩阵很大，它们的计算影响整体性能。从 (3.5) 可以得出 `Ã` 是维度为
    `n[*p]`×`n[*p]` 的方阵和：这里我们考虑高效的方法


    $$\begin{array}{ll} A_{ij} & = {\int\limits_{\mathcal{T}_{h}}{\left( {c\nabla
    u_{h} \cdot \nabla v_{h} + \mathbf{\mathbf{b}} \cdot \nabla u_{h}v_{h} + au_{h}v_{h}}
    \right)d\mathbf{\mathbf{x}}}} \\ S_{ij} & = {\int\limits_{\Gamma_{R}^{h}}}{\sigma\varphi_{j}\varphi_{i}d\mathbf{\mathbf{x}}}}
    \end{array}$$


    回溯 `𝒯[*h*]` 是有限元 `τ` 的并，即 $\mathcal{T}_{h} = {\underset{l = 1}^{n_{t}}}{\cup}}\tau_{l}}$，其中
    *n[*t]*]* 是有限元的总数。同样，`\widetilde{\mathbf{F}} = \mathbf{F} + \mathbf{M}`，`i`=1,...,`n_{p}`：


    $$\begin{array}{l} F_{i} = {\int\limits_{\mathcal{T}_{h}}{f(\mathbf{\mathbf{x}})\varphi_{i}d\mathbf{\mathbf{x}}}},\quad
    M_{i} = {\int\limits_{\Gamma_{R}^{h}}}{\mu(\mathbf{\mathbf{x}})\varphi_{i}d\mathbf{\mathbf{x}}}}
    \end{array}$$

