    ## 5.3 CALCULATING LOCAL STIFFNESS MATRICES


    Let us consider calculating stiffness matrix corresponding to a triangular element
    *τ* (here we drop the index *l* implying that *τ* could be any element from *τ*).
    Components of local matrix `\overline{A}` with indices *α*, *β* are defined as


    ```

    \overline{A}_{\alpha\beta} = \int\limits_{\tau}{\left( {c\nabla\varphi_{i_{\beta}}
    \cdot \nabla\varphi_{i_{\alpha}} + \mathbf{b} \cdot \nabla\varphi_{i_{\beta}}\varphi_{i_{\alpha}}
    + a\varphi_{i_{\beta}}\varphi_{i_{\alpha}}} \right)d\mathbf{x}}

    ```


    Here, `i[1]`, `i[2]` and `i[3]` are the vertices of the element, and `φ[i[1]]`,
    `φ[i[2]]` and `φ[i[3]]` are the corresponding basis functions (note that `i[1]`,
    `i[2]`, `i[3]` is a column of matrix). [Figure 5.1](#chapter5.xhtml_fig5_1) shows
    the element *τ* with notation. ![An image shows two triangles in three-dimensional
    space having one common side and placed one above the other.](images/fig5_1.jpg)


    First method is based on the assumption that coefficients `c(x)`, `b(x)` and `a(x)`
    are constant over the element *τ* and equal to the values computed at the element’
    centre of mass, `p[τ] = (p[i[1]] + p[i[2]] + p[i[3]])/3`. In this case the integral
    is computed analytically (provided expressions for the basis functions are known)
    through the formula


    ```

    \overline{A}_{\alpha\beta} = \int\limits_{\tau}{\left( {c(p_{\tau})\nabla\varphi_{i_{\beta}}
    \cdot \nabla\varphi_{i_{\alpha}} + \mathbf{b}(p_{\tau}) \cdot \nabla\varphi_{i_{\beta}}\varphi_{i_{\alpha}}
    + a(p_{\tau})\varphi_{i_{\beta}}\varphi_{i_{\alpha}}} \right)d\mathbf{x}}

    ```


    Second method makes use of the quadrature formula with one node which is faithful
    representation for linear polynomial integrand


    ```

    \overline{A}_{\alpha\beta} = |\tau| \left( {c\nabla\varphi_{i_{\beta}} \cdot \nabla\varphi_{i_{\alpha}}
    + \mathbf{b} \cdot \nabla\varphi_{i_{\beta}}\varphi_{i_{\alpha}} + a\varphi_{i_{\beta}}\varphi_{i_{\alpha}}}
    \right)(p_{\tau})

    ```


    where |*τ*| is the area of the element *τ*.

