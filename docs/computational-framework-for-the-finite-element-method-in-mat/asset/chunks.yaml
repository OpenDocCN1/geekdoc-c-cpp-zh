    \ \\mathcal{W} & {: \\left\\{ w \\in H^{1}(s_{0},s_{1}):w(s_{0}) = u_{s_{0}} \\\
    right\\}, \\\\ \\mathcal{W}^{0} & {: \\left\\{ w \\in H^{1}(s_{0},s_{1}):w(s_{0})\
    \ = 0 \\right\\},} \\end{array}$$\n\n得到表达式 (1.9) 是边界值问题有限元公式的第一步。下一步是通过多项式近似表示解。由于我们认为\
