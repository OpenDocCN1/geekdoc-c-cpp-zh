    Let us consider assembling global stiffness matrix for 𝒢[1] triangular mesh corresponding
    to a square domain. Triangulation is represented in terms of matrices (`p`, `e`,
    `t`). It is important to mention that `t(1:3,it)` stores global node indices for
    the element having index `it`. Local stiffness matrices could be assembled into
    the global one through the following five methods.


    1. `s**t` algorithm *(inefficient)*. This algorithm is based on the definition
    of global stiffness matrix and assembles the stiffness matrix element by element,
    but it is computationally inefficient and not recommended for practical use in
    MATLAB.


    ![](images/comp05_1.jpg)


    2. `nd` algorithm *(partly optimized)*. This is a vectorized version of the previous
    algorithm and it is suitable for meshes with small number of elements.


    ![](images/comp05_2.jpg)


    3. `d` algorithm *(optimized)*. This algorithm is based on assembling the stiffness
    matrix in the coordinate form.


    ![](images/comp05_3.jpg)


    Some comments are to be mentioned here. For any matrix `B`, indexing like `B(:)`
    transforms the matrix into a column of the length `numel(B)`. Element `Al(i,j)`
    should be added to the corresponding positions of matrix `A`. As such, instructions
    `i(m)=il(:); j(m)=jl(:); v(m)=Al(:)` transform matrices `il`, `jl` and `Al` into
    columns and assign them to the corresponding elements of the vectors `i`, `j`
    and `v`.


    4. `th` algorithm *(most efficient)*. This algorithm is based on fully vectorized
    form of assembling global stiffness matrix.


    ![](images/comp05_4.jpg)


    Function `stiffnessAssemb_4()` is loop free and operates only with vectors. For
    the symmetric matrix `A` the algorithm could be more memory efficient (in this
    case some of `aij` can be replaced by a single vector and `A=A+A.’`). We can avoid
    vectorization of the local stiffness matrices in function `stiffnessAssemb_4()`
    and save some memory. For example, the following version of assembling algorithm
    is comparable in terms of computational cost with the previous one.


    ![](images/comp05_5.jpg)


    Let us compare computational efficiency of all assembling algorithms with the
    help of the function `testAssembStiffness()` in [listing 5.6](#chapter5.xhtml_list5_6).


    ![](images/comp05_6.jpg)


    [Table 5.1](#chapter5.xhtml_tbl5_1) summarizes results of the computational efficiency
    test. We can conclude that the CPU time for the first and second versions of the
    function `stiffnessAssemb()` is proportional to the square of nodes number while
    CPU time for the third, fourth and fifth versions of the assembling algorithm
    are practically proportion to the number of mesh nodes. Algorithms of `ver_4`
    and `ver_5` are faster than `ver_3` since they do not contain loops. As a result,
    it is recommended to use vectorized form of the global matrix assembling algorithm.


