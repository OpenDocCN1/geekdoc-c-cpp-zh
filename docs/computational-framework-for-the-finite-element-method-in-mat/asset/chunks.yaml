    # 引言


    有限元法（FEM）的编程涉及编码各种数值方法并将它们汇成一个完整的流水线。值得注意的是，流水线中的每一个部分都至关重要，因为在任何阶段引入的错误都会随着累积效应进一步传播，可能导致最终结果失效。这就是为什么数值实现是数值模拟的一个重要部分，不应被低估。在高级层次上，编码包括以下主要阶段：首先，采用几何离散化算法，生成最终的单元。然后，根据这些单元的形状和分布，必须编写特定数值积分方法的实现。下一个重要部分是定义一种算法，将所有在单个有限单元上的计算值装配成一个矩阵，形成待数值求解的线性方程组。


    完成 FEM 算法的编码后，将进行验证以确保实现是正确的。这通常是针对已知解析解的基准进行的，以便我们根据不同的离散化参数估计方法的误差和收敛性。


    有大量关于 FEM 的书籍，包括 FEM 数学分析、FEM 编码以及使用 FEM 解决应用问题，这些对于理解 FEM 算法非常有帮助。例如，读者可以在 [1]
    中找到全面的 FEM 分析，涵盖了不同类型的有限单元。[3] 的书侧重于稳态边界值问题。它包含了实现 FEM 的详尽理论和实践方面，并解释了如何从零编写有限元代码。在
    [5] 和 [2] 中可以找到 FEM 算法的 MATLAB 实现，并附有数值分析和网格技术的详细描述。阅读 [4] 和 [7] 有助于学习使用 Python
    进行科学计算。为了更好地了解如何使用特定的 MATLAB 工具求解微分方程，请参阅文档 [6]。


    # 第一章 用于一维边界值问题的有限元法


    DOI: [10.1201/9781003265979-1](https://doi.org/10.1201/9781003265979-1)


    在基本概念的引言中提到，有限元法（FEM）的实际开发是工程师为了解决他们的结构问题而建立的。因此，FEM 通常通过考虑在受力下线性弹簧系统的位移来处理。这种技术源于应用于结构问题的刚度法，该技术产生的方程是力-位移关系，它们描述了特定的力学模型。与这种传统方法不同，书中引入
    FEM 的方法基于更广泛的公式，考虑不包含任何结构力学参考的通用微分方程。所有特定问题（包括结构问题）都可以建模为该通用方程的特例。


    在本章中，我们获得了具有混合边界条件的线性一维二阶常微分方程（ODE）的 FEM 算法。首先，我们推导出边界值的积分方程，并概述 FEM 的基本方法。然后介绍了有限单元、基函数以及多项式插值技术。我们展示了如何用有限单元离散化积分方程，以及
    FEM 如何简化求解线性方程组。


    ## 术语表


    - **u**, **v**, **…:** 向量使用粗体字体。

    - **(`u` · `v`):** 两个向量的点积，$\mathbf{\mathbf{u}} \cdot \mathbf{\mathbf{v}} = {\sum\limits_{i
    = 1}^{n}{u_{i}v_{i}}}$}$.

    - **U**, **V**, **…:** 矩阵用大写字母表示。

    - **`f`(`x`):** 单变量函数。

    - **`f`′, `f`″, **…:** 单变量函数 `f`(`x`)` 的导数。

    - **`C`(`a`, `b`):** 在区间 (`a`, `b`) 上连续的函数集。

    - **`C`^(`k`)(`a`, `b`):** 具有连续前 *k* 阶导数的连续函数集。

    - **`L[2]`(`a`, `b`):** 定义在 (`a`, `b`) 上的函数空间，其绝对值的平方是勒贝格可积的。如果 `v`(`x`) ∈ `L[2]`(`a`,
    `b`)，则 ∥`v`∥[`L[2]`² = ∫[`a`]^(`b`)||`v`|[2]*d**x** < ∞。

    - **`H`¹(`a`, `b`):** 索伯夫空间，定义为 `H`¹(`a`, `b`) : {`v` ∈ `L[2]`(`a`, `b`) : `v`′
    ∈ `L[2]`(`a`, `b`)}。如果 `v`(`x`) ∈ `H`¹(`a`, `b`)，则 ∥`v`∥[`H`¹]`² = ∫[`a`]^(`b`)(|v`′|²)*d**x**
    < ∞。

    - **𝒢[m]:** *m* 次多项式集。


    ## 1. 线性二阶 ODE 边界问题的公式


    在整个章中，我们考虑形式如下的线性 ODE：


    ```

    (c(x)u''(x))'' + b(x)u''(x) = f(x), x \in (s_0, s_1)

    ```


    这里，`c`(`x`)、`b`(`x`) 和 `f`(`x`) 是已知的；`u`(`x`)`是待求的未知量。`c`(`x)` 是方程 (1.1) 的系数。`u`(`x)`
    是温度。`s_0` 和 `s_1` 是边界点。


    注意，ODE 允许多个解，需要额外的条件来获得方程 (1.1) 的唯一解。如果两个边界条件都指定在同一点（`s_0` 或 `s_1`），则该问题称为*柯西问题*。在
    `s_0` 和 `s_1` 处均指定边界条件的方程（1.1）称为*边界值问题*（BVP）。柯西问题和 BVP 有不同的性质和求解方法。本书仅关注 BVP。


    让我们考虑在边界点 `s` 处指定的各种类型的条件（这里 `s` 可以是 `{s_0, s_1}` 中的任意一个）。例如点 `s` 处的解是知的，即 `u`(`s`)
    = `u`[`s]`，这给出了狄利克（第一类）边界条件。另一种情况是边界点解的导数 u`′(`s`) = `u`[`s]`′，这被称为纽曼（第二类）边界条件。狄利克与纽曼边界条件的组合给出罗宾（第三类）边界条件，形式为
    `u`′(`s`) + `ρ``u`(`s`) = `μ`，或者 ±(`c``u`′)(`s`) + `σ``u`(`s`) = `μ`，取决于 `σ` 和
    `μ` 的选择（这里函数 `c`(`x)` 是方程 (1.1) 的系数）。通常，这些条件的含义取决于具体的应用问题。例如，在热传方程的应用中（`u`(`x)`
    为温度），狄利克边界条件意味着边界处的温度已知，而纽曼边界条件指定了边界处的热通量。


    如果一个 BVP 给出了不同类型的边界条件（BC），则定义为混合边界条件。例如，问题 (1.1) 可以由以下边界条件补充：


    ```

    u(s_0) = u_{s_0}, (cu'')(s_1) + σ u(s_1) = μ

    ```

