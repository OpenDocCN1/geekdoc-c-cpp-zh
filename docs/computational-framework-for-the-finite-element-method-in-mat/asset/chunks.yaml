    关于有限元法（FEM）的书籍有很多，包括有限元数学分析、有限元编程以及使用有限元法求解应用问题（大多是力学问题）。然而，这些书籍中并没有许多能够同时涵盖理论和带有代码示例的数值实现的。通常情况下，编程实现仅作为理论部分的补充，仅用于说明基础简单案例的实现。很多时候，编程实现是针对特定的应用问题提供的定制代码，而这些应用中的大部分都源于结构力学。


    本书书的设计理念是描述有限元算法的实现本身，并以最通用的公式化进行描述，以便将该算法应用于尽可能多的应用问题中。在这里，理论部分提供了实现相应数值方法所需的全部内容，而这些数值方法是有限元算法的一部分。本书关注了工程师在编写程序代码时出现的重要实践细节。总的来说，本书从科学编程的角度考虑了有限元法。


    ## 本书涵盖的内容


    本书内容分为六章，涵盖了以下主题：


    *   拉格日插值多项式；

    *   数值积分的求积规则；

    *   有限元的参数定义及其对解误差的影响；

    *   计算有限元矩阵；

    *   组装有限元矩阵；

    *   将边界条件引入有限元矩阵中；

    *   有限元数据结构；

    *   定义几何形状并构建二维三角形网格；

    *   对弯曲边界的自适应（等参数有限元）；

    *   使用有限元法求解模型问题。


    我们将从线性一维常微分方程模型边界值问题的表述开始。然后，通过引入插值函数和有限元，推导出求解模型问题的有限元算法。随后考虑了线性偏微分方程的二维问题，并推导出相应的二维有限元算法。算法的每一步都提供了详细的说明和编程函数实现。我们讨论了表示网格剖分和边界条件的数据结构，并比较了矩阵组装过程的不同方法。针对一个示例问题提供了完整的编程代码，并验证了计算效率。


    书中列出的源代码是可以下载的，可以在仓库 [`github.com/psumets/FEM_lib`](https://github.com) 中找到。


    ## 背景与基本概念


    有限元法（FEM）是一种用于求解数学建模中出现的常微分和偏微分方程的数值方法。它最初被用于求解固态力学问题，被证明在从传统的结构分析、热传递、流体流动、质量传输和电磁势到计算机角色动画中的几何变形模拟等实际应用中都是高效且稳健的。


    有限元法的基本思想是将计算区域划分为更小、更简单的部分，称为有限单元，并在这些单元边界内寻找局部解。通过将最终单元上的各个解缝合在一起，就可以获得全局解。有限元法的优点包括：能够准确表示复杂的几何形状、捕捉局部效应以及易于解表示。


    该方法的历史非常具有启发性。有限元概念最初由 Courant 在 1943 年他在求解扭转问题的工作中引入，但这项工作并没有引起太大的关注。后来，在 20
    世纪 50 年代，结构工程师将有限元法作为一种解决弹性问题的实用技术推向舞台。现在，该方法从实践和理论角度都已成为一项重要技术，其应用数量开始迅速增长。20
    世纪 70 年代，数学家们对该方法及其基础理论进行了全面阐述。目前，有限元法已演变为数值求解微分方程的通用工具。许多软件软件包已将有限元法并应用于计算物理和工程的所有领域。`ANSYS`、`ADINA`
    和 `LS-DYNA` 都是有限元法工业用户的通用计算机代码示例。


    任何对现象的数值建模都从建立一个待求解的`数学模型`开始。然后，构建一个可以使用计算机求解的`数值模型`。最后阶段是开发一个`计算机模型`（计算机代码）来模拟系统的行为。有限元法代表了一种数值模型，因此它描述了如何将模型方程、几何形状和边界条件转换为适用于数值方法处理的离散形式。原始数学模型可能有多种形式，生成的数值模型也会随之变化，但有限元法规定了获取数值模型的特定策略，并遵循某些基本概念。因此，有限元算法可以被视为进行数值建模的通用工具。最后，计算机模型代表一个软件软件包，它通常以库的形式存在，包含构成有限元算法的数值方法的计算机实现（例如数值积分或线性求解器）。构建库代码是科学编程的艺术，这不仅意味着对数值方法背后的数学有良好的了解，还需要良好的编程技能。编程语言的选择影响整个开发过程，因为每种语言都有其独特的特征，并可能带有现有的数值库，这些库可以被复用或定制用于有限元法。此外，通常需要对代码进行优化，以获得良好的性能和尽可能低的计算误差。在有限元法中，数值模型通常会被微调，以形成一个准备好编码的优化算法。


    让我们概述使用有限元法求解问题的主要步骤。作为起点，我们有一个以微分方程形式表示的数学模型，以及几何形状和边界条件。首先，该模型需要转换为带有几何区域积分的积分方程形式（在某些情况下，原始数学模型已经是积分形式了）。一旦获得了积分表述，下一步是进行离散化，将连续变量或函数转换为离散对应物。离散化包括将几何区域划分为单个的小斑块（有限单元），并将初始连续的函数和积分表示为其在有限元上插值的组合。换句话说，解是以分段插值的形式寻求的，这种插值的系数是未知数，可以从离散模型中找到。通常，在离散化之后，模型会转化为一个方程组，取决于微分方程的初始形式，可能是线性的非性的。最后一步是求解方程组并通过分段插值多项式表示最终解。

