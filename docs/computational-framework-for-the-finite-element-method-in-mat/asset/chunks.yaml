    and $\hat{\mathbf{\mathbf{p}}_{6}}$ are midpoints). Then `𝒢[2]` are all polynomials
    of the second order on the element `τ̂` (see [figure 6.1](#chapter6.xhtml_fig6_1)
    with original triangle element and corresponding basis element).


