  \ Python 中构建网格\n\n上面，我们已经考虑了如何定义区域几何并使用 MATLAB 工具构建网格。现在，我们解释如何在 Python 中执行网格构建。再次，该方法是使用第三方库进行网格处理，而不是讨论特定的网格构建算法。有一个强大的网格生成工具名为\
  \ `Gmsh`，它有自己的脚本语言，允许创建复杂的几何形状。`PyGmsh` 库为 Gmsh 脚本语言提供了 Python 接口，因此可以利用 Python\
  \ 的特性更轻松地创建几何形状并生成网格。安装 `PyGmsh` 后，可以使用具有基本几何构造函数的默认 Gmsh 内核。\n\n`PyGmsh` 模块有一个\
  \ `Geometry` 类以以下方式表示几何形状：首先，要定义点（使用 `add_point` 方法），然后是线（使用 `add_line`、`add_circle`、`add_circle_arc`、`add_line_loop`\
  \ 等），最后是面（使用 `add_plane_surface` 方法）。这些几何实体在创建时会被分配标识数字。可以定义几何实体组（使用 `add_physical_line`\
  \ 或 `add_physical_surface` 方法），并称为具有唯一标识数字的物理实体。这些物理实体的目的是将几何实体组成更大的组，以便网格模块作为单个实体引用它们。在区域几何定义方面，物理实体可以被视为标记的边界或子域，在上面定义边界条件或系数。例如，列表\
  \ 4.7 中的脚本定义了图 4.2 和 4.3 所示的几何形状。`geometry()` 函数有一个参数 `h` – 网格三角形大小，并返回两个结构：几何对象\
  \ `geom` 和几何单元的标签 `geom_labels`。\n\n![](img/comp04_14.jpg)![](img/comp04_14_2.jpg)![](img/comp04_14_3.jpg)\n\
