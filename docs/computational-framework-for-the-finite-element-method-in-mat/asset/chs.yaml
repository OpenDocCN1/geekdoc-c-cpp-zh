  \n## 练习\n\n*   ▶ 验证使用函数 `interpolatingMat()` 计算 `E` 和 `D` 的操作次数阶分别为 `O(nx²nd)` 和\
  \ `O(nx³nd)`。\n*   ▶ 在 `x=d` 时，针对不同维度 `nx` 的值多次运行函数 `interpolatingMat()` 并估计运行时间。定义计算时间对值\
  \ `nx` 的依赖关系。\n*   ▶ 证明当 `x=d` 时，矩阵 `D` 可以可以通过公式计算：\n\n    $$\\begin{array}{l} {{\\\
  hat{D}}_{ij} = \\frac{\\beta_{j}}{\\beta_{i}({\\hat{x}}_{i} - {\\hat{x}}_{j})},\\\
  quad i \\neq j,\\quad{\\hat{D}}_{ij} = - {\\sum\\limits_{j = 1,j \\neq i}^{n}{\\\
  hat{D}}_{ij}}.} \\end{array}$$\n\n与实现函数 `interpolatingMat()` 相比，使用这些表达式使得计算矩阵 `D`\
  \ 的复杂度变为 `O(nx²)` 而不是 `O(nx⁴)`。\n*   ▶ 编写你自己的版本 `interpolatingMat()` 函数。\n\n## 2.5\
  \ 计算和组装 FEM 矩阵的实现代码\n\n如上所述，全局刚度矩阵 `Ã` 和全局强制向量 `F̃` 的组装可以分解为两部分（见 1.73 和 1.77）：不考虑边界条件的矩阵\
  \ `A` 和向量 `F` 的组装，以及考虑边界条件的矩阵 `S` 和向量 `M` 的组装。listing 2.5 中的函数 `assemblingAF()`\
  \ 实现了第一部分，我们计算 `A` 和 `F`。\n\n通常来说，函数 `assemblingAF()` 返回对应于方程 `-(c**u**^′)′ + b**u**^′\
  \ + a**u** = f` 和齐次 Neumann 边界条件 `c**u**^′ = 0` 的刚度矩阵 `A` 和强制向量 `F`。参数含义如下：`c,b,a,f`\
  \ 是方程系数，`xl` 是有限元节点向量，`x` 是基元上的插值点向量，`d` 是基元上的积分节点向量，`w` 是基元上的积分权重向量。代码完整实现了计算局部矩阵元素的\
  \ algorithm 3，然后它结合了不考虑边界条件的全局矩阵组装（algorithm 2 的前两步）。代码第 5 行对应 algorithm 2 的第一步，第\
  \ 6–17 行通过遍历有限元实现第二步，计算局部矩阵（第 7–14 行）。\n\n![](img/comp02_10.jpg)\n\n值得注意的是行 `A(ne,ne)=A(ne,ne)+Al`。这里\
  \ `A` 是 `n_total`  `n_total` 全局矩阵，`Al` 是 `(m+1)`  `(m+1)` 局部矩阵，`ne` 包含元素的全局索引。因此局部元素被添加到全局。这种组装策略不是完全向量化的，但对于中等数量的来说很好。接下来我们需要考虑边界条件并计算矩阵\
  \ `S` 和向量 `M`，它们分别被添加到 `A` 和 `F` 中形成完整矩阵。边界条件的包含根据 algorithm 1 的第三步执行（第一类 Dirichlet），并根据\
  \ algorithm 2 的第三步执行（第三类 Robin）。回想起第二类边界条件（Neumann）可以被视为 Robin 条件的特例。listing 2.6\
  \ 实现了包含边界条件的逻辑，函数 `assemblingBC()` 输入边界条件矩阵 `bc`、刚度矩阵 `A` 和强制向量 `F`，输出带有边界条件的刚度矩阵和强制向量\
  \ `[A0,F0]`。正如 section 2.2 中的，矩阵 `bc` 的第一列编码了边界条件的类型，因此第 6–13 行对应第三类边界条件，位于点 `s0`（第\
  \ 6–9 行）或 `s1`（第 10–13 行）。然后考虑第一类边界条件（第 15–22 行）。在两种情况下，刚度矩阵和强制向量都会经过修改以包含边界条件。最后一步是从修改后的矩阵形成最终矩阵（第\
  \ 23–25 行）。\n\n一旦使用函数 `assemblingBC()` 创建了最终刚度矩阵 `A0` 和强制向量 `F0`，得到的 FEM 系统就可以求解，并可以根据\
  \ algorithm 1 的第 4 和 5 步组成。listing 2.7 中的函数 `solveFEM()` 返回最终解 `u`。代码第 12–13 行调用线性求解器（MATLAB\
  \ 反斜运算符）并附加任何的 Dirichlet 边界条件（`u_s0` 和 `u_s1`）。\n\n将之前的三个函数合并为一个单一函数以执行线性边界值问题的求解是方便的。让我们引入一个函数\
  \ `solveBVP()`，它返回最终解 `u` 和网格点 `x_mesh`，给定的参数为边界条件、方程系数、有限元节点以及基元上的插值和积分节点（见 listing\
  \ 2.8）。\n\n\n\n\n\n# 引言\n\n我们可以在此停止，并认为编写有限元法（FEM）的任务已经完成，但任何数值模拟流水线中都缺少了一个重要的部分。为了确保我们的工作是完全正确的并验证输出结果，我们需要一个误差分析工具。主要方法是针对具有已知精确解的问题运行模拟，然后将输出结果与误差形式的真实值进行比较。在已知精确解的情况下分析\
  \ FEM 误差，拥有一个计算 `L`[2] 空间和 `H`¹ 空间误差范数的函数是有价值的。\n\n$$\\begin{array}{l} {e = u -\
  \ u_{h},\\quad\\| e\\|_{L_{2}}^{2} = \\int\\limits_{s_{0}}^{s_{1}}e^{2}(x)dx,\\\
  quad\\| e\\|_{H^{1}}^{2} = \\int\\limits_{s_{0}}^{s_{1}}\\left( {e'(x)} \\right)^{2}dx.}\
  \ \\end{array}$$\n\n函数 `errorNorm()` 的代码位于 listing 2.9，它负责计算并输出这些范数。在这里，`e0` 是 `L`[2]\
  \ 误差范数的值，`e1` 是 `H`¹ 误差范数的值，`u` 和 `du` 是精确解及其导数，`y` 是 FEM 解，`xl` 是有限元节点向量，`d` 是基元单元\
  \ [0,1] 上的插值点向量。函数 `errorNorm()` 使用高斯积分来计算范数，并利用插值矩阵和求导矩阵寻找解对应的值。\n\n![](img/comp02_14.jpg)\n\
  \n# 示例问题\n\n现在，我们准备好使用创建的库来求解示例问题。让我们考虑以下边界值问题（BVP）\n\n$$\\begin{array}{cl} {{(u'\\\
  cos(x))}' - 2u'\\sin(x) + u\\sin(x)} & {= \\sin^{2}(x),\\quad x \\in ( - 1,1),}\
  \ \\\\ {\\quad u( - 1)} & {= \\sin( - 1),\\quad u'(1) = \\cos(1).} \\end{array}$$(2.4)\n\
  \n这里的精确解为 `u` = sin (*x*)，方程系数为以下函数：`c`(*x*) = cos (*x*), `b`(*x*) = −2sin (*x*), `a`(*x*) = sin (*x*), `f`(*x*) = sin²(*x*)。边界点为\
  \ `s`[0] = −1 和 `s`[1] = 1。在点 `s`[0] 处有狄利克雷边界条件（Dirichlet BC），它是第一类边界条件；在点 `s`[1]\
  \ 处有纽曼边界条件（Neumann BC）。FEM 库处理第一或第三类边界条件，因此我们需要将 `s`[1] 处的边界条件重写为第三类边界条件的形式，即 `c`(1)`u`^′(1) + `σ`*(1)`u`*(1) = `μ`*(1)。很容易看出\
  \ `σ` = 0 且 `μ` = cos²(1)。\n\n拥有所有组装和求解 FEM 的基本函数后，编写一个脚本（参见 listing 2.10）来求解示例\
