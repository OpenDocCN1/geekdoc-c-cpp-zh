  \ (5.1) 的计算方法。由于基函数 `φ[i][α]` 是线性函数，因此 `∇φ[i][α]` 是常数，(5.1) 可以重写为\n\n$$\\begin{array}{ll}\
  \ \\overline{A}_{\\alpha\\beta} = c(\\mathbf{\\mathbf{p}}_{\\tau}) & \\nabla\\varphi_{i_{\\\
