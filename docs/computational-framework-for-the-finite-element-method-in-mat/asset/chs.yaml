  \n## 5.3 计算局部刚度矩阵\n\n让我们计算三角形单元 *τ* 的刚度矩阵（此处省略索引 *l*，意味着 *τ* 可以是 *τ* 中的任意单元）。局部矩阵\
  \ `\\overline{A}` 的 *α*、*β* 分量定义为\n\n```\n\\overline{A}_{\\alpha\\beta} = \\int\\\
  limits_{\\tau}{\\left( {c\\nabla\\varphi_{i_{\\beta}} \\cdot \\nabla\\varphi_{i_{\\\
  alpha}} + \\mathbf{b} \\cdot \\nabla\\varphi_{i_{\\beta}}}\\varphi_{i_{\\alpha}}\
  \ + a\\varphi_{i_{\\beta}}}\\varphi_{i_{\\alpha}}} \\right)d\\mathbf{x}}\n```\n\n\
  在这里，`i[1]`、`i[2]` 和 `i[3]` 是单元的顶点，而 `φ[i[1]]`、`φ[i[2]]` 和 `φ[i[3]]` 是相应的基函数（注意 `i[1]`、`i[2]`、`i[3]`\
  \ 是矩阵的一列）。图 5.1 显示了带有标记的单元 *τ*。图像显示了三维空间中共享一条边并相互放置的三角形\n\n第一方法基于系数 `c(x)`、`b(x)`\
