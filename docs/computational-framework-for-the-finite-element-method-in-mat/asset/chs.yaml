  \ (d) 显示了两条线：一条是钟形形状的源函数，另一条是中间呈钟形、角部呈波浪形的十四个节点近似。这两条线在图的中间部分完全重合，但在角处显著发散。](img/fig8_1.jpg)\n\
  \n图 B.1: 均匀分布插值节点时，随多项式次数 `m` 增加而近似发散的示例，其中 (a) `m` = 3; (b) `m` = 6; (c) `m` = 10;\
  \ (d) `m` = 14。在这里，源函数是 `f(x)` = 1/(1 + 25*x*²)（实线），近似使用拉格朗日基函数进行（虚线）。\n\n![展示插值节点分布对近似误差影响的两个部分的图像。部分\
  \ (a) 显示了三条线：第一条是钟形形状的源函数；第二条线是切比雪夫节点的近似，与第一条接近，但在角处有点波浪；第三条是均匀分布节点的近似，在角部区域与源函数有显著偏差。部分\
  \ (b) 显示了对应于近似误差的两条线。第一条线代表切比雪夫节点近似误差，其值在零附近震荡，第二条线代表均匀分布节点的近似，与第一条线相比，它有更大的震荡。](img/fig8_2.jpg)\n\
  \n图 B.2: 插值节点分布对近似误差的影响。部分 (a) 显示了三条线：第一条是钟形形状的源函数；第二条线是切比雪夫节点的近似，与第一条接近但在角处有点波浪；第三条是均匀分布节点的近似，与源函数有显著偏差。部分\
  \ (b) 显示了对应于近似误差的两条线。第一条线代表切比雪夫节点的近似误差，值在零附近震荡，第二条线代表均匀分布节点的近似，与第一条线相比有更大的震荡。\n\n\
  \ 均匀分布可能导致发散。为了理解为什么节点分布很重要，让我们考虑近似误差 `Δ(P_m)`，它可以被估计为\n\n$$\\begin{array}{l} \\\
  left. \\frac{\\left| f^{(m + 1)}(\\xi) \\right|}{(m + 1)!}\\max\\limits_{\\lbrack\
  \ s_{0},s_{1}\\rbrack} \\middle| \\omega_{m + 1}(x) \\middle| , \\right. \\end{array}$$\n\
  \n其中\n\n$$\\begin{array}{l} \\omega_{m + 1}(x) = (x - x_{1})(x - x_{2})\\cdots(x\
  \ - x_{m + 1}), \\end{array}$$\n\n且 `ξ` ∈ `[s[0], s[1]]`。可以看到误差取决于位置。通过选择节点为正交项式的根可以解决发散问题，例如取节点为\
  \ `x[i]` = cos(*π*(i* − 1)/m*), 1 ≤ *i* ≤ *m*，这样可以提高收敛性（参见[图 B.2]）。\n\n## 数据误差与近似精度\n\
  \n近似误差的另一个来源源于插值节点处的函数值 `f[i]` = `f(x[i])` 在指定或计算时带有误差 `ϵ[i]`，即 `f[i]*` = `f[i]` + `ϵ[i]`。结果是从这些节点\
  \ `f[i]*` 构建的多项式 `P[m]*` (x) 可避免地也包含误差\n\n$$\\begin{array}{l} {P_{m}(x) - P_{m}^{*}(x)\
  \ = {\\sum\\limits_{j = 1}^{m + 1}\\epsilon_{j}}\\varphi_{j}(x),} \\end{array}$$\n\
  \n其中 `φj` 是拉格朗日基函数。如果 `ϵ*` = `max{ϵ[i]}`，则有以下估计\n\n$$\\begin{array}{l} \\left. \\\
  max\\limits_{\\lbrack s_{0},s_{1}\\rbrack} \\middle| P_{m}(x) - P_{m}^{*}(x) \\\
  middle| \\leq \\Lambda_{m}\\epsilon^{*},\\quad\\Lambda_{m} = \\max\\limits_{\\lbrack\
  \ s_{0},s_{1}\\rbrack}\\left. \\sum\\limits_{j = 1}^{m + 1} \\right|\\varphi_{j}(x)\
  \ \\middle| . \\right. \\end{array}$$\n\n\n\n\n这里，`Λ`[`m`]被称为勒贝格常数（Lebesgue constant）。可以看出，常数`Λ`[`m`]代表了当引入输入数据误差时近似误差增加的系数。近似方法对输入数据误差的敏感性通过条件数来刻画，该条件数可以通过勒贝格常数来定义。`Λ`[`m`]的值仅取决于节点的分布，而与区间长度无关。渐近估计表明，当使用切比雪夫节点时，勒贝格常数随着\
  \ `m → ∞` 以对数级增长。另一方面，在等距节点的情况下，它呈指数级增长。前者的事实导致得出了一个结论，即建议避免使用具有等距节点分布的高阶全局插值多项式。另一种方法是使用分段局部插值，将区间\
  \ `[s[0], s[1]]` 划分为若干子区间，并在每个子区间上通过低阶插值多项式对函数 `f` 进行近似。\n\n# 附录 C：积分公式\n\nDOI:\
  \ [10.1201/9781003265979-C](https://doi.org/10.1201/9781003265979-C)\n\n积分公式用于精确计算函数的积分。最常用的公式形式如下：\n\
  \n$$\\int_{s_0}^{s_1} f(x)dx \\approx \\sum_{i=1}^{n} \\gamma_i f(x_i)$$\n\n在此，`x[`i]`\
  \ 是节点，`γ[`i]` 是权重。换句话说，如果 `f(x)` 是基函数，那么\n\n$$\\int_{s_0}^{s_1} f(x)dx \\approx\
  \ \\sum_{i=1}^{n} \\gamma_i f(x_i)$$\n\n显然，如果基函数是精确积分的，那么积分公式的阶数至少为 `n-1`。众所周知，矩形公式、梯形和辛形公式分别对应零阶、一阶和二阶。从上述公式可以看出，通过增加节点数量，积分公式的阶数可以提高。然而，如果我们考虑具有\
  \ `n` 节点的节点多项式自由度的矩形公式，通过选择节点位置 `x[`1]`^*`，我们可以找到 `x[`1]`^*` 使得面积 `AEFD` 等于 `ABCD`。在这种情况下，矩形公式的结果不是零阶精度，而是一阶精度。这是通过特定的节点选择实现的。\n\
  \n![图像显示了坐标系中的三条线。第一条线呈拱形，这是源函数。第二条线连接源函数的顶点为直线，标记为 BC。第三条线是通过第二条线中点的直线，标记为 EF。从\
  \ B 和 C 点引向水平轴的垂直线分别为 BA 和 CD。](img/fig9_1.jpg)\n\n图 C.1：矩和梯形积分规则。\n\n计算高斯积分节点 `x[`i]`\
  \ 和权重 `w[`i]` 有多种算法，其中一种所示。我们首先考虑 `[-1, 1]` 区间的 `n` 节点](appC.xhtml_fnC_1)：\n\n$$\\\
  int_{-1}^{1} f(x)dx \\approx \\sum_{i=1}^{n} \\gamma_i f(x_i)$$\n\n注意，该公式对于某个阶数\
  \ `N` 的多项式是精确的，当且仅当它对于函数集 `f = 1`, `x`, `x²`, `…`, `x^(*N*)` 是精确的。这等价于节点和权重必须满足以下非线性方程组\n\
  \n$$\\sum_{i=1}^{n} \\gamma_i x_i^k = \\int_{-1}^{1} x^k dx = \\frac{\\dots}{\\\
  dots}$$\n\n# 附录 D：积分规则与正交多项式\n\n通常情况下，积分数值计算的高斯积分规则可以利用正交多项式的性质导出。在这里，我们提供了正交多项式理论的基础知识，并给出了计算节点和权重的通用公式。让我们从定义开始。\n\
  \n\n\n\n显易看出，正交多项式的定义在常数倍数下是不唯一的。倍数值的选择可以通过某些归一化方法确定，例如，可以使得最高次项的系数为 1。下面给出了正交多项式最重要的性质的概述。\n\
  \n1. 多项式 `Pn` 有 `n` 个不同的实根，这些根位于正交区间内。\n\n2. 正交多项式序列满足如下形式的递归关系：\n\n   $$\\begin{array}{l}\
  \ {P_{k + 1}(x) = (a_{k}x - b_{k})P_{k}(x) - c_{k}P_{k - 1}(x),\\quad k \\geq 0,\\\
  quad P_{- 1}(x) = 0.} \\end{array}$$\n\n3. 多项式根 `{x[k]k=1}^m` 是以下三对角矩阵的特征值：\n\n\
  \   $$\\begin{array}{l} {A_{n} = \\left( \\begin{array}{lllll} \\alpha_{0} & \\\
  sqrt{\\beta_{1}} & & & \\\\ & & & & \\\\ \\sqrt{\\beta_{1}} & \\alpha_{1} & \\sqrt{\\\
  beta_{2}} & & \\\\ & & & & \\\\ & {\\ddots \\ddots} & \\ddots & & \\\\ \\, & & \\\
  sqrt{\\beta_{n - 2}} & \\alpha_{n - 2} & \\sqrt{\\beta_{n - 1}} \\\\ & & & \\sqrt{\\\
  beta_{n - 1}} & \\alpha_{n - 1} \\end{array} \\right),} \\end{array}$$(D.1)\n\n\
  \   其中：\n\n   $$\\begin{array}{l} {\\alpha_{k} = \\frac{b_{k}}{a_{k}},\\quad k \\\
  geq 0,\\quad\\beta_{k} = \\frac{c_{k}}{a_{k - 1}a_{k}},\\quad k \\geq 1.} \\end{array}$$$(D.2)\n\
  \n4. 多项式根 `{x[k]k=1}^n` 是 Gauss Jacobi 积分的节点：\n\n   $$\\begin{array}{l} {{\\int\\\
  limits_{s_{0}}^{s_{1}}{f(x)\\omega(x)dx}} \\approx {\\sum\\limits_{k = 1}^{n}{\\\
  gamma_{k}f(x_{k})}},} \\end{array}$$$(D.3)\n\n   其中所有 `γ[k] > 0`，且当 `f` 是阶数为 `2n\
  \ − 1` 的项式时，积分是精确的。积分权重向量 `γ = {γ[k]k=1}^m` 由以下表达式得出：\n\n   $$\\begin{array}{l}\
  \ {\\gamma_{k} = U_{1k}^{2}m_{0},\\quad m_{0} = {\\int\\limits_{s_{0}}^{s_{1}}{\\\
  omega(x)dx}},} \\end{array}$$$(D.4)\n\n   其中 `U[1k]` 是矩阵 `U` 的第一行，该矩阵的列是矩阵 `A[n]`\
  \ 的单位特征向量（即欧几里得范数为 1 的特征向量），且 `A[n] = UΛU^{-¹}`，`Λ = diag (x[1], …, x[n])`。\n\n\
  重要的正交多项式族是 Jacobi 多项式，它们由如下形式的权重函数确定：\n\n$$\\begin{array}{l} {\\omega(x) = {(1 -\
  \ x)}^{\\alpha}{(1 + x)}^{\\beta},\\quad(s_{0},s_{1}) = ( - 1,1),\\quad\\alpha,\\\
  beta > - 1.} \\end{array}$$\n\n在这种情况下，正交多项式取决于参数 `{α, β}`，前两个多项式可以表示为：\n\n$$\\begin{array}{l}\
  \ {P_{0}^{(\\alpha,\\beta)}(x) = 1,\\quad P_{1}^{(\\alpha,\\beta)}(x) = \\frac{1}{2}\\\
  left( {\\left( {\\alpha + \\beta + 2} \\right)x + \\alpha - \\beta} \\right).} \\\
  end{array}$$\n\n递归公式的系数可以通过以下公式求：\n\n$$\\begin{array}{ll} a_{k} & {= \\frac{(2k\
  \ + \\alpha + \\beta + 1)(2k + \\alpha + \\beta + 2)}{2(k + 1)(k + \\alpha + \\\
  beta + 1)}, \\\\ b_{k} & {= \\frac{(\\beta^{2} - \\alpha^{2})(2k + \\alpha + \\\
  beta + 1)}{2(k + 1)(k + \\alpha + \\beta + 1)(2k + \\alpha + \\beta)}, \\\\ c_{k}\
  \ & {= \\frac{(k + \\alpha)(k + \\beta)(2k + \\alpha + \\beta + 2)}{(k + 1)(k +\
  \ \\alpha + \\beta + 1)(2k + \\alpha + \\beta)}.} \\end{array}$$$(D.5)\n\n(D.4)\
  \ 中的积分可以如下求得：\n\n$$\\begin{array}{l} {m_{0} = 2^{\\alpha + \\beta + 1}\\frac{\\\
  Gamma(\\alpha + 1)\\Gamma(\\beta + 1)}{\\Gamma(\\alpha + \\beta + 2)}} \\end{array}$$$(D.6)\n\
  \n其中 `Γ(x)` 是伽马函数，对于任何正整数 `x`，定义为 `Γ(x) = (x−1)!`。多项式的导数可以通过以下表达式确定：\n\n$$\\begin{array}{l}\
  \ {\\frac{d}{dx}P_{n}^{(\\alpha,\\beta)} = \\frac{1}{2}(n + \\alpha + \\beta + 1)P_{n}^{(\\\
  alpha,\\beta)}} \\end{array}$$ (注：此处原文中为 $m$ 应为 $n$)\n\n对于 `α = \\β = -1/2` 得到切比夫多项式；对于\
  \ `α = \\β = 0` 得到勒德多项式；对于 `α = 1`, 1` 任意或 `β = 1` 得到拉格拉斯多项式，且 `α = \\beta = 1`\
  \ 得到 斯特多项式；对于 `α = \\beta = 1` ` 得到得到广切比夫多项式；对于 `α = -1/2, - ` 得到得到第一切第一切比夫多项式；对于\
