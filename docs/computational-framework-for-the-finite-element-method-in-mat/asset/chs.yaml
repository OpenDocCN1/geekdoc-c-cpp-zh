  \ 是矩阵条目的数组，`i` 是矩阵条目的行索引数组，`j` 是矩阵条目的列索引数组。如果省略参数 `(data, (i, j))`，则将创建一个给定形状的空稀疏矩阵，如代码第\
  \ 8 和第 9 行所示。Python 中的稀疏矩阵类不支持高级索引，因此组装刚度矩阵的最佳方法是在累加最终刚度矩阵时，使用扩展局部矩阵作为加项（参见定义 1.10\
  \ 和 算法 2）。回想起来，扩展局部刚度矩阵除了对应最终元素的对角块外，全部为零。假设我们有一个具有三个节点的最终元素，那么该块将有 3 × 3 = 9 个元素，为了构造对角线稀疏矩阵，我们需要三个各包含\
  \ 9 个元素的数组，即索引 `i=[0,0,0,1,1,1,2,2,2]`、`j=[0,1,2,0,1,2,0,1,2]` 以及带有某些数据值的 `data`，这些值是二维（3\
  \ × 3）块的一维展平表示。生成局部索引实现在第 10–12 行，其中 `i_loc` 是局部节点索引的范围，`i_loc_sp_mat` 是稀疏矩阵构造函数的局部行索引数组，`j_loc_sp_mat`\
  \ 是局部列索引数组。在这里，函数 `numpy.repeat(i_loc,m+1)` 将数组 `i_loc` 的每个元素重复 `m+1` 次，而 `numpy.tile(i_loc,m+1)`\
