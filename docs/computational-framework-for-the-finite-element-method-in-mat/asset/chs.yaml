  \ `Geometry` 类的 `TAKEN_PHYSICAL_IDS` 中。\n\n下一步生成网格并检索剖分数据 `p,t,e`（详细说明见第 4.2 节）。列表\
  \ 4.8 中的函数 `generateMesh()` 有两个参数：`geom` – 几何对象，`geom_labels` – 几何元素标签的结构（这些结构由\
