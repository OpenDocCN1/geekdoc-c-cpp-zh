  beta} = (|e|/4)\\mu(\\mathbf{p}_{e})$，其中考虑了 `φ[i[α]][p[e]]=1/2` 事实。\n\n## 5.4 计算方程系数\n\
  \n刚度矩阵取决于偏微分方程的系数 `c`、`b`、`a`、`f`，我们需要决定如何将这些系数的计算整合到有限元法（FEM）中。注意方程系数可能是子域上的分段函数。回想求解解的区域\
  \ $\\Omega$ 可能由子域组成。每个子域应该有一个唯一的标签 `sdl`，该标签可以从连通性矩阵 `t` 中检索，使得 `sdl=t(:`。因此，每个单元都“知道”它所属的子域。我们可以构造一个函数，以子域标签\
  \ `sdl` 为输入并执行系数计算，例如，如果我们有三个子域 $\\Omega[1]$、$\\Omega[2]$、$\\Omega[3]$，且系数 `c` 定义为：\n\
  \n$$\\begin{array}{l} {c(\\mathbf{\\mathbf{p}}) = \\left\\{ \\begin{array}{ll} {1,}\
  \ & {\\mathbf{\\mathbf{p}} \\in \\Omega_{1},} \\\\ {x_{1}^{2} + x_{2},} & {\\mathbf{\\\
  mathbf{p}} \\in \\Omega_{2},} \\\\ {\\sin(x_{1} + x_{2}), & {\\mathbf{\\mathbf{p}}\
  \ \\in \\Omega_{3},} \\end{array} \\right.} \\end{array}$$\n\n那么 `listing 5.11`\
  \ 中的函数计算系数 `c`。在需要计算系数值时可以调用此函数。值得注意的是，这是一个向量化函数，允许计算所有子域点的系数。\n\n## 5.5 计算全局刚度矩阵和力向量\n\
  \n在 5.3 节中，我们得到了计算 $\\Gamma[1]$ 的局部刚度矩阵和力向量的表达式。现在，我们将这些信息整合到 5.1 和 5.2 节提供的算法中。我们提供了两个版本的算法：向量化的非向量化的。让我们从\
  \ `listing 5.12` 中的非向量化版本开始。\n\n对 `assemblingAF()` 函数的分析表明，为了将其向量化，我们需要在计算完成后直接组装局部刚度矩阵。结果，我们得到了算法的向量化版本（见\
  \ `listing 5.13`）。\n\n让我们比较这两个函数的计算成本。取一个具有三个子域的区域，其几何结构由矩阵 `geometryMatrix`（见图\
  \ 4.1）定义，并按如下指定 PDE 的系数：\n\n然后，运行 `listing 5.19` 显示的脚本来测量不同节点数量的三个网格的 CPU 时间。\n\n\
  结果，我们得到了表 5.3，显示向量化版本优于非向量化版本，这由于 MATLAB 对向量化计算更有效的内存管理是可预测的。\n\n表 5.3：组装全局刚度矩阵和力向量的效率测试总结。最后两列包含对应版本的\
  \ CPU 时间。\n\n| np | nt | assemblingAF | assemblingAF_nv |\n| --- | --- | --- | ---\
  \ |\n| 704 | 1312 | 0.00391 | 1.08008 |\n| 2670 | 5148 | 0.00781 | 3.73047 |\n|\
  \ 16473 | 32466 | 0.05566 | 23.62988 |\n\n`assemblingAF()` 函数的 Python 实现可以在附录 E.1\
  \ 中找到，那里提供了相应的解释。\n\n\n\n\n\n假设 `Γ[D]` 非空，且包含索引为 (`i[1]`, `i[2]`, `…`, `i[d]`) 的边界段，并且函数\
  \ `u[D]` 对于每个分段可能不同。我们按照在 第 5.4 节 中描述的方法定义函数 `uD(x1,x2,sdl)`。因此，狄利克雷边界条件由边界段索引列表\
  \ `bsD=[i1, i2, %, id]` 以及相应的函数定义（同样在 第 5.4 节 中所示）。注意，我们需要记住函数中的 `sdl` 参数现在具有局部索引的含义。例如，假设我们有三个索引别为\
  \ 5、2 和 7 的狄利克雷边界段，则 `bsD = [5 2 7]`。如果第五和第七分段的 `u[D] = 1`，第二个分段的 `u[D] = x[1] +\
  \ x[2]`，那么我们可以像列表 5.20 所示定义函数 `uD`。\n\n![](img/comp05_21.jpg)\n\n如果没有狄利克雷边界条件，则\
  \ `bcD=[]` 且 `uD=[]`；如果 `Γ[D] = Γ` 则 `bsD=inf`。\n\n同样，我们通过索引列表 `bsR` 以及对应 (`σ`,\
  \ `μ`) 的相应函数 `sg` 和 `mu` 在 `Γ[R]` 上定义边界条件。在这种情况下，如果 `σ = μ = 0`，则该分段未在列表中；如果 `Γ[R]\
  \ = Γ` 则 `bs_R=inf`。最后，如果 `Γ[D] = ⌀`，`Γ[R] = Γ` 且 `σ = μ = 0`，则 `bsN=inf`，`sg=[]`，`mu=[]`。\n\
  \n为了方便起见，我们将数据 `(bsD,uD,bsR,sg,mu)` 封装到带有相应字段结构 `bc` 中。\n\n## 5.7 组装边界条件\n\n现在，我们收集所有必要数据以形成由\
  \ (3.7) 定义的 FEM 系统\n\n$$\\begin{array}{l} {{\\sum\\limits_{j \\in \\mathcal{I}_{U}}{{\\\
  widetilde{A}}_{ij}u_{j}}} = q_{i},\\quad q_{i} = {\\widetilde{F}}_{i} - {\\sum\\\
  limits_{j \\in \\mathcal{I}_{D}}{{\\widetilde{A}}_{ij}u_{D_{j}}}},\\, i \\in \\\
  mathcal{I}_{U},} \\end{array}$$\n\n其中矩阵 `Ã = {Ã[i**j]}[i, j = 1]*(n[p]) = A +\
  \ S`，`F̃ = {F̃[i]}[i=1]*(n[p]) = F + M`，`D` 是具有狄利克雷条件的点的索引，`U` 是其余点。\n\n函数 `assemblingAF()`（参见\
  \ 第 5.5 节）计算矩阵 `A` 和向量 `F`，我们需要一个类似的函数来计算 `S` 和 `M`。此外，该函数将允许我们计算具有 `n[p]` 个元素的向量\
  \ `U[D]`，使得除了索引为 `j ∈ D` 的元素具有值 `u[D[j]]` 外，所有元素都等于零。\n\n矩阵 `Ã[U] = {Ã[i, j ∈\
  \ U]}` 通过从矩阵 `Ã` 中删除属于集合 D 的行列得到。为了执行此操作，我们引入了矩阵 `N` (`n[p] × m`)，其中 `m` 是集合 `U`\
  \ 中元素的数量：\n\n$$\\begin{array}{l} {N^{T} \\cdot {(u_{1},u_{2},\\cdots,u_{n_{p}})}^{T}\
  \ = {(u_{i_{1}},u_{i_{2}},\\cdots,u_{i_{U}})}^{T}.} \\end{array}$$\n\n矩阵 `N` 可以定义为\
  \ `N=sparse([i1,i2,...],1:m,1,np)`。因此，如果计算了 `S`、`M` 和 `u[D]`，则矩阵 `Ã` 和向量 `q` 通过以下表达式定义：\n\
  \n$$\\begin{array}{l} {{\\widetilde{A}}_{\\mathcal{I}_{U}} = N^{T}(A + S)N,\\quad\\\
  mathbf{q} = N^{T}((\\mathbf{F} + \\mathbf{M}}) - (A + S)\\mathbf{U}_{D}}.} \\end{array}$$\n\
  \n注意，在求解系统 `Ã[U]u = q` 后，节点点的最终解向量可以表示为 `U = Nu + U[D]`（通过边界值 `U[D]` 补全向量 `u`）。因此，我们得到了在列表\
  \ 5.21 中的函数 `assemblingBC()`，该函数计算了来自边界元素的贡献。\n\n![](img/comp05_22.jpg)!(images/comp05_22)\n\
  \n为了清楚说明，MATLAB 函数 `t=ismember(a,b)` 返回一个布尔向量，如果 `a(k) ∈ b` 则 `t(k)=1`，如果 `a(k)\
  \ ∉ b` 则 `t(k)=0`。\n\n上述函数允许我们构建并求解 FEM 系统。作为最后一步，我们在列表 5.22 中提供了函数 `assemblingPDE()`，它组装\
  \ PDE 并求解。根据输出参数，它返回 FEM 矩阵或最终解向量。\n\n[content] \n\n\n函数 `assemblingAF()` 和 `assemblingPDE()`\
  \ 的 Python 语言可以在附录 E。\n\n## 5.8 求解示例\n\n让我们应用 `assemblingPDE()` 函数求解一个示例。我们考虑形式如下的\
  \ PDE\n\n$$\\begin{array}{l} {\\nabla \\cdot \\left(c(\\mathbf{x})\\nabla u \\right)\
  \ + \\mathbf{b}(\\mathbf{x}) \\cdot \\nabla u + a(\\mathbf{x})u = f(\\mathbf{x}),}\
  \ \\end{array}$$\n\n带有边界条件\n\n$$\\begin{array}{ll} u(\\mathbf{x}) = u_{D}(\\mathbf{x}),\\\
  mathbf{x} \\in \\Gamma_{D}; \\\\ & c(\\mathbf{x})\\nabla u \\cdot \\mathbf{\\nu}(\\\
  mathbf{x}) + \\sigma(\\mathbf{x})u = \\mu(\\mathbf{x}),\\mathbf{x} \\in \\Gamma_{R},}end{array}$$\n\
  \n其中 $\\Omega$ 是一个单位半径的圆。![](img/comp05_23.jpg)\n\n图 5.3： 示例几何形状。我们定义系数\n\n$$\\\
  begin{array}{ll} c = 2 + x_{1}, \\\\ a = x_{1} + x_{2}, \\\\ \\mathbf{b} = (x_{1},x_{2}),\
  \ \\\\ f = 8 - (x_{1} + x_{2})(x_{1} + x_{2}). \\end{array}$$\n\n`Γ[D]` 包含第 1 和第\
  \ 3 段，`Γ[R]` 包含第 2 和第 4 段。边界条件 $\\sigma$ 和 $\\mu$ 可以通过代码实现：\n\n```matlab\n% \n\\\
  begin{array}{ll} \\sigma = 0 & \\text{if } x \\in \\Gamma_R \\\\ \\mu = 0 & \\text{if\
  \ } x \\in \\Gamma_R \\end{array}\n```\n\n很容易看出，该问题在 $h = [0.5, 0.1, 0.05]$ 的网格上由函数给出。由于已知精确解，我们可以找到绝对误差\n\
  \n$$\\begin{array}{l} err = \\max\\limits_{x \\in \\mathcal{T}_{h}} |u(x) - u_{h}(x)|\
  \ \\end{array}$$\n\n以及相对误差，$err/h²$。列表 5.26 中的函数 `assemblingPDE()` 求解该问题并计算 FEM\
  \ 误差。\n\n![](img/comp05_27.jpg)\n\n结果，我们得到了总结测试数据的表 5.4 和 5.5。\n\n\n\n\n求解示例题的 Python\
  \ 版本代码可以在附录 E.3](#appE.xhtml_appE) 中找到。\n\n# 第 6 章 非线性基函数\n\nDOI: [10.1201/9781003265979-6](https://doi.org/10.1201/9781003265979-6)\n\
  \n在这里我们考虑 `\U0001D4A2[2]` 网格，并获得用于直边和曲边三角形单元的基函数的计算表达式。这里给出了如何推导刚度矩阵单元表达式的分析。我们提供了数学公式和表达式，但没有给出\
  \ MATLAB 实现代码。基于本的内容，可以很容易地组合函数。基本上，我们概述了将现有的 `\U0001D4A2[1]` 网格有限元方法（FEM）框架扩展到\
  \ `\U0001D4A2[2]` 网格 FEM 的技术。\n\n## 6.1 线性三角形单元的二次基函数\n\n获取直边 `\U0001D4A2[2]` 三角形基函数的方法与\
  \ `\U0001D4A2[1]` 网格类似，区别在于插值节点的数量。\n\n让我们考虑坐标系 $\\hat{\\mathbf{\\mathbf{x}}} =\
  \ ({\\hat{x}}_{1},{\\hat{x}}_{2})$ 中的一个标准三角形单元 `τ̂`，它具有六个插值节点 $\\hat{\\mathbf{\\\
  mathbf{p}}_{i}},\\, i = 1,\\ldots,6$（此处 $\\hat{\\mathbf{\\mathbf{p}}_{4}},\\hat{\\\
  mathbf{\\mathbf{p}}_{5}}$ 和 $\\hat{\\mathbf{\\mathbf{p}}_{6}}$ 是中点）。那么 `\U0001D4A2\
  [2]` 是单元 `τ̂` 上所有的二次多项式（参见图 6.1](#chapter6.xhtml_fig6_1) 中的原始三角形单元和相应的基单元）。\n\n\
  ![图像显示了两个与图 5.2 相同的三角形，但每个三角形边都多了一个中点。](img/fig6_1.jpg)\n\n图 6.1: 标准单元 `τ̂` 和原始的\
  \ `\U0001D4A2[2]` 网格单元 `τ`。\n\n如果 `x̂[3]` = 1 − `x̂[1]` − `x̂[2]`，则 ${\\hat{\\mathcal{G}}}_{2}$\
  \ 中的基由以下函数定义：\n\n$$\\begin{array}{ll} {\\hat{\\varphi}}_{1} & {= {\\hat{x}}_{3}(2{\\\
  hat{x}}_{3} - 1),\\quad{\\hat{\\varphi}}_{2} = {\\hat{x}}_{1}(2{\\hat{x}}_{1} -\
  \ 1),\\quad{\\hat{\\varphi}}_{3} = {\\hat{x}}_{2}\\left( {2{\\hat{x}}_{2} - \\frac{1}{2}}\
  \ \\right), \\\\ {\\hat{\\varphi}}_{4} & {= 4{\\hat{x}}_{1}{\\hat{x}}_{3},\\quad{\\\
  hat{\\varphi}}_{5} = 4{\\hat{x}}_{1}{\\hat{x}}_{2},\\quad{\\hat{\\varphi}}_{6} =\
  \ 4{\\hat{x}}_{2}{\\hat{x}}_{3},} \\end{array}$$(6.1)\n\n对于任意函数 $\\hat{z} \\in {\\\
  hat{\\mathcal{G}}}_{2}$，下式成立：\n\n$$\\begin{array}{l} {\\hat{z}(\\hat{\\mathbf{\\\
  mathbf{x}}}) = {\\sum\\limits_{i = 1}^{6}{\\hat{z}(\\hat{\\mathbf{\\mathbf{p}}_{i}}){\\\
  hat{\\varphi}}_{i}(\\hat{\\mathbf{\\mathbf{x}}}},\\quad\\hat{\\mathbf{\\mathbf{x}}}\
  \ \\in \\hat{\\tau}.} \\end{array}$$\n\n坐标变换 `τ̂` → `τ` 定义为（参见 (5.4) – (5.6)）：\n\
  \n$$\\begin{array}{l} {\\mathbf{\\mathbf{x}} = B_{\\tau}\\hat{\\mathbf{\\mathbf{x}}}\
  \ + \\mathbf{\\mathbf{p}}_{1},} \\end{array}$$$(6.2)\n\n此外，点 $\\hat{\\mathbf{\\\
  mathbf{p}}_{i}}$ 转换为点 `p[i]`，`i` = 1, …, 6。逆变换定义为 $\\hat{\\mathbf{\\mathbf{x}}}\
  \ = B_{\\tau}^{- 1}(\\mathbf{\\mathbf{x}} - \\mathbf{\\mathbf{p}}_{1})$，且函数 `φi` = `φ̂i(**x** − **p**[1]))`\
  \ 代表 `\U0001D4A2[2]` 中的基。结果是，$\\hat{z}(\\hat{\\mathbf{\\mathbf{x}}})$ 转换为 `z(**x**)`，使得：\n\
  \n$$\\begin{array}{l} {z(\\mathbf{\\mathbf{x}}) = {\\sum\\limits_{i = 1}^{6}{z(\\\
  mathbf{\\mathbf{p}}_{i})\\varphi_{i}(\\mathbf{\\mathbf{x}})}},\\quad\\mathbf{\\\
  mathbf{x}} \\in \\tau.} \\end{array}$$(6.3)\n\n这里注意的是，与 `\U0001D4A2[1]` 网格不同，`\U0001D4A2\
  [2]` 网格的基函数是非线性函数，即二次函数。这一事实使得情况变得稍微复杂。\n\n## 6.2 曲边三角形单元的二次基函数\n\n通常使用曲边单元进行近似。图\
  \ 6.2](#chapter6.xhtml_fig6_2) 显示了 `\U0001D4A2[2]` 网格 `τ`。点 $\\hat{\\mathbf{\\mathbf{p}}_{i}}$\
  \ 转换为点 `p[i]`，`i` = 1, …, 6。\n\n\n\n\n\n$$\\begin{array}{ll} {{\\overline{A}}_{\\\
  alpha\\beta} = \\int\\limits_{\\hat{\\tau}}} & \\left( {\\hat{c}(\\hat{\\mathbf{\\\
  mathbf{x}}})J^{- 1}(\\hat{\\mathbf{\\mathbf{x}}})\\hat{\\nabla}{\\hat{\\varphi}}_{\\\
  beta} \\cdot J^{- 1}(\\hat{\\mathbf{\\mathbf{x}}})\\hat{\\nabla}{\\hat{\\varphi}}_{\\\
  alpha}}~ \\right. \\\\ & \\left. \\text{\\quad\\quad}\\left. ~{+ \\hat{\\mathbf{\\\
  mathbf{b}}}(\\hat{\\mathbf{\\mathbf{x}}}) \\cdot J^{- 1}(\\hat{\\mathbf{\\mathbf{x}}})\\\
  hat{\\nabla}{\\hat{\\varphi}}_{\\beta}{\\hat{\\varphi}}_{\\alpha} + \\hat{a}(\\\
  hat{\\mathbf{\\mathbf{x}}}){\\hat{\\varphi}}_{\\beta}{\\hat{\\varphi}}_{\\alpha}}\
  \ \\right) \\middle| J(\\hat{\\mathbf{\\mathbf{x}}}) \\middle| d\\hat{\\mathbf{\\\
  mathbf{x}}}. \\right. \\end{array}$$$(6.6)\n\n为了计算积分 (6.6)，我们采用积分规则。设被积函数为 $\\hat{z}(\\\
  hat{\\mathbf{\\mathbf{x}}})$，则\n\n$$\\begin{array}{l} {{\\overline{A}}_{\\alpha\\\
  beta} = \\int\\limits_{\\hat{\\tau}}\\hat{z}(\\hat{\\mathbf{\\mathbf{x}}})d\\hat{\\\
  mathbf{\\mathbf{x}}} \\approx {\\sum\\limits_{i = 1}^{q}{{\\hat{\\gamma}}_{i}\\\
  hat{z}(\\hat{\\mathbf{\\mathbf{d}}_{i}})}}, \\end{array}$$\n\n其中系数 `$\\hat{\\gamma}$`[$i$]\
  \ 和节点 $\\hat{\\mathbf{\\mathbf{d}}_{i}}$, `i` = 1, …, `q` 取决于特定的积分规则。对于 $\\mathcal{G}[2]$\
  \ 网格，使用二次多项式积分即可。\n\n在计算积分 (6.6) 时，我们利用了 $\\mathcal{G}[2]$ 网格的一些性质。首先，在直边三角形上计算\
  \ ${\\overline{A}}_{\\alpha\\beta}$ 时，矩阵 `J`^(−1) = `B`^(−*T*) 不依赖于 $\\hat{\\mathbf{\\\
  mathbf{x}}}$，且 ${\\overline{A}}_{\\alpha\\beta}$ 只需计算一次。然而，在曲线三角形单元的情况下，雅可比 `J^{-\
  \ 1}(\\hat{\\mathbf{\\mathbf{x}})` 需要计算 `q` 次。其次，我们可以通过引入矩阵 $\\hat{D}(\\hat{\\mathbf{\\\
  mathbf{d}}_{i}}) \\sim (2 \\times 6)$ 来简化 (6.6) 的计算：\n\n$$\\begin{array}{l} {\\\
  hat{D}(\\hat{\\mathbf{\\mathbf{d}}_{i}}) = \\left\\{ {\\hat{\\nabla}{\\hat{\\varphi}}_{\\\
  beta}(\\hat{\\mathbf{\\mathbf{d}}_{i}})} \\right\\}_{\\beta = 1}^{6},\\quad D(\\\
  hat{\\mathbf{\\mathbf{d}}_{i}}) = J^{- 1}(\\hat{\\mathbf{\\mathbf{d}}_{i}})\\hat{D}(\\\
  hat{\\mathbf{\\mathbf{d}}_{i}}),} \\end{array}$$\n\n列向量\n\n$$\\begin{array}{l} {\\\
  hat{\\mathbf{\\mathbf{\\varphi}}}(\\hat{\\mathbf{\\mathbf{d}}_{i}}) = \\left\\{\
  \ {{\\hat{\\varphi}}_{\\beta}(\\hat{\\mathbf{\\mathbf{d}}_{i}})} \\right\\}_{\\\
  beta = 1}^{6},} \\end{array}$$\n\n以及系数 $\\left. \\gamma(\\hat{\\mathbf{\\mathbf{d}}_{i}})\
  \ = {\\hat{\\gamma}}_{i} \\middle| J(\\hat{\\mathbf{\\mathbf{d}}_{i}}) \\right|$，使得\n\
  \n$$\\begin{array}{ll} {{\\overline{A}}_{\\alpha\\beta} = {\\sum\\limits_{i = 1}^{q}{{\\\
  hat{\\gamma}}_{i}\\hat{z}(\\hat{\\mathbf{\\mathbf{d}}_{i}}}}} & {= {\\sum\\limits_{i\
  \ = 1}^{q}\\gamma}(\\hat{\\mathbf{\\mathbf{d}}_{i}})\\left( {\\hat{c}(\\hat{\\mathbf{\\\
  mathbf{d}}_{i}})\\mathbf{\\mathbf{D}}_{\\beta}(\\hat{\\mathbf{\\mathbf{d}}_{i}})\
  \ \\cdot \\mathbf{\\mathbf{D}}_{\\alpha}(\\hat{\\mathbf{\\mathbf{d}}_{i}})}~ \\\
  right.} \\\\ & {\\text{\\quad\\quad}\\left. ~{+ \\left( {\\hat{\\mathbf{\\mathbf{b}}}(\\\
  hat{\\mathbf{\\mathbf{d}}_{i}}) \\cdot \\mathbf{\\mathbf{D}}_{\\beta}(\\hat{\\mathbf{\\\
  mathbf{d}}_{i}}) + \\hat{a}(\\hat{\\mathbf{\\mathbf{d}}_{i}})}{\\hat{\\varphi}}_{\\\
  beta}(\\hat{\\mathbf{\\mathbf{d}}_{i}})} \\right){\\hat{\\varphi}}_{\\alpha}(\\\
  hat{\\mathbf{\\mathbf{d}}_{i}})} \\right), \\end{array}$$\n\n其中 $\\mathbf{\\mathbf{D}}_{\\\
  alpha}(\\hat{\\mathbf{\\mathbf{d}}_{i}})$ 是 $D(\\hat{\\mathbf{\\mathbf{d}}_{i}})$\
  \ 中索引为 `\\alpha` 的列。由于 `x` ⋅ `y`^(*T*) `y`^(*T*)  = `i`[`j`], `j` = `1`[`n]`，因此局部刚度矩阵可以表示为：\n\
  \n$$\\begin{array}{ll} {\\overline{A} = {\\sum\\limits_{i = 1}^{q}\\gamma}(\\hat{\\\
  mathbf{\\mathbf{d}}_{i}})} \\left( {\\hat{c}(\\hat{\\mathbf{\\mathbf{d}}_{i}})D^{T}(\\\
  hat{\\mathbf{\\mathbf{d}}_{i}})}~ \\right. \\\\ {\\text{\\quad\\quad}\\text{\\quad\\\
  quad}\\left. ~+ \\hat{\\varphi}(\\hat{\\mathbf{\\mathbf{d}}_{i}})\\left( {\\hat{b}(\\\
  hat{\\mathbf{\\mathbf{d}}_{i}})D(\\hat{\\mathbf{\\mathbf{d}}_{i}}) + \\hat{a}(\\\
  hat{\\mathbf{\\mathbf{d}}_{i}})}{\\hat{\\varphi}}^{T}(\\hat{\\mathbf{\\mathbf{d}}_{i}})}\
  \ \\right)} \\end{array}$$\n\n局部力向量同样地计算为：\n\n$$\\begin{array}{l} {\\overline{\\\
  mathbf{F}}} = {\\sum\\limits_{i = 1}^{q}\\gamma(\\hat{\\mathbf{\\mathbf{d}}_{i}})\\\
  hat{f}(\\hat{\\mathbf{\\mathbf{d}}_{i}})\\hat{\\varphi}(\\hat{\\mathbf{\\mathbf{d}}_{i}})}}\
  \ \\end{array}$$\n\n注意的是，对于公式对于曲线三角形有效：\n\n$$\\begin{array}{l} {\\hat{f}(\\hat{\\\
  mathbf{\\mathbf{d}}_{i}}) = f(X\\hat{\\varphi}(\\hat{\\{\\{\\mathbf{d}}_{i}})),\\\
  quad J(\\hat{\\mathbf{\\mathbf{d}}_{i}}) = \\hat{D}(\\hat{\\mathbf{\\mathbf{d}}_{i}}})X^{T},\\\
  quad X_{2 \\times 6} = (\\mathbf{p}_{1},\\ldots,\\mathbf{p}_{6}),} \\end{array}$$\n\
  \n其中 `X` 是有限单元节点的矩阵。让我们给出两种特定积分规则的系数 $\\gamma(\\hat{\\mathbf{\\mathbf{d}}_{i}})$\
  \ 的数值值。第一个包含三个节点（`q` = `3`），插值二次多项式（$\\mathcal{G}[2]$ 网格），其节点和系数为：\n\n$$\\begin{array}{l}\
  \ {\\hat{d} = \\left( \\begin{array}{lll} 0.5 & 0.5 \\\\ 0 & 0.5 \\end{array} \\\
  right),\\hat{\\gamma} = \\frac{1}{6}\\left( \\begin{array}{lll} 1 & 1 & 1 \\end{array}\
  \ \\right).} \\end{array}$$\n\n第二个包含六点并精确插值四次多项式。其节点和系数给出：\n\n$$\\begin{array}{ll}\
  \ & {a_{1} = 0.0915762135097703,\\quad a_{2} = 0.0915762135097703,} \\\\ {b_{1}\
  \ = 0.4459484909159649,\\quad b_{2} = 0.4459484909159649,} \\\\ {a_{3} = 1 - a_{2},\\\
  quad b_{3} = 1 - b_{2},} \\\\ {\\hat{d} = \\left( \\begin{array}{cccccc} a_{1} &\
  \ a_{1} & a_{3} & b_{1} & b_{1} & b_{3} \\\\ a_{2} & a_{3} & a_{2} & b_{2} & b_{3}\
  \ & b_{2} \\end{array} \\right), \\\\ {\\gamma_{1} = 0.1099517436553218,\\quad\\\
  gamma_{2} = 0.2233815896780115,} \\\\ {\\hat{\\gamma} = \\frac{1}{2}\\left( \\begin{array}{cccccc}\
  \ \\gamma_{1} & \\gamma_{1} & \\gamma_{1} & \\gamma_{2} & \\gamma_{2} & \\gamma_{2}\
  \ \\end{array} \\right).} \\end{array}$$\n\n现在我们考虑边界矩阵 $\\overline{S} = \\{\\overline{S}_{\\\
  alpha\\beta}\\}$ 和边界向量 $\\overline{\\mathbf{M}} = \\{\\overline{M}_{\\alpha}\\}$（见公式\
  \ 5.8）。设 $e$ 为端点 `p`[1], `p`[2] 和中点 `p`[3] 的边界，$\\hat{e}$ = `[0,1]` 为具有 $\\hat{\\\
  mathbf{p}}_{1} = 0$, $\\hat{\\mathbf{p}}_{2} = 1$ 和中点 $\\hat{\\mathbf{p}}_{3} =\
  \ 0.5$ 的基边。那么定义在边上的基函数可以表示为：\n\n$$\\begin{array}{l} {{\\hat{\\varphi}}_{1}(\\hat{\\\
  theta}) = (1 - 2\\hat{\\theta})(1 - \\hat{\\theta}),\\quad{\\hat{\\varphi}}_{2}(\\\
  hat{\\theta}) = \\hat{\\theta}(2\\hat{\\theta} - 1),\\quad{\\hat{\\varphi}}_{3}(\\\
  hat{\\theta}) = 4\\hat{\\theta}(1 - \\hat{\\theta}).} \\end{array}$$\n\n公式\n\n$$\\\
  begin{array}{l} {\\mathbf{\\mathbf{x}} = \\mathbf{\\mathbf{x}}_{e}(\\hat{\\theta})\
  \ = \\mathbf{\\mathbf{p}}_{1}\\hat{\\varphi}}_{1}(\\hat{\\theta}) + \\mathbf{\\\
  mathbf{p}}_{2}\\hat{\\varphi}}_{2}(\\hat{\\theta}) + \\mathbf{\\mathbf{p}}_{3}\\\
  hat{\\varphi}}_{3}(\\hat{\\theta})} \\end{array}$$\n\n定义了变换 $\\hat{e}\\rightarrow\
  \ e\\,(\\hat{\\mathbf{p}}_{k}\\rightarrow\\mathbf{p}_{k},\\, k = 1,2,3)$ 以及边的参数表示。很容易看出，在直边情况下，中点\
  \ `p`[3] = (`p`[1] + `p`[2])/2，且 `x`*e* = `p`1 + `p`[2]*θ̂*。用于计算 $\\overline{S}_{\\\
  alpha\\beta}$ 和 $\\overline{M}_{\\alpha}$ 的边界积分 (5.8) 用 *θ̂* 在基边 $\\hat{e}$ 上重写后，具有一维积分的形式。\n\
  \n\n\n\n\n$$\\begin{array}{ll} {\\overline{S}}_{\\alpha\\beta} & {= \\int\\limits_{0}^{1}\\\
  sigma(\\mathbf{\\mathbf{x}}_{e}(\\hat{\\theta})){\\hat{\\varphi}}_{\\alpha}(\\hat{\\\
  theta}){\\hat{\\varphi}}_{\\beta}(\\hat{\\theta})l(\\hat{\\theta})d\\hat{\\theta},}\
  \ \\\\ {\\overline{M}}_{\\alpha} & {= \\int\\limits_{0}^{1}\\mu(\\mathbf{\\mathbf{x}}_{e}(\\\
  hat{\\theta})){\\hat{\\varphi}}_{\\alpha}(\\hat{\\theta})l(\\hat{\\theta})d\\hat{\\\
  theta},} \\end{array}$$(6.7)\n\n其中 $l(\\hat{\\theta}) = \\sqrt{{(x_{1}'(\\hat{\\\
  theta}))}^{2} + {(x_{2}'(\\hat{\\theta}))}^{2}}$。对于直线边，`l(\\hat{\\theta}) = |p[2]\
  \ - p[1]|`，且 `l` 是边的长度。\n\n为了计算一维积分，我们利用数值积分公式：\n\n$$\\begin{array}{l} {\\int\\\
  limits_{0}^{1}\\hat{z}(\\hat{\\theta})d\\hat{\\theta} \\approx {\\sum\\limits_{i\
  \ = 1}^{q}{{\\hat{\\gamma}}_{i}\\hat{z}({\\hat{d}}_{i})}}.} \\end{array}$$\n\n同样地计算二维积分\
  \ (6.6)，我们引入列向量 $\\hat{\\mathbf{\\mathbf{\\varphi}}}({\\hat{d}}_{i}) = \\left\\\
  { {{\\hat{\\varphi}}_{\\beta}({\\hat{d}}_{i})} \\right\\}_{\\beta = 1}^{3}$、$d\\\
  hat{\\mathbf{\\mathbf{\\varphi}}}({\\hat{d}}_{i}) = \\left\\{ {{\\hat{\\varphi}}_{\\\
  beta}'({\\hat{d}}_{i})} \\right\\}_{\\beta = 1}^{3}$ 以及节点坐标矩阵 `X[2 \\times 3] =\
  \ (p[1], p[2], p[3])`。那么，$x'({\\hat{d}}_{i}) = Xd\\hat{\\mathbf{\\mathbf{\\varphi}}}({\\\
  hat{d}}_{i})$ 且 $\\left. l({\\hat{d}}_{i}) = \\middle| Xd\\hat{\\mathbf{\\mathbf{\\\
  varphi}}}({\\hat{d}}_{i}) \\right|$ 是向量 $Xd\\hat{\\mathbf{\\mathbf{\\varphi}}}({\\\
  hat{d}}_{i})$ 的长度。引入这些后，我们得到了矩阵 `S` 和向量 `M` 的表达式：\n\n$$\\begin{array}{ll} S & {=\
  \ {\\sum\\limits_{i = 1}^{q}{\\gamma({\\hat{d}}_{i})\\sigma(X\\hat{\\mathbf{\\mathbf{\\\
  varphi}}}({\\hat{d}}_{i}))\\hat{\\mathbf{\\mathbf{\\varphi}}}({\\hat{d}}_{i}){\\\
  hat{\\mathbf{\\mathbf{\\varphi}}}}^{T}({\\hat{d}}_{i})}},} \\\\ \\overline{\\mathbf{\\\
  mathbf{M}}} & {= {\\sum\\limits_{i = 1}^{q}{\\gamma({\\hat{d}}_{i})\\mu(X\\hat{\\\
  mathbf{\\mathbf{\\varphi}}}({\\hat{d}}_{i}))\\hat{\\mathbf{\\mathbf{\\varphi}}}({\\\
  hat{d}}_{i})}},} \\end{array}$$(6.8)\n\n其中 $\\left. \\gamma({\\hat{d}}_{i}) = {\\\
  hat{\\gamma}}_{i} \\middle| Xd\\hat{\\mathbf{\\mathbf{\\varphi}}}({\\hat{d}}_{i})\
  \ \\right|$。\n\n结论，我们提供了定义在 `[0,1]` 上的两种特定数值积分规则的系数，这些规则可以精确插值三次多项式。第一个是高斯积分法：\n\
  \n$$\\begin{array}{ll} & {{\\hat{\\gamma}}_{1} = {\\hat{\\gamma}}_{2} = 0.5,\\quad{\\\
  hat{d}}_{1} = 0.5\\left( {1 - \\sqrt{1/3}} \\right),} \\\\ & {{\\hat{d}}_{2} = 0.5\\\
  left( {1 + \\sqrt{1/3}} \\right),\\quad q = 2.} \\end{array}$$(6.9)\n\n第二个是辛普森积分法：\n\
  \n$$\\begin{array}{ll} & {{\\hat{\\gamma}}_{1} = {\\hat{\\gamma}}_{3} = 1/6,\\quad{\\\
  hat{\\gamma}}_{2} = 4/6,\\quad{\\hat{d}}_{1} = 0,} \\\\ & {{\\hat{d}}_{2} = 0.5,\\\
  quad{\\hat{d}}_{3} = 1,\\quad q = 3.} \\end{array}$$(6.10)\n\n使用 (6.9) 或 (6.10)\
  \ 均可以数值计算边界积分 (6.7) 并获得相应的矩阵 (6.8)。\n\n# 结论\n\n在本书中，我们考虑了构建用于线性有限元法（FEM）的计算框架，并应用于求解具有混合边界条件的常微分方程和偏微分方程。FEM\
  \ 算法的每一步都得到了详细描述，并编写了 MATLAB 和 Python 的程序代码。尽管存在各种实现 FEM 的软件包，但理解 FEM 算法的基础知识对于利用这些软件包至关重要。书中提供的\
  \ FEM 算法解释和计算框架不仅有助于理解该方法的基础，还为如何使用 FEM 构建自定义代码来解决问题提供了指导。后者非常重要，因为它允许人们开发编码技能，并在解决任何标准\
  \ FEM 软件包无法解决（或简单是无法提供这些软件包）的非标准问题时更加灵活。此外，如果需要，从书中的编码函数可以进行扩展或修改，以构建具有某些特定功能的改进型\
  \ FEM 框架。\n\n当然，我们只考虑了线性 FEM 的简单情况，但它可以作为构建更复杂算法的起点。例如，求解非线性 PDE 需要应用数值方法。\n\n#\
  \ 附录 A：边界问题的变分表述\n\nDOI: [10.1201/9781032659-A](https://doi.org/10.1201/9781032659-A)\n\
  \n在这里我们讨论变分法。变分法用于许多应用，在这些应用中可以用泛函的形式表示。根据这些原理之一，函数 `u` 是平稳的意味着 `J` 关于 `u` 的变化为零。从变分法可知，平稳点具有特定的意义，例如，让我们考虑泛函：\n\
  \n$$\\begin{array}{l} J(u) = \\frac{1}{2}{\\int_{s_{0}}^{s_{1}}{c(x)\\left( {u'(x)}\
  \ \\right)^{2} + a(x)u(x) - f(x)dx}}, \\end{array}$$(A.3)\n\n其中 `c(x)`、`a(x)` 和\
  \ `f(x)` 是分段连续函数，`c(x)` 是二阶可微的。变分问题是寻找使 `J(u)` 最小的函数 `u(x)`。\n\n$$\\begin{array}{l}\
  \ J(u)\\rightarrow\\min,\\quad u(s_{0}) = u_{s_{0}},\\quad u(s_{1}) = u_{s_{1}}.\
  \ \\end{array}$$(A.4)\n\n那么，欧拉-拉格日方程的形式为：\n\n$$\\begin{array}{l} {- \\left( {c(x)u'(x)}\
  \ \\right)' + a(x)u(x) = f(x).} \\end{array}$$(A.5)\n\n可以证明在这种情况下，平稳点是极小值的函数。因此，求解\
  \ (A.3) – (A.4) 等价于求解边界值 (A.5) – (A.2)。\n\n在实践中，边界值 (A.5) – (A.2) 被积分表达式 (A.3) 取代，并对未知函数的近似考虑极小问题。在\
  \ FEM 背景下，未知函数 `u` 通过已知函数 `phii` 和系数 `alpha[i]` 的线性组合表示如下：\n\n$$\\begin{array}{l}\
  \ u(x) = {\\sum\\limits_{i = 1}^{N}{\\alpha_{i}\\varphi_{i}(x)}}. \\end{array}$$(A.6)\n\
  \n将 (A.6) 代入 (A.3)，我们得到了关于变量 `alpha[i]` 的多元函数 `J(alpha[i]phii)` 的极小问题。根据极值的一阶必要条件，变量\
  \ `alpha[i]` 可以由方程求解：\n\n$$\\begin{array}{l} \\frac{\\partial}{\\partial\\alpha_{i}}J\\\
  left( {\\sum\\limits_{i = 1}^{N}{\\alpha_{i}\\varphi_{i}} \\right) = 0.} \\end{array}$$\n\
  \n在这些方程中加上条件 (A.2)，我们得到了求解系数 `alpha[i]` 的方程组，从而定义了解 (A.6)。\n\n\n\n\n求解边界值问题（BVP）的变分法的一个局限性是，它仅适用于微分方程代表欧拉-拉格日方程的情况，而这并非总是可能的。例如，BVP\
  \ (1.1) 不允许变分表述。相反，可以使用投影法，该方法将贯穿全本书。\n\n# 附录 B 全局插值多项式的讨论\n\nDOI: [10.1201/9781003265979-B](https://doi.org/10.1201/9781003265979-B)\n\
  \n让我们考虑定义在区间 `[s[0], s[1]]` 上的阶为 `m` 的全局近似多项式 `Pm`，它插值函数 `f(x)`。插值节点形成序列\n\n$$\\\
  begin{array}{l} {s_{0} = x_{1} < x_{2} < \\cdots < x_{m + 1} = s_{1}.} \\end{array}$$\n\
  \n我们想要分析当节点数量增加时会发生什么（例如为了提高函数近似的精度）。下面考虑了各种类型的近似误差，并展示了增加插值节点数量（相应增加多项式 `P[m]`\
  \ 的次数）如何导致这些误差的累积。\n\n## 随节点数量增加的收敛性\n\n假设我们已经根据某种规则引入新节点来增加多项式次数 `m`。问题在于，这样的多项式是否总是收敛于源函数，还是\n\
  \n$$\\begin{array}{l} \\left. \\Delta(P_{m}) = \\max\\limits_{\\lbrack s_{0},s_{1}\\\
  rbrack} \\middle| f(x) - P_{m}(x) \\middle| \\underset{m\\rightarrow\\infty}{\\\
  overset{}{\\rightarrow}}0\\. \\right. \\end{array}$$\n\n简单的回答是否。为了说明这一点，让我们考虑 Runge\
  \ 函数¹ `f(x)` = 1/(1 + 25*x*²), *x* ∈ [−1, 1], 以及一种简单的策略，即具有步长 `h` = 2/*m* 的均匀分布节点，即\
  \ `x[i]` = −1 + (*i* − 1)*h*, *i* = 1, …, *m* + 1。多项式次数随 `m` 的增加而增加，应用该策略当 `m` = {6, 10,14}\
  \ 的结果所示图 B.1。可以看到，当 `m` 增加时，区间中间部分的近似显示出完美的结果；然而，多项式在边缘区域发散，0.73 ≲ |*x*| ≤ 1。\n\n\
  ![展示随多项式次数增加而近似发散的四个部分的图像。部分 (a) 显示了两条线：一条是钟形形状的源函数，另一条是具有三个节点的近似，呈拱形。这两条线显著不同且不重合。部分\
