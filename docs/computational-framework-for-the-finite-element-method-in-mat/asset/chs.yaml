  \ |\n|---|---|---|---|\n| | | | |\n\n\n\n\n数组的切片和索引操作与列表完全相同，不同在于它们也可以应用于多维。例如，给定一个矩阵\
  \ `A`，命令 `A[0,3]` 访问矩阵的单个元素，而 `A[:,3]` 则提取一列。注意，数组切片不会复制内部数组数据，只会产生原始数据的新视图，因此如果执行\
  \ `b=A[0,3]` 且 `b=b+1`，那么矩阵 `A` 的元素也会被隐式修改。如果需要副本，则需要显式使用 `copy()` 命令。NumPy 数组可以使用数组或列表进行索引。对于所有索引数组的情况，返回的是原始数据的副本而非视图。例如\
  \ `A[np.array([0,2,4]),0]` 或 `A[np.array([0,2,4])][0]` 返回索引为 0、2 和 4 的第一列元素。\n\n\
  在 Python 中操作稀疏矩阵时，我们使用 `scipy.sparse` 库。`scipy.sparse` 库中有多种稀疏矩阵类（`coo_matrix`、`csc_matrix`、`csr_matrix`\
  \ 等），用于执行不同类型的矩阵操作。例如，`coo_matrix` 类用于从索引和值的数组构建坐标格式的稀疏矩阵（详细解释见图 2.1），但它不支持直接算术运算。`sparse.lil_matrix`\
  \ 是用于增量构建稀疏矩阵的结构，支持灵活的切片。`csr_matrix` 和 `csc_matrix` 分别用于压缩稀疏行矩阵和压缩稀疏列矩阵。这些矩阵格式适用于算术运算和行/列切片，但对于改变稀疏结构效率较低。通常，`coo_matrix`\
  \ 是构建稀疏矩阵的快速格式。一旦构建好矩阵，就会（显式或隐式地）转换为 `csc_matrix` 或 `csr_matrix` 格式，以便进行快速算术和矩阵向量运算。\n\
  \n在开始编写 Python 函数之前，需要导入整个代码将使用的库。列表 2.11 中的脚本展示了如何进行导入。库 `numpy` 和 `scipy.sparse`\
  \ 用于处理稠密和稀疏矩阵，`solve` 用于求解稀疏线性组，`plt` 用于绘制仿真结果，`timeit` 库允许进行计时计数器操作。我们只需要在 FEM\
  \ Python 库中运行一次此脚本。\n\n![](img/comp02_16.jpg)\n\n下方提供的 Python 列表包含了名称和功能与 MATLAB\
  \ 中编写的重复函数，因此参数和返回值的表示与 MATLAB 对应项含义一致。在提供特定函数的 Python 实现时，重点将放在与 MATLAB 版本不同的特定\
  \ Python 语言特征上，而不是描述逻辑（逻辑在之前的章节已经讨论过）。\n\n让我们来看看高斯（Gaussian）和洛托（Lobatto）积分规则的 Python\
  \ 实现（见列表 2.12 和 2.13）。根据设计，参数 `s0` 和 `s1` 可以省略，因此代码第 2 行获取实际输入参数的数量并将其存储在变量 `nargin`\
