  \ $\\mathcal{G}[2]$ 单元）。其核心思想是在坐标系 $\\hat{\\mathbf{\\mathbf{x}}} = ({\\hat{x}}_{1},{\\\
  hat{x}}_{2})$ 上考虑一个标准单元 $\\hat{\\tau}$，在该单元上基函数具有简单的已知形式。然后，单元 `τ` 的基函数通过坐标变换推导。为了说明这种方法，让我们考虑图\
