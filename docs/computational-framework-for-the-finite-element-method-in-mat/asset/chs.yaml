  \n结果，通过运行脚本可以生成图 4.3 所示的网格\n\n![](img/comp04_16.jpg)\n\n# 第 5 章 编程二维有限元方法\n\nDOI:\
  \ [10.1201/9781003265979-5](https://doi.org/10.1201/9781003265979-5)\n\n在本章中，我们将考虑装配全局刚度矩阵和全局力向量的五种方法，并详细评估每种方法的计算成本、效率和性能。首先，专注于矩阵装配技术而不是计算矩阵元素，并假设局部刚度矩阵为单位矩阵。随后，我们将考虑计算局部刚度矩阵元素和局部力向量的方法。此外，还将展示如何将边界条件引入\
  \ FEM。本章的描述涉及一些数学分析，这对于理解计算技术很重要。用于计算积分、函数变换和对基函数操作的数值方法将用于推导局部 FEM 矩阵的算法。\n\n\n\
  \n\n让我们考虑为对应正方形区域的 \U0001D4A2[1] 三角网格组装全局刚度矩阵。网格通过矩阵（`p`、`e`、`t`）表示。需要提到的是，`t(1:3,it)`\
  \ 存储索引为 `it` 的元素的全局节点索引。可以通过以下五方法将局部刚度矩阵组装到全局矩阵中。\n\n1. `st` 算法 *(效率低下)*。该算法基于全局刚度矩阵的定义，逐元素地组装刚度矩阵，但其计算效率低下，不建议在\
  \ MATLAB 中实际使用。\n\n![](img/comp05_1.jpg)\n\n2. `nd` 算法 *(部分优化)*。这是前一种算法的向量化版本，适用于单元数量较少的网格。\n\
  \n![](img/comp05_2.jpg)\n\n3. `d` 算法 *(已优化)*。该算法基于坐标形式组装刚度矩阵。\n\n![](img/comp05_3.jpg)\n\
  \n这里需要提到几点注释。对于任何矩阵 `B`，像 `B(:)` 这样的索引会将矩阵转换为长度为 `numel(B)` 的列向量。元素 `Al(i,j)` 应该加到矩阵\
  \ `A` 的相应位置。因此，指令 `i(m)=il(:); j(m)=jl(:); v(m)=Al(:)` 将矩阵 `il`、`jl` 和 `Al` 转换为列并将它们分配给向量\
  \ `i`、`j` 和 `v` 的相应元素。\n\n4. `th` 算法 *(最高效)*。该算法基于全局刚度矩阵组装的完全向量化形式。\n\n![](img/comp05_4.jpg)\n\
  \n函数 `stiffnessAssemb_4()` 无循环且仅对向量操作。对于对称矩阵 `A`，该算法可以更节省内存（在这种情况下，某些 `aij` 可以被单个向量替换且\
  \ `A=A+A.’`）。我们可以避免在 `stiffnessAssemb_4()` 函数中对局部刚度矩阵进行向量化并节省一些内存。例如，以下版本的组装算法在计算成本与上一个版本相当。\n\
  \n![](img/comp05_5.jpg)\n\n让我们通过列表 5.6 中的函数 `testAssembStiffness()` 所有组装算法的计算效率。\n\
