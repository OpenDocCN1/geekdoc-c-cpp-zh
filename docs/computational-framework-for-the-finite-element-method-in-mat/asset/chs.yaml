  \n## E.1 矩阵组装\n\n如何计算和组装 FEM 矩阵在 5.3–5.5 节进行了解释，其中给出了向量化组装算法的 MATLAB 函数 `assemba()`。将此函数翻译成\
  \ Python 很容易。\n\n下面我们提供了利用稀疏矩阵进行矩阵计算和组装的 Python 代码。它遵循第 5.5 节中 MATLAB 代码的结构。\n\n\
  ## E.2 边界条件的组装\n\n边界条件的计算实现基于 5.6 节描述的方法。我们使用字典结构，包含边界段列表以及在这些段上定义的对应函数。例如，通过定义函数\
  \ `uD(x1,x2,sdl)`，我们可以在第一段和第三段指定狄利克边界条件。\n\n给出的 Python 函数 `assemblingBC()` 执行边界条件的组装，并重复了相应\
  \ MATLAB 函数的逻辑。\n\n\n\n\n在这里，我们需要解释如何在 Python 中实现一些 MATLAB 函数。例如，MATLAB 函数 `find(a)`\
  \ 可用于找到数组 `a` 中非零元素的索引和值，这在 Python 中可以表示为函数 `numpy.nonzero(a)`，它返回一个数组元组，其中 `a`\
  \ 的每个维度对应一个数组，包含该维度上非零元素的索引。为了按元素而非维度对索引分组，我们可以使用 `numpy.transpose(numpy.nonzero(a))`，这将得到一个二维索引数组，每一行代表一个非零元素。针对布尔数组的逻辑操作可以通过\
  \ `numpy` 包中的特殊函数完成，例如，`numpy.logical_or(x1,x2)` 函数对 `x1` 和 `x2` 的元素应用逻辑“或”运算。MATLAB\
  \ 函数 `ismember(x1,x2)` 对应于 Python 函数 `numpy.isin(x1,x2)`，它返回一个与数组 `x1` 形状相同的布尔数组，当\
  \ `x1` 中的元素存在于 `x2` 中时对应位置为 True，否则为 False。列表 E.4 展示了求解 PDE 问题的函数 `assemblingPDE()`\
  \ 代码。这里使用 `spsolve()` 函数来求解稀疏矩阵线性方程组。\n\n![](img/compE_5.jpg)\n\n## E.3 求解示例问题\n\
