    \ directive in all the examples. This macro is used to include a header file into\
    \ the source file.\n\nThere are number of preprocessor directives supported by\
    \ C++ like #include, #define, #if, #else, #line. Let us see important directives\
    \ –\n\nThe define Preprocessor\n\nThe define preprocessor creates symbolic constants.\
    \ The symbolic constant is called a macro and the general form of the directive\
    \ is – #define macro-name replacement-text\n\nWhen this line appears in a file,\
    \ all subsequent occurrences of macro in that file will be replaced by replacement-text\
    \ before the program is compiled. For example –\n\n```\n#include <iostream>\n\
    using namespace std;\n\n#define PI 3.14159\n\nint main () {\n    cout << \"Value\
    \ of PI:\" << PI << endl;\n\n    return 0;\n}\n```\n\nNow, let us do the preprocessing\
