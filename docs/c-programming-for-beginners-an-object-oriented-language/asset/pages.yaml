  md: '# C++ Signal Handling


    Signals are the interrupts delivered to a process by the operating system which
    can terminate a program prematurely. You can generate interrupts by pressing Ctrl+C
    on a UNIX, LINUX, Mac OS X or Windows system.


    There are signals which can not be caught by the program but there is a following
    list of signals which can catch in your program and can take appropriate actions
    based on the signal. These signals are defined in C++ header file <csignal>.


    | Sr.No | Signal & Description |

    | --- | --- |

    | 1 | SIGABRT Abnormal termination of the program, such as a call to abort. |

    | 2 | SIGFPE An erroneous arithmetic operation, such as a divide by zero or an
    operation resulting in overflow. |

    | 3 | SIGILL Detection of an illegal instruction. |

    | 4 | SIGINT Receipt of an interactive attention signal. |

    | 5 | SIGSEGV An invalid access to storage. |

    | 6 | SIGTERM A termination request sent to the program. |


    The signal() Function'
