  md: '# Data Abstraction in C++


    Data abstraction refers to providing only essential information to the outside
    world and hiding its background details, i.e., to represent the needed information
    in program without presenting the details.


    Data abstraction is a programming (and design) technique that relies on the separation
    of interface and implementation.


    Let''s take one real life example of a TV, which you can turn on and off, change
    the channel, adjust the volume, and add external components such as speakers,
    VCRs, and DVD players, BUT you do not know how it receives signals over the air
    through a cable, how it translates them, and finally displays them on the screen.


    Thus, we can say a television clearly separates its internal implementation from
    its external interface and you can play with its interfaces like the power button,
    channel changer, and volume control without having any knowledge of its internals.


    In C++, classes provides great level of data abstraction. They provide sufficient
    public methods to the outside world to play with the functionality of the object
    and to manipulate object data, i.e., state without actually knowing how class
    has been implemented internally.


    For example, your program can make a call to the sort() function without knowing
    what the algorithm actually uses to sort the given values. In fact, the underlying
    implementation of the sorting functionality could change between releases of the
    library, and as long as the interface stays the same, your function call still
    work.


    In C++, we use classes to define our abstract data types (ADT). You can use the
    cout object of class o to stream data to standard output like this –


    ```

    #include <iostream>

    using namespace std;


    int main() {

    ```'
