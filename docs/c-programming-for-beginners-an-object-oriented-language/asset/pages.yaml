    ```


    Here, you don''t need to understand how cout displays the text on the user''s
    screen. You need to only know the public interface and the underlying implementation
    of ''cout'' is free to change.


    # Access Labels Enforce Abstraction


    In C++, we use access labels to define the abstract interface to the class. A
    class may contain zero or more access labels –


    +   - Members defined with a public label are accessible to all parts of the program.
    The data-abstraction view of a type is defined by its public members.


    +   - Members defined with a private label are not accessible to code that uses
    the class. The private sections hide the implementation from code that uses the
    type.


    There are no restrictions on how often an access label may appear. Each access
    label specifies the access level of the succeeding member definitions. The specified
    access level remains in effect until the next access label is encountered or the
    closing right brace of the class body is seen.


    # Benefits of Data Abstraction


    Data abstraction provides two important advantages –


    +   - Class internals are protected from inadvertent user-level errors, which
    might corrupt the state of the object.


    +   - The class implementation may evolve over time in response to changing requirements
    or bug reports without requiring change in user-level code.


    By defining data members only in the private section of the class, the class author
    is free to make changes in the data. If the implementation changes, only the class
    code needs to be examined to see what affect the change may have. If data is public,
    then any function that directly accesses the data members of the old representation
    might be broken.


    # Data Abstraction Example'
