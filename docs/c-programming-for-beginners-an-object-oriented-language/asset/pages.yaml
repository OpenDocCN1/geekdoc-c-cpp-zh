  md: '# C++ Constants/Literals


    Constants refer to fixed values that the program may not alter and they are called
    literals.


    Constants can be any of the basic data types and can be divided into Integer Numerals,
    Floating-Point Numerals, Characters, Strings and Boolean Values.


    Again, constants are treated just like regular variables except that their values
    cannot be modified after their definition.


    Integer Literals


    An integer literal can be a decimal, octal, or hexadecimal constant. A prefix
    specifies the base or radix: 0x or 0X for hexadecimal, 0 for octal, and nothing
    for decimal.


    An integer literal can also have a suffix that is a combination of U and L, for
    unsigned and long, respectively. The suffix can be uppercase or lowercase and
    can be in any order.


    Here are some examples of integer literals –


    ```

    212      // Legal

    215u     // Legal

    0xFeeL // Legal

    078      // Illegal: 8 is not an octal

    032UU   // Illegal: cannot repeat a suffix

    ```


    Following are other examples of various types of Integer literals –


    ```

    85       // decimal

    0213     // octal

    0x4b     // hexadecimal

    30       // int

    30u      // unsigned int

    301      // long

    30ul     // unsigned long

    ```


    Floating-point Literals


    A floating-point literal has an integer part, a decimal point, a fractional part,
    and an exponent part. You can represent floating point literals either in decimal
    form or exponential form.'
