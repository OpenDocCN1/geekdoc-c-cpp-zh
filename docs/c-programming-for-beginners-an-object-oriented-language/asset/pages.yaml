  md: "# C++ Overloading (Operator and Function)\n\nC++ allows you to specify more\
    \ than one definition for a function name or an operator in the same scope, which\
    \ is called function overloading and operator overloading respectively.\n\nAn\
    \ overloaded declaration is a declaration that is declared with the same name\
    \ as the same scope, except that both declarations have different arguments and\
    \ obviously different definition (implementation).\n\nWhen you call an overloaded\
    \ function or operator, the compiler determines the most appropriate definition\
    \ to use, by comparing the argument types you have used to call the function or\
    \ operator with the parameter types specified in the definitions. The process\
    \ of selecting the most appropriate overloaded function or operator is called\
    \ overload resolution.\n\nFunction Overloading in C++\n\nYou can have multiple\
    \ definitions for the same function name in the same scope. The definition of\
    \ the function must differ from each other by the types and/or the number of arguments\
    \ in the argument list. You cannot overload function declarations that differ\
    \ only by return type.\n\nFollowing is the example where same function print()\
    \ is being used to print different data types –\n\n![](img/e2949dced8a6f4af100c418c26bfd2dc_108_0.png)\n\
    \n```\n#include <iostream>\nusing namespace std;\nclass printData {\npublic:\n\
    \    void print(int i) {\n        cout << \"Printing int: \" << i << endl;\n \
    \   }\n    void print(double f) {\n        cout << \"Printing float: \" << f <<\
    \ endl;\n    }\n    void print(char* c) {\n        cout << \"Printing character:\
    \ \" << c << endl;\n    }\n}\n```"
