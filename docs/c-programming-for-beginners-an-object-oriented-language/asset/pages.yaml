    they live in different area or their mother''s or father''s name, etc.


    Same situation can arise in your C++ applications. For example, you might be writing
    code that has a function xyz() and there is another library available which is
    also having function xyz(). Now the compiler has no way of knowing which version
    of xyz() you are referring to your code.


    A namespace is designed to overcome this difficulty and is used as additional
    information to differentiate similar functions, classes, variables etc. with the
    same name available in different libraries. Using namespace, you can define the
    context in which names are defined. In essence, a namespace defines a scope.


