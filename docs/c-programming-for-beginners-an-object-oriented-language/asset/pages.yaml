    \ format of the file being returned.\nExample is Content-type:text/html. |\n|\
    \ 2 | **Expires: Date**\nThe date information becomes invalid. This should be\
    \ used\by the browser to decide when a page needs to be refreshed. A\nvalid date\
    \ string should be in the format 01 Jan 1998 12:00:00\nGMT. |\n| 3 | **Location:\
    \ URL**\nThe URL that should be returned instead of the URL requested?\nYou can\
