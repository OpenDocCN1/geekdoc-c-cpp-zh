  md: '# C++ Environment Setup


    Local Environment Setup


    If you are still willing to set up your environment for C++, you need to have
    the following two softwares on your computer.


    # Text Editor


    This will be used to type your program. Examples of few editors include Windows
    Notepad, OS Edit command, Brief, Epsilon, EMACS, and vim or vi.


    Name and version of text editor can vary on different operating systems. For example,
    Notepad will be used on Windows and vim or vi can be used on windows as well as
    Linux, or UNIX.


    The files you create with your editor are called source files and for C++ they
    are typically named with the extension .cpp, .cp, or .c.


    A text editor should be in place to start your C++ programming.


    # C++ Compiler


    This is an actual C++ compiler, which will be used to compile your source code
    into final executable program.


    Most C++ compilers don''t care what extension you give to your source code, but
    if you don''t specify otherwise, many will use .cpp by default.


    Most frequently used and free available compiler is GNU C/C++ compiler, otherwise
    you can have compilers either from HP or Solaris if you have the respective Operating
    Systems.


    Installing GNU C/C++ Compiler


    # UNIX/Linux Installation


    If you are using Linux or UNIX then check whether GCC is installed on your system
    by entering the following command from the command line – $ g++ -v


    ```

    $ g++ -v

    ```


    If you have installed GCC, then it should print a message such as the following
    –'
