  md: '# C++ Arrays


    C++ provides a data structure, **the array**, which stores a fixed-size sequential
    collection of elements of the same type. An array is used to store a collection
    of data, but it is often more useful to think of an array as a collection of variables
    of the same type.


    Instead of declaring individual variables, such as number0, number1, ..., and
    number99, you declare one array variable as numbers and use numbers[0], numbers[1],
    and ..., numbers[99] to represent individual variables. A specific element in
    an array is accessed by an index.


    All arrays consist of contiguous memory locations. The lowest address corresponds
    to the first element and the highest address to the last element.


    # Declaring Arrays


    To declare an array in C++, the programmer specifies the type of the elements
    and the number of elements required by an array as follows – type arrayName [
    arraySize ];


    This is called a single-dimension array. The **arraySize** must be an integer
    constant greater than zero and **type** can be any valid C++ data type. For example,
    to declare a 10-element array called balance of type double, use this statement
    –


    ```

    double balance[10];

    ```


    # Initializing Arrays


    You can initialize C++ array elements either by one or using a single statement
    as follows –


    ```

    double balance[5] = {1000.0, 2.0, 3.4, 17.0, 50.0};

    ```


    The number of values between braces { } can not be larger than the number of elements
    we declare for the array between square brackets [ ]. Following is an example
    to assign a single element of the array –


    If you omit the size of the array, an array just big enough to hold the initialization
    is created. Therefore, if you write –


    ```

    double balance[] = {1000.0, 2.0, 3.4, 17.0, 50.0};

    ```


    You will create exactly the same array as you did in the previous example.'
