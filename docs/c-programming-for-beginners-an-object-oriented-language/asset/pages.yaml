  md: "# C++ Preprocessor\n\nThe preprocessors are the directives, which give instructions\
    \ to the compiler to preprocess the information before actual compilation starts.\n\
    \nAll preprocessor directives begin with #, and only white-space characters appear\
    \ before a preprocessor directive on a line. Preprocessor directives are not C++\
