    # C++ 中的运算符优先级


    运算符优先级决定了表达式中项分组。某些运算符的优先级高于其他运算符；例如，乘法运算符的优先级高于加法运算符——


    例如 x = 7 + 3 * 2；在这里，x 被赋值为 13 而不是 20，因为运算符 * 的优先级高于 +，所以它先计算 3*2，然后加 7。


    在这里，优先级最高的运算符出现在表格顶部，优先级最低的运算符出现在底部。在表达式中，优先级较高的运算符将先执行。


