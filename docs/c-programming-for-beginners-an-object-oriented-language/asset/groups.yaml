    A storage class defines the scope (visibility) and life-time of variables and/or
    functions within a C++ Program. These specifiers precede the type that they modify.
    There are following storage classes, which can be used in a C++ Program


    +   * auto

    * register

    * static

    * extern

    * mutable


    The auto Storage Class


    The auto storage class is the default storage class for all local variables.


    ```

    {

    int mount;

    auto int month;

    }

    ```


    The example above defines two variables with the same storage class, auto can
    only be used within functions, i.e., local variables.


    The register Storage Class


    The register storage class is used to define local variables that should be stored
    in a register instead of RAM. This means that the variable has a maximum size
    equal to the register size (usually one word) and can''t have the unary ''&''
    operator applied to it (as it does not have a memory location).


    ```

    {

    register int miles;

    }

    ```


    The register should only be used for variables that require quick access such
    as counters. It should also be noted that defining ''register'' does not mean
    that the variable will be stored in a register. It means that it MIGHT be stored
    in a register depending on hardware and implementation restrictions.


    The static Storage Class


    The static storage class instructs the compiler to keep a local variable in existence
    during the life-time of the program instead of creating and'
