- md: "\nBox Box1; // Declare Box1 of type Box\nBox Box2; // Declare Box2 of type\
    \ Box\n\nBoth of the objects Box1 and Box2 will have their own copy of data members.\n\
    \n## Accessing the Data Members\n\nThe public data members of objects of a class\
    \ can be accessed using the direct member access operator (.). Let us try the\
    \ following example to make the things clear –\n\n```cpp\n#include <iostream>\n\
    \nusing namespace std;\n\nclass Box {\npublic:\n    double length; // Length of\
    \ a box\n    double breadth; // Breadth of a box\n    double height; // Height\
    \ of a box\n};\n\nint main() {\n    Box Box1; // Declare Box1 of type Box\n  \
    \  Box Box2; // Declare Box2 of type Box\n    double volume = 0.0; // Store the\
    \ volume of a box here\n\n    // box 1 specification\n    Box1.height = 5.0;\n\
    \    Box1.length = 6.0;\n    Box1.breadth = 7.0;\n\n    // box 2 specification\n\
    \    Box2.height = 10.0;\n    Box2.length = 12.0;\n    Box2.breadth = 13.0;\n\n\
    \    // volume of box 1\n    volume = Box1.height * Box1.length * Box1.breadth;\n\
    \    cout << \"Volume of Box1 : \" << volume << endl;\n\n    // volume of box\
    \ 2\n    volume = Box2.height * Box2.length * Box2.breadth;\n    cout << \"Volume\
    \ of Box2 : \" << volume << endl;\n    return 0;\n}\n```\n\nWhen the above code\
    \ is compiled and executed, it produces the following result -\n\nVolume of Box1\
    \ : 210\nVolume of Box2 : 1560\n\nIt is important to note that private and protected\
    \ members can not be accessed directly using direct member access operator (.).\
    \ We will learn how private and protected members can be accessed.\n\n## Classes\
    \ and Objects in Detail\n\nSo far, you have got very basic idea about C++ Classes\
    \ and Objects. We are further interesting concepts related to C++ Classes and\
    \ Objects which we will discuss in various sub-sections listed below –\n\n| Sr.No\
    \ | Concept & Description |\n| :--- | :--- |\n| 1 | Class Member Functions: A\
    \ member of a class is a function that has its definition or its prototype within\
    \ the class definition like any other variable. |\n| 2 | Class Access Modifiers:\
    \ A class member can be defined as public, private or protected. By default members\
    \ would be assumed as private. |\n| 3 | Constructor & Destructor: A class constructor\
    \ is a special function in a class that is called when a new object of the class\
    \ is created. A destructor is also a special function which is called when de-facto\
    \ object is deleted. |\n| 4 | Copy Constructor: The copy constructor is a constructor\
    \ which creates an object by initializing it with an object of the same class,\
    \ which has been created previously. |\n| 5 | Friend Functions: A friend function\
    \ is permitted full access to private and protected members of a class. |\n| 6\
    \ | Inline Functions: With an inline function, the compiler tries to expand the\
    \ code in the body of the function in place of a call to the function. |\n| 7\
    \ | this Pointer: Every object has a special pointer this which points to the\
    \ object itself. |\n| 8 | Pointer to C++ Classes: A pointer to a class is done\
    \ exactly the same way a pointer to a structure is. In fact a class is really\
    \ just a structure with functions in it. |\n| 9 | Static Members of a Class: Both\
    \ data members and function members of a class can be declared as static. |\n\n\
    ## C++ Inheritance\n\nOne of the most important concepts in object-oriented programming\
    \ is that of inheritance. Inheritance allows us to define a class in terms of\
    \ another class, which makes it easier to create and maintain an application.\
    \ This also provides an opportunity to reuse the code functionality and fast implementation\
    \ time.\n\nWhen creating a class, instead of writing completely new data members\
    \ member functions, the programmer can designate that the new class should inherit\
    \ the members of an existing class. This existing class is called the base class,\
    \ and the new class is referred to as the derived class.\n\nThe idea of inheritance\
    \ implements the is-a relationship. For example, mammal IS-A animal, dog IS-A\
    \ mammal hence dog IS-A animal as well as so on.\n\n## Base and Derived Classes\n\
    \nA class can be derived from more than one classes, which means it can inherit\
    \ data and functions from multiple base classes. To define a derived class, we\
    \ use a class derivation list to specify the base class(es). A class derivation\
    \ list names one or more base classes and has the form –\n\nderived-class: access-specifier\
    \ base-class\n\nWhere access-specifier is one of public, protected, or private,\
    \ and base-class is the name of a previously defined class. If the access-specifier\
    \ is not used, then it is by the default.\n\nConsider a base class Shape and its\
    \ derived class Rectangle as follows –\n\n```cpp\n#include <iostream>\n\nusing\
    \ namespace std;\n\n// Base class\nclass Shape {\npublic:\n    void setWidth(int\
    \ w) {\n        width = w;\n    }\n    void setHeight(int h) {\n        height\
    \ = h;\n    }\n\nprotected:\n    int width;\n    int height;\n};\n\n// Derived\
    \ class\nclass Rectangle: public Shape {\npublic:\n    int getArea() {\n     \
    \   return (width * height);\n    }\n};\n\nint main() {\n    Rectangle Rect;\n\
    \    Rect.setWidth(5);\n    Rect.setHeight(7);\n\n    // Print the area of the\
    \ object.\n    cout << \"Total area: \" << Rect.getArea() << endl;\n\n    return\
    \ 0;\n}\n```\n\n## Access Control and Inheritance\n\nA derived class can access\
    \ all non-private members of its base class. Thus base-class private members should\
    \ not be accessible. We can summarize the different access types according to\
    \ who can access them:\n\n| Access | public | protected | private |\n| :--- |\
    \ :--- | :--- | :--- |\n| Same class | yes | yes | yes |\n| Derived classes |\
    \ yes | yes | no |\n| Outside classes | yes | no | no |\n\n- Constructors, destructors\
    \ and copy constructors of the base class.\n- Overloaded operators of the base\
    \ class.\n- Friend functions of the base class.\n\n## Type of Inheritance\n\n\
    When deriving a class from a base class, the base class may be inherited through\
    \ **public**, **protected** or **private** inheritance. The type of inheritance\
    \ is specified by the access-specifier as explained above. We hardly use **protected**\
    \ or **private** inheritance, but **public** inheritance is commonly used. While\
    \ using different type of inheritance, following rules are –\n\n- **Public Inheritance**:\
    \ When deriving a class from a **public** base class, **public** members of the\
    \ base class become **public** members of the derived class and **protected**\
    \ members of the base class become **protected** members of the derived class.\
    \ A base class's **private** members are never accessible directly from a derived\
    \ class, but can be accessed through calls to the **public** and **protected**\
    \ members of the base class.\n- **Protected Inheritance**: When deriving from\
    \ a **protected** base class, **public** and **protected** members of the base\
    \ class become **protected** members of the derived class.\n- **Private Inheritance**:\
    \ When deriving from a **private** base class, **public** and **protected** members\
    \ of the base class become **private** members of the derived class.\n\n## Multiple\
    \ Inheritance\n\nA C++ class can inherit members from more than one class and\
    \ here is the extended syntax –\n\nclass derived-class: access baseA, access baseB\n\
    \nWhere access is one of **public, protected, private** and would be given for\
    \ every base class and they will be separated by comma as shown above. Let us\
    \ try the following example –\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n// Base class Shape\nclass Shape {\npublic:\n    void setWidth(int w)\
    \ {\n        width = w;\n    }\n    void setHeight(int h) {\n        height =\
    \ h;\n    }\nprotected:\n    int width;\n    int height;\n};\n// Base class PaintCost\n\
    class PaintCost {\npublic:\n    int getCost(int area) {\n        return area *\
    \ 70;\n    }\n};\n// Derived class\nclass Rectangle: public Shape, public PaintCost\
    \ {\npublic:\n    int getArea() {\n        return (width * height);\n    }\n};\n\
    \nint main() {\n    Rectangle Rect;\n    Rect.setWidth(5);\n    Rect.setHeight(7);\n\
    \n    cout << \"Total area: \" << Rect.getArea() << endl;\n    cout << \"Total\
    \ cost: \" << Rect.getCost(Rect.getArea()) << endl;\n\n    return 0;\n}\n```\n"
