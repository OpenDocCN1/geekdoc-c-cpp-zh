    \ class area:\" <<endl;\n        return 0;\n    }\n}\n```\n\nAfter this slight\
    \ modification, when the previous example code is compiled and executed, it produces\
    \ the following result –\n\nRectangle class area\nTriangle class area\n\nThis\
    \ time, the compiler looks at the contents of the pointer instead of its type.\
    \ Hence, since addresses of objects of tri and rec classes are stored in *shape\
    \ the respective area() function is called.\n\nAs you can see, each of the child\
    \ classes has a separate implementation for the function area(). This is how polymorphism\
    \ is generally used. You have different classes with a function of the same name,\
    \ and even the same parameters, but with different implementations.\n\n## Virtual\
    \ Function\n\nA virtual function is a function in a base class that is declared\
    \ using the keyword virtual. Defining in a base class a virtual function, with\
    \ another version in a derived class, signals to the compiler that we don't want\
    \ static linkage for this function.\n\nWhat we do want is the selection of the\
    \ function to be called at any given point in the program to be based on the kind\
    \ of object for which it is called. This sort of operation is referred to as dynamic\
    \ linkage, or late binding.\n\n### Pure Virtual Functions\n\nIt is possible that\
    \ you want to include a virtual function in a base class that it may be redefined\
    \ in a derived class to suit the objects of that class, but that there is no meaningful\
    \ definition you could give for the function in the base class.\n\nWe can change\
    \ the virtual function area() in the base class to the following – class Shape\
    \ {\n\n```cpp\nprotected:\nint width, height;\n\npublic:\nShape(int a = 0, int\
    \ b = 0) {\n    width = a;\n    height = b;\n}\n\n// pure virtual function\nvirtual\
    \ int area() = 0;\n};\n```\n\nThe = 0 tells the compiler that the function has\
    \ no body and above virtual function will be called pure virtual function.\n\n\
    ## Data Abstraction in C++\n\nData abstraction refers to providing only essential\
    \ information to the outside world and hiding its background details, i.e., to\
    \ represent the needed information in program without presenting the details.\n\
    \nData abstraction is a programming (and design) technique that relies on the\
    \ separation of interface and implementation.\n\nLet's take one real life example\
    \ of a TV, which you can turn on and off, change the channel, adjust the volume,\
    \ and add external components such as speakers, VCRs, and DVD players, BUT you\
    \ do not know how it receives signals over the air through a cable, how it translates\
    \ them, and finally displays them on the screen.\n\nThus, we can say a television\
    \ clearly separates its internal implementation from its external interface and\
    \ you can play with its interfaces like the power button, channel changer, and\
    \ volume control without having any knowledge of its internals.\n\nIn C++, classes\
    \ provides great level of data abstraction. They provide sufficient public methods\
    \ to the outside world to play with the functionality of the object and to manipulate\
    \ object data, i.e., state without actually knowing how class has been implemented\
    \ internally.\n\nFor example, your program can make a call to the sort() function\
    \ without knowing what the algorithm actually uses to sort the given values. In\
    \ fact, the underlying implementation of the sorting functionality could change\
    \ between releases of the library, and as long as the interface stays the same,\
    \ your function call still work.\n\nIn C++, we use classes to define our abstract\
    \ data types (ADT). You can use the cout object of class o to stream data to standard\
    \ output like this –\n\n```cpp\n#include <iostream>\nusing namespace std;\n\n\
    int main() {\n```\n\n```cpp\ncout << \"Hello C++\" << endl;\nreturn 0;\n}\n```\n\
    \nHere, you don't need to understand how cout displays the text on the user's\
    \ screen. You need to only know the public interface and the underlying implementation\
    \ of 'cout' is free to change.\n\n## Access Labels Enforce Abstraction\n\nIn C++,\
    \ we use access labels to define the abstract interface to the class. A class\
    \ may contain zero or more access labels –\n\n- Members defined with a public\
    \ label are accessible to all parts of the program. The data-abstraction view\
    \ of a type is defined by its public members.\n\n- Members defined with a private\
    \ label are not accessible to code that uses the class. The private sections hide\
    \ the implementation from code that uses the type.\n\nThere are no restrictions\
    \ on how often an access label may appear. Each access label specifies the access\
    \ level of the succeeding member definitions. The specified access level remains\
    \ in effect until the next access label is encountered or the closing right brace\
    \ of the class body is seen.\n\n## Benefits of Data Abstraction\n\nData abstraction\
    \ provides two important advantages –\n\n- Class internals are protected from\
    \ inadvertent user-level errors, which might corrupt the state of the object.\n\
    \n- The class implementation may evolve over time in response to changing requirements\
    \ or bug reports without requiring change in user-level code.\n\nBy defining data\
    \ members only in the private section of the class, the class author is free to\
    \ make changes in the data. If the implementation changes, only the class code\
    \ needs to be examined to see.\n\n## Datastraction Example\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nclass Adder {\npublic:\n    // constructor\n\
    \    Adder(int i = 0) {\n        total = i;\n    }\n\n    // interface to outside\
    \ world\n    void addNum(int number) {\n        total += number;\n    }\n\n  \
    \  // interface to outside world\n    int getTotal() {\n        return total;\n\
    \    }\n\nprivate:\n    // hidden data from outside world\n    int total;\n};\n\
    \nint main() {\n    Adder a;\n\n    a.addNum(10);\n    a.addNum(20);\n    a.addNum(30);\n\
    \n    cout << \"Total \" << a.getTotal() << endl;\n    return 0;\n}\n```\n\nWhen\
    \ the above code is compiled and executed, it produces the following result –\n\
    \nTotal 60\n\nAbove class adds numbers together, and returns the sum. The public\
    \ members - addNum and getTotal are the interfaces to the outside world and user\
    \ needs to know them. The private member total is som the user doesn't need to\
    \ know about, but is needed for the class to operate properly.\n\n## Designing\
    \ Strategy\n\nAbstraction separates code into interface and implementation. So\
    \ while designing your component, you must keep interface independent of implementation\
    \ so that if you change implementation then interface would remain intact.\n\n\
    In this case whatever programs are using these interfaces, they would not be impacted\
    \ and would just need a recompilation with the latest implementation.\n[/content]\n"
  mdcn: "\n这被称为函数调用的静态解析，或静态链接 - 函数调用在程序执行之前就已经确定。这有时被称为早期绑定，因为 `area()` 函数是在程序编译期间设置的。\n\
    \n现在，让我们对程序进行轻微修改，在 `Shape` 类的 `area()` 声明之前加上 `virtual` 关键字，使其看起来如下所示：\n\n```cpp\n\
    class Shape {\nprotected:\n    int width, height;\n\npublic:\n    Shape(int a\
    \ = 0, int b = 0) {\n        width = a;\n        height = b;\n    }\n    virtual\
    \ int area() {\n        cout << \"Parent class area:\" <<endl;\n        return\
    \ 0;\n    }\n}\n```\n\n在此处修改之后，当之前的示例代码被编译并执行时，它产生如下结果：\n\nRectangle class area\n\
    Triangle class area\n\n这一次，编译器查看的是指针的内容而不是它的类型。因此，由于 `tri` 和 `rec` 类对象的地址存储在 *shape*\
    \ 中，将调用相应的 `area()` 函数。\n\n如你所见，每个子类对 `area()` 函数都有独立的实现。这通常是多态的使用方式。你拥有具有相同名称函数、甚至相同参数的不同类，但具有不同的实现。\n\
    \n## 虚函数\n\n虚函数是基类中用使用 `virtual` 关键字声明的函数。在基类中定义一个虚函数，并在派生类中定义另一个版本，是告诉编译器我们不希望该函数使用静态链接。\n\
    \n我们真正想要的是，在程序的任何给定点，调用的函数选择基于被调用的对象类型。这种操作被称为动态链接，或晚期绑定。\n\n### 纯虚函数\n\n你可能希望在基类中包含一个虚函数，它可以在派生类中被重定义以适应该类的对象，但在基类中无法为该函数提供有意义的定义。\n\
    \n我们可以将基类中的虚函数 `area()` 修改为如下：`class Shape {`\n\n```cpp\nprotected:\nint width,\
    \ height;\n\npublic:\nShape(int a = 0, int b = 0) {\n    width = a;\n    height\
    \ = b;\n}\n\n// 纯虚函数\nvirtual int area() = 0;\n};\n```\n\n`= 0` 告诉编译器该函数没有函数体，上面的虚函数将被视为纯虚函数。\n\
    \n## C++ 中的数据抽象\n\n数据抽象是指向外部世界提供本质信息，并隐藏其背景细节，即在程序中表示所需的信息而不展示细节。\n\n数据抽象是一种依赖于接口与实现分离的编程（及设计）技术。\n\
    \n让我们以电视机作为一个现实生活的例子，你可以开启和关闭、切换频道、调整音量并添加外部组件（如扬声器、VCR 和 DVD 器），但你不知道它是如何通过电缆从空中接收信号的，它是如何翻译这些信号的，最后是如何显示在屏幕上的。\n\
    \n因此，我们可以说电视清楚地将其内部实现与其外部接口分离，你可以操作电源按钮、频道调节器和音量控制等接口，而无需了解其内部结构。\n\n在 C++ 中，类提供了很高级级的数据抽象。它们为外部世界提供了足够的公共方法来操作对象的功能并操纵对象数据（即状态），而无需实际上知道类在内部是如何实现的。\n\
    \n例如，你的程序可以调用 `sort()` 函数，而无需知道算法实际上使用什么来对给定值进行排序。事实上，排序功能的底层实现可以在库的不同版本之间发生变化，只要接口保持不变，你的函数调用仍然有效。\n\
    \n在 C++ 中，我们使用类来定义我们的抽象数据类型 (ADT)。你可以使用类 `o` 的 `cout` 对象将数据流到标准输出，如下：\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main() {\n```\n\n```cpp\ncout\
    \ << \"Hello C++\" << endl;\nreturn 0;\n}\n```\n\n在这里，你不需要理解 `cout` 如何在用户的屏幕上显示文本。你只需要知道公共接口，而\
    \ `cout` 的底层实现是可以更改的。\n\n## 访问标签强制抽象\n\n在 C++ 中，我们使用访问标签（access labels）来定义类的抽象接口。一个类可以包含零或多个访问标签：\n\
    \n- 使用 `public` 标签定义的成员对程序的所有部分都是可访问的。类型的数据抽象视图由其公共成员定义。\n\n- 使用 `private` 标签定义的成员对使用该类的代码是不可见的。私有部分从使用该类型的代码隐藏了实现。\n\
    \n对访问标签出现的次数没有限制。每个访问标签都指定后续成员定义的访问级别。指定的访问级别将一直有效，直到遇到下一个访问标签或看到类体的结束右括号。\n\n\
    ## 数据抽象的优势\n\n数据抽象提供了两个重要优势：\n\n- 类内部受到不受无意的用户级错误的保护，这些错误可能会破坏对象的状态。\n\n- 类实现可以随着时间的推移响应变化的需求或错误报告而演进，而不需要更改用户级代码。\n\
    \n通过仅在类的私有部分定义数据成员，类作者可以自由地更改数据。如果实现发生变化，只需要检查类代码即可。\n\n## 数据抽象示例\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nclass Adder {\npublic:\n    // 构造函数\n\
    \    Adder(int i = 0) {\n        total = i;\n    }\n\n    // 外部世界的接口\n    void\
    \ addNum(int number) {\n        total += number;\n    }\n\n    // 外部世界的接口\n  \
    \  int getTotal() {\n        return total;\n    }\n\nprivate:\n    // 向外部世界隐藏的数据\n\
    \    int total;\n};\n\nint main() {\n    Adder a;\n\n    a.addNum(10);\n    a.addNum(20);\n\
    \    a.addNum(30);\n\n    cout << \"Total \" << a.getTotal() << endl;\n    return\
    \ 0;\n}\n```\n\n当上述代码被编译并执行时，它产生如下结果：\n\nTotal 60\n\n上面的类将数字相加并返回和。公共成员 `addNum`\
    \ 和 `getTotal` 是外部世界的接口，用户需要知道它们。私有成员 `total` 是用户不需要知道的，但对于类的正常运行是所需要的。\n\n##\
    \ 设计策略\n\n抽象将代码分为接口和实现。因此，在设计组件时，你必须保持接口与实现独立，这样当你更改实现时，接口将保持完整。\n\n在这种情况下，使用这些接口的任何程序都不会受到影响，只需要使用最新的实现重新编译即可。\n"
