    # C++ Loop Types


    There may be a situation, when you need to execute a block of code several number
    of times. In general, statements are executed sequentially: The first statement
    in a function is executed first, followed by the second, and so on.

    Programming languages provide various control structures that allow for more complicated
    execution paths.


    A loop statement allows us to execute a statement or group of statements multiple
    times and following is the general from of a loop statement in the programming
    languages –


    ![](img/e2949dced8a6f4af100c418c26bfd2dc_52_0.png)


    C++ programming language provides the following type of loops to handle looping
    requirements.


    | Sr.No | Loop Type & Description |

    |---|---||

    | 1 | while loop: Repeats a statement or group of statements while a given condition
    is true. It tests the condition before executing the loop body. |'
