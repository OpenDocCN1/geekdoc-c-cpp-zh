    # C++ Strings


    C++ provides following two types of string representations –


    +   - The C-style character string.

    - The string class type introduced with Standard C++.


    The C-Style Character String

    The C-style string originated within the C language and continues to be supported
    within C++. This string is actually a one-dimensional array of characters which
    is terminated by a null character ''\0''. Thus a null-terminated string contains
    the characters followed by a null.


    The following declaration and initialization create a string consisting of the
    word "Hello". To hold the null character at the end of the array, the size of
    the character array containing the string is one than the number of characters
    in the word "Hello".


    ```

    char greeting[6] = {''H'', ''e'', ''l'', ''l'', ''o'', ''\0''};

    ```


