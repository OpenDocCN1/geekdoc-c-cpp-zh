    C++ also allows to define various other types of variables, which we will cover
    in subsequent chapters like **Enumeration**, **Pointer**, **Array**, **Reference**,
    **Data structures**, and **Classes.**


    Following section will cover how to define, declare and use various types of variables.


    Variable Definition in C++


    A variable definition tells the compiler where and how much storage to create
    for the variable. A variable definition specifies a data type, and contains a
    list of one or more variables of that type as – `variable_list`;


    Here, **type** must be a valid C++ data type including char, **w_char**, int,
    float, double, bool or any user-defined object, etc., and **variable_list** may
    consist of one or more identifier names separated by commas. Some valid declarations
    are shown here –


    ```

    int i, j, k;

    char c, ch;

    float f, salary;

    double d;

    ```


    The line **int i, j, k;** both declares and defines the variables i, j and k;
    which instructs the compiler to create variables named i, j and k of type int.


    Variables can be initialized (assigned an initial value) in their declaration.
    The initializer consists of an equal sign followed by a constant expression as
    –


    type variable_name = value;


    Some examples are –


    ```

    extern d = 3, f = 5; // declaration of d and f.

    int d = 3, f = 5;      // definition and initializing d and f.

    byte z = 22;         // definition and initializes z.

