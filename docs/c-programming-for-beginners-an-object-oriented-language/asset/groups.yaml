- md: "\nfile and you call that function in another file. In such case, you should\
    \ declare the function at the top of the file calling the function.\n\n## Calling\
    \ a Function\n\nWhile creating a C++ function, you give a definition of what the\
    \ function has to do. To use a function, you will have to call or invoke that\
    \ function.\n\nWhen a program calls a function, program control is transferred\
    \ to the called function. A called function performs defined task and when it's\
    \ return statement is executed or when its function-ending closing brace is reached,\
    \ it returns program control back to the main program.\n\nTo call a function,\
    \ you simply need to pass the required parameters along with function name, and\
    \ if returns a value, then you can store returned value. For example –\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\n// function declaration\nint max(int\
    \ num1, int num2);\n\nint main() {\n// local variable declaration:\nint a = 100;\n\
    int b = 200;\nint ret;\n\n// calling a function to get max value.\nret = max(a,\
    \ b);\ncout << \"Max value is : \" << ret << endl;\n\nreturn 0;\n}\n\n// function\
    \ returning the max between two numbers\nint max(int num1, int num2) {\n// local\
    \ variable declaration\nint result;\n\nif (num1 > num2)\n  result = num1;\nelse\n\
    \  result = num2;\n\nreturn result;\n}\n```\n\nI kept max() function along with\
    \ main() function and compiled the source code. While running final executable,\
    \ it would produce the following result -\n\nMax value is : 200\n\n## Function\
    \ Arguments\n\nIf a function is to use arguments, it must declare variables that\
    \ accept the values of the arguments. These variables are called the formal parameters\
    \ of the function.\n\nThe formal parameters behave like other local variables\
    \ inside the function and are created upon entry into the function and destroyed\
    \ upon exit. While calling a function, there are two ways that arguments can be\
    \ passed to a function -\n\n| Sr.No | Call Type & Description |\n| :--- | :---\
    \ |\n| 1 | Call by Value <br>This method copies the actual value of an argument\
    \ into the formal parameter of the function. In this case, changes made to the\
    \ parameter inside the function have no effect on the argument. |\n| 2 | Call\
    \ by Pointer <br>This method copies the address of an argument into the formal\
    \ parameter. Inside the function, the address is used to access the actual argument\
    \ used in the call. This means that changes made to the parameter affect the argument.\
    \ |\n\n## Call by Reference\n\nThis method copies the reference of an argument\
    \ into the formal parameter. Inside the function, the reference is used to access\
    \ the actual argument used in the call. This means that changes made to the parameter\
    \ affect the argument.\n\nBy default, C++ uses call by value to pass arguments.\
    \ In general, this means code within a function cannot alter the arguments used\
    \ while calling max() function used the same method.\n\n## Default Values for\
    \ Parameters\n\nWhen you define a function, you can specify a default value for\
    \ each of the last parameters. This value will be used if the corresponding argument\
    \ is left blank when calling to the function.\n\nThis is done by using the assignment\
    \ operator and assigning values for the arguments in the function definition.\
    \ If a value for parameter is not passed when the function is called, the default\
    \ given value is used, but if a value is specified, this default value is ignored\
    \ and the passed value is used instead. Consider the following example –\n\n![](img/e2949dced8a6f4af100c418c26bfd2dc_61_0.png)\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint sum(int a, int b = 20)\
    \ {\n    int result;\n    result = a + b;\n    return (result);\n}\nint main ()\
    \ {\n    // local variable declaration:\n    int a = 100;\n    int b = 200;\n\
    \    int result;\n    // calling a function to add the values.\n    result = sum(a,\
    \ b);\n    cout << \"Total value is :\" << result << endl;\n\n    // calling a\
    \ function again again as follows.\n    result = sum(a);\n    cout << \"Total\
    \ value is :\" << result << endl;\n\n    return 0;\n}\n```\n\nWhen the above code\
    \ is compiled and executed, it produces the following result –\n\nTotal value\
    \ is : 300\n\nTotal value is : 120\n\n## Numbers in C++\n\nNormally, when we work\
    \ with Numbers, we use primitive data types such as int, short, long, float and\
    \ double, etc. The number data types, their possible values and number ranges\
