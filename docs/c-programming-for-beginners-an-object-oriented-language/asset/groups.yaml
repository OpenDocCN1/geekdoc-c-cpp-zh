    # Operators in C++


    An operator is a symbol that tells the compiler to perform specific mathematical
    or logical manipulations. C++ is rich in built-in operators and provide the following
    types of operators –


    - Arithmetic Operators

    - Relational Operators

    - Logical Operators

    - Bitwise Operators

    - Assignment Operators

    - Misc Operators


    This chapter will examine the arithmetic, relational, logical, bitwise, assignment
    and other operators one by one.


    ### Arithmetic Operators


    There are following arithmetic operators supported by C++ language – Assume variable
    A holds 10 and variable B holds 20, then –


    Show Examples


    | Operator | Description | Example |

    | --- | --- | --- |

    | + | Adds two operands | A + B will give 30 |

    | - | Subtracts second operand from the first | A - B will give -10 |

    | * | Multiplies both operands | A * B will give 200 |

    | / | Divides numerator by denominator | B / A will give 2 |

    | % | Modulus Operator and remainder after an integer | B % A will give 0 |

    | Operator | Description | Example |

    | --- | --- | --- |

    | ++ | Increment operator, increases integer value by one | A++ will give 11 |

    | -- | Decrement operator, decreases integer value by one | A-- will give 9 |


    # Relational Operators


    There are following relational operators supported by C++ language

    Assume A holds 10 and variable B holds 20, then –


    Show Examples


    | Operator | Description | Example |

    | --- | --- | --- |

    | == | Checks if the values of two operands are equal or not, if yes then condition
    becomes true. | (A == B) is not true. |

    | != | Checks if the values of two operands are equal or not, if values are not
    equal then condition becomes true. | (A != B) is true. |

    | > | Checks if the value of left operand is greater than the value of right operand,
    if yes then condition becomes true. | (A > B) is not true. |

    | < | Checks if the value of left operand is less than the value of right operand,
    if yes then condition becomes true. | (A < B) is true. |

    | >= | Checks if the value of left operand is greater than or equal to the value
    of right operand, if yes condition becomes true. | (A >= B) is not true. |

    | <= | Checks if the value of left operand is less than or equal to the value
    of right operand, if yes condition becomes true. | (A <= B) is true. |


    # Logical Operators


    There are following logical operators supported by C++ language. Assume variable
    A holds 1 and variable B holds 0, then –


    Show Examples


    | Operator | Description | Example |

    | --- | --- | --- |

    | && | Called Logical AND operator. If both the operands are non-zero, then condition
    becomes true. | (A && B) is false. |

    | || | Called Logical OR Operator. If any of the two operands is non-zero, then
    condition becomes true. | (A || B) is true. |

    | ! | Called Logical NOT Operator. Use to reverses the logical state of its operand.
    If a condition is true, then Logical NOT operator will make false. | !(A && B)
    is true. |


    # Bitwise Operators


    Bitwise operator works on bits and perform bit-by-bit operation. The truth tables
    for &, |, and ^ are as follows –


    | p | q | p & q | p | q | p ^ q |

    | --- | --- | --- | --- | --- |

    | 0 | 0 | 0 | 0 | 0 |

    | 0 | 1 | 0 | 1 | 1 |

    | 1 | 1 | 1 | 1 | 0 |

    | 1 | 0 | 0 | 1 | 1 |


    Assume A = 10; and B = 20; now in binary format they will as follows –


    A = 0010

    B = 1010

    A&B = 0000

    A|B = 1010

    A^B = 1010

    ~A = 1101


    The Bitwise operators supported by C++ language are listed in the following table.


    Show Examples


    | Operator | Description | Example |

    | --- | --- | --- |

    | & | Binary AND Operator copies a bit to the result if exists in both operands.
    | (A & B) will give 0000 |

    | | | Binary OR Operator copies the bit if it exists in either operand. | (A |
    B) will give 1010 |

    | ^ | Binary XOR Operator copies the bit if it is set in one operand but not both.
    | (A ^ B) will give 1010 |

    | ~ | Binary Ones Complement Operator is unary and has the effect of ''flipping''
    bits due to signed number. | (~A) will give 1101 |

    | << | Binary Left Shift Operator. The left operands value is moved by the number
    of bits specified by the right operand. | A << 2 will give 1000 |

    | >> | Binary Right Shift Operator. The left operands value is moved by the number
    of bits specified by the right operand. | A >> 2 will give 0010 |


    # Assignment Operators


    There are following assignment operators supported by C++ language – Show Examples


    | Operator | Description | Example |

    | --- | --- | --- |

    | = | Simple assignment operator, Assigns values from right side operands to left
    operand. | C = A + B will assign value into C |

    | += | Add assignment operator, It adds right operand to the left operand and
    assign the result to left operand. | C += A is equivalent to C + A |

    | -= | Subtract assignment operator, It subtracts right operand from the left
    operand and assign the result to left operand. | C -= A is equivalent to C - A
    |

    | *= | Multiply assignment operator, It multiplies right operand with the left
    operand and assign the result to left operand. | C *= A is equivalent to C * A
    |

    | /= | Divide assignment operator, It divides left operand with the right operand
    and assign the result to left operand. | C /= A is equivalent to C / A |

    | %= | Modulus assignment operator, It takes modulus using two operands and assign
    the result to left operand. | C %= A is equivalent to C % A |

    | <<= | Left shift assignment operator. | C <<= 2 is same as C << 2 |

    | >>= | Right shift assignment operator. | C >>= 2 is same as C >> 2 |

    | &= | Bitwise AND assignment operator. | C &= 2 is same as C & 2 |

    | ^= | Bitwise exclusive OR assignment operator. | C ^= 2 is same as C ^ 2 |

    | |= | Bitwise inclusive OR assignment operator. | C |= 2 is same as C 2 |


    # Misc Operators


    The following table lists some other operators that C++ supports.


    | Sr.No | Operator & Description |

    | --- | --- |

    | 1 | **sizeof** sizeof operator returns the size of a variable. For example,
    sizeof(a), where ''a'' is integer, and will return 4. |

    | 2 | **Condition ? X : Y** Conditional operator (?). If Condition is true then
    it returns value of X otherwise returns value of Y. |

    | 3 | **,** Comma operator causes a sequence of operations to be performed. The
    value of the entire comma expression is the value of the last expression of the
    comma-separated list. |

    | 4 | **.(dot) and -> (arrow)** Member operators are used to reference individual
    members of classes, structures, and unions. |

    | 5 | **Cast** Casting operators convert one data type to another. For example,
    int(2.2000) would return 2. |

    | 6 | **&** Pointer operator & returns the address of a variable. For example
    &a; will give actual address of the variable. |

    | 7 | *** ** Pointer operator * is pointer to a variable. For example *var; will
    pointer to a variable var. |


    # Operators Precedence in C++


    Operator precedence determines the grouping of terms in an expression. Certain
    operators have higher precedence than others; for example, the multiplication
    operator has higher precedence than the addition operator -


    For example x = 7 + 3 * 2; here, x is assigned 13, not 20 because operator * has
    higher precedence than +, so it first gets multiplied by 3*2 and then adds to
    7.


    Here, operators with the highest precedence appear at the top of the table, those
    with the lowest appear at the bottom. Within an expression, higher precedence
    operators will be evaluated first.


    Show Examples


    | Category | Operator | Associativity |

    | --- | --- | --- |

    | Postfix | () [] -> . ++ -- | Left to right |

    | Unary | + - ! ~ ++ - (type)* & sizeof | Right to left |

