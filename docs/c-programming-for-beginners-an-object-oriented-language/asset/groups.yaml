- md: "\n# Understanding the Point\n\n# C++ Programming For Beginners\n\n# An Object\
    \ Oriented Language\n\n![](img/e2949dced8a6f4af100c418c26bfd2dc_0_0.png)\n\nHong\
    \ Lei\n\nCopyright © 2021 Hong Lei\n\nAll right reserved. No Part of this book\
    \ may be reproduced, stored in a retrieval system, or transmitted in any form\
    \ or means, electronics, mechanical, photocopying, recording or otherwise without\
    \ the prior permission or acknowledge of the author.\n\n# Contents\n\n- INTRODUCTION\n\
    - C++ Overview\n- C++ Environment Setup\n- C++ Basic Syntax\n- Comments in C++\n\
    - C++ Data Types\n- C++ Variable Types\n- Variable Scope in C++\n- C++ Constants/Literals\n\
    - C++ Modifier Classes\n- Storage Classes in C++\n- Operators in C++\n- C++ Loop\
    \ Types\n- C++ decision making statements\n- C++ Functions\n- Numbers in C++\n\
    - C++ Arrays\n- C++ Strings\n- C++ Pointers\n- C++ References\n- C++ Date and\
    \ Time\n- C++ Basic Input/Output\n- C++ Data Structures\n- C++ Classes and Objects\n\
    - C++ Inheritance\n- C++ Overloading (Operator and Function)\n- Polymorphism in\
    \ C++\n- Data Abstraction in C++\n- Data Encapsulation in C++\n- Interfaces in\
    \ C++ (Abstract Classes)\n- C++ Files and Streams\n- C++ Exception Handling\n\
    - C++ Dynamic Memory\n- Namespaces in C++\n- C++ Templates\n- C++ Preprocessor\n\
    - C++ Signal Handling\n- C++ Multithreading\n- C++ Web Programming\n- CONCLUSION\n\
    \n# INTRODUCTION\n\nC++ is a middle-level programming language developed by Bjarne\
    \ Stroustrup starting in 1979 at Bell Labs. C++ runs on a variety of platforms,\
    \ such as Windows, Mac OS, and the various versions of UNIX. This C++ tutorial\
    \ adopts a simple and practical approach to describe the concepts of C++ for beginners\
    \ to advanced software engineers.\n\n## Why to Learn C++\n\nC++ is a MUST for\
    \ students and working professionals to become a great Software Engineer. I will\
    \ list down some of the key advantages of learning C++:\n\n- C++ is very close\
    \ to hardware, so you get a chance to work at a low level which gives you lot\
    \ of control in terms of memory management, better performance and finally a robust\
    \ software development.\n\n- C++ programming gives you a clear understanding about\
    \ Object Oriented Programming. You will understand low level implementation of\
    \ polymorphism when you will implement virtual tables and virtual table pointers,\
    \ or dynamic type identification.\n\n- C++ is one of the every green programming\
    \ languages and loved by millions of software developers. If you are a great C++\
    \ programmer then you will never sit without work and more importantly you will\
    \ get highly paid for your work.\n\n- C++ is the most widely used programming\
    \ languages in application and system programming. So you can choose your area\
    \ of interest of software development.\n\n- C really teaches you the difference\
    \ between compiler, linker and loader, different data types, storage classes,\
    \ variable types their scopes etc.\n\nThere are 1000s of good reasons to learn\
    \ C++ Programming. But one thing for sure, to learn any programming language,\
    \ not only C++, you just need to code, and code and finally code until you become\
    \ expert.\n\n# Hello World using C++\n\nJust to give you a little excitement about\
    \ C++ programming, I'm going to give you a small conventional C++ Hello World\
    \ program, You can try it using Demo link\n\nC++ is a super set of C programming\
    \ with additional implementation of object-oriented concepts.\n\n```\n#include\
    \ <iostream>\nusing namespace std;\n\n// main() is where program execution begins.\n\
    int main() {\n    cout << \"Hello World\"; // prints Hello World\n    return 0;\n\
    }\n```\n\nThere are many C++ compilers available which you can use to compile\
    \ and run above mentioned program:\n\n- Apple C+. Xcode\n- Bloodshed Dev-C++\n\
    - Clang C++\n- Cygwin (GNU C++)\n- Mentor Graphics\n- MINGW - \"Minimalist GNU\
    \ for Windows\"\n- GNU CC source\n- IBM C++\n- Intel C++\n- Microsoft Visual C++\n\
    - Oracle C++\n- HP C++\n\nIt is really impossible to give a complete list of all\
    \ the available compilers. The C++ world is just too large and too much new is\
    \ happening.\n\n# Applications of C++ Programming\n\nAs mentioned before, C++\
    \ is one of the most widely used programming languages. It has it's presence in\
    \ almost every area of software development. I'm going to list few of them here:\n\
    \n- **Application Software Development** - C++ programming has been used in developing\
    \ almost all the major Operating Systems like Windows, Mac OSX and Linux. Apart\
    \ from the operating systems, the core part of many browsers like Mozilla Firefox\
    \ and Chrome have been written using C++, C++ also has been used in developing\
    \ the most popular database system called MySQL.\n- **Programming Languages Development**\
    \ - C++ has been used extensively in developing new programming languages like\
    \ C#, Java, JavaScript, Perl, UNIX's C Shell, PHP and Python, and Verilog etc.\n\
    - **Computation Programming** - C++ is the best friends of scientists because\
    \ of fast speed and computational efficiencies.\n- **Games Development** - C++\
    \ is extremely fast which allows programmers to do procedural programming for\
    \ CPU intensive functions and provides greater control over hardware, because\
    \ of which it has been widely used in development of gaming engines.\n- **Embedded\
    \ System** - C++ is being heavily used in developing Medical and Engineering Applications\
    \ like softwares for MRI machines, high-end CAD/CAM systems etc.\n\nThis list\
    \ goes on, there are various areas where software developers are happily using\
    \ C++. I highly recommend you to learn C++ and contribute to the community.\n\n\
    # C++ Overview\n\nC++ is a statically typed, compiled, general-purpose, case-sensitive,\
    \ free-form language that supports procedural, object-oriented, and generic programming.\
    \ C++ is regarded as a middle-level language, as it comprises a combination of\
    \ both high-level and low-level language features. C++ was developed by Bjarne\
    \ Stroustrup starting in 1979 at Bell Labs in Murray Hill, New Jersey, as an enhancement\
    \ to the C language and originally named C with Classes but later it was renamed\
    \ C++ in 1983. C++ is a superset of C, and virtually any legal C program is a\
    \ legal C++ program.\n\n## Object-Oriented Programming\n\nC++ fully supports object-oriented\
    \ programming, including the four pillars of object-oriented development –\n\n\
    - Encapsulation\n- Data hiding\n- Inheritance\n- Polymorphism\n\n## Standard Libraries\n\
    \nStandard C++ consists of three parts –\n\n- The core language giving all the\
    \ building blocks including variables, data types and literals, etc.\n- The C++\
    \ Standard Library giving a rich set of functions manipulating files, etc.\n-\
    \ The Standard Template Library (STL) giving a rich set of methods manipulating\
    \ data structures, etc.\n\n## The ANSI Standard\n\nThe ANSI standard is an attempt\
    \ to ensure C++ is portable; code you write for Microsoft's compiler will compile\
    \ without errors, using a compiler on a Mac, UNIX, a Windows box, or an Alpha.\
    \ The ANSI standard has been stable for a while, and all the major C++ compiler\
    \ manufacturers support the ANSI standard.\n\n## Learning C++\n\nThe most important\
    \ thing while learning C++ is to focus on concepts. The purpose of learning a\
    \ programming language is to become a better programmer; that is, to become more\
    \ effective at designing and implementing new systems and at maintaining old ones.\n\
    \n## Use of C++\n\nC++ is used by hundreds of thousands of programmers in essentially\
    \ every application domain. C++ is being highly used to write device drivers and\
    \ other software that rely on direct manipulation of hardware under realtime constraints.\
    \ C++ is widely used for teaching and research because it is clean enough for\
    \ successful teaching of basic concepts. Anyone who has used either an Apple Macintosh\
    \ or a PC running Windows has indirectly used C++ because the primary user interfaces\
    \ of these systems are written in C++.\n"
  mdcn: "\n\n# 理解要点\n\n# 初学者C++编程\n\n# 一种面向对象的语言\n\n![](img/e2949dced8a6f4af100c418c26bfd2dc_0_0.png)\n\
    \n洪磊\n\nCopyright © 2021 洪磊\n\n版权所有。未经作者事先许可或承认，本书的任何部分均不得以任何形式或手段（电子、机械、复印、录音或其他）进行复制、存储在检索系统中或传输。\n\
    \n# 目录\n\n- 序言\n- C++ 概述\n- C++ 环境搭建\n- C++ 基础语法\n- C++ 中的注释\n- C++ 数据类型\n- C++\
    \ 变量类型\n- C++ 中的变量作用域\n- C++ 常量/字面量\n- C++ 修饰符类\n- C++ 存储存储类\n- C++ 中的运算符\n- C++\
    \ 循环类型\n- C++ 决策语句\n- C++ 函数\n- C++ 中的数字\n- C++ 数组\n- C++ 字符串\n- C++ 指针\n- C++\
    \ 引用\n- C++ 日期时间\n- C++ 基础输入输出\n- C++ 数据结构\n- C++ 类与对象\n- C++ 继承\n- C++ 重载（运算符和函数）\n\
    - C++ 中的多态\n- C++ 数据抽象\n- C++ 中的数据封装\n- C++ 接口（抽象类）\n- C++ 文件与流\n- C++ 异常处理\n\
    - C++ 动态内存\n- C++ 命名空间\n- C++ 模板\n- C++ 预处理器\n- C++ 信号处理\n- C++ 多线程\n- C++ Web\
    \ 编程\n- 结语\n\n# 序言\n\nC++ 是一门由 Bjarne Stroustrup 从 1979 年开始在贝尔实验室开发的中级编程语言。C++\
    \ 运行在多种平台上，例如 Windows、Mac OS 以及各种版本的 UNIX。本 C++ 教程采用简单且实用的方法，为从初学者到高级软件工程师的读者群介绍\
    \ C++ 的概念。\n\n## 为什么要学习 C++\n\n对于想要成为一名优秀软件工程师的学生和职场专业人士来说，学习 C++ 是**必不可少的**。我将列出学习\
    \ C++ 的一些关键优势：\n\n- C++ 非常接近硬件，因此你有机会在底层工作，这让你在内存管理方面获得巨大的控制权，获得更好的性能，并实现健壮的软件开发。\n\
    \n- C++ 编程让你对面向对象编程有清晰的理解。当你实现虚表和虚指针或动态类型识别时，你将理解多态的底层实现。\n\n- C++ 是长青的编程语言之一，深受数百万软件开发者的喜爱。如果你是一名优秀的\
    \ C++ 程序员，你永远不会无事可做，更重要的是，你的工作将获得高薪回报。\n\n- C++ 是应用和系统编程中最广泛使用的编程语言之一。因此，你可以选择感兴趣的软件开发领域。\n\
    \n- C 真正教会了你编译器、链接器和加载器之间的区别，不同的数据类型、存储类、变量类型及其作用域等。\n\n学习 C++ 编程有数千个良好的理由。但有一点肯定的，学习任何编程语言（不仅仅是\
    \ C++），你只需要编写代码、编写代码并不断编写代码，直到你成为专家。\n\n# 使用 C++ Hello World\n\n为了让你对 C++ 编程产生一点兴趣，我将给你展示一个小型的传统的\
    \ C++ Hello World 程序，你可以通过 Demo 链接尝试它。\n\nC++ 是 C 语言的超集，增加了对面向对象概念的实现。\n\n```\n\
    #include <iostream>\nusing namespace std;\n\n// main() 是程序执行开始。\nint main() {\n\
    \    cout << \"Hello World\"; // 打印 Hello World\n    return 0;\n}\n```\n\n有很多\
    \ C++ 编译器可用，你可以它们来编译和运行上述程序：\n\n- Apple C+. Xcode\n- Bloodshed Dev-C++\n- Clang\
    \ C++\n- Cygwin (GNU C++)\n- Mentor Graphics\n- MINGW - \"Minimalist GNU for Windows\"\
    \n- GNU CC 源码\n- IBM C++\n- Intel C++\n- Microsoft Visual C++\n- Oracle C++\n\
    - HP C++\n\n要列出所有可用编译器的完整列表是不可能的。C++ 的世界太大了，新事物层出不穷。\n\n# C++ 编程的应用\n\n如前所述，C++\
    \ 是最广泛使用的编程语言之一。它几乎存在于软件开发的每一个领域。我将在这里列出其中几个：\n\n- **应用软件开发** - C++ 编程已用于开发几乎所有主要的操作系统，如\
    \ Windows、Mac OSX 和 Linux。除了操作系统之外，Mozilla Firefox 和 Chrome 等许多浏览器的核心部分也是使用 C++\
    \ 编写的，C++ 还用于开发了名为 MySQL 的流行数据库系统。\n- **编程语言开发** - C++ 已广泛用于开发新的编程语言，如 C#、Java、JavaScript、Perl、UNIX\
    \ 的 C Shell、PHP、Python 以及 Verilog 等。\n- **计算编程** - 由于运行速度快且计算效率高，C++ 是科学家们的好朋友。\n\
    - **游戏开发** - C++ 速度极快，允许程序员对 CPU 密集型函数进行过程化编程，并对硬件提供更强的控制，因此它被广泛应用于游戏引擎的开发。\n\
    - **嵌入式系统** - C++ 被大量用于开发医疗和工程应用，例如 MRI 机器的软件、高端 CAD/CAM 系统等。\n\n这个列表还将继续下去，在许多领域，软件开发者都在愉快地使用\
    \ C++。我强烈建议你学习 C++ 并为社区做出贡献。\n\n# C++ 概述\n\nC++ 是一门静态类型、编译型、通用、区分大小写的、自由格式语言，支持过程化、面向对象和泛型编程。C++\
    \ 被视为一种中级语言，因为它结合了高级和低级语言特征。C++ 由 Bjarne Stroustrup 从 1979 年开始在纽西的贝尔实验室开发，最初作为\
    \ C 语言的增强并名为 C with Classes，后来在 1983 年更名为 C++。C++ 是 C 语言的超集，几乎任何法的 C 程序都是法的 C++\
    \ 程序。\n\n## 面向对象编程\n\nC++ 完全支持面向对象编程，包括面向对象开发的四大支柱：\n\n- 封装\n- 数据隐藏\n- 继承\n- 多态\n\
    \n## 标准库\n\n标准 C++ 由三部分组成：\n\n- 核心语言提供了变量、数据类型和字面量等构建块。\n- C++ 标准库提供了丰富的操作文件的函数。\n\
    - 标准模板库（STL）提供了丰富的操作数据结构的方法。\n\n## ANSI 标准\n\nANSI 是确保 C++ 移植性的一种尝试；为微软编译器编写的代码可以在\
    \ Mac、UNIX、Windows 电脑或 Alpha 上的编译器上无错误地编译。ANSI 标准已经稳定了一段时间，所有主要的 C++ 编译器厂商都支持\
    \ ANSI 标准。\n\n## 学习 C++\n\n学习 C++ 时最重要的事情是关注概念。学习编程语言的目的是成为一名更好的程序员；即能够更有效地设计和实现新系统，并维护旧系统。\n\
    \n## C++ 的用途\n\nC++ 被数十万程序员应用于几乎每一个应用领域。C++ 被高度地用于编写设备驱动程序和其他依赖于在实时限制下直接操作硬件的软件。C++\
    \ 广泛用于教学和研究，因为它足够简洁，可以成功教授基础概念。任何使用过 Apple Macintosh 或运行 Windows 的 PC 的人都间接使用过\
    \ C++，因为这些系统的主要用户界面是用 C++ 编写的。\n\n"
