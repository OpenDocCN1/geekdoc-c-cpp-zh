- md: "\nexample one user registration ends after completing many pages. But how to\
    \ maintain user's session information across all the web pages.\n\nIn many situations,\
    \ using cookies is the most efficient method of remembering and tracking preferences,\
    \ purchases, commissions, and other information required for better visitor experience\
    \ or site statistics.\n\n## How It Works\n\nYour server sends some data to the\
    \ visitor's browser in the form of a cookie. The browser may accept the cookie.\
    \ If it does, it is stored as a plain text record on the visitor's hard drive.\
    \ Now, when the visitor arrives at another page on your site, the cookie is available\
    \ for retrieval. Once retrieved, your server knows/remembers what was stored.\n\
    \nCookies are a plain text record of 5 variable-length fields –\n\n- **Expires**\
    \ – This shows date the cookie will expire. If this is blank, the cookie will\
    \ expire when the visitor quits the browser.\n- **Domain** – This shows domain\
    \ name of your site.\n- **Path** – This shows path to the directory or web page\
    \ that set the cookie. This may be blank if you want to retrieve the cookie from\
    \ any directory or page.\n- **Secure** – If this field contains the word \"secure\"\
    \ then the cookie may only be retrieved with a secure server. If this field is\
    \ blank, no such restriction exists.\n- **Name = Value** – Cookies are set and\
    \ retrieved in the form of key and value pairs.\n\n## Setting up Cookies\n\nIt\
    \ is very easy to send cookies to browser. These cookies will be sent along with\
    \ HTTP Header before the Content-type filed. Assuming you want to set UserID and\
    \ Password as cookies. Cookies setting will be done as follows\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main () {\n    cout << \"Set-Cookie:UserID\
    \ = XYZ;\\r\\n\";\n    cout << \"Set-Cookie:Password = XYZ123;\\r\\n\";\n```\n\
    \n```cpp\ncout << \"Set-Cookie:Domain = www.tutorialspoint.com;\\r\\n\";\nout\
    \ << \"Set-Cookie:Path = /perl;\\r\\n\";\nout << \"Content-type:text/html\\r\\\
    n\\r\\n\";\n\ncout << \"<html>\\n\";\nout << \"<head>\\n\";\nout << \"<title>Cookies\
    \ in CGI</title>\\n\";\nout << \"</head>\\n\";\nout << \"<body>\\n\";\n\ncout\
    \ << \"Setting cookies\" << endl;\n\ncout << \"<br/>\\n\";\nout << \"</body>\\\
    n\";\nout << \"</html>\\n\";\n\nreturn 0;\n}\n```\n\nFrom this example, you must\
    \ have understood how to set cookies. We use Set-Cookie HTTP header to set cookies.\n\
    \nCompile above program to produce setcookies.cgi, and try to set cookies using\
    \ following link. It will set four cookies at your computer – /cgi-bin/setcookies.cgi\n\
    \n### Retrieving Cookies\nIt is easy to retrieve all the set cookies. Cookies\
    \ are stored in CGI environment variable HTTP_COOKIE and they will have following\
    \ form. key1 = value1; key2 = value2; key3 = value3....\n\nHere is an example\
    \ of how retrieve cookies.\n\n```cpp\n#include <iostream>\n#include <vector>\n\
    #include <string>\n#include <stdio.h>\n```\n\n```cpp\n#include <stdlib.h>\n\n\
    #include <cgiccc/CgiDefs.h>\n#include <cgiccc/Cgiccc.h>\n#include <cgiccc/HTTPHTMLHeader.h>\n\
    #include <cgiccc/HTMLClasses.h>\n\nusing namespace std;\nusing namespace cgiccc;\n\
    \nint main() {\n    Cgiccc cgi;\n    const cookie_iterator cci;\n\n    cout <<\
    \ \"Content-type:text/html\\r\\n\";\n    cout << \"<html>\\r\\n\";\n    cout <<\
    \ \"<head>\\r\\n\";\n    cout << \"<title>Cookies in CGI</title>\\r\\n\";\n  \
    \  cout << \"</head>\\r\\n\";\n    cout << \"<body>\\r\\n\";\n    cout << \"<table\
    \ border=\\\"\n```\n\nNow, compile above program to produce getcookies.cgi, and\
    \ try to get a list of all the cookies available at your computer – /cgi-bin/getcookies.cgi\n\
    \nThis will produce a list of all the cookies set in previous section and all\
    \ other cookies set in your computer –\n\n- UserID XYZ\n- Password XYZ123\n- Domain\
    \ www.tutorialspoint.com\n- Path /perl\n\n### File Upload Example\n\nTo upload\
    \ a file the HTML form must have the enctype attribute set to multipart/form-data.\
    \ The input tag with the file type will create a \"Browse\" button.\n\n```html\n\
    <html>\n  <body>\n  <form enctype=\"multipart/form-data\" action=\"/cgi-bin/cpp_uploadfile.cgi\"\
    \n    method=\"post\">\n    <p>File: <input type=\"file\" name=\"userfile\" /></p>\n\
    \    <p><input type=\"submit\" value=\"Upload\" /></p>\n  </form>\n  </body>\n\
    </html>\n```\n\nThe result of this code is the following form –\n\nFile:\n\n![](img/e2949dced8a6f4af100c418c26bfd2dc_191_0.png)\n\
    \nNote – Above example has been disabled intentionally to stop people uploading\
    \ files on our server. But you can try above code with your server. Here is the\
    \ script cpp_uploadfile.cpp to handle file upload –\n\n```cpp\n#include <iostream>\n\
    ```\n\n```cpp\n#include <vector>\n#include <string>\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n\n#include <cgiccc/CgiDefs.h>\n#include <cgiccc/Cgiccc.h>\n#include\
    \ <cgiccc/HTTPHTMLHeader.h>\n#include <cgiccc/HTMLClasses.h>\n\nusing namespace\
    \ std;\nusing namespace cgiccc;\n\nint main () {\n    cout << \"Content-type:text/html\\\
    r\\n\\r\\n\";\n    cout << \"<html>\\n\";\n    cout << \"<head>\\n\";\n    cout\
    \ << \"<title>File Upload in CGI</title>\\n\";\n    cout << \"</head>\\n\";\n\
    \    cout << \"<body>\\n\";\n\n    // get list of files to be uploaded\n    const_file_iterator\
    \ file = cgccc.GetFile(\"userfile\");\n    if(file != cgiccc.GetFiles().end())\
    \ {\n        // send data type at cout.\n        cout << HTTPContentHeader(file->getDataType());\n\
    \        // write content at cout.\n        file->writeToStream(cout);\n    }\n\
    \    cout << \"<File uploaded successfully>\\n\";\n    cout << \"</body>\\n\"\
    ;\n    cout << \"</html>\\n\";\n\n    return 0;\n}\n```\n\nThe above example is\
    \ for writing content at cout stream but you can open your file stream and save\
    \ the content of uploaded file in a file at desired location.\n"
  mdcn: "\n示例一，用户注册在完成多个页面后结束。但如何在所有 页面之间维护用户的会话信息呢？\n\n在许多情况下，使用 cookie 是记录和跟踪偏好、购买记录、佣金以及为了更好的访问体验或网站统计所需的其他信息的最有效方法。\n\
    \n## 工作原理\n\n您的服务器以 cookie 的形式向访问者的浏览器发送一些数据。浏览器可能会接受该 cookie。如果接受了，它将作为纯文本记录存储在访问者的硬盘上。现在，当访问者到达您网站的另一个页面时，该\
    \ cookie 就可以被检索到。一旦检索到，您的服务器就知道/记住了存储了什么内容。\n\nCookie 是一个包含 5 个变长度字段的纯文本记录——\n\
    \n-   **Expires（过期时间）** – 显示 cookie 过期的日期。如果为空，cookie 将访问者退出浏览器时过期。\n-   **Domain（域名）**\
    \ – 显示您网站的域名。\n-   **Path（路径）** – 显示设置 cookie 的目录或网页的路径。如果您想从任何目录或页面检索 cookie，此字段可能为空。\n\
    -   **Secure（安全）** – 如果此字段包含“secure”单词，则 cookie 只能通过安全服务器检索。如果此字段为空，则没有此类限制。\n\
    -   **Name = Value（名称 = 值）** – Cookie 以键值对的形式进行设置和检索。\n\n## 设置 Cookie\n\n向浏览器发送\
    \ cookie cookie 非常简单。这些 cookie 将在 Content-type 字段之前随 HTTP Header 一起发送。假设您想将 UserID\
    \ 和 Password 设置为 cookie。Cookie 的设置将如下所示\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main () {\n    cout << \"Set-Cookie:UserID = XYZ;\\r\\\
    n\";\n    cout << \"Set-Cookie:Password = XYZ123;\\r\\n\";\n```\n\n```cpp\ncout\
    \ << \"Set-Cookie:Domain = www.tutorialspoint.com;\\r\\n\";\nout << \"Set-Cookie:Path\
    \ = /perl;\\r\\n\";\nout << \"Content-type:text/html\\r\\n\\r\\n\";\n\ncout <<\
    \ \"<html>\\n\";\nout << \"<head>\\n\";\nout << \"<title>Cookies in CGI</title>\\\
    n\";\nout << \"</head>\\n\";\nout << \"<body>\\n\";\n\ncout << \"Setting cookies\"\
    \ << endl;\n\ncout << \"<br/>\\n\";\nout << \"</body>\\n\";\nout << \"</html>\\\
    n\";\n\nreturn 0;\n}\n```\n\n从这个示例中，您一定已经明白了如何设置 cookie。我们使用 Set-Cookie HTTP header\
    \ 来设置 cookie。\n\n编译上面的程序生成 setcookies.cgi，并尝试使用以下链接设置 cookie。它将在您的计算机上设置四个 cookie\
    \ – /cgi-bin/setcookies.cgi\n\n### 检索 Cookie\n检索所有已设置的 cookie 很容易。Cookie 存储在 CGI\
    \ 环境变量 HTTP_COOKIE 中，它们将具有以下形式：key1 = value1; key2 = value2; key3 = value3....\n\
    \n这里是如何检索 cookie 的示例。\n\n```cpp\n#include <iostream>\n#include <vector>\n#include\
