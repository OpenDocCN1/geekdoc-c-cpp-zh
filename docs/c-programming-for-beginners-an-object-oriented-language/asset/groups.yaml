    \ w) {\n        width = w;\n    }\n\n    void getHeight(int h) {\n        height\
    \ = h;\n    }\n\nprotected:\n    int width;\n    int height;\n};\n\n// Derived\
    \ classes\nclass Rectangle: public Shape {\npublic:\n    int getArea() {\n   \
    \     return (width * height);\n    }\n};\n\nclass Triangle: public Shape {\n\
