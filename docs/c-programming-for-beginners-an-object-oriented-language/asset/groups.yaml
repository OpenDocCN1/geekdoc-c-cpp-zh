    \ by the external applications are provided as pure virtual functions in the abstract\
    \ base class. The implementations of these pure virtual functions are provided\
    \ in the derived classes that correspond to the specific types of the application.\n\
    \nThis architecture also allows new applications to be added to a system easily,\
    \ even after the system has been defined.\n\n## C++ Files and Streams\n\nSo far,\
