- md: "\n# C++ Data Structures\n\nC/C++ arrays allow you to define variables that\
    \ combine several data items of the same kind, but **structure** is another user\
    \ defined data type which allows you to combine data items of different kinds.\n\
    \nStructures are used to represent a record, suppose you want to keep track of\
    \ your books in a library. You might want to track the following attributes about\
    \ each book –\n\n- Title\n- Author\n- Subject\n- Book ID\n\n### Defining a Structure\n\
    \nTo define a structure, you **must** use the struct statement. The struct statement\
    \ defines a new data type, with more than one member, for your program. The format\
    \ of the struct statement is –\n\n```\nstruct [structure tag] {\n  member definition;\n\
    \  member definition;\n  ...\n  member definition;\n} [one or more structure variables];\n\
    ```\n\nThe **structure tag** is optional and each member definition is a normal\
    \ variable definition, such as int; or float f; or any other valid variable definition.\
    \ At the end of the struct's definition, before the final semicolon, you can specify\
    \ one or more structure variables but it is optional. Here is the way you would\
    \ declare the Book structure –\n\n```\nstruct Books {\n  char title[50];\n  char\
    \ author[50];\n  char subject[100];\n  int book_id;\n} book;\n```\n\n# Accessing\
    \ Structure Members\n\nTo access any member of a structure, we use the member\
    \ access operator (.). The member access operator is coded as a period between\
    \ the structure variable name and the structure member that we wish to access.\
    \ You would use struct keyword to define variables of structure type. Following\
    \ is the example to explain usage of structure -\n\nLive Demo\n\n```cpp\n#include\
    \ <iostream>\n#include <cstring>\n\nusing namespace std;\n\nstruct Books {\n \
    \   char title[50];\n    char author[50];\n    char subject[100];\n    int book_id;\n\
    };\n\nint main() {\n    struct Book1; // Declare Book1 of type Book\n    struct\
    \ Book2; // Declare Book2 of type Book\n\n    // book 1 specification\n    strcpy(Book1.title,\
    \ \"Learn C++ Programming\");\n    strcpy(Book1.author, \"Chand Miyan\");\n  \
    \  strcpy(Book1.subject, \"C++ Programming\");\n    Book1.book_id = 6495407;\n\
    \n    // book 2 specification\n    strcpy(Book2.title, \"Telecom Billing\");\n\
    \    strcpy(Book2.author, \"Yakit Singha\");\n    strcpy(Book2.subject, \"Telecom\"\
    );\n    Book2.book_id = 6495700;\n\n    // Print Book1 info\n    cout << \"Book\
    \ 1 title : \" << Book1.title << endl;\n```\ncout << \"Book 1 author : \" << Book1.author\
    \ << endl;\ncout << \"Book 1 subject : \" << Book1.subject << endl;\ncout << \"\
    Book 1 id : \" << Book1.book_id << endl;\n\n// Print Book2 info\ncout << \"Book\
    \ 2 title : \" << Book2.title << endl;\ncout << \"Book 2 author : \" << Book2.author\
    \ << endl;\ncout << \"Book 2 subject : \" << Book2.subject << endl;\ncout << \"\
    Book 2 id : \" << Book2.book_id << endl;\n\nreturn 0;\n}\n```\n\nWhen the above\
    \ code is compiled and executed, it produces the following result -\n\nBook 1\
    \ title : Learn C++ Programming\nBook 1 author : Chand Miyan\nBook 1 subject :\
    \ C++ Programming\nBook 1 id : 6495407\nBook 2 title : Telecom Billing\nBook 2\
    \ author : Yakit Singha\nBook 2 subject : Telecom\nBook 2 id : 6495700\n\n###\
    \ Structures as Function Arguments\n\nYou can pass a structure as a function argument\
    \ in very similar way as you pass any other variable or pointer. You would access\
    \ structure variables in the similar way as you have accessed in the above example\
    \ -\n\n![](img/e2949dced8a6f4af100c418c26bfd2dc_94_0.png)\n\n```cpp\n#include\
    \ <iostream>\n#include <string>\n\nusing namespace std;\nvoid printBook(struct\
    \ Books book);\n\nstruct Books {\n    char title[50];\n    char author[50];\n\
    \    char subject[100];\n    int book_id;\n};\n\nint main() {\n    struct Books\
