  - "[PAGE 122]\n\n# Data Encapsulation in C++\n\nAll C++ programs are composed of\
    \ the following two fundamental elements\n\n\n+   **Program statements (code)**\
    \ – This is the part of a program that performs actions and they are called functions.\n\
    * **Program data** – The data is the information of the program which gets affected\
    \ by the program functions.\n\nEncapsulation is an Object Oriented Programming\
    \ concept that binds together the data and the functions that manipulate the data,\
    \ and that keeps safe from outside interference and misuse. Data encapsulation\
    \ led to the important OOP concept of **data hiding**.\n\n**Data encapsulation**\
    \ is a mechanism of bundling the data, and the functions that use them and **data\
    \ abstraction** is a mechanism of exposing only the interfaces and hiding the\
    \ implementation details from the user.\n\nC++ supports the properties of encapsulation\
    \ and data hiding through the creation of user-defined types, called **classes**.\
    \ We already have studied that a class can contain **private**, **protected**\
    \ and **public** members. By default, items defined in a class are private. For\
    \ example –\n\n```\nclass Box {\npublic:\n    double getVolume(void) {\n     \
    \   return length * breadth * height;\n    }\n\nprivate:\n    double length; //\
    \ Length of a box\n    double breadth; // Breadth of a box\n    double height;\
    \ // Height of a box\n};\n```\n\nThe variables length, breadth, and height are\
    \ **private**. This means that they can be accessed only by other members of the\
    \ Box class, and not by any other part of your program. This is one way encapsulation\
    \ is achieved.\n\nTo make parts of a class **public** (i.e., accessible to other\
    \ parts of your"
- md: "\nprogram), you must declare them after the public keyword. All variables or\
    \ functions defined after the public specifier are accessible by all other functions\
    \ in your program.\n\nMaking one class a friend of another exposes the implementation\
    \ details and reduces encapsulation. The ideal is to keep as many of the details\
    \ of each class hidden from all other classes as possible.\n\n## Data Encapsulation\
    \ Example\n\nAny C++ program where you implement a class with public and private\
    \ members is an example of data encapsulation and data abstraction. Consider the\
    \ following example –\n\n```cpp\n#include <iostream>\nusing namespace std;\nclass\
    \ Adder {\npublic:\n    // constructor\n    Adder(int i = 0) {\n        total\
    \ = i;\n    }\n    // interface to outside world\n    void addNum(int number)\
    \ {\n        total += number;\n    }\n    // interface to outside world\n    int\
    \ getTotal() {\n        return total;\n    }\nprivate:\n    // hidden data from\
    \ outside world\n    int total;\n};\n```\n\n```cpp\nint main() {\n    Adder a;\n\
    \n    a.addNum(10);\n    a.addNum(20);\n    a.addNum(30);\n\n    cout << \"Total\
    \ \" << a.getTotal() << endl;\n}\n```\n\nWhen the above code is compiled and executed,\
    \ it produces the following result -\n\nTotal 60\n\nAbove class adds numbers together,\
    \ and returns the sum. The public members addNum and getTotal are the interfaces\
    \ to the outside world and a user needs to know them to use the class. The private\
    \ member total is something that is hidden from the outside world, but is needed\
    \ for the class to operate properly.\n\n## Designing Strategy\n\nMost of us have\
    \ learnt to make class members private by default unless we really need to expose\
    \ them. That's just good encapsulation.\n\nThis is applied most frequently to\
    \ data members, but it applies equally to all members, including virtual functions.\n\
    \n## Interfaces in C++ (Abstract Classes)\n\nAn interface describes the behavior\
    \ or capabilities of a C++ class without committing to a particular implementation\
    \ of that class.\n\nThe C++ interfaces are implemented using abstract classes\
    \ and these abstract classes should not be confused with data abstraction which\
    \ is a concept of keeping implementation details separate from associated data.\n\
    \nA class is made abstract by declaring at least one of its functions as pure\
    \ virtual function. A pure virtual function is specified by placing \"=0\" in\
    \ its declaration as follows –\n\n```cpp\nclass Box {\npublic:\n    // pure virtual\
    \ function\n    virtual double getVolume() = 0;\n\nprivate:\n    double length;\
    \ // Length of a box\n    double breadth; // Breadth of a box\n    double height;\
    \ // Height of a box\n};\n```\n\nThe purpose of an abstract class (often referred\
    \ to as an ABC) is to provide an appropriate base class from which other classes\
    \ can inherit. Abstract classes cannot be used to instantiate objects and serves\
    \ only as an interface. Attempting to instantiate an object of an abstract class\
    \ causes a compilation error.\n\nThus, if a subclass of an ABC needs to be instantiated,\
    \ it has to implement each of the virtual functions, which means it supports the\
    \ interface declared by the ABC. Failure to override a pure virtual function in\
    \ a derived class, then attempting to instantiate objects of that class, is a\
    \ compilation error.\n\nClasses that can be used to instantiate objects are called\
    \ concrete classes.\n\n### Abstract Class Example\n\nConsider the following example\
    \ where parent class provides an interface to the base class to implement a function\
    \ called getArea() –\n\n```cpp\n#include <iostream>\nusing namespace std;\n\n\
    // Base class\nclass Shape {\npublic:\n    // pure virtual function providing\
