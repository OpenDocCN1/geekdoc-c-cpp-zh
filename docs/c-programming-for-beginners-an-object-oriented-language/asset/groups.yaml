    \n    // output each array element's value\n    for (int j=0; j<10; j++) {\n \
    \       cout << setw(7)<<j << setw(10) << n[ j ] << endl;\n    }\n    return 0;\n\
    }\n```\n\nThis program makes use of setw() function to format the output. When\
