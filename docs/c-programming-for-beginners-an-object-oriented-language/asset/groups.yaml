    #include <iostream>\nusing namespace std;\n\nint main () {\n    // number definition:\n\
    \    short s;\n    int i;\n    long l;\n    float f;\n    double d;\n\n    //\
    \ number assignments;\n    s = 10;\n    i = 1000;\n    l = 1000000;\n    f = 230.47;\n\
    \    d = 30949.374;\n\n    // number printing;\n    cout << \"short s :\" << s\
