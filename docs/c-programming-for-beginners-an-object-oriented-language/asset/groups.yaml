    \ endl;\n\n    return 0;\n}\n```\n\n如果我们编译并运行上述代码，`i, j: 39` 将产生以下结果：\nMax(i,\
    \ j): 39\nMax(f1, f2): 20.7\nMax(s1, s2): World\n\n# 类模板 (Class Template)\n\n\
    正如我们定义函数模板一样，也可以定义类模板。泛型类声明的通用形式所示——\n```cpp\ntemplate <class type> class-name\
    \ {\n\n.\n}\n```\n\n在这里，`type` 是占位符类型名称，它将在类实例化时指定。你可以通过使用逗号分隔的列表定义多个泛型数据类型。\n\
