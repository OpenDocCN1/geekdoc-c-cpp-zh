  - "[PAGE 171]\n\n# C++ Web Programming\n\nWhat is CGI?\n\n+   - The Common Gateway\
    \ Interface, or CGI, is a set of standards that define how information is exchanged\
    \ between the web server and a custom script.\n- The CGI specs are currently maintained\
    \ by the NCSA NCSA defines CGI is as –\n- The Common Gateway Interface, or CGI,\
    \ is a standard for external gateway programs to interface with information servers\
    \ such as HTTP servers.\n- The current version is CGI/1.1 and CGI/1.2 is under\
    \ progress.\n\nWeb Browsing\n understand the concept of CGI, let's see what happens\
    \ when we click a hyperlink to browse a particular web page or URL.\n\n+   - Your\
    \ browser contacts the HTTP web server and demand for the URL ie. filename.\n\
    - Web Server will parse the URL and will look for the filename. If it finds requested\
    \ file then web server sends that file back to the browser otherwise sends an\
    \ error message indicating that you have requested a wrong file.\n- Web browser\
    \ takes response from web server and displays either the received file or error\
    \ message based on the response.\n\nHowever, it is possible to set up the HTTP\
    \ server in such a way that whenever a file in a certain directory is requested,\
    \ that file is not sent back; instead it is executed as a program, and produced\
    \ output from the program is sent back to your browser to display.\n\nThe Common\
    \ Gateway Interface (CGI) is a standard protocol for enabling applications (called\
    \ CGI programs or CGI scripts) to interact with Web servers and with clients.\
    \ These CGI programs can be a written in Python, PERL, Shell, C or C++ etc."
- md: "\n# CGI Architecture Diagram\n\nThe following simple program shows a simple\
    \ architecture of CGI –\n\n![](img/e2949dced8a6f4af100c418c26bfd2dc_172_0.png)\n\
    \n# Web Server Configuration\n\nBefore you proceed with CGI Programming, make\
    \ sure that your Web Server supports CGI and it is configured to handle CGI Programs.\
    \ All the CGI Programs to be executed by the HTTP server are kept in a pre-configured\
    \ directory. This directory is called CGI directory and by convention it is named\
    \ as /var/www/cgi-bin. By convention CGI files will have extension as **cgi**,\
    \ though they are C++ executable.\n\nBy default, Apache Web Server is configured\
    \ to run CGI programs in /var/www/cgi-bin. If you want to specify any other directory\
    \ to run your CGI scripts, you can modify the following section in the httpd.conf\
    \ file:\n\n```\n<Directory \"/var/www/cgi-bin\">\nAllowOverride None\nOptions\
    \ ExecCGI\nOrder allow,deny\nAllow from all\n</Directory>\n<Directory \"/var/www/cgi-bin\"\
    >\nOptions All\n</Directory>\n```\n\nHere, I assume that you have Web Server up\
    \ and running successfully and you are able to run any other CGI program like\
    \ Perl or Shell etc.\n\n## First CGI Program\n\nConsider the following C++ Program\
    \ content –\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\
    \ {\n    cout << \"Content-type:text/html\\r\\n\\n\";\n    cout << \"<html>\\\
    n\";\n    cout << \"<head>\\n\";\n    cout << \"<title>Hello World - First CGI\
    \ Program</title>\\n\";\n    cout << \"</head>\\n\";\n    cout << \"<body>\\n\"\
    ;\n    cout << \"<h2>Hello World! This is my first CGI program</h2>\\n\";\n  \
    \  cout << \"</body>\\n\";\n    cout << \"</html>\\n\";\n\n    return 0;\n}\n\
    ```\n\nCompile above code and name the executable as `cplplus.cgi`. This file\
    \ is being kept in /var/www/cgi-bin directory and it has the following content.\
    \ Before running your CGI program, make sure you have changed the file permissions\
    \ using `chmod 755 cplplus.cgi` UNIX command to make file executable.\n\n## My\
    \ First CGI program\n\nThe above C++ program is a simple program which is writing\
    \ its output on STDOUT file i.e. screen. There is one important and extra feature\
    \ available which is the first line printing `Content-type:text/html\\r\\n\\n`.\
    \ This line is sent back to the browser and specifies the content type to be displayed\
    \ on the browser screen. Now you must have understood the basic concept of CGI\
    \ and you can write many complicated CGI programs using Python. A C++ CGI program\
    \ can interact with any other external system, such as RDBMS, to exchange information.\n\
    \n# HTTP Header\n\nThe line `Content-type:text/html\\r\\n\\r\\n` is a part of\
    \ HTTP header, which is sent to the browser to understand the content. All the\
    \ HTTP header will be in the following –\n\nHTTP Field Name: Field Content\n\n\
    For Example:\n`Content-type: text/html\\r\\n\\r\\n`\n\nThere are a few other important\
    \ HTTP headers, which you will use frequently in your CGI Programming.\n\n| Sr.No\
    \ | Header & Description |\n| :--- | :--- |\n| 1 | **Content-type:** A MIME string\
    \ defining the format of the file being returned. Example is Content-type:text/html.\
    \ |\n| 2 | **Expires: Date** | The date information becomes invalid. This should\
    \ be used by the browser to decide when a page needs to be refreshed. A valid\
    \ date string should be in the format 01 Jan 1998 12:00:00 GMT. |\n| 3 | **Location:\
    \ URL** | The URL that should be returned instead of the URL requested? You can\
    \ use this field to redirect a request to any file. |\n| 4 | **Last-modified:\
    \ Date** | The date of last modification of the resource. |\n| 5 | **Content-length:\
    \ N** | The length, in bytes, of the data being returned. The browser uses this\
    \ value to report the estimated download time for a file. |\n| 6 | **Set-Cookie:\
    \ String** | Set the cookie passed through the *string*. |\n\n# CGI Environment\
    \ Variables\n\nAll the CGI program will have access to the following environment\
    \ variables. These variables play an important role while writing any CGI program.\n\
    \n| Sr.No | Variable Name & Description |\n| :--- | :--- |\n| 1 | CONTENT_TYPE\
    \ | The data type of the content, used when the client is sending attached content\
    \ to the server. For example file upload etc. |\n| 2 | CONTENT_LENGTH | The length\
    \ of the query information that is available only for POST requests. |\n| 3 |\
    \ HTTP_COOKIE | Returns the set cookies in the form of key & value pair. |\n|\
    \ 4 | HTTP_USER_AGENT | The User-agent-header field contains information about\
    \ the user agent originating the request. It is a name of the web browser. |\n\
    | 5 | PATH_INFO | The path for the CGI script. |\n| 6 | QUERY_STRING | The URL-encoded\
    \ information that is sent with GET method request. |\n| 7 | REMOTE_ADDR | The\
    \ IP address of the remote host making the request. This can be useful for logging\
    \ or for authentication purpose. |\n| 8 | REMOTE_HOST | The fully qualified name\
    \ of the host making the request. |\n| 9 | REQUEST_METHOD | The method used to\
    \ make the request (GET or POST). |\n| 10 | SCRIPT_FILENAME | The path to the\
    \ CGI script. |\n| 11 | SCRIPT_NAME | The name of the CGI script. |\n| 12 | SERVER_NAME\
    \ | The name of the web server. |\n| 13 | SERVER_SOFTWARE | The version of the\
    \ software running the server. |\n"
  mdcn: "\n\n# CGI 架构图\n\n以下简单程序展示了 CGI 的简单架构——\n\n![](img/e2949dced8a6f4af100c418c26bfd2dc_172_0.png)\n\
    \n# Web 服务器配置\n\n在继续 CGI 编程之前，请确保你的 Web 服务器支持 CGI 并已配置为处理 CGI 程序。所有由 HTTP 服务器执行的\
    \ CGI 程序都保存在预先配置的目录中。该目录被称为 CGI目录，按照习惯命名为 /var/www/cgi-bin。按照习惯，CGI 文件的扩展名为 **cgi**，尽管它们实际上是\
    \ C++ 可执行文件。\n\n默认情况下，Apache Web 服务器配置在 /var/www/cgi-bin 中运行 CGI 程序。如果你想指定其他目录来运行你的\
    \ CGI 脚本，可以修改 httpd.conf 文件中的以下部分：\n\n```\n<Directory \"/var/www/cgi-bin\">\n\
    AllowOverride None\nOptions ExecCGI\nOrder allow,deny\nAllow from all\n</Directory>\n\
    <Directory \"/var/www/cgi-bin\">\nOptions All\n</Directory>\n```\n\n在这里，我假设你已经成功启动并运行了\
    \ Web 服务器，并且能够运行任何 Perl 或 Shell 等 CGI 程序。\n\n## 第一个 CGI 程序\n\n考虑以下 C++ 程序内容——\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main () {\n    cout\
    \ << \"Content-type:text/html\\r\\n\\n\";\n    cout << \"<html>\\n\";\n    cout\
    \ << \"<head>\\n\";\n    cout << \"<title>Hello World - First CGI Program</title>\\\
    n\";\n    cout << \"</head>\\n\";\n    cout << \"<body>\\n\";\n    cout << \"\
    <h2>Hello World! This is my first CGI program</h2>\\n\";\n    cout << \"</body>\\\
    n\";\n    cout << \"</html>\\n\";\n\n    return 0;\n}\n```\n\n编译上述代码并将可执行文件命名为\
    \ `cplplus.cgi`。该文件存放在 /var/www/cgi-bin 目录下，内容如下。在运行你的 CGI 程序之前，请确保你已使用 UNIX 命令\
    \ `chmod 755 cplplus.cgi` 更改了文件权限以使文件可执行。\n\n## 我的第一个 CGI 程序\n\n上面的 C++ 程序是一个简单的程序，它将其输出写入到\
    \ STDOUT 文件（即屏幕）中。有一个重要且额外的功能可用，即第一行打印的 `Content-type:text/html\\r\\n\\n`。这一行被发送回浏览器，并指定在浏览器屏幕上显示的内容类型。现在你一定已经理解了\
    \ CGI 的基本概念，并可以使用 Python 编写许多复杂的 CGI 程序。C++ CGI 程序可以与任何其他外部系统（如 RDBMS）交互以交换信息。\n\
    \n# HTTP 头部\n\n`Content-type:text/html\\r\\n\\r\\n` 行是 HTTP 头部的一部分，发送到浏览器以理解内容。所有的\
    \ HTTP 头部将如下所示：\n\nHTTP 字段名：字段内容\n\n例如：\n`Content-type: text/html\\r\\n\\r\\n`\n\
    \n还有其他重要的 HTTP 头部，你将在 CGI 编程中频繁使用它们。\n\n| 序号 | 头部与描述 |\n| :--- | :--- |\n| 1 |\
    \ **Content-type:** 定义返回文件格式的 MIME 字符串。例如 Content-type:text/html。 |\n| 2 | **Expires:\
    \ Date** | 日期信息失效。浏览器应使用它来决定何时需要刷新页面。有效的日期字符串格式应为 01 Jan 1998 12:00:00 GMT。 |\n\
    | 3 | **Location: URL** | 代替请求的 URL 返回的 URL？你可以使用此字段将请求重定向到任何文件。 |\n| 4 | **Last-modified:\
    \ Date** | 资源最后修改的日期。 |\n| 5 | **Content-length: N** | 返回数据的长度（字节为字节）。浏览器使用此值来报告文件的估计下载时间。\
    \ |\n| 6 | **Set-Cookie: String** | 设置通过*string* 的 cookie。 |\n\n# CGI 环境变量\n\n\
    所有的 CGI 程序都将访问以下环境变量。这些变量在编写任何 CGI 程序时起着重要作用。\n\n| 序号 | 变量名与描述 |\n| :--- | :---\
    \ |\n| 1 | CONTENT_TYPE | 内容的数据类型，当客户端向服务器发送附加内容时使用（例如文件上传等）。 |\n| 2 | CONTENT_LENGTH\
    \ | 查询信息的长度，仅适用于 POST 请求。 |\n| 3 | HTTP_COOKIE | 以键值对的形式返回已设置的 cookie。 |\n| 4\
    \ | HTTP_USER_AGENT | User-agent-header 字段包含关于发起请求的用户代理信息。它是网络浏览器的名称。 |\n| 5 |\
    \ PATH_INFO | CGI 脚本的路径。 |\n| 6 | QUERY_STRING | 使用 GET 方法请求发送的 URL 编码信息。 |\n\
    | 7 | REMOTE_ADDR | 发起请求的远程主机 IP 地址。这对于日志记录或身份验证有用。 |\n| 8 | REMOTE_HOST | 发起请求的主机的完全域名。\
    \ |\n| 9 | REQUEST_METHOD | 用于请求的方法（GET 或 POST）。 |\n| 10 | SCRIPT_FILENAME | CGI\
    \ 脚本的路径。 |\n| 11 | SCRIPT_NAME | CGI 脚本的。 |\n| 12 | SERVER_NAME | Web 服务器名称。 |\n\
    | 13 | SERVER_SOFTWARE | 运行服务器的软件版本。 |\n\n"
