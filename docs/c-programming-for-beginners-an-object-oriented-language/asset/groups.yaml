  - '[PAGE 164]


    An opaque attribute object that may be used to set thread attributes. You can
    specify a thread attributes object, or NULL for the default values.


    # start_routine


    The C++ routine that the thread will execute once it is created.


    # arg


    A single argument that may be passed to start_routine. It must be passed by reference
    as a pointer cast of type void. NULL may be used if no argument is to be passed.


    The maximum number of threads that may be created by a process is implementation
    dependent. Once created, threads are peers, and may create other threads. There
    is no implied hierarchy or dependency between threads.


    # Terminating Threads


    There is following routine which we use to terminate a POSIX thread =

    #include <pthread.h>

    pthread_exit(status)


    Here pthread_exit is used to explicitly exit a thread. Typically, the pthread_exit()
    routine is called after a thread has completed its work and is no longer required
    to exist.


    If main() finishes before the threads it has created, and exits with pthread_exit(),
    the other threads will continue to execute. Otherwise, they will be automatically
    terminated when main() finishes.


    # Example


    This simple example code creates 5 threads with the pthread_create routine. Each
    thread prints a "Hello World!" message, and then terminates with a call to pthread_exit().


    ```

    #include <iostream>

    #include <cstdlib>

    #include <pthread.h>

    ```'
