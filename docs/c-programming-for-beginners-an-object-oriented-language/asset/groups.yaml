    \n| Element | Value |\n| 0 | 100 |\n| 1 | 101 |\n| 2 | 102 |\n| 3 | 103 |\n| 4\
    \ | 104 |\n| 5 | 105 |\n| 6 | 106 |\n| 7 | 107 |\n| 8 | 108 |\n| 9 | 109 |\n\n\
    # Arrays in C++\n\nArrays are important to C++ and need lots of detail. There\
    \ are following important concepts, which should be clear to C++ programmer –\n\
    \n| Sr.No | Description |\n| 1 | Multi-dimensional arrays: C++ supports multidimensional\
    \ arrays. The simplest form of multidimensional array is the two-dimensional array.\
    \ |\n| 2 | Pointer to an array: You can generate a pointer to the first element\
    \ of an array by simply specifying the array name, without any index. |\n| 3 |\
    \ Passing arrays to functions: You can pass to the function a pointer to array\
    \ by specifying the array's name. |\n| 4 | Return array from functions: C++ allows\
    \ a function to return an array. |\n\n# C++ Strings\n\nC++ provides following\
    \ types of string representations –\n\n- The C-style string\n- The string class\
    \ type introduced with Standard++\n\n## C-Style Character String\n\nThe C-style\
    \ string originated within C language and continues to be supported within C++.\
    \ This string is actually a one-dimensional array of characters which is terminated\
    \ by a null character '\\0'. Thus the following declaration and initialization\
    \ create a string consisting of the word \"Hello\". To hold the null character\
    \ at the end of the array, the size of the character array is the number of characters\
    \ in the word \"Hello\".\n\n```cpp\nchar greeting[6] = {'H', 'e', 'l', 'l', 'o',\
    \ '\\0'};\n```\n\nIf you follow the rule of array initialization, you can write\
    \ the above statement as follows –\n\n```cpp\nchar greeting[] = \"Hello\";\n```\n\
    \nFollowing is memory presentation of above defined string in C++ –\n\n| | 0 |\
    \ 1 | 2 | 3 | 4 | 5 |\n|---|---|---|---|---|---|---|\n| Variable | H | e | l |\
    \ l | o | \\0 |\n| Address | 0x23451 | 0x23452 | 0x23453 | 0x23454 | 0x23455 |\
    \ 0x23456 |\n\nActually, you do not place the null character at the end of a string\
    \ constant. The C++ compiler automatically places the '\\0' at the end of the\
    \ string when it initializes the array. Let us try to print above-mentioned string\
    \ –\n\n![](img/e294dced8a6f4af100c41c26bf2dc_72_0.png)\n\n```cpp\n#include <iostream>\n\
    \nusing namespace std;\n\nint main() {\n    char greeting[6] = {'H', 'e', 'l',\
    \ 'l', 'o', '\\0'};\n\n    cout << \"Greeting message: \";\n    cout << greeting\
    \ << endl;\n\n    return 0;\n}\n```\n\nWhen the above code is compiled and executed,\
    \ it produces result -\n\nGreeting message: Hello\n\nC++ supports a wide range\
    \ of functions that manipulate null-terminated strings –\n\n| Sr.No | Function\
    \ & Purpose |\n|---|---|\n| 1 | **strcpy(s1, s2);** Copies s2 into string s1.\
    \ |\n| 2 | **strcat(s1, s2);** Concatenates s2 onto the end of string s1. |\n\
    | 3 | **strlen(s1);** Returns the length of string s1. |\n| 4 | **strcmp(s1, s2);**\
    \ Returns 0 if s1 and s2 are the same; less than 0 if s1<s2; greater than 0 if\
    \ s1>s2. |\n| 5 | **strchr(s1, ch);** Returns a pointer to the first occurrence\
    \ of character ch in string s1. |\n| 6 | **strstr(s1, s2);** Returns a pointer\
    \ to the first occurrence of string s2 in string s1. |\n\nFollowing example makes\
