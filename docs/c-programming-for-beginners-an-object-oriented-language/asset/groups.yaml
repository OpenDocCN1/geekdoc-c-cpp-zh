    \ the access attributes of the members of the class that follows it. A public\
    \ member can be accessed from outside the class anywhere within the scope of the\
    \ class object. You can also specify the members of a class as private or protected\
    \ which we will discuss in a subsection.\n\n### Define C++ Objects\n\nA class\
    \ provides the blueprints for objects\n"
  mdcn: "\n\n# C++ 数据结构\n\nC/C++ 数组允许你定义组合多个相同类型数据项的变量，但**结构体 (structure)** 是另一种用户定义的数据类型，它允许你组合不同类型的数据项。\n\
    \n结构体用于表示记录，假设你想跟踪图书馆中的书籍。你可能想跟踪每本书书的以下属性——\n\n- 标题\n- 作者\n- 主题\n- 图书 ID\n\n###\
    \ 定义结构体\n\n要定义一个结构体，你**必须**使用 `struct` 语句。`struct` 语句为你的程序定义了一个具有多个成员的新数据类型。`struct`\
    \ 语句的格式为——\n\n```\nstruct [structure tag] {\n  member definition;\n  member definition;\n\
    \  ...\n  member definition;\n} [one or more structure variables];\n```\n\n**结构体标签**是可选的，每个成员定义都是一个普通的变量定义，例如\
    \ `int;` 或 `float f;` 或任何其他有效的变量定义。在结构体定义的末尾，最后一个分号之前，你可以指定一个或多个结构体变量，这是可选的。以下是声明\
    \ `Book` 结构体的方式——\n\n```\nstruct Books {\n  char title[50];\n  char author[50];\n\
    \  char subject[100];\n  int book_id;\n} book;\n```\n\n# 访问结构体成员\n\n要访问结构体的任何成员，我们使用成员访问运算符\
    \ (`.`)。成员访问运算符编码为结构体变量名和我们想要访问的结构体成员之间的点。你会使用 `struct` 关键字来定义结构体类型的变量。以下是解释结构体用法的示例——\n\
    \nLive Demo\n\n```cpp\n#include <iostream>\n#include <cstring>\n\nusing namespace\
    \ std;\n\nstruct Books {\n    char title[50];\n    char author[50];\n    char\
    \ subject[100];\n    int book_id;\n};\n\nint main() {\n    struct Book1; // 声明类型为\
    \ Book 的 Book1\n    struct Book2; // 声明类型为 Book 的 Book2\n\n    // book 1 specification\n\
    \    strcpy(Book1.title, \"Learn C++ Programming\");\n    strcpy(Book1.author,\
    \ \"Chand Miyan\");\n    strcpy(Book1.subject, \"C++ Programming\");\n    Book1.book_id\
    \ = 6495407;\n\n    // book 2 specification\n    strcpy(Book2.title, \"Telecom\
    \ Billing\");\n    strcpy(Book2.author, \"Yakit Singha\");\n    strcpy(Book2.subject,\
    \ \"Telecom\");\n    Book2.book_id = 6495700;\n\n    // Print Book1 info\n   \
    \ cout << \"Book 1 title : \" << Book1.title << endl;\n```\ncout << \"Book 1 author\
    \ : \" << Book1.author << endl;\ncout << \"Book 1 subject : \" << Book1.subject\
    \ << endl;\ncout << \"Book 1 id : \" << Book1.book_id << endl;\n\n// Print Book2\
    \ info\ncout << \"Book 2 title : \" << Book2.title << endl;\ncout << \"Book 2\
    \ author : \" << Book2.author << endl;\ncout << \"Book 2 subject : \" << Book2.subject\
    \ << endl;\ncout << \"Book 2 id : \" << Book2.book_id << endl;\n\nreturn 0;\n\
    }\n```\n\n当上述代码被编译并执行时，它会产生以下结果——\n\nBook 1 title : Learn C++ Programming\nBook\
    \ 1 author : Chand Miyan\nBook 1 subject : C++ Programming\nBook 1 id : 6495407\n\
    Book 2 title : Telecom Billing\nBook 2 author : Yakit Singha\nBook 2 subject :\
    \ Telecom\nBook 2 id : 6495700\n\n### 结构体作为函数参数\n\n你可以以传递任何其他变量或指针非常相似的方式将结构体作为函数参数传递。你将以在上面示例中类似的方式访问结构体变量——\n\
    \n![](img/e2949dced8a6f4af100c418c26bfd2dc_94_0.png)\n\n```cpp\n#include <iostream>\n\
    #include <string>\n\nusing namespace std;\nvoid printBook(struct Books book);\n\
    \nstruct Books {\n    char title[50];\n    char author[50];\n    char subject[100];\n\
    \    int book_id;\n};\n\nint main() {\n    struct Books Book1; // 声明类型为 Book 的\
    \ Book1\n    struct Books Book2; // 声明类型为 Book 的 Book2\n\n    // book 1 specification\n\
    \    strcpy(Book1.title, \"Learn C++ Programming\");\n    strcpy(Book1.author,\
    \ \"Chand Miyan\");\n    strcpy(Book1.subject, \"C++ Programming\");\n    Book1.book_id\
    \ = 6495407;\n\n    // book 2 specification\n    strcpy(Book2.title, \"Telecom\
    \ Billing\");\n    strcpy(Book2.author, \"Yakit Singha\");\n    strcpy(Book2.subject,\
