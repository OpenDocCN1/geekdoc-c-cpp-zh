    \ << \"Book id : \" << book->book_id << endl;\n}\n```\n\n# C++ Classes and Objects\n\
    \nThe main purpose of C++ programming is to add object orientation to the C language\
    \ and classes are the central feature of C++ that supports object-oriented programming\
    \ and are often called user-defined types.\n\nA class is used to specify the form\
    \ of an object and it combines data representation and methods for manipulating\
    \ data into one neat package. The data and functions within a class are called\
    \ members of the class.\n\n### C++ Class Definitions\n\nWhen you define a class,\
    \ you define a blueprint for a data type. This doesn't actually define any data,\
    \ but it does define what the class name means, that is, what an object of the\
