  - "[PAGE 188]\n\nexample one user registration ends after completing many pages.\
    \ But how to maintain user's session information across all the web pages.\n\n\
    In many situations, using cookies is the most efficient method of remembering\
    \ and tracking preferences, purchases, commissions, and other information required\
    \ for better visitor experience or site statistics.\n\n# How It Works\n\nYour\
    \ server sends some data to the visitor's browser in the form of a cookie. The\
    \ browser may accept the cookie. If it does, it is stored as a plain text record\
    \ on the visitor's hard drive. Now, when the visitor arrives at another page on\
    \ your site, the cookie is available for retrieval. Once retrieved, your server\
    \ knows/remembers what was stored.\n\nCookies are a plain text record of 5 variable-length\
    \ fields –\n\n+   * **Expires** – This shows date the cookie will expire. If this\
    \ is blank, the cookie will expire when the visitor quits the browser.\n* **Domain**\
    \ – This shows domain name of your site.\n* **Path** – This shows path to the\
    \ directory or web page that set the cookie. This may be blank if you want to\
    \ retrieve the cookie from any directory or page.\n* **Secure** – If this field\
    \ contains the word \"secure\" then the cookie may only be retrieved with a secure\
    \ server. If this field is blank, no such restriction exists.\n* **Name = Value**\
    \ – Cookies are set and retrieved in the form of key and value pairs.\n\n# Setting\
    \ up Cookies\n\nIt is very easy to send cookies to browser. These cookies will\
    \ be sent along with HTTP Header before the Content-type filed. Assuming you want\
    \ to set UserID and Password as cookies. Cookies setting will be done as follows\n\
    \n```\n#include <iostream>\nusing namespace std;\n\nint main () {\n    cout <<\
    \ \"Set-Cookie:UserID = XYZ;\\r\\n\";\n    cout << \"Set-Cookie:Password = XYZ123;\\\
    r\\n\";\n```"
