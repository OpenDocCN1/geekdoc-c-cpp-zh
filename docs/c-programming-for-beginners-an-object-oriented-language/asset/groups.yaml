    \nC++ 中有两种表达式：\n\n- 左值（lvalue）——引用内存位置的表达式称为“值”表达式。左值可以出现在赋值的左侧或右侧。\n- 右值（rvalue）——右值术语指的是存储在内存某些地址上的数据值。右值是一个不能被赋值的表达式，这意味着右值可以出现在赋值的右侧，但不能出现在左侧。\n\
    \n变量是左值，因此可以出现在赋值的左侧。数字字面量是右值，因此不能被赋值且不能出现在左侧。以下是一个有效的语句——\n\n```cpp\nint g =\
    \ 20;\n```\n\n但以下不是有效的语句，并且会产生编译时错误——\n\n```cpp\n10 = 20;\n```\n\n# C++ 中的变量作用域\n\
    \n作用域是程序的一个区域，广义上，变量可以在三个地方声明——\n\n- 在函数或块内部，称为局部变量；\n- 在函数参数的定义中，称为形式参变量；\n-\
    \ 在所有函数外部，称为全局变量。\n\n我们将在随后的章节中学习什么是函数以及它的参数。在这里，让我们解释什么是局部变量和全局变量。\n\n## 局部变量\n\
    \n在函数或块内部声明的变量是局部变量。它们只能被该函数或代码块内部的语句使用。局部变量对外部函数是不可知的。以下是使用局部变量的示例——\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main () {\n    // 局部变量声明:\n \
    \   int a, b;\n    int c;\n\n    // 实际初始化\n    a = 10;\n    b = 20;\n    c = a\
    \ + b;\n\n    cout << c;\n\n    return 0;\n}\n```\n\n## 全局变量\n\n全局变量定义在所有函数外部，通常位于程序的顶部。全局变量在整个程序生命周期内保持其值。\n\
    \n任何函数都可以访问全局变量。也就是说，全局变量在声明后在整个程序中都是可用的。以下是使用全局和局部变量的示例——\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\n// 全局变量声明:\nint g;\n\nint main () {\n  \
    \  // 局部变量声明:\n    int a, b;\n\n    // 实际初始化\n    a = 10;\n    b = 20;\n    g\
    \ = a + b;\n\n    cout << g;\n    return 0;\n}\n```\n\n程序可以为局部和全局变量使用相同的名称，但函数内部局部变量的值具有优先。例如——\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\n// 全局变量声明:\nint g = 20;\n\
    \nint main () {\n// 局部变量声明:\nint g = 10;\n\ncout << g;\n\nreturn 0;\n}\n```\n\n\
    当上述代码被编译并执行时，它产生以下结果——\n\n10\n\n# 初始化局部和全局变量\n\n当定义局部变量时，系统不会对其进行初始化，你必须手动初始化它。全局变量在定义时由系统自动初始化，如下：\n\
    \n| 数据类型 | 初始化器 |\n|---|---|\n| int | 0 |\n| char | 0 |\n| float | 0 |\n| double\
    \ | 0 |\n| pointer | NULL |\n\n妥善初始化是一个良好的习惯，否则程序将产生意外的结果。\n\n# C++常量\n\n常量是指固定值，分为整数字面量、浮点字面量、字符串和布尔值。\n\
    \n## 整数字面量\n\n整数字面量可以是十进制、八进制或十六进制。前缀指定进制：十六进制使用 `0x` 或 `0X`，八进制使用 `0`，十进制为空。\n\
    \n整数字面量还可以带有后缀，该后缀是 `U` 和 `L` 的组合，分别表示无符号和长型。后缀可以是大写也可以是小写。\n\n以下是一些整数字面量的示例：\n\
    \n```\n22      // 合法\n25u     // 合法\n0xFeeL // 合法\n078      // 不法: 8 不是八进制\n032UU\
    \   // 不法: 不能重复后缀\n```\n\n以下是整数字面量的其他示例：\n\n```\n5       // 十进制\n013     // 八进制\n\
    04b     // 十六进制\n30       // int\n30u      // unsigned int\n301      // long\n\
    30ul     // unsigned long\n```\n\n## 浮点字面量\n\n浮点字面量有一个整数部分、小数点、小数部分和一个指数部分。你可以用十进制形式或指数形式表示浮点字面量。\n\
    \n当使用十进制形式表示时，必须包含小数点、指数或两者；当使用指数形式表示时，必须包含整数部分、小数部分或两者。带符号的指数由 `e` 或 `E` 引入。\n\
    \n以下是浮点字面量的示例：\n\n```cpp\n3.14159 // 合法\n314159E-5L // 合法\n510E // 不法: 指数不完整\n\
    210f // 不法: 无小数或指数\n.e55 // 不法: 缺少整数或小数\n```\n\n# 布尔字面量\n\n有两种布尔字面量，它们是标准 C++\
    \ 关键字的一部分：\n\n- 代表真的 `true` 值。\n- 代表假的 `false` 值。\n\n你不应该认为 `true` 的值等于 1，`false`\
    \ 的值等于 0。\n\n# 字符字面量\n\n字符字面量用单引号括起来。如果字面量以 `L` 开（仅大写），它是宽字符字面量（例如 `L'x'`），应存储在\
    \ `wchar_t` 类型变量中。否则，它是窄字符字面量（例如 `'x'`），可以存储在 `char` 类型变量中。\n\n字符字面量可以是普通字符（例如\
    \ `'x'`）、转义序列（例如 `'\\t'`）或通用字符（例如 `'\\u02C0'`）。\n\nC++ 中的某些字符在前面加一个反斜杠时将具有特殊含义，用于表示换行（\n\
    ）或制表符（\t）。以下是此类转义序列代码列表：\n\n| 转义序列 | 含义 |\n|---|---|\n| \\ | \\ 字符 |\n| \\' |\
    \ ' 字符 |\n\n"
