    \ {\n        throw out_of_range(\"Stack is empty\");\n    }\n    return elems.back();\n\
    }\n```\n\n# C++ 处理器 (C++ Preprocessor)\n\n处理器是指令，在编译开始前给编译器提供信息。\n\n所有处理器指令都以\
    \ `#` 开头，且在行指令之前只出现空白字符。处理器指令不是 C++ 语句，它们不以分号（;）结尾。\n\n你已经在所有示例中看到了 `#include`\
    \ 指令。这个宏用于将头文件包含到源文件中。C++ 支持许多处理器指令，如 `#include`、`#define`、`#if`、`#else`、`#line`。让我们看看重要的\n\
    \n## define处理器 (define Preprocessor)\n\n`#define` 处理器创建符号常量。符号常量被称为宏，其通用形式为 `#define\
    \ macro-name replacement-text`\n\n当该行出现在文件中时，文件中后续出现的所有 `macro-name` 都会被 `replacement-text`\
    \ 替换。例如\n\n```cpp\n#include <iostream>\nusing namespace std;\n\n#define PI 3.14159\n\
    \nint main () {\n    cout << \"Value of PI:\" << PI << endl;\n\n    return 0;\n\
    }\n```\n\n现在，让我们对这段代码进行处理以查看结果，假设我们有源文件。所以让我们使用 `-E` 选项编译并将结果重定向到 `test.p`。现在，如果你检查\
    \ `test.p`，\n\n$ gcc -E test.cpp > test.p\n\n它将包含大量信息，在底部你会发现替换如下——\n\n```cpp\n\
    int main() {\n    cout << \"Value of PI : 3.14159 << endl;\n    return 0;\n}\n\
    ```\n\n# 函数类宏 (Function-Like Macros)\n\n你可以使用 `#define` 定义一个如下带有参数的宏\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\n#define MIN(a,b) ((a)<b) ? a : b)\n\
    \nint main() {\n    int i, j;\n    i = 100;\n    j = 30;\n\n    cout << \"The\
    \ minimum is \" << MIN(i, j) << endl;\n\n    return 0;\n}\n```\n\n## 条件编译 (Conditional\
    \ Compilation)\n\n有若干指令可以用于编译程序源代码的选择性部分。这一过程被称为条件编译。\n\n条件处理器结构非常像 `if` 选择结构。考虑以下处理器代码\
    \ \n\n```cpp\n#ifndef NULL\n#define NULL 0\n#endif\n```\n\n"
