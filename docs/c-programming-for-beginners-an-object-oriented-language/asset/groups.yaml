    Random Number : 580322989\n\n# C++ Arrays\n\nC++ provides a data structure, **the\
    \ array**, which stores a fixed-size sequential collection of elements of the\
    \ same type. An array is used to store a collection of data, but it is often more\
    \ useful to think of an array as a collection of variables of the same type.\n\
    \nInstead of declaring individual variables, such as number0, number1, ..., and\
    \ number99, you declare one array variable as numbers and use numbers[0], numbers[1],\
    \ and ..., numbers[99] to represent individual variables. A specific element in\
    \ an array is accessed by an index.\n\nAll arrays consist of contiguous memory\
    \ locations. The lowest address corresponds to the first element and the highest\
    \ address to the last element.\n\n# Declaring Arrays\n\nTo declare an array in\
    \ C++, the programmer specifies the type of the elements and the number of elements\
    \ required by an array as follows – type arrayName [ arraySize ];\n\nThis is called\
    \ a single-dimension array. The **arraySize** must be an integer constant greater\
    \ than zero and **type** can be any valid C++ data type. For example, to declare\
    \ a 10-element array called balance of type double, use this statement –\n\n```cpp\n\
    double balance[10];\n```\n\n# Initializing Arrays\n\nYou can initialize C++ array\
    \ elements either by one or using a single statement as follows –\n\n```cpp\n\
    double balance[5] = {1000.0, 2.0, 3.4, 17.0, 50.0};\n```\n\nThe number of values\
    \ between braces { } can not be larger than the number of elements we declare\
    \ for the array between square brackets [ ]. Following is an example to assign\
    \ a single element of the array –\n\nIf you omit the size of the array, an array\
    \ just big enough to hold the initialization is created. Therefore, if you write\
    \ –\n\n```cpp\ndouble balance[] = {1000.0, 2.0, 3.4, 17.0, 50.0};\n```\n\nYou\
    \ will create exactly the same array as you did in the previous example.\n\nbalance[4]\
    \ = 50.0;\n\nThe above statement assigns element number 5th in the array value\
    \ of 50.0. Array with 4th index will be 5th, i.e., last element because all arrays\
    \ have 0 as the index of their first element which is also called base index.\
    \ Following is the pictorial representation of the same array we discussed above\
    \ –\n\n| 0 | 1 | 2 | 3 | 4 |\n|---|---|---|---|---|---|\n| balance | 1000.0 |\
    \ 2.0 | 3.4 | 17.0 | 50.0 |\n\n# Accessing Array Elements\n\nAn element is accessed\
    \ by indexing the array name. This is done by placing the index of the element\
    \ within square brackets after the name of the array. For example –\n\n```cpp\n\
    double salary = balance[9];\n```\n\nThe above statement will take 10th element\
    \ from the array and assign the value to salary variable. Following is an example,\
    \ which will use all the above-mentioned three concepts viz. declaration, assignment\
    \ and accessing arrays –\n\nLive Demo\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\n#include <iomanip>\nusing std::setw;\n\nint main() {\n    int n[10];\
    \ // n is an array of 10 integers\n\n    // initialize elements of array n to\
