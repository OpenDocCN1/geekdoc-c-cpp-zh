    ```\n\n```cpp\nint main(void) {\n  Rectangle Rect;\n  Triangle Tri;\n\n  Rect.setWidth(5);\n\
    \  Rect.setHeight(7);\n\n  // Print the area of the object.\n  cout << \"Total\
    \ Rectangle area: \" << Rect.getArea() << endl;\n\n  Tri.setWidth(5);\n  Tri.setHeight(7);\n\
    \n  // Print the area of the object.\n  cout << \"Total Triangle area: \" << Tri.getArea()\
    \ << endl;\n\n  return 0;\n}\n```\n\nWhen the above code is compiled and executed,\
    \ it produces the following result –\n\nTotal Rectangle area: 35\nTotal Triangle\
    \ area: 17\n\nYou can see how an abstract class defined an interface in terms\
    \ of getArea and two other classes implemented same function but with different\
    \ algorithm to calculate the area specific to the shape.\n\n## Designing Strategy\n\
    \nAn object-oriented system might use an abstract base class to provide a common\
