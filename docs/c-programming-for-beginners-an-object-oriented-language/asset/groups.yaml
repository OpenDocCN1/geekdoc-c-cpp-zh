    | * | 两个操作数相乘 | A * B 将得到 200 |

    | / | 被除数除以除数 | B / A 将得到 2 |

    | % | 取模运算符，取整数后的余数 | B % A 将得到 0 |

    | 运算符 | | | 示例 |

    | --- | --- | --- |

