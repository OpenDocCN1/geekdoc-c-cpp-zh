- - '#'
  - 如何使用本书：数据结构和算法教科书分为两类：教学文本或百科全书。试图兼顾两者的书通常都会失败。本书旨在作为教学文本。我认为，对于从业者来说，理解选择或设计最能解决问题的数据结构所需的原理，比记忆一系列教科书式的实现更为重要。因此，我将其设计为一种教学文本，涵盖了大多数数据结构但并非所有。书中包含未被广泛采用的数据结构，以说明重要的原理。还包含了未来可能被广泛使用的较新数据结构。
