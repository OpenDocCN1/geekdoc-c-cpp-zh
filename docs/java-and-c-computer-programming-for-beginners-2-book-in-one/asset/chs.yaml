  - 你最大的优势是什么？\n\n# 第 17 章：Java 语言与术语\n\n绝对文件名（Absolute filename）\n绝对文件名是带有从文件系统根目录提供的完整路径的文件，例如\
  \ `c:\\Java\\bin\\javac.exe`。\n\n抽象（Abstraction）\n抽象是对复杂情况的简单表示。通俗地说，抽象隐藏了代码部分是如何工作的，只显示其功能。面向对象设计围绕着在建模现实对象时寻找一个抽象级别。太高会导致捕捉的细节不足；太低则会导致程序变得复杂且难以理解。\n\
  \n抽象方法（Abstract method）\n抽象方法是头部包含关键字 `abstract` 的方法。抽象方法没有方法体。在接口内部设计的任何方法都被认为是抽象的，没有例外。抽象方法的体定义在抽象子类中，或者如果类实现了接口，则定义在该类中。\n\
  \n抽象窗口工具包（Abstract Windowing Toolkit）\nAWT 或抽象窗口工具包包含一组类，旨在使 GUI（图形用户界面）应用程序变得更简单。你可以在\
  \ `java.awt` 包组中找到它们，包含的类有按钮、窗口、文本区域等。\n\n访问方法（Accessor method）\n访问方法是专门设计用于访问私有属性的方法。根据\
  \ Java 规范，访问方法以 `get` 加上属性名开头。例如，为了访问名为 `speed` 的属性，访问方法为 `getSpeed()`。当属性被设置为私有时，它会阻止外部类的对象修改该值，除非使用了修改方法（mutator\
  \ method）。我们可以使用访问方法提供对私有属性值的特定访问，并阻止其他类的对象访问该私有属性——访问方法需要正确的可见性来实现。\n\n执行者（Actor）\n\
  见 client。\n\n实际参数（Actual argument）\n这是从方法外部传递到方法的值。当调用方法时，值（实际参数）将复制到对应的形式参数中。实际参数类型和形式参数类型必须相互兼容。\n\
  \n实际参数（Actual parameter）\n见 actual argument。\n\n地址空间（Address space）\n这是进程运行的虚拟内存区域。\n\
  \n代理（Agent）\n见 server。\n\n聚合（Aggregation）\n这是一个 OOP 概念，一种关系类型，一个对象至少有一个另一个从属对象组成其状态。这些从属对象往往不会在包含它们的对象之外独立存在。当这个对象不再具有存在意义时，它的从属对象也不存在了。例如，你可能有一个\
  \ `GasStation` 对象，它有几个 `pump` 对象。一旦 `GasStation` 对象被销毁或不再使用，`pump` 对象也会随之消失。聚合被称为\
  \ HAS-A 关系，与继承的 IS-A 关系区分开来。\n\n别名（Aliases）\n别名是对一个对象的多个引用。该对象可以接收来自任何别名的消息。\n\n\
  匿名数组（Anonymous array）\n匿名数组是没有标识符的数组。通常作为形式参数创建，例如：\n```java\n// 创建一个整数的匿名数组\nYearlyRainfall\
  \ y2k = new Yearlyfall(new int[]{ 10, 8, 9, 5, 3, 2, 0, 3, 8, 11});\n```\n\n匿名类（Anonymous\
  \ class）\n匿名类是一个没有名字的类。这种类型通常是子类的实现，或者作为方法的返回结果。例如：\n```java\nbutton.addActionListener(new\
  \ ActionListener(){\n    public void actionPerformed(ActionEvent e){\n        System.exit(0);\n\
  \    }\n});\n```\n\n匿名对象（Anonymous object）\n匿名对象是使用标识符创建的。通常是方法的元素。例如：\n```java\n\
  private Point[] vertices = {new Point(0,0),new Point(0,1)};\n```\n\n接口（API）\n见 application\
  \ interface。\n\n追加模式（Append mode）\n追加模式是文件写入的一种模式，文件内容被保留并添加。\n\n小程序（Applet）\nApplet\
  \ 是基于 Applet 类的小型程序。它们主要用于提供页面上的活动内容，并具有限制性。\n\n应用程序（Application）\nApplication 有时与\
  \ program 同义使用，但它是关注的。\n\n应用程序接口（Application interface）\nAPI 是用于编写程序的定义的集。在 Java\
  \ 中，API 是从底向上开始的定义。\n\n二进制（binary）\n二进制是二进制数表示法。在二进制中，只使用 0 和 1 作为数字，数字的位置表示 2 的连续幂。\n\
  见 bit。\n\n二元运算符（Binary operator）\n二元运算符是接受两个操作数的运算符。Java 有几种二元运算符，包括一些算术运算符和布尔运算符。\n\
  \n二分查找（Binary search）\n二分查找是在排序后的数据中进行搜索，首先查看中间位置。搜索将向左或向右移动，消除数据空间的另一侧。每个步骤重复此，直到搜索完所有数据或找到特定项目。\n\
  \n位（Bit）\n位是一个二进制数字。它可以只能取两个值：0 和 1。位是构建数据和程序的单元单元。计算机会在循环的基础上移动数据。\n\n位操作符（Bit\
  \ manipulation operator）\n位操作符，如 `|`，用于操作位。`<<`、`>>` 和 `>>>` 移位运算符也是位操作符。\n\n赋值运算符（Assignment\
  \ operator）\n赋值运算符是一个等号（`=`），用于将表达式的值存储到变量中；例如 `variable = y = 0`。在赋值之前必须评估运算符的右侧。赋值本身可以使用在表达式。\n\
  \n赋值语句（Assignment statement）\n赋值语句是包含赋值运算符的语句。\n\n属性（Attribute）\n属性是实例变量的特定用法。类实例中的属性值定义了特定实例的状态。类定义可以通过要求给定的属性或属性不取特定值来实施约束。例如，如果属性持有类的考试结果，它不应该有负值。属性可以使用修改方法和访问方法进行操作。\n\
  \n基础情况（Base case）\n基础情况是通过递归方法时采取的非递归路径。\n\n基本类型（Base type）\n基本类型指示数组中的项目类型，例如：\n\
  ```java\nint[] numbers;\n```\nNumbers 的基本类型是 `int`。如果基础情况是类类型，它将指示数组可以存储对象的最低超类型。例如：\n\
  ```java\nShip[] berths;\n```\n存储在 berths 中的所有内容都是 Ship 类的实例。如果数组的基本类型是 `Object`，它可以用于存储任何类的实例。\n\
  \n算术运算符（Arithmetic operator）\n运算符包括 `+`、`-`、`*`。\n\n网（Arpanet）\nArpanet 是在互联网之前的网络。\n\
  \n数组（Array）\n数组是固定大小的对象，可以持有项目。\n\n数组初始化器（Array initializer）\n数组初始化器用于初始化数组。例如：\n\
  ```java\nint[] pair = { 4, 2 };\n```\n同于以下语句：\n```java\nint[] pair;\npair[0] = 4;\n\
  pair[1] = 2;\n```\n\n\n\n\n\n# 第一章：什么是 C 语言？\n\n![Tecnologia, Intelligenza Artificiale,\
  \ Cervello, Pensare](img/image_rsrc3YZ.jpg)\n\n本书是对 C 语言的全面介绍，并带有深度示例。人们经常误认为，由于\
  \ `Java` 和 `Python` 等现代编程语言的出现，C 语言已经失去了它的热度。然而，许多初学者并不理解，`C` 仍然被广泛用于开发编译器和操作系统。C\
  \ 语言中使用的许多高级编程概念仍被认为是为了更好地理解编程的途径。本章将详细介绍 C 语言的各种重要特性。我们建议你使用你喜欢的操作系统来尝试书中介绍的程序。让我们开始吧！\n\
  \n## C 语言的历史\n\n在开始讨论某门编程语言的特定组件、原理和哲学之前，讨论其历史是必要的。在 20 世纪 70 年代，编程行业非常小，有效的编程语言也很少，丹尼斯·里奇（Denis\
  \ Ritchie）在贝尔实验室发明了 `C`。他开发 `C` 语言是为了开发贝尔实验室正尝试构建的 `UNIX` 操作系统。`UNIX` 系统的几乎所有组件都是使用\
  \ `C` 编程语言大量编写的。许多图形用户功能也是通过 `C` 语言的帮助实现的。幸运的是，`UNIX` 在技术领域变得非常流行，并为 `C` 带来了所需的普及。随着\
  \ `C` 语言的最初成功，丹尼斯·里奇和贝尔实验室开始在不同的操作系统分发 `C` 语言。过去配备 `C` 语言的著名操作系统之一是 `IBM PC`。许多计算机相关行业在开发\
  \ `C` 编程应用程序时开始实现他们的代码。因此，在很短的时间内，`C` 演变成了最流行的中间级语言之一。即使在发明 50 年后，`C` 仍然被认为是世界上见过的最重要的中间语言之一。它仍然被广泛用于开发系统编程应用程序以及处理机器人和电动汽车等硬件设备的人工智能应用程序。\n\
  \n## 为什么它如此特别？\n\n首先，要理解 `C` 语言被认为不适合开发现代 Web 和移动端应用程序。有诸如 `Java`、`Php` 等现代编程语言可以实现此目的。`C`\
  \ 语言编程专门用于我们需要与硬件进行底层交互的真实世界系统应用。现代编程语言对于此类实现提供的库非常少，而且程序结构实际上非常糟糕，这导致它们几乎无法与硬件的低层组件进行有效交互。而\
  \ `C` 由于其所遵循的语法结构和程序流程流，可以非常有效地与硬件组件交互。这就是为什么 `C` 仍然被认为是创建新操作系统和编译器的最佳选择。\n\n##\
  \ C 语言的特性\n\n尽管 `C` 处理的是底层硬件资源，但它通常被认为是一种中间级语言，因为它整合了各种高级编程语言的能力，例如整洁的语法和组织化结构。`C`\
  \ 语言也广为人知，是因为它被用作哈佛、斯坦福、普林斯顿等许多大学的入门级教学资源。在 `C` 语言开发的初始阶段，由于许多公司创建了可以添加到语言中的不同库和功能，程序员很难为该编程语言开发系统性的更新。由于由于原因，国际标准组织（`ISO`）开始为\
  \ `C` 编程语言声明各个库函数。建议所有程序员使用这种相应的格式以获得更好的结果。你可以从官方 `C` 语言网站找到最新的指南。\n\n以下是 `C` 语言的一些基本特性：\n\
  \n1. **可移植性**：`C` 语言被认为极具可移植性，可以在任何操作系统上执行。此前，它是为了运行在 `MS-DOS` 系统而开发的。但随着 Windows、`Mac`\
  \ 和 `Linux` 操作系统的爆发，`C` 扩展了它支持不同操作系统的能力。许多第三方软件开发者也开发了数十种编译器来有效运行 `C` 语言程序。\n2.\
  \ **轻量级**：`C` 语言通常认为比今天占据主流行业的其他高级编程语言更轻量。即使是 `C` 语言的继承者 `C++` 实现的代码行也比 `C` 多。`C`\
  \ 具有轻量特性的原因源于其有效的语法原则。许多现代编程语言如 `Java`、`Scala` 被强制复杂的样板代码语法在各种平台上运行应用程序。相比之下，`C`\
  \ 使用简单且严格的语法，使语言成为一个轻量级的编程实体。\n3. **函数式编程**：`C` 与其他高级语言之间最重要的区别是它支持函数式编程。它使用过程以重复模式完成任务。其他高级语言使用面向对象的范式来实现软件中的不同功能。函数式编程通常被认为开发系统级应用是有效的。然而，随着最新的更新，我们也可以在\
  \ `C` 语言中实现面向对象的范式。在彻底检查后，我们对 `C` 语言提供的面向对象编程功能并不完全满意。如果你热于开发面向对象范式的应用程序，我们建议你学习\
  \ `Python` 或 `Java`。如果你习惯简单、有效的范式，我们建议你尝试 `C` 提供的过程化编程。\n4. **可扩展性**：`C` 语言的重要特性之一是它可以根据我们的目的进行扩展。许多空间通信设施（如\
  \ `NASA`）使用这种功能来开发可以与硬件机器和火箭交互的库。由于由于原因，在语言中添加我们自己的功能在开发类似于 `Windows` 或 `Mac` 的操作系统时非常有用。\n\
  5. **指针的使用**：指针是 `C` 语言中的一项高级特性，用于指向变量的硬件值。指针可以指向内存位置，并在程序中实现复杂功能。很少有语言使用指针来表示存储位置。尽管有缺点，指针仍然是实现复杂功能的宝贵资源。\n\
  6. **庞大的函数库**：`C` 提供了大量的系统函数。这些函数用于目的并可以用于开发高级应用程序。我们将在后面的章节中详细讨论不同的函数和字符串处理。\n\n\
  除了这些特性，`C` 语言也是一种开源资源且免费使用。通过这些，我们完成了对 `C` 语言的简要介绍。本章作为专家对 `C` 语言的介绍。在接下来的章节中，我们将这里介绍的概念的延续，详细讨论各种优势和应用。让我们开始吧！\n\
  \n# 第二章：为什么 C 语言很重要？\n\n![Codice Binario, Digitale, Sistema Binario](img/image_rsrc3Z.jpg)\n\
  \n上一章以全面的方式介绍了 `C` 语言的重要和历史。本章进一步扩展了上一章介绍的概念。我们将详细讨论可用的 `C` 版本以及优势和应用。这是一个理论性的章节，可以帮助你在处理问题时在脑海中建立一些基础思想。跟随了解更多！\n\
  \n## 为什么 C 编程很重要？\n\n首先，要理解 `C` 语言被认为不适合开发现代 Web 和移动端应用程序。有诸如 `Java`、`Php` 等现代编程语言可以实现此目的。`C`\
  \ 语言编程专门用于我们需要与硬件进行底层交互的真实世界系统应用。现代编程语言对于此类实现提供的库非常少，而且程序结构实际上非常糟糕，这导致它们几乎无法与硬件的低层组件进行有效交互。而\
  \ `C` 由于其所遵循的语法结构和程序流程流，可以非常有效地与硬件组件交互。这就是为什么 `C` 仍然被认为是创建新操作系统和编译器的最佳选择。\n\n##\
  \ C 语言的优势\n\n1. **快速**：`C` 的重要优势是它可以直接处理硬件资源。与其他语言相比的优势使得 `C` 成为一种快速的语言。\n2. **可移植性**：可移植性是\
  \ `C` 成功的因素之一。过去，汇编语言使可移植变得困难，并强制程序员创建多个版本。\n3. **模块化**：`C` 语言允许你以模块实体的形式存储代码片段。这些是可以导入的用户自定义函数。模块化是可扩展的并可以解决很多问题。\n\
  4. **静态类型语言**：编程领域中静态和动态语言之间有很多争论。静态和类型语言的区别在于在编译期间，静态类型语言显示错误的速度更快。\n5. **学习资源**：`C`\
  \ 语言除了拥有许多优势，还可以帮助你深入理解。许多编程语言是动态的且不会提供方法。\n6. **理解其他语言的重要性**：`C` 是理解 `Python`、`C++`\
  \ 等不同语言的学习途径。这些编程语言的许多编译器、解释器和 IDE 都是使用 `C` 开发的。\n\n# 第五章：编写你的第一个程序\n\n![Calcolatrice,\
  \ Mano, Robot, Contare, Macchina](img/image_rsrc33.jpg)\n\n结合解释编程语言使用的语法结构和过程控制的示例，可以更好地编程。本章是全面的，我们提供了\
  \ `C` 语言示例并探索它的组件。记住，本章中解释的许多概念将在书的后续章节中详细讨论。现在，通过示例理解 `C` 编程语言的细节。\n\n## 第一个 C\
  \ 程序\n\n```c\n#include<stdio.h>\n// 这里，你应该输入主程序\nint main() {\n    printf(\" Christmas\
  \ is coming soon\");\n    // 如果需要，你可以在这里输入 return 关键字\n    return 0;\n}\n```\n\n\
  注意：记住在 `C` 语言中，大写和小写字母之间没有区别。此外，允许使用空白符，你可以从行的任何位置开始程序。然而，建议遵循设计指南以创建可读的编程代码。始终遵循国际标准组织（`ISO`）指定的指南。\n\
  \n1. `#include <stdio.h>`：这是导入库并在程序中使用其中现有函数的简单方法。在每个 `C` 程序中包含 `stdio.h` 是强制的，因为导入了主要的输入和输出函数，如\
  \ `printf` 和 `scanf`。每当你导入用于程序代码的库时，都需要这种格式。例如，`#include <math.h>` 导入所有的系统数学函数，而\
  \ `#include<time.h>` 包含了所有的系统时间函数。这些在编程术语中也被称为预处理器。\n2. `int main(void)`：这里，`main`\
  \ 是主程序。由于由于原因，在是 `C` 语言提供的功能。在彻底检查后，我们对 `C` 语言提供的面向对象编程功能并不完全满意。我们建议你学习 `Python`\
  \ 或 `Java`，如果你热于开发面向对象范式的应用程序。如果你习惯简单、有效的范式，我们建议你尝试 `C` 提供的过程化编程。\n3. `printf(\"\
  \ Christmas is coming soon\")`：这是输出语句。\n4. `return 0;`：这是返回语句。\n\n"
