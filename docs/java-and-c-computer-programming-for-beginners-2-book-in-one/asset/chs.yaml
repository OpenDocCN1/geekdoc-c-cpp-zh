  \ (OR)\n*   `==` - 等于\n*   `!` - 非 (NOT)\n\n第一个是一对与 符号，用于同时测试两个或多个条件。我们正在检查用户是否大于\
  \ 18 岁且小于 40 岁——记住，我们正在检查的是名为 `user` 的变量。第一个条件是“大于 18”，第二个条件是“小于 40”。在这两个条件之间，我们使用了\
