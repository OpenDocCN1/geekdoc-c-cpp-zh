  \ 2\n\n# 第 8 章：Java 数据结构与算法\n![Steinzeitcomputer, Calcolatore, Monumento, Betonrechner](img/image_rsrc3YR.jpg)\n\
  \n为了为了更清楚，假设有一个类 `Human`。这个 `class` 将具有身高、体重、性别、种族等属性。`human` 类还可以有 `run`、`walk`、`talk`\
  \ 等方法。这些理论组件构成了 `human` 类，它是对象的蓝图。现在类已经定义好了，程序员如果愿意，可以使用 `human` 类作为蓝图创建对象。他们可以调用类\
  \ `Human` 并填充（populate）它的属性，赋予它特定的身高、体重、性别和种族。此外，对象已经具有内置函数，如 `run`、`walk` 和 `talk`，因此在创建对象时（例如从\
  \ `Human` 类中创建一个名为 `Mike` 的对象），它已经包含了运行、行走和说话的功能，而无需程序员再次编写这些特定函数，因为它们已经“固有”于所创建的对象中了。\n\
  \n简而言之，这就是面向对象编程的意图：一种编程方式，允许程序员利用预定义的类，这样就可以更容易描述它们，并使用它们的内部或内置函数来对其进行操作。假设读者不是编程的完全新手，并且已经通过\
  \ C 或或其他过程化倾向的语言接触过编程世界，那么下一个逻辑问题就是：为什么要用面向对象编程呢？\n\n嗯，它的主要优势之一是从长远来看，它可以节省时间。在简单的算法和程序中，过程化编程通常要更快、更直接；而不需要构建和定义类，并基于该类创建对象，程序员真正只需要简单地声明必要的变量并编写函数，创建算法来解决他们代码需要处理的问题。然而，当涉及到更复杂的程序、需要复杂的解决方案时，这就是面向对象编程开始发光的地方，也是它开始展现实力的地方。在许多程序中，会有某些时刻许多“对象”或数据簇需要组合在一起，程序员将以某种方式处理它们。这就是“类”的意图所在。与其声明一组新变量，他们只需要只需要创建一个正确大小的“类”，然后从第一个数组复制所有元素到新的数组。如果程序员用过程化的方式编写一个象棋游戏，那么他们必须手动描述每个棋子，所有的兵、主教、车、皇后和王。但是，如果程序员使用面向对象编程，而不是编写所有的兵、主教、车、皇后和王，他们只需要一个“类”来描述棋盘上的每个棋子。程序员现在可以简单地在类中包含函数，允许每个棋子以自己的方式移动。无论是白方的兵还是黑方的兵，这些都是通过“类”的属性部分插入的。现在这种方式更简单、更短、更优雅。\n\
  \n# 第 9 章：数组\n![Pensione, Università, Ricerca, Insegnamento](img/image_rsrc3YS.jpg)\n\
  \n数组是元素的序列；每个元素必须与一个或多个位置相关。数组是存储数据的内存位置。索引是非负整数。\n\n## 一维数组\n一维数组是所有数组中最简单的。我们可以使用三种独立的技术来创建一维数组：\n\
  - 仅使用初始化器\n- 仅使用 `new` 关键字\n- 同时使用初始化器和 new 关键字\n\n### 仅使用初始化器\n使用初始化器创建一维数组的语法是。这种语法表示一维数组是可选的表达式列表，每个表达式用逗号分隔，全部位于大括号之间。所有表达式必须求值为兼容的类型。例如，如果你有一个两个元素的\
  \ double 类型一维数组，这两个元素中的可以是 double 类型，而另一个可能是整数或浮点数。看这个示例：\n```\n{ 'J', 'a', 'v',\
  \ 'a' }\n```\n\n#### 使用 new 关键字\n`new` 关键字用于分配数组内存并返回数组引用。语法是：\n`new type [int_expr]`\n\
  语法告诉我们一维数组是一系列正元素，都是 int（整数）类型。数组中的所有元素将被置零，并被解释为以下之一：\n- 0\n- 0L\n- 0.0F\n- 0.0\n\
  - false\n- null\n- '\\u0000'\n例如：\n```\nnew char[4]\n```\n\n#### 使用初始化器和 new 关键字\n\
  同时使用初始化器和 new 关键字创建数组的语法是上述两种独立语法方法的组合：\n`new type [] {expr (,, expr)*}`\n因为我们可以通过查看逗号分隔的表达式列表计算出一维数组中有多少元素，所以我们不需要、也不必须在方括号内使用\
  \ `int_expr`。\n例如：\n```\nnew char[] { 'J', 'a', 'v', 'a' }\n```\n值得注意的是，仅使用初始化器的语法与使用初始化器和\
  \ new 关键字的语法之间没有区别。第一种（仅使用初始化器）被称为“语法糖”这只是意味着语法更易用。\n\n## 数组变量\n单就本身而言，新的一维数组是完全没用的。要让它产生价值，我们必须首先将其引用赋值给具有兼容类型的数组变量，我们可以通过两种方式实现——直接赋值或使用方法调用。以下示例显示了如何声明变量：\n\
  `type var_name [] type[]`\n这两种语法都是声明存储一维数组引用的变量。你可以使用任何你喜欢的类型，但首选方法是第一种，在变量后带有方括号。在这些示例中，有三个数组变量——`name1`、`name2`\
  \ 和 `name3`。方括号告诉 Java 这些变量每个将存储一维数组的引用。`char` 关键字表示数组中的每个元素将具有相同类型。同样重要的是，数组的大小是固定的，一旦创建就不能更改。如果需要不同大小的数组，你需要创建一个正确大小的新数组，然后从第一个数组复制所有元素到新的数组。\n\
