  \ 变量的值为 21，因此 `else if` 大括号之间的消息将显示在输出窗口中。\n\n## 嵌套 IF 语句\n看看大括号的位置——只要有一组括号放错位置或漏掉一个，代码将无法运行。嵌套\
  \ IF 语句可能有一点复杂，但实际上，你所做的只是缩小范围。\n\n## 布尔值\n与其使用 `int`、`double` 或 `string`，你只需要输入\
  \ `boolean`（小写 `b`），然后在变量名之后，分配一个 `TRUE` 或 `FALSE` 值。注意，我们使用单等号作为赋值运算符。如果你想查看一个变量是否“等于”，则需要使用一对等号。\n\
