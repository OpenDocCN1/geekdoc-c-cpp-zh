  \n## Switch 语句\n另一种控制流的方法是使用 `switch` 语句。它为你提供了测试变量范围范围的选项，并可以用来替代复杂的、长 `IF … ELSE`\
  \ 语句。以 `switch` 单词开始，然后是一对括号。你正在检查的变量放在 `switch` 括号之间，后面跟着一组大括号。`switch` 语句的其余部分放在大括号之间。\n\
  \n# 第 14 章：Java GUI 编程\n假设读者并不是编程的完全新手，并且已经通过 `C` 或或其他侧重过程的语言接触了编程世界，那么下一个逻辑问题将是：为什么要使用面向对象编程呢？嗯，它的主要优势之一是，从长远来看，它可以节省时间。\n\
  \n## 如何用 Java 构建一个小游戏\n在较简单的算法和程序中，过程化编程通常要快得多且直接；程序员不需要构建和定义一个 `class` 并基于该类创建对象，他们真正需要做的只是声明必要的变量并编写\
  \ `functions`，然后创建算法来解决代码需要处理的问题。\n\n然而，当涉及到更复杂的程序、需要更复杂的解决方案时，这就是面向对象编程开始发光的地方，也是它开始展现实力的地方。在许多程序中，会有某些时候需要若干个“对象”或数据簇。\n\
  \n\n\n\n\n你已经熟悉了前两个——`public` 和 `private`。当变量被声明为 `public` 时，它可以在你编写的程序的任何地方使用。相比之下，当它为\
  \ `private` 时，它在实例化它的类体之外的任何地方都无法可见或访问。\n\n让我们来看看另外两个访问控制修饰符。列表中的下一个是 `protected`——它在你想要创建库（libs）时非常有用。当变量是\
  \ `protected` 时，意味着它只能在实例化它的包内可见——注意，这也包含了子类。\n\n另一方面，`default` 访问控制修饰符是指在没有指定另外三个修饰符时使用的变量。在这种模式下，变量可以被程序员在其实例化的包内访问。然而，请注意，该变量仅在类的主体内可访问，且在子类中不可用。\n\
  \n### 抽象与封装\n\n关于你在方法内部创建的变量，还有一点你应该记住：你只能为它指定其中一个关键字：`final`。方法体内部的变量不能是 `public`、`protected`\
  \ 甚至 `private`。\n\n什么是封装？信息隐藏？乍看之下，封装和信息隐藏似乎是一样的，但这两个术语之间确实存在细微的。现在许多作者交替使用这些术语。我们在这里使用描述来区分\
  \ Java 编程中这两个概念的区别，因为我们之前就停留在那里。\n\n“信息隐藏”意味着什么。它仅仅意味着程序执行的实际功能被隐藏了。忽略了底层细节，以便程序员能够关注更重要的事情。这就是为什么在\
  \ Java 中数据是抽象的。你可以创建类、对象以及程序的其他元素；你甚至从一个对象导入到另一个对象，而无需担心该对象是如何运行的细节。这就像开车。你只需要知道把钥匙插入锁孔启动汽车，你就不需要担心它是如何运作、下面的电线是如何连接的、汽油去哪里。你只需要担心启动汽车并安全驾驶。另一方面，封装允许用户控制对象对类的其他部分的影响程度。\n\
  \n“封装”（encapsulate）一词的意思是将所有内容封闭在一个单一的单元中。这意味着根据 Java 系统的设计方式，单元之间将没有依赖关系。记住，Java\
  \ 环境中的对象应该是立独立的，并且没有全局变量。\n\n抽象（Abstraction）简单指的是隐藏对象不必要的细节并只显示相关的细节。另一方面，封装简单意味着将对象的状态和方法绑定在一起。这种绑定最终创建了所谓的类（我们稍后会介绍）。最后，消息传递（message\
  \ passing）指的是对象与其他对象进行交互的能力。\n\n另一方面，高级语言具有更高层次的抽象，意味着代码在计算机能够使用它之前，会通过一个充当计算机翻译器的编译器。这种抽象层级通常到了编程语言已经具有与英语（一种全球语言）相似的语法的程度。编译器充当了高级语言和机器之间翻译器的角色。这允许程序员以更自然的方式编写程序，因为它允许编码者使用更“自然”的语言，而且高级语言允许某些功能实现自动化，让编码者的生活变得简单得多。然而，这里的权衡是代码必须经过编译器，这会导致程序运行和执行的时间增加，而且与低级语言相比，计算机通常会使用更多的内存。在这些高级语言中，包含了广为人知的语言，如\
  \ `Python`、`C++` 以及我们今天的话题 `Java`。\n\n# 第 16 章：Java 面试题\n\n## Java 编程语言\n- 什么是 JAVA\
