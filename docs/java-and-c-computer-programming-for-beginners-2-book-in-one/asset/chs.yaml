- "# 初学者指南：Java 与 C 计算机编程二合一\n\n\n\n![](img/image_rsrc3YB.jpg)\n\n\n\n\n\n\n## 引言\n\
  \nJava 的历史可以追溯到 1991 年，当时程序员 Patrick Haughton、Mike Sheridan 和 James Gosling 构想了一种最适合用于数字电视开发的编程语言。然而，它被认为远超时代，因此他们基于\
  \ `C` 和 `C++` 平台对其重新开发，使其更易用、更具效益。\n\n随着重新开发而来 Java 的核心原则：\n- 它必须具有可移植性——或者说它应该在尽可能平台上运行，而没有任何一个平台的效果不如其他；\n\
  - 使用应该是安全的——并且绝对经过了良好的加密\n- 人们应该在尽可能短的时间建立联系，这意味着他们应该使用一些他们熟悉的单词，尽管初看起来很复杂，但迟晚他们都会意识到它是实际上有效的；\n\
  - 它应该是动态的，应该在线程中运行，并在需要时进行修改，并且\n- 它的执行应该是精确的。\n\n如所示，这些核心原则让你觉得程序员确实为人们制作了 Java——这样他们不需要购买太多设备就可以可以使用更多程序。\n\
  \n1995 年，Sun Microsystems 最后发布了 Java 1.0——这是 Java 的首次公开诞生，具有惊人的安全性、免费的运行时以及跨所有网络的文件限制。多年来，又发布了\
  \ 7 个 Java 版本，从 2006 年起，Java 开始通过 GNU（或通用公共许可证）提供——这意味着它现在是一种免费的开源编程语言。这源于曾经发生过的一次公众抗议，当时部分内容被私有化并仅供付费，这绝对与其核心原则不符。\n\
  \n现在开始阅读这本书，你将学习更多 Java 的知识\n\n## 第 1 章：什么是 Java?\n\nJava 是由 Sun Microsystems 构建的编程语言，后来被\
  \ Oracle 公司收购。它被设计为运行在任何支持 Java 的操作系统上。这就是该语言如此流行的原因，因为开发者只需要编写一次程序，程序就可以在任何操作系统上运行。\n\
  \n在整个课程中，你将学习如何编写上述程序，并学习高级概念。Java 的一些设计目标如下：\n- 语言旨在编写一次，并能够在任何操作系统上运行。\n- 语言应该支持多种软件。\n\
  - 语言旨在用于分布式环境。\n可移植性是一个重要因素。国际化支持非常重要。\n\n### 强类型检查\n\nJava 是一种强类型语言。每个定义的变量都需要关联到一个数据类型。\n\
  \n```\nint i=5;\n```\n\n在这里我们将 `i` 定义为某种用于存储值的。该值取决于数据类型。\n\n### 数组检查\n\n在运行时，Java\
  \ 会检查数组是否具有所需的值。如果尝试访问数组边界之外的值，将抛出异常 `java.lang.ArrayIndexOutOfBoundsException`\n\
  \n```\nint[] array1 = new int[2];\narray1[0] = 1;\narray1[1] = 2;\narray1[2] = 3;\n\
  ```\n\n通过这段代码我们可以看到数组已经超出了它的范围。\n\n## 第 2 章：为什么 Java 很重要？\n\n接下来，Java 具有与 C 和 C++\
  \ 等编程语言类似的语法和特性。如果你有任何编程经验，你会发现学习 Java 非常轻松。即使是对编程完全陌生，也可以放心 Java 设计得相对容易学习。正如前面提到的，Java\
  \ 代码被编译成字节码，可以在任何具有 Java 虚拟机的机器上运行。因此，使用 Java 你可以在任何地方编写代码。\n\n### 为什么 Java?\n\n\
  当然，使用 Java 的关键原因之一是它对面向对象编程的关注。面向对象编程是一种编程模型，允许程序代码围绕数据而非函数进行组织，这被称为过程化编程。这些“数据簇”被组织成“对象”，这就是面向对象编程的名称。在传统意义上，类是创建对象的。类的属性是对象所拥有的原始数据：这些是它的描述符，例如它拥有的值，以及构成对象的相关数据。第二个标准是对象的“方法”。这种“方法”是行为，或类内部的逻辑序列，描述了它如何交互或可以如何交互。\n\
  \n### Java 是如何成功的？\n\nJava 成为如此广泛的语言有很多原因，归功于它被设计的核心原则。Java 的第一个原则之一是易用性。Java 语言的基础借鉴自\
  \ `C++`，另一种非常流行的语言。然而，尽管 `C++` 及其前身 `C` 是强大的语言，但它们的语法往往很复杂，并不完全适应某些用户。Java 也是一种非常可靠的编程语言，旨在减少并消除由于程序员错误引起的致命错误。Java\
  \ 高度依赖面向对象的原则，这允许数据和数据操作封装在一起，使 Java 更健壮且模块化，允许根据需要更换代码。除了之前的易用性和可靠性之外外，考虑到 Java\
  \ 最初是为移动设备设计的，它旨在为其编程提供更高水平的安全性和保护，因为它要在网络上交换数据。\n\nJava 已发展成为一种相对平台无关的语言，这对其有利。Java\
  \ 被编写成一种可移植且跨平台工作的语言，这意味着无论机器拥有什么操作系统、运行什么硬件或运行在什么设备上都无关。这导致了它的适应性和在全球范围内的广泛使用。由于开发\
  \ Java 的 Sun Microsystems 团队优先考虑这些核心原则：易用性、可靠性、安全性、跨平台适应性，Java 并且一直是今天最流行和最广泛使用的语言之一。\n\
  \n### Java 标记\n\nJava 标记比其他整数小的值。这些数字落在 -32768 和 32667 之间。我使用的代码不适用于 `short`，相反，我将使用\
  \ `short` 函数，以确保值落在设定的限制范围内。\n\n大值将与浮点值一起存储在 `double` 值中。如果我可以使用浮点数，则不需要使用 `double`。当我存储一个浮点变量时，我将在我的数值末尾加上一个字母。这个值应该是\
  \ `f`，因为它是一个浮点数。\n\n### 关键字\n\n在 Java 中，`Boolean` 类型指的是假或真值。Java 使用保留关键字来判断它是真是假。因此，一个\
  \ `Boolean` 类型的表达式将假设这些值之一。示例包括：\n\n\n\n\n\n### 运算符概览\n- 逻辑运算符\n- 位运算符运算符\n- 关系运算符\n\
  - 算术运算符\n\n和其他计算机语言一样，Java 拥有一组定义的额外运算符用于处理某些特定场景。在学习 Java 编程语言（或任何编程语言）时，在开始之前你必须理解五个基本概念。这五个基本概念包括：\n\
  \n1. 变量\n2. 数据结构\n3. 控制结构\n4. 语法\n5. 工具\n\n每一个概念都将从初学者水平进行彻底解释，以确保它们被理解。\n\n## 分隔符\n\
  它们不适用于高级抽象：请注意，许多此类程序使用了低级结构，而这些结构主要用于低级抽象。这些编程语言的通常方法是关注机器的——如何让计算机执行某些操作，而不是这些功能如何帮助解决用户的问题。这些语言处理的是微小的细节，这已经超出了高级抽象的范围，而高级抽象是我们今天看到的常见方法。在低级抽象中，数据结构和算法是分开考虑的，而在高级抽象中，它们被视为一个整体。\n\
  \n## 字面量\n提到 Java 中的字面量时，我们指的是以人类可读的形式出现的固定值。我们可以说数字 `200` 是一个字面量。大多数时候，字面量可以是常量。字面量在程序中很重要。事实上，大多数\
  \ Java 程序都使用字面量。我们在书中已经讨论的一些程序也使用了字面量。Java 中的字面量涵盖各种原始数据类型。\n\n每个字面量的显示方式由其类型决定。正如之前提到的，我们将字符常量括在单引号中，例如\
  \ `'c'` 和 `'%'`。我们定义的整数字面量不包含小数部分。例如，`12` 和 `-30` 是整数字面量。浮点数字面量应该包含小数点加小数部分。`12.389`\
  \ 是浮点字面量。Java 进一步允许对浮点字面量使用科学计数法。整数字面量包含 `int` 值，任何人可以使用 `short`、`byte` 和 `char`\
  \ 变量对其进行初始化。\n\n## 注释\n当这种情况发生时，我们称之为注释。在程序的运行阶段，注释是无意义的。这意味着你可以使用注释功能来说明或解释你正在创建的代码想要实现的目标。你可以通过输入两个斜杠然后跟注释来实现这一点。\n\
  \n```java\n//在此处放置你的单行注释\n```\n\n你可以通过执行以下任一操作拥有多行注释：\n\n```java\n//我们将把\n// 注释分成两行\n\
  /*\n```\n\n\n\n\n此注释跨越了两行.*/如果你查看上面的注释，你会注意到它以 `/*` 开头，以 `*/` 结尾。此外，如果你查看之前的图片（图\
  \ 8），你会注意到有些注释以单个正斜杠和两个星号（`/**`）开始，但以一个星号和一个正斜杠结束；这被称为 Javadoc 注释。\n\n# 第 4 节：什么是\
  \ Java 虚拟机？\n\n![Intelligenza Artificiale, Cervello, Pensare, Controllo](img/image_rsrc3YF.jpg)\n\
  \n虚拟机是模拟物理机器的软件。在传统的编程语言中，代码被编译成特定平台的机器语言。在 Java 中，代码被编译成一种名为 `bytecode`（字节码）的虚拟机语言。`JVM`\
  \ 充当 `bytecode` 和底层物理机器之间的中介。每个支持 Java 的平台都有自己的 `JVM` 实现。Java 应用程序是可移植的，因为每个 `JVM`\
  \ 均遵循标准接口。\n\n`JVM` 和标准库的发行包称为 Java 运行环境 (`JRE`)。`JRE` 和开发工具（如编译器和调试器）的发行包称为 Java\
  \ 开发工具包 (`JDK`)。\n\n回到我们之前介绍的初始问题（即让计算 `add 1 + 1`），现在我们有了一组指令（即你的算法）来解决这个问题，你接下来需要做的事情是将它们翻译成计算机可以理解的指令。记住，计算机不讲英语或任何其他人类语言。正如之前解释过的，你需要将所有这些指令翻译成一系列二进制信号。但完成所有的翻译工作将花费你大量的时间。记住，每个字符至少由\
  \ 8 位组成。之后，你需要将它们串成实际指令来访问计算机内存，然后进行数学运算等——简而言之，这是一个巨大的混乱。没有人想处理那些事情。\n\n所以，你说一种语言，而计算机说另一种语言。那么，你如何让双方在中间汇合呢？这就是\
  \ Java 这样的编程语言大显用场的地方。把编程语言看作一种计算机和人类都能理解的中间语言——通俗来说，我们稍后会澄清这背后的细节。\n\n这里的目标是让计算机理解你的指令。在实现这一点之前会发生两个阶段。第一步是使用编程语言编写你的算法。是的，一种你和机器之间的中间语言。嗯，尽管它已经是\
  \ Java 代码，计算机仍然无法完全理解你编写的所有内容。这就是第二步介入的地方（记得是两步吗？）——你的 Java 代码将由一个名为编译器（compiler）的程序处理。正如之前在介绍\
  \ Java 平台组件时解释过的，`compiler` 是一个将你的编程代码翻译成机器可读指令（即你的计算机可以理解的指令）的程序或应用程序。\n\n实际上在后台还会发生几件事，例如预编译步骤以及访问\
  \ Java 库（之前提到的），然后通过汇编器实际翻译成二进制代码，并在你编写的原始代码中添加更多行。再次，这一切都是在后台发生的。作为一名 Java 程序员，你不必担心这些，因为\
  \ Java 平台正是为了处理所有这些而开发的。了解这些是有趣的，也许当你的编程水平提高后，你就可以自己去研究底层编程细节了。\n\n在我们直接开始编写 Java\
  \ 编程代码之前，还有最后一点你应该了解的基础信息。那就是 Java 虚拟机。关于今天不同设备中提供的不同硬件和软件有一个反复出现的问题。手机的硬件和软件组件与你的汽车或笔记本电脑不同。更复杂的是，不同处理器芯片、不同操作系统和不同电子元件数组的组合意味着编译（或翻译）你所写代码的方式各异。你需要针对编程的设备平台制作特定的机器码。\n\
  \n## 那么，什么是 Java 虚拟机或 `JVM`？\n\n它是一个设计在任何设备或机器上运行计算机程序的程序或应用程序。它在 1995 年发布时是一个非常有革命性的程序，直到今天它仍然是一项巨大的创新。它解决了之前描述的困境。把\
  \ `JVM` 视为你计算机内部的一种虚拟计算机。它实际上有两个主要功能。\n\n第一个是在任何设备、任何操作系统或软件上运行任何程序。这被总结为“编写一次，到处运行”的原则——随着经验的增加，你会经常听到这句话以及其他的编程准则。另一个功能是分配内存空间——它非常擅长管理计算机内存。`JVM`\
  \ 被加载到计算机的内存（`RAM`）中。它是独立的，这意味着它可以运行在任何支持 Java 的设备上——嗯，今天几乎每个设备都支持 Java。它不会为现有的每种机器、芯片和软件组合生成代码。那是不可能的。即使你尝试，也会让\
  \ Java 变成一个庞大的系统，因为你必须容纳所有类型的硬件、软件和操作系统。\n\n那么，`JVM` 是如何做到的？它产生了自己独特的代码格式，称为 `bytecode`。请注意，与其他编程语言不同，当你的\
  \ Java 源代码被编译时，它不会被直接翻译或转换成机器可读的语言——再次，是因为目标不是创建只能在特定计算机平台上运行的特定类型代码。由 `compiler`\
  \ 产生的 `bytecode` 是一组机器语言指令。`bytecode` 将运行在任何安装了 `JVM` 的计算机上。这意味着 `JVM` 不仅运行 Java\
  \ 代码，还可以运行其他语言编写的程序——你所需要的是将其翻译（即编译）成 `bytecode`。\n\n## 编写你的第一个 Java 代码\n\n在你编写和运行任何\
  \ Java 程序之前，你首先需要安装 Java 运行环境 (`JRE`)（即包含 Java 系统、Java 库和其他文件的包），你需要访问 Oracle 网站[此处](https://www.oracle.com/java/javase/index.html）。关于如何下载\
  \ `JRE` 的说明也会在该页面提供。现在，你的计算机可能会提示你没有安装 Java（运行程序的系统），你可以通过[此处](https://www.oracle.com/java/javase/manual.jsp）下载。如果由于某些原因这些链接不起作用或者你被带到了另一个页面，只需\
  \ 搜索“JRE download”，然后点击位于 `www.oracle.com` 的链接。\n\n### 所需工具\n\n现在你只需要一个文本编辑器来编写第一个\
  \ Java 程序。你可以使用系统自带的任何文本编辑器（例如，如果你使用 Windows，可以使用 Notepad）。如果你想要更多的支持，也可以使用 Notepad++。但是，如果你想开发应用程序、测试你的代码并拥有让\
  \ Java 编程变得容易许多工具，你需要一个名为 IDE 的程序，它代表集成开发环境。`IDE` 是带有程序员所需的大部分设施的工具。\n\n### IDE\
  \ 功能\n\n`IDE` 通常带有自动补全和文本高亮功能。它还可以用于构建可执行文件。你的 Java 代码通常保存为 `.java` 文件。`compiler`\
  \ 将处理该文件并返回一个 `.class` 文件，这是你可以运行 Java 代码的文件。\n\n### 调试\n\n`Debugging` 是 `IDE` 的另一个重要功能。`Debugging`\
  \ 指定位和移除你 Java 代码中的错误。没有人期望你是完美的，但错误会阻止你的代码运行。`IDE` 拥有调试工具帮助你快速发现错误，以便你编辑它们。\n\n\
  ## Java 编程最佳 IDE\n\n有很多 `IDE` 可以用于 Java 编程。我们无法列出所有，所以只需介绍前 3 个：\n\n1. **NetBeans**:\
  \ `NetBeans`最早发布于 1997 年，它可以运行在 Windows、Solaris、Mac OS 和 Linux 等操作系统上。`NetBeans`\
  \ 实际上是 Java8 的官方 `IDE`。同样，`NetBeans` 是开源的——这意味着它是免费下载和使用的。它具有语义和语法高亮，允许你重构源代码（即重写代码而不引起任何问题）。`Refactoring`是为了提高程序的性能或将其更新到最新标准。换句话说，你在对旧程序进行升级或更新。\n\
  2. **IntelliJ IDEA**: `IntelliJ IDEA`最早发布于 2001 年 1 月。它运行在 Windows、Mac OS 和 Linux\
  \ 上。这个 `IDE` 有两个版本：一个是专利（你需要付费），另一个是 Apache 许可版本。这是面向专业程序员的 `IDE`——我们建议在获得大量 Java\
  \ 编程经验后使用这个集成开发环境。你可以将其称为深度 IDE。`IntelliJ IDEA` 的独特且强大的功能包括流分析和跨语言重构。它还为基于 `JVM`\
  \ 的其他语言提供支持——是的，其他编程语言也使用 `JVM`。\n3. **Eclipse**: `Eclipse` 是另一个高级集成开发环境。事实上，这一个专门用于\
  \ Java 程序的开发。嗯，它也支持其他编程语言，使其成为一个非常强大的工具。如果你达到了能够组合用不同编程语言编写的程序的程度，那么你可能考虑获取这个 IDE。如果你是初学者，那是以后的事情。现在，有两个版本的\
  \ `Eclipse`。有一个云端版本的 `IDE` 称为 `Eclipse Che`，另一个是经典的桌面版本，你可以下载到计算机上。这两个版本都带有一整套工具、应用程序和插件，让编程工作变得容易得多。它甚至自带自定义的\
  \ `compiler`。这个 `IDE` 有了许多有用功能。例如，如果你专注于为已编写的程序开发插件，`Eclipse` 有插件环境。\n\n# 第 5 节：Java\
  \ 程序的基本结构\n\n![Bordo, Elettronica, Calcolatore, Ingegneria Elettrica](img/image_rsrc3YG.jpg)\n\
  \n## 包\n\n第一行，我们有语句 `package helloworld;`。这条语句告诉编译器我们编写的 Java 文件属于 `helloworld`\
  \ 包。`package` 简单来说是相关类和接口的组合。当我们在文件开头写 `package helloworld;` 时，我们要求编译器将此文件包含在 `helloworld`\
  \ 包中。编译器将创建一个名为 `helloworld` 的文件夹并将文件保存在该内。属于同一个包的文件存储在同一个文件夹中。如果你现在导航到你的 `NetBeansProjects`\
  \ 文件夹，你会发现一个名为 `HelloWorld` 的文件夹。\n\n在 `HelloWorld` 文件夹中，你会发现一个包含 `helloworld` 文件夹的\
  \ `src` 文件夹。除了我们创建的包，Java 还提供了许多预包，我们可以在程序中使用它们。例如，输入输出代码封装在 `java.io` 包中，而实现图形用户界面组件（如按钮、菜单等）的代码封装在\
  \ `java.awt` 包中。为了使用这些预写好的包，我们需要将它们导入到程序中。我们以后会学习如何这样做。\n\n## main 方法\n\n`main()`\
  \ 方法是所有 Java 程序的入口。每当 Java 应用程序启动时，`main()` 方法都是第一个被调用的方法。注意 `main()` 方法中的 `String[]\
  \ args` 吗？这意味着 `main()` 方法可以接收字符串数组作为输入。在我们的示例中，`main()` 方法包含两行代码。第一行 //Print Hello\
  \ World 在屏幕上的字被视为注释并被编译器忽略。\n\n# 第 6 节：Java 代码结构\n\n在图中，你应该注意到包名在前。此外，你应该注意分号是行的结束。分号是重要的，如果你漏掉了它，程序将无法编译。`package\
  \ firstproject;` 接下来是类名 `public class FirstProject {}`。你可以使用左括号开始代码，使用右括号结束代码 `{this\
  \ is an example of a curly}`。你应该注意左和右括号内部的内容是代码的一部分。这就是我的意思：\n\n```\npublic static\
  \ void main ( String[] args ) {}\n```\n\n比任何其他都重要的是 \"main\"。为什么？因为每当 Java 程序启动时，它首先寻找名为\
  \ `main` 的方法。简单来说，方法是代码的一部分。如果你的代码没有 main 方法，将会得到错误。`public` 部分（蓝色）意味着它是程序的入口点。另一方面，`static`\
  \ 意味着不需要创建新对象，而 `void` 意味着没有返回值，到此为止。\n\n## 如何在 Linux、Windows 和 Mac 上下载安装 Java\n\
