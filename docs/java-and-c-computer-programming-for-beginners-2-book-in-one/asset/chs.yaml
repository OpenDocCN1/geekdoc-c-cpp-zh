  \ java 源文件，然后右击执行命令。查看下图。![Description: 00012.jpeg](img/image_rsrc3YK.jpg) 图 12\n\
  \n如果你使用了上面代码中的任何方法，你应该得到类似图 13 的输出！![Description: 00013.jpeg](img/image_rsrc3YM.jpg)\
  \ 图 13\n\n# 第 7 节：数据类型和变量\n\n![Hacker, Attacco, Maschera, Anonimo, Binario](img/image_rsrc3YN.jpg)\n\
  \n当然，使用 Java 的关键原因之一是它面向对象编程。面向对象编程或 `OOP` 是一种语言，它允许程序代码围绕数据而不是函数组织，这被称为过程化编程。这些“数据簇”被组织成\
  \ `objects`（对象），因此被称为“面向对象编程”。这些对象通过 `classes`（类）创建，在这里类是对象的类型。类的属性是创建对象的原始数据：这些是描述。第二个标准是对象的\
  \ `method`（方法）。这个 `method` 是行为，或者是类内部逻辑序列，描述了如何与之交互。为了更清楚，假设有一个 `Human` 类。这个 `class`\
  \ 将具有身高、体重等属性。`human` 类还可以有 `run`、`walk` 和 `talk` 等方法。这些组件构成了 `human` 类。现在类已经定义，程序员如果愿意，可以使用\
  \ `human` 类作为蓝图创建一个对象。他们可以调用 `Human` 类并填充它的属性，赋予它特定的身高、体重和种类。此外，对象已经有了如 `run`、`walk`\
  \ 和 `talk` 等内置函数。总而言之，这就是面向对象编程的意义：一种允许程序员利用预定义的类以便更容易描述它们并使用内部或内置函数来操作它们的编程方式。假设读者不是编程完全新手，并且已经接触过使用\
  \ `C` 或其他过程密集语言编程的世界，那么下一个逻辑问题将：为什么要使用面向对象编程？嗯，它的主要优势之一是长期来看，它节省了时间。在简单的算法和程序中，过程化编程通常更快、更直接；与其构造和定义类并创建对象，程序员真正需要做的是声明必要的变量并编写函数并创建算法来解决他们需要的问题。然而，当涉及到需要解决方案的复杂程序时，这就是面向对象编程开始发光的地方，它开始显示其实力。在很多程序中，会有某些\
  \ `objects` 或数据簇必须组合在一起，程序员将以某种方式处理它们。这就是 `classes` 旨在解决的。与其为每个数据簇声明一组新变量，他们只需要利用一个预先制作好的\
  \ `class` 并创建一个新的 `object`。\n\n\n\n\n## 逻辑运算符\n- 位运算符\n- 关系运算符\n- 算术运算符\n\n和其他其他计算机语言一样，Java\
  \ 拥有一组定义的额外运算符，用于处理某些特定场景。在学习 Java 编程语言（或任何编程语言）时，在开始之前你必须理解五个基本概念。这五个基本概念包括：\n\n\
  1. 变量\n2. 数据结构\n3. 控制结构\n4. 语法\n5. 工具\n\n每一个概念都将以初学者水平进行彻底解释，以确保它们被理解。\n\n## 分隔符\n\
  它们不适用于高层抽象：请注意，许多程序利用了低级结构，而这些结构主要用于低级抽象。这些编程语言的常用方法是关注机器——即如何让计算机执行某些操作，而不是这些功能如何帮助解决用户的问题。这些语言处理微小的细节，这已经超出了高层抽象的范围，而高层抽象是我们今天看到的更常见的方法。在低级抽象中，数据结构和算法是分开的，而在高层抽象中，它们被视为一个整体。\n\
  \n## 字面量\n当提到 Java 中的字面量时，指的是以人类可读的形式出现的固定值。我们可以说数字 `200` 是一个字面量。大多数情况下，字面量可以是常量。字面量在程序中非常重要。事实上，大多数\
  \ Java 程序都使用字面量。我们在书中已经讨论的一些程序也使用了字面量。Java 中的字面量可以属于各种原始数据类型。\n\n每个字面量的显示方式由其类型决定。正如不久前提到的，我们将字符常量括在单引号中，例如\
  \ `'c'` 和 `'%'`。我们定义的整数字面量不涉及小数部分。例如，`12` 和 `-30` 是整数字面量。一个浮点字面量应该包含小数点和小数部分。`12.389`\
  \ 是浮点字面量。Java 进一步允许对浮点字面量使用科学计数法。整数字面量包含 `int` 值，任何人都可以用 `short`、`byte` 和 `char`\
  \ 变量来初始化它们。\n\n## 注释\n当这种情况发生时，我们称之为注释。在程序的运行阶段，注释是无关的。这意味着你可以使用注释功能来说明或解释你正在创建的代码想要实现的目标。你可以通过输入两个斜杠然后是注释来实现这一点。这里有一个示例：\n\
  \n```java\n//在此处放置你的单行注释\n```\n\n你可以通过以下任一方式拥有多行注释：\n```java\n//我们将把\n//注释拆分成两行\n\
  ```\n或者\n```java\n/*\n```\n\n\n\n\n此注释跨越了两行。如果你查看上面的注释，你会注意到它以 `/*` 开头并以 `*/` 结束。此外，如果你查看上一张图片（图\
  \ 8），你会注意到有些注释以单个正斜杠和两个星号（`/**`）开头，但以一个星号和一个正斜杠结束；这被称为 Javadoc 注释。\n\n什么是变量\n另一方面，变量是一个包含特定数据类型及其分配或接收到的值的“对象”。它之所以被称为变量，是因为其中包含的值可以根据其在代码中的用处、程序员声明其值的方式，甚至是程序用户选择如何与之交互而发生改变。简而言之，变量是数据类型的存储单元。访问变量允许程序员方便地标记和调用手头的存储值。\n\
  \n### Java 中的变量类型\nJava 要求程序员使用声明语句，即通过指定特定的数据类型和名称来声明并定义变量的行代码。Java 变量的方式有一种特殊方式，它将变量定义为包含特定类型和值信息的容器，这与\
  \ Python 等语言不同，Python 只需要声明变量且变量可以动态更改其类型；Java 变量是静态的，一旦声明后就会保留其类型。\n\n```java\n\
  int number = 20;\nboolean completed = true;\nstring hello = \"Hello World!\";\n\
  ```\n\n声明的语法在之前的示例所示，变量类型在前，然后是变量名，最后是值。注意，声明语句可以在一行中组成多个声明，如下例：\n\n```java\nint\
  \ number = 20, boolean completed = true, string hello = \"Hello World!\";\n```\n\
  \nJava 变量可以在开始时不赋任何值；在这种情况下，Java 选择用特定的默认值来声明这些变量，例如：\n\n```java\nbyte a;\nshort\
  \ num;\nboolean answer;\n```\n将分别产生值 0、0 和 false。\n\n更完整的默认值列表如下：`byte`、`short`、`int`\
  \ 和 `long` 数据类型都将产生默认值 0，而 `float` 和 `double` 数据类型将具有默认值 0.0，`char` 数据类型将产生 `\\\
  u0000` 值，`string` 或任何其他对象将具有 `null` 默认值，所有的 `Boolean` 将以 `false` 默认值开始。\n\n在 Java\
  \ 中，变量在声明时是静态的，这意味着程序员必须定义变量将包含的数据类型。为了说明，如果我们想使用变量 `num` 来存储一个数字，我们必须先声明变量：`int\
  \ num`，然后才能赋值，例如 `num = 10`。上述过程通常被称为并指称为“赋值语句”，其中值被分配给程序员声明的变量。\n\n然而，Java（实际上实际上是大多数编程语言）其工作方式的一个显著特点是，在赋值语句中（例如我们的示例\
  \ `num = 10`）中，存储的实际值是等号右侧的值，即值 10，而 `num` 只是调用该存储存储的“标记”。这就是为什么许多 Java 程序员倾向于使用“获取”（getting）一个值的术语，而不是“分配”（assigning），尽管在大多数情况下，它们可以交叉使用，且在某些少数场景之外，功能大体相同。但请注意，一旦值被分配给变量，就需要执行函数来让该变量内部的数据改变其数据类型。\n\
  \n### 变量命名\n创建变量是一项简单的任务，特别是考虑到 Java 程序员倾向于根据数据类型或变量将存储内容的用途来创建和命名它们。然而，在命名这些变量时有几条规则，否则\
  \ Java 将无法识别它并导致错误信息。关于变量名的主要限制是它不应以特殊字符（如下划线）或数字开头。但变量名由字母、数字甚至下划线组成，只要下划线不放在开头。不能使用其他字符，例如\
  \ `#` 甚至 `$`，因为这些特殊字符在 Java 中有不同的用途，因此在变量名中不会被识别。\n\n虽然这些是主要规则，但在命名变量有一些提示：\n- 变量名应该具有描述性，因为在较长的代码中，很难记住\
  \ \"x\" 是做什么的。使用 `count` 或 `output` 这样的变量名比使用通 `x` 或 `y` 更容易记忆，并有助于避免混淆。\n- 除了描述性之外，如果变量名保持简短，将更容易使用。虽然\
  \ `banking_information_account_records` 这样的变量名非常有描述性，但在程序中反复输入它会令人疲惫，而且较长的变量名增加了拼写错误的概率，从而导致代码中的错误。\n\
  - 注意， Java 变量的习惯一直是使用全小写字母，虽然对大小写没有限制，但保持小写可以简化问题，因为漏掉大小写可能会导致变量无法被识别，因为 Java 将大写字母视为与小写字母完全不同的字符。\n\
  \n### Java 基本类型\n### 方法命名规范\n我们将回顾 Java 中的命名规范，因为你将使用成员方法。Java 编程中的方法执行操作，它们还接收调用者提供的任何参数，并向调用者返回结果。以下是声明方法的语法：\n\
  ```java\n[访问修饰符] 返回类型 方法名([参数]) {\n    // 方法体\n}\n```\n在命名方法时要记住以下规则：\n- 方法名始终是动词或动词短语（这意味着可以使用多个单词命名）。\n\
  - 方法名的第一个单词应该是小写字母，其余单词应遵循驼峰命名法。例如 `methodName()`。\n现在，你应该记住动词用于方法名并表示动作，而名词用于变量名并表示某种属性。\n\
  \n```java\npublic double computeArea() {\n    return radius * Math.PI;\n}\n```\n\
  \n### 在代码中使用构造函数\n我们将概述有关对象编程的一些额外细节。如之前所述，构造函数看起来像方法，你可以将其看作 Java 中的一种特殊方法。然而，构造函数在许多方面与方法不同。构造函数的名称将与类名相同。调用构造函数的唯一方法是通过使用\
  \ `new` 关键字创建构造函数的实例并进行初始化。以下是使用 `Employee` 类的示例：\n\n```java\nemployee1 = new Employee();\n\
  employee2 = new Employee(2.0);\nemployee3 = new Employee(3.0, \"regular\");\n```\n\
  构造函数还会隐式返回 `void` —— 这意味着它没有返回类型。你不能在构造体内部放置返回语句，因为编译器将其标记为错误。最后的区别是构造函数不能被继承。回到提供的示例——第一行包含\
  \ `Employee()` 的默认构造函数。你可以看到，它没有任何参数。默认构造函数的工作仅仅是将成员变量初始化为特定的默认值。在上面的示例中，成员变量状态。构造函数也可以重载吗？可以。构造函数的行为像方法，这意味着你可以像重载方法一样重载构造函数。以下是使用\
  \ `Employee` 类重载构造函数的示例：\n\n```java\nEmployee()\nEmployee(int r)\nEmployee(int r,\
  \ String b)\n```\n\n### 如何初始化变量\n现在我们知道了如何声明变量，并且知道了我们可以使用的各种变量类型，下一步是学习如何在“表达式”中使用这些变量。表达式是\
  \ Java 程序中最常用的构建块，通常用于产生一个新值，但在某些情况下，表达式用于给变量分配新值。通常表达式由值、变量、运算符和方法调用组成。\n\n某些表达式不产生结果，而是影响另一个变量。一个示例是根据操作更改变量值的表达式：没有新值输出，而是有一种导致变量值变化的副作用。在我们之前的示例程序中，例如打印\
  \ \"Hello World\" 程序，我们将原始值引入了 `print` 函数，这也称为“硬编码”输出。\n\n然而，到此时，我们应该尝试结合变量的知识。变量的操作方式与原始值相同，因为它们仅由计算机引用之前存储的值，因此程序员可以使用变量名代替值。为了演示这一点，让我们记住之前的\
  \ \"Hello World\" 程序：\n\n```java\nprint(\"Hello World\");\ninput(\"\\nnPlease the\
  \ return key to close this window.\");\n```\n现在，不再硬编码 \"Hello World\" 字符串，我们可以将其声明为一个变量并让程序输出该变量。这最终看起来应该是：\n\
  \n```java\nstring = \"Hello World\";\nprint(string);\ninput(\"\\nnPlease the return\
  \ key to close this window.\");\n```\n这得到的结果与之前的程序相同，看起来类似于：\nHello WorldPlease\
  \ press the return key to close this window.\n\n### 代码修改的变量\n然而，读者可能会疑惑为什么在这种情况下甚至要使用变量，因为它让我们的代码更长了。在非常短的代码中，例如经典的\
  \ \"Hello World\"，使用变量确实使其变长，但为了演示如何用它们缩短代码，让我们使用另一个代码来展示变量的用处。对于这段代码，我们将尝试打印几个乘法表值。在代码代码中我们将使用一些迭代和循环，将在以后详细解释。\n\
  \n```java\nint num = 9;\nbyte count = 0;\nwhile (counter < 10) {\n    print(num\
  \ \" * \");\n    print(counter \"= \");\n    print(num * counter \"\\n\");\n   \
  \ counter = counter + 1;\n}\n```\n这段基础代码段将输出 `num` 变量中任何数字直到九的乘法表。在这个程序中，我们要整合所谓的\
  \ `while` 条件和一个迭代函数。然而，如果我们分解所提供的代码组件，`while` 条件告诉 Java 继续迭代其下方的代码，直到条件不再成立。由于 `count`\
  \ 被初始化为值 0，并且每次代码运行时 `count` 变量都会增加一，循环将运行十次。嵌套在 `while` 条件内部的代码告诉 Java 程序打印数字乘以\
  \ `counter` 的等式，这意味着它将打印十行，从乘以零到九。\n\n\n\n\n\n- `+` 代表加法\n- `-` 代表减法\n- `*` 代表乘法\n\
  - `/` 代表除法\n- `%` 代表取模\n- `++` 代表自增\n- `--` 代表自减\n\n\n\n如 `+`、`-`、`*` 和 `/` 等运算符的功能与其他语言中的运算符完全相同。我们已经看到\
  \ JavaScript 具有处理数字的能力。因此，它也有处理可以与数字数据类型配合使用的运算符。让我们详细查看每个运算符。\n\n## 算术运算符\n这些是用于处理数字的运算符。常用的运算符如下所示，随后是其应用方式的示例。通过此程序，输出如下：\n\
  \nJavaScript 程序\n第一个值是 5\n第二个值是 10\n加法运算符 = 15\n减法运算符 = 5\n乘法运算符 = 50\n除法运算符 = 5\n\
  自增运算符 = 6\n自减运算符 = 5\n取模运算符 = 5\n\n## 赋值运算符\n这些是用于根据操作数的值确定条件值的运算符。JavaScript 中可能的关系运算符下所示。如果条件求值为真（true），则返回值\
  \ 1，否则返回值 0。通过此程序，输出如下：\n\nJavaScript 程序\n第一个值是 5\n第二个值是 10\n数字相等吗 = false\n数字不等吗\
  \ = true\nx 小于 y 吗 = true\nx 大于 y 吗 = false\nx 大于等于 y 吗 = false\nx 小于等于 y 吗 = true\n\
  \n## 逻辑运算符\n这些是根据操作数的值确定条件值的运算符，其中操作数是布尔值。JavaScript 中可能的逻辑运算符下所示。通过此程序，输出如下：\n\n\
  JavaScript 程序\n第一个值是 true\n第二个值是 true\n第三个值是 false\nx AND y = true\ny AND z = false\n\
  z AND x = false\nz AND z = false\n\n下表显示了基于操作数值的逻辑 OR（或）运算符。通过此程序，输出如下：\n\nJavaScript\
  \ 程序\n第一个值是 true\n第二个值是 true\n第三个值是 false\nx OR y = true\ny OR z = true\nz OR x\
  \ = true\nz OR z = false\n\n下表显示了基于操作数值的逻辑 NOT（非）运算符。\n\n## 赋值运算符\n这些是用于简化赋值操作的运算符。JavaScript\
