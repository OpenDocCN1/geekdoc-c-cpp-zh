  md: '# 1.5. Sufism in the Pesantren Tradition


    The forms of Islam that first came to Malay Archipelago were profoundly colored
    by Sufi doctrine and practice. It is no historical coincidence that the first
    century of the Islamization of South Asia (the thirteenth century) was the golden
    period of medieval Sufism that a proliferation of Sufi orders (tarekat). Thus,
    for example, al-Ghazazī, the proponent of orthodox Sufism, died in 1111; Abd al-Qadir
    al-Jaylani whom the teachings of the *tarekat* Qadiriyyah are attributed, died
    in 1166; a year later after the death of Abd al-Qahir al-Shuhwardi whom *tarekat*
    Suhrawardiyyah is associated; Najm al-Din al-Kubrā, the founder of *tarekat* Kubrawiyyah
    and the influential figure of the Naqsabandiyyah order died in 1221; Ibn al-‘Arabi
    whose thoughts and teachings greatly influenced Malay Sufi thinking died in 1240;
    Abu al-Hasan al-Shadhili who originated from North Africa and established the
    Shadhiliyah order in 1258 (1994a:2).


    In Anthony John’s view, individual Sufi and Sufi orders played an important role
    in the Islamization of Malay Archipelago beginning in the thirteenth century.
    After the fall of Baghdad in 1258, there began a wave of active Sufi wanderings
    that did unify the Islamic world (Johns 1961:14). The teachings of Sufism founded
    fertile ground within indigenous religions and belief. The indigenous population
    could accept mystical thoughts of belief. Ibn ‘Arabi because they were closely
    related to the previous Indian mystical ideals present in the region. In addition,
    Sufi of the Perfect Man (A., *Insān al-Kāmil*) and of sainthood (A., *wilā*) gained
    a mystical legitimacy to rulers enabling them to use these notions for political
    or economical reasons. Instead of radically changing traditional beliefs and practices,
    Sufism emphasized the continuity of indigenous tradition and belief, coloring
    them with Islam. Al-Attas argues that it is the characteristic of Sufism to allow
    non Islamic elements within Islamic Sufism practicing that they do not contradict
    Qur’ revelation (Al-Attas 1985: 171).


    The second wave of Islamic intellectualism influenced Sufism in the pesantren
    tradition was brought by ‘traditional’ Muslim scholars who studied in Mecca and
    Medina during the early nineteenth century. It was during this that intellectual
    links between the heart of Islam in Middle East and the Malay world experienced
    greater consolidation. Due to the easing of restrictions on the *hajj* and the
    availability of transport, more students from Southeast Asia, particularly from
    Indonesia, were able to study in Mecca and Medina. Many prominent Indonesian *‘ulamā’*
    studied during this period: Shikh Ahmad Khatib Dabas (d.1875), Shikh al-Nawawī
    al-Bantani al-Tanari (d. 1897), Mahfūdz al-Tirmisi (d.1919), Ahmad Rifa‘i Kalisakal
    (d.1875), Kyai'
