    Gus Mik''s view of drinking alcohol can be clearly explained in the perspective
    of Islamic jurisprudence (A., fiqh al-Islam). All Muslims mention that any drink
    may cause drunkenness is prohibited. This notion is based on the Prophetic hadith,
    "if it intoxates in a large amount, it is forbidden even in a small amount" (kullu
    mushkirin qafīluha kathīruh). However, according to Abū Hanifat, both kham and
    nabidhan cause drunkenness, there is a distinction between them. Kham is a kind
    of drink made from wine, nabīdh is a kind of drink made from anything other than
    grapes. Abū Hanifat argued that kham was prohibited because of its effect, while
    nabīdh was not. Therefore, people are allowed to drink nabīdhas as long as they
