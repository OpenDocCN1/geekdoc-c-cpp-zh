    has received this formula from the Prophet through a chain of transmitters.


    After reciting *Al-Fātiḥah* for Shaikh Ihsan, by asking for a share in his sacredness
    (A., karamat, asar), blessing and secrets the tawassul is closed with a prayer.
    Unlike rituals held by other Sufi groups, this prayer is recited in both Arabic
    and Javanese. It can also be recited in other vernacular depending on the language
