    He gave this prayer publicly to those who visited him regardless of their social
    background, asking them not only to read it also to disseminate it to other people.
    Apart from this, he asked one of his students to write the *Salawat* and send
    it to other Muslim scholars (*kyai*) together with a letter recommending that
    this prayer be read by local people. In addition to his religious and preaching
    methods, he sent the prayer to many *kyai* because he needed to assist them in
    the dissemination of the prayer as widely as possible. This is understandable
    since *kyai* are regarded not only teachers but also as living saints who are
    responsible for the spiritual training of people. In other words, Woodward has
    argued, kyai play an important role in the religious lives of lay Muslims (Wood
    1989).


    Pesantren Kedenglo held its weekly instruction (*pengajian umum*) on Thursday
    night. The Sufi text used as a reference in the instruction was *Kitab al-Hikam*written
    by Ibn ‘Athallah al-Iskandar (d.1309). The reason why this Sufi book was more
    often chosen than the Sufi treatise such as Al-Ghazali’s ‘Ulum al-Din, is because
    the book contains teaching about the struggle against nafs (lower soul) which
    is in line with Wahiday teachings. The participants in this instruction ranged
    from students to local people. Kyai Abdul Majid Ma’ruf used the instruction as
    a means to introduce and explain his teachings on *Salawat*. On occasions, Kyai
    Abdul Majid Ma’ruf also explained in detail some aspects of Sufi doctrines that
    become a pillar of his teachings. Long after releasing the second *Salawat*, in
    1963 at the weekly *pengajian*, Kyai Abdul Majid Ma’ruf launched a third *Salawat*
    called *Thal al-Qalb* (The Cooling of the Heart prayer). He wrote the prayer as
