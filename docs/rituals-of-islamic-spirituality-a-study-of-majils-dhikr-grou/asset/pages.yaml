    The structure of Wāhidiyat’s organization follows the typical structure of other
    Islamic organizations, such as Nahdlatul Ulama and Muhammadiyah. It consists of
    a central board office, representatives in provinces, regencies, sub-districts,
    and villages. The aims of this structure are to build strong ties among the followers,
    who cannot directly connect with the central board, and to help coordinate activities
    according to the level of the organizational structure. Since the structure of
    Wāhidiyat involves a combination of organization and a foundation, the central
    board of Wāhidiyat comprises the head of the foundation who is also the head of
    the central organization and the guardian of the Wāhidiyat struggle (pengaruh
    perjuangan). It has a number of departments, including a department of regional
    affairs (departemen urusan wilayah/daerah), department of proselytization and
    development (departemen penyaran dan pembinaan), department of women’s development
    (departemen pembina wanita), department of adolescent’s development (departemen
    pembina remaja), department of children’s development (departemen pembina anak-anak),
    department of finance (departemen keuangan), department of cooperative (departemen
    koperasi), department of education and culture (departemen pendidikan dan kebudayaan),
    and department of equipment (departemen perlengkapan). These departments'
