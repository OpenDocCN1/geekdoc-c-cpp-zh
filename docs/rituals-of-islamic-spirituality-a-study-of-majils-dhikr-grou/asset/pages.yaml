    Another component of istighthāthat tawassull is understood by the group as pronouncing
    the names of ‘ulamā or Sufi masters as mediators in supplicating God, regardless
    of whether they are alive or dead. This practice is not intended to ask something
    from those people but merely to identify them as righteous persons in the view
    of God. Gus Abdul Latif argued that since these people are believed to be the
    most beloved of God, pronouncing their names in prayer, will increase the likelihood
    that God will grant the prayer. He made the analogy to a person who wished to
    meet a manager. If is accompanied by a person who is closely known to the manager,
    the person is more likely to attract the manager’s attention than if the person
    comes to the manager’s office alone. This analogy is widely used among kyai in
    Java. Other kyai object to this in since people recognize the authority of the
    intermediary as that of the manager. In contrast, other kyai compare the tawassull
    to people who use spectacles to read the Qur’an. In this way, people can be said
    to view only the Qur’an, not the glass in their spectacles (Dhofier 1999).


    The recitation of Salawāt (invoking the blessing on the Prophet) is also part
    of the istighthāt ritual and is sanctioned by God. Gus Abdul Latif argued that
    since every Muslim receives guidance from God by virtue of the Prophet, they should
    invoke blessing on him. Furthermore, quoting the verse of Qur’an, Gus Abdul Latif
    intended that, God and His Angels invoke blessing on the Prophet, In addition,
    the Prophet is the right person to whom blessing is given because he was believed
    to be able to provide his intercession (shafaat) in both this world and the hereafter.


    Another important element of the istighthāt is istighfar. Gus Abdul Latif mentioned
    that the istighfar was included as a formula to invoke God’s forgiveness. This
    practice is well supported both by the Qur’an and the hadith because it is closely
    related to the concept of repentance (A., taubat). According to Sufi tradition,
    repentance is considered be the first stage (maqam) in Sufi practice, is required
    of all Muslims, since no Muslim is able to perform God’s order perfectly. Moreover,
    no one can be free from the intrigues of the devil nor from the lower soul (nafs)
    desire, which contributes to disobedience (Muhaya 1993:43).


