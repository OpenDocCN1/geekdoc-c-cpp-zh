  md: 'Rituals of Islamic Spirituality


    Another important study on tarekat was conducted by a Dutch scholar, Martin Van
    Bruinessen. His work might be considered as the most complete work that has ever
    been written on the Naqshabaniyah order and its networks, particularly in Indonesia.
    According to Bruinessen, Naqshabaniyah is significant because it is the most internationalised
    of orders compared to other tarekat, having branches in many countries including
    Yugoslavia, Egypt, Indonesia and China. In Indonesia, moreover, this tarekat has
    three important branches with different names: Naqshabandiyah Khalidiyah, Naqshabaniyiah
    Mazhariyah and Qadiriyah wa Naqshabiyyah. Qadiriyah wa Naqshabiyyah is a combination
    of two tarekat set by the Indonesian Sufi, Ahmad Khatib Sambas, who taught in
    Mecca in the mid-nineteenth century. In Java, the Naqshabandiyah tarekat has attracted
    many followers in Central Java (Semarang, Gikusumo, Rembang, Blora, Banyumas,
    Purwokerto and Cirebon), the southern areas of East Java (Kediri, Blitar, Madun,
    Magetan) and in Madura. It is important to note here that most of the leaders
    or masters of Nashabandiyah tarekat in Java belong to pesantren. They use their
    pesantren to spread the teachings of the tarekat. In other words, pesantren still
    play an important role in spreading the Sufi teachings and recruiting new members
    to the tarekat.


    Muhamin''s study of the Islamic traditions of Cirebon has also greatly contributed
    to the understanding of the origin and spread of Shattariyah and Tijaniyah Tijaniye
    is the fastest growing tarekat in Java. Like Dhofier, Mukhamin argues that Islamic
    traditions in Cirebon and probably elsewhere in Java have been maintained within
    Javanese Muslim society through the combination of pesantren and tarekat (Mukhamin
    1995:35). It is not an exaggeration to say that those institutions are the hallmark
    of traditional Islam in Java. Line with this, looking at Pesantren Buntet in Cirebon,
    Mukhamin observes that the pesantren has become the base for Shattariyah and Tijaniyah.
    As argued by Mukhamin, not only has Buntet become an important door-way for spreading
    Tijaniyah in Java, particularly West Java, but it has also become the model of
    a pesantren able to accept the practice of two different tarekat groups, something
    that is not found in other pesantren in Java. The kyai responsible for maintaining
    Buntet of two tarekat were two brothers, Kyai Anas and Kyai Abbas. Kyai Anas was
    the leader of the Tijaniyah long before his brother Kyai Abbas was initiated into
    this group. Kyai Abbas was able to break the Tijaniyah rule which requires individuals
    to abandon their previous order before joining Tijaniyah. Kyai Abbas joined Tijaniyah
    while still affiliated with Shattariyah. Later, he became a muqaddim (leader)
    of Tijaniyah (Mukhamin 1995:353).


    Turmudi''s study of the changing leadership roles of kyai in Jombang has also
    added to the scholarly literature on the political dynamics of tarekat in Java.'
