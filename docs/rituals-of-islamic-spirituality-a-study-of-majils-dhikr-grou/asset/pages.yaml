    # 5.2. Local Rivalry and Challenges


    Although there are many other Majlis Dhikr groups and Sufi orders in Kediri, which
    provide similar ritual to that of Istighāthat Ihsāniyyat, this group has hardly
    ever faced a serious challenge from those groups. In contrast, in Banyuwangi,
    this group faced serious challenges especially from local kyai. From its inception,
    the ritual of Istighāthat Ihsāniyyat, held once every friday (J., selapan) in
    Banyuwangi was attended not only by local people but also by many local kyai officially
    invited by the coordinator of the Istighāthat Ihsāniyyat group. In fact, besides
    Gus Abdul Latif, local kyai contributed to attracting their followers to participate
    in the ritual.


    As this new group, this excited the jealousy and fear of other local ‘ulama’ in
    Banyuwangi. Because they were no longer involved by Istighāthat Ihsāniyyat leader
    as official members of the group, these local kyai who had previously supported
    the establishment of the group in Banyuwangi withdrew their support. There can
    be little doubt that the real objections to this group was that it threatened
    the standing privileges of local kyai. This contributed to a rivalry that developed
    between the Istighāthat Ihsāniyyat group and other groups.


    As an observant, these kyai did not object to the Istighāthat Ihsāniyyat, but
    they wanted the group to be run led by local kyai without outside involvement.
    They argued that were many kyai in Banyuwangi who were more capable of leading
    the Istighāthat Ihsāniyyat ritual than those from Kediri. Moreover, they argued
    that the ritual took place in Banyuwangi, and it was more appropriate for this
    group to run by involving kyai or leaders of pesantren who lived in Banyuwangi.


    In dealing with these points, Kyai Hisham, the coordinator of the group, argued
    that he could not prevent Gus Abdul Latif, the author of Istighāthat Ihsāniyyat
    prayer, from attending the Istighāthat Ihsāniyyat ritual in Banyuwangi because
    he was the person who had given the ijāza (authorization, license) for the Istighāthat
    Ihsāniyyat prayers. It was a courtesy that, as the recipient of the ijāza, Kyai
    Hisham should include Gus Abdul Latif in the Istighāthat Ihsāniyyat.'
