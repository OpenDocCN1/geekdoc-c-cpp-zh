  md: '# Chapter 1 - Introduction


    Even though this study focuses on local pesantren leadership, it also considers
    the significant role of tarekat in several pesantren in Jombang. Turmudi examines
    how kyai lead tarekat are involved in politics. Like Dhofier, Turmudi focused
    his attention on the influential Sufi group, Qadiriyah Naqshabadiyah in which
    was the first tarekat in Java to initiate a tradition of establishing a political
    relationship with a ruling political party. Kyai Must''in Ramli, the leader of
    the Qadiriyah Naqshabadiyah in Jombang, supported the ruling party, Golongan Karya
    (GOLKAR) prior to the 1977 general election. His involvement in politics was seen
    in various ways by his followers. Some kyai who were members of the tarekat Kyai
    Ramli''s political affiliation with GOLKAR as a violation of NU''s commitment
    to support PPP (Partai Persatuan Pembangunan, the United Development Party), which
    was seen as the representative of Indonesian Muslims. As a result, these kyai
    withdrew their support for Kyai Must''in group by establishing new tarekat groupings
    in Pesantren Cukur in Jombang and Pesantren Kendining Lor Surabaya. In contrast,
    Kyai Must''in obedient followers regarded his involvement with GOLKAR as a new
    strategy to engage in the wider political context. This was supported by Kyai
    Must''in''s wife who argued that the defection of her husband occurred because
    he had seen another way to achieve the political ends of ''Islamic struggle''.
    While Kyai Wanted to avoid further division in the Islamic community, his defection
    to GOLKAR nevertheless resulted in the splitting of Qadiriyah Naqshabadiyah into
    three different groups, namely a Rejoso group, a Cukur group and a Kendining group
    (Sujuti 2001a:71). Turmudi''s study of the leadership of kyai in tarekat shows
    how the involvement of kyai in politics can lead to changing loyalty among followers.
    Although the authority of a kyai to influence followers'' political affiliation
    is not absolute, nonetheless many followers do follow their kyai''s example.


    Adding to the predecessors'' attempts to understand Java''s pesantren traditions,
    Zulkifi''s work, The Role of the Pesantren in the Maintenance of Sufism in Java
    (2002) addresses the issue of transmission of tasawuf teachings through prominent
    scholars as Sheikh Nawawi Banten, Sheikh Mahfudz and Kyai Cholil Bangalan. Kyai
    Nawawi was a student of Sheikh Ahmad Khatib in Mecca, and both are regarded as
    important figures in teaching and practising rituals associated with tasawuf,
    even though they reportedly did not join a tarekat. Kyai Kholil Bangalan was also
    an important figure whose influence is evident among a distinguished Javanese
    kyai.


    The importance of Zulkifi''s study lies in his comparison of two of the most important
    pesantren in Java, Pesantren Tebiring in East Java and Pesantren Suryalaya in
    West Java. He looks at the role and strategies of the leaders in both'
