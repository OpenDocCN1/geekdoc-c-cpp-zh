    The success of Gus Mik in speaking and developing his group has been supported
    by the network of alumni of Pesantren Al-Falah, Ploso, Kediri who are spread throughout
    Jawa. Wherever Gus conducted his *dhikr ritual*, these alumni strongly supported
    him and his group. This fact is not surprising, because in pesantren tradition,
    santri of pesantren are still regarded as ‘students’ of pesantren, even though
    they have graduated and returned to their community. Alumni of pesantren have
    strong emotional attachment with their *pesantren*. With this status they have
    to respect their *kyai* and family even though they have returned to their home
    and become *kyai* in their respective community. Gus Mik’s position as the son
    of the founder of Pesantren Ploso deserved to receive support and respect from
