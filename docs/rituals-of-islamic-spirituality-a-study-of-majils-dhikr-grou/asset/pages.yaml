  md: '# Chapter VII – Conclusion


    Different interpretations of some aspects of Islamic teaching will happen in part
    when Muslims discuss multi-interpretable texts of the Qur’an and hadith. In the
    case of debates about the dhikr ritual in Indonesia, therefore I argue in this
    study that both the proponents and opponents of Majlis Dikr base their views on
    interpretable Islamic teachings; as a result one should not regard one group as
    being truly Islamic, while the other Muslim group as practising bid''ah and superstition
    in this matter. Furthermore, I argue that interpretations can be regarded as belonging
    to the field of ijtihad which allows the capabilities of reason in deducing a
    conclusion based on the Qur’an and hadith. If this is the case, one can expect
    different results of ijtihad among Muslims scholars. Muslims should not deify
    claim that their own results of ijtihad are deemed to be true, while others’ ijtihad
    are false, because all of such efforts will be justified later in the hereafter.
    If the result is true according to the meaning and purpose of God and the Prophet’s
    purpose then it will have two rewards. In contrast, if the result is wrong it
    does not agree with God’s and the Prophet’s purpose, it will have only one reward.


    This study also offers important findings about the extent to which Majlis Dikr
    groups comply with the teachings of the Qur’an, hadith and orthodox Sufism. In
    relation to this question, I have examined several aspects of Majlis Dikr, including
    their use of Salawa as a means to approach God, their concept of sanctity (wali),
    seeking intermediaries (tawassul), seeking the merit of pious deeds to deceased
    persons, and seeking blessing (tabarruk). In these ritual aspects, rather than
    innovating within Islam (melaksanakan bid''ah), Majlis Dikr groups rely heavily
    on the prescriptions of the Qur’an, hadith, and the views of authoritative Muslim
    theologians. Interestingly, their theological responses in these aspects are similar
    to those prevalent in the practices of major Sufi groups in Java. Therefore, in
    this sense, despite their ghair mubarak status according to Jam’iyyah, Majlis
    Dikr groups can be considered to be in accordance with orthodox Sufi teachings,
    which still stress the importance of the observance of shari’a. In this sense,
    these groups serve as an alternative venue for Indonesian Muslims to practice
    the inner aspects of Islam.


    Majlis Dikr groups in Java function as a venue for Muslims to practise dhikr ritual
    and seek spiritual closeness to God; they also serve as institutions for deepening
    and preaching Islamic values (dakwah Islam). This study examines how specific
    Majlis Dikr groups employ different strategies to do this. For instance, in order
    to spread its teachings in particular and to preach Islamic values in general,
    the Wahidiyat group has been opened by its proponents to all people regardless
    of their age, cultural or religious background. With this strategy, group accepts
    people from different religions to join and practise'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'the group’s ritual without asking them to convert to Islam. Further, in order
    to attract new followers, this group has stressed the efficacy of its dhikr formula
    not only to solve the problems faced by people but also to effectively obtain
    ma’rifatullah (Gnosis of God), the highest achievement in Sufi practice.


    In contrast, the Istighāth Ihāniyat, another Majlis Dhikr, uses a different strategy
    to promote Islamic values and teachings among Muslims. The Istighāth Ihāniyat
    was established to attract those who have been categorised sociologically as marginalised
    people and theologically as nominal Muslims, it has tried to accommodate cultural
    aspects which are prevalent among them dakwah. In line with this approach, this
    group allows Javanese people as the hobby-dance (J., jaran, tiger-masked dance
    (J., reog), dangutan, Chinese dragon dance (J., leang-leong), and ruwatan to be
    performed on the annual anniversary of Ihāniyat. Including Javanese public arts
    within the framework of pesantren and Sufi group is unusual. Moreover, this group
    also applies the strategy ‘from tombs to mosques’ (I., dari kubur ke masjid) to
    attract people to join the group. They have found that it is easier to ask once
    people have enough Islamic knowledge and have practised Islam, they will voluntarily
    come to the mosque. Through such methods, the presence of these Majlis Dhikr groups
    in the landscape of Indonesian Islam has contributed to narrowing the gap between
    sant Muslims and nominal Muslims, who have long been ideologically opposed to
    one another. Moreover, in implementing Sufi dakwah and religious tolerance, the
    Istighath Ihāniyat group also allows people from different religions to join the
    group without asking them to convert to Islam. This strategy helps to create a
    peaceful religious life in Indonesia.


    Similar to the Ihāniyat, the Dhikr al-Ghāfilīn uses tombs as a venue for attracting
    members. Like the Ihāniyat, in addition to holding dhikr ritual at Muslim saints’
    tombs, this group also gives religious lectures (ceramah agama) during the ritual
    in the expectation that people will not only gain spiritual enlightenment by reciting
    dhikr but also obtain knowledge of Islamic teachings and values. Furthermore,
    in order to spread its influence, this group accentuates the figure of the founder
    of the group as an icon to attract new members. This strategy is not unique among
    Majlis Dhikr groups whose current leaders are not as charismatic as their founders.
    The Dhikr al-Ghāfilīn group in particular seems to rely on this strategy because
    none of its leaders has the same capability as the late Gus Mik, the original
    founder of who was known among people as a wali.'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# Chapter VII – Conclusion


    My study also clearly shows that pesantren have played an important role in the
    maintenance and the development of these Majlis Dhikr groups. Most of the leaders
    of these groups have graduated from pesantren, and they are mostly the sons of
    kyai from famous pesantren in East Java. As a result, they have used their pesantren
    networks to spread their groups. The networks of particular pesantren have been
    important in the dissemination of Majlis Dhikr groups to wherever these alumni
    live. In this way, pesantren not only only as places places for educating students
    about Islamic knowledge but have also become centres for the teaching and the
    propagation of Majlis Dhikr. Students of these pesantren are obliged to practise
    and join the recitation of dhikr held by these groups. One pesantren, pesantren
    Kedunglo, where Majlis Dhikr ŞalawaWabidiyat is based, even obliges its students
    to propagate the teachings of the group when they have graduated and returned
    home.


    The role played by pesantren in the maintenance and development of Majlis Dhikr
    indicates that they are effective places to maintain both the outer and inner
    aspects of Islam in Java. A similar role has been revealed by previous studies
    on the role of pesantren in the maintenance of Sufism in Java. Some studies have
    noted that pesantren in Java can be divided into two categories. The first maintains
    Sufism without necessarily being affiliated with a particular tarekat, although
    they never practise dhikr and wirid in tarekat, and also Sufi teachings in daily
    life. The second category is that of pesantren that specialise in the teaching
    and the development of tarekat. This study has added another category of pesantren
    in Java, that is, pesantren that not only practise dhikr and wirid regularly but
    also organise and establish Majlis Dhikr groups and propagate these among people
    outside the pesantren.


    One point which is to be emphasised is that pesantren and tarekat in Java have
    been conceived by previous researchers as inseparable institutions for the maintenance
    of traditional Islam within the Javanese Muslim community. Most pesantren in Java
    function as places to mould students with Islamic knowledge, while some of them
    also function as instruments for the recruitment of members of tarekat, which
    are organized around the figure of a scholar and teacher. This study highlights
    the rise of new Islamic spiritual groups in Java, the Majlis Dhikr, which suggests
    that another institution should be taken into account when considering the maintenance
    of traditional Islam among Javanese.


    It has been argued that Indonesia has undergone an Islamic revival since 1970''s
    (Howell 2001). This resurgence is measured by scholars in considering phenomena
    as diverse in the publication of books on Islam, the reinvigoration of Islamic
    political parties, the prevalence of Muslim fashion among middle class urban population,
    the growing number of mosques, the'
  merge: -1
  pgno: 282
- img_proc: true
  md: appearance of new forms of student activity on university campuses, and the
    establishment of Islamic banking. This kind of representation of Indonesia’s Islamic
    revival puts too much emphasis on the outer aspects of Islam, while tending to
    ignore the increasing popularity of Islamic spiritual expression as articulated
    by the proliferation of both Sufi groups and Majlis Dhikr groups in urban and
    rural areas. This study has attempted to redress this imbalance by enriching perspectives
    on the development of Islam in Indonesia, while presenting another piece of evidence
    for Islamic revival in Indonesia.
