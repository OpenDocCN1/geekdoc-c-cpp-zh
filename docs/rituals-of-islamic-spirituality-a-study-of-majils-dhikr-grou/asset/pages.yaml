    # 4.5. The Ritual of Mujāhada in Wāhīyat : Spiritual Pilgrimage


    Wāhīyat is a Majlis Dhikr group which focuses on the reciting of Šalawat which
    is believed to provide a shortcut for people seeking Gnosis of God (A., ma‘rifat
    bi-Allah) and the purity of soul. For Wāhīyat to achieve wuṣūl (union) and ma‘rifat
    bi-Allah is difficult for everyone, particularly without the guidance of a perfect
    master (ʿmurshid). Similarly, to find a perfect teacher (kamil mukkamil) is not
    also easy, particularly in this age. It is difficult to attain wuṣūl and ma‘rifat
    billah that ‘umālā’ point out that only particular people can do so. Nevertheless,
    Wāhīyat claims to offer the easiest way to achieve wuṣūl and ma‘rifat billah ,
    by reciting Šalawat during the mujāhada ritual. Quoting the words of Muslim scholars
    in the book introduced Sa‘ādat al-Dāranyi, Kyai Abul Latif Majid spentis:


    > The easiest way to achieve wuṣūl ma‘rifat to Allah particularly for those who
    have continuously committed, is by reciting istighfār (the forgiveness prayer)
    and Šalawa (exaltation) towards the Prophet of God.


    The practices and ritual of Wāhīyat focus on the continual recitation of Šalawat
    based on mujāhada, mujāhada, which originally meant striving, refers to an intense
    spiritual effort that may lead to spiritual ecstasy. Meanwhile, in the case of
    Wāhīyat, mujāhada is conceived as a method of reciting Šalawat Wāhīyat in accordance
    with the methods and ethics taught by the author of the the Šalawat, including
    the implementation of


