  md: '# 1.3. The Variety of Majlis Dhikr Groups in Java


    Despite the increasing popularity of tarekat among the Javanese, Majlis Dhikr
    groups have also gained popularity in many rural and urban areas in Java over
    the last two decades. Like tarekat, these groups offering a new mode of Islamic
    ritual practice have captured the interest of people of various ages and genders
    from villagers to well educated persons, and even a number of national elites.
    In contrast to the tarekat, which necessarily requires members to aged forty or
    more to be able to practise its ritual, Majlis Dhikr groups do not have this requirement.
    As a result, in several Majlis Dhikr groups, one might easily find persons categorised
    as teenagers and even children following and practising the rituals of the group.


    The presence of Majlis Dhikr is evident in the landscape of Indonesian Islam.
    Several groups have been set up in Java during the last two decades. Most of these
    have been established by Islamic leaders (i., kyai), who have strong connection
    with pesantren. As a result, the activities of these groups cannot be separated
    from pesantren. However, some groups have been up by independent Islamic leaders
    who do not have a strong affiliation with pesantren. As far as the organization
    of these groups is concerned, most organizational structures in many regions,
    while others do not have an organizational structure. This section will briefly
    introduce the range Majlis Dhikr groups in Java that have attracted large numbers
    of followers and participants in their rituals in recent years.


    One of these groups is the Majlis Dhikr al-Maghfira which was established in 1984
    by Ustadz Haryono (by. 1970) from Pasuruan, East Java. This group has a base in
    Pesantren Al-Madinah, Pasuruan, East Java (Haryono 2006:xxx). Before establishing
    his group, Ustadz Haryono was known as a tabib (an Islamic healer) who was able
    to heal sickness using alternative methods that are unknown to the medical world.
    For instance, before healing his patients'' disease to the goat, he asked them
    to provide a goat. Using his spiritual power, he transferred the patients and
    then slaughtered the goat. He still uses this method and other healing methods
    to cure his patients. Because of his profession as a healer, he is known by his
    followers as Majlis Dhikr Penyembuhan (The Healing Dhikr Group). Before widely
    known nationally, this group initially conducted its ritual from house to house
    (dari ke rumah) and in several small village mosques, attended by only a few people.
    Since 2000, the ritual of this group has attracted thousands of people, and can
    now only be held in mosques with a large park or in a sport stadium. This group
    now conducts dhikr ritual in forty eight towns throughout'
