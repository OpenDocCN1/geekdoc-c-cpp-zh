  md: 'by Indonesian Muslims for centuries. Throughout the twentieth century, the
    vehement rejection of Sufi practices among reformist groups represented by Muhammadiyah
    spread widely. In line with their idea of purification, Muslim reformist groups
    saw in Sufism a tolerance of local idolatry, the excessive veneration of a spiritual
    master, and a hierarchical structure which led to deviation from devotion to the
    Oneness of God (I., *tawhid*). According to them, all of these practices had no
    sanction in the Qur’an and hadith. Reformist groups rejected ‘Sufism’ as ‘the
    Islam that is not Islam’ (I, *Islam yang Islam*) (Howell 2001:706).


    During the last decade of twentieth century, Muhammadiyah seems no longer to struggle
    with its puritanical *dakwah*. Instead, Muhammadiyah has given more emphasis on
    social and cultural *dakwah* than puritanical *dakwah*. As a result, Muhammadiyah
    no longer fiercely challenged alleged *bid’ah* rituals that they had previously
    accused the Nahlatul ‘Ulama community, nominal Muslims and followers of Sufi groups
