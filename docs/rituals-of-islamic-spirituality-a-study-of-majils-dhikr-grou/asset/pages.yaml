  md: 'It was reported that he composed the Şalawāt Thalj al-Qulüb because after practising
    the Şalawāt Ma''rifat a number of people experienced zadhba (J., jadhab, attraction),
    a high spiritual experience in which a person is exalted into a state of ecstasy
    and union. The people who experienced jadhba or majdhū (attracted) behaved in
    an uncontrolled way just like crazy people because of the overwhelming shock of
    ‘the unveiling’ (Schimmel 1978). But in the case of Wāhidiyat, they wept all the
    time after practising the Şalawāt Ma''rifat(Madjid 2001:21-27).


    Kyai Abdul Madjid Ma''ruf then composed those three prayer compositions Şalawāt
    Wāhidiyat. As implied in the first Şalawāt, the name Wāhidiyat was derived from
    al-Wāhid, one of the names of God (As al-Husna) which means The One (Qomari 2003:31-32).
    Kyai Abdul Madjid Ma''ruf used the name because, according to Muslim scholars,
    al-Wāhid has many purposes, to get rid of a feeling of confusion and anxiety to
    increase a feeling of God rather than God’s creatures. Another reason might be
    that the use of God’s names in praying is highly recommended by the Qur’an and
    the Prophet tradition that God may grant the prayer. This is revealed in the Qur’an
    as follows:


    > Allah are his names, therefore call on Him, and leave those who violate the
    sanctity of His names; they shall be rewarded for what they did. (7:180)


    At the end of 1963, Kyai Abdul Madjid Ma''ruf invited many kyai and other notable
    figures who practised Şalawāt Wahidiyat to discuss a topic related to Şalawāt
    Wāhidiyat. The meeting, chaired by Kyai Abdul Madjid Ma''ruf, produced several
    decisions including the composition of the text of Şalawāt , the method of reciting
    the Şalawāt, and the guarantee which was: ‘If the Şalawāt is recited for forty
    consecutive days and there is no effect on heart at all, (the author) can be called
    to account in the world and the hereafter.¹ All of this were printed as a pamphlet.
    It was not clear why Kyai Abdul Madjid Ma''ruf proposed putting this guarantee
    in the pamphlet. Qomari Mukhtar (2003), a member of Wāhidiyat, argues that the
    guarantee from Kyai Abdul Madjid Ma''ruf should be seen as a part of his guidance
    to his followers in this order to take responsibility for any matters that they
    have done. Mukhtar maintains that this guarantee should not be interpreted as
    if Kyai Abdul Madjid Ma''ruf guarantees paradise to his followers in the hereafter.
    However, others might argue that the guarantee could be seen as a part of an advertisement
    for the power of the prayer. As a result, the guarantee would convince the readers
    and the followers that the Şalawāt Wāhidiyat can be a panacea for any problems


