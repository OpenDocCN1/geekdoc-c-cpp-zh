  md: 'A stronger rejection of the rituals and practices of the Majlis Dhikr groups
    which has emerged over the last two decades comes from the supporters of Indonesian
    Salafi groups which are strongly influenced by Wahabbism, a reform movement aimed
    at purifying Islam of local accretions. For instance, Abu Maksaka and Jawas, who
    champion the Islamic purification movement in Indonesia, have argued that the
    ritual practice of Indonesian Majlis Dhikr groups mostly falls into the practise
    of *bidah*. They criticise these groups mainly because of the way they recite
    *dhikr* in a group. In their view, such a practice is not sanctioned by the teachings
    of Qur’an, which urges Muslims to recite *dhikr* quietly (Amsaka 2003:85; Jawas
    1423:150-51).


    In contrast to these various critics, I will argue in this thesis that although
    *Majlis Dhikr* groups have been strongly criticised by other Muslims as not *mutabarah*,
    and as pseudo-Sufism or as *bidah*, nevertheless the existence of these groups
    is significant. The fact that these have attracted many followers that the interest
    of Indonesian Muslims in joining Sufi orders (*tarekat*) is strong and is increasing.
    Despite the increasing popularity of them among Indonesian Muslims, these *Majlis
    Dhikr* groups have not only expanded and introduced their ritual and teachings
    well but have also continued to gain favor in both rural and urban areas.


    Understanding these *Majlis Dhikr* groups becomes particularly important in the
    context of the Islamic preaching (*dakwah Islam*) in Indonesia. These groups have
    attracted followers from a wide social base to their practices, hence contributing
    significantly to the improvement of religious practice among Indonesian Muslims
    who were not strict in their daily observance of Islamic practice. Based on their
    understanding of the teachings of *tasawuf*, instead of rejecting nominal Muslims,
    these *Majlis Dhikr* groups have shown respect for and accommodation to all kinds
    of cultural symbols used by these Muslims groups. In so, the presence of these
    Majlis Dhikr groups in the landscape of Indonesian Islam has contributed to narrowing
    the gap between santri Muslims and nominal Muslims, who have long been ideologically
    opposed to one another. This study of *Majlis Dhikr* groups sheds light on increasing
    Islamic spiritual life and practice in Indonesia.


    My research also explores the role that Majlis Dhikr groups are playing in improving
    the quality of interfaith dialogue and searching for a harmonious religious life
    in Indonesia. This important role can be seen from the fact that these groups
    allow the followers of other religions to share and experience their rituals without
    asking them to convert. This respectful attitude toward followers of other religions
    can be attributed to a deep understanding of Islamic Sufi teachings, which strongly
    emphasise respect for people as human beings'
