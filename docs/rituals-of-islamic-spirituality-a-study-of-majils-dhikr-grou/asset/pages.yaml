    strong objections from some of its members, after a long and exhausting debate,
    the committee chaired by Kyai Hakim Asyi eventually declared that the Tijaniyah
    can be considered mutabhar (Muhamin 1995:345). Instead of referring to the criteria
    of *silsilah*, this *dhikr*, *Salawat* and *istighfar*, practised in Tijaniyah
    ritual are compatible with Islamic teaching (Brueness 1995:108). In other words,
    even though the Tijaniyah does not have an acceptable silsilah that can be traced
    back to the Prophet, its are legitimate and can be practised by Nahdlatul Ulama
    members; the Congress was silent about the *tarekat’s* more extreme claims (Piper
