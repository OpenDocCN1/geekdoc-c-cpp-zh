  md: 'Since mujahada has become an important part of Wāhidiyat rituals, it should
    be practised by those who want to join and those who become members of Wāhidiyat.
    It is recommended that the number of one’s mujahada be increased when one becomes
    a follower. This ritual practice of mujahada is conducted in various ways. For
    example, those who are about to join Wāhidiyat have to practise mujahada for forty
    days consecutively. According to my informant, this kind of mujahada constitutes
    the initial part of the Wāhidiyat ritual. It can also be regarded as a dowry (mahr),
    a word used to refer to an obligatory payment by a husband to his wife before
    marriage. Like mahr, the first days of mujahada is an obligation for new followers.
    If they cannot recite the whole of Salawat Wāhidiyat, they must read part of the
    text. This allows those who cannot read Arabic fluently, to become followers of
    Wāhidiyat. Unlike the ritual practice in a Sufi order (tarekat), the candidate
    does not undergo an initiation bay’at (a vow of allegiance) to his or her master.


    Other rituals of mujahada are conducted in Wāhidiyat on the basis of a schedule,
    as Mujahada Yaumiyyat (daily), Mujahada Ubu’iyyat (weekly) by the followers in
    each sub district, kecamatan), Mujahada Rub al-Sanat (quarterly, by the followers
    in each regency, kabupaten), Mujahada Nis al-Sanat (half year, by all followers
    in one province), and Mujahada Kubra (the great Mujahada). This last ritual is
    held twice a year at the centre of Wāhidiyat to commemorate the birth day of Wāhidiyat
    and the Isra’ Mi’raj (the night journey and the ascension of the Prophet) (Anonymous
    1989). Apart from these kinds of mujahada, there are other kinds ofofmujahada
    which are conducted for particular purposes such as Mujahada Pertanian (Mujahada
    for agricultural matters), Mujahada Pengobatan (Mujahada for healing ) Mujahada
    Kecerdasan (mujahada for increasing clearness), Mujahada Keamanan (mujahadafor
    security purposes), Mujahada Non-Stop (24 hours mujahada), Mujahada Pembangunan
    (mujahada for the inauguration of a building) and Mujahada Penyelenggara (mujahada
    for the success of an event). Another type of mujahada is conducted for particular
    events, such as a general election, the commemoration of the revelation of the
    Qur’an (nuzul al-Qur’an), independence, and new year (Anonymous 1996).


    These different uses indicate that the reciting of Salawat Wāhidiyat through ritual
    mujahada is like a panacea by which all problems faced by people can be resolved.
    For example, one informant mentioned that his old grandfather suffered from acute
    hepatitis. His doctor could not do anything to cure the ailment and asked the
    grandson to bring his grandfather home. The grandson then asked all of his family
    to practice mujahada every night'
