    for those who are keen to be gathered with Muslim saints and pious.’⁵


    It is strongly recommended that new members first recite the dhikr once a day
    for forty days consecutively. The formula should be recited for forty days because
    this is the minimal time necessary to show whether or not a Muslim’s good acts
    are able to be considered istiqām (steadfastness). In fact, for this group, notion
    of forty days is taken from Qur’anic teaching that after fasting for forty days
    Moses received the Book from God. This practice is also based on the notion that
    good virtues can only be accepted by God if practised for forty days consecutively.
    In addition, forty days is also used by this group as a requirement for those
    who want to benefit from the formulae. For example, the leader of this group told
    me that kyai practised the formulae for thirty days consecutively, but missed
    the thirty ninth day. As a result, this kyai failed to gain any benefit; he therefore
    needed to restart the ritual from the first day.


    To practise the ritual of the Dhikr al-Ghāfilin, people can practise individually
    or in a group led by a leader (A., imām) elected by the Dhikr al-Ghāfilin leader.
