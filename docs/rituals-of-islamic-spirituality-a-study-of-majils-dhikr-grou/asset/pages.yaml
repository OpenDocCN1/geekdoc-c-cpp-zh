  md: 'Addition to the introduction of the Dhikr al-Ghāfilin, Gus Mik also began to
    introduce Khatm al-Qur’an(J., khataman Qur’an) to the public. Previously, Gus
    Mik held the Khatm al-Qur’an, a particular event involving the recitation of all
    the chapters of the Qur’an, on the anniversary of his father’s day (A., haul)
    and at graduations (A., intihām) in Pesantren Ploso. During this haul, the Khatm
    al-Qur’an not only included reciting the Qur’an (A., bi-nazar), but also memorizing
    all the chapters of the Qur’an. The former was intended for general participants,
    whereas the latter was particularly intended for memorizers (A., hafiz) who were
    invited to the haul. Gus Mik held this *semaan* (Javanese antic), a word which
    is derived from the Arabic word *sami’* which means to listen or pay attention.
    Persons who came to the event were supposed to listen to the memorizers or reciters
    or correct them if they make any mistakes (Thoa 2003:266-27). The first *semaan*
    was held outside the *pesantren* in the house of Dr. Muhtadi, an Indonesian Bank
    Rakyat employee in Kediri, followed by the recitation of the *Dhik al-Ghāfilin*.
    This first *semaan* held outside the pesantren and was attended by hundreds of
    people. Since then, other *semaan* have been held in various houses, not only
    in Kediri but also in other cities in East Java and in other provinces. According
    to Abdul Qadir, one of senior leaders in the group, in 1990 a *semaan* was even
    held in the Yogyakarta palace to commemorate the fourteenth of the death of Hamengku
    Buwono X.


    Gus Mik named the semaan Jantiko which stands for Majlis Anti Koler (anti group,
    I., antic mogok, anti mogok). Kyai Saiful, Gus Mik’s close friend explained to
    me that it was expected that by giving such a name, those who joined the group
    would limit their suffering a loss of spirituality in this world and the world-to-come.
    This name was inspired by Gus Mik’s conversation with a car mechanic, his close
    friend. One day, Gus Mik asked the mechanic whether an old car fuelled by kerosene
    that he designed would break down. The mechanic replied: “Obviously not Gus, because
    this is anti koler (I., antic mogok).” Gus Mik then gave him the name, Majlis
    Anti Koler. However, because of Kyai Dahnan’s suggestion, in 1989 the name was
    changed to Mantab, which means ‘strong’ and able to withstand a test (J., tahan
    uji) (El Ahmad 1993). Abdul Qadir argued that the word *Mantab* stands for *Majlis
    Tapa Brata*, which means the place for remembering God, Kyai Saiful argued that
    the word *Mantab* was taken from two Arabic words *man* and *tāba*, meaning a
    person who reports.


    +   1 This means the recitation of all chapters of the Qur’an while the audiences
    listens to their recitation and makes correction if the memorizers make a mistake.

    2 Interview with Abdul Qadir, Kediri, September, 2004.'
