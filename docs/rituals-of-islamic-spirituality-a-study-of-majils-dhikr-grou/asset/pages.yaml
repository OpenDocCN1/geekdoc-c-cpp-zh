  md: '# Chapter 1 - Introduction


    Nevertheless, the concept of *mu’tabarah* used by the *Jam’iyyat* has not prevented
    the proliferation of ritual groups which are incompatible with the criteria laid
    down by the association. For instance, at one of its official meetings held in
    1957 in Magelang, Central Java, the association declared that Tarekat Shiddiqiyah,
    headed by an NU kyai, could not be regarded as *mu’tabarah* because it did not
    have an acceptable *silsilah* and *murshidship*. Despite this decision, Tarekat
    Shiddiqiyah grows and recruits members from different regions, particularly in
    East Java and Central Java (Qawa''id 192:89). It also continues to operate like
    other recognized *tarekat*.


    In fact, the concept of *mu’tabarah* was debated within NU the Jam’iyiyyah was
    formally founded. For example, in its 6th Congress on August 1931 held in Cirebon,
    NU faced a difficulty in determining whether or not Tijania could be regarded
    as mu’tabarah so that its teachings could be practised by NU members. This problem
    arose due to the fact that the participants of the Congress considered the Tijaniyah
    did not have an acceptable silsilah because the founder of this group Ahmad al-Tijani
    (1735-1781), who claimed that he received the wirid for the Prophet when he was
    fully conscious and in active mind (A., yaqdat not). Another objection to the
    Tijaniyah is related to its teaching that the Tijaniyah followers will be given
