    to solve it. In this case, Slamet pointed out that Wāhidiyat officials never asked
    them to convert to Islam.43 The opportunity to preach the teaching of Wāhidiyat
    and the Şalawat is to be given by the founder not only to the official board members
    but also to the followers and other people. As a result, those who have received
    and practised Şalawat can spread knowledge of the Şalawat to others without asking
    for an ijaza (license) from the leader. With this feature, Wāhidiyat is, in effect,
    a missionary group which strongly urges its followers to spread the teachings
    of Wāhidiyat and the Şalawat to seek new followers. The missionary nature of Wāhidiyat
    was clearly reflected by Kyai Abdul Madjid Ma’ruf. For instance, he suggested
    to his followers on the 25th anniversary of Şalawat Wāhidiyat that, “Within a
    month, every Wāhidiyat follower should recruit at least one new follower” (Anonymous
    1989:70).


    In contrast, Sufi orders, such as Qadiriyah, Naqshabandiyah and Tijaniya, require
    bay’at ijaza for their followers. Only particular disciples who have received
    ijaza from their master are able to seek new followers. In line with this, there
    are three types of ijaza. The first is the lowest one given to disciples to practise
    tarekat. The second ijaza gives authority to disciples, to guide others in practising
    Sufism. The third is the highest ijaza, which authorizes the holder as Sufi master
    to offer initiation to novices (Bruinessen 1992:87).


    43 Interview with Slamet, Kediri, September, 2004.'
