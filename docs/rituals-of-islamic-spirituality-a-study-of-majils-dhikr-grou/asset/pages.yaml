  md: 'As I realized that Tombo At was part of Istighāthat Ihsāniyyat and both were
    led by Gus Abdul Latif, I joined joined Istighāthat Ihsāniyya without doubt. During
    the Tombo At ritual, I felt that Gus Abdul Latif paid his attention to me and
