  md: '# 5.4. The Structure of the Group


    Gilsenan, in his classic study on Saints and Sufi in Modern Egypt, used the terms,
    ‘organisation’ and ‘association’ to describe the structure of Sufi orders. An
    organization emphasizes ‘a high degree of stratification on the basis of differential
    expertise and/or efficiency’. An organization is also characterized by ‘greater
    structural recognition of functional inequality’ and formal control based on ‘a
    hierarchy of authority statuses’. Another mark of organizations is that their
    holders are full time and fully paid. In contrast, an association is characterized
    by ‘loosueness of structure with minimal development of a status hierarchy.’ Individual
    commitment in an association is voluntary and egalitarian. Moreover, the appointment
    of officials is based on administrative convenience. He concluded that the majority
    of Sufi orders in Egypt could be placed on a continuum between association and
    organization (Gilsenan 1973:65-66). Sufi orders in Indonesia can also be shown
    to follow this typology.


    However, Gilsenan’s typology cannot be easily applied to the structure of Majlis
    Dhikr groups like in Indonesia which have hierarchical positions such as (murshid),
    vice-master (khalifah), and disciple (murid), in the Ihsiyat group these positions
    are not recognised. Instead, Ihsiyat only recognises a single position of leader
    who is regarded as a central figure (i, tokoh central) in his group. Although
    there are chairpersons (i, ketua) in some branches, they function as coordinators
    for major istighthath rituals (rutinan selapanan) and other rituals held in these
    branches. The tokoh central cannot come to the ritual, these chairpersons will
    substitute for him to lead the major istighthath (rutinan selapanan) ritual. This
    branch representative chairpersons are appointed directly by the central leader
    without any further qualification and with any limit on the time. As a result,
    they are immediately responsible to him. In this sense, the position of these
    representatives is not the khalifat or naib in other Sufi orders who can function
    as intermediaries linking murid with murshid but also supervising the initiation
    of new murid on behalf of their murshid.


    Because there is no intermediary person to link the members with the tokoh central,
    people find it easy to meet him either privately or on public occasions. For example,
    prior to the weekly istighthath ritual and at the end of the ritual, people can
    freely meet Gus Abdul Latif, in the relaxed context, sitting together chatting
    (J., jagongan) with him. It is on this occasion that people can ask, consult,
    and discuss everything with their leader. Moreover, such occasions are sometimes
    used by the leader to give religious messages to his members informally. It is
    also evident on such occasions how the tokoh central'
