  md: 'context of Islamic Sufism, how they disseminate their teachings or how they
    respond to various aspects of practical Sufism, as well as how these groups regard
    their rituals as legitimate practice within Islam.


    In comparison, as M. Bruessen has observed, the quantity and the quality of studies
    of tarekat (Sufi group) has proliferated during the last decade of the twentieth
    century, following the increasing popularity of tarekat in many parts of the Islamic
    world including Indonesia. Since the 1990s, people have witnessed an abundance
    of works about Sufism in different regions, such as the Middle East, South Asian,
    Southeast Asia, West Africa, East Africa, and even, Europe. In addition, several
    international scholarly conferences on Sufism have been held to discuss different
    Sufi groups, as for example conferences on Naqshabandingiyah (Paris 1985), Bektashiyah
    (Strasbourg, 1986), Malamatiyah (Istanbul, 1987) and Mawlawiyah (Bamberg, 1991),
    and a debate between proponents and opponents of Sufism held in Utrecht in 1996.
    In response to this increasing interest in Sufism, several big publishers such
    as Hurst & Co., Curzon Press, and E.J. Brill have published books on Sufism. E.
    J. Brill, is preparing to publish ‘The Encyclopaedia of Islam’, The Encyclopaedia
    of Sufism(Sujuti 2001:xv). All this indicates an increasing interest in Sufism.


    Likewise, studies of tarekat in Indonesian Islam gained popularity among Indonesian
    and Western researchers during 1990s and the early part of the current century.
    Publications include those by A.G. Muhamain (1995; 2006), Endang Termudi (1996),
    Howell (2001), Martin van Bruessen (1992), Sukamto (1999), Sujuti (2001), Zamkarsari
    Dofier (1982; 1999) and Zulkifi (2000). Among these studies, Zamkarsari Dofier’s
    study of pesantren traditions is regarded as profound and important examination
    of Islamic traditions including the history and practice of the Qadiriyah Naqshabadiyah
    in Rejooso Jombang, East Java. This group is presently one of the orders with
    the largest following in Indonesia. In his study, Dofier argues that tarekat have
    been an important means of spreading Islam since the early part of Islamization
    in the Indonesian archipelago. Through the leadership of the kyai in pesantren,
    tarekat have spread Islamic teachings among Javanese in particular. Furthermore,
    pesantren have become places for providing the leadership of tarekat. This can
    be seen in the case of Pesantren Tebiring in Jombang, which has played an important
    role in providing most of the influential leaders of Qadiriyah Naqshabadiyah in
    East Java. All of these figures were graduates from this pesantren, even though
    Pesantren Tebiring is not a pesantren tarekat (Dhofier 1999: 151).'
