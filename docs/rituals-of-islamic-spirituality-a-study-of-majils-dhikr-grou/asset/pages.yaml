  md: 'Chapter IV


    The Mujahada Kubrá was held for four consecutive days. From the first day to the
    third day, Kyai Abdul Madjid Ma''ruf''s family voted for the candidate to lead
    the sunset prayer. The informant maintains that Abdul Latif Madjid was elected
    as the leader of the sunset prayer for the first day, while his brother, Abdul
    Hamid and his relative, Imam Yahya were elected leaders on the second and third
    day respectively, Abdul Latif Madjus succeeded the founder as leader on both the
    first and the last day of the Mujahada Kubrá.¹16 This could be interpreted as
    an indication that Abdul Latif Madjid should succeed the founder and was one way
    to convince followers that Abdul Latif Madjid was the most eligible person to
    succeed the founder of Wāhidiyat.This event reminds us of the story of the success
    to Prophet. During his last illness, the Prophet deigned Abu Bakr to lead prayer.
    Many took this gesture as an indication that Abu Bakr would succeed the Prophet.
    Upon the Prophet''s death, he elected the first Caliph, by the acclaim of the
    people at the meeting of Saqifat.


    According to the PSWP faction, before Kyai Madjid Ma''ruf was buried, his wife
