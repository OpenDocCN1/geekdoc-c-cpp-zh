  md: '# 6.2. The Ritual Practice of the Group


    The ritual of this group focuses on the reciting of dhikr. In common with many
    other Sufi groups, dhikr for this group constitutes ‘a way or a rule of life’,
    which should be practised by its members to purify their soul (A., nafs) in order
    to approach God and pious servants (I., kehendakan tulus). Gus Mik specifically
    said that the recitation of the Dhikr al-Ghāfilīn formulae can conveyed to the
    spirit lead to tranquility and the strengthening of the heart as well as to safeguard
    against the horror of the world and the day of resurrection.


    According to the guide book for the Dhikr al-Ghāfilīn (Anonymous) n.d:2-30, this
    dhikr starts by seeking a means (A., wasilaat) through the recitation of al-Fātiḥat,
    hundred times. The merit of this recitation is conveyed to the spirit of the Prophet
    Muhammad, Abdul Qadir al-Jaylānī, Imam al-Ghazālī, Habib Abdillah ibn ‘Ali al-Haddād
    (the author of Rātib al-Haddād) and closes with the prayer of al-Fātiḥat. These
    figures are mentioned in the formulae because they were believed by Gus Mik to
    be figures who continuously recited al-Fatihat hundred times ever. The section
    then continues with the recitation of Ayat Kursi and Asmāul Husnā(ninety times
    of God), followed by a short prayer repeated times in union.


    In the second section, the al-Fātiḥat tawassul is recited again three times, specifically
    to be conveyed to the spirit of God’s previous prophets, particularly those who
    have received the title of ‘Ulul Azmi (with those for resolution) as Abraham,
    Moses, Jesus and Noah (46:34), and all the Angels of God. An exaltation as Salawat
    Muqarrabin is recited for those Angels are regarded as the closest Angels to God,
    including Gabriel, Michael, Isrofil, Azrael, the ‘Arsh Guardian Angels, and for
    all God’s Prophets. This Salawat Muqarrabin continues with the recitation of al-Fātiḥat
    three times whose merit is conveyed to the Prophet Muhammad and his wives, children,
    descendants, companions, al-Badr (who died in the battle of Badr) from the Muhajirīn
    (the Prophet’s companions from Mecca) or the Anṣār (the Prophet’s companions from
    Medina), all the Prophet’s followers, martyrs (I., shuhadā), ‘ulamā’, all Muslim
    saints, all the pious, all Muslim participants’ grandfathers, grandmothers, fathers,
    and mothers. The next procedure is to recite al-Fātiḥat specifically directed
    to the Prophet Muhammad as the source of intercession (shafā‘at). This is continued
    by the reciting istighfar far one hundred times.


    Then follows the recitation of al-Fātiḥat tawassul for the Prophet Khidr, the
    Prophet’s grandsons, Hasan and Husayn, ‘Āfi ibn Abi Tālib, and Fāṭimat, the Prophet’s
    daughter. The other people for whom al-Fātiḥat is recited well'
