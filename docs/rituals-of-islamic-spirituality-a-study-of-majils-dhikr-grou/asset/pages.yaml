    them not to discuss the registration or the statutes since they had not been resolved
    by the central board members of the Whidiyat. As a result of this, Kyai Abdul
    Madjid Ma''ruf issued a letter that suspended the members of PSWP or MPW and asked
    the general members to nominate people for a new structure for the Wāhidiyat organization.
    In this structure, those that had been involved in the conflict could become members.


    This incident shows, that the problem in Wāhidiyat happened as a result of the
    dissatisfaction and rivalry between two factions. The establishment of the new
    organization did not contribute to reducing the tension as long as those people
    involved in the conflict were still elected for the new structure. This was evident,
    particularly when the founder and the author of Salawat Wāhidiyat died in 1989
    (Yusuf 2003). As result, conflict between the two factions became stronger and
    this contributed to the break up of the organization.


    The conflict emerged again, even more strongly because the two factions found
    it difficult to agree on a successor to the founder. Abdul Latif Madjid was convinced
    that he was entitled to the successor since he was the oldest son, although he
    was not the first child because he had other sisters. The pesantren tradition
    descent is important since knowledge and blessing are genealogically transmitted
    (Woodward 1989). In addition to this, his loyal followers were also convinced
    that he should succeed the father, his Kyai Abdul Madjid Ma''ruf did not clearly
    bequeath Wahiyat to him. This conviction was based on the signs and gestures given
    by the founder, that Abdul Latif Madjid would be his successor. For example, one
    informant tell that during the founder''s last illness, Kyai Abdul Madjid Madjid
    designated Abdul Latif Madjid to lead the prayers in his absence on the fourth
    day of Mujāhada Kubrā, a half yearly ritual in Wāhidiyat, particularly the sunset
    prayer which Kyai Abdul Madjid Ma''ruf had always lived during the Mujāhada Kubrā.
    This was the last Mujāhada Kubrā for the founder since he died ten days later.'
