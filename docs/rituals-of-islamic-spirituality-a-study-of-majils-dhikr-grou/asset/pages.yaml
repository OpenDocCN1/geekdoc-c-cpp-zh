    This is partly because this period herhetical sects appeared and occurred the
    murder of some Companions. As a result, Satori points out that with their dark
    side, this period cannot be idealized as the best of all legal sources, as the
    Salafi believe. There is no clear argument in the hadith mentioning that this
    *salaf* period should be regarded as a reference in legal matters (Satori 118-123).


    # ## 2.3. Conclusion


    It is clear that the difference in the views regarding ritual actual practice
    between the Indonesian Salafi and the proponents of *Majlis Dhikr* can be traced
    back to their different interpretation of the concept of *bid‘ah*. The Salafi
    believed that all rituals categorized as *bid‘ah* should be considered misleading
    and the perpetrators not to be tolerated. For them, in order to be good Muslims,
    it is essential to avoid such *bid‘ah* in worship (*ibadah*). In this regard,
    efforts should be made to purify Muslims from this path of *dakwah* which is strongly
    recommended by Islam (Al-Mukaffi 2003:xx). With this belief, the Salafi guard
    the practice of reciting vocal *dhikr* in union as misleading *bid‘ah* but also
    considers that its performers should be brought to the right path and to authentic
    Islamic teachings (Al-Mukaffi 2003:x). In contrast, the proponents of *Majlis
    Dhikr* believed that their vocal *dhikr* in union has a strong basis both in the
    Qur’an and hadith. For that reason, such ritual cannot be considered *bid‘ah*
    because its theological basis can be found in both sources of Islamic conduct.
    For the proponents of *Majlis Dhikr*, rituals can be considered *bid‘ah*, if the
    Qur’an, hadith, the practices of Prophet’s Companions, and the consensus


