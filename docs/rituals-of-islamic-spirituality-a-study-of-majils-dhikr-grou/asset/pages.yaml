    # 5.5. From Tombs to Mosques: Implementing Sufi Dakwah and Religious Tolerance


    Dakwah is a Qur’anic concept that has been widely used and practised by Muslims.
    However, since this has different connotations and understandings, Muslims in
    diverse parts of the world perceive the practice of dakwah in various ways. In
    Indonesian Islam, dakwah is applied and interpreted in different ways. Some people
    use the concept in ‘its restricted form (to apply only within Islam), others use
    dakwah in its open form (for all of humanity). As Gade explained, dakwah basically
    means ‘call to deepen one’s soul or encourage others’ Islamic piety’ (Gade 2004:16).


    For the leader of Ihsaniyyat, dakwah is understood not only as encouraging others’
    Islamic piety but also seeking the guidance of God (I., hidayah), which is necessary
    for the success of dakwah. It is in line with this definition that the ritual
    of Istighath Ihsaniyyat is combined with a religious lecture (A., mauzat al-hasanat).
    The first aim is to ask God’s guidance and to deepen and encourage others’ Islamic
    piety. Gus Abdul Latif believes that without God guidance (I., hidayah), the objective
    of dakwah will not be perfectly achieved. Likewise, istighathat without mauzat
    al-hasanat is ibadah without knowledge (I., ilmu), which is considered worthless.
    To achieve hidayah entails the purification of one’s heart from negative worldly
    desire. This purification can be done through istighathat which contains continuous
    worship and repentance.


