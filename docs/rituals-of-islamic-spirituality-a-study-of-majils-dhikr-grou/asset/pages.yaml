  md: '# 3.5.1. The Concept of Tabarruk As Understood by Majlis Dhikr Groups


    In relation to tabarruk, Indonesian Majlis Dhikr leaders define barakah as ‘increase’
    (Aʿ, *ziyād*) or ‘growth’ (Aʿ, *nama*). In other words, Muslims who perform tabarruk
    are seeking an increase or growth in something such as their possessions, wealth,
    or offspring. In line with this definition, Kyai Misbah, a senior leader among
    Majlis Dhikr groups in Jampes Kediri, told me that barakah is a quality that can
    lead to an increase in other qualities. However, for him, some qualities cannot
    grow or increase, as he explained in the following:


    +   - For instance, some people have mastered many kinds of Islamic knowledge.
    Nevertheless, the knowledge they have does not contain barakah because they use
    the knowledge for the benefit of themselves. They never spread and teach the knowledge
    for the benefit of other Muslims, such as teaching the knowledge to other people.
    Another example of barakah is someone who has a rice field. Even though the rice
    field is not large enough, these people can share their harvest with the needy.
    In this, this rice field can be regarded as having barakah.


    In this sense, something can be regarded as having barakah if it can generate
    further qualities and benefit for other people.


    According to Kyai Misbah, there are two kinds of barakah. The first is a barakah
    which is dependent (I., *disandarkan*) on humankind. This type of barakah is similar
    to wasilat; hence a person who becomes the object of tabarruk as a means to ask
    God. In this sense, when people see barakah from righteous dead people, they should
    not ask the people in the grave because the source of the barakah is God. Like
    the Salafi groups, Kyai Misbah pointed out that since it is only God who has the
    authority to give barakah to someone, people should ask for barakah to God rather
