  md: '# Rituals of Islamic Spirituality


    After the religious lecture, the main ritual of *istighāthā*, that is tawassun,
    occurs. This consists in reciting the *al-Fātihat*chapter conveyed by the Prophet
    Muhammad, and from him succession to his families, his companions, the generations
    after companions (A., *tābi‘in*), the generations after (A., *tābi‘ al-tābi‘in*),
    the saints (A., *auliyā''*), Muslim scholars (I., *lama*), and all virtuous Muslims
    (A., *sāliīn*). Other prophets such as Adam and Eve, Khidr, Elias, are also specifically
    mentioned. Other names recited can cite ‘Alī ibnAbīṬābih, the only one of the
    Prophet’s companions specifically mentioned in the list; Abu Āmīd ibn al-Ghazāli;
    ‘Abd al-Qādir al-Jaylān, the founder of the Qadiriyyah orders; ‘Abd al-Salām ibn
    al-Buni (d.1228), the founder of the Shadhiliyah orders; Abu Allah ibn ‘Abd al-Jabbār
    al-Shā‘rī (d.1258), the founder of Shadhiliyah orders; Abu al-Abbās ibn Aliy,
    the author of Shams al-Ma‘rifī (The Illumination of Knowledge) which is the most
    widely read medieval Islamic treatise on talismans, and the magical square (A.,
    *wifīq*) in pesantren; ‘Abd al-Wahhāb al-Shā‘ī (d.1565), the founder of Shara‘niyyat
    orders, and Abū Madyan al-Maghāribī (d.1197), the teacher of Ibn Mashish.


    It is clear that some of the names cited during tawassulan are renamed, which
    have important positions in the chain of transmission in various Sufi orders.
    Pronouncing these names during the tawassulan session does not mean that these
    names are considered as transmitters (A., *silsilah*) of the Ihsāniyat group.
    These names are cited to obtain blessing from those who are considered to be ‘the
    axis of saints’ (A., Qutb al-Aqtab). It is believed that these saints, despite
    their death, ‘reside simultaneously in their tombs and in heaven’ (Woodward 1989).
    Moreover, they are also believed to be capable of becoming involved in the lives
    of those who pray (Ewing 1997:117).


    Other names cited during the *tawassulan* session are the leader’s family ancestors
    including *SheikhYāhūda*, *Sheikh Mesir*, *Sheikh Ujang Sālih*, *Nyai Istani‘ah*,
    *Sheikh Dāhlān*, *Sheikh Ihsān*, *Sheikh Muhammad*, and *Nyai Hasanah*. Apart
    from the last two, these names are also cited during the *tawassulan* session
    held by the Yamisida group. These names are not mentioned by Yamisida because
    they are not regarded as family ancestors of the leader. Sheikh Muhammad was the
