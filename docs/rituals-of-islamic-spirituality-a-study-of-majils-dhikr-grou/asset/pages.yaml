  md: 'This might be explained by another expression that ‘a follower of tarekat is
    also a Sufi, but a Sufi does not have to be a follower of tarekat’ (Zulkifli 2001).
    Pesantren have thus played an important role in the maintenance of Sufi practices
    from the early days of pesantren in Indonesia.


    Despite the fact that Wahidiyat is not a Sufi group, it nevertheless teaches and
    practices Sufi teaching as practised by other Sufi orders. In order to develop
    its, Wahidiyat realizes that pesantren are a strategic means to disseminate its
    teachings. Therefore, pesantren are used not merely to teach basic religious knowledge,
    the Qur’an, law and theology, to mould Wahidiyat ‘ulama’ (Muslim scholars) who
    are the heirs of the prophets (warath al-anbiya’) but also to create Wahidiyat
    active in every aspect of life. To be more specific, the education system in the
    pesantren strives to make wali intelekt, intelektual yang (‘intellectual saints’
    (wali or arif who ‘saintly intellectuals’ of modern knowledge who have achieved
    ma’rif). A similar vision is viewed particularly by pesantren that adopt a secular
    system of education as well as salafi pesantren methods. Pesantren Teubiring in
    Jombang, for example, aims to train its students to become intelektual dan intelektual
    kaum (Dhofier).


    To implement this vision, Pesantren Kedunglung offers two types of education.
    The first type is an education system which is in cooperation with the Ministry
    of National Education (I., Departemen Pendidikan Nasional), and the Ministry of
    Religious Affairs (I., Departemen Agama) offering courses ranging from elementary
    level to university level (SD, SMP, SMU and Sekolah Tinggi Ekonomi) Wahidiyat
    and Sekolah Tinggi Agama This system enables various schools to receive educational
    subsidies from both the Ministry of National Education and the Ministry of Religious
    Affairs. The second type is a diniyah system which adopts pesantren methods. This
    system consists of several levels from Taman Pendidikan Al-Q’an (TPA), Madrasah
    Ibtidaiyah (elementary school), through Madrasah Tanwiyyah (secondary), to Madrasah
    ‘Aliyah (high school). The characteristics of the diniyah system can be clearly
    seen from the texts used in the pesantren. Most of the texts are Arabic texts
    (kitab kuning) which are also widely used in many other pesantren salaf (traditional
    pesantren) and include Islamic jurisprudence (fiqh), Arab grammar (Nahwaland Saraf,
    Tawhid), and the study of the Prophetic tradition (Hadith), the knowledge ofofHadith
    (‘Ulum al-Hadith), Islamic history (Tarikh), and Islamic ethics (Akhlaq). The
    texts are given in evening class in accordance with their level of study. In addition
    to the texts, other local subjects


