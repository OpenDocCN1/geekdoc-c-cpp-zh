    The Wāhidiyat lecture during Mujāhada Kubrā is usually given by an appointed preacher.
    The aim of this lecture is to increase the followers'' understanding and strengthen
    their loyalty to Wāhidiyat. It is in this lecture that the preacher usually persuades
    the followers of the importance of reciting Salawāt Wāhidiyat and mujāhada,telling
    of miraculous stories experienced by other followers. Only those who come early
    are able to sit near the stage to follow this lecture, others sit on mats outside
    the main location, where they can follow the lecture from a big video-link screen
    provided by the officials.


    Unlike Sufi orders which require their followers to have reached a certain age,
    in Wāhidiyat, children are allowed not only to participate in Mujāhada Kubrā ritual
    but also become Wāhidiyat followers. Other Muslim groups object to this, arguing
    that the involvement of children in Sufi practice does not educate them since
    they are too young to experience and practise Sufi knowledge. As informed by Sodli,
    one of Muhamadiyah members compares the involvement of children in Sufism to asking
    a baby to eat hot chilli (Sodli 1990:28). In other words, it is argued that Sufi
