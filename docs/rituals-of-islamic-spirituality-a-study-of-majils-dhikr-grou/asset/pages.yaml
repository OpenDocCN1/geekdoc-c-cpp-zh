    # 3.4. Sending the Merit of Pious Deeds to Deceased Persons


    This topic is related to matters discussed within Islamic jurisprudence (I., fiqih)
    especially regarding the question of whether deceased persons can obtain benefit
    from the deeds of others. This question generates other questions. For example,
    one can give the merit of their deeds, such as reciting the Qur’an (A., shadaqat),
    sacrifice (I., kurban), performing pilgrimage to Mecca (haji) and fasting, to
    deceased persons, and are deceased persons able to receive the merit of such pious
    acts. Within Islamic jurisprudence, this topic is categorized as a disputed matter
    (A., khilāfiyyat), and has been the subject of debates among religious scholars.
    Not all Muslims jurists (A., fuqaha) agree on the permissibility of such practice.


