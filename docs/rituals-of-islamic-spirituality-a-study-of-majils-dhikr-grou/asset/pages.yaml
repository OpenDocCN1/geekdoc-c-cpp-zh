    ‘When you lead the recitation of the Dhikr al-Ghāfilin, I pray pray for you at
    Ka’bah’ (Siddiq n.d.:40).


    Based on the consent he received in this dream, Kyai Ahmad Siddiq was much more
    confident to practice this dhikr formulae. Moreover, he claimed although he did
    not promote and advertise this formula to the public, it attracted a large number
    of followers to practise the ritual of the group.


    Kyai Ahmad Siddiq did not publicly launch the formula but only disclosed it to
    a limited number of people in Jember. Similarly, Kyai Saiful maintained that Gus
    Mik did not launch the formula to the general public because at that time Muslims
    practised dhikr formula by Suf orders. In 1983, Gus Mik not only practised the
    formula personally in Tanjung (East Java) and established a group called the Dhikr
    al-Layviyyat. However, this group did not attract many followers. Three years
    later, when friction occurred in some tarekat (Suf orders) in relation to the
