  md: '# 4.4. The Teaching of Wāhīdiyat


    The doctrine and rituals of Wāhīdiyat practised by its followers were created
    by Kyai Abdul Madjid Ma''ruf, the founder of Wāhīdiyat. Kyai Abdul Madji Madjid
    Ma''ruf did not write any book explaining the doctrines of Wāhīdiyat. The only
    reference which can be relied on is based on the transcript of his instructions
    in Kitab-al-Hikam published by the Wāhīdiyat Foundation in a book entitled Pengajian
    Kitab al-Hikam dan Kuliah Wahidiyah Ad Pagi Oleh Al-Mukkarram Mbah KH. Abdul Madjid
    Ma''ruf Qaddasallohu Sirroho Wa RA (The Instruction of al-Hikam and the Sunday
    Morning Wāhīdiyat Lecture by Al-Mukkarom KH. Abdul Madjid Ma''ruf Qaddasallohu
    Sirroho RA, 2001). This book is available only in the Wāhīdiyat shop in Kediri.


    According to the author of Wāhīdiyat, Salawat Wāhīdiyat is based on the Qur’an
    and the basic sources of Islam, which consequently form the foundation of the
    teaching of Salawat Wāhīdiyat. What is meant by the teachings of Salawat Wāhīdiyat
    is the practical guidance for the inner life and the external life, driving of
    Islamic law (shari’at) and haqat (the truth) in the improvement of faith (iman)
    and in the mystical knowledge of God (ma''rifat), the observance of Islam, the
    actualization of ihsan (goodness)²² and the implementation of morals (akhlāq).


    It is clear from this definition that the teaching of Wāhīdiyat includes Islamic
    law (shari’at), (akhlaq) and the transcendent truth (haqiqat or ma''rifat). These
    three aspects of the teachings are similar to the tripartite path to God which
    is widely known in Sufi traditions, that shari’at, tariqat, and haqiqat or ma''rifat.
    These three aspects of Whīdiyat teaching are regarded as an essence and its nature,
    like sugar and sweetness, neither of which can be separated. Therefore, people
    cannot ignore one of these three aspects and stress the others (Madjid 2000a:20).
    According to Kyai Abdul Madjid, shari’at without haqiqat is empty, while haqiqat
    without shari’at is invalid (Madjid 1423a:20-25). On the basis of this definition,
    the ultimate aim of Wāhīdiyat teachings is to achieve ma’rifat or wujud with God.
    However, instead of using the word tariqat (the mystical path to God), the founder
    of Wāhīdiyat used akhlaq in his definition of Wāhīdiyat teachings. He omitted
    the word tariqat because Wāhīdiyat is not categorized as a tariqat (I: tarekat,
    sufi order) and never regarded Wāhīdiyat as a tariqat. Moreover, if the wordtariqat
    were mentioned in the teachings, it might raise objections from the leaders of
    established tarekat. Nevertheless, Kyai Abdul Madjid Ma''ruf argued that'
