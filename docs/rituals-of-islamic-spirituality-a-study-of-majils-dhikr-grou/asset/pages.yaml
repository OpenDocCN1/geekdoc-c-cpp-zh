  md: 'As for the semaan event that I attended, this event began after completing
    the dawn prayer and ended at the Isha prayer. During this event, all chapters
    of the Qur’an were recited by male memorizers (A., ḥafīdhīn) using a loud speaker.
    As usual they sat on a stage which was higher than the participants'' seats so
    that the participants could observe them easily. All the female and male participants
    in the semaan directly faced the stage. The position for female and male participants
    was separated during this ritual. Those who attended the semaan had to follow
    and listen carefully to what the memorizers recited by looking at their Qur’an
    provided by the host of the event. In this way, the participants were not only
    able to correct the recitation of the memorizers, but they were also able to gain
    the merit of the recitation even though they followed followed and listened, because
    according to the Prophet, both those who recited the Qur’an from memory and those
    who listen to the reciting are able to obtain merit. The reciting of the Qur’an
    in the semaan was conducted continuously, and was only stopped for the performance
    of obligatory prayers. (I., Shalat Dhuhur), the memorizers and all the participants
    had lunch together, which was provided by the host of the event. For an important
    event such as the commemoration of the death of the founder, the host provides
    lunch for all participants. Previously, my informant told me, when Gus Mik (the
    founder) was alive, it was recommended that the memorizers and all participants
    fasted during this event.


    At the rituals that I attended, the leader of this group often gave a short religious
    message to the participants at the end of the ritual and the semaan. The topic
    of the message was usually based on the preference of the leader. The leader often
    talked about the spiritual experience or karamah of Gus Mik, the founder of the
    group. It is likely that to keep him in the collective memory of the participants.
    This is partly because Gus Mik died, no one, including his children could replace
    his popularity as a wali. Nevertheless, members of the group still believed that
    the charisma of Gus Mik should be inherited by one of his sons. This is shown
    by the fact that after the ritual, most of the participants wanted to meet and
    seek barakah from Gus Mik’s sons by kissing their hands. In order to do that,
    these participants sometimes stood for a long time waiting their turn to kiss
    the leader’s hand. Before Gus Mik’s sons led the ritual, some of his followers
    visited their home to ask for their barakah or to consult them about their problems.


    In addition to holding the ritual on specific occasions like the anniversary of
    the death of particular Muslim saints the the, group also conducted the ritual
    on a weekly basis and every selapan (every five weeks) in a group. At the weekly
    event, the ritual was usually held at the household of the leader or at one of
    the tombs of Muslim Saints located in Kediri. The tombs which'
