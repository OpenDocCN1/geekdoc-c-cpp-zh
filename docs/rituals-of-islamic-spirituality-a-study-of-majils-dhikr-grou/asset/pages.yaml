  md: '# Rituals of Javanese performances in the Iḥsaniyat group’s dakwah


    The involvement of Sunan Kalijanga reminds us of one the nine saints (l., Wali
    Sanga) of Java, who introduced Javanese gamelan of sekaten (l.,gamelan sekaten)
    in his dakwah in commemoration of Prophet Muhammad’s birthday (l., maid). The
    word sekaten is a Javanese word which is adapted from the Arabic *shahādat* (the
    two sentences of the declaration of faith, the first pillar of the five pillars
    of Islam). Sunan Kalijanga used the story and actors in shadow puppet, (*wayang
    kulit*) performances and creatively modified them to propagate Islam (Saksono
    1995-91). In fact, as van Dijk (1998:225) has described, Wali Sanga propagated
    Islam in Java with ‘tact and moderation and accepted culture wherever possible.’
    They never touched, criticized or banned any sensitive issues and local customs
    in the society by rigidly imposing religious teachings, even though they lived
    in an *abangan-santri* society.


    In addition to his tolerance Javanese culture and arts, *Gus Abdul Latif* also
    demonstrated his tolerance toward other religious followers. For example, he allowed
    a Christian to join regularly in the *istiğath* ritual held without asking him
    to convert to Islam. Gus Abdul Latif demonstrated his tolerance toward followers
    of other religion by praying sincerely for a Christian, at his request, for finding
    in a new hope. The reason for accepting this person as a member of the group is
    related to his *dakwah* strategy to show the tolerance and inclusiveness of Islam
    toward other religious beliefs. *Gus Latif* stressed that Islam and other religions
    have many more similarities than differences.22


    Another reason to accept followers of other religions as *Iḥsaniyat* members is
    to provide a bridge for interfaith dialogue and mutual understanding, the significance
    of this is essential in building religious life in Indonesia. The significance
    of this religious relationship can be concluded, for example, from a dialogue
    between a Christian and *Gus Abdul Latif* concerning a comment put forward by
    Abu Bakar Ba’asyir, ‘We have to destroy America, and enemies of Islam in Indonesia.’
    In response to this, Gus Abdul Latif said that every Muslim knows that and so
    one should not be worried by his threats. If this problem is not communicated
    in the frame of religious friendship, Gus Abdul Latif believed, followers of religions
    other than Islam will think that the majority of Muslims are like Abu Bakar Ba’asyir.
    Therefore, interfaith friendship and dialogue are important to reduce potential
    conflicts between religious beliefs because of misunderstandings. This mission
    is relevant to the motto of this group, that is, as a builder of a conscious and
    adhesive *ummat* (l., pembina mental dan perekat umat).


    > 22 Interview with Gus Abdul Latif, Kediri, October 2004.'
