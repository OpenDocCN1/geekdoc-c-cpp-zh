  md: '# # Chapter III: The Intellectual Response of Indonesian Majlis Dhikr Groups
    to Some Aspects of Their Ritual Practices


    Although the Majlis Dhikr groups that I studied cannot be categorised as recognized
    tarekat (tarekat mu''tabarah), their ritual practices have been strongly influenced
    by *tasawuf* teachings. For example, the *dhikr* ritual practised by these groups
    is similar to the ritual that has long been practised by other *tarekat* groups.
