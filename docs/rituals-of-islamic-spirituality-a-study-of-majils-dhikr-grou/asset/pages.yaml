    It took eighteen years to complete the composition and the ritual of Salawāt Wāhidiyat.
    This was not a short time to accomplish the teaching and the composition of Salawat
    Wāhidiyat. In 1964, the first of a series of one week Wāhidiyat camps held many
    delegations from East Java such as Kediri, Blitar, Ganjur, Jombang, Mojokerto,
    Surabaya, Malang, Madun, and Ngawi. Activities were guided directly by Kyai Abdul
    Majjid Ma''ruf who gave a series of lectures about Salawāt Wāhidiyat for new preachers
    of Wāhidiyat (da''). As described by Mukhtar (1997), the first Wāhidiyat camp
    was attended by many ''ulamā''and kyai. However, not every participant came the
    camp just to test Kyai Abdul Majjid Ma''ruf on matters to which he did not know
    the teachings of Wāhidiyat. If Kyai Abdul Majjid Ma''ruf could give a satisfactory
    answer, then they would submit to him.


    On the final day of the camp, Kyai Abdul Majjid explained the qualifications that
    disciples (murid) and spiritual guides (murshid) should have. As retold by Mukhtar,
