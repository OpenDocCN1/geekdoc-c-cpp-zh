  md: '# Rituals of Islamic Spirituality


    and God’s creatures, irrespective of their religion. Without doubt, this tolerant

    attitude and emphasis on the spiritual aspects of religiosity are needed to create

    a peaceful religious life in Indonesia.


    Contrary to accusations by other Muslim groups Majlis Dzikir groups are

    practising bid’ah, are synretic and represent pseudo-Sufism, these groups

    in, fact, strongly influenced by orthodox tasawuf teachings, and the

    members of these groups operate in the framework of mainstream Sufi practices.

    For example, many of the terms and symbols used within the teachings of Majlis

    Dzikir groups are adopted from similar Islamic terms and symbols commonly

    by acknowledged Sufi groups. Moreover, most of the teachings of Majlis

    Dzikir groups result from their response to, and interpretation based on the two

    sources of Islamic law, that is, the Quran and hadith, as well as the views of

    of prominent Muslim Sufi scholars. Therefore, instead of practising bid’ah

    and carrying out synretic rituals, I argue in this study that these groups have

    creatively interpreted and adapted the Quranic and hadith teachings in order to

    make themselves relevant in a mainstream Indonesian Islamic context. These

    groups also claim that the aim of their rituals is to attain closeness to God,

    which is also similar to the aim of the ritual practice conducted by tarekat

    groups. Majlis Dzikir groups can thus be utilized as another means for

    Indonesian Muslims to seek spiritual closeness to God.


    Another significance of this study is that it challenges Geertz’s research on

    the development of Sufism in Muslim-majority countries. In his view, economic

    development and the expansion of modern sectors Sufism on Muslim countries

    will result not only in the demise of Sufi orders in those countries but also

    lead to the triumph of Muslim scripturalist groups. Research conducted by

    Julia Howell proves the inaccuracy of Geertz’s prediction. According to

    Howell, despite their challenge and rejection not only shown signs of

    vigorous growth but also attracted an increasing diversity of participants

    (Howell 2001:722). Not only has there been a proliferation of Sufi orders in

    current Islamic Islam, but also a proliferation of other Islamic spiritual

    groups, such as Majlis Dzikir groups, in both rural and urban areas.


    As far as I am aware, no comprehensive or specific studies have been conducted

    on Majlis Dzikir groups in Indonesia. Since scholars have erroneously regarded

    these as Sufi groups (tarekat), these groups have usually been discussed

    in studies either on general topics such as Sufism or Sufi groups in

    Indonesia, or on the religious revival in Java. In fact, Majlis Dzikir groups
    are

    not the same as Sufi groups (tarekat). As a result, little attempt has been made

    to provide a critical analysis of the teachings and rituals of these groups in
    the'
