    made the leader central to the devotion of his followers in seeking his barakah
    (blessing) and attaining spiritual experience.


    Therefore, it is not surprising beside the quietness of heart which can be achieved
    by practising Salawat Wāhidiyat, pengalaman rohani is also considered an important
    achievement. Furthermore, this is considered the highest achievement that most
