  md: 'provided a venue for the ritual included the tomb of Setono Gedong, the tomb
    of Muhammad Abdullah Umar (Sumer Dingu, Kediri), the tomb of Ki Demang (Madal),
    and the tomb of Shaikh Ihsan Dahlan (Jampes, Kediri). On the other hand, the major
    ritual held every five weeks (selapanan) was conducted at the Tomb of Saints (Makam
    Auliya'') at Gus Mik was buried. The ritual held at his tomb could be attended
    by thousands of people, who travelled from all Java to attend.


    Gus Fari Fauzi, one of leaders of his group, told me that the first reason for
    holding the ritual at Muslim saints'' tombs was to remember death. Secondly, it
    was to pray for all Muslims. Thirdly, it was to gain blessing (barakah) since
    it is recommended to visit the tombs of pious Muslims to emulate their virtues
    in fulfilling religious duties. The fourth reason was to fulfil the obligation
    to parents and fellow Muslims who needed to be prayed for if they died. The ritual
    could express one''s respect to someone they had known and loved. And another
    that the tombs of saints are afflicted places which to offer prayer.


    In common with Sufi elsewhere, as in Pakistan and Egypt, the Dhikr alGhafilin
    group focuses its activities at the tomb of its founder. Gus Mik''s tomb, called
    Makam Auliya'' is located on three hectares of land in Tambak hamlet, Ngadi village
    subdistrict, Kediri. This site was chosen by Gus Mik in 1990. Like other Muslim
    saints in Java, the Makam Auliya'' consists of several mausoleums, a small mosque
    and is surrounded by kiosks which contain pamphlets and food (Fox 2002:161). Gus
    Mik expected that forty Muslim saints would be buried at that place, and he himself
    determined persons who would be given the privilege to rest in that place. It
    is said that previously there were only three tombs of Muslim saints on the site,
    including Sheikh ''Abd al-Qadir Khairi (alleged from Iskandariah, Egypt), Muhammad
    Hirman, and Sheikh ''Abd Allah Shalih (alleged from Istanbul, Turkey). According
    to Abdul Wahid, the custodian of the tomb (juru kunci), these graves were first
    buried in the 1830''s by Sen Atmojo, one of Pangeran Diponegoro''s soldiers. People
    who lived around the site were believed to be the first preachers of Islam in
    the region. It is reported that Gus Mik spent much of his time visiting and meditating
