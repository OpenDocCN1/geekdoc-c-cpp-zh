  md: 'Because Kyai Hisham regarded himself as a student of Gus Abdul Latif, even
    though both were colleagues, Kyai Hisham would not dare to destroy this teacher-student
    relationship. According to pesantren tradition, this relationship endure even
    after the teacher has passed away. If a student cuts this relationship, he will
    never again use the sanctity of God through his teacher. It is for this reason
    that Kyai Hisham did not ask Gus Abdul Latif to stop the Istighāthāt Ihsāniyat
    ritual in Banyuwangi, despite dejections from many local kyai.


    When consulted by Kyai Hisham about these objections, Gus Abdul Latif insisted
    that he and Kyai Hisham could not be separated in running the Istighāthāt Ihsāniyat
    in Banyuwangi, and if others asked him to leave the group, he would withdraw the
    ijaza and dissolve the group. In the pesantren tradition the giver of ijaza (authorization)
    has the authority to withdraw ijaza from the recipient or to ask the recipient
    not to transmit the ijaza to others. For example, the initiator of ijazaasks the
    recipient not to give it to others, the recipient should obey. If he she ignores
    this rule, the ijaza will be longer valid.


    Kyai Hisham and Gus Abdul Latif needed to cooperate in order to obtain their objectives.
