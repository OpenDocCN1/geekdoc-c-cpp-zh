  md: 'The inclusiveness and tolerance of Wāhidiyat is not a unique phenomenon among
    Sufi groups elsewhere. For instance, there have been studies showing the inclusiveness
    and tolerance of Sufi groups and practices in South Asia. Saheb observes the inclusiveness
    and tolerance shown by a Sufi group in Nagpur, India. Both Muslim and Hindu celebrate
    the anniversary of the death of the Sufi saint Sahul Ahmed Navbar, known as ‘urs
    or Kanduri, and attend his tomb (Saheb 1998). Saheb''s conclusion gains support
    from Werner who concludes that most Sufi myths in South Asia contain a story of
    tolerance, inclusiveness and peace (Werner 2003:26). Werner further shows that
    the shaikh Zindapar, a Sufi master of the importance of inclusiveness and tolerance
    towards other religious faiths. As quoted by Werner, the Sufi saint maintains
    that the ‘true’ Islam does not discriminate between people of different creeds
    and faiths. The shaikh respects and treats other followers with generous hospitality
    because they are human beings and he does this for the love of God and no one
    else (Werner, 1995). The successful history of Islamization in India, central
    Asia, Anatolia and Africa also shows that Sufi groups have played an important
    role in the process of the preaching of Islam since they have accommodated to
    the spiritual environment which has existed in those regions and demonstrated
    flexibility in adaptation to incorporate local religious customs and belief in
    their eclict fold (Rahman 1979) and Gilsen, 1973).


    # 4.7. Spiritual Experience and Spiritual Authority Wāhidiyat


    Spiritual experience (I., pengalaman rohani) is inseparable from Sufi tradition.
    The term spiritual experience could also be translated as miracles (A. karāmat)
    experienced by a Sufi master or Sufi follower as a result of his closeness to
    God. Within the Sufi tradition, stories of miracles are well documented in Sufi
    hagiographical works that are responsible for the spreading of those miracles
    stories in Muslim societies. By these miracle stories tend to describe the extraordinary
    powers of saints that seem to surpass natural law (Schimmel 1975).


    The main questions here are how the idea of spiritual experience (I., pengalaman
    rohani) is understood and what the role of this spiritual experience is among
    Wahidiyat followers. This section will discuss these questions by describing the
    role of the Wāhidiyat spiritual leader and then analysing the stories of spiritual
    experience reported by the followers.'
