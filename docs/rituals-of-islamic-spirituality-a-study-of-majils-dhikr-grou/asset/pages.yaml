  md: 'The word *tasawuf* is frequently defined in broad terms in Indonesian Islam.
    For instance, citing Trimingham, Syafi’i Mifid defines *tasawuf* as the spiritual
    teaching, knowledge and practices of Muslim individuals or groups for the purpose
    of purifying the spirit in order to approach God. Another definition is given
    by Julia Howell who has defined *tasawuf* as personal intensification and interiorization
    of Islamic faith and practice. These broad definitions encompass not only the
    spiritual practices of *tarekat* (Sufi groups) but also the practices of others,
    including *Majlis Dhikr* groups, as well as study groups and intensive courses
    on practical *tasawuf* which all aim at the purification of soul in approaching
    of God.


    So, the term *tasawuf* is well able to accommodate a range of meanings which may
    be put forward by different groups. Extended terms such as modern *tasawuf* (L.,
    *tasawuf modern*), and positive *tasawuf* (L., *tasawuf positif), have recently
    been introduced in the literature of *tasawuf* study in Indonesia. *Tasawuf* is
    no longer restricted to the description of practices by *tarekat* (Sufi groups).


    The term *tasawuf modern* was first introduced by Hamka in the study and practice
    of *tasawuf* in Indonesia. Using this, Hamka tried to disengage the concept of
    *tasawuf* from the concept of *tarekat*. Moreover, by introducing this term, Hamka
    criticised Muslims who practice *tasawuf* as a way of avoiding worldly matters
    and considering them as unimportant (Hamka 1990:5-6). For Hamka, *tasawuf* should
    be understood in its original meaning, that is,


    > as a method to ‘leave off offensive behaviour and to take on praiseworthy manners
    by purifying the soul, improving and training the stature of human personality,
    renouncing greed and cap and controlling the sexual desire from exceeding what
    is normal for a soul individual’ (Hooker 2006:103-4).


    Inspired by the idea of *tasawuf* put forward by al-Ghazāli (d.1111) in his book
    *Ihya’um al-din*, Hamka urged Muslims to cultivate the inner spiritual life within
    the other orders of religion. Hamka considered this as an urgent need, particularly
    to achieve a deeper emotional richness of devotion. Based on his interpretation
    of *tasawuf*, Hamka is regarded as the person responsible for popularising *tasawuf*
    to the educated urban middle class in Indonesia.


    Another term introduced by Indonesian scholars is *tasawuf positif* (positive
    *tasawuf*). This term has become popular within the study of Indonesian Islam
    following the increasing interest in *tasawuf* among urban Muslims and well-to-do
    cosmopolitan Muslims. Similar to the idea of *tasawuf modern*, the concept of
    *tasawuf positif* aims to make the practice of tasawuf more an individual responsibility
    rather than than heavily relying on the guidance of *murshid*'
  merge: -1
  pgno: 44
- img_proc: true
  md: '(masters) of particular tarekat. This kind of tasawuf stresses individual effort
    to mould praeworthy manners without joining a particular tarekat. Those who champion
    the idea of tasawuf posit actively promote what they regard as practising tasawuf
    without tarekat (Sufi groups) (i., tasawuf tanpa tarekat). Instead, they can independently
    practice and learn tasawuf through intensive courses or workshops, and religious
    study as is in urban organisations such as Yayasan Paramadina, Yayasan Tazkiyah,
    ICNIS (Intensive Course and Clinic for Muslim Science), Pusat Pengembangan Tasawuf
    Positif dan Klinik Spiritualitas Islami (Centre for the Development of Positive
    Tasawuf and Clinic for Muslim Spirituality), and iMAN (the Indonesian Islamic
    Media Network). According to the initiators of tasawuf posit, Muslims can practise
    tasawuf posit since Muslims tasawuf scholars have actively practised and deeply
    understand the teaching of tasawuf even though they never joined any tarekat(Anwar
    2002:13-16).


    Another term that is important to elaborate in this study is tarekat. This term
    is widely used in Indonesian Islam to refer to the practice of tasawuf in particular
    communal ritual through an organised Sufi order. According to the pesantren tradition,
    tarekat can be divided into two kinds: tarekat *ammah* (the general way), and
    tarekat khassa (the specific way) relying on ritual dhikr which are performed
    with the guidance of a *murshid* who is linked through a spiritual genealogy going
    back to the Prophet Muhammad. This form of tarekat has formal requirements. For
    example, in order to become a member of such a tarekat, disciples should make
    a vow of allegiance (i., baiat or talqin) to the master of the tarekat concerned.
    Through this baiat, disciples (murid) put themselves under the guidance of the
    *murshid* to purify themselves in their approach to God (Aqib 1999:98). The *baiat*
    is an important condition for the validity of the spiritual journey of murid.
    It is commonly believed in the tarekat world that following the *tasawuf* path
    without the guidance of a *murshid* is like following this path under the guidance
    of Satan.


    The proponents of tarekat are convinced that a *murshid* has an important role
    in the spiritual development of their *murid*. Without the guidance of a *murshid*,
    a murid cannot obtain authentic spirituality. The proponents of tarekat claim
    that there are Muslims who claim that they have achieved *wasul* or *ma’rifat*
    (gnosis), in the absence of a murshid to guide them, that they have achieved consists
    of the whispers and tricks (il., *tipu daya*). It is believed in the tarekat world
    that without the guidance of a *murshid*, Muslims cannot distinguish between the
    whispers of God and Angels and the whisper of Satan.'
