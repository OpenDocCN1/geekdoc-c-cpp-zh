  md: '# # Chapter V: The Veneration of Wali and Holy Persons: The Case of Istighāthat
    Ihsāniyat


    This chapter highlights another Majlis Dhikr group that has creatively developed
    its own practices and formulae to obtain spiritual experiences and religious knowledge
    absent in conventional Islamic proselytization (dakwah). In this chapter, I will
    show how this group defines itself as an alternative mystical path among other
    established Sufi orders while retaining legitimate Sufi practices and how it plays
    an important role in the dakwah project of seeking Islam. In this chapter I will
    describe the foundation of Ihsāniyat, examine challenges and rivalries involving
    this group, describe the ritual of Ihsāniyat, discuss the structure of Ihsāniyat,
    and analyse the strategy of its istighāthat in the light of Islamic Sufi teachers.
    This chapter will argue that although the group cannot be categorised as a tarekat
    mu''tabarahan (acknowledged Sufi order) Nahdlatul Ulama, this group does attract
    a lot of people and it is acceptable to both nominal Muslims (abang)and Muslim
    santri (strict Muslim). Therefore, this group bridges the Geertzian cultural contrast
    between ab and santri.


    # ## 5.1. The Foundation of Istighāthat Ihsāniyat


    Istighāthat is an Arabic word ''calling for help'' or ''appealing for help'' in
    a critical moment. In this sense, the word istighāthat can be distinguished from
    the word istansara, which also mean to ask for assistance but not in a critical
    moment (Jahr 1966:434). The word istighāthat in its verbal form (yastaghithu)
    can be found in five different verses in the Qur''an (Al-Kahfi: 29; Al-Qasas:
    28; Al-Ahqāf: 17; Al-Anfal: 9), which of all imply are seeking help at a critical
    moment.


    However, with the Indonesian Islamic context, a term istighāthat (I, istisasah),
    refers to a compilation of prayers or litan recited on a particular occasion which
    invokes an orocation for divine help with the repetition of the sacred names of
    God and other prayers. In this sense, istighāthat might be considered similar
    to the dhikr ritual (remembrance), which is widely practised by other Muslims
    communities in the country. The word istighāthat is usually used by those affiliated
    with the Nahdlatul Ulama (NU) organization, rather reformist organizations such
    as Muhammadiyah and PERSIS. The NU'
