    generations who followed after the death of the Prophet – the Companions (A.,
    *ṣahabat*), the Successors of his Companions (A., *tābi‘in*), and the Successors
    of the Successors (A., *tabi‘ al-tabi‘in*) – are the best model for Muslims. These
    three generations are known in the Islamic literature as *Salaf al-Salih*. This
    interpretation is based on the fact that the Prophet mentioned that the best of
    his followers (*ummat*) were those of the three generations after his death. Satori
