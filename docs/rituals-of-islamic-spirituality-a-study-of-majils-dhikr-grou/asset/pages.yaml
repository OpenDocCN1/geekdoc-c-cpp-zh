  md: '# Rituals of Islamic Spirituality


    This prayer is not the end of the ritual. Rather, this prayer is the beginning
    of the dhikr session that consists of the reciting of the first chapter of the
    Qur’an (al-Fatihat) forty times; the reciting of al-Ikhlas chapter eleven times;
    (I believe) the reciting of istighfar prayer, سبحان الله العظيم وبحمده (Allah''s
    forgiveness, the Magnificent, glory be to Allah and praise be to him); the reciting
    of the salawa five hundred times. (May the peace, the Mercy and the Blessing of
    Allah be upon you, O Prophet!); the reciting of Kalimat al-Tayyibat hundred times,
    لا إله إلا الله الحق وحده (Allah''s names hundred times). (There is no worthy
    worship except Allah, the sovereign Lord, the Truth, the clear evident), the reciting
    of some of God''s names فتاح (In the name of Allah, the Opener, the Provider,
    the Most Sufficient, the Rich) and reciting of haula الرحمن الرحيم (In the names
    of Allah the All Merciful and the All Compionate, there is no change and power
    except either by the leader or the participants). Eventually, the ritual is closed
    by a prayer led by the leader.


    It is important to note that the dominant feature of the dhikr performed by this
    group is the recitation of God''s names from the best names of God (A., asmā’
    husná). Muslim scholars have different opinions on the number of these names,
    it is widely held that there are ninety names. In addition to the use of His names
    focusing on his transcendence and power, this group also employs His names or
    attributes which him respond to requests. For example, if one says Ya Fattah (the
    Opener), Ya Razzaq (the Provider), it would mean ‘be opening and providing.’ In
    other words, it is expected that by reciting these God''s names, divine aid in
    opening and providing a livelihood for humans is sought. This practice is sanctioned
    by God in the Qur’an, which asks people to invoke God using His names (al-A‘raf:
    180; al-Isrā’: 110). It is expected that mentioning God''s attributes and names
    in praying will cause the prayer to be granted by God, as well as creating optimism
    in the heart of supplicants (Shadhillah 1998:xxxxviii). However, particular Sufi
    orders such as the Hamidiyah Shadhiliyah recite God but not in connection with
    questions and requests. According to Hamidiyah Shadhiliyah group, the proper purpose
    of dhikr is to focus on the Absoluten of God, His transcendent, Eternal Being,
    with no thought of material purposes argued (Gilsen 1973:167-68). In contrast,
    in the Ihaniyat group, the participants are allowed to invoke God with respect
    to their own intentions.


