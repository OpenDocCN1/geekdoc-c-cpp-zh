    # 6.7. Conclusion


    This chapter has examined the role played by the late *Gus Mik* in developing
    and maintaining the continuity of the *Dhikr al-Ghāfilin* group. Through his charisma
    and *karamah*, Gus Mik was able to practice *dakwah* in an unusual way, i.e. among
    those categor as *orang malam*, nightclub visitors and gamblers. However, after
    his death, his *karamah* and charisma could not be passed on to his sons. None
    of his sons or other leaders of these groups are able to engage in this unusual
    practice of *dakwah*. As a result, the leaders of the current Dhikr al-Ghāfilin
    confine their *dakwah* activities to people who engage in this ritual practices
    of these groups.


