  md: 'Rituals of Islamic Spirituality


    This work is designed to contribute to the body of work of those scholars who
    have discussed the proliferation of Islamic spiritual groups in contemporary Islam.
    It aims to fill a gap in the literature by examining how Indonesian Majlis Dhikr
    groups regard themselves as legitimate groups within Islam. A more specific question
    related to the rituals and teachings of these groups is to what extent these rituals
    and teachings are related to the teachings of the Quran and hadith and the general
    teachings of Islam and orthodox Sufism. As regards the preaching of Islam, the
    question is what strategies these groups use to disseminate their teachings to
    other Muslims. As Dhikr groups derive from the context of the *pesantren*, another
    question is what role *pesantren* play in facilitating the development of these
    Majlis Dhikr groups.


    # # 1.2. The Understanding of Tasawuf, Tarekat and Majlis Dhikr Group in Indonesian
    Islam


    For the purpose of this study, it is important to explain terms such as *tasawuf*,
    *tarekat*, and *Majlis Dhikr* (or *Jama’ah Dhikr*), which have been used interchangeably
    by researchers on Indonesian Islam. This explanation is necessary to understand
    the phenomenon of the proliferation of Islamic spiritual groups within the Indonesian
    Islamic context and the development of studies about Islamic spiritual groups
    in Indonesia.


    As far as the definition of *tasawuf* is concerned in classic Arabic understanding,
    this term was defined variously by Sufi scholars. Al-Qushairy (d. 475/1074) (2002:337-41)
    in his book al-Risālat al-Hujwiri (d.1082)(1997:43-55), in his book Kashf al-Mahājb,
    enumerate the various definitions of *tasawuf* put forward by different Muslim
    Sufi. These diverse definitions of Sufism demonstrate that it is difficult to
    provide an exact definition of *tasawuf*. However, because of this difficulty,
    Chittick argues that it is difficult to distinguish Muslims who have been Sufi
    and which have not (Chittick 1995). Closer examination of these definitions shows
    that they are concerned with the practical aspects of the inner life which have
    eventually formed a body of knowledge. When tasawuf became became a particular
    form of knowledge, like other categories of Islamic knowledge such as *fiqh*,
    *hadith*, and Islamic theology (kalam), it comprised theoretical teachings that
    needed to be put into practice. Therefore, as a form of knowledge, tasawuf was
    named as ‘*ilm al-batin* (the knowledge of the inner self), a term used in opposition
    to other traditional sciences, such as the study of hadith or Islamic jurisprudence
    (fiqh), which were known as perceptible knowledge (A., ‘ilm al-zahir’)


    10'
