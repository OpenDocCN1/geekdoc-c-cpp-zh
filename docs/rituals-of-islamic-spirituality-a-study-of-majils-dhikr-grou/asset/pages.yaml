  md: '# # Chapter II: Innovation or Aberration:

    Majlis Dhikr in Contemporary Indonesian Islamic Discourse


    Some Indonesianists have predicted that the practice of tarekat prevalent in the
    rural areas would disappear following the proliferation of Islamic modernist movements
    in Indonesia. This prediction, however, proved to be unfounded. Surprisingly,
    not only has there an increase and expansion of Sufi orders in Indonesia, there
    is also currently a rise of other Islamic spiritual groups, such as Majlis Dhikr
    groups together with Islamic spiritual courses. These groups have also undergone
    an increase in membership. Besides those categorized as peasants who have increased
    their interest in these groups, the urban middle class, together with many educated
    Muslims, have been attracted to join these groups.


    The proliferation of new Islamic spiritual groups has raised strong criticism
    and prompted polemical debates regarding the validity of ritual practices. This
    criticism can be conceived as a continuation of previous religious debates on
    the teaching of Sufism which was first put forward by the supporters of Puritan
    Islamic groups in the late nineteenth and twentieth centuries.¹ In a broader context,
    these debates constitute an integral part of the internal debates which has taken
    place in the Islamic tradition for several centuries. Therefore, in this chapter,
    I will examine the main factors have led to these polemical debates on the ritual
    practices of Majlis Dhikr. I intend to discuss the views of both the proponents
    and opponents of *Majlis Dhikr* in contemporary Indonesia.


    > As Bruinessen observed, Ahmad Khatib (1852-1915), a West Sumatra Muslim scholar
    who spent his life in Mecca, was an outspoken critic of Naqshabandiyah. He and
    other West Sumatran reformers vigorously charged the teachings of tarekat and
    its practices with misleading bid’ah and heresy. From 1996 to 1908 he wrote three
    potential tarekat教材 which have been used as the main reference for such debates
    and criticism toward the group. These three writings include “Izharu Zaghl al-Kādhib
    fi Tabashubih (Revealing the falseness of the deceivers who wear the mask of truth’),
    Al-Ayat al-Bayinat al-Mussifin fi Izāla Kufarā ba‘di al-muta ‘āsibin’ (The true
    essence of virtuous persons for eradicating the superstition of the fanatics),
    and ‘Al-Asāi’t al-Battār fi Maḥqī Ba‘di ‘Ahl al-Ightirār’ (The cutting sword that
    fights the wrongs of the around) (Bruinessen 1994: 110).¹'
