  md: 'pesantren in the development of the Qadiriyah Naqshabandiyyah. Zulklifi argues
    that the two pesantren have different roles in the maintenance of Sufism in Java.
    Pesantren Teubireng, established by Kyai Hashim Ash’ari, is known as a pesantren
    shari’at, yet it maintains the teachings of Sufism including sincerity, asceticism,
    modesty, and the Sufi rituals such as prayers, dhikr, and wirid. Through the figure
    of Kyai Hashim Ash’ari, this pesantren has played an indirect role in the spread
    of Qadiriyah Naqshabandiyyah in East Java, controlling the practices of the leaders
    and the followers of the group preventing them from deviation from orthodox Sufi
    teachings. Not only that, this pesantren has also produced the leaders of Qadiriyah
    Naqshabandiyyah, since most of the murshid of the group in Java are graduates
    of pesantren Teubireng. In contrast, Pesantren Suryalaya, represented by the figure
    of Sheikh Abdullah Mubarak, known as Abah Sepuh (‘The Old Abah’), and his successor,
    Ahmad Sahibibulwah Tadjul Arif, known as Abah Anom (‘The Young Abah’) have maintained
    Sufi traditions by establishing their pesantren as the centre of Qadiriyah wa
    Naqshabandiyyah. Under the leadership of Abah Anom, Qadiriyah wa Naqshabandiyyah
    has attracted many followers, not only from other regions in Indonesia but from
    other countries, such as Malaysia and Singapore.


    Important information about the diversity of the followers of tarekat derives
    from research conducted by Howell, Subandi, and Nelson (2001) in several branches
    of Suryalaya’s Qadiriyah wa Naqshabandiyyah. Comparing the results of a previous
    survey of members of the tarekat in 1990 with a survey carried out in 1997, their
    study makes clear that this group has experienced dramatic growth in membership
    during Suharto’s New Order regime and the range of its membership has been extended
    from villagers to educated urban professionals and managers. This study also reveals
    an increase in women members of the tarekat compared to the previous period.²
    Howell et al. suggest further research on groups of tarekat, focusing on analysing
    the membership in terms of age, education and gender.


    All of these studies show that tarekat and pesantren are not separable institutions
    in maintaining Islamic traditions in Java. Most pesantren in Java function as
    places to mould students with Islamic knowledge, while some function as an instrument
    for the recruitment of members of a tarekat, each of which is organized around
    the figure of a particular scholar and teacher (kyai).³ None of these studies,
    however, analyse specifically the figure of Majlis Dhikr groups,


