  md: '# Chapter VI: The Awakening of the Negligent:

    The Dhikr al-Ghafīlin Group


    Chapter V highlighted the important role of the *Ihsāniyyat* in developing and
    spreading Islam among nominal Muslims (*bangan*) by means of cultural approaches.
    In doing so, the group has adopted the ideas of Sufi dakwah and Sufi tolerance,
    which have been practised since the introduction of Islam to the Indonesian Archipelago.
    This chapter will look at the role played by another group in developing and spreading
    values among Muslims, the *Dhikr al-Ghafīlin*. In contrast to the previous chapter,
    this chapter will focus on the leader of the *Majlis Dhikr al-Ghafīlin*, Gus Mik,
    whose reputation and charisma as a wali raised controversy among Muslims in Indonesia.
    *Gus Mik* played an important role in introducing Islamic values to particular
    groups of people who have been characterized as *orang-orang malam*, a term used
    to identify people as prostitutes, nightclub singers and nightclub visitors.


    # 6.1. The Foundation of the group


    The composition of the religious litanies (*dhikr*, remembrance of God) used by
    the *Majlis Dhikr* al-Ghafīlin was closely associated with three well known *kyai*
    in East Java, the late *kyai* Hayim Jazuli known as *Gus Mik* from *Pesantren
    Plesante* Kediri, East Java; the late *Kyai* Ahmad Siddiq (*Siddiq* from Jember),
    who was a former chairman of the Nahdlatul Ulama (NU) religious body (*Ketua Syariah*);
    and the late *kyai* ‘Abd al-Hamid (from Pasuruan). Indonesian Muslims, particularly
    from NU, believe that these three *kyai* possessed extraordinary miracle power
    (*karamah*) and divine blessings (*barakah*).


    According to Kyai Ahmad Siddiq, all of these *kyai* contributed to the composition
    of the *Dhikr* al-Ghafīlin. He said:


    > In this formula [*Dhikr* al-Ghafīlin] belonged to *Kyai* ‘Abd al-Hamid and *Gus
    Mik*. I only wrote and compiled it. However, I wanted to disclose the secret that
    only my children understood that this formula was the work of three persons namely
    myself, *Gus Mik* and *Kyai* ‘Abd al-Hamid. First of all I went to *Kyai* ‘Abd
    al-Hamid (authority) to recite the Al-Fatihah hundred times together the *Asma’ul
    Husna* (The beautiful names of God). Then, I went to *Gus Mik* when he was in
    the Pak Marliyan’s house where we discussed the formula until 03.00 a.m. On occasion,
    *Gus Mik* added to the formula by reciting *istighfara* hundred times and *Salawat*
    three hundred times.'
