  md: 'of the tripartite path to God (Anonymous n.d.-a:381). With this explanation,
    Kyai Abdul Madjid Ma’ruf stresses the importance of *shari’at* as the initial
    state for those who wish to enter the mystical path. His view on the importance
    of *shari’at* is not unusual for most traditional *santri* in Java maintains that
    all the requirements of *shari’at* should be fulfilled prior to entering the mystical
    path. Moreover every mystical path must be cultivated on the basis of outward
    piety (*shari’at*) (Woodward 1989:81).


    The second doctrine of *Waḥidīyat* is *Bi Allāh*. What is meant by the doctrine
    *Bi Allāh* (of Allah) is that every person''s outward and inward aspects are nothing
    but the creation and action of God. This definition is derived from the verse
    of the Qur’an stating that “God has created you and what you make’ (37: 96). As
    a consequence, one cannot claim to have strength and power to act and to do something
    good or bad, since the power and strength belongs to God Himself. This verse is
    not interpreted from the perspective of predestination, but from the Sufi point
    of view. In fact, this doctrine is practised as the implementation of the phrase,
    *la hawla la quwwata illā bill Allah*. Quoting Sun Kalijaga, one Javanese Muslim
    saint, Abdul Madjid explains that according to this doctrine “a human is a puppet
    and God is the puppet” (Madjid 1423b:29-33). As far as deeds are concerned, Kyai
    Abdul Madjid Ma’ruf maintains that unlike good deeds, bad deeds should also be
    based on the doctrine of *Bi Allāh*. Therefore, one should keep in mind that every
    bad deed can happen because of God. However, this does not necessarily mean that
    people are permitted to do bad deeds, even though they are performed through *Bi
    Allāh*. Kyai Abdul Madjid Ma’ruf defines this doctrine a haqiqat, one of the tripartite
