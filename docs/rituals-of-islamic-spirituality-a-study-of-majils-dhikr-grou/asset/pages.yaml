  md: 'mu''tabarah in the NU tradition is the credibility of their authors. According
    to Kyai Misbah, a senior leader of pesantren Jamps in Kediri, particular books
    (I., kitab kuning) can be considered mu''tabarah as long as their authors meet
    four criteria. Firstly, they must be learned persons (A., ''alim). Secondly they
    must have displayed good behaviour (A., akhlak karimah). Thirdly, they must a
    high-aiming endeavour (A., himmat ''aliyat) to follow the practice of the Prophet.
    Fourthly, they should display refined speech when discussing others'' opinions.
    Based on these criteria, books written by Ibn Taymiyah and his student, Ibn al-Qayyim
    al-Jawziyya, for example, are rarely found in NU’s literature and curriculum because
    these authors do not use refined speech. Instead, they use provocative and abusive
    language in expressing their disagreement with Muslim scholars'' views. Books
    such as Bilat al-Mujtahid written by Ibn al-Rushd, and Subul al-Salwun written
    by al-Sha''ani are not used in pesantren curricula or as references because these
    authors are Shiites, a group which is different from Ahlussnah jama''ah.


    The concept of mu''tabarah is also applied to the practice of tarekat (Suf groups)
    under the umbrella of NU. It is known as Pucuk Pimpinan Jam''iyat Ahli Thoriqoh
    Mu''tabarah (Central Executive Committee of the Association of Members of Restricted
    Tarekat Orders) to identify Sufi groups that can be joined by a member of NU laid
    down by this association (Jam''iyat). These criteria make that the teachings of
    the tarekat must conform to the Islamic Law (A., shariat) and the weird practiced
    by the tarekat must have a spiritual genealogy (I., silsilah) going back to the
    Prophet. Turmidi argues that these criteria were established by the founders of
    tarekat, but were practised by the Prophet himself. Any tarekat that does not
    meet these criteria is not recognized or not given the ''respect'' accorded to
    other tarekat (A., ghairu mu''tabarah), and as a result should not be joined by
    NU (Turmidi 2003:65)


    It is clear that the concept of mu''tabarah is significant to regard the ritual
    practices among tarekat members because it cannot only give strong legitimacy
    for tarekat groups involved in the Jam''iyah but also enhance the members'' faith
    in their rituals and teaching. Furthermore, by using the concept of mu''tabarah,
    those groups involved in the Jamiyah can make a clear-cut distinction between
    their rituals and versus other ritual practices considered incompatible with Islamic
    Law (Dhofier 1999:144). In other words, the concept of mu''tabarah is internally
    effective to protect these groups from unorthodox spiritual groups.'
