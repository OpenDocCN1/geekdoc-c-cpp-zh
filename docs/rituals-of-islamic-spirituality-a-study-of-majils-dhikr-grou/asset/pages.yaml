    group characterizes these individuals as the youngest dwellers in Paradise.


    It is interesting to examine why these names are included in the tawassul sessions.
    One informant told me that the Dhikr al-Ghāflin group names these figures merely
    because they are believed to be uliyā‘(The Saints of God) who can spiritually
    help people to approach God. In this respect, Gus Mik put it this way:


    In the world to (l., akhirat) we will follow those respected ulama as well as
    those whose names were written in Dhikr al-Ghāflin formula to whom we recited
    al-Fātiha(Ibad 2005:10).


    This reason is similar to KyaiAhmad Siddiq’s statement that those wali names mentioned
    in the formulae have reached the highest station (A., maqām). Although the members
    of the Dhikr al-Ghāflin group cannot reach their maqām, at least these wali can
