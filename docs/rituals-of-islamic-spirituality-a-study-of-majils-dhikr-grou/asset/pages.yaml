  md: '# 3.6. Conclusion


    It is clear that in some aspects of practical Sufism, Majlis Dhikr groups in Indonesiaid
    follow similar notions to those articulated by prominent Muslim scholars, Sufi
    and theologians. Leaders of Indonesian *Majlis Dhikr* groups attribute their notions
    to similar practices conducted by the Prophet himself, his Companions (A., *sahabat*),
    the Successors of his Companions (A., *tābi’in*), and the Successors of the Successors
    (A, *tābi’i al-tābi’in*). Therefore, the Indonesian Majlis Dhikr groups cannot
    be regarded as practising polytheism (*shirk*) or making innovation (*bidah*)
    that they practise can be related to their interpretation of the main sources
    of Islamic law (A., *shari’at*), the hadith and the practice of the Prophet’s
    Companions. If this interpretation cannot be judged by another. Moreover, I argue
    that interpretations can be regarded as under the field of *ijtihad*, which means
    the use of all the capabilities of reason by particular Muslims in deducing interpretations
    from evidence from the Qur’an and hadith. If this is the case, one can expect
    different results of *ijtihad* among Muslims scholars. Muslims should not therefore
    claim that their own results of *ijtihad* are deemed to be true, while others’
    *ijtihad* are false, because all of these will be justified later in the hereafter
    according to the meaning and purpose of God and the Prophet, then it will have
    two rewards. In contrast, if the result is wrong it does not agree with God’s
    and the Prophet’s purpose, it will have only one reward.


    Those who practise Sufism without tarekat only attain the experience of *‘ilm
    al-yaqin*. They never reach *‘ain al-yaqin* and *haqq al-yaqin*. This is because
    they only believe (I., yakin) based on their theoretical philosophy. They do not
    believe practically (l., *secara amaliah*), even though they claim that they believe
    *secara amaliah*. In fact, this belief happens only in their imagination, as if
    they believe secara amaliah.'
