  md: 'After asking permission from Gus Mik, Kyai Ahmad Siddiq recited the formula
    to Kyai ‘Abd al-Hamid. During this meeting, Kyai ‘Abd al-Hamid cried. According
    to KyaiAhmadSiddiq the compilation process of this formula took place in the month
    of Sha’ban and was first practised in the month of Ramadan1972.


    The founders of a Sufi group have often received ilām, a spiritual order, or experience
    a visionary dream of the Prophet Muhammad before they established or introduced
    publicly their formulae (aurad). Thus, Kyai Ahmad Siddiq not only received consent
    from two respected kyai or wali, he also received consent from deceased kyai through
    his visionary dream to improve and expand practice of the Dhikr al-Ghāfilin litanies.
    He described his experience as follows:


    > I had a clear dream after reciting the Dhikr al-Ghāfilin, my late brother Kyai
    Ahmad Qushairi was waiting for me at a harbour when I disembarked from a ship.
    He did not watch my ship. Then, he asked me to walk along with his friends, habaib
    (Prophet’s descendants). We walked together. It seemed that we walked in the city
    of Mecca. But when he left behind and I lost him. So, I asked his friend in Arabic:
    ‘Do you know Kyushairi’s house?’ then he replied: ‘I can not know him, when always
