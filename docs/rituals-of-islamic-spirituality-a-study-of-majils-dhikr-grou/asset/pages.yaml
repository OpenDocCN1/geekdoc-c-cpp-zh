  md: '# Rituals of islamic Spirituality


    One of *Gus Mik*’s teachings emphasizes the importance of Muslims keeping their
    pious acts (I., am sale*) secret from other people. He asked his followers to
    conceal their pious acts, even though these virtues were little things such as
    praying for their hosts before visiting them. This teaching is simple, but in
    the context of *tasawuf* it is important because it is closely related to the
    essence of people’s worship of God. According to Islamic teachings, Muslims are
    required to worship God and perform good deeds sincerely (I., ikhlas.). In other
    words, Muslims should worship and do good deeds to seek reward from God, and not
    for the sake of people’s praise (A., riya’). Based on this notion, *ibadah* necessitates
    the purity of intention. As a result, if people perform good deeds, but without
    an intention other than seeking God’s blessing, these good deeds will be meaningless
    in the eyes of God. In fact, what *Gus Mik* taught on this matter was strongly
