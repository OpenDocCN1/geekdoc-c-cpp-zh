    followers. Since it is held at the central office of Wahidiyat in Pesantren Kedlungo
    where the tomb of the founder is located, it is to this mujahada that all followers
    including men, women, youth and children flock to seek blessing and illumination
    (*barakat wa nadra*), from Kyai Abdul Majjid, the founder of Wahidiyat or Abdul
    Latif Majjid. In order to seek blessing from the founder, the Wahidiyat followers
