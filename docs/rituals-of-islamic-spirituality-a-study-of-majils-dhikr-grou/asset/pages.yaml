    # 1.4. Meaning and Implications of the Classification: Mu’tabarah


    In the study of Islamic practices, the concept of mu’tabarah might be known only
    in the context of Indonesian Islam, particularly within the Nahlatul Ulama (NU)
    tradition. This term literally means ‘recognised’ and ‘legitimate’. However, it
    is used by NU not only to refer to particular books that can be appropriately
    used as literature in the NU’s pesantren and as references to which base religious
    opinions, it is also used to refer to particular Sufi groups which be joined by
    NU members.


    According to this concept, books that can be categorised as mu’tabarah are those
    which are compatible with the doctrine of Ahlussannah Jama’ah (Muhammad2004:77),
    a doctrine which is strongly held by the NU members as the basis of their religious
    practices. According to this doctrine, those books should conform to one of four
    madhab (Islamic legal schools) in matters of Islamic jurisprudence; in matters
    of Islamic theology they should follow the teachings of Abū Hasan al-Ash‘ari and
    Abū Mansur al-Maturidi, and in matters of tasawuf they should comply with the
    teaching of al-Ghazafī and Junaid al-Baghdādī. In addition, another criterion
    used to identify books as'
