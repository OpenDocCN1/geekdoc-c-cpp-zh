  md: 'In this study, I use the term Majlis Dhikr to refer to groups who practise
    reciting dhikr and Salāwatin unison (I., berjamaah) in order to achieve perfection
    and closeness to no structural connection to any tarekat order. Comprehending
    the term Majlis Dhikr as used in this study is important, particularly to approach
    and analyse the current proliferation of Islamic spiritual groups in Indonesia.


    In this argument, I differ with scholars as Bruinessen (1992), Dhofier (1999),
    Tumardi (2003), Mifid (2006), and Abdurahrahman (1978). For example, Majlis Dhikr
    groups do not require followers to take an oath (baiat) to the leader of these
    groups. In other words, exclusive membership is not recognised. People are able
    to join Majlis Dhikr groups and practise their dhikr without taking an oath of
    allegiance to the leader of any particular group. As a result, people can voluntary
    one group while being members of other Majlis Dhikr groups, something which is
    not, generally, possible for members of tarekat in Java.⁴


    Another obvious difference from tarekat is in the dhikr recited by Majlis Dhikr.
    The text recited by several Majlis Dhikr are generally created by their leaders
    or from dhikr formulas taught by the Prophet or widely practised by prominent
    ‘ulama’. In contrast, dhikr formulas recited by tarekat orders are claimed to
    have been transmitted by a series of unbroken links between the mursayd and the
    Prophet. Unlike tarekat, the members of Majlis Dhikr groups are also able to practise
    the group’s ritual intermittently without any sanction, however the leaders of
    their groups recommend members to practise the ritual continuously.


    Distinguishing clearly between the Majlis Dhikr groups and other Islamic spiritual
    groups in Indonesia is critical to an analysis of the position of these Majlis
    Dhikr groups in the context of current Indonesian Muslim life. The proliferation
    of Majlis Dhikr indicates that such Majlis Dhikr have been accepted by Indonesian
    Muslims as an alternative vehicle to practise the teachings of tasawuf.


    > In the past, there were no clear cut boundaries between numerous different tarekat
    either in their doctrines and ritual or their memberships. Disciples did not necessarily
    adhere to one tarekat; they could become a member of different tarekat and take
    allegiance to different mursayd. The best exemplar was Muhammad Yusuf al-Maqqasiqi
    (1037-1111/1627-99) the seventeenth century Malay Sufi, who himself affiliated
    with several tarekat such as Qadiriyah, Khalwatiyah and Naqshabandiyah (Azra 1992:420-27).
    Kyai Abbas form Pesantren Bantu, Cirebon, can also be added in this category as
    a Kyai who joined two different tarekat, Shattariyah and Tijaniyah.'
