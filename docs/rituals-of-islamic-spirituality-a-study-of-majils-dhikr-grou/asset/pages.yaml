    # DDII


    repetitive prayers


    # Dhikr


    cardinal offence


    # Dosa besar


    Islamic prayers


    # Du’a


    sorcerer


    # Dukun santet


    annihilation


    # Fana''


    the needy


    # Fatwā


    legal opinion, edict


    # Fisabilillah


    persons who struggle in the cause of Allah


    # Fiqh


    Islamic jurisprudence


    # Fuqahah


    Muslim jurists, singular form of Faqih


    # Gemblengan


    a form of invulnerability


    # Ghārīm


    a debtor


    # Ghairu


    non-recognised; it is used to refer to Sufi groups which

    do not have a chain of transmission back to the Prophet


    # mu''tabarabah


    a title to address sons of kyai in Javanese

    pesantren


    # Hadas besar


    impurity that requires a Muslim to carry out a full ritual

    ablation (A., ghus) as for example after having a wet

    dream or sexual intercourse with one’s spouse


    # Hadas kecil


    impurity that requires a Muslim to carry out a minor

    ablation (A., wudū’) as for example after passing wind,

    urinating, and defecating


    # Hadith


    a documented tradition purporting to preserve the

    decisions, actions, and utterances of the Prophet

    Muhammad


    # Hadith quudsī


    a documented tradition containing revelation from God

    phased in the Prophet’s own words


    # Haji


    the pilgrimage to Mecca


    # Halal


    lawful


    # Haqīqat


