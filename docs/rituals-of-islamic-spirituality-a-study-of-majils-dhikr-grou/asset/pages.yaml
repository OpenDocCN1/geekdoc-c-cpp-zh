  md: 'The objective for establishing this dhikr group was based on Gus Mik’s prediction
    that a great disaster would occur in the year 2000. This disaster was not related
    to natural disasters such as earthquakes, flooding or landslides, but to a decline
    in the quality of Muslims’ spiritual life in connection with ibadah to God. According
    to Gus Mik, because of the intensity of detrimental influences, Muslims would
    find it difficult to worship God sincerely (I., ikhlas). This disaster would affect
    all Muslims ‘ulama’ regardless of their social status, be ordinary Muslims or
    that no one would be saved from this disaster except those who had a spiritual
    basis as a result of their consistent (A., istiqāmat) religious practices. Furthermore,
    the people who would be saved from this disaster were those those who always remembered
    God’s saints by praying for them, because praying would open the door of God’s
    blessing. Quoting a prominent Sufi, ‘Abd al-Qādir al-Jaylānī, Gus Mik was convinced
    that people who remembered God’s saints would obtain blessing from God. Therefore,
    by reciting the Dhikr al-Ghāfilīn, which includes praying for Muslim saints, people
    would have a strong basis to face the disaster.


    Another objective of establishing the seemaan group and using the Dhikar Ghalifin
    was to popularise (memudayakan) the recitation of the Qur’an and to start a movement
    of Qur’an recitation (I., tadaras al-Qur’an) in Indonesia. Kyai Saiful claimed
    that before this group was established, the memorization of the Qur’an was conducted
    only at particular events such as the Qur’an contests (I., Musabaqah Tilawatil
    Qur’an, MTQ) and other events in pesantren, which never attracted many participants.
    As by Kyai Saiful sensed the emergence of this group, it is not difficult to find
    such events in many cities in East Java and some other provinces on Java. The
    ritual is even held in many government offices (pendopo kota) in those cities
    and is attended by many participants. For example, the seemaan held by this group
    on the anniversary of Gus Mik’s death (haul), which I attended, over a thousand
    people, men and women, from several regions in Java. The venue of the seemaan
    conducted almost one kilometre of the main road located in front of Pesantren
    Al-Falah, Ploso, Kediri. When Gus Mik was still alive, the ritual of reciting
    the Qur’an-al attracted many government officials and political party leaders
    and was supported by the introduction of the Iqra’ method in 1992 and by the growing
    number of Quranic Kindergartens (I., Taman Pendidikan) in Indonesia. This new
    use of recitation was regarded as a faster learning method than the traditional
    method (the Baghdadi method), enabling children less than five years old read
    the chapters of the Qur’an with ease (Gada 2004):


    Another goal in establishing the Dhikr al- Ghāfilīn, was to get people used to
    performing prayers collectively (I., berjamaah) and reciting prayers (I., doa)'
