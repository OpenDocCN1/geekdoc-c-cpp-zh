  md: '# Rituals of Islamic Spirituality


    The reciting of *Şalawat Wahidiyat during Mujahada Kubra* is conducted in unison
    (I. berjamaah) led by a leader (I., imam). It is interesting to note that there
    are no qualifications for becoming an *imam* in the Mujahada Kubra. Whether imam
    are men is not a big issue. Women can become imam for Mujahada Kubra, even though
    the participants of Mujahada Kubra are mostly male. Even adolescents and children
    can become *imam* as long as they can read the first of *Şalawat Wahidiyat* fluent.
    Followers are expected to weep as an expression of their deep repentance during
    the *mujahada* ritual. The louder they weep, the deeper is their regret of their
    misdeeds. According to the teaching of Wahidiyat, inability to weep during mujahada
    ritual indicates that person suffers from ‘stubbornness’ (kerasnya hati) and this
    stubbornness is a result of sins.


    After reciting *Salawatduringmujahada*, the *mujahidin* (the participants of mujahada)
    performed the istighraq ritual. According to Sufi teaching, this term refers to
    ‘the state of immersion in God as a result of *dhikr*’ (Trimingham 1971). In Wahidiyat,
    the istighraq is a part of the *mujahada* ritual where the followers should be
    fluent. During this time they must practise three kinds of istighraq. The first
    is *istighraq Wahidiyat*, meaning that they have to concentrate and realize that
    everything in this world, including one''s life, is created by God. The second
    is *istighraq bi haqqil al-Muhamadiyyyat* meaning that everything that was created
    by God includes oneself is as a result of the light of Muhammad (Nūr Muhammad).
    The third kind of *istighraq ahdyiyat* which refers to the state of immersion
    in God and the state of *fana’* dhauqiyat (Majdid 2000b:25-31). In his attempt
    to explain the meaning of istighraq ahdyiyat, Kyai Latif quoted the definition
    of *mahabbat* given by Junayd-al-Baghdadi as follows:


    > ...therefore those who love God (mahabbat) are those who melt themselves within
    God can become *fana* not manganggual kawula marang Gusti (the union of slaves
    with God). As a result, all of their movements are in God’s movements...


    At the end of reciting *Şalawat* in the *mujahada* ritual, all the participants
    are required to stand the four directions in while reciting loudly the word *fafirru
    ila Allah* (Turn to God). This ritual is performed to call humankind from over
