    stays at the sunset place and the murshid stays at the sunrise place, the murshid
    can teach them. In addition, the murshid should not have hope for a murid''s possessions.
    Meanwhile, a murid should behave like a dead body (kalmaynit), and surrender to
    the master. Whatever a murid possessed should be given absolutely to the master,
    including the time, energy, wife or husband (Mukhtar 1997:45).


