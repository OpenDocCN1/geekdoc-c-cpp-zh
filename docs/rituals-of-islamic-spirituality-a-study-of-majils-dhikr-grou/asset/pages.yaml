    For *Wāhidiyat* followers the *Mujahada Kubrā* held at the *Wāhidiyat* centre
    in Kedlungno can be seen as a pilgrimage which involves a process of ''spiritual
    renewal and a renewal of person through contact with a sacred highly structured
    and complex set of symbolic operations which bring about the desired transformation
    in both mortal persona of a pilgrim, including his or her acquisition of the sacred
    substances to be taken back on the journey home, and of the community'' (Werner
    2003). The annual *Mujahada Kubrā* is regarded as the ultimate ritual in *Wāhidiyat*,
    functioning not only as spiritual renewal but as a renewal of *Wāhidiyat* identity.
    In this sense, *Mujahada Kubrā* can be compared with the great pilgrimage to Mecca.
    It is in such pilgrimage that Muslims from quite separate backgrounds gather.
    As observed by Gilensen (1993:17) in the pilgrimage ''the collective quest of
    pilgrims for blessing or knowledge was that one gave form and substance to the
    idea of the *umma*. These pilgrimages served as channels of information.'' After
    returning from the pilgrimage, Muslims will feel that they have been born again
    in this new world.


    # 4.6. The Strategy of Preaching *Salawat Wāhidiyat (Da’wah Wāhidiyat)* in Implementing
    Sufi Tolerance: The Role of Pesantren


    How Howell points out, the *pesantren* (Islamic boarding schools) have been both
    the focus of *tarekat* and important sources of recruitment for them, with former
    pupils returning later in life to their old *pesantren*, or to another in the
    *pesantren* network, to undertake mighty spiritual regimes (Howell 2001:705).
    This view might be only valid in the case of some *pesantren* which provide either
    the basics of Islamic teachings or the teaching of tarekat and a Sufi order. However,
    Howell (2001), Zulkifli (2002) and Dhofier (1982) argue, although most *pesantren*
    in Java do not have a particular *tarekat* branch, the life in most *pesantren*
    still involves the practice of intimate aspects of Sufism such as reciting of
    *dhikr* and wirid. This is valid if *Sufism* is conceived not merely as the practices
    of a Sufi order but as ascetic and devotional practices that do not need to be
    involved with mystical way. Therefore, many students (*santri*) in those *pesantren*
    who join in the performance of collective *dhikr* and perform a particular *wirid*
    (chanting religious litanies) may not be members of a Sufi order.'
