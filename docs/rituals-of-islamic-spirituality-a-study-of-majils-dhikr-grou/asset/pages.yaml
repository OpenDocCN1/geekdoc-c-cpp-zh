  md: '# Rituals of Islamic Spirituality


    Al-Tirmidhī defined two distinctive classes of friends of God, the Wali haqqīllah
    and the Waliullah. Those categorized as Wali haqqīullah will be able to achieve
    nearness of God by undertaking worship of God and obedience to Him constantly
    without any intervening rebelliousness. In contrast, a Waliullah is attracted
    to God by and is a majdhub, a person who is drawn from the place of divine closeness
    up to God Himself, to the highest of God’s realms (Radtke and O’Keefe 1996:124).
    This definition is based on the Qur’an verses that state ‘And He takes possession
    of the righteous’ (7:196). This latter class of saints is called murīd(the sought).
    While the former class is called murid(the seekers). These two categories of saints,
    Tirmidhī argued, have different journeys to approach God. The ascent of Wali haqqīullah
    will end at God’s throne. They can approach God but not reach God Himself. In
    contrast, Waliullah are able to reach beyond God (Gibb 1996:110).


    However, al-Qushairy (b.376/986) argued that a true saint must have two qualities.
    The saint has to fulfil completely obligations to God, while being under the continuous
    protection and safeguard of God in good and bad times. Furthermore, a wali is
    not nonseless (A., ma‘sum), he or she is preserved from sin (A., mafzī). Based
    on this definition, al-Qushairy stressed the significance of Muslim saints acting
    in a manner that is not in conflict with the divine law (Dahlan n.d:16).


    Muslim scholars such as al-Jurānī (d.1413) and Ibn al-Mutāhibī defined saints
    (wali) as those who have achieved the Gnosis of God (ma‘rifat), worship constantly,
