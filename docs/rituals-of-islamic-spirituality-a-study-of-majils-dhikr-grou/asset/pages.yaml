    # # 4.3. Internal Conflict in Wāhidiyat


    Internal conflict among the board members of Salawat Wāhidiyat happened when this
    organization held its first major gathering in 1985. From 1964 to 1985 the Salawat
    Wāhidiyat had only a single organization, that is The Centre of Salawat Wāhidiyat
    Preaching (Pusat Penyiaran Salawat Wāhidiyat). This body was established to decide
    on organizational policy and to practise, spread, and develop the Salawat Wāhidiyat
    teaching to print the pamphlets of al-Hikam¹⁵ Wāhidiyat, and to arrange weekly
    in the pesantren. Under the Indonesian government issued Law Number 8 (1985) about
    mass organizations and Pancasila as single foundation (azas tunggal), Wāhidiyat
    did not have the statutes as other organizations had. However, according to Law
    Number (8), 1985, chapter II, article 2, all organizations had to be based on
    Pancasila for their foundation. Article 4 of this chapter stated that all mass
    organizations were required to mention this basis, as described in article 2 in
    their statutes (Anonymous 1985:468). In order to meet the Law, Wāhidiyat held
    its first gathering to establish a new board and the statutes of the organization.
