  md: 'Rituals of Islamic Spirituality


    mean that people give priority to fulfilling their obligations rather than claiming
    their rights. The fulfillment of obligations will result in the fulfillment of
    other rights. For example, children must fulfill their obligations to their parents,
    and parents have to fulfill their obligations to their children without claiming
    their own rights. In fact, this doctrine is reminiscent of al-Ghazali who defines
    justice as giving rights to those who possess those rights. According to Kyai
    Abdul Madjid Ma''ruf, this doctrine will give a balance between the esoteric and
    exotic life. He puts it here:


    It is not enough for just to study iman misyādah, as the early Sufis were merely
    focused on their ascetic life (zahid) and their isolation (tazrid) that they could
    not fulfill their duties as people of their nation (Anonymous 1425c10-14).


    The last doctrine of Wāhidiyat is taqdim al-aham fa thumma al-anfa fa al-anfa''.
    This doctrine is described as giving priority to fulfilling the most important
    matters as well as the most useful matters. This doctrine applies especially when
    people are faced with two important options. In this case, they should choose
    which one is the most important. If both are important, then one should choose
    the option which is more useful. According to this doctrine, everything that leads
    to the consciousness of God and His Prophet is regarded as most important (aham)
    and everything which gives benefits others is regarded as the most useful (Anonymous
    1425b:30). This doctrine is derived from Islamic legal theories that state preventing
    damage should be prioritized over seeking benefit (dar''u al-mafasid muqaddam
    ala jalb al-masālih) and that lesser injuries are prioritized between two injuries
    (fi al-darārain akhdu akhafifha).


    It is clear that the teachings of Wāhidiyat stress the importance of the internal
    components of religious life as well as the necessity of observing the outward
    rituals of Islam and avoiding shirk khafi (hidden polytheism). The first six doctrines
    are closely related to managing one''s heart and intentions by emphasizing dhawqiyat
    (mystical taste or sense), while the last two doctrines are concerned with daily
    activities which should also be fulfilled by Wāhidiyat members. Practising the
    doctrines of Wāhidiyat will not prevent them being involved in social activities.
    Instead of encouraging passivity and withdrawal from worldly affairs, the followers
    of Wāhidiyat are required to become involved in public life, not only by performing
    their daily tasks but also by spreading Wāhidiyat to the community. In this sense,
    Wāhidiyat appeals to Muslim activism, as the fulfillment of worldly duties is
    seen as an integral part of its followers'' progress in their spiritual journey.


