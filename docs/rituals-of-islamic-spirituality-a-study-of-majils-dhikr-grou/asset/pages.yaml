  md: '# # Chapter I


    # ## 1.1. The Significance of the Study


    This is a study of developments in Islamic spiritual practice in East Java. It
    focuses on groups organized with the specific purpose of chanting of various Islamic
    litanies. The study of these groups, designated by the name, *Majlis Dhikr*, is
    a neglected area of research within the study of Islamic ritual groups in Indonesia.
    In contrast to the abundance of Sufi groups (I., *tarekat*), such as Tijaniyah,
    Qadiriyyah, Naqshabandiyyah, Qadiriyyah wa Naqshabandiyyah, and Shatariah, has
    not yet been any comprehensive study devoted to the development of *Majlis Dhikr*
    in the Indonesian Islamic context. This lack of research is, unfortunately, accompanied
    by negative images of these groups. Nahlatul Ulama, as an organization, does not
    agree these groups official recognition as *mu’tabarah*. Many Indonesian scholars
    and Muslim groups consider these *Majlis Dhikr* to be local tarekat that lack
    proper genealogy of transmission, *isnad*) or represent unorthodox or pseudo-Sufi
    organizations. Often these groups have been considered syncretic because they
    incorporate strong local elements, both in their ritual and in their teachings.
    For the Indonesian Salafi group, the ritual practices of *Majlis Dhikr* are considered
    as *bid’ah* (innovation within Islam) because they claim they have no sanction
    in the Prophet tradition.


    One reason that *Majlis Dhikr* groups are not considered to be *mu’tabarah* (recognised)
    by the *Jam’iyyah Al-Thariqah al-Mu’tabarah*, which was established in 1957 under
    the Nahlatul Ulama (NU) organization as the forum for recognized Sufi groups in
    Indonesia. One of these criteria is that a group can be regarded as *mu’tabarah*
    if its *wirid* or ritual practices can be traced through an unbroken line of links
    between its *murshid* and the Prophet, and its teachings and doctrines be relevant
    to the Islamic law (A., *shari’at*) (Turnudi 2003:65). Any Islamic group, which
    does not meet this criteria, cannot be regarded as *mu’tabarah*.


    Although the teachings of *Majlis Dhikr* groups conform to *shari’at*, nevertheless,
    the agreed *Jam’iyyah*, do not have an unbroken line of links between their founders
    and the Prophet. In other words, the Prophet never practised the *wirid* used
    by these groups and never passed it to the founders through a genealogy of spiritual
    leaders. As a result, for the *Jam’iyyah*, no *Majlis Dhikr* group can be regarded
    as an acknowledged Sufi order (I., tarekat yang mu’tabarah) because they do not
    have such links.'
