  md: '# # Chapter IV: ‘Turn to God and His Prophet’: The Spiritual Path of the Šalawat
    Wāhidiyat Group


    This chapter examines a Majlis Dhikr group that defines itself as an alternative
    mystical path among other recognised Sufi orders but also as part of legitimate
    ritual practice in Islam. An assessment of how this MajlisDhik group known as
    Wāhidiyat does requires assessment of its history and the sources from which the
    doctrine and the ritual practices of this group are taken, as well as the way
    this group disseminates its teachings to others. What I hope to show here is that
    although this Majlis Dhikr group is not regarded as a tarekat muʿtabaraha (a recognised
    Sufi group) by Nahdlatul Ulama, it still belongs in the frame of the Sufi teachings
    practised by other international Sufi groups. Moreover, despite the fact that
    this Majlis Dhikr group has developed from classical Sufism, it is not identical
    with it, and offers a world view and ritual that distinguishes it from other Sufi
    groups in Indonesia.


    # ## 4.1. The Foundation of Šalawat Wāhidiyat


    The word Šalawat originally means ‘blessing’ or ‘grace’ of God. But according
    Islamic tradition, the word Šalawat refers to particular prayers or blessings
    to the Prophet Muhammad, which are therefore often followed by the wordal-Nabī
    (the Prophet). The reciting ofofŠalawat is part of Islamic teachings since it
    is revealed in the Qur’an and hadith. The recommendation to recite Šalawat is
    primarily found in the Qur’an(33: 56) and hadith as follows:


    Undoubtedly Allah and His Angels send blessings on the Prophet. O’ you who believe!
    Send upon Him Blessings and salute Him with all respect.(33:56)


    On the Day of Judgment the nearest person to me, from amongst the people, would
    be the one who have recited Šalawat the most in this (mortal) world. (Tirmidhi)'
