    groups been integrated in one group, this group might have had greater potential
    for spreading istighāthāt among people.


    # 5.3. The Ritual of Ihsāniyat


    The central ritual of this group is the recitation of istighāthāt. One of the
    leaders of this group stated that this ritual includes pronouncing the name of
    the sheikh or teacher as mediator in the ritual (A., tawassul), remembrance (A.,
    dhikr), the recitation of Salawat, prayer(A.,du‘ā), and a request for forgiveness
    (A., istighfar). All of these features are endorsed by Islam and regarded as ibadat
    (Muttahid 2004). Ibadat is understood by this group to refer to untold activities
    in addition to the five actions like reciting the Qur’an, tahfil, tahmındand visiting
    tombs to the five pillars of Islam: the witness of faith (A., shāhāda), prayer,
    charity, and pilgrimage (Muhaiminin 1995). In other words, ibadat in this sense
    is understood in its broader sense, which includes things that can be used as
    a means to get God’s prayer and to attain closeness to Him.


    According to Gus Abdul Latif, all of these activities have a strong basis either
    in the Qur’an or the hadith. Dhikr, for instance, is a practice drawn from many
    references in the Qur’an explaining the excellence of the remembrance of God


    ¹⁴ Interview with a student of Pesantren Japes, Kediri, November, 2004.'
