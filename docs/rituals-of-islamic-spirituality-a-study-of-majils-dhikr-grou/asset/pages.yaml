  md: 'In 1971, before the first general election was held in the New Order era, he
    composed a new *Salawat* without giving a name to it. This new *Salawat* was similar
    to the previous one, but had a contextual meaning related to the political situation.
    In other words, this *Salawat* was composed in response to the disastrous political
    changes affecting the lives of the Indonesian people and Indonesian Muslims, In
    particular, by reciting the *Salawat* his followers were expected to pass successfully
    through this difficult time. It was not clear whether political motives stimulated
    Kyai Abdul Madjid Ma''ruf to compose the *Salawat.*? But, according to an informant,
    the *Salawat* Wāhidiyat group was not involved in political activities and was
    not affiliated to any particular party. The new *Salawat* was as follows:


    ![](img/01af2b352cfb1170b9fe9584d3d50ae2_140_0.png)


    O! The intercessor of you on, my efforts and the Beloved of Allah, His exaltation
    and peace have been stuck, in my country. O! My Lord, take my hand and peace (ummat).


    In order to complete the *Salawat Wāhidiyat*, he composed two more prayers consecutively
