  md: 'Arifin Ilham and his group among Indonesian Muslims nationally has been strengthened
    by wide publicity in the media. For example, the activities of Arifin Ilham and
    his group are widely reported by Indonesian electronic and print media. Like Abdullah
    Gymnastiar (known as AA Gym), a famous young Muslim preacher, and his dhikr activities
    regularly appeared on national television programs during the period of his research.
    Furthermore, cassettes and CDs of his tausiyah (l., ceramah, religious lecture)
    and dhikr ritual are readily found in many music shops. His face is also visible
    on the covers of many books in big shops in Indonesia such as Gramedia and Gunung
    Agung bookshop.


    The Şalawat Wāhidiyat group is another important Majlis Dhikr group in Java, with
    many cities throughout Indonesia and overseas. This group was set up in 1963 by
    Kyai Abdul Majid Ma''ruf, believed by his followers to have experienced a dream
    of the Prophet. Focusing its on the recitation of Shalawa (the exaltation of the
    Prophet), the group has set up branches in many cities in Indonesia, with its
    central board in Kediri, East Java. In order to spread its teachings, beside using
    Kedong pesantren as a home base, this group has established an organizational
    structure which consists of a central board office with representatives in provinces,
    regions, sub-districts, and villages, something which has not been done by other
    Majlis Dhikr. The highest authority and decision-making body in the Wahidiyat
    is Kyai Abdul Latif Majid, the son of the founder, who acts as the guardian of
    the Wahidiyat and as the head of its foundation and organization. Among Wahidiyat
    is considered by some to be an unacknowledged tarekat (ghairu mutabarah) since
    it does not have an unbroken chain of transmission that can be traced back to
    the Prophet. Despite its popularity, this group keeps no official record of the
    members of it.


    Another significant Majlis Dhikr group is called Istighāthāt Iḥsiyiyat. Compared
    to the previous groups, theIstighāthāt Iḥsiyiyat is a relatively new, established
    in Kediri in 1999 by Kyai Abdul Latif, a kyai from pesantren Jamkes. The ritual
