    Regardless of their strategy, Sufism is an important subject in pesantren. The
    inclination towards Sufism by most pesantren is closely related to the fact that
    pesantren are institutions that aim not only to transfer Islamic knowledge but
    also to transfer values (akhlāq). Sufism provides a set of religious values which
    are needed by pesantren to mould the character of their students and develop their
    spiritual life. As a result, tasawuf is often taught under the heading of akhlāq
    (Islamic ethics) and sometimes it is hard to distinguish the teachings on akhlāq
    from those of Sufism. Pesantren traditions require not only the implementation
    of these teachings into practice under the guidance of a teacher. This understanding
    of Sufism in the pesantren relation is relevant to the definition of tasawuf as
    put forward by some kyai as Kyai Shohoibulfadfa Tajul Rifin, known as Abah Anom
    who stated that ‘tasawuf cleans the heart and its heinous inclinations by teaching
    exercises to control passion, to develop a noble character and to follow the teachings
    of the Prophet Muhammad as persistently as possible.’ Similarly, Kyai Shamsuri
    Bad defined pesantren as the purification of the soul from disgraceful characteristics
    (Zulkifli 2002).


    Among the Sufi texts taught in pesantren, al-Ghazāli’s works are most prominent.
    Bruissenen who carried out research on the Arabic classical books (1., kitab using)
    in pesantren concludes that Sufi texts taught in pesantren are dominated by Ghazali’s
    works such as Ihyā’ ‘Ulm al-Din, Minhaj al-‘Abidin and Bidayat al-‘Abidin (Bruissen
    1994b). Some pesantren such as Pesantren Darajah, Bendo, Pare, Kediri; Pesantren
    Bustulan Ul, Batoan, Mojo, Kediri and Fathul Ulum, specialize in the teaching
    of Ihyā’. In pesantren, Ihyā’ ‘Ulm al-Din holds high rank. It is seen as the final
    stage of an intellectual journey that involves the study law and theology. This
    book is taught to students who have finished their study in formal classes in
    pesantren.


    The reason why Ghazali’s works on Sufism have dominated the teaching of Sufism
    has to do with the doctrine of Ahlussunnah wa al-Jama’ah prevalent in pesantren,
