  md: 'Another reason for holding the istighhāthāt ritual at the tombs for the intercession
    and blessing of these deceased pious saints. According to Gus Abdul Latif, since
    it is difficult to guarantee people''s good deeds will be granted by God, these
    pious saints can be used as intercessors for the soul so that God may grant people''s
    prayer because of these pious people. Therefore, for Gus Abdul Latif, it is necessary
    to venerate and love those saints who are beloved of God so that God will give
    His to the people.


    There are several Muslim tombs where this group holds its rituals. Most of these
    tombs are located in Kediri but some in Bali while other include several tombs
    of the Nine Saints (Wali Sanga) in Java. In Kediri, for example, the Ihsaniyyat
    group has held its ritual at the tomb of Sheikh Ihsan Dahlan, the Ihsaniyyat''s
    ancestor, also at the tombs of Raden Demang, Sheikh Mursyad, Sheikh Ali Lalean
    (Pangeran Demang), Sheikh Ageng Karangelo. These shrines are located in several
    regions of Kediri, enabling this group to attract people who in the vicinity of
    these shrines. Interestingly, several tombs of Muslim saints in Kediri were also
    used by other local tarekat groups without any conflict and tension. When I attended
    a ritual in Sheikh Mursyad''s tomb, I met one who had actively participated in
    one ritual there by another group. He attended the istighhāthāt ritual held by
    Ihsaniyyat and became a member of Ihsaniyyat while being a member of another group.27


    Other shrines which have been subject to visitation and ritual, are located in
    Bali. Muslim tombs in Bali that have been said by local people and by this group
    to be Muslim saints'' tombs are the tombs of Habib ''Ali Baafaqih in Negara, Pangeran
    Mas Sepuh (Keramat Pantai Seseh), Sayyidah Khadijah (Denpasar), Sheikh Abu Bakr
    al-Ham (Keramat Kusuma) in Klungkung, Habib ''Al Zain Idris (Keramat Kusuma) in
    Amlapura, Sheikh ''Abd Jalif (Keramat Saren Java in Bali), Sheikh Habib Umar Yusuf
    (Keramat Bedukul) in Bedukul, and Sheikh ''Abd al-Qadir (Keramat Temuk) in Buleleng.
    During my visiting with Ihsaniyyat pilgrims to these tombs, I found that one of
