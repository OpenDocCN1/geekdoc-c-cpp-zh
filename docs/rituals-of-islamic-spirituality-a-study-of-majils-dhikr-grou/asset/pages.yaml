  md: '# Chapter VII


    # Conclusion


    The main object of this study has been to examine the emergence of forms of Islamic
    spirituality in Indonesia identified as Majlis Dhikr. Various Majlis Dhikr offer
    similar Islamic ritual practices to those of the increasing popular tarekat in
    Indonesia. I have argued in this study that despite criticism from other Indonesian
    Muslims, the ritual practices of *Majlis Dhikr* can be legitimately accepted as
    proper Islamic ritual since the aim of these practices is to attain closeness
    to God and His Prophet. Throughout this work, I have presented a wide-ranging
    discussion of Majlis Dhikr groups. Most of their rituals are observable because
    they are widespread in many areas of Java. This discussion includes consideration
    as to how Majlis Dhikr groups regard their practices within Islam criticism from
    Indonesian Salafi groups and members of Indonesian tarekat. I also consider the
    extent to which the teachings and ritual of Majlis Dhikr groups are related to
    the teachings of the *Q''an*, hadith and Islamic teaching and orthodox Sufism.
    I then examine how Majlis Dhikr groups disseminate their teachings and the role
    of pesantren in spreading these groups. In concluding chapter I summarise the
    findings of this study and offer answers to the research questions posed in Chapter
    I, emphasizing the contribution this work has endeavoured to make to the scholarly
    literature.


    The prediction of some Indonesianists Sufi groups, with their rural Muslim scholars,
    would disappear from the Indonesian landscape as Indonesian society modernised
    has proved to be flawed. This study has provided evidence that *Majlis Dhikr*
    has proliferated among rural and urban people and continue to attract new membership,
    following the increasing popularity of Sufi tarekat. Not only have peasants increased
    their interest in Majlis Dhikr, the urban middle class and many educated Muslims
    have been attracted to join Majlis Dhikr groups. The central figures in these
    Majlis Dhikr groups are *kyai* (Muslim scholars) or *ustadh* (Muslim teachers)
    who have graduated from pesantren. In contrast to the predicted decline in Sufism,
    pesantren has continued to produce Muslim scholars (*kyai*) both in rural and
    urban Javanese areas who play an important role not only in inculcating Islamic
    values and norms in the lives of Muslims but also in developing Majlis Dhikr as
    venues for practising Islamic ritual.


    However, despite this, there has been criticism of the emergence of Majlis Dhikr
    groups as a new phenomenon of Islamic spiritual practice in Indonesia.'
