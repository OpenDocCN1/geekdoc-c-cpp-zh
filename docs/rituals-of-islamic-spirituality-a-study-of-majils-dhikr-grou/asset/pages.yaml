    of doing something which can cause God to give His life to his servants. This
    idea reminds us of the teaching of the Saint, Rabi’at al-'' Adwiyat, which first
    introduced the idea of life in Sufi practice.


    It is clear that the teachings that Gus Mik gave to his followers were deeply
    inspired by the teachings of prominent Sufi. Sometimes, he taught his followers
    about good conduct, positive attitudes, and morality from local tradition without
    making any religious reference, and presented this advice using their vernacular
    language. As a result, his followers who were mainly villagers easily understood
    this type of teaching.


    # 6.6 The Group after Gus Mik


    Kyai Saiful, senior ‘ulama’in the Dhikr al-Ghāfilin group, told me that before
    Gus Mik passed away, he did not give any message of advice (I., wasiat) to his
    children about who should be his successor as the leader of the Dhikr al-Ghāfilin
    group¹. Instead of choosing his successor from one of his sons, Gus Mik said that
    all of this group (A., *samiin*) and memorizers (A., *khuffaz*) involved in the
    group could be the leaders. Several days before he died, one of his students asked
    him when he was critically sick in the hospital (Rumah Sakit Bukit Mulya) in Surabaya,
    “Who will choose your successor to the group while you are being in this hospital?”
    he replied, “Do you mean my successor or I?” The student did not dare to ask further
    (Hidayat 1993b). This situation without doubt confused Gus Mik’s followers. Kyai
    Saiful told me that Gus Mik did not choose a successor, does not necessarily mean
    that no one could succeed him as leader. Kyai Saiful believed that one of Gus
    Mik’s sons or his close friends had to become his successor. However, selecting
