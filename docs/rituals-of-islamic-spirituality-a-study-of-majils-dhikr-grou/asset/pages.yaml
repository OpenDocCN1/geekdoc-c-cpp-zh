  md: '# Rituals of Islamic Spirituality


    A similar response to Majlis Dhikr, especially for the Shalawat Wāhidiyat group,
    was given by Kyai Machrus Ali, a prominent ‘ulama’ with Nahdlatul Ulama background,
    who regarded the Shalawat Wāhidiyat group as a non-mu’tabarakah group because
    of its lack of direct connection between the founder of the group and the Prophet.
    According to him, the founder of Wāhidiyat established and practised his ritual
    based on his encounter with the Prophet in a dream. According to Kyai Machrus,
    dreams cannot be used as a theological basis for establishing a tarekat.


    The Dutch scholar Martin van Bruijnen has categorised Majlis Dhikr group as Wāhidiyatas
    tarekat whose practices and rituals are inseparable from those in other mystical
    groups (I., golongan kebaitan). As a result of this notion, seemingly influenced
    by a Geertzian era of Japanese Islam, Bruinssen considers Wāhidiyatand the like
    spiritualist and syncretic movements (gerakan kebaitan yang sinkretis) which has
    eventually prompted several tarekat, such as Qadiriyah, Naqshabandiyah and other
    mainstream tarekat to establish the non-affiliated Jam’iyyah Ahl-Thariqah al-Mu’tabarah
    as an institution to disassociate themselves from syncretic groups (Bruinssen
    1992).


    Likewise, Lukman Hakim, one of the members of a prominent tarekat group in Indonesia,
    has made that Sufism and tasawuf cannot be practised without joining an acknowledged
    tarekat (tarekat yang mu’tabarah).¹ He argues that the practice of tasawuf without
    being member of an acknowledged tarekat (I., bertasawuf tanpa tarekat) and without
    the supervision of a spiritual master (A., Murshid) can only lead to a superficial
    level of spiritual experience (A., ‘ilm al-yaqin and haqq al-yaqin). In words,
    in order to attain the deepest level of spiritual experience (A., haqq al-yaqin),
    Muslims should affiliate with an acknowledged tarekat whose ritual is clearly
    derived through an unbroken line of links connected to the Prophet. The implication
    of this notion is that any Islamic spiritual group including Majlis Dhikr group,
    which does not have a spiritual genealogy going back to the Prophet, cannot be
    used as a means to practise tasawuf. Lukman Hakim has argued


    Those who practise Sufism without tarekat only attain the experience of ‘ilm al-yaqin.
    They never reach ‘ain al-yaqin and haqq al-yaqin. This is because they only believe
    (I., yakin) based on their theoretical philosophy. They do not believe practically
    (I., secara amalia), even though they claim that they believe secara amalia. this
    belief helps only in their imagination, if they believe secara amalia.


    > ¹ Interviewed with Lukman Hakim, Jakarta, 24 July 2005.'
