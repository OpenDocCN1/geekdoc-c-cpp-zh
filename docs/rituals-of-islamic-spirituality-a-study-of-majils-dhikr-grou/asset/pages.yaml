  md: 'consequence, anyone who proclaims himself the successor of the author, should
    not be perceived as perfect as the author since it is impossible for an heir to
    inherit the properties and qualities belonging to the late author. The heir, might
    have one quality that the author had. This is like the Muslim scholars who have
    been regarded in the Prophetic tradition as the heirs of the Prophet. As heirs
    of the Prophet, do not inherit the Prophet’s qualities and knowledge (Yusuf 1994:14-15).
    Yusuf put forward this view by the fact that after the death of the author, following
    the emergence of several Wāhidiyat organizations, many followers of Wāhidiyat
    were confused about whom they had to entrust with their spiritual development.
    In this sense, the aim of this opinion was twofold: give the impression to the
    followers that the new PSW established in Ngoro, Jombang was the official body
    to which they should submit their spiritual qualities and to demonstrate that
    although the songs of the author led other Wāhidiyat organizations, they were
    not equal to the Kyai Abdul Madjid Ma’ruf in their qualities.


    The impact of these conflicts were strongly felt by Wāhidiyat followers in many
    regions. It was reported that many Wāhidiyat followers in Sumenep, Madura, were
    divided into two factions: those who followed the older generation (PSW) which
    still maintained the authority of Kyai Abdul Madjid Ma’ruf while not submitting
    to Abdul Latif Madjid, and mostly of a younger generation who followed Abdul Latif
    Madjid. This conflict thus resulted in confusion among people on which group to
    join (Anonymous 1999c:36).


    It is clear that each faction made their own judgment on the validity of their
    organizations. The first faction made its judgment by relying on the genealogical
    family, while the other used the official structural organization established
    by the founder. These conflicts show that any religious organization can be vulnerable
    to conflict if one of the proponents of the organisation emphasises his or her
    own interest rather than that of the organization. The internal conflict in Wahhidiyat
    might not have happened if each faction had negotiated the quest for power by
    individuals without sacrificing the unity of the organization.'
