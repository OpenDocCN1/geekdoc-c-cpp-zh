    Another salient feature of the second wave of intellectualism coming to Indonesia
    was the growth of Sufi orders in Indonesia. The growth of Sufi orders during the
    period was made possible by the increase number of pilgrims performing the haji.
    Several Sufi orders played an important role in anticonial rebellions during the
    late 19th and early 20th centuries.


    The nature of the second wave of intellectualism contributed significantly to
    the development of Sufism in pesantren. Key pesantren affiliated with Sufi orders
