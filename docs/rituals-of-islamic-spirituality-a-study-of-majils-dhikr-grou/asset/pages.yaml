  md: '# Rituals of Islamic Spirituality


    There are many other hadith which stress the importance and the benefit of reciting
    Salawat to the Prophet. Although the Prophet mentioned only one particular kind
    of Salawat which is well known as al-Salawat al-Ibrāīmiyyat, according to one
    informant this does not necessarily mean he forbid followers from composing other
    Salawat. As a result of this, it is believed that every person is allowed to compose
    the text of Salawat as long as it is dedicated to the Prophet. In this sense,
    there are number named according to their composer. Salawat, Nāriyat and Kāmilat,
    composed by Sidi Ibrahim al-Nāzī, is believed to be able to make livelihood for
    those who recite it four times (Shihah 2006:363). Another Salawat is called Salawat
    Munjiyat since it is used to avert danger. Yet another Salawat is called Salawat
    Mašiyah since it was composed by ‘Abd-al Ibn Mašis (1228), whose tomb in Morocco
    is an object of visitation and narration. Other examples of this kind of Salawat
    are Salawat Bakariyat, Dardiyat, and Mirghaniyat (Shiddley 1964:70). Therefore,
    it is commonly associated with Wahiday board members that are two categories of
    Salawat: the first is Salawat Ma’thura, which means the text of the Salawat derives
    directly from the Prophet, and the second is Salawat Ghair ma’tura meaning the
    text was not taught by the Prophet, but it was composed by the Prophet’s Companions
    and Muslim ‘ulama’ (Anonymous 1999b:63-71). Salawat Wahiday, therefore can be
    added as an example of Salawat in this latter category it was composed by a Muslim
