  md: '# Rituals of Islamic Spirituality


    most notable criticism comes from different groups, either from supporters of
    tarekat or from members of Indonesian Salafi groups such as Dewan Dakwah Islamiah
    Indonesia (The Indonesian Council for Islamic Preaching, DDII). The followers
    of tarekat have particularly addressed the issue of validity of *isnad* (transmission)
    in Majlis Dhikr, since such groups do not have an unbroken line of links between
    their founders and the Prophet. In contrast, the Salafi Majlis Dhikr groups vocally
    and in unison, and have charged it with *bid''ah* and heresy as it is claimed,
    were never practised by the Prophet and his Companions. Despite these criticisms,
    Majlis Dhikr groups regard their ritual as legitimate practice that offers an
    alternative to tarekat for Muslims to practise Islamic spirituality. In responding
    to the issue of the *isnad*, members of Majlis Dhikr group have argued that their
    ritual does not necessarily need a chain of transmission (*isnad*) back to the
    Prophet since they practise in ritual, as reciting *Shalawa*, was strongly recommended
    by the Prophet himself. Furthermore, they argue that though their groups are not
    regarded *mu''tabarah* by the *Jam''yyah* Al-Thariqah Al-Mu''tabarah, the Forum
    for tarekat mu''tabarah in Indonesia within Nahdlatul Ulama, this does not necessarily
    mean that their *dhikr* ritual should be prohibited since the aim of this ritual
    is similar to that of *dhikr* conducted by tarekat, namely to attain closeness
    to God.


    In order to prove that their ritual are legitimate, Majlis Dhikr groups have based
    their argument not only on the prescriptions of the Qur''an and hadith, but also
    on the views of authoritative Muslim scholars. Based on their understanding and
    interpretation of these sources, members of Majlis Dhikr groups believe that their
    ritual of vocal recitation *dhikr* in unison is both lawful and sanctioned by
    God and His Prophet. Closer examination of the debates involving the proponents
    and opponents of Majlis Dhikr in Indonesia reveals that both parties base their
    arguments on the interpretation of Qur''anic verses, hadith and the views of Muslim
    scholars. In addition, both groups have similar views on the practice of *dhikr*,
    but they differ on the particular issue of whether the recitation of *dhikr* has
    to be conducted in unison and vocally or to be conducted individually and quietly.
    Their differences are due to different interpretations of the textual evidence,
    not to presence or absence of textual evidence. As argued by Quraish Shihab, a
    renowned exegete, in the matter of interpretation, no one can regard their interpretation
    as absolutely true, regarding other interpretations as false. This is partly because
    one group of Muslims gives its interpretation of a particular religious text,
    this is commonly challenged by another group of Muslims. The interpretation of
    one group of Muslims is therefore absolute for them, but not for another group
    (Shihab 1992:219-220).'
  merge: -1
  pgno: 279
