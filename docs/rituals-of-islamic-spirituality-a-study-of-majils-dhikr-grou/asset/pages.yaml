  md: '# Rituals of Islamic Spirituality


    To perform taubat, it is not enough just istighfar, without following three requirements.
    Qushairi notes three essential conditions in order for repentance to be acceptable.
    The first is contention for acts of disobedience. The second is the immediate
    abandonment of sin through fulfilling the obligation to refrain from disobedience.
    The third is the determination not to sin again (al-Qushairy 2002:111). This is
    similar to Gus Abdul Latif''s view that no son or daughter of Adam is committing
    sins, and the best of those who have committed sins are those who repent from
    it. Moreover, it is believed that performing istighfar is to purify hearts and
    get rid of sins.


    The last component of istighāthat is the prayer of supper (A., duā’). This ritual
    is normally placed at the end of the istighāthat. It is at this time people are
    urged to pray to God with the guidance of their leader, asking not only for their
    happiness in the hereafter but also for happiness in life. As one Sufi orders,
    duā is stressed in this group it is considered to be the most important practice
    of istighāthat.


    The ritual of istighāthat is normally led by the leader of the group or his representatives
    to the tombs of holy people or other places as in mosques, a village public hall
    (I., balai desa). This ritual usually begins with a session called arwah. As implied
    by this, which is derived from the word meaning the soul of deceased person (I.,
    arwah), this ritual involves the leader sending prayers or the al-Fāihat chapter
    to deceased persons, at the request of the participants. In this session many
    people request the leader to recite al-Fāihat not for deceased persons, but for
    their own worldly purposes. For example, during this session participants have
    asked for success in the local elections, Indonesian football competition, earning
    money, the military tests, selling houses, or for the recovery of a chronic disease.
    These requests are written on a piece of paper and given to the coordinator a
    few minutes before the session begins. For a share in the blessing (I., barakah)
    and intercession from the personage in the tombs, the leader reads the requests
    and makes a prayer. In return, those who make these requests should give some
    money voluntarily to the coordinator. The amount of money is not determined. In
    the great ritual of istighāthat, the arwah session can take a long time since
    many people make requests.


    When the arwah has been concluded, the next session will be a religious lecture
    (A., mau’izat al-hasanat) followed by interactive dialogue involving the participants
    and the leader. The topic of the lecture is not determined beforehand


