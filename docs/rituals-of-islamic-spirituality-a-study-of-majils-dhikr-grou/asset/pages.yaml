    In fact, the achievement of a spiritual experience or *karamah* is not the ultimate
    aim of *Wāhidiyat* and other Sufi practices. Indeed, according to Sufi teaching,
    if disciples practice Sufi teachings just for the sake of gaining *karamah*, they
    will be hindered (A., *mayjīb*) in search of God. Some stories have even mentioned
    that *karamah* constitutes a temptation by God to test his servant (Ernst 2003:71).
    Nevertheless, stories of spiritual experiences are familiar among *Wāhidiyat*
    followers. This is partly because such stories are introduced deliberately, not
    only through official rituals as *mujahāda* but also through the publication of
    the book *Shalawat Wahidiyah dan Pengalaman Rohani* as well as a certain section
    of the *Aham* magazine which contains the stories of spiritual experience or *karamah*
    experienced by the followers. Like other hagiographical Sufi books, the book focuses
    on stories of the miraculous powers of the leader, as well as the peculiarities
