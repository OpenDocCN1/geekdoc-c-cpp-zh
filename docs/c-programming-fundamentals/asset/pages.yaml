  md: '# 4. *Loader*


    The loader places your program onto the memory and this is where the programs
    actually runs.


    ![](img/4d9a4ae4efedabe01be6e6c44bad2dc1_28_0.png)


    *Figure 1.8* C++ execution flow


    Let us write our first program in C++.


    Steps to follow:


    +   1. Get a text editor (such as Notepad) to write C++ code and a compiler(GCC)
    to translate the C++ code into machine code.

    +   2. Get an IDE (Integrated Development Environment) to edit and compile your
    code (such as Code::Blocks, Eclipse, or, in this example, Visual Studio).

    +   3. In Visual Studio, go to `Folder>File>new.cpp` and save the file before
    you start coding.

    +   4. Click on the right-most run symbol, which shows you options to debug or
    run the file to get output on the code terminal.


    ![](img/4d9a4ae4efedabe01be6e6c44bad2dc1_28_1.png)


