- pgno: 17
  md: '# C++ AND BEYOND


    # Introduction


    In this chapter, you will become familiar with the basics of C++, a powerful programming
    language used by developers for its easy syntax and concepts. Many video games,
    embedded systems, IoT devices, and resource-heavy AI applications make use of
    C++. C++ is a general purpose and cross-platform language that offers a vast collection
    of libraries to help you program with ease. Let’s get started.


    # 1.1  The Origin of C++


    In 1980, Bjarne Stroustrup, a Danish Computer Scientist working at AT&T Bell labs
    in Murray Hill, New Jersey, developed C++, which inherited the features of C and
    Simula67 and supported Object Oriented Programming (OOP). The programming language
    was originally named “C with Classes,” as Stroustrup’s main objective was to make
    use of classes to implement OOP features.


    ![](img/4d9a4ae4efedabe01be6e6c44bad2dc1_17_0.png)


    *Figure 1.1*  Programming relationships with C++'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'The ++ symbol with C is called the *increment operator*, which signifies that
    the language is an extended version of C. C++ was available outside Bell Laboratories
    in 1985, and its first C++ compiler, called Cfront, was released in 1985. The
    American National Standard Institute (ANSI) formed a committee for C++ in 1989.
    The first draft standards were published in 1995. Programmers are frequently advised
    to learn C before diving into C++, but that is unnecessary for using this book.
    We will learn the core principles of C++, as well as some programming basics.
    C++17 is the latest version of C++ being used.


    # 1.2  Why Use C++?


    C++ is often used for its simplicity and OOP facility. Other reasons to use this
    language are as follows:


    # C++ Features


    +   - Simple syntax: As it is derived from C, the syntax is similar and easy to
    understand.

    +   - Object-oriented: OOP features like polymorphism, inheritance, encapsulation,
    and abstraction are used.

    +   - Platform dependent: Your code will execute only on the operating system
    it is designed and developed on.

    +   - Provides memory management: Dynamic memory allocation is supported by C++.

    +   - Mid-level programming: It is capable of doing low-level programming tasks,
    such as for drivers and kernels, and high-level applications like games, GUI,
    and desktop apps.

    +   - Vast libraries: You have access to many built-in functions (libraries),
    which saves time.

    +   - Compiler-based: Your C++ program won’t be executed without passing the compilation
    barrier.

    +   - Structural programming language: Your code is *modular*, i.e., consisting
    of functions, classes, and objects.'
