    +   - The `this` pointer in C++ that stores the address of an object or class
    instance enables the member function to update the correct object values.

    +   - Class functions can either be defined inside or outside the class definition.

    +   - Calling class functions is carried out using objects of the class through
    the dot or selection operator.

    +   - In C++, the `static` keyword declares any variable, data members, or functions
    as a type of constant. The values cannot be modified.

    +   - `::` is the scope resolution operator in C++, and its primary role is to
    access or assign value to static members of a class.

    +   - The `new` and `delete` operators are used for memory allocation and deallocation
