  md: '# Arrays and Strings


    # 3.1  What is an Array?


    An *array* is like a storage facility: it allows you to keep similar data types
    under one “roof,” identified by one name. Items stored inside an array can be
    integers, characters, and strings. Whatever you wish to group together, you can
    using an array. Let us see how they are declared and initialized.


    # 3.1.1  Ways to Declare Arrays


    +   - `Datatype array_name[array_size];` declared by giving the size

    +   - `Datatype array_name[]={element1, ele2..};` declared by initializing the
    elements

    +   - `Datatype array_name[array_size]={element1, ele2..};` declared by initializing
    the elements and size

    +   - `Datatype array_name[array_index]= ele3;` assigning an element to a particular
    index


    Here, the `[ ]` subscripting operator is used so the compiler knows it is an array;
    this is followed by similar types of elements, with an index starting from 0 (i.e.,
    the first element of any array is always assigned index 0, `arr[0]`, and the length
    of an array is n-1, where n denotes the total number of elements). Let’s consider
    an example. Try visualizing an array as a passenger train with three coaches,
    one behind the other, with ticket numbers assigned'
