    \ memory whenever required than C functions like `malloc()`, `calloc()`, and `free()`.\n\
    \nMemory management in programming is important, as the RAM space provided in\
    \ a device is limited. *Garbage collection* is a type of memory management technique\
    \ done either manually or automatically by the garbage collector. We have done\
    \ this type of work before: all global and static variables only live until the\
    \ end of the program, after which they are of no use and the memory is freed up.\
    \ Local variables inside a function, too, only “live” between the span of the\
    \ function call and return statement. All of this work is done automatically in\
