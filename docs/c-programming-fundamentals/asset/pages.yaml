    \n# Features of Generic Functions\n\n+   - Act like macros and body expanded at\
    \ compile time to receive arguments\n+   - Source code serves as a template and\
    \ so the code is the same for all functions, but when the different copies of\
    \ the code are compiled, there are differing results because there are different\
    \ argument types.\n+   - Class templates can also be used in a similar fashion\
    \ as generic functions.\n+   - These functions help decrease function overloading.\n\
