- pgno: 23
  md: 'Communication is important for objects in C++, as they might need to execute
    some requests from other objects to complete their own task (function). For successful
    communication, you need the sender’s and receiver’s address and information to
    be sent. For C++ terms, all you require is the correct object name(receiver),
    function name, and data.


    # 6. Dynamic Binding


    *Dynamic binding* (or *late binding*) tells which procedure will be called at
    runtime. The code we write in C++ is called the *source code* and it is saved
    with the extension .cpp. The compiler checks each line in the program to find
    any errors and notify us about them. The time it takes the program to execute
    is called the *runtime*. That is when the function calls are executed. The code
    inside our procedure is not known until execution, hence the name late binding.
    In C++, it is implemented using objects.


    # 1.4  C++ Basics


    Now that you understand what can be done in C++, let us look at exactly how it
    is done. Similar to mathematics, we will learn about what variables are, as well
    as the symbols we will use to solve problems.


    # 1.4.1  Variables


    *Variables* in C++ are unique names given to units that hold value within a defined
    scope. Naming is done by following certain rules. By following these rules, you
    can make your program more understandable to others (as well to yourself).


    The *variable declaration* means introducing the variable to the program before
    it is used anywhere.


    A *variable definition* means the variable is assigned a memory location and a
    value. Rules for naming variables in C++ are as follows:


    +   1. It should start with an alphabet

    +   2. It can contain combinations of digits or , letters.

    +   3. It should not contain any whitespaces or special characters (such as !,
    %, or #) except underscore(_).

    +   4. It should not contain any C++ reserve words (also called *keywords*).'
