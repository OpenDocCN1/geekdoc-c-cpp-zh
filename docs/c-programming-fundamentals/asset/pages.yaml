  md: '# CHAPTER 2


    # Basic Play in C++


    # 2.1  Literals, Constants, and Qualifiers


    Often while coding, your program will need a value that will not change throughout
    the program’s life, such as the value of pi or any basic values you wish not to
    manipulate. A fixed value that may not be changed is called a *constant*. Literal
    constants (or just *literals*) are unnamed values used directly in our code. They
    are constants because their values cannot be changed until you rewrite the program
    and compile it again. Just like objects have a type, all literals have a type.
    The type of a literal is assumed from the value and format of the literal itself.
    *Character literals* are enclosed in single quotes. A character literal can be
    a plain character, escape sequence, or universal character. A special character
    with a \ at its beginning has a specific meaning and performs a certain function.'
