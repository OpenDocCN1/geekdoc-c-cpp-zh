    \ | Private | Protected | Protected |\n\n# ## 6.3 Types of Inheritance\n\nInheritance\
    \ in C++ can be done in various forms and combinations. There are six types of\
    \ inheritance that can be implemented to define relationships between various\
    \ classes.\n\n+   1. **Single Inheritance**\n\n*Single inheritance* is the most\
    \ basic type of inheritance, where there is only one parent and one child inherits\
    \ the properties. You can think of it as a stepladder with two steps connected\
    \ to one another. The syntax for single inheritance is as follows:\n\n```\nclass\
    \ parent\n{\n    // class body\n};\nclass child : accessMode  parent\n{\n    //\
