    \ class.\n\n# 4. Virtual Inheritance\n\n*Virtual inheritance* comes into play\
    \ when we have multiple inheritance, but the two classes inheriting from one super\
    \ class in different base classes have the same name. Now, the child of these\
    \ two base classes will have two copies of the super class methods from both the\
    \ parents, which is referred to as the *diamond problem*. The diamond problem\
    \ occurs when an object accessing a method by a name will get confused as to which\
    \ inherited method of the super class is being called. The solution to this problem\
    \ is using the virtual inheritance feature in C++, where the two parents inherit\
    \ virtually from the super class.\n\n![](img/4d9a4ae4efedabe01be6e6c44bad2dc1_130_0.png)\n\
