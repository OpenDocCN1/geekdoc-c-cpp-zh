    # Summary


    +   - An *exception* in programming is an abnormal condition at runtime that leads
    to either program termination or faulty execution.

    +   - *Errors* are illegal statements or functionalities the programmer might
    have used in their program.

    +   - Errors are beyond repair, but exceptions can be handled.

    +   - Exceptions are handled using a `try-catch` block where we can throw a particular
    exception.

    +   - A `try` block is used to throw an exception. We can check for conditions,
    and if they are met, the program throws an exception.

    +   - A `catch` block is used when an exception is thrown. What happens after
    catching the exception occurs in this block.

    +   - A `try` block is always followed by a `catch` block, and one `try` block
    can be followed by multiple catches.

    +   - There are standard exceptions programmers might face often, and these are
    part of the `std` library.

    +   - In C++ custom exceptions, we can inherit properties from the standard exception
    class and override its methods.'
