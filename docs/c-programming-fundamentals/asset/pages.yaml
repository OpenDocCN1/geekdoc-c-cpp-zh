    terms.


    # Files


    Files created in C++ help to store data onto the hard disk and remain in the system
    for later use. This is different from traditional programs, where our data or
    objects holding data get deleted after program termination to reclaim the temporary
    memory space allotted. Many times, we need our data to be securely stored in the
    system so fetching items out of a file requires less time.


