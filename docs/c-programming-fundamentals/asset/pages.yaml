    # 9.4  Differences Between Structure and Union


    Now that we have seen these two user-defined data types in C++, let us consider
    how the methods differ from one another. The following table will help learners
    determine when and where structure and union can be used in their C++ program.


    **Table 9.1 Structures & Unions Difference Table**


    | Structure | Union |

    |---|---|

    | Structure is a user-defined data type in C++ that groups different data types
    together. | Union helps us to group various objects and members of different types
    and bytes together. |

    | Memory allocation for a structure in C++ occurs contiguously. | Memory allocation
    for a union is determined by the largest member. |

    | Data members cannot be initialized inside a structure. This can be done by declaring
    a structure. | Data members can be initialized and overwritten if the value changes,
    as the same amount of memory space is affected. |

    | All data members are assigned a unique memory space in a structure. | All data
    members share the memory space equal to the member with the largest size. |'
