  md: "+   It has access to all data members of a class (including private), even\
    \ though it is a non-member function.\n\n+   Friend relationships cannot be inherited.\
    \ The syntax for a friend function is as follows:\n\n```\nclass OurClass\n{  \
    \  //body\n    friend returnType Myfunction(Paramters list...);\n};\n```\n\n#\
    \ Code: Using the Friend Function\n\n```\n#include <iostream>\nusing namespace\
    \ std;\nclass myclass\n{\n    friend int myfriend(int a, int b);\n};\nint myfriend(int\
    \ a, int b)\n{\n    return a+b;\n}\nint main()\n{\n    int a,b;\n    cout<<\"\
    Enter numbers to add\"<<endl;\n    cin>>a>>b;\n    cout<<\"Addition gives \"<<myfriend(a,b)<<endl;\n\
    \    return 0;\n}\n```\n\n# Output:\n\n```\nEnter numbers to add\n23\n567\nAddition\
    \ gives 590\n```\n\n# Code Debriefing\n\n+   This code shows how the friend function\
