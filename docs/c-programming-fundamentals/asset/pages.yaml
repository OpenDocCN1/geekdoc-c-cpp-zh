    for polymorphism, encapsulation, and inheritance. |

    | C does no data hiding and can be easily manipulated. | C++ encapsulation hides
    the data to ensure that data structures and operators are used as intended. |

    | Built-in data types are supported. | Built-in as well as user-defined data types
    are supported in C++. |

    | C is a function-driven language and more attention given to the function. |
    C++ is an object-driven language. |

    | The header file used is `stdio.h`. | `Iostream.h` is used in C++. |

    | C does not support function and operator overloading. It also does not have
    the namespace feature and reference variable functionality. | C++ supports both
    function and operator overloading; it has the namespace feature and reference
    variable functionality. |

    | Functions in C are not defined inside a structure. | Functions can be defined
    inside a structure. |

    | Reference variables are not supported in C. | Reference variables are supported
    in C++. |

    | The namespace feature is not available. | Namespaces provided by C++. |

    | The virtual and friend functions are not supported by C. | The virtual and friend
    functions are not supported by C++. |

    | Direct exception handling is not supported. | Exception handling is supported.
    |

    | Memory management occurs through the `malloc()` and `calloc()` functions | New
    and delete operators are used for memory allocation and deallocation. |


