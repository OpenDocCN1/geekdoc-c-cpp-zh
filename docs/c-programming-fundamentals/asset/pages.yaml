    # 7.4 Function Overriding and Overloading


    Now we move onto a type of polymorphism we will be using frequently and that is
    implemented through functions and their different states. (You should practice
    this concept by redefining the state and type of function you create and observe
    how the calling of these using objects takes place.)


    Table 7.2 Function overloading and overriding


    | Function Overloading | Function Overriding |

    |---|---|

    | Compile-time polymorphism implementation | Runtime polymorphism implementation
    |

    | No inheritance required | Inheritance is always required |

    | Function overloaded with the same name but different signatures | Function overridden
    with the same name and signatures |

    | Parameter type, number, and order can be changed | Parameter type, number, and
    order need not be changed |

    | Function call determined on the basis of signature done at compile time | Function
    call determined on the basis of signature done at runtime |

    | Overloading may occur multiple times | Overriding occurs only once in a C++
    program |'
