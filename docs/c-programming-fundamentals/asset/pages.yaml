- pgno: 271
  md: '# Summary


    +   - Files created in our C++ program help to store data onto the hard disk and
    remain in the system for later use.

    +   - In C++, for the user to enter and provide details or values, we use input
    streams. *A stream* references a group of bytes that can be accessed sequentially.

    +   - *Input streams* are used to hold the input from a user, such as a keyboard.

    +   - *Output streams* are used to showcase output by a monitor, file, or printer.

    +   - In C++ code, you need to include the `iostream` header file, which provides
    the program with a whole hierarchy of classes (multiple inheritance) to make use
    of all I/O classes.

    +   - The `iostream` class can handle both input and output streams, even if it
    is a user pressing random keys.

    +   - The `fstream` class can handle both input and output operations related
    to files opening and closing, like reading.

    +   - Opening a file is the first step taken toward file management in C++. It
    can be done either by passing a file name in the constructor when an object is
    created or using the `open()` method.

    +   - Writing to a file is done using the `ofstream` or `fstream` classes to enter
    data onto created or opened files.

    +   - Reading a file is done using the `ifstream` or `fstream` classes to fetch
    data from created or opened files.

    +   - Closing a file is the last, important step in file handling.

    +   - At program termination, memory is freed automatically. However, as to not
    take any chances to have an item leak, we should always close our files.

    +   - *Random file access* means the control is not given by default to the start
    or the end of the file, but at any point in the file. This is done using special
    file operations that assign the file pointer to the point we wish to access.'
