    \ the same name, but different signatures. That is, they have different combinations\
    \ and numbers of parameters.\n+   - While calling the display function, keep in\
    \ mind which signature calls which function.\n\n# 7.2 Dynamic vs. Static Binding\n\
    \nTable 7.1 Dynamic and static binding\n\n| Dynamic Binding | Static Binding |\n\
    |---|---|\n| Dynamic or late binding tells which procedure will be called at runtime.\
    \ | Static or early binding tells which procedure will be called at compile time.\
    \ |\n| The code inside our procedure is not known until execution, hence the name\
    \ late binding. | The code inside our procedure is known before execution, and\
    \ both join together at execution time, hence the name early binding. |\n| It\
    \ is implemented in C++ using virtual functions. | It is implemented in C++ using\
    \ normal function calls, function overloading, and operator overloading. |\n|\
    \ The execution of a program is slower. | The execution of a program is faster.\
    \ |\n| Runtime polymorphism is also another name for it. | Compile-time polymorphism\
    \ is also another name for it. |\n\n# Code: Static binding\n\n```\n#include <iostream>\n\
    using namespace std;\nclass person\n{\n    public:\n    int age;\n    void display1()\n\
    \    {\n        cout<<\"Enter your age\"<<endl;\n        cin>>age;\n    }\n```"
