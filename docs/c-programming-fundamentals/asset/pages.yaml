  md: "# 4.3  Casting and Passing Pointers\n\n# 4.3.1  Typecasting\n\nIn C++, we can\
    \ typecast our variables from one data type to another. We can do the same if\
    \ we wish to change the assigned data type using pointers. Let’s see an example\
    \ of how this is done. We use `reinterpret_cast`, which is a typecasting operator\
    \ that helps convert the pointer’s data type. All it does is change to a new type,\
    \ and it does not check if the data the pointer is pointing towards is the same\
    \ or not. Its syntax is as follows (here, one parameter is used as the pointer\
    \ variable and returns no value):\n\n```\ndata_type *var_name =\n        reinterpret_cast\
    \ <data_type *>(pointer_variable);\nReturn Type\n```\n\nHere are some important\
    \ functionalities of reinterpret_cast:\n\n+   - Special operator. It works only\
    \ when the pointer has the same data type.\n+   - Helps in casting into any other\
    \ legal data type\n+   - When bool is used, it will automatically be converted\
    \ into an integer equivalent, i.e., 1 signifies `true` and 0 signifies `false`.\n\
    +   - Mostly used when bits are on the center stage.\n\nNow consider the following\
    \ example:\n\n# Code: Use of reinterpret_cast\n\n```\n#include <iostream>\nusing\
    \ namespace std;\n\nint main()\n{\n    int* ptr = new int(69);\n    char* cr =\
    \ reinterpret_cast<char*>(ptr);\n    cout << *ptr << endl;\n    cout << *cr <<\
    \ endl;\n    cout << ptr << endl;\n    cout << cr << endl;\n    return 0;\n}\n\
    ```"
