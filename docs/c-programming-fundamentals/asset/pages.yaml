  md: '# Summary


    +   - Polymorphism allows for multiple forms of a method with different signatures
    but the same name.

    +   - Methods made can exist in multiple forms by varying in type of parameters
    and number of parameters they take in the signature of a function.

    +   - Dynamic or late binding tells which procedure will be called at runtime.

    +   - Static or early binding tells which procedure will be called at compile
    time.

    +   - C++ provides interfaces that lead to no direct implementation and only declare
    methods.

    +   - A *virtual function* is a type of function that is declared as well as defined
    in the parent or base class and redefined in the child class.

    +   - A *pure virtual function* is a type of function that is only declared but
    never implemented or redefined.

    +   - The abstract class (ABC) is a type of class that has only pure virtual functions.
    This means that it is only declared and never defined; this helps all child classes
    to inherit and redefine the members as they wish, too.

    +   - Function overloading is done by giving functions the same name but different
    signatures.

    +   - Function overriding is done by giving functions the same name and signatures.

    +   - A *friend* function is a non-member function of a class that has access
    as a normal function but is declared with the keyword `friend`.

    +   - Generic functions in C++ act as a template and use different types of parameters
    to give the desired results.

    +   - *Namespaces* logically organize identifiers (variables, methods, and classes)
    so they can be defined and declared under one name or a space.'
