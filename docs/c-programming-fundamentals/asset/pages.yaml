  md: "# 2. Multilevel Inheritance\n\n*Multilevel inheritance*, as the name suggests,\
    \ has multiple levels of property sharing. The bottom level does not directly\
    \ inherit the properties, but still can access all of the top levels’ data members.\
    \ You can think of it in terms of family relationships. This type of inheritance\
    \ is similar to how a grandchild often has a few features from his grandfather.\
    \ Objects created only for the grandchild will be able to access all of its preceding\
    \ classes. The syntax for multilevel inheritance is as follows:\n\n```\nclass\
    \ A\n{\n    // class body\n};\nclass B : accessMode A\n{\n    // class body\n\
    };\nclass C : accessMode B\n{\n    // class body\n};\n```\n\n![](img/4d9a4ae4efedabe01be6e6c44bad2dc1_125_0.png)\n\
