  md: '# Polymorphism


    # 7.1 Introduction


    Another important object-oriented programming concept is polymorphism. We briefly
    touched on it in the first chapter with the Formula 1 example. Polymorphism provides
    us with multiple forms of a method with different signatures but the same name.
    Methods can exist in multiple forms by varying the types of parameters and the
    number of parameters they take in the signature of a function. For example, in
    Formula 1 racing, there are 10 teams with 2 drivers each. Both drivers are provided
    with the same equipment and car specifications. However, the result attained by
    the drivers and their teams always differs as the car (which would be our programming
    method. has been modified into completely different styles: an F1 car can exist
    in different forms.


    ![](img/4d9a4ae4efedabe01be6e6c44bad2dc1_155_0.png)


    Figure 7.1 Polymorphism'
