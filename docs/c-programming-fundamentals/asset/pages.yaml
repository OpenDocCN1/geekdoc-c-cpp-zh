  md: '# Summary


    +   - Array is a data type in C++ to store similar data under the same name, and
    it is accessed using indexes.

    +   - All array elements are stored in contiguous memory locations.

    +   - The element at index 0 can also be said to be a pointer to the array name,
    and the array goes up to n-1.

    +   - An array passes through a function using only its name.

    +   - Enum is a user-defined data type.

    +   - Accessing each and every element by index is called traversing an array.

    +   - The elements of an array can be searched using a linear or binary algorithm.

    +   - An array of an arrays is called a multi-dimensional array.

    +   - A string in C++ is a data type that represents a collection of characters
    that is stored as a collection of bytes in contiguous memory locations.

