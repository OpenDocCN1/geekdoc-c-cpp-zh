    \n# ## 2.9 Defining Functions\n\nIn C++, many times, whole code blocks of 30-40\
    \ lines are repeated. When this occurs, we can use a *function*, which can accept\
    \ different inputs and process them with the same code to obtain different results.\
    \ If you recall our Formula 1 example, the teammates with different sets of skills\
    \ obtained completely different results; in this instance, the function is like\
    \ the engine (the common link) that is processed to yield two results.\n\n# ###\
    \ 2.9.1 Why Use Functions?\n\n+   - They reduce code redundancy: one single block\
    \ of code can be called upon many times, wherever it is needed.\n+   - Easy maintenance,\
    \ as only one location serves as the function’s “home.”\n+   - Modularity makes\
    \ code easy to understand and control.\n+   - Abstraction is supported, as library\
    \ functions can be used without the extra work of copying the whole function.\n\
    \nC++ has two types of functions: built-in or programmer-defined. In a programmer-defined\
    \ function, blocks of code for a specific task are given a unique name that is\
    \ used when the function is being invoked (called into action).\n\n# #### Function\
    \ Declaration\n\nThe *function declaration* introduces the function and what it\
    \ is capable of doing provided the necessary parameters. The compiler gets to\
    \ know the signature of the function and verifies when it is being called.\n\n\
    The syntax for this is as follows:\n\n```\nreturn_type function_name([ arg1_type\
    \ arg1_name, ... ]) { code }\n```\n\n# #### Passing Parameters to Functions\n\n\
    The parameters passed to a function are called actual parameters and the parameters\
    \ received by a function are called *formal parameters*."
