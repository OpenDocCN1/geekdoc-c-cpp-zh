  md: '# Structure and Union


    # 9.1 Structure: Declaration and Definition


    In C++, classes are one way for user-defined data types to exist. However, we
    can also use structure, which is a user-defined data type that groups different
    data types together. It can be viewed as an array that stores similar data types
    under one name. The way structure stores information is different from how a class
    stores it as by default all members of a structure are possessing public visibility
    while in a class default visibility if all members are private.


    # Features of Structure


    +   - Defined using the keyword `struct` and members access it using the name.

    +   - Memory allocation for a structure in C++ occurs contiguously.

    +   - It has data members and functions that are similar to the variables and
    functions used elsewhere in C++.

    +   - Data members cannot be initialized inside a structure.

    +   - Initialization of members can be done using curly braces.

    +   - Accessing of members is done using the selector or dot operator.'
