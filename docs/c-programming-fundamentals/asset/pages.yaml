  md: "# Algorithm for a Binary Search\n\n+   1. Start.\n+   2. Take the size and\
    \ element input from the user if the array is not given.\n+   3. Input the search\
    \ element from the user.\n+   4. Call the binary search function and pass the\
    \ array, size, `firstindex`, and `lastindex`.\n+   5. Execute the nested if loop\
    \ search element == `array[mid]` or < `array[mid]` or > `array[mid]`.\n+   6.\
    \ If the result is true, then the match is found, return mid.\n+   7. If the result\
    \ is false, then return 0 and exit the loop.\n+   8. Stop.\n\n# Code: An Example\
    \ of a Binary Search\n\n```\n```cpp\n#include<iostream>\nusing namespace std;\n\
    int binarySearch(int array[], int a, int b, int s) {\n    if (a <= b) {\n    \
    \    int mid = (a + b)/2;\n        if (array[mid] == s)\n            return mid;\n\
    \        if (array[mid] > s)\n            return binarySearch(array,a, mid-1,\
    \ s);\n        if (array[mid] < s)\n            return binarySearch(array, mid+1,\
    \ b, s);\n    }\n    return 0;\n}\nint main(void) {\n    int array[] = {23,67,45,11,33,44,55};\n\
    \    int size = sizeof(array)/sizeof(array[0]);\n    int s;\n    cout << \"Enter\
    \ the element to search: \\n\";\n    cin >> s;\n    int flag = binarySearch (array,\
    \ 0, size-1, s);\n    if(flag){\n        cout<< s <<\" found at index \"<< flag\
    \ <<\"\\n\";\n    }else{\n        cout<< s <<\" is not in the array sorry!\";\n\
    \    }\n```\n\n```"
