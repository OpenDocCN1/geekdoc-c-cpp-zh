    \ is always the issue of a memory leak if deallocation not handled carefully.\
    \ |\n\n## Summary\n\n- A pointer holds the address of the very first byte of the\
    \ memory location where it is pointing.\n- This first byte address is called the\
    \ *base address*, and it is like a variable to store the address of another variable.\n\
    - The & (ampersand) is used to make reference to the memory location of another\
    \ variable.\n- A pointer needs to be dereferenced with the * (asterisk) to declare\
    \ a variable of type pointer.\n- `interpret_cast` is a typecasting operator provided\
    \ to us in C++ that helps convert the pointer’s data type.\n- A NULL or zero pointer\
    \ points towards an address that is not legal and null.\n- Passing a pointer to\
    \ a function can be done in two ways: either by passing a value or by passing\
    \ its reference.\n- When passing by value, the copies of pointers are passed as\
    \ arguments and the changes are reflected in the original variables.\n- When passing\
    \ by reference, the addresses are directly passed as arguments, hence the changes\
    \ are permanent.\n- Pointers also help to access array elements by either the\
    \ base element reference or the array pointer assigned.\n- Pointers in C++ have\
    \ a wide range of use and help perform many tasks with ease.\n\n## Exercises\n\
    \n### Theory Questions\n\n1. Define a pointer and how it works in C++.\n2. How\
    \ are pointers declared and initialized?\n3. What is the usage of the pointer\
