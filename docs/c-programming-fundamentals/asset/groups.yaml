    \ Sainz\nName: Carlos\n```\n\n## 3.5 字符串函数\n\nC++ 字符串类提供了大量用于处理字符串的函数，如下表所示。\n\
    \n**表 3.1** 字符串函数的语法与功能\n\n| 函数语法 | 功能 |\n|---|---|\n| `strcat(char_arr1, char_arr2);`\
