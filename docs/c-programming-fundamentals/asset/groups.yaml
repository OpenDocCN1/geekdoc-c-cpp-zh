    \        {\n                return avgSal;\n        }\n        int pub()\n   \
    \     {\n                return agep;\n        }\n};\n\nint main()\n{\n      \
    \  ProtectChild obj1;\n        cout << \"\\nPrivate : adhar number digit is inaccessible\
