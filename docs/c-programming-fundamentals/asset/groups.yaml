    \ help check address validity in C++?\n8. List some drawbacks of using pointers.\
    \ Support your reasons with examples.\n9. What is the difference between a reference\
    \ and a pointer in C++?\n\n### Practical Questions\n\n1. Write a program to print\
    \ the address of a variable and input its value from the user.\n2. Write a program\
