    # Exceptions in C++ are broadly divided into two types:


    +   1. **Synchronous**: This type of exception can only arise from the throw statements.
    For example, accessing an index element that the array might not have termed an
    array index generates an out of bounds exception.

    +   2. **Asynchronous**: This type of exception includes keyboard or input interrupts
    while a program is being executed and disrupts the natural flow of the C++ code.
    These exceptions are not handled directly but are managed using the signal concept.


