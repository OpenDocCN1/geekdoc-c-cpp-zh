    \ 也是一个变量，因为它没有使用解引用符号。\n- 2. 接下来，声明了两个指针变量 `ptr1` 和 `ptr2`，并且只为 `ptr1` 指针分配了 value\
    \ one 和 value two 的地址。\n- 3. 然后，整数 `ptr3` 的值为给定值。\n- 4. 所有地址和值都将被打印出来。\n\n####\
    \ 输出：\n\n```text\nValue one = 10\nValue one address = 0x308cd65e4\nValue two =\
