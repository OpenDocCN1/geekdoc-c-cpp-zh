    \ is a protected member of 'Parent'\n    c.p3=56;\n      ^\n\ninherit.cpp:16:9:\
    \ note: declared protected here\n    int p3;\n        ^\n```\n\n请仔细研究给出的代码片段，以及当我们尝试在派生类调用中访问声明为私有（private）和保护（protected）的数据成员时所产生的错误。\n\
    \n### 6.2.2 继承方式\n\n- 1. **公有：** 如果一个类以公有方式继承，那么基类中为数据成员定义的访问权限在派生类中也会保持不变。也就是说，公有成员具有公有访问权限，私有成员具有私有访问权限，保护成员具有保护访问权限。这是一种常用的继承访问方式。\n\
    \n### 代码：提供对数据的访问\n\n```cpp\n#include <iostream>\nusing namespace std;\nclass\
    \ parentc\n{\n    public :\n        int age=52;\n    protected :\n        int\
    \ avgSal= 43000;\n    private :\n        int adharDigit=876;\n\n};\nclass PublicChild\
    \ : public parentc\n{\n    public:\n    int pro()\n    {\n        return avgSal;\n\
    \    }\n};\n```\n\n"
