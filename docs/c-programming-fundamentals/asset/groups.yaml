    \n## 数组与字符串\n\n### 3.1 什么是数组？\n\n*数组*就像一个存储设施：它允许你将相似的数据类型保存在同一个“屋檐”下，并用一个名称来标识。存储在数组中的项可以是整数、字符和字符串。无论你想把什么分组在一起，都可以使用数组。让我们看看如何声明和初始化它们。\n\
    \n#### 3.1.1 声明数组的方式\n\n- `Datatype array_name[array_size];` 通过给定大小来声明\n- `Datatype\
    \ array_name[]={element1, ele2..};` 通过初始化元素来声明\n- `Datatype array_name[array_size]={element1,\
    \ ele2..};` 通过初始化元素和大小来声明\n- `Datatype array_name[array_index]= ele3;` 将元素赋值给特定索引\n\
    \n这里，使用了 `[ ]` 下标运算符，以便编译器知道这是一个数组；其后是相同类型的元素，索引从 0 开始（即任何数组的第一个元素总是被赋给索引 0，即\
    \ `arr[0]`，数组的最后一个索引是 n-1，其中 n 表示元素总数）。让我们看一个例子。尝试将数组想象成一列旅客列车，有三节车厢，依次排列，票号从\
    \ 0 到 2。名为 `Train` 的数组有三个车厢，索引如图 3.1 所示。\n\n![](img/4d9a4ae4efedabe01be6e6c44bad2dc1_60_0.png)\n\
    \n#### 3.1.2 访问数组成员的方式\n\n- 存储在连续内存位置中的数组元素也按顺序访问。\n- 索引对于提取特定元素很重要。\n- 索引为 0\
    \ 的元素也可以说是数组名称的*指针*。\n- 如果你使用静态/固定数组，则使用 `index[n-1]` 提取最后一个元素。\n- 对于动态数组，大小在运行时确定，因此使用\
    \ `array.length()` 方法来确定确切的大小和索引。\n\n**代码：列车和车厢数组示例**\n\n```cpp\n#include <iostream>\n\
    int main()\n{\n        int train[3]={10,11}; // 声明三节车厢\n        train[2]= 12;\n\
    \        std::cout << \"\\nElements in Train are\\n\";\n        std::cout << \"\
    Elements 1: \"<<train[0];\n        std::cout << \"\\nElements 2:\"<<train[1];\n\
    \        std::cout << \"\\nElements 3: \"<<train[2];\n        return 0;\n}\n```\n\
    \n**输出：**\n\n```text\nElements in Train are\nElements 1: 10\nElements 2: 11\n\
    Elements 3: 12\n```\n\n#### 3.1.3 遍历一维数组\n\n这里，*1D* 指的是一维数组，你可以使用 `for` 和 `while`\
    \ 循环语句轻松遍历它以访问和获取数组元素，并允许用户在特定索引处输入数组元素。\n\n**代码：创建一维数组**\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n\n    int num_array[6];\n  \
    \  cout << \"Enter six numbers: \" << endl;\n    for (int i = 0; i < 6; ++i)\n\
    \    {\n        cin >> num_array[i];//从用户处获取元素\n    }\n    cout << \"The numbers\
    \ are: \";\n    for (int j = 0; j < 6; ++j) {\n        cout << num_array[j] <<\
    \ \" \";// 显示用户数组\n    }\n\n    return 0;\n}\n```\n\n**输出：**\n\n```text\nEnter\
    \ six numbers:\n12\n79\n45\n33\n11\n23\nThe numbers are: 12  79  45  33  11  23\n\
    ```\n\n### 3.2 数组上的操作\n\n#### 3.2.1 将数组传递给函数\n\n函数非常有用，但你可以传递不需要的数组元素，这会产生一个问题：想象一下传递数千个这样的元素！你可以通过只传递数组名称来避免这种情况，数组名称充当指向第一个元素和整个数组的指针。确保函数签名通过以下方式之一表明它是一个数组非常重要：\n\
    \n- `int func(int array_name[]){ //函数体 }`\n- `int func(int array_name[array_size]){\
    \ //函数体 }`\n- `int func(int *array_name){ //函数体 }`\n\n**代码：传递数组**\n\n```cpp\n\
    #include <iostream>\n\nint coach (int train[], int s)\n{\nint i,price=0;\nfor(\
    \ i = 0; i < s; i++)\nprice += train [i];\nreturn price;\n}\nint main ( )\n{\n\
    int price,s;\nint train[3]={1050,1100};\n\nstd::cout << \"How many passengers\
    \ \";\nstd::cin >> s;\nprice = coach (train, s);\nstd::cout << \"\\nYour bill\
    \ is:\"<<price;\nreturn 0;\n}\n```\n\n**输出：**\n\n```text\nHow many passengers\
    \ 3\n\nYour bill is: 2150\n```\n\n#### 3.2.2 查找长度\n\n确定用户输入的动态数组的确切长度非常重要，因为大小可能在程序中途发生变化。\n\
    \n"
