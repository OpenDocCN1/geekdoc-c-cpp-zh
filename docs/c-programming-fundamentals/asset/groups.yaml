  mdcn: "\n- 注意，整个结构体的大小会发生变化，就像在类中一样。\n- 代码显示了所做的更改。\n\n## 9.3 联合体（Union）\n\n联合体是\
    \ C++ 中另一种用户自定义数据类型。联合体将各种不同类型的对象和成员组合在一起。结构体和联合体在语法上可能看起来很相似，但它们在成员的内存分配上有所不同。联合体会为数据变量分配内存空间，该空间大小等于该联合体中占用空间最大的数据变量的大小。\n\
    \n联合体的语法如下：\n\n```cpp\nunion UnionName\n{\n    //members\n};\n```\n\n### 特性\n\n\
    - 使用关键字 `union` 定义，成员通过点运算符访问。\n- 联合体的内存分配由最大的成员决定。\n- 它拥有与 C++ 中其他地方使用的变量和函数类似的数据成员和函数。\n\
    - 数据成员可以被初始化，并且如果值发生变化，由于同一内存空间会受到影响，因此可以被覆盖。\n- 成员通过选择运算符或点运算符来访问。\n- 在 C++ 中，指向联合体的指针按如下方式使用：`->`。\n\
    \n### 代码：使用联合体\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nunion OurUnion\
    \ {\n    int x;\n    char c;\n};\n\nint main()\n{\n    union OurUnion u1;\n  \
    \  u1.x = 85;\n    u1.c = 'H';\n    cout << \"The value is : \" << u1.x << endl;\n\
    \    cout << \"The value is : \" << u1.c << endl;\n    cout << \"Size of union\
    \  : \" << sizeof(u1) << endl;\n    return 0;\n}\n```\n\n### 输出：\n\n```text\n\
    The value is : 72\nThe value is : H\nSize of union : 4\n```\n\n### 代码解读\n\n- 在这段代码中，我们用几个变量创建了一个联合体。\n\
    - 然后创建联合体的对象来访问成员。\n- 可以观察到，整个联合体的大小会发生变化，这与结构体类似。\n- 代码显示了所做的更改。\n\n### 代码：联合体数据类型的实现\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nunion OurUnion {\n    int\
    \ x;\n    char c;\n    char name[12];\n};\n\nint main()\n{\n    union OurUnion\
    \ u1;\n    u1.x = 8588;\n    u1.c = 'H';\n\n    union OurUnion u2;\n    u2.x =\
    \ 590;\n    u2.c = 'S';\n\n    cout << \"The value is x : \" << u1.x << endl;\n\
    \    cout << \"The value is c : \" << u1.c << endl;\n    cout << \"Size of union\
    \  : \" << sizeof(u1) << endl;\n    cout << \"The value is x : \" << u2.x << endl;\n\
    \    cout << \"The value is c : \" << u2.c << endl;\n    cout << \"Size of union\
    \  : \" << sizeof(u2) << endl;\n\n    return 0;\n}\n```\n\n### 输出：\n\n```text\n\
    The value is x : 8250\nThe value is c : H\nSize of union : 12\nThe value is x\
    \ : 595\nThe value is c : S\nSize of union : 12\n```\n\n### 代码解读\n\n- 在这段代码中，我们用几个变量创建了一个联合体，并使用点运算符为成员赋值。\n\
    - 然后创建联合体的对象来访问成员。\n- 可以观察到，整个联合体的大小会发生变化，这与结构体类似。\n- 代码显示了所做的更改。\n\n## 9.4 结构体与联合体的区别\n\
    \n既然我们已经了解了 C++ 中这两种用户自定义数据类型，下面来看看它们之间有何不同。下表将帮助学习者在 C++ 程序中判断何时何地可以使用结构体和联合体。\n\
    \n**表 9.1 结构体与联合体区别表**\n\n| 结构体 | 联合体 |\n|---|---|\n| 结构体是 C++ 中一种用户自定义数据类型，它将不同的数据类型组合在一起。\
    \ | 联合体帮助我们将各种不同类型的对象和成员组合在一起。 |\n| C++ 中结构体的内存分配是连续的。 | 联合体的内存分配由最大的成员决定。 |\n\
    | 数据成员不能在结构体内部初始化。可以通过声明结构体来完成初始化。 | 数据成员可以被初始化，并且如果值发生变化，由于同一内存空间会受到影响，因此可以被覆盖。\
    \ |\n| 在结构体中，所有数据成员都被分配独立的内存空间。 | 在联合体中，所有数据成员共享一块等于最大成员大小的内存空间。 |\n| 结构体的所有数据成员都可以被初始化。\
    \ | 联合体只能初始化第一个数据成员。 |\n| 结构体的所有数据成员可以同时被访问。 | 联合体的数据成员一次只能访问一个。 |\n\n## 9.5 C++\
