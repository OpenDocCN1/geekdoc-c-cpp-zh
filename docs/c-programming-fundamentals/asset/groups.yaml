    are also binary operators.

    +   - *Ternary operators* work on three operands.


    C/C++ has many built-in operators and can be classified into 6 types:


    +   1. **Arithmetic operators** are simple and well-known (`+`, `-`, `*`, `/`,
    `%`, `++`, `--`). Here, `%` does not mean “percentage,” but “modulus.”

    +   2. **Relational operators** are used for the comparison of the values of two
    operands (i.e., to check equivalence using greater than or less than, such as
    `==`, `>=`, and `<=`).

    +   3. **Logical operators** are used check for conditions/constraints or complements,
    giving a result as either true or false in binary 1 or 0.

    +   4. **Bitwise operators** are used to perform bit-level operations on operands.
    Any operands you have must first be converted to bit form before applying logic
    such as AND or OR.

    +   5. **Assignment operators** are used to assign value to a variable.

    +   6. **Other operators** can be used, such as `sizeof`, which finds the size
    of datatypes.


    Remember the BODMAS rule: Brackets, Orders, Division, Multiplication, Addition,
    and Subtraction. The compiler follows the order shown in Table 2.2. Two types
    of precedence occur in C++ when you encounter an operator i.e. Precedence and
    Associativity. Here precedence of operator is increasing from bottom to top of
    the table 2.2 and associativity is referred when two operators of same precedence
    occur in an expression.


    **Table 2.2** Types Of Operators with Precedence and Associativity


    | Type | Operator | Associativity |

    |---|---|---|

    | Postfix | `()` `[]` `->` `.` `++` `--` | Left to right |

    | Unary | `+` `-` `!` `~` `++` `--` `(type)*` `&` `sizeof` | Right to left |

    | Multiplicative | `*` `/` `%` | Left to right |

    | Additive | `+` `-` | Left to right |

    | Shift | `<<` `>>` | Left to right |

    | Relational | `<` `<=` `>` `>=` | Left to right |

    | Equality | `==` `!=` | Left to right |'
