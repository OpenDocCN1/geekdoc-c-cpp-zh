    \ 7 月，*https://sillycodes.com*\n\n## 多态性\n\n### 7.1 简介\n\n另一个重要的面向对象编程概念是多态性。我们在第一章中通过一级方程式（Formula\
    \ 1）的例子简要提到过它。多态性使我们能够以不同的签名但相同的名称，让一个方法拥有多种形式。方法可以通过改变参数的类型和函数签名中参数的数量，来以多种形式存在。例如，在一级方程式赛车中，有\
    \ 10 支车队，每队有 2 名车手。两名车手配备相同的设备和赛车规格。然而，车手及其车队取得的结果总是不同，因为赛车（也就是我们的编程方法）已经被改造成完全不同的风格：一辆\
    \ F1 赛车可以以不同的形式存在。\n\n![](img/4d9a4ae4efedabe01be6e6c44bad2dc1_155_0.png)\n\n\
    图 7.1 多态性\n\n多态性主要有两种类型：编译时多态性和运行时多态性。（它们还有子类别，其实现方式将在后面讨论。）\n\n![](img/4d9a4ae4efedabe01be6e6c44bad2dc1_156_0.png)\n\
    \n图 7.2 多态性类型\n\n让我们看一个 display 函数重载以及多态性如何工作的示例。这里的语法与我们之前学过的函数语法相同。\n\n### 代码：使用多态性和函数重载\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nvoid display(int i)\n{\n\
    \    cout << \" Integer  is \" << i << endl;\n}\nvoid display(double f)\n{\n \
    \   cout << \"Float is \" << f << endl;\n}\nvoid display(char const *c)\n{\n \
