    ### 输出：\n\n```text\nHello  Programmer\n```\n\n## 2.2 基于流的IO\n\n在C++中，用户输入值需要使用输入流；这里，我们用术语*流*（stream）来表示可以按顺序访问的一组字节。流有两种不同的类型。*输入流*用于保存来自用户的输入，例如来自键盘的信息。例如，用户可能在键盘上按键，所有这些击键都会被保存到输入流中，以便程序之后需要时使用。*输出流*用于通过显示器、文件或打印机展示输出。例如，你可能需要打印输出，但打印机\n\
    \n```cpp\nint main() {\n    char ch='A';\n    int a = 9,b=10,c;\n    cout << \"\
    Value as output is :  \" << ch<< a+b<<endl;\n    cout<< \"Enter your input integer\
    \ \"<<endl;\n    cin>>c;\n    cout<< \"You entered  \"<<c<<endl;\n}\n```\n\n###\
    \ 输出：\n\n```text\nValue as output is: A19\nEnter your input integer\n3\nYou entered\
    \ 3\n```\n\n### 代码：输入/输出流的使用\n\n```cpp\n#include <iostream>\n\nusing namespace\
    \ std;\n\nint main() {\n    char ch='A';\n    int c;\n    cout<< \"\\nEnter your\
    \ input integer \"<<endl;\n    cin>>c;\n    cout<< \"\\nYou entered  \"<<c<<endl;\n\
    \    cerr <<  \"Error message :  \" << ch << endl;\n    clog <<  \"Error message\
    \ :  \" << c << endl;\n}\n```\n\n### 输出：\n\n```text\nEnter your input integer\n\
    45\n\nYou entered 45\nError message : A\nError message : 45\n```\n\n## 2.3 注释\n\
    \n在程序中添加注释有助于你跟踪程序的工作方式；程序注释也可以作为将来参考的笔记。\n\n- *二元运算符*（Binary operators）接受两个操作数，就像数学方程中我们需要6和7的和一样。插入运算符（`<<`）和提取运算符（`>>`）也是二元运算符。\n\
    - *三元运算符*（Ternary operators）作用于三个操作数。\n\nC/C++ 有许多内置运算符，可以分为6类：\n\n1. **算术运算符**是简单且众所周知的（`+`、`-`、`*`、`/`、`%`、`++`、`--`）。这里，`%`不是“百分比”的意思，而是“取模”。\n\
    2. **关系运算符**用于比较两个操作数的值（即使用大于或小于来检查相等性，例如`==`、`>=`和`<=`）。\n3. **逻辑运算符**用于检查条件/约束或补集，结果为真或假，即二进制1或0。\n\
    4. **按位运算符**用于对操作数执行位级操作。在应用诸如AND或OR之类的逻辑之前，必须先将要操作的操作数转换为位形式。\n5. **赋值运算符**用于给变量赋值。\n\
    6. **其他运算符**也可使用，例如`sizeof`，它可以查找数据类型的大小。\n\n记住BODMAS规则：括号（Brackets）、指数（Orders）、除法（Division）、乘法（Multiplication）、加法（Addition）和减法（Subtraction）。编译器遵循表2.2所示的顺序。在C++中，当你遇到运算符时，会出现两种优先级：优先级（Precedence）和结合性（Associativity）。这里运算符的优先级从表2.2的底部到顶部递增，当表达式中出现两个相同优先级的运算符时，使用结合性。\n\
    \n**表2.2** 带优先级和结合性的运算符类型\n\n| 类型 | 运算符 | 结合性 |\n|---|---|---|\n| 后缀 | `()` `[]`\
    \ `->` `.` `++` `--` | 从左到右 |\n| 一元 | `+` `-` `!` `~` `++` `--` `(type)*` `&`\
    \ `sizeof` | 从右到左 |\n| 乘法 | `*` `/` `%` | 从左到右 |\n| 加法 | `+` `-` | 从左到右 |\n| 移位\
    \ | `<<` `>>` | 从左到右 |\n| 关系 | `<` `<=` `>` `>=` | 从左到右 |\n| 相等 | `==` `!=` |\
    \ 从左到右 |\n| 按位与 | `&` | 从左到右 |\n| 按位异或 | `^` | 从左到右 |\n| 按位或 | `\\|` | 从左到右 |\n\
    | 逻辑与 | `&&` | 从左到右 |\n| 逻辑或 | `\\|\\|` | 从左到右 |\n| 条件 | `?:` | 从右到左 |\n| 赋值 |\
    \ `= += -= *= /= %= >>= <<= &= ^= \\|=` | 从右到左 |\n| 逗号 | `,` | 从左到右 |\n\n### 代码：算术运算符的使用\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n\n    int\
    \ a, b;\n    a = 78;\n    b = 25;\n    cout << \"a + b = \" << (a + b) << endl;\n\
    \    cout << \"a - b = \" << (a - b) << endl;\n    cout << \"a * b = \" << (a\
    \ * b) << endl;\n    cout << \"a / b = \" << (a / b) << endl;\n    cout << \"\
    a % b = \" << (a % b) << endl;\n\n    return 0;\n}\n```\n\n### 输出：\n\n```text\n\
    a + b = 103\na - b = 53\na * b = 1950\na / b = 3\na % b = 3\n```\n\n## 2.5 类型转换\n\
    \n将值从一种类型转换为另一种类型的过程称为*类型转换*（type conversion）；类型转换有两种：隐式转换和显式转换。\n\n### 隐式转换\n\
    \n- 由编译器自行智能完成，无需用户任何帮助。\n- 例如，如果某个数据类型接受了与当前值不同的新值，编译器会将其升级调整为新值，而不会给出任何错误。\n\
    \n### 代码：隐式转换\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\
    \ {\n    int a = 34; // integer type\n    char b = 'a'; // character type\n  \
    \  a = a + b; // seems illegal but\n    float c = a + 1.0;\n    cout << \"a =\
    \ \" << a << endl\n         << \"b = \" << b << endl\n         << \"c = \" <<\
    \ c << endl;\n\n    return 0;\n}\n```\n\n### 输出：\n\n```text\na = 131\nb = a\n\
    c = 132\n```\n\n### 显式转换\n\n- 它允许我们明确告诉编译器将值从一种类型转换为另一种类型，任何错误都由我们自己负责。\n- 我们将使用\
    \ `static_cast` 运算符：`static_cast<new_type>(expression)`。\n\n### 代码：显式转换\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main()\n{\n    double d = 1.6;\n\
    \    int sum = (int)d + 5;\n    cout << \"Sum = \" << sum;\n    return 0;\n}\n\
    ```\n\n### 输出：\n\n```text\nSum = 6\n```\n\n## 2.6 关键字\n\n*关键字*（Keywords）是具有特殊含义的保留字。因此，它们不能在C++程序中用于其他目的。C++预留了92个关键字。\n\
    \n以下是所有C++关键字的列表。\n\n```text\nalignas\nalignof\nand\nand_eq\nasm\nauto\nbitand\n\
    bitor\nbool\nbreak\ncase\ncatch\nchar\nchar8_t (since C++20)\nchar16_t\nchar32_t\n\
    class\ncompl\nconcept (since C++20)\nconst\nconsteval (since C++20)\nconstexpr\n\
    constinit (since C++20)\nconst_cast\ncontinue\nco_await (since C++20)\nco_return\
    \ (since C++20)\nco_yield (since C++20)\ndecltype\ndefault\ndelete\ndo\ndouble\n\
    dynamic_cast\nelse\nenum\nexplicit\nexport\nextern\nfalse\nfloat\nfor\nfriend\n\
    goto\nif\ninline\nint\nlong\nmutable\nnamespace\nnew\nnot\nnot_eq\nnullptr\noperator\n\
    or\nor_eq\nprivate\nprotected\npublic\nregister\nreinterpret_cast\nrequires (since\
    \ C++20)\nreturn\nshort\nsigned\nsizeof\nstatic\nstatic_assert\nstatic_cast\n\
    struct\nswitch\ntemplate\nthis\nthread_local\nthrow\ntrue\ntry\ntypedef\ntypeid\n\
    typename\nunion\nunsigned\nusing\nvirtual\nvoid\nvolatile\nwchar_t\nwhile\nxor\n\
    xor_eq\n```\n\n"
