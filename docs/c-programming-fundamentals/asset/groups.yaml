    - 索引为 +1，可根据需求进行更改。\n\n## 实践练习\n\n1. 编写一个 C++ 程序，用于处理录取报告。使用一个结构体，其中包含表示学号、姓名、出生日期（使用嵌套结构体）和分配专业等信息的元素。处理结构体成员的函数必须是结构体的一部分。报告格式如下：\n\
