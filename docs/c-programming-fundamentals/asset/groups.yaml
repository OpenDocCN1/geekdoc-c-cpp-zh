    \n## Classes in C++\n\n### 5.1 Class Making\n\nWe talked briefly about what a\
    \ class is and how in object-oriented programming, we build up from this basic\
    \ unit. A class is a user-defined data type consisting of methods and data grouped\
    \ together as members (i.e., encapsulated). A class uses objects that store data\
    \ and have a defined state and behavior; it is also referred to as an *instance\
    \ of a class*. A class is like a broad category that encompasses some entities\
    \ that have similar attributes or features. For example, a cat and a tiger have\
    \ similarities and belong to the *Felidae* animal family. In this example, *Felidae*\
    \ is the name of the class and cats and tigers are the class members. The following\
    \ code shows how we declare and use classes in C++.\n\n### Code: Declaring and\
    \ Using Classes\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nclass\
    \ Felidae\n{\n    public:\n    string cats;\n    string tigers;\n\n    void petName()\n\
    \    {\n        std::cout << \"\\nCat's pet name is: \" << cats;\n        std::cout\
    \ << \"\\nTiger's pet name is: \" << tigers;\n    }\n};\n\nint main()\n{\n   \
    \ Felidae object1;\n\n    object1.cats = \"checo\";\n    object1.tigers = \"maxial\"\
    ;\n    object1.petName();\n\n    return 0;\n}\n```\n\n**Output:**\n\n```text\n\
    Cat's pet name is: checo\nTiger's pet name is: maxial\n```\n\nLet’s take a look\
    \ into how this code works. Try to predict the execution flow to improve your\
    \ understanding.\n\n1. Although `main` is the typical entry point of execution\
    \ in a C++ program, here we have declared a class `outside` `main`. It is possible\
    \ to declare a class either outside or inside `main`.\n\n2. Class `Felidae` is\
    \ defined with the keyword `class` and members `cats` and `tigers` are strings\
    \ with the `petName` function.\n\n3. We observe that access specifiers in a class\
    \ are defined by labels, where public members are accessible to all and private\
    \ members are only available to the class methods.\n\n4. In `main`, we have taken\
    \ two objects and accessed the members using the dot operator, and then assigned\
    \ names to them.\n\n5. One object accesses all data members of the class, so we\
    \ can create as many objects as we need.\n\n### Class naming tips\n\n- Start with\
    \ a capital letter and give the class a name that makes sense.\n- Assign objects\
    \ a name that makes it clear what they are for.\n- You can use symbols, such as\
    \ an underscore, in class names.\n\n### Code: Working with Classes\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nclass MyClass\n{\n    public:\n \
    \   int x = 40, y;\n\n    void sum()\n    {\n        std::cout << \"\\nSum is:\
    \ \" << x + y;\n    }\n};\n\nint main()\n{\n    MyClass c1;\n    MyClass c2, c3;\n\
    \n    c1.y = 10;\n    c2.y = 20;\n\n    c1.sum();\n    c2.sum();\n\n    return\
    \ 0;\n}\n```\n\n**Output:**\n\n```text\nSum is: 50\nSum is: 60\n```\n\n### 5.2\
    \ Constructors and Destructors\n\nA class in C++ has data members, like variables\
    \ of different types and methods (functions). In addition to these, there is another\
    \ special member function called a *constructor*, whose main role is to initialize\
    \ a class and construct the value of all data members without accessing and calling\
    \ all the functions with the object as we did before. Destructors involve “breaking”\
    \ or eliminating the objects created by the constructor so as to not overload\
    \ the computer’s limited memory.\n\n**Characteristics of Constructors:**\n\n1.\
    \ It has the same name as the class\n2. They can be made accessible on a public,\
    \ private, or protected level.\n3. They cannot be inherited or instanced by any\
    \ other class.\n4. The default constructor is called whenever an object is created.\n\
    5. In C++, constructors cannot be declared as virtual.\n6. They have no return\
    \ type.\n\n### Code: Using Constructors and Destructors\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nclass Driver\n{\n    public:\n    Driver()\n    {\n  \
    \      std::cout << \"\\nThis is a constructor of class Driver\\n\" << endl;\n\
    \    }\n};\n\nint main()\n{\n    Driver d1;\n    return 0;\n}\n```\n\n**Output:**\n\
    \n```text\nThis is a constructor of class Driver\n```\n\nObserve that as soon\
    \ as the object is created, the constructor of the class is called upon, as it\
    \ has the ability to be overloaded. Let us now define the various types of constructors.\n\
    \n### Types of Constructors in C++\n\nC++ provides us with three types of constructors,\
    \ each a little different. These types are as follows.\n\n1. **Default Constructors**\n\
    \n   These take up no arguments and all objects of the class are initialized with\
    \ the same set of values. These are given by the compiler, and they will be 0\
    \ or any integer value. If the programmer forgets to define a constructor explicitly\
    \ in C++, the compiler will provide them with the default constructor implicitly.\
    \ The syntax for writing the default constructor is as follows:\n\n   ```cpp\n\
    \   class class_name\n   {\n       class_name()\n       { //body\n       }\n \
    \  };\n   ```\n"
