    # 2. Data Abstraction


    *Abstraction* involves fetching only the relevant data to the user and hiding
    any other details. Consider an example where you go to a restaurant and place
    your order. You sometimes get an order number to pick up your food when the number
    is called. You are not concerned with the tools or number of employees working
    to make your meal or their details. Relevant information sharing saves time and
    memory, and this protects our data.


    We can implement abstraction in C++ using classes to group data members and member
    functions together. This approach will determine which data member will be accessible
    to which extent to other entities in our program.


    # 3. Polymorphism


    *Polymorphism* provides us with multiple forms of a method with different signatures
    but the same name. There are two types: runtime polymorphism and compile-time
    polymorphism, both of which are implemented in C++ using method overloading and
    over-riding. Methods can exist in multiple forms by varying the type of parameters
    and number of parameters they take in the signature of the function. When these
    methods used with same name but different signature it is called overloading and
    when used with same name as well as signature is called over-riding.


    Let’s consider the following example:


    In Formula 1 Racing, there are 10 teams with 2 drivers each, and the drivers are
    provided with the same equipment and car specifications. However, the result attained
    by both drivers for their teams always differs as the “method” (the car) has been
    “overloaded” in completely different ways (that is, the F1 car exists in different
    forms).


