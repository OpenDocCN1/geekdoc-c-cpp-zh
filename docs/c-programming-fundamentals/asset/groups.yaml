  mdcn: "\n\n## 中文日报\n\n欢迎阅读《中文日报》，这里为您提供来自世界各地的新闻和资讯。\n\n在今天的版面上，我们将报道全球经济的最新动态、科技创新和文化亮点。\n\
    \n通过我们驻外记者的全面报道和深度分析，随时掌握最新资讯。\n\n## C++ 与超越\n\n### 引言\n\n在本章中，你将熟悉 C++ 的基础知识。C++\
    \ 是一种强大的编程语言，语法和概念简单易懂，深受开发者喜爱。许多电子游戏、嵌入式系统、物联网设备和资源密集型 AI 应用都使用 C++。C++ 是一种通用、跨平台的语言，提供了庞大的库集合，帮助你轻松编程。让我们开始吧。\n\
    \n### 1.1 C++ 的起源\n\n1980 年，在新泽西州默里山 AT&T 贝尔实验室工作的丹麦计算机科学家比雅尼·斯特劳斯特鲁普（Bjarne Stroustrup）开发了\
    \ C++。C++ 继承了 C 和 Simula67 的特性，并支持面向对象编程（OOP）。这门编程语言最初被命名为“C with Classes”，因为斯特劳斯特鲁普的主要目标是利用类来实现\
    \ OOP 特性。\n\n![](img/4d9a4ae4efedabe01be6e6c44bad2dc1_17_0.png)\n\n*图 1.1*  C++\
    \ 的编程关系\n\nC 后面的 ++ 符号被称为*自增运算符*，表示该语言是 C 的一个扩展版本。1985 年，C++ 开始在贝尔实验室之外使用，其首个\
    \ C++ 编译器 Cfront 也于同年发布。1989 年，美国国家标准学会（ANSI）成立了 C++ 委员会。1995 年，首个标准草案发布。程序员常被建议在学习\
    \ C++ 之前先学 C，但使用本书则无此必要。我们将学习 C++ 的核心原理，以及一些编程基础知识。C++17 是当前正在使用的 C++ 最新版本。\n\n\
    ### 1.2 为什么使用 C++？\n\nC++ 常因其简洁性和 OOP 便利性而使用。使用该语言的其他原因如下：\n\n### C++ 的特性\n\n\
    - 语法简单：由于 C++ 源自 C，其语法与之相似，且易于理解。\n- 面向对象：使用了多态、继承、封装和抽象等 OOP 特性。\n- 平台相关：你的代码只会在其设计和开发所针对的操作系统上执行。\n\
    - 提供内存管理：C++ 支持动态内存分配。\n- 中级编程：它既能处理底层编程任务（如驱动程序和内核），也能开发游戏、GUI 和桌面应用等高级应用。\n\
    - 庞大的库：你可以使用许多内置函数（库），从而节省时间。\n- 基于编译器：你的 C++ 程序若不通过编译就无法执行。\n- 结构化编程语言：你的代码是*模块化*的，即由函数、类和对象组成。\n\
    \n封装与上述特性一同提供。可以将其视为一个胶囊，将你可能需要的所有重要成分集于一处。C++ 通过将类引入程序来实现这一概念。\n\n### 2. 数据抽象\n\
    \n*抽象*只获取与用户相关的数据，并隐藏任何其他细节。考虑一个例子：你去餐厅下单。你有时会得到一个订单号，当叫到号时凭它取餐。你并不关心后厨制作餐食的工具、员工人数或他们的细节。共享相关信息既能节省时间和内存，又能保护我们的数据。\n\
    \n我们可以使用类在 C++ 中实现抽象，将数据成员和成员函数组合在一起。这种方法将决定程序中的其他实体可以访问哪个数据成员，以及访问到何种程度。\n\n\
    ### 3. 多态\n\n*多态*为我们提供了具有不同签名但相同名称的方法的多种形式。多态有两种类型：运行时多态和编译时多态，这两种多态在 C++ 中都是通过方法重载和方法重写实现的。通过改变函数签名中参数的类型和数量，方法可以呈现出多种形式。当这些方法以相同名称但不同签名使用时，称为重载；当名称和签名都相同时，称为重写。\n\
    \n让我们看下面的例子：\n\n在一级方程式赛车中，有 10 支车队，每队 2 名车手，车手们使用相同的设备和赛车规格。然而，两位车手为各自车队取得的结果总是不同，因为“方法”（赛车）被以完全不同的方式“重载”了（也就是说，F1\
    \ 赛车以不同的形式存在）。\n\n![](img/4d9a4ae4efedabe01be6e6c44bad2dc1_21_0.png)\n\n对于 C++\
    \ 中的对象而言，通信非常重要，因为它们可能需要执行来自其他对象的请求，以完成自己的任务（函数）。要实现成功的通信，你需要发送方和接收方的地址以及要发送的信息。用\
    \ C++ 的术语来说，你只需要正确的对象名（接收方）、函数名和数据。\n\n### 6. 动态绑定\n\n*动态绑定*（或*后期绑定*）指明在运行时将调用哪个过程。我们用\
    \ C++ 编写的代码称为*源代码*，并以 .cpp 为扩展名保存。编译器会检查程序中的每一行，以发现错误并通知我们。程序执行的时间被称为*运行时*。也就是函数调用执行的时候。过程内部的代码直到执行时才知道，因此得名后期绑定。在\
    \ C++ 中，动态绑定是通过对象实现的。\n\n### 1.4 C++ 基础\n\n现在你已经了解了 C++ 能做什么，让我们来看看具体如何实现。与数学类似，我们将学习什么是变量，以及解决问题时会用到的符号。\n\
    \n### 1.4.1 变量\n\nC++ 中的*变量*是赋予在定义的作用域内保存值的单元的唯一名称。命名需要遵循一定的规则。遵循这些规则，你可以使程序更容易被他人（以及你自己）理解。\n\
    \n*变量声明*是指在变量被使用之前将其引入程序。\n\n*变量定义*是指为变量分配内存位置和值。C++ 中变量命名的规则如下：\n\n- 1. 应以字母开头。\n\
    - 2. 可以包含数字或字母的组合。\n- 3. 除下划线（_）外，不应包含任何空格或特殊字符（如 !、% 或 #）。\n- 4. 不应包含任何 C++ 保留字（也称为*关键字*）。\n\
    \n### 代码：在 C++ 中实现数据类型\n\n```cpp\n//Various data types and their sizes\n#include\
    \ <iostream>\nusing namespace std;\nvoid main()\n{\n        int x=98;\n      \
    \  short int sh=1;\n        long int l=34566;\n        signed int s=-9978;\n \
    \       unsigned int u=66;\n        char c='A';\n        float f=1.98;\n     \
    \   double d=9.6666788;\n        bool b=true;\n        cout << \"Size of int :\
    \ \" << sizeof(int) << \" bytes\"\n             << endl;\n        cout << \"Size\
    \ of short int : \" << sizeof(short int)\n             << \" bytes\" << endl;\n\
    \        cout << \"Size of long int : \" << sizeof(long int)\n             <<\
    \ \" bytes\" << endl;\n        cout << \"Size of signed int : \"\n           \
    \  << sizeof(signed int) << \" bytes\" << endl;\n        cout << \"Size of unsigned\
    \ long int : \"\n             << sizeof(unsigned int) << \" bytes\" << endl;\n\
    \        cout << \"Size of char : \" << sizeof(char) << \" byte\"\n          \
    \   << endl;\n        cout << \"Size of float : \" << sizeof(float) << \" bytes\"\
    \n             << endl;\n        cout << \"Size of double : \" << sizeof(double)\n\
    \             << \" bytes\" << endl;\n        // no return statement as void used\n\
    }\n```\n\n### 输出：\n\n```text\nSize of int : 4 bytes\nSize of short int : 2 bytes\n\
    Size of long int : 8 bytes\nSize of signed int : 4 bytes\nSize of unsigned long\
    \ int : 4 bytes\nSize of char : 1 byte\nSize of float : 4 bytes\nSize of double\
    \ : 8 bytes\n```\n\n"
