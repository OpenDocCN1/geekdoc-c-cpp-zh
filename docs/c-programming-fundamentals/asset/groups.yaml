    ```\n\n输出显示了两个不同变量的地址如何分配给同一个指针。前一个值 1 的指针将显示零地址，然后指向值 2 的新地址。\n\n### 4.3 指针的强制转换与传递\n\
    \n#### 4.3.1 类型转换\n\n在 C++ 中，我们可以将变量从一种数据类型强制转换为另一种数据类型。如果我们希望使用指针来更改分配的数据类型，也可以这样做。让我们看一个如何实现此操作的示例。我们使用\
    \ `reinterpret_cast`，这是一种类型转换运算符，有助于转换指针的数据类型。它所做的只是更改为新类型，并且不检查指针所指向的数据是否相同。其语法如下（此处，一个参数用作指针变量，且不返回任何值）：\n\
    \n```cpp\ndata_type *var_name =\n        reinterpret_cast <data_type *>(pointer_variable);\n\
    ```\n\n返回类型\n\n以下是 `reinterpret_cast` 的一些重要功能：\n\n- 特殊运算符。仅当指针具有相同数据类型时才有效。\n\
    - 有助于转换为任何其他合法的数据类型。\n- 当使用 bool 时，它会自动转换为等效的整数，即 1 表示 `true`，0 表示 `false`。\n\
    - 大多在按位操作处于核心地位时使用。\n\n现在考虑以下示例：\n\n#### 代码：`reinterpret_cast` 的使用\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main()\n{\n    int* ptr = new\
    \ int(69);\n    char* cr = reinterpret_cast<char*>(ptr);\n    cout << *ptr <<\
    \ endl;\n    cout << *cr << endl;\n    cout << ptr << endl;\n    cout << cr <<\
    \ endl;\n    return 0;\n}\n```\n\n#### 输出：\n\n```text\n69\nE\n0x7fbbebd405ac0\n\
    E\n```\n\n在这里，我们借助特殊运算符 `reinterpret_cast` 将整数 69 强制转换为其对应的字符类型值。现在，`char` 指针类型的值为\
    \ E，这正好是 69 的 ASCII 值。\n\n#### 4.3.2 传递\n\n将指针传递给函数可以通过两种方式完成：要么直接传递指针，要么传递引用，正如前面一些示例中所做的那样，将简单数据作为参数（在这种情况下，数据本身是指针）。\n\
    \n在第一种方法（直接传递指针）中，变量的内存地址作为参数传递。函数体内所做的任何更改都将反映在原始指针上。以下示例演示了此方法。\n\n#### 代码：直接传递指针\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nvoid function_A(int *x,\
