    ## 7.4 函数重写与重载\n\n现在我们转向一种我们将会经常使用的多态类型，它通过函数及其不同状态来实现。（你应该通过重新定义所创建函数的状态和类型，并观察如何使用对象进行调用来练习这个概念。）\n\
