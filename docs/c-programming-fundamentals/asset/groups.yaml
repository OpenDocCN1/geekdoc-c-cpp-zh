    \ 中一种独特的数据类型，它允许我们定义数据类型，并将我们选择的元素命名为整型常量。\n\n枚举的语法如下：\n\n```cpp\nenum datatypename\
    \ { enum values list.... };\n```\n\n### 代码：使用枚举\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main()\n{\n    enum Gender { max, checo = 9, lewis,\
