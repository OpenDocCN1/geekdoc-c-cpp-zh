    ```\n\n对于多维数组，我们也可以使用指向基元素或整个数组的指针来访问所有元素。在表示二维数组时，我们使用行号 i 和列号 j 作为定义二维数组的两个参数。我们将二维数组代码写为\
    \ `arr[i][j]`，因此其对应的指针表示为 `*(*(arr + i) + j)`。让我们考虑以下二维数组：\n\n```cpp\nint arr[3][4]\
    \ = { {11, 22, 33, 44}, {52, 65, 75, 88}, {92, 101, 121, 152} };\n```\n\n在此示例中，`*(arr\
    \ + i)`（其中 i = 1）可获得 `arr[i]` 的基元素。但是，如果考虑到二维数组，我们递增 +j 来获取第 i 个一维数组中第 j 个元素的地址。于是我们得到以下内容：\n\
    \n- `*(arr + i) + 1` = 第 i 个一维数组的第一个元素的地址\n- `*(arr + i) + 2` = 第 i 个一维数组的第二个元素的地址\n\
    - `*(arr + i) + j` 将表示第 i 个一维数组中第 j 个元素的地址。\n\n### 代码：使用指针与数组（示例3）\n\n```cpp\n\
