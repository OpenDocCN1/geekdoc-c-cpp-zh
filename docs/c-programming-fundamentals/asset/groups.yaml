    \ Student& s1)\n    {\n        std::cout << \"\\nThis is a member of a class\\\
    n\" <<endl;\n    }\n};\nint main() {\n    Student s1(\"Rio\");\n    Student s3(s1);\n\
    \    return 0;\n}\n```\n\n### 输出：\n\n```\nName is Rio\nThis is a member of a class\n\
    ```\n\n### 代码解读\n\n- 在这段代码中，我们创建了一个带有几个方法的类。\n- 这些方法用于从用户处获取数据成员的输入。\n- 这里，构造函数被重载并与一个对象一起使用。\n\
