    \ C++ 中正确且相关地声明指针是一个优先事项。\n\n本例代码片段中的指针是指 `var` 的值等于地址的指针值，而 `&` 给我们提供了这个数字，也就是变量存储时的确切内存位置。现在，让我们尝试用图像来可视化指针的工作方式。在图\
    \ 4.1 中，圆柱体代表内存空间，地址为“xxx”和“yyy”。图中显示的箭头充当指向内存位置的指针。\n\n还有几种声明指针来分配变量地址的方法。请记住，对引用所做的更改是永久性的，且往往不可逆转。因此，我们应该小心使用指针。\n\
    \n在 C++ 中，我们会处理空指针。如前几章所述，null 不等于零，而是表示该值不存在。空指针或零指针指向一个非法且为空的地址。如果无法对地址进行引用，那为什么还要使用它呢？随着你在编码之旅中不断前进并更频繁地使用指针，你可能会遇到一个问题：\n\
    \n#### 代码：指针的运作\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main\
