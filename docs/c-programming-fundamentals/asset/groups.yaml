    \n## Arrays and Strings\n\n### 3.1 What is an Array?\n\nAn *array* is like a storage\
    \ facility: it allows you to keep similar data types under one “roof,” identified\
    \ by one name. Items stored inside an array can be integers, characters, and strings.\
    \ Whatever you wish to group together, you can using an array. Let us see how\
    \ they are declared and initialized.\n\n#### 3.1.1 Ways to Declare Arrays\n\n\
    - `Datatype array_name[array_size];` declared by giving the size\n- `Datatype\
    \ array_name[]={element1, ele2..};` declared by initializing the elements\n- `Datatype\
    \ array_name[array_size]={element1, ele2..};` declared by initializing the elements\
    \ and size\n- `Datatype array_name[array_index]= ele3;` assigning an element to\
    \ a particular index\n\nHere, the `[ ]` subscripting operator is used so the compiler\
    \ knows it is an array; this is followed by similar types of elements, with an\
    \ index starting from 0 (i.e., the first element of any array is always assigned\
    \ index 0, `arr[0]`, and the last index of an array is n-1, where n denotes the\
    \ total number of elements). Let’s consider an example. Try visualizing an array\
    \ as a passenger train with three coaches, one behind the other, with ticket numbers\
    \ assigned from 0 to 2. The array named `Train` has three coaches with the indexes\
    \ as shown in Figure 3.1.\n\n![](img/4d9a4ae4efedabe01be6e6c44bad2dc1_60_0.png)\n\
    \n#### 3.1.2 Ways to Access Array Members\n\n- Array elements stored in contiguous\
    \ memory locations are accessed sequentially, too.\n- The indexing is important\
    \ for extracting a particular element.\n- The element at index 0 also can be said\
    \ to be a *pointer* to the array name.\n- If you are working with a static/fixed\
    \ array, then the last element is extracted using `index[n-1]`.\n- For dynamic\
    \ arrays, the size is fixed at runtime, so use the `array.length()` method to\
    \ determine the exact size and indexing.\n\n**Code: Train and Coaches Array Example**\n\
    \n```cpp\n#include <iostream>\nint main()\n{\n        int train[3]={10,11}; //\
    \ declare three coaches\n        train[2]= 12;\n        std::cout << \"\\nElements\
    \ in Train are\\n\";\n        std::cout << \"Elements 1: \"<<train[0];\n     \
    \   std::cout << \"\\nElements 2:\"<<train[1];\n        std::cout << \"\\nElements\
    \ 3: \"<<train[2];\n        return 0;\n}\n```\n\n**Output:**\n\n```text\nElements\
    \ in Train are\nElements 1: 10\nElements 2: 11\nElements 3: 12\n```\n\n#### 3.1.3\
    \ Traversing a 1D Array\n\nHere, *1D* refers to a one-dimensional array which\
    \ you can easily traverse using the loop statements `for` and `while` to reach\
    \ and fetch array elements, as well as enable the user to input array elements\
    \ at the particular index.\n\n**Code: Creating a 1D Array**\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n\n    int num_array[6];\n  \
    \  cout << \"Enter six numbers: \" << endl;\n    for (int i = 0; i < 6; ++i)\n\
    \    {\n        cin >> num_array[i];//take elements from user\n    }\n    cout\
    \ << \"The numbers are: \";\n    for (int j = 0; j < 6; ++j) {\n        cout <<\
    \ num_array[j] << \" \";// displaying user array\n    }\n\n    return 0;\n}\n\
    ```\n\n**Output:**\n\n```text\nEnter six numbers:\n12\n79\n45\n33\n11\n23\nThe\
    \ numbers are: 12  79  45  33  11  23\n```\n\n### 3.2 Operations on an Array\n\
    \n#### 3.2.1 Passing an Array to Functions\n\nFunctions are very useful, but you\
    \ can pass array elements that are not needed, which creates a problem: imagine\
    \ passing thousands of such elements! You can avoid this situation by only passing\
    \ the name of the array, which acts as a pointer to the first element and whole\
    \ array. It is important to ensure that the function signature indicates it is\
    \ an array by using one of the following:\n\n- `int func(int array_name[]){ //body\
    \ }`\n- `int func(int array_name[array_size]){ //body }`\n- `int func(int *array_name){\
    \ //body }`\n\n**Code: Passing an Array**\n\n```cpp\n#include <iostream>\n\nint\
    \ coach (int train[], int s)\n{\nint i,price=0;\nfor( i = 0; i < s; i++)\nprice\
    \ += train [i];\nreturn price;\n}\nint main ( )\n{\nint price,s;\nint train[3]={1050,1100};\n\
    \nstd::cout << \"How many passengers \";\nstd::cin >> s;\nprice = coach (train,\
    \ s);\nstd::cout << \"\\nYour bill is:\"<<price;\nreturn 0;\n}\n```\n\n**Output:**\n\
    \n```text\nHow many passengers 3\n\nYour bill is: 2150\n```\n\n#### 3.2.2 Finding\
    \ the Length\n\nIt is important to determine the exact length of a dynamic array\
    \ as entered by the user, because the size might change midway through the program.\n"
