    <<j <<\"= \"<< *(array+i)+j <<endl;\n        }\n    }\n    return 0;\n}\n```\n\
    \n### 输出\n\n```text\n*(array+0)+0= 0x3053d95a0\n*(array+0)+1= 0x3053d95a4\n*(array+0)+2=\
