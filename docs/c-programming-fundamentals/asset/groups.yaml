    \ C++ 中编写你自己的继承版本。\n\n## 总结\n\n- *继承* 是 C++ 中的一种机制，允许子类继承父类的特性。\n- 父类（或称基类或超类）是在子类之前存在的单一实体，其所有子类都从它继承属性。\n\
