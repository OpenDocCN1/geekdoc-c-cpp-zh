    \ class and created its object and a string value.\n- We then used the `open`\
    \ method to access our file in open mode.\n- Text entered is written onto the\
    \ file using the `ifstream` class object.\n- The program then prints the content\
    \ of the newly written file.\n- The `close` method is called upon to close the\
    \ file we had opened earlier.\n"
