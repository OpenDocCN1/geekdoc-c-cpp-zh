    # Inheritance


    # 6.1  Introduction


    We discussed object-oriented programming concepts briefly in the first chapter.
    Now, let’s learn a few of them in depth. We are familiar with class making and
    how objects access them to use the members of a particular class. In C++, we can
    make multiple classes in one program (and make connections between these classes)
    and enable them to share access to their individual data members. This concept
    of establishing a relationship between classes where some of the properties are
    shared is referred to as *inheritance*. This chapter examines inheritance and
    its type and how you can make full use of this object-oriented programming concept.
    All topics discussed have code examples, and readers are encouraged to try them
    all to improve their understanding of this topic.


    # 6.2  Inheritance


    Just as a child inherits not only the assets of their parents but also some unique
    features, like eye or hair color, inheritance in C++ is defined as the ability
    of a “child” class to inherit features of its “parent” class. Let’s learn a little
    more about these terms before we proceed.


    +   - *Parent class*: Also known as the *base class* or *super class*. You can
    think of it as the entity that existed before its children. All of its children
    inherit properties from it.'
