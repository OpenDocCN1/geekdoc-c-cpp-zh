    \ can also use structure, which is a user-defined data type that groups different\
    \ data types together. It can be viewed as an array that stores similar data types\
    \ under one name. The way structure stores information is different from how a\
    \ class stores it, as by default all members of a structure possess public visibility\
    \ while in a class default visibility of all members is private.\n\n### Features\
    \ of Structure\n\n- Defined using the keyword `struct` and members access it using\
    \ the name.\n- Memory allocation for a structure in C++ occurs contiguously.\n\
    - It has data members and functions that are similar to the variables and functions\
    \ used elsewhere in C++.\n- Data members cannot be initialized inside a structure.\n\
    - Initialization of members can be done using curly braces.\n- Accessing of members\
    \ is done using the selector or dot operator.\n- A pointer to a structure in C++\
    \ uses the following characters: ->.\n- Like arrays, structures of structures\
    \ can be made in C++.\n\nThe syntax for a structure is as follows:\n\n```cpp\n\
    struct {\n    // Declaration of our struct\n    //members\n};\n```\n\nThe following\
    \ programs in C++ use classes and help us observe the difference between a class\
    \ and a structure.\n\n### Code: Class vs Structure in C++\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nclass Student\n{\n    public:\n    string\
    \ n;\n    Student(string n)\n    {\n        std::cout << \"\\nName is \" <<n<<endl;\n\
    \    }\n    Student(const Student& s1)\n    {\n        std::cout << \"\\nThis\
    \ is a member of a class\\n\" <<endl;\n    }\n};\nint main() {\n    Student s1(\"\
    Rio\");\n    Student s3(s1);\n    return 0;\n}\n```\n\n### Output:\n\n```\nName\
    \ is Rio\nThis is a member of a class\n```\n\n### Code Debriefing\n\n- In this\
    \ code, we created a class with a few methods.\n- The various methods are used\
    \ to take input for the data members from the user.\n- Here, the constructor is\
    \ overloaded and used with one object.\n- The code displays the changes made.\
    \ The overloading was performed successfully.\n\n### Code: Working with Structure\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nstruct OurStructure {\n \
    \       int x;\n        char c;\n};\nint main()\n{\n\n        struct OurStructure\
