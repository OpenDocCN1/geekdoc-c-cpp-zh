    | double | 8 | ±1.7E-308 and ±1.7E308 |\n| Long double | 12 | ±1.7E-308 and ±1.7E308\
    \ |\n\n# ## 1.5 C++ Execution Flow\n\nLet’s talk about a few basic terms before\
    \ we move on:\n\n+   - *Machine code* are instructions that only the computer\
    \ understands, written in binary (0,1), and can be directly executed by a CPU.\n\
    +   - *Assembly code* is a low-level language consisting of statements written\
    \ in English that can be understood by the programmer.\n+   - *Debugging* means\
    \ finding the faults or errors in your program to fix them so the program executes\
    \ correctly.\n\nA program in C++ executes in four stages, where different tools\
    \ help us to make the execution process easier:\n\n+   1. *Pre-processor*\n+ \
    \  \n+      The first event that occurs in a C++ program is that the pre-processor\
    \ processes the program before compilation. It includes the header files and any\
    \ macros, if defined. It prepares the source code for the later stages of execution.\n\
    +   \n+   2. *Compiler*\n+   \n+      Now the pre-processed source code passes\
