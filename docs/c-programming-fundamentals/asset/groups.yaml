    \ << endl;\n    }\n    ifObj.close();\n    return 0;\n}\n```\n\n**输出：**\n\n```text\n\
    We are learning and improving everyday.\nWe are learning and improving everyday.\n\
    \n-1\n```\n\n### 代码解析\n\n- 在这段代码中，我们使用了`ofstream`类并创建了它的对象和一个字符串值。\n- 然后我们使用`open`方法以打开模式访问我们的文件。\n\
    - 输入的文本通过`ifstream`类对象写入文件。\n- 程序随后打印新写入文件的内容。\n- 调用`close`方法来关闭我们之前打开的文件。\n\n"
