    \  - b. 属性\n  - c. 特性\n  - d. 维度\n- 8. C++ 中的一个类中有多少个访问说明符？\n  - a. 2\n  - b.\
    \ 1\n  - c. 4\n  - d. 3\n\n### 选择题答案\n\n| 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |\n| ---\
