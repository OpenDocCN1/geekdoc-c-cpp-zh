    \n```text\ndata_type (*pointer_var)[Array_size];\n```\n\n到目前为止，我们一直引用数组的第 0 个基元素，并从中访问其他元素。然而，现在整个数组都落在一个指针的“保护伞”之下。当我们处理多维数组时，这种方法也会有所帮助。下面这个示例将解释它们是如何工作的。\n\
