    结构体是 C++ 中的一种用户自定义数据类型，它将不同的数据类型组合在一起。访问成员可以使用结构体成员运算符（.）或结构体指针。下面是一些示例，展示了如何访问和调用成员。这些示例还显示了结构体所占用的内存量（或字节数）。\n\
