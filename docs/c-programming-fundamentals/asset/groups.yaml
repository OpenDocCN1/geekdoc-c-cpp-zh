    # 11.2 File Operations


    The major steps needed in C++ for file handling are as follows:


    **Opening a file:** This is the first step taken toward file management in C++
    and can be done either by passing our file name in the constructor when an object
    is created or using the `open()` method.


    The syntax for opening a file is as follows:


    ```

    void open(const char* ourFileName, ios::openMode mode);

    or

    open() function

    ```


    Now, various open modes can be activated in C++.


    **Table 11.1** Types of Open Modes


    | Serial Number | Mode | What it does |

    |---|---|---|

    | 1 | `in` | This mode is the default while using `ifstream`, and it opens our
    file to read. |

    | 2 | `out` | This mode is the default while using `ofstream`, and it opens our
    file to write. |

    | 3 | `ate` | This mode opens our file, and the pointer faces the end of the file.
    |

    | 4 | `binary` | This mode opens our file in binary form. |

    | 5 | `noreplace` | This mode will open a file only if it does not exist in the
    system. |

    | 6 | `nocreate` | This mode will open a file only if it exists in the system.
    |

    | 7 | `trunc` | This mode will open a file if it already exists, and the items
    will be truncated. |

    | 8 | `app` | This mode will open our file in append mode, and all new items will
    be appended at the end of the file. |


    We can also combine different opening modes by separating each by using the symbol
    `|`, called the logical or symbol.


    +   1. **Writing to a file:** Done using the `ofstream` or `fstream` classes to
    enter data onto our created or opened files.

    +   2. **Reading a file:** Done using the `ifstream` or `fstream` classes to fetch
    data from our created or opened files.'
