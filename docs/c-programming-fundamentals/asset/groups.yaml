    - 在 C++ 中，指向结构体的指针使用以下字符：->。\n- 与数组类似，在 C++ 中也可以创建结构体的结构体。\n\n结构体的语法如下：\n\n```cpp\n\
    struct {\n    // Declaration of our struct\n    //members\n};\n```\n\n下面的 C++\
    \ 程序使用了类，帮助我们观察类与结构体之间的区别。\n\n### 代码：C++ 中的类与结构体\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nclass Student\n{\n    public:\n    string n;\n    Student(string\
