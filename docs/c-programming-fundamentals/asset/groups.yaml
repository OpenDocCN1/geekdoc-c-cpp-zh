    # 10.1  Errors and Exceptions


    Exceptions in the programming world are runtime abnormal conditions that lead
    to either program termination or faulty execution. Errors are illegal statements
    or functionality the programmer might have used in their program. Errors are beyond
    repair but exceptions can be handled.


