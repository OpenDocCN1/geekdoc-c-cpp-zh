    \ Function Call Num1= \" <<*num1 <<\" Num2= \"\n         <<*num2<<endl;\n    function_A(\
    \ num1,num2 );\n    cout << \"\\nAfter Function Call Num1= \" <<*num1 <<\" Num2=\
    \ \"\n         <<*num2<<endl;\n```\n\n"
