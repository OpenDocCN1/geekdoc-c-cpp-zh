    \ of pointers.\n5. Write a program in C++ for a simple calculator with a menu\
    \ using only pointer variables.\n6. Write a program in C++ to input an array of\
    \ addresses from a user and print each of these addresses using a pointer.\n7.\
    \ Write a program in C++ to display the difference between passing by value and\
    \ passing by reference for a pointer variable.\n"
