    \ August 2022, *https://sillycodes.com*\n\n## CHAPTER 11 FILE HANDLING\n\n###\
    \ 11.1 Files and Streams\n\nOrganizing and maintaining our belongings helps us\
    \ access them whenever they are needed with ease, and the same is true for our\
    \ desktop folders and phone data. All need organizing and efficient handling.\
    \ In C++, we handle and organize files, folders, and directories. We can write\
    \ our own files and display the items in created files. What exactly is a file\
    \ in C++? Let us try to define it in simple terms.\n\n### Files\n\nFiles created\
    \ in C++ help to store data onto the hard disk and remain in the system for later\
    \ use. This is different from traditional programs, where our data or objects\
    \ holding data get deleted after program termination to reclaim the temporary\
    \ memory space allotted. Many times, we need our data to be securely stored in\
    \ the system so fetching items out of a file requires less time.\n\n### Streams\n\
    \nFor the user to enter and provide details or values, we use input streams. A\
    \ stream refers to a group of bytes that can be accessed sequentially. There are\
    \ two different types of streams. *Input streams* are used to hold the input from\
    \ a user, such as a keyboard. For example, the user might press any key on the\
    \ keyboard, even when not asked for it. In a situation like\n\n### Code: Working\
    \ with Files and Streams\n\n```cpp\n#include <iostream>\n#include <fstream>\n\
    using namespace std;\nint main()\n{\n    ofstream ofObj;\n    string ourLine;\n\
    \    ofObj.open(\"textFile3.txt\");\n    while (ofObj)\n    {\n        getline(cin,\
    \ ourLine);\n        if (ourLine == \"-1\")\n            break;\n        cout\
    \ << ourLine << endl;\n    }\n    ofObj.close();\n    ifstream ifObj;\n    ifObj.open(\"\
    textFile3.txt\");\n    while (ifObj)\n    {\n        getline(ifObj, ourLine);\n\
    \        cout << ourLine << endl;\n    }\n    ifObj.close();\n    return 0;\n\
    }\n```\n\n**Output:**\n\n```text\nWe are learning and improving everyday.\nWe\
    \ are learning and improving everyday.\n\n-1\n```\n\n### Code Debriefing\n\n-\
    \ In this code, we used the `ofstream` class and created its object and a string\
    \ value.\n- We then used the `open` method to access our file in open mode.\n\
    - Text entered is written onto the file using the `ifstream` class object.\n-\
    \ The program then prints the content of the newly written file.\n- The `close`\
    \ method is called upon to close the file we had opened earlier.\n\n### 11.2 File\
    \ Operations\n\nThe major steps needed in C++ for file handling are as follows:\n\
    \n**Opening a file:** This is the first step taken toward file management in C++\
    \ and can be done either by passing our file name in the constructor when an object\
    \ is created or using the `open()` method.\n\nThe syntax for opening a file is\
    \ as follows:\n\n```text\nvoid open(const char* ourFileName, ios::openMode mode);\n\
    or\nopen() function\n```\n\nNow, various open modes can be activated in C++.\n\
    \n**Table 11.1** Types of Open Modes\n\n| Serial Number | Mode | What it does\
    \ |\n| --- | --- | --- |\n| 1 | `in` | This mode is the default while using `ifstream`,\
    \ and it opens our file to read. |\n| 2 | `out` | This mode is the default while\
    \ using `ofstream`, and it opens our file to write. |\n| 3 | `ate` | This mode\
    \ opens our file, and the pointer faces the end of the file. |\n| 4 | `binary`\
    \ | This mode opens our file in binary form. |\n| 5 | `noreplace` | This mode\
    \ will open a file only if it does not exist in the system. |\n| 6 | `nocreate`\
    \ | This mode will open a file only if it exists in the system. |\n| 7 | `trunc`\
    \ | This mode will open a file if it already exists, and the items will be truncated.\
    \ |\n| 8 | `app` | This mode will open our file in append mode, and all new items\
    \ will be appended at the end of the file. |\n\nWe can also combine different\
    \ opening modes by separating each by using the symbol `|`, called the logical\
    \ or symbol.\n\n- **Writing to a file:** Done using the `ofstream` or `fstream`\
    \ classes to enter data onto our created or opened files.\n- **Reading a file:**\
    \ Done using the `ifstream` or `fstream` classes to fetch data from our created\
    \ or opened files.\n- **Closing a file:** This is the last, important step in\
    \ file handling. At program termination, the memory is freed automatically. However,\
    \ as to not take any chances and risk an item leak, we should always close our\
    \ files.\n\n### Code: Working with File Operations\n\n```cpp\n#include <iostream>\n\
    #include <fstream>\nusing namespace std;\nint main()\n{\n    fstream ourFile;\n\
    \    ourFile.open(\"OurFile\", ios::out);\n    if(!ourFile)\n    {\n        cout<<\"\
    File was not created\";\n    }\n    else\n    {\n        cout<<\"Our new file\
    \ has been created\";\n        ourFile.close();\n    }\n    return 0;\n}\n```\n\
    \n**Output:**\n\n```text\nOur new file has been created\n```\n\n### Code Debriefing\n\
    \n- In this code, we used the `fstream` class and created its object.\n- We used\
    \ the `open` method to access our file in open mode.\n- The program then prints\
    \ the message “Our new file has been created.”\n- The `close` method is called\
    \ upon to close the file we opened earlier.\n\n### Code: Working with Text File\n\
    \n```cpp\n#include <iostream>\n#include <fstream>\nusing namespace std;\nint main()\n\
