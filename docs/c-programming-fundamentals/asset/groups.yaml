  - "[PAGE 234]\n\n# 10.2  Exception Handling\n\nIn C++, exceptions are handled using\
    \ a try-catch block, where we can throw a particular exception we feel our code\
    \ might face and handle it in the block. Let us now get familiar with important\
    \ keywords we will be using throughout the exception handling mechanism.\n\n+\
    \   - *Try*: This block is used to throw our exception. We can try for conditions\
    \ and if the conditions are met (true), we throw an exception. A try block is\
    \ always followed by a catch block.\n+   - *Catch*: This block is used when an\
    \ exception is thrown. It gives what happens after catching the exception and\
    \ managing it with an exception handler. One try block can be followed by multiple\
    \ catches.\n+   - *Throw*: This keyword simply throws an exception and does nothing\
    \ much beyond that. It is the responsibility of the try-catch block to handle\
