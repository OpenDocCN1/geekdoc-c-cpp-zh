    | Advantages | Disadvantages |

    |---|---|

    | Pointers help in saving memory space. | Even the slightest error in input results
    in the wrong output |

    | Pointers can perform faster executions, as they can directly access and change
    data from memory. | They work more slowly than other variables. |

    | Pointers can be used in file handling. | Always need to be dereferenced |

    | Array elements can be accessed using pointers. | If any pointer is made to point
    to the wrong memory address, it might result in a permanent change to the value
    there. |

    | Pointers help in dynamic memory allocation | There is always the issue of a
    memory leak if deallocation not handled carefully. |


    # Summary


    +   - A pointer holds the address of the very first byte of the memory location
    where it is pointing.

    +   - This first byte address is called the *base address*, and it is like a variable
    to store the address of another variable.

    +   - The & (ampersand) is used to make reference to the memory location of another
    variable.

    +   - A pointer needs to be dereferenced with the * (asterisk) to declare a variable
    of type pointer.

    +   - `interpret_cast` is a typecasting operator provided to us in C++ that helps
    convert the pointer’s data type.

    +   - A NULL or zero pointer points towards an address that is not legal and null.

    +   - Passing a pointer to a function can be done in two ways: either by passing
    a value or by passing its reference.

    +   - When passing by value, the copies of pointers are passed as arguments and
    the changes are reflected in the original variables.

    +   - When passing by reference, the addresses are directly passed as arguments,
    hence the changes are permanent.

    +   - Pointers also help to access array elements by either the base element reference
    or the array pointer assigned.'
