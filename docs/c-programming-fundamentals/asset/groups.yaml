    \ | 始终需要继承 |\n| 函数以相同的名称但不同的签名重载 | 函数以相同的名称和签名被重写 |\n| 参数类型、数量和顺序可以更改 | 参数类型、数量和顺序不需要更改\
    \ |\n| 函数调用根据签名在编译时确定 | 函数调用根据签名在运行时确定 |\n| 重载可以发生多次 | 重写在一个C++程序中只发生一次 |\n\n\
