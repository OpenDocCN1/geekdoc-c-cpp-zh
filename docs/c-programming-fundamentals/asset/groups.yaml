    \ friend 声明。\n\n### 友元函数的特性\n\n- 使用 `friend` 关键字仅声明一次，可以在全局作用域或另一个类中声明。\n- 它可以在类中具有任何类型的访问权限：public、private\
    \ 或 protected。\n- 友元函数无需任何对象或点运算符即可调用。\n- 对象可以作为参数传递。\n- 即使它是非成员函数，它也可以访问类的所有数据成员（包括\
    \ private）。\n- 友元关系不能被继承。\n\n友元函数的语法如下：\n\n```cpp\nclass OurClass\n{\n    //body\n\
    \    friend returnType Myfunction(Parameters list...);\n};\n```\n\n### 代码：使用友元函数\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nclass myclass\n{\n    friend\
    \ int myfriend(int a, int b);\n};\nint myfriend(int a, int b)\n{\n    return a+b;\n\
    }\nint main()\n{\n    int a,b;\n    cout<<\"Enter numbers to add\"<<endl;\n  \
    \  cin>>a>>b;\n    cout<<\"Addition gives \"<<myfriend(a,b)<<endl;\n    return\
    \ 0;\n}\n```\n\n**输出：**\n\n```text\nEnter numbers to add\n23\n567\nAddition gives\
    \ 590\n```\n\n**代码解读：**\n\n- 此代码展示了如何创建友元函数。\n- 此函数可以在类内声明，并在类外定义。\n\n### 7.5.2\
    \ 泛型函数\n\n当一个普通函数需要多次使用，并且函数所作用的参数需要具有不同的数据类型时，我们可以使用 C++ 中的泛型函数来实现。这些函数充当模板，以便不同类型的参数产生所需的结果。\n\
    \n### 泛型函数的特性\n\n- 类似于宏，函数体在编译时展开以接收参数。\n- 源代码作为模板，因此所有函数的代码相同，但在编译不同副本时，由于参数类型不同，会产生不同的结果。\n\
    - 类模板也可以像泛型函数一样使用。\n- 这些函数有助于减少函数重载。\n- 如果需要，参数也可以具有默认值。\n\n泛型函数的语法如下：\n\n```cpp\n\
    template <typename T> T mytemplate(T parameter1, T parameter2)\n{\n    //template\
    \ body\n}\n```\n\n### 代码：泛型函数与数字交换\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nclass myclass\n{\n    public:\n    void swapR(int &a,int &b)\n    {\n\
    \        cout<<\"Swapping using the call by reference changes what is visible\
    \ \"<<endl;\n        a= a+b;\n        b= a-b;\n        a= a-b;\n    }\n    void\
    \ swapP(int *a,int *b)\n    {\n        cout<<\"Swapping by using the call by pointers\
    \ \"<<endl;\n        *a= *a + *b;\n        *b= *a - *b;\n        *a= *a - *b;\n\
    \    }\n}c1;\nint main()\n{\n    int a,b;\n    cout<<\"Enter numbers to swap\"\
    <<endl;\n    cin>>a>>b;\n    cout<<\"After swapping A= \"<<a<<\" B=\"<<b<<endl;\n\
    \    c1.swapR(a,b);\n    cout<<\"After swapping A= \"<<a<<\" B=\"<<b<<endl;\n\
    \    c1.swapP(&a,&b);\n    cout<<\"After swapping A= \"<<a<<\" B=\"<<b<<endl;\n\
    \n    return 0;\n}\n```\n\n**输出：**\n\n```text\nEnter numbers to swap\n23\n67\n\
    After swapping A= 23 B=67\nSwapping using the call by reference changes what is\
    \ visible\nAfter swapping A= 67 B=23\nSwapping by using the call by pointers\n\
    ```\n\n### 代码：使用模板交换数字\n\n```cpp\n#include<iostream>\nusing namespace std;\n\n\
    template <class T, class T1>\nvoid swap(T &a,T1 &b)\n{\n        T temp=a;\n  \
    \      a=b;\n        b=temp;\n}\n\nint main()\n{\n```\n\n命名空间的语法如下：\n\n```cpp\n\
    namespace Ournamespace\n{\n    // namespace body\n}\nOurnamespace :: identifiers_any;\n\
    ```\n\n### 代码：使用命名空间\n\n```cpp\n#include <iostream>\nusing namespace std;\n\n\
    namespace ourSpace1\n{\nvoid nFunc()\n{\n    cout << \"\\nFunction of ourSpace1\
