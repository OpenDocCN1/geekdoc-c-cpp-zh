  md: "\n## 3.2.4 Searching\n\nAccessing each and every element of an array by index\
    \ (called *traversing*) is not efficient for large arrays, so we should work with\
    \ an algorithm to search for the element we are looking for. These search methods\
    \ are as follows.\n\n### Linear Search\n\nIn a linear search, we sequentially\
    \ search for the element needed by traversing through the array and checking whether\
    \ the search element matches the array element.\n\n#### Algorithm for a Linear\
    \ Search\n\n1. Start.\n2. Take the size and element input from a user if the array\
    \ is not given.\n3. Input the search element from the user.\n4. Initialize the\
    \ for loop from i=0 to index size-1.\n5. Use a nested if loop for the search element\
    \ == array[i].\n6. If the result is true, then a match is found; break out of\
    \ the loop.\n7. If the result is false, then execute the else part of the code.\n\
    8. Stop.\n\n#### Code: Example of a Linear Search\n\n```cpp\n#include<iostream>\n\
    using namespace std;\nint main()\n{\n    int size,e,flag=0;\n    cout<<\"\\nGive\
    \ the size of the array \"<<endl;\n    cin>>size;\n    int array[size];\n    cout<<\"\
    Enter the elements of the array \"<<endl;\n    for(int i=0;i<size;i++)\n    {\n\
    \        cin>>array[i];\n    }\n    cout<<\"What do you wish to search for\"<<endl;\n\
    \    cin>>e;\n    for(int i=0;i<size;i++)//traverse array\n    {\n        if(array[i]==e)//check\
    \ with element to match\n        {\n            flag=i;\n            break;\n\
    \        }\n    }\n    if(flag)\n        cout<<\"Element \"<<e<<\" is at index\
    \ \"<<flag;\n    else\n        cout<<\"Element \"<<e<<\" is not present\\n\";\n\
    \    return 0;\n}\n```\n\n#### Output\n\n```\nGive the size of the array\n4\n\
    Enter the elements of the array\n11\n23\n66\n77\nWhat do you wish to search for\n\
    88\nElement 88 is not present\n```\n\nYou can also easily find the index at which\
    \ the search element was found by making a flag that is false at the start and\
    \ assigning the value i to it inside the if statement.\n\n### Binary Search\n\n\
    In this search algorithm, we are provided with a sorted array of elements placed\
    \ in order from the minimum to maximum. Now, the work is divided in half by finding\
    \ the midpoint about which the next half is found. The program checks whether\
    \ the search element is greater or smaller than the middle element, and this process\
    \ is repeated until the array becomes empty and we find the matching element.\n\
    \n#### Algorithm for a Binary Search\n\n1. Start.\n2. Take the size and element\
    \ input from the user if the array is not given.\n3. Input the search element\
    \ from the user.\n4. Call the binary search function and pass the array, `firstindex`,\
    \ `lastindex`, and the search element.\n5. Execute the nested if loop search element\
    \ == `array[mid]` or < `array[mid]` or > `array[mid]`.\n6. If the result is true,\
    \ then the match is found, return mid.\n7. If the result is false, then return\
    \ 0 and exit the loop.\n8. Stop.\n\n#### Code: An Example of a Binary Search\n\
    \n```cpp\n#include<iostream>\nusing namespace std;\nint binarySearch(int array[],\
    \ int a, int b, int s) {\n    if (a <= b) {\n        int mid = (a + b)/2;\n  \
    \      if (array[mid] == s)\n            return mid;\n        if (array[mid] >\
    \ s)\n            return binarySearch(array, a, mid-1, s);\n        if (array[mid]\
    \ < s)\n            return binarySearch(array, mid+1, b, s);\n    }\n    return\
    \ 0;\n}\nint main(void) {\n    int array[] = {23,67,45,11,33,44,55};\n    int\
