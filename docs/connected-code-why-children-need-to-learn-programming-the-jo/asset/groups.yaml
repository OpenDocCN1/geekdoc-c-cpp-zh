    \  \n黛比的分数房子屏幕设计。经许可转载。\n\n在这个轶事中，四年级学生黛比已将分数投入实际使用，但对这两个女孩来说，交流的焦点是对象——房子、场景本身——而不是分数。尽管对房子配色方案的关注无关紧要，但房子的美学与房子的几何结构密不可分。为了建立意义——至少最初——焦点需要放在整体而非构成要素上。房子给了黛比一种谈论数学的方式，也给了娜奥米一种看待数学的方式。连同编码一起，谈论和观看也共同构成计算参与。通过这个对象，学习者掌握了一种思考、联系和沟通的方式。黛比的房子也说明了个人化占有。这是黛比与分数关系的一次戏剧性转变。刚开始上课时，她和其他人似乎对这个项目不感兴趣，她似乎只是在程序里机械地创建类似练习册的练习。但房子场景改变了她的态度，部分原因是她因原创设计得到了同学的认可。对黛比来说，房子的设计与创建展示了她的分数知识，也给了她一个对象，使她能够向自己的同伴有意义地展示自己的知识。正如帕佩特所解释的：“黛比思维的变化不仅仅是掌握事实和技能的问题。她那句‘你可以把它们［即分数］放在任何东西上面’显示出一种认识论转变和一种认识论意图。她从一种知识（正式的、教师的知识）转向了另一种知识（个人的、具体的、她自己的知识）。”12\
    \ 黛比的项目让分数对她和她的受众（娜奥米、她的其他同学以及三年级学生）变得真实。以前，分数只存在于教室里，而且即便在这些狭窄范围内，它们还被进一步限制在教师的黑板和黛比的练习册中。她问娜奥米关于分数的“你喜欢这些颜色吗？”——而不是“这对吗？”或“你能检查一下这是否正确吗？”分数完全地、亲密地属于她。\n\
    \n帕佩特还提到黛比：“有一天她意识到，她用来装饰动画的编程技术也可以用来让她的分数表征在视觉上更有趣。”13 这一点捕捉到了从编写程序代码到依据此类代码进行计算性思考的转变。当黛比谈论把她房子场景中的一切都变成一半时，她必须构想所有需要被创造出来的“一半”，并考虑那个起支配作用的操作：将Logo海龟要绘制的步数除以二。这需要协调多种表征，包括将“½”的数值表征、“一半”的文本表征以及对象本身（无论是门、马车还是屋顶）某一半的视觉表征联系起来。黛比在设计并调试Logo问题的过程中参与编程，但她也以一种计算性活动的方式与编码过程建立联系。因此，她们发展协作与编码技能以及变得更加独立的机会受到限制，因为她们的活动范围有限。此外，参与不同的团队也导致对项目中角色的不同理解。有经验的软件设计者承担了丰富得多的角色，包括规划、帮助、教学以及理解年幼学生的担忧和焦虑，并且在这一过程中他们也参与了计算参与。\n\
    \n卡珀顿的软件设计研究和钦的学徒制研究的结果表明，将学生视为教学软件应用的设计者，会让他们对自己的学习更有投入感。两项研究还表明，创建具体的学科内容——无论是分数房子还是科学探究问题——比抽象地学习代码更能显著帮助学生学好编程。对分数设计项目结果的分析提供了有力证据，证明其对学习分数和学习编程都有益处，尤其是与同一所学校另外两个班级相比：那两个班级每周或每天都有编程课，但没有专注于创建教学分数软件。在所有这些比较中，分数设计项目的学生在编程知识技能以及分数的概念性和程序性理解方面都有显著提高。\n\
    \n学生的教学软件设计体现了他们在为学习者创建表征时的个人选择。最重要的是，它们展示了设计软件而非仅仅编写代码，为学习编程和数学提供了更丰富、更有成效的情境。同样，在钦的学徒制研究中，参与一个有经验的软件团队提高了所有团队成员的编程水平和对科学的理解。有经验的同伴可随时提供帮助，提高了编程技能，影响了科学模拟的设计，并影响了学生的学习内容。但这在多大程度上适用于校外的其他现实世界应用？卡珀顿的研究和钦的研究将编程与数学和科学结合起来，这些学科传统上与编码相一致并与之相关联。编程是否也能与其他学科主题和情境整合？在下一节中，我们考察这一转变——从学习编写抽象代码到寻找现实世界应用——如何在数字故事和电子游戏设计的发展中发生。\n\
    \n## 学校中的游戏设计工作室与写作工作坊\n\n尽管教学软件（如分数软件）植根于学校文化，无论它是以商业软件形式购买，还是由学生自己设计，娱乐媒体（如电子游戏）往往尚未进入课堂，直到最近才成为关于富有成效的学习环境的讨论的一部分。<sup>17</sup>\
    \ 让孩子成为游戏设计师的想法，似乎与孩子能够且应该编程的内容相去甚远。但电子游戏在儿童玩耍中占据突出位置，尤其是男孩的玩耍。在这些屏幕前花费的小时数持续增长，其质量也在提高。心理学家、社会学家和家长都对电子游戏所带来的参与质量感到惊讶，这与儿童在看电视节目和做学校作业时的冷漠形成对比。\n\
    \n因此，将教学软件设计扩展到游戏设计的想法似乎并不牵强。事实上，它遵循了同样的思路，即把教学软件变成面向学习的教学软件设计。同样，为学习而制作游戏而非为学习而玩游戏，成为第一项将学生视为游戏程序员的研究的前提。<sup>17</sup>\
    \ 作为教学分数设计项目的延续，亚斯明·卡法伊让一个十岁儿童班级设计并编程他们自己的教育性分数游戏。学生们每天见面，持续三个月，通过创建自己的角色、故事线、游戏主题和互动来设计教育游戏（图3.2）。关于这项工作的大部分讨论都集中在所观察到的游戏设计中的性别差异上，很可能是因为这些发现与当时流行的关于技术兴趣和表现方面性别差异的话语相吻合。<sup>18</sup>\n\
    \n男孩和女孩确实以不同方式着手并实现他们的游戏设计。大多数男孩的游戏以幻想情境为特色，角色众多，反馈具有暴力性；女孩的游戏角色较少，且答错没有惩罚。例如，大多数男孩创建了冒险狩猎和探索类游戏，而女孩的游戏则分为冒险、技能/运动和教学类。在选择游戏主题以及为动画和互动编程时，男孩和女孩让人得以一窥他们在通过其他媒体体验的数字游戏和故事中觉得什么有吸引力、什么没有吸引力。制作\n\
    \n"
