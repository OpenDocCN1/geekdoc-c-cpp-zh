    # # 1 The Comeback of Coding


    On June 23, 1990, The Computer Museum in Boston opened an exhibit featuring the
    world''s first Walk-Through Computer. Fifty times the size of a desktop model,
    the computer was one of a kind. Visitors to the museum ran their hands across
    a keyboard with buttons the size of their heads, looked up at a motherboard the
    size of a score board, and measured their height against a floppy disk that met
    them at eye level. More than just a model, the computer ran a functional software
    program, allowing visitors to take a tour of the world on a mammoth screen. With
    a giant trackball to guide the cursor, visitors chose starting and destination
    points from among three hundred major world cities, and the program calculated
    the shortest land route between any two sites, displaying geographic sights that
    would be encountered from one locale to another. The exhibit was a success and
    received global press coverage. Thousands walked through the interior world of
    a device that could show them the world on a gigantic screen and whose enormous
    size seemed to comment on the computer''s ever-growing presence in the world.<sup>1</sup>


    A few miles from the museum, a different sort of exhibit was being held in a Boston
    public elementary school in what was then one of the city''s poorest neighborhoods.
    Project Headlight featured the world''s largest school computer lab with hundreds
    of computers. Part of a bold experiment sponsored by MIT''s Media Lab, Project
    Headlight was likewise committed to getting users "inside" the inner workings
    of computers. Rather than a walking tour, however, the project put children into
    the veritable driver''s seat behind the machines and taught them how to manipulate
    the computer''s behavior by using the programming software Logo. Initiated by
    Seymour Papert, the project was founded on an idea that was unusual at that time—that
    children should (and could) program computers. Inside Project Headlight, the computers
    were arranged in circles in a large space near various classrooms rather than
    being closeted away into a single classroom. Once a day, students programmed stories,
    software, and games in Logo and sometimes'
