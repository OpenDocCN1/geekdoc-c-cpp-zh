    为女孩们创造空间，让她们能够参观和探究。许多公共图书馆已经在分馆中开设创客空间和活动，这些空间和活动常常覆盖她们所居住的服务不足社区。对于许多青少年来说，这些实体场所是重要的“家外之家”，他们可以在那里为自己的设计找到愿意接受的受众。⁹


    我们还需要找到办法，让青少年能够参与 Scratch 等在线创意社区，从而能在学校之外进行编程。这些在线社区提供了协作行动和参与的新模式，远远超越了当前许多学校环境中实践的小组协作模式。我们已经展示了如何设计此类协作活动，以及培养学生协作能动性意味着什么。这种协作为学校之外的世界提供了真实的延伸；随着课堂内外所发生之事之间的边界变得更加流动，学生和教师以能够创建健康而有效的学习组织的方式建立联系并分享。


    做出这些努力有许多原因，但它们都有一个总体目标：实现公平与多样性，因为如果只有少数精选者加入俱乐部，就无法实现计算参与。二十年来，在扩大计算领域参与方面只取得了边际成功，我们知道这不会自行发生，正如我们知道
    K–12 学校中的技术教育不会自然演进一样。它需要真正的推动。而且，我们从 Scratch 社区的研究中知道，这种迈向大规模社区成员身份的转变，是一个复杂的相互作用：年轻的软件设计者如何通过编程发展个人能动性，以及他们如何在同伴中获得专家地位。尽管存在儿童是“数字原住民”、会自然迁移到网上的神话，观察表明，一些儿童起初抗拒将自己的程序上传到
    Scratch 网站，并且不愿与网上更有经验的成员分享自己的作品。这表明，在一个大型编程社区中建立成员身份并不容易实现。在在线社区中穿行需要一系列参与策略，以应对与分享自己的作品供他人评论、甚至供他人为自己的目的进行混编相关的脆弱性。¹⁰


    同样，将编程视为一种协作性的、分布式努力，需要通常不会在课堂小组合作中出现的那类协作能动性。例如，在 Scratch 在线社区中，协作活动通常围绕一小群个人制作特定类型的
    Scratch 项目展开，这些人基于共同兴趣在在线环境中彼此相识。在我们最近对在线和离线群体的此类协作努力形式的研究中，我们发现许多学生难以参与这类自组织的协作。设计和研究
    K–12 编程社区的教育者和研究者需要关注的不仅是新手学生如何学习编程，还要关注儿童如何学习协作。


    参与公平这一问题并不新鲜。在基本层面上，使用软件设计活动的课堂总会形成社区，学生在其中参与那种常在大规模在线网络中观察到的同伴教学法形式。如今不同之处在于，大规模社区的可获得性，这些社区连接成千上万的年轻程序员，并提供不同的交流情境和机会。围绕
    Scratch、Alice 或 Kodu 等工具创建设计社区的这类工作，既可以在青少年参与的本地课堂和俱乐部中完成，也可以在青少年聚集分享设计并评论他人作品的在线空间中进行。


    这些在 K–12 教育计算努力中设计活动、工具和社区的新方向，可以在比以往整合尝试大得多的规模上扩大计算参与和对计算的认知。我们并不是主张传统计算课程的所有标准内容都应被抛弃。编写代码以了解算法本质、开发数据结构、编译器和通用架构仍然至关重要，并且不容易自学。但
    K–12 教育计算可以走上 K–12 语言艺术、数学和科学教育很久以前走过的道路。它可以成功利用从青少年数字媒体、网络文化和学习理论中获得的洞见，以打破一切传统观念的方式推广儿童程序员这一理念。


    ## 编程即连接


    我们认为，计算思维应被重新框定为计算参与，因为任何形式和任何地点的计算机都已成为


    西摩·佩珀特（Seymour Papert）设想计算机是一种多变机器，一种通用设备，能够以智力丰富、对个人有意义、文化多样且社会连接的方式构建用于思考的对象。在我们的愿景中，正是第四个组成部分——连通性——显得至关重要，如果儿童要将计算作为一种基本技能来学习。用于分享的对象代表了在学习和使用数字媒体进行创造方面的新要求和新标准。正是在这里，在交流的时刻，计算机或许能够兑现其在网络化世界中建立连接的多面承诺。


