    In the early stages of designing Lego/Logo, computer scientist Mitchel Resnick
    and toy designer Steven Ocko described it as a tool for animating and controlling
    Lego objects with engines and sensors.⁵ Designers wrote programs on the computer,
    and those programs were used to command the sensors and engines in Lego objects
