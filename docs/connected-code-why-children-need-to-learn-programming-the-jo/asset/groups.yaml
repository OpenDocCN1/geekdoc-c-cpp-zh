    The first part of this chapter examines the current state of computing education
    in schools—in both the traditional school classrooms and the less structured learning
    environments of afterschool programs and DIY initiatives. Where are scholars and
    learners present in each environment, and what is the benefit of each environment
    for teaching computation on the K–12 level? The second part of the chapter steps
    away from these two spaces to examine the last time that DIY learning made a widespread
    entrance into K–12 schools—when the educational theories of John Dewey were new
    and promised to make school a more practical experience for children. What does
    this history tell us about youngsters'' ambitions and scholars'' pragmatism, and
    what implications can be drawn from the current challenges facing computing education
    and the integration of technology in schools? This chapter is not intended to
    be a how-to Scratch guide for teachers. A number of excellent resources, including
    books and an entire website dedicated to and created by educators, are available
    for this.4 Instead, this chapter analyzes the wider culture of schools and the
    ways that such a culture affects how we teach children how to think and participate
    computationally.


    # Computing Education: Inside and Outside of School


    According to the U.S. Bureau of Labor Statistics,5 computing-related jobs are
    one of the fastest-growing employment fields nationwide. In a country with over
    42,000 high schools, however, only 2,100 offer an advanced computer science course.
    If only 5 percent of this country''s high schools offer the advanced computer
    science courses that prepare students for college classes, then it is clear that
    computer science has a minimal presence in high schools nationwide, even if their
    enrollment numbers have been increasing in recent years. This lack of presence
    is particularly evident in the low numbers of women and minority students who
    participate in advanced computer science courses at the high school level. Although
    high school girls are over half of all those who take advanced placement tests,
    less than a quarter of those who take the computer science test are female, and
    the number of African American test takers consistently ranks under one percent.6'
