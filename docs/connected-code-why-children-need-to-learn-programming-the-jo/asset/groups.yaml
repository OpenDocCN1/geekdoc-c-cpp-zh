    constructive feedback from the Scratch team; and submit a final project three
    weeks later. The draft and final projects were exhibited in a Collab gallery where
    participants could view and comment on each other’s projects. Teams that integrated
    three disparate images using their own original ideas and coding sequences had
    their projects featured on the Scratch homepage, which is a desirable status for
    many in the community.


    A total of fifty-two collab teams (139 participants) registered to participate
    in the initial Collab Challenge in January 2011. About 41.7 percent of the participants
    were relative newcomers to the community, and 48 percent of the participants had
    been on Scratch for more than three months. Comments made by experienced Scratchers
    suggest that the Challenge stimulated renewed interest in participating in the
    online community. One Scratcher who had been with the community for over two years
    thanked the team for hosting the Challenge:


    > > I want to personally thank all of you for throwing the Collab Challenge. Taking
    the time to create this has allowed me to work with some of the best scratchers—something
    that I think we all appreciate. I hope that you continue to do more challenges
    like this one in the future.


    Fifty-two of the groups that registered for the Collab Challenge in January submitted
    a first draft of a project by mid-February, and twenty-six submitted a final version
    by the end of March. Although K. Luther and colleagues found that only 13 percent
    of collabs on the digital media site Newgrounds succeeded in completing a finished
    project, a full 50 percent of the Scratch collabs that submitted an initial version
    of a project to the Collab Challenge succeeded in submitting a final version.
    Although these numbers reflect a small number of reference points, they suggest
    the potential for success of a lightly structured Challenge environment in which
    participants receive constructive feedback on drafts and have preestablished deadlines
    to help define and tier goals.


    This element of “light structure” suggests that schools can help children engage
    in the computational participation that characterizes these online collaborations.
    After a class of high school freshmen participated in the first Scratch Collab
    Challenge, Yasmin Kafai and her research team paired their analysis of online
    collaboration at the website with offline observations and interviews with the
    students themselves as they worked in teams of four to eight students for course
    credit. Initially, the high school students were intrigued by the challenge for
    the sake of the same “see and be seen”'
