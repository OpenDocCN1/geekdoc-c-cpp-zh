    game ideas, which the rest of the production team voted on before reaching a final
    decision. After a project was selected, the team assigned roles and arranged a
    production schedule. The founders encouraged users to follow a game to its completion
    before starting any additional projects. All of Green Bear''s games entailed alpha
    and multiple beta versions before a final, glitch-free version was produced and
    released on the website.


    如果被接受，Scratch用户就会成为这个民主组织的正式成员，可以自愿提出游戏创意，由制作团队其余成员投票，然后做出最终决定。项目选定后，团队会分配角色并安排制作时间表。创始人鼓励用户在开始任何额外项目之前，先跟进一个游戏直至完成。绿熊制作公司的所有游戏在最终制作出无故障版本并发布到网站之前，都经历了alpha版和多个beta版。


    Green Bear Productions Company was one of the first teams to call itself a production
    company within Scratch, embodying the open-source community spirit with very young
    users. Computer scientists Kurt Luther and Amy Bruckman, who have studied online
    creative communities that make interactive digital media, note that when collaborations
    succeed, they produce content that supersedes what any single member could have
    accomplished on their own.³⁶ The problem, they point out, is that these collaborations
    disband more often than they succeed. This makes the success of Green Bear Productions
    even more surprising, especially because young people and not adults drove this
    enterprise.


    绿熊制作公司是Scratch中最早自称制作公司的团队之一，体现了拥有非常年轻用户的开源社区精神。研究过制作交互式数字媒体的在线创意社区的计算机科学家库尔特·卢瑟（Kurt
    Luther）和艾米·布鲁克曼（Amy Bruckman）指出，当合作成功时，他们产出的内容会超越任何单个成员独自所能完成的内容。³⁶他们指出，问题在于这些合作解散的频率高于成功。这使得绿熊制作公司的成功更加令人惊讶，尤其是因为推动这项事业的是年轻人而非成年人。


    ![](img/9eb64eca0f040452d3ba8df0d78b35a9_81_0.png)


    **图4.2** 绿熊制作公司游戏精选：“珍珠港”“复古爪式捕捉”和“阴郁城堡之夜”。http://scratch.mit.edu/galleries/view/21935。


    What makes kids join Scratch and form companies like Green Bear Productions? This
    was what researcher Karen Brennan of the Scratch team intended to uncover as part
    of her doctoral dissertation at MIT. After interviewing several members who had
    formed and joined such companies, she discovered that altruism was not necessarily
    the members’ primary motivation. Scratcher “Lana,” seventeen years old, explains:


    是什么让孩子们加入Scratch并组建像绿熊制作公司这样的公司？这正是Scratch团队研究员凯伦·布伦南（Karen Brennan）在MIT博士论文中打算揭示的问题。在采访了几位组建并加入此类公司的成员后，她发现利他主义未必是成员的主要动机。17岁的Scratch用户“Lana”解释道：


    > It’s not really a thing that people are doing out of goodwill—it’s out of interest.
    It’s always good when you have that enthusiasm because that’s the only thing that
    keeps it going. You have to communicate. People in your collaborations should
    know exactly what to expect and what they want to do. Because if their expectations
    aren’t met and you’re kind of forcing your own views on them and you aren’t paying
    attention to their opinion, they’ll probably get bored with the project. For that
    reason, it’s always good to come to an agreement before you make a project. I
    think that’s the main thing.³⁷


    > 这其实并不是人们出于善意去做的事——而是出于兴趣。当你有那份热情时总是好的，因为那是唯一能让它持续下去的东西。你必须沟通。你合作中的人应该确切知道可以期待什么，以及他们想做什么。因为如果他们的期望没有得到满足，而你有点把自己的观点强加给他们，又不关注他们的意见，他们可能会对项目感到厌倦。因此，在制作项目之前达成一致总是好的。我认为这是最主要的事情。³⁷


    Yet other members of Scratch companies, such as ten-year-old “Chelsey,” indicate
    that increased and more sophisticated output is not the primary driver. Responding
    to a question about what was the “greatest thing” about starting and working within
    a Scratch company, she explains:


    然而，Scratch公司的其他成员，比如10岁的“Chelsey”，表示更多、更复杂的产出并不是主要驱动力。在回答关于在Scratch公司中创办和工作“最棒的事情”是什么的问题时，她解释道：


    > Greatest things? I’ve met—I’ve made loads of new friends. It’s really fun just
    making projects together rather than doing them on my own.³⁸


    > 最棒的事情？我遇到了——我交了很多新朋友。一起做项目而不是独自做，真的很有趣。³⁸


    One study examined the nature of Green Bear members’ online exchanges as they
    developed their projects through the galleries on the Scratch website. After analyzing
    three months of chat-based textual exchanges (approximately 1,470 lines), the
    study found that the team’s online exchanges were context-related (such as scheduling
    or technology specifications) 32 percent of the time, task-related to the project
    19 percent of the time, and socioemotional (socializing by joking or relating
    feelings) 49 percent of the time.³⁹ This research suggests that socializing is
    a primary driver behind such online collaboration—even in collaborations that
    are formal enough to refer to themselves as companies.


    一项研究考察了绿熊成员通过Scratch网站上的画廊开发项目时在线交流的性质。在分析三个月基于聊天的文本交流（约1,470行）后，研究发现团队在线交流中32%与情境相关（如日程安排或技术规格），19%与项目任务相关，49%与社会情感相关（通过开玩笑或表达感受进行社交）。³⁹这项研究表明，社交是此类在线合作背后的主要驱动力——即使是在正式到自称公司的合作中也是如此。


    If all collaborations in the Scratch community had been about kids making games,
    it might have become a typical “geek club.” Constructing projects in such a methodical
    manner requires people who are able to identify the composite parts of a project,
    delegate duties, ensure that they are completed in a timely manner, and—perhaps
    most difficult—reassemble the composite parts to form a unified whole. This approach
    is characteristic of very high ceilings—using modularization to break down the
    programming task into a series of independent systems. But the Scratch community,
    like the Scratch programming language, provides wide walls as well, and the socialization
    that played a significant role in Green Bear Productions plays an even more prominent
    role in some of the most common collaborations at the website.


    如果Scratch社区的所有合作都只是孩子们制作游戏，它可能会变成一个典型的“极客俱乐部”。以如此有条理的方式构建项目，需要人们能够识别项目的组成部分、分配任务、确保按时完成，并且——也许最难的是——重新组装各部分以形成统一整体。这种方法具有极高“天花板”的特征——利用模块化将编程任务分解为一系列独立系统。但Scratch社区和Scratch编程语言一样，也提供了“宽墙”，而在绿熊制作公司中发挥重要作用的社交，在网站一些最常见的合作中扮演着更突出的角色。


    Large Scratch collaborations among four or more members usually occur through
    digital “chain letter” projects in which an individual user creates a project
    that prompts other users to contribute to its content. Examples of these digital
    chain letter projects are “Add yourself to the group photo” in which other users
    are invited to share a picture of themselves or their avatars to the Scratch stage
    (Figure 4.3). Others include “Add yourself to the race,” “Add yourself as a baby,”
    and “Add yourself as the Scratch Cat.”


    四个或更多成员之间的大型Scratch合作通常通过数字“链式信件”项目发生，即单个用户创建一个项目，促使其他用户为其内容做贡献。这些数字链式信件项目的例子包括“把自己加到合影中”，其中邀请其他用户分享自己或虚拟形象的照片到Scratch舞台（图4.3）。其他包括“把自己加入比赛”“把自己加为婴儿”和“把自己加为Scratch猫”。


    These chain letter projects lack complex coding, but they make up for it in popularity,
    often attracting thousands of contributors, which helps users—particularly new
    users—to establish a sense of community at the website. Contributing to these
    low-threshold projects is pressure-free and playfully social rather than focused
    on a particular end goal. Young users can contribute to a project with hundreds
    of others in a low-pressure environment.


    这些链式信件项目缺乏复杂编码，但它们在受欢迎程度上弥补了这一点，通常吸引数千名贡献者，这有助于用户——尤其是新用户——在网站上建立社区归属感。参与这些低门槛项目没有压力，充满趣味性和社交性，而不是专注于某个特定最终目标。年轻用户可以在低压环境中与数百人一起为项目做贡献。


    This ability to “add and pass on” also serves as the basis for one of the most
    interesting forms of online collaborations at the website—role-playing games (RPGs)—in
    which users use the galleries section to spin storylines of assorted characters
    and plot twists. Most of these RPG storylines are serialized through the comments
    section underneath a project, and the project serves as a place to add visuals
    (like characters and settings) that are based on the developments in the RPG.
    Currently, more than five thousand Scratch galleries have RPG in their titles
    or descriptions, with group sizes ranging from a few members to a thousand players.
    The largest RPG included over 600,000 comments, nearly two thousand projects,
    and about a thousand players.


    这种“添加并传递”的能力也为网站最有趣的在线合作形式之一——角色扮演游戏（RPG）——提供了基础。在RPG中，用户利用画廊部分编织各种角色和情节转折的故事线。大多数RPG故事线通过项目下方的评论区连载，而项目则作为一个添加视觉元素（如角色和场景）的地方，这些视觉元素基于RPG的发展。目前，超过五千个Scratch画廊的标题或描述中包含RPG，小组规模从几名成员到一千名玩家不等。最大的RPG包含超过600,000条评论、近两千个项目以及约一千名玩家。


    ![](img/9eb64eca0f040452d3ba8df0d78b35a9_83_0.png)


    **图4.3** 受欢迎的Scratch“Add yourself”链式项目精选：“把自己加入比赛”“把自己加为婴儿”和“把自己加为Scratch猫”。


    Some popular RPGs at the Scratch website are fan-based and draw on the characters
    and storylines from books and movies (like the Harry Potter books and films) and
    television shows (such as *Twilight*). Popular fiction (like the Warriors series
    of young adult novels) is another source. The Warriors novels follow the adventures
    of four cat clans who live in the forest and deal with issues of loyalty and friendship.
    One RPG, Warriors of the Blue (WOB), includes roughly 250 members, 80 percent
    of whom are girls. Like Green Bear Productions, WOB encourages members to participate
    but is maintained by a central moderator (screen name “MidnightBlaze”) who sets
    the rules for stimulating plot development. The WOB gallery includes a long description
    of the Warriors’ world that was written by MidnightBlaze and describes the rules
    for participating in the group. As with Green Bear Productions, people need to
    ask permission to join WOB, which is granted by WOB creator MidnightBlaze and
    a few other longstanding members. Likewise, in role-playing, MidnightBlaze assumes
    a more prominent role as the collab’s creator. She guards the stories by providing
    prophecies (a central element of the Warriors novels), correcting members if they
    get an element wrong, and supporting a culture where members ask for her permission
    before they move forward with new ideas. In fact, members curry her attention,
    showing delight when she replies to comments or sulking in frustration when she
    ignores them. MidnightBlaze’s leadership is thus enacted through her own actions
    and through the interactions of others who reinforce her position (even in her
    absence) and who extend her authority by policing on her behalf.


    Scratch网站上一些流行的RPG是粉丝向的，取材于书籍和电影（如《哈利·波特》书籍和电影）以及电视节目（如*《暮光之城》*）中的角色和故事线。流行小说（如青年小说《猫武士》系列）是另一个来源。《猫武士》小说讲述四个生活在森林中的猫族部落的冒险，处理忠诚和友谊问题。一个RPG，“Warriors
    of the Blue”（WOB），包括大约250名成员，其中80%是女孩。像绿熊制作公司一样，WOB鼓励成员参与，但由一位核心版主（网名“MidnightBlaze”）维护，她制定刺激情节发展的规则。WOB画廊包含一段由MidnightBlaze撰写的关于《猫武士》世界的长描述，并描述了参与该小组的规则。与绿熊制作公司一样，人们需要请求许可才能加入WOB，由WOB创建者MidnightBlaze和其他几位长期成员授予。同样，在角色扮演中，MidnightBlaze作为合作创建者扮演更突出的角色。她通过提供预言（《猫武士》小说的核心元素）来守护故事，在成员弄错元素时纠正他们，并支持一种文化：成员在推进新想法之前先征求她的许可。事实上，成员们会博取她的关注，当她回复评论时表现出高兴，而当她忽略他们时则沮丧地生闷气。因此，MidnightBlaze的领导力通过她自己的行动以及他人的互动得以实施，其他人（即使她不在场）强化她的地位，并替她维持秩序来延伸她的权威。


    Like the add-on chain letter projects, WOB’s development of storylines in the
    Comments feature is another low barrier for participation. But there are additional
    and more explicit rules as well. The site owner, MidnightBlaze, vets all storylines
    and removes comments that do not adhere to the narrative of the Warriors novels.
    In addition, she and other longstanding members supplement the narrative by programming
    characterizations, basic animations, and background music on the Scratch screen
    based on the comments-based storyline (Figure 4.4). Thus, the most popular characters
    and storylines are, in a sense, identified and rewarded by MidnightBlaze.


    像附加式链式信件项目一样，WOB在“评论”功能中发展故事线是另一个低参与门槛。但也有额外且更明确的规则。网站所有者MidnightBlaze审查所有故事线，并删除不符合《猫武士》小说叙事的评论。此外，她和其他长期成员根据基于评论的故事线，在Scratch屏幕上编程角色设定、基础动画和背景音乐来补充叙事（图4.4）。因此，从某种意义上说，最受欢迎的角色和故事线是由MidnightBlaze识别并奖励的。

