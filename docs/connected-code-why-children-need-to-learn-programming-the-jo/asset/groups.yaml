    \n互联代码：为什么儿童需要学习编程 / Yasmin B. Kafai 与 Quinn Burke.\n\n页 cm. —（约翰·D与凯瑟琳·T·麦克阿瑟基金会数字媒体与学习系列）\n\
    \n包含参考书目和索引。\n\nISBN 978-0-262-02775-5（精装：碱性纸）—978-0-262-52967-9（平装）\n\n1. 计算机与儿童。2.\
    \ 计算机编程——学习与教学（中学）3. Scratch（计算机程序语言）4. 建构主义（教育）I. Burke, Quinn, 1976– II. 书名。\n\
    \nQA76.9.C6599C372 2014\n\n004.083—dc23\n\n2014003658\n\n献给西摩，并献给尼拉\n\n## 系列前言\n\
    \n数字媒体与网络已嵌入我们的日常生活，并成为我们参与知识生产、交流与创造性表达的一部分。与计算机和基于计算机的媒体的早期阶段不同，数字媒体如今已司空见惯且无处不在。数字媒体已突破专业与正式实践的边界，也走出了最初推动其发展的学术、政府和产业家园，被多样人群和非制度化实践所采用，包括青少年的同伴活动。尽管技术采用的形式多种多样，但一代人正成长于这样一个时代：数字媒体已成为学习、游戏和社会交流中习以为常的社会与文化结构的一部分。\n\
    \n本丛书基于这样一个工作假设：沉浸于新数字工具与网络之中的人，正在对语言、游戏、社会互动、问题解决和自我导向活动进行前所未有的探索，而这种探索导向多种形式的学习。这些多样化的学习形式体现在身份、独立性和创造力的表达中，也体现在学习、运用判断和系统思考的能力中。\n\
    \n本丛书的界定框架不是某种特定的理论或学科路径，也不是一组固定主题。相反，本丛书围绕一组从多种学科与实践框架加以探究的主题展开。本丛书关注青年、学习与数字媒体之间的关系，但丛书中的每一部作品可能只涉及这一主题群中的某个子集。设立严格的主题边界会排除该领域一些最重要的作品。例如，若将丛书内容仅限于某一年龄段的人群，就等于在该现象本身要求相反处理时人为固化年龄边界。对于新的在线参与形式而言，这尤其成问题，因为其一个重要结果就是不同年龄参与者的混合。数字媒体也是如此，它们日益与模拟媒体及更早的媒体形式不可分割。\n\
    \n本丛书回应我们媒体生态中的变化，这些变化对学习具有重要影响，并涉及新的媒体素养形式和媒体参与方式。数字媒体是互动媒体（尤其是游戏）、在线网络与既有媒体形式之间融合的一部分。穿行于这一媒体生态需要多种素养，这些素养正通过实践得到界定，但在被纳入教育举措之前，仍需更多学术审视。媒体素养涉及理解、解释和批判媒体的方式，也涉及创造性表达与社会表达、在线搜索与导航的手段，以及一系列新技术技能。素养与参与技能方面可能存在的差距，为那些努力连接课堂内外媒体参与的教育工作者带来了新挑战。\n\
    \n由麻省理工学院出版社出版的“约翰·D与凯瑟琳·T·麦克阿瑟基金会数字媒体与学习系列”，旨在弥合这些差距，并为思考和使用新的知识生产、交流与创造性表达形式提供创新方式。\n\
    \n## 序言\n\nMitchel Resnick\n\n我三十多年前第一次见到西摩·帕佩特。他当时正在西海岸计算机博览会上演讲，那是早期个人计算机爱好者的一次自由奔放的聚会（从许多方面说，它是当今创客嘉年华的前身）。在演讲中，帕佩特描绘了一个愿景：计算机将成为儿童生活不可或缺的一部分。他描述了儿童将如何为计算机编程，以控制机器人、创作音乐、设计游戏、开发模拟程序，并开展许多其他创造性活动。\n\
    \n在当时，这是一个大胆而冒险的梦想，许多人认为它极不切实际。个人计算机刚刚问世，很少有儿童能够接触到它们。但在过去三十年里，帕佩特愿景的许多方面已成为现实。世界各地数以百万计的儿童以多种形式与计算互动——电子玩具、移动电话、游戏机、笔记本电脑和平板电脑。他们还使用计算设备参与各种活动，例如玩游戏、与朋友聊天、探索虚拟世界以及在线搜索信息。\n\
    \n与此同时，帕佩特愿景中的重要内容仍未实现。帕佩特设想的世界是：儿童不仅与预先制作好的计算机应用程序互动，还会使用计算媒体进行设计、创造和编程——并在此过程中学习重要的解决问题技能和项目设计策略。\n\
    \n帕佩特的梦想后来怎样了？20世纪80年代，人们最初对教儿童学习计算机编程（或编码）充满热情。成千上万所学校使用帕佩特的 Logo 编程语言教数百万学生编码。但这种热情并未持续。在大多数学校里，计算机变成了一台用于传递和获取信息的机器。\n\
    \n"
