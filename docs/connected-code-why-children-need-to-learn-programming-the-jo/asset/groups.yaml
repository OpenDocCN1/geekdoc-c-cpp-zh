    commitment to “doing it ourselves” through a mutual DIY ethic. Schools may be
    able to incorporate some of the methods of these informal collaborative communities
    (particularly creative production and networked participation) in their own formal
    environments. These aspects of the DIY culture provide promising models for how
    schools can adapt their approaches to learning and teaching with computers in
    the digital age. And schools certainly have such a responsibility.


    Despite the upsurge of DIY youth communities, these communities represent a small
    portion of the youth population.<sup>8</sup> Most children use their devices—whether
    laptop, iPad, iPhone, or Droid—to consume commercial media. Computers may have
    become extensions of ourselves, but to what extent are we teaching children how
    to design and manage these extensions? How do we help children become producers
    and not just consumers of digital media? What role should programming play in
    facilitating such production, and how can schools best help children to develop
    literacies for the twenty-first century? With the universal prominence of digital
    media, do we need to be concerned about equity issues of access and participation?
    Given that these questions involve individual identity, social well-being, and
    the wider economic viability of this country, we need to revisit the question
    of what it means to be literate in today’s society. One way to do this is to return
    to the ideas that led Papert to establish computer coding circles in schools and
    situate these ideas in today’s educational, cultural, and technological environments.


    This first push to put programming in schools was inspired by Papert’s 1980 book
    *Mindstorms: Children, Computers, and Powerful Ideas*, in which he argued that
    by programming computers, children could learn about mathematics, new topics such
    as cybernetics, and their own thinking (according to the progressive views of
    education promoted by John Dewey, Paulo Freire, and Maria Montessori). The book
    was controversial but also helped educators around the globe to see the value
    of having computers in schools. *Mindstorms* promoted a vision of computers in
    school that came alive through the coding circles of Project Headlight described
    in the introductory vignette.


