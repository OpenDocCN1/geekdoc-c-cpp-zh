    \n![](img/9eb64eca0f040452d3ba8df0d78b35a9_87_0.png)\n\n# Scratch Collab Challenge\n\
    \nWhat can you and other Scratchers create together using three images and a lot\
    \ of imagination? We've created the Scratch Collab Challenge to find out.\n\n\
    +   1. Register your group or collab here as soon as possible.\n+   2. Make a\
    \ project with your collab that uses these three images. Be creative in using\
    \ the sprites.\n\n![](img/9eb64eca0f040452d3ba8df0d78b35a9_87_1.png)\n\n![](img/9eb64eca0f040452d3ba8df0d78b35a9_87_2.png)\n\
