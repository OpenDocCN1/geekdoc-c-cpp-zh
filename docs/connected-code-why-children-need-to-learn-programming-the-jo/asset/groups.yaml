    a way to see math. Together, along with the coding, talking and seeing also constitute
    computational participation. Through the object, learners grasp a way to think,
    connect, and communicate. Debbie''s house also illustrates personal appropriation.
    This was a dramatic shift in Debbie''s relationship to fractions. At the beginning
    of class, she and others seemed uninterested in the project, and she seemed to
    go through the motions of creating worksheet-like exercises in her program. But
    the house scene changed her attitude, partly because of the recognition that she
    received from classmates for her original design. For Debbie, the design and creation
    of the house demonstrated her knowledge of fractions and also gave her an object
    by which she could meaningfully demonstrate her knowledge to her own peers. As
    Paper explains, “The shifts in Debbie''s thinking were not just a matter of knowing
    facts and skills. Her phrase ‘you can put them [i.e. fractions] on top of anything’
    showed an epistemological shift and an epistemological intention. She made a shift
    from one kind of knowledge (formal, teacher knowledge) to another kind of knowledge
    (personal, concrete, her own).”12 Debbie''s project made fractions real to her
    and to her audience (Naomi, her other classmates, and the third-graders). Previously,
    fractions had existed only in classrooms, and even within those narrow confines,
    they were further restricted to the confines of the teacher''s blackboard and
    to Debbie''s worksheets. “Do you like the colors?” she asks Naomi about the fractions—not
    “Is this right?” or “Can you check if this is correct?” The fractions are fully,
    intimately hers.


    Paper also notes of Debbie that “one day she realized that the programming technique
    she used to decorate her animations could also be used for making her fraction
    representations more visually interesting.”13 This point captures the shift from
    programming code to thinking computationally in terms of such code. When Debbie
    was talking about making everything in her house scene a half, she had to conceive
    of all the halves that had to be created and consider the governing operation
    that would divide the number of steps that the Logo turtle would draw into half.
    This entailed coordinating multiple representations, including linking the numeric
    representation of “½,” the textual representation of “one half,” and a visual
    representation of one half of the object itself (whether it was a door, wagon,
    or roof). Debbie engaged with programming in designing and debugging Logo problems,
    but she also connected with the coding process on a computational'
