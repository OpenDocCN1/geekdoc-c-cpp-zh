    labs and classes could look like when crafting and computing provide new materials,
    activities, and audiences for learning.


    # Shop Classes for the Next Millennium: Animated Pop-Up Books, Game Arcades, and
    Public Displays


    In new clubhouses, community centers, and afterschool programs, students will
    be able to interact with computers to communicate, receive, and organize information.
    But new clubhouses cannot bear the sole responsibility for teaching children to
    think systematically and creatively using computers. School classrooms need to
    embrace the hands-on, creative technical learning that has been fostered in peripheral
    clubs. In the vocational education and industrial arts courses of the 1950s, students
    used technology collaboratively and constructively in real-life applications.
    By the 1970s, however, some reformers were characterizing such classes as pointless
    or unchallenging, even though they made education more hands-on, practical, and
    project-driven and represented some of the most innovative thought in education,
    particularly the progressive ideas of John Dewey in *Experience and Education*.^23


    The promise of hands-on and creative learning through technology has not been
    forgotten. More than a decade ago, computer scientists and educators Mike and
    Ann Eisenberg envisioned a next generation of shop classes that would include
    computational media and crafts—what they called computer-enriched handicrafts.^24
    Shop classes, which often are taken by students who are not going on to college,
    can engage all learners in designing and understanding technology by blending
    computation and material artifacts. This revaluation of the concrete for learning
    has also been supported by education writer Mike Rose, who has analyzed the intellectual
    dimensions of trades, crafts, and arts. Most educational research has focused
    on understanding learning and teaching in academic disciplines such as science,
    mathematics, and language arts and has paid little attention to the intellectual
    demands and opportunities found in plumbing, carpentry, and waitressing. Yet building
    robots and crafting electronic textiles are compelling illustrations of how crafting,
    engineering, and computer science can generate rich and engaging learning contexts.


    One unexpected direction for next-generation shop classes has been a return to
    paper and paint, enhanced with conductivity and computation.'
