    ![](img/9eb64eca0f040452d3ba8df0d78b35a9_113_0.png)


    **Figure 6.1** LEGO TC Logo (top) and Lego Mindstorms box (bottom). Photos courtesy
    of The Lego Group.


    rebuild and animate robots from the popular Star Wars movie franchise. Robotic
    technologies and materials that previously were available only to students in
    college classes and university labs were now accessible and relatively affordable
    for schools and families. Programming instruction in terms of Basic, Logo, and
    Pascal had long been abandoned by school computer labs, so learning programming
    and engineering via robotics entered through the backdoor of afterschool clubs.
    Over the years, afterschool robotics clubs became one of the few places in many
    K–12 schools where programming and engineering found a home, but this home was
    consistently outside the standard curriculum.


    Robotics in K–12 also brought with it a new model for displaying and sharing designs—competitions.
    These competitions grew out of January robotics classes at MIT that gave engineering
    students hands-on experience in actual soldering and building physical things
    during the intersession period.⁵ Each robotics class culminated in a public competition
    in a large auditorium filled with cheering students. Challenges were often mundane
    tasks, such as gathering scattered ping-pong balls and moving them to the other
    side of a table. But given that the robot was the sole actor on the stage, these
    everyday tasks took considerable forethought and revision on the part of the engineering
    teams.


    Robotics competitions have become science fairs with a new edge, providing public
    exposure and authentic audiences for typical robot design challenges (such as
    building a tower, running through a maze, or collecting ping-pong balls and moving
    them to the other side of a table). The FIRST (For Inspiration and Recognition
    of Science and Technology) Lego League meetings started in 1992, and now high
    schools from all over the country and across the world participate at local, regional,
    and national levels.¹⁰ A recent study conducted by Brandeis University and commissioned
    by the FIRST Lego League reported positive influences on participants'' attitudes,
    skills, knowledge of science and technology, and sense of self-confidence.¹¹ Furthermore,
    participation in these activities, often motivated by teachers'' or parents''
    encouragement, was highly correlated with later career choices in science, technology,
    engineering and mathematics (STEM) majors.


    Although the robotics competitions are now considered an established and in many
    places the only part of creative computing and engineering cultures in K–12 schools,
    they have not reached everyone. They have been only marginally successful in increasing
    the participation of girls and minorities.


    ![](img/9eb64eca0f040452d3ba8df0d78b35a9_115_0.png)


    ![](img/9eb64eca0f040452d3ba8df0d78b35a9_115_1.png)


    **Figure 6.2**

    Boys playing with Lego Mindstorms (top) and examples of robots (bottom). Photos
    courtesy of The Lego Group.


    In academic year 2008–2009, 7,800 teams participated in the FIRST Lego League
    robotics competition, and 70 percent of youth participants were boys and white.
    This finding seems to reflect the equally marginal participation of girls and
    underrepresented groups in science fairs, especially in physical, earth, and math
    or computer science projects.¹² In addition, robotics teams are limited to how
    many students can participate, so the activities do not easily scale up. Paying
    for materials and for travel to robotics competitions is expensive, often requiring
    schools to conduct extensive fundraising events to finance afterschool robotics
    programs and participation in out-of-state competitions.


    Finally, the competitions are an audience for the learning project. Although building
    robots in response to specific design challenges is a rich learning and collaboration
    experience,¹³ the winner-takes-it-all approach that is promoted in competitions
    might not appeal to some people. Competitions provide an authentic and rewarding
    audience, but judging by the growing number of online competitions, they seem
    to have become the default audience for all digital media designs judging. The
    STEM National Video Game Design Challenge and dozens of others have become the
    central outlet for game designs in schools.¹⁴ Although competitions provide a
    valuable audience, they cannot and should not be the only outlet that can engage
    youth in computational participation, especially if we know about their rather
    limited track record in reaching out and broadening participation.


    Many afterschool programs and community technology centers and organizations have
    done the job that K–12 schools have failed to do in terms of introducing the creative
    power of computing. But too many of these clubhouses fail to broaden participation
    in the discipline and instead mirror the geek clubs that many see as the face
    of computing. What if organizations created new clubhouses with different materials
    and activities rather than aim to bring everyone into the existing model? This
    is exactly the question that computer scientist Leah Buechley and others asked
    and answered when they set out to develop a new category of computational construction
    kits that involved textiles instead of bricks and crafting in addition to engineering.


    ## Opening New Clubhouses: Electronic Textiles


    Textile construction kits, also called electronic textiles (e-textiles), are a
    fairly recent development. E-textiles are programmable garments, accessories,
    and costumes that incorporate elements of embedded computing that allow the behavior
    of fabric artifacts to be controlled. Designing e-textiles can involve novel materials
    (such as conductive fibers or Velcro), sensors for light and sound, actuators
    (such as LEDs and speakers), and traditional aspects of textile crafts. One popular
    e-textile construction kit is LilyPad Arduino,¹⁵ which enables novice engineers
    and designers to embed electronic hardware into textiles (figure 6.3).


    To make an e-textile, designers sew LilyPad modules together with conductive thread
    and employ the popular Arduino or ModKit development environments to program the
    LilyPad microcontroller to manage sensor and output modules (like LEDs) in their
    designs.


    Since its commercial release in 2007, LilyPad Arduino has been widely adopted
    by designers and engineers of all ages from around the world and employed in a
    number of universities in computer science, engineering, fine arts, and design
    courses. E-textiles can be considered a part of a larger DIY movement to promote
    personalized fabrication outside of traditional manufacturing that can also extend
    into classrooms, as the following examples from an e-textile high school class
    illustrate (figure 6.4).


    What do people learn when they craft e-textile designs? Students learn about sewing
    and other types of crafting that often is found in vocational education or leisure
    time but usually not in the context of traditional school topics such as science
    and mathematics.


    In addition, students learn about engineering when they design functional circuits
    by connecting alligator clips to batteries, switches, and LEDs; align polar ends
    of LEDs; knotting thread ends; and sewing these to fabric. Students also learn
    how to program and remix Arduino code, which controls and executes the desired
    behaviors of sensors and actuators, thus providing a context for engaging with
    computational concepts and practices.¹⁶


    Leah Buechley, who invented the LilyPad Arduino, argues that such design learning
    makes transparent the different layers and connections of technology that are
    often hidden in the commercially available technologies that come in shiny cases
    and reveal little about their underlying


    **Figure 6.3**

    LilyPad Arduino and components: A turn signal jacket (top) and sewing with conductive
    thread (middle right) and LilyPad, sensors, and battery holder (middle left).
    A group of students at an e-textile workshop at the Franklin Institute (bottom).
    Photos by Eunkyung Lee.

