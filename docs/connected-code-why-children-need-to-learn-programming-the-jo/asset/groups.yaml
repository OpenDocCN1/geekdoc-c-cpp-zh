  mdcn: "\n\n研究员露西·卡尔金斯（Lucy Calkins）^23的“Scratch 作家工作坊”让一班中学生通过一系列迭代来创作并编写他们的数字故事。学生们在作家笔记本中起草想法，在故事板上绘制叙事阶段，将这些铅笔故事板转化为\
    \ Scratch，并使用作品集来记录进度、与同伴分享持续进行的工作。全班约有 90% 的学生完成了叙事作品。该工作坊展示了这种结构化模型以及现有的英语和语言艺术框架在多大程度上可以被用来促进编程学习，并将其视为一种写作形式。^24\n\
    \n研究结果令人鼓舞。超过 90% 的学生使用 Scratch 完成了自己的数字故事，这些叙事运用了多种语言艺术修辞手法（如静态与动态人物塑造）和编程特性（如循环）。许多参与者开发了基于他们先前用纸笔绘制的短篇漫画小说的情节线，这让他们更好地理解了媒介在引导故事结构方面所扮演的角色（图\
    \ 3.3）。所有学生都是新手程序员，他们在讲故事工作坊中学习了基本的编程概念。但同样显而易见的是，写故事更倾向于线性结构，而非游戏叙事中常见的分支条件语句。让学生参与交互式故事的编程，是众多与现有课堂模式相衔接的课程设计之一。它也可能是初学者进入计算思维和参与式学习的一个切入点。我们需要扩展\
    \ Scratch 作家工作坊的边界，引入更广泛的编程变量，以便进一步揭示叙事与计算思维在课堂中的交汇点。\n\n这项研究表明，故事能够激发儿童对编程的兴趣，而\
    \ Scratch 作家工作坊则通过将编程过程呈现为一系列相互关联的实操步骤，为学生和教师揭开编程的神秘面纱。这样的框架强调了编程与写作作为相互关联的创作过程之间的联系。Scratch\
    \ 中的数字叙事——尤其是工作坊对人物塑造和情节分析的关注——提供了一种新媒介，儿童可以通过它锻炼在传统读写课堂上学到的创作技能，并在年幼时便开始接触编程。\n\
    \n尽管讲故事和编程是该模式的核心组成部分，并且服务于相同的最终目标，但工作坊是分别引入它们的。计算思维强调算法的实用性和创造性功能，为连接编程与写作提供了一种新途径——两者都试图通过清晰的输入来达成特定的输出。《Make》杂志最近与国家写作项目<sup>25</sup>的合作正是基于这一前提。他们为读写教师举办的工作坊强调教师作为课堂“创客”的角色，并将学生写作视为一种有形的“产品”，其中技术性与创造性相互交织。数字故事是将图像与声音进行系统性编码并置于审美并置中的产物，而\
    \ Scratch 中的数字故事同样是这样一种“产品”，它同时体现了创作中技术与创造性元素，并提供\n\n![](img/9eb64eca0f040452d3ba8df0d78b35a9_62_0.png)\n\
    \n图 3.3  \n来自 Scratch 作家工作坊项目“在游乐场”的截图，作者是八年级学生 Andres，基于他自己的漫画小说创作。\n\n最初的计算机俱乐部取得了巨大成功，以至于在波士顿建立了更多俱乐部，并在英特尔公司的支持下，扩展到其他城市和国家。所有计算机俱乐部都为青少年提供各种软件，包括编程软件（如\
    \ Microworlds Logo）、Microsoft Office、Bryce 5、Painter 7、RPG Maker™，以及视频、摄影和声音编辑软件。尽管所有计算机俱乐部都拥有活跃的设计文化，但编程最初只存在于少数俱乐部中，并且与蓬勃发展的\
    \ Photoshop 文化相比，是一项相当边缘的活动。⁴⁷ Scratch 被设计为一种媒体制作工具，以便计算机俱乐部的年轻人能够为自己热爱的游戏、数字故事、模拟、交互艺术、舞蹈视频或其他类型作品编写应用程序。\n\
    \n年轻人如何以及为何从软件包的使用者转变为数字媒体应用的 Scratch 设计者，恰恰体现了编程的激励性吸引力。2004 年秋，当首个版本的 Scratch\
    \ 在洛杉矶的一家计算机俱乐部推出并安装在数台电脑上时，很少有成员使用这款新软件创作任何作品。但在 2005 年冬，源源不断的本科生导师加入俱乐部，既提供帮助，也自己学习编程。随着年轻成员互相鼓励尝试该程序，导师们协助年轻人创建他们的第一个\
    \ Scratch 项目，Scratch 活动出现了显著增长。导师们常常邀请从未接触过 Scratch 的年轻人导入他们存储在俱乐部服务器文件夹中的数百张截图和图形文件，以此吸引他们参与。当时，服务器上的青少年项目大多只是纯图形作品。但在\
    \ Scratch 推出后的几个月内，Scratch 屏幕设计的打印稿开始贴满俱乐部的墙壁，并成为领先的设计活动。\n\n到 2006 年冬，对 Scratch\
    \ 的兴趣与日俱增，俱乐部文化中也在涌现新变化。Scratch 成为当地俱乐部文化中成员身份的象征，在中央服务器上创建和存储 Scratch 项目供他人游玩，将此前罕见且孤立的编程活动转变为一项公共事务。此外，青少年团体开始协作创建项目，并为自己起了响亮的队名，比如\
    \ “DGNM”，代表 “Dang Good Money Makers”。教育研究员凯莉·佩普勒观察发现，年轻人开始独立于导师的支持，独自应对他们在 Scratch\
    \ 中遇到的复杂项目和问题。而且可以看到，年轻人在 Scratch 上相互指导，有些人成长为全能专家，导师、协调员和其他年轻人都向他们请教；另一些人则专精于\
    \ Scratch 中的某些特定类型或技巧，同样会受到同伴和导师的请教。²⁸\n\n一个令人瞩目的电子游戏设计案例是 “Metal Slug Hell Zone\
    \ X”。它出自 15 岁的拉丁裔设计师 Jorge 之手，灵感来源于一款同名的热门电子游戏。²⁹ 原版《Metal Slug》是一款未来风格的“跑动射击游戏”，以其幽默、流畅的手绘动画和快节奏的双人合作动作著称。Jorge\
    \ 将自己对电子游戏的热情和经验带到了俱乐部，在那里，他大部分时间都在制作涉及电子游戏复刻的 Scratch 项目。“Metal Slug Hell Zone\
    \ X” 是他的第二个项目，融合了原版游戏中的许多标志性特性，还加入了一些新颖而出乎意料的功能。游戏的开始界面相当传统——一个标题画面列出了四个可供玩家按键选择的化身。游戏场景始于一片荒芜的紫色沙漠和缓缓移动的云朵。玩家可以使用方向键控制所选化身前进或后退、蹲下、跳跃以及射击。从开场动画、化身选择、背景卷动到动作元素，可以看出\
    \ Jorge 凭借自己对《Metal Slug》系列的既有认知和电子游戏兴趣，将之与 Scratch 建立了联系，从而完成了自己的电子游戏。\n\n“Metal\
    \ Slug Hell Zone X” 耗时数月才设计完成，它融合了堪称计算思维典范的复杂技术特性。Jorge 通过运用困难的编程概念——包括变量、循环、条件语句、通信与同步命令（如发送广播和“当接收到”消息）以及布尔逻辑——发现了如何实现横版卷轴游戏和复杂的动画效果。设计这款游戏激发了\
    \ Jorge 投入编程的热情。他学会了如何为交互式玩法做设计，并多次重新设计自己的程序，他发现，设计一个响应标准按键（如左右方向键）而非键盘上任意字符的游戏，对用户更加友好。此外，他使用的是一整套创意软件，而不仅仅是编程软件。借助\
    \ Scratch 画图编辑器（一款图像编辑器），Jorge 为化身的移动制作了逼真的动画效果。他还会根据游玩原版电子游戏的过程绘制草图\n\n"
