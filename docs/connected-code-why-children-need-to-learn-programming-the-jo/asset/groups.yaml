    *Generation M²: Media in the Lives of Eight- to Eighteen-Year-Olds* (Rideout,
    Foehr, and Roberts 2010) and M. Ito et al.''s *Hanging Out, Messing Around, and
    Geeking Out: Living and Learning with New Media* (2009). For more details on the
    nature and dynamics of participation in social networks, see Yochai Benkler''s
    *The Wealth of Networks: How Social Production Transforms Markets and Freedom*
    (2006), and on the DIY movement, see David Gauntlett''s *Making Is Connecting:
    The Social Meaning of Creativity from DIY and Knitting to YouTube and Web 2.0*
