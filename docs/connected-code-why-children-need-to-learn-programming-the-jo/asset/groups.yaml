    protocol, Scratch members often repurpose and reupload projects that they find
    online without giving credit to the original creators. To address this lack of
    formal recognition, the Scratch team considered ways that attribution could be
    built into the site. Scratch researcher Andrés Monroy-Hernández added an automated
    attribution feature to the site that produced remix visualizations. This automated
    attribution allows users to track the development and repurposing of projects,
    which are now commonly referred to as “Scratch remix trees.” Branching out on
    the screen like a family tree, these automated visualizations can be accessed
    with the click of a button, displaying all of the remixes of any single project
    (and whether the project itself is a remix) (figure 5.1).


    By directly linking remix trees to their antecedents based on the source code,
    these visualizations ensure that credit is given where credit is due.<sup>10</sup>
    Whether or not an individual user gives attribution to a fellow user in the project
    notes section, the remix tree is automatically generated, linking a project to
    the source metadata. This automatic attribution fosters a sense of fair play online,
    and the remix trees help facilitate the overall communal feel of the website.
    Although Scratch users appreciate and add to the community by friending each other,
    connecting on the Forums section, and adding “Love Its” to the projects that they
    most appreciate, remix trees highlight the communal nature of the website regardless
    of whether individual users formally recognize such sociability. Common interests
    in terms of project content and coding scripts become more discernible with remix
    trees. The way that one attains a “high status” at the website also becomes more
    discernible because the projects that are at the “root” of remix tree “branches”
    (those that are most frequently remixed) are selected to appear on Scratch’s highly
    coveted “front page” display, which has a “What the community is remixing” section
    among other categories.


    ![](img/9eb64eca0f040452d3ba8df0d78b35a9_96_0.png)


    **Figure 5.1** A remix tree for vortex19’s project “Add Your Character Jumping
    While Somewhat Fitting Music Plays.” The source project is highlighted at the
    bottom center of the remix tree as are two other projects along the remix chain.
    Clicking on any one of the fifty-six screens links to the individual remix.


    Thus, individual status, communal goodwill, and overall productivity all play
    key roles in understanding why youth choose to remix each other’s work at the
    Scratch website. But what do these remixes actually look like, and what coding
    schemes do they use? Do the look and feel of a remix vary based on the user’s
    reasons for remixing? To answer these questions, it is helpful to return to media
    researcher Mizuko Ito and colleagues’ categories of “hanging out,” “messing around,”
    and “geeking out” to explore why youth opt to use digital technologies.


    ### Hanging Out: Remix as Socialization


    As with Scratch collaborations that have been designed to involve as many participants
    as possible, one of the most basic forms of remix entails projects that were created
    to invite others to reuse and modify their code and images. The primary goal of
    these “hanging out” remixes is to invite others to join the project as a way to
    facilitate a joint social experience. What distinguishes “hanging out” in Scratch
    is that these “add-on” projects often connect users who have never had any offline
    relationship. As is evident in the three examples in figure 5.2, the project titles
    tend to double as invitations and act as a basic, but fundamental, way to connect
    with others at the site. Although the code is altered in the process of adding
    another character, sound, or scene, such alteration usually entails accumulation
    and not revision. This type of remix tends not to change the existing code but
    builds on it with additional lines. Given that the goal is to generate connections
    through such remixes, it is important to be inclusive of what already has been
    added and what can be added. Altering another’s code to change an existing appearance
    or modify behavior may ultimately make for a more efficient project, but it also
    can be perceived as a direct challenge by other users, jeopardizing online relationships
    that are typically already tenuous based on minimal collaboration.


    ![](img/9eb64eca0f040452d3ba8df0d78b35a9_97_0.png)


    **Figure 5.2** Three “hanging out” remixes: “Add Yourself as an Egg,” “Add Yourself
    Jumping on a Trampoline,” and “Add Yourself to Abbey Road.”


    These forms of remixes can be considered wide in the sense that they reach a large
    number of contributors. In their extended reach, however, they are also far less
    deep in producing wholly coherent projects with clear storylines, consistent rules
    of play, and articulated end goals. Despite this lack of depth in terms of content
    and coding complexity, the project-based socializations that are seen with these
    remixes are inherently productive. Connecting through a remixable Scratch project
    involves more personal commitment and creativity than simply connecting via Facebook
    or Pinterest because sharing on Scratch—unlike these other two sites—relies on
    exchanging self-generated content.


    ### Messing Around: Remix as a Pathway


    These social remixes represent a crucial first step in introducing new users to
    the possibility of leveraging others’ contributions to create something bigger
    and better. Although the Scratch website hosts projects that tap into television
    shows, movies, games, and books that are popular within youth culture, it can
    be daunting for young users to start using the software—particularly when they
    would like to generate their own interactive digital story or multilevel video
    game as their first foray into the Scratch community. Starting from the ground
    up is appealing to some new users but leaves other users unsure about where to
    start. These users are more interested in immersing themselves in already functional
    games, art, and stories than they are in working solely with the Scratch cat and
    a blank stage. By tinkering with existing Scratch content, new users have the
    satisfaction of maneuvering code that already has the semblance of a completed
    project while also putting their own unique spin on the project. Such tinkering
    also serves as an informal learning experience as new users frequently encounter
    Scratch blocks and scripts that allow for more complex project features (figure
    5.3).


    “I have to say if it weren’t for remixing, I would have never understood velocity
    or scrolling,” remarks fourteen-year-old Scratch member Chuck. But he also cautions
    that remix “should be used for things other than ‘add

