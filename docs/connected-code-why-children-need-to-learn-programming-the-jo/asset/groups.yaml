    role in making connections among what is being learned, how it is being learned,
    and who should learn it. Although these dimensions of connected learning are less
    tangible than other aspects, they are nonetheless key in understanding why computation
    has had such a difficult time taking roots in K–12 and why it is being promoted
    again today.


    This theoretical chapter focuses on the commonality that all individuals share
    as learners, and chapter 7 examines the teacher’s side of connected learning.
    In other chapters, we expand on various dimensions by illustrating how the programming
    of applications (chapter 3) can generate personal relevance and how an authentic
    audience (chapter 4) can provide support and feedback in ways that are unlike
    how children experience these things at school, at home, and with their peers.
    We also recognize that these communities come with certain mindsets, values, and
    histories. Nowhere is this more apparent than in the digital culture, where issues
    about equity and participation have been critical. Finally, we create artifacts
    that are visible and tangible signs of our participation (chapter 6). This is
    perhaps the most complicated relationship in learning, particularly because in
    a digital culture, most participation and production take place on the screen.
    By reevaluating the concrete as a mode of thinking and a form of digital production,
    we highlight a learning that is about objects to be made, to be thought with,
    and to be shared with others.'
