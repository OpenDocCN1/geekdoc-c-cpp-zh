    # Software Application Design Becomes Popular


    Today, design courses for applications (“apps”)<sup>31</sup> are increasingly
    popular and ought to be encouraged to broaden participation. By widening the walls,<sup>32</sup>
    programming can be applied to a range of design activities rather than just narrow
    technical ones. As eighth-grader Daryl noted after he completed his own digital
    story in the Scratch Writers’ Workshop, “Scratch can do almost anything. It has
    hundreds of controls, hundreds of images, and you can even take ones off the Internet....
    And so all you need to do is have a focus.”<sup>33</sup> Designing specific applications—whether
    video games or digital stories—represents such a focus, particularly when the
    applications are further grounded by personally and socially authentic learning
    contexts, such as game-making studios and writing workshops.


    Designing applications also can be considered a direct and accessible application
    of Jeannette Wing’s computational thinking. It captures key aspects of designing
    systems, solving problems, and understanding human behaviors because designing
    an application like a game or simulation involves the creation of a system that
    requires designers to think about how users will interface with the applications
    they design and how features can be implemented according to their intentions.
    On a personal level, designing applications has generated broad interest and a
    high success rate in getting youth interested in computer programming. Perhaps
    this is why making games for learning has interested many for-profit and nonprofit
    groups.


    Nowhere is this more evident than in the proliferation of video game-making competitions
    such as Globaloria’s Globey Awards, Advanced Micro Devices’ AMD Changing the Game
    contest, the Games for Change Awards, as well as the National STEM Video Game
