    critical thinking. And despite the fact that many K–12 schools have had the machines
    for over thirty years, little progress has been made in programming education.


    Those who would like to return programming to the schools need to articulate an
    argument that extends beyond the common desire to make children more rigorous
    thinkers. Learning how to think is an admirable goal, but it is a limited conception
    of what programming affords young learners. If programming is promoted solely
    as a more effective way to think (and not as an effective way to communicate logically
    and creatively), then we will again fail to understand what teaching and learning
    code can afford us in a networked age. Learning to code ultimately manifests its
    worth when it increases an individual’s capacity to participate in today’s digital
    publics. Programming is a form of expressing oneself and of participating in social
    networks and communities. In this book, we argue that computational thinking needs
    to be thought of as computational participation because the computer programs
    that are being created, used, repurposed, and shared have become our social connections.
    This view of code as connected has implications for how programming is learned,
    what is being designed, and where and how it is being shared.


    The development of creative and critical networks to share information and ideas
    stands as the model for students who wish to create a more collaborative and open
    society. It is not enough to be “hanging out” on the computer and “messing around”
    on occasion, as media researcher Mizuko Ito and colleagues discuss in their 2009
    book on youth engagement with digital media. Referring to a third category as
    “geeking out,” Ito and her colleagues note that few youth engage in such activity
    and that such engagement with technology is rarely found in schools. Computational
    thinking represents schools’ attempt to remedy this lack of engagement and provide
    children with the concepts and skills that will allow them to solve problems algorithmically.
    Computational participation focuses on the practices and perspectives that are
    needed to contribute within wider social networks, including but not limited to
    schools.¹¹ Within the wider network of creative and critical thinkers, educators
    have the chance to take the “geek” out of “geeking out” and set new academic and
    social norms for what it means to use technology meaningful.


    When computation is thought of in terms of participation and not just thinking,
    it becomes clear that there is a tremendous discrepancy in who'
