    Clubhouses）中青少年自主创作的基础上进一步发展。这种引入外部图像和声音的能力，使 Scratch 能够适应年轻用户的个人兴趣，并帮助他们了解程序的功能。三年来，洛杉矶和波士顿的一小群
    Clubhouse 成员使用并测试 Scratch，他们耐心地试用一个又一个原型，反复修改自己的程序，并为我们提供了宝贵反馈，说明他们喜欢制作什么、哪些地方令人困惑。


    从这些早期探索活动中可以明显看出，Clubhouse 成员喜欢为自己的作品找到观众，并经常轮流交换电脑座位，以便观看和试玩彼此的作品。当青少年编写出新功能或玩自己新编写的游戏时，他们会兴奋地隔着房间互相呼喊。显然，除了调整编程语言之外，我们还需要致力于支持
    Scratch 程序的协作与分享。当时还是麻省理工学院媒体实验室研究生的安德烈斯·蒙罗伊-埃尔南德斯（Andrés Monroy-Hernández）创建了一个可以在互联网上分享
    Scratch 程序的在线社区，他将其称为“ScratchR”，这个名字参照了当时新近流行起来的 Flickr 网站——数百万人在那里分享并注释自己的数字照片。在最终成为
    Scratch.mit.edu 的网站上，人们能够发布并分享自己的程序。最终版本于2007年5月公开发布，并设有一个简单的“分享”按钮，设计者点击后即可将程序上传到
    Scratch 网站，该网站托管在麻省理工学院的一台服务器上（图1.4）。


    Scratch 作为一种工具的起源及其向热门社区的转变，体现了从计算思维到计算参与的更广泛转变。Scratch 用户（在网站上被称为“Scratchers”）发现，在线社区与软件本身一样，也是一种工具（参见应用与活动）。在我们开始讨论我们称之为计算参与的各种应用之前，我们将在第2章“连接学习”中重新审视
    Papert 通过开发 Logo、以及如今通过 Logo 的继承者 Scratch 所阐述的建构主义学习的关键原则。我们确定了建构主义思想特有的四个维度（社会、个人、文化和实体），并在第3章至第6章中加以探讨，说明计算机编程在过去二十年中如何演变为一种参与式过程。第7章“连接教学”是第2章的姊妹篇，考察建构主义的教师一面。它探讨了教师转向计算与协作意味着什么、他们如何为学生创造合适的学习环境，以及将“自己动手”的学习方法引入课堂会带来哪些益处和问题。


    在这两章分别讨论建构主义的学习与教学方面之间，四个核心章节讨论编程教与学中新的社会、个人、文化和实体联系。在第3章“从代码到应用”中，我们关注编程作品或应用作为学习焦点的出现。学习编程曾经把编码的准确性和效率视为成功的标志。然而今天，学生不再是为编程而编程，而是可以创建真实的应用（如游戏和故事），作为更大学习社区的一部分。我们呈现游戏设计、数字叙事和动画的不同示例，展示应用如何将关键编程概念和技能的学习置于不同情境之中。


    在第4章“从工具到社区”中，我们认为学习编程不再是一项孤立的活动，而是在共享的社会情境中完成，利用开放软件环境和共同热情来激发参与。这些可分享作品的品质（一款高度可玩的游戏、一段精巧的动画，或一个特别细腻的数字故事）能够培养情谊，并提供进入编码社区的途径。本章考察青少年编程社区的出现，以及年轻设计者进入并参与此类社区的方式。


    在第5章“从 Scratch 到混搭”中，我们考察随着编程成为一种社区化的网络活动，新的参与和协同设计实践的出现。过去，程序必须在空白屏幕上“从零开始”创建，以证明能力；而通过混搭实现的无缝整合，正成为编写程序的新社会规范。这当然带来了伦理挑战——尤其是在学校及其对抄袭的界定语境中——但混搭也为参与提供了新的网络。


    在第6章“从屏幕到实体”中，我们考察设计者如何通过可编程玩具、工具和纺织品，将编码与计算从固定屏幕拓展到物理世界。我们首先考察关于乐高 Mindstorms
    套件的故事——这些套件帮助机器人学习在世界各地学校的竞赛中普及开来——然后转向电子纺织品和电路搭建套件等新进展。


    在第7章之后，我们以第8章“面向所有人的编码”作结，该章总结了我们关于在 K–12 课堂和课后项目中引入计算思维与计算参与的见解和启示。


    ![](img/9eb64eca0f040452d3ba8df0d78b35a9_34_0.png)


    图1.4 Scratch 在线社区门户的屏幕截图（上），以及一名初中生在2013年宾夕法尼亚大学 Scratch Day 上体验 Scratch 2.0 视频感应功能的照片。摄影：Darryl
    W. Moran Photography。


