    Such resistance comes from teachers, administrators, and students, who are sensitive
    about having their work appropriated by others—particularly without their explicit
    permission. In a 2010 study of how users react to having their projects remixed
    at the Scratch site, roughly a fifth left positive comments on their remixer’s
    profile page, and a fifth accused the remixer of plagiarism. Participants reported
    that although the Remix Tree visualization helped demonstrate attribution, this
    alone did not curb such feelings of resentment because it was the computer rather
    than the actual individual giving attribution.⁴⁴ Sometimes the chance that work
    can be remixed at the Scratch site can be a hindrance rather than a help in encouraging
    youth to upload their work. For the first few weeks at an after-school club of
    middle-school students, nearly all members hesitated to post their projects online
    for fear that their work could be “high-jacked” by others.²⁵ Yet when the instructors
    explained that remix is a compliment, students changed their initial stance, on
    the whole, and understood and appreciated remix as a positive social gesture.


    But even explaining remix as a compliment does not always assuage children’s resistance.
    In “‘No, I Don’t Feel Complimented’: A Young Artist’s Take on Copyright,” digital
    media researcher Dan Perkel describes his encounter with Sharon, a fifteen-year-old
    aspiring photographer who placed photographs online and discovered that they were
    copied onto several other websites. When asked if she considered such copy-and-paste
    appropriation to be a compliment, Sharon replied that she saw it as an intrusion
    upon her own work: “No, I don’t feel complimented.” Sharon removed the remainder
    of her pictures from online because she was unwilling to allow them to become
    available for remixing. “This kind of activity,” writes Perkel, “deeply upset
    Sharon’s sense of right and wrong.” The ease with which her pictures could be
    accessed and appropriated led her to consider wider ethical considerations of
    remixing.


    # ### Embracing the Possibilities


    Most K–12 schools promote a conception of copying that is at odds with the wider
    culture of remix, which results in a tension between the two groups. Yet this
    tension should lead schools to explore the benefits and dangers associated with
    remix. Although remixing on a basic level requires just a few mouse clicks to
    copy programs (and thus contributes little to'
  - '[PAGE 105]


    computational thinking), selective remixing can require a high degree of sophistication
    and engage beginning designers in computational participation. Some remixing activities
    (such as considering what to modify in selected code segments, what to keep, and
    where to add or delete procedures or variables within a program) require a deep,
    functional understanding of the code, and in some instances, this type of remixing
    may be more complex than starting with a blank slate. Schools need to undertake
    and embrace the role of mediator. This can happen in two ways.


    First and most immediately, schools need to address the nature of collaboration
    and the role of copyright since Web 2.0. On a political level, copyright in the
    digital domain (in code and interfaces) presents complicated issues that are being
    defined in light of new cultural practices.26 For many youth, copyright is a complex
    issue to understand. The remixing dilemma27—the difficulty of promoting both originality
    and generativity in projects—suggests that remixing can deviate into being used
    as a crutch rather than as a spur for imaginative productivity. Yet addressing
    this question of remix as crutch or spur is a crucial question for twenty-first-century
    classrooms and can serve as an opportunity for examining copyright issues and
    addressing the social implications of computational participation, which often
    are neglected in the overt focus on technical prowess. Schools, researchers, and
    policy makers have made headway in this area, perhaps most notably with Harvard''s
    GoodPlay project, which charts the ways that youth engage in ethical and moral
    issues as they engage with new media.28


    With the increasing migration of reading, writing, and making of all kinds to
    online platforms, schools have to recognize the need for comprehensive reform.
    To this end, legal scholar Eric Perrott recommends implementing copyright education
    in all U.S. schools through the National Governors Association, and the Center
    for Social Media has posted online a series of best practices for teaching fair
    use in K–12 classes. These are admirable steps that focus on policies that inform
    K–12 curricula, but they avoid the question of pedagogy. Although there is interest
    in teaching children about the changing nature of what it means to create and
    re-create in the twenty-first century, schools lack meaningful practices for such
    lessons. Lecturing beside a whiteboard is unlikely to help students understand
    what qualifies as fair use and copyright infringement—especially at the elementary
    and middle-school levels, where addressing issues of fairness is important developmentally.
    To do this effectively, educators need to create'
  - '[PAGE 106]


    lessons that allow students to create remixable media, root those lessons in popular
    culture, and not simply talk about it.


    Second, schools need to examine their own tendencies to operate in a top-down
    manner and give more credence to bottom-up approaches to learning. Educational
    theorists such as John Dewey and Ivan Illich have advanced theories about how
    national learning initiatives should best restructure themselves. In terms of
    addressing what it means to create within digital media, however, finding a place
    for a remix culture within the classroom represents a modest but crucial step
    toward making K–12 classrooms more collaborative spaces.


    This does not require reinventing the wheel. Dewey’s experiential education and
    Illich’s notion of “learning webs” offer rich theoretical backdrops for remix
    as a pedagogical practice. There also exists pedagogical precedence (as discussed
    in chapter 2) in Sherry Turkle and Seymour Papert’s notion of “bricolage,” in
    which learners construct their own learning by “arranging and rearranging . .
    . a set of well-known materials” rather than simply receiving and reciting content
    that is given to them by the instructor.” Whereas traditional planning styles
    are inclined to view the process of problem solving as a matter of breaking down
    challenges from the top down into more digestible components, bricolage “describes
    problem solving as a conversation with the situation, in which the final solution
    emerges in the end.”


    In terms of learning programming through remix, a number of initiatives utilize
    bricolage—most notably computer science education researcher Betsy DiSalvo and
    colleagues’ Glitch Game Testers initiative through the Georgia Institute of Technology
    and Morehouse College.³¹ Started in 2009, Glitch Game Testers introduces African
    American high school boys to computation and interface design by having them test
    prelease video games from EA Games and other popular gaming companies. Searching
    out “bugs” in gameplay, students identify problems in game design and play and
    make notes for remixed revisions for the participating company.


    This element of bricolage via remix is also evident with the development and use
    of a series of Scratch-based puzzles entitled “Debugems” that are posted at the
    Scratch site.³² These projects are designed to include an error and require the
    user to find a solution. Whether it is repairing a clock counter in a game or
    finetuning a sprite’s sensory capacity, these projects utilize sampling and remix
    to reverse-engineer the construction process, much like the Roomba Remix Challenge.'
