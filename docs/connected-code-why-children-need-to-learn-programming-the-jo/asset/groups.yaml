    constructed in the mind and heart and is connected to experiences in the world.
    Connected learning examines how the computer should be thought of as a tool for
    knowledge transformation, personal expression, and social relevance so that it
    allows learners to create and connect with others.


    “Papert viewed learning as the process of creating artifacts of personal and social
    relevance, connecting old and new knowledge, and interacting with others.”² This
    description does not refer only to computers. Instead, it outlines the learning
    process and its conditions, and places a primacy on artifacts, the objects or
    “gears” that we construct and the personal meaning that we assign to them. Some
    have argued that this view of learning is too mindextric, but it is equally sociocentric
    by including social relevance. The objects in our mind do not exist in isolation
    from our social worlds. In fact, they are closely grounded in and connected to
    the communities that we live in and the things that are valued by their members.
    In the 1980s, computers were still costly and available to only a few people.
    But digital media now are more affordable and portable and have moved into our
    daily lives. One of the objectives of this book is to examine how participation,
    collaboration, and computation can help young people learn and live in a digital
    world.


    In this chapter, we examine the personal, social, cultural, and tangible dimensions
    of connected learning and their meaning for the design of learning opportunities,
    technologies, and environments. Papert, like Jean Piaget, saw learning as building
    knowledge structures,³ but he added an important dimension: the artifacts of the
    mind have to move into the public world, where they can be examined, shared, and
    valued by others. In many ways, this view was prescient of the vast and distributed
    networks of digital objects and communities that comprise the Internet. It reflects
    the foundation for doing, thinking, and interacting—in short, learning—with any
    medium.


    The personal, social, cultural, and tangible dimensions of connected learning
    are as relevant today as they were thirty years ago. They provide a foundation
    for understanding learning in a computational culture that values participation
    in terms of both production and connectivity. One of the “evocative objects” (to
    use Sherry Turkle’s term)⁴ for thinking about these issues is the programming
    language Logo,⁵ which fueled many discussions about programming and computers
    in schools and putting children and not computers in charge of their learning.'
