    聚焦计算参与——随着编程活动回到学校、社区中心和家庭，并与在线世界相连，在那里许多编程项目被设计并分享给他人——将是一项挑战。尽管大多数学校并非支持有意义且富有成效的小组合作的机构，但挑战之大并不是我们不去奋起应对的理由。在此，我们概述了实现人人编程的多条途径。


    ## 通往计算参与的途径


    在本书中，我们将计算机编程的教与学视为与心智、社区和文化理论紧密相连。大量教育研究表明，读、写、算这“三R”（reading, writing, and arithmetic）的教与学需要关注心智、社区和文化；需要包含技能、策略和概念；需要理解情境、受众和相关性。在增加了第四个R——艺术（aRts）之后，学校和线上及线下的课外项目还需要增加第五个R——编程（pRogramming）。⁴
    这将涉及：为学习特定学科内容而开发编程应用；制作具有个人意义的可分享作品；形成为编程设计提供情境和受众的社区；将混编（remixing）作为一种文化实践，让儿童以适当的方式进行协商；以及扩展课程，纳入广泛的计算机材料和活动，以促进对计算的广泛参与。考虑到这一点，我们指出了一些正在进行的努力和新发展，它们提供了有前景的起点。虽然这不是一份详尽的清单，但它可作为新学校、课程、教师、课外项目、材料和在线社区的元路线图。


    机会需要从小学和初中阶段开始，为学生提供早期的计算体验。年幼的孩子可以在家中和幼儿园里进行创造性和建设性的设计。即便是大多数孩子用来玩游戏和看电视节目视频的iPad，也提供了一系列简单的编程应用（如《Daisy
    the Dinosaur》《Hopscotch》和《Move the Turtle》），让孩子们可以操控对象和角色。一个针对低龄儿童的Scratch Jr.版本正在开发中，它基于原版成功的积木式界面来进行设计。但最有趣的进展出现在实体组装套件的设计上，这类套件允许通过物理方式操控积木来创造机器人或其他设备。教育研究者Marina
    Bers提供了许多令人信服的案例，展示了代际机器人工作坊如何鼓励父母和孩子一起学习关键的计算机概念。⁵


    在学校环境中，重新设计学校和课程的雄心勃勃的努力正在将编程融入整个课程，而不是作为一门独立的课程。第3章讨论的教学软件设计和游戏设计项目提供了有力的例证，说明这类努力可以置于已经拥挤的课程之中，而不是作为独立课程来提供。与20世纪90年代Project
    Headlight中的软件设计项目类似，纽约市（最近还有芝加哥）的Quest to Learn提供了一个学校环境，让学生在整个课程中编程和玩游戏。随着编程工具和社区的激增，现在学校中有许多游戏设计项目的例子。例如，非营利组织Globaloria已在多个州的数十个学区开设了游戏设计课程和竞赛，学生使用Java设计教学游戏，与Globaloria社区分享，并在竞赛中庆祝成功。使用诸如教学软件设计、游戏设计或讲故事等模式，可以在利用学生对流行数字媒体的兴趣和知识的同时，将计算融入标准的数学和科学活动，并且成效显著。⁶


    同样重要的是K–12计算机科学课程的发展。⁷ 由Jane Margolis和Joanna Goode团队开发的Exploring Computer Science课程包含广泛的活动，如界面设计、计算与数据分析、Web与机器人设计。通过这些活动，学生在学习基础编程思想和概念、处理社会问题和计算伦理的同时，接触问题解决和设计思维。该课程已在洛杉矶地区的几所高中成功实施，并正在扩展到美国各地的城市学校。美国计算机协会（Association
    for Computing Machinery）和计算机科学教师协会（Computer Science Teachers Association）也提出了一个K–12教育示范课程，其中包括媒体计算、生物学中的计算和计算思维等示例。另一个发展是最近在纽约市创办了六所新的计算机科学与工程公立高中，目标是在未来几年增加学校数量。软件工程试点课程同样采取了一种全面的方法，在Web设计、机器人技术、纺织品设计中的嵌入式电子技术等情境中引入基础软件设计和工程原理，并通过计算机辅助设计、三维计算机图形、动画和生物信息学等选修课加以补充。许多学校（如High
    Tech High）在课程中推动了广泛的技术和编程活动。这些课程设计表明，高中阶段的计算教育可以向学生介绍计算思维的关键思想，并为先修课程（Advanced
    Placement）计算机科学课程和考试开辟道路，从而为进入大学阶段的计算机科学课程做好关键准备。


    我们还需要能够实施这些课程的教师，以及引导学生选课的顾问。在审阅了Cameron Wilson、Leigh Ann Sudol、Chris Stephenson和Mark
    Stehlik的近期报告*《空转：数字时代K–12计算机科学教学的失败》*之后，计算机科学教师协会建议调整教师认证标准。计算机科学（CS）不能由一群临时志愿者来教授，而是需要包括那些了解学生学习轨迹并制定教学策略以支持学习的专业人士。我们已经提供了几个关于如何将计算纳入课程而非作为独立活动存在的例子。但正如Jane
    Margolis的研究所示，教师、行政人员和学校顾问在克服学生对计算的狭隘非正式观念，并鼓励他们选修可用课程方面都发挥着关键作用。


    尽管转向设计真实应用是朝着正确方向迈出的重要一步，但设计视频游戏并不是能够实现这一目标的唯一应用。游戏设计利用了众多儿童和青少年的兴趣和非正式经验，但它也迎合了一个仍然以男性为主的社区。许多其他类型的软件应用也可以被设计出来，并兑现真实情境的承诺。因此，加入Scratch社区中可能存在的现有俱乐部，仍然会让许多人在门外。在Scratch在线社区中，只有37%的成员是女孩——这比许多其他技术网站要多，但仍然不够。


    为了扩大计算参与，我们需要鼓励各种类型的数字设计，包括使用不同材料和情境的游戏、动画和故事。例如，Alice编程语言将《模拟人生》（Sims）中的角色导入其环境，从而将学生在娱乐软件中的体验与3D故事编程联系起来。这种纳入借助流行文化帮助推广了该网站，同时也通过鼓励角色发展和扩展叙事来实现更广泛的互动，从而含蓄地打破了传统的“边移动边射击”视频游戏模式。同样重要的是教学法方面的努力，例如“程序员工作坊”（Programmers’
    Workshop），它建立在既有“作家工作坊”（Writers’ Workshop）模式之上，为教师和学生提供了一种将计算活动纳入数字故事和动画的框架。


    电子实体组装套件正在提供新的计算活动，这些活动超出了已经很受欢迎的机器人活动。LilyPad Arduino、MaKey MaKey以及许多其他套件和材料为计算提供了丰富的情境，并可以带来超越屏幕、进入艺术和人文学科的计算活动。⁸
    这在K–12课堂中尤为重要，因为早期的编程活动完全发生在数学和科学课上。随着社会科学、人文学科和媒体艺术在数字时代的发展，这些组装套件代表了教学与学习的新“材料”。通过拓宽计算的活动、实践和认知，可以确保所有学生的计算参与。既然技术已经更广泛地普及且更易于负担，现在是时候开发和推广能够跨越与机器人技术相关的传统性别鸿沟的材料了。我们不能再满足于仅仅进行社交的青年在线社区。计算参与意味着通过创造而连接，这会带来在线青年之间更深入、更丰富、更健康的联系。


    尽管学校、课程和材料以及教师是这条路线图上的重要里程碑，但课外项目和在线社区在提供支持、专业知识和受众获取渠道方面同样重要。Computer Clubhouse网络是一个关键例子，展示了社区技术中心如何能够不仅仅是做家庭作业和玩游戏的地方，还可以让青少年参与学习编程。其他社区努力，如GirlsWhoCode.org，则专注于女孩。Computer
    Clubhouse在其中心成功举办了“女孩日”（Girls Days）活动，以……

