    # ### Making as Learning


    Ann and Mike Eisenberg and many others envision a new set of shop classes that
    teach about game controller designs, paper crafts, electronic textiles and sensors,
    and interactive environment designs. FIRST Lego Mindstorms, LilyPad Arduino, and
    Makey Makey are part of a movement that is starting to make computational construction
    kits available to the larger public. These construction kits add dimensions to
    learning and understanding that have been overlooked in education, leaving students
    with few tangible artifacts of their academic work that can travel home and in
    time with them. Such physical connections between school and home are common in
    the elementary grades, but they seem largely forgotten after students move into
    the more abstract domains of science and mathematics at the high school level.
    The new maker spaces and fabrication laboratories (fablabs) have three-dimensional
    printers and laser cutters and blend together computing, crafting, and material
    science.


    These new spaces and clubhouses are places where members can use embedded computation
    to create fashion and soft objects. The extension of computation into the tangible
    world allows students to engage with new materials and new activities that can
    help them broaden their computational participation. For marginalized young people
    who have been left out of the computing pipeline, such domain-crossing activities
    capitalize on and affirm their interests in low-tech materials while simultaneously
    introducing new content. The mind-and-hand merger of the digital and physical
    reposition youth as active creators rather than just consumers of knowledge. These
    new tangible forms of computing also provide a more nuanced understanding of how
    technology works with a broader range of materials that is crucial for today''s
    DIY citizenship, as more aspects of life move into the digital domain.'
