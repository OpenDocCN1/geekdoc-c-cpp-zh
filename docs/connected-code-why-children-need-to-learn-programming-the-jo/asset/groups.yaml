    这种抵触来自教师、管理者和学生，他们对自己作品被他人挪用很敏感——尤其是在没有明确许可的情况下。在2010年一项关于用户在Scratch网站上的项目被混编时如何反应的研究中，大约五分之一的人在混编者个人主页上留下了正面评论，五分之一的人指责混编者剽窃。参与者报告说，尽管Remix
    Tree可视化有助于展示署名归属，但仅此并不能遏制这种怨恨情绪，因为给出署名的是计算机而不是实际个人。⁴⁴ 有时，作品在Scratch网站上可以被混编的可能性，可能成为鼓励青少年上传作品的阻碍而非帮助。在一所中学课后俱乐部的头几周，几乎所有成员都犹豫是否把项目发布到网上，担心自己的作品可能被他人“劫持”。²⁵
    然而，当指导教师解释说混编是一种赞美时，学生们总体上改变了最初立场，并理解并欣赏混编作为一种积极的社交姿态。


    但是，即使把混编解释为一种赞美，也并不总能缓解孩子们的抵触。在“‘不，我并没有感到被赞美’：一位年轻艺术家对版权的看法”一文中，数字媒体研究者Dan Perkel描述了他与Sharon的相遇。Sharon是一名15岁有抱负的摄影师，她把照片放到网上，却发现它们被复制到了其他几个网站。当被问及是否认为这种复制粘贴式的挪用是一种赞美时，Sharon回答说，她认为这是对自己作品的侵入：“不，我并没有感到被赞美。”Sharon删除了网上剩余的照片，因为她不愿让它们可供混编。“这类活动，”Perkel写道，“深深扰乱了Sharon的是非感。”她的照片被访问和挪用是如此容易，这促使她思考混编更广泛的伦理问题。


    ### 拥抱可能性


    大多数K–12学校推崇一种复制观念，这种观念与更广泛的混编文化相抵触，从而导致两个群体之间的紧张关系。然而，这种紧张关系应促使学校探索与混编相关的益处和危险。尽管基础层面的混编只需点击几下鼠标来复制程序（因此对计算思维贡献甚微），但选择性混编可能需要高度的复杂技巧，并使初学设计者参与计算参与。一些混编活动（例如考虑在选定的代码段中修改什么、保留什么，以及在程序中的何处添加或删除过程或变量）要求对代码有深入的功能性理解，在某些情况下，这种混编可能比从空白开始更复杂。学校需要承担并拥抱调解者的角色。这可以通过两种方式实现。


    首先也是最直接的是，学校需要应对自Web 2.0以来协作的性质和版权的作用。在政治层面上，数字领域（代码和界面中）的版权呈现出复杂问题，这些问题正根据新的文化实践被界定。26
    对许多青少年来说，版权是一个难以理解的复杂问题。混编困境27——在项目中同时促进原创性和生成性的困难——表明混编可能偏离为被用作拐杖，而不是作为想象性生产力的刺激。然而，将混编视为拐杖还是刺激这一问题，是21世纪课堂的关键问题，并可以作为一个机会，用来审视版权问题并处理计算参与的社会影响，而这些影响在公然关注技术能力时往往被忽视。学校、研究者和政策制定者在这一领域已取得进展，也许最引人注目的是哈佛大学的GoodPlay项目，它描绘了青少年在接触新媒体时参与伦理和道德问题的方式。28


    随着阅读、写作和各种制作活动日益迁移到在线平台，学校必须认识到全面改革的必要性。为此，法律学者Eric Perrott建议通过全国州长协会在美国所有学校实施版权教育，而社交媒体中心已在网上发布了一系列在K–12课堂中教授合理使用的最佳实践。这些步骤值得赞赏，它们聚焦于为K–12课程提供信息的政策，但回避了教学法问题。尽管人们有兴趣教孩子们理解21世纪创造和再创造意味着什么的变化性质，但学校缺乏此类课程的有意义实践。在白板旁讲课不太可能帮助学生理解什么构成合理使用和版权侵权——尤其是在小学和中学阶段，在这些阶段，处理公平问题对发展很重要。为了有效做到这一点，教育者需要创建课程，让学生创造可混编的媒体，将这些课程植根于流行文化，而不仅仅是谈论它。


    其次，学校需要审视自身自上而下运作的倾向，并更加信任自下而上的学习方法。约翰·杜威和伊万·伊里奇等教育理论家提出了关于国家学习倡议应如何最好地重构自身的理论。然而，就处理在数字媒体中创造意味着什么而言，在课堂中为混编文化找到一席之地，是使K–12课堂成为更具协作性空间的一个适度但关键的步骤。


    这并不需要重新发明轮子。杜威的经验教育和伊里奇的“学习网络”概念，为混编作为一种教学实践提供了丰富的理论背景。也存在教学先例（如第2章所讨论的），见于Sherry
    Turkle和Seymour Papert的“拼装”（bricolage）概念，其中学习者通过“安排和重新安排……一组熟悉的材料”来建构自己的学习，而不是简单地接收和背诵指导教师给予的内容。传统规划风格倾向于将问题解决过程视为自上而下地将挑战分解为更易消化的组成部分，而拼装“将问题解决描述为与情境的对话，最终解决方案在最后浮现。”


    就通过混编学习编程而言，许多倡议都利用拼装——最引人注目的是计算机科学教育研究者Betsy DiSalvo及其同事通过佐治亚理工学院和莫尔豪斯学院开展的Glitch
    Game Testers倡议。³¹ Glitch Game Testers始于2009年，通过让非裔美国高中男生测试EA Games和其他流行游戏公司的预发布视频游戏，向他们介绍计算和界面设计。学生们在游戏玩法中寻找“漏洞”，找出游戏设计和玩法中的问题，并为参与公司记录混编修订的笔记。


    这种通过混编实现的拼装元素，也体现在一系列名为“Debugems”的基于Scratch的谜题的发展和使用中，这些谜题发布在Scratch网站上。³² 这些项目被设计为包含一个错误，并要求用户找到解决方案。无论是修复游戏中的时钟计数器，还是微调角色的感知能力，这些项目都利用采样和混编来逆向工程构建过程，很像Roomba
    Remix Challenge。


    ### 发展“深度可分享性”文化


    > 青少年不断查看彼此的项目、交换想法、分享技巧。为了融入这一语境，Scratch的对象架构支持我们所谓的“深度可分享性”。

    >

    > ——John Maloney等，“Scratch：先睹为快”^33


    *可分享性*一词代表了儿童在Web 2.0时代进行社交活动的意义。年轻人通过在Facebook、Twitter、Instagram、Pinterest和其他社交媒体上分享内容来进行社交。但Scratch首席设计师John
    Maloney及其同事在上文引文中提到的“深度可分享性”这一概念，超越了在Facebook上发布照片和“点赞”他人照片。当年轻人协作完成一个编程项目、在线征求反馈并欢迎他人混编自己的作品时，分享就包含真正的沟通、合作和生产——这三者都在混编实践中汇合。


    根据法律学者Yochai Benkler的说法，我们生活在一个日益依赖“基于公地的同行生产”的世界中，在这种生产中，利他主义不仅是一种道德要求，也是一种经济要求。新媒体理论家Vito
    Campanelli指出，混编是一个深深植根于人的过程，它是“一种进化义务，源于每个人类与生俱来的需要，即亲自转化可供他们使用的材料。”^34 在创造力心理学中，概念组合，尤其是以新的和意想不到的方式进行的组合，会推动新想法。^35


    很难预测学校作为能够推动新思想的机构，会在多大程度上拥抱混编作为一种实践和教学法，因为学校正在遵循更广泛的行业标准，而这些标准利用版权法来压制而非鼓励混编。混编的另一种模式是日益壮大的开源运动，它鼓励一种将软件视为信息而非财产的观念。^36
    然而，要让这场开源运动获得牵引力，并让学校兑现其作为新思想场所的承诺，混编必须在课堂中被教授和实践。

