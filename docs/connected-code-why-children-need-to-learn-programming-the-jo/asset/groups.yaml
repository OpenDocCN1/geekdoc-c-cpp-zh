    \ posted at the galleries section. For WOB, participants used the comments feature\
    \ in innovative (and unexpected) ways to serialize narratives by individual contributions.\n\
    \nThe pathway that these two collabs were able to chart on their own is not one\
    \ that most Scratch members are able to follow as a viable pathway. The high level\
    \ of collaboration that these two collabs illustrate represents the exception\
    \ rather than the norm at the Scratch website. A recent analysis of five thousand\
    \ randomly sampled Scratch user profiles online reveals that less than half had\
    \ ever submitted any project online, remixed another's work, or collaborated with\
    \ others on a single project.<sup>44</sup> This is typical of most online sites\
    \ and is not surprising. Despite the myth that today’s children are all eager\
    \ “digital natives,” recent research suggests that children are less empowered\
    \ and galvanized by digital media than some might think.<sup>45</sup>\n\nAn exploratory\
    \ study of middle-school students who were using an early version of the Scratch\
    \ website showed that many children were uncomfortable with sharing their projects\
