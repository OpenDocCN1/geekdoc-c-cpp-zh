    Shirky乐观地将这种建设誉为前所未有的公民和金融机会，让全球社区围绕共同利益和共同事业而发展。<sup>17</sup>


    尽管认知研究表明社区对学习很重要，而且线上社区激增是Web 2.0和更广泛的“自己动手”运动的典型特征，但编程社区的概念仍然相对较新。早期一些关于儿童如何学习编程的研究考察了让学生以小组形式合作的挑战和机遇。<sup>18</sup>
    但在K-12教育环境中，编程（与学校大多数科目一样）几乎仍然总是作为个人活动来教授。也许在过去十年教授儿童编程方面最成功的协作设计是引入结对编程活动。两个儿童并排坐在同一台电脑前，一个扮演“驾驶员”，输入代码；另一个扮演“导航员”，检查每一行输入代码的语法以及与先前输入的兼容性。这些角色会定期互换。在行业内部，结对编程已被证明能提高代码脚本的准确性和输出的可靠性。<sup>19</sup>
