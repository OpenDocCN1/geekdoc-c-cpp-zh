    The idea was to develop a programming language that builds on the media practices
    that already were favored by youth in their leisure time. This language would
    allow participants to make graphics, animations, and games. It would not be confined
    to a particular purpose, would provide a low entry threshold for beginners with
    no prior experience, and would be able to be scaled up to more complex projects.
    Scratch (its name a play on popular DJ practices of making and remixing music)
    moved away from the focus on mathematics and science that traditionally was associated
    with programming. It presented a visual point-and-click interface that allowed
    young programmers to “write programs” by placing together blocks of elements and
    structures (figure 1.3).


    Central to Scratch’s original design was a capacity to circumvent the frustrating
    syntactic errors that are characteristic of typing code. It allows users


