    foundation of literacy for hundreds of years, computational design and paper crafts
    can be merged in innovative ways. For instance, Mike and Ann Eisenberg''s HyperGami
    allows students to use origami paper folding crafts, computation, and geometry
    to design three-dimensional objects on the screen that can be printed out and
    folded into paper creatures and objects (figure 6.5). Pop-up books can embed circuitry
    with LEDs that light up when pages are opened or paper strips are pulled. Although
    these activities do not require coding, they are a first step into the world of
    making connections in circuits that can be enhanced with programming. The work
    on paper can be further expanded to include conductive paint that can animate
    information on the page or connect back to a computer screen. Many of these projects
    have tackled the conceptual and technical challenges of designing materials and
    tools, and they now become accessible for learning and teaching the next-generation
    shop class.


