    in K-12 schools. Whatever initial excitement children may have experienced with
    programming computers, the lack of connection to wider subject matter meant that
    they were not motivated to persist with the software after the early enthrallment
    wore off. Most teachers were unaware of the potential of code to support and expand
    subject-matter content, and they typically viewed such technology as an eclectic
    elective within the school rather than a means to ground and support core content
    mathematics and science learning.⁶


    Designing applications rather than programming code responded to these criticisms
    of programming research and Logo. In an extensive review of the research on K–12
    programming instruction, education researcher David Palumbo⁷ independently came
    to the same conclusions that Caperton arrived at with the design of the instructional
    software project: the teaching and learning of programming need to be integrated
    with regular class work and other subject matters, provide a context for explanations,
    and foster personal relevance among students. In fact, the criticisms directed
    toward programming and specifically Logo—lack of sufficient time, complexity,
    and personal applicability—could be leveled against many other curricular activities
    in school, not just programming. What and how students were learning in school
    and how it connected to their learning outside of school emerged as a central
    topic of discussion in computer programming and in education in general during
    the late 1980s and early 1990s.⁸


    Most prominent in these discussions was a push for authenticity in learning.⁹
    One meaning for authenticity is that what learners encounter in the classroom
    corresponds to what professionals do in the field itself. In terms of programming,
    this means that students in school should not encounter coding purely as an abstract
    discipline but instead should learn how experts in the domain approach the topic
    to create real applications. A second component is personal authenticity, and
    it relates to recognizing the personal interests and funds of knowledge that children
    bring to school. What are kids interested in creating? What is meaningful to them
    in terms of making their lives more efficient, more fun, and more interesting?
    The third component—authentic audiences—builds on this need for relevance, prompting
    children to make products of learning that are meaningful to each other, not just
    the teacher. Finally, the fourth authenticity is designing for real-world audiences,
    which prompts genuine feedback and meaningful and translatable assessment.'
