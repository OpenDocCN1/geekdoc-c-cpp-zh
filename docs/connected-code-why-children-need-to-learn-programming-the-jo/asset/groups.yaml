    They also allow students to see that simple design modifications can connect the
    same technologies with very different communities. The LilyPad Arduino’s sensors
    and actuators are modifications of the functionally equivalent Arduino board,
    sensors, and actuators. This means that the LilyPad Arduino can do anything that
    the Arduino board can do and vice versa. Yet we know from a recent study by Leah
    Buechley and Benjamin Mako Hill<sup>20</sup> that many more women participate
    in the LilyPad community than in the Arduino community: of projects posted on
    the Web, 80 percent of Arduino projects were completed by male designers, and
    80 percent of LilyPad Arduino projects were completed by female designers. Although
    robotic kits like Lego Mindstorms invite a certain kind of computational production
    and producers, so do textile construction kits like the LilyPad Arduino. The design
    and framing of computational activities and materials affects who sees themselves
    as part of the community and then joins and participates in it.


    Likewise, the communal sewing circles that are the design context for many e-textile
    activities are unlike the competition-driven workshops of the robotic activities.
    Competitions have an energizing function, providing purpose and audience in a
    shared event, but they should not be the only model for organizing, presenting,
    and celebrating computational participation. We need to create communities that,
    unlike the robotics competition, provide a collaborative and supportive atmosphere.
    We are building such new communities and events around computational crafting
    activities. Called eCrafting Circles,<sup>21</sup> they intentionally refer to
    the quilting bees and sewing circles that used to bring together neighbors to
    produce quilts, clothes, and more (see figure 6.3 bottom). Rather than competitions,
    online crafting circles will be time-sensitive, locally relevant events that allow
    for sharing and displaying of computational crafts. These are intended to spark
    increased participation and collaboration in e-textiles, similar to the way FIRST
    Lego League competitions have increased participation in robotics, but without
    the emphasis on competition that deters significant groups of people from joining.<sup>22</sup>
    Scalable across regions while adaptable to local needs, eCrafting Circles are
    intended to provide a forum that allows like-minded and interested participants
    to share learned insights and provide much needed support for their designs. Much
    of computational participation has focused on the online world, but there is equal
    benefit to be found in physical construction and local participation. We might
    want to revisit what computer labs and classes could look like when crafting and
    computing provide new materials, activities, and audiences for learning.


    ## Shop Classes for the Next Millennium: Animated Pop-Up Books, Game Arcades,
    and Public Displays


    In new clubhouses, community centers, and afterschool programs, students will
    be able to interact with computers to communicate, receive, and organize information.
    But new clubhouses cannot bear the sole responsibility for teaching children to
    think systematically and creatively using computers. School classrooms need to
    embrace the hands-on, creative technical learning that has been fostered in peripheral
    clubs. In the vocational education and industrial arts courses of the 1950s, students
    used technology collaboratively and constructively in real-life applications.
    By the 1970s, however, some reformers were characterizing such classes as pointless
    or unchallenging, even though they made education more hands-on, practical, and
    project-driven and represented some of the most innovative thought in education,
    particularly the progressive ideas of John Dewey in *Experience and Education*.<sup>23</sup>


    The promise of hands-on and creative learning through technology has not been
    forgotten. More than a decade ago, computer scientists and educators Mike and
    Ann Eisenberg envisioned a next generation of shop classes that would include
    computational media and crafts—what they called computer-enriched handicrafts.<sup>24</sup>
    Shop classes, which often are taken by students who are not going on to college,
    can engage all learners in designing and understanding technology by blending
    computation and material artifacts. This revaluation of the concrete for learning
    has also been supported by education writer Mike Rose, who has analyzed the intellectual
    dimensions of trades, crafts, and arts. Most educational research has focused
    on understanding learning and teaching in academic disciplines such as science,
    mathematics, and language arts and has paid little attention to the intellectual
    demands and opportunities found in plumbing, carpentry, and waitressing. Yet building
    robots and crafting electronic textiles are compelling illustrations of how crafting,
    engineering, and computer science can generate rich and engaging learning contexts.


    One unexpected direction for next-generation shop classes has been a return to
    paper and paint, enhanced with conductivity and computation.

    '
