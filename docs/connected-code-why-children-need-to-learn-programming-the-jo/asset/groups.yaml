    这种编程的集体氛围最初在1997年随着MOOSE Crossing的开发而迁移到线上。<sup>21</sup> 基于计算机科学家艾米·布鲁克曼的设计和研究，MOOSE
    Crossing是一个纯文本平台（这是当时大型角色扮演或多用户地牢游戏的特点）。在一个虚拟城堡中，学生们仅通过文字探索环境。尽管缺乏构成当今线上世界特色的图形和动画，MOOSE
    Crossing在当时却是独一无二的。它是第一个在线教育平台，通过允许年轻用户与同龄人在线互动，并通过编程在城堡中创建他们自己的角色、动物和房间——每个都有可编程的参数——来吸引用户。在MOOSE
    Crossing中，孩子们在一个网络社区内学习编程。年轻编程者们拥有了


    ## “超级丹”达成“全满贯”


    ![](img/9eb64eca0f040452d3ba8df0d78b35a9_76_0.png)


