    MaKey邀请用户将日常生活中的普通物体变成触摸板并与互联网结合，从而重新发现它们的计算潜力。作为发明套件，MaKey MaKey对初学者足够简单，却又足够复杂，可供专业艺术家和工程师在各自领域中使用。Jay和Eric的启动资金请求附有一段视频，展示了各种MaKey
