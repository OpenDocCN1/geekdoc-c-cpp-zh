    MaKey一样，这些活动围绕开源Arduino板和软件展开，允许针对特定活动（如设计机器人）进行定制，或为往往昂贵的硬件平台提供Scratch风格界面以进行编程。但MaKey
    MaKey的独特之处在于，它让实体计算变得触手可及。Kickstarter宣传视频中展示的大多数MaKey MaKey项目，都可以通过将鳄鱼夹连接到MaKey
