    # # Series Foreword


    Digital media and networks have become embedded in our everyday lives and are
    part of how we engage in knowledge production, communication, and creative expression.
    Unlike the early years of computers and computer-based media, digital media are
    now commonplace and pervasive. Digital media have escaped the boundaries of professional
    and formal practice and the academic, governmental, and industry homes that initially
    fostered their development and have been taken up by diverse populations and noninstitutionalized
    practices, including the peer activities of youth. Although forms of technology
    uptake are diverse, a generation is growing up in an era when digital media are
    part of the taken-for-granted social and cultural fabric of learning, play, and
    social communication.


    This book series is founded on the working hypothesis that those immersed in new
    digital tools and networks are engaged in an unprecedented exploration of language,
    games, social interaction, problem solving, and self-directed activity that leads
    to diverse forms of learning. These diverse forms of learning are reflected in
    expressions of identity, independence, and creativity and an ability to learn,
    exercise judgment, and think systematically.


    The defining frame for this series is not a particular theoretical or disciplinary
    approach or a fixed set of topics. Rather, the series revolves around a constellation
    of topics investigated from multiple disciplinary and practical frames. The series
    looks at the relation between youth, learning, and digital media, but each contribution
    to the series might deal with only a subset of this constellation. Erecting strict
    topical boundaries would exclude some of the most important work in the field.
    For example, restricting the content of the series only to people of a certain
    age would mean artificially reifying an age boundary when the phenomenon demands
    otherwise. This would'
  - '[PAGE 11]


    become particularly problematic with new forms of online participation where one
    important outcome is the mixing of participants of different ages. The same goes
    for digital media, which are increasingly inseparable from analog and earlier
    media forms.


    The series responds to changes in our media ecology that have important implications
    for learning and that involve new forms of media literacy and modes of media participation.
    Digital media are part of a convergence between interactive media (most notably
    gaming), online networks, and existing media forms. Navigating this media ecology
    involves literacies that are being defined through practice but require more scholarly
    scrutiny before they can be incorporated into educational initiatives. Media literacy
    involves ways of understanding, interpreting, and critiquing media and also the
    means for creative and social expression, online search and navigation, and a
    host of new technical skills. The potential gap in literacies and participation
    skills creates new challenges for educators who struggle to bridge media engagement
    inside and outside the classroom.


    The John D. and Catherine T. MacArthur Foundation Series on Digital Media and
    Learning, published by the MIT Press, aims to close these gaps and provide innovative
    ways of thinking about and using new forms of knowledge production, communication,
    and creative expression.'
