    Despite cognitive research on the importance of community for learning, as well
    as the spike in online communities that is characteristic of Web 2.0 and the wider
    do-it-yourself movement, the idea of programming communities is still relatively
    new. Some early work that looked at how children learn to code examined the challenges
    and opportunities of having students work together in small teams.<sup>18</sup>
    But programming in K–12 contexts is still almost always taught as an individual
    activity (as are most subjects in school). Perhaps the most successful collaborative
    design in teaching children how to code has been the introduction of pair programming
    activities over the past decade. Sitting side by side at the same computer, one
    child takes the role of the “driver” who inputs the code, and the other plays
    the “navigator” who reviews each inputted line, checking its syntax and compatibility
    with previous inputs. These roles switch periodically. Within the industry itself,
    pair programming has demonstrated increased accuracy in coded scripts and more
    reliable output.<sup>19</sup> Among children, this has also been the case, but
    with young programmers, studies have demonstrated that children’s motivation to
    program and persist at troubleshooting their own code increases significantly
    when they work in pairs.<sup>20</sup> This important third element suggests that
    pair programming establishes a modicum of checks and balances for coding and also
    helps develop a more communal atmosphere for learning.


    This communal atmosphere for programming first migrated online with the development
    of MOOSE Crossing in 1997.<sup>21</sup> Based on computer scientist Amy Bruckman’s
    design and research, MOOSE Crossing was purely a text-based platform (which is
    characteristic of the massive role playing or multiuser dungeons of the time period).
    Set within a virtual castle, students explored their environment through words
    alone. Despite the lack of the graphics and animations that characterize today’s
    online worlds, MOOSE Crossing was unique at that time. It was the first online
    educational platform to engage young users by allowing them to interact with their
    peers online and to add to the virtual domain by programming their own characters,
    animals, and rooms within the castle—each of which had programmable parameters.
    Within MOOSE Crossing, children learned programming within a networked community.
