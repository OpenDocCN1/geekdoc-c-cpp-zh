    \ work, there is no assurance that they will find the audience and attention that\
    \ motivate many to share online. Max O. Lorenzo’s 80/20 distribution curve<sup>47</sup>\
    \ (20 percent of a population receives 80 percent of the attention) plays out\
    \ in Scratch. An examination of 2.2 million projects at the Scratch site showed\
    \ that the 20 percent most-viewed Scratchers received 95.6 percent of views, and\
    \ the other 80 percent of Scratchers received 4.4 percent of views.<sup>48</sup>\
    \ Recognizing these steep discrepancies in collaboration and participation, the\
    \ Scratch team began to conceive of ways to bring together more of its users online.\n\
    \n## Initiating DIY Youth Collaborations: Creating Online Collabs and Camps in\
    \ Schools\n\nIn 2010, a new Scratch research focus on collaboration and computation\
    \ in a networked commons looked at how learning to program and learning to participate\
    \ could be mutually beneficial. Would a forum help new users grow more comfortable\
    \ sharing their own work online and find others with like interests? Could more\
    \ experienced users serve as mentors to those new users? To this end, the first\
    \ annual Collab Challenge was launched at the Scratch website in January 2011,\
    \ and Collab Camps were held in July 2011 and January 2012 (figure 4.5).<sup>49</sup>\n\
    \nOpen to the entire community, the first Collab Challenge ran from January to\
    \ early March 2011. Each team needed to have a minimum of two participants; integrate\
    \ three unique, preselected images into its projects; upload an initial draft\
    \ midway through the competition to receive constructive feedback from the Scratch\
    \ team; and submit a final project three weeks later. The draft and final projects\
    \ were exhibited in a Collab gallery where participants could view and comment\
    \ on each other’s projects. Teams that integrated three disparate images using\
    \ their own original ideas and coding sequences had their projects featured on\
    \ the Scratch homepage, which is a desirable status for many in the community.\n\
    \n![](img/9eb64eca0f040452d3ba8df0d78b35a9_87_0.png)\n\n### Scratch Collab Challenge\n\
    \nWhat can you and other Scratchers create together using three images and a lot\
    \ of imagination? We've created the Scratch Collab Challenge to find out.\n\n\
    - 1. Register your group or collab here as soon as possible.\n- 2. Make a project\
    \ with your collab that uses these three images. Be creative in using the sprites.\n\
    \n![](img/9eb64eca0f040452d3ba8df0d78b35a9_87_1.png)\n\n![](img/9eb64eca0f040452d3ba8df0d78b35a9_87_2.png)\n\
    \n**Figure 4.5**  \nThe initial announcement for the Collab Challenge and two\
    \ Collab Camps, which centered on interactive stories and musical video mash-ups.\n\
    \nA total of fifty-two collab teams (139 participants) registered to participate\
    \ in the initial Collab Challenge in January 2011. About 41.7 percent of the participants\
    \ were relative newcomers to the community, and 48 percent of the participants\
    \ had been on Scratch for more than three months. Comments made by experienced\
    \ Scratchers suggest that the Challenge stimulated renewed interest in participating\
    \ in the online community. One Scratcher who had been with the community for over\
    \ two years thanked the team for hosting the Challenge:\n\n> I want to personally\
    \ thank all of you for throwing the Collab Challenge. Taking the time to create\
    \ this has allowed me to work with some of the best scratchers—something that\
    \ I think we all appreciate. I hope that you continue to do more challenges like\
    \ this one in the future.\n\nFifty-two of the groups that registered for the Collab\
    \ Challenge in January submitted a first draft of a project by mid-February, and\
    \ twenty-six submitted a final version by the end of March. Although K. Luther\
    \ and colleagues found that only 13 percent of collabs on the digital media site\
    \ Newgrounds succeeded in completing a finished project, a full 50 percent of\
    \ the Scratch collabs that submitted an initial version of a project to the Collab\
    \ Challenge succeeded in submitting a final version. Although these numbers reflect\
    \ a small number of reference points, they suggest the potential for success of\
    \ a lightly structured Challenge environment in which participants receive constructive\
    \ feedback on drafts and have preestablished deadlines to help define and tier\
    \ goals.\n\nThis element of “light structure” suggests that schools can help children\
    \ engage in the computational participation that characterizes these online collaborations.\
    \ After a class of high school freshmen participated in the first Scratch Collab\
    \ Challenge, Yasmin Kafai and her research team paired their analysis of online\
    \ collaboration at the website with offline observations and interviews with the\
    \ students themselves as they worked in teams of four to eight students for course\
    \ credit. Initially, the high school students were intrigued by the challenge\
    \ for the sake of the same “see and be seen”\n"
