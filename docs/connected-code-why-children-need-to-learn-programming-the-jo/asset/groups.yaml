    尽管数字化学习已经远离了数百年来作为读写能力基础的印刷文本，但计算设计与纸艺仍能以创新方式融合。例如，Mike 和 Ann Eisenberg 的 HyperGami
    让学生利用折纸手工、计算和几何，在屏幕上设计三维物体，这些物体可以打印出来并折叠成纸质生物和物件（图 6.5）。立体书可以嵌入带 LED 的电路，当书页打开或纸条被拉动时，LED
    就会亮起。尽管这些活动不需要编程，但它们是迈向在电路中建立连接的世界的第一步，而这一世界可以通过编程得到增强。纸上的工作还可以进一步扩展，纳入导电颜料，使页面上的信息动起来，或连接回电脑屏幕。这些项目中的许多已经解决了设计材料与工具时的概念和技术挑战，如今它们已可用于学习和教授下一代手工制作课。


    ![](img/9eb64eca0f040452d3ba8df0d78b35a9_124_0.png)


    **图 6.5**


    HyperGami 界面（上）和一组企鹅纸雕（下）。照片由 Ann 和 Mike Eisenberg 拍摄。


    计算机科学家 Amnon Miller 在 Hook-Ups 上的开创性工作说明，青少年如何在用日常材料和随手可得的材料制作实体界面的同时，学习电学、设计和编程。本章开头讨论过的
    MaKey MaKey 是一款低成本的计算搭建套件，它降低了开设计算式手工制作课的门槛（图 6.6）。如果游戏设计活动能够借助流行游戏主机和街机中的摇杆界面延伸到物质世界，会怎样呢？20
    世纪 70 年代和 80 年代，游戏街机是热闹的公共空间，为许多青少年提供了第一次接触电子游戏的机会。最近，我们与一个初中生班级合作，他们用混编的 Scratch
    游戏和触控盘搭建了一个街机厅。尽管香蕉钢琴键盘在视频中很有吸引力，但在课堂环境中却不太实用。Play-Doh（橡皮泥）——一种可塑、可重复使用且导电的材料——成为设计实体游戏界面的学生的首选材料，这些界面兼具美学和功能元素。一些学生将自己的控制器组件与电子游戏中的角色精灵图相匹配，另一些学生则用橡皮泥来表示游戏中精灵可以移动的方向。


    每个人都投入了大量精力重新设计 Scratch 游戏、绘制或下载新的精灵图（角色）、设计自定义背景、修改现有精灵图并添加音效，同时还要遵循可用性惯例，例如添加分数、添加坏人或干扰物，以及添加获胜或结束游戏的方式。设计触控板还带来了电脑屏幕世界中所没有的材料要求。一些青少年努力确保鳄鱼夹始终固定在他们的橡皮泥触控板中。对另一些人来说，橡皮泥控制器会把水分渗到背景纸上，造成短路，这要求他们把控制器保持为独立部件，而不是一个整体触控板。


    把游戏设计放在街机厅而不是竞赛中，为这些游戏设计提供了专注的观众和丰富的学习体验。随着一系列挑战出现，街机体验变成了一堂调试和快速原型制作的课：鳄鱼夹从控制器上掉落，控制器部件掉到地上，参与者意识到他们需要通过添加分数来调整游戏，以便更多人能玩。几位设计者做了许多小修正，以确保控制器的完整性，并添加了导电手环和触控板，让玩家更清楚地知道需要触碰接地夹，界面才能正常工作。他们还通过观看别人玩自己的游戏并实时调整，获得了一些关于设计和可用性的宝贵见解。事实证明，用橡皮泥作为导电材料制作实体游戏界面是一次丰富的学习体验，很像用导电缝线制作电子纺织品。


    为展示、测试和欣赏手工制作与编程创作的作品创造观众，是建造主义学习与教学的一个重要维度。计算机科学家 Mike Eisenberg 和 Sherry Hsi
    的最新项目 Math on a Sphere 呈现了计算参与的另一种变化（图 6.7）。该项目使用大型球形显示器，这些显示器由美国国家海洋和大气管理局开发，并在许多科学中心用于展示图形和动画。在类似
    Logo 的编程环境中，孩子们可以在学习非欧几何和编程的同时创作自己的设计。Walk-Through Computer 的超大尺寸启发参观者思考机器的功能；类似地，Math
    on a Sphere 的巨大显示屏让年轻设计者把自己视为在为观众编程，尽管观众在远方。虽然目前只有劳伦斯科学馆和科罗拉多大学博尔德分校的菲斯克天文馆可以使用这些显示器，但这一想法可以扩展到更多公共中心。它提供了另一条途径，让我们思考观众在哪里、如何触达观众，并拓宽我们对计算参与可能意味着什么的认识。在设计用于公开展示和表演的作品时，学生们发现，用来思考的物件变成了用来分享的物件，展示了所学内容与社群的相关性，就像嘉年华给舞者提供了观众，也提供了全年学习和练习舞蹈的目的。


    ![](img/9eb64eca0f040452d3ba8df0d78b35a9_127_0.png)


    ![](img/9eb64eca0f040452d3ba8df0d78b35a9_127_1.png)


    **图 6.7**


    三维展示：Math on a Sphere。照片由 Antranig Basman（上）和 Sherry Hsi（下）拍摄。


    ### 制作即学习


    Ann 和 Mike Eisenberg 以及许多其他人设想了一套新的手工制作课，教授游戏控制器设计、纸艺、电子纺织品与传感器，以及交互环境设计。FIRST
    Lego Mindstorms、LilyPad Arduino 和 Makey Makey 是一场运动的一部分，这场运动正开始让更广泛的公众获得计算搭建套件。这些搭建套件为学习和理解增添了教育中一直被忽视的维度，使学生很少有能够带回家、并能随时间与他们同行的学业作品实体成果。学校与家庭之间的这种物理联系在小学阶段很常见，但当学生在高中阶段进入更抽象的科学和数学领域后，这种联系似乎在很大程度上被遗忘了。新的创客空间和制造实验室（fablabs）配备
    3D 打印机和激光切割机，将计算、手工制作和材料科学融合在一起。


    这些新空间和俱乐部会所是成员可以利用嵌入式计算来创作时尚和软性物件的地方。计算向实体世界的延伸，让学生能够接触新材料和新活动，从而帮助他们拓宽计算参与。对于被排除在计算培养通道之外的边缘化年轻人而言，这类跨领域活动利用并肯定了他们对低技术材料的兴趣，同时引入新内容。数字与物理的手脑融合，将青少年重新定位为积极的创造者，而不仅仅是知识的消费者。这些新的实体计算形式还让人们更细致地理解技术如何与更广泛的材料协同工作，而这对当今的
    DIY 公民素养至关重要，因为生活的更多方面正在进入数字领域。

