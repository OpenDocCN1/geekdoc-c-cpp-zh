    # # 6 From Screens to Tangibles


    *In spring 2012, the grassroots crowd-funding website Kickstarter listed a new
    request for funding. Two MIT students, Jay Silver and Eric Rosenbaum, were looking
    for funding for a computational construction kit called MaKey MaKey. The opening
    text teased potential backers by asking “Ever played Mario on Play-Doh or piano
    on bananas? Alligator clip the Internet to your world and start inventing the
    future.” By clipping one alligator clip to the MaKey MaKey board and another one
    to a conductive object (such as an apple, a banana, or aluminum foil), the user
    closes a circuit. When users touch the selected object, they manipulate programmed
    behavior on the Scratch screen. As the “invention kit for the 21st century,” MaKey
    MaKey invites users to rediscover the computational potential of ordinary objects
    in everyday life by transforming them into touchpads and combining them with the
    Internet. As an invention kit, MaKey MaKey is simple enough for beginners and
    yet complex enough for professional artists and engineers to use in their own
    respective trades. Jay and Eric’s request for startup funding was accompanied
    by a video clip that illustrated various MaKey MaKey projects. Within a few days,
    the campaign reached its initial goal of the $25,000 that was required to kickstart
    the project, but the money and the feedback did not stop. Hundreds of questions
    and ideas of what MaKey MaKey could do and what one could make with it filled
    the comment pages long before anyone received a kit. People asked whether it allowed
    Bluetooth connectivity, whether one could connect two MaKey MaKeys to a keyboard,
    and whether applications could ease movement and open access for children with
    disabilities and senior citizens. By the end of the campaign, over eleven thousand
    backers had signed up for a package and provided $586,106 in startup funding.
    It was one of the most successful Kickstarter campaigns of the year and attracted
    nearly twenty-four times the amount of funding that its inventors initially requested.¹*'
  - '[PAGE 109]


    At one time, electronic construction kits were sold to a few dedicated hobbyists
    who were interested in building their own airplanes and ham radios. But Kickstarter
    campaigns have raised startup money for several computational construction kits.
    Like Makey Makey, those campaigns were built around the open-source Arduino board
    and software and allowed customization for particular activities (such as designing
    a robot) or provided a Scratch-style interface for programming an often expensive
    hardware platforms. But MaKey MaKey was unique because it was able to make tangible
    computation readily accessible. Most of the MaKey MaKey projects that were featured
    in the promotional video for Kickstarter could be designed by connecting the alligator
    clips to preset ports on the MaKey MaKey board, and none required previous programming
    experience. Like Scratch, MaKey MaKey provides low thresholds for beginners and
    high ceilings for advanced designers. Finally, MaKey MaKey was affordable. The
    board cost less than $50, well under the price of the Lego Mindstorms kits, which
    can cost hundreds of dollars. This trend toward accessible, tangible, computational
    construction kits is continuing. Why simply program robots and racecars when you
    can take the pillows from your couch, the keys to your car, and the door to your
    room and make them programmable and playable? In 2012, the African Robotics Network
    launched a challenge to design a $10 robotics kit so that children all over the
    world could learn to make their own programmable robots and identified several
    winning designs.^2


    MaKey MaKey is not a stand-alone application. It taps into growing online communities
    that have formed around the open-source Arduino board.^3 Not unlike the Scratch
    community that is described in chapter 4, Arduino-based applications have spurred
    entire do-it-yourself communities whose members share their creations online,
    offer tutorials and technical support, and leverage the Web to create spaces for
    like-minded enthusiasts. At the online community Instructables, for example, hundreds
    of thousands of entries provide information and video documentation on how to
    build or fix nearly anything. The hobbyist culture is part of the larger DIY or
    maker movement that is bringing back manual crafts, promoting local manufacturing,
    and providing access to digital fabrication with three-dimensional printers and
    laser cutters in Fab Labs. The launch of Make magazine in 2005 and the annual
    Maker Faires across the country shortly thereafter has created a national forum
    and local meeting places to share and celebrate DIY designs.^4 The success of
    MaKey MaKey’s Kickstarter'
  - '[PAGE 110]


    campaign and others reveals that a broad audience is interested in making things
    that can be programmed and be played with in the physical world.


    The maker movement is not limited to the informal spaces of clubs and homes but
    is expanding into educational spaces in museums, libraries, and schools. Science
    centers and museums across the country are setting up maker spaces in their halls.
    The New York Hall of Science, the Exploratorium, and the Lawrence Hall of Science
    were among the first to experiment with this new model of interactivity with their
    patrons. Now visitors come to see and interact with exhibits and also might make
    something linked to the exhibit theme. Public libraries in Chicago, Philadelphia,
    and elsewhere are expanding their focus from books to teen spaces where young
    users can access computers to search information, complete their homework, play
    games, and engage in digital production of animations, games, and electronic textiles.^5
    The MakerEd initiative has developed and deployed a Maker Corps—young people who
    are interested in assisting other youth and communities with DIY projects. The
    Boy Scouts of America added a game design merit badge in 2013, a programming badge,
    and a computer-aided design badge in 2014. Will being able to design and program
    digital media soon be a fundamental scouting skill, like lighting a fire or charting
    a path in the woods? In the thicket of Web-based media, this may well be the new
    wilderness survival skills. Schools are recognizing the potential of programming
    in the design and construction of physical objects and are beginning to set up
    what computer science educators Ann and Mike Eisenberg envisioned to be a new
    and improved shop class that interweaves computation and material science in computer-enriched
    handicrafts.


    This move of educational technology beyond the computer screen to meld the digital
    with the tangible is the focus of this chapter. Much of what is discussed in previous
    chapters—interactive digital stories, video games, animations, and massive online
    communities—is located on stationary computer screens. As sociologist Sherry Turkle
    once remarked, much of our digital life now seems to happen on the screen and
    not in the physical world. But mobile technologies with small and portable screens
    have brought this physical side of computing into our everyday lives. And they
    have made the design of tangible technologies accessible and affordable to all
    users. This interest in tangibles may be an early indication that the pendulum
    is swinging back: what started out as a migration from in-person'
