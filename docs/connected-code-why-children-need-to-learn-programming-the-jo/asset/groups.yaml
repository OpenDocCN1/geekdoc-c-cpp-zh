    CD-ROMS (compact discs read-only memory) made the toil associated with coding
    seem equally archaic. Who wanted to bother with the laborious process of coding
    programs when the applications could be easily downloaded with the slip of a disk?


    Yet both the giant Walk-Through Computer and Papert''s coding circles were evidence
    of a belief in the potential for all of us—regardless of age or experience—to
    touch the machine itself, to get inside the inner workings of the computer, and
    to connect with our own passions through the machine. And now the pendulum is
    swinging back. Today the computer has moved out of museums and computer labs.
    Its presence is felt most deeply in the omnipresent hand-held and touch-screen
    devices that run digital applications tailored to the professional and social
    needs of the individual user. Computers—desktops, laptops, tablets, and mobile
    devices—have tangibly and personally become extensions of ourselves,⁵ and coding,
    once solely the erudite pastime of techies, is now being recognized by educators
