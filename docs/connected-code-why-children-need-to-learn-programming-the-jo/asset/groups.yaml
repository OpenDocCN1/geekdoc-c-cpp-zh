  - '[PAGE 143]


    are present in Dewey’s and Papert’s vision of schooling, and this vision is experiencing
    a renaissance with the growing popularity of maker spaces, DIY learning, and online
    creative communities where code has become the lingua franca. As the participants
    in these DIY circles can attest, coding is not just about making the machine compute
    but also about communicating with the larger world. The divide between yearners
    and schoolers needs to be bridged to make classrooms more student-centered, product-oriented,
    and genuinely collaborative. But this divide represents an opportunity in technology
    education as classrooms and online maker communities offer unique learning environments,
    which together can increase the number of children who encounter coding as a new
    literacy and reshape schools’ use of computers to be more creative and collaborative.
    This middle ground—an amalgamation of learning environments—produces the most
    interesting educational opportunities for children. “It is only in such an ecology
    of mutations and hybridizations of ways of learning,” Papert writes at the close
    of *The Children’s Machine: Rethinking School in the Age of the Computer*, “that
    a truly new mathetic culture could emerge.”32'
