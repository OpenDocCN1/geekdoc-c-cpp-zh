    MaKey价格可负担。该板成本不到50美元，远低于可能花费数百美元的Lego Mindstorms套件价格。这种朝向易获取、实体化、计算化搭建套件的趋势仍在继续。当你可以拿沙发上的枕头、车钥匙和房间门，让它们可编程、可玩时，为什么只给机器人和赛车编程呢？2012年，非洲机器人网络发起了一项挑战赛，旨在设计一套10美元的机器人套件，让全世界儿童都能学习制作自己的可编程机器人，并评选出了若干获奖设计。²


