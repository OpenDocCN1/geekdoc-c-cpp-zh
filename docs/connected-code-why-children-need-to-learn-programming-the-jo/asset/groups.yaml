    - Yew, Jude，83\n- Zagal, José，71\n- Zuckerberg, Mark，125\n\n## 《互联代码》\n\n### 为什么儿童需要学习编程\n\
    \nYasmin B. Kafai 与 Quinn Burke\n\n由 Mitchel Resnick 作序\n\n编程曾被视为由孤独的技术极客所从事的晦涩技艺，如今已被教育工作者和理论家视为所有儿童的一项关键技能，甚至是一种新的素养。在《互联代码》中，Yasmin\
    \ Kafai 和 Quinn Burke 指出，尽管计算思维是一个极好的起点，但“计算参与”这一更宽泛的概念更能捕捉二十一世纪的现实。计算参与超越个体，聚焦于更广泛的社会网络以及数字“制作”的\
    \ DIY 文化。\n\nKafai 和 Burke 描述了计算参与的当代实例：学生编程并非为了编程本身，而是为了创作可分享的游戏、故事和动画；青少年编程社区的出现；混编（而非从零开始）的实践与伦理挑战；以及从固定屏幕转向可编程玩具、工具和纺织品。\n\
    \nYasmin B. Kafai 是宾夕法尼亚大学学习科学教授。她是《超越芭比与真人快打：性别与游戏的新视角》的联合主编，也是《互联游戏：虚拟世界中的青少年》的合著者（两书均由\
    \ MIT Press 出版）。Quinn Burke 是查尔斯顿学院教师教育系助理教授。Kafai 和 Burke 还是《互联游戏》（MIT Press）的合著者。\n\
    \n> “《互联代码》这本书呈现的思想与研究，可能会启发那些想了解如何以及为何教儿童编程能够促成一个协作式创作者社区的人。”\n> ——Peter Rich\
    \ 与 Brian Lindley Jones，Teachers College Record\n\n> “这本书正如其引人注目的标题所暗示的那样引人入胜。”\n\
    > ——Ramon Gonzalez Sanchez，Computing Reviews\n\n> “在二十一世纪，计算机科学与其他任何领域一样具有基础性地位。正如《互联代码》所探讨的，学习构建技术——而非仅仅消费技术——与参与现代社会日益相关。”\n\
    > ——Hadi Partovi，Code.org 创始人\n\n约翰·D.与凯瑟琳·T.麦克阿瑟基金会数字媒体与学习系列\n\n封面照片：Darryl W.\
