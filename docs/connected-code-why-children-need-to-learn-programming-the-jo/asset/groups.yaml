    21 世纪学习与教授技术流畅性意味着什么，在两种观点之间以及学习者与学校派之间找到中间地带；同时也通过认识在 K–12 课堂特有的限制与动态中开展工作的重要性来找到这一中间地带。这并不是一个容易找到的中间地带。前六章的一个共同主题是：如何将
    Scratch 等编码圈子特有的那种零散而自己动手的文化带入学校教育领域，这一挑战一直存在。制度化学校教育与这些远为松散的非正式学习网络似乎彼此冲突；正如第
    5 章所指出的，这种张力在某些数字媒体实践中达到顶点，例如重混（remix）——一个群体大体将其视为创作冲动而拥抱，另一个群体则常将其斥为作弊。


    然而，就计算机与技术教育^3 整体而言，在学习者与学校派之间找到中间地带很重要，因为双方都能通过妥协获益良多。学校派可以通过创建更开放、更有活力的课堂空间而获益，这些空间允许学生利用技术进行更多创造与协作。渴望者（yearners）则可以通过获得合法性而获益——从课后俱乐部和选修课相对受限的空间，转向能吸引更多、更广泛学生的主流课堂。在某种程度上，帕佩特对渴望者与学校派（schoolers）的划分是人为的。大多数教师、家长和学生都处在两极之间的某个位置——对学校教育的某些方面感到满意，又希望彻底改革另一些方面。但为了在我们学校中更有效地教授计算思维与参与，这种二元区分提供了一个框架，用于审视
    K–12 学校当前教授计算的方法、此类教学可以改进的领域，以及教学改革的历史模型。


    本章第一部分考察学校中计算教育的现状——既包括传统学校课堂，也包括课后项目和 DIY 倡议中结构较不正式的学习环境。在每个环境中，学者和学习者处于什么位置？每种环境对于
    K–12 层面的计算教学有什么益处？本章第二部分离开这两个空间，考察 DIY 学习上一次大规模进入 K–12 学校的情形——当时约翰·杜威的教育理论还是新事物，并承诺让学校成为对儿童更实用的体验。这段历史能告诉我们年轻人的抱负与学者的务实精神之间的什么关系？又能从当前计算教育面临的挑战以及技术在学校中的整合中得出哪些启示？本章并非要为教师提供一本
    Scratch 操作指南。已有许多优秀资源可供使用，包括书籍，以及由教育工作者创建并专门服务于教育工作者的整个网站。^4 相反，本章分析更广泛的学校文化，以及这种文化如何影响我们教儿童如何进行计算思考和参与计算的方式。


    ## 计算教育：校内与校外


    根据美国劳工统计局的数据，^5 计算机相关职业是全美增长最快的就业领域之一。然而，在一个拥有超过 42,000 所高中的国家，只有 2,100 所开设高级计算机科学课程。如果这个国家只有
    5% 的高中开设能为大学课程做准备的高级计算机科学课程，那么显然，计算机科学在全国高中里的存在感极低，即使近年来其选修人数有所增加。这种存在感不足尤其体现在高中阶段参加高级计算机科学课程的女生和少数族裔学生人数很少。尽管高中女生占所有参加大学先修课程考试的人数一半以上，但在参加计算机科学考试的人中，女生不到四分之一，而非裔美国考生人数始终低于百分之一。^6


    参加高中高级计算机课程的学生缺乏多样性，反映出课程与教学法需要更新；过去两年，大学理事会试点了修订版的大学先修课程“计算机科学原理”。诸如“计算之美与乐”之类的课程正在取代“JavaScript
    入门”这类以语言为中心的课程。CS 原理课程通过强调计算概念，而不是优先考虑任何单一编程语言，提供了一种更整体的计算学习方法。CS 原理课程还鼓励学生维护作品集、协作工作，并针对各种项目式作业撰写反思。这代表了近年来校内计算教学中最有希望的发展。


    CS 原理与雪莉·特克尔和西摩·帕佩特所倡导的拼装（bricolage）方法更为接近；它摆脱了通过记忆积累内容的传统自上而下方法，转而纳入基于表现的任务，学生通过开发制品来践行计算背后的抽象原理，从而学习这些原理。CS
    原理试点通过迭代过程聚焦特定的最终产品，代表了对完全以单一语言提供教学的一种真正改变。早先的教学强调培养一套离散技能，而新的 CS 原理课程植根于功能性应用的设计，将学习体现在交付物中（如第
    3 章所述）。


    尽管在较高层次上正在取得进展，但很少有学生有机会选修这些更高层次的课程。最近计算机科学选修人数激增，表明存在一小群投入的学生，但美国学校中另外 99% 的学生呢？这些学生在校期间在哪里接触计算教学？学区如何激励教师将计算机科学作为一门学科来教授？事实证明，他们提供的激励很少。尽管参加
    AP 计算机科学考试并选择计算机科学作为本科专业的学生人数最近有所增加，但过去十年，这个国家 K–12 学校中计算机相关课程的数量却减少了。根据美国计算机协会的一份报告，C.
    Wilson、L. A. Sudol、C. Stephenson 和 M. Stehlik 的*《空转：数字时代 K–12 计算机科学教育的失败》*，^8
