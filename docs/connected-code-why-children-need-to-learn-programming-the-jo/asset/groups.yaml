    "There are only two things wrong with schools," quips cognitive psychologist,
    Roger Schank: "What we teach and how we teach it,"^2 and it is easy to be cynical
    about education today, particularly with the increasing number of alternative
    educational opportunities available, offline and online. The role played by digital
    technologies in education may be the most polarizing issue facing teaching pedagogy
    these days, with some people denouncing Web-based media as the downfall of modern
    education and others heralding such media as the single-handed savior of it. This
    chapter aims to find a middle ground between these two views and between the learners
    and schoolers by reconceptualizing what it means to learn and teach technological
    fluency in the twenty-first century but also by appreciating the importance of
    working within the strictures and dynamics characteristic of K–12 classrooms.
    This is not an easy middle ground to find. A common theme across the previous
    six chapters has been the challenge of bringing the scrappy, do-it-yourself culture
    that is characteristic of coding circles like Scratch, among others, into the
    realm of schooling. Institutional schooling and these much looser, informal learning
    networks appear to be at odds with each other, and as chapter 5 points out, this
    tension comes to a head with certain digital media practices such as remix, which
    one community largely embraces as a creative impulse and the other frequently
    dismisses as cheating.


    Yet for computing and technology education^3 overall, finding a middle ground
    between learners and schoolers is important because both groups have much to gain
    by compromise. Schoolers gain by creating classrooms that are more open and dynamic
    spaces that allow for greater student creativity and collaboration using technology.
    Yearners gain by achieving legitimacy—by moving from the relatively confined spaces
    of afterschool clubs and elective courses to mainstream classes that attract a
    greater number and wider range of students. To a certain extent, Papert''s divide
    between yearners and schoolers is an artificial one. Most teachers, parents, and
    students fall somewhere in the middle of these two poles—content with some aspects
    of schooling and wanting to overhaul other aspects. But for the purpose of more
    effectively teaching computational thinking and participation in our schools,
    the binary distinction offers a framework for examining the current methods of
    teaching computing in K–12 schools,'
