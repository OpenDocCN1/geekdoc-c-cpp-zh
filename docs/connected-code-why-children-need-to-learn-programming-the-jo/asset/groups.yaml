    In *Connected Code: Why Children Need to Learn Programming*, Yasmin B. Kafai and
    Quinn Burke document the revival of Papert’s dream. In the past few years, coding
    has suddenly become fashionable again, with numerous websites and organizations
    encouraging and supporting people to learn to code. My Lifelong Kindergarten research
    group at the MIT Media Lab has actively contributed to this trend, developing
    the Scratch programming language and online community to enable young people to
    program and share interactive stories and games, and collaborating with the Lego
    Company on the development of programmable robotics kits.


    Kafai and Burke help put this coding revival in context. Although many people
    have focused on the job and career opportunities associated with computer programming
    (and those opportunities are indeed considerable), Kafai and Burke recognize that
    the appeal of coding goes beyond financial and economic motives. They situate
    the coding revival as part of the larger maker movement. I like to think of the
    coding revival as the coder movement. While the maker movement focuses on new
    ways for people to build, create, personalize, and customize physical things,
    the coder movement does the same for digital things. In both cases, the movements
    are catalyzed by both technological and cultural trends, as new technologies make
    it easier and cheaper to make (and code) things, and a cultural shift toward do-it-yourself
    activities broadens the range of people who want to be involved.


    Perhaps the most important contribution of *Connected Code* is its introduction
    of computational participation as a guiding framework. In recent years, many researchers
    have rallied around computational thinking as a framework and motivation for computer
    science education, arguing that computational concepts can serve as a foundation
    for understanding all types of processes and systems in the world. I recognize
    the power and value of computational ideas but worry that computational thinking
    is often interpreted too narrowly, focusing on how individual people learn and
    use computational concepts for solving problems. Kafai and Burke’s conception
    of computational participation serves as a broader, more inclusive framework for
    computer science education, expanding beyond individual problem solving to include
    personal expression, creative design, and social engagement. This shift, as Kafai
    and Burke note, has “implications for how programming is learned, what is designed,
    and where and how it is shared.”


    The ideas and stories in *Connected Code* provide hope for those of us who have
    spent many years trying to turn Papert’s dream into a reality. We are heartened
    by the growing interest in the maker movement and coder movement. But we also
    recognize that these movements are in their infancies. New technologies for making
    and coding are spreading through society, but people’s mindsets are slower to
    change. Too many people still view computers simply as tools for delivering and
    accessing information. My hope is that *Connected Code* will contribute to a broader
    culture change in which people develop new ways of thinking about computation
    and new ways of thinking about learning.


