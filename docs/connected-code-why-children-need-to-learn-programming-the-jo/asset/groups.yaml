    collaboration as the means to exchange projects through various states of revision.


    # ### Remix as Pedagogy: The Challenge and Possibility of Schools


    # #### A Cultural Challenge


    Of all the characteristics of the aforementioned online Scratch remix challenges,
    three stand out as particularly effective in facilitating beginning programmers’
    learning. First, competing participants created with and for each other to produce
    games and stories that are personally meaningful to them. Second, these youth
    collaborated with their peers, acknowledging that what they did together could
    not be done as well alone. Third, they utilized remix as a means to revise and
    improve on their own work and the work of others. These three elements are aspects
    of learning that are rarely found in K–12 schools (and even in postsecondary education).20


    First, in schools students typically do not produce their own content but summarize
    what others give them. Even when they produce their own work, they do so for their
    teacher and rarely for their peers. Second, even when classes entail collaboration,
    research has shown that group work is ineffective when a small minority of the
    group consistently takes on the majority of the responsibility while others do
    very little.21 Accordingly, many students are disdainful of collaboration while
    others are too eager for it. Third, in schools, remix is not remix but more often
    considered outright plagiarism and is largely discouraged if not banned during
    the school day.


    This third and final point makes clear the distinction between learning in the
    classroom and in DIY youth cultures such as Scratch online. Some may argue that
    the DIY culture of remix is antithetical to the institutional nature of K–12 schooling,
    where order and hierarchy tend to trump spontaneity as two of the core elements
    underpinning the overall educational system. Schools resist remix as a viable
    form of classroom-based production despite the growing number of media theorists
    and educators who posit remix as a new literacy22 and the considerable research
    over the past decade on digital literacies.23'
