    游戏，从互联网粉丝网站下载了样本头像，并在画图编辑器中逐帧细化动作，以实现流畅的定格动画。借助Scratch的可视化编程能力，Jorge为这些图像制作动画，使其响应按键，从而让头像在屏幕上轻松行走，或在控制键触发时跳跃。


    这些从创作视觉设计到编写动画程序的转变，体现了Jorge进入计算思维的路径——因为当头像被要求在做蹲下或跳跃动作时做某事（例如射击）。使用Scratch帮助Jorge理解了专业制作专家如何制作游戏。他还与原游戏的其他粉丝建立联系；这些粉丝像他一样，希望玩到并创作业余衍生作品，作为DIY文化的一部分。


    正如Debbie的教学分数软件一样，Jorge的《Metal Slug Hell Zone X》游戏软件也体现了个人与艺术和技术领域的联系。它还说明了在Web
    2.0之前社会联系的重要性。对Debbie来说，这些联系存在于她的同学和Project Headlight的三年级学生之中；对Jorge来说，这些联系存在于当地的Computer
    Clubhouse社区（该社区提供了欣赏并支持他的受众）以及在线粉丝玩家和游戏社区之中。与Debbie的软件是课堂项目的一部分不同，Jorge对这款电子游戏的设计是由他自己发起的。他重制了一款自己喜欢玩的游戏，然后加入自己的诠释，既没有偏离原作太远，又加入了自己的巧思。玩家设计自己的游戏并不罕见。事实上，许多Project
    Headlight的学生坦言，他们更愿意编写分数游戏程序，而不是分数软件。


    如今，许多游戏都提供角色和关卡编辑器，让玩家能够添加新功能，从而延长游戏的可玩性；但在20世纪80年代和90年代，游戏公司密切关注电子游戏的内容和设计，这些功能几乎闻所未闻。这些业余创作都共享自主制作与原创项目的精神。⁵⁰
    大多数DIY活动发生在非正式的午餐时间计算机俱乐部中，而不是传统课堂上；DIY活动在写作和出版领域同样突出。对同人小说网站以及年轻人使用zine（自制杂志）的研究表明，青少年在校外时光里享受着学术风格的写作、出版和评论，并在此过程中发展出写作者身份。在校内外设计游戏和写故事，展示了设计软件应用如何成为一种丰富的方式，使人们作为生产者而不仅仅是消费者参与数字文化。


    ### 软件应用设计变得流行


    如今，面向应用程序（“apps”）<sup>31</sup>的设计课程越来越受欢迎，并且应当受到鼓励，以扩大参与面。通过拓宽围墙，<sup>32</sup>编程可以应用于一系列设计活动，而不仅仅是狭窄的技术活动。正如八年级学生Daryl在Scratch
    Writers’ Workshop完成自己的数字故事后所说：“Scratch几乎能做任何事。它有数百个控件、数百张图像，你甚至可以从互联网上取用图像……所以你所需要做的就是有一个焦点。”<sup>33</sup>
    设计具体的应用——无论是电子游戏还是数字故事——正代表了这样一种焦点，尤其是当这些应用进一步植根于个人和社会真实的学习情境（如游戏制作工作室和写作工作坊）时。


    设计应用也可以被视为Jeannette Wing（周以真）计算思维的一种直接且易于接触的应用。它抓住了设计系统、解决问题和理解人类行为的关键方面，因为设计游戏或模拟之类的应用涉及创建一个系统，这要求设计者思考用户将如何与他们设计的应用交互，以及如何按照其意图实现功能。在个人层面，设计应用既引发了广泛兴趣，也在让青少年对计算机编程产生兴趣方面取得了很高成功率。也许这就是为什么为学习而制作游戏吸引了许多营利性和非营利性团体。


    这一点最明显地体现在电子游戏制作竞赛的激增上，例如Globaloria的Globey Awards、Advanced Micro Devices的AMD Changing
    the Game竞赛、Games for Change Awards，以及（由白宫联合主办的）National STEM Video Game Design
    Challenge。这些竞赛培养了一种赋能感，


    ## 4 从工具到社区


    Scratch在线网站于2007年5月低调上线。然而，几篇有影响力的科技评论——尤其是5月14日BBC News在线的一篇文章——就足以引发热情流量的激增，使Scratch网站暂时关闭。很快，新访客通过创建个人资料、分享评论以及上传用Scratch代码编写的自己的程序，把Scratch在线社区变成了自己的空间。然后，在2008年6月，网站上出现了新情况。Scratch在线社区的三名成员创立了Green
    Bear Productions，并在网上开设账户，以协作创作高质量电子游戏。创始人——年龄分别为八岁、十三岁和十五岁——很快创作了一款名为“Pearl Harbor”的电子游戏，其玩法类似经典游戏Battleship的数字版。游戏图形的精细程度和玩法的简便性，使其在首次发布时就吸引了数百次浏览和下载。该项目很快出现了多个改编版本。正如Green
    Bear Productions在其网站上解释的那样：“有很多人想加入我们，”该团体的成员数跃升至十八人。很快，Green Bear Productions创作了“Forest
    Frenzy”和“A Night at Dreamy Castle”等游戏，反映出设计者在图形、情节线和玩法方面日益成熟。“Forest Frenzy”在数月间有十九个版本，最终才完成无故障的最终版本。


    在Web 2.0的协作与社交氛围中，像Green Bear Productions这样的在线创意协作生产并非闻所未闻；但在Green Bear Productions，组织这项协作努力的是年轻人而非成年人，而且大多数人此前从未线下见过面。除两名创始成员外，Green
    Bear的成员都没有亲自见过组内其他人。该公司成员位于不同地方，甚至不同时区，他们基于对围绕Scratch开展协作以及儿童校内外学习未来的共同兴趣而走到一起。


    本章第一部分考察这种从编程工具转向编程社区的转变，以及让编程更易获得如何激发青少年协作编程。本章第二部分考察来自Scratch网站的两个此类在线协作，探讨它们的起源和项目。本章最后一部分探讨如何在校内外进一步推动这类协作。能否为这种同伴支持的协作学习设计环境？在这方面，我们有哪些成功与失败的证据？


    ### 让编程更易获得：工具的兴起


    在过去二十年中，促进编程教与学的大多数努力较少关注促进协作，而更多关注设计更直观、更具支持性的编程工具。当Papert推出Logo，作为一种让儿童编程更直观、更具社交性的工具时，他无意中催生了一个名副其实的家庭作坊式产业——基于其模型的入门编程语言。迄今为止，已出现近两百种不同的Logo变体，还有更多仍在开发中——包括Cricket
    Logo（将Logo语言应用于可编程手持机器人玩具）、Terrapin Logo（允许加入多声部音乐）和Logo3D（为原本的二维输出增加了一个全新维度）等变体。⁶
    其他入门编程语言也共享Logo的目标：让年轻用户更容易接触编程，并使编程更直观。这包括计算机先驱Alan Kay的Smalltalk，以及后来的Squeak和eToys；它们的编程环境允许用户创建程序，还可以检查和修改工具本身。⁷
    科学教育家Andrea diSessa的Boxer编程语言以Logo模型为基础，但引入了可点击的“盒子”作为编程命令的所在，将代码从一系列键入的行转变为若干并置且相互关联的编码盒子。⁸
    计算机科学家Mark Guzdial在Emile中推广嵌入式图形支架；Emile是一种编程环境，通过具体、循序渐进的方法帮助初学者掌握编码概念。Guzdial指出，这种动手操作的图形化说明对初学者程序员往往很有必要，因为他们需要让代码不那么

