    # # 4 From Tools to Communities


    The Scratch online site opened in May 2007 with little fanfare. Yet a few well-placed
    tech reviews, particularly a May 14 article in BBC News online—was enough to generate
    a surge of enthusiastic traffic that shut down the Scratch site temporarily. Soon
    new visitors were making Scratch online their own by creating individual profiles,
    sharing comments, and uploading their own programs in Scratch code. Then in June
    2008 something new occurred at the site. Three members of the Scratch online community
    founded Green Bear Productions and opened an account online to create high-quality
    video games collaboratively. The founders—ages eight, thirteen, and fifteen—soon
    created a video game entitled “Pearl Harbor” that functioned like a digital version
    of the classic Battleship. The sophistication of the game’s graphics and the ease
    of game play attracted hundreds of views and downloads on its initial release.
    Multiple remixes of the project soon followed. As Green Bear Productions explains
    at its website, “we had a lot of people who wanted to join us,” and membership
    within the group jumped to eighteen. Soon Green Bear Productions created games
    such as “Forest Frenzy” and “A Night at Dreamy Castle” that reflected the designers’
    growing sophistication in creating graphics, plotlines, and game play. “Forest
    Frenzy” had nineteen versions over a period of multiple months before a final
    glitch-free version was completed.


    In the collaborative and social climate of Web 2.0, online creative collaborative
    production like that of Green Bear Productions is not unheard of, but at Green
    Bear Productions, it is young people, not adults, who organized this collaborative
    effort, and most had never met each other in person before. Other than two of
    the founding members, none of Green Bear’s members had ever personally met the
    others in the group. Members of the company were located in different places,
    even different time zones, and came together based on their common interest in
    collaborating on Scratch'
