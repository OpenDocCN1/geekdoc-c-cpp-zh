    In the early stages of designing Lego/Logo, computer scientist Mitchel Resnick
    and toy designer Steven Ocko described it as a tool for animating and controlling
    Lego objects with engines and sensors.⁵ Designers wrote programs on the computer,
    and those programs were used to command the sensors and engines in Lego objects
    that were tethered to the computer via long cables. Lego objects could navigate
    mazes on their own and no longer needed to be moved by hand. Sensors that reacted
    to light, touch, and sound could be programmed to react to the environment, adjust
    behavior accordingly, and display alternative behavior. Later developments such
    as the programmable brick removed the cable tethers by downloading the programs
    into a small computer that could be combined with Lego bricks (figure 6.1).


    As Mitchel Resnick, Fred Martin, Randy Sargent, and Brian Silverman proposed,
    Lego/Logo and the programmable brick could become toys-to-think-with in the design
    of interactive environments—such as alarm clocks that tilt beds to stir late morning
    sleepers, miniature Ferris wheels that spin in intervals, or dolls that periodically
    blink their eyelids. The programmable brick could turn it into a behavior construction
    kit. Young designers could design autonomous creatures that mimicked the actions
    of living animals by programming simple behaviors, such as retracting the head
    or moving backward when the turtle hit a wall. Finally, they could use the programmable
    bricks to construct scientific instruments, such as a miniature pedometer that
    records a pet hamster''s nightly running patterns in its cage. In each of these
    cases, young designers engineered Lego structures that could be animated with
    machines and controlled with sensors and also wrote program commands defining
    the conditions under which particular actions would be executed. This is no small
    feat. Coordinating these imagined designs and built systems is challenging even
    for undergraduate engineering students. This was documented by computer science
