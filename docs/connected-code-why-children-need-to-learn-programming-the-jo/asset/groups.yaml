    2013年2月26日，非营利组织 code.org 在 YouTube 上发布了一段由莱斯利·奇尔科特（Lesley Chilcott）执导的视频，名为《学校不教什么》（What
    Schools Don’t Teach）。视频开头引用了苹果联合创始人史蒂夫·乔布斯（Steve Jobs）的话：“每个人都应该学习编程……因为它教会你如何思考。”结尾则写道：“美国有一百万个最好的工作岗位可能无人问津，因为只有十分之一的学校教学生编程。”众多名流谈到了他们第一次接触电脑和编写程序的经历。微软联合创始人比尔·盖茨（Bill
    Gates）回忆说，他第一次使用电脑时十三岁，并编写了一个玩井字棋的游戏。clothia.com 的创始人埃琳娜·西莱诺克（Elena Silenok）记得让一个绿色圆圈和一个红色方块出现在屏幕上。Valve
    的创始人加布·纽维尔（Gabe Newell）提到，当他第一次在屏幕上看到“Hello, world”时，体会到一种惊奇之感。Facebook 的创始人之一马克·扎克伯格（Mark
    Zuckerberg）谈到了从一个简单程序开始并不断添加功能的过程；Dropbox 创始人德鲁·休斯顿（Drew Houston）则将编程比作演奏乐器或进行体育运动。迈阿密热火队的全明星
    NBA 球员克里斯·波什（Chris Bosh）反思道：“一开始非常吓人，但随着时间的推移你会慢慢上手。编程是可以学会的。”这段视频传达的总信息是：电脑无处不在。正如摇滚乐队黑眼豆豆成员威尔.艾姆（Will.i.am）总结的那样：“我们身处2013年。一切都依赖技术——沟通、银行、信息——而我们中没有一个人懂得如何读写代码。”视频随后呼吁观众采取行动：“无论你想成为医生还是摇滚明星，请在你们的学校询问编程课程，或者上
    code.org 在线学习。”几天之内，这段视频就获得了数百万的观看量。“给你的生活带来一点精彩，”奇尔科特在《赫芬顿邮报》一篇关于 code.org 网站的文章中敦促道，“去上一课吧。”


    在几年前，一段名人讨论他们接触电脑和编程的起步经历并敦促观众学习编程的视频，不太可能获得成功。然而，YouTube 视频中那些人表现出的兴奋和真诚，可能是迄今最清晰的迹象，表明编程正在卷土重来。视频展示了三维动画、音乐工作室、编队飞行的无人机、手术室里的电脑屏幕，以及软件行业中设施一流的工作场所。它利用了学习编程能给个人带来的赋权感。正如
    Valve 创始人加布·纽维尔宣称：“明天的程序员就是未来的巫师……要知道，与其他人相比，你会显得拥有魔法力量。”NBA 球员克里斯·波什稍后补充道：“这太神奇了……我认为这是最接近超能力的东西了。”这些程序员所占据的时尚办公室的全景截图，含蓄地将学习编程与找到高薪工作以及一览无余的城市天际线联系起来。


    然而，2013年2月的这段视频也引发了一些不安，教育研究者简·马戈利斯（Jane Margolis）在3月于 SIGCSE ''13 计算机科学教育者会议上的闭幕主题演讲中表达了这种不安。马戈利斯指出，这段视频常常强化了“神童神话”，即编程更像是一种超能力，而不是一项可以习得的技能。视频中出现了一些女性形象，却没有承认她所称的许多受访者拥有的“预备优势”——即20世纪80年代家中昂贵的电脑、私人教师，以及在软件行业工作的父母。这些关键要素被
    code.org 视频中的演讲者随口提及，仿佛它们是常态而非例外。接触机会是一个重要问题。在考虑技术造诣之前，我们需要解决一些基本因素——接触电脑、知识和支持的途径。


    视频聚焦于开放式办公室和娱乐区、提供免费小吃的小卖部，以及干洗服务等现场便利设施，却没有关注计算机科学家应有的社会责任——改善技术制造业中繁重的工作条件、开发更好的方式回收废弃技术，以及增加代表性不足群体的参与。这些问题已经获得了大量公众关注，表明计算机科学界需要重新评估自己的公共形象。有些人，比如
    *Girl Develop It* 的创始人瓦妮莎·赫斯特（Vanessa Hurst），指出：“如果有人早告诉我，软件实际上是关于人性的，是关于利用技术帮助他人，我的观点早就改变了。”但视频很少关注这些将编程带入社会互动和社会关联领域的另类、更宏大的视角，尽管这种视角关乎计算机的日常关联性和公民责任。


    最后，尽管史蒂夫·乔布斯的引言声称编程“教会你如何思考”，但编程只是学习计算思维的众多方式之一。乔布斯的话不像视频中其他受访者那样宏大，但它可能既是最有力也最有问题的一句。如果编程很重要，那么我们就有责任教育每个人，而不是暗示这种学习是魔法或巫术。长期以来，在公众意识中，编程一直是一种供少数精英消遣的博学爱好。视频对超能力的承诺并不能改变这种看法，但有助于揭示关于接触机会、兴趣、努力和支持的更广泛问题。只要编程仍被视为一种思维形式和个体心智的参与（这是有问题的一面），而不是同样被视为一种参与和表达的形式（这是有力的一面），我们就无法从当今网络化社区中的编程学习和教学中获益。


    *《连接代码：为什么儿童需要学习编程》* 是一份行动号召，旨在促进计算参与：我们如何更好地设计编程活动、工具和材料，用于 K-12 学校的教与学？我们认为，计算思维应被视为计算参与，以强调游戏、故事和艺术等编程项目不仅是“可以思考的对象”（借用西摩·帕尔特（Seymour
    Papert）的一个观点），而且也是“可以分享的对象”，将我们与他人联系在一起。有些人可能会争辩说，将编程引入 K-12 学校现在会像三十年前一样失败。那些坚持认为编程是少数人专属技能的人，通常也坚持认为它本质上是一种非社会性活动。


    但今天，年轻人正在网站、俱乐部和教室里参与计算活动，在这种热情的“自己动手”数字伦理中，我们看到了编程能够在学校蓬勃发展的证据。这群年轻的 DIY 爱好者需要扩大，以便更多儿童接触到编程的创造性和协作潜力。而帕尔特的观点——如今已超过三十年——在理解学习编程在公共环境中最具吸引力和最有效方面是有先见之明的。有些网站上，数百万孩子在那里想象、设计并自由分享他们的程序。在
    DIY 文化中，编程正在成为更广泛的数字文化的一部分。因此，当我们把编程带回学校时，我们可以借鉴 Project Headlight 编程圈和 Scratch
    在线编程社区的经验教训，以及从对媒体实践和可编程媒体手段的更广泛理解中汲取营养。


    为了扩展珍妮特·温（Jeannette Wing）对计算思维的定义，我们将计算参与视为：与他人一起解决问题，为他人并与他人一起设计直观的系统，以及通过计算机科学的概念、实践和视角来了解人类行为的文化和社会属性。让孩子编写应用程序、分组工作和混合代码，并不会解决所有与扩大计算参与相关的挑战，但它代表了关键的第一步。商业玩具行业正在开发编程应用程序，允许儿童设计对他们自己和他人都意义重大的作品。新的创客套件和智能玩具的流行表明，孩子们既想要能亮灯发声的互动玩具，也想要能让他们自己进行互动设计的玩具。他们想决定灯何时闪烁、蜂鸣器何时响起，教育工作者可以在课堂上培养这种精神。通过将编程变成一种社区活动，教育工作者可以把学校变成正式和非正式分享与协作的场所。


    在计算思维的背景下，这意味着我们需要超越将编程视为一种个人行为的看法，开始将其理解为一种公共实践，它反映了今天的学生如何参与他们的社区。对于学校来说，这不是一小步，因为在决定学业成功的标准时，个人成就远远超过群体动力。然而，如果说过去十年和
    Web 2.0 的出现教会了我们什么，那就是协作在促成更具创造性和成本效益的解决问题方案方面的重要性。有机会参与编程社区并与之合作，是学习编程基本概念和实践的关键，这反过来又为人们提供了前所未有的机会，参与更广泛的数字公共空间。

