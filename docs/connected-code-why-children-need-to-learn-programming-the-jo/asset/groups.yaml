    学生们在十周结束时被期望提交其规划故事线的故事板、在 Scratch 中准备数字草稿、提供同伴反馈、提交最终作品并进行展示。项目会被评分，且出勤是强制性的。俱乐部没有为参与者设定目标。他们都被鼓励在十周结束时进行展示，但不附加成绩，也不强制出勤。


    这一比较的结果很有意思。在课堂中，为写作工作坊设定的有意识、迭代的目标在产品方面效果良好。近90%的学生完成了一个数字故事，将其发布到 Scratch 网站上，并在工作坊结束时向同伴展示。这些故事长度从两到三分钟不等，基于真实生活经历或来自电影、电视和漫画书的文化偶像。它们相对较短，但有清晰的开头、中间和结尾，包含多个角色和场景变化，有些还包含对话和音效。在俱乐部中，只有71%的参与者完成了
    Scratch 项目，但他们制作的项目数量几乎是课堂组的两倍。俱乐部的项目也更多样。虽然课堂环境中的项目都是叙事故事，但俱乐部项目包括互动艺术作品和视频游戏，这意味着使用了更多类型的编程概念。


    这些发现远非定论，但表明一些 Scratch 课后俱乐部成员在计算方面的参与程度高于课堂中的同伴。尽管30%的俱乐部成员从未完成或提交项目，但提交了项目的70%比课堂中的同伴参与得更充分。许多俱乐部成员在十周内完成了四五个项目。这些俱乐部成员还在
    Scratch 网站上创建了更丰富的在线个人资料，在网上与他人加为好友，并更经常地混编他人作品（俱乐部中26%的项目被混编，而课堂中为10%）。在课堂上，学生曾两次指责同学通过混编他人作品作弊。


    然而，课堂中更高的完成率（90%，而俱乐部为71%）支持将计算学习纳入学校日常教学。而且，尽管课堂学生基于故事的提交作品更为统一，这种统一性使评估和给出最终成绩更容易。尽管一些向往者希望让学校摆脱评分等级，但评估在确保基于项目的学习进入课堂并作为教学的一部分留在课堂方面发挥着重要作用。


    杜威在20世纪之交创办的实验学校，使这些学校与当时和如今的大多数美国课堂截然不同。那里没有课桌，黑板（如果有黑板的话）也不是墙面的特色元素。学生们围坐桌边彼此相对，而不是面向教师；他们动手操作，不仅使用铅笔和纸，还接触实物。参与能产生超越课堂的内容和意义的活动——无论是煮鸡蛋还是做木箱——在杜威的进步主义教育哲学中是一项必要之举。“如果这种冲动得到锻炼、得到利用，”他在*学校与社会*中写道，“它就会撞上它必须适应的严酷条件的现实世界；而纪律和知识等因素又会在这里发挥作用。”²³


    对杜威而言，学校所推广的学习活动必须能在儿童课堂之外所处的世界中应用和检验。教学必须把课堂与真实世界联系起来。杜威指出，为实现这一点，支撑其教学方法的正是结构——而非缺乏结构。杜威关于创设情境和提供材料的观念，与佩珀特的观点相呼应。佩珀特认为，“没有课程的教学并不意味着自发、自由形式的课堂，也不意味着简单地‘让孩子独自待着’。它意味着支持儿童用取自周围文化的材料建构自己的智力结构。在这种模式中，教育干预意味着改变文化，在其中规划新的建设性要素，并消除有害要素。”²⁴
    对佩珀特而言，计算机提供了材料、情境和体验，使学习者能够与真实世界建立联系。


    对杜威而言，经验不能只是随便什么经验；同样，技术不能仅作为目的本身来使用。“就其本质而言，”杜威在*经验与自然*中写道，“技术关注的是事物和行为作为工具的功能，而不是它们的直接性。”²⁵
    不能假定仅仅在教室里拥有设备，就足以让儿童理解其全部潜力。杜威还指出，学校仍然有义务应对最新技术。1933年，他与J. L. 柴尔兹写道：“技术正在改变、甚至革命化学校之外的行为和信念”；“因此我们确信……社会和教育理论与概念的发展，必须明确参照我们所属这一代人中标志并分裂我国国内、经济和政治生活的需求与问题。”²⁶


    杜威断言，学校有责任培养儿童在阅读、写作和大众媒体方面的素养。他在谈到大众媒体日益普及时写道：“在使用语言工具方面有读写能力、但在社会信息与理解方面未受教育的公众，会轻易成为那些为自身私人的经济和政治目的而利用公共新闻界的人的受害者。”²⁷


    杜威在这里的警告，预示了道格拉斯·拉什科夫在*编程，还是被编程：数字时代的十条命令*中自己作出的长篇警告，即关于参与Web 2.0媒体数字公众的局限。²⁸
    杜威指的是威廉·伦道夫·赫斯特这样的报业大亨，而不是Facebook这样的社交媒体网站，但信息很清楚：对工具的技术性理解是不够的。人们需要理解工具运作的语境以及它所产生的语境。这代表着根本性的学习，而这种学习需要有意义体验。计算机用于形成性、总结性或诊断性结果。作为一种工具，计算机放大交流，例如当Microsoft
    PowerPoint被用来辅助演示时。最后，作为被辅导者，计算机通过接受学生的指令来确定其功能和输出，从而充当学习者。


    这些要素存在于杜威和佩珀特的学校教育愿景中，而随着创客空间、DIY学习和在线创意社区日益流行——在这些地方，代码已成为通用语——这一愿景正在复兴。正如这些DIY圈子的参与者可以证明的，编程不仅仅关乎让机器进行计算，也关乎与更大的世界交流。需要弥合向往者与学校派之间的鸿沟，使课堂更加以学生为中心、以产品为导向并真正具有协作性。但这种鸿沟在技术教育中代表着一个机会，因为课堂和在线创客社区提供了独特的学习环境，二者合在一起可以增加把编程作为一种新素养来接触的儿童数量，并重塑学校对计算机的使用，使其更具创造性和协作性。这一中间地带——学习环境的融合——为儿童产生了最有趣的教育机会。“只有在这样一种学习方式发生变异和杂交的生态中，”佩珀特在*儿童的机器：在计算机时代重新思考学校*的结尾写道，“一种真正全新的学习文化才可能出现。”³²

    '
