    section, which are then vetted by these senior members. Although not all members
    program at the collab, the RPG acts as a community of practice, bringing in new
    members who grow to understand the prevailing rules of the group. Those who remain
    and contribute regularly using the designated comments section eventually have
    the opportunity to ascend to a more senior position and begin coding the animations
    and music to accompany the ongoing script. A pathway, however informal, is in
    place.


    This element of a pathway is key. Five elements appear to be crucial to the success
    of online collaborations around open-source software projects, whether animated
    movies, interactive video games, or some hybrid between the two.11 Successful
    collaborations seem to have members who are intrinsically motivated and self-selected
    for tasks, a charismatic and capable leader, a meritocratic and rational culture,
    a modular and granular division of labor, and collaborative technologies. Green
    Bear Productions and Warriors of the Blue both incorporate these elements. Although
    WOB was run more as a top-down hierarchy than the more democratic Green Bear,
    both collabs had founders who hosted the rest of the team at their site and who
    were the main enforcers of the group''s rules. Likewise, both'
  - '[PAGE 86]


    groups utilized the technical elements of the Scratch website to delineate individual
    contributions. For Green Bear, multiple iterations of projects were posted at
    the galleries section. For WOB, participants used the comments feature in innovative
    (and unexpected) ways to serialize narratives by individual contributions.


    The pathway that these two collabs were able to chart on their own is not one
    that most Scratch members are able to follow as a viable pathway. The high level
    of collaboration that these two collabs illustrate represents the exception rather
    than the norm at the Scratch website. A recent analysis of five thousand randomly
    sampled Scratch user profiles online reveals that less than half had ever submitted
    any project online, remixed another''s work, or collaborated with others on a
    single project.<sup>44</sup> This is typical of most online sites and is not surprising.
    Despite the myth that today’s children are all eager “digital natives,” recent
    research suggests that children are less empowered and galvanized by digital media
    than some might think.<sup>45</sup>


    An exploratory study of middle-school students who were using an early version
    of the Scratch website showed that many children were uncomfortable with sharing
    their projects online, are nervous about the comments they will receive, and want
    to post the project only when it is “just right.”<sup>46</sup> Even after users
    submit their work, there is no assurance that they will find the audience and
    attention that motivate many to share online. Max O. Lorenzo’s 80/20 distribution
    curve<sup>47</sup> (20 percent of a population receives 80 percent of the attention)
    plays out in Scratch. An examination of 2.2 million projects at the Scratch site
    showed that the 20 percent most-viewed Scratchers received 95.6 percent of views,
    and the other 80 percent of Scratchers received 4.4 percent of views.<sup>48</sup>
    Recognizing these steep discrepancies in collaboration and participation, the
    Scratch team began to conceive of ways to bring together more of its users online.


    # Initiating DIY Youth Collaborations: Creating Online Collabs and Camps in Schools


    In 2010, a new Scratch research focus on collaboration and computation in a networked
    commons looked at how learning to program and learning to participate could be
    mutually beneficial. Would a forum help new users grow more comfortable sharing
    their own work online and find others with like interests? Could more experienced
    users serve as mentors to those new'
  - "[PAGE 87]\n\nusers? To this end, the first annual Collab Challenge was launched\
