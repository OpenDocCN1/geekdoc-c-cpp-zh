    # # Connected Code


    # ## Why Children Need to Learn Programming


    Yasmin B. Kafai and Quinn Burke


    foreword by Mitchel Resnick


    Coding, once considered an arcane craft practiced by solitary techies, is now
    recognized by educators and theorists as a crucial skill, even a new literacy,
    for all children. In Connected Code, Yasmin Kafai and Quinn Burke argue that although
    computational thinking represents an excellent starting point, the broader conception
    of “computational participation” better captures the twenty-first-century reality.
    Computational participation moves beyond the individual to focus on wider social
    networks and a DIY culture of digital “making.”


    Kafai and Burke describe contemporary examples of computational participation:
    students who code not for the sake of coding but to create games, stories, and
    animations to share; the emergence of youth programming communities; the practices
    and ethical challenges of remixing (rather than starting from scratch); and the
    move beyond stationary screens to programmable toys, tools, and textiles.


    Yasmin B. Kafai is Professor of Learning Sciences at the University of Pennsylvania.
    She is the coeditor of Beyond Barbie and Mortal Kombat: New Perspectives on Gender
    and Gaming and coauthor of Connected Play: Tweens in a Virtual World (both published
    by the MIT Press). Quinn Burke is Assistant Professor in the Department of Teacher
    Education at the College of Charleston. Kafai and Quinn are also coauthors of
    Connected Gaming (MIT Press).


    > > “Connected Code is a book that presents ideas and research that may inspire
    those looking to understand how and why teaching children to program can lead
    to a collaborative community of creators.”

    > > —Peter Rich and Brian Lindley Jones, Teachers College Record


    > > “This book is as engaging as its catchy title suggests.”

    > > —Ramon Gonzalez Sanchez, Computing Reviews


    > > “In the twenty-first century, computer science is just as foundational a field
    as any. As Connected Code explores, learning to build technology—rather than merely
    consume it—is increasingly relevant to participation in modern society.”

    > > —Hadi Partovi, Founder, Code.org


    The John D. and Catherine T. MacArthur Foundation Series

    on Digital Media and Learning


    Cover photo by Darryl W. Moran


    The MIT Press

    Massachusetts Institute

    Cambridge, Massachusetts

    http://mitpress.mit.edu

    978-0-262-52967-9


