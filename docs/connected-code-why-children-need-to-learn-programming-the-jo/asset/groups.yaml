    **图 6.1** 乐高 TC Logo（上）和乐高 Mindstorms 包装盒（下）。图片由乐高集团提供。


    重建并让广受欢迎的《星球大战》电影系列中的机器人动起来。以前只有大学课堂和大学实验室里的学生才能获得的机器人技术和材料，现在学校与家庭也能获得，而且价格相对可负担。以
    Basic、Logo 和 Pascal 进行的编程教学早已被学校计算机实验室放弃，因此通过机器人学习编程和工程，便经由课后俱乐部的后门进入。多年来，课后机器人俱乐部成为许多
    K–12 学校中少数让编程和工程得以安身的地方之一，但这个家始终在标准课程之外。


    K–12 中的机器人技术还带来了一种展示和分享设计的新模式——竞赛。这些竞赛源于麻省理工学院一月份的机器人课程，这些课程让工程学生在小学期期间获得实际焊接和动手建造实物的实践经验。⁵
    每门机器人课程都以一场公开竞赛告终，竞赛在坐满欢呼学生的大礼堂举行。挑战往往是平凡的任务，比如收集散落的乒乓球并把它们移到桌子另一边。但考虑到机器人是舞台上唯一的行动者，这些日常任务需要工程团队进行大量预先思考和修改。


    机器人竞赛已成为带有新锐气息的科学展，为典型的机器人设计挑战（如搭建高塔、穿过迷宫，或收集乒乓球并把它们移到桌子另一边）提供公众曝光和真实受众。FIRST（For
    Inspiration and Recognition of Science and Technology，科学与技术的激励与认可）乐高联赛活动始于 1992
    年，如今来自全国和世界各地的高中参加地方、区域和全国级别的比赛。¹⁰ 布兰迪斯大学最近开展、受 FIRST 乐高联赛委托的一项研究报告称，该活动对参与者的态度、技能、科学技术知识和自信心产生了积极影响。¹¹
    此外，参与这些活动（通常由教师或家长的鼓励所驱动）与后来选择科学、技术、工程和数学（STEM）专业高度相关。


    尽管机器人竞赛现在被视为 K–12 学校创意计算与工程文化中一个成熟的部分，而且在许多地方是唯一的部分，但它们并未触及所有人。它们在提高女孩和少数族裔参与度方面只取得了有限成功。


    ![](img/9eb64eca0f040452d3ba8df0d78b35a9_115_0.png)


    ![](img/9eb64eca0f040452d3ba8df0d78b35a9_115_1.png)


    **图 6.2**

    男孩们在玩乐高 Mindstorms（上）以及机器人示例（下）。图片由乐高集团提供。


    在 2008–2009 学年，有 7,800 支队伍参加了 FIRST 乐高联赛机器人竞赛，70% 的青年参与者是男孩和白人。这一发现似乎反映出女孩和代表性不足群体在科学展中同样边缘化的参与情况，尤其是在物理、地球科学以及数学或计算机科学项目中。¹²
    此外，机器人队伍受限于能参加的学生人数，因此这些活动不容易扩大规模。支付材料费用和前往机器人竞赛的差旅费用十分昂贵，常常需要学校举办大规模筹款活动，为课后机器人项目以及参加州外竞赛提供资金。


    最后，竞赛为学习项目提供了受众。尽管为应对特定设计挑战而搭建机器人是一种丰富的学习与协作体验，¹³ 但竞赛中推崇的赢家通吃方式可能并不吸引某些人。竞赛提供了真实且有回报的受众，但从日益增多的在线竞赛来看，它们似乎已成为所有数字媒体设计评审的默认受众。STEM
    全国电子游戏设计挑战赛以及数十个其他竞赛已成为学校游戏设计的核心渠道。¹⁴ 尽管竞赛提供了有价值的受众，但它们不能也不应成为让青年参与计算实践的唯一渠道，尤其是考虑到它们在接触并扩大参与方面的过往记录相当有限。


    许多课后项目、社区技术中心和组织已经完成了 K–12 学校在引入计算创造力方面未能完成的工作。但其中太多俱乐部会所未能扩大该学科的参与范围，反而与许多人眼中代表计算领域的极客俱乐部如出一辙。如果组织创建使用不同材料和活动的新俱乐部会所，而不是旨在把所有人带入现有模式，会怎样？这正是计算机科学家
    Leah Buechley 等人着手开发一类新型计算搭建套件时提出并回答的问题；这类套件用纺织品代替积木，并在工程之外加入手工制作。


    ## 开辟新俱乐部会所：电子纺织品


    纺织搭建套件，也称为电子纺织品（e-textiles），是相当近期才出现的。电子纺织品是可编程的服装、配饰和戏服，它们融入嵌入式计算元素，使织物制品的行为能够被控制。设计电子纺织品可能涉及新型材料（如导电纤维或魔术贴）、光和声传感器、执行器（如
    LED 和扬声器），以及纺织工艺的传统方面。一款流行的电子纺织品搭建套件是 LilyPad Arduino，¹⁵ 它使新手工程师和设计师能够将电子硬件嵌入纺织品中（图
    6.3）。


    制作电子纺织品时，设计师用导电缝线将 LilyPad 模块缝在一起，并使用流行的 Arduino 或 ModKit 开发环境对 LilyPad 微控制器进行编程，以管理其设计中的传感器和输出模块（如
    LED）。


    自 2007 年商业发布以来，LilyPad Arduino 已被世界各地各个年龄段的设计师和工程师广泛采用，并被多所大学用于计算机科学、工程、美术和设计课程。电子纺织品可以被视为更大规模
    DIY 运动的一部分；该运动旨在推动传统制造业之外的个性化制造，并且也可以延伸进课堂，如下面一个高中电子纺织品课程的例子所示（图 6.4）。


    当人们制作电子纺织品设计时，他们学到什么？学生学习缝纫和其他类型的手工制作，这些内容常见于职业教育或休闲时间，但通常不出现在科学和数学等传统学校学科的情境中。


    此外，学生通过设计功能性电路来学习工程：将鳄鱼夹连接到电池、开关和 LED；对齐 LED 的极性端；给线头打结；并将这些缝到织物上。学生还会学习如何编写和改编
    Arduino 代码，这些代码控制和执行传感器与执行器的预期行为，从而为接触计算概念和实践提供语境。¹⁶


    发明 LilyPad Arduino 的 Leah Buechley 认为，这种设计学习使技术的不同层次和连接显现出来，而这些层次和连接常常隐藏在装在光鲜外壳中、却很少揭示其底层的市售技术里


    **图 6.3**

    LilyPad Arduino 及组件：转向信号夹克（上），以及用导电缝线缝制（中右）和 LilyPad、传感器及电池座（中左）。一群学生在富兰克林研究所的电子纺织品工作坊（下）。照片由
    Eunkyung Lee 拍摄。


