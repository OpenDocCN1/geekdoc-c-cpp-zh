    a popular topic in the Forums section, but members also post to find and “friend”
    other potential collaborators, brainstorm project ideas, and request and share
    technical know-how (such as how to create more advanced scrolling games or how
    to import video into Scratch as an animation). The sharing that takes place in
    the Forums (particularly that related to technical expertise) has now led to the
    development of a Scratch-related wiki that includes nearly a thousand unique pages,
    most of which have been created not by the MIT Scratch team but by Scratchers
    themselves.19


    Although there used to be a distinction between the Scratch software as the programming
    tool and the online website as the corresponding community, the tremendous growth
    of this community and its resources demonstrates its utility as a tool itself.
    In the new version of Scratch 2.0, the Scratch design team no longer makes any
    division between Scratch as a tool and Scratch as a community. Young designers
    code and communicate at a single website. The expectation is that these new windows
    of community will ultimately make it easier for people to connect and collaborate,
    thus further dropping the floors, raising the ceilings, and widening the walls
    for everyone. The community case studies that follow exemplify these three elements.


