    and efficient coding schema. Remix in this instance is a pathway for learning
    and a challenge, touching on what Papert refers to as the "hard fun" component
    characteristic of coding.<sup>16</sup>


    This third category of remix is unique in that its level of socialization is characteristic
    of the "adding" remixes and the intent to spur increased productivity is characteristic
    of the "how-to" remixes. The first of these two goals is epitomized by the popularity
    of remixable "coloring contests" at the Scratch site. In these contests, an individual
    user posts a colorless self-drawn or imported image, a set of rules in the Project
    Notes section (such as what colors can be used and whether music and backgrounds
    can be added), and a deadline. The creator of the contest typically selects the
    winning colored remix, although winners occasionally are determined based on the
    number of project views or "Love Its" that a remix receives. Winners thus gain
    status at the Scratch site, and the contest''s creator has a chance to be featured
    on the front page if the contest is especially popular with the community.<sup>17</sup>


    Like "adding" remixes, these coloring contests generate hundreds of remixes from
    a single entry, but as is typical with remixes that are developed largely out
    of socializing, what they gain in breadth, they lose in depth. The majority of
    coloring contest remixes entail little coding complexity, if any code at all,
    and entries typically are judged solely on the static image. Other contests at
    the Scratch site are more sophisticated. In the Roomba Remix Challenge, a user
    is presented with the floor plan of a two-bedroom apartment that is to be cleaned
    by the autonomous Roomba vacuum (figure 5.4).


    ![](img/9eb64eca0f040452d3ba8df0d78b35a9_102_0.png)


    Figure 5.4 Three “geeking out” remixes: “The Roomba Remix Challenge,” “Bedroom
    Maker,” and “Laser Tower Defense.”


    The vacuum moves around the room at random while a timer (designating battery
    life) clicks at the bottom right. As the Roomba moves across the floor, it leaves
    a white pathway designating what has been cleaned. There are no controls for the
    user. In the Project Notes section, the project’s creator explains the purpose
    of the project. “So what’s the point, I hear you ask?” reads the Notes. “The point
    is to modify the programming logic in the Roomba to clean the floor more efficiently
    than the really dumb code that I supply is doing, before your battery runs flat.”
    The author makes suggestions (such as sensors for better collision detection and
    even add logic to the machine) and explains that the project is “a game where
    you have to think about the programming, because a change to the program can take
    a few seconds but you have to wait several minutes as the vacuum does its job
    before you know how well you’ve done!”


    Geared toward experienced Scratch programmers, the Roomba Remix Challenge is at
    the other end of the spectrum from the coloring contests. It requires tinkering,
    innovative thinking, and patience. The remixer has to conduct extended test runs
    of the vacuum each time to see if the revised code is making the device a more
    efficient cleaning agent. In their analysis of the social structures underpinning
    remix cultures, media scholars Giorgos Cheliotis and Jude Yew point to the significant
    role that is played by competitions in drawing new users to websites and in retaining
    interest and spurring motivation (and productivity) among experienced members.<sup>18</sup>
    This was our experience with the series of Scratch-based collaborative challenges
    sponsored at the website that are discussed in chapter 4.<sup>19</sup> Now entering
    into their fourth year, these collaborative initiatives start with a “seed project,”
    which is a skeleton of a project and offers a basic framework (like a digital
    story or interactive art project) that entrants can use to remix in their respective
    teams. Remix sparks the collaborative activity and sustains this collaboration
    as the means to exchange projects through various states of revision.


    ## Remix as Pedagogy: The Challenge and Possibility of Schools


    ### A Cultural Challenge


    Of all the characteristics of the aforementioned online Scratch remix challenges,
    three stand out as particularly effective in facilitating beginning programmers’
    learning. First, competing participants created with and for each other to produce
    games and stories that are personally meaningful to them. Second, these youth
    collaborated with their peers, acknowledging that what they did together could
    not be done as well alone. Third, they utilized remix as a means to revise and
    improve on their own work and the work of others. These three elements are aspects
    of learning that are rarely found in K–12 schools (and even in postsecondary education).<sup>20</sup>


    First, in schools students typically do not produce their own content but summarize
    what others give them. Even when they produce their own work, they do so for their
    teacher and rarely for their peers. Second, even when classes entail collaboration,
    research has shown that group work is ineffective when a small minority of the
    group consistently takes on the majority of the responsibility while others do
    very little.<sup>21</sup> Accordingly, many students are disdainful of collaboration
    while others are too eager for it. Third, in schools, remix is not remix but more
    often considered outright plagiarism and is largely discouraged if not banned
    during the school day.


    This third and final point makes clear the distinction between learning in the
    classroom and in DIY youth cultures such as Scratch online. Some may argue that
    the DIY culture of remix is antithetical to the institutional nature of K–12 schooling,
    where order and hierarchy tend to trump spontaneity as two of the core elements
    underpinning the overall educational system. Schools resist remix as a viable
    form of classroom-based production despite the growing number of media theorists
    and educators who posit remix as a new literacy<sup>22</sup> and the considerable
    research over the past decade on digital literacies.<sup>23</sup>

