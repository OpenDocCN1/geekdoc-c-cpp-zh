    # Geeking Out: Remix as a Creative Challenge


    With Katie and Nadia''s remixes, the exchange is between multiple individuals.
    This element of exchange that is characteristic of remix can also be an individual
    endeavor, however. Karen Brennan notes how such individuality plays out in terms
    of remix in her interview with eleven-year-old Jackson, who remixes at Scratch
    less for socialization purposes and more for personal edification. Jackson remixes
    games that he finds compelling to reduce the overall number of programming bricks
    without altering gameplay in any manner.15 Identifying the crucial code that cannot
    be replaced as "peaks," Jackson explains that the goal is to sort out the "noise"
    or extraneous blocks and thereby create a more economical and efficient coding
    schema. Remix in this instance is a pathway for learning and a challenge, touching
    on what Papert refers to as the "hard fun" component characteristic of coding.16


    This third category of remix is unique in that its level of socialization is characteristic
    of the "adding" remixes and the intent to spur increased productivity is characteristic
    of the "how-to" remixes. The first of these two goals is epitomized by the popularity
    of remixable "coloring contests" at the Scratch site. In these contests, an individual
    user posts a colorless self-drawn or imported image, a set of rules in the Project
    Notes section (such as what colors can be used and whether music and backgrounds
    can be added), and a deadline. The creator of the contest typically selects the
    winning colored remix, although winners occasionally are determined based on the
    number of project views or "Love Its" that a remix receives. Winners thus gain
    status at the Scratch site, and the contest''s creator has a chance to be featured
    on the front page if the contest is especially popular with the community.17


    Like "adding" remixes, these coloring contests generate hundreds of remixes from
    a single entry, but as is typical with remixes that are developed largely out
    of socializing, what they gain in breadth, they lose in depth. The majority of
    coloring contest remixes entail little coding complexity, if any code at all,
    and entries typically are judged solely on the static image. Other contests at
    the Scratch site are more sophisticated. In the Roomba Remix Challenge, a user
    is presented with the floor plan of a two-bedroom apartment that is to be cleaned
    by the autonomous Roomba vacuum (figure 5.4).'
