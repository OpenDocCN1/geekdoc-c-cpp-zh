    # # Acknowledgments


    Writing a book that spans some thirty years of coding and education is a challenging
    enterprise, and many people have played pivotal roles along the way in shaping
    the ideas of this book and in providing feedback and support. Our first thanks
    goes to all of them, named or not named, because this book could not have been
    written without them.


    Seymour Papert''s ideas laid the foundation for how we think about learning, teaching,
    and computers. His papers and books, and in particular *Mindstorms: Children,
    Computers, and Powerful Ideas* (1980), were present in recognizing that education
    with computers was never about the devices themselves but ultimately about our
    own passions and our own desires to connect with each other. In addition, many
    discussions with Papert and his MIT Media Lab research group (of which one of
    the authors was a member) are the inspiration for this book. Seymour had a keen
    vision for what he imagined the future would be. Since his unfortunate accident
    in 2006, he has no longer had the opportunity to engage with computing and education
    as he once did, but we are confident that the recent comeback of coding would
    be a cause for celebration for him—as well as a confirmation of the educational
    theory of constructionism that he dedicated his career to advancing.


