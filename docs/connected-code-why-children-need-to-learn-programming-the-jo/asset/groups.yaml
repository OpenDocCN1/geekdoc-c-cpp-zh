    essential element of console video games such as Super Mario Brothers and Pitfall.
    A moving background “scrolls” forward with the movement of the characters. Because
    scrolling is one of the most sought-after skills for Scratchers who are interested
    in making games, it leads the list of tutorials posted at the site. The “How to
    Scroll” project is popular (remixed ninety-four times) and has the player scroll
    forward along a shifting landscape in which the step-by-step instructions for
    generating the script appear along the horizon as one moves along. “It would be
    cool,” posts its creator “cougers” in the Projects Notes section, “if this was
    turned into a game.”


    Through these various how-to tutorials, Scratch novices have the ability to create
    complex games, stories, and art projects in a relatively short amount of time—certainly
    far shorter than developing the project entirely from the ground up. The key factor
    is that these forms of remix do not just repurpose the individual coding bricks
    but take projects wholesale and combine them with each other to create entirely
    new projects. Within these “mega remixes,” users are faced with the challenge
    of ensuring that the code from one project is compatible with the code from another
    project, and this can take considerable massaging on the part of the remixer.
    But after this is accomplished, the creator has built a project that functions
    on a series of complimentary “compartments” that exist in conjunction with each
    other and also function independently of the other, epitomizing what computer
    scientist David Parnas identifies as the crucial element of “information hiding”
    in his seminal paper on modular design in programming.<sup>14</sup> In remixing
    projects together as various modules, we see a potential for thinking and participating
    computationally—for creating more complex projects in shorter amounts of time
    based on a community of practice that is founded on a mutual agreement to remix
    respectfully.'
