    users to share data at multiple levels. Through a virtual backpack, users can
    copy others’ projects and store them for later use, and a Notes and Credits section
    helps fellow creators receive due credit when their work is repurposed. The 2.0
    user profile pages are more customizable, and projects created through Scratch
    can be exported to social media sites.


    Although affinity communities are not new (the pre-Internet Logo community is
    testament to this), even novice programmers now have an audience that values their
    artifacts and provides a potential community or affinity group. Tools that facilitate
    particular mechanics of programming are not enough. A social context is needed
    where these programming tools can be used and where programming artifacts are
    shared. In a 2005 investigation of Seymour Papert’s samba schools, computer scientists
    José Zagal and Amy Bruckman analyze the characteristics of samba schools and highlight
    their flexibility to outsiders, the existence of a public event, and a plurality
    of members. The important message is that the success of the samba school relies
    not on the dance itself but on the social context in which the dance exists.


    The Scratch website contains these three social elements. The site has a wide
    range of members and is open to new users. But as was learned from the Collab
    Challenge and Collab Camps within the Scratch site itself, there is a need for
    more explicit spaces or “public events” designated for sharing work constructively
    and collaboratively. The schools might be a viable potential partner for using
    online spaces for meaningful collaborations. Schools are ultimately social spaces,
    and the communal rules of classrooms offer children a viable model for learning
    how to share and cooperate online—particularly if teachers apply classroom rules
    to youth-based online environments like Scratch. When educators utilize Scratch
    and its online environment to support subject-matter learning, they bring their
    students online for a particular purpose, which itself can act as an event for
    grounding students’ learning experiences.


    Youth-based cooperation is never a guarantee, but it is more likely to develop
    in the presence of openness, diversity, and a unifying event. And such cooperation
    matters because learning how to program collaboratively results in more motivated
    and peer-based learning. Grasping the key elements of computational thinking—including
    decomposing a complex task into a series of interrelated modules and coordinating
    control flow between different project components—develops better work habits
    and facilitates a


    Remix, the process of creating something new from something old,² follows the
    same pathway from the individual to the community that the previous chapter introduced.
    In the past, most programs had to be individually created “from scratch” to illustrate
    programming competencies, and code was understood to be a proprietary commodity
    that was built, refined, but certainly not shared. This approach set the tone
    for early computing coursework as children were introduced to the potential of
    programming in terms of input rather than output. Coursework focused on what children
    wrote as code rather than on what children actually produced with such code. The
    ability to build something “from scratch” or “from the ground up” under the “Language
    First” approach was the marker of a qualified programmer.³ Yet this focus on individual
    input also had its pedagogical limitations. Akin to learning about writing fiction
    in a creative arts course by being taught the meaning of nouns, verbs, and modifiers,
    such computing pedagogy stressed text-based functionality over wider considerations,
    such as what the assembled text offered in terms of a discernible product.


    In today’s DIY culture, the term scratch takes on an altogether different meaning.
    Scratch software epitomizes this shift in meaning: the name derives from the “scratching”
    technique that was developed by hip-hop disc jockeys in the 1970s and 1980s.⁴
    Spinning and scratching vinyl records beside each other, these DJs juxtaposed
    and blended melodies and rhythms to create new harmonies. Their music was developed
    from snippets of wholly formed songs rather than from individual musical notes,
    and audiences responded enthusiastically, elevating remix from a little-known
    practice among like-minded DJs to an international phenomenon that today represents
    its own musical genre.


    Remix has extended beyond music. In the field of computer programming, remix has
    a rich, if less widely known precedent. Within the technology industry, supervisors
    often develop the skills of novice programmers by having them tinker and build
    on extant pieces of code, which acquaints them with the language and gives them
    the opportunity to generate designs more complex than what they could accomplish
    solely on their own. Today repurposing code—or any digital media, for that matter—has
    taken on new meaning through the Internet. The emergence of Web 2.0 has allowed
    for unprecedented levels of making and sharing online to the extent that remix
    now represents a key practice in today’s networked culture. “Creating” online
    today often means recreating and remixing by using Web-based venues to both download
    and upload digital content. In the vast online “middle ground,” downloads are
    returned online as altered and often wholly new uploads. Although some view this
    middle ground with trepidation and see remix entirely in terms of intellectual
    property infringement, others herald remix as the essential lens by which individuals
    participate socially and economically⁵ within an increasingly global society.


    Given remix’s meteoric ascent from a relatively obscure technical application
    to a process that is emblematic of what it means to create in the twenty-first
    century, where and how does remix start? Where do children learn to remix, and
    why is it appealing to them? What distinguishes remix from simply copying, and
    are there rules, both spoken and unspoken, that accompany the practice itself?
    Unfortunately (but perhaps unsurprisingly), these questions are not being addressed
    in most schools although children are having experiences with them “in the wild”
    at various content-sharing websites. Over the first half of this chapter, we examine
    how children are learning the practice of remix at the Scratch website, which
    currently represents the largest online collection of youth-oriented programmable
    remixes. What does remix look like in Scratch, and why do children choose to partake
    in the process? The other half of the chapter examines whether this increasingly
    popular practice can be integrated into schools and what kind of learning remix
    allows for in the classroom. What are the specific barriers for integration, and
    does the presence of these barriers outweigh the potential to make the learning
    of programming more authentic and collaborative? After all, computational participation
    is as much about learning the production of code as it is about the social practices
    and cultural norms in which it is embedded.


