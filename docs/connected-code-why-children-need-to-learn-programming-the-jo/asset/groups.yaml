    functionalities.<sup>17</sup> This call for transparency illustrates an important
    pedagogical dimension of tangible computing, one that Papert stressed with the
    body syntonicity of the turtle. It was a matter of representation (being the turtle
    on the floor or on the screen), touch (touching circuits), and pedagogy (understanding
    the functionality and building personal connections to the objects). Working across
    different domains—crafting, engineering, and computing—underscores the importance
    of seeing how concepts cross a range of media and conditions.


    But there is a second, equally important dimension of transparency that relates
    to bringing together different cultures—crafting and sewing (which historically
    are associated with women) and engineering and computing (which historically are
    associated with men). We observed in numerous workshops and classes how these
    references to the gendered nature of e-textile materials and activities slip into
    conversations. When middle-school boys label their activities “doing circuits”
    rather than sewing or when high school boys talk about “sewing being a girl’s
    sport,” they are claiming that engineering is more valuable and more appropriate
    for males.<sup>18</sup> On the other side, some argue that learning with e-textiles
    reinforces existing gender stereotypes and that women should participate in more
    male-dominated activities, like robotics. Such tensions are productive because
    they open up conversations and question fairly narrow perceptions about computation.


    The LilyPad Arduino e-textile construction kit harks back to longstanding historical
    connections between women, textiles, and computing. Ada Lovelace’s notes on the
    analytical engine resulted in the first “computer program” in the nineteenth century,
    and the Jacquard loom, which used punched cards to weave complex patterns in textiles,
    is considered by many the first step in the history of computing hardware. Lovelace
    wrote perhaps the most beautiful sentence ever to link fashion and computing:
    “We may say most aptly that the Analytical Engine weaves algebraical patterns
    just as the Jacquard loom weaves flowers and leaves.”<sup>19</sup> Cultures of
    computing moved from textile weaving to code crunching during war and now are
    returning to crafting, gaining new impetus from digital fabrication. E-textile
    construction kits make visible the complex intersection of culture and computing
    because they bring together domains that are seen as contradictory. Their existence
    provides a visible counterargument by bringing together the low- and high-tech
    forms of computing.'
