    尤其令人鼓舞的是，参加在线 Collab 挑战赛的高中生开始意识到 Scratch 在线社区是一个获得并利用受众的地方。例如，一个为挑战赛制作打砖块视频游戏的小组研究了
    Scratch 网站上各种类型的同款游戏，并在此基础上改进，使其游戏比网站上现有版本更好。另一个小组没有理会课堂老师关于让项目更直观的反馈，而是通过添加项目说明和更清晰的指示，告诉用户如何激活和玩他们的项目，以此来回应关于开发更好界面的在线评论。这种转变——从拥有一种“贡献意识”<sup>55</sup>到把在线社区当作真实受众和学习工具来回应——涉及教育研究者
    Alicia Magnifico 所指出的、向一群人传达想法时的批判性思考。<sup>56</sup>


    ## 拓展社区


    计算思维和参与可以在青少年 DIY 在线社区中得到培养和激发。许多编程和设计工具（如 Alice、Gamestar Mechanic 和 Kodu）都包含这些类型的社区<sup>57</sup>，并创建开源网站（以
    Linux 等社区的风格），供青少年分享、评论并贡献于他们的编码创作。其他一些机构（如非营利教育计划 Globaloria）则创建了混合模式，将学校的游戏设计活动与庞大的全国性网络连接起来，为学生参与者、教师和管理人员提供社区和支持。<sup>58</sup>新版的
    Scratch 2.0<sup>59</sup>延续了这一趋势，加入了允许用户在多个层面共享数据的功能。通过虚拟背包，用户可以复制他人的项目并存储起来以备将来使用；“注释与致谢”版块则帮助创作者在作品被重新利用时获得应有的署名。2.0
    版本的用户个人主页更具可定制性，通过 Scratch 创建的项目也可以导出到社交媒体网站。


    虽然趣缘社群并不新鲜（互联网出现之前的 Logo 社区就是证明），但即使是新手程序员现在也能拥有这样一个受众：它重视他们的作品，并提供了一个潜在的社区或趣缘群体。仅仅提供支持特定编程机制的工具是不够的。还需要一个可以使用这些编程工具并分享编程作品的社会环境。在
    2005 年对 Seymour Papert 的桑巴学校的研究中，计算机科学家 José Zagal 和 Amy Bruckman 分析了桑巴学校的特征，强调了它们对外来者的开放性、公开活动的存在以及成员的多元性。重要的启示是：桑巴学校的成功并不依赖于舞蹈本身，而是依赖于舞蹈所处其中的社会环境。


    Scratch 网站包含了这三个社会要素。该网站拥有各种各样的成员，并且对新用户开放。但正如从 Scratch 网站内部的 Collab 挑战赛和 Collab
    训练营中了解到的那样，我们还需要更明确的、专门用于建设性和协作性分享作品的空间或“公开活动”。学校可能是利用在线空间进行有意义合作的可行潜在伙伴。学校归根到底是社会空间，而课堂的共同规则为儿童提供了学习如何在线分享和合作的可行模式——特别是当教师将课堂规则应用于像
    Scratch 这样的青少年在线环境时。当教育工作者利用 Scratch 及其在线环境来支持学科学习时，他们会为了特定目的带领学生上网，而这个目的本身就可以作为一个活动，为学生的学习体验打下基础。


    青少年之间的合作从来不是必然的，但在开放性、多样性和统一性活动的条件下，这种合作更有可能发展起来。而这种合作很重要，因为学习协作式编程会带来更有动力、更以同伴为基础的学习。掌握计算思维的关键要素——包括将复杂任务分解为一系列相互关联的模块，以及协调不同项目组件之间的控制流——会培养更好的工作习惯，并有助于


    再创作，即从旧事物中创造新事物的过程，² 遵循着上一章介绍过的从个体到社区的路径。过去，大多数程序必须由个人“从头开始”创建，以展示编程能力；代码被视为一种专有的商品，可以被构建、完善，但绝不会被分享。这种方法为早期的计算课程定下了基调：向孩子们介绍编程的潜力时，侧重的是输入而非输出。课程关注的是孩子们用代码写了什么，而不是他们用这些代码实际上制作出了什么。在“语言优先”方法下，能够“从零开始”或“白手起家”构建东西，是合格程序员的标志。³然而，这种对个人输入的关注也有其教学上的局限。就像在创意艺术课程中学习写小说时被教授名词、动词和修饰语的含义一样，这种计算教学法强调基于文本的功能，而不是更广泛的考虑，例如组合起来的文本能提供什么可识别的产品。


    在今天的 DIY 文化中，“scratch”一词有了完全不同的含义。Scratch 软件正是这种意义转变的典型代表：它的名字源自 20 世纪 70 年代和
    80 年代嘻哈唱片骑师（DJ）发明的“搓碟”技术。⁴这些 DJ 将黑胶唱片放在一起旋转和搓动，将旋律和节奏并置、融合，创造出新的和声。他们的音乐是由完整歌曲的片段发展而来的，而不是由单个音符发展而来的；观众对此反响热烈，将再创作从志同道合的
    DJ 之间一种鲜为人知的做法，提升为一种国际现象，如今已代表一种独立的音乐流派。


    再创作已经超越了音乐领域。在计算机编程领域，再创作有着丰富但不太为人所知的先例。在科技行业内，主管们常常让新手程序员摆弄并基于现有代码继续构建，以培养他们的技能，这样既让他们熟悉语言，也让他们有机会生成比独自完成更复杂的设计。如今，通过互联网，重新利用代码——或者说任何数字媒体——被赋予了新的意义。Web
    2.0 的出现使得在线制作和分享达到了前所未有的水平，以至于再创作如今已成为当今网络文化的关键实践。今天，在线“创作”往往意味着重新创作和再创作，利用基于网络的平台下载和上传数字内容。在广袤的在线“中间地带”，下载内容被修改后再次上传，常常成为全新的上传内容。尽管有些人以惶恐的态度看待这一中间地带，将再创作完全视为侵犯知识产权，但另一些人则将再创作视为关键视角，个体在一个日益全球化的社会中凭借它参与社会和经济生活⁵。


    鉴于再创作从一个相对小众的技术应用迅速崛起为一个象征着二十一世纪创作意味着什么的过程，再创作从哪里开始，又是如何开始的？孩子们在哪里学习再创作，为什么它对他们有吸引力？再创作与单纯的复制有何区别，围绕这一实践本身是否有成文和不成文的规则？不幸的是（但也可能并不意外），大多数学校都没有回应这些问题，尽管孩子们在各种内容分享网站上“野外”体验过这些问题。在本章前半部分，我们考察了孩子们如何在
    Scratch 网站上学习再创作实践，该网站目前是最大的面向青少年的可编程再创作在线集合。再创作在 Scratch 中是什么样子的？为什么孩子们选择参与这个过程？本章的另一半将探讨这一日益流行的实践能否被整合到学校中，以及再创作在课堂上能带来什么样的学习。整合的具体障碍是什么？这些障碍的存在是否超过了让编程学习更真实、更协作的潜力？毕竟，计算参与既关乎学习代码的生产，也关乎其嵌入的社会实践和文化规范。


    ### 为什么要再创作？探索 Scratch 网站上的创作动机


    再创作在 Scratch 上占有重要地位。根据最近对上传到该网站的项目分析，该网站所有项目中超过四分之一（27.64%，即 670,932 个）是之前项目的再创作。⁷其他面向青少年的编程网站，如
    Kodu Game Lab 和 Studio Sketchpad，也报告了类似的再创作比例。⁸在 Scratch 上进行再创作是一个简单的过程。当 Scratchers
    打开网站上的一个项目并“查看内部”查看底层代码时，他们会立即看到通过右上方按钮进行再创作的选项。


