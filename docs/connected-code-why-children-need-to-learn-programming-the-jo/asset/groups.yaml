    the Turtle可在iTunes应用商店获取。Scratch Jr.的开发由美国国家科学基金会资助给米切尔·雷斯尼克（Mitchel Resnick）的MIT团队和玛丽娜·伯斯。


    - 6. Quest to Learn学校的设计和开发在2010年由Katie Salen、R. Torres、L. Wolozin、R. Rufo-Teper和A.
    Shapiro撰写的报告中有所描述。有关Globaloria发展的描述和研究可参见R. Reynolds和M. Chiu 2013年的论文以及www.globaloria.org。


    - 7. 关于探索计算机科学课程的设计和研究的更多信息，可参见www.exploringcs.org/curriculum；ACM CS课程可参见计算机科学教师协会（2006）；纽约市学校软件工程试点项目的描述可参见C.
    Fadjo（2013）以及纽约市公立学校的新闻稿：http://www.nyc.gov/portal/site/nycgov/menuitem.c0935b9a57bb4ef3daf2f1c701c789a0/index.jsp?pageID=mayor_press_release&catID=1194&doc_name=http%3A//www.nyc.gov/html/om/html/2013a/pr074-13.html&cc=unused1978&rc=1194&ndi=1。


    - 8. 参见Margaret Honey和David Kanter 2013年关于创客活动的概述，以及Sylvia Martinez和Gary Stager
    2013年关于创客和编程工作坊活动的汇编。


    - 9. 参见2011年美国国家研究委员会关于非正式学习场所对科学重要性的报告、心理学家巴顿·赫希（Barton Hirsch）2005年关于男孩女孩俱乐部等社区中心重要性的著作、亚斯明·卡法伊（Yasmin
    Kafai）、凯莉·A.佩普勒（Kylie A. Peppler）和罗宾·查普曼（Robbin Chapman）2009年编辑的关于电脑俱乐部网络的书籍，以及布里吉德·巴伦（Brigid
    Barron）、金·戈麦斯（Kim Gomez）、妮可·平卡德（Nicole Pinkard）和克里斯托·K.马丁（Crystle K. Martin）2014年编辑的关于公共图书馆中数字媒体课后中心和青少年媒体空间的书籍。


    - 10. 更多关于连接游戏的内容参见Y. B. Kafai和D. Fields（2013）。


    - 11. “数字化生存”的想法在尼古拉斯·尼葛洛庞帝（Nicholas Negroponte）1995年的一系列论文中已有预示，这些论文最初发表在*《连线》*杂志上。


    - 12. Sherry Turkle（2011，1）。


    - 13. 参见http://www.smh.com.au/digital-life/hometech/wikihouse-pioneers-doityourself-home-building-20130301-2f9xd.html。


    - 14. 参见Margolis（2013）。


    - 15. 1984年，文化心理学家西尔维亚·斯克里布纳（Sylvia Scribner）在考察传统读写能力与印刷文本的关系时，阐述了读写能力的这三个目的，但它们在数字世界中同样适用。


    - 16. 同上。


