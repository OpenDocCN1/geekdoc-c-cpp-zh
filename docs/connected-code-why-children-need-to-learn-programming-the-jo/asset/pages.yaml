    # ## Chapter 2


    +   1. See Seymour Papert (1993b, preface, “The Gears of My Childhood”).


    +   2. Early references to the term of connected learning can be found in Seymour
    Papert’s 1996 book *The Connected Family: Bridging the Digital Generation Gap*
    and in Uriel Wilensky’s Center for Connected Learning at Northwestern University
    (http://ccl.northwestern.edu, started in 1995, which described its mission as
    enabling “learners to make deep connections between what they are learning and
