    Despite such technical ease, remix is taken seriously as a form of communal production
    online. Whenever an individual creates an account with Scratch, a crucial element
    of membership is agreeing to the open-source nature of the software, which is
    detailed in the Creative Commons Share-Alike license.<sup>8</sup> In addition
    to being constructive and respectful online, users are reminded by the Scratch
    management team that they also must be open to sharing online. They are free to
    remix any other project that they find at the Scratch website just as they can
