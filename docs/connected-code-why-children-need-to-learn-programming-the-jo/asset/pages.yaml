- pgno: 132
  md: 'areas where such teaching and learning can improve, and historical models for
    pedagogical reform.


    The first part of this chapter examines the current state of computing education
    in schools—in both the traditional school classrooms and the less structured learning
    environments of afterschool programs and DIY initiatives. Where are scholars and
    learners present in each environment, and what is the benefit of each environment
    for teaching computation on the K–12 level? The second part of the chapter steps
    away from these two spaces to examine the last time that DIY learning made a widespread
    entrance into K–12 schools—when the educational theories of John Dewey were new
    and promised to make school a more practical experience for children. What does
    this history tell us about youngsters'' ambitions and scholars'' pragmatism, and
    what implications can be drawn from the current challenges facing computing education
    and the integration of technology in schools? This chapter is not intended to
    be a how-to Scratch guide for teachers. A number of excellent resources, including
    books and an entire website dedicated to and created by educators, are available
    for this.4 Instead, this chapter analyzes the wider culture of schools and the
    ways that such a culture affects how we teach children how to think and participate
    computationally.


    # Computing Education: Inside and Outside of School


    According to the U.S. Bureau of Labor Statistics,5 computing-related jobs are
    one of the fastest-growing employment fields nationwide. In a country with over
    42,000 high schools, however, only 2,100 offer an advanced computer science course.
    If only 5 percent of this country''s high schools offer the advanced computer
    science courses that prepare students for college classes, then it is clear that
    computer science has a minimal presence in high schools nationwide, even if their
    enrollment numbers have been increasing in recent years. This lack of presence
    is particularly evident in the low numbers of women and minority students who
    participate in advanced computer science courses at the high school level. Although
    high school girls are over half of all those who take advanced placement tests,
    less than a quarter of those who take the computer science test are female, and
    the number of African American test takers consistently ranks under one percent.6'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'This lack of diversity in students who take advanced high school computing
    courses reflects curricula and pedagogy that need updating, and over the past
    two years the College Board has piloted a revised Advanced Placement offering
    called Computer Science Principles. Courses such as “The Beauty and Joy of Computing”
    are replacing language-centric courses such as “Introduction to Java Script.”
    The CS Principles courses offer a more holistic approach to learning computing
    by stressing computational concepts rather than prioritizing any single programming
    language. The CS Principles courses also encourage students to maintain portfolios,
    work collaboratively, and write reflections about the various project-based assignments.
    This represents the most promising development in school-based computing instruction
    in recent years.


    More closely akin to the bricolage approach advocated by Sherry Turkle and Seymour
    Papert (see chapter 2), CS Principles moves away from the traditional top-down
    approach of amassing content via memorization and instead incorporates performance-based
    tasks in which students learn the abstract principles behind computation by enacting
    them through the development of artifacts. Focusing on a specific end-product
    through an iterative process, the CS Principles pilot represents a true change
    from instruction that is provided entirely in a single language. Whereas earlier
    instruction emphasized the development of a discrete skill set, the new CS Principles
    course is rooted in the design of functional applications, embodying learning
    in the deliverable (as discussed in chapter 3).


    Despite the progress that is being made at the upper level, few students have
    the opportunity to take these higher-level courses. The recent spike in computer
    science enrollments demonstrates the presence of a small and committed population
    of students, but what about the other 99 percent of students in U.S. schools?
    Where do these students encounter computing instruction during the school day?
    How do districts incentivize their teachers to teach computer science as a field
    of study? As it turns out, they offer few incentives. Despite the recent increase
    in the number of students who take the AP computer science exam and select computer
    science as an undergraduate major, the number of computing-related courses in
    this country’s K-12 schools has decreased over the past decade. According to a
    report from the Association of Computing Machinery, C. Wilson, L. A. Sudol, C.
    Stephenson, and M. Stehlik’s *Running on Empty: The Failure to Teach K-12 Computer
    Science in the Digital Age*,^8 the number of'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'introductory computing-related courses has decreased by 17 percent since 2005.
    Although student enrollments may be marginally up, the number of courses being
    offered is down since 2005, and the lack of computational participation in introductory
    technology-based courses means that few students consider taking CS Principles
    (even if it is offered at their school) or encounter computer science in their
    K–12 education.


    Some countries, such as Israel, have devised a computer science curricula as a
    mandated science requirement in their schools, but the United States still treats
    computer science courses as electives—courses that are taken based on personal
    interest, akin to joining a band or literary magazine. Treating computer science
    as an elective rather than a math or science credit may initially seem to present
    no major issue, but such treatment has serious implications. When districts are
    asked why computer science courses are not offered at their respective schools,
    they typically give one of two responses. The first response is that the students
    are not interested. But such lack of interest usually stems directly from the
    fact that computer science at that school can be taken only as an elective—not
    as a course that counts for a math or science credit. With student schedules already
    overloaded with mandated courses, computer science classes that do not count toward
    core curricula credit are less likely to attract students, and schools are less
    inclined to offer them. The second response is that there are few qualified instructors
    who can teach computer science courses. But because computer science is not considered
    a core curriculum course, schools of education and state departments of education
    are reluctant to develop rigorous courses for computer science teaching certification,
    thus failing to offer a certifiable pathway to develop a qualified body of teachers.


    Despite this country’s national pride in tech giants such as Apple and Google,
    the United States is falling behind other countries in computing education on
    the K–12 level. The United Kingdom recently instituted a national computer science
    curriculum[10] in which computational thinking figures prominently and is pedagogically
    tiered through four progressive stages, beginning with elementary applications
    and basic principles before advancing to the acquisition of languages and systematic
    problem solving. Since the early 1990s, Israel has mandated a rigorous computer
    science education program on the K–12 level that is grounded in a curriculum that
    “emphasizes the foundations of algorithmic thinking” and that teaches “programming
    as a way to get the computer to carry out an algorithm.”[11]'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'These two countries offer potential models for computer science education beyond
    supplementary afterschool programs and course electives. They credential such
    courses as core computing. Google''s director of education, Maggie Johnson, cites
    the exclusion of CS standards from this country''s emerging set of Common Core
    State Standards<sup>12</sup> as a tremendous shortcoming of the national initiative,
    not only in terms of children''s capacity to engage with technology but also in
    their ability to learn fundamental math and science skills through actual application.<sup>11</sup>
    Given the prominence of the Common Core State Standards (currently adopted by
    forty-six states), the initiative represents an unprecedented opportunity for
    the country to begin to integrate CS education nationally, a cause that Computing
    in the Core<sup>14</sup> has recognized and continues to advocate.


    The results of any such core curriculum are readily apparent. Visitors to any
    U.S. elementary, middle, or high school, public or private, are unlikely to see
    any formal teaching related to computer science or to computers as computational,
    creative devices. As education historian Larry Cuban notes, schools persist in
    *teaching computers* rather than *teaching with computers*.<sup>15</sup> Focusing
    on basic functionality and making the devices the ends rather than the means for
    teaching, technology courses on the K–12 level remain devoid of any real content
    other than the computers themselves. And although learning the applications of
    the Microsoft Office suite or familiarizing oneself with the constituent parts
    of the computer have educational value, such activities do not capture the creative
    and collaborative potential of computing and do not merit a semester-long course.
    This lack of robust, introductory computing instruction is at the heart of the
    nationwide failure of the schools. Despite having the machines in the schools
    for over thirty years, schools have largely failed to enact meaningful change
    in the way that children think about and participate in using them.


    There has been some promise in the peripheral activities that have been occurring
    at school—but outside of the school day. Afterschool programs have consistently
    been the places at schools where the most interesting learning with technology
    has taken place. Whether helping students make video games in a Scratch gamers
    club, construct collaboratively programmable robots in a Lego Robotics club, or
    design interactive light-up masks with the LilyPad Arduino, afterschool clubs
    historically have had the latitude to allow children to work at their own pace
    in spaces that are more open and social than traditional classrooms. Thousands
    of community'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'technology centers across the country also support access to computer activities
    (such as word processing, email, and Web browsing) in under-served communities.
    Some, like the Computer Clubhouse, have focused on creative uses of computing
    where youth are encouraged to work on projects of their own, including the programming
    of animations, games, and music videos. Scratch was designed to make programming
    accessible to the media-rich interests of youth.16


    What is unique about most afterschool clubs and community technology centers is
    their existence as spaces in which students have an opportunity to make their
    own projects. As is evident with the revised Advanced Placement computer science
    course (and the activities described in previous chapters), the capacity to make
    things with technology sits at the heart of computational thinking and participation.
    As chapter 2 indicates, making with computers takes learning from the abstract
    and situates it in the concrete, which then can be shared as currency among wider
    networks of fellow makers. “We are creatures that need to make,” writes founder
    of MAKE magazine Dale Dougherty, quoting poet Frank Bidart. “Making is a basic
    human activity, and in his essay “The Maker Mindset,” Dougherty names making as
    the site of children’s most exciting, memorable, and important learning.


    Dougherty also laments that this inclination to make is often driven out of children
    at young ages, as schools—especially as students move up grade levels—increasingly
    eschew making as a remedial, nonacademic activity. “The biggest challenge and
    the biggest opportunity for the Maker Movement,” Dougherty writes of the DIY community,
    “is to transform education.... Students are seeking to direct their own education
    lives, looking to engage in creative and stimulating experiences. Many understand
    the difference between the pain of education and the pleasure of real learning.
    Unfortunately, they are forced to seek opportunities outside of school to express
    themselves and demonstrate what they can do.”28


    # **Club Meets Class: Searching for the Middle Ground**


    If it is realistic to expect that the pleasures of the maker culture that surface
    in afterschool clubs can also exist during the school day, then to some extent
    the way that schooling is conceived and practiced must fundamentally change. Dale
    Dougherty is a yearner here, as are many who see digital'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'media and DIY programming as challenges to the traditional teacher-student
    paradigm of schooling. This is also discussed in “Is New Media Incompatible with
    Schooling?” media theorist Henry Jenkins’s interview with education researcher
    Richard Halverson, the coauthor (with Allan Collins) of *Rethinking Education
    in the Age of Technology: The Digital Revolution and Schooling in America*. For
    Halverson, the future of technology in K–12 schools depends less on the devices
    themselves and more on various perspectives on how people best learn. According
    to one perspective, learning happens in schools, and schools are accredited brick-and-mortar
    spaces. Halverson calls this the “institutional channel.” According to another
    perspective, learning does not have to be linked to time and geography, and Web
    2.0 can provide learning opportunities through peer and interest-driven activities.
    Referring to this as the “digital media channel,” Halverson notes that learning
    in this manner is not standardized and is often unpredictable but that it does
    “highlight three critically important aspects of learning missing from many school
    learning activities: motivation, production, and legitimate audience.^19


    Halverson’s distinction between the institutional channel and the digital media
    channel is reminiscent of Papert’s distinction between schoolers and yearners.
    Are students more motivated and productive in afterschool clubs than they are
    during their regular school classes? Are students more likely to encounter genuine
    audiences in clubs of their peers than in a classroom? To investigate these questions
    of motivation, production, and legitimate audience, we designed a study in which
    middle-school students used Scratch in a school class and in an afterschool club.^20
    We wanted to know if there was a difference in how children were motivated in
    each space, what they produced in each environment, and for whom they produced
    such content.


    Building on Dougherty’s notion of students and teachers as makers of a school’s
    learning environment, we constructed two spaces for learning Scratch. One was
    a language arts class in which middle-school students were introduced to Scratch
    as a tool for composing their own digital stories in a writing workshop. Class
    participants followed a scripted curriculum that was tied to statewide academic
    standards in English language arts. The other group created Scratch projects in
    an afterschool fan-fiction club. Club participants shared their work, offered
    feedback to each other, but followed no scripted lessons or submission requirements.
    The class and the club met for ten consecutive weeks with the same instructor.
    The class set goals for'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'students, who, by the end of ten weeks, were expected to submit a storyboard
    of their projected storylines, prepare a digital draft in Scratch, provide peer
    feedback, hand in a final submission, and make a presentation. The projects were
    graded, and attendance was mandatory. The club set no goals for participants.
    They all were encouraged to make a presentation at the end of ten weeks, but no
    grades were attached, and attendance was not mandated.


    Results of this comparison proved interesting. In the class, the deliberate and
    iterative goals established for the writing workshop played out well in terms
    of product. Nearly 90 percent of the students completed a digital story, posted
    it online at the Scratch site, and presented it to their peers at the close of
    the workshop. Ranging from two to three minutes in length, these stories were
    based on real-life experiences or cultural icons from movies, television, and
    comic books. Relatively short but with a clear beginning, middle, and end, these
    stories included multiple characters and scene changes, and some included dialogue
    and sound effects. In the club, only 71 percent of the participants completed
    a project in Scratch, but they produced nearly twice as many projects as those
    in the class. Projects in the club were also more varied. Although projects in
    the class setting were all narrative stories, club projects included interactive
    art pieces and video games, which meant that more types of coding concepts were
    utilized.


    These findings are far from conclusive but suggest that some Scratch after-school
    club members engaged computationally more than their counterparts in the class
    did. Although 30 percent of club members never completed or submitted a project,
    the 70 percent who did submit projects were more fully engaged than their peers
    in the classroom. Many club members completed four or five projects over the ten-week
    period. These club members also created richer online profiles at the Scratch
    site, friended others online, and remixed others'' work more often (26 percent
    of projects were remixed in the club versus 10 percent in the classroom). In the
    classroom, students twice accused their classmates of cheating by remixing others''
    work.


    Yet the higher completion rate in the classroom (90 percent versus 71 percent
    in the club) is an argument for integrating computational learning into the school
    day. And although the classroom students'' story-based submissions were more uniform,
    this uniformity made assessment and assigning a final grade easier. Despite the
    wishes of some yearners who wish to rid school of grading scales, assessment plays
    a significant role in ensuring that project-based learning enters classrooms and
    remains there as part of instruction.'
