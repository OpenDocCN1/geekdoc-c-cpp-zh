- pgno: 27
  md: 'Computational Thinking website with links to Web resources and lesson plans
    for K-12 teachers in science and mathematics.⁹


    Perhaps most surprising is the decision to teach computational thinking without
    computers, which alleviates the concerns of some computer scientists and Jeannette
    Wing herself, who wished not to equate computational thinking with programming
    in Java (or any single programming language). The Computer Science Unplugged activities
    were developed by a group in New Zealand, and they exemplify the computerless
    approach, applying ideas in computing “through engaging games and puzzles that
    use cards, string, crayons and lots of running around.” The activities are suitable
    for students from elementary school to high school.


    Other approaches rely on computers, but like Computer Science Unplugged, they
    resist tying computational thinking solely to learning how to code. They have
    focused on introducing computational thinking to students by having them design
    digital applications that are personally meaningful to the designer. Most popular
    are game designs, the construction and coding of robotics, and the use of media
    filters to collect and organize news information for more efficient journalism.
    This focus on designing applications such as games, robots, and stories also connects
    well with computational thinking’s general focus on designing systems, solving
    problems, and understanding human behaviors. Applications are designed for others
    to use, which means that designers have to consider human behavior as they design
    their systems and need to solve problems as they translate application ideas into
    code. For a K–12 audience, we like to think about it as computational participation
    because purpose, community, and practices are key.


    # Expanding to Computational Participation


    Computational thinking has progressed since Jeannette Wing’s 2006 article. What
    started as a concept now exists in curricula and pedagogy in K–12 schools and
    school-based clubs across the country.¹⁰ Although computational thinking offers
    a framework for how to use technology more rigorously and critically in schools,
    there also remains the question of outcome. Teaching children to think more rigorously
    and critically is an admirable goal, but it is hardly a new one. Many curricula
    (in ancient Greece, philosophy and rhetoric; in the nineteenth century, Latin;
    and in the twentieth century, computer programming) were intended to develop more
    rigorous'
