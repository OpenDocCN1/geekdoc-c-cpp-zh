    fifteen. Scratch has visitors from nearly seventeen thousand cities worldwide,
    and its programmable bricks are translated into over forty languages.<sup>26</sup>
    Although many websites (such as YouTube and Flickr) support uploading and downloading
    user-generated content, the Scratch website offers a platform for users to share
    their own programmed interactive media.<sup>27</sup> Uploading and downloading
    projects on the site is an exchange of information, but it is also an exchange
    of personally crafted content that can be downloaded and remixed by others to
    build entirely new projects. As users grow familiar with the Scratch site, they
    encounter a variety of projects and coding scripts that they can sample and remix.


    When Scratch team member Andrés Monroy-Hernández set out to create the first online
    community for Scratch, Bruckman''s MOOSE Crossing and her recommendations for
    youth communities of programmers served as a model. But both Bruckman and Monroy-Hernández
    were inspired by Papert''s constructionist principles. He wanted Scratch to become
    "a sort of ''Samba school'' where novices and experts would gather to read, write,
    and remix Scratch literature. I wanted to take Scratch from being ''just'' a good
    tool to a space where peers gather to create, share, remix, and even just ''hang
    out'': a commons-based peer production community. This meant giving people access
    to an audience, potential collaborators, and a repository of inspirational creations
    that creators could learn and remix from."<sup>28</sup>


    The remarkable success of the online Scratch community signals this shift from
    a programming tool to a community of programmers. Other introductory programming
