- pgno: 144
  md: 'On February 26, 2013, the nonprofit organization code.org released a video
    directed by Lesley Chilcott called “What Schools Don’t Teach” on YouTube. The
    video starts with a quote from Steve Jobs, cofounder of Apple: “Everyone should
    learn to program a computer ... because it teaches you how to think.” And it ends
    with “One million of the best jobs in America may go unfilled because only one
    in ten schools teach students how to code.” Numerous luminaries speak about their
    first experiences with getting a computer and writing programs. Bill Gates, cofounder
    of Microsoft, remembers that he was thirteen when he first got access to a computer
    and programmed a game that played TicTacToe. Elena Silenok, founder of clothia.com,
    remembers making a green circle and red square appear on the screen. Gabe Newell,
    founder of Valve, mentions the sense of wonder he experienced when “Hello, world”
    came up on the screen for the first time. Mark Zuckerberg, one of Facebook’s founders,
    talks about the process of starting with a simple program and adding to it, and
    Drew Houston, founder of Dropbox, likens coding to playing an instrument or a
    sport. Chris Bosh, an All-Star NBA basketball player with the Miami Heat, reflects,
    “It starts out very intimidating, but you kind of get the hang of it over time.
    Coding is something that can be learned.” The general message of the video is
    that computers are everywhere. As Will.i.am from the rock band The Blackeyed Peas
    sums up, “Here we are in 2013. All depends on technology—to communicate, to bank,
    information—and none of us know how to read and write code.” The video then calls
    viewers to action: “Whether you want to be a doctor or a rock star, ask about
    a coding class at your schools or learn online @ code.org.” Within a few days,
    the video reached millions of viewers. “Bring a little awesomeness to your life,”
    Chilcott urges in a Huffington Post article about the code.org site: “Take a lesson.””'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'A few years earlier, a video in which celebrities discuss their beginnings
    with computers and programming and urge viewers to learn coding would have been
    an unlikely success. Yet the excitement and earnestness of those who appear in
    the YouTube video may be the clearest indication to date that coding is making
    a comeback. The video showcases three-dimensional animations, music studios, robot
    drones flying in formation, computer screens in operating rooms, and workplaces
    with formidable amenities in the software industry. It plays on the sense of empowerment
    that learning to code can provide individuals. As Valve''s founder Gabe Newell''s
    declares, “The programmers of tomorrow are the wizards of the future…. You know,
    you are going to look like you have magic powers compared to everybody else,”
    and NBA player Chris Bosh adds moments later, “It''s amazing…. I think it''s the
    closest thing we have to a super power.” Panoramic screen shots of the sleek offices
    occupied by these programmers tacitly connect learning to code with finding financially
    rewarding employment and sweeping skyline views.


    And yet the February 2013 video also triggers some unease, which education researcher
    Jane Margolis expresses in March in her closing keynote presentation at the SIGCSE
    ''13 conference for computer science educators. Too often, Margolis points out,
    the video perpetuates the “boy wonder myth” that programming is more like a superpower
    rather than a learned skill. It features some women and girls but fails to acknowledge
    what she categorizes as the “preparatory advantage” that many interviewees had—namely,
    expensive computers at home in the 1980s, private tutors, and parents who worked
    in software industry. These key elements are casually referenced by the code.org
    video''s speakers as if they are the rule and not the exception. Access is a significant
    issue. Before technical prowess can be considered, we need to address some fundamental
    factors—access to computers, knowledge, and support.


    The video focuses on workplaces with open offices and play areas, cafeterias with
    free snacks, and on-site amenities such as dry cleaning services, but it does
    not look at the social responsibilities that computer scientists have—to improve
    onerous working conditions in technology manufacturing, develop better ways to
    recycle discarded technologies, and increase the participation of underrepresented
    groups. These issues have received much publicity and suggest that the computer
    science community needs to reevaluate their public persona. Some, like Vanessa
    Hurst, the founder of'
  merge: -1
  img_proc: true
- pgno: 146
  md: '*Girls Develop It*, note that “If someone had told me that software is really
    about humanity, that it is really about helping people by using technology, it
    would have changed my outlook much earlier.” But these alternative, larger-scale
    perspectives that move coding into the domain of social interaction and relevance
    receive little attention in the video, even though this perspective speaks to
    the day-to-day relevance and civic responsibility of computing.


    Finally, although Steve Jobs''s introductory quote claims that programming “teaches
    you how to think,” programming is only one of many ways to learn computational
    thinking. Jobs''s quote is less grandiose than some others by video interviewees,
    but it may be both the most powerful and problematic one. If programming is important,
    then we have a responsibility to educate everyone and not suggest that such learning
    is magic or wizardry. For too long, programming has existed within the popular
    consciousness as an erudite pastime meant for the elite few. The video''s promise
    of superpowers does not do much to change this perception but helps to identify
    broader issues of access, interest, effort, and support. As long as programming
    is seen only as a form of thinking and engaging the individual mind (this is the
    problematic part) and not equally as a form of participation and expression (this
    is the powerful part), we will fail to benefit from learning and teaching code
    in today''s networked communities.


    *Connected Code: Why Children Need to Learn Programming* is a call to action on
    facilitating computational participation: how do we better design programming
    activities, tools, and materials for learning and teaching in K–12 schools? We
    argue that computational thinking should be thought of as computational participation
    to emphasize that programmed projects like games, stories, and art are not only
    objects-to-think-with (to use one of Seymour Papert''s ideas) but also very much
    objects-to-share-with that connect us to others. Some might argue that bringing
    programming into K–12 schools will fail now as it failed thirty years ago. Those
    who persist in seeing programming as a skill meant for the exclusive few also
    usually persist in seeing it as an inherently asocial activity.


    But today, young people participate in computing in websites, clubs, and classrooms,
    and within this enthusiastic do-it-yourself digital ethic, we see evidence that
    programming can flourish in schools. This group of young DIY enthusiasts needs
    to expand so that more children are introduced to'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'the creative and collaborative potential of coding. And Papert''s ideas—now
    over thirty years old—were prescient in terms of understanding that learning to
    code was most compelling and effective in communal settings. There are sites where
    millions of kids imagine, design, and freely share their programs. Within the
    DIY culture, programming is becoming part of the larger digital culture. So as
    we return programming to the schools, we can draw from lessons learned in the
    coding circles of Project Headlight and the Scratch online programming community
    and from a broadened understanding of media practices and repertoire of programmable
    media.


    To expand on Jeanette Wing''s definition of computational thinking, we see computational
    participation as solving problems with others, designing intuitive systems for
    and with others, and learning about the cultural and social nature of human behavior
    through the concepts, practices, and perspectives of computer science. Having
    kids program applications, work in groups, and remix code will not address all
    of the challenges that are associated with broadening participation in computing,
    but it represents a crucial beginning step. The commercial toy industry is developing
    programming applications that allow children to design artifacts that they and
    others find significant. The popularity of the new maker kits and smart toys illustrates
    that children want interactive toys that light up and make sounds as well as toys
    that let them do the interactive designing. They want to determine when the lights
    blink and the buzzers sound, and educators can foster this spirit in the classroom.
    By making programming a community effort, educators can make schools into places
    for sharing and collaboration, both formally and informally.


    In the context of computational thinking, this means that we need to move beyond
    seeing programming as an individualistic act and begin to understand it as a communal
    practice that reflects how students today can participate in their communities.
    This is no small step for schools, where individual achievement far outweighs
    group dynamic in what qualifies for academic success. Yet if the past decade and
    the advent of Web 2.0 have taught us anything, it is the importance of collaboration
    in facilitating more creative and cost-effective solutions to problems. Having
    a chance to participate and collaborate in communities of programming is key to
    learning the fundamental concepts and practices of programming, which in turn
    offers people an unprecedented opportunity to participate in the wider digital
    public.'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'Focusing on computational participation—as programming activities are returned
    to schools, community centers, and homes and connected to the online world where
    many programming projects are designed and shared with others—will be a challenge.
    Although most schools have not been institutions that support meaningful and productive
    group work, the magnitude of the challenge is no reason not to rise to meet it.
    Here we outline multiple pathways that lead to realizing coding for all.


    # ## Pathways into Computational Participation


    In this book, we have viewed teaching and learning computer coding as being wrapped
    in theories of mind, community, and culture. According to a good deal of educational
    research, teaching and learning the three Rs (reading, writing, and arithmetic)
    need to focus on mind, community, and culture; include skills, strategies, and
    concepts; and understand context, audience, and relevance. After adding a fourth
    R for arts (aRts), schools and online and offline afterschool programs will need
    to add a fifth R for programming (pRogramming).⁴ This will involve programming
    applications for learning specific subject matter, making shareable items with
    personal meaning, forming communities that provide context and audience for programming
    designs, leveraging remixing as a cultural practice that children negotiate in
    appropriate ways, and expanding curriculum to include a broad array of computational
    materials and activities to generate broad participation in computing. With this
    in mind, we point to ongoing efforts and new developments that provide promising
    starting points. Although not an exhaustive list, it serves as a meta-roadmap
    for new schools, curricula, teachers, afterschool programs, materials, and online
    communities.


    Opportunities need to start in the elementary and middle-school grades to provide
    students with early experiences in computing. Younger children can engage in creative
    and constructive designs at home and in kindergarten. Even the iPad, which most
    children use to play games and watch videos of TV shows, provides an array of
    simple programming apps (such as Daisy the Dinosaur, Hopscotch, and Move the Turtle)
    that let kids manipulate objects and characters. A Scratch Jr. version for very
    young children is being developed based on the original’s successful block interface
    for making designs. But the most interesting advances have been made in the design
    of tangible construction kits that allow for physical manipulation of'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'blocks to create robots or other devices. Education researcher Marina Bers
    has provided many compelling examples of how intergenerational robotics workshops
    can encourage parents and their children to learn together key computational concepts.^5


    In the school setting, ambitious efforts to redesign schools and curricula are
    integrating programming across the curriculum rather than as a stand-alone class.
    The instructional software design and game design projects discussed in chapter
    3 provide compelling illustrations of how such efforts can be contextualized within
    an already crowded curriculum rather than offered in a stand-alone course. Similar
    to the software design projects in Project Headlight in the 1990s, Quest to Learn
    in New York City (and more recently in Chicago) provides a school environment
    where students program and play games across the curriculum. With the proliferation
    of programming tools and communities, there are now numerous examples of game
    design programs in schools. The nonprofit Globaloria, for example, has created
    game design classes and competitions in dozens of school districts across several
    states where students work on designing instructional games in Java, share them
    with the Globaloria community, and celebrate successes in competitions. Using
    models such as instructional software design, game design or story telling provide
    measurably effective ways to integrate computing into standard mathematics and
    science activities while leveraging students’ interest and knowledge of popular
    digital media.^6


    Equally important are developments of K–12 computer science curricula.^7 The Exploring
    Computer Science curriculum that was developed by the group around Jane Margolis
    and Joanna Goode includes a wide range of activities such as interface design,
    computing and data analysis, and Web and robotics design. Through these activities,
    students are introduced to problem solving and design thinking as they learn basic
    programming ideas and concepts and address social issues and the ethics of computing.
    The curriculum has been successfully implemented in several high schools in the
    Los Angeles area and is being expanded to schools in cities across the United
    States. The Association for Computing Machinery and the Computer Science Teachers
    Association also proposed a model curriculum for K–12 education that included
    examples of media computing, computing in biology, and computational thinking.
    Another development is the recent startup of six new computer science and engineering
    public high schools in New York City with the goal of increasing the number of
    schools in'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'coming years. The Software Engineering Pilot curriculum takes an equally sweeping
    approach to introducing fundamental software design and engineering principles
    in the context of Web design, robotics, and embedded electronics in textile designs,
    and it complements them with electives in computer-aided design, three-dimensional
    computer graphics, animation, and bioinformatics. Many schools (such as High Tech
    High) have promoted a broad spectrum of technology and coding activities in their
    curricula. These curriculum designs illustrate that computing at the high school
    level can introduce students to key ideas of computational thinking and create
    pathways into Advanced Placement computer science courses and exams that present
    crucial preparation for moving into computer science courses at the college level.


    We also need teachers who can implement these curricula and counselors who steer
    students into courses. After reviewing the situation in Cameron Wilson, Leigh
    Ann Sudol, Chris Stephenson, and Mark Stehlik’s recent report, *Running on Empty:
    The Failure to Teach K–12 Computer Science in the Digital Age*, the Computer Science
    Teachers Association has recommended adapting certification standards for teachers.
    CS cannot be taught by a transient corps of volunteers but will need to include
    professionals who understand the learning trajectories of students and who develop
    pedagogical strategies to support learning. We have provided several examples
    of how computing can be incorporated in the curriculum rather than exist as a
    stand-alone activity. But as Jane Margolis’s work has shown, teachers, administrators,
    and school counselors all play critical roles in overcoming students’ narrow informal
    conceptions of computing and encouraging them to take available courses.


    Although the shift toward designing authentic applications is an important step
    in the right direction, designing video games is not the only application that
    can achieve this goal. Game design leverages the interest and informal experiences
    of many children and youth, but it also caters to a community that is still predominantly
    male. Many other types of software applications can be designed and fulfill the
    promise of an authentic context. For this reason, joining the existing clubhouse
    that might be found in the Scratch community still leaves many outside. In the
    Scratch online community, only 37 percent of members are girls—more than at many
    other technical sites but not enough.'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'To broaden computational participation, we need to encourage all kinds of digital
    designs, including games, animations, and stories with different materials and
    contexts. The Alice programming language, for example, has imported Sims characters
    into its environment to connect students’ experiences with entertainment software
    to programming 3D stories. This inclusion helps promote the site by leveraging
    popular culture but also tacitly breaks from the traditional “move and shoot”
    video game motif by encouraging broader interactivity through character development
    and extended narratives. Equally important are efforts in pedagogy, such as the
    Programmers’ Workshop that built on the established model of the Writers’ Workshop
    to offer teachers and students a structure for including computational activities
    in digital stories and animation.


    Electronic tangible construction kits are making new computing activities available
    that expand beyond the already popular robotics activities. LilyPad Arduino, MaKey
    MaKey, and many other kits and materials suggest rich contexts for computing and
    can lead to computational activities that move beyond the screen into arts and
    humanities.<sup>8</sup> This is especially important in K–12 classrooms, where
    early programming activities occurred exclusively in mathematics and science classes.
    As social sciences, humanities, and media arts evolve in the digital age, these
    construction kits represent the new “stuff” of teaching and learning. By broadening
    activities, practices, and perceptions of computing, computational participation
    can be ensured for all students. Now that technologies have become more widely
    distributed and more affordable, it is time to develop and promote materials that
    jump the traditional gender divide that has been associated with robotics. We
    can no longer be content with youth online communities that simply socialize.
    Computational participation means connecting through making, which leads to deeper,
    richer, and healthier connections among online youth.


    Although schools, curricula and materials, and teachers are important milestones
    on this road map, afterschool programs and online communities are equally important
    in providing access to support, expertise, and audience. The Computer Clubhouse
    network is a key example of how community technology centers can be more than
    just places for doing homework and playing games and can engage youth in learning
    programming. Other community efforts such as GirlsWhoCode.org have focused on
    girls. The Computer Clubhouse set up successful Girls Days in their centers to'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'create spaces for girls to visit and investigate. Many public libraries have
    started maker spaces and activities in their branches that often reach under-served
    communities where they live. These physical locations are important “homes away
    from home” for many youth to find receptive audiences for their designs.⁹


    We also need to figure out ways that youth can participate in online creative
    communities such as Scratch that allow them to program outside of schools. These
    online communities provide new models for collaborative action and participation
    that move far beyond the current model of small-group collaboration that is practiced
    in many school settings. We have demonstrated how such collaborative activities
    can be designed and what it means for students to develop collaborative agency.
    Such collaboration provides authentic extensions to the world outside of school,
    and as those boundaries around what happens inside and outside classrooms become
    more fluid, students and teachers connect and share in ways that create healthy
    and effective learning organizations.


    There are many reasons for making these efforts, but they all have one overarching
    goal: to achieve equity and diversity because computational participation cannot
    be achieved if only a select few join the clubhouse. After twenty years of only
    marginal success in broadening participation in computing, we know that this does
    not happen on its own, just as we know that technology education in K–12 schools
    does not naturally evolve. It takes real pushing. And we know from our research
    in the Scratch community that this move toward membership in a large-scale community
    is a complex interplay between how young software designers develop personal agency
    through programming and how they gain status as experts among their peers. Despite
    the myth of children as “digital natives” who naturally migrate online, observations
    indicate that some children initially resist uploading their program to the Scratch
    website and are uncomfortable sharing their work with more experienced members
    online. This suggests that establishing membership in a large programming community
    is not easily achieved. Navigating online communities requires an array of participation
    strategies that address the vulnerability that is associated with sharing one’s
    work for others to comment on and even remix for their own purposes.¹⁰


    Likewise, seeing programming as a collaborative, distributed effort requires types
    of collaborative agency that usually are not found in the'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'collaborative group work in classrooms. In the Scratch online community, for
    example, collaborative activities typically revolve around the production of particular
    types of Scratch projects by a small group of individuals who have met one another
    in the online environment based on mutual interests. In our recent research into
    such forms of collaborative efforts with online and offline groups, we found that
    many students found it difficult to participate in these types of self-organized
    collaborations. Educators and researchers who design and study K–12 programming
    communities need to focus not just on how novice students learn to program but
    also on how children learn to collaborate.


    This issue of equity in participation is not new. On a basic level, the classrooms
    that use software design activities always form communities where students engage
    in the forms of peer pedagogy that often are observed in large online networks.
    What is different now is the availability of large-scale communities that connect
    thousands of young programmers and provide different contexts and opportunities
    for exchange. The type of design communities that are created around tools such
    as Scratch, Alice, or Kodu can be done in local classrooms and clubs where youth
    participate as well as in the online spaces that youth populate to share their
    designs and comment on others.


    These new directions for the design of activities, tools, and communities in K–12
    educational computing efforts can broaden participation in and perceptions of
    computing on a considerably larger scale than previous attempts at integration.
    We are not arguing that all the standard staples of traditional computing courses
    should be dismissed. Writing code to learn about the nature of algorithms and
    developing data structures, compilers, and general architecture remain crucially
    important and are not easily learned on their own. But K–12 educational computing
    can take the road that K–12 language arts, mathematics, and science education
    took long ago. It can successfully leverage the insights that are gained from
    youth digital media, networked cultures, and learning theory to promote the idea
    of children programmers against all conventional wisdom.


    # Coding Is Connecting


    We argue that computational thinking should be reframed as computational participation
    because computers in any form and place have become'
  merge: -1
  img_proc: true
- pgno: 154
  md: <!-- no content -->
