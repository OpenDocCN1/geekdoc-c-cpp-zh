- pgno: 20
  md: '# # 1 The Comeback of Coding


    On June 23, 1990, The Computer Museum in Boston opened an exhibit featuring the
    world''s first Walk-Through Computer. Fifty times the size of a desktop model,
    the computer was one of a kind. Visitors to the museum ran their hands across
    a keyboard with buttons the size of their heads, looked up at a motherboard the
    size of a score board, and measured their height against a floppy disk that met
    them at eye level. More than just a model, the computer ran a functional software
    program, allowing visitors to take a tour of the world on a mammoth screen. With
    a giant trackball to guide the cursor, visitors chose starting and destination
    points from among three hundred major world cities, and the program calculated
    the shortest land route between any two sites, displaying geographic sights that
    would be encountered from one locale to another. The exhibit was a success and
    received global press coverage. Thousands walked through the interior world of
    a device that could show them the world on a gigantic screen and whose enormous
    size seemed to comment on the computer''s ever-growing presence in the world.<sup>1</sup>


    A few miles from the museum, a different sort of exhibit was being held in a Boston
    public elementary school in what was then one of the city''s poorest neighborhoods.
    Project Headlight featured the world''s largest school computer lab with hundreds
    of computers. Part of a bold experiment sponsored by MIT''s Media Lab, Project
    Headlight was likewise committed to getting users "inside" the inner workings
    of computers. Rather than a walking tour, however, the project put children into
    the veritable driver''s seat behind the machines and taught them how to manipulate
    the computer''s behavior by using the programming software Logo. Initiated by
    Seymour Papert, the project was founded on an idea that was unusual at that time—that
    children should (and could) program computers. Inside Project Headlight, the computers
    were arranged in circles in a large space near various classrooms rather than
    being closeted away into a single classroom. Once a day, students programmed stories,
    software, and games in Logo and sometimes'
  merge: -1
  img_proc: true
- pgno: 21
  md: '*exchanged them with children in other countries. Project Headlight was a great
    success for the years it lasted. Thousands of students and teachers were pioneers
    in bringing programming to the grade-school level and collectively provided a
    living example what learning and teaching with computers could look like.⁵*


    When The Computer Museum closed its doors in 1999 and moved across the Charles
    River to the Boston Museum of Science, the exhibits for the Walk-Through Computer
    were packed up and stored but never reassembled. The computers from Project Headlight
    were sent to individual computer labs because the open learning space for collaborative
    coding was deemed to be unfeasible within the traditional structure of the school
    day. A gigantic computer that people walked through? Schoolchildren who programmed
    computer games? Both ideas seemed to belong to the realm of infeasibility. In
    the second half of the 1990s, laptop devices became increasingly popular, and
    the notion of big machines seemed archaic. The development of


    ![](img/9eb64eca0f040452d3ba8df0d78b35a9_21_0.png)


    **Figure 1.1**

    The Walk-Through Computer exhibit at The Computer Museum in Boston, 1994.

    Photo by Paula Lerner.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '![](img/9eb64eca0f040452d3ba8df0d78b35a9_22_0.png)


    **Figure 1.2**

    Project Headlight at a Boston elementary school, 1990. Photo by L. Barry Heatherington.


    CD-ROMS (compact discs read-only memory) made the toil associated with coding
    seem equally archaic. Who wanted to bother with the laborious process of coding
    programs when the applications could be easily downloaded with the slip of a disk?


    Yet both the giant Walk-Through Computer and Papert''s coding circles were evidence
    of a belief in the potential for all of us—regardless of age or experience—to
    touch the machine itself, to get inside the inner workings of the computer, and
    to connect with our own passions through the machine. And now the pendulum is
    swinging back. Today the computer has moved out of museums and computer labs.
    Its presence is felt most deeply in the omnipresent hand-held and touch-screen
    devices that run digital applications tailored to the professional and social
    needs of the individual user. Computers—desktops, laptops, tablets, and mobile
    devices—have tangibly and personally become extensions of ourselves,⁵ and coding,
    once solely the erudite pastime of techies, is now being recognized by educators
    and theorists as a crucial skill, even a new literacy, for all children.⁴'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'We often forget about the importance of the social, personal, and tangible
    elements that are associated with learning with, through, and about computers.
    Yet these elements play a fundamental role in helping us to understand the inner
    workings of the machine and the dynamics of contributing to social networks. In
    *Connected Code*, we examine the possibility of rediscovering the computer as
    a means for personal and social connectivity. Despite the initial enthusiasm for
    both The Computer Museum’s exhibit and Papert’s educational workshop, why did
    getting “inside” computers not become an educational priority for our schools,
    and how is programming now making a comeback?


    Returning programming to schools is one response to a call to develop computational
    thinking in young learners. The premise is that by learning to think like a computer
    scientist, students can solve everyday problems, design systems that we all use
    in daily life, and progress and innovate in other disciplines.⁷ Computational
    thinking has now become an umbrella term for computer science’s contributions
    to reasoning and communicating in an increasingly digital world. Despite the emergence
    of computational thinking as a conceptual framing for teaching programming, however,
    the revival of programming is not being led by either educators or promoters of
    computational thinking.


    One significant push for programming’s resurgence has come from an unexpected
    source—the do-it-yourself (DIY) ethos that is characteristic of digital youth
    cultures. Computers now are accessible inside and outside of school, and children
    use their personal machines to innovate with technology by creating their own
    video games, interactive art projects, and even programmable clothes through electronic
    textiles. The same computers on which they create these homespun items also connect
    them to wider networks of other young users who share common interests and the
    commitment to “doing it ourselves” through a mutual DIY ethic. Schools may be
    able to incorporate some of the methods of these informal collaborative communities
    (particularly creative production and networked participation) in their own formal
    environments. These aspects of the DIY culture provide promising models for how
    schools can adapt their approaches to learning and teaching with computers in
    the digital age. And schools certainly have such a responsibility.


    Despite the upsurge of DIY youth communities, these communities represent a small
    portion of the youth population.⁸ Most children use their'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'devices—whether laptop, iPad, iPhone, or Droid—to consume commercial media.
    Computers may have become extensions of ourselves, but to what extent are we teaching
    children how to design and manage these extensions? How do we help children become
    producers and not just consumers of digital media? What role should programming
    play in facilitating such production, and how can schools best help children to
    develop literacies for the twenty-first century? With the universal prominence
    of digital media, do we need to be concerned about equity issues of access and
    participation? Given that these questions involve individual identity, social
    well-being, and the wider economic viability of this country, we need to revisit
    the question of what it means to be literate in today’s society. One way to do
    this is to return to the ideas that led Papert to establish computer coding circles
    in schools and situate these ideas in today’s educational, cultural, and technological
    environments.


    This first push to put programming in schools was inspired by Papert’s 1980 book
    *Mindstorms: Children, Computers, and Powerful Ideas*, in which he argued that
    by programming computers, children could learn about mathematics, new topics such
    as cybernetics, and their own thinking (according to the progressive views of
    education promoted by John Dewey, Paulo Freire, and Maria Montessori). The book
    was controversial but also helped educators around the globe to see the value
    of having computers in schools. *Mindstorms* promoted a vision of computers in
    school that came alive through the coding circles of Project Headlight described
    in introductory vignette.


    In *Connected Code*, we discuss what children are actually interested in programming,
    what contexts they do it in, and how they do it. Through the lens of the introductory
    programming language *Scratch*, we examine these connections between children
    and computer programming along several dimensions:


    +   - *From code to applications*, illustrating how students increasingly learn
    programming not as an abstract discipline but as a way to make actual applications,
    such as video games and digital stories;

    +   - *From tools to communities*, highlighting the shift from learning code as
    an individualistic endeavor to learning it as a social enterprise;

    +   - *From scratch to remix*, pointing to the growing possibilities and ethical
    challenges that are associated with repurposing code as a starting point (or from
    scratch) for programs; and'
  merge: -1
  img_proc: true
