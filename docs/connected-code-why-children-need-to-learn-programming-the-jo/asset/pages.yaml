  md: 'applications and activities. Before we launch into discussions of various applications
    of what we have termed computational participation, we revisit in chapter 2, Connected
    Learning, key tenets of constructionist learning as articulated by Papert through
    the development of Logo and now through Logo''s successor, Scratch. We identify
    four dimensions characteristic of Constructionist thought (social, personal, cultural,
    and tangible), which are explored in chapters 3 through 6, illustrating the shift
    in how computer programming has evolved over the past two decades as a participatory
    process. Chapter 7, Connected Teaching, acts as a companion piece to chapter 2,
    by examining the teacher''s side of constructionism. It explores what it means
    for teachers to transition into computation and collaboration, how they can create
    appropriate learning environments for their students, and what benefits and issues
    are associated with bringing do-it-yourself learning approaches into classrooms.


    Between these two chapters that address the learning and teaching sides of constructionism,
    the four central chapters address the new social, personal, cultural, and tangible
    connections in teaching and learning programming. In chapter 3, From Code to Applications,
    we focus on the emergence of programming artifacts or applications as the focal
    point of learning. Learning programming once prized coding accuracy and efficiency
    as the signifiers of success. Today, however, rather than programming for the
    sake of programming, students can create authentic applications (such as games
    and stories) as part of a larger learning community. We present different examples
    of game designs, digital storytelling, and animations that showcase how applications
    situate the learning of key programming concepts and skills in different contexts.


    In chapter 4, From Tools to Communities, we argue that learning to program is
    no longer performed as an isolated endeavor but is accomplished within a shared
    social context, utilizing open software environments and mutual enthusiasm to
    spur participation. The qualities of these shareable artifacts (a highly playable
    game, a sophisticated animation, or a particularly nuanced digital story) foster
    camaraderie and offer entry into coding communities. This chapter examines the
    emergence of youth programming communities and the ways that young designers enter
    and participate in such communities.


    In chapter 5, From Scratch to Remix, we examine the emergence of new practices
    of participation and codesign as programming becomes a'
