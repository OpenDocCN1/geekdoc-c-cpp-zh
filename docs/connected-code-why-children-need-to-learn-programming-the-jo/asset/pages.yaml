    # Connecting Construction, Code, and Culture


    The personal, social, cultural, and tangible dimensions of connected learning
    reveal that learning is not solely a technical matter of skills to be mastered.
    When people are learning to code, the technical component may be the least problematic.
    As Caitlin Kelleher and Randy Pausch recognize in their analysis of introductory
    programming initiatives, the social and cultural barriers to learning programming
    are often “harder to address than mechanical ones because they are harder to identify
    and some cannot be addressed through programming systems.”^17 alone. Programming
    is not just a cognitive skill that is used to design code. It also is a social
    and cultural skill that is used to participate in groups.


    Our arguments for connected learning move beyond programming to examine how technology
    works and how design can incorporate a broader range of materials as more aspects
    of daily life move into the digital domain. The goal is to design both learning
    technologies and environments that provide the person and not the computer with
    agency.^18 There is a constant tension between agency (what learners do) and structure
    (how the context is constrained). From a connected learning perspective, the more
    freedom that teachers offer learners, the more they need to think about the boundaries
    of the established learning environment. Conversely, the more rules that initially
    are established, the more teachers need to think about what individual learners
    bring to the situation in terms of their interests, knowledge, and values. The
    key to good teaching is finding this balance between structure and agency, which
    is the great challenge of education in all its forms. On the one hand, educators
    need to distinguish between the roles of teacher and student. On the other hand
    (and paradoxically), this distinction must be blurred so that both teacher and
    student are unified as learners. Likewise, cultural context, practices, and perceptions
    play a critical'
