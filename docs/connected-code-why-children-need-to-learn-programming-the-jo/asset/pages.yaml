  md: 'doing are valued over others. And nowhere is this more important than in technology
    cultures, where, as Sherry Turkle and Seymour Papert have articulated, there are
    preferred ways of working with technologies that value the formal over the concrete.
    By studying and interviewing programmers, Turkle and Papert revealed that the
    officially promoted top-down planning approach is not always superior to a more
    improvised, bricoleur style approach. The bricoleur style is not a more advanced
    form of knowledge construction but is a different way of organizing planning and
    problem solving. Turkle and Papert argue for an epistemological pluralism, meaning
    that the bricoleur style (which favors concrete thought) can be as advanced as
    abstract thought, and they observe that among the sciences, computer science prizes
    abstract thinking.13


    Learning by connecting knowledge and relationships also highlights other distinctions
    that society has drawn between critical thinking (traditionally understood as
    conceptually and linguistic based) and physical making (goal-based material work).
    In providing opportunities to concretize knowledge by creating material objects
    that embody ideas, we highlight ways that two modes of engagement with the world
    (that are usually held separate) can be reconnected. By encouraging the externalization
    of knowledge, we promote seeing the knowledge object as a distinct “other” with
    which we can enter a relationship that consists of questions that makers ask themselves
    about how the external object connects to other bodies of knowledge.14 Understanding
    the boundaries and values that have been associated with such forms of engagement
    is critical to understanding who and how learners can connect with them. In other
    words, how we come to think and participate computationally is introduced and
    prescribed through cultural preferences.


    Epistemological pluralism in connected learning thus is about how programs are
    designed, how problems are viewed, what values are reflected in artifacts, and
    how this can provide a context for learners to connect and engage with the practices
    in the field. Today the revaluation of the concrete is displayed in the interest
    of young people in learning programming apps and other digital artifacts. This
    enthusiasm among youth for tinkering with source code has been a fundamental lever
    in the open-source movement, which aims to make technology development and interactivity
    more explicit, and argues that hiding relationships in these domains ultimately
    stifles collaboration and creativity. The ethos of the open-source movement'
