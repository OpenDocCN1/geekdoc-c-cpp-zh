  md: 'of public activities, where students prepare, display, and share their learning
    artifacts, can be valuable learning experiences, yet few researchers have studied
    what students derive from their participation in science fairs and robotics competitions.
    S. Yasar and D. Baker (2003) did not find statistically significant results in
    seventh-grade students'' knowledge of scientific method and attitudes toward science,
    but science fair attendance seemed to improve female participants'' attitude and
    interest in science. A recent study by Brandeis University, commissioned by the
    FIRST Lego League 2008–2009, reported positive influences on youth participants''
    attitudes, skills, knowledge of science and technology, and self-confidence.


    +   10. The FIRST Lego League is a partnership between FIRST (for Inspiration
    and Recognition of Science and Technology), an organization that was founded by
    inventor Dean Kamen in 1989, and the Lego Group, the company that sells Lego bricks
    and boxes. The league hosts international competitions with over twenty thousand
    teams in over seventy countries (see http://www.firstlegoleague.org).


    +   11. See First Lego League (2008–2009).


    +   12. J. H. Forrester (2010) found that participation in these public events,
    which often is encouraged by teachers and parents, is highly correlated with later
    career choices in STEM majors. Although girls initially participated in science
    fairs less frequently than boys, for the past twenty years their participation
    rate has been greater than that of boys. T. A. Greenfield (1995) found that boys
    have been and continue to be more likely than girls to prepare physical, earth,
    math, and computer science projects. A report of the FIRST Lego League 2008–2009
    showed that robotics competitions had only marginal success in increasing girls''
    participation. In academic year 2008–2009, 7,800 teams participated in the league
    robotics competition, and 70 percent youth participants were boys.


    +   13. For an overview on benefits of learning robotics, see F. Baretto and V.
    Benitti (2012); for the relationship between robotics activities and science literacy,
    see Florence Sullivan (2008); and for the relationship to positive youth development,
    see Marina Bers''s book *Designing Interactive Experiences for Positive Youth
    Development: From Playpen to Playground* (2012).


    +   14. See Y. B. Kafai, W. Burke, and C. Mote (2012).


