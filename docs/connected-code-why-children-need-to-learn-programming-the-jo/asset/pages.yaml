- pgno: 120
  md: 'functionalities.<sup>17</sup> This call for transparency illustrates an important
    pedagogical dimension of tangible computing, one that Papert stressed with the
    body syntonicity of the turtle. It was a matter of representation (being the turtle
    on the floor or on the screen), touch (touching circuits), and pedagogy (understanding
    the functionality and building personal connections to the objects). Working across
    different domains—crafting, engineering, and computing—underscores the importance
    of seeing how concepts cross a range of media and conditions.


    But there is a second, equally important dimension of transparency that relates
    to bringing together different cultures—crafting and sewing (which historically
    are associated with women) and engineering and computing (which historically are
    associated with men). We observed in numerous workshops and classes how these
    references to the gendered nature of e-textile materials and activities slip into
    conversations. When middle-school boys label their activities “doing circuits”
    rather than sewing or when high school boys talk about “sewing being a girl’s
    sport,” they are claiming that engineering is more valuable and more appropriate
    for males.<sup>18</sup> On the other side, some argue that learning with e-textiles
    reinforces existing gender stereotypes and that women should participate in more
    male-dominated activities, like robotics. Such tensions are productive because
    they open up conversations and question fairly narrow perceptions about computation.


    The LilyPad Arduino e-textile construction kit harks back to longstanding historical
    connections between women, textiles, and computing. Ada Lovelace’s notes on the
    analytical engine resulted in the first “computer program” in the nineteenth century,
    and the Jacquard loom, which used punched cards to weave complex patterns in textiles,
    is considered by many the first step in the history of computing hardware. Lovelace
    wrote perhaps the most beautiful sentence ever to link fashion and computing:
    “We may say most aptly that the Analytical Engine weaves algebraical patterns
    just as the Jacquard loom weaves flowers and leaves.”<sup>19</sup> Cultures of
    computing moved from textile weaving to code crunching during war and now are
    returning to crafting, gaining new impetus from digital fabrication. E-textile
    construction kits make visible the complex intersection of culture and computing
    because they bring together domains that are seen as contradictory. Their existence
    provides a visible counterargument by bringing together the low- and high-tech
    forms of computing.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'They also allow students to see that simple design modifications can connect
    the same technologies with very different communities. The LilyPad Arduino’s sensors
    and actuators are modifications of the functionally equivalent Arduino board,
    sensors, and actuators. This means that the LilyPad Arduino can do anything that
    the Arduino board can do and vice versa. Yet we know from a recent study by Leah
    Buechley and Benjamin Mako Hill^20 that many more women participate in the LilyPad
    community than in the Arduino community: of projects posted on the Web, 80 percent
    of Arduino projects were completed by male designers, and 80 percent of LilyPad
    Arduino projects were completed by female designers. Although robotic kits like
    Lego Mindstorms invite a certain kind of computational production and producers,
    so do textile construction kits like the LilyPad Arduino. The design and framing
    of computational activities and materials affects who sees themselves as part
    of the community and then joins and participates in it.


    Likewise, the communal sewing circles that are the design context for many e-textile
    activities are unlike the competition-driven workshops of the robotic activities.
    Competitions have an energizing function, providing purpose and audience in a
    shared event, but they should not be the only model for organizing, presenting,
    and celebrating computational participation. We need to create communities that,
    unlike the robotics competition, provide a collaborative and supportive atmosphere.
    We are building such new communities and events around computational crafting
    activities. Called eCrafting Circles,^21 they intentionally refer to the quilting
    bees and sewing circles that used to bring together neighbors to produce quilts,
    clothes, and more (see figure 6.3 bottom). Rather than competitions, online crafting
    circles will be time-sensitive, locally relevant events that allow for sharing
    and displaying of computational crafts. These are intended to spark increased
    participation and collaboration in e-textiles, similar to the way FIRST Lego League
    competitions have increased participation in robotics, but without the emphasis
    on competition that deters significant groups of people from joining.^22 Scalable
    across regions while adaptable to local needs, eCrafting Circles are intended
    to provide a forum that allows like-minded and interested participants to share
    learned insights and provide much needed support for their designs. Much of computational
    participation has focused on the online world, but there is equal benefit to be
    found in physical construction and local participation. We might want to revisit
    what computer'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'labs and classes could look like when crafting and computing provide new materials,
    activities, and audiences for learning.


    # Shop Classes for the Next Millennium: Animated Pop-Up Books, Game Arcades, and
    Public Displays


    In new clubhouses, community centers, and afterschool programs, students will
    be able to interact with computers to communicate, receive, and organize information.
    But new clubhouses cannot bear the sole responsibility for teaching children to
    think systematically and creatively using computers. School classrooms need to
    embrace the hands-on, creative technical learning that has been fostered in peripheral
    clubs. In the vocational education and industrial arts courses of the 1950s, students
    used technology collaboratively and constructively in real-life applications.
    By the 1970s, however, some reformers were characterizing such classes as pointless
    or unchallenging, even though they made education more hands-on, practical, and
    project-driven and represented some of the most innovative thought in education,
    particularly the progressive ideas of John Dewey in *Experience and Education*.^23


    The promise of hands-on and creative learning through technology has not been
    forgotten. More than a decade ago, computer scientists and educators Mike and
    Ann Eisenberg envisioned a next generation of shop classes that would include
    computational media and crafts—what they called computer-enriched handicrafts.^24
    Shop classes, which often are taken by students who are not going on to college,
    can engage all learners in designing and understanding technology by blending
    computation and material artifacts. This revaluation of the concrete for learning
    has also been supported by education writer Mike Rose, who has analyzed the intellectual
    dimensions of trades, crafts, and arts. Most educational research has focused
    on understanding learning and teaching in academic disciplines such as science,
    mathematics, and language arts and has paid little attention to the intellectual
    demands and opportunities found in plumbing, carpentry, and waitressing. Yet building
    robots and crafting electronic textiles are compelling illustrations of how crafting,
    engineering, and computer science can generate rich and engaging learning contexts.


    One unexpected direction for next-generation shop classes has been a return to
    paper and paint, enhanced with conductivity and computation.'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'Although digital learning has moved away from the printed text that has been
    the foundation of literacy for hundreds of years, computational design and paper
    crafts can be merged in innovative ways. For instance, Mike and Ann Eisenberg''s
    HyperGami allows students to use origami paper folding crafts, computation, and
    geometry to design three-dimensional objects on the screen that can be printed
    out and folded into paper creatures and objects (figure 6.5). Pop-up books can
    embed circuitry with LEDs that light up when pages are opened or paper strips
    are pulled. Although these activities do not require coding, they are a first
    step into the world of making connections in circuits that can be enhanced with
    programming. The work on paper can be further expanded to include conductive paint
    that can animate information on the page or connect back to a computer screen.
    Many of these projects have tackled the conceptual and technical challenges of
    designing materials and tools, and they now become accessible for learning and
    teaching the next-generation shop class.


    Computer scientist Amnon Miller''s pioneering work with Hook-Ups illustrates how
    youth can learn about electricity, design, and programming while crafting tangible
    interfaces with everyday and found materials. MaKey MaKey, discussed at the beginning
    of this chapter, is a low-cost computational construction kit that has lowered
    the barriers for setting up computational-style shop classes (figure 6.6). What
    if game design activities can be extended into the material world with the joystick
    interfaces that are found in popular gaming consoles and arcades? In the 1970s
    and 1980s, gaming arcades were lively and public spheres that provided many youths
    with their first access to video games. More recently, we worked with a class
    of middle-school students who set up an arcade with remixed Scratch games and
    touchpad dishes. Although the banana piano keyboard was compelling in the video,
    it turned out to be less practical in classroom settings. Play-Doh—a malleable,
    reusable, and conductive mass—became the material of choice for students who were
    designing tangible game interfaces that incorporated both aesthetic and functional
    elements. Some students matched their controller components to the character sprites
    in their video games, and others used the Play-Doh to represent the directions
    in which the sprites in the games could move.


    Everyone spent significant effort on redesigning Scratch games, drawing or downloading
    new sprites (characters), designing custom backgrounds, modifying existing sprites,
    and adding sound effects, all while attending'
