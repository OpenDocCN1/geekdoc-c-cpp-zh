  md: 'rebuild and animate robots from the popular Star Wars movie franchise. Robotic
    technologies and materials that previously were available only to students in
    college classes and university labs were now accessible and relatively affordable
    for schools and families. Programming instruction in terms of Basic, Logo, and
    Pascal had long been abandoned by school computer labs, so learning programming
    and engineering via robotics entered through the backdoor of afterschool clubs.
    Over the years, afterschool robotics clubs became one of the few places in many
    K-12 schools where programming and engineering found a home, but this home was
    consistently outside the standard curriculum.


    Robotics in K-12 also brought with it a new model for displaying and sharing designs—competitions.
    These competitions grew out of January robotics classes at MIT that gave engineering
    students hands-on experience in actual soldering and building physical things
    during the intersession period.⁵ Each robotics class culminated in a public competition
    in a large auditorium filled with cheering students. Challenges were often mundane
    tasks, such as gathering scattered ping-pong balls and moving them to the other
    side of a table. But given that the robot was the sole actor on the stage, these
    everyday tasks took considerable forethought and revision on the part of the engineering
    teams.


    Robotics competitions have become science fairs with a new edge, providing public
    exposure and authentic audiences for typical robot design challenges (such as
    building a tower, running through a maze, or collecting ping-pong balls and moving
    them to the other side of a table). The FIRST (For Inspiration and Recognition
    of Science and Technology) Lego League meetings started in 1992, and now high
    schools from all over the country and across the world participate at local, regional,
    and national levels.¹⁰ A recent study conducted by Brandeis University and commissioned
    by the FIRST Lego League reported positive influences on participants'' attitudes,
    skills, knowledge of science and technology, and sense of self-confidence.¹¹ Furthermore,
    participation in these activities, often motivated by teachers'' or parents''
    encouragement, was highly correlated with later career choices in science, technology,
    engineering and mathematics (STEM) majors.


    Although the robotics competitions are now considered an established and in many
    places the only part of creative computing and engineering cultures in K-12 schools,
    they have not reached everyone. They have been only marginally successful in increasing
    the participation of girls and'
