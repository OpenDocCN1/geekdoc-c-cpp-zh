  md: 'Thus, individual status, communal goodwill, and overall productivity all play
    key roles in understanding why youth choose to remix each other’s work at the
    Scratch website. But what do these remixes actually look like, and what coding
    schemes do they use? Do the look and feel of a remix vary based on the user’s
    reasons for remixing? To answer these questions, it is helpful to return to media
    researcher Mizuko Ito and colleagues’ categories of “hanging out,” “messing around,”
    and “geeking out” to explore why youth opt to use digital technologies.


    # ### Hanging Out: Remix as Socialization


    As with Scratch collaborations that have been designed to involve as many participants
    as possible, one of the most basic forms of remix entails projects that were created
    to invite others to reuse and modify their code and images. The primary goal of
    these “hanging out” remixes is to invite others to join the project as a way to
    facilitate a joint social experience. What distinguishes “hanging out” in Scratch
    is that these “add on” projects often connect users who have never had any offline
    relationship. As is evident in the three examples in figure 5.2, the project titles
    tend to double as invitations and act as a basic, but fundamental, way to connect
    with others at the site. Although the code is altered in the process of adding
    another character, sound, or scene, such alteration usually entails accumulation
    and not revision. This type of remix tends not to change the existing code but
    builds on it with additional lines. Given that the goal is to generate connections
    through such remixes, it is important to be inclusive of what already has been
    added and what can be added. Altering another’s code to change


