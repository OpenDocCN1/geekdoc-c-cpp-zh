  md: '# ## 2 Connected Learning


    Before I was two years old I had developed an intense involvement with automobiles.
    I was particularly proud of knowing about the parts of the transmission system,
    the gearbox, and most especially the differential. I loved rotating circular objects
    against one another in gear-like motions and, naturally, my first “erector set”
    project was a crude gear system. I found particular pleasure in such systems as
    the differential gear, which does not follow a simple linear chain of causality
    since the motion in the transmission shaft can be distributed in many different
    ways to the two wheels depending on what resistance they encounter. I believe
    that working with differentials did more for my mathematical development than
    anything I was taught in elementary school. Gears, serving as models, carried
    many otherwise abstract ideas into my head.


    A modern-day Montessori might propose, if convinced by my story, to create a gear
    set for children. Thus every child might have the experience I had. But to hope
    for this would be to miss the essence of the story. I fell in love with the gears.
    This is something that cannot be reduced to purely “cognitive” terms. Something
    very personal happened, and one cannot assume that it would be repeated for other
    children in exactly the same form. My thesis could be summarized as: What the
    gears cannot do the computer might. The computer is the Proteus of machines. Its
    essence is its universality, its power to simulate. Because it can take on a thousand
    forms and can serve a thousand functions, it can appeal to a thousand tastes.^3


    In his now iconic “The Gears of My Childhood,” the preface to Mindstorms: Children,
    Computers, and Powerful Ideas, Seymour Papert talks about how he made personal
    and emotional connections to gears, how they helped him to understand mathematics,
    and how the computer might become “gears” for other children. He notes that his
    personal experiences cannot be replicated by giving every child a gear set and
    that learners have to construct their own gears. He argues that the protean quality
    of the computer could allow it to become a universal construction material for
    learners to design and build objects. Rather than turning computers into teaching
    machines, children themselves would become programmers of the machine. This unexpected
    and bold proposal was driven by the belief that learning is'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'constructed in the mind and heart and is connected to experiences in the world.
    Connected learning examines how the computer should be thought of as a tool for
    knowledge transformation, personal expression, and social relevance so that it
    allows learners to create and connect with others.


    “Papert viewed learning as the process of creating artifacts of personal and social
    relevance, connecting old and new knowledge, and interacting with others.”² This
    description does not refer only to computers. Instead, it outlines the learning
    process and its conditions, and places a primacy on artifacts, the objects or
    “gears” that we construct and the personal meaning that we assign to them. Some
    have argued that this view of learning is too mindextric, but it is equally sociocentric
    by including social relevance. The objects in our mind do not exist in isolation
    from our social worlds. In fact, they are closely grounded in and connected to
    the communities that we live in and the things that are valued by their members.
    In the 1980s, computers were still costly and available to only a few people.
    But digital media now are more affordable and portable and have moved into our
    daily lives. One of the objectives of this book is to examine how participation,
    collaboration, and computation can help young people learn and live in a digital
    world.


    In this chapter, we examine the personal, social, cultural, and tangible dimensions
    of connected learning and their meaning for the design of learning opportunities,
    technologies, and environments. Papert, like Jean Piaget, saw learning as building
    knowledge structures,³ but he added an important dimension: the artifacts of the
    mind have to move into the public world, where they can be examined, shared, and
    valued by others. In many ways, this view was prescient of the vast and distributed
    networks of digital objects and communities that comprise the Internet. It reflects
    the foundation for doing, thinking, and interacting—in short, learning—with any
    medium.


    The personal, social, cultural, and tangible dimensions of connected learning
    are as relevant today as they were thirty years ago. They provide a foundation
    for understanding learning in a computational culture that values participation
    in terms of both production and connectivity. One of the “evocative objects” (to
    use Sherry Turkle’s term)⁴ for thinking about these issues is the programming
    language Logo,⁵ which fueled many discussions about programming and computers
    in schools and putting children and not computers in charge of their learning.'
