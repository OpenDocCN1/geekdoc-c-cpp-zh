    Hirsch on the importance of community centers such as Boys and Girls Clubs, the
    2009 book edited by Yasmin Kafai, Kylie A. Peppler, and Robbin Chapman on the
    Computer Clubhouse network, and the 2014 book edited by Brigid Barron, Kim Gomez,
    Nicole Pinkard, and Crystle K. Martin on digital media afterschool centers and
