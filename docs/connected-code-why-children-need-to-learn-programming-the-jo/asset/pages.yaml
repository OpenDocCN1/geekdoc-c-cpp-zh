  md: 'researcher Lucy Calkins,^23 the Scratch Writers’ Workshop had a class of middle-school
    students compose and code their digital stories through a series of iterations.
    They drafted their ideas in a writer’s notebook, drew the stages of their narratives
    on storyboards, translated these pencil storyboards into Scratch, and used portfolios
    to capture their progress and share their ongoing work with peers. About 90 percent
    of the class completed narratives. The workshop illustrated the extent that such
    a structured model, as well existing English and language arts frameworks, could
    be leveraged to facilitate learning programming as a form of composition.^24


    Results were promising. Over 90 percent of students completed their own digital
    stories using Scratch, and the narratives utilized a wide range of language arts
    tropes (such as static and dynamic characterization) and programming features
    (such as loops). A number of participants developed plotlines that were based
    on short graphic novels that they had already composed in pencil and paper, giving
    them a better appreciation of the role played by the medium in directing a story’s
    structure (figure 3.3). All students were novice programmers who learned basic
    programming concepts in the storytelling workshop. But it also became clear that
    writing stories favors linear structures rather than the branching conditionals
    that are routinely part of gaming narratives. Engaging students in programming
    interactive stories is one of many curricular designs that connect to already
    existing classroom models. It also is a possible entrance point for beginners
    into computational thinking and participation. We will need to expand the parameters
    of the Scratch Writers’ Workshop to introduce a wider range of programming variables
    to offer further insights on the intersection of narrative and computational thinking
    in the classroom.


    This research suggests that stories can spur children’s interest in coding and
    that the Scratch Writers’ Workshop represents a way to demystify the coding process
    for students and teachers by presenting it as a series of practical and interrelated
    steps. Such a framework underscores the connection between coding and writing
    as interrelated processes of composition. Digital storytelling in Scratch—particularly
    the workshop’s focus on characterization and plot analysis—offers a new medium
    through which children can exercise the composition skills that they learn in
    traditional literacy classrooms and also be introduced to coding at an early age.


    Although storytelling and coding are integral to the model and serve the same
    end goal, the workshop introduced them separately. Computational'
