- pgno: 10
  md: '# # Series Foreword


    Digital media and networks have become embedded in our everyday lives and are
    part of how we engage in knowledge production, communication, and creative expression.
    Unlike the early years of computers and computer-based media, digital media are
    now commonplace and pervasive. Digital media have escaped the boundaries of professional
    and formal practice and the academic, governmental, and industry homes that initially
    fostered their development and have been taken up by diverse populations and noninstitutionalized
    practices, including the peer activities of youth. Although forms of technology
    uptake are diverse, a generation is growing up in an era when digital media are
    part of the taken-for-granted social and cultural fabric of learning, play, and
    social communication.


    This book series is founded on the working hypothesis that those immersed in new
    digital tools and networks are engaged in an unprecedented exploration of language,
    games, social interaction, problem solving, and self-directed activity that leads
    to diverse forms of learning. These diverse forms of learning are reflected in
    expressions of identity, independence, and creativity and an ability to learn,
    exercise judgment, and think systematically.


    The defining frame for this series is not a particular theoretical or disciplinary
    approach or a fixed set of topics. Rather, the series revolves around a constellation
    of topics investigated from multiple disciplinary and practical frames. The series
    looks at the relation between youth, learning, and digital media, but each contribution
    to the series might deal with only a subset of this constellation. Erecting strict
    topical boundaries would exclude some of the most important work in the field.
    For example, restricting the content of the series only to people of a certain
    age would mean artificially reifying an age boundary when the phenomenon demands
    otherwise. This would'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'become particularly problematic with new forms of online participation where
    one important outcome is the mixing of participants of different ages. The same
    goes for digital media, which are increasingly inseparable from analog and earlier
    media forms.


    The series responds to changes in our media ecology that have important implications
    for learning and that involve new forms of media literacy and modes of media participation.
    Digital media are part of a convergence between interactive media (most notably
    gaming), online networks, and existing media forms. Navigating this media ecology
    involves literacies that are being defined through practice but require more scholarly
    scrutiny before they can be incorporated into educational initiatives. Media literacy
    involves ways of understanding, interpreting, and critiquing media and also the
    means for creative and social expression, online search and navigation, and a
    host of new technical skills. The potential gap in literacies and participation
    skills creates new challenges for educators who struggle to bridge media engagement
    inside and outside the classroom.


    The John D. and Catherine T. MacArthur Foundation Series on Digital Media and
    Learning, published by the MIT Press, aims to close these gaps and provide innovative
    ways of thinking about and using new forms of knowledge production, communication,
    and creative expression.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Foreword


    Mitchel Resnick


    I first met Seymour Papert more than thirty years ago. He was giving a talk at
    the West Coast Computer Faire, a free-spirited gathering of early personal-computer
    enthusiasts (in many ways, a forerunner of today’s Maker Faires). In his talk,
    Papert presented a vision of a world in which computers would become an integral
    part of children’s lives. He described how children would program computers to
    control robots, compose music, design games, develop simulations, and perform
    many other creative activities.


    At the time, it was a bold, audacious dream, viewed by many as wildly unrealistic.
    Personal computers had just become available, and few children had access to them.
    But over the past three decades, many aspects of Papert’s dream have become a
    reality. Millions of children around the world interact with computation in a
    wide variety of forms—electronic toys, mobile phones, game machines, laptops,
    and tablets. And they use computational devices to engage in a diverse range of
    activities, such as playing games, chatting with friends, exploring virtual worlds,
    and searching for information online.


    At the same time, important elements of Papert’s dream remain unfulfilled. Papert
    envisioned a world in which children would not only interact with premade computer
    applications but would design, create, and program with computational media—and,
    in the process, learn important problem-solving skills and project-design strategies.


    What happened to Papert’s dream? In the 1980s, there was initial enthusiasm for
    teaching computer programming (or coding) to children. Thousands of schools taught
    millions of students to code with Papert’s Logo programming language. But the
    enthusiasm did not last. In most schools, the computer became a machine for delivering
    and accessing information.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'not a machine for making and creating. Most educators came to see com-\nputer
    programming as a narrow, technical activity that was appropriate for\nonly a small
    segment of the population.


    In *Connected Code: Why Children Need to Learn Programming*, Yasmin B.\nKafai
    and Quinn Burke document the revival of Papert’s dream. In the past\nfew years,
    coding has suddenly become fashionable again, with numerous\nwebsites and organizations
    encouraging and supporting people to learn to\ncode. My Lifelong Kindergarten
    research group at the MIT Media Lab has\nactively contributed to this trend, developing
    the Scratch programming\nlanguage and online community to enable young people
    to program and\nshare interactive stories and games, and collaborating with the
    Lego Com-\npany on the development of programmable robotics kits.


    Kafai and Burke help put this coding revival in context. Although many\npeople
    have focused on the job and career opportunities associated with\ncomputer programming
    (and those opportunities are indeed considerable),\nKafai and Burke recognize
    that the appeal of coding goes beyond financial\nand economic motives. They situate
    the coding revival as part of the larger\nmaker movement. I like to think of the
    coding revival as the coder move-\nment. While the maker movement focuses on new
    ways for people to build,\ncreate, personalize, and customize physical things,
    the coder movement\ndoes the same for digital things. In both cases, the movements
    are catalyzed\nby both technological and cultural trends, as new technologies
    make it eas-\nier and cheaper to make (and code) things, and a cultural shift
    toward do-\nit-yourself activities broadens the range of people who want to be
    involved.


    Perhaps the most important contribution of *Connected Code* is its intro-\nduction
    of computational participation as a guiding framework. In recent\nyears, many
    researchers have rallied around computational thinking as a\nframework and motivation
    for computer science education, arguing that\ncomputational concepts can serve
    as a foundation for understanding all\ntypes of processes and systems in the world.
    I recognize the power and\nvalue of computational ideas but worry that computational
    thinking is\noften interpreted too narrowly, focusing on how individual people
    learn\nand use computational concepts for solving problems. Kafai and Burke’s\nconception
    of computational participation serves as a broader, more inclu-\nsive framework
    for computer science education, expanding beyond indi-\nvidual problem solving
    to include personal expression, creative design, and\nsocial engagement. This
    shift, as Kafai and Burke note, has “implications'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'for how programming is learned, what is designed, and where and how it is shared.”


    The ideas and stories in *Connected Code* provide hope for those of us who have
    spent many years trying to turn Papert’s dream into a reality. We are heartened
    by the growing interest in the maker movement and coder movement. But we also
    recognize that these movements are in their infancies. New technologies for making
    and coding are spreading through society, but people’s mindsets are slower to
    change. Too many people still view computers simply as tools for delivering and
    accessing information. My hope is that *Connected Code* will contribute to a broader
    culture change in which people develop new ways of thinking about computation
    and new ways of thinking about learning.'
  merge: -1
  img_proc: true
