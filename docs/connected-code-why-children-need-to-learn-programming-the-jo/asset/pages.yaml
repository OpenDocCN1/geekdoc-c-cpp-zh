  md: 'to use a mouse to drag and drop “bricks” of code onto a digital canvas. With
    knowledge of how to use a computer’s mouse as the only prerequisite, children
    as young as eight years old were able to use Scratch to create their own programmable
    stories, games, and works of interactive art. Figure 1.3 shows such a creation—an
    encounter between an orange cartoon cat (Scratch’s iconic character, called an
    object or a “sprite” within the program) and a huge wave. The interactive project
    utilizes sound effects, animation, and multiple forms of input to help the cat
    ride the wave to completion. (When Sprite clicked) (as illustrated in the second
    caption of figure 1.3) allows the player to flip the cat while on the surfboard.
    To create this individual movement, the designer of the interactive project selected
    a total of four bricks from the right side of the Scratch interface and combined
    or “stacked” them together to form a script within the left side of the screen,
    which, after being clicked, makes the cat turn 360 degrees on the Scratch screen.


    Scratch has a rich library of programmable images or sprites, including the iconic
    Scratch cat figures. But the program’s design also allows users to import images
    from the Internet, thus building on what youth in Computer Clubhouses do on their
    own. This capacity to bring in external images and sounds makes Scratch adaptable
    to young users’ individual interests and helps them learn about the functionality
    of the program. For three years, Scratch was used and tested by a small group
    of Clubhouse members in Los Angeles and Boston who patiently worked with prototype
    after prototype, redoing their programs and providing us with instrumental feedback
    about what they liked to make and what was confusing.


    What became apparent from these early exploratory sessions was that Clubhouse
    members loved finding an audience for their creations and regularly traded seats
    at their computers so that they could view and sample each other’s work. Youth
    excitedly called out to each other across the room when they programmed a new
    feature or played their newly programmed games. It was clear that aside from readjusting
    the programming language, we needed to work on supporting collaboration and sharing
