  md: 'was not achieved by developing previously existing interpersonal ties because
    out of the team''s eighteen members, only the two founders knew each other beforehand.
    Their connection was made by leveraging the power of common interests and a shared
    tool. To become a member of Green Bear Productions, Scratch users “applied” to
    the company. This usually meant that they sent the founding members an online
    message expressing interest and offered an URL to their previous work at the Scratch
    website to demonstrate their prowess in using graphics, plotting a storyline,
    or developing coding scripts for gameplay (figure 4.2).


    If accepted, Scratchers became full members of a democracy and could volunteer
    game ideas, which the rest of the production team voted on before reaching a final
    decision. After a project was selected, the team assigned roles and arranged a
    production schedule. The founders encouraged users to follow a game to its completion
    before starting any additional projects. All of Green Bear''s games entailed alpha
    and multiple beta versions before a final, glitch-free version was produced and
    released on the website.


    Green Bear Productions Company was the one of the first teams to call itself a
    production company within Scratch, embodying the open-source community spirit
    with very young users. Computer scientists Kurt Luther and Amy Bruckman, who have
    studied online creative communities that make interactive digital media, note
    that when collaborations succeed, they produce content that supersedes what any
    single member could have accomplished on their own.³⁶ The problem, they point
    out, is that these collaborations disband more often than they succeed. This makes
    the success of Green Bear Productions even more surprising, especially because
    young people and not adults drove this enterprise.


