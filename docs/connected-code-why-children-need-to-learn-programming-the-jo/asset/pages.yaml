- pgno: 159
  md: 'and where learners can become the active, constructing architects of their
    own learning” (Papert 1993b, 122). A wide range of microworlds in mathematics
    and science has been developed since then, and not all of them are Logo-based
    environments. For more examples of microworlds and further developments see A.
    diSessa (2000), L. Edwards (1998), and Richard Noss and Celia Hoyles (1996).


    7. These claims did not remain uncontested. Much has been written about the success
    or failure of Logo in schools, but it is worth providing some background to the
    debate. In an excellent analysis of the historical context in the United States
    and in Europe, Richard Noss and Celia Hoyles (1996) identify some of the cultural
    forces at play that led critics to ask certain questions about Logo and other
    options. In many schools, questions about Logo’s learning benefits focused on
    the transfer of problem-solving skills and not on the benefits of learning mathematics
    and pedagogical reform ideas. Several smaller studies conducted by Roy Pea and
    Midian Kurland (1984) are often referenced as evidence that Logo programming did
    not produce any transferable effects. These studies neglected aspects of learning
    such as length of time spent learning programming and the types of programs created.
    These features have now been recognized as being instrumental in designing successful
    programming instruction (Paolumbo 1990) and are discussed in more detail in chapter
    3. In addition, teachers often adopted Logo but not the pedagogical innovations,
    and when they did adopt the innovations, many did not receive widespread institutional
    support in their schools. Many institutional forces shape the use and success
    of Logo in schools, but the pedagogical ideas about learning and teaching were
    often the least acknowledged.


    8. For more detail on the role that is played by informal knowledge in learning,
    see J. Bransford, A. Brown, and R. Cocking (2000); for the role played by cultural
    knowledge, see N. Gonzáles, L. Moll, and C. Amanti (2005); and for the need to
