- pgno: 66
  md: 'game, downloaded sample avatars from Internet fan sites, and refined each frame
    of the movement in the Paint Editor for smooth stop-action animation. With the
    visual programming capabilities of Scratch, Jorge animated these images to respond
    to keystrokes so that the avatar walks effortlessly across the screen or jumps
    when prompted by control keys.


    These shifts from creating visual designs to programming animations illustrate
    Jorge''s pathway into computationals for when the avatar is told to do something
    (such as shoot) while crouching or jumping. Using Scratch helped Jorge understand
    how games are made by professional production specialists, he also networked with
    other fans of the original game, who, like himself, wanted to play and create
    amateur spin-off productions as part of the do-it-yourself culture.


    Just like Debbie''s instructional fraction software, Jorge''s “Metal Slug Hell
    Zone X” game software illustrated personal connections to artistic and technical
    domains. It also illustrated the importance of social connections in the days
    before Web 2.0. For Debbie, these were located with her classmates and the third-graders
    of Project Headlight, and for Jorge, they were located with the local Computer
    Clubhouse community (which provided an appreciative and supportive audience) and
    with online fan player and gaming communities. Unlike Debbie''s software, which
    was part of a classroom project, Jorge''s design of the video game was self-initiated
    by Jorge. He remade a game that he enjoyed playing and then added his own interpretations,
    not straying too far from the original while still adding his own twists. It is
    not unusual for players to design their own games. In fact, many Project Headlight
    students confessed that they would prefer to program a fraction game than fraction
    software.


    Today character and level editors are available with many games, allowing players
    to add new features and thus extend the playability of games, but in the 1980s
    and 1990s, when game companies kept close tabs on the content and design of video
    games, these features were virtually unheard of. These amateur efforts all share
    the spirit of self-produced and originated projects.⁵⁰ Most DIY efforts take place
    within the context of informal, lunchtime computer clubs rather than traditional
    classrooms, and DIY efforts are'
