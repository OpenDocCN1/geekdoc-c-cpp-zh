  md: 'central role in this process. Papert coined the term “objects-to-think-with”
    for objects in the physical and digital world (such as programs, robots, and games)
    that can become objects in the mind for constructing, examining, and revising
    connections between old and new knowledge (more about this in chapter 3). “Objects-to-think-with”
    (such as the Logo turtle) are particularly effective at supporting appropriation
    because they facilitate the learners’ identification with the object. By designing
    a program or game (or its procedures, algorithms, and data structures), the personal
    knowledge becomes public and can then be shared with others.


    Thinking about programs as personal objects that can be shared publicly is also
    occurring in Internet culture, which amasses personal items (such as photos, stories,
    and designs), introduces them in a massively wide public sphere, and allows them
    to take on entirely new meanings. In this context, computational thinking becomes
    computational participation because when code is created, it has both personal
    value and value for sharing with others. The “objects-to-think-with” in code are
    not just relegated to the mind but also are shared with others, thus adding social
    and cultural dimensions to the personal.


    # ### Social Dimensions


    Learning is a social process, whether it occurs face to face or in the networked
    commons. Education researchers Jean Lave and Etienne Wenger’s seminal 1991 work
    on apprenticeship learning stresses the communal nature of learning that often
    is missing in the focus on individual work that is characteristic of traditional
    schooling. More recently, gaming researcher Jim Gee has identified the importance
    of affinity cultures that are formed in gaming communities and the ways that this
    alternative learning environment offers an important lens by which to reevaluate
    schooling. In all learning communities, effective participation requires learners
    to search out, organize, and distribute responsibilities by collaborating with
    others as they engage in activities or create artifacts together. The collaborative
    agency that is required of learners emphasizes the active role that learners take
    in constructing community that builds knowledge and also designs artifacts that
    can be shared with others. 10 The proverbial “objects-to-think-with” become “objects-to-share-with,”
    representing products and ethos of collaboration and learning in the communities.'
