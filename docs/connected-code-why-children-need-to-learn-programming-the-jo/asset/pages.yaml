    +   4. See Jim Darby and James Catterall (1994), who argue for the arts (aRts)
    as the fourth R. See also Cathy Davidson''s 2012 blog post, "Why We Need a Fourth
    R: Reading, wRiting, aRithmetic, alGorithms," at http://dmlcentral.net/blog/cathy-davidson/why-we-need-4th-r-reading-writing-arithmetic-algorithms.

    +   5. In her 2007 and 2012 books, Marina Bers provides many examples of designing
    and learning in early childhood and younger grades. The programming tools Daisy
    the Dinosaur, Hopscotch, and Move the Turtle are available at the iTunes App store.
    The development of Scratch Jr. is funded by a National Science Foundation grant
    to Mitchel Resnick''s MIT team and Marina Bers.

    +   6. The design and development of the Quest to Learn school is described in
    a 2010 report by Katie Salen, R. Torres, L. Wolozin, R. Rufo-Teper, and A. Shapiro.
