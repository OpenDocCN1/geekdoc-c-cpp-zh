  md: 'minorities. In academic year 2008–2009, 7,800 teams participated in the FIRST
    Lego League robotics competition, and 70 percent of youth participants were boys
    and white. This finding seems to reflect the equally marginal participation of
    girls and underrepresented groups in science fairs, especially in physical, earth,
    and math or computer science projects.<sup>12</sup> In addition, robotics teams
    are limited to how many students can participate, so the activities do not easily
    scale up. Paying for materials and for travel to robotics competitions is expensive,
    often requiring schools to conduct extensive fundraising events to finance afterschool
    robotics programs and participation in out-of-state competitions.


    Finally, the competitions are an audience for the learning project. Although building
    robots in response to specific design challenges is a rich learning and collaboration
    experience,<sup>13</sup> the winner-takes-it-all approach that is promoted in
    competitions might not appeal to some people. Competitions provide an authentic
    and rewarding audience, but judging by the growing number of online competitions,
    they seem to have become the default audience for all digital media designs judging.
    The STEM National Video Game Design Challenge and dozens of others have become
    the central outlet for game designs in schools.<sup>14</sup> Although competitions
    provide a valuable audience, they cannot and should not be the only outlet that
    can engage youth in computational participation, especially if we know about their
    rather limited track record in reaching out and broadening participation.


    Many afterschool programs and community technology centers and organizations have
    done the job that K–12 schools have failed to do in terms of introducing the creative
    power of computing. But too many of these clubhouses fail to broaden participation
    in the discipline and instead mirror the geek clubs that many see as the face
    of computing. What if organizations created new clubhouses with different materials
    and activities rather than aim to bring everyone into the existing model? This
    is exactly the question that computer scientist Leah Buechley and others asked
    and answered when they set out to develop a new category of computational construction
    kits that involved textiles instead of bricks and crafting in addition to engineering.


    # Opening New Clubhouses: Electronic Textiles


    Textile construction kits, also called electronic textiles (e-textiles), are a
    fairly recent development. E-textiles are programmable garments, accessories,
    and'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'costumes that incorporate elements of embedded computing that allow the behavior
    of fabric artifacts to be controlled. Designing e-textiles can involve novel materials
    (such as conductive fibers or Velcro), sensors for light and sound, actuators
    (such as LEDs and speakers), and traditional aspects of textile crafts. One popular
    e-textile construction kit is LilyPad Arduino,15 which enables novice engineers
    and designers to embed electronic hardware into textiles (figure 6.3).


    To make an e-textile, designers sew LilyPad modules together with conductive thread
    and employ the popular Arduino or ModKit development environments to program the
    LilyPad microcontroller to manage sensor and output modules (like LEDs) in their
    designs. Since its commercial release in 2007, LilyPad Arduino has been widely
    adopted by designers and engineers of all ages from around the world and employed
    in a number of universities in computer science, engineering, fine arts, and design
    courses. E-textiles can be considered a part of a larger DIY movement to promote
    personalized fabrication outside of traditional manufacturing that can also extend
    into classrooms, as the following examples from an e-textile high school class
    illustrate (figure 6.4).


    What do people learn when they craft e-textile designs? Students learn about sewing
    and other types of crafting that often is found in vocational education or leisure
    time but usually not in the context of traditional school topics such as science
    and mathematics. In addition, students learn about engineering when they design
    functional circuits by connecting alligator clips to batteries, switches, and
    LEDs; align polar ends of LEDs; knotting thread ends; and sewing these to fabric.
    Students also learn how to program and remix Arduino code, which controls and
    executes the desired behaviors of sensors and actuators, thus providing a context
    for engaging with computational concepts and practices.16


    Leah Buechley, who invented the LilyPad Arduino, argues that such design learning
    makes transparent the different layers and connections of technology that are
    often hidden in the commercially available technologies that come in shiny cases
    and reveal little about their underlying


