- pgno: 129
  md: Cultivating understanding of technology on both conceptual and material levels
    is important for several reasons. On a general level, it promotes understanding
    of the basic functionalities that underlie the designs of interfaces, systems,
    and materials. These understandings also empower learners on a political level
    by providing them with resources to question the decisions and designs that are
    made by others. Finally, on a personal level, using and making technologies for
    expressive purposes help students to communicate better and build relationships.
    Learning how to work with materials at the intersection of programming and engineering
    is no small feat. The robotics courses are time intensive, learning with e-textiles
    requires many different skills, and teacher and mentor support in and out of class
    is essential to help make these tangibles become real and alive, which is the
    focus of the next chapter.
