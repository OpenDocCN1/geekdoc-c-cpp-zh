  md: 'activities. Thus, their opportunities to develop collaborative and coding skills
    and grow more independent were curtailed because the range of their activities
    was limited. Furthermore, participation in different teams also resulted in different
    understandings of roles in the projects. Experienced software designers addressed
    a much richer set of roles, involving planning, helping, teaching, and understanding
    younger students’ concerns and anxieties, and in the process they also engaged
    in computational participation.


    The findings from Caperton’s software design study and from Ching’s apprenticeship
    study illustrate that treating students as designers of instructional software
    applications leads them to feel more invested in their own learning. Both studies
    also demonstrate that creating specific subject-matter content, whether a fraction
    house or questions for scientific inquiry, helps students learn programming significantly
    better than learning code in abstraction does. The analysis of the fraction design
    project’s outcomes provided compelling evidence of the benefits for both learning
    fractions and learning programming, especially when compared to two other classes
    at the same school that had programming once a week or daily, but without the
    focus on creating instructional fraction software. In all these comparisons, fraction
    design projects students improved significantly in their programming knowledge
    skills and their conceptual and procedural understanding of fractions.


    The students’ instructional software designs illustrated personal choices in representations
    that students created for their learners. Most important, they showcased that
    designing software, rather than writing code alone, provided a richer and more
    productive context for learning programming and mathematics. Likewise, in Ching’s
    apprenticeship study, participating in an experienced software team raised the
    programming level and understanding of science for all team members. Having an
    experienced peer available on demand improved programming skills, affected the
    design of science simulations, and influenced what students learned. But to what
    extent does this apply to other real-world applications outside school? Caperton’s
    research and Ching’s study incorporated programming with mathematics and science,
    subjects that have traditionally aligned with and have been associated with coding.
    Can programming be integrated with other academic topics and contexts as well?
    In this next section, we examine how this shift—from learning to program abstract
    code to finding real-world applications—has occurred in the development of digital
    stories and video game designs.'
