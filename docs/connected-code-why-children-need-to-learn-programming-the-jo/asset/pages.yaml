  md: '# ## Programming Tools, Programming Worlds


    Logo was not the first and only programming language used by children. The programming
    languages Basic and later Pascal were equally prominent in many schools, and there
    was considerable debate about which programming language was best for schools.
    But in contrast to Basic and many other programming languages, Logo promised to
    offer more than just learning about programming: it taught mathematics, cybernetics,
    and science in new ways and also provided a pedagogy. These additions made Logo
    unlike any other programming language and became the precursor to Scratch.


    In the late 1960s and early 1970s, most young programmers were writing program
    text by manipulating arrays of numbers or symbols. But in Logo, they wrote programs
    by moving a graphical object, called the “turtle,” on the screen. Programming
    in Logo meant programming the turtle (figure 2.1). For instance, a programmer
    gave commands for the turtle to “move forward 10 steps and then turn 90 degrees
    to the right,” which in Logo


    ![](img/9eb64eca0f040452d3ba8df0d78b35a9_40_0.png)


    **Figure 2.1** Screenshots for code written in Logo (top) and in Scratch (bottom).
    The Logo screenshot shows a turtle that is in a starting position and ready to
    be programmed in Logo. In the middle screen, the turtle has been programmed to
    execute the following steps: PEN DOWN FORWARD RIGHT TURN 90. The right screenshot
    shows a square that has been drawn by having the turtle repeat the commands four
    times or REPEAT 4 [FORWARD 90 RIGHT TURN 90]. The panel below shows individual
    Scratch programming blocks on the left, which are then combined and activated
    in the middle, resulting in the cat''s movement on the Scratch stage at the right.'
