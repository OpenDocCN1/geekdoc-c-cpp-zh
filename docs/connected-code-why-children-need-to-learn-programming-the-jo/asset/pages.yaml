- pgno: 58
  md: '# Game Design Studios and Writing Workshops in Schools


    Although instructional software (like the fraction software) is grounded in school
    culture, whether it is purchased in the form of commercial software or designed
    by the students themselves, entertainment media (like videogames) often has not
    entered the classroom, and only recently has it become part of discussions about
    productive learning environments.<sup>17</sup> The idea of having children become
    game designers seemed far removed from what children could and should program.
    But video games are taking a prominent place in children''s play, particularly
    boys'' play. The number of hours spent in front of these screens continues to
    grow, as does its quality. Psychologists, sociologists, and parents are struck
    by a quality of engagement with video games that contrasts with children''s apathy
    in watching television programs and doing school homework.


    So the idea of extending instructional software design into game design does not
    seem far-fetched. In fact, it follows the same line of thinking that made instructional
    software into instructional software design for learning. Likewise, making games
    for learning instead of playing games for learning became the premise for the
    first study that looked at students as game programmers.<sup>17</sup> In a continuation
    of the instructional fraction design project, Yasmin Kafai asked a class of ten-year-old
    children to design and program their own educational fraction games. The students
    met every day for three months to design educational games by creating their own
    characters, story lines, game themes, and interactions (figure 3.2). Most of the
    discussion about this work has focused on the observed gender differences in the
    design of the games, most likely because these findings aligned well with then-popular
    discourse about gender differences in interest and performance in technology.<sup>18</sup>


    Boys and girls did approach and realize their game designs differently. Most of
    the boys'' games featured fantasy contexts with many characters and violent feedback,
    and the girls'' games had fewer characters and no punishments for wrong answers.
    Most boys, for example, created adventure hunts and explorations, whereas the
    girls'' games were divided among adventure, skill/sport, and teaching. In their
    choices of game themes and their programming of animation and interactions, the
    boys and girls offered a glimpse into what they found appealing and unappealing
    in the digital games and stories that they experience through other media. Making'
