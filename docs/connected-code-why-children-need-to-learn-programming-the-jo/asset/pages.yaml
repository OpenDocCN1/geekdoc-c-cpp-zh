  md: 'Laboratory Schools, which Dewey founded at the turn of the twentieth century,
    set them apart from most U.S. classrooms, then and now. There were no desks, and
    the blackboard (if there was a blackboard) was not the featured wall piece. Students
    worked at tables facing each other rather than the instructor, and they worked
    with their hands, not just using pencils and paper but handling actual objects.
    Engaging in activities that produced content and meaning beyond the classroom—whether
    boiling an egg or building a wooden box—was an imperative in Dewey’s educational
    philosophy of Progressivism. “If the impulse is exercised, utilized,” he writes
    in *The School and Society*, “it runs up against the actual world of hard conditions
    to which it must accommodate itself; and there again come in the factors of discipline
    and knowledge.”²³


    For Dewey, the learning activities that schools promote must be applicable and
    testable in the worlds that children occupy outside of the classroom. Teaching
    must connect the classroom to the real world. To accomplish this, Dewey points,
    structure—not the lack of structure—underpins his approach to teaching. Dewey’s
    notion of creating situations and providing materials resonates with Papert’s
    view that saw “teaching without curriculum does not mean spontaneous, free-form
    classrooms or simply ‘leaving the child alone.’ It means supporting children as
    they build their own intellectual structures with materials drawn from the surrounding
    culture. In this model, educational intervention means changing the culture, planning
    new constructive elements in it, and eliminating noxious ones.”²⁴ For Papert,
    the computer provided the materials, situations, and experiences that allow learners
    to connect to the real world.


    For Dewey, experience cannot be simply any experience, and equally, technology
    cannot be used as an end in itself. “By its nature,” Dewey writes in *Experience
    and Nature*, “technology is concerned with things and acts in their instrumentalities,
    not in their immediacies.”²⁵ “It cannot be assumed that simply having devices
    in the classroom is enough for children to comprehend their full potential. Dewey
    also points out that schools nevertheless have an obligation to address the latest
    technologies. ‘Technology is modifying, even revolutionizing conduct and belief
    outside the school,’ he writes (with J. L. Childs) in 1933: “It is our conviction,
    accordingly, that ... the social and educational theories and conceptions must
    be developed with definite reference to the needs and issues which mark and divide
    our domestic, economic, and political life in the generation of which we are'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'part.^n26 Schools, Dewey asserts, have a responsibility for developing a child''s
    literacy in terms of reading, writing, and mass media. "The public that is literate
    in use of linguistic tools," he writes of the growing presence of mass media,
    "but which is not educated in social information and understanding becomes a ready
    victim of those who use, for their own private economic and political ends, the
    public press."^n27


    Dewey''s warning here is prescient of Douglas Rushkoff''s own extended warning
    in *Program or Be Programmed: Ten Commands for a Digital Age* regarding the limitations
    of participation in the digital publics of Web 2.0 media.^n28 Dewey is referring
    to newspaper moguls like William Randolph Hearst and not social media sites like
    Facebook, but the message is clear: a technical understanding of the tool is not
    enough. People need to understand the contexts in which the tool operates and
    the contexts that it produces. This represents the essential learning, and such
    learning requires meaningful experience. Computationals for formative, summative,
    or diagnostic results. As a tool, the computer amplifies communication, such as
    when Microsoft PowerPoint is used to facilitate a presentation. Finally, as a
    tutee, the computer serves as the learner by taking directions from the student
    to determine its function and output.'
