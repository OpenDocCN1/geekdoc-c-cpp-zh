    of all projects at the website are remixes of previous projects.⁷ Similar percentages
    of remixes have been reported on other youth-oriented programming sites, such
    as Kodu Game Lab and Studio Sketchpad.⁸ To remix at Scratch is a simple process.
    When Scratchers open a project at the website and “look inside” at the underlying
