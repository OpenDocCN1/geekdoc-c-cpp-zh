  md: 'why few women were working in computer science. Margolis and Fisher studied
    middle and high schools that prepared students in computer science and interviewed
    female student applicants, asking them what initially drew them to the discipline,
    what helped them persevere, and what made them leave computer science. They found
    what they termed “a geek” culture that was often inaccessible and unwelcoming
    to newcomers who were not familiar with programming skills and knowledge.


    Then they set out to change the culture of the computer science department because
    they realized that just bringing in students was not enough. They needed to create
    new curricula and pathways into computing and foster a mentoring community within
    the field at large. To “open the clubhouse,” they needed to target the K–12 pipeline,
    which became the focus of Jane Margolis and colleagues’ next book, *Stuck in the
    Shallow End: Education, Race, and Computing*, which examined the long history
    of racial discrepancy and bias in schooling and computing. What initially was
    an issue of a lack of women in computing expanded to an issue of a lack of people
    from minority and then lower-income groups, addressing equity issues in computing
    on an increasingly widening scale.


    The near total lack of computational participation in any introductory technology-based
    coursework means that few students consider computer science principles or even
    encounter computer science at any point in their K–12 educations. Although there
    are over 42,000 high schools in the United States, only 2,100 offer an Advanced
    Placement computer science course.<sup>12</sup> In fact, the number of introductory
    computer science courses has decreased by 17 percent since 2005. Such a drop is
    inexcusable given the U.S. Bureau of Labor Statistics’ consistent listing of computer
    science jobs as one of the fastest growing professions in the country, with over
    4 million new positions expected to be available by 2020.<sup>15</sup> Gender
    and racial disparity in the computer science field represents another significant
    hurdle. Although women make up 56 percent of all Advanced Placement test takers,
    only 21 percent of those who took the AP computer science exam in 2011 were female.
    The national total of African American computer science test takers that same
    year was twenty-nine (less than 1 percent).


    Participation in computing is more than just having access; it also involves the
    quality of what a child actually does with the computer. This issue extends beyond
    gender, racial, and socioeconomic equity. Even many schools in high-income communities
    remain entirely on the receiving end'
