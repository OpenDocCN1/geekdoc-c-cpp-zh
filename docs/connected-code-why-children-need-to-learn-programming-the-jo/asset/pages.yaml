  md: 'The original Computer Clubhouse became so successful that more clubhouses were
    set up in Boston and, with support from Intel Corporation, spread to other cities
    and countries. All the Computer Clubhouses provide youth with a variety of software,
    including programming software (such as Microworlds Logo), Microsoft Office, Bryce
    5, Painter 7, RPG Maker™, and video, photography, and sound editing software.
    Although an active design culture is present in all Computer Clubhouses, programming
    initially was present in only few of them and was a rather marginal activity compared
    to the vibrant Photoshop culture.⁴⁷ Scratch was designed as a media production
    tool so that young people in Computer Clubhouses could program their own applications
    for games, digital stories, simulations, interactive art, dance videos, or other
    genres of work that they already loved to do.


    How and why youth moved from being users of software packages to being Scratch
    designers of digital media applications illustrates programming’s motivational
    appeal. When the first version of Scratch was introduced in a Computer Clubhouse
    in Los Angeles and loaded on several of the computers in fall 2004, few members
    created anything using the new software. But in winter 2005, a steady stream of
    undergraduate mentors joined the Clubhouse to help and learn programming themselves.
    A striking rise in Scratch activities occurred as youth members encouraged each
    other to try the program, and mentors worked with youth to create their first
    Scratch projects. Mentors often engaged youth who had never worked in Scratch
    before by asking them to import some of the hundreds of screenshots and graphics
    files that they had stored in their folders on the Clubhouse server. At that point,
    youth projects on the server represented mostly graphics-only projects. But within
    a few months of the introduction of Scratch, printouts of Scratch screen designs
    began to cover the walls of the Clubhouse, and it became the leading design activity.


    By winter 2006, interest in Scratch had grown, and new things were happening within
    the Clubhouse culture. Scratch became a measure of membership in the local Clubhouse
    culture, and creating and storing Scratch projects on the central server for others
    to play moved the previously rare and isolated programming activity into a communal
    affair. Also, groups of youth began working collaboratively together to create
    projects, and they created flashy team names, such as “DGNM,” for the “Dang Good
    Money Makers.” Education researcher Kylie Peppler observed how young people began
    to work independently of mentoring support on the complex'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'projects and problems that they encountered in Scratch. Youth were seen mentoring
    other youth in Scratch, and some emerged as general experts that mentors, coordinators,
    and other youth consulted for help. Others specialized in certain genres or tricks
    within Scratch, and they too were called on by their peers and mentors.²⁸


    A compelling example of videogame design is “Metal Slug Hell Zone X.” It was created
    by a fifteen-year-old Latino designer named Jorge, who modeled the piece after
    a popular videogame with a similar title.²⁹ The original Metal Slug game is a
    futuristic “run and gun videogame” that is known for its humor, fluid hand-drawn
    animation, and fast-paced, two-player action. Jorge brought his passion and experience
    in video gaming to the Clubhouse, where he spent most of his working on Scratch
    projects that involved recreations of video games. “Metal Slug Hell Zone X” was
    his second project, and it incorporated many well-known features from the original
    video game but also added new and unexpected features. The start of the video
    game was fairly traditional. A title screen listed four avatars that players could
    choose by pressing a button. The game began with a barren purple desert landscape
    and moving clouds. Players could use arrow keys to have their selected avatar
    move forward or backward, crouch, jump, and fire a gun. As shown by the opening
    sequence, avatar choices, background scrolling, and action items, Jorge used his
    prior knowledge of the Metal Slug games and interests in video gaming to forge
    connections to Scratch while making his video game.


    “Metal Slug Hell Zone X” took several months to design, and it incorporated complex
    technical features that could be considered illustrative of computational thinking.
    Jorge discovered how to create a side-scrolling game and complicated types of
    animation by using difficult programming concepts, including variables, loops,
    conditional statements, communication and synchronization commands (such as broadcast
    and when-receive), and Boolean logic. Designing the game motivated Jorge’s engagement
    with programming. He learned how to design for interactive play and redesigned
    his program several times, discovering that it can be friendlier to the user to
    design a game that responds to standard key strokes (such as right and left arrow
    keys) rather than random characters on the keyboard. In addition, he used a full
    suite of creative software and not just programming software. Using the Scratch
    Paint Editor (an image editor), Jorge realistically animated the avatar as it
    moved. He made sketches based on playing the original video'
