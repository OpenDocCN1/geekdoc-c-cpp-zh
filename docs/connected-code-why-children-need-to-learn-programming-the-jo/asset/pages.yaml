- pgno: 126
  md: 'to usability conventions such as adding scores, adding bad guys or distractors,
    and adding a way to win or end the game. Designing the touchpads also introduced
    material requirements that are absent from the world of computer screens. Some
    youths struggled to ensure that the alligator clips remained in their Play-Doh
    touch pads. For others, the Play-Doh controllers leaked moisture onto background
    paper, creating short circuits that required them to be maintained as separate
    pieces instead of one touch pad.


    Situating the game designs in an arcade rather than in a competition provided
    an attentive audience for the game designs and a rich learning experience. The
    arcade experience became a lesson in debugging and rapid prototyping as an array
    of challenges came up: alligator clips fell out of controllers, controller pieces
    fell to the ground, and participants realized that they needed to adjust their
    game by adding scores so that more people could play. Several designers made numerous
    small fixes to ensure the integrity of their controllers and added conductive
    bracelets and touch pads to make more obvious that players needed to touch the
    earth clip for the interfaces to function properly. They also gained some valuable
    insights about design and usability from seeing others play their game and make
    real-time adjustments. Using Play-Doh as a conductive material to make tangible
    game interfaces turned out to be a rich learning experience, much like working
    with conductive thread to make e-textiles.


    Creating audiences for displaying, testing, and enjoying the handmade and coded
    artifacts is an important dimension of constructionist learning and teaching.
    Computer scientists Mike Eisenberg and Sherry Hsi''s latest project, Math on a
    Sphere, presents yet another twist on computational participation (figure 6.7).
    This project uses large spherical displays that were developed by the National
    Oceanic and Atmospheric Administration and are used in many science centers to
    show graphics and animations. In a Logo-like programming environment, children
    can create their own designs as they learn about non-Euclidian geometry and coding.
