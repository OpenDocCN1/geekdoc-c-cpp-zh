  md: 'The social dimensions of connected learning have focused on communities because
    personal construction of programs happens not in a vacuum but in a social context.
    Papert''s research into Brazilian samba schools encapsulates his sense of social
    norms and interactions as being pivotal to any form of learning:


    > > These are not schools as we know them; they are social clubs with memberships
    that may range from a few hundred to many thousands. Each club owns a building,
    a place for dancing and getting together.… During the year each samba school chooses
    its theme for the next carnival, the stars are selected, the lyrics are written
    and rewritten, and the dance is choreographed and practiced. Members of the school
    range in age from children to grandparents and in ability from novice to professional.
    But they dance together and as they dance everyone is learning and teaching as
    well as dancing. Even the stars are there to learn their difficult parts.<sup>13</sup>


    Learning cultures can be neighborhood centers or even virtual worlds. The Intel
    Computer Clubhouse Network is an example of the former, with over a hundred locations
    worldwide where young people voluntarily gather to work with creative software
    applications to produce digital graphics, music, and videos. Unlike schools, the
    Computer Clubhouse does not follow a set curriculum, and members introduce each
    other to new activities with the support of coordinators and mentors. These ideas
    have also provided blueprints for virtual communities such as MOOSE Crossing,
    which allowed members program and share their virtual creations (more about this
    in chapter 4), and ClubZora, which facilitated discussions around values. Today''s
    examples include virtual environments such as the Scratch community (with 1 million
    projects and hundreds of thousands of users) and the animation website Newgrounds
    (with a community of over 2 million members who have developed and shared over
    500,000 Flash-based animations and video games). In all of these examples—Brazil''s
    scattered samba schools, the network of Computer Clubhouses, and virtual communities—is
    a rich set of interactions between community members, developed from the ground
    up and governed through mutual interests and shared values.<sup>12</sup> Computational
    participation in this context is as much about socializing as it is about contributing
    in terms of valued artifacts, expertise, and feedback.


    # ## Cultural Dimensions


    Connected learning also focuses on the cultural dimensions of learning—the politics
    that determine how particular ways of knowing, viewing, or'
