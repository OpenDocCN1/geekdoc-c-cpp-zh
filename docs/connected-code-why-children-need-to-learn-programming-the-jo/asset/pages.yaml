  md: 'of the future of children’s learning in and out of schools. The first part
    of the chapter examines this shift away from programming tools and toward programming
    communities and the ways that making coding accessible has inspired youth to code
    collaboratively. The second part of the chapter examines two such online collaborations
    from the Scratch website, exploring their origins and projects. The final part
    of the chapter explores ways that these types of collaborations can be furthered
    both in and out of schools. Can environments for such peer-supported collaborative
    learning be engineered, and what evidence do we have of successes and failures
    in this area?


    # Making Coding More Accessible: The Rise of the Tool


    Over the past twenty years, most efforts to facilitate teaching and learning programming
    have focused less on facilitating collaboration and more on designing more intuitive
    and supportive programming tools. When Papert introduced Logo as a tool to make
    programming more intuitive and sociable for children, he unwittingly launched
    a veritable cottage industry of introductory programming languages based on his
    model. Nearly two hundred different variations of Logo have emerged so far with
    more still in development—including variants like Cricket Logo (which applies
    the Logo language to programmable hand-held robotic toys), Terrapin Logo (which
    allows the inclusion of multivoice music), and Logo3D (which adds an entirely
    new dimension to the original two-dimensional output).⁶ Other introductory programming
    languages shared Logo’s goal to make programming more accessible and intuitive
    to young users. This included computer pioneer Alan Kay’s Smalltalk and later
    developments Squeak and eToys, whose programming environment allowed users to
    create programs and also examine and modify the tool itself.⁷ Science educator
    Andrea diSessa’s Boxer programming language built on the Logo model but introduced
    clickable “boxes” as the site of programming commands, shifting code from a series
    of typed lines to a number of juxtaposed and interrelated coded boxes.⁸ Computer
    scientist Mark Guzdial promoted embedded graphical scaffolds in Emile, a programming
    environment that helped beginners to grasp coding concepts via a concrete, step-by-step
    approach. Such hands-on graphical illustration is often necessary for beginning
    programmers, Guzdial points out, because they need tools that make code less'
