  \ 通过使用并发模型效率最高。\n\n### 结论\n\n在本章中，我们学习了 Rust 外部函数接口（FFI）的实际用法，让我们能够为玩具语言 Mufi 构建标准库。虽然库很小，但它可以扩展到大得多，将\
  \ Rust 集成到项目中的步骤可以转化为如何将 Rust 添加到现有的 C 项目中。\n\n### 关键事实\n\n- 为项目创建绑定，建议使用 `cc` 和\
  \ `bindgen` crate（库）。\n- 为了让可执行文件找到动态库，必须使用 `export LD_LIBRARY_PATH` 并将其赋值为库所在的路径。\n\
  - 在构建集成 Rust 和 C 的项目时，建议使用 `Makefile` 或用于跨平台开发的 `CMake`，因为有助于减少工作。\n- 要读取可变原始指针，使用函数\
  \ `std::ptr::read()`。\n    - 要偏移指针，使用方法 `add()`，其值为你想要偏移的量。\n\n### 练习题\n\n1. `mufi_stdlib`\
  \ 库包含许多重复代码和可以避免的克隆操作。最好的方法是通过添加辅助函数 `check_argcount_error()` 和 `check_type_error()`\
  \ 来简化函数。\n2. 编写一个安装脚本，允许用户以 `debug` 或 `release` 模式安装 Mufi-Lang（**注意**：任何模式都应该以 release\
  \ 模式构建 `mufi_stdlib`）。\n\n### 答案\n\n1. 我们的辅助函数 `check_argcount_error()` 和 `check_type_error()`\
  \ 的目标是在预期不符时返回一个 `bool`。我们必须在函数内部内部返回 `nil_val()`，不像 `error()` 那样替我们完成这一点。然而，我们也可以选择编写一个宏来减少代码行。\n\
  \n    虽然我们在第 9 章，元编程中讨论过宏最好在函数可以完成任务时使用，但我们将为我们的辅助函数配备自己的宏以减少重复。\n\n    我们可以进入 `mufi_stdlib/src/helper.rs`，在那里开始编写第一个辅助函数\
  \ `check_argument_error()`。在这个函数中，我们将有三个参数：`arg_count` 是函数给出的参数计数，`expected` 是预期的参数，`name`\
  \ 是函数的名称。\n\n```\npub fn check_argcount_error(arg_count: i32, expected: i32, name:\
  \ &str) -> bool{\n    if arg_count != expected{\n        eprintln!(\"ERROR: {name}\
  \ expects {expected} arguments,\n        got {arg_count} instead.\");\n        true\n\
  \    } else{\n        false\n    }\n}\n```\n\n\n\n在我们处理下一个辅助函数 `check_type_error()`\
  \ 之前，我们需要编写一个函数将我们的 `ValueType` 转换为 `String`。如果我们想报告类型错误，我们不能直接打印整数（`ValueType`\
  \ 实际上是整数），因此，我们首先要编写一个函数 `type_to_str()`，它接收一个 `ValueType` 并返回 `String`。该函数非常简单，使用\
  \ `match` 语句来检查每个 `ValueType` 并返回相应的字符串。\n\n**注意：由于 `ValueType` 是一个 `u32`，我们需要使用穷举模式匹配，该模式专门用于处理\
  \ nil 类型。**\n\n```rust\nunsafe fn type_to_str(ty: ValueType) -> String{\nmatch ty{\n\
  \    ValueType_VAL_BOOL => \"bool\".to_owned(),\n    ValueType_VAL_DOUBLE => \"\
  double\".to_owned(),\n    ValueType_VAL_INT => \"int\".to_owned(),\n    ValueType_VAL_OBJ\
  \ => \"string\".to_owned(),\n    _ => \"nil\".to_owned()\n}\n}\n```\n\n现在，我们可以编写返回\
  \ `bool` 并包含三个不同参数的函数 `check_type_error()`。第一个参数是 `value`，它借用了我们要检查的 `Value`；第二个参数是\
  \ `expected_type`，将其与值的类型进行比较；第三个参数是 `name`，它是函数的名称：\n\n```rust\npub unsafe fn check_type_error(value:\
  \ &Value, expected_type: &str, name: &str) -> bool{\n```\n\n为了以 `String` 形式获取值的类型，我们将使用函数\
  \ `type_to_str()` 配合 `val.type_`。然后我们可以使用 `if/else` 语句来检查值的类型是否不等于 `expected_type`，如果不相等，我们就打印错误并返回\
  \ `true`。如果相等，则返回 `false`：\n\n```rust\nlet ty = type_to_str(value.type_);\nif ty\
  \ != expected_type{\n    eprintln!(\"ERROR: {name} expected a {expected_type}, got\
  \ {ty} instead.\");\n    true\n} else{\n    false\n}\n}\n```\n\n如果需要不断重写许多个较小的 `if/else`\
  \ 语句将非常麻烦。为了尝试实现**不要重复自己**（**DRY**）的代码，我们将使用我们的好朋友：声明式宏。\n\n复习一下，为了使宏公开，我们需要在 `macro_rules!`\
  \ 声明上方使用属性 `macro_export`。宏的名称将与我们相应的辅助函数相同，即 `check_argcount_error` 和 `check_type_error`，并且它们包含相同的参数。然而，这些参数的类型是\
  \ `expr`。内部是一个简单的 `if` 语句，如果函数结果为 `true`，它将返回 `nil_val()`，如下所示：\n\n```rust\n#[macro_export]\n\
  macro_rules! check_argcount_error {\n    ($arg_count: expr, $expected: expr, $name:\
  \ expr) => {\n        if check_argcount_error($arg_count, $expected, $name){\n \
  \           return nil_val();\n        }\n    };\n}\n\n#[macro_export]\nmacro_rules!\
  \ check_type_error {\n    ($value: expr, $expected_type: expr, $name: expr) => {\n\
  \        if check_type_error($value, $expected_type, $name){\n            return\
  \ nil_val();\n        }\n    };\n}\n```\n\n由于这些宏涉及修改我们所有的函数，我们将展示每个函数的新版本。我们将创建一个带有函数名称的绑定\
  \ `name`，并替换每个 `if` 语句。在 `mufi_stdlib/src/lib.rs` 中，我们可以移除函数 `error()`，并将看到所有函数的重写结果：\n\
  \n```rust\n#[no_mangle]\npub unsafe extern \"C\" fn rscmdNative(argCount: c_int,\
  \ args: *mut Value) -> Value {\n    let name = \"rscmd()\";\n    check_argcount_error!(argCount,\
  \ 1, name);\n    let val = read(args as *const Value);\n    check_type_error!(&val,\
  \ \"string\", name);\n    …\n}\n\n#[no_mangle]\npub unsafe extern \"C\" fn rsexitNative(argCount:\
  \ c_int, args: *mut Value) -> Value {\n    let name = \"rsexit()\";\n    check_argcount_error!(argCount,\
  \ 1, name);\n    let val = read(args as *const Value);\n    check_type_error!(&val,\
  \ \"int\", name);\n    exit(\n}\n```\n\n\n\n在项目的根目录中，我们可以创建 `install.rs` 文件，并在文件顶部添加以下导入内容，以及在安装开始时显示的常量\
  \ `INFO` 和 `CMD`。常量 `INFO` 将用于解释两种模式——`debug`（调试）和 `release`（发布）之间的区别。常量 `CMD` 将用于将我们的导出命令追加到\
  \ bash 文件中：\n\n```rust\nuse std::io::{stdin, Result, Write, Read};\nuse std::fs::{File,\
  \ create_dir,copy, OpenOptions};\nuse std::process::Command;\nuse std::path::Path;\n\
  const INFO: &str = r#\"MUFI-LANG INSTALL MODES:`\n\n- Debug: Shows bytecode logs\
  \ and garbage collector tracings\n- Release: Only shows results from interpreter\n\
  \"#;\nconst CMD: &str = \"\\nexport LD_LIBRARY_PATH=/usr/local/lib/Mufi\";\n```\n\
  \n在返回 `Result<()` 的 `main()` 函数中，我们将打印 `INFO` 并要求用户输入安装哪种模式。使用该模式，我们将运行相应的 `make`\
  \ 命令。然而，我们不会启动它，而是直接使用 `std::process::Command` 中的 `output()` 方法：\n\n```rust\nfn\
  \ main() -> Result<()>{\nprintln!(\"{INFO}\");\nprintln!(\"Please choose install\
  \ mode: \");\nlet mut input = String::new();\nstdin().read_line(&mut input)?;\n\
  input = input.trim().to_lowercase();\nlet _ = Command::new(\"make\").arg(&input).output()?;\n\
  }\n```\n\n现在，第一步是将共享对象库拷贝到 `/usr/local/lib/Mufi`。首先，如果该目录不存在，则我们需要创建它：\n\n```rust\n\
  // create directory /usr/local/lib/Mufi\nlet lib_path = Path::new(\"/usr/local/lib/Mufi\"\
  );\nif !lib_path.exists(){\nprintln!(\"Creating directory: {:?}\", lib_path);\n\
  create_dir(lib_path)?;\n}\n```\n\n现在，目录已经创建完成，我们可以继续定义库的源路径和目标路径。有了目标路径，我们可以创建一个空文件，然后将内容从源文件拷贝到目标文件，同时告知用户我们正在操作：\n\
  \n```rust\n// handle copying libmufi_stdlib.so\nlet lib_src = Path::new(\"mufi_stdlib/target/release/libmufi_stdlib.so\"\
  );\nlet lib_dest = lib_path.join(\"libmufi_stdlib.so\");\n// create empty file in\
  \ lib destination\nlet _ = File::create(&lib_dest)?;\n// copy src to destination\n\
  println!(\"Copying Mufi Standard Library to /usr/local/lib/Mufi\");\ncopy(lib_src,\
  \ &lib_dest)?;\n```\n\n现在，我们可以对我们的 `mufi` 二进制文件执行相同的操作。我们将该二进制文件从项目根目录拷贝到 `/usr/local/bin/`。我们需要创建一个空文件，然后将内容从源路径拷贝到目标，同时告知用户：\n\
  \n```rust\n// handle copying mufi binary\nlet bin_src = Path::new(\"mufi\");\nlet\
  \ bin_dest = Path::new(\"/usr/local/bin/mufi\");\n// create empty file in bin destination\n\
  let _ = File::create(bin_dest)?;\n// copy src to destination\nprintln!(\"Copying\
  \ Mufi binary to /usr/local/bin\");\ncopy(bin_src, bin_dest)?;\n```\n\n如前所述，当我们向\
  \ `~/.bashrc` 或其等效文件追加内容时，我们需要用户输入此路径，因为我们无法直接访问它。之后，我们可以使用输入（修剪掉任何不必要的空格）创建一个新路径。我们可以使用\
  \ `OpenOptions::new()` 打开文件，并将 `read()` 方法设置为 `true`，将 `append()` 方法设置为 `true`。然后，我们可以使用我们的路径通过\
  \ `open()` 方法完成链式调用：\n\n```rust\n// get home path\nlet mut input = String::new();\n\
  println!(\"Please enter path to .bashrc or equivalent to finish installation: \"\
  );\nstdin().read_line(&mut input)?;\nlet bashrc_path = Path::new(input.trim());\n\
  // open ~/.bashrc as append only, we do not want to overwrite it\nlet mut bashrc\
  \ = OpenOptions::new().read(true).append(true).open(&bashrc_path)?;\n```\n\n如果一直向文件中追加此命令，将会很困扰。因此，在执行之前，我们将读取文件并检查它是否已经存在，如果存在，则任务完成。然而，如果不存在，我们将把命令写入文件并告知用户：\n\
  \n```rust\nlet mut contents = String::new();\nbashrc.read_to_string(&mut contents)?;\n\
  if contents.contains(CMD){\n    println!(\"Installation completed!\");\n} else {\n\
  \    println!(\"Adding export to {}\", bashrc_path.display());\n    bashrc.write_all(CMD.as_bytes())?;\n\
  \    println!(\"Installation completed!\");\n}\n```\n\n完成所有编写后，我们不仅为一种用 C 编写的编程语言编写标准库，还学会了如何让用户安装并在他们的系统上运行（前提是它是\
  \ Unix 系统）。对于这一点已经有一个流行的框架了，那就是 Electron！然而，Electron 也存在一些问题，这使得许多人转而使用 Tauri 来编写一个简单的桌面应用，用于展示用\
  \ **mdbook** 编写的开源书籍。Electron 是一个使用 chromium 来构建跨平台应用的 JavaScript 框架，可以构建 Windows\
  \ **MSI** 文件、macOS **DMG** 文件或 Linux **AppImage** 文件（或用于 Debian 发行版的 **deb** 包）。Electron\
  \ 的问题在于 *chromium*。将 chromium 本质上构建在应用中会导致它非常消耗内存（取决于应用的功能，例如 **vscode**），并且文件体积巨大（我们的简单应用达到了\
  \ 1GB）。\n\n\n\n\n\n有关 Electron 框架的更多信息，请查看其官方文档：[`https://www.electronforge.io/](https://www.electronforge.io/)`。如果你想获取更多关于\
  \ Tauri 框架的信息，你也可以查看他们的文档 [`https://tauri.app/](https://tauri.app/)`。\n\n### 结构\n\
  \n在本章中，我们将涵盖以下主题：\n\n* 开启使用 Tauri\n* 熟悉 Svelte\n* 应用程序概述\n* 创建应用程序\n* Tauri 进阶使用\n\
  * Tauri 开发面临的挑战\n\n### 目标\n\n本章旨在让读者能够利用他们的 Rust 知识结合 JavaScript 框架 Svelte 来构建桌面应用，并使用\
  \ Tauri 构建跨平台应用。我们还将学习如何将桌面应用与构建的 Web 服务器配合，演示如何发送请求、处理请求并将结果传回给桌面应用。\n\n### 开始使用\
  \ Tauri\n\n为了安装 Tauri，我们需要确保系统已安装了相应的依赖项。我们将讨论创建项目的不同方式，同时我们将使用 `Cargo` 方法来简化操作。\n\
  \n# 系统依赖项\n\n我们将在所有不同的系统中安装 Rust。在 Windows 系统中，我们需要安装 Microsoft Visual Studio C++\
  \ 生成工具。最简单的方法是从 `https://visualstudio.microsoft.com/visual-cpp-build-tools/` 安装\
  \ `Build Tools for Visual Studio 2022`，并确保选中了 `C++ build tools` 和 Windows SDK。Tauri\
  \ 还深度依赖 `WebView2`，在 Windows 11 中它是预装的；如果你运行的是 Windows 10，则需要从微软网站下载并安装 Evergreen\
  \ Bootstrapper：`https://developer.microsoft.com/en-us/microsoft-edge/webview2/#download-section`。\n\
  \n在 macOS 系统中，你需要确保已安装了 `CLang` 和开发依赖项。然后，你需要在终端中运行以下命令：\n\n```bash\n$ xcode-select\
  \ –install\n```\n\n在 Linux 上安装时，我们将重点关注 Debian 和 Arch 发行版。对于 Debian，你需要在终端中运行以下命令：\n\
  \n```bash\n$ sudo apt update\n$ sudo apt install libwebkit2gtk-4.0-dev \\\nbuild-essential\
  \ \\\ncurl \\\nwget \\\nlibssl-dev \\\nlibgtk-3-dev \\\nlibayatana-appindicator3-dev\
  \ \\\nlibrsvg2-dev\n```\n\n对于 Arch 发行版，你需要在终端中运行以下命令：\n\n```bash\n$ sudo pacman\
  \ -Syu\n$ sudo pacman -S --needed \\\nwebkit2gtk \\\nbase-devel \\\ncurl \\\nwget\
  \ \\\nopenssl \\\nappmenu-gtk-module \\\ngtk3 \\\nlibappindicator-gtk3 \\\nlibrsvg\
  \ \\\nlibvips\n```\n\n创建 Tauri 应用有多种方法。通过使用 `create-tauri-app` 工具，你可以选择使用 `Bash`、`PowerShell`、`Cargo`、`npm`、`yarn`\
  \ 和 `pnpm` 来运行该工具。\n\n对于 Bash，你需要在终端运行以下命令：\n\n```bash\n$ sh <(curl https://create.tauri.app/sh)\n\
  ```\n\n对于 PowerShell，你需要运行以下命令：\n\n```powershell\nPS C:\\> iwr -useb https://create.tauri.app/ps\
  \ | iex\n```\n\n对于 Cargo，我们需要安装该工具并使用 `cargo` 运行：\n\n```bash\n$ cargo install create-tauri-app\n\
  $ cargo create-tauri-app\n```\n\n对于 `npm yarn` 和 `pnpm`，取决于你决定使用的包管理器，它们的命令相同：\n\
  \n```bash\n$ {pm} create tauri-app\n```\n\n我们将在整个本章中使用 `cargo` 方法。不过，你可以自由选择上述所示任何方法。\n\
  \n### Tauri 中的 Hello World\n\n我们可以通过使用 Vanilla 模板（无 JS 框架）创建一个 hello world 应用来练习使用该工具。当我们运行\
  \ `create-tauri-app` 时，系统会提示项目名称。我们将项目命名为 `hello_world`。然后，你需要选择一个包管理器；对于 Vanilla\
  \ UI 模板，`cargo` 是可以的，但为了使用 JS 框架（我们稍后使用 Svelte），我们需要使用 `yarn`、`npm` 或 `pnpm`。\n\n\
  注意：在使用 cargo 包管理器时，你有不同的 UI 模板。第一个是 vanilla，第二个是 yew，它涉及 WebAssembly：\n\n```bash\n\
  $ cargo create-tauri-app\n✓ Project name · hello_world\n✓ Choose your package manager\
  \ · cargo\n✓ Choose your UI template · vanilla\n```\n\n如果你尚未完成相关操作，请遵循 [`tauri.app/v1/guides/getting-started/prerequisites`](https://tauri.app/v1/guides/getting-started/prerequisites)。\n\
  \n\n\n\n要查看查询发生在哪里，我们需要查看 `src/index.html`，这些输入框、按钮和文本在这里被定义：\n\n```html\n<p>Click\
  \ on the Tauri logo to learn more about the framework</p>\n<div class=\"row\">\n\
  \  <div>\n    <input id=\"greet-input\" placeholder=\"Enter a name…\" />\n    <button\
  \ id=\"greet-button\" type=\"button\">Greet</button>\n  </div>\n</div>\n<p id=\"\
  greet-msg\"></p>\n```\n\n使用 Tauri Tauri 这种跨平台项目的核心意义在于能够为不同的操作系统构建相同的应用程序。为了开始，我们需要查看\
  \ `src-tauri/tauri.conf.json`。\n\n在 JSON 文件的 `bundle` 键中，我们可以看到不同的操作系统及其对应的选项，例如\
  \ `macOS`、`Windows` 和 `deb`。要构建项目，我们需要更改标识符（identifier），因此我们将将其更改为简单的内容，如 `com.hello.world`。当你构建\
  \ Tauri 项目时，取决于你所使用的操作系统，Tauri 将封装特定于系统的可执行文件。\n\n在编写时，该项目运行在 POP_OS 上！因此，当我们构建项目时，会得到一个\
  \ `.deb` 文件和一个 `.AppImage` 文件。Debian 文件用于用于任何基于 `.deb` 的 Linux 发行版，而其他发行版可以使用 `.AppImage`\
  \ 文件。\n\n让我们使用命令行工具 `tauri-cli` 来构建项目：\n\n```bash\n# 确保处于 hello_world 目录下\n$ cargo\
  \ tauri build\n\n### 在我的情况下，我们将看到 Linux 的安装包\n$ ls src-tauri/target/release/bundle\n\
  appimage deb\n\n### 检查 appimage 文件夹中的内容\n$ ls src-tauri/target/release/bundle/appimage\n\
  build_appimage.sh hello-world_0.0.0_amd64.AppImage hello-world.AppDir\n\n### 检查\
  \ deb 文件夹中的内容\n$ ls src-tauri/target/release/bundle/deb\nhello-world_0.0.0_amd64\
  \ hello-world_0.0.0_amd64.deb\n\n# 运行程序可以执行以下操作：\n$ cd src-tauri/target/release/bundle/appimage\n\
  $ ./hello-world_0.0.0_amd64.AppImage\n\n# 安装程序可以执行以下操作：\n$ cd src-tauri/target/release/bundle/deb\n\
  $ sudo dpkg –i hello-world_0.0.0_amd64.deb\n```\n\n### 熟悉 Svelte\n\n在我们的实际项目中，我们不会使用\
  \ Vanilla 模板，而是使用 `npm` 包管理器，以便我们能够使用 Svelte JS 框架作为我们的 UI 模板。Svelte 框架最初流行是因为：它计划用\
  \ Rust 重写编译器，目标是缩小输出尺寸（可能比输入更小）并提高性能。Svelte 的 JavaScript 具有非常直观的语法。\n\n对于我们的示例，请确保已安装\
  \ `nodejs` 和包管理器 `npm`。如果你想使用 `yarn` 或 `pnpm`，可以通过在给命令中将 `npm` 替换为你的包管理器来使用。你可以从其官方网站下载\
  \ `nodejs`：[`nodejs.org/en/download/`](https://nodejs.org/en/download/)。\n\n为了熟悉\
  \ Svelte，我们将使用 SvelteKit 创建一个项目，它为我们提供了一个使用 Svelte 的项目以及更好的实验体验。我们将通过以下命令创建项目 `svelte_fun`：\n\
  \n```bash\n$ npm create svelte@latest svelte_fun\n✓ Which Svelte app template? ›\
  \ Skeleton project\n✓ Add type checking with TypeScript? › Yes, using TypeScript\
  \ syntax\n✓ Add ESLint for code linting? … No / Yes\n✓ Add Prettier for code formatting?\
  \ … No / Yes\n✓ Add Playwright for browser testing? … No / Yes\n\n$ cd svelte_fun\n\
  $ npm install\n$ ls src\napp.d.ts app.html routes\n```\n\n如果我们查看 `svelte_fun` 内部的\
  \ `src` 目录，可以注意到 `routes` 目录，它包含了所有的 `.svelte` 文件。我们将专注于在 `routes` 目录中工作，以便展示该语言的通用语法。\n\
  \n**注意：有一个 vscode 的 Svelte 插件可以提供语法高亮。**\n\n开始，删除 `routes/+page.svelte` 中的所有内容（它代表我们的索引路径），并将将其替换为更标准的\
  \ Svelte 文件布局。\n\n```svelte\n<script lang=\"ts\">\n  // Svelte 代码写在这里\n</script>\n\
  \n<style>\n  /* CSS 写在这里 */\n</style>\n```\n\n\n\n\n```\n{/if}\n```\n\n现在，我们可以创建用于显示计数的文本以及用于倍增和重置计数的按钮，使用我们之前过的\
  \ `on:click()` 属性：\n\n```html\n<button on:click={double}>Double Counter</button>\n\
  <br>\n<button on:click={reset}>Reset Counter</button>\n```\n\n我们需要做的最后件事是允许用户从我们的首页跳转到该路径。我们将使用锚点标签（anchor\
  \ tag）让他们发送到 `flow` 路径。在 `routes/+page.svelte` 中的按钮之后添加以下内容：\n\n```html\n<br>\n\
  <a href=\"/flow\">Go to Flow</a>\n```\n\n### 应用程序概览\n\n我们我们已经讨论了 Tauri 和 Svelte，以及如何在这两个框架中获取基础视图。然而，现在是时候将它们结合起来并帮助我们创建应用程序了。我们的桌面应用程序到底是关于什么的呢？创建一个登录应用程序仍然有点无聊，所以为了增加趣味并简化我们的生活，让我们创建一个星座应用程序吧。\n\
  \n星座应用程序？这到底什么意思？计划是：用户输入自己的星座；我们读取并输出星座的结果，包括代表该星座的编程语言，以及关于他们为什么得到该语言的幽默短描述。\n\
  \n让我们看看不同的星座以及根据每个星座拥有的属性代表它们的编程语言。请记住，这些都是为了好，你不应该认真对待这些语言与星座之间的关系。\n\n*   **白羊座**:\
  \ 3 月 21 日 – 4 月 19 日\n    *   喜欢第一\n    *   Python\n*   **金牛座**: 4 月 20 日 – 5 月\
  \ 20 日\n    *   喜欢放松\n    *   Swift\n*   **双子座**: 5 月 21 日 – 6 月 21 日\n    *   喜欢好奇，渴望分身\n\
  \    *   Kotlin\n*   **巨蟹座**: 6 月 22 日 – 7 月 22 日\n    *   直觉灵敏\n    *   Golang\n\
