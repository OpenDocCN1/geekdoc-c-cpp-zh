  \ 2 月 19 日 – 3 月 20 日\n    *   直觉、敏感且共情\n    *   Java\n\n关于我们在 Rust 代码中能看到的内容，我们需要一个通用的结构\
  \ `Zodiac`，它需要字段来包含星座名称、性格描述及其相应的编程语言。它看起来像这样：\n\n```rust\npub struct Zodiac{\n\
  \    name: String,\n    description: String,\n    language: String\n}\n```\n\n这将如何与应用程序的前端交互呢？嗯，我们将要求用户输入他们的星座。我们将为每个星座设置一个方法以及一个返回\
  \ `Vec<String>` 的 `to_string()` 方法。你可能会奇怪为什么我们返回的是字符串向量而不是 `String`，那是因为换行符的问题。如果我们尝试返回一个带有格式化换行符的\
  \ `String`，当我们将其返回给 JavaScript 时，字符串中仍然会有“\\n”。\n\n在字符串中嵌入 `<br>` 标签怎么样？这应该可以行吧？遗憾的是，不行的。这和“\\\
  n”是相同的问题，因此我们的做法是按正确的顺序返回一个字符串向量。在 Svelte 中使用向量，我们可以使用 `{#each}` 标签，这样我们就可以遍历向量并将它们放入\
  \ HTML 中。\n\n### 创建应用程序\n\n在我们讨论应用程序概览时，我们开始讨论涉及的一些代码，虽然考虑这些可能很好，但对我们来说，开始项目更好。首先，确保已安装了\
  \ `npm`，一旦完成，我们将安装 `yarn` 包管理器。然后我们可以按照如下选项创建我们的项目：\n\n```bash\n$ npm install –g\
  \ yarn\n### create project\n$ cargo create-tauri-app\n✓ Project name · zodiac_app\n\
  ✓ Choose your package manager · yarn\n✓ Choose your UI template · svelte-kit\nDone,\
  \ Now run:\ncd zodiac_app\nyarn\nyarn tauri dev\n```\n\n创建项目后，我们将按照给出的说明操作：\n\n\
  ```bash\n$ cd zodiac_app\n### installs all dependencies\n$ yarn\n```\n\n\n\n\n\n\
  如果用户输入了一个实际上不存在的星座怎么办？我们需要处理这种情况，为了做到这一点，我们将为 `Zodiac` 实现 `Default` trait 性，并返回一个带有许多问号的\
  \ `Zodiac`实例：\n\n```rust\nimpl Default for Zodiac{\n  fn default() -> Self {\n \
  \   Self::new(\"????\", \"What zodiac sign is that?\", \"Fortran???\")\n  }\n}\n\
  ```\n\n现在，我们可以进入 `main.rs` 并将其替换为以下内容：\n\n```rust\n#![cfg_attr(all(not(debug_assertions),\
  \ target_os = \"windows\"),\n  windows_subsystem = \"windows\"\n)]\nmod zodiac;\n\
  use zodiac::Zodiac;\n\n#[tauri::command]\nfn get_zodiac(zodiac: &str) -> Vec<String>{\n\
  \  // TODO\n}\n\nfn main() {\n  tauri::Builder::default()\n    .invoke_handler(tauri::generate_handler![get_zodiac])\n\
  \    .run(tauri::generate_context!())\n    .expect(\"error while running tauri application\"\
  );\n}\n```\n\n如你所见，我们有一个函数 `get_zodiac()`，它将接收用户星座的输入并返回一个 `Vec<String>`。为了不用担心用户输入的星座是全大写还是全小写，我们将创建一个绑定\
  \ `zodiac`，使用 `to_lowercase()` 方法将参数 `zodiac` 转换为小写。然后我们对绑定变量 `zodiac` 使用 `match`\
  \ 语句。然而，由于它是一个 `String`，我们将使用 `as_str()` 方法将其转换为 `&str`：\n\n```rust\nfn get_zodiac(zodiac:\
  \ &str) -> Vec<String>{\n  let zodiac = zodiac.to_lowercase();\n  match zodiac.as_str(){\n\
  \    _ => Zodiac::default().to_string()\n  }\n}\n```\n\n我们可以使用不同的匹配分支（matching arm）来处理每个星座，使用\
  \ `Zodiac` 中对应的方法并链链 `to_string()` 方法，以便我们返回一个 `Vec<String>`。在下面的代码中可以看到这样做：\n\n\
  ```rust\nmatch zodiac.as_str(){\n  \"aries\" => Zodiac::aries().to_string(),\n \
  \ \"taurus\" => Zodiac::taurus().to_string(),\n  \"gemini\" => Zodiac::gemini().to_string(),\n\
  \  \"cancer\" => Zodiac::cancer().to_string(),\n  \"leo\" => Zodiac::leo().to_string(),\n\
  \  \"virgo\" => Zodiac::virgo().to_string(),\n  \"libra\" => Zodiac::libra().to_string(),\n\
  \  \"scorpius\" => Zodiac::scorpius().to_string(),\n  \"sagittarius\" => Zodiac::sagittarius().to_string(),\n\
  \  \"capricorn\" => Zodiac::capricorn().to_string(),\n  \"aquarius\" => Zodiac::aquarius().to_string(),\n\
  \  \"pisces\" => Zodiac::pisces().to_string(),\n  _ => Zodiac::default().to_string()\n\
  }\n```\n\n`get_zodiac()` 函数完成后，我们准备好开始处理应用程序的前端了，这从页面的出现开始。我们需要编辑 `src/routes/+page.svelte`\
  \ 文件，添加我们自己的标题，将图片替换为自己的，更改 lib 文件/class 标签以及副标题。来自 Google 的任何图片都可以，高度为 200px 是的：\n\
  \n```html\n<script>\n  import Zodiac from \"$lib/Zodiac.svelte\";\n</script>\n<h1>Welcome\
  \ to Programming Zodiacs!</h1>\n<div class=\"row\">\n  <img src=\"/ProgrammingIllustration.png\"\
  \ height=\"200px\">\n</div>\n<p>Please enter your zodiac sign… </p>\n<div class=\"\
  row\">\n  <Zodiac/>\n</div>\n<style>\n  .logo.vite:hover {\n    filter: drop-shadow(0\
  \ 0 2em #747bff);\n  }\n  .logo.svelte:hover {\n    filter: drop-shadow(0 0 2em\
  \ #ff3e00);\n  }\n</style>\n```\n\n你可以删除文件 `lib/Greet.svelte` 并创建新文件 `lib/Zodiac.svelte`。我们将从处理文件的\
  \ `script` 部分开始。首先，我们需要从 `@tauri-apps/api/tauri` 导入 `invoke()` 函数，然后我们可以创建一个变量 `zodiac_msg`，并给其赋值一个包含空字符串的数组（将包含来自\
  \ `get_zodiac()` 的字符串）。创建 `zodiac_msg` 后，我们也可以创建变量 `zodiac`，它将是一个空字符串（将包含星座输入）。最后，我们需要一种方法让\
  \ `zodiac_msg` 接收 `get_zodiac()` 的结果，这在异步函数 `handle_zodiac()` 中完成。在函数内部，我们将 `zodiac_msg`\
  \ 赋值给 `get_zodiac()`。\n\n```html\n<script>\n  import { invoke } from \"@tauri-apps/api/tauri\"\
  ;\n  let zodiac_msg = [\"\"];\n  let zodiac = \"\";\n  async function handle_zodiac()\
  \ {\n    zodiac_msg = await invoke(\"get_zodiac\", { zodiac });\n  }\n</script>\n\
  ```\n\n\n\n\n\n```rust\nlet numerator: f32 = numerator.trim().parse().unwrap();\n\
  let denominator: f32 = denominator.trim().parse().unwrap();\n// use if/else statement\
  \ to check denominator\nif denominator == 0.0{\n    Err(format!(\"Error: Cannot\
  \ divide {numerator} by 0\"))\n} else{\n    Ok(numerator/denominator)\n}\n```\n\n\
  我们期望用户输入两个数字，并在他们点击按钮时，向他们显示结果。然而，如果分母为 0 会发生什么？你不能将数字除以 0，而且你不希望在这种情况发生时程序崩溃。因此，我们将让\
  \ JavaScript 来处理这个错误，这是通过 `.then()` 和 `.catch()` 方法实现的。\n\n`.then()` 方法处理我们的 `Ok`\
  \ 值，并在函数没有抛出异常时执行。但如果它抛出了异常呢？`.catch()` 方法处理我们的 `Err` 值，并在函数抛出异常且我们捕获并对其进行处理时执行。\n\
  \n我们该如何处理 Svelte 前端呢？首先，我们需要为分子和分母创建变量（分别为变量 `num` 和 `dem`），并将它们初始化为空字符串。之后，我们需要一种方法让前端知道发生了错误，因此我们将创建一个初始值为\
  \ `false` 的变量 `error`。如果发生错误，我们将错误消息存储在初始化为空字符串的变量 `err_msg` 中。如果结果没有错误，我们需要存储结果，它包含在初始值为\
  \ `0.0` 的变量 `result` 中：\n\n```html\n<script>\nimport { invoke } from \"@tauri-apps/api/tauri\"\
  \n// 分子\nlet num = \"\";\n// 分母\nlet dem = \"\";\n// 检查是否有错误\nlet error = false;\n\
  // 如果有错误，此变量包含消息\nlet err_msg = \"\";\n// 包含结果\nlet result = 0.0;\n</script>\n```\n\
  \n现在，我们需要编写一个异步函数来处理用户需要计算结果的事件。我们将需要使用函数 `invoke()` 并配合 `await`。在 `invoke()` 内部，我们将命令设置为\
  \ `divide`，参数封装在括号中，将参数 `numerator` 赋值给变量 `num`，`denominator` 赋值给变量 `dem`：\n\n```javascript\n\
  async function divide(){\n    await invoke(\"divide\", {numerator: num, denominator:\
  \ dem})\n}\n```\n\n如果用户没有将分母设置为 0，那么我们应该得到除法结果。因此，我们将使用 `.then()` 方法将 `result` 赋值给\
  \ `Ok` 值：\n\n```javascript\n// 如果没有除以 0，我们就能得到结果\n// 将变量 result 赋值给值 r\n.then((r)\
  \ => result = r)\n```\n\n然而，如果用户确实决定除以 0，我们需要确保将错误消息赋值给 `err_msg` 并开启错误标记，或者将 `error`\
  \ 赋值为 `true`：\n\n```javascript\n// 如果除以 0，将错误消息赋值给 err_msg\n// 并将错误标记设为 true\n.catch((msg)\
  \ => {err_msg = msg; error = true})\n```\n\nHTML 代码非常直观。我们为分子和分母创建了输入框并使用 `bind:value={}`\
  \ 属性。为了计算结果，我们将有一个显示为 `Calculate` 的按钮，并使用 `on:click={}` 属性配合 `divide` 函数。\n\n现在，在显示结果或错误消息方面，我们将利用标记\
  \ `error` 并使用 `{#if }` 标签。如果有错误，我们就显示错误消息；如果没有错误，我们就显示结果。这一切如下所示：\n\n```html\n{#if\
  \ error}\n    <p>{err_msg}</p>\n{:else}\n    <p>{result}</p>\n{/if}\n</div>\n```\n\
