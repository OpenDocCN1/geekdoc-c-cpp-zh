  students.insert(name.to_string(), grade);\n}\n```\n\n\n\n*   用于释放类实例时。\n\n这些在 Rust\
  \ 中是如何体现的？让我们来看看创建的那个类，只是使用 Rust 的结构体（struct）和实现（implementations）。Rust 版本如下：\n\n\
  ```rust\nstruct Foo{\n  // members => 字段\n  bar: i32,\n  baz: i32,\n}\n\n// 绑定方法\
  \ => 实现\n// 声明时使用 impl 关键字\nimpl Foo{\n  // 创建实例并返回 Self\n  // 在参数中使用实例时使用 self,\
  \ &self 或 &mut self\n  // 构造函数\n  pub fn new()->Self{\n    Foo{\n      bar:45,\n\
  \      baz:32\n    }\n  }\n  // 绑定方法\n  pub fn do_something(&mut self){\n    self.bar\
  \ =self.bar +self.baz;\n    self.baz -=1;\n  }\n}\n\n// 结构体会自动释放内存\nimpl Drop for\
  \ Foo{\n  fn drop(&mut self){\n    println!(\"Bye {} and {}\",self.bar,self.baz)\n\
  \  }\n}\n\nfn main(){\n  let mut foo = Foo::new();\n  foo.do_something();\n}\n```\n\
  \n在我们的程序中，我们展示了 Rust 如何将类属性转换为结构体字段；字段承担了与成员变量相同的作用，实现块充当了结构体绑定方法的角色，而 `new` 函数就是我们的构造函数。我们使用\
  \ `Drop` 特性来作为析构函数。所有类型都实现了 `Drop`，在值超出作用范围或生命周期结束时处理内存释放。我们确实指定了当 `drop()` 被调用时应该发生什么。当我们编译程序（`rustc\
  \ foo_class.rs`）并运行程序（`./foo_class`）时，应该得到相同的结果。\n\n### 实现 (Implementations)\n\n\
  实现为用户提供了为结构体和枚举编写专用函数的方法。它也可以用于实现 trait（特征），但这将在章稍后讨论。\n\n要为结构体/枚举创建实现，使用 `impl`\
  \ 关键字后跟结构体/枚举的名字。在 `impl` 块内部，我们可以为结构体/枚举声明函数，但我们如何访问或创建它的实例呢？这正是 `self` 和 `Self`\
  \ 分别派用场的地方。我们可以通过以下方式使用它们：\n\n*   访问结构体/枚举的值，这意味着在传递的函数中使用点（`.`）运算符，并根据我们的借用需求将\
  \ `self`、`&self` 或 `&mut self` 作为第一个参数。\n*   返回一个结构体/枚举，这意味着使用路径分隔符（`::`），我们返回结构体/枚举的名字或\
  \ `Self`。\n\n为了更好地理解这个概念，让我们来看一个例子：\n\n```rust\npub struct Foo{\n  x: i32\n}\n\n\
  impl Foo{\n  // 构造函数\n  pub fn new(x: i32)->Self{\n    // 如果参数名与字段名匹配，\n    // 我们不需要写\
  \ Foo{x: x}\n    Self{x}\n  }\n  // 公有函数\n  // 可以通过 Foo.update() \n  pub fn update(&mut\
  \ self){\n    self.update_self()\n  }\n  // 私有函数\n  // 无法在 impl 块外部访问\n  fn update_self(&mut\
  \ self){\n    self.x =(self.x *2)+5;\n  }\n}\n\nfn main(){\n  let mut foo = Foo::new(11);\n\
  \  println!(\"Foo is {}\",&foo.x);\n  foo.update();\n  println!(\"Updated foo to:\
  \ {}\",&foo.x)\n}\n```\n\n在我们的结构体 `Foo` 中，我们有一个 32 位整数类型的私有字段 `x`。我们为 `Foo` 创建了一个包含三个函数的实现：`new`、`update`\
  \ 和 `update_self`。\n\n我们的新函数充当了构造函数，这在 Rust 中是一种常见做法。请注意，在我们的 `new` 函数中，我们没有使用传统的\
  \ `Foo{x: bar}`，因为在我们的情况下，参数 `bar = x` 或相同的标识符就是字段，我们可以直接写 `Foo{x}`。\n\n`update`\
  \ 函数是公有的，并在内部使用了名为 `update_self` 的辅助函数；我们只能在 `impl` 块内部访问此函数，因为它是私有的。如果我们尝试在 `impl`\
  \ 块外部访问私有函数，将会遇到编译器错误。这种可见性与 C++ 查看其绑定方法的方式相当。\n\n### 特性 (Traits)\n\nTrait 为用户提供了一种实现形式多态的方法。在\
  \ C++ 中，这是通过继承实现的，但在 Rust 中，我们使用 trait 以一种更通用的方式扩展结构体/枚举的通用性。在继续学习 trait 之前，让我们回想\
  \ C++ 是如何实现继承的。我们会有一个带有公共虚函数的类，然后任何继承它的类要么使用它，要么重写它。我们可以在以下代码中看到这一点：\n\n```cpp\n\
  #include<iostream>\nusing namespace std;\nclass Instructions{\npublic:\n  virtual\
  \ void d_up(){cout<<\"Moving up!\"<<endl;}\n  virtual void d_down(){cout<<\"Moving\
  \ down!\"<<endl;}\n  virtual void d_left(){cout<<\"Moving left!\"<<endl;}}\n};\n\
  \nclass Robot: Instructions{\npublic:\n  void d_up() override{cout<<\"Moving up!\"\
  <<endl;}\n  void d_down() override{cout<<\"Moving down!\"<<endl;}\n  void d_left()\
  \ override{cout<<\"Moving left!\"<<endl;}\n};\n\nint main(){\n  Instructions ins;\n\
  \  Robot robot;\n  Instructions* i = &ins;\n  i->d_up();\n  i->d_down();\n  i->d_left();\n\
  \  return 0;\n}\n```\n\n\n\n在 Rust 中，我们拥有派生宏（derived macros），这种宏是在结构体/枚举的上方通过 `#[derive(<trait>)]`\
  \ 的形式为结构体/枚举实现一个 trait（特型）。一种非常常见的做法是，至少为某个 trait 派生 `Debug & Clone` 泛型。这有助于结构体的克隆，并能够在调试模式下打印该结构体：\n\
  \n```rust\n#[derive(Debug, Clone)]\nstruct Foo(String, u8);\n```\n\n我们将在元编程章节中编写我们自己的派生宏。但了解这些宏的存在是有好处，因为它们为我们提供了很多易用性，并在整本书中被频繁使用。\n\
  \n### 类型别名\n\n如果我们有一个如下形式的节点：\n\n```rust\npub struct Node{\n    value: String,\n\
  \    next: Option<Rc<RefCell<Node>>>,\n    prev: Option<Rc<RefCell<Node>>>,\n}\n\
  ```\n\n我们该如何让生活变得不那么痛苦，并且不像像使用 C/C++ 中那种混乱的 `typedef` 呢？嗯，我们将使用类型别名。为了这一点，我们使用 `type`\
  \ 关键字后跟一个标识符，并将其分配所需的所需的类型，如下：\n\n```rust\ntype Link = Option<Rc<RefCell<Node>>>;\n\
  pub struct Node{\n    value: String,\n    next: Link,\n    prev: Link,\n}\n```\n\
  \n这看起来不是干净得多吗？`type` 有很多用武之地，因此将它掌握在手中从长远来看对你有帮助，并避免冗长的类型结构。\n\n### 从模板到泛型\n\n泛型（Generics）在编程语言中用作数据类型来使函数、结构体等泛化。这有助于减少重复代码（例如为每种数据类型编写一个求和函数）并提高通用性。然而，应该谨慎地使用泛型，而不是随处使用，因为它们可能会产生与其收益完全相反的结果，因为编译器需要适配这些泛型。\n\
  \n在 C++ 中，泛型是通过使用模板（templates）实现的，如下所示：\n\n```cpp\n#include<iostream>\ntemplate<class\
  \ T>\n// template<type identifier, …>\nT greater( T one, T two){\n    if (one >\
  \ two){\n        return one;\n    } else if (two > one){\n        return two;\n\
  \    } else {\n        // 它们相等，返回其中任何一个\n        return one;\n    }\n}\n```\n\n\
  如果我们需要在 Rust 中重写它，它看起来像这样：\n\n```rust\nuse std::cmp::{Ord, Ordering};\nfn greater<T:\
  \ Ord>(one: T, two: T) -> T{\n    return match one.cmp(&two){\n        Ordering::Less\
  \ => two,\n        Ordering::Greater => one,\n        Ordering::Equal => one,\n\
  \    }\n}\n```\n\n要在函数中声明泛型，我们使用 `<>` 运算符，其语法为 `<identifier : trait>`。如果我们需要为一个泛型声明多个\
  \ trait，则需要使用 `+` 运算符来连接这些 trait。然而，将所有这些泛型定义都放在函数的开头会让它看起来很杂乱。这时 `where` 关键字就登场了，通过它我们可以将这些都放在末尾。让我们重写之前的函数，但为它添加一些输出：\n\
  \n```rust\nuse std::fmt::Display;\nuse std::cmp::{Ord, Ordering};\nfngreater_alt<T>(one:\
  \ T, two: T)\nwhere T: Ord + Display{\n    match one.cmp(&two){\n        Ordering::Less\
  \ =>println!(\"{} is greater\", two),\n        Ordering::Greater =>println!(\"{}\
  \ is greater\", one),\n        Ordering::Equal =>println!(\"They are equal\"),\n\
  \    }\n}\n```\n\n`Display` trait 允许我们打印值，而代码的其他部分几乎相同。你可以注意到我们在函数末尾使用了 `where`。这让函数看起来干净得多，并且更符合用户的视觉。\n\
  \n### 泛型结构体\n\n创建泛型结构体遵循与函数类似的语法，泛型在标识符之后声明：\n\n```rust\nstruct Foo<T: Bar>{\n \
  \   a: T,\n    b: T\n}\n```\n\n实现本身稍有不同；泛型定义必须在 `impl` 关键字之后写一个，在结构体标识符之后写一个：\n\n\
  ```rust\nimpl <T: Bar> Foo <T>{\n    pub fn new(a: T, b:T) -> Self{/*something*/}\n\
  }\n```\n\n如果你注意到，我们在 `impl` 块内部的没有任何函数都没有任何泛型定义。这是因为 `impl` 关键字之后的定义已经处理了它，而结构体标识符之后的泛型定义显示该结构体包含了泛型。\n\
  \n### 泛型 trait\n\n创建泛型 trait 也遵循与泛型结构体相同的语法，因为泛型定义在标识符之后（`trait Foo<T>{}`）。我们将按照如下所示创建我们自己的泛型\
  \ trait `Bar`：\n\n```rust\ntrait Bar<T: Clone, K: Copy + Clone, V: Clone + Debug>{\n\
  \    fn only_clone(&self)-> T;\n    fn copy_clone(&self)-> K;\n    fn debugged(&self)->\
  \ V;\n}\n```\n\n如果我们需要实现它呢？它看起来会什么样？我们需要为 `impl` trait 以及结构体定义泛型。如下代码所示：\n\n```rust\n\
  use std::clone::Clone;\nuse std::fmt::Debug;\nstruct Baz<T, K, V>{\n    t: T,\n\
  \    k: K,\n    v: V,\n}\nimpl<T: Clone, K: Copy + Clone, V: Clone + Debug> Bar<T,\
  \ K, V>for Baz<T, K, V>{\n    fn only_clone(&self)-> T{self.clone()}\n    fn copy_clone(&self)->\
  \ K{self.k}\n    fn debugged(&self)-> V{self.clone()}\n}\n```\n\n如果我们创建一个主函数并创建一个包含每个泛型类型的\
  \ `Baz` 结构体，让我们看看效果：\n\n```rust\nfn main(){\n    let baz = Baz{\n        t:\"hello\"\
  .to_string(),\n        k:11,\n        v:22,\n    };\n    println!(\"{}\", baz.only_clone());\n\
  \    println!(\"{}\", baz.copy_clone());\n    println!(\"{:?}\", baz.debugged());\n\
  }\n```\n\n### 总结\n\n在本章中，我们探索了通过*实现、泛型和 trait*等内容扩展 Rust 结构体/枚举的能力。我们看了它们分别类似于 C++\
  \ 的类、模板和继承，并此意识到结构体是多么重要。\n\n### 核心知识点\n\n*   在 `impl` 块中：\n    *   要在参数中使用结构体/枚举，使用\
  \ `self`。\n    *   要返回结构体/枚举，使用 `Self`。\n*   要为结构体/枚举实现 trait，使用语法 `impl {trait}\
  \ for {struct/enum}`。\n*   要定义泛型：\n    *   通常使用语法 `< {name} : {traits} + …>.`\n\
  \    *   对于实现：`impl <{name}> {struct/enum} <{name}>`。\n\n### 练习\n\n1. 使用泛型创建一个复数库，并编写用于相加和相数的函数，以及将它们转换为元组。（参考\
  \ Add、Sub 和 From 特性）\n2. 创建一个具有部分序的枚举，并创建一个函数对它的数组进行排序。\n3. 创建一个可以变为迭代器的结构体。（实现\
  \ IntoIterator）\n\n### 答案\n\n对于这些答案，我们将创建一个库，将每个练习放在一个单独的文件中，并用 *src/lib.rs* 文件作为测试每个解决方案的中心文件。\n\
  \n首先，创建一个新库 `cargo new --lib ch2_exerices` 并在 `src` 目录下创建以下与相应练习编号对应的文件：\n\n1. \
  \ complex.rs\n\n\n\n\n## 2. `part_ord.rs`\n\n## 3. `iter_.rs`\n\n### 复数结构体\n在这道题中，我们希望创建一个简单的复数结构体。在这里，“简单”意味着能够对复数进行加减运算。为了帮助你复习记忆，复数包含两个部分：实部和虚部（例如\
  \ 2 + 5i，其中 2 是实部，5 是虚部）。\n\n首先，在 `src/complex.rs` 的顶部导入以下内容：\n\n```rust\nuse std::fmt::{Display,\
  \ Formatter};\nuse std::ops::{Add, Sub};\n```\n\n现在我们可以创建一个带有类型为 `T` 的泛型结构体 `Complex`，并为它派生（以下特性（traits）：\n\
  \n- **Debug**: 允许在调试模式下打印。\n- **Copy**: 所有数字都实现了 `Copy` 特性。\n- **Clone**: 允许我们使用\
  \ `clone()` 方法，并且是 `Copy` 要求的。\n- **PartialOrd**: 允许我们对值进行部分比较。\n- **PartialEq**:\
  \ 允许我们对值进行部分相等比较，并且是 `PartialOrd` 要求的。\n\n```rust\n#[derive(Debug, Copy, Clone,\
  \ PartialOrd, PartialEq)]\npub struct Complex<T>{\n    // 实部\n    pub r: T,\n  \
  \  // 虚部\n    pub i: T,\n}\n```\n\n为了允许我们的类型进行加/减法，我们需要为我们的特性实现 `Add/Sub` 特性，以便我们可以将其添加到\
  \ `impl` 块中。我们期望当创建一个新的 `Complex` 时，该类型必须实现 `Copy`、`Clone`、`Add` 和 `Sub`。在实现 `Add/Sub`\
  \ 时，它期望其类型 `Output` 有类型，因此我们将其赋值为 `T`：\n\n```rust\n// Add/Sub 期望一个输出类型，因此我们将其赋值为\
  \ T\nimpl<T: Copy + Clone + Add<Output = T> + Sub<Output = T>> Complex<T>{\n   \
  \ pub fn new(r: T, i: T) ->Self{\n        Self{\n            r, i\n        }\n \
  \   }\n    pub fn add(&mut self, other: &Self){\n        self.r = self.r + other.r;\n\
  \        self.i = self.i + other.i;\n    }\n    pub fn sub(&mut self, other: &Self){\n\
  \        self.r = self.r - other.r;\n        self.i = self.i - other.i;\n    }\n\
  }\n```\n\n为了增加一些功能，如果能以数值形式打印复数，并能够将元组转换为复数，那就太棒了。\n\n我们实现 `Display` 来为我们的结构体 `Complex`\
  \ 提供自定义格式化：\n\n```rust\nimpl<T: Display> Display for Complex<T>{\n    fn fmt(&self,\
  \ f: &mut Formatter<'_>) -> std::fmt::Result {\n        write!(f, \"{} + {}i\",\
  \ &self.r, &self.i)\n    }\n}\n```\n\n为了将元组转换为复数，我们为结构体 `Complex` 实现 `From<(T, T)>`，因为这允许我们拥有\
  \ `Complex::from()` 函数：\n\n```rust\nimpl<T> From<(T, T)>for Complex<T>{\n    fn\
  \ from(t: (T, T)) ->Self {\n        Self{\n            r: t.0,\n            i: t.1\n\
  \        }\n    }\n}\n```\n\n现在我们可以在 `src/lib.rs` 中创建以下简单的测试，来测试加减法是否正常：\n\n```rust\n\
  mod complex;\nuse complex::Complex;\n#[cfg(test)]\nmod tests{\n    use super::*;\n\
  \    #[test]\n    fn test_complex(){\n        let mut complex = Complex::new(8,\
  \ 7);\n        complex.add(&Complex::new(9,8));\n        complex.sub(&Complex::from((7,6)));\n\
  \        assert_eq!(complex, Complex::new(10, 9))\n    }\n}\n```\n\n当我们运行 `cargo\
  \ test` 时，我们应该得到如下所示：\n\n`Finished test [unoptimized + debuginfo] target(s) in 0.82s`\n\
  `Running unittests src/lib.rs (target/debug/deps/ch2_exercises-eca3ee4d1f38c108)`\n\
  `running 1 test`\n`test tests::test_complex … ok`\n`test result: ok. 1 passed; 0\
  \ failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.00s`\n\n### 使用 PartialOrd\
  \ 排序\n我们的下一个问题非常简单；我们需要编写一个实现 `PartialOrd` 的结构体或枚举，并能够对该结构体或枚举数组进行排序。\n\n对于这个问题，我决定简单创建一个枚举\
  \ `Status`，它包含三个变体：\n1. Done (1)\n2. InProgress (0)\n3. Planned (-1)\n\n为了方便起，我们为枚举使用\
  \ `repr(i8)`：\n\n```rust\n#[derive(Debug, Clone, PartialOrd, PartialEq)]\npub enum\
  \ Status {\n    Done,\n    InProgress,\n    Planned,\n}\n```\n\n`sort_status` 函数接收一个\
  \ `Status` 的可变向量并对其进行排序：\n\n```rust\npub fn sort_status(statuses: &mut Vec<Status>)\
  \ {\n    statuses.sort();\n}\n```\n\n我们可以在 `src/lib.rs` 中测试它：\n\n```rust\n#[cfg(test)]\n\
  mod tests {\n    use super::*;\n    #[test]\n    fn test_sort() {\n        let mut\
  \ statuses = vec![Status::Done, Status::InProgress, Status::Planned];\n        sort_status(&mut\
  \ statuses);\n        assert_eq!(statuses, vec![Status::Planned, Status::InProgress,\
  \ Status::Done]);\n    }\n}\n```\n\n### Archiver 结构体\n对于第三题，我决定创建一个类似链表的结构，不是连接头部和尾部，而是有一个值。每添加一个新值，旧值就会被推入存档。\n\
  \n实际的迭代器只会遍历存档，因为如果我们包含当前值，就会出现重复值。让我们看看结构体 `Archiver`，以便更好地了解我们要处理的内容：\n\n```rust\n\
  use std::iter::IntoIterator;\n\n#[derive(Debug, Clone, PartialOrd, PartialEq)]\n\
  pub struct Archiver {\n    pub value: Option<i32>,\n    pub archive: Vec<i32>,\n\
  }\n```\n\n我们将添加简单的 `new`、`push` 和 `pop` 函数以便于测试。让我们讨论每个函数是如何工作的：\n\n- **Archiver::new()**:\n\
  \  创建一个新的空 archiver；这意味着 `value` 将是 `None`，而 `archive` 将是一个空向量。\n\n- **Archiver.push(i32)**:\n\
  \  将新值推入 archiver，但我们必须处理 `value` 的两种情况：\n  - 如果 `value` 是 `None`，意味着 archiver 是新的，所以我们只需让\
  \ `Archiver.value = Some(value)`。\n  - 如果 `value` 是 `Some(v)`，我们必须将当前值 `v` 推入 `Archiver.archive`并将\
  \ `value` 绑定到 `Archiver.value`。\n\n- **Archiver.pop() -> Option<i32>**:\n  (待定义)\n\
  \n\n\n\n\n* 返回当前值并将 `Archiver.value` 设置为 `Archiver.archive` 的最后一个元素：\n\n```rust\n\
  impl Archiver{\n  // 创建一个空的 archiver\n  pub fn new() ->Self{\n    Self{\n      value:\
  \ None,\n      archive: Vec::new()\n    }\n  }\n  // 将一个项推入 value，并将旧值推入 archive\n\
  \  pub fn push(&mut self, value: i32){\n    // 如果 value 为 None，则这是一个新的 archiver\n\
  \    match self.value{\n      None => {\n        self.value = Some(value)\n    \
  \  }\n      Some(v) => {\n        self.archive.push(v);\n        self.value = Some(value)\n\
  \      }\n    }\n  }\n  // 弹出值并使 value 成为 archiver 中的最后一个项\n  pub fn pop(&mut self)\
  \ -> Option<i32>{\n    let value = self.value;\n    let new_value = self.archive.pop();\n\
  \    self.value = new_value;\n    value\n  }\n}\n```\n\n我们现在准备好为 `Archiver` 实现 `IntoIterator`\
  \ 了，但它有几个要求：\n\n* **Item**: 迭代器中的每个项将是什么类型\n    * 在我们的案例中，它将是 `i32`。\n* **IntoIter**:\
  \ 我们将将其转换为什么种的迭代器\n    * 在我们的案例中，我们将转换为 `std::vec::IntoIter`。\n* `fn into_iter(self)\
  \ -> Self::IntoIter;`: 将结构体转换为迭代器的函数。\n    * 我们只需返回 `self.archive.into_iter()`：\n\
  \n```rust\nimpl IntoIterator for Archiver{\n  type Item = i32; // 迭代器中的每个项都是 i32\n\
  \  // 我们的 into_iter 类型将使用 Vec 的实现\n  type IntoIter = std::vec::IntoIter<Self::Item>;\n\
  \  fn into_iter(self) ->Self::IntoIter {\n    self.archive.into_iter()\n  }\n}\n\
  ```\n\n我们现在可以为我们的结构体 `Archiver` 创建一个测试，并查看我们的迭代器是否按预期工作：\n\n```rust\nmod complex;\n\
  use complex::Complex;\nmod part_ord;\nuse part_ord::{Status::*, *};\nmod iter_;\n\
  use iter_::Archiver;\n#[cfg(test)]\nmod tests{\n  use super::*;\n  #[test]\n  fn\
  \ test_complex(){…}\n  #[test]\n  fn test_part_ord(){…}\n  #[test]\n  fn test_iter(){\n\
  \    let mut archiver = Archiver::new();\n    archiver.push(90); // value = 90\n\
  \    archiver.push(67); // value = 67, archive = [90]\n    archiver.push(88); //\
  \ value = 88, archive = [90, 67]\n    // 将 archive 中的每个值翻倍\n    archiver.archive\
  \ = archiver\n    .clone()\n    .into_iter()\n    .map(|x| x*2)\n    .collect();\
  \ // archive = [180, 134]\n    assert_eq!(archiver, Archiver{\n      value: Some(88),\n\
  \      archive: vec![180, 134]\n    })\n  }\n}\n```\n\n当我们运行 `cargo test` 时，我们应该得到如下成功：\n\
  \n`Finished test [unoptimized + debuginfo] target(s) in 0.25s`\n`Running unittests\
  \ src/lib.rs (target/debug/deps/ch2_exercises-eca3ee4d1f38c108)`\n`running 3 tests`\n\
  `test tests::test_complex … ok`\n`test tests::test_iter … ok`\n`test tests::test_part_ord\
  \ … ok`\n`test result: ok. 3 passed; 0 failed; 0 ignored; 0 measured; 0 filtered\
  \ out; finished in 0.00s`\n\n# 第 3 章\n\n### 错误处理\n\n### 引言\n\n错误处理在任何语言中都是一个非常的话的话，因为它允许开发者处理程序中的边界情况或防止用户错误。无论如何，知道如何处理错误都是\
  \ Rust 中需要掌握的内容。\n\nRust 提供了两种不同的错误处理类型：`Option<T>` 和 `Result<T, E>`。这两个类型允许对不同情况进行错误处理，并为用户提供更简单的错误处理体验。我们将探索如何处理错误并创建我们自己的错误类型。\n\
  \n### 结构\n\n在本章中，我们将讨论：\n\n* `Option<T>` 类型\n* `Result<T, E>` 类型\n* 创建自定义错误类型\n\n\
  ### 目标\n\n在本章中，我们介绍了：\n\n* `Option<T>`\n* `Result<T, E>`\n* 自定义错误类型\n\n### C、C++\
  \ 和 Rust 中的错误处理\n\n在进入细节之前，让我们先看看 C、C++ 和 Rust 是如何处理错误的。这是一个 C 语言示例：\n\n```c\n#include<stdio.h>\n\
  #include<errno.h>\nvoid attemptFile(FILE* file, char*path){\n  int errnum;\n  file=fopen(path,\
  \ \"rb\");\n  if(file==NULL){\n    perror(\"Error opening file\");\n  } else{\n\
  \    printf(\"File exists\");\n    fclose(file);\n  }\n}\nint main(){\n  FILE* file;\n\
  \  attemptFile(file, \"foo.txt\");\n  return 0;\n}\n```\n**输出：**\nError opening\
  \ file: No such file or directory\n\n这是一个使用 `try and catch` 的 C++ 示例：\n\n```cpp\n\
  #include<iostream>\nusing namespace std;\nvoid login(int password){\n  try{\n  \
  \  int actual=97979;\n    if(password==actual){\n      cout<<\"Logged in successfully!\"\
  <<endl;\n    } else {\n      throw(password);\n    }\n  }catch(int password){\n\
  \    cout<<\"Login denied: \"<<password<<\" is wrong!\"<<endl;\n  }\n}\nint main(){\n\
  \  login(8888);\n  return 0;\n}\n```\n**输出：**\nLogin denied: 8888 is wrong!\n\n\
  在我们的 C++ 程序中，我们创建一个接收密码猜测的函数。如果与实际密码相同，你就登录。但如果你猜错了，我们抛出密码，错误处理器会捕获它并返回错误消息。这种 `try-and-catch`\
  \ 方法通常非常长且耗时。\n\n这是一个 Rust 示例：\n\n```rust\nfn login(password:u32) ->Result<String,\
  \ String>{\n  let actual:u32=97979;\n  if actual==password{\n    return Ok(format!(\"\
  Logged in successfully!\"));\n  }else { \n    return Err(format!(\"Login denied:\
  \ {} is wrong!\", password)); \n  }\n}\n\nfn main(){\n  match login(8888){\n   \
  \ Ok(o) =>println!(\"{}\", o),\n    Err(e) =>println!(\"{}\", e)\n  }\n}\n```\n\
  **输出：**\nLogin denied: 8888 is wrong!\n\n\n\n\n我们的 Rust 程序是用来表示我们的 C++ 程序的。你已经注意到\
  \ Rust 程序要短得多了；使用 `Result` 类型，我们要么有一个 `Ok` 值要么有一个 `Err` 值。我们在 `main` 函数中使用 `match`\
  \ 语句来打印其中一种结果。在完成对错误处理的审查后，我们可以详细地讨论 Rust 版本的错误处理。\n\n### `Option<T>` 类型 \n\n`Option`\
  \ 类型允许用户传递一个“可选”值，并且让我们能够访问 Rust 版本的 `NULL`、`None`！我们可以看到 `Option` 枚举的内容如下：\n\n\
  ```rust\npub enum Option<T>{\n    Some(T),\n    None,\n}\n```\n\n如你所见，一个值要么是什么，要么什么都不是。现在让我们来看一个示例，看看如何处理该错误：\n\
  \n```rust\nfn to_uint(i:i32) ->Option<u32>{\n    // uint 只能是正整数\n    if i>=0{\n\
  \        return Some(i as u32)\n    } else {\n        return None\n    }\n}\n```\n\
  \n在这个函数中，我们尝试将一个带符号的 32 位整数转换为无符号整数。我们确保该整数是正数，如果不是，我们就返回 `None`。按照给步骤查看我们处理此错误的不同方法：\n\
  \n1.  解开错误。如果发生错误，程序将直接 panic（崩溃）：\n    ```rust\n    let uint = to_uint(2).unwrap();\n\
  \    ```\n\n2.  使用 `match` 语句处理 `Some` 和 `None` 的每种情况：\n    ```rust\n    let uint\
  \ = match to_uint(2){\n        Some(u) => u,\n        None => 0 as u32,\n    };\n\
  \    ```\n\n### `Result<T, E>` 类型 \n\n`Option` 类型及其变体 `Some` 和 `None` 非常适合可选值，而\
  \ `Result` 类型用于更好的错误处理，且结果是直观的。它返回一个 `Ok` 或 `Err` 值。在大多数需要实际错误处理的函数中，你应该预期并使用 `Result`，如下代码所示：\n\
  \n```rust\npub enum Result<T, E>{\n    Ok(T),\n    Err(E),\n}\n```\n\n在下述代码示例中，你可以看到我们在除以零错误的情况下使用了\
  \ `Result`。在我们的 `main` 函数中使用 `std::io::Error` 类型使用 `Result` 也是常见的。我们通常使用它的原因是因为大多数错误都实现了它或使用了它。这让我们的\
  \ `main` 函数看起来非常像 C 语言。参考以下代码：\n\n```rust\nfn divide(first:f32, second:f32) ->Result<f32,\
  \ String>{\n    match second{\n        0.0=>Err(\"Cannot be divided by zero!\".to_owned()),\n\
  \        _=>Ok(first/second)\n    }\n}\n\nuse std::io::Write;\nfn main() ->Result<(),\
  \ std::io::Error>{\n    let mut file=std::fs::File::open(\"foo.txt\")?;\n    file.write_all(\"\
  hello\".as_bytes())?;\n    Ok(())\n}\n```\n\n如果我们运行这个程序，会得到惊人的错误：\n\n`Error: Os\
  \ { code: 2, kind: NotFound, message: \"No such file or directory\" }`\n\n我们得到了错误代码、错误类型以及关于该错误的消息。你可能会被它困惑。操作符显然也很困惑，这引导我们思考如何使用\
  \ `Result` 处理错误：\n\n考虑以下示例：\n\n```rust\nuse std::io::Error;\nuse std::fs;\nfn main()\
  \ ->Result<(), Error>{\n    let source=fs::read_to_string(\"foo.txt\");\n    Ok(())\n\
  }\n```\n\n现在让我们考虑处理此情况的选项，以便我们可以使用内部的 `String` 值：\n\n1.  解开错误，如果发生错误则 panic：\n \
  \   ```rust\n    let source = fs::read_to_string(\"foo.txt\").unwrap();\n    ```\n\
  \n2.  使用 `match` 语句处理每种情况：\n    ```rust\n    let source = match fs::read_to_string(\"\
  foo.txt\"){\n        Ok(s) => s,\n        Err(e) => String::new(),\n    };\n   \
  \ ```\n\n\n\n为了让我们的生活更轻松，我们将编写一个辅助函数来检查字符串是否包含“ours”。如果它不包含该词，我们将返回一个 `NotOurs`\
  \ 错误：\n\n```rust\nfn any_ours(source: &str) -> Result<(), OurError>{\n  if source.contains(\"\
  our\"){\n    Ok(())\n  } else {\n    Err(OurError::NotOurs)\n  }\n}\n```\n\n现在，让我们正式开始处理我们的\
  \ `src/main.rs` 的步骤：\n\n1.  我们将使用字符串缓冲区和 `std::io::stdin().read_line()` 来获取用户输入：\n\
  \n    ```rust\n    fn main(){\n      // get user input\n      println!(\"Please\
  \ enter text from your manifesto: \");\n      let mut input = String::new();\n \
  \     // read from stdin and match the Result\n      match stdin().read_line(&mut\
  \ input){\n        Ok(_) => (),\n        Err(e) =>eprintln!(\"{}\", e.to_string())\n\
  \      };\n    }\n    ```\n\n2.  我们将检查输入是否为空。这可以使用已实现的方法 `is_empty()`来实现，如果为空则返回\
  \ `true`，如果不为空则返回 `false`。\n\n    ```rust\n    // check if empty, if so return error\n\
  \    if input.is_empty(){\n      eprintln!(\"{}\", OurError::Nothing.to_string());\n\
  \    }\n    ```\n\n3.  然后我们将利用我们的辅助函数 `any_ours` 并对其进行匹配。如果正常，我们就继续；如果如果不正常，我们就打印错误：\n\
  \n    ```rust\n    // check if text contains any ours\n    match any_ours(&input){\n\
  \      Ok(_) => (),\n      Err(e) =>eprintln!(\"{}\", e.to_string())\n    };\n \
  \   ```\n\n4.  接下来，我们将按照在 *第 1 章，Rust 简介* 中的方法创建随机生成器：\n\n    ```rust\n    // random\
  \ generator\n    let mut rng = rand::thread_rng();\n    // This random generator\
  \ will determine the marxism\n    let marxism = rng.gen_range(0..100);\n    ```\n\
  \n5.  最后，我们将我们的马克思主义值匹配到一个范围。然而，在进行范围匹配时，你只能执行由 `start ..= end` 定义的闭范围，因为通常的开区间范围\
  \ `start .. end` 还稳定的：\n\n    ```rust\n    // check the marxism level to see how\
  \ marxist it is\n    // ..= is inclusive range\n    match marxism{\n      0..=15\
  \ =>eprintln!(\"{}\",\n      OurError::TooCapitalist(input.clone()).to_string()),\n\
  \      16..=75 =>eprintln!(\"{}\",\n      OurError::NotMarxist.to_string()),\n \
  \     _ =>println!(\"Good my fellow communist\")\n    }\n    }\n    ```\n\n6.  我们的项目完成了，主文件应该如下：\n\
  \n    ```rust\n    // Import error.rs\n    mod error;\n    use std::io::stdin;\n\
  \    use error::*;\n    use rand::Rng;\n\n    fn any_ours(source: &str) -> Result<(),\
  \ OurError>{\n      if source.contains(\"our\"){\n        Ok(())\n      } else {\n\
  \        Err(OurError::NotOurs)\n      }\n    }\n\n    fn main(){\n      // get\
  \ user input\n      println!(\"Please enter text from your manifesto: \");\n   \
  \   let mut input = String::new();\n      // read from stdin and match the Result\n\
  \      match stdin().read_line(&mut input){\n        Ok(_) => (),\n        Err(e)\
  \ =>eprintln!(\"{}\", e.to_string())\n      };\n      // check if empty, if so return\
  \ error\n      if input.is_empty(){\n        eprintln!(\"{}\", OurError::Nothing.to_string());\n\
  \      }\n      // check if text contains any ours\n      match any_ours(&input){\n\
  \        Ok(_) => (),\n        Err(e) =>eprintln!(\"{}\", e.to_string())\n     \
  \ };\n      // random generator\n      let mut rng = rand::thread_rng();\n     \
  \ // This random generator will determine the marxism\n      let marxism = rng.gen_range(0..100);\n\
  \      // check the marxism level to see how marxist it is\n      // ..= is inclusive\
  \ range\n      match marxism{\n        0..=15 =>eprintln!(\"{}\", OurError::TooCapitalist(input.clone()).to_string()),\n\
  \        16..=75 =>eprintln!(\"{}\",\n        OurError::NotMarxist.to_string()),\n\
  \        _ =>println!(\"Good my fellow communist\")\n      }\n    }\n    ```\n\n\
  我们可以看到运行程序的一些结果如下：\n\n`$ cargo run`\n\n`Please enter text from manifesto:`\n\n`our\
  \ project is amazing`\n\n`The text is not Marxist enough!`\n\n`$ cargo run`\n\n\
  `Please enter text from manifesto:`\n\n`our project is amazing`\n\n`The text is\
  \ not Marxist enough!`\n\n`$ cargo run`\n\n`Please enter text from manifesto:`\n\
  `our project is amazing`\n`Our amazing`\n\n`$ cargo run`\n\n`Please enter text from\
  \ manifesto:`\n\n`our project is amazing`\n\n`The text is not Marxist enough!`\n\
  \n`$ cargo run`\n\n`Please enter text from manifesto:`\n\n`our project is amazing`\n\
  \n`The text is not Marxist enough!`\n\n`$ cargo run`\n\n`Please enter text from\
  \ manifesto:`\n\n`our project is amazing`\n\n`The text is not Marxist enough!`\n\
  \n\n\n\n```rust\n// check if empty, if so return error\nif input.is_empty(){\n \
  \   return Err(OurError::Nothing);\n}\n// check if text contains any ours\nany_ours(&input)?;\n\
  // random generator\nlet mut rng = rand::thread_rng();\n// This random generator\
  \ will determine the marxism\nlet marxism = rng.gen_range(0..100);\n// check the\
  \ marxism level to see how marxist it is\n// ..= is inclusive range\nmatch marxism{\n\
  \    0..=15 =>Err(OurError::TooCapitalist(input.clone())),\n    16..=75 =>Err(OurError::NotMarxist),\n\
  \    _ =>Ok(println!(\"Good my fellow communist\"))\n}\n}\n```\n\n这样做的好处是捕到的第一个错误将停止程序，我们不需要处理像瀑布般打印出来的错误，如下：\n\
  \n`$ cargo run`\n`Please enter text from your manifesto`\n`Our hero`\n`Error: NotMarxist`\n\
  `$ cargo run`\n`Please enter text from your manifesto:`\n`Hero`\n`Error: NotOurs`\n\
  \n2.  我们将重点关注的两个改进与我们在下一章中将实际操作的内容有关，但完成这个练习会让你操作更加轻松。首先，让我们开始将项目复制到 `our_error_exercise_2`，完成后，删除\
  \ `src/main.rs` 中的所有内容并添加以下 crates：\n\n`$ cargo add structopt`\n`$ cargo add termcolor`\n\
  \n`Structopt` 将为我们提供一种通过派生结构体/枚举来创建命令行界面的方法，而 `termcolor` 则为我们提供了向 `stdout` 或 `stderr`\
  \ 写入颜色的方法。\n\n首先，我们将为 `src/main.rs` 文件添加所有必要的导入：\n\n```rust\n// Imports\nmod error;\n\
  use std::io::{self, Write};\nuse error::*;\nuse structopt::StructOpt;\nuse termcolor::{Color,\
  \ ColorChoice, ColorSpec, StandardStream, WriteColor};\nuse rand::Rng;\n```\n\n\
  接下来，我们将编写两个函数 `write_error` 和 `write_success`，它们分别写入红色和绿色消息。`write_error` 将写入 `stderr`，而\
  \ `write_success` 将写入 `stdout`。我们将看到的代码示例基于 `termcolor` 仓库中的代码示例，如果你想获取关于该 crate\
  \ 的更多信息，建议访问 [`crates.io/crates/termcolor`](https://crates.io/crates/termcolor)\
  \ 获取更多：\n\n```rust\nfn write_error(message: &str) -> io::Result<()> {\n    // Creates\
  \ our standard stream to stderr\n    let mut stderr = StandardStream::stderr(ColorChoice::Always);\n\
  \    // Sets the standard stream to print red\n    stderr.set_color(ColorSpec::new().set_fg(Some(Color::Red)))?;\n\
  \    // Writes our message\n    writeln!(&mut stderr, \"{}\", message)\n}\n\nfn\
  \ write_success(message: &str) -> io::Result<() {\n    // Creates our standard stream\
  \ to stdout\n    let mut stdout = StandardStream::stdout(ColorChoice::Always);\n\
  \    stdout.set_color(ColorSpec::new().set_fg(Some(Color::Green)))?;\n    // Write\
  \ our message\n    writeln!(&mut stdout, \"{}\", message)\n}\n```\n\n解决颜色打印的问题后，我们需要编写枚举来表示我们的命令行界面。为了做到这一点，我们为枚举派生\
  \ `StructOpt`，并使用 `#[structopt()]` 属性来自定义程序和命令。\n\n我们在程序中的用法是将文本传递给 `manifesto`\
  \ 命令；这意味着我们希望程序看起来如下：\n\n```rust\n// goal: our_error manifesto -t/—text <string>\n\
  #[derive(StructOpt, Debug)]\n// use the #[structopt()] attribute for commands and\
  \ the program\n#[structopt(\n    about = \"Our Error determines how communist your\
  \ words are\",\n    name = \"Our Error\"\n)]\nenum CLI {\n    #[structopt(about\
  \ = \"Determines how communist your manifesto is\")]\n    Manifesto {\n        //\
  \ our_error manifesto -t <string> [short]\n        // our_error manifesto --text\
  \ <string> [long]\n        #[structopt(short, long)]\n        text: String\n   \
  \ }\n}\n```\n\n我们的 `main` 函数将返回 `io::Result<()>` 以方便使用 `write_error` 和 `write_success`。为了为枚举\
  \ `CLI` 收集参数，我们使用 impl 方法 `from_args()`：\n\n```rust\nfn main() -> io::Result<()>\
  \ {\n    let cli = CLI::from_args();\n    // ... implementation\n}\n```\n\n\n\n\n\
  让我们在 `lazy_static!{}` 块中定义我们的全局值。我们将定义两个绑定，其中一个是我们的关键字；它将包含在一个带有 `vec![]` 的 `Vector`\
  \ 中。由于我们希望关键字在整个程序运行期间有效，我们需要定义一个生命周期，为我们的 `Vec<&str>` 使用 `static`，这样值才不会被提前释放。第二个绑定将是我们的正则表达式，用于匹配“our\
  \ <keyword>”，用正则表达式术语来说就是 `^our [a-zA-Z]$`。`Regex::new(&str)` 函数返回一个 `Result<Regex,\
  \ Error>`，因为用户可能会输入无效表达式：\n\n```rust\nlazy_static!{\n    static ref OUR_PAT: Regex\
  \ = Regex::new(\"^our [a-zA-Z]$\").unwrap();\n    static ref KEYWORDS: Vec<&'static\
  \ str> = vec![\n        \"leader\",\n        \"great\",\n        \"people\",\n \
  \       \"goods\",\n        \"needs\",\n        \"nation\"\n    ];\n}\n```\n\n为了让算法的开发更容易，我决定编写一个名为\
  \ `Marxism` 的结构体，它包含一个源字符串、一个“our”的计数以及源字符串中单词的向量：\n\n```rust\npub struct Marxism{\n\
  \    pub source: String,\n    our_count: u32,\n    words: Vec<String>\n}\n```\n\n\
  我们的 `Marxism::new()` 函数接收一个字符串，通过收集按空白拆分的词汇来创建一个单词向量，通过过滤计算“our”的数量，并返回一个 `Marxism`\
  \ 结构体：\n\n```rust\nimpl Marxism{\n    pub fn new(source: &str) ->Self{\n       \
  \ let words: Vec<String> = source\n            .split_whitespace() // type Iterator<Item=&str>\n\
  \            .map(|x|x.to_string())// 将每个 x 转换为字符串\n            .collect(); // 将迭代器收集为\
  \ vec\n        let our_count = words\n            .iter() // 将 words 转换为迭代器\n  \
  \          .filter(|x|x.as_str().eq(\"our\")) // 通过检查 x == \"our\" 来过滤\n       \
  \     .count() as u32; // 将计数作为 u32 返回\n        Self{\n            source: source.to_string(),\n\
  \            our_count,\n            words\n        }\n    }\n}\n```\n\n我们的下一个目标是编写一个\
  \ `evaluate()` 函数。由于我们将“our”计数嵌入了结构体中，因此我们将从该计数开始处理每种情况。接下来，我们像处理 `our_count` 一样，通过过滤来统计单词中有多少关键字。最后，我们使用\
  \ `OUR_PAT` 静态绑定中的 `is_match` 函数检查字符串是否与我们的模式匹配。\n\n在完成每种的累加后，我们可以返回结果，该结果将用于判断文本的马克思主义程度：\n\
  \n```rust\npub fn evaluate(self) ->u32{\n    let mut result = 0;\n    /* 我们的评估标准：\n\
  \    每个 \"our\" 加 5 分\n    每个关键字 加 8 分\n    每个 our <keyword> 加 20 分\n    */\n  \
  \  // 最容易开始的是我们的计数\n    result += 5 * self.our_count;\n    let keyword_count = self.words\n\
  \        .iter() // 将单词转换为迭代器\n        .filter(|x| KEYWORDS.contains(&x.as_str()))\n\
  \        // 过滤这些单词中有多少是关键字\n        .count() ;// 返回计数\n    result += 8 * keyword_count\
  \ as u32;\n    // 检查 source 是否匹配正则模式\n    if OUR_PAT.is_match(&self.source){\n \
  \       result += 20\n    }\n    result\n}\n}\n```\n\n我们现在需要修改 `src/main.rs` 以运行该算法。因此，我们首先需要导入它（确保删除了\
  \ `rand`）：\n\n```rust\nmod algorithm;\nuse algorithm::Marxism;\n```\n\n接下来，我们将如下将随机数生成替换为我们的算法：\n\
  \n```rust\nlet marxism = Marxism::new(&text);\nmatch marxism.evaluate(){\n    0..=15\
  \ => {\n        write_error(&OurError::TooCapitalist(text.clone()).to_string())?\n\
  \    },\n    16..=75 => {\n        write_error(&OurError::NotMarxist.to_string())?\n\
  \    },\n    _ =>write_success(\"You are a fellow communist!\")?\n}\n```\n\n编译程序并尝试几次：\n\
  \n```\n$ ./target/debug/our_error manifesto –t “our nation has a great leader”\n\
  ```\n该文本不够马克思主义了！\n\n```\n$ ./target/debug/our_error manifesto –t “our nation has\
  \ a greater leader with our nation that’s our nation, what great leader does our\
  \ nation have”\n```\n你是一个共产同志\n\n***\n\n# 第 4 章\n\n## 项目 – 构建一个 CLI 应用\n\n### 简介\n\
  \n在本章中，我们将创建一个命令行界面应用程序，它会发送名称列表以及随后的 Markdown 内容。Markdown 代码将使用 `markdown` 库转换为\
  \ HTML 代码并写入 HTML 文件中。所有的 HTML 文件将存储在一个 zip 压缩文件中，并在 Web 服务器的主页上提供一个下载按钮。\n\n为了更好地理解这一点，我们期望用户具备以下基础知识：\n\
  \n*   文件名\n*   MarkDown 内容\n\n如果我们将此数组命名为 `MarkdownContent`，那么一个示例 JSON 文件可能如下：\n\
  \n```json\n{\n  \"MarkdownContent\": [\n    {\n      \"name\": \"foo\",\n      \"\
  content\": \"# Header 1 *I am a really cool text*\"\n    },\n    {\n      \"name\"\
  : \"bar\",\n      \"content\":\"## Header 2 wow I am __suprised__!!!\"\n    }\n\
  \  ]\n}\n```\n\n我们希望命令行应用程序拥有一个 `generate` 命令，以便我们可以运行 `html_creator generate –p\
  \ sample.json`。运行该命令后，我们将在 zip 文件中得到以下文件：\n\n`foo.html:`\n```html\n<h1 id=\"header-1-n-i-am-a-really-cool-text-\"\
  >Header 1 <em>I am a really cool text</em></h1>\n```\n`bar.html:`\n```html\n<h2\
  \ id=\"header-2-n-wow-i-am-__suprised__-\">Header 2 wow I am <strong>suprised</strong>!!!</h2>\n\
  ```\n\n本章将介绍如何使用流行的库，如用于参数解析的 `structopt`、用于 Web 服务器的 `rocket`、用于序列化和反序列化的 `serde`\
  \ 等。\n\n开始项目之前，创建一个库 `cargo new --lib html_creator`，并在 `html_creator/Cargo.toml`\
  \ 中添加以下依赖：\n\n```toml\n[dependencies]\n### 参数解析\nstructopt = \"0.326\"\n### 错误类型\n\
  thiserror = \"1.0.3\"\n### Web 服务器\nrocket = {version=\"0.5-rc.2\", features = [\"\
  json\"]}\n### 发送 Web 请求\nreqwest = {version=\"0.11\", features = [\"json\"]}\n###\
  \ 序列化与反序列化\nserde = {version=\"1\", features = [\"derive\"]}\n### JSON 序列化反序列化\n\
  serde_json = \"1\"\n### 异步执行器\ntokio = {version=\"1\", features = [\"full\"]}\n\
  ### markdown 转 html\nmarkdown = \"0.3.0\"\n### 文件压缩\nzip = \"0.6.2\"\n### 从终端打开链接\n\
  open = \"3.0.2\"\n```\n\n你可以看到，我们的项目中有很多库，它们都有助于不同的方面。让我们看看每个库的作用：\n\n*   `html_creator`\
  \ 库\n    * `markdown`: 允许我们将任何类型的 markdown 转换为 HTML。\n    * `serde`: 允许我们序列化和反序列化枚举或结构体。\n\
  \    * `serde_json`: 允许我们将结构体转换为 JSON 或反之。\n    * `thiserror`: 创建我们自己的错误类型。\n  \
  \  * `zip`: 创建压缩 HTML 文件的 zip。\n*   `html_creator` 命令行应用\n    * `structopt`: 用于命令行参数解析。\n\
  \    * `reqwest`: 用于发送 Web 请求。\n    * `Tokio`: 用于异步执行器。\n*   `html_creator` Web\
  \ 服务器\n    * `rocket`: 用于创建 Web 服务器。\n\n### 结构\n\n*   创建应用程序的基础\n*   Async 快速上手\n\
  *   创建 Web 服务器\n*   创建客户端\n*   测试客户端\n    *   如何改进\n*   如何发布？\n\n### 目标\n\n在本章结束时，读者将理解在\
  \ Rust 中创建命令行应用程序的过程。我们将观察项目如何拆分，在我们的案例中，我们将开发一个小型 Web 服务器和一个与其交互的客户端。在我们创建项目后，读者将学习如何将我们开发的应用程序发布到\
  \ `https://crates.io`。\n\n\n\n\n# 创建应用程序的基础 (#toc.xhtml_s71a)\n\n要开始构建项目，请确保在项目文件夹的根目录下创建一个\
  \ `bin` 目录。在 `bin` 内部，创建两个文件：`app.rs` 和 `server.rs`。这两个文件分别用于创建我们的客户端应用程序和 Web 服务器。\n\
  \n在开始处理库之前，请在 `src/lib.rs` 的顶部导入以下内容：\n\n```rust\nuse markdown::to_html;\nuse serde::{Deserialize,\
  \ Serialize};\nuse serde_json::from_str;\nuse std::fs::{read_to_string, File};\n\
  use std::io::Write;\nuse thiserror::Error;\nuse zip::result::ZipError;\nuse zip::write::FileOptions;\n\
  use zip::CompressionMethod::Stored;\nuse zip::ZipWriter;\n```\n\n我们需要问的一个问题是，我们向服务器发送了什么？简单来说，我们发送的是\
  \ `Markdown` 结构体的数组，该结构包含 `name` 和 `content` 字段。我们将使用 `name` 来为转换后的 HTML 创建文件。让我们创建\
  \ `Markdown` 结构体：\n\n```rust\n#[derive(Debug, Deserialize, Serialize, Clone)]\n\
  pub struct Markdown {\n    pub name: String,\n    pub content: String,\n}\n```\n\
  \n一个订单将是 `Markdown` 结构体的数组，如下所示：\n\n```rust\n#[derive(Debug, Deserialize, Serialize,\
  \ Clone)]\npub struct Order {\n    pub MarkdownContent: Vec<Markdown>,\n}\n```\n\
  \n我们将处理的错误非常简单，如下：\n\n- `Markdown` 对象中缺少名称\n    - 如果没有名称，则无法为文件写入名称\n- `Markdown`\
  \ 对象中缺少内容\n    - 如果不存在内容，没有理由创建整个文件\n- Zip 错误\n    - 为了避免在写入 zip 时进行大量的解包（unwrapping）\n\
  - IO 错误\n    - 为了避免在处理 IO 相关错误时进行大量的解包\n\n这可以在 `OrderError` 枚举中看到：\n\n```rust\n\
  #[derive(Debug, Error)]\npub enum OrderError {\n    #[error(\"Markdown Request {0}\
  \ has an empty name, cannot process order!\")]\n    NOName(usize),\n    #[error(\"\
  Markdown Request `{0}` has no content, cannot process order!\")]\n    NOContent(String),\n\
  \    #[error(\"Zip Error\")]\n    Zip(#[from] ZipError),\n    #[error(\"IO Error\"\
  )]\n    IO(#[from] std::io::Error),\n}\n```\n\n为了方便，我们还创建了一个类型别名 `OrderResult<T>`\
  \ 来简化开发：\n\n```rust\npub type OrderResult<T> = Result<T, OrderError>;\n```\n\n我们需要为\
  \ `Order` 实现的各个步骤如下：\n\n1. 从 JSON 文件创建 `Order`（`from_file()`）。\n2. 检查 `Order.MarkdownContent`\
  \ 是否出错（`check_errors()`）。\n3. 生成 zip 文件并返回其路径（`generate()`）。\n\n第一个函数 `from_file()`\
  \ 只需要一个字符串路径，并使用 `serde_json::from_str()` 函数结合 `std::fs::read_to_string()` 返回 `Self`，将\
  \ JSON 反序列化为我们的结构体 `Order`：\n\n```rust\nimpl Order {\n    // 从字符串创建 order 结构体\n\
  \    pub fn from_file(path: &str) -> Self {\n        from_str(read_to_string(path).unwrap().as_str()).unwrap()\n\
  \    }\n}\n```\n\n我们的第二个函数 `check_errors()` 通过遍历并检查名称是否为空来检查 `Order` 结构体的错误。如果是，则返回一个带有索引的错误\
  \ `OrderError::NOName`。我们还需要检查内容是否为空；如果是，则返回一个带有名称的错误 `OrderError::NOContent`。如果都不符合这两个标准，则跳过它：\n\
  \n```rust\npub fn check_errors(&self) -> OrderResult<()> {\n    // 遍历数组并检查错误\n \
  \   for i in 0..self.MarkdownContent.len() {\n        if self.MarkdownContent[i].name.is_empty()\
  \ {\n            return Err(OrderError::NOName(i));\n        } else if self.MarkdownContent[i].content.is_empty()\
  \ {\n            return Err(OrderError::NOContent(self.MarkdownContent[i].name.clone()));\n\
  \        } else {\n            continue;\n        }\n    }\n    Ok(())\n}\n```\n\
  \n我们的最后一个函数是最重要的一个，即 `generate()`。它实际上生成了供下载的 zip 文件。我们使用 `&self` 和一个路径；我们使用该路径作为\
  \ zip 路径并在最后返回。我们首先需要检查是否存在任何错误，如果存在，将通知服务器。请注意，当发生错误时我们不会停止服务器；这对于 Web 服务器来说是不理想的。相反，我们将打印错误（建议使用日志）。我们将创建一个\
  \ zip 文件，并对于每个 `Markdown`，将其添加到 zip 中。\n\n```rust\npub fn generate(&self, path:\
  \ &str) -> OrderResult<String> {\n    // ... 实现细节\n}\n```\n\n# 异步编程速成 (#toc.xhtml_s7a)\n\
  \n异步编程是一个非常重要的概念，当我们考虑 Web 服务器时，它被频繁使用。使用异步函数而非同步函数的优势在于，当函数在等待某些内容时，它不会阻塞线程。相反，它会等待任务完成。\n\
  \n在 Rust 中，我们称异步函数为 `async fn`。如果我们观察 `Future` trait，可以看到如下：\n\n```rust\npub trait\
  \ Future {\n    type Item;\n    type Error;\n    fn poll(&mut self) -> Result<Self::Item,\
  \ Self::Error>;\n}\n```\n\nFuture（未来）是一个不会立即完成的任务或过程；它将在以后完成。Future 有一个会被返回的项；而轮询（poll）是为了让它运行。为了管理异步操作，我们需要一个反应器，这就是\
  \ `tokio` 的用场。`tokio` 库将反应器、事件循环和运行时封装在一起。虽然我们在项目中以最简单的形式使用 `tokio`，但将在网络章节中看到更多内容。正如你想象的，`tokio`\
  \ 库运行一个任务调度器，以便可以使用底层 API，这些 API 通知事件变化，如 `epoll`（用于 Linux）、`kqueue`（用于 macOS）和\
  \ IOCP（用于 Windows）。\n\n\n\n\n\n```rust\nuse html_creator::*;\nuse rocket::fs::NamedFile;\n\
  use rocket::serde::json::Json;\nuse rocket::{get, launch, post, routes};\nuse std::fs::File;\n\
  use std::io::Write;\n```\n\n在 Web 开发中，我们有一个缩写叫做 `CRUD`：\n\n- **创建 (Create)**: POST\
  \ 方法\n- **读取 (Read)**: GET 方法\n- **更新 (Update)**: PUT 方法\n- **删除 (Delete)**: DELETE\
  \ 方法\n\n在 `rocket` 中，我们通过宏获取这些 get 方法，如果你查看我们的导入，会发现我们正在使用 `get` 和 `post`。这是合理的，因为我们需要根据订单（post）生成\
  \ zip 文件，然后使用文件名（get）下载该文件。\n\n我们将使用路由 `/gen` 来生成 zip 文件。为了实现这一点，我们将结构体 `Order`\
  \ 包装在 `Json<T>` 中，并使用它生成一个具有泛型路径名称 \"order\" 的 zip 文件。如果发生错误，我们直接使用 `eprintln!()`\
  \ 将错误打印到标准错误（stderr）。生成 zip 文件后，我们将使用 zip 路径来更新主页的下载按钮：\n\n```rust\n// 我们需要能够通过\
  \ /gen 进行生成\n#[post(\"/gen\", data = \"<order>\")]\nasync fn generate(order: Json<Order>)\
  \ {\n    // 将 json 转换为 Order\n    let order = order.into_inner();\n    let path\
  \ = match order.generate(\"order\") {\n        Ok(p) => p,\n        Err(e) => {\n\
  \            eprintln!(\"{}\", e.to_string());\n            return;\n        }\n\
  \    };\n    generate_page(&path).await;\n}\n```\n\n为了生成下载页面，我们不会创建一个复杂的的前端界面。由于我们希望关注后端方面，我们将创建一个简单的下载链接。我们将通过将路径格式化到标签中，使超链接具有正确的路径：\n\
  \n```rust\n// generate_page 将生成一个下载我们 zip 文件的页面\nasync fn generate_page(path: &str)\
  \ {\n    let html = format!(\"<a href=\\\"{}\\\" download=\\\"order\\\"> Download\
  \ your order!</a>\", path);\n    let mut file = File::create(\"index.html\").unwrap();\n\
  \    file.write_all(html.as_bytes())\n        .unwrap();\n}\n```\n\n为了在 `/` 路径下打开我们的\
  \ index 文件，我们需要创建一个 get 函数来打开 `index.html`。我们将使用 `rocket::fs::NamedFile`，因为这允许我们在\
  \ Web 上打开文件。我们还将使用 `NamedFile` 允许用户在 `/<path>` 路径下载他们的 zip 文件：\n\n```rust\n// 打开我们的\
  \ index.html\n#[get(\"/\")]\nasync fn index() -> Option<NamedFile> {\n    NamedFile::open(\"\
  index.html\").await.ok()\n}\n\n// 我们需要根据路径下载文件\n// NamedFile 允许我们在文件存在时发送它\n#[get(\"\
  /<path>\")]\nasync fn download(path: String) -> Option<NamedFile> {\n    NamedFile::open(&path).await.ok()\n\
  }\n```\n\n服务器的所有函数都写好了，剩下的就是创建我们的主函数。实现这一点有两种方法。首先，我们可以使用 `rocket::build()` 中实现的\
  \ `launch()` 方法启动 rocket 应用程序。其次，我们可以使用 `launch` 宏。\n\n在 `rocket::build()` 中，我们可以对服务器进行相当多的自定义。然而，在我们的情况下，我们只需要将函数挂载到路径\
  \ `/`。为了将这些函数挂载到路径，我们将使用 `routes!` 宏，它包含一个函数标识符的向量。我们将使用后者，因为它是更常用的方法。此外，它还允许我们甚至声明实际的\
  \ `main` 函数：\n\n```rust\n// 这将作为服务器的主函数\n#[launch]\nasync fn rocket() -> _ {\n \
  \   rocket::build()\n        .mount(\"/\", routes![generate, download, index])\n\
  }\n```\n\n要查看我们的服务器，运行命令 `cargo run --bin server`，你就能在 `http://127.0.0.1:8000/`\
  \ 查看我们的网站。为了充分利用我们的服务器，我们需要一个客户端向服务器发送请求，并能够将用户引导到主页，他们可以在那里下载 zip 文件。\n\n### 创建客户端\n\
  \n我们的客户端应用程序将写在 `src/bin/app.rs` 中，并将展示如何使用一个非常流行的 crate `structopt` 在 Rust 中创建一个命令行应用程序。还有\
  \ `clap`（`structopt` 在内部使用它），可以在 https://crates.io/crates/clap 找到。Structopt 为 `clap`\
  \ crate 提供了一个“更高”层次的抽象，简化了为命令解析 `struct/enum`。如果你想对一切拥有完全的控制权，那么 `clap` 将给你一切，代价是需要处理使用它创建命令行应用程序的各种方式。\n\
  \n在开始编写客户端之前，我们将导入必要的依赖项：\n\n```rust\nuse html_creator::*;\nuse reqwest::Client;\n\
  use structopt::StructOpt;\n```\n\nconst INDEX_PATH: &str = \"http://127.0.0.1:8000/\"\
  ;\nconst GEN_PATH: &str = \"/gen\";\n\n```rust\n#[derive(Debug, StructOpt)]\n#[structopt(name\
  \ = \"app\")]\npub enum CLI {\n    #[structopt(about = \"从 json 文件生成 zip 文件\")]\n\
  \    Generate {\n        #[structopt(short, long)]\n        path: String,\n    },\n\
  \    #[structopt(about = \"打开用户下载\")]\n    Open,\n}\n```\n\n我们现在可以进入 `main()` 函数，它是异步的，因为我们将使用\
  \ `reqwest`。为了实际运行异步应用程序，我们需要一个执行器。我们将使用流行的 `tokio` crate：\n\n```rust\n#[tokio::main]\n\
  async fn main() -> OrderResult<()> {\n    let cli: CLI = CLI::from_args();\n\n \
  \   match cli {\n        CLI::Generate { path } => {\n            let order = Order::from_file(&path)?;\n\
  \            let client = Client::new();\n            client.post(GEN_PATH)\n  \
  \              .json(&order)\n                .send()\n                .await?;\n\
  \            println!(\"订单生成成功!\");\n        }\n        CLI::Open => {\n       \
  \     open::that(INDEX_PATH)?;\n        }\n    }\n    Ok(())\n}\n```\n\n\n\n\n\n\
  ```rust\n// 从文件获取订单\nlet order = Order::from_file(&path);\n\n// 创建一个新的客户端来发送请求\n\
  let client = Client::new();\n// 创建一个 post 请求\nlet _ = client\n    .post(GEN_PATH)\
  \ // post 需要一个 url\n    .json(&order) // 将订单作为 json 发送\n    .send() // 发送请求\n  \
  \  .await // 因为 send 是异步函数，所以需要 await\n    .unwrap(); // 如果失败则 panic\n\nprint!(\"\
  n!(使用 html_creator 打开以访问下载页面！\")\n}\n\nCLI::Open => open::that(INDEX_PATH)?,\n}\n\
  \nOk(())\n}\n```\n\n我们已经完成了应用程序的编写，现在的任务是测试我们的应用程序。因此，我们将编写一个 JSON 订单并发送请求，看看它是否可以工作。\n\
  \n### 测试客户端\n\n为了测试我们的客户端，我们先从在文件 `orders.json`（位于项目根目录下）中编写订单开始。然后我们将继续添加两个简单的订单。不过，你也可以添加自己的内容，甚至可以添加一个扩展来为你自动编写订单文件：\n\
  \n```json\n{\n  \"MarkdownContent\": [\n    {\n      \"name\": \"Test1\",\n    \
  \  \"content\": \"# hello I am really c__ool__\\n## Second header\\n## Third header\"\
  \n    },\n    {\n      \"name\": \"Test2\",\n      \"content\": \"**This is cool**\
  \ I am so excited!\"\n    }\n  ]\n}\n```\n\n为了测试我们的客户端，我们首先需要启动服务器，并在项目目录下打开终端并运行以下命令：\n\
  \n`$ cargo run --bin server`\n\n当服务器在 `https://127.0.0.1:8000` 运行时，我们现在可以在另一个终端中使用客户端的生成命令了：\n\
  \n`$ cargo run --bin app -- generate -p orders.json`\n\n我们可以使用 `cargo run --bin\
  \ app -- open` 打开下载页面，并下载文件 `order.zip`，它内部应该包含两个文件：`Test1.html` 和 `Test2.html`。\n\
  \n如果我们查看每个文件，会惊喜地看到我们的 markdown 内容转换后的 HTML 代码：\n\n`Test1.html:`\n`<h1 id='hello_i_am_really_c'ool'>hello\
  \ I am really c<strong>ool</strong></h1>`\n`<h2 id='second_he'der'>Second header</h2>`\n\
  `<h2 id='third_he'der'>Third header</h2>`\n\n`Test2.html:`\n`<p><strong>This is\
  \ cool</strong> I am so <em>excited!</</em>></p>`\n\n### 如何改进\n\n为了在构建第一个项目时保持简单，我们做了一些折中，这些折中在生产环境中是应该解决的。以下是可以改进之处，以提高用户提供更好的可用性：\n\
  \n*   在创建 zip 文件时使用唯一文件名，以避免覆盖 zip 文件。\n*   创建一个命令来读取 markdown 文件目录并从其创建订单文件（有助于避免手动添加大量\
  \ markdown 内容）。\n*   在我们的示例中，我们使用了 `unwrap()`；但在生产程序中，不建议在后端应用程序中使用 panic。为了改进我们的应用程序，最好妥善地处理错误而不是使用\
  \ `unwrap()`；这可以通过返回一个 `Option` 来。\n\n### 如何发布？\n\n要发布一个 crate，我们需要遵循几个步骤以确保 `cargo`\
  \ 和 `crates.io` 拥有足够的元数据，并且所有更改都已提交。首先，我们将从最简单的步骤开始，在 `Cargo.toml` 中添加必要的元数据。\n\n\
  我们需要添加 `description` 和 `license` 才能发布。建议添加 `repository, homepage, documentation`，以便用户可以在其中查看更多关于你的库或应用程序的信息：\n\
  \n```toml\n[package]\n…\ndescription= \"从 markdown 文件目录创建 html 文件\"\nlicense= \"\
  IT\"\n[dependencies]\n…\n```\n\n接下来，我们需要确保所有更改都已添加并提交到 git 中：\n\n`$ git init # 在项目中重新初始化\
  \ git 仓库`\n`$ git add -A # 添加所有更改`\n`$ git commit -m \"First commit\" # 带有消息提交更改`\n\
  \n在 `https://crates.io` 上创建一个账户。一旦完成，访问 `https://crates.io/me` 创建一个 API token，并确保复制它。\n\
  \n`$ cargo login`\n`请在下方粘贴在 https://crates.io/me 的 API Token`\n`# 粘贴复制的 token`\n\
  \n现在，你可以使用 `cargo publish` 发布应用程序了。如你所见，这非常简单，即使你忘记了这些步骤中的任何一步，`cargo publish` 也会报错提示你。\n\
  \n### 总结\n\n在本章中，我们创建了自己的 Web 服务器和命令行应用程序。我们学习了异步编程，这在 Web 应用程序中常用。我们还探索了如何使用 `async`\
  \ 和 `await` 关键字。在我们的 Web 服务器中，我们接触了流行的 Rust Web 框架之一 `Rocket` 及其处理 HTTP 方法的有用宏。在我们的命令行应用程序中，我们学习了我最喜欢的命令行参数解析器\
  \ `StructOpt`，并看到了它是如何允许结构体/枚举来组织命令/标志的。\n\n总之，这个项目允许我们从头到尾探索创建一个 Rust 项目，并发布我们自豪的项目。Rust\
  \ 允许开发者轻松扩展到大型项目；例如，我的项目 `texcreate` 拥有一个包含 6 个库的工作区（workspace）。\n\n\n\n\n\n```rust\n\
  use serde::{Deserialize, Serialize};\nuse serde_json::{from_str, to_string_pretty};\n\
  use std::fs::{read_dir, read_to_string, File};\nuse std::io::Write;\nuse thiserror::Error;\n\
  use zip::result::ZipError;\nuse zip::write::FileOptions;\nuse zip::CompressionMethod::Stored;\n\
  use zip::ZipWriter;\n```\n\n我们的第一个函数是 `Markdown` 的 `new` 函数。因为在收集结构体 `Order` 中的\
  \ `Markdown` 时会用到它，所以顺序如下：\n\n```rust\nimpl Markdown {\n    pub fn new(name: String,\
  \ content: String) -> Self {\n        Self {\n            name,\n            content\n\
  \        }\n    }\n}\n```\n\n下一个函数稍后会用到，但现在写出来比较好。即在结构体 `Order` 中编写 `create_json_file()`。我们将创建一个新文件，并将\
  \ JSON 内容（使用 `serde_json::to_string_pretty()`）写入该文件：\n\n```rust\npub fn create_json_file(&self,\
  \ path: &str) -> OrderResult<()> {\n    let mut file = File::create(path)?; // creates\
  \ files\n    let json = to_string_pretty(&self).unwrap(); // creates json string\n\
  \    file.write_all(json.as_bytes())?; // writes the file\n    Ok(())\n}\n```\n\n\
  我们究竟如何为结构体 `Order` 中所需的 `Markdown` 向量提取必要信息呢？首先，我们将使用 `std::fs::read_dir()` 读取目录。我们将遍历目录项，获取文件名并读取文件。我们将这些值值推入并返回一个\
  \ `Order`。\n\n在提取时，我们需要考虑以下几点：\n\n*   确保文件是 markdown 文件。\n    *   检查扩展名是否为 `.md`。\n\
  \    *   如果扩展不是，则跳过该文件。\n*   确保文件名不包含 `.md`。\n    *   你不需要 `foo.md.html`，相反我们需要\
  \ `foo.html`。\n*   告诉用户我们正在处理某个文件。\n    *   这是我们极佳的调试工具。\n    *   我们可以确保每个文件都在被处理。\n\
  \n我们将在 `Order` 的 `impl` 块下的 `generate()` 中创建该函数。首先，让我们自己创建一个新的 markdown 向量，用于推入提取的值：\n\
  \n```rust\npub fn extract(path: &str) -> OrderResult<Self> {\n    // will collect\
  \ all of our markdown values\n    let mut md_content = Vec::new();\n```\n\n接下来，我们需要遍历\
  \ `std::fs::read_dir()`，它返回 `Result<ReadDir>`，使得每个项的类型为 `Result<DirEntry>`。因此，为了方便起见，我们在循环中创建一个新的绑定\
  \ `entry`，它会处理 `entry` 中的 `Result`。这样我们我们就得到了 `DirEntry`。为了告诉用户我们正在处理哪个文件，我们链式调用了\
  \ entry 中的 `path()` 函数（它返回文件路径）和 `display()` 函数（它允许我们打印路径）：\n\n```rust\n// iterate\
  \ all of the entries in read_dir()\nfor entry in read_dir(path)? {\n    // handle\
  \ error so entry is DirEntry\n    let entry = entry?;\n    // notify user we are\
  \ processing it\n    println!(\"Processing {}\", entry.path().display());\n```\n\
  \n我们将创建一个绑定 `path` 来包含 `entry` 的路径，这样我们就不会遇到释放临时值的问题。有了路径，我们可以获取该项的扩展名。由于 `extension()`\
  \ 函数返回 `Option<&OsStr>`，我们需要解包它并使用 `to_str()` 将其转换为字符串。\n\n**注意：OsStr 是操作系统表示字符串的方式。**\n\
  \n```rust\n// grab the path\nlet path = entry.path();\n// get the extension of the\
  \ path\nlet extension = path.extension()\n    .unwrap()\n    .to_str();\n```\n\n\
  可以使用 `match` 语句来处理 markdown 文件或跳过任何其他文件。当我们处理 markdown 文件时，提取文件名，并确保替换掉 “.md”，然后使用我们的绑定\
  \ `path` 通过 `std::fs::read_to_string` 获取内容。我们将 markdown 值推入 `md_content`。一旦 `for`\
  \ 循环结束，我们使用使用向量 `md_content` 返回订单：\n\n```rust\n// make sure the extension is markdown\n\
  match extension {\n    Some(\"md\") => {\n        // extract filename from it\n\
  \        let filename = path.file_name()\n            .unwrap()\n            .to_str()\n\
  \            .unwrap()\n            .replace(\".md\", \"\");\n        // read the\
  \ file using our binding\n        let content = std::fs::read_to_string(path).unwrap();\n\
  \        // push the markdown value\n        md_content.push(Markdown::new(filename,\
  \ content));\n    }\n    _ => {}\n}\nOk(Order { md_content })\n```\n\n\n\n\nRust\
  \ 不仅保证了程序中的内存安全，还完成了线程安全的这一艰巨工作。这种安全性允许开发者同时且无畏地运行代码，而无需处理竞态条件（以不一致的方式访问数据）、死锁（线程相互等待导致无法继续执行）以及\
  \ C/C++ 并发程序中常见的其他错误。\n\n在本章中，我们将探索使用标准库的 `threads`，以及 Rust `1.63.0` 引入的新作用域线程（scoped\
  \ threads）。使用线程只是并发的一半；我们仍然需要使用类型在线程内部传递值，以便我们可以修改它们的值。\n\n### 结构\n\n*   智能指针\n\
  *   并发的重要性\n*   使用线程实现并发\n*   使用通道传递值\n*   使用锁类型进行读/写绑定\n*   使用 Mutex 进行单线程访问\n\
  *   使用 RwLock 使用多线程读取\n\n### 目标\n\n在本章结束时，读者将能够通过在线程之间安全地共享和同步值，从而在他们的程序中无畏地创建并发模型。这将向读者介绍提供堆内存分配类型的智能指针，并学习使用它们与其他同步类型（如\
  \ `channels`、`Mutex` 和 `RwLock`）一起跨线程安全地传递值。\n\n### 智能指针\n\nRust 中的智能指针允许开发者以简单的方式创建堆分配的绑定。我们将探索在本书中看到的各种智能指针。需要注意的是，所有这些智能指针都拥有其内部的值。\n\
  \n### 使用 box 创建堆分配的值\n\n创建堆分配值最简单的方法是使用 `Box` 类型。它会在堆上为内部的值分配内存。这种用法的某些用途包括构建链表，或返回未知大小的值。\n\
  \n如果我们尝试在不使用 `Box` 的情况下创建链表，我们将面临如下的递归问题：\n\n```rust\ntype Link = Option<Node>;\n\
  \nstruct Node{\n    value: u32,\n    next: Link,\n    prev: Link,\n}\nstruct LinkedList{\n\
  \    length: usize,\n    head: Link,\n    tail: Link\n}\n```\n\n```text\n/* Compiler\
  \ Error:\nerror[E0072]: recursive type `Node` has infinite size\n→ test.rs:2:1\n\
  |\n2 | struct Node{\n| ^^^^^^^^^^^ recursive type has infinite size\n3 |     value:\
  \ u32,\n4 |     next: Link,\n|             ---- recursive without indirection\n\
  5 |     prev: Link,\n|             ---- recursive without indirection\n|\nhelp:\
  \ insert some indirection (e.g., a `Box`, `Rc`, or `&`) to make `Node` representable\n\
  |\n4 ~     next: Box<Link>,\n5 ~     prev: Box<Link>,\n*/\n```\n\n采取编译器的建议，让我们修复\
  \ `Link` 类型，并将 `Option<Node>` 替换为 `Option<Box<Node>>`。这将允许我们递归地访问和使用节点。如果我们尝试编译代码，将不再遇到节点的编译错误了，那么我们如何使用\
  \ `Box` 类型呢？\n\n要创建一个新的 `Box` 值，我们使用 `Box::new()` 函数，如下代码所示。它会在堆上为内部的值分配内存并拥有该值。要访问内部的值，我们使用原始指针\
  \ `*` 对其进行解引用。Box` 的 `into_inner()` 函数目前仍处于实验阶段，但一旦稳定，它将是更好的选择。\n\n```rust\nfn main(){\n\
  \    let boxed = Box::new(8);\n    println!(\"{}\", *boxed)\n}\n// Output:\n// 8\n\
  ```\n\n### 使用 Rc & Arc 进行引用计数\n\n如果我们想要一个值有多个所有者，我们需要使用引用计数来保证内存安全。我们曾看到它被用于演示作用域。为了复习记忆，当创建新所有者时（使用\
  \ `clone()`）引用计数器增加，当被丢弃时（使用 `drop()` 或超出作用域）引用计数器减少。\n\n`Rc` 和 `Arc` 的区别在于 `Arc`\
  \ 是原子引用计数器，它实现了 `Sync` 特性，这进一步允许它用于多线程工作负载。在本章中，我们将经常使用 `Arc`。因此，为了熟悉，让我们来看一些使用它的示例：\n\
  \n```rust\nuse std::sync::Arc;\nfn main(){\n    let mut val = Arc::new(90);\n  \
  \  // make_mut 返回 &mut T\n    // 要访问 T，使用 * 解引用\n    *Arc::make_mut(&mut val) +=\
  \ 10;\n    let mut other_val = val.clone();\n}\n```\n\n# 使用 Cell 和 RefCell 实现内部可性\n\
  \n`Cell` 和 `RefCell` 的区别在于该值是否实现了 `Copy`。`Cell` 要求内部值实现 `Copy`，而 `RefCell` 不需要，并使用运行时锁定来保证内存安全。如果我们确实需要使用内部可变，大多数情况将使用\
  \ `RefCell`：\n\n```rust\nuse std::cell::Cell;\n#[derive(Debug, Copy)]\nstruct Something{\n\
  \    normal: i32,\n    cool: Cell<i32>\n}\n\nfn main(){\n    let smth = Something{\n\
  \        normal: 32,\n        cool: Cell::new(90)\n    };\n    // 不可变错误\n    //\
  \ smth.normal += 1;\n    smth.cool.set(30); // 这是可以的\n    println!(\"{:?}\", smth);\n\
  }\n// Output: Something { normal: 32, cool: Cell { value: 30 } }\n```\n\n\n\n\n\n\
  要开始本节，请确保你的 Rust 编译器版本至少为 1.63.0。可以使用 `rustc -V` 进行检查，或使用 `rustc update stable`\
  \ 进行更新。我们需要编译器达到这个版本，因为 1.63.0 引入了作用域线程（scoped threads），我们稍后会讨论。Rust 的标准库线程使用操作系统的原生线程；这在考虑底层编程时非常有用。要创建一个新线程，我们使用\
  \ `std::thread::spawn()` 函数，它返回一个 `JoinHandle`。`JoinHandle` 允许一个线程加入另一个线程，且该句柄是所有有的，不能克隆。\n\
  \n让我们来看一个使用线程的简单示例：\n\n```rust\nuse std::thread;\n\nfn main(){\n  let mut handles\
  \ = Vec::new();\n  for i in 0..10{\n    handles.push(\n      thread::spawn(move\
  \ ||{\n      println!(\"{}\", i)\n      })\n    );\n  }\n  for handle in handles{\n\
  \    handle.join().unwrap();\n  }\n```\n\n如果我们想打印向量的元素呢？在这种情况下，让我们看看下面的示例：\n\n```rust\n\
  use std::thread;\n\nfn main(){\n  let elements = vec![1,2,3,4,5,6,7];\n  let mut\
  \ handles = Vec::new();\n  for i in 0..elements.len(){\n    handles.push(\n    \
  \  thread::spawn(move ||{\n      println!(\"{}\", elements[i]);\n      })\n    );\n\
  \  }\n  for handle in handles{\n    handle.join().unwrap();\n  }\n}\n```\n\n如果我们尝试编译这个程序，会遇到以下错误：\n\
  \n```text\n|\n4 |      let elements = vec![1,2,3,4,5,6,7];\n|         move occurs\
  \ because `elements` has type `Vec<i32>`, which does not implement the `Copy` trait\n\
  …\n8 |               thread::spawn(move ||{\n|                               ^^^^^^\
  \ value moved into closure here, in previous iteration of loop\n9 |            \
  \   |                               -------- use occurs due to use in closure\n\
  error: aborting due to previous error\n```\n\n关于此错误的更多信息，请尝试 `rustc --explain E0382`。\n\
  \n在我们讨论 `Mutex` 时将能够解决这个问题，但我们也可以使用作用域线程。这是 Rust 1.63.0 中添加的一个新功能，它允许将非静态值安全地传递到线程，而标准库线程需要静态值。来看下面的示例：\n\
  \n```rust\nuse std::thread::scope;\n\nfn main() {\n  let elements = vec![1, 2, 3,\
  \ 4, 5, 6, 7];\n  for i in 0..elements.len() {\n    // 为创建线程创建一个作用域\n    scope(|s|\n\
  \      s.spawn(|| println!(\"{}\", elements[i])).unwrap()\n    );\n  }\n}\n```\n\
  \n在创建作用域线程时，如果线程没有被加入，作用域会在函数返回之前自动将其加入。在我们的情况下，由于作用域内只启动了一个线程，我们需要确保它回到了主线程，否则它可能会超出生命周期。\n\
  \n使用作用域线程的优势在于能够创建使用非静态绑定的线程；这减少了对智能指针的需求，从而减少了堆空间的使用。在 C++ 中，我们有 `jthread`，它提供了一个与\
  \ `std::thread` 类似的类型，但在析构时会自动重新加入。虽然在本章的剩余部分我们不会使用这种新类型的线程，但我认为这种类型在未来会被更多使用。\n\
  \n### 使用通道传递值\n\n消息传递为开发者提供了多生产者单订阅者队列，允许同步（`sync_channel()`）或异步（`channel()`）地发送和接收值。由于\
  \ `channel()` 是异步的，它不会阻塞任何线程。\n\n如果我们想打印向量的元素呢？在这种情况下，让我们看看下面的示例：\n\n```rust\nuse\
  \ std::thread;\nuse std::sync::mpsc::channel;\nuse std::io;\n\nfn main() -> Result<()>\
  \ {\n    let (tx, rx) = channel();\n    let elements = vec![1, 2, 3, 4, 5, 6, 7];\n\
  \    let mut handles = Vec::new();\n\n    for i in 0..elements.len() {\n       \
  \ let tx = tx.clone();\n        let el = elements[i];\n        let handle = thread::spawn(move\
  \ || {\n            tx.send(el).unwrap();\n        });\n        handles.push(handle);\n\
  \    }\n\n    drop(tx);\n\n    for received in rx {\n        println!(\"Received:\
  \ {}\", received);\n    }\n\n    for handle in handles {\n        handle.join().unwrap();\n\
  \    }\n\n    Ok(())\n}\n```\n\n如果我们尝试编译这个程序，会遇到以下错误：\n\n```text\n|\n4 |      let\
  \ elements = vec![1,2,3,4,5,6,7];\n|         move occurs because `elements` has\
  \ type `Vec<i32>`, which does not implement the `Copy` trait\n…\n8 |           \
  \    thread::spawn(move ||{\n|                               ^^^^^^ value moved\
  \ into closure here, in previous iteration of loop\n9 |               println!(\"\
  {}\", elements[i]);\n|                               -------- use occurs due to\
  \ use in closure\nerror: aborting due to previous error\n```\n\n关于此错误的更多信息，请尝试 `rustc\
  \ --explain E0382`。\n\n在我们讨论 `Mutex` 时将能够解决这个问题，但我们也可以使用作用域线程。这是 Rust 1.63.0 中添加的一个新功能，它允许将非静态值安全地传递到线程，而标准库线程需要静态值。来看下面的示例：\n\
  \n\n\n\n互斥互锁（Mutex）提供了一种通过锁定值（使用 `lock()` 方法）来写入/读取绑定的方法。这会返回一个 `MutexGuard` 类型，该类型保护该值，或者阻塞线程直到任务完成（离开作用域）。当该值超出作用域时，它会自动解锁（不需要\
  \ `unlock()` 方法），另一个线程就可以锁定该值。\n\n我们该如何在多个线程之间安全地共享 `Mutex` 呢？如果出现这种情况，我们将使用 `Arc`\
  \ 或原子引用计数计数器。通过使用 `Arc::clone()` 函数，线程可以安全地获得该值的所有权（增加引用计数），并在离开作用域时，引用计数会减少。\n\n\
  为了演示如何使用 `Mutex`，我们将创建一个程序，询问学生的成绩并输入这些成绩，同时在单独的线程中打印它们。为了保持程序简单，我们将使用一个向量存储成绩，并封装在\
  \ `Arc<Mutex<T>>` 中。\n\n创建一个文件 `mutex_example.rs` 并添加以下导入内容以及针对 `Arc<Mutex<Vec<u32>>>`\
  \ 的 `Students` 类型别名：\n\n```\nuse std::io::{stdin, Result};\nuse std::sync::{Arc,\
  \ Mutex};\nuse std::thread;\npub type Students = Arc<Mutex<Vec<u32>>>;\n```\n\n\
  我们将使用一些辅助函数来减少代码冗余。首先，让我们创建一个创建空 `Students` 类型的函数：\n\n```\nfn new_empty_students()\
  \ -> Students {\n    Arc::new(Mutex::new(Vec::new()))\n}\n```\n\n我们的最后一个辅助函数将询问用户的成绩，并通过修剪后解析字符串来返回成绩：\n\
  \n```\nfn get_grade(student_num: u32) -> u32 {\n    // 获取用户输入的成绩\n    println!(\"\
  Please enter grade for student {}: \", student_num);\n    // 创建空字符串用于输入\n    let\
  \ mut input = String::new();\n    // 从标准输入读取\n    stdin().read_line(&mut input).unwrap();\n\
  \    // 修剪后将字符串解析为 u32\n    input.trim().parse().unwrap()\n}\n```\n\n现在我们可以开始编写主函数了。我们将返回\
  \ `Result<()>` 并从初始化学生数据和一个用于线程连接句柄的向量开始：\n\n```\nfn main() -> Result<()> {\n  \
  \  let students = new_empty_students();\n    let mut join_handles = Vec::new();\n\
  ```\n\n接下来，我们需要询问用户将有多少学生并处理输入：\n\n```rust\n// 获取学生人数\nprintln!(\"Please enter number\
  \ of students: \");\nlet mut num_input = String::new();\nstdin().read_line(&mut\
  \ num_input)?;\n// 将输入解析为 u32\nlet num_stu: u32 = num_input.trim().parse().unwrap();\n\
  ```\n\n### 处理成绩\n\n由于我们已经有了学生人数，可以使用 `for` 循环获取每个学生的成绩，并创建一个线程来推送每个成绩。一旦创建了线程，我们将其推入\
  \ `join_handles`，以便我们可以在主线程结束尾时连接（join）它们。\n\n我们创建一个循环，从 0 计数到学生人数，任务是输入每个学生的成绩。首先，我们需要\
  \ `students` 的可变引用，因此在循环中，我们创建一个绑定 `s`，它是 `students` 的克隆（`students.clone()`）。我们使用辅助函数\
  \ `get_grade(i+1)` 获取成绩，同时确保使用 `i + 1`，因为我们的计数从 0 开始。由于我们拥有 `students` 及其成绩的副本，我们创建一个线程\
  \ `t` 来推送我们的成绩。为了向 `s` 写入，我们需要创建一个新的绑定 `s` 并锁定它。锁定后，我们将成绩推入其中并将线程推入我们的绑定 `join_handles`（这样我们以后就可以连接线程了）：\n\
  \n```rust\n// 循环获取每个学生的成绩\nfor i in 0..num_stu {\n    // 获取对 students 的共享访问\n  \
  \  let mut s = students.clone();\n    // 创建一个线程输入学生成绩\n    let grade = get_grade(i\
  \ + 1);\n    let t = thread::spawn( move || {\n        let mut s = s.lock().unwrap();\n\
  \        s.push(grade)\n    });\n    join_handles.push(t);\n}\n```\n\n### 打印成绩\n\
  \n我们的下一个工作是打印学生的成绩。我们希望它看起来像 `Student {num} => Grade {grade}`。为了实现这一点，我们将创建一个锁定\
  \ `students` 的线程，遍历索引并按指定格式打印。创建线程后，我们需要将其推入 `join_handles`：\n\n```rust\nlet t =\
  \ thread::spawn(move ||{\n    let s = students.lock().unwrap();\n    for i in 0..s.len(){\n\
  \        println!(\"Student {} => Grade: {}\", i+1, s[i])\n    }\n});\njoin_handles.push(t);\n\
  ```\n\n现在，剩下的就是遍历我们所有的连接句柄并连接它们。\n\n```rust\nfor jh in join_handles {\n    jh.join().unwrap();\n\
  }\nOk(())\n}\n```\n\n\n\n\n```rust\n// 将信息拷贝到我们的线程\nlet i = infos.clone();\n\n//\
  \ 遍历目录中的每个 DirEntry\nfor d in dir{\n    // 解包目录项\n    let d = d.unwrap();\n    //\
  \ 锁定以写入\n    let mut i = i.write().unwrap();\n    // 获取文件类型\n    let type_ = d.file_type().unwrap();\n\
  \    // 初始化内容\n    let mut content = String::new();\n    // 如果内容是目录，放入 \"Directory\"\
  \n    if type_.is_dir(){\n        content.push_str(\"Directory\")\n    } else {\n\
  \        // 如果是文件，从 read_string() 获取内容\n        content = read_to_string(d.path()).unwrap()\n\
  \    }\n    // 将 Info 体推入 i\n    i.push(Info::new(type_, content, d.path()))\n}\n\
  // 使用 read() 更新我们的向量\nlet updated = i.read().unwrap();\n// 使用 map 遍历 updated 并打印每个\
  \ &Info\nlet u = updated.iter().map(|x|{\n    let mut type_ = String::new();\n \
  \   // 如果类型是目录，打印 Directory\n    if x.type_.is_dir(){\n        type_.push_str(\"\
  Directory\")\n    } else {\n        // 如果类型是文件，打印 File\n        type_.push_str(\"\
  File\")\n    }\n    // 获取路径作为 &str\n    let path = x.path.to_str().unwrap();\n \
  \   println!(\"Path: {} | File type: {} \\nContent: \\n{}\\n\",\n    path, type_,\
  \ x.content)\n}).collect::<()>();\n// 返回此打印集合\nu\n});\n```\n\n最后，我们需要将线程合并到主线程并返回\
  \ `Ok(())`，因为我们的主函数返回 `Result<>`：\n\n```rust\n// 合并线程\nt.join().unwrap();\n// 在最后返回\
  \ Ok\nOk(())\n```\n\n在编译程序之前，创建一个名为 `important` 的目录并用随机文件和目录填充它。为了示例演示，我们有一些内部带有短文本的空文件：\n\
  \n```bash\n$ rustc rwlock_example.rs\n$ ./rwlock_example\n```\n\nPath: important/very_important\
  \ | File type: Directory\nContent:\nDirectory\nPath: important/test.txt | File type:\
  \ File\nContent:\ntest test test\nPath: important/lala.text | File type: File\n\
  Content:\nlalalalalalaalalalalalala\nPath: important/empty.txt | File type: File\n\
  Content:\n\n使用锁类型对于跨线程安全地写入/读取绑定是非常有用的。`tokio` crate 中也有异步版本，这允许它们以异步方式运行。如果你的应用程序需要大量读取，建议使用\
  \ `RwLock`，而通常情况下，`Mutex` 就足够了。增加性能的另一种方法是使用并行性。结合 `rayon` 库中的并发性，它允许用户将代码转换为并行任务，例如迭代器。\n\
  \n### 结论\n\n在本章中，我们查看了 Rust 的并发，并讨论了如何使用标准库的 `thread` 模块将进程产生到不同的线程中并将它们合并回主线程。我们还查看了如何使用\
  \ `Arc` 安全地跨线程共享值，使用 `channels` 发送/接收值，或使用锁类型写入/读取值。\n\n### 关键事实\n\n*   将值封装在 `Arc`\
  \ 内部以跨多个线程发送。\n*   要发送/接收值，使用 `channels` 或 `sync_channels`。\n*   设置一个单独的线程接收值，同时在主线程发送值。\n\
  *   在发送值后合并线程。\n*   写入时锁定线程。这是为了安全地写入值而不覆盖/损坏该值。\n\n### 练习题\n\n1. 创建一个接收消息并向用户显示它们的注释/消息应用程序（可以使用\
  \ `rocket` 在 Web 上实现）。确保询问他们的姓名和消息，同时记录姓名、消息和接收时间（使用 `chrono`）。\n2. 创建一个列出内容内容的程序。使用线程处理\
  \ HTML 代码并使用通道（使用 `crossbeam` crate）发送/接收值将会很好。\n\n### 答案\n\n1. 我们的消息应用程序将是基于 Web\
  \ 的并使用表单，我们将要求用户提交姓名和消息。消息将如下所示；这将通过将消息保存在 JSON 文件 `messages.json` 中来实现。首先，让我们创建项目：\n\
  \n```bash\n$ cargo new --lib\n```\n\n添加以下依赖项：\n\n```toml\n[dependencies]\nchrono\
  \ = \"0.4\"\nrocket = {version = \"0.5.0\", features = [\"json\"]}\nserde = { version\
  \ = \"1.0\", features = [\"derive\"] }\nserde_json = \"1.0\"\n```\n\n*   `Chrono`\
  \ 将允许我们记录当前时间。\n*   `Rocket` 将允许我们创建一个 Web 服务器。\n*   `Serde` 将允许我们序列化/反序列化结构体/枚举。\n\
  *   `Serde_json` 将允许我们将值序列化/反序列化为 JSON。\n\n在继续之前，我们需要在项目根目录下创建一些代码中使用的文件：\n\n1.\
  \ 创建文件 `messages.json` 并添加一个空数组。\n2. 创建文件 `index.html` 并保持其为空。\n3. 创建文件 `base.html`\
  \ 并向其中添加以下内容：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta\
  \ charset=\"UTF-8\">\n    <title>Home</title>\n</head>\n<body>\n    <form method=\"\
  post\" action=\"/\">\n        <h3>Send a Message!</h3><br>\n        <label for=\"\
  name\">Name</label>\n        <input type=\"text\" name=\"name\" id=\"name\" placeholder=\"\
  Name...\"><br>\n        <br>\n        <label for=\"message\">Message</label>\n \
  \       <textarea name=\"message\" id=\"message\" cols=\"40\" rows=\"5\" placeholder=\"\
  Message...\"></textarea> <br>\n        <br>\n        <input type=\"submit\" value=\"\
  Submit\">\n    </form>\n    <div>\n        <h2>MESSAGES</h2>\n    </div>\n</body>\n\
  </html>\n```\n\n现在我们有了存储消息的地方、Web 应用程序的主页，以及一个我们在生成主页时将使用的基础文件。我们可以开始在 `src/lib.rs`\
  \ 中编写我们的库了：\n\n在文件顶部添加以下导入：\n\n```rust\nuse std::fs::{File, read_to_string};\nuse\
  \ rocket::form::FromForm;\nuse serde::{Deserialize, Serialize};\nuse chrono::Utc;\n\
  use serde_json::{from_str, to_string_pretty};\nuse std::io::{Result, Write};\n```\n\
  \n现在，我们可以创建一个表示用户消息的结构体，命名为 `Message`。我们需要派生 `Serialize`、`Deserialize` 以便将其转换为 JSON，而\
  \ `FromForm` 将允许 `rocket` 处理该表单。我们需要将 `received_at` 字段设置为 `Option<String>`，因为我们将自动设置它而不是由用户：\n\
  \n```rust\n#[derive(Debug, Clone, Serialize, Deserialize, FromForm)]\npub struct\
  \ Message{\n    // 姓名\n    pub name: String,\n    // 用户消息\n    pub message: String,\n\
  \    // 消息接收的时间\n    pub received_at: Option<String>\n}\n```\n\n我们需要为 `Message`\
  \ 实现的函数包括将消息的 `received_at` 字段设置为当前时间的方法，以及将我们的消息转换为 HTML 代码的方法。在展示我们的函数之前，这是我们希望\
  \ HTML 代码看起来的样子：\n\n```html\n<div>\n    <h4>Name [Received Time]</h4>\n    <p>Message\
  \ </p>\n</div>\n```\n\n现在，让我们看一眼我们实现的函数：\n\n```rust\nimpl Message{\n    // 将接收到的消息更新为当前时间\n\
  \    pub fn received(&mut self){\n        self.received_at = Some(Utc::now().to_string())\n\
  \    }\n    // 将我们的消息转换为需要的 HTML 代码\n    pub fn to_html(&self) -> String{\n    \
  \    // 将包含所有的 HTML 部分\n        let mut html_parts = Vec::new();\n        // 起始和结束\
  \ div 标签的元组\n        let div_header = (\"<div>\", \"</div>\");\n        // 推入起始\
  \ div\n        html_parts.push(div_header.0.to_string());\n```\n\n\n\n\n\n```rust\n\
  // html version for our name and received_at\nlet name = format!(\"\\t<h4>{} [{}]</h4>\"\
  , &self.name, self.received_at.clone().unwrap());\n\n// message will be placed as\
  \ paragraph text\nlet message = format!(\"\\t<p>{}</p>\", &self.message);\n\n//\
  \ push the name first\nhtml_parts.push(name);\n\n// push the message\nhtml_parts.push(message);\n\
  \n// push the endng div tag\nhtml_parts.push(div_header.1.to_string());\n\n// join\
  \ all of the html code seperated by new line\nhtml_parts.join(\"\\n\")\n}\n}\n\n\
  ```我们的下一个需求是一种获取消息向量的方法，以及一种重写我们的 `messages.json` 的方法：\n\n```rust\n// returns a\
  \ vector of Message from messages.json\npub fn get_messages() -> Vec<Message>{\n\
  \    from_str(&read_to_string(\"messages.json\").unwrap()).unwrap()\n}\n\n// rewrites\
  \ messages.json with a vector of Message\npub fn rewrite_messages(messages: Vec<Message>)\
  \ -> Result<()>{\n    // gets our messages into json code\n    let string = to_string_pretty(&messages).unwrap();\n\
  \    // create messages.json\n    let mut file = File::create(\"messages.json\"\
  )?;\n    // write our json code into messages.json\n    file.write_all(string.as_bytes())?;\n\
  \    Ok(())\n}\n```\n\n最后，我们需要一个函数来从 `base.html` 返回基础 HTML 代码。这只需返回来自 `std::fs::read_to_string()`\
  \ 的字符串：\n\n```rust\n// returns the base of the html file for index.html\npub fn\
  \ get_base() -> Result<String>{\n    // read base.html\n    let s = read_to_string(\"\
  base.html\")?;\n    // return the string\n    Ok(s)\n}\n```\n\n为了开始 Web 服务器的工作，我们需要创建一个目录\
  \ `src/bin` 并在其中创建一个文件 `src/bin/server.rs`。在顶部添加以下导入：\n\n```rust\nuse std::fs::File;\n\
  use rocket::{get, post, launch, routes, uri};\nuse rocket::form::Form;\nuse messenger::*;\n\
  use std::io::Write;\nuse rocket::fs::NamedFile;\nuse std::thread;\nuse std::sync::{Arc,\
  \ Mutex, RwLock};\nuse rocket::response::Redirect;\n```\n\n在我们的服务器中，我们将使用两个函数来处理请求。首先，我们需要一个函数来处理用户提交表单的情况；这是一个\
  \ POST 请求，并将新消息推入我们来自 `messages.json` 的消息数组并重写 `messages.json`。\n\n其次，我们需要一个函数来写入并打开我们的首页\
  \ `index.html`。这是一个 GET 请求。我们将创建一个线程为每条消息处理我们的 HTML 代码。如果没有消息，它将仅返回“No Messages”。我们将使用\
  \ `Mutex` 向我们的 HTML 代码向量写入内容，而 `RwLock` 将用于跨线程读取我们的消息向量。\n\n让我们从编写函数 `post_message()`\
  \ 开始。我们期望它的数据是一个表单，因此我们的参数类型将为 `Form<Message>`。要获取内部的消息，我们使用函数 `into_inner()`。我们对此消息的即时操作是更新它的接收时间。然后我们将使用\
  \ `get_messages()` 获取消息。我们将消息推入我们的消息向量，并使用这个新向量通过 `rewrite_messages()` 重写 `messages.json`。为了避免用户在提交后需要返回或重新输入\
  \ URL，我们将用户重定向到我们尚未创建的函数 `index()`，它将即时更新消息板：\n\n```rust\n#[post(\"/\", data = \"\
  <message>\")]\npub fn post_message(message: Form<Message>) -> Redirect{\n    //\
  \ get Message from Form\n    let mut message = message.into_inner();\n    // update\
  \ message's received_at\n    message.received();\n    // get the list of messages\n\
  \    let mut messages = get_messages();\n    // push the latest message\n    messages.push(message);\n\
  \    // rewrite index.html\n    rewrite_messages(messages).unwrap();\n    // redirect\
  \ to home page\n    Redirect::to(uri![index])\n}\n```\n\n为了开始编写 `index()` 函数，我们应该创建文件\
  \ `index.html`，初始化一个由 `Arc` 和 `Mutex` 包裹的 HTML 代码向量，并初始化一个由 `Arc` 和 `RwLock` 包裹的消息向量：\n\
  \n```rust\n#[get(\"/\")]\npub async fn index() -> Option<NamedFile>{\n    // ...\
  \ implementation details ...\n}\n```\n（注：输入中用于 `index` 实现的文本是片段化的；我根据提供的结构化要求对周围的逻辑进行了格式化处理。）\n\
  \n为了开始 Web 服务器的工作，我们需要创建一个目录 `src/bin` 和文件 `src/bin/server.rs`。\n\n最后，我们需要编写主函数\
  \ `rocket()` 来启动我们的服务器：\n\n```rust\n#[launch]\nasync fn rocket() -> _ {\n    rocket::build()\n\
  \        .mount(\"/\", routes![index, post_message])\n}\n```\n\n我们可以使用 `cargo run`\
  \ 运行程序并访问 `http://127.0.0.1:8000/`。由于我们的 `messages.json` 是空的，如图 5.1 所示，我们看到的是没有消息的提示。\n\
  \n\n\n\n\n## 2. 该项目基于一个计划构建在网站上的实际服务；我们的目标是使用 RSS 馈送来列出其内容。以下是我们将收集的内容：\n\n* 文章标题\n\
  * 发布日期\n* 文章链接\n* 分类\n* 描述\n\n首先，让我们使用 `cargo new rss_feed` 创建新项目并添加以下依赖项：\n\n```toml\n\
  [dependencies]\nrocket = \"0.5.0-rc.2\"\nrss = \"2.0.1\"\ncrossbeam = \"0.8.2\"\n\
  ```\n\n我们将使用 `crossbeam` crate 来处理通道（channels），而不是标准库的版本，因为 `crossbeam` 提供了更好的性能，而且它们的通道是多生产者多消费者的，这不同于标准库的多生产者单消费者模型。\n\
  \n首先，删除 `src/main.rs` 中的所有内容并添加以下导入：\n\n```rust\nuse std::fs::{create_dir, read_to_string};\n\
  use crossbeam::channel::{Sender, Receiver, unbounded};\nuse rss::{Channel, Item};\n\
  use std::fs::File;\nuse std::io::Write;\nuse std::path::Path;\nuse std::thread;\n\
  use rocket::{launch, get, routes};\nuse rocket::fs::{FileServer, NamedFile};\n```\n\
  \n我们的下一个任务是创建结构体 `Feed`，其字段反映了我们将收集的内容：\n\n```rust\n// 表示每个 Feed 文章的结构体\n#[derive(Debug,\
  \ Clone)]\npub struct Feed{\n    pub title: String,\n    pub pub_date: String,\n\
  \    pub link: String,\n    pub categories: Vec<String>,\n    pub description: String,\n\
  }\n```\n\n对于我们的馈，我们需要使用 RSS 通道项（即 `rss::Item`）创建一个 `new()` 函数。创建 `Feed` 的第一个任务是获取一个包含所有分类名称的向量，让我们从这里开始：\n\
  \n```rust\nimpl Feed{\n    // 从通道项中提取必要信息以创建一个新的 feed\n    pub fn new(item: &Item)\
  \ -> Self{\n        //为所有分类创建一个向量\n        let mut categories = Vec::new();\n  \
  \      for c in &item.categories{\n            // 推入每个分类的名称\n            categories.push(c.name.clone())\n\
  \        }\n```\n\n我们的下一个任务是创建 `Feed` 或 `Self`，这需要克隆项字段并进行解包（unwrap），因为它们都被封装在 `Option`\
  \ 中。由于我已经确保了我们将使用的 XML 文件中的每个字段都存在，因此不需要担心崩溃（panic）：\n\n```rust\n        Self{\n\
  \            title: item.title.clone().unwrap(),\n            pub_date: item.pub_date.clone().unwrap(),\n\
  \            link: item.link.clone().unwrap(),\n            categories,\n      \
  \      description: item.description.clone().unwrap(),\n        }\n    }\n}\n```\n\
  \n我们需要编写的下一个函数是 `to_html()`，它用于构建每篇文章在 `index.html` 文件以及相应的 `Feed/foo.html` 文件中的显示形式。为了确保路径不会出现问题，我们需要从标题中移除问号、单引号和空格：\n\
  \n```rust\npub fn to_html(&self) -> String{\n    // 对于文件名，我们需要对标题处理\n    let mut\
  \ title = self.title.clone();\n    // 移除标题中的空格\n    title = title.replace(\" \"\
  , \"\");\n    // 移除任何问号以防干扰路径\n    if title.contains(\"?\"){\n        title = title.replace(\"\
  ?\", \"\");\n    } else if title.contains(\"'\"){\n        title = title.replace(\"\
  '\", \"\");\n    }\n    // 路径将在 Feed 目录下\n    let path = format!(\"Feed/{}.html\"\
  , title);\n\n    // 对于我们馈 的文件，它将包含文章的描述：\n    // 在路径创建文件\n    let mut file = File::create(&path).unwrap();\n\
  \    // 在文件内写入文章的描述\n    file.write_all(self.description.as_bytes()).unwrap();\n\
  ```\n\n现在，我们可以处理每个 feed 在 `index.html` 文件中应该什么样了；让我们看看它应该是什么样的：\n\n```html\n<a href='path'><h4>Title</h4></a>\n\
  <h5> Published at Pub_Date </h5>\n<h5> Categories category 1, …</h5>\n<a href='link'><h5>\
  \ View Online </h5>\n```\n\n对于每一行，我们将使用 `format!()`，这样就可以将变量加入到各自的位置。对于 `self.categories`，我们将使用\
  \ `join()` 方法将其连接成一个字符串。\n\n```rust\n// 格式化的逻辑示例：\n// let html = format!(\"<a href='{}'><h4>{}</h4></a>\"\
  , path, self.title);\n// let date = format!(\"<h5> Published at {}</h5>\", self.pub_date);\n\
  // let cats = format!(\"<h5> Categories {}</h5>\", self.categories.join(\", \"));\n\
  // let link = format!(\"<a href='{}'><h5> View Online </h5>\", self.link);\n```\n\
  \n\n\n\n\n要使用这些函数，我们将创建一个自己的函数 `index()`，它将创建并打开 `index.html`。该函数将使用 `rocket::get`\
  \ 来指定它在对路径“/”发送 GET 请求时使用：\n\n```rust\n#[get(\"/\")]\nasync fn index() -> Option<NamedFile>{\n\
  ```\n\n然而，在继续之前，我们需要下载源的 XML 文件。你可以使用任何你喜欢的 RSS XML 文件，我们将从 [`dev.to/feed/mustafif`](https://dev.to/feed/mustafif)\
  \ 下载文件并将其保存为项目中的 `feed.xml`。为了创建一个 `rss::Channel`，我们需要读取 `feed.xml` 并使用 `Channel::read_from()`\
  \ 将字符串转换为字节流（使用 `as_bytes()` 函数）：\n\n```rust\n// reads feed.xml\nlet feed_string\
  \ = read_to_string(\"feed.xml\").unwrap();\n// 通过将 feed_string 读取为字节 (&[u8]) 来创建一个通道\n\
  let channel = Channel::read_from(feed_string.as_bytes()).unwrap();\n```\n\n为了创建一个新通道，我们将使用\
  \ `crossbeam::unbounded()`，它会创建一个对接收者或发送者数量没有限制的通道。有了我们的发送者 `tx` 和接收者 `rx`，我们现在可以开始发送和检索流了。在声明无界通道后，让我们开始\
  \ `send_feeds()`发送流：\n\n```rust\n// create a new unbounded channel\nlet (tx, rx)\
  \ = unbounded();\n// 通过放置通道项并克隆 tx 来发送流\nsend_feeds(&channel.items, tx.clone());\n\
  ```\n\n由于 `retrieve_feeds()` 也用于获取 `index.html` 的内容，因此我们创建 `index.html` 然后再获取内容的操作是明智的：\n\
  \n```rust\n// create index.html\nlet mut file = File::create(\"index.html\").unwrap();\n\
  // 通过克隆 rx 和获取项长度来检索内容\nlet index_content = retrieve_feeds(rx.clone(), channel.items.len());\n\
  ```\n\n一旦有了 `index.html` 的内容，我们可以将其以字节的形式写入 `index.html`，然后使用 `NamedFile::open()`\
  \ 打开文件：\n\n```rust\n// write the content to index.html as bytes\nfile.write_all(index_content.as_bytes()).unwrap();\n\
  // open index.html\nNamedFile::open(\"index.html\").await.ok()\n}\n```\n\n现在，我们可以创建主函数\
  \ `rocket()`，它将挂载在两个不同的路径上：\n\n*   “/” 用于打开 `index.html`\n*   “/Feed” 用于打开 *Feed*\
  \ 目录中的文件\n\n```rust\n#[launch]\nfn rocket() -> _{\n    rocket::build()\n    // mount\
  \ index() in \"/\"\n    .mount(\"/\", routes![index])\n    // 在路径 \"/Feed\" 下挂载流文件\n\
  \    .mount(\"/Feed\", FileServer::from(\"Feed\"))\n}\n```\n\n当我们使用 `cargo run`\
  \ 运行项目并打开 `http://127.0.0.1:8000` 时，我们将看到如图 5.3 所示的文章列表：\n\n![](img/Figure-5.3.jpg)\n\
  \n**图 5.3:** 来自 dev.to/mustafif 的文章列表\n\n如果我们打开其中一篇文章，我们将看到它的描述，如图 5.4 所示：\n\n![](img/Figure-5.4.jpg)\n\
  \n**图 5.4:** 文章“Mufi Concept Toy-Lang”的描述\n\n# 第 6 章\n\n## Rust 网络编程\n\n### 引言\n\
  \n作为一种系统编程语言，Rust 是执行网络相关任务的完美选择，无论是通过 TCP 还是 UDP 协议传输数据。在本章中，我们将探索如何在 Rust 中创建不同的网络模型，无论是同步\
  \ IO 模型（阻塞）还是异步 IO 模型（非阻塞）。我们将在 `tokio` 等 crate 中获得更好的经验，并花一些时间使用 Rust 标准库的 `net`\
  \ 模块，该模块提供了网络的基础。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   协议栈\n*   探索 Net 模块\n*   创建同步\
  \ IO 模型\n*   创建异步 IO 模型\n\n### 目标\n\n在本章结束时，读者将理解 Rust 的网络基础知识，使用异步模型或同步模型。这将通过使用\
  \ Rust 标准库的 `net` 模块来实现，对于异步模型，将使用流行的 `tokio` crate。\n\n### 协议栈\n\n在查看 Rust 如何处理基础网络以及它如何工作之前，我们首先需要理解协议栈。协议栈是一个分层堆栈：\n\
  \n**表 6.1:** 来自各层的协议\n\n| 协议 | 层 |\n| :--- | :--- |\n| IEEE | 物理层 |\n| Wifi | 数据链路\
  \ |\n| IP | 网络层 |\n| TCP/UDP | 传输层 |\n| FTP | 应用层 |\n\n### 物理层\n\n物理层代表设备用于连接的物理介质。在示例中，我们将使用\
  \ USB 适配器或 PCI 卡。然而，重要的是它的协议是 802.1ax，它定义了 Wi-Fi 标准。\n\n### 数据链路\n\n物理层之后是数据链路，它代表数据如何在跨物理层在节点之间传输。\n\
  \n### 网络层\n\n网络层负责使用 IP 地址唯一标识网络。两种类型的 `Internet Protocol`（IP）地址是 IPv4 和 IPv6，其中版本\
  \ 4 包含 4 个 8 位整数。IPv4 在互联网变得巨大之前非常好；因此创建了 IPv6，它包含 8 个 16 位十六进制数。\n\n### 传输层\n\n\
  传输层负责网络数据包如何在网络中传输。此的两种常用协议是 `传输控制协议`（TCP）和 `用户数据报协议`（UDP），它们之间的区别在于对连接建立的保证。\n\n\
  TCP 执行三次握手：首先，当客户端想要与某种服务器建立连接时会出现这种情况。服务器发送一个名为 `同步序列号`（SYN）的段来尝试与服务器通信。\n\n其次，服务器对客户端的请求发送带有\
  \ `确认`（ACK）的响应，并发送一个段，SYN-ACK，告知客户端其请求已被确认。\n\n最后，客户端确认服务器的响应，客户端和服务器现在都已成功建立了相互连接。\n\
  \n### 应用层\n\n如果有人做过 ping 测试，他们可能知道这种测试使用 `TCP` 来检查是否可以建立连接（用于查看网络是否存在），并测量传输的数据包的速度和丢包率（用于延迟和速度测试）。\n\
  \nUDP 在没有确认的情况下与服务器建立连接，比 `TCP` 更高效，但代价是可靠性。使用 UDP 的应用程序示例是视频流，它需要非常快的连接速度，并且不介意用户为了看视频而丢失一些帧或分辨率。\n\
  \n\n\n\n应用层包含了为应用程序提供与网络通信抽象方式的协议。一个例子可能是 HTTP，它在 `world wide web` 内部以及低级库（`hyper`）中用于通信请求/响应是如何发送的。\n\
  \n另一个例子是`文件传输协议`（`FTP`），人们在编写网站时经常使用。该协议可以配合 `FileZilla` 或 `Samba` 服务器等应用程序，从远程服务器访问文件。\n\
  \n### 探索 net 模块\n\n在 Rust 中进行基础网络编程，你可以使用标准库中的 `net` 模块，它可以为你提供以下内容：\n\n* TCP 通信\n\
  \    * `TcpListener` 用于在套字上监听入站连接\n    * `TcpStream` 用于在 TCP 连接中读/写数据\n* 使用 `UDPSocket`\
  \ 类型进行 UDP 通信\n* IPv4 或 IPv6 的 IP 地址\n    * 它们分别是 `IPv4Addr` 和 `IPv6Addr`\n* IPv4\
  \ 或 IPv6 的 Socket 地址\n    * 它们分别是 `SocketAddrV4` 和 `SocketAddrV6`\n\n如需了解更多信息，建议查看\
  \ `net` 模块的官方 Rust 文档，[`doc.rust-lang.org/std/net/index.html`](https://doc.rust-lang.org/std/net/index.html)。\n\
  \n`net` 模块的主要用途是需要 IP 或 Socket 地址以及 TCP 通信的简单接口。考虑到这些，让我们编写两个小程序：一个通过 TCP 监听 socket\
  \ 地址，另一个连接到我们的监听器。\n\n我们将编写的第一个程序是通过 TCP 监听 socket 地址，创建一个文件 `listen.rs` 并添加以下导入：\n\
  \n```rust\nuse std::io::Result;\nuse std::net::TcpListener;\n```\n\n为了处理来自 `TcpListener`\
  \ 的错误，我们将让 `main()` 函数返回来自 `io` 模块的 `Result<()>`：\n\n```rust\nfn main() -> Result<()>\
  \ {\n```\n\n创建一个绑定地址的 TCP 监听器，可以使用 `TcpListener` 的 `bind()` 方法，它需要一个地址，我们将使用 `127.0.0.1:8080`。由于\
  \ `bind()` 方法返回 `Result<TcpListener, Error>`，我们将使用 `?` 运算符处理错误：\n\n```rust\nlet\
  \ listener = TcpListener::bind(\"127.0.0.1:8080\")?;\n```\n\n我们的程序将非常简单；如果我们收到某个地址的连接，我们将向用户报告，或者由于某种类型的错误被拒绝。为了做到这一点，我们将使用\
  \ `accept()` 方法，它返回 `Result<(TcpStream, SocketAddr), Error>`，并在 `match` 语句中使用它，这样我们就可以处理\
  \ `Ok` 值和 `Err` 值的情况：\n\n```rust\nmatch listener.accept() {\n```\n\n如果连接被接受，我们将打印出我们有一个来自某个地址的连接。由于我们的\
  \ `Ok()` 值是一个 TCP 流和 socket 地址的元元组，我们将选择忽略流，仅使用标识符 `addr` 使用地址。为了显示 `addr`，我们可以使用\
  \ `(\":?\", addr)` 或 `(\"addr:?\")` 任何一种语法，我们将选择后者：\n\n```rust\nOk((_, addr)) =>\
  \ println!(\"Connection from {addr:?}\"),\n```\n\n如果连接被拒绝或发生错误，我们将在 `Err()` 值下处理它，并告诉用户连接被拒绝以及错误原因。我们将选择以与\
  \ socket 地址相同的方式显示我们的错误：\n\n```rust\nErr(e) => println!(\"Connection refused: {e:?}\"\
  )\n}\n```\n\n由于我们的 `main()` 函数返回 `Result<()>`，如果一切成功，将在结尾返回 `Ok(())`，然后我们的程序将成功退出：\n\
  \n```rust\nOk(())\n}\n```\n\n如果我们编译并运行我们的程序，它什么都不会做。这是因为我们还没有编写一个连接到我们监听器的程序。首先，创建一个文件\
  \ `connection.rs` 并在文件顶部添加以下导入：\n\n```rust\nuse std::net::TcpStream;\n```\n\n在我们的\
  \ `main()` 函数中，我们想要连接到位于 `127.0.0.1:8080` 的监听器地址。我们想用 `if let` 语句处理 `Result<TcpStream>`，如果有一个\
  \ `Ok()` 值，我们告诉用户我们已连接到监听器，如果没有，则我们连接失败了：\n\n```rust\nfn main() {\n    if let Ok(_stream)\
  \ = TcpStream::connect(\"127.0.0.1:8080\") {\n        println!(\"Connected to listener!\"\
  )\n    } else {\n        println!(\"Failed to connect to listener…\")\n    }\n}\n\
  ```\n\n创建了监听器和连接器后，我们可以编译两个程序并在不同的终端中运行它们：\n\n```bash\n### terminal 1\n$ rustc listen.rs\n\
  $ ./listen\n\n### terminal 2\n$ rustc connection.rs\n$ ./connection\nConnected to\
  \ listener!\n\n### terminal 1\nNew connection from 127.0.0.1:44718\n```\n\n### 创建同步\
  \ IO 模型\n\n为了探索创建同步 IO 模型，我们将使用 Redis 创建一个订单系统，向我们服务器的 socket 发送命令并回复。本节的示例基于 *Mastering\
  \ Rust – Second Edition* 中的“同步网络 IO 项目”。然而，不是发送消息，我们将使用同步模型。同步，本节的示例基于 *Mastering\
  \ Rust – Second Edition* 中的“同步网络 IO 项目”。然而，不是发送消息，我们将使用同步模型。\n\n在开始我们的项目之前，你可能会好奇同步和异步\
  \ IO 模型之间的区别。简单的区别是 socket（一个允许网络通信的文件描述符）：同步模型阻塞线程，而异步模型不会阻塞线程。\n\n在开始我们的项目之前，通过\
  \ `redis-cli` 下载 [redis.io/docs/getting-started/installation/](https://redis.io/docs/getting-started/installation/)\
  \ 的说明。\n\n接下来，我们将创建项目并添加依赖：\n\n```bash\n$ cargo new orders_sync\ncd orders_sync\n\
  $ cargo add chrono lazy_static\n$ cargo add --git https://github.com/creativcoder/resp\n\
  ```\n\n`resp` 将帮助我们将字符串编码和解码为有效的 `redis` 命令。让我们在 `src/order.rs` 中开始工作，带有以下导入：\n\n\
  ```rust\nuse std::collections::HashMap;\nuse lazy_static::lazy_static;\nuse std::sync::Mutex;\n\
  use chrono::{Utc, DateTime};\nuse resp::Value;\n```\n\n为了方便，我们将在懒静态块中创建我们的“数据库”；为了保持简单。`ORDERS`\
  \ 是一个字符串键的哈希，值包装在 `Mutex` 中，这样我们可以安全地读写它：\n\n```rust\nlazy_static! {\n    static\
  \ ref TIME_NOW: DateTime<Utc> = Utc::now();\n    pub static ORDERS: Mutex<HashMap<String,\
  \ Order>> = Mutex::new(HashMap::new());\n}\n```\n\n`Order` 结构体将很简单；它的字段只有项目和它创建的时间。我们的项目将期望一个枚举，`Item`：\n\
  \n```rust\n// 代表来自用户的订单\n#[derive(Debug, Clone)]\npub struct Order {\n    item:\
  \ Item,\n    created_at: String,\n}\n\n// 代表商店或制造商的物品\n// 我们将使用 msrp USD 进行处理器\n\
  #[derive(Debug, Copy, Clone)]\npub enum Item {\n    I5, // I5-12600\n    I7, //\
  \ I7-12700\n    I9, // I9-12900\n    Nil // 如果产品不存在\n}\n```\n\n在实现的函数方面，我们需要一个 `new()`（期望项目的名称）以及\
  \ `Orders` 的 `to_string()` 函数，`to_string()` 是从 `ToString` trait 实现的：\n\n```rust\n\
  impl ToString for Order {\n    fn to_string(&self) -> String {\n        format!(\"\
  Item: {} [${}] -- Created at: {}\", &self.item.to_string(), &self.item.get_price(),\
  \ &self.created_at)\n    }\n}\n\nimpl Order {\n    pub fn new(item: &str) -> Self\
  \ {\n        Self {\n            item: Item::new(item),\n            created_at:\
  \ TIME_NOW.to_rfc3339(),\n        }\n    }\n}\n```\n\n\n\n\n```rust\n`created_at:\
  \ TIME_NOW.to_string(),`\n}\n}\n}\n``` 对于 `Item`，我们需要实现以下函数：`new()`（期望物品名称）、`get_price()`（返回处理器的\
  \ MSRP 美元价格）以及一个 `to_string()` 函数，后者是通过实现 `ToString` 特性来实现的：\n\n```rust\nimpl ToString\
  \ for Item{\n    fn to_string(&self) -> String {\n        match &self{\n       \
  \     Item::I5 => \"i5-12600\".to_string(),\n            Item::I7 => \"i7-12700\"\
  .to_string(),\n            Item::I9 => \"i9-12900\".to_string(),\n            Item::Nil\
  \ => \"Item doesn't exist\".to_string()\n        }\n    }\n}\n\nimpl Item{\n   \
  \ pub fn new(item: &str) -> Self{\n        match item{\n            \"i5\" => Self::I5,\n\
  \            \"i7\" => Self::I7,\n            \"i9\" => Self::I9,\n            _\
  \ => Self::Nil\n        }\n    }\n    pub fn get_price(&self) -> u32{\n        match\
  \ &self{\n            Item::I5 => 240,\n            Item::I7 => 350,\n         \
  \   Item::I9 => 590,\n            Item::Nil => 0\n        }\n    }\n}\n```\n\n在我们继续编写\
  \ `src/order.rs` 之前，我们应该先在 `src/main.rs` 中开始主函数。在主文件顶部，添加以下导入：\n\n```rust\nmod order;\n\
  use order::*;\nuse resp::Decoder;\nuse std::io::{BufReader, Write};\nuse std::net::{TcpListener,\
  \ TcpStream};\nuse std::env;\n```\n\n我们在 `main()` 函数中的首要工作是为 TCP 监听器定义一个绑定地址。我们将允许用户在他们想要时定义一个。如果不想，我们将提供一个本地\
  \ 端口 6378 的默认地址。为了仅获取地址，我们将让 `env::args()` 跳过第一个值并获取下一个值，这将是用户指定的任何地址：\n\n```rust\n\
  fn main() {\n    // 默认 redis 从端口 6378 读取\n    let address = env::args()\n      \
  \  .skip(1)\n        .next()\n        .unwrap_or(\"127.0.0.1:6378\".to_owned());\n\
  ```\n\n有了地址后，我们现在可以通过 `TcpListener::bind()` 将其绑定到 TCP 监听器。当我们这样做时，我们还将让用户知道我们正在该地址监听：\n\
  \n```rust\n    // 创建 tcp 监听器\n    let listener = TcpListener::bind(&address).unwrap();\n\
  \    // 让用户知道 orders_sync 正在哪里监听\n    println!(\"orders_sync listening on: {}\"\
  , &address);\n```\n\n为了处理来自 TCP 监听器的每个流，我们在 `listener.incoming()` 的每个流中使用 `for`\
  \ 循环。流的类型为 `Result<TcpStream>`，因此我们的工作是在循环内部对其进行解包，让用户知道这个传入的连接并对其进行处理：\n\n```rust\n\
  \    // 处理每个传入的流\n    for tcp_stream in listener.incoming(){\n        let tcp_stream\
  \ = tcp_stream.unwrap();\n        println!(\"New incoming connection from: {:?}\"\
  , tcp_stream);\n        handle_incoming(tcp_stream);\n    }\n}\n```\n\n在 `main()`\
  \ 函数下方，我们可以编写我们的函数 `handle_incoming()`，它期望一个 `TcpStream`：\n\n```rust\nfn handle_incoming(stream:\
  \ TcpStream){\n```\n\n在我们为 redis 程序解码流之前，解码器需要一个读取器。因此，我们将使用 `BufReader::new()`\
  \ 创建一个新的新的缓冲区读取器。通过将流封装在读取器中，我们可以使用 `Decoder::new()` 创建一个新的解码器并使用 `decode()` 函数对其解码：\n\
  \n```rust\n    let mut tcp_stream = BufReader::new(stream);\n    let decoder = Decoder::new(&mut\
  \ tcp_stream).decode();\n```\n\n`decode()` 函数返回一个 `Result<Value>`，因此我们将使用 `match`\
  \ 语句处理该 `Result`，如果命令有效，我们就处理它并将回复写入流中。如果命令无效，我们使用 `eprintln!()` 将错误写入标准错误。要了解 redis\
  \ 中哪些命令是有效的，建议查看官方网站：[`redis.io/commands/`](https://redis.io/commands/)：\n\n```rust\n\
  \    match decoder{\n        Ok(value) => {\n            let reply = process_order(value);\n\
  \            match tcp_stream.get_mut().write_all(&reply){\n                Ok(())\
  \ => (),\n                Err(e) => eprintln!(\"Error: {:?}\", e)\n            }\n\
  \        }\n        Err(e) => {\n            eprintln!(\"Invalid command: {:?}\"\
  , e);\n        }\n    };\n}\n```\n\n在我们的程序中，我们期望订单接收以下命令：\n\n- **GET**: 带有订单名称。\n\
  - **SET**: 带有名称，我们将创建一个新物品。\n- **DEL**: 带有名称，我们将删除。\n\n在我们的文件 `src/order.rs` 中，我们将创建函数\
  \ `process_order`，它期望一个 `Value`：\n\n```rust\npub fn process_order(msg: Value) ->\
  \ Result<Value, u8> {\n```\n\n我们的任务是编码 `reply`。如果命令有效，我们就处理它并将回复写入流中。如果命令无效，我们使用\
  \ `eprintln!()` 将错误写入标准错误。在我们的程序中，我们期望订单接收以下命令：\n\n- **GET**: 带有订单名称。\n- **SET**:\
  \ 带有名称，我们将创建一个新物品。\n- **DEL**: 带有名称，我们将删除。\n\n```rust\n    // ... process_order\
  \ 的逻辑 ...\n}\n```\n\n\n\n\n\n下一个我们需要处理的命令是 `set` 命令。对于此命令，我们期望接收一个名称和一个订单项目。和之前的函数一样，我们将跳过数组中的第一个\
  \ `Value`，并检查数组是否为空或长度是否不等于 2：\n\n```rust\npub fn handle_set(values: Vec<Value>)\
  \ -> Result<Value, Value> {\n    let v = values.iter().skip(1).collect::<Vec<_>>();\n\
  \    // 我们期望某个个体的名称\n    if v.is_empty() || v.len() != 2 {\n        return Err(Value::Error(\n\
  \            \"Expected Name and Item for SET command\".to_string(),\n        ));\n\
  \    }\n}\n```\n\n由于 `set` 将创建一个新订单，我们将锁定 `ORDERS` 但将绑定设为可变，以便我们可以插入新的名称和订单：\n\n\
  ```rust\nlet mut orders = ORDERS.lock().unwrap();\n```\n\n我们将使用 `match` 语句处理 `v`\
  \ 中的第一个和第二个元素，并处理两种不同的情况。第一种情况是它们都是带有字符串的 `Value::Bulk`，我们可以将其插入 `orders` 中，以 `key`\
  \ 作为名称，以 `value` 作为项，并可以使用 `Order::new()` 使用它们。第二种情况是默认情况，我们将使用宏 `unimplemented!()`\
  \ 告知用户我们的命令尚未针对这些值实现实现：\n\n```rust\nmatch (&v[0], &v[1]) {\n    (Value::Bulk(key),\
  \ Value::Bulk(value)) => {\n        let _ = orders.insert(key.to_string(), Order::new(value));\n\
  \    }\n    _ => unimplemented!(\"SET not implemented for {:?}\", v),\n}\n```\n\n\
  如果一切顺利，我们将返回一个封装在 `Ok()` 中的 `Value::String()`，并带有一个字符串告诉用户订单已创建：\n\n```rust\nOk(Value::String(\"\
  Order Created!\".to_string()))\n```\n\n在继续处理 `del` 命令之前，让我们看看如何编辑或更新订单。这也是通过 `set`\
  \ 命令完成的。hashmap 的奇妙之处在于，如果键存在于内部，那么与它关联的值将被移除并用新值更新。我们使用的 `insert()` 函数返回 `Option<V>`，其中\
  \ V 是值。然而，由于我们不在乎旧值，所以我们忽略了它。\n\n我们现在可以开始最后一个需要处理的命令，即 `del` 命令，它期望一个名称。该函数的前几行拷贝自\
  \ `handle_get()`，其中我们跳过数组中的第一个值并检查数组是否为空。如果为空，我们返回一个错误告诉用户我们期望一个名称：\n\n```rust\n\
  pub fn handle_del(values: Vec<Value>) -> Result<Value, Value> {\n    let v = values.iter().skip(1).collect::<Vec<_>>();\n\
  \    // 我们期望某个个体的名称\n    if v.is_empty() {\n        return Err(Value::Error(\"Expected\
  \ Name for DEL command\".to_string()));\n    }\n}\n```\n\n在这个函数中，我们将写入订单，因此我们将锁定\
  \ `ORDERS` 并绑定设为可变：\n\n```rust\nlet mut orders = ORDERS.lock().unwrap();\n```\n\n\
  然后我们对 `v` 中的第一个元素使用 `match` 语句，类似于 `handle_set()`。我们将有两种情况：第一种情况检查值是否为 `Value::Bulk(key)`，并使用该键通过\
  \ `remove()` 函数移除订单。`remove()` 函数确实返回一个 `Option`，但我们将继续忽略它。另一种情况是默认情况，像 `handle_set()`\
  \ 一样，我们将使用宏 `unimplemented!()` 告诉用户该值尚未实现：\n\n```rust\nmatch &v[0] {\n    Value::Bulk(key)\
  \ => {\n        let _ = orders.remove(key);\n    }\n    _ => unimplemented!(\"DEL\
  \ not implemented for {:?}\", v),\n}\n```\n\n最后，我们可以返回一个封装在 `Ok()` 中的 `Value::String`，告诉用户订单已删除：\n\
  \n```rust\nOk(Value::String(\"Order Deleted!\".to_string()))\n}\n```\n\n### 使用 Redis\
  \ 进行测试\n\n确保你已经安装了 `redis-cli` 并打开两个终端标签页：\n\n```bash\n### 终端标签页 1\n#我们将编译并运行 orders_sync\n\
  $ cargo run\norders_sync listening on: 127.0.0.1:6378\n\n### 终端标签页 2\n$ redis-cli\
  \ -p 6378\n127.0.0.1:6378> set bob i7\nOrder Created!\n$ redis-cli –p 6378\n127.0.0.1:6378>\
  \ set tim i9\nOrder Created!\n$ redis-cli -p 6378\n127.0.0.1:6378> get bob\n\"Item:\
  \ i7-127000 [350] Created at: 2022-09-04 00:04:03.260110 UTC\"\n$ redis-cli -p 6378\n\
  127.0.0.1:6378> del tim\nOrder Deleted!\n$ redis-cli -p 6378\n127.0.0.1:6378> get\
  \ tim\n(nil)\n```\n\n如果我们回到终端 1，我们可以看到以下连接：\n\n```\norders_sync listening on: 127.0.0.1:6378\n\
  New incoming connection: TcpStream { addr: 127.0.0.1:6378, peer: 127.0.0.1:49240\
  \ }\nNew incoming connection: TcpStream { addr: 127.0.0.1:6378, peer: 127.0.0.1:33990\
  \ }\nNew incoming connection: TcpStream { addr: 127.0.0.1:6378, peer: 127.0.0.1:39752\
  \ }\nNew incoming connection: TcpStream { addr: 127.0.0.1:6378, peer: 127.0.0.1:49696\
  \ }\n```\n\n### 创建异步模型\n\n异步根据剑桥词典定义为 *同时发生或完成的事情*。异步模型与同步模型相比的优势在于并发运行进程的想法。但如何实现呢？操作系统使用的技术或机制是轮询。轮询是对进程状态的持续检查。这听起来效率很低。因此，内核使用\
  \ *epoll*，它会在状态发生变化时进行通知。现在问题出现了，Rust 如何与轮询交互并创建异步任务？\n\n### Future trait\n\nRust\
  \ 中的 future 代表一个不会立即完成而稍后完成的值。这都是通过 `Future` trait 实现的，如下：\n\n```rust\npub trait\
  \ Future {\n    type Output;\n    fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>)\
  \ -> Poll<Self::Output>;\n}\n```\n\n`poll` 函数根据 `futures` 类的文档 [`docs.rs/futures/0.3.24/futures/trait/Future.html`](https://docs.rs/futures/0.3.24/futures/trait/Future.html)\
  \ 用于尝试解析 future 的最终值。它会在值不可用时唤醒当前任务。该函数返回：\n\n- `Poll::Pending`: 如果 future 尚未就绪。\n\
  - `Poll::Read(val)`: 如果 future 成功完成，则返回 `val`。\n\n`Future` trait 通常从 `futures` crate\
  \ 使用，每当我们需要使用它以及与其他 future 相关的 trait（如 `Stream` 和 `Sink`）时，我们将使用该 crate。\n\n###\
  \ 从 Mio 到 Tokio\n\n作为开发者，管理底层的轮询和从操作系统读取事件是非常困难的，幸运的是我们不需要这样做。`mio` crate 是一个专注于非阻塞\
  \ API 以及用于构建高性能 IO 程序的事件通知的底层 IO 库。我们不需要做创建异步任务调度器的项目，已经有人为我们完成了。\n\n\n\n\n`tokio`\
  \ crate 结合了 `future` 和 `mio` crate，是一个异步库，提供了你所需的一切内容。例如，它提供了一个工作窃取机制的任务调度器、非阻塞\
  \ API、TCP/UDP 套接字等。如果你正在处理异步任务，你很可能会使用 `tokio`。\n\n另一个值得提到的是 `async-std` crate，它是一个提供标准库异步版本的项目。\n\
  \n在本章中，我们将利用 `tokio` 的 TCP/UDP 套接字来创建一个程序，该程序会将用户输入的任何内容通过套接字返回（echo）。这个程序是 `tokio`\
  \ 仓库中的一个示例，位于 [`github.com/tokio-rs/tokio/blob/master/examples/echo.rs`](https://github.com/tokio-rs/tokio/blob/master/examples/echo.rs)。它是展示如何并发运行两个程序的完美选择。\n\
  \n首先，让我们创建该项目并添加必要的依赖：\n\n```bash\n$ cargo new echo\n$ cd echo\n$ cargo add tokio\
  \ --features full\n$ cargo add tokio-util --features tokio-util/codec\n$ cargo add\
  \ futures bytes\n```\n\n我们的项目将分为两个应用程序：第一个是 TCP 监听器，它将读取字节流并将相同的文本写回到套接字；第二个应用程序将连接到监听器，并允许用户向套接字写入消息。\n\
  \n我们将首先在 `src/main.rs` 中编写 TCP 监听器，并在顶部添加以下导入：\n\n```rust\nuse tokio::io::{AsyncReadExt,\
  \ AsyncWriteExt};\nuse tokio::net::TcpListener;\nuse std::env::args;\nuse std::error::Error;\n\
  ```\n\n为了让我们的 `main` 函数在 `tokio` 运行时运行，我们将在 `main()` 函数上方使用宏 `#[tokio::main]`，并让它返回\
  \ `Result<(), Box<dyn Error>>`，这样我们就可以处理大多数错误：\n\n```rust\n#[tokio::main]\nasync\
  \ fn main() -> Result<(), Box<dyn Error>>{\n```\n\n我们的下一个任务是允许用户输入 TCP 监听器要绑定的地址，或者我们将默认地址设置为\
  \ localhost 的端口 6378。为了直接获取地址，我们将跳过 `std::env::args()` 的第一个元素，因为包含程序的名称：\n\n```rust\n\
  // 允许用户传入地址，\n// 如果他们没有提供，默认在 127.0.0.1:6378 上监听\nlet address = args()\n    .nth(1)\n\
  \    .unwrap_or(\"127.0.0.1:6378\".to_string());\n```\n\n我们下一个明显的任务是将地址绑定到 TCP 监听器，并告诉用户我们正在监听该地址：\n\
  \n```rust\n// 创建一个 Tcp 监听器进行监听\nlet listener = TcpListener::bind(&address).await?;\n\
  // 告诉用户我们在哪个地址上监听\nprintln!(\"Listening on {}\", &address);\n```\n\n接下来，我们将创建一个循环，并使用\
  \ `listener.accept()` 异步等待传入的套接字，该方法会接受指向监听器的传入连接：\n\n```rust\n// 我们将创建一个循环，用户输入的\n\
  //任何内容将直接返回给他们\nloop{\n    // 我们将异步等待传入的套接字\n    let (mut socket, _) = listener.accept().await?;\n\
  ```\n\n当我们从套接字读取并写回数据时，我们希望这些任务在后台运行，并在准备好后并发执行。为了实现这一点，我们将使用 `tokio::spawn()`，它会产生一个新的异步任务，该任务可以与其他任务并发执行。这类似于\
  \ `std::thread::spawn()`，我们在函数内部有一个代码块，该块将被执行。我们不再使用 `move` 关键字，而是使用 `async move`：\n\
  \n```rust\n// 并发地从用户处读取然后写回给他们\n// 我们将使用 tokio::spawn 在后台异步运行此操作\n// 这允许任务不阻塞线程\n\
  tokio::spawn(async move {\n```\n\n接下来，我们将定义一个用于读取和写入的缓冲区。我们的缓冲区将定义为 `vec![0;1024]`\
  \ 的 `Vec<u8>`，代表一个 1KB 的缓冲区：\n\n```rust\n// 创建一个用于读取的缓冲区\nlet mut buf = vec![0;1024];\n\
  ```\n\n我们将在另一个循环中对套接字进行读写。要从套接字读取，我们使用 `read()` 函数并传入缓冲区的可变引用。它返回一个读取到的字节数的索引。在写入流之前，如果数据为空或为零，我们将直接返回，因为写入空内容是浪费。如果有数据，我们将使用\
  \ `write_all()` 函数，通过缓冲区从第一个元素到 `data`（套接字读取的值）的切片写入套接字：\n\n```rust\n// 在无限循环中，我们将从用户处读取并写回数据\n\
  loop {\n    let data = socket\n        .read(&mut buf)\n        .await\n       \
  \ .expect(\"Couldn't read\");\n    if data == 0 {\n        return;\n    }\n    socket.write_all(&buf[..data])\n\
  \        .await\n        .expect(\"Couldn't write\");\n}\n}\n}\n}\n\n\n\n为了创建我们的新流，我们将使用\
  \ `FramedRead::new()`，它将创建一个由实现了 `AsyncRead` trait 的一个值进行解码的值流。`new()` 函数需要一个实现了\
  \ `AsyncRead` 的内部读取值（这将是我们的绑定变量 `read`）以及一个解码器（像之前一样，解码器是 `BytesCodec::new()`）。我们将使用\
  \ `filter_map()` 函数来匹配每个 `Result<BytesMut, Error>`。如果得到 `Ok(byte)`，我们将使用 `future::ready()`\
  \ 准备好该未来，并提供一个字节的选项。为了将 `BytesMut` 转换为 `Bytes`，我们使用封装在 `Some()` 中的 `bytes.freeze()`。如果发生错误，我们将使用\
  \ `eprintln!` 打印错误并返回 `future::ready(None)`，这样我们就能知道它没有成功完成并停止流。然后我们通过带有 `Ok` 的\
  \ `map()` 将 `filter_map()` 链起来：\n\n```rust\n// 将我们的流转换为字节，我们将对 Result<BytesMut,\
  \ Error> 进行 filter_map\nlet mut stream = FramedRead::new(read, BytesCodec::new())\n\
  \    .filter_map(|byte|match byte{ // 匹配 Result<BytesMut, Error>\n        // 将 BytesMut\
  \ 转换为 Bytes\n        Ok(bytes) => future::ready(Some(bytes.freeze())),\n       \
  \ Err(e) => {\n            // 如果发生错误，我们打印到 stderr 并停止流\n            eprintln!(\"\
  Error in reading from socket: {}\", e.to_string());\n            future::ready(None)\n\
  \        }\n    }).map(Ok);\n```\n\n我们有两个想要合并的未来（futures）：第一个是让 `sink` 完成，在流通过 `stdin`\
  \ 使用 `send_all()` 函数完全处理到它之后。我们的另一个未来是将流全部发送到 `stdout`，以便其能够写入 `io::stdout()`。为了合并这两个未来，我们将使用\
  \ `future::try_join()` 函数，它会合并两个未来的结果，并等待它们都完成或其中一个发生错误：\n\n```rust\n// 尝试合并发送到\
  \ stdin 的 sink\n// 以及发送到 stdout 的 stream\nmatch future::try_join(sink.send_all(&mut\
  \ stdin), stdout.send_all(&mut stream)).await{\n    Err(e) => Err(e.into()),\n \
  \   _ => Ok(())\n}\n}\n```\n\n当 `connect()` 函数完成后，我们就可以开始编写我们的 `main()` 函数了，它会非常短，因为很多工作已经处理好了。首先，就像处理我们的\
  \ TCP 监听器一样，我们将使用 `#[tokio::main]` 宏声明我们的主函数运行在 `tokio` 运行时上。我们还将像上一次一样返回 `Result<(),\
  \ Box<dyn Error>>` 来处理大部分错误逻辑：\n\n```rust\n#[tokio::main]\nasync fn main() -> Result<(),\
  \ Box<dyn Error>>{\n```\n\n接下来，我们需要一个要连接的地址；我们的默认地址是本地端口 6378 的 localhost。所以，默认情况下，我们的程序保证与我们的\
  \ TCP 监听器连接。为了将字符串转换为 `SocketAddr` 类型，我们将使用 `parse()` 函数：\n\n```rust\n// 从用户处获取地址\n\
  let address = args()\n    .nth(1)\n    .unwrap_or(\"127.0.0.1:6378\".to_owned());\n\
  let address: SocketAddr = address.parse()?;\n```\n\n对于我们的 `connect()` 函数，我们已经有了要连接的地址；下一个任务是获取\
  \ `stdin`，它将是一个由 `FramedRead::new()` 创建的 `Stream`，其内部读取器为 `io::stdin()`，编码器为 `BytesCodec::new()`。为了获取字节流，我们将使用\
  \ `map()` 函数映射 `stdin`，并且对于每一帧，我们将映射其字节（类型 `BytesMut`），并将其转换为 `Bytes`，我们将使用 `freeze()`\
  \ 函数：\n\n```rust\n// 使用 FramedRead 创建新的 stdin\nlet stdin = FramedRead::new(io::stdin(),\
  \ BytesCodec::new());\n// 将标准输入中的 BytesMut 转换为字节流\nlet stdin = stdin.map(|i|i.map(|bytes|bytes.freeze()));\n\
  ```\n\n我们需要获取的最后一个参数是 `stdout`，它是一个 `Sink`，将使用 `FramedWrite::new()` 创建，其中 `io::stdout()`\
  \ 为内部写入器，`BytesCodec::new()` 为解码器：\n\n```rust\nlet stdout = FramedWrite::new(io::stdout(),\
  \ BytesCodec::new());\n```\n\n现在，我们可以使用我们的 `connect()` 函数，传入 `address` 的引用并使用我们的\
  \ `stdin` 和 `stdout` 绑定。最后，如果一切运行顺利，我们就返回 `Ok(())`：\n\n```rust\nconnect(&address,\
  \ stdin, stdout).await?;\nOk(())\n}\n```\n\n为了运行我们的应用程序，我们需要打开两个终端页：\n\n```bash\n\
  ### 终端 1: 运行我们的 TCP 监听器\n```\n\n```bash\n### 终端 2: 运行我们的连接器\n```\n\n\n\n*   Rust\
  \ 中的 `future` 代表一个不会立即执行而将在稍后执行的值。\n\n*   要检查一个 `future` 是挂起（pending）还是已就绪（ready），`Future`\
  \ 特性使用了 `poll()` 函数。\n\n*   `Stream` 特性表示异步产生的值序列。\n\n    *   要创建流值的帧（frames），你可以使用\
  \ `FramedRead`，它需要一个内部读取器（实现 `AsyncRead`）和一个解码器。\n\n*   `Sink` 特性表示一个可以被异步发送给其他值的值。\n\
  \n    *   要创建接收值的帧（frames），你可以使用 `FramedWrite`，它需要一个内部写入器（实现 `AsyncWrite`）和一个编码器。\n\
  \n### 练习\n\n1.  创建一个 UDP ping 测试，将一个地址绑定到两个不同的 UDP 套接字，并让第一个客户端向第二个客户端发送“PING”，并收到“PING”的回复。（该练习可以在\
  \ [`github.com/tokio-rs/tokio/blob/master/examples/udp-codec.rs`](https://github.com/tokio-rs/tokio/blob/master/examples/udp-codec.rs)\
  \ 找到）。\n\n### 答案\n\n1.  为了开始这个练习，让我们创建一个新项目并添加必要的依赖：\n\n```bash\n$ cargo new udp_ping_async\n\
  $ cd udp_ping_async\n$ cargo add tokio-stream bytes futures\n$ cargo add tokio --features\
  \ full\n$ cargo add tokio-util --features tokio-util/codec\n```\n\n这个项目的目标是让两个客户端（我们简单命名为\
  \ `a` 和 `b`）连接到同一个 UDP 套接字，并有限地互相发送接收消息。首先，让我们在 `src/main.rs` 中开始编写，并在文件顶部包含以下导入：\n\
  \n```rust\nuse tokio::net::UdpSocket;\nuse tokio::{io, time};\nuse tokio_stream::StreamExt;\n\
  use tokio_util::codec::BytesCodec;\nuse tokio_util::udp::UdpFramed;\nuse bytes::Bytes;\n\
  use futures::{FutureExt, SinkExt};\nuse std::env;\nuse std::error::Error;\nuse std::net::SocketAddr;\n\
  use std::time::Duration;\n```\n\n就像之前的 `echo` 项目中一样，我们将 `main()` 函数设为异步，并且为了让它在\
  \ `tokio` 运行时运行，我们将在 `main()` 函数上方使用宏 `#[tokio::main]`。它还会返回 `Result<(), Box<dyn\
  \ Error>>`，以便我们可以处理程序中的大多数错误：\n\n```rust\n#[tokio::main]\nasync fn main() -> Result<(),\
  \ Box<dyn Error>>{\n```\n\n允许允许定义自己的地址；如果他们没有提供，我们将默认地址 `127.0.0.1:0`。为了直接获取地址，我们将\
  \ `env::args()` 与 `nth()` 函数链用，后者将返回数组的第 n 个元素。由于我们预计地址是第二个元素（索引 1），我们使用 `nth(1)`，它返回\
  \ `Option<String>`。为了处理这个 `Option`，我们将 `nth()` 函数与 `unwrap_or()` 函数链用，使用之前提到的默认地址：\n\
  \n```rust\n// 创建地址\nlet address = env::args()\n.nth(1)\n.unwrap_or(\"127.0.0.1:0\"\
  .to_owned());\n```\n\n我们将创建两个客户端 `a` 和 `b`，它们都将使用 `UdpSocket::bind()` 绑定到我们的 UDP\
  \ 套接字地址：\n\n```rust\n// 将两个客户端绑定到我们的套接字\nlet a = UdpSocket::bind(&address).await?;\n\
  let b = UdpSocket::bind(&address).await?;\n```\n\n为了之后启动 ping，我们需要保留客户端 `b` 的本地地址，这是通过返回\
  \ `SocketAddr` 的 `local_addr()` 函数完成的：\n\n```rust\n// 获取 b 的本地地址\nlet b_addr = b.local_addr()?;\n\
  ```\n\n当我们处理 TCP 时，我们使用 `FramedRead` 和 `FramedWrite` 分别作为获取的 `Stream` 和 `Sink` 值。在\
  \ UDP 中，我们将使用 `UdpFramed` 作为统一的 `Stream` 和 `Sink` 接口，我们将使用 `UdpFramed::new()` 函数为每个客户端创建一个新的\
  \ `UdpFramed`，该函数需要一个套接字和一个解码器。我们将使用的解码器是好朋友 `BytesCodec`，它可以使用 `BytesCodec::new()`\
  \ 放置并作为我们的解码器或编码器。在我们的案例中`UdpFramed::new()` 函数将返回 `UdpFramed<BytesCodec>`，这将是我们\
  \ `ping()` 和 `pong()` 的参数。\n\n```rust\n// 示例逻辑结构\nlet mut a = UdpFramed::new(a,\
  \ BytesCodec::new());\nlet mut b = UdpFramed::new(b, BytesCodec::new());\n```\n\n\
  \n\n在我们的 `while` 循环中，首先我们将告诉用户 `b` 已经通过 `bytes` 接收到了一条消息；像之前一样，我们将使用 `String::from_utf8_lossy()`\
  \ 将 `BytesMut` 转换为 `String`：\n\n```rust\n// print we have received a's message\n\
  println!(\"[b] recv: {}\", String::from_utf8_lossy(&bytes));\n```\n\n接下来，我们将向 `addr`（即我们的客户端\
  \ `a`）发回一条消息；我们将以相同的方式发送消息，不再发送“PING”，而是发送“PONG”：\n\n```rust\n// send the message\
  \ PONG in bytes back to a\nsocket.send((Bytes::from(\"PONG\".as_bytes()), addr)).await?;\n\
  }\n```\n\n如果 `while` 循环一切运行良好，我们就可以返回 `Ok(())`，这样我们就知道所有操作都执行成功了。\n\n写完这些函数后，我们可以继续编写\
  \ `main()` 函数——其中的下一个任务是创建两个未来，`a` 将使用 `ping()` 创建，而绑定 `b` 将使用 `pong()` 创建。我们需要对每个客户端可变地借用\
  \ UDP 帧，`ping()` 还需要绑定 `b_addr`：\n\n```rust\n// begin by having a send a ping to\
  \ b\nlet a = ping(&mut a, b_addr);\n// then b will receive a's ping and send back\
  \ pong\nlet b = pong(&mut b);\n```\n\n现在，我们可以尝试连接这些未来以并发运行；我们需要匹配 `tokio::try_join!()`\
  \ 宏。如果得到一个 `Err` 值，我们将使用 `eprinln!()` 打印错误，如果得到任何其他值，我们将打印我们已完成。\n\n```rust\n//\
  \ run both futures at the same time of a and b sending messages back and forth\n\
  match tokio::try_join!(a,b){\n    Err(e) => eprintln!(\"An error has occurred: {:?}\"\
  , e),\n    _ => println!(\"done\")\n}\n```\n\n如果我们的函数中一切运行正常，那么我们可以在结尾返回 `Ok(())`：\n\
  \n```rust\nOk(())\n}\n```\n\n我们现在可以使用 `cargo run` 运行我们的 UDP Ping 程序，你应该能看到以下结果：\n\
  \n```\n$ cargo run\n[b] recv: PING\n(0) ----------------------------\n[a] recv:\
  \ PONG\n[b] recv: PING\n(1) ----------------------------\n[a] recv: PONG\n[b] recv:\
  \ PING\n(2) ----------------------------\n[a] recv: PONG\n[b] recv: PING\n(3) ----------------------------\n\
  [a] recv: PONG\n[b] recv: PING\n(4) ----------------------------\n[a] recv: PONG\n\
  [b] recv: PING\n(5) ----------------------------\n[a] recv: PONG\n[b] recv: PING\n\
  done\n```\n\n---\n\n¹ Sharma, R., & Kaihlavirta, V. (2019, January). *Mastering\
  \ Rust Second Edition*. Packt subscription. 检索于 2022 年 9 月 9 日，[`subscription.packtpub.com/book/application-development/9781789346572/12/ch12lvl1sec08/synchronous-network-io`](https://subscription.packtpub.com/book/application-development/9781789346572/12/ch12lvl1sec08/synchronous-network-io)\n\
  \n# 第 7 章 (#toc.xhtml_c07)\n\n# 项目 – GTK 应用 (#toc.xhtml_c07)\n\n# 引言 (#toc.xhtml_s119a)\n\
  \n对于那些不了解的人，GTK 是一组库和 API，用于为 GNOME 桌面环境创建原生的 Linux 桌面应用程序。通常，GTK 应用使用 C 或 Vala\
  \ 编写，同时也有其他语言的绑定，例如 Rust（使用 C/C++ 原始绑定）。\n\n我们需要回答的第一个问题是，你是否应该使用 GTK？答案取决于你的用例，但它的主要优势是构建一个继承\
  \ GNOME 桌面环境主题的应用程序。然而，如果你没有使用它，既不是 KDE 用户也不是其他用户，那么这并不是一个强有力的理由。桌面应用程序还有其他框架，例如\
  \ Tauri（我们将在本书后续部分探索它），它提供了 Electron 的 Rust 替代方案。GTK crate 仍然是一个非常难以处理的 crate；将结构转换为\
  \ GObject 的复杂性以及对智能指针的整体需求，对大多数人来说似乎并不是一种良好的体验。对于跨平台应用程序，GTK 不是你的最佳选择；它主要用于特定。\n\
  \n# 结构 (#toc.xhtml_s120a)\n\n在本章中，我们将涵盖以下主题：\n\n- 设置我们的 GTK 应用\n- 模型的数据行\n- 组装最终应用程序\n\
  \n# 目标 (#toc.xhtml_s121a)\n\n在本章结束时，读者将能够理解使用 GTK 编写原生桌面应用程序，并获得 Rust 的首次上手实践经验。\n\
  \n# 设置我们的 GTK 应用 (#toc.xhtml_s122a)\n\n在开始创建新的 cargo 项目之前，我们需要在 Debian 系统上安装 GTK\
  \ 库。可以在命令行中安装：\n\n```bash\n# 更新并升级你的包\nsudo apt-get update && sudo apt-get upgrade\n\
  \n### 安装 gtk-3 开发库\nsudo apt-get install libgtk-3-dev\n```\n\n在其他系统上，建议遵循 GTK 网站上的安装说明：[`www.gtk.org/docs/installations/`](https://www.gtk.org/docs/installations/)。\n\
  \n\n\n\n在我们的项目中，我们需要创建 `row_data` 和 `models` 目录来分别管理我们的行数据和模型。这些目录每个都包含一个 `imp.rs`\
  \ 文件，用于包含所有值的实现。在主 `src` 目录中，我们将拥有 `main.rs`、`row_data.rs` 和 `model.rs`。`row_data.rs`\
  \ 和 `model.rs` 文件将用于将 Rust 结构体转换为 GTK 的 `GObject`。\n\n项目结构应该如下：\n\n```\n$ tree\n\
  ├── Cargo.lock\n├── Cargo.toml\n├── src\n│   ├── main.rs\n│   ├── model\n│   │ \
  \  └── imp.rs\n│   ├── model.rs\n│   ├── row_data\n│   │   └── imp.rs\n│   └── row_data.rs\n\
  └── target\n```\n\n# 购物列表的行数据](#toc.xhtml_s123a)\n\n开始处理行数据，我们将编辑 `src/row_data/imp.rs`\
  \ 并在文件顶部导入以下内容：\n\n```\nuse glib::subclass::prelude::*;\nuse gtk::{glib, prelude::*};\n\
  use std::cell::RefCell;\nuse glib::{ParamSpec, ParamSpecString, ParamSpecUInt, Value};\n\
  ```\n\n我们的行数据需要以下内容：一个项目和一个计数。为了避免总是可变借用我们的行数据，我们将使用 `RefCell` 来利用内部可变性。项目的名称将封装在\
  \ `Option` 中，如果用户决定不输入名称，则不会创建该行。我们还为结构体派生 `Default` 特性，以为我们提供一个方便的 `default()`\
  \ 函数，它可以创建一个默认的行数据。在我们的情况下，由于两个字段都封装在 `RefCell` 中，我们将使用 `RefCell::default()`：\n\n\
  ```rust\n#[derive(Default)]\npub struct RowData{\n    item: RefCell<Option<String>>,\n\
  \    count: RefCell<u32>\n}\n```\n\n我们为结构体 `RowData` 需要做的下一步是让它成为一个 GObject。在我们的情况下，这将是一个子类。为了实现这一点，我们需要使用属性宏\
  \ `#[glib::object_subclass]`，在对 `RowData` 的 `ObjectSubclass` 实现中实现 `type_data()`\
  \ 和 `type_()` 函数。在特性中，我们只需要定义三个值：一个命名为 RowData 的常量 `NAME`，一个类型（即结构体 `RowData`），以及一个父类类型（即\
  \ `glib::Object`，因为我们正在将我们的结构体作为 `Object` 的子类）：\n\n```rust\n//为 GObject 类型系统声明行数据\n\
  #[glib::object_subclass]\nimpl ObjectSubclass for RowData{\n    const NAME: &'static\
  \ str = \"RowData\";\n    type Type = super::RowData;\n    type ParentType = glib::Object;\n\
  }\n```\n\n为了能够为我们的对象设置、获取和定义，我们需要为 `RowData` 实现 `ObjectImpl` 特性。我们将定义的第一个函数是 `properties()`\
  \ 函数，它将返回一个 `&’static [ParamSpec]`。`ParamSpec` 类型是参数的元数据。为了能够创建 `ParamSpec` 的静态数组，我们将使用\
  \ `once_cell` 库。这允许我们在创建 `Lazy` 值的同时对其进行赋值。在我们创建静态绑定 `PROPERTIES` 之后，我们将使用 `as_ref()`\
  \ 函数将其作为引用返回。\n\n在我们的 `ParamSpec` 向量中，我们需要定义两个元素；第一个是用于我们项目字段的 `ParamSpecString`，它显然需要一个名称“item”、一个昵称“Item”、以及一个描述“Item”的摘要。下一个参数是默认值；由于我们的项目是\
  \ `Option`，我们将默认设置为 `None`，参数的标志将为 `READWRITE`，因为我们希望能够读取和编辑项目的名称。\n\n第二个元素将使用 `ParamSpecUInt`\
  \ 类型用于我们的计数字段。与项目字段一样，我们将有一个名为“count”的名称、“Count”的昵称以及描述为“Count”的摘要。最小值和默认值都将为 0，最大值为\
  \ 100（没有特殊原因）。该参数的标志也可能是 `READWRITE`，因为我们希望能够读取和编辑项目的计数：\n\n```rust\nfn properties()\
  \ -> &'static [ParamSpec] {\n    use once_cell::sync::Lazy;\n    static PROPERTIES:\
  \ Lazy<Vec<ParamSpec>> = Lazy::new(|| {\n        vec![\n            ParamSpecString::new(\"\
  item\", \"Item\", \"Item\", None, glib::Direction::READWRITE),\n            ParamSpecUInt::new(\"\
  count\", \"Count\", \"Count\", 0, Some(100), glib::Direction::READWRITE),\n    \
  \    ]\n    });\n    PROPERTIES.as_ref()\n}\n```\n\n\n\n由于我们的模型任务是存储 `RowData` 列表，我们将将其封装在一个\
  \ `vector` 中，以便动态存储它们。我们还将使用 `RefCell` 实现内部可变性，这样我们就可以在函数仅使用不可变绑定的情况下，动态地以可变方式使用列表。\n\
  \n我们还将为结构体 `Model` 派生 `Debug` 和 `Default` 特性，这样在需要 `Debug` 特性时，我们可以拥有一个方便的 `default()`\
  \ 函数。\n\n为了方便起见，我们将 `Model` 设为元组结构体（tuple struct），因为结构体内部只有一个字段，而且使用 `Model.0` 比使用\
  \ `Model.list` 需要更少的输入：\n\n```rust\n#[derive(Debug, Default)]\npub struct Model(pub\
  \ RefCell<Vec<RowData>>);\n```\n\n为了让我们的 `Model` 像一个 `GObject`，我们需要它像 `RowData`\
  \ 一样是一个 `ObjectSubclass`，这通过为 `Model` 实现 `ObjectSubclass` 特性完成。我们还需要在实现的的上方添加 `#[glib::object_subclass]`\
  \ 属性。\n\n在实现内部，我们需要定义一些常量和类型别名。对于常量 `NAME`，我们简单地称为 Model，而 `Type` 将是我们的结构体 `Model`。由于我们将模型作为对象子类，因此\
  \ `ParentType` 将是 `Object`。最后一个添加的类型别名是 `Interfaces`，它将是由我们的类型实现的接口的元组，在我们的案例中，包含一个元素，即接口\
  \ trait `gio::ListModel`：\n\n```rust\n#[glib::object_subclass]\nimpl ObjectSubclass\
  \ for Model {\n    const NAME: &'static str = \"Model\";\n    type Type = super::Model;\n\
  \    type ParentType = Object;\n    type Interfaces = (gio::ListModel,);\n}\n```\n\
  \n接下来，我们为 `Model` 实现 `ObjectImpl` 特性，我们不需要更改 `Model` 的任何属性：\n\n```rust\nimpl ObjectImpl\
  \ for Model {}\n```\n\n实际工作将由我们为 `Model` 实现的 `ListModelImpl` 特性完成。该特性为我们做了三件事：返回项目的类型（`item_type()`）、返回项目数量（`n_items()`）以及根据位置返回项目（`item()`）：\n\
  \n```rust\nimpl ListModelImpl for Model {\n    // 我们要处理的第一个函数是 `item_type()`，它将返回项目的类型。幸运的是，我们只需使用\
  \ `static_type()` 函数返回 `RowData` 的类型即可\n    fn item_type(&self, _list_model: &Self::Type)\
  \ -> Type {\n        RowData::static_type()\n    }\n\n    // 下一个要处理的函数是 `n_items()`，它将返回列表中项目的数量。这听起来就像返回向量的长度，为了实现这一点，我们将使用\
  \ `borrow()` 函数借用向量并使用 `len()` 返回长度。由于长度函数返回 `usize`，而我们需要返回 `u32`，因此在返回长度时简单地使用\
  \ `as u32`：\n    fn n_items(&self, _list_model: &Self::Type) -> u32 {\n        self.0.borrow().len()\
  \ as u32\n    }\n\n    // 我们需要的最后一个函数是 `item()`，它将根据位置返回一个 `Object<Object>`。简单的步骤是使用\
  \ `borrow()` 借用向量。现在我们有了对内部向量的不可变访问，可以使用 `get()` 函数配合作为 `usize` 的位置，这会返回一个 `Option<&RowData>`。我们可以使用类型为\
  \ `&RowData` 的参数 `o` 将 `get()` 与 `map()` 函数链式调用。通过参数 `o`，我们使用 `clone()` 将其转换为 `RowData`，然后以涡鱼符号（turbofish）的方式使用\
  \ `upcast::<Object>()` 函数将其上转换为 `Object`：\n    fn item(&self, _list_model: &Self::Type,\
  \ position: u32) -> Option<Object> {\n        self.0\n            .borrow()\n  \
  \          .get(position as usize)\n            .map(|o|o.clone().upcast::<Object>())\n\
  \    }\n}\n```\n\n完成 `Model` 的实现后，我们可以处理 `src/model.rs` 中的主模型文件，并在顶部添加以下导入：\n\n\
  ```rust\nmod imp;\nuse crate::row_data::RowData;\nuse glib::subclass::prelude::*;\n\
  use gtk::{gio, glib, prelude::*};\n```\n\n就像 `RowData` 一样，我们将创建一个新的公共结构体 `Model`，并使用\
  \ `glib::wrapper!` 宏将其封装为 GObject。在块内部，我们将创建一个新的结构体 `Model`，它是一个带有 `ObjectSubclass`\
  \ 的元组结构体（等等，原文说是“带有 ObjectSubclass 的元组结构体”，可能指的是包装器的定义）。\n\n*注：提供的文本在句子中间突然中断。我已根据规则对所提供的内容进行了格式化。*\n\
  \n\n\n在我们创建一个构建应用程序 UI 的函数之前，我们不妨先创建 `main()` 函数。在我们的 `main()` 函数中，我们首先需要使用 `gtk::Application::new()`\
  \ 定义我们的 `GTK` 应用程序，并在 `new()` 函数内部，我们将添加一个类型为 `Option<String>` 的应用程序 ID 以及应用程序的标志（flags）。应用程序\
  \ ID 将简单为 `com.grocery_list`。通常，你会放入某种类型的组织 ID，但我们这里没有。由于参数是一个 `Option`，我们将把字符串放在\
  \ `Some()` 中。应用程序的标志将使用默认值；我们没有特殊的理由来选择特定的标志，所以我们将将其留为 `Default::default()`：\n\n\
  ```rust\nfn main() {\n    let application = gtk::Application::new(\n        Some(\"\
  com.grocery_list\"),\n        Default::default(),\n    );\n```\n\n接下来，我们需要一种方法将\
  \ UI 构建器添加到我们的应用程序中，这是通过使用 `Application` 中的 `connect_activate()` 函数来实现。`connect_activate()`\
  \ 函数需要一个函数作为参数，因此我们将放入 `build_ui()` 函数，该函数将在稍后编写。现在我们已经有了连接应用程序以构建 UI 的方法；我们可以使用\
  \ `run()` 函数运行应用程序：\n\n```rust\n    application.connect_activate(build_ui);\n  \
  \  application.run();\n}\n```\n\n### 构建用户界面\n\n完成 `main()` 函数后，我们现在可以开始编写构建应用程序\
  \ UI 的函数了。让我们先定义 `build_ui()` 函数，其参数为类型为 `&gtk::Application` 的应用程序：\n\n```rust\n\
  fn build_ui(application: &gtk::Application) {\n```\n\n创建应用程序的第一步是应用程序的窗口。我们将使用 `gtk::ApplicationWindow::new()`\
  \ 并传入我们的参数 `application` 创建新窗口：\n\n```rust\n    let window = gtk::ApplicationWindow::new(application);\n\
  ```\n\n有了绑定变量 `window`，我们可以开始为我们的窗口定义属性，例如标题、边框宽度、位置和默认大小。为了定义标题，我们将使用 `set_title()`\
  \ 函数并将标题设置为“Grocery List”。然后我们希望边框宽度为 10 像素，因此我们将使用 `set_border_width(10)`，其中 10\
  \ 的单位是像素。我们窗口的位置应该是居中的，因此使用 `set_position()` 函数并存入 `gtk::WindowPosition::Center`\
  \ 来定义窗口的位置。最后，窗口的默认大小为 320 x 480 像素；这是通过 `set_default_size()` 完成的，第一个参数是宽度，第二个参数是高度：\n\
  \n```rust\n    window.set_title(\"Grocery List\");\n    window.set_border_width(10);\n\
  \    window.set_position(gtk::WindowPosition::Center);\n    window.set_default_size(320,\
  \ 480);\n```\n\n项目将存储在垂直框中；我们将创建一个绑定 `vbox`，它是一个使用 `gtk::Orientation::Vertical`\
  \ 垂直方向的新类型 `gtk::Box`，间距为 5 像素：\n\n```rust\n    let vbox = gtk::Box::new(gtk::Orientation::Vertical,\
  \ 5);\n```\n\n接下来，我们可以将 `Model` 定义为绑定 `model`，它稍后将与 `ListBox` 一起使用，我们也可以定义为绑定 `listbox`：\n\
  \n```rust\n    let model = model::Model::new();\n    let listbox = gtk::ListBox::new();\n\
  ```\n\n我们接下来需要使用 `bind_model()` 将我们的模型绑定到列表框。此函数需要一个模型（封装在 `Option` 中）以及一个创建一个小部件的函数。在研究创建小部件函数之前，让我们定义\
  \ `bind_model()` 的前半部分：\n\n```rust\n    listbox.bind_model(Some(&model),\n```\n\n\
  我们的整个函数将位于来自 `gtk` 编译的 `clone!` 宏中，它用于在闭包内部传递值的强引用或弱引用。我们将使用的引用是 `window`，为了定义一个弱引用，我们会在它之前放入\
  \ `@weak`，并将其定义为使用默认 panic（使用 `@default-panic`）：\n\n```rust\n    clone!(@weak window\
  \ => @default-panic,\n```\n\n然后我们将在闭包中定义一个参数 `item`，为了确保值在闭包中移动，我们将在定义参数之前放入 `move`\
  \ 关键字：\n\n```rust\n    move |item| {\n```\n\n我们将创建一个新的 `ListBoxRow` 绑定 `box_`，并创建一个绑定\
  \ `item`，它将使用我们已有的参数 `item`，并使用 `downcast_ref::<RowData>()` 将其强制转型为 `RowData`。我们还需要使用一个水平框，它将通过\
  \ `gtk::Box::new()` 创建，但方向将是水平（`gtk::Orientation::Horizontal`），间距为 5 像素：\n\n```rust\n\
  \    let box_ = gtk::ListBoxRow::new();\n    let item = item.downcast_ref::<RowData>().expect(\"\
  Row data is of wrong type\");\n    let hbox = gtk::Box::new(gtk::Orientation::Horizontal,\
  \ 5);\n```\n\n我们行中的项目将使用标签，所以我们可以从创建一个绑定 `label` 开始，它将使用 `gtk::Label::new()` 创建。然后我们可以使用\
  \ `bind_property()` 将“item”属性与我们的标签绑定，并绑定名称“label”。我们将该方法与 `flags()` 链，传入 `DEFAULT`\
  \ 和 `SYNC_CREATE` 绑定标志，根据常理解，这将同步创建标签。最后，为了构建它，我们将链式调用 `build()` 方法：\n\n```rust\n\
  \    let label = gtk::Label::new(None);\n    item.bind_property(\"item\", &label,\
  \ \"label\")\n        .flags(glib::BindingFlags::DEFAULT | glib::BindingFlags::SYNC_CREATE)\n\
  \        .build();\n```\n\n然后我们可以使用 `pack_start()` 函数将标签放入我们的水平框 `hbox` 中：\n\n```rust\n\
  \    hbox.pack_start(&label, true, true, 0);\n```\n\n\n\n\n在对话框窗口中，我们需要能够添加不同的按钮，用于输入新标签或增加/减少项目的计数。为了声明一个内容区域，我们将创建一个新的绑定\
  \ `content_area`，并将其赋值给 `dialog.content_area()`：\n\n```rust\nlet content_area =\
  \ dialog.content_area();\n```\n\n现在，我们可以使用 `gtk::Entry::new()` 创建一个输入框（entry）；这将被用于重命名我们的项目标签。通过该输入框，我们将将其属性绑定到\
  \ `item`，源为 \"item\"，目标为 `&entry`，目标属性为 \"text\"。就像我们之前的计数器按钮（spin button）一样，标志将为\
  \ `DEFAULT`、`SYNC_CREATE` 和 `BIDIRECTIONAL`。在 `bind_property()` 和 `flags()` 链的末尾，我们将使用\
  \ `build()` 构建该属性：\n\n```rust\nitem.bind_property(\"item\", &entry, \"text\")\n\
  .flags(glib::BindingFlags::DEFAULT | glib::BindingFlags::SYNC_CREATE | glib::BindingFlags::BIDIRECTIONAL)\n\
  .build();\n```\n\n我们希望输入框在激活时（按下回车）能够关闭，为了实现这一点，我们使用 `connect_activate()` 函数。在函数内部，我们将使用\
  \ `clone!()` 宏配合对 dialog 的弱引用；通过 dialog，我们将使用 `response()` 函数配合 `ResponseType::Close`\
  \ 发送关闭响应：\n\n```rust\nentry.connect_activate(clone!(@weak dialog => move |_| {\n\
  \    dialog.response(ResponseType::Close);\n}));\n```\n\n完成 `entry` 的所有工作后，我们可以使用\
  \ `add()` 函数将其添加到 `content_area` 中：\n\n```rust\ncontent_area.add(&entry);\n```\n\
  \n对于我们的计数器，我们需要创建一个计数器按钮（spin button）；像之前一样，我们将使用 `gtk::SpinButton::with_range()`，最小值为\
  \ 0，最大值为 100，步长为 1：\n\n```rust\nlet spin_button = gtk::SpinButton::with_range(0.0,\
  \ 100.0, 1.0);\n```\n\n对于 `spin_button`，我们需要像之前一样将它的属性绑定到 `item`，在构建之后，我们可以将 `spin_button`\
  \ 添加到 `content_area`：\n\n```rust\nitem.bind_property(\"count\", &spin_button, \"\
  value\")\n.flags(glib::BindingFlags::DEFAULT | glib::BindingFlags::SYNC_CREATE |\
  \ glib::BindingFlags::BIDIRECTIONAL)\n.build();\n\ncontent_area.add(&spin_button);\n\
  ```\n\n在编辑按钮的 `connect_clicked()` 函数的末尾，我们将使用 `show_all()` 让对话框显示所有内容：\n\n```rust\n\
  dialog.show_all();\n}));\n```\n\n由于 `edit_button` 已经完成，我们可以使用 `pack_start()` 将其封装到水平布局框\
  \ `hbox` 中：\n\n```rust\nhbox.pack_start(&edit_button, false, false, 0);\n```\n\n\
  当水平布局框包含了所需的所有组件（一个标签、一个计数器按钮和一个编辑按钮）后，我们可以使用 `add()` 函数将其添加到主垂直布局框中：\n\n```rust\n\
  box_.add(&hbox);\n```\n\n当用户按下编辑按钮时，我们希望按钮触发一个点击事件；为了做到这一点，我们将为垂直布局框 `box_` 使用 `connect_activate()`\
  \ 函数。在函数内部以及 `connect_activate()` 内部，我们将使用 `clone!()` 宏配合对 `edit_button` 的弱引用；通过\
  \ `edit_button`，我们将使用 `emit_clicked()` 函数触发点击：\n\n```rust\nbox_.connect_activate(clone!(@weak\
  \ edit_button => move |_| {\n    edit_button.emit_clicked();\n}));\n```\n\n现在，我们可以使用\
  \ `show_all()` 函数让垂直布局框显示所有内容，之后，我们可以使用 `upcast::<gtk::Widget>()` 函数作为类型为 `gtk::Widget`\
  \ 的 turbofish 将 `box_` 向上转换为 widget：\n\n```rust\nbox_.show_all();\nbox_.upcast::<gtk::Widget>()\n\
  }));\n```\n\n如果我们拥有所有杂货项目组件，我们需要一种方法来滚动它们；通过创建一个新的滚动窗口（scrolled window）并将 `listbox`\
  \ 添加其中来实现非常简单。在使用 `gtk::ScrolledWindow::new()` 创建新的滚动窗口时，我们将水平和垂直调整量都设置为 `gtk::Adjustment::None`。要将\
  \ `listbox` 添加到滚动窗口，我们将再次使用 `add()` 函数：\n\n```rust\nlet scrolled_window = gtk::ScrolledWindow::new(gtk::Adjustment::NONE,\
  \ gtk::Adjustment::NONE);\nscrolled_window.add(&listbox);\n```\n\n你可能会问还剩下什么？嗯，我们还没有添加/删除项目的功能，没有这些功能，我们的程序将完全毫无用处。让我们先开始制作添加按钮，通过创建一个水平布局框和一个按钮。\n\
  \n水平布局框将赋值给绑定 `hbox`，并使用 `gtk::Box::new()` 创建，方向设置为 `gtk::Orientation::Horizontal`。该框将具有\
  \ 5 的像素间距：\n\n```rust\nlet hbox = gtk::Box::new(gtk::Orientation::Horizontal, 5);\n\
  ```\n\nlet add_button = gtk::Button::with_label(\"Add\");\n\n当当用户按下添加按钮时，我们需要打开一个对话框。为了实现这一点，我们将使用\
  \ `Dialog::with_buttons()` 函数。第一个按钮是“Ok”，对应 `ResponseType::Ok`，另一个是“Cancel”，对应 `ResponseType::Close`。对话框将是模态的：\n\
  \n```rust\nlet dialog = gtk::Dialog::with_buttons(\n    Some(\"Add Item\"),\n  \
  \  Some(&window),\n    true,\n    &[(\"Ok\", ResponseType::Ok), (\"Cancel\", ResponseType::Close)]\n\
  );\n```\n\n我们需要创建一个响应来将对话框的内容追加到 `RowData`，我们将使用函数 `connect_response()` 创建一个函数并同时使用\
  \ `clone!()` 宏。我们将使用对 `model`、`entry` 和 `spin_button` 的弱引用，同时还拥有参数 `dialog` 和响应\
  \ `resp`：\n\n```rust\ndialog.connect_response(clone!(@weak model, @weak entry, @weak\
  \ spin_button => move |dialog, resp| {\n    if resp == ResponseType::Ok {\n    \
  \    let row = RowData {\n            label: entry.text().to_string(),\n       \
  \     count: spin_button.value() as i32,\n        };\n        model.add(row);\n\
  \    }\n    dialog.close();\n}));\n```\n\n\n\n\n```rust\ndialog.connect_response(clone!(@weak\
  \ model, @weak entry, @weak spin_button => move |dialog, resp| {\n```\n\n我们将使用 `entry`\
  \ 的 `text()` 函数从输入框中获取文本，并将其赋值给绑定变量 `text`。只有当文本不空且响应为 `ResponseType::Ok` 时，我们才会将数据追加到\
  \ `model` 中。如果用户没有输入内容，我们将关闭对话框；如果取消了对话框，我们也将其关闭：\n\n```rust\nlet text = entry.text();\n\
  \nif !text.is_empty() && resp == ResponseType::Ok {\n    model.append(&RowData::new(&text,\
  \ spin_button.value() as u32));\n}\n\ndialog.close();\n}));\n```\n\n在添加按钮的 `conncect_clicked()`\
  \ 函数末尾，我们将使用 `show_all()` 函数显示所有的 `dialog`：\n\n```rust\ndialog.show_all();\n}));\n\
  ```\n\n我们的添加按钮已经完成了；现在，我们可以将其添加到水平布局框 `hbox` 中，并开始创建删除按钮，它的创建方法与我们使用 `gtk::Button::with_label()`\
  \ 创建 `add_button` 类似：\n\n```rust\nhbox.add(&add_button);\n\nlet delete_button =\
  \ gtk::Button::with_label(\"Delete\");\n```\n\n要删除一个项目，用户需要选择特定的行并按下删除按钮。在 Rust\
  \ 中我们如何实现这一点呢？首先，我们需要为 `delete_button` 使用 `connect_clicked()` 函数，以便配置用户点击按钮时会发生什么。我们将在内部使用\
  \ `clone!()` 宏，并对 `model` 和 `listbox` 使用弱引用：\n\n```rust\ndelete_button.connect_clicked(clone!(@weak\
  \ model, @weak listbox => move |_| {\n```\n\n我们首先需要做的是显而易见的，获取选中的行，但如何获取它呢？我们之所以引用\
  \ `listbox` 是因为它拥有 `selected_row()` 函数，该函数会返回一个 `Option<ListBoxRow>`：\n\n```rust\n\
  let selected = listbox.selected_row();\n```\n\n为了获取内部的 `ListBoxRow`，我们将使用 `if let`\
  \ 语句，如果有内容则将其赋值给绑定 `selected`。在 `if` 块中，我们将使用 `ListBoxRow` 的 `index()` 函数获取索引，并使用该索引通过\
  \ model 的 `remove()` 函数删除该行（确保使用 `as` 将 `usize` 转换为 `u32`）：\n\n```rust\nif let Some(selected)\
  \ = selected {\n    let idx = selected.index();\n    model.remove(idx as u32);\n\
  }\n\n}));\n```\n\n这就是删除按钮需要需要的所有操作，现在我们将其将其添加到水平布局框 `hbox` 中，该框也包含了我们的添加按钮：\n\n\
  ```rust\nhbox.add(&delete_button);\n```\n\n现在，我们可以使用 `pack_start()` 函数将水平布局框 `hbox`\
  \ 添加到主垂直布局框 `vbox` 中，之后我们想要添加滚动窗口 `scrolled_window`，让它位于添加和删除按钮下方：\n\n```rust\n\
  vbox.pack_start(&hbox, false, false, 0);\n\nvbox.pack_start(&scrolled_window, true,\
  \ true, 0);\n```\n\n现在，我们可以使用 `add()` 函数将垂直布局框 `vbox` 添加到主窗口中，最后在程序结束时，我们可以使用 `show_all()`\
  \ 函数显示窗口中的所有内容：\n\n```rust\nwindow.add(&vbox);\n\nwindow.show_all();\n}\n```\n\n\
  # 测试我们的 GTK \n\n要运行应用程序，我们只需要运行 `cargo run`。然而，为了给程序添加一些额外的优化，我们将使用 `cargo run –release`\
  \ 以发布模式运行程序。当你编译程序时，你应该会看到一个与[图 7.2]所示相似的窗口：\n\n![](img/Figure-7.2.jpg)\n\n**图 7.2：**\
  \ 购物列表应用的启动窗口\n\n如果我们添加一个项目（例如 2 个鸡蛋），将会显示“添加项目”对话框，如[图 7.3]所示：\n\n![](img/Figure-7.3.jpg)\n\
  \n**图 7.3：** 购物列表中的添加项目对话框\n\n如果我们对鸡蛋改变了主意，只需要 1 个怎么办？这时我们可以点击编辑按钮，并看到如[图 7.4]所示的“编辑项目”对话框：\n\
  \n![](img/Figure-7.4.jpg)\n\n**图 7.4：** 购物列表中的编辑项目对话框\n\n要删除该项目，我们只需要选择该项目并按下 `Delete`\
  \ 按钮。\n\n### 结论\n\n在本章中，我们通过创建一个……探索了 `gtk` crate。\n\n# 关键知识点\n\n*   在……时推荐使用 GTK……\n\
  *   要转换 Rust 结构体，你需要实现 `Objectclass` trait 以及……\n*   `once_cell` crate 有益于初始化……\n\
  \n### 练习题\n\n1. 创建一个可以通过按钮创建窗口的应用程序。\n2. 创建一个带有进度条的应用程序，并在用户按下……时开始运行。\n\n### 答案\n\
  \n1. 此练习题源自 `gtk3-rs` 仓库，我们将通过……首先，我们将创建一个新项目并添加 `gtk` crate：\n\n```bash\n$ cargo\
  \ new multi_windows\n$ cd multi_windows\n$ cargo add gtk\n```\n\n\n\n\n在我们使用 `build_ui()`\
  \ 函数创建用户界面之前，我们有一些辅助函数需要创建，以让我们的工作更轻松。我们将编写的第一个函数是创建应用程序的主窗口 `create_main_window()`。我们期望一个应用程序（类型为\
  \ `&gtk::Application`），并将返回主窗口或一个 `gtk::ApplicationWindow`：\n\n```rust\nfn create_main_window(application:\
  \ &gtk::Application) -> gtk::ApplicationWindow{\n```\n\n第一步是简单的；我们将使用 `gtk::ApplicationWindow::new()`\
  \ 创建一个新的应用程序窗口，它将接收一个应用程序。在创建新的应用程序窗口后，我们需要使用 `set_title()` 函数设置标题为“Multi Window”（多窗口），之后，我们需要使用\
  \ `set_default_size()` 设置应用程序的默认大小，我们将将其设定为 400 x 320 像素，即高度为 400 像素，宽度为 320 像素。窗口应该是居中的，为了实现这一点，我们将在\
  \ `set_position()` 函数中使用 `gtk::WindowPosition::Center` 将位置设置为中心。设置好配置后，我们就可以显示所有内容并返回应用程序窗口：\n\
  \n```rust\nlet window = gtk::ApplicationWindow::new(application);\n\n// 设置标题\nwindow.set_title(\"\
  Multi Window\");\n\n// 设置默认大小\nwindow.set_default_size(400, 320);\n\n// 使窗口居中\n\
  window.set_position(gtk::WindowPosition::Center);\n\n// 显示所有内容\nwindow.show_all();\n\
  \nwindow\n}\n```\n\n我们将创建的下一个辅助函数用于生成 ID 数字 `generate_new_id()`，我们将简单地从 0 开始分配 ID\
  \ 并在此基础上加 1。由于我们将使用哈希表（hashmaps）来存储窗口及其相应的 ID，我们可以简单地使用 `while` 循环检查我们的 ID 是否存在值；如果存在，我们将继续递增直到得到一个\
  \ `None` 值，这是通过将 ID 链式 `get()` 函数实现的，它将返回一个 `Option<Value>`，并使用 `is_some()` 方法，如果值不是\
  \ `None` 则返回 `true`，如果是则返回 `false`：\n\n```rust\nfn generate_new_id(windows: &HashMap<usize,\
  \ glib::WeakRef<gtk::Window>>) -> usize{\n    let mut id = 0;\n    while windows.get(&id).is_some(){\n\
  \        id += 1\n    }\n    id\n}\n```\n\n最后一个辅助函数是帮助创建新的子窗口 `create_sub_window()`，我们需要一个应用程序的引用、子窗口的标题、来自主窗口的条目（entry）、一个\
  \ ID 以及对窗口的引用。关于窗口有一点说明，因为我们需要经常克隆（clone）和借用（borrow）窗口，内部的 `HashMap` 被包装在引用计数器和引用单元（`Rc<RefCell<>>`）：\n\
  \n```rust\nfn create_sub_window(application: &gtk::Application, title: &str, main_window_entry:\
  \ &gtk::Entry, id: usize, windows: &Rc<RefCell<HashMap<usize, glib::WeakRef<gtk::Window>>>>){\n\
  ```\n\n我们希望这些新的子窗口是顶层窗口，因此我们将创建一个新的绑定 `window`，它将是一个 `gtk::Window` 并使用它的 `new()`\
  \ 方法创建，该方法需要一个类型，我们将传入 `gtk::WindowType::Toplevel`，正如我们希望它是的那样：\n\n```rust\nlet\
  \ window = gtk::Window::new(gtk::WindowType::Toplevel);\n```\n\n有了新的子窗口后，我们可以通过借用\
  \ `window` 使用 `add_window()` 函数将其添加到我们的主应用程序中：\n\n```rust\napplication.add_window(&window);\n\
  ```\n\n就像我们一直这样做的那样，通过借用 `window` 我们可以将其添加到我们的主应用程序中。。，我们需要使用 `set_title()` 设置标题，使用\
  \ `set_default_size()` 设置默认大小（正如我们想要的那样 400 x 320 像素），我们需要设置窗口标题：\n\n```rust\nwindow.set_title();\n\
  ```\n\n当用户关闭窗口时，我们需要使用 `delete_event()` 函数，使用 `glib::clone!` 宏来处理 `window` 的弱引用，我们需要\
  \ `windows` 被可变地借用，并返回 `Inhibit(false)`：\n\n```rust\nwindow.delete_event(\n    glib::clone!(@weak\
  \ windows => move | _| {\n        // 在此块中，我们需要可变地借用 windows 以移除条目\n        windows.borrow_mut().remove(&id);\n\
  \        // 关闭后返回 Inhibit(false)\n        glib::Propagation::Proceed\n    }),\n\
  );\n```\n\n在 `windows` 中，我们需要创建一个点击时会通知主窗口的按钮，使用 `gtk::Button::with_label()` 创建，标签将命名为：\n\
  \n```rust\nlet button = gtk::Button::with_label(\n    &format!(\"Notify window {}\"\
  , id));\n```\n\n我们的下一个任务是让这个按钮有用；为了实现这一点，我们将使用 `connect_clicked()` 函数。在函数内部，我们需要\
  \ `main_window_entry` 的弱引用以便设置缓冲区。我们需要使用 `buffer()` 方法来访问缓冲区：\n\n```rust\nbutton.connect_clicked(glib::clone!(@weak\
  \ main_window_entry => move |_| {\n    main_window_entry.buffer().set_text(&format!(\"\
  sub window clicked\")));\n}));\n```\n\n按钮的功能完成后，我们可以使用 `add()` 函数将其添加到 `window`\
  \ 中。之后，我们可以显示所有内容，并且将子窗口添加到 `windows`。要向 `windows` 添加新窗口，我们首先需要使用 `borrow_mut()`\
  \ 函数对其进行可变借用，并链式调用 `insert()` 函数，其中 `id` 将是键，我们将使用 `downgrade()` 方法创建 `gtk::Window`\
  \ 的弱引用：\n\n```rust\nwindow.add(&button);\nwindow.show_all();\n// 一旦新窗口创建完成，\n//\
  \ 我们将其放入哈希表以便在需要时\n// 更新。\nwindows.borrow_mut().insert(id, window.downgrade());\n\
  }\n```\n\n到目前为止我们写的所有内容，如果没有使用它们的方法，它们将完全无用，这正是 `build_ui()` 函数派用场场，它将生成应用程序的用户界面。该函数只需要一个参数，即对主应用程序的引用，这在\
  \ `main()` 函数中通过 `connect_activate()` 传递时已经完成了：\n\n```rust\nfn build_ui(application:\
  \ &gtk::Application){\n// 我们必须做的第一件事是初始化我们的窗口集合，\n// 它们将存储在一个哈希表中，使用 ID 作为键（类型 `usize`）\n\
  // 以及对 `gtk::Window` 的弱引用（类型 `glib::WeakRef<gtk::Window>`）。\n// 由于我们需要共享这个哈希表并经常借用它，\n\
  // 我们将哈希表包装在引用计数器和引用单元中：\n// 我们的窗口将存储在哈希表中\nlet windows: Rc<RefCell<HashMap<usize,\
  \ glib::WeakRef<gtk::Window>>>> = Rc::new(RefCell::new(HashMap::new()));\n\n// 我们的主窗口使用我们的辅助函数\
  \ `create_main_window()` 创建，\n// 它需要我们的参数以及 `application` 并赋值给绑定 `window`：\n// 我们将使用函数\
  \ create_main_window() 分我们的主窗口\nlet window = create_main_window(application);\n\
  }\n```\n\n\n\n修改每个子窗口的标题太麻烦了，所以为什么我们不创建一个条目，允许它一次性更新所有子窗口的标题呢？首先，我们将使用 `gtk::Entry::new()`\
  \ 创建一个新的条目，并为它分配一个占位文本，告诉用户它可以更新所有标题；这是通过 `set_placeholder_text()` 函数实现的：\n\n```rust\n\
  // allow all sub window's title to change at once\nlet windows_title_entry = gtk::Entry::new();\n\
  // set placeholder for the entry\nwindows_title_entry.set_placeholder_text(Some(\"\
  Update all sub-window's titles\"));\n```\n\n当条目检测到变化时，我们将更新所有子窗口的标题；为了开始这一操作，我们将使用\
  \ `connect_changed()` 函数，它允许我们在条目发生更改时配置一个事件。我们将使用 `glib::clone!()` 宏来获取我们窗口的弱引用（因为我们需要更新它们的所有标题）以及一个参数\
  \ `windows_title_entry`，它将是用户输入的那个条目：\n\n```rust\nwindows_title_entry.connect_changed(glib::clone!(\
  \ @weak windows => move |windows_title_entry|{\n```\n\n要从条目获取文本，我们需要通过 `buffer()`\
  \ 方法从条目的缓冲区中获取，并使用 `text()` 方法接收内部文本：\n\n```rust\n// get the entry's text from the\
  \ buffer\nlet text = windows_title_entry.buffer().text();\n```\n\n为了更改子窗口的标题，我们需要通过\
  \ `borrow()` 方法借用 `windows` 并链式 `values()` 方法来遍历每个子窗口，以获取每个 `WeakRef<gtk::Window>`。我们在迭代器中获取的每个\
  \ `window` 都是一个 `Option`，因此我们将使用 `if let` 语句仅处理具有 `Some(w)` 的值（其中 `w` 是 `WeakRef<gtk::Window>`），并使用\
  \ `upgrade()` 方法将其升级为 `gtk::Window`。对于每个窗口，我们可以通过借用 `text` 并使用 `set_title()` 方法来设置标题：\n\
  \n```rust\nfor window in windows.borrow().values(){\n    if let Some(w) = window.upgrade(){\n\
  \        w.set_title(&text)\n    }\n}\n}));\n```\n\n当用户点击子窗口时，我们希望条目能在我们的主窗口中通知用户子窗口\
  \ *foo* 已点击，其中 *foo* 是 ID。为了开始工作，我们将使用 `gtk::Entry::new()` 创建一个新的条目，并将其赋值给绑定项 `entry`。通过\
  \ `entry`，我们使用 `set_editable()` 方法并传入 `false` 来使其变得不可编辑，并使用 `set_placeholder_text()`\
  \ 方法为其设置一个占位符：\n\n```rust\n// create a new entry for notifications\nlet entry =\
  \ gtk::Entry::new();\n// make it unable to be edited\nentry.set_editable(false);\n\
  entry.set_placeholder_text(Some(\"Event notifications will be sent here\"));\n```\n\
  \n我们一直在讨论创建子窗口，但仍然没有创建任何窗口的方法，好吧，那是因为我们需要一个按钮！涉及的按钮将使用 `gtk::Button::with_label()`\
  \ 创建，带有告诉用户创建新窗口的标签：\n\n```rust\n// create a button to create subwindows\nlet button\
  \ = gtk::Button::with_label(\"Create a new window\");\n```\n\n为了创建一个新的子窗口，我们需要在按钮被点击时创建一个事件，因此我们将利用\
  \ `connect_clicked()` 函数，并使用 `glib::clone!()` 宏来获取 `windows_title_entry`、`entry`\
  \ 和 `application` 的弱引用：\n\n```rust\nbutton.connect_clicked(\nglib::clone!(@weak\
  \ windows_title_entry, @weak entry, @weak application => move |_| {\n```\n\n在内部，我们首先需要为子窗口生成一个新的\
  \ ID，这是通过我们的辅助函数 `generate_new_id()` 实现的，通过借用 `windows` 并使用 `borrow()` 函数访问内部的 `HashMap`。接下来，我们需要创建一个子窗口；这是通过使用辅助函数\
  \ `create_sub_window()` 实现的。该函数需要应用程序的引用、从 `windows_title_entry` 缓冲区获取并链式 `text()`\
  \ 方法的标题、条目的引用（以便我们可以设置通知）、分配给子窗口的 ID 以及对 `windows` 的引用（以便我们将其添加到 `HashMap` 中）：\n\
  \n```rust\nlet id = generate_new_id(&windows.borrow());\ncreate_sub_window(&application,\n\
  &windows_title_entry.buffer().text(),\n&entry,\nid,\n&windows\n);\n})\n```\n\n\n\
  \n\n在我们开始编写任何函数之前（会有很多函数），让我们先创建一些结构体，它们将帮助我们构建应用程序的 UI 和进度机制。我们将从最高抽象层到最低抽象抽象进行构建。\n\
  \n第一个结构体是 `Application`，它将包含一个公共字段 `widgets`，并对 widgets 使用引用计数器，因为我们需要多个所有者：\n\n\
  ```rust\npub struct Application{\npub widgets: Rc<Widgets>\n}\n```\n\n下一个结构体是一言而易的，那就是\
  \ `Widgets`，它将包含我们应用程序所有的各种组件。所有字段都是公开的；第一个是主窗口，如果你还没有察觉的话，它是 `gtk::ApplicationWindow`。下一个字段是标题栏（header）；我们将定义自己的结构体\
  \ `Header`，它是 `gtk::HeaderBar` 的封装。由于我们有两个不同的视图，为了管理它们，我们将有一个类型为 `gtk::Stack` 的视图栈（view\
  \ stack），正如之前讨论的，最后两个字段将是结构体的主视图 `MainView` 和完成视图结构体 `CompleteView`：\n\n```rust\n\
  pub struct Widgets{\npub window: gtk::ApplicationWindow,\npub header: Header,\n\
  pub view_stack: gtk::Stack,\npub main_view: MainView,\npub complete_view: CompleteView,\n\
  }\n```\n\n标题栏用于定义窗口的顶部部分，如标题以及关闭、最小化/最大化等按钮。在结构体 `Header` 中，我们将有一个有字段 `container`，它是\
  \ `gtk::HeaderBar`，我们封装它的目的是为了方便地处理标题栏：\n\n```rust\npub struct Header {\ncontainer:\
  \ gtk::HeaderBar,\n}\n```\n\n应用程序的主视图包含一个用于自定义应用程序布局的网格（grid）、一个进度条和一个启动进度条的按钮。按钮和进度条包含在网格内部；这就是为什么字段名为\
  \ `container`：\n\n```rust\npub struct MainView {\npub container: gtk::Grid,\npub\
  \ progress: gtk::ProgressBar,\npub button: gtk::Button,\n}\n```\n\n完成视图（complete\
  \ view）听起来可能主视图不完整，但实际上，这个视图将在进度条完成并显示任务已完成时使用。我们在结构体内部只有一个字段，即类型为 `gtk::Grid` 的\
  \ `container`：\n\n```rust\npub struct CompleteView {\npub container: gtk::Grid,\n\
  }\n```\n\n当所有不同的结构体都准备完成后，我们就可以开始编写它们，以便它们对我们有用。我们将从低抽象到高抽象进行工作。\n\n### CompleteView\n\
  \n让我们从处理 `CompleteView` 开始。该视图的目标是看起来像图 7.7：\n\n![](img/Figure-7.7.jpg)\n\n**图 7.7：**\
  \ 完成视图预览\n\n我们希望标签 *Task complete* 居中显示，并且能够在水平和垂直方向上扩展。首先，我们将为 `CompleteView` 创建一个\
  \ `new()` 函数，并使用 `gtk::Label::new()` 创建新标签：\n\n```rust\nimpl CompleteView {\npub\
  \ fn new() -> Self {\nlet label = gtk::Label::new(None);\n```\n\n“Task complete”字符串在哪里？嗯，它将使用\
  \ `set_markup()` 函数添加，同时我们还将设置标签的水平对齐（`set_halign()`）和垂直对齐（`set_valign()`）为使用 `gtk::Align::Center`\
  \ 居中。由于我们希望这个标签能够在垂直和水平方向上扩展，我们将使用 `set_vexpand()` 和 `set_hexpand()` 函数并将它们设置为 true：\n\
  \n```rust\nlabel.set_markup(\"Task complete\");\nlabel.set_halign(gtk::Align::Center);\n\
  label.set_valign(gtk::Align::Center);\nlabel.set_vexpand(true);\nlabel.set_hexpand(true);\n\
  ```\n\n我们现在可以使用 `gtk::Grid::new()` 创建容器，并使用 `set_hexpand()` 和 `set_vexpand()` 方法将其设置为\
  \ true，使其也能在垂直/水平方向扩展。之后，我们可以使用 `add()` 方法将标签添加到容器中，并返回一个包含容器的 `CompleteView` 实例：\n\
  \n```rust\nlet container = gtk::Grid::new();\ncontainer.set_vexpand(true);\ncontainer.set_hexpand(true);\n\
  container.add(&label);\nSelf { container }\n}\n}\n```\n\n### MainView\n\n现在，我们可以处理结构体\
  \ `MainView`，它需要看起来像图 7.8：\n\n![](img/Figure-7.8.jpg)\n\n**图 7.8：** 主视图预览\n\n主视图有三个部分：一个容器、一个进度条和一个按钮。我们将为\
  \ `MainView` 创建一个 `new()` 函数并开始：\n\n```rust\nimpl MainView {\npub fn new() -> Self\
  \ {\nlet progress = gtk::ProgressBar::new();\n```\n\n正如你在图 7.8 中所示，我们希望进度条上方有一个标签；我们使用\
  \ `set_text()` 方法并传入“Progress Bar”。然而，为了显示该文本，我们需要它是可扩展的：\n\n```rust\nprogress.set_text(Some(\"\
  Progress Bar\"));\nprogress.show_text(true);\nprogress.hexpand(true);\n```\n\n我们需要创建的是启动按钮。要创建一个新按钮，我们将使用\
  \ `gtk::Button::new()` 并使用 `set_label()` 将标签设置为“start”，我们希望这个按钮水平居中；这可以通过 `set_halign()`\
  \ 并传入 `gtk::Align::Center` 来完成：\n\n```rust\nlet button = gtk::Button::new();\nbutton.set_label(\"\
  start\");\nbutton.set_halign(gtk::Align::Center);\n```\n\n有了启动按钮和进度条，我们现在可以创建一个新网格以便将这些组件连接在一起。我们将新网格赋值给绑定\
  \ `container`，并使用其 `new()` 方法创建一个新的 `gtk::Grid`：\n\n```rust\nlet container = gtk::Grid::new();\n\
  ```\n\n为了将我们的组件附加到容器，我们将使用 `attach()` 方法，它接受一个组件以及左、上边界值、宽度和高度。对于我们的进度条，我们希望它位于按钮上方，因此它的顶部为\
  \ 0，宽度和高度为 1；按钮相同，但其顶部为 1，使其位于下方（两者的左边界均为 0）：\n\n```rust\ncontainer.attach(&progress,\
  \ 0, 0, 1, 1);\ncontainer.attach(&button, 0, 1, 1, 1);\n```\n\n我们将使用 `set_row_spacing()`\
  \ 函数将容器的行间距设置为 12，并使用 `set_border_width()` 函数将边宽设置为 6。我们希望容器在垂直和水平方向上可扩展，这需要在 `set_vexpand()`\
  \ 和 `set_hexpand()` 方法中传入 true：\n\n```rust\ncontainer.set_row_spacing(12);\ncontainer.set_border_width(6);\n\
  container.set_vexpand(true);\ncontainer.set_hexpand(true);\n```\n\n在容器完成后，我们可以使用绑定\
  \ `container`、`progress` 和 `button` 创建一个新的 `MainView`：\n\n```rust\nSelf {\ncontainer,\n\
  progress,\nbutton,\n}\n}\n}\n```\n\n\n\n\n完成 `MainView` 后，我们可以开始编写页头（header），它内部包含一个用于自定义应用程序页头的标题栏（headerbar）。在我们的\
  \ `new()` 函数中，我们将使用 `gtk::HeaderBar::new()` 将绑定项 `container` 分配给一个新的标题栏。在页头中，我们希望将窗口标题设置为“Progress\
  \ Tracker”，由于函数 `set_title()` 需要一个 `Option<&str>`，因此我们的字符串将封装在 `Some()` 中。页头中最后需要的功能是显示一个关闭按钮；这通过向函数\
  \ `set_show_close_button()` 传递 `true` 来。之后，我们可以使用绑定项 `container` 返回一个新的 `Header`：\n\
  \n```rust\nimpl Header {\n    pub fn new() -> Self {\n        let container = gtk::HeaderBar::new();\n\
  \        container.set_title(Some(\"Progress Tracker\"));\n        container.set_show_close_button(true);\n\
  \        Self { container }\n    }\n}\n```\n\n到目前为止，我们已经处理了主视图、完成视图以及应用程序的页头。我们如何将这些不同的部分组合在一起？嗯，它们都将放入我们的结构体\
  \ `Widgets` 中，该结构体将持有主应用程序的所有不同组件。我们将编写一个 `new()` 函数，它需要引用应用程序（`&gtk::Application`）：\n\
  \n```rust\nimpl Widgets {\n    pub fn new(application: &gtk::Application) -> Self\
  \ {\n```\n\n我们需要做的第一件事是创建一个完成视图和一个主视图；这些将分别使用 `CompletedView::new()` 和 `MainView::new()`\
  \ 创建。\n\n```rust\nlet complete_view = CompleteView::new();\nlet main_view = MainView::new();\n\
  ```\n\n我们将使用 `gtk::Stack::new()` 创建一个新的视图堆栈（view stack）；视图堆栈的目的是让我们可以在主视图和完成视图之间切换。首先，我们需要添加一些自定义，所以我们将边界宽度设置为\
  \ 6，并让它在垂直/水平方向上可扩展：\n\n```rust\nlet view_stack = gtk::Stack::new();\nview_stack.set_border_width(6);\n\
  view_stack.set_vexpand(true);\nview_stack.set_hexpand(true);\n```\n\n我们现在可以使用 `add()`\
  \ 函数将主视图和完成视图添加到视图堆栈中；我们希望先添加主视图，所以将引用内部容器（`&main_view.container`），然后以相同的方式添加完成视图：\n\
  \n```rust\nview_stack.add(&main_view.container);\nview_stack.add(&complete_view.container);\n\
  ```\n\n在我们开始处理主应用程序窗口之前，我们需要使用 `Header::new()` 创建一个新的页头。创建页头后，我们可以使用 `gtk::ApplicationWindow::new()`\
  \ 创建一个新的应用程序窗口，并传入参数 `application`：\n\n```rust\nlet header = Header::new();\nlet\
  \ window = gtk::ApplicationWindow::new(application);\n```\n\n我们希望窗口居中显示，因此通过使用 `set_window_position()`\
  \ 函数将窗口位置设置为 `gtk::WindowPosition::Center` 来实现。为了利用我们的绑定项 `header`，我们将使用 `set_titlebar`\
  \ 函数，该函数需要一个封装在 `Option` 中的引用组件。我们希望应用程序窗口的默认大小为 500 x 250 像素，我们将使用 `set_default_size()`\
  \ 设置设置，其中 500 是宽度，250 是高度。我们可以使用 `add()` 函数将 `view_stack` 添加到 `window`；一旦完成，我们就可以使用\
  \ `show_all()` 函数显示所有内容。窗口的最后一个任务是使用 `connect_delete_event()` 处理窗口何时关闭，我们将使用 `window`\
  \ 并调用 `close()` 函数让其关闭。由于我们不想阻止默认处理程序，我们将确保在 `connect_delete_event()` 中返回 `Inhibit(false)`：\n\
  \n```rust\nwindow.set_window_position(gtk::WindowPosition::Center);\nwindow.set_titlebar(Some(&header.container));\n\
  window.set_default_size(300, 100);\nwindow.add(&view_stack);\nwindow.show_all();\n\
  window.connect_delete_event(move |window, _| {\n    window.close();\n    Inhibit(false)\n\
  });\n```\n\n完成应用程序窗口后，我们可以使用绑定项 `window`、`header`、`view_stack`、`main_view` 和 `complete_view`\
  \ 返回一个新的 `Widgets`：\n\n```rust\nSelf {\n    window,\n    header,\n    view_stack,\n\
  \    main_view,\n    complete_view,\n}\n}\n}\n```\n\n我们需要处理的最后一个结构体是 `Application`。\n\
  \n\n\n我们将启动一个线程，该线程将使用 `for` 循环从 0 迭代到 10，并使用 `tx` 中的 `send()` 函数将封装在 `Some()` 中的数字发送出去。发送值后，我们将让线程睡眠\
  \ 0.5 秒（即 500 毫秒）。在 `for` 循环完成后，我们将发送 `None`：\n\n```rust\nthread::spawn(move ||\
  \ {\n    for v in 1..=10 {\n        let _ = tx.send(Some(v));\n        thread::sleep(Duration::from_millis(500));\n\
  \    }\n    let _ = tx.send(None);\n});\n```\n\n为了接收我们发送的值，我们将使用 `attach()` 函数，它期望一个上下文和一个函数；由于我们没有上下文，因此将将其设置为\
  \ `None`。我们将使用 `glib::clone!()` 结合 `active` 和 `widgets` 的弱引用来创建函数，并使用 `glib::Continue(false)`\
  \ 作为默认返回值，该函数将包含一个类型为 `Option<i32>` 的参数 `value`。我们将对 `value` 使用 `match` 语句：\n\n\
  ```rust\nrx.attach(None, glib::clone!(@weak active, @weak widgets => @default-return\
  \ glib::Continue(false), move |value| match value {\n```\n\n让我们先处理 `Some(value)`\
  \ 的情况。对于该值，我们将使用 `set_fraction()` 函数为进度条设置一个比例，其中我们将该值除以 10.0。为了将整数转换为浮点数，我们将使用\
  \ `f64::from()`：\n\n```rust\nSome(value) => {\n    widgets\n        .main_view\n\
  \        .progress\n        .set_fraction(f64::from(value) / 10.0);\n```\n\n一旦 `value`\
  \ 达到 10，我们的 `for` 循环就完成了，所以会进入 panic 模式对吧？不，相反，这意味着任务已完成，我们可以使用 `widgets` 中的 `view_stack`\
  \ 并使用 `set_visible_child()` 函数将可见视图设置为完成视图：\n\n```rust\nif value == 10 {\n    widgets\n\
  \        .view_stack\n        .set_visible_child(&widgets.complete_view.container);\n\
  ```\n\n我们希望完成视图停留 1.5 秒（即 1500 毫秒），因此我们可以使用 `glib::timeout_add_local()` 函数来实现。除了间隔时间外，我们还需要传递一个函数，我们将使用\
  \ `glib::clone!()` 获取 `widgets` 的弱引用，并设置与当前函数相同的默认返回值。在 `clone!()` 内部，我们将使用 `set_fraction()`\
  \ 将进度条重置为 0，使用 `set_visible_child()` 将视图重置为主视图，并在最后返回 `glib::Continue(false)`：\n\
  \n```rust\nglib::timeout_add_local(Duration::from_millis(1500), glib::clone!(@weak\
  \ widgets => @default-return glib::Continue(false), move || {\n    widgets.main_view.progress.set_fraction(0.0);\n\
  \    widgets\n        .view_stack\n        .set_visible_child(&widgets.main_view.container);\n\
  \    glib::Continue(false)\n}));\n}\n```\n\n在 `Some(value)` 情况结束时，我们将返回 `glib::Continue(true)`；最后，在\
  \ `None` 情况下，我们将 `active` 设置为 `false` 并返回 `glib::Continue(false)`，因为循环已完成（因为我们在最后发送了\
  \ `None`）：\n\n```rust\nglib::Continue(true)\n}\nNone => {\n    active.set(false);\n\
  \    glib::Continue(false)\n}\n}));\n}),\n);\n}\n}\n\n在 `Application` 结构体完成后，我们终于可以处理\
  \ `main()` 函数了，这一切从设置程序名称和创建一个新应用程序开始。要设置程序名称，我们将使用 `glib::set_program_name()` 函数，由于该函数期望一个\
  \ `Option<&str>`，我们需要传递封装在 `Some()` 中的“Progress Tracker”。\n\n然后我们将创建一个新的绑定 `application`，并使用\
  \ `new()` 方法创建一个新的 `gtk::Application`，它期望一个应用 ID，我们将使用 `Some(\"com.progress_tracker\"\
  )`，标志位将使用 `gio::ApplicationFlags::empty()` 留为空：\n\n```rust\nfn main() {\n    glib::set_program_name(Some(\"\
  Progress Tracker\"));\n    let application = gtk::Application::new(\n        Some(\"\
  com.progress_tracker\"),\n        gio::ApplicationFlags::empty(),\n    );\n```\n\
  \n我们希望创建的所有内容在应用程序启动时发生。为了处理这一点，我们将使用 `connect_startup()` 函数并传递参数 `app`，其类型为 `&gtk::Application`。有了\
  \ `app`，我们可以创建一个新的 `Application` 并将其分配给绑定 `application`。当我们创建新的 `Application` 时，用户界面方面的一切都已准备就绪，下一个任务是将应用程序封装在\
  \ `RefCell` 和 `Option` 中，我们将此绑定命名为 `application_container`。当我们需要处理应用程序关闭时，将使用此容器：\n\
  \n```rust\napplication.connect_startup(|app| {\n    let application = Application::new(app);\n\
  \    let application_container = RefCell::new(Some(application));\n```\n\n为了处理关闭，我们将使用\
  \ `connect_shutdown()` 函数。在函数内部，我们将创建一个新的绑定 `application`，它将可变借用 `application_container`，从\
  \ `Option` 中取出值并简单地丢弃，但你可以在关闭时执行任何你认为必要的操作：\n\n```rust\napp.connect_shutdown(move\
  \ |_| {\n    let application = application_container\n        .borrow_mut()\n  \
  \      .take()\n        .expect(\"Shutdown called multiple times\");\n    // 在这里现在可以执行关闭时所需的任何操作\n\
  \    drop(application);\n});\n});\n```\n\n由于我们在启动期间已经构建并准备就绪了一切，我们可以使用 `connect_activate()`\
  \ 函数并让内部的参数和函数为空。之后，我们可以使用 `run()` 函数运行我们的应用程序，这就完成了该项目：\n\n```rust\napplication.connect_activate(|_|\
  \ {});\napplication.run();\n}\n```\n\n我们现在准备好运行并测试我们的应用程序了。为此，我们将使用使用 `cargo run\
  \ --release` 以发布模式运行程序，你将看到应用程序的不同阶段。在图 7.9 中，我们看到 Progress Tracker 启动窗口：\n\n![](img/Figure-7.9)\n\
  **图 7.9:** Progress Tracker 启动窗口\n\n在图 7.10 中，我们看到进度条运行任务：\n\n![](img/Figure-7.10)\n\
  **图 7.10:** 进度条运行任务\n\n在图 7.11 中，我们看到 Progress Tracker 任务完成：\n\n![](img/Figure-7.11)\n\
  **图 7.11:** Progress Tracker 任务完成\n\n# 第 8 章 (toc.xhtml_c08)\n\n# 不安全 Rust 与 FFI\
  \ (toc.xhtml_c08)\n\n# 引言 (toc.xhtml_s13a)\n\nRust 本身是一种内存安全的语言，通过所有权模型帮助你避免数据竞态和段错误等问题。尽管这样做很好，但如果有人从事嵌入式项目或使用\
  \ C 绑定，他们可能需要访问绑定的某些内存，并希望忽略其生命周期/所有权。然而，当开发者这样做时，他们必须知道自己在做什么，否则可能会发生数据损坏或出现某些异常行为。\n\
  \n在 Rust 中使用不安全代码实际上允许用户告诉编译器：“嘿，你可能认为这段代码有点……不符合你的风格，但相信我，我知道做什么”。如果你正在编写底层程序，硬件将始终是不安全的，如果不让用户自己处理它们，就会破坏\
  \ Rust 作为系统编程语言的灵活性。事实上，Rust 标准库包含了许多不安全代码，但在这种情况下无需担心，因为它们是专业人士。\n\n以下内容本质上是不安全的：\n\
  \n\n\n\n\n*   解引用原始指针（原始指针为 `*const/*mut foo`）\n*   调用不安全的函数 (`unsafe fn bar()`)\n\
  *   访问或更新可变静态绑定 (`static mut baz`)\n*   实现不安全的 trait (`unsafe impl Send for Foo`)\n\
  *   访问联合体（unions）的字段\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   使用 `unsafe` 关键字\n*   在\
  \ Rust 中使用 C\n*   在 C 中使用 Rust\n\n### 目标\n\n在本章结束时，读者将理解什么是不安全的 Rust 以及如何明智地使用它，并学习如何使用**外部函数接口**\
  \ (****FFI**) 将不同的语言集成到 Rust 中，反之亦然。虽然 Rust 是安全的，但作为一种系统编程语言，它也需要允许开发者进行低级访问，类似于在\
  \ C 中可以的操作，这正是不安全 Rust 的用用场，我们将学习如何明智地使用它。最后，为了学习如何将 C 代码集成到 Rust 项目中或反之，我们需要查看\
  \ Rust FFI，它提供了一种链接这些程序的方法。\n\n# 使用 unsafe 关键字\n\n要将代码声明为 `unsafe`，你可以使用 `unsafe`\
  \ 块，或者在语句前加上 `unsafe` 关键字。让我们考虑以下不安全操作。解引用一个原始指针，我们如何让一个绑定指向另一个绑定的内存地址呢？我们可以使用原始指针，它是\
  \ `*const foo` 或 `*mut foo`（分别是不可变和可变的原始指针）。但你可能会问，原始指针是什么？原始指针就像 C 指针；它们被允许忽略绑定的所有权/生命周期，因为它们可以有多个可变/不可变指针指向同一个位置。它们不保证内存有效性，允许为空指针，并且不会自动实现\
  \ `Drop`。\n\n如果我们有一个可变绑定 `x` 并给它赋值为 32，我们该如何创建一个指向 `x` 的原始指针 `y` 呢？我们可以使用 `as` 关键字并如所示使用\
  \ `x`：\n\n```rust\n// raw_pointer.rs\nfn main(){\n    let x: i32 = 32;\n    let\
  \ y = &x as *const i32;\n}\n```\n\n但是，如果我们想打印 `y` 呢？`*const i32` 类型没有任何默认格式化器，因此我们需要解引用它。但如果内存是空的怎么办？在这种情况下，该操作就是不安全的！嗯，我们知道\
  \ `x` 存在且尚未离开作用域，所以利用这些先验知识，我们应该使用 `unsafe` 块通过解引用来打印 `y`：\n\n```rust\n// raw_pointer.rs\n\
  fn main(){\n    let x: i32 = 32;\n    let y = &x as *const i32;\n    unsafe{\n \
  \       println!(\"This is y: {}\", *y);\n    }\n}\n```\n\n如果我们使用 `rustc raw_pointer.rs`\
  \ 编译这段代码，我们将得到“This is y: 32”的输出。对于好奇的人来说，我们如何让这段代码导致段错误（segmentation fault）呢？这简单得可怕，因为如果我们没有\
  \ own `x`，代码将导致段错误，且编译器不会告诉我们这是错误的。这有两种不同的思考方式：导致段错误的原因之一之一是你获取了你想要引用的绑定的所有权，第二种思考方式是如果你想要一个绑定的位置，你就想要它的指针。\n\
  \n### 不安全函数\n\n安全函数和不安全函数之间的区别在于不安全函数只能在 `unsafe` 块内调用（即使在安全函数内部）。由于安全函数内部可以包含不安全代码，为什么还会有人给函数加上\
  \ `unsafe` 前缀呢？答案是稳定性。想象你创建了一个库，一个函数内部有很多不安全代码，并因为这个开始发生未定义行为，从而让用户完全困惑。\n\n然而，如果用户知道该函数是不稳定且不安全的，他们可以根据自己的判断使用它，这样你就不对投诉负责。让我们来看创建一个不安全函数并在安全函数内部使用它的示例。\n\
  \n我们的示例将使用更新可变静态绑定的不安全特性；我们之所以这样做而不是使用 `const ACTIVE: Mutex<bool> = Mutex::new(false)`\
  \ 的原因是因为某些程序可能为了更高的性能而牺牲一些安全性。\n\n我们将从使用 `static mut` 创建可变静态绑定开始。我们将默认设置为 false，因为任何活跃的东西在开始时应该是非活跃的：\n\
  \n```rust\n// unsafe_function.rs\nstatic mut ACTIVE: bool = false;\n```\n\n为了将任务的状态从\
  \ false 变为 true，我们将创建一个不安全的函数 `change_active()`，它将接收一个 bool，并将我们的静态绑定 `ACTIVE` 改为我们想要的任何值。要创建一个不安全的函数，我们只需要在\
  \ `fn` 关键字前加上 `unsafe`：\n\n```rust\n// 用户应该知道这个操作是不安全的\nunsafe fn change_active(active:\
  \ bool){\n    ACTIVE = active\n}\n```\n\n如果我们想在我们的 `main()` 函数中使用 `change_active()`\
  \ 函数，我们需要在函数内部使用 `unsafe` 块，因为 `main()` true 是不安全的。在块内部，我们将打印任务的当前活跃状态，然后通过 `change_active(true)`\
  \ 将其更改为 true。在我们将其重置为 `false` 并报告之前，告诉用户会很好：\n\n```rust\nfn main(){\n    unsafe\
  \ {\n        println!(\"Currently active: {}\", ACTIVE);\n        change_active(true);\n\
  \        println!(\"Task is now: {}\", ACTIVE);\n        change_active(false);\n\
  \        println!(\"Task reset: {}\", ACTIVE);\n    }\n}\n```\n\n\n\n\n我们可以使用函数\
  \ `to_raw()` 和绑定 `box_` 创建我们的原始指针，并将其赋值给一个新的绑定 `raw`。该函数会消耗掉我们的绑定 `box_`，因此在调用完该函数后，我们无法无法再次使用它：\n\
  \n```rust\n// consumes box and returns a mutable raw pointer to it\nlet raw: *mut\
  \ i32 = to_raw(box_);\n```\n\n由于我们拥有绑定 `raw`，这是一个可变原始指针，这意味着我们可以更改它的值。为了做到这一点，我们需要对其进行解引用，以便为它分配一个\
  \ `i32`。由于解引用原始指针是不安全的，而且我们的函数 `free_raw()` 也是不安全的，我们不妨在同一个 `unsafe` 块中同时更新绑定 `raw`\
  \ 并释放它：\n\n```rust\nunsafe{\n    // change the value of the raw pointer\n    *raw\
  \ = 87;\n    free_raw(raw)\n}\n```\n\n如果我们使用 `rustc box_to_raw.rs` 编译程序并运行它，将得到以下输出：\n\
  \n`$ rustc box_to_raw.rs`\n`$ ./box_to_raw`\n`Turning box of value 32 into raw`\n\
  `Dropping raw pointer of value: 87`\n\n我们已经学习了如何使用 `unsafe` 关键字以及将其用于函数。如果我们想让结构体/枚举实现一个包含不安全函数的\
  \ trait（特征））呢？我们将在下一节介绍这一方面。\n\n### Unsafe traits\n\n你可能会好奇存在哪些类型的不安全 trait，脑海中唯一想到的只有\
  \ `Send` 和 `Sync` 这两个 trait。为什么它们是不安全的呢？如果你还记得，`Send` trait 被用于允许值安全地在线程间进行发送，因此对一个值实现此\
  \ trait 意味着你必须知道这样做是安全的。`Sync` trait 则更加谨慎，因为它用于保证值的引用可以安全地在线程间进行共享。在大多数情况下，我们并不手动实现这个\
  \ trait，因为如果我们创建一个新的结构体/枚举，根据内部的值，`Send` 和 `Sync` trait 会被自动实现。那么空结构体又是呢？\n\n在我们开始实现\
  \ `Send` 和 `Sync` 之前，让我们创建一个使用我们定义的不安全 trait 的程序，将其称为 `TrustMe`。该 trait 将有两个函数：一个将结构体转换为装箱结构体（boxed\
  \ struct），另一个使用结构体创建一个可变原始指针和一个 ID。首先，我们将创建一个文件 `unsafe_trait.rs` 并导入标准库的引用计数器：\n\
  \n```rust\n// unsafe_trait.rs\nuse std::rc::Rc;\n```\n\n为了跟踪结构体指针分配的 ID，我们将使用一个可变静态绑定\
  \ `COUNTER`，它的类型为 `u32`，默认值为 0。在定义静态绑定之后，我们可以定义空结构体 `Empty` 并为它派生 `Copy` 和 `Clone`\
  \ trait：\n\n```rust\nstatic mut COUNTER: u32 = 0;\n#[derive(Copy, Clone)]\nstruct\
  \ Empty;\n```\n\n现在，我们定义不安全 trait `TrustMe`。需要记住的一点是，尽管 trait 可能被定义为 unsafe，但这并不意味着所有函数都是隐式不安全的（这与公开性不同）。将\
  \ trait 前缀为 unsafe 的原因与函数相同，即告知用户正在发生不安全操作，并让他们根据自己的决定是否使用。\n\n我们在处理 trait 时必须记住的另一个事实是，当我们返回一个实例\
  \ `Self` 时，我们需要确保在声明中 `Self` 在编译期间具有已知大小。这是通过使用 `Sized` 实现的。如果不合适且你需要移除此限制，可以使用\
  \ `?Sized` 语法。\n\n第一个函数将获取 `self` 的所有权并返回对象的装箱版本；我们将其定义为 `return_box()`，它将包含 `Box::new()`：\n\
  \n```rust\nunsafe trait TrustMe{\n    fn return_box(self) -> Box<Self> where Self:\
  \ Sized{\n        Box::new(self)\n    }\n}\n```\n\n最后一个函数将是不安全的并返回一个包含实例的可变原始指针和类型为\
  \ `u32` 的 ID 的元组。我们需要 `self` 的所有权并将函数命名为 `return_ptr()`。我们的第一步是使用方便的函数 `return_box()`\
  \ 创建一个装箱指针：\n\n```rust\nunsafe fn return_ptr(self) -> (*mut Self, u32) where Self:\
  \ Sized\n{\n    let b = self.return_box();\n    // 为了创建一个指针，我们将使用绑定 b 调用函数 Box::into_raw()。\n\
  \    // 在获得原始指针后，我们需要获取一个 ID，这就是为什么我们的函数是不安全的。\n    // 为了获取 ID，我们将把计数器加 1（修改可变静态变量是不安全的）\n\
  \    // 并以元组的形式返回指针和计数器：\n    let ptr: *mut Self = Box::into_raw(b);\n    COUNTER\
  \ += 1;\n    (ptr, COUNTER)\n}\n```\n\n\n\n我们需要将 `main()` 函数中绑定 `empty` 处使用的 `Rc::new()`\
  \ 替换为 `Arc::new()`。这样我们就可以安全地跨线程共享我们的值了。我们还可以添加一个新的 vector 来存放所有线程的连接句柄（join handles），并将此绑定命名为\
  \ `threads`，将其添加在绑定 `ptr_id` 之后：\n\n```rust\nlet empty  = Arc::new(Empty);\n…\n\
  let mut threads = Vec::new();\n```\n\n在我们的 `unsafe` 块内部，我们将看到大部分更改；唯一需要保留的是末尾的 `for`\
  \ 循环，它遍历 `ptr_id` 以释放我们的原始指针。\n\n首先，我们需要编写一个 `for` 循环；不再是到 3，而是循环到 10。在循环内部，我们将使用\
  \ `Arc::clone()` 函数配合对 `empty` 的引用来创建 `empty` 的新所有者：\n\n```rust\nfor _ in 0..10{\n\
  \    let empty = Arc::clone(&empty);\n```\n\n现在，我们可以开启一个线程，并通过对内部的绑定 `empty` 解引用来返回一个\
  \ `Empty` 实例。在我们创建此线程后，将其推入我们的 vector `threads` 中：\n\n```rust\nlet t = thread::spawn(move\
  \ ||{\n    *empty\n});\nthreads.push(t);\n}\n```\n\n有了若干包含 `Empty` 结构体实例的线程句柄后，我们将遍历\
  \ `threads` vector，连接（join）其线程并赋值给绑定 `empty`。之后，我们可以使用 `return_ptr()` 方法获取一个元组 (`ptr,\
  \ id`)，它包含一个指向 `Empty` 的可变原始指针和一个 `u32`。通过这个元组，我们可以将其推入 vector `ptr_id`，我们将在之前保留的循环中释放它：\n\
  \n```rust\nfor handle in threads{\n    let empty = handle.join().unwrap();\n   \
  \ let (ptr, id) = empty.return_ptr();\n    ptr_id.push((ptr, id));\n}\n```\n\n如果我们运行程序，应该会看到与之前相同的结果，但它会一直持续到第十次：\n\
  \n```bash\n$ rustc send_sync.rs\n$ ./send_sync\nFreeing empty struct with id: 1\n\
  Freeing empty struct with id: 2\nFreeing empty struct with id: 3\nFreeing empty\
  \ struct with id: 4\nFreeing empty struct with id: 5\nFreeing empty struct with\
  \ id: 6\nFreeing empty struct with id: 7\nFreeing empty struct with id: 8\nFreeing\
  \ empty struct with id: 9\nFreeing empty struct with id: 10\n```\n\n在这个程序中，通过实现\
  \ `Send` 和 `Sync` trait，我们成功地创建了一个跨线程共享结构体的程序（无法保证安全性）。凭借我们使用 `unsafe` Rust 的经验，我们可以开始在程序中使用外部函数接口（`FFI`）添加\
  \ C 语言的抽象。\n\n### 在 Rust 中使用 C\n\n为什么有人要在 Rust 中使用 C 呢？使用 Rust 编程语言及其内存/线程安全性的初衷难道不是为了消除对使用\
  \ C 的需要吗？嗯，答案取决于你，但将 C 语言插到你的 Rust 程序中以及反之亦然的能力对许多开发者来说确实非常方便。在编写此时，Rust 内核支持预计将合并到\
  \ Linux 6.1 内核（从而成为第二种官方语言），并将帮助许多不同的项目（例如在原生 Apple 芯片上运行 Linux）。\n\n在本节中，为了获得最佳体验，建议我们使用某种\
  \ Linux 系统；无论是原生的、虚拟的还是 Windows Linux 子系统（WS）。我们需要一个 C 编译器。虽然 `gcc` 是一个很好的编译器，但最好使用\
  \ `clang`，因为它使用了 LLVM 并且提供了更好的错误报告。我们将使用的另一个工具是 `make`，因为在这些需要发生多项操作的类型项目中，`Makefiles`\
  \ 非常有用。\n\n你可以使用以下代码在终端上安装 `clang` 和 `make`：\n\n```bash\n# 更新并升级你的包\n$ sudo apt-get\
  \ update && sudo apt-get upgrade\n# 安装 clang 14\n$ sudo apt-get install clang-14\
  \ --install-suggests\n### 安装 make\n$ sudo apt-get install make\n```\n\n我们如何将 C 程序绑定到\
  \ Rust 中呢？我们将利用 `bindgen` crate，它在在 `build.rs` 文件（构建脚本）中使用时，允许我们从 C 头文件为我们的 Rust\
  \ 程序生成绑定代码。我们还将使用 `cc` crate 将我们的 C 源码和头文件编译成共享对象文件（Unix 下为 .so，Windows 下为 .dll）供\
  \ Rust 使用。\n\n在尝试编写复杂的 Rust/C 程序之前，让我们先写一个简单的程序，向用户询问两个相加的数字，其中 `add()` 函数将用 C 编写。\n\
  \n我们从哪里开始？嗯，让我们先使用 `cargo new add_ffi` 命令创建一个新项目 `add_ffi`。与其他项目不同，我们没有任何依赖项。你可能会好奇那么我们如何使用\
  \ `cc` 和 `bindgen`。由于这些 crate 将用于我们的构建脚本，它们将如下所示置于构建依赖下：\n\n```toml\n[dependencies]\n\
  [build-dependencies]\nbindgen = \"0.60.1\"\ncc = \"1.0.73\"\n```\n\n在写写 `build.rs`\
  \ 之前，如果我们已经写好了 C 程序，视觉上会更直观。首先，我们将来到头文件，它将在新目录 `includes` 下创建并命名为 `add.h`。在程序根目录下创建一个创建一个\
  \ `add.c`。\n\n在 `includes/add.h` 中，我们需要引入 `stdint.h` 以使用 32 位无符号整数 `uint32_t`。我们在\
  \ `ifndef` 块中定义 `add()` 函数。虽然这本质上是没有必要的，但未何妨：\n\n```c\n#ifndef ADD_H\n#define ADD_H\n\
  #include <stdint.h>\nuint32_t add(uint32_t a, uint32_t b);\n#endif\n```\n\n我们可以通过引入\
  \ `includes/add.h` 在 `add.c` 中编写 `add()` 函数，该函数返回 `a` 加 `b`：\n\n```c\n#include \"\
  includes/add.h\"\nuint32_t add(uint32_t a, uint32_t b){\n    return a + b;\n}\n\
  ```\n\n为了为我们的 Rust 程序生成共享库和绑定，我们需要编写构建脚本。构建脚本将在程序编译之前编译并运行。\n\n在项目根目录下创建一个文件 `build.rs`，并在顶部添加以下导入：\n\
  \n```rust\nuse bindgen::Builder;\nuse cc::Build;\nuse std::path::PathBuf;\n```\n\
  \n现在我们将创建一个 `main()` 函数，我们在内部要做的第一件事是生成我们的共享库。为了实现这一点，我们将使用 `cc` crate 中的 `Build`\
  \ 结构体。我们将使用 `new()` 方法创建一个新的 `Build` 类型。在 `new()` 方法创建一个空的 `Build` 类型后，我们将链式调用 `file()`\
  \ 方法，它用于定义不同的 `.c` 文件（`files()` 方法可以定义多个 C 文件）。在我们的案例中，它是 `add.c`。在 `file()` 方法之后，我们将链式调用\
  \ `include()` 方法来定义头文件目录，即 `includes` 目录。最后，我们将这些方法链接到期望共享库路径的 `compile()` 方法。注意：cc\
  \ crate 使用你系统中的默认编译器；如果你想使用特定的编译器，可以使用链式中的 `compiler()` 方法。在我们的案例中，我们选择不使用它，是因为在原生\
  \ Linux 系统和 Windows Linux 子系统 (WSL) 之间测试时发现了问题。**\n\n```rust\nfn main() {\n    Build::new()\n\
  \        .file(\"add.c\")\n        .include(\"includes\")\n        .compile(\"add.so\"\
  );\n}\n```\n\n\n\n创建好共享库后，我们就可以开始为程序生成绑定（bindings）。我们将使用来自 `bindgen` crate 的 `Builder`\
  \ 类型。要创建一个新的 `Builder` 类型，我们将使用 `default()` 方法；由于我们只对从头文件生成绑定感兴趣，因此将链式调用 `header()`\
  \ 方法来定义头文件 `includes/add.h` 的路径。\n\n在 `header()` 方法之后，我们可以链式调用 `generate()` 方法，它将返回一个\
  \ `Result<Bindings, BindgenError>`。为了处理该 `Result`，我们将对其进行 `unwrap` 处理，因为在这种情况下，如果绑定失败，程序不应该运行并崩溃（panic）：\n\
  \n```\nlet bindings = Builder::default()\n    .header(\"includes/add.h\")\n    .generate()\n\
  \    .unwrap();\n```\n\n绑定将创建一个 Rust 文件。我们将使用 `PathBuf::from()` 函数创建一个输出路径 `src/bindings.rs`。有了输出路径后，我们将使用绑定\
  \ `bindings` 中的 `write_to_file()` 方法，并像之前一样，使用 `unwrap()` 处理 `Result`：\n\n```\n\
  let out_path = PathBuf::from(\"src/bindings.rs\");\nbindings.write_to_file(out_path).unwrap();\n\
  ```\n\n为了让所有内容对我们可见，我们应该编译程序（`cargo build`），这样我们就能生成所有所需的共享库/绑定。编译程序后，你会发现一个新文件\
  \ `src/bindings.rs`，我们将在 `src/main.rs`中使用它：\n\n```\nmod bindings;\nuse bindings::add;\n\
  use std::io::{stdin, Result};\n```\n\n我们将要求用户输入两个用逗号分隔的数字，以便我们相加并打印结果。在 `main()`\
  \ 函数中，我们将返回来自 `std::io` 的 `Result<()>`，以便处理来自 `stdin()` 的错误。为了获取用户输入，我们将初始化一个空字符串（使用\
  \ `String::new()`）绑定到可变的变量 `input`：\n\n```rust\nfn main() -> Result<()> {\n    let\
  \ mut input = String::new();\n```\n\n现在，我们想通知用户输入两个用逗号分隔的数字。在通知他们之后，我们将使用 `stdin().read_line()`\
  \ 从标准输入读取内容并可变借用我们的绑定 `input`：\n\n```\nprintln!(\"Please put in two numbers to add\
  \ (a,b): \");\nstdin().read_line(&mut input)?;\n```\n\n为了获取两个逗号分隔的数字，我们将创建一个绑定 `s`，它将使用\
  \ `input` 的 `split()` 方法收集由逗号分割的字符串并链式调用 `collect()`。由于 `collect()` 方法需要一种数据类型，我们将显式声明绑定\
  \ `s` 的类型为 `Vec<&str>`：\n\n```\nlet s: Vec<&str> = input.split(\",\").collect();\n\
  ```\n\n我们假设第一个元素是 `a`，第二个元素是 `b`。两者将通过链式调用 `trim()` 方法（移除空格）和 `parse()` 方法（将字符串解析为其他原始类型）转换为\
  \ `u32`，并且 `unwrap` `parse()` 产生的错误：\n\n```\nlet a: u32 = s[0].trim().parse().unwrap();\n\
  let b: u32 = s[1].trim().parse().unwrap();\n```\n\n来自 `bindings.rs` 的所有绑定都被认为是不安全的（unsafe）。这是因为根据\
  \ Rust 的规定，C 中的所有内容都是不安全的。因此，如果我们想使用我们的 `add()` 函数，我们需要在 `unsafe` 块中使用它，并通过 `println!()`\
  \ 告诉用户结果。由于我们的函数返回 `Result<()>`，我们将在结尾添加 `Ok(())`：\n\n```rust\nunsafe { println!(\"\
  The result is {}\", add(a, b)); }\nOk(())\n}\n```\n\n让我们运行程序，看看它是否按照我们的预期正常工作：\n\
  \n```bash\n$ cargo run\nPlease put in two numbers to add (a,b):\n9,8\nThe result\
  \ is 17\n```\n\n当我们编译程序时，你会注意到来自 `src/bindings.rs` 的很多警告；如果我们想忽略所有这些警告，可以使用属性宏 `#[allow()]`。\n\
  \n以下是我们看到的的三种不同的警告：\n* 从未未使用值（Never used values）\n* 未使用大驼峰命名法（Not using upper camel\
  \ case names）\n* 全局变量未大写（Globals not being capitalized）\n\n尽管建议修复这些警告，由于 `src/bindings.rs`\
  \ 是自动生成的，我们无法不断修改它。因此，在 `src/main.rs` 中，我们将在文件顶部使用 `#[allow()]` 来允许这些不同的警告：\n\n\
  ```rust\n#[allow(non_camel_case_types, non_upper_case_globals, unused)]\n```\n\n\
  如果你重新运行程序，将不会看到警告，但请确保是因为正当的原因使用此宏而不是为了偷懒。编译器的警告是为了帮助你。\n\n我们已经了解了如何结合 `cc` crate\
  \ 和 `bindgen` crate，从 C 程序生成 Rust 绑定。\n\n\n\n\n为了通过构建动态库并将其链接到 `main.c` 来简化我们的工作，我们将编辑\
  \ `Makefile`。我们将创建一个名为 `build` 的指令。我们需要做的是首先使用 `cargo build` 编译我们的库。获取动态库后，我们可以使用\
  \ `clang` 编译 `main.c`，但我们需要一些标志来链接我们的库；首先是将一个目录添加到库搜索路径中（`-L <path>`），我们的路径是 `./target/debug`；其次，我们需要添加库的名称（`-l<name>`），即\
  \ `rust_in_c`；最后，我们将使用标志 `–o` 将二进制文件输出为 `main`：\n\n```\nbuild:\n\tcargo build\n\t\
  clang main.c -L ./target/debug -lrust_in_c -o main\n```\n\n在编写好库之前，我们无法使用 `Makefile`，因此让我们进入\
  \ `src/lib.rs` 并添加必要的导入。我们需要使用标准库中的 `ffi` 模块，它提供了与处理非 Rust 接口中的数据相关的类型；对于我们来说，感兴趣的是使用\
  \ `c_char`（代表 C 中的 `char`）、`c_int`（代表 C 中的 `int`）、`CStr`（代表借用的 C 字符串）和 `CString`（代表拥有的\
  \ C 字符串），如下：\n\n```rust\nuse std::ffi::{c_char, c_int, CStr, CString};\nuse std::fs::read_to_string;\n\
  ```\n\n为了确保我们在 Rust 中使用的名称在 C 中相同，我们将在函数上方使用 `#[no_mangle]` 宏。另一个区别是，我们必须在函数声明前加上\
  \ `extern \"C\"` 语法，以便我们的程序知道以 C 识别的方式表示此函数。\n\n我们将编写第一个函数是 `diff_strings()`，我们看到它需要两个动态字符数组，或者用\
  \ Rust 的术语说就是两个名为 `s1` 和 `s2` 的 `c_char` 可变原始指针，并且返回一个 `c_int`：\n\n```rust\n#[no_mangle]\n\
  pub extern \"C\" fn diff_strings(s1: *mut c_char, s2: *mut c_char) -> c_int {\n\
  ```\n\n我们如何将 `*mut c_char` 转换为 Rust 的 `&str` 呢？\n\n首先，我们将通过其方法 `from_ptr()` 创建 `&CStr`，它会将\
  \ C 原始字符串转换为安全的 C 字符串封装，并赋值给绑定 `s1_cstr`。通过 `s1_cstr`，我们可以使用方法 `to_str`（它返回 `Result<&str,\
  \ str::Utf8Error>`）获取内部字符串，我们将使用 `unwrap()` 并将其赋值给绑定 `s1_str`。最后，我们可以使用绑定 `s1_str`\
  \ 和方法 `len()` 将长度存储到绑定 `s1_len`。这些步骤也适用于参数 `s2`，由于这些操作是不安全的，所有这些内容将放在 `unsafe` 块中：\n\
  \n```rust\nunsafe {\n    let s1_cstr = CStr::from_ptr(s1);\n    let s1_str = s1_cstr.to_str().unwrap();\n\
  \    let s1_len = s1_str.len();\n    let s2_cstr = CStr::from_ptr(s2);\n    let\
  \ s2_str = s2_cstr.to_str().unwrap();\n    let s2_len = s2_str.len();\n\n    //\
  \ 由于 s1_len 和 s2_len 的类型为 usize，我们需要小心处理这两个长度之间的差值吗，还是不需要？ \n    // Rust 中的无符号整数提供了一个名为\
  \ `abs_diff()` 的有用方法，它将返回两个无符号整数之间的绝对差，在我们的案例中是 `usize`。一旦我们得到了绝对差，就可以使用 `as` 关键字将其转换为\
  \ `c_int`：\n    s2_len.abs_diff(s1_len) as c_int\n}\n```\n\n我们已经完成了第一个函数 `diff_strings()`，现在准备好处理第二个函数\
  \ `read_file()` 了。我们需要一个形式为 `c_char` 可变原始指针的路径，并且我们将返回一个 `c_char` 可变原始指针：\n\n```rust\n\
  #[no_mangle]\npub extern \"C\" fn read_file(path: *mut c_char) -> *mut c_char {\n\
  ```\n\n为了将 `path` 转换为 Rust 字符串，我们将使用与之前相同的策略，即使用 `path` 通过 `from_ptr()` 方法创建一个新的\
  \ `&CStr`。在我们创建 `&CStr` 之后，我们可以使用 `to_str()` 方法并使用 `unwrap()` 处理 `Result`，由于这些操作是不安全的，我们需要将情况放在\
  \ `unsafe` 块中：\n\n```rust\nunsafe {\n    let path_cstr = CStr::from_ptr(path);\n\
  \    let path_str = path_cstr.to_str().unwrap();\n    // ... 逻辑继续\n}\n```\n\n\n\n\
  \n\n1. 创建一个简化版的 `Atomic Reference Counter`（`Arc`），并使其能够克隆（clone）、计数引用数量以及通过解引用返回内部值。（此练习基于\
  \ Rustonomicon 指南：[`doc.rust-lang.org/nomicon/arc-mutex/arc.html`](https://doc.rust-lang.org/nomicon/arc-mutex/arc.html)）。\n\
  \n2. 创建一个简化版的 `Vec`，并使其能够推入（push）、弹出（pop）、插入（insert）和移除（remove）项，同时能够正向和反向迭代。（此练习基于\
  \ Rustonomicon 指南：[`doc.rust-lang.org/nomicon/vec/vec.html`](https://doc.rust-lang.org/nomicon/vec/vec.html)）。\n\
  \n3. 在 C 中创建一个动态数组，它可以包含不同的值（`int`、`double`、`bool`），并编写一个 Rust 程序，能够在 REPL（读取-评估-打印循环）环境中写入/打印该数组。（使用\
  \ `cc` 和 `bindgen` 链接 C 程序，使用 `rustyline` crate 构建 replPL 环境）\n\n### 答案\n\n1. 原子引用计数器用于在多个线程之间安全地共享值的引用；这意味着类型\
  \ `Arc` 实现了 `Send` 和 `Sync` traitit，同时期望其内部类型 `T` 也实现这两个 traitit。每当创建一个新的所有者时，原子引用计数器就会增加计数；当所有者被丢弃时，计数会减少；一旦计数达到\
  \ 0，指针就会被释放。\n\n在开始练习之前，创建一个新文件 `arc.rs`，因为 `Arc` 类型是使用 Rust 标准库创建的；我们所有的导入都来自 `std`。为了简述我们需要的内容，首先我们需要一种方法让\
  \ Rust 的 drop checker 知道我们对某个值拥有所有权；这需要使用 `marker` 模块，并在模块内部我们需要 `PhantomData` 类型。`PhantomData`\
  \ 是一个零大小类型（`ZST`），用于标记表现得拥有某个类型的东西；对于我们的示例，我们将使用泛型类型 `T`。\n\n接下来我们需要的是一个指向泛型 `T`\
  \ 的指针，在大多数情况下，`*mut T` 就能胜任；我们将利用来自 `ptr` 模块的 `NonNull` 类型。`NonNull` 类型是 `*mut T`\
  \ 的封装，但具有以下区别：\n\n- 它对 `T` 是协变的（covarient）。\n- 指针永远不为空。\n\n为了执行原子操作，我们需要利用 `sync`\
  \ 模块内部的 `atomic` 模块。我们需要模块本身、用于记录引用计数的 `AtomicUsize` 类型以及 `Ordering` 类型。`Ordering`\
  \ 类型用于控制原子内存的排序和同步方式；Rust 使用的内存排序与 C++20 中使用的相同。\n\n最后，我们需要一种获取内部值的方法，虽然 `Arc` 有如\
  \ `get_mut()` 这样返回 `Option<&mut T>` 的方法；获取内部值最简单的方法是进行解引用。因此，对于我们的 `Arc` 类型，我们需要实现\
  \ `Deref` trait 来获得相同的效果。\n\n现在已经解释了导入内容，你可以将它们添加到文件顶部：\n\n```\nuse std::marker::PhantomData;\n\
  use std::ptr::NonNull;\nuse std::sync::atomic::{self, AtomicUsize, Ordering};\n\
  use std::ops::Deref;\n```\n\n我们的 `Arc` 类型将分为两个不同的结构体。第一个是 `Arc`，它包含一个指向第二个结构体的指针；第二个是\
  \ `ArcInner`，它包含了实际的内部数据和引用计数，以及指向 `ArcInner` 的标记，以便我们对内部值拥有某些所有权。\n\n两个结构体都使用泛型类型\
  \ `T`。对于我们的结构体 `Arc`，我们将第一个字段命名为 `ptr`，类型为 `NonNull<ArcInner<T>>`，第二个字段命名为 `phantom`，类型为\
  \ `PhantomData<ArcInner<T>>`：\n\n```rust\n// 原子引用计数\npub struct Arc<T> {\n    //\
  \ 内部引用计数的指针\n    ptr: NonNull<ArcInner<T>>,\n    // 告诉 drop checker 我们拥有 ArcInner\
  \ 的所有权\n    phantom: PhantomData<ArcInner<T>>,\n}\n```\n\n`ArcInner` 结构体将有一个字段 `rc`\
  \ 用于引用计数，并使用 `AtomicUsize` 类型进行有序且同步的原子计数。第二个字段将称为 `data`，类型为 `T`；这是我们正在进行多次引用的内部值：\n\
  \n```rust\npub struct ArcInner<T> {\n    // 引用计数\n    rc: AtomicUsize,\n    // 内部数据\n\
  \    data: T,\n}\n```\n\n（注：源文本在实现部分包含重复/混乱的句子。我已按照要求清理了结构，同时保持了核心技术逻辑和代码块格式。）\n\
  \n\n\n\n为了获取我们的内部 `data`，我们首先需要从字段 `ptr` 中获取 `ArcInner`，我们将使用与 `count()` 函数相同的策略，即使用来自\
  \ `NonNull` 的 `as_ref()` 方法。由于该函数是不安全的（unsafe），我们将在 `unsafe` 块中使用该方法并将其赋值给绑定变量 `inner`。通过绑定\
  \ `inner`，我们可以返回 `inner.data` 的引用：\n\n```rust\n// get inner by using NonNull::as_ref\n\
  let inner = unsafe { self.ptr.as_ref() };\n&inner.data\n}\n```\n\n原子引用计数器必须做的另一项任务是能够使用\
  \ `clone()` 创建多个所有者；然而，当我们创建一个新的所有者时，必须考虑以下因素：\n\n1. 当创建新所有者时，我们的引用计数应该加 1。\n  \
  \  - 我们在更新计数时将使用松弛内存序（relaxed ordering）。\n2. 旧的引用计数必须小于 `isize` 的最大值。\n    - 如果是，我们必须中止进程，否则会发生溢出。\n\
  \n现在我们可以为 `Arc` 实现 `Clone` 特性了，它只包含一个函数 `clone()`，该函数会以不可变的方式使用我们的值并返回 `Arc<T>`：\n\
  \n```rust\nimpl<T> Clone for Arc<T> {\nfn clone(&self) -> Arc<T> {\n```\n\n我们首先需要第一件事是更新引用计数，因此我们首先需要使用不安全的方法\
  \ `NonNull` 类型中的 `as_ref()` 获取内部值：\n\n```rust\n// get inner arc\nlet inner = unsafe\
  \ { self.ptr.as_ref() };\n```\n\n为了增加引用计数的值，我们将使用 `fetch_add()` 方法，该方法期望一个用于加到当前值上的值以及原子内存序。要加到我们引用计数器的值是\
  \ 1，内存序为 `Ordering::Relaxed`，`fetch_add()` 函数还会返回旧值，我们将将其赋值为 `old_rc`：\n\n```rust\n\
  //using relaxed ordering to update reference count\nlet old_rc = inner.rc.fetch_add(1,\
  \ Ordering::Relaxed);\n```\n\n正如我们之前提到的，我们需要检查旧的引用计数是否大于或等于 `isize` 的最大值；如果是，我们将发生溢出，因此必须中止此进程：\n\
  \n```rust\n// if reference count is overflowing abort process\nif old_rc >= isize::MAX\
  \ as usize {\n    std::process::abort();\n}\n```\n\n完成所有安全检查后，我们可以使用 `self.ptr`\
  \ 作为 `ptr` 字段并使用 `PhantomData` 作为 `phantom` 字段来返回一个新的 `Arc` 实例。你可能会奇怪为什么我们不需要克隆或借用\
  \ `self.ptr`，这是因为 `NonNull` 仍然是一个原始指针，而原始指针不遵循 Rust 的生命周期和所有权值。我们在值被丢弃时进行清理（这在实现实现\
  \ `Drop` 特性时显示）：\n\n```rust\nSelf {\n    ptr: self.ptr,\n    phantom: PhantomData,\n\
  }\n}\n```\n\n当原子引用计数器的引用被丢弃时，我们必须能够将引用计数减 1，当引用计数为 0 时，释放指针。具体来说，我们必须执行以下操作：\n\n\
  1. 使用释放内存序（release）将引用计数减 1。\n    - 如果上一个值不是 1，我们不需要做任何其他操作。\n    - 如果上一个值是 1，这意味着当前值是\
  \ 0。\n    - 然后我们必须释放指针。\n2. 在释放指针之前，我们必须对数据进行原子屏障（atomic fence），以防止内部数据的使用或删除发生重排序。\n\
  3. 我们通过将指针作为原始指针并转换为 `Box` 来释放指针。\n    - `Box` 将调用析构函数并为我们释放内存。\n\n现在我们可以为 `Arc`\
  \ 实现 `Drop` 特性了，它只包含一个以可变方式使用我们值的 `drop()` 函数：\n\n```rust\nimpl<T> Drop for Arc<T>\
  \ {\nfn drop(&mut self) {\n```\n\n正如我们之前提到的，第一步是将引用计数减 1。为了做到这一点，我们需要使用 `NonNull`\
  \ 类型中不安全的 `as_ref()` 方法获取 `ArcInner` 值：\n\n```rust\n// get inner value\nlet inner\
  \ = unsafe { self.ptr.as_ref() };\n```\n\n为了减少引用计数，我们将利用 `AtomicUsize` 的 `fetch_sub()`\
  \ 方法；它期望一个用于减少其当前值的值（我们将是 1）以及一个要遵循的内存序，我们将使用 `Ordering::Release`。我们需要检查上一个值是否为\
  \ 1，因此我们将使用 `Ordering::Release`：\n\n```rust\nif inner.rc.fetch_sub(1, Ordering::Release)\
  \ != 1 {\n    return;\n}\natomic::atomic_fence(Ordering::SeqCst);\nlet _ptr = Box::from_raw(self.ptr.as_ptr());\n\
  ```\n\n\n\n\n## 2. 动态数组在编程语言中已经存在很久了，无论是 C++ 中的 `std::vector`、Java 中的 `ArrayList`\
  \ 还是 Python 中的 `list`。但我们如何在 Rust 中编写一个呢？嗯，多亏了《Rust 指南》中出色的指导，我们将能够完成编写自己的自定义版本\
  \ `Vec` 的步骤；尽管它会更简单且优化程度更低。\n\n为了更好地解释动态数组，让我们考虑一个用 C 语言编写的简单示例；这将让我们对在 Rust 中的预期有一个良好的了解：\n\
  \n```c\ntypedef struct\n{\n    char* chars;\n    int length;\n    int capacity;\n\
  }charArray;\n```\n\n在我们的字符数组中，有三个部分组成：\n* 一个指向 `char` 的指针数组。\n* 数组的长度（length），记录数组中有多少字符或值。\n\
  * 数组的容量（capacity），即数组能够容纳的最大字符数。\n\n在动态数组中，当达到容量时（即长度等于容量），我们需要为数组增长或分配更多内存。虽然某些语言会按\
  \ 1.5 倍的比例增长，但 Rust 遵循与 C++ 相同的增长因子，即 2；或者换一种说法是，一旦向量填满了，它的容量就会翻倍。\n\n为了开始我们的练习，让我们创建一个新文件\
  \ `vec.rs`；在简单地将导入放在文件顶部之前，让我们先过一遍为什么我们需要它们以及将如何使用它们。\n\n我们将从标准库中使用的第一个模块是 `ptr`\
  \ 模块。就像我们上一个创建原子引用计数器的练习一样我们将利用 `NonNull` 类型。`NonNull` 类型是对可变原始指针 `*mut T` 的封装，不同之处在于该类型不能为空，且该类型是协变的（covariant）。我们还需要一种从指针写入和读取数据的方法，我们将使用\
  \ `write()` 函数在不读取或丢弃旧值的情况下覆盖指针的内容，因为它接收一个目标和一个源。`read()` 函数则从特定源读取一个值而不移动其值，这对我们非常有用。\n\
  \n我们将使用的第二个模块是 `mem` 模块。该模块为我们提供了处理 Rust 中内存的函数。这可能包括使用 `mem::size_of::<T>()` 函数返回类型的字节大小，或者通过\
  \ `mem::forget()` 获取某个值的所有权并将其遗忘。\n\n我们将使用的第三个模块是意料之中的，即 `alloc` 模块。由于我们要为向量分配和释放内存，我们将使用\
  \ `alloc` 模块以及在该模块中的 `Layout` 类型。`Layout` 类型提供了一个内存块的布局，我们的全局分配器可以使用它来分配、重新分配或释放一个值。\n\
  \n最后，如果我们希望能够对向量进行切片操作（slice），我们就需要对向量进行解引用（dereference）。为了以不可变的方式解引用我们的向量，我们实现\
  \ `Deref` 特性；如果想以可变的方式解引用，则需要实现 `DerefMut` 特性。由于我们将实现这两个 trait 性，我们需要从 `ops` 模块导入它们。\n\
  \n在解释了所有导入内容后，我们可以它们导入到 `vec.rs` 的顶部：\n\n```rust\nuse std::ptr::{NonNull, write,\
