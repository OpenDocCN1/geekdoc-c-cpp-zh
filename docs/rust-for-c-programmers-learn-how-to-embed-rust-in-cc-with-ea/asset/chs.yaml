  \    match p{\n        Pat::Ident(ref p) => self.vars.contains(&p.ident),\n    \
  \    _ => false\n    }\n}\n```\n\n当我们追踪绑定时，需要处理它们被重新赋值的情况，例如 `var = init` 或 `var\
