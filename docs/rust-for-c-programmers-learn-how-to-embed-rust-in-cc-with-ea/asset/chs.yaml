  \ 1\n6! = 720\nDumb Exponent---\nnum = 4\nnum = 8\nnum = 16\nnum = 32\nnum = 64\n\
  num = 128\n2⁶ = 128\n```\n\n如果我们尝试展开我们的属性，我们将观察到函数 `factorial()` 和 `dumb_exp()`\
  \ 的展开。为了简化展开，我们替换了 `println!()` 的展开，以便我们专注于我们创建的工作：\n\n```rust\nfn factorial(mut\
  \ n: u64) -> u64 {\n    let mut p = {\n        #[allow(unused_mut)]\n        let\
  \ mut p = 1;\n        println!(\"p = {:?}\", p);\n        p\n    };\n    while n\
  \ > 1 {\n        {\n            p *= n;\n            println!(\"p = {:?}\", p);\n\
  \        };\n        {\n            n -= 1;\n            println!(\"n = {:?}\",\
  \ n);\n        };\n    }\n    p\n}\n```\n\n\n\n\n\n```rust\nprintln!(\"num = {:?}\"\
  , num);\n}\n}\n\nnum\n}\n```\n\n________________\n\n¹ *Rust 参考*. 过程宏 - Rust 参考.\
  \ (n.d.). 于 2022 年 10 月 13 日检索自 [`doc.rust-lang.org/reference/procedural-macros.html`](https://doc.rust-lang.org/reference/procedural-macros.html)\n\
  \n# 项目 – Mufi 的标准库\n\n### 引言\n\n本书作者编写的玩具语言 `Mufi-Lang` 是在 Robert Nystrom 著作的《解释器实现》（*Crafting\
  \ Interpreters*）指导下编写的，该书展示了如何在 Java 中编写解释器以及在 C 中编写字节码编译器。书中编写的语言被称为 `Lox`，特别是\
  \ `Mufi-Lang` 基本上就是 `CLox`（`Lox` 的 C 版本），仅有几处不同：它拥有 `integer`（整数）和 `float`（浮点数）类型（`Lox`\
  \ 只有 `number` 类型），并且使用了 Rust 标准库。然而，我们并没有直接为你提供该标准库，而是将编写这两种玩具语言之间的主要区别。我们需要探索 `Mufi`\
  \ 语言（它非常小）并熟悉编译器（从广义上说，这不是一本关于编译器的书）。\n\n尽管我们已经写过一些结合 C 和 Rust 一起的项目，但这个项目展示了如何在用\
  \ C 编写的语言中使用 Rust。因此，现在本质上是 C + Rust + Mufi。我们能够在 `Mufi` 的调试模式下看到每一条字节码操作，并观察我们用\
  \ Rust 编写的原生函数将如何在 `Mufi` 的字节码和垃圾回收器中被处理。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   开始使用\
  \ `Mufi-Lang`\n*   在 C 中创建原生函数\n*   在 Rust 中创建原生函数\n*   C 原生函数与 Rust 原生函数的基准测试\n\
  \n#目标\n\n本章的目标是让读者获得在现有的 C 项目中添加 Rust 的经验。该语言本身运行并不需要 Rust，但如果开发者想用 Rust 编写新功能（目前许多人正在这样做），我们就可以看到它是什么样子的。在体验向项目添加\
  \ Rust 的同时，我们还将尝试回答我们的方法是否存在性能损失，这就是为什么我们将创建一个基准测试，比较 `Mufi` 的某些 C 和 Rust 原生函数。\n\
  \n# 开始使用 Mufi-Lang\n\n为了开始使用玩具语言 `Mufi-Lang`，我们方便地创建了一个仓库，其中包含了主 C 编译器和一个用于在不同模式下编译项目的\
  \ `Makefile`。建议你在 Linux 系统下（无论是原生系统、虚拟机还是类似 `WSL2` 的环境）进行此项目；设置说明将适用于 Debian 系发行版：\n\
  \n```bash\n### 更新并升级包\n$ sudo apt-get update && sudo apt-get upgrade\n\n### 安装必要的依赖\n\
  $ sudo apt install git make python3 clang\n\n### 克隆仓库\n$ git clone https://github.com/MKProj/Mufi-Template.git\n\
  \n# 可选项，将 Mufi-Template 重命名为 Mufi\n$ mv Mufi-Template Mufi\n```\n\n如果我们进入 `Mufi`\
  \ 目录，将看到以下内容：\n\n```bash\n$ cd Mufi && ls\n```\n`compiler`\n`util`\n`Makefile`\n\
  \n`compiler` 目录包含了所有的 C 源文件及其各自的头文件。让我们讨论一下这些源文件/头文件的作用：\n\n*   `chunk`: 处理与虚拟机块（chunks）相关的创建和操作。\n\
  *   `common.h`: 包含所有常用的库。\n*   `compiler`: 处理并编译所有 `Mufi` 语句。\n*   `debug`: 记录虚拟机发出的所有字节码指令。\n\
  *   `main.c`: 从文件或在 REPL 环境中执行编译器。\n*   `memory`: 处理内存分配和垃圾回收。\n*   `object`: 处理类、字符串、函数等对象值。\n\
  *   `pre`: 与运行程序相关的函数。\n*   `scanner`: 将字符串解析为标记流（tokens stream）。\n*   `table`:\
  \ 手手实现的 `HashMap`。\n*   `value`: 处理 `Mufi` 值的定义以及如何将其转换回 C 代码。\n*   `vm`: 运行 `Mufi`\
  \ 编译器的虚拟机。\n\n`util` 目录包含一个 Python 脚本 `debug_prod.py`，它根据我们是否需要调试日志来修改 `compiler/common.h`（`undef`\
  \ `DEBUG_*` 宏）。我们最后一个需要讨论的文件是 `Makefile`，其内容如下：\n\n```makefile\nPY = python3\nCC\
  \ = clang\n\ndebug:\n$(PY) util/debug_prod.py debug\n\nmake build\n\nrelease:\n\
  $(PY) util/debug_prod.py release\n```\n\n（注：原文后续部分存在大量重复内容，此处译文已根据核心逻辑进行整合与翻译）\n\
  \n\n\n\n\nMufi 中的函数是对象，使用关键字 `fun` 进行声明，其后跟一个标识符然后是它的参数。函数不需要返回类型（值通过 `return` 关键字返回，如果没有返回，则隐式返回\
  \ `nil`），在参数方面，只需要它们的标识符。该语言还支持递归函数，例如下面的斐波那契函数：\n\n```c\nfun fib(n) {\n  if (n\
  \ < 2) return n;\n  return fib(n - 2) + fib(n - 1);\n}\n\nprint fib(10);\n//output:\
  \ 55\n```\n\n# Mufi 中的类 (Classes)\n\n没有类的情况下实现面向对象的编程语言是很困难的，这通过使用关键字 `class` 后后跟一个标识符来实现。Mufi\
  \ 中的类只包含方法，且类内部所有的方法都不使用关键字 `fun`。\n\n在类中拥有字段的方法是在 `init()` 方法中定义它们，并让它们赋值给 `self.*`，其中\
  \ `glob` 是字段名。当使用类名作为函数创建新类时，我们可以按照如下方式访问字段：\n\n```c\nclass Foo{\n  init(a, b){\n\
  \    self.a = a;\n    self.b = b;\n  }\n  update(factor){\n    self.a = self.a *\
  \ factor;\n    self.b = self.b * factor;\n  }\n}\n\nvar foo = Foo(3, 4);\nfoo.update(5);\n\
  print foo.a;\nprint foo.b;\n// Output:\n// 15\n// 20\n```\n\n# Mufi 中的继承 (Inheritance)\n\
  \nMufi 的最后一个主要功能是类继承，这通过使用 `<` 操作符实现，后跟另一个类名（类不能继承自身）。要访问被继承类的受限方法，你需要使用 `super`\
  \ 关键字。Mufi 中类继承的示例如下：\n\n```c\nclass Foo{\n  foo(){\n    print \"This is inherited\
  \ from foo\";\n  }\n}\n\nclass Bar < Foo{\n  bar(){\n    print \"This is bar\";\n\
  \    super.foo();\n  }\n}\n\nvar b = Bar();\nb.bar();\n// Output:\n// This is bar\n\
  // This is inherited from foo\n```\n\n随着 Mufi 介绍的完成，最好讨论一下提供的两种不同的构建模式。当我们说 `debug`\
  \ 和 `release` 模式时，你可能会想到 Rust 编译器的优化模式。然而，对于 Mufi 来说并非如此。没有额外的优化。这些模式之间的差异在于 `compiler/common.h`，让我们来看它：\n\
  \n```c\n//> 所有公共导入和预处理器宏都定义在这里\n#ifndef mufi_common_h\n#define mufi_common_h\n#include\
  \ <stdbool.h>\n#include <stddef.h>\n#include<stdint.h>\n#include <stdlib.h>\n#define\
  \ DEBUG_PRINT_CODE\n#define DEBUG_TRACE_EXECUTION\n#define DEBUG_STRESS_GC\n#define\
  \ DEBUG_LOG_GC\n#define UINT8_COUNT (UINT8_MAX + 1)\n#endif\n```\n\n这是调试模式下 `compiler/common.h`\
  \ 的样子，因为所有的 `DEBUG_*` 宏都已定义，并在编译器运行程序时会被使用。如果我们不想看到不同的调试日志，我们需要取消定义这些宏，当在 `release`\
  \ 模式下设置时如下所示：\n\n```c\n#ifndef mufi_common_h\n#define mufi_common_h\n#include <stdbool.h>\n\
  #include <stddef.h>\n#include<stdint.h>\n#include <stdlib.h>\n#define DEBUG_PRINT_CODE\n\
  #define DEBUG_TRACE_EXECUTION\n#define DEBUG_STRESS_GC\n#define DEBUG_LOG_GC\n#define\
  \ UINT8_COUNT (UINT8_MAX + 1)\n#endif\n\n// 在生产环境中，我们希望关闭这些调试\n#undef DEBUG_TRACE_EXECUTION\n\
  #undef DEBUG_PRINT_CODE\n#undef DEBUG_STRESS_GC\n#undef DEBUG_LOG_GC\n```\n\n# 在\
  \ C 中创建原生函数 (Native Functions)\n\n原生函数是构建在 Mufi 编译器中的函数，这部分将用 C 编写但在 Mufi 中可用。我们定义的每个原生函数遵循以下语法：\n\
  \n```c\nValue fooNative(int argCount, Value* args);\n```\n\n整数 `argCount` 代表函数中的参数数量，动态数组\
  \ `args` 代表 Mufi 值的数组。然后，为了将我们的原生函数加入编译器，我们需要进入 `compiler/vm.c`，在 `initVM()` 函数中初始化我们的虚拟机。我们将使用\
  \ `defineNative()` 函数来定义我们的原生函数。\n\n但我们还没有编写任何原生函数，为了开始，我们将创建新文件 `compiler/mufi_std_c.c`\
  \ 和 `compiler/mufi_std_c.h`。在开始变得复杂之前，我们将先写一些算术函数，这些函数定义在头文件 `compiler/mufi_std_c.h`\
  \ 中：\n\n```c\n//> 包含 C 原生函数\n#ifndef mufi_std_c_h\n#define mufi_std_c_h\n#include\
  \ \"common.h\"\n#include \"value.h\"\n\n//> 两个数的相和\nValue csumNative(int argCount,\
  \ Value* args);\n\n//> 两个数的相乘\nValue cprodNative(int argCount, Value* args);\n\n\
  //> 两个数的相除\nValue cdivNative(int argCount, Value* args);\n#endif\n```\n\n为了更好地理解与在\
  \ `value.h` 中定义的结构体 `Value` 相关的操作，最好查看结构体 本身以及为它创建的方便宏。`Value` 结构体包含一个字段 `type`，其类型为\
  \ `ValueType`，该枚举所示：\n\n```c\ntypedef enum {\n  VAL_BOOL,\n  VAL_NIL,\n  VAL_INT,\n\
  \  VAL_DOUBLE,\n  VAL_OBJ\n} ValueType;\n```\n\n第二个字段是 `as`，它是一个联合体，包含四个代表每种数据类型的字段。`boolean`、`num_double`、`num_int`\
  \ 和 `obj` 分别代表 `bool`、`double`、`int` 和 `Obj`。我们可以看到 `Value` 如下：\n\n```c\ntypedef\
  \ struct {\n  ValueType type;\n  union {\n    bool boolean;\n    double num_double;\n\
  \    int num_int;\n    Obj* obj;\n  } as;\n} Value;\n```\n\n为了检查 `Value` 是否为布尔、浮点数或空，我们需要使用\
  \ `IS_*` 宏，并根据 `Value` 的 `type` 字段判断相应的类型：\n\n```c\n#define IS_BOOL(value) ((value).type\
  \ == VAL_BOOL)\n#define IS_NIL(value) ((value).type == VAL_NIL)\n#define IS_INT(value)\
  \ ((value).type == VAL_INT)\n#define IS_DOUBLE(value) ((value).type == VAL_DOUBLE)\n\
  #define IS_OBJ(value) ((value).type == VAL_OBJ)\n```\n\n为了将 `Value` 转换为 C 值，我们将使用\
  \ `AS_*` 宏，其中 `glob` 代表每种数据类型。这些宏在与 `IS` 宏配合使用时是安全的：\n\n```c\n#define AS_OBJ(value)\
  \ ((value).as.obj)\n#define AS_BOOL(value) ((value).as.boolean)\n#define AS_INT(value)\
  \ ((value).as.num_int)\n#define AS_DOUBLE(value) ((value).as.num_double)\n```\n\n\
  最后，我们需要将 C 值转换回 `Value`，为此此，我们将使用 `*_VAL` 宏，其中 `glob` 代表每种数据类型。根据类型，我们将返回一个带有相应\
  \ `ValueType` 的 `Value`，并在联合体中赋值值：\n\n```c\n#define BOOL_VAL(value) ((Value){VAL_BOOL,\
  \ {.boolean = value}})\n#define NIL_VAL ((Value){VAL_NIL, {.num_int = 0}})\n#define\
  \ INT_VAL(value) ((Value){VAL_INT, {.num_int = value}})\n#define DOUBLE_VAL(value)\
  \ ((Value){VAL_DOUBLE, {.num_double = value}})\n#define OBJ_VAL(object) ((Value){VAL_OBJ,\
  \ {.obj = (Obj*)object}})\n```\n\n现在，我们可以开始用 C 创建一些算术原生函数并在 Mufi 中使用它们。开始，我们需要在\
  \ `compiler/mufi_std_c.c` 上工作，并在文件顶部包含以下导入：\n\n```c\n#include \"mufi_std_c.h\"\n\
  #include<stdio.h>\n```\n\n我们将编写 `static` 函数 `error()`，它需要一个字符串消息或 `const char*`\
  \ 并返回 `Value`。如果遇到错误，我们需要使用 `fprintf()` 将消息打印到 `stderr` 并返回 Mufi 的 `nil` 或 `NIL_VAL`：\n\
  \n```c\n//> 将错误写入 stderr 并返回 nil\n```\n\n\n\n\n\n```c\nstatic Value error(const\
  \ char* message){\n  fprintf(stderr, \"ERROR: %s\\n\", message);\n  // in the end\
  \ return nil\n  return NIL_VAL;\n}\n```\n\n我们可以开始编写第一个函数 `csumNative()`，我们将从检查参数个数是否为\
  \ 2 开始。如果不是，我们将返回一个错误。在 `if` 语句之后，我们将创建两个变量 `first` 和 `second`，分别代表 `args` 中的第一个和第二个元素：\n\
  \n```c\nValue csumNative(int argCount, Value* args){\n  //check if we only have\
  \ two arguments\n  if (argCount != 2){\n    return error(\"csum() only expects two\
  \ arguments.\");\n  }\n  Value first = args[0];\n  Value second = args[1];\n```\n\
  \n接下来，为了确保算运算的安全，我们需要对 `first.type` 使用 `switch` 语句，以便评估它是整数还是双浮点数，如果不是，我们将在 `default`\
  \ 分支中返回错误：\n\n```c\n// handle the different data types\nswitch (first.type)\n{\n\
  \  case VAL_INT:{\n    break;\n  }\n  case VAL_DOUBLE: {\n    break;\n  }\n  default:{\n\
  \    return error(\"Type not supported in csum() cannot be added.\");\n    break;\n\
  \  }\n}\n}\n```\n\n在 `VAL_INT` 的情况下，我们将使用 `if/else` 语句来检查变量 `second` 的类型。如果它是整数，我们将创建一个整数变量\
  \ `sum`，使用宏 `AS_INT` 将 `first` 和 `second` 相加，并使用宏 `INT_VAL` 返回和。\n\n如果 `second`\
  \ 是双浮点数，我们将使和也成为双浮点数，为了这一点，我们将在 `first` 转换为 `int` 后将其转换为双浮点数，并使用宏 `AS_DOUBLE` 将\
  \ `second` 转换为双浮点数。然后我们使用宏 `DOUBLE_VAL` 返回和。\n\n如果 `second` 既不是整数也不是双浮点数，我们将返回一个错误，说明第二个参数无法与整数相加：\n\
  \n```c\nif(IS_INT(second)){\n  int sum = AS_INT(first) + AS_INT(second);\n  return\
  \ INT_VAL(sum);\n} else if (IS_DOUBLE(second)){\n  double sum = (double)AS_INT(first)\
  \ + AS_DOUBLE(second);\n  return DOUBLE_VAL(sum);\n} else {\n  return error(\"Second\
  \ argument in csum() cannot be added to integer.\");\n}\n```\n\n我们需要处理的下一个情况是 `VAL_DOUBLE`。如前所述，我们将使用\
  \ `if/else` 语句来检查 `second` 是否为双浮点数以及它是否为整数。否则，我们将返回一个错误。条件判断看起来与我们的 `VAL_INT` 情况几乎相同。然而，无论\
  \ `second` 是整数还是双浮点数，我们都返回一个双浮点数，如下所示：\n\n```c\nif (IS_DOUBLE(second)){\n  double\
  \ sum = AS_DOUBLE(first) + AS_DOUBLE(second);\n  return DOUBLE_VAL(sum);\n} else\
  \ if (IS_INT(second)){\n  double sum = AS_DOUBLE(first) + (double)AS_INT(second);\n\
  \  return DOUBLE_VAL(sum);\n} else {\n  return error(\"Second argument in csum()\
  \ cannot be added.\")\n}\n```\n\n在我们开始编写 `cprodNative()` 之前，你可能会奇怪为什么没有 `csubNative()`。答案是因为编译器在函数中处理负数时存在问题。因此，遗憾的是我们不会编写一个相减两个数字的函数，但我们可以期待寻找乘积。`cprodNative()`\
  \ 函数的写法将完全遵循 `csumNative()`，区别在于我们将寻找乘积，我们可以看到它们看起来有多相似，如下所示：\n\n```c\nValue cprodNative(int\
  \ argCount, Value* args){\n  //check if we only have two arguments\n  if (argCount\
  \ != 2){\n    return error(\"cprod() only expects two arguments.\");\n  }\n  Value\
  \ first = args[0];\n  Value second = args[1];\n  // handle the different data types\n\
  \  switch (first.type)\n  {\n    case VAL_INT:{\n      if(IS_INT(second)){\n   \
  \     int prod = AS_INT(first) * AS_INT(second);\n        return INT_VAL(prod);\n\
  \      } else if (IS_DOUBLE(second)){\n        double prod = (double)AS_INT(first)\
  \ * AS_DOUBLE(second);\n        return DOUBLE_VAL(prod);\n      } else {\n     \
  \   return error(\"Second argument in cprod() cannot be multiplied to integer.\"\
  );\n      }\n      break;\n    }\n    case VAL_DOUBLE: {\n      if (IS_DOUBLE(second)){\n\
  \        double prod = AS_DOUBLE(first) * AS_DOUBLE(second);\n        return DOUBLE_VAL(prod);\n\
  \      } else if (IS_INT(second)){\n        double prod = AS_DOUBLE(first) * (double)AS_INT(second);\n\
  \        return DOUBLE_VAL(prod);\n      } else {\n        return error(\"Second\
  \ argument in cprod() cannot be multiplied to double.\");\n      }\n      break;\n\
  \    }\n    default:{\n      return error(\"Type supported in cprod() cannot be\
  \ multiplied.\");\n      break;\n    }\n  }\n}\n```\n\n下一个我们要编写的函数是 `divNative()`。这个函数将比其他函数简单，它使用\
  \ `if/else` 语句检查 `second` 是否为双浮点数或整数。如果是双浮点数，我们将计算商并返回；如果是整数，我们将将其转换为双浮点数后再计算并返回。如下：\n\
  \n```c\nValue divNative(int argCount, Value* args){\n  if (argCount != 2){\n   \
  \ return error(\"div() only expects two arguments.\");\n  }\n  Value first = args[0];\n\
  \  Value second = args[1];\n  if (IS_DOUBLE(second)){\n    double quotient = AS_DOUBLE(first)\
  \ / AS_DOUBLE(second);\n    return DOUBLE_VAL(quotient);\n  } else if (IS_INT(second)){\n\
  \    double quotient = (double)AS_INT(first) / (double)AS_INT(second);\n    return\
  \ DOUBLE_VAL(quotient);\n  } else {\n    return error(\"Second argument in div()\
  \ cannot be divided into integer.\");\n  }\n}\n```\n\n为了让这些函数工作，我们需要在 `main.c` 中注册它们。在\
  \ `main` 函数中，调用 `register_function` 来将这些 C 函数暴露到虚拟机：\n\n```c\nregister_function(\"\
  csum\", csumNative);\nregister_function(\"cprod\", cprodNative);\nregister_function(\"\
  div\", divNative);\n```\n\n现在，我们可以编写一个简单的脚本来测试这些原生函数了：\n\n```javascript\nvar a =\
  \ 10;\nvar b = 2.5;\nprint(csum(a, b));\nprint(cprod(a, b));\nprint(div(a, b));\n\
  ```\n\n运行这个脚本，你将看到输出：\n\n```text\n12.5\n25\n4\n```\n\n\n\n\n\n```\n0029    | OP_GET_LOCAL\
  \        10031    | OP_CONSTANT         6 '2'\n0033    | OP_SUBTRACT\n0034    |\
  \ OP_CALL             10036    | OP_CALL             20038    | OP_RETURN\n0039\
  \    4 OP_NIL\n0040    | OP_RETURN\n```\n\n== `<script>` ==\n\n```\n0000    4 OP_CLOSURE\
  \           1<fn fib>\n0002    | OP_DEFINE_GLOBAL    0 'fib'\n0004    6 OP_CONSTANT\
  \         2 'Fib 20:'\n0006    | OP_PRINT\n0007    7 OP_GET_GLOBAL        3 'fib'\n\
  0009    | OP_CONSTANT         4 '20'\n0011    | OP_CALL             10013    | OP_PRINT\n\
  0014    | OP_NIL\n0015    | OP_RETURN\n```\n\n算术函数函数有点无聊，所以是时候添加一些可以执行更多事情的函数了。我们将添加函数\
  \ `ccmd()` 来运行 shell 命令，`cexit()` 用于带有指定的退出码退出程序，`cerr_print()` 用于向 `stderr` 打印，`cclock()`\
  \ 用于当前时间，以及 `cbench()` 用于运行批量基准测试。我们可以在 `compiler/mufi_std_c.h` 中添加以下函数：\n\n```c\n\
  //> 运行终端命令\nValue ccmdNative(int argCount, Value* args);\n\n//> 使用退出码退出程序\nValue\
  \ cexitNative(int argCount, Value* args);\n\n//> 向 stderr 打印消息\nValue cerrprintNative(int\
  \ argCount, Value* args);\n\n//> 返回当前时间\nValue cclockNative(int argCount, Value*\
  \ args);\n```\n\n批量基准测试将在最后使用，届我们将比较原生 C 基准测试、Rust 以及 Mufi 的性能。该基准测试将包含 7 个整数字段，其中第一个字段包含批数（每批运行的次数），其他\
  \ 6 个字段是字母 a 到 f，将用于求和。使用 `benchBatch` 结构，我们需要一个函数 `initBench()` 来根据指定的批数创建一个新的\
  \ `benchBatch`，以及一个函数 `runBench()` 来接收一个 `benchBatch`：\n\n```c\n// 用于运行批量基准测试的结构\n\
  typedef struct{\n    int batch_num;\n    int a;\n    int b;\n    int c;\n    int\
  \ d;\n    int e;\n    int f;\n}benchBatch;\n\n// 使用指定的批数初始化基准测试\nbenchBatch initBench(int\
  \ batch_num);\n\n// 运行基准测试\nvoid runBench(benchBatch bench);\n\n// 在 Mufi 中运行 runBench\n\
  Value cbenchNative(int argCount, Value* args);\n```\n\n除了这些新函数，我们还需要添加两个可以放在现有导入之后的导入：\n\
  \n```c\n#include \"object.h\"\n#include<time.h>\n```\n\n现在，我们可以回到 `compiler/mufi_std_c.c`\
  \ 并从 `cdivNative()` 之后开始编写 `ccmdNative()` 函数。我们只期望函数中有一个字符串命令，并将使用宏 `AS_CSTRING()`\
  \ 将 `Value` 转换为 `const char*`，从而通过 C 函数 `system()` 运行它。之后，我们可以返回 0 的 `INT_VAL`，或者更简单的方法是直接返回\
  \ `NIL_VAL`，因为在内部它们完全相同的：\n\n```c\nValue ccmdNative(int argCount, Value* args){\n\
  \    if(argCount != 1){\n        return error(\"ccmd() expects one argument.\");\n\
  \    }\n    if (!IS_STRING(args[0])){\n        return error(\"Argument must be a\
  \ string.\");\n    }\n    system(AS_CSTRING(args[0]));\n    return NIL_VAL;\n}\n\
  ```\n\n我们可以创建的下一个函数是 `cexitNative()`，它期望一个必须是整数的退出码。在函数内部，我们将使用 C 函数 `exit()`。为了将我们的\
  \ `Value` 转换为整数，我们将使用宏 `AS_INT()`：\n\n```c\nValue cexitNative(int argCount, Value*\
  \ args){\n    if(argCount != 1){\n        return error(\"cexit() expects one argument.\"\
  );\n    }\n    if (!IS_INT(args[0])){\n        return error(\"Argument must be an\
  \ integer.\");\n    }\n    exit(AS_INT(args[0]));\n}\n```\n\n为了打印到 `stderr`，我们将编写\
  \ `cerrprintNative()` 函数，它期望一个字符串并使用 C 函数 `fprintf()`。通过 `fprintf()` 函数，我们将它输出到\
  \ `stderr`，其中字符串来自 `AS_CSTRING`。然后我们将返回 `NIL_VAL`：\n\n```c\nValue cerrprintNative(int\
  \ argCount, Value* args){\n    if(argCount != 1){\n        return error(\"cerr_print()\
  \ expects one argument.\");\n    }\n    if(!IS_STRING(args[0])){\n        return\
  \ error(\"Argument must be string.\");\n    }\n    fprintf(stderr, \"%s\", AS_CSTRING(args[0]));\n\
  \    return NIL_VAL;\n}\n```\n\n获取当前时间，我们将创建一个返回 `double` 的 `static` 函数 `clock_current()`。该函数返回来自\
  \ `time.h` 的 `clock()` 并除以全局变量 `CLOCKS_PER_SEC`，以便我们可以获取当前时间：\n\n```c\nstatic double\
  \ clock_current(){\n    return clock()/CLOCKS_PER_SEC;\n}\n```\n\n现在，我们可以编写 `cclockNative()`\
  \ 函数，它期望 0 个参数并使用宏 `DOUBLE_VAL` 返回 `double` 类型 `Value`，并在内部使用 `clock_current()`：\n\
  \n```c\nValue cclockNative(int argCount, Value* args){\n    if(argCount != 0){\n\
  \        return error(\"cclock() expects 0 arguments.\");\n    }\n    return DOUBLE_VAL(clock_current());\n\
  }\n```\n\n现在，我们可以开始标准库的基准测试部分。为了开始我们的基准测试，我们需要初始化 `benchBatch` 结构。`initBench()`\
  \ 函数期望参数 `batch_num` 来设置我们需要的批数。我们将设置一个未定义的 `benchBatch` 变量 `bench`。我们将 `bench.batch_num`\
  \ 设置为参数 `batch_num`，并将其他字段设置为 1，最后返回 `bench`：\n\n```c\nbenchBatch initBench(int\
  \ batch_num){\n    benchBatch bench;\n    bench.batch_num = batch_num;\n    bench.a\
  \ = 1;\n    bench.b = 1;\n    bench.c = 1;\n    bench.d = 1;\n    bench.e = 1;\n\
  \    bench.f = 1;\n    return bench;\n}\n```\n\n基准测试的一个方面是我们可以重复调用函数。因此，当我们创建从 `a`\
  \ 到 `f` 每个字段的和时，我们将通过函数调用来实现，如下：\n\n```c\nstatic int benchA(benchBatch bench){return\
  \ bench.a; }\nstatic int benchB(benchBatch bench){return bench.b; }\nstatic int\
  \ benchC(benchBatch bench){return bench.c; }\nstatic int benchD(benchBatch bench){return\
  \ bench.d; }\nstatic int benchE(benchBatch bench){return bench.e; }\nstatic int\
  \ benchF(benchBatch bench){return bench.f; }\n```\n\n为了运行基准测试，我们将依赖函数 `runBench()`，它需要一个类型为\
  \ `benchBatch` 的参数 `bench`。我们需要设置一些变量，`sum` 和 `batch` 将设置为 0，`start` 设置为 `clock_current()`：\n\
  \n```c\nvoid runBench(benchBatch bench){\n    int sum = 0;\n    double start = clock_current();\n\
  \    int batch = 0;\n```\n\n我们将运行一个 `while` 循环，只要当前时间（`current_clock()`）减去我们的变量\
  \ `start` 小于 10，或者循环运行 10 秒。在 `while` 循环中，我们将有一个 `for` 循环从 `0` 迭代到 `bench.batch_num`，在\
  \ `for` 循环中，我们将让 `sum` 被每个 `bench*()` 函数累加。在 `for` 循环之后，我们将变量 `batch` 增 1。因此，在 `while`\
  \ 循环完成后，我们可以打印 `sum` 和 `batch`：\n\n```c\nvoid runBench(benchBatch bench){\n    int\
  \ sum = 0;\n    double start = clock_current();\n    int batch = 0;\n    while(clock_current()\
  \ - start < 10.0){\n        for(int i=0; i < bench.batch_num; i++){\n          \
  \  sum += benchA(bench) + benchB(bench) + benchC(bench)\n            + benchD(bench)\
  \ + benchE(bench) + benchF(bench);\n        }\n        batch++;\n    }\n    printf(\"\
  Sum: %d\\n\", sum);\n    printf(\"Batch: %d\\n\", batch);\n}\n```\n\n\n\n\n在编写了基准测试内部实现后，我们需要\
  \ Mufi 能够使用它，这就是 `csbenchNative()` 函数大显身场。它接受一个整数批次数，我们将使用宏 `AS_INT` 将 `Value` 转换为\
  \ `int`，这样我们就可以使用 `initBench()` 了。有了新的 `bench`，我们可以配合 `bench` 使用 `runBench()` 函数来运行基准测试，最后返回\
  \ `NIL_VAL`：\n\n```c\nValue cbenchNative(int argCount, Value* args){\n  if(argCount\
  \ != 1){\n    return error(\"cbench() only accepts 1 argument.\");\n  }\n  if(!IS_INT(args[0])){\n\
  \    return error(\"cbench() only accepts an integer batch number.\");\n  }\n  benchBatch\
  \ bench = initBench(AS_INT(args[0]));\n  runBench(bench);\n  return NIL_VAL;\n}\n\
  ```\n\n你可能会看到某些函数的工作方式类似于运行命令或退出程序，但我们应该让基准测试函数变得有趣一些。为了进行简单的比较，我们将在 Mufi 中编写该基准测试的克隆版本，并将其与\
  \ C 进行对比。\n\n我们将在 `scripts/bench.mufi` 中编写一个新脚本，克隆我们 C 程序中的 `Bench` 类，并运行 10k 和\
  \ 30k 批次：\n\n```python\nclass Bench{\n  init(batch_num){\n    self.batch_num = batch_num;\n\
  \    self.a = 1;\n    self.b = 1;\n    self.c = 1;\n    self.d = 1;\n    self.e\
  \ = 1;\n    self.f = 1;\n  }\n  bench_a(){\n    return self.a;\n  }\n  bench_b(){\n\
  \    return self.b;\n  }\n  bench_c(){\n    return self.c;\n  }\n  bench_d(){\n\
  \    return self.d;\n  }\n  bench_e(){\n    return self.e;\n  }\n  bench_f(){\n\
  \    return self.f;\n  }\n  run(){\n    var sum = 0;\n    var start = cclock();\n\
  \    var batch = 0;\n    while(cclock() - start < 10.0){\n      for(var i=0; i <\
  \ self.batch_num; i = i+1){\n        sum = sum + self.bench_a() + self.bench_b()\
  \ + self.bench_c()\n        + self.bench_d() + self.bench_e() + self.bench_f();\n\
  \      }\n      batch = batch + 1;\n    }\n    print \"Sum: \";\n    print sum;\n\
  \    print \"Batch: \";\n    print batch;\n  }\n}\nprint \"10k batch: \";\nvar bench\
  \ = Bench(10000);\nbench.run();\nprint \"30k batch: \";\nvar bench = Bench(30000);\n\
  bench.run();\n```\n\n然后我们可以在 `scripts/cbench.mufi` 中创建一个新脚本，为 10k 和 30k 批次运行 `cbench()`：\n\
  \n```python\nprint \"10k batch (C): \";\ncbench(10000);\nprint \"30k batch (C):\
  \ \";\ncbench(30000);\n```\n\n随后我们可以运行这两个脚本来查看结果。以下是我们得到的 get：\n\n```bash\n$ ./mufi\
  \ scripts/bench.mufi\n10k batch:\nSum:\n57120000\nBatch:\n952\n30k batch:\nSum:\n\
  57240000\nBatch:\n318\n$ ./mufi scripts/cbench.mufi\n10k batch (C):\nSum: 1903392704\n\
  Batch: 103306\n30k batch (C):\nSum: 1916112704\nBatch: 34506\n```\n\n我们主要关注能够完成的批次数量，如果比较这两种语言的实现，我们可以发现\
  \ C 原生函数在 10k 和 30k 批次中执行的批次数都是后者的 ~108 倍。\n\n# 在 Rust 中创建原生函数\n\n我们编写了大量的 C 代码——事实上接近\
  \ 300 行。那么，为什么不回来写点“生锈”（Rust）的东西呢？在项目根目录下，我们将创建一个如下的新库：\n\n```bash\n### 创建库\n$ cargo\
  \ new --lib mufi_stdlib\n### 进入库\n$ cd mufi_stdlib\n# 添加以下构建依赖\n$ cargo add --build\
  \ cc bindgen\n# 创建构建脚本\n$ touch build.rs\n```\n\n在 `mufi_stdlib/build.rs` 内部，我们需要使用\
  \ `new()` 方法链式 `../compiler/value.c` 和 `../compiler/object.c` 文件来创建一个新的 `cc::Build`。之后我们可以使用\
  \ `include()` 包含头文件，指向 `../compiler/` 目录。然后可以使用 `compile()` 方法将其编译为名为 `libufi.so`\
  \ 的共享对象：\n\n```rust\nuse bindgen::Builder;\nuse cc::Build;\nuse std::path::PathBuf;\n\
  \nfn main() {\n  Build::new()\n    .file(\"../compiler/value.c\")\n    .file(\"\
  ../compiler/object.c\")\n    .include(\"../compiler/\")\n    .compile(\"libufi.so\"\
  );\n}\n```\n\n接下来，我们需要创建绑定，需要 `../compiler/value.h` 和 `../compiler/object.h`。我们将生成的绑定输出到\
  \ `src/bindings.rs`，编写此脚本后可以运行 `cargo build`：\n\n```rust\nlet bindings = Builder::default()\n\
  \  .header(\"../compiler/value.h\")\n  .header(\"../compiler/object.h\")\n  .generate()\n\
  \  .unwrap();\n\nlet out_path = PathBuf::from(\"src/bindings.rs\");\nbindings.write_to_file(out_path).unwrap();\n\
  ```\n\n由于我们还希望 C 程序能够访问这些函数，需要在 `Cargo.toml` 的 `[lib]` 部分添加库名称和动态库类型：\n\n```toml\n\
  [lib]\nname = \"mufi_stdlib\"\ncrate-type = [\"cdylib\"]\n```\n\n这样我们就可以将库链接到程序。我们需要在\
  \ `Makefile` 中添加一个新变量并修改 `build` 选项以适配 Rust 库：\n\n```makefile\nRUST = -lmufi_stdlib\
  \ -Lmufi_stdlib/target/debug\nbuild:\n\tcd mufi_stdlib && $(CC) compiler/*.c -WWall\
  \ -std=c99 -o ufi\n```\n\n由于宏对我们来说不可用，我们需要自己创建。不过我们可以很容易地将它们重构为函数。我们将如下所示编写 `src/helpers.rs`，注意：并不是所有的都使用了，但你可以看到它们是如何构造的：\n\
  \n```rust\nuse crate::bindings::*;\nuse std::ffi::{c_char, c_int, CString};\n\n\
  pub unsafe fn is_bool(v: &Value) -> bool {\n  v.type_ == ValueType_VAL_BOOL\n}\n\
  pub unsafe fn is_int(v: &Value) -> bool {\n  v.type_ == ValueType_VAL_INT\n}\npub\
  \ unsafe fn is_double(v: &Value) -> bool {\n  v.type_ == ValueType_VAL_DOUBLE\n\
  }\npub unsafe fn is_obj(v: &Value) -> bool {\n  v.type_ == ValueType_VAL_OBJ\n}\n\
  pub unsafe fn as_obj(v: &Value) -> *mut Obj {\n  v.obj\n}\npub unsafe fn as_bool(v:\
  \ &Value) -> bool {\n  v.boolean\n}\npub unsafe fn as_int(v: &Value) -> c_int {\n\
  \  v.num_int\n}\npub unsafe fn as_double(v: &Value) -> f64 {\n  v.num_double\n}\n\
  pub unsafe fn bool_val(b: bool) -> Value {\n  Value {\n    type_: ValueType_VAL_BOOL,\n\
  \    as_: Value__bindgen_ty_1 { boolean: b },\n  }\n}\npub unsafe fn nil_val() ->\
  \ Value {\n  Value {\n    type_: ValueType_VAL_NIL,\n    as_: Value__bindgen_ty_1\
  \ { num_int: 0 },\n  }\n}\npub unsafe fn int_val(i: c_int) -> Value {\n  Value {\n\
  \    type_: ValueType_VAL_INT,\n    as_: Value__bindgen_ty_1 { num_int: i },\n \
  \ }\n}\npub unsafe fn double_val(d: f64) -> Value {\n  Value {\n    type_: ValueType_VAL_DOUBLE,\n\
  \    as_: Value__bindgen_ty_1 { num_double: d },\n  }\n}\npub unsafe fn obj_val(o:\
  \ *mut Obj) -> Value {\n  Value {\n    type_: ValueType_VAL_OBJ,\n    as_: Value__bindgen_ty_1\
  \ { obj: o },\n  }\n}\npub unsafe fn is_string(v: &Value) -> bool {\n  is_obj(v)\
  \ && (*as_obj(v)).type_ == ObjType_OBJ_STRING\n}\npub unsafe fn as_cstring(v: &Value)\
  \ -> *mut c_char {\n  (*(as_obj(v) as *mut ObjString)).chars\n}\n```\n\n我们需要的最后一个辅助函数是\
  \ `as_rs_string()`，它通过不可变借用 `Value` 并返回 `String` 来简化我们的工作。首先，我们需要使用 `as_cstring()`\
  \ 函数将 `Value` 转换为 C 字符串或 `*mut i8`。然后我们可以使用原始指针通过 `CString::from_raw()` 创建绑定 `cstr`。使用\
  \ `cstr` 的 `to_str()` 方法，我们可以将 `CString` 转换为 `&str`。然而，由于 `to_str()` 返回的是 `Result`，我们需要使用\
  \ `unwrap()`。然后，我们可以使用 `to_owned()` 方法返回 `String`：\n\n```rust\npub unsafe fn as_rs_string(v:\
  \ &Value) -> String {\n  let c = as_cstring(v);\n  let cstr = CString::from_raw(c);\n\
  \  let str = cstr.to_str().unwrap();\n  str.to_owned()\n}\n```\n\n现在，当所有的辅助函数都编写完成后，我们可以开始着处理\
  \ `src/lib.rs` 文件，这从添加以下 import 语句开始：\n\n```rust\nmod bindings;\nmod helpers;\n\
  ```\n\n\n\n\n```rust\nuse bindings::*;\nuse helpers::*;\nuse std::ffi::{c_int, CString};\n\
  use std::fs::{read_to_string, File};\nuse std::io::Write;\nuse std::ops::Sub;\n\
  use std::ptr::read;\nuse std::time::{Duration, Instant};\nuse std::process::{Command,\
  \ exit};\n```\n\n## 错误报告与 `error` 函数\n\n为了让错误报告工作更加方便，我们将编写一个 C 语言中 `error()` 函数的变体：接收一个\
  \ `&str` 消息，使用 `eprintln!` 将其打印到 `stderr`，并使用 `nil_val()` 返回 nil：\n\n```rust\nunsafe\
  \ fn error(message: &str) -> Value {\n    eprintln!(\"ERROR: {message}\");\n   \
  \ nil_val()\n}\n```\n\n为了知道我们需要哪些 Rust 函数，我们将在 `compiler` 目录下创建一个名为 `mufi_std_rs.h`\
  \ 的新头文件，并添加以下函数：\n\n```c\n#ifndef mufi_std_rs_h\n#define mufi_std_rs_h\n#include\
  \ \"value.h\"\n\n//> 执行 shell 命令\nValue rscmdNative(int argCount, Value* args);\n\
  \n//> 根据指定的退出码退出程序\nValue rsexitNative(int argCount, Value* args);\n\n//> 将字符串打印到\
  \ stderr\nValue rserrprintNative(int argCount, Value* args);\n\n//> 读取文件并返回字符串\n\
  Value readfileNative(int argCount, Value* args);\n\n//> 根据路径和内容写入文件\nValue writefileNative(int\
  \ argCount, Value* args);\n\n//> 使用 Rust 运行批量基准测试\nValue rsbenchNative(int argCount,\
  \ Value* args);\n\n//> 使用作用域线程运行批量基准测试\nValue rsbenchThread(int argCount, Value*\
  \ args);\n#endif\n```\n\n## 实现 `rscmdNative`\n\n现在，我们可以回到 `mufi_stdlib` 库中的 `lib.rs`\
  \ 开始编写 `rscmdNative()` 函数。为了避免在编译为动态库时名称发生更改或混淆，我们将在函数上方使用 `#[no_mangle]` 属性。由于我们正在与\
  \ C 绑定交互，几乎所有的函数都是 `unsafe` 的。为了为 C 创建函数，我们需要在函数名前缀加上 `extern \"C\"`。C 参数是类型为 `int`\
  \ 的 `argCount`（将变为 `c_int`），以及类型为 `Value*` 的 `args`（在 Rust 中为 `*mut Value`）。然后让函数像在\
  \ C 头文件中一样返回 `Value`：\n\n```rust\n#[no_mangle]\npub unsafe extern \"C\" fn rscmdNative(argCount:\
  \ c_int, args: *mut Value) -> Value {\n```\n\n我们期望 `rscmd()` 函数只接受一个字符串参数，因此我们可以使用\
  \ `if` 语句检查 `argCount` 是否不等于 1。如果是，我们就返回一个错误：\n\n```rust\nif argCount != 1 {\n \
  \   return error(\"rscmd() only expects one argument.\");\n}\n```\n\n要从 `args` 的原始可变指针获取第一个元素，我们不能像在\
  \ C 中那样直接索引。如果你还记得我们编写自己的 `Vec` 时，我们使用了 `std::ptr` 中的 `read()` 函数。该函数要求类型为 `*const\
  \ T`，因此我们需要将 `args` 强制转换为 `*const Value`。由于我们只需要第一个元素，所以不需要对 `args` 进行任何额外操作。在我们获得赋值给绑定\
  \ `val` 的 `Value` 之后，我们可以使用 `is_string()` 函数检查它是否为字符串。如果不是，我们将返回一个错误：\n\n```rust\n\
  let val = read(args as *const Value);\nif !is_string(&val) {\n    return error(\"\
  rscmd() only accepts string arguments.\");\n}\n```\n\n现在我们确定已经有了一个字符串，可以使用 `as_rs_string()`\
  \ 函数将 `val` 转换为 `String`。获取字符串后，我们可以使用 `Command::new()` 函数，通过借用我们的字符串将其传入，并使用 `spawn()`\
  \ 方法启动它，同时使用 `unwrap()` 处理 `Result`。运行命令后，我们可以如所示所示返回 `nil_val()`：\n\n```rust\n\
  let str = as_rs_string(&val);\nlet _ = Command::new(&str).spawn().unwrap();\nnil_val()\n\
  }\n```\n\n## 实现 `rsexitNative`\n\n我们将处理的下一个函数是 `rsexitNative()`，它将根据指定的退出码退出程序。该函数包含与我们之前的函数相同的函数声明。\n\
  \n我们将确保只有一个参数，如果没有，我们将返回一个错误。由于我们确定只有一个参数，因此可以安全地将 `args` 读取为 `*const Value` 并将其赋值给\
  \ `val`。（逻辑继续……）\n\n```rust\n#[no_mangle]\npub unsafe extern \"C\" fn rsexitNative(argCount:\
  \ c_int, args: *mut Value) -> Value {\n    if argCount != 1 {\n        return error(\"\
  rsexit() only expects one argument.\");\n    }\n    let val = read(args as *const\
  \ Value);\n    if !is_string(&val) {\n        return error(\"rsexit() only accepts\
  \ string arguments.\");\n    }\n    // ... 实现\n```\n\n## 实现 `rserrprintNative`\n\
  \n我们将处理的下一个函数是 `rserrprintNative()`，它将字符串打印到 `stderr`。\n\n```rust\n#[no_mangle]\n\
  pub unsafe extern \"C\" fn rserrprintNative(argCount: c_int, args: *mut Value) ->\
  \ Value {\n    if argCount != 1 {\n        return error(\"rserrprint() only expects\
  \ one argument.\");\n    }\n    let val = read(args as *const Value);\n    if !is_string(&val)\
  \ {\n        return error(\"rserrprint() only accepts string arguments.\");\n  \
  \  }\n    let str = as_rs_string(&val);\n    eprintln!(\"{}\", str);\n    nil_val()\n\
  }\n```\n\n## 实现 `readfileNative`\n\n我们将处理的下一个函数是 `readfileNative()`，它读取文件并返回字符串。\n\
  \n```rust\n#[no_mangle]\npub unsafe extern \"C\" fn readfileNative(argCount: c_int,\
  \ args: *mut Value) -> Value {\n    if argCount != 1 {\n        return error(\"\
  readfile() only expects one argument.\");\n    }\n    let val = read(args as *const\
  \ Value);\n    if !is_string(&val) {\n        return error(\"readfile() only accepts\
  \ string arguments.\");\n    }\n    let path = as_rs_string(&val);\n    let content\
  \ = read_to_string(path).unwrap_or_default();\n    let c_str = CString::new(content).unwrap();\n\
  \    let obj = ObjString::new(c_str.as_ptr(), c_str.to_bytes().len() as usize);\n\
  \    Value::from_obj(obj)\n}\n```\n\n\n\n\n\n现在，我们可以返回一个 `Value`。我们将字段 `type_` 赋值为\
  \ `ValueType_VAL_OBJ`，或者你也可以将其设置为 4。然后，对于 `as_` 字段，我们需要赋值 `union Value__bindgen_ty_1`。通过该\
  \ `union`，我们将使用 `obj` 字段来分配我们的绑定 `obj`，并将其强制转换为 `*mut Obj`：\n\n```rust\nlet content\
  \ = read_to_string(&path).unwrap();\nlet content_cstr = CString::new(&*content).unwrap();\n\
  let obj = copyString(content_cstr.as_ptr(), content.len() as c_int);\nValue {\n\
  \  type_: ValueType_VAL_OBJ,\n  as_: Value__bindgen_ty_1 {\n    obj: obj as *mut\
  \ Obj,\n  },\n}\n}\n```\n\n如果我们能够读取文件，难道我们不应该也能写入文件吗？`write_file()` 函数期望一个路径和一个要写入文件的内容；两者都需要是字符串。虽然我们习惯了只读取一个参数，但如何读取第二个参数呢？当我们想要读取第二个元素作为内容时，我们将使用\
  \ `args` 中的 `add()` 方法通过一个值来偏移我们的指针。我们希望偏移值为 1，然后可以将其强制转换为 `*const Value`：\n\n```rust\n\
  #[no_mangle]\npub unsafe extern \"C\" fn writefileNative(argCount: c_int, args:\
  \ *mut Value) -> Value {\n  if argCount != 2 {\n    return error(\"write_file()\
  \ only expects two arguments.\");\n  }\n  // write_file(path, content);\n  let path_val\
  \ = read(args as *const Value);\n  let content_val = read(args.add(1) as *const\
  \ Value);\n  if !is_string(&path_val) && !is_string(&content_val){\n    return error(\"\
  write_file() only expects string arguments.\");\n  }\n}\n```\n\n我们可以使用函数 `as_rs_string()`\
  \ 将绑定 `path_val` 和 `content_val` 转换为字符串，并分别赋值给绑定 `path` 和 `content`。然后我们可以使用函数 `File::create()`\
  \ 使用我们的 `path` 创建一个新文件，并解包 `Result`。接着，我们可以使用 `write_all()` 方法使用 `content` 写入文件，并使用\
  \ `as_bytes()` 方法将其转换为 `&[u8]`。在函数的最后，我们将返回 `nil_val()`：\n\n```rust\nlet path =\
  \ as_rs_string(&path_val);\nlet content = as_rs_string(&content_val);\nlet mut file\
  \ = File::create(&path).unwrap();\nfile.write_all(content.as_bytes()).unwrap();\n\
  nil_val()\n}\n```\n\n最后两个函数是 `rsbenchNative()` 和 `rsbenchThread()`，它们都需要我们做一些准备工作。首先，我们需要创建结构体\
  \ `BenchBatch`，并派生 `Debug`、`Clone` 和 `Copy` 特性。我们将拥有与 `benchBatch` 相同的字段，但字段类型为\
  \ `u64`：\n\n```rust\n#[derive(Debug, Clone, Copy)]\nstruct BenchBatch {\n  batch_num:\
  \ u64,\n  a: u64,\n  b: u64,\n  c: u64,\n  d: u64,\n  e: u64,\n  f: u64,\n}\n```\n\
  \n我们需要为 `BenchBatch` 创建一些方法；第一个将是 `new()` 方法，类似于 `init()`。我们需要设置批处理次数（batch number），其他字段将设置为\
  \ 1：\n\n```rust\nimpl BenchBatch {\n  pub fn new(batch_num: u64) -> Self {\n   \
  \ Self {\n      batch_num,\n      a: 1,\n      b: 1,\n      c: 1,\n      d: 1,\n\
  \      e: 1,\n      f: 1,\n    }\n  }\n}\n```\n\n就像我们在获取不同字段之和时使用调用一样，我们将对私有函数 `bench_*`\
  \ 执行同样的操作，其中通配代表字母字段：\n\n```rust\nfn bench_a(&self) -> u64 { self.a }\nfn bench_b(&self)\
  \ -> u64 { self.b }\nfn bench_c(&self) -> u64 { self.c }\nfn bench_d(&self) -> u64\
  \ { self.d }\nfn bench_e(&self) -> u64 { self.e }\nfn bench_f(&self) -> u64 { self.f\
  \ }\n```\n\n现在，我们准备好创建 `run()` 方法，它将不可变地使用 `self` 并在函数 `rsbench()` 中使用。我们需要将可变绑定\
  \ `sum` 设置为 0，将 `start` 设置为当前时间 `Instant::now()`，并将可变的 `batch` 设置为 0：\n\n```rust\n\
  pub fn run(&self) {\n  let mut sum = 0;\n  let start = Instant::now();\n  let mut\
  \ batch = 0;\n  while Instant::now().sub(start) < Duration::from_secs(10) {\n  \
  \  for _ in 0..self.batch_num {\n      sum += self.bench_a() + self.bench_b() +\
  \ self.bench_c() + self.bench_d() + self.bench_e() + self.bench_f();\n    }\n  \
  \  batch += 1;\n  }\n  println!(\"Sum: {}\", sum);\n  println!(\"Batch: {}\", batch);\n\
  }\n```\n\n最后一个编写的方法是 `run_scoped()`，它将不可变地使用 `self` 并在 `rsbenchThread()` 中使用。该函数的目标是在最少的批次数内获得最高和。为了实现这一点，我们将拥有三个设置为\
  \ 0 的可变绑定 `sum1`、`sum2` 和 `sum3`，并在作用域线程中使用。我们还需要将 `start` 设置为 `Instant::now()`并将\
  \ `batch` 设置为 0：\n\n```rust\npub fn run_scoped(&self) {\n  let mut sum1 = 0;\n \
  \ let mut sum2 = 0;\n  let mut sum3 = 0;\n  let start = Instant::now();\n  let mut\
  \ batch = 0;\n  while Instant::now().sub(start) < Duration::from_secs(10) {\n  \
  \  std::thread::scope(|s| {\n      s.spawn(|| {\n        for _ in 0..self.batch_num\
  \ {\n          sum1 += self.bench_a() + self.bench_b() + self.bench_c() + self.bench_d()\
  \ + self.bench_e() + self.bench_f();\n        }\n      });\n      s.spawn(|| {\n\
  \        for _ in 0..self.batch_num {\n          sum2 += self.bench_a() + self.bench_b()\
  \ + self.bench_c() + self.bench_d() + self.bench_e() + self.bench_f();\n       \
  \ }\n      });\n      s.spawn(|| {\n        for _ in 0..self.batch_num {\n     \
  \     sum3 += self.bench_a() + self.bench_b() + self.bench_c() + self.bench_d()\
  \ + self.bench_e() + self.bench_f();\n        }\n      });\n    });\n    batch +=\
  \ 1;\n  }\n  println!(\"Sum: {}\", sum1 + sum2 + sum3);\n  println!(\"Batch: {}\"\
  , batch);\n}\n```\n\n\n\n\n\n```\nlet bench = BenchBatch::new(as_int(&args.read())\
  \ as u64);\nbench.run_scoped();\nnil_val()\n}\n```\n\n如果我们不在 `compiler/vm.c` 中定义它，我们所有的工作都将徒劳。为了做到这一点，我们需要导入头文件\
  \ `mufi_std_rs.h`。定义头文件后，我们就可以自由地测试一些函数：\n\n```cpp\n#include \"mufi_std_rs.h\"\n\
  …\nvoid initVM(){\n…\ndefineNative(\"rscmd\", rscmdNative);\ndefineNative(\"rsexit\"\
  , rsexitNative);\ndefineNative(\"rserr_print\", rserrprintNative);\ndefineNative(\"\
  read_file\", readfileNative);\ndefineNative(\"write_file\", writefileNative);\n\
  defineNative(\"rsbench\", rsbenchNative);\ndefineNative(\"rsbench_thread\", rsbenchThread);\n\
  }\n```\n\n由于我们有一个需要链接的 Rust 库，如果我们想在 repl 系统中测试文件操作，我们需要构建项目并导出我们的库路径。如下所示：\n\n\
