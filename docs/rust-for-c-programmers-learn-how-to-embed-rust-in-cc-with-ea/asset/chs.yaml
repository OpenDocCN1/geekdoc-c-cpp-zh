  \ println!(\"Dumb Exponent---\");\n    let two_pow_6 = dumb_exp(2, 6);\n    println!(\"\
  2⁶ = {}\", two_pow_6);\n}\n```\n\n如果我们运行我们的代码，将得到如下输出：\n\n```\n$ cargo run\n---Factorial---\n\
