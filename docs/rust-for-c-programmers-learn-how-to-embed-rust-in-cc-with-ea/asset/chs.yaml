- "# C++ 程序员的 Rust 指南：轻松在 C/C++ 中嵌入 Rust\n\n\n\n![](img/cover.jpg)\n\n![image](img/cover.jpg)\n\
  \n\n![](img/line.jpg)\n\n\n![](img/line.jpg)\n\n\n![](img/logo.jpg)\n\n[www.bpbonline.com](http://www.bpbonline.com)\n\
  \n\n\n\n\nWeWork\n\n\n\n\n## 献给\n\n我亲爱的父母：\n*Yousuf Khan*\n*Fouzia Sultana*\n\n\
  以及我出色的家人和朋友的支持\n\n## 关于作者\n\n**Mustafif Khan** 是一位加拿大学生，主修金融数学，辅修计算机科学。他的爱好包括编程、游戏和写作。他从小就开始写书，他的作品中已有几本自出版的诗集。他对编程的兴趣始于想编写自己的网站。不久后，Khan\
  \ 通过切换到 Linux 发行版对系统编程产生了兴趣。在过去的三年里，他一直在编写 `Rust` 并从书籍、文档和构建项目中学了大量知识，例如 `TexCreate`（一个\
  \ LaTeX 项目创建器）和 `TexCore`（一个使用 `Rust` 类型编写 LaTeX 的库）。在 Khan 发现 `Rust` 之前，他一直用 `C++`\
  \ 和 `Golang` 编写项目，但在使用 `Rust` 之后，除了 `C` 之外，他无法回头。\n\n## 关于评审员\n\n**Pooya Eimandar**\
  \ 是中东第一个云游戏平台 `PlayPod` 的负责人。他使用 C/C++ 和 Rust 结合 GPU API（主要是 `Vulkan` 和 `DirectX`）开发了许多游戏和实时应用。他还是游戏开发领域许多书籍的作者和技术评审。此外，他还是\
  \ `RivalArium` 云游戏的联合创始人兼 CTO。\n\n这部作品献给勇敢无畏的伊朗人民，他们成为世界上许多人的灵感源泉。让我们放大他们的声音、他们的信息以及他们对美好未来的向往；\n\
  \n“女性、生命、自由！”\n\n## 致谢\n\n我想感谢几个人，他们在本书编写期间向我提供了持续且不断的支持。首先，我要感谢我的父母作为作者和程序员对我的持续支持。其次，我要感谢我最好的朋友\
  \ Catherine Xiao 和 Diane Zaide，每当我遇到写作瓶颈时，她们都在那里鼓励我。在压力巨大的时候，她们给予了我持续的支持，没有她们，我不知道自己如何能完成这本书。\n\
  \n我的感谢也来自 `BPB Publications` 团队。这是我第一次为出版商写书，在 `BPB` 的支持下，这种经历并没有想象中那么可怕。我很感谢给予给我的机会，以及通过编写这本书所获得的经验。\n\
  \n## 前言\n\n本书是一本 `Rust` 编程语言从入门到进的指南。尽管如此，由于 `Rust` 的学习曲线以陡峭著称，我们的目标群体是 `C++` 程序员，他们可以利用现有的知识帮助更轻松地学习\
  \ `Rust`。在书中，我们将介绍如何在 `Rust` 中编写简单程序，查看网络、并发和元编程等不同主题，并使我们的目标与 `C++`更好地对齐。我们还将涉及\
  \ `unsafe Rust` 和外部函数接口 (`FFI`)，以便将 `Rust` 集成到 `C` 项目中，反之亦然。\n\n本书的一个巧妙方法是采用了专门的项目章节，这些章节将为你提供更好的\
  \ `Rust` 程序编写体验，以便更好地巩固你将学习的知识。我们将构建诸如命令行应用到桌面应用（`GTK` 和 `Tauri`）的内容，并为玩具语言 `Mufi`\
  \ 编写一个 `Rust` 标准库，该库配有一个用 `C` 编写的字节码编译器。\n\n本书分为 **11 章**。前 6 章是初级到中级水平，后 5 章是更高级的主题，包含更复杂、更乱的代码。在\
  \ 11 章中，有七章专注于 `Rust` 内容，四章专注于构建项目。\n\n**第 1 章** 将涵盖 `Rust` 编程语言的介绍，以及我们如何利用它和 `C++`\
  \ 来更有效地平滑该语言的学习曲线。我们将研究优秀的包管理器 `Cargo`，用于创建应用程序、库、基准测试和测试。\n\n**第 2 章** 将涵盖如何使用实现、trait\
  \ 和泛型将面向对象的概念应用于结构和枚举。这些技术将允许开发者充分利用结构和枚举，同时看到如何轻松将 `C++` 中的多态和模板转换为 `Rust`。\n\n\
  **第 3 章 将涵盖如何在 `Rust` 中处理错误，无论是优雅地处理还是崩溃（panic）。我们将看到 `Rust` 针对错误处理的专用类型，而不是使用 try-catch\
  \ 方法。我们在学习如何处理错误的同时，还将研究创建自定义错误类型，以便在项目中进行个性化的错误处理，这是 Rust 项目的重要部分。\n\n**第 4 章**\
  \ 将涵盖如何使用强大的 `structopts` 库在 `Rust` 中创建命令行界面应用程序。我们还将编写一个简单的 Web 服务器，以便我们的 CLI 充客户端，这将涉及\
  \ `Rust` 异步编程的介绍。在我们创建应用程序之后，我们将学习使用包管理器 `Cargo` 进行发布。\n\n**第 5 章** 将涵盖如何结合线程、智能指针和锁类型在\
  \ `Rust` 中创建并发程序。我们将讨论并发的重要性以及 `Rust` 如何通过 `Send` 和 `Sync` trait 保证程序的线程安全以避免数据竞态。\n\
  \n**第 6 章** 将涵盖 `Rust` 网络基础，包括使用标准库的同步上下文和使用 `tokio` 库的异步上下文。我们将通过创建 IO 模型来研究这两种上下文，帮助我们理解如何绑定地址以及读取/写入数据流。\n\
  \n**第 7 章** 将涵盖如何使用 `GTK` 框架为原生 Linux 系统创建桌面应用。我们将讨论仅使用 `Rust` 类型开发桌面应用的优缺点，以及如何使用\
  \ `GTK` 家族库编写不同类型的应用程序。\n\n\n\n\n\n第 8 章 将介绍什么是不安全 Rust（unsafe Rust）以及如何在 Rust 程序中集成其他语言；我们的重点是使用\
  \ `Rust FFI` 调用 `C`/`C++`。我们将讨论在 Rust 中安全和不安全意味着什么，以及何时适合考虑执行不安全操作。在讨论完不安全操作后，我们将查看如何向\
  \ Rust 程序中添加原始 C 绑定，以及在 C 程序中使用 Rust 共享库。\n\n第 9 章 将介绍 Rust 中的元编程以及如何利用 Rust 语法和标记树（token\
  \ trees）来生成代码。我们将讨论与普通函数、特质（traits）等相比，何时使用元编程是合适的，以及应该选择声明式宏还是过程式宏。\n\n第 10 章 将介绍如何将\
  \ Rust 集成到一种用 C 编写的名为 Mufi 的字节码编译玩具语言中。在本章中，我们将深入为 Mufi 语言用 Rust 开发一个标准库，并使用用 C、Rust\
  \ 编写的原生函数以及解释型 Mufi 程序创建一个批量基准测试。\n\n第 11 章 将介绍如何使用 Tauri 框架编写跨平台桌面应用程序。与在 GTK 中开发应用一样，我们将探讨\
  \ Tauri 开发的优缺点，以及何时考虑使用它来创建应用。我们将讨论使用 Rust 配合 Svelte 前端来创建功能上与 Electron 相似的响应式应用程序。\n\
