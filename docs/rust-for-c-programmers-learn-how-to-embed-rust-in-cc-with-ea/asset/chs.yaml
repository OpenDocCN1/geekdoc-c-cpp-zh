  \ `recurse`，将其赋值给 `fields.unnamed` 并使用 `iter()` 方法，使其成为一个 `Iterator`。在 `iter()`\
  \ 方法之后，我们将与 `enumerate()` 方法进行链式，以便获取索引的当前计数。然后，我们将与 `map()` 方法进行链式。通过 `map()` 方法，参数将是一个元组\
  \ `(i, f)`，其中 `i` 是 `usize` 类型的索引，`f` 是 `&Field` 类型的字段：\n\n```rust\nlet recurse\
