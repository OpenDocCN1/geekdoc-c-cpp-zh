  \ `vars`，类型为 `Set<Ident>`，其中 `Set` 是 `HashSet` 的别名：\n\n```rust\nstruct Args{\n \
  \   vars: Set<Ident>\n}\n```\n\n首先，我们需要为 `Args` 实现 `Parse`  trait，以便我们能够使用宏 `parse_macro_input!`\
