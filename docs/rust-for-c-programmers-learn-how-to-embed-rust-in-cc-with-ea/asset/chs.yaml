  \ 返回的 Ok 值显示\n\n当由于除以 0 导致错误时，我们可以从图 11.4*看到显示的错误消息：\n\n![](img/Figure-11.4.jpg)\n\
  \n**图 11.4：** divide() 返回的错误消息显示\n\n# 嵌套 each  (#toc.xhtml_s188a)\n\n在开发本章的练习程序时，发现了\
  \ Svelte 中嵌套 `each` 循环的一个问题，即每个值都会出现多次。我们将考虑一种情况：你有一个元素必须包含来自多个数组的迭代，一个重要的说明是所有这些数组的长度都是相同的。\n\
  \n首先，我们将考虑一个包含三列表格的应用程序，三列分别为数字、数字平方和数字立方。\n...\n\n\n\n\n\n要修复这个问题，我们将考虑 `{#each}`\
  \ 标签有一个第二个参数，该参数可以获取索引。与其尝试遍历每个值，不如使用索引，从而将循环次数从 3 次减少到 1 次。请记住，只要数组长度相同，这种方法就是有效的，否则你可能会遇到索引越界的错误。\n\
  \n我们代码的修复方法如下，其中使用变量 `i` 作为数组的索引：\n\n```html\n{#each num as _, i}\n<tr>\n  <td>{num[i]}</td>\n\
  \  <td>{num_sq[i]}</td>\n  <td>{num_cubed[i]}</td>\n</tr>\n{/each}\n</table>\n</div>\n\
  </div>\n```\n\n如果我们运行应用程序并加载数字，可以看到它如我们预期那样工作。这可以在 图 11.6 中看到：\n\n![](img/Figure-11.6.jpg)\n\
  \n**图 11.6:** 嵌套 Each 循环的预期行为\n\n# Tauri 开发中的挑战 (#toc.xhtml_s189a)\n\n与使用 Electron\
  \ 和 GTK 等其他方法创建桌面应用相比，Tauri 开发是一个令人惊叹的框架。然而，与其他框架一样，Tauri 也有许多意想不到的挑战，会让生活变得非常困难。\n\
  \n在为本章编写不同构想时遇到的第一个挑战是 Tauri 与其他 crate 的奇怪行为——有些可以工作，有些则不行。这个问题的在于，在你开始编写应用程序的基础并发现核心组件无法工作之前你是不知道的。一个例子是你尝试编写一个加密程序并使用\
  \ crate `magic-crypt`。另一个不起作用的 crate 是 tex 引擎 `tectonic`，它是从用户处获取 latex 输入并返回 pdf\
  \ 的方法，听起来很不错，但由于 tectonic C 绑定的问题，它无法工作。\n\n另一个挑战是 Tauri 应用是只读的，如果你有一个需要写文件的程序，这可能会是一个问题，因为在这里你无法写入。问题是，你在构建程序并得到这个错误之前不知道这个问题。想象一下，写了整个应用程序，结果程序却是只读的。\n\
  \n你仍然尝试在 Linux 中使用 `chmod` 更改权限。即使你使用 `yarn tauri dev` 等工具在开发环境中写入新文件，当在 `src-tauri`\
  \ 中发现新文件时，整个项目都会重新构建，这可能非常烦人。\n\n# 结论 (#toc.xhtml_s190a)\n\nTauri 框架通过使用 JavaScript\
  \ 框架作为前端 UI 和 Rust 作为后端语言，帮助开发者的生活变得轻松。与其浪费时间尝试用 Rust 类型构建 UI，不如使用 HTML 创建要简单得多，而且在\
  \ Svelte 框架的帮助下，使用 JavaScript 让生活变得容易得多。总之，我们已经看到了如何使用 Tauri 框架结合 SvelteKit 框架创建一个桌面应用。\n\
  \n# 关键事实 (#toc.xhtml_s191a)\n\n*   使用 Svelte 时，尝试使用各种标签和属性来帮助简化 JavaScript 体验。\n\
  *   在 Tauri 命令中返回 `Result` 时，使用 JavaScript 中的 `then()` 和 `catch()` 方法：\n    *  \
  \ `then()` 处理 `Result` 的 `Ok` 值。\n    *   `catch()` 处理 `Result` 的 `Err` 值。\n*  \
  \ 在 Tauri 中创建新命令，使用属性 `#[tauri::command]`。\n    *   确保在 `tauri::generate_handler![]`\
  \ 中添加该标识符。\n*   为了获得最佳 Tauri 体验，请确保使用最新的 Rust 编译器和最新的 `npm` 或 `yarn` 版本。\n    *\
  \   Windows 构建建议使用 Windows 11。\n*   推荐使用带有 `Tauri` 插件和 `Svelte` 插件的 `vscode` 以获得最佳开发体验。\n\
  *   使用 Tauri 构建应用程序时的最佳资源是使用他们的官方指南：[`tauri.app/v1/guides/`](https://tauri.app/v1/guides/)。\n\
  \n# 练习 (#toc.xhtml_s192a)\n\n1.  创建一个应用程序，显示 RSS Feed 的前 25 个故事，确保包含文章标题（嵌入其中的链接）和发布日期。\n\
  \n# 答案 (#toc.xhtml_s193a)\n\n1.  在本次练习中，我们将展示新闻网站 [`www.phoronix.com/`](https://www.phoronix.com/)\
  \ 的前 25 个故事，该网站有很多关于 Linux 内核/社区最新动态的文章。该网站通过链接方便地提供了网站的 `rss` 馈，[`www.phoronix.com/rss.php`](https://www.phoronix.com/rss.php)。我们可以轻松使用\
  \ `reqwest` crate 向该链接发送 get 请求，并从请求的字节中读取 XML 文件。\n\n要开始练习，最好是使用 `cargo create-tauri-app`\
  \ 命令创建项目 `rss_app`，如下所示：\n\n（注：提供的文本似乎在代码片段处突然结束。我已根据规则对可用文本进行了格式化处理。）\n\n\n\n\n\
  \n为了创建一个 `Channel`，我们需要读取一个字节数组，因此我们需要使用通过 `LINK` 的 `reqwest::get()` 函数来发送响应。之后，我们需要将其与\
  \ `bytes()` 方法进行链式调用，将其转换为我们可以从中读取的 `Bytes` 类型。请注意，在使用 `bytes()` 方法和 `await` 之间，我们需要分别使用\
  \ `await` 和 `?` 运算符来处理异步函数的 `Future` 和错误：\n\n```rust\nlet content = reqwest::get(LINK)\n\
  \    .await?\n    .bytes()\n    .await?;\n```\n\n为了创建一个新的 `Channel`，我们将使用 `Channel::read_from()`\
  \ 函数，在该函数中，我们将借用绑定 `content` 并使用 `[..]` 对其进行切片。之后，我们可以返回一个包装在 `Ok` 中的通道，如下所示：\n\n\
  ```rust\nlet channel = Channel::read_from(&content[..])?;\nOk(channel)\n}\n```\n\
  \n现在，我们准备好为 `Feed` 创建一个 `new()` 方法了，该方法将是异步的，并返回 `Result<Self, Box<dyn Error>>`：\n\
  \n```rust\nimpl Feed{\n    pub async fn new() -> Result<Self, Box<dyn Error>>{\n\
  ```\n\n第一步是使用 `get_feed()` 函数获取我们的 `Channel`，我们需要使用 `await` 和 `?` 运算符来处理 future\
  \ 和错误。之后，我们可以为通道的标题、发布日期和链接创建可变绑定，并使用 `Vec::new()` 初始化它们：\n\n```rust\nlet channel\
  \ = get_feed().await?;\nlet mut titles = Vec::new();\nlet mut dates = Vec::new();\n\
  let mut links = Vec::new();\n```\n\n我们将创建一个绑定 `items`，它将通过来自绑定 `channel` 的 `items()`\
  \ 方法包含 `rss` 馈中的不同文章：\n\n```rust\nlet items = channel.items();\n```\n\n为了获取最新的 25\
  \ 个故事，我们可以创建一个从 0 迭代到 25 的 `for` 循环，使用索引遍历 `items`，并将字段推送到其相应的向量中。之后，我们可以使用向量 `titles`、`dates`\
  \ 和 `links` 返回 `Self`：\n\n```rust\nfor i in 0..25 {\n    titles.push(items[i].title.clone().unwrap());\n\
  \    dates.push(items[i].pub_date.clone().unwrap());\n    links.push(items[i].link.clone().unwrap());\n\
  }\nOk(Self { titles, dates, links})\n```\n\n为了获取内部的 `Feed`，我们将有一个单独的方法 `load()`，它也将是异步的，并通过对\
  \ `Feed::new()` 使用 `match` 语句返回 `Feed`。在 `Ok`情况下，我们将返回类型为 `Feed` 的值，而在 `Err` 情况下，我们将忽略错误并选择返回\
  \ `Feed::default()`：\n\n```rust\npub async fn load() -> Self {\n    match Self::new().await\
