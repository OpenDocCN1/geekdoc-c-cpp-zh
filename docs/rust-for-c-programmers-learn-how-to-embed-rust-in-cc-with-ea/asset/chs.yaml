  \ `Ident` 并且由类型 `P` 分隔。通过对绑定 `vars` 进行迭代并收集为 `Set<Ident>`，创建一个新的 `Args` 并将其封装在 `Ok()`\
  \ 中，因为该函数返回 `Result`：\n\n```rust\nlet vars = Punctuated::<Ident, Token>::parse_terminated(input)?;\n\
  Ok(Args { vars: vars.into_iter().collect() })\n}\n```\n\n我们需要为 `Args` 几个方法，以确保我们能够打印表达式或模式，以及进行赋值和打印。我们将编写第一个函数是\
  \ `should_print_expr()`，它不可变地借用 `self`，参数 `e` 类型为 `Expr` 并返回 `bool`。为了处理表达式 `e`，我们将使用\
  \ `match` 语句并解引用 `e`。因此，我们可以处理 `Expr::Path()` 或者返回 `false`：\n\n```rust\nimpl Args{\n\
  \    fn should_print_expr(&self, e: &Expr) -> bool{\n        match *e{\n       \
  \     Expr::Path(ref e) => true,\n            _ => false\n        }\n    }\n}\n\
  ```\n\n在我们的情况下，对于 `Expr::Path`，我们将使用变量 `e`，其类型为 `&Expr`。我们需要确保无论哪个路径只有一个段，如果有领先冒号\
  \ `::`，我们将返回 `false`，或者段长度不为 1。如果没有领先冒号且段长度为 1，我们获取第一个段，然后检查标识符是否在 `self.vars` 中，以及第一个段中的参数是否为空：\n\
