  \ = parse_macro!(args as Args);\n    // 对函数的更改是通过 Fold 特性中的方法完成的，\n    // 我们通过绑定\
  \ `args` 和 `input` 使用方法 `fold_item_fn()` 获取输出。\n    let output = args.fold_item_fn(input);\n\
