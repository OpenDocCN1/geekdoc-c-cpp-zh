  \ VAL_INT,\n    VAL_DOUBLE\n}ValueType;\n```\n\n我们需要创建的下一个结构体是 `Value`；在 `Value`\
  \ 中，我们将使用 `ValueType` 来存储值的类型，为了支持不同的类型，我们内部使用一个 `union` 字段命名为 `as`。在 `union` 内部，我们将字段\
  \ `boolean`、`num_double` 和 `num_int`，类型分别为 `bool`、`double` 和 `int`：\n\n```c\ntypedef\
  \ struct {\n    ValueType type;\n    union {\n        bool boolean;\n        double\
  \ num_double;\n        int num_int;\n    }as;\n}Value;\n```\n\n为了方便起，我们应该创建一些宏将\
  \ `Value` 转换为 `bool`、`int` 和 `double`。我们需要使用一个 `Value` 并从 `as` 返回所需的类型：\n\n```c\n\
  // 将值转换为 int, double, bool 的宏\n#define AS_BOOL(value) ((value).as.boolean)\n#define\
  \ AS_INT(value) ((value).as.num_int)\n#define AS_DOUBLE(value) ((value).as.num_double)\n\
  ```\n\n这些宏非常棒，但如果我们需要进行相反的操作了呢？当我们需要从一个 `bool` 值创建一个新的 `Value` 时，我们需要确保它的类型是 `VAL_BOOL`\
  \ 并在块 `.boolean` 中将其设置为我们的值，这和其他类型所示所示：\n\n```c\n// 将 int, double, bool 转换为 Value\
  \ 的宏\n#define BOOL_VAL(value) ((Value){VAL_BOOL, {.boolean=value}})\n#define NIL_VAl\
  \         ((Value){VAL_NIL, {.num_int = 0}})\n#define INT_VAL(value) ((Value){VAL_INT,\
  \ {.num_int = value}})\n#define DOUBLE_VAL(value) ((Value){VAL_DOUBLE, {.num_double\
  \ = value}})\n```\n\n我们现在准备好定义我们的值动态数组，它将包含三个字段：\n\n*   `capacity`：数组的容量。\n*   `count`：数组内部值的计数。\n\
  *   `values`：使用指针的 `Value` 数组。\n\n考虑到这些，我们可以看到 `struct` 定义如下：\n\n```c\n// 用于 Value\
  \ 的动态数组\ntypedef struct {\n    int capacity;\n    int count;\n    Value* values;\n\
  }ValueArray;\n```\n\n我们需要完成的最后一个任务是作为绑定（bindings）正向声明我们将需要的一些函数，包括以下内容：\n\n*   `initArray()`：创建一个新的\
  \ `ValueArray`\n*   `writeArray()`：将一个 `Value` 推入 `ValueArray` 的末尾\n*   `printValue()`：根据其类型打印一个\
  \ `Value`\n*   `printValues()`：打印 `ValueArray` 内部的所有值\n*   `intToVal()`：将整数转换为 `Value`\n\
  *   `doubleToVal()`：将双精度转换为 `Value`\n*   `boolToVal()`：将布尔转换为 `Value`\n*   `nilVal()`：返回一个\
  \ nil `Value`\n\n所有这些内容如下所示：\n\n```c\n// 创建一个新的空数组\nValueArray initArray();\n//\
  \ 附加到值数组的末尾\nvoid writeArray(ValueArray* array, Value value);\n// 打印一个值\nvoid printValue(Value\
  \ value);\n// 打印所有值\nvoid printValues(ValueArray* array);\n// 将 int 转换为 Value\n\
  Value intToVal(int i);\n// 将 double 转换为 Value\nValue doubleToVal(double d);\n//\
  \ 将 bool 转换为 Value\nValue boolToVal(bool b);\n// 返回一个 nil Value\nValue nilVal();\n\
  ```\n\n\n\n\n\n```c\nvoid writeArray(ValueArray* array, Value value){\n```\n\n在我们添加元素之前，需要检查数组是否已满。就像在上一个练习中一样，当容量（capacity）等于计数（count）或长度时，就会发生这种情况：\n\
  \n```c\n// Checks if array is full\nif (array->capacity == array->count){\n```\n\
  \n我们将使用宏 `GROW_CAPACITY()` 通过将数组的当前容量赋值给结果的结果来扩展容量：\n\n```c\narray->capacity = GROW_CAPACITY(array->capacity);\n\
  ```\n\n然后，我们可以使用宏 `GROW_ARRAY()` 来扩展数组的 `Value` 指针数组，使用 `Value` 作为类型，使用 `array->values`\
  \ 作为指针，并将 `array->capacity` 作为新容量：\n\n```c\narray->values = GROW_ARRAY(Value, array->values,\
  \ array->capacity);\n}\n```\n\n为了将值推到数组末尾，我们将将其放在数组计数的索引处，在完成后，我们可以将计数加 1：\n\n```c\n\
  // Append to the array\narray->values[array->count] = value;\narray->count++;\n\
  }\n```\n\n我们需要创建的下一个函数是 `printValue()`，它接收一个 `Value` 并根据其类型进行打印。为了实现这一点，我们将使用 `switch`\
  \ ，每个 `case` 对应一个 `ValueType`。为了获取内部值，我们将根据正在处理的类型使用 `AS_*` 宏：\n\n```c\nvoid printValue(Value\
  \ value) {\n  switch (value.type) {\n    case VAL_BOOL:\n      printf(AS_BOOL(value)\
  \ ? \"true\\n\" : \"false\\n\");\n      break;\n    case VAL_NIL:\n      printf(\"\
  nil\\n\");\n      break;\n    case VAL_DOUBLE:\n      printf(\"%g\\n\", AS_DOUBLE(value));\n\
  \      break;\n    case VAL_INT:\n      printf(\"%d\\n\", AS_INT(value));\n    \
  \  break;\n  }\n}\n```\n\n为了方便打印给定数组中的每个值，我们将编写函数 `printValues()`。该函数将使用 `ValueArray`\
  \ 指针并使用 `for` 循环通过 `printValue()` 打印数组中的每个值：\n\n```rust\nvoid printValues(ValueArray*\
  \ array){\n  for(int i=0; i < array->count; i++){\n    printValue(array->values[i]);\n\
  \  }\n}\n```\n\n由于 `bindgen` 不会为我们的 C 宏创建绑定，我们将使用函数 `intToVal()`、`doubleToVal()`、`boolToVal()`\
  \ 和 `nilVal()` 将宏伪装，以将类型转换为 `Value`：\n\n```c\nValue intToVal(int i){\n  return INT_VAL(i);\n\
  }\nValue doubleToVal(double d){\n  return DOUBLE_VAL(d);\n}\nValue boolToVal(bool\
  \ b){\n  return BOOL_VAL(b);\n}\nValue nilVal(){\n  return NIL_VAl;\n}\n```\n\n\
  当项目的 C 部分完成后，我们需要开始查看项目的 Rust 部分，这从使用构建脚本（build script）生成 C 绑定开始。在项目的根目录下创建一个文件\
  \ `build.rs`，并在文件顶部添加以下导入：\n\n```rust\nuse cc::Build;\nuse bindgen::Builder;\nuse\
  \ std::path::PathBuf;\n```\n\n在我们的构建脚本中，我们需要首先使用来自 `cc` crate 的 `Build` 类型编译一个共享库。我们将使用\
  \ `new()` 方法创建一个新的 `Build` 类型。为了添加我们的 C 源文件，我们将链式调用 `files()` 方法定义一个包含两个路径 `C/value.c`\
  \ 和 `C/memory.c` 的数组。接下来，我们需要定义头文件的目录，并将路径 `C/includes` 链式调用 `include()` 方法，之后通过\
  \ `compile()` 方法结束链并编译 `value_array.so`：\n\n```rust\nfn main() {\n  Build::new()\n\
  \    .files([\"C/value.c\", \"C/memory.c\"])\n    .include(\"C/includes\")\n   \
  \ .compile(\"value_array.so\");\n}\n```\n\n现在我们已经有了共享库，可以开始生成绑定了。我们唯一关心的头文件是 `C/includes/value.h`。为了从\
  \ `bindgen` 创建新的 `Bindings` 类型，我们将使用 `Builder::default()` 创建一个默认的 `Builder` 类型，然后使用之前的路径链式调用\
  \ `header()` 方法。获取头文件后，我们可以通过链式调用 `generate()` 方法生成绑定：\n\n```rust\nlet bindings\
  \ = Builder::default()\n  .header(\"C/includes/value.h\")\n  .generate()\n  .unwrap();\n\
  \nlet out_path = PathBuf::from(std::env::var(\"OUT_DIR\").unwrap());\nbindings.write_to(out_path.join(\"\
  bindings.h\")).unwrap();\n```\n\n\n\n\n在此之后，我们将做的很多操作都是不安全的，因此我们将创建一个 `unsafe` 块。在块内部，我们首先需要创建一个可变绑定\
  \ `va`，它将使用 `initArray()` 函数创建一个新的 `ValueArray`。但我们的函数需要 `*mut ValueArray`，所以我们将创建一个新的绑定\
  \ `value_array`，它将以 `*mut ValueArray` 类型可变借用 `va`：\n\n```\nunsafe {\nlet mut va\
  \ = initArray();\nlet value_array = &mut va as *mut ValueArray;\n```\n\n为了让我们的 repl\
  \ 环境运行到我们收到 `exit` 命令，我们需要使用 `loop` 语句。这将使我们的 `loop` 无限运行，直到用户退出程序。我们将使用 `readline()`\
  \ 方法读取行，并将提示符设为 `>>`：\n\n```\nloop {\nlet readline = rl.readline(\">> \");\n```\n\
  \n`readline()` 方法返回一个 `Result`，我们将使用 `match` 语句来处理它；要么是一个 `Ok(line)`（我们稍后会处理），或者是一个\
  \ `Err`（我们将表示没有输入）：\n\n```\nmatch readline {\nOk(line) => {\n// TODO Next\n}\nErr(_)\
  \ => println!(\"No input\")\n}\n}\n```\n\n为了处理 `line`，我们将使用 `if/else` 语句来处理 3 种不同的命令。我们需要处理的第一个命令是用户向我们的数组输入一个新的\
  \ `Value`。为了检查用户是否正尝试这样做，我们将使用 `contains()` 方法来检查字符串是否包含冒号，如果是，我们就可以向数组写入数据。当我们使用\
  \ `writeArray()` 函数时，我们需要使用绑定 `value_array` 并通过克隆 `line` 使用 `get_value()` 函数，在完成之后，我们可以告诉用户条目已添加：\n\
  \n```\nif line.contains(\":\") {\nwriteArray(value_array, get_value(line.clone()));\n\
  println!(\"Entry added!\");\n}\n```\n\n我们需要处理的下一个命令是 `print`。这很简单，我们将使用 `else if`\
  \ 语句来检查 `line` 是否等于字符串 \"print\"，如果是，我们将结合 `value_array` 使用 `printValues()` 函数：\n\
  \n```\nelse if &line == \"print\" {\nprintValues(value_array);\n}\n```\n\n如果用户想退出程序，他们需要使用\
  \ `exit` 命令。这只需要跳出我们的循环，我们将向用户打印 bye 并退出循环。如果用户没有输入我们的任何命令，我们将告诉他们命令无效：\n\n```\n\
  else if &line == \"exit\" {\nprintln!(\"Bye!!!\");\nbreak;\n} else {\nprintln!(\"\
  Command invalid\");\n}\n```\n\n在循环结束后，我们可以使用 `drop()` 函数释放 `value_array`，并且在 `unsafe`\
  \ 块之后，我们可以返回 `Ok(())`，因为我们的 `main()` 函数返回一个 `Result`：\n\n```\ndrop(value_array);\n\
  }\nOk(())\n}\n```\n\n当程序完成后，我们可以运行程序并尝试我们的 repl 环境：\n\n```\n$ cargo run\n>> int:87\n\
  Entry added!\n>> double:65.9\nEntry added!\n>> bool:true\nEntry added!\n>> int:76\n\
  Entry added!\n>> print\n87\n65.9\ntrue\n76\n>> exit\nBye!!!\n```\n\n# 第 9 章\n\n\
  ## 元编程\n\n### 引言\n\n元编程是指读取程序、操纵程序并返回修改后的程序的行为。关于此的另一种思考方式是编写生成代码的程序，在 C 或 Rust\
  \ 等编译型语言中，这是在编译期间完成的而动态语言可能在运行时完成。\n\n在 C/C++ 中，元编程通过使用带有 `#define` 的宏或使用更安全的编译时函数\
  \ `constexpr` 实现；而在 Rust 中，情况就有点不同了。在 Rust 中，元编程是一个我们从本书开始就一直在使用的关键特性，无论是像简单的使用\
  \ `println!()` 打印，还是使用 `vec![]` 将元素存储在 `vector` 中。但我们也见过其他类型的宏，例如 `#[derive(Clone)]`\
  \ 或属性如 `#[structopt(short, long)]`。这些所有不同类型的宏究竟是什么？\n\n在 Rust 中，我们可以将宏归类如下：\n\n\
  * 声明式宏 (Declarative macros)\n    * 用于通用元编程\n    * 使用 `macro!` 创建\n* 过程式宏 (Procedural\
  \ macros)\n    * 用于高级元编程\n    * 使用 `proc_macro` 创建\n* 属性宏 (Attribute macros)\n \
  \   * 用于标记项\n    * 使用 `#[attribute]` 创建\n\n\n\n\n假设我们需要交换两个绑定 `a` 和 `b` 的值。解决方案很简单：我们可变地使用\
  \ `a` 和 `b`，使用一个临时绑定 `temp` 来存储 `a` 的值，将 `a` 赋值给 `b`，再将 `b` 赋值给 `temp`。这可以通过下面的宏看到：\n\
  \n```rust\nmacro_rules! switch {\n    ($a: expr, $b: expr) => ({\n        let temp\
  \ = $a;\n        $a = $b;\n        $b = temp;\n    });\n}\n```\n\n但这个问题也可以在泛型函数中轻松解决，从而消除了对声明式宏复杂性的需求：\n\
  \n```rust\nfn switch<T>(a: &mut T, b: &mut T){\n    let temp = a;\n    a = b;\n\
  \    b = temp;\n}\n```\n\n现在我们已经了解了何时以及何时不使用宏，可以开始学习用于 Rust 通用元编程的声明式宏了。\n\n###\
  \ 声明式宏\n\n声明式宏（Declarative macros）例如用于通用元编程。一个声明式宏可以被描述为具有类似于函数的语法，并使用 Rust 标记类型作为参数。这听起来可能与\
  \ C++ 中的 `constexpr` 函数相似，尽管它们在编译期间看起来像一个函数，但函数内部的代码会被展开。考虑下面这个将角度转换为弧弧的 C++ 程序：\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nconstexpr double PI = 3.14159;\n\
  constexpr double ConvertDegreeToRadian(const double &dDegree)\n{\n    return (dDegree\
  \ * (PI / 180));\n}\nint main() {\n    double dAngleInRadian = ConvertDegreeToRadian(90.0);\n\
  \    cout << \"Angle in radian: \" << dAngleInRadian;\n    return 0;\n}\n```\n\n\
  在编译期间，并没有一个名为 `ConvertDegreeToRadian()` 的函数；相反，表达式会被展开，可以认为看起来如下：\n\n```cpp\nint\
  \ main() {\n    double dAngleInRadian = {(90.0) * (3.14159/180)};\n    cout << \"\
  Angle in radian: \" << dAngleInRadian;\n    return 0;\n}\n```\n\n使用 `constexpr`\
  \ 的优势在于它可以帮助程序运行更快，并且总体内存更内存。与使用预处理器 `#define` 相比，使用 `constexpr` 是一种更安全的元编程方法，但两者都有助于减少对函数调用的需求，并有助于保持代码不重复（DRY）。`constexpr`\
  \ 像函数一样工作并在编译期间展开的想法，正是 Rust 声明式宏的工作原理。然而，我们不会使用 `const` 表达式，而是将使用 Rust 标记类型作为参数，以帮助更好地利用\
  \ Rust 的语法。\n\n在开始编写声明式宏之前，我们应该先看看不同的标记类型：\n\n*   `block`：这是封装在闭包内部的语句序列。\n    *\
  \   例如：`{ let foo = 5; println!(\"{foo}”); }`\n*   `expr`：匹配任何 Rust 表达式。\n    *\
  \   例如：`if foo == bar { println!(\"Cool”) } else { println!(\"Not cool”) }`\n* \
  \  `ident`：匹配任何标识符，它可以可以是任何不是 Rust 关键字的名称。\n    *   例如：`foo`, `long_identifier`\n\
  *   `item`：匹配任何模块级的内容，如导入、类型声明、函数等。\n    *   例如：`use std::sync::Arc; fn something()\
  \ { println!(\"something”) }`\n*   `meta`：匹配属性内部的参数。\n    *   例如 meta：`foo = Rust:\
  \ #[foo]`\n*   `pat`：匹配 Rust 中的任何模式。\n    *   例如：`Some(a), _`\n*   `path`：匹配 Rust\
  \ 中的任何路径，这意味着任何包含命名空间的名称。\n    *   例如：`std::fs::File`\n*   `stmt`：匹配 Rust 中的语句。\n\
  \    *   例如：`let x = 1; if x == 1 { println!(\"yay”) }`\n*   `tt`：代表标记树（Token Tree），它将匹配\
  \ Rust 中的标记标记序列。\n    *   例如：`{ if x == 1 { // do something } else { // something\
  \ else } }`\n\n### 创建声明式宏\n\n当我们开始创建声明式宏时，从使用 `macro_rules!` 开始，后面跟着一个宏的标识符。之后，我们创建一个块，使用它来通过积分变量（带有分隔符\
  \ `$` 前缀的变量）和标记类型来匹配模式。这是通过在括号 `( )` 内部放置参数实现的，后面跟着一个匹配分支 `=>` 以及三种分隔符之一：\n\n* \
  \  `{ }` 大括号\n*   `( )` 小括号\n*   `[]` 方括号\n\n默认情况下，宏是私有的；要让宏变为公有的，我们使用 `#[macro_export]`\
  \ 属性。\n\n如果我们想创建一个接受两个参数并返回它们的和的宏，它看起来像这样：\n\n```rust\n#[macro_export]\nmacro_rules!\
  \ add {\n    ($a:expr, $b: expr) => {\n        $a + $b\n    };\n}\n```\n\n然后我们可以这样使用这个宏：\n\
  \n```rust\nfn main() {\n    let result = add!(5, 10);\n    println!(\"The sum is\
  \ {}\", result);\n}\n```\n\n### 宏中的重复\n\n声明式宏还支持使用 `*` 运算符进行重复。这允许我们匹配标记序列。例如，我们可以创建一个计算数字列表和的宏：\n\
  \n```rust\nmacro_rules! sum {\n    ($($x:expr),*) => {\n        let mut total =\
  \ 0;\n        $(\n            total += $x;\n        )*\n        total\n    };\n\
  }\n```\n\n然后我们可以这样使用这个宏：\n\n```rust\nfn main() {\n    let result = sum!(1, 2, 3,\
  \ 4, 5);\n    println!(\"The sum is {}\", result);\n}\n```\n\n声明式宏的威力在于它们能够根据输入模式生成代码，从而显著减少了样板代码并使代码更具表现力。\n\
  \n\n\n\n我们可以运行并编译程序，并将看到它返回了一个 `HashMap`，其中确实包含了我们使用匹配分支出插入的所有键和值：\n\n```\n{\"john\"\
  : 67, \"kyle\": 56, \"alice\": 87}\n```\n\n具备了创建用于通用元编程的声明式宏的能力，我们现在可以进入过程宏了。与声明式宏不同，过程宏有几种不同的类型。\n\
  \n## 过程宏\n\n过程宏与声明式宏不同，它用于操作和使用 Rust 的语法来从宏生成新的 Rust 代码。在创建过程宏时，无论你尝试开发哪种宏，要求都是相同的。这涉及更改\
  \ `Cargo.toml` 中 `[lib]` 下的 `proc-macro` 字段，并使用以下两个 crate：\n\n* `syn`\n* `quote`\n\
  \n`syn` crate 是一个用于解析 Rust 源代码语法树中 Rust 标记流的库。这允许我们执行此类操作：例如，当我们创建一个派生宏（derive macro）时，我们需要解析一个\
  \ `struct` 或 `enum`。我们可以提取并收集 `struct`/`enum` 的标识符、字段的标识符以及它们的类型。通过提取和收集不同的 Rust\
  \ 语法和标记的能力，我们可以有效地创建我们认为必要的发生的情况。\n\n有了这些不同的标记，我们如何使用 Rust 代码进行生成呢？这正是 `quote` crate\
  \ 发挥用场的地方。`quote` crate 带有一个实用的宏 `quote!`，它可以帮助我们使用从 `syn` 解析出的不同标记，并将它们插值到块内部的\
  \ Rust 代码中。\n\n三种不同的过程宏是什么？你可能在本书的其他地方不经意间见过它们，但在这里它们如下：\n\n* 派生宏 (Derive macros)\n\
  \    * 在下方的 `struct` 或 `enum` 上实现一个 trait\n    * 例如：`#[derive(Debug)]`\n* 属性宏 (Attribute\
  \ macros)\n    * 定义可以应用到 `items` 的外部属性\n    * 例如：`#[get(\"/\")]`\n* 函数类宏 (Function-like\
  \ macros)\n    * 行为像函数，但输入是一个 `TokenStream`，并使用宏调用运算符 (!) 进行调用。\n    * 例如：`sql!(SELECT\
  \ * FROM table);`\n\n在我们的整个示例中，我们将使用工具 `cargo-expand` 来查看宏在展开后的样子。要使用此工具，我们需要使用\
  \ Rust 编译器的 nightly 版本工具链：\n\n```bash\n$ rustup override set nightly\n```\n\n```bash\n\
  # 若要返回 stable 版本，将 nightly 替换为 stable\n```\n\n```bash\n$ cargo install cargo-expand\n\
  ```\n\n为了在随后的子章节中以展开的形式检查每种类型的宏，我们将创建一个简单的库，以便能够使用 `cargo-expand` 工具：\n\n```bash\n\
  $ cargo new --lib macros_expanded\n```\n\n### 派生宏\n\n过程宏最常用的形式是派生宏。我们在每个项目中都会使用它来为定义的\
  \ `structs` 或 `enums` 实现必要的 trait。在开始创建自己的宏之前，让我们来看一个它们在展开形式下如何工作的示例。在 `macros_expanded/src/lib.rs`\
  \ 中，添加以下派生了 `Debug` trait 的 `struct`：\n\n```rust\n#[derive(Debug)]\nstruct Foo{\n\
  \    bar: String,\n    baz: u8,\n    laz: Vec<i8>\n}\n```\n\n如果我们进入项目并运行 `cargo\
  \ expand`，我们将看到以下输出：\n\n```bash\n$ cd macros_expanded\n$ cargo expand\n```\n\n```rust\n\
  #![feature(prelude_import)]\n#[prelude_import]\nuse std::prelude::rust_2021::*;\n\
  #[macro_use]\nextern crate std;\nstruct Foo {\n    bar: String,\n    baz: u8,\n\
  \    laz: Vec<i8>,\n}\n#[automatically_derived]\n#[allow(unused_qualifications)]\n\
  impl ::core::fmt::Debug for Foo {\n    fn fmt(&self, f: &mut ::core::fmt::Formatter)\
  \ -> ::core::fmt::Result {\n        match *self {\n            Foo { bar: ref __self_0_0,\
  \ baz: ref __self_0_1, laz: ref __self_0_2 } => {\n                let debug_trait_builder\
  \ = &mut ::core::fmt::Formatter::debug_struct(\n                    f,\n       \
  \             \"Foo\",\n                );\n                let _ = ::core::fmt::DebugStruct::field(\n\
  \                    debug_trait_builder,\n                    \"bar\",\n      \
  \              &&(*__self_0_0),\n                );\n                let _ = ::core::fmt::DebugStruct::field(\n\
  \                    debug_trait_builder,\n                    \"baz\",\n      \
  \              &&(*__self_0_1),\n                );\n                let _ = ::core::fmt::DebugStruct::field(\n\
  \                    debug_trait_builder,\n                    \"laz\",\n      \
  \              &&(*__self_0_2),\n                );\n            }\n        }\n\
  \    }\n}\n```\n\n最简单的步骤是在 `info/src/lib.rs` 中创建 trait `Info`，我们会在 trait 内部有一个方法：\n\
  \n```rust\npub trait Info {\n    fn info(&self) -> String;\n}\n```\n\n由于我们的库 `info_derive`\
  \ 的 `proc-macro` 字段被设置为 `true`，我们可以使用 `proc_macro` 库来创建过程宏。在 `info_derive/src/lib.rs`\
  \ 中，我们将添加以下依赖项：\n\n```rust\nextern crate proc_macro;\nuse proc_macro::TokenStream;\n\
  use quote::quote;\nuse syn::{parse_macro_input, Data, DeriveInput, Fields};\n```\n\
  \n为了创建一个在派生 `Info` trait 时被调用的函数，我们需要使用属性宏 `#[proc_macro_derive(Info)]` 来定义下面将被调用的函数。我们将编写的函数\
  \ `info_derive()`，它接受一个 `TokenStream` 作为输入并返回 `TokenStream`：\n\n```rust\n#[proc_macro_derive(Info)]\n\
  pub fn info_derive(input: TokenStream) -> TokenStream {\n    let mut insert_tokens=\
  \ Vec::new();\n    let parsed_input: DeriveInput = parse_macro_input!(input);\n\
  \    let identifier = parsed_input.ident;\n}\n```\n\n\n\n既然我们已经有了可用标识符，现在是向 `insert_tokens`\
  \ 中推入新 token 的完美时机。我们希望让标识符成为键 `struct` 下的值；我们将需要使用 `quote!` 宏将插入我们的键和值的语句转换为一个绑定的\
  \ `map`。为了将标识符转换为字符串，我们将使用 `stringify!()` 宏将 `identifier` 放入 `quote!` 块中，并通过在它前面加上\
  \ `#` 来对其进行插值处理：\n\n```rust\ninsert_tokens.push(\n    quote!{\n        map.insert(\n\
  \            \"struct\".to_string(),\n            stringify!(#identifier).to_string()\n\
  \        );\n    }\n);\n```\n\n为了简单起见，我们的 trait `Info` 仅支持 `struct`，而 `enum` 和 `union`\
  \ 将不会被实现并会导致 panic（崩溃）。为了检查我们正在为哪种数据实现，我们将在 `parsed_input.data` 上使用 `match` 语句，其中我们将处理\
  \ `Data::Struct(s)` 和 `other` 情况：\n\n```rust\nmatch parsed_input.data{\n    Data::Struct(s)\
  \ => {}\n    other => panic!(\"Info is not yet implemented for {:?}\", other)\n\
  }\n```\n\n在我们将 `DataStruct` 赋值给绑定 `s` 的分支中，我们将使用 `if let` 语句，只要 `s.fields` 被封装在\
  \ `Fields::Named()` 中，就将绑定 `named_fields` 赋值给它：\n\n```rust\nif let Fields::Named(named_fields)\
  \ = s.fields{\n```\n\n为了从 `named_fields` 中获取字段，我们将 `named_fields.named` 赋值给绑定 `punc`，之后，我们将使用一个\
  \ `for` 循环来遍历 `punc` 中的每个 `field`：\n\n```rust\nlet punc = named_fields.named;\n\
  for field in punc{\n```\n\n对于每个字段，我们需要它的标识符和数据类型，并创建一个将此信息插入 `map` 的 token。为了获取标识符，我们将绑定\
  \ `field` 的 `ident` 字段赋值给 `ident`，并且由于它返回的是一个 `Option`，我们将使用 `unwrap()`。为了获取数据类型，我们将绑定\
  \ `field` 的 `ty` 字段赋值给 `field_type`。\n\n在获取标识符和字段数据类型后，我们将创建一个使用 `quote!` 宏的绑定 `insert_token`。在\
  \ `quote!` 宏的块内部，我们将使用 `map.insert()` 将标识符作为键并将数据类型作为值（使用 `stringify!()` 配合 `to_string()`\
  \ 方法转换为字符串）。通过绑定 `insert_token`，我们可以将其推入我们的向量 `insert_tokens`：\n\n```rust\nlet ident\
  \ = field.ident.unwrap();\nlet field_type = field.ty;\nlet insert_token = quote!{\n\
  \    map.insert(\n        stringify!(#ident).to_string(),\n        stringify!(#field_type).to_string()\n\
  \    );\n};\ninsert_tokens.push(insert_token)\n}\n}\n```\n\n现在我们已经拥有了所需的信息，可以开始着手为\
  \ `struct` 实现 `Info` trait 的最终形式工作了。我们将创建绑定 `tokens` 并使用 `quote!` 宏来创建我们所需的 `TokenStream`。这从从\
  \ `std::collections` 导入 `HashMap` 以及从 `info` 导入 `Info` trait 开始。在导入时，由于我们想要确保宏在许多上下文中工作，我们将使用绝对路径，即在\
  \ `use` 路径前加上分隔符运算符 `(::)`：\n\n```rust\nlet tokens = quote!{\n    use ::std::collections::HashMap;\n\
  \    use ::info::Info;\n```\n\n为了为我们的派生结构实现 trait `Info`，我们需要将绑定 `identifier` 插值到我们的\
  \ `quote!` 块中。这再次通过在它前面加上 `#` 运算符来实现：\n\n```rust\nimpl Info for #identifier{\n \
  \   fn info(&self) -> String{\n```\n\n我们需要创建一个绑定 `map`，它将包含所有 token 的 `String` 版本，并将创建一个绑定\
  \ `info_parts`，它将包含所有不同的格式化字符串，这些字符串最后将被合并并返回：\n\n```rust\nlet mut map = HashMap::new();\n\
  let mut info_parts = Vec::new();\n```\n\n为了反复将我们的 token 插入 `map` 中，我们将对我们的绑定 `insert_tokens`\
  \ 使用 `#()*` 语法。这将访问每个内部元素并运行它们的 token，其中第一个会在键 `struct` 下进入我们的标识符，其他字段的标识符及其类型也是如此：\n\
  \n```rust\n#(#insert_tokens)*\n```\n\n现在键和值已经插入到 `map` 中，我们可以使用键 `struct` 通过 `remove()`\
  \ 方法获取结构体的名称。之后，我们将通过以 `Name: foo` 的格式格式化名称插入 `info_parts` 中：\n\n```rust\nlet name\
  \ = map.remove(\"struct\");\ninfo_parts.push(format!(\"Name: {}\", name));\n```\n\
  \n现在我们知道 `map` 只包含字段的标识符及其类型，我们可以使用 `for` 循环通过元组 `(k, v)` 遍历 map，其中它们分别是键和值：\n\n\
  ```rust\nfor (k, v) in &map{\n    let s = format!(\"\\t - {}\", k, v);\n    info_parts.push(s);\n\
  }\n```\n\n我们可以使用 `join` 方法在 `info_parts` 中使用换行符来获取 `TokenStream`，在我们开始为 `struct`\
  \ 实现 `Info` trait 的最终形式工作之前。这将返回最终的结果：\n\n```rust\ninfo_parts.join(\"\\n\")\n```\n\
  \n\n\n在 Rust 中，有以下两种属性宏：\n\n-   **内部属性（Inner Attribute）**: `![# attribute ]`\n \
  \   -   应用于属性声明所在的项内。\n-   **外部属性（Outer Attribute）**: `#[ attribute ]`\n    -  \
  \ 应用于属性之后的项。\n\n现在我们已经了内部和外部属性宏，可以讨论属性的分类分类：\n\n-   **内置属性（Built-in attributes）**\n\
  \    -   这些用于条件编译、测试、派生。\n    -   例如，`#[test]`，`#[derive()]`，`#[cfg()]`。\n    -\
  \   [内置属性](https://doc.rust-lang.org/reference/attributes.html#built-in-attributes-index)\n\
  \n-   **宏属性（Macro attributes）**\n    -   标准的属性宏。\n    -   例如，`#[get(\"\")]`。\n\n\
  -   **派生宏辅助属性（Derive macro helper attributes）**\n    -   附加在派生宏上的属性。\n    -   例如，`#[structopt()]`。\n\
  \n-   **工具属性（Tool attributes）**\n    -   用于外部工具（如 `rustfmt`）的属性。\n    -   例如，`#[rustfmt::skip]`。\n\
  \n许多 Rust 类型都接受属性宏，但我们必须确保了解它们接受什么类型。某些只接受外部属性，而另一些可能两者都接受。这些规则在 Rust 参考文档中都有说明，可以在此处找到：[https://doc.rust-lang.org/reference/attributes.html]。\n\
  \n-   所有 `item` 类型都接受外部属性。\n    -   `extern` 块、函数、实现和模块接受内部属性。\n-   Rust 中的大多数语句都接受外部属性。\n\
  -   块表达式（Block expressions）在满足以下条件下接受内部和外部属性：\n    -   它们是表达式语句的外部表达式。\n    -  \
  \ 是另一个块表达式的最后一个表达式。\n-   `enum` 变体以及 `struct` 和 `union` 字段接受外部属性。\n-   `match` 表达式分支（`foo\
  \ => bar`）接受外部属性。\n-   泛型生命周期或类型参数（`<’a, T>`）**接受外部属性。\n-   函数、闭包和函数指针参数接受外部属性。\n\
  \n既然我们理解了属性宏的不同种类、分类和规则，让我们尝试创建一些自己的属性宏。我们项目的目标是创建一个 `item_info` 属性，它在放在函数下方会提供以下信息：\n\
  \n-   `item_info` 中的属性。\n-   `item_info` 之后的项。\n-   函数的签名（`fn foo -> bar`）。\n- \
  \  函数的块（`{ bar }`）。\n\n我们将创建一个新项目 `attr_demos`，并在二进制项目中为我们的过程宏创建一个库：\n\n```bash\n\
  $ cargo new attr_demos\n$ cd attr_demos\n$ cargo new --lib attr_macros\n```\n\n\
  我们需要在包的 `Cargo.toml` 中进行以下更改：\n\n```toml\n# attr_demos/Cargo.toml\n[dependencies]\n\
  attr_macros = {path = \"attr_macros\"}\n```\n\n```toml\n# attr_demos/attr_macros/Cargo.toml\n\
  [lib]\nproc-macro = true\n\n[dependencies]\nquote = \"1.0.21\"\nsyn = {version =\
  \ \"1.0.103\", features = [\"full\"]}\n```\n\n我们将首先在 `attr_macros/src/lib.rs` 中编写属性\
  \ `item_info`，首先，在文件顶部添加以下导入：\n\n```rust\nextern crate proc_macro;\nuse proc_macro::TokenStream;\n\
  use quote::{quote, ToTokens};\nuse syn::{ItemFn, parse_macro_input};\n```\n\n为了创建一个属性，我们需要将属性\
  \ `#[proc_macro_attribute]` 放在函数 `item_info` 之上。我们需要两个均为 `TokenStream` 的参数 `attr`\
  \ 和 `item`，并且返回 `TokenStream`：\n\n```rust\n#[proc_macro_attribute]\npub fn item_info(attr:\
  \ TokenStream, item: TokenStream) -> TokenStream{\n```\n\n我们可以做的简单事情是打印我们的属性和项，通过对\
  \ `attr` 和 `item` 使用 `to_string()` 方法实现的：\n\n```rust\n// 打印属性和项\nprintln!(\"attribute:\
  \ {}\", attr.to_string());\nprintln!(\"item: {}\", item.to_string());\n```\n\n我们的属性仅用于函数，因此为了获取函数的内部签名和块，我们需要使用\
  \ `parse_macro_input!` 宏将 `item` 解析为 `ItemFn`：\n\n```rust\nlet item = parse_macro_input!(item\
  \ as ItemFn);\n```\n\n为了获取函数的签名，我们需要访问绑定项的 `sig` 字段；由于方法 `into_token_stream()` 获取了值的所有权，我们将克隆\
  \ `sig`。\n\n```rust\nlet sig = item.sig.clone();\nlet block = item.block.clone();\n\
  ```\n\n然后我们将使用 `quote!` 来构建新项：\n\n```rust\nlet expanded = quote! {\n    #sig\n \
  \   #block\n};\nexpanded.into()\n```\n\n\n\n我们本质上使用两次 `cfg` 是因为我们只希望函数在目标是我们的操作系统时才编译。虽然我们的示例非常简单，但在复杂的程序，这可能涉及使用仅支持特定操作系统的原始绑定（raw\
  \ bindings）。这不是 `cfg` 属性的唯一用法；所有的用法可以在 [`doc.rust-lang.org/reference/conditional_compilation.html`](https://doc.rust-lang.org/reference/conditional-compilation.html)\
  \ 找到。\n\n如果你使用的是原生 Linux 操作系统（POP_OS!），你将得到结果！\n\n```\nI am Linux\n```\n\n我们将讨论的下一个属性是测试\
  \ `test` 属性，这是我们之前在 `tests` 模块内部用过的东西。一个简单的测试看起来如下：\n\n```rust\n#[test]\nfn is_it_two()\
  \ {\n    assert_eq!(1+1, 2)\n}\n```\n\n但是，如果你有一个还没有准备就的测试怎么办？假设你仍在开发运行该测试所需的模块。我们不希望在准备就绪后删除所有内容并最终不得不重写一切，或者注释掉它们太难看了，因此我们可以改用\
  \ `ignore` 属性：\n\n```rust\n#[test]\n#[ignore = \"this test isn't implemented yet\"\
  ]\nfn not_ready(){\n    // …\n}\n```\n\n**注意：`rustc` 测试框架支持 `--include-ignored`\
  \ 标志来运行被忽略的测试。有时，我们想看看测试是否会发生 panic，为了做到，我们可以使用 `should_panic` 属性，并可选地接受一个必须出现在\
  \ panic 消息中的字符串。如果未找到字符串，测试将失败，我们可以在下面创建一个应该 panic 的测试：**\n\n```rust\n#[test]\n\
  #[should_panic = \"19 and 21 are not the same\"]\nfn they_arent_equal(){\n    assert_eq!(19,\
  \ 21, \"19 and 21 are not the same\")\n}\n```\n\n如果我们在 `assert_eq!()` 内部没有消息，测试将会失败。我们只看到了一部分\
  \ Rust 诊断属性；这将是在使用 C 绑定时使用的 `allow` 属性。以下属性会更改默认的 lint 级别：`allow`、`warn` 和 `forbid`。\n\
  \n对于任何 lint 检查，我们可以如下层描述每个级别：\n- `allow()`: 覆盖检查，其违规行为将不会报告。\n- `warn()`: 警告违规，但程序仍将编译。\n\
  - `deny()`: 在发现违规后返回错误。\n- `forbid()`: 与 `deny` 相同，但 lint 级别不能更改。\n\n在 C/C++ 程序中，你可能使用警告标志\
  \ `-Wall`、`-Wextra`、`-Werror`、`-Wunused-parameters`；如果程序有未使用的参数，编译将失败。在编译器中为特定需求添加额外或调整\
  \ linters 的能力正是我们计划要做的。\n\n如果我们不想允许程序中使用未使用的变量，我们可以 `deny` 或 `forbid` `unused_variables`，默认情况下，这处于警告级别。考虑以下情况：\n\
  \n```rust\nfn two(a: u32) -> u32 {\n    2\n}\n\nfn main(){\n    let two = two(3);\n\
  \    println!(\"{two}\")\n}\n```\n\n如果我们编译该程序，我们将得到：\n\n```\nwarning: unused variable:\
  \ a\n--> diagnostic.rs:2:8\n|\n2 | fn two(a: u32) -> u32 {\n  ^ help: if this is\
  \ intentional, prefix it with an underscore: _a\n|\n= note: #[unused_variables]\
  \ by default: 1 warning emitted\n```\n\n然而，假设我们想让项目不允许这种情况，而是将警告改为 `deny`，那么可以在程序顶部添加属性\
  \ `#[deny(unused_variables)]`：\n\n```rust\n#[deny(unused_variables)]\nfn two(a:\
  \ u32) -> u32 {\n    2\n}\n\nfn main(){\n    let two = two(3);\n    println!(\"\
  {two}\")\n}\n```\n\n现在，如果我们尝试编译程序，它将失败并显示以下错误：\n\n```\nerror: unused variable: a\n\
  --> diagnostic.rs:2:8\n|\n2 | fn two(a: u32) -> u32 {\n  ^ help: if this is intentional,\
  \ prefix it with an underscore: _a\n|\nnote: the lint level is defined here\n-->\
  \ diagnostic.rs:1:8\n|\n1 | #[deny(unused_variables)]\n  | ^^^^^^^^^^^^^\nerror:\
  \ aborting due to previous error\n```\n\n如果你想检查 `rustc` 支持的所有不同检查，可以使用命令 `rustc\
  \ -W help` 找到它。如果你想嵌套 lint 检查属性，你可以像所示“开启”和“关闭”特定项目的 lint 检查：\n\n```rust\n// 默认情况下\
  \ non-snake-case 是 warn\n// functions should be snaked case\n#[deny(non_snake_case)]\n\
  pub mod foo{\n    // 允许非 snake case\n    #[allow(non_snake_case)]\n    fn functionOne()\
  \ {}\n    // 警告非 snake case\n    #[warn(non_snake_case)]\n    fn functionTwo(){}\n\
  \    // 必须是 snaked case\n    fn function_three(){}\n}\n```\n\n在开发库时可以使用的下一个诊断属性是\
  \ `deprecated` 属性。如果你计划废弃某个项，可以添加 `deprecated` 属性，使其在文档中被标记为已弃。我们将创建一个将在下一个文档主题使用的库。要这样做，请在终端上运行命令\
  \ `cargo new --lib doc_testing`。\n\n在 `doc_testing/src/lib.rs` 内部，我们将创建一个结构体 `System`，并创建两个不同的方法来创建\
  \ `System` 的实例。第一个是被废弃的 `init()`，另一个是更常用的名称 `new()`。在 `deprecated` 属性中，我们可以单独使用它显示一个通用消息，也可以为\
  \ `note` 添加一个值作为自定义消息：\n\n```rust\n//! 一个随机的 System 结构\n#[derive(Debug, Clone)]\n\
  pub struct System{\n    /// 系统的起始消息\n    start_message: String,\n    /// 系统的字节\n\
  \    bytes: Vec<u8>\n}\n\nimpl System{\n    /// 初始化 System\n    #[deprecated(note\
  \ = \"init replaced with System::new()\")]\n    pub fn init(start_message: String,\
  \ bytes: Vec<u8>) -> Self {\n        Self { start_message, bytes }\n    }\n\n  \
  \  /// 创建一个新的 System\n    pub fn new(sm: &str, bytes: &[u8]) -> Self {\n       \
  \ Self { start_message: sm.to_string(), bytes: bytes.to_vec() }\n    }\n}\n```\n\
  \n如果我们运行 `cargo doc --no-deps --open`，可以看到 `System` 的不同方法，并在 `init()` 方法上带有我们的废弃标记，如\
  \ 图 9.1* 所示：\n\n![Figure 9.1](img/Figure-9.1.jpg)\n\n**图 9.1:** impl System 的文档\n\
  \n\n\n\n如果我们运行 `cargo expand`，我们可以看到 `doc` 属性被替换为了文档注释，以及 `Debug` 和 `Clone` Trait\
  \ 的实现：\n\n```rust\n#![feature(prelude_import)]\n#[prelude_import]\nuse std::prelude::rust_2021::*;\n\
  #[macro_use]\nextern crate std;\n///一个随机的结构结构\npub struct System {\n    ///系统的启动消息\n\
  \    start_message: String,\n    ///系统的字节数据\n    bytes: Vec<u8>,\n}\n#[automatically_derived]\n\
  impl ::core::fmt::Debug for System {\n    fn fmt(&self, f: &mut ::core::fmt::Formatter)\
  \ -> ::core::fmt::Result {\n        ::core::fmt::Formatter::debug_struct_field2_finish(\n\
  \            f,\n            \"System\",\n            \"start_message\",\n     \
  \       &&self.start_message,\n            \"bytes\",\n            &&self.bytes,\n\
  \        )\n    }\n}\n#[automatically_derived]\nimpl ::core::clone::Clone for System\
  \ {\n    #[inline]\n    fn clone(&self) -> System {\n        System {\n        \
  \    start_message: ::core::clone::Clone::clone(&self.start_message),\n        \
  \    bytes: ::core::clone::Clone::clone(&self.bytes),\n        }\n    }\n}\nimpl\
  \ System {\n    ///初始化一个新的 System\n    #[deprecated(note = \"init replaced with\
  \ System::new()\")]\n    pub fn init(start_message: String, bytes: Vec<u8>) -> Self\
  \ {\n        Self { start_message, bytes }\n    }\n    ///创建一个新的 System\n    pub\
  \ fn new(sm: &str, bytes: &[u8]) -> Self {\n        Self {\n            start_message:\
  \ sm.to_string(),\n            bytes: bytes.to_vec(),\n        }\n    }\n}\n```\n\
  \n但如果我们想在一个独立的 markdown 文件中编写关于 `System` 结构体的内容以及它的用法，该怎么办？我们可以使用宏 `include_str!()`\
  \ 并配合 markdown 文件的路径将其作为文档包含。\n\n我们将在项目根目录下创建一个单独的 markdown 文件 `system.md`，内容如下：\n\
  \n```markdown\n# System\n这是一个随机的系统结构。\n- `init()` 方法已弃用，请使用 `new()` 方法\n\n## Usage\n\
  ```rust\nlet system = System::new(\"Hello\", &[9, 8, 7]);\n```\n```\n\n如果我们回到 `src/lib.rs`\
  \ 并使用带有路径 `../system.md` 的 `include_str!()` 替换 System 的文档，我们就会得到以下展开后的文档：\n\n```rust\n\
  #[doc = include_str!(\"../system.md\")]\n#[derive(Debug, Clone)]\npub struct System\n\
  …\n```\n\n$ cargo expand\n\n```rust\n/**# System\nThis is a random system structure.\n\
  - The `init()` method is deprecated instead use the `new()` method\n## Usage\n```rust\n\
  let system = System::new(\"Hello\", &[9, 8, 7]);\n```\n*/\npub struct System {\n\
  \    ///start message for the system\n    start_message: String,\n    ///bytes for\
  \ the system\n    bytes: Vec<u8>,\n}\n```\n\n# 函数宏\n\n最后一种过程宏是函数宏。它们与声明式宏的区别在于能够广泛地使用\
  \ Rust 语法。定义自定义语法的能力是非常强大的；我见过这种宏的一种用法是输入其他语言（如 SQL）的原始代码。\n\n我们将尝试创建几个函数宏。首先，让我们创建一个新的\
  \ cargo 项目来运行并创建我们的宏：\n\n### 创建用于运行宏的二进制项目\n\n$ cargo new fnmacros_demos\n\n###\
  \ 进入项目\n\n$ cd fnmacros_demos\n\n# 创建宏库\n\n$ cargo new --lib fnmacros\n\n现在，我们为每个包的\
  \ `Cargo.toml` 添加了以下更改：\n\n# fnmacros_demos/Cargo.toml\n```toml\n[dependencies]\n\
  fnmacros = {path = \"fnmacros\"}\n```\n\n# fnmacros_demos/fnmacros/Cargo.toml\n\
  ```toml\n[lib]\nproc-macro = true\n[dependencies]\nquote = \"1.0.21\"\nsyn = {version\
  \ = \"1.0.103\", features = [\"full\", \"extra-traits\"] }\n```\n\n我们将编写的第一个宏称为\
  \ `three!()`，它将根据给定的调用表达式将函数调用三次。如果我们有如下示例：\n\n```rust\nfn hello(){\n    println!(\"\
  Hello\")\n}\n\nfn main() {\n    three!(hello());\n}\n```\n\n那么，我们期望宏 `three` 在 `main()`\
  \ 函数内部展开如下：\n\n```rust\nfn main() {\n    hello();\n    hello();\n    hello();\n\
  }\n```\n\n为了开始编写宏，我们将前往 `fnmacros/src/lib.rs` 并添加以下内容：\n\n```rust\nextern crate\
  \ proc_macro;\nuse proc_macro::TokenStream;\nuse quote::quote;\nuse syn::{parse_macro_input,\
  \ Expr};\n\n#[proc_macro]\npub fn three(call: TokenStream) -> TokenStream {\n  \
  \  let call = parse_macro_input!(call as Expr);\n    let mut invokes = Vec::new();\n\
  \    for _ in 0..3 {\n        invokes.push(quote! { #call; });\n    }\n    let tokens\
  \ = quote! {\n        #(#invokes)*\n    };\n    TokenStream::from(tokens)\n}\n```\n\
  \n现在我们可以在 `src/main.rs` 中测试之前的示例并检查它是否工作：\n\n```rust\nuse fnmacros::three;\n\nfn\
  \ hello(){\n    println!(\"Hello\")\n}\n\nfn main() {\n    three!(hello());\n}\n\
  ```\n\n$ cargo run\n```\nHello\nHello\nHello\n```\n\n我们将编写的下一个示例将来自 `syn` 仓库的示例目录。我们将编写的宏是\
  \ `lazy_static!`，我认为编写这个宏是观察我们如何解析标记、发射自定义警告以及复杂的函数宏示例的绝佳方法。\n\n我们将它写在当前宏 `three!()\
  \ 之上；编写警告和错误的能力将使用一个不稳定特性 `proc_macro_diagnostic`。我们将在文件顶部添加该特性，并替换当前的导入：\n\n```rust\n\
  #![feature(proc_macro_diagnostic)]\nextern crate proc_macro;\nuse proc_macro::TokenStream;\n\
  use syn::spanned::Spanned;\nuse quote::{quote, quote_spanned};\nuse syn::parse::{Parse,\
  \ ParseStream, Result};\nuse syn::{parse_macro_input, Expr, Ident, Token, Type,\
  \ Visibility};\n```\n\n为了理解 `LazyStatic` 结构体的不同部分，我们将考虑以下懒静态绑定：\n\n```rust\nlazy_static!{\n\
  \    pub static ref NAME: Mutex<Vec<i32>> = Mutex::new(Vec::new());\n}\n```\n\n\
  我们将以更通用的方式重写该语句，并在 `LazyStatic` 中使用它：\n\n```rust\nlazy_static!{\n    #visibility\
  \ static ref #name: #type = #expr;\n}\n```\n\n\n\n\n可见性（visibility）将决定静态绑定是公有的还是私有的（`pub`\
  \ 或否），之后将紧跟关键字 `static` 然后 `ref`。名称指的是该绑定的标识符，之后将紧跟一个冒号来声明我们的数据类型。该数据类型应该是固定大小的（在编译时已知大小），并且可以安全地跨线程传输（实现\
  \ `Sync` 特性）。在数据类型之后，我们是赋值运算符，然后是一个初始化我们值的表达式。最后以一个分号结束。\n\n我们关注的标记（tokens）如下：\n\
  \n*   可见性\n*   名称或标识符\n*   类型\n*   初始化表达式\n\n所有这些标记将保存在 `struct LazyStatic` 中，如下所示：\n\
  \n```rust\nstruct LazyStatic{\n    // 静态绑定的可见性\n    visibility: Visibility,\n  \
  \  // 绑定的标识符\n    name: Ident,\n    // 绑定的数据类型\n    ty: Type,\n    // 绑定的初始化表达式\n\
  \    init: Expr\n}\n```\n\n我们之所以费力去遍历每一个标记，是因为我们需要为 `LazyStatic` 实现 `Parse` 特性，这样我们就可以使用宏\
  \ `parse_macro_input!()` 将 `TokenStream` 转换为 `LazyStatic`：\n\n```rust\n// 允许我们将\
  \ TokenStream 解析为 LazyStatic\nimpl Parse for LazyStatic{\n    fn parse(input: ParseStream)\
  \ -> Result<Self> {\n```\n\n我们需要使用 `parse()` 方法来获取每个 `Token` 值。对于我们关注的标记，我们将它们赋值给一个绑定，与其相应的字段相同。对于每个标记，我们不需要赋值如\
  \ `static`、`ref`、冒号（`:`）、赋值运算符（`=`）和分号（`;`），我们将使用 `turbofish` 运算符来检查标记是否存在（`parse::<Token![token]>`）。\n\
  \n在解析完整个语句后，我们可以返回一个封装在 `Ok()` 中的新 `LazyStatic`，因为该函数返回 `Result`：\n\n```rust\n//\
  \ 解析输入的可见性\nlet visibility = input.parse()?;\n// 解析 static 标记\ninput.parse::<Token![static]>()?;\n\
  // 解析 ref 标记\ninput.parse::<Token![ref]>()?;\n// 解析标识符\nlet name: Ident = input.parse()?;\n\
  // 解析 : 运算符\ninput.parse::<Token![:]>()?;\n// 解析数据类型\nlet ty: Type = input.parse()?;\n\
  // 解析赋值运算符 (=)\ninput.parse::<Token![=]>()?;\n// 解析初始化表达式\nlet init: Expr = input.parse()?;\n\
  // 解析分号\ninput.parse::<Token![;]>()?;\nOk(\n    Self {visibility, name, ty, init\
  \ }\n)\n}\n```\n\n现在为 `LazyStatic` 实现了 `Parse` 特性，我们可以开始编写过程宏 `lazy_static`，它接受一个参数\
  \ `input`，其类型为 `TokenStream` 并返回 `TokenStream`：\n\n```rust\n#[proc_macro]\npub fn\
  \ lazy_static(input: TokenStream) -> TokenStream{\n```\n\n我们将参数 `input` 解析为 `LazyStatic`，其中我们将每个字段都赋值为一个绑定，如下所示：\n\
  \n```rust\nlet LazyStatic{\n    visibility,\n    name,\n    ty,\n    init\n} = parse_macro_input!(input\
  \ as LazyStatic);\n```\n\n我们想要做的第一件事是处理任何类型的警告和错误。在警告方面，如果用户使用泛通用名称（如 `FOO`、`BAR`\
  \ 和 `BAZ`），我们将警告用户选择更好的名称。我们将创建一个包含这些名称的数组，然后遍历每个名称以检查我们的 `name` 是否等于其中某一个：\n\n\
  ```rust\n// 如果绑定的名称过于通用，则创建警告\n// 我们将对以下名称发出警告\nlet generic_names = [\"FOO\", \"\
  BAR\", \"BAZ\"];\nfor n in generic_names{\n    if name == n{\n```\n\n对于标识符，我们首先需要使用\
  \ `span()` 方法获取它的跨度（span），之后是 `unwrap()`。然后，为了选择发出警告，我们将它链式调用 `warning()` 方法并在其中包含消息。我们会说名称过于通用，最后我们可以使用\
  \ `emit()` 方法发出警告：\n\n```rust\nname.span()\n    .unwrap()\n    .warning(\"Name too\
  \ generic\")\n    .emit();\n}\n}\n```\n\n我们需要处理的下一个情况是，用户尝试用空类型 `()`（即空元组 `()`）来初始化绑定。没有理由让人创建一个懒性绑定并用\
  \ `()` 初始化它。因此，如果他们这样做，我们将发出一个错误。\n\n为了做到这一点，我们将使用 `if let` 语句检查元组（`Expr::Tuple()`）是否等于我们的表达式\
  \ `init`。如果是，我们将检查该元组是否为空。（注：文中暗示了检查空元组的逻辑）。\n\n对于我们的静态项，有两个条件：它必须实现 `Sync` 和 `Sized`。因此，我们将包含我们的绑定：`assert_sync`\
  \ 和 `assert_sized`：\n\n```rust\n// 检查类型是否实现了 Sync\nlet assert_sync = quote! {\n\
  \    struct _AssertSync; impl Sync for #ty {}\n};\n// 检查类型是否实现了 Sized\nlet assert_sized\
  \ = quote! {\n    struct _AssertSized; impl Sized for #ty {}\n};\n```\n\n我们需要编写一个\
  \ `TokenStream` 将我们的初始化表达式转换为原始指针。为此，我们将使用 `Box::into_raw()` 内部配合 `Box::new()` 以及我们的初始化表达式。我们将将其存储在绑定\
  \ `init_ptr` 中：\n\n```rust\nlet init_ptr = quote! {\n    Box::into_raw(Box::new(#init))\n\
  };\n```\n\n最后，我们开始编写宏的展开形式 `lazy_static!`。创建的是一个空结构体，使用我们的可见性和绑定的标识符，之后我们将为结构体实现\
  \ `Deref` 特性：\n\n```rust\nlet expanded = quote! {\n    #visibility struct #name;\n\
  \    impl ::std::ops::Deref for #name {\n        type Target = #ty;\n        fn\
  \ deref(&self) -> &#ty {\n            #assert_sync\n            #assert_sized\n\
  \            static ONCE: ::std::sync::Once = ::std::sync::Once::new();\n      \
  \      static mut VALUE: *mut #ty = 0 as *mut #ty;\n            ONCE.call_once(||\
  \ {\n                unsafe {\n                    VALUE = #init_ptr;\n        \
  \        }\n            });\n            unsafe { &*VALUE }\n        }\n    }\n\
  };\n```\n\n\n\n\n我们将要执行的下一个操作是不安全的。首先，我们需要使用来自绑定 `ONCE` 的 `call_once()` 方法，它会将 `VALUE`\
  \ 初始化为我们的绑定 `init_ptr`。之所以在 `unsafe` 块中执行此操作，是因为修改可变静态绑定被认为是不安全的。然后，我们需要解引用 `VALUE`（解引用原始指针也是不安全的）并返回它的引用：\n\
  \n```rust\nunsafe {\n    ONCE.call_once(|| VALUE = #init_ptr);\n    &*VALUE\n}\n\
  ```\n\n创建好宏后，我们就可以开始使用它了，这将在 `src/main.rs` 中完成，并在那里尝试定义三个静态绑定。第一个静态绑定将包含一个没有实现 `Sync`\
  \ 的类型，第二个将包含一个泛型名称，第三个将尝试用一个空元组进行初始化。由于我们的 `lazy_static!` 宏不支持递归，因此每个静态绑定都将在独立的\
  \ `lazy_static!` 块中创建。\n\n我们将之前的示例保留在 `src/main.rs` 中，这样经过我们的修改后，它看起来如下所示：\n\n```rust\n\
  use fnmacros::{three, lazy_static};\n\nlazy_static!{\n    static ref FOO: String\
  \ = String::new();\n}\n\nlazy_static!{\n    static ref NO: *mut u8 = 0 as *mut u8;\n\
  }\n\nlazy_static!{\n    static ref VOID: () = ();\n}\n\nfn hello(){\n    println!(\"\
  Hello\")\n}\n\nfn main() {\n    three!(hello());\n}\n```\n\n如果我们尝试编译程序，将会得到以下错误和警告：\n\
  \n```bash\n$ cargo build\nwarning: Name too generic\n--> src\\main.rs:4:16\n|\n\
  4 |     static ref FOO: String = String::new();\n|                   ^^^\nerror:\
  \ Cannot initialize static values using ()\n--> src\\main.rs:12:27\n|\n12 |    \
  \ static ref VOID: () = ();\n|                                     ^^\nerror[E0277]:\
  \ `*mut u8` cannot be shared between threads safely\n--> src\\main.rs:8:20\n|\n\
  8 |     static ref NO: *mut u8 = 0 as *mut u8;\n|                       ^^^^^^ `*mut\
  \ u8` cannot be shared between threads safely\n|\n= help: the trait `Sync` is not\
  \ implemented for `*mut u8`\n= help: see issue #48214\n= help: add `#![feature(trivial_bounds)]`\
  \ to the crate attributes to enable\n```\n\n你可以看到我们的自定义警告和错误已经成功输出了。现在我们可以尝试通过命令\
  \ `cargo expand` 来查看我们的静态绑定之一 `FOO` 在展开后是什么样子：\n\n```rust\nstruct FOO;\nimpl ::std::ops::Deref\
  \ for FOO {\n    type Target = String;\n    fn deref(&self) -> &String {\n     \
  \   struct _AssertSync\n        where\n            String: ::std::marker::Sync;\n\
  \        struct _AssertSized\n        where\n            String: ::std::marker::Sized;\n\
  \        static ONCE: ::std::sync::Once = ::std::sync::Once::new();\n        static\
  \ mut VALUE: *mut String = 0 as *mut String;\n        unsafe {\n            ONCE.call_once(||\
  \ VALUE = Box::into_raw(Box::new(String::new())));\n            &*VALUE\n      \
  \  }\n    }\n}\n```\n\n### 结论\n\n在本章中，我们学习了 Rust 中两种不同类型的宏，它们允许通用的元编程（声明式宏）和复杂的语法元编程（过程化宏）。在声明式宏中，我们学习了\
  \ Rust 不同的标记类型，如项目项、表达式、标识符等。而在过程化宏中，我们学习了如何解析标记流并以我们认为合适的方式使用它们。\n\n虽然元编程在 Rust\
  \ 中起着重要作用，但我们探索了何时创建以及何时不创建宏，以及如何利用标准库中预构建的属性宏。\n\n### 概要\n\n* 如果函数可以完成与声明式宏相同的任务，建议使用函数来缩短编译时间。\n\
  * 创建过程化宏时，建议查看 `syn` crate 以了解它提供了哪些功能。\n* 始终考虑你希望宏看起来什么样子。\n* 声明式宏使用 `macro_rules!`\
  \ 创建。\n* 过程化宏通过在 `Cargo.toml` 中设置 `proc-macro = true` 来创建。\n* 若要将其公开，请使用 `#[macro_export]`。\n\
  * 函数型：使用 `#[proc_macro]`。\n* 属性型：使用 `#[proc_macro_attribute]`。\n* 派生型：使用 `#[proc_macro_derive]`。\n\
  \n### 练习\n\n1. 创建一个派生宏 `HeapSize`，它将为每个字段实现 `HeapSize` 特性。此练习基于 `syn` 仓库。\n2. 创建一个属性宏\
  \ `trace_var`，它在每次变量被重新赋值时打印其值。此练习基于 `syn` 仓库。\n\n\n\n\n\n我们将开始为 derive 宏 `HeapSize`\
  \ 编写函数，该函数命名为 `derive_heap_size()`，接受一个类型为 `proc_macro::TokenStream` 的参数 `input`\
  \ 并返回 `proc_macro::TokenStream`：\n\n```rust\n#[proc_macro_derive(HeapSize)]\npub\
  \ fn derive_heap_size(input: proc_macro::TokenStream) -> proc_macro::TokenStream{\n\
  ```\n\n通过参数 `input`，我们可以使用宏 `parse_macro_input!()` 将其解析为 `DeriveInput` 并将其赋值给绑定\
  \ `input`。我们可以通过 `input` 中的字段 `ident` 获取数据结构的名称或标识符：\n\n```rust\n// parse the input\
  \ to syntax tree\nlet input = parse_macro_input!(input as DeriveInput);\n// get\
  \ the identifier of the struct\nlet name = input.ident;\n```\n\n接下来，我们需要为数据中的每个泛型边界添加我们的\
  \ trait `heapsize::HeapSize`。为了实现这一点，我们将使用绑定 `input` 中的 `generics` 字段将绑定 `generics`\
  \ 赋值给 `add_trait_bounds()`。该函数 `add_trait_bounds()` 将在此函数之后由我们定义：\n\n```rust\n//\
  \ add HeapSize trait to each of the generic bounds\nlet generics = add_trait_bounds(input.generics);\n\
  ```\n\n接下来，我们需要从绑定 `generics` 中获取 `impl` 泛型语句、类型泛型和 `where` 子句。这是通过使用方法 `split_for_impl()`\
  \ 完成的。在展开并为所派出的任何 `struct` 创建 `impl` 语句时，我们需要使用这些绑定。\n\n```rust\n// get the impl\
  \ generic statement, type generics and where clause\nlet (impl_generics, ty_generics,\
  \ where_clause) = generics.split_for_impl();\n```\n\n我们需要编写的最后一个绑定是 `sum`，它是一个用于求加\
  \ `struct` 中所有字段堆大小的表达式；我们将使用函数 `heap_size_sum()` 并借用 `input.data` 来获取一个 `TokenStream`。函数\
  \ `heap_size_sum()` 将在 `add_trait_bounds()` 之后由我们定义：\n\n```rust\n// get the sum\
  \ of the heap size for each field\nlet sum = heap_size_sum(&input.data);\n```\n\n\
  如果我们在结构体 `SomeValues` 上派生宏 `HeapSize`，我们预期展开后的形式如下：\n\n```rust\n#[derive(HeapSize)]\n\
  struct SomeValues<T, K>{\n    a: K,\n    b: T,\n    c: Box<K>\n}\n// Expanded form:\n\
  struct SomeValues<T, K> {\n    a: K,\n    b: T,\n    c: Box<K>,\n}\nimpl<T: heapsize::HeapSize,\
  \ K: heapsize::HeapSize> heapsize::HeapSize\nfor SomeValues<T, K> {\n    fn heap_size(&self)\
  \ -> usize {\n        0 + heapsize::HeapSize::heap_size(&self.a)\n        + heapsize::HeapSize::heap_size(&self.b)\n\
  \        + heapsize::HeapSize::heap_size(&self.c)\n    }\n}\n```\n\n通过我们展示的展开形式，我们可以使用\
  \ `quote!` 宏创建绑定 `expanded`。我们需要创建一个 `impl` 语句，在 `impl` 关键字之后，紧跟着我们的 `impl_generics`，然后是我们要实现的\
  \ trait，即 `heapsize::HeapSize`。\n\n在 trait 名称之后是 `for` 关键字，然后是我们的绑定 `name`、我们的类型泛型\
  \ `ty_generics`，以及我们的绑定 `where_clause`。在 `impl` 块内部，我们需要定义函数 `heap_size()`，它不可变地使用\
  \ `self` 并返回 `usize`，在函数内部我们将放入 `sum`。在创建绑定 `expanded` 后，我们可以使用函数 `TokenStream::from()`\
  \ 使用绑定 `expanded` 返回一个 `TokenStream`：\n\n```rust\nlet expanded = quote!{\n    impl\
  \ #impl_generics heapsize::HeapSize for #name #ty_generics #where_clause{\n    \
  \    fn heap_size(&self) -> usize{\n            #sum\n        }\n    }\n};\nproc_macro::TokenStream::from(expanded)\n\
  }\n```\n\n我们需要编写的下一个函数是 `add_trait_bounds()`，它可变地使用类型为 `Generics` 的参数 `generics`\
  \ 并返回 `Generics`。该函数的作用是向我们输入中的每个泛型类型添加边界 `T: heapsize::HeapSize`：\n\n```rust\n\
  // add HeapSize trait to each of the generic bounds\nlet generics = add_trait_bounds(input.generics);\n\
  ```\n\n`add_trait_bounds` 函数：\n\n```rust\nfn add_trait_bounds(mut generics: Generics)\
  \ -> Generics {\n    for param in &mut generics.bounds_mut() {\n        param.push_bound(Trait::new(heapsize::HeapSize));\n\
  \    }\n    generics\n}\n```\n\n`heap_size_sum` 函数：\n\n```rust\nfn heap_size_sum(data:\
  \ &Data) -> TokenStream {\n    // generate an expression to sum up the heap size\
  \ of each field\n    quote! {\n        match *data {\n            Data::Struct(ref\
  \ data) => {\n                match data.fields {\n                    Fields::Named(ref\
  \ fields) => {\n                        // Named struct like Normal\n          \
  \          }\n                    Fields::Unnamed(ref fields) => {\n           \
  \             // UnNamed struct like Tuple\n                    }\n            \
  \        Fields::Unit => quote!(0)\n                }\n            }\n         \
  \   Data::Enum(_) | Data::Union(_) => unimplemented!()\n        }\n    }\n}\n```\n\
  \n```\n\n\n\n\n我们需要处理的第一个情况是针对 `Fields::Named`。我们将创建一个绑定 `recurse`，它将是一个 `impl Iterator<Item\
  \ = TokenStream>`。为了实现这一点，我们将将其赋值给 `fields.named`，然后通过 `iter()` 方法对其进行链式，使其成为一个\
  \ `Iterator`。在 `iter()` 方法之后，我们可以使用类型为 `&Field` 的参数 `f` 配合 `map()` 方法进行链式。在块内部，我们将创建一个绑定\
