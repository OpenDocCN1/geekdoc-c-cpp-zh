  quote!(0 #(+ #recurse)*)\n```\n\n在 `heapsize_derive` 中完成所有编写后，我们可以前往 `heapsize/src/lib.rs`\
  \ 开始创建 trait `HeapSize`，并为一些数据类型实现它。首先，在文件顶部添加以下导入和重新导出：\n\n```rust\nuse std::mem;\n\
  pub use heapsize_derive::HeapSize;\n```\n\n`HeapSize` trait 将有一个方法 `heap_size()`，它将不可变地引用\
  \ `self` 并返回 `usize`：\n\n```rust\npub trait HeapSize{\n    fn heap_size(&self) ->\
  \ usize;\n}\n```\n\n现在，我们可以开始为一些数据类型实现该 trait。让我们从原始类型开始，例如 `u8`，正如讨论过的，它不占用空间，因此将返回\
  \ 0：\n\n```rust\nimpl HeapSize for u8{\n    fn heap_size(&self) -> usize {\n   \
  \     0\n    }\n}\n```\n\n我们可以实现的下一个类型是 `String`，它所用的空间等于它的容量：\n\n```rust\nimpl\
