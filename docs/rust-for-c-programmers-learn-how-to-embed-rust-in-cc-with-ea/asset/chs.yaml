  \ 的参数 `local`（表示本地绑定）并返回 `Stmt`（一个语句）：\n\n```rust\nfn let_and_print(&mut self, local:\
  \ Local) -> Stmt{\n```\n\n从我们的参数 `local` 中，我们将从 `Local` 的字段 `pat` 和 `init` 分绑定模式和初始表达式。为了获取内部表达式，我们将使用\
  \ `fold_expr()` 方法，它需要一个通过解包 `init` 并使用元组第二个元素找到的 `Expr`。然而第二个元素是 `Box<Expr>`，因此我们需要解引用它来获取\
  \ `Expr`。\n\n为了从模式中获取标识符，我们将对绑定 `pat` 使用 `match` 语句以便创建绑定 `ident`。该绑定将处理以下两种情况：`Pat::Ident(ref\
  \ p)` 以及其他返回宏 `unreachable!()`。在 `Pat::Ident(ref p)` 的情况下，我们将返回 `p.ident` 的引用，返回模式的标识符：\n\
  \n```rust\nlet Local{pat, init, ..} = local;\nlet init = self.fold_expr(*init.unwrap().1);\n\
  let ident = match pat{\n    Pat::Ident(ref p) => &p.ident,\n    _ => unreachable!()\n\
  };\n```\n\n\n\n\n现在，我们可以回到展开后的形式，如上所示，它是我们的模式赋值给块（block）的 `let` 语句。在块内部，我们将包含一个\
  \ `#[allow(unused_mut)]` 属性，因为我们没有在模式内部使用 `mut`。在属性之后，我们将使用 `let` 语句将我们的模式赋值给初始表达式，之后我们可以使用标识符打印该值，并将其作为值的最终返回值：\n\
  \n```rust\nparse_quote!{\n    let #pat = {\n        #[allow(unused_mut)]\n     \
  \   let #pat = #init;\n        println!(concat!(stringify!(#ident), \" = {:?}\"\
  ), #ident);\n        #ident\n    };\n}\n```\n\n写完这些方法后，接下来写什么呢？嗯，我们一直在使用 `fold_expr()`\
  \ 方法，但它还不存在，所以我们需要修复这个问题。我们将为我们的结构体 `Args` 实现 `Fold` 特性，这样我们就可以编写 `fold_expr()`\
  \ 和 `fold_stmt()` 方法，以便处理对表达式和语句的遍历：\n\n```rust\nimpl Fold for Args{\n    fn fold_expr(&mut\
  \ self, e: Expr) -> Expr {\n        // TODO\n    }\n    fn fold_stmt(&mut self,\
  \ s: Stmt) -> Stmt {\n        // TODO\n    }\n}\n```\n\n我们将处理的第一个函数是 `fold_expr()`。对参数\
  \ `e` 使用 `match` 语句，我们可以检查我们处理的表达式是赋值（`=`）还是赋值运算符（`+=`、`*=` 等）。否则，我们将在 `self` 上使用函数\
