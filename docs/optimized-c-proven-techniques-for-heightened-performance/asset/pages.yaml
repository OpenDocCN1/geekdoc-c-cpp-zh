  md: 'A symmetric multiprocessor executes multiple threads of control with true hardware
    concurrency. If there are $n$ execution units, the total run time of a computer-bound
    program can be reduced by a factor of as much as $1/n$. These hardware threads
    stand in contrast to software threads, discussed later, which may or may not run
    on distinct hardware threads, and thus may or not reduce total time.


    # Simultaneous multithreading


    Some processors are designed so that each hardware has two (or more) registers
    and executes two or more corresponding streams of instructions. One stream stalls
    (for an access to main memory), instructions from the other stream can execute.
    A processor core having this feature acts like two (or more) cores, so that a
    "four-core processor" really can host eight hardware threads. This is important,
    as we will see in "Create as Many Runnable Threads as Cores" on page 308, where
    the most efficient use of software threads matches the number of software threads
    to the number of hardware threads.


    # Multiple processes


    Processes are concurrent streams of execution that have their protected virtual
    memory space. Processes communicate using pipes, queues, network I/O, or some
    other shared mechanism.² Processes synchronize using synchronization primitives
    or by pending on input (that is, blocking until the input becomes available).


    The principal advantage of processes is that the operating system isolates one
    process from another. If one process crashes, the others remain alive, although
    they may have nothing to do.


    The greatest weakness of processes is that they have a lot of state: virtual memory
    tables, multiple execution units, plus the contexts of all suspended threads.
    They are slower to start, stop, and switch between threads.


    C++ doesn''t experience processes directly. Generally, a C++ program is represented
    by an operating system. There are no tools in C++ to manipulate processes because
    not all operating systems even possess a process concept. On small processors,
    programs may be sliced but not protected from one another, so that they act like
    threads.


    # Distributed processing


    Distributed processing is distribution of an activity onto a collection of processes
    that are not necessarily the same, and communicate over links that are


    > ² Some operating systems permit designated blocks of memory to be shared between
    processes. These mechanisms for sharing memory among processes are arcane and
    operating system-dependent, and are not covered here.'
