    The cost is commonly written in "big-O" notation, O(f(n)), where n is some significant
    aspect of the size of the input, and f(n) is a function describing how many of
    some significant operations an algorithm performs to process an input of size
    n. The function f(n) is typically simplified to show only its fastest-growing
    term, because for large values of n, this term dominates the value of f(n).


    Using searching algorithms as an example, if n is the number of items to be searched
    or sorted, f(n) is often the number of comparisons made between two items to the
    items into sorted order.


    Here is a rough guide to the time cost of some common algorithms, and the implications
    of these costs to program run times:


    # O(1), or constant time


    The fastest possible algorithms have constant time cost. That is, they have a
    fixed cost that doesn''t depend on the size of the input at all. A constant-time
    algorithm is the Holy Grail: incredibly valuable if you find it, but you can search
    for your whole life without achieving your quest. Beware, therefore, of strangers
    selling-time algorithms. The constant of proportionality may be very high. That
    is, the cost may be one operation, but it may be hellastically long operation.
    In fact, it may be O(n) in disguise, or worse


    # O(log n)


    The time cost can be less than linear. For instance, a search algorithm that divide
    the input in half at each step O(log, n) time. Algorithms with less linear time
    cost have a cost that increases more slowly than the input. They are efficient
    enough that there is often (but not always) to look for a faster algorithm; the
    code implementing the algorithm simply isn''t hot enough to show up on a profiler''s
    list of expensive functions. Algorithms with O(log, n) time cost can be invoked
    many times in a program''s overall run without fearing of the whole program infeas
    slow. Binary search is a frequently recurring algorithm with O(log, n) time cost.


    # O(n), or linear time


    If an algorithm''s time cost is O(n), the time taken by the algorithm is proportional
    to the size of its input. Such an algorithm is called a linear-time algorithm,
    or just linear. A time cost of O(n) is typical of algorithms that scan their input
    from one end to the other, to find the least or greatest value in a list. A linear-algorithm
