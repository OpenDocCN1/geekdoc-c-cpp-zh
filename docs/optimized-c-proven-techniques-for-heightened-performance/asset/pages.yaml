  md: "# Optimized C++\n\nIn today's fast and competitive world, a program's performance\
    \ is just as important to customers as the features it provides. This practical\
    \ guide teaches developers performance-tuning principles that enable optimization\
    \ in C++. You'll learn how to make code that already embodies best practices of\
    \ C++ run faster and consume fewer resources on any computer—whether's a watch,\
    \ phone, workstation, supercomputer, or globe-spanning network of servers.\n\n\
    > A cornucopia of fruitful advice—timely, anecdotal, and on point. A trusted reference\
    \ for the new face of C++\n—Jerry Tan\nSenior Software Engineer\nThe Depository\
    \ Trust & Clearing Corporation\n\nAuthor Kurt Guntheroth provides several examples\
    \ that demonstrate how to apply these principles incrementally to improve code\
    \ so it meets customer requirements for responsiveness and throughput. advice\
    \ in this book will prove itself the first time you hear a colleague explain,\
    \ \"Wow, that was fast. Who fixed something?\n\n+   * Locate hot spots using the\
    \ profiler and software timers\n* Learn to perform repeatable experiments to measure\
    \ performance changes\n* Optimize use of dynamically allocated variables\n* Improve\
    \ performance of hot loops and functions\n* Speed up string handling functions\n\
    * Recognize efficient algorithms and optimization patterns\n* Learn the strengths—and\
    \ weaknesses—of C++ container classes\n* View searching and sorting through an\
    \ optimizer's eye\n* Make efficient use of C++ streaming I/O functions\n* Use\
    \ C++ thread-based concurrency features effectively\n\nKurt Guntheroth, a software\
    \ developer for over 35 years, has developed heavyduty C++ code for a quarter\
    \ century. He has developed on Windows, Linux, and embedded devices. Kurt lives\
    \ in Seattle, Washington.\n\nPROGRAMMING / C++\nUS $59.99 CAN $68.99\nISBN: 978-1-491-92206-4\n\
    \nTwitter: @oreillymedia\facebook.com/oreilly\n\n![](img/60f8bcb8b0ed0d129f96949a34d3e33e_1_0.png)"
