    # Performance Consequences of Reallocation


    std::vector has a size, which describes how many elements are currently in the
    vector, and a capacity, which describes how big the internal buffer holds its
    elements. When size == capacity, any further insertions trigger an expensive expansion:
    relocating the internal buffer, copying the vector elements to the new storage,
    and invalidating all iterators and references to the old buffer. When reallocation
    becomes necessary, the capacity of the new buffer is set to some multiple of the
    new size. The effect of this is that the cost of insertion is constant in the
    aggregate, though some insertions are expensive while others are not.


    One secret of efficient std::vector use is that capacity can be reserved ahead
    of need by a call to reserve(size_t n), preventing unnecessary allocate-and-copy
    cycles.


