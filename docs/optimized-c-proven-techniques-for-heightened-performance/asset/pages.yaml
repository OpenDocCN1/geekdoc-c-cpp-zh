  md: "The list allocator required a change to the memory manager previously defined.\
    \ The implementation of std::list that comes with Microsoft C++ 2015 allocates\
    \ a special sentinel node that is a different size from the other list nodes.\
    \ It happens to be smaller than a regular list node, so it was possible to make\
    \ a small change to the fixed-block memory manager that allowed it to work. The\
    \ modified version is shown in Example 13-10. The change is instead of testing\
    \ that the current request size is equal to the saved block size, allocate() only\
    \ tests that it is not greater than the saved block size.\n\n# Example 13-10.\
    \ Modified allocate() function\n\n```\ntemplate <class Arena>\ninline void* fixed_block_memory_manager<Arena>\n\
    \    ::allocate(size_t size) {\n    if (empty()) {\n        free_ptr_ = reinterpret_cast<free_block*(\n\
    \            arena_.allocate(size));\n        block_size_ = size;\n        if\
    \ (empty())\n            throw std::bad_alloc();\n        }\n    }\n    if (size\
    \ > block_size_) {\n        throw std::bad_alloc();\n    }\n    auto p = free_ptr;\n\
    \    free_ptr_ = free_ptr_->next;\n    return p;\n}}\n```\n\n# Performance of\
    \ the fixed-block allocator\n\nI wrote a program to test the performance of the\
    \ fixed-block allocator. The program is a loop that repeatedly creates a list\
    \ of 1000 integers, then deletes the list. Using the default allocator, it took\
    \ 76.2 microseconds. The program created and destroyed a list using the block\
    \ allocator in 11.6 microseconds, about 5.6 times faster. This is an impressive\
    \ performance improvement, but it must be regarded with some suspicion. Only the\
    \ creation and destruction of the list benefit from this optimization. Performance\
    \ gains in a program that also processes the list will be far more.\n\nI also\
    \ built a map of 1000 integer keys. Creating and destroying the map using the\
    \ default allocator took 102 microseconds, versus 67.4 microseconds with the block\
    \ allocator. This more modest 110% improvement shows the effect that additional\
    \ activity in the program (in this case, rebalancing the tree in which the map\
    \ is stored) has on the performance improvement achieved by the block allocator."
