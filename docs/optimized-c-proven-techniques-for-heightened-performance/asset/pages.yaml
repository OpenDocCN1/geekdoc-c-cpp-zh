    for ways to optimize their threaded programs. Providing "basic familiarity" with
    thread-level concurrency would be the topic of yet another book.


    # Concurrency Refresher


    Concurrency is the simultaneous (or apparently simultaneous) execution of multiple
    threads of control. The goal of concurrency is not a reduction in the number of
    instructions executed or data words accessed per se. It is rather an increase
    in utilization of computing resources that reduces run time measured on a wall
    clock.


    Concurrency improves performance by merging some program activities to move forward
    while other activities wait for an event to occur or a resource to become available.
    This allows computing resources to be utilized more of the time. The more activities
    wait for events and resources, in a positive feedback loop that increases overall
    utilization of computing and I/O resources up to some saturation point, hopefully
    near 100% utilization. The result is a reduction of wall-clock time versus what
    would happen if each task was performed to completion before the next task started,
    with the computer idling while awaiting events.'
