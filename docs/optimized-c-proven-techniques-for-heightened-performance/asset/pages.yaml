  md: '# Optimization War Story


    I wrote a multithreaded program in which each thread entered a class instance.
    These threads each logged their activities. The logging functions originally defined
    a local temporary string which the log information was formatted. I discovered
    that when there were more than half a dozen threads, each banging at the memory
    manager to create lines of logging information, contention for the memory became
    so great that performance fell precipitously. The solution was to make the temporary
    string each hold a class member that was reused for each logged once. Once the
    string had used a few times, it became long enough that reallocation was never
    required. Replicating this single trick through a large program provided the largest
    performance boost of any I I, allowing the program (a telephone server) to scale
    easily to 10 times as many simultaneous calls.


