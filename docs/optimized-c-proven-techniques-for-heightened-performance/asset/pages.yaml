    # Class-specific operator new() gives fine control of allocation


    The new-expression looks up operator in the scope of the type being created. A
    class can then provide implementations of these operators to get fine control
    over allocation for that class. If a class does not define a class-specific operator
    new(), the global one is used. To use the global operator new() instead of a class-specific
    version, the programmer specifies the global scope operator :: in the new-expression,
    as in


    ```

    Foo* foo_p = new Foo(123);

    ```


    A class-specific operator new() is invoked only to allocate instances of the class
    that defines that function. Member functions of the class that contain new-expressions
    involving other classes use the operator new() defined for that other class, if
    any, or the global operator new() by default.


    A class-specific operator new() can be efficient because it allocates objects
    of a single size. Thus, the first free block is usable. If the class is not used
    in multiple threads, the class-specific operator new() can dispense with the overhead
    of making its internal structures thread-safe.


    The class-specific operator new() is defined to a static member function. This
    makes sense, because operator new() allocates storage for every instance.


    If a class implements a custom operator new(), it must implement a corresponding
    operator delete() or else the global operator delete() called, with undefined
    and usually unwanted results.


    # Delete-Expressions Dispose of Dynamic Variables


    A program returns the memory used by a dynamic variable to the memory manager
    using a delete-expression. The delete-expression handles the last phases of the
    dynamic variable life cycle: destroying and freeing the memory occupied. The delete-expression
    contains the keyword delete followed by an expression that produces a pointer
    to the variable to be deleted. The syntax of the delete-expression looks like
    this:


    ```

    ::optional delete expression

    ```


    or:


    ```

    ::optional delete [] expression

    ```'
