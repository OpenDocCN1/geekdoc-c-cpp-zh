  md: '# Parsimony Is a Virtue in Library Design


    For those few readers who do not use this word in their daily lives, Merriam-Webster
    defines parsimony as the quality of being careful with money or resources; economy
    of means to an end. Readers may know this as the KISS (keep it simple, stupid)
    principle.imony means library is focused on a particular task and contains the
    minimum amount of machinery needed to perform that task.


    For instance, it is more parsimious for a library function to accept a valid std::istream
    reference from which to read data than to open a file named by a filename argument;
    handling system-dependent library semantics and I/O errors is not core to a data
    processing library. "Create a Parsimonious Function Signature" on page 267 for
    an example of this. Accepting a pointer to a memory buffer is more parsimonious
    than allocating storage to return; it means the library doesn''t have to handle
    out-of-memory exceptions. "Copy Free Libraries" on page 134 for an example. Pars
    is the ultimate result of consistently applying C++ development principles like
    the single responsibility principle and the interface-segregation principle of
    SOLID.


    Parsimonious libraries are simple. They contain free functions or simple classes
    that are complete as they stand. They can be learned and understood one piece
    at a time. This is the way most programmers learn the C++ standard library, a
    big library that is nevertheless parsimonious.


    # Make Memory Allocation Decisions Outside the Library


    This is a specific instance of the parsimony rule. Since memory allocation is
    so expensive, push allocation decisions out of the library if possible. For instance,
    fill in a buffer as an argument to a library function, rather than returning a
    buffer allocated by the library function.


    Pushing allocation out of library allows the caller to implement the optimizations
    described in Chapter 6, reusing memory instead of allocating new storage for each
    call.


    Pushing allocation out of the library also reduces the number of times a buffer
    of data may need to be copied as it is passed from function to function.


    If necessary, make memory allocation decisions in derived classes, so that the
    base class keeps only a pointer to the allocated memory. This new classes can
    derive that memory in different ways.


    Requiring memory to be allocated outside of the library affects function signatures
    (for instance, passing a pointer to a buffer versus returning an allocated buffer).
    It is important to make this decision at the time the library is designed. Trying
    to change the library once functions are in use will definitely cause breaking
    changes.'
