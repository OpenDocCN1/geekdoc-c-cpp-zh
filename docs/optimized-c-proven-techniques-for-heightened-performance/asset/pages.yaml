  md: 'Developers are smarter than compilers, though less meticulous. Developers can
    code optimizations in situations where the compiler cannot determine that an optimization
    is size, because developers can reason about the design and the intent of functions
    defined in other code modules not visible to the compiler.


    It is in relatively rare cases that developers can do better than compilers.


    Optimizing expressions can have a significant effect on smaller processors that
    execute instructions one at a time. On desktop-class processors with might pipelines,
    the performance improvement is detectable, but not great. This is not the place
    to hunt for big game in the optimization jungle. Here rely only on those occasions
    when you squeeze the final iota of performance out of some red-hot inner loop
    or function.


    # Simplify Expressions


    C++ evaluates expressions in strict order by the precedence and associativity
    of their operators. The expression a*b+a*c is evaluated as if written ((a*b)+(a*c))
    because the precedence rules in C++ multiplication have higher priority than addition.
    The C++ compiler never uses the distributive law to reduce this expression to
    a more efficient form a*(b+c). The expression a+b+c is evaluated as if ((a+b)+c),
    the compiler never rewrites the expression to a+(b+c)) even though that is equivalent
    in the math of integers and real numbers.


    The reason C++ leaves its hands off expressions is because the modular arithmetic
    of the C++ int type is not exactly like the mathematics of integers, and the approximate
    arithmetic of the C++ float type is not exactly like real math. C++ must give
    the programmer power to show his intention, or the compiler will reorder expressions
    in ways that cause overflows of various kinds. That means the developer is responsible
    for writing expressions in a format that uses the fewest possible operators.


    Horner''s rule for evaluating polynomials exemplifies how powerful rewriting expressions
    to a more efficient form can be an optimization. Although most C++ developers
    do not evaluate polynomials every day, we are all familiar with them.


    The polynomial y = ax^3 + bx^2 + cx + d can be written in C++ as:


    ```

    y = a*x*x*x + b*x*x + c*x + d;

    ```


    This statement performs six multiplications and three adds. Horner''s rule uses
    a repeated application of the distributive law to rewrite this statement as:


    ```

    y = (((a*x + b)*x) + c)*x + d;

    ```'
