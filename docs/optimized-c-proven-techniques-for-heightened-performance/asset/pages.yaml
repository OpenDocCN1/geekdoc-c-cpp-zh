  md: '# Limit Producer Output Queue Length


    In a producer/consumer program, any time the producer is faster than the consumer,
    data builds up in the queue between producer and consumer. Some of the many problems
    with this situation include:


    +   - The producer contends for the processor, memory allocator, and other resources,
    further slowing the consumer and exacerbating the problem.

    - The producer will eventually consume all system memory resources, causing the
    entire program to terminate unexpectedly.

    - If the program is designed to recover from exceptions, it may need to process
    all queued data after restarting, which increases the time to recover.


    This situation is especially likely in situations where a program sometimes takes
    input from a streaming source with a maximum rate that limits often the producer
    runs, and takes input from a fixed source like a file, where the producer can
    run continuously.


    The solution is to limit the queue size and block the producer when the queue
    is full. The queue only needs to be big enough to smooth any variation in the
    consumer''s performance. Frequently only a few entries are necessary. Any extra
    entries only cause the producer to run further and further ahead, increasing resource
    consumption without contributing to concurrency.


