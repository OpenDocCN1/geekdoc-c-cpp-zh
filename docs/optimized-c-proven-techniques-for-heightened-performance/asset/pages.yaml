    # Stop and Think


    > > —Lt. General Frederick “Boy” Browning (1896–1965)


    Comment to Field Marshall Montgomery on September 10, 1944, expressing his concerns
    about the Allied plan to capture the bridge at Arnhem. Browning''s concern was
    prophetic, the operation was a disaster.


    As noted in the previous section, an optimization effort may arrive at a point
    where simplicity or safety must be traded for additional performance gains. remove_ctrl_ref_result_lt()
    required a change in function signature that introduced a potential incorrect
    usage not possible with remove_ctrl(). For remove_ctrl_cstrings(), the cost was
    manually managing the temporary storage. For some teams, this may be a bridge
    too far.


    Developers have differing opinions, sometimes very strong ones, about whether
    a particular performance improvement justifies the added complexity of the interface
    or increased need to review uses of the function. Developers who favor an optimization
    like returning a value in an out parameter might say that the dangerous case isn''t
    all that likely, and could be documented. Returning the string in an out parameter
    also leaves the function''s return value available for useful things like error
    codes. Those who oppose this optimization may say there is nothing obvious away
    the dangerous use, and a subtle bug is more trouble than the optimization. In
    the end, the team must answer the question, “How much do we need this performance
    improvement?”


    I can offer no guidance on exactly when an optimization effort has gone too far.
    It depends on how the performance improvement is. But developers should note the
    transition and stop and think.


    C++ offers developers a range of choices between simple and safe code that is
    slow and radically fast code that must be used carefully. Advocates of other languages
    may call this a weakness, but for optimization, it is one of the greatest strengths
    of C++.'
