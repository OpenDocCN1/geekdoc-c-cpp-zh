  md: '# Take Bigger Bites—Use a Bigger Input Buffer


    C++ streams contain a class derived from std::streambuf that improves performance
    in the case of file reading by reading data from the underlying operating system
    in chunks. The data goes into a buffer inside the streambuf, from which it is
    extracted byte-by-byte by the iterator-based methods previously discussed. Some
    articles on Input suggest that the size of this input buffer will improve performance.
    Example 11-8 is a simple way to do this.


    Example 11-8. Increasing the size of: std::streambuf''s internal buffer


    ```

    std::ifstream in8k;

    in8k.open(filename);

    char buf[8192];

    in8k.rdbuf()->pubsetbuf(buf, sizeof(buf));

