    exception-throwing function calls


    +   - To implement the PIMPL idiom (see “Eliminate Uses of the PIMPL Idiom” page
    171)


    +   - To call into a DLL or plug-in


    The designer''s judgment must rule in each situation, because there are excellent
    reasons for most of these things. However, each layer transition is an extra function
    call and return that saves the performance of every call. The designer must review
    layer transitions to see if they are necessary, or whether two or more layers
    can be compressed into one. Here are a few thoughts to guide code review:


    +   - Many instances of the facade pattern in a single project may signal overdesign.


    +   - One sign that a design is too layered is if a layer occurs more than once,
    as in an error-returning layer calling an exception-handler layer, which then
    calls an error-returning layer.


    +   - Nested instances of PIMPL are difficult to justify in terms of PIMPL''s
    original purpose of providing a recompilation firewall. Sub subsystems are simply
    not enough to require nested PIMPLs (see “Eliminate Uses of the PIMPL Idiom” page
    171).


    +   - Project-specific DLLs are often proposed for encapsulating bug fixes. Projects
    ever realize this utility, but bug fixes tend to be released in batches that cross
    DLL boundaries.


    Eliminating layers is a task that can be done only at design time. At design time,
    there is a business need for the library. Once the library is complete, no matter
    how flawed it is, the cost of any change must be weighed against the benefit.
    Experience teaches that no manager will welcome you to spend a couple of sprints
    fixing up the library, unless there is a gun to their head.


