  md: "Why does this happen? Visual C++ generates floating-point instructions that\
    \ refer the old \"x87 FPU coprocessor\" register stack. In this scheme, all floating-point\
    \ computations are performed in a single 80-bit format. Single-precision float\
    \ and double-precision values are lengthened when they are moved into the FPU\
    \ registers. The conversion for float may take more time than the conversion for\
    \ double.\n\nThere are many ways to compile floating-point operations. On the\
    \ x86 platform, using the SSE registers allows computation to be done directly\
    \ in four different sizes. A compiler that uses SSE instructions might behave\
    \ differently, as might a compiler for a non-x86 processor.\n\n# Replace Iterative\
    \ Computations with Closed Forms\n\nWhat is it about C++ and bit-twiddling? Does\
    \ the rich collection of arithmetic and bit-logical operations in C++ facilitate\
    \ moving bits around, or did the need to get bits of information into and out\
    \ of device registers and networks mold C++ into the language it is today?\n\n\
    Many occasions arise to count the number of set bits, find the most significant\
    \ bit, determine the parity of bits in a word, determine whether the bits in a\
    \ word represent a power of two, and so on. Most of these problems have simple\
    \ O(n) solutions involving iterating through the n bits of the word. There may\
    \ be more complex iterative solutions for some problems, there are faster and\
    \ more compact closed-form solutions: constant-time computations that produce\
    \ a solution without the need for iteration.\n\nFor example, there is a simple\
    \ iterative algorithm to determine whether an integer value is a power of two.\
    \ All such values have a single bit set, so counting the number of set bits is\
    \ one. A simple implementation of this algorithm might look like Example 7-20.\n\
    \nExample 7-20. Iterative test of whether an integer is a power of 2\n\n```\n\
    inline bool is_power_iterative(unsigned n) {\n  for (unsigned one_bits = 0; n\
    \ != 0; n >>= 1) {\n    if (n & 1) == 1)\n      if (one_bits != 0)\n        return\
    \ false;\n    else\n        one_bits += 1;\n  }\n  return true;\n}\n```\n\nA test\
    \ loop of this algorithm took 549 milliseconds."
