    must be at least dramatic to make it worthwhile. Furthermore, a 1% speedup might
    be a measurement artifact masquerading as improvement. Such a speedup needs to
    be proven, with randomization, sample statistics, and confidence levels. It''s
    too much for too little effect. It''s not a place we go in in this book.


    A 20% improvement is a different animal. It blows through objections about methodology.
    There are not a lot of statistics in this book, something for which I do not apologize.
    The point of this book is to help the developer find performance improvements
    that are dramatic enough to outweigh any question of their value. Such an improvement
    may still depend on factors like the operating system and compiler, so it may
    not have much effect on other system or at another time. But that are dramatic
    almost never bite with reduced performance when the developers port their code
    to a new system.


    # The 90/10 Rule


    The fundamental rule of optimization is the 90/10: a program spends 90% of its
    run time in 10% of its code. This rule is a heuristic; not a law of nature, but
    rather a useful generalization to guide thinking and planning. This rule is sometimes
    called the 80/20 rule. The idea is the same. Intuitively, the 90/10 means that
    certain blocks of code are hot spots that are executed very frequently, while
    other parts of the code are hardly ever executed. These hot spots are the targets
    for optimization efforts.'
