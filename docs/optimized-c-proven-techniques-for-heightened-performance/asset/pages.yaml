    The C++ standard library provides a bunch of ready-to-use, debugged algorithms
    and data structures that are useful in many situations. The standard defines their
    worst-case time cost in big-O terms to demonstrate that they are widely applicable.


    But there is a cost for using the extremely powerful and general-purpose machinery
    of the standard library. Even when a standard library with good performance exists,
    it is often not competitive with the best handcoded algorithm. This may be due
    to weaknesses in the template code or weaknesses in the compiler design, or because
    the standard library has to work for very general situations (like using only
    operator<() and not strcmp()). This cost may persuade the developer to code really
    independently by hand.


    The gap in performance between standard algorithms and good, hardcoded algorithms
    is called by Stepanov''s Abstraction Penalty, after Alexander Stepanov, who designed
    the original standard library algorithms and container classes, at a time when
    no compiler could compile them. Stepanov''s Abstraction Penalty is the inevitable
    cost of providing a universal solution versus a custom-coded one. Stepanov''s
    Abstraction Penalty is a toll for using highly productive tools like the C++ standard
    library algorithms. It''s not a bad thing, but it''s a thing developers need to
    keep in mind when they need to go fast.


