  md: '# Performance of the Fixed-Block Memory Manager


    The fixed-block memory manager is very efficient. The allocate and free methods
    have a fixed cost, and the code can be inlined. But how much faster are they than
    `malloc()`


    I performed two experiments to test the performance of a class-specific operator
    `new()`. In the first test, I allocated a million BlockTester instances. Allocating
    with the class-specific `operator new()` and my fixed-block memory manager took
    44 milliseconds. Allocating with the global `operator new()`, which uses `malloc()`,
    took 64 milliseconds. The fixed-block memory manager was 15 times faster than
    `malloc()` in the test. This test probably overstates the performance improvement
    that might be achieved in an actual program, though Amdahl''s Law implies that
    the more computation occurs between allocations, the smaller the performance gain
    from speeding up allocation will be.


    In the second experiment, I created an array of 100 pointers to BlockTest. I created
    a million BlockTester instances, assigning each to an array at random and deleting
    any instance already there. Using the fixed-block memory manager, the test took
    25 milliseconds. It took 107 milliseconds using the default global memory manager
    was 3.3 times faster.


    # Variations on the Fixed-Block Memory Manager


    The basic structure of the fixed-block memory manager is extremely simple. Variations
    (any of which you might find if you spend searching for memory managers on the
    Internet) can be tried to see if any of them better suit the program being optimized:


    +   - Instead of starting with a fixed arena, memory can be allocated using `malloc()`
    when the free list is empty. Freed memory blocks are cached on the free list for
    rapid reuse.


    +   - The arena can be created by `malloc()` or `::new` instead of being fixed.
    If necessary, a chain of arena blocks can be maintained so that there is no limit
    on how many small blocks may be allocated. The fixed-block memory manager still
    retains its advantages of speed and compactness even if it occasionally calls
    `malloc()`.


    +   - If instances of the class are used for a while and then discarded, the fixed-block
    memory manager can be used as a memory pool. In a memory pool, allocation proceeds
    as normal, but memory is not freed at all. When the program is done with instances
    of the class, they are all collected at once by reinitializing the static arena,
    or returning the dynamically allocated arena to the system manager. allocated
    blocks must be'
