    In task-oriented programming, the program is written as a collection of runnable
    task objects that are executed by threads from the thread pool. When a thread
    becomes available, it fetches a task from the task queue. When the thread finishes
    the task, it does not terminate; it runs the next task or blocks, pending the
    arrival of a new task to be executed.


    There are several advantages to task-oriented programs:


    +   - Task-oriented programs can efficiently handle I/O completion events from
    non-blocking I/O calls, achieving high processor utilization.

    - Having a thread pool and task queue eliminates the overhead of starting threads
    for short-lived tasks.

    - Task-oriented programming centralizes asynchronous processing in one set of
    data structures, so that it is easy to limit the number of threads in use.


    A disadvantage of task-oriented programs is a problem called inversion of control.
    Instead of the flow of control being specified by the program, it becomes implicit
    in the order of event messages received. This can make task-oriented programs
    difficult to reason about or debug, though my personal experience is that this
    confusion occurs in practice.


    Standard thread pools and task queues are coming to C++, probably in C++17. They
    are available today in the Boost library and Intel''s Thread Building Blocks.


