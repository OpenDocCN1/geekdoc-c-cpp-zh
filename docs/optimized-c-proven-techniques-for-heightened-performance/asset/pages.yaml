  md: '# About the Author


    Kurt Guntheroth has been a working software developer for over 35 years, and has
    developed heavy duty C++ code for 25 years. He has developed on Windows, Linux,
    and embedded devices.


    Any time he can get away from the keyboard, Kurt loves to hang out with his wife
    and four active boys. Kurt lives in Seattle, Washington.


    # Colophon


    The animal on the cover of Optimized C++ is a Cape hartebeest (Alcelaphus busaphusaima),
    which ranges over the plains and scrublands of southwestern Africa. The Cape hartebeest
    is a large antelope belonging to the taxonomic family Bovidae. Both males and
    females have distinctive curvy horns, their hearing and sense of smell are excellent.
    They can run a zigzag evade path with speeds up to 55 kilometers per hour. Although
    lions, and cheetahs occasionally prey upon the Cape hartebeest, they must usually
    go elsewhere for their meals. The Cape hartebeest look like it was designed by
    a committee, but it has been carefully optimized.


    Many of the animals on O''Reilly covers are endangered; all of them are important
    to the world. To learn more about how you can help, go to animals.oreilly.com.


    The cover image is from The Riverside Natural History. The cover fonts are URW
    Typewriter and Guardian Sans. The text font is Adobe Minion Pro; the heading font
    is Adobe Myriad Condensed; and the code font is Dalton Maag''s Ubuntu Mono.'
