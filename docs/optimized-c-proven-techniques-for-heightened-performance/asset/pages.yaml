  md: '# Flatten Inheritance Hierarchies


    Most abstractions require no more than three layers of class derivation: a base
    class with common functions, one or more derivations to implement polymorphism,
    and perhaps a mixin layer of multiple inheritance for really complex cases. For
    specific cases, a developer’s judgment must prevail. inheritance hierarchies much
    deeper than this are since the abstraction represented by the class hierarchy
    is not clearly thought out, introducing complexity that leads to lower performance.


    From an optimization standpoint, the deeper the inheritance hierarchy, the greater
    the chance to introduce extra computation when a member function is called (‘Cost
    of Function Calls’ on page 161). The constructors and destructors in many layers
    of parents must traverse that whole chain to do their jobs. Although these functions
    are not usually called frequently, they still pose a potential of introducing
    expensive calls into performance-critical operations.


    # Flatten Calling Chains


    As with derived classes, the implementations of most abstractions require no more
    than three nested function calls: a free function or member function implementing
    strategy, calling a member function of some class, calling some public or private
    member function implementing the abstraction or accessing data.


    If the data is being accessed in a nested abstraction using a contained class
    instance, that may result in as much as three more layers. This analysis proceeds
    recursively down chains of nested abstractions. A library that is cleanly decomposed
    does not contain long chains of nested abstractions. These add overhead in the
    form of calls and returns.


    # Flatten Layered Designs


    Sometimes one abstraction must be implemented in terms of another abstraction,
    creating a layered design. As noted previously, this can be carried to extremes
    that affect performance.


    But other times, a single abstraction is reimplemented in a layered fashion. This
    may be done for several reasons:


    +   - To implement a layer using the facade pattern that changes calling conventions:
    quizás switching from project-specific to operating system-specific codes in arguments,
    switching from text-string to numeric codes, or inserting-project-specific error
    handling


    +   - To implement an abstraction in terms of a closely related abstraction for
    which library code already exists'
