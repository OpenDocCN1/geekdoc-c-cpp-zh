    \ things work in the wild and woolly world of templates.\n\nAnother issue with\
    \ allocator code on the Internet is that allocate() must throw std::bad_alloc\
    \ if the request cannot be fulfilled. So, for instance, the following code calls\
    \ malloc() to allocate memory is not standard-conforming because malloc() can\
    \ return nullptr:\n\n```\npointer allocate(\n    size_type n,\n    typename std::allocator<void>::const_pointer\
    \ e = nullptr) {\n    return reinterpret_cast<T*>(malloc(n*sizeof(T)));\n};\n\
    ```\n\n# A Fixed-Block Allocator\n\nThe standard library classes std::list, std::map,\
    \ std::multimap, std::set, and std::multiset all create a data structure from\
    \ many identical nodes. Such classes can take advantage of simple allocators implemented\
    \ using the fixed-block memory manager described in “Fixed-Size-Block Memory Manager”\
    \ on page 336. The partial definition in Example 13-9 shows the two functions\
    \ allocate() and deallocate(). The other definitions are identical to the standard\
    \ allocator shown in Example 13-8.\n\nExample 13-9: Fixed-block allocator\n\n\
    ```\nextern fixed_block_memory_manager<fixed_arena_controller>\nlist_memory_manager;\n\
    ```\n\n```\ntemplate <typename T> class StatelessAllocator {\npublic:\n    ...\n\
    \    pointer allocate(\n        size_type count,\n        typename std::allocator<void>::const_pointer\
    \ e = nullptr) {\n        return reinterpret_cast<const_pointer>\n           \
    \ (list_memory_manager.allocate(count * sizeof(T)));\n    }\n    void deallocate(pointer\
    \ p, size_type type) {\n        string_memory_manager.deallocate(p);\n    }\n\
    };\n```\n\nAs previously mentioned, std::list never attempts to allocate nodes\
    \ of type T. Instead, std::list uses Allocator template parameter to construct\
    \ a listnode<T>, by calling list_memory_manager.allocate(sizeof(<listnode<T>>)).\n\
    \n352 | Chapter 13: Optimize Memory Management"
