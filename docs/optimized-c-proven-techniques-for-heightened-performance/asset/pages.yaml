  md: 'But there is a problem. The variables dynamically allocated in std::list<T>
    are not of the user-defined type T. They are of some invisible type, like listitem<T>,
    that contains the previous and next list item pointers as well as the payload
    type T. The dynamically allocated variables in std::map<K,V> are of another hidden
    type, treenode<std::pair<K,V>>. These class templates are buried in compiler header
    files. It''s not possible to modify these classes to add a class-specific operator
    new() and operator delete(). Besides, templates are generic. The developer only
    wants to change the memory manager for certain instances of the generic template
    in a specific program, not for all instances in programs. Furthermore, the C++
    standard provides a mechanism to define the memory manager used by each container.
    Standard library containers contain an Allocator argument that allows the same
    ability to customize memory management as a class-specific operator new().


    Allocator is a template that manages memory. At its root, an allocator does three
    things: retrieves storage from a memory manager, returns to a memory manager,
    and copy-constructs itself from a related allocator. That ought to be simple,
    but it is not. Allocators have a long, painful history, covered in "Additional
    Definitions for C++98 Allocator" on page 347. Allocators are regarded by some
    influential developers as the most broken parts of C++. If the code is hot enough
    and the container is one of the most tractable node-based containers (std::list,
    std::forward_list, std::map, std::multimap, std::set, or std::multiset), a performance
    improvement may be available through implementing a custom allocator.


    Allocator implementations range from the simple to the mind-numbingly complex.
    The default allocator, std::allocator<T>, is a thin wrapper around ::operator
    new(). The developer can provide a nondefault allocator with different behavior.


    There are two kinds of allocator. The simplest kind is stateless—that is, with
    no static state, std::allocator<T>, the default allocator for standard library
    containers. Stateless allocators have desirable properties:


    +   - A stateless allocator can be de-constructed. There is no need to create
    an explicit instance of a stateless allocator to pass to the constructor of the
    container class. std::list<myClass, myAlloc> my_list; constructs a list of myClass
    instances with the stateless allocator myAlloc.

    - A stateless allocator does not take up any space in container instances. Most
    standard library container classes inherit from their allocator, taking advantage
    of the empty base class optimization to produce a zero-base class.'
