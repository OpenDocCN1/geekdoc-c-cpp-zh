    Figure 10-7. std::unordered_map possible implementation


    The load factor is a dependent variable in std::unordered_map. A program can observe
    its value, but cannot directly set it or predict its value after a reallocation.
    When a new entry is inserted in the unordered map, if the load factor exceeds
    a maximum load factor that may be specified by the program, the bucket array is
    reallocated and all the entries are rehashed to buckets in the new array. Since
    the number of buckets is increased by a factor greater than 1, the cost of insertion
    is amortized O(1). Insertion and lookup performance decline significantly when
    the maximum load factor is greater than 1.0, which is the default. Performance
    can be improved modestly by reducing the maximum load factor below 1.0.


