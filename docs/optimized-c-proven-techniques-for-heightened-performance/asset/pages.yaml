    # The Moving Parts of Move Semantics


    The standard writers realized they needed to enshrine the "move" operation as
    a fundamental concept in C++. Move handles transfer of ownership It is more efficient
    than copy, and well defined for both values and entities. The result is called
    move semantics. I m going to hit the highlights of move semantics here in this
    brief space. I recommend very highly having a look at Scott Meyers'' Effective
    Modern C++; he spends 10 out of 42 sections on move semantics. Thomas Becker''s
    "C++ Rvalue References Explained" provides an introduction to move semantics on
    the Web for free, but there is more to know than is covered.


    To facilitate move semantics, the C++ compiler was modified to recognize when
    a value exists only as a temporary. Such instance has no name. For example, the
    object returned by a function or resulting from a new-expression has no name.
    There can be no other references to such object. The object is available to initialize
    or be assigned to a variable, or to be the argument to an expression or function
    call, but will be destroyed at the next sequence point. An unnamed value is called
    an rvalue because it is similar to the result of an expression on the right side
    of an assignment statement. An lvalue, by contrast, is a value that is named by
    a variable. In the statement y = 2x + 1; the result of the expression 2x + 1 is
    an rvalue; it is a temporary value with no name. The variable on the left side
    of the equals sign is an lvalue, and y is its name.


    When an object is an rvalue, its contents can be plucked to become the value of
    an lvalue. All that is required is that the rvalue remain in a valid state so
    its destructor will behave correctly.


    The C++ type system was extended so it can distinguish an rvalue from an lvalue
    on function call. If T is any type, the declaration T&& is an rvalue reference
    to T—that is, a reference to an value of type T. The function resolution rules
    were extended so that when an rvalue is an actual argument, the rvalue reference
    overload is preferred, and when an lvalue is an argument, the lvalue reference
    overload is required.


    The list of special member functions was extended to include a move constructor
    and a move assignment operator. These functions are overloads of the copy constructor
    and assignment operator that take an rvalue reference. If a class implements the
    move constructor and move assignment operator, initializing or assigning an instance
    can use efficient move semantics.'
