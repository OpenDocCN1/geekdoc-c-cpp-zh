  md: '# Other Costs


    Sometimes an algorithm can be sped up by saving intermediate results. Such an
    algorithm has not only a cost in time, but also a cost in auxiliary storage. For
    instance, the familiar recursive algorithm for binary tree traversal runs in linear
    time, but also requires log_n auxiliary storage locations on the stack during
    the recursion. Algorithms that have large auxiliary space costs may not be suitable
    for constrained environments.


    There are algorithms that run faster if they are parallelized, but have a cost
    in the number of processors running in parallel needed to obtain the theoretically
    promised speedup. Algorithms requiring more log_n processors are usually not feasible
    on general-purpose computers, which have a small, fixed number of processors.
    Such algorithms may be possible using purpose-built hardware or graphics processors.
    I wish this book space to cover parallel algorithm design, but alas it does not.


    # Toolkit to Optimize Searching and Sorting


    The toolkit for optimizing searches and sorts contains three tools:


    +   - Replace algorithms having poor average-case big-O time costs with algorithms
