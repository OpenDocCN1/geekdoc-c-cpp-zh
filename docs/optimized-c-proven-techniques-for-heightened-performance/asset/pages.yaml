  md: '# CHAPTER 1


    # An Overview of Optimization


    The world has a stupendous appetite for computation. Whether the code you are
    writing runs on a watch, phone, tablet, workstation, supercomputer, or planet-spanning
    network of data centers, there are many programs that must run flat-out all the
