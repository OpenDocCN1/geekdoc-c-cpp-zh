    # Member function calls in derived classes


    When one class is derived from another, member functions of the derived class
    may have to do extra work:


    # Virtual member functions defined in a derived class


    If the most base (the class at the root of the derivation hierarchy) has no virtual
    functions, the code must add an offset to the "this" class instance pointer to
    get the vtable of the derived class, index into the vtable to get the function
    execution address. This code contains more instruction bytes, and the instructions
    are often slower because of the extra arithmetic they. This cost is significant
    on small embedded processors, but on desktop-class processors instruction-level
    concurrency hides most of the cost of the extra arithmetic.


    # Member function calls defined in a derived class with multiple inheritance


    The code must add an offset to the "this" class instance pointer to form the class
    instance pointer to a multiplied inherited class. This cost is significant on
    small embedded processors, but on desktop-class processors instruction-level concurrency
    hides most of the cost of the extra arithmetic.


    # Virtual member function calls defined in a derived class with multiple inheritance


    As virtual member function calls in a derived class, if the most base class has
    no virtual member functions, the code must add an offset to the "this" class instance
    pointer to get the vtable of the derived class, index into the potentially vtable
    to get the function execution address. The code must also add a potentially different
    offset to the "this" class instance pointer to form the class instance pointer
    of the derived class. This cost is significant on small embedded processors, but
    on desktop-class processors instruction-level concurrency hides most of the cost
    of the extra arithmetic.


    # Virtual multiple inheritance


    The code must dereference a table in the class instance to determine the offset
    to the class instance pointer to form the instance pointer of a virtually inherited
    class. There is additional overhead, as described previously, if the called function
    is virtual.


    # Cost of of pointers to functions


    C++ provides function pointers so that code can explicitly choose at run time
    which of several function bodies is executed as a result of a function call through
    the function pointer. These mechanisms have additional costs beyond the basic
    cost of function call and return:'
