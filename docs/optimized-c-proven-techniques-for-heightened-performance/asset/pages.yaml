  md: 'typically slow compared to the processor. A cluster of cloud instances communicating
    via TCP/IP links is an example of distributed processing. An example of distributed
    processing on a single PC is offloading drivers to processors on disk drives and
    network cards. Another example is offloading tasks to the many kinds of specialized
    processors in a graphics unit (GPU). GPUs have traditionally been provided on
    video cards, but the latest silicon styles from several manufacturers put GPUs
    onto the microprocessor.


    In a typical distributed processing setup, data flows through a pipeline or network
    of processes, where each process performs some transformation on the input, pushing
    the transformed data to the next stage in the pipeline. This model, which is like
    Unix command-line pipelines, allows relatively heavyweight processes to run efficiently.
    Processes in pipeline are long-lived, avoiding startup costs. Processes can continuously
    transform units of work, so they use whole time, subject to availability of input.
    Most importantly, processes do not share memory or synchronize with each other,
    they run at full speed.


    Although C++ has no process concept, distributed processing is relevant to C++
    development because it influences the design and structure of programs. Sharing
    memory does not scale beyond a few threads. Some treatments of concurrency avoid
    abandoning shared memory altogether. Distributed processes often decompose naturally
    into subsystems, producing modular, reconfigurable architectures.


    # Threads


    Threads are concurrent streams of execution within a process that share the same
    memory. Threads synchronize using synchronization primitives and communicate using
    shared memory locations.


    > Their strength, in comparison to processes, is that threads consume fewer resources
    and are faster to create and faster to switch between.


    Threads have several weaknesses, however. Since all threads in a process share
    the same memory space, a thread writing invalid memory locations can overwrite
    data structures in other threads, causing them to crash or behave unpredictably.
    Further, access to shared memory is many times slower than access to unshared
    memory and must be synchronized between threads, or the contents are difficult
    to interpret.


    Most operating systems support threads with an operating system-dependent library.
    Up until recently, C++ developers with experience in concurrency used a native
    thread library or the POSIX Thread (pthread) library, which provides a cross-platform
    solution with basic services.'
