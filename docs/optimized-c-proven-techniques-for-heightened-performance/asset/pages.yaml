    # Nondeterministic behavior


    Computers are incredibly complex devices with tons of internal state, most of
    which is invisible to developers. Executing a function changes the state of the
    computer (for instance, contents of cache memory), so that repeated execution
    happens under conditions that are different from the previous one. Uncontrollable
    changes in internal state are thus source of random variation in measurements.


    Furthermore, the operating system schedules tasks in unpredictable ways, so that
    other activity on the processors and memory busses varies during a measurement
    run. This makes any measurement less accurate.


    The operating system may even stop the code being timed to give a time slice away
    to another program. The tick counter continues to run without such pauses, producing
    a larger measured duration than if the operating system had not given a time slice
    to another program. This causes a somewhat larger random variation that can affect
    measurement.


