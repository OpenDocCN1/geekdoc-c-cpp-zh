  md: 'Traditional exception specifications were deprecated as of C++11.


    C++11 introduced a new exception specification called noexcept. Declare a function
    noexcept tells the compiler that the function cannot possibly throw any exception.
    If the function does throw one, terminate() is called just as in the throw() specification.
    The difference is that the compiler requires move constructors and assignment
    statements to be declared noexcept to implement move semantics (discussed in "Implement
    Move Semantics" on page 137). The noexcept specification on these functions serves
    as a declaration that move semantics are more important than the strong exception
    safety guarantee for certain objects. It''s very obscure, I know.


    # Summary


    +   Optimizing at the statement level doesn''t provide enough improvement to make
    it worthwhile unless there are factors that magnify the cost of the statement.

    The cost of statements in loops is magnified by the number of iterations of the
    loops.

    The cost of statements in functions is magnified by the number of times the functions
    are called.

    The cost of a frequently used idiom is magnified by the number of times the idiom
    is used.

    Some C++ statements (assignment, initialization, function argument evaluation)
    contain hidden function calls.

    Function calls into the operating system are expensive.

    An effective way to remove function call overhead is to inline the function.

    There is currently little need for the PIMPL idiom. Compile times today may be
    1% of what they were when PIMPL was invented.

    double arithmetic may be faster than float arithmetic.'
