    # Use a Better Compiler, Use Your Compiler Better


    C++ compilers are complex software artifacts. Each compiler makes different decisions
    about what machine code to generate for C++ statements. They see different opportunities
    for optimization. They will produce different executables from the same source
    code. If you are squeezing the last iota of performance from your code, it may
    be worthwhile to try several compilers if one produces a faster executable for
    your code.


    The most important advice about which C++ compiler to pick is to use a compiler
    conforming to C++11. C++11 implements rvalue references and move semantics that
    eliminate many copy operations that were unavoidable with previous C++ versions.
    (Move semantics are discussed in "Implement Move Semantics" on page 137.)


    Sometimes using a better compiler means using your compiler. For instance, if
    your application seems sluggish, look at the compiler switches if the optimization
    is turned on. This seems totally obvious, but I can''t count the number of times
    I have given this advice to people who subsequently admitted that, yes, their
    code run much faster when compiled with optimization turned on. In many cases,
    you need no further. The compiler alone may make your program several times faster
    if you ask it nicely.


    By default, most compilers don''t run any optimizations. Compile times are slightly
    shorter without the optimization pass. This was a big deal in the 1990s, but nowadays
    compilers and computers are so fast that the extra cost is insignificant. Debugging
    is also simpler with the optimizer turned off because the flow of execution exactly
    follows the source code. The optimizer may code out of loops, remove some function
    calls, and remove some variables altogether. Some compilers are more generous,
    but understanding what the program is by watching the flow of execution in the
    debugger can be challenging. Many compilers allow individual optimizations to
    be turned on and off in a debug build without affecting debugging too much. Turning
    on function inlining can have a significant impact on a C++ program because C++
    style includes writing many member functions to access the member variables of
    each class.


    The documentation that comes with a C++ compiler contains an extensive description
    of the optimization flags and pragmas. This documentation is like the owner''s
    manual that comes with a new car. You can get in your new car and drive it without
    reading the manual, but there is a lot of information that might help you use
    this big, complicated more effectively.'
