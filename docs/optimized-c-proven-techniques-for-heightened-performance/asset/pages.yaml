  md: '# Tasks


    A task is a unit of execution that can be invoked asynchronously in the context
    of a separate thread. In task-based concurrency, the tasks and the threads are
    separately and explicitly managed, so that a task is assigned to a thread for
    execution. By contrast, thread-based concurrency, the thread and the executable
    code running on the thread are managed as a unit.


    Task-based concurrency is built atop threads, so tasks share the strengths and
    weaknesses of threads.


    An additional advantage of task-based concurrency is that the number of active
    software threads can be matched to the number of hardware threads so that threads
    execute efficiently. The program can prioritize and queue tasks for execution.
    By contrast, in a thread-based system, the operating system prioritizes threads
    in an opaque and operating system-dependent manner.


    The cost of tasks'' extra flexibility is greater application complexity. The program
    must implement some means of prioritizing or sequencing tasks. The program must
    also manage a pool of threads upon which to run tasks.


    # Interleaved Concurrency


    Astronomers have a funny way of thinking about the universe. Hydrogen makes up
    73% of the visible matter in the universe. Helium makes up 25%. Everything else
    makes less than 2%. Astronomers can describe most of the observable universe as
    if it consisted exclusively of hydrogen and helium. They call all the other elements—the
    ones that make planets, processors, and people—“metals,” as if they had no separate
    identity, and pretty much ignore them.


    Concurrent programs can be much abstracted into loads, stores, and branches, and
    the branches mostly ignored, as if all the complexity of programming is irrelevant.
    Discussions of concurrency (including the ones in this book) often feature program
    fragments consisting of many sequences of assignment statements to illustrate
    concurrency concepts.


    Concurrent execution of two threads of control can be modeled as interleaving
    the simple load and store statements of the two threads. If thread 1 and thread
