  md: '# Cooperative multithreading


    In cooperative multithreading, two or more software threads pass execution among
    themselves via explicit statements that only one is actually running at a time.
    Coroutines are an example of cooperative multithreading.


    Cooperative multithreading has a few key advantages:


    +   - Each thread can maintain its context when not actively executing.

    - Since only one thread is running at a time, variables are not shared. Mutual
    exclusion is not necessary.


    Coroutines appear to be coming in C++17, and are available right now in Boost.
    A bunch of building blocks for various innovative concurrency schemes are listed
    in a recent proposal from the C++ Concurrency TR working.


    # SIMD instructions


    SIMD is an acronym for single instruction multiple data. In processors supporting
    SIMD, certain instructions operate on a vector of registers. The processor performs
    the same action simultaneously on each register, reducing overhead scalars operations.


    The C++ compiler does not normally generate SIMD instructions because its behavior
    is complex and not well matched to the way C++ describes programs. Compiler-dependent
    programs or inline features allow SIMD instructions to be inserted into functions,
    which are then provided in libraries for specialized tasks like digital signal
    processing or computer graphics. SIMD programming is thus processor- and compiler-dependent.
    Among the many web references regarding SIMD is a Stack Exchange Q&A that contains
    lots of references about using SIMD in C++.


