    # std::vector and std::string


    A sort of "product sheet" for these data structures would say:


    +   * Sequence container

    * Insert time: from back aggregate O(1), from elsewhere O(n)

    * Index time: by position, in O(1)

    * Sort in O(n log n)

    * Search in O(log n) if sorted, else O(n)

    * Iterators and references invalidated when the internal array is reallocated

    * Iterators produces items from-to-back or back-to-front

    * Reasonable control over allocated capacity independent of size


    Historically, std::string was permitted novel implementations, but C++11 locked

    down the definition. Visual Studio''s implementation might as well be a derived
    class

    of std::vector with specialized member functions for string handling. Comments

    about std::vector::vector apply equally to Visual Studio std::string.


    std::vector is a dynamically resizing array (see Figure 10-1). Array items are

    instances of the template type T that are copy-constructed into the vector.

    Although the item copy constructors may allocate memory for members, the only

    calls std::vector makes to the memory manager to reallocate its internal buffer

    as items are added. This flat structure makes std::vector unusually efficient.
