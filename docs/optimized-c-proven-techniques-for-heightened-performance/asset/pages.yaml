    # Nondeterminism—get over it


    The way I measure performance for optimization is extremely crucial. It isn''t
    informed by great knowledge of statistics. My tests run for seconds, not hours.
    I feel the need to apologize for this casual approach. These methods translate
    into human-visible performance improvements in overall program time, so I must
    be on the right track.


    If I run the same timing experiment on two different days, I get results that
    may differ by between 0.1% and 1%. There is no doubt about differences in initial
    conditions in my PC. I have no way to control these conditions, so I don''t worry.
    If I see larger variations, I can make the timing runs longer. As this makes my
    test/debug cycles longer, I don''t it unless I see a need to.


    Even when I see variation of a few percent between runs, relative variation of
    timing measurements within a single run seems to be below 1%. That is, I can see
    relatively subtle changes by timing variations of a function in the test run.


    I try to make runs on a computer that isn''t streaming video, running a Java update,
    or uncompressing a big archive. I try not to move or switch windows during a timing
    run. When PCs contained only one processor core, this was really important. With
    modern multicore processors, I don''t notice much variation even if I forget to
    turn off Pandora.


    If a test calls a function 10,000 times, that code and related data are going
    to remain in cache. If I were doing a test of worst-case absolute time for a hard
    real-time system, that would matter. But I am doing a relative time measurement
    on a system whose kernel is already nondeterministic. Furthermore, I''m testing
    only functions that my profiler has already identified as hot. They will be in
    cache already during production runs, so the iterated test actually represents
    realistic conditions.


    If a modified function appears to be 1% faster, it''s generally not worth modifying.
    Amdahl''s Law will shrink its small contribution to insignificance. An improvement
    of 10% will have marginal value. A change of 100% is far more interesting. Accepting
    only large changes in performance frees the developer from worrying about methodology.


