    It is foolish to struggle heavily to optimize a bad algorithm. Learning and using
    optimal algorithms is a broad path to optimal code. An inefficient search or sort
    routine can completely dominate the running time of a program. Code tweaking cuts
    run time by a constant factor. Switching to a more optimal algorithm can cut run
    time by a factor that grows bigger the bigger your data set is. Even on small
    datasets of dozens items an optimal search or sort can save a bunch of time if
    the data is searched frequently. Chapter 5, Optimize Algorithms contains some
    guidance on what optimal algorithms look like.


    Chances to use optimal algorithms come in all sizes, from compact closed-form
    computations, to tight keyword searches, to complex data structures and massive
    programs. There are many excellent books covering this subject. Whole careers
    have been spent studying it. I regret that I can only touch lightly on the topic
    of optimal algorithms in this book.


    "Optimization Patterns" on page 100 covers several important techniques for improving
    performance; these include precomputation (moving computation from run time to
    link, compile, or design time), lazy computation (moving computation toward the
    point where some unused result is actually needed), and caching (saving and reusing
    computations). Chapter 7, Optimize Hot Statements adds many examples of these
    techniques in practice.


    # Better Libraries


    The Standard C++ template and runtime libraries that come with a C++ compiler
    must be maintainable, and very robust. It may come as a surprise that these libraries
    are not necessarily tuned for speed. It may come as even greater surprise that
    after 30 years of C++, the libraries that come with modern C++ compilers still
    contain bugs, and may not conform to the current C++ standard, or even to the
    standard in force when the compiler was released. This complicates the task of
    measuring or recommending optimizations, and makes nonprofit any optimization
    experience developers believe they have. Chapter 8, Use Better Libraries covers
    these issues.'
