    A measurement may be reported in units smaller than the useful resolution because
    the units are standard. I own an oven that displays the oven temperature in degrees
    Fahrenheit. The thermostat controls the oven, however, has a resolution of 5°F,
    so that as the oven heats, the display reads 300°F, then 305, 310, 315, and so
    on. It makes more sense to display the temperature in familiar degree units rather
    than thermostat units. It just means that the least significant digit of the measurement
    can only assume the values 0 and 5.


    The reader might be surprised and disappointed to know the useful resolutions
    of the many inexpensive thermometers, scales, and other measuring devices around
    them that have resolutions of one unit or one-tenth of a unit.


    # Measuring with several clocks


    +   * A man with a watch knows what it is. A man with two watches is not quite
    sure.


    > —Most frequently attributed to Lee Segall


    When two events happen in the same place, it is easy to measure the elapsed time
    in timer ticks on a single clock. When two events happen at a distance from one
    another, it may be necessary to use two clocks. Tick counts can''t be compared
    between different clocks.


    Humankind has attacked this problem by synchronizing clocks to the Coordinated
    Universal Time reference. Coordinated Universal Time is synchronized to astronomical
    midnight at longitude 0, an arbitrary line that passes through a nifty place at
    the Royal Observatory in Greenwich, England (see Figure 3-5). This allows a time
    in ticks to be converted to a time in hours, minutes, and seconds past midnight
    UTC (Universal Time Coordinated, a clunky acronym negotiated between French and
    English horologists that favors neither French nor English spelling).


    If two clocks are perfectly synchronized to UTC, the UTC time from one is directly
    comparable to the other. But of course, perfect synchronization is not possible.
    The two clocks contain independent sources of variation that will cause them to
    drift from UTC, and from one another.'
