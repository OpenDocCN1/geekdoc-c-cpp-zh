    # # Stop and Think


    Multicore processors released to date have a helpful memory model. All loads acquire
    semantics, and all stores have release semantics. This is, the x86-architecture
    imposes a strong ordering memory model in the x86 to maintain compatibility with
    host of legacy programs whereas PowerPC, ARM, and Itanium processors all have
    weaker ordering (and higher performance).


    What this means is developers who write concurrent C++ programs using Visual C++
    on the x86 can currently get away with multithreaded murder—but if they recompile
    the same program on an ARM or PowerPC processor, they may be surprised by new
    threading bugs in their supposedly debugged and working code.


