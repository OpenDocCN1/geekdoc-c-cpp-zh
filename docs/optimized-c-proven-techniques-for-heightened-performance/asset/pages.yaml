    # Use Better Algorithms


    The biggest bang for the optimization buck comes from choosing an optimal algorithm.
    Optimization efforts can improve the performance of a program in a dramatic fashion.
    You can put into code that seemed sluggish before, just as upgrading your PC makes
    fast. Unfortunately, just upgrading your PC, most optimizations improve performance
    by at most a constant factor. Many optimization efforts give an improvement of
    30%–100%. If you are lucky, you might triple your performance. But a quantum leap
    in performance is unlikely—unless you can locate a more efficient algorithm.


    # Optimization War Story


    In the days of 8-inch floppies and 1 MHz processors, a certain developer designed
    a program to manage radio stations. One aspect of this program was to duplicate
    sort of the songs played each day. The trouble was obviously unacceptable. It
    took about 27 hours to sort a day’s data, which was unacceptable. To get this
    important sort to run faster, the developer resorted to heroic feats. He reverse
    engineered the computer and hacked into the microcode by undocumented means. He
    microcoded an in-memory sort that reduced run time to a still-unacceptable 17
    hours. Desperate, he called the computer manufacturer, for whom I worked, for
    assistance.


    I asked the developer what sorting algorithm he was using. He said, “Merge sort.”
    Merge sort is a member of the family of optimal comparison sorting algorithms.
    How many records was he sorting? “A few thousand,” he replied. This made no sense.
    The system he was using should have been able to sort his data in less than an
    hour.'
