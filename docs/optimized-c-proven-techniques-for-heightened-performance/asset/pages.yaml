  md: '# Remove Hidden Function Calls from Loops


    Normal function calls have a distinctive look, with a function name and list of
    argument expressions in parentheses. C++ code can also call functions implicitly,
    without this easy-to-spot syntax. This can happen when a variable of class type
    appears in any of the following situations:


    +   - Declaration of a class instance (calls constructor)

    - Initialization of a class instance (calls constructor)

    - Assignment to a class instance (calls assignment operator)

    - Arithmetic expressions involving class instances (calls operator member functions)

    - Scope exit (calls destructor of class instances declared in the scope)

    - Function arguments (each argument expression is copy-constructed into its formal
    argument)

    - Function return of a class instance (calls copy constructor, perhaps twice)

    - Inserting items into a standard library container (items are move- or copy-constructed)

    - Inserting items into a vector (all items are move- or copy-constructed when
    the vector is reallocated)


    These function calls are *hidden*. They don''t have the familiar look of a function
    call with a name and argument list; they look like assignments and declarations.
    It''s easy to miss the fact that a function is being called. I''ve talked about
    these before, in “inate Unneeded Copying” on page 129.


    Hidden function calls from constructing a function''s signature is changed are
    sometimes eliminated if a reference or pointer to the class instead of passing
    the actual argument by value. The benefit of this was demonstrated for strings
    in “Eliminate Copying of String Arguments” on page 75, and for any object that
    copies data in “Eliminate Copying of Function Call” on page 131.


    Hidden function results from copying out the function''s return value can be removed
    if the function signature is changed the class instance to be returned into a
    reference or pointer argument used as an out parameter. The benefit of this was
    demonstrated for strings in “Eliminate Copying of Returned String Values” on page
    77, and for any object that copies data in “Eliminate Copying of Function Return”
    on page 132.


    If an assignment or initialized declaration is loop-invariant, it can be lifted
    out of the loop. Sometimes even if the variable needs to be set for each pass
    through the loop.'
