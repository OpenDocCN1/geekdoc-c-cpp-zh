    std::deque is a specialized container for creating first-in, first-out queues
    (FIFO). Insertion and deletion at either end is constant-time. Subscribing is
    also constant-random access like those of std::vector; std::deque can be sorted
    in O(n log, n) time.


    Because std::deque makes some performance guarantees (in big-O terms) as std::vector,
    and has constant-time insertion at both ends, it is tempting to wonder what the
    big deal is about std::vector. However, the constant of proportionality of all
    operations is greater for deques than for vectors. Measured performance of common
    operations involving deques is 3 to 10 times slower than corresponding operations
    in vectors. Iterating, sorting, and lookup are relative bright spots for deques,
    being only about 30% slower than for vectors.


    std::deque is typically implemented as an array of arrays (Figure 10-2). The two
    indirections needed to access any end of a deque reduce cache locality, and the
    cost of more frequent calls to the memory manager is greater than std::vector.


    Pushing an item onto either end of a deque may cause at two calls to the allocator:
    one to add another block of items, and less frequently, another to extend the
    deque backbone. This allocation behavior is more complex, and thus harder to reason
    about, the allocation of vectors. std::deque does not offer any equivalent to
    std::vector''s reserve() member function to preallocate its internal data structures.
    The deque may seem like an obvious container with which to implement a FIFO queue.
    There is even a container adapter template called std::queue, for which deque
    is the default implementation. However, there is no guarantee that the allocation
