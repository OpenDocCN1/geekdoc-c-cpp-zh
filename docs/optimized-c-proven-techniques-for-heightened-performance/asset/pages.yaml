    # Prefer std::async to std::thread


    From a performance standpoint, a significant problem with std:: thread is that
    each invocation starts a new software. Starting a thread has both direct and indirect
    costs that make this operation very expensive:


    +   - The direct cost includes calling the operating system to allocate space
    for the thread in the operating system''s tables, allocate memory for the thread''s
    stack, initialize the thread''s register set, and schedule the thread to run.
    If the thread gets a new scheduling quantum, there is a delay before it begins
    to run. If it gets the rest of the invoking thread''s scheduling quantum, there
    is a delay while storing the invoking thread''s registers.

    - An indirect cost of creating threads is an increase in the amount of memory
    used. Each thread must reserve storage for its own stack of called functions.
    Large numbers of threads are started and stopped frequently, this can cause thrashing
    in the cache as threads executing on the computer compete for access to a limited
    cache.

    - Another indirect cost is incurred when the number of software threads exceeds
    the number of hardware threads. All threads then begin to slow down as they must
    be scheduled by the operating system.


