  md: "Measured performance of remove_ctrl_ref_result_it() is 1.02 microseconds per\
    \ call, about 2% faster than the previous version.\n\nremove_ctrl_ref_result_it()\
    \ is very efficient, but its interface is open to misuse in a way that the original\
