    # Avoid the Thundering Herd


    A phenomenon called the thundering herd occurs when many threads are pending on
    an event, such as the availability of work, that only one thread can service.
    When the event occurs, all the threads become runnable, but only a few of them
    can run immediately because there are only a few cores. Each of ones takes the
