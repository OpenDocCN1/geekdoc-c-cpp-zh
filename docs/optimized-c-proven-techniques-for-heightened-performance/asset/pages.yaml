    # a / b * c: A Cautionary Tale


    The reason C++ does not reread arithmetic expressions itself is because it is
    dangerous. Numerical analysis is another subject that produces whole books. This
    is a single example of what can go wrong.


    The C++ compiler will evaluate the expression $a / b * c$ as if it were parenthesized
    $((a / b) * c)$. But there''s a problem with this expression. If $a, b$, and $c$
    are integral types, the result of $a / b$ is not exact. if $a=2, b=3$, and $c=10$,
    $a / b * c$ is $2/3*10=0$, when we really want it to be 6. The problem is that
    the inexness in $a / b$ is multiplied by $c$, producing a very incorrect result.
    A developer with good math skills might rearrange the expression as $c * a / b$,
    which the compiler will evaluate as parenthesized $((c * a) / b)$. Then $20 /
    3 = 6$.


    Problem solved, right? Well actually. If you do the multiplication first, there
    is a danger of overflow. If $a=86,400$ (the number of seconds in a day), $b=90,000$
    (a constant used in video sampling), and $c=1,000,000$ (the number of microseconds
    in a second), the expression $c * a$ overflows a 32-bit unsigned. The original
    expression, while having a significant error, is less than the revised one.


    The developer is solely responsible for knowing the expression as written, with
    arguments having the expected magnitudes, will produce a correct result. The compiler
    cannot help with this task, which is why it leaves expressions alone.


    # Group Constants Together


    One thing the compiler can evaluate constant expressions. Faced with an expression-like


    seconds = 24 * 60 * 60 * days;


    or


    seconds = days * (24 * 60 * 60);


    the compiler can evaluate the constant part of the expression to produce something
    equivalent to


    seconds = 86400 * days;


    But if the programmer writes


    seconds = 24 * days * 60 * 60;


    the compiler is obliged to perform the multiplications at run time.'
