  md: '# Standard library implementations have bugs


    Although bugs are an inevitable part of software development, even experienced
    developers may not have encountered bugs in standard library code. They may thus
    have come to believe that the various implementations of the standard library
    are rock solid. I am sorry to burst this happy bubble. In writing this book, I
    came across several standard library bugs.


    Classic "Hello, World!" programs are quite likely to work as expected. However,
    optimization takes the developer into the dark corners and back alleys of the
    standard library, where bugs are most likely to lurk. The optimizing developer
    must be ready for occasional disappointment when a promising optimization cannot
    be implemented, or when an optimization that works on one compiler produces an
    error message on another.


    How can it happen that 30-year-old code still contains bugs, the reader may ask?
    For one thing, the standard library has been evolving for all that time. The definition
    of the library and the code that implements it has always been a work in progress.
    It is not thirty-year-old code. The standard library is maintained separately
    from the compiler, which also has bugs. For GCC, the library maintainers are volunteers.
    For Microsoft''s Visual C++, the standard library is a purchased third-party component
    that has its own release cycle that differs from both the Visual C++ release cycle
    and the C++ standard release cycle. Changing requirements of the standard, diffuse
    responsibility, schedule issues, and the complexity of the standard library all
    take their inevitable toll on quality. What is actually more interesting is that
    there are so few bugs in the standard library implementations.


    # Standard library implementations may not conform to the C++ standard


    There is probably no such thing as a "standard-conforming implementation." In
    the real world, compiler vendors intend their tools to be shippable if they provide
    a reasonably large subset of the relevant C++ standard, including its most important
    features.


    As for libraries, these are released on a different schedule from that of the
    compiler, and the compiler is released on a different schedule from that of the
    C++ standard. A standard library implementation may lead or trail the standard
    conformance of the compiler. Different parts of the library may lead or trail
    different extents. For developers interested in optimization, changes in the C++
    standard, such as the change in optional insertion points for map entries (see
    "Inserting and Deleting in std::map on page 252") mean that the behavior of some
    functions may surprise the user, since there is no way to document or determine
    the version of the standard to which a particular library conforms.


    Some libraries are limited by the compiler. For instance, a library cannot implement
    semantics until the compiler supports this feature. Imperfect compiler support
    may lead to limitations in the standard library classes that be'
