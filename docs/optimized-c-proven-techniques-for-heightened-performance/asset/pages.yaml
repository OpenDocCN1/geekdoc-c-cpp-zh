  md: '# New-Expressions Construct Dynamic Variables


    A C++ program requests creation of a dynamic variable or array using a new-expression.
    A new-expression contains the keyword new followed by a pointer, to which is returned
    by the new-expression. The new-expression can also contain an initializer to set
    the initial value of the variable or each element. A new-expression returns a
    pointer to a fully initialized C++ variable or array, rather than the simple void
    pointer to uninitialized storage by C++ operator new() or C''s memory management
    functions.


    The syntax of the new-expression, in all its glory, looks like this:


    ```

    :optional new (placement-params)optional (type) initializer

    ```


    or:


    ```

    :optional new (placement-params)optional type initializer

    ```


    The difference between these two lines is in the optional parentheses around type,
    which are sometimes needed to help the compiler distinguish the end of the placement-params
    from the beginning of a complicated type, or the end of the type from the beginning
    of the initializer. cppreference, among other sources, has vastly more information
    on all the syntactic wrinkles of new-expressions.


    When type declares an array, the highest (that is, leftmost) array dimension may
    be described by a non-constant expression, allowing the size of the array to be
    specified at runtime. This is the only place in C++ where a declaration may have
    a variable size.


    A new-expression returns an rvalue pointer to the dynamic variable or the first
    element of the dynamic array. (The fact that this pointer is an rvalue is important;
    see "Implement Move Semantics" on page 137 for details.)


    All versions of the new-expression do a lot more than just call operator new to
    allocate storage. If the call to operator new() is successful, the non-array version
    constructs a type object. If the constructor throws an exception, its members
    and bases are destroyed, and the allocated memory is returned by a call to the
    operator delete() whose signature corresponds to the operator delete() function
    used to allocate memory. If no operator delete() matches, the memory is not returned
    to the memory manager, potentially causing a leak. The expression returns the
    pointer, rethrows the caught exception, or returns nullptr in the case of the
    non-throwing new-expression.'
