    # Don''t Busy-Wait on a Single-Core System


    C++ concurrency features allow developers to implement high-performance synchronization
    primitives to do-wait. But busy-waiting is not always a good idea.


    In a single-core processor, the only way to synchronize threads is to invoke the
    operating system''s synchronization primitives. A busy-wait is laughably ineffective.
    In fact, busy-waiting causes the thread to waste its whole time slice, because
    a thread holding a mutex cannot run to complete its critical section until the
    waiting thread gives up the processor.


    # Don''t Wait Forever


    What happens to a thread that waits unconditionally for an event? If the program
    runs properly, perhaps nothing. But what if the user attempts to stop the program?
    The user interface shuts down, but the program doesn''t stop, because there are
    threads still running. If `main()` tries to join the waiting thread, it hangs.
    If the waiting thread is detached, it may exit. Then what happens depends on how
    the thread is waiting. If it''s waiting for a flag to be set, it waits forever.
    If it''s waiting on an operating system event, it''s waiting on a C++ object,
    then it very much depends whether some nonblocked thread deletes the object. That
    might cause the waiting thread to terminate. Or not.


    Waiting forever is the enemy of error recovery. It is the difference between a
    program that mostly works but sometimes is flaky, and a program that has solid,
    dependable behavior is reassuring to users.


    # Rolling Your Own Mutex May Be Ineffective


    It is not difficult to code a simple class that acts as a mutex, busy-waiting
    until another thread updates an atomic variable. Such a class may be faster than
    the system-provided mutex when contention is low and critical sections are brief.
    However, the mutexes that come with an operating system often know secrets about
    the operating system and the way it schedules tasks that improve their performance
    or avoid priority inversion issues on that particular operating system.


    The design of robust mutexes is informed by the design of the operating system
    they run on. Rolling yours is not a broad pathway to optimization.'
