    # Call and return


    These add nothing to the useful work of the program. They are pure overhead that
    would not exist if the function call was replaced by the function body. Indeed,
    many compilers attempt to put the function body inline if the function is small,
    and if the function definition is available at the point of the function call.
    If the function cannot be inlined, there are several costs.


    Calling the function requires the execution address to be written to the stack
    frame in memory to form the return address.


    Function return requires the execution address to be read from the stack and loaded
    into the execution pointer. At the call, and again execution continues at a nonconsecutive
    memory address. As noted in "Making Decisions Is Hard for Computers" on page 22,
    the computer executes instructions very efficiently. However when execution transfers
    to a nonconsecutive location, there is a good chance of a pipeline stall or a
    cache miss.


    # Cost of virtual functions


    In C++, the program can define any member function *virtual*. Derived classes
    define a member function with the same signature as the base class''s virtual
    function, providing a new function body to be used when the virtual function is
    called on an instance of the derived class, even if called from a pointer or reference
    to the base class''s type. The program selects what function to call when it overrides
    the class instance. The particular override invoked is then determined at run
    by the actual type of the class instance.


    Each instance of a class with virtual member functions contains an unnamed pointer
    to a table, the *vtable*, which points to the body associated with each virtual
    function signature visible in that class. The vtable pointer is generally made
    the first field of the class instance to make dereferencing less expensive.


    Since a virtual function selects one of several function bodies, the code to call
    a virtual function dereferences the class instance to get a pointer to the vtable.
    The code indexes into the vtable (that is, adds a small offset to the vtable,
    and dereferences address) to get the function''s execution address. There are
    thus two extra nonsequential memory loads for every function call, with increased
    probability of a cache miss and execution stall. Another issue with virtual functions
    is that it is difficult for the compiler to inline them. The compiler can do so
