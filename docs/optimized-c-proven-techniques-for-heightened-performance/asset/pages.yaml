- img_proc: true
  md: 'Unix command-line pipelines and web services are examples of message-passing
    programming. The components of a distributed processing system are message-passing
    programs.


    Among the advantages of message-passing programs are:


    +   - Synchronization of the output of each stage to the input of the next stage
    is implicit. It is either handled by the operating system when the stages communicate
    with datagrams, or provided within a queue connecting the stages. The concurrency
    of the system happens outside the stages, so stages can also be considered as
    single-threaded code that may block on input and output actions.

    - Because the outputs of one stage are all connected to a single input of the
    next stage, issues of starvation and fairness occur less frequently.

    - Synchronization occurs less frequently, on larger units of data. This increases
    the fraction of time that multiple threads can run concurrently.

    - Larger units of work can be passed between pipeline stages, so that each stage
    uses whole time slices instead of stopping and starting for mutual exclusion.
    This improves processor utilization.


    Disadvantages of message-passing programs include:


    +   - Messages are not inherently object-oriented. The C++ developer must write
    code to marshal input messages into member function calls.

    - Error recovery can be an issue when a pipeline stage crashes.

    - Not every problem has an obvious solution as a pipeline of independent programs
    passing messages.


