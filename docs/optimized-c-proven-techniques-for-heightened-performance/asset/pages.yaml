    \ the same as a value. The following call will produce unintended results, returning\
    \ an empty string.\n\n```\nstd::string foo(\"this is a string\");\nremove_ctrl_ref_result_it(foo,\
    \ foo);\n```\n\n# Use Character Arrays Instead of String\n\nWhen a program requires\
    \ the ultimate in performance, it is possible to bypass the C++ standard library\
    \ and handle the C-style string functions, as in Example 4-7. The C-style string\
    \ functions are harder to use than std::, but the gain can be impressive. To use\
    \ the C-style string functions, the programmer must choose to manually allocate\
    \ and free character buffers, or use static arrays dimension to worst-case sizes.\
    \ Declaring a bunch of static arrays is problematic if memory is all constrained.\
    \ However, it is usually room to statically declare large buffers in local storage\
    \ (that is, the function stack). These buffers are reclaimed at negligible runtime\
    \ cost when the function exits. Except in the most constrained embedded environments,\
    \ it is no problem to declare a worst-case buffer of 1,000 or even 10,000 characters\
    \ on the stack.\n\nExample 4-7. remove_ctrl_cstrings(): coding on the bare metal\n\
    \n```\nvoid remove_ctrl_cstrings(char* dest, char* srcp, size_t size) {\n  for\
    \ (size_t i=0; i<size; ++i) {\n    if (srcp[i] >= 0x20)\n      *dest++ = srcp[i];\n\
    \  }\n  *dest = 0;\n}\n```\n\nremove_ctrl_cstrings() took 0.15 microseconds per\
    \ call in the timing test. This is 6 times faster than its predecessor, and an\
    \ astonishing 170 times faster than the original function. One reason for the\
    \ improvement is the elimination of several function calls, with a corresponding\
    \ improvement in cache locality.\n\nExcellent cache locality may however, contribute\
    \ to some performance measurement being misleading. In general, other operations\
    \ between calls to remove_ctrl_cstrings() flush the cache. But when it is called\
    \ in a tight loop, instructions and data stay cache."
