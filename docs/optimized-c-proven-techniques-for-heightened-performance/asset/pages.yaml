  md: '# CHAPTER 11


    # Optimize I/O


    A program is a spell cast over a computer, turning input into error messages.


    —Anonymous


    This chapter treats efficient use of the C++ streaming I/O functions for the commonly
    occurring example of reading and writing text data. Reading and writing activities
    are so commonplace that developers don’t even notice them—yet activities are time-consuming.


    The rotation of a disk platter is as wondrous and slow to today’s ultra-fast computer
    chips as the rotation of the Earth is to us. The read heads have inertia that
    must be overcome to move their bulk from track to track. These properties fiercely
    resist improving hardware performance. In the internetworked world of limited
    data rates and busy servers, response latency may be measured in seconds rather
    than milliseconds. Even the speed of light becomes a significant factor when streaming
    data from distant computers.


    Another problem with I/O is that there is a lot of code between the user’s program
    and the spinning platters of the disk or the network interface card. The cost
    of all this code must be managed to make I/O as efficient as possible.


    # A Recipe for Reading Files


    There are a number of formulas on the Web for reading and writing files, and even
    some that claim to be fast. They range in performance over a whole order of magnitude
    in tests. Readers are already smart enough not to use an untested recipe from
    the Internet (such as the famously dangerous and incorrect recipes for making
    explosives or cooking meth) might be wise to add to that list recipes for reading
    a file in C++.'
