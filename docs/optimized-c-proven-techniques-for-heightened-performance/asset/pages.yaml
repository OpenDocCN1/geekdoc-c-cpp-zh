    # Optimization War Story


    My personal record using experience and intuition is mixed. I once reduced the
    unresponsive startup time of an interactive game application from an unacceptable
    16 seconds to around 4 seconds. Unfortunately, I did not set a baseline measurement
    of the original code. My manager would only believe that I had reduced startup
    time from eight seconds to four, because that was what I could show him. This
    very evidence-minded manager went to the trouble of instrumenting the original
    code with a profiler and printing the results for me. Interestingly enough, his
    instrumentation found pretty much the same list of functions as my intuition.
    However, my credibility as an optimization expert was blown because I had not
    pursued the task in a methodical way.


    # Summary


    +   * Performance must be measured.

    * Make testable predictions, and write the predictions down.

    * Make a record of code changes.

    * If each experiment run is documented, it can quickly be repeated.

    * A program spends 90% of its run time in 10% of its code.

    * A measurement must be both true and precise to be accurate.

    * Resolution is not accuracy.

    * On Windows, the function clock() provides a reliable 1-millisecond clock tick.
    For Windows 8 and later, the function GetSystemTimeAsFileTime() provides a subsecond
    tick.

    * Accepting only large changes in performance frees the developer from worrying
    about methodology.

    * To estimate how expensive a C++ statement is, count the number of memory reads
    and writes performed by the statement.'
