    # # Optimize Search in Hashed Key/Value Tables


    The previous section examined changes to the algorithm for a particular table
    data structure that was very efficient to set up. In this section, I examine another
    table data structure and algorithm: that hash tables.


    The idea of a hash table is that the key, whatever its type, can be fed to a hash
    function that reduces the key to an integer hash. The hash turn becomes an array
    index that leads directly to a table entry. If the table then matches the key,
    the search is a success. If the hash always leads directly to the table entry,
    the hash table allows access in constant time. The only cost is the cost of producing
    the hash. Like linear search, hashing does not assume any ordering relationship
    among the keys, but requires only means to compare keys for equality.


    The complicated part of implementing a hash table is finding an efficient hash
    function. A 10-letter string contains many more bits than a 32-bit integer. More
    than one string can hash to the same table index. Each mechanism must be provided
    to resolve collisions. Each entry in the hash table might be the head of a list
    of entries that hash to that index. Alternately, adjacent indexes might be searched
    for the matching entry until an empty index is found.


    Another problem is that the hash function may not produce a particular index for
    any of the keys in the table, leaving an unused location in the hash table. This
    makes a hash table potentially larger than a sorted array of the entries.


    A poor hash function produces array indexes that are not highly correlated to
    the bits of the same index. Then the performance of the hash table degrades to
    O(n), making it no better than a linear search.


    A good hash function produces indexes that are not highly correlated to the bits
    of the key. Random number generators and cryptographic encoders are good for the
    hash if the hash is costly to compute, there may be no advantage over a binary
    search unless the table is large.


    Hunting better hash functions has been a pastime of computer scientists for many
    years. A Q&A on Stack Exchange provides performance data and reference links for
    several popular hash functions. The developer tuning hash table code should be
    aware that these waters have been heavily fished. There are no big performance
    improvements to be found here.'
