    # Cost of Function Calls


    Functions are the oldest and most important abstraction in programming. The programmer
    defines a function once, then calls its name from many locations in the code.
    For each call, the computer saves its place in the executing code, transfers control
    to the function body, then returns to the next statement after the function call,
    effectively inserting the function''s body into the stream of instruction execution.


    This notational convenience does not come for free. Each time a program calls
    a function, something like the following (depending on course on processor architecture
    and optimizer settings):


    +   1. The executing code pushes a new frame onto the stack call to hold the function''s
    arguments and local variables.

    2. Each argument expression is evaluated and copied into the stack frame.

    3. The execution address is copied into the stack frame to return the return address.

    4. The executing code updates the execution address to the first statement of
    the function body (instead of the next statement after the function call).

    5. The instructions in the function body execute.

    6. The return address is copied from the stack frame into the instruction address,
    transferring control to the statement after the function call.

    7. The stack frame is popped off the stack.


    There is some good news about the cost of functions. A program with functions
    is generally more compact than the same program with large functions expanded
    inline. This improves cache and virtual memory performance. Still, all other things
    equal, making frequently called functions more efficient can be an effective optimization.


    # Basic cost of function calls


    There are a number of details that can slow down function calls in C++, and which
    therefore form the basis for optimization of function calls:


    # Function arguments


    Beyond the cost of evaluating the argument expressions, there is a cost to copy
    each argument value onto the stack in memory. The first few arguments may be passed
    efficiently in registers if they are small, but if there are many arguments, at
    least some are passed via the stack.'
