    # Hardware evolution of tick counters


    The IBM PC did not have any hardware tick counters. It had a time-ofday clock
    that the software could read. The earliest C runtime library copied the ANSI C
    library, providing the function time_t time(time_t*), which returns the number
    of seconds since 00:00 January 1, 1970 UTC. The original version of time() returned
    a 32-bit signed integer, but during the run-up to Y2K, this was changed to a 64-bit
    signed integer.


    The IBM PC used a periodic interrupt from the AC power supply to wake the kernel
    to perform task switches and other kernel operations. The period of this tick
    was 16.67 milliseconds in North America, because the AC power is 60 Hz, and 10
    milliseconds the AC power is 50 Hz.


    By Windows 98, and possibly earlier, Microsoft C provided the ANSI function clock_t
    clock(), which returned a tick count in a signed format. The constant CLOCKS_PER_SEC
    specified the number of ticks per second. A returned value of -1 implied that
    clock() was not available. clock() originally reported a tick based on the periodic
    interrupt. clock() as implemented on Windows differs from the ANSI specification,
    measuring elapsed wall-clock time and not CPU time. clock() was recently implemented
    in terms of GetSystemTimeAsFileTime(), and in 2015 returned a 1-millisecond tick
    with 1-millisecond resolution, making it a good millennial count in Windows.


    Starting in Windows 2000, a software tick counter based on the A/C power interrupt
    was made available via a call to DWORD GetTickCount(). The count depends on the
    hardware of the PC, and can be significantly longer than 1 millisecond. GetTickCount
    performs a computation to convert the tick to milliseconds to partially resolve
    this ambiguity. An updated version of this call, ULONG GetTickCount64(), returns
    the same tick count in a 64-bit unsigned integer so that longer durations can
    be measured. There is no way to inspect the current interrupt period, and a pair
    of functions reduce the period and restore it:


    ```

    MMRESULT timeBeginPeriod(UINT)

    MMRESULT timeEndPeriod(UINT)

    ```


    These functions operate on a global variable affecting all processes and other
    functions, such as Sleep(), the AC interrupt. Another call, DWORD timeGetTime(),
    appears to get the same tick counter by a different method.


    Starting with the Pentium architecture, Intel provided a hardware register called
    the Time Stamp Counter (TSC). The TSC is a 64-bit register that counts ticks from
    the processor clock. This counter could be accessed rapidly by the RDTSC instruction.'
