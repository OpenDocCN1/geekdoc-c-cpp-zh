    Algorithms can have a super-linear cost. For instance, many algorithms compare
    pairs of inputs, and divide the space to be sorted into two parts at each step.
    These algorithms have time cost O(n log, n). Algorithms that are O(n log, n) become
    relatively costly as n increases, but the rate of growth is so slow that these
    algorithms are generally considered tractable for large values of n. Still, you
    don''t want to invoke an algorithm needlessly during a program''s run.


    O(n^2), etc.


    Some algorithms, including efficient sorting algorithms, must compare each input
    value to every other value. These algorithms have time cost O(n^2). The cost of
    such algorithms grows so fast that it becomes worrisome for large values of n.
    There are a number of problems that have simple solutions that are O(n^2) or O(n''),
    and more subtle solutions that are faster.


    O(2^n)


    O(2^n) algorithms grow so rapidly that they can be considered only for small values
    of n. Sometimes that is OK. Algorithms that require inspecting all combinations
    of n inputs are O(2^n). Scheduling and trip-planning problems like the Traveling
    Salesman problem are O(2^n). If the fundamental algorithm needs to solve is O(2^n),
    the developer is faced with several unpalatable options: use a heuristic algorithm
    that doesn''t guarantee an optimal solution, limit the solution to small values
    of n, or find some other way to add value that doesn''t involve solving the problem
