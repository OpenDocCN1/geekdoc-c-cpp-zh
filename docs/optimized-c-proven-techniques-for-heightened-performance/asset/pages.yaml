  md: 'from the string and compares it to a literal constant. This is unlikely to
    be the problem. The controlled statement on line 5 is another story.


    As noted previously, the string concatenation operator is expensive. It calls
    into the memory manager to construct a new temporary string object to hold the
    concatenated string. If remove_ctrl() is typically a string of printable characters,
    then remove_ctrl constructs a new temporary string object for nearly every character
    in s. For a string with 100 characters, that''s 100 calls into the memory manager
    to create storage for the temporary string, and another 100 calls to release the
    storage.


    In addition to the temporary strings allocated for the result of the concatenation
    operation, additional strings may be allocated when the string expression is assigned
    to result, depending on how strings are implemented:


    +   * If strings are implemented using the copy-on-write idiom, the assignment
    performs an efficient pointer copy and increments the reference count.

    * If strings have a non-shared buffer implementation, then the assignment operator
    copies the contents of the temporary string. If the implementation is naive, or
    result''s buffer does not have enough capacity, then the assignment operator also
    allocates a new buffer to copy. This results in 100 operations and as many as
    100 additional allocations.

    * If the compiler implements C++11-style references and move semantics, then the
    fact that the concatenation expression''s result is an rvalue means the compiler
    can call result''s move constructor instead of its copy constructor. The result
    is that the program performs an efficient pointer copy.


    The concatenation operation also copies all characters previously processed into
    the temporary string each time it is executed. If there are n characters in the
    argument string, remove_ctrl() copies O(n²) characters. The result of this allocation
    and copying is poor performance.


    Since remove_ctrl() is a small, standalone function, it is possible to build a
    test harness that calls the function to measure exactly how much performance can
    be improved through optimization. Building tests and measuring performance is
    covered in Chapter 3. The code for the test harness, and other code from the book,
    can be downloaded from my website.'
