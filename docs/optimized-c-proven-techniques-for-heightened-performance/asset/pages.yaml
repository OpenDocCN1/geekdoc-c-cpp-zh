  md: '# Smart Pointers Automate Ownership of Dynamic Variables


    Ownership of dynamic variables is not controlled by the compiler or defined by
    C++. A program may declare a pointer variable in one place, assign a dynamic variable
    to the pointer using a new-expression in another place, copy the pointer to another
    pointer in a third place, and destroy the dynamic variable referenced by the second
    pointer using a delete-expression in yet another place. However, a program that
    behaves in this way can be hard to test and debug because ownership of the dynamic
    variable is diffuse. Ownership of dynamic variables is enforced by the developer
    and encoded into the program logic. When ownership is diffuse, every line of the
    program may potentially create a dynamic variable, add or remove references, or
    destroy the variable. The developer must manually trace all execution paths to
    ensure the dynamic variables are always properly returned to the memory manager.


    This complexity can be reduced through the use of programming idioms. One common
    practice is to declare a pointer variable as a private member of some class. The
    class constructor can set the pointer to nullptr, copy a pointer argument, or
    contain a new-expression to create a dynamic variable. Because the pointer is
    a private member, any change to the pointer must happen within member functions
    of the class. This limits the number of code lines that can affect the pointer,
    making coding and debugging easier. The class destructor can contain a delete-expression
    for the dynamic variable. An instance of a class that behaves in this way is said
    to own the dynamic variable.


    A simple class may be designed with the single purpose of owning a dynamic variable.
    In addition to constructing and destroying the dynamic variable, the class also
    implements operator->() and operator*(). Such a class is called a smart pointer,
    because it behaves like a C-style pointer, but also destroys the dynamic object
    it points to when the smart pointer is destroyed.


    C++ provides a smart pointer template class std::unique_ptr<T> to maintain ownership
    of a dynamic variable of type T. unique_ptr compiles to code that is comparable
    in efficiency to handwritten code.


    # Automating ownership of dynamic variables


    Smart pointers automate ownership of dynamic variables by coupling the lifetime
    of the dynamic variable to the lifetime of the smart pointer that owns it. The
    dynamic variable is properly destroyed and its memory is freed automatically,
    depending on the declaration of the pointer:


