  md: 'machines, using the operating system''s I/O facilities to more efficiently
    emulate I/O when the host and guest virtual machines run the same operating system.


    Some advantages of virtualization include:


    +   - Guest virtual machines are packaged as disk files when they aren''t running.
    The guest VM can be checkpointed and saved, loaded and resumed, and copied and
    run on multiple compute hosts.


    +   - Multiple guest virtual machines can be run concurrently, permitting. Each
    guest VM is isolated from the others by the hypervisor, cooperation with the computer''s
    virtual memory protection hardware. This allows hardware to be commoditized and
    rented by the hour.


    +   - Guest virtual machines can be configured to use a portion of the resources
    (physical memory, processor cores) of a host computer. Computing resources can
    be tailored to fit the requirements of the programs running on each guest VM,
    providing consistent levels of performance and preventing unintended interactions
    among multiple VMs running on the same hardware.


    As with traditional time slicing, C++ remains unaware that it is running within
    a guest VM under a hypervisor. C++ programs may be indirectly aware that they
    have constrained resources. Virtualization is relevant to C++ program design because
    it makes it possible to limit the computational resources consumed by a program
    and necessary for the program to know what resources are actually available.


    # Containerization


    Containerization is similar to virtualization in that containers hold a filesystem
    image and a memory image containing a checkpointed program state. They differ
    in that the container host is an operating system, so I/O and system resources
    can be provided directly instead of emulated less efficiently by the hypervisor.


    Containerization has the same advantages as virtualization (packaging, configuration,
    and isolation) plus containers can run somewhat more efficiently.


    Containerization is not visible to C++ programs running within a container. It
    is relevant to C++ programs for the same reason as virtualization.


    # Symmetric multipcessing


    A symmetric multiprocessor is a computer containing several execution units that
    execute the same machine code and have access to the same physical memory. Modern
    multicore processors are symmetric multiprocessors. The currently executing programs
    and system tasks can be run on any available execution unit, though the choice
    of execution unit may have consequences on performance.'
