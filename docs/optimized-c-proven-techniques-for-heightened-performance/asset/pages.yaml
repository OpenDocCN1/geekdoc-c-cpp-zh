  md: '# Event-oriented programming


    In event-oriented programming, the program is written as a collection of event-handling
    functions that are invoked from a framework. The underlying framework dispatches
    each event from an event queue to the handler function registered for that event.
    Event-oriented programming is similar in many ways to task-oriented programming.
    The framework in an event-oriented program acts like the task scheduler, and the
    event handlers are similar to tasks. The important difference is that in an event-oriented
    program, the framework is single-threaded, and the event-handling functions are
    not concurrent.


    There are several advantages to event-oriented programs:


    +   - Because the underlying framework is single-threaded, no synchronization
    or

    - Event-oriented programs can efficiently handle I/O completion events from nonblocking
    I/O calls. An event-oriented program achieves the same high processor utilization
    as a multithreaded program.


    As with task-oriented programs, the disadvantage of event-oriented programs is
    a problem called *inversion of control*, where the flow of control becomes implicit
    in the order of event messages received. This can make event-oriented programs
    difficult to reason about or debug.


    # Coroutines


    Coroutines are executable objects that explicitly hand execution from one object
    to another, but remember their execution pointers so they can resume if called
    again. Like event-oriented programs, coroutines are not truly multithreaded, so
    no synchronization is required unless they are controlled by multiple threads.


    Two kinds of coroutines can be distinguished. The first kind has its own stack,
    and can relinquish control to another coroutine at any point in execution. The
    second kind borrows the stack of another thread, and can relinquish control only
    at its top level.


    Coroutines may arrive by C++17.


    # Message passing


    In a message-passing program, threads of control take input from one or more sources,
    transform it, and put it into one or more outputs. The connected outputs and inputs
    form a graph with well-defined entry and exit nodes. The items read and written
    by the thread implementing each stage of a message-passing program may be implemented
    as network datagrams, character I/O streams, or data structures in explicit queues.'
