  md: 'One important difference between bug fixing and performance tuning is that
    performance is a continuous variable. A feature is either coded, or it is not.
    A bug is either present or absent. However, performance can be very bad or good
    somewhere in between. Optimization is an iterative process in each time the slowest
    part of the program is improved, a new slowest part appears.


    Optimization is very much an experimental science, calling for a scientific mindset
    to a greater degree than some other coding tasks. To be successful at optimization
    requires observing behavior, forming testable hypotheses based on these observations,
    and performing experiments in measurements that either support or refute the hypotheses.
    Experienced developers often believe they have valid intuitions about optimal
    code. But unless they test their intuitions, they will be wrong. My personal experiences
    writing the test programs for this book revealed several results that contradicted
    my intuitions. Experimentation, rather than intuition, is a theme of this book.


    # # Optimization Is Effective


    It is difficult for developers to reason about the effects of individual coding
    decisions on the overall performance of a large program. Thus, practically all
    complete programs contain significant opportunities for optimization. Even code
    produced by experienced teams with plenty of time can be sped up by a factor of
    30%-100%. For more rushed or less experienced teams, I have seen performance improvements
    of 3 to 10 times. A speedup of more than 10x by tweaking code is less likely.
    However, selection of a better algorithm or data structure can be the difference
    between whether a feature can be deployed or is infeasibly slowly.


    # # It’s OK to Optimize


    Many treatments of optimization begin with a stern warning: don''t! Don''t optimize,
    and if you have to optimize, don''t do until the end of the project, and don''t
    do any more optimizing than you must. For instance, famous computer scientist
    Donald Knuth said of optimization:


    > We should forget about small efficiencies, say about 97% of the time: premature
    optimization is the root of all evil.


    Donald Knuth, Structured Programming with go to Statements, ACM Computing Surveys
    6(4), December 1974, p268. CiteerX: 10.1.1.103.6084'
