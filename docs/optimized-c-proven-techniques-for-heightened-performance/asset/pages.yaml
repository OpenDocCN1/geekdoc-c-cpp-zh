  md: '# Function pointers (pointers to free functions and static member functions)


    C++ allows a program to define variables that are pointers to functions. Function
    pointers permit the programmer to explicitly choose any free function with a specific
    signature, consisting of its list of argument types and return type, to be called
    at runtime when the function pointer is dereferenced. The program selects what
    to call through the function pointer explicitly, by assigning a function to the
    function pointer.


    The code must dereference a pointer to get the execution address of the function.
    It is also unlikely that the compiler can inline these functions.


    # Member function pointers


    Member function pointer declarations identify both the function signature and
    the class in the context of the call is interpreted. The program selects what
    to call through the member function pointer explicitly, by assigning a function
    to the function pointer.


    A member function pointer may have any of several representations. It must be
    general enough to call any member function under any of the complex circumstances
    listed previously. It is not unreasonable to assume worst-case performance for
    a member function pointer.


    # Summary of function call costs


    A C-style void call with no arguments is thus the cheapest, having no cost if
    it can be inlined, and only two memory accesses the cost of two nonlocal transfers
    of execution otherwise.


    A virtual function call belonging to a derived class whose base class has no virtual
    functions, contained in a class having virtual multiple inheritance, is a worst-case
    scenario. Fortunately, it is extremely rare. The code must dereference a table
    in the class instance to determine the offset to add to the class instance pointer,
    form the pointer of the virtually inherited function''s instance, dereference
    the instance to get into the vtable, then get to the function execution address.


    At this point, the reader may be shocked that a function call can be so expensive,
    or how efficiently C++ implements complex features. Both thoughts are appropriate.
    The point to understand is that there are costs to calling functions, and thus
    opportunities for optimization. The bad news is that removing one nonsequential
    memory access is not much of an improvement unless the function is frequently
    called. The good news is that a profiler will point directly to the most frequently
    called functions, allowing the developer to quickly home in on the best targets
    for attention.'
