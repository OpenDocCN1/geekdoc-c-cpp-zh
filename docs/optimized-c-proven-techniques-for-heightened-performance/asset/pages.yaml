  md: '# Avoid Lock Convoys


    A lock convoy occurs when many threads synchronize, pending on a resource or critical
    section. This causes additional congestion because they all attempt to proceed
    once and are made to proceed one at a time, as if in a convoy.


    In a simple case, a thundering herd occurs over and over. There are enough threads
    contending for a mutex that many threads depend on the mutex''s operating system
    signal. When the thread holding the mutex releases it, the event is signaled,
    and all the pending threads become runnable. The first thread to get the processor
    locks the mutex again. All the remaining threads eventually get the processor,
    check the mutex, it is still locked, and go back to pending. The overall effect
    is that the operating system spends a lot of time restarting threads, but most
    threads do not progress. Worse yet, all the threads are still synchronized. They
    will all wake at once when the next thread releases the mutex, and repeat the
    cycle.


    In a more complex case, a thundering herd of threads attempt to acquire a second
    mutex or perform some action, like reading a file, is bottlenecked by the physical
    properties of the device. Since threads are synchronized, they all attempt to
    access the second resource at about the same time. Performance is degraded because
    the threads request the same resource at the same time, causing serialization.
    If they had not been synchronized, they might have progressed.


    Lock convoys are visible as systems that usually run well, but occasionally seem
    to become unresponsive for a few seconds at a time.


    Reducing the number of threads or scheduling threads to start at different times
    may relieve the lock convoy, though there is a risk that it will simply emerge
    in another place. Sometimes it is best simply to acknowledge that certain groups
    of tasks cannot be performed concurrently because they share some memory device
    or bottleneck.


    # Reduce Contention


    Threads in a multithreaded program may contend over resources. At any point where
    two or more threads need the same resource, mutual exclusion causes a thread to
    depend, losing concurrency. There are several techniques to address the problem
    of contention:


    Be aware that memory and I/O are resources


    Not every developer realizes that the memory manager is a resource. The memory
    manager must serialize access in multithreaded systems, or its data structures
    will get corrupted. A large number of threads attempting to allocate dynamic variables
    (std::string is a particular offender) at once may experience performance that
    falls off a cliff suddenly as the number of threads increases.'
