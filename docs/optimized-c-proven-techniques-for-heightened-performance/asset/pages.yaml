    If a and b are instances of the class BigClass, the assignment a = b; calls a
    function of BigClass called the assignment operator. The assignment operator can
    be as simple as copying the fields of b into a. But the point is that it may absolutely
    anything a C++ can do. BigClass has dozens of fields to copy. If BigClass owns
    dynamic variables, these may be copied, resulting in calls to the memory manager.
    If BigClass owns a std::map with a million entries, or even a char array with
    a million characters, the cost of the assignment may be significant.


