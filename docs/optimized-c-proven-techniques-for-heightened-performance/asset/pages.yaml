  md: 'Strings have some behaviors that make them expensive to use, no matter the
    implementation. They are dynamically allocated, they behave as values in expressions,
    and their implementation requires a lot of copying.


    # Strings Are Dynamically Allocated


    Strings are convenient because they automatically grow as needed to hold their
    contents. By contrast, C library functions (strcat(), strcpy(), etc.) act on fixed-size
    character arrays. To implement this flexibility, strings are dynamically dynamically.
    Dynamic allocation is expensive compared to other C++ features, no matter what,
    strings are going to show up as optimization hot spots. The dynamically allocated
    storage is automatically released when a string variable goes out of scope or
    a new value is assigned to the variable. This is more convenient than having to
    manually release the storage, as you would with a dynamically allocated C-style
    character array in the following code:


    ```

    char* p = (char*)malloc(7);

    strcpy(p, "string");

    ...

    free(p);

    ```


    The string''s internal buffer is still a fixed size, though any operation that
    makes the string longer, like appending a character or string, may cause the string
    to exceed the size of its internal buffer. When this happens, the operation gets
    a new buffer from the memory manager and copies the string into the new buffer.


    std::string implementations do a trick to amortize the cost of reallocating storage
    for the character buffer as the strings grow. Instead of making a request to the
    memory manager for the exact number of characters needed, For instance, some implementations
    round up the request to the request to the next power of 2. The string then has
    the capacity to grow to twice its current size before needing to call into the
    memory manager again. The next time an operation needs to extend the length of
    the string, there is room in the existing buffer, avoiding the need to allocate
    a new buffer. The benefit of this trick is that the cost of appending characters
    to a string approaches a constant asymptotically as the strings grow. The cost
    of this trick is that strings carry around some unused space. If the string implements
    a policy of rounding up requests to a power of 2, up to half the storage in a
    string may be unused.


    # Strings Are Values


    Strings behave as values (see "Value Objects and Entity Objects" on page 112)
    in assignments and expressions. Numeric constants like 2 and 3.14159 are values.
