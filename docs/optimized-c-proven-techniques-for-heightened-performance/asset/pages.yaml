  md: 'ries, including stream I/O and the concurrency libraries covered in this book
    (see Chapter 12) throw exceptions. The dynamic_cast operator throws exceptions.
    With exception handling turned off, it isn''t clear what happens when the program
    encounters a situation where it would throw an exception.


    If the program doesn''t throw exceptions, it may completely ignore error codes.
    Otherwise, the program must patiently, carefully pass error codes through its
    many layers of function calls, translating error codes from one code set to another
    at library boundaries and freeing resources as it goes. It must do this whether
    operation succeeds or fails.


    With exceptions, some of the cost of handling errors is moved from the happy path
    of normal program execution to the error path. In addition, the compiler automatically
    reclaims resources by invoking the destructors of all automatic variables on the
    path between the exception throw and the try/catch block that handles the exception.
    This simplifies the logic of the program''s happy path, with consequent performance
    gains.


    In the early days of C++, each stack frame contained an exception: a pointer to
    the list of objects that had been constructed, and must be destroyed if an exception
    was thrown through the stack frame. This context was updated dynamically as the
    program executed. This was undesirable because it put runtime cost in the happy
    path; this may be the source of the legend of the high cost of exception handling.
    A newer implementation maps the objects that need to be destroyed to a range of
    pointer values. This mechanism has no runtime cost unless an exception is thrown,
    so exceptions are very inexpensive. Visual Studio uses this newer no-cost mechanism
    for 64-bit builds, and the older mechanism for 32-bit builds. The mechanism is
    selectable by a compiler switch in Clang.


    # Don''t use exception specifications


    Exception specifications decorate function declarations, saying what exceptions
    the function may throw. A function with no exception specification may throw exceptions
    without penalty. A function with an exception specification may throw only the
    exceptions listed in the specification. If it throws any other exception, the
    program is unconditionally and immediately stopped by a call to terminate().


    There are two problems with exception specifications. One problem is that it is
    difficult to know what exceptions may be thrown by a called function, especially
    one in an unfamiliar library. This makes programs using exception specifications
    brittle and likely to fail suddenly.


    The second problem is that exception specifications negatively affect performance.
    Thrown exceptions must be checked, as if every function call with an exception
    specification entered a new try/catch block.'
