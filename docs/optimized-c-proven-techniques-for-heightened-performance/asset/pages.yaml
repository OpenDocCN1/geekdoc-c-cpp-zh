    # Hinting


    Reduce computation by providing a hint that might improve performance.


    # Optimizing the expected path


    Test for inputs or events at run time in decreasing order of expected frequency.


    # Hashing


    Compute a numerical summary (the hash) of a larger data structure such as a variable-length
    character string. The hash can stand in for the data structure in comparisons
    to improve performance.


    # Double-checking


    Reduce computation by performing an inexpensive check, followed only if necessary
    by an expensive check.


    # Precomputation


    Precomputation is a very general technique whose goal is to reduce computation
    from hot code by performing it earlier, before execution derives at the hot spot.
    Different variations move computation from the hot spot to a less-hot part of
    the code, to link time, compile time, or even design time. In general, the earlier
    the computation can be performed, the better.


    Precomputation is only possible to the extent that the value to be computed does
    not depend on the context. A computation such as this can be precomputed by the
    compiler doesn''t depend on anything in the program:


    ```

    int sec_per_day = 60 * 60 * 24;

    ```


    A related computation like this one depends on variables in the program:


    ```

    int sec_per_weekend = (date_end - date_beginning + 1) * 60 * 60 * 24;

    ```


    The trick with precomputation is to either realize that (date_end + 1) may have
    an unchanging value in the program, so it can be replaced with 2, or to factor
    out the part of the expression that can be precomputed.'
