  md: '# Move Virtual Destructor to Base Class


    The destructor of any class that will have derived classes should be declared
    virtual. This is necessary so that if a delete-expression references a pointer
    to the base class, both the derived class destructor and the base class destructor
    will be called.


    There is another reason to provide some virtual function declaration in the most
    base class of any hierarchy: to ensure that atable pointer will be included in
    the base class.


    The base class has a special position in a class hierarchy. If the base class
    has virtual member function declarations, the vtable pointer will be at offset
    zero in any class instance derived from this base class. If the base class declares
    member variables and doesn''t declare virtual member functions, some derived class
    declares virtual member functions, every virtual member function call will have
    to add an offset to the "this" pointer to obtain the address of the vtable pointer.
    Ensuring that at least one member function in the base class forces the vtable
    to appear at offset zero, which generates more efficient code.


    The destructor is an excellent candidate to be virtual if the base class will
    have derived classes. The destructor is called only once during the life of a
    class instance, the cost of making it virtual is minimal except for small classes
    that are constructed and destroyed at a high rate in the program (and rarely are
    these small classes used to derive subclasses).


    This may seem like such a rare case that it doesn''t deserve, but I have worked
    on several projects where important class hierarchies had a base class containing
    an intrusive reference count, transaction ID, or some variable. This base class
    had little knowledge about what classes might be derived from it. Usually the
    first derivation in the hierarchy is an abstract base class declaring bunch of
    virtual member functions. One thing the base class did know was that instances
    would eventually be destroyed.


    # Optimize Expressions


    Below the statement level, at the level of arithmetic expressions involving basic
    data types (integers, floats, pointers), there is a final opportunity to optimize.
    If a very hot function consists of a single expression, it may be the only opportunity.


    > Stop and Think

    Modern compilers are very good at optimizing expressions involving basic data
    types. They are so good that they range from amazing all the way up to provably
    optimal. But they are not very brave. They optimize expressions only when they
    can prove that the optimization does not change the behavior of the program.'
