  md: 'The array new-expression works the same way, but with the added complexity
    that any of several constructors might throw an exception, requiring the array
    new-expression to destroy all successfully constructed instances and return the
    memory to the store before returning or rethrowing the exception.


    Why are there two kinds of new-expression, one for arrays and one for instances?
    The array new-expression may allocate space to store the number of array elements,
    as well as the space allocated for the array itself. That way, array delete-expression
    does not provide this value. This extra overhead is not necessary for single instances.
    This C++ behavior was designed at a time when memory was far more precious than
    it is today.


    # Non-throw new


    If placement-params consists of the tag std::now, the new-expression does not
    throw std::bad_alloc. Instead, it returns nullptr without attempting to construct
    an object.


    Historically, there was a time when C++ compilers did not properly implement exception
    handling. Code written for these old compilers, or ported from C, needed an allocation
    function that returned when it ran out of memory.


    Some industries—namely the aerospace and automotive industries—have imposed coding
    standards that prohibit the throwing of exceptions. This causes a problem because
    new-expressions are otherwise defined to throw on error; hence the need for a
    non-throwing new-expression.


    There is received wisdom that exception handling is slow, and therefore a non-throwing
    new-expression should be faster. However, modern C++ compilers implement an exception
    handling mechanism with very low cost unless an exception is thrown, so the truth
    of this wisdom may be compiler-dependent. See "Use No-Cost Exception Handling"
    on page 183 for a more extensive discussion of the cost of exception handling.


    # Placement new performs placement without allocation


    If placement-params is a pointer to extending valid storage, the new-expression
    does not call the memory manager, but simply places type at the location indicated
    by the pointer, which must point to sufficient storage to hold that type. Placement
    new is used like:


    ```

    char mem[1000];

    class Foo {...};

    Foo* foo_p = new (mem) Foo(123);

    ```


    ![](img/60f8bcb8b0ed0d129f96949a34d3e33e_348_0.png)'
