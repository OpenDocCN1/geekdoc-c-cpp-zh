    \n```\nclass Foo {\n  std::unique_ptr<int> value_;\npublic:\n  ...\n  Foo(Foo&&\
    \ rhs) {\n    value_ = rhs.release();\n  }\n\n  Foo(const Foo& rhs) : value_(nullptr)\
    \ {\n    if (rhs.value_) {\n      value_ = std::make_unique<int>(rhs.value_);\n\
    \    }\n  }\n};\n```\n\nActually the autogenerates the move constructor and move\
    \ assignment operator only in the simple case when the program does not specify\
    \ a copy constructor, assignment operator, or destructor; and the move operator\
    \ is not disabled in any member or base class. This rule makes sense because the\
    \ presence of definitions for these special functions implies that something special\
