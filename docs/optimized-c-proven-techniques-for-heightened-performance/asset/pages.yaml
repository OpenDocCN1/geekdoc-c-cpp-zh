    # Lock-free programming


    +   - Hic Suntracones (English translation: Here Be Dragons)

    - Inscription on the Hunt-Lenox Globe (c. 1503–07), implying dangerous unknown
    shores


    Lock-free programming refers to programming practices that permit multithreaded
    updates without the need for mutual exclusion. In a lockfree, expensive mutexes
    are replaced by atomic operations synchronized by the hardware. Lock-free data
    structures can perform significantly better than conventional containers guarded
    by a mutex, especially when many threads access the same container.


    Lock-free array, queue, and hash-table container classes in C++ have been released
    publicly. Boost has lock-free stack and queue containers, but they have been tested
    only on the GCC and Clang compilers. Intel''s Threading Building Blocks has lock-free
    array, queue, and hash-map containers. These containers are not identical to the
    equivalent C++ standard library containers due to the requirements of lock-free
    programming.


    Lock-free data structures are insanely difficult to reason about. Even well-known
    experts argue about the correctness of published algorithms. For this reason,
    I recommend sticking to widely published and well-supported code than attempting
    to build lock-free data structures on your own.


    # Remove Code from Startup and Shutdown


    A program can launch as many threads as needed to perform tasks concurrently or
    make use of CPU cores. One part of the program, however, is quite difficult to
    run concurrently: the code executed before main() gets control, and after main()
    exits.


    Before `main()`, all variables with static storage duration (“Storage of Variables”
    on page 108) are initialized. For plain-old-data types, this initialization has
    zero cost. The linker points the variables at the initialization data. But for
    variables of class type and static storage duration, the initialization process
    calls each variable’s constructor, in a single thread, in a particular order by
    the standard.


    It is easy to forget that variables as strings, which are initialized with static
    string constants, actually execute code during initialization. Likewise, constructors
    that contain function calls or non-const expressions in their initializer lists
    are executed at run time, even if the constructor body is empty.'
