    This section gathers together a few general techniques for improving performance
    that are so useful that they deserve specific mention. The reader may recognize
    some of these patterns as the core of familiar data structures, C++ language features,
    or hardware innovations:


    Precomputation


    +   Remove computation from the hot part of the program by performing it before
