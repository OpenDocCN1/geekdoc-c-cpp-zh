  md: '# C++ Memory Management API Refresher


    The C++ toolkit for managing dynamic variables was introduced in "C++ Dynamic
    Variable API Refresher" on page 113. This toolkit contains an interface to the
    memory manager consisting of new- and delete-expressions, memory management functions,
    and standard library allocator template classes.


    # The Life Cycle of Dynamic Variables


    A dynamic variable goes through five distinct life stages. The most common variation
    of the new-expression performs the allocate and place stages. After the use stage,
    a delete-expression performs the destroy and free stages. C++ facilities for managing
    each of these stages separately.


    Allocate


    The program asks the memory manager to return a pointer to a contiguous region
    of memory containing at least a specified number of untyped bytes. Allocation
    can fail if memory is not available. The C library function malloc() and the various
    overloads of the C++ operator new() function manage the allocate phase.


    Place


    The program establishes the initial value of the dynamic variable, placing the
    value into the allocated memory. If the variable is a class instance, a simple
    type, it is optionally initialized. Placement can fail if the constructor throws
    an exception, requiring allocated storage to be returned to the memory manager.
    New-expressions participate in this phase.


    Use


    The program reads values from the dynamic variable, calls member functions of
    the dynamic variable, and writes values to the dynamic variable.


    Destroy


    If the variable is a class instance, the program calls its destructor to perform
    a final operation on the dynamic variable. Destruction is an opportunity for the
    dynamic variable to return any system resources it holds, complete any cleanup,
    say any last words, and make ready to go into the good night. Destruction can
    fail if the destructor throws an exception that is not handled in the destructor
    body. If this happens, the program unconditionally terminates. Delete-expressions
    manage this phase. It is possible to destroy a variable without freeing its storage
    by calling its destructor explicitly.'
