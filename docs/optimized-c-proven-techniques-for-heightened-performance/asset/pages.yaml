    # Code in Haste, Repent at Leisure


    Marry in haste, repent at leisure.


    > —Samuel Johnson (1709–1784), English lexicographer, essayist, and poet


    Stability of interface is a core deliverable of a library. A library designed
    in a rush, or a bunch of independently written functions pulled together into
    a library, will not match call and return practices, allocation behavior, or efficiency.
    The pressure to make a casually built library consistent will arise immediately.
    However, the time required to fix all functions in the library may prevent developers
    from acting to fill this need.


    Designing an optimized library is designing like other C++ code, only the stakes
    are higher. Libraries, by definition, are meant for broad use. Any imperfections
    in the design, implementation, or performance of a library are shared among all
    users. Casual coding practices, which can be tolerated in noncritical code, are
    more problematic when developing libraries. Old-school development methods, including
    upfront specification and design, documentation, and module tests, find their
    uses in development of critical code like libraries.


