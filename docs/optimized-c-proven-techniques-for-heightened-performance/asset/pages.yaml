    lots of time being spent in copy constructors and memory management functions
    may point to heavily used classes that would benefit from the addition of a move
    constructor and move assignment operator.


    +   Update the C++ compiler (and standard library, if it doesn''t come with the
    compiler) to rerun performance tests after updating, because this compiler change
    may significantly improve the performance of code using standard library components
    like strings and vectors, changing the hot function leader.


    +   Check third-party libraries to see whether there is a newer version that supports
    move semantics. Move semantics in the compiler buyer doing nothing at all if libraries
    are not updated to use move semantics.


    +   Define a move constructor and move assignment operator for classes with identified
    problems.


    # Subtleties of Move Semantics


    I won''t say move semantics are a hack. This feature is too important, and the
    standard writers really did a great job of making it semantically similar to copy
    construction. But I think it''s fair to say that move semantics are subtle. This
    is one of the features of C++ that has to be used carefully, and with knowledge,
    to get anything out of it.


    # Moving instances into std::vector


    It''s not enough to write a move constructor and move assignment operator if you
    want your object efficiently moved when it''s in a std::vector. The developer
    must declare the move constructor and move assignment operator noexcept. This
    is necessary because std::vector provides the strong exception safety guarantee:
    that an exception occurring in a move operation leaves the vector as it was before
    the operation occurred. The copy constructor doesn''t alter the source object.
    The move constructor destroys it. In any exception the move constructor violates
    the exception safety guarantee.


    If the move constructor and move assignment operator are not declared noexcept,
    std::vector uses the less efficient copy operations. There may be no warning from
    the compiler that this has happened, and the code will still run correctly, if
    slowly.


    noexcept is a very strong promise. Making the noexcept promise means calling into
    the memory manager, or I/O, or any other functions that might throw an exception.
    Or it means swallowing exceptions, with no way to report the program'
