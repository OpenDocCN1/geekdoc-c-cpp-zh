  md: 'This example places an instance of class Foo on top of the array mem. Placement
    new calls a class constructor to perform initialization for class instances. For
    a basic type, placement new performs initialization instead of construction.


    Since placement new does not allocate storage, there is no corresponding placement
    delete. The instance of Foo placed on top of mem by placement new is not automatically
    destroyed when mem goes out of scope. It is up to the developer to properly destroy
    instances created with placement new by explicitly calling the class''s destructor.
    In fact, if an instance of Foo is placed into storage declared to be an instance
    of Bar''s destructor is called with undefined and typically disastrous results.
    Placement should be used on memory returned by operator new(), or on memory occupied
    by an array of char or some other basic type.


    Placement new is used in the Allocator template parameter of standard library
    containers, which must place class instances on previously allocated but unused
    memory. See "Provide Custom Standard Library Allocators" on page 343 for details.


    # Custom placement new, the half-formed hinter of allocation


    If placement-new is anything other than std::or a single pointer; the new-expression
    is called custom placement new. C++ does not impose any meaning on the custom
    placement new-expression. It is available for the developer''s user to allocate
    storage in an unspecified way. The custom placement new-expression searches for
    an overload of operator delete() or operator delete[] whose first argument matches
    size_t, and whose subsequent arguments match the types of the expression list.
    If the constructor of the dynamic object throws an exception, the placement new-expression
    searches for an overload of operator delete() or operator delete[] whose first
    parameter is void*, and whose subsequent arguments match the types of the expression
    list.


    Placement new is useful if the program needs to establish more than one mechanism
    to create dynamic variables, or to pass arguments for memory manager diagnostics.


    An issue with custom placement new is that there is no way to specify a matching
    "custom delete-expression". Thus, while the placement overloads of operator delete()
    are invoked when the object constructor throws an exception in the new-expression,
    delete-expressions cannot call these overloads. This creates a conundrum for the
    developer, since the standard says behavior is undefined if the operator delete()
    does not match the operator new(). The matching placement operator delete() must
    be declared, because it is called in a new-expression if the object constructor
    throws an exception. There''s no way to call it from a delete-expression. However,
    the standard committee is working to address this issue in a future version of
    the C++ standard.'
