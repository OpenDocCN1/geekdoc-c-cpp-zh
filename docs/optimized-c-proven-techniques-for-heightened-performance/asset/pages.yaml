    # Resolution is not accurate


    On Windows, the GetTickCount() function returns an unsigned 32-bit integer. If
    a program calls GetTickCount() at the beginning and end of an operation, the difference
    between the returned values may be interpreted as the number of milliseconds that
    elapsed between the calls. The resolution of GetTickCount() is thus 1-millisecond.


    For example, the following block of code measures the relative performance of
    an arbitrary function Foo() on Windows, calling Foo() in a loop. Tick obtained
    at the start and end of the loop give a time in milliseconds for the loop:


    ```

    DWORD start = GetTickCount();

    for (unsigned i = 0; i < 1000; ++i) {

    Foo();

    }

    DWORD end = GetTickCount() << end-start << "ms" << endl;

    cout << "1000 calls to Foo() " << "ms" << endl;

    ```


    If Foo(proper) performed some substantial calculation, this block of code might
    produce the output:


    > 1000 calls to Foo() took 16ms


    Unfortunately, the accuracy of the GetTickCount() may be 10 milliseconds or 15.67
    milliseconds, as documented in Microsoft''s web page on GetTickCount(). That is,
    if you GetTickCount() twice in a row, the difference may be 0, or 1 millisecond,
    or 10, 15, or 16 milliseconds. So, the fundamental precision of the measurement
    is 15 milliseconds, and the extra resolution is valueless. The result output from
    the previous code block might have been 10 ms or 20 ms or exactly 16 ms.


    What is especially frustrating about GetTickCount() is, beyond a resolution of
    1 millisecond, it is not guaranteed to be implemented in any particular way, or
    in the same way on two different Windows computers.


