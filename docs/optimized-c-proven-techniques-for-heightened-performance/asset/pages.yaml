  md: '# CHAPTER 5


    # Optimize Algorithms


    Time heals what reason cannot.


    —Seneca the Younger (c. 4 BC–65 AD)


    If a program takes hours to run, when it needs to take two seconds, the only optimization
    likely to be successful is to select a more efficient algorithm. Most optimizations
    improve performance by only a constant factor. Replacing an inefficient algorithm
    with a better-performing one is the only sure ticket to an order-of-magnitude
    improvement in performance.


    Design of efficient algorithms is the topic of many while computer science textbooks
    and numerous doctoral dissertations. There are specialist computer scientists
    who devote their careers to analysis of algorithms. There’s no way to cover the
    topic in a single short chapter. Instead, this chapter looks briefly at the time
    cost of algorithms, providing a guide to know when you’re in trouble.


    I take a look at common searching and sorting algorithms, and present a toolkit
    for optimizing searching and sorting in existing programs. In addition to picking
    an algorithm that is optimal for unknown data, there are algorithms with exceptional
    performance on data that is sorted or nearly sorted, or that has other special
    properties.


    Computer scientists study important algorithms and data structures because they
    are examples of how to optimize code. I have collected some important optimization
    techniques in the hope that the reader will come to recognize places where they
    can be applied.'
