    # Summary


    +   Strings are expensive to use because they are dynamically allocated, they
    behave as values in expressions, and their implementation requires a lot of copying.

    Treating strings as objects instead of values reduces the frequency of allocation
    and copying.

    Reserving space in a string reduces the overhead of allocation.

    Passing a const reference to a string into a function is almost the same as passing
    the value, but can be more efficient.

    Passing a result string out of a function reuses the actual argument’s storage,
    which is potentially more efficient than allocating new storage.

    An optimization that only sometimes removes allocation overhead is still an optimization.

    Sometimes a different algorithm is easier to optimize or inherently more efficient.

    The standard library class implementations are general-purpose and simple. They
    are not necessarily high-performance, or optimal for any particular use.'
