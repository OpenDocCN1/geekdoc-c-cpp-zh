    # Storage Duration of Variables


    Every variable has a storage duration, or lifetime, that describes the period
    of time during which it is occupied by the variable, having a meaningful value.
    The cost to allocate memory for the variable depends on the storage duration.


    The C++ syntax for declaring variables can be confusing, due to the need to maintain
    compatibility with C syntax while adding several new concepts. In C++, the storage
    duration is not directly specified, but is inferred from the variable''s declaration:


    Static storage duration


    Variables with static storage live in memory reserved by the compiler. Each static
    variable occupies a fixed amount of memory at a fixed address determined at compile
    time. The memory for static variables is reserved for the life of the program,
    and destroyed after execution leaves main(). Static variables declared in a function
    scope are only constructed "before the first time execution enters a function",
    which can be as early as when global statics are constructed, or as late as the
    first call to function. C++ specifies an order of construction and destruction
    for global static variables so that the developer can reason exactly about their
    lifetimes, but the rules are so complex that they serve as a warning than a behavior
    to make use of.


    Each static variable is known by a name, and may also be referred to by pointers
    and references. The name that refers to a static variable, as well as pointers
    and references to that variable, may be visible to code in the constructors and
    destructors of other static variables before it has a meaningful value and after
    its value is destroyed.


    There is no runtime cost to create the storage for static variables. However,
    the storage is not available for reuse. Static variables are appropriate for data
    that will be used for the whole life of the program.'
