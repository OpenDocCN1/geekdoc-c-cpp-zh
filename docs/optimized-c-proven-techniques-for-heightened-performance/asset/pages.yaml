  md: '# Slice Data Structures


    Slicing is a programming idiom in which one variable refers to a portion of another.
    For instance, the experimental string_view type proposed for C++17 refers to a
    sub-string of another character string, containing a char* pointer to the beginning
    of the substring and a length that places the substring''s end within the string
    being referred


    Slices are small, easily copied objects, without the high cost of allocating storage
    for and copying contents into a subarray or substring. If the sliced data structure
    is owned by shared pointers, slices can be completely safe. But experience teaches
    that slices are ephemeral. They typically serve their purpose briefly and then
    go out of scope, before the sliced data structure can be deleted. string_view,
    for instance, uses an unowned pointer into the strings.


    # Implement Move Semantics


    With respect to optimization, the move semantics added to C++11 are the biggest
    thing to happen to C++ in, well, ever. Move semantics solve several recurring
    prob- from previous versions of C++. For example:


    +   - An object is assigned to a variable, causing the internal contents of the
    object to be copied at significant runtime expense, when the original object is
    imme-ately destroyed. The effort of copying is wasted, because the contents of
    the original object could have been reused.

    - The developer wishes to assign an entity (see "Value Objects and Entity Objects"
    on page 112), such as an auto_ptr or resource handle, to a variable. The "copy"
    operation in the assignment is undefined on such an object because it has a unique
    identity.


    Both cases bite in dynamic containers as std::vector, where the internal storage
    of the container must be reallocated the number of items in the container grows.
    The first case makes reallocating a container more expensive than con-tainers
    necessary. The second case prevents entities like auto_ptr from being stored in
    con-tainers at all.


    The problem arises because the copy operation performed by copy constructors and
    assignment operators work fine for basic types and unowned pointers, but doesn-t
    make sense for entities. Objects with this type of member could be put in C-style
    arrays, but not in dynamic containers like std::vector.


    Prior to C++11, C++ offered no standard way to efficiently move the contents of
    a variable to another variable, leaving nothing behind, for situations when the
    expense of copy was not needed.'
