  md: 'From the standpoint of optimization, the challenge of concurrency is to find
    enough independent tasks to fully utilize available computing resources, even
    if some tasks must wait on external events or availability of resources.


    C++ offers a modern library for shared-memory thread-based concurrency. This is
    by no means the only way that C++ programs can implement a system of cooperating
    programs. Other kinds of concurrency also have an impact on C++ programs, and
    are worth that a brief look.


    This section examines the C++ memory model and the basic toolkit for using shared
    memory in multthreaded programs. In my opinion, the gnarlier topic in C++. It''s
    gnarly because our sad little monkey brains are single-threaded. They can reason
    about just one cause-and-effect stream at a time.


    # A Walk Through the Concurrency Zoo


    Concurrency can be provided to programs by the computer hardware, operating systems,
    by function libraries, and by the features of C++ itself. This section describes
    a number of concurrency features and their impact on C++.


    The fact that certain concurrency features are built into C++ while others are
    provided by library code or the operating system must not be an endorsement of
    one concurrency model over others. Some facilities are built in because they have
    to be. There is no other way to provide them. The most notable forms of concurrency
    include:


    # Time slicing


    This is a function of a scheduler in the operating system. In time slicing, an
    operating system maintains a list of currently executing programs and tasks, and
    allocates chunks of time to each program. Any time a program is waiting for an
    event or resource, the program is taken off the operating system''s runnable list,
    making its share of the processor available for the other programs.


    An operating system is processor- and hardware-dependent. It makes use of a timer
    and periodic interrupts to mediate the scheduling of processes. C++ remains unaware
    that it is being time sliced.


    # Virtualization


    In typical kind of virtualization, a lightweight operating system called a hypervisor
    allocates chunks of processor time to a guest virtual machine. The guest virtual
    machine (VM) contains a filesystem and a memory image, which is typically an operating
    system running one or more programs. When a hypervisor runs a guest virtual machine,
    certain processor instructions and accesses to certain regions of memory cause
    a trap into the hypervisor, allowing the hypervisor to emulate I/O devices and
    other hardware resources. In another type of virtualization, a conventional operating
    system hosts the guest virtual'
