    Even state-of-the-art malloc() is exactly the kind of compromise that creates
    optimization opportunities. operator new() can be overridden at the class level
    ("Class-specific operator new() gives free control of allocation" on page 331).
    When code dynamically creates instances of a class is hot, a class-specific memory
    manager can improve performance.


    If a class implements operator new(), this function is instead of the global operator
    new() when requesting memory for instances of a class. A class-specific operator
    new() can take advantage of extra knowledge not available to the default version.
    All allocation requests for instances of a particular class request the number
    of bytes. Memory managers for same-sized requests are particularly easy to write,
    and run efficiently for a variety of reasons:


