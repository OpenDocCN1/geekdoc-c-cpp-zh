    # Implement the "Copy on Write" Idiom


    Copy on write (sometimes abbreviated COW) is a programming idiom used to copy
    class instances containing expensive-to-copy dynamic variables efficiently. COW
    is a well-known optimization with a long history. It has been used frequently
    over the years, especially in the implementation of C++ string classes. QString
    characters in Windows use COW. Some older implementations of std::string also
    use COW. However, the C++11 standard forbids it in implementing std::string. COW
    is not an optimization, so it must be used judiciously, despite its august tradition.


    Normally, if an object that owns a dynamic variable is copied, a new copy must
    be made of the dynamic variable. This is called a deep copy operation. An object
    that contains nonowning pointers can get by copying the pointers, rather than
    the pointed-to variables. This is called a shallow copy.


    The idea of copy on write is that two copies of an object are the same until one
    is modified. So, until one or the other is modified, they can share pointers to
    any expensive-to-copy parts. Copy on write initially performs a shallow copy operation,
    and delays performing the deep copy until the element of the object is mutated.


    In a modern C++ implementation any class member is implemented using a shared-ownership
    smart pointer such as std::shared_ptr. The class constructor copies the shared-ownership
    smart pointer, delaying the creation of a new copy of the dynamic variable until
    any copy wants to mutate the dynamic variable.


    Any mutation in the class checks the reference count of the shared pointer before
    proceeding. If the reference count is greater than 1, indicating ownership, the
    operation makes a new copy of the object, swaps the shared pointer member with
    the shared pointer to the new copy, and releases the old copy, decrementing its
    reference count. Now the mutation operation can proceed, knowing that the dynamic
    variable is unaltered.


    It''s important to construct the dynamic variable in the COW class using std::make_shared().
    Otherwise, use of the shared pointer costs an extra trip to the memory manager
    to get the reference count object. For many dynamic variables, this is the same
    cost as simply copying the dynamic variable into new storage and assigning it
    to a (nonsharing) smart pointer. So, unless many copies are made, or mutating
    operators are not usually called, the COW idiom may not buy anything.'
