    # Preallocate Dynamic Variables to Prevent Reallocation


    As data is appended to a std::string or std::vector, its dynamically allocated
    internal storage becomes full. The next append operation causes the string or
    vector to allocate a larger block of storage and copy the contents to the new
    storage. The call to the memory manager and the copy perform many memory accesses
    and consume many instructions. Yes, it''s true that an append takes O(1) time,
    but the cost of proportionality (how big the constant time in milliseconds) can
    be significant.


    Both string and vector have a member function, reserve(size_t n), that tells the
    string or vector to ensure there is sufficient space for at n entries. If the
    size can be computed or estimated, a call to reserve() keeps the string or vector''s
    internal storage needing to be reallocated as it grows to this:


    ```

    std::string errrmsg;

    errmsg.reserve(100); // only one allocation for all appending

    errmsg += "Error 1234: variable ";

    errmsg += varname;

    errmsg += "was used before set. Undefined behavior.";

    ```


    A call to reserve() acts as a hint to the string or vector. Unlike allocating
    a worst-case size buffer, the only penalty for low guess is the possibility of
    additional reallocations. Even an extravagant overestimate for the expected size
    is not a problem if the string or vector is used briefly and destroyed. shrink_to_fit()
    member function of std::string or std::vector can also be used to return unused
    space to the memory manager after reserve() to preallocate a string or vector.


