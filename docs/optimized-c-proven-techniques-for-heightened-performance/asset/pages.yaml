  md: '# Optimization War Story


    Many programming problems have simple solutions that are infeasibly slow, and
    more subtle published solutions that are relatively efficient. A team''s best
    option may be to seek an outside expert in algorithm analysis to determine whether
    an efficient solution to a particular problem may exist. Retaining such a consultant
    can be well spent.


    I once was on a team developing functional testers (including the Fluke 9010A
    pictured in Chapter 2). Our team tester had a built-in RAM test for diagnosing
    manufacturing defects in the device under test. I once thought to examine the
    coverage of this test by connecting the tester to a Commodore PET computer and
    running the RAM test over its video memory, so that the patterns were visible
    on the PET''s built-in. I inserted faults into the RAM circuit by the crude but
    effective method of jabbing a screwdriver between adjacent pins of the PET''s
    RAM chips. We were all quite surprised to learn that faults vastly changed the
    patterns written to RAM were not detected by our test, which had been developed
    by some very smart engineers. Furthermore, Moore''s Law was doubling the amount
    of RAM we needed to test every 18 months. We needed a new RAM test algorithm that
    was much faster than the existing test, and demonstrably better fault coverage.


    An exhaustive RAM test is infeasible, taking O(n²) accesses to memory (where n
    is the number of RAM addresses—“Time Cost of Algorithms” on page 92 for more the
    “Big-O notation”). Published RAM test algorithms at that time were mostly infeasibly
    slow O(n²) or O(n!) tests developed when memory devices held only a few hundred
    words. Words that were theoretically sound required 30 accesses to each cell to
    achieve basic fault coverage. I had an idea for a much better test using pseudandom
    sequences, but lacked the mathematical know-how to demonstrate its soundness.
    We amply demonstrated that intuition alone did not guarantee success. We needed
    an algorithm.


    A call to my old professors at the University of Washington led to a PhD candidate
    David Jacobson who was happy to trade his research assistant stipend for a developer
    paycheck for a while. Our collaboration led to a best-in-class RAM test requiring
    only five passes through memory, several other novel test algorithms, and half
    a dozen US patents.


