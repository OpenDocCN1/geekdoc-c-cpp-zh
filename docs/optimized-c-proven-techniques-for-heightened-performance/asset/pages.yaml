    # Optimization Is Part of Software Development


    Optimization is a coding activity. In traditional software development processes,
    optimization takes place after Code Complete, during the integration and testing
    phase of a project, where the performance of a whole program can be observed.
    In an Agile development process, one or more sprints may be allocated to optimization
    after a feature with performance goals is coded, or as needed to meet performance
    targets.


    The goal of optimization is to improve the behavior of a correct program so that
    it also meets customer needs for speed, throughput, memory footprint, power consumption,
    and so on. Optimization is thus as important to the development process as coding
    features is. Unacceptably poor performance is the same kind of problem for users
    as bugs and missing features.'
