    # Wraparound


    Wraparound is what happens when the tick counter of a clock achieves its maximum
    value and increments to zero. Twelve-hour analog clocks wrap around every day
    at noon and midnight. Windows 98 hung if it ran continuously for 49 days (see
    Q216641) due to wraparound of a 32-bit millisecond tick counter. The Y2K bug occurred
    when time was a two-digit year wrapped around. The Mayan calendar wrapped around
    2012, supposedly hering the end of the world. In January 2038, the Unix epoch
    (signed, 32 bits since 00:00 January 1, 1970 UTC) will wrap around, possibly causing
    the actual end of the world for some long-lived embedded systems. The problem
    with wraparound is that, in the absence of additional bits to record it, the next
    increment of time is numerically before the previous time. Clocks that wrap around
    are good only for durations that are less than the wraparound interval.


    For instance, on Windows, the GetTickCount() function returns a tick count with
    1-millisecond resolution in a 32-bit unsigned integer. The value returned by GetTickCount()
    wraps around every 49 days. GetTickCount() may be used for timing operations that
    take much less than 49 days without concern. If a program calls GetTickCount()
    at the beginning and end of an operation, the difference between the returned
    values may be interpreted as the number of milliseconds elapsed between calls.
    For example:


    ```

    dword start = GetTickCount();

    dobTask();

    dword end = GetTickCount();

    cout << "Startup " << end-start << " ms" << endl;

    ```


    The C++4 standard implements unsigned arithmetic produces a correct answer even
    in the presence of wraparound.


    GetTickCount() is less effective for remembering time since startup. Many long-lived
    servers can remain for months or years. The problem with wraparound is that, in
    the absence of bits to record the number of wraparounds, end-start might imply
    no wraparound, or one, or more.


    Starting in Vista, Microsoft added the GetTickCount64() function, which returns
