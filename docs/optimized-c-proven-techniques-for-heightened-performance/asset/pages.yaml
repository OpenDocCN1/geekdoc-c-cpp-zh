  md: '# Optimization War Story


    I was introduced to the 90/10 rule in one of my first projects as a professional
    developer: an embedded device with a keyboard interface, which very coincidentally
    was very hot. called the 9010A (Figure 3-1).


    ![](img/60f8bcb8b0ed0d129f96949a34d3e33e_49_0.png)


    There was a function that polled the keyboard to see whether the STOP key had
    been pressed. This function was executed frequently by every routine. Hand-optimizing
    the C compiler''s Z80 assembly language output code for this one function (a 45-minute
    task) improved overall throughput by 7%, which was a big deal in this particular
    device.


    This experience was typical of optimization efforts in general. At the beginning
    of the optimization process, a lot of run time was spent in place in the program.
    The place was very obvious: a housekeeping activity done repeatedly, at each iteration
    of every loop. The optimization activity making the painful code to code in assembly
    language instead of C. But the scope of the assembly language was extremely limited,
    reducing the risk entailed by the choice to use assembly language.


    The experience was also typical in that this block of code was very hot. After
    we improved this code, another block of code took first place as the most frequently
    executed—but its contribution to overall run time was much smaller. It was small,
    in fact, that we stopped optimizing after just this change. We could find no other
    change that gave us even a 1% speedup.'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'A consequence of the 90/10 rule is optimizing every routine in a program is
    not helpful. Optimizing a small part of your code gives you practically all the
    performance improvement you are going to get. Identifying the hot 10% is time
    spent. Selecting code to optimize by guesswork is likely wasted time.


    I would like to return to the quote by Don Knuth from the first chapter. Here
    is a longer version of the same quote:


    > Programmers waste enormous amounts of thinking about, or worrying about, the
    speed of noncritical parts of their program, and these attempts at efficiency
    actually have a strong negative impact when debugging and maintenance are considered.
    We should forget about small efficiencies, say about 97% of the time: premature
    optimization is the root of all evil.


    —Donald Knuth, Structured Programming with go to Statements, ACM Computing Surveys
    6 (Dec 1974): 268. SeeCiteX: 10.1.1.103.6084


    Dr. Knuth was not warning that optimization in general was evil, even as people
    have suggested. He was saying only wasting time optimizing the noncritical 90%
    of a program was evil. Apparently he was aware of the 90/10 rule too.


    # Amdahl''s Law


    Amdahl''s Law, coined and named after computer engineering pioneer Gene Amdahl
    describes how much overall performance will improve when a portion of the code
    is optimized. There are several ways to express Amdahl''s Law, but with regard
    to optimization, it may be expressed by the equation


    $S_T = \frac{1}{(1-P) + P}$


    where $S_T$ is the proportion of improvement in the whole program run time resulting
    from an optimization, $P$ is the proportion of total run time that was subject
    to optimization, and $S_p$ is the proportion of improvement in the optimized portion
    P.


    For example, suppose a program takes 100 seconds of run time. Through profiling
    (see "Profile Program Execution" on page 37), you discover that the program spends
    80 seconds performing multiple calls to a single function, f. Now suppose you
    recode f to make it 30% faster. How much would this improve the program''s overall
    time?


    P, the proportion of the original run time spent within function f, is 0.8. $S_p$
    is 1.3.

    Plugging this into Amdahl''s Law yields


    $S_T = \frac{1}{(1-0.8) + \frac{0.2+0.62}{1.3}} = 1.22$'
