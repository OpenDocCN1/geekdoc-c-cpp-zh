    # Make Synchronization More Efficient


    Synchronization is the overhead cost of shared-memory concurrency. Reducing this
    overhead cost is an important pathway to optimal performance.


    The received wisdom is that synchronization primitives like mutexes are expensive.
    The truth, of course, is complicated. On both Windows and Linux, for instance,
    the mutex upon which `std::mutex` is built is a hybrid design that busy-waits
    on an atomic variable for a short period of time, then pens on an operating system
    signal if it cannot rapidly acquire the mutex. The cost of the "happy path," where
    no other thread holds the mutex, is low. The cost when the thread must press on
    the signal is measured in milliseconds. The important cost of a mutex is the cost
    of waiting for another thread to release it, not the cost of calling `lock()`.


    Multithreaded programs frequently run into trouble when many threads contending
    to acquire the same mutex. When contention is low, holding the mutex usually doesn''t
    slow other threads down. When contention is high, any contended mutex causes threads
    to run one at a time, spoiling the developer''s attempt to execute the parts of
