  md: '# Summary


    +   - Naive use of dynamically allocated variables is the greatest performance
    killer in C++ programs. When performance matters, new is not your friend.


    +   - A developer can be an effective optimizer knowing nothing other than how
    to reduce calls into the memory manager.


    +   - A program can globally change how memory is allocated by providing a definition
    of ::operator new() and ::operatoroperator delete().


    +   - A program can globally change how memory is managed by replacing malloc()
    and free().


    +   - Smart pointers automate ownership of dynamic variables.


    +   - Shared ownership of dynamic variables is more expensive.


    +   - Create class instances statically.


    +   - Create class members statically and use two-part initialization if needed.


    +   - Use a master pointer to own dynamic variables, and unowned pointers instead
    of sharing ownership.


    +   - Create copy-free functions that pass data out in out parameters.


    +   - Implement move semantics.


    +   - Prefer flat data structures.'
