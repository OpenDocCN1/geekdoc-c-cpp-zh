    time the bucket array is reallocated. However, references point to the nodes;
    they are invalidated only on deletion.


    Hash tables like std::unordered_map have several parameters to adjust in pursuit
    of optimal performance. This is either a strength or a weakness, depending on
    the developer''s point of view.


    The number of entries in the unordered map is its size. The computed ratio size
    / buckets is called the load factor. A load factor greater than 1.0 implies that
    some buckets have a chain of multiple entries, reducing lookup performance for
    these keys (in other words, the hash is not perfect). In real hash tables, collisions
    among the keys cause entries to appear in chains when the load factor is less
    than 1.0. A load factor less than 1.0 implies that there are unused buckets consuming
    space in the unordered map''s backbone array (in other words, the hash is not
    minimal). When the load factor is less than 1.0, the value 1 - load factor is
    a lower bound on the number of empty buckets, but since hash functions are imperfect,
    the amount of unused space is generally higher.'
