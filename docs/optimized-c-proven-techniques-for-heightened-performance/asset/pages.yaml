  md: '# Use Better Data Structures


    Selecting the most appropriate data structure has a profound effect on performance.
    This is partly because the algorithms for inserting, iterating, sorting, and retrieving
    entries have a runtime cost that depends on the data structure. In addition, different
    data structures make differing use of the memory manager. It is also partly because
    the data structure may have good cache locality, or not. Chapter 10, Optimize
    Data Structures explores the performance, behavior, and trade-offs among data
    structures provided by the C++ standard library. Chapter 9, Optimize Searching
    and Sorting discuss the use of standard library algorithms to implement table
    structures on top of simple vectors and C arrays.


    # Increase Concurrency


    Most programs must wait for activities taking place in the tiresome, lumbering
    world of physical reality to complete. They must wait for files to be read off
    mechanical disks, pages to be returned from the Internet, or users'' fingers to
    press mechanical switches. Any time a program''s progress is blocked waiting for
    such an event is a wasted opportunity to perform some other computation.


    Modern computers have more than one processor core available to execute instructions.
    If work is parce out to several processors, it can be completed sooner.


    Along with concurrent execution we need tools for synchronizing concurrent threads
    that they can share data. These tools can be used well or poorly. Chapter 12,
    Optimize Concurrency covers some considerations in synchronizing concurrent threads
    of contention.


    # Optimize Memory Management


    The memory manager, the part of the C++ runtime library that manages the allocation
    of dynamic memory, is frequently executed code in many C++ programs. C++ has an
    extensive API for memory management, though most developers have never used it.
    Chapter 13, Optimize Memory Management shows some techniques for improving the
    performance of memory management.


    # Summary


    This book helps the developer identify and exploit the following opportunities
    to improve code performance:


    +   * Use better compilers, and turn on the optimizer.'
