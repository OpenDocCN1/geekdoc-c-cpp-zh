  md: 'A classic example of Polymorphism is the Draw() function defined in a hierarchy
    of classes derived from DrawableObject, representing graphical objects to draw
    on the screen. When a program calls drawObjPtr->Draw(), the implementation of
    Draw() is selected by dereferencing the virtual function table in the instance
    pointed to by drawObjPtr. The selected implementation of Draw() makes a triangle
    when the class is an instance of Triangle, a box when it is an instance of Rectangle,
    and so forth. The program declares DrawableObject::Draw() virtual, so that the
    proper class must select several implementations at run time, the virtual function
    table is a very fast mechanism, despite its overhead of two additional memory
    loads and their associated pipeline stalls.


    Still, polymorphism can occasionally cause unnecessary overhead. A class may have
    originally been designed to facilitate a hierarchy of derived classes that is
    never implemented, or a function may have declared virtual in the expectation
    of polymorphic behavior that was never implemented. In the preceding example,
    all the drawable objects might end up being implemented as a list of points that
    are connected in order, so that the base class version of Draw() is always used.
    Removing the virtual specifier on the DrawableObject declaration of Draw() when
    there are no overrides speeds up all calls to Draw.


    # Stop and Think


    There is tension between the designer''s wish to say DrawableObject can be the
    root of a set of DrawableObject-derived classes, and the optimizing developer''s
    wish to improve performance because the Draw() member function has no overrides.
    Presumably the member function has been fingered by some experiment as being costly.
    If so, the designer will probably bow out. It''s easy to put the virtual specifier
    back in later if needed. The wisest optimizing know better than to weaken the
    design without good reason, and don''t go chasing every virtual function in a
    program with scalpel in hand.


    # Discard Unused Interfaces


    In C++, virtual functions can be used to implement interfaces. An interface is
