- img_proc: true
  md: 'Improving this function by 30% improved the overall program run time by 22%.
    In this case, Amdahl''s illustrates the 90/10 rule, and provides an example of
    how powerful even modest performance improvement can be in the 100 of the code.


    Let''s look at a second example. Suppose again that a program takes 100 seconds
    of run time. Through profiling, you discover that a single function, g, consumes
    10 seconds of run time. Now suppose you recode g so that it runs 100 times faster.
    How much will this improve the program''s run time?


    P, the proportion of the original run time spent within g, is 0.1. $S_p$ is 100.
    Plugging this into Amdahl''s yields


    ```

    $S_T = \frac{1}{(1-P) + \frac{0.1}{100}} = 0.9 + 0.001 = 1.11$$

    ```


    In this case, Amdahl''s provides a cautionary tale. Even if heroic coding or black
    magic reduces the run time of g to zero, it is still in the unimportant 90%. The
    overall performance improvement is still 11%, to two decimal places. Amdahl''s
    says that even a very successful optimization isn''t valuable if the optimized
    code doesn''t account for much of the overall program''s run time. The lesson
    of Amdahl''s Law is, that when your colleague comes to a meeting excited that
    he knows how to make some calculation 10 times faster, it doesn''t *necessarily*
    mean all your performances are over.


    # Perform Experiments


    Developing software is always experimental, in the sense that you start up the
    program thinking that it is going to do a particular thing, and then watch to
    see whether it does. Performance tuning is experimental in a more formal sense.
    You must start with correct code, in the sense of code does what you expect it
    to do. You have to look at this code with a fresh set of eyes and ask, "Why is
    this code hot?" Why this particular function, out of the many hundreds in your
    program, appear at the top of the profiler''s naughty list? The function wasting
    time doing something redundantly? Is there a faster way to do the same computation?
    The function using resources? The function, in fact, as efficient as it possibly
    could, but just called a lot of times, leaving no opportunity to improve performance?


    Your proposed answer to the question "Why is this code hot?" forms the hypothesis
    you will test. The experiment takes the form of two elapsed measurements of the
    running program: one before you make a change and one after. If the second time
    is less than the first, your experiment *validates* the hypothesis.'
