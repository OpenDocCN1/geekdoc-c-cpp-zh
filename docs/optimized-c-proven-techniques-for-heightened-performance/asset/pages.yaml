  md: 'Starting in Windows 2000, the TSC could be read by calling the function BOOL
    QueryPerformanceCounter(LARGE_INTEGER*), which produces a tick count with no particular
    resolution. The resolution can be obtained through a call to BOOL QueryPerformanceFrequency(LARGE_INTEGER*),
    which returns the frequency in ticks per second. LARGE_INTEGER is a struct holding
    64 bits of integer in a signed format, because of the version of Visual Studio
    at these times were introduced introduced did not have a native 64-bit signed
    type.


    A problem with the initial version of QueryPerformanceCounter() was that its tick
    rate depended on the processor''s clock. The processor clock was different for
    different processors and motherboards. Older PCs, notably those with processors
    from Advanced Micro Devices (AMD), did not have a TSC at the time. When the TSC
    was not available, QueryPerformanceCounter() fell to the low-resolution tick count.


    Windows 2000 also added GetSystemTimeAsFileTime(FILETIME*), which returns the
    number of 100-nanosecond ticks since 00:00 January 1, 1601 UTC. FILETIME is a
    struct holding 64 bits of integer, this time in an unsigned format. Although the
    displayed resolution of the tick counter appears to be very high, some implementations
    use the slow counter instead by GetTickCount().


    More problems with QueryPerformanceCounter() soon appeared. Some processors implemented
    a variable clock rate to manage power consumption. This caused the tick to change.
    In multiprocessor systems using several discrete processors, the value returned
    by QueryPerformanceCounter() depended on which processor a thread ran on. Processors
    began to implement instruction ordering, so that the RDTSC instruction might be
    delayed, reducing the accuracy of software using the TSC.


    To solve these problems, Windows used a different counter, typically the Advanced
    Configuration and Power Interface (ACPI) power management timer, for QueryPerformanceCounter().
    Using this solved the synchronization problem in multiprocessor, but significantly
    increased latency. In the meantime, Intel specified the TSC to be maximum, nonchanging
    clock frequency. Intel also added the nonscalable RDTSC instruction.


    Since Windows 8, a high-resolution hardware tick count has been available. void
    GetSystemTimePreciseAsFileTime(FILETIME*) produces a high-resolution tick with
    fixed frequency and microsecond accuracy on any current system running Windows
    8 or later.


    The summary of this history is that PCs were never designed as clocks, so that
    the tick counters they provide are unreliable. If the past 35 years are any guide,
    future processors and future operating systems may continue to frustrate any hope
    of getting a solid, high-resolution tick count.


