    \n# Use Switch instead of if-else-else\n\nThe flow of control in an if-else if-else\
    \ statement is linear: evaluate each condition, and if true, execute the first\
    \ controlled block. Otherwise evaluate each if condition, and execute the controlled\
    \ block for the first n that evaluates to true. Testing a variable for each n\
    \ values, takes an if-then-else sequence with n controlled blocks. If all possible\
    \ cases are about equally likely, the if-then-else if sequence makes very frequently,\
    \ as for event or dispatch code, the cost adds significantly.\n\nThe switch statement\
    \ will also test a variable for each n values, but the form of the switch statement,\
    \ compares the switch value against a series of constants, lets the compiler perform\
    \ a number of useful optimizations.\n\nIn a frequently occurring case, when the\
    \ constants to be tested are taken from a set of sequential or nearly sequential\
    \ values, the switch statement compiles into a jump indexed by the test value\
    \ or an expression derived from the test value. The switch statement performs\
    \ a single indexing operation and jumps to the address in the table. The cost\
    \ of the comparison is O(1), no matter how many cases appear. The cases don't\
    \ have to be presented in sequential order; the compiler can sort the table.\n\
    \nWhen the constants form a sequence with large gaps, a jump table becomes unnecessarily.\
