    Much of the C++ standard library consists of template classes and functions that
    provide efficient code.


    # Philosophy of the C++ Standard Library


    In keeping with its mission as a systems programming language, C++ provides a
    Somewhat Spartan library. The standard library is meant to be simple, general,
    and fast. Philosophically, functions and classes enter the C++ standard library
    either because they cannot be provided any other way, or because they promote
    wide reuse across multiple operating systems.


    Advantages of the C++ approach include that C++ programs can run on hardware that
    provides no operating system at all, and that programmers can choose a library
    tailored to the features of a particular operating system when that is appropriate,
    or use a cross-platform library when platform independence is the goal.


    By contrast, some programming languages, including C and Java, provide extensive
    standard libraries that include window user interface frameworks, web servers,
    socket networking, and other large subsystems. An advantage of the all-inclusive
    approach is that developers need only learn one set of libraries to be effective
    on any supported platform. But these libraries impose many requirements on the
    operating systems on which they can be run (sometimes deliberately). The libraries
    provided with a programming language come to represent a common denominator, less
    powerful than the native window system or networking capabilities of any specific
    operating system. They can be somewhat limiting to programmers accustomed to the
    native capabilities of a specific OS.


