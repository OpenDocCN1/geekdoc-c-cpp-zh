    # High-Performance Memory Managers


    By default, all requests for storage pass through ::operator new(), and released
    storage passes through ::operator delete(). These functions form C++s default
    memory manager. The default C++ memory manager must meet many demands:


    +   * It must perform efficiently, because it is likely to be hot.

    * It must work correctly in multithreaded programs. Access to data structures
    in the default memory manager must be serialized.

    * It must allocate many-sized objects (like list nodes) efficiently.

    * It must allocate many differently sized objects (like strings) efficiently.

    * It must allocate very big data structures (I/O buffers, arrays of a million
    ints), as well as small data (like a single pointer).

    * To be maximally efficient, it must be aware of alignment boundaries for pointers,
    cache lines, and virtual memory pages, at least for larger allocated memory blocks.

    * Its runtime performance must not degrade over time.

    * It must efficiently reuse memory returned to it.


    Meeting the many demands of a C++ memory manager is an open and evolving challenge
    spanning academic research, with compiler vendors in uneven pursuit of the state
    of the art. In some situations, a memory manager may not need to meet all demands.
    These facts provide opportunities for developers to optimize.


    The version of ::operator new() shipped with most C++ compilers is a wrap around
    the C function malloc(). In the early days of C+, these malloc implementations
    were designed to meet the relatively simple needs of C programs for dynamic buffers,
    rather than the preceding list of requirements of C++ programs. Replacing a simple,
    vendor-provided malloc() with a sophisticated memory manager was so sufficient
    optimization that developers could build a reputation as the wizards of this simple
    spell.


    A variety of more-less self-contained memory libraries have been written that
    claim a substantial performance advantage over the default memory manager. A program
    heavily uses dynamic variables including strings and standard containers, it''s
    tempting to view these malloc() replacements as a silver bullet, improving performance'
