  md: '# Summary of First Optimization Attempt


    Table 4-1 summarizes the results of the optimization effort for remove_ctrl().
    These results were obtained by pursuing one simple rule: remove memory allocations
    and associated copy operations. The first optimization produced the most significant
    speedup.


    Many factors affect the absolute timings; including the processor, fundamental
    clock rate, bus frequency, compiler, and optimizer. Ive test results of both debug
    and release (optimized) builds to demonstrate this point. While the release build
    code is much faster than the debug code, improvement is visible in both debug
    and release builds.


    Table 4-1. Performance summary VS 2010, i7


    | Function | Debug | Release | Release vs. debug |

    |---|---|---|--|

    | remove_ctrl() | 967 us | | 24.8 us | 3802% |

    | remove_ctrl_mutating() | 104 us | 834% | 1.72 us | 1,341% | 5923% |

    | remove_ctrl_reserve() | 102 us | 0% | 1.47 us | 17% | 6853% |

    | remove_ctrl_ref_args_it() | 215 us | 9% | 1.04 us | 21% | 20559% |

    | remove_ctrl_cresult_it() | 215 us | 0% | 1.02 us | 2% | 21012% |

    | remove_ctrl_cstrings() | 1 us | 9698% | 0.15 us | 601% | 559% |


    The percentage of improvement appears more dramatic in release builds. This is
    probably an effect of Amdahl''s Law. In the debug build, function inlining is
    turned off, which increases the cost of every function call and causes the fraction
    of run time devoted to memory allocation to be lower.


    # Second Attempt at Optimizing Strings


    There are other roads the developer can travel in the quest for better performance;
    we''ll explore a few more options in this section.


    # Use a Better Algorithm


    One option is to improve the algorithm. The original remove_ctrl() uses a simple
    algorithm that copies one character at a time to the result string. This-fortunate
    choice produces the worst possible allocation behavior. Example 4-8 improves on
    the original design by moving strings to the result string. This change has the
    effect of reducing the number of allocate-copy operations. Another optimization
    introduced in remove_ctrl_block() caches the length of the argument string to
    reduce the cost of the loop termination clause of the outer for loop.'
