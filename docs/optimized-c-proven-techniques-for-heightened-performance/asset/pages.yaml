  md: '# Optimize Existing Libraries


    Optimizing an existing library is like clearing a minefield. It may be possible.
    It may be necessary. But it is a difficult job that requires patience and attention
    to detail, boom!


    The easiest kind of library to optimize is well designed, with good separation
    of concerns and good test cases. Unfortunately, this kind of library is already
    optimized. The reality is that if you are asked to optimize a library, it is probably
    a mess of functionality squeezed into functions or classes that do too much or
    too little.


    Making changes to a library introduces the risk that some other program relies
    on unintended or undocumented behavior of the existing implementation. While making
    a run faster is not itself likely to cause problems, some accompanying change
    in behavior may be more of a problem.


    Making changes to an open source library introduces potential incompatibility
    between your project''s version and the main repository. This becomes a problem
    when the open source library is next revised to fix bugs or add functionality.
    Either your changes must manually be propagated to the changed library, or your
