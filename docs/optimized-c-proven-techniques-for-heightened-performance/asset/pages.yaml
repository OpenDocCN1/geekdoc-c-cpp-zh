  md: '# Declare Brief Functions Inline


    An effective way to remove function call overhead is to inline. To inline a function,
    the compiler must have access to the function definition at the point of the call
    to be inlined. Functions whose bodies appear inside the body of a class definition
    are implicitly declared inline. Functions defined outside the class definition
    may be explicitly declared inline by declaring them with storage class inline.
    Additionally, the compiler may choose on its own inline functions when their definitions
    appear before their first use in a particular compilation unit. Although the C++
    standard says that the inline keyword is only a ''hint'' to the compiler, compilers
    must be good at inlining in order to be commercially successful.


    When the compiler inlines a function, it has additional opportunities to improve
    the code, beyond the call and return statements. Some arithmetic may be performed
    at compile time. Some branches may be eliminated because the compiler determines
    they cannot be taken when arguments have particular values. Inlining is a means
    of removing redundant computation to improve performance, by performing the computation
    at compile time.


    Function inlining is probably the most powerful code optimization. In the difference
    in performance of the "debug" versus "release" builds in Visual Studio (or the
    -d flags in GCC), comes mostly because by default, debug builds turn off inlining.


    # Define Functions Before First Use


    Defining a function (providing the function body) above the point of the first
    call to the function gives the compiler a chance to optimize the function call.
    The compiler can choose on its own to inline a call if it has the function definition
    available when it compiles a call to that function. This even works with virtual
    functions, if the compiler can see both the function body and the code that instantiates
    the class variable, pointer, or reference through which the virtual function is
    called.


    In C++, virtual member functions are frequently used to implement runtime polymorphism.
    Polymorphism allows a member function to do one of several different semantically
    related things, depending on the object on which the member function is called.


    To implement polymorphic behavior, a base class defines a virtual member function.
    Any derived classes can choose to override the behavior of the base class function
    specialized to that derived class. The various implementations are related by
    a semantic concept that must be implemented differently for each derivation.'
