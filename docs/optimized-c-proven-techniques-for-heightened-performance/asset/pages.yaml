    std::list shares many properties with std::vector and std::deque. Like vector
    and deque, items can be pushed onto the back of a list in constant time. Like
    with a deque (unlike a vector), items can be pushed onto the front of a list in
    constant time. Furthermore, unlike either a vector or deque, items can also be
    inserted into the middle of a list in constant time, giving an iterator to the
    insertion point. Like a deque and a vector, list can be efficiently sorted. Unlike
    with vectors and deques, there is no efficient way to search a list. std::find(),
    which takes O(n) time, is as good as you can do.


    The received wisdom was that std::list is inefficient to be useful, but I did
    not find when I tested its performance. While std::list may be 10 times more expensive
    to copy or create as std::vector, it is quite competitive with std::deque. Pushing
    onto the tail of a list is less than twice as expensive as a vector. Traversing
    and sorting a list are only 30% more expensive than the same operations on a vector.
    For most of the operations I performed, std::list was less expensive than std::deque.


    The same wisdom holds that std::list, with its forward and reverse links and constant-time
    size() method, is more expensive than necessary for the features it provides.
    However, a little performance testing shows that std::list is almost identical
    to std::forward_list in C++11. However std::forward_list in the cost of its operations,
    at least on PC hardware.


    Because std::list has no backbone array that must be reallocated, iterators and
    references to list items are never invalidated by insertion. They become invalid
    only if the items they point to are deleted.


