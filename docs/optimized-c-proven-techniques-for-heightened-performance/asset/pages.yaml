  md: "```\nif (s[i] >= 0x20)\n    result = result + s[i];\n\nreturn result;\n```\n\
    \nAn experiment to remove memory_ctrl() ran in 2693 milliseconds. The improved\
    \ version in Example 13-12 performed the same test in 1,124 milliseconds, about\
    \ 1.4 times faster. This performance improvement is significant, but as we saw\
    \ in Chapter 4, other optimizations performed even better.\n\nWriting a custom\
    \ memory manager or allocator can be effective, but it has less benefit than optimizations\
    \ that remove calls to the memory manager altogether.\n\n# Summary\n\n+   * There\
    \ may be more fruitful places to look for performance improvement than the memory\
    \ manager.\n* Whole-program performance improvements from replacing the default\
    \ memory manager ranged from negligible to 30% in several large open-source programs.\n\
    * Memory managers for same-sized requests are particularly easy to write, and\
    \ run efficiently.\n* All allocation requests for instances of a particular class\
    \ request the same number of bytes.\n* operator new() can be overridden at the\
    \ class level.\n* The standard library container classes std::list, std::map,\
    \ std::multimap, std::set, and std::multiset all create a data structure from\
    \ many identical nodes.\n* Standard library containers take an Allocator argument\
    \ that allows the same ability to customize memory management as a class-specific\
    \ operator new().\n* Writing a custom memory manager or allocator can be effective,\
    \ but it has less benefit than optimizations that remove calls to the memory manager\
    \ altogether."
