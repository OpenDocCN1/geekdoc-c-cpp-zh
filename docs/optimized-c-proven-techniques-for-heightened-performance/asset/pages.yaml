    circumstances. A base class defines the interface by declaring a set of pure virtual
    functions (with declarations, but no function body). Because pure virtual functions
    have no body, C++ prevents the base class from being instantiated. Derived classes
    implement the interface by providing overrides (definitions) for all the pure
    virtual functions in the interface class. An advantage of the interface'
