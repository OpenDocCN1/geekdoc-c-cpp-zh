    that behaved consistently across hardware models and software versions.


    As a developer you must therefore be prepared to “roll your own” software stopwatch,
    knowing that it may change in the future. To make this possible, I will discuss
    how time is measured, and what tools support measuring time on computers.


    # “A Little Learning” About Measuring Time


    A little learning is a dangerous thing.


    > Alexander Pope, “An Essay on Criticism”, 1774


    A perfect measurement would exactly capture the size, weight, or, in the case
    of this book, duration of a measured phenomenon every single time. Making a perfect
    measurement is as likely as an archer reliably hitting the exact center of the
    bull’s-eye with every shot, splitting arrow after arrow. Such archery only happens
    in storybooks, and it is the same with measurement.


    Real measurement experiments (like real archers) must contend with variation:
    sources of error that spoil the quest for perfection. Variation comes in two flavors:
    random'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'and systematic. Random variations affect each measurement differently, like
    a puff of wind that causes a particular arrow to drift in flight. Systematic variations
    affect every measurement in a similar way, like the way an archer’s stance can
    bias every shot so that it goes to the left of its intended destination.


    Variation itself can be measured. Summary measures of variation form properties
    of a measurement precision and trueness. Together these properties form the intuitive
    property called accuracy.


    # Precision, trueness, and accuracy


    It is apparently the case that the scientists who get really excited about measurement
    argue endlessly without terminology. You need only look up “accuracy” on Wikipedia
    for a taste of how controversy there is about what words use for explaining agreed-upon
    concepts. I choose to employ terms in the context of the 1994 standard ISO 5725-1,
    “Accuracy (trueness and precision) of measurement methods and results - Part 1:
    General principles and definitions” (1994).


    A measurement is precise if it is free from random variation. That is, if the
    phenomenon is measured repeatedly, and the measured values are close together,
    the measurement is precise. A series of precise measurements may still contain
    systematic variation. An archer who puts a grouping of shots in the same off-center
    area can be said to be precise even if not very accurate. His target might look
    like Figure 3-2.


    If I measure a phenomenon (say, the run of time) 10 times, and get the same result
    all 10 times, I may hypothesize that my measurement is precise. ( in any experiment,
    I should remain skeptical until I have a lot of evidence.) If I get the same result
    six times, a slightly different result three times, and a very different result
    once, the measurement is less precise.


    A measurement is true if it is free from systematic variation. That is, if I measure
    the same phenomenon repeatedly, and the average of all the results close to the
    actual quantity being measured, then I may believe the measurement is true. Individual
    measurements may be affected by random variation so that they are closer or further
    from the actual quantity. Trueness is not a skill rewarded in archery. In Figure
    3-3, the average of the four shots would be in the bull’s-eye only if it were
