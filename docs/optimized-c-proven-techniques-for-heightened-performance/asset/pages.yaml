    # Use a Better String Library


    The definition of std::string was originally vague, to allow for a wide range
    of implementations. The demands of efficiency and predictability eventually drove
    clarifications to the C++ standard that eliminated most novel implementations.
    The behavior defined for std::string is thus a compromise, having evolved out
    of competing considerations over a long period of time:


    +   * Like standard library containers, std::string provides iterators to access
    the individual characters of the string.

    * Like C characters, std::string provides an array-like indexing notation using
    operator[] to access its elements. std::string also provides a mechanism to obtain
    a pointer to a C-style null-terminated version of the string.

    * std::string has a concatenation operator and value-returning functions that
    give it value semantics, similar to BASIC strings.

    * std::string provides a limited set of operations that some users find constraining.


    The desire to make std::string as efficient as C-style char arrays pushes the
    representation toward contiguous memory. The C++ standard requires that the iterators
    be random-access, and forbids copy-on-write semantics. This makes it easier to
    define and reason about what actions invalidate iterators into a std::string,
    but it limits the scope for clever implementations.


    Furthermore, the std::string implementation that comes with a commercial C++ compiler
    must be robust enough that it can be tested, to guarantee that it produces standard-conforming
    behavior and acceptable efficiency in every conceivable situation. The cost to
    the compiler vendor for a mistake is high. This pushes implementations toward
    simplicity.


    The standard-defined behavior of std::string in a million-character class induces
    some weaknesses. Inserting a single character causes the suffix of the string
    to be copied, and perhaps reallocated. Similarly, all the value-returning substring
    operations must allocate and copy their results. Some developers search for optimization
    opportunities by lifting one or more of the previous constraints (iterators, indexing,
    C-string access, value semantics, simplicity).'
