    # Measurement resolution


    The resolution of a measurement is the size of the units in which the measurement
    is presented.


    An archer shooting at a target gets the same score for putting an arrow anywhere
    in a given ring. The bull’s-eye is not an infinitesimal point, but rather a circle
    of a certain diameter (see Figure 3-4). A shot is either a bull’s-eye or is in
    the first ring, second ring, and so on. The width of the ring is the resolution
    of an archery score.


    ![](img/60f8bcb8b0ed0d129f96949a34d3e33e_63_0.png)


    Figure 3-4. Resolution: a hit anywhere in a circle is the same score


    The useful resolution of a time measurement is limited by the duration of the
    underlying fluctuation. A time measurement can be one tick or two ticks, but nothing
    in between. The period between these ticks is the clock’s useful resolution.


    An observer may perceive events as happening between two ticks of a slow clock
    like a pendulum clock. This just means we have a faster (less accurate) clock
    in their heads that informally compare to the pendulum clock. An observer wanting
    to make measurements of imperceptible durations like milliseconds has only the
    clock’s ticks to go on.


    There is no required connection between the accuracy of a measurement and the
    resolution with which it is presented. If I log my daily activities, I may be
    able to report that it took two days to write this section of the book. The useful
    resolution of this measurement is in this case one day. I suppose I could convert
    this time to seconds, reporting instead that I took 172,800 seconds. But unless
    I had a stopwatch in my hand, reporting the time in seconds might give a false
    sense that the measurement'
