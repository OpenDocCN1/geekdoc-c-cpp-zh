    \ of the need to check for the presence of the key and later to find the insertion\
    \ point. Both of these operations traverse the same set of nodes in the map’s\
    \ binary tree structure:\n\n```\niterator it = table.find(key); // O(log n)\n\
    if (it != table.end()) {\n    // key found path\n    it->second = value;\n} else\
    \ {\n    // key not found path\n    table.insert(key, value); // O(log n)\n}\n\
    ```\n\nIf the program captures the result of the first search, it can use that\
    \ as a hint to insert(), making the insert in O(1). There are two ways to improve\
    \ this idiom, depending on the needs of the program. If all you need to know whether\
    \ the key was initially found, you can use a version of insert() that returns\
    \ a pair containing an iterator to the element or inserted entry, and a bool that\
    \ is true if the entry was found and false if it was inserted. This solution works\
    \ if the program knows how to initialize the entry before finding whether it is\
    \ present or not, or if the value is expensive to update:\n\n```\nstd::pair<value_t,\
    \ bool> result = table.insert(key, value);\nif (result.second) {\n    // key found\
    \ path\n} else {\n    // key not found path\n}\n```\n\nThe second method involves\
    \ finding the key or the insertion point through a call to lower_bound() for a\
    \ C++98-style hint, or upper_bound() for a C++11-style hint. lower_bound() returns\
    \ an iterator to the smallest entry in whose key is less than the search key,\
    \ or to end(). This iterator is the hint if the key must be inserted, and points\
    \ to the key if an existing entry must be updated. This method makes no assumptions\
    \ about the entry to be inserted:\n\n```\niterator it = table.lower_bound(key);\n\
