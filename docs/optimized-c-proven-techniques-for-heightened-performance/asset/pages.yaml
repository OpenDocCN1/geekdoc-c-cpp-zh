  md: 'Always group constant expressions with parentheses, or put them on the left
    side of the expression, or better yet, separate them out into the initializer
    of a const variable or put them in a constexpr function if your compiler supports
    this C++11 feature. This allows the compiler to efficiently evaluate the constant
    expression at compile time.


    # Use Less-Expensive Operators


    Some arithmetic operations are less expensive to compute than others. For instance,
    all but the smallest processors in today can perform a shift or addition in one
    internal clock cycle. Few specialized digital signal processor chips have single-cycle
    multipliers, but for PCs, multiplication is an iterated computation similar to
    the multiplication procedure taught to schoolchildren. Division is a more complex
    iterated procedure. This hierarchy of costs provides opportunities for optimization.


    For instance, the integer expression x*4 can be encoded more efficiently as x<<2.
    Any half-decent compiler already performs this reduction in strength optimization.
    But what if the expression is x*y or x*func()? In many cases, the compiler cannot
    determine that y or func() always produces a value that is a power of two. This
    is where the programmer’s knowledge and skill beats the compiler. If one argument
    or the other can be modified to replace the exponent with power of two value,
    the developer can rewrite the expression to use shift instead of multiplication.


    Another optimization is to rewrite a multiplication into a sequence of shifts
    and adds. For instance, the integer expression x*9 can be rewritten as x<<8+x*1,
    which in turn can be rewritten as (x<<3)+x. This optimization is most effective
    when the constant operand does not contain many bits, because each set expands
    a shift-and-add term. It''s effective on desktop- or handheld-class processors
    that have instruction caches and pipelined execution units, and on very small
