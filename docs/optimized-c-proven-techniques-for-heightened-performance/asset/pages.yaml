    Although the standard does not specify which sorting algorithm is used, it was
    written so std::sort could be implemented using some variation of quicksort, and
    std::stable_sort could be implemented using merge sort. C++03 requires std::sort
    to have average performance of O(n log, n). Implementations conforming to C++03
    implemented std::sort using quicksort, usually with some median-picking trick
    to reduce the cost of quicksort''s O(n^2) worst-case. C++11 requires the worst-case
    performance to be O(n log, n). Implementations conforming to C++11 are generally
    hybrid sorts like Timsort or introsort.


    std::stable_sort is usually a variant of merge sort. The standard''s peculiar
    wording is that std::stable_sort runs in O(n log, n) time if sufficient memory
    can be allocated, but otherwise runs in O(n, n^2) time. A typical implementation
    is to use merge sort if the recursion depth is not too great, and heapsort it
    is.


    The value of a stable sort is that a program can sort records by each of several
    criteria (like first name, and last name) and get records sorted by the second,
    then by the first criterion within the second (like last name, and then first
    name last name). Only stable sorts provide this property. This additional property
    justifies having two sorts.


