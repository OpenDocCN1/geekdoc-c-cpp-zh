    # Taking Bigger Bites


    The aim of taking bigger bytes is to reduce the number of iterations of a repeated
    operation, cutting down on the overhead of repetition. Strategies include:


    +   - Carry large blocks of input from the operating system or send large blocks
    of output to the operating system to reduce the overhead of calling into the kernel
    for small blocks or individual items. The downside of bigger bytes, especially
    when writing, is that data may be lost if the program crashes. This can be a problem,
    for log files.

    - Move or clear buffers by word or codeword instead of byte-by-byte. This optimization
    only improves performance if the ranges are aligned to the same-sized boundaries.

    - Compare strings by word or codeword. This only works on big-endian machine,
    and not on the x86, which is little-endian (see "Memory Words have a Big End and
    a Little End" on page 20). Machine architecture-dependent hacks like this can
    be dangerous because they are nonportable.

    - Perform more work when a thread wakes up. Check for multiple units of work to
    process rather than relinquishing the processor after a single unit. This saves
    the overhead of repeated wakeup.'
