  md: "The fname argument contains a filename. If the file cannot be opened, file_reader()\
    \ prints an error message to standard output, and returns the empty string. Otherwise,\
    \ std::copy() copies f strebuf into std::stringstream s's strebuf.\n\n# Create\
    \ a Parsimonious Function Signature\n\nFrom a library design standpoint, file_reader()\
    \ could be improved (see \"ParsimonY is a Virtue in Library Design\" on page 194).\
    \ It does several different things: it opens a file; it performs error handling\
    \ (in the form of reporting failure to open the file); it reads the open, value\
    \ into a string. As a library function, this combination of responsibilities makes\
    \ file_reader() hard to use. For instance, the client program implements exception\
    \ handling, or wants to use a Windows resource for error message strings, or just\
    \ wants to print to std::cerr, file_reader() can't be used. file_reader() creates\
    \ new memory and returns it, a pattern that potentially causes multiple copies\
    \ to be made as the returned value is passed up a calling chain (see \"Copy Free\
    \ Libraries\" on page 134). When the file cannot be opened, file_reader() returns\
    \ the empty string. It also returns the empty string if the file is readable,\
    \ but doesn't contain any characters. It would be nice to get an error indication\
    \ so these cases could be distinguished.\n\n**Example 11-2** is an updated version\
