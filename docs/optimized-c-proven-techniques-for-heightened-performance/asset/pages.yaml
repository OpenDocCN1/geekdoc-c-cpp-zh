  md: '# operator delete() frees allocated memory


    A delete-expression invokes operator delete() to return memory for a dynamic variable
    to the runtime system, and operator delete[] to return memory for a dynamic array.


    The new operators and delete operators work together to allocate and free memory.
    If a program defines an operator new() that allocates memory from a special pool
    or in a special way, it must define a matching operator delete() in the same scope
    to return memory to the pool from which it allocated, or behavior is undefined.


    # Memory management functions from the C library


    C++ provides the C-library functions malloc(), calloc(), and realloc() to allocate
    memory, and the free() function to return memory that is no longer needed. These
    functions are provided for compatibility with C programs.


    void* malloc(size_t size) implements the allocate phase of a dynamic variable''s
    lifetime, returning a pointer to storage sufficient to hold size bytes, or nullptr
    if no storage is available.


    void free(void* p) implements the free phase, returning the storage pointed to
    by p to the manager.


    void* calloc(size_t count, size_t size) implements the allocate phase of a dynamic
    array. It performs a simple computation to convert a number count array elements,
    to a number of bytes, and returns the value of a call to malloc().


    void* realloc(void* p, size_t size) changes the size of a block of memory, moving
    the block to a new block. The contents of the old block are copied to the new
    block, up to the minimum of the new and old sizes. realloc() must be used carefully.
    Sometimes it moves the pointed-to block and deletes the old block. If it does
    the block become invalid. It reuses the existing block, which happens to be bigger
    than the requested size.


    According to the C++ standard, malloc() and free() act upon a region of memory
    called the "heap," while overloads of operator new() and operator delete() operate
    on a region of memory called "free store." The careful language of the standard
    preserves the option for library developers to implement two sets of functions
    differently. That said, the requirements for memory management are similar in
    C and C++ worlds. It is not sensible for a compiler to have two parallel but different
    implementations. In all standard library implementations of which I am aware,
    operator new() calls malloc() to actually allocate storage. A program can globally
    change how memory is managed by replacing malloc() and free().


    ![](img/60f8bcb8b0ed0d129f96949a34d3e33e_346_0.png)'
