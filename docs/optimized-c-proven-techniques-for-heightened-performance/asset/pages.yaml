  md: '# Ownership of Variables


    Another important concept of C++ variables is ownership. The owner of a variable
    determines when the variable is created and when it is destroyed. Sometimes the
    storage duration tells when the variable is created and destroyed, ownership is
    a separate concept, and it is an important one for optimization of dynamic variables.
    Here are some guidelines:


    Global ownership


    Variables with static storage duration are owned by the program as a whole. They
    are constructed before execution enters the `main()` function and destroyed after
    the program returns from `main()`.


    Lexically scoped ownership


    Variables with automatic storage duration are owned by a lexical scope consisting
    of a block of code surrounded by curly braces. This may be a function body; the
    control statement of an `if`, `while`, or do statement; a try or catch clause;
    or a compound statement delimited only by curly braces. They are constructed when
    execution enters the lexical scope, and destroyed when execution passes out of
    the lexical scope.


    The outermost lexical scope—the scope entered first and last—is the body of `main()`.
    For all intents and purposes, an automatic variable declared in `main()` has the
    same lifetime as a static variable.


    Member ownership


    Member variables of classes and structs are owned by the class instance that contains
    them. They are constructed by the class constructor as an instance of the class
    is constructed, and destroyed as the instance is destroyed.


    Ownership of dynamic variables


    Dynamic variables have no predefined owner. Rather, the `new-expression` that
    creates the dynamic variable returns a pointer, which must be explicitly managed
    by the program. The dynamic variable must be returned to the memory manager via
    a `delete-expression` to be destroyed before the last pointer to the dynamic variable
    is destroyed. The lifetime of the dynamic variable is thus completely programmable—a
    powerful but dangerous tool. If a dynamic variable is not returned to the memory
    manager through a `delete-expression` after the last pointer to it is destroyed,
    the memory manager loses track of that for the rest of the program''s run.


    Ownership of dynamic variables must be enforced by the developer and encoded into
    the program logic. It is not controlled by the compiler or defined by C++. Ownership
