  md: '# When in Doubt, Code Libraries for Speed


    In Chapter 1, I quoted Don Knuth''s admonition, "Premature optimization is the
    root of all evil." I suggested this was too dogmatic. But in library design, this
    advice is especially dangerous.


    Good performance is particularly important for a library class or function. The
    library designer cannot predict when the library may be used in a context in which
    performance matters. Improving performance after the fact can be difficult or
    impossible, especially if it involves changes to function signatures or behavior.
    Even a library used within a single enterprise may be invoked from many programs.
    If the library is widely disseminated, as with open source projects, there is
    no way to update or even discover all users. Any change becomes a breaking change.


    # Functions Are Easier to Optimize than Frameworks


    There are two kinds of libraries: function libraries and frameworks. A framework
    is a conceptually large class that implements a complete program skeleton: a windowing
    application or a web server, for instance. You decorate the framework with small
    functions that customize it, to be your specific windowing application or your
    particular web server.


    The second kind of library is a collection of functions and classes that can be
    used together to implement a program: parsing URLs for a web server or drawing
    text on a window, for instance.


    Both kinds of libraries can embody powerful functionality and enhance productivity.
    A set of libraries can be packaged either as functions (as in Windows SDK) or
    as a framework (as in Windows MFC, for example). However, from an optimizer''s
    standpoint, function libraries are easier to work with than frameworks.


    Functions have the advantage that they can be tested and their performance tuned
    in isolation. Invoking a framework runs all its machinery at once, making it harder
    to isolate and test a change. Frameworks violate the separation of concerns or
    single responsibility rule. That makes them hard to optimize.


    Functions can be used in focused ways within a larger application: a drawing subroutine,
    a UI parser there. Only much functionality as needed is linked from the library.
    Frameworks can "god functions" (see "Beware of ''God Functions" on page 198) that
    link in many parts of the framework. This can bloat the executable with code that
    is not actually used.


    Well-designed functions make few assumptions about the environment in which they
    run. By contrast, a framework is based on a big, general model of what the developer
    wants to do. Inefficiency results any time there is a mismatch between the model
    and the developer''s actual needs.'
