  md: '# Measure Baseline Performance and Set Goals


    For a developer working alone on her own time, the optimization process can be
    casual, iterating until performance "feels good enough." Developers working in
    teams, however, have managers and stakeholders to satisfy. Optimization efforts
    are guided by two numbers: a baseline measure of performance before optimization,
    and a performance goal. The baseline performance measurement is important not
    just for measuring the success of individual improvements, but also for justifying
    the cost of optimization efforts to stakeholders.


    A performance goal is important because optimization is a process with diminishing
    returns. Initially there is "low-hanging fruit" that may easily be picked: individual
    processes or naively coded functions that produce big improvements when optimized.
    But once these optimization targets have been improved, more effort is required
    for each next turn of the optimization crank.


    Many teams do not initially to set design goals for performance or responsiveness,
    simply because they are not accustomed to doing so. Frankly, poor performance
    is usually obvious (a interface with long periods of unresponsiveness, a server
    that won''t scale, expensive hosting costs for CPU time). Once a team looks at
    performance, numerical goals are easy to set. A subdiscipline of user experience
    (UX) design centers on how users perceive waiting time. Here is a list of commonly
    measured performance aspects to start you off, plus just enough numbers to make
    you dangerous:


    # Startup time


    The elapsed time between entering the Key until the program enters its main input
    processing loop. Often, but not always, the developer can just the time elapsed
    between entering the main() procedure and entering the main loop. Operating system
    vendors who offer certification for programs have strict requirements for programs
    that run starts up, or whenever a user logs in. For instance, Microsoft demands
    of hardware vendors seeking certification that the Windows must enter its main
    loop less than 10 seconds after starting. This limits the number of other programs
    the vendor is allowed to preload and launch in the busy startup environment. Microsoft
    offers specialized tools to measure startup time.


    # Shutdown time


    The elapsed time from the user clicking the Close icon or entering a command to
    exit until the program actually exits. Often, but not always, you can just measure
    the time elapsed between the main window receiving the shutdown command and exiting
    main(). Shutdown time also includes the time needed to stop all threads and dependent
    processes. Operating system vendors who offer certification have strict requirements
    for shutdown time. Shutdown time is also impor-'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'tant because the time it takes to restart a service or long-running program
    is equal to its shutdown time plus its startup time.


    # Response time


    The average or worst-case time needed to perform a command. For websites, both
    the average response time and worst-case response time contribute to users'' satisfaction
    with the site. Response times can be categorized into coarse powers-of-10 baskets
    as follows:


    +   Less than 0.1 seconds: user in direct control


    If response time is less than 0.1 seconds, the users feel like they are directly
    controlling the user interface, and UI changes result directly from their actions.
    This is the maximum delay between a user beginning to drag and a dragged object,
    or between a user clicking a field and the field being highlighted. Any longer
    and the user feels like he is issuing a command that the computer carries out.


    +   0.1 to 1 seconds: user in control of command


    If response time is between 0.1 and 1 seconds, the users feel as though they are
    in charge, but interpret the brief delay as the computer executing a command and
    causing a change to the UI. The users are able to tolerate this amount of delay
    without losing their focus on their current train of thought.


    +   1 to 10 seconds: computer in charge


    If response time is between 1 and 10 seconds, the users feel like they have executed
    a command and have lost control to the computer while it processes the command.
    Users may lose focus and forget things in short-term memory that they need to
    complete the task; 10 seconds is about the maximum time a user can remain focused.
    User satisfaction with the UI drops rapidly if they encounter many waits of this
    duration.


    +   More than 10 seconds: time for a coffee break


    If response time is greater than 10 seconds, the users perceive that they have
    enough time to do other task. If their work requires them to use the UI, they
    will go for coffee while the computer crunches numbers. If it''s an option, the
    user may close the program and look elsewhere for satisfaction.


    Jakob Nielsen wrote an interesting article about time scales in user experience
    that points to scholarly studies for the extra-curious.


    # Throughput


    The inverse of response time. Throughput is generally expressed as the average
    number of operations per unit of time on some test workload. Throughput measures
    the same thing as response time, but is more appropriate for batch-oriented'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'programs like databases and web services. Generally you want this number as
    big as possible.


    It is also possible to overoptimize. For instance, in many cases, users regard
    a response time of under 0.1 seconds as instantaneous. In such situation, improving
    response time from 0.1 seconds to 1 millisecond adds virtually no value, even
    though it is 100 times faster.


    # You Can Improve What You Measure


    Optimizing a single function, subsystem, task, or test case is never the same
    as improving the performance of a whole program. Your test setup differs in many
    ways from the production-version program running on customer data, so the performance
    improvements measured in your test rarely translate into the same performance
    improvements in the wild. Making a single task faster may not make the whole program
    faster, even if it exercises much of your program''s logic.


    For instance, if a database developer profiles a database performing a specific
    query 1,000 times, and optimizes based on that profile, she will speed up the
    whole database, but the database performing a specific select query. This speedup
    may improve the performance of other queries. It will have a less predictable
    effect on delete or update queries, indexing, and all the other things a database
    does.


    # Profile Program Execution


    A profiler is a program that produces statistics about where another program spends
    its time. The profiler constructs a report showing how frequently each statement
    or function is executed, and how much time accumulates in each function.


    Many compilers, including both Visual Studio on Windows and GCC on Linux, come
    with a profiler to find hot spots. Historically, Microsoft only offered its profiler
    with expensive versions of Visual Studio, but Visual Studio 2015 Community Edition
    comes with very extensive profiler support. There are open source profilers for
    Windows, for earlier versions of Visual Studio.


    There are several ways to implement a profiler. One method used by both Windows
    and Linux worlds is as follows:


    +   1. The programmer recompiles the program to be profiled with a special compiler
    flag that *instruments* every function in the program. This involves adding a
    couple of extra assembly language instructions to the beginning and end of each
    function.


    +   2. The programmer links the instrumented program with a profiling library.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '+   3. Any time the instrumented program runs, it creates a profiling table
    as a file on disk.


    +   4. The profiler takes the profiling table as input, and produces a range of
    available textual or graphical reports.


    Another profiling method works in this way:


    +   1. The unmodified program is instrumented by linking it with a profiling library.
    The library contains a routine that interrupts program execution at a high rate
    and records the value of the instruction pointer.


    +   2. Any time the instrumented program runs, it creates a profiling table as
    a file on disk.


    +   3. The profiler reads the profiling table as input, and produces a range of
    available textual or graphical reports.


    The output of the profiler may take several forms. One form is a source listing
    annotated with the number of times each line was executed. Another form is a list
    of function names along with the number of times each was invoked. Another form
    is the same list of functions, with the total time accumulated within each function
    and all functions called from within. Still another form is a list of functions
    and the amount of time spent in each function, the time spent in called functions,
    in system code, or waiting for events.


    The profiler instrumentation is carefully designed to be as inexpensive as possible.
    Its effect on overall run time is small, and typically takes the form of a few
    percent slowdown of execution. The first method gives exact numbers, at the cost
    of higher overhead and disabling of certain optimizations. The second method gives
    approximate results and may miss few infrequently called functions, but has the
    advantage of running over the production code.


    The most important advantage of a profiler is that it directly displays a list
    of the hottest functions in the code. The process of optimization is reduced to
    making a “naughty list” of functions to investigate, inspecting each function
    for optimization opportunities, making a change, and rerunning the code to obtain
    new profiler output until no single function appears hot or you run out of ideas.
    Because hot spots observed by the profiler are by definition places where a lot
    of computation takes place, this process is generally straightforward.


    My experience with profiling is that profiling a debug build of a program produces
    results that are just as relevant as those obtained from a release build. In some
    ways, the debug build is easier to profile because it includes all functions,
    including those'
