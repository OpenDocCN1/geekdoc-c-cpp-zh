    # Memory fences


    Most std::atomic member functions take an optional memory_order argument that
    selects a memory fence around the operation. If the memory_order is not provided,
    the default is memory_order_acq_rel. This provides a full fence that is always
    safe, but can be expensive. More refined fences can be selected, but this should
    be done only by knowledgeable peers.


    Memory fences synchronize main memory with the cache of multiple hardware threads.
    In general, a memory fence is executed on each of two threads to synchronize one
    with the other. C++ allows the following memory fences:


    # memory_order_acquire


    memory_order_acquire may be casually thought to mean “acquire all work done by
    other threads.” It ensures that subsequent loads are not moved before the current
    load or previous loads. This does, paradoxically, by waiting for store operations
    currently in flight between the processor and main memory to complete. Without
    the fence, if a store is in flight when this thread does a load to the same address,
    the thread gets old information, as if the load moved inside the program.


    memory_order_acquire may be less expensive than the default full fence. It would
    be more appropriate, for instance, to use memory_order_acquire when atomically
    reading the flag in the while loop of a busy-wait.


    # memory_order_release


    memory_order_release may be casually thought to mean “release all work done by
    this thread to this point.” It ensures that previous loads and stores done by
    this thread are not moved past the current store. It does this by waiting for
    store operations currently in flight within this thread to complete.'
