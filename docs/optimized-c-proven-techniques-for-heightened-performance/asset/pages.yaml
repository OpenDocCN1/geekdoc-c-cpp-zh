    Test cases are important for any software. They verify the correctness of the
    original design, and help reduce the change that made during optimization affect
    a program’s correctness. It should not be surprising that they assume an even
    greater importance in library code, where the stakes are higher.


    Test cases help identify dependencies and couplings during the design of a library.
    The functions of well-designed libraries can be tested in isolation. If many objects
    must be instantiated before testing a test function, it is a signal to the designer
    that there is too much coupling between the components of the library.


    Test cases help the designer practice use of the library. Without this practice,
    it’s far too early for experienced designers to learn important interface functions.
    Test cases help the library designer identify rough edges in the design at an
    early stage, when breaking changes to the interface are not painful. The library
    helps the designer to identify idioms of use, so that they are encoded in the
    library design, resulting in more efficient function interfaces.


    Test cases make good targets for timing tests. Timing tests ensure that any proposed
    optimizations actually improve performance. Timing tests themselves can be added
    to the other test cases to ensure that changes do rob performance.


