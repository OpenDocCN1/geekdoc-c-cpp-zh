  md: 'File I/O is a resource. The disk drive can only be in one place at a time.
    Attempting to I/O on multiple files simultaneously can cause performance to fall
    off suddenly.


    Network I/O is also a resource. The Ethernet connector is a narrow pipe through
    which bits squirt. It is easy for modern processors to saturate every gigabit
    Ethernet cables. Saturating a WiFi connection is easy.


    When there is a performance problem, it is time to take a step back and ask, "What
    is the whole program doing right now?" Logging that in is no problem most of the
    time may be slowing the whole system if something else is also banging away from
    the disk or network interface. Dynamic data structure may not scale to many threads.


    # Duplicate resources


    Instead of multiple threads contending for a resource such as a shared map or
    hash table, sometimes it is possible to duplicate the table so that each thread
    has an unshared copy, eliminating contention. Although maintaining two copies
    of a data structure is more work, it may still result in reduced wall clock time
    versus shared data structure.


    Even hardware resources like disk drives and network interface cards can be duplicated
    to improve throughput.


    # Partition resources


    Instead of multiple threads contending for a single data structure, sometimes
    it is possible to partition the data structure so that each thread only accesses
    the portion of the data it works with.


    # Fine-grained locking


    Instead of locking an entire data structure with a single mutex, multiple mutexes
    can be used. For example, in a hash table, one mutex can lock the hash table backbone
    after modification (such as inserting and deleting entries), and another mutex
    can lock the entries after modification. Reader/writer locks may be a good choice
    here. To access a hash table, a thread reads a lock on the backbone, or either
    a read or write lock on the entry. To insert or delete an entry, the thread takes
    a write lock on the backbone.


    # Lock-free data structures


    Use of a lock-free data structure such as a hash table relieves the need for mutual
    exclusion. This is the ultimate extent to which fine-grained locking can be taken.


    # Resource scheduling


    Some resources, such as a hard drive, are not susceptible to duplication or partitioning.
    But it is still possible to schedule disk activity so that it doesn''t happen
    all at once, so that accesses to adjacent parts of the disk are performed together.'
