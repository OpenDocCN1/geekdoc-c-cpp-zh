  md: "In the following sections, I describe a set of optimization steps, the resulting\
    \ improvement in performance of the remove_ctrl() function.\n\n# Use Mutating\
    \ String Operations to Eliminate Temporaries\n\nI begin optimizing remove_ctrl()\
    \ by removing allocation and copy operations. Example 4-2 is an improved version\
    \ of remove_ctrl() in which the concatenation expression in line 5 produces so\
    \ many new temporary string objects are replaced by the mutating concatenating\
    \ assignment operator, +=.\n\nExample 4-2. remove_ctrl_mutating(): mutating string\
    \ operators\n\n```\nstd::remove_ctrl_mutating(std::string s) {\n    std::string\
    \ result;\n    for (int i=0; i<s.length(); ++i) {\n        if (s[i] >=0x20)\n\
    \            result += s[i];\n    }\n    return result;\n}\n```\n\nThis small\
    \ change has a dramatic effect on performance. The same timing test showed an\
    \ average of only 1.72 microseconds per call, a 13x improvement. The improvement\
    \ comes from eliminating all the calls to allocate temporary string objects to\
    \ hold the concatenation expression result, and the associated copying and deleting\
    \ of temporaries. Depending on the string implementation, allocation and copying\
    \ on assignment are also eliminated.\n\n# Reduce Reallocation by Reserving Storage\n\
    \nThe function remove_ctrl_mutating() still performs an operation that lengthens\
    \ result. This means result is periodically copied into a larger internal dynamic\
    \ buffer. As previously discussed, one possible implementation of std::string\
    \ doubles the amount of allocated each time of the string's character buffer is\
    \ exceeded. When std::string is implemented with this rule, reallocation might\
    \ happen as many as 8 times for a 100-character string.\n\nIf we assume strings\
    \ are generally printable characters, with only occasional control characters\
    \ to remove, then the length of the string argument provides an excellent estimate\
    \ of the result's eventual length. Example 4-3 improves on remove_ctrl_mutating()\
    \ by using std::string::reserve member function to preallocate the estimated amount\
    \ of storage. Not only does use reserve() eliminate reallocation of the string\
    \ buffer, but it also improves the cache locality of the data accessed by the\
    \ function, so we get even more mileage out of this change."
