    A general memory manager can be designed that serves each different request size
    from a different arena, and returns each different request size to a different
    free list. If all requests are rounded to the next-higher power of two, the result
    is a “fast-fit” memory manager. Typically, the fast-fit memory manager allocates
    only objects up to a particular size, sending larger requests to the default memory
    manager. The code for a fast-fit allocator is too big to reproduce in this book,
    but it’s available on the Web.


    Boost has a fixed-block memory manager, called Pool.


    # Non-Thread Safe Memory Managers Are Efficient


    The fixed-block memory manager owes some of its efficiency to not being thread
    safe. Non-thread safe memory managers are efficient for two reasons. First, they
    don’ require synchronization primitives to serialize critical regions. Synchronization
    is expensive because a very slow memory fence (“Atomicity by mutual exclusion”
    on page 289 and “Memory fences” on page 302) is at the heart of every synchronization
    primitive. If only one thread calls the memory manager (which is typical), these
    expensive instructions slow down things.


    Second, non-thread safe memory managers are efficient because they never pend
    on synchronization primitives. When a program has several threads calling into
    the memory manager, the threads experience contention for the memory manager as
    a resource. The more threads there are in the system, the greater the contention
    is, and the more access to the allocator serializes the activity of the threads.


    When a class implements a class-specific memory manager, even if the program as
    a whole is multithreaded, if a given class is only used in one thread it never
    has to wait. By contrast, calls to the default memory manager experience contention
    in multi-threaded programs for objects only used in one thread.


    Non-thread safe memory managers are also far easier to write than thread-safe
    ones, since minimizing the critical section so the memory manager runs efficiently
    can be complex.


    # Provide Custom Standard Library Allocators


    The container classes of the C++ standard library make heavy use of dynamic memory.
    They are a natural class to look for optimization opportunities, including custom
    memory managers like the ones described in “Fixed-Size-Block Memory Manager” on
    page 336.'
