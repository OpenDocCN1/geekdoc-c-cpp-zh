  md: '# As Many Runnable Threads as Cores


    Older treatises on concurrency advise creating as many threads as are convenient,
    in a manner similar to creating dynamic variables. This thinking reflects an antique
    world where threads competed for the attention of a single processor. In the modern
    world of multicore processors, this advice is too simplistic.


    The optimizing developer may distinguish two kinds of threads, with different
    behavior:


    # Runnable threads compute continuously


    A runnable thread consumes 100% of the computing resources of the core upon it
    runs. If there are n cores, scheduling a thread on each core can reduce wall clock
    run time to 1/n. However, once a thread is running on each available core, scheduling
    additional threads produces no improvement in runtime. Instead, the threads simply
    chop up the available hardware into smaller and smaller slices. In fact, there
    is a limit to how finely access can be sliced, by which time is all starting and
    stopping, with no time in the middle for computation. As the number of runnable
    threads increases, overall performance drops off and can ultimately zero.


    # Waitable threads wait for an external event, then compute briefly


    A waitable thread consumes just a few percent of the computational resources on
    a core. Scheduling multiple waitable threads on a core gives a greater fraction
    of the available resources if execution of the waitable threads is interleaved
    so that the computation on one waitable thread happens during the wait on another
    waitable thread. This reduces wall clock run time up to a saturation point at
    which all computational resources are in use.


    In the single-core part, there was no benefit from scheduling computations as
    runnable threads. All performance gains come from interleaving waitable threads
    with other threads. This is not the case when there are multiple cores.


    C++ provides a function called std::thread::hardware_concurrency() that returns
    the number of available cores. This function accounts for cores allocated to other
    virtual machines by hypervisors, and cores behave as two or more logical cores
    due to simultaneous multithreading. It allows a program to scale hardware containing
    more (or fewer) cores as time passes.


