  md: "Idioms used throughout the program\nThis is a catch-all-category of C++ statements\
    \ and idioms for which less expensive alternatives exist. If these idioms are\
    \ widely used within a program, changing to less expensive idioms may improve\
    \ overall performance.\n\nOptimizing code at the statement level can produce significant\
    \ performance improvements on the smaller, simpler processors that are embedded\
    \ into instruments, applications, peripherals, and toys, because instructions\
    \ are fetched directly from memory and executed one instruction after another.\
    \ However, desktop- and handset-class processors do so much instruction-level\
    \ concurrency and caching that statement-level optimization produces smaller returns\
    \ than optimizing allocation or copying.\n\nOn programs designed for desktop-class\
    \ computers, statement-level optimization may only be appropriate for frequently\
    \ called library functions, or the most inner loops of programs like game graphics\
    \ engines or programming language interpreters run flat-out all the\n\nAn issue\
    \ with optimizing at the statement level is that the effectiveness of optimizations\
    \ can be compiler-dependent. Each compiler has one or more plans for how to generate\
    \ code for a particular C++ statement. A coding idiom that improves performance\
    \ on one compiler may produce no result or even slow down the code. A trick that\
    \ improved performance when using GCC may not work with Visual C++. More critically,\
    \ it means that when a team upgrades to a new compiler version, the new compiler\
    \ may optimize their carefully tuned code. This is another reason why statement-level\
    \ optimization may be less fruitful than other kinds of performance efforts.\n\
