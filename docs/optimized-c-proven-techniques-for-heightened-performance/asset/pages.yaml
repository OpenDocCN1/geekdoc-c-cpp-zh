  md: 'Mastery of the C++ standard library is a critical skill for the optimizing
    developer. This book provides recommendations for algorithms for searching and
    sorting (Chapter 9, Optimize Searching and Sorting), optimal idioms of container
    classes (Chapter 10, Optimize Data Structures), I/O (Chapter 11, Optimize I/O),
    concurrency (Chapter 12, Optimize Concurrency), and memory management (Chapter
    13, Optimize Memory Management).


    There are open source libraries for important functions like memory management
    (see "High-Performance Memory Managers" on page 333) that provide sophisticated
    implementations that can be faster and more capable than what''s provided by a
    vendor''s C++ runtime library. The advantage of these alternative libraries is
    that they may be easy to drop into an existing project, and provide an immediate
    speed improvement.


    There are many publicly available libraries from the Boost project and Google
    Code, among many others, that provide libraries for things such as IO, windowing,
    string handling (see "Adopt a novel string implementation" on page 85) and concurrency
    (see "Concurrency Libraries" on page 320) are not drop-replacements for the standard
    libraries but offer improved performance and added features. These libraries gain
    part of their speed advantage from making different trade-offs than the ones made
    for the standard


    Finally, it is possible to develop a project-specific library that relaxes some
    of the safety and robustness constraints of the standard library in exchange for
    a speed advantage. All these topics are covered in Chapter 8, Use Better Libraries.


    Function calls are expensive in several ways (see "Cost of Function Calls" on
    page 161). Good function library APIs provide functions that reflect the idioms
    of use of these APIs, so that the user doesn''t have to make frequent calls to
    the most fundamental functions. For instance, an API that gets characters and
    provides only a get_char() function requires the user to call a function for each
    character. If the API also provides a get_buffer() function, the API can avoid
    the expense of calling for each character.


    Function and class libraries are good places to hide the complexity that sometimes
    comes with highly tuned programs. Libraries should pay your program back for the
    cost of calling them by doing work with maximum efficiency. Library functions
    are quite likely to be at the bottom of deeply nested calling chains, where the
    effect of improved performance is magnified.


