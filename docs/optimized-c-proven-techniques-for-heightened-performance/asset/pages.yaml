    The purpose of this chapter is to provide the bare minimum of background information
    about computer hardware to motivate the optimizations described in this book,
    to prevent readers from going madrid over 600-page processor handbooks. It takes
    a superficial look at processor architecture to extract some heuristics to guide
    optimization efforts. The very impatient reader might skip this chapter for now
    and return when other chapters refer to it, though the information here is important
    and useful.


    Microprocessor devices in use are incredibly diverse. They range from sub-$1 embedded
    devices with just a few thousand gates and clock rates below 1 MHz to desktop-class
    devices with billions of gates and gigahertz clocks. Mainframe computers can be
    the size of a large room, containing thousands of independent execution units
    and drawing enough electrical power to light a small city. We believe that nothing
    connects this fusion of computing devices that would lead to usable generalizations.
    In reality, they have useful similarities. After all, if there were no similarities,
    it would not be possible to compile C++ code for the many processors for there
    are compilers.


