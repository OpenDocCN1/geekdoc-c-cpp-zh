    Desktop computers are astonishingly fast. They can dispatch a new instruction
    every nanosecond (or better). That''s every 10⁻⁹ seconds! It is seductively appealing
    to believe that optimization cannot possibly matter when a computer is so fast.


    The problem with this way of thinking is the faster the processor, the faster
    wasted instructions pile up. If 50% of the instructions executed by a program
    are unnecessary, that program can be made to run twice as fast as by removing
    them, no matter how rapidly unnecessary instruction is executed.


    Your colleagues who say "efficiency doesn''t matter" may also mean it doesn''t
    matter for certain applications, which are human response-bound and run on desktop
    computers that are already very fast. Efficiency varies much on small embedded
    and mobile processors with memory, power, or speed constraints. It also matters
    on servers running flat-out on big computers. Another way to say this is that
    efficiency matters for any application that must contend for constrained resources
    (memory, power, CPU cycles). Efficiency matters a great deal, too, any time your
    workload is big enough to be spread across multiple computers. In this case, efficiency
    can be the difference between spending on 100 servers or cloud instances versus
    500 or 1,000.


    In 50 years, computer performance has improved by six orders of magnitude. And
    yet, here we are talking about optimization. The past is any guide, optimization
