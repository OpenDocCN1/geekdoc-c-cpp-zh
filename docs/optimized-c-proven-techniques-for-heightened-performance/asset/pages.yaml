- img_proc: true
  md: 'Note the very special language. Experiments don''t necessarily prove anything
    at all. Your modified code may run faster or slower for a variety of reasons having
    nothing to do with your change. For example:


    +   * The computer might receive an email or check for a Java update while you
    are measuring run time.

    * A colleague might check in an improved library just before you recompile.

    * Your fix might run faster because it is not correct.


    Good scientists are skeptics. If the expected improvement does not appear, or
    appears too good to be true, a skeptic tries the experiment again, or questions
    her assumptions, or looks for a bug.


    Good scientists are also open to new knowledge, even if it contradicts knowledge
    already in their heads. I learned unexpected things about optimization in the
    process of writing this book. The technical reviewers learned things too. Good
    scientists never stop learning.


    # Optimization War Story


    Chapter 5 contains an example function for keyword lookup. I coded several versions
    of the example. One was a linear search, another was a binary search. When I measured
    the performance of these two functions, the linear search was consistently a few
    percent faster than the binary search. This, I felt, was unreasonable. The binary
    search just had to be faster. But the numbers told a different story.


    I was aware that someone on the Internet had reported that linear lookup was often
    faster because it enjoyed better cache locality than binary search, and I deemed
    my linear search implementation should have excellent cache locality. This result
    violated both testing and long-revoked learning about search performance.


    In investigating more deeply, I first realized that I had been testing a table
    with a few keywords, and using sample words that would be found in the table in
    my test. The table had eight entries, a linear search would examine half (four)
    of them before returning. The binary search would divide the table in half four
    times before it found the keyword each time it was. The two algorithms had exactly
    the same average performance on small keyword sets. This reality invalidated my
    intuition about binary search “always” being better.


    But this was not the result intended to demonstrate! So I made the table larger,
    thinking there must be a size at which the binary search was faster. I also added
    more words to my test that were not in the table. The results were as before,
    with the linear search being faster. At this time, I had to put this coding task
    aside for a couple of days. The result gnawed at me.'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'I was still sure that the binary search should be faster. I reexamined the
    unit tests for the two searches, eventually to discover that the linear search
    always returned success after the first comparison. My test case had checked for
    a nonzero return, rather than testing for the correct return. Seepishly, I fixed
    the linear search and test cases. Now the experiment produced the expected result
    that the binary search was faster.


    In this case, the experimental results first rejected and later validated my hypothesis—and
    challenged my assumptions along the way.


    # Keep a Lab Notebook


    Eventually, however, the developer will guess wrong and the timing of the latest
    run will be worse than that of the previous run. Suddenly the developer’s memory
    will be full of questions. Was run #5 faster than run #3 even though it was slower
    than run #4? And just what code change produced #3? Was the speed difference just
    an artifact, or was it really faster?


    If each run is documented, it can be quickly retrieved. This makes answering questions
    trivial, the developer must go back and rerun a previous experiment to get the
    timing—that is, if he can remember exactly what code change to make or unmake.
    If runs are brief and the developer’s memory is excellent, then he’ll be lucky
    and may waste only a little time. But it is possible to be unlucky, and lose tracking
    of a line of work, or perhaps repeat unnecessarily the next day.


    When I give this advice, there is always someone who says, "I cannot do that without
    paper! I can write a Perl script that would modify the FOO command of the Smart-FOO
    check-in tool to save the results of each run with the set changed for run. If
    I save the tests in a file… in a directory then we lose so..."


    I don’t want to discourage innovation among software developers. If you’re a senior
    manager driving uptake of best practices, go for it. I will say, that writing
    on paper is a robust, easy-to-use technology that is a thousand years down its
    learning curve. It will continue to work when the team updates the revision manager
    or test suite. It will work at the developer’s next job. This old-school solution
    may still optimize use of the developer’s time.'
