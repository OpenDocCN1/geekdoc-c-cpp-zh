    # Optimizing Pro Tip


    One issue with profiling a debug build on Windows is that the debug build is linked
    with a debug version of the runtime library. The debug version of the memory manager
    functions performs many tests so it can better report free storage and memory
    leaks. The cost of these tests can significantly increase the cost of certain
    functions. There is an environment variable to tell the debugger not to use the
    debug memory manager: to Control Panel->System Properties->Advanced System Settings->Environment
    Variables, and add a new variable called _NO_DEBUG_HEAP with a value of 1.


    Using a profiler is an excellent way to find candidates for optimization, but
    it isn''t perfect:


    +   * A profiler cannot tell you there is a more efficient algorithm to solve
    your computing problem. Tuning a bad algorithm is just a waste of time.

    * A profiler does not give crisp results on input that exercises many different
    tasks. For instance, a SQL database may execute very different code when doing
    an insert query when selecting a query. Thus, code that is hit loading up the
    database with insert queries may not be executed at all when reading data from
    the database with select queries. Running a test is a mix of loading the database
    and querying the database makes the code less prominent in the profiler report,
    unless the profiled profiler performs a lot of computation.


    Therefore, to identify the hottest functions more easily, try optimizing one task
    at a time. When running in a test harness, if test code is available. However,
    you introduce another source of uncertainty if you optimize one task at a time:
    it doesn''t necessarily improve the performance of the entire system. Results
    may be less dramatic when the program is run on input that performs a mix of tasks.


    +   * The profiler gives misleading information when a program is I/O-bound or
    multithreaded, because the profiler subtracts time spent in system calls or waiting
    on events. Removing this time is theoretically sound because the program is not
    solely responsible for these waits. The result is that the profiler tells you
    how much a program is doing, not how much "wall clock time" it takes to perform
    its work. Some profilers give a count of the number of function calls as well
    as the time spent within each function. A very high call count can be a clue when
    the profiler hides wall clock time.'
