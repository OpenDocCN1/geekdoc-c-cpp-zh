    \ the formal parameters before the body of the procedure is evaluated. But for\
    \ an *if* expression, the predicate part must be evaluated to determine whether\
    \ to evaluate the consequent part or the alternative part; they won't be evaluated.\
    \ This is why *if* must be a special form, not a procedure. A *non-strict* procedure\
    \ is one that defers the evaluation of some operands. How can we make it possible\
    \ for a programmer to define non-strict procedures as needed, rather than just\
    \ using a few special forms, such as *if*, that are specified in the language\
    \ definition?\n\nFor example, suppose we want to make a procedure *unless* that\
    \ works like the special form *if* in that does not evaluate the alternatives\
    \ that are not needed.¹³ Using *unless* we could write:\n\n```\n(define fib n)\n\
    (unless (< n 2)\n  (+ (fib (- n 1)) (fib (- n 2)))\n  )\n```\n\nFor this definition\
    \ of the Fibonacci function to work correctly, the second operand of the *unless*\
    \ expression should be evaluated if $n < 2$, and the third operand should not\
    \ be evaluated if $n \\ge 2$. The first operand of the *unless* expression must\
    \ always be evaluated to determine the choice.\n\nWe need a way to determine which\
    \ operands of *unless* to evaluate, and to which to defer. To do this we introduce\
    \ a kind of declaration and write:\n\n```\n(define unless condition (usual lazy)\
    \ (exception usual))\n(if condition exception usual)\n```\n\nHere we define the\
    \ procedure *unless* in terms of the special form *if*, but we declare that the\
    \ second and third arguments are lazy.¹⁴ The first argument is, by default, strict.\n\
    \nWe could have many kinds of declarations on formal parameters, describing how\
    \ to handle operands and arguments. A parameter could be declared lazy and memoized,\
    \ to implement call by need, as are arguments to all procedures in languages like\
    \ Haskell; a"
