  md: 'A good program must be written many times. This is true of the programs we
    show. The first draft may not clearly separate out the concerns, but by making
    that draft the programmer learns the structure of the problem. We will show two
    different implementations, which will reveal the evolution of the program as we
    identify shortcomings in our draft.


    # 2.4.1 A monolithic implementation


    Let''s start with a simple version of the referee that one might write to understand
    what really has to be done.


    # A checkers domain model


    The first implementation will be built on a domain model that is specific to checkers
    and fairly simple. In the later implementation we will abstract away the checkers-specific
    parts and hide many of the details of the domain model. The final domain model
    will support other similar board games, and perhaps other domains.


    The domain model will use three abstract types. A *board* tracks the live pieces
    and the color of the player to move next (the *current* player). It can be asked
    what piece, if any, is in a particular position. A *piece* has a color, a position,
    and whether it is a king. A *position* is specified by *coordinates* that are
    relative to the player to move. Here are the operations on boards:


    ```

    (current-pieces board)

    gets a list of the pieces belonging to the current player.

    ```


    ```

    (is-position-on-board? coords board)

    tests whether the given coords specify a position on *board*. Coordinates that
    do not satisfy this predicate will cause errors when used with other operations.

    ```


    ```

    (board-get coords board)\gets the piece that is at the position specified by *coords*.
    If there is no piece in that position it returns #f.

    ```


    ```

    (position-info coords board)

    ```'
