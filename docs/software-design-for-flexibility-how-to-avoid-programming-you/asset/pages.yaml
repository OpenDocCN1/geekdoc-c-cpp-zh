    # 7.2.1 Cells


    A cell is implemented as a message-accepting procedure, using the bundle macro.
    The cell maintains its information in the content variable, which is initialized
    to a value-nothing (identified by the predicate nothing?) that represents the
    absence of any information about the value. The value that the cell reports, when
    asked, is the strongest value that it has at the moment. The cell also maintains
    a list of its neighbors, the propagators that need to be alerted when the strongest
    value of the cell changes. An auxiliary data structure relations is used to hold
    the cell''s family relations.


