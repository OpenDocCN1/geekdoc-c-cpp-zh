  md: '# 2 Domain-Specific Languages


    One powerful strategy for building flexibility into a programming project is to
    create a domain-specific language that captures the conceptual structure of the
    subject matter of the programs to be developed. A domain-specific language is
    an abstraction in which the nouns and verbs of the language are directly related
    to the problem domain. Such a language allows an application program to be written
    directly in the domain. By its nature, a domain-specific language implements a
    fairly complete model of the domain, in excess of what is needed for a particular
    application. Although this may seem like extra work that at hand, it is often
    less work than writing a monolithic program, and the resulting program is much
    easier to modify, debug, and extend.


    So a domain-specific language layer is built to support more than just the development
    of a particular program. It provides a general framework for the construction
    of a variety of related programs that share the domain of discourse. It simplifies
    the process of extending an existing application in that domain. And it provides
    a substrate that allows related applications to cooperate.


    In this chapter we first introduce systems of combinators, a powerful organizational
    strategy for the erection of domain-specific language layers. We will demonstrate
    the effectiveness of this strategy by showing how to reformulate the ugly mess
    of regular expressions for string matching into a pretty combinator-based domain-specific
    language embedded in Scheme. But sometimes we have components that do not easily
    fit into a clean system—sometimes we need a system of adapters. We illustrate
    this with a'
