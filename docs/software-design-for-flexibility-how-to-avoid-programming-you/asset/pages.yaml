    allowing procedures written assuming one unit system to be used with a different
    unit system. Finally, we consider the broad domain of board games. We see how
    it is possible to abstract the details of the domain by building an interpreter
    for the rules of the game.


    # 2.1 Combinators


    Biological systems achieve much of their adaptability through the use of very
    general parts (cells) that are dynamically configured and consequently able to
    adjust as their environment changes. Computational systems usually do not use
    this strategy, instead relying on a hierarchy of custom parts and combinations.
    In recent years, large libraries of well-specified higher-level parts have raised
    the abstraction level of this activity. But the means of combination are rarely
    abstracted or shared, other than as “patterns,”


    In some situations we can improve on this practice by simple strategies that promote
    the use of shared combination mechanisms. If the systems we build are made up
    of members of a family “mix-and-match” components that combine to make new members
    of the family, perturbations of the requirements can sometimes be addressed by
    rearrangement of combinations.


    A system of combinators is a set of primitive parts and a set of means of combining
    parts such that the interface specifications of the combinations are the same
    as those of the primitives. This enables construction without accidental interactions
    between the parts. A classic example of a combinator-like system is TTL [123],
    which is a historic library of standard parts and combinations for building complex
    digital systems.


    Combinator systems provide a design strategy for domain-specific languages. The
    elements of the system are words in the language, and the combinators are used
    to combine them into phrases. Combinator systems have significant advantage that
    they are easy to build and reason about, but they have limitations, which'
