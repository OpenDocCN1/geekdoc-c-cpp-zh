    #t

    ```


    ```

    (sum? '' (* 3 a))

    #f

    ```


    Consider what would happen if we left out the quote in the expression (sum? ''
    (+ 3 a)). If the variable a had the value 4, we would be asking if a is a sum.
    But what we wanted to know whether the expression (+ 3 a) is a sum. That is why
    we need the quote.


    # Backquote


    To manipulate patterns and other forms of list-based syntax, it is often useful
    to inters quoted and evaluated parts in the same expression. Lisp systems provide
    a mechanism called quasiquotation that makes this easy.


    Just as we use the apostrophe character to indicate regular quotation, we use
    the backquote character to indicate quasiquotation.⁹ We specify such a partially
    quoted expression as a list in which which the parts to be evaluated are prefixed
    with the comma character. For example,


    ```

    (a b ,(+ 20 3) d)

    (a b 23 d)

    ```'
