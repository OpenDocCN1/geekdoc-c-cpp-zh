- pgno: 377
  md: 'method. In traditional programming, the result of a square root computation
    is not available to subsequent computations until the required error tolerance
    is achieved. By contrast, in an analog electrical circuit that performed the same
    function, the partial results could be used by the next stages as first approximations
    to their computations. This is not an analog/digital problem—it is organizational.
    In a propagator mechanism the partial results of a digital process can be made
    available without waiting for the final result.


    # Filling in details


    This makes a natural computational structure for building powerful systems that
    fill in details. The structure is additive: new ways to contribute information
    can be included by adding new parts to a network, whether simple propagators or
    entire subnetworks. For example, if an uncertain quantity is represented as a
    range, a new way of computing an upper bound can be included without disturbing
    any other part of the network.


    Filling in details plays an important role in all ways we use information. Consider
    Kaniza''s triangle (figure 7.1), for example. Given a few fragmentary pieces of
    evidence we see a white triangle (on a white background!) that isn''t (and that
    typically described as brighter than the background). We have filled in the missing
    details of an implied figure. When we hear speech we fill in the details from
    the observed context, using the regularities of phonology, morphology, syntax,
    and semantics. An expert electrical designer who sees a partial schematic diagram
    fills in details that make a sensible mechanism. This filling in of details is
    not sequential; it happens opportunistically wherever local deductions can be
    made from surrounding clues. Deductions may compound, so that if a piece is filled
    in it forms a new clue for the continuing completion process.'
