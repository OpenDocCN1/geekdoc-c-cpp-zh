    # 6.5 The promise of layering


    We have only scratched the surface of what can be done with an easy and convenient
    mechanism for layering of data and programs. It is an open area of research. The
    development of systems to support such layering can have huge consequence for
    the future.


    Sensitivity analysis is an important feature that can be built using annotated
    data and layered procedures. For example, in mechanics, if we have a system that
    evolves the solution of differential equations from some initial conditions, it
    is often valuable to understand the tube of trajectories that surround a reference
    trajectory deforms. This is usually accomplished by integrating a variational
    system along with the reference trajectory. Similarly, it may be possible to carry
    a probability distribution of values around a nominal value along with the nominal
    value computed in some analyses. This may be accomplished by annotating the values
    with distributions and providing the operations with overlaying procedures to
    combine the distributions, guided by the nominals, perhaps implementing Bayesian
    analysis. Of course, to do this is not easy.


