- pgno: 191
  md: 'information. Merging such patterns (unification) can generate more specific
    information than the individual patterns contribute.


    Another use of pattern matching is as a generalization of generic procedures.
    Generic procedures allow us to do miraculous things by modulating the meanings
    of the free variables in a program. We may think of the program that employs a
    generic procedure, such as that bound to +, as advertising for a handler that
    can do the job of “+ing” the arguments supplied. A handler attached to a generic
    procedure is applicable if the arguments supplied satisfy the predicates provided
    when it was attached. The language for advertising jobs that needs to be done
    is rather limited—all we have a single symbol, in this +. If we instead use patterns
    to advertise jobs to be done and other patterns to advertise procedures that might
    do those jobs, we have a much richer language: pattern-directed invocation.


    # 4.1 Patterns


    The Elementary laws of algebra can be expressed as equivalence of patterns:


    ```

    a \times (b + c) ⇔ a \times b + a \times c

    ```


    This is the distributive law of multiplication over addition. It says that we
    can replace one side with the other without changing the value of the expression.
    Each side of the law is a pattern, with variables a, b, and c, and patterns ×
    and +. What the law says is if we find an algebraic expression that is the product
    of something and a sum of terms, we can replace it with a sum of two products,
    and vice versa.


    Let’s see how to organize programs based on pattern matching. The key idea here
    will be compilation of patterns into combinators that are the pieces of a matcher.
    In section 4.2 we will demonstrate this in a term-rewriting system for elementary
    algebra.'
