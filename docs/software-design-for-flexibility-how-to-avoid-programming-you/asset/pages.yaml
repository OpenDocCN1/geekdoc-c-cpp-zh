  md: "(declare-type n (numeric-type))\n(declare-type product (numeric-type))\n(declare-type\
    \ counter (numeric-type))\n\n# 4.4.3 How type inference works\n\nThe process of\
    \ type inference has four phases.\n\n+   1. The given program is annotated with\
    \ type variables for all subexpressions of the program.\n2. Constraints on the\
    \ type variables are formulated based on the semantic structure of the program.\n\
    3. The constraints are unified to eliminate as many of the variables as possible.\n\
    4. The annotated program is specialized using the dictionary produced by unification\
    \ of the constraints to make a new annotated program whose type annotations incorporate\
    \ the constraints.\n\nThe plan is implemented in this procedure:\n\n```\n(define\
    \ (infer-program-types expr)\n  (let ((texpr (annotate-program expr))\n    (let\
    \ ((constraints (program-constraints texpr)))\n      (let ((dict (unify-constraints\
    \ constraints)))\n        (if dict\n          (match:dict-substitution dict) texpr)\n\
    \          ***type-error***))))))\n```\n\nThis procedure complains if the program\
    \ expression cannot be consistently typed. However, it gives no explanation about\
    \ why it failed; this could be accomplished by passing information back in the\
    \ failure continuations.\n\n# Annotation\n\nThe annotate-program procedure is\
    \ implemented in terms of a generic procedure, annotate-expr, to allow easy extension\
    \ for new language features."
