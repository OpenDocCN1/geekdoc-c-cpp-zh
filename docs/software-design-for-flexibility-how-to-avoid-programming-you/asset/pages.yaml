    each representing an alternative value for the amb expression. The thunks are
    produced by an amb macro, which syntactically transforms amb expressions into
    amb-list expressions, as follows:


    ```

    (amb en) =>=

    (amb-list (list (lambda () el) ... (lambda () en)))

    ```


