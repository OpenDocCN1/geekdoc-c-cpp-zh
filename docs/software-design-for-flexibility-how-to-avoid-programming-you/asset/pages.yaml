  md: "# 6.2.1 Layered data\n\nA layered data item is a base value annotated with\
    \ extra information about that value. The annotation is an association of layer\
    \ names with their values. For example, the number 2 may be the base value in\
    \ many data items: if we are dealing with tatoes there may be a 2-dollar price\
    \ tag on a 2-pound bag of potatoes. Each of these instances of the number 2 must\
    \ be a distinct data item, with different values (dollars or pounds) for the units.\
    \ There may be other layers as well: the 2-dollar price may have information saying\
    \ how it was derived from the price paid to the farmer and the cost of transportation\
    \ and processing.\n\nTo address this issue we introduce the layered datum. A layered\
    \ datum is represented as a bundle that contains an association of layers and\
    \ their values. So a 2-pound quantity of potatoes and a 2-dollar price for potatoes\
    \ will be separate layered data items:\n\n```\n(define make-layered-datum base-value\
    \ alist)\n  (if null? alist)\n    base-value\n    (let ((cons base-layer base-value)\n\
    \      alist))\n  (define has-layer? layer)\n    (and asv alist #t))\n  (define\
    \ (get-layer-value layer)\n    (cdr asv alist))\n  (define (annotation-layers)\n\
    \    (map car (cdr alist)))\n  (bundle layered-datum?)\n    has-layer? get-layer-value\n\
    \    annotation-layers)))\n```\n\nThe associations between layers and their values\
    \ are represented as an association list, or alist—list of key–value pairs.\n\n\
    For convenience, we provide layered-datum, which takes its layer arguments in\
    \ property-list form (alternating layer and value, as in the examples on page\
    \ 300) and calls make-layered-datum with the corresponding alist.\n\n```\n(define\
    \ layered-datum base-value . plist)\n  (make-layered-datum base-value (plist->alist\
    \ plist)))\n```"
