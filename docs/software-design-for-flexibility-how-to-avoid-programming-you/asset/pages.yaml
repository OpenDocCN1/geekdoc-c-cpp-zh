  md: '# #3 Variations on an Arithmetic Theme


    In this chapter we introduce the extremely powerful but potentially dangerous
    flexibility technique of predicate-dispatched generic procedures. We start out
    in the relatively calm waters of arithmetic, modulating the meanings of the operator
    symbols.


    We first generalize arithmetic to deal with symbolic algebraic expressions, and
    then to functions. We use a combinator system where the elements being combined
    are packages of arithmetic operations.


    But soon we want even more flexibility. So we invent dynamically extensible generic
    procedures, where the applicability of a handler is determined by predicates on
    the supplied arguments. This is very powerful and great fun. Using generic procedures
    to extend the arithmetic to operate on “differential objects,” we get automatic
    differentiation with very little work!


    Predicate dispatch is pretty expensive, so we investigate ways to ameliorate this
    expense. In the process we invent a kind of tagged data, where a tag is just a
    way of memoizing the value of a predicate. To finish the chapter we demonstrate
    the power of generic procedures with the design of a simple, but easy to elaborate,
    adventure game.


