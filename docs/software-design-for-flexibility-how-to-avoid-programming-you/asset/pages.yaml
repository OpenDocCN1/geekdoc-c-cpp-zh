- pgno: 379
  md: 'redundant designs can be effective in combating attacks: if there is no single
    thread of execution that can be subverted, an attack that disables or delays one
    of the paths will not impede the computation, because an alternate path can substitute.
    Redundant and degenerate parallel computations contribute to integrity and resiliency:
    computations that proceed along variant paths can be checked to assure integrity.
    The work of subverting parallel computations increases because of the cross-thread
    invariants.


    The propagator model is essentially concurrent, distributed, and scalable, with
    strong isolation and a built-in assumption of parallel computation. Multiple independent
    propagators are computing and contributing to the information in the shared cells,
    where the information is merged and contradictions are noted and acted upon.


    # 7.1 An example: Distances to stars


    Consider a problem of astronomy, the estimation of the distance to stars. This
    is very hard, because the distances are enormous. Even for the closest stars,
    for which we can use parallax measurements, with the radius of the Earth''s orbit
    as a baseline, the angular variation of the position of a star is a small part
    of an arcsecond. Indeed, the unit of distance for stellar distances is the parsec,
    which is the altitude of a triangle based on the diameter of the Earth''s orbit,
    where the vertex angle is 2 arcseconds. The parallax is measured by observing
    the variation of position of the star against the background as the Earth revolves
    annually around the Sun. (See figure 7.2.)'
