    In unify:internal the patterns to be unified, pattern1 and pattern2 are wrapped
    in lists. The unifier program will compare these lists by term, building a dictionary
    that makes corresponding terms equal. The match succeeds if both lists of terms
    are simultaneously exhausted. At the top level, in unify:internal, the term list
    contains the two given patterns, and the central unification procedure, unify:dispatch,
    will recursively descend into the pattern, comparing subpatterns of the patterns
    as lists of terms.


    ```

