  md: "The conditional cond takes a number of clauses. Each clause has a predicate\
    \ expression, which may be either true or false, and a consequent expression.\
    \ The value of the cond expression is the value of the consequent expression of\
    \ the first clause for which the corresponding predicate expression is true. The\
    \ general form of a conditional expression is\n\n```\n(cond predicate-l consequent-l)\n\
    \  (predicate-n consequent-n)\n```\n\nFor convenience there is a special keyword\
    \ else that can be used as the predicate in the last clause of a cond.\n\nThe\
    \ if special form provides another way to make a conditional when there is only\
    \ a binary choice to be made. For example, because we have to do something special\
    \ only when the argument is negative, we could have defined abs as:\n\n```\n(define\
    \ abs x)\n  (if (< x 0)\n    (- x)\n    x)\n```\n\nThe general form of an if expression\
    \ is\n\n```\n(if predicate consequent alternative)\n```\n\nIf the predicate is\
    \ true the value of the if expression is the value of the consequent, otherwise\
    \ it is the value of the alternative.\n\n# Recursive procedures\n\nGiven conditionals\
    \ and definitions, we can write recursive procedures. For example, to compute\
    \ the nth factorial number we may write:\n\n```\n(define (factorial n)\n  (if\
    \ (= n 0)\n    1\n    (* n (factorial (- n 1))))\n```\n\n```\n(factorial 6)\n\
    720\n```"
