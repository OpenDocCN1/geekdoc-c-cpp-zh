  md: "The patterns that we are using for matching against graphs expressions of a\
    \ small language that we want to compile into match procedures. The syntax of\
    \ graph-pattern expressions can be described in BNF. Here a prefix * indicates\
    \ 0 or more occurrences, postfix + indicates 1 or more, and postfix ? indicates\
    \ 0 or 1 occurrence. An infix | indicates alternatives. Items surrounded in \"\
    \ are literal strings. For example, a pattern variable to a single element starts\
    \ with (?, an optional name and optional predicate, and ends with ).\n\n```\n\
    <edge> = <edge-label> <target>\n<edge-label> = <symbol>\n<target> = <node-var>\
    \ | <object-var> | <constant>\n<node-var> = <single-var> | <sequence-var>\n<single-var>\
    \ = \"? <var-name>? <unary-predicate>? \"\"\n<sequence-var> = \"* <var-name>?\
    \ <unary-predicate>? \"\"\n<var-name> = <symbol>\n```\n\n```\npath = <node-var>\
    \ <path-elements>\n<path-elements> = <path-element>*\n```\n\nIn our graph-matching\
    \ language every path in a graph starts with a node variable. A variable is a\
    \ single-element variable, which satisfies the predicate match:element-var?. We\
    \ compile a path as:\n\n```\n(define (gmatch:compile-path path)\n  (if (and (pair\
    \ path) (match:element-var? (car path)))\n      (gmatch:finish-compile-path (cdr\
    \ path))\n        (gmatch:compile-var (car path))\n    (error \"Ill-formed path:\"\
    \ path)))\n```\n\nHere we check that the first element of path is an element variable;\
    \ if so"
