    # 5.3 Compiling to execution procedures


    The evaluator that we have been working with is extremely flexible and extensible,
    but it is dumb: our programs run rather slowly. One culprit is that the evaluator
    is repeatedly looking at the syntax (however simple) of the program. We avoided
    this problem in chapter 4 by transforming each matcher pattern into a composition
    of matcher procedures that all have the same form—a combinator language—in section
    4.3. In interpreting a language we can avoid reexam the syntactic structure by
    similarly compiling into a composition of execution procedures. So before getting
    deeper into evaluation, let''s make this transition.


    The critical idea is to separate the problem of evaluation of an expression relative
    to the environment into two phases. In the first phase the expression is analyzed
    and converted into an execution procedure. In the second phase that execution
    procedure is applied to an environment, producing the expected evaluation result.
    We implement this idea directly, as the composition of the two phases.'
