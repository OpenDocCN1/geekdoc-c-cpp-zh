    The procedure unify:dispatch, which takes two input lists of terms, is the core
    of the recursive descent matcher. The match process depends on the contents of
    the term lists. For example, if both terms begin with a constant, as in (ben franklin)
    and (ben (? fn)), the constants must be compared, and the match can proceed only
    if the constants are equal. If one term list begins with a variable, the other
    can begin with any term, and the variable must be bound to the term it. (If both
    are variables, one of the variables will be eliminated in favor of the other.)
    So, if one term list is ((? bmo) 6 1705) and the other is (jan (? bday 1705),
    then the variable (? bmo) must be bound to the value jan to proceed. If both terms
    start with a list that is not a variable, the match must recursively match the
    corresponding sublists before proceeding to match the rest of the given term lists.'
