    # 3.5 Efficient user-defined types


    In 3.4.2 we introduced tags as part of a caching mechanism for dispatch. Each
    argument is mapped to a tag, and the list of tags is then used as a key in a cache
    to obtain the handler. If the cache has a handler associated with this list of
    tags, it is used. If not, the tries of predicates is used to find the appropriate
    handler and it is entered into the cache associated with the list of tags.


    This mechanism is pretty crude: the predicates that can be used for the applicability
    specifications are restricted to those that always give the same boolean value
    for two objects with the same tag. So the discrimination of types cannot be any
    finer than the available tags. The tags were implementation-specific symbols,
    such as pair, vector, or procedure. So severely limits the possible predicates.
    We could not have rules that distinguish between integers that satisfy even-integer?
    and integers that satisfy odd-integer?, for example.


    What is needed is a system of tagging that makes it computationally easy to obtain
    the tag associated with a data item, but where the tags are not restricted to
    a small set of implementation-specific values. This can be accomplished by attaching
    a tag to each data item, either with an explicit structure or via a table of associations.


    We have several problems interwoven here: we want to use predicates in applicability
    specifications; we want an efficient mechanism for dispatch; and we want to be
    able to specify'
