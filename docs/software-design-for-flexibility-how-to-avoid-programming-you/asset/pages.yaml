  md: "to annotate any piece of data or code with other data or code is a crucial\
    \ mechanism in building flexible systems. The decoration of a value is a generalization\
    \ of the tagging used to support extensible generic operations. Here we introduce\
    \ the idea of layered programming. Both the data and the procedures that process\
    \ it will be made up of multiple layers that enable additive annotation without\
    \ introducing clutter.\n\n# 6.1 Using layers\n\nLayers give us the ability to\
    \ sketch out a computation and then elaborate at that computation with metadata\
    \ that is processed along with the computation. Let's consider some annotations\
    \ that we think may be valuable in many situations. For example, suppose we are\
    \ interested in using Newton's first law for gravity:\n\n```\n(define ( F ml m2\
    \ r)\n (* G ml m2) (square r))\n```\n\nThis is a simple numerical calculation,\
    \ but we can elaborate it to carry support information and units.\nWe find Newton's\
    \ constant G by looking up a recent measurement published by NIST:\n\n```\n(define\
    \ G\n(layered-datum 6.67408e-11\nunit-layer (unit 'meter 3 'kilogram -1 'second\
    \ -2)\nsupport-layer (support-set 'CODATA-2018)))\n```\n\nHere we show the numerical\
    \ value of the measurement, the units of that measurement (m³/kg²), and the source\
    \ of the data (its support). We could extend this to also carry the uncertainty\
    \ in the measurement as a range in another layer, but we won't do that here.\n\
    We can also find the mass of the Earth, the mass of the Moon, and the distance\
    \ to the Moon (semimajor axis) from other sources:\n\n```\n(define M-Earth\n(layered-datum\
    \ 5.9722e24\nunit-layer (unit 'kilogram 1))\n```"
