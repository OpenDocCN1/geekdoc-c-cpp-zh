  md: "Term-rewriting systems are powerful tools for creating domain-specific languages\
    \ for manipulating expression-like information. If we have a syntactic system\
    \ of expressions, where we may need to replace some subexpressions with “equivalent”\
    \ subexpressions, we can often use a rule-based term-rewriting system to describe\
    \ those transformations. For example, many compiler optimizations can be expressed\
    \ as local rewrites of program fragments in a larger context. The essential features\
    \ of a term-rewriting system are the use of a pattern matcher to identify the\
    \ information to be transformed, and a template system for instantiating the replacement.\
    \ There has been extensive research [72] into the problem of constructing convergent\
    \ term-rewriting systems from equational theories (systems of “equivalent” expressions),\
    \ but we won't get into that here. Also, there is a superficial similarity between\
