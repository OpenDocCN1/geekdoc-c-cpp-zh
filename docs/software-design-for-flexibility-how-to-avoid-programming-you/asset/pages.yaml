    # 4.4.1 How unification works


    We can think of unification as a kind of equation solving. If we think of the
    patterns as structured partial information, unifying them is testing the proposition
    that the two patterns are partial information about the same thing. For patterns
    to unify, the corresponding parts must unify. So unification is setting up equations
    among the corresponding parts and solving for the unknowns (the pieces of information
    left unspecified in each pattern).


    The process is analogous to how we solve numerical equations. The goal is to eliminate
    as many variables in the equations as we can. The result is a list of substitutions
    of expressions for the eliminated variables. We scan the equations for one that
    can be solved for one of the variables in it. Solving for a variable isolates
    it, finding an equivalent expression that does not contain the variable. We eliminate
    the variable by replacing all occurrences of it with its discovered value (the
    equivalent expression), both in the remaining equations and the values associated
    with previously eliminated variables in the substitution list. We then add the
    new substitution to the substitution list. We repeat until there are no more equations
    to be solved or we encounter a contradiction. The result is either a successful
    substitution list or a report of the contradiction.


    In unification the “equations” are the matches of the corresponding parts of the
    two input patterns, and the “substitution list” is the dictionary. One way to
    implement unification is to'
