- pgno: 44
  md: 'For example, functional composition represents a box made of two subboxes so
    that the output of the first feeds the input of the second, as shown in [figure
    2.1]. A program that implements this idea is straightforward:


    ```

    (define compose f g)

    (lambda args)

    (f (apply g args)))

    ```


    ![](img/2e72770736573f9ba6300d8cdb1e28c1_44_0.png)


    **Figure 2.1** The composition f∘g of functions f and g is a new function that
    is defined by this "wiring diagram." The input to f∘g is given to g. The output
    of g is passed to f, and it produces the output of f∘g.


    (It gets more exciting if we want to check that the arities match: that the function
    represented by procedure f takes only one argument, to match the output of g.
    It gets even more fun if g can return multiple values and f must take those arguments.
    We may also want to check that the arguments passed to the composition are the
    right number for g. But these are fine points that we will deal with later.)

    We can demonstrate composition with a simple example:


    ```

    ((compose lambda (x) (list ''foo x))

    (lambda (x) (list ''bar x)))

    fo (bar z))

    ```


    It is sometimes nicer to name the procedure that is being returned by a combinator.
    For example, we could write `compose` as


    ```

    (define compose f g)

    (define the-composition . args)

    (f (apply g args))

    the-composition)

    ```'
