    # 3.3.1 How automatic differentiation works


    The program for automatic differentiation is directly derived from the definition
    of the derivative. Suppose that given a function $f$ and a point $x$ in its domain,
    we want to know the value of the function at a nearby point $f(x+\Delta x)$, where
    $\Delta x$ is a small increment. The derivative of a function $f$ is defined to
    be the derivative $Df$ whose value for particular arguments $x$ is something that
    can be “multiplied” by an increment $\Delta x$ of the argument to get the best
    possible linear approximation to the increment in the value of $f$:


    ```

    $$f(x+\Delta x) \approx f(x) + Df(x)\Delta x$$

    ```


    We implement this definition using a data type that we call a *differential object*.
    A differential object $[x, \delta x]$ can be thought of as a number with a small
    increment, $x + \delta x$. But we treat it as a new numerical quantity similar
    to a complex number: it has two components, a *finite part* and an *infinitesimal
    part*.$^{17}$ We extend each primitive arithmetic function to work with differential
    objects: each primitive arithmetic function $f$ must know its derivative function
    $Df$, so that:


    ```

    $$[x, \delta x] \xrightarrow{f} [f(x), Df(x)\delta x] \quad (3.5)$

    ```


    Note that the derivative of $f$ at the point $x$, $Df(x)$, is the coefficient
    of $\delta x$ in the infinitesimal part of the resulting differential object.


