    # 5.7.2 Solving combinatorial puzzles


    To demonstrate the use of dependency-directed backtracking to solve combinatorial
    puzzles efficiently, consider the famous “multiple dwelling” puzzle:[29]


    Baker, Cooper, Fletcher, Miller, and Smith live on different floors of an apartment
    house that has only five floors. Baker does not live on the top floor. Cooper
    does not live on the bottom floor. Fletcher does not live on either the top or
    the bottom floor. Miller lives on a higher floor than Cooper. Smith does not live
    on a floor adjacent to Fletcher''s. Fletcher does not live on a floor adjacent
    to Cooper''s. Where does everyone live?


    We can set this up as a propagator problem. Here is a unsophisticated formulation
    of the problem:


    ```

    (define (multiple-dwelling)

    (let-cells (baker cooper fletcher miller smith)

    let ((floors ''1 2 3 4 5))

    (p:amb baker floors) (p:amb cooper floors)

    (p:amb fletcher floors) (p:amb miller floors)

    (p:amb smith floors)

    (require-distinct)

    (list baker cooper fletcher miller smith))

    (let-cells ((b=5 #f) (c=1 #f) (f=5 #f)

    (f=1 #f) (m<c #t) (sf #f)

    (fc #f) (one 1) (five 5)

    s-f as-f f-c af-c)

    (p=: five baker b=5) ;Baker is not on 5.)

    ```'
