  md: 'With great power comes even greater responsibility. Every time we create a
    language we must also document it so that it can be taught to others. The programs
    we write today will be read and modified by others in the future. (Indeed, when
    we read next year what we wrote last year, we will be very different and we will
    not remember the details of what we did.) So it is important that we use this
    power very sparingly, and when we do so document the result we will be leaving
    an incomprehensible mess for the next programmer (or for ourselves!) to clean
    up and rewrite. Don''t participate in the creation of a “Tower of Babel."


    The systems that derive from UNIX show both the good and the bad sides of this
    issue. The commands all have their own languages. If you know about `awk` and
    `sed` and `grep` you know that each has its own language, including the really
    ugly and badly defined expression language we discussed in section 2.2. Certainly
    each of those languages helped make the immense problems easier to solve. But
    they do not have a consistent underlying idea that makes them easy to learn and
    understand. Just think about how the quotation conventions of the shell interact
    with the quotation conventions of `grep` and you will appreciate this point. To
    become a UNIX guru you will learn lots of nasty special-case stuff. On the other
    hand, UNIX itself has a wonderfully simple and elegant way to glue stuff together:
