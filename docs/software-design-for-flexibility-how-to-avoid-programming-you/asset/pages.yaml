    # 6.2 Implementation of layering


    There are two parts to layering. The first is that it must be possible to create
    a datum that contains multiple layers of information. In our example, we used
    layered-datum to do this. The second part is that we need to be able to enhance
    a procedure so that it can process each layer (somewhat) independently. A procedure
    enhanced in this way is called a layered procedure.'
