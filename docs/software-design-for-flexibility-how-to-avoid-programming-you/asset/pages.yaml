  md: 'column are 0, 1, or -1; For checkers, the possible directions are the two forward
    diagonals, with the row 1 and the column either -1 or 1. Once a piece becomes
    a king, it can additionally use the backward diagonals, with row -1. In chess,
    the possible moves use additional directions, depending on the piece, while a
    knight move needs a more complex definition. We won''t define the procedures for
    manipulating coordinates; they should be self-explanatory.


    # A checkers referee


    We need a data structure to represent each move. Since any given move may require
    changing a piece''s position multiple times, we will use a list of step objects,
    each of which specifies the piece prior to the step, the piece after the step,
    the board after the step, and whether the step is a jump. Such a list, which we
    will call a path, is ordered from newest to oldest. This ordering facilitates
    sharing of common subpaths that may occur when a move can be continued in multiple
    ways.


    ```

    (step-to step)

    gets the piece after step is taken.

    ```


    ```

    (step-board step)

    gets the board after step is taken.

    ```


    ```

    (make-simple-move new-coords piece board)

    gets a step that moves piece to new-coords on board.

    ```


    ```

    (make-jump new-coords jumped-coords board)

    gets a step that moves piece to new-coords on board and removes the opponent''s
    piece at jumped-coords.

    ```


    ```

    (replace-piece new-piece old-piece board)

    gets a step that replaces old-piece with new-piece on board.

    ```


    ```

    (path-contains-jumps? path)

    tests whether any of the steps in path are jumps.

    ```'
