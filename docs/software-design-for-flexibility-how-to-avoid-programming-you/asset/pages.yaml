  img_proc: true
- pgno: 438
  md: "This is the essence of the lexical scoping discipline of Scheme. The value\
    \ of any variable is obtained by finding its binding in the lexically apparent\
    \ context. There is an implicit context for all the variables defined globally\
    \ by the system. (For example, + is globally bound by the system to the procedure\
    \ that adds numbers.)\n\nUsing the syntactic sugar shown above for square, we\
    \ can write the definition of compose more conveniently:\n\n```\n(define (compose\
    \ f g)\n  (lambda (x)\n    (f (g x))))\n```\n\nIn MIT/GNU Scheme we can use the\
    \ sugar recursively, to write:\n\n```\n(define ((compose f g) x)\n  (f (g x)))\n\
    ```\n\nSometimes it is advantageous to make a definition local to another definition.\
    \ For example, we may define compose as follows:\n\n```\n(define (compose f g)\n\
    \  (define (fog x)\n    (f (g x)))\n  fog)\n```\n\nThe name fog is not defined\
    \ outside the definition of compose, so it is not particularly useful in this\
    \ case, but larger chunks of code are often easier to read if internal pieces\
    \ are given names. Internal definitions must always precede any expressions that\
    \ are not defined in the body of the procedure.\n\n# Conditionals\n\nConditional\
    \ expressions may be used to choose among several expressions to produce a value.\
    \ For example, a procedure that implements the absolute value function may be\
    \ written:\n\n```\n(define (abs x)\n  (cond ((< x 0) (- x))\n    (= x 0) x)\n\
    \    (> x 0) x)))\n```"
