  md: '# 1.4 Exploratory behavior


    One of the most powerful mechanisms of robustness in biological systems is exploratory
    behavior.¹⁶ The idea is that the desired outcome is produced by a generate-and-test
    mechanism (see figure 1.2). This organization allows the generator mechanism to
    be general and to work independently of the testing mechanism that accepts or
    rejects a particular result.


    ![](img/2e72770736573f9ba6300d8cdb1e28c1_32_0.png)


    **Figure 1.2** Exploratory behavior can be accomplished in two ways. One way a
    generator proposes an action (or a result), which may be explicitly rejected by
    a tester. The generator then must propose an alternative. Another way is that
    the generator produces all of the alternatives, without feedback, and a filter
    selects one or more that are acceptable.


    For example, an important component of the rigid skeleton that supports the shape
    of a cell is array of microtubules. Each microtubule is made up of protein units
    that aggregate to form it. Microtubules are continually created and destroyed
    in a living cell; they are created growing out in all directions. However, only
    microtubules that encounter a kinetochore or other stabilizer in the cell membrane
    are stable, thus supporting the shape determined by the positions of the stabilizers
    [71]. So the mechanism for growing and maintaining a shape is relatively independent
    of the mechanism'
