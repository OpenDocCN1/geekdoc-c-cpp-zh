    # 3.1.1 A simple ODE integrator


    A differential equation is a description of how the state of a system changes
    as an independent variable is varied; this is called the *evolution* of the system''s
    state.¹ We can approximate the evolution of a system''s state by sampling the
    independent variable at various points and approximating the state change at each
    sample point. This process of approximation is called *numerical integration*.


    Let''s investigate the generality of numerical operations in a numerical integrator
    for second-order ordinary differential equations. We will use an integrator that
    samples its independent variable at uniform intervals, each of which is called
    a *step*. Consider this equation:


    ```

    $D^2x(t) = F(t, x(t)) \quad (3.1)$

    ```


    The essential idea is that a discrete approximation to the second derivative of
    the unknown function is a linear combination of second derivatives of some previous
    steps. The particular coefficients are chosen by numerical analysis and are not
    of interest here.'
