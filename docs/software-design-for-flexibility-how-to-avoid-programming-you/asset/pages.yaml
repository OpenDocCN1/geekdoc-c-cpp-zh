    The **parallel-combine** combinator can be useful in organizing a complex process.
    For example, suppose we have a source of images pieces of vegetable. We may have
    one procedure that given the image can estimate the color of the vegetable, and
    another that can give a description of the shape (leaf, root, stalk, ...). We
    may have a third procedure that can combine these descriptions to identify the
    vegetable. These can be neatly composed with parallel-combine.


