- pgno: 250
  md: "This pattern shares several characteristics with those we've looked at in previous\
    \ sections: element variables are introduced by the ? character; they can have\
    \ names (e.g., source-node); and they can have restrictions (e.g., occupied-by\
    \ 'knight'). We introduce the syntax (?) to indicate an anonymous element variable.\n\
    \nThe pattern match starts with source-node traverses edges labeled nodes that\
    \ we don't care about—and finally travels east to target-node. We call this kind\
    \ of a pattern path, or in the context of chess, a move pattern.\n\nOf course,\
    \ this is only one possible knight move. But we can generate all possible knight\
    \ moves by symmetries: we can reflect the knight move east-west, we can rotate\
    \ clockwise by 90 degrees, and we can rotate it by 180 degrees:\n\n```\ndefine\
    \ all-knight-moves\n(symmetrize-move basic-knight-move\n  reflect-ew rotate-90\
    \ rotate-180))\n```\n\nsymmetry move procedure applies all possible combinations\
    \ of these three symmetries to produce eight moves. The order in which the symmetry\
    \ transformations are applied doesn't matter for the transformations we use.\n\
    \n```\ndefine (symmetrize-move move . transformations)\n(let loop (xforms transformations)\
    \ (moves (list move))\n  (if (null? xforms)\n    moves\n    (loop cdr xforms)\n\
    \        (append moves\n          (map (rewrite-path-edges (car xforms))\n   \
    \         moves)))))\n```\n\nrewrite-path-edges applies its argument to each edge\
    \ label in a move, producing a new move with substituted edge labels.\n example\
    \ of such a symmetry transformation is\n\n```\ndefine (reflect-ew label)\n(case\
    \ label\n  ((east) 'west)\n  ((northeast) 'northwest)\n  ((northwest) 'northeast)\n\
    \  ((southeast) 'southwest)\n  ((southwest) 'southeast))\n```"
