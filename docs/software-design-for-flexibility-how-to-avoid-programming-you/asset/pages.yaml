  md: 'tools that can be used to support principles of flexible and robust design.
    For example, rather than thinking of backtracking as a method of organizing search,
    we can employ it to increase the general applicability of components in a complex
    system that organizes itself to meet externally imposed constraints. We believe
    that by pursuing this synthesis we will obtain better hardware and software systems.


    We started out in chapter 2 with some rather unobjectionable techniques that are
    universally applicable. We introduced the strategy of building systems of combinators—libraries
    of parametric parts that have standardized interfaces. Such parts can be combined
    in many ways to meet a great variety of needs. We demonstrated how this idea can
    be used to simplify the construction of a language of regular-expression matchers.
    We introduced systems of wrappers that allow us to adapt parts to applications
    with different standards than the parts they were built to, and we used this to
    make a language of unit-conversion wrappers. We progressed to build a rule interpreter
    for a language to express the rules of board games like checkers.


    In chapter 3 we embarked on an exciting and dangerous adventure: we investigated
    what can be done if we are allowed to modulate the meanings of the primitive procedures
    of a language. We extended arithmetic to handle symbolic expressions and functions,
    as well as numbers. We created generic procedures and used the extension mechanism
    to integrate forwardautomatic differentiation into our arithmetic. This kind of
    extension is dangerous, but if we are careful, we can make old programs have new
    abilities without losing their old abilities. To make this strategy efficient
    and even more powerful, we proceeded to explore user-defined types, with declarable
    subtype relationships, and we used that to make a simple but easily extensible
    adventure game.


    Pattern matching and pattern-directed invocation, introduced in chapter 4, are
    crucial techniques for erecting domain-specific languages. We started with term-rewriting
    rules for algebraic simplification. We then showed an elegant strategy for compiling
    patterns into a composition of elementary pattern matchers in a system of pattern-matching
    combinators. We then expanded our pattern-matching tools to allow pattern variables
    on both sides of a match, implementing unification, which we then used to make
    an'
