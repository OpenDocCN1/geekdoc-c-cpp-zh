  md: 'In the design of any significant system there are many implementation plans
    proposed for every component at every level of detail. However, in the system
    that is finally delivered this diversity of plans is lost, and usually only one
    unified plan is adopted and implemented. As an ecological system, the loss of
    diversity in the traditional engineering process has serious consequences.


    We rarely build degeneracy into programs, partly because we traditionally have
    supplied no formal mechanisms for mediating its use. But the propagation idea
    provides a natural mechanism to incorporate degeneracy. The use of partial information
    in cells (introduced by Radul and Sussman [99]) allows multiple, perhaps overlapping,
    sources of information to be merged. We illustrated this with intervals in the
    stellar distance example in section 7.1. But there are more ways to merge partial
    information: partially specified symbolic expressions can be merged with unification,
    as shown in section 4.4.2. So the idea of partially specified information is not
    restricted to systems built with propagators, but if this is done in a propagator
    system, as proposed in exercise 7.8 on page 366, we have a paradigm for combining
    the contributions of multiple independent mechanisms. Similarly, we considered
    another idea from the AI problem-solving world for degenerate designs: goal-directed
    invocation. The idea is that instead of specifying “how” we want a goal accomplished,
    by naming a procedure to accomplish it, we specify “what” we want to accomplish,
    and we link procedures that can accomplish that goal. This linkage is often done
    with pattern matching, but is accidental rather than essential. If there is more
    than one way to accomplish the goal, then the choice of an appropriate procedure
    is a choice point that can be registered for backtracking. But chronological backtracking,
    constrained by the control flow of an expression-oriented language, is extremely
    inefficient. We must break out of the expression-evaluation structure to make
    dependency-directed backtracking work well, and propagation is one way to go.
    We still have a potentially exponential search, but the combinatorics are significantly
    reduced by eliminating many bad choices using nogood sets learned from experience.


    Of course, besides using a backtracking search for choosing a particular way to
    accomplish a goal, there are other ways that the goal can invoke degenerate methods.
    For example, we may want to'
