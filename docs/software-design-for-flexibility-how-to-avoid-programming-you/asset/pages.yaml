  md: 'Changing the arity code to use a more general notion of arity would complicate
    it, and our goal here is to have a clear exposition rather than a general solution
    (see exercise 2.2).


    # Exercise 2.1: Arity repair


    The procedures compose and parallel-combine that we have introduced do not obey
    the requirement that they advertise the arity of the combination. Thus they would
    not be good citizens of our family of combinators. Fix the implementations of
    compose and parallel-combine shown above, so that


    +   - they check their components to make sure that the arities are compatible;

    - the combination they construct checks that it is given the correct number of
    arguments when it is called;

    - the combination advertises its arity correctly for get-arity.


    # Exercise 2.2: Arity extension


    Our exposition of useful combinators is flawed in that the arity mechanism we
    displayed cannot handle the more general arity mechanism used by MIT/GNU Scheme.
    For example, the addition procedure, which is the value of +, can take any number
    of arguments:


    ```

    (procedure-arity-min (procedure-arity +)) = 0

    (procedure-arity-max (procedure-arity +)) = #f

    ```


    and the arctangent procedure can take either 1 or 2 arguments:


    ```

    (procedure-arity-min (procedure-arity atan)) = 1

    (procedure-arity-max (procedure-arity atan)) = 2

    ```


    It is useful to extend the handling of arities so that combinators can work with
    these more complex situations.'
