    1970s Colmerauer, Kowalski, Rousseau, and Warren developed Prolog [78], a language
    based on a limited form of first-order predicate calculus, which made backtracking
    search implicit.22


    # 5.4.1 amb


    McCarthy''s amb takes any number of arguments. The value of the amb expression
    is the value of one of the arguments, but we don''t know in advance which one
    is appropriate. For example,


    ```

    (amb 1 2 3)

    ```


    produces the value 1 or 2 or 3, depending on the future of the computation. The
    expression (amb), with no arguments, has no possible values: it is a computational
    failure, rejecting the choices previously made.'
