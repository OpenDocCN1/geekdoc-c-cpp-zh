  md: "electrical circuit is an example of such structure, where the circuit parts\
    \ and circuit nodes are places and the accessibility relation is just the description\
    \ of the interconnect. A board game like chess or checkers is another, where the\
    \ board squares may be represented by nodes in a graph and the adjacency of squares\
    \ may be represented by edges in the graph.\n\nWe implement a graph as a collection\
    \ of nodes and edges. Our graphs are immutable in the sense that once a node or\
    \ an edge is added, it cannot be modified; the graph can be changed only by adding\
    \ more nodes and edges. This will have consequences that we will see in section\
    \ 4.5.\n\nA node contains a collection of edges, and an edge is a combination\
    \ of a label and a value. The label of an edge is an object that is unique over\
    \ eq?, usually a symbol or a number. The value of an edge is a Scheme object,\
    \ often another node.\n\nThis implementation will work with concrete graphs (where\
    \ all of the nodes and edges are available at the time we build the graph) and\
    \ lazy graphs (where the graph is extended, as necessary, at the time of access).\
    \ In the simpler world of linear sequences, a list is a concrete graph and a stream\
    \ is a lazy graph that is generated when referenced.\n\nWe will first look at\
    \ a simple example to see how graphs work. We will then use an extended example,\
    \ a chess referee, to explore complex uses of graphs and pattern matching on graphs.\n\
    \n# 4.5.1 Lists as graphs\n\nWe start with the simple but familiar world of lists.\
