  md: 'If we are to make programs that can manipulate programs, we need to be able
    to write an expression that names such a symbol. This is accomplished by the mechanism
    of quotation. The name of the symbol + is the expression ''+'', and in general
    the name of an expression is the expression preceded by a single quote character.
    Thus the name of expression (+ 3 a) is ''(+ 3 a).


    We can test if two symbols are identical by using the predicate eq?. For example,
    we can write a program to determine if an expression is a sum:


    ```

    (define (sum? expression)

    (and (pair? expression))

    (eq? (car expression) ''+))

    ```


    ```

