    The procedure grab-segment is where the segment matching and backtracking actually
    happen. The term list is broken into two parts: an initial segment (initial) and
    the rest of the terms (terms*). The initial segment (initial) starts out empty
    and terms* is the whole term list. The match tries to proceed with the segment
    variable bound to initial. If that fails, the failure continuation tries to match
    with an element moved from terms* to initial. This is repeated until either a
    match succeeds or the match of the entire term list:


