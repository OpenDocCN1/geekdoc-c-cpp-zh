    # 5.4.2 Implementing amb


    It is nice that we separated the analysis of the expressions of the language from
    the execution, because that allows us to change the execution without changing
    any of the syntactic analysis. Building nondeterministic search into the language
    is a matter of changing only the execution procedures. The critical step is to
    transform the execution procedures into continuation-passing style, where in addition
    to the environment argument, each execution procedure takes two continuation arguments:
    one, typically named succeed, and the other, typically named fail, that is called
    when the computation is successful, and the other, called when the computation
    is unsuccessful.


    The execution procedure returns a proposed value by calling the success continuation
    with the value and a failure continuation. The failure continuation is the “complaint
    department”: if some future of the computation does not like the tendered value,
    it may call the failure continuation with no arguments to demand a different result.


    In section 4.3 we used a returned value of #f as a failure indication. In section
    4.2.2 we used success and failure continuations. The use of success and failure
    continuations is more flexible and can be expanded to include information about
    why the value was rejected.


    So the general pattern of an execution procedure will be:


    ```

    (lambda (environment succeed fail)

    ;; succeed = (lambda (value fail)

    ;; Try this value.

    ;; if don''t like it (fail).

    ```'
