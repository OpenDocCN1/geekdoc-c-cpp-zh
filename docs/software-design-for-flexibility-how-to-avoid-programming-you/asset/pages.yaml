    (let ((new-coords\n      (coords+ piece-coords piece) direction))\n  (and (is-position-on-board?\
    \ new-coords board)\n    (case (position-info new-coords board)\n      ((occupied)\n\
    \        (and (not (path-contains-jumps? path))\n          (cons (make-simple-move\
    \ new-coords\n               piece\n               board))))\n      ((occupied-by-opponent)\n\
    \        (let ((landing (coords+ new-coords direction))\n          (and (is-position-on-board?\
    \ landing)\n            (is-position- unoccupied? landing)\n              (cons\
    \ (make-jump landing\n                   new-coords\n                   piece\n\
    \                   board))))\n        (path)) #f)\n      (else error \"Unknown\
    \ position info\")))\n```\n\nThe procedure looks at the position one step along\
    \ the given direction; if it's unoccupied, then it's possible to move. (We explicitly\
    \ test whether this is a continuation of a jump, as that is not allowed in checkers.)\
