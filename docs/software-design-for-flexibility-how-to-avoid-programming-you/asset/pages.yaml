  md: "# A moral of this story\n\nSolving combinatorial puzzles is fun, but it is\
    \ not the real value of what we have done. Indeed, “SAT solvers” are important\
    \ for solving real-world problems of this kind. But there is a deeper message\
    \ here for the design of computational systems. By generalizing our programming\
    \ from expression structures to wiring diagrams (which can be inconvenient—but\
    \ that can be mitigated by compiling) we have made it possible to smoothly integrate\
    \ nondeterministic choice into programs in a natural and efficient way. We can\
    \ introduce hypotheticals, which provide alternative values supported by propositions\
    \ that may be discarded without pain. This gives us the freedom to treat things\
    \ like quadratic equations correctly. They really have two solutions, and any\
    \ computation based on a choice of one solution may decide to reject it, while\
    \ the other solution may lead, after a long computation, to an acceptable outcome.\
    \ For example, that p:sqrt computes the traditional positive square root of a\
    \ real number, we can build a directional propagator constructor p:honest-sqrt,\
    \ with input cell xA2 and output cell x, that gives us a (hidden) choice of square\
    \ roots:\n\n```\ndefine-p-prop (p:honest-sqrt (xA2) (x))\n(let-cells (mul ` +x)\n\
    \  (p:amb mul ` (-1 +1))\n  (p:sqrt xA2 +x))\n  (p*: mul x x)))\n```\n\nWhat is\
    \ important here is that such choices may be introduced without arranging how\
    \ to handle the ambiguity. For example, the constraint propagator that relates\
    \ numbers to their squares can just use p:honest-sqrt:\n\n```\ndefine-c:prop (c:square\
    \ x xA2)\n(p:square x xA2)\n(p:honest-sqrt xA2 x))\n```\n\n# 7.6 Propagation enables\
    \ degeneracy"
