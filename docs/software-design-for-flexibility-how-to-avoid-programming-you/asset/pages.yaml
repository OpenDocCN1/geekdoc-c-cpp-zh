    # Dependencies mitigate inconsistency


    Dependency annotations on data give us a powerful tool for organizing human-like
    computations: For example, all humans harbor mutually inconsistent beliefs: an
    intelligent person may be committed to the scientific method yet have a strong
    attachment to superstitious or ritual practices; a person may have a strong belief
    in the sanctity of all human life, yet also believe that capital punishment is
    sometimes justified. If we were really logicians this kind of inconsistency would
    be fatal: if we were really to simultaneously believe both propositions P and
    NOT P, then we would have to believe all propositions! But somehow we manage to
    keep inconsistent beliefs by inhibiting all useful thought. Our personal belief
    systems appear to be locally consistent, in there are no contradictions apparent.
    If we observe inconsistencies we do not crash; we may feel conflicted or we may
    chuckle.


    We can attach to each proposition a set of supporting assumptions, allowing deductions
    to be conditional on the assumption set. Then, if a contradiction occurs, a process
    can determine the particular “nogood set” of inconsistent assumptions. The system
    can then “uckle,” realizing that no deductions based on any superset of those
    assumptions can be believed. This chuckling process, dependency-directed backtracking,
    can be used to optimize a complex search process, allowing a search to make the
    best use of its mistakes. By enabling a process to simultaneously hold beliefs
    based on mutually inconsistent sets of assumptions without logical disaster is
    revolutionary.


    # Restrictions on the use of data


    Data is often encumbered by restrictions on the ways it may be used. These encumbrances
    may be determined by statute, by contract, by custom, or by common decency. Some
    of these restrictions are intended to control the diffusion of the data, while
    others are'
