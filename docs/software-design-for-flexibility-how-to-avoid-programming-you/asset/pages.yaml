    # 4.5.4 Chessboards and alternate graph views


    The chessboard, as a graph, incorporates an exciting idea. We want the same patterns
    to work for both players. The edges describing directions are different: north
    for White is south for Black and east for White is west for Black! This makes
    little difference for the major pieces (the rooks, knights, bishops, kings, queens)
    with symmetrical move patterns, but White pawns can move only north and Black
    pawns can move only south. In any case, it would be pleasant to make the move
    descriptions the same for both players.'
