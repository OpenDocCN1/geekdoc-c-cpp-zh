    # 3.1.4 Arithmetic on functions


    Traditional mathematics extends arithmetic on numerical quantities to many other
    kinds of objects. Over the centuries “arithmetic” has been extended to complex
    numbers, vectors, linear transformations and their representations as matrices,
    etc. One particularly revealing extension is to functions. We can combine functions
    of the same type using arithmetic operators:


    ```

    (f+g)(x) = f(x) + g(x)

    (f-g)(x) = f(x) - g(x)

    (fg)(x) = f(x)g(x)

    (f/g)(x) = f(x)/g(x)

    ```


    The functions that are combined must have the same domain and codomain, and an
    arithmetic must be defined on the codomain.


    The extension to functions is not hard. Given an arithmetic package for the codomain
    of the functions that we wish to combine, we can make an arithmetic package that
    implements the function arithmetic, assuming that functions are implemented as
    procedures.


    ```

    (define pure-function-extender codomain-arithmetic)

    (make-arithmetic ''pure-function function?

    (list codomain-arithmetic)

    (lambda name codomain-constant); *** see below

    (lambda args codomain-constant))

    (lambda operator codomain-operation)

    (simple-operation operator function?

    (lambda functions)

    (lambda args)

    (apply-operation codomain-operation)

    ```'
