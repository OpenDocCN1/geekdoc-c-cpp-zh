  md: '# Exercise 6.4: IDE for layered programs


    This exercise is a major design project: the invention of and development of an
    IDE (Integrated Development Environment) for layered systems.


    The idea of layered programs, using layered data and layered procedures, is a
    very nice idea. The goal is to be able to annotate programs with useful and executable
    metadata—such as type declarations, assertions, units, and support—without cluttering
    the text of the base program. However, the text of the program must be linked
    with the text of the annotations, so that any part of the program is edited, the
    related layers are also edited. For example, suppose it is necessary to edit the
    base procedure of some layered procedure. The layers may be information like type
    declarations or how it handles units and support sets. It would be nice for the
    editor to show us these layers and how they are connected to the text of the base
    program, when necessary. Perhaps edits to the text of the base program entail
    edits to the annotation layers. Sometimes this can be done automatically, but
    often the programmer must edit the layers.


