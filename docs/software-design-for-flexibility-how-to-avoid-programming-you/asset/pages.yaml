- pgno: 451
  md: '(radix) is 10. However, we can wrap our program with parameterize to change
    the execution to use another radix:


    ```

    (parameterize ((radix 2))

    (myprog))

    ```


    The syntax of parameterize is the same as the syntax of let, but it can be used
    only for parameters created by make-parameter.


    # Bundles


    MIT/GNU Scheme provides a simple mechanism for building a collection of related
    procedures with shared state: a bundle is a procedure that delegates to a collection
    of named procedures: the first argument to the bundle is the name of the delegate
    to use, and the rest of the arguments are passed to the specified delegate. This
    is similar to the way that some object-oriented languages work, but much simpler,
    and without classes or inheritance.


    A bundle is sometimes called a message-accepting procedure, where the message
    type is the delegate name and the message body is the arguments.¹ This emphasizes
    that the bundle supports a message-passing protocol and can be thought of as a
    node in a communications network.


    Here is a simple example:


    ```

    (define make-point x y)

    (define (get-x) x)

    (define (get-y) y)

    (define (set-x! new-x) (set! x new-x))

    (define (set-y! new-y) (set! y new-y))

    (bundle point? get-y set-x! set-y!))

    ```


    The procedure make-point defines four internal procedures, which share the state
    variables x and y. The bundle macro creates a bundle procedure, for which those
    procedures are the delegates.


    The first argument to the bundle macro is a predicate, which is created with make-bundle-predicate.
    The bundle that is created will satisfy this predicate:


    ```

    (define (make-bundle-predicate ''point))

    ```'
