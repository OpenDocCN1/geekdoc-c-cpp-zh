  md: 'predicates to apply to tendered arguments. The way a generic procedure constructed
    by simple-generic-procedure finds an appropriate handler is to sequentially scan
    the list of rules looking for an applicability that is satisfied by the arguments.


    This is seriously inefficient, because the applicability of many rules may have
    the same predicate in a given operand position: For example, for multiplication
    in a system of numerical and symbolic arithmetic there may be many rules whose
    first predicate is number?. So the number? predicate may be applied many times
    before finding an applicable rule. It would be good to organize the rules so that
    finding an applicable one does not perform redundant tests. This is usually accomplished
    by the use of an index.


    # 3.4.1 Tries


    Simple index mechanism is based on the trie.28

    A tri is traditionally a tree structure, but more generally it may be a directed
    graph. Each node in the trie has edges connecting to successor nodes. Each edge
    has an associated predicate. The data being tested is a linear sequence of features,
    in this case the arguments to a generic procedure.


    Starting at the root of the trie, the first feature is taken from the sequence
    and is tested by each predicate on an edge emanating from the root node. The successful
    predicate''s edge is followed to the next node. The process repeats with the remainder
    of the sequence of features. When we run out of features, the current node will
    contain the associated value, in this case an applicable handler for the arguments.


    It is possible that at any node, more than one predicate may succeed. If this
    happens, then all of the successful branches must be followed. Thus there may
    be multiple applicable handlers, and there must be a separate means of deciding
    what to do.


    Here is how we can use a trie. Evaluating the following sequence of commands will
    incrementally construct the trie shown in figure 3.1.'
