- pgno: 33
  md: 'for specifying the shape. This mechanism partly determines the shapes of many
    types of cells in a complex organism, and it is almost universal in animals.


    Exploratory behavior appears at all levels of detail in biological systems. The
    nervous system of a growing embryo produces a vastly larger number of neurons
    than will persist in the adult. Those neurons that find appropriate targets in
    other neurons, sensory organs, or muscles will survive, and those that find no
    kills themselves. The hand is fashioned by production of a pad and deletion, by
    apoptosis (programmed cell death), of the material between the fingers [131].
    Our bones are continually being remodeled by osteoblasts (which build bone) and
    osteoclasts (which destroy bone). The shape and size of the bones is determined
    by constraints determined by their environment: the parts that they must be associated
    with, such as muscles, ligaments, tendons, and other bones.


    Because the generator need not know how the tester accepts its proposals, and
    the tester need not know how the generator makes its proposals, the two parts
    can be independently developed. This adaptation and evolution mere more efficient,
    because a mutation to one or the other of these subsystems needs not be accompanied
    by a complementary mutation to the other. However, this isolation can be expensive
    because of the wasted effort of generation and rejection of failed proposals.17


    Indeed, generate and test is a metaphor for all of evolution. The mechanisms of
    biological variation are random mutations; modifications of the genetic instructions.
    Most mutations are neutral in that they do not directly affect fitness because
    of degeneracy in the systems. Natural selection is the test phase. It does not
    depend on the method of variation, and the method of variation does not anticipate
    the effect of selection.


    There are even more striking phenomena: in closely related creatures are constructed
    by entirely different mechanisms in the embryo.18 For distant relationships, divergent
    mechanisms for constructing common structures may be attributed to “convergent
    evolution,” but for close relatives it is more likely evidence for separation
    of levels of detail, in which the result is specified in a way that is somewhat
    independent of the way it is accomplished.'
