- pgno: 435
  md: '# B.1 Essential Scheme


    Scheme is a simple programming language based on expressions. An expression names
    a value. For example, the numeral 3.14 names an approximation to a familiar number,
    and the numeral 22/7 names another approximation to to it. There are primitive
    expressions, such as compound numerals, that we directly recognize, and there
    are compound expressions of several kinds.


    Compound expressions are delimited by parentheses. Those that start with distinguished
    keywords, such as if, are called special forms. Those that are not special forms,
    called combinations, denote applications of procedures to arguments.


    # Combinations


    A combination—also called a procedure application—is a sequence of expressions
    delimited by parentheses:


    ```

    (operator operand-1 ... operand-n)

    ```


    The first subexpression in a combination, called the operator, is taken to name
    a procedure, and the rest of the subexpressions, called the operands, are taken
    to name the arguments to that procedure. The value returned by the procedure when
    applied to the given arguments is the value named by the combination. For example,


    ```

    + 1 2.14

    3.14

    ```


    ```

    + 1 (* 2 1.07)

    3.14

    ```


    are both combinations that name the same number as the numeral 3.14.¹ In these
    cases the symbols + and * name procedures that add and multiply, respectively.
    If we replace any subexpression of any expression with an expression that names
    the same thing as the original subexpression, the thing named by the overall expression
    remains unchanged.'
  merge: -1
  img_proc: true
- pgno: 436
  md: 'Note that in Scheme every parenthesis is essential: you cannot add

    extra parentheses or remove any.


    # Lambda expressions


    Just as we use numerals to name numbers, we use lambda

    expressions to name procedures. For example, the procedure that

    squares its input can be written:


    ```

    (lambda (x) (* x x))

    ```


    This expression can be read: “The procedure of one argument, x,

    multiplies x by x.” Of course, we can use this expression in any

    context where a procedure is needed. For example,


    ```

    ((lambda (x) (* x x)) 4)

    16

    ```


    The general form of a lambda expression is


    ```

    (lambda formal-parameters body)

    ```


    where formal-parameters is (usually) a parenthesized list of symbols

    that will be the names of the formal parameters of the procedure.

    When the procedure is applied to arguments, the formal parameters

    will have the arguments as their values. The body is an expression

    that may refer to the formal parameters. The value of a procedure

    application is the value of the body of the procedure with the

    arguments substituted for the formal parameters.


    In the example shown above, the symbol x is the only formal

    parameter of the procedure named by (lambda (x) (* x x)).

    That procedure is applied to the value of the numerical 4, so in the

    body, (* x x), the symbol x has the value 4, and the value of the

    combination ((lambda (x) (* x x)) 4) is 16.


    We said “usually” above because there are exceptions. Some

    procedures, such as the procedure that multiplies numbers, named

    by the symbol *, can take an indefinite number of arguments. We

    will explain how to do that later (on page 389).'
  merge: -1
  img_proc: true
- pgno: 437
  md: '# Definitions


    We can use the define special form to give a name to any object.

    We say that the name identifies a variable whose value is the object.

    For example, if we make the definitions


    ```

    (define pi 3.141592653589793)

    ```


    ```

    (define square (lambda (x) (* x x)))

    ```


    we can then use the symbols pi and square wherever the numeral

    or the lambda expression could appear. For example, the area of the

    surface of a radius of 5


    ```

    (* 4 pi (square 5))

    314.159265358979324

    ```


    Procedure definitions may be expressed more conveniently using

    “syntactic sugar.\ The squaring procedure may be defined


    ```

    (define square x (* x x))

    ```


    which we may read: "To square x multiply x by x."


    In Scheme, procedures are first-class objects: they may be passed

    as arguments, returned as values, and incorporated into data

    structures. For example, it is possible to make a procedure that

    implements the mathematical notion of the composition of two

    functions:4


    ```

    (define compose

    (lambda (f g))

    (lambda (x))

    (f (g x))))

    ```


    ```

    ((compose square sin 2))

    .862821810431806

    ```


    ```

    (square (sin 2))

    .862821810431806

    ```


    One thing to notice is that the values of f and g in the returned

    procedure, (lambda (x) (f (g x))), are the values of the

    formal parameters of the outer procedure, (lambda (f g) ...'
