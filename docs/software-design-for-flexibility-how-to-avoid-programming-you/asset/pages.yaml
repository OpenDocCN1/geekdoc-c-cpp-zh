    However, you may be interested in minutes, hours, days, weeks, years, etc. Don''t
    get stuck trying to make this universal.)


    +   d. Make some useful compounds, like velocity and acceleration.


    +   e. For a real project, extend this specialist system for some other data conversion
    of some other program, having nothing to do with units.


    +   f. Another big extension is to build make-converter so that it can derive
    compound conversions, as required, from previously registered conversions. This
    will require a graph search.'
