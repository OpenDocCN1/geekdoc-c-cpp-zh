    # Exercise 4.19: Can we fix these problems?


    We have a problem with unifying patterns containing segment variables. We may
    miss some matches; we may generate multiple copies of the same solution; and some
    of the solutions, although valid solutions of the problem to make the input patterns
    equal, are not maximally general. Let''s think about fixing this.


