  md: '# 8


    # Epilogue


    Serious engineering is only a few thousand years old. Our attempts at deliberately
    producing very complex robust systems are immature at best. We have yet to glean
    the lessons that biological evolution has learned over the last few billion years.


    We have been more concerned with efficiency and correctness than with the kind
    of robustness of biological systems that comes from optimizing evolability, flexibility,
    and resistance to attack. This is sensible for developing mission-critical systems
    that have barely enough resources to perform their function. However, the rapid
    advance of microelectronics has alleviated the resource problem for most applications.
    Our increasing dependence on computational and communications infrastructure,
    and the development of ever more sophisticated attacks on that infrastructure,
    make it imperative that we turn our attention to robustness.


    We are not advocating biomimetics; but observations of biological systems give
    us hints about how to incorporate powerful principles of robustness into our engineering
    practice. Many of these principles are in direct conflict with the established
    practices of optimization of efficiency and of the ability to prove correctness.
    In this book we deliberately violate these established practices to explore the
    possibilities of optimizing for flexibility. A motivation of our approach is the
    observation that most systems that have survived the test of time are built as
    an assembly of domain-specific languages, each of which is appropriate to make
    some parts of the system easy to construct.


    As part of the effort to build artificially intelligent symbolic systems, the
    AI community has incidentally developed technological'
