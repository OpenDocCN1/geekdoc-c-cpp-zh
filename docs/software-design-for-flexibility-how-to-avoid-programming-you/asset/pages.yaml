  md: 'There are entire families of combinators that we can use in programming that
    we don''t normally think of. Many of these appear in common mathematical contexts.
    For example, tensors are an extension of linear algebra to linear operators with
    multiple arguments. But the idea is more general than that: the “tensor combination”
    of two procedures is just a new procedure that takes a data structure combining
    arguments for the two procedures. It distributes those arguments to the two procedures.
    The need to unbundle a data structure, operate on the parts separately, and rebundle
    the results is ubiquitous in programming. The wiring diagram in [figure 2.3](#
    shows spread-combine. It is a generalization of the tensor product in multilinear
    algebra. In the mathematical tensor product, $f$ and $g$ are linear functions
    of their inputs, and $h$ is a trace over some shared indices; but tensors are
    the special case that inspired this combinator.


    ![](img/2e72770736573f9ba6300d8cdb1e28c1_47_0.png)


    [Figure 2.3](#) In spread-combine the $n +m$ arguments are split between the functions
    $f$ and $g$. The first $n$ arguments go to $f$ and the $m$ other arguments go
    to $g$. The resulting outputs are then combined by the function $h$, of two arguments.


    The program to implement spread-combine is a bit more complicated than parallel-combine,
    because it must distribute'
