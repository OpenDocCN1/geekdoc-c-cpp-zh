    we can know exactly the combination of assumptions that led to a contradiction.
    If we are clear, we can avoid asserting that combination of assumptions later
    in the search. But in the evaluation of expressions it is hard to isolate the
    assertion of assumptions from the flow of control.


    The problem is that in an expression language, the choice decisions are made as
    expressions are evaluated, producing a branching decision tree. The decision tree
    is evaluated in some order, for example, depth first or breadth first. The consequences
    of any sequence of decisions are evaluated after the decisions are made. If a
    failure is encountered on the evolved branch (a contradiction is noted), only
    the decisions on the evolved branch are possible culprits. But if only some of
    the innocent ones were made later than the last culprit. Computations that depend
    only on the innocent decisions are in backing up to the last culprit. So retracting
    a branch to an earlier decision may require losing lots of useful deductions.


    By contrast, in real problems the consequences of decisions are usually local
    and limited. For example, when solving a crossword puzzle we often get stuck—we
    are unable to fill in any blanks that we are sure of. But we can make progress
    by assuming that some box contains a particular letter, without very good evidence
