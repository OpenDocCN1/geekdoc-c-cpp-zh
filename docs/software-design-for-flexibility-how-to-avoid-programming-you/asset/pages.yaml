  md: "# A small library\n\nMany common patterns of usage can be captured as combinators,\
    \ and very pretty programs are often constructed using such techniques. It is\
    \ to our advantage to expose and abstract such common patterns. Here are a few\
    \ more to think about.\n\nOften we have an interface that is more general than\
    \ necessary in a particular situation. In such a case we may want to preserve\
    \ the interface, but call some more specialized procedure that does not need all\
    \ of the parameters we supply in the general case; so we choose to make a version\
    \ of our specialized procedure that ignores some arguments.\n\nThe procedure discard-argument\
    \ takes the index, i, of the argument to be discarded and returns a combinator.\
    \ The combinator takes a function, f, of n arguments and returns a new function\
    \ the-combination of $n+1$ arguments that applies f to $n$ given resulting from\
    \ deleting the ith argument from the $n+1$ arguments. Figure 2.5 illustrates this\
    \ idea. The code for this combinator is:\n\n![](img/2e72770736573f9ba6300d8cdb1e28c1_54_0.png)\n\
    \n**Figure 2.5** The combinator (discard-argument 2) takes a three-argument function\
    \ $f$ and makes a new function of four arguments that ignores its third argument\
    \ (i=2) and passes the remaining arguments to $f$.\n\n```\n(define (discard-argument\
    \ i)\n (assert (exact-nonnegative-integer? i))\n (lambda (f)\n  (let ((m (get-arity\
    \ f)))\n    (define (the-combination . args)\n      (assert (= (length args) m))\n\
    \      (apply f (list-remove args i)))))\n```"
