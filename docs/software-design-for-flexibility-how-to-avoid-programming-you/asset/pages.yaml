    power and address shortcomings of earlier designs have led to a proliferation
    of incompatible languages.


    On the surface, regular expressions look like a combinator language, because expression
    fragments can be combined to make complex expressions. But the meaning of a fragment
    is highly dependent on the expression it is embedded in. For example, if we want
    a caret, Λ in a bracket expression, [...], the caret must not be in the first
    character position, because the caret appears after the first character it is
    just an ordinary character, but if it appears as the first character it negates
    the meaning of the bracket expression. Thus a bracket expression may not contain
    just a caret.


    So the syntax of the regular-expression language is awful; there are various incompatible
    forms of the language; and the quotation conventions are baroque [sic]. While
    regular expression languages are domain-specific languages, they are bad ones.
    Part of the value of examining regular expressions is to experience how bad things
    can be.


    Nevertheless, there is a great deal of useful software, for example grep, that
    uses regular expressions to specify the desired behavior. We will invent a better
    domain-specific combinator language for specifying regular expressions and a means
    of translating this language to conventional regular-expression syntax. We will
    use the POSIX Basic Regular Expression (BRE) syntax as a target for our translator
    [96], since it is a subset of other regular-expression syntaxes. POSIX also defines
