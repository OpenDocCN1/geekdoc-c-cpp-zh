  md: 'When more than one handler is applicable for a given sequence of arguments,
    it is not clear how to use these handlers; addressing this situation is the job
    of a resolution policy. There are many considerations when designing a resolution
    policy. For example, a policy that chooses the most specific handler is often
    a good policy; however, we need more information to implement such a policy. Sometimes
    it is appropriate to run all of the applicable handlers and compare their results.
    This can be used to catch errors and provide a kind of redundancy. Or if we have
    partial information provided by each handler, such as a numerical interval, the
    results of different handlers can be combined to provide better information.


    # 3.4.2 Caching


    With the use of tries we have eliminated redundant evaluation of argument predicates.
    We can do better by using abstraction to eliminate the evaluation of predicates
    altogether. A predicate identifies a set of objects that are distinguished from
    all other objects; in other words, the predicate and the set it distinguishes
    are effectively the same. In our tri implementation, we use the equality of the
    predicate procedures to avoid redundancy; otherwise we would have redundant edges
    in the tri and it would be no help at all. This is also why the use of combinations
    of predicates doesn''t mix well with the tri implementation.


    The problem here is that we want to build an index that discriminates objects
    according to predicates, but the opacity of procedures makes them unreliable when
    used as keys to the index. What we really like is to assign a name to the set
    distinguished by a given predicate. If we had a way to get to that name from a
    given object by superficial examination, we could avoid computing the predicate
    at all. This name is a “type”; but in order to avoid confusion we will refer to
    this name as a tag.


    Given a way to get a tag from an object, we can make a cache that saves the handler
    resulting from a previous dispatch and reuses it for other dispatches whose arguments
    have the same tag pattern. But in the absence of explicitly attached tags, there
    are limitations to this approach, because we can only discriminate objects that
    share an implementation-specified representation. For example, it''s easy to distinguish
    between a number and a symbol, but it''s not easy to'
