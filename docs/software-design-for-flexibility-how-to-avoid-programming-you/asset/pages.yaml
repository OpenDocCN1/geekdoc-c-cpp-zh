  md: '# #7 Propagation


    Decades of programming experience have taken a toll on our collective imagination.
    We come from a culture of scarcity, where computation and memory were expensive,
    and concurrency was difficult to arrange and control. This is no longer true.
    But our languages, our algorithms, and our architectural ideas are based on those
    assumptions. Our languages are basically sequential and directional—even functional
    languages assume that computation is organized around values percolating up through
    expression trees. Multidirectional constraints are hard to express in functional
    languages.


    # Escaping the Von Neumann straitjacket


    The propagator model of computation [99] provides one avenue of escape. The propagator
    model is built on the idea that the basic computational elements are propagators,
    autonomous independent machines interconnected by shared cells through which they
    communicate. Each propagator continuously examines the cells it is connected to,
    and adds information to some cells based on computations it can make from information
    it can get from others. Cells accumulate information and propagators produce information.


    Since the propagator infrastructure is based on propagation of data through interconnected
    independent machines, propagator structures are better expressed as wiring diagrams
    than as expression trees. In such a system partial results are useful, even though
    they are not complete. For example, the usual way to compute a square root is
    by successive refinement using Heron''s'
  merge: -1
