- pgno: 8
  md: '# Foreword


    Sometimes when you''re writing a program, you get stuck. Maybe it''s because you
    realize you didn''t appreciate some aspect of the problem, but all too often it''s
    because you made some decision early in the program design process, about a choice
    of data structure or a way of organizing the code, that has turned out to be too
    limiting, and also to be difficult to undo.


    This book is a master class in specific program organization strategies that maintain
    flexibility. We all know now that it is very easy to declare an array of fixed
    size to hold data to be processed, such a design decision turn out to be an unpleasant
    limitation that may make it impossible to handle input lines longer than a certain
    length, or to handle more a fixed number of records. Many security bugs, especially
    in the code for the Internet, have been consequences of allocating a fixed-size
    memory buffer and then failing to check whether the data to be processed would
    fit in the buffer. Dynamically allocated storage (whether provided by a C-style
    malloc library or by an automatic garbage collector), while more complicated,
    is much more flexible and, as an extra benefit, less error-prone (especially when
    the programming language always checks array references to make sure the index
    is within bounds). That''s just a very simple example.


    A number of early programming language designs in effect made a design commitment
    to reflect the style of hardware organization called the Harvard architecture:
    the code is here, the data is there, and the job of the code is to message the
    data. But an inflexible, arm''s-length separation between code and data turns
    out to be a significant limitation on program organization. Well before the end
    of the twentieth century, we learned from functional programming languages (such
    as ML, Scheme, and Haskell) and from object-oriented programming languages (such
    as Simula, Smalltalk, C++,,'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'and Java) that there are advantages to being able to treat code as data, to
    treat data as code, and to bundle small amounts of code and related data together
    rather than organizing code and data separately as monolithic chunks. The most
    flexible kind of data is a record structure that can contain not only “primitive
    data items” such as numbers and characters but also references to executable code,
    as a function. The most powerful kind of code constructs other code that has been
    bundled with just the right amount of curated data; such a bundle is not just
    a “function pointer” but a closure (in a functional language) or an object (in
    an object-oriented language).


    nJerry Sussman and Chris Hanson draw on their collective century of programming
    experience to present a set of techniques, developed and tested during decades
    of teaching at MIT, that further extend this basic strategy for flexibility. Don''t
    use functions; use generic functions, which are open-ended in a way that plain
    functions are not. Keep functions small. Often the best thing for a function to
    return is another function (that has been customized with curated data). Be prepared
    to treat data as code, perhaps even to the extreme of creating a new embedded
    programming language within your application if necessary. (That is one view of
    how the Scheme language got its start: the MacLisp dialect of Lisp did not support
    a completely general form of function closure, so Jerry and I simply used MacLisp
    as an embedded dialect of Lisp that did support the kind of function closure we
    needed.) Be prepared to replace a data structure with a more general data structure
    that subsumes the original and extends its capabilities. Use automatic constraint
    propagation to avoid a premature commitment to which data items are inputs and
    which are outputs.


    This book is not a survey, or a tutorial—as I said before, it is a master class.
    In each chapter, watch as two experts demonstrate an advanced technique by incrementally
    developing a chunk of working code, explaining the strategy as they go, occasionally
    pausing to point out a pitfall or to remove a limitation. Then be prepared, when
    called on, to demonstrate the technique yourself, by extending a data structure
    or writing additional code—and then to use your imagination and creativity to
    go beyond what they demonstrated. The ideas in this book are rich and deep; close
    attention to both the prose and the code will be rewarded.'
  merge: -1
  img_proc: true
