- pgno: 312
  md: 'We have already encountered explicit backtracking search for matching segment
    variables in pattern matching. But even in the absence of segment variables, the
    implementation of the term-rewriting system required some backtracking search.
    When a rule''s consequent expression determined that the match was not selective
    enough for the consequent to replace the matched part of the data, even though
    the antecedent pattern of the rule matched a piece of data, the consequent expression
    returned #f, failing back into the match and trying a different rule.


    Also, the tri mechanism for optimizing the access to a generic procedure handles
    backtracking. The tri chases a sequence of predicates that the sequence of arguments
    must satisfy. But there may be multiple ways that an initial segment of predicates
    matches the initial segment of arguments, so there is an implicit search built
    into the tri mechanism.


    We normally think of backtracking, and its extreme use in search, as an AI technique.
    However, backtracking can be viewed as a way of making systems that are modular
    and independently evolvable, as in the exploratory behavior of biological systems.
    Consider a simple but practical example: solving a quadratic equation. There are
    two roots to a quadratic. We could return both, and assume that the solution knows
    how to deal with that, or we could return one and hope for the best. (The canonical
    square-root procedure sqrt returns the positive square root, even though there
    are two square roots!) The disadvantage of returning both solutions is that the
    receiver of that result must know to try the computation with both and either
    reject one, or return both results of the computation, which may itself have some
    choices. The disadvantage of returning only one solution is that it may not be
    the right one for the receiver''s purpose. This can be a real problem in simulations
    of physical systems.


    # Linguistically implicit search


    The searches we have explicitly built are okay, but perhaps we can do better by
    building a backtracking mechanism into the linguistic infrastructure. The square-root
    procedure should return one of the roots, with the option to change its mind and
    return the other one if the first choice is determined to be inappropriate by
    the receiver.'
