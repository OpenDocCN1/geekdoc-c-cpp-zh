    # Underlying continuations


    The idea is that the sugar for the expression that contains the subexpression
    is just syntactic sugar for a procedure that accepts the value of the subexpression
    for later use in continuing the evaluation of the expression. This idea is very
    powerful, because the continuation represents the entire future of the computation.
    This deeper understanding of the meaning of an expression allows us to escape
    from the single-valued expression style of programming, at the considerable cost
    of complexity and syntactic nesting.


    Whenever an expression is evaluated, a continuation exists that expects the result
    of the expression. If the expression is evaluated at top level, for example, the
    continuation will take the result, print it on the screen, prompt for the next
    input, evaluate it, and so on, forever. Most of the time the continuation will
    take the result, multiply it by the value stored in a local variable, add seven,
    and give the answer to the top-level continuation to be printed. Normally these
    ubiquitous continuations are hidden behind the scenes, and most programmers do
    not think about them. Scheme provides the ability for a programmer to get the
    underlying continuation of an expression. An underlying continuation is a first-class
    object that can be passed as an argument, returned as a value, and incorporated
    into a data structure. Most other languages do not support the use of first-class
    continuations. (Languages that do have them include SML, Ruby, and Smalltalk.)


