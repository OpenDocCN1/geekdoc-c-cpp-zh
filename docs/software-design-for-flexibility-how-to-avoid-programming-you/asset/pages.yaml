    # 2.2.1 A regular expression combinator language


    Patterns are built out of these primitive patterns:


    +   (r:dot) matches any character except newline


    +   (r:bol) matches only the beginning of a line


    +   (r:eol) matches only the end of a line


    +   (r:quote string) matches the string


    +   (r:char-from string) matches one character that is in the string


    +   (r:char-not-from string) matches one character that is not in the string


    Patterns can be combined to make compound patterns:


    +   (r:seq pattern ...)\This pattern matches each argument pattern in sequence,
    from left to right.


    +   (r:alt pattern ...)\This pattern tries each argument pattern from left to
    right, until one of these alternatives matches. If none matches then this pattern
    does not match.


    +   (r:repeat min max pattern)\This pattern tries to match the argument pattern
    a minimum of min times but no more than a maximum of max times. If max is given
    as #f then no maximum is specified. If max equals min the given pattern must be
    matched exactly that many times.'
