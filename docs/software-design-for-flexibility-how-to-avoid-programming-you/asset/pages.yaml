  md: "There are other ways to estimate the distance to a star. We know the apparent\
    \ brightness of a star decreases with the square of the distance from us, so if\
    \ we knew the intrinsic brightness of the star we could get the distance by measuring\
    \ its apparent brightness.\n\nBy now we have a pretty good theoretical understanding\
    \ that can give reliable and accurate estimates of the intrinsic brightness of\
    \ some kinds of stars. For those stars, spectroscopic analysis of the light we\
    \ receive from the star gives us information about, for example, its state, its\
    \ chemical composition and its mass; and from these we can estimate the intrinsic\
    \ brightness. Vega is a very good example of a star we know a lot about.\n\nAstronomers\
    \ describe the brightness of a star in *magnitudes*. A difference of 5 magnitudes\
    \ is defined to be a factor of 100 in brightness. The intrinsic brightness of\
    \ a star is given as the magnitude it would appear to have if it were situated\
    \ 10 parsecs away from the observer. This is called *absolute magnitude* of the\
    \ star. We can summarize the connection between brightness and distance in a neat\
    \ formula that combines the inverse square law with the definition of magnitudes.\
    \ If $M$ is the absolute magnitude of a star, $m$ and $d$ is the distance to the\
    \ star in parsecs, then $m - M = 5(\\log_{10}(d) - 1)$. This formula can be represented\
    \ by a constraint-propagator constructor:\n\n```\n(define-c:prop\n(c:magnitudes<->distance\
    \ absolute-magnitude\n  absolute-magnitude\n  magnitude-distance)\n\n(let-cells\
    \ dmod mod/5 ld10\n  (ln10 (log 10)) (one 1) (five 5))\n  (c:+ absolute-magnitude\
    \ dmod apparent-magnitude)\n  (c:* five dmod/5 dmod)\n  (c:+ one dmod/5 ld10)\n\
    \  (c:* ln10 ld10 ld10)\n  (c:exp ld10 magnitude-distance)))\n```\n\nNow let's\
    \ wire up some knowledge of Vega. We define some cells and interconnect them with\
    \ the propagators:\n\n```\n(define-cell Vega-apparent-magnitude\n(define-cell\
    \ Vega-absolute-magnitude\n(define-cell Vega-magnitude-distance))\n```"
