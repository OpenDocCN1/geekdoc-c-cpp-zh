    # 6.4.2 Carrying justifications


    More complex justifications may also record the particular operations that were
    used to make the data. This kind of annotation can be used to provide explanations
    (proofs), but it is intrinsically expensive in space—potentially linear in the
    number of operations performed. However, sometimes it is appropriate to attach
    a detailed audit history describing the derivation of a data item, to allow some
    later process to use the derivation for some purpose or to evaluate the validity
    of the derivation for debugging.


    For many purposes, such as legal arguments, it is necessary to know the provenance
    of data: where it was collected, how it was collected, who collected it, how the
    collection was authorized, etc. The detailed derivation of a piece of evidence,
    giving the provenance of each contribution, may be essential to determining if
    it is admissible in a trial.


    The symbolic arithmetic that we built in section 3.1 is one way this can be done.
    In fact, if symbolic arithmetic is used as a layer on numeric arithmetic, then
    every numerical value is annotated with its derivation. The symbolic arithmetic
    annotation could be very expensive, because the symbolic expression for an application
    of a numerical operator includes the symbolic expressions of its inputs. However,
    because we need only a pointer to each input, the space and time cost of annotating
    each operation is often acceptable. So one may overlay this kind of justification
    when it is necessary to provide an explanation, or even temporarily, to track
    a difficult-to-catch bug.


