- pgno: 434
  md: '# Appendix: Scheme


    Programming languages should be designed not by piling feature on top of feature,
    but by removing the weaknesses and restrictions that make additional features
    appear necessary. Scheme demonstrates that a very small number of rules for forming
    expressions, with no restrictions on how they are composed, suffice to form a
    practical and efficient programming language that is flexible enough to support
    most of the major programming paradigms in use today.


    > IEEE Standard for the Scheme Programming Language [61], p. 3


    We give an elementary introduction to the Scheme dialect of Lisp. For a longer
    introduction see the textbook Structure and Interpretation of Computer Programs
    (SICP) [1].


    For a more precise explanation of the language see the IEEE standard [61] and
    the Seventh Revised Report on the Algorithmic Language Scheme (R7RS) [109]


    Some of the programs in this book depend on nonstandard features in MIT/GNU Scheme;
    for documentation of this system see the MIT/GNU Scheme Reference Manual [51].
    Also, for Scheme features that are documented elsewhere the index to the Reference
    Manual provides pointers to the appropriate documents.'
  merge: -1
