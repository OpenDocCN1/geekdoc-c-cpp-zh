    # 6.4 Annotating values with dependencies


    One kind of annotation that a programmer may want to deploy in some parts of a
    program is the tracking of dependencies. Every piece of data (or procedure) came
    from somewhere. Either it entered the computation as a premise that can be labeled
    with its external provenance, or it was created by combining other data. We can
    provide primitive operations of the system with annotation layers that, when processing
    data with justifications, we can annotate the results with appropriate justifications.


    Justifications can be at differing levels of detail. The simplest kind of justification
    is just a set of those premises contributed to the new data. A procedure such
    as addition can form a sum with a justification that is just the union of the
    premises of the justifications of the addends that were supplied. Multiplication
    is similar, but a zero multiplicand is sufficient to force the product to be zero,
    so the justifications of the other factors do not need to be included in the justification
    of the zero product.


    Such simple justifications can be computed and carried without much more than
    a constant overhead, but they can be invaluable in debugging complex processes
    and in the attribution of credit or blame for computations. This much is sufficient
    to support dependency-directed backtracking. (See section 7.5.)


    Externally supplied data can be annotated with a premise that identifies its origin.
    More generally, any data value can be annotated with a set of premises, which
    is called its support set. The support set annotating a datum is usually referred
