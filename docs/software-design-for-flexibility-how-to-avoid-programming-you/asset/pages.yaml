  md: "# 2.3.2 Implementing specializers\n\nHow can we make this work? There are two\
    \ parts: a procedure unit-specializer that wraps a given procedure with the necessary\
    \ unit conversions, and a means of translating the given unit expressions into\
    \ the appropriate unit conversion. The first part is\n\n```\n(define (unit-specializer\
    \ procedure implicit-output-unit\n    implicit-input-units))\n(define (specializer\
    \ specific-output-unit\n    specific-input-units))\n(let ((output-converter\n\
    \    (make-converter implicit-output-unit\n    specific-output-unit))\n  (input-converters\n\
    \    (map make-converter\n      specific-input-units\n      implicit-input-units))))\n\
    (define (specialized-procedure arguments)\n  (output-converter\n    (apply procedure\n\
    \      (map (lambda (argument)\n        (converter argument))\n        input-converters)\n\
    \      arguments))))\n(specialized-procedure))\nspecializer)\n```\n\nThe procedure\
    \ unit-specializer takes a procedure to be specialized and its implicit native\
    \ units, and returns a specializer that takes specific units and creates a specialized\
    \ version of the given procedure. The only tricky part is making sure that unit\
    \ expressions are passed to make-converter in the correct order.\n\nThe second\
    \ part of the solution is make-converter, which takes two unit expressions, and\
    \ returns a converter procedure that converts data in the first unit to the second\
    \ unit. For this problem, we will make a version of make-converter that's really\
    \ dumb: it treats the unit expressions as literal constants that can be compared\
    \ with equal?. With that simplification, make-converter can use a table lookup\
    \ to find the appropriate converter, which means we have to explicitly provide\
    \ every necessary conversion rather than deriving them from primitive unit conversions.\
    \ Here's an example of how the table is created:"
