    +   b. Now that you have all of the solutions, it is easy to eliminate duplicates.
    Create the result of substituting each solution into the inputs. You can check
    that the result of the two substitutions are equal—this is a check that the algorithm
    for solving is correct. Now save the pair of substitution and one result for each
    distinct result. Careful: The name of a variable doesn''t matter, so two resulting
    dictionaries represent the same solution if you get one by uniformly renaming
    variables to the other.


