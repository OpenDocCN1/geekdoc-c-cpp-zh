  md: 'run several possible ways to solve a problem in parallel, choosing the one
    that terminates first.


    Suppose we have several independently implemented procedures all designed to solve
    the same (imprecisely specified) general class of problems. Assume for the moment
    that each design is reasonably competent and actually works correctly for most
    of the problems that might be encountered in actual operation. We know that we
    can make a more robust system by combining the given procedures into a larger
    system that independently invokes each of the given procedures and compares their
    results, choosing the best answer on every problem. If the combination has independent
    ways of determining which answers are acceptable we are in very good shape. But
    even if we are reduced to voting, we get a system that can reliably cover a larger
    space of solutions. Furthermore, if such a system can automatically log all cases
    where one of the designs fails, the operational feedback can be used to improve
    the performance of the procedure that failed.


    This degenerate design strategy can be used at every level of detail. Every component
    of each subsystem itself be degenerately designed. If the components are shared
    among the subsystems, we get a controlled redundancy that is quite powerful. However,
    we can do even better. We can provide a mechanism for consistency checking of
    the independently designed subsystems, even when no particular value in one subsystem
    exactly corresponds to a particular value in another subsystem.


    For a simple example, suppose we have two subsystems that are intended to deliver
    the same result, but computed in completely different ways. Assume that the designers
    agree that at some stage in one of the designs, the product of two of the variables
    in that design must be the same as the sum of two of the variables in the other
    design.¹¹⁸ There is no reason why this predicate should not be computed as soon
    as all of the four values it depends upon available, thus providing consistency
    checking at run time and powerful debugging information to the designers. This
    can be arranged using a locally embedded constraint network.'
