    (if null? terms*)

    (fail)

    (slp append initial (list car terms*))

    (cdr terms*)))

    (let ((dict* (do-substitute var initial dict))

    (if dict*

    (succeeded dict* continue (cdr var-first) terms*)

    (continue))))

    ```


