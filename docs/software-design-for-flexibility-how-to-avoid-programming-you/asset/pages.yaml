  md: 'we will discuss in section 3.1.5. When they fit the domain, they are an excellent
    strategic choice.


    But how do we arrange to build our systems by combining elements of a family of
    mix-and-match components? We must identify a set of primitive components and a
    set of combinators that combine components with the same interface as the primitive
    components. Such sets of combinators are sometimes explicit, but more often implicit,
    in mathematical notation.


    # 2.1.1 Function combinators


    The use of functional notation in mathematics is a combinator discipline. A function
    has a domain, from which its arguments are selected, and a range (codomain) of
    its possible values. There are combinators that produce new functions as combinations
    of others. For example, the composition $f \circ g$ of functions $f$ and $g$ is
    a function that takes arguments in the domain of $g$ and produces values in the
    codomain of $f$. If two functions have the same domain and codomain, and if arithmetic
    is defined on their common codomain, then we can define the sum (or product) of
    the functions as the function that when given an argument in their common domain,
    is the sum (or product) of the values of the two functions at that argument. Languages
    that allow first-class procedures provide a mechanism to support this means of
    combination, but what really matters is a good family of pieces.


    Organizing a system around combinators has several advantages. The parts that
    are made can be arbitrarily matched and matched. Any combination yields a legal
    program, whose behavior transparently depends only on the behaviors of the parts
    and the ways that they are combined. The behavior of the part: it is always acceptable
    to pick up a compound part to use in a new context, without worry about its behavior
    in that context. Thus programs are easy to write, easy to read, and easy to verify.
    A program built on combinators is extensible, because introduction of new parts
    or new combinators does not affect the behavior of existing programs.


    We can think of function combinators as implementing wiring diagrams that specify
    how a function is built by combining its parts.'
