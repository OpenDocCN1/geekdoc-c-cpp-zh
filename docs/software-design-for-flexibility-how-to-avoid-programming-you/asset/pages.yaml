  md: '# Exercise 4.25: Graph matching


    The graph matcher described here is very useful, but there are problems for which
    it isn''t well suited. What is an interesting problem that requires extension(s)
    to the matcher? Find such a problem, define and implement the extension(s), and
    demonstrate its use on some examples.


    #  4.6 Summary


    Patterns are fun, but they are also a very useful way to organize parts of a system
    for additivity. In this chapter we have seen how to build a term-rewriting system.
    A rule-based term-rewriting system makes it easy to write programs that do successful
    replacements of parts of an expression with "equivalent" parts, terminating when
    no more rules are applicable. Such systems are important components of larger
    systems that do symbolic manipulation. Algebraic simplification is one application,
    but compilers do huge amounts of this kind of manipulation, to compute optimizations
    and sometimes to generate code.


    We also saw a flexible way to construct a pattern matcher, by "compiling" into
    a combination of simple matchers that all have the same interface structure. This
    makes it easy to add new features and to make such a system very efficient. When
    we add segment variables, which match an unspecified number of elements, to a
    matcher we find that we have to implement a backtracking system, because there
    may be multiple possible matches to any particular data if the pattern has more
    than one segment variable. This complicates matters significantly. Besides the
    intrinsic complexity of backtracking, the backtracking in the pattern matcher
    must be interfaced to the backtracking system in the rule executive that uses
    the patterns. We will examine more general ways of dealing with backtracking in
    section 5.4. We will investigate even more powerful backtracking strategies in
    section 7.5.2.'
