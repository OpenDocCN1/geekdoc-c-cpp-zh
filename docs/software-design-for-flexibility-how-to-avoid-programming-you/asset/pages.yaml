    # 5.5.3 From continuations to amb


    It turns out that anything we want to do, including implementing amb, can be done
    with just the Scheme native call/cc; let''s see how to do that.


    Indeed, continuations are a natural mechanism for supporting backtracking. A choice
    can be made, and if that choice turns out to be inappropriate, an alternative
    choice can be made and its consequences worked out. (Wouldn''t we like real life
    to have this!) In our square-root example, the square-root program should return
    the amb of both square roots, where amb is the operator that chooses and returns
    one of them, with the option to provide the other if the first is rejected. The
    receiver can then just proceed to use the given solution; but if at some point
    the receiver finds that its computation does not meet some constraint, it can
    fail, causing the amb operator to revise its choice and return with the new choice
    through its continuation. In essence, the continuation allows the generator of
    choices to be written as a coroutine that interacts with the receiver/tester of
    the choices.


