  md: '# Exercise 7.8: Type inference


    In section 4.4.2 we built a type-inference engine as an example of the application
    of unification matching. In this exercise (which is really a substantial project)
    we implement type inference taking advantage of propagation.


    +   a. Given a Scheme program, construct a propagation network with a cell for
    every locus that is useful to type. Each cell will be the repository of the type
    information that will be accumulated about the type information at that locus
    in the program. Construct propagators that connect the cells and impose the type
    constraints implied by the program structure. Use unification match as the cell-merge
    operation. The unification may yield a contradiction if the program cannot be
    typed.


    +   b. There may be some cells of a program where a type is not sufficiently constrained
    by the types of the neighboring cells. However, propagation can be stimulated
    by dropping a general type variable into such a cell and allowing that variable
    to accumulate constraints by propagation. This is called “plunking.” Try it.


    +   c. In hard cases a type inference may require making guesses (using hypotheticals)
    and backtracking on discovery of contradictions. Show cases where this is necessary.


    +   d. Tracking of properties and reasons enables the construction of informative
    error comments, but to do this you must associate each program locus with its
    cell so that things are learned by propagation can be related to the program.
    You may use any kind of “sticky note” you like to associate the locus bidirectionally
    with the cell. In any case, try to make good explanations about why a particular
    locus has the type that was determined, or why a program could not be consistently
    typed.


    +   e. Is this implementation of type inference practical? Why or why not? If
    not, how can it be improved?'
