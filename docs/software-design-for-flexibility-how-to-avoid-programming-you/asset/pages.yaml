    The analysis and conversion of the expression is called compilation, and the work
    it does is said to be done at compile time. The compiler extracts that part of
    the behavior that does not depend on the values of the free variables in the expression.
    This is mostly syntactic analysis, but it is also a venue for some optimizations
    that are implementable by syntactic rules. The resulting execution procedure depends
    on the mapping of symbols to values specified in the environment; the work it
    does is said to be done at run time.


    # Analysis of expressions


    Since we want to be able to extend the language syntax as needed, we implement
    the analysis as a generic procedure, with the default being an application of
    an operator to operands. This has to be a default for Lisp/Scheme because there
    is no syntactic keyword that distinguishes an application.¹⁹


    ```

    (define x:analyze

    (simple-generic-procedure ''x:analyze l1 default-analyze))

    ```


    The convention for x:analyze is that it takes an expression as an argument and
    returns an execution procedure, which takes an, an environment.


    The procedure analyze captures a common usage pattern:


    ```

    (define (analyze expression)

    (make-executor (x:analyze expression)))

    ```


    The purpose of wrapping the execution procedure with the procedure make-executor
    is to aid in debugging. The resulting executor is also a procedure, with the same
    arguments and returned value as the execution procedure that it wraps. One useful
    aspect of this wrapper is that it maintains an “execution trace” that can be helpful
    while determining how a program got to a point of failure.


    As we said, the default analysis is of an application.'
