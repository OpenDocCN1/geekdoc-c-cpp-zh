  md: "```\n(define p1 (make-point 3 4))\n(define p2 (make-point -1 1))\n\n(point?\
    \ p1)\n#t\n(point? p2)\n#t\n(point? (lambda (x) x))\n#f\n```\n\nThe argument to\
    \ make-bundle-predicate is a symbol that is used to identify the predicate when\
    \ debugging.\nIf a predicate is not needed, bundle alternatively accepts #f as\
    \ a first argument. In that case there will be no way to distinguish the created\
    \ bundle procedure from other procedures.\nThe remaining arguments to the bundle\
    \ macro are the names of the delegate procedures: get-x, get-y, set-x!, and set-y!.\n\
    \ names are looked up in the lexical environment of the macro to get the corresponding\
    \ delegate procedures. A bundle procedure is then created, containing an association\
    \ from each name to its delegate procedure.\nWhen the resulting procedure is called,\
    \ its first argument is a symbol that must be the name of one of the delegate\
    \ procedures. The association is used to select the named delegate procedure,\
    \ which is then called with the bundle procedure's remaining arguments as its\
    \ arguments.\nIt is easier to use a bundle than to describe it:\n\n```\n(p1 'get-x)\n\
    3\n(p1 'get-y)\n4\n(p2 'get-x)\n-1\n(p2 'get-y)\n1\n\n(p1 'set-x! 5)\n\n(p1 'get-x)\n\
    5\n(p2 'get-x)\n-1\n```"
