    # Dynamic binding


    We sometimes want to specify the way in which some evaluation or action will be
    accomplished—for example, to specify the radix when printing a number. To do this
    we use an object called a parameter.


    For example, the Scheme procedure number->string produces a character string that
    represents a number in a given radix:


    ```

    (number->string 100 2)

    "1100100"

    (number->string 100 16)

    "64"

    ```


    Suppose we want to use number->string in many places a complex program that we
    run by calling myprog, but we want to be able to control the radix used when the
    program is run. We can accomplish this by making a parameter radix with the default
    value 10:


    ```

    (define radix (make-parameter 10))

    ```


    The value of a parameter is obtained by calling the parameter with no arguments:


    ```

    (radix)

    10

    ```


    We define a specialized version of number->string to use instead of number->string:


    ```

    (define (number->string-radix number)

    (number->string number (radix)))

    ```


    In an execution of (myprog), every call to number->string-radix will produce a
    decimal string, because the default value of'
