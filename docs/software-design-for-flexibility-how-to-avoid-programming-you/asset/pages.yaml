    Once we have user-defined types with declared subset relationships, we enter a
    new realm of possibilities. We demonstrated this with a simple but elegantly extensible
    adventure game. Because our generic procedures dispatch on the types of all of
    their arguments, the descriptions of the behaviors of the entities in our adventure
    game are much simpler and more modular than they would be if we dispatched on
    the first argument to produce a procedure that dispatched on the second argument,
    and so on. Modeling these behaviors in a typical single-dispatch objectoriented
