    #  Dependencies and backtracking


    Using layering, we incorporate dependencies into the propagator infrastructure
    in a natural and efficient way. This allows the system to track and preserve information
    about the provenance of each value. Provenance can be used to provide a coherent
    explanation of how a value was derived, citing the sources and the rules by which
    the source material was combined. This is especially important when we have multiple
    sources, each providing partial information about a value. Dependency tracking
    also provides a substrate for debugging (and possibly for introspective self-debugging).


    Besides foundation beliefs, hypotheticals may be introduced by machines, which
    provide alternative values supported by premises that may be discarded without
    pain. Unlike systems modeled on expression-based languages such as Lisp, there
    is no spurious control flow arising from the expression structure to pollute our
    dependencies and force expensive recomputation of already-computed values when
    backtracking.


    #  Degeneracy, redundancy, and parallelism


    The propagator model incorporates mechanisms to support the integration of redundant
    (actually degenerate) subsystems so that a problem can be addressed in multiple
    disparate ways. Multiply'
