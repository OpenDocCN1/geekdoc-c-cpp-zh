- pgno: 76
  md: '# 2.4 Abstracting a domain


    Let''s look at how a domain-specific language layer can be created as a basis
    for software about board games. There are many common features of board games;
    each game combines some of those features. A domain model can be built that captures
    the common structure of a class of board games, in terms of the abstract concepts
    that describe board games, such as pieces, potential locations, and primitive
    behaviors such as moving and capturing.

    A particular board game program may be constructed entirely in terms of the model.
    If the domain model is sufficiently general, it will support future variation
    without change to the model itself.

    Let''s consider board games such as chess and checkers. They are both two-person
    games played on a board that is a rectangular grid. The players have pieces that
    are array on the board. There is never more than one piece at any position on
    the board. The players alternate moves. Each player chooses a piece and moves
    it to some other location on the board. Sometimes an opponent''s piece is captured.
    This is an informal description of a domain model for a class of board games.

    Based on this kind of domain model we will construct a referee for checkers that
    compute all legal moves for a player at a given state of play. The domain model''s
    implementation is fairly complex, providing implementations of pieces, coordinates,
    and the board. In order to simplify our presentation we will restrict ourselves
    to just what is needed by the referee.

    The general organization of the referee is that it will generate all the legal
    moves for each piece separately and then aggregate them. In order to do this,
    it is helpful to have an abstraction that keeps track of the effects of moving
    a piece. For example, one effect might change a piece''s position, another might
    change its type (e.g., “kinging” in checkers), and yet another might capture an
    opponent''s piece. Each legal move consists of a sequence of such changes applied
    to the initial state of the move.'
