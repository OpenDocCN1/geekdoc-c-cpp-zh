    # 3.6 Summary


    The use of generic procedures introduced in this chapter is both powerful and
    dangerous—it is not for the faint of heart. Allowing the programmer to dynamically
    change the meanings of the primitive operators of the language can result in unmanageable
    code. But if we are careful to extend operators to new types of arguments, without
    changing their behavior on the original types, we can get powerful extensions
    without breaking any old software. Most programming languages do not allow the
    freedom to modify the existing behavior of primitive operators, for good reason.
    However, many of the ideas here are portable and can be safely used. For example,
    in many languages, as diverse as C++ and Haskell, one can overload operators to
    have new meanings on user-defined types.


    Extensions of arithmetic are pretty tame, but we must be aware of the problems
    that can come up, and the subtle bugs that can be evoked: addition of integers
    is associative, but addition of floating-point numbers is not associative; multiplication
    of numbers is commutative, but multiplication of matrices is not. And if we extend
    addition to be concatenation of strings, that extension is not'
