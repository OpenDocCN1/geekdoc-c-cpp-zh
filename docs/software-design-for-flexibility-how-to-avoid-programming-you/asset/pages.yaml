  md: '# 1.3 Redundancy and degeneracy


    Biological nucleotides have evolved a great deal of robustness. One of the characteristics
    of biological systems is that they are redundant. Organs such as the liver and
    kidney are highly redundant: there is vastly more capacity than is necessary to
    do the job, so a person missing a kidney or part of a liver suffers no obvious
    incapacity. Biological systems are also highly degenerate: there are usually many
    ways to satisfy a given requirement.¹13 For example, if a finger is damaged, there
    are ways that the other fingers may be configured to pick up an object. We can
    obtain the necessary energy for life from a great variety of sources: we can metabolize
    carbohydrates, fats, and proteins, even though the mechanisms for digestion and
    for extraction of energy from these sources are quite distinct.


    The genetic code is itself degenerate, in that the map of codons (triples of nucleotides)
    to amino acids is not one-to-one: there are 64 possible codons to specify only
    about 20 possible amino acids [86, 54]. As a consequence, many point mutations
    (changes of a single nucleotide) do not change the protein specified by a coding
    region. Also, quite often the substitution of one amino acid with a similar one
    does not impair the biological activity of a protein. These degeneracies provide
    ways that variation can accumulate without obvious consequences. Furthermore,
    if a gene is duplicated (not an uncommon occurrence), the copies may diverge silently,
    allowing the development of variants that may become valuable in the future, without
    interfering with current viability. In addition, the copies can be placed under
    different transcriptional controls.


    Degeneracy is a product of evolution, and it certainly enables selected for, because
    only creatures that have significant amounts of degeneracy are sufficiently adaptable
    to allow survival as the environment changes,¹⁴ For example, suppose we have some
