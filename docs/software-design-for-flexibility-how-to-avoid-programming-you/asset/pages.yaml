  md: 'intended to delimit the consequences of actions predicated on that data.


    The allowable uses of data may be further restricted by the sender: “I am telling
    you this information in confidence. You may not use it to compete with me, and
    you may not give it to any of my competitors.” Data may also be restricted by
    the receiver: “I don’t want to know anything about that I may not tell my spouse.”


    Although the details may be quite involved, as data is passed from one individual
    or organization to another, the restrictions on which it may be put are changed
    in ways that can often be formulated as algebraic expressions. These expressions
    describe how the restrictions on the use of a particular data item may be computed
    from the history of its transmission: the encumbrances that are added or deleted
    at each step. When parts of one data set are combined with parts of another data
    set, the restrictions on the ways that the extracts may be used and the restrictions
    on the ways they may be combined determine the restrictions on the combination.
    A formalization of this process is a data-purpose algebra [53] description.


    Data-purpose layers can be helpful in building systems that track the distribution
    and use of sensitive data to enable auditing and to inhibit the misuse of that
    data. But this kind of application is much larger than just a simple matter of
    layering. To make it effective requires ways of ensuring the security of the process,
    to prevent leakage through uncontrolled channels or compromise of the tracking
    layers. There is a great deal of research to be done here.


