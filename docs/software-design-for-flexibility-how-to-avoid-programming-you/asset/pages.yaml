- pgno: 75
  md: 'What we have shown here is one possible technique for taking an existing program
    and broadening its applicability without changing the original program. The resulting
    “adapter” mechanism is itself extensible and can be used to generalize many kinds
    of programs.


    This is an important principle: rather rewriting a program to adapt it to a new
    purpose, it’s preferable to start with a simple and general base program and wrap
    it to specialize it for a particular purpose. The program doesn''t know anything
    about the wrappers, and the wrappers make few assumptions about the underlying
    program. And the unit-specializer procedure knows very little about either. Because
    these parts are so loosely coupled, they can each be generalized for many purposes,
    including those we aren''t thinking about here. This is a kind of layering strategy,
    which we will expand upon in chapter 6.


    # Exercise 2.11: Implementing unit conversions


    Here we ask you to fill in the details that make this system work.


