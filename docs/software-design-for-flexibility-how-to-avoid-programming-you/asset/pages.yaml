    # 7.5.1 Dependency-directed backtracking


    Dependency-directed backtracking is a powerful technique that optimizes a backtracking
    search by avoiding asserting a set of premises that support any discovered contradiction.¹³
    The dependency-directed backtracking strategy we use is based on the concept of
    a *nogood* set—a set of premises that cannot all be believed at the same time,
    because their conjunction has been found to support a contradiction. When a cell
    contains two or more contradictory values, the union of the support sets of those
    values is a nogood set.


    When a contradiction is detected, the nogood set for saved to let the backtrack
    know not to try that combination again. To make easy for the backtracking mechanism,
    the nogood set is not stored directly; it is distributed to each premise in the
    nogood set. For example, if the nogood set is {A B ...}, then the premise A gets
    {B C ...}, the premise B gets the set {A C ...}, and so on. For any given premise,
    the list of all the partial nogood sets that have participated in can be obtained
    with the *premise-nogoods* accessor.


    Once the nogood set is saved, the backtrack chooses a hypothetical premise from
    the nogood set (if any) and retracts it. The retraction activates the propagators
    that are neighbors of cells with values previously supported by that hypothetical,
    including the propagator that originally asserted that hypothetical, causing that
    propagator to assert a different hypothetical, if possible. If there are no hypothetical
    premises in the nogood set, the backtrack has no options, so it returns a failure.


    Of course there is a lot of bookkeeping that needs to be done to make this work.
    Let''s understand how that can be implemented.'
