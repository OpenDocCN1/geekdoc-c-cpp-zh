- pgno: 429
  md: 'elementary type-inference system. Finally, we built matchers that match arbitrary
    graphs, not just expression trees, and used graphs and graph matching to express
    the rules for moves in chess in an elegant manner.


    Because all sane computer languages are universal, programmers do not have an
    excuse that a solution cannot be expressed in some language. If seriously pressed,
    good programmers can make an interpreter or compiler for any language they please
    in any language they are stuck with. This is not very hard, but it is probably
    the most powerful move a programmer can make. In chapter 5 we showed how to make
    increasingly powerful languages by interpretation and compilation. We started
    with a simple applicative-order interpreter for a Scheme-like language. For extensibility,
    the interpreter was built on generic procedures. We then extended it to allow
    definitions to declare lazy formal parameters. Next we compiled the language to
    a system of combinators. We then added a model of nondeterministic evaluation,
    with the amb operator. Finally, we showed how by exposing the underlying continuations
    we could arrange to get the power of amb in the underlying Scheme system. In chapter
    6 we began to explore multilayer computations, based on a novel mechanism closely
    related to generic procedures. For example, we modified our arithmetic so that
    a program that computes numerical results from numerical arguments could be extended,
    without modification, to compute the same results, augmented with units. The units
    of the result are automatically derived from the units of the inputs, and combinations
    are checked for consistent units: adding 5 kilograms to 2 meters will signal an
    error. We used the same mechanism to augment programs to carry dependencies, so
    that a result automatically has reference to the sources of the ingredients that
    went into that result.


    The propagator model of chapter 7 is really a way of thinking about the plumbing
    of large systems. Although, in the examples we show in this chapter, the propagators
    are all simple arithmetic functions or relations, the idea is far more general.
    A Propator could be hardware or software. It could be a simple function or a huge
    computer doing an enormous crunch. If it is software, it could be written in any
