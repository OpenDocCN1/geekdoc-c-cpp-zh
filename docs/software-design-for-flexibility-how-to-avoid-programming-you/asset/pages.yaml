  md: '(register-unit-conversion ''fahrenheit ''celsius

    fahrenheit-to-celsius)


    (register-unit-conversion ''celsius ''kelvin

    celsius-to-kelvin)


    This registers the conversions we defined earlier. Once these conversions are
    registered, we can look up either conversion direction by the order of arguments
    passed to make-converter.


    However, what we need isn''t either of these conversions, but instead the conversion
    from fahrenheit to kelvin. Since we don''t want to find it in the existing definitions—an
    interesting but much more complex implementation—we will have to build compound
    conversions from the existing ones. To make that easy, we will introduce an "algebra"
    of unit conversions, as follows:


    ```

    (define (unit*: u1 u2)

    (make-unit-conversion (compose u2 u1)

    (compose (u1:invert ul)

    (unit:invert u2))))

    ```


    The procedure unit*, combined with unit:invert, provides us with a general ability
    to combine unit conversions. For convenience, we will add the following, which
    are easily derived from unit:* andnunit:invert:


    ```

    (unit:/ ul u2)

    (unit:expt u n)

    ```


    With this algebra, we can write the conversions we want:


    ```

    (register-unit-conversion ''fahrenheit ''kelvin

    (unit:* fahrenheit-to-celsius celsius-to-kelvin)

    ```


    ```

    (register-unit-conversion ''(pound (expt inch 2))

    /( newton (expt meter 2))

    (unit:/ pound-to-newton

    (unit:expt inch-to-meter 2)))

    ```


    ```

    (register-unit-conversion ''(expt inch 3) ''(expt u2)

    (unit:expt inch-to-meter 3)

    ```


