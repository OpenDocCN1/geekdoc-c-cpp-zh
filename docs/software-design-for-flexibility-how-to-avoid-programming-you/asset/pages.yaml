  md: "# 6.3.1 Unit arithmetic\n\nWe need an arithmetic of units for the units annotation\
    \ layer on an arithmetic. A unit specification has named base units, and an exponent\
    \ for each base unit.3 In the units arithmetic, the product of unit specifications\
    \ is a new unit specification where the exponent of each base unit is the sum\
    \ of the exponents of the corresponding base units in the arguments.\n\n```\n\
    (unit:* (unit 'kilogram 1 'meter 1 'second -1)\n  (unit 'second -1))\n(unit kilogram\
    \ 1 meter 1 second -2)\n```\n\nHere we assume that the base units are just named\
    \ by symbols, such as kilogram.\n\n# Representation of unit specifications\n\n\
    To make it easy to create a unit specification, we represent it externally as\
    \ a property list (with alternating keys and values) of base unit names and exponents.\n\
    \nBut internally, it is convenient to represent a unit specification as a tagged\
    \ list; so we must convert a raw property list to the list representation, plist->alist.\
    \ We keep the lists sorted by the base unit name. In this conversion we do some\
    \ error checking. The argument list to unit must be in the form of a property\
    \ list. The exponent associated with each base unit must be an exact rational\
    \ number (usually an integer). It is an error if a base unit is duplicated. The\
    \ sort by base unit names will signal an error if the base unit name is not a\
    \ symbol.\n\n```\n(define (unit . plist)\n  (guarantee plist? plist 'unit)\n \
    \ (let ((alist\n    (sort (plist->alist plist)\n      (lambda (p1 p2)\n      \
    \  (symbol<? (car p1) (car p2))))))\n    (if (sorted-alist-repeated-key? alist)\n\
    \        (error \"Base unit repeated\" plist)\n        (for-each (lambda (p)\n\
    \        (guarantee exact-rational? (cdr p))\n          alist)))))\n```"
