    # Layering


    In section 1.1 we alluded to the idea that programming could learn from the practice
    of architecture. A programmer might start with an executable skeleton plan (a
    *parti*) to help try out an idea. When the *parti* looks good the programmer could
    elaborate it with more information.


    For example, declared implementation types may enable the compilation of efficient
    code and inhibit the occurrence of type errors. Declared dimensions and units
    may be added to prevent some bugs and support documentation. Assertions of predicates
    can help with the localization of errors that occur at run time and they could
    support the automatic or manual construction of proofs of “correctness.” Declarations
    of how much precision is needed for some numerical quantities and operations can
    give clarity to numerical analysis problems. Suggestions of alternative implementations
    can enable useful degeneracy in an implementation. We can track the provenance
    of a result by carrying dependencies.


    But the usual of adding these important and powerful features to the text of a
