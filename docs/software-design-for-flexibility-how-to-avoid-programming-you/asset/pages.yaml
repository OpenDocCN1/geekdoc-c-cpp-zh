    # 7.2 The propagation mechanism


    The essential propagation machinery consists of cells, propagators, and a scheduler.
    A cell accumulates information about a value. and it must be able to accept updates
    to that information. It also must be able to alert propagators that are interested
    in its contents about changes to its contents. Each cell maintains a set of propagators
    that may be interested in its contents; these are called neighbors.


    A propagator is a stateless (functional) procedure that is activated by changes
    in the value of any cell it is interested in. Cells that may activate a propagator
    are input cells. An activated propagator gathers information from its input cells
    and may compute an update for one or more output cells. A cell may be both an
    input and an output for a propagator.


    The content of a cell is the information it has accumulated about its value. When
    asked for its value, for example by a propagator, it responds with the strongest
    value it can provide. We have seen this in the use of intervals—a cell reports
    the tightest interval it knows about its value. When a cell receives input it
    determines if the change in its contents makes a change in its strongest value.
    If the strongest value changes, the cell alerts its neighbors. This tells the
    scheduler to activate them. The scheduler is responsible for allocating computational
    resources to the activated propagators. It is intended that the computational
    result of propagation is independent of the details or order of scheduling.


    Cells and propagators are elements organized in a hierarchy. Each cell or propagator
    has a name, a parent, and perhaps a set of children. These are used to construct
    unique path names for each cell or propagator in the hierarchy. The path name
    can be used to access'
