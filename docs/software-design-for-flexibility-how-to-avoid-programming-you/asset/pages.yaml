    analogy, it does not separate the served spaces from the servant spaces. The separation
    of the “essential” features of a program (the code that defines its behavior)
    from the “accidental” ones (e.g., type information for a compiler or code for
    logging) [67] was an attempt to address part of this problem, by explicitly identifying
    “cross-cutting concerns” such as logging. Layering is another way to effect the
    separation. The ability'
