- pgno: 19
  md: '# # 1


    # ## Flexibility in Nature and in Design


    It is difficult to design a mechanism of general utility that does any particular
    job very well, so most engineered systems are designed to perform a specific job.
    General-purpose inventions, such as the screw fastener, are rare and of great
    significance. The digital computer is a breakthrough of this kind, because it
    is a universal machine that can simulate any other information-processing machine.¹¹
    We write software that configures our computers to effect this simulation for
    the specific jobs that we need done.


    We have designed software to do particular jobs very well, as an extension of
    past engineering practice. Each piece of software is designed to do a relatively
    narrow job. As the problem to be solved changes, the software must be changed.
    But small changes to the problem do not often only small changes to the software.
    Software is designed too tightly for to be much flexibility. As a consequence,
    systems cannot evolve gracefully. They are brittle and must be replaced with entirely
    new designs as the problem domain changes² This is slow and expensive.


    Our engineered systems do not have to be brittle. The Internet has been extended
    from a small system to one of global scale. Our cities evolve organically, to
    accommodate new business models, life styles, and means of transportation and
    communication. Indeed, from observation of biological systems we see that it is
    possible to build systems that can be adapted to changes in the environment, both
    individually and as an evolutionary ensemble. Why is this not the way we design
    and build most software? There are historical reasons, but the main reason is
    that we don''t know how to do this generally.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'At this moment it is an accident a system turns out to be robust in the face
    of changes in requirements.


    # Additive programming


    Our goal in this book is to investigate how to construct computational systems
    so that they can be easily adapted to changing requirements. One should not have
    to modify a working program. One should be able to add to it to implement new
    functionality or to adjust old functions for new requirements. We call this **additive
    programming**. We explore techniques to add functionality to an existing program
    without breaking it. Our techniques do not guarantee that the additions are correct:
    the additions must themselves be debugged; but they should not damage existing
    functionality accidentally.


    Many of the techniques we explore in this book are not novel; some of them date
    back to the early days of computing! They are also not a comprehensive set, but
    simply some that we have found useful. Our intention is not to promote the use
    of these techniques, but to encourage a style of thinking that is focused on flexibility.


    In order for additive programming to be possible, it is necessary to minimize
    the assumptions about how a program works and how it will be used. Assumptions
    made during the design and construction of a program may reduce the possible future
    extensions of the program. Instead of making such assumptions, we build our programs
    to make just-in-time decisions based on the environment that the program is running
    in. We will explore several techniques that support this kind of design.


    We can always combine programs to get the union of the behaviors that each supports.
    But we want the whole to be more than the sum of its parts; we want the parts
    of the combined system to cooperate to give the system capabilities that no one
    part can provide by itself. But there are tradeoffs here the parts that we combine
    to make a system must sharply separate concerns. If a part does one thing extremely
    well, it is easier to reuse, and also easier to debug, than one that combines
    several disparate capabilities. If we want to build additively, it is important
    that the individual pieces combine with minimal unintended interactions.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'To facilitate additive programming, it is necessary that the parts we build
    be as simple and general as we can make them. For example, a part that accepts
    a wider range of inputs than is strictly necessary for the problem at hand will
    have a wider applicability than one that doesn''t. And families of parts that
    are built around a standardized interface specification can be mixed and matched
    to make a great variety of systems. It is important to choose the right abstraction
    level for our parts, identifying the domain of discourse for the family and then
    building the family for that domain. We start consideration of these requirements
    in chapter 2.


    For maximum flexibility the range of outputs of a part should be quite small and
    well defined—much smaller than the range of acceptable inputs for any part that
    might receive that output. This is analogous to the static discipline in the digital
    abstraction that we teach to students in introductory computer systems subjects
    [126]. The essence of the digital abstraction is that the outputs are always better
    than the acceptable inputs of the next, so that noise is suppressed.


    In software engineering this principle is enshrined as “Postel''s law” in honor
    of Internet pioneer Jon Postel. RFC760 [97], describing the Internet protocol,
    he wrote: “The implementation of a protocol must be robust. Each implementation
    must expect to interoperate with others created by different individuals. While
    the goal of this specification is to be explicit about the protocol, there is
    the possibility of differing interpretations. In general, an implementation should
    be conservative in its sending behavior, and liberal in its receiving behavior.
    This is usually summarized as “Be conservative in what you do, be liberal in what
    you accept from others.


    Using general parts than appear to necessary builds a degree of flexibility into
    the entire structure of our systems. Small perturbations of the requirements can
    be tolerated, because every component is built to accept perturbed (noisy) inputs.


    A family of mix-and-match parts for a particular domain of discourse is the foundation
    of a domain-specific language. Often the best way to attack a family of hard problems
    is to make a language—a set of primitives, means of combination, and means of
    abstraction—that makes the solutions for those problems easy to express. So we
    want to be able to erect appropriate domain-specific languages as'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'needed, and combine such languages flexibly. We start thinking about domain-specific
    languages in chapter 2. More powerfully, we can implement such languages by direct
    evaluation. We expand on this idea in chapter 5.


    One strategy for enhancing flexibility, which should be familiar to many programmers,
    is generic dispatch. We will explore this extensively in chapter 3. Generic dispatch
    is often a useful way to extend the applicability of a procedure by adding additional
    handlers (methods) based on details of the arguments passed to the procedure.
    By requiring handlers to respond to disjoint sets of arguments, we can avoid breaking
    an existing program when a new handler is added. However, unlike the generic dispatch
    in the typical object-oriented programming context, our generic dispatch doesn''t
    involve ideas like classes, instances, and inheritance. These weaken the separation
    of concerns by introducing spurious ontological commitments.


    A quite different strategy, to be explored in chapter 6, is to layer both data
    and procedures. This exploits the idea that data usually has associated metadata
    that can be processed alongside the data. For example, numerical data has associated
    units. We will show how providing the flexibility of adding layers after the fact
    can enhance a program with new functionality, without any change to the original
    program.


    We can also build systems that combine multiple sources of partial information
    to obtain more complete answers. This is most powerful when the contributions
    come from independent sources of information. In chapter 4 we will see how type
    inference is really a matter of combining multiple sources of partial information.
    Locally deducible clues about the type of a value, for example that a numerical
    comparison requires numerical inputs and produces a boolean output, can be combined
    with other local type constraints to produce nonlocal type constraints.


    In chapter 7 we will see a different way to combine partial information. The distance
    to a nearby star can be estimated geometrically, by parallax: measuring the angle
    by which the star image shifts against the background sky as the Earth revolves
    around the Sun. The distance to the star can also be estimated by consideration
    of its brightness and its spectrum, using our understanding of stellar structure
    and evolution. Such estimates can'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'be combined to get estimates that are more accurate than the individual contributions.


    A dual idea is the use of *degeneracy*: having multiple ways to compute something,
    which can be combined or modulated as needed. There are many valuable uses for
