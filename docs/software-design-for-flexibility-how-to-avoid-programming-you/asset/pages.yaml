  md: '# 3.5.4 Example: An adventure game


    One traditional way to model a world is “object-oriented programming.” The idea
    is that the world being modeled is made up of objects, each of which has independent
    local state, and the coupling between the objects is loose. Each object is assumed
    to have particular behaviors. An object may receive messages from other objects,
    change its state, and send messages to other objects. This is very natural for
    situations where the behavior we wish to model does not depend on the collaboration
    of multiple sources of information: each message comes from one other object.
    This is a tight constraint on the organization of a program.


    There are other ways to break a problem into pieces. We have looked at “arithmetic”
    enough to see that the meaning of an operator, such as *, can depend on the properties
    of multiple arguments. For example, the product of a number and a vector is a
    different operation from the product of two vectors or two numbers. This kind
    of problem is naturally formulated in terms of generic procedures.31


    Consider the problem of modeling a world of “places,” “things,” and “people” with
    generic procedures. How should the state variables that are presumed to be local
    to the entities represented and packaged? What operations are appropriately generic
    over what kinds of entities? Since it is natural to group entities into types
    (or sets) and to express some of the operations as appropriate for all members
    of an inclusive set, how is subtyping to arranged? Any object-oriented view will
    prescribe specific answers to these design questions; here we have more freedom,
    and must design the conventions that will be used.


    To illustrate this process we will build a world for a simple adventure game.
    There is a network of rooms connected by passages and inhabited by a variety of
    creatures, some of which are autonomous in that they can wander around. There
    is an avatar that is controlled by the player. There are things, some of which
    can be picked up and carried by the creatures. There are ways that the creatures
    can interact: a troll can bite another creature and damage it; any creature can
    take a thing carried by another creature.


    Every entity in our world has a set of properties. Some of these are fixed and
    others are changeable. For example, a room is'
