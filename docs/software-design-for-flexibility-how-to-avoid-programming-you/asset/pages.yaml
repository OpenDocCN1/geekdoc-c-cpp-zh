- pgno: 116
  md: 'by simple-generic-procedure. It is a Scheme procedure that can be called with
    the specified number of arguments.


    The procedure define-generic-procedure-handler adds a rule to an existing generic
    procedure. Its first argument is the generic procedure to be extended; the second
    argument is an applicability specification (as on page 73) for the rule being
    added; and the third argument is the handler for arguments that satisfy that specification.


    ```

    (define-generic-procedure-handler generic-procedure applicability handler-procedure)

    ```


    It is often necessary to specify a rule in which different arguments are of different
    types. For example, to make a vector arithmetic package we need to specify the
    interpretation of the * operator. If both arguments are vectors, the appropriate
    handler computes the dot product. If one argument is a scalar and the other is
    a vector, then the appropriate handler scales the vector elements by the scalar.
    The applicability argument is the means by which this is accomplished.


    The simple-generic-procedure constructor we used above to make the generic procedure
    plus is created with the procedure generic-procedure-constructor


    ```

    (define simple-generic-procedure (generic-procedure-constructor make-simple-dispatch-store))

    ```


    where make-simple-dispatch-store is a procedure that encapsulates a strategy for
    saving, retrieving, and choosing a handler.


    The generic-procedure-constructor takes a dispatch-store constructor and produces
    a generic-procedure constructor that itself takes three arguments—a name that
    is useful in debugging, an arity, and a default handler to be used if there are
    no applicable handlers. If the default handler argument is #f, the default handler
    signals an error:


    ```

    ((generic-procedure-constructor dispatch-store-constructor) name)

    ```'
