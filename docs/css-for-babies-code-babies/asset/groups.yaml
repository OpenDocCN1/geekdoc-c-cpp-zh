    ## CSS for Babies™

    Web Design for Babies™ Volume 02


    ## CSS (Cascading Style Sheets)


    Styles define how to display HTML elements


    CSS rules have two main parts: a selector and one or more declarations.


    ```

    selector       declaration       declaration

    H1 { color: blue; background: green; }

    property  value   property  value

    ```


    A declaration always ends with a semicolon and declaration groups are surrounded
    by curly brackets.


    ```

    <link rel="stylesheet" type="text/css" href="hello again.css" />

    ```


    body {background:#00ccff url(''img_funny.png'') no-repeat right top;}


    p { font-size:11em;

    margin-left:105px;}

    a:link { color:green;}}


    .center { border: 1px solid blue; padding: 12px 18px; }


    #navlist a { width: 123px; display: block; }

    #home { width: 45px; height: }


    img:hover { opacity: 1.0; filter: alpha(opacity=100); }


    div.left { float: left; padding-left: 123em; width: 45678px; }


    ## It''s never too early to be standards compliant!


    Show your little ones how to display HTML elements properly with CSS (Cascading
    Style Sheets) and familiarize them with the visual patterns and symbols that make
    up the essential building blocks of the web.


