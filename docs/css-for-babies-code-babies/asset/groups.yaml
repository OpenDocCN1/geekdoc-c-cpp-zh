    ## CSS for Babies™

    Web Design for Babies™ 第 02 卷


    ## CSS（层叠样式表）


    样式定义了如何显示 HTML 元素


    CSS 规则包含两个主要部分：一个选择器和一个或多个声明。


    ```

    selector       declaration       declaration

    H1 { color: blue; background: green; }

    property  value   property  value

    ```


    声明始终以分号结尾，声明组由花括号包围。


    ```

    <link rel="stylesheet" type="text/css" href="hello again.css" />

    ```


    body {background:#00ccff url(''img_funny.png'') no-repeat right top;}


    p { font-size:11em;

    margin-left:105px;}

    a:link { color:green;}}


    .center { border: 1px solid blue; padding: 12px 18px; }


    #navlist a { width: 123px; display: block; }

    #home { width: 45px; height: }


    img:hover { opacity: 1.0; filter: alpha(opacity=100); }


    div.left { float: left; padding-left: 123em; width: 45678px; }


    ## 为标准合规永远不会太早！


    向你的小宝贝们展示如何使用 CSS（层叠样式表）正确显示 HTML 元素，并让他们熟悉构成 Web 必备基础构建块的视觉模式和符号。


