  md: '# NULL


    Null value is a field with no value. It is different with a zero value and it
    has been left blank during record creation.


    # Constraints


    Constraints define rules to restrict what values can be stored in columns. This
    assurances the correctness of the data in the database. For example, we can set
    a primary key for a table so that there is no duplicated rows in the table.


    Common Constraints


    +   - NOT NULL—A column does not accept NULL values.


    +   - DEFAULT—Set a default value to a column when no value is specified to a
    column.


    +   - UNIQUE—No duplicated values in a column.


    +   - Primary Key—A column or a combination of columns that uniquely defines a
    row. The primary key column can not contain a NULL value.


    +   - Foreign Key—A foreign key in one table to a candidate key in another table.


    +   - CHECK—Check whether the value is valid or not.


    # Data Integrity


    +   - Entity Integrity—No duplicate rows in a table.


    +   - Referential Integrity—Referential integrity is violated when deleting a
    row that is referenced by a foreign key in another table.


    For example, a user cant delete the Marketing department from the Departments
    table, as there are two employees working for the Marketing department (#20).
    Deleting the Marketing department violates the referential integrity. See the
    sample records below:


    | DEPT_ID | DEPT_NAME | MANAGER_ID | LOCATION_ID |

    | :--- | :--- | :--- | :--- |

    | 10 | Administration | 200 | 1700 |

    | 20 | Marketing | 201 | 1800 |


