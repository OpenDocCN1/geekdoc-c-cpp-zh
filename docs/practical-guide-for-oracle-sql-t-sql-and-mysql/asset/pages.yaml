  md: '# # Chapter 2

    # Data Types


    You have learned in Chapter 1 that tables are consisted of many columns. When
    you design or modify databases it is very important to understand the different
    data types. There are three main data types: Characters, Numbers, and Date/Time.


    # ## Character Data Types


    Table 2.1 Characters data types for the three database systems


    | Data Type | Oracle SQL | SQL SERVER | MySQL |

    |---|---|---|--|

    | Fixed-length Character for any language | CHAR(n)<br>Hold up to 2000 characters
    | CHAR(n)<br>Hold up to 8000 characters | CHAR(n)<br>Hold up to 255 characters
    |

    | NCHAR for any language | NCHAR(n)<br>Hold up to 2000 characters | NCHAR(n)<br>Hold
    up to 4000 characters | NCHAR(n)<br>Hold up to 65535 characters |

    | variable-length character strings | VARCHAR2(n)<br>Hold up to 4000 characters
    | VARCHAR(n)<br>Hold up to 8000 characters<br>VARCHAR(max)<br>Hold up to 3073
    million characters | VARCHAR(n)<br>Hold up to 255 characters |

    | NVARCHAR2(n) for any language | NVARCHAR2(n)<br>Hold up to 4000 characters |
    NVARCHAR(n)<br>Hold up to 4000 characters<br>NVARCHAR(max)<br>Hold up to 536 million
    characters | NVARCHAR(n)<br>Hold up to 65535 characters |

    | NTEXT for any language | LONG<br>Variable width<br>Hold up to 2 GB characters
    | TEXT<br>Hold up to 4000 characters | TINYTEXT<br>Hold up to 255 characters |

    |  | | RAW(n)<br>Binary data<br>Hold up to 2000 bytes | BINARY(n)<br>Fixed width
    binary data<br>Hold up to 8000 bytes | MEDIUMTEXT<br>Hold up to 16 million characters
    |

    | Character Large Object NCLOB for any language | CLOB<br>NCLOB<br>Hold up to
    4G characters | VARIARYBINARY<br>Variable width binary data<br>Hold up to 8000
    bytes | LONGTEXT<br>4G bytes |

    | Binary Large Object | BLOB<br>Hold up to 4G characters | VARIARY(max)<br>Variable
    width; Hold up to 2 GB | LONGBLOB<br>Hold up to 4294 million characters<br>ENUM(a,
    b, c, ...)<br>List up to 65535 values |

    |  | | IMAGE<br>Variable width; Hold up to 2 GB | SET<br>List up to 64 values
    |'
