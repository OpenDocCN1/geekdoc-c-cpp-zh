    # 6. CASE


    Description: the CASE statement has the functionality of an IF-THEN-ELSE statement.


    Syntax 1


    ```

    CASE

    WHEN condition_1 THEN result_1

    WHEN condition_2 THEN result_2 ...

    WHEN condition_n THEN result_n

    ELSE result

    END

    ```'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# Syntax 2


    ```

    CASE expression

    WHEN value_1 THEN result_1

    WHEN value_2 THEN result_2 ...

    WHEN value_n THEN result_n

    ELSE result

    END

    ```


    The CASE statement always in the SELECT clause. CASE must include the following
    components: WHEN, THEN, and END. ELSE is an optional component.


    You can make any conditional statement using any conditional operator (like WHERE)
    between WHEN and THEN. This stringing together multiple conditional statements
    using AND and OR.


    You can include multiple WHEN statements, as well as an ELSE statement to deal
    with any unaddressed conditions.


    CASE Syntax 1 Example:


    ```

    SELECT dept_name,

    CASE

    WHEN location_id = 1400

    OR location_id = 1500

    OR location_id = 1700

    OR location_id = 2500

    OR location_id = 2700 THEN ''USA''

    WHEN location_id = 1800 THEN ''Canada''

    WHEN location_id = 2400 THEN ''UK''

    END “location"

    FROM Departments;

    ```


    CASE Style 2 Example:


    ```

    SELECT dept_name,

    CASE location_id

    WHEN 1400 THEN ''USA''

