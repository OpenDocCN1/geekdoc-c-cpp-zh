  md: '# Brief History of SQL and Database Systems


    Table 1.1 History of SQL and Database Development


    | Year | SQL and Database Development |

    |---|---|n| 1970 to 1972 | Dr. E.F. Codd introduced in IBM in his paper "A Relational
    Model of Data for Large Shared Data Banks". In the paper he defined RDBMs by Codd''s
    12 rules. |

    | 1970s | Ingres and System R were created at IBM San Jose. System R used the
    SEQU query language. The development of SQL/DS, DB2, and Oracle were based on
    the SEQU query language. |

    | 1976 | Dr. Peter Chen developed the entity-relationship model. This model becomes
    the foundation of many systems analysis and design methods. |

    | 1980s | Structured Query Language increased rapidly. Rational database systems
    became a commercial success. IBM''s DB2 and IBM PC resulted in the launches of
    many new developments of database systems such as PARADOX, base III and IV. |

    | 1990s | Successful Online businesses let to demand for database accessing tools.
    MySQL and Apache became open source solution for the Internet. Application development
    tools including Oracle Developer, Power Builder, and Visual Basic were released.
    |

    | 2000s | The three leading relational database systems in the world are Oracle,
    Microsoft SQL Server and MySQL. |


    # SQL Standards


    Table 1.2 SQL Standards


    | Year | SQL Standard |

    |---|---|n| 1974 | Original SQL (SEQUEL) |

    | 1986 | SQL became a standard by ANSI (American National Standards Institute)
    and ISO (International Standards Organization) |

    | SQL/96 | Major modification (ISO 9075) |

    | SQL/99 | Added many features including recursive queries, triggers, procedural
    and control-of-flow statements, and some object-oriented structures |

    | SQL/2003 | Introduced XML-related features |

    | SQL/2006 | Defined ways for importing and storing XML data in database |

    | SQL/2008 | Added TRUNCATE TABLE statement and INSTEAD OF triggers |'
