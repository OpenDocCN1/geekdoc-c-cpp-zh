  md: '# Updating Views


    Syntax (Oracle)


    ```

    CREATE OR REPLACE VIEW view_name AS

    SELECT column(s)

    FROM tables

    WHERE conditions];

    ```


    Syntax (T-SQL & MySQL)


    ```

    ALTER VIEW view_name AS

    SELECT column(s)

    FROM tables

    [WHERE conditions];

    ```


    Example (Oracle):


    ```

    CREATE OR REPLACE VIEW

    Location_US AS

    SELECT Location_ID, City, Country_ID

    FROM Locations

    WHERE Country_ID = ''US'';

    ```


    | LOCATION_ID | CITY | COUNTRY_ID |

    |---|---|--|

    | 1400 | Southlake | US |

    | 1500 | South San Francisco | US |

    | 1600 | South Brunswick | US |

    | 1700 | Seattle | US |


    Figure 11.14 Output for Oracle CREATE OR REPLACE VIEW (data from the original
    HR schema)


    Example (T-SQL):


    ```

    ALTER VIEW Location_US AS

    SELECT Location_ID, City, Country_ID

    FROM Locations

    WHERE Country_ID = ''US'';

    ```


    | Location_ID | City | Country_ID |

    |---|---|--|

    | 1400 | Southlake | US |

    | 1500 | South San Francisco | US |

    | 1600 | South Brunswick | US |

    | 1700 | Seattle | US |

    | 2500 | Atlanta | US |

    | 2700 | Nashville | US |


    Figure 11.15 Output for T-SQL ALTER VIEW example'
