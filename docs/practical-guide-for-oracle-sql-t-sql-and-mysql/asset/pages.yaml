    # IN Condition


    Description: Test if an expression matches any value in a list of VALUES. It can
    reduce the nneed for multiple OR conditions in SELECT, INSERT, UPDATE, or DELETE
    statement.


    Syntax

    SELECT column(s)

    FROM table

    WHERE column_name IN (value1, value2,...);

