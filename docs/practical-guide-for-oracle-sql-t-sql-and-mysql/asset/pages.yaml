    # ## Common Number Functions


    The numeric functions take a numeric input as an expression and return numeric
    values.

    The return type for most of the numeric functions is NUMBER.


    For aggregate functions AVG ( ), COUNT ( ), MAX ( ), MIN ( ) and SUM ( ) check
    Chapter 7 for examples.


    Let''s list common number functions below.


    Table 8.1: Common Number Functions


    | Oracle SQL | T-SQL | MySQL |

    |---|---|--|

    | CEIL ( ) | CEILING ( ) | CEIL ( ), CEILING ( ) |

    | FLOOR ( ) | FLOOR ( ) | FLOOR ( ) |

    | GREATEST ( ) | | GREATEST ( ) |

    | LEAST ( ) | | LEAST ( ) |

    | MOD ( ) | % | MOD ( ) |

    | POWER (m, n) | POWER (m, n) | POW (m, n), POWER (m, n) |

    | ROUND ( ) | ROUND ( ) | ROUND ( ) |

    | SQRT ( ) | SQRT ( ) | SQRT ( ) |

    | TRUNC ( ) | | TRUNC ( ) |


    CEIL () – Oracle and MySQL


    CEILING () – T-SQL


    **Description:** Returns the smallest whole number greater than or equal to a
    specified number.


    **Syntax**


    ```

    CEIL (number)

    CEILING (number)

    ```


