    # GROUP BY with HAVING Example


    Question: Write a query to count employees for the departments that have three
    employees.


    Answer (Oracle & MySQL):


    ```

    SELECT COUNT (Employee_ID), Dept_ID

    FROM Employees

    GROUP BY Dept_ID

    HAVING COUNT (Employee_ID) = 3;

    ```


    Answer (T-SQL):


    ```

    SELECT COUNT (Employee_ID) AS ‘Number of Employees’, Dept_ID

    FROM Employees

    GROUP BY Dept_ID

    HAVING COUNT (Employee_ID) = 3;

    ```


