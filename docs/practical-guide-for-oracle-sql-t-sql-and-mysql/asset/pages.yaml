  md: '# AND Condition


    **Description:** Test for two or more conditions in a SELECT, INSERT, UPDATE,
    or DELETE statement. All conditions must be true for a record to be selected.


    Syntax


    ```

    SELECT column(s)

    FROM table

    WHERE condition [AND condition];

    ```


    Question 7: Write a query to get employee names with hire date greater than January
    1st, 2017 and salary less than $5,000.


    Answer (Oracle):


    ```

    SELECT First_Name, Last_Name, hire_date

    FROM Employees

    WHERE hire_date > ''01-JAN-17''

    AND salary < 5000;

    ```


    Answer (T-SQL & MySQL):


    ```

    SELECT First_Name, Last_Name, hire_date

    FROM Employees

    WHERE hire_date > ''2017-01-01''

    AND salary < 5000;

    ```


