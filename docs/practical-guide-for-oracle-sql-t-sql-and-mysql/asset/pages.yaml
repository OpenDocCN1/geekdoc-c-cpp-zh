  md: "# # Chapter 10\nJoins\n\nIn relational database design Employee and Department\
    \ are two entities. Employee related data is saved to the Employees table while\
    \ department related data is saved to the Departments table. For linking purpose\
    \ the Department_ID is created between the two tables.\n If want to display employee\
    \ names and department names it is not possible to only use the Employees table\
    \ or the Departments table. To list the department names after the employee names\
    \ we need to use SQL JOIN.\n are four basic SQL joins: (Inner Join), Left Join,\
    \ Right Join, and Full Join. The most useful join is (Inner Join).\n\nTable 10.1\
    \ Common Join types\n\n| (INNER JOIN) | Get records that have matching values\
    \ in both tables. |\n|---|---|\n| LEFT JOIN | Get all records from the table1\
    \ (LEFT table1) and the matched records from table2 (RIGHT table2). If no match\
    \ the result is NULL from table2. |\n| RIGHT JOIN | Get all records from table2\
    \ (RIGHT table1) and the matched records from the table1 (LEFT table2). If no\
    \ match the result is NULL from table1. |\n| FULL JOIN | Get all rows from both\
    \ the table1 and table2. |\n\n# Syntax\n\n```\nSELECT table1.col_name, table2.col_name\n\
    FROM table1\n(INNER) JOIN table2 ON table1.col_name = table2.col_name;\nSELECT\
    \ table1.col_name, table2.col_name\nFROM table1\nLEFT JOIN table2 ON table1.col_name\
    \ = table2.col_name;\nSELECT table1.col_name, table2.col_name\nFROM table1\nRIGHT\
    \ JOIN table2 ON table1.col_name = table2.col_name;\nSELECT table1.col_name, table2.col_name\n\
    FROM table1\nFULL JOIN table2 ON table1.col_name = table2.col_name;\n```"
  merge: -1
