  md: '# 176 Chapter 13 Stored Procedures


    +   - To display message you need to SET SERVEROUPUP ON and using dbms_output.put_line().


    Table 13.1 Comparison for a simple stored procedure


    | Oracle PL/SQL | SQL SERVER T-SQL | MySQL |

    |---|---|--|

    | SET SERVEROUT ON; | | DELIMITER // |

    | CREATE OR REPLACE | CREATE procedure p1 | CREATE procedure p1() |

    | procedure p1 | AS | BEGIN |

    | IS | DECLARE @num INT; | SELECT(*) |

    | num INT; | SET NOCOUNT ON; | FROM regions; |

    | BEGIN | FROM num = count(*) | END; |

    | SELECT count(*) INTO num | PRINT @num; | CALL p1();) |

    | dbms_output.put_line(num); | END; | |

    | FROM regions; | | |

    | END; | | |

    | EXEC p1; | | |


    ![](img/86805baec19af0039b39fad6b4ce02e0_188_0.png)


    Figure 13.1 A simple Oracle procedure


