    # SELECT Statement


    Description—Retrieve records from one or more tables


    Syntax


    ```

    SELECT column(s)

    FROM tables

    [WHERE conditions] —Optional

    [ORDER BY column(s) — [ASC | DESC]; —Optional

    ```


    # SELECT All Columns


    Syntax


    ```

    SELECT *

    FROM tables

    [WHERE conditions] —Optional

    [ORDER BY column(s) — [ASC | DESC]; —Optional

    ```


    Note:


    ```

    ASC — Ascending order

    DESC — Descending order

    ```


