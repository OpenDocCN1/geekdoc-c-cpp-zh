  md: '# Chapter 2 Data Types


    What is the difference between fixed-length characters and variable-length characters?


    **Fixed-length characters—**When you create a fixed size field, like phone numbers,
    SSN, State, CHAR data is a good choice.


    **Variable-length characters—**Many fields have variable-length characters. When
    you create VARCHAR(30) or VARCHAR(32) for first name, as first name is different
    for each person you need to use VARCHAR or VARCHAR2. If a first name is “Peter”,
    only 5 characters are stored in a table (5 bytes), 30. If we use CHAR(30) for
    a first name, all the first names will be stored in 30 characters. Obviously,
    it will waste a lot of storage spaces.


    # Number Data Types


    Table 2.2 Data types for the three database systems

    | Data Type | Oracle SQL | SQL SERVER | MySQL |

    |---|---|---|---|n| Small Integer | NUMBER (3) | TINYINT | TINYINT -128 to 127
    |

    | | | 0 to 255 | 0 to 255 | 0 to 255 UNSIGNED |

    | Median Integer | NUMBER (5) | SMALLINT -32,768 to 32767 | SMALLINT -32,768 to
    32767

    0 to 65,535 UNSIGNED |

    | | | | | MEDIUMINT (n) -8,388,608 to 8,388,608

    0 to 16,772,215 UNSIGNED |

    | Integer 32 bit | NUMBER (10) | INT -2,147,483,648 to -2,147,483,647 | INT (n)
    -2,147,483,648 to -2,147,483,647 |

    | | NUMBER (38) | BIGINT -9,223,372,036,854,775,880 to 9,223,372,036,854,775,880
    | BIGINT (n) -9,223,372,036,854,775,880 to 9,223,372,036,854,775,880 |

    | | | REAL | FLOAT (n, d) Small floating number n—maximum of digits d—decimal
    points |

    | | | Floating number -3.40E+3 to 3.40E-38 | |

    | | | SMALLMONEY -21,748,368 to 214,748,367 | DOUBLE (n, d) Large floating number
    n—maximum of digits d—decimal points |

    | | | MONEY -922,337,203,685,477,580 to 922,337,203,685,477,580 | |

    | | (p, s) NUMERIC (p, s) | DECIMAL (p, s) NUMERIC (p, s) | DECIMAL (n, d) |

    | | | -10^-38 + 1 to 10^38 – 1 | Stored as a string n—maximum of digits |

    | | | p from 1 – 38 | p from 1 – 38 |

    | | | s from -84 to 127 | s from -84 to 127 d—decimal points |'
