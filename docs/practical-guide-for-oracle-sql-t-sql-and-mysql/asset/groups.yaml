    By column(s) in the SELECT clause.


    # GROUP BY with COUNT ( ) Function


    Question: Write a query to count number of employees in every department.


    Answer (Oracle & MySQL):


    ```

    SELECT COUNT(Employee_ID), Dept_ID

    FROM Employees

    GROUP BY Dept_ID

    ORDER BY Dept_ID;

    ```


    Answer (T-SQL):


    ```

    SELECT COUNT (Employee_ID) AS ''Number of Employees'', Dept_ID

    FROM Employees

    GROUP BY Dept_ID

    ORDER BY Dept_ID;

    ```'
