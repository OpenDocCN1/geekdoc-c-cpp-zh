    # # Chapter 5

    # Data Definition Language (DDL)


    We have installed the database systems and development tools in Chapter 3 and
    Chapter 4. Now we are ready to create databases and tables.


    SQL statements are divided into three main groups:


    +   - Data Definition Language (DDL)

    - Data Manipulation Language (DML)

    - Data Control Language (DCL)


    Below is the statement summary for DDL, DML and DCL.


    Table 5.1 DDL, DML and DCL


    | Language | Statements |

    | --- | --- |

    | Data Definition Language (DDL) | CREATE<br>DROP<br>ALTER<br>RENAME<br>TRUNCATE
    | To Create objects in the database<br>To delete objects from the database<br>To
    change database structure<br>To rename a database object<br>To remove all records
    from a table |

    | Data Manipulation Language (DML) | SELECT<br>INSERT INTO<br>UPDATE..., SET<br>DELETE
    FROM | To retrieve data from a database<br>To insert data into a table<br>To update
    data in a table<br>To delete rows from a table |

    | Data Control Language (DCL) | GRANT<br>REVOKE | To grant privileges to a user<br>To
    revoke privileges from a user |


    We cover Data Definition Language (DDL) in this chapter. Data Manipulation Language
    (DML) and Data Control Language (DCL) will be discussed in the next chapter.


    # ## Data Definition Language Statements


    **Creating a Database**


    We can create a database in two ways:


    +   1. Using SQL Command

    2. Using Graphic User Interface (GUI) Tools'
