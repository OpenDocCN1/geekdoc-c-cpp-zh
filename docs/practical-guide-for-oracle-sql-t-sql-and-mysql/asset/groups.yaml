    # Types of Relationships


    - One-to-Many Relationships

    - Many-to-Many Relationships

    - One-to-One Relationships

    - Self-Referencing Relationships


    # One-to-Many Relationships


    One-to-Many Relationships define the situation when one row in table_1 has many
    rows in table_2.


    From the Entity Relationship diagram we can see: the relationship between Departments
    and Employees is a one-to-many relationship. The department_id is the primary
    key in the Departments table and the foreign key in the Employees table. One department_id
    can relate to many rows in the Employees table. One department can have many employees.


    The relationship between Locations and Departments is a one-to-many relationship.
    The location_id is the primary key in the Locations table and the foreign key
    in the Departments table. One location_id can relate to many rows in the Departments
    table. One location can have many departments.


    The relationship between Country and Locations is a one-to-many relationship.
    The country_id is the primary key in the Country table and the foreign key in
    the Locations table. One country_id can relate to many rows in the Locations table.
    One country can have many locations (States or Provinces).


    The relationship between Regions and Country is a one-to-many relationship. The
    region_id is the primary key in the Regions table and the foreign key in the Country
    table. One region_id can relate to many rows in the Country table. One region
    can have many countries.


    # Many-to-Many Relationships


    A record in table_1 has matching records in table_2, and a record in table_2 has
    many matching records in table_1. For example, an employee may work on one or
    more projects, and each project may have one or more employees. In this case,
    MANY employees are related to MANY projects.


    How can we build many-to-many relationship in a database system? Suppose we have
    two tables: Employees and Projects. We can accomplish many-to-many relationships
    by creating two-to-many relationships and adding a link table. For example, we
    can create a table "Emp_Project” that has a composite Primary Key consisting of
    the two primary keys from the Employees and Projects tables.


    # Self-Referencing Relationships


    A database model with a relationship to itself.


    For example, Adam (Employee_ID 101) has a manager (Manager_ID 109). By linking
    the manager ID 109 to Employee_ID 109 we know Adam’s manager is Lex Hann.

