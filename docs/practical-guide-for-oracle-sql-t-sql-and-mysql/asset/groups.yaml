    # To Create a MySQL Stored Procedure with IN and OUT Parameters:


    ```

    DELIMITER //

    CREATE procedure get_Location_Info

    @L_ID FLOAT,

    @L_CITY VARCHAR OUT,

    @L_Country_ID CHAR OUT,

    AS

    ```


    ```

    BEGIN

    SELECT @L_City =City,@L_Country_ID = Country_ID

    FROM LOCATIONS

    WHERE LOCATION_ID = @L_ID;

    END;

    //

    ```'
