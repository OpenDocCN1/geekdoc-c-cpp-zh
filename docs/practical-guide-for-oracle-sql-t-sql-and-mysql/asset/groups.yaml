    # Summary


    Chapter 1 covers the following:


    - Introduction to the brief history of SQL and relational databases.

    - Introduction to SQL standards.

    - The basic terms of relational database management systems.

    - Introduction to Oracle, SQL Server and MySQL versions.

    - Displaying sample entity relationship diagram used in this book.

    - Defining one-to-one relationships.

    - Defining many-to-many relationships.

    - Defining self-referencing relationships.


    # Chapter 2

    Data Types


    You have learned in Chapter 1 that tables are consisted of many columns. When
    you design or modify databases it is very important to understand the different
    data types. There are three main data types: Characters, Numbers, and Date/Time.


    ## Character Data Types


    Table 2.1 Characters data types for the three database systems


    | Data Type | Oracle SQL | SQL SERVER | MySQL |

    |---|---|---|---|

    | Fixed-length Character for any language | CHAR(n)<br>Hold up to 2000 characters
    | CHAR(n)<br>Hold up to 8000 characters | CHAR(n)<br>Hold up to 255 characters
    |

    | NCHAR for any language | NCHAR(n)<br>Hold up to 2000 characters | NCHAR(n)<br>Hold
    up to 4000 characters | NCHAR(n)<br>Hold up to 65535 characters |

    | variable-length character strings | VARCHAR2(n)<br>Hold up to 4000 characters
    | VARCHAR(n)<br>Hold up to 8000 characters<br>VARCHAR(max)<br>Hold up to 3073
    million characters | VARCHAR(n)<br>Hold up to 255 characters |

    | NVARCHAR2(n) for any language | NVARCHAR2(n)<br>Hold up to 4000 characters |
    NVARCHAR(n)<br>Hold up to 4000 characters<br>NVARCHAR(max)<br>Hold up to 536 million
    characters | NVARCHAR(n)<br>Hold up to 65535 characters |

    | NTEXT for any language | LONG<br>Variable width<br>Hold up to 2 GB characters
    | TEXT<br>Hold up to 4000 characters | TINYTEXT<br>Hold up to 255 characters |

    | | | RAW(n)<br>Binary data<br>Hold up to 2000 bytes | BINARY(n)<br>Fixed width
    data<br>Hold up to 8000 bytes | MEDIUMTEXT<br>Hold up to 16 million characters
    |

    | Character Large Object for any language | CLOB<br>NCLOB<br>Hold up to 4G | VARIARYBINARY<br>Variable
    width data<br>Hold up to 8000 bytes | LONGTEXT<br>Hold up to 4G |

    | Binary Large Object | BLOB<br>Hold up to 4G | VARIARY(max)<br>Variable width;
    Hold up to 2 GB | LONGBLOB<br>Hold up to 429496 million characters<br>ENUM(a,
    b, c, ...)<br>List up to 65535 values |

    | | | IMAGE<br>Variable width; Hold up to 2 GB | SET<br>List up to 64 values |


    # 2 Data Types


    What is the difference between fixed-length characters and variable-length characters?


    **Fixed-length characters—** When you create a fixed size, like phone numbers,
    SSN, CHAR is a good choice.


    **Variable-length characters—** Many fields have variable-length characters. When
    you create VARCHAR(30) or VARCHAR(32) for first name, as first name is different
    for each person you need to use VARCHAR or VARCHAR2. If a first name is “Peter”,
    only 5 characters are stored in table (5 bytes). If we use CHAR(30) for a name,
    all the first names will be stored in 30 characters. Obviously, it will waste
    a lot of space.


    # Number Data Types


    Table 2.2 Data types for the three systems


    | Data Type | Oracle SQL | SQL SERVER | MySQL |

    |---|---|---|---|

    | Small Integer | NUMBER (3) | TINYINT | TINYINT -128 to 127 |

    | | 0 to 255 | 0 to 255 | 0 to 255 UNSIGNED |

    | Medium Integer | NUMBER (5) | SMALLINT -32,768 to 32,767 | SMALLINT -32,768
    to 32,767 to 65,535 UNSIGNED |

    | Integer 32 bit | NUMBER (10) | INT -2,147,483,648 to -2,147,483,647 | INT (n)
    -2,147,483,648 to -2,147,483,647 |

    | | NUMBER (38) | BIGINT -9,223,372,036,854,775,880 to 9,223,372,036,854,775,880
    | BIGINT (n) -9,223,372,036,854,775,880 to 9,223,372,036,854,775,880 |

    | | | REAL | FLOAT (n, d) Small floating number n—maximum of digits d—decimal
    points |

    | | | Floating number -3.40E+3 to 3.40E-38 | |

    | | | SMALLMONEY -21,748,368 to 214,748,367 | DOUBLE (n, d) Large floating number
    n—maximum of digits d—decimal points |

    | | | MONEY -922,337,203,685,477,580 to 922,337,203,685,477,580 | |

    | | (p, s) NUMERIC (p, s) | DECIMAL (p, s) NUMERIC (p, s) | DECIMAL (n, d) |

    | | | -10^-38 + 1 to 10^38 – 1 | Stored as a string n—maximum of digits |

    | | | p from 1 – 38 | p from 1 – 38 |

    | | | s from -84 to 127 | s from -84 to 127 d—decimal points |


    # NUMBER (p, s) (Oracle)


    NUMERIC (p, s) (Oracle)

    p--precision

    s--scale


    For example, NUMERIC (5, 2) including 3 digits before the decimal and 2 digits
    after the decimal.


    # DECIMAL (p, s) (T-SQL)


    NUMERIC (p, s) (T-SQL)

    p--the maximum number of digits that can be stored (including all the digits from
    the left and right of decimal point).

    s--the maximum number of digits that can be stored to the right of the decimal
    point.


    # Oracle Number Example


    | Datatype | Input Data | Stored Value |

    | --- | --- | --- |

    | NUMBER | 634,782.59 | 634782.59 |

    | NUMBER (8) | 634,782.59 | 634782.59 |

    | NUMBER (8, 2) | 634,782.59 | 634782.59 |

    | NUMBER (8, 1) | 634,782.59 | 634782.59 |


    # Date and Time Data Types


    Table 2.3 Date and time types for the three systems


    | Oracle SQL | SQL SERVER | MySQL |

    |---|---|---|

    | DATE | DATE | DATE |

    | Format: DD-MON-YY Example: 23-JAN-08 | Format: YYYY-MM-DD Example: 2017-01-25
    | Format: YYYY-MM-DD Example: 2017-01-25 |

    | TIMESTAMP (0) | DATETIME | DATETIME |

    | If we don''t specify a precision then it defaults to six places. | Format: YYYY-MM-DD
    HH:MI:SS | Format: YYYY-MM-DD HH:MI:SS |

    | | TIME | TIME |

    | | Format: HH:MI:SS | Format: HH:MI:SS |

    | | YEAR | YEAR |

    | | Format: YY (70 to 69) | Format: YYYY (1901 to 2155) |


    # Boolean Type


    Table 2.4 Boolean data types for the three systems


    | Data Type | Oracle SQL | SQL SERVER | MySQL |

    |---|---|---|---|

    | Boolean | CHAR(1) | BIT (0 or 1) | BOOLEAN, 0 or 1; NULL |


    # Summary


    Chapter 2 covers several data types for the three systems.


    - Character data types

    - Number data types

    - Date and time types in the three systems

    - Boolean type


    Although this chapter is short but it takes time to get familiar with all those
    data types. When you study Chapter 5 “Creating Databases and Tables” you will
    use data types for columns.


    In the next chapter we will install Oracle 12c, SQL Server 2016 and MySQL 5.7
    database systems.


    # Chapter 3

    Installation of Oracle, SQL Server and MySQL


    Before we run SQL commands we need to install relational database management systems.
