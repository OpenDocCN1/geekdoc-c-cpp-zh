    # Recommended SQL Writing Style


    1. Using upper case letters for SQL keywords.

    For example, which style is easy to read for the following statements:


    ```

    Select c.id, firstname, o.amount,o.order_date

    from customer c

    left join order o

    on c.id = o.customer_id order by by;


    SELECT C.ID, FirstName, O.Amount, O.Order_DATE

    FROM Customer C

    LEFT JOIN Orders O

    ON C.ID = O.Customer_ID Order BY FirstName;

    ```


    2. Using multiple lines for longer statements.

    For example, which style is easy to read for the following statements:


    ```

    Select c.id, firstname, o.amount,o.order_date from customer c left join

    orders o

    on c.id = o.customer_id order by firstname;


    SELECT C.ID, FirstName, O.Amount, O.Order_DATE

    FROM Customer C

    LEFT JOIN Orders O

    ON C.ID = O.Customer_ID Order BY FirstName;

    ```


    3. Using a semicolon to end a statement.

    Oracle requires a semicolon at the end of a statement. Although T-SQL and MySQL
    do not require a semicolon to end a statement, it''s recommended to use semicolons
    at the end of statements.


    4. Using comments.

    Comment on a single line:

    Comment on multiple lines:


    ```

    /* Comments */

    -- Comments

    /*

    * Comments

    * Comments

    */

    ```


