    ## # 6. CASE\n\nDescription: the CASE statement has the functionality of an IF-THEN-ELSE\
    \ statement.\n\nSyntax 1\n\n```\nCASE\nWHEN condition_1 THEN result_1\nWHEN condition_2\
    \ THEN result_2 ...\nWHEN condition_n THEN result_n\nELSE result\nEND\n```\n\n\
    # Syntax 2\n\n```\nCASE expression\nWHEN value_1 THEN result_1\nWHEN value_2 THEN\
    \ result_2 ...\nWHEN value_n THEN result_n\nELSE result\nEND\n```\n\nThe CASE\
    \ statement always in the SELECT clause. CASE must include the following components:\
    \ WHEN, THEN, and END. ELSE is an optional component.\n\nYou can make any conditional\
    \ statement using any conditional operator (like WHERE) between WHEN and THEN.\
    \ This stringing together multiple conditional statements using AND or OR.\n\n\
