    图 10.12 问题 4 的查询输出 (左: Oracle, MySQL)


    答案 (T-SQL):


    ```sql

    SELECT C.ID, FirstName, Amount, Order_DATE

    FROM Customer

    LEFT JOIN Orders O

    ON C.ID = O.Customer_ID

    ```


    | ID | FirstName | AMOUNT | Order_DATE |

    |---|---|---|---|

    | 2 | Alice | 1000 | 2016-05-02 |

    | 3 | Carine | 300 | 2015-12-06 |

    | 2 | Alice | 500 | 2016-01-20 |

    | 5 | Helen | 2000 | 2017-02-05 |

    | 1 | Howard | 600 | 2016-09-10 |

    | 4 | Paolo | NULL | NULL |


    图 10.13 问题 4 的查询输出 (T-SQL)


    第一个表 (LEFT) 是 Customer 表。左连接显示 Customer 表中的所有记录。如果没有匹配（对于没有订单的客户），来自 Order 表的结果为
    NULL。在这种情况下，4 号的 Amount 和 Order_Date 值为 NULL。RIGHT JOIN 和 FULL JOIN 不常用，因此不列出示例。


    # 推荐的 SQL 风格


    1. SQL 关键字使用大写。

    例如，以下语句这种风格更易读：


    ```sql

    SELECT c.id, firstname, amount, order_date

    FROM customer c

    LEFT JOIN order o

    ON c.id = o.customer_id ORDER BY;


    SELECT C.ID, FirstName, Amount, O.Order_DATE

    FROM Customer C

    LEFT JOIN Orders O

    ON C.ID = O.Customer_ID ORDER BY FirstName;

    ```


    2. 长语句使用多行。

    例如，以下语句这种风格更易读：


    ```sql

    SELECT c.id, firstname, amount, order_date

    FROM customer c

    LEFT JOIN orders o

    ON c.id = o.customer_id ORDER BY firstname;


    SELECT C.ID, FirstName, Amount, O.Order_DATE

    FROM Customer C

    LEFT JOIN Orders O

    ON C.ID = O.Customer_ID ORDER BY FirstName;

    ```


    3. 使用分号结束语句。

    Oracle 要求语句结尾有分号。虽然 T-SQL 和 MySQL 不需要分号，但建议在语句结尾使用分号。


    4. 使用注释。

    单行注释：

    多行注释：


    ```sql

    /* 注释 */

    -- 注释

    /*

    * 注释

    * 注释

    */

    ```


    # 总结


    第 10 章涵盖了：


    - 如何使用 Inner Join 连接表。

    - 在 Oracle 中使用 using 子句连接。

    - 如何连接两个以上的表。

    - 如何使用 Left Join 连接表。


    # 练习


    # 10.1


    编写一个查询显示部门中的人数。


    # 10.2


    编写一个查询显示部门名称和城市名称。


    # 10.3


    编写一个查询显示员工名称及其工作的国家。


    # 第 11 章视图


    视图是一个虚拟表。它看起来像表。视图是通过 SQL 语句使用一个或多个表（视图）创建的。视图不存储数据，只占用少量磁盘空间。视图可以包含表的某些字段。数据库管理员为非敏感数据创建视图并为用户设置权限。


    # 语法


    ```sql

    CREATE VIEW view_name AS

    SELECT column(s)

    FROM tables

    [WHERE conditions];

    ```


