    | 如果不指定精度，默认为六位。 | 格式: YYYY-MM-DD HH:MI:SS | 格式: YYYY-MM-DD HH:MI:SS |

    | | TIME | TIME |

    | | 格式: HH:MI:SS | 格式: HH:MI:SS |

    | | YEAR | YEAR |

    | | 格式: YY (70 到 69) | 格式: YYYY (1901 到 2155) |


    # 布尔类型


