    # MIN ( )


    To select the lowest value for a certain column. It returns the minimum value
    for a numeric data column. It returns the earliest date for data column. It returns
    the first records for a character column.


    # SUM ( )


    To select the total for a numeric column.


    # ROUND ( )


    To round a number to a specified decimal places.


