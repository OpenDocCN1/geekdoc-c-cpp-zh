  - "[PAGE 190]\n\n# A Stored Procedure with Parameters\n\nOracle Parameters\n\n+\
    \   - IN (optional)—To pass value(s) to a stored procedure. The values are not\
    \ changed in the procedure. The IN keyword is optional.\n- OUT—To get value(s)\
    \ from a stored procedure. The value(s) can be passed to OUT parameter(s) inside\
    \ the stored procedure. A calling program is needed to get the output value.\n\
    - IN—To pass and get value(s) from a stored procedure.\n\nSQL Server Stored Procedure\
    \ Parameters\n\n+   - IN (optional)\n- OUT | OUTPUT\n\nMySQL Server Stored Procedure\
    \ Parameters\n\n+   - IN (optional)\n- OUT\n- INOUT\n\n# To Create an Oracle Stored\
    \ Procedure with IN and OUT Parameters:\n\n```\nCREATE OR REPLACE procedure get_Location_Info\n\
    \  (L_ID IN NUMBER,\n  L_City OUT VARCHAR2,\n  L_Country_ID OUT CHAR)\nAS\nBEGIN\n\
    \  SELECT City, Country_ID INTO L_City, L_Country_ID FROM LOCATIONS\n  WHERE LOCATION_ID\
    \ = L_ID;\nEND get_Location_Info;\n```\n\n# To Execute an Oracle Procedure with\
    \ IN and OUT Parameters:\n\n```\nDECLARE\n  Location_City LOCATIONS.CITY%TYPE;\n\
    \  Location_Country_ID LOCATIONS.Country_ID%TYPE;\n```"
