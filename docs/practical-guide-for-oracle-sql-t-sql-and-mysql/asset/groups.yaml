    HR schema)


    Example (T-SQL):


    ```

    ALTER VIEW Location_US AS

    SELECT Location_ID, City, Country_ID

    FROM Locations

    WHERE Country_ID = ''US'';

    ```


    | Location_ID | City | Country_ID |

    |---|---|--|

    | 1400 | Southlake | US |

    | 1500 | South San Francisco | US |

    | 1600 | South Brunswick | US |

    | 1700 | Seattle | US |

