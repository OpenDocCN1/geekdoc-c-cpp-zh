    # Chapter 6 Data Manipulation Language (DML)


    We have learned Data Definition Language (DDL) in the last chapter. After creating
    a database and tables the next task is to insert data. Data Manipulation Language
    (DML) is used to retrieve and manipulate data. The main statements for DML are:

    - SELECT

    - INSERT

    - UPDATE

    - DELETE


    How can we select data from a table without data? If there are errors in a table
    we should update a record or delete a record.


    ## INSERT


    Inserts one or more records into a table


    ```sqlINSERT INTO table (col1, col2, ...)

    VALUES (value1, value2, ...);

    ```


    Syntax 1


    Inserting data in the same order as in the table


    ```sqlINSERT INTO table

    VALUES (value1, value2, ...);

    ```


    Note: Although INSERT statements are the same for Oracle, T-SQL and MySQL but
    the date format is different: For example, Oracle date format is DD-MM-YY, T-SQL
    and MySQL date format is YYYY-MM-DD.


