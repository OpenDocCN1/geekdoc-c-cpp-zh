    # 1. UNION, UNION ALL


    Description


    UNION:

    Returns a distinct list of rows from two tables.


    UNION ALL:

    Returns all rows from both tables.


    Syntax


    ```

    SELECT column(s) FROM table1

    UNION

    SELECT column(s) FROM table2

    SELECT column(s) FROM table1

    nUNION ALL

    SELECT column(s) FROM table2

    ```


    Note: Each SELECT statement within the UNION must have the same number of columns.
    The columns must also have similar data types. The columns in each SELECT statement
    must be in the same order.


