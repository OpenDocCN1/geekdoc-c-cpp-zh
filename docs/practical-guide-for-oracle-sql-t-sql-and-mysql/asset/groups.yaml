    \nExport records in Employees table to a csv file. Create a new table or delete\
    \ the records in Employees table. Using the csv file to import data to the table.\n\
    \n# Chapter 13 # Stored Procedures\n\n### What is a Stored Procedure\n\nWhen you\
    \ create a useful query in your place it's very possible that you need to run\
    \ that query again. For example, you may need to run monthly sales report automatically\
    \ at the beginning of a month. Stored procedures can do that job for you. You\
    \ can save the query in a stored procedure and schedule a task to run the job.\
    \ A stored procedure usually has three parts:\n\n- Declaration\n- Execution\n\
    - Exception\n\n### A Simple Stored Procedure\n\nSyntax:\n\n```sql\nCREATE [OR\
    \ REPLACE] PROCEDURE proc_name (parameter1, parameter2 ...)\nIS (Oracle)\nAS (SQL\
    \ Server)\nBEGIN\n-- executable part\nEND;\n```\n\nLet us create a stored procedure\
    \ to count row in the regions table. There is no input parameters and output values.\n\
    \n### Steps to Create an Oracle Stored Procedure\n\n- Enter SQL code in the query\
    \ editor.\n- Run the code to create a stored procedure.\n- Enter proc_name to\
    \ run the stored procedure.\n- To display message you need SET SERVEROUTPUT ON\
    \ and use dbms_output.put_line().\n\n### Comparison for a simple stored procedure\n\
    \n| Oracle PL/SQL | SQL T-SQL | MySQL |\n| :--- | :--- | :--- |\n| SET SERVEROUTPUT\
    \ ON; | | DELIMITER // |\n| CREATE OR REPLACE procedure p1 | AS | CREATE procedure\
    \ p1() |\n| IS | DECLARE @num INT; | BEGIN |\n| num INT; | SET NOCOUNT ON; | FROM\
    \ regions; |\n| BEGIN | FROM num = count(*) | END; |\n| SELECT count(*) INTO num\
    \ | PRINT @num; | CALL p1(); |\n| dbms_output.put_line(num); | END; | |\n| FROM\
    \ regions; | | |\n| END; | | |\n| EXEC p1; | | |\n\n![](img/86805baec19af0039b39fad6b4ce02e0_188_0.png)\n\
    \nFigure 13.1 A simple Oracle procedure\n\n### Steps to create a SQL Server Stored\
    \ Procedure\n\n- Enter SQL code in the query editor.\n- Run the code to create\
    \ a stored procedure.\n- Declare variables under BEGIN keyword.\n- Enter proc_name\
    \ to run the stored procedure.\n- Using SET NOCOUNT ON.\n\n```sql\n@num INT;\n\
    SET NOCOUNT ON;\nSELECT @num = count(*) FROM regions;\nEND;Exec p1;\n```\n\nFigure\
    \ 13.2 a simple SQL Server Stored Procedure\n\n### Steps to Create a MySQL Stored\
    \ Procedure\n\n- Create a delimiter like // or $$ . The delimiter is characters\
    \ that used to complete an SQL statement.\n- Enter SQL code in the query editor.\n\
    - Run the code to create a stored procedure.\n- Enter CALL proc_name() to run\
    \ the stored procedure.\n\n![](img/86805baec19af0039b39fad6b4ce02e0_189_1.png)\n\
    \nFigure 13.3 a simple MySQL procedure\n\n## A Stored Procedure with Parameters\n\
    \n### Oracle Parameters\n\n- IN (optional)—To pass value(s) to a stored procedure.\
    \ The values are not changed in the procedure. The IN keyword is optional.\n-\
    \ OUT—To get value(s) from a stored procedure. The value(s) can be passed to OUT\
    \ parameter(s) inside the stored procedure. A calling program is needed to get\
    \ the output value.\n- IN—To pass and get value(s) from a stored procedure.\n\n\
    ### SQL Server Stored Procedure Parameters\n\n- IN (optional)\n- OUT OUTPUT\n\n\
    ### MySQL Server Stored Procedure Parameters\n\n- IN (optional)\n- OUT\n- INOUT\n\
    \n### To Create an Oracle Stored Procedure with IN and OUT Parameters:\n\n```sql\n\
    CREATE OR REPLACE procedure get_Location_Info\n  (L_ID IN NUMBER,\n  L_City OUT\
    \ VARCHAR2,\n  L_Country_ID OUT CHAR)\nAS\nBEGIN\n  SELECT City, Country_ID INTO\
    \ L_City, L_Country_ID FROM LOCATIONS\n  WHERE LOCATION_ID = L_ID;\nEND get_Location_Info;\n\
    ```\n\n### To Execute an Oracle Procedure with IN and OUT Parameters:\n\n```sql\n\
    DECLARE\n  Location_City LOCATIONS.CITY%TYPE;\n  Location_Country_ID LOCATIONS.Country_ID%TYPE;\n\
    BEGIN\n  get_Location_Info ( 1700, Location_City, Location_Country_ID );\n  DBMS_OUTPUT.PUT_LINE\
    \ ( Location_City || ' ' || Location_Country_ID );\nEND;\n```\n\n![](img/86805baec19af0039b39fad6b4ce02e0_191_0.png)\n\
    \nFigure 13.5 An Oracle procedure out parameters\n\n### To Create an Oracle Stored\
    \ Procedure with IN OUT Parameters:\n\n```sql\ncreate or replace\nprocedure example_INOUT\
    \ ( x IN OUT NUMBER)\nAS\nBEGIN\n x := x + 6;\nEND example_INOUT;\n```\n\n###\
    \ To Execute an Oracle Procedure with IN OUT Parameters:\n\n```sql\nDECLARE\n\
    \  x number;\nBEGIN\n  x:= 10;\n  example_INOUT ( x );\n  DBMS_OUTPUT.PUT_LINE\
    \ ( 'x is ' || x );\nEND;\n```\n\n![](img/86805baec19af0039b39fad6b4ce02e0_192_0.png)\n\
    \nFigure 13.6 Calling Oracle procedure with IN OUT parameters\n\nTo Create a SQL\
    \ Server Stored Procedure with IN Parameters:\n\n```sql\nCREATE procedure getLocation_Info\n\
    (@L_ID FLOAT)\nAS\nBEGIN\nSET NOCOUNT ON;\nSELECT City, Country_ID FROM LOCATIONS\n\
    WHERE LOCATION_ID = @L_ID;\nEND;\n```\n"
