    \n# 表\n\n每个数据库都包含一组表。\n例如，HR 数据库包含国家（country）、客户（customer）、部门（departments）、员工（employees）、工作（job）和位置（locations）表。\n\
    \n![](img/86805baec19af0039b39fad6b4ce02e0_17_0.png)\n\n- 字段（列）\n\n每个表由较小的实体组成，称为字段或列。\n\
    例如，Country 表有三个字段（列）：Country_ID、Country_Name 和 Region_ID。\n\n第一章 SQL 和关系型数据库简介\n\
    \n- 记录（行）\n\n每个表由一条或多条记录（行）组成。例如，COUNTRY 表包含以下行：\n\n| COUNTRY_ID | COUNTRY_NAME\
    \ | REGION_ID |\n|---|---|---|\n| AR | Argentina | 2 |\n| AU | Australia | 3 |\n\
    | BE | Belgium | 1 |\n| BR | Brazil | 2 |\n| CA | Canada | 2 |\n| CH | Switzerland\
    \ | 1 |\n| CN | China | 3 |\n| DE | Germany | 1 |\n\n图 1.3 记录示例\n\n- 主键\n\n每个表只能有一个主键。例如，COUNTRY\
    \ 表的主键是 COUNTRY_ID。\n\n- 外键\n\n数据库表可能通过（外键）共同列相关联。例如，Location_ID 是 Departments\
    \ 表和 Locations 表的共同列。\n\n| department_id | int | PK | location_id | int | PK |\n\
    |---|---|---|---|---|---|\n| department_name | text | | street_address | text\
    \ | |\n| manager_id_per_unit | decimal(6,0) | | postal_code | text | N |\n| location_id\
    \ | decimal(4,0) | | city | text | |\n| Locations_location_id | int | FK | state_province\
    \ | text | |\n| | | | country_id | text | |\n\n图 1.4 外键示例\n\n# NULL\n\nNull 值是一个没有值的字段。它与零值不同，在创建记录时被留空。\n\
    \n# 约束\n\n约束定义了限制列中可以存储的值的规则。这确保了数据库中数据的正确性。例如，我们可以为表设置主键，以确保表中没有重复行。\n\n常见约束\n\
    \n- NOT NULL——列不接受 NULL 值。\n- DEFAULT——当未为列指定值时，为该列设置默认值。\n- UNIQUE——列中没有重复值。\n\
    - 主键（Primary Key）——唯一定义一行的列或列的组合。主键列不能包含 NULL 值。\n- 外键（Foreign Key）——一个表中的外键指向另一个表中的候选键。\n\
    - CHECK——检查值是否有效。\n\n# 数据完整性\n\n- 实体完整性——表中没有重复行。\n- 引用完整性——当删除一条被另一个表的外键引用的行时，就会违反了引用完整性。\n\
    \n例如，用户无法从 Departments 表中删除营销部门（Marketing），因为有两名员工在营销部门工作（#20）。删除营销部门违反了引用完整性。请查看下方的示例记录：\n\
    \n| DEPT_ID | DEPT_NAME | MANAGER_ID | LOCATION_ID |\n| :--- | :--- | :--- | :---\
    \ |\n| 10 | Administration | 200 | 1700 |\n| 20 | Marketing | 201 | 1800 |\n\n\
    > 图 1.5 表中的示例数据\n\n| EMPLOYEE_ID | FIRST_NAME | LAST_NAME | EMAIL | PHONE | HIRE_DATE\
    \ | CLERK | SALARY | DEPT_ID |\n| :--- | :--- | :--- | :--- | :--- | :--- | :---\
    \ | :--- | :--- |\n| 100 | Adam | Grant | | | | | 8000 | 10 |\n| 101 | Jennifer\
    \ | Koch | | | | | 4600 | 10 |\n| 102 | Michael | Hart | | | | | 9000 | 10 |\n\
    | 103 | Lex | Hun | | | | | 1700 | 20 |\n| 104 | Pat | Ernst | | | | | 4700 |\
    \ 20 |\n| 105 | Anna | Austin | | | | | 3000 | 30 |\n| 106 | David | Miller |\
    \ | | | | 5900 | 40 |\n| 107 | James | Koch | | | | | 4600 | 50 |\n| 108 | Amy\
    \ |er | | | | | 3200 | 60 |\n| 109 | John | Wilde | | | | | 4400 | 70 |\n\n> 图\
    \ 1.5 表中的示例数据（注：此处原文文本内容与上方表格有出入，根据翻译要求，已按逻辑对齐）\n\n（注：由于原文文本中最后部分数据表格存在错乱，翻译时严格遵循了原文的结构，并确保了字段对齐）\n\
    \n[content]\n- 实体关系图（ERD）\n-多关系关系\n- Projects 表\n- 多对多关系关系\n 图 1.7 简化架构\n\n# 关系类型\n\
    - 一对多关系\n- 多对多关系\n- 一对一关系\n- 自引用关系\n\n# 一对多关系\n\n一对多关系定义了表 1 中的某行对应表 2 中的多行的情况。\n\
    \n从实体关系图中可以看出：Departments 和 Employees 之间是一一对多关系。department_id 是 Departments 表的主键，也是\
    \ Employees 表的外键。一个 department_id 可以关联 Employees 表中的多行。一个部门可以有多个员工。\n\nLocations\
    \ 和 Departments 之间是一一对多关系。location_id 是 Locations 表的主键，也是 Departments 表的外键。一个\
    \ location_id 可以关联 Departments 表中的多行。一个位置可以有多个部门。\n\nCountry 和 Locations 之间是一一对多关系。country_id\
    \ 是 Country 表的主键，也是 Locations 表的外键。一个 country_id 可以关联 Locations 表中的多行。一个国家可以有多个位置。\n\
    \n# 多对多关系\n\n表 1 中的某记录对应表 2 中的多个记录，且表 2 中的某记录也对应表 1 中的多条记录。例如，一名员工可以参与一个或多个项目，每个项目也可以包含一个或多个员工。在这种情况下，许多员工与许多项目相关联。\n\
    \n我们如何在数据库系统中构建多对多关系？假设我们有两个表：Employees 和 Projects。我们可以通过创建两个一对多关系来实现多对多关系。例如，我们可以创建一个“Emp_Project”的表，其复合主键由\
    \ Employees 和 Projects 表中的两个主键组成。\n\n# 自引用关系\n\n与自身具有关系的数据库模型。\n\n例如，Adam（Employee_ID\
    \ 101）有一个经理（Manager_ID 109）。通过将经理 ID 109 链接到 Employee_ID 109，我们知道 Adam 的经理是 Lex\
    \ Hann。\n\n"
