    |---|---|\n| 1 | Utah |\n| 2 | Maryland |\n\n![](img/86805baec19af0039b39fad6b4ce02e0_147_1.png)\n\
    \n# 总结\n\n第 9 章涵盖了：\n\n- 操作 Union、Union All 命令\n- 使用 INTERSECT（Oracle 和 T-SQL）和\
    \ IN（MySQL）命令\n- 如何使用 Except（T-SQL）、MINUS（Oracle）和 NOT IN（MySQL）命令\n- 理解 ROWNUM（Oracle）、TOP（T-SQL）和\
    \ LIMIT（MySQL）命令\n- 定义子查询\n- 理解 Case 命令\n- 使用 Sequence（Oracle）、Identity（T-SQL）和\
    \ Auto_Increment（MySQL）生成序列号。\n\n# 练习\n\n### 9.1\n\n编写一个查询，将 customers 表中的名称与\
    \ employees 表中的名称合并。\n\n### 9.2\n\n修改 9-1 中的查询，按姓对结果进行排序。\n\n## 第 10 章\n连接 (Joins)\n\
    \n在关系型数据库设计中，Employee（员工）和 Department（部门）是两个实体。员工相关数据保存在 Employees 表，而部门相关数据保存在\
    \ Departments 表中。为了连接，两个表之间创建了 Department_ID。\n\n如果我们想显示员工名称和部门名称，无法仅使用 Employees\
    \ 表或 Departments 表。要在员工名称之后列出部门名称，我们需要使用 SQL JOIN。\n\n有四种基本的 SQL 连接：内连接 (Inner\
    \ Join)、左连接 (Left Join)、右连接 (Right Join) 和全连接 (Full Join)。最有用的连接是内连接 (Inner Join)。\n\
    \n表 10.1 常见连接类型\n\n| (INNER JOIN) | 获取两个表中具有匹配值的记录。 |\n|---|---|\n| LEFT JOIN\
    \ | 获取表1 (LEFT table1) 的所有记录以及表2 (RIGHT table2) 的匹配记录。如果没有匹配，则表2 的结果为 NULL。 |\n\
    | RIGHT JOIN | 获取表2 (RIGHT table1) 的所有记录以及表1 (LEFT table2) 的匹配记录。如果没有匹配，则表1 的结果为\
    \ NULL。 |\n| FULL JOIN | 获取表1 和表2 中的所有行。 |\n\n# 语法\n\n```sql\nSELECT table1.col_name,\
    \ table2.col_name\nFROM table1\n(INNER) JOIN table2 ON table1.col_name = table2.col_name;\n\
    SELECT table1.col_name, table2.col_name\nFROM table1\nLEFT JOIN table2 ON table1.col_name\
    \ = table2.col_name;\nSELECT table1.col_name, table2.col_name\nFROM table1\nRIGHT\
    \ JOIN table2 ON table1.col_name = table2.col_name;\nSELECT table1.col_name, table2.col_name\n\
    FROM table1\nFULL JOIN table2 ON table1.col_name = table2.col_name;\n```\n\n#\
    \ 旧语法\n\n```sql\nSELECT table1.col_name, table2.col_name\nFROM table1, table2\n\
    WHERE table1.col_name = table2.col_name;\n```\n\n# 使用 JOIN 子句 (Oracle)\n\n```sql\n\
    SELECT table1.col_name, table2.col_name\nFROM table1\nJOIN table2 USING (col_name);\n\
