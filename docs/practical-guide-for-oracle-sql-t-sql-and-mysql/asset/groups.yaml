    \ table_name\nLIMIT number;\n\nROWNUM 是 Oracle 数据库中特殊的虚拟列，让很多人遇到了困扰。当你了解它是什么以及如何工作时，它可以非常有用。\n\
    ROWNUM 可用在查询，但它不是表的一部分。ROWNUM 将被分配数字 1, 2, 3, 4, ... N，其中 N 是结果集的行数。ROWNUM 可以作为查询中\
