    | | 0 to 255 | 0 to 255 | 0 to 255 UNSIGNED |

    | 中整数 | NUMBER (5) | SMALLINT -32768 to 32767 | SMALLINT -32768 to 32767 to 65535
    UNSIGNED |

    | 32 位整数 | NUMBER (10) | INT -2147483648 to 2147483647 | INT (n) -2147483648 to
    2147483647 |

    | | NUMBER (38) | BIGINT -9223372036854775808 to 9223372036854775807 | BIGINT
    (n) -9223372036854775808 to 9233775880 |

    | | | REAL | FLOAT (n, d) Small floating number n—最大位数 d—小数 |

    | | | Floating number -3.40E+3 to 3.40E-38 | |

    | | | SMALLMONEY -21748368 to 21748367 | DOUBLE (n, d) Large floating number n—最大位数
    d—小数 |

    | | | MONEY -9223372036854775808 to 922337233677580 | |

    | | (p, s) NUMERIC (p, s) | DECIMAL (p, s) | DECIMAL (n, d) |

    | | | -10^-38 + 1 to 10^38 – 1 | 存储为字符串 n—最大位数 |

    | | | p from 1 – 38 | p from 1 – 38 |

    | | | s from -84 to 127 | s from -84 to 127 d—小数 |


    # NUMBER (p, s) (Oracle)


    NUMERIC (p, s) (Oracle)

    p--精度

    s--标度


    例如，NUMERIC (5, 2) 包括小数点前 3 位和小数点后 2 位。


    # DECIMAL (p, s) (T-SQL)


    NUMERIC (p, s) (T-SQL)

    p--可以存储的最大位数（包括小数点左侧和右侧的所有数字）。

    s--小数点右侧的最大位数。


