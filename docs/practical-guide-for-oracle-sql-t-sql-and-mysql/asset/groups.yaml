    There are many database development tools available: Command line tools and graphic
    user interface tools. Command Line Tools including Oracle SQL Plus and MySQL Command
    Line Client. Graphic User Interface Tools include Oracle SQL Developer, SQL Server
    Management Studio and MySQL Workbench.


