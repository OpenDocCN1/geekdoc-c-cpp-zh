    Figure 3.7 Warning message


    - Choose Installation Location:


    ![](img/86805baec19af0039b39fad6b4ce02e0_31_1.png)

    Figure 3.8 Installation location


    # Chapter 3 Installation of Oracle, SQL Server and MySQL


    - After summary page click “Next” to install Oracle 12c:


    ![](img/86805baec19af0039b39fad6b4ce02e0_32_0.png)

    Figure 3.9 Summary


    - After the installation you can install Oracle SQL Developer. The step by step
    instructions is in the next chapter.


    ## Installation of SQL Server 2016


    The SQL Server 2016 Installation is straightforward. Every installation creates
    one SQL Server instance on your computer.


    - Go to SQL Server 2016 Developer Edition download page:

    https://www.microsoft.com/en-us/sql-server/application-development

    - Download SQL Server 2016 Developer (x64).


    ![](img/86805baec19af0039b39fad6b4ce02e0_32_1.png)

    Figure 3.10 SQL Server 2016 downloads


    # Chapter 3 Installation of Oracle, SQL Server and MySQL


    - Click setup.exe to run the installation file.


    | Planning | Hardware and Software Requirements |

    | --- | --- |

    | Installation | View the hardware and software requirements. |

    | Maintenance | Security Documentation |

    | Tools | View the security documentation. |

    | Resources | Online Release Notes View the latest information about the release.
    |

    | Advanced | System Configuration Checker |

    | Options | Launch a tool to check for conditions that prevent a successful SQL
    Server installation. |


    ![](img/86805baec19af0039b39fad6b4ce02e0_33_0.png)


    - Select Developer edition.


    ![](img/86805baec19af0039b39fad6b4ce02e0_33_1.png)

    ![](img/86805baec19af0039b39fad6b4ce02e0_33_2.png)


    - Accept the license terms.


    ![](img/86805baec19af0039b39fad6b4ce02e0_34_0.png)


    - Select Features:


    ![](img/86805baec19af0039b39fad6b4ce02e0_34_1.png)


    - SQL Server issues a default instance name: SQL 2016. Any previously installed
    instances will be displayed here.


    ![](img/86805baec19af0039b39fad6b4ce02e0_35_0.png)

    Figure 3.15 Default instance name


    Click “Add Current User” to set up an administrator:


    ![](img/86805baec19af0039b39fad6b4ce02e0_36_0.png)

    Figure 3.16 Setting up an administrator


    - Click Next button then click Install button.


    ![](img/86805baec19af0039b39fad6b4ce02e0_37_0.png)


    - Installation is completed.


    ![](img/86805baec19af0039b39fad6b4ce02e0_38_0.png)


    - After the installation you can install SQL Server Management Studio. The step
    by step instructions are in the next chapter.


    ## Installation of MySQL


    - Go to MySQL installer page: https://dev.mysql.com/downloads/

    Note: MySQL Installer is 32 bit, but will install both 32 bit and 64 bit binaries.


    - MySQL Documentation and Change History

    Please report any bugs or inconsistencies you observe to our Database. Thank you
    for your support!


    ![](img/86805baec19af0039b39fad6b4ce02e0_39_0.png)

    Figure 3.19 MySQL downloads


    - Choose MySQL Enterprise Edition or Standard Edition.


    ![](img/86805baec19af0039b39fad6b4ce02e0_39_1.png)

    Figure 3.20 Choosing edition to download


    - Select MySQL Standard Edition for Windows x64 (64-bit).

    If more than one release is available, you may select an alternate release by
    clicking on ''Select Alternate Release...''.


    ![](img/86805baec19af0039b39fad6b4ce02e0_40_0.png)


    - Accept the license terms.


    ![](img/86805baec19af0039b39fad6b4ce02e0_40_1.png)


    - If you do not use Oracle select ''No''.

    - can select MySQL documentation and samples:


    ![](img/86805baec19af0039b39fad6b4ce02e0_41_0.png)


    - Installation is ready to go.


    ![](img/86805baec19af0039b39fad6b4ce02e0_42_0.png)

    Figure 3.25 Installation is ready.


    - Keep default Server Settings:


    ![](img/86805baec19af0039b39fad6b4ce02e0_42_1.png)

    Figure 3.26 Default server configuration


