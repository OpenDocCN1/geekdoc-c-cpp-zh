    ## Chapter 1


    # Introduction to SQL and Relational Databases


    Relational database management systems (RDBMS) have become the standard database
    type for various industries since the 1980s. These systems allow the users to
    store data and access data in graphic user interfaces. It also allows users to
    set security rules.


    Structured Query Language (SQL) is a standard computer language for relational
    database management systems. SQL has different dialects. For example, Oracle SQL
    is called PL/SQL, MS SQL Server is called T-SQL (Transact-SQL).


    SQL is a very useful tool for database developers and database administrators.
    Database developers use SQL to select, insert, and update data. Database administrators
    (DBAs) apply their SQL skills to support Oracle, SQL Server, MySQL and other database
    systems.


    The highlights of this chapter include:


    - Brief History of SQL and Database Systems

    - SQL Standards

    - Oracle, SQL Server and MySQL Versions

    - Introduction to RDBMSs

    - Relational Database Basic Concepts

    - Entity Relational Diagram Used in This Book


    ## Brief History of SQL and Database Systems


    ### 1.1 History of SQL and Database Development


    | Year | SQL and Database Development |

    | :--- | :--- |

    | 1970-1972 | E.F. Codd introduced the Relational Model in his paper. |

    | 1976 | Ingres and System R at IBM used the relational model. |

    | 1980s | Peter Chen developed the entity-relationship model. |

    | 1990s | Successful database tools such as Oracle, Microsoft were released. |

    | 2000s | MySQL became open source for database development. |


    ### 1.2 SQL Standards


    | Year | SQL Standards |

    | :--- | :--- |

    | 1974 | SQL became a standard by ANSI (American National Standards Institute)
    |

    | 1986 | Major modification (ISO 95) |

    | 1999 | Added recursive queries, procedural control, some object-oriented structures.
    |

    | 2003 | Introduced XML-related features.

    | 2006 | Defined ways for importing data. |


    ### 1.3 Oracle, SQL Server and MySQL Versions


    | Year | Oracle | SQL Server | MySQL |

    | :--- | :--- | :--- | :--- |

    | 1970-1975 | | | |

    | 1980-1985 | | | |

    | 1990-1995 | | | |

    | 1996-2000 | | | |

    | 2001-2005 | | | |

    | 2006-2010 | | | |

    | 2011-2015 | | | |

    | 2016-present | | | |


    ## Introduction to RDBMS


    Relational Database Management System consists of one or more databases. For example,
    the following SQL Server has HR and Sample databases.


    ![](img/86805baec19af0039b39fad6b4ce02e0_15_0.png)


    Figure 1.1 Database examples


    ## Relational Database Basic Concepts


    **Entity**: Entity is any person, place, or thing that the data can represent
    in a database design. For example, Employees and Departments are entities. Entities
    are converted to tables at the physical design stage.


    **Data Type**: SQL developers need to choose a data type for each column when
    creating a table. The common data types are boolean, integer, float, currency,
    string, date and time.


    **DDL**: DDL stands for Data Definition Language. DDL commands can be used to
    create, modify database structures. Sample DDL commands are CREATE, ALTER and
    DROP.


    **DML**: DML stands for Data Manipulation Language. DML commands can be used to
    insert data into database tables, retrieve or modify data, deleting data in database.
    Sample DML commands are INSERT, DELETE and UPDATE.


    **DCL**: DCL stands for Data Control Language. DCL commands can be used to create
    rights and permissions. Sample DCL commands are GRANT and REVOKE.


    **Query**: SQL developers can use a query to get data or information from one
    or more database tables.


    ## Attributes


    Entity has its own attributes. For example, an Employee entity may have name,
    phone and salary as attributes.


    ### Types of Attributes


    - Simple attribute: An attribute that cannot be divided into subparts. For example,
    an employee''s age is a simple attribute.

    - Composite attribute: An attribute that can be divided into simple attributes.
    For example, an employee''s name is First_Name and Last_Name.

    - Derived attribute: An attribute whose value can be derived (calculated) from
    other attribute. For example, Average_Age for employees can be calculated.

