- md: "\nAn intersect operator to returns rows that are common between two tables;\
    \ it returns unique rows that exist in both the first and second query. This operation\
    \ is useful when you want to find results that are common between two queries.\
    \ INTERSECT has an equivalent MySQL statement IN, which can also be used in Oracle\
    \ and T-SQL.\n\nQuestion 3: Write a query to find cities that exist in both Customer\
    \ and Locations tables.\n\nAnswers (Oracle & T-SQL):\n\n```\nSELECT City\nFROM\
    \ Customer\nINTERSECT\nSELECT City\nFROM Locations;\n```\n\nAnswer (MySQL):\n\n\
    ```\nSELECT distinct City\nFROM customer\nWHERE (city) IN\n(SELECT City)\nFROM\
    \ Locations)\n```\n\n| Oracle SQL | T-SQL | MySQL |\n| --- | --- | --- |\n| CITY\
    \ | City | City |\n| Seattle | Seattle | Seattle |\n| Southlake | Southlake |\
    \ Southlake |\n\nFigure 9.5 Query output for question 3\n\n## # 3. MINUS (Oracle),\
    \ EXCEPT (T-SQL), NOT IN (MySQL)\n\nDescription: Returns all rows in the first\
    \ SELECT statement but excludes those by the second SELECT statement.\n\nSyntax\n\
    \n```\nSELECT col1, col2, ...\nFROM table1\nMINUS or EXCEPT\nSELECT col1, col2,\
    \ ...\nFROM table2\n```\n\nLike INTERSECTION, EXCEPT (MINUS) has an equivalent\
    \ MySQL statement NOT IN, which can also be used in Oracle and T-SQL.\n\nQuestion\
    \ 4: Write a query to find cities that exist in Locations table but not in Customer\
    \ table.\n\nAnswers: See Table 9.1.\n\n| Oracle SQL | T-SQL | MySQL |\n| --- |\
    \ --- | --- |\n| SELECT City | SELECT City | SELECT distinct City |\n| FROM Locations\
    \ | FROM Locations | FROM Locations |\n| MINUS | EXCEPT | WHERE (city) |\n| SELECT\
    \ City | SELECT City | NOT IN (SELECT City) |\n| FROM Customer; | FROM Customer;\
    \ | FROM Customer |\n\n| CITY | City | City |\n| --- | --- | --- |\n| Beijing\
    \ | Beijing | Beijing |\n| Hiroshima | Hiroshima | Hiroshima |\n| London | London\
    \ | London |\n| South Brunswick | South Brunswick | South Brunswick |\n| South\
    \ San Francisco | South San Francisco | South San Francisco |\n| Sydney | Sydney\
    \ | Sydney |\n| Toronto | Toronto | Toronto |\n| Whitehorse | Whitehorse | Whitehorse\
    \ |\n\nFigure 9.6 Query output for question 4\n\n## # 4. ROWNUM (Oracle), TOP\
    \ (T-SQL) and LIMIT (MySQL)\n\nDescription: Specifies the number of records to\
    \ return\n\nOracle Style SELECT column_name(s)\n\nFROM table_name\nWHERE ROWNUM\
    \ <= number;\n\nT-SQL Style SELECT TOP number | percent column_name(s)\n\nFROM\
    \ table_name;\n\nMySQL Style SELECT column_name(s)\n\nFROM table_name\nLIMIT number;\n\
    \nROWNUM is a special virtual column in an Oracle Database that gets many people\
    \ into trouble. When you learn what it is and how it works, it can be very useful.\n\
    ROWNUM is available in a query, but is not part of the table. ROWNUM will be assigned\
    \ the numbers 1, 2, 3, 4, ... N, where N is the number of rows record set. ROWNUM\
    \ can be used as part of the where clause of the query to return specific rows.\
    \ ROWNUM value is not assigned permanently to a row (this is a common misconception).\
    \ Queries that < (less than) or > (greater than) on ROWNUM will not always work;\
    \ you must use <= (less than or equal to) or >= (greater than or equal to).\n\n\
    For example,\n\n```\nSELECT ROWNUM, firstname\nFROM customer;\n```\n\n![](img/86805baec19af0039b39fad6b4ce02e0_139_0.png)\n\
    \nQuestions 5: Display the first ten rows from the Country table.\n\nAnswers (Oracle):\n\
    \n```\nSELECT *\nFROM Country\nWHERE ROWNUM <= 10;\n```\n\n| COUNTRY_ID | COUNTRY_NAME\
    \ | REGION_ID |\n|---|---|--|\n| AR | Argentina | 2 |\n| AU | Australia | 3 |\n\
