    # 2 数据类型


    固定长度字符和变长度字符之间的区别是什么？


    **固定长度字符——** 当你创建一个固定大小的字段时（例如电话号码、社会安全号 SSN），CHAR 是一个很好的选择。


    **变长度字符——** 许多字段具有变长度的字符。当你为姓名创建 `VARCHAR(30)` 或 `VARCHAR(32)` 时，如果姓名是“Peter”，你需要使用
    `VARCHAR` 或 `VARCHAR2`。如果我们使用 `CHAR(30)` 来存储姓名，所有的姓名都将占用 30 个字符。显然，这会浪费空间。


