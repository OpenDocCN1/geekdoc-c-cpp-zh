    ![](img/86805baec19af0039b39fad6b4ce02e_50_0.png)


    Figure 4.8 Starting Oracle SQL Developer


    Oracle has many build-in schemas. Here we use Oracle build-in HR schema to make
    a connection:


    Enter password then click OK button.


    SQL Developer opens panes on the left and SQL worksheet on the right.


    ![](img/86805baec19af0039b39fad6b4ce02e_51_0.png)


    Enter "DESCRIBE Employees;" on the Worksheet then click the Run Statements button
    (the green triangle). You can see that we get the same result as the SQL Plus
    command line.


    ![](img/86805baec19af0039b39fad6b4ce02e_52_0.png)


    # Installation of SQL Server Management Studio


    - From SQL Server 2016 the server and the management studio are installed separately.

    - Go to SQL Server 2016 Management Studio download page:


    https://docs.microsoft.com/en-us/sql/ssms/download-sql-server-management-studio-ssms


