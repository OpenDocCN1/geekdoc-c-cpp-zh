    # 第 2 章

    数据类型


    你在第一章中已经学习了表是由许多列组成的。当你在设计或修改数据库时，理解不同的数据类型是非常重要的。主要有三种数据类型：字符、数字和日期/时间。


    ## 字符数据类型


    表 2.1 三种数据库系统的字符数据类型


    | 数据类型 | Oracle SQL | SQL SERVER | MySQL |

    |---|---|---|---|

    | 任意语言固定长度字符 | CHAR(n)<br>支持最多 2000 个字符 | CHAR(n)<br>支持最多 8000 个字符 | CHAR(n)<br>支持最多
    255 个字符 |

    | 任意语言的 NCHAR | NCHAR(n)<br>支持最多 2000 个字符 | NCHAR(n)<br>支持最多 4000 个字符 | NCHAR(n)<br>支持最多
    65535 个字符 |

    | 变长度字符字符串 | VARCHAR2(n)<br>支持最多 4000 个字符 | VARCHAR(n)<br>支持最多 8000 个字符<br>VARCHAR(max)<br>支持最多
    3073 万个字符 | VARCHAR(n)<br>支持最多 255 个字符 |

    | 任意语言的 NVARCHAR2(n) | NVARCHAR2(n)<br>支持最多 4000 个字符 | NVARCHAR(n)<br>支持最多 4000
    个字符<br>NVARCHAR(max)<br>支持最多 536 万个字符 | NVARCHAR(n)<br>支持最多 65535 个字符 |

    | 任意语言的 NTEXT | LONG<br>变宽<br>支持最多 2 GB 字符 | TEXT<br>支持最多 4000 个字符 | TINYTEXT<br>支持最多
    255 个字符 |

    | | | RAW(n)<br>二进制数据<br>支持最多 2000 字节 | BINARY(n)<br>固定宽度数据<br>支持最多 8000 字节 |
    MEDIUMTEXT<br>支持最多 1600 万个字符 |

    | 任意语言的字符大对象 | CLOB<br>NCLOB<br>支持最多 4G | VARIARYBINARY<br>变宽数据<br>支持最多 8000 字节
    | LONGTEXT<br>支持最多 4G |

