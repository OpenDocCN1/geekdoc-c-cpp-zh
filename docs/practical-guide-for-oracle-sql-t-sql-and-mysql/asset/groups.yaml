    Chapter 1 Introduction to SQL and Relational Databases


    +   - Entity

    Entity is any person, place, or thing that the data can represent in a database
    design. For example, Employees and Departments are entities. Entities are converted
    to tables at the physical design stage.


    +   - Data Type

    SQL developers need to choose a data type for each column when creating a table.
    The common data types are boolean, integer, float, currency, string, date and
    time.


    +   - DDL

    DDL stands for Data Definition Language. DDL commands can be used to create, modify
    database structures. Sample DDL commands are CREATE, ALTER and DROP.


    +   - DML

    DML stands for Data Manipulation Language. DML commands can be used to insert
    data into database tables, retrieve or modify data, deleting data in database.
    Sample DML commands are INSERT, DELETE and UPDATE.


    +   - DCL

    DCL stands for Data Control Language. DCL commands can be used to create rights
    and permissions. Sample DCL commands are GRANT and REVOKE.


    +   - Query

    SQL developers can use a query to get data or information from one or more database
    tables.


    # Attributes


    Entity has its own attributes. For example, an Employee entity may have name,
    phone and salary as attributes.


    Types of Attributes


    Simple attribute—An attribute that cannot be divided into subparts. For example,
    an employee''s age is a simple attribute.


    Composite attribute—An attribute that can be divided into simple attributes. For
    example, an employee''s name is First_Name and Last_Name.


    Derived attribute—An attribute whose value can be derived (calculated) from other
    attribute. For example, Average_Age for employees can be calculated.'
- md: '

    Single-value attribute—An attribute contains a single value. For example, City
    or State.

    Multi-value attribute—An attribute has more than one value. For example, an employee
    can have more than one skill.


    # Tables


    Each database contains a collection of tables.

    For example, the HR database has country, customer, departments, employees, job
    and locations tables.


    ![](img/86805baec19af0039b39fad6b4ce02e0_17_0.png)


    - Fields (Columns)


    Each table consists of smaller entities called fields or columns.

    For example, the Country table has three fields (columns): Country_ID, Country_Name
    and Region_ID.


    Chapter 1 Introduction to SQL and Relational Databases


    - Records (Rows)


    Each table consists of one or more records (rows). For example, the COUNTRY table
    has the following rows:


    | COUNTRY_ID | COUNTRY_NAME | REGION_ID |

    |---|---|---|

    | AR | Argentina | 2 |

    | AU | Australia | 3 |

    | BE | Belgium | 1 |

    | BR | Brazil | 2 |

    | CA | Canada | 2 |

    | CH | Switzerland | 1 |

    | CN | China | 3 |

    | DE | Germany | 1 |


    Figure 1.3 Record examples


    - Primary Key


    Each table can have only one primary key. For example, the COUNTRY table has a
    primary key COUNTRY_ID.


    - Foreign Key


    Database tables might be related by (foreign key) common column(s). For example,
    Location_ID is the common column for Departments and Locations tables.


    | department_id | int | PK | location_id | int | PK |

    |---|---|---|---|---|---|

    | department_name | text | | street_address | text | |

    | manager_id_per_unit | decimal(6,0) | | postal_code | text | N |

    | location_id | decimal(4,0) | | city | text | |

    | Locations_location_id | int | FK | state_province | text | |

    | | | | country_id | text | |


    Figure 1.4 Foreign key example


    # NULL


    Null value is a field with no value. It is different from a zero value and it
    has been left blank during record creation.


    # Constraints


    Constraints define rules to restrict what values can be stored in columns. This
    ensures the correctness of the data in the database. For example, we can set a
    primary key for a table so that there are no duplicate rows in the table.


    Common Constraints


    - NOT NULL—A column does not accept NULL values.

    - DEFAULT—Set a default value to a column when no value is specified to a column.

    - UNIQUE—No duplicated values in a column.

    - Primary Key—A column or a combination of columns that uniquely defines a row.
    The primary key column cannot contain a NULL value.

    - Foreign Key—A foreign key in one table to a candidate key in another table.

    - CHECK—Check whether the value is valid or not.


    # Data Integrity


    - Entity Integrity—No duplicate rows in a table.

    - Referential Integrity—Referential integrity is violated when deleting a row
    that is referenced by a foreign key in another table.


    For example, a user can''t delete the Marketing department from the Departments
    table, as there are two employees working for the Marketing department (#20).
    Deleting the Marketing department violates the referential integrity. See the
    sample records below:


