    server. If you want to add users you can click "Add User" button.


    ![](img/86805baec19af0039b39fad6b4ce02e0_43_0.png)

    Figure 3.27 Entering account password


    - Enter the password and click “Check” button to see if it is working.


    ![](img/86805baec19af0039b39fad6b4ce02e0_44_0.png)

    Figure 3.28 Testing the password


    - After the installation you can install MySQL Workbench. The step by step instructions
    are in the next chapter.


    # Summary


    Chapter 3 covers the following:


    - Minimum System Requirements

    - How to install Oracle 12c

    - How to install SQL Server 2016

    - How to install MySQL 5.7


    In the next chapter you are going to install development tools for the three database
    systems.


