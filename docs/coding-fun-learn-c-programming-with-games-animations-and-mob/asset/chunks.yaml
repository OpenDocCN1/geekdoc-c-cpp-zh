    \ certain conditions. The most commonly used conditional statement is the `if`\
    \ statement. It allows you to execute a block of code only if a specified condition\
    \ is true. Here's an example:\n\n```csharp\nint age = 15;\n\nif (age >= 18)\n\
    {\n    Console.WriteLine(\"You are eligible to vote!\");\n}\n```\n\nIn the above\
    \ example, the code inside the curly braces will only be executed if the condition\
    \ `age >= 18` is true. If the condition is false, the code block will be skipped.\n\
    \nYou can also use the `else` statement to specify an alternative block of code\
    \ to be executed if the condition is false:\n\n```csharp\nint age = 15;\n\nif\
    \ (age >= 18)\n{\n    Console.WriteLine(\"You are eligible to vote!\");\n}\nelse\n\
    {\n    Console.WriteLine(\"You are not eligible to vote yet.\");\n}\n```\n\nIn\
    \ this case, if the condition `age >= 18` is false, the code inside the `else`\
    \ block will be executed.\n\nAnother useful conditional statement is the `switch`\
    \ statement, which allows you to select one of many code blocks to be executed\
    \ based on the value of a variable:\n\n```csharp\nint dayOfWeek = 3;\n\nswitch\
    \ (dayOfWeek)\n{\n    case 1:\n        Console.WriteLine(\"Monday\");\n      \
    \  break;\n    case 2:\n        Console.WriteLine(\"Tuesday\");\n        break;\n\
    \    case 3:\n        Console.WriteLine(\"Wednesday\");\n        break;\n    //\
    \ ...\n    default:\n        Console.WriteLine(\"Invalid day\");\n        break;\n\
    }\n```\n\nIn this example, the code block corresponding to the value of `dayOfWeek`\
    \ will be executed. If none of the cases match the value, the code inside the\
    \ `default` block will be executed.\n\n## 2.3.2 Loops\n\nLoops are used to repeat\
    \ a block of code multiple times. They are particularly useful when you want to\
