    \ messages to the console. You can also use the `Debug.WriteLine()` method, which\
    \ is similar but is only executed when the program is running in debug mode. This\
    \ allows you to add debugging statements without affecting the performance of\
    \ your release build.\n\n## 10.2.3 Using Exception Handling\n\nException handling\
    \ is a technique used to catch and handle errors that occur during the execution\
