    Another useful feature of the debugger is the ability to set conditional breakpoints.
    These breakpoints will only pause the execution if a specific condition is met.
    This can be helpful when you want to investigate a particular scenario or when
    you want to skip over certain parts of your code during debugging.


    ### 10.2.2 Printing Debugging Statements


    Another effective technique for debugging is to use print statements or logging
    to output information about the state of your program at different points. By
    strategically placing print statements in your code, you can track the values
    of variables, check if certain conditions are being met, or simply confirm that
    a specific block of code is being executed.


    For example, if you suspect that a variable is not being assigned the correct
    value, you can add a print statement to display its value. This can help you identify
    if the issue lies in the assignment or if it is occurring elsewhere in your code.


    In C#, you can use the Console.WriteLine() method to print messages to the console.
    You can also use the Debug.WriteLine() method, which is similar but is only executed
    when the program is running in debug mode. This allows you to add debugging statements
    without affecting the performance of your release build.


    ### 10.2.3 Using Exception Handling


    Exception handling is a technique used to catch and handle errors that occur during
    the execution of a program. By using try-catch blocks, you can anticipate and
    handle specific types of exceptions, preventing your program from crashing and
    providing a more graceful way to handle errors.


    When an exception is thrown, the program will jump to the catch block that matches
    the type of exception. Within the catch block, you can include code to handle
    the exception, such as displaying an error message or logging the exception details
    for further analysis.


    By strategically placing try-catch blocks in your code, you can catch and handle
    exceptions that may occur during runtime. This can help you identify and resolve
    issues that may otherwise go unnoticed.


