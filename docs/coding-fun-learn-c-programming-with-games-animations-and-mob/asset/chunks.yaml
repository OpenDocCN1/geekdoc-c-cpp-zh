  trans: "\n条件语句用于根据某些条件对程序做出决策。最常用的条件语句是 `if` 语句。它允许你仅在指定条件为真时执行一段代码。这里有一个示例：\n\n\
    ```csharp\nint age = 15;\n\nif (age >= 18)\n{\n    Console.WriteLine(\"You are\
    \ eligible to vote!\");\n}\n```\n\n在上面的示例中，只有当条件 `age >= 18` 为真时，大括号内的代码才会被执行。如果条件为假，将跳过该代码块。\n\
    \n你还可以使用 `else` 语句来指定当条件为假时要执行的另一段备用代码块：\n\n```csharp\nint age = 15;\n\nif (age\
    \ >= 18)\n{\n    Console.WriteLine(\"You are eligible to vote!\");\n}\nelse\n\
    {\n    Console.WriteLine(\"You are not eligible to vote yet.\");\n}\n```\n\n在这种情况下，如果条件\
    \ `age >= 18` 为假，将执行 `else` 块中的代码。\n\n另一个有用的条件语句是 `switch` 语句，它允许你根据变量的值从许多代码块中选择一个进行执行：\n\
    \n```csharp\nint dayOfWeek = 3;\n\nswitch (dayOfWeek)\n{\n    case 1:\n      \
    \  Console.WriteLine(\"Monday\");\n        break;\n    case 2:\n        Console.WriteLine(\"\
    Tuesday\");\n        break;\n    case 3:\n        Console.WriteLine(\"Wednesday\"\
    );\n        break;\n    // ...\n    default:\n        Console.WriteLine(\"Invalid\
    \ day\");\n        break;\n}\n```\n\n在这个示例中，将执行与 `dayOfWeek` 值对应的代码块。如果没有任何 `case`\
    \ 匹配该值，将执行 `default` 块中的代码。\n\n## 2.3.2 循环\n\n循环用于多次重复执行某段代码。当你想要执行特定次数的任务，或者直到满足特定条件时，循环特别有用。\n\
    \n当你确切知道想要执行的迭代次数时，通常使用 `for` 循环：\n\n```csharp\nfor (int i = 0; i < 5; i++)\n\
    {\n    Console.WriteLine(\"Iteration: \" + i);\n}\n```\n\n在这个示例中，循环将迭代五次，从 `i\
    \ = 0` 开始，并在每次迭代后将 `i` 加 1。\n\n当你希望在某个条件为真时重复执行某段代码时，使用 `while` 循环：\n\n```csharp\n\
    int count = 0;\n\nwhile (count < 5)\n{\n    Console.WriteLine(\"Count: \" + count);\n\
    \    count++;\n}\n```\n\n在这种情况下，只要条件 `count < 5` 为真，循环就会继续执行。一旦条件变为假，循环将终止。\n\n\
    `do-while` 循环与 `while` 循环类似，但它保证即使在初始条件为假，代码块也会至少执行一次：\n\n```csharp\nint num =\
    \ 5;\n\ndo\n{\n    Console.WriteLine(\"Number: \" + num);\n    num--;\n} while\
    \ (num > 0);\n```\n\n在这个示例中，代码块将执行一次，打印“Number: 5”，然后将检查条件 `num > 0`。如果条件为真，循环将继续执行。\n\
    \n## 2.3.3 分支语句\n\n分支语句允许你改变程序的正常控制流。它们可以提前退出循环、跳过循环迭代中的剩余代码，或者跳转到程序中的特定点。\n\n\
    `break` 语句通常用于提前退出循环：\n\n```csharp\nfor (int i = 0; i < 10; i++)\n{\n    if (i\
    \ == 5)\n    {\n        break;\n    }\n    Console.WriteLine(\"Iteration: \" +\
    \ i);\n}\n```\n\n在这个示例中，当 `i` 变为 5 时，循环终止，并执行循环之后的代码。\n\n`continue` 语句用于跳过循环迭代中的剩余代码，并进入下一次迭代：\n\
    \n```csharp\nfor (int i = 0; i < 10; i++)\n{\n    if (i % 2 == 0)\n    {\n   \
    \     continue;\n    }\n    Console.WriteLine(\"Odd number: \" + i);\n}\n```\n\
    \n在这种情况下，当 `i` 为偶数时，`continue` 语句之后的代码将被跳过，循环将进入下一次迭代。\n\n`return` 语句用于退出方法或函数并返回一个值：\n\
    \n```csharp\nint Multiply(int a, int b)\n{\n    return a * b;\n}\n```\n\n在这个示例中，当调用\
    \ `Multiply` 方法时，它将返回 `a` 和 `b` 的乘积并退出方法。\n\n## 结论\n\n控制流是编程中的一个基本概念，允许你创建更动态、更交互的程序。通过使用条件语句、循环和分支语句，你可以让程序做出决策、重复操作并改变正常的控制流。理解并掌握控制流将极大地增强你使用\
    \ C# 创建更复杂、趣的项目的能力。\n\n## 2.4 函数和方法\n\n在之前的章节中，我们学习了 C# 中的变量、数据类型、运算符和控制流。这些是任何程序的构建块。但随着程序变得越来越复杂，我们需要一种方式来组织代码并使其具有复用性。这就是函数和方法大显身场。\n\
    \n### 2.4.1 什么是函数？\n\n函数是执行特定任务的代码块。它接收输入，对输入进行操作，并产生输出。函数允许我们将代码分解为更小、更容易的部分。这使得我们的代码更容易阅读、理解和维护。\n\
    \n在 C# 中，我们使用 `void` 关键字、函数名及其参数来定义函数。\n\n```csharp\nvoid GreetUser(string name)\n\
    {\n    Console.WriteLine(\"Hello, \" + name);\n}\n```\n\n在这个示例中，我们调用 `GreetUser`\
    \ 函数：\n\n```csharp\nGreetUser(\"John\");\n```\n\n### 2.4.2 返回值\n\n在之前的示例中，我们的\
    \ `GreetUser` 函数没有返回任何值。它只是在控制台上打印问候消息。但有时，我们需要函数产生可以使用的结果。这就是返回值的作用。\n\n要为函数指定返回值，我们需要将\
    \ `void` 关键字替换为我们想要返回的值的数据类型。\n\n```csharp\nstring GreetUser(string name)\n{\n\
    \    return \"Hello, \" + name + \"!\";\n}\n```\n\n现在，当我们调用 `GreetUser` 函数时，可以将返回值存储在变量中使用：\n\
    \n```csharp\nstring greeting = GreetUser(\"John\");\nConsole.WriteLine(greeting);\n\
    ```\n\n### 2.4.3 方法重载\n\n在 C# 中，我们可以定义多个同相同但参数不同的函数。这被称为方法重载。它允许我们创建执行相似任务但输入不同的函数。\n\
    \n假设我们要修改 `GreetUser` 函数，使其还能接收一个可选的时间段参数。我们可以创建一个同时接受名称和时间段的新版本：\n\n```csharp\n\
    string GreetUser(string name)\n{\n    return \"Hello, \" + name + \"!\";\n}\n\n\
    string GreetUser(string name, string timeOfDay)\n{\n    return \"Good \" + timeOfDay\
    \ + \", \" + name + \"!\";\n}\n```\n"
