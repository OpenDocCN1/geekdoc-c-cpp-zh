    Console.WriteLine($"File size: {fileInfo.Length} bytes");


    Console.WriteLine($"Last modified: {fileInfo.LastWriteTime}");


    These examples demonstrate some of the common file operations available in C#.
    By leveraging these operations, you can create applications that interact with
