    if (age >= 18)


    {


    Console.WriteLine("You are eligible to vote!");


    }


    In the above example, the code inside the curly braces will only be executed if
    the condition age >= 18 is true. If the condition is false, the code block will
    be skipped.


    You can also use the else statement to specify an alternative block of code to
    be executed if the condition is false:


    int age = 15;


    if (age >= 18)


    {


    Console.WriteLine("You are eligible to vote!");


    }


    else


    {


    Console.WriteLine("You are not eligible to vote yet.");


    }


    In this case, if the condition age >= 18 is false, the code inside the else block
    will be executed.


    Another useful conditional statement is the switch statement, which allows you
    to select one of many code blocks to be executed based on the value of a variable:


    int dayOfWeek = 3;


    switch (dayOfWeek)


    {


    case 1:


    Console.WriteLine("Monday");


    break;


    case 2:


    Console.WriteLine("Tuesday");


    break;


    case 3:


    Console.WriteLine("Wednesday");


    break;


    // ...


    default:


    Console.WriteLine("Invalid day");


    break;


    }


    In this example, the code block corresponding to the value of dayOfWeek will be
    executed. If none of the cases match the value, the code inside the default block
    will be executed.


    ### 2.3.2 Loops


    Loops are used to repeat a block of code multiple times. They are particularly
    useful when you want to perform a task a certain number of times or until a specific
    condition is met.


    The for loop is commonly used when you know the exact number of iterations you
    want to perform:


    for (int i = 0; i < 5; i++)


    {


    Console.WriteLine("Iteration: " + i);


    }


    In this example, the loop will iterate five times, starting from i = 0 and incrementing
    i by 1 after each iteration.


    The while loop is used when you want to repeat a block of code as long as a certain
    condition is true:


    int count = 0;


    while (count < 5)


    {


    Console.WriteLine("Count: " + count);


    count++;


    }


    In this case, the loop will continue to execute as long as the condition count
    < 5 is true. Once the condition becomes false, the loop will terminate.


    The do-while loop is similar to the while loop, but it guarantees that the code
    block is executed at least once, even if the condition is initially false:


    int num = 5;


    do


    {


    Console.WriteLine("Number: " + num);


    num—;


    } while (num > 0);


    In this example, the code block will be executed once, printing "Number: 5", and
    then the condition num > 0 will be checked. If the condition is true, the loop
    will continue to execute.


    ### 2.3.3 Branching Statements


    Branching statements allow you to alter the normal flow of control in a program.
    They can be used to exit a loop prematurely, skip the rest of the code in a loop
    iteration, or jump to a specific point in the program.


    The break statement is commonly used to exit a loop prematurely:


    for (int i = 0; i < 10; i++)


    {


    if (i == 5)


    {


    break;


    }


    Console.WriteLine("Iteration: " + i);


    }


    In this example, the loop will terminate when i becomes 5, and the code after
    the loop will be executed.


    The continue statement is used to skip the rest of the code in a loop iteration
    and move on to the next iteration:


    for (int i = 0; i < 10; i++)


    {


    if (i % 2 == 0)


    {


    continue;


    }


    Console.WriteLine("Odd number: " + i);


    }


    In this case, when i is an even number, the code after the continue statement
    will be skipped, and the loop will move on to the next iteration.


    The return statement is used to exit a method or function and return a value:


    int Multiply(int a, int b)


    {


    return a * b;


    }


    In this example, when the Multiply method is called, it will return the product
    of a and b and exit the method.


    ### Conclusion


    Control flow is a fundamental concept in programming that allows you to create
    more dynamic and interactive programs. By using conditional statements, loops,
    and branching statements, you can make decisions, repeat actions, and alter the
    normal flow of control in your programs. Understanding and mastering control flow
    will greatly enhance your ability to create more complex and interesting projects
    using C#.


    ## 2.4 Functions and Methods


    In the previous sections, we learned about variables, data types, operators, and
    control flow in C#. These are the building blocks of any program. But as our programs
    become more complex, we need a way to organize our code and make it more reusable.
    This is where functions and methods come into play.


    ### 2.4.1 What are Functions?


    A function is a block of code that performs a specific task. It takes in some
    input, performs operations on that input, and produces an output. Functions allow
    us to break down our code into smaller, more manageable pieces. This makes our
    code easier to read, understand, and maintain.


    In C#, we define a function using the void keyword followed by the function name
    and a pair of parentheses. Inside the parentheses, we can specify any parameters
    that the function needs. Parameters are variables that hold values passed to the
    function when it is called. Let''s take a look at an example:


    void GreetUser(string name)


    {


    Console.WriteLine("Hello, " + name + "!");


    }


    In this example, we have defined a function called GreetUser that takes in a parameter
    called name of type string. Inside the function, we use the Console.WriteLine
    method to print a greeting message to the console, using the value of the name
    parameter.


    To call a function, we simply write its name followed by a pair of parentheses.
    If the function has parameters, we pass the values for those parameters inside
    the parentheses. Let''s call our GreetUser function:


    GreetUser("John");


    When we run this code, it will print "Hello, John!" to the console. We can call
    the GreetUser function with different names to greet different users.


    ### 2.4.2 Return Values


    In the previous example, our GreetUser function didn''t return any value. It simply
    printed a greeting message to the console. But sometimes, we need our functions
    to produce a result that we can use in our program. This is where return values
    come in.


    To specify a return value for a function, we need to replace the void keyword
    with the data type of the value we want to return. Let''s modify our GreetUser
    function to return a greeting message instead of printing it:


    string GreetUser(string name)


    {


    return "Hello, " + name + "!";


    }


    In this modified version of the function, we have changed the return type to string
    and added the return keyword followed by the greeting message. Now, when we call
    the GreetUser function, we can store the returned value in a variable and use
    it in our program:


    string greeting = GreetUser("John");


    Console.WriteLine(greeting);


    When we run this code, it will print "Hello, John!" to the console, just like
    before. But this time, we have stored the greeting message in the greeting variable,
    allowing us to use it later in our program if needed.


    ### 2.4.3 Method Overloading


    In C#, we can define multiple functions with the same name but different parameters.
    This is called method overloading. It allows us to create functions that perform
    similar tasks but with different input.


    Let''s say we want to modify our GreetUser function to also take an optional parameter
    for the time of day. We can create a new version of the function that accepts
    both the name and the time of day:


    string GreetUser(string name)


    {


    return "Hello, " + name + "!";


    }


    string GreetUser(string name, string timeOfDay)


    {


    return "Good " + timeOfDay + ", " + name + "!";


    }


    In this example, we have created two versions of the GreetUser function. The first
    version takes only the name parameter and returns a simple greeting. The second
    version takes both the name and timeOfDay parameters and returns a greeting based
    on the time of day.'
