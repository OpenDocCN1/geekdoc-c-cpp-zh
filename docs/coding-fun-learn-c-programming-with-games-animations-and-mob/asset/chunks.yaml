    ## 2.1 Variables and Data Types


    In programming, variables are used to store and manipulate data. They act as containers
    that hold different types of information, such as numbers, text, or true/false
    values. Understanding variables and data types is essential in any programming
    language, including C#. In this section, we will explore the basics of variables
    and the different data types available in C#.


    ### 2.1.1 What are Variables?


    Variables are like labeled boxes that hold values. They have a name, a type, and
    a value. The name of a variable is used to refer to it and access its value. The
    type of a variable determines the kind of data it can store, such as numbers,
    characters, or boolean values. The value of a variable can be changed during the
    execution of a program.


    In C#, variables are declared using a specific syntax. You start by specifying
    the type of the variable, followed by its name. For example, to declare a variable
    of type integer named "score", you would write:


    int score;


    This line of code tells the computer to allocate memory for a variable named "score"
    that can store integer values.


    ### 2.1.2 Data Types in C#


    C# provides several built-in data types that can be used to declare variables.
    Each data type has a specific range of values and operations that can be performed
    on it. Here are some commonly used data types in C#:


    *   int: Used to store whole numbers (positive or negative) without decimal places.
    For example, int age = 20;.


    *   float: Used to store floating-point numbers with decimal places. For example,
    float pi = 3.14f;.


    *   double: Similar to float, but can store larger decimal numbers with more precision.
    For example, double distance = 123.456;.


    *   char: Used to store single characters. For example, char grade = ''A'';.


    *   string: Used to store sequences of characters (text). For example, string
    name = "John";.


    *   bool: Used to store boolean values (true or false). For example, bool isGameOver
    = false;.


    These are just a few examples of the data types available in C#. Each data type
    has its own purpose and usage. It''s important to choose the appropriate data
    type based on the kind of data you want to store.


    ### 2.1.3 Assigning Values to Variables


    Once a variable is declared, you can assign a value to it using the assignment
    operator (=). The value assigned must be of the same data type as the variable.
    For example:


    int score = 100;


    float pi = 3.14f;


    char grade = ''A'';


    string name = "John";


    bool isGameOver = false;


    In the above code, we declare variables of different data types and assign them
    initial values. The value assigned can be a literal value (like 100 or ''A'')
    or the result of an expression.


    ### 2.1.4 Using Variables in Expressions


    Variables are not only used to store values but also to perform operations and
    calculations. You can use variables in expressions to manipulate data and produce
    new results. For example:


    int x = 5;


    int y = 10;


    int sum = x + y;'
