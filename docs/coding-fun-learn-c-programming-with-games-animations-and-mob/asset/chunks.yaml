    Inheritance and polymorphism are powerful concepts in object-oriented programming.
    Inheritance allows us to create a hierarchical structure of classes, promoting
    code reusability and organization. Polymorphism enables objects to take on multiple
    forms, allowing us to write more flexible and generic code. By understanding and
    utilizing these concepts, you can create more efficient and maintainable code
    in your C# projects.


    ## 6.3 Exception Handling


    Exception handling is an essential concept in programming that allows us to handle
    and manage errors or exceptional situations that may occur during the execution
    of a program. These exceptional situations, also known as exceptions, can range
    from simple errors like dividing a number by zero to more complex issues like
    accessing a file that doesn''t exist.


    In C#, exception handling is done using try-catch blocks. The try block contains
    the code that may potentially throw an exception, and the catch block is responsible
    for handling the exception if it occurs. Let''s take a closer look at how exception
    handling works and how it can be implemented in C#.


    ### 6.3.1 Understanding Exceptions


    An exception is an object that represents an error or an exceptional situation
    that occurs during the execution of a program. When an exception occurs, it disrupts
    the normal flow of the program and transfers the control to a specific block of
    code called the exception handler.


    Exceptions can be categorized into two types: checked exceptions and unchecked
    exceptions. Checked exceptions are the ones that the compiler forces you to handle
    explicitly, while unchecked exceptions are not required to be handled explicitly.


    Some common exceptions in C# include DivideByZeroException, FileNotFoundException,
    NullReferenceException, and FormatException. Each exception has its own specific
    meaning and can be caught and handled differently.


    ### 6.3.2 The try-catch Block


    The try-catch block is used to handle exceptions in C#. The try block contains
    the code that may throw an exception, and the catch block is responsible for catching
    and handling the exception if it occurs. The general syntax of a try-catch block
    is as follows:


    try


    {


    // Code that may throw an exception


    }


    catch (ExceptionType exception)


    {


    // Code to handle the exception


    }


    In the above syntax, ExceptionType represents the type of exception that you want
    to catch and handle. You can catch specific exceptions by specifying their types,
    or you can catch a more general Exception type to handle any type of exception.


    ### 6.3.3 Handling Exceptions


    When an exception occurs within the try block, the control is transferred to the
    catch block. The catch block contains the code that handles the exception. It
    can perform various actions like displaying an error message, logging the exception,
    or taking corrective measures to recover from the exception.


    Here''s an example that demonstrates how to handle a DivideByZeroException:


    try


    {


    int numerator = 10;


    int denominator = 0;


    int result = numerator / denominator;


    }


    catch (DivideByZeroException exception)


    {


    Console.WriteLine("Error: Cannot divide by zero.");


    }


    In the above example, if the denominator is zero, a DivideByZeroException will
    be thrown. The catch block catches the exception and displays an error message.


    ### 6.3.4 The finally Block


    In addition to the try and catch blocks, C# also provides a finally block that
    can be used to execute code regardless of whether an exception occurs or not.
    The finally block is optional and is used to perform cleanup tasks like closing
    files, releasing resources, or restoring the program''s state.


    Here''s an example that demonstrates the usage of the finally block:


    try


    {


    // Code that may throw an exception


    }


    catch (ExceptionType exception)


    {


    // Code to handle the exception


    }


    finally


    {


    // Code that will always execute


    }


    In the above example, the code in the finally block will always execute, regardless
    of whether an exception occurs or not.


    ### 6.3.5 Throwing Exceptions


    In addition to handling exceptions, you can also manually throw exceptions in
    your code using the throw keyword. This can be useful when you want to indicate
    an exceptional situation or error in your program.


    Here''s an example that demonstrates how to throw a custom exception:


    try


    {


    int age = -10;


    if (age < 0)


    {


    throw new ArgumentException("Age cannot be negative.");


    }


    }


    catch (ArgumentException exception)


    {


    Console.WriteLine(exception.Message);


    }


    In the above example, if the age is negative, a custom ArgumentException is thrown,
    and the catch block catches and displays the exception message.


    ### 6.3.6 Exception Handling Best Practices


    When working with exception handling, it''s important to follow some best practices
    to ensure that your code is robust and maintainable:


    1.  Catch specific exceptions: Catching specific exceptions allows you to handle
    different exceptions differently and provide more meaningful error messages to
    the user.


    2.  Use multiple catch blocks: If you need to handle different types of exceptions
    differently, you can use multiple catch blocks to catch and handle each exception
    separately.


    3.  Log exceptions: Logging exceptions can help in debugging and troubleshooting
    issues in your code. It provides valuable information about the exception, such
    as the stack trace, which can be used to identify the cause of the exception.


    4.  Handle exceptions gracefully: When handling exceptions, it''s important to
    provide meaningful error messages to the user and take appropriate actions to
    recover from the exception if possible.


    By following these best practices, you can ensure that your code is more robust
    and can handle exceptional situations effectively.


    Exception handling is a crucial aspect of programming, as it allows you to handle
    errors and exceptional situations gracefully. By understanding how exceptions
    work and how to handle them using try-catch blocks, you can write more reliable
    and robust code. Remember to follow best practices and handle exceptions appropriately
    to create better user experiences and maintainable code.


