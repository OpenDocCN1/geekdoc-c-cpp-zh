    ### 6.4.3 Writing to Files


    Writing to files allows us to store data generated by our program for future use
    or to share it with other applications. In C#, we can write to files using the
    StreamWriter class.


    To write to a file, we first need to open it using the StreamWriter class. We
    provide the path to the file as a parameter to the StreamWriter constructor. Once
    the file is open, we can use the WriteLine() method to write a line of text to
    the file. This method appends a newline character after the text.


    Here''s an example that demonstrates writing to a file:


    using System;


    using System.IO;


    class Program


    {


    static void Main()


    {


    string filePath = "output.txt";


    using (StreamWriter writer = new StreamWriter(filePath))


    {


    writer.WriteLine("Hello, world!");


    writer.WriteLine("This is a sample line.");


    }


    }


    }


    In this example, we open the file "output.txt" using the StreamWriter class. We
    then use the WriteLine() method to write two lines of text to the file. The StreamWriter
    class automatically creates the file if it doesn''t exist.


    ### 6.4.4 File Input/Output Operations


    Apart from reading and writing to files, C# also provides various other file-related
    operations. We can check if a file exists, copy or move files, delete files, and
    retrieve information about files using the File class.


    Here are some examples of file-related operations:


    *   Checking if a file exists:


    string filePath = "data.txt";


    bool fileExists = File.Exists(filePath);


    *   Copying a file:


    string sourceFilePath = "source.txt";


    string destinationFilePath = "destination.txt";


    File.Copy(sourceFilePath, destinationFilePath);


    *   Moving a file:


    string sourceFilePath = "source.txt";


    string destinationFilePath = "destination.txt";


