    int num = 5;\n\ndo\n{\n    Console.WriteLine(\"Number: \" + num);\n    num--;\n\
    } while (num > 0);\n```\n\nIn this example, the code block will be executed once,\
    \ printing \"Number: 5\", and then the condition `num > 0` will be checked. If\
    \ the condition is true, the loop will continue to execute.\n\n## 2.3.3 Branching\
    \ Statements\n\nBranching statements allow you to alter the normal flow of control\
    \ in a program. They can be used to exit a loop prematurely, skip the rest of\
    \ the code in a loop iteration, or jump to a specific point in the program.\n\n\
    The `break` statement is commonly used to exit a loop prematurely:\n\n```csharp\n\
