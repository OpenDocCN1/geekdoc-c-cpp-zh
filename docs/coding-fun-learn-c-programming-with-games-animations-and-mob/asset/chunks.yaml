  raw: 'Inheritance is a powerful feature of OOP that allows us to create new classes
    based on existing classes. It enables code reuse and promotes the concept of hierarchical
    relationships between classes. In C#, we can create a new class (called a derived
    class or subclass) that inherits the properties and methods of an existing class
    (called a base class or superclass).


    The derived class can add new features or override existing ones from the base
    class. This allows us to create specialized versions of a class while still maintaining
    the common functionality defined in the base class. Inheritance helps in achieving
    code reusability and promotes a more organized and structured codebase.


    Polymorphism is closely related to inheritance and allows objects of different
    classes to be treated as objects of a common base class. It enables us to write
    code that can work with objects of different types, as long as they share a common
    interface or base class. This flexibility allows for more dynamic and flexible
    code.


    ### 6.1.4 Benefits of Object-Oriented Programming


    Object-Oriented Programming offers several benefits that make it a popular choice
    for software development:


    1.  Modularity: OOP promotes modular code by encapsulating data and behavior within
    classes. This makes it easier to understand, maintain, and modify code.


    2.  Code Reusability: With inheritance and polymorphism, we can reuse existing
    code and build upon it, saving time and effort in development.


    3.  Flexibility: OOP allows for more flexible and dynamic code by enabling polymorphism
    and abstraction. This makes it easier to adapt and extend our code as requirements
    change.


    4.  Scalability: OOP provides a scalable approach to software development. By
    organizing code into classes and objects, we can easily add new features or modify
    existing ones without affecting the entire codebase.


    5.  Collaboration: OOP promotes collaboration among developers by providing a
    common framework and structure for building software. It allows multiple developers
    to work on different parts of a project simultaneously.


    ### 6.1.5 Implementing Object-Oriented Programming in C#


    In C#, we can implement OOP concepts using classes, objects, inheritance, and
    other language features. By defining classes and creating objects from them, we
    can model real-world entities and implement their behavior.


    To create a class in C#, we use the class keyword followed by the class name.
    We can then define variables, properties, and methods within the class. To create
    an object from a class, we use the new keyword followed by the class name and
    any required parameters.


    Inheritance in C# is achieved using the : symbol. We specify the base class after
    the : symbol when defining a derived class. We can then add new members or override
    existing ones in the derived class.


    Polymorphism in C# is achieved through method overriding and method overloading.
    Method overriding allows us to provide a different implementation of a method
    in the derived class, while method overloading allows us to define multiple methods
    with the same name but different parameters.


    By understanding and applying these concepts, we can write more organized, modular,
    and reusable code in C#. Object-Oriented Programming is a fundamental concept
    in modern software development, and mastering it will greatly enhance your programming
    skills.


    In the next section, we will explore another important concept in C# programming:
    Exception Handling.


    ## 6.2 Inheritance and Polymorphism


    Inheritance and polymorphism are two important concepts in object-oriented programming
    (OOP). They allow us to create more flexible and reusable code by organizing classes
    in a hierarchical structure and enabling objects to take on multiple forms.


    ### 6.2.1 Understanding Inheritance


    Inheritance is a mechanism in which one class inherits the properties and behaviors
    of another class. The class that is being inherited from is called the base class
    or superclass, and the class that inherits from it is called the derived class
    or subclass.


    The derived class can access all the public and protected members of the base
    class, including fields, properties, and methods. This allows us to reuse code
    and build upon existing functionality. Inheritance promotes code reusability and
    helps in creating a more organized and modular codebase.


    To illustrate this concept, let''s consider an example of a game development scenario.
    Suppose we have a base class called GameObject that represents any object in the
    game world. It may have properties like position and rotation, as well as methods
    like Move() and Rotate(). Now, we can create derived classes like Player and Enemy
    that inherit from the GameObject class. These derived classes can have additional
    properties and methods specific to players and enemies, while still having access
    to the common functionality provided by the GameObject class.


    ### 6.2.2 Implementing Inheritance in C#


    In C#, inheritance is implemented using the : symbol followed by the name of the
    base class. Let''s see an example:


    class GameObject


    {


    public Vector2 position;


    public float rotation;


    public void Move(Vector2 direction)


    {


    // Code to move the object


    }


    public void Rotate(float angle)


    {


    // Code to rotate the object


    }


    }


    class Player : GameObject


    {


    public int health;


    public void Attack()


    {


    // Code to perform an attack


    }


    }


    In the above example, the Player class inherits from the GameObject class. It
    has an additional property health and a method Attack(). The Player class can
    access the position, rotation, Move(), and Rotate() methods from the GameObject
    class.


    ### 6.2.3 Overriding Methods


    In addition to inheriting properties and methods, derived classes can also override
    the implementation of methods inherited from the base class. This allows us to
    provide a different implementation of a method in the derived class, tailored
    to its specific needs.


    To override a method, we use the override keyword in the derived class. Let''s
    modify our previous example to include an overridden method:


    class GameObject


    {


    // ...


    public virtual void Update()


    {


    // Code to update the object


    }


    }


    class Player : GameObject


    {


    // ...


    public override void Update()


    {


    // Code to update the player object


    }


    }


    In the above example, the GameObject class has a virtual method Update(), which
    can be overridden by derived classes. The Player class overrides the Update()
    method to provide its own implementation. When calling the Update() method on
    a Player object, the overridden method in the Player class will be executed instead
    of the base class method.


    ### 6.2.4 Polymorphism


    Polymorphism is the ability of an object to take on many forms. In the context
    of inheritance, it means that a variable of a base class type can refer to an
    object of any derived class. This allows us to write code that can work with objects
    of different types, as long as they are derived from the same base class.


    Let''s consider an example to understand polymorphism better. Suppose we have
    a method called PrintInfo() that takes an object of the GameObject class as a
    parameter and prints information about it:


    void PrintInfo(GameObject obj)


    {


    Console.WriteLine($"Position: {obj.position}");


    Console.WriteLine($"Rotation: {obj.rotation}");


    }


    Now, we can pass objects of both the GameObject class and its derived classes,
    such as Player and Enemy, to the PrintInfo() method. The method will be able to
    access the common properties of the base class and the additional properties of
    the derived classes.


    GameObject gameObj = new GameObject();


    Player player = new Player();


    PrintInfo(gameObj);  // Prints information about the game object


    PrintInfo(player);  // Prints information about the player object


    In the above example, the PrintInfo() method can handle objects of different types
    because of polymorphism. This flexibility allows us to write more generic code
    that can work with a variety of objects.'
