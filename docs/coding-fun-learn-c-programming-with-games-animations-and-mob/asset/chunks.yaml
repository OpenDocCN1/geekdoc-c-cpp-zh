    ## 6.1 对象面向编程


    对象面向编程 (OOP) 是一种编程范式，允许我们以更加模块化和可重用的方式组织和结构代码。它是一个强大的概念，广泛应用于包括 C# 在内的现代编程语言中。在本节中，我们将探索
    OOP 的基础以及它如何在 C# 中应用。


    ### 6.1.1 理解对象和类


    OOP 的核心是对象的概念。对象是一个自包含的实体，同时封装了数据和行为。它代表真实世界中的一个实体或程序中的一个概念。例如，如果我们正在开发一个游戏，我们可能会有像玩家、敌人和道具包这样的对象。


    在 C# 中，对象是从类创建的。类是一个蓝图或模板，定义了对象的结构和行为。它指定了对象可以包含的数据（以变量或属性的形式）以及它可以执行的操作（以方法的形式）。


    让我们通过一个简单的示例来更好地理解这一点。假设我们正在创建一个游戏并想要表示一个玩家。我们可以定义一个名为 `Player` 的类，它具有 `name`、`score`
    和 `health` 等变量，以及 `Move()` 和 `Attack()` 方法。一旦定义了这个类，我们就可以创建多个 `Player` 类的实例，每个实例代表游戏中的一个玩家。


    ### 6.1.2 封装和抽象


    OOP 的核心原则之一是封装。封装是指将数据和方法封装在类中，隐藏内部细节并为与其交互提供整洁的接口。它有助于实现数据安全代码的可维护性。


    在 C# 中，通过使用 `public`、`private`、`protected` 等访问修饰符来实现封装。这些修饰符控制类内部变量和方法的范围。通过将某些变量或方法设为
    `private`，我们可以限制类外部对它们的访问，确保它们只能通过公共方法访问。


    抽象是 OOP 中的另一个重要概念。它允许我们隐藏类的复杂实现细节，并为使用它提供简化的接口。通过抽象内部复杂性，我们可以使我们的代码更加模块化且易于理解。


    ### 6.1.3 继承和多态


