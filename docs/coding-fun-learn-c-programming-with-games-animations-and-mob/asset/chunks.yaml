    ## 2.2 Operators and Expressions


    In programming, operators are symbols or keywords that perform specific operations
    on one or more operands. An operand is a value or variable that the operator acts
    upon. Expressions, on the other hand, are combinations of operators, operands,
    and variables that produce a result.


    ### Arithmetic Operators


    Arithmetic operators are used to perform basic mathematical operations such as
    addition, subtraction, multiplication, and division. These operators include:


    - Addition (`+`): Adds two operands together.

    - Subtraction (`-`): Subtracts the second operand from the first.

    - Multiplication (`*`): Multiplies two operands together.

    - Division (`/`): Divides the first operand by the second.

    - Modulus (`%`): Returns the remainder of the division between two operands.


    For example, consider the following expression:


    ```csharp

    int a = 10;

    int b = 5;

    int result = a + b;

    ```


    In this case, the addition operator (`+`) is used to add the values of `a` and
    `b`, resulting in `15`. The result is then stored in the variable `result`.


    ### Assignment Operators


    Assignment operators are used to assign values to variables. The most common assignment
    operator is the equals sign (`=`), which assigns the value on the right-hand side
    to the variable on the left-hand side.


    ```csharp

    int x = 10;

    ```


    In this example, the value `10` is assigned to the variable `x` using the assignment
    operator (`=`).


    Other assignment operators include:


    - Addition assignment (`+=`): Adds the value on the right-hand side to the variable
    on the left-hand side and assigns the result to the variable.

    - Subtraction assignment (`-=`): Subtracts the value on the right-hand side from
    the variable on the left-hand side and assigns the result to the variable.

    - Multiplication assignment (`*=`): Multiplies the variable on the left-hand side
    by the value on the right-hand side and assigns the result to the variable.

    - Division assignment (`/`): Divides the variable on the left-hand side by the
    value on the right-hand side and assigns the result to the variable.

    - Modulus assignment (`%=`): Calculates the modulus of the variable on the left-hand
    side with the value on the right-hand side and assigns the result to the variable.


    ### Comparison Operators


    Comparison operators are used to compare two values and return a boolean result
    (true or false). These operators include:


    - Equal to (`==`): Checks if two values are equal.

    - Not equal to (`!=`): Checks if two values are not equal.

    - Greater than (`>`): Checks if the value on the left-hand side is greater than
    the value on the right-hand side.

    - Less than (`<`): Checks if the value on the left-hand side is less than the
    value on the right-hand side.

    - Greater than or equal to (`>=`): Checks if the value on the left-hand side is
    greater than or equal to the value on the right-hand side.

    - Less than or equal to (`<=`): Checks if the value on the left-hand side is less
    than or equal to the value on the right-hand side.


    These operators are commonly used in conditional statements and loops to control
    the flow of a program based on certain conditions.


    ### Logical Operators


    Logical operators are used to combine multiple conditions and evaluate the result.
    These operators include:


    - AND (`&&`): Returns true if both conditions on the left-hand side and right-hand
    side are true.

    - OR (`||`): Returns true if either the condition on the left-hand side or the
    right-hand side is true.

    - NOT (`!`): Reverses the result of a condition. If the condition is true, the
    NOT operator returns false, and vice versa.


    Logical operators are often used in conditional statements to check multiple conditions
    simultaneously.


    ### Bitwise Operators


    Bitwise operators are used to perform operations on individual bits of binary
    numbers. These operators include:


    - AND (`&`): Performs a bitwise AND operation on two binary numbers.

    - OR (`|`): Performs a bitwise OR operation on two binary numbers.

    - XOR (`^`): Performs a bitwise XOR (exclusive OR) operation on two binary numbers.

    - NOT (`~`): Performs a bitwise NOT operation on a binary number, flipping all
    its bits.

    - Left shift (`<<`): Shifts the bits of a binary number to the left by a specified
    number of positions.

    - Right shift (`>>`): Shifts the bits of a binary number to the right by a specified
    number of positions.


    Bitwise operators are commonly used in low-level programming and for manipulating
    individual bits in binary data.


    ### Precedence and Associativity


    Operators have different levels of precedence, which determines the order in which
    they are evaluated in an expression. For example, multiplication and division
    have a higher precedence than addition and subtraction. parentheses can be used
    to override the default precedence and force certain operations to be evaluated
    first.


    Operators also have associativity, which determines the order in which they are
    evaluated when they have the same precedence. For example, addition and subtraction
    have left associativity, which means they are evaluated from left to right.


    Understanding the precedence and associativity of operators is important to ensure
    that expressions are evaluated correctly.


    In conclusion, operators and expressions are fundamental concepts in programming.
    They allow you to perform mathematical calculations, assign values to variables,
    compare values, combine conditions, and manipulate binary data. By mastering these
    concepts, you will have a solid foundation for writing more complex programs and
    creating exciting projects like games, animations, and mobile apps.


