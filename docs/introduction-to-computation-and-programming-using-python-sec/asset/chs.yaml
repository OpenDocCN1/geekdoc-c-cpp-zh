  [2, 0] probs = [ 5.22466887e-03 1.69995686e-08 9.93218655e-01 1.55665885e-03]\n\
  [2, 2] probs = [ 7.88542473e-07 1.97601741e-03 7.99527347e-03 9.90027921e-01]\n\
  ```\n（注：上述输出已根据二分类语境进行了调整）\n\n`applyModel` 的实现首先使用列表推导式（第 5.3.2 节）构建一个元素为 `testSet`\
  \ 中示例特征向量的列表。然后它调用 `model.predict_proba` 获取与每个特征向量对应的预测对。最后，它将预测结果与该特征向量的标签进行比较，并跟踪和返回真阳性、假阳性、真阴性和假阴性的数量。\n\
  \n图 24.15 中的代码使用 `LogisticRegression` 类为我们的马拉松数据构建并测试模型。`applyModel` 函数接收四个参数：\n\
  \n- `model`: 一个已经拟合的 `LogisticRegression` 对象\n- `testSet`: 示例序列。这些示例具有构建拟合时使用的相同类型的特征和标签。\n\
  - `label`: 正类别的标签。`applyModel` 返回的混淆矩阵相对于此标签。\n- `prob`: 用于判断为 `testSet` 中的示例分配标签的概率阈值。默认值为\
  \ `0.5`。由于它不是常数，可以使用 `applyModel` 来研究假阳性和假阴性之间的权衡。\n\n![art](img/Art_P302.jpg)\n\
  \n**图 24.15 使用逻辑回归预测性别**\n\n当运行代码时，它输出了：\n\n```\nFeature weights for label M: age\
  \ = 0.055, time = -0.011\nAccuracy = 0.635\nSensitivity = 0.831\nSpecificity = 0.377\n\
  Pos. Pred. Val. = 0.638\n```\n\n\n\n\n准确率和正性预测值相似，但逻辑回归具有更高的灵敏度和低得多的特异性。这使得这两种方法很难进行比较。我们可以通过调整\
  \ `applyModel` 使用的概率阈值来解决这个问题，使其灵敏度与 `KNN` 相同。我们可以通过迭代 `prob` 的值，直到得到的灵敏度接近使用 `KNN`\
  \ 的结果，找到该概率。\n\n如果我们用 `prob = 0.578` 而不是 `0.5` 来调用 `applyModel`，我们将得到如下结果：\n\n准确率\
  \ = 0.659\n\n灵敏度 = 0.714\n\n特异性 = 0.586\n\n正性预测值 = 0.695\n\n也就是说，这些模型的性能相似。\n\n\
  由于探索线性回归模型改变决策阈值的影响很容易，人们经常使用所谓的`受试者工作特征曲线`，^(³⁵⁰) 或 `ROC 曲线` 来视觉化灵敏度与特异性之间的权衡。该曲线绘制了多个决策阈值下的真正性率（灵敏度）相对于假阳性率（`1\
  \ – 特异性`）的关系。\n\nROC 曲线通常通过计算曲线下的面积（`AUROC`）来相互比较。该面积等于模型为随机选择的正样本分配的正性概率大于其为随机选择的负样本分配的正性概率的概率。这被称为模型的`判别能力`。需要注意的是，判别能力并没有说明关于准确性（通常称为概率的`校准性`）的任何信息。例如，可以将所有估计概率除以\
  \ `2` 而不改变判别能力——但这无疑会改变估计的准确性。\n\n图 24.16 中的代码将逻辑回归分类器的 ROC 曲线绘制为实线，如图 24.17 所示。虚线是随机分类器的\
  \ ROC——一个随机选择标签的分类器。我们本可以先进行插值（因为我们只有离散的点）然后积分 ROC 曲线来计算 `AUROC`，但我们偷懒了，直接调用了 `sklearn.metrics.auc`\
  \ 函数。\n\n![art](img/Art_P303.jpg)\n\n**图 24.16 构建 ROC 曲线并寻找 AUROC**\n\n![art](img/Art_P304.jpg)\n\
  \n**图 24.17 ROC 曲线和 AUROC**\n\n**手指练习：** 编写代码，当对图 24.15 中构建的模型对 200 个随机选择的竞争者进行测试时，绘制\
  \ ROC 曲线并计算 `AUROC`。使用该代码调查训练样本数量（尝试从 10 到$10^{10}$以 50 为步长进行变化）对 `AUROC`的影响。\n\n\
  ## 24.5 在泰坦尼克号上生存\n\n1912 年 4 月 15 日早晨，RMS 泰坦尼克号撞上冰山并沉没于北大西洋。船上约 1300 名乘客中，有 832\
  \ 人死于难难。导致灾难的因素有很多，包括导航错误、救生艇不足以及附近船只的反应缓慢。个体乘客是否幸存带有随机因素，但远非完全随机。事实上，利用船上的乘客名单信息可以创建一个预测生存状况的相当模型。\n\
  \n在本节中，我们从一个包含 1046 名乘客信息的数据集中构建分类模型。^(³⁵¹)文件的每一行都包含单个乘客的信息：舱位等级（$1^{st}$、$2^{nd}$或$3^{rd}$）、年龄、性别、是否在灾难中生存以及乘客姓名。\n\
  \n我们使用逻辑回归构建模型。我们选择使用逻辑回归是因为：\n\n*   它是最常用的分类方法。\n*   通过检查逻辑回归产生的权重，我们可以洞察为什么某些乘客比其他更有可能幸存。\n\
  \n图 24.18 定义了类 `Passenger`。这段代码中唯一感兴趣的是舱位级的编码。虽然文件将舱位编码为整数，但它实际上是一个类别的简写。舱位的行为不像数字，例如，一等舱加上二等舱并不等于三等舱。我们使用三个二值化特征（每个可能的舱位一个）对舱位进行编码。对于每个乘客，这些变量中恰好有一个设置为\
  \ `1`，另外两个被设置为 `0`。\n\n这是机器学习中经常出现的问题之一。分类特征（有时称为名义特征）是描述许多事物的自然方式，例如跑步手的家籍国。很容易将这些替换为整数，例如，我们可以根据\
  \ ISO 3166-1 数字代码选择国家的表示，^(³⁵²)，例如巴西使用`076`，英国使用`826`，委内瑞拉使用`862`。这样做的问题在于，回归将认为这些是数值变量，从而对国家使用无意义的排序，导致委内瑞拉距离英国比距离巴西近。\n\
  \n通过将分类变量转换为二值变量可以避免这个问题，正如我们处理舱位时所做的一。潜在问题是分类特征会导致非常稀疏的向量。\n\n![art](img/Art_P305.jpg)\n\
  \n**图 24.18 类**\n\n\n\n\n这句话也适用于书中后半部分介绍的许多其他主题。我们试图让你领略这种利用计算来更好地理解世界时所涉及的思考方式——希望你能够找到自己继续探索这些主题的方法。你可能发现某些主题比其他主题更有趣。但我们确实希望你至少遇到过几个你期待进一步学习的主题。\n\
  \n____________\n\n³⁵⁴它们在构建样本时，通常会使用比随机选择更复杂的方法。\n\n³⁵⁵ 我们中仍有人人相信冥王星是一个行星。\n\n³⁵⁶\
  \ 尽管我们将模型拟合到整个训练集，但我们选择只绘制训练点的一个很小的子集。当我们绘制所有点时，结果是一个团块，很难在其中看清任何有用的细节。\n\n³⁵⁷ 它被称为逻辑回归，是因为它所解决的优化问题涉及一个基于几率比对数的目标函数。这类函数被称为\
  \ logit 函数，它们的逆函数称为逻辑函数。\n\n³⁵⁸ 该工具包预装了一些 Python IDE，例如 Anaconda。要了解更多关于此库的信息并发现如何安装它，请访问\
  \ [`scikit-learn.org`](http://scikit-learn.org)。\n\n³⁵⁹ 这种关系由于特征之间往往相互相关而变得复杂。例如，年龄和完成时间呈正相关。当特征相互相关时，权重系数的幅度就不是相互独立的。\n\
  \n³⁶⁰ 权重绝对值之间的微小差异归于我们的样本量是有限的。\n\n³⁶¹ 出历史原因，它被称为“接收者工作特性”。它最早开发于二战期间，用作评估接收雷达信号设备的运行特性的方法。\n\
