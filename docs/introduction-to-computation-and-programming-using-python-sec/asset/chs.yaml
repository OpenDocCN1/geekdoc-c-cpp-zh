  A.0, A.3, A.5\nCluster with centroid [ 7.66239972 3.55222681] contains:\nB.0, B.1,\
  \ B.3, B.6\n```\n\n最后一次聚类是拟合最紧密的，即聚类的不相似性最低（11.441）。这意味着它是“最佳”聚类吗？不一定。记住，当我们在第 18.1\
  \ 节中查看线性回归时，我们观察到通过增加次数可以更紧密的拟合。问题在于我们过拟合了。\n\n选择正确的 `k` 值类似于选择正确的次数。看来，我们关于聚类与不同物种进食习性相关的猜想是破灭了。\n\
  \n\n\n\n\n我们在第 22.2 节遇到过类似的问题，当时发现动物之间的距离主要由腿的数量决定。我们在那里通过将腿的数量转换为二值特征（有腿或无腿）解决了这个问题。这对于该数据集是可行的，因为所有动物恰好都有零条或四条腿。然而，在这里没有明显的方法可以在不丢失大量信息的情况下将重量转换为单个二值特征。\n\
  \n这是一个常见问题，通常通过缩放特征来，使得每个特征的均值为 0，标准差为 1，^(³³⁴)，这正如图 23.14 中的 `zScaleFeatures` 函数所示。很容易看出\
  \ `result = result - mean` 这一语句确保了返回数组的均值将始终接近 0.^(³³⁵)。而标准差始终为 1 则并不显而易见。这可以通过长而冗琐的代数运算链来证明，我们就不在此打扰你了。这种缩放通常被称为\
  \ `z-scaling`，因为正态分布有时也被称为 Z 分布。\n\n另一种常见的缩放方法是将特征的最小值映射到 0，将特征的最大值映射到 1，并在之间使用线性插值，正如图\
  \ 23.14 中的 `iScaleFeatures` 函数所示。\n\n![art](img/Art_P284.jpg)\n\n**图 23.14 属性缩放**\n\
  \n图 23.15 包含了 `readMammalData` 的版本，该版本允许使用绑定到参数 `scale` 的函数对特征进行缩放。注意，这依赖于我们将单个特征的所有值收集到一个向量中的这一事实。图\
  \ 23.15 中的 `testTeeth` 函数版本提供了 `readMammalData` 使用的缩放函数。当仅使用两个参数并调用 `testTeeth`\
  \ 时，它将使用恒等函数调用 `readMammalData`，这等同于未进行缩放。\n\n![art](img/Art_P285.jpg)\n\n当我们执行以下代码时：\n\
  \n```\nrandom.seed(0) #让两个聚类从相同的种子开始\n\nprint('Clustering without scaling')\n\n\
  testTeeth(3, 40)\n\nrandom.seed(0) #让两个聚类从相同的种子开始\n\nprint('\\\\nClustering with\
  \ z-scaling')\n\ntestTeeth(3, 40, zScaleFeatures)\n\nprint('\\\\nClustering with\
  \ i-scaling')\n\ntestTeeth(3, 40, iScaleFeatures)\n```\n\n它的输出如下：\n\n```\nClustering\
  \ without scaling\nBear, Cow, Deer, Elk, Fur seal, Grey seal, Lion, Sea lion\n3\
  \ herbivores, 4 carnivores, 1 omnivores\nBadger, Cougar, Dog, Fox, Guinea pig, Human,\
  \ Jaguar, Kangaroo, Mink, Mole, Mouse, Pig, Porcupine, Rabbit, Raccoon, Rat, Red\
  \ bat, Skunk, Squirrel, Wolf, Woodchuck\n4 herbivores, 9 carnivores, 8 omnivores\n\
  Moose\n1 herbivores, 0 carnivores, 0 omnivores\nClustering with z-scaling\nBadger,\
  \ Bear, Cougar, Dog, Fox, Fur seal, Grey seal, Human, Jaguar, Lion, Mink, Mole,\
  \ Pig, Raccoon, Red bat, Sea lion, Skunk, Wolf\n0 herbivores, 13 carnivores, 5 omnivores\n\
  Guinea pig, Kangaroo, Mouse, Porcupine, Rabbit, Rat, Squirrel, Woodchuck\n4 herbivores,\
  \ 0 carnivores, 4 omnivores\nCow, Deer, Elk, Moose\n4 herbivores, 0 carnivores,\
  \ 0 omnivores\nClustering with i-scaling\nCow, Deer, Elk, Moose\n4 herbivores, 0\
  \ carnivores, 0 omnivores\nBadger, Bear, Cougar, Dog, Fox, Fur seal, Grey seal,\
  \ Human, Jaguar, Lion, Mink, Mole, Pig, Raccoon, Red bat, Sea lion, Skunk, Wolf\n\
  0 herbivores, 13 carnivores, 5 omnivores\nGuinea pig, Kangaroo, Mouse, Porcupine,\
  \ Rabbit, Rat, Squirrel, Woodchuck\n4 herbivores, 0 carnivores, 4 omnivores\n```\n\
  \n带有缩放的聚类（两种缩放方法产生了相同的聚类）并没有根据进食习惯完美地划分动物，但它确实与它们的进食习惯有关。它很好地将肉食动物与草食动物隔离开，但杂食动物出现的位置没有明显的模式。这表明，可能还需要除牙齿和重量以外的特征来将杂食动物与草食动物及肉食动物分开。\n\
  \n____________\n\n³³⁶ 虽然 k-means 聚类可能是最常用的聚类方法，但在所有情况下并不是最合适的方法。另外两种广泛使用的方法（本书未涉及）是分层次聚类和\
  \ EM 聚类。\n\n³³⁷ 最常用的 k-means 算法归于 James McQueen，首次发表于 1967 年。然而，k-means 聚类的其他方法早在\
  \ 1950 年就已使用了。\n\n³³⁸ 最常用的 k-means 算法归于 James McQueen，首次发表于 1967 年。然而，k-means 聚类的其他方法早在\
  \ 1950 年就已使用了。\n\n³³⁹ 最常用的 k-means 算法归于 James McQueen，首次发表于 1967 年。然而，k-means 聚类的其他方法早在\
  \ 1950 年就已使用了。\n\n³⁴⁰ 最常用的 k-means 算法归于 James McQueen，首次发表于 1967 年。然而，k-means 聚类的其他方法早在\
  \ 1950 年就已使用了。\n\n³⁴¹ 最常用的 k-means 算法归于 James McQueen，首次发表于 1967 年。然而，k-means 聚类的其他方法早在\
  \ 1950 年就已使用了。\n\n³⁴² 最常用的 k-means 算法归于 James McQueen，首次发表于 1967 年。然而，k-means 聚类的其他方法早在\
  \ 1950 年就已使用了。\n\n# 24 分类方法\n\n监督学习最常见的应用是构建分类模型。**分类模型**（分类器）用于将示例标记为有限类别集合中的一个。例如，判断邮件信息是否为垃圾邮件就是一个分类问题。\n\
  \n在**单类学习**中，训练集仅包含来自某一类的示例。目标是学习一个预测示例是否属于该类的模型。当难以找到类外的训练示例时，单类学习非常有用。单类学习经常用于构建异常检测器，例如检测计算机网络的未知攻击。\n\
  \n在**二类学习**（通常称为二分类）中，训练集包含来自恰两个类的示例（通常称为正、负），目标是找到分离这两个类的边界。**多类学习**涉及找到分离多个类的边界。\n\
  \n## 24.1 评估分类器\n\n过第 18 节 的读者可能记得该章节部分讨论了选择线性回归次数的问题，以便 1) 为可用数据提供相当好的拟合，2) 对未见数据有良好概率进行良好预测。当使用监督机器学习训练分类器时，会出现相同的问题。\n\
  \n我们首先将数据划分为两个集合：训练集和**测试集**。训练集用于学习模型，测试集用于评估该模型。当我们训练分类器时，我们尝试最小化**训练误差**，即对训练集中示例分类的误差，并受到某些约束。这些约束的设计是为了增加模型在未见数据上表现良好的概率。让我们从图示来看。\n\
  \n\n\n\n\n图 24.1 左侧的图表展示了六十（模拟）美国公民投票模式的表示。x 轴是选民家到位于马萨诸塞州波士顿的距离。y 轴是选民的年龄。星形表示通常投票给民主党的选民，三角形表示通常投票给共和党的选民。图\
  \ 24.1 右侧的图表显示了一个包含随机选取的 30 名选民样本的训练集。实线和虚线显示了这两类群体之间的两种可能边界。对于基于实线的模型，线下方的点被分类为民主党选民。对于基于虚线的模型，线左侧的点被分类为民主党选民。\n\
  \n![art](img/Art_P286.jpg)\n\n**图 24.1 选民偏好分布图**\n\n没有任何一条边界能够完美地划分训练数据。两个模型的训练误差显示在图\
  \ 24.2 的`confusion matrices`中。每个矩阵的左上角显示了被分类为民主党但实际为民主党的示例数量，即真正例（true positives）。左下角显示了被分类为民主党但实际为共和党的示例数量，即假正例（false\
  \ positives）。右侧列显示了顶部的假负例数量和底部的真负例数量。\n\n![art](img/Art_P287.jpg)\n\n**图 24.2 混淆矩阵**\n\
  \n每个分类器在训练数据上的`accuracy` 可以可以通过以下公式计算：\n\n![art](img/Art_P288.jpg)\n\n在这种情况下，每个分类器的准确率均为\
  \ 0.7。哪一个模型拟合训练数据的效果更好？这取决于人们更担心将共和党人误分类为民主党，还是反之。\n\n如果我们愿意绘制更复杂的边界，我们就可以获得一个在分类训练数据方面更准确的分类器。例如，图\
  \ 24.3 中所示的分类器在训练数据上的准确率约为 0.83，如图左侧的图所示。然而，正如我们在第 18 章中讨论线性回归时提到的，模型越复杂，其过拟合训练数据的概率越高。图\
  \ 24.3 右侧的图描绘了将复杂模型应用于留存集（holdout set）时发生的情况——准确率下降到了 0.6。\n\n![art](img/Art_P289.jpg)\n\
  \n**图 24.3 更复杂的模型**\n\n当两个类别的规模大致相等时，准确率是评估分类器的合理方法。但当存在巨大的`class imbalance`（类别不平衡）时，它是评估分类器的糟糕方法。假设你负责评估一个分类器，预测某人是否患有致命疾病，该疾病在测试人群中的发生约为\
  \ 0.1%。准确率并不是一个特别有用的统计数据，因为只需宣布所有患者都健康，就能获得 99.9% 的准确率。该分类器对于那些支付治疗费用的人来说可能很棒（没有人会接受治疗！），但对于那些担心自己可能患病的人来说，它可能并不那么乐观。\n\
  \n幸运的是，有一些关于分类器的统计数据在类别不平衡时提供了启发：\n\n![art](img/Art_P290.jpg)\n\n**敏感性**（Sensitivity，在某些领域称为\
  \ `recall`）是真正例率，即被正确识别的正例比例。**特异性**（Specificity，在某些领域称为 `precision`）是真负例率，即被正确识别的负例比例。`Positive\
  \ predictive`（正预测）值是被分类为正的示例确实为正例的概率。`Negative predictive`（负预测）值是被分类为负的示例确实为负例的概率。\n\
  \n这些统计指标的实现以及使用它们生成某些统计数据的函数位于图 24.4 中。我们将在章后面的部分使用这些函数。\n\n![art](img/Art_P291.jpg)\n\
  \n**图 24.4 用于评估分类器的函数**\n\n## 24.2 预测跑步者的性别\n\n在书的前面，我们使用波士顿马拉松的数据来说明了许多统计概念。现在我们将使用相同的数据来说明各种分类方法的应用。任务是根据跑步者的年龄和完成时间预测跑步者的性别。\n\
  \n图 24.5 中的代码通过调用图 17.2 中定义的 `getBMData` 函数从文件中读取数据，然后构建一个示例集。每个示例都是 `Runner` 类的一个实例。每个跑步者都有一个标签（性别）和一个特征向量（年龄和完成时间）。`Runner`\
  \ 中唯一有趣的方法是 `featureDist`。它返回两个跑步者特征向量之间的欧几里得距离。\n\n下一步是将示例拆分为训练集和留存测试集。按照惯常做法，我们使用\
  \ 80% 的数据进行训练，并在剩下的 20% 上进行测试。这是通过使用 24.5 底部的 `divide80_20` 完成的。注意，我们是随机选择训练数据的。如果文件是按完成时间排序的，那么我们将得到一个偏向优秀选手的训练集。\n\
  \n我们现在准备好查看使用训练集来构建预测跑步者性别的不同方法。检查发现，训练集中 58% 是男性。因此，如果我们一直猜男性，我们预期的准确率为 58%。在查看更复杂的算法的性能时，请记住这个基准。\n\
  \n## 24.3 K 近邻\n\n**K 近邻（KNN）** 可能是所有分类算法中最简单的。“学习”到的模型就是训练示例本身。新示例根据它们与训练数据示例的相似性被分配标签。\n\
  \n![art](img/Art_P292.jpg)\n\n**图 24.5 构建示例并将数据分为训练集和测试集**\n\n假设和你朋友在公园散步时发现了一只鸟。你认为它是一只黄啄，但你的朋友非常确定它是一只绿啄。你冲回家，翻出你的鸟类书籍收藏（如果你不满\
  \ 35 岁，就去你最喜欢的搜索引擎），开始查看鸟的标记照片。将这些标记照片视为训练集。没有一张照片与你看到的鸟完全匹配，所以你选择选择与你看到的鸟最像的五张（即五个“最近邻”）。它们中的大多数是黄啄的照片——你宣布了胜利。\n\
  \nKNN 分类器的一个缺点是，当存在巨大的类别不平衡时，它们的结果通常很差。如果书中鸟物种的照片频率与该物种在你社区中的出现频率相同，KNN 可能运行良好。然而，假设在物种同样常见的情况下，你的书中有\
  \ 30 张黄啄的照片，而只有一张绿啄的照片。如果使用简单的多数投票来确定分类，即使照片看起来并不像你看到的鸟，也会选择黄啄。这个问题可以通过使用更复杂的投票方案来减轻，即根据\
  \ K 近邻与被分类示例之间的相似性对其进行加权。\n\n\n\n\n图 24.6 中的函数实现了一个 k 近邻分类器，可以根据跑步者的年龄和完赛时间预测跑步者的性别。该实现是暴力破解。函数\
  \ `findKNearest` 的复杂度与 `exampleSet` 中的示例数量成线性，因为它计算了 `example` 与 `exampleSet` 中每个元素之间的特征距离。`kNearestClassify`\
  \ 函数使用简单的多数投票方案进行分类。`kNearestClassify` 的复杂度为 `O(len(training)*len(testSet))`，因为它总共调用了\
  \ `len(testSet)` 次 `findNearest` 函数。\n\n当运行代码：\n\n```python\nexamples = buildMarathonExamples('bm_results2012.txt')\n\
  \ntraining, testSet = divide80_20(examples)\n\ntruePos, falsePos, trueNeg, falseNeg\
  \ = \\\nKNearestClassify(training, testSet, 'M', 9)\n\ngetStats(truePos, falsePos,\
  \ trueNeg, falseNeg)\n```\n\n时，它输出了：\n\n```\nAccuracy = 0.65\nSensitivity = 0.715\n\
  Specificity = 0.563\nPos. Pred. Val. = 0.684\n```\n\n![art](img/Art_P293.jpg)\n\n\
  **图 24.6 寻找 k 近邻**\n\n考虑到根据年龄和完赛时间以 65% 的准确率预测性别，我们应该感到高兴吗？评估分类器的一种方法是与一个甚至不考虑年龄和完赛时间的分类器进行比较。图\
  \ 24.7 中的分类器首先使用 `training` 中的示例来估计 `testSet` 中随机选择的示例属于某一类别标签的概率。使用这一先验概率，它随后随机为\
  \ `testSet` 中的每个示例分配一个标签。\n\n当我们对测试 KNN 的波士顿马拉松数据上测试 `prevalenceClassify` 时，它输出了：\n\
  \n```\nAccuracy = 0.514\nSensitivity = 0.593\nSpecificity = 0.41\nPos. Pred. Val.\
  \ = 0.57\n```\n\n这表明通过考虑年龄和完赛时间，我们获得了相当大的优势。\n\n这种优势是有代价的。如果你运行 图 24.6 中的代码，你会发现完成需要很长的时间。有\
  \ 17,233 个训练示例和 4,308 个测试示例，因此计算了近 7500 万次距离。这引发了我们是否真的需要使用训练示例的问题。让我们看看简单地将训练数据缩小\
  \ 10 倍会发生什么。\n\n如果我们运行：\n\n```python\nreducedTraining = random.sample(training,\
  \ len(training)//10)\n\ntruePos, falsePos, trueNeg, falseNeg = \\\nKNearestClassify(reducedTraining,\
  \ testSet, 'M', 9)\n\ngetStats(truePos, falsePos, trueNeg, falseNeg)\n```\n\n它只需要十分之一的时间即可完成，分类性能几乎没有变化：\n\
  \n```\nAccuracy = 0.643\nSensitivity = 0.726\nSpecificity = 0.534\nPos. Pred. Val.\
  \ = 0.673\n```\n\n在实践中，当人们将 KNN 应用于大型数据集时，他们会对训练数据进行下采样。^[³⁴³]\n\n![art](img/Art_P294.jpg)\n\
  \n**图 24.7 基于流行率的分类器**\n\n在上述实验中，我们将 `k` 设置为 9。我们选择这个数字并不是因为它在科学上的作用（太阳系中的行星数量）^[³⁴⁴]、它的宗教意义（印度教女神杜尔迦的形式数量）或它的社会学重要性（棒球阵容中的击球人数）。相反，我们通过使用\
  \ 图 24.8 中的代码从训练数据中学习并搜索一个理想的 `k`。\n\n外层循环测试 `k` 的序列值。我们只测试奇值，以确保在 `kNearestClassify`\
  \ 进行投票时，一种性别总会有多数派。\n\n内层循环使用 n 折交叉验证测试 `k` 的每个值。在循环的 `numFolds` 次迭代中，原始训练集被划分为一个新的训练集/测试集对。然后，我们使用\
  \ k 近邻和新的训练集计算对新测试集的分类准确率。当我们退出内层循环时，计算 `numFolds` 折的平均准确率。\n\n![art](img/Art_P295.jpg)\n\
  \n**图 24.8 寻找理想的 k**\n\n当我们运行代码时，它生成了 图 24.9 中的图表。我们可以看到，17 是在 5 折中产生最佳准确率的 `k`\
  \ 值。当然，不能保证比 21 大的某些值不会更好。然而，一旦 `k` 达到 9，准确率就在一个相当窄范围内波动，因此我们选择使用 9。\n\n![art](img/Art_P296.jpg)\n\
  \n**图 24.9 选择 k 的值**\n\n## 24.4 基于回归的分类器\n\n在 第 18 章 中，我们使用了线性回归来建立模型。\n\n\n\n\n\
  `fit` 方法返回一个 `LogisticRegression` 类型的对象，该对象已经为特征向量中的每个特征学习了系数。这些系数通常被称为`特征权重`（feature\
  \ weights），它们捕捉了特征与结果之间的关系。正的特征权重意味着特征与结果之间存在正相关，负的特征权重则意味着存在负相关。权重的绝对值与相关性的强度有关。可以使用\
  \ `LogisticRegression` 的 `coef_` 属性访问这些权重的值。由于可以在多个结果（在程序包的文档中称为“类”，classes）上对 `LogisticRegression`\
  \ 对象进行训练，因此 `coef_` 的值是一个序列，其中每个元素都包含与单个结果相关的权重序列。因此，例如，表达式 `model.coef[1][0]` 表示第二个结果的第一个特征的系数值。\n\
  \n一旦学习了系数，就可以使用 `LogisticRegression` 类的 `predict_proba` 方法来预测与特征向量相关的结果。`predict_proba`\
  \ 方法除了 `self` 之外还接收一个单一参数，即特征向量序列。它返回一个数组数组，每个特征向量对应一个数组。返回数组中的每个元素都包含对对应特征向量的预测结果。之所以预测结果是一个数组，是因为它包含了构建模型时使用的每个标签的概率。\n\
  \n图 24.13 中的代码包含了对这一切如何运作的简单插图。它首先创建一个包含 100,000 个示例的列表，每个示例都有一个长度为 2 的特征向量，并标记为\
  \ 'A'、'B'、'C' 或 'D'。每个示例的前两个特征值提取自标准差为 0.5 的高斯分布，但均值取决于标签。第三个特征的值是随机选择的，因此对于预测标签可能没有用。创建示例后，代码生成了一个逻辑回归模型，打印特征权重，最后打印了与四个示例相关的概率。\n\
  \n![art](img/Art_P300.jpg)\n\n**图 24.13 使用 sklearn 进行多分类逻辑回归**\n\n当运行图 24.13 中的代码时，它输出了：\n\
