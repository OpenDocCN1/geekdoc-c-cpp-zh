  \n## 18.4 当理论缺失时](#toc.Rh1-66)在本在本中，我们强调了理论、实验和计算科学之间的相互作用。然而，有时我们拥有大量有趣的数据，但缺乏理论。在这种情况下，我们通常求助于计算技术，通过建立一个拟合数据的模型来开发理论。在理想情况下，我们会进行实验（例如，在弹簧上悬挂权重），研究结果，并制定出与结果一致的模型。\n\
  \n遗憾的是，许多情况下无法进行实验。在这种情况下，人们可以通过将现有数据分为**训练集**（training set）和**留集**（holdout set）来模拟实验。在不查看留集的情况下，我们建立一个拟合训练集的模型，并获得一个合理的\
  \ `R²`。通常，模型对训练集的拟合程度比对留集更好。如果是这样，模型应该被丢弃。\n\n如何选择训练集？我们希望它能代表整个数据集。一种方法是随机选择样本。如果数据集足够大，这种方法通常有效。\n\
  \n检查模型的另一种稍有不同的方法是在多个随机子集上进行训练，并观察模型之间的相似性。如果它们非常相似，我们就可以放心。这种方法被称为**交叉验证**（cross\
  \ validation）。\n\n交叉验证将在第 19 章](#chapter19.xhtml)和第 22 章](#chapter22.xhtml)中进行详细讨论。\n\
  \n____________\n\n²⁴⁷ 牛顿，记作 `N`，是力的国际标准单位。它是使 1 公斤质量产生每秒平方的速度产生加速度所需的力。顺便说一下，弹簧的弹簧系数约为\
  \ `1N/m`。\n\n²⁴⁸ 它们之所以这样做是因为多项式回归拟合的是非线性模型，但模型对于估计的未知参数是线性的。\n\n²⁴⁹ 这并不是说人们从不做。\n\
