  \ 7.66239972 3.55222681] contains:\nB.0, B.1, B.3, B.6\nCluster with centroid [\
  \ 3.56907939 4.95707576] contains:\nA.0, A.1, A.2, A.3, A.4, A.5, A.7, B.2, B.4,\
  \ B.5, B.7\nCluster with centroid [ 3.12083099 8.06083681] contains:\nA.6, C.0,\
