  \n\n\n\n\n^(253 该方程可以从第一原理推导出，但直接查阅更为方便。我们在 [`en.wikipedia.org/wiki/Equations_for_a_falling_body`](http://en.wikipedia.org/wiki/Equations_for_a_falling_body)\
  \ 发现了它。\n\n²⁵⁴ 速度的分分量也容易估计，因为它仅仅是图 18.14 中 `g` 和 `t` 的积。\n\n# 19 随机试验与假设检验](#toc.xhtml_chap-19)\n\
  \nX 博士发明了一种名为 `PED-X` 的药物，旨在帮助职业自行车骑得更快。当他尝试将其推向时，运动员们坚持 X 博士证明他的药物优于 `PED-Y`——他们已经使用了多年的禁药。X\
  \ 博士从一些投资者那里筹了资金，并启动了一项`随机试验`。\n\n他说服了 200 名职业运动员参加了他的试验。随后，他将他们随机分为两组：治疗组和对照组。每个`治疗组`成员都接受了一剂\
  \ `PED-X`。`对照组`的成员被告知他们也接受了一剂 `PED-X`，但实际上得到的是一剂 `PED-Y`。\n\n每位运动员都被要求以最快速度骑完 50\
  \ 英里。每组的完成时间呈正态分布。治疗组的平均完成时间为 118.79 分钟，对照组为 120.17 分钟。图 19.1 显示了每位运动员的时间。\n\n![art](img/Art_P218.jpg)\n\
  \n**图 19.1：自行车运动员的完成时间**\n\nX 博士曾欣喜若狂，直到他遇到一位统计学家，后者指出，两组中有一组平均值低于另一组几乎是必然的，平均值之间的差异可能仅仅是一个随机事件。当她看到科学家脸上沮丧的神情时，这位统计学家提出向他展示如何检查其研究的统计显著性。\n\
  \n## 19.1 检查显著性](#toc.xhtml.Rh1-67)\n\n在任何涉及从总体中随机抽样的实验中，始终存在观察到的效应纯粹偶然发生的可能性。图\
  \ 19.2 是对 2014 年 1 月温度与 1951 年至 1980 年 1 月平均温度变化的视觉可视化。现在，想象你通过在地球上选择 20 个随机点构建了一个样本，然后发现样本的平均温度变化为\
  \ `+1` 摄氏度。观察到的平均温度变化是由你恰好采样的位点造成的，而非整个星球正在变暖的概率有多大？回答这类问题正是`统计显著性`的意义。\n\n![art](img/Art_P219.jpg)\n\
  \n**图 19.2 与 1951-1980 年平均值相比的 1 月温度差（摄氏度）**^(²⁵⁵)\n\n在 20 世纪初，罗纳德·费希尔（Ronald Fisher）开发了一种统计`假设检验`方法，该方法已成为评估观察到的效应纯粹偶然发生概率的最常用方法。费希尔声称他发明这种方法是为了回应米里尔·布里斯托尔-罗奇（Muriel\
  \ Bristol-Roach）博士的一项主张：她在喝奶茶时可以检测出是先倒茶还是先倒牛奶。费希尔挑战她进行一项“茶测试”，给她提供八杯茶（每种添加茶和牛奶的顺序各杯），并要求她识别出哪些杯是先倒茶后倒牛奶的。她完美地完成了。费希尔随后计算了她纯偶然做到这一点的概率。正如我们在第\
  \ 15.4.4 节中看到的，![art](img/Art_P220.jpg)，即从 8 杯中选择 4 杯有 70 种不同的选择方式。由于这 70 种组合中只有一种组合包含了所有\
  \ 4 杯先倒茶的杯，费希尔计算出布里斯托尔-罗奇博士纯粹靠运气选对的概率为 ![art](img/Art_P221.jpg)。据此他得出结论，她的成功极不可能归于运气。\n\
  \n费希尔的显著性检验方法可以总结为：\n\n1.  陈述一个`零假设`和一个`备择假设`。零假设是“治疗”没有有趣的影响。对于“茶测试”，零假设是布里斯托尔-罗奇博士没有辨别差异的能力。备择假设是一个只有在零假设为假时才为真的假设，例如，布里斯托尔-罗奇博士能尝出这种差异.^(([²⁵⁶)\n\
  2.  理解关于被评估样本的统计假设。对于“茶测试”，费希尔假设布里斯托尔-罗奇博士对每杯茶都是做出的独立决策。\n3.  计算相关的检验统计量。在这种情况下，该检验统计量是布里斯托尔-罗奇博士给出的正确答案的比例。\n\
  4.  推导出该检验统计量在零假设下的概率。在这种情况下，偶然选对所有杯茶的概率，即 `0.014`。\n5.  判断该概率是否足够小，至于你愿意假设零假设是假的，即`拒绝`零假设。应预先选择的拒绝水平的常用值为\
  \ `0.05` 和 `0.01`。\n\n回到我们的运动员，想象治疗组和对照组的时间是从 `PED-X` 用户和 `PED-Y` 用户的完成时间的无限总体中抽取的样本。该实验的零假设是这两个大群体的平均值是相同的，即治疗组总体平均值与对照组总体平均值之间的差异为\
  \ `0`。备择假设是它们是不相同的，即平均值差异不等于 `0`。\n\n接下来，我们尝试拒绝零假设。我们为统计显著性选择一个阈值 `α`，并试图证明数据来自与零假设一致的分布的概率小于\
  \ `α`。我们就可以说以 `α` 的置信度拒绝零假设，并接受零假设的否定。\n\n`α` 的选择影响我们犯错误的类型。`α` 越大，我们越容易拒绝一个真实的零假设。这些被称为`第一类错误`。当\
  \ `α` 较小时，我们越容易接受一个错误的零假设。这些被称为`第二类错误`。\n\n大多数人选择 `α = 0.05`。然而，取决于错误的后果，选择较小或较大的\
  \ `α` 可能是更优的。例如，假设零假设是服用 `PED-X` 人和服用 `PED-Y` 人之间的死亡率没有差异。人们可能希望选择较小的 `α`（例如 `0.01`）作为拒绝该假设的基础，以判断哪种药物更安全。另一方面，如果零假设是\
  \ `PED-X` 和 `PED-Y` 的味道没有差异，人们可能会从容选择一个较大的 `α`。^(²⁵⁷)\n\n下一步是计算检验统计量。最常用的检验统计量是\
  \ `t` 统计量。`t` 统计量告诉我们从数据得出的估计值以标准误差为单位距离零假设有多远。`t` 统计量越大，拒绝零假设的可能性越高。对于我们的示例，`t`\
  \ 统计量告诉我们两个平均值之差（`118.79 – 120.17 = -1.38`）距离 `0` 有多少个标准误差。我们 `PED-X` 示例的 `t` 统计量为\
  \ `-2.13165598142`。这意味着什么？我们如何使用它？\n\n\n\n\n\n我们使用 t 统计量的方式与使用均值的标准差个数来计算信区间非常相似（参见第\
  \ 15.4.2 节）。记住，对于所有正态分布，样本落在均值固定标准差范围内的概率是固定的。在这里我们执行了稍微复杂的处理，考虑了计算标准误差时使用的样本数量。我们不再假设正态分布，而是假设一个\
  \ `t-distribution`。\n\nt 分布最早由 William Gosset 在 1908 年描述，他是任职 Arthur Guinness and\
  \ Son 啤酒厂的一名统计学家（(²⁵⁸)）。t 分布实际上是一个分布族，因为分布的形状取决于样本的自由度（degrees of freedom）。\n\n\
  `degrees of freedom`（自由度）描述了用于推导 t 统计量的独立信息量。通常情况下，我们可以将自由度看作样本中独立观测值的数量，这些观测值用于估计抽自该样本的总体某些统计量。\n\
  \nt 分布看起来非常像正态分布，自由度越高，它越接近正态分布。对于自由度较小时，t 分布的尾部比正态分布明显更厚。对于自由度 30 或更高，t 分布非常接近正态分布。\n\
  \n现在，让我们使用样本方差来估计总体方差。记得\n\n![art](img/Art_P222.jpg)\n\n所以我们样本的方差是\n\n![art](img/Art_P223.jpg)\n\
  \n看起来我们似乎在使用三个独立的信息，但事实并非如此。分子中的三项并不是相互独立的，因为这三个观测值都用于计算这 200 名骑手样本的均值。自由度为 2，因为一旦我们知道了均值和三个观测值中的任意两个，第三个观测值就确定了。\n\
  \n自由度越大，样本统计量代表总体的概率越高。从单个样本计算出的 t 统计量的自由度比样本量少 1，因为计算 t 统计量使用了样本均值。如果使用两个样本，自由度比样本量之和少\
  \ 2，因为每个样本的均值都用于计算 t 统计量。例如，对于 PED-X/PED-Y 实验，自由度为 198。\n\n给定自由度，我们可以画出一图显示适当的 t\
  \ 分布，然后查看我们为 PED-X 示例计算出的 t 统计量位于分布的什么位置。图 19.3 中的代码执行了这一操作，并在图 19.4 中图中。代码首先使用\
  \ `scipy.random.standard_t` 函数生成大量从具有 198 个自由度的 t 分布中抽取的样本。然后他在 PED-X 样本的 t 统计量和\
  \ t 统计量的负值处画白线。\n\n![art](img/Art_P224.jpg)\n\n**图 19.3 绘制 t 分布**\n\n![art](img/Art_P225.jpg)\n\
  \n**图 19.4: 可视化 t 统计量**\n\n直方图中白线左侧和右侧面积比例之和，等于在以下情况下获得至少与观测值同样极值的概率：\n\n* 样本具有总体的代表性，且\n\
  * 零假设是真实的。\n\n我们需要查看两个尾部，因为我们的零假设是总体均值相等的。所以，如果治疗组的均值显著大于或显著小于控制组的均值，则测试应该失败。\n\n\
  在零假设成立的下，获得至少与观测值同样极值的概率被称为 `p-value`（p 值）。对于我们的 PED-X 示例，p 值是在假设治疗组和控制组的实际总体均值相同的情况下，看到均值差异至少与观测差异相同的概率。\n\
  \n这看起来可能有点奇怪：p 值告诉我们关于如果零假设成立时某个事件发生的概率，而我们通常希望的是零假设**不**成立。然而，它在性质上与经典的“科学方法”并没有太大区别，科学方法是基于设计具有反驳假设潜力的实验。图\
  \ 19.5 中的代码计算并打印了我们两个样本的 t 统计量和 p 值。库函数 `stats.ttest_ind` 执行了双尾双样本 `t-test`（t 检验），并返回了\
  \ t 统计量和 p 值。将参数 `equal_var` 设置为 `False` 表示我们不知道两个总体是否具有相同的方差。\n\n![art](img/Art_P226.jpg)\n\
  \n**图 19.5 计算并打印 t 统计量和 p 值**\n\n当我们运行代码时，它报告\n\n```\nTreatment mean - control mean\
  \ = -1.3766016405102306 minutes\nThe t-statistic from two-sample test is -2.13165598142\n\
  The p-value from two-sample test is 0.034372079915\n```\n\n“是的，”X 医生叫道，“PED-X 优于\
  \ PED-Y 的概率小于 3.5%，因此 PED-X 有效应的概率大于 96.5%。钱机响起来吧。”唉，他的喜悦只持续到看到本章下一节。\n\n## 19.2\
  \ 警惕 p 值\n\n从 p 值中读出它并不包含的信息是非常容易的。人们很容易将 p 值认为是零假设成立的概率。但这并不是它的真实含义。\n\n零假设类似于英美刑事司法体系中的被告。该系统基于一个“无罪推定”的原则，即在证明有罪之前无罪。模拟，我们假设零假设是真的，除非看到相反的证据。在审判中，陪审团可以判定被告“有罪”或“无罪”。无罪判决意味着证据不足以让陪审团在“合理怀疑”之外判定有罪（(²⁵⁹)）。将其等同于“未被证明”。无罪并不意味着证据足以让陪审团相信被告是无罪的。它对于看到不同证据时的结论没有任何说明。将\
  \ p 值 理解为一种判决，其中标准的“合理怀疑”对应于选择一个非常小的 `α`，而证据则是构建 t 统计量的数据。\n\n小的 p 值表示，如果零假设成立，特定的样本是不可能的。这类似于陪审团认为，如果被告无罪，他们不太可能看到这组证据，因此得出有罪判决。当然，这并不意味着被告实际上有罪。也许陪审团看到的证据是有误导性的。同样，低\
  \ p 值可能归于零假设实际上为假，或者仅仅是样本对于抽自的总体不具有代表性，即证据具有误导性。\n\n\n\n\n这个 p 值几乎是 X 博士实验结果的 24\
  \ 倍，而且由于它远大于 0.5，因此没有理由怀疑虚无假设。现场一片困惑。但我们可以拨开迷雾！\n\n你可能不会惊讶地发现这并不是一个真实的故事——毕竟，运动员服用性能增强药物的想法本身就违背了常理。事实上，实验的样本是由图\
  \ 19.6 中的代码生成的。\n\n![art](img/Art_P227.jpg)\n\n**图 19.6 生成跑步示例的代码**\n\n由于该实验纯粹是计算性的，我们可以多次运行它以获得许多不同的样本。当我们生成了\
  \ 10,000 对样本（每个分布各取一个）并绘制了 p 值的概率分布图时，我们得到了图 19.7 中的图表。\n\n![art](img/Art_P228.jpg)\n\
  \n**图 19.7：p 值的概率**\n\n由于超过 11.6% 的 p 值低于 0.05，因此我们运行的第一次实验恰好在 5% 的水平上显示显著，这并不十分意外。另一方面，第二个实验得到了完全不同的结果也不令人意外。令我们惊讶的是，在已知两个分布的均值实际上是不同的情况下，我们仅在约\
  \ 11.6% 的时间内得到了在 5% 水平上显著的结果。在超过 88% 的时间里，我们无法在 5% 的水平上拒绝一个虚假的虚无假设。（如果我们将示例中的样本量增加到\
  \ 2000，我们无法拒绝虚假虚无假设的时间将仅为约 6%。）\n\np 值可能是判断是否真的应该拒绝虚无假设的不可靠指标，这是为什么科学文献中出现的许多结果无法被其他科学家复制的原因之一。其中一个问题是**统计功效**（样本量）与统计发现的可信度之间存在着强相关关系.^(^(260)\n\
  \n为什么有这么多研究的效能不足？如果我们真的对人进行实验（而不是模拟），抽取样本量为 2000 的样本的成本将是抽取样本量为 100 样本的二十倍。\n\n\
  样本量问题是所谓频率派统计方法的内在属性。在第 20 章中，我们将讨论一种试图缓解这一问题的的替代性方法。\n\n### 19.3 单侧检验和单样本检验](#toc.xhtml_Rh1-69)\n\
  \n到本章为止，我们只查看了双侧双样本检验。在某些情况下，使用**单侧**和/或**单样本** t 检验更为合适。\n\n让我们先考虑单侧双样本检验。在我们对\
  \ PED-X 和 PED-Y 的相对效果进行的双侧检验中，我们考虑了三种情况：1）它们的效果相同，2）PED-X 比 PED-Y 更有效，以及 3）PED-Y\
  \ 比 PED-X 更有效。目标是通过论证来拒绝虚无假设（情况 1），理由是：如果该假设是真实的，那么在 PED-X 和 PED-Y 样本均值中观察到如此大的差异是不太可能的。\n\
  \n然而，假设 PED-X 的成本明显低于 PED-Y。为了给他的化合物寻找市场，X 博士只需要证明 PED-X 的效果至少与 PED-Y 相当。考虑此问题的方法是：我们拒绝均值相等或\
  \ PED-X 均值更大的假设。注意，这比均值相等的假设要严格弱得多。（假设 A 严格弱于假设 B，是指只要当 B 为真时 A 为真，但反之则不然。）\n\n\
  为了做到这一点，我们从由图 19.5 中的代码计算的原始虚无假设的双样本检验开始。它输出了：\n\n```\nTreatment mean - control\
  \ mean = -1.37660164051 minutes\n\nThe t-statistic from two-sample test is -2.13165598142\n\
  \nThe p-value from two-sample test is 0.0343720799815\n```\n\n这使得我们可以在 3.5% 的水平上拒绝虚无假设。\n\
  \n那么我们那个较弱的假设呢？回想图 19.4。我们观察到，在虚无假设成立的假设下，直方图中白线左侧和右侧面积比例之和等于获得与观察值至少同样极的值的概率。然而，为了拒绝我们较弱的假设，我们不需要考虑左尾下方的面积，因为那对应于\
  \ PED-X 比 PED-Y 更有效（负时间差），而我们只感兴趣于拒绝 PED-X 效果较小的假设。即，我们可以进行单侧检验。\n\n由于 t 分布是对称的，为了得到单侧检验的值，我们将双侧检验的\
  \ p 值对半。因此，单侧检验的 p 值为双侧检验 p 值的一半。所以单侧检验的 p 值为 0.01718603999。这使得我们可以在 1.7% 的水平上拒绝该假设，这在双侧检验中是做不到的。由于单侧检验具有更高的功效，每当我们对效应的方向有假设时，就会想使用单侧检验。但这通常不是一个好主意。\n\
  \n现在让我们看看单样本检验。假设根据对 PED-Y 的多年经验，完成该程的平均时间为 120 分钟。为了发现 PED-X 是否有差异，我们将使用 `scipy.stats.ttest_1samp`\
  \ 函数，它接受单个样本和一个与之比较的总体均值。它返回一个包含 t 统计量和 p 元组。例如，我们在图 19.5 的代码末尾添加\n\n```\noneSampleTest\
  \ = stats.ttest_1samp(treatmentTimes, 120)\nprint('The t-statistic from one-sample\
  \ test is', oneSampleTest[0])\nprint('The p-value from one-sample test is', oneSampleTest[1])\n\
  ```\n\n它输出\n\n```\nThe t-statistic from one-sample test is -2.32665745939\n\nThe\
  \ p-value from one-sample test is 0.02202151687\n```\n\np 值比我们使用双样本检验得到的要小，并不意外。通过假设一个均值，我们消除了一个不确定性。\n\
  \n\n\n\n约翰最近读过一本关于统计学的书，他提出了以下方法来判断将 Lyndsay 的相对成功归因于技能是否合理：\n\n- 将 1,273 场比赛中的每一场都视为一次实验，如果\
  \ Lyndsay 获胜则返回 1，如果不是则返回 0。\n- 设定零假设为这些实验的平均值为 0.5。\n- 对该零假设进行双侧单样本检验。\n\n当他运行代码时：\n\
  \n```python\nnumGames = 1273\nlyndsayWins = 666\noutcomes = [1.0]*lyndsayWins +\
  \ [0.0]*(numGames-lyndsayWins)\nprint('The p-value from a one-sample test is',\n\
  stats.ttest_1samp(outcomes, 0.5)[1])\n```\n\n输出结果为：\n\nThe p-value from a one-sample\
  \ test is 0.0982205871244\n\n这让约翰声称，这种差异在 5% 的水平上远未达到显著。\n\nLyndsay 没有学过统计学，但读过此书的第\
  \ 16 章，她并不满意。她建议道：“让我们运行蒙特卡洛模拟吧，”并提供了图 19.8 中的代码。\n\n![art](img/Art_P229.jpg)\n\n\
  **图 19.8：Lyndsay 的比赛模拟**\n\n当运行 Lyndsay 的代码时，它输出了：\n\nProbability of result at least\
  \ this extreme by accident = 0.0491\n\n这让她声称约翰的统计检验完全是荒谬的，而且获胜数的差异在 5% 的水平上具有统计显著性。\n\
  \n“不，”约翰耐性地解释道，“你的模拟才是荒谬的。它假设你是更好的选手，并执行了等同于单侧检验的操作。你模拟的内部循环是错误的。你应该执行等同于双侧检验的操作，通过测试在模拟中是否有任何一名玩家胜出的场数超过了你在实际比赛中胜出的\
  \ 666 场。”约翰随后运行了图 19.9 中的模拟。\n\n![art](img/Art_P230.jpg)\n\n**图 19.9：正确的比赛模拟**\n\
  \n约翰的模拟输出为：\n\nProbability of result at least this extreme by accident = 0.0986\n\
  \n“这与我的双侧检验预测的结果非常接近，”约翰大喊道。Lyndsay 那不符合女性风度的反应并不适合出现在一本面向家庭的书中。\n\n### 19.5 N 是多少？](#toc.xhtml_Rh1-71)\n\
  \n一位教授怀疑参加讲座是否与其所在系的成绩相关。他招募了 40 名大一新生并让他们都戴上脚链，以便他追踪他们的行踪。一半的学生不被允许参加任何课程的任何讲座，^(²⁶¹)另一半则被要求参加所有讲座。(([262))。在接下来的四年里，每位学生都上了\
  \ 40 门不同的课程，为每组学生产生了 800 个成绩。\n\n当教授对这两个规模为 800 的样本均值进行双侧 t 检验时，p 值约为 0.01。这让教授感到失望，因为他本希望没有统计学上的显著影响——这样他在取消讲座去海边时就不会感到那么内疚了。在绝望中，他查看了两组的平均\
  \ GPA，发现它们之间的差异微乎其微。他在想，如此微小的均值差异怎么在该水平上是显著的呢？\n\n当样本量足够大时，即使是很小的效应也可以具有高度的统计显著性。也就是说，N\
  \ 非常重要。图 19.10 绘制了 1000 次实验的平均 p 值与这些实验使用的样本大小之间的关系。对于每个样本量和每次实验，我们都生成了两个样本。每个样本都提取自标准差为\
  \ 5 的高斯分布。其中一个均值为 100，另一个均值为 100.5。平均 p 值随着样本量的增加而线性下降。当样本量达到约 1500 时，0.5% 的均值差异在\
  \ 5% 水平上变得持续统计显著，而当样本量超过约 2600 时，在 1% 水平上也是显著的。\n\n![art](img/Art_P231.jpg)\n\n\
  **图 19.10：样本量对 p 值的影响**\n\n回到我们的例子，教授在研究的每个组别中使用 800 的 N 是否合理？换句话说，对于每组 20 名学生，真的有\
  \ 800 个独立的示例吗？可能没有。虽然每个样本有 800 个成绩，但只有 20 名学生，而与每个学生相关的 40 个成绩可能不应被视为独立的示例。毕竟，有些学生总是能得好分，而另一些学生的成绩总是令人失望。\n\
  \n教授决定以另一种方式查看数据。他计算了每个学生的 GPA。当他对这两个规模均为 20 的样本进行双侧 t 检验时，p 值约为 0.3。他感觉好多了。\n\n\
  ### 19.6 多重假设](#toc.xhtml_Rh1-72)\n\n在第 17 章中，我们查看了波士顿马拉松的样本。图 19.11 中的代码读取了马拉松数据，并寻找选定国家之间的统计学显著差异。它使用了定义在图\
  \ 17 中的 `getBMData` 函数。\n\n![art](img/Art_P232.jpg)\n\n**图 19.11：比较选定国家的平均成绩**\n\
  \n当运行代码时，它输出：\n\nITA and JPN have significantly different means, p-value = 0.025\n\
  \n看起来意大利或日本其中一个可以声称比另一个更快。(²⁶³) 然而，这种结论非常站不住脚。虽然一组选手的成绩确实更快，但样本量（20 和 32）较小，可能不能代表国家的情况。\n\
  \n更重要的是，我们构建实验的方法存在缺陷。我们检查了 10 个零假设（每对国家一个），并发现其中一个可以被拒绝。一种理解是，我们实际上在检查零假设：“对于所有国家对，女性马拉松选手的平均成绩都是相同的。”拒绝这个零假设是可以接受的，但这并不等同于拒绝意大利和日本的女性同样快。\n\
  \n这一点在图 19.12 的例子中得到了鲜明说明。在该例子中，我们从同一个总体提取了二十对规模为 200 的样本，并对每对样本测试均值是否具有统计学差异。\n\
  \n![art](img/Art_P233.jpg)\n\n**图 19.12：检查多重假设**\n\n由于所有样本都提取自同一个总体，我们知道零假设是真的。然而，当我们运行代码时，它输出：\n\
  \nNumber of statistically significant (p < 0.05) results = 1\n\n表明有一对假设可以被拒绝。\n\n\
  这并不特别令人。记得，p 值为 0.05 表示，如果零假设成立，观察到的均值差异至少等于这两个样本之间差异大小的概率为 0.05。因此，如果我们检查二十对样本，至少有一对样本的均值在统计学上是显著不同的，这并不令人意外。\n\
  \n\n\n\n回到我们的波士顿马拉松实验，我们检查了是否可以对 10 组样本拒绝零假设（均值无差异）。在运行涉及多个假设的实验时，最简单且保守的方法是使用所谓的`Bonferroni\
  \ correction`（邦费罗尼校正）。其背后的直觉非常简单：在检查一组包含 `m` 个假设的族时，维持适当`族误差率`（family-wise error\
  \ rate）的一种方法是在`![art](img/Art_P234.jpg)`水平上对每个单独假设进行测试。使用 Bonferroni 校正来查看意大利和日本之间的差异在\
  \ `α = 0.05` 水平下显著，我们需要检查 p 值是否小于 `0.05/10`，即 `0.005`——事实并非如此。\n\n如果测试次数很多，或者测试的统计量之间存在正相关，那么\
  \ Bonferroni 校正就是保守的（即它拒绝零假设的次数比需要的要高）。另一个问题是缺乏一个普遍接受的“假设族”定义。显而易见，图 19.12 代码生成的假设是相关的，因此需要应用校正。但情况并不总是如此明朗。\n\
  \n***\n\n²⁶⁴ 这是由美国国家航空航天局提供的彩色图像的灰度版本。\n\n²⁶⁵ 在他的公式中，Fisher 只有一个零假设。备择假设的概念后来由 Jerzy\
  \ Neyman 和 Egon Pearson 引入。\n\n²⁶⁶ 包括本书的作者在内的许多研究人员强烈认为，报告统计数据时采用“拒绝主义”方法是遗憾的。报告实际显著性水平通常比仅仅说明“零假设在\
  \ 5% 水平下被拒绝”要好得多。\n\n²⁶⁷ 吉尼斯记录公司禁止 Gosset 以自己的名义发表论文。他使用笔名“Student”（学生）发表了他在 1908\
  \ 年的关于 t 分布的开创性论文《均值的可能误差》。因此，该分布通常被称为“Student 的 t 分布”。\n\n²⁶⁸ “排除合理怀疑”标准意味着社会认为，在刑事审判中，第一类错误（判定无辜者罪）比第二类错误（放释有罪者）更不应接受。在民事案件中，标准是“证据优势”，这表明社会认为这两种错误同样是不应接受的。\n\
