  \ is 87.5\n```\n\n面向对象编程的核心有两个重要的概念。第一个是**封装**（encapsulation）的概念。指的是我们将数据属性和操作这些属性的方法结合在一起。例如，如果我们写下：\n\
  \n```python\nRafael = MITPerson('Rafael Reif')\n```\n\n我们可以使用点符号法来访问如 `Rafael` 的姓名和识别码等属性。\n\
  \n第二个重要的概念是**信息隐藏**（information hiding）。这是模块化的关键要素之一。如果程序中使用类的部分（即类的客户端）仅依赖于类中方法的规范，那么实现类的程序员就可以自由地更改类的实现（例如为了提高效率），而无必担心这些更改会破坏使用该类的代码。\n\
  \n某些编程语言（例如 Java 和 C++）提供了强制信息隐藏的机制。程序员可以将类的属性设为 `private`，以便类的客户端只能通过对象的方法访问数据。Python\
  \ 3 使用命名约定来使属性在类外不可见。当属性名称以 `__` 开头且不以 `__` 结尾时，该属性在类外是不可见的。考虑图 8.7 中的类。\n\n![art](img/Art_P45.jpg)\n\
  \n**图 8.7 类中的信息隐藏**\n\n当我们运行代码时：\n\n```python\ntest = infoHiding()\nprint(test.visible)\n\
  print(test.__alsoVisible__)\nprint(test.__invisible)\n```\n\n它会打印：\n\n```\nLook\
  \ at me\nLook at me too\nError: 'infoHiding' object has no attribute '__invisible'\n\
  ```\n\n代码：\n\n```python\ntest = infoHiding()\ntest.printInvisible()\ntest.__printInvisible__()\n\
  test.__printInvisible()\n```\n\n打印：\n\n```\nDon't look at me directly\nDon't look\
  \ at me directly\nError: 'infoHiding' object has no attribute '__printInvisible'\n\
  ```\n\n以及代码：\n\n```python\nclass subClass(infoHiding):\n    def __init__(self):\n\
  \        print('from subclass', self.__invisible)\n\ntestSub = subClass()\n```\n\
  \n打印：\n\n```\nError: 'subClass' object has no attribute '_subClass__invisible'\n\
  ```\n\n注意，当子类尝试使用其父类的隐藏属性时，会发生 `AttributeError`。这使得在 Python 中使用信息隐藏变得有些繁琐。\n\n因为这很繁琐，许多\
  \ Python 程序员并不利用 `__` 机制来隐藏属性——正如我们在本书中没有的那样。因此，`Person` 的客户端可以写表达式 `Rafael.lastName`\
  \ 而不是 `Rafael.getLastName()`。\n\n这是不遗憾的，因为它允许客户端代码依赖于并不属于 `Person` 规范的内容，因此这些内容可能会发生变化。如果\
  \ `Person` 的实现发生了变化（例如，每次请求姓氏时都提取它，而不是存储在实例变量中），那么客户端代码将不再工作。\n\nPython 不仅允许程序从类定义外部读取实例变量和类变量，还允许程序写入这些变量。例如，代码\
  \ `Rafael.birthday = '8/21/50'` 是完全合法的。如果在计算稍后调用了 `Rafael.getAge`，会导致运行时类型错误。在类定义外部创建实例变量也是可能的。例如，如果赋值语句\n\
  \n```python\nme.age = Rafael.getIdNum()\n```\n\n在类定义之外发生，Python 不会报任何错误。\n\n虽然这种相对较弱的静态语义检查是\
  \ Python 的一个缺陷，但它并不是致命缺陷。一个严谨的程序员可以简单地遵循合理的规则：不要在定义数据属性的类之外直接访问它们，正如我们在本书中所做的那样。\n\
  \n### 8.3.1 生成器\n\n信息隐藏的一个感知风险是，防止客户端程序直接访问数据结构会导致效率上不可接受的损失。在数据抽象的早期，许多人担心引入函数/方法调用的代价。现代编译技术使这种担忧变得多余。一个更严重的问题是，客户端程序将被迫使用低效的算法。\n\
  \n考虑图 8.6 中 `gradeReport` 的实现。调用 `course.getStudents()` 会创建并返回一个大小为 `n` 的列表，其中 `n`\
  \ 是学生人数。对于单级的成绩单来说，这可能不是问题，但想象一下跟踪 170 万名参加 SAT 的高中生。在列表已经存在的情况下创建一个相同大小的新列表是极低效的。一种解决方案是放弃抽象并允许\
  \ `gradeReport` 直接访问实例变量 `course.students`，但这违反了信息隐藏。幸运的是，有一个更好的解决方案。\n\n图 8.8 中的代码将\
  \ `Grades` 类中的 `getStudents` 函数替换为了我们尚未使用的语句 `yield` 的函数。\n\n任何包含 `yield` 语句的函数定义都会以特殊方式处理。`yield`\
  \ 的存在告诉 Python 系统该函数是一个**生成器**（generator）。生成器通常与 `for` 语句配合使用，例如：\n\n```python\n\
  for s in course.getStudents():\n```\n\n在图 8.6 中。\n\n![art](img/Art_P46.jpg)\n\n\
  **图 8.8 getStudents 的新版本**\n\n在使用生成器的 for 循环第一次迭代开始时，生成器被调用并运行到第一次执行 `yield` 语句，此时它返回\
  \ `yield` 语句表达式的值。在下一次迭代中，生成器从 `yield` 语句之后继续执行，所有局部变量都绑定到执行 `yield` 语句时所指向的对象，并再次运行直到执行\
  \ yield 语句。它会持续这样做，直到没有代码可执行或执行 `return` 语句，此时循环退出。\n\n图 8.8 中的 `getStudents` 版本允许程序员使用\
  \ for 循环遍历 `Grades` 类型对象中的学生，就像他们可以使用 for 循环遍历内置类型（如 `list`）的元素一样。例如，代码：\n\n```python\n\
  book = Grades()\nbook.addStudent(Grad('Julie'))\nbook.addStudent(Grad('Charlie'))\n\
  ```\n\n\n\n\n\n```python\nfor s in book.getStudents():\n    print(s)\n```\n输出：\n\
  Julie\nCharlie\n\n因此，图 8.6 中以以下代码开始的循环\n\n```python\nfor s in course.getStudents():\n\
  ```\n\n不需要修改就可以利用 `Grades` 类的新版本包含了 `getStudents` 的新实现。（当然，大多数依赖于 `getStudents`\
  \ 返回列表的代码将无法运行。）同一个 `for` 循环可以遍历 `getStudents` 提供的值，无论 `getStudents` 返回的是一个值列表还是一次生成一个值。一次生成一个值会更有效，因为不需要创建一个包含学生的新列表。\n\
  \n## 8.4 抵押贷款：一个扩展示例 #toc.xhtml_Rh1-31\n\n美国住房价格的崩塌触发了 2008 年秋季严重的经济崩溃。导致这一的因素之一是许多房主承担了最终产生意想不到后果的抵押贷款。(⁹⁸)\n\
  \n最初，抵押贷款是相对简单的贷款。人们从银行借钱，并在贷款期限内（通常为十五到三十年）每月支付固定金额。在这一时期结束时，银行收回了初始贷款（本金）加利息，房主就拥有了完全归属于自己的房子。\n\
  \n在 20 世纪末，抵押贷款开始变得复杂得多。人们可以在获得抵押贷款时向贷款人支付“点数”（points），以获得更低的利率。一个点相当于贷款价值 1% 的现金支付。人们可以获得期限内“仅付息”的抵押贷款。也就是说，在贷款初期的几个月里，借款人仅支付应利息而不支付任何本金。其他贷款涉及多种利率。通常，初始利率（称为“优惠利率”）很低，然后随着时间的推移而增加。这些贷款中许多是浮动利率——初始期后支付的利率将取决于反映贷款人在批发信贷市场借贷成本的指数。(⁹⁹)\n\
  \n从原则上说，给消费者提供多种选择是件好事。然而，不择手段的贷款供应商并不总是仔细地完全解释各种选择可能带来的长期影响，一些借款人的选择证明导致了可怕的后果。\n\
  \n让我们编写一个程序来检查三类贷款的成本：\n\n*   不带点数的固定利率抵押贷款，\n*   带点数的固定利率抵押贷款，\n*   初始为优惠利率、随后剩余期限为较高利率的抵押贷款。\n\
  \n这项练习的目的是提供在增量开发一组相关类方面的经验，而不是让你成为抵押贷款专家。\n\n我们将结构化代码，包含一个 `Mortgage` 类，以及与上述三类抵押贷款相对应的子类。图\
  \ 8.9 包含了**抽象类** `Mortgage`。该类包含每个子类共享的方法，但它并不打算被直接实例化。也就是说，不会创建类型为 `Mortgage` 的对象。\n\
  \n顶部的 `findPayment` 函数计算了在贷款期限结束时还清贷款（包括利息）所需的每月固定支付金额。它使用一个已知的闭式表达式来实现这一点。这个表达式并不难推导，但直接查找它比现场推导要容易得多，而且更有可能是正确的。\n\
  \n记住，你在网络上（甚至在教科书中）发现的所有内容并不都是正确的。当你的代码包含一个你查到的公式时，请确保：\n\n*   该公式来自一个信誉良好的来源。我们查看了多个信誉良好的来源，它们都包含等效的公式。\n\
  *   你完全理解公式中所有变量的含义。\n*   使用来自良好来源的示例对你的实现进行测试。在实现此函数后，我们通过将结果与网络可用计算器的结果进行对比进行了测试。\n\
  \n观察 `__init__`，我们看到所有 `Mortgage` 实例都将具有对应初始贷款金额、每月利率、以月为单位的贷款期限、每月月初已支付的款项列表（该列表从\
  \ `0.0` 开始，因为第一个月开始时没有支付过）、每月月初未还贷款余额的列表、每月要支付的金额（使用 `findPayment` 函数返回的值初始化）以及抵押贷款的描述（初始值为\
