  \n\n\n\n在本章中，我们引入了优化问题的概念并给出了一些例子。我们还提供了一些解决这些问题的简单算法。在第 13 章中，我们将讨论解决一类重要优化问题的有效方法。\n\
  \n本章的主要要点包括：\n\n*   许多具有重要实际意义的问题可以用简单的方法表述，并自然地引导出计算解决方案。\n*   将一个看似新颖的问题转化为已知问题的实例，允许人们使用现有的解决方案。\n\
  *   背包问题和图论问题是其他问题经常可以约化的几类问题。\n*   穷举枚举算法提供了一种简单但通常在计算上是不可行的方法，来搜索最优解。\n*   贪心算法通常是寻找优化问题“相当不错的”但并不总是“最优的”解决方案的一种实用方法。\n\
  \n一如往常，我们将用几段 Python 代码和一些编程技巧来补充关于计算思维的材料。\n\n## 12.1 背包问题\n\n当一名一个小偷并不容易。除了显而易见的问题（确保家里没人、撬锁、避开报警器、处理伦理困境等），小偷还必须决定偷什么。问题在于，大多数家里拥有的价值物品超过了普通小偷能带走的重量。穷小偷该怎么办？他需要找到一组物品，在不超过其负重能力的情况下提供最大的价值。\n\
  \n假设例如，有一个背包^(¹⁴⁵) 最多能装 20 磅财物的小偷，他闯入一间房子，发现了图 12.1 中的物品。显然，他无法将所有物品放入背包，因此他需要决定拿什么，留下什么。\n\
  \n![art](img/Art_P78.jpg)\n\n**图 12.1 物品表**\n\n### 12.1.1 贪心算法\n\n找到此问题近似解的最简单方法是使用`greedy\
  \ algorithm`。小偷会首先选择最好的物品，然后是次优的，一直持续直到达到限制。当然，在这样做之前，小偷必须决定“最好”意味着什么。最好的物品是价值最高的、最轻的，还是价值重量比最高的物品？如果他选择价值最高的，他只会带走电脑，电脑可以卖掉\
  \ 200 美元。如果他选择重量最低的，他将依次带走书、花瓶、收音机和画——总价值 170 美元。最后，如果他决定最好意味着价值重量比最高，他将先拿花瓶和钟。这会留下三个价值重量比为\
  \ 10 的物品，但其中只有书还能放入背包。拿走书后，他会拿走剩余还能放得下的物品——收音机。他的财物总价值将是 255 美元。\n\n虽然按密度（价值重量比）贪心恰好在这个数据集上产生了最好的结果，但不能保证按密度贪心算法总是能比按重量或价值贪心算法找到更好的解决方案。更一般地说，不能保证通过贪心算法找到的此类背包问题的解决方案一定是最优的。我们将在稍后详细讨论这个问题。\n\
  \n接下来的三张图中的代码实现了这三种贪心算法。在图 12.2 中，我们定义了类 `Item`。每个 `Item` 都有名称、价值和重量属性。我们还定义了三个函数，这些函数可以绑定到我们贪心算法实现的参数\
  \ `keyFunction` 上，参见图 12.3。\n\n![art](img/Art_P79.jpg)\n\n**图 12.2 Item 类**\n\n\
  ![art](img/Art_P80.jpg)\n\n**图 12.3 贪心算法的实现**\n\n通过引入参数 `keyFunction`，我们使得贪心算法独立于列表元素被考虑的顺序。只需要\
  \ `keyFunction` 为 `items` 中的元素定义一个排序即可。然后我们使用该排序来生成一个包含与 `items` 相同元素的排序后的列表。我们使用\
  \ Python 内置函数 `sorted` 来实现这一点。（我们使用 `sorted` 而不是 `sort` 是因为我们想生成一个新列表，而不是修改传递给函数的列表。）我们使用\
  \ `reverse` 参数表示我们希望列表从大到小（相对于 `keyFunction`）进行排序。\n\n贪心算法的算法效率效率如何？有两点需要考虑：内置函数\
  \ `sorted` 的时间复杂度，以及 `greedy` 函数体中 `for` 循环执行的次数。循环的迭代次数受 `items` 中元素数量的限制，即 `O(n)`，其中\
  \ `n` 是 `items` 的长度。然而，Python 内置排序函数的的最坏情况时间大约为 `O(n log n)`，其中 `n` 是待排序列表的长度。因此，`greedy`\
  \ 的运行时间为 `O(n log n)`。\n\n图 12.4 中的代码构建了一个物品列表，然后使用不同的列表排序方法测试了 `greedy` 函数。\n\n\
  ![art](img/Art_P81.jpg)\n\n**图 12.4 使用贪心算法选择物品**\n\n当 `testGreedy()` 执行时，它打印出\n\n\
  ```\n按价值贪心填充 20 的背包\n物品总价值为 200\n<computer, 200>\n\n重量贪心填充 20 的背包\n物品总价值为 170\n\
  <book, 10>\n<vase, 50>\n<radio, 20>\n<painting, 90>\n\n按密度贪心填充 20 的背包\n物品总价值为 255\n\
  <vase, 50>\n<clock, 15>\n<book, 10>\n<radio, 20>\n```\n\n### 12.1.2 背包问题的最优解\n\n\
  假设我们认为近似是不够的，即我们想要问题的最优解。这种解被称为**最优解**，这并不意外，因为我们正在解决一个优化问题。事实上，面临小偷的问题是一个经典优化问题的实例，被称为**0/1\
  \ 背包问题**。0/1 背包问题可以形式化如下：\n\n*   每个物品由一对`<value, weight>` 表示。\n*   背包可以承受重量不超过 `w`。\n\
  *   长度为 `n` 的向量 `I` 表示物品集合。向量中的每个元素都是物品。\n*   长度为 `n` 的向量 `V` 用于指示每个物品是否被取出。如果 `V[i]\
  \ = 1`，则取出物品 `I[i]`。如果 `V[i] = 0`，则未取物品 `I[i]`。\n*   找到一个使以下公式值最大的 `V`：\n\n    ![art](img/Art_P82.jpg)\n\
  \n    受限于约束条件：\n\n    ![art](img/Art_P83.jpg)\n\n让我们看看如果用直接的方法来实现这种问题的公式会发生什么：\n\
  \n1. 枚举物品的所有可能组合。也就是说，生成集合的所有子集。这被称为幂集，在第 9 章中讨论过。\n2. 所有超过允许重量的组合。\n3. 从剩余组合中选择价值最大的一个。\n\
  \n这种方法确实找到最优答案。但是，如果原始物品集合很大，运行将需要长时间，因为正如我们在第 9.3.6 节](#chapter009.xhtml_h2-31)中看到的，子集的数量随物品数量的增长极快。\n\
  \n图 12.5 包含了解决 0/1 背包问题的这种直接实现。它使用了在图 12.2 和图 12.4 中定义的类和函数，以及在图 9.6 中定义的 `genPowerset`\
  \ 函数。\n\n\n\n\n\n# 图 12.5 0/1 背包问题的暴力破解最优解\n\n该实现的复杂度为 $O(n*2^n)$，其中 `n` 是物品的长度。函数\
  \ `genPowerset` 返回一个由 `Items` 列表组成的列表。该列表的长度为 $2^n$，其中最长的列表长度为 $n$。因此，`chooseBest`\
  \ 中的外层循环将执行 $O(2^n)$ 次，而内层循环的执行次数上限 $n$。\n\n可以应用许多小型优化来加速此程序的运行。例如，`genPowerset`\
  \ 可以采用如下头：\n\n```java\ndef genPowerset(items, constraint, getVal, getWeight)\n```\n\
  \n并且只返回符合重量限制的组合。或者，`chooseBest` 可以在超过重量限制时立即退出内层循环。虽然这类优化通常是值得的，但它们并没有解决根本问题。`chooseBest`\
  \ 的复杂度仍然是 $O(n*2^n)$，其中 `n` 是物品的长度，因此当 `items` 很大时，`chooseBest` 运行仍然需要很长的时间。\n\n\
  从理论上讲，这个问题是不可救的。0/1 背包问题在物品数量上本质上是指数级的。但从实践上讲，这个问题远非不可救，正如我们在第 13.2 节 中讨论的那样。\n\n\
  运行 `testBest` 时，它会打印\n\n```\nTotal value of items taken is 275.0\n<clock, 175, 10>\n\
  <painting, 90, 9>\n<book, 10, 1>\n```\n\n注意，这个解优于贪心算法找到的任何解。贪心算法的精髓是在每一步做出最优（由某些指标定义）局部选择。它做出的是`局部最优`的选择。然而，正如示例所示，一系列局部最优决策并不总是能导致`全局最优`的解。\n\
  \n尽管贪心算法并不总是能找到最优解，但它们在实践中经常使用。它们通常比保证找到最优解的算法更容易实现且运行效率更高。正如 Ivan Boesky 曾经所说：“我认为贪婪是健康的。你可以贪婪，而且仍然感觉良好。”^(¹⁴⁹)\n\
  \n背包问题有一个变体，称为`分数的`（或`连续的）`背包问题`，对于这种问题，贪心算法保证找到最优解。由于物品是无限分的，尽可能获取剩余价值与重量比最高的物品总是有意义的。例如，假设我们的小偷在房子里发现了三件有价值的东西：一袋金粉、一袋银粉和一袋葡萄干。在这种情况下，基于密度的贪心算法将始终找到最优解。\n\
  \n## 12.2 图优化问题](#toc.xhtml_Rh1-41)\n\n让我们考虑另一种类型的优化问题。假设你有一份美国各对城市之间所有航班的价格列表。同样假设对于所有城市\
  \ `A`、`B` 和 `C`，从 `A` 经 `B` 到 `C` 的飞行费用是从 `A` 到 `B` 的飞行费用加上 `B` 到 `C` 的飞行费用。你可能想问的问题包括：\n\
  \n*   某些对城市之间的最小停站次数是多少？\n*   某些对城市之间最便宜的机票是多少？\n*   某些对城市之间涉及停站次数不超过两站的最便宜机票是多少？\n\
  *   访问某些城市集合的最廉价的方法是什么？\n\n所有这些问题（以及许多其他问题）都可以很容易地形式化为图问题。\n\n`图`^(¹⁵⁰)是一组被称为`nodes`（节点或`vertices`）的对象，它们由一组`edges`（边或`arcs`）连接起来。如果边是单向的，则该图被称为`有向图`或`digraph`。在有向图中，如果从\
  \ `n1` 到 `n2` 有一条边，我们将 `n1` 称为`源`或`父节点`，将 `n2` 称为`目的地`或`子节点`。\n\n图通常用于表示各个部分之间存在有趣关系的情况。图在数学中的首次记录使用是在\
  \ 1735 年，当时瑞士数学家莱昂哈哈德·欧拉（Leonhard Euler）使用了后来广为人知的`图论`来公式化并解决了`柯尼斯堡七桥问题`。\n\n柯尼斯堡当时是东普鲁士省的首府，建立在两条河流的交汇处，这些河流包含了若干岛屿。岛屿通过七座桥相互连接并与大陆，如图\
  \ 12.6 左侧的地图所示。由于某种原因，城市的居民痴迷于是否可能一次恰好经过每座桥的步行。\n\n欧拉伟大的洞察是，通过将每个独立的陆地视为一个点（想象成“节点”），将每座桥视为连接这些点的点的线（想象成“边”），可以极大地简化问题。那么，该城镇的地图可以用图\
  \ 12.6 中地图右侧的图来表示。欧拉随后推论道，如果一次步行要遍历每条边，那么步行中的每个节点（即在步行期间既进入又出的岛屿）必须由偶数条边连接。由于这个图中没有任何节点具有偶数条边，欧拉得出结论：无法遍历每条边。\n\
  \n![art](img/Art_85.jpg)\n**图 12.6 柯尼斯堡的桥（左）和欧拉简化的地图（右）**\n\n比起柯尼斯堡桥问题，甚至是欧拉定理（他对柯尼斯堡桥问题的推广），更有意义的是利用图论来理解问题的整个思想。\n\
  \n例如，只需要对欧拉使用的图类型进行很小的扩展就可以模拟国家的公路系统。如果图（或有向图）中的每条边关联一个权重，则它被称为`加权图`。使用加权图，公路系统可以表示为图，其中城市由节点表示，连接它们的公路由边表示，每条边标记两个节点之间的距离。更一般地说，可以用`加权有向图`表示任何地图。\n\
  \n同样，世界性网的结构可以表示为有向图，其中节点是 Web 页面，只有当页面 `A` 上有页面 `B` 的链接时，才有从节点 `A` 到节点 `B` 的边。可以通过为每条边添加指示使用频率的权重来模拟流量模式。\n\
  \n还有许多不明显的用途。生物学家用图模拟蛋白质相互作用到基因表达网络。物理学家用图描述相变。流行病学家用图模拟疾病轨迹。以此类推。\n\n图 12.7 包含了对应节点、加权边和边的抽象类型的实现。\n\
  \n![art](img/Art_86.jpg)\n**图 12.7 节点和边**\n\n为节点设置一个类似乎是多此一举。毕竟，`Node` 类中没有任何方法执行了任何有趣的的计算。我们引入这个类仅仅是为了给我们提供一种灵活性，以便在以后某个时间点引入具有额外属性的\
  \ `Node` 子类。\n\n图 12.8 包含了 `Digraph` 和 `Graph` 类的实现。\n\n![art](img/Art_87.jpg)\n\
  **图 12.8 类 Graph 和 Digraph**\n\n\n\n\n\n一个重要的决策是选择用于表示 `Digraph` 的数据结构。一种常见的表示方法是\
  \ `n × n` **邻接矩阵**（adjacency matrix），其中 `n` 是图中节点的数量。矩阵的每个单元格包含关于连接节点对 `<i`, `j>`\
  \ 的边信息（例如权重）。如果边是无权的，则当仅当从 `i` 到 `j` 存在边时，该条目为 True。\n\n另一种常见的表示方法是**邻接列表**（adjacency\
  \ list），我们在这里使用了这种方法。`Digraph` 类有两个实例变量。`nodes` 变量是一个 Python 列表，包含了 `Digraph` 中所有节点的名称。节点之间的连通性使用通过字典实现的邻接列表表示。`edges`\
  \ 变量是一个字典，它将 `Digraph` 中的每个 `Node` 映射到该节点子节点的列表。\n\n`Graph` 类是 `Digraph` 的子类。它遗继承了\
  \ `Digraph` 的所有方法，但 `addEdge` 除外，该类重写了该方法。（这并不是实现 `Graph` 最节省空间的方法，因为在 `Digraph`\
  \ 中每条边都存储了两次，每个方向一次。但它具有简单性的优点。）\n\n你可能想停下来思考一下为什么 `Graph` 是 `Digraph` 的子类，而不是相反。在我们看过的许多子类示例中，子类都为父类添加了属性。例如，`WeightedEdge`\
  \ 类为 `Edge` 类添加了权重属性。\n\n在这里，`Digraph` 和 `Graph` 具有相同的属性。唯一的区别在于 `addEdge` 方法的实现。任何一个类都可以通过继承另一个的方法来轻松实现，但选择哪一个作为父类并不是随机的。在第\
  \ 8 章中，我们强调了遵守**替换原则**的重要性：如果客户端代码使用超类型的实例可以运行正常，那么当用子类型的实例替换超类型的实例时，它也应该正常运行。\n\
  \n事实上，如果客户端代码使用 `Digraph` 实例运行正常，那么当用 `Graph` 实例替换 `Digraph` 实例时，它也能正常工作。反则不然。有许多在图上运行（通过利用边的对称性）的算法在有向图中无法运行。\n\
  \n## 12.2.1 一些经典的图论问题 (#toc.xhtml_Rh2-40)\n\n使用图论来构建问题的一个优点是，有许多著名的算法可以解决图上的许多优化问题。一些最著名的图优化问题包括：\n\
  \n*   **最短路径**。对于某些节点对 `n1` 和 `n2`，找到最短的边序列 `<s[n]`, `d[n]>`（源节点和目标节点），使得：\n\n \
  \   *   第一条边的源节点是 `n1`\n    *   最后条边的目标节点是 `n2`\n    *   对于序列中的所有边 `e1` 和 `e2`，如果\
  \ `e2` 在序列中紧随 `e1`，则 `e2` 的源节点是 `e1` 的目标节点。\n\n*   **最短加权路径**。这类似于最短路径，区别在于不是选择连接两个节点的最短边序列，而是对序列中边的权重定义某些函数（例如它们的和）并最小化该值。这就是\
  \ Google Maps 在被计算两点之间行驶路线时所解决的问题类型。\n\n*   **最大团**。`clique`（团）是一个节点集合，其中集合中的每对节点之间都有一条边。(¹⁵¹)\
  \ 最大团是图中规模最大的团。\n\n*   **最小切**。给定图中的两个节点集合，`cut`（切）是一组边，移除这些边会消除从一个集合中的节点到另一个集合中每个节点的所有路径。最小切是移除后实现此目的的最小边集。\n\
  \n## 12.2.2 最短路径：深度优先搜索与广度优先搜索 (#toc.xhtml_Rh2-41)\n\n社交网络由个人以及个人之间的关系组成。这些通常被建模为图，个人是节点，边是关系。如果关系是对称的，则边是无向的；如果关系是非对称的，则边是有向的。某些社交网络模拟了多种关系，在这种情况下，边上的标签表示关系的类型。\n\
  \n1990 年，剧作家约翰·圭尔（John Guare）写了《六度分离》（*Six Degrees of Separation*）。该剧一个模糊的假设是“这个星球上的每个人只隔着六个人”。他的意思是，如果使用“认识”关系建立一个包含地球上每个人的社交网络，那么任何两个个人之间的最短路径最多将通过六个节点。\n\
  \n一个不那么假设的问题是 Facebook 上人与人之间使用“朋友”关系的距离。例如，你可能会好奇你是否有一个朋友，那个朋友有一个朋友，那个朋友又是米克·杰格（Mick\
  \ Jagger）的朋友。让我们思考设计一个程序来回答此类问题。\n\n朋友关系（至少在 Facebook 上）是对称的，例如，如果 Stephanie 是 Andrea\
  \ 的朋友，那么 Andrea 就是 Stephanie 的朋友。因此，我们将使用类型 `Graph` 实现社交网络。然后我们可以把寻找你与米克·杰格之间最短连接的问题定义为：\n\
  \n*   令 `G` 为表示朋友关系的图。\n*   对于 `G`，找到最短的节点序列 `[You,…Mick Jagger]`，使得：\n*   如果 `n[i]`\
  \ 和 `n[i+1]` 是路径中的连续节点，则 `G` 中有一条边连接 `n[i]` 和 `n[i+1]`。\n\n图 12.9 包含一个递归函数，用于寻找\
  \ `Digraph` 中两个节点（起始和结束）之间的最短路径。由于 `Graph` 是 `Digraph` 的子类，它将适用于我们的 Facebook 问题。\n\
  \n![art](img/Art_P88.jpg)\n\n**图 12.9 深度优先搜索最短路径算法**\n\n由 DFS 实现的算法是递归 `深度优先搜索 (DFS)`\
  \ 算法的一个示例。通常，深度优先搜索算法首先选择起始节点的一个孩子。然后选择该节点的一个孩子，依此类推，越深入深，直到到达目标节点或没有孩子的节点。搜索随后会`回溯`（backtracks），返回最近的具有尚未访问过的孩子的节点。当所有路径都已遍历后，它会选择从起点到终点的最短路径（假设存在）。\n\
  \n代码比我们刚刚描述的算法稍微复杂，因为它必须处理图可能包含循环的情况。它还避免探索比已找到的最短路径长的路径。\n\n*   `shortestPath`\
  \ 函数调用 `DFS` 并设置 `path == []`（表示当前正在探索的路径为空）且 `shortest == None`（表示尚未找到从起点到终点的路径）。\n\
  \    *   `DFS 开始于选择起始节点的一个孩子。然后选择该节点的一个孩子，依此类推，直到到达节点 end 或一个没有未访问孩子的节点。`\n    *\
  \   `node not in path` 检查防止程序陷入循环。\n    *   `shortest == None or len(path) < len(shortest)`\
  \ 检查用于判断继续搜索这条路径是否可能产生比目前发现的最优更短的路径。\n    *   如果是，则递归调用 `DFS`。如果找到了一条比目前发现的最优更短的到达终点的路径，则更新\
  \ `shortest`。\n    *   当 `path` 上的最后一个节点没有剩余可访问的孩子时，程序回溯到之前访问的节点，并访问该节点的下一个孩子。\n\
  *   当从起点到终点可能的最短路径都已遍历完毕后，函数返回。\n\n\n\n\n\n图 12.10 包含一些代码，用于运行图 12.9 中的代码。图 12.10\
  \ 中的函数 `testSP` 首先构建一个类似于图中所示的有向图，然后搜索节点 0 和节点 5 之间的最短路径。\n\n执行 `testSP` 时，会产生输出：\n\
  \n```\nCurrent DFS path: 0\nCurrent DFS path: 0->1\nCurrent DFS path: 0->1->2\n\
  Current DFS path: 0->1->2->3\nCurrent DFS path: 0->1->2->3->4\nCurrent DFS path:\
  \ 0->1->2->3->5\nCurrent DFS path: 0->1->2->4\nCurrent DFS path: 0->2\nCurrent DFS\
  \ path: 0->2->3\nCurrent DFS path: 0->2->3->4\nCurrent DFS path: 0->2->3->5\nCurrent\
  \ DFS path: 0->2->3->1\nCurrent DFS path: 0->2->4\nShortest path is 0->2->3->5\n\
  ```\n\n![art](img/Art_P89.jpg)\n\n**图 12.10 测试深度优先搜索代码**\n\n注意，在探索完路径 0->1->2->3->4\
  \ 后，它会回溯到节点 3 并探索路径 0->1->2->3->5。在将该保存为目前为止的最短成功路径后，它回溯到节点 2 并探索路径 0->1->2->4。当到达该路径的末尾（节点\
  \ 4）时，它会一直回溯到节点 0，并调查从 0 到 2 的边开始的路径。依此类推。\n\n图 12.9 中实现的 DFS 算法寻找边数最少的路径。如果边有权重，它不一定能找到边权重之和最小的路径。然而，很容易修改来实现这一点。\n\
  \n当然，遍历图的方法不仅有深度优先。另一种常见方法是**广度优先搜索 (BFS)**。在广度优先遍历中，首先访问起始节点的所有子节点。如果这些节点中没有目标节点，则访问每个节点的每个子节点。依此类推。与通常递归实现的深度优先搜索不同，广度优先搜索通常通过迭代实现。BFS\
  \ 同时探索多条路径，每次迭代都会为每条路径添加一个节点。由于它是按长度升序生成路径的，因此找到的以目标节点为最后一个节点的路径保证具有最少边数。\n\n图 12.11\
  \ 包含使用广度优先搜索在有向图中寻找最短路径的代码。变量 `pathQueue` 用于存储所有当前正在探索的路径。每次迭代开始时从 `pathQueue` 中移除一条路径并将该路径赋值给\
  \ `tmpPath`。如果 `tmpPath` 的最后一个节点是 `end`，则 `tmpPath` 是最短路径并返回。否则，将创建一个新路径集合，每条路径都通过添加其一个子节点来扩展\
  \ `tmpPath`。然后将这些新路径中的每一条添加到 `pathQueue` 中。\n\n![art](img/Art_P90.jpg)\n\n**图 12.11\
  \ 广度优先搜索最短路径算法**\n\n当将以下行\n\n```\nsp = BFS(g, nodes[0], nodes[5])\nprint('Shortest\
  \ path found by BFS:', printPath(sp))\n```\n\n添加到 `testSP` 的末尾并执行该函数时，它会打印：\n\n\
  ```\nCurrent DFS path: 0\nCurrent DFS path: 0->1\nCurrent DFS path: 0->1->2\nCurrent\
  \ DFS path: 0->1->2->3\nCurrent DFS path: 0->1->2->3->4\nCurrent DFS path: 0->1->2->3->5\n\
  Current DFS path: 0->1->2->4\nCurrent DFS path: 0->2\nCurrent DFS path: 0->2->3\n\
  Current DFS path: 0->2->3->4\nCurrent DFS path: 0->2->3->5\nCurrent DFS path: 0->2->3->1\n\
  Current DFS path: 0->2->4\nShortest path found by DFS: 0->2->3->5\nCurrent BFS path:\
  \ 0\nCurrent BFS path: 0->1\nCurrent BFS path: 0->2\nCurrent BFS path: 0->1->2\n\
  Current BFS path: 0->2->3\nCurrent BFS path: 0->2->4\nCurrent BFS path: 0->1->2->3\n\
  Current BFS path: 0->1->2->3\nShortest path found by BFS: 0->2->3->5\n\n\n\n虽然这种递归的实现显然是正确的，但它的效率极其低下。例如，尝试运行\
  \ `fib(120)`，但不要等它运行完成。该实现的复杂度稍难推导，但大致是 `O(fib(n))`。也就是说，它的增长速度与结果值的增长速度成正比，而斐波那契数列的增长率是非常巨大的。例如，`fib(120)`\
  \ 是 8,670,007,398,507,948,658,051,921。如果每个递归调用需要一纳秒，`fib(120)` 将大约 250,000 年才能完成。\n\
  \n### 递归斐波那契数列的效率\n\n#### 13.1 为什么递归实现这么慢？\n\n让我们尝试找出为什么这个实现需要如此长的时间。考虑到 `fib` 函数体内的代码非常少，很显然问题出在\
  \ `fib` 调用自身的次数上。例如，查看与调用 `fib(6)` 相关的调用树。\n\n![art](img/Art_P91.jpg)\n\n图 13.1\
  \ 递归斐波那契的调用树\n\n注意，我们正在反复计算相同的值。例如，`fib` 被带有参数 `3` 调用了三次，而其中每一次调用都会触发四次额外的 `fib`\
  \ 调用。不需要天才就能想到，记录第一次调用的返回值，然后在需要时进行查找而不是每次都计算，这可能是一个好主意。这被称为**记忆化（memoization）**，是动态规划背的核心思想。\n\
  \n图 13.2 包含一个基于此想法的斐波那契实现。函数 `fastFib` 有一个参数 `memo`，它用它跟踪已经评估过的数字。该参数有一个默认值（空字典），这样\
  \ `fastFib` 的调用者就不需要为 `memo` 提供初始值。当在 `n > 1` 的情况下调用 `fastFib` 时，它会尝试在 `memo` 中查找\
  \ `n`。如果不在那里（因为这是第一次用该值调用 `fastFib`），则会抛出一个异常。当发生这种情况时，`fastFib` 使用标准的斐波那契递归公式，然后将结果存储在\
  \ `memo` 中。\n\n![art](img/Art_P92.jpg)\n\n图 13.2 使用记忆化实现斐波那契\n\n如果你尝试运行 `fastFib`，你会发现它非常快：`fib(120)`\
  \ 几乎瞬间返回。`fastFib` 的复杂度是多少？它对从 `0` 到 `n` 的每个值恰好调用一次 `fib`。因此，在假设字典查找可以在常数时间内完成的情况下，`fastFib(n)`\
  \ 的时间复杂度为 `O(n)`。\n\n#### 13.2 动态规划与 0/1 背包问题](#toc.xhtml_Rh1-43)\n\n我们在第 12 章中看过的优化问题之一是\
  \ 0/1 背包问题。回想我们看了一个运行时间为 `n log n` 的贪心算法，但它不能保证找到最优解。我们还看了一个保证能找到最优解的暴力算法，但它的运行时间是指数。最后，我们讨论了该问题在输入规模上本质上是指数级的。在最坏的情况下，如果不查看所有可能的答案，就无法找到最优解。\n\
  \n幸运的是，情况并没有看起来那么糟糕。动态规划为在合理时间内解决大多数 0/1 背包问题提供了一种实用的方法。在推导此类解决方案的第一步，我们从一个基于穷举枚举的指数解开始。核心思想是通过构建一个根二叉树来列举所有满足重量限制的状态，从而探索可能解的空间。\n\
  \n**根二叉树**是一种无环有向图，其中：\n\n* 恰好有一个没有父节点的节点。这被称为**根**。\n* 每个非根节点恰好有一个父节点。\n* 每个节点最多有两个孩子。没有种子的节点被称为**叶子节点**。\n\
  \n0/1 背包问题搜索树中的每个节点都由一个四元组标记，该四元组表示背包问题的部分解。四元组的元素是：\n\n* 一个待取的物品集合，\n* 尚未决定的物品列表，\n\
  * 所取物品集合中物品的总值（这仅仅是一种优化，因为值可以从集合计算出来），以及\n* 背包中剩余的空间。（同样，这是一种优化，因为它仅仅是允许重量与目前已取物品总重量之差。）\n\
  \n树从根开始自顶向下构建。从待考虑的物品中选择一个元素。如果背包中有空间装下该物品，则构建一个反映选择选取该物品后果的节点。按照惯例，我们将该节点画为左孩子。右孩子显示选择不取该物品的后果。然后递归应用该过程，直到背包满或没有更多物品可以考虑。由于每条边都代表一个决策（取或不取物品），此类树被称为**决策树**。\n\
  \n图 13.3 是一个描述物品集合的表格。\n\n![art](img/Art_P93.jpg)\n\n图 13.3 物品值表\n\n图 13.4 是一个决定取哪些物品的决策树，假设最大重量为\
  \ 5。树的根（节点 0）标记为 `<{}, [a,b,c,d], 0, 5>`，表示没有取任何物品，所有待考虑，值为 0，可用 5 磅。节点 1 表示已取物品\
  \ `a`，剩余 `[b,c,d]` 待考虑，值为 6，可用 2 磅。由于物品 `b` 重 3 磅，节点 1 没有左孩子。\n\n![art](img/Art_P94.jpg)\n\
  \n图 13.4 背包问题的决策树\n\n在图 13.4 中，每个节点冒号前的数字表示可以生成节点的顺序。这种特定的排序被称为左优先深度。在每个节点处，我们尝试生成左节点。如果不可能，我们尝试生成右节点。如果这也不可能，我们就回溯一个节点（回到父节点）并重复该过程。最终我们发现生成了根的所有节点，过程停止。当过程停止时，所有可以放入背包的物品组合都被生成了，最大的叶子节点代表最优解。注意，对于每个叶子节点，要么第二个元素为空列表（表示没有更多待考虑的物品），要么第四个元素为\
  \ 0（表示没有剩余空间）。\n\n意料之中（特别是如果你读过第 12 章），深度优先树搜索的自然实现是递归的。图 13.5 包含了这样一个实现。\n\n![art](img/Art_P95.jpg)\n\
  \n图 13.5 使用决策树解决背包问题\n\n该实现使用了图 12.2 中的 `Item` 类。`maxVal` 函数返回两个值，所选物品集合以及这些物品的总值。它带有两个参数调用，对应树节点标签的第二个和第四个元素：\n\
  \n* `toConsider`。树上方节点（对应递归调用栈中的较早调用）尚未考虑的物品。\n* `avail`。剩余空间。\n\n注意 `maxVal` 的实现并没有构建决策树然后寻找最优节点。相反，它使用局部变量\
  \ `result` 来记录目前发现的最优解。图 13.6 中的代码可以用于测试 `maxVal`。\n\n\n\n\n\n当运行 `smallTest`（它使用了图\
  \ 13.3 中的值）时，它会打印一个结果，指示图 13.4 中的节点 8 是最优解：\n\n```\n<c, 8, 2>\n<b, 7, 3>\nTotal\
  \ value of items taken = 15\n```\n\n![art](img/Art_P96.jpg)\n\n**图 13.6 测试基于树的实现**\n\
  \n函数 `buildManyItems` 和 `bigTest` 可用于随机生成的物品集上测试 `maxVal`。尝试 `bigTest(10)`。现在尝试\
  \ `bigTest(40)`。当你等烦了它不返回结果时，停止计算并问问自己发生了什么。\n\n让我们考虑一下我们正在探索的树的大小。由于在树的每一层中，我们都要决定保留或不保留一个物品，因此树的最大深度为\
  \ `len(items)`。在第 0 层我们只有一个节点，在第 1 层最多有两个节点，在第 2 层最多有四个节点，在第 3 层最多有八个节点。在第 39 层我们最多有\
  \ `2³⁹` 个节点。难怪运行需要很长时间！\n\n我们该如何处理？让我们先问问这个程序与我们的第一个斐波那契数列实现之间有什么共同点。特别是，是否存在最优子结构，以及是否存在重叠的子问题？\n\
  \n最优子结构在图 13.4 和图 13.5 中都是可见的。每个父节点结合其子节点达到的解决方案，推导出以该父节点为根的子树的最优解。这在图 13.5 中 `#Choose\
  \ better branch` 注释后的代码得到了体现。\n\n是否存在重叠的子问题？乍一看，答案似乎是“否”。在树的每一层中，我们有一组不同的可供物品需要考虑。这意味着如果存在共同的子问题，它们必须在树的同一层。事实上，在树的每一层中，每个节点都有相同的物品集待考虑选取。然而，通过观察图\
  \ 13.4 中的标签，我们可以看到每一层的每个节点代表了对树中更高处所考虑的物品的不同选择。\n\n思考一下每个节点正在解决什么问题。要解决的问题是在给定剩余可用重量的情况下，从待考虑的物品中找到最优选取物品。可用重量取决于所取物品的总重量，但不取决于选取了哪些物品或所取物品的总价值。因此，例如在图\
  \ 13.4 中，节点 2 和 7 实际上在解决同一个问题：在可用重量为 2 的情况下，决定应该选取 `[c,d]` 中的哪些元素。\n\n图 13.7 中的代码利用最优子结构和重叠子问题，为\
  \ 0/1 背包问题提供了动态规划解。增加了一个额外参数 `memo` 来跟踪已经解决的子问题的解决方案。它是使用一个字典实现的，其键由 `toConsider`\
  \ 的长度和可用重量构造。表达式 `len(toConsider)` 是表示仍待考虑物品的紧凑方式。这之所以有效，是因为物品总是从 `toConsider` 列表的同一端（头部）移除。\n\
  \n图 13.8 显示了我们在各种规模的问题上运行代码时产生的调用次数。这种增长很难量化，但显然远小于指数级。^(¹⁶³) 但这怎么可能是可能的呢，因为我们知道\
  \ 0/1 背包问题在物品数量上本质上是指数级的？我们找到找到推翻宇宙基本法则的方法了吗？没有，但我们发现计算复杂度可以是一个微妙的概念.^(¹⁶⁴)\n\n\
  `fastMaxVal` 的运行时间取决于生成的不同元组 `<toConsider, avail>` 的数量。这是因为关于下一步做什么的决定仅取决于剩余可用的物品和已取物品的总重量。\n\
  \n![art](img/Art_P97.jpg)\n\n**图 13.7 背包问题的动态规划解**\n\n![art](img/Art_P98.jpg)\n\n\
  **图 13.8 动态规划解的性能**\n\n`toConsider` 的可能值数量限于 `len(items)`。`avail` 的可能值数量更难刻画。它的上限是背包能够容纳的物品不同总重量的最大数量。如果背包最多能容纳\
  \ `n` 个物品（基于背包容量和可用物品的重量），`avail` 最多可以取 `2^n` 个不同的值。原则上，这可能是一个很大的数字。但在实践中，它通常并不大。即使背包容量很大，如果物品的重量是从一个较小的可能重量集中选择的，许多物品组合将具有相同的重量，从而大大缩短了运行时间。\n\
  \n该算法属于一类被称为**伪多项式**（pseudo-polynomial）的复杂度。对这一概念的详细解释超本书的范围。简单来说，`fastMaxVal` 对于表示\
  \ `avail` 可能值所需的位数是指数级的。\n\n为了看看当 `avail` 的值从一个更大的空间中选择时会发生什么，将图 13.6 中 `bigTest`\
  \ 函数对 `maxVal` 的调用改为：\n\n```\nval, taken = fastMaxVal(items, 1000)\n```\n\n当物品数量为\
  \ 256 时，现在找到解决方案需要 1,802,817 次 `fastMaxVal` 调用。\n\n为了看看当重量从一个巨大的空间中选择时会发生什么，我们可以从正实数而不是正整数中可能的重量。为了做到这一点，将\
  \ `buildManyItems` 中的行：\n\n```python\nitems.append(Item(str(i),\nrandom.randint(1,\
  \ maxVal),\nrandom.randint(1, maxWeight)))\n```\n\n替换为：\n\n```python\nitems.append(Item(str(i),\n\
  random.randint(1, maxVal),\nrandom.randint(1, maxWeight)*random.random()))\n```\n\
  \n每次调用时，`random.random()` 都会返回一个 0 到 1 之间的浮点数，因此从所有意义上说，重量是无限。不要等这个测试结束。动态规划在通常意义上可能是一种奇迹的技术，^(¹⁶⁵)\
  \ 但它无法执行宗教意义上的奇迹。\n\n### 动态规划与分治法\n\n与分治算法一样，动态规划基于解决独立的子问题并结合这些解决方案。然而，它们存在一些重要的区别。\n\
  \n分治算法基于寻找比原始问题小得多的子问题。例如，合并排序通过每一步将问题规模减半来工作。相比之下，动态规划涉及只比原始问题小一点的问题。例如，计算第 19\
  \ 个斐波那契数相对于计算第 20 个并不是一个小得多的问题。\n\n另一个重要的区别是，分治算法的效率并不依赖于将算法结构化以以便重复解决相同的问题。相比之下，动态规划只有在不同子问题的数量显著小于子问题的总数时才是有效的。\n\
  \n____________\n\n¹⁶⁶ 引自 Stuart Dreyfus “Richard Bellman on the Birth of Dynamic\
  \ Programming,” *Operations Research*, vol. 50, no. 1 (2002).\n\n¹⁶⁷ 虽然这种方法很可爱且教学上很有趣，但并不是实现斐波那契数列的最佳方法。有一个简单的线性时间迭代实现。\n\
  \n\n\n\n将树的根放在顶部似乎很奇怪，但那是数学家和计算机科学家通常画绘树形的方式。也许这证明那些家伙没有花足够的时间来思考自然。\n\n决策树不需要是二叉的，它们提供了一种结构化的方法，来探索做出一系列顺序决策的结果。它们被广泛应用于许多领域。\n\
  \n由于 `2¹²⁸ = 340,282,366,920,938,463,463,374,607,431,768,211,456`\n\n好吧，“发现”这个词可能太重了。人们早就知道这一点了。你可能在第\
  \ 9 章左右就想到了。\n\n非同凡且带来了令人欢迎的结果。\n\n# 14 随机游走及更多关于数据可视化的内容\n\n这本书关于如何利用计算来解决问题。到目前为止，我们关注的是可以通过`确定性程序`解决的问题。如果一个程序每当在相同的输入上运行时都能产生相同的输出，那么这个程序就是确定性的。这类计算非常有用，但显然不足以对某些类型的问题。我们所生活的世界的许多方面只有作为`随机过程`才能被精确建模。如果一个过程的下一个状态可以取决于某些随机元素，那么这个过程就是随机的。随机过程的结果通常是不确定的。因此，我们很难对它们将做什么做出确定性的判断。相反，我们对它们可能做什么做出概率性的判断。本书的其余部分涉及构建有助于理解不确定状况的程序。这些许多程序将是模拟模型。\n\
  \n模拟模仿真实系统的活动。例如，图 8.11 中的代码模拟了一个人支付一系列抵押贷款。将该代码看作一个实验设备，称为`模拟模型`，它提供了关于被建模系统可能行为的有用信息。此外，模拟被广泛用于预测物理系统的未来状态（例如\
  \ 50 年后的地球温度），并替代那些成本太高、太耗时或危险而无法进行的物理实验（例如税法变更的影响）。\n\n必须记住，模拟模型和所有模型一样，只是对现实的近似。人们永远无法确定实际系统会按照模型预测的方式运行。事实上，人们通常可以很有把握，实际系统的行为不会与模型的预测完全一致。例如，并不是每个借款人都会按时支付所有抵押贷款。有一句常被引用的格言：“所有模型都是错的，但某些是有用的。”\n\
  \n## 14.1 随机游走\n\n1827 年，苏格兰植物学家罗伯特·布朗观察到悬浮在水中的花粉似乎在随机漂浮。他对后来被称为布朗运动的现象没有合理的解释，也没有尝试对其进行数学建模。该现象的第一个清晰的数学模型于\
  \ 1900 年出现在路易·巴席利尔的博士论文《投机理论》（*The Theory of Speculation*）中。然而，由于这篇论文涉及当时声誉不佳的金融市场理解问题，受到了正直学术界的很大忽视。五年后，年轻的阿尔伯特·爱因斯坦带着一个几乎与巴席利尔相同的数学模型以及关于如何使用它来确认原子存在的描述，将这种随机思维引入了物理学。出于某种原因，人们似乎认为理解物理比赚钱更重要，世界开始关注它。时代确实不同了。\n\
  \n布朗运动是`随机游走`的一个例子。随机游走被广泛用于物理过程（例如扩散）、生物过程（例如 DNA 从异源双链中移位 RNA 的动力学）和社会过程（例如股市波动）。\n\
  \n在本章中，我们研究随机游走出于三个原因：\n\n* 随机游走本质上是有趣且被广泛使用的。\n* 它为我们提供了一个如何使用抽象数据类型和继承来构建通用程序（特别是模拟模型）的良好示例。\n\
  * 它提供了一个介绍更多 Python 特性的机会，并演示了一些生成额外的额外技巧。\n\n## 14.2 醉汉之走\n\n让我们来看一个实际上涉及走的随机游走。一个醉酒的农民站在田地中央，每秒农民都会向随机方向迈一步。在\
  \ 1000 秒后，她（或他）距离原点的预期距离是多少？如果她走了很多步，她是可能离原点越来越远，还是更有可能反复回到原点，最终停在离起点不远的地方？让我们写一个模拟来找出答案。\n\
  \n在开始设计程序之前，尝试对程序意图建模的状况建立一些直觉总是好主意。让我们从用笛卡尔坐标系勾勒该状况的简单模型开始。假设农民站在一片田里，那里的草神秘地被修剪得像一张网格纸。进一步假设农民走的每一步长度都是一，且平行于`x-axis`或`y-axis`。\n\
  \n```\n![art](img/Art_P99.jpg)\n```\n\n**图 14.1 一个不寻常的农民**\n\n图 14.1 左侧的图片描述了一个站在田地中央农民。笑脸表示农民在走一步后可能所在的所有地方。注意，走一步之后，她距离起始点恰好是一个单位。让我们假设她第一步是从初始位置向东走。在走第二步之后，她距离初始位置可能有多远？\n\
  \n看看右图图中的笑脸，我们看到有 0.25 的概率她距离 0 个单位，有 0.25 的概率距离 2 个单位，有 0.5 的概率距离![art](img/Art_P100.jpg)单位。因此，平均而言，走两步后比走一步后更远。第三步呢？如果第二步是在上方或下方的笑脸，第三步有一半概率让农民靠近原点，另一半概率远离。如果第二步是左侧的笑脸（原点），第三步将远离原点。如果第二步是右侧的笑脸，第三步有四分之一的概率靠近原点，四之三的概率远离。\n\
  \n似乎醉汉走的步数越多，距离原点的预期距离就越大。我们可以继续对所有可能性进行穷举，或许对这种距离如何随步数增加而增长建立很好的直觉。然而，这正变得相当乏味，所以写一个程序为我们完成似乎是更好的主意。\n\
  \n让我们从思考可能用于构建此模拟以及可能的其他类型随机游走的有用数据抽象开始设计过程。一如既常，我们应该尝试发明与我们试图建模的状况中出现的物体对应的类型。三个明显的类型是`Location`、`Field`和`Drunk`。当我们观察提供这些类型的类时，思考它们可能对我们允许构建的模拟模型意味着什么是有价值的。\n\
  \n\n\n\n# Location\n\n让我们从 `Location` 开始，图 14.2。这是一个简单的类，但它确实包含了两个重要的决策。它告诉我们模拟最多涉及两个维度。例如，模拟将不会模拟高度的变化。这与上面的图片是一致的。此外，由于为\
  \ `deltaX` 和 `deltaY` 提供的值可能是浮点数而非整数，因此该类没有对醉汉移动的方向集做出内置假设。这是对非正式模型的泛化，在该模型中，每一步的长度均为一，且平行于\
  \ x 轴或 y 轴。\n\n## Class Field\n\n`Field`，图 14.2 也很简单，但它也包含了显著的决策。它简单地维护了醉汉到位置的映射。它对位置没有任何限制，因此假设\
  \ `Field` 的大小是无界的。它允许将多个醉汉以随机位置添加到 `Field` 中。它对醉汉移动的模式一律未津，也不禁止多个醉汉占据同一个位置或穿过被其他醉汉占据的空间。\n\
  \n![art](img/Art_P101.jpg)\n\n**图 14.2 Location 和 Field 类**\n\n## Drunk and UsualDrunk\
  \ Classes\n\n图 14.3 中的 `Drunk` 和 `UsualDrunk` 类定义了醉汉在场中徘徊的方式。特别是 `UsualDrunk` 中\
  \ `stepChoices` 的值引入了限制：每一步的长度均为一，且平行于 x 轴或 y 轴。由于 `random.choice` 函数返回其接收的序列中随机选择的成员，因此每种步的概率相相等，且不受之前步骤的影响。稍后，我们将查看具有不同行为的\
  \ `Drunk` 子类。\n\n![art](img/Art_P102.jpg)\n\n**图 14.3 定义醉汉的类**\n\n# Simulation Logic\n\
  \n下一步是使用这些类来构建一个回答原始问题的模拟。图 14.4 包含了在此模拟中使用的三个函数。\n\n`walk` 函数模拟一次步数为 `numSteps`\
  \ 的行走。`simWalks` 函数调用 `walk` 来模拟 `numTrials` 次每次步数为 `numSteps` 的行走。`drunkTest` 函数调用\
  \ `simWalks` 来模拟不同长度的行走。\n\n`simWalks` 的参数 `dClass` 类型为 `class`，在代码的第一行中用于创建相应子类的\
  \ `Drunk`。随后，当从 `Field.moveDrunk` 调用 `drunk.takeStep` 时，将自动选择相应子类的方法。\n\n`drunkTest`\
  \ 函数也有一个类型为 `class` 的参数 `dClass`。它被使用了两次，一次在对 `simWalks` 的调用中，另一次在第一个打印语句中。在打印语句中，使用了内置类属性\
  \ `__name__` 来获取带有类名的字符串。\n\n![art](img/Art_P103.jpg)\n\n**图 14.4 醉汉漫步（带有一个 Bug）**\n\
  \n当我们执行 `drunkTest((10, 100, 1000, 10000), 100, UsualDrunk)` 时，它输出了\n\n```\nUsualDrunk\
  \ random walk of 10 steps\nMean = 8.634\nMax = 21.6 Min = 1.4\n\nUsualDrunk random\
  \ walk of 100 steps\nMean = 8.57\nMax = 22.0 Min = 0.0\n\nUsualDrunk random walk\
  \ of 1000 steps\nMean = 9.206\nMax = 21.6 Min = 1.4\n\nUsualDrunk random walk of\
  \ 10000 steps\nMean = 8.727\nMax = 23.5 Min = 1.4\n```\n\n考虑到我们之前建立的直觉——平均距离应该随着步数的增加而增长，这令人惊讶。这可能意味着我们的直觉是错误的，也可能意味着我们的模拟有\
  \ Bug，或者两者兼有。\n\n此时要做的第一件事是在我们已经知道答案的值上运行模拟，并确保模拟产生的结果与预期结果匹配。让我们尝试零步行走（其距离原点的平均距离、最小和最大距离都应为\
  \ 0）和一步行走（其距离原点的平均距离、最小和最大距离都应为 1）。\n\n当我们运行 `drunkTest((0,1), 100, UsualDrunk)`\
  \ 时，我们得到了非常可疑的结果\n\n```\nUsualDrunk random walk of 0 steps\nMean = 8.634\nMax =\
  \ 21.6 Min = 1.4\n\nUsualDrunk random walk of 1 steps\nMean = 8.57\nMax = 22.0 Min\
  \ = 0.0\n```\n\n零步行走的平均距离怎么可能超过 8？我们的模拟中至少有一个 Bug。经过一些调查，问题一目了然了。在 `simWalks` 中，函数调用\
  \ `walk(f, Homer, numTrials)` 应该是 `walk(f, Homer, numSteps)`。\n\n这里的教训是：在查看模拟结果时，始终对结果保持怀疑。在我们已经预期答案的值上运行模拟\n\
  \n# Corrected Results\n\n当我们在已经有预期结果的值上运行模拟时，它得到了预期的：\n\n```\nUsualDrunk random\
  \ walk of 0 steps\nMean = 0.0\nMax = 0.0 Min = 0.0\n\nUsualDrunk random walk of\
  \ 1 steps\nMean = 1.0\nMax = 1.0 Min = 1.0\n\nUsualDrunk random walk of 10 steps\n\
  Mean = 2.8\nMax = 7.2 Min = 0.0\n\nUsualDrunk random walk of 100 steps\nMean = 8.2\n\
  Max = 21.6 Min = 1.4\n\nUsualDrunk random walk of 1000 steps\nMean = 27.2\nMax =\
  \ 66.3 Min = 4.5\n\nUsualDrunk random walk of 10000 steps\nMean = 89.2\nMax = 226.5\
  \ Min = 14.0\n```\n\n正如预期的那样，距离原点的平均距离随着步数的增加而增长。为了感受距离增长的速度，我们在图表上使用了步数的平方根（并将步数增加到\
