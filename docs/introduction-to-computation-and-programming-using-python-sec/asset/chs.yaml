  \n## Biased Random Walks\n\n现在我们有了一个可以工作的模拟，可以开始修改它来研究其他的随机行走。例如，假设我们考虑一个讨厌寒冷的北半球醉汉，即使在醉酒状态下，向南方移动时也能移动得快一倍。或者是一个向太阳移动的醉汉（早上向东，下午向西）。这些都是偏向随机行走的例子。行走仍然具有随机性，但结果存在偏差。\n\
