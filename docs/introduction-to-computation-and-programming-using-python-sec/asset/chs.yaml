  \ x 轴只到到 1000。虽然我们需要查看大型输入来体会常数时间和对数时间算法之间的差异，但对数时间和线性时间算法之间的差异即使在小输入上也是显而易见的。对数算法和线性算法相对性能的巨大差异并不意味着线性算法是糟糕的。事实上，在大多数情况下，线性算法的效率是可以接受的。\n\
