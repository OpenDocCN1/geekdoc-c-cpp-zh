  \n取值限于离散值集的随机变量被称为 `categorical`（也称为 `nominal` 或 `discrete`）`variables`。\n\n当一个分类变量只有两个可能值（例如成功或失败）时，该概率分布被称为\
  \ `二项分布`。理解二项分布的一种方式是将其视为在 `n` 次独立试验中恰好成功 `k` 次的概率。如果单次试验成功的概率为 `p`，那么在 `n` 次独立试验中恰好成功\
  \ `k` 次的概率由公式给出：\n\n![art](img/Art_P147.jpg)\n\n其中\n\n![art](img/Art_P148.jpg)\n\
  \n公式 ![art](img/Art_P149.jpg) 被称为 `二项式系数`。对它的一种的一种读法是“从 n 中选 k”，因为它等同于从一个大小为 `n`\
  \ 的集合中可以构建的大小为 `k` 的子集数量。例如，从集合 {1,2,3,4} 中可以构建出\n\n![art](img/Art_P150.jpg)\n\n\
  \ 6 个大小为二的子集。\n\n在 第 15.2 节中，我们询问了投掷十次骰子时恰好掷出两个 1 的概率。现在我们手里有了计算该概率的工具。将这十次投掷视为十次独立试验，如果掷出\
  \ 1 则试验成功，否则为失败。二项分布告诉我们，在十次试验中恰好有两次试验成功的概率是：\n\n![art](img/Art_P151.jpg)\n\n**练习题**：实现一个函数，计算掷\
  \ `k` 次公平骰子时恰好掷出两个 3 的概率。使用该函数绘制概率随 `k` 从 2 到 100 变化的图表。\n\n**多项分布**是二项分布向具有两个以上可能值的分类数据的推广。当存在\
  \ `n` 次独立试验，且每次试验都有 `m` 个相互互斥的结果，且每个结果出现的概率是固定的，则适用多项分布。多项分布给出了各种类别出现次数的任意组合的概率。\n\
  \n### 15.4.5 指数分布与几何分布\n\n**指数分布**非常常见。它们通常被用于对间隔时间建模，例如汽车进入高速公路的时间或对 Web 页面的请求时间。\n\
  \n例如，考虑人体内的药物浓度。假设在每个时间步中，每个分子都有一个恒定的概率 `p` 被清除（即不再留在体内）。该系统具有无记忆性，因为在每个时间步中，分子被清除的概率与之前发生过什么无关。在时间\
  \ `t = 0` 时，单个分子仍留在体内的概率为 1。在时间 `t = 1` 时，该分子仍留在体内的概率为 `1 - p`。在时间 `t = 2` 时，该分子仍留在体内的概率为\
  \ `(1 – p)²`。更一般地说，在时间 `t`，单个分子存活的概率为 `(1 – p)^t`，即关于 `t` 是指数级的。\n\n假设在时间 `t[0]`\
  \ 时有 `M[0]` 个药物分子。通常，在时间 `t`，分子的数量将是 `M[0]` 乘以单个分子存活到时间 `t` 的概率。图 15.26 中实现的 `clear`\
  \ 函数绘制了剩余分子预期数量随时间变化的图。\n\n![art](img/Art_P152.jpg)\n\n**图 15.26 分子的指数级清除**\n\n\
  调用 `clear(1000, 0.01, 1000)` 会产生 图 15.27 中的图表。\n\n![art](img/Art_P153.jpg)\n\n**图\
  \ 15.27: 指数衰减**\n\n这是**指数衰减**的一个例子。在实践中，指数衰减通常用**半衰期**来讨论，即初始值衰减 50% 所需的预期时间。也可以讨论单个项目的半衰期。例如，单个分子的半衰期是该分子被清除概率为\
  \ 0.5 的时间。注意，随着时间的增加，分子的数量趋于 0。\n\n如果我们对 y 轴取对数（使用 `pylab.semilogy`）会发生什么？我们得到了\
  \ 图 15.28 中的图。在 图 15.27 中，y 轴上的值相对于 x 轴呈指数变化。如果我们让 y 轴本身呈指数变化，就会得到直线。\n\n![art](img/Art_P154.jpg)\n\
  \n**图 15.28: 使用对数轴绘制指数衰减**\n\n**指数增长**是指数衰减的逆过程。它在自然界中同样常见。复利、游泳池中藻类的生长以及原子弹中的链式反应都是指数增长的例子。\n\
  \n指数分布可以通过调用 `random.expovariate(lambd)` 轻松生成，其中 `lambd` 是平均值的倒数。如果 `lambd` 为正，该函数返回\
  \ 0 到正无穷之间的值；如果 `lambd` 为负，则返回负无穷到 0 之间的值。\n\n**几何分布**是指数分布的离散模拟。它通常被描述为获得首次成功所需的独立尝试次数。例如，假设你有一辆启动故障的车，每次转钥匙（或按下启动按钮）有一半的概率能启动。几何分布可以用于刻画在成功之前尝试启动汽车的预期次数。图\
  \ 15.30 中的直方图说明了这一点，该图是由 图 15.29 中的代码生成的。\n\n![art](img/Art_P155.jpg)\n\n**图 15.29\
  \ 产生几何分布**\n\n![art](img/Art_P156.jpg)\n\n**图 15.30 几何分布**\n\n该直方图意味着大多数情况下你会在几次尝试内启动。然而，长尾表明偶尔你可能会面临在启动前电量耗尽的风险。\n\
  \n\n\n\n\n一组小数被认为满足`贝福德定律`^(²⁰¹)，如果其首位数字为 `d` 的概率符合 `P(d) = log10`。\n\n例如，该定律预测首位数字为\
  \ `1` 的概率大约为 30%！令人震惊的是，许多实际数据集似乎都遵循这一定律。可以证明，例如斐波那契数列完美地符合这一规律。这相当合理，因为该数列是由公式生成的。但很难理解的是，为什么像\
  \ iPhone 密码、每个用户的 Twitter 粉丝数、各国人口或恒星距离地球的距离这样多样的数据集，也会如此接近贝福德定律.^(²⁰²)\n\n# 15.5\
  \ 哈希与冲突\n\n在第 10.3 节中我们指出，通过使用更大的哈希表可以减少冲突的发生，从而缩短检索值的预期时间。现在我们有了所需的智工具来更精确地研究这种权衡。\n\
  \n首先，让我们对问题进行精确的公式化。\n\n*   假设：\n    * 哈希函数的范围是从 `1` 到 `n`，\n    * 插入次数为 `K`，\n\
  \    * 哈希函数对插入中使用的键产生完全均匀的分布，即对于所有键 `key` 以及范围 `1` 到 `n`范围内的所有整数 `i`，`hash(key)\
  \ = i` 的概率均为 `1/n`。\n\n*   至少发生一次冲突的概率是多少？\n\n这个问题完全等同于询问：“给定在 `1` 到 `n` 范围内的 `K`\
  \ 个随机生成的整数，其中至少有两个相等的概率是多少。”如果 `K ≥ n`，概率显然是 1。但当 `K < n` 时呢？\n\n通常情况下，最简单的方法是从回答反向开始：“给定在\
  \ `1` 到 `n` 范围内的 `K` 个随机生成的整数，它们中一个都不相等的概率是多少？”\n\n当我们插入第一个元素时，不发生冲突的概率显然是 1。第二次插入呢？由于还有\
  \ `n-1` 个与第一次哈希结果不相同的哈希结果，在 `n` 个选择中有 `n-1` 个不会产生冲突。因此，第二次插入不产生冲突的概率是 ![art](img/Art_P157.jpg)，而前两次插入都不产生冲突的概率是\
  \ ![art](img/Art_P158.jpg)。我们可以相乘这些概率，因为对于每次插入，哈希函数产生的值与其之前的任何内容都是独立的。\n\n插入三次后不发生冲突的概率是\
  \ ![art](img/Art_P159.jpg)。在插入 `K` 次后，该概率是 ![art](img/Art_P160.jpg)。\n\n为了得到至少发生一次冲突的概率，我们从\
  \ 1 中减去这个值，即概率为 ![art](img/Art_P161.jpg)\n\n根据哈希表的大小和预期的插入次数，我们可以此公式计算至少发生一次冲突的概率。如果\
  \ `K` 足够大（例如 `10,000`），用笔和纸计算该概率会很繁琐。这留下了两个选择：数学和编程。数学家已经使用了一些相当先进的技术来寻找近似该级数数值的方法。但除非\
  \ `K` 非常大，否则运行代码来计算该级数的精确值更为简单：\n\n```python\ndef collisionProb(n, k):\n    prob\
  \ = 1.0\n    for i in range(1, k):\n        prob = prob * ((n - i)/n)\n    return\
  \ 1 - prob\n```\n\n如果我们尝试 `collisionProb(1000, 50)`，我们得到至少发生一次冲突的概率约为 0.71。如果我们考虑\
  \ 200 次插入，冲突的概率接近 1。你觉得这看起来有点高吗？让我们写一个模拟实验（图 15.31\n\n**图 15.31 模拟哈希表**\n\n如果我们运行代码：\n\
  \n```python\nprint('Actual probability of a collision =', collisionProb(1000, 50))\n\
  print('Est. probability of a collision =', findProb(1000, 50, 10000))\nprint('Actual\
  \ probability of a collision =', collisionProb(1000, 200))\nprint('Est. probability\
  \ of a collision =', findProb(1000, 200, 10000))\n```\n\n它输出：\n\n```\nActual probability\
  \ of a collision = 0.7122686568799875\nEst. probability of a collision = 0.7097\n\
  Actual probability of a collision = 0.9999999994781328\nEst. probability of a collision\
  \ = 1.0\n```\n\n模拟结果与我们推导出的分析结果令人慰藉地相似。\n\n冲突的高概率应该让我们认为哈希表必须非常巨大才有用吗？不。冲突的高概率对我们了解预期时间几乎帮助。查找的预期时间取决于桶的平均长度。\n\
  \n# 15.6 强队有多大机会获胜？\n\n假设桶的分布是均匀的，几乎每年十月，美国联盟的两支球队都会参加一项被称为“世界大赛”的比赛。他们一直对战，直到其中一支球队赢得四场比赛，因此问题在于我们应该将该胜利归于技术还是运气。\n\
