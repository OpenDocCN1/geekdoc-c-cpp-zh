  \ is False` (此处按逻辑)\n\n中间类 `Student` 的用处稍微微妙。回到 `MITPerson` 并添加：\n```python\ndef\
  \ isStudent(self):\n    return isinstance(self, Student)\n```\n`isinstance` 函数是内置的。`isinstance`\
