  \n____________\n\n¹⁰⁰ “天哪，一百多页以来，我们一直在不知情的情况下使用 ADT。”\n\n\n\n\n这一 `substitution\
  \ principle`（替换原理）由 Barbara Liskov 和 Jeannette Wing 在它们 1994 年的论文《子类型的行为概念》中明确阐述。\n\
  \n这个对生成器（generators）的解释有些过于简单了。要完全理解生成器，你需要了解 `Python` 中内置迭代器是如何实现的，而这本书并没有涵盖这部分。\n\
  \n在此背景下，回想一下“mortgage”（抵押贷款）一词的词源是有意义的。《美国遗产英语词典》将该词追溯到古法语中表示“死亡”（`mort`）和“质押”（`gage`）的词。（这个词源也解释了为什么\
  \ mortgage 中间的字母“t”是不发音的。）\n\n伦敦银行间同业拆借利率（LIBOR）可能是最常用的指数。\n\n# 9 算法复杂性的浅显介绍\n\n\
  在设计和实现程序时，最重要的一点是它应该产生可以信赖的结果。我们希望银行余额的计算正确。我们希望汽车的燃油喷射器喷射出适量的燃料。我们希望飞机和操作系统都不会崩溃。\n\
  \n有时，性能是正确性的一个重要方面。对于需要实时运行的程序来说，这一点最为明显。一个警告飞机潜在障碍的程序，需要在遇到障碍之前发出警告。性能也会影响许多非实时程序的实用性。在评估数据库系统的实用性时，每分钟完成的事务处理数是一项重要指标。用户在乎在手机上启动应用程序所需的时间。生物学家则关心他们的发育推断计算需要多久。\n\
  \n编写高效的程序并非易事。最直接的解决方案往往不是最高效的。计算高效的算法通常采用微妙的技巧，这使得它们难以理解。因此，程序员往往会通过增加程序的 `conceptual\
  \ complexity`（概念复杂度）来减少其 `computational complexity`（计算复杂度）。为了以合理的方式做到这一点，我们需要理解如何估计程序的计算复杂度。这本章的主题。\n\
  \n## 9.1 思考计算复杂度\n\n人应该如何回答“运行以下函数需要多长时间？”这个问题？\n\n```python\ndef f(i):\n    \"\"\
  \"Assumes i is an int and i >= 0\"\"\"\n    answer = 1\n    while i >= 1:\n    \
  \    answer *= i\n        i -= 1\n    return answer\n```\n\n我们可以在某些输入上运行程序并计时。但这并没有什么参考价值，因为结果取决于：\n\
  \n*   运行该程序的计算机速度，\n*   该机器上 `Python` 实现的效率，\n*   输入的值。\n\n我们通过使用更抽象的时间度量来解决前两个问题。我们不再以毫秒为单位衡量时间，而是根据程序执行的基本步骤数来衡量时间。\n\
  \n为了简单起见，我们将 `random access machine`（随机访问机器）作为我们的计算模型。在随机访问机器中，步骤是顺序一个一个执行的。一个 `step`（步骤）是一项需要固定时间的操作，例如将变量绑定到对象、进行比较、执行算术运算或访问内存中的对象。\n\
  \n现在我们已经有了一种更抽象的方式来思考时间的含义，我们转而考虑对输入值依赖的问题。我们通过不再将时间复杂度表示为单一数字，而是将其与输入的大小起来来解决这个问题。这允许我们通过讨论每个算法的运行时间如何随输入的大小增长，来比较两个算法的效率。\n\
  \n当然，算法的实际运行时间不仅取决于输入的大小，还取决于它们的值。例如，考虑由以下实现的线性搜索算法：\n\n```python\ndef linearSearch(L,\
  \ x):\n    for e in L:\n        if e == x:\n            return True\n    return\
  \ False\n```\n\n假设 `L` 是一个包含一百万元素的列表，考虑调用 `linearSearch(L, 3)`。如果 `L` 中的第一个元素是 3，`linearSearch`\
  \ 将几乎立即返回 `True`。相反，如果 3 不在 `L` 中，`linearSearch` 将必须检查所有一百万个元素后返回 `False`。\n\n通常，有三种宽泛的情况需要考虑：\n\
  \n*   `best-case`（最好情况）运行时间是输入尽可能理想时的算法运行时间。即，`best-case` 运行时间是给定大小的所有可能输入中的最小运行时间。对于\
  \ `linearSearch`，最好情况的运行时间与 `L` 的大小无关。\n*   同样，`worst-case`（最坏情况）运行时间是给定大小的所有可能输入中的最大运行时间。对于\
  \ `linearSearch`，最坏情况运行时间与 `L` 的大小呈线性关系。\n*   比最好情况和最坏情况运行时间的定义，`average-case`（平均情况，也称为\
  \ `expected-case` 期望情况）运行时间是给定大小的所有可能输入上的平均运行时间。或者，如果对输入值的分布具有某些 *a priori*（先验）信息（例如，90%\
  \ 的情况下 `x` 在 `L` 中），可以将其考虑进去。\n\n人们通常关注最坏情况。所有工程师都有一个共同的信念——墨菲定律：如果某事可能出错，它就会出错。最坏情况为运行时间提供了一个\
  \ `upper bound`（上界）。在对计算持续时间有限制的情况下，这至关重要。仅仅知道“大多数时候”空交通管制系统在碰撞发生前发出了警告是不够的。\n\n\
  让我们看看阶乘函数迭代实现的最坏情况运行时间：\n\n```python\ndef fact(n):\n    \"\"\"Assumes n is a natural\
  \ number\n    Returns n!\"\"\"\n    answer = 1\n    while n > 1:\n        answer\
  \ *= n\n        n -= 1\n    return answer\n```\n\n运行此程序程序所需的步骤数大约是 2（初始赋值语句 1 步和返回\
  \ 1 步）+ 5n（计算循环中的测试 1 步、循环内第一个赋值语句 2 步以及循环内第二个赋值语句 2 步）。所以，例如，如果 `n` 是 1000，函数将执行大约\
  \ 5002 步。\n\n显而易见，当 `n` 变得很大时，担心 `5n` 和 `5n+2` 之间的差异是非常愚蠢的。由于原因，我们在推理运行时间时通常忽略加法常量。乘法常量则更有问题。我们应该关心计算花费\
  \ 1000 步还是 5000 步吗？乘法因子可能是重要的。搜索引擎处理一个查询需要半秒还是 2.5 秒，决定了人们是使用该搜索引擎还是去竞争对手那里。\n\n\
  另一方面，当比较两个不同的算法时，通常即使是乘法常量也是无关紧要的。回想第 3 章中我们过的寻找浮点数平方根近似值的算法：穷举枚举和二分查找。基于这些算法的函数如图\
  \ 9.1 和图 9.2 所示。\n\n\n\n我们看到，穷举法非常缓慢，以至于对于许多 `x` 和 `epsilon` 的组合来说是不实用的。例如，评估 `squareRootExhaustive(100,\
  \ 0.0001)` 需要 `while` 循环迭代大约十亿次。相比之下，评估 `squareRootBi(100, 0.0001)` 仅需对稍微复杂的 `while`\
  \ 循环进行大约二十次迭代。当迭代次数的差异如此大时，循环中有多少条指令实际上并不重要。也就是说，乘法常数是无关的。\n\n## 9.2 渐近符号\n\n我们使用所谓的`渐近符号`（asymptotic\
  \ notation）来提供一种正式的方法，讨论算法运行时间与其输入规模大小之间的关系。其根本动力是，几乎任何算法在小输入上运行时都是足够高效的。我们通常需要担心的是算法在非常大的输入上运行时的效率。作为“非常大”的代，渐近符号描述了算法随着输入规模趋于无穷大时的复杂度。\n\
  \n例如，考虑图 9.3 中的代码。\n\n![art](img/Art_P52.jpg)\n\n**图 9.3 渐近复杂度**\n\n如果假设每行代码执行需要一个单位的时间，那么该函数的运行时间可以描述为\
  \ `1000 + x + 2x²`。常数 `1000` 对应于第一个循环执行的次数。项 `x` 对应于第二个循环执行的次数。最后，项 `2x²` 对应于执行嵌套\
  \ `for` 循环中两个语句的时间。因此，调用 `f(10)` 将打印：\n\n```\nNumber of additions so far 1000\n\
  Number of additions so far 1010\nNumber of additions so far 1210\n```\n\n而调用 `f(1000)`\
  \ 将打印：\n\n```\nNumber of additions so far 1000\nNumber of additions so far 2000\n\
  Number of additions so far 2002000\n```\n\n对于较小的 `x` 值，常数项占主导。如果 `x` 是 `10`，超过 80%\
  \ 的步骤被第一个循环占据。另一方面，如果 `x` 是 `1000`，前两个循环中的每个只占步骤的约 0.05%。当 `x` 是 `1,000,000` 时，第一个循环占总时间的约\
  \ 0.00000005%，第二个循环约占 0.00005%。在 `2,000,001,001,000` 步中，有完整的 `2,000,000,000,000`\
  \ 步位于内部 `for` 循环体内。\n\n显然，通过只考虑内部循环（即二次组件），我们可以得到该代码在大型输入上运行所需时间的有意义的概念。我们是否应该关心这个循环花费了\
  \ `2x²` 步而不是 `x²` 步呢？如果你的计算机每秒执行大约 1 亿次步骤，评估 `f` 将需要大约 5.5 小时。如果我们能将复杂度降低到 `x²`\
  \ 步，将需要大约 2.25 小时。无论哪种情况，道理都是相同的：我们应该寻找更高效的算法。\n\n这种分析导致我们在描述算法的渐近复杂度时使用以下经验法则：\n\
  \n*   如果运行时间是多个项之和，保留增长率最大的那项，丢弃其他项。\n*   如果剩余项是乘积，丢弃任何常数。\n\n最常用的渐近符号被称为“大 O 法”（Big\
  \ O notation）。^(¹⁰⁶) 大 O 法用于用于给函数的渐近增长率（通常称为`增长阶数`）提供一个`上界`。例如，公式 `f(x) ∈ O(x²)`\
  \ 意味着在渐近意义上，函数 `f` 的增长速度不超过二次多项式 `x²`。\n\n我们和许多计算机科学家一样，经常会滥用大 O 法，做出诸如“`f(x)` 的复杂度是\
  \ `O(x²)`”之类的陈述。我们的意思是，在最坏情况下 `f` 运行需要 `O(x²)` 步。函数“属于 O(x²)”和“是 O(x²)”之间的区别虽然细微但很重要。说\
  \ `f(x) ∈ O(x²)` 并不排除 `f` 的最坏运行时间显著少于 `O(x²)`。\n\n当我们说 `f(x)` 是 `O(x²)` 时，意味着 `x²`\
  \ 既是渐近最坏运行时间的上界，也是`下界`。这被称为`紧界`。^(¹⁰⁷)\n\n## 9.3 一些重要的复杂度类\n\n下面列出了大 O 最常见的实例。在每种情况下，`n`\
  \ 是函数输入规模的衡量标准。\n\n*   `O(1)` 表示`常数`运行时间。\n*   `O(log n)` 表示`对数`运行时间。\n*   `O(n)`\
  \ 表示`线性`运行时间。\n*   `O(n log n)` 表示`对数线性`运行时间。\n*   `O(n^k)` 表示`多项式`运行时间。注意 `k` 是常数。\n\
  *   `O(c^n)` 表示`指数`运行时间。\n\n### 9.3.1 常数复杂度\n\n这表明复杂度与输入无关。这类类的程序很少，但常数运行时间意味着没有循环。\n\
  \n### 9.3.2 对数复杂度\n\n此类函数的复杂度随输入的对数增长。例如，二分搜索对于列表是对数级的。有很多有趣的对数复杂度函数。考虑\n\n```python\n\
  def intToStr(i):\n    \"\"\"假设 i 是非负整数\n    返回 i 的字符串表示\"\"\"\n    digits = '0123456789'\n\
  \    if i == 0:\n        return '0'\n    result = ''\n    while i > 0:\n       \
  \ result = digits[i%10] + result\n        i = i//10\n    return result\n```\n\n\
  由于代码中没有函数调用，我们只需要查看循环来确定复杂度。只有一个循环，所以这归结为除以 10 的次数。因此，`intToStr` 的复杂度是 `O(log(i))`。\n\
  \n关于以下函数的复杂度：\n\n```python\ndef addDigits(n):\n    \"\"\"假设 n 是非负整数\n    返回 n 的数字之和\"\
  \"\"\n    stringRep = intToStr(n)\n    val = 0\n    for c in stringRep:\n      \
  \  val += int(c)\n    return val\n```\n\n使用 `intToStr` 将 `n` 转换为字符串的复杂度是 `O(log(n))`，而\
  \ `intToStr` 返回的字符串长度为 `O(log(n))`。`for` 循环执行 `O(len(stringRep))` 次，即 `O(log(n))`。这一切结合，假设表示数字的字符可以在常数时间内转换为整数，程序的运行时间与\
  \ `O(log(n)) + O(log(n))` 成比例，这使其成为 `O(log(n))`。\n\n### 9.3.3 线性复杂度\n\n许多处理列表或其他序列的算法都是线性的，因为它们以常数（大于\
  \ 0）次访问序列中的每个元素。\n\n例如，考虑\n\n```python\ndef addDigits(s):\n    \"\"\"假设 s 是一个字符串，每个字符都是\n\
  \    进制数字。\n    返回 s 中数字之和的整数\"\"\"\n    val = 0\n    for c in s:\n        val +=\
  \ int(c)\n    return val\n```\n\n该函数对于 `s` 的长度是线性的，即 `O(len(s))`——再次假设表示数字的字符可以在常数时间内转换为整数。\n\
  \n当然，程序不需要循环循环也可以具有线性复杂度。考虑\n\n```python\ndef factorial(x):\n    \"\"\"假设 x 是正整数\n\
  \    返回 x!\"\"\"\n    if x == 1:\n        return 1\n    else:\n        return x*factorial(x-1)\n\
  ```\n\n\n\n这段代码中没有循环，因此为了分析复杂度，我们需要确定到底会发生多少次递归调用。这一系列调用简单来说就是\n\n`factorial(x)`,\
  \ `factorial(x-1)`, `factorial(x-2)`, … , `factorial(1)`\n\n这个系列的长度，即该函数的复杂度是 `O(x)`。\n\
  \n到本章为止，我们只查看了代码的时间复杂度。对于使用常数空间的算法来说，这是可以的，但 `factorial` 的这种实现并不具备该属性。正如我们在第 4 章中讨论的那样，`factorial`\
  \ 的每次递归调用都会分配一个新的栈帧（stack frame），该栈帧会一直占用内存，直到调用返回。在递归的最大深度处，这段代码将分配 `x` 个栈帧，因此空间复杂度也是\
  \ `O(x)`。\n\n空间复杂度的影响比时间复杂度的影响更容易感知。一个程序完成需要一分钟还是两分钟对用户来说显而易见，但它使用一兆字节还是两兆字节内存对用户来说很大程度上是不可见的。这就是为什么人们通常关注时间复杂度而不是空间复杂度。例外情况是程序需要的空间超过了运行机器快速内存的可用空间。\n\
  \n## 9.3.4 对数线性复杂度](#toc.xhtml_Rh2-29)\n\n这比我们目前看到的复杂度类稍微复杂一点。它涉及到两个项的乘积，每一项都取决于输入的大小。这是一个重要的类别，因为许多实际算法都是对数线性的。常用的对数线性算法可能是归并排序（merge\
  \ sort），它是 `O(n log(n))`，其中 `n` 是正在排序列表的长度。我们将在第 10 章中查看该算法并分析其复杂度。\n\n## 9.3.5\
  \ 多项式复杂度](#toc.xhtml_Rh2-30)\n\n常用的多项式算法是二次的（quadratic），即它们的复杂度随着输入大小的平方而增长。例如，考虑图\
  \ 9.4 中的函数，它实现了一个子集测试。\n\n![art](img/Art_P53.jpg)\n\n**图 9.4 子集测试的实现**\n\n每当进入内层循环时，它都会执行\
  \ `O(len(L2))` 次。函数 `isSubset` 将执行外层循环 `O(len(L1))` 次，因此内层循环将被触发 `O(len(L1))` 次。因此，函数\
  \ `isSubset` 的复杂度是 `O(len(L1)*len(L2))`。\n\n现在考虑图 9.5 中的函数 `intersect`。构建可能包含重复项的列表的部分运行时间显然是\
  \ `O(len(L1)*len(L2))`。乍一看构建无重复列表的代码部分相对于 `tmp` 的长度是线性的，但事实并非如此。测试 `e not in result`\
  \ 可能涉及查看 `result` 中的每个元素，因此其复杂度为 `O(len(result))``；因此，实现的第二部分是 `O(len(tmp)*len(result))`。然而，由于\
  \ `result` 和 `tmp` 的长度受限于 `L1` 和 `L2` 中较者的长度，且由于我们忽略了加性项，`intersect` 的复杂度是 `O(len(L1)*len(L2))`。\n\
  \n![art](img/Art_P54.jpg)\n\n**图 9.5 列表交集的实现**\n\n构建可能包含重复项的列表的部分运行时间显然是 `O(len(L1)*len(L2))`。乍一看构建无重复列表的代码部分相对于\
  \ `tmp` 的长度是线性的，但事实并非如此。测试 `e not in result` 可能涉及查看 `result` 中的每个元素，因此其复杂度为 `O(len(result))``；因此，实现的第二部分是\
  \ `O(len(tmp)*len(result))`。然而，由于 `result` 和 `tmp` 的长度受限于 `L1` 和 `L2` 中较者的长度，且由于我们忽略了加性项，`intersect`\
  \ 的复杂度是 `O(len(L1)*len(L2))`。\n\n## 9.3.6 指数级复杂度](#toc.xhtml_Rh2-31)\n\n正如我们在书后面将看到的，许多重要问题本质上是指数级的，也就是说完全解决它们可能需要随输入大小呈指数级增长的时间。这是遗憾的，因为编写一个有较高概率以指数级时间运行的程序通常是不划算的。例如，考虑图\
  \ 9.6 中的代码。\n\n![art](img/Art_P55.jpg)\n\n**图 9.6 生成幂集**\n\n函数 `genPowerset(L)`\
  \ 返回一个列表的列表，其中包含 `L` 中元素的所有可能组合。例如，如果 `L` 是 `['x', 'y']`，那么 `L` 的幂集将是一个包含列表 `[]`、`['x']`、`['y']`\
  \ 和 `['x', 'y']` 的列表。\n\n该算法有点微妙。考虑一个包含 `n` 个元素的列表。我们可以用 `n` 个 0 和 1 的字符串表示元素的任何组合，其中\
  \ `1` 表示存在，`0` 表示缺失。\n\n*   生成所有 n 位二进制数。\n*   对于这些 2^n 个数中的每一个，生成列表。\n\n尝试对十个字母运行\
  \ genPowerset。它会很快完成并产生一个包含 1024 个元素的列表。接下来，尝试对字母表的前 20 个字母运行 genPowerset。 true\
  \ 不要对包含所有大小写字母的列表运行 genPowerset。算法的第一步生成 O(2^(len(L))) 个二进制数，因此算法相对于 len(L) 是指数级的。\n\
  \n这意味着我们无法通过计算来解决指数级的问题吗？绝对不是。这意味着我们必须找到这些问题提供近似解的算法，或者在某些实例上找到完美解。那是后续章节的主题。\n\n\
  ## 9.3.7 复杂度类的比较](#toc.xhtml_Rh2-32)\n\n本节中的图表旨在传达算法处于某一复杂度类产生的影响。\n\n图 9.7 中的左侧图比较了常数时间算法和对数算法的增长情况。注意，输入大小必须达到大约百万两者才会相交，即使常数仅为\
