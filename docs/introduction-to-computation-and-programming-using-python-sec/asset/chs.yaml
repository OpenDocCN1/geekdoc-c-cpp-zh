  \ 0.9973\n\n对于 mu = 9 和 sigma = 9\n1 个标准差内的比例 = 0.6827\n2 个标准差内的比例 = 0.9545\n3 个标准差内的比例\
  \ = 0.9973\n\n对于 mu = 1 和 sigma = 5\n1 个标准差内的比例 = 0.6827\n2 个标准差内的比例 = 0.9545\n\
