  \n## 18.3 拟合指数分布数据](#toc.Rh1-65)\n\n`Polyfit` 使用线性回归来寻找给定阶数的多项式，该多项式是对某些数据的最佳最小二乘拟合。如果数据可以直接被多项式近似，它的效果会非常理想。但这并不总是可能的。例如，考虑简单的指数增长函数\
