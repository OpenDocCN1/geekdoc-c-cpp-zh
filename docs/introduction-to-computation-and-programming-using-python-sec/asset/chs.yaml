  \ `traceWalk` 的参数，我们就不需要更改 `traceWalk` 了。）\n\n\n\n\n虽然通过分析推导出关于简单随机游走甚至有偏随机游走的预期行为的不同信息是可行的，但一旦引入了虫洞，这样做就会变得具有挑战性。然而，将模拟更改以模拟新情况却非常简单。与分析模型相比，模拟模型通常具有这种优势。\n\
