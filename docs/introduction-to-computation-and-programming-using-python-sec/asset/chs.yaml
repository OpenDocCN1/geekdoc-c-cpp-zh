  \n尽管我们在书中花费了相当多的篇幅来讨论效率，但目标并不是让你成为设计高效程序的专家。有很多长篇著作（甚至有一些优秀的长篇著作）专门致力于这个主题^(¹¹¹)。在第\
  \ 9 章中，我们介绍了一些复杂度分析的基础概念。在本章中，我们利用这些概念来观察一些经典算法的复杂度。本章的目标是帮助你对如何处理效率问题建立一些通直觉。当你读完这一章时，你应该理解为什么有些程序转眼之间就能完成，为什么有些程序需要运行一夜，以及为什么有些程序在你有生范围内无法完成。\n\
  \n我们在书中看到的第一个算法是基于暴力穷举枚举的。我们认为，现代计算机非常快，以至于很多情况下，采用巧妙的算法是浪费时间。编写简单且显而易正确的代码通常是正确的做法。\n\
  \n然后我们研究了一些问题（例如，寻找多项式根的近似值），这些问题的搜索空间太大，以至于暴力法变得不实际。这促使我们考虑更高效的算法，例如二分查找和牛顿-拉夫逊法。主要的观点是，效率的关键在于良好的算法，而不是奇思妙巧的小技巧。\n\
  \n在科学领域（物理、生命和社会科学）中，程序员通常首先通过快速编写一个简单算法来测试关于数据集假设的合理性，然后在少量数据上运行它。如果这产生了令人鼓舞的结果，就可以开始努力生产一个可以在大型数据集上运行（可能是反复运行）的实现。这样的实现需要基于高效的算法。\n\
  \n高效的算法很难发明的。成功的职业计算机科学家在整个职业生涯中可能发明一个算法——如果他们足够幸运的话。我们大多数人从未发明过新颖的算法。我们所做的是学习将我们面临的问题中最复杂的方面简化为以前解决的问题。\n\
  \n更具体地说，我们：\n\n*   对问题的内在复杂度建立理解，\n*   思考如何将该问题分解为子问题，\n*   将这些子问题与已经存在高效算法的其他问题联系起来。\n\
  \n本章包含几个示例，旨在让你对算法设计产生一些直觉。许多其他算法出现在书的其他地方。\n\n请记住，最高效的算法并不总是首选。一个以最高效方式完成所有事情的程序通常难以理解。一种良好的策略是先用最直接的方法解决手头的问题，对其进行监测以寻找计算瓶颈，然后寻找改进这些部分的方法。\n\
  \n## 10.1 搜索算法](#toc.xhtml_Rh1-35)\n\n**搜索算法**是在集合中寻找具有特定属性的项目或项目的方法。我们将集合称为**搜索空间**。搜索空间可以是具体的，例如电子病记录，也可以是抽象的，例如所有整数的集合。实践中发生的许多问题都可以建模为搜索问题。\n\
  \n书中之前介绍的许多算法都可以视为搜索算法。在第 3 章中，我们将寻找多项式根的近似值建模为一个搜索问题，并研究了三种算法——穷举枚举、二分查找和牛顿-拉夫逊。\n\
  \n在本节中，我们将检查两个搜索列表的算法。每个符合规范：\n\n```python\ndef search(L, e):\n    \"\"\"假设 L 是列表。\n\
  \    如果 e 在 L 中返回 True，否则返回 False\"\"\"\n```\n\n敏锐的读者可能会想这是否与 Python 表达式 `e in L`\
  \ 语义等价。答案是。如果你不在乎发现 `e` 是否在 `L` 中的效率，你应该直接编写该表达式。\n\n### 10.1.1 线性搜索和使用间接访问元素](#toc.xhtml_Rh2-33)\n\
  \nPython 使用以下算法确定元素是否存在于列表中：\n\n```python\nfor i in range(len(L)):\n    if L[i]\
  \ == e:\n        return True\nreturn False\n```\n\n如果元素 `e` 不在列表中，该算法将执行 `O(len(L))`\
  \ 次测试，即其复杂度至少相对于 L 的长度是线性。为什么是“至少”线性的？只有当循环内部每个操作都能常时间内完成时，它才是线性的。这提出了 Python 是否在常时间内检索列表的第\
  \ `i` 个元素的问题。由于我们的计算模型假设获取地址的内容是常时间操作，问题变成了我们是否可以在常时间内计算列表中第 `i` 个元素的地址。\n\n\n\n\
  \n\n让我们先考虑一种简单的情况，即列表中的每个元素都是整数。这意味着列表中的每个元素的大小相同，例如，占用四个内存单元（四个 8 位字节）。假设列表的元素是连续存储的，那么列表第\
  \ $i^{th}$ 个元素在内存中的地址简单于 `start + 4*i`，其中 `start` 是列表起始的地址。因此，我们可以假设 Python 可以在常数时间内计算出整数列表第\
  \ $i^{th}$ 个元素的地址。\n\n当然，我们知道 Python 列表可以包含 `int` 其他类型的对象，而且同一个列表可以包含许多不同类型和大小的对象。你可能会认为这会带来问题，但并没有。\n\
  \n在 Python 中，列表被表示为一个长度（列表中的对象数量）和一系列指向对象的固定大小指针。图 10.1 阐述了这些指针的用法。阴影区域表示一个包含四个元素的列表。最左侧的阴影框包含一个指向整数的指针，指示列表的长度。其他每个阴影框都包含一个指向列表中某个对象的指针。\n\
  \n![art](img/Art_P59.jpg)\n\n**图 10.1 实现列表**\n\n如果长度字段占用四个内存单元，且每个指针（地址）占用四个内存单元，那么列表第\
  \ $i^{th}$ 个元素的地址存储在 `start + 4 + 4*i` 。同样，这个地址可以在常数时间内找到，然后可以使用该地址存储的值来访问第 $i^{th}$\
  \ 个元素。这种访问也是一个常数时间的操作。\n\n这个例子说明了计算中使用的最重要的实现技术之一：**间接**（indirection）。泛而言之，间接涉及到通过访问另一个包含初始目标引用的东西来访问目标。这在我们每次使用变量来引用该变量所绑定的对象时都会发生这种情况。当我们使用变量访问列表，然后通过该列表存储的引用访问另一个对象时，我们经历了两层间接。\n\
  \n### 10.1.2 二分查找与假设的利用\n\n回到实现 `search(L, e)` 的问题，`O(len(L))` 是我们能做到的最优吗？是的，如果我们对列表中元素值之间的关系以及它们的存储顺序一无所知。在最坏的情况下，我们必须查看\
  \ `L` 中的每个元素，以确定 `L` 是否包含 `e`。\n\n但假设我们对元素的存储顺序有所了解，例如，假设我们有一个按升序存储的整数列表。我们可以更改实现，使得搜索在遇到比正在查找的数字大的数字停止，如图\
  \ 10.2 所示。\n\n![art](img/Art_P60.jpg)\n\n**图 10.2 排序列表的线性查找**\n\n这将提高平均运行时间。然而，它不会改变算法的最坏情况复杂度，因为在最坏情况下\
  \ `L` 的每个元素都会被检查。\n\n但是，我们可以通过使用**二分查找**算法显著改进最坏情况复杂度，这种算法与第 3 章中寻找浮点数平方根近似值的二分查找算法类似。在那里，我们依赖于浮点数存在内在的全序。在这里，我们依赖于列表是有序的假设。\n\
  \n思路非常简单：\n\n1. 选择一个索引 `i`，将列表 `L` 大约平分为两半。\n2. 询问 `L[i] == e` 是否成立。\n3. 如果不是，询问\
  \ `L[i]` 是大于 `e` 还是小于 `e`。\n4. 根据答案，在 `L` 的左半部分或右半部分搜索 `e`。\n\n考虑到算法的结构，二分查找最直接的实现使用递归并不令人意外，如图\
  \ 10.3 所示。\n\n图 10.3 中的外部函数 `search(L, e)` 具有参数和规范与图 10.2 中定义的函数相同。规范说明实现可以假设 `L`\
  \ 是升序排列的。确保该假设被满足的责任在于 `search` 的调用者。如果未满足该假设，该实现没有义务表现得良好。它可能正常工作，也可能崩溃或返回错误答案。是否应该修改\
  \ `search` 来检查该假设是否满足？这可能会消除一个错误来源，但会违背使用二分查找的目的，因为检查该假设本身需要花费 `O(len(L))` 时间。\n\
  \n![art](img/Art_P61.jpg)\n\n**图 10.3 递归二分查找**\n\n如 `search` 这样的函数通常被称为**封装函数**（wrapper\
  \ functions）。该函数为客户端代码提供了良好的接口，但本质上是一个不进行实际计算的透传。相反，它带有适当参数调用辅助函数 `bSearch`。这引出了问题：为什么不消除\
  \ search 并让客户端直接调用 bSearch 呢？原因是 `low` 和 `high` 与搜索列表的抽象无关。它们是实现细节。\n\n\n\n\n最后，我们可以回答这个问题了：二分查找的算法复杂度是多少？当搜索调用\
  \ `bSearch` 时，`high–low` 的值等于 `len(L)-1`，搜索的复杂度为 `O(log(len(len(L))))`。\n\n**练习题：**\
  \ 为什么代码在第二次递归调用中使用 `mid+1` 而不是 `mid`？\n\n## 10.2 排序算法\n\n我们刚刚看到，如果我们恰好知道列表是有序的，就可以利用这一信息极大缩短搜索列表所需的时间。这意味着当被要求搜索列表时，应该先对其进行排序，然后进行搜索吗？\n\
  \n让 `O(sortComplexity(L))` 为排序列表的复杂度。由于我们知道可以在 `O(len(L))` 时间内搜索列表，因此是否应该先排序后搜索的问题就简化为：`sortComplexity(L)\
  \ + log(len(L))` 是否小于 `len(L)`？遗憾的是，答案是否定的。在不至少查看列表中的每个元素的情况下，无法对列表进行排序，因此在亚线性时间内是不可能的。\n\
  \n这是否意味着二分查找只是一个没有实际意义的智力好奇心呢？幸运的是，不是。假设人们预期多次搜索同一个列表。那么，支付一次排序列表的开销，并将排序成本**分摊**到多次搜索中，可能是很有意义的。如果我们预期搜索列表\
  \ `k` 次，相关问题变为：`sortComplexity(L) + k[*]log(len(L))` 是否小于 `k[*]len(L)`？\n\n随着 `k`\
  \ 变得很大，排序列表所需的时间变得越来越无关。`k` 需要多大取决于排序列表所需的时间。例如，如果排序复杂度随列表大小呈指数增长，那么 `k` 必须很大。\n\
  \n幸运的是，排序可以做得相当高效。例如，大多数 Python 实现中标准的排序运行时间约为 `O(n[*]log(n))`，其中 `n` 是列表的长度。在实践中，你很少需要自己实现排序函数。在大多数情况下，正确的方法是使用\
  \ Python 的内置 sort 方法（`L.sort()` 排序列表 `L`）或其内置函数 `sorted`（`sorted(L)` 返回一个与 `L` 元素相同的列表，但不会修改\
  \ `L`）。我们在这里介绍排序算法主要是为了在算法设计和复杂度分析方面提供一些实践思考。\n\n我们从一个简单但低效的算法开始，**选择排序**。选择排序通过维护**循环不变性**来工作：给定列表划分为前缀（`L[0:i]`）和后缀（`L[i+1:len(L)]`），前缀是有序的，且前缀中没有元素大于后缀中的最小元素。\n\
  \n我们使用归纳法来推导循环不变性。\n\n*   **基础情况：** 在第一次迭代开始时，前缀是空的，也就是说后缀是整个列表。因此，不变性是（显而易见地）成立的。\n\
  *   **归纳步骤：** 在算法的每一步中，我们将一个元素从后缀移动到前缀。我们通过将后缀的最小元素添加到前缀的末尾来实现这一点。因为在移动元素之前不变性仍然成立，我们知道在添加元素后，前缀仍然是有序的。我们还知道，由于我们移除了后缀中的最小元素，前缀中没有元素大于后缀中的最小元素。\n\
  *   **终止：** 当退出循环时，前缀包含了整个列表，后缀为空。因此，整个列表现在已按升序排序。\n\n![art](img/Art_P62.jpg)\n\n\
  **图 1.4 选择排序**\n\n很难想象比这更简单或更明显正确的排序算法了。遗憾的是，它相当低效。内循环的复杂度为 `O(len(L))`。外循环的复杂度也是\
  \ `O(len(L))`。所以，整个函数的复杂度为 `O(len(L)²)`。即它相对于 `L` 的长度是二次的。\n\n### 10.2.1 合并排序\n\n\
  幸运的是，我们可以使用**分治算法**获得比二次时间得多的结果。基本思想是组合原始问题的简单实例的解决方案。通常，分治算法的特征是：\n\n*   一个阈值输入大小，低于该大小问题不再被细分；\n\
  *   实例被拆分为子实例的大小和数量；\n*   用于合并子解决方案的算法。\n\n阈值有时被称为**递归基准**。对于第 2 点，通常考虑初始问题大小与子实例大小的比例。在我们目前为止看到的多数例子中，该比例是\
  \ 2。\n\n**归并排序**是一种典型的分治算法。它由约翰·冯·诺依曼（John von Neumann）于 1945 年发明，至今仍广泛使用。像许多分治算法一样，它最可以用递归的方式描述：\n\
  \n1.  如果列表长度为 0 或 1，则它已经排序。\n2.  如果列表超过一个元素，将列表拆分为两个列表，并使用 `merge sort` 排序其中的每一个。\n\
  3.  合并结果。\n\n冯·诺依曼的关键观察是，两个有序列表可以高效地合并为一个列表。合并过程的复杂度是多少？它涉及两个常数时间操作：比较元素的值和将元素从一个列表复制到另一个列表。比较次数为\
  \ `O(len(L))`，其中 `L` 是两个列表中较长的那个。复制操作次数为 `O(len(L1) + len(L2))`，因为每个元素恰好被复制一次。因此，合并两个有序列表相对于长度是线性的。\n\
  \n图 10.5 包含了合并排序算法的实现。\n\n![art](img/Art_P63.jpg)\n\n**图 10.5 合并排序**\n\n注意我们将比较操作符作为\
  \ `mergeSort` 函数的参数，并写了一个 lambda 表达式来提供默认值。所以，例如代码：\n\n```\nL = [2,1,4,5,3]\nprint(mergeSort(L),\
  \ mergeSort(L, lambda x, y: x > y))\n```\n\n会打印升序和降序的列表。\n\n让我们分析 `mergeSort` 的复杂度。我们已经知道合并的时间复杂度是\
  \ `O(len(L))`。在每一层递归中，要合并的元素总数为 `len(L)`。因此，`mergeSort` 的时间复杂度是 `O(len(L))` 乘以递归深度。由于\
  \ `mergeSort` 每次将列表平半，我们知道递归层数是 `O(log(len(L)))`。因此，`mergeSort` 的时间复杂度为 `O(n[*]log(n))`，其中\
  \ `n` 是 `len(L)`。\n\n\n\n这种时间复杂度的提升是有代价的。选择排序是原地排序算法的一个示例。因为它通过交换列表内部元素的位置来工作，因此它只使用常数量的额外存储（在我们的实现中为一个元素）。相比之下，合并排序算法涉及对列表进行复制。这意味着它的空间复杂度是\
  \ `O(len(L))`。对于大型列表来说，这可能会是一个问题。\n\n### 10.2.2 利用函数作为参数\n\n假设我们想对一个格式为 `firstName\
  \ lastName` 的名字列表进行排序，例如列表 `['Chris Terman', 'Tom Brady', 'Eric Grimson', 'Gisele\
  \ Bundchen']`。图 10.6 定义了两个排序函数，然后使用这些函数以两种不同的方式对列表进行排序。每个函数都使用了 `str` 类型的 `split`\
  \ 方法。\n\n运行图 10.6 中的代码时，它会打印：\n\nSorted by last name = ['Tom Brady', 'Gisele Bundchen',\
  \ 'Eric Grimson']\n\nSorted by first name = ['Eric Grimson', 'Gisele Bundchen',\
  \ 'Tom Brady']\n\n### 10.2.3 在 Python 中排序\n\n大多数 Python 实现中使用的排序算法称为 `timsort`。其核心思想是利用这样一个事实：在很多数据集中，数据已经是部分排序的。Timsort\
  \ 的最坏情况性能与合并排序相同，但平均性能要好得多。\n\n![art](img/Art_P64.jpg)\n\n**图 10.6 排序名字列表**\n\n\
  如前所述，Python 方法 `list.sort` 接受一个列表作为第一个参数并修改该列表。相比之下，Python 函数 `sorted` 接受一个迭代对象（例如列表或视图）作为第一个参数，并返回一个新的排序后的列表。例如，代码：\n\
  \n```\nL = [3,5,2]\nD = {'a':12, 'c':5, 'b':'dog'}\nprint(sorted(L))\nprint(L)\n\
  L.sort()\nprint(L)\nprint(sorted(D))\nD.sort()\n```\n\n将输出：\n\n[2, 3, 5]\n\n[3,\
  \ 5, 2]\n\n[2, 3, 5]\n\n['a', 'b', 'c']\n\nAttributeError: 'dict' object has no\
  \ attribute 'sort'\n\n注意，当 `sorted` 函数应用于字典时，它返回的是字典键的排序后列表。相比之下，当 `sort` 方法应用于字典时，它会抛出异常，因为没有\
  \ `dict.sort` 方法。\n\n由于 `list.sort` 方法和 `sorted` 函数都可以带有两个额外的参数。`key` 参数的作用与我们在合并排序实现中的\
  \ `compare` 相同：它提供了要被使用的比较函数。`reverse` 参数指定列表是相对于比较函数按升序还是降序排序。例如，代码：\n\n```\nL\
  \ = [[1,2,3], (3,2,1,0), 'abc']\nprint(sorted(L, key = len, reverse = True))\n```\n\
  \n该代码按长度的反反序对 `L` 的元素进行排序，并打印：\n\n[(3, 2, 1, 0), [1, 2, 3], 'abc']\n\n`list.sort`\
  \ 方法和 `sorted` 函数都提供稳定排序。这意味着如果两个元素相对于排序时使用的比较值（在本例中为 `len`）相相等，那么它们在原始列表（或其他迭代对象）中的相对顺序在最终列表中会被保留。（由于\
  \ `dict` 中任何键不会出现超过一次，因此 `sorted` 应用于字典时是否稳定的这个问题就不存在了。）\n\n## 10.3 哈希表\n\n如果我们将合并排序与二分查找结合，就有了一种很好的列表搜索方法。我们使用合并排序在\
  \ `O(n*log(n))` 时间内对列表进行预处理，然后使用二分查找在 `O(log(n))` 时间内测试元素是否在列表中。如果我们搜索列表 `k` 次，整体时间复杂度为\
  \ `O(n*log(n) + k*log(n))`。\n\n这很好，但我们仍然可以问，当我们愿意进行一些预处理时，对数级已经是我们能做的最好的了吗？\n\n\
  当我们在第 5 章引入 `dict` 类型时，我们说字典使用了一种名为哈希（hashing）的技术来执行查找，其时间几乎与字典的大小无关。哈希表的基本原理非常简单。我们将键转换为整数，然后使用该整数作为列表的索引，这可以在常数时间内完成。原则上，任何类型的值都可以轻松转换为整数。毕竟，我们知道每个对象的内部表示都是位序列，任何位序列都可以被视为表示一个整数。例如，字符串\
  \ `'abc'` 的内部表示是位序列 `011000010110001001100011`，它可以被视为十进制整数 `6,382,179` 的表示。当然，如果我们想用字符串的内部表示作为列表的索引，那么列表将变得非常长。\n\
  \n如果键已经是整数了呢？想象一下，我们正在实现一个所有键都是美国社会安全号码的字典，这些是九位整数。如果我们用一个包含 `10⁹` 个元素的列表来表示字典，我们可以在常数时间内进行索引。当然，如果哈希表只包含一万条记录，这将浪费大量的空间。这引出了哈希函数的主题。哈希函数将较大的输入空间映射到较小的输出空间（例如自然数）。由于输出空间小于输入空间，哈希函数是一个多一映射，即不同的输入可能会映射到相同的输出——稍后会回到这个冲突。良好的哈希函数产生均匀分布；即范围内的每个输出概率相等，这最小化了冲突的概率。图\
  \ 10.7 使用了简单的哈希函数（回整数 `i` 除以整数 `j` 的余数 `i%j`）来实现以整数为键的字典。基本思想是将 `intDict` 实例表示为哈希桶的列表，每个桶是键值对的列表。通过将每个桶设为列表，我们通过存储哈希到同一个桶的所有值来处理冲突。哈希表的工作原理如下：实例变量\
  \ `buckets` 初始化为包含 `numBuckets` 个空列表的列表。为了存储或查找键 `dictKey`，我们使用哈希函数 `%` 将 `dictKey`\
  \ 转换为整数，并使用该整数索引 `buckets` 以找到与 `dictKey` 相关的哈希桶。我们线性搜索该桶（列表）以检查是否存在键 `dictKey`。如果我们正在进行查找且存在该键，我们只需返回与该键关联的值。如果不存在该键，我们返回\
  \ `None`。如果需要存储一个值，我们首先检查哈希桶中已存在该键的条目。如果是，则用新元组替换该条目，否则向桶中添加新条目。\n\n![art](img/Art_P65.jpg)\n\
  \n**图 10.7 使用哈希实现字典**\n\n处理冲突还有许多方法，有些比使用列表要高效得多。但如果哈希表相对于存储其中的元素数量足够大，并且哈希函数提供了对均匀分布的良好近似，那么这可能是最简单的机制。\n\
  \n注意，`__str__` 方法产生的字典表示与元素添加到字典的顺序无关，而是根据键偶然的哈希值进行排序的。这解释了为什么我们无法预测 `dict` 类型对象的键顺序。\n\
  \n\n\n以下代码首先构建了一个包含 17 个桶和 20 个条目的 `intDict`。条目的值是整数 `0` 到 `19`。键是通过 `random.choice`\
  \ 从 `0` 到 `10⁵ - 1` 范围内的整数中随机选择的。（我们我们将在第 14 章和第 15 章中讨论 `random` 模块。）然后，代码使用类中定义的\
  \ `__str__` 方法打印 `intDict`。最后，它通过遍历 `D.buckets` 打印各个哈希桶。（这是对信息隐藏原则的严重违背，但在教学上是有用的。）\n\
  \n```python\nimport random\n\nD = intDict(17)\n\nfor i in range(20):\n    #在 0 到\
  \ 10**5 - 1 的范围内选择一个随机整数\n    key = random.choice(range(10**5))\n    D.addEntry(key,\
  \ i)\n\nprint('The value of the intDict is:')\nprint(D)\n\nprint('\\n', 'The buckets\
  \ are:')\n\nfor hashBucket in D.buckets: #违反了抽象层\n    print(' ', hashBucket)\n```\n\
  \n当我们运行这段代码时，它输出了([120\n\nintDict 的值为：{99740:6,61898:8,15455:4,99913:18,276:19,63944:13,79618:17,51093:15,8271:2,3715:14,74606:1,33432:3,58915:7,12302:12,56723:16,27519:11,64937:5,85405:9,49756:10,17611:0}\
  \ 桶为：\n[]\n[(99740, 6), (61898, 8)]\n[(15455, 4)]\n[]\n[(99913, 18), (276, 19)]\n\
  []\n[]\n[(63944, 13), (79618, 17)]\n[(51093, 15)]\n[(8271, 2), (3715, 14)]\n[(74606,\
  \ 1), (33432, 3), (58915, 7)]\n[(12302, 12), (56723, 16)]\n[]\n[(27519, 11)]\n[(64937,\
  \ 5), (85405, 9), (49756, 10)]\n[]\n[(17611, 0)]\n\n当我们打破抽象层并查看 `intDict` 的表示时，发现某些哈希桶是空的。其他的包含一个、两个或三个条目——取决于冲突的数量。\n\
  \n`getValue` 的复杂度是多少？如果没有冲突，它将是 `O(1)`，因为每个哈希桶长度为 `0` 或 `1`。但可能会发生冲突。如果所有内容都哈希到同一个桶，它将是\
  \ `O(n)`，其中 `n` 是字典中的条目数，因为代码会对该桶执行线性搜索。通过使哈希表足够大，我们可以减少冲突的数量，使复杂度变为 `O(1)`。也就是说，我们可以用空间换时间。但这种权衡是什么？回答这个问题需要一点概率知识，因此我们将答案留到第\
  \ 15 章。\n\n____________\n\n由 Cormen、Leiserson 和 Stein 编写的算法教程对于对数学感到敬畏的人来说是一个极佳的资源。122\
  \ 存储整数的位数（通常称为字长）通常由计算机硬件决定。123 在某些实现中为 32 位，另一些为 64 位。124 我的字典将“间接（indirection）”一词定义为“缺乏直率和开放：欺骗性”。事实上，直到\
  \ 1950 年左右，计算机科学家意识到它是许多问题的解决方案之前，这个词通常带有负面含义。125 人们常说“任何计算问题都可以通过增加额外的间接层来解决”。三层间接，我们将这一观察归于\
  \ David J. Wheeler。Butler Lampson 等人的论文《分布式系统的身份验证：理论与实践》包含了这一观察。“Roger Needham\
  \ 将这一观察归于剑桥大学的 David Wheeler”。126 回想观察增长阶时，对数的底是无关的。127 但并不是效率最低的排序算法，正如一位美国总统候选人所暗示的那样。[`www.youtube.com/watch?v=k4RRi_ntc8`](http://www.youtube.com/watch?v=k4RRi_ntc8)。128\
  \ **快速排序（Quicksort）**由 C.A.R. Hoare 于 1960 年发明，概念上与归并排序相似，但复杂得多。它的优点只需要 `log(n)`\
  \ 的额外空间。与归并排序不同，它的运行时间取决于列表中排序元素之间的相对顺序。虽然它的最坏情况运行时间是 `O(n²)`，但其期望运行时间只有 `O(n*log(n))`。129\
  \ Timsort 由 Tim Peters 于 2002 年发明，因为他对 Python 之前使用的算法不满意。130 由于整数是随机选择的，如果你运行它，可能会得到不同的结果。\n\
  \n**11 绘图和关于类的更多信息**\n\n文本是传递信息的最佳方式……\n\n## 11.1 使用 PyLab 绘图\n\nPyLab 是 Python\
  \ 的标准模块，提供了许多 MATLAB 功能，“MATLAB 是一种用于算法开发、数据可视化和数值计算的高级计算语言和交互式环境。”许多网站也提供了极佳的教程。相反，在本章中，我们仅提供几个示例。\n\
  \n让我们从一个使用 pylab 产生图表的简单示例开始。\n\n```python\nimport pylab\n\npylab.figure(1) #创建图\
  \ 1\npylab.plot([1,2,3,4], [1,7,3,5]) #在图 1 上绘图\npylab.show() #在屏幕上显示图\n```\n\n\
  将在你的计算机显示器上出现一个窗口。它的具体外观取决于你的 Python 环境，但它看起来会类似于图 11.1（使用 Anaconda 产生）。如果你使用默认参数设置运行这段代码……^^(131](#fn131)\n\
  \n\n\n\n窗口顶部的栏包含多个推送按钮。最右侧的按钮会弹出一个带有选项的窗口，可用于调整图形的各个方面。左侧的下一个按钮用于将绘图写入文件.^(¹³³)。它左侧的按钮用于调整窗口中绘图的外观。接下来两个按钮用于缩放和平移。两个看起来像箭头的按钮用于查看之前的视图（类似于网络浏览器的前进和后退箭头）。最左侧的按钮用于在您操作完其他按钮后，将图形恢复到原始外观。\n\
  \n可以产生多个图形并将它们写入文件。这些文件可以命名为任何喜欢的名称，但它们的扩展名都是 `.png`。`.png` 文件扩展名表示该文件为便携网络图形（Portable\
  \ Networks Graphics）格式。这是一种表示图像的公共领域标准。\n\n### 代码\n\n```python\n| pylab.figure(1)\
  \ | #创建图形 1 |\n| pylab.plot([1,2,3,4], [1,2,3,4]) | #在图形 1 上绘图 |\n| pylab.figure(2)\
  \ | #创建图形 2 |\n| pylab.plot([1,4,2,3], [5,6,7,8]) | #在图形 2 上绘图 |\n| pylab.savefig('Figure-Addie')\
  \ | #保存图形 2 |\n| pylab.figure(1) | #回到处理图形 1 |\n| pylab.plot([5,6,10,3]) | #再次在图形\
  \ 1 上绘图 |\n| pylab.savefig('Figure-Jane') | #保存图形 1 |\n```\n\n生成图 11.2 中的两个图表，并将其保存为名为\
  \ `Figure-Jane.png` 和 `Figure-Addie.png` 的文件。\n\n注意最后一次调用 `pylab.plot` 只传递了一个参数。该参数提供了\
  \ y 值。相应的 x 值默认提供由 `range(len([5, 6, 10, 3]))` 产生的序列，这就是为什么在一种情况下它们的范围是从 0 到 3。\n\
  \nPyLab 有一个“当前图形”的概念。执行 `pylab.figure(x)`会将当前图形设置为编号为 `x` 的图形。随后执行的绘图函数将隐式地引用该图形，直到再次调用\
  \ `pylab.figure`。这解释了为什么写入文件 `Figure-Addie.png` 的图形是创建的第二个图形。\n\n![art](img/Art_P67.jpg)\n\
  \n**图 11.2 Figure-Jane.png（左）和 Figure-Addie.png（右）的内容**\n\n让我们来看另一个例子。代码：\n\n```python\n\
  principal = 10000 #初始投资\ninterestRate = 0.05\nyears = 20\nvalues = []\n\nfor i in\
  \ range(years + 1):\n    values.append(principal)\n    principal += principal*interestRate\n\
  \npylab.plot(values)\n```\n\n生成图 11.3 中左侧的图表。\n\n![art](img/Art_P68.jpg)\n\n**图\
  \ 11.3 绘制复合增长**\n\n如果我们看代码，可以推断出这是一个显示 10,000 美元初始投资在 5% 年复合利利率下增长的图表。然而，仅通过图表本身无法轻易推断出这一点。这是一个坏事。所有的图表都应该具有信息性的标题，并且所有的轴都应该标记。\n\
  \n如果我们在代码末尾添加以下行：\n\n```python\npylab.title('5% Growth, Compounded Annually')\n\
