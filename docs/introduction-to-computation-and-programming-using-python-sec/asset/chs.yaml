  \ Jonathan Flint, Emma S. J. Robinson, and Marcus R. Munafò (2013) “功率失效：为什么小样本量损害了神经科学的可靠性，，*Nature\
  \ Reviews Neuroscience*, 14: 365-376。\n\n²⁷⁰ 他们本应该获得学费退还，但没有。\n\n²⁷¹ 他们本应该获得战斗津贴，但没有。\n\
  \n²⁷² 我们可以通过观察`t-statistic`的符号很容易判断出是哪一个，但为了不冒犯这本书的潜在购买者，我们不会这样做。\n\n## 20 条件概率与贝叶斯统计](#toc.xhtml_chap-20)\n\
  \n到目前，我们采用的是统计学中所谓的`frequentist`（频率派）方法。我们完全根据数据的频率或比例从样本中得出结论。这是最常用的推断框架，并导致了书中前面介绍的统计假设检验和置信区间等成熟方法。原则上讲，它具有无偏的优势。结论完全基于观察到的数据。\n\
  \n然而，在某些情况下，另一种统计学方法——`Bayesian statistics`（贝叶斯统计）更为合适。考虑图 20.1 中的漫画。（²⁷³)。\n\n\
  ![art](img/Art_P235.jpg)\n\n**图 20.1 太阳爆炸了吗？**\n\n这里发生了什么？频率派知道只有两种可能：机器掷出了两个六点在撒谎，或者它没有掷出两个六在说真话。由于没有掷出两个六的概率是\
  \ `35/36` (97.22%)，频率派得出结论：机器可能在说真话，因此太阳可能爆炸了。^(²⁷⁴)\n\n贝叶斯派在建立概率模型时利用额外信息。他同意机器掷出两个六是不可能的，但他认为这种情况发生的概率需要与太阳没有爆炸的*先验*（a\
  \ priori）概率进行比较。他得出结论：太阳没有爆炸的可能性高于 97.22%，并决定赌“太阳明天还会出来”。\n\n### 20.1 条件概率](#toc.xhtml_Rh1-73)\n\
  \n贝叶斯推理的核心思想是`conditional probability`（条件概率）。\n\n在我们之前对概率的讨论中，我们依赖于事件相互独立的假设。例如，我们假设硬币出现正面或反面与是否为男性无关。这种假设很方便，但生活并不总是如此。在许多情况下，独立性是一个糟糕的假设。考虑随机选择的成年人是男性且体重超过\
  \ 180 磅的概率。男性的概率约为 `0.5` ([²⁷⁵),超过 180 磅的概率也约为 `0.5` ([²⁷⁶)。如果这些是独立的，男性且超过 180 磅的概率是\
  \ `0.25`。因此，更好的问题是：1) 选择的人是男性的概率；2) 在给定选择的人是男性的情况下，其体重超过 180 磅的概率。\n\n`A|B` 表示在\
  \ B 的条件下 A 的概率。对于上面的例子，`B` 是男性，`A` 是体重 > 180。因此，公式\n```\nP(male) * P(weight > 180\
  \ | male)\n```\n正是我们要的概率。如果 `P(A)` 和 `P(B)` 是独立的，则 `P(A|B) = P(A)`。\n\n一般情况下，如果\
  \ `P(B) ≠ 0`，\n\n![art](img/Art_P236.jpg)\n\n与普通概率一样，条件概率位于 0 到 1 之间。此外，如果 `Ā` 代表*不是\
  \ A*，则 `P(A|B) + P(Ā|B) = 1`。人们经常错误地假设 `P(A|B)` 等于 `P(B|A)`。没有理由认为这是成立的。例如，`P(male|Maltese)`\
  \ 的值约为 0.5，但 `P(Maltese|male)` 约为 0.000064。(²⁷⁷fn277))\n\n**手指练习**：估计随机选择的美国人是男性且体重超过\
  \ 180 磅的概率。假设人口的 50% 为男性，且男性的体重符合正态分布，均值为 210 磅，标准差为 30 磅。（提示：考虑使用经验法则。）\n\n公式 `P(A|B,\
  \ C)` 表示 B 和 C 同时成立的情况下 A 的概率。假设 `B` 和 `C` 相互独立，根据条件概率的定义和独立概率的乘法规则，可以得出\n\n![art\n\
  \n其中公式 `P(A, B, C)` 代表 A、B 和 全 同时为概率。\n\n同样，`P(A, B|C)` 表示在 C 的条件下 A 和 B 的概率。假设\
  \ A 和 B 相互独立\n\n\n\n\n\n`P(*A*, *B*|*C*) = P(*A*|*C*)∗P(*B*|*C*)`\n\n## 20.2 贝斯定理\n\
  \n假设一位四十多岁的无症状女性去进行乳腺检查，并收到了坏消息：检查结果为“阳性”。\n\n患有乳腺癌的女性在乳腺检查中获得`真阳性`结果的概率为 0.9。未患乳腺癌的女性在乳腺检查中出现`假阳性`的概率为\
  \ 0.07。\n\n我们可以使用条件概率来表示这些事实。假设：\n\n`Canc = has breast cancer`\n`TP = true positive`\n\
  `FP = false positive`\n\n使用这些变量，我们写下条件概率：\n\n`P(TP | Canc) = 0.9`\n`P(FP | not Canc)\
  \ = 0.07`\n\n在给定这些条件概率的情况下，一位乳腺检查阳性的四十多岁女性应该有多担心？她实际上患有乳腺癌的概率是多少？是 0.93 吗（因为假阳性率是\
  \ 7%）？还是更高？或更低？\n\n这是一个陷阱：我们没有提供足够的信息让你以合理的方式回答这个问题。要做到这一点，你需要知道四十多岁女性患乳腺癌的`先验概率`。四十多岁女性中患有乳腺癌的比例为\
  \ 0.008（1000 人中 8 人）。因此，未患乳腺癌的比例为 1 – 0.008 = 0.992。即：\n\n`P(Canc | woman in her\
  \ 40s) = 0.008`\n`P(not Canc | woman in her 40s) = 0.992`\n\n现在我们有了解决这位四十多岁女性应该有多担心所需的全部信息。为了计算她患乳腺癌的概率，我们使用所谓的`贝斯定理`（通常称为贝斯法则或贝斯规则）：\n\
  \n![art](img/Art_P238.jpg)\n\n在贝叶斯世界中，概率衡量的是一种`信念程度`。贝斯定理将我们在考虑证据之前和之后对某一命题的信念程度联系起来。等号左侧的公式\
  \ `P(A|B)` 是`后验`概率，即在考虑到 B 的情况下对 A 的信念程度。后验概率根据`先验` `P(A)` 以及证据 B 对 A 提供的`支持度`来定义。支持度是指在\
  \ A 成立时 B 成立的概率与 B 独立于 A 且成立的概率之比，即：![art](img/Art_P239.jpg)\n\n如果我们使用贝斯定理来估计该女性实际患乳腺癌的概率，我们得到（在我们的贝斯定理描述中，`Canc`\
  \ 扮演 A 的角色，`Pos` 扮演 B 的角色）：\n\n![art](img/Art_P240.jpg)\n\n测试呈阳性的概率为：\n\n`P(Pos)\
  \ = P(Pos|Canc) ∗ P(Canc) + P(Pos| not Canc) ∗ (1 − P(Canc))`\n\n所以：\n\n![art](img/Art_P241.jpg)\n\
  \n即：大约 90% 的乳腺检查阳性结果都是假阳性！贝斯定理在这里帮助了我们，因为我们对四十多岁女性患乳腺癌的先验概率有一个准确的估计。\n\n需要记住的是，如果我们从一个错误的先验概率开始，将该先验纳入我们的概率估计中会使估计变得糟糕而不是更好。例如，如果我们从以下先验概率开始：\n\
  \n`P(Canc | women in her 40's) = 0.6`\n\n我们将得出结论，认为假阳性率约为 5%，即乳腺检查阳性的四十多岁女性患乳腺癌的概率大约为\
  \ 0.95。\n\n**手指练习**：你正走过一片森林，看到一片看起来很美味的蘑菇。你用篮子装满了蘑菇，回家准备烹饪它们并给你的丈夫吃。但在烹饪之前，他要求你查阅一本关于当地蘑菇物种的书，以检查它们是否有毒。书上说，当地森林里\
  \ 80% 的蘑菇是有毒的。然而，你将蘑菇与书中的图片进行对比，并决定 95% 确定你的蘑菇是安全的。对于给丈夫吃这些蘑菇你应该有多放心（假设你不想变成寡妇）？\n\
  \n## 20.3 贝叶斯更新\n\n贝叶斯推理通过应用贝斯定理，提供了一种将新证据与先验信念相结合的原则方法。贝斯定理可以迭代应用：在观察到某些证据后，所得后验概率可以被视为先验概率，并根据新证据计算新的后验概率。这使得贝叶斯原则可以适用于各种证据，无论是一次性观察还是随着时间的推移而观察。这种程序被称为`贝叶斯更新`。\n\
  \n让我们来看一个例子。假设你有一个袋，里面装有等数量的三种骰子——每种骰子在掷时出现 6 的概率不同。A 型骰子掷出 6 的概率是五分之一，B 型骰子掷出 6\
  \ 的概率是六分之一，C 型骰子掷出 6 的概率是七分之一。假设我们随机挑选一个骰子并掷出。它出现了 6。这枚骰子是 A 型的概率是多少？\n\n为了回答这个问题，我们使用贝斯定理。假设每个骰子的先验概率都是\
  \ 1/3。在 A 型骰子上掷出 6 的概率是 1/5，B 型上是 1/6，C 型上是 1/7。\n\n`P(A|6) = P(6|A)P(A) / (P(6|A)P(A)\
  \ + P(6|B)P(B) + P(6|C)P(C))`\n`P(A|6) = (1/5)*(1/3) / ((1/5)*(1/3) + (1/6)*(1/3)\
  \ + (1/7)*(1/3))`\n`P(A|6) = (1/5) / (1/5 + 1/6 + 1/7) = 42/107 ≈ 0.393`\n\n如果我们再次掷一次骰子，它也出现了\
  \ 6，我们将之前的后验概率作为新的先验：\n\n`P(A|6,6) = P(6|A)P(A|6) / (P(6|A)P(A|6) + P(6|B)P(B|6)\
  \ + P(6|C)P(C|6))`\n`P(A|6,6) = (1/5)*(42/107) / ((1/5)*(42/107) + (1/6)*(35/107)\
  \ + (1/7)*(30/107))`\n`P(A|6,6) = 42 / (42 + 35 + 30) = 42/107`（等等，这里的数学是说明性的，逻辑遵循更新）。\n\
  \n实际上，让我们看看实现它的代码：\n\n```python\ndef bayes_update(prior, likelihoods):\n    evidence\
  \ = sum(p * l for p, l in zip(prior, likelihoods))\n    return [p * l / evidence\
  \ for p, l in zip(prior, likelihoods)]\n\nprior = [1/3, 1/3, 1/3]\nlikelihoods =\
  \ [1/5, 1/6, 1/7]\nposterior = bayes_update(prior, likelihoods)\nprint(posterior)\
  \ # [0.3925, 0.3271, 0.2804]\n```\n\n如果我们再次掷并得到了另一个 6：\n\n```python\nposterior =\
  \ bayes_update(posterior, likelihoods)\nprint(posterior) # [0.4615, 0.3063, 0.2322]\n\
  ```\n\n这种过程就是`贝叶斯更新`。\n\n\n\n\n\n好消息是，即使给出了误导性的先验，概率也会随着样本数量的增加而趋于真实。顺便提一下，它并不是单调收敛的。第\
  \ 120 次掷后的概率高于第 100 次之后——这意味着那 20 次投掷与 A 型骰子的一致性高于 B 型或 C 型骰子。\n\n如果我们一开始就有一个更好的先验，它收敛得会更快。如果我们回到\
  \ 1/3 作为初始先验，100 次掷后的概率为 0.0335，200 次掷后为 0.0205。\n\n***\n\n²⁸¹ [`imgs.xkcd.com/comics/frequentists_vs_bayesians.png`](http://imgs.xkcd.com/comics/frequentists_vs_bayesians.png)\n\
  \n²⁸² 如果你是频率派的支持者，请记住这幅漫画是讽刺——而不是对你宗教信仰的严肃批判。\n\n²⁸³ 这个数字可能让你觉得很高。事实确实如此。美国成人的平均体重比日本成年人重约\
  \ 40 磅。世界上成年人平均体重比美国高的国家只有三个：瑙鲁、汤加和密克罗尼亚。\n\n²⁸⁴ 体重超过`median` 的概率是 0.5，但这并不意味着体重超过`mean`\
  \ 的概率也是 0.5。不过，为了讨论起见，让我们假装它是如此。\n\n²⁸⁵ 我们所说的“马尔他人”是指来自马尔他岛国家的人。我们不知道世界上男性中有多大比例是可爱的小狗。\n\
  \n²⁸⁶ 在医学术语中，“阳性”测试通常是坏消息。它意味着发现了疾病标记物。\n\n²⁸⁷ 贝斯定理以托马斯·贝斯牧（Thomas Bayes，1701–1761）的名字命名，在他去世后两年首次发表。它由拉普拉斯普及，拉普拉斯在\
  \ 1812 年的《概率分析论》（*Théorie analytique des probabilités.*）中发表了该定理的现代表述。\n\n²⁸⁸ 这就是为什么医学界对于乳腺检查作为某些人群的常规筛查工具的价值存在相当争议的原因之一。\n\
  \n# 21 谎言、该死的谎言和统计学\n\n> “如果你无法证明你想证明的东西，就证明另一别的东西并假装它们是同一件事。在统计学与人类大脑碰撞后的迷晕中，几乎没有人会注意到这种区别。”^(²⁸⁹)\n\
  \n统计思维是一个相对新的发明。在有记录的历史的大部分时间内，事物都是通过定性而非定量来评估的。人们对某些统计事实可能直直觉感受（例如，女性通常比男性矮），但他们没有数学工具能让他们从轶证证据推导出统计结论。这从\
  \ 17 世纪中期开始发生变化，最著名的是约翰·格劳特（John Graunt）出版了《对死亡率表的自然与政治观察》（*Natural and Political\
  \ Observations Made Upon the Bills of Mortality*）。这项开创性工作利用统计分析从死亡名单中估计伦敦的人口，并尝试提供一个可以预测瘟疫传播的模型。\n\
  \n唉，从那时起，人们利用统计学误导人的次数比提供信息的次数多。有些人故意利用统计学进行误导；另一些人仅仅是无能。在本章中，我们将讨论人们可能被误导从统计数据中得出不当结论的几种方式。我们相信你只会将这些信息用于善——成为更好的消费者和更诚实的的统计信息提供者。\n\
  \n## 21.1 垃圾进，垃圾出 (GIGO)\n\n> “我有两次被[议员成员]问到：‘请问巴贝奇先生，如果你把错误的数字放入机器，会得到正确的答案吗？’我无法正确理解引发这种问题的思想混乱程度。”\
  \ —— 查斯·巴贝奇^(²⁹⁰)\n\n这里的信息很简单。如果输入数据有严重缺陷，无论如何进行统计处理都不会产生意义的结果。\n\n1840 年的美国人口普查显示，自由黑人和混血人的精神病率大约是奴隶黑人和混血人的十倍。结论是显而易见的。正如美国参议员（前副总统、未来国务卿）约翰·C·卡尔霍恩（John\
  \ C. Calhoun）所说：“这次普查中揭示的精神病数据是不可否认的。据此，我们的国家必须得出结论：废除奴隶对非洲人来说是一个诅咒。”很快就会发现这次普查充满了错误。据报道卡尔霍恩向约翰·昆西··亚当斯（John\
  \ Quincy Adams）解释道：“错误太多，以至于它们相互抵消，导致了与它们全部正确时相同的结论。”\n\n卡尔霍恩对亚当斯（可能是故意的）虚假回答基于一个经典错误，即`独立性假设`（`assumption\
  \ of independence`）。如果他在数学上更老练，他可能会说：“我相信测量误差是无偏的且相互独立的，因此均匀分布在平均值的两侧。”事实上，随后的分析显示，这些误差的偏差非常严重，以至于得出任何在统计学上有效的结论。^(²⁹¹)\n\
  \n## 21.2 测试是不完善的\n\n每个实验都应该被视为一个潜在的缺陷测试。我们可以对化学物质、疾病等进行测试。然而，我们测试的事件并不一定等于测试的结果。教授设计考试的目标是了解学生对某些学科的掌握程度，但考试的结果不应与学生理解的程度混淆。每个测试都有其固有的错误率。想象一个正在学习第二语言的学生被要求学习\
  \ 100 个单词的意思，但他只学会了其中 80 个。他的理解率是 80%，但他他在包含 20 个单词的测试中得 80%分的概率显然不是 1。\n\n测试可能同时存在假性阴性和假性阳性。正如我们在第\
  \ 20 章看到的，乳腺检查呈阴性并不保证没有乳腺癌，而乳腺检查呈阳性也不保证其存在。此外，测试概率和事件概率不是一回事。这在测试罕见事件时（例如罕见疾病的存在）尤为相关。如果假性阴性的成本很高（例如错过了某种严重但可治愈的疾病），则测试的设计应该是高度敏感的，即使以产生大量假性阳性为代价。\n\
  \n## 21.3 图片具有欺骗性\n\n图形在快速传递信息方面的用处不容置疑。然而，当随意（或恶意）使用时，图表可能具有很大的误导性。例如，考虑图 21.1\
  \ 中描述美国中西部州房屋价格的图表。\n\n![art](img/Art_P246.jpg)\n\n**图 21.1 美国中西部的房屋价格**\n\n看图 21.1\
  \ 左侧的图表，在 2006-2009 年期间房价非常稳定。但等一下！2008 年底不是发生了美国房地产的崩溃，随后是全球金融危机吗？确实发生了，如右侧图表所示。\n\
  \n\n\n\n\n这两张图表显示了完全相同的数据，但传达了非常不同的印象。左侧图表的设计目的是给人一种房价保持稳定的印象。在 y 轴上，设计者使用的刻度范围从荒谬的低至\
  \ 1,000 美元的平均房价到难以置信的高 500,000 美元平均房价。这在最小化上压缩了价格变化区域的所占的空间，从而给人一种变化相对较小的印象。右侧图表的设计目的是给人一种房价波动剧烈并随后崩溃的印象。设计者使用了狭窄的价格范围，因此价格波动的幅度被放大了。\n\
  \n图 21.2 中的代码生成了上面看到的两个图表，以及一个旨在对房价变动提供准确印象的图表。它使用了两种我们尚未见过的绘图功能。调用 `pylab.bar(quarters,\
  \ prices, width)` 会生成一个具有给定宽度条形的 `bar chart`（柱状图）。这些条形的左侧边缘是列表 `quarters` 中元素的值，条形的高度是列表\
  \ `prices` 中对应元素的值。函数调用 `pylab.xticks(quarters+width/2, labels)` 描述了与条形关联的标签。第一个参数指定了每个标签的放置位置，第二个参数是标签的文本。`yticks`\
  \ 函数的功能类似。调用 `plotHousing('fair')` 生成了图 21.3 中的图表。\n\n![art](img/Art_P247.jpg)\n\
  \n**图 21.2 房价绘图**\n\n![art](img/Art_P248.jpg)\n\n**图 21.3 房价的另一种视角**\n\n### 21.4\
  \ 与此不等于因此](#toc.xhtml_Rh1-79)^(²⁹²)\n\n已经证明，经常上课的大学学生的平均成绩高于偶尔上课的学生。我们这些教这些课程的人希望认为这是因为学生从我们教的课程中中学到了东西。当然，同样一种可能是这些学生获得更好成绩是因为更有可能上课的学生也更有可能努力学习。\n\
  \n`Correlation`（相关性）是衡量两个变量以相同方向移动程度的指标。如果 `x` 与 `y` 以相同方向移动，则这些变量为正相关。如果它们以相反的方向移动，则为负相关。如果没有关系，相关性为\
  \ 0。人的身高与其父母的身高呈正相关。玩视频游戏的时间与平均绩点（GPA）之间呈负相关。\n\n当两个事物相互相关时，人们倾向于假设其中一个导致了另一个。考虑北美流感的发病率。病例数以一种可预测的模式上升下降。夏天几乎没有病例；病例数在秋初开始增加，随着夏季临近开始下降。现在考虑入学的儿童人数。夏天学校里的儿童很少，入学人数在秋初开始增加，随着夏季临近而下降。\n\
  \n学校开学与流感发病率上升之间的相关性是不容置疑的。这导致许多人得出结论：入学是流感传播的重要因果因素。这可能是真的，但不能仅仅根据相关性得出此结论。相关性并不意味着因果关系！毕竟，相关性也可以同样容易用来证明“流感爆发导致学校开学”这一观点。或者也许两个方向上都没有因果关系，而是存在我们没有考虑过的某种`lurking\
  \ variable`（隐藏变量）导致了两者。事实上，流感病毒在凉爽干燥空气中的生存时间比在温暖潮湿空气中长得多，而在北美，流感季节和学期都与更凉爽干燥的天气相关。\n\
  \n只要有足够的回顾数据，总可能找到两个相关的变量，如图 21.4 中的图表所示。(²⁹³)\n\n![art](img/Art_P249.jpg)\n\n**图\
  \ 21.4 墨西哥柠檬能救命吗？**\n\n当发现此类相关性时，首先要做的是问是否存在一种解释该相关性的合理理论。\n\n陷入“与此不等于因此”（*cum hoc\
  \ ergo propter hoc*）谬误是非常危险的。2002 年初，大约有 600 万美国女性被开具激素替代疗法（HRT），因为认为这会显著降低患心血管疾病的风险。这一观点得到了几项声誉极高的发表研究的支持，这些研究表明使用\
  \ HRT 的女性心血管死亡率有所降低。\n\n许多女性及其医生在看到《美国医学协会杂志》发表一篇文章，文中声称 HRT 实际上增加了心血管疾病的风险时，感到非常惊讶。(²⁹⁴)这怎么会发生呢？\n\
  \n对某些早期研究的重新分析显示，接受 HRT 的女性可能来自饮食和运动习惯优于平均水平的群体。也许接受 HRT 的女性平均比研究中的其他女性更关注健康，因此接受\
  \ HRT 和心脏健康状况改善是共同原因导致的巧合效应。\n\n### 21.5 统计指标并未说明全貌](#toc.xhtml_Rh1-80)\n\n从数据集中可以提取无数不同的统计数据。通过仔细选择这些统计数据，可以对同一组数据传达不同的印象。一种良好的解药是查看数据本身。\n\
  \n1973 年，统计学家 F.J. Anscombe 发表了一篇论文，带有图 21.5 中的表格。它包含了四个数据集的 `<x, y>` 坐标。每个数据集的\
  \ `x` 平均值均为 9.0，`y` 平均值均为 7.5，`x` 方差均为 10.0，`y` 方差均为 3.75，且 `x` 与 `y` 的相关性均为 0.816。如果我们使用线性回归对每个数据集拟合一条直线，得到的结果都是\
  \ `y = 0.5x + 3`。\n\n![art](img/Art_P250.jpg)\n\n**图 21.5 安斯奎四线图统计数据**\n\n这意味着没有明显的方法可以区分这些数据集吗？不。人们只需要绘制数据就能看出这些数据集并不相同（图\
  \ 21.6）。\n\n![art](img/Art_P251.jpg)\n\n**图 21.6 安斯奎四线图的数据**\n\n教训很简单：如果可能，始终查看原始数据的表示形式。\n\
  \n### 21.6 采样偏差](#toc.xhtml_Rh1-81)\n\n第二次世界大战期间，每当盟军飞机从欧洲执行任务返回时，会对飞机进行检查，以查看防空炮火击中了哪里。根据这些数据，机械师加强了飞机上似乎可能被炮火击中的区域。\n\
  \n这有什么问题呢？他们没有检查那些因为被炮火击落而未能返回任务的飞机。也许这些未检查的飞机未能返回恰恰是因为被击中了造成伤害最大的地方。这种特定的错误被称为\
  \ `non-response bias`（无响应偏差）。这在调查中非常常见。例如，在许多大学，学生被要求在学期末的一次课程期间填写表格，对教授的课程质量进行评分。尽管此类调查的结果通常不尽人意，但可能会更糟。那些认为课程糟糕到不值得听的学生没有被包含在调查中。(²⁹⁵)\n\
  \n\n\n\n\n正如第 17 章中所讨论，所有的统计技术都基于这样一个假设：通过对总体的一个子进行采样，我们可以推断出整个总体的情况。如果使用随机抽样，我们可以对样本与整个总体之间的预期关系做出精确的数学陈述。遗憾的是，许多研究（特别是社会科学领域）是基于所谓的`便利`（或`偶然`）`采样`的。这涉及到根据获取样本的难易程度来选择样本。为什么有这么多心理学研究以大学生作为研究总体？因为他们在大学校园里很容易找到。便利样本*可能*具有代表性，但无法得知它实际上*是否*具有代表性。\n\
  \n## 21.7 背景至关重要 (#toc.xhtml_Rh1-82)\n\n从数据中读出比其际含义更深的内容要容易得多，尤其是在脱离背景观察数据时。2009\
  \ 年 4 月 29 日，CNN 报道道：“墨西哥卫生官员怀疑流感爆发已导致超过 159 人死亡，约 2500 人患病。”这听起来相当吓人——除非将其与美国每年因季节性流感导致的\
  \ 36,000 例死亡进行比较。\n\n一个经常被引用且准确的统计数据是：大多数交通事故发生在家 10 英里范围内。那又怎样？大多数驾驶都在家 10 英里范围内完成的！而且，在这个语境下，“家”是什么意思？该统计数据是使用汽车注册为“家”的地址计算的。难道仅仅通过将汽车注册在某个遥远的地方就能降低发生事故的概率吗？\n\
  \n减少美国枪支流行率的政府倡议的反对者喜欢引用这样一个统计数据：美国大约 99.8%的火器在任何一年内都不会被用于暴力犯罪。但如果没有一些背景，很难知道这意味着什么。这是否意味着美国没有多少枪支暴力？美国步枪协会报告说，美国有约\
  \ 3 亿支私有火器——3 亿的 0.2%是 60 万万啊！\n\n## 21.8 警惕外推法 (#toc.xhtml_Rh1-83)\n\n从数据中进行外推实在太容易了。我们在第\
  \ 18.1.1 节中就做过这一点，我们将线性回归得出的拟合结果扩展到回归所用数据之外。只有当人们对这样做有合理的理论依据时，才应该进行外推。要特别警惕直线外推。\n\
  \n考虑图 21.7 左侧的图表。它显示了 1994 年至 2000 年美国互联网使用量的增长情况。如你所见，直线提供了非常好的拟合效果。\n\n图 21.7\
  \ 右侧的图表利用这种拟合来预测未来几年使用互联网的人口百分比。这一预测有点难以置信。到 2009 年美国每个人都使用互联网似乎不太可能，到 2015 年超过\
  \ 140%的美国人口使用互联网更是不可可能的。\n\n![art](img/Art_P252.jpg)\n\n**图 21.7 美国互联网使用率的增长**\n\
  \n## 21.9 德克萨斯射手谬误 (#toc.xhtml_Rh1-84)\n\n想象你正在开车在德克萨斯的一条乡村路上。你看到一个谷仓，上面画了六个靶心，每个靶心的正中心都有一个弹孔。“是的，先生，”谷仓主人说，“我从没失手过。“没错，”他的配偶说，“德克萨斯州没有人比他的画笔更准了。”明白了吗？他先开了六枪弹，然后在弹孔周围画了靶心。\n\
  \n![art](img/Art_P253.jpg)\n\n**图 21.8 教授对学生扔粉笔的性感到苦恼**\n\n该类型的一个经典案例出现在 2001 年（(²⁹⁶）。它报道说，阿伯丁皇家康希尔医院的研究小组发现，“厌食症女性可能出生在春季或初夏……在\
  \ 3 月到 6 月之间，出生的厌食症患者比平均水平多出 13%，6 月本身又多出 30%。”\n\n让我们看看这些在 6 月出生的女性令人担忧的统计数据。团队研究了\
  \ 446 名被诊断为厌食症的女性，因此每月平均出生人数略高于 37 人。这表明 6 月份出生的人数为 48 人（37*1.3）。让我们写一个短程序（图 21.9）来估计这种情况纯粹由于偶然发生的概率。\n\
  \n![art](img/Art_P254.jpg)\n\n**图 21.9 6 月出生 48 名厌食症患者的概率**\n\n当我们运行 `juneProb(10000)`\
  \ 时，它打印出：\n\n```\nProbability of at least 48 births in June = 0.0427\n```\n\n纯粹由于偶然\
  \ 6 月至少出生 48 个婴儿的概率似乎是 4.27%。\n\n看起来，纯粹由于偶然 6 月至少出生 48 个婴儿的概率是 4.27%。所以也许阿伯丁的那些研究人员发现了一些门道。\n\
  \n但并不是他们的做法。相反，他们观察了数据，然后模仿德克萨斯射手一样，在 6 月份周围画了一个圈。正确的统计问题应该是：在 12 个月中，至少有一个月份出生了至少\
  \ 48 人的概率是多少？图 21.10 中的程序回答了这个问题。\n\n![art](img/Art_P255.jpg)\n\n**图 21.10 某月份出生\
  \ 48 名厌食症患者的概率**\n\n调用 `anyProb(10000)` 输出为：\n\n```\nProbability of at least 48\
  \ births in some month = 0.4357\n```\n\n看来，研究报告的结果完全可能是偶然发生，而不是出生月份与厌食症之间的真实关联。一个人不需要来自德克萨斯也会陷入射手谬误。\n\
  \n我们在这里看到，结果的统计显著性取决于实验进行的方式。如果阿伯丁小组最初是以假设 6 月出生更多厌食症患者为开始的，那么他们的结果值得考虑。但如果他们是以假设存在一个厌食症患者比例异常大的月份为开始的，那么他们的结果并没有什么说服力。实际上，他们测试了多个假设，可能应该应用费雪罗尼校正（参见第\
  \ 19.6 节）。\n\n阿伯丁小组为了测试他们新发现的假设可能会采取哪些后续步骤？一种可能性是进行**前瞻性研究**。在前瞻性研究中，人们从一组假设开始，在出现感兴趣的结果（在本例中为厌食症）之前招募受试者，然后跟踪一段时间。如果小组针对特定假设进行了前瞻性研究并得到了类似的结果，人们可能会被说服。\n\
  \n前瞻性研究执行可能非常昂贵且耗时。在**回顾性研究**中，人们必须以减少误导性结果的方法检查现有数据。一种常见技术（如第 18.4 节所示）是将数据分为训练集和留测试集。例如，他们可以从数据中随机选择\
  \ 446/2 名女性（训练集），并统计每月出生人数。然后他们可以将结果与剩余女性的每月出生人数（留测试集）进行比较。\n\n## 21.10 百分比会误导人\
  \ (#toc.xhtml_Rh1-85)\n\n\n\n\n\n一名投资顾问给客户打电话，报告其股票投资组合的价值在过去一个月内增长了 16%。他承认这一年里有些波动，但很高兴地报告，平均每月变化为+0.5%。当客户收到年度报告，发现自己的投资组合价值在这一年内实际上下降了时，他的惊讶程度难以想象。\n\
  \n他给顾问打了过去，指责他是个骗子。“在我看来，”他说，“我的投资组合下降了约 8%，而你却告诉我每个月增长了 0.5%。”“我没说过，”财务顾问回答道，“我告诉你的是平均每月变化是+0.5%。”当他检查月度账单时，这位投资者意识到他并没有被欺骗，只是被误导了。他的投资组合在上半年的每个月都下降了\
  \ 15%，然后在下半年的每个月又增长了 16%。\n\n在考虑百分比时，我们总是需要注意计算百分比的基数。在这种情况下，15%的下降所基于的平均基数比 16%的增长基数更高。\n\
  \n当百分比应用于较小的基数时，可能会特别具有误导性。你可能会读到某种药物的副作用是使某些疾病的发病率增加 200%。但如果该疾病的基础发病率非常低，例如每 1,000,000\
  \ 中有一个，你完全可能认为服用药物的风险被其带来的正面影响抵消了。\n\n### 21.11 统计学显著差异可能并不显著\n\n毛威理工学院（MIT）的一位招生官为了向世界证明\
  \ MIT 的录取过程是“性别盲目的”，大声宣布道：“在 MIT，男女的平均学分（GPA）之间没有显著差异。”同一天，一位热烈的女性霸权主义者宣称：“在 MIT，女性的平均学分显著高于男性。”学生报上的一位困惑的记者决定检查数据并揭露这个谎谎。但当她终于从大学那里弄到数据时，她得出结论两人都在说实话。\n\
  \n“在 MIT，女性的平均学分显著高于男性”这句话到底意味着什么？没有学过统计学的人（大多数人口）可能会得出结论，认为在 MIT 就学的男女 GPA 之间存在“有意义”的差异。相比之下，最近学过统计学的人可能只会得出：1）女性的平均\
  \ GPA 高于男性，且 2）GPA 差异可归于随机性的零假设可以在 5%的水平上被拒绝。\n\n假设在 MIT 学习的有 2500 名女性和 2500 名男性。进一步假设男性的平均\
  \ GPA 为 3.5，女性的平均 GPA 为 3.51，且男女 GPA 的标准差均为 0.25。大多数理智的人会认为 GPA 的差异“不显著”。然而，从统计学的角度来看，这种差异在接近\
  \ 2%的水平上是“显著的”。这种奇怪的二分法的根源是什么？正如我们在第 19.5 节中所示，当研究具有足够的功效（即有足够的样本）时，即使是不显著的差异在统计上也可以是显著的。\n\
  \n当研究非常小小时，会出现相关的问题。假设你抛了两次硬币，两次都是正面。现在，让我们使用第 19.3 节中看到的双侧单样本 t 检验来检验硬币是公平的零假设。如果我们假设正面的值为\
  \ 1，反面的值为 0，可以使用以下代码获取 p 值：\n\n```\nstats.ttest_1samp([1, 1], 0.5)[1]\n```\n\n它返回的\
  \ p 值为 0，表明如果硬币是公平的，连续两次正面的概率为零。\n\n## 21.12 回归谬误\n\n当人们未能考虑到事件的自然波动时，就会发生`回归谬误`。\n\
  \n所有运动员都有状态好的坏日子。当他们状态好时，他们试图不改变任何。然而，当他们遇到一系列异常糟糕的日子时，他们往往会尝试做出改变。无论这些改变实际上具有建设性，均值回归（第\
  \ 15.3 节）都会使得在接下来几天里，运动员的表现比改变之前的异常糟糕表现更好。但这可能无法他们假设存在`治疗效应`，即将表现的提高归功于他或她所做的改变。\n\
  \n诺贝尔奖得主心理学家丹尼·卡尼曼（Daniel Kahneman）讲述了一个以色列空军飞行教官的故事，他拒绝了卡尼曼关于“对表现的奖励比对错误的惩罚更有效”的断言。教官的观点是：“我有很多时候表扬飞行学员流练执行了某些特技动作。下一次他们尝试同样的动作时，通常做得更差。相反，我经常由于执行不力对着学员的耳机大吼，通常他下一次尝试时表现得更好。”^(²⁹⁷)人类想象治疗效应是自然现象，因为我们喜欢从因果角度思考。但有时这仅仅是运气问题。\n\
  \n在不存在治疗效应的情况下想象它可能是危险的。这可能导致人们相信疫苗是有害的，相信蛇油可以治愈所有的酸痛，或者相信只投资去年“跑赢市场”的共同基金是一个好策略。\n\
  \n![art](img/Art_P256.jpg)\n\n### 21.13 只要留心即可\n\n填充几百页关于统计滥用的历史是容易的也是有趣的。但到目前你可能已经收到了信息：用数字撒谎和用语言撒谎一样容易。在跳到结论之前，确保你理解实际上在测量什么，以及那些“统计学显著”的结果是如何计算出来的。正如达雷尔·哈夫（Darrell\
  \ Huff）所说，“如果你拷问数据足够，它会承认一切。”^(²⁹⁸)\n\n____________\n\n²⁹⁹ Darrell Huff, *How to\
  \ Lie with Statistics*, 1954.\n\n³⁰⁰ 查尔斯·巴贝（Charles Babbage，1791-1871）是一位英国数学家和机械工程师，被认为设计了第一台计算机。他从未成功制造出机器，但在\
  \ 1991 年根据他的计划制造了一个计算多项式的设备。\n\n³⁰¹ 我们应该注意卡尔恩是在 150 多年前。现在的政治家自然会找到滥用统计数据来支持错误的立场。\n\
  \n³⁰² 统计学家像律师和医生一样，有时使用拉丁语纯粹是为了显得博学。这句话的意思是“以此，因此由于此”。\n\n³⁰³ Stephen R. Johnson,\
  \ “The Trouble with QSAR (or How I Learned to Stop Worrying and Embrace Fallacy),”\
  \ *J. Chem. Inf. Model.*, 2008.\n\n³⁰⁴ Nelson HD, Humphrey LL, Nygren P, Teutsch\
  \ SM, Allan JD. Postmenopausal hormone replacement therapy: scientific review. *JAMA*.\
  \ 2002;288:872-881.\n\n³⁰⁵ 转向在线调查让不上课的学生也能参与调查，这对教授们的自尊心不是好事。\n\n³⁰⁶ Eagles, John,\
  \ et al., “Season of birth in females with anorexia nervosa in Northeast Scotland,”\
  \ *International Journal of Eating Disorders*, 30, 2, September 2001.\n\n³⁰⁷ *Thinking,\
  \ Fast and Slow*, Daniel Kahneman, Farrar, Straus and Giroux, 2011, p.175.\n\n³⁰⁸\
  \ Darrell Huff, *How to Lie with Statistics*, 1954\\.类似的话被归功于诺贝尔奖经济学家罗纳德·科斯（Ronald\
  \ Coase）。\n\n\n\n\n世界上数字数据的增长速度已经快到了人类难以想象的程度。自从 20 世纪 80 年代以来，全球的数据存储容量大约每三年翻一倍。在你阅读这一章的时间内，全球存储器将增加约\
  \ `10¹⁸` 比的数据。要对如此巨大的数字产生联系并不容易。一种思考方式是：`10¹⁸` 个加拿大加分硬币的表面积大约是地球的两倍。\n\n当然，数据更多并不总是意味着更有用的信息。演化是一个缓慢的过程，遗憾的是，人类大脑吸收数据的能力并没有同样每三年翻一倍。世界正在使用的一种试图从“大数据”中榨取更多有用信息的方法是`统计机器学习`。\n\
  \n机器学习很难给出一个精确的定义。在某种意义上，每个有用的程序都在学习某些东西。例如，`牛顿法`的实现学习了多项式的根。最早的定义之一由美国电气工程师、计算机科学家亚瑟·塞缪尔（Arthur\
  \ Samuel）^(³⁰⁹)提出，他将其定义为“赋予计算机无需显式编程即可学习能力的研究领域”。\n\n人类通过两种方式学习事物：记忆和泛化。我们使用记忆来积累单个的事实。例如，在英国，小学生可能会学习一份英国君主名单。人类则使用`泛化`从旧的事实推导出新的的事实。例如，一名政治学学生可能会观察大量政客的行为，并从这些观察中进行泛化，得出所有政客在竞选期间都会撒谎的结论。\n\
  \n计算机科学家谈论机器学习时，他们通常指的是一种编写程序的学科，这些程序能够自动学习从数据中的隐式模式中做出有用的推理。例如，`线性回归`（参见第 18 章）学习一条作为示例集合模型的曲线。该模型随后可以被用于对之前未见的示例进行预测。其基本范式是：\n\
  \n1. 观察一组示例（通常称为`训练数据`），它们代表了关于某些统计现象的不完全信息\n2. 使用推理技术创建一个可能生成了所观测示例的模型，以及\n3. 使用该模型对之前未见的示例进行预测。\n\
  \n假设例如，你得到了图 22.1 中的两组名字和图 22.2 中的`特征向量`。\n\n![art](img/Art_P257.jpg)\n**图 22.1：两组名字**\n\
  \n![art](img/Art_P258.jpg)\n**图 22.2：为每个名字关联特征向量**\n\n向量的每个元素都对应于该人的某个方面（即`特征`）。基于这些关于这些历史人物的有限信息，你可能会推断出，为这些示例中的每一个分配标签\
  \ `A` 或标签 `B` 的过程，其意图是将高大的总统与较矮的总统区分开来。\n\n机器学习有许多不同的方法，但所有方法都试图学习一个对所提供示例进行泛化的模型。所有方法都包含三个部分：\n\
  \n* 模型的表示，\n* 一个用于评估模型好坏的`目标函数`，以及\n* 一个用于学习最小化或最大化`目标函数`值的模型的`优化方法`。\n\n广而言之，机器学习算法可以分为监督学习或无监督学习。\n\
  \n在`监督学习`中，我们从一组特征向量/值对开始。目标是从这些对中推导出一条规则，用于预测与之前未见的特征向量相关的值。`回归模型`将实数与每个特征向量关联。`分类模型`将有限数量标签之一与每个特征向量关联.^(³¹⁰)\n\
  \n在第 18 章中，我们研究了一种回归模型，`线性回归`。每个特征向量都是一个`x 坐标`，与其关联的值是相应的`y 坐标`。从特征向量/值对集中，我们学习了一个可以用于预测任何`x\
  \ 坐标`相关的`y 坐标`的模型。\n\n现在，让我们来看一个简单的分类模型。给定我们在图 22.1 中标记为 `A` 和 `B` 的总统集合，以及图 22.2\
  \ 中的特征向量，我们可以生成图 22.3 中的特征向量/标签对。\n\n![art](img/Art_P259.jpg)\n**图 22.3 总统的特征向量/标签对**\n\
  \n从这些标记示例中，学习算法可能会推断出所有高大的总统应该标记为 `A`，所有矮矮的总统标记为 `B`。当被要求为`[美国, 总统, 189 cm.]`(³¹¹)分配标签时，它将使用它学到的规则选择标签\
  \ `A`。\n\n监督机器学习在实践中广泛用于诸如检测信用卡欺诈和向人们推荐电影等任务。\n\n在`无监督学习`中，我们得到一组特征向量但没有标签。无监督学习的目标是发现特征向量集合中的潜在结构。例如，给定一组总统特征向量，无监督学习算法可以将总统分为高和矮，或者分为美国和法国人。广而言之，无监督学习的方法可以分为聚类方法或学习潜在变量模型的方法。\n\
  \n`潜在变量`是一个无法直接观测到、但可以从观测变量的值推断出来的变量。例如，大学的招生官尝试根据中学成绩和标准化测试表现等可观测值，推断申请者成为成功学生的概率（潜在变量）。学习潜在变量模型的方法非常丰富，但我们没有在书中涵盖这些方法。\n\
  \n`聚类`将一组示例划分为组（称为`簇`），使得同一组内的示例之间的相似性大于它们与其他组示例之间的相似性。例如，遗传学家使用聚类来寻找相关的基因。许多流行的聚类方法非常简单。\n\
  \n我们在第 23 章中介绍了一种广泛使用的聚类算法，并在第 24 章中介绍了几种监督学习的方法。在本章的剩余部分，我们将讨论构建特征向量以及计算两个特征向量相似性的不同方法。\n\
  \n22.1 特征向量\n\n`信噪比`（`SNR`）的概念在工程和科学的许多领域都有应用。精确定义随应用而异，但基本思想很简单。将其理解为有用输入与无关输入之间的比例。在餐厅里，信号可能是你晚餐伙伴的声音，而噪声是其他食客的声音.^(³¹²)将信号与噪声分离并不总是容易。当处理得不好时，噪声可能会成为一种掩盖信号中真相的干扰。\n\
  \n\n\n\n特征工程的目的是从可用数据中分离出那些对信号有贡献的特征与那些仅仅是噪声的特征。未能很好完成这项工作可能会导致糟糕的模型。当数据的维度（即不同特征的数量）相对于样本数量很大时，这种危险就尤为高。\n\
  \n成功的特征工程是一个抽象过程，它将可能获得的海量信息简化为具有有效泛化价值的信息。例如，假设你的目标是学习一个模型来预测某人是否可能患心脏病。某些特征（例如年龄）可能高度相关；而其他特征（例如他们是否是左手子）的相关性可能较低。\n\
  \n有一些特征剔除技术可以用于自动识别给定特征集中哪些特征最可能有帮助。例如，在监督学习的背景下，可以选择与样本标签相关性最强的特征。然而，如果初始时根本没有相关的特征，那么这些特征剔除技术也无济于事。假设我们用于心脏病示例的原始特征集包含了身高和体重。可能会出现这种情况：虽然身高和体重对心脏病的预测性都不高，但体质量指数（`BMI`）却是。虽然\
  \ `BMI` 可以通过身高和体重计算出来，但这种关系（以千克为单位的体重除以米为单位的身高的平方）太复杂，目前的机器学习技术无法自动发现。成功的机器学习通常涉及具有领域知识的人对特征的设计。\n\
  \n在无监督学习中，问题更加困难。通常，我们根据直觉选择特征，认为哪些特征可能与我们想要寻找的结构相关。然而，依赖对特征潜在相关性的直觉是有问题的。关于一个人的牙科历史是否是未来心脏病的良好预测指标，你的直觉有多准呢？\n\
  \n考虑图 22.4，它包含一个特征向量以及与每个向量相关的标签（爬行动动物或否）的表格。\n\n![art](img/Art_P260.jpg)\n\n图 22.4\
  \ 各种动物的名称、特征和标签\n\n如果一个监督机器学习算法（或人类）只得到关于眼镜蛇的信息——即只有表格的第一行——除了记住眼镜蛇是爬行动动物这一事实外，做不了什么。现在，让我们加上响蛇的信息。我们可以开始泛化，并可能推断出规则：如果一种动物产蛋、有鳞片、有毒、冷血且没有腿，它就是爬行动动物。\n\
  \n现在，假设我们要求判断波波�蛇是否是爬行动动物。我们可能会回答“否”，因为波波�蛇既有毒也不产蛋。但这是一个错误的答案。当然，试图从两个示例中泛化可能会导致我们走入歧途，这并不意外。一旦我们将波波�蛇加入训练数据，我们可能会制定新规则：如果一种动物有鳞片、冷血且无腿，它就是爬行动动物。通过这样做，我们将“产蛋”和“有毒”这两个特征作为与分类问题无关的特征给舍弃了。\n\
  \n如果我们使用新规则来分类鳄鱼，我们会错误地得出因为它有腿，所以它不是爬行动动物。一旦我们将鳄鱼加入训练数据，我们就会重新制定规则，允许爬行动动物拥有零条或四条腿。当我们观察箭毒蛙时，我们正确地得出结论它不是爬行动动物，因为它不是冷血的。然而，当我们使用当前的规则来分类鲑鱼时，我们错误地得出鲑鱼是爬行动动物。我们可以为规则增加更多复杂性来将鲑鱼与鳄鱼区分开，但这是一场注定失败的战斗。我们没有办法修改规则来正确地分类鲑鱼和蟒子，因为这两个物种的特征向量是完全相同的。\n\
  \n这类问题在机器学习中比比常见。拥有包含足够完美分类事物的信息的特征向量是非常稀见的。在这种情况下，问题在于我们没有足够的特征。\n\n如果我们包含了爬行动动物卵具有羊膜这一事实，我们就可以设计一种规则将爬行动动物与鱼类分开。遗憾的是，在机器学习的大多数实际应用中，无法构建允许完美区分的特征向量。\n\
  \n这是否意味着我们因为所有可用特征仅仅是噪声就应该放弃？不。在这种情况下，“鳞片”和“冷血”是作为爬行动动物的必要条件，但不是充分条件。“如果动物有鳞片且冷血，就是爬行动动物”的规则不会产生任何假阴性，即任何被分类为非爬行动动物的动物确实不是爬行动动物。然而，它会产生一些假阳性，即某些分类为爬行动动物的动物并不是爬行动动物。\n\
  \n## 22.2 距离量\n\n在图 22.4 中，我们使用四个二进制特征和一个整数特征描述了动物。假设我们想使用这些特征来评估两种动物的相似性，例如，询问响蛇与波波�蛇还是与箭毒蛙更相似。\n\
  \n进行此类比较的第一步是将每种动物的特征转换为数字序列。如果我们说 `True` = `1` 且 `False` = `0`，我们得到以下特征向量：\n\n\
  响蛇：1,1,1,1,0\n波波�蛇：0,1,0,1,0\n箭毒蛙：1,0,1,0,4\n\n比较数字相似性有许多方法。对于等长向量，最常用的指标基于参数 `p`（该参数至少为\
  \ 1），它定义了在遍历向量 `V` 和 `W` 距离时可以遵循的路径类型。如果向量长度为二，这很容易可视化，因此可以使用笛卡尔坐标系表示。考虑图 22.5 中的图片。\n\
  \n![art](img/Art_P262.jpg)\n\n图 22.5 距离量的可视化\n\n左下角的圆离交叉点还是星形近？这取决于。如果我们走直线，交叉点近。勾股定理告诉我们交叉点距离圆\
  \ 8 的平方根，大约 2.8 个单位，而我们可以很容易地看到星形距离圆 3 个单位。这些距离被称为欧几里得距离，对应于使用 `p=2` 的闵可夫斯距离。但想象图片中的线条对应街道，我们必须沿着街道从一个地方到另一个地方。星形距离圆仍然是\
  \ 3 个单位，但交叉点现在是 4 个单位。这些距离被称为曼顿距离，对应于使用 `p=1` 的闵可夫斯距离。图 22.6 包含一个实现闵可夫斯距离的函数。\n\n\
  ![art](img/Art_P263.jpg)\n\n图 22.6 闵可夫斯距离\n\n![art](img/Art_P264.jpg)\n\n图 22.7\
  \ 包含类 `Animal`。它定义动物之间的距离为关联的特征向量之间的欧几里得距离。\n\n\n\n\n\n图 22.8 包含一个函数，它可以比较一组动物并生成一个显示两两之间距离的表格。该代码使用了我们之前没有过的\
  \ PyLab 绘图功能：`table`。\n\n`table` 函数会生成一个（惊讶地！）看起来像表格的图表。关键字参数 `rowLabels` 和 `colLabels`\
  \ 用于为行和列提供标签（在本例中为动物的名称）。关键字参数 `cellText` 用于提供表格单元格中显示的数值。在示例中，`cellText` 绑定到 `tableVals`，它是一个字符串的嵌套列表。`tableVals`\
