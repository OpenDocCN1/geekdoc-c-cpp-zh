  \ 100 次相比，当我们每次实验抛 1000 次时，结果的分布要密集得多。\n\n![art](img/Art_P137.jpg)\n\n**图 15.20\
  \ 抛硬币结果的直方图**\n\n## 15.4.1 概率分布](#toc.xhtml_Rh2-42)\n\n直方图是**频率分布**的描绘。它告诉我们随机变量在某个范围内取某个值的频率，例如，硬币出现正面的比例落在\
  \ 0.4 到 0.5 之间的频率是多少。它还提供了关于各种范围相对频率的信息。例如，我们可以很容易看到，比例落在 0.4 到 0.5 之间的频率远高于落在 0.3\
  \ 到 0.4 之间的频率。**概率分布**通过给出随机值在某个范围内取某个值的概率，捕捉了相对频率的概念。\n\n概率分布分为两类：离散概率分布和连续概率分布，取决于它们定义的是离散随机变量还是连续随机变量的概率分布。**离散随机变量**可以取有限值集中的一个值，例如与掷骰子相关的值。**连续随机变量**可以取两个实数之间的任意无限实值，例如在\
  \ 0 英里/小时到汽车最高速度之间行驶的汽车的速度。\n\n**离散概率分布**更容易描述。由于变量可以取的值是有限的，因此可以通过简单地列出每个值的概率来描述该分布。\n\
  \n**连续概率分布**更为复杂。由于可能的值是无限的，连续随机变量取某个特定值的概率通常为 0。例如，汽车行驶速度恰好为 81.3457283 英里/小时概率可能是\
  \ 0。数学家喜欢使用**概率密度函数**（通常缩写为 **PDF**）来描述连续概率分布。PDF 描述了随机变量落在两个值之间的概率。将 PDF 想象成定义了一条曲线，其中\
  \ x 轴上的值落在随机变量的最小值和最大值之间。（在某些情况下，x 轴是无限长的）。假设 `x1` 和 `x2` 位于随机变量的范围内，变量在 `x1` 和\
  \ `x2` 之间取值的概率是曲线在 `x1` 和 `x2` 之间的面积。图 15.21 显示了表达式 `random.random()` 和 `random.random()\
  \ + random.random()` 的概率密度函数。\n\n![art](img/Art_P138.jpg)\n\n**图 15.21 random 的\
  \ PDF**\n\n对于 `random.random()`，0 到 1 下的面积为 1。这是合理的，因为我们知道 `random.random()` 落在\
  \ 0 到 1 之间的概率是 1。另一方面，如果我们考虑 `random.random()` 在 0 到 0.4 之间的曲线下面积为 0.2，这意味着 `random.random()`\
  \ 落在 0.2 到 0.4 之间的概率是 0.2。同样，`random.random() + random.random()` 在 0 到 2 下的面积为 1，在\
  \ 0 到 1 下的面积为 0.5。注意，`random.random()` 的 PDF 表示相同长度的区间概率相同，而 `random.random() +\
  \ random.random()` 的 PDF 则表示某些区间概率更高。\n\n## 15.4.2 正态分布](#toc.xhtml_Rh2-43)\n\n\
  **正态分布**（或**高斯分布**）由以下概率密度函数定义：\n\n![art](img/Art_P139.jpg)\n\n其中 *μ* 是均值，*σ* 是标准差，*e*\
  \ 是欧拉数（约 2.718）。(¹⁹⁷)\n\n如果你不想研究这个公式，也没关系。只需记住正态分布在均值处达到峰值，在均值上下对称下降，并渐近于 0。它们具有非常良好的数学性质，完全由两个参数确定：均值和标准差。了解了这两个参数等同于了解了整个分布。\n\
  \n图 15.22 显示了均值为 0、标准差为 1 的正态分布的部分 PDF。我们只能显示 PDF 的一部分，因为正态分布的尾部趋向于 0 但并没有达到。从原理上讲，没有任何值的出现概率为零。\n\
  \n在 Python 程序可以通过调用 `random.gauss(mu, sigma)` 轻松生成正态分布，该函数会从均值为 mu、标准差为 sigma 的正态分布中随机选择一个浮点数。\n\
  \n\n\n\n正态分布经常被用于构建概率模型，因为它们具有良好的数学性质。当然，如果一个模型在数学上很完美，但它对实际数据的建模很糟糕，那么它就毫无用处。幸运的是，许多随机变量具有近似正态分布。例如，植物和动物的物理特性（如身高、体重、体温）通常具有近似正态分布。重要的是，许多实验的测量误差服从正态分布。这一假设在\
  \ 19 世纪初被德国数学家和物理学家卡尔·高斯（Karl Gauss）采用，他在分析天文数据时，假设测量误差服从正态分分布（这导致了正态分布在许多科学领域中被称为`高斯分布`）。\n\
  \n正态分布的优点之一是，与均值和标准差无关，包含固定比例数据所需的、偏离均值的标准差倍数是一个常数。例如，~68.27% 的数据将始终位于均值的一个标准差范围内，~95.45%\
  \ 位于两个标准差范围内，而 ~99.73% 位于三个标准差范围内。这有时被称为 `68-95-99.7` 规则，但通常被称为 `经验规则`（empirical\
  \ rule）。\n\n该规则可以通过对定义正态分布的公式进行积分来获得曲线下的面积。查看图 15.22，很容易相信曲线下方总面积的三三分之二位于 –1 和 1\
  \ 之间，大约 95% 位于 -2 和 2 之间，几乎所有的数据位于 -3 到 3 之间。但这仅仅是一个例子，从单个示例中进行推广总是危险的。我们可以根据维基百科不可置疑的权威性来接受经验规则。然而，为了稳妥起见，并作为引入一个值得\
  \ true Python 库的理由，让我们自己检查一下。\n\n`SciPy` 库包含了许多科学家和工程师常用的数学函数。`SciPy` 被组织成多个模块，涵盖不同的科学计算领域，例如信号处理和图像处理。我们将在本书后续部分使用\
  \ `SciPy` 的许多函数。在这里，我们使用 `scipy.integrate.quad` 函数，它可以找到函数在两点之间积分的近似值。\n\n`scipy.integrate.quad`\
  \ 函数有三个必需参数和一个可选参数：\n\n*   一个被积分的函数或方法（如果函数接受多个参数，则它沿与第一个参数对应的轴上进行积分）。\n*   一个表示积分下限的数字，\n\
  *   一个表示积分上限的数字，以及\n*   一个可选的元组，用于为被积分函数除第一个参数以外的所有参数提供值。\n\n`quad` 函数返回一个包含两个浮点数的元组。第一个是积分值的近似值，第二个是结果绝对误差的估计值。\n\
  \n例如，考虑在 0 到 5 区间评估一元函数 `abs` 的积分。我们不需要任何复杂的数学知识来计算此曲线下的面积：它仅仅是一个底和高均为 5 的直三角形的面积，即\
  \ 12.5。因此，以下结果并不令人意外：\n\n```\nprint scipy.integrate.quad(abs, 0, 5)[0]\n```\n\n\
  打印出 12.5。（`quad` 返回的元组中的第二个值大约为 10^(-13)，表明近似值非常准确。）\n\n图 15.23 中的代码计算了一些随机选择的均值和标准差下正态分布部分部分的面积。注意\
  \ `gaussian` 是一个三元函数，因此代码\n\n```\nprint scipy.integrate.quad(gaussian, -2, 2, (0,\
