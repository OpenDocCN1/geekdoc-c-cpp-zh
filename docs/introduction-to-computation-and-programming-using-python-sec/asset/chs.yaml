  \ `colWidths`。它绑定到一个浮点数列表，给出表格中每列的宽度（以英寸为单位）。代码 `table.scale(1, 2.5)` 指令 PyLab 保持单元格的水平宽度不变，但将单元格的高度增加\
  \ 2.5 倍（这样表格看起来更漂亮）。\n\n![art](img/Art_P265.jpg)\n\n**图 22.8 构建动物对之间距离的表格**\n\n\
  如果我们运行以下代码：\n\n```python\nrattlesnake = Animal('rattlesnake', [1,1,1,1,0])\nboa\
  \ = Animal('boa\\nconstrictor', [0,1,0,1,0])\ndartFrog = Animal('dart frog', [1,0,1,0,4])\n\
  animals = [rattlesnake, boa, dartFrog]\ncompareAnimals(animals, 3)\n```\n\n它会产生图\
  \ 22.9 中的表格并将其保存为名为 `distances` 的文件。\n\n正如你可能预期的那样，眼镜蛇和波��之间的距离小于这两种蛇与箭蛙之间的任何距离。顺便注意一下，箭蛙比波��更离眼镜蛇近一点。\n\
  \n![art](img/Art_P266.jpg)\n\n**图 22.9 三只动物之间的距离**\n\n现在，我们在上述代码的最后一行之前插入以下行：\n\n\
  ```python\nalligator = Animal('alligator', [1,1,0,1,4])\nanimals.append(alligator)\n\
  ```\n\n它产生了图 22.10 中的表格。\n\n![art](img/Art_P267.jpg)\n\n**图 22.10 四只动物之间的距离**\n\n\
  也许你很惊讶，鳄鱼离箭蛙比离眼镜蛇或波��要近得多。花一分钟思考一下为什么。\n\n鳄鱼的特征向量与眼镜蛇的特征向量有两个地方不同：是否有毒以及腿的数量。鳄鱼的特征向量与箭蛙的特征向量三个三个不同：是否有毒、是否有鳞片以及是否是冷血动物。然而，根据我们的距离度量，鳄鱼比眼镜蛇更像箭蛙。这是怎么？\n\
  \n问题的根源在于不同的特征具有不同的值范围。除了一个特征外，所有特征的范围都在 0 到 1 之间，但腿的数量范围是从 0 到 4。这意味着当我们计算欧几里得距离时，腿的数量获得了不成比例的权重。让我们看看如果将特征转换为二进制特征（如果动物没有腿则值为\
  \ 0，否则为 1）会发生什么。\n\n![art](img/Art_P268.jpg)\n\n**图 22.11 使用不同特征表示的距离**\n\n这看起来要合理得多。\n\
  \n当然，只使用二值特征并不总是方便的。在第 23.4 节 中，我们将介绍更通用的方法来处理特征之间的尺度差异。\n\n____________\n\n³¹⁹\
  \ Samuel 可能最为人知的身份是一个玩西洋国际棋程序的作者。该程序从 20 世纪 50 年代开始编写，并一直持续到 70 年代，在那个时代是非常令人深刻的，尽管按现代标准来看并不特别。然而，在编写程序期间，Samuel\
  \ 发明了几种今天仍在使用的技术。除其他外，Samuel 的国际棋程序可能是历史上编写的第一个根据“经验”进行改进的程序。\n\n³²⁰ 大多数机器学习文献使用“class”（类）而不是“label”（标签）。由于我们在书的其他地方用“class”一词表示其他含义，我们将坚持使用“label”来表示这个概念。\n\
  \n³²¹ 如果你好奇，托马斯·杰斐逊身高 189 厘米。\n\n³²² 除非你的晚餐对象极其无聊。在这种情况下，你晚餐约会的话题变成了噪声，而隔壁桌的对话就成了信号。\n\
  \n³²³ 由于特征之间通常强相关，这可能导致大量的冗余特征。虽然有更复杂的消除技术，但我们在书中没有介绍它们。\n\n³²⁴ 它们是保护层，允许卵在陆地上而不是水中产。\n\
  \n³²⁵ 这个问题听起来并不愚蠢。自然学家和毒理学家（或试图增强效果的人）可能会对这个问题给出不同的答案。\n\n³²⁶ 另一种流行的距离度量是余弦相似度。它捕捉的是角度差异而不是幅度。这对高维向量非常有用。\n\
  \n³²⁷ 当 `p < 1` 时，会发生奇怪的事情。例如 `p = 0.5` 以及点 `A = (0,0)`, `B = (1,1)` 和 `C = (0,1)`。如果你计算这些点之间的两两距离，你会发现\
  \ `A` 到 `B` 的距离是 4，`A` 到 `C` 的距离是 1，而 `C` 到 `B` 的距离是 1。常识告诉我们，通过 `C` 从 `A` 到 `B`\
  \ 的距离不会小于直接距离。（数学家将其称为三角不等式，即任何三角形任意两边之和大于第三边的长度。）\n\n³²⁸ マン哈顿岛是纽约市人口密度最高的区。在岛的大部分街道呈矩形网格布局，因此使用\
  \ `p=1` 的闵可夫斯距离可以很好地模拟从一个地方到另一个地方的距离。在曼哈顿开车则是完全另一回事。\n\n23 聚类\n\n无监督学习涉及在无标记数据中发现隐藏结构。常用的机器学习技术是聚类。\n\
  \n聚类可以定义为将对象组织成在某些方面相似的组。一个关键问题是定义“相似”含义。考虑图 23.1 中的图，它显示了 13 个人的身高、体重和衬衫颜色。\n\n\
  ![art](img/Art_P269.jpg)\n\n**图 23.1 高身高、体重和衣服种类**\n\n聚类是一个优化问题。目标是在满足一组约束条件下，找到一组优化目标函数的簇。给定用于判断两个示例之间有多近的距离度量，我们需要定义一个最小化同一簇示例距离的目标函数，即最小化簇内示例的差异性。\n\
  \n\n\n\n\n我们称为“变异性”（variability）的衡量标准，用于衡量单个簇 `c` 内各个示例之间的差异程度，公式如下：\n\n![art](img/Art_P270.jpg)\n\
  \n其中 `mean(c)` 是簇中所有示例的特征向量的平均值。一组向量的平均值是逐分量计算的：即将对应的元素相加，并将结果除以向量的数量。如果 `v1` 和\
  \ `v2` 是数字数组，则表达式 `(v1+v2)/2` 的值就是它们的“欧几里得平均值”（Euclidean mean）。\n\n我们所说的变异性与第 15\
  \ 章中介绍的方差（variance）概念非常相似。区别在于变异性没有根据簇的大小进行归一化，因此根据这一标准，点数多的簇看起来可能凝聚性较低。如果想比较两个不同大小簇的凝聚性，则需要将每个簇的变异性除以簇的大小。\n\
  \n单个簇 `c` 内变异性的定义可以扩展为定义一组簇 `C` 的不相似度量（dissimilarity metric）：\n\n![art](img/Art_P271.jpg)\n\
  \n注意，由于我们没有将变异性除以簇的大小，一个大的不凝聚簇对 `dissimilarity(C)` 值的增加比一个较小的不凝聚簇要大。这是设计如此的。\n\n\
  那么，优化问题是寻找一组簇 `C` 使得 `dissimilarity(C)` 最小吗？不完全是。通过将每个示例放在它自己的簇中，很容易就能实现最小化。我们需要添加一些约束。例如，我们可以对簇之间的最小距离设置约束，或者要求簇的最大数量为某个\
  \ `k`。\n\n通常，对于大多数有趣的问题来说，解决这个优化问题在计算上是不可行的。因此，人们依赖于提供近似解的贪心算法。在第 23.2 节中，我们介绍了其中一种算法：k-means\
  \ 聚类。但在之前，我们将介绍一些有助于实现该算法（以及其他聚类算法）的抽象。\n\n## 23.1 类簇 (#toc.xhtml_Rh1-91)\n\n`Class\
  \ Example` 将用于构建待聚类的样本。每个示例关联有一个名称、一个特征向量和一个可选的标签。`distance` 方法返回两个示例之间的欧几里得距离。\n\
  \n![art](img/Art_P272.jpg)\n\n**图 23.2 Class Example**\n\n`Class Cluster`（图 23.3）稍微复杂一些。簇是示例的集合。`Cluster`\
  \ 中两个有趣的方法是 `computeCentroid` 和 `variability`。将簇的 `centroid`（质）想象成它的质心。`computeCentroid`\
  \ 方法返回一个示例，其特征向量等于簇内所有示例特征向量的欧几里得平均值。`variability` 方法提供了簇凝聚性的衡量标准。\n\n![art](img/Art_P273.jpg)\n\
  \n**图 23.3 Class Cluster**\n\n## 23.2 K-means 聚类 (#toc.xhtml_Rh1-92)\n\n**K-means\
  \ 聚类**可能是使用最广泛的聚类方法。(³²⁹)。它的目标是将一组示例划分为 `k` 个簇，使得：\n\n* 每个示例都位于质心距离该示例最近的簇中，且\n\
  * 簇集合的不相似度最小化。\n\n遗憾的是，在大规模数据集上找到该问题的最优解在计算上是不可行的。幸运的是，有一种高效的贪心算法^(³³⁰) 可以用于找到有用的近似解。它由伪代码描述：\n\
  \n```\n随机选择 k 个示例作为簇的初始质心，如此循环执行：\n1. 通过将每个示例分配给最近的质心来创建 k 个簇\n2. 通过对每个簇中的示例取平均值来计算\
  \ k 个新质心\n3. 如果没有质心与上一次迭代不同：返回当前的簇集\n```\n\n步骤 1 的复杂度为 `O(k*n*d)`，其中 `k` 是簇的数量，`n`\
  \ 是示例的数量，`d` 是计算对示例距离所需的时间。步骤 2 的复杂度为 `O(n)`，步骤 3 的复杂度为 `O(k)`。因此，单次迭代的复杂度为 `O(k*n*d)`。如果使用闵可夫斯基距离（Minkowski\
  \ distance）比较示例，则 `d` 与特征向量长度呈线性关系^(³³¹)。当然，整个算法的复杂度取决于迭代的次数。这很难刻画，但可以说它通常很小。\n\n\
  k-means 算法的一个问题是返回的值取决于随机选择的初始质心集。如果选择了一组特别不利的初始质心，算法可能会陷入远离全局最优解的局部最优解。在实践中，这个问题通常通过使用随机选择的初始质心运行多次\
  \ k-means 来解决。然后，我们选择簇之间不相似度最小的解。\n\n图 23.4 包含一个函数 `trykmeans`，它多次调用 `kmeans`（见图\
  \ 23.5）并选择不相似度最低的结果。如果由于尝试因为 `kmeans` 生成了空簇而失败，它会再次尝试。\n\n![art](img/Art_P274.jpg)\n\
  \n**图 23.4 寻找最佳 k-means**\n\n图 23.5 包含了对伪代码的 Python 翻译。唯一的特殊之处在于如果任何迭代创建了空簇，它会抛出异常。将空簇视为错误是\
  \ Matlab 使用的选项之一。另一种是创建一个包含单个点的簇——即距离质心远的点。我们为了保持实现简单而将其视为错误。\n\n## 23.3 人为示例 (#toc.xhtml_Rh1-93)\n\
  \n图 23.7 包含了生成、绘制并聚类源自两个分布的示例的代码。\n\n`genDistributions` 函数生成具有 `n` 个二维特征向量的列表。特征向量元素的值源自正态分布。\n\
  \n`plotSamples` 函数绘制示例的特征向量。它使用 `pylab.annotate` 在图中放置文本。第一个参数是文本，第二个参数是与文本关联的点，第三个参数是文本相对于其关联点的位置。\n\
  \n`contrivest` 函数使用 `genDistributions` 创建两个具有十个示例的分布（每个分布具有相同的标准差但不同的均值），使用 `plotSamples`\
  \ 绘制示例，然后使用 `trykmeans` 对其进行聚类。\n\n调用 `contrivest(1, 2, True)` 产生了图 23.6 中的图，并打印了图\
