  \ 我们正在使用勾股定理。\n\n¹⁸⁷ 在 19 世纪，水管工通过向封闭管道系统注满烟雾来测试是否存在泄漏已成为标准做法。后来，电子工程师采用这一术语来涵盖对某个电子设备的最早期测试——通电并寻找烟雾。更晚之后，软件开发者开始使用该词进行快速测试，以查看程序是否有任何用处。\n\
