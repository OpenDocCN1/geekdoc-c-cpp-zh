  \ 2006 年以来麻省理工学院（MIT）提供的课程，以及自 2012 年起通过 edX 和 MITx 提供的“大规模开放课程”（MOOCs）。本书的第一版基于一门单学期的课程。然而，随着时间的推移，我无法抑制添加比一个学期能容纳更多的材料。当前版本适用于两个学期的入门计算机科学课程序列。\n\
  \n当我开始编写第二版时，我本以为只会增加几个章节，但结果我做得多得多。我重新组织了书的后半部分，并将整本书从 `Python 2` 转换到了 `Python\
  \ 3`。\n\n本书面向几乎或完全没有编程经验、渴望理解计算解决问题方法的学生。对于某些学生来说，书中的材料将是进入更高级计算机科学课程的垫脚石；但对许多学生来说，这将是他们正式接触计算机科学的唯一机会。由于这对许多学生来说是唯一正式接触计算机科学的机会，我们强调广度而非深度。目标是为学生提供许多主题的简要介绍，以便他们在将来考虑如何利用计算来实现目标时，能够心中有数。尽管如此，这并不是一本“计算鉴赏型”书籍。它是具有挑战性且严谨的。真正想要学习这些材料的学生必须花费大量精力和学习如何让计算机听从自己的意愿。\n\
  \n本书的主要目标是帮助学生熟练地高效利用计算技术。他们应该学会使用计算思维来构思问题，并指导从数据中提取信息的过程。他们从从书中获得的首要知识是计算解决问题的艺术。\n\
  \n本书并不容易归入传统的计算机科学课程体系。`第 1`到`第 11` 章包含了通常针对几乎或完全没有编程经验的学生的计算机科学课程材料。`第 12`到`第 14`\
  \ 章包含了稍为高级的材料，如果学生水平较高，可以将其中的某些子集加入入门课程。`第 15`到`第 24` 章关于如何使用计算来帮助理解数据。我们认为这些内容应该成为计算机科学课程中标准的第二门课程（取代传统的数据结构课程）。\n\
  \n在`第 1`到`第 11` 章中，我们交织了四种材料线条：\n\n*   编程基础\n*   `Python 3` 编程语言\n*   计算解决问题技术\n\
  *   计算复杂度\n*   使用图表呈现信息\n\n我们涵盖了 `Python` 的大部分特性，但重点在于通过语言可以做什么，而不是语言本身。例如，到`第 3`\
  \ 章结束时，书虽然只涵盖了 Python 的一小部分，但已经引入了穷举搜索法、猜测与检验算法、二分查找和高效近似算法的概念。我们在书中不断介绍 `Python`\
  \ 的特性。同样，我们在书中介绍了编程方法的各个方面。这种理念是帮助学生在利用计算解决有趣问题的背景下，学习 `Python` 并成为一名优秀的程序员。\n\n\
  \n\n本书中的示例已使用 `Python 3.5` 进行过测试。`Python 3` 清除了 `Python 2` 多个版本（通常称为 `Python 2.x`）设计中的许多不一致之处。然而，它并不兼容。这意味着大多数使用\
  \ `Python 2` 编写的程序无法在 `Python 3` 的实现上运行。由于这个原因，`Python 2.x` 继续被广泛使用。当我们第一次使用于 `Python\
  \ 2` 的特性时，我们会指出在 `Python 2` 中如何实现相同的功能。书中所有的示例都有 `Python 3.5` 和 `Python 2.7` 两个版本在线提供。\n\
  \n第 12 章-第 13 章 介绍了优化，这是一个通常在入门级课程中不涵盖的重要课题。第 14 章-第 16 章 介绍了随机规划，这是另一个通常在入门级课程中不涵盖的重要课题。根据我们在\
  \ MIT 的经验，在一个学期的入门课程中，我们可以涵盖第 12 章-第 13 章或第 15 章-第 16 章，但不能两者兼顾。\n\n第 15 章-第 24\
  \ 章 旨在提供一个关于利用计算来帮助理解数据的自包含式介绍。它们假设读者没有高中代数以外的数学知识，但假设读者习惯于严谨思维，并且不会对数学概念感到畏惧。书的这部分致力于大多数教科书中未涉及的话题：数据可视化、仿真模型、概率和统计思维以及机器学习。我们认为，对于大多数学生来说，这部分内容比通常第二门计算机科学课程涵盖的内容更相关。\n\
  \n我们选择不在章节末尾包含习题。相反，我们在章节中的合适位置插入了“手指练习”（finger exercises）。有些非常短，旨在让读者确认他们理解了刚刚阅读的内容。有些更具挑战性，适合作为考试题。另一些则具有足够的挑战性，可以作为作业。\n\
  \n本书有三个贯穿始终的主题：系统化的问题解决、抽象的力量，以及作为一种思考世界的方式计算。当你读完这本书后，你应该：\n\n*   学会了一种用于表达计算的语言\
  \ `Python`，\n* 学会了一套组织、编写和调试中等规模程序的系统方法，\n*   对计算复杂度有了非正式的理解，\n*   对从模糊的问题陈述到解决问题的方法的计算表述的过程有了敏锐的洞察，\n\
  * 学会了一套实用的算法和问题归约技术，\n*   学会了如何使用随机性和仿真来启发那些不易通过闭式解解决的问题，\n*   学会了如何使用计算工具（包括简单的统计、可视化和机器学习工具）来建模和理解数据。\n\
  \n编程是一项本质上困难的活动。正如“几何学没有捷径”^(¹) 一样，编程也没有捷径。如果你真的想学习这些内容，仅仅靠读书是不够的。至少你应该尝试运行书中的一些代码。本书所源的各种课程版本自\
  \ 2008 年来一直在 MIT 的开放课程（OCW）网站上提供。该网站包括讲座录像以及完整的习题集和考试卷。自 2012 年秋季以来，`edX` 和 `MITx`\
  \ 提供了涵盖书中大部分内容的在线课程。我们强烈建议你完成与 OCW 或 edX 课程相关的习题。\n\n____________\n\n² 这据说是欧几里得在公元前\
  \ 300 左右对托勒密王要求更简单的学习数学方法的回应。\n\n## 致谢 (#toc.xhtml_ack-1)\n\n本书的第一版源于我在 MIT 教教授本科课程时准备的一系列讲义笔记。这门课程以及因此本书，受益于同事们（特别是\
  \ Ana Bell、Eric Grimson、Srinivas Devadas、Fredo Durand、Ron Rivest 和 Chris Terman）、助教以及修读该课程学生的建议。David\
  \ Guttag 克服了他对计算机科学的排斥，并校对了了多个章节。\n\n和所有成功的教授一样，我非常感激我的研究生们。书封后的照片描述了我支持我的一些学生学生。然而，在实验室里，是他们支持着我。除了做出伟大的研究（并让我分一些功）外，Guha,\
  \ Balakrishnan, Blalock, Ganesillai, Gong, Liu, Singh, Wiens 和 Zhao 都对该手稿的多个版本提供了有用的意见。我对\
  \ Julie Sussman 满表感谢。在与 Julie 开始工作之前，我不知道一个编辑能产生多大的影响。在之前的书中我与干练的编辑合作过，认为那是我本书需要的。我错了。我需要一个能读懂这本书的合作者。\n\
  \n## 1 入门 (#toc.xhtml_chap-1)\n\n计算机只做两件事，且只有两件事：它执行计算，并记住这些计算的结果。但它做这两件事做得非常好。放在桌上或公文包里的典型电脑每秒执行十亿次计算。很难想象有多快。想象你拿着一个球，距离地面米，然后松手。在球落地之前，你的计算机可能已经执行了十亿条指令。至于内存，小型电脑可能有数百\
  \ GB 的存储空间。这有多大？如果一个字节（表示一个字符通常所需的 8 位）重 1 克（尽管它不是），100GB 将重一万吨。作为对比，这大约是 1.5 万非洲大象的总重量。\n\
  \n在人类历史的大部分里，计算受限于大脑计算的速度和手记录结果的能力。这意味着只有最小的问题才能通过计算来解决。即使有了现代计算机的速度，仍然存在超出现代计算模型的问题（例如，理解气候变化），但越来越多的问题被证明是可以通过计算解决的。我们希望，当你读完这本书时，你能够自如地运用计算思维来解决你在学习、工作甚至日常生活中遇到的许多问题。\n\
  \n### 我们所说的计算思维是指什么？\n\n所有知识都可以被认为是声明性的（declarative）或命令性的（imperative）。**声明性知识**由事实陈述组成。例如，“x\
  \ 的平方根是一个数字 y，使得 `y*y = x`。” 这是一个事实陈述。遗憾的是，它并没有告诉我们任何如何找到平方根的信息。\n\n\n\n\n\n`命令式知识`是“如何做”的知识，或者是推导信息的配方。亚历山山的赫伦是第一个记录计算数字平方根方法的人。他计算某个数字（假设为\
  \ `x`）平方根的方法可以总结为：\n\n1. 从一个猜想值 `g` 开始。\n2. 如果 `g*g` 足够接近 `x`，停止并称 `g` 为答案。\n3.\
  \ 否则，通过计算 `g` 和 `x/g` 的平均值创建一个新的猜想值，即 `(g + x/g)/2`。\n4. 使用这个新的猜想（我们再次称之为 `g`），重复该过程，直到\
  \ `g*g` 足够接近 `x`。\n\n例如，计算 25 的平方根。\n\n1. 将 `g` 设置为某个任意值，例如 `3`。\n2. 我们认为 `3*3 =\
  \ 9` 不足够接近 25。\n3. 将 `g` 设置为 `(3 + 25/3)/2 = 5.67`。\n4. 我们认为 `5.67*5.67 = 32.15`\
  \ 仍然不够接近 25。\n5. 将 `g` 设置为 `(5.67 + 25/5.67)/2 = 5.04`。\n6. 我们认为 `5.04*5.04 = 25.4`\
  \ 足够接近，因此停止并宣布 `5.04` 是 25 平方根的足够近似值。\n\n注意，这种方法的描述是一系列简单的步骤，连同一个指定何时执行每个步骤的控制流。这种描述被称为一个`算法`。该算法是猜想与检查算法的一个例子。它基于这样一个事实：检查一个猜想是否良好是很容易的。\n\
  \n更正式一点说，算法是一份有限的指令列表，描述了一个`计算`过程，该过程在输入集上执行时，将通过一组定义良好的状态并最终产生一个输出。\n\n算法有点像食菜谱上的配方：\n\
  \n1. 将奶昔混合物加热。\n2. 搅拌。\n3. 将勺子浸入奶昔中。\n4. 移出勺子，手指划过勺背。\n5. 如果留有清晰的路径，将奶昔离开热并冷却。\n\
  6. 否则重复。\n\n它包含了一些用于判断过程何时完成的测试，以及关于执行指令顺序的指令，有时会根据测试跳转到特定的指令。\n\n那么，人们如何在机械过程中捕获这种“配方”的思想呢？一种方法是设计一台专门用于计算平方根的机器。虽然这听起来可能很奇怪，但最早的计算机实际上是`固定程序计算机`，这意味着它们被设计用来执行非常特定的任务，并且大多数是解决特定数学问题的工具，例如计算火炮的弹道。第一批计算机之一（由\
  \ Atanasoff 和 Berry 于 1941 年建造）可以求解线性方程组，但不能做其他任何事情。艾伦·图灵在二战期间开发的炸弹机是严格为破解德国恩 igma（Enigma）密码而设计的。一些非常简单的计算机仍然使用这种方法。例如，一个简单的手持计算器就是固定程序计算机。它可以进行基础算术，但不能用作文字处理器或运行视频游戏。要更改此类机器的程序，必须更换电路。\n\
  \n第一台真正现代的计算机是曼彻斯特 1 号机。它与前身机的区别在于它是一台`存储程序计算机`。这种计算机存储（并操作）一段指令序列，并拥有执行该序列中任何指令的组件。通过创建指令集架构并将计算详细说明为指令序列（即程序），我们获得了一台高度灵活的机器。通过以处理数据相同的方式处理这些指令，存储程序计算机可以轻松地更改程序，并在程序控制下完成此。事实上，计算机的核心随后变成了一个程序（称为`解释器`），它可以执行任何一组合法的指令，因此可以用于计算任何人们用一组基础指令就能描述的内容。\n\
  \n程序和它所操作的数据都存储在内存中。通常，有一个程序计数器指向内存中的特定位置，计算从执行该位置的指令开始。大多数情况下，解释器只是简单地跳转到序列中的下一条指令，但并不总是如此。在某些情况下，它会执行一个测试，并根据该测试，执行可能会跳转到指令序列中的其他某点。这被称为`控制流`，它对于允许我们编写执行复杂任务的程序至关重要。\n\
  \n回到配方的比喻，给定一组固定的食材，优秀的厨师可以通过不同的方式组合它们，做出无限数量的美味佳肴。同样，给定一组很小的固定原始特征，优秀的程序员可以产生无限数量的实用用程序。这就是为什么编程是一项如此惊人的事业的原因。\n\
  \n为了创建配方（或指令序列），我们需要一种`编程语言`来描述它们，一种给计算机下达行军命令的方法。\n\n1936 年，英国数学家艾伦·图灵描述了一种假设的计算设备，这种设备后来被称为`通用图灵机`。这台机器具有以“磁带”形式存在的无限内存，人们可以在磁带上写\
  \ 0 和 1，并具有一些用于移动、读取和写入磁带的非常简单的原始指令。`丘奇-图灵论题`指出，如果一个函数是可计算的，图灵机就可以被编程来计算它。\n\n丘奇-图灵论题中的“如果”非常重要。并不是所有问题都有计算解决方案。图灵证明了，例如，无法编写一个程序，给定任意程序（假设为\
  \ `P`），当且仅当 `P` 将无限运行运行时输出为真。这被称为`停机问题`。\n\n\n\n\n每种编程语言都有一组原语构造、一套语法、一套静态语义和语义。类比自然语言（例如英语），原语构造是单词，语法描述哪些单词序列构成了正确的句子，静态语义定义了哪些句子是有意义的，而语义定义了这些句子的含义。Python\
  \ 中的原语构造包括`字面量`（例如数字 `3.2` 和字符串 `'abc'`）和`中缀运算符`（例如 `+` 和 `/`）。\n\n### 语法\n语言的`syntax`定义了哪些字符和符号序列是合法的。例如，在英语中，字符串“Cat\
  \ dog boy.”不是一个在语法上有效的句子，因为英语语法不接受`<名词> <名词> <名词>` 形式的句子。在 Python 中，原语序列 `3.2 +\
  \ 3.2` 在语法上是合法的，但序列 `3.2 3.2` 则不是。\n\n### 静态语义\n`static semantics`定义了哪些在语法上有效的字符串具有意义。例如，在英语中，字符串“I\
  \ runs fast”符合`<代词> <动词> <副词>` 的形式，这是一个语法上接受的序列。然而，它并不是有效的英语，因为名词“I”是单数，而动词“runs”是复数形式。这是一个静态语义错误的示例。在\
  \ Python 中，序列 `3.2/'abc'` 在语法上是合法的（`<字面量> <运算符> <字面量>`），但会产生静态语义错误，因为将数字除以字符字符串是没有意义的。\n\
  \n### 语义\n语言的`semantics`为每个没有静态语义错误的正确符号字符串关联一个含义。在自然语言中，句子的语义可能是歧义的。例如，句子“I cannot\
  \ praise this student too highly”可能是过度的赞美，也可能是贬低。编程语言的设计使得每个合法的程序都恰好有一种含义。\n\n###\
  \ 错误\n虽然语法错误是最常见的错误类型（特别是对于那些学习新编程语言的人来说），但它们是最不危险的错误。每种严肃的编程语言都能完整地检测语法错误，并且不允许用户执行即使仅有一个语法错误的程序。此外，在大多数情况下，语言系统提供的错误位置指示足够清晰，以至于要做什么来修复它是显而易见的。\n\
  \n关于静态语义错误的情况稍微复杂一些。某些编程语言，例如 `Java`，在允许程序执行之前会进行大量的静态语义检查。其他语言，例如 `C` 和 `Python`（遗憾的是），在程序执行之前进行的静态语义检查较少。Python\
  \ 在运行程序时确实会进行相当大量的语义检查。\n\n人们通常不会说一个程序具有语义错误。如果一个程序既没有语法错误也没有静态语义错误，它就具有含义，即它具有语义。当然，这并不是说它具有创建者意令它拥有的语义。当一个程序的含义与其创建者认为的含义不符时，就会发生糟糕的事情。\n\
  \n如果程序发生错误并以意之外的方式运行，可能会发生什么？\n\n* 它可能会崩溃，即停止运行并产生某种关于其已崩溃的明显指示。在一个设计良好的计算系统中，当程序崩溃时不会对整个系统造成损害。当然，某些非常流行的计算机系统没有这种优特性。几乎每个使用个人电脑的人都运行过那种导致不得不重启整个电脑的程序。\n\
  * 或者它可能会继续运行、运行、再运行，永不停止。如果一个人不知道程序完成工作大约需要多长时间，这种情况可能很难被识别。\n* 它可能会运行完成并产生一个可能正确也可能不正确的答案。\n\
  \n这些每都是坏的，但最后一种无疑是最糟糕的。当一个程序看起来在做正确的事但实际上并非如此，可能会导致糟糕的后果：财富可能会损失，患者可能会接受致命剂量的放射治疗，飞机可能会坠毁。\n\
  \n尽可能，编写程序时应该使得当它们无法正常工作时，问题是显而易见的。我们将在整本书中讨论如何做到。\n\n**手指练习：** 计算机可以死板得令人恼火。如果你不准确告诉它们你想让它们做什么，它们很可能会做错事。尝试写一个在两个目的地之间行驶的算法。按照你对人说话的方式写，然后想象如果那个人像计算机一样愚蠢，完全按照写的内容执行算法会发生什么？那个人可能会收到多少交通罚单？\n\
  \n***\n\n[⁸] 许多人认为他们并不是这种方法的发明者，确实有证据表明这种方法古巴比伦人早已所知。\n[⁹] 为了简单起见，我们对结果进行了四舍五入。\n\
  [1⁰] “算法”一词源于波斯数学家穆哈默德·本·穆萨·阿尔·花剌子米的名字。\n[1¹] 很难相信，但曾经手机并不提供计算功能。人们实际上使用只能用于计算的小设备。\n\
  [1²] 这台计算机建于曼彻斯特大学，并于 1949 年运行了它的第一个程序。它实现了约翰·冯·诺依曼之前描述的思想，并被艾兰·图灵在 1936 年描述的通用图灵机理论概念所预见。\n\
  \n## 2 Python 简介\n\n尽管每种编程语言都是不同的（尽管并不像设计者让我们认为的那样不同），但它们在某些维度上是可以联系的。\n\n* **低级与高级**是指我们使用机器层面的指令和数据对象（例如，将\
  \ 64 位数据从这个位置移动到那个位置）进行编程，还是使用语言设计者提供的更抽象的操作（例如在屏幕上弹出一个菜单）进行编程。\n* **通用与针对特定应用领域**是指编程语言的原语操作是广泛适用，还是针对特定领域进行了精细调整。例如，`SQL`的设计是为了便于从关系型数据库中提取信息，但你不会想用它来构建操作系统。\n\
  * **解释型与编译型**指的是程序员编写的指令序列（称为`源代码`）是被直接执行（通过解释器），还是首先被转换（通过编译器）为机器级原语操作序列。（在计算机早期，人们必须用一种非常接近`机器码`的语言编写源代码，机器码可以被计算机硬件直接解释。）这两种方法都有优点。使用设计为解释执行的语言编写的程序通常更容易调试，因为解释器可以产生与源代码容易关联的错误信息。编译型语言通常产生运行更快且占用空间更少的程序。\n\
  \n在本书中，我们使用 `Python`。然而，这本书书并不是关于 Python 的。它无疑会帮助读者学习 Python，这是一好事。然而，更重要的是，细心的读者将学习到关于如何编写解决问题的程序。这种技能可以转移到任何编程语言。\n\
  \n\n\n\nPython 是一种通用编程语言，可以有效地用于构建几乎任何不需要直接访问计算机硬件的程序。对于对可靠性有高要求约束的程序，Python 并不是理想的（因为其静态语义检查较弱），或者对于由许多人员或经过长时间构建和维护的程序（同样是因为其静态语义检查较弱）。\n\
  \n然而，Python 相比许多其他语言具有多个优势。它是一种相对简单且易学习的语言。由于 Python 被设计为解释型语言，因此它可以提供对初级程序员非常有帮助的运行时反馈。此外，还有大量免费的库可以与\
  \ Python 接口并提供实用的扩展功能。其中几个在本书中会被用到。\n\n现在，我们准备好开始学习 Python 的一些基本元素了。这些元素在概念上是几乎所有编程语言通用的，尽管在细节上并不一定。\n\
  \n读者应该预先知道，本书绝非 Python 的全面介绍。我们使用 Python 作为一种工具来介绍与计算问题求解和思维相关的概念。为了这一特殊目的，语言是根据需要零散地呈现的。我们不需要该目的需要的\
  \ Python 特性完全不会介绍。我们对没有涵盖整个语言感到很放心，因为有优秀的在线资源描述了该语言的每一个方面。当我们教授基于本书的课程时，我们建议学生依靠这些免费的在线资源作为\
  \ Python 的参考资料。\n\nPython 是一门活的语言。自从 Guido von Rossum 在 1990 年引入以来，它经历了许多变化。在生命的第一个十年里，Python\
  \ 是一种鲜为人知且很少使用的语言。随着 2000 年 Python 2.0 的到来，情况发生了变化。除了包含了语言本身的许多重要改进外，它标志着该语言进化路径的转变。大量的人开始开发与\
  \ Python 无缝接口的库，Python 生态系统的持续支持和开发变成了基于社区的活动。Python 3.0 于 2008 年底发布。该版本的 Python\
  \ 清除了 Python 2 系列（通常称为 Python 2.x）设计中的许多不一致之处。然而，它并不向后兼容。这意味着大多数为早期 Python 版本编写的程序无法在\
  \ Python 3 的实现上运行。\n\n在过去的几年里，大多数重要的公共领域 Python 库已已迁移到 Python 3，并使用 Python 3.5——我们在书中使用的\
  \ Python 版本——进行了彻底测试。\n\n## 2.1 Python 的基本元素\n\n一个 Python `program`（有时称为 `script`）是定义和命令的序列。这些定义由\
  \ Python 解释器在称为 `shell` 的地方进行求值，命令被执行。通常每当程序执行开始时都会创建一个新的 shell。通常一个窗口与该 shell 关联。\n\
  \n我们建议你现在启动一个 Python shell，并用它来尝试本章其余部分的示例。而且，在书的后续部分也是如此。\n\n一个 `command`（通常称为\
  \ `statement`）指示解释器执行某些操作。例如，语句 `print('Yankees rule!')` 指示解释器调用 `print` 函数，该函数将字符串\
  \ Yankees rule! 输出到与 shell 关联的窗口。\n\n命令序列：\n\n```\nprint('Yankees rule!')\nprint('But\
  \ not in Boston!')\nprint('Yankees rule,', 'but not in Boston!')\n```\n\n导致解释器产生输出：\n\
  \n```\nYankees rule!\nBut not in Boston!\nYankees rule, but not in Boston!\n```\n\
  \n注意在第三条语句中向 `print` 传递了两个值。`print` 函数接收由逗号分隔的任意数量参数，并按照它们出现的顺序用空格字符分隔并将打印出来。\n\n\
  ### 2.1.1 对象、表达式和数值类型\n\n`Objects` 是 Python 程序操纵的核心内容。每个对象都有一个 `type`，定义了程序对该对象可以执行的操作类型。\n\
  \n类型要么是标量的，要么是非标量的。`Scalar` 对象是不可分的。将它们想象成语言的原子。`Non-scalar` 对象（例如字符串）具有内部结构。\n\n\
  许多类型的对象可以通过程序文本中的 `literals` 来表示。例如，文本 `2` 是一个表示数字的字面量，文本 `'abc'` 是一个表示字符串的字面量。\n\
  \nPython 有四种标量对象类型：\n\n*   `int` 用于表示整数。`int` 类型的字面量的写法类似于我们通常表示整数的方式（例如，`-3` 或\
  \ `5` 或 `10002`）。\n*   `float` 用于表示实数。`float` 类型的字面量始终包含小数点（例如，`3.0` 或 `3.17`）。\n\
  *   `bool` 用于表示布尔值 `True` 和 `False`。\n*   `None` 是一个类型。\n\n`Objects` 和 `operators`\
  \ 可以组合成 `expressions`，每个表达式都求值为某种类型的 `value`。例如，表达式 `3 + 2` 表示 `int` 类型的 `5`，而表达式\
  \ `3.0 + 2` 表示 `float` 类型的 `5.0`。`==` 运算符用于测试两个表达式的值是否相同，`!=` 运算符用于测试两个表达式的值是否不同。单个\
  \ `=` 意味着完全不同的意思，我们将在 2.1.2 中看到。预先警告，你会误打 `=` 而本该打 `==`。\n\n符号 `>>>` 是一个 `shell\
  \ prompt`，表示解释器正在等待用户在 shell 中输入 Python 代码。提示符下方的行是在解释器求值提示符处的 Python 代码时产生的，如下与解释器的交互所示：\n\
  \n```\n>>> 3 + 2\n5\n>>> 3.0 + 2\n5.0\n>>> 3 != 2\nTrue\n```\n\n内置 Python 函数 `type`\
  \ 可用于查找对象的类型：\n\n```\n>>> type(3)\n<type 'int'>\n>>> type(3.0)\n<type 'float'>\n\
  ```\n\n`int` 和 `float` 类型对象的运算符列在图 2.1 中。\n\n算术运算符具有通常的优先级。例如，`*` 的优先级比 `+` 高，因此表达式\
  \ `x+y*2` 的求值方式是先将 y 乘以 2，然后将结果加到 x。求值顺序可以使用括号组合子表达式来改变，例如`(x+y)*2` 先加 x 和 y，然后将结果乘以\
  \ 2。\n\n`bool` 类型的原始运算符有 `and`、`or` 和 `not`：\n\n*   `a and b` 如果 `a` 和 `b` 均为 `True`\
  \ 则结果为 `True`，否则为 `False`。\n*   `a or b` 如果 `a` 或 `b` 中至少有一个为 `True` 则结果为 `True`，否则为\
  \ `False`。\n*   `not a` 如果 `a` 为 `False` 则结果为 `True`，如果 `a` 为 `True` 则结果为 `False`。\n\
  \n\n\n\n\n### 2.1.2 变量与赋值\n\n`变量` 提供了一种将名称与对象关联的方法。考虑以下代码\n\n```\npi = 3\nradius\
  \ = 11\narea = pi * (radius**2)\nradius = 14\n```\n\n它首先将名称 `pi` 和 `radius` 绑定到不同的\
  \ `int` 类型对象上。然后将名称 `area` 绑定到第三个 `int` 类型对象上。这在图 2.2 的左侧面板所示。\n\n![art](img/Art_P2.jpg)\n\
  \n**图 2.2 变量到对象的绑定**\n\n如果程序随后执行 `radius = 14`，名称 `radius` 将重新绑定到一个不同的 `int` 类型对象，如图图\
  \ 2.2 的右侧面板所示。注意，这次赋值对 `area` 绑的值没有影响。它仍然绑定到表达式 `3*(11**2)` 所表示的对象上。\n\n在 Python\
  \ 中，**变量仅仅是一个名称**，仅此而已。请记住这一点——这非常重要。**赋值**语句将 `=` 符号左侧的名称与 `=` 右侧表达式所表示的对象关联。也请记住这一点。一个对象可以关联一个、多个或没有名称。\n\
  \n也许我们不应该说“变量仅仅是一个名称”。尽管朱莉叶特这么说，但名称是重要的。编程语言允许我们以某种方式描述计算，以便机器能够执行这些计算。这并不意味着只有计算机在读程序。\n\
  \n正如你很快会发现的，编写运行正确的程序并不总是易的。经验程序员会证实，他们花费了大量时间阅读程序，试图理解它们为什么会那样运行。因此，以易于阅读的方式编写程序至关重要。变量名的合理选择对增强可读性起着重要作用。\n\
  \n考虑两个代码片段\n\n| a = 3.14159b = 11.2c = a*(b**2) | pi = 3.14159diameter = 11.2area\
  \ = pi*(diameter**2) |\n| 对于 Python 来说，它们没有区别。执行时，它们将完成相同的事情。但对于人类读者来说，它们是完全不同的。当我们阅读左侧的片段时，*先*没有理由怀疑任何问题。然而，扫一眼右侧的代码应该让我们怀疑某些错误。变量应该被命名为\
  \ `radius` 而不是 `diameter`，或者 `area` 的计算应该是除以 `2.0` | 在 Python 中，变量名可以包含大写字母、小写字母、数字（但不能以数字开头）和特殊字符\
  \ `_`。Python 对大小写敏感，例如 `Julie` 和 `julie` 是不同的。最后，Python 中有一些**保留字**（有时称为**关键字**）具有内置含义且不能作为变量名。不同版本的\
  \ Python 保留字列表略有不同。Python 3 的保留字包括 `and`、`as`、`assert`、`break`、`class`、`continue`、`def`、`del`、`elif`、`else`、`except`、`False`、`finally`、`for`、`from`、`global`、`if`、`import`、`in`、`is`、`lambda`、`nonlocal`、`None`、`not`、`or`、`pass`、`raise`、`return`、`True`、`try`、`while`、`with`\
  \ 和 `yield`。\n\n另一种增强代码可读性的方法是添加**注释**。符号 `#` 之后的文本不会被 Python 解析。例如，可以写\n\n```python\n\
  side = 1 # 正方形的边\nradius = 1 # 圆形\n# 从正方形面积减去圆面积\nareaC = pi**2\nareaS = side\n\
  difference = areaS - areaC\n```\n\nPython 允许多次赋值。语句\n\n```\nx, y = 2, 3\n```\n\n\
  将 `x` 绑定到 `2` 将 `y` 绑定到 `3`。赋值右侧的所有表达式在更改任何绑定之前都会求值。这非常方便，因为它允许使用多次赋值来交换两个变量的绑定。例如，代码\n\
  \n```\nx, y = 2, 3\nx, y = y, x\nprint('x =', x)\nprint('y =', y)\n```\n\n将输出\n\n\
  ```\nx = 3\ny = 2\n```\n\n## 2.1.3 Python IDE\n\n直接在 shell 中输入程序是非常不方便的。大多数程序员更倾向于使用某种文本编辑器，即**集成开发环境**\
  \ (**IDE**)。\n\n一个 IDE `IDLE` 是标准 Python 安装包的一部分。随着 Python 的日益普及，其他 IDE 也相继而生。这些新的\
  \ IDE 通常整合了一些流行的 Python 库，并提供了 IDLE 不提供的功能。**Anaconda** 和 **Canopy** 是这些 IDE 中比较流行的。书中出现的代码是使用\
  \ `Anaconda` 创建和测试的。\n\nIDE 是应用程序，就像计算机上的其他应用程序一样。以启动其他应用程序的方式启动它，例如双击图标。所有的 Python\
  \ IDE 都提供：\n\n*   一个具有语法高亮、自动补全和智能缩进的文本编辑器，\n*   一个具有语法高亮的 shell，以及\n*   一个集成调试器，你现在可以先忽略它。\n\
  \n当 IDE 启动时，它会打开一个 shell，你可以在其中输入 Python 命令。**文件菜单**包括以下命令：\n\n*   创建一个包含 Python\
  \ 程序的新窗口，\n*   打开一个现有文件，以及\n*   将当前窗口的内容保存到文件中。\n\n**编辑菜单**包括标准的文本编辑命令（例如复制、粘贴和查找），以及一些专门为方便编辑\
  \ Python 代码设计的命令。有关一些流行 IDE 的更多信息，请参见 `python.org/library/idle.html/`、`continuum.io/cshop/anaconda/`\
  \ 和 `enthought.com/canopy/`。\n\n## 2.2 分支程序\n\n我们目前所看到的计算类型被称为**线性程序**。它们按照出现的顺序一个一个执行，并在用完语句时停止。我们用线性程序可以描述的计算类型并不十分有趣。事实上，它们非常无聊。\n\
  \n**分支**程序更有趣。最简单的分支语句是**条件语句**。如图图 2.3 中的框图所示，条件语句包含三个部分：\n\n*   测试，即求值结果为 `True`\
  \ 或 `False` 的表达式；\n*   如果测试为 `True` 则执行的代码块；以及\n*   如果测试为 `False` 则执行的可选代码块。\n\n\
  执行完条件语句后，执行从该语句后面的代码继续。\n\n在 Python 中，条件语句的形式如下\n\n```\nif *布尔表达式*:\n    *代码块*\n\
  else:\n    *代码块*\n```\n\n或者\n\n```\nif *布尔表达式*:\n    *代码块*\n```\n\n在描述 Python 语句的形式时，我们使用斜体来描述程序该点可能出现的代码类型。例如，*布尔表达式*表示任何求值结果为\
  \ `True` 或 `False` 的表达式都可以跟在保留字 `if` 之后，而*代码块*表示任何 Python 语句序列都可以跟在 `else:` 之后。\n\
  \n考虑以下程序，如果变量 `x` 的值为偶数则打印“Even”，否则打印“Odd”：\n\n```python\nif x%2 == 0:\n    print('Even')\n\
  else:\n    print('Odd')\nprint('Done with conditional')\n```\n\n表达式 `x%2 == 0` 在\
  \ `x` 除以 2 余数为 0 时求值为 `True`，否则求值为 `False`。请记住 `==` 用于比较，因为 `=` 保留用于赋值。\n\n\n\n\n\
  `Indentation` 在 Python 中具有语义意义。例如，如果上述代码中的最后一条语句被缩进，那么它将成为与 `else` 相关的代码块的一部分，而不是条件语句之后的代码块。\n\
  \nPython 在这方面使用缩进是不寻常的。大多数其他编程语言使用某种括号符号来界定代码块，例如 `C` 使用大括号 `{ }` 来包含代码块。Python\
  \ 方法的优点是它确保了程序的视觉结构是该程序语义结构的准确表示。由于缩进在语义上是重要的，因此“行”的概念也变得重要了。\n\n当条件语句的真块或假块中包含另一个条件语句时，这些条件语句被称为\
  \ `nested`（嵌套）。在下面的代码中，顶层 `if` 语句的两个分支都存在嵌套条件语句。\n\n```python\nif x%2 == 0:\n  \
  \  if x%3 == 0:\n        print('Divisible by 2 and 3')\n    else:\n        print('Divisible\
  \ by 2 and not by 3')\nelif x%3 == 0:\n    print('Divisible by 3 and not by 2')\n\
  ```\n\n上述代码中的 `elif` 代表 “else if”（否则如果）。\n\n在条件测试中使用 `compound Boolean expression`（复合布尔表达式）通常非常方便，例如：\n\
  \n```python\nif x < y and x < z:\n    print('x is least')\nelif y < z:\n    print('y\
  \ is least')\nelse:\n    print('z is least')\n```\n\n条件语句允许我们编写比直线型程序更有趣的程序，但分支程序的范畴仍然相当有限。思考一类程序威力的一种方法是看它们运行所需的时间长度。假设每行代码执行需要一个单位的时间。如果一个直线型程序有\
  \ `n` 行代码，它运行需要 `n` 个单位的时间。那么一个有 `n` 行代码的分支程序呢？它的运行时间可能少于 `n` 个单位，但不会超过，因为每行代码最多只执行一次。\n\
  \n一个最大运行时间被程序长度所限制的程序被称为以 `constant time`（常数时间）运行。这并不意味着它每次运行时执行的步数都是相同的。它的意思是存在一个常量\
  \ `k`，保证程序运行时间不超过 `k` 步。这意味着运行时间不会随着程序输入规模而增长。\n\n常数时间程序在功能上是非常局限的。例如，考虑编写一个统计选举票数的程序。如果能写出一个可以在独立于投票人数的时间内完成此任务的程序，那将令人非常惊讶。事实上，可以证明这是不可能的。研究问题的内在困难性是\
  \ `computational complexity`（计算复杂度）的主题。我们将在书中多次回到这个主题。\n\n幸运的是，我们只需要多一种编程语言结构——迭代（iteration），就能编写任意复杂度的程序。我们将在第\
  \ 2.4 节 中介绍这一点。\n\n**手指练习**：编写一个程序，检查三个变量——`x`、`y` 和 `z`——并打印其中最大的奇数。如果它们都不是奇数，则应打印相应的提示信息。\n\
  \n## 2.3 字符串与输入 (#toc.xhtml_Rh1-3)\n\n`str` 类型的对象用于表示字符串。`str` 类型的字面量可以使用单引号或双引号编写，例如\
  \ `'abc'` 或 `\"abc\"`。字面量 `'123'` 表示一个由三个字符组成的字符串，而不是数字一百二十三。\n\n尝试在 Python 解释器中输入以下表达式（记住\
  \ `>>>` 是提示符，不是你要输入的内容）：\n\n```python\n>>> 'a'\n>>> 3*4\n>>> 3*'a'\n>>> 3+4\n>>>\
  \ 'a'+'a'\n```\n\n运算符 `+` 被称为 `overloaded`（重载的）：它的含义取决于它所应用的对象的类型。例如，当应用于两个数字时，它表示加法；当应用于两个字符串时，它表示拼接。运算符\
  \ `*` 也是重载的。当它的操作数都是数字时，它的含义正如你预期的那样。当应用于 `int` 和 `str` 时，它是一个 `repetition operator`（重复运算符）——表达式\
  \ `n*s`（其中 `n` 是 `int`，`s` 是 `str`）被求值为包含 `n` 个重复 `s` 的 `str`。例如，表达式 `2*'John'`\
  \ 的值为 `'JohnJohn'`。这是有逻辑的。正如数学表达式 `3*2` 等同于 `2+2+2` 一样，表达式 `3*'a'` 等同于 `'a'+'a'+'a'`。\n\
  \n现在尝试输入\n\n```python\n>>> a\n>>> 'a'*'a'\n```\n\n这些每一行都会生成一个错误消息。第一行产生消息：\n\n`NameError:\
  \ name 'a' is not defined`\n\n因为 `a` 不是任何类型的字面量，解释器将其视为一个名称。然而，由于该名称没有绑定到任何对象上，尝试使用它会导致运行时错误。代码\
  \ `'a'*'a'` 产生错误消息：\n\n`TypeError: can't multiply sequence by non-int of type 'str'`\n\
  \n存在 `type checking`（类型检查）是一件好事。它将粗心的（有时是微妙的）错误转变为停止执行的错误，而不是导致程序以某种诡异的方式出错的错误。Python\
  \ 中的类型检查不像某些其他编程语言（例如 `Java`）那样强大，但 Python 3 比 Python 2 更好。例如，`'4' < 3` 应该是 False。\n\
  \n字符串是 Python 中几种序列类型之一。它们与所有序列类型共享以下操作：\n\n-   可以使用 `len` 函数找到字符串的 **length**（长度）。例如，`len('abc')`\
  \ 的值为 3。\n-   可以使用 **Indexing**（索引）从字符串中提取单个字符。在 Python 中，所有的索引都从 0 开始。例如，在解释器中输入\
  \ `'abc'[0]` 将导致它显示字符串 `'a'`。输入 `'abc'[3]` 将产生错误消息 `IndexError: string out of range`。由于\
  \ Python 使用 0 来表示字符串的第一个元素，因此长度为 3 的字符串的最后一个元素是通过索引 2 访问的。负数用于从字符串末尾索引。例如，`'abc'[-1]`\
  \ 的值为 `'c'`。\n-   **Slicing**（切片）用于提取任意长度的子字符串。如果 `s` 是一个字符串，表达式 `s[start:end]`\
  \ 表示从索引 `start` 开始到索引 `end-1` 结束的子字符串。例如，`'abc'[1:3]` = `'bc'`。为什么是在索引 `end-1` 处结束而不是\
  \ `end` 呢？为了让像 `'abc'[0:len('abc')]` 这样的表达式具有预期的值。冒号前的值省略，默认值为 0。冒号后的值省略，默认值为字符串的长度。因此，表达式\
  \ `'abc[:]` 在语义上等同于更详细的 `'abc'[0:len('abc')]`。\n\n### 2.3.1 输入 (#toc.xhtml_Rh2-4)\n\
  \nPython 3 有一个函数 `input`，可以直接从用户获取输入。它接受一个字符串作为参数并将其作为提示符显示在 shell 中。然后它等待用户输入内容并按回车键。用户输入的行被视为字符串并成为函数的返回值。\n\
  \n考虑以下代码\n\n```python\n>>> name = input('Enter your name: ')\n\nEnter your name:\
  \ George Washington\n\n>>> print('Are you really', name, '?')\n\nAre you really\
  \ George Washington ?\n\n>>> print('Are you really ' + name + '?')\n\nAre you really\
  \ George Washington?\n```\n\n\n\n注意第一个 `print` 语句在“?” 之前引入了一个空格。这是因为当 `print` 接收到多个参数时，它会在与参数关联的值之间放置一个空格。第二个\
  \ `print` 语句使用拼接来产生一个不包含多余空格的字符串，并将其作为唯一的参数传递给 `print`。\n\n现在考虑\n\n```python\n>>>\
  \ n = input('Enter an int: ')\nEnter an int: 3\n>>> print(type(n))\n<type 'str'>\n\
  ```\n\n注意变量 `n` 被绑定到了字符串 '3' 而不是整数 3。所以，例如，表达式 `n*4` 的值是 '3333' 而不是 12。好消息是，只要字符串是某种类型的有效字面量，就可以对其进行类型转换。\n\
  \n`类型转换`（Type conversions，也称为 `类型强制转换` type casts）在 Python 代码中经常使用。我们使用类型的名称将值转换为该类型。例如，`int('3')*4`\
  \ 的值是 12。当浮点数（float）转换为整数（int）时，数字会被截断（而不是四舍五入），例如，`int(3.9)` 的值是整数 3。\n\n### 2.3.2\
  \ 关于字符编码的旁题\n\n多年来，大多数编程语言使用名为 ASCII 的标准作为字符的内部表示。该标准包含 128 个字符，足以表示英语文本中出现的常用字符——但不足以涵盖世界上所有语言中字符和重音符号。\n\
  \n近年来，已经转向了 Unicode。Unicode 标准是一种字符编码系统，旨在支持所有语言书文本的数字化处理和显示。该标准包含超过 120,000 个不同的字符——涵盖了\
  \ 129 种现代和历史字体以及多个符号集。Unicode 标准可以使用不同的内部字符编码来实现。你可以通过插入如下形式的注释来告诉 Python 使用哪种编码：\n\
  \n```python\n# -*- coding: *encoding name* -*-\n```\n\n作为你程序的第一行或第二行。例如，\n\n```python\n\
  # -*- coding: utf-8 -*-\n```\n\n这指示 Python 使用 UTF-8，这是网页页最常用的字符编码。如果你在程序中没有这样的注释，大多数\
  \ Python 实现将默认使用 UTF-8。\n\n在使用 UTF-8 时，在文本编辑器允许的情况下，你可以直接输入如下代码：\n\n```python\n\
  print('Mluvíš anglicky?')\nprint('क्या आप अंग्रेज़ी बोलते हैं?')\n```\n\n它将打印\n\n\
  ```\nMluvíš anglicky?\nक्या आप अंग्रेज़ी बोलते हैं?\n```\n\n你可能会奇怪我是如何输入出字符串 'क्या\
  \ आप अंग्रेज़ी बोलते हैं?' 的。我并没有。因为万维网绝大部分使用 UTF-8，我能够从网页上复制该字符串并直接粘贴到我的程序中。\n\n\
  ## 2.4 迭代\n\n我们在第 2.2 节结束时提到一个观察结果：大多数计算任务无法通过分支程序完成。例如，考虑编写一个程序，询问用户想打印多少次字母 X，然后打印一个包含该数量\
  \ X 的字符串。我们可能会考虑编写类似下面的代码：\n\n```python\nnumXs = int(input('How many times should\
  \ I print the letter X? '))\ntoPrint = ''\nif numXs == 1:\n    toPrint = 'X'\nelif\
  \ numXs == 2:\n    toPrint = 'XX'\nelif numXs == 3:\n    toPrint = 'XXX'\n#…\nprint(toPrint)\n\
  ```\n\n但很快就会发现，我们需要的条件语句与正整数的数量一样多——而正整数有无限多个。我们需要的是一个像这样的程序：\n\n```python\nnumXs\
  \ = int(input('How many times should I print the letter X? '))\ntoPrint = ''\nconcatenate\
  \ X to toPrint numXs times\nprint(toPrint)\n```\n\n当我们想要让程序多次执行相同的操作时，可以使用`迭代` iteration。一种通用的迭代机制（也称为\
  \ `循环` looping）在图 2.4 的框图中部分显示。像条件语句一样，它从一个测试开始。如果测试结果为 True，程序将执行一次 `loop` 体，然后返回重新评估测试。这个过程会重复进行，直到测试结果为\
  \ False，之后控制权将传递到迭代语句之后的代码。\n\n我们可以使用 `while` 语句编写图 2.4 所示的这种循环。考虑以下示例：\n\n```python\n\
  # 计算整数的平方，用困难的方法\nx = 3\nans = 0\nitersLeft = x\nwhile (itersLeft != 0):\n    ans\
  \ = ans + x\n    itersLeft = itersLeft - 1\nprint(str(x) + '*' + str(x) + ' = '\
  \ + str(ans))\n```\n\n![art](img/Art_P4.jpg)\n\n**图 2.4 迭代流程图**\n\n代码首先将变量 `x` 绑定到整数\
  \ 3。然后通过重复加法计算 `x` 的平方。图 2.5 中的表格显示了每次到达循环开始处的测试时，每个变量关联的值。我们通过`手动模拟` hand-simulating\
  \ 代码来构建它，即我们假装是 Python 解释器并使用纸笔执行程序。使用纸笔似乎有些古老，但它是理解程序行为的极佳方式。\n\n![art](img/Art_P5.jpg)\n\
  \n**图 2.5 小程序的手动模拟**\n\n第四次到达测试时，它的结果为 False，控制流进入循环之后的 print 语句。对于 `x` 的哪些值，这个程序会终止？有三种情况需要考虑：`x\
  \ == 0`、`x > 0` 和 `x < 0`。\n\n假设 `x == 0`。`itersLeft` 的初始值也将为 0，循环体永远不会被执行。\n\n\
  假设 `x > 0`。`itersLeft` 的初始值将大于 0，循环体至少会被执行一次。每次执行循环体时，`itersLeft` 的值都会减少 1。这意味着如果\
  \ `itersLeft` 初始大于 0，在经过有限次数的循环迭代后，`itersLeft` 将等于 0。此时，循环测试结果为 False，控制权传递到 while\
  \ 语句之后的代码。\n\n假设 `x < 0`。发生了非常糟糕的事情。控制权将进入循环，每次迭代都会让 `itersLeft` 远离 0 而不是靠近它。因此，程序将无限执行循环（直到发生其他糟糕情况，例如溢出错误）。我们该如何消除程序中的这个缺陷？将\
  \ `itersLeft` 初始化为 `x` 的绝对值几乎可行。循环终止了，但打印了一个负值。如果将循环内部的赋值语句改为 `ans = ans + abs(x)`，代码就能正常工作。\n\
  \n**练习**：使用 while 循环替换以下代码中的注释。\n\n```python\nnumXs = int(input('How many times\
  \ should I print the letter X? '))\ntoPrint = ''\n#将 X 拼接到 toPrint numXs 次\nprint(toPrint)\n\
  ```\n\n有时在不测试循环条件退出循环是非常方便的。执行 `break` 语句会终止所在的循环，并将控制权转移到紧随循环之后的代码。例如，以下代码\n\n\
  ```python\n#寻找一个同时被 11 和 12 整除的正整数\nx = 1\nwhile True:\n    if x%11 == 0 and x%12\
  \ == 0:\n        break\n    x = x + 1\nprint(x, 'is divisible by 11 and 12')\n```\n\
  \n打印\n\n132 is divisible by 11 and 12\n\n如果在嵌套循环（循环内部循环）中执行 `break` 语句，`break` 将终止内层循环。\n\
  \n我们已经涵盖了开始编写处理数字和字符串的有趣程序所需的几乎全部 Python 知识。在下一章中，我们将暂停学习 Python，并使用已经学的知识来解决一些简单的问题。\n\
  \n**练习**：编写一个程序，要求用户输入 10 个整数，然后打印输入中最大的奇数。如果没有输入任何奇数，则应该打印一条提示信息。\n\n\n\n\n在 Python\
  \ 2 中，`print` 是一个命令而不是函数。因此，你会写这样一行代码：`print 'Yankees rule!', 'but not in Boston'`\n\
  \n是的，原子并不是真正不可分割。然而，拆分它们并非易事，而且这样做可能会产生并不总是如人意的后果。\n\n如果你认为 `π` 的实际值不是 3，那么你是正确的。我们甚至在第\
  \ 16.4 节中证明了这一事实。\n\n“名字又算什么呢？我们称玫瑰为其他名字，它的香气依然芬芳。”\n\n据报道，`Python` 名字的选取是为了纪念英国喜剧剧团蒙蒂派（Monty\
  \ Python）。这让人想到 `IDLE` 这个名字是对该剧团成员埃里克·艾德（Eric Idle）的双关语。\n\n与许多编程语言不同，Python 没有对应字符的类型。相反，它使用长度为\
  \ 1 的字符串。\n\nPython 2 有两个函数 `input` 和 `raw_input` 用于从用户处获取输入。令人困惑的是，Python 2 中的\
  \ `raw_input` 语义与 Python 3 中的 `input` 相同。Python 2 的函数 `input` 将输入的行视为 Python 表达式并推断类型。建议\
  \ Python 2 程序员最好只使用 `raw_input`。\n\n在 2016 年，全球维网上超过 85% 的页面使用 UTF-8 编码。\n\n还可以通过用笔和纸、甚至是文本编辑器来手动模拟程序的运行。\n\
  \n# 3 一些简单的数值程序\n\n现在我们已经涵盖了一些基本的 Python 结构，是时候开始考虑如何组合这些结构来编写一些简单的程序了。在此过程中，我们还会穿插几个更多的语言结构和一些算法技术。\n\
  \n## 3.1 穷举法\n\n图 3.1 中的代码打印一个整数的立方根（如果存在）。如果输入不是完全立方数，它会打印相应的信息。\n\n![art](img/Art_P6.jpg)\n\
  \n**图 3.1 使用穷举法寻找立方根**\n\n对于 `x` 的哪些值，该程序会终止？答案是“所有整数”。这个结论可以非常简单地论证。\n\n*   表达式\
  \ `ans**3` 的值从 0 开始，每次循环时都会变大。\n*   当它达到或超过 `abs(x)` 时，循环终止。\n*   由于 `abs(x)` 总是正数，因此在循环必须终止之前只有有限的迭代次数。\n\
  \n每当你写一个循环时，都应该考虑一个合适的**递减函数**。该函数具有以下属性：\n\n*   它将一组程序变量映射到一个整数。\n*   当进入循环时，它的值是非负的。\n\
  *   当它的值 ≤ 0 时，循环终止。\n*   每次循环结束时，它的值都会减小。\n\n图 3.1 中 `while` 循环的递减函数是什么？它是 `abs(x)\
  \ - ans**3`。\n\n现在，让我们插入一些错误看看会发生什么。首先，尝试注释掉语句 `ans = 0`。Python 解释器会打印错误信息：\n\n\
  ```\nNameError: name 'ans' is not defined\n```\n\n因为解释器在 `ans` 被绑定到任何值之前尝试查找它绑定的值。现在，恢复\
  \ `ans` 的初始化，将语句 `ans = ans + 1` 替换为 `ans = ans`，并尝试寻找 8 的立方根。在你等烦了之后，输入“control\
  \ c”（同时按住控制 键和 c 键）。这将让你回到 shell 中的用户提示符。\n\n现在，在循环开头添加语句：\n\n```python\nprint('Value\
  \ of the decrementing function abs(x) - ans**3 is',\nabs(x) - ans**3)\n```\n\n并尝试再次运行。这一次它会不断打印：\n\
  \n```\nValue of the decrementing function abs(x) - ans**3 is 8\n```\n\n程序将一直运行下去，因为循环体不再减小\
  \ `ans**3` 和 `abs(x)` 之间的距离。当面对一个似乎不会终止的程序时，经验丰富的程序员通常会插入 `print` 语句（如此处所示），来测试递减函数是否确实在递小。\n\
  \n该程序使用的算法技术是**猜测与检查**（guess and check）的一种变体，称为**穷举法**。我们枚举所有可能性，直到得到正确答案或耗尽所有可能性空间。初一看，这似乎是一个解决问题的极其愚蠢的方法。但惊讶的是，穷举算法通常是解决问题最实用的方法。它们通常易于实现且易于理解。而且在很多情况下，它们的运行速度足够快，满足所有实际需求。确保删除或注释掉插入的\
  \ `print` 语句并重新插入语句 `ans = ans + 1`，然后尝试寻找 1957816251 的立方根。程序几乎会瞬间完成。现在，尝试 7406961012236344616。\n\
  \n如你所见，即使需要数次猜测，通常也不是问题。现代计算机的速度惊人。执行一条指令大约需要一纳秒——即一秒十分之一。很难体会那个速度有多快。作为参考，光传播一个英尺（0.3\
  \ 米）所需的时间略多于一纳秒。另一种思考方式是，在声音传播一百英尺的时间内，计算机可以执行数百万条指令。为了好玩，尝试执行代码：\n\n```python\n\
  maxVal = int(input('输入一个正整数: '))\ni = 0\nwhile i < maxVal:\n    i = i + 1\nprint(i)\n\
  ```\n\n对于输入的整数，如果存在这样的对，它将打印出来。\n\n## 3.2 For 循环\n\n我们到为止使用的 `while` 循环是高度风格化的。Python\
  \ 提供了一种语言机制，**for 循环**，可以简化包含此类迭代的程序。\n\n`for` 语句的一般形式如下（斜体词是描述而非实际代码）：\n\n```python\n\
  for variable in sequence:\n    code block\n```\n\n`for` 后变量绑定到序列中的第一个值，并执行代码块。然后变量被赋值第二个值，再次执行代码块。该过程一直持续到序列耗尽或在代码块中执行\
  \ `break` 语句。\n\n绑定 `variable` 的序列通常使用内置函数 `range` 生成。`range` 函数接受三个整数参数：`start`、`stop`\
  \ 和 `step`。它产生序列 `start`、`start + step`、`start + 2*step` 等。如果 `step` 为正，最后一个元素是小于\
  \ `stop` 的最大整数 `start + i*step`。如果 `step` 为负，最后一个元素是大于 `stop` 的最小整数 `start + i*step`。例如，表达式\
  \ `range(5, 40, 10)` 产生序列 5, 15, 25, 35，而 `range(40, 5, -10)` 产生序列 40, 30, 20, 10。如果省略第一个参数，它默认为\
  \ 0；如果省略最后一个参数（步长），默认为 1。例如，`range(0, 3)` 和 `range(3)` 都产生序列 0, 1, 2。序列中的数字是“按需”生成的，因此即使是\
  \ `range(1000000)` 这样的表达式也消耗很少内存。我们将在第 5.2 节中深入讨论 `range`。\n\n较少的情况下，我们通过使用字面量在\
  \ `for` 循环中指定要迭代的序列，例如 [0, 3, 2]。\n\n考虑代码：\n\n```python\nx = 4\nfor i in range(0,\
  \ x):\n    print(i)\n```\n\n它打印：\n\n```\n0\n1\n2\n3\n```\n\n\n\n\n\n# 现在，考虑这段代码\n\
  \n```python\nx = 4\nfor i in range(0, x):\n    print(i)\n\nx = 5\n```\n\n这引发了一个问题：在循环内部更改\
  \ `x` 的值是否会影响迭代次数？并不会。`for` 所在行中 `range` 函数的参数在循环第一次迭代之前会被评估，而不会在后续迭代中重新评估。\n\n\
  为了查看它是如何工作的，请考虑\n\n\n\n```python\nx = 4\nfor j in range(x):\n    for i in range(x):\n\
  \        print(i)\nx = 2\n```\n\n它会输出\n\n0\n1\n2\n3\n0\n1\n0\n1\n0\n1\n\n因为外层循环中的\
  \ `range` 函数只被评估一次，而内层循环中的 `range` 函数在每次进入内部 `for` 语句时都会被评估。\n\n图 3.2 中的代码重新实现了寻找立方根的穷举枚举算法。`for`\
  \ 循环中的 `break` 语句会导致循环在遍历其迭代序列中的每个元素之前终止。\n\n![art](img/Art_P7.jpg)\n\n**图 3.2 使用\
  \ `for` 和 `break` 语句**\n\n`for` 语句可以与 `in` 运算符结合使用，方便地遍历字符串的字符。例如，\n\n```python\n\
  total = 0\nfor c in '12345678':\n    total = total + int(c)\nprint(total)\n```\n\
  \n将字面量 `'12345678'` 表示的字符串中的数字求和并打印总和。\n\n**手指练习**：假设 `s` 是一个包含逗号分隔的数字序列的字符串，例如\
  \ `s = '1.23,2.4,3.123'`。编写一个程序打印 `s` 中数字之和。\n\n## 3.3 近似解与二分查找](#toc.xhtml_Rh1-7)\n\
  \n想象有人要求你写一个程序来寻找任何非负数的平方根。你应该怎么做？\n\n你可能应该首先说你需要一个更好的问题描述。例如，如果要求寻找 2 的平方根，程序应该做什么？2\
  \ 的平方根不是有理数。这意味着没有办法用有限的数字字符串（或 `float`）精确地表示它的值，因此最初陈述的问题是无法解决的。\n\n正确的请求应该是一个寻找平方根的\
  \ `近似值` 的程序——即一个与实际平方根足够接近以至于实用的答案。我们将在书的后后部分详细回到这个问题。但现在，让我们把“足够接近”考虑为位于实际答案与某个常数（我们称之为\
  \ `epsilon`）范围内的答案。\n\n图 3.3 中的代码实现了一个寻找平方根近似值的算法。它使用了一个我们之前未使用的运算符 `+=`。赋值语句 `ans\
  \ += step` 在语义上与更冗长的代码 `ans = ans+step` 等价。运算符 `-=` 和 `*=` 的工作原理也类似。\n\n![art](img/Art_P8.jpg)\n\
  \n**图 3.3 使用穷举枚举近似平方根**\n\n我们再次 使用了穷举枚举。请注意，这种寻找平方根的方法与你在中学可能学过的用铅笔寻找平方根的方法没有任何共同之处。通常情况下，用计算机解决问题的最佳方法与手动处理该问题的方法完全不同。\n\
  \n当运行代码时，它会打印\n\n```\nnumGuesses = 49990\n4.999000000001688 is close to square root\
  \ of 25\n```\n\n我们应该对程序没有发现 25 是一个完全平方数并打印出 5 而感到失望吗？不。程序执行了它应该执行的任务。虽然打印 5 也可以，但这样做与打印任何足够接近\
  \ 5 的值并无优劣。\n\n你认为如果我们设置 `x = 0.25` 会发生什么？它会找到一个接近 0.5 的根吗？不会。它会报告\n\n```\nnumGuesses\
  \ = 2501\nFailed on square root of 0.25\n```\n\n穷举枚举是一种只在搜索值集包含答案时才有效的搜索技术。在这种情况下，我们正在枚举\
  \ 0 到 `x` 值之间的值。当 `x` 于 0 和 1 之间时，`x` 的平方根并不在这个区间内。修复此问题的方法是将 `while` 循环第一行中 `and`\
  \ 的第二个操作数更改为：\n\n```python\nwhile abs(ans**2 - x) >= epsilon and ans*ans <= x:\n\
  ```\n\n现在，让我们考虑程序运行需要多久。迭代次数取决于答案距离 0 有多近以及步长的大小。粗来说，程序执行 `while` 循环最多执行 `x/step`\
  \ 次。\n\n让我们在更大的数字上尝试代码，例如 `x = 123456`。它会运行一段时间，然后打印\n\n```\nnumGuesses = 3513631\n\
  Failed on square root of 123456\n```\n\n你认为发生了什么？显然存在一个浮点数，可以将 123456 的平方根近似在 0.01\
  \ 以内。为什么我们的程序没有找到它呢？问题在于我们的 `step` 太大了，程序跳过了所有合适的的答案。这意味着为了得到一个满意的答案，需要 351,000\
  \ 次猜测。\n\n\n\n\nlow = 0.0 high = 25 ans = 12.5\nlow = 0.0 high = 12.5 ans = 6.25\n\
  low = 0.0 high = 6.25 ans = 3.125\nlow = 3.125 high = 6.25 ans = 4.6875\nlow = 4.6875\
  \ high = 6.25 ans = 5.46875\nlow = 4.6875 high = 5.46875 ans = 5.078125\nlow = 4.6875\
  \ high = 5.078125 ans = 4.8828125\nlow = 4.8828125 high = 5.078125 ans = 4.98046875\n\
  low = 4.98046875 high = 5.078125 ans = 5.029296875\nlow = 4.98046875 high = 5.029296875\
  \ ans = 5.0048828125\nlow = 4.98046875 high = 5.0048828125 ans = 4.99267578125\n\
  low = 4.99267578125 high = 5.0048828125 ans = 4.998779296875\nlow = 4.998779296875\
  \ high = 5.0048828125 ans = 5.0018310546875\n\nnumGuesses = 13\n\n5.00030517578125\
  \ 接近 25 的平方根\n\n注意到，它找到的答案与我们之前的算法不同。这完全没有问题，因为它仍然符合题目的规范。\n\n更重要的是，注意到在循环的每次迭代中，待搜索空间的大小都减了一半。因为它在每一步都将搜索空间平分为二，所以它被称为`二分查找`（bisection\
  \ search）。二分查找相比于我们之前的算法是一个巨大的改进，之前的算法每次迭代仅减少一小部分搜索空间。\n\n让我们再次尝试 `x = 123456`。这次程序只用了三十次猜测就能找到一个可以接受的答案。那么\
  \ `x = 123456789` 呢？它只需要四十五次猜测。\n\n我们使用这种算法来寻找平方根并没有什么特殊之处。例如，通过将几个 2 改为 3，我们可以用它来近似非负数的立方根。在第\
  \ 4 章中，我们引入了一种语言机制，允许我们将此代码泛化以寻找任何根。\n\n**手指练习**：如果将图 3.4 中的语句 `x = 25` 替换为 `x =\
  \ -25`，代码将会做什么？\n\n**手指练习**：需要进行哪些修改才能让图 3.4 中的代码能够同时寻找负数和正数的立方根近似值？（提示：考虑更改 `low`\
  \ 以确保答案落在搜索区域内。）\n\n## 3.4 关于使用浮点数的几句话](#toc.xhtml_Rh1-8)\n\n在大多数情况下，`float` 数字能够为实数提供相当合理的近似。但“大多数时候”并不是“所有时候”，当它们不精确时，可能会导致意想不到的后果。例如，尝试运行以下代码：\n\
  \n```python\nx = 0.0\nfor i in range(10):\n    x = x + 0.1\n    if x == 1.0:\n \
  \       print(x, '= 1.0')\n    else:\n        print(x, 'is not 1.0')\n```\n\n也许你和大多数人一样，会惊讶于它输出了：\n\
  \n0.9999999999999999 不是 1.0\n\n为什么它最初会进入 `else` 分支呢？\n\n为了理解为什么发生这种情况，我们需要理解计算机在计算过程中是如何表示浮点数的。为了理解这一点，我们需要理解`二进制数`（binary\
  \ numbers）。\n\n当你第一次学习十进制（即 10 进制数字）时，你学到任何小数都可以由数字 0123456789 的序列表示。最右侧的数字是 `10⁰`\
  \ 位，下一个数字是……（注：原文此处存在大量重复字符，已根据上下文逻辑提取核心含义）\n\n\n\n实数和浮点数之间的区别真的重要吗？大多数时候，幸运的是，它们并不重要。很少会出现\
  \ `1.0` 是可以接受的答案而 `0.9999999999999999` 不是的情况。然而，有一件事几乎总是值得担心的，相等测试。正如我们所看到的，使用 `==`\
  \ 比较两个浮点值可能会产生意想不到的结果。更合适的方法是询问两个浮点值是否足够接近，而不是它们是否完全相同。因此，例如，写 `abs(x-y) < 0.0001`\
  \ 比写 `x == y` 要好。另一个需要担心的是舍入误差的累积。大多数情况下情况运行得良好，因为有时计算机中存储的数字比预期的的大一点，有时比预期的的小一点。但在某些程序中，误差将朝着同一个方向并随着时间累积。\n\
  \n## 3.5 牛顿-拉夫森法\n\n最常用的近似算法通常归功于艾萨克·牛顿。它通常被称为牛顿法，但有时也被牛顿-拉夫森法^(³⁵)。它可以用于寻找许多函数的实根，但我们将仅在寻找单变量多项式实根的语文中讨论它。向多变量多项式的推广在数学和算法上都是直观的。\n\
  \n单变量的**多项式**（按照惯例，我们将变量写为 `x`）是 0 或有限个非零项之和，例如 `3x² + 2x + 3`。每个项（例如 `3x²`）都由一个常数（该项的**系数**，在本例中为\
  \ `3`）乘以变量（在本例中为 `x`）的非负整数幂（在本例中为 `2`）组成。项中变量的指数称为该项的**次数**。多项式的次数任意单项的最大次数。一些示例是：`3`（次数为\
  \ 0），`2.5x + 12`（次数为 1）和 `3x²`（次数为 2）。相比之下，`2/x` 和 `x^(0.5)` 不是多项式。\n\n如果 `p` 是多项式，`r`\
  \ 是实数，我们将写 `p(r)` 来表示 `x = r` 时多项式的值。多项式 `p` 的**根**是方程 `p = 0` 的解，即使得 `p(r) = 0`\
  \ 的 `r`。因此，例如，寻找 24 的平方根的近似值可以表述为寻找使得 `x² − 24 ≈ 0` 的 `x`。\n\n牛顿证明了一个定理，如果一个值（称为\
  \ `guess`）是多项式根的近似值，那么 `guess – p(guess)/p’(guess)`（其中 `p’` 是 `p` 的一导）是一个更好的近似值^(³⁶)。\n\
  \n对于任何常量 `k` 和任何系数 `c`，多项式 `cx² + k` 的一导是 `2cx`。例如，`x² – k` 的一导是 `2x`。因此，我们可以通过选择\
  \ `y - (y² - k)/2y` 作为下一次猜测来改进当前的猜测（称为 `y`）。这被称为**迭代近似**。图 3.5 包含了说明如何使用这一想法来快速找到平方根近似值的代码。\n\
  \n![art](img/Art_P10.jpg)\n\n**图 3.5 牛顿-拉夫森法的实现**\n\n**手指练习**：在牛顿-拉夫森法的实现中添加一些代码，以跟踪找到根时使用的迭代次数。使用该代码作为程序的一部分，比较牛顿-拉夫森法和二分查找的效率。（你会发现牛顿-拉夫森法更高效。）\n\
  \n---\n\n³⁷ 在 Python 2 中，`range` 在调用时会生成整个序列。因此，像 `range(1000000)` 这样的表达式消耗大量的内存。在\
  \ Python 2 中，`xrange` 的行为类似于 Python 3 中 `range` 的行为。\n\n³⁸ 在 Python 2 中发生了另一种奇怪的事情。由于\
  \ `print` 语句会进行一些自动舍入，`else` 子句会打印 `1.0` 不是 `1.0`。\n\n³⁹ 约瑟夫·拉夫森在牛顿相同的时间发表了类似的方法。\n\
  \n⁴⁰ 函数 `f(x)` 的导数可以被认为表示 `f(x)` 的值随 `x` 的的变化。如果你以前没有遇到过导数，不要担心。你不需要理解它们，或者理解多项式，就可以理解牛顿法的实现。\n\
  \n## 4. 函数、作用域与抽象\n\n到为止，我们引入了数字、赋值、输入/输出、比较和循环结构。这个 Python 的子集有多强大？从理论意义上说，它是你所需要的强大程度，即它是图灵完备的。这意味着如果一个问题可以通过计算解决，它就可以只使用你已经过的语句来解决。\n\
  \n这并不是说你应该只使用这些语句。在这个阶段，我们已经涵盖了许多语言机制，但代码一直是一个单一的指令序列，合并在一起。例如，在最后一章中，我们查看了图 4.1\
  \ 中的代码。\n\n![art](img/Art_P11.jpg)\n\n**图 4.1 使用二分查找近似平方根**\n\n这是一段合理的代码，但它缺乏通用性。它只对由变量\
  \ `x` 和 `epsilon` 表示的值有效。这意味着如果我们想重用它，我们需要复制代码，可能需要编辑变量名，并将其粘贴到我们需要的地方。正因如此，我们无法在某些其他更复杂的计算中轻松使用此计算。\n\
  \n此外，如果我们想计算立方根而不是平方根，我们必须编辑代码。如果我们想要一个既计算平方根又计算立方根的程序（或者说在两个不同的地方计算平方根），程序将包含多个块几乎相同的代码。这是一个非常糟糕的事情。程序包含的代码越多，出错的可能性就越大，代码也就越难以维护。例如，假设平方根的初始实现有一个错误，并在测试程序时发现了这个错误。很容易修复一个地方的平方根实现，却忘记了其他地方也有类似的代码。\n\
  \nPython 提供了几种语言特性，使得能够容易地泛化和重用。最重要的就是函数。\n\n## 4.1 函数与作用域\n\n我们已经使用了一些内置函数，例如图\
  \ 4.1 中的 `max` 和 `abs`。程序员定义并像使用内置函数一样使用他们自己的函数的能力是一个质的飞跃。\n\n### 4.1.1 函数定义\n\n\
  在 Python 中，每个**函数定义**的形式如下^(⁴¹)\n\n```\ndef 函数名(形式参数列表):\n    函数体\n```\n\n例如，我们可以通过代码定义函数\
  \ `maxVal`^(⁴²)：\n\n```\ndef maxVal(x, y):\n    if x > y:\n        return x\n  \
  \  else:\n        return y\n```\n\n`def` 是一个保留字，告诉 Python 将要定义函数。函数名（在本例中为 `maxVal`）只是用于引用该函数的名称。\n\
  \n函数名括号内的名称序列（在本例中为 `x`, `y`）是函数的**形式参数**。当使用函数时，形式参数绑定（类似于赋值语句）到**函数调用**（也称为函数实参）的**实际参数**（通常称为**参数**）。例如，调用\
  \ `maxVal(3, 4)` 将 `x` 绑定到 3 并 `y` 绑定到 4。\n\n函数体是任何 Python 代码.^(⁴³)。然而，有一个特殊的语句\
  \ **return**，它只能在函数体中使用。\n\n\n\n函数调用是一个表达式，和所有所有表达式一样，它有一个值。这个值就是被调用函数返回的值。例如，表达式\
  \ `maxVal(3,4)*maxVal(3,2)` 的值为 `12`，因为 `maxVal` 的第一次调用返回整数 `int` `4`，第二次调用返回整数\
  \ `int` `3`。请注意，`return` 语句的执行会终止函数的调用。\n\n复习一下，当函数被调用时：\n\n1. 构成实际参数的表达式会被求值，并将函数的的形式参数绑定到结果值上。例如，调用\
  \ `maxVal(3+4, z)` 将将形式参数 `x` 绑定到 `7`，并将形式参数 `y` 绑定到执行调用时变量 `z` 所拥有的任何值。\n2. `执行点`（下一个要执行的指令）从调用点移动到函数体的第一条语句。\n\
  3. 函数体中的代码将一直执行，直到遇到 `return` 语句（此时 `return` 之后表达式的值将成为函数调用的值），或者没有更多可执行的语句（此时函数返回值\
  \ `None`）。（如果 `return` 后面没有表达式，则调用的值为 `None`。）\n4. 调用的值就是返回的值。\n5. 执行点传回到调用之后的后续代码。\n\
  \n参数提供了所谓的 `lambda 抽象` 的机制，允许程序员编写的代码不是操作特定的对象，而是操作函数调用者选择作为实际参数的任何对象。\n\n**手指练习：**\
  \ 写一个函数 `isIn`，它接受两个字符串作为参数，如果其中一个字符串出现在另一个的任意位置，则返回 `True`，否则返回 `False`。提示：你可能想使用内置的字符串操作\
  \ `in`。\n\n## 4.1.2 关键字参数和默认值\n\n在 Python 中，形式参数绑定到实际参数有两种。最常见的方法（也是我们目前为止使用的唯一方法）被称为`位置`参数——第一个形式参数绑定到第一个实际参数，第二个形式参数绑定到第二个实际参数，依此类推。Python\
  \ 还支持`关键字参数`，在这种形式下，通过形式参数的名字来绑定实际参数。考虑以下函数定义：\n\n```python\ndef printName(firstName,\
  \ lastName, reverse):\n    if reverse:\n        print(lastName + ', ' + firstName)\n\
  \    else:\n        print(firstName, lastName)\n```\n\n函数 `printName` 假设 `firstName`\
  \ 和 `lastName` 是字符串，且 `reverse` 是一个 `Boolean`。如果 `reverse == True`，它打印 `lastName`、`firstName`，否则打印\
  \ `firstName` `lastName`。\n\n以下每个项都是 `printName` 的等效调用：\n\n```python\nprintName('Olga',\
  \ 'Puchmajerova', False)\nprintName('Olga', 'Puchmajerova', reverse = False)\nprintName('Olga',\
  \ lastName = 'Puchmajerova', reverse = False)\nprintName(lastName = 'Puchmajerova',\
  \ firstName = ' Olga', reverse = False)\n```\n\n虽然关键字可以在实际参数列表中任意排序，但在关键字参数后面跟随非关键字参数是非法的。因此，以下代码会产生错误信息：\n\
  \n```python\nprintName('Olga', lastName = 'Puchmajerova', False)\n```\n\n关键字参数通常与`默认参数值`结合使用。例如，我们可以写：\n\
  \n```python\ndef printName(firstName, lastName, reverse = False):\n    if reverse:\n\
  \        print(lastName + ', ' + firstName)\n    else:\n        print(firstName,\
  \ lastName)\n```\n\n默认值允许程序员用少于指定数量的参数来调用函数。例如：\n\n```python\nprintName('Olga',\
  \ 'Puchmajerova')\nprintName('Olga', 'Puchmajerova', True)\nprintName('Olga', 'Puchmajerova',\
  \ reverse = True)\n```\n\n将打印：\n\n`Olga Puchmajerova`\n`Puchmajerova, Olga`\n`Puchmajerova,\
  \ Olga`\n\n最后两次 `printName` 调用在语义上是等价。最后一次的优势在于为可能神秘的参数 `True` 提供了一些文档。\n\n### 4.1.3\
  \ 作用域\n\n让我们来看另一个例子：\n\n```python\ndef f(x): # name x 用作形式参数\n    y = 1\n    x =\
  \ x + y\n    print('x =', x)\n    return x\n\nx = 3\ny = 2\nz = f(x) # value x 用作实际参数\n\
  print('z =', z)\nprint('x =', x)\nprint('y =', y)\n```\n\n运行此代码，将打印：\n\n```\nx =\
  \ 4\nz = 4\nx = 3\ny = 2\n```\n\n这里发生了什么？在调用 `f` 时，形式参数 `x` 在本地绑定到实际参数 `x` 的值。需要注意的是，尽管实际参数和形式参数名称相同，但它们并不是同一个变量。每个函数都定义了一个新的`命名空间`，也称为`作用域`。`f`\
  \ 中使用的形式参数 `x` 和`局部变量` `y` 只存在于 `f` 定义的作用域内。函数体内的赋值语句 `x = x + y` 将局部名称 `x` 绑定到对象\
  \ `4`。`f` 中的赋值对 `f` 作用域之外存在的名称 `x` 和 `y` 的绑定没有任何影响。\n\n这里是思考此问题的一种方法：\n\n1. 在顶层（即\
  \ shell 层级），一个`符号表`跟踪该层级定义的所有名称。当函数被调用时，会创建一个新的符号表（通常称为`栈帧`）。该表跟踪函数内部定义的名称（包括形式参数）。\n\
  \n2. 当函数完成时，它的帧就会消失。在 Python 中，人们可以通过查看程序文本确定名称的作用域。这被称为`静态`或`词法`作用域。\n\n\n\n接下来调用\
  \ `g`，并添加一个包含 `g` 的局部变量 `x` 的栈帧（第 5 列）。当 `g` 返回时，该栈帧被弹出（第 6 列）。当 `f` 返回时，包含与 `f`\
  \ 关联名称的栈帧被弹出，我们回到了原始栈帧（第 7 列）。\n\n注意，当 `f` 返回时，尽管变量 `g` 不再存在，但该名称曾经过的函数类型对象仍然存在。这是因为函数是对象，可以像任何其他对象一样被返回。因此，`z`\
  \ 可以绑定到 `f` 返回的值，并且可以使用函数调用 `z()` 来调用在 `f` 内部绑定到名称 `g` 的函数——即使名称 `g` 在 `f` 的上下文之外是不可知的。\n\
  \n那么，图 4.2 中的代码打印了什么？它打印了：\n\n```\nx = 4\nz = 4\nx = abc\nx = 4\nx = 3\nz = <function\
  \ f.<locals>.g at 0x1092a7510>\nx = abc\n```\n\n对名称引用的出现顺序并不重要。如果对象在函数体的任何地方被绑定到一个名称（即使它在作为赋值左侧出现之前出现在表达式中），它被视为该函数的局部变量。^(⁴⁵)\
  \ 考虑以下代码：\n\n```python\ndef f():\n    print(x)\n\ndef g():\n    print(x)\n\nx =\
  \ 1\nx = 3\nf()\nx = 3\ng()\n```\n\n当调用 `f` 时，它打印 3；当遇到 `g` 中的 print 语句时，会打印错误信息：\n\
  \n`UnboundLocalError: local variable 'x' referenced before assignment`\n\n这是因为 print\
  \ 语句之后的赋值语句导致 `x` 变成了 `g` 的局部变量。由于 `x` 是 `g` 的局部变量，因此在执行 print 语句时它还没有值。\n\n感到困惑了吗？大多数人需要一点时间来理解作用域规则。不要让这困扰你。现在，尽管向前冲开始使用函数吧。大多数情况下，你会发现自己只想使用函数的局部变量，而作用域的微妙之处将变得无关。\n\
  \n## 4.2 规范 (#toc.xhtml_Rh1-11)\n\n图 4.4 定义了一个函数 `findRoot`，它推广了我们在图 4.1 中用于寻找平方根的二分法。它包含一个函数\
  \ `testFindRoot`，可以测试 `findRoot` 是否按预期工作。\n\n![art](img/Art_P14.jpg)\n\n**图 4.4\
  \ 寻找根的近似值**\n\n`testFindRoot` 函数几乎和 `findRoot` 本身一样长。对于经验的程序员来说，编写这样的测试函数往往看起来是浪费精力。然而，经验丰富的程序员知道，编写测试代码的投资通常会有丰厚的回报。这比在调试期间（找出程序无法运行的原因并修复它）反复在\
  \ shell 中输入测试用例要好得多。它还迫使我们思考哪些测试最有启发性。\n\n三引号之间的文本在 Python 中被称为 docstring（文档字符串）。按照惯例，Python\
  \ 程序员使用 docstring 来提供函数的规范。这些 docstring 可以使用内置函数 `help`访问。例如，如果我们进入 shell 并输入 `help(abs)`，系统将显示：\n\
  \n```\nHelp on built-in function abs in module built-ins:\nabs(x)\nReturn the absolute\
  \ value of the argument.\n```\n\n如果图 4.4 中的代码已加载到 IDE 中，在 shell 中输入 `help(findRoot)`\
  \ 将显示：\n\n```\nfindRoot(x, power, epsilon)\nAssumes x and epsilon int or float,\
  \ power an int,\nepsilon > 0 & power >= 1\nReturns float y such that y**power is\
  \ within epsilon of x.\nIf such a float does not exist, it returns None\n```\n\n\
  如果在编辑器中输入 `findRoot(`，将显示形式参数列表。\n\n函数的规范定义了函数实现者与编写使用该函数的程序的人之间的约定。我们将函数的用户称为其客户端（clients）。这个契约可以被认为包含两个部分：\n\
  \n*   **假设（Assumptions）：** 这些描述了函数客户端必须满足的条件。通常，它们描述了对实际参数的约束。几乎所有情况下，它们规定了每个参数可接受的类型集合，并且经常对一个或多个参数的值有某些约束。例如，`findRoot`\
  \ docstring 的前两行描述了 `findRoot` 客户端必须满足的假设。\n*   **保证（Guarantees）：** 这些描述了函数必须满足的条件，前提是它是以满足假设的方式调用的。`findRoot`\
  \ docstring 的最后两行描述了函数实现必须满足的保证。\n\n函数是创建计算元素的一种，我们可以将其视为原语。就像我们有内置函数 `max` 和 `abs`\
  \ 一样，我们也希望有一个用于寻找根以及许多其他复杂操作的等内置函数。函数通过提供分解和抽象实现了这一点。\n\n**分解（Decomposition）**创建了结构。它允许我们将程序拆分成合理上自包含的部分，这些部分可以在不同的环境中被重用。**抽象（Abstraction）**隐藏了细节。它允许我们像使用黑盒一样使用一段代码——也就是说，我们无法、不需要、也不应该想要看到它的内部细节。^(⁴⁶)\
  \ 抽象的本质是保留给定上下文中相关信息，并忘记无关信息。在编程中有效使用抽象的关键在于找到一个对于抽象的构建者和潜在客户端都适当的相关性概念。这才是真正的编程艺术。\n\
  \n\n\n`findRoot` 的规范是对所有符合该规范的可能实现的抽象。`findRoot` 的调用者可以假设实现符合规范，但不应假设其他任何内容。例如，调用者可以假设调用\
  \ `findRoot(4.0, 2, 0.01)` 返回一个其平方在 3.99 到 4.01 之间的值。返回的值可能是正的也可能是负的，尽管 4.0 是一个完全平方数，返回的值也可能不是\
  \ `2.0` 或 `-2.0`。\n\n### 4.3 递归\n\n你可能听过 `recursion`（递归），并且很可能认为它是一种相当微妙的编程技术。这只是计算机科学家们为了传传的一个迷人的都市传说，目的是为了让人们认为我们比实际的要聪明得多。递归是一个非常重要的概念，但它并不那么微妙，而且不仅仅是一种编程技术。\n\
  \n作为一种描述性方法，递归被广泛使用，即使是那些做梦都不想过写程序的人也会使用。考虑美国法典中定义“土生”公民概念的部分条款。粗略来说，该定义如下：\n\n\
  * 任何在美国境内出生的孩子，\n* 任何在美国境外通过婚姻出生的孩子，且其父母均为美国公民，前提是其中一个父母在孩子出生前曾居住过美国，以及\n* 任何在美国境外通过婚姻出生的孩子，其其中一个父母是美国公民，且在孩子出生前已在美国至少居住了五年，前提是这些年份中至少有两年是在该公民十四岁生日之后。\n\
  \n第一部分非常简单；如果你在美国出生，你就是土生美国公民（例如巴拉克·奥巴马）。如果你不是在美国出生，就必须判断你的父母是否为美国公民（无论是土生美国还是归归的）。要确定你的父母是否为美国公民，你可能需要查看你的祖父母，以此此类推。\n\
  \n通常，一个递归定义由两部分组成。至少有一个 `base case`（基准情况），它直接指定特殊情况的结果（上述示例中的情况 1），并且至少有一个 `recursive\
  \ (inductive) case`（递归/归纳情况，上述示例中的情况 2 和 3），它根据对其他输入上问题的答案来定义当前答案，这些输入通常是同一个问题的更简单版本。\n\
  \n世界上最简单的递归定义可能是自然数上的阶乘函数（在数学中通常写作 `!`）。经典的 `inductive definition` 是：\n\n```\n1!\
  \ = 1\n(n + 1)! = (n + 1) * n!\n```\n\n第一个方程定义了基准情况。第二个方程定义了除基准情况以外的所有自然数的阶乘，它是根据前一个数的阶乘来定义的。\n\
  \n[图 4.5] 包含了阶乘的迭代实现 (`factI`）和递归实现 (`factR`）。\n\n![art](img/Art_P15.jpg)\n\n**图\
  \ 4.5 阶乘的迭代和递归实现**\n\n这个函数足够简单，这两种实现都不难以理解。尽管如此，第二种实现是对原始递归定义更直观的翻译。\n\n在 `factR`\
  \ 的体内部调用 `factR` 来实现它，似乎像是在作弊。但它的工作原理与迭代实现有效的原因相同。我们知道 `factI` 中的迭代会终止，因为 `n` 开始是正数，并且每次循环都会减\
  \  1。这意味着它永远不会大于 1。同样，如果用 1 调用 `factR`，它将返回一个值而不进行递归调用。当它进行递归调用时，它使用的值总是比调用它的值小\
  \ 1。最终，递归在调用 `factR(1)` 时终止。\n\n#### 4.3.1 波斐那契数列\n\n波斐那契数列是另一个通常递归定义的常用数学函数。“繁殖得像兔子一样”常被用来描述说话者认为增长过快的种群。在\
  \ 1202 年，意大利数学家莱奥纳多·迪·皮萨（也称为斐波那契）开发了一个公式来量化这一概念，尽管包含了一些并不现实的假设。\n\n假设有一对新生的兔子（一公一雌）被放入圈中（或者更糟，被释放到野外）。进一步假设兔子在一个月大时就可以繁殖（令人惊讶的是，某些品种确实可以），并且有一个有一个月的妊娠期（令人惊讶的是，某些品种确实如此）。最后，假设这些神话中的兔子永远不死，而且母兔子从第二个月开始每个月都会产生一对新兔子（一公一雌）。六个月后会有多少只母兔子？\n\
  \n第一个月的最后一天（称为第 0 个月），有一只母兔子（准备在下个月的第一天受孕）。第二个月的最后一天，仍然只有一只母兔子（因为她直到下个月的第一天才会生产）。下个月的最后一天，会有两只母兔子（一只怀孕，一只没怀孕）。再下个月最后一天，会有三只母兔子（两只怀孕，一只没怀孕）。以此此类推。让我们用表格的形式来看这个进展，[图\
  \ 4.6]。注意，对于 `n > 1`，`females(n) = females(n-1) + females(n-2)`。\n\n![art](img/Art_P16.jpg)\n\
  \n**图 4.6 母兔子数量的增长**\n\n种群的增长自然地通过以下递归公式描述：\n\n```\nfemales(0) = 1\nfemales(1) =\
  \ 1\nfemales(n + 2) = females(n+1) + females(n)\n```\n\n这个定义与阶乘的递归定义有些不同：\n\n* 它有两个基准情况，而不是只有一个。通常，你可以根据需要有任意多个。\n\
  * 在递归情况下，有两个递归调用，而不是只有一个。同样，你可以根据需要任意多个。\n\n[图 4.7] 包含了波斐那契递归的直接实现，以及一个用于测试它的函数。\n\
  \n![art](img/Art_P17.jpg)\n\n**图 4.7 波斐那契数列的递归实现**\n\n编写代码是解决这个问题的简单部分。一旦我们从问题的模糊陈述转向一组递归方程，代码几乎是自动写出来的。找到某种表示当前问题解决方案的抽象方法通常是构建实用程序中最困难的一步。我们将在书中后面详细讨论这一点。\n\
  \n正如你可能猜到的那样，这并不是野外兔子种群增长的完美模型。1859 年，澳大利亚农夫托马斯·奥斯汀从英国进口了 24 只兔子作为狩猎目标。十年后，澳大利亚每年有约两百万兔子被射杀或捕捉，但对种群没有明显影响。这是一个巨大的数字，但远小于第\
  \ 120 个波斐那契数。\n\n**指尖练习：** 当使用图 4.7 中的 `fib` 实现计算 `fib(5)` 时，在计算 `fib(5)` 的过程中，计算了多少次\
  \ `fib(2)` 的值？\n\n\n\n递归也适用于许多不涉及数字的问题。图 4.8 包含一个名为 `isPalindrome` 的函数，它用于检查一个字符串正反读起来是否相同。\n\
  \n`isPalindrome` 函数包含两个内部辅助函数。对于函数的调用者来说，这些应该不感兴趣，他们只需要关心 `isPalindrome` 是否符合其规范即可。但你应该感兴趣，因为通过检查实现代码可以学习到很多东西。\n\
  \n辅助函数 `toChars` 将所有字母转换为小写并移除所有非字母字符。它首先使用字符串的内置方法来生成一个与 `s` 相同的字符串，区别在于所有大写字母都已转换成小写。当我们学习类时，我们会更多地讨论关于方法调用的内容。现在，请把它看作是函数调用的一种奇特语法。我们没有在函数名后的圆括号内放置第一个（在此\
  \ particular 例中也是唯一的）参数，而是使用点表示法将该参数放在函数名之前。\n\n![art](img/Art_P18.jpg)\n\n**图 4.8\
  \ 回文测试**\n\n辅助函数 `isPal` 使用递归来完成实际工作。两个基准情况是长度为零或一的字符串。这意味着实现的递归部分只有在长度为二或以上的字符串上才会被。else\
  \ 子句中的逻辑与^(⁵²) 从左到右求值。代码首先检查第一个字符和最后一个字符是否相同，如果继续检查去掉这两个字符后的字符串是否为回文。在这个例子中，除非第一个合项结果为\
  \ True，否则不会评估第二个合项，这在语义上是无关的。然而，在书的后面，我们将看到某些例子，布尔表达式的这种短路求值在语义上是有相关的。\n\n`isPalindrome`\
  \ 的这种实现是一个重要的解决问题原理的示例，被称为分治法。（该原理与分治算法有关，但略有不同，后者在第 10 章中讨论。）该解决问题的原理是通过将一个困难的问题分解为一组具有以下属性的子问题来攻克它：\n\
  \n*   子问题比原问题更容易解决，且\n*   子问题的解决方案可以组合起来解决原问题。\n\n分治是一个非常古老的思想。尤利斯·凯撒实践了罗马人所说的*divide\
  \ et impera*（分治法）。英国人出色地运用了这种方法来控制印度次大陆。本杰明·富兰克林非常意识到英国人在使用这种技术方面的专长，这促他在签署《美国独立宣言》时说：“我们必须全体团结在一起，否则我们注定各自散死。”\n\
  \n在这种情况下，我们通过将原问题分解为相同问题的更简单版本（检查较短的字符串是否为回文）以及我们知道如何做的简单事情（比较单个字符）来解决问题，然后用 `and`\
  \ 将解决方案组合。图 4.9 包含了一些可以可视化这一工作原理的代码。\n\n![art](img/Art_P19.jpg)\n\n**图 4.9 用于可视化回文测试的代码**\n\
  \n当运行 `testIsPalindrome` 时，它将打印：\n\n```\nTry dogGod\nisPal called with doggod\n\
  isPal called with oggo\nisPal called with gg\nisPal called with\nAbout to return\
  \ True from base case\nAbout to return True for gg\nAbout to return True for oggo\n\
  About to return True for doggod\nTrue\nTry doGood\nisPal called with dogood\nisPal\
  \ called with ogoo\nisPal called with go\nAbout to return False for go\nAbout to\
  \ return False for ogoo\nAbout to return False for dogood\nFalse\n```\n\n## 4.4\
  \ 全局变量](#toc.xhtml_Rh1-13)\n\n如果你尝试用一个大数字调用 `fib`，你可能注意到它运行了很长时间。假设我们想知道进行了多少递归调用？我们可以对代码进行仔细的分析并得出结果，在第\
  \ 9 章中我们将讨论如何做到。另一种方法是添加一些计算调用次数的代码。实现这种方法的方法是使用全局变量。\n\n到为止，我们编写的所有函数仅通过其参数和返回值与其环境进行通信。在大多数情况下，这正应该是那样的。这通常会导致程序相对容易阅读、测试和调试。然而，每隔偶尔全局变量就会派上用场。考虑图\
  \ 4.10 中的代码。\n\n在每个函数中，代码行 `global numFibCalls` 告诉 Python，名称 `numCalls` 应该定义在代码行所在模块的最外作用范围内（参见第\
  \ 4.5 节），而不是代码所在函数的作用范围内。如果我们没有包含 `global numFibCalls` 代码，名称 `numFibCalls` 将是 `fib`\
  \ 和 `testFib` 每个函数的局部变量，因为 `numFibCalls` 在 `fib` 和 `testFib` 中都出现在赋值语句的左侧。函数 `fib`\
  \ 和 `testFib` 都对变量 `numFibCalls` 所引的对象不受限制地访问。函数 `testFib` 每次调用 `fib` 时将 `numFibCalls`\
  \ 绑定到 0，而 `fib` 每次进入 `fib` 时都会增加 `numFibCalls` 的值。\n\n![art](img/Art_P20.jpg)\n\n\
  **图 4.10 使用全局变量**\n\n```\nThe call testFib(6) produces the output\nfib of 0 = 1\n\
  called 1 times.\nfib of 1 = 1\ncalled 1 times.\nfib of 2 = 2\ncalled 3 times.\n\
  fib of 3 = 3\ncalled 5 times.\nfib of 4 = 5\ncalled 9 times.\nfib of 5 = 8\ncalled\
  \ 15 times.\nfib of 6 = 13\ncalled 25 times.\n```\n\n我们在引入全局变量这个话题时带有某种忌惮。自 20 世纪\
  \ 70 年代以来，资深计算机科学家们一直在反对它们。无区别地使用全局变量会导致很多问题。使程序可读性的关键在于局部性。人们每次只读一部分程序，理解每个部分所需的上下文越少越好。由于全局变量可以在许多地方被修改或读取，粗率使用它们会破坏局部性。尽管如此，在某些时刻它们是所需要的。\n\
  \n## 4.5 模块](#toc.xhtml_Rh1-14)\n\n到目前，我们一直假设整个程序都存储在一个文件中。只要程序很小，这是完全合理的。然而，随着程序变大，将它们的不同部分存储在不同的文件中通常更方便。例如，假设有多个人在编写同一个程序。如果他们都试图更新同一个文件，那将是一场噩梦。Python\
  \ 模块允许我们从多个文件的代码轻松构建程序。\n\n**模块**是一个包含 Python 定义和语句的 .py 文件。例如，我们可以创建一个 `circle.py`\
  \ 文件，包含图 4.11 中的代码。\n\n![art](img/Art_P21.jpg)\n\n**图 4.11 与圆和球体的一些代码**\n\n程序通过\
  \ import 语句访问模块。例如，以下代码：\n\n```\nimport circle\npi = 3\nprint(pi)\nprint(circle.pi)\n\
  print(circle.area(3))\nprint(circle.circumference(3))\nprint(circle.sphereSurface(3))\n\
  ```\n\n将打印：\n\n3\n3.14159\n28.27431\n18.849539999999998\n113.09724\n\n\n\n模块通常存储在单独的文件。每个模块都有自己的私有符号表。因此，在\
  \ `circle.py` 内部，我们以通常的方式访问对象（例如 `pi` 和 `area`）。执行 `import M` 会在导入语句出现的作用范围内为模块\
  \ `M` 创建一个绑定。因此，在导入上下文中，我们使用点符号法（dot notation）来表示我们引用的是在导入模块中定义的名称。例如，在 `circle.py`\
  \ 之外，引用 `pi` 和 `circle.pi` 可以（并且在这种情况下确实会）指向不同的对象。\n\n初看之下，使用点符号法似乎很繁琐。但另一方面，当人们导入一个模块时，往往并不知道该模块实现中可能使用了哪些局部名称。使用点符号法来完全限定名称可以避免因意外名称冲突而导致的问题。例如，在\
  \ `circle` 模块之外执行赋值 `pi = 3` 不会改变 `circle` 模块内部使用的 `pi` 值。\n\n导入语句还有一种变体，允许导入程序在访问导入模块内部定义的名称时省略模块名。执行语句\
  \ `from M import *` 会在当前作用范围内创建 `M` 中定义的所有对象的绑定，但不会创建 `M` 本身。例如，代码\n\n```python\n\
  from circle import *\n\nprint(pi)\n\nprint(circle.pi)\n```\n\n将首先打印 `3.14159`，然后产生错误消息\n\
  \n`NameError: name 'circle' is not defined`\n\n一些 Python 程序员并不喜欢这种形式的导入，因为他们认为这会让代码更难读。\n\
  \n正如我们所见，模块可以包含可执行语句以及函数定义。通常，这些语句用于初始化模块。出于这个原因，模块中的语句只在模块第一次被导入到程序时执行。此外，模块在每个解释器会话中只导入一次。如果你启动一个\
  \ shell，导入一个模块，然后更改该模块的内容，解释器仍将使用模块的原始版本。这在调试时可能会导致令人困惑的行为。在不确定时，请启动一个新的 shell。\n\
  \nPython 标准库中包含了许多有用的模块。例如，很少有必要自己实现常见的数学函数或字符串函数。该库的描述可以在 [`docs.python.org/2/library/`](http://docs.python.org/2/library/)\
  \ 找到。\n\n## 4.6 文件\n\n每个计算机系统都使用文件将内容从一次计算保存到下一次计算。Python 提供了许多创建和访问文件的设施。在这里我们说明其中一些基本设施。\n\
  \n每个操作系统（例如 Windows 和 MAC OS）都有自带的用于创建和访问文件的文件系统。Python 通过被称为 `file handle`（文件句柄）的东西来实现操作系统的独立性。代码\n\
  \n```python\nnameHandle = open('kids', 'w')\n```\n\n指示操作系统创建一个名为 `kids` 的文件，并返回该文件的句句柄。`open`\
  \ 的参数 `'w'` 表示以写入模式打开文件。以下代码打开一个文件，使用 `write` 方法写入两行，然后关闭文件。在程序结束使用文件时记住关闭文件是非常重要的。否则，存在部分或所有写入未保存的风险。\n\
  \n```python\nnameHandle = open('kids', 'w')\n\nfor i in range(2):\n    name = input('Enter\
  \ name: ')\n    nameHandle.write(name + '\\n')\nnameHandle.close()\n```\n\n在 Python\
  \ 字符串中，转义字符 `\\\"` 用于指示下一个字符应该被特殊方式处理。在这个示例中，字符串 `'\\n'` 表示一个换行符。\n\n我们现在可以为了读取打开文件（使用参数\
  \ `'r'`），并打印其内容。由于 Python 将文件视为行的序列，我们可以使用 `for` 语句来遍历文件的内容。\n\n```python\nnameHandle\
  \ = open('kids', 'r')\n\nfor line in nameHandle:\n    print(line)\nnameHandle.close()\n\
  ```\n\n如果我们输入了名字 David 和 Andrea，这将打印\n\nDavid\n\nAndrea\n\nDavid 和 Andrea 之间多出来的一行是因为\
  \ `print` 每次遇到文件每行末尾的 `'\\n'` 都会开启新行。我们可以通过编写 `print(line[:-1])` 来避免打印该行。代码\n\n\
  ```python\nnameHandle = open('kids', 'w')\nnameHandle.write('Michael\\n')\nnameHandle.write('Mark\\\
  n')\nnameHandle.close()\n\nnameHandle = open('kids', 'r')\n\nfor line in nameHandle:\n\
  \    print(line[:-1])\nnameHandle.close()\n```\n\n将打印\n\nMichael\n\nMark\n\nDavid\n\
  \nAndrea\n\n注意，我们重写了文件 `kids` 之前的内容。如果我们不想这样做，可以使用参数 `'a'` 以追加模式（而不是写入模式）打开文件。例如，如果我们现在运行代码\n\
  \n```python\nnameHandle = open('kids', 'a')\nnameHandle.write('David\\n')\nnameHandle.write('Andrea\\\
  n')\nnameHandle.close()\n\nnameHandle = open('kids', 'r')\n\nfor line in nameHandle:\n\
  \    print(line[:-1])\nnameHandle.close()\n```\n\n它将打印\n\nMichael\n\nMark\n\nDavid\n\
  \nAndrea\n\n一些常见的文件操作在图 4.12 中总结。\n\n![art](img/Art_P22.jpg)\n\n**图 4.12 访问文件的常用函数**\n\
  \n\n\n\n到目前为止，我们过的程序涉及到三种对象：`int`、`float` 和 `str`。数值类型 `int` 和 `float` 是标量类型。相比之下，`str`\
  \ 可以被视为结构化或非标量的类型。你可以使用索引来提取字符串中的单个字符，使用切片来提取子字符串。\n\n在本章中，我们将介绍四种额外的结构化类型。其中 `tuple`（元组）是\
  \ `str` 的简单推广。其他三个——`list`、`range` 和 `dict`——更有趣。我们还会回到函数如何处理与其他类型相同的话题。\n\n## 5.1\
  \ 元组 (Tuples)\n\n与字符串类似，`tuples` 是有序序列。区别在于元组的元素是不可变的。元组元素可以是任何类型，且不需要与其他元素的类型相同。\n\
  \n类型 `tuple` 的字面量是通过括号内包含逗号分隔的元素定义的。例如，我们可以写：\n\n```python\nt1 = ()\nt2 = (1, 'two')\n\
  ```\n\n出乎意料的是，下面的 print 语句输出：\n\n```\n()\n(1, 'two')\n```\n\n看到这个例子，你可能自然地认为包含单个值的元组会写成\
  \ `(1)`。但引用尼克松的话，“那样是错误的。”由于括号被用于分组表达式，为了表示包含该值的元组，我们写 `(1,)`。几乎每个使用 Python 的人都会无意中漏掉这个恼人的逗号。\n\
  \n重复操作可以用在元组。例如，表达式 `3*('a', 2)` 等于 `('a', 2, 'a', 2)`。\n\n与字符串类似，元组可以进行拼接、索引和切片。考虑：\n\
  \n```python\nt1 = (1, 'two', 3)\nt2 = (4, 5)\n\nprint(t2)\nprint((t1 + t2))\nprint((t1\
  \ + t2)[3])\nprint((t1 + t2)[2:5])\n```\n\n第二个赋值语句将名称 `t2` 绑定到包含 `t1` 和浮点数 `25`\
  \ 的元组。这是可能的，因为元组像 Python 中的其他一切一样都是对象，所以元组可以包含元组。因此，第一个 print 语句产生输出：\n\n```\n((1,\
  \ 'two', 3), (4, 5))\n```\n\n第二个 print 语句打印通过拼接 `t1` 和 `t2` 产生的值，该元组包含五个元素。\n\n\
  `for` 语句可以遍历元组的元素：\n\n```python\ndef intersect(t1, t2):\n    \"\"\"假设 t1 和 t2 是元组\n\
  \    返回包含在 t1 和 t2 中的元素的元组\"\"\"\n    result = ()\n    for e in t1:\n        if\
  \ e in t2:\n            result += (e,)\n    return result\n```\n\n### 5.1.1 序列与多赋值\n\
  \n如果你知道序列的长度（例如元组或字符串），使用 Python 的多赋值语句来提取元素是非常方便的。例如，在执行 `x, y = (3, 4)` 后，`x`\
  \ 将绑定到 3，`y` 将绑定到 4。同样，语句 `a, b, c = 'xyz'` 将 `a` 绑定到 `'x'`，`b` 绑定到 `'y'`，`c` 绑定到\
  \ `'z'`。\n\n这种机制在与返回固定大小序列的函数结合使用时特别方便。考虑函数：\n\n```python\ndef findExtremeDivisors(n1,\
  \ n2):\n    \"\"\"假设 n1 和 n2 是正整数\n    返回包含大于 1 的最小因子和 n1、n2 的最大因子的元组。\n    如果没有公因子，返回\
  \ (None, None)\"\"\"\n    minVal, maxVal = None, None\n    for i in range(2, n2\
  \ + 1):\n        if n1%i == 0 and n2%i == 0:\n            if minVal == None:\n \
  \               minVal = i\n            maxVal = i\n    return (minVal, maxVal)\n\
  ```\n\n多赋值语句 `divisor, maxDivisor = findExtremeDivisors(100, 200)` 将 `divisor` 绑定到\
  \ 2，将 `maxDivisor` 绑定到 100。\n\n## 5.2 范围 (Ranges)\n\n与字符串和元组一样，range 是不可变的。`range`\
  \ 函数返回一个 `range` 类型的对象。如第 3.2 节所述，`range` 函数接受三个整数参数：`start`、`stop` 和 `step`，并返回整数序列\
  \ `start`、`start + step`、`start + 2*step` 等。如果 `step` 为正，最后一个元素是小于 `stop` 的最大整数\
  \ `start + i*step`。如果 `step` 为负，最后一个元素是大于 `stop` 的最小整数 `start + i*step`。如果只提供两个参数，则使用步长\
  \ 1。如果只提供一个参数，该参数为 `stop`，`start` 默认为 0，`step` 默认为 1。\n\n元组的所有操作也适用于范围，除了拼接和重复。例如，`range(10)[2:6][2]`\
  \ 等于 4。当使用 `==` 运算符比较 `range` 类型的对象时，如果两个范围表示相同的整数序列，则返回 `True`。例如，`range(0, 7,\
  \ 2) == range(0, 8, 2)` 结果为 `True`。然而，`range(0, 7, 2) == range(6, -1, -2)` 结果为 `False`，尽管这两个范围包含相同的整数，但它们的顺序不同。\n\
  \n## 5.3 列表与可变性\n\n与字符串和元组一样，列表是**可变的**。与元组类似，`list` 是有序元素序列，每个元素可以通过索引标识。类型 `list`\
  \ 的字面量写法与元组相似，区别是我们使用方括号。空列表写为 `[]`，单元素列表不需要漏掉右括号前的逗号。例如，下面的代码输出：\n\n```python\n\
  L = ['I did all', 4, 'love']\nfor i in range(len(L)):\n    print(L[i])\n```\n\n\n\
  \n\n```python\nprint('Univs =', Univs)\nprint('Univs1 =', Univs1)\nprint(Univs ==\
  \ Univs1)\n```\n产生输出\n\n```\nUnivs = [['MIT', 'Caltech'], ['Harvard', 'Yale', 'Brown']]\n\
  Univs1 = [['MIT', 'Caltech'], ['Harvard', 'Yale', 'Brown']]\nTrue\n```\n\n看起来 `Univs`\
  \ 和 `Univs1` 似乎绑定到了同一个值。但表象具有欺骗性。正如图 5.2 所示，`Univs` 和 `Univs1` 绑定的是完全不同的值。\n\n![art](img/Art_P24.jpg)\n\
  \n**图 5.2 两个看起来具有相同值但实际上并不相同的列表**\n\n`Univs` 和 `Univs1` 绑定到不同的对象这一点可以使用 Python 内置函数\
  \ `id` 来进行验证，该函数为对象返回一个唯一的整数标识符。此函数允许我们测试**对象相等性**。当我们运行代码时：\n\n```python\nprint(Univs\
  \ == Univs1) #测试值相等性\nprint(id(Univs) == id(Univs1)) #测试对象相等性\nprint('Id of Univs\
  \ =', id(Univs))\nprint('Id of Univs1 =', id(Univs1))\n```\n\n它打印出\n\n```\nTrue\n\
  False\nId of Univs = 4447805768\nId of Univs1 = 4456134408\n```\n\n（不要期望在运行此代码时看到相同的唯一标识符。Python\
  \ 的语义并没有说明每个对象关联了什么种标识符；它仅仅要求没有两个对象具有相同的标识符。）\n\n注意，在图 5.2 中，`Univs` 的元素并不是 `Techs`\
  \ 和 `Ivys` 绑定列表的副本，而是列表本身。`Univs1` 的元素是包含与 `Univs` 中列表相同元素的列表，但它们并不是同一个列表。我们可以通过运行代码来看到这一点：\n\
  \n```python\nprint('Ids of Univs[0] and Univs[1]', id(Univs[0]), id(Univs[1]))\n\
  print('Ids of Univs1[0] and Univs1[1]', id(Univs1[0]), id(Univs1[1]))\n```\n\n它打印出\n\
  \n```\nIds of Univs[0] and Univs[1] 4447807688 4456134664\nIds of Univs1[0] and\
  \ Univs1[1] 4447805768 4447806728\n```\n\n为什么这很重要？这很重要是因为列表是可变的。考虑这段代码：\n\n```python\n\
  Techs.append('RPI')\n```\n\n`append` 方法具有**副作用**。它不是创建一个新列表，而是通过向现有列表 `Techs` 的末尾添加新元素字符串\
  \ `'RPI'`）来修改该列表。图 5.3 描述了执行 `append` 后的计算状态。\n\n![art](img/Art_P25.jpg)\n\n**图\
  \ 5.3 可变性演示**\n\n`Univs` 绑定的对象仍然包含那两个列表，但其中一个列表的内容已经改变。因此，打印语句\n\n```python\nprint('Univs\
  \ =', Univs)\nprint('Univs1 =', Univs1)\n```\n\n现在产生了输出\n\n```\nUnivs = [['MIT',\
  \ 'Caltech', 'RPI'], ['Harvard', 'Yale', 'Brown']]\nUnivs1 = [['MIT', 'Caltech'],\
  \ ['Harvard', 'Yale', 'Brown']]\n```\n\n我们在这里遇到的是被称为**别名**（aliasing）的情况。通往同一个列表对象有两个不同的路径。一条路径通过变量\
  \ `Techs`，另一条路径通过 `Univs` 绑定的列表对象的第一个元素。可以通过任何一条路径修改对象，且修改的影响在两条路径上都是可见的。这可能很方便，但也可能是极其危险的。无意的别名会导致往往极难追踪的编程错误。\n\
  \n与元组一样，`for` 语句可以用于遍历列表的元素。例如：\n\n```python\nfor e in Univs:\n    print('Univs\
  \ contains', e)\n    print(' which contains')\n    for u in e:\n        print('\
  \ ', u)\n```\n\n将打印\n\n```\nUnivs contains ['MIT', 'Caltech', 'RPI']\nwhich contains\n\
  MIT\nCaltech\nRPI\nUnivs contains ['Harvard', 'Yale', 'Brown']\nwhich contains\n\
  Harvard\nYale\nBrown\n```\n\n当我们将一个列表添加到另一个列表时，例如 `Techs.append(Ivys)`，原始结构会被保持。即，结果是一个包含列表的列表。假设我们不想维持这种结构，而是想将一个列表的元素添加到另一个列表中。我们可以通过列表拼接或\
  \ `extend` 方法来实现这一点，例如：\n\n```python\nL1 = [1,2,3]\nL2 = [4,5,6]\nL3 = L1 + L2\n\
  print('L3 =', L3)\nL1.extend(L2)\nprint('L1 =', L1)\nL1.append(L2)\nprint('L1 =',\
  \ L1)\n```\n\n将打印\n\n```\nL3 = [1, 2, 3, 4, 5, 6]\nL1 = [1, 2, 3, 4, 5, 6]\nL1 =\
  \ [1, 2, 3, 4, 5, 6, [4, 5, 6]]\n```\n\n注意运算符 `+` 没有副作用。它创建一个新列表并将其返回。相比之下，`extend`\
  \ 和 `append` 分别修改了 `L1`。\n\n图 5.4 包含了与列表相关的一些方法的简短描述。注意，除了 `count` 和 `index`，所有这些方法都会修改列表。\n\
  \n![art](img/Art_P26.jpg)\n\n**图 5.4 与列表相关的方法**\n\n### 5.3.1 克隆 (#toc.xhtml_Rh2-12)\n\
  \n在遍历列表时避免修改通常是审慎的。例如，考虑以下代码：\n\n```python\ndef removeDups(L1, L2):\n    \"\"\"\
  假设 L1 和 L2 是列表。\n    从 L1 中移除所有出现在 L2 中的元素。\"\"\"\n    for e1 in L1:\n        if\
  \ e1 in L2:\n            L1.remove(e1)\n```\n\n\n\n\n在 Python 中，函数是**一等对象**。这意味着它们可以像其他任何类型的对象一样被处理，例如\
  \ `int` 或 `list`。它们有类型，例如表达式 `type(abs)` 的值为 `<type 'built-in_function_or_method'>`；它们可以出现在表达式中，例如作为赋值语句的右侧，或作为函数的参数；它们可以作为列表的元素；等等。\n\
  \n### 高阶编程\n\n将函数作为参数可以使用被称为**高阶编程**的编码风格。在与列表结合使用时，这特别方便，如图 5.5 所示。\n\n![art](img/Art_P27.jpg)\n\
  \n**图 5.5 将函数应用于列表元素**\n\n`applyToEach` 函数被称为**高阶**函数，是因为它的其中一个参数本身是一个函数。当第一次调用它时，它通过将一元内置函数\
  \ `abs` 应用于每个元素来改变 `L`。第二次调用它时，它对每个元素进行类型转换。第三次调用它时，它通过将应用函数 `factR`（定义在图 4.5 中）的结果替换每个元素。第四次调用它时，它通过应用函数\
  \ `fib`（定义在图 4.7 中）的结果替换每个元素。它输出：\n\n```\nL = [1, -2, 3.33]\nApply abs to each element\
  \ of L.\nL = [1, 2, 3.33]\nApply int to each element of [1, 2, 3.33]\nL = [1, 2,\
  \ 3]\nApply factorial to each element of [1, 2, 3]\nL = [1, 2, 6]\nApply Fibonnaci\
  \ to each element of [1, 2, 6]\nL = [1, 2, 13]\n```\n\nPython 有一个内置的高阶函数 `map`，它与图\
  \ 5.5 中定义的 `applyToEach` 函数相似，但比它更通用。它设计用于与 `for` 循环结合使用。在最简单的形式，`map` 的第一个参数是一个一元函数（即只有一个参数的函数），第二个参数是任何适合作为第一个参数参数的有序值集合。\n\
  \n在 `for` 循环中使用时，`map` 的行为类似于 `range` 函数，因为它会为循环的每次迭代返回一个值。^(⁶⁹) 这些值是通过将第一个参数应用于第二个参数的每个元素而生成的。例如，以下代码：\n\
  \n```python\nfor i in map(fib, [2, 6, 4]):\n    print(i)\n```\n\n输出：\n```\n2\n13\n\
  5\n```\n\n更通地说，`map` 的第一个参数可以是一个具有 `n` 个参数的函数，在这种情况下，后面必须跟随 `n` 个后续的有序集合（长度相同）。例如，以下代码：\n\
  \n```python\nL1 = [1, 28, 36]\nL2 = [2, 57, 9]\nfor i in map(min, L1, L2):\n   \
  \ print(i)\n```\n\n输出：\n```\n1\n28\n9\n```\n\nPython 支持使用关键字 `lambda` 创建匿名函数（即未绑定到名称的函数）。**lambda\
  \ 表达式**的通用形式为：\n\n```\nlambda <sequence of variable names>: <expression>\n```\n\n\
  例如，lambda 表达式 `lambda x, y: x*y` 返回一个返回其两个参数乘积的函数。Lambda 表达式经常被用作高阶函数的参数。例如，以下代码：\n\
  \n```python\nL = []\nfor i in map(lambda x, y: x**y, [1 ,2 ,3, 4], [3, 2, 1, 0]):\n\
  \    L.append(i)\nprint(L)\n```\n\n输出 `[1, 4, 3, 1]`。\n\n## 5.5 字符串、元组、范围和列表\n\n\
  我们查看了四种序列类型：`str`、`tuple`、`range` 和 `list`。它们的相似之处在于，这些类型的对象可以像图 5.6 所示那样进行操作。它们的一些其他相似和不同之处总结在图\
  \ 5.7 中。\n\n![art](img/Art_P28.jpg)\n\n**图 5.6 序列类型的常用操作**\n\n![art](img/Art_P29.jpg)\n\
  \n**图 5.7 序列类型的比较**\n\nPython 程序员倾向于使用列表的频率远高于元组。由于列表是可变的，它们可以在计算过程中增量地构建。例如，以下代码增量地构建了一个包含另一个列表中所有偶数的列表。\n\
  \n```python\nevenElems = []\nfor e in L:\n    if e%2 == 0:\n        evenElems.append(e)\n\
  ```\n\n元组的一个优势是由于它们是不可变的，所以永远不需要担心别名问题。另一个优势是由于其不可变，元组与列表不同可以作为字典的键，我们将在下一节中看到。\n\
  \n由于字符串只能包含字符，因此它们比元组或列表灵活得多。另一方面，当你处理字符字符串时，有很多内置方法可以让生活变得简单。图 5.8 包含了其中一些方法的简短描述。最有用的内置方法之一是\
  \ `split`，它接受两个字符串作为参数。请记住字符串是不可变的，这些返回值没有副作用。第二个参数是可选的。如果省略了该参数，则将使用任意的**空白字符**（空格、制表符、换行、返回和分页符）分割字符串。\n\
  \n![art](img/Art_P30.jpg)\n\n**图 5.8 字符串的一些方法**\n\n## 5.6 字典\n\n`dict` 类型（字典的缩写）的对象与列表相似，不同在于我们使用键来对其进行索引。将字典视为一组键值对。dict\
  \ 类型的字面量括在大括号中，每个元素写为一个键，后跟一个值。例如，以下代码：\n\n```python\nmonthNumbers = {'Jan':1, 'Feb':2,\
  \ 'Mar':3, 'Apr':4, 'May':5}\nprint('The third month is ' + monthNumbers[3])\ndist\
  \ = monthNumbers['Apr'] - monthNumbers['Jan']\nprint('Apr and Jan are', dist, 'months\
  \ apart')\n```\n\n将输出\n```\nThe third month is Mar\nApr and Jan are 3 months apart\n\
  ```\n\n字典中的项是无序的，不能通过索引访问。这就是为什么 `monthNumbers[1]` 指的是键为 1 的项，而不是第二个项。像列表一样，字典是可变的。我们可以通过编写以下代码添加条目：\n\
  \n```python\nmonthNumbers['June'] = 6\n```\n\n或者通过以下代码更改条目：\n\n```python\nmonthNumbers['May']\
  \ = 'V'\n```\n\n字典是 Python 的伟大特性之一。它们极大地降低了编写各种程序的难度。例如，在图 5.9 中，我们使用字典编写了一个（相当糟糕的）程序来进行语言之间的翻译。由于其中一行代码太长无法放在页面上，我们使用了反斜杠\
  \ `\\` 来表示下一行文本是上一行的延续。\n\n图中代码输出：\n\n```\nJe bois \"good\" rouge vin, et mange\
  \ pain.\nI drink of wine red.\n```\n\n记住字典是可变的。因此必须小心副作用。例如：\n\n```python\nFtoE['bois']\
  \ = 'wood'\nprint(translate('Je bois du vin rouge.', dicts, 'French to English'))\n\
  ```\n\n输出\n```\nI wood of wine red\n```\n\n### 实现字典类结构\n\n大多数编程语言不包含提供键到值映射的内置类型。相反，程序员使用其他类型来提供类似的功能。例如，相对容易使用一个每个元素都是键值对的列表来实现字典。然后我们可以可以写一个简单的函数来进行关联检索，例如：\n\
  \n```python\ndef keySearch(L, k):\n    for elem in L:\n        if elem[0] == k:\n\
  \            return elem[1]\n    return None\n```\n\n\n\n\n这种实现方式的问题在于它的计算效率很低。在坏的情况下，程序可能需要检查列表中的每个元素才能完成单次检索。相比之下，内置的实现非常快。它使用了一种名为哈希（hashing）的技术（在第\
  \ 10 章\n\n**图 5.9 翻译文本（糟糕地）**\n\n可以使用 `for`语句来遍历字典中的条目。然而，赋值给迭代变量的值是一个键（key），而不是键/值对。在迭代中看到键的顺序是未定义的。例如，以下代码：\n\
  \n```python\nmonthNumbers = {'Jan':1, 'Feb':2, 'Mar':3, 'Apr':4, 'May':5,\n1:'Jan',\
  \ 2:'Feb', 3:'Mar', 4:'Apr', 5:'May'}\n\nkeys = []\n\nfor e in monthNumbers:\n \
  \   keys.append(str(e))\n\nprint(keys)\nkeys.sort()\nprint(keys)\n```\n\n可能会输出\n\
  \n['Jan', 'Mar', '2', '3', '4', '5', '1', 'Feb', 'May', 'Apr']\n\n['1', '2', '3',\
  \ '4', '5', 'Apr', 'Feb', 'Jan', 'Mar', 'May']\n\n`keys()`方法返回一个类型为`dict_keys`的对象^(⁷⁰)这是一个**视图对象**（view\
  \ object）的示例。键在视图中出现的顺序是未定义的。视图对象是动态的，因为如果关联的对象发生了变化，这种变化将通过视图对象可见。例如，\n\n```python\n\
  birthStones = {'Jan':'Garnet', 'Feb':'Amethyst', 'Mar':'Acquamarine',\n'Apr':'Diamond',\
  \ 'May':'Emerald'}\n\nmonths = birthStones.keys()\nprint(months)\n\nbirthStones['June']\
  \ = 'Pearl'\nprint(months)\n```\n\n可能会输出\n\ndict_keys(['Jan', 'Feb', 'May', 'Apr',\
  \ 'Mar'])\ndict_keys(['Jan', 'Mar', 'June', 'Feb', 'May', 'Apr'])\n\n`dict_keys`类型的对象可以使用`for`进行迭代，并可以使用`in`进行成员性测试。`dict_keys`类型的对象可以很容易转换为列表，例如\
  \ `list(months)`。\n\n并不是所有类型的对象都可以作为键：键必须是**可哈希类型**（hashable type）的对象。如果一个类型是可哈希的，只要它具有：\n\
  \n*   一个`__hash__`方法，将该类型的对象映射到一个整数，并且对于每个对象，在其生命周期内`__hash__`返回的值不会改变；\n*   一个`__eq__`方法，用于比较对象是否相等。\n\
  \nPython 的所有不可变类型都是可哈希的，可变类型不是。通常使用元组（tuple）作为键是方便的。想象一下，使用像`(date, time)`这样的元组。在大多数的情况下，这种方法是可行的。\n\
  \n正如字典一样，许多已知的方法可以处理这些问题。在某些情况下，我们可能使用元组来解决这些问题。然而，这种方法并不总是最高效的。\n\n\n\n\n对于大多数程序而言，找到输入的一种良好划分说起来容易做得多。通常，人们依赖于启发式方法，通过探索代码和规范之间某些组合的不同路径来实现。基于探索代码路径的启发式方法归类为`白盒测试`。基于探索规范路径的启发式方法则归类为`黑盒测试`。\n\
  \n### 6.1.1 黑盒测试\n\n从原理上讲，黑盒测试是在不查看测试代码的情况下构建的。黑盒测试允许测试人员和实现人员来自不同的群体。当我们这些教授编程课程的人为分配给学生的问题作业集生成测试用例时，我们正在开发黑盒测试套件。商业软件的开发人员通常拥有很大独立于开发小组的质量保证小组。\n\
  \n这种独立性减少了生成与代码错误相关联错误的测试套件的概率。例如，假设程序的作者做了一个隐含但无效的假设，即某个函数永远不会被传入负数调用。如果同一个人为程序构建测试套件，他很可能会重复这个错误，而不使用负参数对该函数进行测试。\n\
  \n黑盒测试的另一个优点是它对实现的变化具有鲁棒性。由于测试数据是在不知道实现的情况下生成的，因此当实现发生变化时，测试是不需要更改的。\n\n正如我们之前说的，生成黑盒测试数据的良好方法是探索规范的路径。考虑以下规范：\n\
  \n```python\ndef sqrt(x, epsilon):\n    \"\"\"假设 x, epsilon 为浮点数\n    x >= 0\n \
  \   epsilon > 0\n    返回结果使得\n    x-epsilon <= result*result <= x+epsilon\"\"\"\n\
  ```\n\n该规范似乎只有两条不同的路径：一个对应于 `x = 0`，另一个对应于 `x > 0`。然而，常识告诉我们，虽然测试这两个情况是必要的，但这远远不够。\n\
  \n边界条件也应该被测试。在查看列表时，这通常意味着查看空列表、恰好有一个元素的列表以及包含列表的列表。在处理数字时，通常意味着查看极小值、极大值以及“典型”值。对于\
  \ `sqrt`，例如，尝试与图 6.1 中类似的 `x` 和 `epsilon` 值可能是合理的。\n\n前四行代表典型情况。注意 `x` 的值包含一个完全平方数、一个小于\
  \ 1 的数和一个具有无理平方根的数。如果这些测试中任何一个失败，程序中就需要修复 bug。\n\n![art](img/Art_P33.jpg)\n\n**图\
  \ 6.1 测试边界条件**\n\n其余行测试了 `x` 和 `epsilon` 的极大和极值。如果这些测试中任何一个失败，就需要进行修复。也许代码中有一个需要修复的\
  \ bug，或者规范需要更改以便更容易满足。例如，当 `epsilon` 极其微小时，期望找到平方根的近似值可能是不合理的。\n\n另一个需要考虑的重要边界条件是别名。例如，考虑以下代码：\n\
  \n```python\ndef copy(L1, L2):\n    \"\"\"假设 L1, L2 是列表\n    将 L2 变更为 L1 的拷贝\"\"\
  \"\n    while len(L2) > 0: #移除 L2 中的所有元素\n        L2.pop() #移除 L2 的最后一个元素\n    for\
  \ e in L1: #将 L1 的元素追加到初始为空的 L2\n        L2.append(e)\n```\n\n它在大多数情况下都能工作，但当 `L1`\
  \ 和 `L2` 指向同一个列表时就不行。任何不包含形式为 `copy(L, L)` 用的测试套件都无法揭示这个 bug。\n\n### 6.1.2 白盒测试\n\
  \n黑盒测试永远不应该跳过，但它很少是充分。在不查看代码内部结构的情况下，无法知道哪些测试用例可能提供新信息。考虑这个平凡的例子：\n\n```python\n\
  def isPrime(x):\n    \"\"\"假设 x 是非负整数\n    如果 x 是质数则返回 True；否则返回 False\"\"\"\n \
  \   if x <= 2:\n        return False\n    for i in range(2, x):\n        if x%i\
  \ == 0:\n            return False\n    return True\n```\n\n查看代码，我们可以看到由于存在 `if x\
  \ <= 2` 这一测试，值 `0`、`1` 和 `2` 被视为特殊情况，因此需要测试。如果不看代码，人们可能不会测试 `isPrime(2)`，从而无法发现函数调用\
  \ `isPrime(2)` 返回 `False`，错误地指示 `2` 不是质数。\n\n白盒测试套件通常比黑盒测试套件更容易构建。规范通常是不完全且往往很粗糙，这使得估计黑盒测试套件在多大程度上探索了有趣的输入空间是一项挑战。相比之下，代码路径的概念定义良好，且相对容易评估对空间探索的彻底程度。事实上，有一些商业工具可以客观地衡量白盒测试的完整性。\n\
  \n如果一个白盒测试套件执行了程序中的每条潜在路径，它就是“路径完备的”（path-complete）。这通常是不可能的，因为它取决于每个循环执行的次数以及每个递归的深度。例如，`factorial`\
  \ 的递归实现对于每个可能的输入遵循不同的路径（因为递归层数会不同）。\n\n此外，即使是路径完备的套件也不能保证所有的 bug 都会暴露。考虑：\n\n```python\n\
  def abs(x):\n    \"\"\"假设 x 是整数\n    如果 x>=0 则返回 x，否则返回 -x\"\"\"\n    if x < -1:\n\
  \        return -x\n    else:\n        return x\n```\n\n规范建议有两种可能的情况：`x` 为负或不是。这表明输入集\
  \ `{2, -2}` 是足够的。这个测试套件还有一个额外的优点，即强制程序通过其所有路径，因此看起来也像一个完备的白盒套件。唯一的问题是这个测试套件不会暴露\
  \ abs(-1) 将返回 -1 的事实。\n\n尽管白盒测试有局限性，但有一些值得遵循的准则：\n\n*   执行所有 `if` 语句的分支。\n*   确保每个\
  \ `except` 子句（参见第 7 章 > 0 and not L[i] == e` 开始的循环，找到因为 `len(L)` 大于零而退出的情况以及因为 `L[i]\
  \ == e` 而退出的情况。\n*   对于递归函数，包含导致函数在没有递归调用的情况下返回、恰好有一次递归调用以及多次递归调用返回的测试用例。\n\n###\
  \ 6.1.3 进行测试\n\n测试通常被认为分为两个阶段。人们应该始终从**单元测试**开始。在这个阶段，测试人员构建并运行旨在确定单个代码单元（例如函数）是否正常工作的测试。接其后的是**集成测试**，其目的是确定整个程序是否按照预期行为。在实践中，测试人员会在这两个阶段之间循环进行，因为集成测试中的失败会导致对单个单元进行修改。\n\
  \n\n\n\n集成测试几乎比单元测试更具挑战性。其原因之一是整个程序的预期行为往往比其每个部分的预期行为要难刻画得多。例如，刻画一个文字处理器的预期行为要比刻画一个计算文档中字符数量的\
  \ `function` 的行为要困难得多。规模问题也可能使集成测试变得困难。测试花费数小时甚至几天时间运行并不罕见。\n\n许多工业软件开发组织都有一个 `software\
  \ quality assurance (SQA)` 小组，该小组与负责实现软件的小组分开。该小组的任务是确保软件在发布之前符合其用途。在某些组织中，开发组负责单元测试，而\
  \ `QA` 组负责集成测试。\n\n在工业领域，测试过程通常是高度自动化的。测试人员不会坐在终端前输入并检查输出。相反，他们使用 `test drivers`\
  \ 来自主地：\n\n*   设置调用待测试程序（或单元）所需的环境\n*   使用预定义或自动生成的输入序列调用待测试程序（或单元）\n*   保存这些调用的结果\n\
  *   检查测试结果的可接受性\n*   准备一份适当的报告\n\n在单元测试期间，我们经常需要构建 `stubs` 以及 `drivers`。`Drivers`\
  \ 模拟使用被测试单元的程序部分，而 `stubs` 则模拟被测试单元所使用的程序部分。`Stubs` 非常有用，因为它们允许人们测试依赖于尚未存在的软件甚至硬件的单元。这使得程序员团队能够同时开发和测试系统的多个部分。\n\
  \n理想情况下，一个 `stub` 应该：\n\n*   检查调用者提供的环境和参数的合理性（使用不恰的参数调用 `function` 是常见的错误）\n* \
  \  以符合规范的方式修改参数和全局变量\n*   返回与规范一致的值\n\n构建合适的 `stubs` 往往是一项挑战。如果 `stub` 替换的单元旨在执行某些复杂任务，那么构建一个执行与规范一致的动作的\
  \ `stub` 可能等同于编写该 `stub` 设计上要替换的程序。解决这一问题的方法之一是限制 `stub` 接受的参数集，并创建一个表格，包含测试套件使用的每种参数组合所要返回的值。\n\
  \n自动化测试过程的一个吸引力是它方便了 `regression testing`。当程序员尝试调试程序时，安装一个破坏了原有正常功能的“修复”是非常常见的现象。只要发生任何变化，无论多小，你都应该检查程序仍然通过了它以前通过的所有测试。\n\
  \n## 6.2 调试\n\n关于修复软件缺陷的过程如何被称为“调试（debugging）”，有一个迷人的都市传说。`Figure 6.2` 中的照片是来自哈佛大学负责\
  \ Mark II Aiken 继电器计算器的小组的实验笔记本中 1947 年 9 月 9 日的一页。\n\n![art](img/Art_P34.jpg)\n\
  \n**图 6.2 不是第一个 bug**\n\n有人声称，在 Mark II 中发现那只被困的蛾子导致了“debugging”一词的使用。然而，“首次发现 bug\
  \ 的实际案例”这种措辞表明，对该词的非字面解释已经很常见了。Mark II 项目的领导者 Grace Murray Hopper 明确表示，在世界大战期间，“bug”一词已在广泛用于描述电子系统的问题。而在那很久以前，1896\
  \ 年的一本电气手册《霍霍金斯电力新教义录》中就包含了这样一条条目：“‘bug’一词在有限范围内用于指电气设备连接或运行中的任何故障或麻烦。”在英语用法中，“bugbear”\
  \ 的意思是“任何引起看似不必要或过度恐惧或焦虑的事物”。莎士似乎将其缩短为“bug”，当哈姆莱特抱怨生活中有“虫子和鬼怪（bugs and goblins）”时。\n\
  \n“bug”一词的使用有时会让人们忽视一个基本事实：如果你写了一个程序而它有“bug”，那就是你搞砸了。bug 不会不请自地爬进完美无缺的程序中。如果你的程序有\
  \ bug，是因为你把它放了那儿。bug 不会在程序中繁殖。如果你的程序有多个 bug，是因为你犯了多个错误。运行时 bug 可以按两个维度进行分类：\n\n\
  *   **显性（Overt）→ 隐性（covert）**：`overt bug` 有明显的表现，例如程序崩溃或运行时间比预期的长得多（可能永远运行）。`covert\
  \ bug` 没有明显的表现。程序可能无问题地运行到结束——除了提供了一个错误的答案之外没有问题。许多 bug 介于这两个极端之间，bug 是否为显性取决于人们检查程序行为的细致程度。\n\
  *   **持续性（Persistent）→ 间歇性（intermittent）**：`persistent bug` 在每次使用相同输入运行程序时发生。`intermittent\
  \ bug` 仅在某些时候发生，即使在相同的输入和看似相同的条件下运行程序也是如此。当我们进入 `Chapter 14` 时，我们将开始编写模拟随机性作用的程序。在这类程序中，间歇性\
  \ bug 非常常见。\n\n最好的 bug 是显性且持续的。开发者对部署该程序的合理性不会有任何幻想。如果有其他人足够蠢到尝试使用它，他们很快就会发现自己的愚蠢。也许程序在崩溃之前会做一些可怕的事情，例如删除文件，但至少用户会有理由担心（即使不是恐慌）。优秀的程序员努力以此方式编写程序，使得编程错误导致既是显性又是持续的\
  \ bug。这通常被称为 `防御性编程（defensive programming）`。\n\n进入不理想深渊的下一步是显性但间歇性的 bug。一个几乎所有时间都能计算飞机正确位置的空中交通控制系统，比一个总是犯明显错误的系统危险得多。人们可以在愚人天堂里生活一段时间，可能甚至部署了一个包含该缺陷程序的系统，但早晚\
  \ bug 都会显现。如果导致 bug 显现的条件容易复现，那么追踪和修复问题通常相对容易。如果引发 bug 的条件不明确，生活就会变得艰难得多。\n\n\n\n\
  以隐蔽方式失败的程序通常非常危险。由于它们表面上没有问题，人们会使用它们并信任它们会完成正确的工作。社会日益依赖软件来执行关键计算，而这些计算已经超出了人类执行甚至检查其正确性的能力。因此，一个程序可能会在很长范围内提供未被发现的错误答案。这类程序能够并且已经造成了巨大的损害.^一个评估抵押贷款投资组合风险并自信地给出错误答案的程序可能会让银行（可能让整个社会）陷入巨大的麻烦。一台输送辐射略多或少于预期水平的放射治疗设备，对于癌症患者来说可能是生与死的区别。一个偶尔产生隐蔽错误的程序，其造成的破坏力可能并不比一个总是犯此类错误的程序要小。既隐蔽又间歇的\
  \ Bug 几乎是最难发现和修复的。\n\n### 6.2.1 学习调试\n\n调试是一项需要学习的技能。没有人天生就能做得很好。好消息是它并不难学习，而且是一项可以迁移的技能。用于调试软件的技能可以用于发现其他复杂系统的问题，例如实验室实验或生病人。\n\
  \n至少四十年来，人们一直在构建名为调试器的工具，而且所有流行的 Python IDE 中都内置了调试工具。这些工具本应帮助人们发现程序中的 Bug。它们确实有所帮助，但作用有限。更重要的是你处理问题的方法。许多经验丰富的程序员甚至不懒于使用调试工具。大多数程序员认为，最重要的调试工具是\
  \ `print` 语句。\n\n调试从测试证明程序表现出不符合预期的方式时开始。调试是为这种行为寻找解释的过程。始终擅长调试的关键在于在进行该搜索时保持系统性。\n\
  \n从研究可用数据开始。这包括测试结果和程序文本。研究所有的测试结果。不仅要检查揭示问题存在的测试，还要检查那些看起来运行完全完美的测试。尝试理解为什么一个测试成功了而另一个没有，这往往会带来启发。在查看程序文本时，请记住你并没有完全理解它。如果你完全理解了，那里可能就不会有\
  \ Bug。\n\n接下来，形成一个你认为与所有数据都一致的假设。这个假设可以缩小到“如果我将第 403 行从 `x < y` 改为 `x <= y`，问题就会消失”，也可以宽泛到“我的程序没有终止是因为我在某些\
  \ `while loop` 中使用了错误的退出条件”。\n\n接下来，设计并运行一个可重复的实验以以反驳该假设。例如，你可以在每个 `while loop`\
  \ 之前之后放置一个 `print` 语句。如果这些语句总是成对出现，那么 `while loop` 导致不终止的假设就被反驳了。在运行实验之前，决定好你将如何解释各种可能的结果。如果你等到运行实验后才考虑，你可能会陷入主观意愿想法的陷阱。\n\
  \n最后，记录你尝试过的实验是非常关重要的。当你花费了几个小时修改代码试图追踪一个变幻无定的 Bug 时，你很容易忘记你已经尝试过什么。如果你不小心，很容易浪费大量时间反复尝试同一个实验（或者更有可能是一个看起来不同但会给你相同信息的实验）。记住，正如许多人所说，“疯狂就是一遍又一遍地做同样的事情，却期待不同的结果。”^\n\
  \n### 6.2.2 设计实验\n\n将调试看作一个搜索过程，将每个实验看作是缩小搜索空间大小的尝试。减少搜索空间的一种的方法是设计一个实验，用以判断代码的特定区域是否对集成测试中发现的问题负责。减少搜索空间的另一种方法是减少触发\
  \ Bug 表现所需的测试数据量。\n\n让我们来看一个人为构造的例子，看看人们如何对其进行调试。假设你在 [图 6.3] 中编写了检查回文的代码。\n\n![art](img/Art_P35.jpg)\n\
  \n**图 6.3 带有 Bug 的程序**\n\n现在，假设你对自己的编程技能如此自信，以至于在没有测试的情况下将此代码放在网上。进一步假设，你收到一封邮件，说：“我在以下\
  \ 1000 个字符串的输入上测试了你的 !!! 程序，它输出了 Yes。然而，任何傻瓜都能看出它不是回文。修复它！”\n\n你可以尝试在提供的 1000 个字符串的输入上对其进行测试。但从在较小规模上进行尝试可能更明智。事实上，在最小的非回文字符串上对其进行测试是有意义的，例如：\n\
  \n```\n>>> silly(2)\nEnter element: a\nEnter element: b\n```\n\n好消息是它连这个简单的测试都失败了，所以你不需要输入数千字符串。坏消息是你完全不知道它为什么失败了。\n\
  \n在这种情况下，代码足够小，你可能可以盯着它找到 Bug（或多个 Bug）。然而，让我们假装它大到无法做到这一点，并开始系统地缩小搜索空间。\n\n通常，最好的方法是进行二分查找（bisection\
  \ search）。找到代码中间部分的某个点，并设计一个实验，让你判断在该点之前的问题是否与症状有关。（当然，该点之后可能还有问题，但最好是一次只追踪一个问题。）在选择这样的点时，寻找一个容易检查且提供有用信息的中间值位置。如果中间值不符合预期，那么在该点之前可能发生了问题。如果中间值看起来都正常，Bug\
  \ 可能在代码的后部分。这个过程可以重复，直到将问题所在的区域缩小到几行代码。\n\n查看 `silly`，中间点在 `isPal(result)` 行附近。要检查的是\
  \ `result` 是否具有预期的 ['a', 'b']。我们通过在 `silly` 的 `if` 语句之前插入 `print(result)` 语句来检查。运行实验时，程序输出了\
  \ ['b']，说明已经出问题了。下一步是在循环中间打印 result。这很快揭示了 `result` 长度从未超过一个元素，说明 `result` 的初始化需要移动到\
  \ `for loop` 之外。\n\n“修复”后的 `silly` 代码如下：\n\n```python\ndef silly(n):\n    \"\"\"\
  假设 n 是大于 0 的整数\n    从用户处获取 n 个输入\n    如果输入序列形成回文则打印 'Yes'；\n    否则打印 'No'\"\"\"\n\
  \    result = []\n    for i in range(n):\n        elem = input('Enter element: ')\n\
  \        result.append(elem)\n    print(result)\n    if isPal(result):\n       \
  \ print('Yes')\n    else:\n        print('No')\n```\n\n让我们尝试，看看 `for loop` 之后 `result`\
  \ 是否具有正确的值。它是，但遗憾程序仍然输出了 Yes。现在，我们有理由相信第二个 Bug 位于 `print` 语句下方。所以，让我们查看 `isPal`。`if\
  \ temp == x:` 这行代码大约位于函数的中间。因此，我们插入行：\n\n```python\nprint(temp, x)\n```\n\n\n\n\
  在该行之前。当我们运行代码时，我们发现 `temp` 具有预期的值，但 `x` 则没有。向上移动代码，我们在 `temp = x` 这行代码之后插入了一个打印语句，发现\
  \ `temp` 和 `x` 的值都是 `['a', 'b']`。快速检查代码后发现，在 `isPal` 中我们写的是 `temp.reverse` 而不是 `temp.reverse()`——对\
  \ `temp.reverse` 的求值返回了列表内置的反转方法，但并没有调用它。\n\n我们再次运行测试，现在 `temp` 和 `x` 的值似乎都是 `['b','a']`。我们现在将错误范围缩小到一行。似乎\
  \ `temp.reverse()` 意外地改变了 `x` 的值。我们掉入了“别名错误”（aliasing bug）的陷阱：`temp` 和 `x` 是同一个列表的名字，无论在列表反转之前还是之后都是。修复它的方法是将\
  \ `isPal` 中的第一个赋值语句替换为 `temp = x[:]`，这会创建一个 `x` 的副本。\n\n修正后的 `isPal` 版本如下：\n\n```python\n\
  def isPal(x):\n    \"\"\"假设 x 是一个列表\n    如果列表是回文则返回 True；否则返回 False\"\"\"\n    temp\
  \ = x[:]\n    temp.reverse()\n    if temp == x:\n        return True\n    else:\n\
  \        return False\n```\n\n## 6.2.3 当陷入困难时\n\n美国总统约翰·F·肯尼迪的父亲约瑟夫·P·肯尼迪据报道曾教导他的孩子们：“当困难来临时，汉子就会行动。”但他从未调试过任何软件。本小节包含了关于在调试遇到困难时该如何做的实用建议。\n\
  \n*   **寻找常见的嫌疑犯**。例如，你是否：\n    *   以错误的顺序向函数传递了参数，\n    *   拼写错了名称，例如，在应该输入大写字母时输入了小写字母，\n\
  \    *   未能重新初始化变量，\n    *   测试两个浮点数是否相等（`==`）而不是几乎相等（记住浮点数算术与你在学校学到的算术不同），\n  \
  \  *   在想要比较对象相等时（例如，通过编写表达式 `L1 == L2` 比较两个列表）测试了值的相等性（例如，`id(L1) == id(L2)`），\n\
  \    *   忘记了某些内置函数具有副作用，\n    *   忘记了用 `()` 将类型为函数的对象的引用转变为函数调用，\n    *   创建了无意的别名，或者\n\
  \    *   犯了任何其他你典型的错误。\n*   **停止问自己程序程序为什么不按照你的意愿运行。相反，问自己程序为什么是这样运行的。** 这应该是一个更容易回答的问题，并且可能是找出如何修复程序的良好第一步。\n\
  *   **记住，错误可能不在你认为的地方。** 如果它在那里，你可能早就发现它了。决定从哪里开始查看的一种实用方法是询问错误*不可能*出现在哪里。正如夏尔洛·霍尔姆斯所说：“排除所有其他因素，剩下的必是真相。”\n\
  *   **尝试向别人解释问题。** 我们所有人都有盲点。通常情况下，仅仅尝试向某人解释问题就会让你发现你错过的东西。可以尝试解释的一个很好的点是：为什么错误不可能出现在某些地方。\n\
  *   **不要相信你读到的所有内容。** 特别是，不要相信文档。代码的行为可能并不如注释建议的那样。\n*   **停止调试并开始编写文档。** 这将帮助你从不同的角度思考问题。\n\
  *   **离开，明天再试。** 这可能意味着修复错误的时间会比你死磕它要晚得多，但你可能会花费少得的时间去寻找它。也就是说，用延迟换取效率是可能的。（学生们，这是更早而不是更晚开始做编程题集的绝佳理由！）\n\
  \n## 6.2.4 当你找到了“那个”错误\n\n当你认为在代码中发现了一个错误时，开始编写代码并测试修复方案的诱惑几乎是不可抵挡的。然而，最好是稍微慢一点。记住，目标不是修复一个错误，而是快速、高效地朝着无错误的程序迈进。\n\
  \n问问自己这个错误是否解释了所有观察到的症状，还是它只是冰山一角。如果是后者，可能考虑与其他更改一起处理这个错误更好。例如，假设你发现错误是由于意外修改了列表导致的。你可以在局部规避这个问题，也许通过通过创建列表的副本。或者，你可以考虑使用元组而不是列表（因为元组是不可变的），这可能消除代码中其他地方的类似错误。\n\
  \n在进行任何更改之前，尝试理解所提“修复方案”的影响。它会破坏其他东西吗？它会引入过度的复杂性吗？它是否提供了清理代码其他部分的机会？\n\n始终确保你可以回到所在的地方。没有比这更沮丧的事了：发现经过长系列更改后，你比开始时离目标更远，而且没有办法回到起点。磁盘空间通常是充足的。利用它来存储你程序的旧版本。\n\
  \n最后，如果有很多未解释的错误，你可能需要考虑逐个寻找并修复它们是否是正确的方法。也许你思考是否有更好的组织程序的方法或更简单的算法会更好。\n\n# 7 异常与断言\n\
  \n“异常”通常定义为“不符合常规的事物”，因此相当罕见。在 Python 中，**异常**并不罕见。它们无处不在。Python 标准库中的几乎每个模块都使用它们，Python\
  \ 本身也会在许多情况下抛出它们。你已经见过了一些。\n\n打开 Python 解释器并输入\n\n```python\ntest = [1,2,3]\ntest[3]\n\
  ```\n\n解释器会返回类似的内容：\n\nIndexError: list index out of range\n\nIndexError 是 Python\
  \ 在程序尝试访问索引类型范围之外元素时抛出的异常类型。IndexError 之后的字符串提供了关于导致异常的额外信息。\n\n\n\n\n\n`Python`\
  \ 的大多数内置异常都是处理程序尝试执行没有适当语义的语句的情况。（我们将在本章的稍后部分讨论特殊异常——即那些不处理错误的异常。）那些（我们希望你们所有人都是）尝试过编写和运行\
  \ `Python` 程序的读者，可能已经遇到过其中的许多异常了。最常见的异常类型包括 `TypeError`、`IndexError`、`NameError`\
  \ 和 `ValueError`。\n\n## 7.1 处理异常\n\n到目前为止，我们一直把异常视为致命事件。当抛出异常时，程序会终止（在这种情况下，用“崩溃”可能更贴切），我们回到代码中尝试找出哪里出了问题。当抛出一个导致程序终止的异常时，我们称之为抛出了`未处理的异常`（unhandled\
  \ exception）。\n\n异常并不一定会导致程序终止。异常在被抛出时，可以并且应该由程序处理。有时抛出异常是因为程序中存在 Bug（例如访问不存在的变量），但很多时候，异常是程序员可以并且应该预料到的。程序可能会尝试打开一个不存在的文件。如果交互式程序要求用户输入，用户可能会输入不当的内容。\n\
  \n如果你知道某行代码在执行时可能会抛出异常，你就应该处理该异常。在一个编写良好的程序中，未处理的异常应该是例外情况（exception）。\n\n考虑以下代码\n\
  \n```python\nsuccessFailureRatio = numSuccesses/numFailures\nprint('The success/failure\
  \ ratio is', successFailureRatio)\nprint('Now here')\n```\n\n大多数情况下，这段代码运行运行良好，但如果\
  \ `numFailures` 刚好为零，它就会失败。除以零的尝试会导致 `Python` 运行时系统抛出 `ZeroDivisionError` 异常，`print`\
  \ 语句永远不会被执行。\n\n写成下面的代码会更好：\n\n```python\ntry:\n    successFailureRatio = numSuccesses/numFailures\n\
  \    print('The success/failure ratio is', successFailureRatio)\nexcept ZeroDivisionError:\n\
  \    print('No failures, so the success/failure ratio is undefined.')\nprint('Now\
  \ here')\n```\n\n进入 `try` 块后，解释器尝试评估表达式 `numSuccesses/numFailures`。如果表达式评估成功，程序将表达式的值赋值给变量\
  \ `successFailureRatio`，执行 `try` 块末尾的 `print` 语句，并继续执行 `try-except` 之后的 `print`\
  \ 语句。然而，如果在表达式评估期间抛出了 `ZeroDivisionError` 异常，控制立即跳转到 `except` 块（跳过 `try` 块中的赋值和\
  \ `print` 语句），执行 `except` 块中的 `print` 语句，然后从 `try-except` 块之后的 `print` 语句继续执行。\n\
  \n**练习：** 实现一个符合下面要求的函数。使用 `try-except` 块。\n\n```python\ndef sumDigits(s):\n   \
  \ \"\"\"Assumes s is a string\n    Returns the sum of the decimal digits in s\n\
  \    For example, if s is 'a2b3c' it returns 5\"\"\"\n```\n\n让我们另一个例子。考虑以下代码\n\n\
  ```python\nval = int(input('Enter an integer: '))\nprint('The square of the number\
  \ you entered is', val**2)\n```\n\n如果用户配合输入一个可以转换为整数的字符串，一切都会正常。但假设用户输入了 `abc` 呢？执行该行代码会导致\
  \ `Python` 运行时系统抛出 `ValueError` 异常，`print` 语句永远不会被执行。\n\n程序员应该写的代码看起来类似于：\n\n```python\n\
  while True:\n    val = input('Enter an integer: ')\n    try:\n        val = int(val)\n\
  \        print('The square of the number you entered is', val**2)\n        break\
  \ #to exit the while loop\n    except ValueError:\n        print(val, 'is not an\
  \ integer')\n```\n\n进入循环后，程序会要求用户输入一个整数。一旦用户输入了内容，程序执行 `try—except` 块。如果 `try` 块中的前两个语句都没有导致\
  \ `ValueError` 异常，则执行 `break` 语句并退出 `while` 循环。然而，如果执行 `try` 块中的代码抛出了 `ValueError`\
  \ 异常，控制将立即转移到 `except` 块中的代码。因此，如果用户输入的字符串不代表整数，程序将要求用户重试。无论用户输入什么文本，都不会导致未处理的异常。\n\
  \n这种改变的缺点是程序文本从两行增加到了八行。如果有很多地方要求用户输入整数，这可能会产生问题。当然，可以通过引入函数来解决这个问题：\n\n```python\n\
  def readInt():\n    while True:\n        val = input('Enter an integer: ')\n   \
  \     try:\n            return(int(val)) #convert str to int before returning\n\
  \        except ValueError:\n            print(val, 'is not an integer')\n```\n\n\
  更好的是，这个函数可以泛化为请求任何类型的输入：\n\n```python\ndef readVal(valType, requestMsg, errorMsg):\n\
  \    while True:\n        val = input(requestMsg + ' ')\n        try:\n        \
  \    return(valType(val)) #convert str to valType before returning\n        except\
  \ ValueError:\n            print(val, errorMsg)\n\nreadVal(int, 'Enter an integer:',\
  \ 'is not an integer')\n```\n\n函数 `readVal` 是多态的，也就是说它适用于许多不同类型的参数。这种函数在 `Python`\
  \ 中易于编写，因为类型是一类对象。我们现在可以使用以下代码请求整数：\n\n```python\nval = readVal(int, 'Enter an integer:',\
  \ 'is not an integer')\n```\n\n## 7.2 作为控制流机制的异常\n\n不要认为异常仅仅用于错误。它们是一种方便的控制流机制，可以用来简化程序。\n\
  \n\n\n\n\n在许多编程语言中，处理错误的标准方法是让函数返回一个值（通常类似于 Python 中的 `None`），用以指示发生了某些问题。每次函数调用都必须检查是否返回了该值。在\
  \ Python 中，更常见的做法是当函数无法产生与其函数规范一致的结果时，让函数抛出一个异常。\n\nPython 的 `raise` 语句强制强制发生指定的异常。`raise`\
  \ 语句的格式为：\n\n`raise exceptionName(arguments*)`\n\n`exceptionName` 通常是内置异常之一，例如 `ValueError`。然而，程序员可以通过创建内置类\
  \ `Exception` 的子类（参见第 8 章）来定义新异常。不同类型的异常可以有不同类型的参数，但大多数情况下，参数是单个字符串，用于描述抛出异常的原因。\n\
  \n**手指操练习：** 实现一个符合以下规范的函数：\n\n```python\ndef findAnEven(L):\n    \"\"\"假设 L 是整数列表\n\
  \    返回 L 中的第一个偶数\n    如果 L 不包含偶数，则抛出 ValueError\"\"\"\n```\n\n请考虑图 7.1 中的函数定义。\n\
  \n![art](img/Art_P36.jpg)\n\n**图 7.1 使用异常进行控制流**\n\n与 `try` 块相关有两个 `except` 块。如果在\
  \ `try` 块内抛出了异常，Python 首先检查该异常是否为 `ZeroDivisionError`。如果是，它会向 `ratios` 添加一个类型为 `float`\
  \ 的特殊值 `nan`。（值 `nan` 代表“不是数字”。它没有对应的字面量，但可以通过将字符串 `'nan'` 或字符串 `'NaN'` 转换为 `float`\
  \ 类型来表示。当 `nan` 被用作 `float` 类型表达式的操作数时，该表达式的值也是 `nan`。）如果异常是 `ZeroDivisionError`\
  \ 以外的任何异常，代码将执行第二个 `except` 块，抛出一个带有关联字符串的 `ValueError` 异常。\n\n原则上，不应该永远进入第二个 `except`\
  \ 块，因为调用 `getRatios` 的代码应该遵守 `getRatios` 规范中的假设。然而，由于检查这些假设仅带来微不足道的计算负担，可能值得练习防御性编程并对其进行检查。\n\
  \n以下代码说明了程序如何使用 `getRatios`。在行 `except ValueError as msg:` 中，名称 `msg` 被绑定到抛出 `ValueError`\
  \ 时与之关联的参数（在此情况下为字符串）^(⁹³)。当执行以下代码时：\n\n```python\ntry:\n    print(getRatios([1.0,2.0,7.0,6.0],\
  \ [1.0,2.0,0.0,3.0]))\n    print(getRatios([], []))\n    print(getRatios([1.0, 2.0],\
  \ [3.0]))\nexcept ValueError as msg:\n    print(msg)\n```\n\n它输出：\n\n```\n[1.0,\
  \ 1.0, nan, 2.0]\n[]\ngetRatios called with bad arguments\n```\n\n作为对比，图 7.2 包含了相同规范的实现，但没有使用\
  \ `try-except`。\n\n![art](img/Art_P37.jpg)\n\n**图 7.2 没有 try-except 的控制流**\n\n图\
  \ 7.2 中的代码比图 7.1 中的代码更长且更难阅读。它的效率也较低。（图 7.2 中的代码可以通过消除局部变量 `vect1Elem` 和 `vect2Elem`\
  \ 来稍微缩短，但这样做是以反复索引列表引入更多低效为代价的。）\n\n让我们来看另一个例子，图 7.3。`getGrades` 函数要么返回一个值，要么抛出一个关联了值的异常。如果调用\
  \ `open` 时抛出了 `IOError`，它会抛出一个 `ValueError` 异常。它可以忽略 `IOError` 并让调用 `getGrades`\
  \ 的程序部分处理，但那样为调用代码提供的错误信息会更少。使用 `getGrades` 的代码要么使用返回的值来计算另一个值，要么处理异常并打印一条信息丰富的错误消息。\n\
  \n![art](img/Art_P38.jpg)\n\n**图 7.3 获取成绩**\n\n### 7.3 断言](#toc.xhtml_Rh1-26)\n\n\
  Python 的 `assert` 语句为程序员提供了一种简单的方法来确认计算状态是否符合预期。`assert` 语句有两种形式：\n\n`assert Boolean\
  \ expression`\n\n或者\n\n`assert Boolean expression, argument`\n\n当遇到 `assert` 语句时，会求值布尔表达式。如果结果为\
  \ `True`，执行继续进行。如果结果为 `False`，则抛出一个 `AssertionError` 异常。\n\n断言是非常用的防御性编程工具。它们可以用于确认函数的参数是否为适当类型。它们也是非常有用的调试工具。例如，可以使用它们来确认中间值是否符合预期，或者函数是否返回了可以接受的值。\n\
  \n____________\n\n⁹⁴ 在 Python 2 中写 `except ValueError, msg` 而不是 `ValueError as msg`。\n\
  \n## 8 类与面向对象编程](#toc.xhtml_chap-8)\n\n我们现在转向相关的最后一个主要主题：使用类来组织程序。\n\n类可以以多种方式使用。在本书中，我们强调在**面向对象编程的语境下**使用类。面向对象编程的关键是将对象看作数据及其操作方法的集合。\n\
  \n面向对象编程的思想已经有四十多年的历史，并在过去的二十多年里得到了广泛接受和实践。20 世纪 70 年代中期，人们开始编写关于这种方法优势的文章。大约同时，语言\
  \ `SmallTalk`（来自 Xerox）和 `CLU`（来自 MIT）为这些思想提供了语言支持。但直到 `C++` 和 `Java` 的出现，它才真正流行起来。\n\
  \n在本书的大部分内容中，我们一直在隐含地依赖面向对象编程。在 2.1.1 节中提到：“对象是 Python 程序处理的核心。每个对象都有一个**类型**，定义了对对象可以做的事情。”自第\
  \ 2 章以来，我们依赖于 `list` 和 `dict` 等内置类型以及与之关联的方法。但正如编程语言设计者只能内置部分有用函数一样，他们也只能内置部分有用类型。我们已经查看了允许程序员定义新函数的机制，现在我们来看允许程序员定义新类型的机制。\n\
  \n### 8.1 抽象数据类型与类](#toc.xhtml_Rh1-27)\n\n抽象数据类型的概念非常简单。**抽象数据类型**是一组对象以及对这些对象的操作。这些被绑定在一起，以便对象从程序的一个部分传递到另一个部分，并在此过程中不仅提供数据属性的访问，还提供易于操作数据的方法。\n\
  \n这些操作的规范定义了抽象数据类型与程序其余部分的**接口**。接口定义了操作的行为——做什么，而不是怎么做。\n\n\n\n\n\n编程是为了以一种便于更改的方式管理复杂性。实现这一目标有两种强大的机制：分解和抽象。分解在程序中创建结构，而抽象则抑制细节。关键在于抑制恰当的细节。这正是数据抽象大显身场的地方。可以创建特定领域的类型来提供方便的抽象。理想情况下，这些类型捕捉了在程序生命周期内相关的概念。如果一个人在编程开始阶段就设计出几个月甚至几十年后仍然相关的类型，那么在维护该软件方面具有巨大的优势。\n\
  \n在本书中，我们一直在使用抽象数据类型（尽管没有这样称呼它们）。我们使用整数、列表、浮点数、字符串和字典编写程序，而没有考虑过这些类型是如何实现的。引用莫利埃在《资产阶级小姐》中的话：*“诚然天誓，我们使用\
  \ ADT 的次数超过了一百页页，而我们却并不自知。”*^(⁹⁵)\n\n在 Python 中，我们使用 `classes` 来实现数据抽象。图 8.1 包含一个\
  \ `class definition`，它提供了一个名为 `IntSet` 的整数集合抽象的简单实现。\n\n类定义创建一个类型为 `type` 的对象，并与该类对象关联一组类型为\
  \ `instancemethod` 的对象。例如，表达式 `IntSet.insert` 指向在 `IntSet` 类定义中定义的 `insert` 方法。而代码\n\
  \n```\nprint(type(IntSet), type(IntSet.insert))\n```\n\n将打印\n\n`<class 'type'> <class\
  \ 'function'>`\n\n请注意，类定义顶部的 docstring（包含在 `\"\"\"` 括围中的注释）描述了类提供的抽象，而不是关于类如何实现的信息。相比之下，docstring\
  \ 下方的注释包含了关于实现的信息。这些信息是针对可能想要修改实现或构建类子类（参见第 8.2 节）的程序员，而不是可能想要使用该抽象的程序员。\n\n![art](img/Art_P39.jpg)\n\
  \n**图 8.1 类** `IntSet`\n\n当函数定义出现在类定义内部时，定义的函数被称为 `method` 并与类关联。这些方法有时被称为类的 `method\
  \ attributes`。如果这现在让你感到困惑，不要担心。我们在本章稍后的部分将对这个主题进行更多说明。\n\n类支持两种操作：\n\n*   **实例化（Instantiation）**用于创建类的实例。例如，语句\
  \ `s = IntSet()` 创建了一个类型为 `IntSet` 的新对象。该对象被称为 `IntSet` 的实例。\n*   **属性引用（Attribute\
  \ references）**使用点符号访问与类相关的属性。例如，`s.member` 指向与类型为 `IntSet` 的实例 `s` 关联的方法 `member`。\n\
  \n每个类定义都以关键字 `class` 开始，后面跟着类名以及关于它如何与其他类相关的某些信息。在这种情况下，第一行表示 `IntSet` 是 `object`\
  \ 的子类。目前，请忽略子类的含义。我们很快就会遇到这一点。\n\n正如我们所看到的，Python 有许多以双下划线开头和结尾的特殊方法名称。我们将查看的第一个是\
  \ `__init__`。每当类被实例化时，就会调用该类中定义的 `__init__` 方法。当执行代码\n\n```\ns = IntSet()\n```\n\
  \n时，解释器将创建一个类型为 `IntSet` 的新实例，然后调用 `IntSet.__init__`，并将新创建的对象作为实际参数绑定到形式参数 `self`。当调用时，`IntSet.__init__`\
  \ 创建 `vals`，一个类型为 `list` 的对象，它成为新创建的 `IntSet` 实例的一部分。（该列表是使用现在熟悉的符号 `[]` 创建的，它仅仅是\
  \ `list()` 的缩写。）此列表被称为 `IntSet` 实例的 `data attribute`。注意，每个类型为 `IntSet` 的对象将有一个不同的\
  \ `vals` 列表，正如预期的那样。\n\n正如我们看到的，与类实例关联的方法可以使用点符号调用。例如，代码\n\n```\ns = IntSet()\n\
  s.insert(3)\nprint(s.member(3))\n```\n\n创建了一个新的 `IntSet` 实例，将整数 3 插入到该 `IntSet`\
  \ 中，然后打印 `True`。\n\n乍一看，这里似乎有些不一致的地方。看起来每个方法在调用时都少了一个参数。例如，`member` 有两个形式参数，但我们似乎调用它时只用了一个实际参数。这是点符号的一种产物。点符号之前的表达式关联的对象被隐式地作为第一个参数传递给方法。在本书中，我们遵循使用\
  \ `self` 作为绑定此实际参数的形式参数名的约定。Python 程序员普遍遵循这一约定，我们强烈建议你也这样做。\n\n类不应与该类的实例混淆，就像类型为\
  \ `list` 的对象不应与列表类型混淆一样。属性可以与类本身关联也可以与类的实例关联：\n\n*   方法属性（Method attributes）定义在类定义中，例如，`IntSet.member`\
  \ 是类 `IntSet` 的属性。当类被实例化时（例如通过语句 `s = IntSet()`），会创建实例属性，例如 `s.member`。请记住 `IntSet.member`\
  \ 和 `s.member` 是不同的对象。虽然 `s.member` 初始绑定到定义在 `IntSet` 类中的 `member` 方法，但该绑定可以在计算执行过程中被更改。例如，你可以（但不应该！）写\
  \ `s.member = IntSet.insert`。\n*   当数据属性（data attributes）与类关联时，我们称它们为**类变量（class\
  \ variables）**。当它们与实例关联时，我们称它们为**实例变量（instance variables）**。例如，`vals` 是一个实例变量，因为对于每个\
  \ `IntSet` 实例，`vals` 都绑定到不同的列表。到为止，我们还没有看到类变量。我们将在图 8.3 中使用它。\n\n数据抽象实现了表示独立。将抽象类型的实现视为具有几个部分：\n\
  \n*   该类型方法的实现，\n*   共同编码类型值的数据结构，\n*   关于方法实现如何使用数据结构的约定。一个关键约定由表示不变性（representation\
  \ invariant）捕捉。\n\n**表示不变性**定义了数据属性的哪些值对应于类实例的有效表示。`IntSet` 的表示不变性是 `vals` 不包含重复项。`__init__`\
  \ 的实现负责建立该不变性（它在空列表上成立），其他方法负责维护该不变性。这就是为什么 `insert` 仅当 `e` 不在 `self.vals` 中时才追加\
  \ `e`。\n\n`remove` 的实现利用了进入 `remove` 时表示不变性已满足的假设。它只调用一次 `list.remove`，因为表示不变性保证了\
  \ `e` 在 `self.vals` 中最多出现一次。\n\n类中定义的最后一个方法 `__str__` 是另一个这类特殊的 `__` 方法。当使用 `print`\
  \ 命令时，与要打印的对象关联的 `__str__` 函数会被自动调用。例如，代码\n\n```\ns = IntSet()\ns.insert(3)\ns.insert(4)\n\
  print(s)\n```\n\n将打印\n\n`{3,4}`\n\n\n\n\n\n（如果没有定义 `__str__` 方法，执行 `print(s)` 将导致打印类似\
  \ `<__main__.IntSet object at 0x1663510>` 的内容。）我们也可以通过编写 `print s.__str__()` 甚至\
  \ `print IntSet.__str__(s)` 来打印 `s` 的值，但使用这些形式并不方便。当程序通过调用 `str` 将某个类的实例转换为字符串时，该类的\
  \ `__str__` 方法也会被调用。\n\n用户定义类的实例都是可哈希的（hashable），因此可以作为字典的键。如果没有提供 `__hash__` 方法，对象的哈希值将从函数\
  \ `id` 派（参见第 5.3 节）。如果没有提供 `__eq__` 方法，则所有对象都被认为是不相等的（自身相等除外）。如果提供了用户定义的 `__hash__`，它应该确保对象的哈希值在对象的整个生命周期内保持恒定。\n\
  \n## 8.1.1 使用抽象数据类型设计程序\n\n抽象数据类型是一项大工程。它们导致了组织大型程序的思考方式发生了变化。当我们思考世界时，依赖于抽象。在金融领域，人们谈论股票和债券。在生物学领域，人们谈论蛋白质和残基。在尝试理解此类概念时，我们会在脑中将这类类型对象的一些相关数据和特征汇聚成一个知识包。例如，我们将债券认为是具有利率和到期日期数据属性的对象。我们还认为债券具有诸如“设置价格”和“计算终期收益率”等操作。抽象数据类型允许我们将这种类组织方式纳入程序设计中。\n\
  \n数据抽象鼓励程序设计人员关注数据对象的中心性，而不是函数。将程序更多地看作类型的集合而不是函数的集合，会导致一种截然不同的组织原则。除其他点外，它鼓励人们将编程视为组合相对较大代码块的过程，因为数据抽象通常包含比单个函数更多的功能。这反过来又使我们认为编程的本质过程不是编写单行代码，而是组合抽象。\n\
  \n可重用抽象的可用性不仅缩短了开发时间，而且通常会导致更可靠的程序，因为成熟的软件通常比新旧软件更可靠。多年来，通用的程序库只有统计类或科学类的。然而，今天已经存在大量的可用程序库（特别是针对\
  \ Python），正如我们在本书后面将看到的，这些库通常基于丰富的数据抽象。\n\n## 8.1.2 使用类跟踪学生和教职员工\n\n作为类的一个使用示例，想象你正在设计一个程序来帮助跟踪大学所有的学生和教职员工。在不使用数据抽象的情况下编写这样的程序无疑是可能的。每个学生都有姓、名、家庭地址、年级、某些成绩等。这些都可以存储在列表和字典的某种组合中。跟踪教职员工和人员需要一些类似的数据结构以及一些不同的数据结构，例如用于跟踪工资历史等信息的数据结构。\n\
  \n在急于设计一堆数据结构之前，让我们考虑一些可能有用的抽象。是否有一种抽象可以涵盖学生、教授和员工的共同属性？某些人会认为他们都是人类。图 8.2 包含一个结合了人类一些共同属性（姓名和生日）的类。它使用了标准的\
  \ Python 库模块 `datetime`，该模块提供了许多创建和操作日期的方便方法。\n\n![art](img/Art_P40.jpg)\n\n**图\
  \ 8.2 类** Person\n\n以下代码使用了 `Person` 类。\n\n```\nme = Person('Michael Guttag')\n\
  him = Person('Barack Hussein Obama')\nher = Person('Madonna')\n\nprint(him.getLastName())\n\
  \nhim.setBirthday(datetime.date(1961, 8, 4))\nher.setBirthday(datetime.date(1958,\
  \ 8, 16))\n\nprint(him.getName(), 'is', him.getAge(), 'days old')\n```\n\n注意，每当实例化\
  \ `Person` 时，都会向 `__init__` 函数提供一个参数。通常，在实例化一个类时，我们需要查看该类 `__init__` 函数的规范，以了解需要提供什么参数以及参数应该具有什么属性。\n\
  \n执行上述代码后，将会有三个 `Person` 类的实例。随后可以使用与它们关联的方法访问这些实例的信息。例如，`him.getLastName()` 将返回\
  \ 'Obama'。表达式 `him.lastName` 也会返回 'Obama'；然而，由于本章稍后讨论的原因，直接访问实例变量的表达式被认为是不良习惯，应该避免。同样，`Person`\
  \ 抽象的用户没有合适的方法来提取人的生日，尽管实现中包含一个具有该值的属性。（当然，给该类添加一个 `getBirthday` 方法是很容易的。）但是，确实有一种方法可以提取取决于个人生日的信息，如上述代码中的最后一个打印语句所示。\n\
  \n`Person` 类定义了另一个特殊命名的方法 `__lt__`。该方法重载了 `<` 运算符。每当 `<` 运算符的第一个参数类型为 `Person` 时，就会调用\
  \ `Person__lt__` 方法。`Person` 类中的 `__lt__` 方法是使用类型为 `str` 的二元运算符 `<` 实现的。表达式 `self.name\
  \ < other.name` 是 `self.name.__lt__(other.name)` 的简写。由于 `self.name` 是 `str`，此 `__lt__`\
  \ 方法就是与 `str` 相关的方法。\n\n除了提供书法的语法便利外，这种重载还提供了访问使用 `__lt__` 定义的任何方法。内置方法 `sort` 就是其中之一。例如，如果\
  \ `pList` 是由 `Person` 类型元素组成的列表，`pList.sort()` 将使用 `Person` 中定义的 `__lt__` 方法对列表排序。\n\
  \n```\npList = [me, him, her]\nfor p in pList:\n    print(p)\npList.sort()\nfor\
  \ p in pList:\n    print(p)\n```\n\n将首先打印\nMichael Guttag\nBarack Hussein Obama\n\
  Madonna\n然后打印\nMichael Guttag\nMadonna\nBarack Hussein Obama\n\n## 8.2 继承\n\n许多类型与其他具有共同属性。例如，`list`\
  \ 和 `str` 类型都有相同的 `len` 函数。**继承**为构建相关抽象提供了一种方便的机制。它允许程序员创建一个类型层次结构，其中每个类型从其上方的类型继承属性。\n\
  \n类对象位于层次结构的顶端。这是合理的，因为在 Python 中，运行时的所有内容都是对象。因为 `Person` 继承了对象的所有属性，程序可以将变量绑定到\
  \ `Person`、将 `Person` 添加到列表等。\n\n图 8.3 中的 `MITPerson` 类从其父类 `Person` 继承属性，包括其从其父类\
  \ `object` 继承的所有属性。在面向对象编程的术语中，`MITPerson` 是 `Person` 的**子类**，因此**继承**了其**父类**的属性。除了继承的内容，子类还可以：\n\
  \n*   添加新属性。例如，子类 `MITPerson` 添加了类变量 `nextIdNum`、实例变量 `idNum` 以及方法 `getIdNum`。\n\
  \n\n\n\n\n- **重写（Override），** 即，替换父类的属性。例如，`MITPerson` 重写了 `__init__` 和 `__lt__`。当一个方法被重写时，执行的方法版本取决于用于调用该方法的对象。如果对象的类型是子类，则将使用子类中定义的版本；如果对象的类型是父类，则将使用父类中的版本。\n\
  \n方法 `MITPerson.__init__` 首先调用 `Person.__init__` 来初始化继承的实例变量 `self.name`。然后它初始化\
  \ `self.idNum`，这是一个 `MITPerson` 实例拥有而 `Person` 实例不拥有的实例变量。\n\n实例变量 `self.idNum`\
  \ 是使用一个**类变量** `nextIdNum` 初始化的，该变量属于 `MITPerson` 类，而不是属于该类的实例。当创建一个 `MITPerson`\
  \ 实例时，并不会创建一个 `nextIdNum` 的新实例。这使得 `__init__` 能够确保每个 `MITPerson`` 实例都有一个唯一的 `idNum`。\n\
  \n![art](img/Art_P41.jpg)\n\n**图 8.3 类** MITPerson\n\n考虑以下代码：\n\n```python\np1 =\
  \ MITPerson('Barbara Beaver')\nprint(str(p1) + '\\'s id number is ' + str(p1.getIdNum()))\n\
  ```\n\n第一行创建了一个新的 `MITPerson`。第二行稍微复杂一些。当它尝试评估表达式 `str(p1)` 时，运行时系统首先检查是否存在与类 `MITPerson`\
  \ 关联的 `__str__` 方法。如果没有，它接着检查是否存在与 `MITPerson` 的父类 `Person` 关联的 `__str__` 方法。有的，于是它使用该方法。当运行时系统尝试评估表达式\
  \ `p1.getidNum()` 时，它首先检查是否存在与类 `MITPerson` 关联的 `getIdNum` 方法。有的，于是它调用该方法并打印：\n\n\
  `Barbara Beaver's id number is 0`\n\n（回想一下，在字符串中，字符“”是一个转义字符，用于指示下一个字符应该被特殊对待。在字符串\
  \ `'\\'s id number is '` 中，“\\”表示单引号是字符串的一部分，而不是终止字符串的分隔符。）\n\n现在考虑以下代码：\n\n```python\n\
  p1 = MITPerson('Mark Guttag')\np2 = MITPerson('Billy Bob Beaver')\np3 = MITPerson('Billy\
  \ Bob Beaver')\np4 = Person('Billy Bob Beaver')\n```\n\n我们创建了四个虚拟人物，其中三个人名叫 Billy\
  \ Bob Beaver。两个 Billy Bob 是 `MITPerson` 类型，而一个仅仅是 `Person`。如果我们执行以下代码行：\n\n```python\n\
  print('p1 < p2 =', p1 < p2)\nprint('p3 < p2 =', p3 < p2)\nprint('p4 < p1 =', p4\
  \ < p1)\n```\n\n解释器将打印：\n\n`p1 < p2 = True`\n`p3 < p2 = False`\n`p4 < p1 = True`\n\
  \n由于 `p1`、`p2` 和 `p3` 都是 `MITPerson` 类型，解释器在评估前两个比较时将使用在 `MITPerson` 类中定义的 `__lt__`\
  \ 方法，因此排序将基于识别码。在第三次比较中，`<` 运算符被应用于不同类型的操作数。由于表达式的第一个参数用于确定调用哪一个 `__lt__` 方法，`p4\
  \ < p1` 是 `p4.__lt__(p1)` 的简写。因此，解释器使用与 `p4` 的类型 `Person` 关联的 `__lt__` 方法，“这些人物”将按名称排序。\n\
  \n如果我们尝试：\n\n```python\nPrint('p1 < p4 =', p1 < p4)\n```\n\n运行时系统将调用与 `p1` 类型关联的\
  \ `__lt__` 运算符，即在 `MITPerson` 类中定义的那个。这将导致异常：\n\n`AttributeError: 'Person' object\
  \ has no attribute 'idNum'`\n\n因为 `p4` 绑定的对象没有 `idNum` 属性。\n\n### 8.2.1 多层级继承\n\n\
  [图 8.4] 为类层次结构又增加了两层继承。\n\n![art](img/Art_P42.jpg)\n\n**图 8.4 两种类型的学生**\n\n添加 `UG`\
