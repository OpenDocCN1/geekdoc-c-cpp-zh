  Final result has dissimilarity 11.441\nCluster with centroid [ 2.10900238 4.99452866]\
  \ contains:\nA.1, A.2, A.4, A.7\nCluster with centroid [ 4.92742554 5.60609442]\
  \ contains:\nB.2, B.4, B.5, B.7\nCluster with centroid [ 2.80974427 9.60386549]\
