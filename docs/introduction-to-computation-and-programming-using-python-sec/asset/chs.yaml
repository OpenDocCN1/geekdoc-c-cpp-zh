  \n# 17 采样与置信区间\n\n回顾一下，推断统计学是通过对总体的一个随机选择的子集进行分析，对总体进行推断。这个子集被称为**样本**。\n\n采样之所以重要，是因为通常无法观察到感兴趣的总体。医生无法计算患者血液中某种细菌的数量，但可以测量患者血液小样本中的种群数量，并据此推断出总体的特征。如果你想知道\
  \ 18 岁美国人的平均体重，你可以尝试把他们所有人找起来，放在一个巨大的秤上，然后除以人数。或者，你可以随机选取 50 个 18 岁的美国人，计算他们的平均体重，并假设他们的平均体重是整个\
  \ 18 岁人群平均体重的合理估计值。\n\n\n\n\n样本与目标总体之间的对应关系至关重要。如果样本对总体没有代表性，无论数学多么多么，都无法得出有效的推断。一个五十名女性、五十名亚裔美国人或五十名足球运动员的样本，并不能对美国所有十八岁成年人的平均体重得出有效的推断。\n\
  \n在本书中，我们关注`概率抽样`（probability sampling）。通过概率抽样，目标总体的每个成员都有非零概率被纳入样本。在`简单随机抽样`（simple\
  \ random sample）中，总体的每个成员都有等机会被选中样本。在`分层抽样`（stratified sampling）中，首先将总体分为若干子小组，然后通过从每个小组中随机抽取来构建样本。分层抽样可以增加样本对整体具有代表性的概率。例如确保样本中的男女比例与总体中的男女比例一致，这增加了样本平均体重（即`样本均值`，sample\
  \ mean）作为整个总体平均体重（即`总体均值`，population mean）良好估计值的概率。\n\n## 17.1 波士顿马拉松的抽样\n\n自 1897\
  \ 年以来，运动员（主要是跑步运动员，但从 1975 年起增加了轮椅组）每年聚集在马萨诸塞州参加波士顿马拉松。近年来，每年约有两万名勇者成功完成了 42.195\
  \ 公里（26 英里，385 码）的赛程。\n\n一个包含 2012 年比赛数据的文件可以在本书相关的网站上找到。文件（`bm_results2012.txt`）采用逗号分隔格式，包含每个参赛者的姓名、性别、年龄、组别、国家和时间。[图\
  \ 17.1]包含了该文件内容的前几行。\n\n![art](img/Art_P179.jpg)\n\n**图 17.1 `bm_results2012.txt`\
  \ 中的前几行**\n\n由于很容易获得每场比赛结果的完整数据，因此在实践上没有必要通过抽样来获取比赛统计数据。然而，从教学角度来说，将从样本得出的统计估计值与被估计的实际值进行比较是有用的。\n\
  \n[图 17.2]中的代码产生了[图 17.3]所示的图表。函数`getBMData`从包含比赛中每个参赛者信息的文件中读取数据。它返回一个包含六元素的字典。每个键描述了与该键关联的列表元素中所包含的数据类型（例如`'name'`或`'gender'`）。例如，`data['time']`是一个浮点数列表，包含每个参赛者的完成时间，`data['name'][i]`是第$i$个参赛者的姓名，`data['time'][i]`是第$i$个参赛者的完成时间。函数`makeHist`产生完成时间的视觉化表示。\n\
  \n![art](img/Art_P180.jpg)\n\n**图 17.2：读取数据并生成波士顿马拉松图表**\n\n![art](img/Art_P181.jpg)\n\
  \n**图 17.3：波士顿马拉松完成时间**\n\n完成时间的分布类似于正态分布，但由于右侧存在肥尾，显然不是正态分布。\n\n现在，让我们假设无法获得所有参赛者的数据，而是想通过对少量随机选取的参赛者进行抽样，来估计整个赛场完成时间的某些统计数据。\n\
  \n[图 17.4]中的代码创建了`times`元素的简单随机样本，然后使用该样本估计`times`的均值和标准差。函数`sampleTimes`使用`random.sample(times,\
  \ numExamples)`提取样本。`random.sample`的调用返回一个大小为`numExamples`的列表，其中是从列表`times`中随机取的不同元素。提取样本后，`sampleTimes`产生一个显示样本值分布的直方图。\n\
  \n![art](img/Art_P182.jpg)\n\n**图 17.4：完成时间的抽样**\n\n如[图 17.5]所示，样本的分布与其抽自的分布偏离正态得多。考虑到样本量很小，这并不意外。令人惊讶的是，尽管样本量很小（约\
  \ 21,000 人中的 40 人），估计的均值与总体均值之差小于 2%。是我们运气好吗？还是有理由预期均值的估计会相当准确？换句话说，我们能否以量化的方式表达我们对估计值有多大的信心？\n\
  \n![art](img/Art_P183.jpg)\n\n**图 17.5：分析小样本**\n\n正如我们在[第 15 章]和[第 16 章]中所讨论过的，提供置信区间和置信水平以指示估计的可靠性通常是有用的。对于从大总体中抽取的单个样本（无论大小如何），对总体均值的最佳估计是样本均值。估计达到所需置信水平的置信区间宽度则更为复杂。它在某种程度上取决于样本量。\n\
  \n很容易理解样本量的重要性。大数定律告诉我们，随着样本量的增加，样本的分布更有可能类似于其抽自的分布。因此，随着样本量的增加，样本均值和样本标准差可能更接近总体均值和标准差。\n\
  \n所以，越大越好但有多大才足够？这取决于总体的方差。考虑两个正态分布：一个均值为 0，标准差为 1；另一个均值为 0，标准差为 100。如果我们从这些分布中随机选择一个元素并用它来估计均值，那么该估计值落在任何所需精度$\\\
  epsilon$内（相对于真实均值 0）的概率，将等于概率密度函数在$-\\epsilon$和$\\epsilon$之间的面积（见第 15.4.1 节）。[图\
  \ 17.6]中的代码计算并打印了这些$\\epsilon = 3$分钟时的概率。\n\n![art](img/Art_P184.jpg)\n\n**图 17.6：方差对均值估计的影响**\n\
  \n当运行[图 17.6]中的代码时，它打印出\n\nProbability of being within 3 of true mean of tight dist.\
  \ = 0.9973\n\nProbability of being within 3 of true mean of wide dist. = 0.0239\n\
  \n[图 17.7]中的代码绘制了从两个正态分布中取的 1000 个大小为 40 的样本的均值。同样，每个分布的均值为 0，但一个标准差为 1，另一个为 100。\n\
  \n[图 17.8]的左侧显示了每个样本的均值。正如预期，当总体标准差为 1 时，样本均值都靠近总体均值 0，这就是看不到明显的圆圈——它们太密了，看起来像一条条形。相比之下，当总体标准差为\
  \ 100 时，样本均值分布在难以辨认的模式中。\n\n\n\n然而，当我们观察标准差为 100 时的均值直方图时，图 17.8 的右侧出现了一个重要的现象：均值形成了一个接近以\
  \ 0 为中心的正态分布。图 17.8 的右侧呈现这种外观并非偶然。它是中心极限定定理的结果，这也是概率论和统计学中最著名的定理。\n\n![art](img/Art_P185.jpg)\n\
  \n**图 17.7：计算并绘制样本均值**\n\n![art](img/Art_P186.jpg)\n\n**图 17.8：样本均值**\n\n## 17.2\
  \ 中心极限定定理](#toc.xhtml_Rh1-61)\n\n中心极限定定理解释了为什么可以使用从总体中抽取的单个样本，来估计从同一总体中抽取的一组假设样本均值的变异性。\n\
  \n`中心极限定定理`（朋友们称为 `CLT`）的一个版本由拉普拉斯于 1810 年首次发表，随后由泊松在 19 世纪 20 年代完善。但我们今天熟悉的 CLT\
  \ 是 20 世纪上半叶一系列著名数学家工作的成果。\n\n尽管研究过该定理的数学家名单令人深刻（或者也许是因为他们），但 CLT 实际上非常简单。它指出：\n\
  \n*   给定一组从同一总体中抽取的足够大的样本，样本的均值（样本均值）将近似呈正态分布，\n*   该正态分布的均值将接近总体的均值，\n*   样本均值的方差（如第\
  \ 15.3 节所示）将接近总体方差除以样本量。\n\n让我们来看一个 CLT 发作用的例子。假设你有一个骰子，它的特性是每次投掷都会产生一个 0 到 5 之间的随机实数。图\
  \ 17.9 中的代码模拟了多次投掷这样的骰子，打印了均值和方差（`variance` 函数定义在图 15.8 中），然后绘制一个直方图，显示不同范围数字掷出的概率。它还模拟了多次投掷\
  \ 100 个骰子，并在（同一张图中）绘制了这 100 个骰子均值的直方图。`hatch` 关键字参数用于在视觉上区分两个直方图。\n\n`weights` 关键字绑定到与\
  \ `hist` 的第一个参数长度相同的数组，用于为第一个参数中的每个元素分配权重。在生成的直方图中，每个箱（bin）中的每个值根据其关联权重贡献到箱计数中（而不是通常的\
  \ 1）。在这个例子中，我们使用 `weights` 将 `y` 值缩放到每个箱的相对大小而非绝对大小。因此，对于每个箱，`y-axis` 上的值是均值落在该箱内的概率。\n\
  \n![art](img/Art_P187.jpg)\n\n**图 17.9：估计连续骰子的均值**\n\n运行代码时，它生成了图 17.10 中的图，并打印了：\n\
  \n```\nMean of rolling 1 die = 2.4974 Variance = 2.0904\nMean of rolling 100 dice\
  \ = 2.4981 Variance = 0.02\n```\n\n在每情况下，均值都非常接近 2.5 的预期均值。由于我们的骰子是公平的，单个骰子的概率分布几乎是完美的均匀分布，即非常偏离正态分布。然而，当我们观察\
  \ 100 个骰子的平均值时，分布几乎是完美的正态分布，其峰值包含了预期均值。此外，100 次投掷均值的方差接近于单次投掷数值方差除以 100。一切都符合 CLT\
  \ 的预测。\n\n![art](img/Art_P188.jpg)\n\n**图 17.10：中心极限定理的插图**\n\nCLT 看起来有效很不错，但它有什么用处呢？也许它对于那些在特别极客的酒吧喝酒的人来说，赢得赌注有用。然而，CLT\
  \ 的主要价值在于，即使在底层总体分布不是正态分布的情况下，它允许我们计算置信水平和区间。当我们在第 15.4.2 节中查看置信区间时，我们指出经验法则基于对采样空间性质的假设。我们假设：\n\
  \n*   均值估计误差为 0，且\n*   估计误差的分布是正态。\n\n当这些假设成立时，正态分布的经验法则提供了一种在使用均值和标准差估计置信区间和水平的方便方法。\n\
  \n让我们回到波士顿马拉松的例子。图 17.11 中的代码生成了图 17.12 中的图，为每种样本量绘制了二十个简单随机样本。对于每个样本量，它计算这二十个样本的均值；然后计算这些均值的标准差。由于\
  \ CLT 告诉我们均值将呈正态分布，我们可以使用标准差来计算每个样本量的 95% 置信区间。正如图 17.12 所示，所有的估计值都接近总体均值。然而，注意估计中的误差并没有随着样本量的增加而减小——使用\
  \ 250 个样本的估计比使用 50 个要差。随样本量增加而变化的是我们对均值的估计信心。随着样本量从 50 增加到 1850，置信区间从 ±15 缩小到 ±2。这是非常重要的。仅仅靠运气获得良好的估计是不够的。我们需要知道对估计有多大信心。\n\
  \n![art](img/Art_P189.jpg)\n\n**图 17.11：带有误差棒的图**\n\n![art](img/Art_P190.jpg)\n\n\
  **图 17.12：带有误差棒的比赛时间估计**\n\n## 17.3 均值误差](#toc.xhtml_Rh1-62)\n\n我们刚刚看到，如果我们选择二十个\
  \ 1850 样本，我们可以以 95% 的置信度将均值估计在 4 分钟范围内。我们使用样本均值的标准差来实现这一点。遗憾的是，由于这涉及的总样本数（20*1850\
  \ = 37000）多于参赛人数，这似乎并不是一个很有用的结果。我们最好使用总体计算实际均值。我们需要一种使用单个样本来估计置信区间的方法。引入**均值误差**（`SE`\
  \ 或 `SEM`）的概念。\n\n大小为 `n` 的样本的 SE 是从同一总体抽取的无限数量 `n` 样本均值的标准差。出乎意料，它依赖于 `n` 和总体标准差\
  \ `σ`：\n\n![art](img/Art_P191.jpg)\n\n图 17.13 将图 17.12 中使用的样本量的 SE 与我们为每个样本量生成的二十个样本均值的标准差进行了比较。\n\
  \n![art](img/Art_P192.jpg)\n\n**图 17.13：均值误差**\n\n我们样本均值的实际标准差紧密随 SE 变化。在两种情况下，标准差在开始时下降很快，随后随着样本量变大而下降变缓。这是因为标准差的减少依赖于样本量的平方根。例如，要将标准差减半，需要将样本量增加四倍。\n\
  \n\n\n\n唉，如果我们拥有的只有一个样本，那么我们就不知道总体的标准差。通常情况下，我们假设样本的标准差（即样本标准差）是总体标准差的一个合理替代指标。当总体分布不是严重偏斜时，这种假设是成立的。\n\
  \n图 17.14 中的代码从波士顿马拉松数据中创建了 100 个不同大小的样本，并将每个大小样本的平均标准差与总体的标准差进行比较。它生成了图 17.15 中的图表。\n\
  \n![art](img/Art_P193.jpg)\n\n**图 17.14：样本标准差 vs 总体标准差**\n\n![art](img/Art_P194.jpg)\n\
  \n**图 17.15：样本标准差**\n\n当样本量达到 100 时，样本标准差与总体标准差之间的差异相对较小。\n\n在实践中，人们通常使用样本标准差来代替（通常未知的）总体标准差以估计标准误（SE）。如果样本量足够大^(²³⁶)，且总体分布离正态分布不远，那么使用这个估计值通过经验规则计算置信区间是安全的。\n\
  \n这意味着什么？如果我们取一个例如包含 200 名跑步运动员的单一样本，我们可以：\n\n* 计算该样本的平均值和标准差，\n* 使用该样本的标准差来估计 SE，\n\
  * 使用估计的 SE 在样本平均值周围生成置信区间。\n\n图 17.16 中的代码执行此操作 10,000 次，然后打印样本平均值超过总体平均值 1.96 倍估计\
  \ SE 的频率。（记住，对于正态分布，95% 的数据落在均值 1.96 个标准差的范围内。）\n\n![art](img/Art_P195.jpg)\n\n\
  **图 17.16 估计 10,000 次总体平均值**\n\n运行代码时，它会输出：\n\n```\nFraction outside 95% confidence\
  \ interval = 0.0533\n```\n\n也就是说，几乎完全符合理论预言。中心极限定理（CLT）立功！\n\n____________\n\n²³⁷\
  \ “几乎”是因为我们掷骰子的次数是有限的。\n\n²³⁸ 你难道不喜欢遵循诸如“选择足够大的样本”之类的短语指令吗？不幸的是，当你对底层总体了解很少时，并没有选择足够样本大小的简单配方。许多统计学家说，当总体分布大致为正态分布时，30-40\
  \ 的样本量就足够大了。对于较小的样本量，最好使用所谓的 t 分布来计算区间的大小。t 分布与正态分布相似，但它的尾部更厚，因此置信区间会稍微宽一些。\n\n\
  # 18 理解实验数据\n\n本章关于理解实验数据。我们将大量使用绘图来对数据进行可视化处理，并展示如何使用线性回归来建立实验数据的模型。我们还将讨论物理实验与计算实验之间的相互作用。我们将关于如何得出有效统计结论的讨论推迟到第\
  \ 19 章。\n\n## 18.1 弹簧的行为\n\n弹簧是非常奇的东西。当它们被力压缩或拉伸时，它们会储存能量。当这种力不再作用时，它们会释放储存的能量。这种特性允许它们平稳汽车、帮助床垫适应我们的身体、收回安全带以及发射投影。\n\
  \n1676 年，英国物理学家罗伯·胡克提出了弹性`胡克定律`（Hooke’s law）：*Ut tensio, sic vis*，英语表达为 `F = -kx`。换句话说，弹簧中储存力\
  \ `F` 与弹簧被压缩（或拉伸）的距离呈线性相关。（负号表示弹簧施的力与位移方向相反。）胡克定律适用于许多材料和系统，包括许多生物系统。当然，它不适用于任意力。所有弹簧都有`弹性极限`，超过该极限后定律就会失效。你们中那些拉得太长弹簧的人对此深有体会。\n\
  \n比例常数 `k` 被称为`弹簧常数`。如果弹簧很硬（如汽车悬挂系统或弓的弹簧），`k` 就很大。如果弹簧很软（如圆珠笔里的弹簧），`k` 就很小。\n\n\
  了解特定弹簧的弹簧常数具有重要意义。简单秤和原子力显微镜的校准都取决于组件的弹簧常数。DNA 链的机械行为与压缩它所需的力有关。弓发射箭的力与其臂的弹簧常数有关。以此类推。\n\
  \n几代物理学生学习了使用与图中类似的实验装置来估计弹簧常数。\n\n![art](img/Art_P196.jpg)\n\n**图 18.1 一个经典实验**\n\
  \n我们从一个没有负荷的弹簧开始，测量到支架底部的距离。然后我们在弹簧上挂一个已知质量的物体，并等待它停止。此时，弹簧的位移距离为我们挂上物体前的距离。这就是胡克定律中\
  \ `F` 的值。我们再次测量弹簧底部的距离。这变成了胡克定律中 `x` 的值。我们知道作用在弹簧上的力 `F` 等于质量 `m` 乘以重力加速度 `g`（在地球上，9.81\
  \ m/s² 是 `g` 的很好的近似），所以我们用 `m*g` 代替 `F`。例如，如果 `m=1kg` 且 `x=0.1m`，那么需要 `98.1` 牛顿^(239))\
  \ 的力将弹簧拉伸一米。\n\n![art](img/Art_P197.jpg)\n\n如果以下情况一切良好：\n\n* 我们完全有信心完美地进行这个实验。在这种情况下，我们可以进行一次测量，执行计算，并知道我们找到了\
  \ `k`。\n* 我们能确定自己的操作在弹簧的弹性极限之下。\n\n一个更稳健的实验是在弹簧上挂一系列逐渐增加的重量，每次测量弹簧的拉伸量，并绘制结果。我们运行了这样的实验，并将结果输入到名为\
  \ `springData.txt` 的文件中：\n\n```\nDistance (m) Mass (kg)\n0.0865 0.1\n0.1015 0.15\n\
  …\n0.4416 0.9\n0.4304 0.95\n0.437 1.0\n```\n\n图 18.2 中的函数从像我们保存这样的文件中读取数据，并返回包含距离和质量的列表。\n\
  \n![art](img/Art_P198.jpg)\n\n**图 18.2 从文件中提取数据**\n\n图 18.3 中的函数使用 `getData()` 从文件中提取实验数据，然后生成图\
  \ 18.4 中的图表。\n\n![art](img/Art_P199.jpg)\n\n**图 18.3 绘制数据**\n\n![art](img/Art_P200.jpg)\n\
  \n**图 18.4 弹簧位移**\n\n这并不是胡克定律所言的。胡克定律告诉我们距离应该随质量线性增加，即点应该落在一条直线上，其斜率由弹簧常数决定。当然，我们知道当我们进行实际测量时，实验数据很少与理论完美匹配。测量误差是预料中的，因此我们预期点落在直线周围而不是直线上。\n\
  \n\n\n\n\n尽管如此，如果能看到一条线来代表我们在没有测量误差的情况下对点所在位置的最佳推测，那就太好了。通常的办法是向数据拟合一条直线。\n\n##\
  \ 18.1.1 使用线性回归寻找拟合\n\n每当我们对数据拟合任何曲线（包括直线）时，都需要某种方法来决定哪条曲线是数据的最佳`fit`（拟合）。这意味着我们需要定义一个`objective\
  \ function`（目标函数），对曲线拟数据的程度提供定量评估。一旦我们有了这样的函数，寻找最佳拟合就可以表述为寻找一条使函数值最小（或最大）的曲线，即求解一个优化问题（参见第\
  \ 12 章和第 13 章）。\n\n最常用的目标函数称为`最小二法`。令 `observed` 和 `predicted` 为等长度的向量，其中 `observed`\
  \ 包含测量点，`predicted` 包含拟拟合线上的对应数据点。\n\n目标函数定义如下：\n\n![art](img/Art_P201.jpg)\n\n\
  将 `observed` 点与 `predicted` 点之间的差异平方，使得 `observed` 和 `predicted` 之间的巨大差异比小差异相对更重要。平方差异也丢弃了差异是正是负的信息。\n\
  \n我们如何寻找最佳最小二法拟合呢？一种方法是使用迭代近似算法，类似于第 3 章中的牛顿-拉夫逊算法。或者，通常有适用的解析解。但我们不需要实现任何一种，因为\
  \ PyLab 提供了一个内置函数 `polyfit`，它可以找到最佳最小二法拟合的近似值。调用\n\n```\npylab.polyfit (observedXVals,\
  \ observedYVals, n)\n```\n\n可以找到一个阶为 `n` 的多项式的系数，该式为由数组 `observedXVals` 和 `observedYVals`\
  \ 定义的点集提供了最佳最小二法拟合。例如，调用\n\n```\npylab.polyfit(observedXVals, observedYVals, 1)\n\
  ```\n\n将找到一条由多项式 `y = ax + b` 的直线，其中 `a` 是线的斜率，`b` 是 y 截距。在这种情况下，该调用返回一个包含两个浮点数的数组。同样，抛物线由二次方程\
  \ `y = ax² + bx + c` 描述。因此，调用\n\n```\npylab.polyfit(observedXVals, observedYVals,\
  \ 2)\n```\n\n返回一个包含三个浮点数的数组。\n\n`polyfit` 使用的算法称为`线性回归`（linear regression）。这看起来可能有点困惑，因为我们可以用它来拟合直线以外的曲线。一些作者确实区分了`线性回归`（模型为直线时）和`多项式回归`（模型为阶大于\
  \ 1 的多项式时），但大多数人没有这样做。(²⁴⁰)\n\n图 18.5 中的函数 `fitData` 扩展了图 18.3 中的 `plotData` 函数，通过添加了一条代表数据最佳拟合的线。它使用\
  \ `polyfit` 来寻找系数 `a` 和 `b`，然后使用这些系数生成每个力对应的预测弹簧位移。注意，力和距离的处理方式存在不对对称性。`forces`\
  \ 中的值（源自悬挂在弹簧上的质量）被视为独立的，并用于产生因变量 `predictedDistances` 中的值（对悬挂质量产生的位移的预测）。\n\n该函数还计算了弹簧常数\
  \ `k`。线的斜率 `a` 是 `Δdistance/Δforce`。相反，弹簧常数是 `Δforce/Δdistance`。因此，`k` 是 `a` 的倒数。\n\
  \n调用 `fitData('springData.txt')` 产生图 18.6 中的图。\n\n![art](img/Art_P202.jpg)\n\n**图\
  \ 18.5 为数据拟合曲线**\n\n![art](img/Art_P203.jpg)\n\n**图 18.6 测量点和线性模型**\n\n有趣的是，观察到实际上很少有点恰落在最小二法拟合线上。这是合理的，因为我们正试图最小化误差平方和，而不是最大化落在直线上的点数。尽管如此，它看起来并不像是一个很好的拟合。让我们尝试通过向\
  \ `fitData` 添加以下代码来尝试三次拟合：\n\n```\n#find cubic fit\nfit = pylab.polyfit(forces,\
  \ distances, 3)\npredictedDistances = pylab.polyval(fit, forces)\npylab.plot(forces,\
  \ predictedDistances, 'k:', label = 'cubic fit')\n```\n\n在这段代码中，我们使用了函数 `polyval`\
  \ 来生成与三次拟合相关的点。该函数接受两个参数：多项式系数序列和要求多项式值的值序列。代码片段\n\n```\nfit = pylab.polyfit(forces,\
  \ distances, 3)\npredictedDistances = pylab.polyval(fit, forces)\n```\n\n和\n\n```\n\
  a,b,c,d = pylab.polyfit(forces, distances, 3)\npredictedDistances = a*forces**3\
  \ + b*forces**2 + c*forces + d\n```\n\n是等效的。\n\n这产生了图 18.7 中的图。三次拟合看起来比线性拟合是数据的更好模型，但真的是吗？可能不是。\n\
  \n![art](img/Art_P204.jpg)\n\n**图 18.7 线性拟合和三次拟合**\n\n在技术文献中，经常可以看到这类包含原始数据和曲线拟合的图。然而，作者往往假设拟合曲线是真实情况的描述，而原始数据仅仅是实验误差的指示。这可能是危险的。\n\
  \n回我们最初假设 `x` 和 `y` 值之间应该是线性关系，而不是三次关系。让我们看看如果我们使用三次拟合来预测悬挂 1.5kg 重量对应的点会落在哪里，图\
  \ 18.8。\n\n![art](img/Art_P205.jpg)\n\n**图 18.8 使用模型进行预测**\n\n现在三次拟合看起来并不那么好。特别是，通过在弹簧上悬挂大重量来使弹簧升到悬挂杆上方（y\
  \ 值为负），这似乎极是不可能的。我们得到的是过拟合（overfitting）的例子。过拟合通常发生在模型过于复杂时，例如，相对于数据量它拥有过参数。当这种情况发生时，拟合捕捉的是数据中的噪声而非有意义的关系。过拟合的模型通常预测能力差，如本例所示。\n\
  \n**指尖练习**：修改图 18.5 中的代码，使其产生图 18.8 中的图。\n\n\n\n正如图 18.9 所示，消除那些点确实产生了影响：`k` 大幅下降，且线性拟合和三次拟拟合几乎无法区分。但是，我们如何知道这两个线性拟合中哪一个能更好地代表我们的弹簧在达到弹性极限之前的性能呢？我们可以使用某些统计检验来确定哪条线与数据的拟合程度更好，但这并不是重点。这不是一个能通过统计学回答的问题。毕竟，我们可以抛弃除两个点以外的所有数据，并知道\
  \ `polyfit` 会找到一条与这两个点完美拟合的直线。我们绝不应该为了获得更好的拟合效果而抛弃实验结果^(²⁴¹)在这里，我们通过诉诸胡克定律的基础理论（即弹簧具有弹性极限）证明了抛弃右侧点的合理性。这种理由不能恰当地用于消除数据其他部分的点。\n\
  \n## 18.2 抛射体的行为(#toc.xhtml_Rh1-64)\n\n厌倦了仅仅拉伸弹簧，我们决定使用其中一个弹簧制造一个能够发射抛射体的设备^(²⁴²)。我们使用该设备四次，向距离发射点\
  \ 30 码（1080 英寸）处的目标发射抛射体。每次，我们测量了抛射体在距离发射点不同距离的高度。发射点和目标的高度相同，我们在测量中将其处理为 `0.0`。\n\
  \n数据存储在一个文件中，内容如图 18.10 所示。第一列包含抛射体到目标的距离。其他列包含四次实验中每次实验抛射体在相应距离处的高度。所有测量单位均为英制。\n\
  \n![art](img/Art_P207.jpg)\n\n**图 18.10 抛射体实验数据**\n\n图 18.11 中的代码被用于绘制四次实验中抛射体平均高度相对于距离发射点距离的关系图。它还绘制了这些点的最佳线性和二次拟合曲线。（如果你忘记了列表乘以整数的含义，表达式\
  \ `[0]*len(distances)` 会产生一个包含 `len(distances)` 个 0 的列表。）\n\n![art](img/Art_P208.jpg)\n\
  \n**图 18.11 绘制抛射体轨迹**\n\n快速看一眼图 18.12 中的图，可以清楚地看出，二次拟合远优于线性拟合^(²⁴³)（二次拟合在左侧看起来如此起伏的原因是，我们只绘制了与测量高度相对应的预测高度，而且我们在\
  \ 600 左侧的点非常少。）但是，直线的拟合效果到底有多糟糕，二次拟合的效果有多好呢？\n\n![art](img/Art_P209.jpg)\n\n**图\
  \ 18.12 轨迹图**\n\n### 18.2.1 判定系数(#toc.xhtml_Rh2-49)\n\n当我们对一组数据进行曲线拟合时，我们是在寻找一个函数，将自变量（在本例中为距离发射点的水平距离，单位为英寸）与因变量的预测值（在本例中为高于发射点的高度，单位为英寸）联系起来。询问**拟合优优度**等同于询问这些预测的准确性。记得拟合是通过最小化均方误差找到的。这表明人们可以通过观察均方误差来评估拟合的优劣。这种方法的问题在于，虽然均方误差有一个下限（0），但没有上限。这意味着，虽然均方误差对于比较对同一组数据的两个拟合的相对优劣有用，但它对于感知拟合的绝对优劣并不特别有用。\n\
  \n我们可以使用**判定系数**（coefficient of determination）来计算拟合的绝对优劣，通常写为 R²^(²⁴⁴)。令 `y[i]`\
  \ 为第 `i` 个观测值，`p[i]` 为模型对应的预测值，`μ` 为观测值的平均值。\n\n![art](img/Art_P209a.jpg)\n\n通过将估计误差（分子）与原始值的变异性（分母）进行比较，R²\
  \ 捕捉由拟合提供的统计模型所解释的数据集中变异性的（相对于均值的比例）。当评估的模型由线性回归产生时，R² 的值始终位于 0 和 1 之间。如果 R² = 1，则模型是对数据的完美拟合。如果\
  \ R² = 0，则模型预测值与数据围绕均值的分布方式之间没有关系。\n\n图 18.13 中的代码提供了这种统计测量的简单实现。其紧凑性源于数组操作的强大表达能力。表达式\
  \ `(predicted - measured)**2` 将其中一个数组的元素减去另一个数组的元素，然后对结果中的每个元素平方。表达式 `(measured\
  \ - meanOfMeasured)**2` 将标量值 `meanOfMeasured` 减去 `measured` 数组中的每个元素。\n\n![art](img/Art_P210.jpg)\n\
  \n**图 18.13 计算 R²**\n\n当代码\n\n```\nprint('RSquare of linear fit =', rSquared(meanHeights,\
  \ altitudes))\n```\n\n和\n\n```\nprint('RSquare of quadratic fit =', rSquared(meanHeights,\
  \ altitudes))\n```\n\n插入到 `processTrajectories` 中的 `pylab.plot` 调用之后（见图 18.11）时，它们会打印出：\n\
  \n```\nRSquared of linear fit = 0.01774320544\nRSquared of quadratic fit = 0.98576536287\n\
  ```\n\n大致来说，这告诉我们线性模型解释了数据的变异，而二次模型解释了超过 98% 的变异。\n\n### 18.2.2 使用计算模型(#toc.xhtml_Rh2-50)\n\
  \n现在我们有了一个看起来很好的数据模型，就可以利用这个模型来回答关于原始数据的问题。一个有趣的问题是抛射体击中目标时的水平速度。我们可以使用以下思路来设计回答该问题的计算方法：\n\
  \n1. 我们知道抛射体的轨迹由公式 `y = ax² + bx + c` ，即它是抛物线。由于每个抛物线关于顶点对称，我们知道它的顶点出现在发射点和目标之间的中间；将这个距离称为\
  \ `xMid`。因此，峰值高度 `yPeak` 由 `yPeak = a * xMid² + b * xMid + c` 给出。\n\n2. 如果忽略空气阻（记住没有模型是完美的），我们可以计算抛射体从\
  \ `yPeak` 下落到目标高度所需的时间，因为这完全是引力的函数。它由方程 ![art](img/Art_P211.jpg)^(²⁴⁵) 给出。这也是抛射体从\
  \ `xMid` 到目标所需的时间，因为它一旦到达目标就停止运动了。\n\n3. 给定从 `xMid` 到目标的时间，我们可以很容易地计算抛射体在该间隔内的平均水平速度。如果我们假设抛射体在该间隔水平方向既没有加速也没有减速，就可以平均水平速度作为抛射体击中目标时水平速度的估计。\n\
  \n图 18.14 实现了这种估计抛射体水平速度的技术^(²⁴⁶)。\n\n![art](img/Art_P212.jpg)\n\n**图 18.14 计算抛射体的水平速度**\n\
