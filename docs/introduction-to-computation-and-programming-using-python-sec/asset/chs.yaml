  \n# 16 蒙特卡洛模拟](#toc.xhtml_chap-16)\n\n在第 14 章和第 15 章中，我们查看了计算中使用随机数的不同方法。我们提出的许多示例属于被称为**蒙特卡洛模拟**的计算类。蒙特卡洛模拟是一种通过多次运行相同的模拟并平均结果来近似事件概率的技术。\n\
  \n斯坦尼斯拉夫·乌拉姆（Stanislaw Ulam）和尼古拉斯·梅特波罗（Nicholas Metropolis）在 1949 年创造了蒙特卡洛模拟一词，以纪念摩纳哥公国赌场里的博弈游戏。乌拉姆因爱德华·泰勒（Edward\
  \ Teller）共同设计氢弹而闻名，他对该模型的发明描述如下：\n\n```\n我实践[蒙特卡洛方法]的最初想法和尝试源于我在 1946 年产生的一个问题，当时我正在病中康复并玩单人牌。问题是：用\
  \ 52 张牌摆出的 Canfield 单人牌能够获的概率是多少？在花费了大量时间尝试通过纯组合计算来估算概率后，我想是否可能有一种比“抽象思维”更实用的方法，比如把牌摆出一百次，然后简单地观察并统计胜利的次数。这在快速计算机新时代的初期已经是可以预见的，^(²¹⁷)，我立即想到了中子扩散问题和其他数学物理问题，更广义地说，如何将由某些微分方程描述的过程转换为可以解释为一系列随机操作的等效形式。后来……[1946\
  \ 年，我]将这个想法告诉了约翰·冯·诺曼（John von Neumann），我们开始计划实际计算。(²¹⁸)*\n```\n\n该技术在曼哈顿计划期间被用于预测核裂变反应期间会发生什么，但直到\
  \ 20 世纪 50 年代才真正兴起来，那时计算机变得更加普及且功能更强大。\n\n乌拉姆并不是第一个考虑使用概率工具来理解博弈游戏的数学家。概率的历史与赌博的历史紧密相连。正是不确定性的存在使得赌博成为可能。而赌博的存在促进了许多推论不确定性所需的数学的发展。对概率基础做出贡献者包括卡达诺（Cardano）、帕斯卡（Pascal）、伯努利（Bernoulli）和拉普拉斯（Laplace）。\n\
  \n## 16.1 帕斯卡的问题](#toc.xhtml_Rh1-55)\n\n概率的大早期工作围绕使用骰子的游戏。²¹⁹) 在 17 世纪中期，帕斯卡和费马（Fermat）这两个聪明人交换了多封信，讨论解决：\n\
  \n*   第一次掷出 6 的概率是 1/6，所以两个骰子掷出 6 的概率是 1/36。\n*   因此，第一次没有掷出 6 的概率是 1-1/6=35/6\n\
  *   因此，二十四次都没有掷出 6 的概率是(35/6)²⁴，接近 0.51，因此掷出 6 的概率是 1-(35/6)²⁴，约为 0.49。\n\n为了起见，让我们写一个小程序，图\
  \ 16.1，来模拟帕斯卡朋友的方法并确认我们得到了相同的答案。第一次运行时，调用`checkPascal(100000)`打印出：\n\n```\n胜利概率\
  \ = 0.490761\n```\n\n确实接近 1-(35/36)²⁴；在 Python shell 中输入`1-(35.0/36.0)**24`得到 0.49140387613090342。\n\
  \n![art](img/Art_P166.jpg)\n\n16.1 检查帕斯卡的分析\n\n## 16.2 正还是反？](#toc.xhtml_Rh1-56)\n\
  \n并不是所有关于游戏的问题都那么容易回答。在骰子游戏中，投骰者（掷骰子的人）选择下“正线”或“反正线”投注。\n\n*   正线：如果第一次掷出的是“大数”（7\
  \ 或 11），则获胜；如果是“骰子”（2、3 或 12），则输掉。如果掷出其他数字，该数字就成为“点”，投骰者继续掷。如果投骰者在掷出 7 之前中了点，则获胜。\n\
  *   反正线：如果第一次掷出的是 7 或 11，则输掉；如果是 2 或 3，则获胜；如果是 12，则平局（赌博术语中“push”）。如果掷出其他数字，该数字成为点，投骰者继续掷。如果投骰者在掷点之前掷出了\
  \ 7，则获胜。\n\n\n\n\n这些选项中是否有一个比另一个更好？其中哪一个是好的选择？虽然可以通过分析法推导出这些问题的答案，但编写一个程序来模拟骰子游戏似乎（至少对我们来说）更简单，并看看会发生什么。图\
  \ 16.2 包含了此类模拟的核心。\n\n![art](img/Art_P167.jpg)\n\n**图 16.2** `CrapsGame` `class`\n\
  \n`CrapsGame` 类实例的实例变量值记录了自游戏开始以来“过”（pass）线和“不过”（don’t pass）线的表现情况。观察者方法 `passResults`\
  \ 和 `dpResults` 返回这些值。`playHand` 方法模拟游戏的一个局次。当掷骰者“出场”（coming out）时，“回合”开始——这是骰子术语，指在确定点数（point）之前的投掷。当掷骰者赢得或输掉他的初始赌码时，回合结束。`playHand`\
  \ 中的大部分代码仅仅是对上述规则的算法描述。注意，在 `else` 子句中有一个循环，对应于确定点数后发生的情况。当掷出 7 或点数时，使用 `break`\
  \ 语句退出循环。\n\n图 16.3 包含一个使用 `CrapsGame` 类来模拟一系列骰子游戏的函数。\n\n![art](img/Art_P168.jpg)\n\
  \n**图 16.3 模拟骰子游戏**\n\n`crapsSim` 的结构是许多模拟程序的典型结构：\n\n1. 它运行多个游戏（将每个游戏类比于我们之前模拟中的多次试验）并累积结果。每个游戏包含多个回合，因此有一个嵌套循环。\n\
  2. 随后，它生成并存储每个游戏的统计数据。\n3. 最后，它生成并输出汇总统计数据。在这种情况下，它打印每种投注线的预期投资回报率（ROI）以及该 ROI 的标准差。\n\
  \n**投资回报率**由方程^(²²⁰)定义\n\n![art](img/Art_P169.jpg)\n\n由于“过”线和“不过”线的赔率是 1（如果你下注 $1\
  \ 并且赢了，你的收益是 $1），因此 ROI 为\n\n![art](img/Art_P170.jpg)\n\n例如，如果你进行了 100 次“过”线投注并赢了了一半，你的\
  \ ROI 将是\n\n![art](img/Art_P171.jpg)\n\n如果你对“不过”线下注了 100 次，有 25 次胜利和 5 次推送（push），ROI\
  \ 将是\n\n![art](img/Art_P172.jpg)\n\n让我们运行骰子游戏模拟，看看当我们尝试执行 `crapsSim(20, 10)` 时会发生什么：^(²²¹)\n\
  \n过：平均 ROI = -7.0% 标准差 = 23.6854%\n\n不过：平均 ROI = 4.0% 标准差 = 23.5372%\n\n看起来避开“过”线是一个好主意——因为其预期投资回报率是\
  \ 7% 的损失。但“不过”线看起来是一个相当不错的选择。真的如此吗？\n\n观察标准差，也许“不过”线终究并不是那么好的选择。回想一下，在正态分布的假设下，95%\
  \ 置信区间包含了均值两侧各 1.96 个标准差。对于“不过”线，95% 置信区间为 [4.0–1.96*23.5372, 4.0+1.96*23.5372]——大致为\
  \ [-43%, +51%]。这绝对并不意味着投注“不过”线是稳操之胜。\n\n是时候发挥大数定律了；`crapsSim(1000000, 10)` 打印\n\n\
  过：平均 ROI = -1.4204% 标准差 = 0.0614%\n\n不过：平均 ROI = -1.3571% 标准差 = 0.0593%\n\n我们现在可以相当安全地假设这两者中没有一个是好的选择^(²²²)看起来“不过”线可能好一点，但我们可能不能希望于此。如果“过”线和“不过”线的\
  \ 95% 置信区间没有重叠，就可以安全地假设均值差异具有统计学意义了^(²²³)然而它们重叠了，因此无法得出结论。\n\n假设我们不是增加每个游戏的回合数，而是增加游戏的次数，例如调用\
  \ `crapsSim(20, 1000000)`：\n\n过：平均 ROI = -1.4133% 标准差 = 22.3571%\n\n不过：平均 ROI =\
  \ -1.3649% 标准差 = 22.0446%\n\n标准差很高——表明 20 个回合的游戏是非常是不确定的。\n\n模拟的优点之一是它们让我们很容易进行“如果……”的实验。例如，如果玩家可以偷偷带入偏向\
  \ 5 的 2 呢（5 和 2 在骰子的对面上）？为了测试这一点，我们只需要将 `rollDie` 的实现替换为类似\n\n```python\ndef rollDie():\n\
  \    return random.choice([1,1,2,3,3,4,4,5,5,5,6,6])\n```\n\n骰子这种微小的变化使得几率发生了巨大的变化。运行\
  \ `crapsSim(1000000, 10)` 产生\n\n过：平均 ROI = 6.7385% 标准差 = 0.13%\n\n不过：平均 ROI = -9.5186%\
  \ 标准差 = 0.1226%\n\n难怪赌场要费很大精力确保玩家不在游戏中引入自己的骰子！\n\n## 16.3 使用查找表提高性能](#toc.xhtml_Rh1-57)\n\
  \n你可能不想在家里尝试 `crapsSim(100000000, 100)`。它需要很长时间才能完成。这引发了一个问题：是否存在简单的方法来加速模拟？\n\n\
  `crapsSim` 的复杂度是 O(`playHand`*handsGame*numGames)。`playHand` 的运行时间取决于循环执行的次数。在实践中，当然，我们有理由相信它总是终止。\n\
  \n## 16.4 求 π](#toc.xhtml_Rh1-58)\n\n很容易看出蒙特卡洛模拟在处理具有非确定性因素的问题时很有用。有趣的是，蒙特卡洛模拟（以及泛指随机算法）也可以用于解决本质上不是随机性的问题，即结果没有不确定性的问题。\n\
  \n\n\n考虑 `π`。几千年来，人们知道存在一个常数（自 18 世纪起称为 `π`），使得圆周长等于 `π`乘以*直径*，圆的面积等于 `π`乘以*半径²*。他们不知道这个常数的值。\n\
  \n最早的估算之一 —— `4*(8/9)² = 3.16` —— 可以在公元前 1650 年左右的埃及《林林德莎草纸》（*Rhind Papyrus*）中找到。一千年后，《旧约圣》在描述所罗门王的一项建筑工程的规格时，暗示了\
  \ `π` 的一个不同值：\n\n> *他造了一个熔铜海，从一边到另一边宽作十尺：四周是圆形的，高五尺：用一根三十尺长的绳把它的周绕了一圈。*^(²²⁴)\n\n\
  解出 `π`：`10π = 30`，因此 `π = 3`。也许是《圣经》错了，也许那个熔铜海不是完美的圆形，或者周长是从墙外测量的而直径是从墙内测量的，又或许只是诗意的修辞。我们留给读者去决定。\n\
  \n叙拉古的阿基米德（公元前 287-212 年）通过使用多边形近似圆形得出了 `π` 值的上界下界。通过使用 96 边形形，他得出 `223/71 < π <\
  \ 22/7`。在那个时代，给出上下界是一种相当精密的方法。此外，如果我们取他的最佳估值作为两个边界的平均值，我们得到 `3.1418`，误差约为 `0.0002`。很不错！\n\
  \n在计算机发明很久以前，法国数学家布丰纳（Buffon，1707-1788）和拉普拉斯（Laplace，1749-1827）就提出使用随机模拟来估算 `π`\
  \ 的值。^(²²⁵) 想象在一个边长为 2 的正方形内内一个圆，使得圆的半径 `r` 长度为 1。\n\n![art](img/Art_P174.jpg)\n\
  \n**图 16.5 正方形内的内接单位圆**\n\n根据 `π` 的定义，*面积* = `π`乘以*r²*。由于 `r` 是 1，所以 `π = 面积`。但圆的面积是多少？布丰纳建议可以通过向正方形附近落下大量的针（他认为这些针在掉落时会遵循随机路径）来估算圆的面积。尖端落在正方形内的针的数与尖端落在圆内的针的数之比，就可以用来估算圆的面积。\n\
  \n如果针的位置是真正的随机的，我们知道：\n\n![art](img/Art_P175.jpg)\n\n解出圆的面积：\n\n![art](img/Art_P176.jpg)\n\
  \n记得 2 比 2 正方形的面积是 4，所以：\n\n![art](img/Art_P177.jpg)\n\n一般情况下，要估算某个区域 `R` 的面积：\n\
  \n1. 选择一个包围区域 `E`，使得 `E` 的面积容易计算且 `R` 完全位于 `E` 内部。\n2. 选择一组位于 `E` 内部的随机点。\n3. 令\
  \ `F` 为落在 `R` 内部的点数比例。\n4. 将 `E` 的面积乘以 `F`。\n\n如果你尝试布丰纳的实验，很快就会发现针落下的位置并不是真正的随机。而且，即使你能随机地落下它们，也需要大量的针才能获得一个与《圣经》一样好的\
  \ `π` 近似值。幸运的是，计算机可以以极快的速度随机落下模拟针。\n\n图 16.6 包含一个使用布丰-拉普拉斯方法估算 `π` 的程序。为了简单起见，它只考虑落在正方形右上象的针。\n\
  \n`throwNeedles` 函数模拟落针的过程，它首先使用 `random.random` 获取一对正数笛卡尔坐标（`x` 和 `y` 值），代表针相对于正方形中心的位置。然后它利用勾股定理计算直底为\
  \ `x`、高为 `y` 的直角三角形的斜边。这是针尖到原点（正方形中心）的距离。由于圆的半径是 1，我们知道当且仅当到原点的距离不超过 1 时，针位于圆内。我们利用这一事实统计圆内针的数量。\n\
  \n`getEst` 函数通过 `throwNeedles` 寻找 `π` 的估值，首先落下 `numNeedles` 根针，然后对 `numTrials` 次试验的结果取平均值。然后它返回试验的均值和标准差。\n\
  \n`estPi` 函数以不断增加针的数量调用 `getEst`，直到 `getEst` 返回的标准差不大于 `precision/1.96`。在误差服从正态分布的假设下，这意味着\
  \ 95% 的值落在均值范围内 `precision` 的误差范围内。\n\n![art](img/Art_P178.jpg)\n\n**图 16.6 估算 π**\n\
  \n当我们运行 `estPi(0.01, 100)` 时，得到了：\n\n```\nEst. = 3.1484, Std. dev. = 0.0479, Needles\
  \ = 1000\nEst. = 3.1391, Std. dev. = 0.0355, Needles = 2000\nEst. = 3.1410, Std.\
  \ dev. = 0.0271, Needles = 4000\nEst. = 3.1443, Std. dev. = 0.0168, Needles = 8000\n\
  Est. = 3.1435, Std. dev. = 0.0137, Needles = 16000\nEst. = 3.1418, Std. dev. = 0.0084,\
  \ Needles = 32000\nEst. = 3.1417, Std. dev. = 0.0070, Needles = 64000\nEst. = 3.1419,\
  \ Std. dev. = 0.0040, Needles = 128000\n```\n\n正如预期的那样，随着样本数的增加，标准差单调递小。在开始，`π`\
  \ 的估值也在不断改进。有些高于真实值，有些低于真实值，但随着试验次数增加，估值变得比《圣经》和《林林德莎草纸》的结果更好。奇怪的是，当针的数量从 8000 增加到\
  \ 16000 时，估值反而变差了。然而，如果我们观察由标准差定义的范围，两个范围包含了真实值 `π`。尽管 16000 根针生成的估值距离 `π` 更远，但我们对它的准确性更有信心。这是一个非常重要的概念。产生一个好答案是不够的，我们必须有理由相信它确实是一个好答案。当我们落下足够的针时，小的标准差给了我们它是正确答案的理由。对吗？\n\
  \n不完全。标准差小是结果结果有效的必要条件，而不是充分条件。统计学有效的结论不应与正确的结论混淆。\n\n每项统计分析都基于一组假设。这里的关键假设是我们的模拟是现实的准确模型。记得我们布丰-拉普拉斯模拟的设计始于简单的代数，演示了如何利用面积之比找到\
  \ `π`。然后我们将这个想法转换成代码，这依赖于简单的几何学和 `random.random` 的随机性。\n\n让我们看看如果弄错了其中任何部分会发生什么。例如，假设我们把\
  \ `throwNeedles` 函数最后一行的 `4` 替换为 `2`，再次运行 `estPi(0.01, 100)`。这次它输出：\n\n```\nEst.\
  \ = 1.57422, Std. dev. = 0.02394, Needles = 1000\nEst. = 1.56959, Std. dev. = 0.01775,\
  \ Needles = 2000\nEst. = 1.57054, Std. dev. = 0.01356, Needles = 4000\nEst. = 1.57072,\
  \ Std. dev. = 0.0084, Needles = 8000\nEst. = 1.57068, Std. dev. = 0.00685, Needles\
  \ = 16000\nEst. = 1.57066, Std. dev. = 0.00424, Needles = 32000\n```\n\n\n\n\n仅需\
  \ 32,000 根针的标准差表明，我们对该估计值有相当大的把握。但这到底意味着什么呢？这意味着我们可以有理由地相信，如果我们从同一个分布中抽取更多样本，我们将得到一个相似的值。但它对于这个值是否接近\
  \ `π` 的真实值，它并没有提供任何说明。如果你在统计学中只想记住一件事，请记住这个：**统计学上有效的结论不应等同于正确的结论！**\n\n在相信模拟结果之前，我们既要确信我们的概念模型是正确的，也要确信我们正确地实现了该模型。只要可能，人们应该尝试根据现实来验证结果。在这种情况下，可以使用其他方法来计算圆面积的近似值（例如，物理测量），并检查计算出的\
  \ `π` 值至少在正确的范围内。\n\n## 16.5 关于模拟模型的一些结语\n\n在科学史的大部分时间里，理论学家使用数学技术来构建纯粹的分析模型，这些模型可以根据一组参数和初始条件来预测系统的行为。这导致了从微积分到概率论等重要数学工具的发展。这些工具帮助科学家对宏观物理世界建立了相当准确的理解。\n\
  \n随着 20 世纪的进展，这种方法的局限性变得愈发明显。原因包括：\n\n*   人们对社会科学（如经济学）兴趣的增加，导致他们渴望构建那些在数学上难以处理的系统的良好模型。\n\
  *   随着待建模系统变得越来越复杂，相继改进一系列模拟模型似乎比构建准确的分析模型更容易。\n*   从模拟模型中提取有用的中间结果通常比从分析模型中提取更容易，例如玩“如果……会怎样”的游戏。\n\
  *   计算机的出现使得运行大规模模拟成为可能。在 20 世纪中期现代计算机出现之前，模拟的效用受限于手动计算所需的时间。\n\n模拟模型是**描述性的**（descriptive），而不是**规定性的**（prescriptive）。它们告诉我们系统在给定的条件下是如何工作的；而不是如何安排条件以使系统运行得最好。模拟并不进行优化，它仅仅在进行描述。这并不是说模拟不能作为优化过程的一部分。例如，模拟经常被用寻找最佳参数设置搜索过程的一部分。\n\
  \n模拟模型可以沿着三个维度进行分类：\n\n*   确定性与随机性（Deterministic versus stochastic），\n*   静态与动态（Static\
  \ versus dynamic），\n*   离散与连续（Discrete versus continuous）。\n\n**确定性模拟**的行为完全由模型定义。重新运行模拟不会改变结果。当所建模的系统复杂到无法进行分析分析时，通常使用确定性模拟，例如处理器芯片的性能。**随机模拟**在模型中加入了随机因素。同一个模型的多次运行可能会产生不同的值。这种随机元素迫使我们生成许多结果，以观察可能性的范围。生成\
  \ 10 个、1000 个还是 100,000 个结果的问题，是一个统计学问题，正如之前讨论的那样。\n\n在**静态模型**中，时间没有起任何本质作用。本章用于估计\
  \ `π` 的落针模拟就是一个静态模拟的例子。在**动态模型**中，时间或某些模拟物起着至关作用。在第 14 章中模拟的一系列随机游走中，步数被用作时间的替代。\n\
  \n在**离散模型**中，相关变量的值是可枚举的，例如它们是整数。在**连续模型**中，相关变量的值跨越不可枚举的集合，例如实数。想象正在分析高速公路上的流量。我们可能会对每辆车进行建模，在这种情况下我们拥有一个离散模型。或者，我们可能会将流量视为一种流，流的变化可以用微分方程来描述。这导致了一个连续模型。在这个例子中，离散模型更接近物理状况（没有人开半辆车，尽管有些车的大小是其他车的一半），但在计算上比连续模型更复杂。在实践中，模型通常同时具有离散和连续部分。例如，人们可能会选择离散模型来模拟人体内的血流（即对单个细胞建模），并使用连续模型来模拟血压。\n\
