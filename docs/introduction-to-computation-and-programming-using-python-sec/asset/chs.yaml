  \ 美元。\n\n## PYTHON 3.5 快速参考手册 (#toc.xhtml_app-1)\n\n### 数值类型的常用操作\n\n`i+j` 是 `i`\
  \ 和 `j` 的和。\n\n`i–j` 是 `i` 减 `j`。\n\n`i*j` 是 `i` 和 `j` 的乘积。\n\n`i//j` 是整数除法。\n\n\
  `i/j` 是浮点数除法。\n\n`i%j` 是整数 `i` 除以整数 `j` 的余数。\n\n`i**j` 是 `i` 的 `j` 次方。\n\n`x +=\
  \ y` 等于 `x = x + y`。`*=` 和 `-=` 的工作方式相同。\n\n### 比较运算符和布尔运算符\n\n`x == y` 如果 `x` 和\
  \ `y` 相等，返回 True。\n\n`x != y` 如果 `x` 和 `y` 不相等，返回 True。\n\n`<, >, <=, >=` 具有它们的通常含义。\n\
  \n`a and b` 如果 `a` 和 `b` 都为 True，返回 True，否则返回 False。\n\n`a or b` 如果 `a` 或 `b` 至少有一个为\
  \ True，返回 True，否则返回 False。\n\n`not a` 如果 `a` 为 False，返回 True；如果 `a` 为 True，返回 False。\n\
  \n### 序列类型的常用操作\n\n`seq[i]` 返回序列中的第 $i$ 个元素。\n\n`len(seq)` 返回序列的长度。\n\n`seq1 + seq2`\
  \ 拼接两个序列。（范围类型不支持。）\n\n`n*seq` 返回一个重复 `seq` `n` 次的序列。（范围类型不支持。）\n\n`seq[start:end]`\
  \ 返回序列的切片。\n\n`e in seq` 测试 `e` 是否包含在序列中。\n\n`e not in seq` 测试 `e` 是否不包含在序列中。\n\n\
  `for e in seq` 遍历序列的元素。\n\n### 常用字符串方法\n\n`s.count(s1)` 统计字符串 `s1` 在 `s` 中出现的次数。\n\
  \n`s.find(s1)` 返回子字符串 `s1` 在 `s` 中第一次出现的索引；如果 `s1` 不在 `s` 中，返回 -1。\n\n`s.rfind(s1)`\
  \ 与 `find` 相同，但从 `s` 的末尾开始。\n\n`s.index(s1)` 与 `find` 相同，但如果 `s1` 不在 `s` 中，则抛出异常。\n\
  \n`s.rindex(s1)` 与 `index` 相同，但从 `s` 的末尾开始。\n\n`s.lower()` 将所有大写字母转换为小写。\n\n`s.replace(old,\
  \ new)` 将字符串 `old` 的所有出现处替换为字符串 `new`。\n\n`s.rstrip()` 移除结尾的空格。\n\n`s.split(d)`\
  \ 使用 `d` 分割 `s`。\n\n### 列表方法\n\n`L.append(e)` 将 `e` 添加到 `L` 的末尾。\n\n`L.count(e)`\
  \ 统计 `e` 在 `L` 中出现的次数。\n\n`L.insert(i, e)` 将 `e` 插入 `L` 的第 `i` 个位置。\n\n`L.extend(L1)`\
  \ 将 `L1` 中的元素添加到 `L` 的末尾。\n\n`L.remove(e)` 从 `L` 中删除第一个 `e`。\n\n`L.index(e)` 返回\
  \ `e` 在 `L` 中的索引。如果 `e` 不在 `L` 中，则抛出 `ValueError`。\n\n`L.pop(i)` 删除并返回索引 `i` 元素；如果\
  \ `L` 为空，则返回异常。\n\n`L.sort()` 对 `L` 进行排序。\n\n`L.reverse()` 反转 `L` 的顺序。\n\n### 字典的常用操作\n\
  \n`len(d)` 返回 `d` 的元素个数。\n\n`d.keys()` 返回 `d` 的键的视图。\n\n`d.values()` 返回 `d` 的值的视图。\n\
  \n`k in d` 如果 `k` 在 `d` 中，则返回 True。\n\n`d[k]` 返回 `k` 对应的值。如果 `k` 不在 `d` 中，则抛出 `KeyError`。\n\
  \n`d.get(k, v)` 如果 `k` 在 `d` 中，返回其值；否则返回 `v`。\n\n`d[k] = v` 将 `v` 关联到键 `k`。如果 `k`\
  \ 已在 `d` 中，则替换该值。\n\n`del d[k]` 删除键 `k`。\n\n`for k in d` 遍历 `d` 的键。\n\n### 常用输入输出\n\
  \n`input(msg)` 打印 `msg` 并返回输入的字符串。\n\n`print(s1, ..., sn)` 打印 `s1, ..., sn`，用空格分隔。\n\
  \n`open(fileName, 'w')` 创建一个用于写入的文件。\n\n`open(fileName, 'r')` 以读取模式打开现有文件。\n\n`open(fileName,\
  \ 'a')` 以追加模式打开现有文件。\n\n`fileHandle.read()` 读取文件内容。\n\n`fileHandle.readline()` 返回下一行。\n\
  \n`fileHandle.readlines()` 返回所有行的列表。\n\n`fileHandle.write(s)` 将字符串 `s` 写入文件。\n\n\
  `fileHandle.writelines(L)` 将 `L` 中的每个元素写入文件。\n\n`fileHandle.close()` 关闭文件。\n\n##\
