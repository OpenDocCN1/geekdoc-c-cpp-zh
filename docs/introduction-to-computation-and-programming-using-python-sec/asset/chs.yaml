  \n牛顿力学中有一种非常让人心安心的东西。你向下压杠杆的一端，另一端就会上升。你向空中抛出一个球；它会沿着抛物线轨迹运行，最终落回。![art](img/Art_P116.jpg)。简而言之，一切发生皆有原因。物理世界是一个完全可预测的地方——物理系统所有的未来状态都可以根据对其当前状态的认知推导出来。\n\
  \n几个世纪以来，这是主流的科学智慧；随后量子力学和哥本哈学体系随之而来。以波尔和海森堡为首的该学说的支持者认为，在最基础的层面，物理世界的行为是不可预测的。人们可以做出“x\
  \ 极有可能发生”这类形式的概率陈述，但不能做出“x 一定会发生”形式的陈述。其他杰出的物理学家，尤其是爱因斯坦和薛定谔，对此表示强烈反对。\n\n这场辩论震动了物理、哲学乃至宗教的世界。辩论的核心是`因果非确定性`（`causal\
  \ nondeterminism`）的有效性，即认为每个事件都是由之前的事件引起的。爱因斯坦和薛定谔认为这种观点在哲学上是不可接受的，爱因斯坦经常重复的评论“上帝不掷骰子”就是一个例子。他们能够接受的是`预测非确定性`（`predictive\
  \ nondeterminism`），即由于我们无法对物理世界进行精确测量，导致我们无法对未来状态做出精确预测。爱因斯坦很好地总结了这一区别，他说：“当代理论本质上的统计特性，完全归因于该理论在对物理系统描述不完整的情况下运行。”\n\
  \n因果非确定性的问题仍然没有没有定论。然而，我们无法预测事件是因为它们真的不可预测，还是因为我们仅仅没有足够的信息来预测它们，这在实践上并没有意义。\n\n\
  虽然波尔/爱因斯坦的辩论是关于如何理解物理世界的底层，但相同的问题在宏观层面也会出现。也许马赛的结果、轮盘的旋转和股票投资的结果是因果决定论的。然而，有充分证据表明，将它们视为预测决定论是有危险的。(¹⁸⁹)\n\
  \n## 15.1 随机程序](#toc.xhtml_Rh1-49)\n\n如果一个程序每次在相同的输入运行时都会产生相同的输出，那么它就是`确定性的`（`deterministic`）。注意，这不等同于说输出完全由问题的规范定义。例如，考虑\
  \ `squareRoot` 的规范：\n\n```python\ndef squareRoot(x, epsilon):\n    \"\"\"假设 x 和\
  \ epsilon 为 float 类型；x >= 0 且 epsilon > 0\n    返回 float 类型 y，使得 x-epsilon <= y*y\
  \ <= x+epsilon\"\"\"\n```\n\n该规范允许函数调用 `squareRoot(2, 0.001)` 有许多可能的返回值。然而，我们在第\
  \ 3 章中看到的连续渐近算法将始终返回相同的值。规范并不要求实现必须是确定性的，但它确实允许确定性的实现。\n\n并不是所有有趣的规范都能通过确定性实现来实现。例如，实现一个玩骰子游戏的程序。在程序的某处可能有一个模拟单次掷骰子的函数。(¹⁹⁰)假设它的规范如下：\n\
  \n```python\ndef rollDie():\n    \"\"\"返回 1 到 6 之间的整数\"\"\"\n```\n\n这将是一个问题，因为它允许实现在每次调用时返回同一个数字，这会让游戏变得非常无聊。更好的做法是指定\
  \ rollDie “随机选择一个 1 到 6 之间的整数”，从而要求随机性的实现。\n\n大多数编程语言（包括 Python）都包含编写随机程序的简单方法，即利用随机性的程序。图\
  \ 15.1)\n\n![art](img/Art_P117.jpg)\n\n**图 15.1 掷骰子**\n\n现在，想象运行 `rollN(10)`。看到它打印出\
  \ 1111111111 还是 5442462412 会让你更惊讶？换句话说，这两个序列哪个更随机？这是一个陷阱问题。这两个序列出现的概率是相等，因为每次掷骰子的值与之前掷骰的值无关。在随机过程中，如果两个事件是`独立的`（`independent`），则其中一个事件的结果对另一个事件的结果没有影响。\n\
  \n\n\n\n如果我们通过将情况简化为考虑一个值为 0 和 1 的双面骰子（也称为硬币），这样会更容易理解。这让我们可以将 `rollN` 输出的输出视为一个二进制数。当我们使用二进制骰子时，`testN`\
  \ 可能会返回 $2^n$ 种可能的序列。这些序列出现的概率均相等；因此，每种序列出现的概率均为 $(1/2)^n$。\n\n让我们回到六面骰子。长度为 10\
  \ 的不同序列有多少种？$6^{(10)}$。因此，连续掷出十个 1 的概率是 $1/6^{(10)}$。这少于六千万分之一。概率相当低，但并不低于任何其他序列的概率，例如\
  \ `5442462412`。\n\n## 15.2 计算简单概率 (#toc.xhtml_Rh1-50)\n\n通常情况下，当我们谈论结果具有某种属性（例如全为\
  \ 1）的`probability` 时，我们是在问所有可能的结果中具有该属性的结果占几几。这就是为什么概率的范围是从 0 到 1。假设我们想知道掷骰子时得到除全\
  \ 1 之外任何序列的概率。这简单是 $1 – (1/6^{(10)})$，因为某事发生的概率和同一件事不发生的概率之和等于 1。\n\n假设我们想知道掷骰子十次都没有得到一个\
  \ 1 的概率。回答这个问题的方法之一将其转化为：在 $6^{(10)}$ 种可能的序列中，有多少个不包含 1。这可以通过以下方式计算：\n\n1. 单次掷中不掷出\
  \ 1 的概率是 $5/6$。\n2. 在第一次或第二次掷中都没有掷出 1 的概率是 $(5/6)(5/6)$，或 $(5/6)²$。\n3. 因此，连续十次不掷出\
  \ 1 的概率是 $(5/6)^{(10)}$，略大于 0.16。\n\n步骤 2 是独立概率`multiplicative law`（乘法法则）的应用。例如，考虑两个独立事件\
  \ `A` 和 `B`。如果 `A` 发生的概率是 $1/3$，`B` 发生的概率是 $1/4$，那么 `A` 和 `B` 同时发生的概率就是 $1/3$ 的\
  \ $1/4$，即 $(1/3)/4$ 或 $(1/3)*(1/4)$。\n\n那么至少掷出一个 1 的概率又是怎样的呢？它简单来说就是 1 减去没有掷出至少一个\
  \ 1 的概率，即 $1 - (5/6)^{(10)}$。注意，不能通过说任何一次掷掷出 1 的概率是 $1/6$，因此掷出至少一个 1 的概率是 $10(1/6)$，即\
  \ $10/6$。这显然是错误的，因为概率不能大于 1。\n\n十次中恰好掷出两个 1 的概率又是怎样的？这等于问在前 $6^{(10)}$ 个整数中，有多少整数的六进制表示法中恰好有两个\
  \ 1。我们可以轻松地编写程序来生成所有这些序列，并统计恰好包含一个 1 的数量。通过分析法推导概率有点复杂，我们将其推迟到 第 15.4.4 节。\n\n##\
  \ 15.3 推断统计学 (#toc.xhtml_Rh1-51)\n\n正如我们刚刚看到的，可以使用系统的过程，根据对一个或多个简单事件概率的了解，推导出某些复杂事件的精确概率。例如，基于掷掷是独立的且我们知道每次掷出正面的概率的假设，可以轻松地计算掷硬币连续出现十次正面的概率。然而，假设我们实际上不知道相关简单事件的概率。例如，假设我们不知道硬币是否均匀（即正面和反面概率相等的硬币）。\n\
  \n一切并非不可回。如果我们有一些关于硬币行为的数据，可以将这些数据与我们的概率知识结合起来，得出对真实概率的估计。我们可以使用`inferential statistics`（推断统计学）来估计单次掷出正面的概率，然后使用传统的概率计算具有该行为的硬币连续十次掷正面的概率。\n\
  \n简之（因为这不是一本关于统计学的书），推断统计学的指导原则是随机样本倾向于表现出与其提取的总体相同的属性。\n\n假设哈维·丹特（也被称为双脸）掷了一枚硬币，结果是正面。你不会据此推断下一次掷也是正面。假设他掷了两次，两次都是正面。你可能会推断，对于均匀硬币来说，这种情况发生的概率是\
  \ 0.25，所以还没有理由假设下一次是正面。然而，假设 100 次掷中有 100 次都是正面。$(1/2)^{(100)}$（假设硬币均匀时该事件的概率）是一个非常小的数字，因此你可能会放心地推断这枚硬币两面都是正面。\n\
  \n你对硬币是否均匀的信念基于一种直觉：100 次掷掷单样本的行为与与其提取的总体行为是相似的。\n\n\n\n人们经常将“赌徒谬误”与“均值回归”混淆。`均值回归`^(¹⁹⁴)\
  \ 指的是在极端随机事件发生后，下一次随机事件可能不会那么极端。如果你投掷一枚公平的硬币六次并得到六次正面，均值回归意味着下一次六次投掷的结果可能更接近三个正面的预期值。它并不像赌徒谬误所暗示的那样，下一次六次投掷的正面次数可能少于反面。\n\
  \n大多数事业的成功都需要技能和运气的结合。技能部分决定了均值，而运气部分解释了变异性。运气的随机性导致了均值回归。\n\n图 15.3 中的代码生成了一张图表，图\
  \ 15.4，展示了均值回归。`regressToMean` 函数首先生成 `numTrials` 次实验，每次包含 `numFlips` 次硬币投掷。然后，它识别出所有正面比例小于\
  \ 1/3 或大于 2/3 的实验，并将这些极值以圆圈的形式绘制。然后，对于这些点中的每一个，它将后续实验的值以三角形的形式绘制在与圆圈相同的列中。\n\n位于\
  \ 0.5 处的水平线是预期均值，使用 `axhline` 函数创建。`pylab.xlim` 函数控制 x 轴的范围。函数调用 `pylab.xlim(xmin,\
  \ xmax)` 设置当前图形 x 轴的最小值和最大值。函数调用 `pylab.xlim()` 返回一个由当前图形 x 轴最小值和最大值组成的元组。`pylab.ylim`\
  \ 函数的功能相同。\n\n![art](img/Art_P119.jpg)\n\n**图 15.3: 均值回归**\n\n注意，虽然极端结果之后的实验通常会是一个比该极端结果更接近均值的实验，但并非总是如此——正如框出的点对所示。\n\
  \n![art](img/Art_P120.jpg)\n\n**图 15.4: 均值回归的插图**\n\n**手指练习：** Sally 在打高尔夫球时，每个洞平均击\
  \ 5 杆。一天，她完成前九个洞用了 40 杆。她的伙伴推测她可能会回归均值，接下来的九个洞将花费 50 杆。你同意她伙伴的观点吗？\n\n图 15.5 包含一个函数\
  \ `flipPlot`，它可以生成两张图表，图 15.6，旨在展示大数定律的作用。第一张图显示了正面次数与反面次数差的绝对值如何随投掷次数而变化。第二张图比较了正面比例与投掷次数的关系。底部的\
  \ `random.seed(0)` 行确保 `random.random` 使用的伪随机数生成器每次执行此代码时都会生成相同的伪随机数序列^(¹⁹⁵)。这对调试非常方便。可以传入任何数字调用\
  \ `random.seed`。如果不带参数调用，则将随机选择种子。\n\n![art](img/Art_P121.jpg)\n\n**图 15.5 绘制硬币投掷结果**\n\
  \n左侧的图表似乎表明正面次数与反面次数之间的绝对差在开始时波动，然后向下崩溃，最后迅速上升。然而，我们需要记住，在 `x = 300,000` 右侧我们只有两个数据点。`pylab.plot`\
  \ 用线条连接这些点可能会误导我们，让我们看到某种趋势，而实际上我们拥有的孤立的点。这并非罕见现象，因此在对图表的意义跳到任何结论之前，你应该始终询问图表实际上包含多少个点。\n\
  \n在右侧的图中很难看出任何东西，它大部分是一条直线。这同样具有欺骗性。尽管有十六个数据点，但它们中的大多数都挤在图表左侧的一小部分区域内，导致无法看到细节。这是因为绘制的点的\
  \ `x` 值为 `2⁴`、`2⁵`、`2⁶`……到 `2²⁰`，因此 x 轴上的值范围从 16 到百万多，除非另有说明，否则 PyLab 将根据这些点相对于原点的相对距离来放置它们。这被称为`线性缩放`。因为大多数点的\
  \ `x` 值相对于 `2²⁰` 来说很小，它们看起来离原点较近。\n\n![art](img/Art_P122.jpg)\n\n**图 15.6 大数定律的作用**\n\
  \n幸运的是，这些可视化问题在 PyLab 中很容易解决。正如我们在第 11 章以及本章前面的部分看到的，我们可以轻松地指示程序绘制不连接的点，例如通过编写 `pylab.plot(xAxis,\
  \ diffs, 'ko')`。\n\n图 15.7 中的两张图表在 x 轴上使用了对数刻度。由于 `flipPlot` 生成的 `x` 值为 `2^(minExp)`、`2^(minExp+1)`……`2^(maxExp)`，使用对数\
  \ x 轴会导致点沿轴均匀分布。图 15.7 左侧的图表在 y 轴上也使用了对数刻度。该图上的 `y` 值范围从接近 0 到 550。另一方面，在右侧的图中，y\
  \ 值紧密聚集，因此我们使用线性 y 轴。\n\n![art](img/Art_P123.jpg)\n\n**图 15.7 投掷次数的影响**\n\n**手指练习：**\
  \ 修改图 15.5 中的代码，使其产生像图 15.7 所示那样的图表。\n\n这些图表比早些的图表更容易解释。右侧的图表非常有力地表明，随着投掷次数的增加，正面与反面的比例收敛于\
  \ 1.0。左侧图表的意义没那么清晰。看起来绝对差随投掷次数的增加而增大，但这并不完全令人信服。\n\n如果没有整个总体，通过采样是不可能实现完美的完美的。无论我们检查多少样本，在检查每一个元素之前，我们无法确定样本集是典型的（由于我们通常处理的是无限总体，例如所有可能的硬币投掷序列，这通常是不可能的）。当然，这并不意味着估计可能是精确错误的。我们可能会投掷两次硬币，得到一个正面和一个反面，然后得出每个概率为\
  \ 0.5 的结论。我们得到了正确的结论，但我们的推理是错误的。\n\n我们需要查看多少样本才能对我们的答案有合理的信心？这取决于底层分布的`方差`。通俗来说，方差衡量了可能结果的离散程度。更正式地说，一组值集合\
  \ `X` 的方差定义为：\n\n```\nσ² = 1/|X| * sum((x - μ)²)\n```\n其中 `|X|` 是集合的大小，`μ` 是它的均值。\n\
  \n\n\n一组数值的`standard deviation`（标准差）是方差的平方根。它包含了与方差完全相同，但标准差更容易解释，因为它与原始数据的单位相同。例如，理解“人群的平均身高为\
  \ 70 英寸，标准差为 4 英寸”比理解“人群的平均身高为 70 英寸，方差为 16 英方厘米”要容易。\n\nFigure 15.8 包含了方差和标准差的实现。(¹⁹⁶)\n\
  \n![art](img/Art_P125.jpg)\n\n**图 15.8 方差与标准差**\n\n我们可以利用标准差的概念来思考我们观察的样本数量与我们计算出的答案应该有多大信心之间的关系。Figure\
  \ 15.9 包含了`flipPlot`的修改版本。它使用图中顶部定义的辅助函数对每种硬币掷次数进行多次试验，然后绘制`abs(heads - tails)`的平均值和`heads/tails\
  \ ratio`（正反面比例）。它还绘制了每个者的标准差。辅助函数`makePlot`包含了用于生成图表的代码。函数`runTrial`模拟了一次掷`numFlips`次硬币的试验。\n\
  \n![art](img/Art_P126.jpg)\n\n**图 15.9 掷币模拟**\n\n让我们尝试`flipPlot1(4, 20, 20)`。它生成\
  \ Figure 15.10 中的图表。\n\n![art](img/Art_P127.jpg)\n\n**图 15.10 正反面比例的收敛**\n\n这是令人鼓舞的。平均正反比例正向\
  \ 1 收敛，标准差的对数随每次试验掷掷数的对数线性下降。当我们达到每次大约 10⁶ 次掷硬币时，标准差（约 10^(-3））比平均值（约 1）小大约三个数量级，这表明试验之间的方差很小。因此，我们可以非常有把握认为预期的正反比例非常接近\
  \ 1.0。随着我们掷更多的硬币，我们不仅得到了更精确的答案，更重要的是，我们更有理由确信它接近正确答案。\n\n正面和反面数量之间的绝对差如何？我们可以通过在`flipPlot1`末尾添加\
  \ Figure 15.11 中的代码来查看。这生成了 Figure 15.12 中的图表。\n\n![art](img/Art_P128.jpg)\n\n**图\
  \ 15.11 绝对差**\n\n![art](img/Art_P129.jpg)\n\n**图 15.12 正减反的平均值与标准差**\n\n正如预期的，正反面数量之间的绝对差随着掷次数的增加而增大。此外，由于我们对试验结果进行了平均处理，该图表比我们在\
  \ Figure 15.7 中绘制单次试验的图表平滑得多。但 Figure 15.12 中的标准差是怎么回事？这是否意味着随着掷次数的增加，我们对预期正反比例的信心应该减少而不是增加？\n\
  \n不，不是这样的。标准差应该始终在平均值的背景下来看。如果平均值接近 0，平均值的微小变化会导致变异系数发生巨大（但不一定有意义）的变化，当平均值为 0 时，变异系数是未定义的。\n\
  \n`coefficient of variation`（变异系数）是标准差除以平均值。在比较具有不同平均值的集合时，变异系数通常比标准差包含更多信息。正如你在\
  \ Figure 15.13 所示，当平均值为 0 时，它是未定义的。\n\n![art](img/Art_P130.jpg)\n\n**图 15.13 变异系数**\n\
  \n在 Figure 15.14 中，变异系数似乎稳定在 0.74-0.78 附近。通常，变异系数小于 1 的分布被认为是低方差的。\n\n变异相对于标准差的主要优势是它允许我们比较不同平均值集合的离散程度。例如，考虑\
  \ Figure 15.17 所示的不同地区的每周收入分布。\n\n![art](img/Art_P134.jpg)\n\n**图 15.17 收入分布**\n\
  \n如果我们使用标准差作为收入不平等的衡量，塔斯马尼亚（Tasmania）的收入不平等似乎比 ACT（澳大利亚首都地区）少得多。然而，如果我们观察变异系数（ACT\
  \ 约为 0.32，塔斯马尼亚约为 0.42），我们会得出完全不同的结论。\n\n这并不是说变异系数总是比标准差更有用。如果平均值接近 0，平均值的微小变化会导致变异系数发生巨大（但不一定有意义）的变化，当平均值为\
  \ 0 时，变异系数是未定义的。正如我们在 Section 15.4.2 中所看到的，标准差可以用于构建置信区间，但变异系数不行。\n\n\n\n\n\n函数调用\
  \ `pylab.hist(vals, bins = 10)` 会生成一个具有十个箱的直方图。PyLab 会根据箱的数量和数值的范围自动选择每个箱的宽度。观察代码，我们知道\
  \ `vals` 中可能出现的最小数字是 0，最大的数字是 200。因此，x 轴上的可能值范围从 0 到 200。每个箱子代表 x 轴上相等比例的值，因此第一个箱子将包含\
  \ 0-19 的元素，下一个箱子包含 20-39 的元素，以此此类推。\n\n**手指练习**：在图 15.18 中，为什么直方图中间的箱子比边缘的箱子高？提示：思考一下为什么\
