    of the array, which is calculated by multiplying the size of each element in the
    array by the number of elements. For example, if you have an array of integers
    with 10 elements, and each integer takes 4 bytes of memory, the sizeof operator
    would return 40 (10 elements * 4 bytes per element).


    Here’s an example that demonstrates the usage of sizeof with an array:


    #include <iostream>


    int main() {


        int numbers[] = {1, 2, 3, 4, 5};


        int size = sizeof(numbers) / sizeof(numbers[0]);


        std::cout << "Size of the array: " << size << std::endl;


        std::cout << "Size of each element: " << sizeof(numbers[0]) << " bytes" <<
    std::endl;


        std::cout << "Total size of the array: " << sizeof(numbers) << " bytes" <<
    std::endl;


        return 0;


    }


    In this example, sizeof(numbers) gives you the total size of the numbers array,
    while sizeof(numbers[0]) gives you the size of each element in the array. By dividing
    the total size by the size of each element, you can determine the number of elements
    in the array.


    Note that the sizeof operator determines the size of the array at compile-time,
    so it won’t give you the number of elements in a dynamically allocated array or
    an array passed as a function argument (unless it’s a reference or a pointer).
    In those cases, you would need to track the size separately.


    # 5


    # Array Modification


    Here’s an example of a C++ program that modifies the elements of an array:


    #include <iostream>


    int main() {


        const int SIZE = 5;


        int numbers[SIZE];


        // Initialize the array with some values


        for (int i = 0; i < SIZE; i++) {


            numbers[i] = i + 1;


        }


        // Print the original array


        std::cout << "Original array: ";


        for (int i = 0; i < SIZE; i++) {


            std::cout << numbers[i] << " ";


        }


        std::cout << std::endl;


        // Modify individual elements of the array


        numbers[0] = 10;


        numbers[2] = 20;


        numbers[4] = 30;


        // Print the modified array


        std::cout << "Modified array: ";


        for (int i = 0; i < SIZE; i++) {


            std::cout << numbers[i] << " ";


        }


        std::cout << std::endl;


        return 0;


    }


    In this program, we declare an array numbers of size SIZE (which is set to 5 in
    this example). We then use a loop to assign initial values to the elements of
    the array. In this case, we assign values 1 to SIZE to the array elements.


    To assign new values to individual elements of the array, we use the array index
    notation. For example, numbers[0] = 10; assigns the value 10 to the first element
    of the array, numbers[2] = 20; assigns 20 to the third element, and numbers[4]
    = 30; assigns 30 to the fifth element.


    Finally, we use another loop to print the elements of the array before and after
    the modifications to verify the changes.


    When modifying arrays, it’s important to ensure that the index used to access
    the array elements is within the bounds of the array. Otherwise, it can lead to
    undefined behavior or runtime errors.


    # 6


    # Array Traversal


    Array traversal refers to the process of accessing each element in an array and
    performing some operation on it. In C++, array traversal is typically done using
    loops, such as the “for” or “while” loop.


    Here’s an example program that demonstrates array traversal using a “for” loop:


    #include <iostream>


    int main() {


        int arr[] = {1, 2, 3, 4, 5};  // Example array


        // Traversing the array using a for loop


        for (int i = 0; i < sizeof(arr) / sizeof(arr[0]); i++) {


            // Perform operation on each element


            std::cout << arr[i] << " ";  // Print the element


        }


        return 0;


    }


    In this program, we have an integer array arr containing some elements. The sizeof(arr)
    / sizeof(arr[0]) expression calculates the length of the array. We use a “for”
    loop to iterate over the array, starting from index 0 and continuing until the
    index reaches the length of the array minus 1.


    Within the loop, you can perform any desired operation on each element. In the
    given example, we simply print each element using std::cout. You can replace this
    line with any other operation or calculation you want to perform on the elements
    of the array.


    The loop will iterate through each element of the array, performing the specified
    operation on each one. This way, you can process each element individually without
    having to write repetitive code for each element separately.


    Array traversal is a fundamental concept in programming and is widely used for
    various tasks, such as searching, sorting, filtering, or modifying array elements.


    # 7


    # Sorting


    The Bubble Sort algorithm works by repeatedly swapping adjacent elements if they
    are in the wrong order. This process continues until the entire array is sorted.
    Here’s an example implementation:


    #include <iostream>


    using namespace std;


    // Function to swap two elements


    void swap(int& a, int& b) {


        int temp = a;


        a = b;


        b = temp;


    }


    // Function to perform bubble sort


    void bubbleSort(int arr[], int size) {


        for (int i = 0; i < size - 1; ++i) {


            // Last i elements are already in place


            for (int j = 0; j < size - i - 1; ++j) {


                // Swap if the current element is greater than the next element


                if (arr[j] > arr[j + 1]) {


                    swap(arr[j], arr[j + 1]);


                }


            }


        }


    }


    // Function to print the array


    void printArray(int arr[], int size) {


        for (int i = 0; i < size; ++i) {


            cout << arr[i] << " ";


        }


        cout << endl;


    }


