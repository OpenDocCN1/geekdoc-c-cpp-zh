    # 83


    # Array Target Sum


    To find all pairs of elements in an array that add up to a given target sum, you
    can use either the hashing technique or the two-pointer approach. Let me explain
    both methods to you:


    Hashing Approach:


    *   Create an empty hash table (unordered_set or unordered_map) to store elements
    as you traverse the array.


    *   Iterate through the array:


    *   For each element num in the array:


    *   Calculate the complement as targetSum - num.


    *   Check if the complement exists in the hash table.


    *   If it does, you have found a pair (num, complement) that adds up to the target
    sum.


    *   If it doesn’t, insert num into the hash table for future lookups.


    *   Repeat the above steps until you traverse the entire array.


    *   The pairs found during the process will be the pairs that add up to the target
    sum.


    Here’s a C++ implementation of the hashing approach:


    #include <iostream>


    #include <unordered_set>


    #include <vector>


    void findPairsWithTargetSum(const std::vector<int>& arr, int targetSum) {


        std::unordered_set<int> hashSet;


        std::vector<std::pair<int, int>> pairs;


        for (int num : arr) {


            int complement = targetSum - num;


            if (hashSet.find(complement) != hashSet.end()) {


                pairs.emplace_back(num, complement);


            }


            hashSet.insert(num);


        }


        // Print the pairs


        for (const auto& pair : pairs) {


            std::cout << pair.first << ", " << pair.second << std::endl;


        }


    }


    int main() {


        std::vector<int> arr = {1, 2, 3, 4, 5, 6};


        int targetSum = 7;


        findPairsWithTargetSum(arr, targetSum);


        return 0;


    }


    Two-Pointer Approach:


    *   Sort the array in non-decreasing order.


    *   Initialize two pointers, left and right, pointing to the start and end of
    the array, respectively.


    *   While left is less than right:


    *   Calculate the sum of the elements at left and right.


    *   If the sum is equal to the target sum, you have found a pair.


    *   If the sum is less than the target sum, move the left pointer to the right
    (increasing the sum).


    *   If the sum is greater than the target sum, move the right pointer to the left
    (decreasing the sum).


    *   Repeat the above steps until the pointers cross each other.


    *   The pairs found during the process will be the pairs that add up to the target
    sum.


    Here’s a C++ implementation of the two-pointer approach:


    #include <iostream>


    #include <algorithm>


    #include <vector>


    void findPairsWithTargetSum(const std::vector<int>& arr, int targetSum) {


        std::vector<std::pair<int, int>> pairs;


        int left = 0;


        int right = arr.size() - 1;


        // Sort the array


        std::vector<int> sortedArr = arr;


        std::sort(sortedArr.begin(), sortedArr.end());


        while (left < right) {


            int sum = sortedArr[left] + sortedArr[right];


            if (sum == targetSum) {


                pairs.emplace_back(sortedArr[left], sortedArr[right]);


                left++;


                right--;


            } else if (sum < targetSum) {


                left++;


            } else {


                right--;


            }


        }


        // Print the pairs


        for (const auto& pair : pairs) {


            std::cout << pair.first << ", " << pair.second << std::endl;


        }


    }


    int main() {


        std::vector<int> arr = {6, 4, 5, 3, 2, 1};


        int targetSum = 7;


        findPairsWithTargetSum(arr, targetSum);


        return 0;


    }


    Both approaches have a time complexity of O(n) since they traverse the array only
    once. However, the hashing approach may have some additional space complexity
    due to the hash table used to store elements.


    Feel free to choose the approach that suits your needs and integrate it into your
    program accordingly.


