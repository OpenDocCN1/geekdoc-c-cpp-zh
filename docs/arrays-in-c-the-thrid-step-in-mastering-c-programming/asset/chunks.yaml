    1.  Partitioning Algorithm Approach (Quickselect):


    *   Initialize the array with the given elements.


    *   Apply the Quickselect algorithm to partition the array around a pivot element.


    *   By choosing an appropriate pivot, you can efficiently find the Kth smallest
    element without fully sorting the entire array.


    *   If the pivot index is equal to (K – 1), return the pivot element.


    *   Otherwise, recursively apply the Quickselect algorithm on either the left
    or right partition depending on the pivot index and K value.


    Here’s an example implementation using the partitioning approach:


    #include <iostream>


    #include <algorithm>


    int partition(int arr[], int low, int high) {


        int pivot = arr[high];


        int i = low - 1;


        for (int j = low; j < high; j++) {


            if (arr[j] <= pivot) {


                i++;


                std::swap(arr[i], arr[j]);


            }


        }


        std::swap(arr[i + 1], arr[high]);


        return i + 1;


    }


    int quickselect(int arr[], int low, int high, int k) {


        if (low < high) {


            int pivotIndex = partition(arr, low, high);


            if (pivotIndex == k - 1)


                return arr[pivotIndex];


            else if (pivotIndex > k - 1)


                return quickselect(arr, low, pivotIndex - 1, k);


            else


                return quickselect(arr, pivotIndex + 1, high, k);


        }


        return arr[low];


    }


    int findKthSmallest(int arr[], int size, int k) {


        return quickselect(arr, 0, size - 1, k);


    }


    int main() {


        int arr[] = {10, 2, 8, 4, 6, 5};


        int size = sizeof(arr) / sizeof(arr[0]);


        int k = 3;


        int kthSmallest = findKthSmallest(arr, size, k);


        std::cout << "The " << k << "th smallest element is: " << kthSmallest << std::endl;


        return 0;


    }


    In this example, we have the same array arr as before. We again want to find the
