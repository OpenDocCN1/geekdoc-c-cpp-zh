    # 15


    # Array Maximum


    Here’s a C++ program that finds the maximum element in an array:


    #include <iostream>


    int findMaximum(int arr[], int size) {


        int max = arr[0];  // Assume the first element as the maximum


        // Iterate through the array starting from the second element


        for (int i = 1; i < size; i++) {


            if (arr[i] > max) {


                max = arr[i];  // Update max if a larger element is found


            }


        }


        return max;


    }


    int main() {


        int arr[] = {5, 2, 9, 1, 7};


        int size = sizeof(arr) / sizeof(arr[0]);


        int maximum = findMaximum(arr, size);


        std::cout << "Maximum element in the array: " << maximum << std::endl;


        return 0;


    }


    Explanation:


    1.  The findMaximum function takes an array arr and its size size as input.


    2.  It assumes the first element arr[0] as the maximum value.


    3.  The for loop starts from the second element (i = 1) and iterates through the
    array.


    4.  Inside the loop, it compares each element arr[i] with the current maximum
    value (max).


    5.  If arr[i] is greater than max, it updates the value of max to arr[i].


    6.  After iterating through the entire array, the function returns the maximum
    value.


    7.  In the main function, we create an example array arr and calculate its size
    by dividing the total size of the array by the size of a single element.


    8.  We call the findMaximum function, passing the array and its size, and store
    the returned maximum value in the maximum variable.


    9.  Finally, we print the maximum value using std::cout.


    When executing the program, it will output:


    Maximum element in the array: 9


    The program iterates through the array and keeps track of the maximum value by
    comparing each element with the current maximum. If a larger element is found,
    it updates the maximum value. At the end of the iteration, the maximum value is
    returned.


