    # 90


    # Array Maximum Frequency Element


    To find the element with the maximum frequency in an array using hashing in C++,
    you can follow these steps:


    1.  Create a hash table or a hash map to store the frequencies of each element
    in the array.


    2.  Iterate through the given array and for each element, update its frequency
    in the hash table.


    3.  Initialize two variables: maxFrequency to keep track of the maximum frequency
    found so far, and maxElement to store the element with the maximum frequency.


    4.  Traverse the hash table and for each key-value pair, check if the frequency
    is greater than the current maxFrequency. If so, update maxFrequency and maxElement
    accordingly.


    5.  After traversing the entire hash table, the variable maxElement will contain
    the element with the maximum frequency.


    Here’s an example implementation in C++:


    #include <iostream>


    #include <unordered_map>


    int findMaxFrequencyElement(int arr[], int size) {


        std::unordered_map<int, int> frequencyMap;


        int maxFrequency = 0;


        int maxElement = arr[0]; // Assuming the first element as the maximum frequency
    element initially


        for (int i = 0; i < size; i++) {


            int element = arr[i];


            frequencyMap[element]++;


            if (frequencyMap[element] > maxFrequency) {


                maxFrequency = frequencyMap[element];


                maxElement = element;


            }


        }


        return maxElement;


    }


    int main() {


        int arr[] = {1, 2, 3, 2, 4, 1, 3, 4, 2, 2, 2};


        int size = sizeof(arr) / sizeof(arr[0]);


        int maxFrequencyElement = findMaxFrequencyElement(arr, size);


        std::cout << "Element with maximum frequency: " << maxFrequencyElement <<
    std::endl;


        return 0;


    }


    In this code, we use an unordered_map (frequencyMap) to store the frequencies
    of each element in the array. We iterate through the array, update the frequencies
    in the hash map, and keep track of the element with the maximum frequency (maxElement).
    Finally, we print the maxFrequencyElement as the result.


    Note that unordered_map provides a constant time complexity for insertion and
    retrieval operations on average, which makes it efficient for this problem.


    # 91


    # Array Maximum Subarray Sum with No Adjacent Elements


    Here’s a C++ program that finds the maximum sum of a subarray in an array, with
    the constraint that no adjacent elements can be included. The program uses dynamic
    programming to solve the problem.


    #include <iostream>


    #include <vector>


    using namespace std;


    int maxSubarraySum(vector<int>& arr) {


        int n = arr.size();


        if (n == 0) {


            return 0;


        }


        if (n == 1) {


            return arr[0];


        }


        int incl = arr[0];


        int excl = 0;


        for (int i = 1; i < n; i++) {


            int temp = max(incl, excl);  // Choose the maximum sum so far


            incl = excl + arr[i];        // Include the current element, but exclude
    the previous adjacent element


            excl = temp;                 // Exclude the current element and take the
    maximum sum so far


        }


        return max(incl, excl);          // Return the maximum sum


    }


    int main() {


        vector<int> arr = {2, 4, 6, 8, 5, 9, 3};


        int maxSum = maxSubarraySum(arr);


        cout << "Maximum subarray sum with no adjacent elements: " << maxSum << endl;


        return 0;


    }


    Explanation:


    *   The program takes an input array arr and finds the maximum sum of a subarray
    with no adjacent elements.


    *   We initialize two variables, incl and excl, to store the maximum sum including
    and excluding the current element, respectively.


    *   We iterate over the array starting from the second element (index 1) and update
    the values of incl and excl.


    *   For each iteration, we calculate the maximum sum so far (temp) by choosing
    the maximum of incl and excl.


    *   To update incl, we add the current element to excl, as we cannot include adjacent
    elements.


    *   To update excl, we assign it the value of temp, which represents the maximum
    sum obtained so far.


    *   Finally, we return the maximum of incl and excl, which represents the maximum
    sum of a subarray with no adjacent elements.


    In the provided example, the maximum subarray sum with no adjacent elements is
    27, which corresponds to the subarray {2, 6, 5, 3}.


    # 92


    # Array Perfect Peak


    To find a perfect peak element in an array using C++, you can follow these steps:


    1.  Iterate through the array from the second element to the second-to-last element.


    2.  For each element, compare it with its adjacent elements.


    3.  If the current element is greater than both its adjacent elements, it is a
    perfect peak.


    4.  Return the index or value of the first perfect peak element found, or any
    other desired output.


    Here’s the C++ code implementing the above approach:


    #include <iostream>


    #include <vector>


    // Function to find a perfect peak element in an array


    int findPerfectPeak(const std::vector<int>& arr) {


        int n = arr.size();


        for (int i = 1; i < n - 1; i++) {


            if (arr[i] > arr[i - 1] && arr[i] > arr[i + 1]) {


                return arr[i]; // Return the value of the perfect peak element


                // Alternatively, you can return the index by replacing the above
    line with:


                // return i;


            }


        }


        return -1; // Return -1 if no perfect peak element is found


    }


    int main() {


        std::vector<int> arr = {1, 3, 5, 4, 2};


        int peak = findPerfectPeak(arr);


        if (peak != -1) {


            std::cout << "Perfect peak element: " << peak << std::endl;


        } else {


            std::cout << "No perfect peak element found." << std::endl;


        }


        return 0;


    }


    In the findPerfectPeak function, we iterate through the array from the second
    element (i = 1) to the second-to-last element (i < n - 1). For each element at
    index i, we compare it with its adjacent elements: arr[i - 1] (previous element)
    and arr[i + 1] (next element). If the current element is greater than both its
    adjacent elements, we return it as the perfect peak element. If no perfect peak
    element is found, we return -1.'
