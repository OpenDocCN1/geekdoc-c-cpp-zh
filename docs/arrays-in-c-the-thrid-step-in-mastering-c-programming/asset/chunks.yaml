    # 85


    # Array Kth Largest Element


    Here’s an example program in C++ that finds the Kth largest element in an array
    using a priority queue:


    #include <iostream>


    #include <queue>


    using namespace std;


    int findKthLargest(int arr[], int size, int k) {


        // Create a max heap using priority_queue


        priority_queue<int> pq(arr, arr + size);


        // Extract the k-1 largest elements


        for (int i = 0; i < k - 1; i++) {


            pq.pop();


        }


        // The top of the priority queue will be the kth largest element


        return pq.top();


    }


    int main() {


        int arr[] = {3, 1, 7, 5, 9, 2};


        int size = sizeof(arr) / sizeof(arr[0]);


        int k = 3;


        int kthLargest = findKthLargest(arr, size, k);


        cout << "The " << k << "th largest element is: " << kthLargest << endl;


        return 0;


    }


    Explanation:


    1.  The findKthLargest function takes three parameters: the array arr, its size
    size, and the value of k indicating the kth largest element to find.


    2.  Inside the function, a priority_queue is created using the elements of the
    array. By default, priority_queue creates a max heap, so the largest element will
    always be at the top.


    3.  We extract the k-1 largest elements from the priority_queue by calling pop()
    k-1 times.


    4.  The top of the priority_queue after extracting k-1 elements will be the kth
    largest element, so we return it.


    5.  In the main function, an example array is defined, and the findKthLargest
    function is called with the array, its size, and the desired value of k.


    6.  The kth largest element is then printed to the console.


    Now, let’s explain how you can solve the problem using the quickselect algorithm:


    #include <iostream>


    using namespace std;


    int partition(int arr[], int low, int high) {


        int pivot = arr[high];


        int i = low - 1;


        for (int j = low; j <= high - 1; j++) {


            if (arr[j] <= pivot) {


                i++;


                swap(arr[i], arr[j]);


            }


        }


        swap(arr[i + 1], arr[high]);


        return (i + 1);


    }


    int quickSelect(int arr[], int low, int high, int k) {


        if (low < high) {


            int pivotIndex = partition(arr, low, high);


            // If the pivot is the kth largest element, return it


            if (pivotIndex == k - 1)


                return arr[pivotIndex];


            // If the pivot is greater than the kth largest element, search in the
    left partition


            else if (pivotIndex > k - 1)


                return quickSelect(arr, low, pivotIndex - 1, k);


            // If the pivot is smaller than the kth largest element, search in the
    right partition


            else


                return quickSelect(arr, pivotIndex + 1, high, k);


        }


        // If the array has only one element, return it


        return arr[low];


    }


    int findKthLargest(int arr[], int size, int k) {


        return quickSelect(arr, 0, size - 1, k);


    }


    int main() {


        int arr[] = {3, 1, 7, 5, 9, 2};


        int size = sizeof(arr) / sizeof(arr[0]);


        int k = 3;


        int kthLargest = findKthLargest(arr, size, k);


        cout << "The " << k << "th largest element is: " << kthLargest << endl;


        return 0;


    }


    Explanation:


    1.  The partition function is a helper function used in the quickselect algorithm
    to rearrange elements in the array such that all elements smaller than the pivot
    are placed to its left, and all elements larger are placed to its right. It returns
    the index of the pivot element after partitioning.


    2.  The quickSelect function recursively partitions the array and selects a pivot
    until the pivot element is the kth largest element. It uses the partition function
    to rearrange the array.


    3.  The findKthLargest function serves as a wrapper function for quickSelect and
    is called from the main function.


    4.  In the main function, an example array is defined, and the findKthLargest
    function is called with the array, its size, and the desired value of k.


    5.  The kth largest element is then printed to the console.


    Both methods, priority queues and quickselect, can be used to find the kth largest
    element in an array efficiently. The choice between them depends on the specific
    requirements and constraints of your problem. Priority queues offer a simpler
    implementation and a time complexity of O(n log k), where n is the size of the
    array. Quickselect, on the other hand, has an average time complexity of O(n)
    and can be faster in practice, but it has a worst-case time complexity of O(n^2)
    if the pivot selection is poor.


    # 86


    # Array Subarray with Equal 0s and 1s


    To find the longest subarray with an equal number of 0s and 1s in a binary array,
    we can use the prefix sums technique along with hashing. Here’s a step-by-step
    explanation of the approach:


    1.  First, let’s understand the concept of prefix sums. For each index i in the
    given binary array, the prefix sum sum at that index represents the difference
    between the number of 1s and 0s encountered from the start of the array up to
    index i. We can compute the prefix sums array prefixSum using the following formula:
    prefixSum[i] = prefixSum[i - 1] + (arr[i] == 0 ? -1 : 1)


    2.  Create a hash table (unordered map) named sumMap to store the first occurrence
    of each unique sum encountered during the iteration of the prefix sums array.


    3.  Initialize two variables, maxLength and endIndex, to keep track of the maximum
    length of the subarray and the ending index of that subarray, respectively. Set
    maxLength to 0 and endIndex to -1.


    4.  Traverse the prefixSum array from left to right:


    *   If prefixSum[i] is 0, it means the subarray from index 0 to i has an equal
    number of 0s and 1s. Update maxLength to i + 1 and endIndex to i.


    *   If prefixSum[i] is already present in sumMap, it means there is a subarray
    with the same sum encountered before. Calculate the length of the current subarray
    as i - sumMap[prefixSum[i]] and check if it is greater than maxLength. If so,
    update maxLength and endIndex.'
