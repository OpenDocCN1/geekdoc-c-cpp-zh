    \ 5 2 8 12 1 6\nSorted array: 1 2 5 6 8 12\n\nThe elements of the array are successfully\
    \ sorted in ascending order using the Insertion Sort algorithm.\n\n# 8 Array Searching\n\
    \nIn C++, there are several searching algorithms that can be used to find a specific\
