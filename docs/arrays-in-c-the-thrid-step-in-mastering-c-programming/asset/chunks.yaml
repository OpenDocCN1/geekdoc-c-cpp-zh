    # Array Inversion Count


    Here’s an example program in C++ that counts the number of inversions in an array
    using the modified merge sort algorithm:


    #include <iostream>


    #include <vector>


    using namespace std;


    long long mergeAndCount(vector<int>& arr, vector<int>& temp, int left, int mid,
    int right) {


        int i = left;


        int j = mid + 1;


        int k = left;


        long long inversionCount = 0;


        while (i <= mid && j <= right) {


            if (arr[i] <= arr[j]) {


                temp[k++] = arr[i++];


            } else {


                temp[k++] = arr[j++];


                inversionCount += mid - i + 1; // Count inversions


            }


        }


        while (i <= mid) {


            temp[k++] = arr[i++];


        }


        while (j <= right) {


            temp[k++] = arr[j++];


        }


        for (i = left; i <= right; i++) {


            arr[i] = temp[i];


        }


        return inversionCount;


    }


    long long mergeSortAndCount(vector<int>& arr, vector<int>& temp, int left, int
    right) {


        long long inversionCount = 0;


        if (left < right) {


            int mid = left + (right - left) / 2;


            inversionCount += mergeSortAndCount(arr, temp, left, mid);


            inversionCount += mergeSortAndCount(arr, temp, mid + 1, right);


            inversionCount += mergeAndCount(arr, temp, left, mid, right);


        }


        return inversionCount;


    }


    long long countInversions(vector<int>& arr) {


        int n = arr.size();


        vector<int> temp(n);


        return mergeSortAndCount(arr, temp, 0, n - 1);


    }


    int main() {


        vector<int> arr = {5, 3, 2, 4, 1};


        long long inversionCount = countInversions(arr);


        cout << "Number of inversions: " << inversionCount << endl;


        return 0;


    }


    In this program, we use a modified merge sort algorithm to count the number of
    inversions in the array. The mergeAndCount function merges two sorted subarrays
    and counts the inversions. The mergeSortAndCount function recursively divides
    the array into smaller subarrays, performs merge sort, and accumulates the inversion
    counts. Finally, the countInversions function is a wrapper function that initializes
    the temporary array and starts the merge sort process.


    To solve this problem using a Fenwick tree (also known as a Binary Indexed Tree
    or BIT), we can modify the merge sort algorithm as follows:


    1.  Create a Fenwick tree data structure that supports efficient range sum queries
    and point updates. The Fenwick tree should be initialized with all zeros.


    2.  Initialize a variable inversionCount to 0.


    3.  Traverse the array from right to left.


    4.  For each element arr[i], query the Fenwick tree for the sum of elements less
    than arr[i]. Add this sum to inversionCount.


    5.  Update the Fenwick tree by incrementing the value at index arr[i] by 1.


    Here’s an example implementation:


    #include <iostream>


    #include <vector>


    using namespace std;


    class FenwickTree {


    private:


        vector<int> BIT;


    public:


        FenwickTree(int size) {


            BIT.resize(size + 1, 0);


        }


        void update(int index, int value) {


            while (index < BIT.size()) {


                BIT[index] += value;


                index += index & (-index);


            }


        }


        int query(int index) {


            int sum = 0;


            while (index > 0) {


                sum += BIT[index];


                index -= index & (-index);


            }


            return sum;


        }


    };


    long long countInversions(vector<int>& arr) {


        int n = arr.size();


        FenwickTree bit(n);


        long long inversionCount = 0;


        for (int i = n - 1; i >= 0; i--) {


            inversionCount += bit.query(arr[i] - 1);


            bit.update(arr[i], 1);


        }


        return inversionCount;


    }


    int main() {


        vector<int> arr = {5, 3, 2, 4, 1};


        long long inversionCount = countInversions(arr);


        cout << "Number of inversions: " << inversionCount << endl;


        return 0;


    }


    In this implementation, we define a FenwickTree class that encapsulates the Fenwick
    tree operations. The update function updates the tree by incrementing the value
    at the given index, and the query function calculates the sum of elements up to
    the given index.


    In the countInversions function, we iterate over the array in reverse order. For
    each element, we query the Fenwick tree for the sum of elements less than the
    current element, add it to inversionCount, and update the Fenwick tree accordingly.


    Both the modified merge sort and Fenwick tree approaches have a time complexity
    of O(n log n), where n is the size of the array. The modified merge sort has a
    slightly larger constant factor, but it may be easier to understand and implement
    in certain scenarios. The Fenwick tree approach requires additional space to store
    the Fenwick tree itself.


