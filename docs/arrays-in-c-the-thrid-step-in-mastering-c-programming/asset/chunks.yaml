    \    return mergeSort(arr, temp, 0, size - 1);\n}\n\nint main() {\n    int arr[]\
    \ = {5, 3, 2, 4, 1};\n    int size = sizeof(arr) / sizeof(arr[0]);\n    long long\
    \ inversionCount = countInversions(arr, size);\n    cout << \"Number of inversions:\
    \ \" << inversionCount << endl;\n    return 0;\n}\n```\n\n### 使用 Fenwick 树：\n\n\
    1. 实现一个 Fenwick 树数据结构（也称为二叉索引树）来高效计数逆序对。\n2. 将 Fenwick 树初始化为全零。\n3. 从右到左遍历给数组。对于每个元素，查询\
    \ Fenwick 树以找到大于当前元素的元素和。\n4. 通过更新对应的索引将当前元素加入 Fenwick 树。\n5. 重复步骤 3 和 4 直到所有元素都处理完毕。\n\
    6. 逆序对的总数将是每一步获取的逆序对之。\n7. 返回逆序对计数。\n\n以下是 Fenwick 树方法的 C++ 代码：\n\n```cpp\n#include\
    \ <iostream>\n\nusing namespace std;\n\nint getSum(int BIT[], int index) {\n \
    \   int sum = 0;\n    while (index > 0) {\n        sum += BIT[index];\n      \
    \  index -= index & (-index);\n    }\n    return sum;\n}\n\nvoid updateBIT(int\
    \ BIT[], int n, int index, int value) {\n    while (index <= n) {\n        BIT[index]\
    \ += value;\n        index += index & (-index);\n    }\n}\n\nlong long countInversions(int\
    \ arr[], int size) {\n    int maxElement = 0;\n    for (int i = 0; i < size; i++)\
    \ {\n        maxElement = max(maxElement, arr[i]);\n    }\n    int* BIT = new\
    \ int[maxElement + 1];\n    for (int i = 1; i <= maxElement; i++) {\n        BIT[i]\
    \ = 0;\n    }\n    long long inversionCount = 0;\n    for (int i = size - 1; i\
    \ >= 0; i--) {\n        inversionCount += getSum(BIT, arr[i]);\n        updateBIT(BIT,\
    \ maxElement, arr[i], 1);\n    }\n    delete[] BIT;\n    return inversionCount;\n\
    }\n\nint main() {\n    int arr[] = {5, 3, 2, 4, 1};\n    int size = sizeof(arr)\
    \ / sizeof(arr[0]);\n    long long inversionCount = countInversions(arr, size);\n\
    \    cout << \"Number of inversions: \" << inversionCount << endl;\n    return\
    \ 0;\n}\n```\n\n两种方法将产生相同的输出：\nNumber of inversions: 8\n\n# 100\n\n# 数组直方图最大面积\n\
    \n这是一个使用栈的 C++ 程序，用于从高度数组直方图中最大矩形面积：\n\n```cpp\n#include <iostream>\n#include\
    \ <stack>\n\nusing namespace std;\n\nint findMaxArea(int heights[], int n) {\n\
    \    stack<int> st;\n    int maxArea = 0;\n    int area = 0;\n    int i = 0;\n\
    \    while (i < n) {\n        if (st.empty() || heights[st.top()] <= heights[i])\
    \ {\n            st.push(i);\n            i++;\n        } else {\n           \
    \ int top = st.top();\n            st.pop();\n            area = heights[top]\
    \ * (st.empty() ? i : (i - st.top() - 1));\n            if (area > maxArea) {\n\
    \                maxArea = area;\n            }\n        }\n    }\n    while (!st.empty())\
    \ {\n        int top = st.top();\n        st.pop();\n        area = heights[top]\
    \ * (st.empty() ? i : (i - st.top() - 1));\n        if (area > maxArea) {\n  \
    \          maxArea = area;\n        }\n    }\n    return maxArea;\n}\n\nint main()\
    \ {\n    int heights[] = {2, 1, 5, 6, 2, 3};\n    int n = sizeof(heights) / sizeof(heights[0]);\n\
    \    int maxArea = findMaxArea(heights, n);\n    cout << \"Maximum rectangular\
    \ area: \" << maxArea << endl;\n    return 0;\n}\n```\n\n### Explanation:\n\n\
    1. 我们使用栈来存储直方图索引，其高度按非递增排列。\n\n"
