    # 8


    # Array Searching


    In C++, there are several searching algorithms that can be used to find a specific
    element in an array. Here, I will explain two commonly used algorithms: linear
    search and binary search.


    1.  Linear Search:


    *   Linear search is a simple searching algorithm that sequentially checks each
    element of the array until a match is found or the entire array is traversed.


    *   It is suitable for both sorted and unsorted arrays.


    *   To implement linear search in C++, you can use a loop to iterate through each
    element of the array and compare it with the target element.


    *   If a match is found, you can return the index of the element. Otherwise, you
    can return a value to indicate that the element was not found.


    Here’s an example implementation of linear search in C++:


    #include <iostream>


    int linearSearch(int arr[], int size, int target) {


        for (int i = 0; i < size; i++) {


            if (arr[i] == target) {


                return i;  // Found the target element at index i


            }


        }


        return -1;  // Element not found


    }


    int main() {


        int arr[] = {5, 2, 8, 10, 3};


        int size = sizeof(arr) / sizeof(arr[0]);


        int target = 8;


        int result = linearSearch(arr, size, target);


        if (result == -1) {


            std::cout << "Element not found." << std::endl;


        } else {


            std::cout << "Element found at index " << result << std::endl;


        }


        return 0;


    }


    1.  Binary Search:


    *   Binary search is a more efficient algorithm that requires the array to be
    sorted in ascending order.


    *   It follows the divide-and-conquer approach by repeatedly dividing the search
    space in half until the target element is found.


    *   To implement binary search, you need to maintain two pointers: start and end,
    which represent the range of the search space.


    *   At each step, you calculate the middle element and compare it with the target.


    *   If the middle element is equal to the target, you return its index. If the
    middle element is greater than the target, you update end to be the middle element’s
    index minus one. Otherwise, you update start to be the middle element’s index
    plus one.


    *   This process continues until the target element is found or the search space
    is empty.


    Here’s an example implementation of binary search in C++:


    #include <iostream>


    int binarySearch(int arr[], int size, int target) {


        int start = 0;


        int end = size - 1;


        while (start <= end) {


            int mid = start + (end - start) / 2;


            if (arr[mid] == target) {


                return mid;  // Found the target element at index mid


            } else if (arr[mid] > target) {


                end = mid - 1;  // Target lies in the left half


            } else {


                start = mid + 1;  // Target lies in the right half


            }


        }


        return -1;  // Element not found


    }


    int main() {


        int arr[] = {2, 3, 5, 8, 10};


        int size = sizeof(arr) / sizeof(arr[0]);


        int target = 8;


        int result = binarySearch(arr, size, target);


        if (result == -1) {


            std::cout << "Element not found." << std::endl;


        } else {


            std::cout << "Element found at index " << result << std::endl;


        }


        return 0;


    }


    These are two basic searching algorithms that can be used to search for a specific
    element in an array. Other advanced algorithms, such as interpolation search or
    exponential search, can also be implemented based on specific requirements and
    characteristics of the data.


