    # 93


    # Array Repeated Number


    To find the repeated number in an array of integers from 1 to n, where n is the
    size of the array, you can use either the pigeonhole principle or hashing. Here’s
    an explanation of how both methods can be used to solve this problem:


    1.  Pigeonhole Principle: The pigeonhole principle states that if you have more
    pigeons than pigeonholes, then at least one pigeonhole must contain more than
    one pigeon. In the context of this problem, the array can be seen as the pigeonholes,
    and the numbers from 1 to n can be seen as the pigeons. Since there are n numbers
    and n-1 pigeonholes, at least one number must repeat.


    Here’s an implementation using the pigeonhole principle in C++:


    #include <iostream>


    #include <vector>


    int findRepeatedNumber(const std::vector<int>& nums) {


        int n = nums.size() - 1; // The size of the array is n, so the last number
    is n


        // Create a vector to keep track of the frequency of each number


        std::vector<int> frequency(n + 1, 0);


        // Iterate through the array and increment the frequency count


        for (int num : nums) {


            frequency[num]++;


            // If a number is repeated, its frequency will be more than 1


            if (frequency[num] > 1) {


                return num;


            }


        }


        // No repeated number found


        return -1;


    }


    int main() {


        std::vector<int> nums = {1, 2, 3, 4, 4, 5}; // Example array with a repeated
    number


        int repeatedNumber = findRepeatedNumber(nums);


        if (repeatedNumber != -1) {


            std::cout << "The repeated number is: " << repeatedNumber << std::endl;


        } else {


            std::cout << "No repeated number found." << std::endl;


        }


        return 0;


    }


    1.  Hashing: Hashing involves using a hash table or a similar data structure to
    store elements and efficiently perform lookup operations. In this case, you can
    use a hash set to store the numbers as you iterate through the array. Whenever
    you encounter a number that already exists in the set, it means that number is
    repeated.


    Here’s an implementation using hashing in C++:


    #include <iostream>


    #include <unordered_set>


    #include <vector>


    int findRepeatedNumber(const std::vector<int>& nums) {


        std::unordered_set<int> numSet;


        // Iterate through the array


        for (int num : nums) {


            // Check if the number already exists in the set


            if (numSet.count(num) > 0) {


                return num;


            }


            // Add the number to the set


            numSet.insert(num);


        }


        // No repeated number found


        return -1;


    }


    int main() {


        std::vector<int> nums = {1, 2, 3, 4, 4, 5}; // Example array with a repeated
    number


        int repeatedNumber = findRepeatedNumber(nums);


        if (repeatedNumber != -1) {


            std::cout << "The repeated number is: " << repeatedNumber << std::endl;


        } else {


            std::cout << "No repeated number found." << std::endl;


        }


        return 0;


    }


    Both the pigeonhole principle and hashing provide efficient solutions for finding
    the repeated number in an array. The time complexity for both approaches is O(n)
    since you need to iterate through the array once. However, the space complexity
    for the pigeonhole principle approach is O(n) due to the additional vector, while
    the hashing approach has a space complexity of O(n) due to the hash set.


    # 94


    # Array Subarray with Maximum XOR


    To find the maximum XOR value of a subarray in an array of integers, we can use
    a trie data structure or utilize the concept of prefix XOR. Let’s first understand
    how to solve the problem using the trie data structure:


    Create a TrieNode structure that consists of an array of two pointers, representing
    the left and right child nodes, respectively.


    struct TrieNode {


        TrieNode* child[2];


        TrieNode() {


            child[0] = nullptr;


            child[1] = nullptr;


        }


    };


    Create a function to insert numbers into the trie. The function takes two arguments:
    the root of the trie and the number to be inserted.


    void insertNumber(TrieNode* root, int num) {


        TrieNode* curr = root;


        for (int i = 31; i >= 0; i--) {


            int bit = (num >> i) & 1;


            if (curr->child[bit] == nullptr)


                curr->child[bit] = new TrieNode();


            curr = curr->child[bit];


        }


    }


    Create a function to find the maximum XOR value. This function takes the root
    of the trie and the array of integers as input.


    int findMaxXOR(TrieNode* root, vector<int>& nums) {


        int maxXOR = 0;


        for (int num : nums) {


            TrieNode* curr = root;


            int currXOR = 0;


            for (int i = 31; i >= 0; i--) {


                int bit = (num >> i) & 1;


                if (curr->child[bit ^ 1] != nullptr) {


                    currXOR |= (1 << i);


                    curr = curr->child[bit ^ 1];


                } else {


                    curr = curr->child[bit];


                }


            }


            maxXOR = max(maxXOR, currXOR);


        }


        return maxXOR;


    }


    Finally, in the main function, create the root of the trie and call the above
    functions to find the maximum XOR value.


    int main() {


        vector<int> nums = {3, 10, 5, 25, 2, 8};


        TrieNode* root = new TrieNode();


        for (int num : nums)


            insertNumber(root, num);


        int maxXOR = findMaxXOR(root, nums);


        cout << "Maximum XOR value of a subarray: " << maxXOR << endl;


        return 0;


    }


    Using the trie data structure, we iterate through each number in the array and
    insert it into the trie, considering each bit of the number. While inserting,
    we try to follow a different path in the trie to maximize the XOR value. Finally,
    we find the maximum XOR value by comparing each number with the trie.


    Alternatively, we can solve this problem using the concept of prefix XOR:


    Create a prefixXOR array that stores the XOR of all elements from index 0 to the
    current index.


    vector<int> prefixXOR(nums.size());


    prefixXOR[0] = nums[0];


    for (int i = 1; i < nums.size(); i++)


        prefixXOR[i] = prefixXOR[i - 1] ^ nums[i];


    Initialize a variable maxXOR with 0.


    int maxXOR = 0;


    Iterate through each element of the prefixXOR array and find the maximum XOR value
    by checking all possible subarrays.


    for (int i = 0; i < prefixXOR.size(); i++) {


        for (int j = i; j < prefixXOR.size(); j++) {


            int subarrayXOR = prefixXOR[i] ^ prefixXOR[j];


            maxXOR = max(maxXOR, subarrayXOR);


        }


    }


    Finally, maxXOR will store the maximum XOR value of a subarray.


    Using the prefix XOR approach, we calculate the XOR of subarrays efficiently by
    XORing the prefix XOR values of the elements. By checking all possible subarrays,
    we can find the maximum XOR value.


    Note: The prefix XOR approach has a higher time complexity compared to the trie
    data structure, but it is simpler to implement. The trie approach is more efficient
    for large arrays with a huge range of numbers.


    # 95


    # Array Sum of Absolute Differences


    To calculate the sum of absolute differences of all elements in an array using
    prefix sums, you can follow these steps:


    1.  Define an array of integers.


    2.  Calculate the prefix sum array. Initialize an auxiliary array called prefixSum
