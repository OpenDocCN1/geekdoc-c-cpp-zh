    \ num : triplet) {\n            cout << num << \" \";\n        }\n        cout\
    \ << endl;\n    }\n    return 0;\n}\n```\n\nIn the above example, the input array\
    \ `nums` contains `[-1, 0, 1, 2, -1, -4]` and the target sum is `0`. The program\
    \ finds triplets that add up to the target sum using sorting and two-pointers\
    \ technique and displays them.\n\n# 65 Array Two Sum\n\n## Approach 1: Using Map\n\
    1. Initialize an empty map, let’s call it `numMap`, where the key will be the\
