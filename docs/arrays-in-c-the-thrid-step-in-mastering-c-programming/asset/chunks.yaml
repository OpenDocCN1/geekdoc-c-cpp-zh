    # 37


    # Array Partitioning


    Here’s an example program in C++ that partitions an array into two subarrays based
    on the sign of the elements:


    #include <iostream>


    #include <vector>


    void partitionArray(std::vector<int>& arr) {


        int i = 0; // Index for positive elements


        int j = arr.size() - 1; // Index for negative elements


        while (i < j) {


            // Find the first negative element from the left side


            while (arr[i] >= 0 && i < j)


                i++;


            // Find the first positive element from the right side


            while (arr[j] < 0 && i < j)


                j--;


            // Swap the positive and negative elements


            if (i < j)


                std::swap(arr[i], arr[j]);


        }


    }


    int main() {


        std::vector<int> arr = { 4, -7, 2, -9, 5, -3, 8, -1 };


        std::cout << "Original Array: ";


        for (int num : arr)


            std::cout << num << " ";


        std::cout << std::endl;


        partitionArray(arr);


        std::cout << "Partitioned Array: ";


        for (int num : arr)


            std::cout << num << " ";


        std::cout << std::endl;


        return 0;


    }


    In this program, we use the two-pointer approach to partition the array. The variable
    i represents the index for positive elements, and the variable j represents the
    index for negative elements. We start with i at the beginning of the array and
    j at the end.


    We then use two nested while loops to find the first negative element from the
    left side (i) and the first positive element from the right side (j). Once we
    find these elements, we swap them to rearrange the array.


    The process continues until i and j cross each other or meet, ensuring that all
    positive elements are on the left side and all negative elements are on the right
    side.


    After the partitioning is complete, the program prints both the original array
    and the partitioned array for verification.


    Here’s the output of the above program:


    Original Array: 4 -7 2 -9 5 -3 8 -1


    Partitioned Array: -7 -9 -3 -1 5 2 8 4


    As you can see, the positive elements (4, 2, 5, 8) are on the left side, while
    the negative elements (-7, -9, -3, -1) are on the right side, as per the partitioning
    logic.


    # 38


    # Array Duplicates


    Here’s an example program in C++ that uses a map to track element frequencies
    and identify duplicates in an array:


    #include <iostream>


    #include <map>


    #include <vector>


    std::vector<int> findDuplicates(const std::vector<int>& nums) {


        std::map<int, int> frequencyMap;


        std::vector<int> duplicates;


        // Count the frequency of each element in the array


        for (int num : nums) {


            frequencyMap[num]++;


        }


        // Check for duplicates based on frequency


        for (const auto& pair : frequencyMap) {


            if (pair.second > 1) {


                duplicates.push_back(pair.first);


            }


        }


        return duplicates;


    }


    int main() {


        std::vector<int> numbers = {1, 2, 3, 4, 5, 2, 3, 5, 6, 7, 8, 8, 9, 10, 10};


        std::vector<int> duplicates = findDuplicates(numbers);


        std::cout << "Duplicate elements: ";


        for (int duplicate : duplicates) {


            std::cout << duplicate << " ";


        }


        std::cout << std::endl;


        return 0;


    }


    In this program, we define a function findDuplicates that takes an array of integers
    (nums) as input and returns a vector of integers containing the duplicate elements
    found in the array.


    To track the frequency of elements, we use a std::map<int, int> called frequencyMap.
    The keys of the map represent the elements in the array, and the values represent
    their frequencies. We iterate over each element in the nums array and increment
    the frequency count in the map accordingly.


    After counting the frequencies, we iterate over the elements in the frequencyMap
    and check if their frequency is greater than 1\. If so, it means the element is
    a duplicate, and we add it to the duplicates vector.


    In the main function, we create an example array of integers (numbers) and call
    the findDuplicates function to find the duplicate elements. Finally, we print
    the duplicate elements on the console.


    When you run this program, the output will be:


    Duplicate elements: 2 3 5 8 10


    This indicates that the numbers 2, 3, 5, 8, and 10 are duplicates in the given
    array.


    Using a map allows us to efficiently track the frequencies of elements while iterating
    over the array only once. This approach has a time complexity of O(n), where n
    is the size of the array, as we iterate over the array once and the map once.


