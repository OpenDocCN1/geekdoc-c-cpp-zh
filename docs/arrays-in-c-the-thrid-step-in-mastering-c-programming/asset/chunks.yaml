    # 73


    # Array Game of Life


    Conway’s Game of Life is a cellular automaton devised by mathematician John Conway.
    It is played on a two-dimensional grid of cells, where each cell can be in one
    of two states: alive or dead. The grid evolves over time based on a set of rules.


    Here’s an example implementation of Conway’s Game of Life in C++:


    #include <iostream>


    #include <vector>


    // Function to print the current state of the grid


    void printGrid(const std::vector<std::vector<bool>>& grid) {


        for (const auto& row : grid) {


            for (bool cell : row) {


                std::cout << (cell ? "O " : ". ");


            }


            std::cout << std::endl;


        }


    }


    // Function to update the grid based on the rules of the game


    void updateGrid(std::vector<std::vector<bool>>& grid) {


        int numRows = grid.size();


        int numCols = grid[0].size();


        std::vector<std::vector<bool>> newGrid(numRows, std::vector<bool>(numCols));


        // Iterate over each cell in the grid


        for (int i = 0; i < numRows; ++i) {


            for (int j = 0; j < numCols; ++j) {


                // Count the number of live neighbors


                int liveNeighbors = 0;


                // Check the eight neighboring cells


                for (int x = -1; x <= 1; ++x) {


                    for (int y = -1; y <= 1; ++y) {


                        if (x == 0 && y == 0) {


                            continue;  // Skip the current cell


                        }


                        int neighborRow = i + x;


                        int neighborCol = j + y;


                        // Check if the neighbor is within the grid bounds


                        if (neighborRow >= 0 && neighborRow < numRows &&


                            neighborCol >= 0 && neighborCol < numCols) {


                            liveNeighbors += grid[neighborRow][neighborCol] ? 1 :
    0;


                        }


                    }


                }


                // Apply the rules of the game


                if (grid[i][j]) {


                    // Cell is alive


                    if (liveNeighbors < 2 || liveNeighbors > 3) {


                        // Underpopulation or overpopulation, cell dies


                        newGrid[i][j] = false;


                    } else {


                        // Cell survives to the next generation


                        newGrid[i][j] = true;


                    }


                } else {


                    // Cell is dead


                    if (liveNeighbors == 3) {


                        // Cell is born


                        newGrid[i][j] = true;


                    } else {


                        newGrid[i][j] = false;


                    }


                }


            }


        }


        // Update the original grid with the new grid


        grid = newGrid;


    }


    int main() {


        // Define the size of the grid


        int numRows = 10;


        int numCols = 10;


        // Create the initial grid with random alive or dead cells


        std::vector<std::vector<bool>> grid(numRows, std::vector<bool>(numCols));


        for (auto& row : grid) {


            for (bool& cell : row) {


                cell = rand() % 2 == 0;


            }


        }


        // Perform 10 iterations of the game


        for (int i = 0; i < 10; ++i) {


            std::cout << "Generation " << i << std::endl;


            printGrid(grid);


            updateGrid(grid);


            std::cout << std::endl;


        }


        return 0;


    }


