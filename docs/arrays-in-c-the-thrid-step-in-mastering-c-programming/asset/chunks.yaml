    这是一个使用 Kadane 算法寻找数组中最大和子数组的 C++ 程序：\n\n```cpp\n#include <iostream>\n#include\
    \ <climits>\n\n// 使用 Kadane 算法找到最大和子数组\nint maxSubarraySum(int arr[], int size)\
    \ {\n    int maxSum = INT_MIN;\n    int currentSum = 0;\n    for (int i = 0; i\
    \ < size; i++) {\n        currentSum += arr[i];\n        if (currentSum > maxSum)\n\
    \            maxSum = currentSum;\n        if (currentSum < 0)\n            currentSum\
