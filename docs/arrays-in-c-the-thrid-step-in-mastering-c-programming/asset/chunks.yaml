    # Array Comparison


    Here’s an example program in C++ that compares two arrays and checks if they are
    equal:


    #include <iostream>


    bool areArraysEqual(int arr1[], int arr2[], int size) {


        for (int i = 0; i < size; i++) {


            if (arr1[i] != arr2[i]) {


                return false;


            }


        }


        return true;


    }


    int main() {


        int size;


        std::cout << "Enter the size of the arrays: ";


        std::cin >> size;


        int array1[size];


        int array2[size];


        std::cout << "Enter the elements of the first array: ";


        for (int i = 0; i < size; i++) {


            std::cin >> array1[i];


        }


        std::cout << "Enter the elements of the second array: ";


        for (int i = 0; i < size; i++) {


            std::cin >> array2[i];


        }


        bool equal = areArraysEqual(array1, array2, size);


        if (equal) {


            std::cout << "The arrays are equal." << std::endl;


        } else {


            std::cout << "The arrays are not equal." << std::endl;


        }


        return 0;


    }


    In this program, the areArraysEqual function takes two arrays (arr1 and arr2),
    along with the size of the arrays (size). It compares the elements of the arrays
    using a for loop and checks if they are equal. If any elements differ, it immediately
    returns false, indicating that the arrays are not equal. If the loop completes
    without finding any differences, it returns true, indicating that the arrays are
    equal.'
