    # 88


    # Array Sort Colors


    The Dutch National Flag problem is a classic sorting problem where we need to
    sort an array containing 0s, 1s, and 2s in-place without using any extra space.
    We can solve this problem using three pointers to partition the array.


    Here’s the C++ code to solve the problem:


    #include <iostream>


    #include <vector>


    using namespace std;


    void sortColors(vector<int>& nums) {


        int low = 0;            // pointer to keep track of 0s


        int mid = 0;            // pointer to keep track of 1s


        int high = nums.size() - 1; // pointer to keep track of 2s


        while (mid <= high) {


            if (nums[mid] == 0) {


                swap(nums[low], nums[mid]);


                low++;


                mid++;


            }


            else if (nums[mid] == 1) {


                mid++;


            }


            else if (nums[mid] == 2) {


                swap(nums[mid], nums[high]);


                high--;


            }


        }


    }


    int main() {


        vector<int> nums = {2, 0, 1, 2, 1, 0};


        cout << "Original array: ";


        for (int num : nums) {


            cout << num << " ";


        }


        cout << endl;


        sortColors(nums);


        cout << "Sorted array: ";


        for (int num : nums) {


            cout << num << " ";


        }


        cout << endl;


        return 0;


    }


    Explanation:


    1.  We initialize three pointers: low, mid, and high. The low pointer keeps track
    of the next position to place 0, the mid pointer scans the array, and the high
    pointer keeps track of the next position to place 2.


    2.  We iterate over the array while the mid pointer is less than or equal to the
    high pointer.


    3.  If nums[mid] is 0, we swap it with the element at the low pointer and increment
    both low and mid pointers. This ensures that all 0s are placed at the beginning
    of the array.


    4.  If nums[mid] is 1, we simply increment the mid pointer and leave the element
    as it is since 1s should be in the middle of the sorted array.


    5.  If nums[mid] is 2, we swap it with the element at the high pointer and decrement
    the high pointer. This ensures that all 2s are placed at the end of the array.


    6.  We repeat steps 3 to 5 until mid pointer crosses the high pointer, which means
    the array has been sorted.


    After running the program, you will see the original array and the sorted array
    printed on the console.


    Note: This algorithm is known as the Dutch National Flag algorithm because it
    was used to sort an array representing the colors of the Dutch national flag,
    which has three colors: red, white, and blue, represented by 0, 1, and 2, respectively.


