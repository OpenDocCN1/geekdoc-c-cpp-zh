    # 60


    # Array Frequency Count


    There are multiple ways to track element frequencies in C++, either by using a
    map or an array. Let me explain both approaches to you.


    1.  Using a Map: Using a map allows you to associate each element of the array
    with its frequency. The key of the map represents the element, and the corresponding
    value represents its frequency.


    Here’s an example code that counts the frequency of each element in an array using
    a map:


    #include <iostream>


    #include <map>


    int main() {


        int arr[] = {1, 2, 3, 1, 2, 2, 4, 3, 1, 5};


        int size = sizeof(arr) / sizeof(arr[0]);


        std::map<int, int> frequencyMap;


        // Count the frequency of each element


        for (int i = 0; i < size; i++) {


            frequencyMap[arr[i]]++;


        }


        // Print the frequencies


        for (const auto& pair : frequencyMap) {


            std::cout << "Element " << pair.first << ": Frequency " << pair.second
    << std::endl;


        }


        return 0;


    }


    In this code, we define a map frequencyMap where the keys are the elements from
    the array, and the values are the corresponding frequencies. We iterate over the
    array, incrementing the frequency for each element in the map. Finally, we print
    the frequencies by iterating over the map and accessing the key-value pairs.


    1.  Using an Array: Another approach is to use an array to track the element frequencies.
    This approach works when the elements in the array have a limited range, such
    as integers in a specific range.


    Here’s an example code that counts the frequency of each element in an array using
    an array:


    #include <iostream>


    const int MAX_RANGE = 1000; // Maximum range of elements in the array


    int main() {


        int arr[] = {1, 2, 3, 1, 2, 2, 4, 3, 1, 5};


        int size = sizeof(arr) / sizeof(arr[0]);


        int frequency[MAX_RANGE] = {0}; // Initialize the frequency array with zeros


        // Count the frequency of each element


        for (int i = 0; i < size; i++) {


            frequency[arr[i]]++;


        }


        // Print the frequencies


        for (int i = 0; i < MAX_RANGE; i++) {


            if (frequency[i] > 0) {


                std::cout << "Element " << i << ": Frequency " << frequency[i] <<
    std::endl;


            }


        }


        return 0;


    }


    In this code, we define an array frequency of size MAX_RANGE to track the frequencies.
    The index of the array represents the element, and the value at that index represents
    its frequency. We iterate over the array, incrementing the frequency at the corresponding
    index. Finally, we print the frequencies by iterating over the frequency array
    and checking for non-zero values.


    Both approaches, using a map or an array, have their advantages and disadvantages.
    Using a map is more flexible and can handle elements with a wide range of values,
    but it requires extra memory to store the map. On the other hand, using an array
    is more memory-efficient but requires a limited range of elements.


    # 61


    # Array Median


    Here’s a C++ program that finds the median element in an array:


    #include <iostream>


    #include <algorithm>


    double findMedian(int arr[], int size) {


        // Sort the array


        std::sort(arr, arr + size);


        // Determine the median


        if (size % 2 == 0) {


            // If the size is even, average the middle two elements


            int midIndex = size / 2;


            return (arr[midIndex - 1] + arr[midIndex]) / 2.0;


        } else {


            // If the size is odd, return the middle element


            return arr[size / 2];


        }


    }


    int main() {


        // Example usage


        int array[] = {5, 3, 9, 1, 7};


        int size = sizeof(array) / sizeof(array[0]);


        double median = findMedian(array, size);


        std::cout << "Median: " << median << std::endl;


        return 0;


    }


    Explanation:


    1.  The findMedian function takes an array (arr) and its size (size) as input.


    2.  It uses the std::sort function from the <algorithm> library to sort the array
    in ascending order.


    3.  After sorting, it checks if the size of the array is even or odd.


    4.  If the size is even, it calculates the average of the two middle elements
    (arr[midIndex - 1] and arr[midIndex]), where midIndex is size / 2.


    5.  If the size is odd, it directly returns the middle element (arr[size / 2]).


    6.  In the main function, an example array is defined (array) along with its size
    (size).


    7.  The findMedian function is called with the array and size as arguments, and
    the result is stored in the median variable.


    8.  Finally, the median is printed to the console.'
