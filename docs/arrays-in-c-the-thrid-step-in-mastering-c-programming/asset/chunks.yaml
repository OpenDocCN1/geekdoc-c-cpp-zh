    # Array Minimum Size Subarray Sum


    Here’s an example of a C++ program that finds the minimum size of a subarray with
    a sum greater than or equal to a given target using the two-pointer technique:


    #include <iostream>


    #include <vector>


    #include <limits>


    int minSubarraySize(int target, const std::vector<int>& nums) {


        int n = nums.size();


        int left = 0;  // left pointer


        int sum = 0;   // current sum of subarray elements


        int minLength = std::numeric_limits<int>::max(); // initialize with maximum
    value


        for (int right = 0; right < n; ++right) {  // right pointer


            sum += nums[right];


            while (sum >= target) {  // shrink the subarray from the left


                minLength = std::min(minLength, right - left + 1);


                sum -= nums[left];


                left++;


            }


        }


        return (minLength == std::numeric_limits<int>::max()) ? 0 : minLength;


    }


    int main() {


        std::vector<int> nums = {2, 3, 1, 2, 4, 3};


        int target = 7;


        int result = minSubarraySize(target, nums);


        std::cout << "Minimum size of subarray with sum >= " << target << " is " <<
    result << std::endl;


        return 0;


    }


