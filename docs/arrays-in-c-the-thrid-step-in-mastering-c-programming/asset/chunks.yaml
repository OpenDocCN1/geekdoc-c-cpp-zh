    # 30


    # Array Subset


    Here’s a C++ program that checks if one array is a subset of another array:


    #include <iostream>


    #include <unordered_set>


    using namespace std;


    bool isSubset(int arr1[], int size1, int arr2[], int size2) {


        unordered_set<int> set;


        // Add all elements of arr1 to the set


        for (int i = 0; i < size1; i++) {


            set.insert(arr1[i]);


        }


        // Check if all elements of arr2 exist in the set


        for (int i = 0; i < size2; i++) {


            if (set.find(arr2[i]) == set.end()) {


                return false; // Element not found in set


            }


        }


        return true; // All elements found in set


    }


    int main() {


        int arr1[] = {1, 2, 3, 4, 5};


        int size1 = sizeof(arr1) / sizeof(arr1[0]);


        int arr2[] = {3, 4, 5};


        int size2 = sizeof(arr2) / sizeof(arr2[0]);


        if (isSubset(arr1, size1, arr2, size2)) {


            cout << "arr2 is a subset of arr1." << endl;


        } else {


            cout << "arr2 is not a subset of arr1." << endl;


        }


        return 0;


    }


    Explanation:


    1.  The isSubset function takes two arrays (arr1 and arr2) as input, along with
    their respective sizes (size1 and size2).


    2.  It uses an unordered_set called set to store all elements of arr1.


    3.  The first for loop iterates over arr1 and inserts each element into the set
    using the insert function.


    4.  The second for loop iterates over arr2 and checks if each element exists in
    the set using the find function. If an element is not found (find returns set.end()),
    it means it’s not a subset, and the function returns false.


    5.  If all elements of arr2 are found in the set, the function returns true.


    6.  In the main function, we define two arrays (arr1 and arr2) and their sizes
    (size1 and size2).


    7.  We call the isSubset function with these arrays and sizes, and based on the
    return value, we output whether arr2 is a subset of arr1 or not.


    In the provided example, the program will output “arr2 is a subset of arr1” because
    all elements of arr2 (3, 4, and 5) are present in arr1.


    # 31


    # Array Symmetry


    Here’s a C++ program that checks if an array is symmetric:


    #include <iostream>


    bool isSymmetric(int arr[], int size) {


        int start = 0;


        int end = size - 1;


        while (start <= end) {


            if (arr[start] != arr[end]) {


                return false;


            }


            start++;


            end--;


        }


        return true;


    }


    int main() {


        int arr[] = {1, 2, 3, 3, 2, 1};


        int size = sizeof(arr) / sizeof(arr[0]);


        if (isSymmetric(arr, size)) {


            std::cout << "Array is symmetric." << std::endl;


        } else {


            std::cout << "Array is not symmetric." << std::endl;


        }


        return 0;


