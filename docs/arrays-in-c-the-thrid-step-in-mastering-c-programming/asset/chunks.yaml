  trans: "\n当对数组使用 `sizeof` 运算符时，它会返回数组的总大小，该大小通过数组中每个元素的大小乘以元素的个数计算得出。例如，如果你有一个包含\
    \ 10 个元素的整数数组，且每个整数占用 4 字节内存，那么 `sizeof` 运算符将返回 40（10 个元素 * 每个元素 4 字节）。\n\n以下是一个展示如何在数组中使用\
    \ `sizeof` 的示例：\n\n```cpp\n#include <iostream>\n\nint main() {\n    int numbers[]\
    \ = {1, 2, 3, 4, 5};\n    int size = sizeof(numbers) / sizeof(numbers[0]);\n \
    \   std::cout << \"Size of the array: \" << size << std::endl;\n    std::cout\
    \ << \"Size of each element: \" << sizeof(numbers[0]) << \" bytes\" << std::endl;\n\
    \    std::cout << \"Total size of the array: \" << sizeof(numbers) << \" bytes\"\
    \ << std::endl;\n    return 0;\n}\n```\n\n在这个示例中，`sizeof(numbers)` 给你 `numbers`\
    \ 数组的总大小，而 `sizeof(numbers[0])` 给你数组中每个元素的大小。通过将总大小除以每个元素的大小，你可以确定数组中元素的个数。\n\n\
    注意，`sizeof` 运算符在编译时确定数组的大小，因此它不会给你动态分配的数组或作为函数参数传递的数组元素个数（除非它是引用或指针）。在这些情况下，你需要单独跟踪大小。\n\
    \n# 数组修改\n\n这里有一个修改数组元素的 C++ 程序示例：\n\n```cpp\n#include <iostream>\n\nint main()\
    \ {\n    const int SIZE = 5;\n    int numbers[SIZE];\n    // 使用一些值初始化数组\n    for\
    \ (int i = 0; i < SIZE; i++) {\n        numbers[i] = i + 1;\n    }\n    // 打印原始数组\n\
    \    std::cout << \"Original array: \";\n    for (int i = 0; i < SIZE; i++) {\n\
    \        std::cout << numbers[i] << \" \";\n    }\n    std::cout << std::endl;\n\
    \    // 修改数组的单个元素\n    numbers[0] = 10;\n    numbers[2] = 20;\n    numbers[4]\
    \ = 30;\n    // 打印修改后的数组\n    std::cout << \"Modified array: \";\n    for (int\
    \ i = 0; i < SIZE; i++) {\n        std::cout << numbers[i] << \" \";\n    }\n\
    \    std::cout << std::endl;\n    return 0;\n}\n```\n\n在该程序中，我们声明了一个大小为 `SIZE`\
    \ 的数组 `numbers`（在此示例中被设置为 5）。然后，我们使用循环给数组的元素分配初始值。在这种情况下，我们将从 1 到 `SIZE` 的值分配给数组元素。\n\
    \n要给数组的单个元素分配新值，我们使用数组索引法。例如，`numbers[0] = 10;` 将值 10 赋值给数组的第一个元素，`numbers[2]\
    \ = 20;` 将 20 赋值给第三个元素，`numbers[4] = 30;` 将 30 赋值给第五个元素。\n\n最后，我们使用另一个循环在修改前后分别打印数组元素，以验证更改。\n\
    \n在修改数组时，确保用于访问数组元素的索引在数组边界内是非常重要的。否则，可能会导致未定义行为或运行时错误。\n\n# 数组遍历\n\n数组遍历是指访问数组中的每个元素并对其进行某些操作的过程。在\
    \ C++ 中，数组遍历通常使用循环完成，例如“for”循环或“while”循环。\n\n这里是一个展示使用“for”循环进行数组遍历的示例程序：\n\n\
    ```cpp\n#include <iostream>\n\nint main() {\n    int arr[] = {1, 2, 3, 4, 5};\
    \  // 示例数组\n    // 使用 for 循环遍历数组\n    for (int i = 0; i < sizeof(arr) / sizeof(arr[0]);\
    \ i++) {\n        // 对每个元素执行操作\n        std::cout << arr[i] << \" \"; // 元素\n\
    \    }\n    return 0;\n}\n```\n\n在程序程序中，我们有一个包含一些元素的整数数组 `arr`。`sizeof(arr) /\
    \ sizeof(arr[0])` 计算了数组的长度。我们使用“for”循环遍历数组，从索引 0 开始，一直到索引达到数组长度减 1。\n\n在循环内部，你可以对每个元素执行任何操作。在给定的示例中，我们简单地使用\
    \ `std::cout` 打印每个元素。你可以将此行替换为任何想要在元素上执行的操作或计算。循环将遍历数组的每个元素，并对每个元素执行指定的操作。通过这种方式，你可以逐个处理每个元素，而无需为每个元素编写重复的代码。数组遍历是编程中的一个基本概念，广泛应用于搜索、过滤或修改元素等任务。\n\
    \n# 排序\n\n冒泡排序（Bubble Sort）算法通过在相邻元素顺序错误时反复交换它们来工作。这个过程一直持续到整个数组排序完成。这里有一个示例：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\n// 交换两个元素\nvoid swap(int&\
    \ a, int& b) {\n    int temp = a;\n    a = b;\n    b = temp;\n}\n\n// 执行冒泡排序\n\
    void bubbleSort(int arr[], int size) {\n    for (int i = 0; i < size - 1; ++i)\
    \ {\n        // 最后 i 个元素已经就绪\n        for (int j = 0; j < size - i - 1; ++j) {\n\
    \            // 如果当前元素大于下一个元素，则交换\n            if (arr[j] > arr[j + 1]) {\n  \
    \              swap(arr[j], arr[j + 1]);\n            }\n        }\n    }\n}\n\
    \n// 打印数组\nvoid printArray(int arr[], int size) {\n    for (int i = 0; i < size;\
    \ ++i) {\n        cout << arr[i] << \" \";\n    }\n    cout << endl;\n}\n\nint\
    \ main() {\n    int arr[] = {5, 2, 8, 12, 1, 6};\n    int size = sizeof(arr) /\
    \ sizeof(arr[0]);\n    cout << \"Original array: \";\n    printArray(arr, size);\n\
    \    bubbleSort(arr, size);\n    cout << \"Sorted array: \";\n    printArray(arr,\
    \ size);\n    return 0;\n}\n```\n\n接收数组及其大小作为参数。它使用嵌套循环遍历数组并比较相邻元素。如果当前元素大于下一个元素，则通过\
    \ `swap` 函数进行交换。\n\n外层循环 `i` 控制迭代次数，等于数组的大小减 1。内层循环 `j` 比较并交换直到未排序部分的结束。\n\n最后，我们使用\
    \ `printArray` 函数显示原始和排序后的数组。\n\n当你运行此程序时，输出将是：\nOriginal array: 5 2 8 12 1 6\n\
    Sorted array: 1 2 5 6 8 12\n\n元素通过冒泡排序成功排序。\n\n我要解释的下一个排序算法是选择排序（Selection Sort）。它通过将数组分为两个部分：开头的排序部分和结尾的未排序部分来工作。该算法反复从未排序部分找到最小（或最大）元素，并与未排序部分的第一个元素交换。这个过程一直持续到整个数组排序完成。\n\
    \n选择排序的 C++ 实现：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\n// 交换两个元素\n\
    void swap(int& a, int& b) {\n    int temp = a;\n    a = b;\n    b = temp;\n}\n\
    \n// 执行选择排序\nvoid selectionSort(int arr[], int size) {\n    for (int i = 0; i\
    \ < size - 1; ++i) {\n        // 在未排序部分找到最小元素\n        int minIndex = i;\n   \
    \     for (int j = i + 1; j < size; ++j) {\n            if (arr[j] < arr[minIndex])\
    \ {\n                minIndex = j;\n            }\n        }\n        // 将找到的最小元素与未排序部分的第一个元素交换\n\
    \        swap(arr[i], arr[minIndex]);\n    }\n}\n\n// 打印数组\nvoid printArray(int\
    \ arr[], int size) {\n    for (int i = 0; i < size; ++i) {\n        cout << arr[i]\
    \ << \" \";\n    }\n    cout << endl;\n}\n\nint main() {\n    int arr[] = {64,\
    \ 25, 12, 22, 11, 13};\n    int size = sizeof(arr) / sizeof(arr[0]);\n    cout\
    \ << \"Original array: \";\n    printArray(arr, size);\n    selectionSort(arr,\
    \ size);\n    cout << \"Sorted array: \";\n    printArray(arr, size);\n    return\
    \ 0;\n}\n```\n"
