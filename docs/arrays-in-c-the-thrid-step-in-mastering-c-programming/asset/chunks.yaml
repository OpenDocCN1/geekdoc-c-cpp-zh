    \n在这段代码中，我们使用 `unordered_map` (`frequencyMap`) 来存储数组中每个元素的频率。我们遍历数组，更新频率，并记录频率最高的元素\
    \ (`maxElement`)。\n\n注意，`unordered_map` 的插入和检索平均复杂度为常数，这使得它处理该问题非常高效。\n\n# 相邻元素最大子数组和\n\
    \n这是一个 C++ 程序，用于找到数组中满足“不能包含相邻元素”约束的最大子数组和。该程序使用了动态规划来解决这个问题。\n\n```cpp\n#include\
    \ <iostream>\n#include <vector>\nusing namespace std;\n\nint maxSubarraySum(vector<int>&\
    \ arr) {\n    int n = arr.size();\n    if (n == 0) {\n        return 0;\n    }\n\
    \    if (n == 1) {\n        return arr[0];\n    }\n    int incl = arr[0];\n  \
    \  int excl = 0;\n    for (int i = 1; i < n; i++) {\n        int temp = max(incl,\
    \ excl);\n        incl = excl + arr[i];\n        excl = temp;\n    }\n    return\
    \ max(incl, excl);\n}\n\nint main() {\n    vector<int> arr = {2, 4, 6, 8, 5, 9,\
    \ 3};\n    int maxSum = maxSubarraySum(arr);\n    cout << \"相邻元素最大子数组和: \" <<\
    \ maxSum << endl;\n    return 0;\n}\n```\n\n### 解释\n\n* 程序接收一个输入数组 `arr` 并找到不包含相邻元素的子数组的最大和。\n\
    * 我们初始化两个变量 `incl` 和 `excl`，分别存储包含当前元素和不包含当前元素的最大和。\n* 我们从第二个元素（索引 1）开始遍历数组并更新\
    \ `incl` 和 `excl` 的值。\n* 在每次迭代中，我们通过选择 `incl` 和 `excl` 的较大值来计算目前的最大和 (`temp`)。\n\
    * 为了更新 `incl`，我们将当前元素加到 `excl` 上，因为不能包含相邻元素。\n* 为了更新 `excl`，我们将其赋值为 `temp`，这代表了目前为止的最大和。\n\
    * 最后，我们返回 `incl` 和 `excl` 中的最大值，这代表了不相邻元素子数组的最大和。\n\n在提供的示例中，不相邻元素的最大子数组和为 27，对应的子数组为\
    \ {2, 6, 5, 3}。\n\n# 数组完美峰值\n\n使用 C++ 寻找数组中的完美峰值（perfect peak element）可以遵循以下步骤：\n\
    \n1. 从数组的第二个元素到倒数第二个元素遍历。\n2. 对于每个元素，将其与其相邻元素进行比较。\n3. 如果当前元素大于它的相邻元素，则它是一个完美峰值。\n\
    4. 返回找到的第一个完美峰值的索引或值，或任何所需的输出。\n\n以下是实现上述方法的 C++ 代码：\n\n```cpp\n#include <iostream>\n\
    #include <vector>\n\n// 查找数组中的完美峰值\nint findPerfectPeak(const std::vector<int>&\
    \ arr) {\n    int n = arr.size();\n    for (int i = 1; i < n - 1; i++) {\n   \
    \     if (arr[i] > arr[i - 1] && arr[i] > arr[i + 1]) {\n            return arr[i];\
    \ // 返回峰值的值\n            // 也可以通过返回索引：\n            // return i;\n        }\n\
    \    }\n    return -1; // 如果未找到完美峰值则返回 -1\n}\n\nint main() {\n    std::vector<int>\
    \ arr = {1, 3, 5, 4, 2};\n    int peak = findPerfectPeak(arr);\n    if (peak !=\
    \ -1) {\n        std::cout << \"完美峰值: \" << peak << std::endl;\n    } else {\n\
    \        std::cout << \"未找到完美峰值。\" << std::endl;\n    }\n    return 0;\n}\n```\n\
    \n"
