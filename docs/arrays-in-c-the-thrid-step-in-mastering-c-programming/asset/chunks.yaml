    partitioned correctly.


    When you run the program, it will output the sorted array as:


    Before sorting: 2 0 1 1 0 2 1 0


    After sorting: 0 0 0 1 1 1 2 2


    The Dutch National Flag algorithm efficiently sorts the array in a single pass
    by maintaining three pointers, avoiding multiple iterations and achieving a time
    complexity of O(n), where n is the size of the array.


