    # Array Sliding Window Maximum


    Here’s an example program in C++ that finds the maximum element in every contiguous
    subarray of size k using a deque:


    #include <iostream>


    #include <deque>


    #include <vector>


    using namespace std;


    vector<int> findMaxSlidingWindow(const vector<int>& nums, int k) {


        vector<int> result;


        deque<int> dq;


        // Process the first k elements separately


        for (int i = 0; i < k; i++) {


            // Remove all elements smaller than the current element


            while (!dq.empty() && nums[i] >= nums[dq.back()])


                dq.pop_back();


            dq.push_back(i);


        }


        // Process the remaining elements


        for (int i = k; i < nums.size(); i++) {


            // The front element of the deque is the maximum for the previous window


            result.push_back(nums[dq.front()]);


            // Remove elements outside the current window


            while (!dq.empty() && dq.front() <= i - k)


                dq.pop_front();


            // Remove all elements smaller than the current element


            while (!dq.empty() && nums[i] >= nums[dq.back()])


                dq.pop_back();


            dq.push_back(i);


        }


        // Add the maximum of the last window


        result.push_back(nums[dq.front()]);


        return result;


    }


