    # 26


    # Array Palindrome


    Here’s a C++ program that checks if an array is a palindrome:


    #include <iostream>


    using namespace std;


    bool isPalindrome(int arr[], int size) {


        int start = 0;


        int end = size - 1;


        while (start < end) {


            if (arr[start] != arr[end]) {


                return false;


            }


            start++;


            end--;


        }


        return true;


    }


    int main() {


        int arr[] = {1, 2, 3, 2, 1};


        int size = sizeof(arr) / sizeof(arr[0]);


        if (isPalindrome(arr, size)) {


            cout << "The array is a palindrome." << endl;


        } else {


            cout << "The array is not a palindrome." << endl;


        }


        return 0;


    }


    In this program, the isPalindrome function is defined to check whether an array
    is a palindrome. It takes two parameters: arr, which is the array to be checked,
    and size, which is the size of the array.


    The function uses two indices, start and end, to compare elements from the beginning
    and end of the array. It starts by initializing start to 0 (the first element)
    and end to size - 1 (the last element).


    The function enters a while loop that continues as long as start is less than
    end. Inside the loop, it compares arr[start] and arr[end]. If they are not equal,
    it means the array is not a palindrome, and the function returns false.


    If the elements are equal, the function increments start and decrements end to
    move towards the center of the array. This process continues until start becomes
    greater than or equal to end.


    If the while loop finishes without encountering any non-matching elements, the
    function returns true, indicating that the array is a palindrome.


    In the main function, an example array is defined, and its size is calculated
    using the sizeof operator. The isPalindrome function is then called with the array
    and its size as arguments. Based on the return value, it prints whether the array
    is a palindrome or not.


    Note that this program assumes that the array contains integer elements. You can
    modify it to work with other data types by changing the function signature and
    adjusting the comparison logic accordingly.


    # 27


    # Array Intersection


    Here’s an example program in C++ that finds the intersection of two arrays:


    #include <iostream>


    #include <unordered_set>


    #include <vector>


    std::vector<int> findIntersection(const std::vector<int>& array1, const std::vector<int>&
    array2) {


        std::unordered_set<int> set1(array1.begin(), array1.end());  // Convert array1
    to a set


        std::vector<int> result;


        for (const auto& element : array2) {


            if (set1.count(element) > 0) {


                result.push_back(element);  // Add common elements to the result vector


                set1.erase(element);        // Remove element from set1 to avoid duplicates


            }


        }


        return result;


    }


    int main() {


        std::vector<int> array1 = {1, 2, 3, 4, 5};


        std::vector<int> array2 = {3, 4, 5, 6, 7};


        std::vector<int> intersection = findIntersection(array1, array2);


        std::cout << "Intersection: ";


        for (const auto& element : intersection) {


            std::cout << element << " ";


        }


        std::cout << std::endl;


        return 0;


    }


    In this program, we define the findIntersection function that takes two vectors
    (array1 and array2) as input and returns a new vector containing the common elements.
    Here’s how the function works:


    1.  We create an unordered set (set1) from array1 to efficiently check for the
    existence of elements during comparison.


    2.  We initialize an empty vector (result) to store the common elements.'
