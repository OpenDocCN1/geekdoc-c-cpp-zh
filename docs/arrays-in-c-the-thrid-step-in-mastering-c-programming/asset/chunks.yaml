    # Array Maximum Area of Histogram


    Here’s a C++ program that finds the maximum rectangular area that can be formed
    from a histogram represented by an array of heights using a stack:


    #include <iostream>


    #include <stack>


    using namespace std;


    int findMaxArea(int heights[], int n) {


        stack<int> st;


        int maxArea = 0;


        int area = 0;


        int i = 0;


        while (i < n) {


            if (st.empty() || heights[st.top()] <= heights[i]) {


                st.push(i);


                i++;


            } else {


                int top = st.top();


                st.pop();


                area = heights[top] * (st.empty() ? i : (i - st.top() - 1));


                if (area > maxArea)


                    maxArea = area;


            }


        }


        while (!st.empty()) {


            int top = st.top();


            st.pop();


            area = heights[top] * (st.empty() ? i : (i - st.top() - 1));


            if (area > maxArea)


                maxArea = area;


        }


        return maxArea;


    }


    int main() {


        int heights[] = {2, 1, 5, 6, 2, 3};


        int n = sizeof(heights) / sizeof(heights[0]);


        int maxArea = findMaxArea(heights, n);


        cout << "Maximum rectangular area: " << maxArea << endl;


        return 0;


    }


    Explanation:


    1.  We use a stack to store the indices of the histogram bars in non-decreasing
    order of their heights.


    2.  We iterate through the array of heights and for each height:


    *   If the stack is empty or the current height is greater than or equal to the
    height at the top of the stack, we push the current index onto the stack and move
    to the next index.'
