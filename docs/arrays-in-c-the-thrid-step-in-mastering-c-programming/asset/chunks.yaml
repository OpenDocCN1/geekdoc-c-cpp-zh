    # 46


    # Array Circular Subarray Sum


    To find the maximum sum of a circular subarray in an array, we can modify Kadane’s
    algorithm slightly. Kadane’s algorithm is used to find the maximum sum of a subarray
    in a linear array. By modifying it, we can handle circular subarrays as well.


    Here’s how you can write a C++ program to find the maximum sum of a circular subarray
    using the modified Kadane’s algorithm:


    #include <iostream>


    #include <vector>


    #include <algorithm>


    int kadane(std::vector<int>& arr) {


        int maxSum = arr[0];


        int currentSum = arr[0];


        for (int i = 1; i < arr.size(); i++) {


            currentSum = std::max(arr[i], currentSum + arr[i]);


            maxSum = std::max(maxSum, currentSum);


        }


        return maxSum;


    }


    int maxCircularSubarraySum(std::vector<int>& arr) {


        int linearMaxSum = kadane(arr);  // Maximum sum of a linear subarray


        // If all elements are negative, linearMaxSum is the answer


        if (linearMaxSum < 0)


            return linearMaxSum;


        int arraySum = 0;


        for (int i = 0; i < arr.size(); i++) {


            arraySum += arr[i];


            arr[i] = -arr[i];  // Negate the elements of the array


        }


        int circularMaxSum = arraySum + kadane(arr);


        return std::max(linearMaxSum, circularMaxSum);


    }


    int main() {


        std::vector<int> arr = { 8, -4, 3, -5, 4 };


        int maxSum = maxCircularSubarraySum(arr);


        std::cout << "Maximum circular subarray sum: " << maxSum << std::endl;


        return 0;


    }


    In this program, the kadane function is the modified Kadane’s algorithm that finds
    the maximum sum of a linear subarray. The maxCircularSubarraySum function first
    calculates the maximum sum of a linear subarray using kadane and stores it in
    linearMaxSum. If the linearMaxSum is negative, it means that all elements in the
    array are negative, and in this case, we return the linearMaxSum as the result.


    Otherwise, we calculate the total sum of all elements in the array and negate
    each element. Then, we pass this modified array to kadane to find the maximum
    sum of a subarray that wraps around from the end to the beginning of the array.
    The sum of this circular subarray is calculated by adding the total sum of the
    array to the maximum sum of the modified array.


    Finally, we return the maximum of the linearMaxSum and circularMaxSum as the result,
    which represents the maximum sum of a circular subarray in the given array.


    In the example above, the maximum circular subarray sum is 15, which corresponds
    to the subarray [3, -5, 4, 8, -4].


    # 47


    # Array Kth Smallest Element


    To find the Kth smallest element in an array using sorting or partitioning algorithms,
    you can follow these steps:


    1.  Sorting Algorithm Approach:


    *   Initialize the array with the given elements.


    *   Sort the array in ascending order using any efficient sorting algorithm, such
    as quicksort, mergesort, or heapsort.


    *   The Kth smallest element will then be located at the index (K – 1) in the
    sorted array, considering 0-based indexing.


    *   Return the element at that index.


    Here’s an example implementation using the sorting approach:


    #include <iostream>


    #include <algorithm>


    int findKthSmallest(int arr[], int size, int k) {


        std::sort(arr, arr + size);  // Sort the array


        return arr[k - 1];  // Return the Kth smallest element


    }


    int main() {


        int arr[] = {10, 2, 8, 4, 6, 5};


        int size = sizeof(arr) / sizeof(arr[0]);


        int k = 3;


        int kthSmallest = findKthSmallest(arr, size, k);


        std::cout << "The " << k << "th smallest element is: " << kthSmallest << std::endl;


        return 0;


