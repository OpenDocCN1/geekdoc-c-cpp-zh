- fmt: "\nIn addition to one-dimensional arrays, C++ supports multidimensional arrays.\
    \ The most common is the two-dimensional array, often used to represent matrices.\n\
    \nDeclaration and initialization of a 2D array can be done as follows:\n\n```cpp\n\
    int matrix[2][3] = {\n    {1, 2, 3},\n    {4, 5, 6}\n};\n```\n\nHere, `matrix`\
    \ is a two-dimensional array that contains 2 arrays, each with 3 elements. To\
    \ access the elements, we use two indices:\n\n```cpp\ncout << matrix[0][0]; //\
    \ Outputs 1\ncout << matrix[1][2]; // Outputs 6\n```\n\n## Arrays and Loops\n\n\
    Arrays are often used with loops. For instance, if we wanted to output all elements\
