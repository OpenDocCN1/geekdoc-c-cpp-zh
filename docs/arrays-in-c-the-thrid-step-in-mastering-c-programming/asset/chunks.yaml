  raw: 'To solve the Array Three Sum problem using sorting and the two-pointers technique
    in C++, you can follow these steps:


    1.  Sort the given array in non-decreasing order. This step is crucial for the
    two-pointers technique to work efficiently.


    2.  Initialize an empty vector to store the unique triplets that add up to the
    target sum.


    3.  Iterate through the sorted array up to the second-to-last element. For each
    element at index i, perform the two-pointers technique on the remaining array
    elements to find pairs that add up to the target sum.


    4.  Within the iteration, set two pointers: left pointing to i+1, and right pointing
    to the last element of the array.


    5.  While left is less than right, perform the following steps:


    *   Calculate the current sum as arr[i] + arr[left] + arr[right].


    *   If the current sum is equal to the target sum, add the triplet [arr[i], arr[left],
    arr[right]] to the result vector and increment left and decrement right to find
    more possible solutions.


    *   If the current sum is less than the target sum, increment left to increase
    the sum.


    *   If the current sum is greater than the target sum, decrement right to decrease
    the sum.


    1.  Continue the iteration until all possible combinations have been examined.


    Here’s the C++ implementation of the above algorithm:


    #include <iostream>


    #include <vector>


    #include <algorithm>


    using namespace std;


    vector<vector<int>> threeSum(vector<int>& nums, int target) {


        vector<vector<int>> result;


        int n = nums.size();


        // Sort the array in non-decreasing order


        sort(nums.begin(), nums.end());


        // Iterate through the array


        for (int i = 0; i < n - 2; i++) {


            // Two-pointers technique


            int left = i + 1;


            int right = n - 1;


            while (left < right) {


                int sum = nums[i] + nums[left] + nums[right];


                if (sum == target) {


                    result.push_back({nums[i], nums[left], nums[right]});


                    // Skip duplicates for left pointer


                    while (left < right && nums[left] == nums[left + 1])


                        left++;


                    // Skip duplicates for right pointer


                    while (left < right && nums[right] == nums[right - 1])


                        right--;


                    left++;


                    right--;


                } else if (sum < target) {


                    left++;


                } else {


                    right--;


                }


            }


            // Skip duplicates for the current element


            while (i < n - 2 && nums[i] == nums[i + 1])


                i++;


        }


        return result;


    }


    int main() {


        vector<int> nums = {-1, 0, 1, 2, -1, -4};


        int target = 0;


        vector<vector<int>> triplets = threeSum(nums, target);


        // Display the triplets that add up to the target sum


        for (const auto& triplet : triplets) {


            for (int num : triplet) {


                cout << num << " ";


            }


            cout << endl;


        }


        return 0;


    }


    In the above example, the input array nums contains [-1, 0, 1, 2, -1, -4], and
    the target sum is 0\. The program finds the unique triplets that add up to the
    target sum using the sorting and two-pointers technique and displays them as output.


    # 65


    # Array Two Sum


    Approach 1: Using a Map


    1.  Initialize an empty map, let’s call it “numMap,” where the key will be the
    array element, and the value will be its index.


    2.  Iterate through the array elements using a loop.


    3.  For each element, calculate the difference between the target sum and the
    current element. Let’s call this difference “complement.”


    4.  Check if the complement exists in the map. If it does, return the indices
    of the current element and its complement.


    5.  If the complement is not found in the map, insert the current element and
    its index into the map.


    6.  If the loop finishes without finding a solution, it means there are no two
    elements that add up to the target sum.


    Here’s the code implementation:


    #include <iostream>


    #include <unordered_map>


    #include <vector>


    std::vector<int> twoSum(std::vector<int>& nums, int target) {


        std::unordered_map<int, int> numMap;


        std::vector<int> result;


        for (int i = 0; i < nums.size(); ++i) {


            int complement = target - nums[i];


            if (numMap.count(complement)) {


                result.push_back(numMap[complement]);


                result.push_back(i);


                break;


            }


            numMap[nums[i]] = i;


        }


        return result;


    }


    int main() {


        std::vector<int> nums = {2, 7, 11, 15};


        int target = 9;


        std::vector<int> result = twoSum(nums, target);


        if (result.size() == 2) {


            std::cout << "Indices: " << result[0] << ", " << result[1] << std::endl;


            std::cout << "Elements: " << nums[result[0]] << ", " << nums[result[1]]
    << std::endl;


        } else {


            std::cout << "No solution found." << std::endl;


        }


        return 0;


    }


    Approach 2: Using Two Pointers


    1.  Sort the array in non-decreasing order.


    2.  Initialize two pointers, “left” and “right,” pointing to the beginning and
    end of the array, respectively.


    3.  Iterate while the “left” pointer is less than the “right” pointer.


    4.  Calculate the sum of the elements at the “left” and “right” pointers.


    5.  If the sum is equal to the target, return the indices of the elements at the
    “left” and “right” pointers.


    6.  If the sum is less than the target, increment the “left” pointer.


    7.  If the sum is greater than the target, decrement the “right” pointer.


    8.  If the loop finishes without finding a solution, it means there are no two
    elements that add up to the target sum.


    Here’s the code implementation:


    #include <iostream>


    #include <vector>


    #include <algorithm>


    std::vector<int> twoSum(std::vector<int>& nums, int target) {


        std::vector<int> result;


        std::vector<int> sortedNums = nums; // Create a copy of the input array


        std::sort(sortedNums.begin(), sortedNums.end()); // Sort the array in non-decreasing
    order


        int left = 0;


        int right = sortedNums.size() - 1;


        while (left < right) {


            int sum = sortedNums[left] + sortedNums[right];


            if (sum == target) {


                // Find the indices of the elements in the original array


                int indexLeft = std::find(nums.begin(), nums.end(), sortedNums[left])
    - nums.begin();


                int indexRight = std::find(nums.begin(), nums.end(), sortedNums[right])
    - nums.begin();


                result.push_back(indexLeft);


                result.push_back(indexRight);


                break;


            } else if (sum < target) {


                left++;


            } else {


                right--;


            }


        }


        return result;


    }


    int main() {


        std::vector<int> nums = {2, 7, 11, 15};


        int target = 9;


        std::vector<int> result = twoSum(nums, target);


        if (result.size() == 2) {


            std::cout << "Indices: " << result[0] << ", " << result[1] << std::endl;


            std::cout << "Elements: " << nums[result[0]] << ", " << nums[result[1]]
    << std::endl;


        } else {


            std::cout << "No solution found." << std::endl;


        }


        return 0;


    }


    Both approaches will give you the indices of two elements in the array that add
    up to the target sum. You can modify the code according to your requirements and
    input format.


    # 66


    # Array Valid Mountain


    To determine if an array represents a valid mountain in C++, we need to check
    the following conditions:


    1.  The array must have at least three elements.


    2.  The elements of the array must be strictly increasing until a peak is reached.


    3.  After reaching the peak, the elements must be strictly decreasing until the
    end of the array.


    To traverse the array and check these conditions, we can follow these steps:


    1.  Initialize an index variable, “i,” to 0 and check if the array size is less
    than 3\. If it is, return false as it cannot form a valid mountain.'
