    The program uses the concept of prefix sums and a hash map (unordered_map) to
    solve the problem efficiently.


    1.  We start by initializing an unordered_map called prefixSums to store the prefix
    sums encountered during the iteration.


    2.  We also declare a vector called result to store the starting and ending indices
    of the zero sum subarray (if found).


    3.  We initialize a variable sum to keep track of the current prefix sum.


    4.  We iterate through the array arr using a for loop.


    5.  In each iteration, we update the sum by adding the current element arr[i].


    6.  We check if the sum is zero. If it is, that means we have found a zero sum
    subarray from index 0 to i. We update the result vector accordingly and return
    it.


    7.  If the sum is not zero, we check if the current prefix sum sum exists in the
    prefixSums map. If it does, that means we have found a zero sum subarray from
    index prefixSums[sum]+1 to i. We update the result vector and return it.


    8.  If the current prefix sum does not exist in the prefixSums map, we store it
    along with its index i in the map.


    9.  After the loop finishes, if no zero sum subarray is found, an empty result
    vector is returned.


    10.  In the main function, we create an example array arr and call the findZeroSumSubarray
    function to get the result.


    11.  If the result vector is not empty, we print the indices of the zero sum subarray
    and the elements of the subarray itself. Otherwise, we print a message indicating
    that no zero sum subarray was found.


    Using prefix sums and hashing techniques helps us achieve an efficient time complexity
    of O(N), where N is the size of the input array. The space complexity is also
    O(N) due to the storage of prefix sums in the unordered_map.


