    \ maxSum = maxSubarraySum(arr, size);\n    std::cout << \"Maximum sum of subarray:\
    \ \" << maxSum << std::endl;\n    return 0;\n}\n```\n\n解释：Kadane 算法是一种在线性时间复杂度内解决最大和问题的高效算法。它使用了动态规划的方法。该算法从左到右扫描数组，跟踪到为止发现的最大和\
    \ (`maxSum`) 和当前子数组的和 (`currentSum`)。在每个元素处，算法将该元素加到 `currentSum` 中。如果 `currentSum`\
    \ 大于 `maxSum`，则更新 `maxSum` 为 `currentSum` 的新值。如果 `currentSum` 变为负数，意味着包含当前元素将减少和，因此算法将\
