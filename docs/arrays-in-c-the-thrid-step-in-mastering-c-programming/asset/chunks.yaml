    # 99


    # Array Count Inversions


    To count the number of inversions in an array, you can indeed use either merge
    sort or a Fenwick tree. Both approaches provide efficient solutions to this problem.
    Here’s an explanation of how to implement them:


    Using Merge Sort:


    1.  Implement a function that performs merge sort on the array. This function
    should take the array, its start index, and end index as parameters.


    2.  Divide the array into two halves and recursively sort each half using merge
    sort.


    3.  Merge the two sorted halves into a single sorted array while counting the
    inversions. To count inversions during the merge step, whenever an element from
    the right subarray is smaller than an element from the left subarray, increment
    the inversion count by the number of remaining elements in the left subarray.


    4.  Finally, return the inversion count.


    Here’s the C++ code for the merge sort approach:


    #include <iostream>


    using namespace std;


    long long mergeAndCount(int arr[], int temp[], int left, int mid, int right) {


        int i = left;


        int j = mid + 1;


        int k = left;


        long long inversionCount = 0;


        while (i <= mid && j <= right) {


            if (arr[i] <= arr[j]) {


                temp[k++] = arr[i++];


            } else {


                temp[k++] = arr[j++];


                inversionCount += mid - i + 1;


            }


        }


        while (i <= mid) {


            temp[k++] = arr[i++];


        }


        while (j <= right) {


            temp[k++] = arr[j++];


        }


        for (i = left; i <= right; i++) {


            arr[i] = temp[i];


        }


        return inversionCount;


    }


    long long mergeSort(int arr[], int temp[], int left, int right) {


        long long inversionCount = 0;


        if (left < right) {


            int mid = (left + right) / 2;


            inversionCount += mergeSort(arr, temp, left, mid);


            inversionCount += mergeSort(arr, temp, mid + 1, right);


            inversionCount += mergeAndCount(arr, temp, left, mid, right);


        }


        return inversionCount;


    }


    long long countInversions(int arr[], int size) {


        int* temp = new int[size];


        return mergeSort(arr, temp, 0, size - 1);


    }


    int main() {


        int arr[] = {5, 3, 2, 4, 1};


        int size = sizeof(arr) / sizeof(arr[0]);


        long long inversionCount = countInversions(arr, size);


        cout << "Number of inversions: " << inversionCount << endl;


        return 0;


    }


    Using Fenwick Tree:


    1.  Implement a Fenwick tree data structure (also known as Binary Indexed Tree)
    to efficiently count inversions.


    2.  Initialize the Fenwick tree with all zeros.


    3.  Traverse the given array from right to left. For each element, query the Fenwick
    tree to find the sum of elements that are greater than the current element.


    4.  Add the current element to the Fenwick tree by updating the corresponding
    index.


    5.  Repeat steps 3 and 4 until all elements have been processed.


    6.  The total count of inversions will be the sum of inversions obtained in each
    step.


    7.  Return the inversion count.


    Here’s the C++ code for the Fenwick tree approach:


    #include <iostream>


    using namespace std;


    int getSum(int BIT[], int index) {


        int sum = 0;


        while (index > 0) {


            sum += BIT[index];


            index -= index & (-index);


        }


        return sum;


    }


    void updateBIT(int BIT[], int n, int index, int value) {


        while (index <= n) {


            BIT[index] += value;


            index += index & (-index);


        }


    }


    long long countInversions(int arr[], int size) {


        int maxElement = 0;


        for (int i = 0; i < size; i++) {


            maxElement = max(maxElement, arr[i]);


        }


        int* BIT = new int[maxElement + 1];


        for (int i = 1; i <= maxElement; i++) {


            BIT[i] = 0;


        }


        long long inversionCount = 0;


        for (int i = size - 1; i >= 0; i--) {


            inversionCount += getSum(BIT, arr[i] - 1);


            updateBIT(BIT, maxElement, arr[i], 1);


        }


        delete[] BIT;


        return inversionCount;


    }


    int main() {


        int arr[] = {5, 3, 2, 4, 1};


        int size = sizeof(arr) / sizeof(arr[0]);


        long long inversionCount = countInversions(arr, size);


        cout << "Number of inversions: " << inversionCount << endl;


        return 0;


    }


    Both approaches will yield the same output:


    Number of inversions: 8


    Feel free to modify the code as per your requirements and use it to count inversions
    in different arrays.


