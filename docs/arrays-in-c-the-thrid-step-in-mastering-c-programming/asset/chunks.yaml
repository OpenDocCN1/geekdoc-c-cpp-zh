    ## 检查数组是否包含连续元素

    - 示例：排序数组并检查连续值。


    ## 数组峰值与谷值

    - 重新排列数组，使得每个元素大于（峰值）或小于（谷值）其邻居元素。

    - 示例：排序数组并交换相邻元素。


    ## 数组多数元素

    - 寻找数组中出现次数超过 `n/3` 的元素。

    - 示例：使用 Boyer-Moore 多数投票算法。


    ## 数组领队元素

    - 寻找大于数组其余所有元素之和的元素。

    - 示例：使用栈或从右到左遍历。


    ## 数组平衡索引

    - 找到左右两侧元素之和相等的索引。

    - 示例：计算前缀和和后缀和。


    ## 数组重排

    - 重新排列数组使得 `arr[i]` 变为 `arr[arr[i]]`。

    - 示例：使用算术运算。


    ## 数组最大连续 1

    - 寻找二进制数组中连续的 1 的最大个数。

    - 示例：使用计数器并遍历数组。


    ## 数组之字形遍历

    - 以之字形模式遍历矩阵。

    - 示例：使用方向切换逻辑。


    ## 数组螺旋遍历

    - 以螺旋模式遍历矩阵。

    - 示例：遍历边界。


    ## 数组帕斯卡三角形

    - 以数组格式生成帕斯卡三角形。

    - 示例：使用嵌套循环。


    ## 数组旋转排序查找

    - 在旋转过的排序数组中搜索元素。

    - 示例：使用带有修改条件的二分查找。


    ## 数组最大正方形

    - 在二进制矩阵中找到全 1 的最大正方形。

    ### 示例：使用动态规划。


    ## 数组频率计数

    - 统计元素的频率并将其存储在单独的数组中。

    - 示例：使用哈希表。


    ## 数组中位数

    - 找到数组中元素的中位数（中间值）。

    - 示例：排序数组并找到中间元素。


    ## 数组逆序计数

    - 统计数组中的逆序对（满足 `i < j` 但 `arr[i] > arr[j]` 的对）。

    - 示例：使用带逆序计数的归并排序。


    ## 数组下一个排列

    - 找到数组字典序上的下一个更大的排列。

    - 示例：使用 `std::next_permutation()`。


    ## 数组三数和

    - 找到所有和等于给定值的唯一三元组。

    - 示例：使用三指针方法。


    ## 数组两数之和

    - 找到数组中和等于给定值的两个元素。

    - 示例：使用哈希集合。


    ## 数组有效山脉

    - 检查数组是否代表一个有效山脉。

    - 示例：遍历爬山。


    ## 数组滑动窗口最大值

    - 找到每个大小为 `k` 的连续子数组中的最大值。

    - 示例：使用 `deque` 存储索引。


    ## 数组荷兰国旗问题

    - 按特定顺序排列包含 0、1 和 2 的数组。

    - 示例：使用三路划分。


    ## 数组下一个更大元素

    - 找到数组中每个元素右侧的更大元素。

    - 示例：使用栈。


    ## 数组给定和的子数组

    - 找到和等于给定值的子数组。

    - 示例：使用前缀和和哈希。


    ## 数组除自身外的积

    - 找到数组中除当前元素外的所有元素的积。

    - 示例：使用两个数组分别存储左积和右积。


    ## 数组第一个缺失的正整数

    - 在未排序数组中找到第一个缺失的正整数。

    - 示例：使用循环排序。


    ## 数组生命游戏

    - 使用数组实现康威生命游戏。

    - 示例：使用单独数组存储下一个状态。


    ## 数组跳跃游戏

    - 判断是否可能从数组的第一个索引到达最后一个索引。

    - 示例：使用贪心算法。


    ## 数组直线上的最大点

    - 找到二维平面上位于同一条直线的最大点数。

    - 示例：使用哈希表存储斜率。


    ## 数组合并区间

    - 合并二维数组中重叠的区间。

    - 示例：排序区间并合并它们。


    ## 数组加一

    - 对用数字数组表示的数字加 1。

    - 示例：从右向左处理进位。


    ## 数组三数之和接近目标

    - 找到数组中最接近目标值的三个元素之和。

    - 示例：使用排序配合三指针方法。


    ## 数组子集

    - 生成数组的所有可能子集。

    - 示例：使用带回溯的递归。


    ## 数组唯一路径

    - 找到从二维矩阵左上角到右下角的唯一路径数。

    - 示例：使用动态规划。


    ## 数组子矩阵和

    - 找到二维数组中子矩阵内所有元素的和。

    - 示例：对每行使用前缀和。


    ## 数组螺旋矩阵生成

    - 给定大小生成螺旋矩阵。

    - 示例：按螺旋顺序遍历并更新元素。


    ## 数组目标和

    - 找到和等于给定目标值的元素对。

    - 示例：使用哈希表存储补数。


    ## 数组最大子数组乘积

    - 找到任意连续子数组的最大积。

    - 示例：使用双指针或动态规划。


    ## 数组第 K 大元素

    - 在未排序数组中找到第 K 大的元素。

    - 示例：使用快速选择算法。


    ## 数组 01 等长子数组

    - 找到 0 和 1 数量相等的最长子数组。

    - 示例：使用前缀和和哈希。


    ## 数组最小长度子数组

    - 找到和大于或等于某个值的最小子数组。

    - 示例：使用双指针。


    ## 数组排序颜色

    - 按升序排列包含 0、1 和 2 的数组。

    - 示例：使用荷兰国旗算法。


    ## 数组连续序列

    - 在未排序数组中找到最长连续序列。

    - 示例：使用哈希集合。


    ## 数组出现频率元素

    - 找到数组中频率最高的元素。

    - 示例：使用哈希表。


    ## 数组不相邻元素最大子数组和

    - 找到不相邻元素的任意子数组的最大和。

    - 示例：使用额外数组的动态规划。


    ## 数组完美峰值

    - 找到数组中大于左侧所有元素小于右侧所有元素的元素。

    - 示例：使用两个数组存储最大值最小值。


    ## 数组重复数字

    - 在包含 1 到 `n-1` 元素的数组中找到重复数字。

    - 示例：使用弗洛德判圈算法。


    ## 数组最大异或子数组

    - 找到数组中任意两个元素的最大异或值。

    - 示例：使用 `trie` 数据结构。


    ## 数组绝对值差之和

    - 计算数组中每个元素与其他所有元素之间的绝对差之和。

    - 示例：使用前缀和技术。


    ## 数组交错排序

    - 重新排列数组使得 `nums[0] <= nums[1] >= nums[2] <= nums[3]` …

    - 示例：排序数组并交换相邻元素。


    ## 数组范围和查询

    - 找到数组中某个范围内元素的和。

    - 示例：使用线段树或前缀和。


    ## 数组最长山脉子数组

    - 找到最长山脉子数组（先增后减）的长度。

    - 示例：使用双指针。


    呼！这些是与 C++ 数组的一些重要的概念和主题。每个主题都有自己的应用和使用场景，因此深入理解它们将极大地提升你的编程能力。


