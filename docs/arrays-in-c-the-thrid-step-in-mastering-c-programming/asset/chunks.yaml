    Maximum points on the same line: 4


    Both approaches will yield the same result, but the hashing technique has a better
    time complexity of O(n^2) compared to the slope calculation technique, which has
    a time complexity of O(n^3). Therefore, the hashing technique is more efficient
    when dealing with larger arrays of points.


