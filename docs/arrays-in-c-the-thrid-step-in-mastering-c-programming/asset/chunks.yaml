    \ solutions.\n    * If the current sum is less than the `target sum`, increment\
    \ `left` to increase the sum.\n    * If the current sum is greater than the `target\
    \ sum`, decrement `right` to decrease the sum.\n6.  Continue the iteration until\
    \ all possible combinations have been examined.\n\nHere’s the C++ implementation\
    \ of the above algorithm:\n\n```cpp\n#include <iostream>\n#include <vector>\n\
    #include <algorithm>\n\nusing namespace std;\n\nvector<vector<int>> threeSum(vector<int>&\
    \ nums, int target) {\n    vector<vector<int>> result;\n    int n = nums.size();\n\
