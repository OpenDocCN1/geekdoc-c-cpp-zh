    a parameter. We also define a flag isMovingUp to keep track of the traversal direction.


    Inside the zigzagTraversal function, we iterate over each row of the array using
    a for loop. For even rows (starting from index 0), we traverse the columns from
    left to right. For odd rows, we traverse the columns from right to left.


    We use an if-else statement to determine the traversal direction based on the
    isMovingUp flag. If the flag is true, we traverse the columns from left to right.
    If the flag is false, we traverse the columns from right to left.


    After traversing a row, we toggle the isMovingUp flag by using isMovingUp = !isMovingUp,
    which switches the direction for the next row.


    In the main function, we create a sample 2D array arr and call the zigzagTraversal
    function to perform the zigzag traversal.


    When you run this program, it will output the elements of the 2D array in a zigzag
    pattern:


    1 2 3 4 8 7 6 5 9 10 11 12


    That’s how you can achieve a zigzag traversal of a 2D array using nested loops
    and conditional statements in C++.


