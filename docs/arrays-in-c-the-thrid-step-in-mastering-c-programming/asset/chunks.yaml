  raw: 'In addition to one-dimensional arrays, C++ supports multidimensional arrays.
    The most common is the two-dimensional array, often used to represent matrices.


    Declaration and initialization of a 2D array can be done as follows:


    int matrix[2][3] = {


        {1, 2, 3},


        {4, 5, 6}


    };


    Here, matrix is a two-dimensional array that contains 2 arrays, each with 3 elements.
    To access the elements, we use two indices:


    cout << matrix[0][0]; // Outputs 1


    cout << matrix[1][2]; // Outputs 6


    ## Arrays and Loops


    Arrays are often used with loops. For instance, if we wanted to output all elements
    of an array, we could use a for loop as follows:


    int numbers[5] = {1, 2, 3, 4, 5};


    for (int i = 0; i < 5; i++) {


        cout << numbers[i] << " ";


    }


    This would output 1 2 3 4 5.


    ## Limitations of Arrays in C++


    While arrays are incredibly useful, they do have some limitations in C++. These
    include:


    1.  Fixed Size: Once the size of an array is declared, it cannot be changed. This
    could lead to wasted space if the array isn’t fully utilized or a shortage of
    space if we have more elements than the array can hold.


    2.  Same Data Type: All elements in the array must be of the same data type.


    3.  Lack of Built-in Methods: Unlike higher-level data structures like vectors
    or lists, arrays don’t come with built-in methods for operations like sorting,
    inserting, deleting, etc.


    Despite these limitations, arrays are fundamental to understanding data structures
    and algorithms. They provide a solid basis for learning about more complex data
    structures and are still used widely due to their simplicity and efficiency.


    # 1


    # Array Declaration


    In C++, you can declare an array of integers with a fixed size of 10 using the
    following syntax:


    int myArray[10];


    Here’s an explanation of the syntax:


    *   int: It specifies the data type of the elements in the array, which in this
    case is integers. You can replace int with any other data type if you want to
    create an array of a different type.


    *   myArray: It is the name given to the array. You can choose any valid identifier
    as the name.


    *   [10]: It indicates the size of the array, specifying the number of elements
    the array can hold. In this case, the size is 10, meaning the array can store
    10 integers.


    To access individual elements of the array, you can use the array name followed
    by the index of the element in square brackets. The index ranges from 0 to size-1\.
    Here’s an example:


    int myArray[10];  // Declaration of the array


    // Accessing individual elements


    myArray[0] = 42;  // Assigning 42 to the first element of the array


    int element = myArray[0];  // Accessing the value of the first element and storing
    it in a variable


    In this example, myArray[0] refers to the first element of the array, and myArray[0]
    = 42 assigns the value 42 to that element. Similarly, myArray[1] would refer to
    the second element, myArray[2] to the third element, and so on.


    # 2


    # Array Declaration and Initialization


    Here’s an example program in C++ that demonstrates the declaration and initialization
    of an array:


    #include <iostream>


    int main() {


        // Declare and initialize an array of integers


        int numbers[5] = {1, 2, 3, 4, 5};


        // Print the array elements


        for (int i = 0; i < 5; ++i) {


            std::cout << numbers[i] << " ";


        }


        std::cout << std::endl;


        return 0;


    }


    In this program, we declare an array named numbers of size 5, which means it can
    store 5 integers. We initialize the array with the values {1, 2, 3, 4, 5} using
    the curly braces initializer list. Each value is separated by a comma.


    Arrays in C++ are derived data types. They are derived from the fundamental data
    types and can be thought of as a collection of elements of the same data type.
    In the example program, we declared an array of integers (int), but arrays can
    also be declared for other data types like char, float, or even user-defined types.


    The array declaration consists of two parts: the data type of the elements and
    the name of the array. In the example, the data type is int, and the array is
    named numbers. The size of the array is specified inside square brackets [5],
    indicating that the array can hold 5 integers.


    Arrays are zero-indexed, which means the first element of the array has an index
    of 0, the second element has an index of 1, and so on. In the program, we use
    a for loop to iterate over the array elements and print them using std::cout.


    It’s important to note that when initializing an array, the number of elements
    in the initializer list must match the size of the array. If the initializer list
    has fewer elements, the remaining elements are automatically initialized to zero
    for numeric types (int, float, etc.) or to the null character (’\0’) for character
    arrays (char).


    # 3


    # Array Access


    Here’s an example program in C++ that accesses and prints the elements of an array:


    #include <iostream>


    int main() {


        int array[] = {1, 2, 3, 4, 5};


        int size = sizeof(array) / sizeof(array[0]);


        for (int i = 0; i < size; i++) {


            std::cout << "Element at index " << i << ": " << array[i] << std::endl;


        }


        return 0;


    }


    In this program, we have an integer array named array with 5 elements: 1, 2, 3,
    4, and 5\. The size of the array is calculated by dividing the total size of the
    array (sizeof(array)) by the size of an individual element (sizeof(array[0])).
    This calculation determines the number of elements in the array and assigns it
    to the variable size.


    The program then uses a for loop to iterate over the elements of the array. The
    loop variable i represents the index of the current element being accessed. The
    loop starts with i initialized to 0 and continues as long as i is less than the
    size of the array (i < size). In each iteration, the program prints the index
    and the corresponding element value using array[i].


    Now let’s discuss how array indices work and the importance of accessing elements
    within valid bounds.


    In C++, arrays are zero-indexed, meaning the first element of an array has an
    index of 0, the second element has an index of 1, and so on. Therefore, to access
    a particular element in an array, we use its corresponding index.


    For example, in the program above, array[0] represents the first element, array[1]
    represents the second element, and so on. Array indices allow us to specify which
    element we want to access or modify within the array.


    It is crucial to access array elements within valid bounds to avoid unexpected
    behavior and errors. Array indices must be non-negative integers and should not
    exceed the size of the array. Accessing elements outside the valid bounds of an
    array can lead to:


    1.  Undefined behavior: The program may produce unpredictable results. It could
    crash, return incorrect values, or modify unrelated memory locations, which can
    be difficult to debug.


    2.  Memory access violations: If an index is out of bounds, the program may try
    to read from or write to a memory location that does not belong to the array.
    This can lead to segmentation faults or access violations, causing the program
    to terminate abruptly.


    To ensure valid array access, it is important to check that the indices used to
    access array elements are within the range of valid indices (0 to size-1). This
    prevents errors and ensures the program operates on the intended elements of the
    array.


    # 4


    # Array Size


    In C++, the sizeof operator is used to determine the size, in bytes, of a variable
    or a data type. When used with an array, the sizeof operator returns the total
    size of the array in bytes.


    The sizeof operator calculates the size of an object or a type by evaluating the
    number of bytes it occupies in the computer’s memory. It takes either a type or
    an expression as its operand and returns an unsigned integer value representing
    the size of that operand.'
