    # 43


    # Array Longest Palindromic Subsequence


    Here’s a C++ program that finds the longest palindromic subsequence in an array
    using dynamic programming:


    #include <iostream>


    #include <vector>


    using namespace std;


    int longestPalindromicSubsequence(const vector<int>& arr) {


        int n = arr.size();


        vector<vector<int>> dp(n, vector<int>(n, 0));


        // Base case: every element is a palindrome of length 1


        for (int i = 0; i < n; i++) {


            dp[i][i] = 1;


        }


        // Build the table bottom-up


        for (int len = 2; len <= n; len++) {


            for (int i = 0; i < n - len + 1; i++) {


                int j = i + len - 1;


                if (arr[i] == arr[j] && len == 2) {


                    dp[i][j] = 2;


                } else if (arr[i] == arr[j]) {


                    dp[i][j] = dp[i + 1][j - 1] + 2;


                } else {


                    dp[i][j] = max(dp[i][j - 1], dp[i + 1][j]);


                }


            }


        }


        // The longest palindromic subsequence length is stored in dp[0][n-1]


        return dp[0][n - 1];


    }


    int main() {


        vector<int> arr = {1, 2, 3, 2, 1, 5};


        int longest = longestPalindromicSubsequence(arr);


        cout << "Longest Palindromic Subsequence Length: " << longest << endl;


        return 0;


    }


    Explanation:


    The dynamic programming approach involves building a 2D table dp to store the
    lengths of the longest palindromic subsequences for different subarrays of the
    given array arr.


    *   The table dp is initialized with all elements set to 0.


    *   The base case is when the length of the subarray is 1 (i.e., len = 1). In
    this case, every element itself is a palindrome of length 1, so dp[i][i] is set
    to 1.


    *   Then, we build the table bottom-up for increasing subarray lengths (len).
    For each subarray length, we iterate through all possible subarrays of that length.


    *   If the first and last elements of the subarray are the same (arr[i] == arr[j]),
    we check the length of the subarray:


    *   If len is 2, it means we have only two elements that are the same, so the
    length of the palindromic subsequence is 2.


    *   If len is greater than 2, we add 2 to the length of the longest palindromic
    subsequence of the subarray arr[i+1][j-1], as the first and last elements are
    the same.


    *   If the first and last elements are different, we take the maximum length of
    the palindromic subsequence by either excluding the last element (dp[i][j-1])
    or excluding the first element (dp[i+1][j]).


    Finally, the length of the longest palindromic subsequence is stored in dp[0][n-1],
    where n is the size of the array.


    In the provided example, the array is {1, 2, 3, 2, 1, 5}, and the longest palindromic
    subsequence is {1, 2, 2, 1} with a length of 4, which is the output of the program.


    Note: This solution assumes that the array contains only integer elements. For
    other data types, you may need to modify the comparison operations accordingly.


    # 44


    # Array Longest Bitonic Subarray


    To find the longest bitonic subarray in an array using dynamic programming, you
    can follow these steps:


    1.  Initialize two arrays: increasing[] and decreasing[] with the same size as
    the input array. These arrays will store the length of the longest increasing
    and decreasing subarrays ending at each index, respectively.


    2.  Initialize the increasing[] array with all 1s since a subarray of length 1
    is always increasing. Initialize the decreasing[] array with all 1s as well since
    a subarray of length 1 is also decreasing.


    3.  Traverse the input array from left to right and update the increasing[] array.
    For each index i, compare the element at index i with the previous elements. If
    the current element is greater than the previous element, set increasing[i] =
    increasing[i – 1] + 1, indicating an increasing subarray is extended. Otherwise,
    set increasing[i] = 1, as the subarray starting at index i is not increasing.'
