    \    };\n    int largestSquareSize = maximalSquare(matrix);\n    cout << \"Size\
    \ of the largest square of ones: \" << largestSquareSize << endl;\n    return\
    \ 0;\n}\n```\n\n解释：\n\n1.  我们定义了一个函数 `maximalSquare`，它接受一个二维二值矩阵作为输入，并返回全 1 最大正方形的大小。\n\
