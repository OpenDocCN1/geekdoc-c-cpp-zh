    \    // Iterate through the array\n    for (int i = 0; i < n - 2; i++) {\n   \
    \     // Two-pointers technique\n        int left = i + 1;\n        int right\
    \ = n - 1;\n        while (left < right) {\n            int sum = nums[i] + nums[left]\
    \ + nums[right];\n            if (sum == target) {\n                result.push_back({nums[i],\
    \ nums[left], nums[right]});\n                // Skip duplicates for left pointer\n\
    \                while (left < right && nums[left] == nums[left + 1])\n      \
    \              left++;\n                // Skip duplicates for right pointer\n\
    \                while (left < right && nums[right] == nums[right - 1])\n    \
    \                right--;\n                left++;\n                right--;\n\
    \            } else if (sum < target) {\n                left++;\n           \
    \ } else {\n                right--;\n            }\n        }\n        // Skip\
    \ duplicates for the current element\n        while (i < n - 2 && nums[i] == nums[i\
    \ + 1])\n            i++;\n    }\n    return result;\n}\n\nint main() {\n    vector<int>\
    \ nums = {-1, 0, 1, 2, -1, -4};\n    int target = 0;\n    vector<vector<int>>\
    \ triplets = threeSum(nums, target);\n    // Display the triplets that add up\
