  trans: "\n\n除了一维数组外，C++ 还支持多维数组。最常见的是二维数组，通常用于表示矩阵。\n\n二维数组的声明和初始化可以如下所示：\n\n```cpp\n\
    int matrix[2][3] = {\n    {1, 2, 3},\n    {4, 5, 6}\n};\n```\n\n在这里，`matrix` 是一个二维数组，包含\
    \ 2 个数组，每个包含 3 个元素。要访问这些元素，我们使用两个索引：\n\n```cpp\ncout << matrix[0][0]; // 输出 1\n\
    cout << matrix[1][2]; // 输出 6\n```\n\n## 数组与循环\n\n数组通常与循环一起使用。例如，如果我们想输出数组的所有元素，可以使用如下的\
    \ `for` 循环：\n\n```cpp\nint numbers[5] = {1, 2, 3, 4, 5};\n\nfor (int i = 0; i\
    \ < 5; i++) {\n    cout << numbers[i] << \" \";\n}\n```\n\n这将输出 1 2 3 4 5。\n\n\
    ## C++ 中数组的局限性\n\n虽然数组非常有用，但它们在 C++ 中确实有一些局限性。这些包括：\n\n1.  **固定大小**：一旦声明了数组的大小，就无法更改。如果数组没有被充分利用，可能会导致空间浪费；如果元素多于数组容量，则会导致空间不足。\n\
    2.  **相同数据类型**：数组中的所有元素必须是相同的数据类型。\n3.  **缺乏内置方法**：与 `vectors` 或 `lists` 等更高级的数据结构不同，数组没有带有用于排序、插入、删除等操作的内置方法。\n\
    \n尽管有这些局限性，数组仍然理解数据结构和算法的基础。它们为学习更复杂的数据结构提供了坚实的基础，并且由于其简单高效，仍然被广泛使用。\n\n# 数组声明\n\
    \n在 C++ 中，你可以使用以下语法声明一个固定大小为 10 的整数数组：\n\n```cpp\nint myArray[10];\n```\n\n以下是对该语法的解释：\n\
    \n*   `int`：它指定数组中元素的数据类型，在本例中是整数。如果你想创建不同类型的数组，可以将 `int` 替换为任何其他数据类型。\n*   `myArray`：这是赋予数组的名称。你可以选择任何有效的标识符作为名称。\n\
    *   `[10]`：它表示数组的大小，指定了数组可以容的元素数量。在本例中，大小为 10，意味着数组可以存储 10 个整数。\n\n要访问数组的单个元素，可以使用数组名后跟方括号中的元素索引。索引范围从\
    \ `0` 到 `size-1`。这是一个示例：\n\n```cpp\nint myArray[10];  // 数组的声明\n\n// 访问单个元素\n\
    myArray[0] = 42;  // 将 42 赋值给数组的第一个元素\nint element = myArray[0];  //访问第一个元素的值并存储在变量中\n\
    ```\n\n在这个示例中，`myArray[0]` 指向数组的第一个元素，`myArray[0] = 42` 将值 42 赋值给该元素。同样，`myArray[1]`\
    \ 指第二个元素，`myArray[2]` 指第三个元素，以此此类推。\n\n# 数组声明与初始化\n\n这是一个 C++ 示例程序，演示了数组的声明和初始化：\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n    // 声明并初始化整数数组\n    int numbers[5]\
    \ = {1, 2, 3, 4, 5};\n\n    // 打印数组元素\n    for (int i = 0; i < 5; ++i) {\n   \
    \     std::cout << numbers[i] << \" \";\n    }\n    std::cout << std::endl;\n\
    \    return 0;\n}\n```\n\n在该程序中，我们声明了一个名为 `numbers` 的大小为 5 的数组，这意味着它可以存储 5 个整数。我们使用大括号初始化列表\
    \ `{1, 2, 3, 4, 5}` 初始化数组。每个值之间用逗号分隔。\n\nC++ 中的数组是派生数据类型。它们派自基本数据类型，可以被视为相同数据类型元素的集合。在示例程序中，我们声明了一个整数数组\
    \ (`int`)，但也可以为 `char`、`float` 甚至用户定义类型声明数组。\n\n数组声明由两部分组成：元素的数据类型和数组的名称。在示例中，数据类型是\
    \ `int`，数组名为 `numbers`。数组的大小在方括号 `[5]` 内指定，表示数组可以容纳 5 个整数。\n\n数组是零索引的，这意味着数组的第一个元素的索引为\
    \ `0`，第二个索引为 `1`，以此此类推。在程序中，我们使用 `for` 循环遍历数组元素并使用 `std::cout` 打印它们。\n\n需要注意的是，在初始化时，索引必须在边界内。\n\
    \n# 数组访问\n\n这是一个 C++ 示例程序，用于访问并打印元素：\n\n```cpp\n#include <iostream>\n\nint main()\
    \ {\n    int array[] = {1, 2, 3, 4, 5};\n    int size = sizeof(array) / sizeof(array[0]);\n\
    \n    for (int i = 0; i < size; i++) {\n        std::cout << \"Element at \" <<\
    \ i << \": \" << array[i] << std::endl;\n    }\n    return 0;\n}\n```\n\n在该程序中，我们声明了一个名为\
    \ `numbers` 的大小为 5 的数组，这意味着它可以存储 5 个整数。我们使用大括号初始化列表 `{1, 2, 3, 4, 5}` 初始化数组。每个值之间用逗号分隔。\n\
    \n# 数组大小\n\n在 C++ 中，`sizeof` 运算符用于确定变量或数据类型的大小（以字节为单位）。当用于数组时，`sizeof` 运算符返回数组的总字节数。\n\
    \n`sizeof` 运算符通过计算对象或类型在计算机内存中所占用的字节数来确定大小。它接受一个类型或表达式作为操作数，并返回一个表示操作数大小的无符号整数值。\n\
    \n"
- fmt: "\nWhen you use the `sizeof` operator with an array, it returns the total size\
    \ of the array, which is calculated by multiplying the size of each element in\
    \ the array by the number of elements. For example, if you have an array of integers\
    \ with 10 elements, and each integer takes 4 bytes of memory, the `sizeof` operator\
    \ would return 40 (10 elements * 4 bytes per element).\n\nHere’s an example that\
    \ demonstrates the usage of `sizeof` with an array:\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n    int numbers[] = {1, 2, 3, 4, 5};\n    int size = sizeof(numbers)\
    \ / sizeof(numbers[0]);\n    std::cout << \"Size of the array: \" << size << std::endl;\n\
    \    std::cout << \"Size of each element: \" << sizeof(numbers[0]) << \" bytes\"\
    \ << std::endl;\n    std::cout << \"Total size of the array: \" << sizeof(numbers)\
    \ << \" bytes\" << std::endl;\n    return 0;\n}\n```\n\nIn this example, `sizeof(numbers)`\
    \ gives you the total size of the `numbers` array, while `sizeof(numbers[0])`\
    \ gives you the size of each element in the array. By dividing the total size\
    \ by the size of each element, you can determine the number of elements in the\
    \ array.\n\nNote that the `sizeof` operator determines the size of the array at\
    \ compile-time, so it won’t give you the number of elements in a dynamically allocated\
    \ array or an array passed as a function argument (unless it’s a reference or\
    \ pointer). In those cases, you would need to track the size separately.\n\n#\
    \ Array Modification\n\nHere’s an example of a C++ program that modifies the elements\
    \ of an array:\n\n```cpp\n#include <iostream>\n\nint main() {\n    const int SIZE\
    \ = 5;\n    int numbers[SIZE];\n    // Initialize the array with some values\n\
    \    for (int i = 0; i < SIZE; i++) {\n        numbers[i] = i + 1;\n    }\n  \
    \  // Print the original array\n    std::cout << \"Original array: \";\n    for\
    \ (int i = 0; i < SIZE; i++) {\n        std::cout << numbers[i] << \" \";\n  \
    \  }\n    std::cout << std::endl;\n    // Modify individual elements of the array\n\
    \    numbers[0] = 10;\n    numbers[2] = 20;\n    numbers[4] = 30;\n    // Print\
    \ the modified array\n    std::cout << \"Modified array: \";\n    for (int i =\
    \ 0; i < SIZE; i++) {\n        std::cout << numbers[i] << \" \";\n    }\n    std::cout\
    \ << std::endl;\n    return 0;\n}\n```\n\nIn this program, we declare an array\
    \ `numbers` of size `SIZE` (which is set to 5 in this example). We then use a\
    \ loop to assign initial values to the elements of the array. In this case, we\
    \ assign values 1 to `SIZE` to the array elements.\n\nTo assign new values to\
    \ individual elements of the array, we use the array index notation. For example,\
    \ `numbers[0] = 10;` assigns the value 10 to the first element of the array, `numbers[2]\
    \ = 20;` assigns 20 to the third element, and `numbers[4] = 30;` assigns 30 to\
    \ the fifth element.\n\nFinally, we use another loop to print the elements of\
    \ the array before and after the modifications to verify the changes.\n\nWhen\
    \ modifying arrays, it’s important to ensure that the index used to access the\
    \ array elements is within the bounds of the array. Otherwise, it can lead to\
    \ undefined behavior or runtime errors.\n\n# Array Traversal\n\nArray traversal\
    \ refers to the process of accessing each element in an array and performing some\
    \ operation on it. In C++, array traversal is typically done using loops, such\
    \ as the “for” or “while” loop.\n\nHere’s an example program that demonstrates\
    \ array traversal using a “for” loop:\n\n```cpp\n#include <iostream>\n\nint main()\
    \ {\n    int arr[] = {1, 2, 3, 4, 5};  // Example array\n    // Traversing the\
    \ array using a for loop\n    for (int i = 0; i < sizeof(arr) / sizeof(arr[0]);\
    \ i++) {\n        // Perform operation on each element\n        std::cout << arr[i]\
    \ << \" \"; // the element\n    }\n    return 0;\n}\n```\n\nIn this program, we\
    \ have an integer array `arr` containing some elements. `sizeof(arr) / sizeof(arr[0])`\
    \ calculates the length of the array. We use a “for” loop to iterate over the\
    \ array, starting from index 0 and continuing until the index reaches the length\
    \ of the array minus 1.\n\nWithin the loop, you can perform any operation on each\
    \ element. In the given example, we simply print each element using `std::cout`.\
    \ You can replace this line with any operation or calculation you want to perform\
    \ on the elements. The loop will iterate through each element of the array, performing\
    \ the specified operation on each one. This way, you can process each element\
    \ individually without having to write repetitive code for each element. Array\
    \ traversal is a fundamental concept in programming and is widely used for tasks,\
    \ such as searching, filtering, or modifying elements.\n\n# Sorting\n\nThe Bubble\
    \ Sort algorithm works by repeatedly swapping adjacent elements if they are in\
    \ the wrong order. This process continues until the entire array is sorted. Here’s\
    \ an example:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\n// Function\
    \ to swap two elements\nvoid swap(int& a, int& b) {\n    int temp = a;\n    a\
    \ = b;\n    b = temp;\n}\n\n// Function to perform bubble sort\nvoid bubbleSort(int\
