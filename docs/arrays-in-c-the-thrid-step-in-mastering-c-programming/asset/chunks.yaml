    # Array Dutch National Flag


    The Dutch National Flag problem is a sorting problem that involves arranging an
    array containing only three distinct elements (0s, 1s, and 2s) in a specific order.
    The problem gets its name from the Dutch national flag, which consists of three
    horizontal stripes: red, white, and blue, each representing the values 0, 1, and
    2, respectively.


    To solve this problem, you can use three pointers to partition the array into
    three sections: the “low” pointer, the “mid” pointer, and the “high” pointer.


    Here’s an example program in C++ that sorts the array using the Dutch National
    Flag algorithm:


    #include <iostream>


    using namespace std;


    void dutchNationalFlag(int arr[], int size) {


        int low = 0;      // Pointer for elements less than 1


        int mid = 0;      // Pointer for elements equal to 1


        int high = size - 1; // Pointer for elements greater than 1


        while (mid <= high) {


            if (arr[mid] == 0) {


                swap(arr[low], arr[mid]);


                low++;


                mid++;


            } else if (arr[mid] == 1) {


                mid++;


            } else if (arr[mid] == 2) {


                swap(arr[mid], arr[high]);


                high--;


            }


        }


    }


    int main() {


        int arr[] = {2, 0, 1, 1, 0, 2, 1, 0};


        int size = sizeof(arr) / sizeof(arr[0]);


        cout << "Before sorting: ";


        for (int i = 0; i < size; i++) {


            cout << arr[i] << " ";


        }


        dutchNationalFlag(arr, size);


        cout << "\nAfter sorting: ";


        for (int i = 0; i < size; i++) {


            cout << arr[i] << " ";


        }


        return 0;


    }


    In this program, the dutchNationalFlag function takes the array and its size as
    parameters. The three pointers, low, mid, and high, are initially set to the start,
    start, and end of the array, respectively.


    The algorithm works as follows:


    1.  If the element at mid is 0, swap it with the element at low, increment both
    low and mid.


    2.  If the element at mid is 1, just increment mid to move forward.


    3.  If the element at mid is 2, swap it with the element at high, decrement high
    to move backward (since we know the element at high is greater than 1). Do not
    increment mid in this case since the swapped element at mid still needs to be
    processed.


