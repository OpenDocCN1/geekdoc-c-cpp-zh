    # 97


    # Array Range Sum Query


    To efficiently handle multiple range sum queries on an array, you can use the
    concept of prefix sums and dynamic programming. This approach allows you to preprocess
    the array and answer each query in constant time.


    Here’s how you can implement it in C++:


    #include <iostream>


    #include <vector>


    using namespace std;


    vector<int> calculatePrefixSums(const vector<int>& nums) {


        int n = nums.size();


        vector<int> prefixSums(n + 1, 0);  // Initialize prefix sums with 0


        for (int i = 0; i < n; i++) {


            prefixSums[i + 1] = prefixSums[i] + nums[i];  // Calculate prefix sums


        }


        return prefixSums;


    }


    int rangeSumQuery(const vector<int>& prefixSums, int left, int right) {


        return prefixSums[right + 1] - prefixSums[left];  // Calculate range sum using
    prefix sums


    }


    int main() {


        vector<int> nums = {1, 3, 2, -5, 4, 6, -2};


        vector<int> prefixSums = calculatePrefixSums(nums);


        // Example queries


        cout << rangeSumQuery(prefixSums, 1, 3) << endl;  // Output: 0 (3 + 2 + (-5)
    = 0)


        cout << rangeSumQuery(prefixSums, 2, 5) << endl;  // Output: 7 (2 + (-5) +
    4 + 6 = 7)


        return 0;


    }


    In this program, the calculatePrefixSums function takes an array nums and returns
    a vector prefixSums that contains the prefix sums of nums. The prefixSums vector
    is initialized with an extra element at the beginning as 0, and each subsequent
    element is calculated by adding the current element in nums to the previous prefix
    sum.


    The rangeSumQuery function takes the prefixSums vector, along with the left and
    right indices of the range you want to query. It returns the sum of elements in
    the range by subtracting the prefix sum at the left index from the prefix sum
    at the right + 1 index. This subtraction cancels out the sum of elements before
    the left index, giving you the range sum.


    In the main function, you can call the rangeSumQuery function to perform range
    sum queries on the array. You first calculate the prefixSums vector using the
    calculatePrefixSums function, and then you can pass it along with the desired
    range to the rangeSumQuery function to get the result.


    Using this approach, you preprocess the array once in linear time to calculate
    the prefix sums. After that, each range sum query can be answered in constant
    time by subtracting two prefix sums. Thus, the overall time complexity for handling
    multiple range sum queries becomes O(n) for preprocessing and O(1) for each query,
    where n is the size of the array.


