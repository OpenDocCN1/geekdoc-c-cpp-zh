    # 78


    # Array Triplet Sum Closest


    Here’s a C++ program that finds the triplet with the closest sum to a given target
    in an array using sorting and the two-pointer technique:


    #include <iostream>


    #include <vector>


    #include <algorithm>


    #include <climits>


    using namespace std;


    int findClosestTripletSum(vector<int>& nums, int target) {


        int n = nums.size();


        if (n < 3)


            return 0;


        sort(nums.begin(), nums.end()); // Sort the array in ascending order


        int closestSum = INT_MAX;


        for (int i = 0; i < n - 2; i++) {


            int left = i + 1; // Pointer to the element next to nums[i]


            int right = n - 1; // Pointer to the last element


            while (left < right) {


                int currentSum = nums[i] + nums[left] + nums[right];


                if (currentSum == target)


                    return target;


                if (abs(currentSum - target) < abs(closestSum - target))


                    closestSum = currentSum;


                if (currentSum < target)


                    left++;


                else


                    right--;


            }


        }


        return closestSum;


    }


    int main() {


        vector<int> nums = { -1, 2, 1, -4 };


        int target = 1;


        int closestSum = findClosestTripletSum(nums, target);


        cout << "Closest sum: " << closestSum << endl;


        return 0;


    }


    Explanation:


    1.  First, we sort the given array nums in ascending order. Sorting the array
    helps us in leveraging the two-pointer technique efficiently.


    2.  We initialize closestSum with a large value (INT_MAX) to keep track of the
    closest sum encountered so far.


    3.  We iterate through the array nums using a loop variable i from 0 to n - 2
    (where n is the size of nums). This is because we need at least three elements
    to form a triplet.


    4.  Inside the loop, we initialize two pointers, left and right, pointing to the
    elements next to nums[i] and the last element, respectively.


    5.  While left is less than right, we calculate the sum of the triplet (currentSum)
    as nums[i] + nums[left] + nums[right].


    6.  If the currentSum is equal to the target, we directly return the target as
    the closest sum.


    7.  If the absolute difference between currentSum and target is smaller than the
    absolute difference between closestSum and target, we update closestSum with currentSum.
    This keeps track of the closest sum encountered so far.


    8.  Based on the comparison of currentSum and target, we move the left or right
    pointer. If currentSum is smaller than the target, we increment left to consider
    a larger element. Otherwise, we decrement right to consider a smaller element.


    9.  After the loop ends, we return closestSum, which represents the closest sum
    to the target among all the triplets.


    In the example given in the main function, the array nums contains [-1, 2, 1,
    -4], and the target is 1\. The closest sum to the target among all the triplets
    is 2 (-1 + 2 + 1), so the program will output “Closest sum: 2” when executed.


