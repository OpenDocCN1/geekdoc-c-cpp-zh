    \ 9, 10, 8, 5, 3, 4};\n    int maxSum = maxSubarraySum(arr);\n    std::cout <<\
    \ \"Maximum circular subarray sum: \" << maxSum << std::endl;\n    return 0;\n\
    }\n```\n\n# 47 数组第 K 小\n\n使用排序或分区算法找到数组中的第 K 小元素，可以遵循以下步骤：\n\n1. 排序算法方法：\n* 初始化给定元素的数组。\n\
    * 使用任何高效排序算法对数组进行升序排序，例如 `quicksort`、`mergesort` 或 `heapsort`。\n* 此时，第 K 小元素位于排序后数组的索引\
    \ `(K – 1)` 处（考虑零索引）。\n* 返回该索引处的元素。\n\n以下是使用排序方法的示例实现：\n\n```cpp\n#include <iostream>\n\
    #include <algorithm>\n\nint findKthSmallest(int arr[], int size, int k) {\n  \
    \  std::sort(arr, arr + size); // 排序\n    return arr[k - 1]; // 返回第 K 小元素\n}\n\
    \nint main() {\n    int arr[] = {10, 2, 8, 4, 6, 5};\n    int size = sizeof(arr)\
    \ / sizeof(arr[0]);\n    int k = 3;\n    int kthSmallest = findKthSmallest(arr,\
    \ size, k);\n    std::cout << \"The \" << k << \"th smallest element is: \" <<\
    \ kthSmallest << std::endl;\n    return 0;\n}\n```\n"
- fmt: "\nIn this example, we have an array `arr` with elements `[10, 2, 8, 4, 6,\
    \ 5]`. We want to find the 3rd smallest element (`k = 3`) using the sorting algorithm.\
    \ After sorting the array in ascending order, we get `[2, 4, 5, 6, 8, 10]`. The\
    \ 3rd smallest element is 5, so the program outputs “The 3rd smallest element\
    \ is: 5”.\n\n### 1. Partitioning Algorithm Approach (Quickselect)\n\n- Initialize\
    \ the array with the given elements.\n- Apply the `Quickselect` algorithm to partition\
    \ the array around a `pivot` element.\n- By choosing an appropriate `pivot`, you\
    \ can efficiently find the Kth smallest element without fully sorting the entire\
    \ array.\n- If the `pivot index` is equal to `(K – 1)`, return the `pivot` element.\n\
    - Otherwise, recursively apply the `Quickselect` algorithm on either the left\
    \ or right partition depending on the `pivot index` and `K` value.\n\nHere’s an\
    \ example implementation using the partitioning approach:\n\n```cpp\n#include\
    \ <iostream>\n#include <algorithm>\n\nint partition(int arr[], int low, int high)\
    \ {\n    int pivot = arr[high];\n    int i = low - 1;\n    for (int j = low; j\
    \ < high; j++) {\n        if (arr[j] <= pivot) {\n            i++;\n         \
    \   std::swap(arr[i], arr[j]);\n        }\n    }\n    std::swap(arr[i + 1], arr[high]);\n\
    \    return i + 1;\n}\n\nint quickselect(int arr[], int low, int high, int k)\
    \ {\n    if (low < high) {\n        int pivotIndex = partition(arr, low, high);\n\
    \        if (pivotIndex == k - 1)\n            return arr[pivotIndex];\n     \
    \   else if (pivotIndex > k - 1)\n            return quickselect(arr, low, pivotIndex\
    \ - 1, k);\n        else\n            return quickselect(arr, pivotIndex + 1,\
    \ high, k);\n    }\n    return arr[low];\n}\n\nint findKthSmallest(int arr[],\
    \ int size, int k) {\n    return quickselect(arr, 0, size - 1, k);\n}\n\nint main()\
