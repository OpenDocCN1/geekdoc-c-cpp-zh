    # Introduction to Arrays in C++


    An array, in computer science, is a collection of elements stored at contiguous
    memory locations. It is one of the simplest and most important data structures
    in computer programming. This guide provides a thorough introduction to arrays
    in C++, one of the most widely used programming languages.


    ## What is an Array?


    An array in C++ is a data structure that holds a fixed-size sequence of values
    of the same type. The size of the array is determined at the time of creation
    and cannot be changed. It is often used when we want to store a list of elements
    and access them by a single variable, instead of declaring separate variables
    for each element.


    ## Array Declaration


    In C++, an array can be declared in several ways, but the standard way is as follows:


    `dataType arrayName[arraySize];`


    Here `dataType` is the type of values that the array will hold, `arrayName` is
    the name given to the array, and `arraySize` is an integer constant greater than
    zero, indicating the number of elements the array will contain. For instance,
    if we want to create an array of integers named `numbers` with space for 5 elements,
    the declaration would look like this:


    ```cpp

    int numbers[5];

    ```


    ## Array Initialization


    We can initialize an array at the time of declaration, or we can declare it first
    and then initialize. The methods are as follows:


    ### Initialization at the Time of Declaration


    ```cpp

    int numbers[5] = {1, 2, 3, 4, 5};

    ```


    Here, we have an array named `numbers` that can hold 5 integer values. The values
    inside the curly braces are the initial values of the array.


    ### Initialization after Declaration


    If you don’t initialize an array at the time of declaration, you can assign values
    to it later as follows:


    ```cpp

    int numbers[5];

    numbers[0] = 1;

    numbers[1] = 2;

    numbers[2] = 3;

    numbers[3] = 4;

    numbers[4] = 5;

    ```


    This is equivalent to the previous method. However, remember that the index of
    an array in C++ starts from 0, not 1.


    ## Accessing Array Elements


    Array elements are accessed using their indices. The index refers to the position
    of the element in the array, with the first element at index 0. Here’s how you
    can access the array elements:


    ```cpp

    cout << numbers[0];  // This will output 1

    cout << numbers[4];  // This will output 5

    ```


    Be careful not to access an index beyond the size of your array, as it leads to
    undefined behavior.


