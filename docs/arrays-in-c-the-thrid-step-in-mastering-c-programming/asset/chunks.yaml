    \ {\n    long long inversionCount = 0;\n    if (left < right) {\n        int mid\
    \ = left + (right - left) / 2;\n        inversionCount += mergeSortAndCount(arr,\
    \ temp, left, mid);\n        inversionCount += mergeSortAndCount(arr, temp, mid\
    \ + 1, right);\n        inversionCount += mergeAndCount(arr, temp, left, mid,\
    \ right);\n    }\n    return inversionCount;\n}\n\nlong long countInversions(vector<int>&\
    \ arr) {\n    int n = arr.size();\n    vector<int> temp(n);\n    return mergeSortAndCount(arr,\
    \ temp, 0, n - 1);\n}\n\nint main() {\n    vector<int> arr = {5, 3, 2, 4, 1};\n\
    \    long long inversionCount = countInversions(arr);\n    cout << \"Number of\
    \ inversions: \" << inversionCount << endl;\n    return 0;\n}\n```\n\n在此程序中，我们使用改进后的归排序算法来计算数组中的逆序对数量。`mergeAndCount`\
    \ 函数合并两个有序的子数组并计算逆序对。`mergeSortAndCount` 函数递归地将数组分成更小的子数组，执行归排序并累加逆序对计数。最后，`countInversions`\
    \ 函数是一个封装函数，用于初始化临时数组并启动归排序过程。\n\n要使用树状数组（Fenwick tree，也称为二叉索引树或 BIT）来解决此问题，我们可以如下所示修改归排序算法：\n\
    \n1. 创建一个支持高效范围和查询和点更新的 Fenwick 树数据结构。Fenwick 树应初始化为全零。\n2. 将变量 `inversionCount`\
    \ 初始化为 0。\n3. 从右到左遍历数组。\n4. 对于每个元素 `arr[i]`，查询 Fenwick 树中小于 `arr[i]` 的元素和。将此和加到\
    \ `inversionCount`。\n5. 通过将索引 `arr[i]` 处的值加 1 来更新 Fenwick 树。\n\n以下是示例实现：\n\n```cpp\n\
    #include <iostream>\n#include <vector>\n\nusing namespace std;\n\nclass FenwickTree\
    \ {\nprivate:\n    vector<int> BIT;\npublic:\n    FenwickTree(int size) {\n  \
    \      BIT.resize(size + 1, 0);\n    }\n    void update(int index, int value)\
    \ {\n        while (index < BIT.size()) {\n            BIT[index] += value;\n\
    \            index += index & (-index);\n        }\n    }\n    int query(int index)\
    \ {\n        int sum = 0;\n        while (index > 0) {\n            sum += BIT[index];\n\
    \            index -= index & (-index);\n        }\n        return sum;\n    }\n\
    };\n\nlong long countInversions(vector<int>& arr) {\n    int n = arr.size();\n\
    \    FenwickTree bit(n);\n    long long inversionCount = 0;\n    for (int i =\
    \ n - 1; i >= 0; i--) {\n        inversionCount += bit.query(arr[i] - 1);\n  \
    \      bit.update(arr[i], 1);\n    }\n    return inversionCount;\n}\n\nint main()\
    \ {\n    vector<int> arr = {5, 3, 2, 4, 1};\n    long long inversionCount = countInversions(arr);\n\
    \    cout << \"Number of inversions: \" << inversionCount << endl;\n    return\
    \ 0;\n}\n```\n\n在此实现中，我们定义了一个 `FenwickTree` 类，封装了 Fenwick 树的操作。`update` 函数通过增加给定索引处的值来更新树，而\
    \ `query` 函数计算到给定索引的和。在 `countInversions` 函数中，我们反向遍历数组。对于每个元素，我们查询 Fenwick 树中小于该元素的元素和。改进的归排序和\
    \ Fenwick 树方法的时间复杂度均为 O(n log n)，其中 `n` 是数组的大小。归排序方法在常数因子上可能稍大，但在某些场景下更容易理解和实现。\n\
    \n# 63\n\n# 数组下一个排列 (Array Next Permutation)\n\n在 C++ 中，你可以使用 `<algorithm>` 库中的\
    \ `next_permutation` 算法来获取的下一个字典序排列。这是一个演示其用法的示例：\n\n```cpp\n#include <iostream>\n\
    #include <algorithm>\n#include <vector>\n\nint main() {\n    vector<int> arr =\
    \ {1, 2, 3};\n    std::next_permutation(arr.begin(), arr.end());\n    for (int\
    \ num : arr) {\n        cout << num << \" \";\n    }\n    cout << std::endl;\n\
    \    return 0;\n}\n```\n\n在这个示例中，初始数组为 `{1, 2, 3}`。`std::next_permutation` 函数以数组的范围调用。如果存在，它将修改数组为下一个字典序排列并返回\
    \ `true`。如果数组已经是最大的排列，它将其重排为最小排列并返回 `false`。在我们的情况下，下一个排列是 `{1, 3, 2}`，因此它会被打印出来。\n\
    \n如果你无法访问 `next_permutation` 函数，或者想了解它的内部工作原理，你可以手动实现下一个排列。这是一个实现该方法的示例：\n\n```cpp\n\
    #include <iostream>\n#include <vector>\n#include <algorithm>\n\nvoid nextPermutation(vector<int>&\
    \ nums) {\n    int n = nums.size();\n    int i = n - 2;\n    // 从右侧找到第一个比其后续元素小的元素\n\
    \    while (i >= 0 && nums[i] >= nums[i + 1]) {\n        i--;\n    }\n    if (i\
    \ >= 0) {\n        // 找到比 nums[i] 大的元素进行交换\n        int j = n - 1;\n        while\
    \ (j > i && nums[j] <= nums[i]) {\n            j--;\n        }\n        // 交换\
    \ nums[i] 和 nums[j]\n        std::swap(nums[i], nums[j]);\n    }\n    // 反转剩余元素\n\
    \    std::reverse(nums.begin() + i + 1, nums.end());\n}\n\nint main() {\n    //\
    \ 创建带有元素的数组或向量\n    vector<int> arr = {1, 2, 3};\n    // 寻找下一个排列\n    nextPermutation(arr);\n\
    \    // 打印下一个排列\n    for (int num : arr) {\n        cout << num << \" \";\n  \
    \  }\n    cout << std::endl;\n    return 0;\n}\n```\n\n"
