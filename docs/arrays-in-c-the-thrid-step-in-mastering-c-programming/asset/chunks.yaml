    # Array Next Permutation


    In C++, you can use the std::next_permutation algorithm from the <algorithm> library
    to find the lexicographically next permutation of an array. Here’s an example
    program that demonstrates its usage:


    #include <iostream>


    #include <algorithm>


    #include <vector>


    int main() {


        // Create an array or vector with elements


        std::vector<int> arr = {1, 2, 3};


        // Find the next permutation


        std::next_permutation(arr.begin(), arr.end());


        // Print the next permutation


        for (int num : arr) {


            std::cout << num << " ";


        }


        std::cout << std::endl;


        return 0;


    }


    In this example, the initial array is {1, 2, 3}. The std::next_permutation function
    is called with the range of the array, arr.begin() and arr.end(). It modifies
    the array to the next lexicographically greater permutation if it exists, and
    returns true. If the array is already the highest possible permutation, it rearranges
    it to the lowest possible permutation and returns false. In our case, the next
    permutation is {1, 3, 2}, so it will be printed.


    If you don’t have access to the std::next_permutation function or want to understand
    how it works internally, you can implement the next permutation manually. Here’s
    an example of how you can achieve that:


    #include <iostream>


    #include <vector>


    #include <algorithm>


    void nextPermutation(std::vector<int>& nums) {


        int n = nums.size();


        int i = n - 2;


        // Find the first element from the right that is smaller than its next element


        while (i >= 0 && nums[i] >= nums[i + 1]) {


            i--;


        }


        if (i >= 0) {


            // Find the element just larger than nums[i] to swap with


            int j = n - 1;


            while (j > i && nums[j] <= nums[i]) {


                j--;


            }


            // Swap nums[i] and nums[j]


            std::swap(nums[i], nums[j]);


        }


        // Reverse the remaining elements


        std::reverse(nums.begin() + i + 1, nums.end());


    }


    int main() {


        // Create an array or vector with elements


        std::vector<int> arr = {1, 2, 3};


        // Find the next permutation


        nextPermutation(arr);


        // Print the next permutation


        for (int num : arr) {


            std::cout << num << " ";


        }


        std::cout << std::endl;


        return 0;


    }


    In this manual implementation, the nextPermutation function takes a reference
    to the array and modifies it in place. It follows the logic of finding the next
    permutation:


    1.  Starting from the right, find the first element that is smaller than its next
    element. Let’s call its index i.


    2.  If i is greater than or equal to zero, find the element just larger than nums[i]
    from the right. Let’s call its index j.


    3.  Swap nums[i] and nums[j].


    4.  Reverse the elements from index i + 1 to the end of the array.


    This sequence of steps guarantees that we obtain the next lexicographically greater
    permutation.


    Both the std::next_permutation function and the manual implementation provide
    a way to find the next permutation of an array efficiently. You can choose either
    approach based on your preference and requirements.


