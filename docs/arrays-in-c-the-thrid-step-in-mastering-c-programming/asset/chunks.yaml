    # 33


    # Array Majority Element


    Here’s a C++ program that finds the majority element in an array using a map to
    track element frequencies:


    #include <iostream>


    #include <unordered_map>


    #include <vector>


    int findMajorityElement(const std::vector<int>& arr) {


        std::unordered_map<int, int> freqMap;


        // Count the frequency of each element in the array


        for (int num : arr) {


            freqMap[num]++;


        }


        // Find the element with frequency greater than half the array size


        int halfSize = arr.size() / 2;


        for (const auto& pair : freqMap) {


            if (pair.second > halfSize) {


                return pair.first;


            }


        }


        // No majority element found


        return -1;


    }


    int main() {


        std::vector<int> arr = {1, 2, 2, 2, 3, 2, 4, 2, 5};


        int majorityElement = findMajorityElement(arr);


        if (majorityElement != -1) {


            std::cout << "Majority element: " << majorityElement << std::endl;


        } else {


            std::cout << "No majority element found." << std::endl;


        }


        return 0;


    }


    Explanation:


    1.  We start by including the necessary C++ standard libraries: iostream, unordered_map,
    and vector.


    2.  The findMajorityElement function takes an input array arr as a parameter and
    returns the majority element if it exists, or -1 if there is no majority element.


    3.  Inside the function, we create an unordered_map called freqMap to track the
    frequency of each element in the array. The key of the map represents the element,
    and the value represents its frequency.


    4.  We iterate through the input array arr, and for each element, we increment
    its corresponding frequency in the freqMap using the operator++ of unordered_map.


    5.  After counting the frequencies, we determine the threshold for a majority
    element by dividing the size of the array by 2 and storing it in the halfSize
    variable.


    6.  We then iterate through the key-value pairs in the freqMap using a range-based
    for loop. For each pair, if the frequency (pair.second) is greater than halfSize,
    we have found a majority element, so we return the element (pair.first).


    7.  If we finish the loop without finding a majority element, we return -1 to
    indicate that no majority element exists.


    8.  In the main function, we create a sample array arr with some elements.


    9.  We call the findMajorityElement function with arr as the argument and store
    the result in the majorityElement variable.


    10.  Finally, we check the value of majorityElement. If it is not -1, we print
    the majority element. Otherwise, we print a message indicating that no majority
    element was found.


    When you run this program, it will output “Majority element: 2” because the element
    2 appears more than half of the time in the array {1, 2, 2, 2, 3, 2, 4, 2, 5}.


    # 34


    # Array Missing Element


    Here’s a C++ program that finds the missing element in a sequence of numbers represented
    by an array using the method you described:


    #include <iostream>


    int findMissingElement(int arr[], int n) {


        int expectedSum = (n + 1) * (n + 2) / 2; // Calculate the sum of the expected
    sequence


        for (int i = 0; i < n; i++) {


            expectedSum -= arr[i]; // Subtract the sum of the array elements


        }


        return expectedSum;


    }


    int main() {


        int arr[] = {1, 2, 4, 5, 6}; // Example array


        int n = sizeof(arr) / sizeof(arr[0]);


        int missingElement = findMissingElement(arr, n);


        std::cout << "The missing element is: " << missingElement << std::endl;


        return 0;


    }


    In this program, we define a function findMissingElement that takes an array arr
    and its size n as input. The expected sum of the sequence is calculated using
    the formula (n + 1) * (n + 2) / 2, which is the sum of the first n+1 natural numbers.


    We then iterate over the elements of the array and subtract each element from
    the expected sum. The resulting value will be the missing element, as all the
    other elements cancel out. Finally, the missing element is returned.


    In the main function, we create an example array and calculate its size using
    the sizeof operator. We then call the findMissingElement function with the array
    and its size, and the missing element is printed to the console.


    Note that this program assumes that the sequence of numbers is continuous, starting
    from 1\. If the sequence starts from a different number or has a different pattern,
    the formula for the expected sum needs to be adjusted accordingly.


