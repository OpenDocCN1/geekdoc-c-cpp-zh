    # 11


    # Array Reversal


    Here’s a C++ program that reverses the elements of an array:


    #include <iostream>


    void reverseArray(int arr[], int size) {


        int start = 0;


        int end = size - 1;


        while (start < end) {


            // Swap elements at start and end indices


            int temp = arr[start];


            arr[start] = arr[end];


            arr[end] = temp;


            // Move start and end towards the center


            start++;


            end--;


        }


    }


    int main() {


        const int size = 5;


        int arr[size] = {1, 2, 3, 4, 5};


        std::cout << "Original array: ";


        for (int i = 0; i < size; i++) {


            std::cout << arr[i] << " ";


        }


        reverseArray(arr, size);


        std::cout << "\nReversed array: ";


        for (int i = 0; i < size; i++) {


            std::cout << arr[i] << " ";


        }


        return 0;


    }


    Explanation:


    1.  The reverseArray function takes two parameters: the array to be reversed (arr)
    and the size of the array (size).


    2.  The function initializes two variables, start and end, with the indices of
    the first and last elements of the array, respectively.


    3.  It enters a while loop that continues until start becomes greater than or
    equal to end.


    4.  Inside the loop, it swaps the elements at indices start and end using a temporary
    variable temp.


    5.  After the swap, it increments start and decrements end to move towards the
    center of the array.


    6.  The loop continues until start is no longer less than end, ensuring all elements
    have been swapped.


    7.  In the main function, an array arr of size 5 is declared and initialized with
    some values.


    8.  The original array is printed using a for loop.


    9.  The reverseArray function is called with the array and its size as arguments
    to reverse the elements.


    10.  Finally, the reversed array is printed using another for loop.


    When you run this program, it will output the original array and the reversed
    array:


    Original array: 1 2 3 4 5


    Reversed array: 5 4 3 2 1


    The program works by swapping the first and last elements, then moving towards
    the center of the array, continuing to swap elements until all elements have been
    reversed.


