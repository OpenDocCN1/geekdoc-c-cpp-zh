  \ `int`）以及相应的输入输出操作，修改代码以比较不同数据类型的数组。\n\n---\n\n## 13 - 数组求和\n\n这是一个 C++ 程序示例，用于计算数组中所有元素的和：\n\
  \n```cpp\n#include <iostream>\n\nint main() {\n    // 定义数组\n    int arr[] = {2,\
  \ 4, 6, 8, 10};\n    int size = sizeof(arr) / sizeof(arr[0]);  // 计算数组的大小\n    int\
  \ sum = 0;  // 初始化和变量\n    // 遍历数组并累加求和\n    for (int i = 0; i < size; i++) {\n\
  \        sum += arr[i];\n    }\n    // 打印和\n    std::cout << \"Sum of array elements:\
  \ \" << sum << std::endl;\n    return 0;\n}\n```\n\n在这个程序中，我们首先定义了一个包含某些元素的数组 `arr`。`size`\
  \ 变量通过将数组的总大小（字节）除以单个元素的大小（字节）来计算。这确保了即使数组大小发生变化，程序仍然能够正常工作。\n\n接，，我们将变量 `sum` 初始化为\
  \ `0`。该变量将累加数组中所有元素的和。\n\n使用 `for` 循环来遍历数组。它从 `i = 0` 开始，一直持续到 `i < size`。在每次迭代中，使用\
  \ `+=` 运算符将 `arr[i]` 的值加到 `sum` 变量。\n\n最后，我们使用 `std::cout` 打印计算出的和。\n\n当你运行此程序时，输出将是：\n\
  `Sum of array elements: 30`\n\n这表明数组 `[2, 4, 6, 8, 10]` 中元素的和确实为 `30`。\n\n---\n\n\
  ## 14 - 数组平均值\n\n这是一个 C++ 程序示例，用于计算数组中所有元素的平均值：\n\n```cpp\n#include <iostream>\n\
  \ndouble calculateAverage(int arr[], int size) {\n    int sum = 0;\n    for (int\
  \ i = 0; i < size; i++) {\n        sum += arr[i];  // 累加所有元素的和\n    }\n    return\
  \ static_cast<double>(sum) / size;  // 计算并返回平均值\n}\n\nint main() {\n    int arr[]\
  \ = {5, 10, 15, 20, 25};\n    int size = sizeof(arr) / sizeof(arr[0]);  // 计算数组的大小\n\
  \    double average = calculateAverage(arr, size);  // 调用函数计算平均值\n    std::cout\
  \ << \"Average: \" << average << std::endl;\n    return 0;\n}\n```\n\n**解释：**\n\n\
  1. `calculateAverage` 函数接收两个参数：`arr`（包含元素的数组）和 `size`（表示数组中元素的个数）。\n2. 在函数内部，变量\
  \ `sum` 被初始化为 `0`。它将用于用于累加所有元素的和。\n3. 使用 `for` 循环遍历数组的每个元素。循环从 `0` 开始，持续到 `size-1`。\n\
  4. 在循环内部，数组的每个元素 `arr[i]` 被加到 `sum` 变量。\n5. 循环结束后，通过将 `sum` 除以数组的 `size` 来计算平均值。为了确保除法准确，使用\
  \ `static_cast<double>(sum)` 表达式将 `sum` 转换为 `double`。\n6. 最后，`calculateAverage`\
  \ 函数返回计算出的平均值。\n7. 在 `main` 函数中，定义了一个包含某些示例值的示例数组 `arr`。\n8. 使用表达式 `sizeof(arr)\
  \ / sizeof(arr[0])` 计算数组的 `size`，它通过将数组的总大小除以单个元素的大小确定元素的总数。\n9. 将数组及其大小传递 `calculateAverage`\
  \ 函数，并将得到的平均值存储在变量 `average` 中。\n10. 然后使用 `std::cout` 将 `average` 打印到控制台。\n\n当你运行此程序时，它将输出：\n\
  `Average: 15`\n\n在此示例中，数组 `{5, 10, 15, 20, 25}` 中元素的平均值为 `15`。\n\n---\n\n## 15 -\
