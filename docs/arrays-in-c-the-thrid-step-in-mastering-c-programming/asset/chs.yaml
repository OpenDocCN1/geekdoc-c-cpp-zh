  9. 使用 `std::cout` 打印结果。\n\n---\n\n## 16 - 数组最小值\n\n这是一个查找数组中最小元素的 C++ 程序：\n\n```cpp\n\
  #include <iostream>\n\nint findMinimum(int arr[], int size) {\n    int minimum =\
