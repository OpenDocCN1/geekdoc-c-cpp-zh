  \ 然后，遍历 `sortedArr1`，使用 `std::binary_search` 检查元素是否存在于 `sortedArr2` 中。\n4. 如果不存在，则将其添加到\
  \ `difference` 中。\n5. 最后，返回 `difference` 向量。\n在 `main` 函数中，我们调用 `arrayDifference`\
  \ 并传入两个数组。当你运行该程序时，输出将是：\n\nElements unique to arr1: 1 2 4 \n\n# 30\n# 数组子集 (Array\
