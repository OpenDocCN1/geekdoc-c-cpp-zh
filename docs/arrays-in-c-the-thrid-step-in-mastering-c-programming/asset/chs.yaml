  \n# 77\n\n## 数组加一\n\n这是一个 C++ 程序，用于给数字数组表示的数值加 1，并处理进位操作和数组扩容：\n\n```cpp\n#include\
  \ <iostream>\n\n#include <vector>\n\nstd::vector<int> addOneToArray(std::vector<int>&\
  \ digits) {\n    int carry = 1;  // 从进位为 1 开始\n    int n = digits.size();\n    //\
  \ 逆序遍历数组\n    for (int i = n - 1; i >= 0; --i) {\n        int sum = digits[i] +\
  \ carry;\n        digits[i] = sum % 10;  // 更新当前数字位\n        carry = sum / 10; \
  \ // 计算进位\n        // 如果没有进位了，我们可以停止遍历\n        if (carry == 0) {\n            break;\n\
  \        }\n    }\n    // 如果遍历后仍有进位，我们需要调整数组大小\n    if (carry > 0) {\n        digits.insert(digits.begin(),\
  \ carry);\n    }\n    return digits;\n}\n\nint main() {\n    std::vector<int> digits\
  \ = {9, 9, 9};  // 表示 999 的示例数组\n    std::cout << \"Original Array: \";\n    for\
  \ (int digit : digits) {\n        std::cout << digit << \" \";\n    }\n    std::cout\
  \ << std::endl;\n    std::vector<int> result = addOneToArray(digits);\n    std::cout\
  \ << \"Modified Array: \";\n    for (int digit : result) {\n        std::cout <<\
  \ digit << \" \";\n    }\n    std::cout << std::endl;\n    return 0;\n}\n```\n\n\
  解释：\n\n1. `addOneToArray` 函数接收数字数组的引用作为输入，并返回一个修改后的数组。\n2. 它从 `carry` 值为 `1` 开始，因为我们想给给定值加\
  \ 1。\n3. 函数从最后一个数字开始，逆序遍历数组。\n4. 对于每个数字，它将 `carry` 加到当前数字上，并将结果存储在相同的位置。\n5. 通过将\
  \ `sum` 除以 `10` 来更新 `carry`（以获取进位值）。\n6. 如果在遍历过程中 `carry` 变为 0，意味着不再有进一步的进位操作，函数跳出循环。\n\
  7. 遍历完成后，如果仍有剩余的 `carry`（`carry > 0`），意味着数组需要调整大小以容纳额外的数字。在这种情况下，我们使用 `insert` 函数在数组开头插入\
  \ `carry` 值。\n8. 最后，返回修改后的数组。\n9. 在 `main` 函数中，我们创建了一个表示数值 `999` 的示例数组 `digits`。\n\
  10. 打印原始数组。\n11. 调用 `addOneToArray`，并将修改后的数组存储在 `result` 中。\n12. 打印修改后的数组。\n\n上述程序的输出将是：\n\
  `Original Array: 9 9 9`\n`Modified Array: 1 0 0`\n该程序正确地为给定值加 1，处理了进位操作，并在必要时调整了数组。\n\
  \n# 78\n\n# 数组三元组和\n\n这是一个 C++ 程序，用于找到和与给定 `target` 最接近的三元组，使用排序和双指针技术在数组中实现：\n\n\
  ```cpp\n#include <iostream>\n\n#include <vector>\n#include <algorithm>\n#include\
  \ <climits>\n\nusing namespace std;\n\nint findClosestTripletSum(vector<int>& nums,\
  \ int target) {\n    int n = nums.size();\n    if (n < 3)\n        return 0;\n \
  \   sort(nums.begin(), nums.end()); // 对数组升序\n    int closestSum = INT_MAX;\n  \
  \  for (int i = 0; i < n - 2; i++) {\n        int left = i + 1; // 指向 nums[i] 后的元素\n\
  \        int right = n - 1; // 指向最后一个元素\n        while (left < right) {\n      \
  \      int currentSum = nums[i] + nums[left] + nums[right];\n            if (currentSum\
  \ == target)\n                return target;\n            if (abs(currentSum - target)\
  \ < abs(closestSum - target))\n                closestSum = currentSum;\n      \
  \      if (currentSum < target)\n                left++;\n            else\n   \
  \             right--;\n        }\n    }\n    return closestSum;\n}\n\nint main()\
  \ {\n    vector<int> nums = { -1, 2, 1, -4 };\n    int target = 1;\n    int closestSum\
  \ = findClosestTripletSum(nums, target);\n    cout << \"Closest sum: \" << closestSum\
  \ << endl;\n    return 0;\n}\n```\n\n解释：\n\n1. 首先，对数组进行升序排序。排序有助于我们更有效地利用双指针技术。\n\
  2. 将 `closestSum` 初始化为极大值（`INT_MAX`），以跟踪发现的最接近的和。\n3. 我们使用循环变量 `i` 从 `0` 到 `n -\
  \ 2` 遍历数组（其中 `n` 是数组的大小）。\n4. 在循环内部，初始化两个指针 `left` 和 `right`，分别指向 `nums[i]` 之后的元素和最后一个元素。\n\
  5. 当 `left` 小于 `right` 时，计算三元组之和 `currentSum`。\n6. 如果 `currentSum` 等于 `target`，直接返回\
  \ `target`。\n7. 如果 `currentSum - target` 的绝对值小于 `closestSum - target` 的绝对值，则将 `closestSum`\
  \ 更新为 `currentSum`。\n8. 如果 `currentSum` 小于 `target`，则 `left` 增；否则，则 `right` 减。\n\
  \n# 79\n\n## 数组子集\n\n要在 C++ 中生成数组的所有可能子集，你可以使用回溯或位操作。让我们探索这两种方法：\n\n回溯方法：回溯通过通过增量构建解决方案并在必要时撤销选择，来系统地探索所有可能的解决方案。以下是使用回溯生成数组子集的方法：\n\
  \n\n\n\n```cpp\nvoid generateSubsets(vector<int>& nums, vector<int>& subset, int\
  \ index) {\n    // 输出当前子集\n    for (int num : subset) {\n        cout << num <<\
  \ \" \";\n    }\n    cout << endl;\n    // 通过包含当前索引后的每个元素生成子集\n    for (int i =\
  \ index; i < nums.size(); i++) {\n        subset.push_back(nums[i]); // 包含当前元素\n\
  \        generateSubsets(nums, subset, i + 1); // 递归下一个索引\n        subset.pop_back();\
  \ // 排除当前元素\n    }\n}\n\nvoid generateAllSubsets(vector<int>& nums) {\n    vector<int>\
  \ subset;\n    generateSubsets(nums, subset, 0);\n}\n\nint main() {\n    vector<int>\
  \ nums = {1, 2, 3};\n    generateAllSubsets(nums);\n    return 0;\n}\n```\n\n此程序生成数组\
  \ `[1, 2, 3]` 的所有可能的子集。`generateSubsets` 函数使用回溯法包含当前索引后的每个元素并递归地生成子集。`generateAllSubsets`\
  \ 函数初始化一个空子集并从索引 `0` 开始开始回溯过程。\n\n### 位操作方法\n\n位操作是一种使用按位运算生成子集的有效方法。数组中的每个元素都可以用一个位表示，其中\
  \ `1` 表示包含在子集中，`0` 表示排除。以下是一个示例：\n\n```cpp\n#include <iostream>\n#include <vector>\n\
  \nusing namespace std;\n\nvoid generateAllSubsets(vector<int>& nums) {\n    int\
  \ n = nums.size();\n    int totalSubsets = 1 << n;\n    for (int i = 0; i < totalSubsets;\
  \ i++) {\n        vector<int> subset;\n        for (int j = 0; j < n; j++) {\n \
  \           if (i & (1 << j)) {\n                subset.push_back(nums[j]);\n  \
  \          }\n        }\n        // 输出当前子集\n        for (int num : subset) {\n \
  \           cout << num << \" \";\n        }\n        cout << endl;\n    }\n}\n\n\
  int main() {\n    vector<int> nums = {1, 2, 3};\n    generateAllSubsets(nums);\n\
  \    return 0;\n}\n```\n\n在此程序中，`generateAllSubsets` 函数从 `0` 迭代到 `2^n`（其中 `n` 是数组元素的数量），并使用按位操作确定每个元素是否包含在子集中。`subset`\
  \ 向量存储当前子集中的元素，然后将其打印出来。\n\n两种方法产生相同的输出，即给定数组 `[1, 2, 3]` 的所有可能的子集。请选择适合你需求和约束的方法。\n\
  \n## 80 数组唯一路径\n\n这是一个使用动态规划查找从给定网格左上角到右下角唯一路径数的 C++ 程序：\n\n```cpp\n#include <iostream>\n\
  #include <vector>\nint uniquePaths(int m, int n) {\n    // 创建一个大小为 m x n 的二维网格\n\
  \    std::vector<std::vector<int>> dp(m, std::vector<int>(n, 0));\n    // 将第一行和第一列初始化为\
  \ 1\n    for (int i = 0; i < m; ++i)\n        dp[i][0] = 1;\n    for (int j = 0;\
  \ j < n; ++j)\n        dp[0][j] = 1;\n    // 计算每个单元格的唯一路径数\n    for (int i = 1;\
  \ i < m; ++i) {\n        for (int j = 1; j < n; ++j) {\n            // 到达单元格 (i,\
  \ j) 的唯一路径数为\n            // 来自上方单元格 (i-1, j) 和左侧单元格 (j-1) 的路径之和\n            dp[i][j]\
  \ = dp[i-1][j] + dp[i][j-1];\n        }\n    }\n    // 返回右下角单元格的唯一路径数\n    return\
  \ dp[m-1][n-1];\n}\nint main() {\n    int m, n;\n    std::cout << \"Enter 行数: \"\
  ;\n    cin >> m;\n    std::cout << \"输入列数: \";\n    cin >> n;\n    int paths = uniquePaths(m,\
  \ n);\n    std::cout << \"唯一路径数: \" << paths << std::endl;\n    return 0;\n}\n```\n\
  \n### 解析\n在此程序中，我们使用动态规划方法来解决问题。我们创建了一个大小为 `m x n` 的二维网格 `dp`，其中每个单元格 `dp[i][j]`\
  \ 表示从左上角到达该单元格的唯一路径数。\n\n我们将第一行和第一列初始化为 `1`，因为到达第一行或第一列中的任何单元格只有一种方式（向右或向下）。\n\n\
  然后，我们遍历网格的剩余单元格（从第二行和第二列开始），并计算到达每个单元格的唯一路径数。到达单元格 `(i, j)` 的唯一路径数为上方单元格 `(i-1,\
  \ j)` 和左侧单元格 `(j-1)` 路径之和。最后，我们返回右下角单元格的唯一路径数。\n\n\n\n```cpp\nint currentSum;\n\n\
  if (i == 0 && j == 0) {\n    currentSum = prefixSum[k][l];\n} else if (i == 0) {\n\
