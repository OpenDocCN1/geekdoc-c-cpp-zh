  \ (`position`) 以及要插入的元素 (`element`)。\n\n首先，它会检查指定的位置是否有效。如果该位置小于 0 或大于当前的 `size`，它会打印一条错误信息并返回。\n\
  \n如果位置有效，该函数将开始从插入位置向右移动元素。它会从最后一个元素一直迭代到插入位置，并将每个元素向右移动一位。\n\n在移动完元素后，该函数通过将元素值赋值给\
  \ `arr[position]` 在指定的位置处插入新元素。\n\n最后，该函数会增加数组的大小 (`size`)，以包含新插入的元素。\n\n`displayArray`\
  \ 函数是一个辅助函数，用于打印数组的元素。\n\n在 `main` 函数中，程序提示用户输入数组的大小、数组的元素、`position` 以及要插入的元素。然后，它调用\
  \ `insertElement` 函数并显示结果数组。\n\n注意：此程序假定数组有足够的空间来容纳新元素，并且没有进行任何边界检查。\n\n## 25 -\
  \ 数组删除\n\n这里有一个 C++ 程序，演示了如何在数组的特定位置删除元素并移动剩余元素以填补空格：\n\n```cpp\n#include <iostream>\n\
  \nvoid deleteElement(int arr[], int& size, int position) {\n    if (position < 0\
  \ || position >= size) {\n        std::cout << \"Invalid position.\" << std::endl;\n\
  \        return;\n    }\n    // 移动元素填补空格\n    for (int i = position; i < size -\
  \ 1; i++) {\n        arr[i] = arr[i + 1];\n    }\n    // 递减数组的大小\n    size--;\n\
  \    std::cout << \"Element at position \" << position << \" has been deleted.\"\
  \ << std::endl;\n}\n\nint main() {\n    const int MAX_SIZE = 100;\n    int arr[MAX_SIZE]\
  \ = {1, 2, 3, 4, 5};\n    int size = 5;\n    int position;\n    std::cout << \"\
  Enter the position of the element to delete: \";\n    std::cin >> position;\n  \
  \  deleteElement(arr, size, position);\n    std::cout << \"Updated array: \";\n\
  \    for (int i = 0; i < size; i++) {\n        std::cout << arr[i] << \" \";\n \
  \   }\n    std::cout << std::endl;\n    return 0;\n}\n```\n\n### 解释：\n\n1. `deleteElement`\
  \ 函数接收三个参数：数组 `arr`、`size` 的引用以及要删除元素的位置 `position`。\n2. 首先，它会检查提供的 `position` 是否有效，即它应该在数组的范围内。\n\
  3. 如果位置有效，该函数开始移动元素以填补空格。它从 `position` 迭代到数组的倒数第二个元素。\n4. 对于每次迭代，它将下一个元素的值赋值给当前元素，从而有效地将所有元素向左移动一位。\n\
  5. 在移动完成后，数组的大小 `size` 减去 1，以反映删除操作。\n6. 最后，在 `main` 函数中，提示用户输入 `position`。\n7.\
  \ 使用提供的 `position`、`arr` 和 `size` 调用 `deleteElement` 函数。\n8. 随后打印更新后的数组以验证元素的删除和移动。\n\
  \n注意：此程序假定数组包含整数。你可以通过更改数组类型并相应调整语句来使其适用于其他类型。\n\n## 26 - 数组回文\n\n这里有一个 C++ 程序，用于检查数组是否为回文：\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\n\nbool isPalindrome(int arr[],\
  \ int size) {\n    int start = 0;\n    int end = size - 1;\n    while (start < end)\
  \ {\n        if (arr[start] != arr[end]) {\n            return false;\n        }\n\
  \        start++;\n        end--;\n    }\n    return true;\n}\n\nint main() {\n\
  \    int arr[] = {1, 2, 3, 2, 1};\n    int size = sizeof(arr) / sizeof(arr[0]);\n\
  \    if (isPalindrome(arr, size)) {\n        cout << \"The array is a palindrome.\"\
  \ << endl;\n    } else {\n        cout << \"The array is not a palindrome.\" <<\
  \ endl;\n    }\n    return 0;\n}\n```\n\n在这个程序中，`isPalindrome` 函数用于检查数组是否为回文。它接收两个参数：`arr`（要检查的数组）和\
  \ `size`（大小）。\n\n函数使用两个索引 `start` 和 `end` 来比较数组的开头和结尾。它通过初始化 `start` 为 0（第一个元素），`end`\
  \ 为 `size - 1`（最后一个元素）。\n\n函数进入一个 `start < end` 的 `while` 循环。在循环内部，它比较 `arr[start]`\
  \ 和 `arr[end]`。如果它们不等，则返回 `false`。\n\n如果相等，函数增加 `start` 并递减 `end`，向数组中心移动。当 `while`\
  \ 循环在没有遇到不匹配元素的情况下结束时，函数返回 `true`，表示这是一个回文。\n\n在 `main` 函数中，定义了一个示例数组并使用 `sizeof`\
  \ 运算符计算其大小。然后调用 `isPalindrome` 函数并传入数组和大小。根据返回值，打印数组是否为回文。\n\n## 27 - 数组交集\n\n这里有一个查找两个数组交集的\
  \ C++ 示例程序：\n\n```cpp\n#include <iostream>\n#include <unordered_set>\n#include <vector>\n\
  \nstd::vector<int> findIntersection(const std::vector<int>& array1, const std::vector<int>&\
  \ array2) {\n    std::unordered_set<int> set1(array1.begin(), array1.end());  //\
  \ 将 array1 转换为集合\n    std::vector<int> result;\n    for (const auto& element : array2)\
  \ {\n        if (set1.count(element) > 0) {\n            result.push_back(element);\
  \  // 将共同元素加入结果向量\n            set1.erase(element);      // 从 set 中移除元素以避免重复\n \
  \       }\n    }\n    return result;\n}\n\nint main() {\n    std::vector<int> array1\
  \ = {1, 2, 3, 4, 5};\n    std::vector<int> array2 = {3, 4, 5, 6, 7};\n    std::vector<int>\
  \ intersection = findIntersection(array1, array2);\n    std::cout << \"Intersection:\
