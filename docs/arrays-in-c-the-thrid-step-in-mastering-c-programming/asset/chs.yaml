  }\n```\n\n# 76\n\n# 数组区间合并\n\n这是一个使用 C++ 合并重叠区示例：\n\n```cpp\n#include <iostream>\n\
  #include <vector>\n#include <algorithm>\n\nusing namespace std;\n\nstruct Interval\
  \ {\n    int start;\n    int end;\n};\n\nbool compareIntervals(const Interval& a,\
  \ const Interval& b) {\n    return a.start < b.start;\n}\n\nvector<Interval> mergeIntervals(vector<Interval>&\
  \ intervals) {\n    if (intervals.empty()) {\n        return {};\n    }\n    vector<Interval>\
  \ mergedIntervals;\n    vector<Interval> sortedIntervals = intervals;\n    // 根据起始点排序区间\n\
  \    sort(sortedIntervals.begin(), sortedIntervals.end(), compareIntervals);\n \
  \   \n    mergedIntervals.push_back(sortedIntervals[0]);\n    for (int i = 1; i\
  \ < sortedIntervals.size(); i++) {\n        if (sortedIntervals[i].start <= mergedIntervals.back().end)\
  \ {\n            // 当前区间与上一个区间重叠，合并它们\n            mergedIntervals.back().end =\
  \ max(mergedIntervals.back().end, sortedIntervals[i].end);\n        } else {\n \
  \           // 当前区间与上一个区间不重叠，将其加入合并后的区间\n            mergedIntervals.push_back(sortedIntervals[i]);\n\
  \        }\n    }\n    return mergedIntervals;\n}\n\nvoid printIntervals(const vector<Interval>&\
  \ intervals) {\n    for (const auto& interval : intervals) {\n        cout << \"\
