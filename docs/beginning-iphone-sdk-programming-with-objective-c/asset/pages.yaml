    # Making the Keyboard Go Away


    In the earlier part of this chapter, you saw that the keyboard in the iPhone automatically
    appears when you select a TextField view. However, making the keyboard go away
    requires additional effort on the part of the programmer. In this section, you
    will see how you can programmatically dismiss the keyboard when you are done with
    the typing. The first technique is demonstrated in the following Try It Out.


    ![](img/aab2d775c46f70cd606f2e58e2521324_150_0.png)


    FIGURE 5-8


    # TRY IT OUT Dismissing the Keyboard (Technique 1)


    +   1. Using the project you created earlier, double-click the KeyboardInputsViewController.xib
    file to edit it using Interface Builder.

    +   2. With the File''s Owner item selected in the KeyboardInputsViewController.xib
    window, view its Identity Inspector window and create a new action called doneEditing:
    (see Figure 5-9).


