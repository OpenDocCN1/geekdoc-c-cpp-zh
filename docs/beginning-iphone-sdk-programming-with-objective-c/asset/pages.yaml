  md: "# How It Works\n\nThe preceding example is a bit more interesting than the\
    \ examples earlier in the chapter. Basically, you added a new XIB file and a corresponding\
    \ View Controller class to the project. This new View window will be used to display\
    \ the movie that you have touched in the View containing the Table view.\n\nNow,\
    \ in order for the View window containing the Table view to be able to pass the\
    \ name of the movie selected to the details View window, you would need to create\
    \ a property on the details View window. This is done through the textSelected\
    \ property:\n\n```\n```objc\n@property (nonatomic, retain) NSString *textSelected;\n\
    ```\n```\n\nAt the same time, you create method called initWithTextSelected: so\
    \ that the calling view can set the value of the textSelected property:\n\n```\n\
    ```objc\n- (id) initWithTextSelected: (NSString *) text {\n    self.textSelected\
    \ = text;\n    [label setText:[self textSelected]];\n    return self;\n}\n```\n\
    ```\n\nTo navigate from the View containing the Table view to the details view,\
    \ you use the pushViewController: method of the UINavigationController object\
    \ within the tableView:didSelectRowAtIndexPath: method:\n\n```\n```objc\n//--create\
    \ an instance of the DetailsViewController---\nif (self.detailsViewController\
    \ == nil)\n{\n    DetailsViewController *d = [[DetailsViewController alloc]\n\
    \                                initWithNibName:@\"DetailsView\"\n          \
    \                      bundle:[NSBundle mainBundle]];\n    self.detailsViewController\
    \ = d;\n    [d release];\n}\n\n//--set the movies selected in the method of the\n\
    // DetailsViewController---\n[self.detailsViewController initWithTextSelected:message];\n\
    \n//---navigate to the details view---\n[self.navigationController pushViewController:self.detailsViewController\n\
    \                                     animated:YES];\n```\n```\n\n# Missing Back\
    \ Button\n\nRecall that earlier on, you set the title of the navigation item in\
    \ the RootViewController.m file like this:\n\n```\n```objc\n- (void)viewDidLoad\
    \ {\n\n    //--initialize the array---\n    listOfMovies = [[NSMutableArray alloc]\
    \ init];\n\n    //--add items---\n```\n```"
