  md: "The UITableViewDelegate protocol contains events that allow you to manage selections,\
    \ edit and delete rows, and display a header and footer.\n\nTo use the UITableViewDelegate\
    \ protocol, modify the TableViewExampleViewController.h file by adding the statement\
    \ in bold as follows:\n\n```\n#import <UIKit/UIKit.h>\n\n@interface TableViewExampleViewController\
    \ : UIViewController\n    <UITableViewDataSource,\n    UITableViewDelegate>{\n\
    \n}\n\n@end\n```\n\nStrictly speaking, if you have connected the delegate outlet\
    \ to the File’s Owner item previously (see Figure 10-8), you don’t need to add\
    \ the preceding statement (UITableViewDelegate). Either you write the preceding\
    \ statement or connect the outlet in Interface Builder. However, doing both doesn’t\
    \ hurt.\n\n![](img/aab2d775c46f70cd606f2e58e2521324_266_0.png)\n\nFIGURE 10-8\n\
    \nThe following Try It Out shows how you can allow users to make selections in\
    \ a Table view."
