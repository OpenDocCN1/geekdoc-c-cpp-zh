- pgno: 174
  md: "# How It Works\n\nBy default, the iPhone application project you created using\
    \ Xcode supports a single orientation — portrait mode. If you want to support\
    \ screen orientations other than the default portrait mode, you can do so by overriding\
    \ the `shouldAutorotateToInterfaceOrientation:` method in a view controller. This\
    \ event is commented out by default in the `ScreenRotationsViewController.m` file:\n\
    \n```\n/*\n * Override to allow orientations other than the default portrait orientation.\n\
    \ - (BOOL)shouldAutorotateToInterfaceOrientation:\n       (UIInterfaceOrientation)interfaceOrientation\
    \ {\n    // Return YES for supported orientations\n    return (interfaceOrientation\
    \ == UIInterfaceOrientationPortrait);\n }\n*/\n```\n\n> > **NOTE** On the iPhone,\
    \ screen rotation is automatically handled by the OS. When the OS detects a change\
    \ in screen orientation, it fires the `shouldAutorotateToInterfaceOrientation:`\
    \ event; it is up to the developer to decide how the application should display\
    \ in the target orientation.\n\nThe `shouldAutorotateToInterfaceOrientation:`\
    \ method is called when the View is loaded and when orientation of the device\
    \ changes. This event passes in a single parameter — the orientation that the\
    \ device has been changed to. The returning value of this event determines whether\
    \ the current orientation is supported.\n\nIf you want to support all screen orientations,\
    \ simply return a `YES`:\n\n```\n- (BOOL)shouldAutorotateToInterfaceOrientation:\n\
    (UIInterfaceOrientation)interfaceOrientation {\n\n    return YES;\n\n}\n```\n\n\
    This means that your application will rotate to all orientations (the status bar\
    \ will always appear at the top) when the device is rotated.\n\nTo support specific\
    \ orientations, simply perform an equality check to specify the orientation supported.\
    \ For example, the following code snippet shows that only the left landscape orientation\
    \ is supported.\n\n```\n- (BOOL)shouldAutorotateToInterfaceOrientation:\n(UIInterfaceOrientation)interfaceOrientation\
    \ {\n\n    return (interfaceOrientation == UIInterfaceOrientationLandscapeLeft);\n\
    \n}\n```"
  merge: -1
  img_proc: true
