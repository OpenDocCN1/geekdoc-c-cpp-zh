  md: "# Loading the Settings Values\n\nWith the user interface of the application\
    \ ready, it is now time to see how you can programmatically load the values of\
    \ the preference settings and then display them in your application. This display\
    \ is useful because it gives your user a chance to view the values of the settings\
    \ without needing to go to the Settings application.\n\n# TRY IT OUT  Loading\
    \ Settings Values\n\n+   1. Insert the following lines of code that appear in\
    \ bold to the `MainViewController.m` file (make sure that the code line with password\
    \ and favorite color markers is entered all on one line, unlike how it appears\
    \ in the following code):\n\n```\n```objective-c\n#import \"MainViewController.h\"\
    \n#import \"MainView.h\"\n\n@implementation MainViewController\n\n- (IBAction)\
    \ loadSettings: (id) sender{\n\n    NSUserDefaults *defaults = [NSUserDefaults\
    \ standardUserDefaults];\n\n    NSString *strLoginname = [defaults objectForKey:@\"\
    login_name\"];\n    NSString *strPassword = [defaults objectForKey:@\"password\"\
    ];\n    NSString *strColor = [defaults objectForKey:@\"color\"];\n\n    NSString\
    \ *str = [[[NSString alloc] initWithFormat:@\"Login name is \\\"%@\\\", password\
    \ is \\\"%@\\\", and favorite color is \\\"%@\\\"\",\n                      strLoginname,\
    \ strPassword, strColor];\n\n    UIAlertView *alert = [[UIAlertView alloc]\n \
    \                         initWithTitle:@\"Settings Values\"\n               \
    \           message:str\n                          delegate:nil\n            \
    \              cancelButtonTitle:@\"Done\"\n                          otherButtonTitles:nil]\n\
    [alert show];\n\n[strLoginname release];\n[strPassword release];\n[strColor release];\n\
    [str release];\n[alert release];\n}\n```\n```\n\n+   2. Press Command-R to test\
    \ the application on the iPhone Simulator. When the application is loaded, tap\
    \ on the Load Settings Values button and you should see the settings values displayed\
    \ in an alert view (see Figure 11-18).\n\n![](img/aab2d775c46f70cd606f2e58e2521324_309_0.png)"
