- pgno: 32
  md: '# # 1

    # Getting Started with

    # iPhone Programming


    # WHAT YOU WILL LEARN IN THIS CHAPTER


    +   - How to obtain the iPhone SDK

    +   - The components included in the iPhone SDK

    +   - The Features of the development tools — Xcode, Interface Builder, iPhone
    Simulator

    +   - The Capabilities of the iPhone Simulator

    +   - The Architecture of the iPhone OS

    +   - The Frameworks of the iPhone SDK

    +   - The Limitations and characteristics of the iPhone


    Welcome to the world of iPhone programming! If that you are now holding this book
    shows that you are fascinated with the idea of developing your iPhone applications
    and want to join the ranks of those tens of thousands of developers whose applications
    are already deployed in the AppStore.


    As the old Chinese adage says, “To accomplish your mission, first sharpen your
    tools.” Successful programming requires you first of all to know your tools well.
    Indeed, this couldn’t be more true for iPhone programming — you need to know quite
    a few tools before you can even get started. Hence, the goal of this chapter is
    to show you the various relevant tools and information you need to jump on the
    iPhone development bandwagon.


    Without further ado, it’s time to get down to work.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# OBTAINING THE IPHONE SDK


    To develop for the iPhone or iPod Touch, you first need to sign up as a Registered
    iPhone Developer at http://developer.apple.com/iphone/program/start/register/.
    The registration is free and provides you with access to the iPhone SDK and other
    resources that are useful for getting started.


    After signing up, you can download the iPhone SDK (see Figure 1-1).


    ![](img/aab2d775c46f70cd606f2e58e2521324_33_0.png)


    FIGURE 1-1


    Before you install the iPhone SDK, make sure you satisfy the following system
    requirements:


    +   - Only Intel Macs are supported, so if you have another processor type (such
    as the older G4 or G5 Macs), you’re out of luck.

    +   - You have updated your system with the latest Mac OS X release.


    An iPhone/iPod Touch device is highly recommended, though not strictly necessary.
    To test your application, you can use the included iPhone Simulator. However,
    if you want to test certain hardware features like the camera, accelerometer,
    and such, you will need to use a real device.


    When the SDK is downloaded, proceed with installing it (see Figure 1-2). You will
    be asked to accept a few licensing agreements and then select the destination
    folder in which to install the SDK.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '![](img/aab2d775c46f70cd606f2e58e2521324_34_0.png)


    FIGURE 1-2


    If you have selected the default settings during the installation phase, after
    the installation you should be able to find the various tools installed in the
    /Developer/Applications folder (see Figure 1-3).


    ![](img/aab2d775c46f70cd606f2e58e2521324_34_1.png)


    FIGURE 1-3


    # COMPONENTS OF THE IPHONE SDK


    The iPhone SDK includes a suite of development tools to help you develop applications
    for your iPhone and iPod Touch. It includes:


    +   - **Xcode** — the Integrated Development Environment (IDE) that allows you
    to manage, edit, and debug your projects.

    +   - **Dashcode** — the Integrated Development Environment (IDE) that allows
    you to develop web-based iPhone applications and Dashboard Widgets. Dashcode is
    beyond the scope of this book.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '+   - iPhone Simulator — provides a software simulator to simulate an iPhone
    on your Mac.

    +   - Interface Builder — provides a visual editor for designing your user interfaces
    for your iPhone applications.

    +   - Instruments — analysis tool to help you optimize your application in real-time.


    The following sections discuss each tool in more detail.


    # Xcode


    As mentioned, all the tools in the iPhone SDK are installed in the `/Developer/Applications`
    folder (when using the default settings). One of those tools is Xcode.


    To launch Xcode, double-click the Xcode icon (refer to Figure 1-3). Alternatively,
    go the quicker route and use Spotlight: Simply type Xcode into the search box
    and Xcode should be in the Top Hit position.


    After Xcode is launched, you see the Welcome screen, shown in Figure 1-4.


    ![](img/aab2d775c46f70cd606f2e58e2521324_35_0.png)


    FIGURE 1-4'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Using Xcode, you can develop different types of iPhone and Mac OS X applications
    (see Figure 1-5).


    ![](img/aab2d775c46f70cd606f2e58e2521324_36_0.png)


    **FIGURE 1-5**


    The IDE in Xcode provides many tools and features that make your development life
    much easier. One such feature is Code Completion (see Figure 1-6), which displays
    a pop-up list showing the available classes and members (such as methods, properties,
    and so on).'
  merge: -1
  img_proc: true
- pgno: 37
  md: '![](img/aab2d775c46f70cd606f2e58e2521324_37_0.png)


    FIGURE 1-6


    > **NOTE** For a more comprehensive description of some of the most commonly used
    features in Xcode, refer to Appendix B.


    # iPhone Simulator


    The iPhone Simulator (see Figure 1-7) is a very useful tool included in the iPhone
    SDK that you can use to test your application without using your actual iPhone/iPod
    Touch. The iPhone Simulator is located in the /Developer/iPhone OS/Platforms/iPhoneSimulator.platform/Developer/Applications/
    folder. Most of the time, you don’t need to launch the iPhone Simulator directly
    — running (or debugging) your application in Xcode automatically brings up the
    iPhone Simulator. Xcode installs the application on the iPhone Simulator automatically.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# THE IPHONE SIMULATOR IS NOT AN EMULATOR


    The iPhone Simulator is a simulator, not an emulator. So what is the difference?
    Well, a simulator tries to mimic the behavior of a real device. In the case of
    the iPhone Simulator, it simulates the real behavior of an actual iPhone device.
    However, the simulator itself uses the various libraries installed on the Mac
    (such as QuickTime) to perform its rendering so that the effect looks the same
    as an actual iPhone. Also, applications tested on the simulator are compiled into
    x86 code, which is the byte-code understood by the simulator.


    In contrast, an emulator emulates the working of a real device. Applications tested
    on an emulator are compiled into the actual byte-code used by the real device.
    The emulator executes the application by translating the byte-code into a form
    that can be executed by the host computer running the emulator.


    A good way to understand the subtle difference between simulation and emulation
    is this: Imagine you are trying to convince a child that playing with knives is
    dangerous. To simulate this, you pretend to cut yourself with a knife and groan
    in pain. To emulate this, you hold a knife and actually cut yourself.


    ![](img/aab2d775c46f70cd606f2e58e2521324_38_0.png)


    FIGURE 1-7


    The iPhone Simulator can simulate different versions of the iPhone OS (see Figure
    1-8). This capability is very useful if you need to support older versions of
    the platform as well as testing and debugging errors reported in the application
    on specific versions of the OS.


    ![](img/aab2d775c46f70cd606f2e58e2521324_38_1.png)


    FIGURE 1-8'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Features of the iPhone Simulator


    The iPhone Simulator simulates various features of a real iPhone or iPod touch
    device. Features you can test on the iPhone Simulator include:


    +   - Screen rotation — left, top, and right

    +   - Support for gestures:

    +     - Tap

    +     - Touch and Hold

    +     - Double Tap

    +     - Swipe

    +     - Flick

    +     - Drag

    +     - Pinch

    +   - Low-memory warning simulations


    However, the iPhone Simulator, being a software simulator for the real device,
    does have its limitations. Features not available on the iPhone Simulator include:


    +   - Obtaining location data — it returns only a fixed coordinate, such as Latitude
    37.3317 North and Longitude 122.0307 West

    +   - Making phone calls

    +   - Accessing the Accelerometer

    +   - Sending and receiving SMS messages

    +   - Installing applications from the App Store

    +   - Camera

    +   - Microphone

    +   - Several features of OpenGL ES


    It is worth noting that the speed of the iPhone Simulator is more tightly coupled
    to the performance of your Mac, as opposed to how the actual device performs.
    Hence, it is important that you test your application on a real device rather
    than rely exclusively on the iPhone Simulator for testing.


    Although you have limitations with the iPhone Simulator, it is definitely a useful
    tool to get your applications tested. That said, testing your application on a
    real iPhone or iPod touch device is imperative before you deploy it on the AppStore.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '> **NOTE** For a more detailed look at how you can test your application on
    a real device, refer to Appendix E.


    # Uninstalling Applications from the iPhone Simulator


    The user domain of the iPhone OS file system for the iPhone Simulator is stored
    in the `~/Library/Application Support/iPhone Simulator/User/` folder.


    > **NOTE** The `~/Library/Application Support/iPhone Simulator/User/` folder is
    also known as the `<iPhoneUserDomain>`.


    All third-party applications are stored in the `<iPhoneUserDomain>/Applications/`
    folder. When an application is deployed onto the iPhone Simulator, an icon is
    created on the Home screen (shown on the left in Figure 1-9) and a file and a
    folder are created within the Applications folder (shown on the right in Figure
    1-9).


    ![](img/aab2d775c46f70cd606f2e58e2521324_40_0.png)


    FIGURE 1-9


    To uninstall (delete) an application, execute the following steps:


    +   1. Click and hold the icon of the application in the Home screen until all
    the icons start wriggling. Observe that all the icons now have an “x” button displayed
    on their top left corners.

    +   2. Click the x button (see Figure 1-10) next to the icon of the application
    you want to uninstall.

    +   3. An alert window appears asking if you are sure you want to delete the icon.
    Click Delete to confirm the deletion.


    ![](img/aab2d775c46f70cd606f2e58e2521324_40_1.png)


    FIGURE 1-10'
  merge: -1
  img_proc: true
- pgno: 41
  md: <!-- no content -->
  merge: -1
