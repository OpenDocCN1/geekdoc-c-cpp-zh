- pgno: 178
  md: "![](img/aab2d775c46f70cd606f2e58e2521324_178_0.png)\n\nFIGURE 6-6\n\nThe fromInterfaceOrientation\
    \ parameter indicates the orientation that it is changing from, whereas the duration\
    \ parameter indicates the duration of the second half of the rotation, in seconds.\n\
    \nIn this event, you typically perform tasks when the rotation is halfway done,\
    \ such as repositioning the views on the View, resuming media playback, and so\
    \ on.\n\n# willRotateToInterfaceOrientation:\n\nThe previous two events are fired\
    \ consecutively — first the willAnimateFirstHalfOfRotationToInterfaceOrientation:\
    \ is fired, followed by the willAnimateSecondHalfOfRotationFromInterfaceOrientation\
    \ event. If you do not need two separate events for handling rotation, you can\
    \ use the simpler willRotateToInterfaceOrientation: event.\n\nThe willRotateToInterfaceOrientation:\
    \ event is fired before the orientation starts. In contrast to the previous two\
    \ events, this is a one-step process. Note that if you handle this event, the\
    \ willAnimateFirstHalfOfRotationToInterfaceOrientation: and willAnimateSecondHalfOfRotationFromInterfaceOrientation:\
    \ events will not be fired anymore.\n\nThe method looks like this:\n\n```\n- (void)willRotateToInterfaceOrientation:\n\
    (UIInterfaceOrientation) toInterfaceOrientation\n duration: (NSTimeInterval) duration\
    \ {\n\n}\n```\n\nThe toInterfaceOrientation parameter indicates the orientation\
    \ that it is changing to, and the duration parameter indicates the duration of\
    \ the rotation, in seconds."
  merge: -1
  img_proc: true
- pgno: 179
  md: "# willAnimateRotationToInterfaceOrientation:\n\nBesides the willRotateToInterfaceOrientation:\
    \ event, there is yet another event that you can handle before the rotation starts\
    \ — the willAnimateRotationToInterfaceOrientation: event. The willAnimateRotationToInterfaceOrientation:\
    \ event is fired before the animation of the rotation starts.\n\n> NOTE If you\
    \ handle both the willRotateToInterfaceOrientation: and willAnimateRotationToInterfaceOrientation:\
    \ events, the former will fire first, followed by the latter.\n\nThe method looks\
    \ like this:\n\n```\n```objc\n- (void)willAnimateRotationToInterfaceOrientation:\n\
    (UIInterfaceOrientation) interfaceOrientation\n duration: (NSTimeInterval) duration\
    \ {\n}\n```\n```\n\nThe interfaceOrientation parameter specifies the target orientation\
    \ to which it is rotating.\n\n> NOTE If you handle this event, the willAnimateFirstHalfOfRotationToInterfaceOrientation:\
    \ and willAnimateSecondHalfOfRotationFromInterfaceOrientation: events will not\
    \ fire anymore.\n\nIn the following Try It Out, you will see how you can reposition\
    \ the views on your UI when the device changes orientation.\n\n# TRY IT OUT Repositioning\
    \ Views during Orientation Change\n\n+   1. Using the same project created earlier,\
    \ double-click the ScreenRotationsViewController.xib file and add a Round Rect\
    \ Button view to the View (see Figure 6-7)."
