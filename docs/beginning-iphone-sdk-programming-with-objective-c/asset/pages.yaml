  md: '# Designing the View Window


    To design your View window, you can drag and drop views from the Library window
    (choose Tools ⇨ Library). Figure 3-9 shows the Library window containing all the
    various views you can add to your View window.


    If you are new to iPhone development, you may not know that it is better to display
    the various views in the Library window as icons and labels. To do so, click the
    asterisk/star-like icon located at the bottom on the Library window and select
    View Icons and Labels (see Figure 3-10).


    Doing so displays the view names together with the icons (see Figure 3-11).


    ![](img/aab2d775c46f70cd606f2e58e2521324_80_0.png)


    ![](img/aab2d775c46f70cd606f2e58e2521324_80_1.png)


