  md: '# USING THE VIEWS


    So far, you have seen quite a number of views in action in the previous few chapters
    — Round Rect Button, TextField, and Label. All these views are quite straightforward,
    but they give you a good opportunity to understand how to apply the concepts behind
    outlets and actions.


    To use more views, you can locate them from the Library window in Interface Builder
    (see Figure 4-1).


    ![](img/aab2d775c46f70cd606f2e58e2521324_107_0.png)


    FIGURE 4-1


    As you can see, the Library is divided into sections:


    +   - Controllers — contains views that control other views, such as the View
    Controller, Tab Bar Controller, Navigation Controller, and so on

    +   - Data Views — contains views that display data, such as the Image View, Table
    View, Data Picker, Picker View, and so on

    +   - Inputs and Values — contains views that accept inputs from users, such as
    the Label, Round Rect Button, Text Field, and so on

    +   - Windows, Views & Bars — contains views that display other, miscellaneous
    views, such as View, Search Bar, Toolbar, and so on'
  merge: -1
  img_proc: true
- pgno: 108
  md: "In the following sections, you learn how to use some of the views available\
    \ in the Library. Although it is beyond the scope of this book to show the use\
    \ of each view, you have the opportunity to see a number of views in action throughout\
    \ the book. In this chapter, you learn some of the fundamental concepts of dealing\
    \ with views so that you can use other views without problems.\n\n# Using the\
    \ Alert View\n\nOne of the views that is not listed in the Library is the UIAlertView.\
    \ The UIAlertView displays an alert view to the user and is usually created during\
    \ runtime. Hence, to use it you have to create it using code.\n\n> > **NOTE**\
    \ You have actually seen the UIAlertView in the previous chapter. In this section,\
    \ you see how it actually works.\n\nThe UIAlertView is useful for cases in which\
    \ you have to display a message to the user. In addition, it can serve as a quick\
    \ debugging tool when you want to observe the value of a variable during runtime.\n\
    \nThe following Try It Out explores the UIAlertView in more detail. You need to\
    \ download the code as indicated here.\n\n# TRY IT OUT: Using the Alert View\n\
    \n*Codefile UsingViews.zip available for download at Wrox.com*\n\n+   1. Using\
    \ Xcode, create a new View-Based Application project and name it `UsingViews`.\n\
    +   2. In the `UsingViewsViewController.m` file, add the following code that appears\
