- pgno: 341
  md: "![](img/aab2d775c46f70cd606f2e58e2521324_341_0.png)\n\n# How It Works\n\nThe\
    \ first part of this example shows how you can add a property list file to your\
    \ application. In the property list file, you add three keys representing the\
    \ category of applications in the AppStore: Entertainment, Games, and Utilities.\
    \ Each category contains a list of application titles.\n\nWhen the view is loaded,\
    \ you first try to locate a file named `Apps.plist` in the Documents directory\
    \ of your application:\n\n```\n```objective-c\n//---get the path to the property\
    \ list file---\nNSString *plistFileName = [self.documentsPath\n              \
    \              stringByAppendingPathComponent:@\"Apps.plist\"];\n```\n```\n\n\
    If the file is found, you then load its content into an NSDictionary object:\n\
    \n```\n```objective-c\n//---if the property list file can be found---\nif ([[NSFileManager\
    \ defaultManager] fileExistsAtPath:plistFileName])\n{\n    //---load the content\
    \ of the property list file into a NSDictionary\n    //   object---\n    NSDictionary\
    \ *dict = [[NSDictionary alloc]\n                          initWithContentsOfFile:plistFileName];\n\
    \    //...\n}\n```\n```\n\nNext, you enumerate through all the keys in the dictionary\
    \ object and print the titles of each application in the Debugger Console window:\n\
    \n```\n```objective-c\n//---for each category---\nfor (NSString *category in dict)\n\
    {\n```\n```"
  merge: -1
  img_proc: true
- pgno: 342
  md: "```\nNSLog(category);\nNSLog(@\"==========\");\n//---return all titles in an\
    \ array---\nNSArray *titles = [dict valueForKey:category];\n//---print out all\
    \ the titles in that category---\nfor (NSString *title in titles)\n{\n    NSLog(title);\n\
    }\n[dict release];\n```\n\nWhen the application is run for the first time, the\
    \ Apps.plist file is not available, so you load it from the Resources folder:\n\
    \n```\nelse {\n    //---load the property list from the Resources folder---\n\
    \    NSString *pListPath = [[NSBundle mainBundle] pathForResource:@\"Apps\"\n\
    \                                                         ofType:@\"plist\"];\n\
    \    NSDictionary *dict = [[NSDictionary alloc]\n                         initWithContentsOfFile:pListPath];\n\
    \    //...\n}\n```\n\nBecause you are making changes to the dictionary object,\
    \ you need to make a mutable copy of the dictionary object and assign it to an\
    \ NSMutableDictionary object:\n\n```\n//---make a mutable copy of the dictionary\
    \ object---\nNSMutableDictionary *copyOfDict = [dict mutableCopy];\n```\n\nThis\
    \ step is important because the NSDictionary object is immutable, meaning that\
    \ after the items are populated from the property list, you cannot add content\
    \ to the dictionary object. Using the mutableCopy method of the NSDictionary class\
    \ allows you to create a mutable instance of the dictionary object, which is an\
    \ NSMutableDictionary.\n\nYou then retrieve an array containing all the keys in\
    \ the mutable dictionary object:\n\n```\n//---get all the different categories---\n\
    NSArray *categoriesArray = [[copyOfDict allKeys]\n                           \
    \ sortedArrayUsingSelector:@selector(compare:)];\n```\n\nYou use this array to\
    \ loop through all the keys in the dictionary so that you can add some additional\
    \ titles to each category:\n\n```\n//---for each category---\nfor (NSString *category\
    \ in categoriesArray)\n{\n```"
  merge: -1
  img_proc: true
- pgno: 343
  md: "Note that you cannot enumerate using the NSMutableDictionary object like this:\n\
    \n```\nfor (NSString *category in copyOfDict)\n{\n    //...\n}\n```\n\nThis is\
    \ because you cannot add items to the NSMutableDictionary object while it is being\
    \ enumerated. Therefore, you need to loop using an NSArray object.\n\nWhen you're\
    \ inside the loop, you extract all the titles of the applications in each category\
    \ and make a mutable copy of the array containing the titles of the applications:\n\
    \n```\n//---get all the app titles in that category---\nNSArray *titles = [dict\
    \ valueForKey:category];\n\n//---make a mutable copy of the array---\nNSMutableArray\
    \ *mutableTitles = [titles mutableCopy];\n```\n\nYou can now add a new title to\
    \ the mutable array containing the application titles:\n\n```\n//---add a new\
    \ title to the category---\n[mutableTitles addObject:@\"New App title\"];\n```\n\
    \nAfter the additional item is added to the mutable array, set it back to the\
    \ mutable dictionary object:\n\n```\n//---set the array back to the dictionary\
    \ object---\n[copyOfDict setObject:mutableTitles forKey:category];\n[mutableTitles\
    \ release];\n```\n\nFinally, you write the mutable dictionary object to a file\
    \ using the writeToFile:atomically: method:\n\n```\n//---write the dictionary\
    \ to file---\nfileName = [[self documentsPath]\n            stringByAppendingPathComponent:@\"\
    Apps.plist\"];\n[copyOfDict writeToFile:fileName atomically:YES];\n\n[dict release];\n\
    [copyOfDict release];\n```\n\n# SUMMARY\n\nThis chapter demonstrated how to write\
    \ a file to the file system of the iPhone and how to read it back. In addition,\
    \ you saw how structured data can be represented using a property list and how\
    \ you can programmatically work with a property list using a dictionary object.\
    \ In the next chapter, you will see how you can make use of databases to store\
    \ more complex data."
