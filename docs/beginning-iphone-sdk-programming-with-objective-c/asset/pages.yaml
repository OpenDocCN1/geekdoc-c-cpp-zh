- pgno: 190
  md: "# 7\n\n# View Controllers\n\n+   **WHAT YOU WILL LEARN IN THIS CHAPTER**\n\
    +   \n+   - How to create a Window-based Application and manually add a View Controller\
    \ and a View window to it\n+   - How to create views dynamically during runtime\n\
    +   - How to wire up events of views with event handlers via code\n+   - How to\
    \ switch to another view during runtime\n+   - How to animate the switching of\
    \ views\n\nUntil this point, you have been dealing with single view applications;\
    \ that is, applications with a single View Controller. The previous chapters have\
    \ all been using the View-based Application template available in the iPhone SDK\
    \ because it is the simplest way to get started in iPhone programming. When you\
    \ create a View-based application, there is by default one View Controller (named\
    \ `<project_name>ViewController` by the iPhone SDK). In real-life applications,\
    \ you often need more than one View Controller, with each controlling a different\
    \ view displaying different information. A good example of a multiview application\
    \ is the Weather application shipped with the iPhone. The main view shows the\
    \ weather of a region you have selected, and you can swipe the screen to view\
    \ the weather of other locations. You can also press the **i** icon to flip to\
    \ another view and add locations.\n\nThis chapter teaches you how to create multiple\
    \ views in your application and then programmatically switch among them during\
    \ runtime. In addition, you learn how to animate the switching of views using\
    \ the built-in animation methods available in the iPhone SDK."
  merge: -1
  img_proc: true
- pgno: 191
  md: "# CREATING A WINDOW-BASED APPLICATION\n\nIn this section, you discover another\
    \ type of application template you can create using the iPhone SDK: the Window-based\
    \ Application template. Unlike the View-based Application template, the Window-based\
    \ Application template does not include a View Controller by default. Instead,\
    \ it provides only the skeleton of an iPhone application and leaves the rest to\
    \ the developer — you need to add your own views and View Controllers. Because\
    \ of this, a Window-based Application presents a very good way for you to understand\
    \ how View Controllers work and appreciate all the work needed to connect the\
    \ View Controllers and XIB files. When you understand how View Controllers work,\
    \ you will be on your way to creating multview applications.\n\nTo put first things\
    \ first, execute the following Try It Out to write a Window-based Application\
    \ and then progressively add a View Controller to it. You will need to download\
    \ the project files as indicated here for this and other Try It Out features in\
    \ this chapter.\n\n# TRY IT OUT Adding a View Controller Using Interface Builder\n\
    \nCodefile [WinBasedApp.zip] available for download on Wrox.com\n\n+   1. Using\
    \ Xcode, create a Window-based Application project and name it WinBasedApp. Observe\
    \ the files created for this project type (see Figure 7-1). Apart from the other,\
    \ usual supporting file, note that there is only one XIB file (MainWindow.xib)\
    \ and two delegate files (WinBasedAppAppDelegate.h and WinBasedAppAppDelegate.m).\n\
    +   \n+   2. Press Command-R to test the application, and you will realize that\
    \ an empty screen is displayed on the iPhone Simulator. This is because the Window-based\
    \ Application template provides only the skeleton structure for a simple iPhone\
    \ application containing just a window and the application delegate.\n+   \n+\
    \   3. Back in Xcode, double-click MainWindow.xib to edit it in Interface Builder.\
    \ Observe that there are four items in the MainWindow.xib window (see Figure 7-2):\n\
    +      - File's Owner\n+      - First Responder\n+      - Win Based App App Delegate\n\
    +      - Window"
  merge: -1
