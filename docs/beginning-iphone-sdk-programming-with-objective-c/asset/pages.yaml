  md: "5. Press Command-R to test the application on the iPhone Simulator. You will\
    \ now see the Label and Button views on the main screen of the application (see\
    \ Figure 7-13).\n\n# How It Works\n\nIn contrast to the previous example, in which\
    \ you added a View Controller item, an instance of the UIViewController class,\
    \ and a XIB file to your project, this example simply creates an instance of the\
    \ UIViewController class and adds the views programmatically to the main View\
    \ window.\n\nIn the application delegate, after the application has finished launching,\
