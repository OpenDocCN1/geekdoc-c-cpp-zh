  md: 'In real life, the Table view is often used with a Navigation-based Application
    because it is very common for users to select an item from a Table view and then
    navigate to another screen showing the details of the item selected. For this
    reason, the Navigation-based Application template in the iPhone SDK by default
    uses the TableView class instead of the View class.


    In addition, you can group items in a Table view into sections so that you can
    group related items with a header for each section. In the following Try It Out,
    you learn how to use the Table view from within a Navigation-based Application
    project. At the same time, you learn how to display items stored in a property
    list, as opposed to an array.


    # TRY IT OUT Displaying Sections in a Table View


    +   1. Create a new Navigation-based Application project and name it TableView.

    +   2. Double-click the RootViewController.xib file to edit it in Interface Builder.

    +   3. Notice that in the RootViewController.xib window you now have a TableView
    item instead of the usual View item (see Figure 10-11).

    +   4. Double-click the TableView item and observe that you have a Table view
    within it (see Figure 10-12).

    +   5. Examine RootViewController.h file and notice that the RootViewController
    class now extends the UITableViewController base class:

    +   6. Also examine the RootViewController.m file and observe that it includes
    a number of event stubs that you can use by removing the comment statements.

    +   7. Right-click the Resources folder and choose Add ⇧ New File.


    ```

    @interface RootViewController : UITableViewController {

    }


    @end

    ```


