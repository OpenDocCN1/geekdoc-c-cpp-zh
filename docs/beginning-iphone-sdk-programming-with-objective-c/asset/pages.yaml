- pgno: 22
  md: '# INTRODUCTION


    The iPhone SDK was officially announced by Apple on March 6, 2008, at an Apple
    Town Hall meeting. In the early days of the SDK, iPhone development was shrouded
    in secrecy because Apple has imposed a Non-Disclosure Agreement (NDA) on developers
    who downloaded the SDK. No one was allowed to publicly discuss the SDK and the
    various APIs shipped with it. Apple had presumably done this to ensure the stability
    of the SDK. This move caused an uproar from developers because it prevented them
    from posting questions on public forums and getting help quickly. Nor could books
    be written about it or training courses developed. The adoption of Objective-C
    as the programming language for the iPhone SDK did not help. In fact, that language
    has a steep learning curve for developers, who for the most part are coming from
    more mainstream languages such as Java, C++, C#, and VB.NET.


    With pressure from the public, Apple finally lifted the NDA in late 2008. This
    was welcome news to developers, albeit a little late. Overnight, discussion forums
    appeared and Web sites dedicated to iPhone development mushroomed.


    Although Web sites and discussion forums talking about iPhone development are
    numerous, one obstacle remains — the learning curve for getting started is simply
    too great. Many developers are struggling to get started with Xcode and Interface
    Builder. At the same time, they have to grapple with the arcane syntax of Objective-C
    and to constantly remember which objects to free up and which ones not to.


    This book was written to bridge the gap.


    When I first started learning about iPhone development, I went through the same
    journey that most iPhone developers go through: Write a Hello World application,
    mess with Interface Builder, try to understand what the code is doing, and repeat
    that process. I was also overwhelmed by the concept of a View Controller and wondered
    why it is needed if I simply want to display a view. My background in developing
    for Windows Mobile and Android did not help much, and I had to start working with
    this concept from scratch.


    This book is written to make the life of a beginning iPhone developer as easy
    as possible. It covers the various topics in such a manner that you will progressively
    learn without being overwhelmed by the details. I adopt the philosophy that the
    best way to learn is by doing, hence the numerous Try It Out sections in all the
    chapters, which first show you how to build something and then explain how things
    work.


    Although iPhone programming is a huge topic, my aim for this book is to get you
    started with the fundamentals, understand the underlying architecture of the SDK,
    and appreciate why things are done certain ways. It is beyond the scope of this
    book to cover everything under the sun related to iPhone programming, but I am
    confident that after reading this book (and doing the exercises), you will be
    well equipped to tackle your next iPhone programming challenge.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# WHO THIS BOOK IS FOR


    This book is for the beginning iPhone developer who wants to start developing
    iPhone applications using the Apple iPhone SDK. To truly benefit from this book,
    you should have some background in programming and at least be familiar with object-oriented
    programming concepts. If you are totally new to the Objective-C language, you
    might want to jump straight to Appendix D, which provides an overview of the language.
    Alternatively, you can use Appendix D as a quick reference while you tackle the
    various chapters, checking out the syntax as you try the exercises. Depending
    on your learning pattern, one of those approaches may work best for you.


    # WHAT THIS BOOK COVERS


    This book covers the fundamentals of iPhone programming using the iPhone SDK.
    It is divided into 17 chapters and five appendices.


    Chapter 1: Getting Started with iPhone Programming covers the various tools found
    in the iPhone SDK and explains their uses in iPhone development.


    Chapter 2: Write Your First Hello World! Application gets you started with Xcode
    and Interface Builder to build a Hello World application. The focus is on getting
    your hands dirty, and more details on the various parts and components are covered
    in subsequent chapters.


    Chapter 3: Outlets, Actions, and View Controllers covers the fundamental concepts
    of iPhone programming; outlets and actions. You learn how outlets and actions
    allow your code to interact with the visual elements in Interface Builder and
    why they are an integral part of every iPhone application.


    Chapter 4: Exploring the Views describes the use of the various views that make
    up the user interface (UI) of your iPhone applications. You learn the techniques
    to manipulate the UI of your application, as well as how views are stored internally.


    Chapter 5: Keyboard Inputs shows you how to deal with the virtual keyboard in
    your iPhone. You see how to hide the keyboard on demand and how to ensure that
    your views are not blocked by the keyboard when it is displayed.


    Chapter 6: Screen Rotations demonstrates how you can reorient your application''s
    UI when the device is rotated. You learn about the various events that are fired
    when the device is rotated. You also learn how to force your application to display
    in a certain orientation.


    Chapter 7: View Controllers shows how you can create an application with multiple
    views. You learn how to build an iPhone application using the Window-based Application
    template.


    Chapter 8: Tab Bar and Navigation Applications shows you how to build Tab Bar
    applications and Navigation applications using the templates provided by the SDK.
    Using these two application templates, you can create sophisticated multiview
    applications.


    Chapter 9: Utility Applications shows you how to build yet another type of application
    in the iPhone — utility applications.'
  merge: -1
  img_proc: true
