- pgno: 319
  md: "```\n-(void) openDB {\n    //---create database---\n    if (sqlite3_open([[self\
    \ filePath] UTF8String], &db) != SQLITE_OK ) {\n        sqlite3_close(db);\n \
    \       NSAssert(0, @\"Database failed to open.\");\n    }\n}\n\n-(void)viewDidLoad\
    \ {\n    [self openDB];\n    [super viewDidLoad];\n}\n\n@end\n```\n\n# How It\
    \ Works\n\nThe sqlite3_open() C function opens an SQLite database whose filename\
    \ is specified as the first argument:\n\n[self filePath] UTF8String]\n\nIn this\
    \ case, the filename of the database is specified as a C string using the UTF8String\
    \ method of the NSString class because the sqlite3_open() C function does not\
    \ understand an NSString object.\n\nThe second argument contains a handle to the\
    \ sqlite3 object, which in this case is db.\n\nIf the database is available, it\
    \ opens the database. If the specified database is not found, a new database is\
    \ created. If the database is successfully opened, the function will return a\
    \ value of 0 (represented using the SQLITE_OK constant).\n\nThe following list\
    \ from http://www.sqlite.org/c3ref/c_abort.html shows the result codes returned\
    \ by the various SQLite functions:\n\n```\n#define SQLITE_OK 0 /* Successful result\
    \ */\n#define SQLITE_ERROR 1 /* SQL error or missing database */\n#define SQLITE_INTERNAL\
    \ 2 /* Internal logic error in SQLite */\n#define SQLITE_PERM 3 /* Access permission\
    \ denied */\n#define SQLITE_ABORT 4 /* Callback routine requested an abort */\n\
    #define SQLITE_BUSY 5 /* The database file is locked */\n#define SQLITE_LOCKED\
    \ 6 /* A table in the database is locked */\n#define SQLITE_NOMEM 7 /* A malloc()\
    \ failed */\n#define SQLITE_READONLY 8 /* Attempt to write a readonly database\
    \ */\n#define SQLITE_INTERRUPT 9 /* Operation terminated by sqlite3_interrupt()\
    \ */\n#define SQLITE_IOERR 10 /* Some kind of disk I/O error occurred */\n#define\
    \ SQLITE_CORRUPT 11 /* The database disk image is malformed */\n#define SQLITE_NOTFOUND\
    \ 12 /* NOT USED. Table or record not found */\n#define SQLITE_FULL 13 /* Insertion\
    \ failed because database is full */\n#define SQLITE_CANTOPEN 14 /* Unable to\
    \ open the database file */\n#define SQLITE_PROTOCOL 15 /* NOT USED. Database\
    \ lock protocol error */\n#define SQLITE_EMPTY 16 /* Database is empty */\n#define\
    \ SQLITE_SCHEMA 17 /* The database schema changed */\n#define SQLITE_TOOBIG 18\
    \ /* String or BLOB exceeds size limit */\n#define SQLITE_CONSTRAINT 19 /* Abort\
    \ due to constraint violation */\n#define SQLITE_MISMATCH 20 /* Data type mismatch\
    \ */\n```"
