  md: "# Using the Documents and Library Folders\n\nThe Documents folder is where\
    \ you can store files used by your application, whereas the Library folder stores\
    \ the application-specific settings. The tmp folder stores temporary data required\
    \ by your application.\n\nSo how you do write to these folders? See the following\
    \ Try It Out for an example of doing just that. You need to download the indicated\
    \ code files to work through the project.\n\n# TRY IT OUT  Writing and Reading\
    \ from Files\n\n[FilesHandling.zip] available for download at Wrox.com\n\n+  \
    \ 1. Using Xcode, create a new View-based Application project and name it FilesHandling.\n\
    +   2. In the FilesHandlingViewController.h file, add in the following statements\
    \ that appear in bold:\n+   3. In the FilesHandlingViewController.m file, add\
    \ in the following statements that appear in bold:\n\n```\n#import <UIKit/UIKit.h>\n\
    \n@interface FilesHandlingViewController : UIViewController {\n}\n\n-(NSString\
    \ *) documentsPath;\n-(NSString *) readFromFile:(NSString *) filePath;\n-(void)\
    \ writeToFile:(NSString *) text withFileName:(NSString *) filePath;\n\n@end\n\
    ```\n\n```\n#import \"FilesHandlingViewController.h\"\n\n@implementation FilesHandlingViewController\n\
    \n//---finds the path to the application's Documents directory---\n-(NSString\
    \ *) documentsPath {\n    NSArray *paths = NSSearchPathForDirectoriesInDomains(\n\
    \        NSDocumentDirectory, NSUserDomainMask, YES);\n    NSString *documentsDir\
    \ = [paths objectAtIndex:0];\n    return documentsDir;\n}\n```"
  merge: -1
  img_proc: true
