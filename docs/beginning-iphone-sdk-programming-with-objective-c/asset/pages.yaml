- pgno: 87
  md: '# WHERE DO YOU DECLARE YOUR OUTLETS AND ACTIONS?


    In Apple''s demos and many other getting started tutorials, the actions and outlets
    are often declared directly in the .h file and then linked to the views in Interface
    Builder because it''s probably the fastest and most common way for programmers
    to integrate their code with their UI. The process of adding the actions and outlets
    in Interface Builder and then declaring them in the .h file is a bit more tedious.


    However, adding your actions and outlets directly in Interface Builder does have
    its advantages. It allows the UI to be designed by a non-programmer. The designer
    can focus on the UI design, and create the actions and outlets and connect them
    to the views without worrying about the code. After the design is completed, the
    programmers can then take over and define the actions and outlets declared in
    Interface Builder.


    # Linking View Controller to Outlets and Actions


    After actions and outlets are defined in the View Controller, you must have a
    way to connect them to the views in the View window. To link the events of the
    views in the View window to the actions defined in the View Controller, you need
    to Control-click and drag the view to the File''s Owner item.


    For this example, Control-click and drag the Click Me button and drop it on the
    File''s Owner item. As you drag, notice that an elastic band appears. As your
    mouse hovers over the File''s Owner item, it is highlighted (see Figure 3-20).
    When you release the mouse button, a pop-up appears. The btnClicked: action is
    now shown under the Events section.


    ![](img/aab2d775c46f70cd606f2e58e2521324_87_0.png)


    FIGURE 3-20'
