- pgno: 169
  md: "# HANDLING THE RETURN KEY OF THE KEYBOARD\n\nEarlier, you saw how you can connect\
    \ an `IBAction` with the `Did End On Exit` event of a `TextField` view to hide\
    \ the keyboard when the user presses the Return key. Alternatively, you can also\
    \ implement the `textFieldShouldReturn:` method. This method is invoked whenever\
    \ the user presses the Return key on the keyboard:\n\n```\n```objective-c\n- (BOOL)\
    \ textFieldShouldReturn: (UITextField *) textFieldView {\n    if (textFieldView\
    \ == textField) {\n        [textFieldView resignFirstResponder];\n    }\n    return\
    \ NO;\n}\n```\n```\n\n# SUMMARY\n\nIn this chapter, you learned the various techniques\
    \ to deal with the keyboard in your iPhone application. In particular, you have\
    \ seen:\n\n+   - How to make the keyboard go away when you are done with the data\
    \ entry\n+   - How to detect the presence or absence of the keyboard\n+   - How\
    \ to ensure that views are not blocked by the keyboard\n\n# EXERCISES\n\n+   1.\
    \ How do you hide the keyboard for a UITextField object?\n+   2. How do you detect\
    \ whether the keyboard is visible or not?\n+   3. How do you get the size of the\
    \ keyboard?"
