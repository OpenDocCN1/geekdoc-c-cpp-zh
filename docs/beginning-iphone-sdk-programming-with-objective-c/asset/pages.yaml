- pgno: 361
  md: "```\nCGPoint touch1PT = [touch1 locationInView:(self view)];\nCGPoint touch2PT\
    \ = [touch2 locationInView:(self view)];\n\nNSLog(@\"Touch1: %.0f, %.0f\", touch1PT.x,\
    \ touch1PT.y);\nNSLog(@\"Touch2: %.0f, %.0f\", touch2PT.x, touch2PT.y);\n\nCGFloat\
    \ currentDistance = [self distanceBetweenTwoPoints: touch1PT\n               \
    \                                    toPoint: touch2PT];\n\n//---zoom in---\n\
    if (currentDistance > originalDistance)\n{\n    imageView.frame = CGRectMake(imageView.frame.origin.x\
    \ - 2,\n                                 imageView.frame.origin.y - 2,\n     \
    \                            imageView.frame.size.width + 4,\n               \
    \                  imageView.frame.size.height + 4);\n}\nelse {\n    //---zoom\
    \ out---\n    imageView.frame = CGRectMake(imageView.frame.origin.x + 2,\n   \
    \                              imageView.frame.origin.y + 2,\n               \
    \                  imageView.frame.size.width - 4,\n                         \
    \        imageView.frame.size.height - 4);\n}\noriginalDistance = currentDistance;\n\
    break;\n}\n}\n}\n```\n\n+   3. Press Command-R to test the application on the\
    \ iPhone Simulator.\n+   4. Single-tap the image view to enlarge. To zoom the\
    \ image in and out, Option-click the image (see Figure 14-7).\n\n# How It Works\n\
    \nTo detect for the pinch gesture, you need to find out the distance between the\
    \ two fingers and constantly compare their distances so that you know whether\
    \ the two fingers are moving toward or away from each other.\n\nTo find the distance\
    \ between two fingers, you define the distanceBetweenTwoPoints:toPoint: method:\n\
    \n```\n- (CGFloat) distanceBetweenTwoPoints:(CGPoint)fromPoint\ntoPoint:(CGPoint)toPoint\
    \ {\n\n    float lengthX = fromPoint.x - toPoint.x;\n    float lengthY = fromPoint.y\
    \ - toPoint.y;\n    return sqrt((lengthX * lengthX) + (lengthY * lengthY));\n\
    }\n```\n\n![](img/aab2d775c46f70cd606f2e58e2521324_361_0.png)\n\nThis method takes\
    \ in two CGPoint structures and then calculates the distance between them. No\
    \ rocket science here—just the Pythagorean theorem in action."
  merge: -1
  img_proc: true
