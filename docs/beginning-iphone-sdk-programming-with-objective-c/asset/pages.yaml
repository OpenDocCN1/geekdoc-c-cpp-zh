- pgno: 494
  md: "To set the value of these properties, you need to call the methods prefixed\
    \ with the set keyword:\n\n```\nSomeClass *sc = [[SomeClass alloc] init];\n[sc\
    \ setRate:5.0f];\n[sc setName:@\"Wei-Meng Lee\"];\n```\n\nAlternatively, you can\
    \ use the dot notation introduced in Objective-C 2.0:\n\n```\nSomeClass *sc =\
    \ [[SomeClass alloc] init];\nsc.rate = 5;\nsc.name = @\"Wei-Meng Lee\";\n```\n\
    \nTo obtain the values of properties, you can either call the methods directly\
    \ or use the dot notation in Objective-C 2.0:\n\n```\nNSLog([sc name]); //--call\
    \ the method--\nNSLog(sc.name); //---dot notation\n```\n\nTo make a property read\
    \ only, simply remove the method prefixed with the set keyword.\n\nNotice that\
    \ within the setName: method, you have various statements using the retain and\
    \ release keywords. These keywords relate to memory management in Objective-C;\
    \ you learn more about them in the “Memory Management” section, later in this\
    \ appendix.\n\nIn Objective-C 2.0, you don’t need to define getters and setters\
    \ in order to expose fields as properties. You can do so via the @property and\
    \ @synthesize compiler directives. Using the same example, you can use the @property\
    \ to expose the rate and name fields as properties, like this:\n\n```\n#import\
    \ <Foundation/Foundation.h>\n@class AnotherClass;\n\n@interface SomeClass : NSObject\
    \ {\n    AnotherClass *anotherClass;\n    float rate;\n    NSString *name;\n}\n\
    \n@property float rate;\n@property (retain, nonatomic) NSString *name;\n\n@end\n\
    ```\n\nThe first @property statement defines rate to be a property. The second\
    \ statement defines name as a property as well, but it also specifies the behavior\
    \ of this property. In this case, it indicates the behavior as retain and nonatomic,\
    \ which you learn more about in the section on memory management later in this\
    \ appendix. In particular, nonatomic means that the property is not accessed in\
    \ a thread-safe manner. This is alright if you are not writing multi-threaded\
    \ applications. Most of the time, you will use the retain and nonatomic combination\
    \ when declaring properties."
  merge: -1
  img_proc: true
- pgno: 495
  md: 'In the implementation file, rather than define the getter and setter methods,
    you can simply use the @synthesize keyword to get the compiler to automatically
    generate the getters and setters for you:


    ```

    #import "SomeClass.h"


    @implementation SomeClass

    @synthesize rate, name;


    @end

    ```


    As shown, you can combine several properties using a single @synthesize keyword.
    However, you can also separate them into individual statements:


    ```

    @synthesize rate;

    @synthesize name;

    ```


    You can now use your properties as usual:


    ```

    //---setting using setRate---

    [sc setRate:5.0f];

    [sc setName:@"Wei-Meng Lee"];


    //---setting using dot notation---

    sc.rate = 5;

    sc.name = @"Wei-Meng Lee";


    //---getting---

    NSLog([sc name]); //---using the name method

    NSLog(sc.name); //---dot notation

    ```


    To make a property read only, use the readonly keyword. The following statement
    makes the name property read only:


    ```

    @property (readonly) NSString *name;

    ```


    # Initializers


    When you create an instance of a class, you often initialize it at the same time.
    For example, in the earlier example (in the Class Instantiation section), you
    had this statement:


    ```

    SomeClass *sc = [[SomeClass alloc] init];

    ```


    The alloc keyword allocates memory for the object, and when an object is returned,
    the init method is called on the object to initialize the object. Recall that
    in SomeClass, you do not define a method named init. So where does the init method
    come from? It is actually defined in the NSObject class, which is the base class
    of most classes in Objective-C. The init method is known as an initializer.


    If you want to create additional initializers, you can define methods that begin
    with the init word. (The use of the init word is more of a norm than a hard-and-fast
    rule.)'
  merge: -1
  img_proc: true
