- pgno: 157
  md: "12. In the KeyboardInputsViewController.m file, add the following statements\
    \ highlighted in bold:\n\n```\n#import \"KeyboardInputsViewController.h\"\n\n\
    @implementation KeyboardInputsViewController\n\n@synthesize textField;\n\n-(IBAction)\
    \ bgTouched:(id) sender{\n    [textField resignFirstResponder];\n}\n-(IBAction)\
    \ doneEditing:(id) sender{\n    [sender resignFirstResponder];\n}\n```\n\n13.\
    \ That's it. Press Command-R in Xcode to deploy the application onto the iPhone\
    \ Simulator. Then, try the following:\n\n+   - Click the TextField view to bring\
    \ up the keyboard.\n+   - When you are done, you can click the Return key on the\
    \ keyboard to dismiss it. Alternatively, you can click any of the empty spaces\
    \ outside the TextField view to dismiss the keyboard.\n\n# How It Works\n\nIn\
    \ this example, you added a Round Rect Button view to cover up all the empty spaces\
    \ in the View window of your application. Essentially, the button acts as a net\
    \ to trap all touches outside of the TextField view on the View window. So when\
    \ the user clicks (or taps, on a real device) the screen outside the keyboard\
    \ and the TextField view, the Round Rect Button fires the Touch Up Inside event,\
    \ which is handled by the bgTouched: action. In the bgTouched: action, you explicitly\
    \ asked textField to resign its First-Responder status, which causes the keyboard\
    \ to disappear.\n\nThe technique used in this example applies even if you have\
    \ multiple TextField views on your view. Suppose you have three TextField views,\
    \ named textField, textField2, and textField3. In this case, the bgTouched: action\
    \ looks like this:\n\n```\n-(IBAction) bgTouched:(id) sender{\n    [textField\
    \ resignFirstResponder];\n    [textField2 resignFirstResponder];\n    [textField3\
    \ resignFirstResponder];\n}\n```\n\nSo when the bgTouched: action is invoked,\
    \ all three TextField views are asked to relinquish their First-Responder status.\
    \ Calling the resignFirstResponder method on a view that is currently not the\
    \ First Responder is harmless; hence, the preceding statements are safe and will\
    \ not cause an exception during runtime."
