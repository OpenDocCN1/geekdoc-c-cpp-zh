- pgno: 267
  md: "# TRY IT OUT Making a Selection in a Table View\n\n1. Using the same project\
    \ created earlier, add the following statements that appear in bold to the TableViewExampleViewController.m\
    \ file:\n\n```\n#import \"TableViewExampleViewController.h\"\n@implementation\
    \ TableViewExampleViewController\nNSMutableArray *listOfMovies;\n- (void)tableView:(UITableView\
    \ *)tableView didSelectRowAtIndexPath:(NSIndexPath *)indexPath {\n    NSString\
    \ *movieSelected = [listOfMovies objectAtIndex:[indexPath row]];\n    NSString\
    \ *msg = [[NSString alloc] initWithFormat:@\"You have selected %@\", movieSelected];\n\
    \    UIAlertView *alert = [[UIAlertView alloc] initWithTitle:@\"Movie selected\"\
    \ message:msg delegate:self cancelButtonTitle:@\"OK\" otherButtonTitles:nil];\n\
    \    [alert show];\n    [alert release];\n    [movieSelected release];\n    [msg\
    \ release];\n}\n```\n\n2. Press Command-R to test the application on the iPhone\
    \ Simulator.\n\n3. Select a row by tapping it. When a row is selected, you see\
    \ an alert view displaying the row you have selected (see Figure 10-9).\n\n# How\
    \ It Works\n\nOne of the events in the UITableViewDelegate protocol is tableView:didSelectRowAtIndexPath:,\
    \ which is fired when the user selects a row in the Table view. One of the parameters\
    \ contained in tableView:didSelectRowAtIndexPath: event is of the type NSIndexPath.\
    \ The NSIndexPath class represents the path of a specific item in a nested array\
    \ collection.\n\nFor this event, to know which row has been selected, you simply\
    \ call the row property of the NSIndexPath object (indexPath) and then use the\
    \ row number to reference against the listOfMovies array:\n\n```\nNSString *movieSelected\
    \ = [listOfMovies objectAtIndex:[indexPath row]];\n```\n\n![](img/aab2d775c46f70cd606f2e58e2521324_267_0.png)"
