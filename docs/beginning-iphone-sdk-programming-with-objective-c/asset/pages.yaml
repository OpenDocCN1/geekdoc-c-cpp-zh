- pgno: 479
  md: 'Take note that for code generated by Interface Builder, the outlets will not
    be exposed as properties. You must manually add the code to expose the properties
    using the @property keyword and the @synthesize keyword to generate the getters
    and setters for the properties.


    > NOTE In general, it is always easier to define the outlets and actions manually
    rather than have Interface Builder do it for you.


    # Connecting Outlets and Actions


    To connect the outlets and actions to the views, you have two options, both which
    are discussed in the following sections.


    # Method 1


    For connecting outlets, Control-click and drag the File''s Owner item to the view
    to which you want to connect (see Figure C-15).


    ![](img/aab2d775c46f70cd606f2e58e2521324_479_0.png)


    FIGURE C-15


    When you release the mouse button, a list appears from which you can select the
    correct outlet. When defining your outlets (in the Identity Inspector window,
    or in code), remember that you can specify the type of view your outlet is referring
    to. When you release the mouse button, Interface Builder lists only the outlets
    that match the type of view you have selected. For example, if you defined myOutlet1
    as UIButton and you Control-click and drag the File''s Owner item to the Text
    Field view on the View window, the myOutlet1 will not appear in the list of outlets.


    For connecting actions, Control-click and drag the view to the File''s Owner item
    in the .xib window (see Figure C-16).'
  merge: -1
  img_proc: true
