    FIGURE B-4


    # Customizing the Toolbar


    The Xcode window contains the toolbar section, in which you can place your favorite
    items for quick access. By default, the following items are placed in the toolbar:


    +   - Overview: allows you to select target settings such as the active SDK (iPhone
    OS version and device versus Simulator) as well as active configurations (Debug
    or Release).

    +   - Action: specifies the action you can perform with a selected item.

    +   - Build and Go: lets you build and deploy the application.

    +   - Tasks: stops any operation in progress.

    +   - Info: views the detailed information of a selected item.

    +   - Search: filters the items currently displayed in the Detail View section.


    You can add items to the toolbar by right-clicking the toolbar and selecting Customize
    Toolbar. You then see a drop-down pane showing all the items that you can add
    to the toolbar (see Figure B-5). To add an item to the toolbar, drag the item
    directly onto the toolbar.'
