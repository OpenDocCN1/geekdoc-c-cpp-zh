- pgno: 74
  md: 'As you can see, many files are created for you by default when you create a
    new project. The iPhone SDK tries to make your life simple by creating some of
    the items that you will use most often when you develop an iPhone application.
    Table 3-1 describes the use of the various files created in the project.


    # TABLE 3-1: The Various Files Created in the Project


    | FILE | DESCRIPTION |

    |---|---|

    | `BasicUI.app` | The application bundle (executable), which contains the executable
    as well as the data that is bundled with the application. |

    | `BasicUI_Prefix.pch` | Contains the prefix header for all files in the project.
    The prefix header is included by default in the other files in the project. |

    | `BasicUIAppDelegate.h` | Headers file for the application delegate. |

    | `BasicUIAppDelegate.m` | Implementations files for the application delegate.
    |

    | `BasicUIViewController.h` | Headers file for a View Controller. |

    | `BasicUIViewController.m` | Implementations files for a View Controller. |

    | `BasicUIViewController.xib` | The XIB file containing the UI of a view. |

    | `CoreGraphics.framework` | C-based APIs for low-level 2D rendering. |

    | `Foundation.framework` | APIs for foundational system services such as data
    types, XML, URL, and so on. |

    | `Info.plist` | A dictionary file that contains information about your project,
    such as icon, application name, and others; information is stored in key/value
    pairs. |

    | `main.m` | The main file that bootstraps your iPhone application. |

    | `MainWindow.xib` | The XIB file for the main window of the application. |

    | `UIKit.framework` | Provides fundamental objects for constructing and managing
    your application’s UI. |


    > **NOTE** The numbers and types of files created are dependent on the type of
    project you have selected. The View-based Application template is a good starting
    point to understanding the various files involved.


    ![](img/aab2d775c46f70cd606f2e58e2521324_74_0.png)'
  merge: -1
  img_proc: true
- pgno: 75
  md: "The main.m file contains code that bootstraps your application. It contains\
    \ the following code, and you rarely need to modify it:\n\n```\n#import <UIKit/UIKit.h>\n\
    \nint main(int argc, char *argv[]) {\n    NSAutoreleasePool * pool = [[NSAutoreleasePool\
    \ alloc] init];\n    int retVal = UIApplicationMain(argc, argv, nil, nil);\n \
    \   [pool release];\n    return retVal;\n}\n```\n\nMost of the hard work is done\
    \ by the UIApplicationMain() function, which examines the Info.plist file to obtain\
    \ more information about the project. In particular, it looks at the main nib\
    \ file you will use for your project. Figure 3-3 shows the content of the Info.plist\
    \ file. Notice that the Main nib file base name key is pointing to MainWindow,\
    \ which is the name of the NIB file to load when the application is started.\n\
    \n# WHAT DO XIB AND NIB STAND FOR?\n\nIn your journey of iPhone application development,\
    \ you will always come across files with the .xib extension (sometimes also known\
    \ as NIB files). So, what do the NIB and .xib stand for, exactly? To understand\
    \ this, a little history lesson is in order. Turns out that the current Mac OS\
    \ X was built upon an operating system called NeXTSTEP, from a company known as\
    \ NeXT (founded by Apple's cofounder, Steve Jobs, in 1985). The N in NIB stands\
    \ for NeXTSTEP. As for xib, the x in presumably stands for XML, because its content\
    \ is saved as an XML file. The IB stands for Interface Builder, the application\
    \ that allows you to visually construct the UI for your application.\n\n![](img/aab2d775c46f70cd606f2e58e2521324_75_0.png)\n\
    \nFIGURE 3-3\n\n# Editing XIB Files\n\nDouble-click the MainWindow.xib file to\
    \ edit it using Interface Builder. As mentioned, the XIB file represents the UI\
    \ of your application, and it is used almost exclusively by Interface Builder."
  merge: -1
  img_proc: true
- pgno: 76
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 77
  md: "The BasicUIAppDelegate.h file contains the declaration of the members of the\
    \ BasicUIAppDelegate class:\n\n```\n#import <UIKit/UIKit.h>\n\n@class BasicUIViewController;\n\
    \n@interface BasicUIAppDelegate : NSObject <UIApplicationDelegate> {\n    UIWindow\
    \ *window;\n    BasicUIViewController *viewController;\n}\n\n@property (nonatomic,\
    \ retain) IBOutlet UIWindow *window;\n@property (nonatomic, retain) IBOutlet BasicUIViewController\
    \ *viewController;\n\n@end\n```\n\nOf particular interest is this line:\n\n```\n\
    @interface BasicUIAppDelegate : NSObject <UIApplicationDelegate> {\n```\n\nThe\
    \ <UIApplicationDelegate> statement specifies that the class implement the UIApplicationDelegate\
    \ protocol. Put simply, it means that you can now handle events (or messages)\
    \ defined in the UIApplicationDelegate protocol. Examples of events in the UIApplicationDelegate\
    \ protocol are the following:\n\n+   - applicationDidFinishLaunching: (You saw\
    \ this implemented in the BasicUIAppDelegate.m file.)\n+   - applicationWillTerminate:\n\
    +   - applicationDidReceiveMemoryWarning:\n\n> NOTE Protocols are discussed in\
    \ more detail in Appendix D.\n\n# View Controllers\n\nIn iPhone programming, you\
    \ typically use a View Controller to manage a view as well as perform navigation\
    \ and memory management. In the project template for a View-based Application,\
    \ Xcode automatically uses a View Controller to help you manage your view. Think\
    \ of a view as a screen (or window) you see on your iPhone.\n\n> NOTE This section\
    \ is an introduction to the basics of View Controllers; Chapter 7 covers more\
    \ advanced View Controller topics and includes multi-view application instructions."
  merge: -1
  img_proc: true
