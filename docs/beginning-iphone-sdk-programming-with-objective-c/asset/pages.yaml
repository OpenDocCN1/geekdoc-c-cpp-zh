    # INTERCEPTING SMS MESSAGES


    One of the most requested features of the iPhone SDK is the ability to intercept
    incoming SMS messages from within an iPhone application. Unfortunately, the current
    version of the SDK does not provide a means to do this.


    Likewise, you cannot send SMS messages directly from within your application;
    the messages must be sent from the built-in SMS application itself. This requirement
    prevents rogue applications from sending SMS messages without the user’s knowledge.


    # ACCESSING THE CAMERA AND THE PHOTO LIBRARY


    The iPhone and iPod Touch both have cameras that allow you to take pictures as
    well as record videos. All the pictures taken and videos recorded are saved in
    the Photos application. As a developer, you have a number of options to manipulate
    the cameras as well as access the pictures and videos stored in the Photos application:


    +   - You can invoke the Camera to take pictures or record a video.

    +   - You can invoke the Photos application to allow users to select a picture
    or video from the photo albums. You can then use the picture or video selected
    in your application.


    # Accessing the Photo Library


    Every iPhone and iPod Touch device includes the Photos application, in which all
    the pictures taken and videos recorded are stored. Using the iPhone SDK, you can
    use the UIImagePickerController class to programmatically display a UI to let
    the user select your pictures and videos from the Photos application. The following
    Try It Out demonstrates how you can do that in your application.'
