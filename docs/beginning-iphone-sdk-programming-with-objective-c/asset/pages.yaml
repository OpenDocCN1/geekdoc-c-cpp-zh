    \ invoke the done: method:\n\n```\n//---invokes the method defined in the protocol---\n\
    - (IBAction)done {\n    [self.delegate addCountryViewControllerDidFinish:self];\n\
    }\n```\n\nIn the FlipsideViewController.m file, you need to implement the protocol\
    \ defined in the additional view, which is AddCountryViewControllerDelegate:\n\
    \n```\n//---implements the AddCountryViewControllerDelegate protocol---\n@interface\
    \ FlipsideViewController : UIViewController\n    <AddCountryViewControllerDelegate>\
    \ {\n```\n\nSpecifically, you need to implement the addCountryViewControllerDidFinish:\
    \ method, which dismisses the view controller:\n\n```\n//---defines the addCountryViewControllerDidFinish:\
    \ method---\n- (void)addCountryViewControllerDidFinish:\n(AddCountryViewController\
    \ *)controller {\n    [self dismissModalViewControllerAnimated:YES];\n}\n```\n\
    \nFinally, you define the add: method, which shows the additional view using the\
    \ vertical transition:\n\n```\n//---defines the add: action---\n- (IBAction)add\
    \ {\n    AddCountryViewController *controller = [[AddCountryViewController alloc]\n\
    \        initWithNibName:@\"AddCountryView\" bundle:nil];\n    controller.delegate\
