- pgno: 67
  md: '# CUSTOMIZING YOUR APPLICATION ICON


    As you have observed earlier in Figure 2-13, the application installed on your
    iPhone Simulator uses a default white image as your application icon. It is possible,
    however, to customize this icon. When designing icons for your iPhone applications,
    bear the following in mind:


    +   - Design your icon to be 57 x 57 pixels. Larger size is all right because
    iPhone automatically sizes it for you. In fact, you should design your icons in
    a larger size in the event Apple releases new devices that are larger than the
    current size/form factor.

    +   - For distribution through the App Store, you need to prepare a 512 x 512
    pixel image.

    +   - Use square corners for your icon image, because iPhone will automatically
    round them and add a glossy surface (you can turn off this feature, though).


    In the following Try It Out, you will learn how to add an icon to your application
    so that the iPhone Simulator will use it instead of the default white image.


    # TRY IT OUT  Adding an Icon to the Application


    +   1. To make your application more interesting, you should specify your own
    icon. Before you do so, note that icons for the iPhone come in two sizes: 57 x
    57 pixels (for the main screen) and 29 x 29 pixels (as shown in the Settings application).
    Figure 2-24 shows the two possible sizes for the icon.


    ![](img/aab2d775c46f70cd606f2e58e2521324_67_0.png)


    FIGURE 2-24'
  merge: -1
  img_proc: true
