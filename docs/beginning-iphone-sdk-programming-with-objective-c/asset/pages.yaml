  md: "![](img/aab2d775c46f70cd606f2e58e2521324_225_0.png)\n\n# FIGURE 8-15\n\n# Displaying\
    \ Tab Bar Applications in Landscape Mode\n\nIn Chapter 6, you learn that screen\
    \ rotations in iPhone applications can be easily supported by overriding the shouldAutorotateToInterfaceOrientation:\
    \ method. To support all screen orientations, you simply need to return a YES\
    \ for this method, like this:\n\n```\n- (BOOL)shouldAutorotateToInterfaceOrientation:(UIInterfaceOrientation)\n\
    interfaceOrientation {\n    return YES;\n}\n```\n\nDoing so causes the view to\
    \ automatically rotate to support the new orientation. For Tab Bar applications,\
    \ things are a little special. To see how different it is, go ahead and make the\
    \ following modifications to the FirstViewController.m file:\n\n```\n//---FirstViewController.m---\n\
    // (BOOL)shouldAutorotateToInterfaceOrientation:(UIInterfaceOrientation)\n// interfaceOrientation\
    \ {\n//     return YES;\n// }\n```"
