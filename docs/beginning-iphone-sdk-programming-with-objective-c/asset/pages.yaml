  md: '# SUMMARY


    In this chapter, you have seen how you can make use of the Application Preferences
    feature of the iPhone to save your application''s preferences to the Settings
    application. Doing so allows you to delegate most of the mundane tasks of saving
    and loading an application''s preferences settings to the OS. All you need to
    do is to use the NSUserDefaults class to programmatically access the preferences
    settings.


