  md: "# How It Works\n\nTo use the Map Kit in your application, you first need to\
    \ add the MapKit.framework to your project.\n\nWhen the view has loaded, you create\
    \ an instance of the MKMapView class and set the map type (hybrid — map and satellite)\
    \ to display:\n\n```\n```objc\n- (void) viewDidLoad {\n    lm = [[CLLocationManager\
    \ alloc] init];\n    lm.delegate = self;\n    lm.desiredAccuracy = kCLLocationAccuracyBest;\n\
    \    lm.distanceFilter = 1000.0f;\n    [lm startUpdatingLocation];\n\n    mapView\
    \ = [[MKMapView alloc] initWithFrame:self.view.bounds];\n    mapView.mapType =\
    \ MKMapTypeHybrid;\n}\n```\n```\n\nWhen the View Map button is tapped, you add\
    \ the mapView object to the current view:\n\n```\n```objc\n- (IBAction) btnViewMap:\
    \ (id) sender {\n    [self.view addSubview:mapView];\n}\n```\n```\n\nWhen the\
    \ location information is updated, you zoom into the location using the setRegion:\
    \ method of the mapView object:\n\n```\n```objc\n- (void) locationManager: (CLLocationManager\
    \ *) manager\n    didUpdateToLocation: (CLLocation *) newLocation\n    fromLocation:\
    \ (CLLocation *) oldLocation{\n    //...\n    /////\n\n    MKCoordinateSpan span;\n\
    \    span.latitudeDelta=.005;\n    span.longitudeDelta=.005;\n\n    MKCoordinateRegion\
    \ region;\n    region.center = newLocation.coordinate;\n    region.span=span;\n\
    \n    [mapView setRegion:region animated:TRUE];\n}\n```\n```\n\n> NOTE For more\
    \ information on the MKMapView class, refer to Apple's documentation at http://developer.apple.com/iphone/library/navigation/Frameworks/CocoaTouch/MapKit/index.html."
