  md: "# Grouping Views Using the Segmented Control\n\nA segmented control is a horizontal\
    \ view that contains a series of buttons. Using a segmented control, users can\
    \ tap any one of the buttons contained within it. Doing so deselects the button\
    \ that was previously selected.\n\nThe following Try It Out shows how to use the\
    \ segmented control to group several views together. It also shows how you can\
    \ use this control to select a particular group of views.\n\n# TRY IT OUT   Using\
    \ a Segmented Control\n\n*Codefile (UsingViews2.zip) available for download at\
    \ Wrox.com*\n\n+   1. Using Xcode, create a new View-based Application project\
    \ and name it UsingViews2.\n+   \n+   2. Double-click the UsingViews2ViewController.xib\
    \ file to edit it using Interface Builder.\n+   \n+   3. Add the following views\
    \ to the View window (see Figure 4-12):\n+      - Segmented Control\n+      -\
    \ View\n+      - Label (make sure it is embedded within View)\n+   \n+   4. Add\
    \ another View (from the Library) onto the View window and then add a Label view\
    \ to it (see Figure 4-13). Be careful when you position the second view — make\
    \ sure that the second view is not contained within the first view. This is because\
    \ when you use the mouse and drag the second View over the first, Interface Builder\
    \ will think that you are trying to make the second View a child of the first\
    \ View. To prevent this from happening, use the cursor to move the\n\n![](img/aab2d775c46f70cd606f2e58e2521324_121_0.png)\n\
    \nFIGURE 4-12"
