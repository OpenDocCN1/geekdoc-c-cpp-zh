- pgno: 93
  md: "Enter your name and click the Click Me button. Figure 3-26 shows the alert\
    \ view displaying the name you have entered.\n\n# A More Complex Example\n\nNow\
    \ that you have seen the detailed walkthrough of how to define outlets and actions\
    \ and then link them with the View Controller, it is time for a more complex example.\
    \ Using the same project you created, modify the program so that the user needs\
    \ to enter a secret PIN before an alert view can be displayed. Figure 3-27 shows\
    \ the additional views needed to add to the View window.\n\nAs shown in Figure\
    \ 3-27, the additional views are\n\n+   - Label\n+   - Round Rect Button\n\n#\
    \ Defining the Outlets and Actions\n\nIn the BasicUIViewController.h file, add\
    \ the following object and actions:\n\n```\n#import <UIKit/UIKit.h>\n\n@interface\
    \ BasicUIViewController : UIViewController {\n    IBOutlet UITextField *nameTextField;\n\
    \    NSMutableString *secretPin;\n}\n\n@property (nonatomic, retain) UITextField\
    \ *nameTextField;\n\n- (IBAction)btnClicked:(id)sender;\n- (IBAction)clearPinBtnClicked:(id)sender;\n\
    - (IBAction)pinBtnClicked:(id)sender;\n\n@end\n```\n\n![](img/aab2d775c46f70cd606f2e58e2521324_93_0.png)\n\
    \n![](img/aab2d775c46f70cd606f2e58e2521324_93_1.png)"
