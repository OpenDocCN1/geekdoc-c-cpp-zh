  md: '# C


    # Getting Around

    in Interface Builder


    Interface Builder is one of the tools shipped with the iPhone SDK. It is a visual
    design tool that you can use to build the user interface of your iPhone applications.
    Although not strictly required for the development of your iPhone applications,
    Interface Builder plays an integral role in your journey of learning about iPhone
    application development. This appendix covers some of the important features of
    Interface Builder.


    # .XIB WINDOW


    The most direct way to launch Interface Builder is to double-click any of the
    .xib files in your Xcode project. For example, if you have created a View-based
    Application project, there would be two .xib files in the Resources folder of
    Xcode. Double-clicking any one of them launches Interface Builder.


    When Interface Builder is launched, the first window that you see has the same
    name as your .xib file (see Figure C-1).


    ![](img/aab2d775c46f70cd606f2e58e2521324_470_0.png)


    FIGURE C-1'
  merge: -1
  img_proc: true
- pgno: 471
  md: 'Within this window are several items, and depending on what you double-clicked,
    you should see some of the following items, such as:


    +   - File''s Owner

    +   - First Responder

    +   - View, Table View, Window, and so on

    +   - Some View Controllers and delegates


    By default, the .xib window is displayed in icon mode. But you can also switch
    to list mode, where you can view some of the items in more detail. For example,
    Figure C-2 shows that when viewed in list mode, the View item displays a hierarchy
    of views contained within it.


    ![](img/aab2d775c46f70cd606f2e58e2521324_471_0.png)


    FIGURE C-2


    # DESIGNING THE VIEW


    To design the user interface of your application, you typically double-click the
    View (or Table View or other) item on the .xib window to visually display the
    window so that you can drag and drop views onto your View window.


    To populate your View window with views, you drag and drop objects listed in the
    Library window (see the Library section for more information on the Library window).
    Figure C-3 shows a Label view being dropped onto the View window.'
  merge: -1
