  md: '![](img/aab2d775c46f70cd606f2e58e2521324_352_0.png)


    FIGURE 14-3


    # How It Works


    The preceding application works by sensing the user’s touch on the screen of the
    iPhone or iPod Touch. When the user touches the screen, the View or View Controller
    fires a series of events that you can handle. There are four such events:


    +   - `touchesBegan:withEvent:`

    +   - `touchesEnded:withEvent:`

    +   - `touchesMoved:withEvent:`

    +   - `touchesCancelled:withEvent:`


    Take a closer look at the first event. First, the `touchesBegan:withEvent:` event
    is fired when at least one touch is detected on the screen. In this event, you
    can know how many fingers are on the screen by calling the `allTouches` method
    of the `UIEvent` object (event):


    ```

    ///---get all touches on the screen---

    NSSet *allTouches = [event allTouches];

    ```


    The `allTouches` method returns an `NSSet` object containing a set of `UITouch`
    objects. To know how many fingers are on the screen, simply count the number of
    `UITouch` objects in the `NSSet` object using'
  merge: -1
  img_proc: true
- pgno: 353
  md: "the count method. In this case, you are (at this moment) interested only in\
    \ a single touch, therefore you implement only the case for one touch:\n\n```\n\
    //---compare the number of touches on the screen---\nswitch ([allTouches count])\n\
    {\n    //---single touch---\n    case 1: {\n        //---get info of the touch---\n\
    \        UITouch *touch = [[allTouches allObjects] objectAtIndex:0];\n\n     \
    \   //---compare the touches---\n        switch ([touch tapCount])\n        {\n\
    \            //---single tap---\n            case 1: {\n                imageView.contentMode\
    \ = UIViewContentModeScaleAspectFit;\n            } break;\n\n            //---double\
    \ tap---\n            case 2: {\n                imageView.contentMode = UIViewContentModeCenter;\n\
    \            } break;\n        }\n    } break;\n}\n```\n\nYou extract details\
    \ of the first touch by using the allObjects method of the NSSet object to return\
    \ an NSArray object. You then use the objectAtIndex: method to obtain the first\
    \ array item.\n\nThe UITouch object (touch) contains the tapCount property, which\
    \ tells you whether the user has single-tapped the screen or performed a double\
    \ tap (or more). If the use single-tapped the screen, you resize the image to\
    \ fit the entire ImageView view using the UIViewContentModeScaleAspectFit constant.\
    \ If it is a double-tap, you restore it to its original size using the UIViewContentModeCenter\
    \ constant.\n\nThe other three events, which are not discussed in this section,\
    \ are touchesEnded:withEvent:, touchesMoved:withEvent:, and touchesCancelled:withEvent:.\n\
    \nThe touchesEnded:withEvent: event is fired when the user's finger(s) is lifted\
    \ from the screen. The touchesMoved:withEvent: event is fired continuously when\
    \ the user's finger or fingers are touching and moving on the screen. Finally,\
    \ if the application is interrupted while the user's finger is on the screen,\
    \ the touchesCancelled:withEvent: event is fired.\n\n> NOTE In addition to detecting\
    \ taps in the touchesBegan:withEvent: event, you can detect them in the touchesEnded:withEvent:\
    \ event."
  merge: -1
  img_proc: true
- pgno: 354
  md: '# UNDERSTANDING MULTI-TAPPING


    When a user performs a multi-tap on the screen, your application will fire the
    `touchesBegan:` and `touchesEnded:` events multiple times. For example, if the
    user taps on the screen once, the `touchesBegan:` and `touchesEnded:` events will
    be fired once, with the `tapCount` property of the `UITouch` object returning
    a value of 1. However, if the user taps the screen twice (in quick succession),
    then the `touchesBegan:` and `touchesEnded:` events will be fired twice; the first
    time these events are fired, the `tapCount` property will be 1, the second time
    the `tapCount` property will be 2.


    Understanding the way multi-taps are detected is important because if you are
    detecting double-taps your application might redundantly execute blocks of code
    that are designed for single-tap. For example, in the preceding Try It Out, double-tapping
    on the image will first try to change the mode of the image to `UIViewContentModeScaleAspectFit`
    (which is what single-tap is supposed to do; in this case because the image is
    already in the `UIViewContentModeScaleAspectFit` mode the user won''t notice any
    difference), then it changes back to the `UIViewContentModeCenter` mode (which
    is what double-tap is supposed to do). Ideally, it should not need to execute
    the block of code for single-tap.


    To solve this problem, you have to write some code to check if a second tap is
    indeed coming:


    +   - When a single-tap is detected, use a timer using a `NSTimer` object.

    +   - When a double-tap is detected, stop the timer and check to see if the time
    difference between the second tap and the first tap is small enough (such as a
    fraction of a second) to constitute a double-tap. If it is, execute the code for
    double-tap. Else, execute the code for single-tap.


    In the next section, you learn how to detect for multi-touches in your application.


    # DETECTING MULTI-TOUCHES


    Detecting for multi-touches is really very simple after you understand the concepts
    in previous section. The ability to detect for multi-touches is very useful because
    you can use this ability to zoom in on views in your application.'
  merge: -1
  img_proc: true
