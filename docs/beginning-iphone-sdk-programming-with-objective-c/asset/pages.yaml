    \n```\n```objc\n#import \"EmailsViewController.h\"\n\n@implementation EmailsViewController\n\
    @synthesize to, subject, body;\n\n- (void) sendEmailTo: (NSString *) toStr\n \
    \   withSubject: (NSString *) subjectStr\n      withBody: (NSString *) bodyStr\
    \ {\n\n    NSString *emailStr =\n        [NSString stringWithFormat:@\"mailto:?to=%@&subject=%@&body=%@\"\
    ,\n        [toStr stringByAddingPercentEscapesUsingEncoding:NSASCIIStringEncoding],\n\
    \        [subjectStr stringByAddingPercentEscapesUsingEncoding:NSASCIIStringEncoding],\n\
    \        [bodyStr stringByAddingPercentEscapesUsingEncoding:NSASCIIStringEncoding]];\n\
    \n    [[UIApplication sharedApplication] openURL:[NSURL URLWithString:emailStr]];\n\
    \    [emailStr release];\n}\n\n- (IBAction) btnSend: (id) sender {\n    [self\
    \ sendEmailTo:to.text withSubject:subject.text withBody:body.text];\n}\n\n- (void)\
    \ dealloc {\n    [to release];\n    [subject release];\n    [body release];\n\
    \    [super dealloc];\n}\n```\n```\n\n+   8. Press Command-R to test the application\
    \ on a real iPhone. Figure 16-2 shows the application in action. After you have\
    \ filled in the TextField views with the necessary information, click the Send\
    \ button to invoke the Mail application and fill it with all the information you\
    \ have typed in your application. Clicking the Send button in Mail sends the email."
