  md: "+   3. Press Command-R to test the application on the iPhone Simulator.\n+\
    \   4. You can now tap the image view and then move the image anywhere on the\
    \ screen simply by moving your finger (see Figure 14-10).\n\n# How It Works\n\n\
    The concept for this example is very simple. When a finger taps the screen, you\
    \ check to see whether the position of the finger falls within the range of the\
    \ image view:\n\n```\nCGPoint touchPoint = [touch locationInView:[self view]];\n\
    \nif (touchPoint.x > imageView.frame.origin.x && touchPoint.x < imageView.frame.origin.x\
    \ + imageView.frame.size.width && touchPoint.y > imageView.frame.origin.y && touchPoint.y\
