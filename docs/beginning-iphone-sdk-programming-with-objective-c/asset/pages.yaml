  md: '# Saving the Settings Values


    Now that you have seen how to load the values of preferences settings, use the
    following Try It Out to see how to save the values back to the preferences settings.
    This allows users to directly modify their preferences settings from within your
    application, instead of using the Settings application to do so.


    # TRY IT OUT Saving Settings Values


    +   1. In the FlipsideViewController.m file, insert the following code that appears
    in bold:


    ```

    #import "FlipsideViewController.h"


    @implementation FlipsideViewController


    @synthesize delegate;

    @synthesize loginName;

    @synthesize password;

    @synthesize favoriteColor;


    NSMutableArray *colors;

    NSString *favoriteColorSelected;


    - (void)viewDidLoad {

    colors = [[NSMutableArray alloc] init];

    [colors addObject:@"Red"];

    [colors addObject:@"Green"];

    [colors addObject:@"Blue"];


    NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];

    loginName.text = [defaults objectForKey:@"login_name"];

    password.text = [defaults objectForKey:@"password"];


    //---find the index of the array for the color saved---

    favoriteColorSelected = [[NSString alloc] initWithString:

    [defaults objectForKey:@"color"]];

    int selIndex = [colors indexOfObject:favoriteColorSelected];


    //---display the saved color in the Picker view---

    [favoriteColor selectRow:selIndex inComponent:0 animated:YES];

    [super viewDidLoad];

    self.view.backgroundColor = [UIColor viewFlipsideBackgroundColor];

    }


    - (IBAction)done {

    NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];

    [defaults setObject:loginName.text forKey:@"login_name"];

    ```'
