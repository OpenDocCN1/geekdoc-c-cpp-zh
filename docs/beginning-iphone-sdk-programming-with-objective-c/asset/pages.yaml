- pgno: 384
  md: '# 16


    # Accessing Built-in Applications


    # WHAT YOU WILL LEARN IN THIS CHAPTER


    +   - How to send emails from within your application

    +   - How to invoke Safari from within your application

    +   - How to invoke the Phone from within your application

    +   - How to send SMS messages from within your application

    +   - How to access the camera and Photo Library

    +   - How to access the Contacts application

    +   - How to add and remove contact information from the Contacts application


    The iPhone comes with a number of built-in applications that make it one of the
    most popular mobile devices of all time. Some of these applications are Contacts,
    Mail, Phone, Safari, SMS, and Calendar. These applications perform most of the
    tasks you would expect of a mobile phone. As an iPhone developer, you can also
    programmatically invoke these applications from within your application using
    the various APIs provided by the iPhone SDK.


    In this chapter, you learn how to invoke some of the built-in applications that
    come bundled with iPhone as well as how to interact with them from within your
    iPhone application.


    # SENDING EMAILS


    Sending emails is one of the many tasks performed by iPhone users. Sending emails
    on the iPhone is accomplished using the built-in Mail application, which is a
    rich HTML mail client that supports POP3, IMAP, Exchange email systems, and most
    web-based emails such as Yahoo! and Gmail.'
  merge: -1
  img_proc: true
- pgno: 385
  md: 'There are times where you need to send an email in your iPhone application.
    A good example is embedding a feedback button in your application that users can
    click to send feedback to you directly. You have two ways to send emails programmatically:


    +   - Build your own email client and implement all the necessary protocols necessary
    to communicate with an email server

    +   - Invoke the built-in Mail application and ask it to send the email for you


    Unless you are well versed in network communications and familiar with all the
    email protocols, your most logical choice is to go for option two — invoke the
    Mail application to do the job. The following Try It Out shows you how (you need
    to download the code files indicated here to work through this example).


    # TRY IT OUT Sending Emails Using the Mail Application


    *Codefile [Emails.zip] is available for download at Wrox.com*


    +   1. Using Xcode, create a View-based Application project and name it Emails.

    +   2. Double-click the EmailViewController.xib file to edit it in Interface Builder.

    +   3. Populate the View window with the following views (see Figure 16-1):

    +      - Label

    +      - TextField

    +      - Button

    +   4. Insert the following statements in bold into the EmailsViewController.h
    file:


    ```

    #import <UIKit/UIKit.h>


    @interface EmailsViewController : UIViewController {

    IBOutlet UITextField *to;

    IBOutlet UITextField *subject;

    IBOutlet UITextField *body;

    }


    @property (nonatomic, retain) UITextField *to;

    @property (nonatomic, retain) UITextField *subject;

    ```


    ![](img/aab2d775c46f70cd606f2e58e2521324_385_0.png)


    FIGURE 16-1'
