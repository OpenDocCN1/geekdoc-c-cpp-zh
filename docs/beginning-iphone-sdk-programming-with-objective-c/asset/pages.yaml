    \ implements the FlipsideViewControllerDelegate protocol. In other words, it must\
    \ implement the method that is defined in the protocol (which in this case is\
    \ the flipsideViewControllerDidFinish: method).\n\nIn the MainViewController.m\
    \ file, a method named flipsideViewControllerDidFinish: is defined. Its use is\
    \ to close the FlipsideView when it is done:\n\n```\n- (void)flipsideViewControllerDidFinish:(FlipsideViewController\
    \ *)controller {\n    [self dismissModalViewControllerAnimated:YES];\n}\n```\n\
    \nThe MainViewController.m file also contains an action called showInfo(). This\
    \ action is invoked when the user presses the Info button. The showInfo() action\
    \ loads the FlipsideView modally:\n\n```\n- (IBAction)showInfo {\n    FlipsideViewController\
    \ *controller = [[FlipsideViewController alloc]\n        initWithNibName:@\"FlipsideView\"\
    \n        bundle:nil];\n    controller.delegate = self;\n    controller.modalTransitionStyle\
    \ = UIModalTransitionStyleFlipHorizontal;\n    [self presentModalViewController:controller\
    \ animated:YES];\n    [controller release];\n}\n```\n\nIf you double-click the\
    \ MainView.xib to edit it in Interface Builder, you can right-click the Info button\
    \ to confirm that its Touch Up Inside event is connected to the showInfo() action\
    \ (see Figure 9-5)."
