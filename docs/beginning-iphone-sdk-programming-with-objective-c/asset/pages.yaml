    FIGURE C-16


    When you release the mouse button, a list appears from which you can select the
    correct action.


    When you have connected the outlets and actions, a good practice is to view all
    the connections in the File''s Owner item by right-clicking it. Figure C-17 shows
    that the File''s Owner item is connected to the Text Field view through the myOutlet1
