- pgno: 512
  md: '# Testing on an Actual iPhone or iPod Touch


    Although the iPhone Simulator is a very handy tool that allows you to test your
    iPhone applications without needing an actual device, nothing beats testing on
    a real device. This is especially true when you are ready to roll out your applications
    to the world — you must ensure that it works correctly on real devices. In addition,
    if your application requires access to hardware features on an iPhone/iPod Touch,
    such as the accelerometer and GPS, you need to test it on a real device — the
    iPhone Simulator is simply not adequate.


    This appendix walks through the steps you need to take to test your iPhone applications
    on a real device, be it iPhone or iPod Touch.


    # SIGN UP FOR THE IPHONE DEVELOPER PROGRAM


    The first step toward testing your applications on a real device is to sign up
    for the iPhone Developer Program at http://developer.apple.com/iphone/program/.
    Two programs are available: Standard and Enterprise. For most developers wanting
    to release applications on the App Store, the Standard program, which costs $99,
    is sufficient. Check out http://developer.apple.com/iphone/program/apply.html
    to learn more about the differences between the Standard and Enterprise programs.


    If you just want to test your application on your actual iPhone/iPod Touch, sign
    up for the Standard program.'
  merge: -1
  img_proc: true
- pgno: 513
  md: '# START YOUR XCODE


    To test your iPhone applications on your device, you need to obtain an iPhone
    Development Certificate from the iPhone Developer Program Portal. The following
    sections walk you through the necessary steps from obtaining your certificate
    to deploying your applications onto the device.


    First, obtain the 40-character identifier that uniquely identifies your iPhone/iPod
    Touch. To do so, connect your device to your Mac and start Xcode. Choose Window
    > Organizer to launch the Organizer application. Figure E-1 shows the Organizer
    application displaying the identifier of my iPhone. Copy the identifier you obtain
    and save it somewhere. You will need this identifier later on.


    ![](img/aab2d775c46f70cd606f2e58e2521324_513_0.png)


    FIGURE E-1


    # GENERATING A CERTIFICATE SIGNING REQUEST


    To request a development certificate from Apple, you need to generate a Certificate
    Signing Request. You can do this using the Keychain Access application located
    in the Applications/Utilities/ folder (see Figure E-2).'
  merge: -1
  img_proc: true
- pgno: 514
  md: '![](img/aab2d775c46f70cd606f2e58e2521324_514_0.png)


    **FIGURE E-2**


    In the Keychain Access application, choose Keychain Access > Certificate Assistant
    and select Request a Certificate From a Certificate Authority (see Figure E-3).


    ![](img/aab2d775c46f70cd606f2e58e2521324_514_1.png)


    **FIGURE E-3**


    In the Certificate Assistant window (see Figure E-4), enter your email address,
    select the Saved to Disk radio button, and select the Let Me Specify Key Pair
    Information check box. Click Continue.'
  merge: -1
  img_proc: true
- pgno: 515
  md: '![](img/aab2d775c46f70cd606f2e58e2521324_515_0.png)


    FIGURE E-4


    Choose a key size of 2048 bits and choose the RSA algorithm (see Figure E-5).
    Click Continue.


    ![](img/aab2d775c46f70cd606f2e58e2521324_515_1.png)


    FIGURE E-5


    You are asked to save the request to a file. Use the default name suggested and
    click Save (see Figure E-6).'
  merge: -1
  img_proc: true
- pgno: 516
  md: '![](img/aab2d775c46f70cd606f2e58e2521324_516_0.png)


    FIGURE E-6


    # LOGGING IN TO THE IPHONE DEVELOPER PROGRAM PORTAL


    After you have generated the Certificate Signing Request, you need to log in to
    Apple''s iPhone Dev Center (see Figure E-7). Click the iPhone Developer Program
    Portal link on the right of the page. Remember, you need to pay $99 to have access
    to this page.


    > **WARNING** Be sure to register early because the approval process takes a while
    — from a few hours to a few days.


    ![](img/aab2d775c46f70cd606f2e58e2521324_516_1.png)


    FIGURE E-7'
  merge: -1
  img_proc: true
- pgno: 517
  md: 'On the iPhone Developer Program Portal page, click the Launch Assistant button
    (see Figure E-8) to walk you through the process of provisioning your iPhone and
    generating the development certificate.


    ![](img/aab2d775c46f70cd606f2e58e2521324_517_0.png)


    FIGURE E-8


    You should see the welcome page. Click Continue.


    First, you are asked to create an App ID (see Figure E-9). An App ID is a series
    of characters used to uniquely identify an application (or applications) on your
    iPhone. Enter a friendly name to describe this App ID (to be generated by Apple).
    Click Continue.'
  merge: -1
  img_proc: true
