    \    //...\n}\n```\n```\n\nTo know which button was tapped, you need to implement\
    \ the actionSheet:clickedButtonAtIndex: method:\n\n```\n```objective-c\n- (void)actionSheet:(UIActionSheet\
    \ *)actionSheet\nclickedButtonAtIndex:(NSInteger)buttonIndex;\n\n    NSLog([NSString\
    \ stringWithFormat:@\"%@\", buttonIndex]);\n}\n```\n```\n\nThe index of the button\
    \ clicked will be passed in via the clickedButtonAtIndex: parameter.\n\n# Page\
    \ Control and Image View\n\nOn the Home screen of the iPhone, you see a series\
    \ of dots at the bottom of the screen. A lighted dot represents the currently\
    \ selected page. As you swipe the page to the next page, the next dot will be\
    \ lighted. In the iPhone SDK, the series of dots is represented by the UIPageControl\
    \ class. Figure 4-5 shows the page control in action on the Home screen of the\
    \ iPhone.\n\nIn the following exercise, you learn how to use the page control\
    \ view within your own application to switch between images displayed in the ImageView\
