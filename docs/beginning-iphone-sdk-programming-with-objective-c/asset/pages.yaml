- pgno: 148
  md: '# How It Works


    The beauty of the iPhone user interface is that when the system detects that the
    current active view is a TextField view, the keyboard automatically appears; you
    don’t need to do anything to bring up the keyboard. Using the keyboard, you can
    enter alphanumeric data as well as numbers and special characters (such as symbols).
    The keyboard in iPhone also supports characters of languages other than English,
    such as Chinese, Hebrew, and others.


    Unfortunately, making the keyboard go away is not as straightforward as making
    it appear. When you are done with the input, the keyboard does not go away automatically.
    This is because it does not know when you are done with the input; to do so you
    need to write some code. You will learn how to do this in the section “Making
    the Keyboard Go Away.”


    # CUSTOMIZING THE TYPE OF INPUTS


    In the previous section, you saw how the TextField view was used for capturing
    user inputs. To understand more about the input behaviors, go to Interface Builder,
    select the TextField view, and view its Attributes Inspector window (choose Tools
    ⇢ Attributes Inspector). Figure 5-3 shows the Attributes Inspector window for
    the TextField view. In particular, pay attention to the section labeled Text Input
    Traits.


    The Text Input Traits section contains several items for you to use to configure
    how the keyboard handles the text entered.


    +   - The Capitalize item allows you to capitalize the words, sentences, or all
    characters of the data entered via the keyboard.

    +   - The Correction item lets you indicate whether you want the keyboard to provide
    suggestions for words that are not spelled correctly. You can also choose the
    Default option so that it defaults to the user’s global text correction settings.

    +   - The Keyboard item allows you to choose the different types of keyboard for
    entering different types of data.


    ![](img/aab2d775c46f70cd606f2e58e2521324_148_0.png)'
  merge: -1
  img_proc: true
