  md: "3. Examine the content of the TabBarApplicationAppDelegate.h file, which is\
    \ as follows:\n\n```\n```objc\n#import <UIKit/UIKit.h>\n@interface TabBarApplicationAppDelegate\
    \ : NSObject <UIApplicationDelegate, UITabBarControllerDelegate> {\n    UIWindow\
    \ *window;\n    UITabBarController *tabBarController;\n}\n@property (nonatomic,\
    \ retain) IBOutlet UIWindow *window;\n@property (nonatomic, retain) IBOutlet UITabBarController\
    \ *tabBarController;\n@end\n```\n```\n\nNote that instead of the usual UIViewController\
    \ class, you are now using the UITabBarController class, which inherits from the\
    \ UIViewController class. A TabBarController is a specialized UIViewController\
    \ class that contains a collection of view controllers.\n\n4. When the application\
    \ has finished loading, the current view of the UITabBarController instance is\
    \ loaded, an occurrence that is evident in the TabBarApplicationAppDelegate.m\
    \ file:\n\n```\n```objc\n#import \"TabBarApplicationAppDelegate.h\"\n@implementation\
    \ TabBarApplicationAppDelegate\n@synthesize window;\n@synthesize tabBarController;\n\
    - (void)applicationDidFinishLaunching:(UIApplication *)application {\n    // Add\
    \ the tab bar controller's current view as a subview of the window\n    [window\
    \ addSubview:tabBarController.view];\n}\n```\n```\n\n5. Double-click the MainWindow.xib\
    \ file to edit it in Interface Builder. Observe the two Tab Bar Item views contained\
    \ within the Tab Bar view shown at the bottom of the View.\n\n> **NOTE** A Tab\
    \ Bar Item actually is comprised of a View Controller and a Tab Bar item object."
