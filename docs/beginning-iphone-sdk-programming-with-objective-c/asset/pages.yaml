  md: '# WHAT YOU HAVE LEARNED IN THIS CHAPTER


    | TOPIC | KEY CONCEPTS |

    |---|---|

    | Creating a Tab Bar application | Use a `UITabBarController` instead of the usual
    `UIViewController`. |

    | Determining which view is loaded first in a Tab Bar application | Change the
    sequence of View Controllers listed in the `UITabBarController` instance. |

    | Adding Tab Bar Items to a Tab Bar application | After the Tab Bar item has been
    added to the Tab Bar, be sure to set its NIB Name property to a XIB file in your
    project. You also need to set its Class property to a View Controller class. |

    | Supporting orientation change in a Tab Bar application | Ensure that all View
    Controllers implement the `shouldAutorotateToInterfaceOrientation:` method. |

    | Navigating to another View Controller in a Navigation-based application | `[self.navigationController
    pushViewController:self.detailsViewController animated:YES];` |'
