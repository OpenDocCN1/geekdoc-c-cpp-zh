  img_proc: true
- pgno: 337
  md: 'In Xcode, you can create and add a property list in the Resources folder of
    your application and populate it with items using the built-in Property List Editor.
    When the application is deployed, the property list is deployed together with
    the application. Programmatically, you can retrieve the values stored in a property
    list using the NSDictionary class. More important, if you need to make changes
    to a property list, you can write the changes to a file so that subsequently you
    can refer to the file directly instead of the property list.


    In the following Try It Out, you will create a property list and populate it with
    some values. You will then read the values from the property list during runtime,
    make some changes, and then save the modified values to another property list
    file.


    > NOTE If you want to store application-specific settings that the user can modify
    outside your application, you should consider using the NSUserDefaults class to
    store the settings in the Settings application. Application Settings are discussed
    in Chapter 11.


    # TRY IT OUT Creating and Modifying a Property List


    +   1. Using the same project created earlier, right-click the project name in
    Xcode and choose Add New File.

    +   2. Select the Other item on the left of the New File dialog and select the
    Property List template on the right of the dialog (see Figure 13-4).


    ![](img/aab2d775c46f70cd606f2e58e2521324_337_0.png)


    FIGURE 13-4'
