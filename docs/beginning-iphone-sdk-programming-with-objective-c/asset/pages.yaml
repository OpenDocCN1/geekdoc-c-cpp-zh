  md: "Because the Table view now displays the list of movies in sections, with each\
    \ section representing a year, you need to tell the Table view how many sections\
    \ are there. You do so by implementing the `numberOfSectionsInTableView:` method:\n\
    \n```\n```objective-c\n- (NSInteger)numberOfSectionsInTableView:(UITableView *)tableView\
    \ {\n    //---returns the number of years as the number of sections you want to\
    \ see---\n    return [years count];\n}\n```\n```\n\nAfter the Table view knows\
    \ how many sections to display, it must also know how many rows to display in\
    \ each section. You tell it that information by implementing the `tableView:numberOfRowsInSection:`\
    \ method:\n\n```\n```objective-c\n// Customize the number of rows in the table\
    \ view.\n- (NSInteger)tableView:(UITableView *)tableView\n    numberOfRowsInSection:(NSInteger)section\
    \ {\n\n    //---check the current year based on the section index---\n    NSString\
    \ *year = [years objectAtIndex:section];\n\n    //---returns the movies in that\
    \ year as an array---\n    NSArray *moviesInSection = [movieTitles objectForKey:year];\n\
    \n    //---return the number of movies for that year as the number of rows in\
    \ that\n    // section ---\n    return [moviesInSection count];\n}\n```\n```\n\
    \nTo display the movies for each section, you implement the `tableView:cellForRowAtIndexPath:`\
    \ method and extract the relevant movie titles from the NSDictionary object:\n\
    \n```\n```objective-c\n// Customize the appearance of table view cells.\n- (UITableViewCell\
    \ *)tableView:(UITableView *)tableView\n    cellForRowAtIndexPath:(NSIndexPath\
    \ *)indexPath {\n\n    static NSString *CellIdentifier = @\"Cell\";\n\n    UITableViewCell\
    \ *cell = [tableView\n        dequeueReusableCellWithIdentifier:CellIdentifier];\n\
    \n    if (cell == nil) {\n        cell = [[[UITableViewCell alloc] initWithStyle:UITableViewCellStyleDefault\n\
    \            reuseIdentifier:CellIdentifier] autorelease];\n    }\n\n    // Configure\
    \ the cell.\n    //---get the year---\n    NSString *year = [years objectAtIndex:[indexPath\
    \ section]];\n\n    //---get the list of movies for that year---\n```\n```"
