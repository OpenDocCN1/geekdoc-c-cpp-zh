- pgno: 182
  md: "7. Save the project in Interface Builder.\n\n8. Back in Xcode, insert the following\
    \ code into the ScreenRotationsViewController.h file:\n\n```\n#import <UIKit/UIKit.h>\n\
    \n@interface ScreenRotationsViewController : UIViewController {\n    IBOutlet\
    \ UIButton *btn;\n}\n@property (nonatomic, retain) UIButton *btn;\n@end\n```\n\
    \n9. In the ScreenRotationsViewController.m file, add the following code:\n\n\
    ```\n@implementation ScreenRotationsViewController\n\n@synthesize btn;\n\n...\n\
    - (void)willAnimateSecondHalfOfRotationFromInterfaceOrientation:(UIInterfaceOrientation)fromInterfaceOrientation\
    \ duration:(NSTimeInterval)duration {\n    UIInterfaceOrientation destOrientation\
    \ = self.interfaceOrientation;\n    if (destOrientation == UIInterfaceOrientationPortrait)\
    \ {\n        //---if rotating to portrait mode---\n        btn.frame = CGRectMake(20,20,280,37);\n\
    \    }\n    else {\n        //---if rotating to landscape mode---\n        btn.frame\
    \ = CGRectMake(180,243,280,37);\n    }\n}\n- (void)dealloc {\n    [btn release];\n\
    \    [super dealloc];\n}\n```\n\n10. Save the project and press Command-R in Xcode\
    \ to deploy the application onto the iPhone Simulator.\n\n11. Observe that when\
    \ the iPhone Simulator is in portrait mode, the Round Rect Button view is displayed\
    \ in the top-left corner. But when you change the orientation to landscape mode,\
    \ it is repositioned to the bottom-right corner (see Figure 6-12)."
