    \n@implementation AccelerometerViewController\n\n@synthesize labelX, labelY, labelZ;\n\
    \n- (void)viewDidLoad {\n    UIAccelerometer *acc = [UIAccelerometer sharedAccelerometer];\n\
    \    acc.delegate = self;\n    acc.updateInterval = 1.0f/60.0f;\n    [super viewDidLoad];\n\
    }\n\n- (void)accelerometer:(UIAccelerometer *)acc didAccelerate:(UIAcceleration\
    \ *)acceleration {\n    NSString *str = [[NSString alloc] initWithFormat:@\"%g\"\
    , acceleration.x];\n    labelX.text = str;\n    str = [[NSString alloc] initWithFormat:@\"\
    %g\", acceleration.y];\n    labelY.text = str;\n    str = [[NSString alloc] initWithFormat:@\"\
    %g\", acceleration.z];\n    labelZ.text = str;\n    [str release];\n}\n\n- (void)dealloc\
    \ {\n    [labelX release];\n    [labelY release];\n    [labelZ release];\n   \
    \ [super dealloc];\n}\n```\n```\n\n7. Press Command-R to test the application\
    \ on an iPhone device. Figure 17-3 shows the data displayed on the application\
