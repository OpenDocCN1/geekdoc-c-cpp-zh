    # ###### 11.1 生成式人工智能概述


    什么是生成式人工智能？生成式人工智能（Generative Artificial Intelligence, GenAI）是指基于生成对抗网络（GAN）、扩散模型（Diffusion
    Model）、Transformer 等深度学习模型和技术，能够根据人类指令或提示，自主生成文本、图片、音频、视频等内容的模型与方法。生成式人工智能的突出特点是其生成内容的"类人"性，即生成结果与人类创作的内容相似，甚至难以区分。本节将从生成式人工智能的概念、产生与发展、应用与挑战等方面进行介绍，并展望其未来趋势。


    # ###### 11.1.1 生成式人工智能的概念


    表11-1 从内涵、特点与应用领域等方面对比了人工智能（AI）、生成式人工智能（GenAI）与大语言模型（LLM）三者的关系。


    **表11-1 人工智能、生成式人工智能与大语言模型的对比**


    | 维度 | 人工智能 | 生成式人工智能 | 大语言模型 |

    |------|---------|---------------|-----------|

    | 内涵 | 机器模拟人类智能行为 | 基于数据学习后生成新内容 | 基于海量文本数据预训练 |

    | 特点 | 专用/通用 | 创造性、生成性 | 语言理解与生成 |

    | 应用 | 分类、预测、决策 | 文本、图像、音视频生成 | 对话、写作、翻译等 |


    # ###### 11.1.2 生成式人工智能的产生与发展


    生成式人工智能的发展大致经历了四个阶段。第一阶段是早期探索阶段…'
