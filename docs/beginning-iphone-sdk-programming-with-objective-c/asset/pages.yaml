  md: "![](img/aab2d775c46f70cd606f2e58e2521324_334_0.png)\n\nFIGURE 13-2\n\n+   6.\
    \ If you deploy the application to a real device, the location of the file is\
    \ `/private/var/mobile/Applications/<application_id>/Documents/data.txt`.\n\n\
    +   7. If you double-click the data.txt file, you see its content as follows:\n\
    \n```\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE plist PUBLIC\
    \ \"-//Apple//DTD PLIST 1.0//EN\"\n\"http://www.apple.com/DTDs/PropertyList-1.0.dtd\"\
    >\n<plist version=\"1.0\">\n<array>\n    <string>a string of text</string>\n</array>\n\
    </plist>\n```\n```\n\n+   8. If you turn on the Debugger Console window (Shift-Command-R),\
    \ you see the application print the string \"a string of text\".\n\n# How It Works\n\
    \nYou first define the documentsPath method, which returns the path to the Documents\
    \ directory:\n\n```\n```objective-c\n//---finds the path to the application's\
    \ Documents directory---\n-(NSString *) documentsPath {\n    NSArray *paths =\
    \ NSSearchPathForDirectoriesInDomains(\n        NSDocumentDirectory, NSUserDomainMask,\
    \ YES);\n\n    NSString *documentsDir = [paths objectAtIndex:0];\n    return documentsDir;\n\
    }\n```\n```\n\nBasically, you use the NSSearchPathForDirectoriesInDomains() function\
    \ to create a list of directory search paths, indicating that you want to look\
    \ for the Documents directory (using the NSDocumentDirectory constant). The NSUserDomainMask\
    \ constant indicates that you want to search"
  merge: -1
