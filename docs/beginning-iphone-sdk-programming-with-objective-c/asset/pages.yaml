- pgno: 46
  md: '| FRAMEWORK NAME | DESCRIPTION |

    |---|---|

    | CoreLocation.framework | Provides location-based information using a combination
    of GPS, cell ID, and Wi-Fi networks. |

    | ExternalAccessory.framework | Provides a way to communicate with accessories.
    |

    | Foundation.framework | Provides the foundation classes for Objective C, such
    as NSObject, basic data types, operating system services, and so on. |

    | GameKit.framework | Provides networking capabilities to games; commonly used
    for peer-to-peer connectivity and in-game voice feature. |

    | IOKit.framework | Provides capabilities for driver development. |

    | MapKit.framework | Provides an embedded map interface for your application.
    |

    | MediaPlayer.framework | Provides facilities for playing movies and audio files.
    |

    | MessageUI.framework | Provides a view-controller–based interface for composing
    e-mail messages. |

    | MobileCoreServices.framework | Provides access to standard types and constants.
    |

    | OpenAL.framework | Provides an implementation of the OpenAL specification. |

    | OpenGLES.framework | Provides a compact and efficient subset of the OpenGL API
    for 2D and 3D drawing. |

    | QuartzCore.framework | Provides ability to configure animations and effects
    and then render those effects in hardware. |

    | Security.framework | Provides the ability to secure your data and control access
    to software. |

    | StoreKit.framework | Provides in-app purchase support for applications. |

    | SystemConfiguration.framework | Provides the ability to determine network availability
    and state on device. |

    | UIKit.framework | Provides the fundamental objects for managing an application''s
    UI. |


    # SOME USEFUL INFORMATION BEFORE YOU GET STARTED


    You now have a very good idea of the tools involved in iPhone application development.
    Before you go ahead and take the plunge, the following sections discuss some useful
    information that can make your journey a more pleasant one.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Versions of iPhone OS


    At the time of writing, the iPhone OS is in its third revision — that is, version
    3.0. The iPhone OS has gone through several revisions, and the major versions
    are as follows:


    +   - 1.0 — initial release of iPhone

    +   - 1.1 — additional features and bug fixes for 1.0

    +   - 2.0 — released with iPhone 3G; comes with App Store

    +   - 2.1 — additional features and bug fixes for 2.0

    +   - 2.2 — additional features and bug fixes for 2.1

    +   - 3.0 — third major release of the iPhone OS; see the next section for what
    is new in iPhone OS 3.0


    For a detailed description of the features in each release, check out http://en.wikipedia.org/wiki/iPhone_OS_version_history.


    # WHAT''S NEW IN IPHONE OS 3.0


    In June 2009, Apple released the third major revision of the iPhone OS with an
    updated device — the iPhone 3GS. The S stands for speed: The new device has a
    faster processor (600 MHz), and the reoptimized OS makes the iPhone run faster
    in all aspects.


    Some of the important new features of iPhone OS 3.0 include:


    +   - Voice activation.

    +   - Improved camera (3 megapixel and autofocus) and support for video capturing.

    +   - Ability to locate your iPhone through the Find My iPhone feature (requires
    a subscription to a MobileMe account).

    +   - Support for MMS and tethering (requires provider support).

    +   - Cut, Copy and Paste support.

    +   - New developer APIs:

    +     - Push notifications for third-party applications.

    +     - Bluetooth services: A2DP, LDAP, P2P, and Bonjour.

    +     - Mapping of the API.

    +     - Sending e-mails from within applications.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Testing on Real Devices


    One of the most common complaints that beginning iPhone programmers made was about
    the inability to test iPhone applications they have developed on their actual
    devices. It seems odd that as the owner of the device, they can''t even test their
    applications on it. Turns out that for security reasons, Apple requires all applications
    to be signed with a valid certificate, and for testing purposes, a developer certificate
    is required.


    To test your applications on a device, you must sign up for the iPhone Developer
    program and request that a developer certificate be installed onto your device.
    This is a lengthy process, but I give you detailed help with it in Appendix E.


    # Screen Resolution


    The iPhone is a beautiful device with a high-resolution screen. At 3.5 inches
    (diagonally), the iPhone screen supports multitouch operation and allows a pixel
    resolution of 480 x 320 at 163 ppi (see Figure 1-14). When designing your application,
    note that despite the 480 x 320 resolution, most of the time you''re limited to
    460 x 320 pixels because of the status bar. Of course, you can turn off the status
    bar programmatically and gain access to the full 480 x 320 resolution.


    ![](img/aab2d775c46f70cd606f2e58e2521324_48_0.png)


    Also, be mindful that users may rotate the device to display your application
    in Landscape mode. In that case, you have to make provisions to your user interface
    so that the applications can still work properly in Landscape mode should you
    decide to support the new orientation.


    NOTE Chapter 6 discusses how to handle screen rotations.


    # Single-Window Applications


    If you are new to mobile programming, you need to be aware that the limited screen
    real estate means that most mobile platforms support only single-window applications
    — that is, your application window occupies the entire screen. The iPhone is no
    exception to this platform limitation. Overlapping windows that are so common
    in desktop operating systems (such as Mac OS X and Windows) are not supported
    on the iPhone.


    # No Background Applications


    One of the major challenges in programming mobile devices is power management.
    A badly written application can be a resource hog and will drain the battery of
    the device very quickly. Apple acknowledges this issue, and from reviewing experiences
    obtained from other platforms,'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'decided that major culprits in hurting battery life and performance are background
    applications. On other platforms (such as Windows Mobile), when an application
    goes out of view (because of an incoming call, for example), the application remains
    in memory, and each background application retained in memory continues to takes
    its toll on the device’s performance and battery life.


    Apple’s solution to this problem is simple: Disallow applications to run in the
    background. Although this is an effective solution, it has irked a lot of developers.
    Many useful applications require background operation to function correctly. For
    example, a chatting application needs to be running to receive messages from other
    users. To overcome this limitation, Apple has developed its Push Notification
    Service, which feeds applications with data even when they are not running. This
    service was released with iPhone 3.0. Using push technology, a device is constantly
    connected to Apple’s server through an IP connection. When a device needs attention,
    a notification is sent from Apple’s server to the device, thereby alerting the
    specific application that needs to service that notification.


    > **NOTE** Push notification is beyond the scope of this book. For more information,
    visit Apple’s iPhone Dev Center at http://developer.apple.com/iphone/index.action.


    # Restrictions on Calling Third-Party Applications


    Another restriction that Apple places on iPhone developers is that you are not
    allowed to call third-party applications from within your application. In addition,
    you can’t run interpreted code from within your application. A good example involves
    writing a Web browser application for the iPhone. Because Web applications typically
    use JavaScript for client-side interactivity, this restriction by Apple means
    that you can’t run JavaScript code from within your application.


    # SUMMARY


    This chapter offered a quick tour of the tools used for iPhone application development.
    You also learned some of the characteristics of iPhone, such as the one-application
    limit and inability to call third-party applications. In the next chapter, you
    develop your first iPhone application, and you will soon be on your way to iPhone
    nirvana!'
  merge: -1
  img_proc: true
- pgno: 50
