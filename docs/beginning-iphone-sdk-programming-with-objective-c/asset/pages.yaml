  md: "# How It Works\n\nThat is quite a lot of work, isn't it? But not to worry:\
    \ It is actually quite easy to follow. Go ahead and dive into the details.\n\n\
    First, you add an outlet to connect to the Search Bar:\n\n```\nIBOutlet UISearchBar\
    \ *searchBar;\n```\n\nYou then define two Boolean variables so that you can track\
    \ whether the search process is ongoing and whether the user can select the rows\
    \ in the Table view:\n\n```\nBOOL isSearchOn;\nBOOL canSelectRow;\n```\n\nYou\
    \ then define two NSMutableArray objects so that you can use one to store the\
    \ list of movies and use another to temporarily store the result of the search:\n\
    \n```\nNSMutableArray *listOfMovies;\nNSMutableArray *searchResult;\n```\n\nWhen\
    \ the view is first loaded, you first associate the Search Bar with the Table\
    \ view and then copy the entire list of movie titles from the NSDictionary object\
    \ into the NSMutableArray:\n\n```\n//---display the searchbar---\nself.tableView.tableHeaderView\
    \ = searchBar;\nsearchBar.autocorrectionType = UITextAutocorrectionTypeYes;\n\n\
    //---copy all the movie titles in the dictionary into the listOfMovies array---\n\
    listOfMovies = [[NSMutableArray alloc] init];\nfor (NSString *year in array) \
    \   //---get all the years---\n{\n    //---get all the movies for a particular\
    \ year---\n    NSArray *movies = [movieTitles objectForKey:year];\n    for (NSString\
    \ *title in movies)\n    {\n        [listOfMovies addObject:title];\n    }\n}\n\
    \n//---used for storing the search result---\nsearchResult = [[NSMutableArray\
    \ alloc] init];\n\nisSearchOn = NO;\ncanSelectRow = YES;\n```\n\nWhen the user\
    \ taps the Search Bar, the searchBarTextDidBeginEditing: event (one of the methods\
    \ defined in the UISearchBarDelegate protocol) fires. In this method, you add\
    \ a Done button to the top-right corner of the screen. When the Done button is\
    \ clicked, the doneSearching: method is called (which you define next).\n\n```\n\
    //---fired when the user taps on the searchbar---\n- (void)searchBarTextDidBeginEditing:(UISearchBar\
    \ *)searchBar {\n```"
