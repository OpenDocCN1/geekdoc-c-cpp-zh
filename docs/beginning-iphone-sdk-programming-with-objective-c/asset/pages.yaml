  md: "# Bind Variables\n\nOne of the common tasks involved in formulating SQL strings\
    \ is the need to insert values into the query string and making sure that the\
    \ string is well formulated and that it does not contain invalid characters. Earlier\
    \ in the Inserting Records section, you saw that to insert a row into the database,\
    \ you had to formulate your SQL statement like this:\n\n```\nNSString *sql = [NSString\
    \ stringWithFormat:\n@\"INSERT OR REPLACE INTO '%@' ('%@', '%@') VALUES ('%@','%@')\"\
    ,\ntableName, field1, field2, field1Value, field2Value];\n\nchar *err;\nif (sqlite3_exec(db,\
    \ [sql UTF8String], NULL, NULL, &err) != SQLITE_OK)\n{\n    sqlite3_close(db);\n\
    \    NSAssert(0, @\"Error updating table.\");\n}\n```\n\nSQLite supports a feature\
    \ known as bind variables to help you formulate your SQL string. For example,\
    \ the preceding SQL string can be formulated as follows using bind variables:\n\
    \n```\nNSString *sqlStr = [NSString stringWithFormat:\n@\"INSERT OR REPLACE INTO\
    \ '%@' ('%@', '%@') VALUES (?,?)\",\ntableName, field1, field2];\n\nconst char\
    \ *sql = [sqlStr UTF8String];\n```\n\nHere, the ? is a placeholder for you to\
    \ replace with the actual value of the query. In the preceding statement, assuming\
    \ that tableName is Contacts, field1 is email, and field2 is name, the sql is\
    \ now:\n\n```\nINSERT OR REPLACE INTO Contacts ('email', 'name') VALUES (?,?)\n\
    ```\n\n> NOTE Note that the ? can be inserted only into the VALUES and WHERE section\
    \ of the SQL statement; you cannot insert it into a table name, for example. The\
    \ following statement would be invalid: INSERT OR REPLACE INTO ? ('email', 'name')\
    \ VALUES (?,?).\n\nTo substitute the values for the ?, you need to create a sqlite3_stmt\
    \ object and use the sqlite3_prepare_v2() function to compile the SQL string into\
    \ a binary form and then insert the placeholder values using the sqlite3_bind_text()\
    \ function, like this:\n\n```\nsqlite3_stmt *statement;\n\nif (sqlite3_prepare_v2(db,\
    \ sql, -1, &statement, nil) == SQLITE_OK) {\n    sqlite3_bind_text(statement,\
    \ 1, [field1Value UTF8String], -1, NULL);\n    sqlite3_bind_text(statement, 2,\
    \ [field2Value UTF8String], -1, NULL);\n}\n```"
  merge: -1
  img_proc: true
