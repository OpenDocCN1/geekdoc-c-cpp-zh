  md: "To make the animation smoother, you can animate the visual changes caused by\
    \ setting the center property of the view within an animation block. The start\
    \ of the animation block is defined by the beginAnimations:context: class method\
    \ of the UIView class:\n\n```\n[UIView beginAnimations:@\"my_own_animation\" context:nil];\n\
    imageView.center = CGPointMake(\n    imageView.center.x + position.x,\n    imageView.center.y\
    \ + position.y);\n[UIView commitAnimations];\n```\n\nTo end an animation block,\
    \ you call the commitAnimations class method of the UIView class. The preceding\
    \ code tries to animate the ImageView when it moves from one position to another\
    \ (see Figure 15-6). This results in a much smoother animation than before.\n\n\
    ![](img/aab2d775c46f70cd606f2e58e2521324_375_0.png)\n\n# TRANSFORMING VIEWS\n\n\
    The previous section shows how you can use the NSTimer class to simulate some\
    \ simple animation by constantly changing the position of the ImageView. Besides\
    \ repositioning the view, you can use the transformation techniques supported\
    \ by the iPhone SDK to achieve the same effect.\n\nTransforms are defined in Core\
    \ Graphics, and the iPhone SDK supports standard affine 2D transforms. You can\
    \ use the iPhone SDK to perform the following affine 2D transforms:\n\n> NOTE\
    \ An affine transformation is a linear transformation that preserves co-linearity\
    \ and ratio of distances. This means that all the points lying on a line initially\
    \ will remain in a line after the transformation, with their respective ratio\
    \ of distance between each other maintained.\n\n+   - Translation — moves the\
    \ origin of the view by the amount specified using the x and y axes\n+   - Rotation\
    \ — moves the view by the angle specified\n+   - Scaling — changes the scale of\
    \ the view by the x and y factors specified\n\nFigure 15-7 shows the effects of\
    \ the various transformations just described."
