    \ you can use the `NSLog()` method to print debugging messages to the Debugger\
    \ Console window. The following `NSLog()` statement prints a message to the Debugger\
    \ Console window when the application changes orientation:\n\n```\n```objc\n-\
    \ (void)willRotateToInterfaceOrientation:\n    (UIInterfaceOrientation) toInterfaceOrientation\n\
    \    duration: (NSTimeInterval) duration {\n\n    NSLog(@\"In the willRotateToInterfaceOrientation:\
    \ event handler\");\n\n    UIInterfaceOrientation destOrientation = toInterfaceOrientation;\n\
    \    if (destOrientation == UIInterfaceOrientationPortrait)\n    {\n        btn.frame\
    \ = CGRectMake(20,20,280,37);\n    }\n    else\n    {\n        btn.frame = CGRectMake(180,243,280,37);\n\
    \    }\n}\n```\n```"
