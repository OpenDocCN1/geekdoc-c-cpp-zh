- pgno: 207
  md: "# # ANIMATING THE SWITCHING OF VIEWS\n\nThe switching of Views that you have\
    \ just seen in the previous section happens instantaneously — the two Views change\
    \ immediately without any visual cues. One of the key selling points of the iPhone\
    \ is its animation capabilities. Therefore for the switching of views, you can\
    \ make the display a little more interesting by performing some simple animations,\
    \ such as flipping one View to reveal another. Here is how to do that.\n\n# TRY\
    \ IT OUT — Animating the Transitions\n\n+   1. Using the same project, add the\
    \ following code that appears in bold to the `MySecondViewController.m` file:\n\
    \n```\n```objective-c\n-(IBAction) buttonClicked: (id) sender{\n\n    myViewController\
    \ = [[MyViewController alloc]\n                        initWithNibName:@\"MyView\"\
    \ bundle:nil];\n\n    [UIView beginAnimations:@\"flipping view\" context:nil];\n\
    \    [UIView setAnimationDuration:1];\n    [UIView setAnimationCurve:UIViewAnimationCurveEaseInOut];\n\
    \    [UIView setAnimationTransition:UIViewAnimationTransitionFlipFromLeft\n  \
    \      forView:self.view cache:YES];\n\n    [self.view addSubview:myViewController.view];\n\
    \n    [UIView commitAnimations];\n}\n```\n```\n\n+   2. In the `MyViewController.m`\
    \ file, add the following code that appears in bold:\n\n```\n```objective-c\n\
    -(IBAction) btnClicked:(id) sender{\n\n    [UIView beginAnimations:@\"flipping\
    \ view\" context:nil];\n    [UIView setAnimationDuration:1];\n    [UIView setAnimationCurve:UIViewAnimationCurveEaseIn];\n\
    \    [UIView setAnimationTransition:UIViewAnimationTransitionFlipFromRight\n \
    \       forView:self.view.superview cache:YES];\n\n    [self.view removeFromSuperview];\n\
    \n    [UIView commitAnimations];\n}\n```\n```\n\n+   3. Press Command-R to test\
    \ the application on the iPhone Simulator. Click the OK buttons on both Views\
    \ and notice the direction in which the two Views flipped to one another (see\
    \ Figure 7-16)."
  merge: -1
  img_proc: true
- pgno: 208
  md: '![](img/aab2d775c46f70cd606f2e58e2521324_208_0.png)


    FIGURE 7-16


    # How It Works


    First, examine the animation that is applied to the MySecondViewController. You
    perform the animation by first calling the beginAnimations: method of the UIView
    class to start the animation block:


    ```

    [UIView beginAnimations:@"flipping view" context:nil];

    ```


    The setAnimationDuration: method specifies the duration of the animation in seconds.
    Here, you set it to one second:


    ```

    [UIView setAnimationDuration:1];

    ```


    The setAnimationCurve: method sets the curve of the animating property changes
    within an animation:


    ```

    [UIView setAnimationCurve:UIViewAnimationCurveEaseInOut];

    ```


    +   You can use the following constants for the curve of the animation:

    +   - UIViewAnimationCurveEaseInOut — causes the animation to begin slowly, accelerate
    through the middle of its duration, and then slow again before completing

    +   - UIViewAnimationCurveEaseIn — causes the animation to begin slowly and then
    speed up as it progresses

    +   - UIViewAnimationCurveEaseOut — causes the animation to begin quickly and
    then slow as it completes

    +   - UIViewAnimationCurveLinear — causes an animation to occur evenly over its
    duration'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'The setAnimationTransition: method applies a transition type to be applied
    to a view during the animation duration.


    ```

    [UIView setAnimationTransition: UIViewAnimationTransitionFlipFromLeft

    forView:self.view cache:YES];

    ```


    The cache: parameter specifies whether the iPhone should cache the image of the
    view and use it during the transition. Caching the image speeds up the animation
    process. The following constants can be used for the animation transition:


    +   - UIViewAnimationTransitionNone — no transition

    +   - UIViewAnimationTransitionFlipFromLeft — flips a view around a vertical axis
    from left to right

    +   - UIViewAnimationTransitionFlipFromRight — flips a view around a vertical
    axis from right to left

    +   - UIViewAnimationTransitionCurlUp — curls a view up from the bottom

    +   - UIViewAnimationTransitionCurlDown — curls a view down from the top


    To end the animation, call the commitAnimations: method:


    ```

    [UIView commitAnimations];

    ```


    The animation performed on the MyViewController is similar to that of the MySecondViewController,
    except that the view to animate must be set to self.view.superview:


    ```

    [UIView setAnimationTransition: UIViewAnimationTransitionFlipFromRight

    forView:self.view.superview cache:YES];

    ```


    # SUMMARY


    In this chapter, you had your first experience with Window-based Application projects.
    The Window-based Application template is a good starting point for you to really
    understand the nuts and bolts of the UI of an iPhone application. You also learned
    how to switch between two views and apply animations to the transition process.
    In the next chapter, you learn the next type of application template supported
    by the iPhone SDK: Tab Bar applications. A Tab Bar application is another type
    of multiview application that you can build, except that all the groundwork has
    already been done for you to make your life easy.


    # EXERCISES


    +   1. Write the code snippet that allows you to create a View Controller programmatically.

    +   2. Write the code snippet that creates a view dynamically during runtime.

    +   3. Write the code snippet that wires up an event of a view with an event handler.'
