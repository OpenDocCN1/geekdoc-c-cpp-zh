- pgno: 488
  md: "```\n```objc\n@class SomeClass;    //---forward declaration---\n@interface\
    \ AnotherClass : NSObject {\n    SomeClass *someClass;\n}\n@end\n```\n```\n\n\
    > NOTE Another notable reason to use forward declaration where possible is that\
    \ it will reduce your compile times because the compiler does not need to traverse\
    \ as many included header files and their includes, etc.\n\n# Class Instantiation\n\
    \nTo create an instance of a class, you typically use the alloc keyword (more\
    \ on this in the Memory Management section) to allocate memory for the object\
    \ and then return it to a variable of the class type:\n\n```\n```objc\nSomeClass\
    \ *someClass = [SomeClass alloc];\n```\n```\n\nIn Objective-C, you need to prefix\
    \ an object name with the * character when you declare an object. If you are declaring\
    \ a variable of primitive type (such as float, int, CGRect, NSInteger, and so\
    \ on), the * character is not required. Here are some examples:\n\n```\n```objc\n\
    CGRect frame;    //---CGRect is a structure---\nint number;      //---int is a\
    \ primitive type---\nNSString *str    //---NSString is a class\n```\n```\n\nBesides\
    \ specifying the returning class type, you can also use the id type, like this:\n\
    \n```\n```objc\nid someClass = [SomeClass alloc];\nid str;\n```\n```\n\nThe id\
    \ type means that the variable can refer to any type of objects and hence the\
    \ * is implicitly implied.\n\n# Fields\n\nFields are the data members of objects.\
    \ For example, the following code shows that SomeClass has three fields — anotherClass,\
    \ rate, and name:\n\n```\n```objc\n#import <Foundation/Foundation.h>\n@class AnotherClass;\n\
    @interface SomeClass : NSObject {\n    AnotherClass *anotherClass;\n    float\
    \ rate;\n    NSString *name;\n}\n@end\n```\n```"
  merge: -1
  img_proc: true
- pgno: 489
  md: "# Access Privileges\n\nBy default, the access privilege of all fields is @protected.\
    \ However, the access privilege can also be @public or @private. The following\
    \ list shows the various access privileges:\n\n+   - @private — visible only to\
    \ the class that declares it\n+   - @public — visible to all classes\n+   - @protected\
    \ — visible only to the class that declares it as well as to inheriting classes\n\
    \nUsing the example shown in the previous section, if you now try to access the\
    \ fields in SomeClass from another class, such as in AnotherClass, you will not\
    \ be able to see them:\n\n```\nSomeClass *someClass = [SomeClass alloc];\nsomeClass->rate\
    \ = 5;        //---rate is declared protected---\nsomeClass->name = @\"Wei-Meng\
    \ Lee\";  //---name is declared protected---\n```\n\n> > NOTE Observe that to\
    \ access the fields in a class directly, you use the -> operator.\n\nTo make the\
    \ rate and name visible outside the class, modify the SomeClass.h file by adding\
    \ the @public compiler directive:\n\n```\n#import <Foundation/Foundation.h>\n\
    @class AnotherClass;\n\n@interface SomeClass : NSObject {\n    AnotherClass *anotherClass;\n\
    \    @public\n        float rate;\n    @public\n        NSString *name;\n}\n@end\n\
    ```\n\nThe following two statements would now be valid:\n\n```\nsomeClass->rate\
    \ = 5;        //---rate is declared protected---\nsomeClass->name = @\"Wei-Meng\
    \ Lee\";  //---name is declared protected---\n```\n\nAlthough you can access the\
    \ fields directly, doing so goes against the design principles of object-oriented\
    \ programming's rule of encapsulation. A better way is to encapsulate the two\
    \ fields you want to expose in properties. Refer to the \"Properties\" section\
    \ later in this appendix."
  merge: -1
  img_proc: true
- pgno: 490
  md: "# Methods\n\nMethods are functions that are defined in a class. Objective-C\
    \ supports two types of methods — instance methods and class methods.\n\nInstance\
    \ methods can be called only using an instance of the class. Instance methods\
    \ are prefixed with the minus sign (-) character.\n\nClass methods can be invoked\
    \ directly using the class name and do not need an instance of the class in order\
    \ to work. Class methods are prefixed with the plus sign (+) character.\n\n> **NOTE**\
    \ In some programming languages, such as C# and Java, class methods are known\
    \ as static methods.\n\nThe following code sample shows SomeClass with three instance\
    \ methods and one class method declared:\n\n```\n```objc\n#import <Foundation/Foundation.h>\n\
    @class AnotherClass;\n\n@interface SomeClass : NSObject {\n    AnotherClass *anotherClass;\n\
    \    float rate;\n    NSString *name;\n}\n\n//---instance methods---\n-(void)\
    \ doSomething;\n-(void) doSomething:(NSString *) str;\n-(void) doSomething:(NSString\
    \ *) str withAnotherPara:(float) value;\n\n//---class method---\n+(void) alsoDoSomething;\n\
    @end\n```\n```\n\nThe following shows the implementation of the methods that were\
    \ declared in the header file:\n\n```\n```objc\n#import \"SomeClass.h\"\n\n@implementation\
    \ SomeClass\n\n-(void) doSomething {\n    //---implementation here---\n}\n-(void)\
    \ doSomething:(NSString *) str {\n    //---implementation here---\n}\n-(void)\
    \ doSomething:(NSString *) str withAnotherPara:(float) value {\n    //---implementation\
    \ here---\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 491
  md: "```\n+(void) alsoDoSomething {\n    //---implementation here---\n}\n@end\n\
    ```\n\nTo invoke the three instance methods, you first need to create an instance\
    \ of the class and then call them using the instance created:\n\n```\nSomeClass\
    \ *someClass = [SomeClass alloc];\n[someClass doSomething];\n[someClass doSomething:@\"\
    some text\"];\n[someClass doSomething:@\"some text\" withAnotherPara:9.0f];\n\
    ```\n\nClass methods can be called directly using the class name, as the following\
    \ shows:\n\n```\n[SomeClass alsoDoSomething];\n```\n\nIn general, you create instance\
    \ methods when you need to perform some actions that are related to the particular\
    \ instance of the class (that is, the object). For example, suppose you defined\
    \ a class that represents the information of an employee. You may expose an instance\
    \ method that allows you to calculate the overtime wage of an employee. In this\
    \ case, you use an instance method because the calculation involves data specific\
    \ to a particular employee object.\n\nClass methods, on the other hand, are commonly\
    \ used for defining helper methods. For example, you might have a class method\
    \ called GetOvertimeRate: that returns the rates for working overtime. As all\
    \ employees get the same rate for working overtime (assuming this is the case\
    \ for your company), then there is no need to create instance methods and thus\
    \ a class method will suffice.\n\nThe next section shows how to call methods with\
    \ a varying number of parameters.\n\n# Message Sending (Calling Methods)\n\nIn\
    \ Objective-C, you use the following syntax to call a method:\n\n```\n[object\
    \ method];\n```\n\nStrictly speaking, in Objective-C you do not call a method;\
    \ you send a message to an object. The message to be passed to an object is resolved\
    \ during runtime and is not enforced at compile time. This is why the compiler\
    \ does not stop you from running your program even though you may have misspelled\
    \ the name of a method. It does try to warn you that the target object may not\
    \ respond to your message, though, because the target object will simply ignore\
    \ the message. Figure D-1 shows the warning by the compiler when one of the parameters\
    \ for the UIAlertView's initializer is misspelled (the cancelButtonsTitle: should\
    \ be cancelButtonTitle:).\n\n> NOTE For the ease of understanding, I use the more\
    \ conventional term of \"calling a method\" to refer to Objective-C's message\
    \ sending mechanism."
  merge: -1
  img_proc: true
- pgno: 492
  md: "![](img/aab2d775c46f70cd606f2e58e2521324_492_0.png)\n\n# FIGURE D-1\n\nUsing\
    \ the example from the previous section, the doSomething method has no parameter:\n\
    \n```\n-(void) doSomething {\n    //---implementation here---\n}\n```\n\nTherefore,\
    \ you can call it like this:\n\n```\n[someClass doSomething];\n```\n\nIf a method\
    \ has one or more inputs, you call it using the following syntax:\n\n```\n[object\
    \ method:input1];    //---one input---\n[object method:input1 andSecondInput:input2];\
    \    //---two inputs---\n```\n\nThe interesting thing about Objective-C is the\
    \ way you call a method with multiple inputs. Using the earlier example:\n\n```\n\
    -(void) doSomething:(NSString *) str withAnotherPara:(float) value {\n    //---implementation\
    \ here---\n}\n```\n\nThe name of the preceding method is doSomething:withAnotherPara:.\n\
    \nIt is important to note the names of methods and to differentiate those that\
    \ have parameters from those that do not. For example, doSomething refers to a\
    \ method with no parameter, whereas doSomething: refers to a method with one parameter,\
    \ and doSomething:withAnotherPara: refers to a method with two parameters. The\
    \ presence or absence of colons in a method name dictates which method is invoked\
    \ during runtime. This is important when passing method names as arguments, particularly\
    \ when using the @selector (discussed in the Selectors section) notation to pass\
    \ them to a delegate or notification event.\n\nMethod calls can also be nested,\
    \ as the following example shows:\n\n```\nNSString *str = [[NSString alloc] initWithString:@\"\
    Hello World\"];\n```\n\nHere, you first call the alloc class method of the NSString\
    \ class and then call the initWithString: method of the returning result from\
    \ the alloc method, which is of type id, a generic C type that Objective-C uses\
    \ for an arbitrary object.\n\nIn general, you should not nest more than three\
    \ levels because anything more than that makes the code difficult to read."
  merge: -1
  img_proc: true
