    # How It Works


    The exercise covers quite a number of concepts, and you will need some time to
    understand them all.


    First, you created a property list in your project. You populated the property
    list with several key/value pairs. Essentially, you can visualize the key/value
    pairs stored in the property list as shown in Figure 10-18.'
