  md: "+   7. Control-drag the TextField view onto the File’s Owner item (see Figure\
    \ 5-23). Select delegate.\n\n> **NOTE** This step is important because it enables\
    \ the delegate protocols (`textFieldDidBeginEditing:` and `textFieldDidEndEditing:`)\
    \ to be handled by your View Controller.\n\n![](img/aab2d775c46f70cd606f2e58e2521324_162_0.png)\n\
    \nFIGURE 5-23\n\n+   8. Save the ScrollingViewsViewController.xib in Interface\
    \ Builder.\n\n+   9. Back in Xcode, type the following statements highlighted\
    \ in bold into the `ScrollingViewsViewController.h` file:\n\n```\n```objective-c\n\
    #import <UIKit/UIKit.h>\n\n@interface ScrollingViewsViewController :\n    UIViewController\
    \ <UITextFieldDelegate> {\n\n    IBOutlet UITextField *textField;\n    IBOutlet\
    \ UIScrollView *scrollView;\n}\n\n@property (nonatomic, retain) UITextField *textField;\n\
    @property (nonatomic, retain) UIScrollView *scrollView;\n\n@end\n```\n```"
