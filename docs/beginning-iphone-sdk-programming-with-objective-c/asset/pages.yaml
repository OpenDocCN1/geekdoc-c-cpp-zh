  md: '![](img/aab2d775c46f70cd606f2e58e2521324_296_0.png)


    ![](img/aab2d775c46f70cd606f2e58e2521324_296_1.png)


    6. When you touch the Application Settings entry, you see the default settings
    created for you (see Figure 11-5).


    # How It Works


    It seems almost magical that without coding a single line, you have incorporated
    your application preferences into your application. The magic part is actually
    the Settings.bundle file that you have added to your project. It contains two
    files: Root.plist and Root.strings. The Root.plist file is an XML file that contains
    a collection of dictionary objects (key/value pairs). These key/value pairs are
    translated into the preferences entries you see in the Settings application.


    > **NOTE** Note that the key/value pair in the `Root.plist` file is case sensitive.
    Hence, you need to be careful when modifying the entries. A typo can result in
    a nonfunctional application.


    Take a moment to understand the use of the various keys used in the `Root.plist`
    file. There are two root-level keys in the `Root.plist` file, as follows:


    +   - `StringsTable`, which contains the name of the strings file associated with
    this file. In this case, it is pointing to `Root.strings`.

    +   - `PreferenceSpecifiers`, which is of type Array and contains an array of
    dictionaries, with each item containing the information for a single preference.'
