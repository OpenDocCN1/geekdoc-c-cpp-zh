- pgno: 95
  md: "```\n- (IBAction)pinBtnClicked:(id)sender {\n    //---append the pin entered\
    \ to the string---\n    [secretPin appendString:[sender titleForState:UIControlStateNormal]];\n\
    }\n- (IBAction)btnClicked:(id)sender {\n    //---if the user has entered the pin\
    \ correctly---\n    if ([secretPin isEqualToString: @\"2345\"]) {\n        NSString\
    \ *str = [[NSString alloc]\n            initWithFormat:@\"Hello, %@\", nameTextField.text\
    \ ];\n        UIAlertView *alert = [[UIAlertView alloc]\n            initWithTitle:@\"\
    Hello\"\n            message: str\n            delegate:self\n            cancelButtonTitle:@\"\
    OK\"\n            otherButtonTitles:nil, nil];\n        [alert show];\n      \
    \  [alert release];\n        [str release];\n    }\n}\n- (void)viewDidLoad {\n\
    \    //---init the string with an initial capacity of 1---\n    secretPin = [[NSMutableString\
    \ alloc] initWithCapacity:1];\n    [super viewDidLoad];\n}\n- (void)dealloc {\n\
    \    [nameTextField release];\n    [secretPin release];\n    [super dealloc];\n\
    }\n```\n\nIn the preceding code, when the View is loaded, you initialize the mutable\
    \ string secretPin with an initial capacity of one. A mutable string is a string\
    \ whose content can be edited. In this case, you initialize it by setting its\
    \ initial length to one. Whenever the user presses the buttons labeled 1 to 5,\
    \ the pinBtnClicked: method is called. You use the titleForState: method together\
    \ with the UIControlStateNormal constant to extract the text displayed on the\
    \ button and then append it to the secretPin string:\n\n```\n[secretPin appendString:[sender\
    \ titleForState:UIControlStateNormal]];\n```\n\n> **WARNING** The UIControlStateNormal\
    \ constant represents the normal state of a view (control). Some other possible\
    \ states are UIControlStateHighlighted (when the view is highlighted) and UIControlStateDisabled\
    \ (when the view is disabled).\n\n![](img/aab2d775c46f70cd606f2e58e2521324_95_0.png)"
