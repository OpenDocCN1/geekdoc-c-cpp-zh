    \n@synthesize webView;\n\n- (void)viewDidLoad {\n    NSURL *url = [NSURL URLWithString:@\"\
    http://www.apple.\n    com\"];\n    NSURLRequest *req = [NSURLRequest requestWithURL:url];\n\
    \    [webView loadRequest:req];\n\n    [super viewDidLoad];\n}\n\n- (void)dealloc\
    \ {\n    [webView release];\n    [super dealloc];\n}\n```\n```\n\n+   7. Press\
    \ Command-R to test the application on the iPhone Simulator. You should see the\
    \ application loading the page from Apple.com (see Figure 4-17).\n\n![](img/aab2d775c46f70cd606f2e58e2521324_126_0.png)\n\
    \n# How It Works\n\nTo load the Web view with a URL, you first instantiate an\
    \ NSURL object with a URL via the URLWithString method:\n\n```\n```objc\nNSURL\
    \ *url = [NSURL URLWithString:@\"http://www.apple.com\"];\n```\n```\n\nYou then\
    \ create an NSURLRequest object by passing the NSURL object to its requestWithURL:\
    \ method:\n\n```\n```objc\nNSURLRequest *req = [NSURLRequest requestWithURL:url];\n\
    ```\n```\n\nFinally, you load the Web view with the NSURLRequest object via the\
    \ loadRequest: method:\n\n```\n```objc\n[webView loadRequest:req];\n```\n```"
