    \ alloc]\n                 initWithTitle:@\"Hello World\"\n                 message:@\"\
    Hello, My World\"\n                 delegate:self\n                 cancelButtonTitle:@\"\
    OK\"\n                 otherButtonTitles:nil];\n```\n\n![](img/aab2d775c46f70cd606f2e58e2521324_460_0.png)"
