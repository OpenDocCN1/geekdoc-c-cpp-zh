- pgno: 485
  md: 'The `#import` statement is known as a *preprocessor directive*. In C and C++,
    you use the `#include` preprocessor directive to include a file’s content with
    the current source. In Objective-C, you use the `#import` statement to do the
    same, except that the compiler ensures that the file is included at most only
    once. To import a header file from one of the frameworks, you specify the header
    filename using angle brackets (`<>`) in the `#import` statement. To import a header
    file from within your project, you use the `"` and `"` characters, as in the case
    of the `SomeClass.m` file:


    ```

    ```objc

    #import "SomeClass.h"


    @implementation SomeClass


    @end

    ```

    ```


    # CLASSES


    In Objective-C, you will spend a lot of time dealing with classes and objects.
    Hence it is important that you understand how classes are declared and defined
    in Objective-C.


    # @interface


    To declare a class, you use the `@interface` compiler directive, like this:


    ```

    ```objc

    @interface SomeClass : NSObject {


    }

    ```

    ```


    This is done in the header file (.h) and the class declaration contains no implementation.
    The preceding code declares a class named SomeClass, and this class inherits from
    the base class named NSObject.


    > **NOTE** While you typically put your code declaration in an `.h` file, you
    can also put it inside an `.m` file if need be. This is usually done for small
    projects.


    > **NOTE** `NSObject` is the root class of most Objective-C classes. It defines
    the basic interface of a class and contains methods common to all classes that
    inherit from it. `NSObject` also provides the standard memory management and initialization
    framework used by most objects in Objective-C as well as reflection and type operations.'
  merge: -1
  img_proc: true
- pgno: 486
  md: "In a typical View Controller class, the class inherits from the UIViewController\
    \ class, such as in the following:\n\n```\n@interface HelloWorldViewController\
    \ : UIViewController {\n}\n```\n\n# @implementation\n\nTo implement a class declared\
    \ in the header file, you use the @implementation compiler directive, like this:\n\
    \n```\n#import \"SomeClass.h\"\n\n@implementation SomeClass\n\n@end\n```\n\nThis\
    \ is done in a separate file from the header file. In Objective-C, you define\
    \ your class in an .m file. Note that the class definition ends with the @end\
    \ compiler directive.\n\n> NOTE As mentioned earlier, you can also put your declaration\
    \ inside an .m file. Hence, in your .m file you would then have both the @interface\
    \ and @implementation directives.\n\n# @class\n\nIf your class references another\
    \ class defined in another file, you need to import the header file of that file\
    \ before you can use it. Consider the following example where you have defined\
    \ two classes — SomeClass and AnotherClass. If you are using an instance of the\
    \ AnotherClass from within SomeClass, you need to import the AnotherClass.h file,\
    \ as in the following code snippet:\n\n```\n//---SomeClass.h---\n#import <Foundation/Foundation.h>\n\
    #import <AnotherClass.h>\n\n@interface SomeClass : NSObject {\n    //---an object\
    \ from AnotherClass---\n    AnotherClass *anotherClass;\n}\n\n@end\n\n//---AnotherClass.h---\n\
    #import <Foundation/Foundation.h>\n```"
  merge: -1
  img_proc: true
