- pgno: 379
  md: '# How It Works


    To rotate a view, set its transform property using a CGAffineTransform data structure
    returned by the CGAffineTransformMakeRotation() function. The CGAffineTransformMakeRotation()
    function takes a single argument, which contains the angle to rotate (in radians).
    After each rotation, you increment the angle by 0.02:


    ```

    //---rotation---

    imageView.transform = CGAffineTransformMakeRotation(angle);

    angle += 0.02;

    ```


    A full rotation takes 360 degrees, which works out to be 2π radian. Hence, if
    the angle exceeds 6.2857 (=2*3.142857), you reset angle to 0:


    ```

    if (angle>6.2857) angle = 0;

    ```


    # Scaling


    For scaling of views, you use the CGAffineTransformMakeScale() function to return
    a CGAffineTransform data structure and set it to the transform property of the
    view:


    ```

    imageView.transform = CGAffineTransformMakeScale(angle, angle);

    ```


    The CGAffineTransformMakeScale() function takes in two arguments: the factor to
    scale for the x-axis and the factor to scale for the y-axis.


    If you modify the previous example with the preceding statement, the tennis ball
    gets bigger as it bounces on the screen (see Figure 15-8). It then resets back
    to its original size and grows again.


    ![](img/aab2d775c46f70cd606f2e58e2521324_379_0.png)


    FIGURE 15-8


    # ANIMATING A SERIES OF IMAGES


    So far, you have seen that you can use the ImageView view to display a static
    image. In addition, you can use it to display a series of images and then alternate
    between them.


    The following Try It Out shows how this is done using the ImageView.'
