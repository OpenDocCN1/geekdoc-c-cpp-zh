  md: "If the device is held upright and moved to the right quickly, the value of\
    \ the X-axis will increase from 0 to a positive value. If it is moved to the left\
    \ quickly, the value of the X-axis will decrease from 0 to a negative value. If\
    \ the device is moved upward quickly, the value of the Y-axis will increase from\
    \ -1.0 to a larger value. If the device is moved download quickly, the value of\
    \ the Y-axis will decrease from -1.0 to a smaller value.\n\nIf the device is lying\
    \ flat on a table and then dropped, the value of the Z-axis will decrease from\
    \ -1.0 to a smaller number. If it is moved upward, the value of the Z-axis will\
