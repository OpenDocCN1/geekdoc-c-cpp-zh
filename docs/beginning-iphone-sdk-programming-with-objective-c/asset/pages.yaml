- pgno: 91
  md: "The nameTextField is an IBOutlet instance member of type UITextField. A good\
    \ practice in iPhone programming is to expose the member variable as a property\
    \ using the @property identifier:\n\n```\n#import <UIKit/UIKit.h>\n\n@interface\
    \ BasicUIViewController : UIViewController {\n    IBOutlet UITextField *nameTextField;\n\
    }\n\n@property (nonatomic, retain) UITextField *nameTextField;\n\n- (IBAction)btnClicked:(id)sender;\n\
    @end\n```\n\n> NOTE The IBOutlet tag can also be added to the @property identifier.\
    \ This syntax is common in the Apple documentation:\n> @property (nonatomic, retain)\
    \ IBOutlet UITextField *nameTextField;\n\n> NOTE For the use of the nonatomic\
    \ and retain identifiers, refer to Appendix D, where you can find an introduction\
    \ to Objective-C. Also, the @synthesize keyword, discussed shortly, is explained\
    \ in more detail there as well.\n\nWhen the outlet is now exposed as a property,\
    \ you need to define the getters and setters for the property. A quick and easy\
    \ way to use the @synthesize keyword in the BasicUIViewController.m file, like\
    \ this:\n\n```\n#import \"BasicUIViewController.h\"\n\n@implementation BasicUIViewController\n\
    \n@synthesize nameTextField;\n```\n\n# Coding the Action\n\nAs shown earlier,\
    \ you connected the Touch Up Inside event of the Round Rect Button view with the\
    \ btnClick: action defined in the View Controller. To implement the btnClick:\
    \ method, code the following in the BasicUIViewController.m file:\n\n```\n#import\
    \ \"BasicUIViewController.h\"\n\n@implementation BasicUIViewController\n\n@synthesize\
    \ nameTextField;\n```"
  merge: -1
  img_proc: true
- pgno: 92
  md: "```\n```objective-c\n- (IBAction)btnClicked:(id)sender {\n    NSString *str\
    \ = [[NSString alloc]\n        initWithFormat:@\"Hello, %@\", nameTextField.text\
    \ ];\n    UIAlertView *alert=[[UIAlertView alloc]\n        initWithTitle:@\"Hello\"\
    \n        message: str\n        delegate:self\n        cancelButtonTitle:@\"OK\"\
    \n        otherButtonTitles:nil, nil];\n    [alert show];\n    [alert release];\n\
    \    [str release];\n}\n\n- (void)dealloc {\n    [nameTextField release];\n  \
    \  [super dealloc];\n}\n@end\n```\n```\n\nYou use the @synthesize identifier to\
    \ get the compiler to generate the accessor and mutator (also commonly known as\
    \ getters and setters) for the nameTextField property. The UIAlertView class displays\
    \ an alert window with the content specified.\n\nThat's it! To test the application,\
    \ press Command-R in Xcode. If the current active SDK selected is the iPhone Simulator\
    \ (3.0) (see Figure 3-25), the iPhone Simulator is launched.\n\n![](img/aab2d775c46f70cd606f2e58e2521324_92_0.png)"
