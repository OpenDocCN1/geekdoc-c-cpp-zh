- pgno: 81
  md: 'Populate the View window as shown in Figure 3-12. The following views are used:


    +   - Label

    +   - Text Field

    +   - Round Rect Button


    What your application will do is simple: When the user enters his or her name
    in the Text field and clicks the Round Rect button, the application displays an
    alert view showing the user''s name.


    # Creating Outlets and Actions


    In order for your application to interact with views on the View window, you need
    a mechanism to reference your views on the window and at the same time provide
    methods to be invoked when some events happen on the window. In iPhone programming,
    these two mechanisms are known as outlets and actions, respectively.


    In the BasicUIViewController.xib window (see Figure 3-13), select the File''s
    Owner item and view its Identity Inspector window (choose Tools > Identity Inspector).
    Under the Class Actions section, click the plus (+) button to add an action named
    btnClicked:. Under the Class Outlets section, click the plus button to add an
    outlet named nameTextField. Set its Type to UITextField.


    ![](img/aab2d775c46f70cd606f2e58e2521324_81_0.png)


    ![](img/aab2d775c46f70cd606f2e58e2521324_81_1.png)'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'An action is a method that can handle events raised by views (for example,
    when a button is clicked) in the View window. An outlet, on the other hand, allows
    your code to programmatically reference a view on the View window.


    With the File’s Owner item selected, choose the File ↔ Write Class File menu item.
    Interface Builder generates the code necessary to represent the outlets and actions
    that you have just added. Because the project template already includes class
    files that are used by the View Controller, you see the prompt as shown in Figure
    3-14.


    > **NOTE** You can also manually modify the View Controller files (the `.h` and
    `.m` files). But the Interface Builder has this nice little feature that helps
    you generate code for your outlets and actions.


    ![](img/aab2d775c46f70cd606f2e58e2521324_82_0.png)


    At this juncture, you have two options:


