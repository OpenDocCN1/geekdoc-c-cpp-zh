  md: 'Figure 5-4 shows (from left to right) the keyboard configured with the following
    Keyboard types: Email Address, Phone Pad, and Number Pad.


    ![](img/aab2d775c46f70cd606f2e58e2521324_149_0.png)


    # FIGURE 5-4


    +   - The Appearance item lets you choose how the keyboard should appear.


    Figure 5-5 shows the keyboard in Default (top) and Alert (bottom) view.


    +   - The Return Key item (see Figure 5-6) allows you to show different types
