  md: '4. Press Command-R to test the application. Notice that when you now press
    the Return button in the second view, the second view flips up (see Figure 4-31).


    # How It Works


    Basically, you added some animation during the transitioning process via the various
    animations methods in the UIView class:


    ```

    [UIView beginAnimations:@"flipping view" context:nil];

    [UIView setAnimationDuration:1];

    [UIView setAnimationCurve:UIViewAnimationCurveEaseInOut];

    [UIView setAnimationTransition:

    UIViewAnimationTransitionCurlDown

    forView:self.view cache:YES];


    [self.view addSubview:secondViewController.view];


    [UIView commitAnimations];

    ```


    ![](img/aab2d775c46f70cd606f2e58e2521324_139_0.png)


    FIGURE 4-31


    Here''s what you did with the various statements:


    +   - You set the animation duration to be one second.

    +   - The animation curve is UIViewAnimationCurveEaseInOut. You can choose other
    animation types: UIViewAnimationCurveEaseIn, UIViewAnimationCurveEaseOut, and
    UIViewAnimationCurveLinear.

    +   - The animation transitioning type is UIViewAnimationTransitionCurlDown. You
    can choose other animation transitioning types: UIViewAnimationTransitionFlipFromLeft,
    UIViewAnimationTransitionFlipFromRight, and UIViewAnimationTransitionCurlUp.


    # Passing Data Between Views


    Sometimes you need to pass data from one view to another. So how do you do that?
    The easiest way is to create a property on the target view and set the property
    on the calling view. The following Try It Out shows you how to do this.'
