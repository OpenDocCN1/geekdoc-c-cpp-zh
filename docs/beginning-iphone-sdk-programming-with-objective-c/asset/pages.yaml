  md: '![](img/aab2d775c46f70cd606f2e58e2521324_241_0.png)


    FIGURE 9-1


    According to Apple''s UI guidelines for iPhone applications, a Utility Application
    "performs a simple task that requires a minimum of user input." Hence, if you
    are developing an application that shows a summary of information that the user
    can digest quickly, the Utility Application would be the ideal application framework
    to focus on. Some good examples of Utility Applications include:


    +   - Currency exchanges

    +   - Units conversion calculators

    +   - RSS readers


    Hence, in this chapter, you will learn how to build Utility Applications using
    the template included in the iPhone SDK.


    # CREATING UTILITY APPLICATIONS


    The iPhone SDK includes a template for building Utility Applications. Using the
    template, all the necessary coding needed to flip the views is created for you.
    If you are building a simple Utility Application, you just need to focus on your
    application logic. If you are building a more sophisticated Utility Application,
    the generated code provides a very good base for you to use to extend the application.


    To get started, create a Utility Application using the template in the SDK and
    learn about how it works in the following Try It Out.


    # TRY IT OUT Creating a Utility Application


    *Codefile (UtilityApplication.zip) available for download at Wrox.com*


    +   1. Using Xcode, create a new Utility Application project and name it UtilityApplication.

    +   2. Examine the content of the project (see Figure 9-2). Basically, two views
    are involved here: MainView.xib and FlipsideView.xib. The MainView.xib is the
    main view that users see'
