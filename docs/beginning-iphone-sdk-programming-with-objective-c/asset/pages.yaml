- pgno: 499
  md: '# retain


    The retain keyword increases the reference count of an object by 1. Consider the
    previous example:


    ```

    NSString *str = [[NSString alloc] initWithString:@"Hello"];

    NSString *str2 = str;

    ```


    In that example, you do not own str2 because you do not use the alloc keyword
    on the object. When str is released, the str2 will no longer be valid.


    > NOTE How do you release str2, then? Well, it is autoreleased. See the "Convenience
    Method and Autorelease" section for more information.


    If you want to make sure that str2 is available even if str is released, you need
    to use the retain keyword:


    ```

    NSString *str = [[NSString alloc] initWithString:@"Hello"];

    NSString *str2 = str;

    [str2 retain];

    [str release];

    ```


    In the preceding case, the reference count for str is now 2. When you release
    str, str2 will still be valid. When you are done with str2, you need to release
    it manually.


    > NOTE As a general rule, if you own an object (using alloc or retain), you need
    to release it.


    # release


    When you are done with an object, you need to manually release it by using the
    release keyword:


    ```

    NSString *str = [[NSString alloc] initWithString:@"Hello"];

    //...do what you want with the object...

    [str release];

    ```


    When you use the release keyword on an object, it causes the reference count of
    that object to decrease by 1. When the reference count reaches 0, the memory used
    by the object is released.'
  merge: -1
  img_proc: true
- pgno: 500
  md: "One important aspect to keep in mind when using the release keyword is that\
    \ you cannot release an object that is not owned by you. For example, consider\
    \ the example used in the previous section:\n\n```\nNSString *str = [[NSString\
    \ alloc] initWithString:@\"Hello\"];\nNSString *str2 = str;\n[str release];\n\
    [str2 release]; //---this is not OK as you do not own str2---\n```\n\nAttempting\
    \ to release str2 will result in a runtime error because you cannot release an\
    \ object not owned by you. However, if you use the retain keyword to gain ownership\
    \ of an object, you do need to use the release keyword:\n\n```\nNSString *str\
    \ = [[NSString alloc] initWithString:@\"Hello\"];\nNSString *str2 = str;\n[str2\
    \ retain];\n[str release];\n[str2 release]; //---this is now OK as you now own\
    \ str2---\n```\n\nRecall earlier that in the section on properties, you defined\
    \ the setName: method, where you set the value of the name field:\n\n```\n-(void)\
    \ setName:(NSString *) value {\n    [value retain];\n    [name release];\n   \
    \ name = value;\n}\n```\n\nNotice that you first had to retain the value object,\
    \ followed by releasing the name object and then finally assigning the value object\
    \ to name. Why do you need to do that as opposed to the following?\n\n```\n-(void)\
    \ setName:(NSString *) value {\n    name = value;\n}\n```\n\nWell, if you were\
    \ using garbage collection, the preceding statement would be valid. However, because\
    \ iPhone OS does not support garbage collection, the preceding statement will\
    \ cause the original object referenced by the name object to be lost, thereby\
    \ causing a memory leak. To prevent that leak, you first retain the value object\
    \ to indicate that you wish to gain ownership of it; then you release the original\
    \ object referenced by name. Finally, assign value to name:\n\n```\n[value retain];\n\
    [name release];\nname = value;\n```"
  merge: -1
  img_proc: true
- pgno: 501
  md: '# UNDERSTANDING REFERENCE COUNTING USING AN ANALOGY


    When you think of memory management using reference counting, it is always good
    to use a real-life analogy to put things into perspective.


    Image a room in the library that you can reserve for studying purposes. Initially,
    the room is empty and hence the lights are off. When you reserve the room, the
    librarian increases a counter to indicate the number of persons using the room.
    This is similar to creating an object using the alloc keyword.


    When you leave the room, the librarian decreases the counter, and if the counter
    is now 0, this means that the room is no longer being used and the lights can
    thus be switched off. This is similar to using the release keyword to release
    an object.


    There may be times where you have booked the room and are the only one in the
    room (hence, the counter is 1) until a friend of yours comes along. He may simply
    come and visit you and therefore doesn''t register with the librarian. Hence,
    the counter does not increase. Because he is just visiting you and hasn''t booked
    the room, he has no rights to decide whether the lights should be switched off.
    This is similar to assigning an object to another variable without using the alloc
    keyword. In this case, if you leave the room (release), the lights will be switched
    off and your friend will have to leave.


    Consider another situation in which you are using the room and another person
    also booked the room and shares it with you. In this case, the counter is now
    2. If you leave the room, the counter goes down to 1, but the lights are still
    on because another person is in the room. This situation is similar when you create
    an object and assign it to another variable that uses the retain keyword. In such
    a situation, the object is released only when both objects release it.


    # Convenience Method and Autorelease


    So far, you learned that all objects created using the alloc or new keywords are
    owned by you.


    Consider the following case:


    ```

    NSString *str = [NSString stringWithFormat:@"%d", 4];

    ```


    In this statement, do you own the str object? The answer is no, you don''t. This
    is because the object is created using one of the convenience methods — static
    methods that are used for allocating and initializing objects directly. In the
    preceding case, you create an object but you do not own it. Because you do not
    own it, you cannot release it manually. In fact, objects created using this method
    are known as autorelease objects. All autorelease objects are temporary objects
    and are added to an autorelease pool. When the current method exits, all the objects
    contained within it are released. Autorelease objects are useful for cases in
    which you simply want to use some temporary variables and do not want to burden
    yourself with allocations and de-allocations.'
  merge: -1
  img_proc: true
- pgno: 502
  md: "The key difference between an object created using the alloc (or new) keyword\
    \ and one created using a convenience method is that of ownership, as the following\
    \ example shows:\n\n```\nNSString *str1 = [[NSString alloc] initWithFormat:@\"\
    %d\", 4];\n[str1 release]; //---this is ok because you own str1---\nNSString *str2\
    \ = [NSString stringWithFormat:@\"%d\", 4];\n[str2 release]; //---this is not\
    \ ok because you don't own str2---\n//---str2 will be removed automatically when\
    \ the autorelease pool is activated---\n```\n\nIf you want to take ownership of\
    \ an object when using a convenience method, you can do so using the retain keyword:\n\
    \n```\nNSString *str2 = [[NSString stringWithFormat:@\"%d\", 4] retain];\n```\n\
    \nTo release the object, you can use either the autorelease or release keyword.\
    \ You learned earlier that the release keyword immediately decreases the reference\
    \ count by 1 and that the object is immediately de-allocated from memory when\
    \ the reference count reaches 0. In contrast, the autorelease keyword promises\
    \ to decrease the reference count by 1, not immediately, but sometime later. It\
    \ is like saying, \"Well, I still need the object now, but later I can let it\
    \ go.\" The following code makes it clear:\n\n```\nNSString *str = [[NSString\
    \ stringWithFormat:@\"%d\", 4] retain];\n[str autorelease]; // you don't own it\
    \ anymore; still available\nNSLog(str);       // still accessible for now\n```\n\
    \n> NOTE After you have autoreleased an object, do not release it anymore.\n\n\
    Note that the statement\n\n```\nNSString *str2 = [NSString stringWithFormat:@\"\
    %d\", 4];\n```\n\nhas the same effect as\n\n```\nNSString *str2 = @\"4\";\n```\n\
    \nAlthough autorelease objects seem to make your life simple by automatically\
    \ releasing objects that are no longer needed, you have to be careful when using\
    \ them. Consider the following example:\n\n```\nfor (int i=0; i<=99999; i++){\n\
    \    NSString *str = [NSString stringWithFormat:@\"%d\", i];\n    //...\n    //...\n\
    }\n```\n\nYou are creating an NSString object for each iteration of the loop.\
    \ Because the objects are not released until the function exits, you may well\
    \ run out of memory before the autorelease pool can kick in to release the objects.\n\
    \nOne way to solve this dilemma is to use an autorelease pool, as discussed in\
    \ the next section."
  merge: -1
  img_proc: true
- pgno: 503
  md: "# REFERENCE COUNTING: THE ANALOGY CONTINUES\n\nContinuing with our analogy\
    \ of the room in the library, imagine that you are about to sign out with the\
    \ librarian when you realize that you have left your books in the room. You tell\
    \ the librarian that you are done with the room and want to sign out now, but\
    \ because you left your books in the room, you tell the librarian not to switch\
    \ off the lights yet so that you can go back to get the books. At a later time,\
    \ the librarian can switch off the lights at his or her own choosing. This is\
    \ the behavior of autoreleased objects.\n\n# Autorelease Pools\n\nAll autorelease\
    \ objects are temporary objects and are added to an autorelease pool. When the\
    \ current method exits, all the objects contained within it are released. However,\
    \ sometimes you want to control how the autorelease pool is emptied, rather than\
    \ wait for it to be called by the OS. To do so, you can create an instance of\
    \ the NSAutoreleasePool class, like this:\n\n```\nfor (int i=0; i<=99999; i++){\n\
    \    NSAutoreleasePool *pool = [[NSAutoreleasePool alloc] init];\n    NSString\
    \ *str1 = [NSString stringWithFormat:@\"%d\"]; \n    NSString *str2 = [NSString\
    \ stringWithFormat:@\"%d\"]; \n    NSString *str3 = [NSString stringWithFormat:@\"\
    %d\"]; \n    ///\n    [pool release];\n}\n```\n\nIn this example, for each iteration\
    \ of the loop, an NSAutoreleasePool object is created, and all the autorelease\
    \ objects created within the loop — str1, str2, and str3 — go into it. At the\
    \ end of each iteration, the NSAutoreleasePool object is released so that all\
    \ the objects contained within it are automatically released. This ensures that\
    \ you have at most three autorelease objects in memory at any one time.\n\n# dealloc\n\
    \nYou have learned that by using the alloc or the new keyword, you own the object\
    \ that you have created. You have also seen how to release the objects you own\
    \ using the release or autorelease keyword. So when is a good time for you to\
    \ release them?\n\nAs a rule of thumb, you should release the objects as soon\
    \ as you are done with them. So if you created an object in a method, you should\
    \ release it before you exit the method. For properties, recall that you can use\
    \ the @property compiler directive together with the retain keyword:\n\n```\n\
    @property (retain, nonatomic) NSString *name;\n```"
  merge: -1
  img_proc: true
- pgno: 504
  md: "Because the values of the property will be retained, it is important that you\
    \ free it before you exit the application. A good place to do so is in the dealloc\
    \ method of a class (such as a View Controller):\n\n```\n-(void) dealloc {\n \
    \   [self.name release];    //---release the name property---\n    [super dealloc];\n\
    }\n```\n\nThe dealloc method of a class is fired whenever the reference count\
    \ of its object reaches 0.\nConsider the following example:\n\n```\nSomeClass\
    \ *sc1 = [[SomeClass alloc] initWithName:@\"Wei-Meng Lee\" andRate:35];\n//...do\
    \ something here...\n[sc1 release];  //---reference count goes to 0; dealloc will\
    \ be called---\n```\n\nThe preceding example shows that when the reference count\
    \ of sc1 goes to 0 (when the release statement is called), the dealloc method\
    \ defined within the class will be called. If you do not define this method in\
    \ the class, its implementation in the base class will be called.\n\n# Memory\
    \ Management Tips\n\nMemory management is a tricky issue in iPhone programming.\
    \ Although there are tools that you can use to test for memory leaks, this section\
    \ presents some simple things you can do to detect memory problems that might\
    \ affect your application.\n\nFirst, ensure that you implement the didReceiveMemoryWarning\
    \ method in your View Controller:\n\n```\n- (void)didReceiveMemoryWarning {\n\
    \    //---insert code here to free unused objects---\n    [super didReceiveMemoryWarning];\n\
    }\n```\n\nThe didReceiveMemoryWarning method will be called whenever your iPhone\
    \ runs out of memory. You should insert code in this method so that you can free\
    \ resources/objects that you do not need.\n\nIn addition, you should also handle\
    \ the applicationDidReceiveMemoryWarning: method in your application delegate:\n\
    \n```\n- (void)applicationDidReceiveMemoryWarning:(UIApplication *)application\n\
    {\n    //---insert code here to free unused objects---\n    [[ImageCache sharedImageCache]\
    \ removeAllImagesInMemory];\n}\n```\n\nIn this method, you should stop all memory-intensive\
    \ activities, such as audio and video playback. You should also remove all images\
    \ cached in memory."
  merge: -1
  img_proc: true
