  md: "# ADDING VIEWS DYNAMICALLY USING CODE\n\nUp to this point, all the UIs of your\
    \ application have been created visually using Interface Builder. Although Interface\
    \ Builder makes it relatively easy to build your UI using drag-and-drop, sometimes\
    \ you are better off creating the UI using code. One such instance is when you\
    \ need to create a dynamic UI, such as for games.\n\n> > **NOTE** I know of developers\
    \ who swear by creating their UI using code. Interface Builder may be easy to\
    \ use, but it can be confusing to some people. Because you often have more than\
    \ one way of doing things in Interface Builder, it can create unnecessary complications.\n\
    \nIn the following Try It Out, you learn how to create views dynamically from\
    \ code, which will help you understand how views are created and manipulated.\n\
