  md: '![](img/aab2d775c46f70cd606f2e58e2521324_518_0.png)


    The next screen allows you to provide a description of your iPhone/iPod Touch.
    You need to provide the device ID that you obtained earlier (see Figure E-10).
    Click Continue.


    ![](img/aab2d775c46f70cd606f2e58e2521324_518_1.png)'
