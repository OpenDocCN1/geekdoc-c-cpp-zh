    a commonly used event that it is the default event selected when you perform a
    Control-click and drag action. What if you want to connect other events other
    than the default event? The second method shows you how.


    # Method 2


    An alternative method for connecting outlets is to right-click the File''s Owner
    item and connect the outlet to the view directly (see Figure C-18).'
