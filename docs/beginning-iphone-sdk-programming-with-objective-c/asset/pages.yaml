  md: '# 8


    # Tab Bar and Navigation Applications


    # WHAT YOU WILL LEARN IN THIS CHAPTER


    +   - How to create Tab Bar applications

    +   - How to display Tab Bar applications in different orientations

    +   - How to create navigation-based applications

    +   - How to navigate from one View window to another in a navigation-based application


    The previous chapter demonstrated how to create a multiview application by using
    multiple view controllers. In fact, multiview applications are so common that
    the iPhone has a special category of application named after it: Tab Bar applications.
    A Tab Bar application consists of a Tab Bar commonly located at the bottom of
    the screen. Within the Tab Bar are Tab Bar items, which when touched display a
    particular view. One good example of a Tab Bar application is the Phone application
    in iPhone (see Figure 8-1). The Phone application contains five Tab Bar items:
    Favorites, Recents, Contacts, Keypad, and Voicemail. For example, when you touch
    the Favorites item, you see a list of editable favorite contacts. Touching the
    Contacts item displays the entire list of contacts stored on your iPhone.


    ![](img/aab2d775c46f70cd606f2e58e2521324_212_0.png)'
