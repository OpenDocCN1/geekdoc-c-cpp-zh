- pgno: 100
  md: "```\n```objective-c\n#import \"BasicUI2AppDelegate.h\"\n#import \"MyViewController.h\"\
    \n\n@implementation BasicUI2AppDelegate\n\n@synthesize window;\n@synthesize myViewController;\n\
    \n- (void)applicationDidFinishLaunching:(UIApplication *)application {\n\n   \
    \ //---create an instance of the MyViewController---\n    MyViewController *viewController\
    \ = [[MyViewController alloc]\n                                         initWithNibName:@\"\
    MyViewController\"\n                                         bundle:[NSBundle\
    \ mainBundle]];\n\n    //---set the instance to the property---\n    self.myViewController\
    \ = viewController;\n    [viewController release];\n\n    //---add the view of\
    \ the view controller---\n    [window addSubview:[myViewController view]];\n\n\
    \    // Override point for customization after application launch\n    [window\
    \ makeKeyAndVisible];\n}\n\n- (void)dealloc {\n    [myViewController release];\n\
    \    [window release];\n    [super dealloc];\n}\n\n@end\n```\n```\n\nThe result\
    \ of the preceding code is that when the application runs, the newly added View\
    \ Controller will be loaded.\n\n# Customizing the View\n\nWith the View Controller\
