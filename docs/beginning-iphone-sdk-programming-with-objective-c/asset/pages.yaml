- pgno: 452
  md: '# B


    # Getting Around in Xcode


    Xcode is the Integrated Development Environment (IDE) that Apple uses for developing
    Mac OS X and iPhone applications. It is a suite of applications that includes
    a set of compilers, documentation, and Interface Builder (discussed in Appendix
    C).


    Using Xcode, you can build your iPhone applications from the comfort of an intelligent
    text editor, coupled with many different tools to help debug your iPhone applications.
    If you are new to Xcode, this appendix can serve as a useful guide to get you
    started quickly. Appendix C covers the Interface Builder in more detail.


    # LAUNCHING XCODE


    The easiest way to launch Xcode is to type Xcode in the textbox of Spotlight.
    Alternatively, you can launch Xcode by navigating to the <Developer>\iPhone OS
    <version_no>\Applications\ folder and double-clicking the Xcode icon.


    ```

    <Developer>\iPhone OS <version_no>\Applications\

    ```


    > > **NOTE** For convenience, you can also drag the Xcode icon to the Dock so
    that in future you can launch it directly from the Dock.


    At the time of writing, the version of Xcode available is version 3.1.


    # Project Types Supported


    Xcode supports the building of iPhone and Mac OS X applications. When you create
    a new project in Xcode (which you do by choosing File ⌘ New Project), you see
    the New Project dialog, as shown in Figure B-1.'
  merge: -1
  img_proc: true
- pgno: 453
  md: '![](img/aab2d775c46f70cd606f2e58e2521324_453_0.png)


    FIGURE B-1


    As you can see, you have two main project types to create (iPhone OS and Mac OS
    X). Under the iPhone OS category, you have the Application item, which is further
    divided into two categories: Navigation-based Application and Window-based Application.
    Clicking the Application item displays all the project types you can create, as
    follows:


    +   - Navigation-based Application

    +   - Navigation-based Core Data Application

    +   - OpenGL ES Application

    +   - Tab Bar Application

    +   - Utility Application

    +   - View-based Application

    +   - Window-based Application

    +   - Window-based Core Data Application'
