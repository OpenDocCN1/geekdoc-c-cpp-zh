- pgno: 226
  md: "Press Command-R to test the application and change the screen rotation. What\
    \ do you notice? Well, the orientation of the application does not change — it\
    \ is still displayed in portrait mode. In order to support different orientations,\
    \ all the View Controllers contained within the UITabBarController object must\
    \ support the same orientations. That is to say, if one View Controller supports\
    \ landscape left mode, then all the View Controllers must also support landscape\
    \ left mode. Hence, in the following Try It Out, you modify the application to\
    \ support all orientations.\n\n# TRY IT OUT  Supporting Screen Rotations\n\n+\
    \   1. Using the same project created earlier, observe in the Identity Inspector\
    \ window that the Second Tab Bar item is set to the base class UIViewController.\n\
    +   2. Right-click the Classes group in Xcode and choose Add ⇧ New Files. Select\
    \ the UIViewController subclass file template and name it SecondViewController.m\
    \ (uncheck the “With XIB for user interface” option because you already have an\
    \ XIB file — SecondView.xib).\n+   3. Change the Class name for the Second Tab\
    \ Bar item to SecondViewController.\n+   4. Double-click on the SecondView.xib\
    \ file in Xcode to edit it in Interface Builder. Select the File’s Owner item\
    \ and in the Identity Inspector window, change its Class to SecondViewController.\n\
    +   5. In the FirstViewController.m, SecondViewController.m, and SearchViewController.m\
    \ files, ensure that you return YES for the shouldAutorotateToInterfaceOrientation:\
    \ method:\n+   6. That’s it! Press Command-R and you should now be able to rotate\
    \ the application to any orientation (see Figure 8-16).\n\n```\n- (BOOL)shouldAutorotateToInterfaceOrientation:(UIInterfaceOrientation)\
    \ interfaceOrientation {\n    return YES;\n}\n```\n\n![](img/aab2d775c46f70cd606f2e58e2521324_226_0.png)\n\
    \nFIGURE 8-16"
  merge: -1
  img_proc: true
- pgno: 227
  md: '# How It Works


    You may recall that the original project files created by the Tab Bar Application
    template contain only one view controller — `FirstViewController` — which corresponds
    to the first view in the Tab Bar View Controller. The second view is represented
    by the `SecondView.xib`, but it does not have a corresponding View Controller
    class. To ensure that this view supports all orientations, you need to add a new
    View Controller class to the project so that it can override the implementation
    provided by the base `UIViewController` class. You then override the `shouldAutorotateToInterfaceOrientation:`
    method so that each View Controller returns `YES` to support all orientations.


    # MAXIMUM NUMBER OF TAB BAR ITEMS


    The Tab Bar supports at most five Tab Bar Items. After you have more than five
    items, you will see a More item, and touching the More item displays the rest
    of the items in a Table View (see Figure 8-17).


    ![](img/aab2d775c46f70cd606f2e58e2521324_227_0.png)


    # NAVIGATION-BASED APPLICATIONS


    Tab Bar applications are suitable for situations in which you have several views,
    each view displaying different information so the user can quickly switch among
    them. However, sometimes you have hierarchical data that requires users to move
    from one screen to another based on what they have selected. In this situation,
    it is better to use a Navigation-based application.'
  merge: -1
  img_proc: true
