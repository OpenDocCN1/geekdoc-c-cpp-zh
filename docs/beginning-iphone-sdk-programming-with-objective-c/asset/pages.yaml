- pgno: 263
  md: "The UITableViewDataSource protocol contains several events that you can implement\
    \ to supply data to the Table view. Two events that you have handled in this example\
    \ are:\n\n+   - tableView:numberOfRowsInSection:\n+   - tableView:cellForRowAtIndexPath:\n\
    \nThe tableView:numberOfRowsInSection: event indicates how many rows you want\
    \ the Table view to display. In this case, you set it to the number of items in\
    \ the listOfMovies array.\n\n```\n```objc\n//--insert individual row into the\
    \ table view--\n- (NSUInteger)tableView:(UITableView *)tableView\nnumberOfRowsInSection:(NSUInteger)section\
    \ {\n\n    return [listOfMovies count];\n}\n```\n```\n\nThe tableView:cellForRowAtIndexPath:\
    \ event inserts a cell in a particular location of the Table view. This event\
    \ is fired once for each row of the Table view.\n\n> NOTE The tableView:cellForRowAtIndexPath:\
    \ event is not fired continuously from start to finish. For example, if the Table\
    \ view has 100 rows to be displayed, the event is fired continuously for the first,\
    \ say, 10 rows that are visible. When the user scrolls down the Table view, the\
    \ tableView:cellForRowAtIndexPath: event is fired for the next couple of visible\
    \ rows.\n\nHere, you retrieve the individual item from the array and insert it\
    \ into the Table view:\n\n```\n```objc\n- (UITableViewCell *)tableView:(UITableView\
    \ *)tableView\ncellForRowAtIndexPath:(NSIndexPath *)indexPath {\n\n    static\
    \ NSString *CellIdentifier = @\"Cell\";\n\n    //---try to get a reusable cell---\n\
    \    UITableViewCell *cell = [tableView\n    dequeueReusableCellWithIdentifier:CellIdentifier];\n\
    \n    //---create new cell if no reusable cell is available---\n    if (cell ==\
    \ nil) {\n        cell = [[[UITableViewCell alloc] initWithStyle:UITableViewCellStyleDefault\n\
    \        reuseIdentifier:CellIdentifier] autorelease];\n    }\n\n    //---set\
    \ the text to display for the cell---\n    NSString *cellValue = [listOfMovies\
    \ objectAtIndex:indexPath.row];\n    cell.textLabel.text = cellValue;\n\n    return\
    \ cell;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 264
  md: "Specifically, you use the `dequeueReusableCellWithIdentifier:` method of the\
    \ `UITableView` class to obtain an instance of the `UITableViewCell` class. The\
    \ `dequeueReusableCellWithIdentifier:` method returns a reusable Table view cell\
    \ object. This is important because if you have a large table (say, with 10,000\
    \ rows) and you create a single `UITableViewCell` object for each row, you would\
    \ generate a great performance and memory hit. Also, because a Table view displays\
    \ only a fixed number of rows at any one time, reusing the cells that have been\
    \ scrolled out of view would make sense. This is what the `dequeueReusableCellWithIdentifier:`\
    \ method does. So, for example, if 10 rows are visible in the Table view, only\
    \ 10 `UITableViewCell` objects are created — they always get reused when the user\
    \ scrolls through the Table view.\n\n# Adding a Header and Footer\n\nYou can display\
    \ a header and footer for the Table view by simply implementing the following\
    \ two methods in your View Controller:\n\n```\n```objc\n- (NSString *)tableView:(UITableView\
    \ *)tableView\n    titleForHeaderInSection:(NSInteger)section\n{\n    //--display\
    \ \"Movie List\" as the header--\n    return @\"Movie List\";\n}\n\n- (NSString\
    \ *)tableView:(UITableView *)tableView\n    titleForFooterInSection:(NSInteger)section\n\
    {\n    //--display \"Denzel Washington\" as the footer--\n    return @\"Denzel\
    \ Washington\";\n}\n```\n```\n\nIf you insert the preceding statements in the\
    \ `TableViewExampleViewController.m` file and rerun the application, you see the\
    \ header and footer of the Table view as shown in Figure 10-5.\n\n![](img/aab2d775c46f70cd606f2e58e2521324_264_0.png)\n\
    \nFIGURE 10-5\n\n# Adding an Image\n\nIn addition to text, you can display an\
    \ image next to the text of a cell in a Table view. Suppose you have an image\
    \ named apple.jpeg in the Resources folder of your project (see Figure 10-6).\n\
    \n![](img/aab2d775c46f70cd606f2e58e2521324_264_1.png)\n\nFIGURE 10-6"
  merge: -1
  img_proc: true
- pgno: 265
  md: "**NOTE** You can simply drag and drop an image to the Resources folder of Xcode.\
    \ When prompted, ensure that you save a copy of the image in your project.\n\n\
    To display an image next to the text of a cell, insert the following statements\
    \ that appear in bold into the tableView:cellForRowAtIndexPath: method:\n\n```\n\
    ```objc\n- (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath\
    \ *)indexPath {\n    static NSString *CellIdentifier = @\"Cell\";\n\n    //---try\
    \ to get a reusable cell---\n    UITableViewCell *cell = [tableView dequeueReusableCellWithIdentifier:CellIdentifier];\n\
    \n    //---create new cell if no reusable cell is available---\n    if (cell ==\
    \ nil) {\n        cell = [[[UITableViewCell alloc] initWithStyle:UITableViewCellStyleDefault\
    \ reuseIdentifier:CellIdentifier] autorelease];\n    }\n\n    //---set the text\
    \ to display for the cell---\n    NSString *cellValue = [listOfMovies objectAtIndex:indexPath.row];\n\
    \    cell.text = cellValue;\n\n    UIImage *image = [UIImage imageNamed:@\"apple.jpeg\"\
    ];\n    cell.imageView.image = image;\n\n    return cell;\n}\n```\n```\n\nPress\
    \ Command-R to test the application and you see that the image is displayed next\
    \ to each row (see Figure 10-7).\n\nNotice that the UITableViewCell object already\
    \ has the imageView property. All you need to do is to create an instance of the\
    \ UIImage class and then load the image from the Resources folder of your project.\n\
    \n# Displaying the Item Selected\n\nSo far, you have seen how to populate the\
    \ Table view with items by ensuring that your View Controller conforms to the\
    \ UITableViewDataSource protocol. This protocol takes care of populating the Table\
    \ view, but if you want to select the items in a Table view, you need to conform\
    \ to another protocol, UITableViewDelegate.\n\n![](img/aab2d775c46f70cd606f2e58e2521324_265_0.png)\n\
    \nFIGURE 10-7"
