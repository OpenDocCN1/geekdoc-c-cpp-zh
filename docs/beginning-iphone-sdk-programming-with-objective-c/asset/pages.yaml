  md: 'Hence, in this chapter, you examine the Table view in more details and understand
    the various building blocks that make it such a versatile view.


    # A SIMPLE TABLE VIEW


    The best way to understand how to use a table view in your application is to create
    a new View-based Application project and then manually add a Table view to the
    view and wire it to a View Controller. That way, you understand the various building
    blocks of the Table view.


    Without further ado, use the following Try It Out to create a new project and
    see how to put a Table view together!


    ![](img/aab2d775c46f70cd606f2e58e2521324_259_0.png)


    FIGURE 10-1


    # TRY IT OUT — Using a Table View


    *Codefile [TableViewExample.zip] available for download at Wrox.com*


    +   1. Create a new View-based Application project and name it TableViewExample.

    +   2. Double-click the TableViewExampleViewController.xib file to edit it in
    Interface Builder.

    +   3. Drag the table View Object from the Library and drop it onto the View window
    (see Figure 10-2).


    ![](img/aab2d775c46f70cd606f2e58e2521324_259_1.png)


    FIGURE 10-2'
