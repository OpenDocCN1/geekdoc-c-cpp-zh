  md: "> NOTE To bind integer values, use the sqlite3_bind_int() function.\n\nAfter\
    \ the preceding call, the SQL string looks like this:\n\n```\nINSERT OR REPLACE\
    \ INTO Contacts ('email', 'name') VALUES\n('user0@learn2develop.net', 'user0')\n\
    ```\n\nTo execute the SQL statement, you use the sqlite3_step() function, followed\
    \ by the sqlite3_finalize() function to delete the prepared SQL statement:\n\n\
    ```\nif (sqlite3_step(statement) != SQLITE_DONE)\n    NSAssert(0, @\"Error updating\
    \ table.\");\n\nsqlite3_finalize(statement);\n```\n\n> NOTE Note that in the previous\
    \ section, you used the sqlite3_exec() function to execute SQL statements. In\
    \ this example, you actually use a combination of sqlite3_prepare(), sqlite3_step(),\
    \ and sqlite3_finalize() functions to do the same thing. In fact, the sqlite3_exec()\
    \ function is actually a wrapper for these three functions. For nonquery SQL statements\
    \ (such as for creating tables, inserting rows, and so on), it is always better\
    \ to use the sqlite3_exec() function.\n\n# Retrieving Records\n\nNow that the\
