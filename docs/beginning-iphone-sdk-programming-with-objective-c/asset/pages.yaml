  md: '> **NOTE** You can toggle the state of a breakpoint by clicking it to disable
    or disable it. Breakpoints displayed in dark blue are enabled; those displayed
    in light blue are disabled.


    After you have set breakpoints in your application, you need to press Command-Y
    to debug your application so that your breakpoints will be stopped when they are
    reached.


    > **NOTE** Pressing Command-R to run the application will not cause the breakpoints
    to be stopped.


    When the application reaches the breakpoint you have set, Xcode displays the current
    line of execution with a red arrow (see Figure B-16).


    ![](img/aab2d775c46f70cd606f2e58e2521324_464_0.png)


    FIGURE B-16


    At this juncture, you can do several things:


    +   - Step Into (Shift-Command-I) — Step into the statements in a function/method.

    +   - Step Over (Shift-Command-O) — Execute all the statements in a function /method
    and continue to the next statement.

    +   - Step Out (Shift-Command-T) — Finish executing all the statements in a function
    or method and continue to the next statement after the function call.

    +   - If you want to resume the execution of your application, press Option-Command-P.

    +   - You can also examine the values of variables and objects by clicking the
    Show Debugger button (see Figure B-17). You can also move your mouse over the
    objects and variables you are interested in to view their values.'
  merge: -1
  img_proc: true
