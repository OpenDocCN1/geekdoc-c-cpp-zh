  md: "![](img/aab2d775c46f70cd606f2e58e2521324_457_0.png)\n\nFIGURE B-5\n\n# Code\
    \ Sense\n\nOne of the most common features of modern IDE is *code completion*,\
    \ which makes the IDE automatically try to complete the statement you are typing\
    \ based on the current context. In Xcode, this code-completion feature is known\
    \ as Code Sense. As an example, when you type the letters UIA in a method, such\
    \ as the `viewDidLoad()` method, Xcode automatically suggests the `UIAlertView`\
    \ class (see Figure B-6; notice that the suggested characters are displayed in\
    \ gray). If you want to accept the suggested word, simply press the Tab or Enter\
    \ key.\n\n```\n// Implement viewDidLoad to\n- (void)viewDidLoad {\n    UIAlertView\n\
    \    [super viewDidLoad];\n}\n```\n\nFIGURE B-6"
  merge: -1
  img_proc: true
- pgno: 458
