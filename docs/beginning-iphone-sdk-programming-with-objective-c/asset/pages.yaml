- pgno: 297
  md: 'Each preference is represented by an item (known as `PreferenceSpecifiers`),
    such as `Item 1`, `Item 2`, `Item 3`, and so on. Each item has a `Type` key, which
    indicates the type of data stored. It can be one of the following, as shown in
    Table 11-1.


    # TABLE 11-1: List of Preference Specifiers and Usage


    | PSTextFieldSpecifier | A text field preference. Displays an optional title and
    an editable text field. Use this type for preferences that require the user to
    specify a custom string value. |

    | PSTitleValueSpecifier | A read-only string preference. Use this type to display
    preference values as formatted strings. |

    | PSToggleSwitchSpecifier | A toggle switch preference. Use this type to configure
    a preference that can have only one of two values. |

    | PSSliderSpecifier | A slider preference. Use this type for a preference that
    represents a range of values. The value for this type is a real number whose minimum
    and maximum you specify. |

    | PSMultiValueSpecifier | A multivalue preference. Use this type for a preference
    that supports a set of mutually exclusive values. |

    | PSGroupSpecifier | A group item preference. The group type is a way for you
    to organize groups of preferences on a single page. |

    | PSChildPaneSpecifier | A child pane preference. Use this type to link to a new
    page of preferences. |


    Each `PreferenceSpecifiers` key contains a list of subkeys that you can use. For
    example, for the `PSTextFieldSpecifier` key, you can use the following keys: `Type`,
    `Title`, `Key`, `DefaultValue`, `IsSecure`, `KeyBoardType`, `AutocapitalizationType`,
    and `AutocorrectionType`. You then set each key with its appropriate values.


    > > **NOTE** For more information of the use of each key, refer to Apple''s "Settings
    Application Schema Reference" documentation. The easiest way to locate it is to
    do a Web search for the title of this document. The URL for this document is:
    `http://developer.apple.com/iPhone/library/documentation/PreferenceSettings/Conceptual/SettingsApplicationSchemaReference/Introduction/Introduction.html`.'
