- pgno: 506
  md: "If you want to implement any of the methods in the UIAlertViewDelegate protocol,\
    \ you need to ensure that your class, in this case the View Controller, conforms\
    \ to this protocol. A class conforms to a protocol using angle brackets (<>),\
    \ like this:\n\n```\n```objc\n@interface UsingViewsViewController : UIViewController\n\
    <UIAlertViewDelegate> { //----this class conforms to the UIAlertViewDelegate\n\
    // protocol---\n}\n```\n```\n\n> NOTE To conform to more than one delegate, separate\
    \ the protocols with commas, such as <UIAlertViewDelegate, UITableViewDataSource>.\n\
    \nAfter the class conforms to a protocol, you can implement the method in your\
    \ class:\n\n```\n```objc\n- (void)alertView:(UIAlertView *)alertView\nclickedButtonAtIndex:(NSInteger)buttonIndex\
    \ {\n    NSLog([[NSString stringWithFormat:@\"%d\", buttonIndex]]);\n}\n```\n\
    ```\n\n# Delegate\n\nIn Objective-C, a delegate is just an object that has been\
    \ assigned by another object as the object responsible for handling events. Consider\
    \ the case of the UIAlertView example that you have seen previously:\n\n```\n\
    ```objc\nUIAlertView *alert = [[UIAlertView alloc]\n    initWithTitle:@\"Hello\"\
    \n    message:@\"This is an alert view\"\n    delegate:self\n    cancelButtonTitle:@\"\
    OK\"\n    otherButtonTitles:nil];\n```\n```\n\nThe initializer of the UIAlertView\
    \ class includes a parameter called the delegate. Setting this parameter to self\
    \ means that the current object is responsible for handling all the events fired\
    \ by this instance of the UIAlertView class. If you don't need to handle events\
    \ fired by this instance, you can simply set it to nil:\n\n```\n```objc\nUIAlertView\
    \ *alert = [[UIAlertView alloc]\n    initWithTitle:@\"Hello\"\n    message:@\"\
    This is an alert view\"\n    delegate:nil\n    cancelButtonTitle:@\"OK\"\n   \
    \ otherButtonTitles:nil];\n```\n```"
  merge: -1
  img_proc: true
- pgno: 507
