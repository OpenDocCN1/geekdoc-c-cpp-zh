- pgno: 183
  md: "![](img/aab2d775c46f70cd606f2e58e2521324_183_0.png)\n\nFIGURE 6-12\n\n# How\
    \ It Works\n\nThis project illustrates how you can reposition the views on your\
    \ application when the device changes orientation. You first create an outlet\
    \ and connect it to the Round Rect Button view on the View window.\n\nWhen the\
    \ device is being rotated, you handle the willAnimateSecondHalfOfRotationFromInterfaceOrientation:\
    \ event because doing so allows you to know the destination orientations that\
    \ the device is changing to. In this method, you can either obtain the destination\
    \ orientation using the fromInterfaceOrientation parameter, or you can obtain\
    \ it via the interfaceOrientation property of the current View (self), like this:\n\
    \n```\nUIInterfaceOrientation destOrientation = self.interfaceOrientation;\n```\n\
    \nUsing this information, you position the view according to the destination orientation\
    \ by altering its frame property:\n\n```\nif (destOrientation == UIInterfaceOrientationPortrait)\n\
    {\n    btn.frame = CGRectMake(20,20,280,37);\n}\nelse\n{\n    btn.frame = CGRectMake(180,243,280,37);\n\
    }\n```\n\n# PROPERTIES FOR DEALING WITH POSITIONING OF VIEWS\n\nIn the previous\
    \ example, you used the frame property to change the position of a view during\
    \ runtime. The frame property defines the rectangle occupied by the view, with\
    \ respect to its superview (the view that contains it). Using the frame property\
    \ allows you to set the positioning and size of a view. Besides using the frame\
    \ property, you can also use the center property, which sets the center of the\
    \ view, also with respect to its superview. You usually use the center property\
    \ when you are performing some animation and just want to change the position\
    \ of a view."
  merge: -1
  img_proc: true
- pgno: 184
  md: "# # PROGRAMMATICALLY ROTATING THE SCREEN\n\nIn the previous section, you saw\
    \ how your application can handle the changes in device orientation when the user\
    \ rotates the device. There are times (such as when you are developing a game),\
    \ however, when you want to force the application to display in certain rotations\
    \ independently of how the orientation the device is held.\n\nThere are two scenarios\
    \ to consider:\n\n+   - rotating the screen orientation during runtime when your\
    \ application is running; or\n+   - displaying the screen in a particular orientation\
    \ when the View is loaded.\n\n# ## Rotating During Runtime\n\nDuring runtime,\
    \ you can programmatically rotate the screen by using the setOrientation: method\
    \ on an instance of the UIDevice class. Using the project created earlier, suppose\
    \ you want the user to change the screen orientation when the user presses the\
    \ Round Rect Button view. You can code it as follows:\n\n```\n```objc\n-(IBAction)\
    \ btnClicked: (id) sender\n{\n    [[UIDevice currentDevice] setOrientation:UIInterfaceOrientationLandscapeLeft];\n\
    }\n```\n```\n\nThe setOrientation: method takes in a single parameter specifying\
    \ the orientation you want to change to.\n\n> > **NOTE** After you have programmatically\
    \ switched the orientation of your application, your application's rotation can\
    \ still be changed when you physically rotate the device. The orientation that\
    \ can be changed to is dependent of what you set in the shouldAutorotateToInterfaceOrientation:\
    \ method.\n\n# ## Displaying the View in a Specific Orientation When Loading\n\
    \nWhen a View is loaded, by default it is always displayed in portrait mode. If\
    \ your application requires that you display the View in a particular orientation\
    \ when it is loaded, you can do so by setting the orientation of the status bar,\
    \ like this:\n\n```\n```objc\n- (void)viewDidLoad {\n    [UIApplication sharedApplication].statusBarOrientation\n\
    \        =UIInterfaceOrientationLandscapeRight;\n    [super viewDidLoad];\n}\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 185
  md: "It’s interesting to note that the `setOrientation:` method described in the\
    \ previous section cannot be used to change the orientation of the View during\
    \ loading time:\n\n```\n```objc\n//—does not work during View loading time—\n\
    [[UIDevice currentDevice] setOrientation:UIInterfaceOrientationLandscapeLeft];\n\
    ```\n```\n\nLikewise, setting the orientation of the status bar does not work\
    \ during runtime (after the View has loaded):\n\n```\n```objc\n//—does not work\
    \ during run time—\n[[UIApplication sharedApplication] setStatusBarOrientation:\n\
    \    UIInterfaceOrientationLandscapeLeft];\n```\n```\n\n> **NOTE** The orientation\
    \ to which you are changing must first of all be specified in the `shouldAutorotateToInterfaceOrientation:`\
    \ event. This can also be specified in the `info.plist` file for the application\
    \ by setting the `InitialInterfaceOrientation` key to the desired orientation.\n\
    \n# SUMMARY\n\nIn this chapter, you have seen how changes in screen orientations\
    \ are handled by the various events in the view controller class. Proper handling\
    \ of screen orientations will make your application more useable and improve the\
    \ user experience.\n\n# EXERCISES\n\n+   1. Suppose you want your application\
    \ to only support the landscape right and landscape left orientation. How should\
    \ you modify your code?\n+   \n+   2. What is the difference between the frame\
    \ and center property of a view?"
  merge: -1
  img_proc: true
