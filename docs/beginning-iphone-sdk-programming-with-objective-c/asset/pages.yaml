    out is to refer to the documentation. Xcode allows you to quickly and easily browse
    the definitions of classes, properties, and methods through the use of the Option
    key. To view the help documentation of an item, simply press the Option key. The
    cursor changes to a cross-hair. Double-click the item you want to check out, and
    the Developer Documentation window appears (see Figure B-19).'
