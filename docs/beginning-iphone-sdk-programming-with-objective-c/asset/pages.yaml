  md: '# CONTROL EVENTS


    The list of events you can use for control objects are:


    +   - UIControlEventTouchDown

    +   - UIControlEventTouchDownRepeat

    +   - UIControlEventTouchDragInside

    +   - UIControlEventTouchDragOutside

    +   - UIControlEventTouchDragEnter

    +   - UIControlEventTouchDragExit

    +   - UIControlEventTouchUpInside

    +   - UIControlEventTouchUpOutside

    +   - UIControlEventTouchCancel

    +   - UIControlEventValueChanged

    +   - UIControlEventEditingDidBegin

    +   - UIControlEventEditingChanged

    +   - UIControlEventEditingDidEnd

    +   - UIControlEventEditingDidEndOnExit

    +   - UIControlEventAllTouchEvents

    +   - UIControlEventAllEditingEvents

    +   - UIControlEventApplicationReserved

    +   - UIControlEventSystemReserved

    +   - UIControlEventAllEvents


    The use of each event is detailed at: http://developer.apple.com/iphone/library/documentation/UIKit/Reference/UIControl_Class/Reference/Reference.html#/apple_ref/doc/constant_group/Control_Events


    # SWITCHING TO ANOTHER VIEW


    So far, you have been learning about single-view applications. However, in real
    life, you often have a number of views, each representing different pieces of
    information. Depending on the selections made by the user, you then switch to
    different views to perform different tasks.


    Hence, in this section you learn how you can switch to another view depending
    on the selection made by the user.'
