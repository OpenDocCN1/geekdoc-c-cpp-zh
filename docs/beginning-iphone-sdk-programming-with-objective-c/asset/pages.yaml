- pgno: 151
  md: "3. Right-click the TextField view in the View window and then click the circle\
    \ next to the Did End on Exit event and drag it to the File's Owner item (see\
    \ Figure 5-10). The doneEditing: outlet you have just created should appear. Select\
    \ it.\n\n![](img/aab2d775c46f70cd606f2e58e2521324_151_0.png)\n\nFIGURE 5-10\n\n\
    4. Save the KeyboardInputsViewController.xib file.\n\n5. Back in Xcode, add the\
    \ following code in the KeyboardInputsViewController.h file:\n\n```\n#import <UIKit/UIKit.h>\n\
    \n@interface KeyboardInputsViewController : UIViewController {\n}\n\n- (IBAction)\
    \ doneEditing:(id) sender;\n\n@end\n```\n\n6. In the KeyboardInputsViewController.m\
    \ file, provide the implementation for the doneEditing: action:\n\n```\n#import\
    \ \"KeyboardInputsViewController.h\"\n\n@implementation KeyboardInputsViewController\n\
