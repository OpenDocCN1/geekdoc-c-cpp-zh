    \ setCenter:touchPoint];\n}\n```\n\n![](img/aab2d775c46f70cd606f2e58e2521324_365_0.png)\n\
    \nIf it does, you simply reposition the image view by calling its setCenter property.\n\
    \nUsing this technique, you can easily write a jigsaw puzzle application in which\
    \ users can rearrange the different pieces of the jigsaw puzzle simply by dragging\
    \ them on the screen.\n\n# SUMMARY\n\nIn this chapter, you have seen the various\
    \ events that you need to handle in order to know whether the user is single-\
    \ or double-tapping your application. You also saw how to detect multiple touches\
    \ on your application and use this knowledge to create some really interesting\
    \ applications.\n\n# EXERCISES\n\n+   1. Name the four events for detecting touches\
    \ in your application.\n+   2. What is the difference between multi-taps and multi-touches?\n\
    +   3. How do you simulate multi-touch on the iPhone Simulator?"
