  md: '# USING THE KEYBOARD


    In iPhone programming, the view that is most commonly associated with the keyboard
    is the TextField view. When a TextField view is tapped (or clicked, if you are
    using the Simulator), the keyboard is automatically displayed. The data that the
    user clicks on the keyboard is then inserted into the TextField view.


    # **TRY IT OUT**  Using a TextField for Inputs


    *Codefile | KeyboardInputs.zip* available for download at Wrox.com


    +   1. Using Xcode, create a new View-based Application project and name it KeyboardInputs.

    +   2. Double-click the KeyboardInputsViewController.xib file to edit it using
    Interface Builder.

    +   3. Populate the View with Label and TextField views (see Figure 5-1).

    +   4. Save the KeyboardInputsViewController.xib file and press Command-R in Xcode
    to run the application on the iPhone Simulator. Figure 5-2 (left) shows that when
    the application is loaded, the keyboard is initially hidden, and when the user
    clicks the TextField view, the keyboard automatically appears (right).


    ![](img/aab2d775c46f70cd606f2e58e2521324_147_0.png)


    ![](img/aab2d775c46f70cd606f2e58e2521324_147_1.png)'
