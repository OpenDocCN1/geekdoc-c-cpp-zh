  md: "Three files are now created for you (see Figure 3-34):\n\n+   - MyViewController.h\n\
    +   - MyViewController.m\n+   - MyViewController.xib\n\n![](img/aab2d775c46f70cd606f2e58e2521324_99_0.png)\n\
    \nFIGURE 3-34\n\nIn the BasicUI2Delegate.h file, create an instance of the View\
    \ Controller that you have just created and expose it as a property so that it\
    \ can be used throughout the entire application:\n\n```\n```objc\n#import <UIKit/UIKit.h>\n\
    \n@class MyViewController;\n\n@interface BasicUI2AppDelegate : NSObject <UIApplicationDelegate>\
    \ {\n    UIWindow *window;\n    MyViewController *myViewController;\n}\n\n@property\
    \ (nonatomic, retain) IBOutlet UIWindow *window;\n@property (nonatomic, retain)\
    \ MyViewController *myViewController;\n\n@end\n```\n```\n\nNote that you use a\
    \ forward declaration (described in Appendix D) to inform the compiler that the\
    \ MyViewController class is defined somewhere in the project:\n\n```\n```objc\n\
    @class MyViewController;\n```\n```\n\nIn the BasicUI2Delegate.m file, add the\
    \ following code so that you create an instance of the MyViewController class\
    \ and then set its view to the current window:"
  merge: -1
