  md: "```\n#import <UIKit/UIKit.h>\n\n@class MyViewController;\n\n@interface WinBasedAppAppDelegate\
    \ : NSObject <UIApplicationDelegate> {\n    UIWindow *window;\n\n    //---create\
    \ an instance of the view controller---\n    MyViewController *myViewController;\n\
    }\n\n@property (nonatomic, retain) IBOutlet UIWindow *window;\n\n//---expose the\
    \ view controller as a property---\n@property (nonatomic, retain) IBOutlet MyViewController\
    \ *myViewController;\n\n@end\n```\n\nIn the WinBasedAppAppDelegate.m file, insert\
    \ the following code lines that appear in bold:\n\n```\n#import \"WinBasedAppAppDelegate.h\"\
    \n\n#import \"MyViewController.h\"\n\n@implementation WinBasedAppAppDelegate\n\
    \n@synthesize window;\n\n//---synthesize the property---\n@synthesize myViewController;\n\
    \n- (void)applicationDidFinishLaunching:(UIApplication *)application {\n    //\
    \ Override point for customization after application launch\n    //---add the\
    \ new view to the current window---\n    [window addSubview:myViewController.view];\n\
    \n    [window makeKeyAndVisible];\n}\n\n- (void)dealloc {\n    [myViewController\
    \ release];\n    [window release];\n    [super dealloc];\n}\n\n@end\n```\n\n13.\
    \ In the MainWindow.xib window, Control-click and drag the Win Based App App Delegate\
    \ item to the My View Controller item (see Figure 7-10). Select myViewController.\
    \ This will associate the window with the View Controller."
