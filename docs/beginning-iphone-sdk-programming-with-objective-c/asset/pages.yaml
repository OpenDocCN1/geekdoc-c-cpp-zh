  img_proc: true
- pgno: 336
  md: "```\n```objc\n//---write something to the file---\n[self writeToFile:@\"a string\
    \ of text\" withFileName:fileName];\n\n//---read it back---\nNSString *fileContent\
    \ = [self readFromFile:fileName];\n\n//---display the content read in the Debugger\
    \ Console window---\nNSLog(fileContent);\n\n[super viewDidLoad];\n}\n```\n```\n\
    \n# Storing Files in the Temporary Folder\n\nIn addition to storing files in the\
    \ Documents directory, you can store temporary files in the tmp folder. Files\
    \ stored in the tmp folder are not backed up by iTunes, so you need to find a\
    \ permanent place for the files you want to be sure to keep. To get the path to\
    \ the tmp folder, you can call the `NSTemporaryDirectory()` function, like this:\n\
    \n```\n```objc\n-(NSString *) tempPath{\n    return NSTemporaryDirectory();\n\
    }\n```\n```\n\nOn a real device, the path returned for the tmp folder would be:\
    \ `/private/var/mobile/Applications/<application_id>/tmp/`.\n\nHowever, on the\
    \ iPhone Simulator, the path returned is actually `/var/folders/<application_id>/tmp-/data.txt`,\
    \ not `~/Library/Application Support/iPhone Simulator/User/Applications/<application_id>/tmp/`.\n\
    \nThe following statement returns the path of a file to be stored in the tmp folder:\n\
    \n```\n```objc\nNSString *fileName = [[self tempPath]\n    stringByAppendingComponent:@\"\
    data.txt\"];\n```\n```\n\n# USING PROPERTY LISTS\n\nIn iPhone programming, you\
    \ can use property lists to store structured data using key/value pairs. Property\
    \ lists are stored as XML files and are highly transportable across file systems\
    \ and networks. For example, you might want to store a list of AppStore applications\
    \ titles in your application. Because applications in the AppStore are organized\
    \ into category, it would be natural to store this information using a property\
    \ list employing the structure shown in Figure 13-3.\n\n| Category | Files |\n\
    |---|---|\n| Games | “Animal Park”, “Biology Quiz”, “Calculus Test” |\n| Entertainment\
    \ | “Eye Balls”, “iBlower”, “iBell”, “iCards Birthday” |\n| Utilities | “Battery\
    \ Monitor”, “SystemInfo” |\n\nFIGURE 13-3"
