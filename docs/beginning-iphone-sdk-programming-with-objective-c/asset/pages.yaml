- pgno: 335
  md: "from the application’s home directory, and the YES argument indicates that\
    \ you want to obtain the full path of all the directories found.\n\nTo obtain\
    \ the path to the Documents folder, simply extract the first item of the paths\
    \ array (because there is one and only one Documents folder in an iPhone application’s\
    \ folder). In fact, this block of code is derived from the Mac OS X API, where\
    \ multiple folders might be returned. But in the case of the iPhone, there can\
    \ only be one Documents folder per application.\n\nYou next define the writeToFile:withFileName:\
    \ method, which creates an NSMutableArray and adds the text to be written to file\
    \ to it.\n\n```\n```objective-c\n//---write content into a specified file path---\n\
    -(void) writeToFile:(NSString *) text withFileName:(NSString *) filePath {\n \
    \   NSMutableArray *array = [[NSMutableArray alloc] init];\n    [array addObject:text];\n\
    \    [array writeToFile:filePath atomically:YES];\n    [array release];\n}\n```\n\
    ```\n\nTo persist the content (a process known as serialization) of the NSMutableArray\
    \ to a file, you use its writeToFile:atomically: method. The atomically: parameter\
    \ indicates that the file should first be written to a temporary file before it\
    \ is renamed to the file name specified. This approach guarantees that the file\
    \ will never be corrupted, even if the system crashes during the writing process.\n\
    \nTo read the content from a file, you define the readFromFile: method:\n\n```\n\
    ```objective-c\n//---read content from a specified file path---\n-(NSString *)\
    \ readFromFile:(NSString *) filePath {\n    //---check if file exists---\n   \
    \ if ([[NSFileManager defaultManager] fileExistsAtPath:filePath])\n    {\n   \
    \     NSArray *array = [[NSArray alloc] initWithContentsOfFile:filePath];\n  \
    \      NSString *data = [[NSString alloc] initWithFormat:@\"%@\",\n          \
    \                [array objectAtIndex:0]];\n        [array release];\n       \
    \ return data;\n    }\n    else\n        return nil;\n}\n```\n```\n\nYou first\
    \ use an instance of the NSFileManager class to check to see whether the specified\
    \ file exists. If it does, you read the content of the file into an NSArray object.\
    \ In this case, because you know that the file contains a single line of text,\
    \ you extract the first element in the array.\n\nWith all the methods in place,\
    \ you are ready to make use of them. When the view is loaded, you first create\
    \ the pathname for a file that you want to save. You then write a string of text\
    \ into the file and immediately read it back and print it in the Debugger Console\
    \ window:\n\n```\n```objective-c\n- (void)viewDidLoad {\n    //--- filename ---\n\
    \    NSString *fileName = [[self documentsPath]\n                          stringByAppendingPathComponent:@\"\
    data.txt\"];\n```\n```"
