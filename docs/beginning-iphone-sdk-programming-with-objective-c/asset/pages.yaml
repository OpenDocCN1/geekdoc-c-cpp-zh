- pgno: 42
  md: '# ## Instruments


    The Instruments (see Figure 1-12) application allows you to dynamically trace
    and profile the performance of your Mac OS X and iPhone applications.


    ![](img/aab2d775c46f70cd606f2e58e2521324_42_0.png)


    *Figure 1-12*


    Using Instruments, you can:


    +   - Stress test your applications

    +   - Trace your applications for memory leaks

    +   - Gain a deep understanding of the executing behavior of your applications

    +   - Track difficult-to-reproduce problems in your applications'
  merge: -1
  img_proc: true
- pgno: 43
  md: '> **NOTE** Covering the Instruments application is beyond the scope of this
    book. For more information, refer to Apple''s documentation.


    # ARCHITECTURE OF THE IPHONE OS


    Although this book doesn''t explore the innards of the iPhone OS, understanding
    some of the important points of the iPhone OS is useful. Figure 1-13 shows the
    different abstraction layers that make up the Mac OS X and the iPhone OS.


    ![](img/aab2d775c46f70cd606f2e58e2521324_43_0.png)


    FIGURE 1-13


    > **NOTE** The iPhone OS is architecturally very similar to the Mac OS X except
    that the topmost layer is the Cocoa Touch for iPhone instead of the Cocoa Framework.


    The bottom layer is the Core OS, which is the foundation of the operating system.
    It is in charge of memory management, the file system, networking, and other OS
    tasks, and it interacts directly with the hardware. The Core OS layer consists
    of components such as:


    +   - OS X Kernel

    +   - Mach 3.0

    +   - BSD

    +   - Sockets

    +   - Security

    +   - Power Management

    +   - Keychain

    +   - Certificates

    +   - File System

    +   - Bonjour'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'The Core Services layer provides fundamental access to iPhone OS services.
    It provides an abstraction over the services provided in the Core OS layer. The
    Core Services layer consists of the following components:


    +   - Collections

    +   - Address Book

    +   - Networking

    +   - File Access

    +   - SQLite

    +   - Core Location

    +   - Net Services

    +   - Threading

    +   - Preferences

    +   - URL Utilities


    The Media layer provides multimedia services that you can use in your iPhone applications.
    The Media layer consists of the following components:


    +   - Core Audio

    +   - OpenGL

    +   - Audio Mixing

    +   - Audio Recording

    +   - Video Playback

    +   - JPG, PNG, TIFF

    +   - PDF

    +   - Quartz

    +   - Core Animation

    +   - OpenGL ES


    The Cocoa Touch layer provides an abstraction layer to expose the various libraries
    for programming the iPhone and iPod Touch, such as:


    +   - Multi-Touch events

    +   - Multi-Touch controls

    +   - Accelerometer

    +   - View Hierarchy

    +   - Localization'
  merge: -1
  img_proc: true
