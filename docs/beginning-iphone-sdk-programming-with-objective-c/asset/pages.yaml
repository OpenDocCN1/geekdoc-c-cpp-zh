  md: 'NOTE The current keyboard in the iPhone takes up 216 pixels in height.


    Before you learn how to relocate the views on a screen when the keyboard appears,
    it is important for you to understand a few key concepts related to the keyboard:


    +   - You need to be able to programmatically know when a keyboard is visible
    or hidden. To do so, your application needs to register for the following notifications
    — UIKeyboardWillShowNotification and UIKeyboardWillHideNotification.

    +   - You also need to know when and which TextField view is currently being edited
    so that you can relocate it to a visible portion of the screen. You can know these
    two pieces of information through the two delegate protocols — textFieldDidBeginEditing:
    and textFieldDidEndEditing: — available in the UITextFieldDelegate delegate.


    Confused? Worry not; the following Try It Out makes it all clear.


