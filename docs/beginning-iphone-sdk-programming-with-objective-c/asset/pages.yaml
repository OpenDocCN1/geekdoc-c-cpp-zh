  md: '# Views Repositioning


    In the previous section, you saw that as the orientation changes, the size and
    positioning of the views remain. In the real world, this scenario is not desirable
    because it doesn''t give the user a good experience while using your application.
    Ideally, you should reposition your views on the screen so that they change with
    the view orientation.


    To reposition your views, go to the Interface Builder, select the Label view,
    and choose Tools ▸ Size Inspector. Modify the Autosizing attribute of the view
    as shown in Figure 2-16 (observe carefully the various anchors that are set in
    the Autosizing section). This will cause the Label view to expand/contract as
    the view orientation changes. At the same time, the view will anchor to the left,
    top, and right of the screen.


    ![](img/aab2d775c46f70cd606f2e58e2521324_62_0.png)


    FIGURE 2-16


    Likewise, modify the Autosizing attribute of the Text Field view as shown in Figure
    2-17. Note the different pixel sizes.'
