  md: '# Animating the Transitions


    In the previous section, you saw how to transition from one view to another. The
    transitioning happens very quickly and is not exciting visually. To live up to
    the high expectations expected by iPhone users, you need to add some animations
    to the transition. Fortunately, doing so is very easy using the APIs provided
    in the SDK, as the following Try It Out demonstrates.


    # TRY IT OUT Displaying Animations During the Transitioning


    1. In the VCExampleViewController.m, add the following lines of code that appear
    in bold:


    ```

    -(IBAction) displayView:(id) sender{

    secondViewController = [[SecondViewController alloc]

    initWithNibName:@"SecondView" bundle:nil];


    [UIView beginAnimations:@"flipping view" context:nil];

    [UIView setAnimationDuration:1];

    [UIView setAnimationCurve:UIViewAnimationCurveEaseInOut];

    [UIView setAnimationTransition: UIViewAnimationTransitionCurlDown

    forView:self.view cache:YES];


    [self.view addSubview:secondViewController.view];


    [UIView commitAnimations];

    }

    ```


    2. Press Command-R to test the application. Observe what happens when the Display
    SecondView button is clicked (see Figure 4-30).


    3. Back in Xcode, add the following lines that appear in bold to the SecondViewController.m
    file:


    ```

    -(IBAction) btnReturn:(id) sender {

    [UIView beginAnimations:@"flipping view" context:nil];

    [UIView setAnimationDuration:1];

    [UIView setAnimationCurve:UIViewAnimationCurveEaseIn];

    [UIView setAnimationTransition:

    UIViewAnimationTransitionCurlUp

    forView:self.view.superview cache:YES];


    [self.view removeFromSuperview];


    [UIView commitAnimations];

    }

    ```


    ![](img/aab2d775c46f70cd606f2e58e2521324_138_0.png)'
