- pgno: 94
  md: "The NSMutableString class represents a mutable string (that is, its content\
    \ can be changed after it has been initialized). In contrast, the NSString class\
    \ represents an immutable string (that is, its content cannot be changed after\
    \ it has been initialized).\n\n# Connecting the Outlets and Actions\n\nIn Interface\
    \ Builder, connect the five Round Rect buttons to the pinBtnClicked: action. This\
    \ means that one single action will handle the five buttons' TouchUp Inside event.\
    \ In addition, connect the Clear PIN button to the clearPinBtnClicked: action.\
    \ The connections for the File’s Owner item should now look like those shown in\
    \ Figure 3-28.\n\n![](img/aab2d775c46f70cd606f2e58e2521324_94_0.png)\n\nFIGURE\
    \ 3-28\n\n# Implementing the Actions\n\nIn the BasicUIViewController.m file, provide\
    \ the following implementations:\n\n```\n```objc\n#import \"BasicUIViewController.h\"\
    \n\n@implementation BasicUIViewController\n\n@synthesize nameTextField;\n\n- (IBAction)clearPinBtnClicked:(id)sender\
    \ {\n    //--clears the secret pin--\n    [secretPin setString:@\"\"];\n}\n```\n\
    ```"
