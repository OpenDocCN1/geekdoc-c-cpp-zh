    \ file:\n\n```\n```objc\n@protocol FlipsideViewControllerDelegate;\n\n@interface\
    \ FlipsideViewController : UIViewController {\n    id <FlipsideViewControllerDelegate>\
    \ delegate;\n}\n@property (nonatomic, assign) id <FlipsideViewControllerDelegate>\
    \ delegate;\n\n- (IBAction)done;\n\n@end\n\n@protocol FlipsideViewControllerDelegate\n\
    - (void)flipsideViewControllerDidFinish:(FlipsideViewController *)controller;\n\
    @end\n```\n```\n\nNotice that in this controller, the code defines a protocol\
    \ called the FlipsideViewControllerDelegate, which contains a single method called\
    \ flipsideViewControllerDidFinish:. Using this protocol, the FlipsideViewController\
    \ then exposes a property called delegate of type FlipsideViewControllerDelegate.\
    \ The actual implementation of the flipsideViewControllerDidFinish:"
