    \n    UIAlertView *alert = [[UIAlertView alloc] initWithTitle:@\"Hello\"\n   \
    \                      message:@\"This is an alert view\"\n                  \
    \       delegate:self\n                         cancelButtonTitle:@\"OK\"\n  \
    \                       otherButtonTitles:nil];\n    [alert show];\n    [alert\
    \ release];\n    [super viewDidLoad];\n}\n```\n```"
