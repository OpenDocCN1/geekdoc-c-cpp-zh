    \ the list can take a long time. A very useful feature of the Table view is its\
    \ ability to display an index on the right side of the view. An example is the\
    \ A–Z index list available in your Contacts list (see Figure 10-19).\n\nTo add\
    \ an index list to your Table view, you just need to implement the sectionIndexTitlesForTableView:\
    \ method and return the array containing the section headers, which is the years\
    \ array in this case:\n\n```\n- (NSArray *)sectionIndexTitlesForTableView:(UITableView\
    \ *)tableView {\n    return years;\n}\n```\n\n![](img/aab2d775c46f70cd606f2e58e2521324_277_0.png)\n\
