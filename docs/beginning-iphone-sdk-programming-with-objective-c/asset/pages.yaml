    \                         delegate:self\n                         cancelButtonTitle:@\"\
    OK\"\n                         destructiveButtonTitle:@\"Delete Message\"\n  \
    \                       otherButtonTitles:@\"Option 1\", @\"Option 2\", nil];\n\
    [action showInView:self.view];\n```\n```\n\nNote that the button as specified\
    \ in the `destructiveButtonTitle` parameter is displayed in red."
