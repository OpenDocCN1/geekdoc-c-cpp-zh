- pgno: 474
  md: '# INSPECTOR WINDOW


    To customize the various attributes and properties of views, Interface Builder
    provides what it calls the Inspector window. The Inspector window is divided into
    four panes:


    +   - Attributes Inspector

    +   - Connection Inspector

    +   - Size Inspector

    +   - Identity Inspector


    You can invoke the Inspector window by choosing Tools ⇧ Library.


    The following sections discuss each of the Inspector panes in more details.


    # Attributes Inspector pane


    The Attributes Inspector window (see Figure C-6) is where you configure the attributes
    of views in Interface Builder. The content of the Attributes Inspector window
    is dynamic and will change depending on what is selected in the View window.


    You invoke the Attributes Inspector window by choosing Tools ⇧ Attributes Inspector.


    ![](img/aab2d775c46f70cd606f2e58e2521324_474_0.png)


    # Connections Inspector window


    The Connections Inspector window (see Figure C-7) is where you connect the outlets
    and actions to your View Controller in Interface Builder. The content of the Connections
    Inspector window is dynamic and will change depending on what is selected in the
    View window.


    You invoke the Connections Inspector window by choosing Tools ⇧ Connections Inspector.


    ![](img/aab2d775c46f70cd606f2e58e2521324_474_1.png)'
  merge: -1
  img_proc: true
- pgno: 475
  md: '# Size Inspector window


    The Size Inspector window (see Figure C-8) is where you configure the size and
    positioning of views in Interface Builder.


    The Size Inspector window can be invoked by choosing Tools ⇆ Size Inspector.


    # Identity Inspector window


    The Size Inspector window (see Figure C-9) is where you configure the outlets
    and actions of your view controller. You add actions and outlets by clicking the
    plus sign (+) button and remove them using the minus sign button(-). The last
    section in this appendix discusses in more detail how to create outlets and actions
    in Interface Builder.


    ![](img/aab2d775c46f70cd606f2e58e2521324_475_0.png)


    ![](img/aab2d775c46f70cd606f2e58e2521324_475_1.png)


    You invoke the Identity Inspector window by choosing Tools ⇆ Identity Inspector.


    # LIBRARY


    The Library (Tools ⇆ Library) contains a set of views that you can use for building
    the user interface of your iPhone applications.


    Figure C-10 shows the Library with its partial set of views shown.


    ![](img/aab2d775c46f70cd606f2e58e2521324_475_2.png)'
  merge: -1
  img_proc: true
- pgno: 476
  md: 'You can configure the Library to display its views in different modes (see
    also Figure C-11):


    +   - Icons

    +   - Icons and Labels (which is the mode shown in Figure C-10)

    +   - Icons and Descriptions


    Figure C-12 shows the Library displayed in the Icons and Descriptions mode.


    ![](img/aab2d775c46f70cd606f2e58e2521324_476_0.png)


    FIGURE C-11


    ![](img/aab2d775c46f70cd606f2e58e2521324_476_1.png)


    FIGURE C-12


    # OUTLETS AND ACTIONS


    Outlets and actions are fundamental mechanisms in iPhone programming through which
    your code can connect to the views in your user interface (UI). When you use outlets,
    your code can programmatically reference the views on your UI, with actions serving
    as event handlers that handle the various events fired by the various views.


    Although you can write code to connect actions and outlets, Interface Builder
    simplifies the process by allowing you to connect outlets and actions using the
    drag-and-drop technique.


    # Creating Outlets and Actions


    To create an action, you can click the plus sign (+) button that appears in the
    Class Actions section of the Identity Inspector window (see left side of Figure
    C-13). Remember to include the colon (:) character at the end of the action name.
    This character allows the action to have an input parameter of type id, like this:


    ```

    - (IBAction) myAction:(id) sender;

    ```'
  merge: -1
  img_proc: true
