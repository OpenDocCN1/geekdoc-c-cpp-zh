    nEND;


    +   * all character values, which are enclosed in quotation marks.

    DO index-variable=''MON'',''TUE'',''WED'',''THR'',''FRI'';

    ...more SAS statements...

    nEND;


    +   * all variable names. The index variable takes the values of the specified
    variables.

    DO index-variable=win,place,show;

    ...more SAS statements...

    nEND;


    Variable names must represent either numeric or all character values. Do not enclose

    variable names in quotation marks.'
