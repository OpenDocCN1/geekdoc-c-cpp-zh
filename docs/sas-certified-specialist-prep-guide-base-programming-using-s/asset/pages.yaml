    # Providing an Alternative Action


    Suppose you want to assign a value to TestLength based on the other possible values
    of TotalTime. One way to do this is to add IF-THEN statements for the other two
    conditions:


    ```

    if totaltime>800 then TestLength=''Long'';

    if 750<=totaltime<=800 then TestLength=''Normal'';

    if totaltime<750 then TestLength=''Short'';

    ```


    However, when the DATA step executes, each IF statement is evaluated in order,
    even if the first condition is true. This wastes system resources and slows the
    processing of your program.


    Instead of using a series of IF-THEN statements, you can use the ELSE statement
    to specify an alternative action to be performed when the condition in an IF-THEN
    statement is false. As shown below, you can write IF-THEN/ELSE statements to specify
    a series of mutually exclusive conditions.


    ```

    if totaltime>800 then TestLength=''Long'';

    else 750<=totaltime<=800 then TestLength=''Normal'';

    else totaltime<750 then TestLength=''Short'';

    ```


    The ELSE statement must immediately follow the IF-THEN statement in your program.
    An ELSE statement executes only if the previous IF-THEN/ELSE statement is false.


    Syntax, ELSE statement:

    ELSE statement;


    To assign a value to TestLength when the condition in your IF-THEN statement is
    false, you can add the ELSE statement to your DATA step:


    ```

    data work.stresstest;

    set cert.tests;

    TotalTime=(timmin*60)+timesec;

    retain SumSec 5400;

    sumsec+=totaltime;

    length TestLength $6;

    if totaltime>800 then TestLength=''Long'';

    else 750<=totaltime<=800 then TestLength=''Normal'';

    else totaltime<750 then TestLength=''Short'';


    run;

    proc print data=work.stresstest;

    run;

    ```


    For greater efficiency, construct your IF-THEN/ELSE statements with conditions
    of decreasing probability.'
