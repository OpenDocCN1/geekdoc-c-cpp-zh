    # Match-Merge Processing


    # The Basics of Match-Merge Processing


    The match-merging examples in this book are straightforward. However, match-merging
    can be more complex, depending on your data and the output data set that you want
    to create. To predict the results of match-merges correctly, you need to understand
    how the DATA step performs match-merges.


    When you run a DATA step, it is processed in two phases:


    +   * the compilation phase, in which SAS checks the syntax of the SAS statements
    and compiles them (into machine code). During this phase, SAS also sets up descriptor
    information for the output data set and creates the PDV.


    +   * the execution phase in which the DATA step reads data and executes any subsequent
    programming statements. When the DATA step executes, data values are read into
    the appropriate variables in the PDV. From here, the variables are written to
    the output data set as a single observation.


    # The Compilation Phase: Setting Up a New Data Set


    To prepare merge data sets, SAS does the following:


    +   * reads the descriptor portions of the data sets that are listed in the MERGE
    statement


    +   * reads the rest of the DATA step program


    +   * creates the PDV for the merged data set


    +   * assigns a tracking pointer to each data set that is listed in the MERGE
    statement'
