    # Transposing Variables into Observations


    # The TRANSPOSE Procedure


    # The Basics of PROC TRANSPOSE


    The TRANSPOSE procedure creates an output data set by restructuring the values
    in a SAS data set, selecting variables into observations. By using PROC TRANSPOSE,
    you can avoid writing a lengthy DATA step to achieve the same result. The output
    data set can be used in subsequent DATA or PROC steps for analysis, reporting,
    or further data manipulation.


    PROC TRANSPOSE does not produce output. To print the output data set from PROC
    TRANSPOSE step, use PROC PRINT.


    # PROC TRANSPOSE Syntax


    To create a transposed variable, the procedure transposes the values of an observation
    in the input data set into variables in the output data set.


    ```

    Syntax, PROC TRANSPOSE statement:

    PROC TRANSPOSE<DATA=input-data-set><OUT=output-data-set><PREFIX=prefix>;

    BY <DESCENDING>; variable-l

    <NOTSORTED>;

    ID variable(s);

    VAR variable(s);

    ```


    +   - input-data names the SAS data set. If output-data does not exist, then PROC
    TRANSPOSE creates it by using the DATA name convention. The default is DATA.

    - prefix is a prefix to use in constructing names for transposed variables in
    the output data set. For example, if PREFIX=VAR, the names of the variables are
    VAR1, VAR2..., VARs. The default variable name is COL.


    Note: When you use PREFIX with an ID statement, the variable name begins with
    the prefix followed by the ID value.


    Tip: You can use name literals (n-literals) for the value of PREFIX. Name literals
    are helpful when specifying typographical or foreign characters, especially when

    VALIDNAME=ANY. To recall how VALIDNAME=ANY interacts with name literals, see “VALIDNAME=System
    Option” on page 14.'
