    # The FORMAT Procedure


    # Definitions


    +   * SAS format

    determines how variable values are printed according to the data type: numeric,
    character, date, time, or timestamp.

    * SAS informat

    determines how data values are read and stored according to the data type: numeric,
    character, date, time, or timestamp.


    # A word about PROC FORMAT


    SAS provides you with formats and formats that you can use to read and write your
    data. However, if the SAS formats or informats do not meet your needs, you can
    use the FORMAT procedure to define your own formats and formats. PROC FORMAT stores
    user-defined formats and informats as entries in a SAS catalog.

    The following output of Work.Carsurvey has a value of 1 or 2 for Sex, and values
    of B, G, W, and Y for Color. SAS does not provide formats to make the values for
    Sex and Color easier to read. You can create your own formats to make the values
    for Sex and Color easier to read. You can also apply a format to the values of
    Income.


