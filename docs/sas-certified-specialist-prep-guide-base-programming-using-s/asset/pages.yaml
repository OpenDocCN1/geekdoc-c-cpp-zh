    # Semantic Error: Invalid Option


    An invalid option error occurs when you specify an option that is not valid in
    a particular statement. In the program below, the KEYLABEL option is not valid
    when it is used with the PROC PRINT statement.


    ```

    data work.admitfee;

    set cert.admit;

    where weight=180 and (actlevel=''MOD'' or actlevel=''LOW'');

    run;

    proc print data=cert.admit keylabel;

    labellevel=''Activity Level'';

    run;

    ```


    When a SAS statement contains an invalid option is submitted, a message appears
    in the log indicating that the option is not valid or not recognized.


