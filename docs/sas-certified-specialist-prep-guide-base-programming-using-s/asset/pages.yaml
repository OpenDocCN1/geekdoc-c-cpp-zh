    # Categorizing Values


    Suppose you want to create a variable that categorizes the length of time a subject
    spends on the treadmill under a stress test. This new variable, TestLength, is
    based on the value of the existing variable TotalTime. The value of TestLength
    is assigned conditionally:


    | Value for TotalTime | Resulting Value for TestLength |

    | greater than 800 | Long |

    | 750 - 800 | Normal |

    | less than 750 | Short |


    To perform an action conditionally, use an IF-THEN statement. The IF-THEN statement
    executes a SAS statement when the condition in the IF clause is true.


    Syntax, IF-THEN statement:

    expression THEN statement;


    +   * expression is any valid SAS expression.

    * statement is any executable SAS statement.


    # Example: IF-THEN Statement


    To assign the value Long to the variable TestLength when the value of TotalTime
    is greater than 800, add the following IF-THEN statement to your DATA step:


    ```

    data work.stresstest;

    set cert.tests;

    TotalTime=(timin*60)+timesec;

    retain SumSec 5400;

    sumsec+totaltime;

    if totaltime>800 then TestLength=''Long'';

    run;

    ```


    SAS executes the assignment statement only when the condition (TotalTime>800)
    is true. If the condition is false, the value of TestLength is missing.'
