  md: '# 210 Chapter 11 Processing Data with DO Loops


    Syntax, DO statement, iterative:

    DO index-variable=specification-1 <, ...specification-n>;

    ...more SAS statements...

    END;


    +   - index-variable names variable whose value governs execution of the DO group.


    > CAUTION:

    Avoid changing the index variable within the DO group. If you modify the index
    variable within the iterative DO group, you might cause infinite looping.


    Note: Unless you drop it, the index-variable is included in the data set that
    is being created.


    +   - specification denotes an expression or series of expressions such as these:

    start <TO top> -BY increment> <WHILE(expression) UNTIL(expression)>


    The DO group is executed with first index-variable to start. The value of start
    is evaluated before the first execution of the loop.


    +   - start specifies the initial value of the index variable.

    - TO stop specifying the end value of the index variable.


    > TIP Any changes to made within the DO group do not affect the number of iterations.
    To stop iteration of a loop before it finishes execution, change the value of
    index-variable, or use a LEAVE statement to go to a statement outside the loop.


    +   - BY increment specifies a positive or negative number (or an expression that
    yields a number) to controlling the increment of index-variable.

    - The value of increment is evaluated before execution of the loop. If no increment
    is specified, the index variable is increased by 1. When increment is specified,
    start must be the lower bound, and stop, if present, must be the upper bound for
    the loop. If increment is negative, start must be the upper bound, and stop, if
    present, must be the lower bound for the loop.

    - WHILE(expression) UNTIL(expression) evaluates, either before or after execution
    of the DO group, any SAS expression that you specify. Enclose the expression in
    parentheses.

    - A expression is evaluated before each execution of the loop, so that the statements
    inside the group are executed repeatedly while the expression is true. UNTIL,
    expression is evaluated after each execution of the loop, so that the statements
    inside the group are executed repeatedly until the expression is true.


    Note: The order of the optional TO and BY clauses can be reversed.


    Note: When you use more than one specification, each one is evaluated before its
    execution.


    Example: Processing Iterative DO Loops

    DO loops process a group of statements repeatedly rather than once. This can greatly
    reduce the number of statements required for a repetitive calculation. For example,
    this 12 sum statements compute a company''s annual earnings from investments.
    Notice that all 12 statements are identical.


    ```

    data work.earn (drop=month);

    set cert.master;

    ```'
