  md: '# Scenario 1


    # Code Solution


    The solution listed below is one example of a program that could be used to accomplish
    each task within each scenario. Your code can be different, so long as it results
    in the same answers.


    ```

    proc sort data=cert.patients out=work.patients; /* 81 */

    by id;

    run;

    proc sort data=cert.measure out=work.measure;

    by id;

    run;

    data work.merge; /* 82 */

    merge work.patients work.measure; /* 83 */

    by id;

    if age<50; /* 84 */

    run;

    proc sort data=work.merge out=work.sortpatients; /* 85 */

    by descending Age;

    run;

    proc print data=work.sortpatients; /* 86 */

    run;

    ```


    +   1. Sort Cert.Patients and Cert.Measure by ID. You specify the DATA= option
    to specify the data set to sort. The OUT= specifies an output data set. The required
    BY statement specifies the variable or variables to use in sorting the data.

    2. THE DATA step creates a new temporary data set named Work.Merge.

    3. THE MERGE statement combines observations from Work.Patients and Work.Merge
    into a single observation in a new data set, Work.Merge, according to the values
    of a common variable.

    4. THE BY statement identifies what the MERGE statement uses to combine observations.
    During matching-merging, SAS sequentially checks each observation of each data
    set to see whether the BY values match and then writes the combined observation
    to the new data set.

    5. IF statement specifies that only patients under the age of 50 are read into
    Work.Merge.

    6. Sort Work.Merge by Age in descending order. You specify the DATA= option to
    specify the data set to sort. The OUT= specifies an output data set. The required
    BY statement specifies the variable or variables to use in sorting the data. The
    DESCENDING option precedes the variable name.

    7. THE PROC PRINT enables you to view the contents of the sorted data set, Work.SortPatients.'
