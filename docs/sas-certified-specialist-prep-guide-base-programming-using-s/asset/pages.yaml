    # ## Using SAS Macro Variables


    # %%%LET Statement


    The SAS macro language enables you to design dynamic programs that can easily
    update or modify.


    A macro variable can be defined to represent a string of text that appears in
    your program. For example, if you reference a specific value in multiple places
    in a program, you can substitute a macro variable in its place. If you want to
    update the value of the variable, you need to update the macro definition only
    once, rather than searching through your code to find the value in multiple places.
    It is common to place macro variable assignments at the top of SAS programs.


    Use the %LET statement to create a macro variable and assign it a value.


    Syntax, %LET statement:


    ```

    %%%LET macro-variable=<value>;

    ```


    +   - macro-variable is the name of a macro variable or a text expression that
    produces a macro variable name. The name can refer to a new or existing macro
    variable.


    +   - value is a character string or a text expression. Omitting value produces
    a null value (0 characters). Leading and trailing blanks in value are ignored.'
