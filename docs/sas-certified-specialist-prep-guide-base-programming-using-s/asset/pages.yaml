    # How SAS Determines FIRST.variable and LAST.variable


    +   - When an observation is the first in a BY group, SAS sets the value of

    FIRST.variable to 1. This happens when the value of the variable changed is the

    previous observation.

    - For all other observations in the BY group, the value of FIRST.variable is 0.

    - When an observation is the last in a BY group, SAS sets the value of LAST.variable

    to 1. This happens when the value of the variable changes in the next observation.

    - For all other observations in the BY group, the value of LAST.variable is 0.

    - For the last observation in a data set, the value of all LAST.variable variables
    are

    to 1.


