  md: 'Reading Microsoft Excel Data with the XLSX Engine 51


    # Referencing an Excel Workbook in a DATA Step


    # SET Statement


    Use the SET statement to indicate which worksheet in the Excel file you want to
    read.


    ```

    data work.stress;

    set certxl.ActivityLevels;

    run;

    ```


    In this example, the DATA statement tells SAS to name the new data set, Stress,
    and store it in the temporary library Work. The SET statement specifies the libref
    (reference to the Excel file) and the worksheet name as the input data.


    You can use several statements in the DATA step to subset your data as needed.
    Here, the WHERE statement is used with a variable to include only participants
    whose activity is HIGH.


    ```

    data work.stress;

    set certxl.ActivityLevels;

    where ActLevel=''HIGH'';

    ;

    ```


