  md: '# Transposing Variables into Observations


    # PROC TRANSPOSE


    # Output Data Set Variables


    The TRANSPOSE procedure always produces an output data set, regardless of whether
    you specify the OUT= option in PROC TRANSPOSE statement.


    The output data set contains the following variables:


    +   * a variable resulting from transposing the values of each variable into an
    observation.

    * a variable whose values identify the source of the values in each observation
    in the output data set. This variable is a character variable whose values are
    the names of the variables that are transposed from the input data set. By default,
    PROC TRANSPOSE names this variable NAME. To override the default name, use the
    NAME= option. The label for the _NAME_ variable is NAME OF FORMER VARIABLE.

    * a character whose values are the variable labels of the variables that are being
    transposed (if any of the variables that the procedure is transposing have labels).
    Specify the name of the variable using the LABEL= option. The default is _LABEL.

    * variables that PROC TRANSPOSE copies from the input data set when you use either
    the BY or COPY statement. These variables have the same names and values as they
    are in the input data set. These variables also have the same attributes (for
    example: type, length, label, informat, and format).


    > Note: If the LABEL= option or the NAME= option is the same as a variable that
    appears in a BY or COPY statement, the output data set does not contain a variable
    whose values are the names or labels of the transposed variables. See 9.7 on page
    160 for a sample transposed data set.


    # Attributes of Transposed Variables


    Transposed variables contain the following attributes:


    +   * All transposed variables are the same type and length.

    * If all variables that the procedure is transposing are numeric, then the transposed
    variables are numeric. Thus, if the numeric variable has a character string as
    a formatted value, then its unformatted variable is transposed.

    * If any variable that the procedure is transposing is character, then all transposed
    variables are character. If you are transposing a numeric variable that has a
    character string as a formatted value, then the formatted value is transposed.

    * The length of the transposed variables is equal to the length of the longest
    variable that is being transposed.


