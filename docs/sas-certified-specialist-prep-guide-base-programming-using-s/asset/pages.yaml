    # Concatenation Operator


    The concatenation operator concatenates character values. The operator can be
    expressed as || (two vertical bars)


    ```

    FullName = First || Middle || Last;

    ```


    The length of the resulting variable is the sum of the lengths of each variable
    or constant in the concatenation operator. You can use a LENGTH statement to specify
    a different length for the new variable.


    The concatenation operator does not trim leading or trailing blanks. If variables
    are padded with trailing blanks, use the TRIM function to trim trailing blanks
    from values before concatenating them.


    # TRIM Function


    # Overview of the TRIM Function


    The TRIM function removes trailing blanks from character expressions and returns
    one blank if the expression contains missing values.


    ```

    FullName = trim(First) || trim(Middle) || Last;

    ```


    The TRIM function is useful for concatenating the concatenation operator does
    not remove trailing blanks.


    If the TRIM function returns a value to a variable that was not yet assigned a
    length, default, the variable is determined by the length of the argument.


    ```

    Syntax, TRIM function:

    TRIM(argument)

    ```


    argument can be any character expression. Here are examples:


    +   * a character variable: trim(address)

    * another character function: trim(left(id))


    # Example: TRIM Function


    ```

    data work.nametrim;

    length Name = 20 First Middle Last $ 10;

    Name=''Jones, Mary Ann, Sue'';

    First = left(scan(Name, 2, '' ''));

    Middle = left(scan(Name, 3, '' ''));

    ```'
