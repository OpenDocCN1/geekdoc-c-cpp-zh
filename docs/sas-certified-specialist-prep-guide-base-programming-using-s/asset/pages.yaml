    # Specifying Variables USING the TABLES Statement


    By default, the FREQ procedure creates frequency tables for every variable in
    a data set. But this is not all you want. A variable that has continuous numeric
    values (such as DateTime) can result in a lengthy and meaningless table. Likewise,
    a variable that has a unique value for each observation (such as FullName) is
    unsuitable for PROC FREQ procedure. Frequency distributions work best with variables
    whose values are categorical, and whose values are better summarized by counts
    rather than averages.


    To specify the variables to be processed by the FREQ procedure, include a TABLES
    statement.


    Syntax, TABLES statement:


    TABLES variable(s);

    variable(s) lists the variables to include.


    # Example: Creating a One-Way Table for One Variable


    The TABLES statement tells SAS the specific tables that you want to create. The
    following example creates only one frequency table for the variable Sex as specified
    in the TABLES statement. The other variables are suppressed.


    ```

    proc freq data=cert.diabetes;

    tables sex;

    run;

    ```


    Output 15.10 One-Way Table for the Variable Sex


    | Sex | Frequency | Percent | Cumulative Frequency | Cumulative Percent |

    |---|---|---|---|--|

    | F | 11 | 55.00 | 11 | 55.00 |

    | M | 9 | 45.00 | 20 | 100.00 |'
  merge: -1
