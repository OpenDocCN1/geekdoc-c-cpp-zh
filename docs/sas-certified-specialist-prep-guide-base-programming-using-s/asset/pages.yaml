    # Automatic Numeric-to-Character Conversion


    The automatic conversion of numeric data to character data is very similar to
    character-to-numeric conversion. Numeric values are converted to character values
    whenever they are used in a character context.


    For example, the numeric values of the variable Site are converted to character
    values if you do the following:


    +   * assign the numeric value to a previously defined character variable, such
    as the character variable SiteCode:SiteCode=site;

    * use the numeric value that requires a character value, such as the concatenation
    operator: SiteCode=site|dept;

    * specify the numeric value in a function that requires character arguments, such
    as the SUBSTR function(site,1,4);


    Specifically, SAS writes the numeric value with the BEST12, and the resulting
    character value is right-aligned. This conversion occurs before the value is assigned
    or used with any operator or function. However, automatic numeric-to-character
    conversion can cause unexpected results. For example, suppose the original numeric
    value has fewer than 12 digits. The resulting character has leading blanks, which
    might cause problems when you perform an operation or function.


    Automatic numeric-to-character conversion also causes a message to be written
    to the SAS log indicating that the conversion has occurred.


    # Explicit Numeric-to-Character Conversion


    Use the PUT function to explicitly convert numeric data values to character data
    values.


    Suppose you want to create a new character variable named Assignment that concatenates
    the values of the numeric variable Site and the character variable Dept. The new
    variable value of Site followed by a slash (/) and then the value of Dept (example,
    26/DP).


