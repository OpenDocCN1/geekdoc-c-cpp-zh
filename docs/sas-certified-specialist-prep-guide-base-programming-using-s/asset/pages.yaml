    # INDEX Function


    Overview of the INDEX Function

    The INDEX function enables you to search for a character value for a specified
    string. The INDEX function searches values from left to right, looking for the
    first occurrence of the string. It returns the position of the string''s first
    character. If the string is not found, it returns a value of 0.'
