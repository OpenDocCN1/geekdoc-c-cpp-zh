    # Using the Imported Data in a DATA Step


    # Naming the Data Set with the DATA Statement


    The DATA statement indicates the beginning of the DATA step and names the SAS
    set to be created.


    Syntax, DATA statement:

    DATA SAS-data-set-1 <... ...SAS-data-set-n>;

    nSAS-data-set names (in the format libref.filename) the data set or data sets
    to be created.


    Remember that a permanent SAS data set name is a two-level name. For example,
    the two-level name Clinic.Admit specifies that the data Admit is stored in the
    permanent SAS library to which libref Clinic has been assigned.


    # Specifying the Imported Data with the SET Statement


    The SET statement specifies the SAS data set that you want to use as input for
    your DATA step. When you import your external data using PROC IMPORT, you specify
    the name of the output data set using the OUT= option. Use the libref and data
    set name that you specified using the OUT= option as the SAS data set value for
    the SET statement.'
