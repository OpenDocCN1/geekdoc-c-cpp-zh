    GTOTAL_LABEL, GTOT_LABEL,

    HEADING, LABEL, N, NOOBS, NOSUMLABEL, OBS, ROUND, ROWS, SPLIT,

    STYLE, SUMLABEL,


    UNIFORM, WIDTH.

    ERROR 76-322: Syntax error, statement will be ignored.

    9242 run

    ```'
