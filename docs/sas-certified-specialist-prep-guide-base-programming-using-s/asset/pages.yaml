    # Selecting Observations


    By default, a PROC PRINT step lists all the observations in a data set. You can
    control which observations are printed by adding a WHERE statement to your PROC
    PRINT step. There should be only one when WHERE statement in a step. If multiple
    WHERE statements are issued, only the last statement is processed.


    Syntax, WHERE statement;

    WHERE where-expression;


    where-expression specifies a condition for selecting observations. The where-expression
    can be any valid SAS expression.


    > Example Code 1 Using the WHERE Statement in PROC PRINT


    ```

    proc print data=cert.admit;

    var age height weight fee;

    where age>30;

    /*1*/

    /**2*/

    run;

    ```


    +   1 The WHERE statement selects the variables Age, Height, Weight, and Fee and
    displays them in that order.

    2 The WHERE statement selects only the observations for which the value of Age
    is greater than 30 and prints them in the output.


    The following output displays only the observations where the value of Age is
    greater than 30.'
