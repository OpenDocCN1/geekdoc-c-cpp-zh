    | 1 | Bird Feeder | LG088 | 3 | 20 | $5.00 | 23 | $8.25 |


    Next, control returns to the top of the DATA step, and the value of _N increments
    from 1 to 2. The variables in the PDV are reset to missing. Notice that the automatic
    variable _ERROR_ is reset to 0 if necessary.


    ```

    data work.update;

    set cert.invent;

    total=istock+backord;

    salePrice=(CostPerUnit*0.65)+CostPerUnit;

    format CostPerUnit SalePrice dollar6.2;

    run;

    ```'
