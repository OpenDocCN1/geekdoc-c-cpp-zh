- img_proc: true
  md: '# Compilation Phase


    Program Data Vector (PDV)


    The PDV is a logical area in memory where SAS builds a data set, one observation
    at a time. When a program executes, SAS reads data values or creates them by executing
    SAS language statements. The data values are assigned to the appropriate variables
    in the PDV. From here, SAS writes the values to a SAS data set as a single observation.


    Along with data set variables and computed variables, the PDV contains these automatic
    variables:


    +   * the _N_ variable, which counts the number of times the DATA step iterates.

    * the _ERROR_ variable, which signals the occurrence of an error caused by the
    data execution. The value of _ERROR is 0 when there are no errors. When an error
    occurs, whether one error or multiple errors, the value is set to 1. The default
    value is 0.


    Note: SAS does not write these variables to the output data set.


    # Syntax Checking


    During the compilation phase, SAS scans each statement in the DATA step, looking
    for syntax errors. Here are examples:


    # Data Set Variables


    The SET statement compiles, a slot is added to the PDV for each variable in the
    new data set. Generally, variable attributes such as length and type are determined
    the first time a variable is encountered.


    ```

    data work.update;

    set cert.invent;

    Total=instock+backord;

    SalePrice=(CostPerUnit*0.65)+CostPerUnit;

    format CostPerUnit SalePrice dollar6.2;

    run;

    ```


    Figure 7.3 Program Data Vector


    | Item | IDnum | InStock | BackOrd | CostPerUnit | | | | _N_ | _ERROR_ |

    |---|---|---|---|---|---|---|---|---|---|'
