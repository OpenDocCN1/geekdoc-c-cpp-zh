    # SAS Indexes


    An index is a separate file that you create for a SAS data file in order to provide
    direct access to a specific observation. The index has the same name as its data
    file and a member type of INDEX. Indexes provide faster access to specific observations,
    particularly when you have a large data set. The purpose of SAS indexes is to
    optimize WHERE expressions and facilitate BY-grouping processing. For more information,
    see “Specifying Expressions” and see Chapter 8, “BY-Group Processing.,


    # Extended Attributes


    Extended attributes are user-defined metadata that is for a data set or for a
    variable (column). Extended attributes are represented as name-value pairs.'
