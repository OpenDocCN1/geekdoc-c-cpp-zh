  md: "Any variables that are created with an assignment statement in the DATA step\
    \ are also added to the PDV. For example, the assignment statement creates two\
    \ variables, Total and SalePrice. As the statement is compiled, the variable is\
    \ added to the PDV. The attributes of the variable are defined by the expression.\
    \ Because the expression contains an arithmetic operator and produces a numeric\
    \ value, Total and SalePrice are defined as numeric variables and are assigned\
    \ the default length of 8.\n\n```\ndata work.update;\n set.invent;\nTotal=instock+backorder;\n\
    SalePrice=(CostPerUnit*0.65)+CostPerUnit;\nformat CostPerUnit SalePrice dollar6.2;\n\
    run;\n```\n\n# Figure 7.4 Program Data Vector\n\n| Item | IDnum | InStock | BackOrder\
    \ | CostPerUnit | Total | SalePrice | _N_ | ERROR_ |\n|---|---|---|---|---|---|---|---|---|\n\
    \n# Descriptor Portion of the SAS Data Set\n\nThe descriptor portion is information\
    \ that SAS creates and maintains about each SAS data set, including data set attributes\
    \ and its member attributes. Here are examples:\n\n+   * the name of the data\
    \ set and its member type\n* the date and time that the data set was created\n\
    * the names, data types (character or numeric), and lengths of the variables\n\
    \nExtended attribute descriptor information is defined by the user and includes\
    \ the name of the attribute, the name of the variable, and the value of the attribute.\
    \ The descriptor information also contains information about extended attributes\
    \ (if defined in a data set). You can use the CONTENTS procedure to display descriptor\
    \ information.\n\n```\nproc contents data=work.update;\nrun;\n```"
