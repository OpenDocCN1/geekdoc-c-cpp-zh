    # **Displaying User-Defined Formats**


    When you build a large catalog of permanent formats, it can be easy to forget
    the exact spelling of a specific format name or its range of values. Adding the
    keyword FMTLIB to the PROC FORMAT statement displays a list of all the formats
    in your catalog, along with descriptions of their values.


    ```

    libname formatlib ''c:\sas\formats\lib'';

    proc formatlib library=formatlib fmtlib;

    run;

    ```


    When you submit this PROC step, a description of each format in your permanent
    catalog is displayed as output.'
