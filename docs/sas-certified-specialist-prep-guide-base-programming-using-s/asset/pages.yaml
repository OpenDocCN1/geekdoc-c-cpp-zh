    Example: INTNX Function

    For example, the following statement creates the variable TargetYear and assigns
    it a SAS date value of 22281, which corresponds to January 1, 2021.


    ```

    TargetYear=intx(''year'', ''20July8''&d,3);

    ```


    Likewise, the following statement assigns the value for the date July 1, 2018,
    to the variable TargetMonth.

    TargetMonth=intx(''month'',''01Jan18''&d,1);


    SAS date values are based on the number of days since January 1, 1960. Yet the
    INTNX function can use intervals of months, years, and so on.

    The purpose of the optional argument is to specify whether the returned value
    should be at the beginning, middle, or end of the interval. When specifying date
    alignment in the INTNX function, use the following values or their corresponding
    aliases:


    +   - BEGINNING Alias: B

    - MIDDLE Alias: M

    - END Alias: E

    - SAME Alias: SAMEDAY or S


    The best way to understand the alignment argument is to see its effect on identical.
    The following table shows the results of three INTNX statements that differ only
    in the value of alignment.


    Table 14.9 Alignment Values for the INTNX Function

    | Example Code | Date Value |

    |---|---|

    | MonthX=intx(''month'',''01Jan18''&d,5,''b''); | 21336 (June 1, 2018) |

    | MonthX=intx(''month'',''01Jan18''&d,5,''m''); | 21350 (June 15, 2018) |

    | MonthX=intx(''month'',''01Jan18''&d,5,''e''); | 21365 (June 30, 2018) |


    These INTNX statements count five months from January, but the returned value
    depends on which alignment specifies the beginning, middle, or end of the resulting
    month. If alignment is not specified, the beginning day is returned by default.


    # DATIF and YDIRIF Functions


    DATIF and YDIRIF functions calculate the difference in days and years between
    two SAS dates, respectively. Both functions accept start dates and end dates that
    are specified as SAS date values. Also, both functions use a basis argument that
    describes how SAS calculates the date difference.'
