  md: "# The Basics of the SAS Language 7\n\n+   * check for and correct errors in\
    \ your data\n* produce new SAS data sets by subsetting, supersetting, merging,\
    \ and updating\n  existing data sets\n\n# PROC Step\n\nThe PROC step analyzes\
    \ data, produces output, or manages SAS files. The input for a\nPROC (procedure)\
    \ step is usually a SAS data set. Output from a PROC step can include\na report\
    \ or an updated SAS data set.\n\nFor example, you can use PROC steps to do the\
    \ following:\n\n+   * create a report that lists the data\n* analyze data\n* create\
    \ a summary report\n* produce plots and charts\n\n# SAS Program Structure\n\n\
    A SAS program consists of a sequence of steps. A program can be any combination\
    \ of\nDATA or PROC steps. A step is a sequence of SAS statements.\n\nHere is an\
    \ example of a simple SAS program.\n\nExample Code 1 A Simple SAS Program\n\n\
    ```\ntitle 'June Billing';\nset work.junefee;\ncert cert.admitfee;\nwhere age>39;\n\
    run;\nproc print data=work.junefee;\nrun;\n```\n\n+   1 THE TITLE is a global\
    \ statement. Global statements are typically outside\nsteps and do not require\
    \ a RUN statement.\n\n+   2 THE DATA creates a new SAS data set named WorkJuneFee.\
    \ The SET\nstatement reads the data from Cert.AdmitFee. New data set contains\
    \ only\nbservations whose value for Age is greater than 39.\n\n+   3 If a RUN\
    \ or QUIT statement is not used at the end of a step, SAS assumes that the\nbeginning\
    \ of a new step implies the end of the previous step. If a RUN or QUIT\nstatement\
    \ is not used at the end of the last step in a program, SAS Studio and SAS\nEnterprise\
