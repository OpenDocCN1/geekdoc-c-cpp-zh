    \ |\n\n# Processing SAS Programs\n\nWhen a SAS program is submitted for execution,\
    \ SAS first validates the syntax and then compiles the statements. DATA and PROC\
    \ statements signal the beginning of a new step. The beginning of a new step implies\
    \ the end of the previous step. At a step boundary, SAS executes any statement\
    \ that has not been executed and ends the step.\n\n**Example Code 2** Processing\
    \ SAS Programs\n\n```\ndata work.admit2;               /* #1 */\n  set work.admit;\n\
    \  where age>39;\n\nproc print data=work.admit2;      /* #2 */\n  run;       \
    \                      /* #3 */\n```\n\n+   1. The DATA step creates a new SAS\
    \ dataset named Work.Admit2. The DATA statement is the beginning of the new step.\
    \ The SET statement is used to read data. The WHERE statement conditionally reads\
    \ the observations where the variable Age is greater than 39.\n\n+   2. The PROC\
    \ step prints the new SAS dataset named Work.Admit2. The PROC PRINT statement\
    \ serves as a step boundary in this example because a RUN statement was not used\
    \ at the end of the DATA step. The PROC step also implies the end of the DATA\
    \ step.\n\n+   3. The RUN statement ends the PROC step.\n\n> The RUN statement\
    \ is not required between steps in a SAS program. However, it is a best practice\
    \ to use a RUN statement because it can make the SAS program easier to read and\
    \ understand when debugging."
