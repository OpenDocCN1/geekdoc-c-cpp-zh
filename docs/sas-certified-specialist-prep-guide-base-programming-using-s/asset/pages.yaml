  md: '# Example: Using SAS Macro Variables with Character Values


    When referencing a SAS macro variable with character values, enclose the ampersand
    (&) and the macro variable in double quotation marks.


    In the following example, the macro variable is "Wagon", and the WHERE statement
    would be Type="Wagon". The macro variable is simply taking the place of Wagon,
    so the macro variable goes inside the quotation marks. Although constants can
    be enclosed in single quotation marks, macro variables with character must be
    enclosed in double quotation marks.


    ```

    let CarType=Wagon;

    proc print data=sashelp.cars;

    where Type="&CarType";

    type Make Model MSRF;

    run;

    proc means data=sashelp.cars;

    where Type="&CarType";

    var MSRF MPG;

    run;

    proc freq data=sashelp.cars;

    where Type="&CarType";

    tables Origin Make;

    run;

    ```


    +   1 Use the %LET statement to create a macro variable named CarType that stores
    the text Wagon.


    Note: It is recommended that you do not include quotation marks when you define
    the macro variable value. Use quotation marks when necessary after the macro variable
    is resolved.


    +   2 To reference the macro variable CarType in your code, use an ampersand (&)
    and then the macro variable name.


    If you want to run reports later on a different type of car, such as an SUV, then
    update the value of the macro variable to SUV and run the program. If you did
    not use a macro variable, then you would have to replace the value throughout
    the code.


    The following PRINT, MEANS, and FREQ output shows results where the value for
    Type is Wagon.'
