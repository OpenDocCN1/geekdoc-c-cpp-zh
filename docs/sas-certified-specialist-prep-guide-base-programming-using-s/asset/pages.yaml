    WHERE Statement


    # Specifying WHERE Expressions


    In the WHERE statement, you can specify any variable in the SAS data set, not
    just the variables that are specified in the VAR statement. The WHERE statement
    works for both character and numeric variables. To specify a condition on the
    value of a character variable, follow these rules:


    +   - Enclose the value in quotation marks.

    - Write the value in lowercase, uppercase, or mixed case letters exactly as it
    appears in the data set.


    Use the following comparison operators to express a condition in the WHERE statement:


    | Symbol | Meaning | Sample Program Code |

    |---|---|---|

    | = eq | equal to | where name=''Jones, C''; |

    | ^= ne | not equal to | where temp ne 212; |

    | > gt | greater than | where income>20000; |

    | < lt | less than | where partno 1t "BG05"; |


    Table 6.1 Comparison Operators in a WHERE Statement'
