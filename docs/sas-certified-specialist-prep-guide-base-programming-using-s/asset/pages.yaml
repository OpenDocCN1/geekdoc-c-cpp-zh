    # YEAR, QTR, MONTH, AND DAY Functions


    Overview of YEAR, QTR, MONTH, and DAY Functions

    Every SAS date value can be queried for the values of its year, quarter, month,
    and day. You extract these values using the functions YEAR, QTR, MONTH, and DAY.
    Each work the the same way.


    Syntax, YEAR, QTR, MONTH, and DAY functions:

    **YEAR(date)**

    **QTR(date)**

    **MONTH(date)**

    **DAY(date)**

    *date is a SAS date value that is specified either a variable or as a SAS date
    constant.*


    The YEAR function returns a four-digit numeric value that represents the year
    (for example, 2018). The QTR function returns a value of 1, 2, 3, or 4 from a
    SAS date value to indicate the quarter of the year in which a date falls. The
    MONTH function returns a numeric value that ranges from 1 to 12, representing
    the month of the year. The value 1 represents January, 2 represents February,
    and so on. The DAY function returns a numeric value from 1 to 31, representing
    the day of the month.'
