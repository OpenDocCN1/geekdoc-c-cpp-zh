  md: 'On some browsers, you can select a heading to contract or expand the table
    of contents.


    Figure 16.3 Table of Contents


    ![](img/4d880eb3a583bf2815ab53a244818659_354_0.png)


    # Using Options to Specify Links and Paths


    # Overview


    When ODS generates HTML files for the body, contents, and frame, it also generates
    links between the files using HTML filenames that you specify in the ODS HTML
    statement. If you specify complete paths, ODS uses those paths in the links that
    it generates.


    The following ODS statement creates a frame that has links to C:\Users\Student1\cert\toc.html
    and C:\Users\Student1\cert\data.html, and a contents file that has links to C:\Users\Student1\cert\data.html.


    ```

    ods html body="C:\Users\Student1\cert\data.html"

    contents="C:\Users\Student1\cert\toc.html"

    frame="C:\Users\Student1\cert\frame.html";

    ```


    A portion of the source code for the HTML file, frame.html is shown below. Notice
    that the links have the complete paths in the file specifications for the contents
    and body files.


    # Example 1 Source Code for the HTML File Frame.html


    ```

    <FRAME MARWIDTH="*" MARGINHEIGHT="0" SRC="C:\Users\Student1\cert\toc.html"

    NAME="" SCROLLING="auto">

    <FRAME MARWIDTH="*" MARGINHEIGHT="0" SRC="C:\Users\Student1\cert\data.html"

    NAME="body" SCROLLING="auto">

    ```


    These links work when you are viewing the HTML files locally. If you want to place
    these files on a web server so that others can access them, then the link needs
    to include either the complete URL for an absolute link or the HTML filename for
    a relative link.


    # The URL= Subption


    To provide a subption that ODS uses in all the links that it creates for the file,
    specify the URL= subption in the BODY= or CONTENTS= file specification. You can
    use the URL= subption in any ODS file specification except FRAME=; (because no
    ODS references the frame).'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# 344 Chapter 16 Creating Output


    Syntax, URL=subposition in a file specification:

    (URL="Uniform-Resource-Locator")


    > TIP The URL=subposition is useful for building HTML files that may be moved
    from one location to another. If the links from the contents and page files are
    constructed with a simple URL (one name), they work as the contents, page, and
    body files are all in the same location.


    # Example: Relative URLs


    In this ODS HTML statement, the URL=subposition specifies only the HTML filename.
    This is the most common style of linking files because maintenance is easier.
    The files can be moved as long as they remain in the same directory or location.


    ```

    ods body=''C:\Users\Student\cert.data.html'' (url=''data.html'')

    contents=''C:\Users\Student\cert.toc.html'' (url=''toc.html'')

    frame=''C:\Users\Student\cert.frame.html''

    ```


    The source code for frame has only the HTML filename as specified in the URL-subposition
    for the body and contents files.


    # Example 2 Source Code for the HTML File Frame.html


    ```

    <FRAME MARWIDTH="4" MARGINHEIGHT="0" SRC="toc.html"

    NAME="contents" SCROLLING=auto

    <FRAME MARWIDTH="9" MARGINHEIGHT="0" SRC="data.html"

    NAME="body" SCROLLING=auto

    ```


    # Example: Absolute URLs


    Alternatively, in this ODS HTML statement, the URL=subposition specifies complete
    URLs using HTTP. These files can be stored in the same or different locations.


    ```

    ods body=''C:\Users\Student\cert.data.html''

    (url=''http://mys.com/cert/data.html'')

    contents=''C:\Users\Student\cert.toc.html''

    (url=''http://mys.com/cert/toc.html'')

    frame=''C:\Users\Student\cert.frame.html''

    ```


    As you expect, the source code for Frame has the entire HTTP addresses you specified
    in the URL-subposition for the body and contents files.


    # Example 3 Source Code for the HTML File Frame.html


    ```

    <FRAME MARWIDTH="4" MARGINHEIGHT="0" SRC="http://mys.com/cert/data.html"

    NAME="contents" SCROLLING=auto

    <FRAME MARWIDTH="9" MARGINHEIGHT="0" SRC="http://mys.com/cert/toc.html"

    NAME="body" SCROLLING=auto

    ```


    > TIP When you use the URL=subposition to specify a complete URL, you might need
    to move your files to that location before you view them.'
  merge: -1
  pgno: 355
- img_proc: true
  md: "# The PATH= Option\n\nUse the PATH= option to specify the location of the files.\n\
    \nSyntax, PATH= option with the URL suboption:\n`file-location-specification<URL=NONE|\"\
    Uniform-Resource-Locator\">`\n\n+   * file-location-specification identifies the\
    \ location where you want HTML files to be saved.\n  * the complete pathname to\
    \ an aggregate storage location, such as a directory or partitioned data set\n\
    \  * a fileref (file shortcut) has been assigned to a storage location\n  * a\
    \ SAS catalog (libname.catalog)\n  * Uniform-Resource-Locator provides a URL for\
    \ links in the HTML files that ODS generates. If you specify the keyword NONE,\
    \ no information from the PATH= option appears in the links or references.\n*\
    \ If you do not use the URL= suboption, information from the PATH= option is added\
    \ to links and references in the files that are created.\n\n> Note: In the z/OS\
    \ operating environment, if you store your HTML files as members in a partitioned\
    \ data set, the PATH= value must be a PDSE, not a PDS. You can allocate a PDSE\
    \ within SAS as shown in this example:\n\n```\nfilename pdsehtml '.example.htm'\n\
    dnsype=library dsrgpo=\ndisp={new, catlg, delete};\n```\n\nYou should specify\
    \ member names for the HTML files (without extensions).\n\n# Example: PATH Option\
    \ with URL=NONE\n\nIn the following program, the PATH= option directs the files\
    \ data.html, toc.html, and frame to the C:\\Users\\Student1\\cert directory in\
    \ the Windows operating environment. The links from the frame to the body and\
    \ contents files contain only data.html and toc.html.\n\n```\nods path='C:\\Users\\\
    Student1\\cert\\' (url=none)\nbody=data.html\ncontents=toc.html\nframe=frame.html';\n\
    proc data=cert.admit;\nrun;\nproc data=cert.stress2;\nrun;\nods close;\nods html\
    \ path='%qysfunf(pathname(work))\";\n```\n\nThis program generates the files and\
    \ links as the previous example in which you learned how to use the URL suboption\
    \ with the BODY= and CONTENTS= file specifications. However, it is simpler to\
    \ specify the path once in the PATH= option and to specify URL=NONE.\n\n> TIP\
    \ If you want to move your HTML files, you should specify URL=NONE with the PATH=\
    \ option to prevent information from the PATH= option from creating URLs that\
    \ are invalid or incorrect."
  merge: -1
  pgno: 356
- img_proc: true
  md: '# 346 Chapter 16 • Creating Output


    Example: PATH= Option without the URL= Suboption

    In the following program, the PATH option directs the files data.html, toc.html,
    and frame.html to the C:\Users\Student1\cert directory in the Windows operating
    environment. The links from the file to the body and contents contain the complete
    paths, C:\Users\Student1\certdata.html and C:\Users\Student1\cert.toc.html:


    ```

    ods paths=''C:\Users\Student1\cert\''

    body=''data.html''

    contents=''toc.html''

    frame=''frame.html''

    proc data=cert.admit;

    run;

    proc data=cert.stress2;

    run;

    ods html close;

    ods html="%qsysfunc(pathname work)";

    ```


    Example: PATH= Option with a Specified URL

    In the following program, the PATH option directs the files data.html, toc.html,
    and frame.html to the C:\Users\Student1\cert directory in the Windows operating
    environment. The links from the file to the body and contents contain the specified
    URLs, http://mysite.com/cert/data.html, and http://mysite.com/cert/toc.html:


    ```

    ods paths="C:\Users\Student1\cert\ (url=''http://mysite.com/cert/'')''

    body=''data.html''

    contents=''toc.html''

    frame=''frame.html''

    proc data=cert.admit;

    run;

    proc data=cert.stress2;

    run;

    ods html close;

    ods html paths="%qsysfunc(pathname work)";

    ```


    # Changing the Appearance of HTML Output


    Style Templates

    You can change the appearance of your HTML output by specifying a style in the
    STYLE=option in the ODS HTML statement. Here are some of the style templates that
    are currently available:


    +   * Banker

    * BarrettBlue

    * Default

    * HTMLblue

    * Minimal

    * Statistical


    > To see a list of styles that SAS supplies, submit the following code:


    ```

    proc template;

    ```'
