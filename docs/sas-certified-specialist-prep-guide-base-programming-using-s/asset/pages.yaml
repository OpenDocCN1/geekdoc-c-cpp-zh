    +   - 2000 is added to the value of Capital to reflect the annual deposit of $2,000.

    - 10% interest is added to Capital.

    - The value of Year is incremented by 1.


    Because there is no index variable in the DO UNTIL statement, the variable Year
    is created in a statement to count the number of iterations of the DO loop. This
    program produces a data set that contains the single observation shown below.
    To accumulate more than $50,000 in capital requires 13 years (and 13 iterations
    of the loop).


    Figure 11.4 SAS Data Set Work.Invest: Accumulation of More Than $50,000


    | Capital | Year |

    |---|---|

    | 53949.97 | 13 |


    # The DO WHILE Statement


    Like the DO UNTIL statement, the DO WHILE statement executes DO loops conditionally.
    You can use the DO WHILE statement to execute a DO loop while the expression is
    true.


    ```

    Syntax, DO WHILE statement:

    DO WHILE(expression);

    ...more SAS statements...

    ```


    ```

    END;

    expression is a valid SAS expression enclosed in parentheses.

    ```


    An important difference between the DO UNTIL and DO WHILE statements is that the
    DO WHILE expression is evaluated at the top of the DO loop. If the expression
    false the first time it is evaluated, the DO loop never executes. For example,
    in the following program the loop does not execute because the value of Capital
    is initially zero, which is less than 50,000.


    ```

    data work.invest;

    do do(Capital>=50000);

    capital+2000;

    capital+capital*.10;

    year+1;

    end;

    ```


    Suppose you also want to limit the number of years you invest your capital to
    10 years. You can add an iterative DO statement to further control the number
    of iterations. This iterative DO statement enables you to execute the DO loop
    until Capital is greater than or equal to 50000 or until the DO loop executes
    10 times, whichever occurs first.


    ```

    data work.invest;

    do year=1 to 10 until (Capital>=50000);

    capital+2000;

    capital+capital*.10;

    end;

    ```


    ```

    run;

    ```'
