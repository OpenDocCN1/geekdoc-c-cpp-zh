  md: '# Naming Transposed Variables


    Use the ID statement to create variable names in the output data set that are
    based on one or more variables from the input data set.


    When a name is formed in the transposed data set, the formatted values of all
    listed ID variables are concatenated in the same order that the variables are
    listed in the ID statement. The PREFIX= option specifies a common character or
    character string to appear at the beginning of the formed variable names.


    Syntax, ID statement:

    **ID variable(s);**


    +   - variable(s) one or more variables whose formatted values are used to form
    the names of the variables in the output data set.


    > If the value of any ID variable is missing, PROC TRANSPOSE writes a warning
    message to the log. The procedure does not transpose observations that have a
    missing value for any ID variable.


    The following example uses the values of a variable and a user-supplied value
    to name transposed variables.


    ```

    proc transpose data=cert.trials out=tranials2; /* #1 */

    var cholesterol trigly uric /* #2 */

    id name testdate; /* #3 */


    run;

    proc print data=tranials2;

    run; /* #4 */

    ```


    +   1. Transpose the data Cert.Trials and put the results of the transposition
    in the Tranials2 data set.

    2. The VAR statement specifies the Cholesterol, Trigly, and Uric variables as
    the only to be transposed.

    3. The ID statement specifies Name and TestDate as the variables whose nonmissing
    formatted values name the transposed variables in the output data set, Tranials2.
    Because the ID statement specifies two variables, the values of those variables
    are concatenated to create the new variable names.

    4. Use the PROC PRINT statement to print the Tranials2 data set.'
