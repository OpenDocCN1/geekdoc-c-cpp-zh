    # SAS Variable Attributes


    The descriptor portion of a SAS data set contains information about the properties
    of each variable in the data set. The properties information includes the variable''s
    name, type, length, format, and label.


    When you write SAS programs, it is important to understand the attributes of the
    variables that you use. For example, you might need to combine SAS data sets that
    contain same-named variables. In this case, the variables must be the same type
    (character or numeric). If the same-named variables are both character variables,
    you still need to check that the variable lengths are the same. Otherwise, some
