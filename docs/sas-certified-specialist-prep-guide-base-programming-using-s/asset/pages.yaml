    # Handling Unmatched Observations and Missing Values


    By default, all observations that are in the PDV, including missing data and no
    matching BY values, are written to the output set. If you specify a subsetting
    IF statement to select observations, then only those that meet the IF condition
    are written.


    +   - If an observation contains missing values for a variable, the observation
    in the output data set contains missing values as well: Observations that have
