    # Using an Assignment Statement to Clean Invalid Data


    You can use an assignment statement or a conditional clause to programmatically
    clean invalid data when it is identified.


    For example, if your input data contains a field that field contains an invalid
    value, you can use an assignment statement to clean your data. Overriting your
    original data set, you can use the DATA statement to create a new data set The
    new set contains all of the data from your original data set, along with the correct
    values for invalid data.


    The following example assumes that Gender has an invalid value of G in the input
    data. This error might be the result of a data entry error. If G should be M,
    it is possible to correct the invalid data for Gender by using an assignment statement
    along with an IFTHEN statement:


    ```

    data work.pats_clean;

    set cert.pats;

    gender=upcase(Gender);

    if Gender=''G'' then Gender=''M'';

    run;

    proc print data=work.pats_clean;

    ```


    Notice that two observations contain invalid values for Age. These values exceed
    a maximum value of 100. It is possible to uniquely identify each of the observations
    by specifying the variable ID. After checking the date of birth in each observations
    and determining the correct value for Age, you can change the data by inserting
    an IFTHENELSE statement:


    ```

    data work.clean_data;

    set cert.pats;

    gender=upcase(Gender);

    if Gender=''G'' then Gender=''M'';

    if id=1147 then age=65;

    else if id=5277 then age=75;

    run;

    proc print data=work.clean_data;

    ```'
