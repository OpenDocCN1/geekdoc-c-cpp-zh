  md: '# MDY Function


    # Overview of the MDY Function


    The MDY function returns a SAS date from month, day, and year values.


    Syntax, MDY function:

    **MDY** (month, day, year)


    +   * month specifies a numeric constant, variable, or expression that represents
    an integer from 1 through 12.

    * day specifies a numeric constant, variable, or expression that represents an
    integer from 1 through 31.

    * year specifies a numeric constant, variable, or expression that represents a
    value of a two-digit or four-digit integer that represents that year.


    # Example: MDY Function


    In the data set Cert.Dates, the values for month, day, and year are stored in
    the numeric variables Month, Day, and Year. It is possible to write the following
    MDY function to create the SAS date values:


    ```

    mdy(month, day, year)

    ```


    To create a new variable to contain the SAS date values, place this function in
    an assignment statement.


    ```

    data work.datestemp;

    set cert.dates;

    date=mdy(month,day,year);

    run;


    proc print data=work.datestemp;

    format date mmddy10.;nrun;

    ```'
