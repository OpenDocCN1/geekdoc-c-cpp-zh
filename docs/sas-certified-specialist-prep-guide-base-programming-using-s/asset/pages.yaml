  md: "# Creating EXCEL Output with ODS 355\n\nSyntax, ODS EXCEL statement:\nODS EXCEL\
    \ <<ID>=identifier> <action>;\nODS EXCEL <<ID>=identifier> <option(s);\n\n+  \
    \ - <ID>=identifier> enables to open multiple instances of the same destination\
    \ at the same time. Each instance can have different options.\n- identifier can\
    \ be numeric or can be a series of characters that begin with a letter or an underscore.\
    \ Subsequent characters can include letters, underscores, and numerals.\n- action\
    \ can be one of the:\n  - CLOSE action closes the destination and all files that\
    \ are associated with it.\n  - EXCLUDE exclusions| ALL | NONE excludes one or\
    \ more output objects from the destination.\n  - SELECT selections| ALL | NONE\
    \ selects output objects for the specified destination.\n\nNote: The default is\
    \ NONE. Destination must be open for this action to take effect.\n\nNote: The\
    \ default is ALL. Destination must be open for this action to take effect.\n\n\
    SHOW action writes the current selection list or exclusion list for the SAS log.\n\
    Note: If the selection or exclusion list is the default list (SELECT ALL), then\
    \ SHOW also writes the entire selection or exclusion list. The destination must\
    \ be open for this action to take effect.\n\n# Details about the Excel ODS Destination\n\
    \nThe ODS destination for Excel uses Microsoft Office XML Format for Office 2010\
    \ and later. This statement produces XML and represents a way to define and format\
    \ data for easy exchange.\n\nThe ODS destination for Excel creates Microsoft spreadsheet\
    \ in ML XML. Each table is placed in its own worksheet within a workbook. This\
    \ destination supports ODS styles, typography, and custom formats. Numbers, currencies,\
    \ and percentages are accurately detected and displayed. Style attribute, TAGATRR=\
    \ can be used to create custom formats for the data. By default, titles and footnotes\
    \ are included in the worksheet, they are part of the header and footer of the\
    \ worksheet.\n\nPortrait is the default printing orientation. The orientation\
    \ can be changed to landscape.\n\n# Example: Customizing Your Excel Output\n\n\
    The following example illustrates a customized Excel workbook that contains PROC\
    \ MEANS output.\n\n```\nods file='multitablefinal.xlsx' /* 1 */\noptions (sheet_interval='group'\
    \ \nsuppress_lines='yes'\nsheet_label='country' \nembedded_titles='yes');\ntitle='Wage\
    \ Rates By Manager';\nproc means data=cert.usa;\nby manager;\nvar wagerate;\n\
    run;\n```"
