    # PUT Statement


    # Syntax


    When the source of errors is not apparent, you can use the PUT statement to examine
    values and print your own message in the log. For diagnostic purposes, you can
    use IF-THEN/ELSE statements to conditionally check for values. For more information
    about IF-THEN/ELSE statements, see “Using a Subsetting IF Statement” on page 151.


    Syntax, PUT statement:

    PUT specification(s);


    specification specifies what is written, how it is written, and where it is written.
    Here are examples:


    +   * a character string

    * one or more data set variables

    * the automatic variables _N_ and _ERROR_

    * the automatic variable _ALL_


    # Example: Using the PUT Statement


    The following example illustrates how to use the PUT statement to write messages
    to the SAS log.


    ```

    data work.test;

    set cert.loan01;

    if code=''1'' then type=''variable'';

    else if code=''2'' then type=''fixed'';

    else type=''unknown'';

    if type=''unknown'' then put ''MY NOTE: invalid value: code='';

    run;

    ```


    If the variable Code equals 1, the program returns the value for Type as variable.
    If the value equals 2, the return value for Type is fixed. Otherwise, the value
    of Type is returned as unknown.


    ![](img/4d880eb3a583bf2815ab53a244818659_76_0.png)'
