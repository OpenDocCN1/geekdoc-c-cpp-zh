  md: '# Chapter 4 • Creating SAS Data Sets


    Name literals are required by the XLSX engine only when the worksheet name contains
    a special character or spaces. By default, SAS does not allow special characters
    in SAS data sets. A SAS literal is a name token within quotation marks, followed
    by the uppercase or lowercase letter n. The name literal tells SAS to allow the
    special character ($) in the data set name.


    The following example illustrates reading an Excel worksheet using a name literal.
    Specify the name of the worksheet in quotation marks with an n name. This syntax
    allows SAS that there are special characters or spaces in the data set name.


    ```

    libname cert xlsx ''C:\Users\Student1\cert\stock.xlsx'';

    data work.bstock;

    set certxl.''bstock;

    run;

    ```


    # Printing an Excel Worksheet as a SAS Data Set


    After using the DATA step to read in the Excel and create a SAS data set, you
    can use PROC PRINT to produce a report that displays the data set values. In the
    following example, the PROC PRINT statement displays all the values for the new
    data set, Work.Bstock.


    ```

    libname cert xlsx ''C:\Users\Student1\cert\stock.xlsx'';

    data work.bstock;

    set certxl.''bstock;

    run;

    proc print data=work.bstock;

    ;

    ```


