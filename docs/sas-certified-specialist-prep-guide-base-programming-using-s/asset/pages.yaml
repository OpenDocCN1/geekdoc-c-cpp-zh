    (=) to the variable name.


    ```

    data work.loan01;

    set cert.loan;

    if code=''1'' then type=''variable'';

    else if code=''2'' then type=''fixed'';

    else type=''unknown'';

    put ''MY NOTE: Invalid Value: '' code=;

    ```'
