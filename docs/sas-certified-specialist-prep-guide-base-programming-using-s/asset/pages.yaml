  md: '# Referencing SAS Files


    # Referencing Permanent SAS Data Sets


    To reference a permanent SAS data set in your SAS programs, use a two-level name
    consisting of the library name and the data set name:


    libref.dataset


    In the two-level name, *libref* is the name of the SAS library that contains the
    data set, and *data* is the name of the SAS data set. A period separates the libref
    and data set name.


    **Figure 2.3** Two-Level Permanent SAS Name


    ![](img/4d880eb3a583bf2815ab53a244818659_24_0.png)


    # Referencing Temporary SAS Files


    To reference temporary SAS files, you can specify the default libref Work, a period,
    and the data set name. For example, the two-level name, *Work.Test*, references
    the SAS data set named Test that is stored in the temporary SAS library Work.'
  merge: -1
