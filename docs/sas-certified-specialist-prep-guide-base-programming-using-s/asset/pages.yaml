  md: "# Nesting DO Loops\n\n# Indenting and Nesting DO Groups\n\nYou can nest DO\
    \ groups to any level, just like you nest IF-THEN/ELSE statements.\n\nNote: The\
    \ memory capabilities of your system might limit the number of nested DO statements\
    \ that you can use.\n\nHere is an example structure of nested DO groups:\n\n```\n\
    do;\n  ...more SAS statements...;\n  do;\n    ...more SAS statements...;\n   \
    \ do;\n      ...more SAS statements...;\n    end;\n  end;\nend;\n```\n\n> It is\
    \ good practice to indent the statements in DO groups, as shown in the preceding\
    \ statements, so their position indicates the level of nesting.\n\n# Examples:\
    \ Nesting DO Loops\n\nIterative DO statements can be executed within a DO loop.\
    \ Putting a DO loop within a DO loop is called nesting.\n\n```\ndo i=1 to 20;\n\
    \  ...more SAS statements...;\n  do j=1 to 10;\n    ...more SAS statements...;\n\
    \  end;\n  ...more SAS statements...;\nend;\n```\n\nThe DATA step below computes\
    \ the value of a one-year investment that earns 7.5% annual interest, compounded\
    \ monthly.\n\n```\ndata work.earn;\n  Capital=2000;\n  do month=1 to 12;\n   \
    \ Interest=capital*(.075/12);\n    capital=capital+interest;\n  end;\n```\n\n\
    Assume that the same amount of capital is added to the investment for year 20\
    \ years. The new program must perform the calculation for each month during each\
    \ of the 20 years. To do this, you can include the monthly calculations within\
    \ another DO loop that executes 20 times.\n\ndata work.earn;"
