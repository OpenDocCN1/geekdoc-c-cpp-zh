  md: 'If the *modifier* is a constant, enclose it in quotation marks. Specify multiple
    constants in a single set of quotation marks. *Modifier* can also be expressed
    as a variable or an expression.


    Based on the number of arguments, the COMPRESS functions works as follows:


    | Number of Arguments | Result |

    |---|---|

    | only the first argument, _source | All blanks have been removed from the argument.
    If the argument is completely blank, the result is a string with a length of zero.
    If you assign the result to a variable with a fixed length, then the value of
    variable is padded with blanks to fill its defined length. |

    | the two arguments, _source_ and _chars_ | All characters that appear in the
    second argument are removed from the result. |

    | three arguments, _source_, _chars_, and _modifier(s) | The K modifier (specified
    in the third argument) determines whether the second argument are kept or removed
    from the result. |


    The COMPRESS function compiles a list of characters to keep or remove, comprising
    the characters in the second argument plus any of characters that are specified
    by the modifiers. For example, the D modifier specifies digits. Both of the following
    function calls remove from the result:


    ```

    compress(source, "1234567890");

    compress(source, "d");

    ```


    To remove digits and plus minus signs, you can use either of the following function
    calls:


    ```

    compress(source, "1234567890+-");

    compress(source, "-", "d");

    ```


    # Example: Compress a Character String


    ```

    data _null_;

    a=''A B C D'';

    b=compress(a);

    put b=;

    run;

    ```


    # Log 14.5 SAS Log


    ```

    b=ABCD

    ```


    # Example: Compress a Character String Using a Modifier


    The following example uses the I to ignore the case of the characters to remove.


    ```

    data _null_;

    x=''919-000-000 nc 610-000-000 pa 719-000-000 Oh'';

    y=compress(x, ''ACHCNP'', ''I'');

    ```'
