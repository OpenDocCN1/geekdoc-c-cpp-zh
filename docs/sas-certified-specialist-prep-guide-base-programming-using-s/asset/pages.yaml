    | On the Web | |

    | --- | --- |

    | Base SAS Glossary | support.sas.com/baseglossary |

    | Bookstore | www.sas.com/books |

    | Certification | www.sas.com/certify |

    | Communities | communities.sas.com |

    | Knowledge Base | support.sas.com/notes |

    | Learning Center | www.sas.com and click **Learn**. Then select **Get Started
    with SAS.** |

    | SAS Documentation | support.sas.com/documentation documentation.sas.com |

    | SAS Global Academic Program | www.sas.com and click **Learn**. Then select **For
    Students and Educators.** |

    | SAS OnDemand | support.sas.com/ondemand/ |

    | Syntax Quick Reference Guide | support.sas.com/content/dam/''SAS''/support/en/books/data/base-syntax-ref.pdf
    |

    | Training | www.sas.com/training |

    | Technical Support | support.sas.com. Then select **Technical Support.** |


    In this book, SAS-data-set looks like this example:


    ```

    DATA output-SAS-data-set

    (DROP=variables(s) | KEEP=variables(s));

    SET SAS-data-set <options>;

    BY variable(s);

    RUN;

    ```


    Here are the conventions that are used in the example:


    +   - DATA, DROP, KEEP, SET, BY, and RUN are in uppercase because they must be
    spelled as shown.

    - output-SAS-data-set, variable(s), SAS-data-set, and options are in italics because
    each represents a value that you supply.

    - <options> is enclosed in angle brackets because it is an optional syntax.'
  merge: -1
  pgno: 7
- img_proc: true
  md: '+   - DROP= and KEEP= are separated by a vertical bar (|) to indicate that
    they are mutually exclusive.


    The example syntax that is shown in this book includes only what you need to know
    in order to prepare for the certification exam. For complete syntax, see the appropriate
    SAS reference guide.'
