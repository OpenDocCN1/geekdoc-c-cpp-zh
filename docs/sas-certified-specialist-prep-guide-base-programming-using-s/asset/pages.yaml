    # The FREQ Procedure


    PROC FREQ is a procedure that is used to give descriptive statistics about a SAS
    data set. The procedure creates one-way, two-way, and *n*-way frequency tables.
    It also describes data by reporting the distribution of variable values. The FREQ
    procedure creates crosstabulation tables to summarize data for two or more categories
    by displaying the number of observations for each combination of values.'
