- img_proc: true
  md: '# Referencing SAS Files 15


    Syntax, VALIDVARNAME=


    VALIDVARNAME=V7(UPCASE|ANY)


    V7 specifies that variable names must follow these rules:


    +   - SAS variable names can be up to 32 characters long.


    +   - The first character must begin with a Letter of the Latin alphabet (A -
    Z, either uppercase or lowercase) or an underscore (_). Subsequent characters
    can be letters of the Latin alphabet, numerals, or underscores.


    +   - Trailing blanks are ignored. The variable name alignment is left-justified.


    +   - A variable name cannot contain blanks or special characters except for an
    underscore.


    +   - A variable name can contain mixed-case letters. SAS stores and writes the
    variable in the same case that is used in the first reference to the variable.
    However, when SAS processes a variable, SAS internally converts it to uppercase.
    Therefore, you cannot use the same variable with a different combination of uppercase
    and lowercase letters to represent different variables. For example, cat, Cat,
    and CAT all represent the same name.


    +   - Do not assign variables to the names of SAS automatic variables (such as
    N_ and ERROR_) or variable lists (such as _NUMERIC_, CHARACTER_, and _ALL_) to
    variables.


    UPCASE specifies that the variable name follows the rules as V7, except that the
    variable name is uppercase,


    ANY specifies that SAS variable names follow these rules:


    +   - The variable name can begin with any characters, including blanks, national
    characters, special characters, and multi-byte characters.


    +   - The name can be up to 32 bytes.


    +   - The name cannot contain any null bytes.


    +   - Leading blanks are preserved, trailing blanks are ignored.


    +   - The name must contain at least one character. A name with all blanks is
    not permitted.


    +   - A variable name can contain mixed-case letters. SAS stores and writes the
    variable in the same case that is used in the first reference to the variable.
    However, when SAS processes a variable, SAS internally converts it to uppercase.
    Therefore, you cannot use the same variable with a different combination of uppercase
    and lowercase letters to represent different variables. For example, cat, Cat,
    and CAT all represent the same name.


    > Note: If you use characters other than the ones are valid when VALIDVARNAME=V7,
    you must express the variable name as a literal and set VALIDVARNAME=ANY. If the
    name includes either a percent sign (%) or an ampersand (&), then use single quotation
    marks in the name to avoid interaction with the SAS macro facility.


    CAUTION:


    Throughout SAS, using the name syntax for SAS names that exceed the 32-byte limit
    or have excessive embedded quotation marks might cause unexpected results. The
    VALIDVARNAME=ANY system option enables compatibility with other DBMS (column)
    naming conventions, such as allowing embedded blanks and national characters.'
  merge: -1
