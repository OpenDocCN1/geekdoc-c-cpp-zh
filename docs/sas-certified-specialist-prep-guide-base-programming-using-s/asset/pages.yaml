  md: '# Chapter 2 • Basic Concepts


    You can define SAS libraries using programming statements. For information about
    how to write LIBNAME statements to define SAS libraries, Assigning LibREFs on
    page 25.


    > TIP Depending on your operating environment and the SAS/ACCESS products you
    license, you can create libraries with various engines. Each engine enables you
    to read a different file format, including files from other software vendors.


    When you delete a SAS library, the pointer to the library is deleted, and SAS
    no longer has access to the library. However, the contents of the library still
    exist in your operating environment.


    # How SAS Files Are Stored


    A SAS library is the highest level of organization for information within SAS.


    For example, in the Windows and UNIX environments, a library is typically a group
    of SAS files in the same folder or directory.


    The table below summarizes the implementation of SAS libraries in various operating
    environments.


    # Table 2.1 Environments and SAS Libraries


    | Environment | Library Definition |

    | Windows, UNIX | a group of SAS files that are stored in the same directory.
    Other files can be stored in the directory, but only the files that have SAS file
    extensions are recognized as part of the SAS library. |

    | z/OS | a specially formatted host data set in which only SAS files are stored.
    |


    # Storing Files Temporarily or Permanently


    Depending on the library name that you use when you create a file, you can store
    SAS files temporarily or permanently.


    # Table 2.2 Temporary and Permanent SAS Libraries


    | Temporary SAS libraries last only for the current SAS session. | If you do not
    specify a library name when you create a file, the file is stored in the temporary
    SAS library. Work. If you specify the library name, then the file is stored in
    the temporary SAS session. When you end the session, the temporary library and
    all of its files are deleted. |'
