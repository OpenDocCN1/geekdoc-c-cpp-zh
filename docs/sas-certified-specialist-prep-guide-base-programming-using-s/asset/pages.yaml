  md: '16 Chapter 2 • Basic Concepts


    # VALIDMEMNAME=System Option


    You can use the VALIDMEMNAME= system option to specify rules for naming SAS data
    sets.


    Syntax, VALIDMEMNAME=

    VALIDMEMNAME=COMPATIBLE | EXTEND


    Important: COMPATIBLE is the default system option for VALIDMEMNAME=

    COMPATIBLE specifies that a SAS data set name can be up to 32 characters long.


    +   * The length of names can be up to 32 characters.

    * Names must begin with a letter of the Latin alphabet (A-Z, a-z) or an underscore.
    Subsequent characters can be letters of the Latin alphabet, numerals, and for
    underscores.

    * Names cannot contain blank or special characters except for an underscore

    * Names can contain mixed-case letters. SAS internally converts the member name
    to uppercase, therefore you cannot use the same name with a different combination
    of uppercase and lowercase to represent different variables. For example, *customer*,
    *Customer*, and *CUSTOMER* all represent the same member name. How the name is
    saved on disk is determined by the operating environment.


    +   * EXTEND specifies that the data set name must follow these rules:

    * Names can include national characters.

    * The name can include special characters, except for the / \ * ? * < > - characters.

    * The name must contain at least one character.

    * The length of the name can be up to 32 bytes.

    * Null bytes are not allowed.

    * Names cannot begin with a blank or a ''.'' (period).

    * Leading and trailing blanks are deleted when the member is created.

    * Names can contain mixed-case letters. SAS internally converts the member name
    to uppercase, therefore you cannot use the same name with a different combination
    of uppercase and lowercase to represent different variables. For example, *customer*,
    *Customer*, and *CUSTOMER* all represent the same member name. How the name appears
    is determined by the operating environment.


    > Note: If VALIDMEMNAME=EXTEND, SAS data set names must be written as a SAS name
    literal. If you use a percent sign (%) or an ampersand (&), then you must use
    single quotation marks in the name literal to avoid interaction with the SAS macro
    facility.


    CAUTION:

    Throughout SAS, using literal syntax with SAS member names that exceed the 32-byte
    limit or have excessive embedded quotation marks might cause unexpected results.
    The intent of the VALIDMEMNAME=EXTEND system option is to enable compatibility
    with other DBMS member naming conventions, such as allowing embedded blanks and
    national characters.'
