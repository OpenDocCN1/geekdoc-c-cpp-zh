  md: '# Execution Phase


    # Initializing Variables


    At the beginning of the execution phase, the value of _N_ is 1. Because there
    are no data errors, the value of _ERROR_ is 0.


    ```

    data work.update;

    set cert.invent;

    Total=instock+backord;

    SalePrice=(CostPerUnit*0.65)+CostPerUnit;

    format CostPerUnit dollar6.2;

    run;

    ```


    Figure 7.6 Data Vector: Initializing Variables


    | Item | IDnum | InStock | BackOrder | CostPerUnit | Total | SalePrice | _N_ |
    _ERROR_ |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | | * | * | * | * | * | * | 1 | 0 |


    The remaining variables are initialized to missing. Missing numeric values are
    represented by periods, and missing character values are represented by blanks.


    # SET Statement


    The SET statement identifies the location of the input data set. Columns are added
    to the PDV in the order in which they appear in the input table. Attributes are
    inherited from the input table.


    ```

    data work.update;

    set cert.invent;

    Total=instock+backord;

    SalePrice=(CostPerUnit*0.65)+CostPerUnit;

    format CostPerUnit dollar6.2;

    run;

    ```


    # Sequentially Process Statements


    After the SET statement, SAS executes the remaining statements sequentially and
    updates the values in the PDV.


    ```

    data work.update;

    set cert.invent;

    Total=instock+backord;

    SalePrice=(CostPerUnit*0.65)+CostPerUnit;

    format CostPerUnit dollar6.2;

    run;

    ```


    +   SAS processes the first assignment statement to create the new variable, Total.
    The values of InStock and BackOrder are added together to create a value for Total.
    Figure 7.7 below for a visual representation of how the PDV processes the first
    assignment statement.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '116 Chapter 7 • Understanding DATA Step Processing


    SAS processes the second assignment statement to create the new variable, SalePrice.
    The value of CostPerUnit is multiplied by 0.65, and the resulting value is added
    to the value of CostPerUnit to create a variable for SalePrice. See Figure 7.8
    for a visual representation of how the PDV produces the second assignment statement.


