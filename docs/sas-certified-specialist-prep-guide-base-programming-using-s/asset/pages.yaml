  md: '# Example: Multiple Arguments


    Here is an example of a function that contains multiple arguments. Notice that
    the arguments are separated by commas,


    ```

    mean(x1,x2,x3)

    ```


    The arguments for this function can also be written as a variable list.


    ```

    mean(of x1-x3)

