    # Example: Creating a Printable Table of Contents


    By default, ODS PDF does not create a printable table of contents, only a click-able
    bookmark tree. This example shows how to create a printable table of contents.


    ```

    html close;

    title "Create a Table of Contents";

    options nodate;\ods pdf file="MyDefaultToc.pdf" contents=yes bookmarklist=hide;

    proc freq data=sashelp.cars;

    tables origin*type;

    run;

    proc print data=sashelp.cars (obs=15);

    run;

    ods close;\ods html path="%qsysfunc(pathname(work))\";"

    ```


    The ODS PDF statement uses the following options:


    +   - The FILE=option specifies the PDF filename.

    - The CONTENTS=option specifies that a table of contents is created.

    - The BOOKMARKLIST-HIDE option specifies that a bookmark tree is created, but
    hidden.


