    # FIND Function


    # Overview of the FIND Function


    The FIND function enables you to search for a specific substring of characters
    within a specified character string.


    +   * The FIND function searches the string, from left to right, for the first
    occurrence of the substring, and returns the position in the string of the substring''s
    first character.

    * If the substring is not found in the string, the FIND function returns a value
    of 0.

    * If there are multiple occurrences of the substring, the FIND function returns
    only the position of the first occurrence.'
