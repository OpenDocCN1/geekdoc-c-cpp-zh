    # INTNX Function


    # Overview of the INTNX Function


    The INTNX function is similar to the ITCK function. The INTNX function applies
    multiples of a given interval to date, time, or datetime value and returns the
    resulting value. You can use the INTNX function to identify past or future days,
    weeks, months, and so on.


    Syntax, INTNX function:


    ```

    INTNX(''interval'',start-from,increment, <alignment>)

    ```


    +   * ''interval'' specifies a character constant or variable.

    * start-from specifies a starting SAS date, time, or datetime value.

    * increment specifies a negative or positive integer that represents time intervals
    toward the past or future.

    * ''alignment'' (optional) forces the alignment of the returned date to the beginning,
    middle, or end of the interval.


    Note: The type of interval (date, time, datetime) must match the type of value
    in start-from and increment.


    # Details


    When you specify date intervals, the value of the character constant or variable
    that is used in interval can be one of the following:


    +   * DATETIME

    * DAY

    * QTR

    * MONTH

    * SEMIMONTH

    * SEMIYEAR

    * TODAY

    * TIME

    * WEEK'
