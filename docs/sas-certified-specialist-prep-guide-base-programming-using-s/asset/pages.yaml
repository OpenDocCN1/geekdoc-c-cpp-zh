    When you assign a character constant as the value of the new variable, use the
    LENGTH statement to specify a length to avoid truncation of your values.


    Syntax, LENGTH statement:


    LENGTH variable(s)<$ length;


    +   * variable(s) names the variable or variables to be assigned a length.

    * $ is specified if the variable is a character variable.

    * length is an integer that specifies the length of the variable.


    Here is a variable list in which all three variables are assigned a length of
    $200.


    ```

    length Address1 Address2 Address3 $200;

    ```


    # Example: LENGTH Statement


    Within the program, a LENGTH statement is included to assign a length to accommodate
    the longest value of the variable TestLength. The longest value is Normal, which
    has six characters. Because TestLength is a character variable, you follow the
    variable name with a dollar sign ($).


    Make sure the LENGTH statement appears before any other reference to the variable
    in the DATA step.


    ```

    data stress;

    set set_stress;

    Total=time(min*60)+timec;

    remain Sumc 5400;

    sumc=totaltime;

    length TestLength $6;

    if totaltime>800 then testLength=''Long'';\else if 750<totaltime<800 then testLength=''Normal'';\else
    if totaltime>750 then TestLength=''Short'';

    ;

    ```


    Note: If the variable has been created by another statement, then later use of
    a LENGTH statement does not change its length.


    Now that the LENGTH statement has been added to the program, the values of TestLength
    are no longer truncated.'
