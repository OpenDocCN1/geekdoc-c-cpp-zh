    # **Selecting Variables**


    You might want to read and process variables that you do not want to keep in your
    output data set. In this case, use the DROP= and KEEP= data options to specify
    the variables to drop or keep.


    Use the KEEP= instead of the DROP= option if more variables are dropped than kept.


    Syntax, DROP=, and KEEP= data options:

    **(DROP=variable(s))**

    **(KEEP=variable(s))**


    +   * The DROP= or KEEP= options, in parentheses, follow the name of the data
    sets that contain the variables to be dropped or kept.

    * variable identifies the variables to drop or keep.


    # **Example: DROP Data Set Option**


    Suppose you want to use the TimeMin and TimeSec variables to calculate the total
    in the TotalTime variable, but you do not want to keep them in the output data
    set. You want to keep only the TotalTime variable. When you use the DROP data
    set option, the TimeMin and TimeSec variables are not written to the output data
    set:


    ```

    data work.stressert(drop=timmin timesec);

    set sort_test;

    if resthr<0 then delete;

    TotalTime(timmin*60)*timesec;

    retain SumSec 5400;

    sumsec+=totaltime;

    length TestLength$;nif totaltime>800 then TestLength=''Long'';

    else if 750<=totaltime<=800 then TestLength=''Normal'';

    ```'
