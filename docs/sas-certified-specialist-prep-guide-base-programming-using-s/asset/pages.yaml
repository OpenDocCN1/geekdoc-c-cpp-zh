    # Specifying Descriptive Statistics Keywords


    The default statistics in the MEANS procedure are n-count (number of nonmissing
    values), the standard deviation, and the minimum and maximum values of every numeric
    variable in a data set. However, you might need to compute a different statistic
    such as median or range of the values. Use the statistic keyword option in the
    PROC MEANS statement to specify one or more statistics to display in the output.


    Here are the available keywords in the PROC statement:


    **Table 15.1** Descriptive Statistics Keywords


    | Keyword | Description |

    | --- | --- |

    | CLM | The two-sided confidence limit for the mean. |

    | CSS | The sum of squares corrected for the mean. |

    | CV | The percent coefficient of variation. |

    | KURTOSIS | KURT | Measures the heaviness of tails. |

    | LCLM | The one-sided confidence limit below the mean. |

    | MAX | The maximum value. |

    | MEAN | The arithmetic mean or average of all the values. |

    | MIN | The minimum value. |'
  merge: -1
  pgno: 320
