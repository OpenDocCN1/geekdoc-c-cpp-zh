    |---|---|---||}{

    | 1 | 04MAR2012 | PAR | 146 |

    | 2 | 07MAR2012 | PAR | 155 |

    | 3 | 04MAR2012 | PAR | 146 |

    | 4 | 07MAR2012 | PAR | 155 |


    Notice that the PRINT statement still requires the LABEL option in order to display
    the permanent labels. Other SAS procedures display permanently assigned labels
    without additional statements or options.


    For more information about permanently assigning labels, see “Assigning Descriptive
    Labels” on page 100.


