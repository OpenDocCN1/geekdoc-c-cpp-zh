    > Note: The slash is enclosed in quotation marks. All character constants must
    be enclosed in quotation marks.


    Submitting this DATA step causes SAS to automatically convert the numeric values
    of Site to character values because Site is used in a character context. The variable
    Site appears with the concatenation operator, which requires character values.
    To explicitly convert the numeric values of Site to character values, you must
    use the PUT function in your assignment statement.


    Syntax, PUT function:


    ```

    PUT(source, format)

    ```


    +   * source indicates the numeric variable, constant, or expression to be converted
    to a character value

    * a format matching the data type of the source must also be specified, in this
    example:


    put(site,2.)


    Here are several facts about the PUT function.


    +   * The PUT function always returns a character string.

    * The PUT function returns the source written with a format.

    * The format must agree with the source in type.

    * Numeric formats right-align the result; character formats left-align the result.

    * When you use the PUT function to create a variable that has not been previously
    identified, it creates a character variable whose length is equal to the format
    width.


    When you use a numeric variable as the source, you must specify a numeric format.


    To explicitly convert the numeric values of Site to character values, use the
    PUT function in an assignment statement, where Site is the source variable. Because
    Site has a length of 2, choose 2 as the numeric format. The DATA step adds the
    new variable from the assignment statement to the data set.


    ```

    data work.newtemp;

    set cert.temp;

    Assignment=put(site,2)|''|''|dept;

    run;

    proc print data=work.newtemp;

    run;

    ```'
