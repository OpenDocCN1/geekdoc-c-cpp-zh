  md: "# Chapter 16 Creating Output\n\nSyntax, ODS PDF statement:\n\n```\nODS PDF\
    \ <id=identifier> <action>;\n```\n\n+   - <id=identifier> enables you to open\
    \ multiple instances of the same destination at the same time. Each instance can\
    \ have different options.\n  - identifier can be numeric or a series of characters\
    \ that begin with a letter or an underscore. Subsequent characters can include\
    \ letters, underscores, and numerals.\n  - action can be one of the following:\n\
    \    - CLOSE closes the destination and all files that are associated with it.\n\
    \    - EXCLUDE excludes ALL | NONE action excludes one or more output objects\
    \ from the destination.\n    - SELECT selects ALL | NONE action selects output\
    \ objects for the specified destination.\n\nNote: The default is NONE. A destination\
    \ must be open for this action to take effect.\n\nNote: The default is ALL. A\
    \ destination must be open for this action to take effect.\n\n+   - SHOW action\
    \ writes the current selection list or exclusion list for the destination to the\
    \ SAS log.\n\nNote: If the selection or exclusion list is the default list (SELECT\
    \ ALL), THEN SHOW writes the entire selection or exclusion list. The destination\
    \ must be open for this action to take effect.\n\nIn SAS Studio, the PDF destination\
    \ is open by default. In SAS Studio you must use the ODS PDF statement with at\
    \ least one action or option. When you do this, it opens another instance of a\
    \ PDF destination and creates PDF output.\n\n# The ODS Printer Family of Statements\n\
    \nThe ODS PDF statement is part of the ODS printer family of statements. Statements\
    \ in the printer family open the PCL, PDF, PRINTER, or PS destination, producing\
    \ output that is suitable for a high-resolution printer. The ODS PCL, ODS PRINTER,\
    \ and ODS PS statements are members of the ODS printer family of statements.\n\
    \n# Opening and Closing the PDF Destination\n\nYou can modify an open PDF destination\
    \ with many ODS PDF options. However, the FILE=SAS options perform the following\
    \ actions on an open PDF destination:\n\n+   - close the open destination referred\
    \ to in the ODS PDF statement\n- close any files associated with the open PDF\
    \ destination\n- open a new instance of the PDF destination\n\nNote: If you use\
    \ one of these actions, you should explicitly close the destination yourself.\n\
    \n# Working with the Table of Contents\n\nThe ODS PDF destination provides the\
    \ following navigation tools:\n\n+   - The default table of contents (TOC), which\
    \ is a clickable bookmark tree that is not printed."
