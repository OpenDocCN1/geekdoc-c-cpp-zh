    You can use the SUBSTR function to complete this modification. The syntax of the
    SUBSTR function, when used to replace a variable''s values, is identical to the
    syntax for extracting a substring.


    ```

    SUBSTR(argument, position, n)

    ```


    However, in this case, note the following:


    +   * The first argument specifies the character whose values are to be modified.

    * The second argument specifies the position at which the replacement is begin.

    * The third argument specifies the number of characters to replace. If n is omitted,
    all remaining characters are replaced.


    # Positioning the SUBSTR Function


    SAS uses the SUBSTR function to extract a substring or to modify a variable''s
    values, depending on the position of the function in the assignment statement.


    When the function is on the right side of an assignment statement, the function
    returns the requested string.'
