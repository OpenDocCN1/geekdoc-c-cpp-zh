  md: '# Constructing DO Loops


    # DO Loop Execution


    Here is how the DO loop executes in the DATA step. This example sums the interest
    that was earned each month for a one-year investment.


    ```

    data work.earnings;

    Amount=1000;

    Rate=0.75/12;

    do month=1 to 12;

    ernered=(amount+earned)*rate;

    end;

    run;

    ```


    This DATA step does not read data from an external source. When submitted, it
    compiles and executes only once to generate data. During compilation, the program
    data vector is created for the Work.Earnings data set.


    # Program Data Vector


    | | | | month | Earned |

    | * | * | * | * |


    When the data step executes, the values of Amount and Rate are assigned.


    # Program Data Vector


    | Amount | Rate | month | Earned |

    | 1 | 0.0625 | * | 0 |


    Next, the DO loop executes. During each execution of the DO loop, the value of
    Earned is calculated and is added to its previous value. On the 12th execution
    of the DO loop, the value of Month is incremented to 12 and the value of Earned
    is incremented to 1069.83.


    # Program Data Vector


    | Amount | Rate | month | Earned |

    | 1 | 1000 | 0.0625 | 12 | 1069.83 |


    After the 12th execution of the DO loop, the value of Month is incremented to
    13. Because 13 exceeds the stop value of the iterative DO statement, the DO loop
    stops executing, and processing continues to the next DATA step statement. The
    end of the DATA step reached, values are written to the Work.Earnings data set,
    and in this example, the data step ends. Only one observation is written to the
    data set.


    Figure 11.1 SAS Data Set Work.Earnings


    | Amount | Rate | month | Earned |

    | 1 | 1000 | 0.0625 | 13 | 1069.889918 |'
