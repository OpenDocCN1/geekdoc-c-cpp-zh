- img_proc: true
  md: "# 316 Chapter 15 • Producing Descriptive Statistics\n\n> TIP The CLASS statement\
    \ is easier to use than the BY statement because it does not require a sorting\
    \ step. However, BY-group processing can be more efficient when your queries contain\
    \ many levels.\n\n# Creating a Summarized Data Set Using the OUTPUT Statement\n\
    \nTo write summary statistics to a new data set, use the OUTPUT statement in the\
    \ MEANS procedure.\n\nSyntax, OUTPUT statement:\nOUT=sas-data-statistic=variable(s);\n\
    \n+   - OUT= specifies the name of the output data set.\n- statistic specifies\
    \ which statistic to store in the output data set. These variables represent\n\
    \ variable(s) specifies the names of the variables to create. These variables\
    \ for the analysis variables that are listed in the VAR statement.\nTip: You can\
    \ use multiple OUTPUT statements out=data sets.\n\nThe OUTPUT statement writes\
    \ statistics to a new SAS data set. By default, the summary statistics are produced\
    \ for all numeric variables or for those specified in the VAR statement. To specify\
    \ specific statistics to be produced in the new SAS data set, specify-output-statistic=variable-name\
    \ in the OUTPUT statement.\n\nThe example creates a PROC MEANS report.\n\n```\n\
    proc data=cert.diabetes;\nvar age height;\nclass;\noutput=work.diabetes_by_gender\n\
    mean=AvgAge AvgHeight AvgWeight\nmin=MinAge MinHeight MinWeight;\nrun;\nproc print\
    \ data=work.diabetes_by_gender noobs;\ntitle 'Diabetes Results by Gender';\nrun;\n\
    ```\n\n+   1 Specify the analysis variables. The VAR statement specifies that\
    \ PROC MEANS calculate the default statistics on the Age, Height, and Weight variables.\n\
    \n+   2 Specify subgroups for the analysis. The CLASS statement separates the\
    \ analysis by the values of Sex.\n\n+   3 Specify the output data options. The\
    \ OUTPUT statement creates the Work.By_Gender data set and writes the mean value\
    \ to the new variables AvgAge, AvgHeight, and AvgWeight. The statement also writes\
    \ the min value to the new variables, MinAge, MinHeight, and MinWeight.\n\n+ \
    \  4 Print the output set Work.Diabetes_By_Gender. The NOOBS option suppresses\
    \ the observation numbers."
  merge: -1
  pgno: 327
