    The following example uses multiple macro variables with character and numeric
    values. There are two %LET statements that are used to define two different macro
    variables. The first is a TITLE statement that contains character values. The
    other %LET statement contains numeric values. Notice that when you are referencing
    macro variables with characters, the ampersand (&) and the macro variable name
    are enclosed in double quotation marks, but the macro variables with numeric values
    are not.


