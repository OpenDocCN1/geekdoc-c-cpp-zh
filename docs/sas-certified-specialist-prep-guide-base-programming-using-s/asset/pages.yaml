  md: "# Example: Using the LIST Option\n\nAs in the previous example, the following\
    \ example creates a series of two-way tables with a table for each level of the\
    \ other variables. The variables WhiteCells and AG are the rows and columns that\
    \ are crosstabulated by the variable Survived. Use the LIST option in the TABLES\
    \ statement to make the PROC FREQ output easier to read. The output is generated\
    \ in a continuous list.\n\n```\nproc format;\n  value survive 0='Dead'\n     \
    \  1='Alive';\n\nrun;\n\nproc freq data=cert.leukemia;\n  tables Survived*AG*WhiteCells\
