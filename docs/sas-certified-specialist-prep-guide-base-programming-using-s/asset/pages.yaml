  md: '# Diagnosing Errors in the Execution Phase


    When SAS detects an error in the execution phase, the following can occur, depending
    on the type of error:


    +   - A note, warning, or error message is displayed in the SAS log.

    - The values that are stored in the PDV are displayed in the SAS log.

    - The processing of the step either continues or stops.


    # Debugging Data Errors


    Recall that data errors occur when data values are not appropriate for the SAS
    statements specified in a program. SAS detects data errors during program execution.
    When a data error is detected, SAS continues to execute the program.


    In general, SAS procedures analyze data, produce output, or manage SAS files.
    In addition, SAS procedures can be used to detect invalid data. In addition to
    the PRINT procedure showing missing values, the following procedures can be used
    to detect invalid data:


    +   - PROC FREQ

    - PROC MEANS


    The FREQ procedure detects invalid character and numeric values by looking at
    distinct values. You can use PROC FREQ to identify any variables that were not
    given an expected value.


    Syntax, FREQ procedure:


    ```

    PROC FREQ DATA=SAS-data-set <LEVELS>=;

    TABLES variable(s);

    RUN;

    ```


    +   - The LEVELS option displays a table that provides the number of distinct
    values for each variable that is named in the TABLES statement.

    - The TABLES statement specifies the frequency tables to produce based on the
    number of variables that are specified.


    In the following example, the data set contains invalid characters for the variables
    Gender and Age. PROC FREQ displays the distinct values of variables and is therefore
    useful for finding invalid values in data. You can use PROC FREQ with the TABLES
    statement to produce a frequency table for specific variables.


    ```

    proc freq data=cert.pats;

    tables Gender Age;

    run;

    ```


    In the following figures, notice the valid (M and F) and invalid (G) values for
    Gender, and the valid and invalid (202) values for Age. In both the Gender and
    Age FREQ tables, in one observation needs to be cleaned.'
  merge: -1
  pgno: 132
