  md: '# 276 Chapter 14 • Using Functions to Manipulate Data


    Syntax, DATDIF, and YRDIF functions:

    DATDIF(start_date,end_date,basis)

    YRDIF(start_date,end_date,basis))


    +   * start_date specifies the starting date as a SAS date value.

    * end_date defines the ending date as a SAS date value.

    * basis specifies a character constant or variable that describes how SAS calculates
    the difference.


    There are two character strings that are valid for basis in the DATDIF function,
    and four character strings that are valid for basis in the YRDIF function. These
    character strings and their meanings are learned in the table below.


    **Table 14.10** Character Strings in the DATDIF Function


    | Character String | Meaning | Valid in DATDIF | Valid in YRDIF |

    |---|---|---||

    | ''30/360'' | specifies a 30-day month and a 360-day year | yes | yes |

    | ''ACT/ACT'' | uses the actual number of days or years between dates | yes |
    yes |

    | ''ACT/360'' | uses the actual number of days between dates in calculating the
    number of years (calculated by the number of days divided by 360) | no | yes |

    | ''ACT/365'' | uses the actual number of days between dates in calculating the
    number of years (calculated by the number of days divided by 365) | no | yes |


    The best way to understand the different options for the basis argument is to
    see the different effects that they have on the value that the function returns.
    The table below lists four YRDIF functions that use the same start date and end
    date. Each function uses one of the possible values for basis, and each returns
    a different value.


    **Table 14.11** Examples of the YRDIF Function


    | Example Code | Returned Value |

    |---|---|

    | data _null_;

    x=yrdif(''16feb2016d'', ''16jun2018d'', ''30/360'');

    put x;

    run; | 2.3333333333 |

    | data _null_;

    x=yrdif(''16feb2016d'', ''16jun2018d'', ''ACT/ACT'');

    put x;

    run; | 2.33291114604 |'
