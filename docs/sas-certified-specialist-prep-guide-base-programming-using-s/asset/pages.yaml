    # Transposing BY Groups


    Use the BY statement in the PROC TRANSPOSE step to define and transpose BY groups.


    Syntax, BY statement:

    BY <DESCENDING> variable-1

    <NOTSORTED>;


    +   * variable specifies the variable that PROC TRANSPOSE uses to form BY groups.
    You can specify more than one variable. If you do not use the NOTSORTED option
    then the observations will be sorted by all the variables that you specify, or
    must be indexed appropriately. Variables in a BY statement are called BY variables.

    * DESCENDING specifies that the data set is sorted in descending order by variable
    that immediately follows the word DESCENDING in the BY statement.

    * NOTSORTED specifies that observations are not necessarily sorted in alphabetical
    or numeric order.


    The requirement for ordering or indexing observations using the values of variables
    is suspended for BY-processing when you use the NOTSORTED option. The procedure
    defines a BY group as a set of contiguous observations that have the same values
    for all BY variables. If observations with the same values for the BY variables
    are not contiguous, the procedure treats each contiguous set as a separate BY
    group.


    ```

    /* 1 */

    proc transpose data=cert.trials out=transtrials;

    var cholesterol trigly uric;

    id name;

    by testate;

    run;

    proc print data=transtrials3;

    run;

    /* 2 */

    /* 3 */

    /* 4 */

    /* 5 */ /

    ```


    +   1 Transtrials the data set. The OUT= option puts the results of the transposition
    in the Transtrials3 data set.

    2 The VAR statement specifies the Cholesterol, Trigly, and Uric variables as the
    only variables to be transposed.'
