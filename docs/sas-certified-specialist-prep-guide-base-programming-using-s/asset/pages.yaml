  md: '# Specifying Titles and Footnotes in Procedure Output


    # TITLE and FOOTNOTE Statements


    To make your report more meaningful and self-explanatory, you can assign up to
    10 titles with procedure output by TITLE statements before the PROC step. Likewise,
    you can specify up to 10 footnotes by FOOTNOTE statements before the PROC step.


    TIP Because TITLE and FOOTNOTE statements are global statements, place them anywhere
    or before the PRINT procedure. Titles and footnotes are assigned as soon as TITLE
    or FOOTNOTE statements are read; they apply to all subsequent output.


    Syntax, TITLE, and FOOTNOTE statements:

    TITLE<n> ''text'';

    FOOTNOTE<n> ''text'';


    n is a number from 1 to 10 that specifies the title or footnote line, and ''text''
    is the actual title or footnote to be displayed. The maximum title or footnote
    length depends on your operating environment and on the value of LINESIZE= option.


    The keyword TITLE is equivalent to TITLE1. Likewise, FOOTNOTE is equivalent to
    FOOTNOTE1. If you do not specify a title, the default title is the SAS System.
    No footnote is printed unless you specify one.


    As a best practice be sure to match quotation marks that enclose the title or
    footnote text.


    # Example: Creating Titles


    In the following example, the two TITLE statements are specified for lines 1 and
    3. These two TITLE statements define lines for the PROC output. You can create
    a blank line between two titles by skipping a number in the TITLE statement.


    ```

    title ''Heart Rates for Patients with:'';

    title ''Increased Stress Tolerance Levels'';


    proc print data=cert.stress;

    var resthr maxhr rech;

    where tolerance=''I'';


    run;

    ```'
