    # **Example: Finding the Year and Month**


    Suppose you want to create a subset of the data set Cert.Temp that contains information
    about all employees who were hired in November 2017. The data set Cert.Temp contains
    the beginning and ending dates for staff employment, but there are no month or
    year variables in the data set. To determine the year in which employees were
    hired, you can apply the YEAR function to the variable that contains the employee
    start date. Here is a way to write the YEAR function:


    ```

    year(startdate)

    ```


    Likewise, to determine the month in which employees were hired, you apply the
    MONTH function to StartDate.


    ```

    month(startdate)

    ```


    To create the new data set, you include these functions in a subsetting IF statement
    within a DATA step. The subsetting IF statement specifies the new data set include
    only the observations where the YEAR function extracts a value of 2017 and the
    MONTH function extracts a value of 11 for November.


    ```

    data work.nov17;

    set cert.temp;

    if year(startdate)=2017 and month(startdate)=11;

    run;

    ```


    When you add a PROC PRINT step to the program, you can view the new data.


    ```

    proc print data-work.nov17;

    format startdate enddate birthdate date9;

    run;

    ```


    The new data set contains information about only employees who were hired in November
    2017.'
