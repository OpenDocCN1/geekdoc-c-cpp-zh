    # # Creating a Basic Report


    To produce a simple list report, you first reference the library where your SAS
    data set is stored. You can also set system options to control the appearance
    of your reports. Then you submit a PROC PRINT step.


    Syntax, PROC PRINT step:


    ```

    PROC PRINT DATA=SAS-data-set;

    RUN;

    ```


    SAS-data-set is the name of the SAS data set to be printed.


    In the program, the PROC PRINT statement invokes the PRINT procedure and specifies
    the data set Therapy in the SAS library to which the libref Cert has been assigned.


    ```

    libname cert ''C:\Users\Student1\Cert'';

    proc print data=cert.therapy;

    ```


    Notice the layout of the resulting report below. These are the default behaviors:


    +   * All observations and variables in the data set are printed.

    * A column for observation numbers appear on the far left.

    * Variables and observations appear in the order in which they occur in the data
    set.


