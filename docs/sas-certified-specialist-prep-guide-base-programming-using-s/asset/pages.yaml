- img_proc: true
  md: 'Syntax, FIND function:


    ```

    FIND(string,substring<string>,startpos>)

    ```


    +   * string specifies a character constant, variable, or expression that is searched
    for substrings.

    * substring is a character constant, variable, or expression that specifies the
    substring of characters to search for string.

    * modifiers is a character constant, variable, or expression that specifies one
    or more modifiers.

    * startpos is an integer that specifies the position at which the search should
    start and the direction of the search. The default value for startpos is 1.


    Note: If string or substring is a character literal, you must enclose it in quotation
    marks.


    # Details


    The modifiers argument enables you to specify one or more modifiers for the function,
    as listed below.


    +   * The modifier causes the FIND function to ignore character case during the
    search. If this modifier is not specified, FIND searches for character strings
    with the same case as the characters in substring.

    * The modifier t trims trailing blanks from string and substring.


    Here are several facts about modifiers and constants.


    +   * If modifier is a constant, enclose it in quotation marks.

    * Specify multiples in a single set of quotation marks.

    * Modifier values are not case sensitive.


    If startpos is not specified, FIND starts the search at the beginning of the string
    and the search from the left to right. If startpos is specified, the absolute
    value of startpos determines the position at which to start the search. The sign
    of startpos determines the direction of the search. That is, when startpos is
    positive, FIND searches from startpos to the right. When startpos is negative,
    FIND searches from startpos to the left.


    # Example: Find Word Processing Jobs in a Data Set


    The values of the variable Job are all lowercase. Therefore, to search for the
    occurrence of word processing in the values of the variable Job, you write the
    FIND function as below. Note that the character substring is enclosed in quotation
    marks.


    ```

    find(job,''word processing'')

    ```


    To create the new data set, include the FIND function in a subset statement. Only
    those observations in which the function locates the string and returns a value
    greater than 0 are written to the data set.


    ```

    data work.datapool;

    set cert.temp;

    where find(job,''word processing'') > 0;

    run;


    proc print data=work.datapool;

    run;

    ```'
