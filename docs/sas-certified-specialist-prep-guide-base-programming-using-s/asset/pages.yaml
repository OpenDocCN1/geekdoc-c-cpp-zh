    # Correcting the Error: Missing Semicolon


    +   1. Find the statement that lacks a semicolon. You can usually find it by looking
    at the underscored keywords in the error message and working backward.

    2. Add a semicolon in the appropriate location.

    3. Resubmit the corrected program.

    4. Check the SAS log again to make sure there are no other errors.


    # Unbalanced Quotation Marks


    Some syntax errors, such as the missing quotation mark after HIGH in the program
    below, cause SAS to misinterpret the statements in your program.


    ```

    data work.admitfee;

    set cert.admit;

    where actelevel=''HIGH;

    run;

    proc print data=work.admitfee;

    var id name actelevel fee;

    run;

    ```


    When the program is submitted, SAS is unable to resolve the DATA step, and a STEP
    running message appears at the top of the active window.


    > TIP Both Enterprise Guide and SAS Studio add a final line of code to stop unbalanced
    quotation marks.


    Sometimes a warning appears in the SAS log that indicates the following:


    +   * A quoted string has become too long.

    * A statement that contains quotation marks (such as a TITLE or FOOTNOTE statement)
    is ambiguous because of invalid options or unquoted text.


    When you have unbalanced quotation marks, SAS is often unable to detect the end
    of the statement in it occurs. In Enterprise Guide or SAS Studio, simply add the
    balancing quotation mark and resubmit the program. However, in some environments,
    this technique usually does not correct the error. SAS considers the quotation
    marks to be unbalanced.


    Therefore, you need to resolve the unbalanced quotation mark by canceling the
    submitted statements (in the Windows and UNIX operating environments) or by submitting
    a line of SAS code (in the z/OS operating environment) after you recall, correct,
    and resubmit the program.


    # Correcting the Error in the Windows Operating Environment


    +   1. Press the Ctrl and Break keys or click the Break Icon on the toolbar.

    2. Select I. Cancel Submitted Statements, and then click OK.'
