    +   The PROC SORT steps the permanent SAS data set Cert.Admit the values of the
    variable Age within the values of the variable Weight. The OUT= option creates
    the temporary SAS data set Wgtadmit.


    +   The PROC PRINT prints a subset of the Wgtadmit data.


    +   The WHERE statement selects only the variables, Age, Height, and Fee to be
    printed in the output.


