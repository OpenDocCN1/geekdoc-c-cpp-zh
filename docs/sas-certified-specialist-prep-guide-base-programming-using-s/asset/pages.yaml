  md: '# Conditionally Executing DO Loops


    # Overview


    The iterative DO statement specifies a fixed number of iterations for the DO loop.
    However, there are times when you want to execute a DO loop until a condition
    is reached or a condition exists, but you do not know how many iterations are
    needed.


    Suppose you want to calculate the number of years required for an investment to
    reach $50,000. In the DATA step below, using an iterative DO statement is inappropriate
    because you are determining the number of iterations required for Capital to reach
    $50,000.


    ```

    data work.invest;

    do year=1 to ?;

    Capital+2000;

    capital+capital*.10;

    end;

    run;

    ```


    The DO WHILE and DO UNTIL statements enable you to execute DO loops based on whether
    a condition is true or false.


    # Using the DO Until Statement


    The DO until statement executes a DO loop until the expression becomes true.


    Syntax, DO UNTIL statement:


    ```

    DO UNTIL(expression);

    ...more SAS statements...

    ```


    END;


    expression is a valid SAS expression enclosed in parentheses.


    The expression is not evaluated at the bottom of the loop. Therefore, a DO UNTIL
    loop always executes at least once. When the expression is evaluated as true,
    the DO loop stops.


    Assume you want to know how many years it takes to earn $50,000 if you deposit
    $2,000 each year into an account that earns 10% interest. The DATA step below
    uses a DO UNTIL statement to perform the calculation until $50,000 is reached.
    Each iteration of the DO loop represents one year.


    ```

    data work.invest;

    do until(Capital>=50000);

    Capital+2000;

    capital+capital*.10;

    Year+1;

    end;

    run;

    ```


    Here is what happens during each iteration of the DO loop:'
