  md: 'Syntax, SAS/ACCESS XLSX LIBNAME statement:


    ```

    LIBNAME <libref>="physical-path-and-filename.xlsx"><options>;

    ```


    +   * libref is a name that you associate with an Excel workbook.

    * XLSX is the SAS LIBNAME name for an XLSX file format. The SAS/ACCESS LIBNAME
    statement associates a libref with an XLSX engine that supports the connections
    to Microsoft Excel 2007, and later files.


    Important: The engine name XLSX is required.


    When reading XLSX data, the XLSX engine reads mixed data (columns containing numeric
    and character values) and converts it to character values.

    The XLSX engine allows sequential reading of data only. Therefore, it does not
    support random access. It does not support tasks that require random access as
    the RANK procedure, which requires the reading of rows in a random order.


    +   * ''physical-path-and-filename.xlsx'' is the physical location of the Excel
    workbook.

    Example:

    libname results XLSX ''C:\Users\Student1\cert\exercise.xlsx'';


    Note: The XLSX engine requires quotation marks for physical-path-and-filename.xlsx.


