    | 30May2017 | DATE9 |

    | 30-May-2017 | DATE11 |


    # The TIMew. Informat


    The TIMew. informat reads values in the form hh:mm:ss.ss.


    Syntax, values read with TIMew. informat:

    hh:mm:ss.ss


    +   * hh is an integer from 0 to 23, representing the hour.

    * mm is an integer from 0 to 59, representing the minute.

    * ss.ss is an optional field that represents seconds and hundredths of seconds.


    If you do not enter a value for ss.ss, a value of zero is assumed. Here are some
    examples of time expressions that you can read using the TIMew. informat:


    # Table 13.4 Time Expressions and Corresponding SAS Time Informats


    | Time Expression | SAS Time Informat |

    |---|---|n| 17:00:01.34 | TIME11 |

    | 17:00 | TIME5.


    > Note: Five is the minimum acceptable field for the TIMew. informat. If you specify
    a w value less than 5, you will receive an error message in the SAS log.


    # The DATETIMEw. Informat


    The DATETIMEw. informat reads expressions that consist of two parts, a date value
    and a time value, in the form: ddmmmyy hh:mm:ss.ss.'
