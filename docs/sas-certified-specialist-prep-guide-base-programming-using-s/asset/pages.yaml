  md: '# Correcting Common Errors 63


    # The Basics of Logic Errors


    # The PUTLOG Statement


    A logic error occurs when the program statements execute, but produce incorrect
    results. Because no notes are written to the log, logic errors are often difficult
    to detect. Use the PUTLOG statement in the DATA step to write messages to the
    SAS log to help identify logic errors.


    Syntax, PUTLOG statement


    ```

    **PUTLOG**''message**;

    ```


    message specifies the message you want to write to the SAS log. It can include
    character literals, variable names, formats, and pointer controls.


    > Note: You can precede your message text with WARNING, MESSAGE, or NOTE to better
    identify the output in the log.


    The PUTLOG statement can be used to write to the SAS log in both batch and interactive
    modes. If an external file is open for output, use this statement to ensure that
    debugging messages are written to the SAS log and not to the external file.


    # Temporary Variables


    The temporary variables _N_ and _ERROR_ can be helpful when you debug a DATA step.


    | Variable | Description | Debugging Use |

    | _N_ | The number of times the DATA step iterated | Displays debugging messages
    for a specified number of iterations of the DATA step |

    | _ERROR_ | Initialized to 0, set to 1 when an error occurs | Displays debugging
    messages when an error occurs |


    # Example: The DATA Step Produces Wrong Results but There Are Error Messages


    The data contains three test scores and homework grades for four students. The
    program below is designed to select students whose average score is below 70.
    Although the program produces incorrect results, there are no error messages in
    the log.


    ```

    data.work.grades;

    set cert.class;

    Homework=Homework*2;

    AverageScore=MEAN(Score1 + Score2 + Score3 + Homework);

    if AverageScore<70;

    run;

    ```'
  merge: -1
  pgno: 74
