  md: '# Associating User-Defined Formats with Variables 233


    To define several formats, you can use multiple VALUE statements in a single PROC
    FORMAT step. In this example, each VALUE statement defines a different format.


    The SAS log notes informing you that the formats have been created.


    # Log 12.1 SAS Log


    | 146 | proc format lib=formlib; |

    | 147 | value gender 1 = ''Male'' |

    | 148 | 2 = ''Female'' |

    | 149 | NOTE: GENDER is already on the library FORTLIB.FORMATS. |

    | | NOTE: GENDER has already been output. |

    | 150 | value agegroup 13 < 20 = ''Teen'' |

    | 151 | 20 < 65 = ''Adult'' |

    | | 65 - HIGH = ''Senior''; |

    | | NOTE: AGEGROUP is already on the library FORTLIB.FORMATS. |

    | | NOTE: AGEGROUP has already been output. |

    | 152 | value col$ ''W'' = ''Moon White'' |

    | 153 | ''B'' = ''Sky Blue'' |

    | 154 | ''Y'' = ''Sunburst Yellow'' |

    | 155 | ''G'' = ''Rain Cloud Gray''; |

    | | NOTE: Format COL$ is already on the library FORTLIB.FORMATS. |

    | | NOTE: Format COL has already been output. |


    # Associating User-Defined Formats with Variables


    # How SAS Finds Format Catalogs


    To use the GENDER, AGEGROUP, and SCOL formats in a subsequent SAS session, you
    must assign the libref Formlib again.


    SAS searches for the formats GENDER, AGEGROUP, and SCOL in two libraries, in this
    order:


    +   - the temporary library referenced by the libref Formlib

    - a permanent library referenced by the libref Formlib


    SAS uses the first instance of a specified format that it finds.'
  merge: -1
