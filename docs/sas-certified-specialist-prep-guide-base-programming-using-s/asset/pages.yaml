  md: '# When to Use VALIDMEMNAME=System Option


    Use VALIDMEMNAME= EXTEND system option when the characters in a SAS data set name
    contain one of the following:


    +   - international characters


    +   - characters supported by third-party databases


    +   - characters that are commonly used in a filename


    # SAS Data Sets


    # Overview of Data Sets


    A SAS data set is a file that consists of two parts: a descriptor portion and
    a data portion. Sometimes a SAS data set also points to one or more indexes, which
    enable SAS to locate rows in the data set more efficiently. (The data set that
    are shown in this chapter do not contain indexes.) Extended attributes are user-defined
    attributes that further define a SAS Data set.


    **Figure 2.6** Parts of a SAS Data Set


    ![](img/4d880eb3a583bf2815ab53a244818659_28_0.png)


    # Descriptor Portion


    The descriptor portion of a SAS data set contains information about the data set,
    including the following:


    +   - the name of the data set


    +   - the date and time that the data set was created


    +   - the number of observations


    +   - the number of variables'
