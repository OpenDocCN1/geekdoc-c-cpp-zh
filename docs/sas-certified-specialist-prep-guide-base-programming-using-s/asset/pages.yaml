  md: '# Using System Options to Specify Observations


    SAS system options set the preferences for the SAS session. You can use the FIRSTOBS
    and OBS= options in an OPTIONS statement to specify the observations to process
    from SAS data sets.


    Specify either or both of these options as needed:


    +   - FIRSTOBS= starts processing at a specific observation.

    - OBS= stops processing after a specific observation.


    Note: Using FIRSTOBS= and OBS= together processes a specific group of observations.


    Syntax, FIRSTOBS=np, and OBS= options in an OPTIONS statement:


    ```

    FIRSTOBS=np

    OBS=np

    ```


    n is a positive integer. For FIRSTOBS, n specifies the number of the first observation
    to process. For OBS= n specifies the number of the last observation to process.
    By default, FIRSTOBS=1. The default value for OBS= is MAX, which is the largest
    signed, 8-byte integer that is representable in your operating environment. The
    number can vary depending on your operating system.


    To reset the number of the last observation to process, you can specify OBS=MAX
    in the OPTIONS statement.


    ```

    options OBS=max;

    ```


    This instructs any subsequent SAS programs in the SAS session to process through
    the last observation in the data that is being read.


    CAUTION:


    Each of these options applies to every input data set that is used in a program
    or SAS process because a system option sets the preference for the SAS session.


    # Examples: FIRSTOBS= and OBS= Options


    The following use the data set Cert.Heart, which contains 20 observations and
    8 variables.


    Example Code 2 Using the FIRSTOBS= Option


    ```

    options firstobs=10;      /*91*

    proc print data=cert.heart;   /*92*

    run;

    ```


    +   - Use the OPTIONS statement to specify the FIRSTOBS= option. In this example,
    the FIRSTOBS=10 enables SAS to read the 10th observation of the data set first
    and read through the last observation.


    +   - A total of 11 observations are printed using PROC PRINT step.


    Here is the output:'
  merge: -1
