    # Concatenating: Details


    # Concatenating Syntax


    Another way to combine SAS data sets with the SET statement is concatenating,
    which appends the observations from one data set to another data set. To concatenate
    SAS data sets, you specify a list of data sets in the SET statement.


    Syntax, DATA step for concatenating:


    ```

    DATA output-SAS-data-set;

    SET SAS-data-set-1 SAS-data-set-2;

    ```


    ```

    RUN;

    ```


    +   * output-SAS-data-set names the data set to be created.

    * SAS-data-set-1 and SAS-data-set-2 specify the data sets to concatenate.


    # How Concatenating Selects Data


    When a program concatenates data sets, all of the observations are read from the
    first data set listed in the SET statement. All of the observations are read from
    the second data set listed, and so on, until all of the listed data sets have
    been read. The new data set contains all of the variables and observations from
    all of the input data sets.


    ```

    data concat;

    set a c;

    run;

    ```'
