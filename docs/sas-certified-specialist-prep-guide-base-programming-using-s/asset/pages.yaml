    # Example: Finding the Year


    Suppose you want to create a subset of the data set Cert.Temp contains information
    about all employees who were hired during a specific year, such as 2016. Cert.Temp
    contains the dates when employees began with the company and their ending dates,
    there is no year variable.


    To determine in which year employees were hired, you can apply the YEAR function
    to the variable that contains the employee date, Start. You write the YEAR function
    as follows:


    ```

    year(startdate)

    ```


    To create the new data set, you include this in a subset IF statement within a
    DATA step. This subset IF statement specifies that only observations in which
    the YEAR function extracts a value of 2016 are placed in the new data set.


    ```

    data work.temp6;

    set cert.temp;

    if year(startdate)=2016;

    run;

    ```


    When you add a PROC PRINT step to the program, you can view the new data set.


    ```

    data work.temp6;

    set cert.temp;

    where year(startdate)=2016;

    run;

    proc print data=work.temp6;

    format startdate enddate birthdate date;

    ;

    ```


    The new data set contains information for only employees who were hired in 2016.


