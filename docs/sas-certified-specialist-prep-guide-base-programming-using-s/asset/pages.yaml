    The formats for each variable are applied before SAS adds the values to the PDV.


    # End of the DATA Step


    At the end of the DATA step, several actions occur. The first values in the PDV
    are written to the output data as the first observation.


    ```

    data work.update;

    set cert.invent;

    total=istock+backord;

    salePrice=(CostPerUnit*0.65)+CostPerUnit;

    format CostPerUnit SalePrice dollar6.2;

    run;

    ```


    # 7.9 Program Data Vector and Output Data Set


    | Item | IDNum | InStock | BackOrd | CostPerUnit | Total | SalePrice | _N | ERROR
    |

