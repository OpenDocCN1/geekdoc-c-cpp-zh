  md: "# The MEANS Procedure 315\n\n+   Unlike CLASS processing, BY-group processing\
    \ requires that your data already sorted or indexed in the order of the BY variables.\
    \ Unless data sets are already sorted, you must run the SORT procedure before\
    \ PROC MEANS with any BY group.\n\nCAUTION:\n\nIf you do not specify an output\
    \ data set by using the OUT= option, PROC SORT overwrites the initial data set\
    \ with newly sorted observations.\n\n+   The layout of BY-group results differs\
    \ from the layout of CLASS groups. Note that the BY statement in procedure below\
    \ creates four small tables; a CLASS statement would produce a single large table.\n\
    \n```\nproc sort data=work.heart out=work.heartsort;\n  by survey sex;\nrun;\n\
    proc means data=work.heart maxdec=1;\n  var heart cardiac urinary;\n  by survey\
