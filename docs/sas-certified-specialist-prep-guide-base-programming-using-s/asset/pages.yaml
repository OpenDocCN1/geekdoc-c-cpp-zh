  md: '# Using Permanently Assigned Labels


    When you use a LABEL statement within a PROC step, the label applies only to the
    output from that step.


    However, in PROC steps, you can use permanently assigned labels. Permanent labels
    can be assigned in the DATA step. These labels are saved with the data set, and
    can be reused by procedures that reference the data set.


    For example, the DATA step below creates the data set Cert.Paris and defines the
    label for the Variable Date. Because the LABEL statement is inside the DATA step,
    the labels are written to the Cert.Paris data set and are available to the subsequent
    PRINT procedure.


    ```

    data cert.paris;

    set cert.lagardia;

    where date=''PAR'' and (bordered=155 or bordered=146);

    label date=''Departure Date'';


    run;

    proc print data=cert.paris label;

    var dest bordered;

    run;

    ```


    Output 6.15 Using Permanently Labels


