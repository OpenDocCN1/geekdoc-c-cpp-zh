  md: '# 64 Chapter 5 Identifying and Correcting SAS Language Errors


    A glance at the data set shows that there should be students whose mean scores
    are below 70. However, the data set Work.Grades has zero observations and six
    variables.


    ```

    NOTE: There were 4 observations read from the data set

    CLASS.

    NOTE: The data set WORK.GRADES has 0 observations and 6 variables.

    NOTE: DATA statement used (Total process time):

    real time 0.01 seconds

    cpu time 0.01 seconds

    ```


    Use the PUTLOG statement to determine where the DATA step received incorrect instructions.
    Place the PUTLOG statement before the subset IF.


    ```

    PUTLOG Name= Score1= Score2= Score3= AverageScore=;

    ```


    ```

    24957 data work.grades;

    24958 set cert.class;

    24959 Homework=Homework*2;

    24960 AverageScore=MEAN(Score1+ Score2+ Score3 +);

    24961 putlog Name= Score1= Score2= Score3= Homework=

    24961! AverageScore=;

    24962 if AverageScore<70;

    24963 run;

    ```


    ```

    NAME-Linda Score1=53 Score2=60 Score3=66 Homework=84

    NAME-SARAH Score1=72 Score2=64 Score3=56 Homework=64

    AverageScore=256

    NAME-KATH Score1=98 Score2=82 Score3=100 Homework=96

    NAME-MICHAEL Score1=80 Score2=55 Score3=95 Homework=100

    AverageScore=330

    ```


    ```

    NOTE: There were 4 observations read from the data set

    CLASS.

    NOTE: The data set WORK.GRADES has 0 observations and 6 variables.

    NOTE: DATA statement used (Total process time):

    real time 0.01 seconds

    cpu time 0.01 seconds

    ```


    Looking at the code, you can see the result of the PUTLOG statement. The log shows
    that the variables were read in properly, and the variable Homework was adjusted
    to be the mean as Scores1-3. However, the values of AverageScore are incorrect.
    They are above the maximum grade.


    There is a syntax error in the line that calculates AverageScore: Instead of separating
    the three variables in the MEAN function, there are plus signs. Since functions
    can perform arithmetic operations, SAS simply added the four variables together,
    as instructed, and calculated the mean of a single number. That is why no observations
    had values of AverageScore below 70.


    To fix the error, replace the plus in the MEAN function with commas. You can remove
    the PUTLOG statement and use PROC PRINT statement to see your results.


    ```

    data work.grades;

    set cert.class;

    ```


    ![](img/4d880eb3a583bf2815ab53a244818659_75_0.png)'
