    # Deleting Unwanted Observations


    You can specify any executable SAS statement in an IF-THEN statement. For example,
    you can use an IF-THEN statement with a DELETE statement to determine which observations
    to omit as you read data.


    Syntax, DELETE statement:


    ```

    DELETE;

    ```


    To conditionally execute a DELETE statement, use the following syntax for an IF
    statement:


    ```

    IF expression THEN DELETE;

    ```


    +   * If it is true, execution stops for that observation. The DELETE statement
    deletes the observation from the output data set, and control and processing returns
    to the top of the DATA step.

    * If it is false, the DELETE statement does not execute, and processing continues
    with the next statement in the DATA step.


    # Example: IF-THEN AND DELETE Statements


    In the following example, the IF-THEN and DELETE statements omit any observations
    whose values for RestHR are below 70.


    ```

    data work.stressstest;

    set cert.tests;

    if resthr<70 then delete;

    TotalTime=(timin*60)+timesec;

    retain SumSec 5400;

    sumsec+totalime;

    length TestLength $6;

    if totalime>800 then TestLength=''Long'';

    else if 750<=totalime<=800 then TestLength=''Normal'';

    else if totalime<750 then TestLength=''Short'';

    run;

    proc print data=work.stressstest;

    run;

    ```'
