    # # Creating Subtotals for Variable Groups


    You might also want to group and subtotal numeric variables. You group variables
    using the BY statement. SAS classifies these groups BY. You can use the SUM statement
    to create a subtotal for values in groups.


    ```

    Syntax, BY in the PRINT procedure:

    BY <DESCENDING-<variable-name>>

    <DESCENDING-<variable-name>>

    <NOTSORTED>;

    ```


    +   - The DESCENDING option specifies that the data is sorted in descending order
    by the variable that immediately follows.

    - The NOTSORTED option specifies that the observations in the data that have the
    same BY values are grouped, but are not necessarily sorted alphabetically or numeric
    order. For example, the observations might be sorted in chronological order using
    a date format such as DDMMYY. If observations that have the same values for the
    BY variables are not contiguous, the procedure treats each contiguous set as a
    separate BY group.


    Note: The NOTSORTED option applies to all of the variables in the BY statement.
    You can specify the NOTSORTED option anywhere within the BY statement. The'
