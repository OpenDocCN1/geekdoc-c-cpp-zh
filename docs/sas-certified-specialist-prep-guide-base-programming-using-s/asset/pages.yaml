    \ |\n| > gt | greater than | income=20000 |\n| < lt | less than | x=5000\nx<8000\
    \ |\n| >= or ge | greater than or equal to | x=5000\nx>=2000 |\n| <= or le | less\
    \ than or equal to | pulse le 85 |\n\nUse logical operators to link a sequence\
