    # Creating Variables


    # Assignment Statements


    Use an assignment statement in any DATA step in order to modify existing values
    or create new variables.


    Syntax, assignment=expression;


    +   * variable names a new or existing variable

    * expression is the assignment valid SAS expression


    Tip: The assignment statement is one of the few SAS statements that do not begin
    with a keyword.


    For example, here is an assignment statement that assigns the character value
    Toby Witherspoon to the variable Name:

    Name=''Toby Witherspoon'';


    # SAS Expressions


    You use SAS expressions in assignment statements and many other SAS programming
    statements to do the following:


    +   * transform variables

    * create variables

    * conditionally process variables

    * calculate new values

    * assign new values


    An expression is a sequence of operands and operators that form a set of instructions.

    * Operands are variable names or constants. They can be numeric, character, or
    both.

    * Operators are special-character operators, grouping parentheses, or functions.


    # Using Operators in SAS Expressions


    Use the following arithmetic operators to perform a calculation.'
