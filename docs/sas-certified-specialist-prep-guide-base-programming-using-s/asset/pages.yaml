    # CATX Function


    # **Overview of the CATX Function**


    The CATX function enables you to concatenate character strings, removing leading
    and trailing blanks, and insert separators. The CATX function returns a value
    to a variable, or returns a value to a temporary buffer. The results of the CATX
    function are usually equivalent to those that are produced by a combination of
    the concatenation operator and the TRIM and LEFT functions.


    In the DATA step, if the CATX function returns a value to a variable that has
    not previously been assigned a length, the variable is given the length of 200.
    To save space, you can add a LENGTH statement to your variable. The LENGTH statement
    is placed before the appropriate length for your variable. The assignment statement
    that contains the CATX function so that SAS can specify the first time it encounters
    the variable.


    If the variable has not previously been assigned a length, the concatenation operator
    || returns a value to a variable. The variable''s length is the sum of the length
    of the values that are being concatenated. Otherwise, you can use the LENGTH statement
    before the assignment statement to assign a length.


    Recall that you use the TRIM function with the concatenation operator to create
    one address variable. The address variable contains the values of the three Addresses,
    City, and Zip. To remove extra blanks from the new values, use the DATA step shown
    below:


    ```

    data work.newaddress(drop=address city state zip);

    set cert.temp;

    NewAddress=trim(address)||'' ''||trim(city)||'' ''||zip;

    ;

    ```


    You can accomplish the same concatenation using only the CATX function.'
