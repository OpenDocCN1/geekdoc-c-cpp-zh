    The MEANS procedure can also be used to validate DATA because it produces summary
    reports that describe descriptive statistics. For example, PROC MEANS can show
    whether the values for a variable are within their expected range.


    Syntax, MEANS procedure:


    ```

    PROC MEANS DATA=sas-data-set <statistics>;\VAR variable(s);

    RUN;

