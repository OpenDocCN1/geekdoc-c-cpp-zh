    # Sorting Data


    # The SORT Procedure


    By default, PROC PRINT lists observations in the order in which they appear in
    your data set. To sort your report based on values of a variable, you must use
    PROC SORT to sort your data before using the PRINT procedure to create reports
    from the data.


    The SORT procedure does the following:


    +   * rearranges the observations in a SAS data set

    * creates a new SAS data set that contains the rearranged observations

    * replaces the original data set by default

    * can sort on multiple variables

    * can sort in ascending or descending order

    * treats missing values as the smallest possible values


    Note: PROC SORT does not generate printed output.


    ```

    Syntax, PROC SORT step:

    PROC SORT DATA=SAS-data-set <OUT=SAS-data-set>;nBY <DESCENDING> BY-variable(s);

    RUN;

    ```


    +   * The DATA= option specifies the data set to be read.

    * The OUT= option creates an output data set that contains the data in sorted
    order.

    * BY-variable(s) in the BY statement specifies one or more variables whose values
    are used to sort the data.

    * The DESCENDING option in the BY statement sorts observations in descending order.
    If you have more than one variable in the BY statement, DESCENDING applies only
    to the variable that immediately follows it.


    CAUTION:


    If you do not use the OUT= option, PROC SORT overwrites the data set that is specified
    in the DATA= option.


    # Example: PROC SORT'
  merge: -1
  pgno: 97
