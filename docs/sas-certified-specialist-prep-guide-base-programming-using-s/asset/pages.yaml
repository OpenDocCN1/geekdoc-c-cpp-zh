    # Create Two-Way and N-Way Tables


    The simplest crosstabulation is a two-way table. To create a two-way table or
    n-way table, join the variables with an asterisk (*) in the TABLES statement in
    a PROC FRE step. For a two-way table, one table is created. For n-way tables,
    a series of tables are produced with a table for each level of the variables.


    Syntax, TABLES statement for crosstabulation:


    ```

    TABLES variable-1 *variable-2 < ... variable-n>;

    ```


    Here are the options for two-way tables:


    +   * variable-1 specifies table rows.

    * variable-2 specifies table columns.


    Tip: You can include up to 50 variables in a single multi-way table request.


    When crosstabulations are specified, PROC FREQ produces tables with cells containing
    the following frequencies:


    +   * cell frequency

    * cell percentage of total frequency

    * cell percentage of row frequency

    * cell percentage of column frequency'
