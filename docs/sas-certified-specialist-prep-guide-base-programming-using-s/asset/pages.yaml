  md: '# 28 Chapter 3 • Accessing Data


    SAS engine is a set of internal instructions that SAS uses for writing to and
    reading from a SAS library or a third-party database. SAS can read or write these
    files using the appropriate engine for that file type. For some file types, you
    need to tell SAS engine to use. For others, SAS automatically chooses the appropriate
    engine.


    An example of an engine that accesses third-party data is the XLSX engine, which
    processes Microsoft Excel workbooks.


    # Accessing Stored Data


    If you use SAS/ACCESS software, you can use the LIBNAME statement to access data
    that is stored in a database management system (DBMS). The types of data you can
    access depend on your operating environment and on which SAS/ACCESS products you
    have licensed. For more information about SAS/ACCESS engines, see the SAS documentation
    for your DBMS.


    # Viewing SAS Libraries


    # Viewing Libraries


    Besides accessing library details with librefs, you can also see libraries in
    other environments. You can access a brief overview of the windows and menus for
    your environment at http://video.sas.com/. From Categories select How To Tutorials
    ⇨ Programming. Select the video for your SAS environment. Other tutorials are
    available from the SAS website.


    # Viewing Libraries Using PROC CONTENTS


    You can use the CONTENTS procedure to create SAS output that describes either
    of the following:


    +   * the contents of a library

    * the descriptor information for an individual SAS data set


    The default library is either Work or User depending on your SAS solution or environment.


    ```

    Syntax, PROC CONTENTS DATA=SAS-file-specification NODS;

    RUN;

    ```


    +   * SAS-file-specification specifies an entire library or a specific SAS data
    set within a library. SAS-file-specification can take one of the following forms:

    * <libref>SAS-data-name requests one SAS data set to process.

    * <libref>_ALL_ requests a list of all files in the library. (Use a period (.)
    to append _ALL_ to the libref).

    * NODS suppresses the printing of detailed information about each file when you
    specify _ALL_. (You can specify NODS only when you specify _ALL_)'
