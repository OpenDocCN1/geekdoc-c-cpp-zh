    # Target Variables


    A target variable is the variable to which the result of a function is assigned.
    In the statement below, the variable AvgScore is the target variable.


    ```

    AvgScore=mean(exam1,exam2,exam3);

    ```


    Unless the length of the target variable has been previously defined, a default
    length is assigned. The default length depends on the function; the default for
    character functions can be as long as 200.


    > Default lengths can cause character variables to use more space than necessary
    in your data set. So, when using SAS functions, consider the appropriate length
    for any character target variables. If necessary, add a LENGTH statement to specify
    a length for the character target variable before the statement that creates the
    values of that variable.


    # Converting Data with Functions


    # A word about Converting Data


    The following code automatically converts the variable PayRate from character
    to numeric.


    ```

    data work.newtemp;

    set cert.temp;

    Salary=payrate*hours;

    run;

    ```


    You can also use the INPUT function before performing a calculation. The INPUT
    function converts character data values to numeric values.


    You can use the PUT function to convert numeric values to character values.


    # Potential Problems of Omitting INPUT or PUT


    If you skip INPUT or PUT when converting data, SAS detects the mismatched variables
    and attempts an automatic character-to-numeric or numeric-to-character conversion.
    However, this is not always successful. Suppose each value of PayRate contains
    a dollar sign ($). When SAS tries to successfully convert the values of PayRate
    to numeric, the dollar sign blocks the process. The values cannot be converted
    to numeric values. Similar problems can occur with automatic numeric-to-character
    conversion.'
  merge: -1
  pgno: 267
