    # Accessing Your Practice Data


    # Requirements


    To complete examples in this book, you must have access to SAS Studio, SAS Enterprise
    Guide, or the SAS windowing environment.


    # Practice Data ZIP File


    The ZIP file includes SAS data sets, Microsoft Excel workbooks (.xlsx), CSV files
    (.csv), and TXT files (.txt) that are used in examples in this book. To access
    these files and create your practice data, follow the instructions below.


    # Instructions


    +   1. Navigate to support.sas.com/content/dam/SAS/support/en/books/data/base-practice-data.zip,
    download and save the practice data ZIP file.

    2. Unzip the file and save it to a location that is accessible to SAS.

    3. Open the cre8.data program in the SAS environment of your choice.

    * SAS Studio: In the Navigation pane, expand Files and Folders and navigate to
    the Cert folder within the practice-data folder.

    * SAS Enterprise Guide: In the Servers list, expand Servers ⇔ Local ⇔ Files, and
    navigate to the Cert folder in the practice-data folder.

    * SAS windowing environment: Click File ⇔ Open Program, and then navigate to the
    Cert folder in the practice-data folder.

    4. In the Path macro variable, replace /folders/myfolders with the path to the
    Cert folder and run the program.

    ```%let path=/folders/myfolders/cert;```'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'Important: The location that you specify for the Path macro variable and the
    location of your downloaded SAS programs should be the same location. Otherwise,
    the `cre8data.sas` program cannot create the practice data.


    Your practice data is now created and ready for you to use.


    **TIP** When you end your SAS session, the Path macro variable in the `cre8data.sas`
    program is reset. To avoid having to rerun `cre8data.sas` every time, run the
    `libname.sas` program from the Cert folder to restore the libraries.'
  merge: -1
