    3 The SET statement creates and concatenates the observations from Cert.Empdata,
    Cert.Empdata, and Cert.Empdata2 data sets in order.

    4 The WHERE statement selects observations from the SAS data sets Cert.Empdata,
    Cert.Empdata, and Cert.Empdata2 that have a value for Country that is equal to
    the value of the macro & Location The statement also selects observations that
    have a Salary greater than or equal to $30,000.

    5 The PROC SORT step sorts the SAS data set Work.Flightempdata by the variable
    Salary in descending order.

    6 PROC EXPORT exports the SAS data set Work.Flightempdata to a comma-separated
    file. The DATA= option identifies the input data set, and the OUTPUT= option specifies
    the path and filename for the delimited external file. The DBMS= option specifies
    the type of data to export (in this case CSV), and the REPLACE option overwrites
    an existing file.


