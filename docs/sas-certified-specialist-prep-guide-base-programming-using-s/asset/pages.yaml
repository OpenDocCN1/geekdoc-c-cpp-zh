    # Example: Viewing Execution in the SAS Log


    You can view the execution process in the SAS log. Use the PUTLOG statement to
    print the PDV in the SAS log. This enables you to view the execution process as
    the control goes from record to the next. You can also place the PUTLOG statement
    before the FORMAT statement to see how the variables are being populated.


    ```

    data work.update;

    set cert.invent;

    putlog ''PDV After Set Statement'';

    putlog _all_;

    total-instock-backorder;

    salePrice=(CostPerUnit*0.65)+CostPerUnit;

    format CostPerUnit SalePrice dollar 6.2;

