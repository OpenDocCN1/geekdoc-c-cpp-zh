  md: '# 320 Chapter 15 • Producing Descriptive Statistics


    | Option | Description |

    |---|---|

    | <ORDER=DATA | Specifies the order of the variable levels in the frequency and
    crostabulation tables, which you request in the TABLES statement.

    The ORDER= option can take the following values:

    DATA order of appearance in the input data set

    FORMATTED external formatted value, except for numeric variables with no explicit
    format, which are sorted by their unformatted (internal) value

    FREQ descending frequency count; levels with the most observations come first
    in the order

    INTERNAL unformatted value


    *Note: The ORDER= option does not apply to missing values, which are always ordered
    first.* |

    | PAGE | Displays only one table per page. Otherwise, PROC FREQ displays multiple
    tables per page as space permits.


    *Note: The PAGE option is not valid with the COMPRESS option.* |


    # Example: Creating a One-Way Frequency Table (Default)


