- img_proc: true
  md: '# Creating HTML Output with ODS 341


    Syntax, ODS HTML statement to create a linked table of contents:


    # ODS HTML


    ```

    BODY=body-file-specification

    CONTENTS=contents-file-specification

    FRAME=frame-file-specification;

    ODS HTML CLOSE;

    ```


    +   * body-file-specification is the name of an HTML file that contains the procedure
    output.

    * contents-file-specification is the name of an HTML file that contains a table
    of contents with links to the procedure output.

    * frame-file-specification is the name of an HTML file that integrates the table
    of contents and the body file. If you specify FRAME=, you must also specify CONTENTS=.


    > TIP To direct the HTML output to a specific storage location, specify the complete
    pathname of the HTML file in the *file-specification*.


    Here is an example that does the following:


    +   * THE BODY specification creates the file data.html in C:\Users\Student1\cert\
    directory. The body file contains the results of the two procedures.

    * THE CONTENTS specification creates the file toc.html in the C:\Users\Student1\cert\
    directory. The table of contents has links to each procedure output in the body
    file.

    * THE FRAME specification creates the file frame.html in the C:\Users\Student1\cert\
    directory. The frame file integrates the table of contents and the body file.


    ![](img/4d880eb3a583bf2815ab53a244818659_352_0.png)


    ```

    ods html body=''C:\Users\Student1\cert\data.html''

    contents=''C:\Users\Student1\cert\toc.html''

    frame=''C:\Users\Student1\cert\frame.html'';

    proc print data=cert.admit (obs=10) label;

    var sex age height weight actlevel;

    label actlevel=''Activity Level'';

    run;

    proc print data=cert.stress2 (obs=10);

    var resthr maxhr rechr;

    run;

    ods html close;

    ```'
  merge: -1
  pgno: 352
