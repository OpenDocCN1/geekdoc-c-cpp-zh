    # <REPLACE>


    overwrites an existing SAS data set. If you omit REPLACE, the IMPORT procedure
    does not overwrite an existing data set.


    Instead, use a SAS data step with the REPLACE=data option to replace a permanent
    data set.


    # <SAS-data-options>


    specifies SAS data options. For example, to assign a password to the result SAS
    data set, you can use the ALTER;, READ=, or WRITE= data options. To import only
    data that meets a specified condition, you can use the WHERE= data set option.


    Restriction You cannot specify data options when importing delimited, comma-separated,
    or tab-delimited excel files.


