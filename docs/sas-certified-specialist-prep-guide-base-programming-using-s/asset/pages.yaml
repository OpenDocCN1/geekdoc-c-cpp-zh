    Another way to exclude variables from a data set is to use the DROP or the KEEP
    statement. However, the DROP= and KEEP statements differ from the DROP- and KEEP-
    set options, these statements drop or keep variables.


    +   - You can use the DROP and KEEP statements in SAS procedure steps.

    - The DROP and KEEP statements apply to all output data sets that are named in
    the DATA statement. To exclude variables from some data sets but not from others,
    use the DROP= and KEEP= set options in the DATA statement.


    The KEEP statement is similar to the DROP statement, except that the KEEP statement
    specifies a list of variables to write to output data sets. Use the KEEP statement
    instead of the DROP statement if the number of variables to keep is smaller than
    the number to drop.


