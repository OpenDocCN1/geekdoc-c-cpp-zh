- img_proc: true
  md: "# Assigning Formats to Variables\n\nJust as SAS formats, you associate a user-defined\
    \ format with a variable in a FORMAT statement.\n\n```\ndata work.cars;\n   set\
    \ cert.cars;\n   format sex gender. Age agegroup. Color $col. Income Dollar$;\n\
    run;\n```\n\nRemember, you can place the FORMAT statement in either a DATA step\
    \ or a PROC step. By placing the FORMAT statement in a DATA step, you permanently\
    \ associate a format with a variable. Note that you do not have to specify a width\
    \ when using a user-defined format.\n\nWhen you submit the PRINT procedure, the\
    \ output for Work.CarSurvey shows descriptive labels instead of the values for\
    \ Age, Sex, Income, and Color.\n\n```\nproc print data=work.survey;\nrun;\n```\n\
    \n# Output 12.1 Work.CarSurvey Data Set with Formatted Values\n\n| Obs | Age |\
    \ Sex | Income | Color |\n|---|---|---|---||}{\n| 1 | Teen | Male | $14,000 |\
    \ Sunburst Yellow |\n| 2 | Adult | Male | $65,000 | Rain Cloud Gray |\n| 3 | Adult\
    \ | Female | $35,000 | Moon White |\n| 4 | Adult | Female | $44,000 | Sunburst\
    \ Yellow |\n| 5 | Adult | Female | $83,000 | Moon White |\n| 6 | Senior | Male\
    \ | $44,000 | Sky Blue |\n| 7 | Teen | Female | $15,000 | Rain Cloud Gray |\n\
    | 8 | Senior | Female | $33,000 | Sky Blue |\n\nWhen associating a format with\
    \ a variable, remember to do the following:\n\n+   - Use the same format name\
    \ in the FORMAT statement that you specified in the VALUE statement.\n- Place\
    \ a period at the end of the format name when it is used in the FORMAT statement.\n\
    \nIf you do not format all of a variable's values, then those that are not listed\
    \ in the VALUE statement are printed as they appear in the SAS data set. In the\
    \ example below, the value of 2 was not defined in the VALUE statement for GENDER\
    \ as shown in observation 3, 5, 7, and 8.\n\n```\nlibname formatlib 'C:\\student1\\\
    formats\\';\nproc format out=formatlib;\n   value gender\n      1 = 'Male';\n\
    \   value agegroup\n      13-< 20 = 'Teen'\n      20-< 65 = 'Adult';\n```"
  merge: -1
  pgno: 245
