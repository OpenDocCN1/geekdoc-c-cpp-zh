  md: "# Table 9.1 Arithmetic Operators\n\n| Operator | Action | Example | Priority\
    \ |\n|---|---|---|--|\n| - | negative prefix | negative=-; | 1 |\n| ** | exponentiation\
    \ | raise=x**; | 1 |\n| * | multiplication | mult=x*; | 2 |\n| / | division |\
    \ divide=x/y; | 2 |\n| + | addition | sum=x+y; | 3 |\n| - | subtraction | diff=x-y;\
    \ | 3 |\n\nThe order of operation is determined by the following conditions:\n\
    \n+   * Operations of priority 1 are performed before operations of priority 2,\
    \ and so on.\n* Consecutive operations that have the same priority are performed\
    \ in this order:\n    * from right to left within priority 1\n    * from left\
    \ to right within priority 2 and 3\n* You can use parentheses to control the order\
    \ of operations.\n\nNote: When a value is used with an arithmetic operator is\
    \ missing, the result of the expression is missing. The assignment statement assigns\
    \ a missing value to a variable if the result of the expression is missing.\n\n\
    Use the following comparison operators to express a condition.\n\n# Table 9.2\
