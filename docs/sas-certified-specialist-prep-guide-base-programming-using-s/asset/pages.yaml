    # # Subsetting Data


    # ### Using a Subsetting IF Statement


    The subsetting IF statement causes the DATA step to continue processing only those
    observations that meet the condition of the expression specified in the IF statement.
    The resulting SAS data set or data sets contain a subset of the original external
    file or SAS data set.


    Syntax, subsetting IF statement:


    ```

    IF expression;

    expression is any valid SAS expression.

    ```


    +   - If the expression is true, the DATA step continues to process that observation.

    - If the expression is false, no further statements are processed for that observation,
    and control returns to the top of the DATA step.


    # ### Example: Subsetting IF Statement


    The subsetting IF statement selects only observations whose values for Tolerance
    are D. It is Positioned in the DATA step for efficiency: other statements do not
    need to process unwanted observations.


    ```

    data work.stresstest;

    set cert.tests;

    if tolerance=''D'';

    TotalTime=(timemin*60)+timec;

    run;

    proc print data=work.stresstest;

    run;

    ```


    Because Tolerance is a character variable, the value D must be enclosed in quotation
    marks, and it must be the same case as in the data set.


    Notice that, in the output below, only the values where Tolerance contains the
    value of D are displayed and TotalTime was calculated.'
