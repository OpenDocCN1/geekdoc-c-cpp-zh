    # Modifying Character Values with Functions


    # SCAN Function


    # Overview of the SCAN Function


    The SCAN function returns the nth word from a character string. The SCAN function
    enables you to separate a character value into words and to return a specified
    word.


    Figure 14.2 SCAN Function


    ![](img/4d880eb3a583bf2815ab53a244818659_288_0.png)


    Note: In SAS 9.4 or later, if the variable has not been given a length, then the
    SCAN function returns the value and assigns the variable the length of the first
    argument. In SAS 9.3 or earlier, by default, the variable is assigned a length
    of 200.


    Syntax, SCAN function:

    SCAN(argument,<delimiters>>)


    +   * specifies the character variable or expression to scan.

    * specifies which word to return.

    * delimiters are special characters that must be enclosed in single quotation
    marks (''\''). If you do not specify delimiters, default delimiters are used.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# Details


    +   - Leading delimiters before the first word in the character string do not
    affect the SCAN function.

    - If there are two or more contiguous delimiters, the SCAN function treats them
    as one.

    - If $n$ is greater than the number of words in the character string, the SCAN
    function returns a blank value.

    - If $n$ is negative, the SCAN function selects the word in the character string
    starting from the end of the string.


    # Example: Create New Name Variables


    Use the SCAN function to create your new name variables for Cert.Staff. First,
    examine the values of the existing Name Variable to determine which characters
    separate the names in the values.


    ```

    LastName=scan(name,1);

    ```


    Notice that blanks and commas appears between the names and the employee''s last
    name appears first, then the first, and then the middle.


    To create the LastName variable to store the employee''s last name, you write
    an assignment statement that contains the following SCAN function:


    ```

    LastName=scan(name,1,'''','' '');

    ```


    Note that a blank and a comma are specified as delimiters. You can also write
    the function without limiting delimiters, because the blank and comma are default
    delimiters.


    ```

    LastName=scan(name,1);

    ```


    Here is the complete DATA that is needed to create LastName, FirstName, and MiddleName.
    Notice that the original variable is dropped from the new data set.


    ```

    data work.newnames(drop=name);

    set cert.staff;

    LastName=scan(name,1);

    FirstName=scan(name,2);

    run;

    ```


    # Specifying Delimiters


    The SCAN function uses delimiters to separate a character string into words. Delimiters
    are characters that are specified as word separators. For example, if you are
    working with the character string below and you specify the comma as a delimiter,
    the SCAN function separates the string into three words.


    ![](img/4d880eb3a583bf2815ab53a244818659_289_0.png)


    Then the function returns the word that you specify. In this example, if you specify
    the third word, the SCAN function returns the word HIGH.


    Here is another example that uses the comma as a delimiter, and specifies that
    the third word would be returned.


    209 RADCLIFFE ROAD, CENTER CITY, NY, 92716'
