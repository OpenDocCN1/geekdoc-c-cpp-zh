    # Modifying Numeric Values with Functions


    SAS provides additional functions to create or modify numeric values. These include
    arithmetic, financial, and probability functions. This book covers the following
    selected functions.


    # CEIL and FLOOR Functions


    To return integers that are greater than or equal to the argument, use these functions:


    +   - The CEIL function returns the smallest integer that is greater than or equal
    to the argument.

    - The FLOOR function returns the largest integer that is less than or equal to
    the argument.


    Syntax, CEIL and FLOOR function:

    CEIL(argument)

    FLOOR(argument)

    argument is a numeric variable, constant, or expression.


    If the argument is greater than 1E-12 of an integer, the function returns that
    integer.

    The following SAS statements produce this result:


    # Table 14.12 CEIL and FLOOR Functions


    | SAS Statement | Result |

    | --- | --- |

    | | CEIL Function Examples |

    | | a=3 |

    | | b=-2 |


    ```

    data _null_;

    var1=2;

    var2=-2;

    a=ceil(var1);

    b=ceil(var2);

    put "a=" a;

    put "b=" b;

    run;

    ```'
