    # Limiting Decimal Places with MAXDEC= Option


    By default, PROC MEANS uses the BESTw. format to display numeric values in the
    report.


    When there is no specification, SAS chooses the format that provides the most
    information about the value according to the available field width. At times,
    this can result in unnecessary decimal places, making your output hard to read.
    To limit decimal places, use the MAXDEC= option in the PROC MEANS statement, and
    set it equal to the length you prefer.


    Syntax, PROC MEANS statement with MAXDEC=:

    PROC MEANS <data=SAS-data-set> <statistic(s)> MAXDEC=n;

    s specifies the maximum number of decimal places.


    # Output 15.3. PROC MEANS Output of Cert.Diabetes with the MAXDEC= Option


    | Variable | Minimum | Maximum |

    | ID | 1128 | 9723 |

    | Age | 15 | 63 |

    | Height | 61 | 75 |

    | Weight | 102 | 240 |

    | Pulse | 65 | 100 |

    | FastGluc | 152 | 568 |

    | PostGluc | 206 | 625 |'
