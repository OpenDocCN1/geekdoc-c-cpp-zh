    # Date Constants


    You can assign date values to assignment statements using date constants. SAS
    converts a date constant to a SAS date. To represent a constant in SAS date format,
    specify the date as *ddmmmyyy* or *ddmmmyyyy*, immediately followed by a D.


    Syntax, date constant:


    ```

    *ddmmmyyy*

    ```


    or


    ```

    *ddmmmyyyy*

    ```


    +   - dd is one- or two-digit value for the day.

    - mmm is a three-letter abbreviation for the month (JAN, FEB, and so on).

    - yyyy is a two- or four-digit value for the year, respectively.


    Tip: Be sure to enclose the date in quotation marks.'
