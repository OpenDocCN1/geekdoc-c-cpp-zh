  md: '# Using SAS Macro Variables 165


    You reference the variable that you created by using the name of the macro variable
    with an ampersand (&). An example is &macro-variable.

    Note: If the macro variable has already been previously defined in the program,
    the value is replaced with the most current value.


    # Example: Using SAS Macro Variables with Numeric Values


    When referencing a SAS macro variable with numeric value, use the name of the
    macro variable with a preceding ampersand (&) and no quotation marks.


    ```

    $let Cyl_Count=5; /* #1 */

    proc print data=sashelp.cars;

    where Cylinders=&Cyl_Count; /* #2 */

    var Type Make Cylinders MSRP;

    run;

    proc freq data=sashelp.cars;

    where Cylinders=&Cyl_Count;

    tables Type;

    run;

    ```


    +   1. Use the %LET statement to create a macro variable named Cyl_Count that
    stores the value 5.

    2. To reference the macro variable Cyl_Count in your code, use an ampersand (&)
    and then the macro variable name. Doing so enables you to reference the value
    of Cyl_Count without repeatedly write out the full value.

