    +   * If the Excel worksheet within the workbook does not exist, SAS creates it.


    +   * If the Excel workbook and the worksheet already exist, then SAS overwrites
    the existing Excel workbook and worksheet.


    In the following example, use the SAS/ACCESS LIBNAME statement and the DATA step
