    - assigns tracking pointers to Clients and Amounts.


    # The Execution Phase: Match-Merging Observations


    After compiling the DATA step, SAS sequentially match-merge observations by moving
    the pointers down each observation of each data set and checking to see whether
    the BY values match.


    +   - If the BY values match, observations are read into the PDV in the order
    in the data sets appear in the MERGE statement. Values of any same-named variable
    are overwritten by values of the same-named variable in subsequent observations.
    SAS writes the combined observation to the new data set and retains the values
    in the PDV until the BY value changes in all the data sets.'
