    # # Error Messages


    # Types of Errors


    SAS can detect several types of errors. Here are two common ones:


    +   * syntax errors that occur when program statements do not conform to the rules
    of the SAS language

    * semantic errors that occur when you specify a language element that is not valid
    for a particular usage


    # Syntax Errors


    When you submit a program, SAS scans each statement for syntax errors, and then
    executes the step (if no syntax errors are found). SAS then goes to the next step
    and'
