  md: '# 296 Chapter 14 • Using Functions to Manipulate Data


    Figure 14.7 TRANWRD


    ![](img/4d880eb3a583bf2815ab53a244818659_307_0.png)


    ```

    NewSentence1=tranwrd(Sentence, ''hard'', ''easy'');

    ```


    ![](img/4d880eb3a583bf2815ab53a244818659_307_1.png)


    Syntax, TRANWRD function:


    ```

    TRANWRD(source,target,replacement)

    ```


    +   - source specifies the source string that you want to translate.

    - target specifies the strings that SAS searches for in.

    - replacement specifies the string that replaces target.


    Note: target and replacement can be specified as variables or character strings.
    If you specify character strings, be sure to enclose the strings in quotation
    marks ('' '' or ").


    In a DATA step, if the TRANWRD function returns a value to a variable that has
    not previously been assigned a length, that variable is given a length of 20 bytes.
    To save storage space, you can add a LENGTH statement to the DATA step and specify
    an appropriate length for the variable. SAS sets the length of a new character
    variable the first time it is encountered in the DATA step. Be sure to place the
    LENGTH statement before the assignment statements that contain the TRANWRD function.


    # Example: Update Variables in Place Using TRANWRD Function


    You can use TRANWRD function to update variables in place. In this example, the
    function updates the values of Monroe by changing every occurrence of the string
    to Manson.


    ```

    name=tranwrd(name, ''Monroe'', ''Manson'')

    ```


    Another example of the TRANWRD function is shown below. In this case, two assignment
    statements use the TRANWRD function to change all occurrences of Miss or Ms. to
    Ms.


    ```

    data work.after;

    set set.before;

    name=tranwrd(name, ''Miss'', ''Ms.'');

    name=tranwrd(name, ''Mrs.'', ''Ms.'');


    run;

    proc print data=work.after;

    run;

    ```


    The new data set is created. The TRANWRD function changes all occurrences of Miss
    or Ms to Ms.'
