    # Excluding Unmatched Observations


    # Overview


    By default, DATA step match-merging combines all observations in all input data
    sets.


    To exclude unmatched observations from your output data set, use the following
    in your DATA step:


    +   - Use the IN= set option to create and name a variable that indicates whether
    the data contributed to the current observation.

    - Use the subsetting IF statement to check the IN= values and write to the merged
    data set only matching observations


    # Identifying Observation in Both Data Sets


    To-merge the data sets using Cert.Patdat and Cert.Visit and select only observations
    that appear in both data sets, use IN= to create two temporary variables, Inpat
    and Invisit. The IN= variable is a temporary variable that is available to program
    statements during the DATA step, but it is not included in the output SAS data
    set.'
  merge: -1
  pgno: 207
- img_proc: true
  md: 'Syntax, IN= data set option:


    (IN= variable)


    +   - The IN= option, in parentheses, follows the data set name.

    - variable names names the variable to be created.


    Within the DATA step, the value of the variable is 1 if the data set contributed
    to the current observation. Otherwise, it is 0.


    The DATA step contains the IN= options appears below. The first IN= creates the
    temporary variable, Inpat, which is set to 1 when an observation from Cert.Patdat
    contributes to the current observation. Otherwise, it is set to 0. Likewise, the
    value of Invisit depends on whether Cert.Visit contributes to an observation or
    not.


    ```

    data work.merged;

    merge cert.patdat(in=inpat) cert.visit(in=invisit)

    rename=(date=BirthDate);

    by;

    run;

    ```


    # Matching Observations


    To select observations that appear in both Cert.Patdat and Cert.Visit, specify
    a subsetting IF statement in the DATA step.


    > To specify data set options for a given data set, enclose the options in a single
    set of parentheses.


    The subsetting IF statement checks the values of Inpat and Invisit and continues
    processing only those observations that meet the condition of the expression.
    The condition is that both Cert.Patdat and Cert.Visit contribute to the observation.
    If the condition is met, the new observation is written to Work.Merged. Otherwise,
    the observation is deleted.


    ```

    data work.merged;

    merge cert.patdat(in=inpat)

    rename=(date=BirthDate)

    cert.visit(in=invisit)

    rename=(date=VisitDate);

    by;

    if inpat=1 and invisit=1;

    run;

    proc print data=work.merged;

    run;

    ```


    In previous examples, Work.Merged contained 12 observations. In the output below,
    notice that only 10 observations met the condition in the IF expression.'
  merge: -1
  pgno: 208
