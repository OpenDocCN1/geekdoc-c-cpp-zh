  md: '# The Output Delivery System (ODS)


    # Overview of ODS


    The SAS Output Delivery System (ODS) gives you flexibility in generating, storing,
    and reproducing SAS procedure and DATA step output along with a wide range of
    formatting options.


    ODS allows you to create reports for popular software applications. For example,
    use the ODS PDF statement to create PDF files for viewing with Adobe Acrobat or
    for printing. With ODS, you easily create output in a variety of formats, including
    Microsoft Excel and Power Point, HTML, PDF, and RTF.


    # Opening and Closing ODS Destinations


    You use ODS statements to specify destinations for your output. Each destination
    specifies a type of formatted output. The following table lists some of the ODS
    destinations that are currently supported.


    | Destination | Result |

    | --- | --- |

    | Document | a hierarchy of output objects that enables you to render multiple
    ODS output without rerunning procedures. |

    | EXCEL | writes Excel spreadsheet files that are compatible with Microsoft Office
    2010 and later versions. |

    | HTML | output that is formatted in Hypertext Markup Language (HTML). You do
    not have to specify the ODS HTML statement to produce basic HTML output. |

    | Markup Languages Family | output that is formatted using markup languages such
    as Extensible Markup Language (XML). |

    | Output | SAS data sets. |

    | Printer Family (PDF, and so on) | output that is formatted for a high-resolution
    printer such as PostScript (PS), Portable Document Format (PDF), or Printer Control
    Language (PCL) files. |

    | RTF | Rich Text Format output. |


    This book covers the EXCEL, HTML, PDF, and RTF destinations.


    Note: SAS Studio has user interface controls to create and save HTML, PDF, and
    RTF ODS output.'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# Using Statements to Open and Close ODS Destinations


    # Syntax


    For each type of formatted output that you want to create, use an ODS statement
    to open the destination. At the end of your program, you use another ODS statement
    to close the destination so that you can access your output.


    Syntax, ODS statement to open and close destinations:


    ```

    ODS open-destination;

    ODS close-destination;

    ```


    +   * open-destination is a keyword, and any required options for the type of
    output that you want to create. Here are examples:

    * HTML FILE=''html-file-pathname''

    * LISTING

    * close-destination is a keyword for the type of output.


    You can issue ODS destinations in any order, depending on whether you need to
    open or close the destination. Most ODS destinations are closed by default. You
    open them at the beginning of your program and close them at the end. The exception
    is the HTML destination, which is open by default.


    Figure 16.1 Default ODS Destination


    ![](img/4d880eb3a583bf2815ab53a244818659_348_0.png)


    # Closing Multiple ODS Destinations at Once


    You can produce output in multiple formats at once once by opening each ODS destination
    at the beginning of the program.


    When you have more than one open ODS destination, you can use the keyword _ALL_
    in the ODS statement to close all ODS destinations at once.


    # Closing the HTML Destination


    Because open destinations use system resources, it is a good idea to close the
    HTML destination at the beginning of your program if you do not want to produce
    HTML output. Here is an example:'
  merge: -1
  pgno: 348
- img_proc: true
  md: 'ods html close;


    The HTML destination remains closed until you open your current SAS session or
    until you re-open it. It is good programming to reset the ODS destination to HTML
    output (the default setting) at the end of your programs.


    ods path=%&%sysfunc(pathname(work));


    # Creating HTML Output with ODS


    The ODS HTML Statement


    To create HTML output files in the file location using the default file-naming
    conventions, you do not have to specify the ODS HTML statement. However, to create
    HTML output with options specified, you open the HTML destination using the ODS
    HTML statement.


    Note: You do not have to specify the ODS HTML statement to produce basic HTML
    output unless the ODS destination is closed.


    Syntax, ODS HTML statement:

    ODS HTML BODY=file-specification;

    ODS HTML CLOSE;


    +   - a quoted string that contains the HTML filename (use only the filename to
    write the file to your current working directory, such as C:\Users\Student1\Documents
    and Settings\username\My SAS Files). Example: ODS HTML BODY="my.report";

    - a quoted string that contains the complete directory path and HTML filename
    (include the complete path if you want to save the HTML file to a specific location
    other than your working directory). Example: ODS HTML BODY="c:\Users\Student\report\my.report";n-
    a file (unquoted file shortcut) that has been assigned to an HTML file using the
    FILENAME statement="reportdir:my.report"; ODS HTML BODY=MYHTML;

    - a SAS catalog entry in the form entry-name.html. Note that the catalog name
    is specified in the PATH= and the entry-name.html value for the BODY=option is
    unquoted. Example: ODS HTML PATH=work.mycat BODY=mynentry BODY=bodyfile.html.


    > TIP FILE= also be used to specify the file that contains the HTML output. FILE
    is an alias for BODY.


    > TIP You also use the PATH=option to explicitly specify a directory path for
    your file.'
  merge: -1
  pgno: 349
- img_proc: true
  md: '# Example: Creating Output with PROC PRINT


    The following program creates PROC PRINT output in an HTML file. The ODS HTML
    BODY= option specifies the file C:\Users\Student1\cert\admit.html in the Windows
    operating environment as the file that contains the PROC PRINT results.


    ```

    ods html body=''C:\Users\student\cert\admit.html'';

    proc print data=cert.admit label;

    var sex age weight actlevel;

    label actlevel=''Activity Level'';

    run;

    ods html close;

    ods html path="%qsysfunc(pathname(work))";

    ```


    The HTML file admit.html contains the results of all procedure steps between the
    ODS HTML statement and ODS HTML CLOSE statement.'
  merge: -1
  pgno: 350
