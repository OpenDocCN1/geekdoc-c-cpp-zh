    # Modifying and Canceling Titles and Footnotes


    As global statements, the TITLE and FOOTNOTE statements remain in effect until
    you modify the statements, cancel the statements, or end your SAS session. In
    the following example, the titles and footnotes that are assigned to the PROC
    PRINT step also appear in the output for the PROC MEANS step.


    ```

    title ''Heart Rates for Patients with'';

    title3 ''Increased Stress Tolerance Levels'';

    footnote ''Data from Treadmill Tests'';

    footnote ''1st Quarter Admissions'';

    proc print data=cert.stress;

    var resstr maxhr rechr;

    where tolerance=''I'';

    run;

    proc means data=cert.stress;

    where tolerance=''I'';

    var resstr maxhr;

    run;

    ```'
