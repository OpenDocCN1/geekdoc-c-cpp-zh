- img_proc: true
  md: '# 232 Chapter 12 SAS Formats and Inforats


    +   - a list of unique values separated by commas, as 90,180,270 or ''B'', ''D'',
    ''F''. These values can be character or numeric values, not a combination of character
    and numeric values (because formats themselves are either character or numeric).


    When the specified values are character values, they must be enclosed in quotation
    marks and match the case of the variable''s values. The format''s name must also
    start with a dollar sign ($). The VALUE statement below defines the COL format,
    which displays the character values as text labels.


    ```

    proc format lib=fmtlib;

    value $col

    nW'' = ''Moon White''

    ''B'' = ''Sky Blue''

    ''Y'' = ''Sunburst Yellow''

    G'' = ''Rain Cloud Gray'';

    ```


    When the specified values are numeric values, they are not enclosed in quotation
    marks, and the format''s name should not begin with a dollar sign ($).


    # Specifying Value Ranges


    You can specify a non-inclusive range of numeric values using the less symbol
    (<) to avoid overlapping. In this example, the range of values from 0 to less
    than 13 is labeled as Child. The next range begins at 13, so the label Teenager
    would be assigned to 13 to 19.


    ```

    proc format lib=fmtlib;

    value agefmt

    0-13=''child''

    13-20=''teenager''

    20-65=''adult''

    65-100=''senior citizen'';

    ```


    You can also use the keywords LOW and HIGH to specify the lower and upper limits
    of a variable''s value range. The keyword LOW does not include missing numeric
    values. The keyword OTHER can be used to label missing values as well as any values
    that are not addressed in a range.


    ```

    proc format lib=fmtlib;

    value agefmt

    0-13=''child''

    13-20=''teenager''

    20-65=''adult''

    65-high=''senior citizen''

    other=''unknown'';

    ```


    > If applied to a label for displaying each range, the keyword includes missing
    character values.


    When specifying a label for displaying each range, remember to do the following:


    +   - Enclose the label in quotation marks.

    - Limit the label to 32,767 characters.

    - Use two single quotation marks if you want an apostrophe to appear in the label:

    000=''employee''''s jobtitle unknown'';'
  merge: -1
  pgno: 243
