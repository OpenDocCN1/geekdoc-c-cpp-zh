    # SCAN versus SUBSTR Functions


    The SUBSTR function is similar to the SCAN function. Here is a brief comparison.
    Both the SCAN and SUBSTR functions extract a substring from a character value:


    +   * SCAN extracts words within a value that is marked by delimiters.

    * SUBSTR extracts a portion of a value by starting at a specified location.


    The SUBSTR function is best used when you know the exact position of the string
    that you want to extract from the character value. It is unnecessary to mark the
    string by delimiters. For example, the first two characters of the variable ID
    identify the class level of college students. The position of these characters
    does not vary within the values of ID.'
