    # Rules for SAS Names


    By default, the following rules apply to the names of SAS data sets, variables,
    and libraries:


    +   - They must begin with a letter (A-Z, either uppercase or lowercase) or an
    underscore (_).

    - They can continue with any combination of numbers, letters, or underscores.

    - They can be 1 to 32 characters long.

    - SAS library names (librefs) can be 1 to 8 characters long.

    - Payroll

    - LABDATA2015_2018

    - _EstimatedTaxPayments3


    These are examples of valid data set names and variable names:


    # VALIDVARNAME=System Option


    SAS has various rules for variable names. You set these rules using the VALIDVARNAME=
    system option. VALIDVARNAME specifies the rules for valid SAS variable names that
    can be created and processed during a SAS session.'
