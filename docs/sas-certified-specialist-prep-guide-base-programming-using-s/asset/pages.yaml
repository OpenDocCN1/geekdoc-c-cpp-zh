  md: '# Selecting Variables


    # The VAR Statement


    By default, PROC PRINT lists all the variables in a data set. You can select variables
    and control the order in which they appear by using a VAR statement.


    Syntax, VAR statement:


    ```

    VAR variable(s);

    ```


    variable(s) is one or more variable names, separated by blanks.


    For example, the following VAR statement specifies that only the variables Age,
    Height, Weight, and Fee be printed, in that order:


    ```

    proc print data=cert.admit;

    var age weight fee;

    ```


