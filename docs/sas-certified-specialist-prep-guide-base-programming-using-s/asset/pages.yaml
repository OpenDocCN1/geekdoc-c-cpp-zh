    # RENAME Statement Syntax


    To prevent overwriting, you can rename variables using the RENAME= data set in
    the MERGE statement.


    Syntax, RENAME= data set:

    **(RENAME=(old-variable-name=new-variable-name))**


    +   * the RENAME= option, in parentheses, follows the name of each data set that
    contains one or more variables to be renamed

    * old-variable-name specifies the variable to be renamed.

    * new-variable-name specifies the new name for the variable.


    > TIP Use RENAME= to rename variables in the SET statement or in the output data
    that is specified in the DATA statement.


    # Example: Renaming Variables


    In the following example, the RENAME= option renames the variable Date in Cert.Birth
    to BirthDate, and it renames the date in Cert.Visit to VisitDate.


    ```

    data work.merged;

    cert.merge (rename=(date=BirthDate))

    cert.visit (rename=(date=VisitDate));

    id;

    run;

    proc print data=work.merged;

    run;

    ```


    The following output shows the effect of the RENAME= option.'
