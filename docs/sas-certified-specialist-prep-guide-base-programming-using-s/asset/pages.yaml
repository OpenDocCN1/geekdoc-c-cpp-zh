  md: '# Example: RETAIN Statement


    Suppose you want to add 5400 seconds (the accumulated total seconds from a previous
    treadmill stress test) to the variable SumSec in the StressTest data set when
    you create the data set. To initialize SumSec with the value 5400, use the RETAIN
    statement shown below. Now the value of SumSec begins at 5400 and increases by
    the value of TotalTime with each observation.


    ```

    data work.stresstest;

    set cert.tests;

    TotalTime=(timemin*60)+timesec;

    retain SumSec 5400;

    sumsec+totaltime;

    run;

    proc print data=work.stresstest;

    run;

    ```


    | SumSec | = | TotalTime | + | Previous Total |

    |---|---|---|---||}{

    | 5400 | | | | |

    | 6158 | = | 758 | + | 5400 |

    | 6763 | = | 605 | + | 6158 |

    | 7436 | = | 673 | + | 6763 |

    | 8018 | = | 582 | + | 7436 |

    | 8724 | = | 706 | + | 8018 |


    # Specifying Lengths for Variables


    Avoiding Truncated Variable Values


    During the compilation phase, use an assignment statement to create a new character
    variable. SAS allocates as many bytes of storage space as there are characters
    in the first value that it encounters for that variable.


    In the following figure, the variable TestLength has a length of four bytes. The
    word Short is truncated because the word Norm uses four bytes.'
