  md: '# Reading Dates and Times with Informats


    # Overview


    SAS date and time informats read date and time expressions and convert them to
    SAS date and time values. Like other SAS informats, date and time informats have
    several parts:


    +   - an informat name

    - a field width

    - a period delimiter


    SAS informat names indicate the form of date expression that can be read using
    that particular information. This chapter covers commonly used date and time informats
    such as these:


    +   - DATEw.

    - DATETIMMEw.

    - MMDYYYw.

    - TIMEw.


    There are several ways to represent a date. For example, all the following expressions
    represent the date October 15, 2017. Each of these common date expressions can
    be read using the appropriate SAS date informat.


    Table 13.1 Date Expressions and Corresponding SAS Date Informats


    | Date Expression | SAS Date Informat |

    | 10/15/17 | MMDYYYw. |

    | 15Oct17 | DATEw. |

    | 15–10–17 | DDMMYYYw. |

    | 17/10/15 | YYMMDDw. |


    # The MMDYYYw. Informat


    The informat MMDYYYw. reads date values in the form mmddyy or mmddyyyy..


    Syntax, values read with MMDYYYw. informat:


    ```

    mmddyy or mmddyyyy

    ```


    +   - mm is an integer between 01 and 12, representing the month.

    - dd is an integer between 01 and 31, representing the day.

    - yy or yyyy is an integer that represents the year.'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'In the MMDDDYw format, the month, day, and year fields can be separated by
    blanks or delimiters as - or /. If delimiters are present, they must occur between
    all fields in the values. Remember to specify a field width that includes not
    only the month, day, and year values, but any delimiters as well. Here are some
    date expressions that you can read using the MMDDDYw format.


    # Table 13.2 Date Expressions and Corresponding SAS Date Formats


    | Date Expression | SAS Date Informat |

    | --- | --- |

    | 101517 | MMDDDY6 |

    | 10/15/17 | MMDDDY8 |

    | 10 15 17 | MMDDDY8 |

    | 10-15-2017 | MMDDDY10 |


    The DDMDDYw format, and the YYMDDw format, are similar in that you can read the
    day, month, and year number with or without delimiters. The difference is the
    order of day, month, and year.


    # Example: Reading Dates with Formats and Inormats


    The following example illustrates reading a CSV file with dates in MMDDDY10 format.


    ```

    proc import datafile=''C:\Users\Student1\cert\new_hires.csv''

    out=new_whires

    dbms=csv

    replace;

    getnames=yes;

    run;

    proc print data=work.new_whires;

    run;

    proc contents data=work.new_whires;

    run;

    ```'
