  md: '# Converting Data with Functions 257


    Therefore, it is a recommended best practice to include INPUT and PUT functions
    in your programs to avoid data type mismatches and automatic conversion.


    # Automatic Character-to-Numeric Conversion


    By default, if you reference a character variable in a numeric context such as
    an arithmetic operation, SAS tries to convert the variable to numeric. For example,
    in the DATA step below, the character variable PayRate appears in a numeric context.
    It is multiplied by the numeric variable Hours to create a new variable Salary.


    ```

    data work.temp;

    set cert.temp;

    salary=payrate*hours;

    run;

    ```


    When this step executes, SAS automatically attempts to convert the character values
    of PayRate to numeric so that the calculation can occur. This conversion is completed
    by creating a temporary numeric value for each character value of PayRate. This
    temporary value is used in the calculation. The character values of PayRate are
    not replaced by numeric values.


    Whenever data is automatically converted, a message is written to the SAS log
    stating that the conversion has occurred.


    # Log 14.1 SAS Log


    ```

    9246 data work.temp;

    9247 set cert.temp;

    9248 salary=payrate*hours;

    9249 run;


    NOTE: Character values have been converted to numeric values at the places given

    by:

    (Line:8 9248)

    NOTE: There were 10 observations read from the data set CERT.TEMP.

    NOTE: The data set WORK.TEMP has 10 observations and 16 variables.

    NOTE: DATA statement used (Total process time):

    real time 0.00 seconds

    cpu time 0.00 seconds

    ```


    # When Automatic Conversion Occurs


    +   Automatic character-to-numeric conversion occurs in the following circumstances:

    - A character value is assigned to a previously defined numeric variable, such
    as the numeric Rate.

    - Rate=payrate;

    - A character value is used in an arithmetic operation.

    - Salary=payrate*hours;

    - A character value is compared to a numeric value, using a comparison operator.

    - if payrate>rate;

    - A character value is specified in a function that requires numeric arguments.

    NewRate=sum(payrate, raise);'
