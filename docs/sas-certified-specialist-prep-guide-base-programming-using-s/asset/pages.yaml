  md: '# The IMPORT Procedure


    # The Basics of PROC IMPORT


    The IMPORT procedure reads data from an external data source and writes it to
    a SAS data set. You can import structured and unstructured data using PROC IMPORT.
    You can import delimited files (blank, comma, or tab) along with Excel files.
    If you are using SAS 9.4, then you can import JMP 7 or later files as.


    When you run the IMPORT procedure, it reads the input file and writes the data
    to the specified SAS data set. By default, the IMPORT procedure expects the variables
    names to appear in the first row. The procedure scans the first 20 rows to count
    the variables, and it attempts to determine the correct input and format for each
    variable. You can use the IMPORT procedure statements to do the following:


    +   - indicate how rows SAS scans for variables to determine the type and length
    (GUESSING=)


    +   - modify how SAS extracts the variable names from the first row of the data
    set (GETNAMES=)


    +   - indicate at which row SAS begins to read the data (DATAROW=)


    When the IMPORT procedure reads a delimited file, it generates a DATA step to
    import the data. You control the results with options and statements that are
    specific to the input data source.


    The IMPORT procedure generates the specified output SAS data set and writes information
    about the import to the SAS log. The log displays the DATA step that is generated
    by the IMPORT procedure.


    # PROC IMPORT Syntax


    ```

    PROC IMPORT

    DATAFILE="filename" | TABLE="tablename"

    OUT=<libref. SAS-data-set><SAS-data-set-options>

    DBMS="identifier"<REPLACE>;

    ```


    DATAFILE="filename" | "fileref"

    specifies the complete path and fileref for the input PC file, spreadsheet, or
    delimited extension file. A fileref is a SAS name that is associated with the
    physical location of the output file. To assign a fileref, use the FILENAME statement.


    If you specify a fileref, complete path, and filename do not include special characters,
    then you can omit quotation marks.


    The IMPORT procedure does not support device types or access methods for the FILENAME
    statement except for DIS. For example, the IMPORT procedure does not support the
    TEMP type, which creates a temporary external file.


    The IMPORT can import data only if SAS supports the data type. SAS supports numeric
    and character types of data not (for example) binary objects. If the data that
    you want to import is type'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# Chapter 4 • Creating SAS Data Sets


    that SAS does not support, the IMPORT procedure may not be able to import correctly.
    In many cases, the procedure attempts to convert the data to the best of its ability.
    However, conversion is not possible for some types.


    Interactions By default, the IMPORT procedure reads delimited files as varying
    record-length files. If your external file has a fixed-length format, use the
    FILENAME statement to PROC IMPORT to specify the input file using RECM=F and LRECL=options.


    When you use a filer to specify a delimited file to import, the record length
    (LRECL) defaults to 256, unless you use the LRECL= option in the FILENAME statement.
    The maximum LRECL value that the IMPORT procedure supports is 32,767.


    For delimited files, the first 20 rows are scanned to determine the variable attributes.
    You can increase the number of rows scanned by the GUESSINGROWS= statement. All
    values are read as character strings. If a Date and Time format or a numeric informat
    is applied to the data value, the type is declared as numeric. Otherwise, the
    type remains character.


    OUT=<libref> SAS-data-set identifies the output SAS data set with either one or
    two-level SAS name (library and member name). If the specified SAS data set does
    not exist, the IMPORT procedure creates it. If you specify a one-level name, by
    default the IMPORT procedure uses the USER library (if assigned) or the WORK library
    (if USER is not assigned).


    A SAS data name can contain a single quotation mark when the VALIDMEMNAME=EXTEND
    system option is also specified. VALIDMEMNAME= expands the rules for the names
    of certain SAS members, such as a SAS data set name.


    If a SAS data name contains national characters or special characters, use The
    exceptions for special characters are: / * ? < > | : ~. Using VALIDMEMNAME= expands
    the rules for the name of certain SAS members, such as a SAS data set name. For
    more information, see [VALIDMEMNAME=System Option](on page 16).


    TABLE=<tablename> specifies the name of the input DBMS table. If the name does
    not include special characters (such as question marks), lowercase characters,
    or spaces, you can omit the quotation marks. Note that the DBMS table name may
    be sensitive.


    Requirement When you import a DBMS table, you must specify the DBMS= option.


    <DBMS=<identifier> specifies the type of data to import.


    Here are the common DBMS identifiers that are included with Base SAS:


    +   - CSV-separated values. For a comma-separated file with a .CSV extension,
    DBMS= is optional.

    - JMP JMP files. Use JMP 7 or later. Use DBMS=JMP to specify importing JMP files.
    JMP variable names can be up to 255 characters long. SAS supports importing JMP
    files that have more than 32,767 variables.'
