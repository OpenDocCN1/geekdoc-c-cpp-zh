- img_proc: true
  md: '# FREQ Procedure Syntax


    The FREQ procedure can include many statements and options for controlling frequency
    output.


    Syntax, FREQ procedure:


    ```

    PROC FREQ <options>;nRUN;

    ```


    The following table lists the options that are available in the PROC FREQ statement.


    | Option | Description |

    | --- | --- |

    | COMPRESS | Begins the display of the next one-way frequency table on the same
    page as the preceding one-way table if there is enough space to begin the table.
    By default, the next one-way table begins on the current page only if the entire
    table fits on that page.

    Note: The COMPRESS option is not valid with the PAGE option. |

    | DATA=SAS-data-set | Names the SAS-data-set to be analyzed by PROC FREQ. If you
    omit the DATA= option, the procedure uses the most recently created SAS data set.
    |'
  merge: -1
  pgno: 329
- img_proc: true
  md: "| Option | Description |\n| --- | --- |\n| FORMCHAR(1,2,7)=formchar-string\
    \ | Defines the characters to be used for constructing the lines and dividers\
    \ for the cells of crosstabulation table displays. The formchar-string should\
    \ be three characters long. The characters are used to draw the vertical separators\
    \ (position 1), the vertical separators (position 2), and the vertical-horizontal\
    \ intersections (position 7). If you do not specify FORMCHAR= option, PROC FREQ\
    \ uses FORMCHAR(1,2,7)* by default.\nDefault:\nPosition 1\n The characters are\
    \ used to draw vertical separators.\nPosition 2\n— The characters are used to\
    \ draw horizontal separators.\nPosition 7\n:+ The characters are used to draw\
    \ intersections of vertical and horizontal separators.\nSpecifying all blanks\
    \ for *formchar-string* produces crosstabulation tables with no outlines or dividers—for\
    \ example, FORMCHAR(1,2,7)=*. You can use any character in *formchar-string*,\
    \ including hexadecimal characters. If you use hexadecimal characters, you must\
    \ put an x after the closing quotation mark. |\n| NLEVELS | Displays the \"Number\
    \ of Variable Levels\" table, which provides the number of levels for each variable\
    \ named in the TABLES statements. |\n| NOPRINT | Suppresses the display of all\
    \ output output. You can use the NOPRINT option when you want to create only an\
