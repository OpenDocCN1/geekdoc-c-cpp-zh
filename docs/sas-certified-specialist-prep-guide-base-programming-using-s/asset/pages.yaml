  md: '# Chapter 5 • Identifying and Correcting SAS Language Errors


    ```

    /* 91 */

    data work.admitfee;

    set cert.admit;

    /* 92 */

    proc data=work.admitfee;

    var id name actlevel;

    /* 93 */

    ```


    +   1 Even there is no RUN statement after the DATA step, the DATA step executes
    there the PROC step as a step boundary.


    +   2 The PROC step does not execute. There is no following RUN statement for
    the step, nor is there a DATA or PROC step following the PROC PRINT step. Therefore,
    there is no indication that the step has ended.


    +   3 The RUN statement is necessary at the end of the last step. If the RUN statement
    is omitted from the last step, the program might not complete processing and might
    produce unexpected results.


    If you are programming in Enterprise Guide or SAS Studio, the system submits a
    RUN statement after every program that you submit, so the above program would
    execute normally.


    Note: Although omitting a RUN statement is not technically an error, it can produce
    unexpected results. A best practice is to always end a step with a RUN statement.


    To correct the error, submit a RUN statement at the end of the PROC step.


    ```

    run;

    ```


    # Missing Semicolon


    One of the most common errors is a missing semicolon at the end of a step. Here
    is an example:


    ```

    data work.admitfee;

    set cert.admit;

    run;

    proc data=work.admitfee;

    var id name actlevel fee;

    run;

    ```


    When you omit a semicolon, SAS reads the statement that lacks the semicolon (along
    with the following statement) as one long statement.


    # 5.7 SAS Log: Error Messages


    ```

    9240 proc print data=work.admitfee

    9241 var id name actlevel fee;


    22

