    You can use multiple LIBNAME statements to assign as many librefs as needed.


    # Verifying Librefs


    After assigning a libref, it is a good idea to check the libref to verify that
    the libref has been assigned successfully.


    # Log 3.1 Output for Cert Libref


    ```

    libname cert ''C:\Users\Student1\Cert'';

    NOTE: Libref CERT was successfully assigned as follows:

    Engine: VU

    Physical Name: C:\Users\Student1\Cert

    ```


    # How Librefs Remain in Effect


    The LIBNAME statement is global, which means the librefs remain in effect until
    changed or canceled, or until the SAS session ends.


    By default, the LIBNAME statement assigns the libref for the current SAS session
    only. Each time you begin a SAS session, you must assign a libref to each permanent
    SAS library that contains files that you want to access in that session. (Remember
    that the default libref is for a temporary SAS library.)


    # Specifying Two-Level Names


    After you assign a libref, you specify it as the first element in the two-level
    name for SAS file.


    In order for the PRINT procedure to read cert.admit, you specify the two-level
    name of the file as follows:


    ```

    proc print data=cert.admit;

    run;

    ```


    # Referencing Third-Party Data


    You can use the LIBNAME statement to reference not only SAS files but also files
    that were created with other software products, such as database management systems.'
