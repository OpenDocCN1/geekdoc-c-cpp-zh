    \      ;\n```\n\nLabels can be up to 256 characters long. Enclose the label in\
    \ quotation marks.\nTip: The LABEL statement applies only to the PROC step in\
    \ which it appears.\n\n# Example: Using the LABEL Option in the PROC PRINT Statement\n\
    \nIn the PROC PRINT step below, the variable name WalkJogRun is displayed with\
