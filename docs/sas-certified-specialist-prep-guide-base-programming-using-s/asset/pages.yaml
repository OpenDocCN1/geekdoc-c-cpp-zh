    When PROC IMPORT reads data, SAS IMPORT the value of each variable in the DATA
    step to missing at the beginning of each cycle execution, with these exceptions:


    +   - variables that are named in a RETAIN statement

    - variables that are created in a sum statement

    - automatic variables


    In contrast, when reading variables from a SAS data set, SAS sets the variables
    to missing only before the first cycle execution of the DATA step. The variables
    retain their values until new values become available (for example, by an assignment
    statement or through the next execution of a SET or MERGE statement). Variables
    that are created with options in a SET or MERGE statement also retain their values
    from one cycle of execution to the next.


    # End-of-File Marker


    The execution phase continues in this manner until the end-of-file marker is reached
    in the input data file. When there are no more records in the input data file
    to read, the data portion of the new data set is complete and the DATA step stops.


