  md: '# Manipulating SAS Date Values with Functions 271


    # DATE and TODAY Functions


    # Overview of the DATE Function


    The DATE function returns the current date as a numeric SAS date value.


    > Note: If the value of the TIMEZONE system option is set to a time zone name
    or time zone ID, the return values for date and time are determined by the time
    zone.


    Syntax, DATE function:


    DATE ()


    The DATE function does not require any arguments, but it must be followed by parentheses.


    The DATE function produces the current date in the form of a SAS date value, which
    is the number of days since January 1, 1960.


    # Overview of the TODAY Function


    The TODAY function returns the current date as a numeric SAS date value.


    > Note: If the value of the TIMEZONE system option is set to a time zone name
    or time zone ID, the return values for date and time are determined by the time
    zone.


    Syntax, TODAY function:


    TODAY ()


    The TODAY function does not require any arguments, but it must be followed by
    parentheses.


    The TODAY function produces the current date in the form of a SAS date value,
    which is the number of days since January 1, 1960.


    # Example: The DATE and TODAY Functions


    The DATE and TODAY functions have the same form and can be used interchangeably.
    To add a new variable, which contains the current date, to the data set Cert.Temp.
    To create this variable, write an assignment statement as the following:


    ```

    EditDate=date();

    ```


    After this is added to a SAS step and the step is submitted, the data set contains
    EditDate is created. To display these date values in a different form, you can
    associate a SAS format with the values. For example, the FORMAT statement associates
    the DATE9 format with the variable EditDate. The output that is created by this
    PROC PRINT appears below.


    > Note: For this example, the SAS date values were created before submitting this
    program on July 20, 2018.


    ```

    data work.template;

    set cert.dates;

    EditDate=date();

    run;

    nproc print data=work.template;

    format EditDate date9;

    run;

    ```'
