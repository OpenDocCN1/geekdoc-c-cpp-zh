    # COMPBL Function


    The COMPBL function removes multiple blanks from a character string by translating
    each occurrence of two or more consecutive blanks into a single blank.


    Syntax, COMPBL function:

    COMPBL(source)


    +   - source specifies a character constant, variable, or expression to compress.


    If a variable is not assigned a length before the COMPBL function returns a value
    to the variable, the variable given is the length of the first argument.


    The following SAS statements produce these results:


    | SAS Statement | Result |

    |---|---|

    | data _null_; Hey Diddle Diddle |

    string=''Wey''; |

    Diddle''; |

    string=compbl(string); |

    put string; |

    run; | |\|data _null_; 125 E Main |

    string=''125 E Main St''; |

    length address $10; |

    address=compbl(string); |

    put address; |

    run; |


    # COMPRESS Function


    Overview of the COMPRESS Function


    The COMPRESS function returns a character string with specified characters removed
    from the original string. Null arguments are allowed and treated as a string with
    a length of zero.'
