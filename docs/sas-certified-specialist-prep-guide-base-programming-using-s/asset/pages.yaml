  md: '# Referencing an External Data File


    # Using a FILENAME Statement


    Use the FILENAME statement to point to location of the external file that contains
    the data.


    Filerefs perform the same function as librefs: they temporarily point to a storage
    location for data. However, librefs reference SAS libraries, whereas filrefs reference
    external files.


    Syntax, FILENAME statement:


    +   - FILENAME *fileref* is a name that you associate with an external file. The
    name must be one eight characters long, begin with a letter or underscore, and
    contain only letters, numbers, or underscores.

    - ''*filename*'' is the fully qualified name or location of the file.


    # Defining a Fully Qualified Filename


    The following FILENAME statement temporarily associates the fileref with the external
    file that contains the data from the exercise stress tests. The complete filename
    is specified as: C:\Users\student1\cert\exercise.txt in the Windows operating
    environment.


    ```

    filename exercise ''C:\Users\student1\cert\exercise.txt'';

    ```


    # Referencing a Fully Qualified Filename


    When you associate a fileref with an individual external file, you specify the
    fileref in subsequent SAS statements and commands.


    Figure 4.1 Referencing a Fully Qualified Filename


    ![](img/4d880eb3a583bf2815ab53a244818659_45_0.png)'
