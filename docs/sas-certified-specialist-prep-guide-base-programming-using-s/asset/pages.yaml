    # One-to-One Reading: Details


    # One-to-One Reading Syntax


    Use multiple SET statements in a DATA step to combine data sets. One-to-one reading
    combines rows from two or more data sets by creating rows that contain all of
    the columns from each contributing data set. Rows are combined based on their
    relative position in each data set. That is, the first row in one data set is
    combined with the first in the other, and so on. The program stops after it has
    read the last row from the smallest data set.


    Syntax, DATA step for one-to-one reading:


    ```

    DATA output-SAS-data-set;

    SET SAS-data-set-1;

    SET SAS-data-set-2;


    ```


    +   * output-SAS-data-set names the data set to be created.

    * SAS-data-set-1 and SAS-data-set-2 specify the data sets to be read.


    # How One-to-One Reading Select Data


    The following statements are true when you perform one-to-one reading:


    +   * The new data set contains all the variables from all the input data sets.
    If the data sets contain variables that have the same names, the values that are
    read from the last data set overwrite the values that were read from earlier data
    sets.

    * The number of observations in the new data set is the smallest original data
    set. Observations are combined based on their relative position in each data set.
    That is, the first observation in one data set is joined with the first'
