  md: '# Examples: Logical Operators


    The following examples use IF-THEN statements with logical operators:


    +   Use the AND operator to execute the THEN statement if expressions that are
    linked by AND are true.


    ```

    if status=''OK'' and type=3

    then Count+1;

    if (age=agecheck | time=3)

    & error-1 then Test-1;

    ```


    +   Use the OR operator to execute the THEN statement if either is linked by OR
    is true.


    ```

    if (age=agecheck | time=3)

    & error-1 then Test-1;

    if status=''S'' or cond=''E''

    then Control=''Stop'';

    ```


    +   Use the NOT operator for others to reverse the logic of a comparison.


    ```

    if not (loghours>7500)

    then Schedule=''Quarterly''

    if region not in (''NE'', ''SE'')

    then Bonus=200;

    ```


    +   Character values must be specified in the case in which they are set and must
    be enclosed in quotation marks.


    ```

    if status=''OK'' and type=3

    then Count+1;

    if status=''S'' or cond=''E''

    then Control=''Stop'';

    if not (loghours>7500)

    then Schedule=''Quarterly''

    if region not in (''NE'', ''SE'')

    then Bonus=200;

    ```


    Logical comparisons that enclosed in parentheses are evaluated as true or false
    before they are compared to other expressions. In this example, the OR comparison
    in parentheses is evaluated before the first expression and the AND operator are
    evaluated.


    Figure 9.3 Example of a Logical Comparison


    ![](img/4d880eb3a583bf2815ab53a244818659_164_0.png)


    ```

    if test>=95 and (theme=''A'' or project=''A'')

    then grade=''A+'';

    ```


    Therefore, be careful when using the OR operator in a series of comparisons. Remember
    that only one comparison in a series of OR comparisons must be true to make a
    condition true, and any nonzero, not missing constant is always evaluated as true.
    Therefore, the following subsetting IF statement is always true:


    ```

    if x=1 or 2;

    ```'
