  md: "# Specifying Variables Using the VAR Statement\n\nBy default, the MEANS procedure\
    \ generates statistics for every numeric variable in a data set. The typical focus\
    \ is on just a few variables, particularly if the data set is large. It makes\
    \ sense to exclude certain types of variables. The values of a numeric identifier\
    \ variable ID, for example, are unlikely to yield useful statistics.\n\nTo specify\
    \ the variables that PROC MEANS analyzes, add a VAR statement and list the variable\
    \ names.\n\nSyntax, VAR statement:\n\n```\nVAR variable(s);\n```\n\nvariable(s)\
    \ lists numeric variables which to calculate statistics.\n\n```\nproc means data=cert.diabetes\
    \ min max maxdec=0;\n  var height weight;\n  run;\n```\n\nOutput 15.4 Specifying\
    \ Variables in the PROC MEANS Output of Cert.Diabetes\n\n| Variable | Minimum\
    \ | Maximum |\n|---|---|--|\\| Age | 15 | 63 |\n Height | 61 | 75 |\n Weight |\
    \ 102 | 240 |\n\nIn addition to listing variables separately, you can use a numbered\
    \ range of variables.\n\n```\nproc means data=cert.survey mean stderr maxdec=2;\n\
    \  var item1-item5;\n  run;\n```\n\nOutput 15.5 PROC MEANS Output of Cert.Survey\
    \ with Variable Range\n\n| | Mean | Std Error |\n|---|---|--|\n Item1 | 3.75 |\
    \ 0.63 |\n Item2 | 3.00 | 0.82 |\n Item3 | 4.25 | 0.25 |\n Item4 | 3.50 | 0.65\
    \ |\n Item5 | 3.00 | 0.82 |\n\n# Group Processing Using the CLASS Statement\n\n\
    You often want statistics for groups of observations, rather than for the entire\
    \ data set. For example, census numbers are more useful when grouped by region\
    \ than when viewed as a national total. To produce analyses of grouped observations,\
    \ add a CLASS statement to the MEANS procedure."
  merge: -1
  pgno: 324
- img_proc: true
  md: '# 314 Chapter 15 Producing Descriptive Statistics


    Syntax, CLASS statement:

    CLASS variable(s);


    variable(s) specifies category variables for group processing.


    CLASS variables are used to categorize data. CLASS variables can be either character
    or numeric, but they might contain a limited number of discrete values that represent
    meaningful groupings. If a CLASS statement is used, then the N Obs statistic is
    calculated. The N Obs statistic is based on the CLASS variables, as shown in the
    output below.


    The output of the program shown below is grouped by variables and Sex. The order
    of the variables in the CLASS statement determines their order in the output table.


    ```

    proc means data=cert.heart maxdec=1;

    var heart cardiac urinary;

    class survive sex;

    run;

    ```


