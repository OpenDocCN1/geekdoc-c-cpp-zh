- img_proc: true
  md: '# Example: Determining the Report Layout


    The order in which the variables appear in the TABLES statement determines the
    order in which they are listed in the PROC FREQ report.

    Consider the SAS data set Cert.Loans. The variables Rate and Months are categorical
    variables, so they are the best choices for frequency tables.


    ```

    proc freq data=cert.loans;

    tables rate months;

    run;

    ```


