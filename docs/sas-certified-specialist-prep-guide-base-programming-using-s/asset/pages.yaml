- img_proc: true
  md: '# Chapter 5 • Identifying and Correcting SAS Language Errors


    repeats the process. Syntax errors, as misspelled keywords, generally prevent
    SAS from executing the step in which the error occurred.


    Notes are written to the SAS log when the program finishes executing. When a program
    contains an error is submitted, messages about the error appear in the SAS log.
    Here is what SAS does:


    +   - displays the word ERROR

    - identifies the possible location of the error

    - gives an explanation of the error


    # Example: Syntax Error Messages


    The following program contains a syntax error:


    ```

    data work.admitfee; /* # */

    set cert.admit;

    run;

    proc print data=work.admitfee; /* # */

    var id name actlevel fee; /* # */

    run;

    ```


    +   1 The SAS keyword PRINT creates a new SAS data set named Work.Admitfee from
    the Cert.Admit data set.

    2 The SAS keyword PRINT PROC PRINT is spelled incorrectly. As a result, the PROC
    step fails.

    3 The VAR statement prints the values for the following variables only: ID, Name,
    ActLevel, and Fee.


    When the program is submitted, messages in the SAS log indicate that the procedure
    PRIN was not found and SAS stopped the PROC because of errors. No output is produced
    by the PRINT procedure, because the second step fails to execute.


    Here is an explanation of the notification of the error.


    +   - The ERROR keyword in the SAS log is the possible location of the error in
    the statement.

    - The error explanation is not found.


    # Log 5.1 SAS Log


    265 proc print data.work.admitfee;

    ERROR: Procedure PRIN not found.

    268 var id name actlevel fee;

    267 run;

    NOTE: The SAS System processing this step because of errors.


    > Errors in your statements or data might not be evident when you look at results
    in the Results viewer. Review the messages in the SAS log each time you submit
    a SAS program.


    In addition to correcting spelling mistakes, you might need to resolve other common
    syntax errors as these:


    +   - missing RUN statement'
