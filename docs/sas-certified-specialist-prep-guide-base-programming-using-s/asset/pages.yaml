    - the name of the Excel worksheet that are used in a program that reads Excel
    data and creates a SAS data set from an Excel worksheet.


    The table below outlines the basic statements for reading Excel data and creates
    a SAS data set from an Excel worksheet. PROC CONTENTS and PROC PRINT statements
    are not requirements for reading Excel data and creating a SAS data set. However,
    these statements are useful for confirming that your Excel data has successfully
    been read into SAS.


    Table 4.1 Basic Steps for Reading Excel Data into a SAS Data Set


    | Task | Statement | Example |

    |---|---|--|

    | Reference an Excel workbook file | SAS/ACCESS LIBNAME statement | LIBNAME cert

    libname cert xlsx

    ''C:\Users\Student\exercise.xlsx''; |

    | Write out the contents of the SAS Library | PROC CONTENTS | proc contents data=cert._all_;
    |

    | Execute the PROC CONTENTS statement | RUN statement | run; |

    | Name and create a new SAS data set | DATA statement | data work.stress; |

    | Read in an Excel worksheet (as the input data for the new SAS data set) | SET
    statement | set cert.Acte; |

    | Execute the DATA step | RUN statement | run; |

    | View the contents of a particular data set | PROC PRINT | proc print data=stress;
    |

    | Execute the PROC PRINT statement | RUN statement | run; |


