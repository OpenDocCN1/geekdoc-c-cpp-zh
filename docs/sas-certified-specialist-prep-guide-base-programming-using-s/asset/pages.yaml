    # PROPCASE Function


    The PROPCASE function converts all words in an argument to proper case (so that
    the first letter in each word is capitalized).


    Syntax, PROPCASE function:

    **PROPCASE(argument<-<delimiter>)**


    +   *argument* can be any SAS expression, such as a character variable or constant.

    * *delimiter* specifies one or more delimiters that are enclosed in quotation
    marks. The default delimiters are blank, forward slash, hyphen, open parenthesis,
    period, and tab.

    Note: If you specify delimiter(s), then the default delimiters are no longer in
    effect.


    +   * The PROPCASE function first converts all letters to lowercase letters and
    converts the first character of words to uppercase.'
