  md: '# PROC FORMAT Statement


    To begin a PROC FORMAT step, you use a PROC FORMAT statement.


    Syntax, PROC FORMAT statement:

    **PROC FORMAT <options>;**

    options includes the following:


    +   - LIBRARY=<libref> specifies the libref for a SAS library to store a permanent
    catalog of user-defined formats

    - FMLIB displays a list of all the formats in your catalog, along with descriptions
    of their values.


    Anytime use PROC FORMAT to create a format, the format is stored in a permanent
    catalog. If the SAS library does not already contain a format catalog, SAS automatically
    creates one. If you do not specify the LIBRARY=, the formats are stored in a default
    format catalog named Work.Formats.


    The libref Work signifies that any format that is stored in Work.Formats; it exists
    only for the current SAS session.


    # Permanently Storing Your Formats


    To stores in a permanent format catalog named Formlib.Formats:


    +   - Specify a LIBNAME statement that associates the libref with the permanent
    SAS library in which the format catalog is to stored.

    libname formlib ''c:\sas\formats\lib'';

    - Specify the LIBRARY= option in the PROC FORMAT statement and specify the libref
    formlib.


    ```

    PROC FORMAT LIBRARY=formlib;

    ```


    The Library= option accepts a libref and a catalog in the format library.format.
    When the LIBRARY= option specifies a libref and not a catalog, PROC FORMAT uses
    the catalog formats.


    When you associate a user-defined format with a variable in a subsequent DATA
    or PROC step, use the Library lib to reference the location of the format catalog.


    Any format that you create in this PROC FORMAT step is now stored in a permanent
    format catalog named Formlib.Formats.


    ```

    libname formlib ''C:\Users\Student1\formats\lib'';

    proc format library=formlib;

    ...more statements...

    run;

    ```


    In the program above, the catalog Formlib.Formats is located in the SAS library

    C:\Users\Student1\formats\lib, which is referenced by the libref Formlib.


    Notice that LIB= is an acceptable abbreviation for the LIBRARY= option.

    proc format lib=formlib;'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# Defining a Unique Format


    The VALUE Statement

    Use the VALUE statement to define a format for displaying one or more values.


    Syntax, VALUE statement:

    VALUE format-name

    range1=''label1''

    range2=''label2''

    ...more format-names;;


    The following are true about format-name:


    +   * A format name must begin with a dollar sign ($) if the format applies to
    characters.

    * A format name must be a valid SAS name.

    * A format name cannot be the name of an existing SAS format.

    * A format name cannot end in a number.

    * A format name does not end in a period when specified in a VALUE statement.

    * A numeric format name can be up to 32 characters long.

    * A character name can be up to 31 characters long.


    Tip: If you are running a version of SAS prior to SASv9, the format name must
    be a SAS name up to eight characters long and cannot end in a number.


    Notice that the statement begins with the keyword VALUE and ends with a semicolon
    after all the labels have been defined. The following VALUE statements create
    the GENDER, AGEGROUP, and SCOL formats specify descriptive labels that are later
    assigned to the variables Sex, Age, and Color respectively:


    ```

    proc format;

    value gender

    1 = ''Male''

    2 = ''Female'';

    value agegroup

    13 - 20 = ''Teen''

    20 - 65 = ''Adult''

    65 - HIGH = ''Senior'';

    value $col

    ''W'' = ''Moon White''

    ''B'' = ''Sky Blue''

    ''Y'' = ''Sunburst Yellow''

    ''G'' = ''Rain Cloud Gray'';

    run;

    ```


    The VALUE range specifies the following types of values:


    +   * a single value, such as 24 or ''b''

    * a range of numeric values, such as 0-1500

    * a range of character values enclosed in quotation marks, such as ''A''-''M'''
  merge: -1
