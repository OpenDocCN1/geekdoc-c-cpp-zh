    # # SAS Libraries


    SAS library is a collection of one or more SAS files, including SAS data sets,
    that are referenced and stored as a unit. In a directory-based operating environment,
    a SAS library is a group of SAS files that are stored in the same directory. In
    z/OS, a SAS library is a group of SAS files that are stored in an operating environment
    file.


    # # Assigning Librefs


    The first step in setting up your SAS session is to define the libraries. You
    can use programming statements to assign library names.


    To reference a permanent SAS file:


    +   1. Assign a name (libref) to the SAS library in which the file is stored.

    2. Use the libref as the first part of the two-level name (libref.filename) to
    reference the file within the library.'
