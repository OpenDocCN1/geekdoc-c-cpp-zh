    # Using FIRSTOBS= and OBS= for Specific Data Sets


    Using the FIRSTOBS= or OBS= system options determines the first or last observation,
    respectively, that is read for all steps for the duration of your current SAS
    session until you change the setting. However, you can still do the following:


    +   * override these options for a given data set only

    * apply these options to a specific data set only


    To affect any single file, use FIRSTOBS= or OBS= as data options instead of using
    them as system options. You specify data options in parentheses immediately following
    the input data name set.


    > A FIRSTOBS= or OBS= specification from a data option overrides the corresponding
    FIRSTOBS= or OBS= system option, but only for DATA step.


    # Example: FIRSTOBS= and OBS= as Data Set Options


    As shown in the following example, this program processes only observations through
    15, for a total of 6 observations:


    ```

    options firststobs=10 obs=15;

    proc print data=clinic.heart;

    run;

    ```'
