    # The EX Procedure


    # The Basics of PROC EXPORT


    Note: The EXPORT procedure is available for Windows, UNIX, or LINUX operating
    environments.


    The EXPORT procedure reads data from a SAS data set and writes it to an external
    data source. In Base SAS 9.4, external data sources include delimited and JMP
    files. In delimited files, a delimiter can be a blank, comma, or tab that separates
    columns of data values. If you have a license for SAS/ACCESS Interface to PC Files,
    you can also export'
  merge: -1
  pgno: 367
- img_proc: true
  md: '# The EXPORT Procedure 357


    to additional file formats, such as a Microsoft Access database, Microsoft Excel
    workbook, DBF file, and Lotus spreadsheets.

    The EXPORT procedure uses one of these methods to export data:


    +   - generated DATA step code

    - generated SAS/ACCESS code


    # PROC EXPORT Syntax


    You control the results with options and statements that are specific to the output
    data source. The EXPORT procedure generates the specified output file and writes
    information about the export to the SAS log. The log displays the DATA step or
    the SAS/ACCESS code that the EXPORT procedure generates.


    Syntax, PROC EXPORT statement:

    PROC EXPORT DATA=<libref>/SAS-data-set

    OUTFILE="filename"

    <DBMS=identifier>;

    <REPLACE>;


    +   - libref;SAS-data-set identifies the input SAS data set with either a one-
    or two-level SAS name (library and member name). If you specify a one-name library,
    by default, the EXPORT procedure uses the USER library (if assigned) or the WORK
    library.

    - If you do not specify a data set to export, the EXPORT procedure uses the most
    recently created SAS data set. SAS keeps track of the data sets with the system
    variable LAST_. To be that the EXPORT procedure uses the correct data set, you
    should identify the data set.

    - filename specifies the complete path and filename or a referf for the output
    PC file, spreadsheet, or delimited file.

    - If you specify a referf, or the complete path and filename do not include special
    characters (such as the backslash in a path), lowercase characters, or spaces,
    you can omit the quotation marks.

    - identifier specifies the type of data to export. To export to a DBMS table,
    you must specify the DBMS option by using a valid identifier. For DBMS=DLM, the
    delimiter character is a space. However use DELIMITER=''char'' statement within
    the EXPORT procedure to define a specific delimiter character.

    - REPLACE overwrites an existing file. If you do not specify REPLACE, the EXPORT
    procedure does not overwrite an existing file.


    The following values are valid for the DBMS identifier:


    Table 16.1 DBMS Identifiers Supported in Base SAS


    | Identifier | Output Data Source | Extension |

    |---|---|---|

    | CSV | Delimited file (comma-separated values) | .csv |

    | DLM | Delimited file (default delimiter is a space) | |'
