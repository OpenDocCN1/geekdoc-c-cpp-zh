    # INTCK Function


    Overview of the INTCK Function

    The INTCK function returns the number of interval boundaries of a given kind that
    lie between two dates, time, or datetime values. You can use it to count the passage
    of days, weeks, months, and so on.


    Syntax, INTCK function:


    ```

    INTCK (''interval'' ,from, to )

    ```


    +   ''interval'' specifies a character constant or a variable. Interval can appear
    in uppercase or lowercase. The value can be one of the following:


    +   - DAY

    - WEEKDAY

    - WEEK

    - TENDAY

    - SEMIMONTH

    - MONTH

    - QTR

    - SEMIYEAR

    - YEAR


    +   from specifies a SAS date, time, or datetime value that identifies the beginning
    of the time span.


    +   to specifies a SAS date, time, or datetime value that identifies the end of
    the time span.


    Note: The type of interval (date, time, or datetime) must match the type of value
    in from.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Details


    The INTCK function counts intervals from fixed interval beginnings, not in multiples
    of an interval unit from the from value. Partial intervals are not counted. For
    example, WEEK intervals are counted by Sundays rather than seven-day multiples
    from the from argument. MONTH intervals are counted by day 1 of each month, and
    YEAR intervals are counted from 01JAN, not in 365-day multiples.


    Consider the results in the following table. The values that are assigned to the
    variables Weeks, Months, and Years are based on consecutive days.


    Table 14.8 Examples of SAS Statements and Their Values


    | Example Code | Value |

    |--- |--- |

    | Weeks=intck(''week'', ''31dec2017d'',''01jan2018d''); | 0 |

    | Months=intck(''month'', ''31dec2017d'', ''01jan2018d''); | 1 |

    | Years=intck(''year'', ''31dec2017d'', ''01jan2018d''); | 1 |


    Because December 31, 2017, is a Sunday, no WEEK interval is crossed between that
    day and January 1, 2018. However, both MONTH and YEAR intervals are crossed.


    # Examples: INTCK Function


    The following statement creates the variable Years and assigns it a value of 2.
    The INTCK function determines that two years have elapsed between June 15, 2016,
    and June 15, 2018.


    ```

    Years=intck(''year'', ''15jun2016d'', ''15jun2018d'');

    ```


    > Note: As here, the from and to dates are often specified as date counts.


    Likewise, the following statement assigns 24 to the variable Months.


    ```

    Months=intck(''month'', ''15jun2016d'', ''15jun2018d'');

    ```


    However, the following statement assigns 0 to the variable Years, even though
    364 days have elapsed. The YEAR boundary (01JAN) is not crossed.


    ```

    Years=intck(''year'', ''01jan2018d'', ''31dec2018d'');

    ```


    # Example: The INTCK Function and Periodic Events


    A common use of the INTCK function is to identify periodic events such as dates
    and anniversaries.


    The following program identifies which 20th year of employment occurs in the current
    month. It uses the INTCK function to compare the value of the variable hired to
    the date on which the program is run.


    ```

    data work.anniversary;

    set set.mechanics(keep-id lastname hired);

    Years=intck(''year'',hired,today());

    if year=20 and month(hired)=month(today());

    run;

    proc print data=work.anniversary;

    title ''20-Year Anniversaries'';

    run;

    ```'
