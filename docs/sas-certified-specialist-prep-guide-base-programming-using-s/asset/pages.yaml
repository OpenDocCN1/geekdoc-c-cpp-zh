  md: '# Getting Started


    In the SAS 9.4 Base Programming – Performance-Based exam, you are not tested on
    the details of running SAS software in the various environments. However, you
    might find such information useful when working with the practice data.


    You can access a brief overview of the windows and menus in the SAS windowing
    environment, SAS Enterprise Guide, and SAS Studio at http://video.sas.com/. From
    Categories select How To Tutorials ⇨ Programming. Select the video for your SAS
    environment. Other tutorials are available from the SAS website.


    # The Basics of the SAS Language


    # SAS Statements


    A SAS statement is a type of SAS language element that is used to perform a particular
    operation in a SAS program or to provide information to a SAS program. SAS statements
    are free-format. This means that they can begin and end anywhere on a line, that
    one statement can continue over several lines, and several statements can be on
    the same line. Blank or special characters separate words in a SAS statement.


    > > T.I.P You can specify SAS statements in uppercase or lowercase. In most situations,
    text that is enclosed in quotation marks is case sensitive.


    Here are two important rules for writing SAS programs:


    +   - A SAS statement ends with a semicolon.

    - A statement usually begins with a SAS keyword.


    There are two types of SAS statements:


    +   - statements that are used in DATA and PROC steps

    - statements that are global in scope and can be used anywhere in a SAS program


    # Global Statements


    Global statements are used anywhere in a SAS program and stay in effect until
    changed or canceled, until the SAS session ends. Here are some common global statements:
    TITLE, LIBNAME, OPTIONS, and FOOTNOTE.


    # DATA Step


    The DATA step creates or modifies data. Input for a DATA step can include raw
    data or a SAS data set. Output from a DATA step can include a SAS data set or
    a report. A SAS data set is a data file that is formatted in a way that SAS can
    understand.


    For example, you can use DATA steps to do the following:


    +   - put your data into a SAS data set

    - compute values'
  merge: -1
  pgno: 17
