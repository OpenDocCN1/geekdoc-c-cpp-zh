- img_proc: true
  md: '# 298 Chapter 14 • Using Functions to Manipulate Data


    Syntax, COMPRESS function:


    ```

    COMPRESS(source<characters>, <modifier<s>>)

    ```


    +   - source specifies a constant character, variable, or expression from which
    specified characters are removed.

    - characters specifies a constant character, variable, or expression that initializes
    a list of characters.


    By default, the characters in this list are removed from the source argument.
    If you specify the K modifier in the third argument, then only the characters
    in this list are kept in the result.


    > > Note: You can add more characters to this list by using other modifiers in
    the third argument. Enclose a literal string of characters in quotation marks.


    +   - modifier specifies a constant character, variable, or expression in which
    each non-blank character modifies the action of the COMPRESS function. Blanks
    are ignored.


    a or A


    Adds alphabetic characters to the list of characters.


    c or C


    Adds control characters to the list of characters.


    d or D


    Adds digits to the list of characters.


    f or F


    Adds the underscore character and English letters to the list of characters.


    g or G


    Adds graphic characters to the list of characters.


    h or H


    Adds a horizontal tab to the list of characters.


    i or I


    Ignores the case of the characters to be kept or removed.


    k or K


    Keeps the characters in the list instead of removing them.


    l or L


    Adds lowercase letters to the list of characters.


    n or N


    Adds digits, the underscore, and English letters to the list of characters.


    o or O


    Processes the second and third argument rather than every time the COMPRESS function
    is called. You can use the O modifier to make the COMPRESS function more efficient
    when you call it in a loop, where the second and third arguments do not change.


    p or P


    Adds punctuation marks to the list of characters.


    s or S


    Adds space characters (blank, horizontal tab, vertical tab, carriage return, line
    feed, and form feed) to the list of characters.


    t or T


    Trims trailing blanks from the first and second arguments.


    u or U


    Adds uppercase letters to the list of characters.


    w or W


    Adds printable characters to the list of characters.


    x or X


    Adds hexadecimal characters to the list of characters.'
  merge: -1
  pgno: 309
