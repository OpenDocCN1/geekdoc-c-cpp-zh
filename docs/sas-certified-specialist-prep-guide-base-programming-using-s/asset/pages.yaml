  md: "# Preprocessing Data\n\nDetermine Whether the Data Requires Preprocessing\n\
    \nBefore you perform BY-group processing on one or more data sets using the SET,\
    \ MERGE, and UPDATE statements, you must check the data to determine whether it\
    \ requires preprocessing. The data requires no preprocessing if the observations\
    \ in all of the data sets occur in one of the following patterns:\n\n+   - ascending\
    \ or descending numeric order\n- ascending or descending character order\n- not\
    \ alphabetical or numerical order, grouped in some way, such as by calendar month\n\
    \nIf the observations are not in the order that you want, sort the data set before\
    \ using BY-group processing.\n\n# Example: Sorting Observations for BY-Group Processing\n\
    \nYou can use the SORT procedure to change the physical order of the observations\
    \ in the data set. You can either replace the original data set, or create a new,\
    \ sorted data set by using the OUT= option of the SORT procedure. In this example,\
    \ PROC SORT rearranges the observations in the data set Cert.Usa in ascending\
    \ order based on the values of the variable Manager. Then, the sorted data is\
    \ created as a new, sorted data set Work.Usa.\n\n> Note: The default sort for\
    \ the SORT procedure is ascending.\n\n```\nproc sort data=cert.usa out=work.usa;\n\
    \  by manager;\nrun;\nproc print data=work.usa;\nrun;\n```\n\nSpecify the variables\
    \ in the PROC SORT statement in the same order that you intend to specify them\
    \ in subsequent DATA or PROC steps."
