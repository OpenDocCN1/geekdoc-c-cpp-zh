    # Manipulating SAS Date Values with Functions


    # Date Functions


    SAS stores date, time, and datetime values as numerical values. You can use functions
    to create these values. For more information about date values, see Chapter 13,
    "SAS Date, Time, and Datetime Values," on page 241.


    Table 14.4 Typical Use of SAS Date Functions


    | Function | Example Code | Result |

    |---|---||

    | MDY | date=mdy(mon,day,yr); | SAS date |

    | TODAYDATE | now=today(); now=date(); | today''s date as a SAS date |

    | TIME | curtime=time(); | current time as a SAS time |


    Use other functions to extract months, quarters, days, and years from SAS date
    values.'
