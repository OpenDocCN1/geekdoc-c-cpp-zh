  md: 'In this example, if you specify the third word, the word returned by the SCAN
    function is NY ( NY contains a leading blank ).


    # Specifying Multiple Delimiters


    When using the SCAN function, you can specify as delimiters as needed to correctly
    separate the character expression. When you specify multiple delimiters, SAS uses
    any of the delimiters, singly or in any combination, as word separators. For example,
    if you specify both the slash and the hyphen as delimiters, the SCAN function
    separates the following string into three words:


    ```

    607/555-1273

    ^  ^  ^

    1  2  3

    ```


    The SCAN function treats two or more contiguous delimiters, such as the parenthesis
    and slash below, as one delimiter. Also, leading delimiters have no effect.


    ```

    (345)/5672/TRAILER

    ^  ^  ^

    1  2  3

    ```


    # Default Delimiters


    If you do not specify delimiters using the SCAN function, default delimiters are
    used. Here are the default delimiters:


    blank . < ( + | & $ * ) ; '' - / , %


    # Specifying Variable Length


    If a variable is not assigned a length before it is specified in the SCAN function,
    the variable is given the length of the first argument. This length could be too
    small or large for the remaining variables.


