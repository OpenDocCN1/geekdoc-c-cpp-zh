- pgno: 426
  md: "# Lambda Expressions and Collections\n\nNow that you have learned about the\
    \ Func<> generic delegate, you can understand some of the extension methods that\
    \ the System.Linq namespace provides for array types (which you might have seen\
    \ popping up in IntelliSense at various points during your coding). For example,\
    \ there is an extension method called Aggregate(), which is defined with three\
    \ overloads as follows:\n\n```\npublic static TSource Aggregate<TSource>(\n  \
    \  this IEnumerable<TSource> source,\n    Func<TSource, TSource, TSource> func);\n\
    public static TAccumulate Aggregate<TSource, TAccumulate>(\n    this IEnumerable<TSource>\
    \ source,\n    TAccumulate seed,\n    Func<TAccumulate, TSource, TAccumulate>\
    \ func);\npublic static TResult Aggregate<TSource, TAccumulate, TResult>(\n  \
    \  this IEnumerable<TSource> source,\n    TAccumulate seed,\n    Func<TAccumulate,\
    \ TSource, TAccumulate> func,\n    Func<TAccumulate, TResult> resultSelector);\n\
    ```\n\nAs with the extension method shown earlier, this looks at first glance\
    \ to be impenetrable, but if you break it down you can work it out easily enough.\
    \ The IntelliSense for this function tells you that it does the following:\n\n\
    > Applies an accumulator function over a sequence.\n\nThis means that an accumulator\
    \ function (which you can supply in the form of a lambda expression) will be applied\
    \ to each element in a collection from beginning to end. This accumulator function\
    \ must have two parameters and one return value. One input is the current element;\
    \ the other input is either a seed value, the first value in the collection, or\
    \ the result of the previous evaluation.\n\nIn the simplest of the three overloads,\
    \ there is only one generic type specification, which can be inferred from the\
    \ type of the instance parameter. For example, in the following code the generic\
    \ type specification will be int (the accumulator function is left blank for now):\n\
    \n```\nint[] myIntArray = { 2, 6, 3 };\nint result = myIntArray.Aggregate(...);\n\
    ```\n\nThis is equivalent to the following:\n\n```\nint[] myIntArray = { 2, 6,\
    \ 3 };\nint result = myIntArray.Aggregate<int>(...);\n```\n\nThe lambda expression\
    \ that is required here can be deduced from the extension method specification.\
    \ Because the type TSource is int in this code, you must supply a lambda expression\
    \ for the delegate Func<int, int, int>. For example, you could use one you've\
    \ seen before:\n\n```\nint[] myIntArray = { 2, 6, 3 };\nint result = myIntArray.Aggregate((paramA,\
    \ paramB) => paramA + paramB);\n```\n\nThis call results in the lambda expression\
    \ being called twice, first with paramA = 2 and paramB = 6, and once with paramA\
    \ = 8 (the result of the first calculation) and paramB = 3. The final result"
