- pgno: 726
  md: "DataMemberAttribute attributes with no customization, and there is no need\
    \ to reiterate the code for this contract here.\n\nThe service contract is defined\
    \ by applying the ServiceContractAttribute attribute to the IAwardService interface.\
    \ The SessionMode property of this attribute is set to SessionMode .Required,\
    \ as this service requires state:\n\n```\n[ServiceContract(SessionMode=SessionMode.Required)]\n\
    public interface IAwardService\n{\n```\n\nThe first operation contract, SetPassMark(),\
    \ is the one that sets state, and therefore has the IsInitiating property of OperationContractAttribute\
    \ set to true. This operation doesn't return anything, so it is defined as a one-way\
    \ operation by setting IsOneWay to true:\n\n```\n[OperationContract(IsOneWay=true,IsInitiating=true)]\n\
    void SetPassMark(int passMark);\n```\n\nThe other operation contract, GetAwardedPeople(),\
    \ does not require any customization and uses the data contract defined earlier:\n\
    \n```\n[OperationContract]\nPerson[] GetAwardedPeople(Person[] peopleToTest);\n\
    }\n```\n\nRemember that these two types, Person and IAwardService, are available\
    \ to both the service and the client. The service implements the IAwardService\
    \ contract in a type called AwardService, which doesn't contain any remarkable\
    \ code. The only difference between this class and the service class you saw earlier\
    \ is that it is stateful. This is permissible, as a session is defined to correlate\
    \ messages from a client.\n\nTo ensure that the service uses the wsHttpBinding\
    \ binding, you added the following to Web.config for the service:\n\n```\n<protocolMapping>\n\
    \  <add scheme=\"http\" binding=\"wsHttpBinding\" />\n</protocolMapping>\n```\n\
    \nThis overrides the default mapping for HTTP binding. Alternatively, you could\
    \ configure the service manually and keep the existing default, but this override\
    \ is much simpler. However, be aware that this type of override is applied to\
    \ all services in a project. If you have more than one service in a project, then\
    \ you would have to ensure that this binding is acceptable to each of them.\n\n\
    The client is more interesting, primarily because of this code:\n\n```\nIAwardService\
    \ client = ChannelFactory<IAwardService>.CreateChannel(\n    new WSHttpBinding(),\n\
    \    new EndpointAddress(\"http://localhost:38831/AwardService.svc\"));\n```\n\
    \nThe client application has no app.config file to configure communications with\
    \ the service, and no proxy class defined from metadata to communicate with the\
    \ service. Instead, a proxy class is created through the ChannelFactory<T>.CreateChannel()\
    \ method. This method creates a proxy class that implements the IAwardService\
    \ client, although behind the scenes the generated class communicates with the\
    \ service just like the metadata-generated proxy shown earlier."
