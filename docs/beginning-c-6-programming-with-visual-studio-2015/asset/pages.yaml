  md: 'This enables you to collapse this code into a single line and expand it again
    later should you want to look at the details. The using statements contained here,
    and the namespace statement just underneath, are explained at the end of this
    chapter.


    > NOTE Any keyword that starts with a # is actually a preprocessor directive and
    not, strictly speaking, a C# keyword. Other than the two described here, #region
    and #endregion, these can be quite complicated, and they have very specialized
    uses. This is one subject you might like to investigate yourself after you''ve
    worked through this book.


    For now, don''t worry about the other code in the example, because the purpose
    of these first few chapters is to explain basic C# syntax, so the exact method
    of how the application execution gets to the point where Console.WriteLine() is
    called is of no concern. Later, the significance of this additional code is made
    clear.


    # VARIABLES


    As mentioned earlier, variables are concerned with the storage of data. Essentially,
    you can think of variables in computer memory as boxes sitting on a shelf. You
    can put things in boxes and take them out again, or you can just look inside a
    box to see if anything is there. The same goes for variables; you place data in
    them and can take it out or look at it, as required.


    Although all data in a computer is effectively the same thing (a series of 0s
    and 1s), variables come in different flavors, known as types. Using the box analogy
    again, boxes come in different shapes and sizes, so some items fit only in certain
    boxes. The reasoning behind this type system is that different types of data may
    require different methods of manipulation, and by restricting variables to individual
    types you can avoid mixing them up. For example, it wouldn''t make much sense
    to treat the series of 0s and 1s that make up a digital picture as an audio file.


    To use variables, you have to declare them. This means that you have to assign
    them a name and a type. After you have declared variables, you can use them as
    storage units for the type of data that you declared them to hold.


    C# syntax for declaring variables merely specifies the type and variable name:


    ```

    <type> <name>;

    ```


    If you try to use a variable that hasn''t been declared, your code won''t compile,
    but in this case the compiler tells you exactly what the problem is, so this isn''t
    really a disastrous error. Trying to use a variable without assigning it a value
    also causes an error, but, again, the compiler detects this.


    # Simple Types


    Simple types include types such as numbers and Boolean (true or false) values
    that make up the fundamental building blocks for your applications. Unlike complex
    types, simple types cannot have'
