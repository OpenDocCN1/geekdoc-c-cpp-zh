- pgno: 362
  md: '# VARIANCE


    Variance is the collective term for covariance and contravariance, two concepts
    that were introduced in .NET 4. In fact, they have been around longer than that
    (they were available in .NET 2.0), but until .NET 4 it was very difficult to implement
    them, as this required custom compilation procedures.


    The easiest way to grasp what these terms mean is to compare them with polymorphism.
    Polymorphism, as you will recall, is what enables you to put objects of a derived
    type into variables of a base type, for example:


    ```

    Cow myCow = new Cow("Geronimo");

    Animal myAnimal = myCow;

    ```


    Here, an object of type Cow has been placed into a variable of type Animal — which
    is possible because Cow derives from Animal.


    However, the same cannot be said for interfaces. That is to say, the following
    code will not work:


    ```

    IMethaneProducer<Cow> cowMethaneProducer = myCow;

    IMethaneProducer<Animal> animalMethaneProducer = cowMethaneProducer;

    ```


    The first line of code is fine, assuming that Cow supports the interface IMethaneProducer<Cow>.
    However, the second line of code presupposes a relationship between the two interface
    types that doesn''t exist, so there is no way of converting one into the other.
    Or is there? There certainly isn''t a way using the techniques you''ve seen so
    far in this chapter, as all the type parameters for generic types have been invariant.
    However, it is possible to define variant type parameters on generic interfaces
    and generic delegates that cater to exactly the situation illustrated in the previous
    code.


    To make the previous code work, the type parameter T for the IMethaneProducer<T>
    interface must be covariant. Having a covariant type parameter effectively sets
    up an inheritance relationship between IMethaneProducer<Cow> and IMethaneProducer<Animal>,
    so that variables of one type can hold values of the other, just like with polymorphism
    (although a little more complicated).


    To round off this introduction to variance, you need to look at the other kind,
    contravariance. This is similar but works in the other direction. Rather than
    being able to place a generic interface value into a variable that includes a
    base type as in covariance, contravariance enables you to place that interface
    into a variable that uses a derived type, for example:


    ```

    IGrassMuncher<Cow> cowGrassMuncher = myCow;

    IGrassMuncher<SuperCow> superCowGrassMuncher = cowGrassMuncher;

    ```


    At first glance this seems a little odd, as you couldn''t do the same with polymorphism.
    However, this is a useful technique in certain circumstances, as you will see
    in the section called, "Contravariance."


    In the next two sections, you look at how to implement variance in generic types
    and how the .NET Framework uses variance to make your life easier.'
