  md: "```\n```csharp\npublic string Style { get; set; }\npublic int Spiciness { get;\
    \ set; }\n}\n```\n```\n\nThis class has three properties that are defined using\
    \ the automatic property syntax shown in Chapter 10. If you want to instantiate\
    \ and initialize an object instance of this class, you must execute several statements:\n\
    \n```\n```csharp\nCurry tastyCurry = new Curry();\ntastyCurry.MainIngredient =\
    \ \"panir tikka\";\ntastyCurry.Style = \"jalfrezi\";\ntastyCurry.Spiciness = 8;\n\
    ```\n```\n\nThis code uses the default, parameter-less constructor that is supplied\
    \ by the C# compiler if you don’t include a constructor in your class definition.\
    \ To simplify this initialization, you can supply an appropriate nondefault constructor:\n\
    \n```\n```csharp\npublic class Curry\n{\n    public Curry(string mainIngredient,\
    \ string style,\n                 int spiciness)\n    {\n        MainIngredient\
    \ = mainIngredient;\n        Style = style;\n        Spiciness = spiciness;\n\
    \    }\n    ...\n}\n```\n```\n\nThat enables you to write code that combines instantiation\
    \ with initialization:\n\n```\n```csharp\nCurry tastyCurry = new Curry(\"panir\
    \ tikka\", \"jalfrezi\", 8);\n```\n```\n\nThis works fine, although it forces\
    \ code that uses this class to use this constructor, which would prevent the previous\
    \ code, which used a parameter-less constructor, from working. Often, particularly\
    \ when classes must be serializable, it is necessary to provide a parameter-less\
    \ constructor:\n\n```\n```csharp\npublic class Curry\n{\n    public Curry() {\
    \ }\n    ...\n}\n```\n```\n\nNow you have a situation where you can instantiate\
    \ and initialize the Curry class any way you like. However, you have added several\
    \ lines of code to the initial class definition that don’t do anything much other\
    \ than provide the basic plumbing required for this flexibility.\n\nEnter object\
    \ initializers, which are a way to instantiate and initialize objects without\
    \ having to add code (such as the constructors detailed here) to a class. When\
    \ you instantiate an object, you supply values for publicly accessible properties\
    \ or fields using a name/value pair for each property you want to initialize.\
    \ The syntax for this is as follows:\n\n```\n```csharp\n<ClassName> <variableName>\
    \ = new <ClassName>\n{\n    <propertyOrField1> = <value1>,\n```\n```"
