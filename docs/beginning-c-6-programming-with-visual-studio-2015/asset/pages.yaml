- pgno: 493
  md: "The Save command is defined by WPF. Save and Close, which are used in the File\
    \ menu, are defined in the ApplicationCommands class, which also defines Cut,\
    \ Copy, Paste, and Print. When you specify the Save command for a MenuItem, the\
    \ shortcut key Ctrl+S is assigned to the menu item because it's the standard key\
    \ combination used to access that function in most Windows applications.\n\nIn\
    \ the code-behind file, you added two methods used to determine the state and\
    \ action taken by the commands. In the XAML, you created two command bindings\
    \ that used the methods like this:\n\n```\n<Window.CommandBindings>\n    <CommandBinding\
    \ Command=\"ApplicationCommands.Close\"\n        CanExecute=\"CommandCanExecute\"\
    \ Executed=\"CommandExecuted\" />\n    <CommandBinding Command=\"ApplicationCommands.Save\"\
    \n        CanExecute=\"CommandCanExecute\" Executed=\"CommandExecuted\" />\n</Window.CommandBindings>\n\
    private void CommandCanExecute(object sender, CanExecuteRoutedEventArgs e)\n{\n\
    \    if (e.Command == ApplicationCommands.Close)\n        e.CanExecute = true;\n\
    \    if (e.Command == ApplicationCommands.Save)\n        e.CanExecute = false;\n\
    \    e.Handled = true;\n}\nprivate void CommandExecuted(object sender, ExecutedRoutedEventArgs\
    \ e)\n{\n    if (e.Command == ApplicationCommands.Close)\n        this.Close();\n\
    \    e.Handled = true;\n}\n```\n\nThe CanExecute part of the command binding specifies\
    \ a method that is called to determine whether the command should be available\
    \ to the user at the moment. The Executed part specifies a method that should\
    \ be called when the user activates the command. Note that it doesn't matter from\
    \ where the command is activated. If a menu item and a button both include the\
    \ Save command, the binding works for both.\n\nThe current implementation of CommandCanExecute\
    \ is too simple for real life, where you would do some calculation to determine\
    \ whether the application is ready to save anything. Since you don't have a game\
    \ to save yet, just returning false for the Save command is appropriate. You do\
    \ this by setting the e.CanExecute property on the CanExecuteRoutedEventArgs class.\
    \ The Close command, on the other hand, can be executed just fine, so you return\
    \ true for that one.\n\nCommandExecuted performs the same test as CommandCanExecute.\
    \ If it determines that the command to execute is the Close command, then it closes\
    \ the current window.\n\n# CREATING AND STYLING CONTROLS\n\nIt's time to step\
    \ away from the client implementation of the game and start looking more at the\
    \ game itself. One key feature of a graphical card game is... the cards. Obviously,\
    \ you are not going to find a \"Playing Card\" control in the standard controls\
    \ that ship with WPF, so you have to create it yourself."
  merge: -1
  img_proc: true
- pgno: 494
  md: "One of the best features of WPF is the complete control it provides designers\
    \ over the look and feel of user interfaces. Central to this is the capability\
    \ to style controls however you want, in two or three dimensions. Until now, you\
    \ have been using the basic styling for controls that is supplied with .NET, but\
    \ the actual possibilities are endless.\n\nThis section describes two basic techniques:\n\
    \n+   - **Styles** — Sets of properties that are applied to a control as a batch\n\
    +   - **Templates** — The controls that are used to build the display for a control\n\
    \nThere is some overlap here, as styles can contain templates.\n\n# Styles\n\n\
    WPF controls have a property called Style (inherited from FrameworkElement) that\
    \ can be set to an instance of the Style class. The Style class is quite complex\
    \ and is capable of advanced styling functionality, but at its heart it is essentially\
    \ a set of Setter objects. Each Setter object is responsible for setting the value\
    \ of a property according to its Property property (the name of the property to\
    \ set) and its Value property (the value to set the property to). You can either\
    \ fully qualify the name you use in Property to the control type (for example,\
    \ Button.Foreground), or you can set the TargetType property of the Style object\
    \ (for example, Button), so that it is capable of resolving property names.\n\n\
    The following code shows how to use a Style object to set the Foreground property\
    \ of a Button control:\n\n```\n<Button>\n    Click me!\n    <Button.Style>\n \
    \       <Style TargetType=\"Button\">\n            <Setter Property=\"Foreground\"\
    >\n                <Setter.Value>\n                    <SolidColorBrush Color=\"\
    Purple\" />\n                </Setter.Value>\n            </Setter>\n        </Style>\n\
    \    </Button.Style>\n</Button>\n```\n\nObviously, in this case it would be far\
    \ easier simply to set the Foreground property of the button in the usual way.\
    \ Styles become much more useful when you turn them into resources, because resources\
    \ can be reused. You will learn how to do this in the “WPF User Controls” section\
    \ later in the chapter.\n\n# Templates\n\nControls are constructed using templates,\
    \ which you can customize. A template consists of a hierarchy of controls used\
    \ to build the display of a control, which may include a content presenter for\
    \ controls such as buttons that display content."
  merge: -1
  img_proc: true
