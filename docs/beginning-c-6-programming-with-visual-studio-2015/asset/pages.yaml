  md: "Another way to deal with large files, which was introduced in .NET 4, is to\
    \ use the static File.ReadLines() method. There are, in fact, several static methods\
    \ of File that you can use to simplify reading and writing file data, but this\
    \ one is particularly interesting in that it returns an IEnumerable<string> collection.\
    \ You can iterate through the strings in this collection to read the file one\
    \ line at a time. Using this method, you can rewrite the previous example as follows:\n\
    \n```\nforeach (string alternativeLine in File.ReadLines(\"Log.txt\"))\n    WriteLine(alternativeLine);\n\
    ```\n\nThere are, as you can see, several ways in .NET to achieve the same result\
    \ — namely, reading data from a file. Choose the technique that suits you best.\n\
    \n# Asynchronous File Access\n\nSometimes — for example, when you are performing\
    \ a lot of file access operations in one go or are working with very large files\
    \ — reading and writing file system data can be slow. If this is the case, you\
    \ might want to perform other operations while you wait. This is especially important\
    \ with desktop applications, where you want your application to remain responsive\
    \ to users while you are doing work in the background.\n\nTo facilitate this,\
    \ .NET 4.5 introduced asynchronous ways to work with streams. This applies to\
    \ the FileStream class, as well as to StreamReader and StreamWriter. If you have\
    \ browsed through the definitions of these classes, you might have noticed some\
    \ methods that end with the suffix Async — for example, StreamReader has a method\
    \ called ReadLineAsync(), which is an asynchronous version of ReadLine(). These\
    \ methods are designed to be used with the task-based asynchronous programming\
    \ model.\n\nAsynchronous programming is an advanced technique that isn't covered\
    \ in detail in this book. However, if asynchronous file system access is something\
    \ you are interested in doing then this is the place to start. You might also\
    \ want to read Professional C# 5.0 and .NET 4.5.1 by Christian Nagel, Jay Glynn,\
    \ and Morgan Skinner (Wrox, 2014) for more details.\n\n# Reading and Writing Compressed\
    \ Files\n\nOften when dealing with files, quite a lot of space is used up on the\
    \ hard disk. This is particularly true for graphics and sound files. You've probably\
    \ come across utilities that enable you to compress and decompress files, which\
    \ are handy when you want to move them around or e-mail them. The System.IO.Compression\
    \ namespace contains classes that enable you to compress files from your code,\
    \ using either the GZIP or Deflate algorithm — both of which are publicly available\
    \ and free for anyone to use.\n\nThere is a little bit more to compressing files\
    \ than just compressing them, though. You've probably seen how commercial applications\
    \ enable multiple files to be placed in a single compressed file, often called\
    \ an archive. There are classes in the System.IO.Compression namespace that enable\
    \ similar functionality. However, to keep things simple for this book you'll just\
    \ look at one scenario: saving text data to a compressed file. You are unlikely\
    \ to be able to access this file in an external utility, but the file will be\
    \ much smaller than its uncompressed equivalent!\n\nThe two compression stream\
    \ classes in the System.IO.Compression namespace that you'll look at here, DeflateStream\
    \ and GzipStream, work very similarly. In both cases, you initialize them with"
