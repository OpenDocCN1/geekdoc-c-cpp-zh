  md: '# WHAT YOU LEARNED IN THIS CHAPTER


    | TOPIC | KEY CONCEPTS |

    |---|---|

    | Defining the cloud | The cloud is an elastic structure of commoditized computer
    hardware for running programs. These programs run on IaaS, PaaS, or SaaS service
    models in a Hybrid, Public, or Private Cloud type. |

    | Defining the cloud optimized stack | The cloud optimized stack is a concept
    used to refer to code that can handle high throughput, makes a small footprint,
    can run side-by-side with other applications on the same server, and is cross-platform
    enabled. |

    | Creating a storage account | A storage account can contain an infinite number
    of containers. The storage account is the mechanism for controlling access to
    the containers created within it. |

    | Creating a storage container with C# | A storage container exists within a storage
    account and contains the blobs, files, or data that are accessible from any place
    where an Internet connection exists. |

    | Referencing the storage container from ASP.NET Razor | It is possible to reference
    a storage container from C# code. You use the storage account name, the container
    name, and the name of the blob, file, or data you need to access. |'
