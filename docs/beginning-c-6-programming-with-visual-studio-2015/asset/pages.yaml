- pgno: 196
  md: 'These enable code that instantiates an object to do so in many ways, perhaps
    providing initial values for data stored in the object.


    In C#, constructors are called using the new keyword. For example, you could instantiate
    a CupOfCoffee object using its default constructor in the following way:


    ```

    CupOfCoffee myCup = new CupOfCoffee();

    ```


    Objects can also be instantiated using nondefault constructors. For example, the
    CupOfCoffee class might have a nondefault constructor that uses a parameter to
    set the bean type at instantiation:


    ```

    CupOfCoffee myCup = new CupOfCoffee("Blue Mountain");

    ```


    Constructors, like fields, properties, and methods, can be public or private.
    Code external to a class can''t instantiate an object using a private constructor;
    it must use a public constructor. In this way, you can, for example, force users
    of your classes to use a nondefault constructor (by making the default constructor
    private).


    Some classes have no public constructors, meaning it is impossible for external
    code to instantiate them (they are said to be noncreatable). However, that doesn''t
    make them completely useless, as you will see shortly.


    # Destructors


    Destructors are used by the .NET Framework to clean up after objects. In general,
    you don''t have to provide code for a destructor method; instead, the default
    operation does the work for you. However, you can provide specific instructions
    if anything important needs to be done before the object instance is deleted.


    For example, when a variable goes out of scope, it may not be accessible from
    your code; however, it might still exist somewhere in your computer''s memory.
    Only when the .NET runtime performs its garbage collection clean-up is the instance
    completely destroyed.


    # Static and Instance Class Members


    As well as having members such as properties, methods, and fields that are specific
    to object instances, it is also possible to have static (also known as shared,
    particularly to our Visual Basic brethren) members of a class, so they can be
    methods, properties, or fields. Static members are shared between instances of
    a class, so they can be thought of as global for objects of a given class. Static
    properties and fields enable you to access data that is independent of any object
    instances, and static methods enable you to execute commands related to the class
    type but not specific to object instances. When using static members, in fact,
    you don''t even need to instantiate an object.


    For example, the Console.WriteLine() and Convert.ToString() methods you have been
    using are static. At no point do you need to instantiate the Console or Convert
    classes (indeed, if you try, you''ll find that you can''t, as the constructors
    of these classes aren''t publicly accessible, as discussed earlier).'
