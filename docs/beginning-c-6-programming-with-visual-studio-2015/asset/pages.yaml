    The wideView state is in fact left empty. This means that no modifications to
    the properties defined directly on the controls should be made, making this the
    default state.


    > NOTE The current version of Visual Studio sometimes fails to move the controls
    based on the selection in the Device Preview panel. If this happens, select another
    view size from the drop-down and the view should adjust correctly.


    # FlipView


    The FlipView is a nice little control that works very well with handheld devices.
    It allows the user to swipe left or right to display some content. It is often
    used to display images one at a time and allows the user to use the swipe gesture
    to move between the images.


    By default, the FlipView allows the user to swipe left or right to move the content
    in view, but this can be changed to move up or down. When a mouse is used, the
    scroll button will work as well.


