    \ avoid giving your namespaces names that already exist as .NET namespaces, although\
    \ similar problems can arise in large projects, particularly if you are working\
    \ as part of a large team. Using the :: operator and the global keyword might\
    \ be the only way you can access the types you want.\n\n# CUSTOM EXCEPTIONS\n\n\
    Chapter 7 covered exceptions and explained how you can use try...catch...finally\
    \ blocks to act on them. You also saw several standard .NET exceptions, including\
    \ the base class for exceptions, System.Exception. Sometimes it's useful to derive\
    \ your own exception classes from this base class for use in your applications,\
    \ instead of using the standard exceptions. This enables you to be more specific\
    \ with the information you send to whatever code catches the exception, and it\
    \ enables catching code to be more specific about which exceptions it handles.\
    \ For example, you might add a new property to your exception class that permits\
    \ access to some underlying information, making it possible for the exception's\
    \ receiver to make the required changes, or just provide more information about\
    \ the exception's cause.\n\n> NOTE Two fundamental exception classes exist in\
    \ the System namespace and derive from Exception: ApplicationException and SystemException.\
    \ SystemException is used as the base class for exceptions that are predefined\
    \ by the .NET Framework. ApplicationException was provided for developers to derive\
    \ their own exception classes, but more recent best practice dictates that you\
    \ should not derive your exceptions from this class; you should use Exception\
    \ instead.\n\n# Adding Custom Exceptions to CardLib\n\nHow to use custom exceptions\
    \ is, once again, best illustrated by upgrading the CardLib project. The Deck.GetCard()\
    \ method currently throws a standard .NET exception if an attempt is made"
