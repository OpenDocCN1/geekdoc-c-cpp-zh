  md: '+   3. Scale your Web App up to STANDARD by clicking on the STANDARD Tier box
    and then the Save button at the bottom of the page.

    +   4. Once the configuration is saved, scroll down and the options for capacity
    scaling are rendered (see Figure 17-10). Click on the CPU SCALE BY METRIC setting.


    ![](img/cf72ea860016d2d680fc085fc06f265a_580_0.png)


    FIGURE 17-10


    +   5. Change the max INSTANCE COUNT to 5 and the TARGET CPU to 50 and 80 respectively.

    +   6. Save the configuration.


    # How It Works


    Running a Web App in FREE mode does not get you a whole lot. It is really for
    testing and learning how the Microsoft Azure platform works. Auto Scaling is only
    available in STANDARD mode and therefore you must scale to this tier to have access
    to this feature. Other modes like SHARED and BASIC have the capacity to scale
    but require a manual configuration to do so.


    By default, the Auto Scale settings are to scale up to a maximum of 3 instances
    of this Web App when the CPU utilization averages between 60% and 80% for a given
    60 minute time period examined every 5 minutes.


    Notice the INSTANCE SIZE drop down in Figure 17-10. By default, the instance size
    is Small, which equates to 1 x 2.6 GHZ CPU and 1.75GB of memory. This means that
    when you scale to three instances, you receive three different virtual machines
    each with 1 x 2.6GHZ CPU and 1.75GB of memory. Had you set the INSTANCE SIZE to
    Large, you would instead get three virtual machines with 4 x 2.6GHZ CPUs and 7GB
    of memory each.'
