  md: '# 11


    # Collections, Comparisons, and Conversions


    # WHAT YOU WILL LEARN IN THIS CHAPTER


    +   - Defining and using collections

    +   - Learning the types of collections that are available

    +   - Comparing types and using the is operator

    +   - Comparing values and overloading operators

    +   - Defining and using conversions

    +   - Using the as operator


    # WROX.COM CODE DOWNLOADS FOR THIS CHAPTER


    You can find the wrox.com code downloads for this chapter at www.wrox.com/go/beginning
    visual#2015programming on the Download Code tab. The code is in the Chapter 11
    download and individually named according to the names throughout the chapter.


    You’ve covered all the basic OOP techniques in C# now, but there are some more
    advanced techniques that are worth becoming familiar with. These techniques relate
    to certain problems that you must solve regularly when you are writing code. Learning
    about them will make it much easier to progress and allow you to concentrate on
    other, potentially more important aspects of your applications. In this chapter,
    you look at the following:


    +   - **Collections** — Collections enable you to maintain groups of objects.
    Unlike arrays, which you’ve used in earlier chapters, collections can include
    more advanced functionality, such as controlling access to the objects they contain,
    searching and sorting, and'
