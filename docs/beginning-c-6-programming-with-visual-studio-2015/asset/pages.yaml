  md: "The function, MaxValue(), has a single parameter defined, an int array called\
    \ intArray. It also has a return type of int. The calculation of the maximum value\
    \ is simple. A local integer variable called maxVal is initialized to the first\
    \ value in the array, and then this value is compared with each of the subsequent\
    \ elements in the array. If an element contains a higher value than maxVal, then\
    \ this value replaces the current value of maxVal. When the loop finishes, maxVal\
    \ contains the highest value in the array, and is returned using the return statement.\n\
    \nThe code in Main() declares and initializes a simple integer array to use with\
    \ the MaxValue() function:\n\n```\nint[] myArray = { 1, 8, 3, 6, 2, 5, 9, 3, 0,\
    \ 2 };\n```\n\nThe call to MaxValue() is used to assign a value to the int variable\
    \ maxVal:\n\n```\nint maxVal = MaxValue(myArray);\n```\n\nNext, you write that\
    \ value to the screen using WriteLine():\n\n```\nWriteLine($\"The maximum value\
    \ in myArray is {maxVal}\");\n```\n\n# Parameter Matching\n\nWhen you call a function,\
    \ you must supply arguments that match the parameters as specified in the function\
    \ definition. This means matching the parameter types, the number of parameters,\
    \ and the order of the parameters. For example, the function\n\n```\nstatic void\
    \ MyFunction(string myString, double myDouble)\n{\n    ...\n}\n```\n\ncan't be\
    \ called using the following:\n\n```\nMyFunction(2.6, \"Hello\");\n```\n\nHere,\
    \ you are attempting to pass a double value as the first argument, and a string\
    \ value as the second argument, which is not the order in which the parameters\
    \ are defined in the function definition. The code won't compile because the parameter\
    \ type is wrong. In the \"Overloading Functions\" section later in this chapter,\
    \ you'll learn a useful technique for getting around this problem.\n\n# Parameter\
    \ Arrays\n\nC# enables you to specify one (and only one) special parameter for\
    \ a function. This parameter, which must be the last parameter in the function\
    \ definition, is known as a parameter array. Parameter arrays enable you to call\
    \ functions using a variable amount of parameters, and they are defined using\
    \ the params keyword.\n\nParameter arrays can be a useful way to simplify your\
    \ code because you don't have to pass arrays from your calling code. Instead,\
    \ you pass several arguments of the same type, which are placed in an array you\
    \ can use from within your function."
