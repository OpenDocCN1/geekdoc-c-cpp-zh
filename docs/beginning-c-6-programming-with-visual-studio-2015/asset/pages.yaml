  md: '# TABLE 3-9 (continued)


    | OPERATOR | CATEGORY | EXAMPLE EXPRESSION | RESULT |

    |---|---|---|---|

    | /= | Binary | var1 /= var2; | var1 is assigned the value that is the result
    of dividing var1 by var2. |

    | %= | Binary | var1 %= var2; | var1 is assigned the value that is the remainder
    when var1 is divided by var2. |


    As you can see, the additional operators result in var1 being included in the
    calculation, so code like `var1 += var2;` has exactly the same result as `var1
    = var1 + var2;`


    > **NOTE** The `+=` operator can also be used with strings, just like `+`.


    Using these operators, especially when employing long variable names, can make
    code much easier to read.


    # Operator Precedence


    When an expression is evaluated, each operator is processed in sequence, but this
    doesn''t necessarily mean evaluating these operators from left to right. As a
    trivial example, consider the following: `var1 = var2 + var3;`


    Here, the + operator acts before the = operator. There are other situations where
    operator precedence isn''t so obvious, as shown here: `var1 = var2 + var3 * var4;`


    In the preceding example, the * operator acts first, followed by the + operator,
    and finally the = operator. This is standard mathematical order, and it provides
    the same result as you would expect from working out the equivalent algebraic
    calculation on paper.


    Similarly, you can gain control over operator precedence by using parentheses,
    as shown in this example: `var1 = (var2 + var3) * var4;`


    Here, the content of the parentheses is evaluated first, meaning that the + operator
    acts before the * operator.


    Table 3-10 shows the order of precedence for the operators you''ve encountered
    so far. Operators of equal precedence (such as * and /) are evaluated from left
    to right.'
  merge: -1
  img_proc: true
- pgno: 76
  md: "TABLE 3-10: Operator Precedence\n\n| PRECEDENCE | OPERATORS |\n|---|---|\n\
    | Highest | ++, -- (used as prefixes); +, - (unary) |\n|  | *, /, % |\n|  | +,\
    \ - |\n|  | =, *=, /=, %=, +=, -= |\n| Lowest | ++, -- (used as postfixes) |\n\
    \n> **NOTE** You can use parentheses to override this precedence order, as described\
    \ previously. In addition, note that ++ and --, when used as postfixes, only have\
    \ lowest priority in conceptual terms, as described in Table 3-10. They don't\
    \ operate on the result of, say, an assignment expression, so you can consider\
    \ them to have a higher priority than all other operators. However, because they\
    \ change the value of their operand after expression evaluation, it's easier to\
    \ think of their precedence as shown in Table 3-10.\n\n# Namespaces\n\nBefore\
    \ moving on, it's worthwhile to consider one more important subject — namespaces.\
    \ These are the .NET way of providing containers for application code, such that\
    \ code and its contents may be uniquely identified. Namespaces are also used as\
    \ a means of categorizing items in the .NET Framework. Most of these items are\
    \ type definitions, such as the simple types in this chapter (System.Int32 and\
    \ so on).\n\nC# code, by default, is contained in the global namespace. This means\
    \ that items contained in this code are accessible from other code in the global\
    \ namespace simply by referring to them by name. You can use the namespace keyword,\
    \ however, to explicitly define the namespace for a block of code enclosed in\
    \ curly brackets. Names in such a namespace must be qualified if they are used\
    \ from code outside of this namespace.\n\nA qualified name is one that contains\
    \ all of its hierarchical information, which basically means that if you have\
    \ code in one namespace that needs to use a name defined in a different namespace,\
    \ you must include a reference to this namespace. Qualified names use period characters\
    \ (.) between namespace levels, as shown here:\n\n```\nnamespace LevelOne\n{\n\
    \    // code in LevelOne namespace\n    // name \"NameOne\" defined\n}\n// code\
    \ in global namespace\n```"
  merge: -1
  img_proc: true
