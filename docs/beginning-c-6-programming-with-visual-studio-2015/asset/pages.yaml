  md: '```

    watcher.NotifyFilter = NotifyFilters.LastWrite | NotifyFilters.FileName | NotifyFilters.Size;

    AddMessage("Watching " + LocationBox.Text);

    // Begin watching.

    watcher.EnableRaisingEvents = true;

    ```


    The code first sets the path to the directory to monitor. It uses a new object
    you have not looked at yet: System.IO.Path. This is a static class, much like
    the static File object. It exposes many static methods to manipulate and extract
    information out of file location strings. You first use it to extract the directory
    name the user typed in the text box, using the GetDirectoryName() method.


    The next line sets the filter for the object. This can be an actual file, in which
    case it would only monitor the file, or it could be something like *.txt, in which
    case it would monitor all the .txt files in the directory specified. Again, you
    use the Path static object to extract the information from the supplied file location.


    The NotifyFilter is a combination of NotifyFilters enumeration values that specify
    what constitutes a change. In this example, you have indicated that if the last
    write time stamp, the filename, or the size of the file changes, your application
    should be notified of the change. After updating the UI, you set the EnableRaisingEvents
    property to true to begin monitoring.


    Before that, however, you have to create the object and set the event handlers:


    ```

    watcher = new FileSystemWatcher();

    watcher.Deleted += (s, e) =>

    AddMessage($"File: {e.FullPath} Deleted");

    watcher.Renamed += (s, e) =>

    AddMessage($"File renamed from {e.OldName} to {e.FullPath}");

    watcher.Changed += (s, e) =>

    AddMessage($"File: {e.FullPath} {e.ChangeType.ToString()}");

    watcher.Created += (s, e) =>

    AddMessage($"File: {e.FullPath} Created");

    ```


    This code uses lambda expressions to create anonymous event handler methods for
    the events raised by the watcher object when a file is deleted, renamed, changed,
    or created. These event handlers simply call the AddMessage() method with an informative
    message. Obviously, you could implement a more sophisticated response, depending
    on your application. When a file is added to a directory, you could move it somewhere
    else or read the contents and fire off a new process using the information. The
    possibilities are endless!


    # EXERCISES


    +   - 18.1 Which namespace enables an application to work with files?

    +   - 18.2 When would you use a FileStream object to write to a file instead of
    using a StreamWriter object?

    +   - 18.3 Which methods of the StreamReader class enable you to read data from
    files and what does each one do?

    +   - 18.4 Which class would you use to compress a stream by using the Deflate
    algorithm?'
