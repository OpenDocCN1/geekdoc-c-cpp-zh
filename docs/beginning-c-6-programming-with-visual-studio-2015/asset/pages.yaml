- pgno: 285
  md: 'Any modifications to items in the ArrayList object resulting in N items being
    left in the array will be executed in such a way as to maintain indices from 0
    to N-1. For example, removing the item with the index 0 results in all other items
    being shifted one place in the array, so you access the Chicken object with the
    index 0, not 1. You no longer have an item with an index of 1 (because you only
    had two items in the first place), so an exception would be thrown if you tried
    the following:


    ```

    ((Animal)animalArrayList[1]).Feed();

    ```


    ArrayList collections enable you to add several items at once with the AddRange()
    method. This method accepts any object with the ICollection interface, which includes
    the animalArray array created earlier in the code:


    ```

    animalArrayList.AddRange(animalArray);

    ```


    To check that this works, you can attempt to access the third item in the collection,
    which is the second item in animalArray:


    ```

    ((Chicken)animalArrayList[2]).LayEgg();

    ```


    The AddRange() method isn''t part of any of the interfaces exposed by ArrayList.
    This method is specific to the ArrayList class and demonstrates the fact that
    you can exhibit customized behavior in your collection classes, beyond what is
    required by the interfaces you have looked at. This class exposes other interesting
    methods too, such as InsertRange(), for inserting an array of objects at any point
    in the list, and methods for tasks such as sorting and reordering the array.


    Finally, you make use of the fact that you can have multiple references to the
    same object. Using the IndexOf() method (part of the IList interface), you can
    see that myCow1 (an object originally added to animalArrayList) is now not only
    part of the animalArrayList collection, but also its index:


    ```

    WriteLine($"The animal called {myCow1.Name} is at index " +

    $"{animalArrayList.IndexOf(myCow1)}.");

    ```


    As an extension of this, the next two lines of code rename the object via the
    object reference and display the new name via the collection reference:


    ```

    myCow1.Name = "Mary";

    WriteLine($"The animal is now called {((Animal)animalArrayList[1]).Name}.");

    ```


    # Defining Collections


    Now that you know what is possible using more advanced collection classes, it''s
    time to learn how to create your own strongly typed collection. One way of doing
    this is to implement the required methods manually, but this can be a time-consuming
    and complex process. Alternatively, you can derive your collection from a class,
    such as System.Collections.CollectionBase, an abstract class that supplies much
    of the implementation of a collection for you. This option is strongly recommended.


    The CollectionBase class exposes the interfaces IEnumerable, ICollection, and
    IList but provides only some of the required implementation — notably, the Clear()
    and RemoveAt() methods'
