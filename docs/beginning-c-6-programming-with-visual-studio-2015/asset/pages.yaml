    One or both objects to compare are not Person objects.\");\n    }\n}\n```\n\n\
    Again, arguments are first checked to determine whether they are Person objects.\
    \ If they aren't, then an exception is thrown. If they are, then the default Comparer\
    \ object is used to compare the two string Name fields of the Person objects.\n\
    \n# CONVERSIONS\n\nThus far, you have used casting whenever you have needed to\
    \ convert one type into another, but this isn't the only way to do things. Just\
    \ as an int can be converted into a long or a double implicitly as part of a calculation,\
    \ you can define how classes you have created can be converted into other classes\
    \ (either implicitly or explicitly). To do this, you overload conversion operators,\
    \ much like other operators were overloaded earlier in this chapter. You'll see\
    \ how in the first part of this section. You'll also see another useful operator,\
    \ the as operator, which in general is preferable to casting when using reference\
    \ types.\n\n# Overloading Conversion Operators\n\nAs well as overloading mathematical\
    \ operators, as shown earlier, you can define both implicit and explicit conversions\
    \ between types. This is necessary if you want to convert between types that"
