- pgno: 164
  md: 'This code snippet shows how you can get extra information concerning a function
    called MyFunc(). This is all very well, but it can make your console output a
    bit cluttered; and when you develop other types of applications, such as desktop
    applications, you won''t have a console to output information to. As an alternative,
    you can output text to a separate location — the Output window in the IDE.


    Chapter 2, which describes the Error List window, mentions that other windows
    can also be displayed in the same place. One of these, the Output window, can
    be very useful for debugging. To display this window, select View ▸ Output. This
    window provides information related to compilation and execution of code, including
    errors encountered during compilation. You can also use this window, shown in
    Figure 7-1, to display custom diagnostic information by writing to it directly.


    > NOTE The Output window contains a drop-down menu from which different modes
    can be selected, including Build, Deployment and Debug. These modes display compilation
    and runtime information, respectively. When you read "writing to the Output window"
    in this section, it actually means "writing to the debug mode view of the Output
    window."


    ![](img/cf72ea860016d2d680fc085fc06f265a_164_0.png)


    FIGURE 7-1


    Alternatively, you might want to create a logging file, which has information
    appended to it when your application is executed. The techniques for doing this
    are much the same as those for writing text to the Output window, although the
    process requires an understanding of how to access the filesystem from C# applications.
    For now, leave that functionality on the back burner because there is plenty you
    can do without getting bogged down by file-access techniques.


    # Outputting Debugging Information


    Writing text to the Output window at runtime is easy. You simply replace calls
    to WriteLine() with the required call to write text where you want it. There are
    two commands you can use to do this:


    +   Debug.WriteLine()

    +   Trace.WriteLine()'
