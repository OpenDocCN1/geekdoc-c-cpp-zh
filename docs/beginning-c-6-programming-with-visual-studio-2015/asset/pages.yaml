  md: '# WHAT YOU LEARNED IN THIS CHAPTER


    | KEY CONCEPT | DESCRIPTION |

    |---|---|

    | Windows Universal App XAML | Windows Universal app XAML is used with C# to create
    the GUI for Windows Universal apps. It includes many of the same controls that
    you know from WPF, but some have changed, others are missing, and new controls
    have been introduced. |

    | Visual State manager | You saw how to use a Visual State manager to change the
    look of your controls and pages simply by changing the visual state of the control.
    This leads to a lot less code in exchange for slightly more complex XAML. |

    | App State | Windows Universal apps are suspended when the user switches to another
    app or to the desktop, so it''s important to handle this suspension and save the
    app state when it happens. |

    | App store account | This account is used for deploying apps to the Windows Store.
    |

    | Navigation | Navigation in Windows Universal apps is done in much the same way
    that it is in web applications, using method calls to move back and forth in the
    page structure. |'
