- pgno: 403
  md: "You can, however, use a standard array initializer to make this work:\n\n```\n\
    var myArray = new int?[] { 4, null, 2 };\n```\n\nA final point: The identifier\
    \ var is not a forbidden identifier to use for a class name. This means, for example,\
    \ that if your code has a class called var in scope (in the same namespace or\
    \ in a referenced namespace), then you cannot use implicit typing with the var\
    \ keyword.\n\nIn itself, type inference is not particularly useful because in\
    \ the code you've seen in this section it only serves to complicate things. Using\
    \ var makes it more difficult to see at a glance the type of a given variable.\
    \ However, as you will see later in this chapter, the concept of inferred types\
    \ is important because it underlies other techniques. The next subject, anonymous\
    \ types, is one for which inferred types are essential.\n\n# ANONYMOUS TYPES\n\
    \nAfter programming for a while you might find, especially in database applications,\
    \ that you spend a lot of time creating simple, dull classes for data representation.\
    \ It is not unusual to have families of classes that do absolutely nothing other\
    \ than expose properties. The Curry class shown earlier in this chapter is a perfect\
    \ example:\n\n```\n```csharp\npublic class Curry\n{\n    public string MainIngredient\
    \ { get; set; }\n    public string Style { get; set; }\n    public int Spiciness\
    \ { get; set; }\n}\n```\n```\n\nThis class doesn't do anything — it merely stores\
    \ structured data. In database or spreadsheet terms, you could think of this class\
    \ as representing a row in a table. A collection class that was capable of holding\
    \ instances of this class would be a representation of multiple rows in a table\
    \ or spreadsheet.\n\nThis is a perfectly acceptable use of classes, but writing\
    \ the code for these classes can become monotonous, and any modifications to the\
    \ underlying data schema requires you to add, remove, or modify the code that\
    \ defines the classes.\n\nAnonymous types are a way to simplify this programming\
    \ model. The idea behind anonymous types is that rather than define these simple\
    \ data storage types, you can instead use the C# compiler to automatically create\
    \ types based on the data that you want to store in them.\n\nThe preceding Curry\
    \ type can be instantiated as follows:\n\n```\n```csharp\nCurry curry = new Curry\n\
    {\n    MainIngredient = \"Lamb\",\n    Style = \"Dhansak\",\n    Spiciness = 5\n\
    };\n```\n```"
  merge: -1
  img_proc: true
- pgno: 404
  md: "Alternatively, you could use an anonymous type, as in the following code:\n\
    \n```\n```csharp\nvar curry = new\n{\n    MainIngredient = \"Lamb\",\n    Style\
    \ = \"Dhansak\",\n    Spiciness = 5\n};\n```\n```\n\nThere are two differences\
    \ here. First, the var keyword is used. That's because anonymous types do not\
    \ have an identifier that you can use. Internally, they do have an identifier,\
    \ as you will see in a moment, but it is not available to you in your code. Second,\
    \ no type name is specified after the new keyword. That's how the compiler knows\
    \ you want to use an anonymous type.\n\nThe IDE detects the anonymous type definition\
    \ and updates IntelliSense accordingly. With the preceding declaration, you can\
    \ see the anonymous type, as shown in Figure 13-14.\n\n![](img/cf72ea860016d2d680fc085fc06f265a_404_0.png)\n\
    \nFIGURE 13-14\n\nHere, internally, the type of the variable curry is `a`. Obviously,\
    \ you can't use this type in your code — it's not even a legal identifier name.\
    \ The ` ` is simply the symbol used to denote an anonymous type in IntelliSense.\
    \ IntelliSense also enables you to inspect the members of the anonymous type,\
    \ as shown in Figure 13-15.\n\n![](img/cf72ea860016d2d680fc085fc06f265a_404_1.png)\n\
    \nFIGURE 13-15\n\nNote that the properties shown here are defined as read-only\
    \ properties. This means that if you want to be able to change the values of properties\
    \ in your data storage objects, you cannot use anonymous types."
  merge: -1
  img_proc: true
