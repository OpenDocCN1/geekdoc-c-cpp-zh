  md: '# # On the Assessment of Active Learning in Student Learning Experiments


    This is an open access article published under the ACS AuthorChoice license, which
    permits copying and redistribution of the article or any adaptations for non-commercial
    purposes.


    **Cite This:** *J. Chem. Educ.* 2024, 101, 12, 5102–5112


    **Read Online**


    **Article Recommendations**


    **ABSTRACT:** Active learning approaches in STEM education have seen a surge of
    interest, yet their assessment in student learning experiments remains a challenge.
    This paper presents a framework for assessing active learning in undergraduate
    chemistry laboratory courses, focusing on experimental design, data analysis,
    and student reflection. The framework integrates qualitative and quantitative
    measures, providing a holistic view of student engagement and learning outcomes.
    Results from a pilot study demonstrate the framework''s utility in identifying
    strengths and areas for improvement in active learning implementations.


    # ## 1. INTRODUCTION


    Active learning has been widely advocated as a means to enhance student understanding
    and retention in science education. In laboratory settings, active learning encourages
    students to engage directly with experimental processes, fostering critical thinking
    and problem-solving skills. However, assessing the effectiveness of these approaches
    poses significant methodological challenges. Traditional assessment methods often
    fail to capture the nuanced ways in which students engage with active learning
    tasks.


    The framework proposed in this study addresses these challenges by combining direct
    observation of student behavior, analysis of laboratory reports, and self-reported
    student reflections. This multi-faceted approach allows for a comprehensive evaluation
    of active learning outcomes, including both cognitive and affective domains. The
    assessment framework is designed to be adaptable across different laboratory courses
    and institutional contexts.'
