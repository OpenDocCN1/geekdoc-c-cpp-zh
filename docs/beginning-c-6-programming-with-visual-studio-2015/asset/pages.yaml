  md: "5. If you typed the XAML directly, right-click each of the events and add the\
    \ event handler to the code-behind by selecting the Navigate to Event Handler\
    \ menu item.\n\n6. Add this code to the event handlers:\n\n```\n```csharp\nprivate\
    \ void Grid_KeyDown(object sender, KeyEventArgs e)\n{\n    MessageBox.Show(\"\
    Grid handler, bubbling up\");\n}\nprivate void Grid_PreviewKeyDown(object sender,\
    \ KeyEventArgs e)\n{\n    MessageBox.Show(\"Grid handler, tunneling down\");\n\
    }\nprivate void rotatedButton_KeyDown(object sender, KeyEventArgs e)\n{\n    MessageBox.Show(\"\
    rotatedButton handler, bubbling up\");\n}\nprivate void rotatedButton_PreviewKeyDown(object\
    \ sender, KeyEventArgs e)\n{\n    MessageBox.Show(\"rotatedButton handler, tunneling\
    \ down\");\n}\nprivate void Window_KeyDown(object sender, KeyEventArgs e)\n{\n\
    \    MessageBox.Show(\"Window handler, bubbling up\");\n}\nprivate void Window_PreviewKeyDown(object\
    \ sender, KeyEventArgs e)\n{\n    MessageBox.Show(\"Window handler, tunneling\
    \ down\");\n}\n```\n```\n\n7. Run the application by pressing F5.\n\n8. Select\
    \ the rotated button by clicking it and pressing any key except Return, Tab, Escape,\
    \ the space-bar, or the arrow keys. Observe the events being executed in turn.\n\
    \n9. Stop the application.\n\n10. Go to the Grid_PreviewKeyDown event handler\
    \ and add this line below the MessageBox line:\n\n```\n```csharp\ne.Handled =\
    \ true;\n```\n```\n\n11. Repeat Steps 7 and 8.\n\n# How It Works\n\nThe KeyDown\
    \ and PreviewKeyDown events demonstrate bubbling and tunneling events. When you\
    \ press a key with rotatedButton selected, you see each of the event handlers\
    \ executing, one after another.\n\nFirst the Preview events execute, starting\
    \ with the handler on Window, then the Grid, and finally the rotatedButton. Then\
    \ the KeyDown events execute, but in the opposite order, starting with the event\
    \ handler on the rotatedButton and finishing with the handler on Window.\n\nIf\
    \ you use any of the keys explicitly stated not to use in Step 8, you will notice\
    \ that the Preview event is fired only on Window. This is because these are not\
    \ considered input keys and are ignored by the grid and buttons."
