  md: "```\ncatch\n{\n    // Return \"null\" vector.\n    return new Vector(null,\
    \ null);\n}\n```\n\nIf either of the coordinates making up a vector is null, then\
    \ the vector is invalid, which is signified here by a Vector class with null values\
    \ for both R and Theta. The rest of the code in the Vector class overrides the\
    \ other operators required to extend the addition functionality to include subtraction,\
    \ and overrides ToString() to obtain a string representation of a Vector object.\n\
    \nThe code in Program.cs tests the Vector class by enabling the user to initialize\
    \ two vectors, and then adds and subtracts them to and from one another. Should\
    \ the user omit a value, it will be interpreted as null, and the rules mentioned\
    \ previously apply.\n\n# The System.Collections.Generic Namespace\n\nIn practically\
    \ every application used so far in this book, you have seen the following namespaces:\n\
    \n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\n```\n\nThe System namespace\
    \ contains most of the basic types used in .NET applications. The System.Text\
    \ namespace includes types relating to string processing and encoding. You'll\
    \ look at the System.Linq namespace later in this book. The System.Threading.Tasks\
    \ namespace contains types that help you to write asynchronous code, which isn't\
    \ covered in this book. But what about System.Collections.Generic, and why is\
    \ it included by default in console applications?\n\nThe answer is that this namespace\
    \ contains generic types for dealing with collections, and it is likely to be\
    \ used so often that it is configured with a using statement, ready for you to\
    \ use without qualification.\n\nYou'll now look at these types, which are guaranteed\
    \ to make your life easier. They make it possible for you to create strongly typed\
    \ collection classes with hardly any effort. Table 12-1 lists two types from the\
    \ System.Collections.Generic namespace that are covered in this section. More\
    \ of the types in this namespace are covered later in this chapter.\n\nTABLE 12-1:\
    \ Generic Collection Type\n\n| TYPE | DESCRIPTION |\n|---|---|\n| List<T> | Collection\
    \ of type T objects |\n| Dictionary<K, V> | Collection of items of type V, associated\
    \ with keys of type K |"
