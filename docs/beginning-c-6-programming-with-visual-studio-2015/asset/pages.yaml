  md: "```\n```csharp\n{\n    public int Val;\n}\n```\n```\n\nYou can box a struct\
    \ of this type by placing it into an object-type variable:\n\n```\n```csharp\n\
    MyStruct valType = new MyStruct();\nvalType.Val = 5;\nobject refType = valType;\n\
    ```\n```\n\nHere, you create a new variable (valType) of type MyStruct, assign\
    \ a value to the Val member of this struct, and then box it into an object-type\
    \ variable (refType).\n\nThe object created by boxing a variable in this way contains\
    \ a reference to a copy of the value-type variable, not a reference to the original\
    \ value-type variable. You can verify this by modifying the original struct's\
    \ contents and then unboxing the struct contained in the object into a new variable\
    \ and examining its contents:\n\n```\n```csharp\nvalType.Val = 6;\nMyStruct valType2\
    \ = (MyStruct) refType;\nWriteLine($\"valType2.Val = {valType2.Val}\");\n```\n\
    ```\n\nThis code gives you the following output:\n\n```\nvalType2.Val = 5\n```\n\
    \nWhen you assign a reference type to an object, however, you get a different\
    \ behavior. You can see this by changing MyStruct into a class (ignoring the fact\
    \ that the name of this class isn't appropriate now):\n\n```\n```csharp\nclass\
    \ MyStruct\n{\n    public int Val;\n}\n```\n```\n\nWith no changes to the client\
    \ code shown previously (again ignoring the misnamed variables), you get the following\
    \ output:\n\n```\nvalType2.Val = 6\n```\n\nYou can also box value types into interface\
    \ types, so long as they implement that interface. For example, suppose the MyStruct\
    \ type implements the IMyInterface interface as follows:\n\n```\n```csharp\ninterface\
    \ IMyInterface {}\nstruct MyStruct : IMyInterface\n{\n    public int Val;\n}\n\
    ```\n```\n\nYou can then box the struct into an IMyInterface type as follows:\n\
    \n```\n```csharp\nMyStruct valType1 = new MyStruct();\nIMyInterface refType =\
    \ valType1;\n```\n```\n\nYou can unbox it by using the normal casting syntax:\n\
    \n```\n```csharp\nMyStruct ValType2 = (MyStruct) refType;\n```\n```"
