    \ Cloner(int newVal)\n    {\n        Val = newVal;\n    }\n    public object GetCopy()\
    \ => MemberwiseClone();\n}\n```\n\nSuppose you have fields that are reference\
    \ types, rather than value types (for example, objects):\n\n```\npublic class\
