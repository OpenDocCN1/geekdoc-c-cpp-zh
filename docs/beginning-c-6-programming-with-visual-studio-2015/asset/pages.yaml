    # WHAT YOU WILL LEARN IN THIS CHAPTER


    +   - LINQ to XML

    +   - LINQ providers

    +   - LINQ query syntax

    +   - LINQ method syntax

    +   - Lambda expressions

    +   - Ordering query results

    +   - Aggregates (Count, Sum, Min, Max, Average)

    +   - SelectDistinctQuery

    +   - Group queries

    +   - Joins


    # WROX.COM CODE DOWNLOADS FOR THIS CHAPTER


    You can find the wrox.com code downloads for this chapter at www.wrox.com/go/beginning
    visual#2015programming on the Download Code tab. The code is in the Chapter 20
    download and individually named according to the names throughout the chapter.


    This chapter introduces Language INtegrated Query (LINQ). LINQ is an extension
    to the C# language that integrates data query directly into the programming language
    itself.


    Before LINQ this sort of work required writing a lot of looping code, and additional
    processing such as sorting or grouping the found objects required even more code
    that would differ depending on the data source. LINQ provides a portable, consistent
    way of querying, sorting, and grouping many different kinds of data (XML, JSON,
    SQL databases, collections of objects, web services, corporate directories, and
    more).'
