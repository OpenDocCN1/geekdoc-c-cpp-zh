  md: "![](img/cf72ea860016d2d680fc085fc06f265a_206_0.png)\n\nFIGURE 8-11\n\n# Operator\
    \ Overloading\n\nEarlier in the book, you saw how operators can be used to manipulate\
    \ simple variable types. There are times when it is logical to use operators with\
    \ objects instantiated from your own classes. This is possible because classes\
    \ can contain instructions regarding how operators should be treated.\n\nFor example,\
    \ you might add a new property to the Animal class called Weight. You could then\
    \ compare animal weights using the following:\n\n```\n```\nif (cowA.Weight > cowB.Weight)\n\
    {\n    ...\n}\n```\n```\n\nUsing operator overloading, you can provide logic that\
    \ uses the Weight property implicitly in your code, so that you can write code\
    \ such as the following:\n\n```\n```\nif (cowA > cowB)\n{\n    ...\n}\n```\n```\n\
    \nHere, the greater-than operator (>) has been overloaded. An overloaded operator\
    \ is one for which you have written the code to perform the operation involved\
    \ — this code is added to the class definition of one of the classes that it operates\
    \ on. In the preceding example, you are using two Cow objects, so the operator\
    \ overload definition is contained in the Cow class. You can also overload operators\
    \ to work with different classes in the same way, where one (or both) of the class\
    \ definitions contains the code to achieve this.\n\nYou can only overload existing\
    \ C# operators in this way; you can't create new ones. However, you can provide\
    \ implementations for both unary (single operand) and binary (two operands) usages\
    \ of operators such as + or >. You see how to do this in C# in Chapter 13."
