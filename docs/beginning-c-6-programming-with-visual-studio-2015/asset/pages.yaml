  md: '# WHAT YOU LEARNED IN THIS CHAPTER


    | TOPIC | KEY CONCEPTS |

    |---|---|

    | Member definitions | You can define field, method, and property members in a
    class. Fields are defined with an accessibility, name, and type. Methods are defined
    with an accessibility, return type, name, and parameters. Properties are defined
    with an accessibility, name, and a get and/or set accessor. Individual property
    accessors can have their own accessibility, which must be less accessible than
    the property as a whole. |

    | Member hiding and overrides | Properties and methods can be defined as `abstract`
    or `virtual` in base classes to define inheritance. Derived classes must implement
    abstract members, and can override virtual members, with the `override` keyword.
    They can also provide new implementations with the `new` keyword, and prevent
    further overrides of `virtual` members with the `sealed` keyword. Base implementations
    can be called with the `base` keyword. |

    | Interface implementation | A class that implements an interface must implement
    all of the members defined by that interface as public. You can implement interfaces
    implicitly or explicitly, where explicit implementations are only available through
    an interface reference. |

    | Partial definitions | You can split class definitions across multiple code files
    with the `partial` keyword. You can also create partial methods with the `partial`
    keyword. Partial methods have certain restrictions, including no return value
    or `out` parameters, and are not compiled if no implementation is provided. |'
