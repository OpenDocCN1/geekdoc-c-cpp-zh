  md: "# Defining Structs\n\nStructs are defined using the struct keyword as follows:\n\
    \n```\nstruct <typeName>\n{\n    <memberDeclarations>\n}\n```\n\nThe <memberDeclarations>\
    \ section contains declarations of variables (called the data members of the struct)\
    \ in almost the same format as usual. Each member declaration takes the following\
    \ form:\n\n```\n<accessibility> <type> <name>;\n```\n\nTo allow the code that\
    \ calls the struct to access the struct's data members, you use the keyword public\
    \ for <accessibility>. For example:\n\n```\nstruct route\n{\n    public orientation\
    \ direction;\n    public double      distance;\n}\n```\n\nOnce you have a struct\
    \ type defined, you use it by defining variables of the new type:\n\n```\nroute\
    \ myRoute;\n```\n\nIn addition, you have access to the data members of this composite\
    \ variable via the period character:\n\n```\nmyRoute.direction = orientation.north;\n\
    myRoute.distance  = 2.5;\n```\n\nThis is demonstrated in the following Try It\
    \ Out, where the orientation enumeration from the last Try It Out is used with\
    \ the route struct shown earlier. This struct is then manipulated in code to give\
    \ you a feel for how structs work.\n\n# TRY IT OUT  Using a Struct: Ch05Ex03\\\
    Program.cs\n\n+   1. Create a new console application called Ch05Ex03 and save\
    \ it in the directory C:\\BegVCSharp\\Chapter05.\n+   2. Add the following code\
    \ to Program.cs:\n+   ```\n+   namespace Ch05Ex03\n+   {\n+       enum orientation:\
    \ byte\n+       {\n+           north = 1,\n+           south = 2,\n+         \
    \  east = 3,\n+           west = 4\n+       }\n+       struct route\n+       {\n\
    +   ```"
