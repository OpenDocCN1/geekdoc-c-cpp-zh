  md: "# How It Works\n\nThis example created a class called Vector that represents\
    \ a vector with polar coordinates (that is, with a magnitude and an angle), as\
    \ shown in Figure 12-3.\n\nThe coordinates r and θ are represented in code by\
    \ the public fields R and Theta, where Theta is expressed in degrees. ThetaRadians\
    \ is supplied to obtain the value of Theta in radians — this is necessary because\
    \ the Math class uses radians in its static methods. Both R and Theta are of type\
    \ double?, so they can be null:\n\n```\npublic class Vector\n{\n    public double?\
    \ R = null;\n    public double? Theta = null;\n    public double? ThetaRadians\n\
    \    {\n        get\n        {\n            // Convert degrees to radians.\n \
    \           return (Theta * PI / 180.0);\n        }\n    }\n}\n```\n\nThe constructor\
    \ for Vector normalizes the initial values of R and Theta and then assigns the\
    \ public fields:\n\n```\npublic Vector(double? r, double? theta)\n{\n    // Normalize.\n\
    \    if (r < 0)\n    {\n        r = -r;\n        theta += 180;\n    }\n    theta\
    \ = theta % 360;\n    // Assign fields.\n    R = r;\n    Theta = theta;\n}\n```\n\
    \nThe main functionality of the Vector class is to add and subtract vectors using\
    \ operator overloading, which requires some fairly basic trigonometry not covered\
    \ here. You might consider taking a look at this site http://www.onlinemathlearning.com/basic-trigonometry.html,\
    \ or search for other resources on the Internet. The important point about the\
    \ code is that if an exception is thrown when obtaining the Value property of\
    \ R or ThetaRadians — that is, if either is null — then a “null” vector is returned:\n\
    \n```\npublic static Vector operator +(Vector op1, Vector op2)\n{\n    try\n \
    \   {\n        // Get (x, y) coordinates for new vector.\n        ...\n    }\n\
    }\n```\n\n![](img/cf72ea860016d2d680fc085fc06f265a_337_0.png)"
