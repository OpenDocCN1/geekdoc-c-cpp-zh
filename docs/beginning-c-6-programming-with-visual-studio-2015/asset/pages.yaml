  md: "Alternatively, you could hide the base class method:\n\n```\n```csharp\npublic\
    \ class MyBaseClass\n{\n    public virtual void DoSomething() => WriteLine(\"\
    Base imp\");\n}\npublic class MyDerivedClass : MyBaseClass\n{\n    new public\
    \ void DoSomething() => WriteLine(\"Derived imp\");\n}\n```\n```\n\nThe base class\
    \ method needn't be virtual for this to work, but the effect is exactly the same\
    \ and the preceding code only requires changes to one line. The result for a virtual\
    \ or nonvirtual base class method is as follows:\n\n```\n```\nBase imp\n```\n\
    ```\n\nAlthough the base implementation is hidden, you still have access to it\
    \ through the base class.\n\n# Calling Overridden or Hidden Base Class Methods\n\
    \nWhether you override or hide a member, you still have access to the base class\
    \ member from the derived class. There are many situations in which this can be\
    \ useful, such as the following:\n\n+   - When you want to hide an inherited public\
    \ member from users of a derived class but still want access to its functionality\
    \ from within the class\n+   - When you want to add to the implementation of an\
    \ inherited virtual member rather than simply replace it with a new overridden\
    \ implementation\n\nTo achieve this, you use the `base` keyword, which refers\
    \ to the implementation of the base class contained within a derived class (in\
    \ a similar way to its use in controlling constructors, as shown in the last chapter):\n\
    \n```\n```csharp\npublic class MyBaseClass\n{\n    public virtual void DoSomething()\n\
    \    {\n        // Base implementation.\n    }\n}\npublic class MyDerivedClass\
    \ : MyBaseClass\n{\n    public override void DoSomething()\n    {\n        //\
    \ Derived class implementation, extends base class implementation.\n        base.DoSomething();\n\
    \        // More derived class implementation.\n    }\n}\n```\n```\n\nThis code\
    \ executes the version of DoSomething() contained in MyBaseClass, the base class\
    \ of MyDerivedClass, from within the version of DoSomething() contained in MyDerivedClass.\
    \ As base works using object instances, it is an error to use it from within a\
    \ static member."
