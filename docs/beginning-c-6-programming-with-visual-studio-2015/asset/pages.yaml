- pgno: 503
  md: '# TABLE 15-2 (continued)


    | PROPERTY | DESCRIPTION |

    |---|---|

    | AutoReverse | Whether the timeline reverses when it completes and returns properties
    to their original values. This property is a Boolean value. |

    | RepeatBehavior | Set this to a specified duration to make the timeline repeat
    as indicated — an integer followed by x (for example, 5x) to repeat the timeline
    a set number of times; or use Forever to make the timeline repeat until the storyboard
    is paused or stopped. |

    | FillBehavior | How the timeline behaves if it completes while the storyboard
    is still continuing. You can use HoldEnd to leave properties at the values they
    are at when the timeline completes (the default), or Stop to return them to their
    original values. |

    | SpeedRatio | Controls the speed of the animation relative to the values specified
    in other properties. The default value is 1, but you can change it from other
    code to speed up or slow down animations. |

    | From | The initial value to set the property to at the start of the animation.
    You can omit this value to use the current value of the property. |

    | To | The final value for the property at the end of the animation. You can omit
    this value to use the current value of the property. |

    | By | Use this value to animate from the current value of a property to the sum
    of the current value and the value you specify. You can use this property on its
    own or in combination with From. |


    For example, the following timeline will animate the Width property of a Rectangle
    control with a Name property of MyRectangle between 100 and 200 over five seconds:


    ```

    <Storyboard x:Key="RectangleExpander">

    <DoubleAnimation Storyboard.TargetName="MyRectangle"

    Storyboard.TargetProperty="Width" Duration="00:00:05"

    From="100" To="200" />

    </Storyboard>

    ```


    # Timelines with Key Frames


    The timelines with key frames are DoubleAnimationUsingKeyFrames, PointAnimationUsingKeyFrames,
    and ColorAnimationUsingKeyFrames. These timeline classes use the same properties
    as the timeline classes in the previous section, except that they don''t have
    From, To, or By properties. Instead, they have a KeyFrames property that is a
    collection of key frame objects.'
