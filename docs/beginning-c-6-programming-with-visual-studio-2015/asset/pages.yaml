- pgno: 651
  md: '# LINQ PROVIDERS


    LINQ to XML is just one example of a LINQ provider. Visual Studio 2015 and the
    .NET Framework 4.5 come with a number of built-in LINQ providers that provide
    query solutions for different types of data:


    +   - **LINQ to Objects** — Provides queries on any kind of C# in-memory object,
    such as arrays, lists, and other collection types. All of the examples in the
    previous chapter use LINQ to Objects. However, you can use the techniques you
    learn in this chapter with all of the varieties of LINQ.

    +   - **LINQ to XML** — As you have just seen, this provides creation and manipulation
    of XML documents using the same syntax and general query mechanism as the other
    LINQ varieties.

    +   - **LINQ to Entities** — The Entity Framework is the newest set of data interface
    classes in .NET 4, recommended by Microsoft for new development. In this chapter
    you will add an ADO.NET Entity Framework data source to your Visual C# project,
    then query it using LINQ to Entities.

    +   - **LINQ to Data Set** — The DataSet object was introduced in the first version
    of the .NET Framework. This variety of LINQ enables legacy .NET data to be queried
    easily with LINQ.

    +   - **LINQ to SQL** — This is an alternative LINQ interface that has been superseded
    by LINQ to Entities.

    +   - **PLINQ** — PLINQ, or Parallel LINQ, extends LINQ to Objects with a parallel
    programming library that can split up a query to execute simultaneously on a multicore
    processor.

    +   - **LINQ to JSON** — Included in the Newtonsoft package you used in the previous
    chapter, this library supports creation and manipulation of JSON documents using
    the same syntax and general query mechanism as the other LINQ varieties.


    With so many varieties of LINQ, it is impossible to cover them all in a beginning
    book, but the syntax and methods you will see apply to all. Let''s next look at
    the LINQ query syntax using the LINQ to Objects provider.


    # LINQ QUERY SYNTAX


    In the following Try It Out, you use LINQ to create a query to find some data
    in a simple in-memory array of objects and print it to the console.


    TRY IT OUT  First LINQ Program: BegVCSharp_20_3_QuerySyntax\Program.cs


    Follow these steps to create the example in Visual Studio 2015:


    +   1. Create a new console application called BegVCSharp_20_3_QuerySyntax in
    the directory C:\BegVCSharp\Chapter20, and then open the main source file Program.cs.

    +   2. Notice that Visual Studio 2015 includes the System.Linq namespace by default
    in Program.cs:


    ```

    using System;

    using System.Collections.Generic;

    ```'
