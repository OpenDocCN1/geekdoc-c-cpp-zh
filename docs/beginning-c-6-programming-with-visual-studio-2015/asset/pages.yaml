- pgno: 453
  md: '# DockPanel


    The `DockPanel` control, as its name suggests, enables you to dock controls to
    one of its edges. This sort of layout should be familiar to you, even if you''ve
    never stopped to notice it before. It is how, for example, the `Ribbon` control
    in Word remains at the top of the Word window, or how the various windows in Visual
    Studio are positioned. In Visual Studio you can also change the docking of windows
    by dragging them around.


    `DockPanel` has a single attached property that child controls can use to specify
    the edge to which controls dock: `DockPanel.Dock`. You can set this property to
    `Left`, `Top`, `Right`, or `Bottom`.


    The stack order of controls in a `DockPanel` is extremely important, as every
    time you dock a control to an edge you also reduce the available space of subsequent
    child controls. For example, you might dock a toolbar to the top of a `DockPanel`
    and then a second toolbar to the left of the `DockPanel`. The first control would
    stretch across the entire top of the `DockPanel` display area, but the second
    control would only stretch from the bottom of the first toolbar to the bottom
    of the `DockPanel` along the left edge.


    The last child control you specify will (usually) fill the area that remains after
    all the previous children have been positioned. (You can control this behavior,
    which is why this statement is qualified.)


    When you position a control in a `DockPanel`, the area occupied by the control
    might be smaller than the area of the `DockPanel` that is reserved for the control.
    For example, if you dock a `Button` with a `Width` of 100, a `Height` of 50, and
    a `HorizontalAlignment` of `Left` to the top of a `DockPanel`, then there will
    be space to the right of the `Button` that isn''t used by other docked children.
    In addition, if the `Button` control has a `Margin` of 20, then a total of 90
    pixels at the top of the `DockPanel` will be reserved (the height of the control
    plus the top and bottom margins). You need to take this behavior into account
    when you use `DockPanel` for layout; otherwise, you can end up with unexpected
    results.


    Figure 14-4 shows a sample `DockPanel` layout.


    ![](img/cf72ea860016d2d680fc085fc06f265a_453_0.png)


    FIGURE 14-4'
  merge: -1
  img_proc: true
- pgno: 454
  md: "The code for this layout is as follows (you can find it in the downloadable\
    \ code at LayoutExamples\\ DockPanels.xaml):\n\n```\n<Window x:Class=\"LayoutExamples.DockPanels\"\
    \nxmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\nxmlns:x=\"\
    http://schemas.microsoft.com/winfx/2006/xaml\"\nxmlns:d=\"http://schemas.microsoft.com/expression/blend/2008\"\
    \nxmlns:mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\nxmlns:local=\"\
    clr-namespace:LayoutExamples\"\nmc:Ignorable=\"d\"\nTitle=\"DockPanel\" Height=\"\
    300\" Width=\"300\">\n<DockPanel Background=\"AliceBlue\">\n<Border DockPanel.Dock=\"\
    Top\" Padding=\"10\" Margin=\"5\"\nBackground=\"Aquamarine\" Height=\"45\">\n\
    <Label>1) DockPanel.Dock=\"Top\"</Label>\n</Border>\n<Border DockPanel.Dock=\"\
    Top\" Padding=\"10\" Margin=\"5\"\nBackground=\"PaleVioletRed\" Height=\"45\"\
    \ Width=\"200\">\n<Label>2) DockPanel.Dock=\"Top\"</Label>\n</Border>\n<Border\
    \ DockPanel.Dock=\"Left\" Padding=\"10\" Margin=\"5\"\nBackground=\"Bisque\" Width=\"\
    200\">\n<Label>3) DockPanel.Dock=\"Left\"</Label>\n</Border>\n<Border DockPanel.Dock=\"\
    Bottom\" Padding=\"10\" Margin=\"5\"\nBackground=\"Ivory\" Width=\"200\" HorizontalAlignment=\"\
    Right\">\n<Label>4) DockPanel.Dock=\"Bottom\"</Label>\n</Border>\n<Border Padding=\"\
    10\" Margin=\"5\" Background=\"BlueViolet\">\n<Label Foreground=\"White\">5) Last\
    \ control</Label>\n</Border>\n</DockPanel>\n</Window>\n```\n\nThis code uses the\
    \ Border control introduced earlier to clearly mark out the docked control regions\
    \ in the example layout, along with Label controls to output simple informative\
    \ text. To understand the layout, you must read it from top to bottom, looking\
    \ at each control in turn:\n\n+   1. The first Border control is docked to the\
    \ top of the DockPanel. The total area taken up in the DockPanel is the top 55\
    \ pixels (Height + 2 × Margin). Note that the Padding property does not affect\
    \ this layout, as it is inside the edge of the Border, but this property does\
    \ control the positioning of the embedded Label control. The Border control fills\
    \ any available space along the edge it is docked to if not constrained by Height\
    \ or Width properties, which is why it stretches across the DockPanel.\n+   \n\
    +   2. The second Border control is also docked to the top of the DockPanel, and\
    \ takes up another 55 pixels from the top of the display area. This Border control\
    \ also includes a Width property, which causes the border to take up only a portion\
    \ of the width of the DockPanel. It is positioned centrally, as the default value\
    \ for HorizontalAlignment in a DockPanel is Center."
  merge: -1
  img_proc: true
- pgno: 455
  md: '+   3. The third Border control is docked to the left of the DockPanel and
    takes up 210 pixels of the left of the display.

    +   4. The fourth Border control is docked to the bottom of the DockPanel and
    takes up 30 pixels plus the height of the Label control it contains (whatever
    that is). This height is determined by the Margin, Padding, and contents of the
    Border control, as it is not specified explicitly. The Border control is locked
    to the bottom-right corner of the DockPanel, as it has a HorizontalAlignment of
    Right.

    +   5. The fifth and final Border control fills the remaining space.


    Run this example and experiment with resizing content. Note that the further up
    the stacking order a control is, the more priority is given to its space. By shrinking
    the window, the fifth Border control can be completely obscured by controls further
    up the stacking order. Be careful when using DockPanel control layout to avoid
    this, perhaps by setting minimum dimensions for the window.


    # StackPanel


    You can think of StackPanel as being a slimmed down version of DockPanel, where
    the edge to which child controls are docked is fixed for those controls. The other
    difference between these controls is that the last child control of a StackPanel
    doesn''t fill the remaining space. However, controls will, by default, stretch
    to the edges of the StackPanel control.


    The direction in which controls are stacked is determined by three properties.
    Orientation can be set to Horizontal or Vertical, and HorizontalAlignment and
    VerticalAlignment can be used to determine whether control stacks are positioned
    next to the top, bottom, left, or right edge of the StackPanel. You can even make
    the stacked controls stack at the center of the StackPanel using the Center value
    for the alignment property you use.


    Figure 14-5 shows two StackPanel controls, each of which contains three buttons.
    The top StackPanel has its Orientation property set to Horizontal and the bottom
    one has Orientation set to Vertical.


    ![](img/cf72ea860016d2d680fc085fc06f265a_455_0.png)


    FIGURE 14-5'
  merge: -1
  img_proc: true
