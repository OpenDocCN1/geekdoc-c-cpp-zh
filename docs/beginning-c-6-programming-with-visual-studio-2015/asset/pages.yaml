- pgno: 666
  md: "# How It Works\n\nThe first part of the program is exactly the same as the\
    \ previous example, with the reference to the System.Linq namespace, and the use\
    \ of the GenerateLotsOfNumbers() method to generate the source data:\n\n```\n\
    int[] numbers = GenerateLotsOfNumbers(12345678);\n```\n\nThe query is the same\
    \ as the previous example, except for changing the where condition from less than\
    \ to greater than:\n\n```\nvar queryResults =\n    from n in numbers\n    where\
    \ n > 1000\n    select n;\n```\n\nAs noted before, this query using the greater-than\
    \ condition produces many more results than the less-than query (with this particular\
    \ data set). By using the aggregate operators, you are able to explore the results\
    \ of the query without having to print out each result or do a comparison in a\
    \ foreach loop. Each one appears as a method that can be called on the result\
    \ set, similar to methods on a collection type.\n\nLook at the use of each aggregate\
    \ operator:\n\n+   - **Count():**\n+     ```csharp\n+     WriteLine(\"Count of\
    \ Numbers > 1000\");\n+     WriteLine(queryResults.Count());\n+     ```\n+   \
    \  Count() returns the number of rows in the query results — in this case, 12,345,671\
    \ rows.\n+   \n+   - **Max():**\n+     ```csharp\n+     WriteLine(\"Max of Numbers\
    \ > 1000\");\n+     WriteLine(queryResults.Max());\n+     ```\n+     Max() returns\
    \ the maximum value in the query results — in this case, a number larger than\
    \ two billion: 2,147,483,391, which is very close to the maximum value of an int\
    \ (int.MaxValue or 2,147,483,647).\n+   \n+   - **Min():**\n+     ```csharp\n\
    +     WriteLine(\"Min of Numbers > 1000\");\n+     WriteLine(queryResults.Min());\n\
    +     ```\n+     min() returns the minimum value in the query results — in this\
    \ case, 1,034.\n+   \n+   - **Average():**\n+     ```csharp\n+     WriteLine(\"\
    Average of Numbers > 1000\");\n+     WriteLine(queryResults.Average());\n+   \
    \  ```\n+     Average() returns the average value of the query results, which\
    \ in this case is 1,073,643,807.50298, a value very close to the middle of the\
    \ range of possible values from 1,000 to more than two billion. This is rather\
    \ meaningless with an arbitrary set of large numbers, but it shows the kind of\
    \ query result analysis that is possible. You'll look at a more practical use\
    \ of these operators with some business-oriented data in the last part of the\
    \ chapter."
