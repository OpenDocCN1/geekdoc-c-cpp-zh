  md: "![](img/cf72ea860016d2d680fc085fc06f265a_421_0.png)\n\nFIGURE 13-20\n\n# How\
    \ It Works\n\nThis example uses lambda expressions to generate functions that\
    \ can be used to return the result of performing specific processing on two input\
    \ parameters. Those functions then operate on 25 pairs of values and output the\
    \ results to the console.\n\nYou start by defining a delegate type called TwoIntegerOperationDelegate\
    \ to represent a method that takes two int parameters and returns an int result:\n\
    \n```\ndelegate int TwoIntegerOperationDelegate(int paramA, int paramB);\n```\n\
    \nThis delegate type is used later when you define your lambda expressions. These\
    \ lambda expressions compile into methods whose return type and parameter types\
    \ match this delegate type, as you will see shortly.\n\nNext, you add a method\
    \ called PerformOperations(), which takes a single parameter of type TwoIntegerOperationDelegate:\n\
    \n```\nstatic void PerformOperations(TwoIntegerOperationDelegate del)\n{\n```\n\
    \nThe idea behind this method is that you can pass it a delegate instance (or\
    \ an anonymous method or lambda expression, because these constructs compile to\
    \ delegate instances) and the method will call the method represented by the delegate\
    \ instance with an assortment of values:\n\n```\nfor (int paramAVal = 1; paramAVal\
    \ <= 5; paramAVal++)\n{\n  for (int paramBVal = 1; paramBVal <= 5; paramBVal++)\n\
    \  {\n    int delegateCallResult = del(paramAVal, paramBVal);\n```\n\nThe parameters\
    \ and results are then output to the console:\n\n```\nWrite($\"{paramAVal}, \"\
    \ +\n$\"{paramBVal})={(delegateCallResult)}\");\nif (paramBVal != 5)\n{\n  Write(\"\
    , \");\n```"
