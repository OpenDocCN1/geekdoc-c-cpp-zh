    > **NOTE** Chapter 15 discusses the Styles, Control, and Item templates and shows
    why you can''t always know what type the content of a control is.


    # EXERCISES


    14.1 A `TextBlock` control can be used to display large amounts of text, but the
    control does not provide any way to scroll the text itself if the text extends
    beyond the viewport. By combining the `TextBlock` with another control, create
    a window that contains a `TextBlock` with a lot of text that can be scrolled and
    where a scrollbar appears only if the text extends beyond the viewport.


    14.2 The `Slider` and `Progress` controls have a few things in common, such as
    a minimum, maximum, and current value. Using only data binding on the `ProgressBar`,
    create a window with a slider and a progress bar, where the `Slider` control controls
    the minimum, maximum, and current value of the progress bar.


    14.3 Change the `ProgressBar` in the previous question to display itself diagonally
    from the bottom-left corner to the top-right corner of the window.


    14.4 Create a new class with the name `PersistentSlider` and three properties:
    `MinValue`, `MaxValue`, and `CurrentValue`. The class must be able to participate
    in data binding and all the properties must be able to notify bound controls of
    changes.


    +   a. In the code-behind of the window you created in the two previous exercises,
    create a new field of type `PersistentSlider` and initialize it with some default
    values.

    +   b. In the constructor, bind the instance to the windows data source.

    +   c. Bind the slider''s `Minimum`, `Maximum`, and `Value` properties to the
    data source.


    Answers to the exercises can be found in Appendix A.'
