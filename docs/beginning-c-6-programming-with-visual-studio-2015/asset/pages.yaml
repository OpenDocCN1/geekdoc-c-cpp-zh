- pgno: 604
  md: 'The WriteLine() method writes the string passed to it, followed immediately
    by a newline character. You can see in the example that this causes the next write
    operation to begin on a new line:


    ```

    sw.WriteLine("Hello to you.");

    ```


    The Write() method simply writes the string passed to it to the file, without
    a newline character appended, enabling you to write a complete sentence or paragraph
    using more than one Write() statement. Just as you can write formatted data to
    the console, you can also write formatted data to files. For example, you can
    write out the value of variables to the file using interpolated string parameters:


    ```

    sw.Write($"It is now {DateTime.Now.ToLongDateString()}");

    ```


    DateTime.Now holds the current date; the ToLongDateString() method is used to
    convert this date into an easy-to-read form.


    ```

    sw.Write("More than that,");

    sw.Write($"it''s {truth} that C# is fun.");

    ```


    Again, you use interpolated string parameters, this time with Write() to display
    the Boolean value truth — you set this variable to true earlier, and its value
    is automatically converted into the string “True” for the formatting.


    You can use Write() and format parameters to write comma-separated files:


    ```

    [StreamWriter object].Write($"{100}, {"A nice product"}, {10.50}");

    ```


    In a more sophisticated example, this data could come from a database or other
    data source.


    # The StreamReader Object


    Input streams are used to read data from an external source. Often, this will
    be a file on a disk or network location, but remember that this source could be
    almost anything that can send data, such as a network application or even the
    Console.


    The StreamReader class is the one that you will be using to read data from files.
    Like the StreamWriter class, this is a generic class that can be used with any
    stream. In the next Try It Out, you again construct it around a FileStream object
    so that it points to the correct file.


    StreamReader objects are created in much the same way as StreamWriter objects.
    The most common way to create one is to use a previously created FileStream object:


    ```

    FileStream aFile = new FileStream("Log.txt", FileMode.Open);

    StreamReader sr = new StreamReader(aFile);

    ```


    Like StreamWriter, the StreamReader class can be created directly from a string
    containing the path to a particular file:


    ```

    StreamReader sr = new StreamReader("Log.txt");

    ```


    # TRY IT OUT Reading Data from an Input Stream: StreamRead\Program.cs


    +   1. Create a new console application called StreamRead and save it in the directory
    C:\BegVCSharp\Chapter18.'
