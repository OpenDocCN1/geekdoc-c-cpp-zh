  md: "![](img/cf72ea860016d2d680fc085fc06f265a_374_0.png)\n\nFIGURE 13-4\n\n# Handling\
    \ Events\n\nAs previously discussed, to handle an event you need to subscribe\
    \ to it by providing an event handler method whose return type and parameters\
    \ match that of the delegate specified for use with the event. The following example\
    \ uses a simple timer object to raise events, which results in a handler method\
    \ being called.\n\nTRY IT OUT  Handling Events: Ch13Ex01\\Program.cs\n\n+   1.\
    \ Create a new console application called Ch13Ex01 and save it in the directory\
    \ C:\\BegVCSharp\\Chapter13.\n+   2. Modify the code in Program.cs as follows:\n\
    \n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\nusing System.Timers;\nusing\
    \ static System.Console;\nnamespace Ch13Ex01\n{\n    class Program\n    {\n  \
    \      static int counter = 0;\n\n        static string displayString =\n    \
    \        \"This string will appear one letter at a time.\";\n        static void\
    \ Main(string[] args)\n        {\n            Timer myTimer = new Timer(100);\n\
    \            myTimer.Elapsed += new ElapsedEventHandler(WriteChar);\n```"
