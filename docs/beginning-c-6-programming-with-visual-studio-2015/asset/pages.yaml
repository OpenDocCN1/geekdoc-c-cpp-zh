  md: "You'll look at the implementation of these properties in a moment. For now\
    \ it is enough to know that they are enumerations originating from the CardLib\
    \ project that you started in Chapter 10.\n\nThe three labels display the rank\
    \ and suit of the card. Even though they are bound to different properties, they\
    \ have a few things in common. They must display some text in red or black depending\
    \ on the values of the bound properties. In this example, the color is set using\
    \ the events raised when the Rank changes, but you can use triggers for this:\n\
    \n```\n<Label x:Name=\"SuitLabel\"\nContent=\"{Binding Path=Suit, ElementName=UserControl,\
    \ Mode=Default}\"\nContentTemplate=\"{DynamicResource SuitTemplate}\" HorizontalAlignment=\"\
    Center\"\nVerticalAlignment=\"Center\" Margin=\"8,51,8,60\" />\n```\n\nWhen you\
    \ bind property values, you can also specify how to render the bound content,\
    \ by using a data template. In this example, the data template is SuitTemplate,\
    \ referenced as a dynamic resource (although in this case a static resource binding\
    \ would also work fine). This template is defined in the user control resources\
    \ section as follows:\n\n```\n<UserControl.Resources>\n    <DataTemplate x:Key=\"\
    SuitTemplate\">\n        <TextBlock Text=\"{Binding}\"/>\n    </DataTemplate>\n\
    </UserControl.Resources>\n```\n\nThe string value of Suit is therefore used as\
    \ the Text property of a TextBlock control. This same DataTemplate definition\
    \ is reused for the two rank labels. Suit is an enumeration, and the name of the\
    \ value in the enumeration is automatically converted to a string to be displayed\
    \ in the Text property.\n\nThe two Rank labels include a value converter in the\
    \ binding.\n\n```\n<Label x:Name=\"RankLabel\" Grid.ZIndex=\"1\"\nContent=\"{Binding\
    \ Path=Rank, ElementName=UserControl, Mode=Default,\nConverter={StaticResource\
    \ ResourceKey=rankConverter}}\"\nContentTemplate=\"{DynamicResource SuitTemplate}\"\
    \nHorizontalAlignment=\"Left\" VerticalAlignment=\"Top\"\nMargin=\"8,8,0,0\" />\n\
    ```\n\nThe converter is included in the UserControl resources through this declaration:\n\
    \n<local:RankNameConverter x:Key=\"rankConverter\"/>\n\nYou will not break the\
    \ control if you remove the value converter. Instead, you will see Ace, 2, 3,\
    \ 4, and so on. You will also see the names of the enumeration values converted\
    \ to string — Ace, Deuce, Three, Four, and so on. Although this is technically\
    \ correct, it doesn't look quite right, so you convert the values to a combination\
    \ of numbers and strings.\n\nThe final point to notice is the Grid.ZIndex=\"1\"\
    \ property assignment on the RankLabel. The ZIndex of a control on a Grid or Canvas\
    \ determines the visual layer that holds the control. If two or more controls\
    \ occupy the same space, then you can use the ZIndex to force one of them to go\
    \ to the front. Normally all controls have a ZIndex of zero, so setting a single\
    \ control to 1 means that it is moved to the front. This is necessary because\
    \ the blur of the path would otherwise obscure the text."
