  md: '> **NOTE** Virtual members cannot be private because that would cause a paradox
    — it is impossible to say that a member can be overridden by a derived class at
    the same time you say that it is inaccessible from the derived class.


    In the animals example, you could make EatFood() virtual and provide a new implementation
    for it on any derived class — for example, just on the Cow class, as shown in
    Figure 8-8. This displays the EatFood() method on the Animal and Cow classes to
    signify that they have their own implementations.


    Base classes may also be defined as abstract classes. An abstract class can''t
    be instantiated directly; to use it you need to inherit from it. Abstract classes
    can have abstract members, which have no implementation in the base class, so
    an implementation must be supplied in the derived class. If Animal were an abstract
    class, then the UML would look as shown in Figure 8-9.


    > **NOTE** Abstract class names are shown in italics (or with a dashed line for
    their boxes).


    ![](img/cf72ea860016d2d680fc085fc06f265a_201_0.png)


    In Figure 8-9, both EatFood() and Breed() are shown in the derived classes Chicken
    and Cow, implying that these methods are either abstract (and, therefore, must
    be overridden in derived classes) or virtual (and, in this case, have been overridden
    in Chicken and Cow). Of course, abstract base classes can provide implementation
    of members, which is very common. The fact that you can''t instantiate an abstract
    class doesn''t mean you can''t encapsulate functionality in it.'
  merge: -1
  img_proc: true
