  md: "When a function returns a value, you have to modify your function in two ways:\n\
    \n+   - Specify the type of the return value in the function declaration instead\
    \ of using the void keyword.\n+   - Use the return keyword to end the function\
    \ execution and transfer the return value to the calling code.\n\nIn code terms,\
    \ this looks like the following in a console application function of the type\
    \ you've been looking at:\n\n```\n```\nstatic <returnType> <FunctionName>()\n\
    {\n    ...\n    return <returnValue>;\n}\n```\n```\n\nThe only limitation here\
    \ is that <returnValue> must be a value that either is of type <returnType> or\
    \ can be implicitly converted to that type. However, <returnType> can be any type\
    \ you want, including the more complicated types you've seen. This might be as\
    \ simple as the following:\n\n```\n```\nstatic double GetVal()\n{\n    return\
    \ 3.2;\n}\n```\n```\n\nHowever, return values are usually the result of some processing\
    \ carried out by the function; the preceding could be achieved just as easily\
    \ using a const variable.\n\nWhen the return statement is reached, program execution\
    \ returns to the calling code immediately. No lines of code after this statement\
    \ are executed, although this doesn't mean that return statements can only be\
    \ placed on the last line of a function body. You can use return earlier in the\
    \ code, perhaps after performing some branching logic. Placing return in a for\
    \ loop, an if block, or any other structure causes the structure to terminate\
    \ immediately and the function to terminate:\n\n```\n```\nstatic double GetVal()\n\
    {\n    double checkVal;\n    // checkVal assigned a value through some logic (not\
    \ shown here).\n    if (checkVal < 5)\n        return 4.7;\n    return 3.2;\n\
    }\n```\n```\n\nHere, one of two values is returned, depending on the value of\
    \ checkVal. The only restriction in this case is that a return statement must\
    \ be processed before reaching the closing } of the function. The following is\
    \ illegal:\n\n```\n```\nstatic double GetVal()\n{\n    double checkVal;\n    //\
    \ checkVal assigned a value through some logic.\n    if (checkVal < 5)\n     \
    \   return 4.7;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 139
  md: "If checkVal is >= 5, then no return statement is met, which isn't allowed.\
    \ All processing paths must reach a return statement. In most cases, the compiler\
    \ detects this and gives you the error \"not all code paths return a value.\"\n\
    \nFunctions that execute a single line of code can use a feature introduced in\
    \ C# 6 called expression-bodied methods. The following function pattern uses a\
    \ => (lambda arrow) to implement this feature.\n\n```\nstatic <returnType> <FunctionName>()\
    \ => <myVal1> * <myVal2>;\n```\n\nFor example, a Multiply() function which prior\
    \ to C# 6 is written like this:\n\n```\nstatic double Multiply(double myVal1,\
    \ double myVal2)\n{\n    return myVal1 * myVal2;\n}\n```\n\nCan now be written\
    \ using the => (lambda arrow). The result of the code written here expresses the\
    \ intent of the method in a much simpler and consolidated way.\n\n```\nstatic\
    \ double Multiply(double myVal1, double myVal2) => myVal1 * MyVal2;\n```\n\n#\
    \ Parameters\n\nWhen a function needs to accept parameters, you must specify the\
    \ following:\n\n+   - A list of the parameters accepted by the function in its\
    \ definition, along with the types of those parameters\n+   - A matching list\
    \ of arguments in each function call\n\n> NOTE Note that careful reading of the\
    \ C# specification shows a subtle distinction between parameters and arguments.\
    \ Parameters are defined as part of a function definition, whereas arguments are\
    \ passed to a function by calling code. However, these terms are often used interchangeably,\
    \ and nobody seems to get too upset about that.\n\nThis involves the following\
    \ code, where you can have any number of parameters, each with a type and a name:\n\
    \n```\nstatic <returnType> <FunctionName>(<paramType> <paramName>, ...)\n{\n \
    \   ...\n    return <returnValue>;\n}\n```\n\nThe parameters are separated using\
    \ commas, and each of these parameters is accessible from code within the function\
    \ as a variable. For example, a simple function might take two double parameters\
    \ and return their product:\n\n```\nstatic double Product(double param1, double\
    \ param2) => param1 * param2;\n```"
