    \nIn the preceding example, whenever the remainder of i divided by 2 is zero,\
    \ the continue statement stops the execution of the current cycle, so only the\
    \ numbers 1, 3, 5, 7, and 9 are displayed.\n\n# Infinite Loops\n\nIt is possible,\
    \ through both coding errors and design, to define loops that never end, so-called\
    \ infinite loops. As a very simple example, consider the following:\n\n```\nwhile\
    \ (true)\n{\n    // code in loop\n}\n```\n\nThis can be useful, and you can always\
    \ exit such loops using code such as break statements or manually by using the\
    \ Windows Task Manager. However, when this occurs by accident, it can be annoying.\
    \ Consider the following loop, which is similar to the for loop in the previous\
    \ section:\n\n```\nint i = 1;\nwhile (i <= 10)\n{\n    if ((i % 2) == 0)\n   \
    \     continue;\n    WriteLine($\"{i++}\");\n}\n```\n\nHere, i isn't incremented\
    \ until the last line of code in the loop, which occurs after the continue statement.\
    \ If this continue statement is reached (which it will be when i is 2), the next\
    \ loop cycle will be using the same value of i, continuing the loop, testing the\
    \ same value of i, continuing the loop, and so on. This will cause the application\
    \ to freeze. Note that it's still possible to quit the frozen application in the\
    \ normal way, so you won't have to reboot if this happens.\n\n# EXERCISES\n\n\
    4.1 If you have two integers stored in variables var1 and var2, what Boolean test\
