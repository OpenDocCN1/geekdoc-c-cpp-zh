  md: '3. Run the application. The result is shown in Figure 7-19.


    ![](img/cf72ea860016d2d680fc085fc06f265a_185_0.png)


    FIGURE 7-19


    # How It Works


    This application has a try block in Main() that calls a function called ThrowException().
    This function may throw exceptions, depending on the parameter it is called with:


    +   - ThrowException("none") — Doesn''t throw an exception

    +   - ThrowException("simple") — Generates a general exception

    +   - ThrowException("index") — Generates a System.IndexOutOfRangeException exception

    +   - ThrowException("nested index") — Contains its own try block, which contains
    code that calls ThrowException("index") to generate a System.IndexOutOfRangeException
    exception

    +   - ThrowException("filter") — Contains its own try block, which contains code
    that calls ThrowException("index") to generate a System.IndexOutOfRangeException
    exception where the exception filter results in true.


    Each of these string parameters is held in the global eTypes array, which is iterated
    through in the Main() function to call ThrowException() once with each possible
    parameter. During this iteration, various messages are written to the console
    to indicate what is happening. This code gives you an excellent opportunity to
    use the code-stepping techniques shown earlier in the chapter. By working your
    way through the code one line at a time, you can see exactly how code execution
    progresses.


    Add a new breakpoint (with the default properties) to line 21 of the code, which
    reads as follows:


    ```

    WriteLine("Main() try block reached.");

    ```


    > NOTE Code is referred to by line numbers as they appear in the downloadable
    version of this code. If you have line numbers turned off, remember that you can
    turn them back on (select Tools → Options and then change the Line numbers setting
    in the Text Editor → C# → General options section). Comments are included in the
    preceding code so that you can follow the text without having the file open in
    front of you.'
