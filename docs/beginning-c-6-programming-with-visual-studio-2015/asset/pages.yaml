    8. The ASP.NET Web API is now created and ready to be published to the cloud.


    Congratulations! You have completed the creation of an ASP.NET Web API that returns
    a hand of cards.


    # How It Works


    When you want to create a new ASP.NET Web API, there are two options. The first
    is the method that this Try It Out described. The fact that you selected Empty
    from the Template selection window meant that the project would contain nothing
    other than the very basic necessities required to create an ASP.NET Web API. This
    resulted in very few configuration files and binaries being added to the solution;
    the footprint for this Web API is therefore very small and is just what is needed
    to run optimally in the cloud.


    The other possible approach is to select the Web API template (see Figure 17-2)
    instead of the Empty one. This includes additional configuration files, many additional
    references, and a basic example of an ASP.NET MVC application. As this Try It
    Out is relatively small and did not require any MVC features, the Empty template
    was chosen. If additional functionalities and examples are needed in a future
    project of your own, consider selecting the Web API template because it constructs
    data pipelines and provides many proven coding patterns to build your solution
    on top of.


    You add the same seven card classes used in the Chapter 16 example to a directory
    called CardLib. The contents of the GetHandOfCards() method are identical to those
    of the one in Chapter 16. The method accepts one parameter, the playerName, creates
    a new Game, sets the Players, deals the hand of cards, and returns the Cards class
    to the ASP.NET Web API consumer. The one additional line of code is this: `[Route("api/HandOfCards/{playerName}")]`


    The Route annotation is how ASP.NET decides which Web API method responds to which
    request. As you will come to realize, after publishing there is no specific file
    requested when you interface with an ASP.NET Web API. Unlike an ASP.NET Web Forms
    application where a request is sent to a file with an .aspx extension, the same
    is not true when calling a Web API (or an ASP.NET MVC application for that matter).
    A Web API request is sent to a web server, where the parameters are in the requested
    URL, separated by forward slashes. For example: "http://contoso.com/api/{controllerName}/Parameter1/Parameter2/etc...".


    > NOTE Instead of using annotations for creating Route Maps, you can create them
    in a file called WebApiConfig.cs located in the App_Start directory.


    Now that the ASP.NET Web API is created, move on to the next section to learn
    about deployment and then consumption of the Web API.'
