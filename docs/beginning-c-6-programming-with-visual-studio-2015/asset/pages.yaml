  md: "or types of attributes you are interested in (any other attributes will be\
    \ ignored). If you omit this parameter, then all attributes will be returned.\
    \ Second, you must pass a Boolean value indicating whether to look just at the\
    \ class or at the class and all classes that the class derives from.\n\nFor example,\
    \ the following code would list the attributes of a class called DecoratedClass:\n\
    \n```\nType classType = typeof(DecoratedClass);\nobject[] customAttributes = classType.GetCustomAttributes(true);\n\
    foreach (object customAttribute in customAttributes)\n{\n    WriteLine($\"Attribute\
    \ of type {customAttribute} found.\");\n}\n```\n\nOnce you have found attributes\
    \ in this way, you can take whatever action is appropriate for the attribute.\
    \ This is exactly what Visual Studio does when it encounters the DebuggerStepThroughAttribute\
    \ attribute discussed earlier.\n\n# Creating Attributes\n\nYou can create your\
    \ own attributes simply by deriving from the System.Attribute class. Sometimes,\
    \ you don't need to do anything else, as no additional information is required\
    \ if your code is interested only in the presence or absence of your attribute.\
    \ However, you can supply nondefault constructors and/or writable properties if\
    \ you want the attribute to be customizable.\n\nYou also need to decide two things\
    \ about your attribute: what type of target it can be applied to (class, property,\
    \ and so on) and whether it can be applied more than once to the same target.\
    \ You specify this information through an attribute that you apply to your attribute\
    \ (this has a certain Zen feeling of correctness to it) called AttributeUsageAttribute.\
    \ This attribute has a constructor parameter of type AttributeTargets, which is\
    \ an enum that allows you to combine its values with the | operator. It also has\
    \ a Boolean property called AllowMultiple that specifies whether the attribute\
    \ can be applied more than once.\n\nFor example, the following code specifies\
    \ an attribute that can be applied (once) to a class or property:\n\n```\n[AttributeUsage(AttributeTargets.Class\
    \ | AttributeTargets.Method,\n    AllowMultiple = false)]\nclass DoesInterestingThingsAttribute\
    \ : Attribute\n{\n    public DoesInterestingThingsAttribute(int howManyTimes)\n\
    \    {\n        HowManyTimes = howManyTimes;\n    }\n    public string WhatDoesItDo\
    \ { get; set; }\n    public int HowManyTimes { get; private set; }\n}\n```\n\n\
    This attribute, DoesInterestingThingsAttribute, can be used as in the earlier\
    \ code snippet:\n\n```\n[DoesInterestingThings(1000, WhatDoesItDo = \"voodoo\"\
    )]\npublic class DecoratedClass {}\n```"
