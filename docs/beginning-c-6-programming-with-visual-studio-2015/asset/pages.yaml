- pgno: 490
  md: 'If any of these scenarios matches yours, consider using routed commands. In
    the case of the game, some of the items in the menu should also potentially be
    available from a toolbar. In addition, the Save action should be available only
    when a game is in progress and it should potentially be available from both a
    menu and the toolbar.


    > **NOTE** It is important to have the correct default namespace set in the KarliCards
    GUI project in order to make the examples work. If you get compiler errors stating
    that a class or resource isn''t a member of a namespace, you probably used a different
    namespace than the one that is being used in the book. The KarliCards solution
    uses two root namespaces: `Ch13CardLib` for the Ch13CardLib project and `KarliCards_Gui`
    for the KarliCards GUI project. If you experience problems, try changing the namespaces
    throughout the projects to match those used in the book.


    # TRY IT OUT  Creating the Main Window: KarliCards Gui\MainWindow.xaml


    In this example you create the main window for the game. Because this window is
    the main window of the application, it will use the windows you have already created.


    +   1. Add a new window to the project and name it `GameClient.xaml`.

    +   2. Change the title to "Karli Cards Game Client" and remove the `Height` and
    `Width` properties.

    +   3. Set the `WindowState` property to `Maximized`.

    +   4. Add this namespace:

    +      `xmlns:src="clr-namespace:KarliCards_Gui"`

    +   5. Remove the grid from the window and copy the grid and all its content from
    the `StartGame` window.

    +   6. Delete everything inside the `<Grid>` tags except the canvas that is positioned
    in `Grid.Row = 0` and the `<Grid.RowDefinitions>`.

    +   7. Drag a `DockPanel` control into grid row 1. Set its properties like this:

    +      `Grid.Row="1" Margin="0"`

    +   8. Select `DockPanel` and drag a `Menu` control onto it. Note that the control
    expands to fill the entire `DockPanel` — this is what you want.

    +   9. Change the menu''s properties to give it a black background, bold text
    weight, and white foreground color:

    +      `Background="Black" FontWeight="Bold" Foreground="White"`

    +   10. Right-click the menu in the design view and choose Add MenuItem.

    +   11. Change the `Header` property to `_File`. Note the leading underscore.
    Also, if it isn''t already, go ahead and set the foreground to white.'
