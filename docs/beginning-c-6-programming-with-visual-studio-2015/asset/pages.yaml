- pgno: 397
  md: "```\n<propertyOrField2> = <value2>,\n...\n<propertyOrFieldN> = <valueN>;\n\
    };\n```\n\nFor example, you could rewrite the code shown earlier, which instantiates\
    \ and initializes an object of type Curry, as follows:\n\n```\nCurry tastyCurry\
    \ = new Curry\n{\n    MainIngredient = \"panir tikka\",\n    Style = \"jalfrezi\"\
    ,\n    Spiciness = 8\n};\n```\n\nOften you can put code like that on a single\
    \ line without seriously degrading readability.\n\nWhen you use an object initializer,\
    \ you don't have to explicitly call a constructor of the class. If you omit the\
    \ constructor parentheses (as in the previous code), the default parameter-less\
    \ constructor is called automatically. This happens before any parameter values\
    \ are set by the initializer, which enables you to provide default values for\
    \ parameters in the default constructor if desired. Alternatively, you can call\
    \ a specific constructor. Again, this constructor is called first, so any initialization\
    \ of public properties that takes place in the constructor might be overridden\
    \ by values that you provide in the initializer. You must have access to the constructor\
    \ that you use (or the default one if you aren't explicit) in order for object\
    \ initializers to work.\n\nIf one of the properties you want to initialize with\
    \ an object initializer is more complex than the simple types used in this example,\
    \ then you might find yourself using a nested object initializer. That simply\
    \ means using the exact same syntax you've already seen:\n\n```\nCurry tastyCurry\
    \ = new Curry\n{\n    MainIngredient = \"panir tikka\",\n    Style = \"jalfrezi\"\
    ,\n    Spiciness = 8,\n    Origin = new Restaurant\n    {\n        Name = \"King's\
    \ Balti\",\n        Location = \"York Road\",\n        Rating = 5\n    }\n};\n\
    ```\n\nHere, a property called Origin of type Restaurant (not shown here) is initialized.\
    \ The code initializes three properties of the Origin property — Name, Location,\
    \ and Rating — with values of type string, string, and int, respectively. This\
    \ initialization uses a nested object initializer.\n\nNote that object initializers\
    \ are not a replacement for nondefault constructors. The fact that you can use\
    \ object initializers to set property and field values when you instantiate an\
    \ object does not mean that you will always know what state needs initializing.\
    \ With constructors you can specify exactly which values are required for an object\
    \ to function and then execute code in response to those values immediately."
  merge: -1
  img_proc: true
