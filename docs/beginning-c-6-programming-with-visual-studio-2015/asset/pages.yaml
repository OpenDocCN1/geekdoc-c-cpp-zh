- pgno: 248
  md: "The first line of the definition is the bit that is very similar to a field\
    \ definition. The difference is that there is no semicolon at the end of the line;\
    \ instead, you have a code block containing nested get and set blocks.\n\nget\
    \ blocks must have a return value of the type of the property. Simple properties\
    \ are often associated with a single private field controlling access to that\
    \ field, in which case the get block can return the field's value directly:\n\n\
    ```\n// Field used by property.\nprivate int myInt;\n// Property.\npublic int\
    \ MyIntProp\n{\n    get { return myInt; }\n    set { // Property set code. }\n\
    }\n```\n\nCode external to the class cannot access this myInt field directly due\
    \ to its accessibility level (it is private). Instead, external code must use\
    \ the property to access the field. The set function assigns a value to the field\
    \ similarly. Here, you can use the keyword value to refer to the value received\
    \ from the user of the property:\n\n```\n// Field used by property.\nprivate int\
    \ myInt;\n// Property.\npublic int MyIntProp\n{\n    get { return myInt; }\n \
    \   set { myInt = value; }\n}\n```\n\nvalue equates to a value of the same type\
    \ as the property, so if the property uses the same type as the field, then you\
    \ never have to worry about casting in situations like this.\n\nThis simple property\
    \ does little more than shield direct access to the myInt field. The real power\
    \ of properties is apparent when you exert a little more control over the proceedings.\
    \ For example, you might implement your set block as follows:\n\n```\nset\n{\n\
    \    if (value >= 0 && value <= 10)\n        myInt = value;\n}\n```\n\nHere, you\
    \ modify myInt only if the value assigned to the property is between 0 and 10.\
    \ In situations like this, you have an important design choice to make. What should\
    \ you do if an invalid value is used? You have four options:\n\n+   - Do nothing\
    \ (as in the preceding code).\n+   - Assign a default value to the field.\n+ \
    \  - Continue as if nothing went wrong but log the event for future analysis.\n\
    +   - Throw an exception."
