- pgno: 156
  md: "```\nif (doubleArray[i] > maxVal)\n    maxVal = doubleArray[i];\n}\nreturn\
    \ maxVal;\n}\n```\n\nThe difference here is that you are using double values.\
    \ The function name, MaxValue(), is the same, but (crucially) its signature is\
    \ different. That's because the signature of a function, as shown earlier, includes\
    \ both the name of the function and its parameters. It would be an error to define\
    \ two functions with the same signature, but because these two functions have\
    \ different signatures, this is fine.\n\n> NOTE The return type of a function\
    \ isn't part of its signature, so you can't define two functions that differ only\
    \ in return type; they would have identical signatures.\n\nAfter adding the preceding\
    \ code, you have two versions of MaxValue(), which accept int and double arrays,\
    \ returning an int or double maximum, respectively.\n\nThe beauty of this type\
    \ of code is that you don't have to explicitly specify which of these two functions\
    \ you want to use. You simply provide an array parameter, and the correct function\
    \ is executed depending on the type of parameter used.\n\nNote another aspect\
    \ of the IntelliSense feature in Visual Studio: When you have the two functions\
    \ shown previously in an application and then proceed to type the name of the\
    \ function, for example, Main(), the IDE shows you the available overloads for\
    \ that function. For example, if you type\n\n```\ndouble result = MaxValue(\n\
    ```\n\nthe IDE gives you information about both versions of MaxValue(), which\
    \ you can scroll between using the Up and Down arrow keys, as shown in Figure\
    \ 6-9.\n\n![](img/cf72ea860016d2d680fc085fc06f265a_156_0.png)\n\nFIGURE 6-9\n\n\
    All aspects of the function signature are included when overloading functions.\
    \ You might, for example, have two different functions that take parameters by\
    \ value and by reference, respectively:\n\n```\nstatic void ShowDouble(ref int\
    \ val)\n{\n    ...\n}\nstatic void ShowDouble(int val)\n{\n    ...\n}\n```"
