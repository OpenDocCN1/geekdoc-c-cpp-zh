- pgno: 149
  md: "You might be wondering why you shouldn't just use this technique to exchange\
    \ data with functions, rather than the parameter passing shown earlier. There\
    \ are indeed situations where this is an acceptable way to exchange data, for\
    \ example if you are writing a single object to be used as a plugin or a short\
    \ script for use in a larger project. However, there are many scenarios where\
    \ it isn't a good idea. The most common issue with using global variables has\
    \ to do with the management of concurrency. For example, a global variable can\
    \ be written to and read from numerous methods within a class or from different\
    \ threads. Can you be certain that the value in the global variable contains valid\
    \ data if numerous threads and methods can write to it? Without some extra synchronization\
    \ code, the answer is probably not. Additionally, overtime it is possible the\
    \ actual intent of the global variable is forgotten and used later for some other\
    \ reason. Therefore, the choice of whether to use global variables depends on\
    \ the intended use of the function in question.\n\nThe problem with using global\
    \ variables is that they are generally unsuitable for \"general-purpose\" functions,\
    \ which are capable of working with whatever data you supply, not just data in\
    \ a specific global variable. You look at this in more depth a little later.\n\
    \n# Variable Scope in Other Structures\n\nOne of the points made in the last section\
    \ has consequences above and beyond variable scope between functions: that the\
    \ scopes of variables encompass the code blocks in which they are defined and\
    \ any directly nested code blocks. You can find the code discussed next in the\
    \ chapter download in VariableScopeInLoops\\Program.cs. This also applies to other\
    \ code blocks, such as those in branching and looping structures. Consider the\
    \ following code:\n\n```\nint i;\nfor (i = 0; i < 10; i++)\n{\n    string text\
    \ = \"Line \" + Convert.ToString(i);\n    WriteLine($\"{text}\");\n}\nWriteLine($\"\
    Last text output in loop: {text}\");\n```\n\nHere, the string variable text is\
    \ local to the for loop. This code won't compile because the call to WriteLine()\
    \ that occurs outside of this loop attempts to use the variable text, which is\
    \ out of scope outside of the loop. Try modifying the code as follows:\n\n```\n\
    int i;\nstring text;\nfor (i = 0; i < 10; i++)\n{\n    text = \"Line \" + Convert.ToString(i);\n\
    \    WriteLine($\"{text}\");\n}\nWriteLine($\"Last text output in loop: {text}\"\
    );\n```\n\nThis code will also fail because variables must be declared and initialized\
    \ before use, and text is only initialized in the for loop. The value assigned\
    \ to text is lost when the loop block is exited as it isn't initialized outside\
    \ the block. However, you can make the following change:\n\n```\nint i;\nstring\
    \ text = \"\";\n```"
