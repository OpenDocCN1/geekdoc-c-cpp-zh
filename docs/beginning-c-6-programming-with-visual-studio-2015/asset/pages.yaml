- pgno: 667
  md: "```\nSum();\n\n    WriteLine(\"Sum of Numbers > 1000\");\n    WriteLine(queryResults.Sum(n\
    \ => (long) n));\n```\n\nYou passed the lambda expression n => (long) n to the\
    \ Sum() method call to get the sum of all the numbers. Although Sum() has a no-parameter\
    \ overload, like Count(), Min(), Max(), and so on, using that version of the method\
    \ call would cause an overflow error because there are so many large numbers in\
    \ the data set that the sum of all of them would be too large to fit into a standard\
    \ 32-bit int, which is what the no-parameter version of Sum() returns. The lambda\
    \ expression enables you to convert the result of Sum() to a long 64-bit integer,\
    \ which is what you need to hold the total of over 13 quadrillion without overflow\
    \ — 13,254,853,218,619,179 lambda expressions enable you to perform this kind\
    \ of fix-up easily.\n\n> NOTE In addition to Count(), which returns a 32-bit int,\
    \ LINQ also provides a LongCount() method that returns the count of query results\
    \ in a 64-bit integer. That is a special case, however — all the other operators\
    \ require a lambda or a call to a conversion method if a 64-bit version of the\
    \ number is needed.\n\n# USING THE SELECT DISTINCT QUERY\n\nAnother type of query\
    \ that those of you familiar with the SQL data query language will recognize is\
    \ the SELECT DISTINCT query, in which you search for the unique values in your\
    \ data — that is, the query removes any repeated values from the result set. This\
    \ is a fairly common need when working with queries.\n\nSuppose you need to find\
    \ the distinct regions in the customer data used in the previous examples. There\
    \ is no separate region list in the data you just used, so you need to find the\
    \ unique, nonrepeating list of regions from the customer list itself. LINQ provides\
    \ a Distinct() method that makes it easy to find this data. You'll use it in the\
    \ following Try It Out.\n\nTRY IT OUT Projection: Select Distinct Query: BegVCSharp_20_8_SelectDistinctQuery/Program.cs\n\
    \nFollow these steps to create the example in Visual Studio 2015:\n\n+   1. Create\
    \ a new console application called BegVCSharp_20_8_SelectDistinctQuery in the\
    \ directory C:\\BegVCSharp\\Chapter20.\n+   2. Enter this code to create the Customer\
    \ class and the initialization of the customers list (List<Customer> customers):\n\
    +   ```\n+   class Customer\n+   {\n+       public string ID { get; set; }\n+\
    \   }\n+   ```"
