  md: "Note that there is no upper limit on the amount of characters making up a string,\
    \ because it can use varying amounts of memory.\n\nThe Boolean type bool is one\
    \ of the most commonly used variable types in C#, and indeed similar types are\
    \ equally prolific in code in other languages. Having a variable that can be either\
    \ true or false has important ramifications when it comes to the flow of logic\
    \ in an application. As a simple example, consider how many questions can be answered\
    \ with true or false (or yes and no). Performing comparisons between variable\
    \ values or validating input are just two of the programmatic uses of Boolean\
    \ variables that you will examine very soon.\n\nNow that you've seen these types,\
    \ consider a short example that declares and uses them. In the following Try It\
    \ Out you use some simple code that declares two variables, assigns them values,\
    \ and then outputs these values.\n\n# TRY IT OUT Using Simple Type Variables:\
    \ Ch03Ex01\\Program.cs\n\n+   1. Create a new console application called Ch03Ex01\
    \ and save it in the directory C:\\BegVCSharp\\Chapter03.\n+   2. Add the following\
    \ code to Program.cs:\n+   3. Execute the code. The result is shown in Figure\
    \ 3-1.\n\n```\nstatic void Main(string[] args)\n{\n    int myInteger;\n    string\
    \ myString;\n    myInteger = 17;\n    myString = \"myInteger\\\" is\";\n    Console.WriteLine($\"\
    {myString} {myInteger}\");\n    Console.ReadKey();\n}\n```\n\n![](img/cf72ea860016d2d680fc085fc06f265a_64_0.png)\n\
    \n# How It Works\n\nThe added code performs three tasks:\n\n+   - It declares\
    \ two variables.\n+   - It assigns values to those two variables.\n+   - It outputs\
    \ the values of the two variables to the console.\n\nVariable declaration occurs\
    \ in the following code:\n\n```\nint myInteger;\nstring myString;\n```"
