  md: "9. Add the following code to the Click event handler for the Watch! button,\
    \ which starts the FileSystemWatcher:\n\n```\nprivate void WatchButton_Click(object\
    \ sender, RoutedEventArgs e)\n{\n    watcher.Path = System.IO.Path.GetDirectoryName(LocationBox.Text);\n\
    \    watcher.Filter = System.IO.Path.GetFileName(LocationBox.Text);\n    watcher.NotifyFilter\
    \ = NotifyFilters.LastWrite |\n        NotifyFilters.FileName | NotifyFilters.Size;\n\
    \    AddMessage(\"Watching \" + LocationBox.Text);\n    // Begin watching.\n \
    \   watcher.EnableRaisingEvents = true;\n}\n```\n\n10. Create a directory called\
    \ C:\\TempWatch and a file in this directory called temp.txt.\n\n11. Run the application.\
    \ If everything builds successfully, click the Browse button and select C:\\TempWatch\\\
    temp.txt.\n\n12. Click the Watch! button to begin monitoring the file. The only\
    \ change you will see in your application is a message confirming that the file\
    \ is being watched.\n\n13. Using Windows Explorer, navigate to C:\\TempWatch.\
    \ Open temp.txt in Notepad, add some text to the file, and save it.\n\n14. Rename\
    \ the file.\n\n15. You should see a description of the changes to the file you\
    \ selected to watch, as shown in Figure 18-8.\n\n![](img/cf72ea860016d2d680fc085fc06f265a_614_0.png)\n\
    \nFIGURE 18-8\n\n# How It Works\n\nThis application is fairly simple, but it demonstrates\
    \ how the FileSystemWatcher works. Try playing with the string you put into the\
    \ monitor text box. If you specify *.* in a directory, it will monitor all changes\
    \ in the directory.\n\nMost of the code in the application is related to setting\
    \ up the FileSystemWatcher object to watch the correct location:\n\n```\nwatcher.Path\
    \ = System.IO.Path.GetDirectoryName(LocationBox.Text);\nwatcher.Filter = System.IO.Path.GetFileName(LocationBox.Text);\n\
