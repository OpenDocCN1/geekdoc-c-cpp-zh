- pgno: 422
  md: "```\n}\n}\nWriteLine();\n}\n```\n\nIn the Main() method you create three lambda\
    \ expressions and use them to call PerformOperations() in turn. The first of these\
    \ calls is as follows:\n\n```\nWriteLine($\"(a, b) = a + b;\");\nPerformOperations((paramA,\
    \ paramB) => paramA + paramB);\n```\n\nThe lambda expression used here is as follows:\n\
    \n```\n(paramA, paramB) => paramA + paramB\n```\n\nAgain, this breaks down into\
    \ three parts:\n\n+   1. A parameter definition section. Here there are two parameters,\
    \ paramA and paramB. These parameters are untyped, meaning the compiler can infer\
    \ the types of these parameters according to the context. In this case the compiler\
    \ can determine that the PerformOperations() method call requires a delegate of\
    \ type TwoIntegerOperationDelegate. This delegate type has two int parameters,\
    \ so by inference both paramA and paramB are typed as int variables.\n+   2. The\
    \ => operator. This separates the lambda expression parameters from the lambda\
    \ expression body.\n+   3. The expression body. This specifies a simple operation,\
    \ which is the summation of paramA and paramB. Notice that there is no need to\
    \ specify that this is a return value. The compiler knows that in order to create\
    \ a method that can be used with TwoIntegerOperationDelegate, the method must\
    \ have a return type of int. Because the operation specified, paramA + paramB,\
    \ evaluates to an int, and no additional information is supplied, the compiler\
    \ infers that the result of this expression should be the return type of the method.\n\
    \nIn longhand then, you can expand the code that uses this lambda expression to\
    \ the following code that uses an anonymous method:\n\n```\nWriteLine($\"(a, b)\
    \ = a + b;\");\nPerformOperations(delegate(int paramA, int paramB)\n{\n    return\
    \ paramA + paramB;\n});\n```\n\nThe remaining code performs operations using two\
    \ different lambda expressions in the same way:\n\n```\nWriteLine();\nWriteLine($\"\
    (a, b) = a * b;\");\nPerformOperations((paramA, paramB) => paramA * paramB);\n\
    WriteLine();\nWriteLine($\"(a, b) = (a - b) % b;\");\nPerformOperations((paramA,\
    \ paramB) => (paramA - paramB)\n    % paramB);\nReadKey();\n```"
