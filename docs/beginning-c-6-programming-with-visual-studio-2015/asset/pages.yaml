  md: "An earlier example showed how a delegate with a void return type was less fussy\
    \ about the code used in the statement body:\n\n```\nmyTimer.Elapsed += (source,\
    \ e) => WriteLine(\"Event handler called after \" +\n    $\"{(source as Timer).Interval}\
    \ milliseconds.\");\n```\n\nHere, the statement doesn't evaluate to anything,\
    \ so it is simply executed without any return value being used anywhere.\n\nGiven\
    \ that lambda expressions can be visualized as an extension of the anonymous method\
    \ syntax, you might not be surprised to learn that you can also include multiple\
    \ statements as a lambda expression statement body. To do so, you simply provide\
    \ a block of code enclosed in curly braces, much like any other situation in C#\
    \ where you must supply multiple lines of code:\n\n```\n(param1, param2) =>\n\
    {\n    // Multiple statements ahoy!\n}\n```\n\nIf you use a lambda expression\
    \ in combination with a delegate type that has a non-void return type, then you\
    \ must return a value with the return keyword, just like any other method:\n\n\
    ```\n(param1, param2) =>\n{\n    // Multiple statements ahoy!\n    return returnValue;\n\
    }\n```\n\nFor example, earlier you saw how you could rewrite the following code\
    \ from the Try It Out,\n\n```\nPerformOperations((paramA, paramB) => paramA +\
    \ paramB);\n```\n\nas:\n\n```\nPerformOperations(delegate(int paramA, int paramB)\n\
    {\n    return paramA + paramB;\n});\n```\n\nAlternatively, you could rewrite the\
    \ code as follows:\n\n```\nPerformOperations((paramA, paramB) =>\n{\n    return\
    \ paramA + paramB;\n});\n```\n\nThis is more in keeping with the original code\
    \ because it maintains implicit typing of the paramA and paramB parameters.\n\n\
    For the most part, lambda expressions are at their most useful — and certainly\
    \ their most elegant — when used with single expressions. To be honest, if you\
    \ require multiple statements, your code"
