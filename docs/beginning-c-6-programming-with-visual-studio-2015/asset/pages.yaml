  md: '![](img/cf72ea860016d2d680fc085fc06f265a_134_0.png)


    # # Functions


    # WHAT YOU WILL LEARN IN THIS CHAPTER


    +   - Defining and using simple functions that don’t accept or return any data

    +   - Transferring data to and from functions

    +   - Working with variable scope

    +   - Using command-line arguments with the `main()` function

    +   - Supplying functions as members of struct types

    +   - Using function overloading

    +   - Using delegates


    # WROX.COM CODE DOWNLOADS FOR THIS CHAPTER


    You can find the wrox.com code downloads for this chapter at www.wrox.com/go/beginning_visualcsharp2015programming
    on the Download Code tab. The code is in the Chapter 6 download and individually
    named according to the names throughout the chapter.


    All the code you have seen so far has taken the form of a single block, perhaps
    with some looping to repeat lines of code, and branching to execute statements
    conditionally. Performing an operation on your data has meant placing the code
    required right where you want it to work.


    This kind of code structure is limited. Often, some tasks — such as finding the
    highest value in an array, for example — might need to be performed at several
    points in a program. You can place identical (or nearly identical) sections of
    code in your application whenever necessary, but this has its own problems. Changing
    even one minor detail concerning a common task (to correct a code error, for example)
    can require changes to multiple sections of code, which can be spread throughout
    the application. Missing one of these can have dramatic consequences and cause
    the whole application to fail. In addition, the application can get very lengthy.'
  merge: -1
  img_proc: true
- pgno: 135
  md: "The solution to this problem is to use *functions*. Functions in C# are a means\
    \ of providing blocks of code that can be executed at any point in an application.\n\
    \n> **NOTE** Functions of the specific type examined in this chapter are known\
    \ as methods, but this term has a very specific meaning in .NET programming that\
    \ will only become clear later in this book. Therefore, for now, the term method\
    \ will not be used.\n\nFor example, you could have a function that calculates\
    \ the maximum value in an array. You can use the function from any point in your\
    \ code, and use the same lines of code in each case. Because you need to supply\
    \ this code only once, any changes you make to it will affect this calculation\
    \ wherever it is used. The function can be thought of as containing reusable code.\n\
    \nFunctions also have the advantage of making your code more reusable, as you\
    \ can use them to group related code together. This way, your application body\
    \ can be very short, as the inner workings of the code are separated out. This\
    \ is similar to the way in which you can collapse regions of code together in\
    \ the IDE using the outlining view, and it gives your application a more logical\
    \ structure.\n\nFunctions can also be used to create multipurpose code, enabling\
    \ them to perform the same operations on varying data. You can supply a function\
    \ with information to work with in the form of arguments, and you can obtain results\
    \ from functions in the form of return values. In the preceding example, you could\
    \ supply an array to search as an argument and obtain the maximum value in the\
    \ array as a result value. This means that you can use the same function to work\
    \ with a different array each time. A function definition consists of a name,\
    \ a return type, and a list of parameters that specify the number and type of\
    \ arguments that the function requires. The name and parameters of a function\
    \ (but not its return type) collectively define the signature of a function.\n\
    \n# DEFINING AND USING FUNCTIONS\n\nThis section describes how you can add functions\
    \ to your applications and then use (call) them from your code. Starting with\
