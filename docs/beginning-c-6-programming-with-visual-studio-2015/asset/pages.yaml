- pgno: 352
  md: "You can define constraints on any or all of the types required by the generic\
    \ class by using multiple where statements:\n\n```\nclass MyGenericClass<T1, T2>\
    \ where T1 : constraint1 where T2 : constraint2\n{ ... }\n```\n\nAny constraints\
    \ that you use must appear after the inheritance specifiers:\n\n```\nclass MyGenericClass<T1,\
    \ T2> : MyBaseClass, IMyInterface\n    where T1 : constraint1 where T2 : constraint2\
    \ { ... }\n```\n\nThe available constraints are shown in Table 12-3.\n\n# TABLE\
    \ 12-3: Generic Type Constraints\n\n| CONSTRAINT | DEFINITION | EXAMPLE USAGE\
    \ |\n|---|---|---|\n| struct | Type must be a value type. | In a class that requires\
    \ value types to function — for example, where a member variable of type T being\
    \ 0 means something |\n| class | Type must be a reference type. | In a class that\
    \ requires reference types to function — for example, where a member variable\
    \ of type T being null means something |\n| base-class | Type must be, or inherit\
    \ from, base-class. You can supply any class name as this constraint. | In a class\
    \ that requires certain baseline functionality inherited from base-class in order\
    \ to function |\n| interface | Type must be, or implement, interface. | In a class\
    \ that requires certain baseline functionality exposed by interface in order to\
    \ function |\n| new() | Type must have a public, parameterless constructor. |\
    \ In a class where you need to be able to instantiate variables of type T, perhaps\
    \ in a constructor |\n\n> **NOTE** If `new()` is used as a constraint, it must\
    \ be the last constraint specified for a type.\n\nIt is possible to use one type\
    \ parameter as a constraint on another through the base-class constraint as follows:\n\
    \n```\nclass MyGenericClass<T1, T2> where T2 : T1 { ... }\n```"
