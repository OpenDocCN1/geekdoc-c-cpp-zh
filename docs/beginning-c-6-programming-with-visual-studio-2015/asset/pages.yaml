  md: 'For example, let''s say you create a class with a really simple method. In
    fact, it''s so simple that you really aren''t that interested in stepping through
    it. Unfortunately — and to your considerable annoyance — you keep doing precisely
    that as you debug the code in your application. In this situation, it''s possible
    to add an attribute to the method that tells Visual Studio not to step into the
    code when you debug it; instead, Visual Studio should step through it and on to
    the next statement. The code for this is as follows:


    ```

    [DebuggerStepThrough]

    public void DullMethod() { ... }

    ```


    The attribute in this code is [DebuggerStepThrough]. All attributes are added
    in this way, by enclosing the name of the attribute in square brackets just before
    the target to which they apply. You can add multiple attributes to a single target
    either by separating them with commas or by enclosing each one in square brackets.


    The attribute used in the preceding code is actually implemented in a class called
    DebuggerStepThroughAttribute, and is found in the System.Diagnostics namespace,
    so you need a using statement for that namespace if you want to use this attribute.
    You can refer to this attribute either by its full name or, as in the code you
    saw, with an abbreviated name that doesn''t include the suffix Attribute.


    When you add an attribute in this way, the compiler creates an instance of the
    attribute class and associates it with the class method. Some attributes are customizable
    through constructor parameters or properties, and these can be specified when
    you add the attribute, for example:


    ```

    [DoesInterestingThings(1000, WhatDoesItDo = "voodoo")]

    public class DecoratedClass { }

    ```


    This attribute is passing a value of 1000 to the constructor of DoesInterestingThingsAttribute
    and setting the value of a property called WhatDoesItDo to the string "voodoo".


    # Reading Attributes


    In order to read attribute values, you have to use a technique called reflection.
    This is a fairly advanced technique that allows you to dynamically inspect type
    information at runtime, even to the point where you can create objects and call
    methods without knowing what those objects are. This book doesn''t cover this
    technique in detail, but you do need to know some basics in order to use attributes.


    Essentially, reflection involves using information stored in Type objects (which
    you''ve seen in several places in this book) along with types in the System.Reflection
    namespace to work with type information. You''ve already seen a quick way to get
    type information from a class with the typeof operator, and from an object instance
    using the GetType() method. Using reflection you can proceed to interrogate member
    information from the Type object. You can then obtain attribute information from
    the class or its various members.


    The simplest way to do this — and the only way you''ll see in this book — is to
    use the Type .GetCustomAttributes() method. This method takes up to two parameters
    and returns an array of object instances, each of which is an attribute instance.
    First, you can optionally pass the type'
