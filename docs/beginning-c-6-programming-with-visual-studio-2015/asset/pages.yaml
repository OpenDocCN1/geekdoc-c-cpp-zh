    \ with no return types are not called as part of expressions, so it is safe for\
    \ the compiler to remove all references to the partial method calls.\n\nSimilarly,\
    \ out parameters are forbidden since variables used as an out parameter must be\
    \ undefined before the method call and will be defined after the method call.\
