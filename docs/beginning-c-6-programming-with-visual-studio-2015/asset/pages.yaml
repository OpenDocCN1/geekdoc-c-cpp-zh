    The `<binding>` element, which has the name `BasicHttpBinding_IService1`, is included
    so that you can use it to customize the configuration of the binding. There are
    a number of configuration settings that you might use here, ranging from timeout
    settings to message size limits and security settings. If these had been specified
    in the service project to be nondefault values, then you would have seen them
    in the `app.config` file, since they would have been copied across. In order for
    the client to communicate with the service, the binding configurations must match.
    You won''t look at WCF service configuration in great depth in this chapter.


    This example has covered a lot of ground, and it is worth summarizing what you
    have learned before moving on:


    +   - WCF service definitions:

    +     - Services are defined by a service contract interface that includes operation
    contract members.

    +     - Services are implemented in a class that implements the service contract
    interface.

    +     - Data contracts are simply type definitions that use data contract attributes.

    +   - WCF service configuration:

    +     - You can use configuration files (`web.config` or `app.config`) to configure
    WCF services.

    +   - WCF web server hosting:

    +     - Web server hosting uses `.svc` files as service base addresses.

    +   - WCF client configuration:

    +     - You can use configuration files (`web.config` or `app.config`) to configure
    WCF service clients.


    The following section explores contracts in more detail.


    # The WCF Test Client


    In the previous Try It Out, you created both a service and a client in order to
    look at how the basic WCF architecture works and how configuration of WCF services
    is achieved. In practice, though, the client application you want to use might
    be complex, and it can be tricky to test services properly.


    To ease the development of WCF services, Visual Studio provides a test tool you
    can use to ensure that your WCF operations work correctly. This tool is automatically
    configured to work with your WCF service projects, so if you run your project
    the tool will appear. All you need to do is ensure that the service you want to
    test (that is, the `.svc` file) is set to be the startup page for the WCF service
    project. Alternatively, you can run the test client as a standalone application.
    You can find the test client on 64-bit operating systems at `C:\Program Files
    (x86)\Microsoft Visual Studio 14.0\Common7\IDE\WcfTestClient.exe`.'
