- pgno: 369
  md: "wondering what else could be needed; indeed, previous versions of C# lack little\
    \ in terms of functionality. However, this doesn't mean that it isn't possible\
    \ to make some aspects of C# programming easier, or that the relationships between\
    \ C# and other technologies can't be streamlined.\n\nYou also make some final\
    \ modifications to the CardLib code that you've been building in the last few\
    \ chapters, and even use CardLib to create a card game.\n\n# THE :: OPERATOR AND\
    \ THE GLOBAL NAMESPACE QUALIFIER\n\nThe :: operator provides an alternative way\
    \ to access types in namespaces. This might be necessary if you want to use a\
    \ namespace alias and there is ambiguity between the alias and the actual namespace\
    \ hierarchy. If that's the case, then the namespace hierarchy is given priority\
    \ over the namespace alias. To see what this means, consider the following code:\n\
    \n```\nusing MyNamespaceAlias = MyRootNamespace.MyNestedNamespace;\nnamespace\
    \ MyRootNamespace\n{\n    namespace MyNamespaceAlias\n    {\n        public class\
    \ MyClass {}\n    }\n    namespace MyNestedNamespace\n    {\n        public class\
    \ MyClass {}\n    }\n}\n```\n\nCode in MyRootNamespace might use the following\
    \ to refer to a class:\n\n```\nMyNamespaceAlias.MyClass\n```\n\nThe class referred\
    \ to by this code is the MyRootNamespace.MyNamespaceAlias.MyClass class, not the\
    \ MyRootNamespace.MyNestedNamespace.MyClass class. That is, the namespace MyRootNamespace.MyNamespaceAlias\
    \ has hidden the alias defined by the using statement, which refers to MyRootNamespace.MyNestedNamespace.\
    \ You can still access the MyRootNamespace.MyNestedNamespace namespace and the\
    \ class contained within, but it requires different syntax:\n\n```\nMyNestedNamespace.MyClass\n\
    ```\n\nAlternatively, you can use the :: operator:\n\n```\nMyNamespaceAlias::MyClass\n\
    ```\n\nUsing this operator forces the compiler to use the alias defined by the\
    \ using statement, and therefore the code refers to MyRootNamespace.MyNestedNamespace.MyClass.\n\
    \nYou can also use the keyword global with the :: operator, which is essentially\
    \ an alias to the top-level, root namespace. This can be useful to make it clearer\
    \ which namespace you are referring to, as shown here:\n\n```\nglobal::System.Collections.Generic.List<int>\n\
    ```"
