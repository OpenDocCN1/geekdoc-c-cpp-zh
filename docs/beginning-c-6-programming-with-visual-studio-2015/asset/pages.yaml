    \ how it went wrong.\n\nYou might, for example, provide a brief description of\
    \ the error in the first string, with instructions as to what to do next as the\
    \ second string:\n\n```\nTrace.Assert(myVar < 10, \"Variable out of bounds.\"\
    ,\n    \"Please contact vendor with the error code KCW001.\");\n```\n\nShould\
    \ this assertion occur, the user will see the dialog box shown in Figure 7-9.\n\
    \nAdmittedly, this isn't the most user-friendly dialog box in the world, as it\
    \ contains a lot of information that could confuse users, but if they send you\
    \ a screenshot of the error, it could quickly track down the problem.\n\n![](img/cf72ea860016d2d680fc085fc06f265a_174_0.png)\n\
    \nFIGURE 7-9\n\nNow it's time to look at what you can actually do after application\
    \ execution is halted and you are in break mode. In general, you enter break mode\
    \ to find an error in your code (or to reassure yourself that things are working\
    \ properly). Once you are in break mode, you can use various techniques, all of\
    \ which enable you to analyze your code and the exact state of the application\
    \ at the point in its execution where it is paused."
