- pgno: 364
  md: "For interface definitions, contravariant type parameters can be used only as\
    \ method parameters, not as return types.\n\nAgain, the best way to understand\
    \ this is to look at an example of how contravariance is used in the .NET Framework.\
    \ One interface that has a contravariant type parameter, again one that you've\
    \ already used, is IComparer<T>. You might implement this interface for animals\
    \ as follows:\n\n```\npublic class AnimalNameLengthComparer : IComparer<Animal>\n\
    {\n    public int Compare(Animal x, Animal y)\n        => x.Name.Length.CompareTo(y.Name.Length);\n\
    }\n```\n\nThis comparer compares animals by name length, so you could use it to\
    \ sort, for example, an instance of List<Animal>. However, through contravariance,\
    \ you can also use it to sort an instance of List<Cow>, even though the List<Cow>.Sort()\
    \ method expects an instance of IComparer<Cow>:\n\n```\nList<Cow> cows = new List<Cow>();\n\
    cows.Add(new Cow(\"Geronimo\"));\ncows.Add(new SuperCow(\"Tonto\"));\ncows.Add(new\
    \ Cow(\"Gerald\"));\ncows.Add(new Cow(\"Phil\"));\ncows.Sort(new AnimalNameLengthComparer());\n\
    ```\n\nIn most circumstances, contravariance is something that simply happens\
    \ — and it's been worked into the .NET Framework to help with just this sort of\
    \ operation. The good thing about both types of variance in .NET 4 and above,\
    \ though, is that you can now implement them with the techniques shown in this\
    \ section whenever you need them.\n\n# EXERCISES\n\n12.1 Which of the following\
