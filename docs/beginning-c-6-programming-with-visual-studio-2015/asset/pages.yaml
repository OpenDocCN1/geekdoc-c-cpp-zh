    \                                        input.Length - commaPos - 1));\n```\n\
    ```\n\n> **NOTE** For demonstration purposes, no user input validation is included\
    \ here.  \n> If this were “real” code, you’d spend much more time ensuring that\
    \ you had valid values in the local `param1` and `param2` variables.\n\nNext,\
    \ you ask the user to multiply or divide these numbers:\n\n```\n```csharp\nWriteLine(\"\
    Enter M to multiply or D to divide:\");\ninput = ReadLine();\n```\n```\n\nBased\
    \ on the user’s choice, you initialize the process delegate variable:\n\n```\n\
    ```csharp\nif (input == \"M\")\n    process = new ProcessDelegate(Multiply);\n\
    else\n    process = new ProcessDelegate(Divide);\n```\n```\n\nTo assign a function\
    \ reference to a delegate variable, you use slightly odd-looking syntax. Much\
    \ like assigning array values, you can use the new keyword to create a new delegate.\
    \ After this keyword, you specify the delegate type and supply an argument referring\
    \ to the function you want to use — namely, the `Multiply()` or `Divide()` function.\
    \ This argument doesn’t match the parameters of the delegate type or the target\
    \ function; it is a syntax unique to delegate assignment. The argument is simply\
    \ the name of the function to use, without any parentheses.\n\nIn fact, you can\
    \ use slightly simpler syntax here, if you want:\n\n```\n```csharp\nif (input\
    \ == \"M\")\n    process = Multiply;\nelse\n    process = Divide;\n```\n```\n\n\
    The compiler recognizes that the delegate type of the process variable matches\
    \ the signature of the two functions, and automatically initializes a delegate\
    \ for you. Which syntax you use is up to you, although some people prefer to use\
    \ the longhand version, as it is easier to see at a glance what is happening.\n\
    \nFinally, call the chosen function using the delegate. The same syntax works,\
    \ regardless of which function the delegate refers to:\n\n```\n```csharp\nWriteLine($\"\
    Result: {process(param1, param2)}\");\nReadKey();\n}\n```\n```\n\nHere, you treat\
    \ the delegate variable as if it were a function name. Unlike a function, though,\
    \ you can also perform additional operations on this variable, such as passing\
    \ it to a function via a parameter, as shown in this simple example:\n\n```\n\
    ```csharp\nstatic void ExecuteFunction(ProcessDelegate process)\n    => process(2.2,\
    \ 3.3);\n```\n```"
