- pgno: 81
  md: '# BOOLEAN LOGIC


    The bool type introduced in the previous chapter can hold one of only two values:
    true or false. This type is often used to record the result of some operation,
    so that you can act on this result. In particular, bool types are used to store
    the result of a comparison.


    > **NOTE** As a historical aside, it is the work of the mid-nineteenth-century
    English mathematician George Boole that forms the basis of Boolean logic.


    For instance, consider the situation (mentioned in the chapter introduction) in
    which you want to execute code based on whether a variable, myVal, is less than
    10. To do this, you need some indication of whether the statement "myVal is less
    than 10" is true or false — that is, you need to know the Boolean result of a
    comparison.


    Boolean comparisons require the use of Boolean comparison operators (also known
    as relational operators), which are shown in Table 4-1.


    # TABLE 4-1: Boolean Comparison Operators


    | OPERATOR | CATEGORY | EXAMPLE EXPRESSION | RESULT |

    |---|---|---|---|

    | == | Binary | `var1 = var2 == var3;` | var1 is assigned the value true if var2
    is equal to var3, or false otherwise. |

    | != | Binary | `var1 = var2 != var3;` | var1 is assigned the value true if var2
    is not equal to var3, or false otherwise. |

    | < | Binary | `var1 = var2 < var3;` | var1 is assigned the value true if var2
    is less than var3, or false otherwise. |

    | > | Binary | `var1 = var2 > var3;` | var1 is assigned the value true if var2
    is greater than var3, or false otherwise. |

    | <= | Binary | `var1 = var2 <= var3;` | var1 is assigned the value true if var2
    is less than or equal to var3, or false otherwise. |

    | >= | Binary | `var1 = var2 >= var3;` | var1 is assigned the value true if var2
    is greater than or equal to var3, or false otherwise. |


    In all cases in Table 4-1, var1 is a bool type variable, whereas the types of
    var2 and var3 may vary.'
  merge: -1
  img_proc: true
