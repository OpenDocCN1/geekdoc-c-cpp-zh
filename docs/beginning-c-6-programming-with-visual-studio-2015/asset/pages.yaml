- pgno: 727
  md: '> NOTE If you create a proxy class with ChannelFactory<T>.CreateChannel(),
    the communication channel will, by default, time out after a minute, which can
    lead to communication errors. There are ways to keep connections alive, but they
    are beyond the scope of this chapter. Creating proxy classes in this way is an
    extremely useful technique that you can use to quickly generate a client application
    on-the-fly.


    # Self-Hosted WCF Services


    So far in this chapter you have seen WCF services that are hosted in web servers.
    This enables you to communicate across the Internet, but for local network communications
    it is not the most efficient way of doing things. For one thing, you need a web
    server on the computer that hosts the service. In addition, the architecture of
    your applications might be such that having an independent WCF service isn''t
    desirable.


    Instead, you might want to use a self-hosted WCF service. A self-hosted WCF service
    exists in a process that you create, rather than in the process of a specially
    made hosting application such as a web server. This means, for example, that you
    can use a console application or Windows application to host your service.


    To self-host a WCF service, you use the System.ServiceModel.ServiceHost class.
    You instantiate this class with either the type of the service you want to host
    or an instance of the service class. You can configure a service host through
    properties or methods, or (and this is the clever part) through a configuration
    file. In fact, host processes, such as web servers, use a ServiceHost instance
    to do their hosting. The difference when self-hosting is that you interact with
    this class directly. However, the configuration you place in the <system.serviceModel>
    section of the app.config file for your host application uses exactly the same
    syntax as the configuration sections you''ve already seen in this chapter.


    You can expose a self-hosted service through any protocol that you like, although
    typically you will use TCP or named pipe binding in this type of application.
    Services accessed through HTTP are more likely to live inside web server processes,
    because you get the additional functionality that web servers offer, such as security
    and other features.


    If you want to host a service called MyService, you could use code such as the
    following to create an instance of ServiceHost:


    ```

    ServiceHost host = new ServiceHost(typeof(MyService));

    ```


    If you want to host an instance of MyService called myServiceObject, you could
    code as follows to create an instance of ServiceHost:


    ```

    MyService myServiceObject = new MyService();

    ServiceHost host = new ServiceHost(myServiceObject);

    ```'
  merge: -1
