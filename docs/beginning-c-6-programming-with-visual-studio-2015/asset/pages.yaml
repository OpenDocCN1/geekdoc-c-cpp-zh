  md: "can't be less than 2. This makes sense, because 2 is the lowest prime number.\
    \ The interesting code is all in the GetEnumerator() method. The method signature\
    \ fulfills the rules for an iterator block in that it returns an IEnumerable type:\n\
    \n```\npublic IEnumerable GetEnumerator()\n{\n```\n\nTo extract prime numbers\
    \ between limits, you need to test each number in turn, so you start with a for\
    \ loop:\n\n```\nfor (long possiblePrime = min; possiblePrime <= max; possiblePrime++)\n\
    {\n```\n\nBecause you don't know whether a number is prime, you first assume that\
    \ it is and then check to see if it isn't. That means checking whether any number\
    \ between 2 and the square root of the number to be tested is a factor. If this\
    \ is true, then the number isn't prime, so you move on to the next one. If the\
    \ number is indeed prime, then you pass it to the foreach loop using yield:\n\n\
    ```\nbool isPrime = true;\nfor (long possibleFactor = 2; possibleFactor <= (long)Math.Floor(Math.Sqrt(possiblePrime));\
    \ possibleFactor++)\n{\n    long remainderAfterDivision = possiblePrime % possibleFactor;\n\
    \    if (remainderAfterDivision == 0)\n    {\n        isPrime = false;\n     \
    \   break;\n    }\n}\nif (isPrime)\n{\n    yield return possiblePrime;\n}\n}\n\
    ```\n\nAn interesting fact reveals itself through this code if you set the minimum\
    \ and maximum limits to very big numbers. When you execute the application, the\
    \ results appear one at a time, with pauses in between, rather than all at once.\
    \ This is evidence that the iterator code returns results one at a time, despite\
    \ the fact that there is no obvious place where the code terminates between yield\
    \ calls. Behind the scenes, calling yield does interrupt the code, which resumes\
    \ when another value is requested — that is, when the foreach loop using the iterator\
    \ begins a new cycle.\n\n# Iterators and Collections\n\nEarlier you were promised\
    \ an explanation of how iterators can be used to iterate over the objects stored\
    \ in a dictionary-type collection without having to deal with DictionaryItem objects.\
    \ In the downloadable code for this chapter, you will find the code for the next\
    \ project in the DictionaryAnimals folder. Recall the collection class Animals:\n\
    \n```\npublic class Animals : DictionaryBase\n{\n    public void Add(string newID,\
    \ Animal newAnimal)\n```"
