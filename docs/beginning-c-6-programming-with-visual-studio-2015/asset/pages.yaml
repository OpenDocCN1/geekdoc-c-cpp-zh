- pgno: 593
  md: 'The properties specific to FileInfo are shown in Table 18-5.


    TABLE 18-5: FileInfo Properties


    | PROPERTY | DESCRIPTION |

    |---|---|

    | Directory | Retrieves a DirectoryInfo object representing the directory containing
    the current file. This property is read-only. |

    | DirectoryName | Returns the path to the file''s directory. This property is
    read-only. |

    | IsReadOnly | Shortcut to the read-only attribute of the file. This property
    is also accessible via Attributes. |

    | Length | Gets the size of the file in bytes, returned as a long value. This
    property is read-only. |


    # The DirectoryInfo Class


    The DirectoryInfo class works exactly like the FileInfo class. It is an instantiated
    object that represents a single directory on a machine. Like the FileInfo class,
    many of the method calls are duplicated across Directory and DirectoryInfo. The
    guidelines for choosing whether to use the methods of File or FileInfo also apply
    to DirectoryInfo methods:


    +   - If you are making a single call, use the static Directory class.

    +   - If you are making a series of calls, use an instantiated DirectoryInfo object.


    The DirectoryInfo class inherits most of its properties from FileSystemInfo, as
    does FileInfo, although these properties operate on directories instead of files.
    There are also two DirectoryInfo-specific properties, shown in Table 18-6.


    TABLE 18-6: Properties Unique to the DirectoryInfo Class


    | PROPERTY | DESCRIPTION |

    |---|---|

    | Parent | Retrieves a DirectoryInfo object representing the directory containing
    the current directory. This property is read-only. |

    | Root | Retrieves a DirectoryInfo object representing the root directory of the
    current volume — for example, the C:\ directory. This property is read-only. |


    # Path Names and Relative Paths


    When specifying a path name in .NET code, you can use absolute or relative path
    names. An absolute path name explicitly specifies a file or directory from a known
    location — such as the C: drive.'
