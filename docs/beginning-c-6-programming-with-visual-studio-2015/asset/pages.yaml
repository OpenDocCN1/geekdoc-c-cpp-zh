  md: 'a one-shot use of the Watch windows. To do this, type an expression and press
    Return. The information requested will then be displayed. An example is shown
    in Figure 7-15.


    ![](img/cf72ea860016d2d680fc085fc06f265a_179_0.png)


    FIGURE 7-15


    You can also change variable content here, as demonstrated in Figure 7-16.


    ![](img/cf72ea860016d2d680fc085fc06f265a_179_1.png)


    FIGURE 7-16


    In most cases, you can get the effects you want more easily using the variable
    monitoring windows shown earlier, but this technique is still handy for tweaking
    values, and it''s good for testing expressions.


    # The Call Stack Window


    The final window to look at is the Call Stack window, which shows you the way
    in which the program reached the current location. In simple terms, this means
    showing the current function along with the function that called it, the function
    that called that, and so on (that is, a list of nested function calls). The exact
    points where calls are made are also recorded.


    In the earlier example, entering break mode when in Maxima( ), or moving into
    this function using code stepping, reveals the information shown in Figure 7-17.


    ![](img/cf72ea860016d2d680fc085fc06f265a_179_2.png)


    FIGURE 7-17


    If you double-click an entry, you are taken to the appropriate location, enabling
    you to track the way code execution has reached the current point. This window
    is particularly useful when errors are first detected, because you can see what
    happened immediately before the error. Where errors occur in commonly used functions,
    this helps you determine the source of the error.'
