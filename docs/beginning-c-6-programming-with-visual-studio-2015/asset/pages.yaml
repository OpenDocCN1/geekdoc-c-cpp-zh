    ConvClass1 op1 = new ConvClass1();\nop1.val = 3;\nConvClass2 op2 = op1;\n```\n\
    \nA conversion in the other direction, however, requires the following explicit\
    \ casting conversion:\n\n```\nConvClass2 op1 = new ConvClass2();\nop1.val = 3e5;\n\
    ConvClass1 op2 = (ConvClass1)op1;\n```"
