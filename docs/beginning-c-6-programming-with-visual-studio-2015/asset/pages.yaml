- pgno: 114
  md: "Note that this can cause problems, with values specified after a definition\
    \ such as <value2> = <value1> being identical to other values. For example, in\
    \ the following code <value4> will have the same value as <value2>:\n\n```\nenum\
    \ <typeName> : <underlyingType>\n{\n    <value1> = <actualVal1>,\n    <value2>,\n\
    \    <value3> = <value1>,\n    <value4>,\n    ...\n    <valueN> = <actualValN>\n\
    }\n```\n\nOf course, if this is the behavior you want, then this code is fine.\
    \ Note also that assigning values in a circular fashion will cause an error:\n\
    \n```\nenum <typeName> : <underlyingType>\n{\n    <value1> = <value2>,\n    <value2>\
    \ = <value1>\n}\n```\n\nThe following Try It Out shows an example of all of this.\
    \ The code defines and then uses an enumeration called orientation.\n\n# TRY IT\
    \ OUT Using an Enumeration: Ch05Ex02\\Program.cs\n\n+   1. Create a new console\
