  md: "# TRY IT OUT Using a Group Query: BegVCSharp_20_10_GroupQuery\\Program.cs\n\
    \nFollow these steps to create the example in Visual Studio 2015:\n\n+   1. Create\
    \ a new console application called BegVCSharp_20_10_GroupQuery in the directory\
    \ C:\\BegVCSharp\\Chapter20.\n+   2. Create the Customer class and the initialization\
    \ of the customers list (List<Customer> customers), as shown in the BegVCSharp_20_8_SelectDistinctQuery\
    \ example; this code is exactly the same as previous examples.\n+   3. In the\
    \ Main() method, following the initialization of the customers list, enter two\
    \ queries:\n+   4. Continuing in the Main() method, add the following print statement\
    \ and foreach processing loop:\n+   5. The results processing loop and the remaining\
    \ code in the Main() method are the same as in previous examples. Compile and\
    \ execute the program. Here are the group results:\n\n```\nvar queryResults =\n\
    \    from c in customers\n    group c by c.Region into cg\n    select new { TotalSales\
    \ = cg.Sum(c => c.Sales), Region = cg.Key }\n;\nvar orderedResults =\n    from\
    \ cg in queryResults\n    orderby cg.TotalSales descending\n    select cg\n;\n\
    ```\n\n```\nWriteLine(\"Total\\t: By\\nSales\\t: Region\\n-----\\t-----\");\n\
    foreach (var item in orderedResults)\n{\n    WriteLine($\"{item.TotalSales}\\\
    t: {item.Region}\");\n}\n```\n\n```\nTotal  : By\nSales  : Region\n------\n52997\
    \  : Asia\n16999  : North America\n12444  : Europe\n8558   : South America\n7000\
    \   : Africa\n```\n\n# How It Works\n\nThe Customer class and customers list initialization\
    \ are the same as in previous examples.\n\nThe data in a group query is grouped\
    \ by a key field, the field for which all the members of each group share a value.\
    \ In this example, the key field is the Region:\n\n```\ngroup c by c.Region\n\
    ```\n\nYou want to calculate a total for each group, so you group into a new result\
    \ set named cg:\n\n```\ngroup c by c.Region into cg\n```"
  merge: -1
  img_proc: true
- pgno: 673
  md: "In the select clause, you project a new anonymous type whose properties are\
    \ the total sales (calculated by referencing the cg result set) and the key value\
    \ of the group, which you reference with the special group Key:\n\n```\nselect\
    \ new { TotalSales = cg.Sum(c => c.Sales), Region = cg.Key }\n```\n\nThe group\
    \ result set implements the LINQ IGrouping interface, which supports the Key property.\
    \ You almost always want to reference the Key property in some way in processing\
    \ group results, because it represents the criteria by which each group in your\
    \ data was created.\n\nYou want to order the result in descending order by TotalSales\
    \ field so you can see which region has the highest total sales, next highest,\
    \ and so on. To do that, you create a second query to order the results from the\
    \ group query:\n\n```\nvar orderedResults =\n    from cg in queryResults\n   \
    \ orderby cg.TotalSales descending\n    select cg\n;\n```\n\nThe second query\
    \ is a standard select query with an orderby clause, as you have seen in previous\
    \ examples; it does not make use of any LINQ group capabilities except that the\
    \ data source comes from the previous group query.\n\nNext, you print out the\
    \ results, with a little bit of formatting code to display the data with column\
    \ headers and some separation between the totals and the group names:\n\n```\n\
    WriteLine(\"Total\\t: By\\nSales\\t: Region\\n---\\t---\");\nforeach (var item\
    \ in orderedResults)\n{\n    WriteLine($\"{item.TotalSales}\\t: {item.Region}*\"\
    );\n};\n```\n\nThis could be formatted in a more sophisticated way with field\
    \ widths and by right-justifying the totals, but this is just an example so you\
    \ don't need to bother — you can see the data clearly enough to understand what\
    \ the code is doing.\n\n# USING JOINS\n\nA data set such as the customers and\
    \ orders list you just created, with a shared key field (ID), enables a join query,\
    \ whereby you can query related data in both lists with a single query, joining\
    \ the results together with the key field. This is similar to the JOIN operation\
    \ in the SQL data query language; and as you might expect, LINQ provides a join\
    \ command in the query syntax, which you will use in the following Try It Out.\n\
    \nTRY IT OUT  Join Query: BegVCSharp_20_11_JoinQuery\\Program.cs\n\nFollow these\
    \ steps to create the example in Visual Studio 2015:\n\n+   1. Create a new console\
    \ application called BegVCSharp_20_11_JoinQuery in the directory C:\\BegVCSharp\\\
    Chapter20."
