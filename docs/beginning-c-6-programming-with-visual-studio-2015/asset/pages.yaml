    \ enables you to code your own aggregate function. However, those are for advanced\
    \ users and therefore beyond the scope of this book.\n\n> **NOTE** Because the\
    \ aggregate operators return a simple scalar type instead of a sequence for their\
    \ results, their use forces immediate execution of query results with no deferred\
    \ execution.\n\nIn the following Try It Out, you modify the large-number query\
