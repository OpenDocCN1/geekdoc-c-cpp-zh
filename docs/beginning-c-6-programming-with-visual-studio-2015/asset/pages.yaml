- pgno: 399
  md: "This works very well for types that are primarily used for data representation,\
    \ and as such, collection initializers are a great accompaniment to the LINQ technology\
    \ described later in the book.\n\nThe following Try It Out illustrates how you\
    \ can use object and collection initializers.\n\n# TRY IT OUT Using Initializers:\
    \ Ch13Ex04\n\n+   1. Create a new console application called Ch13Ex04 and save\
    \ it in the directory C:\\BegVCSharp\\Chapter13.\n+   2. Right-click on the project\
    \ name in the Solution Explorer window and select the Add Existing Item option.\n\
    +   3. Select the Animal.cs, Cow.cs, Chicken.cs, SuperCow.cs, and Farm.cs files\
    \ from the C:\\BegVCSharp\\Chapter12\\Ch12Ex04\\Ch12Ex04 directory, and click\
    \ Add.\n+   4. Modify the namespace declaration in the file you have added as\
    \ follows:\n+      namespace Ch13Ex04\n+   5. Remove the constructors from the\
    \ Cow, Chicken, and SuperCow classes.\n\n6. Modify the code in Program.cs as follows:\n\
    \n```\nstatic void Main(string[] args)\n{\n    Farm<Animal> farm = new Farm<Animal>\n\
    \    {\n        new Cow { Name=\"Lea\" },\n        new Chicken { Name=\"Noa\"\
    \ },\n        new Chicken(),\n        new SuperCow { Name=\"Andrea\" }\n    };\n\
    \    farm.MakeNoises();\n    ReadKey();\n}\n```\n\n7. Build the application. You\
    \ should receive the build errors shown in Figure 13-10 because there is no Add(T\
    \ animal) method definition in the Farm class. It is added in the next step.\n\
    \n![](img/cf72ea860016d2d680fc085fc06f265a_399_0.png)\n\n# FIGURE 13-10"
  merge: -1
  img_proc: true
- pgno: 400
  md: "8. Add the following code to Farm.cs:\n\n```\npublic class Farm<T> : IEnumerable<T>\
    \ where T : Animal\n{\n  public void Add(T animal) => animals.Add(animal);\n \
    \ ...\n```\n\n9. Run the application. The result is shown in Figure 13-11.\n\n\
    ![](img/cf72ea860016d2d680fc085fc06f265a_400_0.png)\n\nFIGURE 13-11\n\n# How It\
    \ Works\n\nThis example combines object and collection initializers to create\
    \ and populate a collection of objects in a single step. It uses the farmyard\
    \ collection of objects that you have seen in previous chapters, although two\
    \ modifications are necessary for initializers to be used with these classes.\n\
    \nFirst, you remove the constructors from the classes derived from the base Animal\
    \ class. You can remove these constructors because they set the animal's Name\
    \ property, which you will do with object initializers instead. Alternatively,\
    \ you could have added default constructors. In either case, when using default\
    \ constructors, the Name property is initialized according to the default constructor\
    \ in the base class, which has code as follows:\n\n```\npublic Animal()\n{\n \
    \ name = \"The animal with no name\";\n}\n```\n\nHowever, when an object initializer\
    \ is used with a class that derives from Animal, recall that any properties set\
    \ by the initializer are set after the object is instantiated, and therefore after\
    \ this base class constructor is executed. If a value for the Name property is\
    \ supplied as part of an object initializer, it will override this default value.\
    \ In the example code, the Name property is set for all but one of the items added\
    \ to the collection.\n\nSecond, you add an Add() method to the Farm class. This\
    \ is in response to a series of compiler errors of the following form:\n\n```\n\
    'Ch13Ex04.Farm<Ch13Ex04.Animal>' does not contain a definition for 'Add'\n```\n\
    \nThis error exposes part of the underlying functionality of collection initializers.\
    \ Behind the scenes, the compiler calls the Add() method of a collection for each\
    \ item that you supply in a collection initializer. The Farm class exposes a collection\
    \ of Animal objects through a property called Animals. The compiler cannot guess\
    \ that this is the property you want to populate (through Animals.Add()), so the\
    \ code fails. To correct this problem, you add an Add() method to the class, which\
    \ is initialized through the object initializer."
