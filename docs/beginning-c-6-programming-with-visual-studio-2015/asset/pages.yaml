- pgno: 279
  md: 'more. You''ll learn how to use and create collection classes and learn about
    some powerful techniques for getting the most out of them.


    +   - **Comparisons** — When dealing with objects, you often want to make comparisons
    between them. This is especially important in collections, because it is how sorting
    is achieved. You''ll look at how to compare objects in a number of ways, including
    operator overloading, and how to use the `IComparable` and `IComparer` interface
    to sort collections.

    +   - **Conversions** — Earlier chapters showed you how to cast objects from one
    type into another. In this chapter, you''ll learn how to customize type conversions
    to suit your needs.


    # COLLECTIONS


    In Chapter 5, you learned how to use arrays to create variable types that contain
    a number of objects or values. Arrays, however, have their limitations. The biggest
    limitation is that once arrays have been created, they have a fixed size, so you
    can''t add new items to the end of an existing array without creating a new one.
    This often means that the syntax used to manipulate arrays can become overly complicated.
    OOP techniques enable you to create classes that perform much of this manipulation
    internally, simplifying the code that uses lists of items or arrays.


    Arrays in C# are implemented as instances of the `System.Array` class and are
    just one type of what are known as *collection classes*. Collection classes in
    general are used for maintaining lists of objects, and they may expose more functionality
    than simple arrays. Much of this functionality comes through implementing interfaces
    from the `System.Collections` namespace, thus standardizing collection syntax.
    This namespace also contains some other interesting things, such as classes that
    implement these interfaces in ways other than `System.Array`.


    Because the collection''s functionality (including basic functions such as accessing
    collection items by using [index] syntax) is available through interfaces, you
    aren''t limited to using basic collection classes such as `System.Array`. Instead,
    you can create your own customized collection classes. These can be made more
    specific to the objects you want to enumerate (that is, the objects you want to
    maintain collections of). One advantage of doing this, as you will see, is that
    custom collection classes can be *strongly typed*. That is, when you extract items
    from the collection, you don''t need to cast them into the correct type. Another
    advantage is the capability to expose specialized methods. For example, you can
    provide a quick way to obtain subsets of items. In the deck of cards example,
    you could add a method to obtain all `Card` items of a particular suit.


    Several interfaces in the `System.Collections` namespace provide basic collection
    functionality:


    +   - `IEnumerable` — Provides the capability to loop through items in a collection

    +   - `ICollection` — Provides the capability to obtain the number of items in
    a collection and copy items into a simple array type (inherits from `IEnumerable`)

    +   - `IList` — Provides a list of items for a collection along with the capabilities
    for accessing these items, and some other basic capabilities related to lists
    of items (inherits from `IEnumerable` and `ICollection`)

    +   - `IDictionary` — Similar to `IList`, but provides a list of items accessible
    via a key value, rather than an index (inherits from `IEnumerable` and `ICollection`)'
