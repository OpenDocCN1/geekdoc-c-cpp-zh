- pgno: 418
  md: 'This is a very useful tooltip, as it shows not only the names of available
    parameters, but also the default values for optional parameters, so you can tell
    at a glance if you need to override a particular default.


    # LAMBDA EXPRESSIONS


    Lambda expressions are a construct introduced in C# 3 that you can use to simplify
    certain aspects of C# programming, in particular when combined with LINQ. They
    can be difficult to grasp at first, mainly because they are so flexible in their
    usage. Lambda expressions are extremely useful when combined with other C# language
    features, such as anonymous methods. Without looking at LINQ, a subject left until
    later in the book, anonymous methods are the best entry point for examining this
    subject. Start with a quick refresher.


    # Anonymous Methods Recap


    Previously in this chapter you learned about anonymous methods — methods that
    you supply inline, where a delegate type variable would otherwise be required.
    When you add an event handler to an event, the sequence of events is as follows:


    +   1. Define an event handler method whose return type and parameters match those
    of the delegate required for the event to which you want to subscribe.

    +   2. Declare a variable of the delegate type used for the event.

    +   3. Initialize the delegate variable to an instance of the delegate type that
    refers to the event handler method.

    +   4. Add the delegate variable to the list of subscribers for the event.


    In practice, things are a bit simpler than this because you typically won''t bother
    with a variable to store the delegate — you will just use an instance of the delegate
    when you subscribe to the event.


    This was the case when you previously used the following code:


    ```

    ```csharp

    Timer myTimer = new Timer(100);

    myTimer.Elapsed += new ElapsedEventHandler(WriteChar);

    ```

    ```


    This code subscribes to the Elapsed event of a Timer object. This event uses the
    ElapsedEventHandler delegate type, which is instantiated using a method identifier,
    WriteChar. The result here is that when the Timer raises the Elapsed event, the
    WriteChar() method is called. The parameters passed to WriteChar() depend on the
    parameter types defined by the ElapsedEventHandler delegate and the values passed
    by the code in Timer that raises the event.


    In fact, the C# compiler can achieve the same result with even less code through
    method group syntax:


    ```

    ```csharp

    myTimer.Elapsed += WriteChar;

    ```

    ```'
