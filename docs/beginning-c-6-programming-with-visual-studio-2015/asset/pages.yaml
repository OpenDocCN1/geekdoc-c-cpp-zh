  md: '# WHAT YOU HAVE LEARNED IN THIS CHAPTER


    | TOPIC | KEY CONCEPTS |

    |---|---|

    | Using generic types | Generic types require one or more type parameters to work.
    You can use a generic type as the type of a variable by passing the type parameters
    you require when you declare a variable. You do this by enclosing a comma-separated
    list of type names in angle brackets. |

    | Nullable types | Nullable types are types that can take any value of a specified
    value type or the value null. You can use the syntax `Nullable<T>` or `T?` to
    declare a nullable type variable. |

    | The ?? operator | The null coalescing operator returns either the value of its
    first operand, or, if the first operand is null, its second operand. |

    | Generic collections | Generic collections are extremely useful as they come
    with strong typing built-in. You can use `List<T>`, `Collection<T>`, and `Dictionary<K,
    V>` among other collection types. These also expose generic interfaces. To sort
    and search generic collections, you use the `IComparer<T>` and `IComparable<T>`
    interfaces. |

    | Defining generic classes | You define a generic type much like any other type,
    with the addition of generic type parameters where you specify the type name.
    As with using generic types, you specify these as a comma-separated list enclosed
    in angle brackets. You can use the generic type parameters in your code anywhere
    you''d use a type name, for example, in method return values and parameters. |

    | Generic type parameter constraints | In order to use generic type parameters
    more effectively in your generic type code, you can constrain the types that can
    be supplied when the type is used. You can constrain type parameters by base class,
    supported interface, whether they must be value or reference types, and whether
    they support parameterless constructors. Without such constraints, you must use
    the `default` keyword to instantiate a variable of a generic type. |

    | Other generic types | As well as classes, you can define generic interfaces,
    delegates, and methods. |

    | Variance | Variance is a concept similar to polymorphism, but applied to type
    parameters. It allows you to use one generic type in place of another, where those
    generic types vary only in the generic type parameters used. Covariance allows
    conversion between two types where the target type has a type parameter that is
    a base class of the type parameter of the source type. Contravariance allows conversion
    where this relationship is inverted. Covariant type parameters are defined with
    the `out` parameter, and can only be used as return types and property get accessor
    types. Contravariant type parameters are defined with the `in` parameter and can
    only be used as method parameters. |'
