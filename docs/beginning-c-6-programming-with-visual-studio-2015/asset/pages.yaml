- pgno: 86
  md: 'It doesn''t hurt to add parentheses to make expressions such as this one clearer.
    The compiler knows what order to process operators in, but we humans are prone
    to forget such things (and you might want to change the order). Writing the previous
    expression as


    ```

    var1 = (var2 <= 4) && (var2 >= 2);

    ```


    solves this problem by explicitly ordering the computation.


    # BRANCHING


    Branching is the act of controlling which line of code should be executed next.
    The line to jump to is controlled by some kind of conditional statement. This
    conditional statement is based on a comparison between a test value and one or
    more possible values using Boolean logic.


    This section describes three branching techniques available in C#:


    +   - The ternary operator

    +   - The if statement

    +   - The switch statement


    # The Ternary Operator


    The simplest way to perform a comparison is to use the ternary (or conditional)
    operator mentioned in the last chapter. You''ve already seen unary operators that
    work on one operand, and binary operators that work on two operands, so it won''t
    come as a surprise that this operator works on three operands. The syntax is as
    follows:


    ```

    <test> ? <resultIfTrue> : <resultIfFalse>

    ```


    Here, <test> is evaluated to obtain a Boolean value, and the result of the operator
    is either <resultIfTrue> or <resultIfFalse> based on this value.


    You might use this as follows to test the value of an int variable called myInteger:


    ```

    string resultString = (myInteger < 10) ? "Less than 10"

    : "Greater than or equal to 10";

    ```


    The result of the ternary operator is one of two strings, both of which may be
    assigned to resultString. The choice of which string to assign is made by comparing
    the value of myInteger to 10. In this case, a value of less than 10 results in
    the first string being assigned, and a value of greater than or equal to 10 results
    in the second string being assigned. For example, if myInteger is 4, then resultString
    will be assigned the string Less than 10.


    # The if Statement


    The if statement is a far more versatile and useful way to make decisions. Unlike
    ?: statements, if statements don''t have a result (so you can''t use them in assignments);
    instead, you use the statement to conditionally execute other statements.'
