  md: '# SYSTEM.OBJECT


    Because all classes inherit from System.Object, all classes have access to the
    protected and public members of this class. Therefore, it is worthwhile to take
    a look at what is available there. System.Object contains the methods described
    in Table 9-2.


    TABLE 9-2: Methods of System.Object


    | METHOD | RETURN TYPE | VIRTUAL | STATIC | DESCRIPTION |

    |---|---|---|---|---|

    | Object() | N/A | No | No | Constructor for the System.Object type. Automatically
    called by constructors of derived types. |

    | ~Object() (also known as Finalize() — see the next section) | N/A | No | No
    | Destructor for the System.Object type. Automatically called by destructors of
    derived types; cannot be called manually. |

    | Equals(object) | bool | Yes | No | Compares the object for which this method
    is called with another object and returns true if they are equal. The default
    implementation checks whether the object parameter refers to the same object (because
    objects are reference types). This method can be overridden if you want to compare
    objects in a different way, for example, to compare the state of two objects.
    |

    | Equals(object, object) | bool | No | Yes | Compares the two objects passed to
    it and checks whether they are equal. This check is performed using the Equals(object)
    method. If both objects are null references, then this method returns true. |

    | ReferenceEquals(object, object) | bool | No | Yes | Compares the two objects
    passed to it and checks whether they are references to the same instance. |'
  merge: -1
  img_proc: true
- pgno: 221
  md: "# TABLE 9.2 (continued)\n\n| METHOD | RETURN TYPE | VIRTUAL | STATIC | DESCRIPTION\
    \ |\n|---|---|---|---|---|\n| ToString() | string | Yes | No | Returns a string\
    \ corresponding to the object instance. By default, this is the qualified name\
    \ of the class type, but this can be overridden to provide an implementation appropriate\
    \ to the class type. |\n| MemberwiseClone() | object | No | No | Copies the object\
    \ by creating a new object instance and copying members. This member copying does\
    \ not result in new instances of these members. Any reference type members of\
    \ the new object refer to the same objects as the original class. This method\
    \ is protected, so it can be used only from within the class or from derived classes.\
    \ |\n| GetType() | System.Type | No | No | Returns the type of the object in the\
    \ form of a System.Type object. |\n| GetHashCode() | int | Yes | No | Used as\
    \ a hash function for objects where this is required. A hash function returns\
    \ a value identifying the object state in some compressed form. |\n\nThese are\
    \ the basic methods that must be supported by object types in the .NET Framework,\
    \ although you might never use some of them (or you might use them only in special\
    \ circumstances, such as GetHashCode()).\n\nGetType() is helpful when you are\
    \ using polymorphism because it enables you to perform different operations with\
    \ objects depending on their type, rather than the same operation for all objects,\
    \ as is often the case. For example, if you have a function that accepts an object\
    \ type parameter (meaning you can pass it just about anything), you might perform\
    \ additional tasks if certain objects are encountered. Using a combination of\
    \ GetType() and typeof (a C# operator that converts a class name into a System.Type\
    \ object), you can perform comparisons such as the following:\n\n```\nif (myObj.GetType()\
    \ == typeof(MyComplexClass))\n{\n    // myObj is an instance of the class MyComplexClass.\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 222
  md: "The System.Type object returned is capable of a lot more than that, but only\
    \ this is covered here. It can also be very useful to override the ToString()\
    \ method, particularly in situations where the contents of an object can be easily\
    \ represented with a single human-readable string. You see these System.Object\
    \ methods repeatedly in subsequent chapters, so you'll learn more details as necessary.\n\
    \n# CONSTRUCTORS AND DESTRUCTORS\n\nWhen you define a class in C#, it's often\
    \ unnecessary to define associated constructors and destructors because the compiler\
    \ adds them for you when you build your code if you don't supply them. However,\
    \ you can provide your own, if required, which enables you to initialize and clean\
    \ up after your objects, respectively.\n\nYou can add a simple constructor to\
    \ a class using the following syntax:\n\n```\nclass MyClass\n{\n    public MyClass()\n\
    \    {\n        // Constructor code.\n    }\n}\n```\n\nThis constructor has the\
    \ same name as the class that contains it, has no parameters (making it the default\
    \ constructor for the class), and is public so that objects of the class can be\
    \ instantiated using this constructor (refer to Chapter 8 for more information\
    \ about this).\n\nYou can also use a private default constructor, meaning that\
    \ object instances of this class cannot be created using this constructor (it\
    \ is non-creatable — again, see the discussion in Chapter 8):\n\n```\nclass MyClass\n\
    {\n    private MyClass()\n    {\n        // Constructor code.\n    }\n}\n```\n\
    \nFinally, you can add nondefault constructors to your class in a similar way,\
    \ simply by providing parameters:\n\n```\nclass MyClass\n{\n    public MyClass()\n\
    \    {\n        // Default constructor code.\n    }\n    public MyClass(int myInt)\n\
    \    {\n        // Nondefault constructor code (uses myInt).\n    }\n}\n```"
  merge: -1
