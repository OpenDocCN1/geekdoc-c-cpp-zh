  md: 'are at it, expand the Common WPF Controls node in the panel as well. You will
    be using most of the controls shown here in this chapter.


    # WPF Controls


    Controls combine prepackaged code and a GUI that can be reused to create more
    complex applications. They can define how they draw themselves by default and
    a set of standard behaviors. Some controls, such as the `Label`, `Button`, and
    `TextBox` controls are easily recognizable and have been used in Windows applications
    for about 20 years. Others, such as `Canvas` and `StackPanel`, don''t display
    anything and simply help you create the GUI.


    Out-of-the-box controls look exactly as you would expect a control to look in
    a standard Windows application and use the current Windows Theme to draw themselves.
    All of this is highly customizable and with only a few clicks you can completely
    change how a control is displayed. This customization is done using properties
    that are defined on the controls. WPF uses normal properties that you have seen
    before and adds a new type of property called a `dependency property`. These are
    examined in detail in Chapter 15, but for now it is enough to know that many of
    the properties of WPF do more than just get and set a value; for one, they are
    able to notify observers of changes.


    Besides defining how something looks on the screen, controls also define standard
    behavior, such as the ability to click on a button and select something in a list.
    You can change what happens when a user performs an action on a control by “handling”
    the events that the control defines. When and how you implement the event handler
    will vary from application to application and from control to control, but generally
    speaking you will always handle the `Click` event for a button; for a `ListBox`
    control, you often have to react when the user changes the selection and so the
    `SelectionChanged` event should be handled. On other controls, such as the `Label`
    or `TextBlock` controls, you will rarely implement any event.


    > **WARNING** Although users are often happy when you take the time to provide
    a more interesting user interface than the standard Windows display, you must
    be careful when changing the standard behavior of controls. Imagine that you change
    a `Button` control to work only when users right-click it. Your users will think
    that your application is broken when nothing happens when they left-click on the
    button. In fact, even if there are fantastic reasons for changing the button like
    this, it is likely that you should be using another type of control instead of
    changing the behavior of the `Button` control.


    You can add controls to a window in a number of ways, but the most common way
    is to drag and drop them from the Toolbox onto the Design View or the XAML View.'
