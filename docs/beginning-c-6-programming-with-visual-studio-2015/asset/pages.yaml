- pgno: 485
  md: '# WHAT YOU LEARNED IN THIS CHAPTER


    | KEY CONCEPT | DESCRIPTION |

    |---|---|

    | XAML | XAML is a language that uses XML syntax and enables controls to be added
    to a user interface in a declarative, hierarchical way. |

    | Data binding | You can use data binding to connect properties of controls to
    the value of other controls. You can also define resources and use code defined
    in classes outside your views as a data source for both values of properties and
    as content for controls. `DataContexts` can be used to specify the binding source
    of existing object instances and thereby allow you to bind to instances that are
    created in other parts of your application. |

    | Routed events | Routed events are special events used in WPF. They come in two
    flavors: bubbling and tunneling. Bubbling events are first called on the control
    on which they are activated and then bubble up through the view tree to the root
    element. Tunneling events move the other way, from the root element to the control
    that was activated by the user. Both bubbling and tunneling can be stopped by
    setting the `Handled` property of the event arguments to true. |

    | INotifyPropertyChanged | The `INotifyPropertyChanged` interface is implemented
    by a class that will be used from a WPF view. When property setters of the class
    are called, they raise the event `PropertyChanged` with the name of the property
    that changed its value. Any control property that is bound to the property that
    raised the event will be notified of the change and can update itself accordingly.
    |

    | ObservableCollections | An `ObservableCollection` is a collection that, among
    others, implement the `INotifyPropertyChanged` interface. You use this specialized
    collection when you want to provide properties or values that are lists to a WPF
    view for data binding. |

    | Content controls | Content controls can contain a single control in their content.
    An example of such a control is `Button`. This control can be `Grid` or `StackPanel`;
    they allow you to create complex customizations. |

    | Items controls | Items controls can contain a list of controls in their content.
    An example of such a control is the `ListBox`. Each control in the list can be
    customized. |'
  merge: -1
  img_proc: true
- pgno: 486
  md: '| KEY CONCEPT | DESCRIPTION |

    |---|---|

    | Layout controls | You learned to use a number of controls that are used to help
    you create the view:<br>1. `Canvas` allows for explicit positioning of controls
    but little else.<br>2. `StackPanel` stacks controls horizontally or vertically.<br>3.
    `WrapPanel` stacks controls and wraps them to the next line or column depending
    on the orientation of the panel.<br>4. `DockPanel` allows you to dock controls
    to the edges of the control or fill the entire content.<br>5. `Grid` allows you
    to define rows and columns and use these to position the controls. |

    | UI controls | UI controls display themselves on the view, often using the layout
    controls to guide their positions. These controls were used:<br>1. `Label` controls
    display short text.<br>2. `TextBlock` controls display text that can need multiple
    lines to display.<br>3. `TextBox` controls allow the users to provide text input.<br>4.
    `Button` controls allow the users to perform a single action.<br>5. `Image` controls
    are used to display an image.<br>6. `CheckBoxes` let the users answer yes/no questions
    such as “Play Against Computer?”<br>7. `RadioButtons` let the users select exactly
    one from multiple options.<br>8. `ComboBoxes` display a drop-down list of items
    from which the user can select a single item. The control can also display a `TextBox`,
    letting the user enter new options.<br>9. `ListBox` controls display a list of
    items. Unlike the `ComboBox`, the list is always expanded. The control allows
    for multiple items being selected.<br>10. `TabControls` allows you to group controls
    on pages. |'
