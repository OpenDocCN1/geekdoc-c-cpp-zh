  md: 'Obviously, this iterator isn''t a particularly useful one, but it does show
    how this works in action and how simple the implementation can be. Looking at
    the code, you might wonder how the code knows to return string type items. In
    fact, it doesn''t; it returns object type values. As you know, object is the base
    class for all types, so you can return anything from the yield statements.


    However, the compiler is intelligent enough that you can interpret the returned
    values as whatever type you want in the context of the foreach loop. Here, the
    code asks for string type values, so those are the values you get to work with.
    You should change one of the yield lines so that it returns, say, an integer,
    you would get a bad cast exception in the foreach loop.


    One more thing about iterators. It is possible to interrupt the return of information
    to the foreach loop by using the following statement:


    ```

    yield break;

    ```


    When this statement is encountered in an iterator, the iterator processing terminates
    immediately, as does the foreach loop using it.


