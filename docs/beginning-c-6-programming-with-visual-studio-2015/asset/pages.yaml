- pgno: 590
  md: '# The File and Directory Classes


    The File and Directory utility classes expose many static methods for manipulating,
    surprisingly enough, files and directories. These methods make it possible to
    move files, query and update attributes, and create FileStream objects. As you
    learned in Chapter 8, static methods can be called on classes without having to
    create instances of them.


    Some of the most useful static methods of the File class are shown in the Table
    18-2.


    TABLE 18-2: Static Methods of the File Class


    | METHOD | DESCRIPTION |

    |---|---|

    | Copy() | Copies a file from a source location to a target location. |

    | Create() | Creates a file in the specified path. |

    | Delete() | Deletes a file. |

    | Open() | Returns a FileStream object at the specified path. |

    | Move() | Moves a specified file to a new location. You can specify a different
    name for the file in the new location. |


    Some useful static methods of the Directory class are shown in Table 18-3.


    TABLE 18-3: Static Methods of the Directory Class


    | METHOD | DESCRIPTION |

    |---|---|

    | CreateDirectory() | Creates a directory with the specified path. |

    | Delete() | Deletes the specified directory and all the files within it. |

    | GetDirectories() | Returns an array of string objects that represent the names
    of the directories below the specified directory. |

    | EnumerateDirectories() | Like GetDirectories(), but returns an IEnumerable<string>
    collection of directory names. |

    | GetFiles() | Returns an array of string objects that represent the names of
    the files in the specified directory. |

    | EnumerateFiles() | Like GetFiles(), but returns an IEnumerable<string> collection
    of filenames. |

    | GetFileSystemEntries() | Returns an array of string objects that represent the
    names of the files and directories in the specified directory. |'
  merge: -1
  img_proc: true
- pgno: 591
  md: "TABLE 18-3 (continued)\n\n| METHOD | DESCRIPTION |\n|---|---|\n| EnumerateFileSystemEntries()\
    \ | Like GetFileSystemEntries(), but returns an IEnumerable<string> collection\
    \ of file and directory names. |\n| Move() | Moves the specified directory to\
    \ a new location. You can specify a new name for the folder in the new location.\
    \ |\n\nThe three EnumerateXxx() methods provide better performance than their\
    \ GetXxx() counterparts when a large amount of files or directories exist.\n\n\
    # The FileInfo Class\n\nUnlike the File class, the FileInfo class is not static\
    \ and does not have static methods. This class is useful only when instantiated.\
    \ A FileInfo object represents a file on a disk or a network location, and you\
    \ can create one by supplying a path to a file:\n\n```\nFileInfo aFile = new FileInfo(@\"\
    C:\\Log.txt\");\n```\n\n> NOTE You will be working with strings representing the\
    \ path of a file throughout this chapter, which means a lot of \\ characters in\
    \ your strings. Therefore, you should remember that you can precede a string value\
    \ with @, which means that the string will be interpreted literally. Thus, \\\
    \ will be interpreted as \\, and not as an escape character. Without the @ prefix,\
    \ you need to use \\\\ instead of \\ to avoid having this character be interpreted\
    \ as an escape character. In this chapter you'll stick to the @ prefix for your\
    \ strings.\n\nYou can also pass the name of a directory to the FileInfo constructor,\
    \ although in practical terms that isn't particularly useful. Doing this causes\
    \ the base class of FileInfo, which is FileSystemInfo, to be initialized with\
    \ all the directory information, but none of the FileInfo methods or properties\
    \ relating specifically to files will work.\n\nMany of the methods exposed by\
    \ the FileInfo class are similar to those of the File class, but because File\
    \ is a static class, it requires a string parameter that specifies the file location\
    \ for every method call. Therefore, the following calls do the same thing:\n\n\
    ```\nFileInfo aFile = new FileInfo(\"Data.txt\");\nif (aFile.Exists)\n    WriteLine(\"\
    File Exists\");\nif (File.Exists(\"Data.txt\"))\n    WriteLine(\"File Exists\"\
    );\n```\n\nIn this code, a check is made to see whether the file Data.txt exists.\
    \ Note that no directory information is specified here, which means that the current\
    \ working directory is the only location"
