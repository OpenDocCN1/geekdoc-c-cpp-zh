  md: 'The source code for the samples is available for download from the Wrox website
    at:


    `www.wrox.com/go/beginningvisualc#2015programming`


    # CONVENTIONS


    To help you get the most from the text and keep track of what''s happening, we''ve
    used a number of conventions throughout the book.


    # TRY IT OUT


    The Try It Out is an exercise you should work through, following the text in the
    book.


    +   1. They usually consist of a set of steps.

    +   2. Each step has a number.

    +   3. Follow the steps through with your copy of the database.


    # How It Works


    After each Try It Out, the code you''ve typed will be explained in detail.


    > > **WARNING** Warnings hold important, not-to-be-forgotten information that
    is directly relevant to the surrounding text.


    > > **NOTE** Notes indicates notes, tips, hints, tricks, or and asides to the
    current discussion.


    As for styles in the text:


    +   > We *highlight* new terms and important words when we introduce them.

    +   > We show keyboard strokes like this: Ctrl+A.

    +   > We show file names, URLs, and code within the text like so: `persistence.properties`.


    We present code in two different ways:


    We use a monofont type with no highlighting for most code examples.

    We use bold to emphasize code that is particularly important in the present context
    or to show changes from a previous code snippet.'
