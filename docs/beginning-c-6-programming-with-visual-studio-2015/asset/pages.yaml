- pgno: 237
  md: 'inherit from these types to variables of these types. In both cases, you can
    then use the members of these types through these variables, although you don''t
    have direct access to the other members of the derived object.


    Now the differences: Derived classes can only inherit from a single base class,
    which means that only a single abstract class can be inherited directly (although
    it is possible for a chain of inheritance to include multiple abstract classes).
    Conversely, classes can use as many interfaces as they want, but this doesn''t
    make a massive difference — similar results can be achieved either way. It''s
    just that the interface way of doing things is slightly different.


    Abstract classes can possess both abstract members (these have no code body and
    must be implemented in the derived class unless the derived class is itself abstract)
    and non-abstract members (these possess a code body, and can be virtual so that
    they can be overridden in the derived class). Interface members, conversely, must
    be implemented on the class that uses the interface — they do not possess code
    bodies. Moreover, interface members are by definition public (because they are
    intended for external use), but members of abstract classes can also be private
    (as long as they aren''t abstract), protected, internal, or protected internal
    (where protected internal members are accessible only from code within the application
    or from a derived class). In addition, interfaces can''t contain fields, constructors,
    destructors, static members, or constants.


    > **NOTE** Abstract classes are intended for use as the base class for families
    of objects that share certain central characteristics, such as a common purpose
    and structure. Interfaces are intended for use by classes that might differ on
    a far more fundamental level, but can still do some of the same things.


    For example, consider a family of objects representing trains. The base class,
    Train, contains the core definition of a train, such as wheel gauge and engine
    type (which could be steam, diesel, and so on). However, this class is abstract
    because there is no such thing as a "generic" train. To create an "actual" train,
    you add characteristics specific to that train. For example, you derive classes
    such as PassengerTrain, FreightTrain, and 424DoubleBogey, as shown in Figure 9-11.


    ![](img/cf72ea860016d2d680fc085fc06f265a_237_0.png)


    FIGURE 9-11


    A family of car objects might be defined in the same way, with an abstract base
    class of Car and derived classes such as Compact, SUV, and PickUp. Car and Train
    might even derive from a common base class, such as Vehicle. This is shown in
    Figure 9-12.'
