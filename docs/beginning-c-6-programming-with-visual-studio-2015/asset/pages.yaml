- pgno: 218
  md: "The keywords abstract and sealed are not allowed because neither modifier makes\
    \ sense in the context of interfaces (they contain no implementation, so they\
    \ can't be instantiated directly, and they must be inheritable to be useful).\n\
    \nInterface inheritance is also specified in a similar way to class inheritance.\
    \ The main difference here is that multiple base interfaces can be used, as shown\
    \ here:\n\n```\npublic interface IMyInterface : IMyBaseInterface, IMyBaseInterface2\n\
    {\n    // Interface members.\n}\n```\n\nInterfaces are not classes, and thus do\
    \ not inherit from System.Object. However, the members of System.Object are available\
    \ via an interface type variable, purely for convenience. In addition, as already\
    \ discussed, it is impossible to instantiate an interface in the same way as a\
    \ class. The following Try It Out provides an example of some class definitions,\
    \ along with some code that uses them.\n\n# TRY IT OUT Defining Classes: Ch09Ex01\\\
    Program.cs\n\n+   1. Create a new console application called Ch09Ex01 and save\
    \ it in the directory C:\\BegVCSharp\\Chapter09.\n\n2. Modify the code in Program.cs\
    \ as follows:\n\n```\nusing static System.Console;\nnamespace Ch09Ex01\n{\n  \
    \  public abstract class MyBase {}\n    internal class MyClass : MyBase {}\n \
    \   public interface IMyBaseInterface {}\n    internal interface IMyBaseInterface2\
    \ {}\n    internal interface IMyInterface : IMyBaseInterface, IMyBaseInterface2\
    \ {}\n    internal sealed class MyComplexClass : MyClass, IMyInterface {}\n  \
    \  class Program\n    {\n        static void Main(string[] args)\n        {\n\
    \            MyComplexClass myObj = new MyComplexClass();\n            WriteLine(myObj.ToString());\n\
    \            ReadKey();\n        }\n    }\n}\n```\n\n+   3. Execute the project.\
    \ Figure 9-1 shows the output.\n\n![](img/cf72ea860016d2d680fc085fc06f265a_218_0.png)\n\
    \nFIGURE 9-1"
