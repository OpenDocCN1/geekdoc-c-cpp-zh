  md: "the important variables to consider and that val2 will be assigned a new value\
    \ when the function is completed. Conversely, if this function took no parameters,\
    \ then you would be unable to make any assumptions about what data it manipulated.\n\
    \nFeel free to use either technique to exchange data. In general, use parameters\
    \ rather than global data; however, there are certainly cases where global data\
    \ might be more suitable, and it certainly isn't an error to use that technique.\n\
    \n# THE MAIN() FUNCTION\n\nNow that you've covered most of the simple techniques\
    \ used in the creation and use of functions, it's time to take a closer look at\
    \ the Main() function.\n\nEarlier, you saw that Main() is the entry point for\
    \ a C# application and that execution of this function encompasses the execution\
    \ of the application. That is, when execution is initiated, the Main() function\
    \ executes, and when the Main() function finishes, execution ends.\n\nThe Main()\
    \ function can return either void or int, and can optionally include a string[]\
    \ args parameter, so you can use any of the following versions:\n\n```\n```\n\
    static void Main()\nstatic void Main(string[] args)\nstatic int Main()\nstatic\
    \ int Main(string[] args)\n```\n```\n\nThe third and fourth versions return an\
    \ int value, which can be used to signify how the application terminates, and\
    \ often is used as an indication of an error (although this is by no means mandatory).\
    \ In general, returning a value of 0 reflects normal termination (that is, the\
    \ application has completed and can terminate safely).\n\nThe optional args parameter\
    \ of Main() provides you with a way to obtain information from outside the application,\
    \ specified at runtime. This information takes the form of command-line parameters.\n\
    \nWhen a console application is executed, any specified command-line parameters\
    \ are placed in this args array. You can then use these parameters in your application.\
    \ The following Try It Out shows this in action. You can specify any number of\
    \ command-line arguments, each of which will be output to the console.\n\n# TRY\
