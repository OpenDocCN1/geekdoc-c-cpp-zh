  md: 'directly with the HTTP request and response and manually creating HTML code
    to send to the client, you can use controls such as `TextBox`, `Label`, `ComboBox`,
    and `Calendar`, which create HTML code.


    Entire books exist on web applications and ASP.NET. Covering those topics in detail
    is beyond the scope of this book. However, this section will take a quick look
    at using ASP.NET runtime and creating an ASP.NET web site that uses the storage
    container.


    Using ASP.NET for web applications on the client system requires only a simple
    web browser. You can use Internet Explorer, Chrome, Firefox, or any other web
    browser that supports HTML. The client system doesn''t require .NET to be installed.


    On the server system, the ASP.NET runtime is needed. If you have Internet Information
    Services (IIS) on the system, the ASP.NET runtime is configured with the server
    when the .NET Framework is installed. During development, there''s no need to
    work with Internet Information Services because Visual Studio delivers its own
    ASP.NET Web Development server that you can use for testing and debugging the
    application.


    To understand how the ASP.NET runtime goes into action, consider a typical web
    request from a browser (see Figure 16-11). The client requests a file, such as
    `default.cshtml`, from the server. ASP.NET web form pages usually have the file
    extension `.aspx`, (although ASP.NET MVC has no specific file extension), and
    `.cshtml` is used for Razor-based Web Sites. Because these file extensions are
    registered with IIS or known by the ASP.NET Web Development Server, the ASP.NET
    runtime and the ASP.NET worker process enter the picture. The IIS worker process
    is named `w3wp.exe` and is host to your application on the web server. With the
    first request to the `default.cshtml` file, the ASP.NET parser starts, and the
    compiler compiles the file together with the C# code, which is associated with
    the `.cshtml` file and creates an assembly. Then the assembly is compiled to native
    code by the JIT compiler of the .NET runtime. Then the Page object is destroyed.
    The assembly is kept for subsequent requests, though, so it is not necessary to
    compile the assembly again.


    ![](img/cf72ea860016d2d680fc085fc06f265a_558_0.png)


    FIGURE 16-11'
