    \ very few limits to what you can do to change the appearance of the built-in\
    \ controls. Chapter 15 explores this in more detail.\n\n# Namespaces\n\nThe Window\
    \ element of the previous example is the root element of the XAML file. This element\
    \ usually includes a number of namespace declarations. By default, the Visual\
    \ Studio designer includes two namespaces that you should be aware of: http://schemas.microsoft.com/winfx/2006/xaml/presentation\
    \ and http://schemas.microsoft.com/winfx/2006/xaml. The first one is the default\
    \ namespace of WPF and declares a lot of controls that you are going to use to\
    \ create user interfaces. The second one declares the XAML language itself. Namespaces\
    \ don't have to be declared on the root tag, but doing so ensures that their content\
    \ can be easily accessed throughout the XAML file, so there is rarely any need\
    \ to move the declarations.\n\n> NOTE The namespaces looks like they might be\
    \ URLs, but this is deceiving. In fact they are what is known as Uniform Resource\
    \ Identifiers (URIs). A URI can be any string as long as it uniquely identifies\
    \ a resource. Microsoft has chosen to specify the URLs in a form that is normally\
    \ used for URLs, but in this case you will not get a result if you type them into\
    \ your browser.\n\nWhen you create a new window in Visual Studio, the presentation\
    \ namespace is always declared as the default and the language namespace as xmlns:x.\
    \ As seen with the Window, Button, and Grid tags, this ensures that you don't\
    \ have to prefix the controls you add to the window, but the language elements\
    \ you specify must be prefixed with an x.\n\nThe last namespace that you will\
    \ see quite often is the system namespace: xmlns:sys=\"clr-namespace:System;assembly=mscorlib\"\
    . This namespace allows you to use the built-in types of the .NET Framework in\
    \ your XAML. By doing this, the markup you write can explicitly declare the types\
    \ of elements you are creating. For example, it is possible to declare an array\
    \ in markup and state that the members of the array are strings:\n\n```\n<Window.Resources>\n\
    <ResourceDictionary>\n```"
