- pgno: 70
  md: '| OPERATOR | CATEGORY | EXAMPLE EXPRESSION | RESULT |

    |---|---|---|---|

    | / | Binary | `var1 = var2 / var3;` | var1 is assigned the value that is the
    result of dividing var2 by var3. |

    | % | Binary | `var1 = var2 % var3;` | var1 is assigned the value that is the
    remainder when var2 is divided by var3. |

    | + | Unary | `var1 = +var2;` | var1 is assigned the value of var2. |

    | - | Unary | `var1 = -var2;` | var1 is assigned the value of var2 multiplied
    by -1. |


    > **NOTE** The + (unary) operator is slightly odd, as it has no effect on the
    result. It doesn''t force values to be positive, as you might assume — if var2
    is -1, then +var2 is also -1. However, it is a universally recognized operator,
    and as such the most useful fact about this operator is shown later in this book
    when you look at operator overloading.


    The examples use simple numeric types because the result can be unclear when using
    the other simple types. What would you expect if you added two Boolean values,
    for example? In this case, nothing, because the compiler complains if you try
    to use + (or any of the other mathematical operators) with bool variables. Adding
    char variables is also slightly confusing. Remember that char variables are actually
    stored as numbers, so adding two char variables also results in a number (of type
    int, to be precise). This is an example of implicit conversion, which you''ll
    learn a lot more about shortly (along with explicit conversion), because it also
    applies to cases where var1, var2, and var3 are of mixed types.


    The binary + operator does make sense when used with string type variables. In
    this case, the table entry should read as shown in Table 3-7.


    # TABLE 3-7 The String Concatenation Operator


    | Operator | Category | Example Expression | Result |

    |---|---|---|---|

    | + | Binary | `var1 = var2 + var3;` | var1 is assigned the value that is the
    concatenation of the two strings stored in var2 and var3. |


    None of the other mathematical operators, however, work with strings.'
  merge: -1
