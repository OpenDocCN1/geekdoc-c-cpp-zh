  md: 'used, by restricting the types used to instantiate a generic class to those
    that support a given interface or are derived from a certain type. Moreover, you''re
    not restricted to generic classes — you can create generic interfaces, generic
    methods (which can be defined on nongeneric classes), and even generic delegates.
    All this adds a great deal of flexibility to your code, and judicious use of generics
    can eliminate hours of development time.


    > NOTE If you are familiar with C++, this is one difference between C++ templates
    and C# generic classes. In C++ the compiler detects where you used a specific
    type of template — for example, A of B — and compiles the code necessary to create
    this type. In C# everything happens at runtime.


    You''re probably wondering how all this is possible. Usually, when you create
    a class, it is compiled into a type that you can then use in your code. You might
    think that when you create a generic class, it would have to be compiled into
    a plethora of types, so that you could instantiate it. Fortunately, that''s not
    the case — and given the infinite amount of classes possible in .NET, that''s
    just as well. Behind the scenes, the .NET runtime allows generic classes to be
    dynamically generated as and when you need them. A given generic class A of B
    won''t exist until you ask for it by instantiating it.


    # USING GENERICS


    Before you look at how to create your own generic types, it''s worth looking at
    the ones supplied by the .NET Framework. These include the types in the System.Collections.Generic
    namespace, a namespace that you''ve seen several times in your code because it
    is included by default in console applications. You haven''t yet used any of the
    types in this namespace, but that''s about to change. This section looks at the
    types in this namespace and how you can use them to create strongly typed collections
    and improve the functionality of your existing collections.


    First, though, you''ll look at another simpler generic type that gets around a
    minor issue with value types: nullable types.


    # Nullable Types


    In earlier chapters, you saw that one of the ways in which value types (which
    include most of the basic types such as int and double as well as all structs)
    differ from reference types (string and any class) is that they must contain a
    value. They can exist in an unassigned state, just after they are declared and
    before a value is assigned, but you can''t make use of the value type in that
    state in any way. Conversely, reference types can be null.


    There are times, and they crop up more often than you might think (particularly
    when you work with databases), when it is useful to have a value type that can
    be null. Generics give you a way to do this using the System.Nullable<T> type,
    as shown in this example:


    ```

    System.Nullable<int> nullableInt;

    ```'
