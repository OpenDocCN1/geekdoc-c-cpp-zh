- pgno: 163
  md: 'Then, you''ll learn the error-handling techniques available in C#. These enable
    you to take precautions in cases where errors are likely, and to write code that
    is resilient enough to cope with errors that might otherwise be fatal. The techniques
    are part of the C# language, rather than a debugging feature, but the IDE provides
    some tools to help you here too.


    # DEBUGGING IN VISUAL STUDIO


    Earlier, you learned that you can execute applications in two ways: with debugging
    enabled or without debugging enabled. By default, when you execute an application
    from Visual Studio (VS), it executes with debugging enabled. This happens, for
    example, when you press F5 or click the green Start arrow in the toolbar. To execute
    an application without debugging enabled, choose Debug ▸ Start Without Debugging,
    or press Ctrl+F5.


    Visual Studio allows you to build applications in numerous configurations, including
    Debug (the default) and Release. You can switch between these configurations using
    the Solution Configurations drop-down menu in the Standard toolbar.


    When you build an application in debug configuration and execute it in debug mode,
    more is going on than the execution of your code. Debug builds maintain symbolic
    information about your application, so that the IDE knows exactly what is happening
    as each line of code is executed. Symbolic information means keeping track of,
    for example, the names of variables used in uncompiled code, so they can be matched
    to the values in the compiled machine code application, which won''t contain such
    human-readable information. This information is contained in .pdb files, which
    you may have seen in your computer''s Debug directories.


    In the release configuration, application code is optimized, and you cannot perform
    these operations. However, release builds also run faster; when you have finished
    developing an application, you will typically supply users with release builds
    because they won''t require the symbolic information that debug builds include.


    This section describes debugging techniques you can use to identify and fix areas
    of code that don''t work as expected, a process known as debugging. The techniques
    are grouped into two sections according to how they are used. In general, debugging
    is performed either by interrupting program execution or by making notes for later
    analysis. In Visual Studio terms, an application is either running or in break
    mode — that is, normal execution is halted. You''ll look at the nonbreak mode
    (running or normal) techniques first.


    # Debugging in Nonbreak (Normal) Mode


    One of the commands you''ve been using throughout this book is the WriteLine()
    function, which outputs text to the console. As you are developing applications,
    this function comes in handy for getting extra feedback about operations:


    ```

    WriteLine("MyFunc() Function about to be called.");

    MyFunc();"Do something.";

    WriteLine("MyFunc() Function execution completed.");

    ```'
