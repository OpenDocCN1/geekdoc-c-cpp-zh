    string stringResult, stringVal = "17";

    bool boolVal = true;

    WriteLine("Variable Conversion Examples\n");

    doubleResult = floatVal * shortVal;

    WriteLine($"Implicit, -> double: {floatVal} * {shortVal} -> { doubleResult }");

    shortResult = (short)floatVal;

    WriteLine($"Explicit, -> short: {floatVal} -> {shortResult}");

    stringResult = Convert.ToString(boolVal) + Convert.ToString(doubleVal);

    WriteLine($"Explicit, -> string: \"{boolVal}\"" + " + \"{doubleVal}\" -> " + $"{stringResult}");

    longResult = integerVal + ToInt64(stringVal);

    WriteLine($"Mixed, -> long: {integerVal} + {stringVal} -> {longResult}");

    ReadKey();

    }

    ```


    3. Execute the code. The result is shown in Figure 5-4.


    ![](img/cf72ea860016d2d680fc085fc06f265a_111_0.png)


    FIGURE 5-4


    # How It Works


    This example contains all of the conversion types you''ve seen so far — both in
    simple assignments, as in the short code examples in the preceding discussion,
    and in expressions. You need to consider both cases because the processing of
    every non-unary operator may result in type conversions, not just assignment operators.
    For example, the following multiplies a short value by a float value:


    ```

    shortVal * floatVal

    ```


    In situations such as this, where no explicit conversion is specified, implicit
    conversion will be used if possible. In this example, the only implicit conversion
    that makes sense is to convert the short into a float (as converting a float into
    a short requires explicit conversion), so this is the one that will be used.


    However, you can override this behavior should you want, as shown here:


    ```

    shortVal * (short)floatVal

    ```'
