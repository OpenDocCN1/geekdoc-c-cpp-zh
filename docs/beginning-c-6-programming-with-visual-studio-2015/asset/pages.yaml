  md: "Double-click on the deck or available card to draw and then click a card from\
    \ your hand to discard it.\n\n# How It Works\n\nEven though there is quite a bit\
    \ of code in this example, most of it is the dependency properties, and the XAML\
    \ is all about data binding these properties. The CardsInHandControl creates three\
    \ properties that it uses to display itself and react to changes: Game, Owner,\
    \ and PlayerState. Game and Owner are mostly used to draw, but the PlayerState\
    \ is also used to control the ComputerPlayer actions.\n\n```\nprivate static void\
    \ OnPlayerStateChanged(DependencyObject source,\n    DependencyPropertyChangedEventArgs\
    \ e)\n{\n    var control = source as CardsInHandControl;\n    var computerPlayer\
    \ = control.Owner as ComputerPlayer;\n    if (computerPlayer != null)\n    {\n\
    \        if (computerPlayer.State == PlayerState.MustDiscard)\n        {\n   \
    \         Thread delayedWorker = new Thread(control.DelayDiscard);\n         \
    \   delayedWorker.Start(new Payload\n            {\n                Deck = control.Game.GameDeck,\n\
    \                AvailableCard = control.Game.CurrentAvailableCard,\n        \
    \        Player = computerPlayer\n            });\n        }\n        else if\
    \ (computerPlayer.State == PlayerState.Active)\n        {\n            Thread\
    \ delayedWorker = new Thread(control.DelayDraw);\n            delayedWorker.Start(new\
    \ Payload\n            {\n                Deck = control.Game.GameDeck,\n    \
    \            AvailableCard = control.Game.CurrentAvailableCard,\n            \
    \    Player = computerPlayer\n            });\n        }\n    }\n    control.RedrawCards();\n\
    }\n```\n\nThe OnPlayerStateChanged method, which is used to react to changes in\
    \ the state of the player, determines if the current player is a ComputerPlayer.\
    \ If it is, it checks to make sure that the computer player draws or discards\
    \ a card. If this is the case, it creates a worker thread for this to happen and\
    \ executes the methods on this thread. This allows the application to continue\
    \ working while the computer is waiting:\n\n```\nprivate void DelayDraw(object\
    \ payload)\n{\n    Thread.Sleep(1250);\n    var data = payload as Payload;\n \
    \   Dispatcher.Invoke(DispatcherPriority.Normal,\n        new Action<Deck, Card>(data.Player.PerformDraw),\
    \ data.Deck, data.AvailableCard);\n}\n```"
