- pgno: 223
  md: "You can supply an unlimited number of constructors (until you run out of memory\
    \ or out of distinct sets of parameters, so maybe “almost unlimited” is more appropriate).\n\
    \nDestructors are declared using a slightly different syntax. The destructor used\
    \ in .NET (and supplied by the System.Object class) is called Finalize(), but\
    \ this isn’t the name you use to declare a destructor. Instead of overriding Finalize(),\
    \ you use the following;\n\n```\nclass MyClass\n{\n    ~MyClass()\n    {\n   \
    \     // Destructor body.\n    }\n}\n```\n\nThus, the destructor of a class is\
    \ declared by the class name (just as the constructor is), with the tilde (~)\
    \ prefix. The code in the destructor is executed when garbage collection occurs,\
    \ enabling you to free resources. After the destructor is called, implicit calls\
    \ to the destructors of base classes also occur, including a call to Finalize()\
    \ in the System.Object root class. This technique enables the .NET Framework to\
    \ ensure that this occurs, because overriding Finalize() would mean that base\
    \ class calls would need to be explicitly performed, which is potentially dangerous\
    \ (you learn how to call base class methods in the next chapter).\n\n# Constructor\
    \ Execution Sequence\n\nIf you perform multiple tasks in the constructors of a\
    \ class, it can be handy to have this code in one place, which has the same benefits\
    \ as splitting code into functions, as shown in Chapter 6. You could do this using\
    \ a method (see Chapter 10), but C# provides a nice alternative. You can configure\
    \ any constructor to call any other constructor before it executes its own code.\n\
    \nFirst, though, you need to take a closer look at what happens by default when\
    \ you instantiate a class instance. Apart from facilitating the centralization\
    \ of initialization code, as noted previously, this is worth knowing about in\
    \ its own right. During development, objects often don’t behave quite as you expect\
    \ them to due to errors during constructor calling — usually a base class somewhere\
    \ in the inheritance hierarchy of your class that you are not instantiating correctly,\
    \ or information that is not being properly supplied to base class constructors.\
    \ Understanding what happens during this phase of an object’s lifecycle can make\
    \ it much easier to solve this sort of problem.\n\nFor a derived class to be instantiated,\
    \ its base class must be instantiated. For this base class to be instantiated,\
    \ its own base class must be instantiated, and so on all the way back to System.Object\
    \ (the root of all classes). As a result, whatever constructor you use to instantiate\
    \ a class, System.Object.Object() is always called first.\n\nRegardless of which\
    \ constructor you use in a derived class (the default constructor or a nondefault\
    \ constructor), unless you specify otherwise, the default constructor for the\
    \ base class is used. (You’ll"
  merge: -1
  img_proc: true
- pgno: 224
  md: "see how to change this behavior shortly.) Here's a short example illustrating\
    \ the sequence of execution. Consider the following object hierarchy:\n\n```\n\
    ```\npublic class MyBaseClass\n{\n    public MyBaseClass()\n    {\n    }\n   \
    \ public MyBaseClass(int i)\n    {\n    }\n}\npublic class MyDerivedClass : MyBaseClass\n\
    {\n    public MyDerivedClass()\n    {\n    }\n    public MyDerivedClass(int i)\n\
    \    {\n    }\n    public MyDerivedClass(int i, int j)\n    {\n    }\n}\n```\n\
    ```\n\nYou could instantiate MyDerivedClass as follows:\n\n```\n```\nMyDerivedClass\
    \ myObj = new MyDerivedClass();\n```\n```\n\nIn this case, the following sequence\
    \ of events will occur:\n\n+   - The System.Object.Object() constructor will execute.\n\
    +   - The MyBaseClass.MyBaseClass() constructor will execute.\n+   - The MyDerivedClass.MyDerivedClass()\
    \ constructor will execute.\n\nAlternatively, you could use the following:\n\n\
    ```\n```\nMyDerivedClass myObj = new MyDerivedClass(4);\n```\n```\n\nThe sequence\
    \ is as follows:\n\n+   - The System.Object.Object() constructor will execute.\n\
    +   - The MyBaseClass.MyBaseClass() constructor will execute.\n+   - The MyDerivedClass.MyDerivedClass(int\
    \ i) constructor will execute.\n\nFinally, you could use this:\n\n```\n```\nMyDerivedClass\
    \ myObj = new MyDerivedClass(4, 8);\n```\n```"
