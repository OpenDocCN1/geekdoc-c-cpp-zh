- pgno: 500
  md: "```\npublic class InverseBoolConverter : IValueConverter\n{\n    public object\
    \ Convert(object value, Type targetType, object parameter,\n        System.Globalization.CultureInfo\
    \ culture)\n    {\n        return !(bool)value;\n    }\n    public object ConvertBack(object\
    \ value, Type targetType, object parameter,\n        System.Globalization.CultureInfo\
    \ culture)\n    {\n        return !(bool)value;\n    }\n}\n```\n\n3. Go to the\
    \ Options.xaml file and create a new static resource for the window:\n\n```\n\
    <Window.Resources>\n    <local:InverseBoolConverter x:Key=\"inverseBool\" />\n\
    </Window.Resources>\n```\n\n4. Set the IsEnabled property of the combo box to\
    \ this binding:\n\n```\nIsEnabled=\"{Binding ElementName=playAgainstComputerCheck,\n\
    Path=IsChecked, Converter={StaticResource inverseBool}}\"\n```\n\n# How It Works\n\
    \nThe conversion is obviously very simple in this case — it simply returns false\
    \ if the value is true and vice-versa. You are going to see more complicated converters\
    \ later in the chapter.\n\nIn the XAML, you create a resource for the converter\
    \ to be able to reference it from the binding that needs it. In the binding, you\
    \ set the Converter property to use the converter.\n\n# Triggers\n\nEvents in\
    \ WPF can include all manner of things, including button clicks, application startup\
    \ and shutdown events, and so on. There are, in fact, several types of triggers\
    \ in WPF, all of which inherit from a base TriggerBase class. One such trigger\
    \ is the EventTrigger class, which contains a collection of actions, each of which\
    \ is an object that derives from the base TriggerAction class. These actions are\
    \ executed when the trigger is activated.\n\nNot a lot of classes inherit from\
    \ TriggerAction in WPF, but you can, of course, define your own. You can use EventTrigger\
    \ to trigger animations using the BeginStoryboard action, manipulate storyboards\
    \ using ControllableStoryboardAction, and trigger sound effects with SoundPlayerAction.\
    \ As this latter trigger is mostly used in animations, you'll look at it in the\
    \ next section.\n\nEvery control has a Triggers property that you can use to define\
    \ triggers directly on that control. You can also define triggers further up the\
    \ hierarchy — for example, on a Window object as shown earlier. The type of trigger\
    \ you will use most often when you are styling controls is Trigger (although you\
    \ will still use EventTrigger to trigger control animations). The Trigger class\
    \ is used"
  merge: -1
  img_proc: true
- pgno: 501
  md: "to set properties in response to changes to other properties, and is particularly\
    \ useful when used in Style objects.\n\nTrigger objects are configured as follows:\n\
    \n+   - To define what property a Trigger object monitors, you use the Trigger.Property\
    \ property.\n+   - To define when the Trigger object activates, you set the Trigger.Value\
    \ property.\n+   - To define the actions taken by a Trigger, you set the Trigger.Setters\
    \ property to a collection of Setter objects.\n\nThe Setter objects referred to\
    \ here are exactly the same objects that you saw in the “Styles” section earlier.\n\
    \nFor example, the following trigger examines the value of a property called MyBooleanValue,\
    \ and when that property is true it sets the value of the Opacity property to\
    \ 0.5:\n\n```\n<Trigger Property=\"MyBooleanValue\" Value=\"true\">\n    <Setter\
    \ Property=\"Opacity\" Value=\"0.5\" />\n</Trigger>\n```\n\nOn its own, this code\
    \ doesn’t tell you very much, as it is not associated with any control or style.\
    \ The following code is much more explanatory; it shows a Trigger as you would\
    \ use it in a Style object:\n\n```\n<Style TargetType=\"Button\">\n    <Style.Triggers>\n\
    \        <Trigger Property=\"IsMouseOver\" Value=\"true\">\n            <Setter\
    \ Property=\"Foreground\" Value=\"Yellow\" />\n        </Trigger>\n    </Style.Triggers>\n\
    </Style>\n```\n\nThis code changes the Foreground property of a Button control\
    \ to Yellow when the Button .IsMouseOver property is true. IsMouseOver is one\
    \ of several extremely useful properties that you can use as a shortcut to find\
    \ out information about controls and control state. As its name suggests, it is\
    \ true if the mouse is over the control. This enables you to code for mouse rollovers.\
    \ Other properties like this include IsFocused, to determine whether a control\
    \ has focus; IsHitTestVisible, which indicates whether it is possible to click\
    \ on a control (that is, it is not obscured by controls further up the stacking\
    \ order); and IsPressed, which indicates whether a button is pressed. The last\
    \ of these only applies to buttons that inherit from ButtonBase, whereas the others\
    \ are available on all controls.\n\nYou can also achieve a great deal by using\
    \ the ControlTemplate.Triggers property, which enables you to create templates\
    \ for controls that include triggers. This is how the default Button template\
    \ is able to respond to mouse rollovers, clicks, and focus changes with its template.\
    \ This is also what you must modify to implement this functionality for yourself."
