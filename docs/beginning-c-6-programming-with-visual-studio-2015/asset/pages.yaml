  md: '# WHAT YOU LEARNED IN THIS CHAPTER


    | TOPIC | KEY CONCEPTS |

    |---|---|

    | Using Databases | A database is a persistent, structured storehouse for data.
    While there are many different kinds of databases, the most common type used for
    business data are relational databases. |

    | Entity Framework | The Entity Framework is a set of .NET classes for object-relational
    mapping between C# objects and relational databases. |

    | How to Create Data with Code First | By using the Code First classes in the
    Entity Framework you can create databases directly from C# classes and collections
    using object-relational mapping. |

    | How to use LINQ with Databases | LINQ to Entities enables powerful queries on
    databases using the same Entity Framework classes to create the data. |

    | How to Navigate Database Relationships | The Entity Framework enables creation
    and navigation of related entities in your database through the use of virtual
    properties and collections in your C# code. |

    | How to create and query XML from Databases | You can construct XML from databases
    by combining LINQ to Entities, LINQ to Objects, and LINQ to XML in a single query.
    |'
