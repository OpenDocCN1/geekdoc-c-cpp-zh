  md: '# How It Works


    When you run the app, you can now use the command bar buttons to move back and
    forth in the list of pages that you have visited. The command bar itself is very
    easy to work with.


    The command bar is built using three types. The first one is the AppBarToggleButton.


    ```

    <AppBarToggleButton x:Name="toggleButtonBold" Icon="Bold" Label="Bold" Click="AppBarToggleButtonBold_Click"
    />

    ```


    This type of button can be used to display a state that can be toggled on or off.


    The second type is the AppBarButton, which works like any other button, and in
    fact you can see that the click event of the AppBarButtonBack button is handled
    by the same event handler as the ButtonBack from the previous example.


    ```

    <AppBarButton Icon="Back" Label="Back" Click="buttonGoBack_Click"/>

    ```


    The third type that is used in the command bar is the AppBarSeperator. This control
    simply displays a separator on the bar.


    Finally, two buttons are located inside a CommandBar.SecondaryCommands tag:


    ```

    <CommandBar.SecondaryCommands>

    <AppBarButton Icon="Camera" Label="Take picture" />

    <AppBarButton Icon="Help" Label="Help" />

    </CommandBar.SecondaryCommands>

    </CommandBar>

    ```


    These commands are not displayed directly on the command bar. Instead they are
    displayed as a drop-down when you click the three dots that are displayed.


    # Managing State


    Unlike a desktop application, an app must expect to be suspended at any time.
    This happens when the user switches to another app or to the desktop, so it''s
    a very common scenario that must be handled by all apps. When an app is suspended,
    Windows will save the values of your variables and data structures and restore
    them when the app resumes. However, your app may have been suspended for an extended
    period of time, so if you have data that changes over time, such as a news feed,
    then you should refresh this when the app is restored.


    When the app is suspended, you should also consider saving any data that should
    persist between invocations of the app, as you will not get a chance to do so
    if the app is subsequently terminated by Windows or the user.


    When your app is about to be suspended, a Suspending event is sent, which you
    should handle. When the app is returned to life, it will receive a Resuming event.
    By handling these two events and saving the state of the application, you can
    return the app to the state it was in before the suspension, and the user shouldn''t
    notice anything.'
