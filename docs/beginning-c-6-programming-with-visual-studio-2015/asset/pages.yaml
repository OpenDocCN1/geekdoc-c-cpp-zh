    \n```\nx = Manipulate(y, z);\n```\n\nIf no implementation is provided for a partial\
    \ method, then it will be removed by the compiler along with all places where\
    \ it is used. In the preceding code this would leave the result of x unclear because\
    \ no replacement for the Manipulate() method is available. It might be the case\
    \ that without this method you would simply want to ignore the entire line of\
