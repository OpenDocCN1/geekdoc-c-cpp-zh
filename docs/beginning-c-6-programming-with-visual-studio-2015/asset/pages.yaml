- pgno: 93
  md: '# How It Works


    The code sets up three constant strings, accepts a string from the user, and then
    writes out text to the console based on the string entered. Here, the strings
    are names.


    When you compare the name entered (in the variable name) to your constant values,
    you first force it into lowercase with name.ToLower(). This is a standard command
    that works with all string variables, and it comes in handy when you''re not sure
    what the user entered. Using this technique, the strings Benjamin, benJamin, benjamin,
    and so on all match the test string benjamin.


    The switch statement itself attempts to match the string entered with the constant
    values you have defined, and, if successful, writes out a personalized message
    to greet the user. If no match is made, you offer a generic greeting.


    # LOOPING


    Looping refers to the repeated execution of statements. This technique comes in
    very handy because it means that you can repeat operations as many times as you
    want (thousands, even millions, of times) without having to write the same code
    each time.


    As a simple example, consider the following code for calculating the amount of
    money in a bank account after 10 years, assuming that interest is paid each year
    and no other money flows into or out of the account:


    ```

    double balance = 1000;

    double interestRate = 1.05; // 5% interest/year

    balance *= interestRate;

    balance *= interestRate;

    balance *= interestRate;

    balance *= interestRate;

    balance *= interestRate;

    balance *= interestRate;

    balance *= interestRate;

    balance *= interestRate;

    balance *= interestRate;

    balance *= interestRate;

    ```


    Writing the same code 10 times seems a bit wasteful, and what if you wanted to
    change the duration from 10 years to some other value? You''d have to manually
    copy the line of code the required amount of times, which would be a bit of a
    pain! Luckily, you don''t have to do this. Instead, you can have a loop that executes
    the instruction you want the required number of times.


    Another important type of loop is one in which you loop until a certain condition
    is fulfilled. These loops are slightly simpler than the situation detailed previously
    (although no less useful), so they''re a good starting point.


    # do Loops


    do loops operate as follows. The code you have marked out for looping is executed,
    a Boolean test is performed, and the code executes again if this test evaluates
    to true, and so on. When the test evaluates to false, the loop exits.'
  merge: -1
