- pgno: 467
  md: '# TABLE 14-3: TextBox Properties


    | PROPERTY | DESCRIPTION |

    |---|---|

    | Text | The text currently displayed in the TextBox control. |

    | IsEnabled | When this is set to true, the user can edit the text in the TextBox.
    When it is false, the text is grayed out and the user cannot give focus to the
    control. |

    | TextWrapping | Sometimes you want the TextBox to display only a single line
    of text. In this case, you can set this property to NoWrap. This is the default.
    If you want your text to be displayed on multiple lines, you can set it to either
    Wrap or WrapWithOverflow. Wrap will cause the text that extends beyond the edge
    of the box to be moved to the line below. WrapWithOverflow will in some cases
    allow very long words to extend beyond the edge if no suitable breakpoint can
    be determined. |

    | VerticalScrollBarVisibility | If your TextBox allows the user to enter multiple
    lines of text, then the user can potentially type text that will disappear below
    the lower edge of the box. In that case, it''s a good idea to display a scrollbar.
    Set this to Auto if you want the scrollbar to appear only if the text is too long
    to be displayed. Set it to Visible to always display it, and Hidden or Disabled
    to never display a scrollbar. |

    | AcceptsReturn | This property controls how text can be entered into the control.
    If you set this to false, which is the default, then the user can''t break the
    line with a Return. |


    # The CheckBox Control


    CheckBoxes present the users with options that they can select or clear. You should
    use a CheckBox if you have want to present an option to the users that can be
    turned on or off, or want the users to answer yes or no to a question. For example,
    in the Options dialog box, you want the user to answer to decide whether they
    should play against the computer. To this end a CheckBox with the text “Play Against
    Computer” is used.


    A CheckBox is designed to be used as a single entity that is unaffected by other
    CheckBoxes on the view. You will sometimes see CheckBoxes used in a way that links
    them together so that selecting one causes another to become cleared, but this
    is not the intended use for this control. If you want this functionality, you
    should use a RadioButton, described in the next section.


    CheckBoxes can also display a third state, which is known as “indeterminate” and
    is supposed to indicate that the yes/no answer could not be answered. This state
    is commonly used when a CheckBox is used to show information about something else.
    For example, CheckBoxes are sometimes used to indicate whether all child nodes
    in a Tree View are selected. In this case, the CheckBox'
