  md: '| TOPIC | KEY CONCEPTS |

    |---|---|

    | Initializers | You can use initializers to initialize an object or collection
    at the same time as creating it. Both types of initializers consist of a block
    of code surrounded by curly brackets. Object initializers allow you to set property
    values by providing a comma-separated list of property name/value pairs. Collection
    initializers simply require a comma-separated list of values. When you use an
    object initializer, you can also use a nondefault constructor. |

    | Type inference | The var keyword allows you to omit the type of a variable when
    you declare it. However, this is possible only if the type can be determined at
    compile time. Using var does not break the strong typing methodology of C# as
    a variable declared with var has one and only one possible type. |

    | Anonymous types | For many simple types used to structure data storage, defining
    a type is not necessary. Instead, you can use an anonymous type, whose members
    are inferred from usage. You define an anonymous type with object initializer
    syntax, tax, and every property you set is defined as a read-only property. |

    | Dynamic lookup | Use the dynamic keyword to define a dynamic type variable that
    can hold any value. You can then access members of the contained value with normal
    property or method syntax, and these are only checked at runtime. If, at runtime,
    you attempt to access a nonexistent member, an exception is thrown. This dynamic
    typing greatly simplifies the syntax required to access non-.NET types, or .NET
    types whose type information is not available at compile time. However, dynamic
    types must be used with caution as you lose compile time code checking. You can
    control the behavior of dynamic lookup by implementing the IDynamicMetaObjectProvider
    interface. |

    | Optional method parameters | Often, you can define a method with lots of parameters,
    many of which are only rarely used. Instead of forcing client code to specify
    values for rarely used parameters, you might provide multiple method overloads.
    Alternatively, you can define these parameters as optional (and provide default
    values for parameters that are not specified). Client code that calls your method
    can then specify only as many parameters as are required. |

    | Named method parameters | Client code can specify method parameter values by
    position or by name (or a mix of the two where positional parameters are specified
    first). Named parameters can be specified in any order. This is particularly useful
    when combined with optional parameters. |

    | Lambda expressions | Lambda expressions are essentially a shorthand way of defining
    anonymous methods, although they have additional capabilities such as implicit
    typing. You define a lambda expression with a comma-separated list of parameters
    (or empty parentheses for no parameters), the => operator, and an expression.
    The expression can be a block of code enclosed in curly brackets. Lambda expressions
    with up to eight parameters and an optional return type can be represented with
    the Action, Action<>, and Func<> delegate types. Many LINQ extension methods that
    can be used with collections use lambda expression parameters. |'
