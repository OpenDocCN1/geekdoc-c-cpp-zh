    # CREATING AND QUERYING XML FROM AN EXISTING DATABASE


    For the last example you will combine all you have learned about LINQ, databases,
    and XML.


    XML is often used to communicate data between client and server machines or between
    “tiers” in a multitier application. It is quite common to query for some data
    in a database and then produce an XML document or fragment from that data to pass
    to another tier.


    In the following Try It Out, you create a query to find some data in the previous
    example database, use LINQ to Entities to query the data, and then use LINQ to
    XML classes to convert the data to XML. This is an example of Database First as
    opposed to Code First programming where you take an existing database and generate
    C# objects from it.'
