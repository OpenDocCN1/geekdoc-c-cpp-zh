  md: 'When the OnPropertyChanged method is called, we use a new expression introduced
    by C# 6: nameof. When we call nameof(...) with an expression, it will retrieve
    the name of the final identifier. This is particularly useful in the case of the
    OnPropertyChanged method, because it takes the name of the property that is being
