    10. Run the application.\n\n# How It Works\n\nThe new class is currently just\
    \ a number of properties that store the values from the Options window. It is\
    \ marked as `Serializable` to make it possible to save it to a file.\n\nThe `Checked`\
    \ event of a `RadioButton` is raised whenever the user selects it. You handle\
    \ this event in order to set the value of the `ComputerSkillLevel` property of\
    \ the `GameOptions` instance.\n\n# Data Binding\n\nData binding is a way of declaratively\
    \ connecting controls with data. In the Options window, you handled the `Checked`\
    \ event of the `RadioButtons` in order to set the value of the `ComputerSkillLevel`\
    \ property in the `GameOptions` class. This works well, and you can use code and\
    \ event handling to set all the values you have in a window, but very often it\
    \ is better to bind the properties of your controls directly to the data.\n\n\
    A binding consists of four components:\n\n+   - The binding target, which specifies\
    \ the object on which the binding is used\n+   - The target property, which specifies\
    \ the property to set\n+   - The binding source, which specifies the object used\
    \ by the binding\n+   - The source property, which specifies which property holds\
    \ the data\n\nYou don't always set all of these elements explicitly; particularly\
    \ the binding target is very often implicitly specified by the fact that you are\
    \ setting a binding to a property on a control.\n\nThe binding source is always\
    \ set in order to make a binding work, but it can be set in several ways. In the\
    \ following sections and in Chapter 15, you are going to see several ways of binding\
    \ data from sources.\n\n# The DataContext\n\nA `DataContext` control defines a\
    \ data source that can be used for data binding on all child elements of an element.\
    \ You will often have a single instance of a class that holds most of the data\
    \ that is used in a view. If this is the case you can set the `DataContext` of\
    \ the window to the instance of that object, which makes you able to bind properties\
    \ from that class in your view. This is demonstrated in the “Dynamic Binding to\
    \ External Objects” section."
