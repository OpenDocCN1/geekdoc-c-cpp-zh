- pgno: 595
  md: 'TABLE 18-7: Stream Classes


    | CLASS | DESCRIPTION |

    |---|---|

    | FileStream | Represents a file that can be written to, read from, or both. This
    file can be written to and read from asynchronously or synchronously. |

    | StreamReader | Reads character data from a stream and can be created by using
    a FileStream as a base. |

    | StreamWriter | Writes character data to a stream and can be created by using
    a FileStream as a base. |


    Let''s look now at how to use each of these classes.


    # The FileStream Object


    The FileStream object represents a stream pointing to a file on a disk or a network
    path. Although the class does expose methods for reading and writing bytes from
    and to the files, most often you will use a StreamReader or StreamWriter to perform
    these functions. That''s because the FileStream class operates on bytes and byte
    arrays, whereas the Stream classes operate on character data. Character data is
    easier to work with, but certain operations, such as random file access (access
    to data at some point in the middle of a file), can be performed only by a FileStream
    object. You''ll learn more about this later in the chapter.


    There are several ways to create a FileStream object. The constructor has many
    different overloads, but the simplest takes just two arguments: the filename and
    a FileMode enumeration value:


    ```

    FileStream aFile = new FileStream(filename, FileMode.<Member>);

    ```


    The FileMode enumeration has several members that specify how the file is opened
    or created. You''ll see the possibilities shortly. Another commonly used constructor
    is as follows:


    ```

    FileStream aFile =

    new FileStream(filename, FileMode.<Member>, FileAccess.<Member>);

    ```


    The third parameter is a member of the FileAccess enumeration and is a way of
    specifying the purpose of the stream. The members of the FileAccess enumeration
    are shown in Table 18-8.


    TABLE 18-8: FileAccess Enumeration Members


    | MEMBER | DESCRIPTION |

    |---|---|

    | Read | Opens the file for reading only |

    | Write | Opens the file for writing only |

    | ReadWrite | Opens the file for reading or writing |'
  merge: -1
  img_proc: true
- pgno: 596
  md: 'Attempting to perform an action other than that specified by the FileAccess
    enumeration member will result in an exception being thrown. This property is
    often used as a way to vary user access to the file based on the user''s authorization
    level.


    In the version of the FileStream constructor that doesn''t use a FileAccess enumeration
    parameter, the default value is used, which is FileAccess.ReadWrite.


    The FileMode enumeration members are shown in Table 18-9. What actually happens
    when each of these values is used depends on whether the filename specified refers
    to an existing file. Note that the entries in this table refer to the position
    in the file that the stream points to when it is created, a topic you''ll learn
    more about in the next section. Unless otherwise stated, the stream points to
    the beginning of a file.


    # TABLE 18-9: FileMode Enumeration Members


    | MEMBER | FILE EXISTS BEHAVIOR | NO FILE EXISTS BEHAVIOR |

    |---|---|---|

    | Append | The file is opened, with the stream positioned at the end of the file.
    Can be used only in conjunction with FileAccess.Write. | A new file is created.
    Can be used only in conjunction with FileAccess.Write. |

    | Create | The file is destroyed, and a new file is created in its place. | A
    new file is created. |

    | CreateNew | An exception is thrown. | A new file is created. |

    | Open | The file is opened, with the stream positioned at the beginning of the
    file. | An exception is thrown. |

    | OpenOrCreate | The file is opened, with the stream positioned at the beginning
    of the file. | A new file is created. |

    | Truncate | The file is opened and erased. The stream is positioned at the beginning
    of the file. The original file creation date is retained. | An exception is thrown.
    |


    Both the File and FileInfo classes expose OpenRead() and OpenWrite() methods that
    make it easier to create FileStream objects. The first opens the file for read-only
    access, and the second allows write-only access. These methods provide shortcuts,
    so you do not have to provide all the information required in the form of parameters
    to the FileStream constructor. For example, the following line of code opens the
    Data.txt file for read-only access:


    ```

    FileStream aFile = File.OpenRead("Data.txt");

    ```'
