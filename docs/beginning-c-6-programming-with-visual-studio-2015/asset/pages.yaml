  md: "```\nWriteLine(\"Now in Write()\");\nWriteLine($\"Local myString = {myString}\"\
    );\nWriteLine($\"Global myString = {Program.myString}\");\n}\nstatic void Main(string[]\
    \ args)\n{\n    string myString = \"String defined in Main()\";\n    Program.myString\
    \ = \"Global string\",\n    Write(),\n    WriteLine(\"\\nNow in Main()\");\n \
    \   WriteLine($\"Local myString = {myString}\");\n    WriteLine($\"Global myString\
    \ = {Program.myString}\");\n    ReadKey();\n}\n```\n\nThe result is now as shown\
    \ in Figure 6-5.\n\n![](img/cf72ea860016d2d680fc085fc06f265a_148_0.png)\n\nFIGURE\
    \ 6-5\n\nHere, you have added another variable called myString, this time further\
    \ up the hierarchy of names in the code. The variable is defined as follows:\n\
    \n```\nstatic string myString;\n```\n\nAgain, the static keyword is required.\
    \ Without going into too much detail, understand that in this type of console\
    \ application, you must use either the static or the const keyword for global\
    \ variables of this form. If you want to modify the value of the global variable,\
    \ you need to use static because const prohibits the value of the variable from\
    \ changing.\n\nTo differentiate between this variable and the local variables\
    \ in Main() and Write() with the same names, you have to classify the variable\
    \ name using a fully qualified name, as described in Chapter 3. Here, you refer\
    \ to the global version as Program.myString. This is necessary only when you have\
    \ global and local variables with the same name; if there were no local myString\
    \ variable, you could simply use myString to refer to the global variable, rather\
    \ than Program.myString. When you have a local variable with the same name as\
    \ a global variable, the global variable is said to be hidden.\n\nThe value of\
    \ the global variable is set in Main() with\n\n```\nProgram.myString = \"Global\
    \ string\";\n```\n\nand accessed in Write() with\n\n```\nWriteLine($\"Global myString\
    \ = {Program.myString}\");\n```"
