  md: "```\nRegion=\"South America\", Sales=1001 },\n    new Customer { ID=\"T\",\
    \ City=\"Lima\", Country=\"Peru\",\nRegion=\"South America\", Sales=2002 }\n};\n\
    ```\n\n+   3. In the Main() method, following the initialization of the customers\
    \ list, enter (or modify) the query as shown here:\n+   ```\n+   var queryResults\
    \ = customers.Select(c => c.Region).Distinct();\n+   ```\n+   4. Finish the remaining\
    \ code in the Main() method as shown here.\n+   ```\n+   foreach (var item in\
    \ queryResults)\n+   {\n+       WriteLine(item);\n+   }\n+   Write(\"Program finished,\
    \ press Enter/Return to continue:\");\n+   ReadLine();\n+   ```\n+   5. Compile\
    \ and execute the program. You will see the unique regions where customers exist:\n\
    +   ```\n+   North America\n+   Asia\n+   South America\n+   Europe\n+   Africa\n\
    +   Program finished, press Enter/Return to continue:\n+   ```\n\n# How It Works\n\
    \nThe Customer class and customers list initialization are the same as in the\
    \ previous example. In the query statement, you call the Select() method with\
    \ a simple lambda expression to select the region from the Customer objects, and\
    \ then call Distinct() to return only the unique results from Select():\n\n```\n\
    var queryResults = customers.Select(c => c.Region).Distinct();\n```\n\nBecause\
    \ Distinct() is available only in method syntax, you make the call to Select()\
    \ using method syntax. However, you can call Distinct() to modify a query made\
    \ in the query syntax as well:\n\n```\nvar queryResults = (from c in customers\
    \ select c.Region).Distinct();\n```\n\nBecause query syntax is translated by the\
    \ C# compiler into the same series of LINQ method calls as used in the method\
    \ syntax, you can mix and match if it makes sense for readability and style.\n\
    \n# ORDERING BY MULTIPLE LEVELS\n\nNow that you are dealing with objects with\
    \ multiple properties, you might be able to envision a situation where ordering\
    \ the query results by a single field is not enough. What if you wanted to query\
    \ your customers and order the results alphabetically by region, but then order\
    \ alphabetically by country or city name within a region? LINQ makes this very\
    \ easy, as you will see in the following Try It Out."
