- pgno: 175
  md: '# Monitoring Variable Content


    Monitoring variable content is just one example of how Visual Studio helps you
    a great deal by simplifying things. The easiest way to check the value of a variable
    is to hover the mouse over its name in the source code while in break mode. A
    tooltip showing information about the variable appears, including the variable''s
    current value.


    You can also highlight entire expressions to get information about their results
    in the same way. For more complex values, such as arrays, you can even expand
    values in the tooltip to see individual element entries.


    It is possible to pin these tooltip windows to the code view, which can be useful
    if there is a variable you are particularly interested in. Pinned tooltips persist,
    so they are available even if you stop and restart debugging. You can also add
    comments to pinned tooltips, move them around, and see the value of the last variable
    value, even when the application isn''t running.


    You may have noticed that when you run an application, the layout of the various
    windows in the IDE changes. By default, the following changes are likely to occur
    at runtime (this behavior may vary slightly depending on your installation):


    +   - The Properties window disappears, along with some other windows, probably
    including the Solution Explorer window.

    +   - The Error List window is replaced with two new windows across the bottom
    of the IDE window.

    +   - Several new tabs appear in the new windows.


    The new screen layout is shown in Figure 7-10. This may not match your display
    exactly, and some of the tabs and windows may not look exactly the same, but the
    functionality of these windows as described later will be the same, and this display
    is customizable via the View and Debug Windows menus (during break mode), as well
    as by dragging windows around the screen to reposition them.


    The new window that appears in the bottom-left corner is particularly useful for
    debugging. It enables you to keep tabs on the values of variables in your application
    when in break mode:


    +   - Autos — Variables in use in the current and previous statements (Ctrl+D,
    A)

    +   - Locals — All variables in scope (Ctrl+D, L)

    +   - Watch N — Customizable variable and expression display (where N is 1 to
    4, found on Debug Windows Watch)


    All these tabs work in more or less the same way, with various additional features
    depending on their specific function. In general, each tab contains a list of
    variables, with information on each variable''s name, value, and type. More complex
    variables, such as arrays, may be further examined using the + and - tree expansion/contraction
    symbols to the left of their names, enabling a tree view of their content. For
    example, Figure 7-11 shows the Locals tab obtained by placing a breakpoint in
    the example code. It shows the expanded view for one of the array variables, maxValIndices.'
