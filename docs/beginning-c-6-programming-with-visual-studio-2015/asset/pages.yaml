  md: "# COMPARISONS\n\nThis section covers two types of comparisons between objects:\n\
    \n+   - Type comparisons\n+   - Value comparisons\n\nType comparisons — that is,\
    \ determining what an object is, or what it inherits from — are important in all\
    \ areas of C# programming. Often when you pass an object — to a method, for example\
    \ — what happens next depends on the type of the object. You've seen this in passing\
    \ in this and earlier chapters, but here you will see some more useful techniques.\n\
    \nValue comparisons are also something you've seen a lot of, at least with simple\
    \ types. When it comes to comparing values of objects, things get a little more\
    \ complicated. You have to define what is meant by a comparison for a start, and\
    \ what operators such as > mean in the context of your classes. This is especially\
    \ important in collections, for which you might want to sort objects according\
    \ to some condition, perhaps alphabetically or according to a more complicated\
    \ algorithm.\n\n# Type Comparisons\n\nWhen comparing objects, you often need to\
    \ know their type, which enables you to determine whether a value comparison is\
    \ possible. In Chapter 9 you saw the GetType() method, which all classes inherit\
    \ from System.Object, and how this method can be used in combination with the\
    \ typeof() operator to determine (and take action depending on) object types:\n\
    \n```\nif (myObj.GetType() == typeof(MyComplexClass))\n{\n    // myObj is an instance\
    \ of the class MyComplexClass.\n}\n```\n\nYou've also seen how the default implementation\
    \ of ToString(), also inherited from System.Object, will get you a string representation\
    \ of an object's type. You can compare these strings too, although that's a rather\
    \ messy way to accomplish this.\n\nThis section demonstrates a handy shorthand\
    \ way of doing things: the is operator. This operator allows for much more readable\
    \ code and, as you will see, has the advantage of examining base classes. Before\
    \ looking at the is operator, though, you need to be aware of what often happens\
    \ behind the scenes when dealing with value types (as opposed to reference types):\
    \ boxing and unboxing.\n\n# Boxing and Unboxing\n\nIn Chapter 8, you learned the\
    \ difference between reference types and value types, which was illustrated in\
    \ Chapter 9 by comparing structs (which are value types) with classes (which are\
    \ reference types). Boxing is the act of converting a value type into the System.Object\
    \ type or to an interface type that is implemented by the value type. Unboxing\
    \ is the opposite conversion.\n\nFor example, suppose you have the following struct\
    \ type:\n\n```\nstruct MyStruct\n```"
