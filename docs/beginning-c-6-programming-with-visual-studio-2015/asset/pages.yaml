    Left\"\nMargin=\"220,151,0,0\"\nVerticalAlignment=\"Top\"\nWidth=\"75\"\n    Hello\
    \ World\n</Button>\n```\n\nHere, the Content property of the Button has been removed\
    \ and the text is now a child node of the Button control. Content can be just\
    \ about anything in XAML, which is also demonstrated in this example: The Button\
    \ element is the content of the Grid element, which is itself the content of the\
