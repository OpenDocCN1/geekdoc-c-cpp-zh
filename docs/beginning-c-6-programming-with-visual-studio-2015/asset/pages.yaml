  md: '# WHAT YOU LEARNED IN THIS CHAPTER


    | TOPIC | KEY CONCEPTS |

    |---|---|

    | What LINQ is and when to use it | LINQ is a query language built into C#. Use
    LINQ to query data from large collections of objects, XML, or databases. |

    | Parts of a LINQ query | A LINQ query includes the `from`, `where`, `select`,
    and `orderby` clauses. |

    | How to get the results of a LINQ query | Use the `foreach` statement to iterate
    through the results of a LINQ query. |

    | Deferred execution | LINQ query execution is deferred until the `foreach` statement
    is executed. |

    | Method syntax and query syntax | Use the query syntax for most LINQ queries
    and method queries when required. For any given query, the query syntax or the
    method syntax will give the same result. |

    | Lambda Expressions | Lambda expressions let you declare a method on-the-fly
    for use in a LINQ query using the method syntax. |

    | Aggregate operators | Use LINQ aggregate operators to obtain information about
    a large data set without having to iterate through every result. |

    | Group queries | Use group queries to divide data into groups, then sort, calculate
    aggregates, and compare by group. |

    | Ordering | Use the `orderby` operator to order the results of a query. |

    | Joins | Use the `join` operator to query related data in multiple collections
    with a single query. |'
