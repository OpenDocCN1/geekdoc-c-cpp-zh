    9. Run the application by pressing F5. Try to resize the window. Notice that the
    second button moves with the window, whereas the first button stays fixed.


    # How It Works


    Any change that you apply in any of the three views is reflected in the other
    views, but some things are easier to do in certain views. Changing something trivial
    like the text displayed on a button can be done quickly in XAML View, but adding
    the information needed to perform a render transformation is much quicker from
    Design View.


    In this exercise, you began by changing the name of the button, which added the
    x:Name property to the button. The name of a control must be unique within the
    scope of the namespace, so you can use the name for only one control.


    Next you changed the Content property, set the Height and Width of the control,
    and then changed the font to bold. Doing so changed the way the control displayed
    itself within the window. It used to fill all the space of its container, but
    now you have limited it to a specific size.


    Then you dragged the first button to a specific position on the Design View. As
    you see later in this chapter, this action will not always yield the same results
    but is dependent on the container in which the control is placed. In this case,
    with the Grid container, the control can be dragged to a specific position. The
    action sets the Margin property on the control. Two other properties should be
    mentioned here: HorizontalAlignment="Left" and VerticalAlignment="Top". With these
    two properties set, the margin becomes relative to the top-left corner of the
    window and thus the control is pushed to the position you placed it in the grid.
    If you compare the first and second buttons at this point, you will notice that
    the second control has none of these properties set. By omitting the alignment
    properties as well as the margin properties, the control is placed at the center
    of the container, even at runtime. This means that the first button with the margin
    and alignments set is fixed when the window resizes, but the second button always
    stays centered.


    Finally, you performed a little bit of a party trick. By dragging the control
    when the Rotate mouse pointer is displayed, you can rotate the control. This is
    a standard feature of XAML and WPF and can be applied to all controls, although
    there are a few controls that fail to change their content when the control itself
    is rotated. This includes controls that rely on Windows Forms or old Windows controls
    to display content.'
