- pgno: 538
  md: 'The Dispatcher is used to invoke the call. This ensures that the calls are
    made on the GUI thread.


    Drawing the cards is pretty straightforward. The program simply stacks them vertically
    or horizontally depending on the settings in PlayerOrientation.


    The GameDecksControl is even simpler. It uses the CurrentPlayer class to be notified
    that the CurrentPlayer has changed. When this happens, it hooks the CardDiscarded
    event on the player, and uses this event to be notified that the card was discarded.


    Finally, you add a dock panel to the game client with a CardsInHandControl on
    each side and with a GameDecksControl in the middle:


    ```

    <local:CardsInHandControl x:Name="Player1Hand" DockPanel.Dock="Top"

    HorizontalAlignment="Center" Height="154" VerticalAlignment="Top"

    PlayerOrientation="Horizontal" Owner="{Binding Players[0]}" Width="380"

    PlayerState="{Binding Players[0].State}" Game="{Binding}" />

    ```


    The binding for Game simply binds the DataContext of the game client directly
    to the Game property of the CardsInHandControl. The PlayerState is bound to the
    State property of a player. In this case, the player at index 0 is used to access
    the state.


    # EXERCISES


    15.1 The current game client has a problem. From the Options dialog box, you can
    set the skill level of the computer. The problem is that the radio buttons are
    not updated to reflect the choice the next time you open the Options dialog box.
    This is partly because there is nothing that tries to update them and partly because
    there is no value converter from ComputerSkillLevel. Fix this problem by creating
    a new value converter and setting the IsChecked binding instead of using the Checked
    event that is currently being used.


    Hint: You must use the ConverterParameter part of the Converter binding.


    15.2 The computer cheats, so you might want to allow the players to cheat as well.
    On the Options dialog box, create an option for the computer to play with open
    cards.


    15.3 Create a status bar at the bottom of the game client that displays the current
    state of the game.'
