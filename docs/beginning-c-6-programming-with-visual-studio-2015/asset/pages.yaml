- pgno: 376
  md: "In your code you have a suitable method:\n\n```\n```\nstatic void WriteChar(object\
    \ source, ElapsedEventArgs e)\n{\n    Write(displayString[counter++ % displayString.Length]);\n\
    }\n```\n```\n\nThis method uses the two static fields of Program, counter and\
    \ displayString, to display a single character. Every time the method is called,\
    \ a different character is displayed.\n\nThe next task is to hook this handler\
    \ up to the event — to subscribe to it. To do this, you use the += operator to\
    \ add a handler to the event in the form of a new delegate instance initialized\
    \ with your event handler method:\n\n```\n```\nstatic void Main(string[] args)\n\
    {\n    Timer myTimer = new Timer(100);\n    myTimer.Elapsed += new ElapsedEventHandler(WriteChar);\n\
    }\n```\n```\n\nThis command (which uses slightly strange-looking syntax, specific\
    \ to delegates) adds a handler to the list that will be called when the Elapsed\
    \ event is raised. You can add as many handlers as you like to this list as long\
    \ as they all meet the criteria required. Each handler is called in turn when\
    \ the event is raised.\n\nAll that remains for Main() to do is start the timer\
    \ running:\n\n```\n```\nmyTimer.Start();\n```\n```\n\nYou don't want the application\
    \ terminating before you have handled any events, so you put the Main() method\
    \ on hold. The simplest way to do this is to request user input, as this command\
    \ won't finish processing until the user has pressed a key:\n\n```\n```\nReadKey();\n\
    ```\n```\n\nAlthough processing in Main() effectively ceases here, processing\
    \ in the Timer object continues. When it raises events it calls the WriteChar()\
    \ method, which runs concurrently with the ReadLine() statement. The System.Threading.Thread.Sleep(200)\
    \ statement is included to give the timer the opportunity to start sending messages\
    \ to the console application.\n\nNote that the syntax for adding an event handler\
    \ can be simplified slightly using the method group concept introduced in the\
    \ previous chapter, as follows:\n\n```\n```\nmyTimer.Elapsed += WriteChar;\n```\n\
    ```\n\nThe end result is exactly the same, but you do not have to explicitly specify\
    \ the delegate type; it is inferred by the compiler from the context in which\
    \ you use it. However, many programmers dislike this syntax because it reduces\
    \ readability — it is no longer possible to tell at a glance what delegate type\
    \ you are using. Feel free to use this syntax if you prefer, but in this chapter\
    \ all the delegates you use will be referenced explicitly to make things clearer."
  merge: -1
  img_proc: true
