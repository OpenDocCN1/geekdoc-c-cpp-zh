- pgno: 458
  md: '> NOTE You can also define rows and columns in the grid by clicking the edges
    of the grid in the Design View. If you move the mouse pointer to the edge of the
    grid, a yellow line is drawn across the Design View; if you click the edge, the
    necessary XAML is inserted. When you do this, the Width and Height properties
    of the rows and columns are always set by the designer, but you can delete them
    or drag the lines to suit your needs.


    You can control the resizing with the Width, Height, MinWidth, MaxWidth, MinHeight,
    and MaxHeight properties. For example, setting the Width property of a column
    ensures that the column stays at that width. You can also set the Width property
    of a column to *, which means "fill the remaining space after calculating the
    width of all other columns." This is actually the default. When you have multiple
    columns with a Width of *, then the remaining space is divided between them equally.
    The * value can also be used with the Height property of rows. The other possible
    value for Height and Width is Auto, which sizes the row or column according to
    its content. You can also use GridSplitter controls to enable users to customize
    the dimensions of rows and columns by clicking and dragging.


    Child controls of a Grid control can use the attached Grid.Column and Grid.Row
    properties to specify which cell they are contained in. Both these properties
    default to 0, so if you omit them, then the child control is placed in the top-left
    cell. Child controls can also use Grid.ColumnSpan and Grid.RowSpan to be positioned
    over multiple cells in a table, where the upper-left cell is specified by Grid.Column
    and Grid.Row.


    # TRY IT OUT Using Rows and Columns: Ch14Ex01\MainWindow.xaml


    Return to the example from the beginning of the chapter with the two buttons and
    follow these steps.


    +   1. Select the Grid control by clicking in the XAML View.

    +   2. Move the mouse pointer to the top edge of the grid in Design View; you''ll
    see an orange line appear across the surface of the grid. Allow room for a button
    and click to create two columns.

    +   3. Repeat Step 2 on the left edge of the window, creating two rows.

    +   4. Select the first of the two buttons. Note that the action of adding the
    rows and columns automatically added the Grid.Row and Grid.Column properties to
    the button. Change the Grid.Row and Grid.Column attached properties to 0.

    +   5. Adjust the Margin property to make the button fully visible in the cell.

    +   6. The second button has also been adjusted. For example, a Margin has been
    added. Now delete the Margin property from the second button.'
  merge: -1
  img_proc: true
