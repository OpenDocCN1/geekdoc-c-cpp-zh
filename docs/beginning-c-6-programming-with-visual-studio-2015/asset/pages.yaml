  md: "For this data binding to work, you must define three dependency properties\
    \ using techniques you learned in the previous section. These are defined in the\
    \ code-behind for the user control as follows (they have simple .NET property\
    \ wrappers, which there is no need to show here because of the simplicity of the\
    \ code):\n\n```\npublic static DependencyProperty SuitProperty = DependencyProperty.Register(\n\
    \    \"Suit\",\n    typeof(CardLib.Suit),\n    typeof(CardControl),\n    new PropertyMetadata(CardLib.Suit.Club,\n\
    new PropertyChangedCallback(OnSuitChanged)));\npublic static DependencyProperty\
    \ RankProperty = DependencyProperty.Register(\n    \"Rank\",\n    typeof(CardLib.Rank),\n\
    \    typeof(CardControl),\n    new PropertyMetadata(CardLib.Rank.Ace));\npublic\
    \ static DependencyProperty IsFaceUpProperty = DependencyProperty.Register(\n\
    \    \"IsFaceUp\",typeof(bool),\n    typeof(CardControl),\n    new PropertyMetadata(true,\
    \ new PropertyChangedCallback(OnIsFaceUpChanged)));\n```\n\nThe dependency properties\
    \ use a callback method to validate their values, and the Suit and IsFaceUp properties\
    \ also have a callback method for when their values change.\n\nWhen the value\
    \ of Suit changes, the OnSuitChanged() callback method is called. This method\
    \ is responsible for setting the text color to red (for hearts and diamonds) or\
    \ black (for clubs and spades). It does this by calling a utility method on the\
    \ source of the method call. This is necessary because the callback method is\
    \ implemented as a static method, but it is passed the instance of the user control\
    \ that raised the event as a parameter so that it can interact with it. The method\
    \ called is SetTextColor():\n\n```\npublic static void OnSuitChanged(DependencyObject\
    \ source,\n    DependencyPropertyChangedEventArgs args)\n{\n    var control =\
    \ source as CardControl;\n    control.SetTextColor();\n}\n```\n\nThe SetTextColor()\
    \ method is private but is obviously still accessible from OnSuitChanged(), as\
    \ they are both members of the same class, despite being instance and static methods,\
    \ respectively. SetTextColor() simply sets the Foreground property of the various\
    \ labels of the control to a solid color brush that is either black or red, depending\
    \ on the Suit value.\n\nWhen IsFaceUp changes, the control displays or hides the\
    \ images and labels that are used to display the current value of the control.\n\
    \nThis is all you need to look at in the Card control. The code in the GameClient.xaml.cs\
    \ code-behind file is included to display the cards and is only temporary. It\
    \ generates one card for each of the 13 possible values and displays each suit\
    \ in a column."
