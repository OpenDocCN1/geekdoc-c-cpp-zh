- pgno: 146
  md: "That results in the following:\n\n```\nThe maximum value in myArray is 9\n\
    The first occurrence of this value is at element 7\n```\n\nYou must use the out\
    \ keyword in the function call, just as with the ref keyword.\n\n# VARIABLE SCOPE\n\
    \nThroughout the last section, you might have been wondering why exchanging data\
    \ with functions is necessary. The reason is that variables in C# are accessible\
    \ only from localized regions of code. A given variable is said to have a scope\
    \ from which it is accessible.\n\nVariable scope is an important subject and one\
    \ best introduced with an example. The following Try It Out illustrates a situation\
    \ in which a variable is defined in one scope, and an attempt to use it is made\
    \ in a different scope.\n\n# TRY IT OUT  Variable Scope: using the Ch06Ex01\\\
    Program.cs\n\n1. Make the following changes to Ch06Ex01 in Program.cs created\
    \ previously:\n\n```\nclass Program\n{\n    static void Write()\n    {\n     \
    \   WriteLine($\"myString = {myString}\");\n    }\n    static void Main(string[]\
    \ args)\n    {\n        string myString = \"String defined in Main()\";\n    \
    \    Write();\n        ReadKey();\n    }\n}\n```\n\n2. Compile the code and note\
    \ the error and warning that appear in the error list:\n\n```\nThe name 'myString'\
    \ does not exist in the current context\nThe variable 'myString' is assigned but\
    \ its value is never used\n```\n\n# How It Works\n\nWhat went wrong? Well, the\
    \ variable myString defined in the main body of your application (the Main() function)\
    \ isn't accessible from the Write() function.\n\nThe reason for this inaccessibility\
    \ is that variables have a scope within which they are valid. This scope encompasses\
    \ the code block that they are defined in and any directly nested code blocks.\
    \ The blocks of code in functions are separate from the blocks of code from which\
    \ they are called. Inside Write(), the name myString is undefined, and the myString\
    \ variable defined in Main() is out of scope — it can be used only from within\
    \ Main()."
