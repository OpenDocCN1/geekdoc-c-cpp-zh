    \ the following:\n\n```\nConvClass1 op1 = new ConvClass1();\nConvClass2 op2 =\
    \ op1;\n```\n\nAlternatively, you can define an explicit conversion:\n\n```\n\
    ConvClass1 op1 = new ConvClass1();\nConvClass2 op2 = (ConvClass2)op1;\n```\n\n\
    As an example, consider the following code:\n\n```\npublic class ConvClass1\n\
    {\n    public int val;\n    public static implicit operator ConvClass2(ConvClass1\
    \ op1)\n    {\n        ConvClass2 returnVal = new ConvClass2();\n        returnVal.val\
    \ = op1.val;\n        return returnVal;\n    }\n}\npublic class ConvClass2\n{\n\
    \    public double val;\n    public static explicit operator ConvClass1(ConvClass2\
    \ op1)\n    {\n        ConvClass1 returnVal = new ConvClass1();\n        checked\
    \ {returnVal.val = (int)op1.val;}\n        return returnVal;\n    }\n}\n```\n\n\
    Here, ConvClass1 contains an int value and ConvClass2 contains a double value.\
    \ Because int values can be converted into double values implicitly, you can define\
    \ an implicit conversion between ConvClass1 and ConvClass2. The reverse is not\
    \ true, however, and you should define the conversion operator between ConvClass2\
    \ and ConvClass1 as explicit.\n\nYou specify this using the implicit and explicit\
