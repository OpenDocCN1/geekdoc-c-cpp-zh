  md: "In addition, these parameters benefit from polymorphism. You could define a\
    \ handler for the MessageArrived event such as this:\n\n```\npublic void DisplayMessage(object\
    \ source, EventArgs e)\n{\n    WriteLine($\"Message arrived from: {((Connection)source).Name}\"\
    );\n    WriteLine($\"Message Text: {((MessageArrivedEventArgs)e).Message}\");\n\
    }\n```\n\nThe application will execute exactly as it did before, but the DisplayMessage()\
    \ method is now more versatile (in theory at least — more implementation is needed\
    \ to make this production quality). This same handler could work with other events,\
    \ such as the Timer.Elapsed, although you'd have to modify the internals of the\
    \ handler a bit more such that the parameters sent when this event is raised are\
    \ handled properly. (Casting them to Connection and MessageArrivedEventArgs objects\
    \ in this way will cause an exception; you should use the as operator instead\
    \ and check for null values.)\n\n# The EventHandler and Generic EventHandler<T>\
    \ Types\n\nIn most cases, you will follow the pattern outlined in the previous\
    \ section and use event handlers with a void return type and two parameters. The\
    \ first parameter will be of type object, and will be the event source. The second\
    \ parameter will be of a type that derives from System.EventArgs, and will contain\
    \ any event arguments. As this is so common, .NET provides two delegate types\
    \ to make it easier to define events: EventHandler and EventHandler<T>. Both of\
    \ these are delegates that use the standard event handler pattern. The generic\
    \ version enables you to specify the type of event argument you want to use.\n\
    \nIn the previous Try It Out, you saw this in action as you used the generic EventHandler<T>\
    \ delegate type as follows:\n\n```\npublic class Connection\n{\n    public event\
    \ EventHandler<MessageArrivedEventArgs> MessageArrived;\n    ...\n}\n```\n\nThis\
    \ is obviously a good thing to do because it simplifies your code. In general,\
    \ it is best practice to use these delegate types whenever you define an event.\
    \ Note that if you have an event that doesn't need event argument data, you can\
    \ still use the EventHandler delegate type. You can simply pass EventArgs.Empty\
    \ as the argument value.\n\n# Return Values and Event Handlers\n\nAll the event\
    \ handlers you've seen so far have had a return type of void. It is possible to\
    \ provide a return type for an event, but this can lead to problems because a\
    \ given event can result in several event handlers being called. If all of these\
    \ handlers return a value, then it can be unclear which value was actually returned.\n\
    \nThe system deals with this by allowing you access to only the last value returned\
    \ by an event handler. That will be the value returned by the last event handler\
    \ to subscribe to an event. Although this"
