    \n4. Compile and execute the program (you can just press F5). You will see the\
    \ same output of names in the list beginning with S, in the order they were declared\
    \ in the array, as shown here:\n\n```\nNames beginning with S:\nSmith\nSmythe\n\
    Small\nSingh\nSamba\nProgram finished, press Enter/Return to continue:\n```\n\n\
    # How It Works\n\nAs before, the System.Linq namespace is referenced automatically\
    \ by Visual Studio 2015:\n\n```\nusing System.Linq;\n```\n\nThe same source data\
    \ as before is created again by declaring and initializing the array of names:\n\
    \n```\nstring[] names = { \"Alonso\", \"Zheng\", \"Smith\", \"Jones\", \"Smythe\"\
    , \"Small\", \"Ruiz\",\n\"Hsieh\", \"Jorgenson\", \"Ilyich\", \"Singh\", \"Samba\"\
    , \"Fatimah\" };\n```\n\nThe part that is different is the LINQ query, which is\
    \ now a call to the Where() method instead of a query expression:\n\n```\nvar\
    \ queryResults = names.Where(n => n.StartsWith(\"S\"));\n```\n\nThe C# compiler\
    \ compiles the lambda expression n => n.StartsWith(\"S\") into an anonymous method\
    \ that is executed by Where() on each item in the names array. If the lambda expression\
    \ returns true for an item, that item is included in the result set returned by\
    \ Where(). The C# compiler infers that the Where() method should accept string\
    \ as the input type for each item from the definition of the input source (the\
    \ names array, in this case).\n\nWell, a lot is going on in that one line, isn't\
    \ it? For the simplest type of query like this, the method syntax is actually\
    \ shorter than the query syntax because you do not need the from or select clauses;\
    \ however, most queries are more complex than this.\n\nThe rest of the example\
    \ is the same as the previous one — you print out the results of the query in\
    \ a foreach loop and pause the output so you can see it before the program finishes\
    \ execution:\n\n```\nforeach (var item in queryResults) {\n    WriteLine(item);\n\
    }\n```"
