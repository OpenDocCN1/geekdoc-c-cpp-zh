  md: "In addition, you can combine these two methods of initialization if you want:\n\
    \n```\n```csharp\nint[] myIntArray = new int[5] { 5, 9, 10, 2, 99 };\n```\n```\n\
    \nWith this method the sizes must match. You can't, for example, write the following:\n\
    \n```\n```csharp\nint[] myIntArray = new int[10] { 5, 9, 10, 2, 99 };\n```\n```\n\
    \nHere, the array is defined as having 10 members, but only five are defined,\
    \ so compilation will fail. A side effect of this is that if you define the size\
    \ using a variable, then that variable must be a constant:\n\n```\n```csharp\n\
    const int arraySize = 5;\nint[] myIntArray = new int[arraySize] { 5, 9, 10, 2,\
    \ 99 };\n```\n```\n\nIf you omit the const keyword, this code will fail.\n\nAs\
    \ with other variable types, there is no need to initialize an array on the same\
    \ line that you declare it. The following is perfectly legal:\n\n```\n```csharp\n\
    int[] myIntArray;\nmyIntArray = new int[5];\n```\n```\n\nIn the following Try\
