- pgno: 592
  md: 'examined. This directory is the one containing the application that calls this
    code. You’ll look at this in more detail a little later, in the section “Path
    Names and Relative Paths.”


    Most of the FileInfo methods mirror the File methods in this manner. In most cases
    it doesn’t matter which technique you use, although the following criteria can
    help you to decide which is more appropriate:


    +   - It makes sense to use methods on the static File class if you are making
    only a single method call — the single call will be faster because the .NET Framework
    won’t have to go through the process of instantiating a new object and then calling
    the method.

    +   - If your application is performing several operations on a file, then it
    makes more sense to instantiate a FileInfo object and use its methods — this saves
    time because the object will already be referencing the correct file on the file
    system, whereas the static class has to find it every time.


    The FileInfo class also exposes properties relating to the underlying file, some
    of which can be manipulated to update the file. Many of these properties are inherited
    from FileSystemInfo, and thus apply to both the FileInfo and DirectoryInfo classes.
    The properties of FileSystemInfo are shown in Table 18-4.


    # TABLE 18-4: FileSystemInfo Properties


    | PROPERTY | DESCRIPTION |

    |---|---|

    | Attributes | Gets or sets the attributes of the current file or directory, using
    the FileAttributes enumeration. |

    | CreationTime, CreationTimeUtc | Gets or sets the creation date and time of the
    current file, available in coordinated universal time (UTC) and non-UTC versions.
    |

    | Extension | Retrieves the extension of the file. This property is read-only.
    |

    | Exists | Determines whether a file exists. This is a read-only abstract property,
    and is overridden in FileInfo and DirectoryInfo. |

    | FullName | Retrieves the full path of the file. This property is read-only.
    |

    | LastAccessTime, LastAccessTimeUtc | Gets or sets the date and time that the
    current file was last accessed, available in UTC and non-UTC versions. |

    | LastWriteTime, LastWriteTimeUtc | Gets or sets the date and time that the current
    file was last written to, available in UTC and non-UTC versions. |

    | Name | Retrieves the full path of the file. This is a read-only abstract property,
    and is overridden in FileInfo and DirectoryInfo. |'
