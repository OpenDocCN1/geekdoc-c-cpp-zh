  md: "# Sorting Collections\n\nMany collection classes allow sorting, either by default\
    \ comparisons between objects or by custom methods. ArrayList is one example.\
    \ It contains the method Sort(), which can be used without parameters, in which\
    \ case default comparisons are used, or it can be passed an IComparer interface\
    \ to use to compare pairs of objects.\n\nWhen you have an ArrayList filled with\
    \ simple types, such as integers or strings, the default comparer is fine. For\
    \ your own classes, you must either implement IComparable in your class definition\
    \ or create a separate class supporting IComparer to use for comparisons.\n\n\
    Note that some classes in the System.Collections namespace, including CollectionBase,\
    \ don't expose a method for sorting. If you want to sort a collection you have\
    \ derived from this class, then you have to do a bit more work and sort the internal\
    \ List collection yourself.\n\nThe following Try It Out shows how to use a default\
    \ and nondefault comparer to sort a list.\n\n# TRY IT OUT Sorting a List: Ch11Ex05\n\
    \n+   1. Create a new console application called Ch11Ex05 in the directory C:\\\
    BegVCSharp\\Chapter11.\n+   2. Add a new class called Person and modify the code\
    \ in Person.cs as follows:\n+   3. Add another new class called PersonComparerName\
    \ and modify the code as follows:\n\n```\nnamespace Ch11Ex05\n{\n    public class\
    \ Person : IComparable\n    {\n        public string Name;\n        public int\
    \ Age;\n        public Person(string name, int age)\n        {\n            Name\
    \ = name;\n            Age = age;\n        }\n        public int CompareTo(object\
    \ obj)\n        {\n            if (obj is Person)\n            {\n           \
    \     Person otherPerson = obj as Person;\n                return this.Age - otherPerson.Age;\n\
    \            }\n            else\n            {\n                throw new ArgumentException(\n\
    \                    \"Object to compare to is not a Person object.\");\n    \
    \        }\n        }\n    }\n}\n```\n\n```\nusing System;\nusing System.Collections;\n\
    ```"
