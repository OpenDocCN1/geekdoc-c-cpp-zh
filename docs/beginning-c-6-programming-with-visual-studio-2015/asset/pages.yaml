    \ Framework. It is, in fact, exactly what you are doing when you use any of the\
    \ classes in the .NET Framework because they are treated in the same way.\n\n\
    # INTERFACES VERSUS ABSTRACT CLASSES\n\nThis chapter has demonstrated how you\
    \ can create both interfaces and abstract classes (without members for now — you\
    \ get to them in Chapter 10). The two types are similar in a number of ways, so\
    \ it would be useful to know how to determine when you should use one technique\
    \ or the other.\n\nFirst the similarities: Both abstract classes and interfaces\
    \ can contain members that can be inherited by a derived class. Neither interfaces\
