    Here, the attached property is referred to using the name of the parent element,
    a period, and the name of the attached property.


    In WPF, attached properties serve a variety of uses. You will see a lot of attached
    properties shortly, when you look at how to position controls in the “Control
    Layout” section. You will learn how container controls define attached properties
    that enable child controls to define, for example, which edges of the container
    to dock to.


    # Events


    In Chapter 13, you learned what events are and how to use them. This section covers
    particular kinds of events — specifically, the events generated by WPF controls
    — and introduces routed events, which are usually associated with user actions.
    For example, when the user clicks a button, that button generates an event indicating
    what just happened to it. Handling the event is the means by which the programmer
    can provide some functionality for that button.


    Many of the events you handle are common to most of the controls that you work
    with in this book. This includes events such as LostFocus and MouseEnter. This
    is because the events themselves are inherited from base classes such as Control
    or ContentControl. Other events such as the CalendarOpened event of the DatePicker
    are more specific and only found on specialized controls. Some of the most used
    events are listed in Table 14-1.


    TABLE 14-1: Common Control Events


    | EVENT | DESCRIPTION |

    |---|---|

    | Click | Occurs when a control is clicked. In some cases, this event also occurs
    when a user presses the Enter key. |

    | Drop | Occurs when a drag-and-drop operation is completed — in other words,
    when an object has been dragged over the control, and the user releases the mouse
    button. |

    | DragEnter | Occurs when an object being dragged enters the bounds of the control.
    |

    | DragLeave | Occurs when an object being dragged leaves the bounds of the control.
    |

    | DragOver | Occurs when an object has been dragged over the control. |

    | KeyDown | Occurs when a key is pressed while the control has focus. This event
    always occurs before KeyPress and KeyUp. |

    | KeyUp | Occurs when a key is released while a control has focus. This event
    always occurs after KeyDown event. |'
