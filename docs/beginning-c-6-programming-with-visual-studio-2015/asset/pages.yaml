  md: "![](img/cf72ea860016d2d680fc085fc06f265a_492_0.png)\n\nFIGURE 15-1\n\n+   19.\
    \ Go to the GameClient.xaml.cs code-behind file and add these two methods:\n\n\
    ```\nprivate void CommandCanExecute(object sender, CanExecuteRoutedEventArgs e)\n\
    {\n    if (e.Command == ApplicationCommands.Close)\n        e.CanExecute = true;\n\
    \    if (e.Command == ApplicationCommands.Save)\n        e.CanExecute = false;\n\
    \    e.Handled = true;\n}\nprivate void CommandExecuted(object sender, ExecutedRoutedEventArgs\
    \ e)\n{\n    if (e.Command == ApplicationCommands.Close)\n        this.Close();\n\
    \    e.Handled = true;\n}\n```\n\n+   20. Change the StartupUri in the App.xaml\
    \ file to GameClient.xaml and run the application.\n\n# How It Works\n\nWhen you\
    \ run the application you will notice that the Game Client window is initially\
    \ displayed as maximized, but you can resize the window as you like. When you\
    \ hold down the Alt key, the File menu gets focus and the F in File is underlined,\
    \ indicating that you can expand the menu by pressing F.\n\nWhen you expand the\
    \ menu you can see that the Save menu is disabled, but it displays a disk icon\
    \ as well as the text “Ctrl-S” to the right of the element title. This means that\
    \ you can access it by pressing Ctrl-S (when it is enabled). You might wonder\
    \ why this is displayed, as you haven’t set any shortcut keys anywhere. However,\
    \ you did set a command for the menu item:\n\n```\n<MenuItem Header=\"_Save\"\
    \ Width=\"200\" Foreground=\"Black\" Command=\"Save\">\n```"
