- pgno: 469
  md: '# The ComboBox Control


    Like the RadioButton and CheckBox controls, ComboBoxes allow users to select exactly
    one option. However, ComboBoxes are fundamentally different from the other two
    in two ways:


    +   - ComboBoxes display the possible choices in a drop-down list.

    +   - It is possible to allow the users to type new values.


    ComboBoxes are commonly used to display long lists of values, such as country
    or state names, but they can be used for many purposes. In the Options dialog
    box, a ComboBox is used to display a list from which the user can choose the number
    of players. Although this could just as well have been done using RadioButtons,
    the use of a ComboBox saves space in the view.


    A ComboBox can be changed to display itself with a TextBox at the top that allows
    the users to type any values that they feel are missing. One of the exercises
    of this chapter asks you to add a ComboBox to the Options dialog box from which
    the users can either type their name or select it from a list.


    The two properties — IsReadOnly and IsEditable — are very important for the behavior
    of the control and work together to provide four possible ways for the user to
    select the value of the ComboBox using the keyboard (see Table 14-6):


    # TABLE 14-6: IsReadOnly and IsEditable Combinations


    |  | ISREADONLY IS TRUE | ISREADONLY IS FALSE |

    |---|---|---|

    | IsEditable is true | The TextBox is displayed but the control does not react
    to key presses. If a selection is made in the list, the text can be selected in
    the TextBox. | The TextBox is displayed and the user can type anything she wishes.
    If something is typed that is in the list, it is selected. The control will display
    the best possible match as the user is typing. |

    | IsEditable is false | When IsEditable is false, IsReadOnly no longer has any
    effect because the TextBox is not displayed. When the control is selected, the
    user can select a value from the list by typing but it is not possible to type
    a value that isn''t in the list. | When IsEditable is false, IsReadOnly no longer
    has any effect because the TextBox is not displayed. When the control is selected,
    the user can select a value from the list by typing but it is not possible to
    type a value that isn''t in the list. |


    A ComboBox is an Items control, which means that you can add multiple items to
    it. Table 14-7 shows additional properties for the ComboBox control.'
  merge: -1
  img_proc: true
- pgno: 470
  md: '# TABLE 14-7: Other ComboBox Properties


    | COMBOBOX PROPERTY | DESCRIPTION |

    |---|---|

    | Text | The Text property represents the text displayed at the head of the ComboBox.
    It is either an element of the list or a new text typed by the user. |

    | SelectedIndex | Represents the index of the selected item in the list. If this
    is -1 then no selection is made. This is also the case if the user has typed something
    that was not in the list. |

    | SelectedItem | Represents the actual item of the list, not just the index or
    the text. If nothing is selected or the user has typed something new, this returns
    null. |


    # The TabControl


    The TabControl is radically different than the other controls presented this section.
    It is a layout control that is used to group controls on pages that can be selected
    by clicking on them.


    Tab controls are used when you want to display a lot of information in a single
    window but don’t want to clutter the view too much. In this case, you should divide
    the information into groups of related items and create a single page for each
    group. Generally speaking, you should never allow controls on one page to affect
    controls on another page. If you do so anyway, the user will not realize that
    something has changed on another page and will be confused when settings change
    behind her back.


    By default each page is constructed of TabItems that, by default, are populated
    by a single Grid control, but you can change the Grid to any other control as
    you see fit. On each tab, you can lay out your UI and, by selecting the TabItems,
    you can change between the tabs. Each TabItem has a Header that can be used to
    display the tab itself. This can be used as a Content control, meaning that you
    can customize how the header is displayed so that it can be more than just a text.


    # TRY IT OUT Designing the Options Window: KarliCards Gui \Options.xaml


    The first thing that you probably notice when you see the Options window is that
    it looks remarkably like the About window, and that is true. Because of that,
    it is possible to reuse at least some of the code from the previous example.


    +   1. Right-click the project in the Solution Explorer and chose Add Window.
    Name the window Options.xaml.

    +   2. Delete the Grid control that is inserted by default.

    +   3. Open the About.xaml window described earlier, copy the Grid control and
    all its content, and paste it into the new Options.xaml file.'
