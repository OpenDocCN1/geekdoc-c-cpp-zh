  md: "```\n=> (op1.val == op2.val);\npublic static bool operator !=(AddClass1 op1,\
    \ AddClass1 op2)\n=> !(op1 == op2);\npublic override bool Equals(object op1) =>\
    \ val == ((AddClass1)op1).val;\npublic override int GetHashCode() => val;\n}\n\
    ```\n\nGetHashCode() is used to obtain a unique int value for an object instance\
    \ based on its state. Here, using val is fine, because it is also an int value.\n\
    \nNote that Equals() uses an object type parameter. You need to use this signature\
    \ or you will be overloading this method, rather than overriding it, and the default\
    \ implementation will still be accessible to users of the class. Instead, you\
    \ must use casting to get the required result. It is often worth checking the\
    \ object type using the is operator discussed earlier, in code such as this:\n\
    \n```\npublic override bool Equals(object op1)\n{\n    if (op1 is AddClass1)\n\
    \    {\n        return val == ((AddClass1)op1).val;\n    }\n    else\n    {\n\
    \        throw new ArgumentException(\n            \"Cannot compare AddClass1\
    \ objects with objects of type \"\n            + op1.GetType().ToString());\n\
    \    }\n}\n```\n\nIn this code, an exception is thrown if the operand passed to\
    \ Equals is of the wrong type or cannot be converted into the correct type. Of\
    \ course, this behavior might not be what you want. You might want to be able\
    \ to compare objects of one type with objects of another type, in which case more\
    \ branching would be necessary. Alternatively, you might want to restrict comparisons\
    \ to those in which both objects are of exactly the same type, which would require\
    \ the following change to the first if statement:\n\n```\nif (op1.GetType() ==\
    \ typeof(AddClass1))\n```\n\n# Adding Operator Overloads to CardLib\n\nNow you'll\
    \ upgrade your Ch11CardLib project again, adding operator overloading to the Card\
    \ class. Again, you can find the code for the classes that follow in the Ch11CardLib\
