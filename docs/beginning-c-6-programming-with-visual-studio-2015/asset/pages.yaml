- pgno: 293
  md: "One other difference between collections based on DictionaryBase and collections\
    \ based on CollectionBase is that foreach works slightly differently. The collection\
    \ from the last section allowed you to extract Animal objects directly from the\
    \ collection. Using foreach with the DictionaryBase derived class gives you DictionaryEntry\
    \ structs, another type defined in the System.Collections namespace. To get to\
    \ the Animal objects themselves, you must use the Value member of this struct,\
    \ or you can use the Key member of the struct to get the associated key. To get\
    \ code equivalent to the earlier\n\n```\n```\nforeach (Animal myAnimal in animalCollection)\n\
    {\n    WriteLine($\"New {myAnimal.ToString()} object added to custom \" +\n  \
    \      $\"collection, Name = {myAnimal.Name}\");\n}\n```\n```\n\nyou need the\
    \ following:\n\n```\n```\nforeach (DictionaryEntry myEntry in animalCollection)\n\
    {\n    WriteLine($\"New {myEntry.Value.ToString()} object added to \" +\n    \
    \    $\"custom collection, Name = {{(Animal)myEntry.Value).Name}}\");\n}\n```\n\
    ```\n\nIt is possible to override this behavior so that you can access Animal\
    \ objects directly through foreach. There are several ways to do this, the simplest\
    \ being to implement an iterator.\n\n# Iterators\n\nEarlier in this chapter, you\
    \ saw that the IEnumerable interface enables you to use foreach loops. It's often\
    \ beneficial to use your classes in foreach loops, not just collection classes\
    \ such as those shown in previous sections.\n\nHowever, overriding this behavior,\
    \ or providing your own custom implementation of it, is not always simple. To\
    \ illustrate this, it's necessary to take a detailed look at foreach loops. The\
    \ following steps show what actually happens in a foreach loop iterating through\
    \ a collection called collectionObject:\n\n+   1. collectionObject.GetEnumerator()\
    \ is called, which returns an IEnumerator reference. This method is available\
    \ through implementation of the IEnumerable interface, although this is optional.\n\
    +   2. The MoveNext() method of the returned IEnumerator interface is called.\n\
    +   3. If MoveNext() returns true, then the Current property of the IEnumerator\
    \ interface is used to get a reference to an object, which is used in the foreach\
    \ loop.\n+   4. The preceding two steps repeat until MoveNext() returns false,\
    \ at which point the loop terminates.\n\nTo enable this behavior in your classes,\
    \ you must override several methods, keep track of indices, maintain the Current\
    \ property, and so on. This can be a lot of work to achieve very little."
  merge: -1
  img_proc: true
- pgno: 294
  md: "A simpler alternative is to use an iterator. Effectively, using iterators generates\
    \ a lot of the code for you behind the scenes and hooks it all up correctly. Moreover,\
    \ the syntax for using iterators is much easier to get a grip on.\n\nA good definition\
    \ of an iterator is a block of code that supplies all the values to be used in\
    \ a foreach block in sequence. Typically, this block of code is a method, although\
    \ you can also use property accessors and other blocks of code as iterators. To\
    \ keep things simple, you'll just look at methods here.\n\nWhatever the block\
    \ of code is, its return type is restricted. Perhaps contrary to expectations,\
    \ this return type isn't the same as the type of object being enumerated. For\
    \ example, in a class that represents a collection of Animal objects, the return\
    \ type of the iterator block can't be Animal. Two possible return types are the\
    \ interface types mentioned earlier, IEnumerable or IEnumerator. You use these\
    \ types as follows:\n\n+   - To iterate over a class, use a method called `GetEnumerator()`\
    \ with a return type of `IEnumerator`.\n+   - To iterate over a class member,\
    \ such as a method, use `IEnumerable`.\n\nWithin an iterator block, you select\
    \ the values to be used in the foreach loop by using the yield keyword. The syntax\
    \ for doing this is as follows:\n\n```\nyield return <value>;\n```\n\nThat information\
    \ is all you need to build a very simple example, as follows (you can find this\
    \ code in SimpleIterators\\Program.cs):\n\n```\npublic static IEnumerable SimpleList()\n\
    {\n    yield return \"string 1\";\n    yield return \"string 2\";\n    yield return\
    \ \"string 3\";\n}\nstatic void Main(string[] args)\n{\n    foreach (string item\
    \ in SimpleList())\n        WriteLine(item);\n    ReadKey();\n}\n```\n\nHere,\
    \ the static method SimpleList() is the iterator block. Because it is a method,\
