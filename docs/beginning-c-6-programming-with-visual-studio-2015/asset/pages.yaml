- pgno: 602
  md: 'Like the Read() method, the Write() method has three parameters: a byte array
    containing the data to write to the file stream, the index in the array to start
    writing from, and the number of bytes to write.


    # The StreamWriter Object


    Working with arrays of bytes is not most people''s idea of fun — having worked
    with the FileStream object, you might be wondering whether there is an easier
    way. Fear not, for once you have a FileStream object, you will usually create
    a StreamWriter or StreamReader and use its methods to manipulate the file. If
    you don''t need the capability to change the file pointer to any arbitrary position,
    these classes make working with files much easier.


    The StreamWriter class enables you to write characters and strings to a file,
    with the class handling the underlying conversions and writing to the FileStream
    object for you.


    There are many ways to create a StreamWriter object. If you already have a FileStream
    object, then you can use it to create a StreamWriter:


    ```

    ```

    FileStream aFile = new FileStream("Log.txt", FileMode.CreateNew);

    StreamWriter sw = new StreamWriter(aFile);

    ```

    ```


    A StreamWriter object can also be created directly from a file:


    ```

    ```

    StreamWriter sw = new StreamWriter("Log.txt", true);

    ```

    ```


    This constructor takes the filename and a Boolean value that specifies whether
    to append to the file or create a new one:


    +   - If this is set to false, then a new file is created or the existing file
    is truncated and then opened.

    +   - If it is set to true, then the file is opened and the data is retained.
    If there is no file, then a new one is created.


    Unlike creating a FileStream object, creating a StreamWriter does not provide
    you with a similar range of options — other than the Boolean value to append or
    create a new file, you have no option for specifying the FileMode property as
    you did with the FileStream class. Nor do you have an option to set the FileAccess
    property, so you will always have read/write privileges to the file. To use any
    of the advanced parameters, you must first specify them in the FileStream constructor
    and then create a StreamWriter from the FileStream object, as you do in the following
    Try It Out.


    # TRY IT OUT  Writing Data to an Output Stream: StreamWrite\Program.cs


    +   1. Create a new console application called StreamWrite and save it in the
    directory C:\BegVCSharp\Chapter18.

    +   2. You will be using the System.IO namespace again, so add the following using
    directives near the top of the Program.cs file:


    ```

    ```

    using System;

    using System.Collections.Generic;

    ```

    ```'
