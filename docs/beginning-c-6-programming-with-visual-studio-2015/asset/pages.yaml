- pgno: 145
  md: "Second, you must use an initialized variable. C# doesn't allow you to assume\
    \ that a ref parameter will be initialized in the function that uses it. The following\
    \ code is also illegal:\n\n```\nint myNumber;\nShowDouble(ref myNumber);\nWriteLine(\"\
    myNumber = {myNumber}\");\n```\n\n# Out Parameters\n\nIn addition to passing values\
    \ by reference, you can specify that a given parameter is an out parameter by\
    \ using the out keyword, which is used in the same way as the ref keyword (as\
    \ a modifier to the parameter in the function definition and in the function call).\
    \ In effect, this gives you almost exactly the same behavior as a reference parameter,\
    \ in that the value of the parameter at the end of the function execution is returned\
    \ to the variable used in the function call. However, there are important differences:\n\
    \n+   - Whereas it is illegal to use an unassigned variable as a ref parameter,\
    \ you can use an unassigned variable as an out parameter.\n+   - An out parameter\
    \ must be treated as an unassigned value by the function that uses it.\n\nThis\
    \ means that while it is permissible in calling code to use an assigned variable\
    \ as an out parameter, the value stored in this variable is lost when the function\
    \ executes.\n\nAs an example, consider an extension to the MaxValue() function\
    \ shown earlier, which returns the maximum value of an array. Modify the function\
    \ slightly so that you obtain the index of the element with the maximum value\
    \ within the array. To keep things simple, obtain just the index of the first\
    \ occurrence of this value when there are multiple elements with the maximum value.\
    \ To do this, you add an out parameter by modifying the function as follows:\n\
    \n```\nstatic int MaxValue(int[] intArray, out int maxIndex)\n{\n    int maxVal\
    \ = intArray[0];\n    maxIndex = 0;\n    for (int i = 1; i < intArray.Length;\
    \ i++)\n    {\n        if (intArray[i] > maxVal)\n        {\n            maxVal\
    \ = intArray[i];\n            maxIndex = i;\n        }\n    }\n    return maxVal;\n\
    }\n```\n\nYou might use the function like this:\n\n```\nint[] myArray = { 1, 8,\
    \ 3, 6, 2, 5, 9, 3, 0, 2 };\nint maxIndex;\nWriteLine($\"The maximum value in\
    \ myArray is {MaxValue(myArray, out maxIndex)}\");\nWriteLine($\"The first occurrence\
    \ of this value is at element {maxIndex + 1}\");\n```"
  merge: -1
