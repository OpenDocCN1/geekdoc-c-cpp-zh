- pgno: 165
  md: 'These commands function in almost exactly the same way, with one key difference
    — the first command works in debug builds only; the latter works for release builds
    as well. In fact, the Debug.WriteLine() command won''t even be compiled into a
    release build; it just disappears, which certainly has its advantages (the compiled
    code will be smaller, for one thing).


    > NOTE Both Debug.WriteLine() and Trace.WriteLine() methods are contained within
    the System.Diagnostics namespace. The using static directive can only be used
    with static classes, for example System.Console which includes the WriteLine()
    method.


    These functions don''t work exactly like WriteLine(). They work with only a single
    string parameter for the message to output, rather than letting you insert variable
    values using {x} syntax. This means you must use an alternative technique to embed
    variable values in strings — for example, the + concatenation operator. You can
    also (optionally) supply a second string parameter, which displays a category
    for the output text. This enables you to see at a glance which output messages
    are displayed in the Output window, which is useful when similar messages are
    output from different places in the application.


    The general output of these functions is as follows:


    ```

    <category>: <message>

    ```


    For example, the following statement, which has "MyFunc" as the optional category
    parameter,


    ```

    Debug.WriteLine("Added 1 to i", "MyFunc");

    ```


    would result in the following:


    ```

    MyFunc: Added 1 to i

    ```


    The next Try It Out demonstrates outputting debugging information in this way.


