  md: "Only one base class is permitted in C# class definitions; and if you inherit\
    \ from an abstract class, you must implement all the abstract members inherited\
    \ (unless the derived class is also abstract).\n\nThe compiler does not allow\
    \ a derived class to be more accessible than its base class. This means that an\
    \ internal class can inherit from a public base, but a public class can't inherit\
    \ from an internal base. This code is legal:\n\n```\npublic class MyBase\n{\n\
    \    // Class members.\n}\ninternal class MyClass : MyBase\n{\n    // Class members.\n\
    }\n```\n\nThe following code won't compile:\n\n```\ninternal class MyBase\n{\n\
    \    // Class members.\n}\npublic class MyClass : MyBase\n{\n    // Class members.\n\
    }\n```\n\nIf no base class is used, the class inherits only from the base class\
    \ System.Object (which has the alias object in C#). Ultimately, all classes have\
    \ System.Object at the root of their inheritance hierarchy. You will take a closer\
    \ look at this fundamental class a little later.\n\nIn addition to specifying\
    \ base classes in this way, you can also specify interfaces supported after the\
    \ colon character. If a base class is specified, it must be the first thing after\
    \ the colon, with interfaces specified afterward. If no base class is specified,\
    \ you specify the interfaces immediately after the colon. Commas must be used\
    \ to separate the base class name (if there is one) and the interface names from\
    \ one another.\n\nFor example, you could add an interface to MyClass as follows:\n\
    \n```\npublic class MyClass : IMyInterface\n{\n    // Class members.\n}\n```\n\
    \nAll interface members must be implemented in any class that supports the interface,\
    \ although you can provide an \"empty\" implementation (with no functional code)\
    \ if you don't want to do anything with a given interface member, and you can\
    \ implement interface members as abstract in abstract classes.\n\nThe following\
    \ declaration is invalid because the base class MyBase isn't the first entry in\
    \ the inheritance list:\n\n```\npublic class MyClass : IMyInterface, MyBase\n\
    {\n    // Class members.\n}\n```"
  merge: -1
