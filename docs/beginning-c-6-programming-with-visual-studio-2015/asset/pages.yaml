- pgno: 110
  md: "# Explicit Conversions Using the Convert Commands\n\nThe type of explicit conversion\
    \ you have been using in many of the Try It Out examples in this book is a bit\
    \ different from those you have seen so far in this chapter. You have been converting\
    \ string values into numbers using commands such as `ToDouble()`, which is obviously\
    \ something that won’t work for every possible string.\n\nIf, for example, you\
    \ try to convert a string like Number into a double value using `ToDouble()`,\
    \ you will see the dialog box shown in Figure 5-3 when you execute the code.\n\
    \n![](img/cf72ea860016d2d680fc085fc06f265a_110_0.png)\n\nFIGURE 5-3\n\nAs you\
    \ can see, the operation fails. For this type of conversion to work, the string\
    \ supplied *must* be a valid representation of a number, and that number must\
    \ be one that won’t cause an overflow.\n\nA valid representation of a number is\
    \ one that contains an optional sign (that is, plus or minus), zero or more digits,\
    \ an optional period followed by one or more digits, and an optional \"e\" or\
    \ \"E\" followed by an optional sign, one or more digits, and nothing else except\
    \ spaces (before or after this sequence). Using all of these optional extras,\
    \ you can recognize strings as complex as -1.2451e-24 as being a number.\n\nThe\
    \ important thing to note about these conversions is that they are *always* overflow-checked,\
    \ and the `checked` and `unchecked` keywords and project property settings have\
    \ no effect.\n\nThe next Try It Out is an example that covers many of the conversion\
    \ types from this section. It declares and initializes a number of variables of\
    \ different types and then converts between them implicitly and explicitly.\n\n\
    # TRY IT OUT  Type Conversions in Practice: Ch05Ex01\\Program.cs\n\n+   1. Create\
    \ a new console application called Ch05Ex01 and save it in the directory C:\\\
    BegVCSharp\\Chapter05.\n+   2. Add the following code to Program.cs:\n\n```\n\
    static void Main(string[] args)\n{\n    short shortResult, shortVal = 4;\n```"
  merge: -1
