  md: '+   - If a `catch` block exists but there is no match, then a check is made
    for other `catch` blocks.

    +   - If a `catch` block matches the exception type and there is an exception
    filter that results in `true`, the code within it executes and then the `finally`
    block is executed (if it is present).

    +   - If a `catch` block matches the exception type and there is no exception
    filter, the code it contains executes, and then the `finally` block executes if
    it is present.

    +   - If no `catch` blocks match the exception type, then the `finally` block
    of code executes if it is present.


    ![](img/cf72ea860016d2d680fc085fc06f265a_182_0.png)


    # FIGURE 7-18


    > **NOTE** If two `catch` blocks exist that handle the same exception type, only
    the code within the `catch` block with an exception filter resulting in `true`
    is executed. If a `catch` block also exists handling the same exception type with
    no filter exception or a filter exception resulting in `false`, it is disregarded.
    Only one `catch` block code is executed and ordering of the `catch` block does
    not affect the execution flow.'
  merge: -1
  img_proc: true
