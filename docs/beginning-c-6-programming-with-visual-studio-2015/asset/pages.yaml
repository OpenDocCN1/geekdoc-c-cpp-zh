- pgno: 547
  md: '> **NOTE** These patterns cover some advanced C# coding techniques and therefore
    only descriptions of the patterns are provided. If you are interested in seeing
    the actual C# code to implement the patterns, they certainly exist and can be
    found by searching for them on the Internet.


    Resiliency refers to how well your program responds and recovers from service
    faults and exceptions. Historically, IT infrastructures have been focused on failure
    prevention where the acceptability of downtime was minimal and 99.99% or 99.999%
    SLAs (service-level agreements) were the expectation. Running a program in the
    cloud, however, requires a reliability mind shift, one which embraces failure
    and is clearly oriented toward recovery and not prevention. Having multiple dependencies
    such as database, storage, network, and third-party services, some of which have
    no SLA, requires this shift in perspectives. User-friendly reactions in response
    to outages or situations that are not considered normal operation make your cloud
    program resilient. Here are a few cloud programming patterns that are useful for
    embedding resiliency into your cloud program:


    +   - **Circuit Breaker pattern** — This is a code design that is aware of the
    state of remote services and will only attempt to make the connection if the service
    is available. This avoids attempting a request and wasting CPU cycles when it
    is already known the remote service is unavailable via previous failures.

    +   - **Health Endpoint Monitoring pattern** — This checks that cloud-based applications
    are functionally available via the implementation of endpoint monitoring.

    +   - **Retry pattern** — This retries the request after transient exceptions
    or failure. This pattern retries a number of times within a given timeframe and
    stops when the retry attempt threshold is breached.

    +   - **Throttling pattern** — This manages the consumption of a cloud program
    so that SLAs can be met and the program remains functional under high load.


    Using one or more of the patterns described in this section will help make your
    cloud migration more successful. The discussed patterns enhance usability of your
    program by improving the scalability and resiliency of it. This in turn makes
    for a more pleasant user or customer experience.


    # USING MICROSOFT AZURE C# LIBRARIES TO CREATE A STORAGE CONTAINER


    Although there are numerous cloud providers, the cloud provider used for the examples
    in this and the next chapter is Microsoft. The cloud platform provided by Microsoft
    is called Azure. Azure has many different kinds of features. For example, the
    IaaS offering is called Azure VM, and the PaaS offering is called Azure Cloud
    Services. Additionally, Microsoft has SQL Azure for database, Azure Active Directory
    for user authentication, and Azure Storage for storing blobs, for example.


    > **NOTE** Exercise 1 requires that you have a Microsoft Azure subscription. If
    you do not have one, you can sign up for a free trial here: http://azure.microsoft.com.'
