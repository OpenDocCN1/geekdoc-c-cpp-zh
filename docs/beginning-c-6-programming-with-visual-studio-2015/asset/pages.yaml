- pgno: 546
  md: 'cloud program can run alongside any other cloud program as it contains the
    dependencies within the binaries package itself. Finally, by using an open source
    version of C# named Mono, the cloud program and be packaged, compiled, and deployed
    onto operating systems that are not Microsoft, for example Mac OS X, Linux, or
    UNIX.


    # CLOUD PATTERNS AND BEST PRACTICES


    In the cloud, very brief moments of increased latency or downtime are expected
    and your code must be prepared for this and include logic to successfully recover
    from these platform exceptions. This is a significant mind shift if you have historically
    been coding for onsite or on premise program executions. You need to unlearn a
    lot of what you know about managing exceptions and learn to embrace failure and
    create your code to recover from such failures.


    In the previous section words like portability, scalability, and resiliency were
    touched upon in the context of integrating those concepts into your program slated
    to run in the cloud. But what does portability specifically mean here? A program
    is portable if it can be moved or executed on multiple platforms, for example
    Windows, Linux, and Mac OS X. Take for example some ASP.NET 4.6 features that
    sit on a new stack of open source technologies that provide the developer with
    options to compile code into binaries capable of running on any of those platforms.
    Traditionally, a developer who wrote a program using ASP.NET, with C# in the background,
    would run it on a Windows server using Internet Information Server (IIS). However,
    from a core cloud-centric perspective, the ability of your program and all its
    dependencies to move from one virtual machine to another, without manual or programmatic
    intervention, is the most applicable form of portability in this context. Remember
    that failures in the cloud are expected, and the virtual machine (VM) on which
    your program is running can be wiped out at any given time and then be rebuilt
    fresh on another VM. Therefore, your program needs to be portable and able to
    recover from such an event.


    Scalability means that your code responds well when multiple customers use it.
    For example, if you have 1,500 requests per minute, that would be roughly 25 concurrent
    requests per second, if the request is completed and responded to in 1 second.
    However, if you have 15,000 request per minute, that would mean 250 concurrent
    requests per second. Will the cloud program respond in the same manner with 25
    or 250 concurrent requests? How about 2,550? The following are a few cloud programming
    patterns that are useful for managing scalability,


    +   - Command and Query Responsibility Segregation (CQRS) pattern — This pattern
    concerns the separation of operations that read data from operations that modify
    or update the data.

    +   - Materialized View pattern — This modifies the storage structure to reflect
    the data query pattern. For example, creating views for specific highly used queries
    can make for more efficient querying.

    +   - Sharding pattern — This breaks your data into multiple horizontal shards
    that contain a distinct subset of the data as opposed to vertical scaling via
    the addition of hardware capacity.

    +   - Valet Key pattern — This gives clients direct access to the data store for
    streaming of or uploading of large files. Instead of having a web client manage
    the gatekeeping to the data store, it provides a client with a Valet Key and direct
    access to the data store.'
  merge: -1
