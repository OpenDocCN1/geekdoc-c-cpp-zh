- pgno: 246
  md: "```\nclass MyClass\n{\n    public static int MyInt;\n}\n```\n\nStatic fields\
    \ are accessed via the class that defines them (MyClass.MyInt in the preceding\
    \ example), not through object instances of that class. You can use the keyword\
    \ const to create a constant value. const members are static by definition, so\
    \ you don't need to use the static modifier (in fact, it is an error to do so).\n\
    \n# Defining Methods\n\nMethods use standard function format, along with accessibility\
    \ and optional static modifiers, as shown in this example:\n\n```\nclass MyClass\n\
    {\n    public string GetString() => return \"Here is a string.\";\n}\n```\n\n\
    > NOTE Like public fields, public methods in the .NET Framework are named using\
    \ PascalCasing.\n\nRemember that if you use the static keyword, then this method\
    \ is accessible only through the class, not the object instance. You can also\
    \ use the following keywords with method definitions:\n\n+   - virtual — The method\
    \ can be overridden.\n+   - abstract — The method must be overridden in non-abstract\
    \ derived classes (only permitted in abstract classes).\n+   - override — The\
    \ method overrides a base class method (it must be used if a method is being overridden).\n\
    +   - extern — The method definition is found elsewhere.\n\nHere's an example\
    \ of a method override:\n\n```\npublic class MyBaseClass\n{\n    public virtual\
    \ void DoSomething()\n    {\n        // Base implementation.\n    }\n}\npublic\
    \ class MyDerivedClass : MyBaseClass\n{\n    public override void DoSomething()\n\
    \    {\n        // Derived class implementation, overrides base implementation.\n\
    \    }\n}\n```"
