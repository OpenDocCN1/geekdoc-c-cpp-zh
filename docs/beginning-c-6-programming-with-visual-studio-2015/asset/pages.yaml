  md: 'Because you have used the checked keyword in your explicit conversion, you
    will get an exception in the preceding code, as the val property of op1 is too
    large to fit into the val property of op2.


    # The as Operator


    The as operator converts a type into a specified reference type, using the following
    syntax:


    ```

    <operand> as <type>

    ```


    This is possible only in certain circumstances:


    +   - If <operand> is of type <type>

    +   - If <operand> can be implicitly converted to type <type>

    +   - If <operand> can be boxed into type <type>


    If no conversion from <operand> to <type> is possible, then the result of the
    expression will be null.


    Conversion from a base class to a derived class is possible by using an explicit
    conversion, but it won''t always work. Consider the two classes ClassA and ClassD
    from an earlier example, where ClassD inherits from ClassA:


    ```

    class ClassA : IMyInterface {}

    class ClassD : ClassA {}

    ```


    The following code uses the as operator to convert from a ClassA instance stored
    in obj1 into the ClassD type:


    ```

    ClassA obj1 = new ClassA();

    ClassD obj2 = obj1 as ClassD;

    ```


    This will result in obj2 being null.


    However, it is possible to store ClassD instances in ClassA-type variables by
    using polymorphism. The following code illustrates this, using the as operator
    to convert from a ClassA-type variable containing a ClassD-type instance into
    the ClassD type:


    ```

    ClassD obj1 = new ClassD();

    ClassA obj2 = obj1;

    ClassD obj3 = obj2 as ClassD;

    ```


    This time the result is that obj3 ends up containing a reference to the same object
    as obj1, not null.


    This functionality makes the as operator very useful, because the following code
    (which uses simple casting) results in an exception being thrown:


    ```

    ClassA obj1 = new ClassA();

    ClassD obj2 = (ClassD)obj1;

    ```'
