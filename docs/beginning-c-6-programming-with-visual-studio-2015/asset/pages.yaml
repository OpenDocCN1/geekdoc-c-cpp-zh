    <Button x:Name="rotatedButton" Content="2nd Button" Width="75" Height="22" FontWeight="Bold"
    Margins="218,138,224,159" RenderTransformOrigin="0.5,0.5" >

    <Button.RenderTransform>

    <TransformGroup>

