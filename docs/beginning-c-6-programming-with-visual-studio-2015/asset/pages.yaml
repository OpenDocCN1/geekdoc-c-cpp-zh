- pgno: 304
  md: "As shown in these examples, boxing is performed without your intervention —\
    \ that is, you don’t have to write any code to make it possible. Unboxing a value\
    \ requires an explicit conversion, however, and requires you to make a cast (boxing\
    \ is implicit and doesn’t have this requirement).\n\nYou might be wondering why\
    \ you would actually want to do this. There are two very good reasons why boxing\
    \ is extremely useful. First, it enables you to use value types in collections\
    \ (such as ArrayList) where the items are of type object. Second, it’s the internal\
    \ mechanism that enables you to call object methods on value types, such as ints\
    \ and structs.\n\nIt is worth noting that unboxing is necessary before access\
    \ to the value type contents is possible.\n\n# The is Operator\n\nDespite its\
    \ name, the is operator isn’t a way to determine whether an object is a certain\
    \ type. Instead, the is operator enables you to check whether an object either\
    \ is or can be converted into a given type. If this is the case, then the operator\
    \ evaluates to true.\n\nEarlier examples showed a Cow and a Chicken class, both\
    \ of which inherit from Animal. Using the is operator to compare objects with\
    \ the Animal type will return true for objects of all three of these types, not\
    \ just Animal. This is something you’d have a hard time achieving with the GetType()\
    \ method and typeof() operator shown previously.\n\nThe is operator has the following\
    \ syntax:\n\n```\n<operand> is <type>\n```\n\nThe possible results of this expression\
    \ are as follows:\n\n+   - If <type> is a class type, then the result is true\
    \ if <operand> is of that type, if it inherits from that type, or if it can be\
    \ boxed into that type.\n+   - If <type> is an interface type, then the result\
    \ is true if <operand> is of that type or it is a type that implements the interface.\n\
    +   - If <type> is a value type, then the result is true if <operand> is of that\
    \ type or it is a type that can be unboxed into that type.\n\nThe following Try\
    \ It Out shows how this works in practice.\n\nTRY IT OUT Using the is Operator:\
    \ Ch11Ex04\\Program.cs\n\n+   1. Create a new console application called Ch11Ex04\
    \ in the directory C:\\BegVCSharp\\Chapter11.\n+   2. Modify the code in Program.cs\
    \ as follows:\n\n```\n```csharp\nnamespace Ch11Ex04\n{\n    class Checker\n  \
    \  {\n        public void Check(object param1)\n        {\n            if (param1\
    \ is ClassA)\n                WriteLine(\"Variable can be converted to ClassA.\"\
    );\n            else\n                WriteLine(\"Variable can't be converted\
    \ to ClassA.\");\n        }\n    }\n}\n```\n```"
