  md: "used is a key associated with a stored item, rather than an int index, which\
    \ can make the collection a lot more user-friendly.\n\nAs with indexed collections,\
    \ there is a base class you can use to simplify implementation of the IDictionary\
    \ interface: DictionaryBase. This class also implements IEnumerable and ICollection,\
    \ providing the basic collection-manipulation capabilities that are the same for\
    \ any collection.\n\nDictionaryBase, like CollectionBase, implements some (but\
    \ not all) of the members obtained through its supported interfaces. Like CollectionBase,\
    \ the Clear and Count members are implemented, although RemoveAt() isn't because\
    \ it's a method on the IList interface and doesn't appear on the IDictionary interface.\
    \ IDictionary does, however, have a Remove() method, which is one of the methods\
    \ you should implement in a custom collection class based on DictionaryBase.\n\
    \nThe following code shows an alternative version of the Animals class, this time\
    \ derived from DictionaryBase. Implementations are included for Add(), Remove(),\
    \ and a key-accessed indexer:\n\n```\npublic class Animals : DictionaryBase\n\
    {\n    public void Add(string newID, Animal newAnimal)\n    {\n        Dictionary.Add(newID,\
    \ newAnimal);\n    }\n    public void Remove(string animalID)\n    {\n       \
    \ Dictionary.Remove(animalID);\n    }\n    public Animals() {}\n    public Animal\
    \ this[string animalID]\n    {\n        get { return (Animal)Dictionary[animalID];\
    \ }\n        set { Dictionary[animalID] = value; }\n    }\n}\n```\n\nThe differences\
    \ in these members are as follows:\n\n+   - **Add()** — Takes two parameters,\
    \ a key and a value, to store together. The dictionary collection has a member\
    \ called Dictionary inherited from DictionaryBase, which is an IDictionary interface.\
    \ This interface has its own Add() method, which takes two object parameters.\
    \ Your implementation takes a string value as a key and an Animal object as the\
    \ data to store alongside this key.\n+   - **Remove()** — Takes a key parameter,\
    \ rather than an object reference. The item with the key value specified is removed.\n\
    +   - **Indexer** — Uses a string key value, rather than an index, which is used\
    \ to access the stored item via the Dictionary inherited member. Again, casting\
    \ is necessary here."
