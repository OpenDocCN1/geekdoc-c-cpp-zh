    After you have the root element of the document, you are ready to use the information.
    The XmlElement class contains methods and properties for manipulating the nodes
    and attributes of the tree. Let''s examine the properties for navigating the XML
    elements first, shown in Table 19-2.


    # TABLE 19-2: XmlElement Properties


    | PROPERTY | DESCRIPTION |

    |---|---|

    | FirstChild | Returns the first child element after this one. If you recall the
    books.xml file from earlier in the chapter, the root node of the document was
    called "books" and the next node after that was "book." In that document, then,
    the first child of the root node "books" is "book."


    `<books> Root node`

    `<book> FirstChild`


    FirstChild returns an XmlNode object, and you should test for the type of the
    returned node because it is unlikely to always be an XmlElement instance. In the
    Books example, the child of the Title element is, in fact, an XmlText node that
    represents the text Beginning Visual C# |

    | LastChild | Operates exactly like the FirstChild property except that it returns
    the last child of the current node. In the case of the books example, the last
    child of the "books" node will still be a "book" node, but it will be the node
    representing the "Beginning XML" book.


    `<books> Root node`

    `  <book> FirstChild`

    `    <title>Beginning Visual C# 2015</title>`

    `    <author>Benjamin Perkins et al</author>`

    `    <code>096689</code>`

    `  </book>`

    `  <book> LastChild`

    `    <title>Beginning XML</title>`

    `    <author>Joe Fawcett et al</author>`

    `    <code>162132</code>`

    `  </book>`

    `</books>` |'
