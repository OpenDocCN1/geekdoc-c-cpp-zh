- pgno: 348
  md: "# Modifying CardLib to Use a Generic Collection Class\n\nOne simple modification\
    \ you can make to the CardLib project you've been building over recent chapters\
    \ is to change the Cards collection class to use a generic collection class, thus\
    \ saving many lines of code. The required modification to the class definition\
    \ for Cards is as follows (you can find this code in Ch12CardLib\\Cards.cs):\n\
    \n```\npublic class Cards : List<Card>, ICloneable { ... }\n```\n\nYou can also\
    \ remove all the methods of Cards except Clone(), which is required for ICloneable,\
    \ and CopyTo(), because the version of CopyTo() supplied by List<Card> works with\
    \ an array of Card objects, not a Cards collection. Clone() requires a minor modification\
    \ because the List<T> class does not define a List property to use:\n\n```\npublic\
    \ object Clone()\n{\n    Cards newCards = new Cards();\n    foreach (Card sourceCard\
    \ in this)\n    {\n        newCards.Add((Card)sourceCard.Clone());\n    }\n  \
    \  return newCards;\n}\n```\n\nRather than show the code here for what is a very\
    \ simple modification, the updated version of CardLib, called Ch12CardLib, is\
    \ included in the downloadable code for this chapter, along with the client code\
    \ from the last chapter.\n\n# DEFINING GENERIC TYPES\n\nYou've now learned enough\
    \ about generics to create your own. You've seen plenty of code involving generic\
    \ types and have had plenty of practice using generic syntax. This section looks\
    \ at defining the following:\n\n+   - Generic classes\n+   - Generic interfaces\n\
    +   - Generic methods\n+   - Generic delegates\n\nYou'll also look at the following\
    \ more advanced techniques for dealing with the issues that come up when defining\
    \ generic types:\n\n+   - The default keyword\n+   - Constraining types\n+   -\
    \ Inheriting from generic classes\n+   - Generic operators"
