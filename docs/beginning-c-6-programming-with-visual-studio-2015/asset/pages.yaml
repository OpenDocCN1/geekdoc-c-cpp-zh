- pgno: 428
  md: "The first pair of elements is concatenated into a string using simple syntax.\
    \ This is far from the best way to concatenate strings — ideally you would use\
    \ string.Concat() or string.Format() to optimize performance — but here it provides\
    \ a very simple way to see what is going on. After this first concatenation, the\
    \ result is passed back into the lambda expression along with the third element\
    \ in the array, in much the same way as you saw int values being summed earlier.\
    \ The result is a concatenation of the entire array, with spaces separating entries.\
    \ You can achieve this effect in a simpler way using the string.Join() method,\
    \ but the remainder of the overloads illustrated in this example provide additional\
    \ functionality that string.Join() doesn't.\n\nThe second overload of the Aggregate()\
    \ function, which has the two generic type parameters TSource and TAccumulate,\
    \ is used. In this case the lambda expression must be of the form Func<TAccumulate,\
    \ TSource, TAccumulate>. In addition, a seed value of type TAccumulate must be\
    \ specified. This seed value is used in the first call to the lambda expression,\
    \ along with the first array element. Subsequent calls take the accumulator result\
    \ of previous calls to the expression. The code used is as follows:\n\n```\nWriteLine(curries.Aggregate<string,\
    \ int>(\n    0,\n    (a, b) => a + b.Length));\n```\n\nThe accumulator (and, by\
    \ implication, the return value) is of type int. The accumulator value is initially\
    \ set to the seed value of 0, and with each call to the lambda expression it is\
    \ summed with the length of an element in the array. The final result is the sum\
    \ of the lengths of each element in the array.\n\nNext you come to the last overload\
    \ of Aggregate(). This takes three generic type parameters and differs from the\
    \ previous version only in that the return value can be a different type from\
    \ both the type of the elements in the array and the accumulator value. First,\
    \ this overload is used to concatenate the string elements with a seed string:\n\
    \n```\nWriteLine(curries.Aggregate<string, string, string>(\n    \"Some curries:\"\
    ,\n    (a, b) => a + \" \" + b,\n    a => a));\n```\n\nThe final parameter of\
    \ this method, resultSelector, must be specified even if (as in this example)\
    \ the accumulator value is simply copied to the result. This parameter is a lambda\
    \ expression of type Func<TAccumulate, TResult>.\n\nIn the final section of code,\
    \ the same version of Aggregate() is used again, but this time with an int return\
    \ value. Here, resultSelector is supplied with a lambda expression that returns\
    \ the length of the accumulator string:\n\n```\nWriteLine(curries.Aggregate<string,\
    \ string, int>(\n    \"Some curries:\",\n    (a, b) => a + \" \" + b,\n    a =>\
    \ a.Length));\n```\n\nThis example hasn't done anything spectacular, but it demonstrates\
    \ how you can use more complicated extension methods that involve generic type\
    \ parameters, collections, and seemingly complex syntax. You'll see more of this\
    \ later in the book."
