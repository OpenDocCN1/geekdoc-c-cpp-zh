  md: "This code defines one namespace, LevelOne, and a name in this namespace, NameOne\
    \ (no actual code is shown here to keep the discussion general; instead, a comment\
    \ appears where the definition would go). Code written inside the LevelOne namespace\
    \ can simply refer to this name using NameOne — no classification is necessary.\
    \ Code in the global namespace, however, must refer to this name using the classified\
    \ name LevelOne.NameOne.\n\nNote one more important point here: The using statement\
    \ doesn't in itself give you access to names in another namespace. Unless the\
    \ code in a namespace is in some way linked to your project, by being defined\
    \ in a source file in the project or being defined in some other code linked to\
    \ the project, you won't have access to the names contained in it. In addition,\
    \ if code containing a namespace is linked to your project, then you have access\
    \ to the names contained in that code, regardless of whether you use using. using\
    \ simply makes it easier for you to access these names, and it can shorten otherwise\
    \ lengthy code to make it more readable.\n\nGoing back to the code in ConsoleApplication1\
    \ shown at the beginning of this chapter, the following lines that apply to namespaces\
    \ appear:\n\n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\nnamespace ConsoleApplication1\n\
    {\n    ...\n}\n```\n\nThe five lines that start with the using keyword are used\
    \ to declare that the System, System.Collections.Generic, System.Linq, System.Text,\
    \ and System.Threading.Tasks namespaces will be used in this C# code and should\
    \ be accessible from all namespaces in this file without classification. The System\
    \ namespace is the root namespace for .NET Framework applications and contains\
    \ all the basic functionality you need for console applications. The other four\
    \ namespaces are very often used in console applications, so they are there just\
