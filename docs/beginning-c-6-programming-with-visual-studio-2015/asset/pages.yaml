- pgno: 721
  md: '# Service Contracts


    Service contracts are defined by applying the System.ServiceModel.ServiceContractAttribute
    attribute to an interface definition. You can customize the service contract with
    the properties shown in Table 22-5.


    TABLE 22-5: ServiceContractAttribute Properties


    | PROPERTY | DESCRIPTION |

    |---|---|

    | Name | Specifies the name of the service contract as defined in the <portType>
    element in WSDL. |

    | Namespace | Defines the namespace of the service contract used by the <portType>
    element in WSDL. |

    | ConfigurationName | The name of the service contract as used in the configuration
    file. |

    | HasProtectionLevel | Determines whether messages used by the service have explicitly
    defined protection levels. Protection levels enable you to sign, or sign and encrypt,
    messages. |

    | ProtectionLevel | The protection level to use for message protection. |

    | SessionMode | Determines whether sessions are enabled for messages. If you use
    sessions, then you can ensure that messages sent to different endpoints of a service
    are correlated — that is, they use the same service instance and so can share
    state, and so on. |

    | CallbackContract | For duplex messaging the client exposes a contract as well
    as the service. This is because, as discussed earlier, the client in duplex communications
    also acts as a server. This property enables you to specify which contract the
    client uses. |


    # Operation Contracts


    Within interfaces that define service contracts, you define members as operations
    by applying the System.ServiceModel.OperationContractAttribute attribute. This
    attribute has the properties described in Table 22-6.


    TABLE 22-6: OperationContractAttribute Properties


    | Property | Description |

    |---|---|

    | Name | Specifies the name of the service operation. The default is the member
    name. |

    | IsOneWay | Specifies whether the operation returns a response. If you set this
    to true, then clients won''t wait for the operation to complete before continuing.
    |'
  merge: -1
  img_proc: true
- pgno: 722
  md: '| Property | Description |

    |---|---|

    | AsyncPattern | If set to true, the operation is implemented as two methods that
    you can use to call the operation asynchronously: Begin<methodName>() and End<methodName>().
    |

    | HasProtectionLevel | See the previous section. |

    | ProtectionLevel | See the previous section. |

    | IsInitiating | If sessions are used, then this property determines whether calling
    this operation can start a new session. |

    | IsTerminating | If sessions are used, then this property determines whether
    calling this operation terminates the current session. |

    | Action | If you are using addressing (an advanced capability of WCF services),
    then an operation has an associated action name, which you can specify with this
    property. |

    | ReplyAction | As with Action, but specifies the action name for the operation
    response. |


    > **NOTE** In the .NET 4.5 Framework, when you add a service reference, Visual
    Studio also generates asynchronous proxy methods to call the service, regardless
    of whether AsyncPattern is set to true. These methods, which have the suffix Async,
    use the new asynchronous techniques that are included in .NET 4.5, and are asynchronous
    only from the point of view of the calling code. Internally, they call the synchronous
    WCF operations.


    # Message Contracts


    The earlier example didn''t use message contract specifications. If you use these,
    then you do so by defining a class that represents the message and applying the
    MessageContractAttribute attribute to the class. You then apply MessageBodyMemberAttribute,
    MessageHeaderAttribute, or MessageHeaderArrayAttribute attributes to members of
    this class. All these attributes are in the System.ServiceModel namespace. You
    are unlikely to want to do this unless you need a very high degree of control
    over the SOAP messages used by WCF services, so details are not provided here.


    # Fault Contracts


    If you have a particular exception type — for example, a custom exception — that
    you want to make available to client applications, then you can apply the System.ServiceModel.FaultContractAttribute
    attribute to the operation that might generate this exception.'
  merge: -1
  img_proc: true
