  md: "Here, the ReadKey() method of the Console class has been selected. (Console\
    \ is found in the System namespace in the mscorlib assembly.) The information\
    \ window in the bottom-right corner shows you the method signature, the class\
    \ to which the method belongs, and a summary of the method function. This information\
    \ can be useful when you are exploring the .NET types, or if you are just refreshing\
    \ your memory about what a particular class can do.\n\nAdditionally, you can make\
    \ use of this information window in types that you create. Make the following\
    \ change to the code created previously in Ch09Ex01:\n\n```\n/// <summary>\n///\
    \ This class contains my program!\n/// </summary>\nclass Program\n{\n    static\
    \ void Main(string[] args)\n    {\n        MyComplexClass myObj = new MyComplexClass();\n\
    \        WriteLine(myObj.ToString());\n        ReadKey();\n    }\n}\n```\n\nReturn\
    \ to the Object Browser. The change is reflected in the information window. This\
    \ is an example of XML documentation, a subject not covered in this book but well\
    \ worth learning about when you have a spare moment.\n\n**NOTE** If you made this\
    \ code change manually, then you noticed that simply typing the three slashes\
    \ (///) causes the IDE to add most of the rest of the code for you. It automatically\
    \ analyzes the code to which you are applying XML documentation and builds the\
    \ basic XML documentation — more evidence, should you need any, that Visual Studio\
    \ is a great tool to work with!\n\n# Adding Classes\n\nVisual Studio contains\
    \ tools that can speed up some common tasks, and some of these are applicable\
