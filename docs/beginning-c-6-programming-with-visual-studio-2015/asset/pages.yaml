- pgno: 502
  md: '# Animations


    Animations are created by using storyboards. The absolute best way to define animations
    is, without a doubt, to use a designer such as Expression Blend. However, you
    can also define them by editing XAML code directly, and by implication from code-behind
    (as XAML is simply a way to build a WPF object model).


    A storyboard is defined using a Storyboard object, which contains one or more
    timelines. You can define timelines by using key frames or by using one of several
    simpler objects that encapsulate entire animations. Complex storyboards may even
    contain nested storyboards.


    A Storyboard is contained in a resource dictionary, so you must identify it with
    an x:Key property.


    Within the timeline of a storyboard, you can animate properties of any element
    in your application that is of type double, Point, or Color. This covers most
    of the things that you may want to change, so it''s quite flexible. There are
    some things that you can''t do, such as replace one brush with another, but there
    are ways to achieve pretty much any effect you can imagine given these three types.


    Each of these three types has two associated timeline controls that you can use
    as children of Storyboard. These six controls are DoubleAnimation, DoubleAnimationUsingKeyFrames,
    PointAnimation, PointAnimationUsingKeyFrames, ColorAnimation, and ColorAnimationUsingKeyFrames.
    Every timeline control can be associated with a specific property of a specific
    control by using the attached properties Storyboard.TargetName and Storyboard.TargetProperty.
    For example, you would set these properties to MyRectangle and Width if you wanted
    to animate the Width property of a Rectangle control with a Name property of MyRectangle.
    You would use either DoubleAnimation or DoubleAnimationUsingKeyFrames to animate
    this property. You will see examples of using storyboards as this chapter progresses.


    Next, you''ll look at the simple, animation timelines without key frames, and
    then move on to look at the timelines that use key frames.


    # Timelines without Key Frames


    The timelines without key frames are DoubleAnimation, PointAnimation, and ColorAnimation.
    These timelines have identical property names, although the types of these properties
    vary according to the type of the timeline (note that all duration properties
    are specified in the form [days.] hours:minutes:seconds in XAML code). Table 15-2
    describes these properties.


    TABLE 15-2: The Timeline Properties


    | PROPERTY | DESCRIPTION |

    |---|---|

    | Name | The name of the timeline, so that you can refer to it from other places.
    |

    | BeginTime | How long after the storyboard is triggered before the timeline starts.
    |

    | Duration | How long the timeline lasts. |'
  merge: -1
