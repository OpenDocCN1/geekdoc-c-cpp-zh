- pgno: 427
  md: "assigned to the variable result will be the int value 11 — the summation of\
    \ all the elements in the array.\n\nThe other two overloads of the Aggregate()\
    \ extension method are similar, but enable you to perform slightly more complicated\
    \ processing. This is illustrated in the following short Try It Out.\n\n# TRY\
    \ IT OUT Using Lambda Expressions with Collections: Ch13Ex09\\Program.cs\n\n+\
    \   1. Create a new console application called Ch13Ex09 and save it in the directory\
    \ C:\\BegVCSharp\\Chapter13.\n+   2. Modify the code in Program.cs as follows:\n\
    +   3. Run the application. The result is shown in Figure 13-21.\n\n```\n```csharp\n\
    static void Main(string[] args)\n{\n    string[] curries = { \"pathia\", \"jalfrezi\"\
    , \"korma\" };\n    WriteLine(curries.Aggregate(\n        (a, b) => a + \" \"\
    \ + b));\n    WriteLine(curries.Aggregate<string, int>(\n        0,\n        (a,\
    \ b) => a + b.Length));\n    WriteLine(curries.Aggregate<string, string, string>(\n\
    \        \"Some curries: \",\n        (a, b) => a + \" \" + b,\n        a => a));\n\
    \    WriteLine(curries.Aggregate<string, string, int>(\n        \"Some curries:\
    \ \",\n        (a, b) => a + \" \" + b,\n        a => a.Length));\n    ReadKey();\n\
    }\n```\n```\n\n![](img/cf72ea860016d2d680fc085fc06f265a_427_0.png)\n\n# How It\
    \ Works\n\nIn this example you experimented with each of the overloads of the\
    \ Aggregate() extension method, using a string array with three elements as source\
    \ data.\n\nFirst, a simple concatenation is performed:\n\n```\n```\nWriteLine(curries.Aggregate((a,\
    \ b) => a + \" \" + b));\n```\n```"
