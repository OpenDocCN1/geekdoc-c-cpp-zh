    \ use void type event handlers, and avoid out type parameters (which would lead\
    \ to the same ambiguity regarding the source of the value returned by the parameter).\n\
    \n# Anonymous Methods\n\nInstead of defining event handler methods, you can choose\
    \ to use anonymous methods. An anonymous method doesn't actually exist as a method\
    \ in the traditional sense — that is, it isn't a method on any particular class.\
    \ Instead, an anonymous method is created purely for use as a target for a delegate.\n\
    \nTo create an anonymous method, you need the following code:\n\n```\n```\ndelegate(parameters)\n\
    {\n    // Anonymous method code.\n};\n```\n```\n\nparameters is a list of parameters\
    \ matching those of the delegate type you are instantiating, as used by the anonymous\
    \ method code:\n\n```\n```\ndelegate(Connection source, MessageArrivedEventArgs\
    \ e)\n{\n    // Anonymous method code matching MessageHandler event in Ch13Ex03.\n\
    };\n```\n```\n\nFor example, you could use this code to completely bypass the\
    \ Display.DisplayMessage() method in Ch13Ex03:\n\n```\n```\nmyConnection1.MessageArrived\
    \ +=\n    delegate(Connection source, MessageArrivedEventArgs e)\n    {\n    \
    \    WriteLine($\"Message arrived from: {source.Name}\");\n        WriteLine($\"\
    Message Text: {e.Message}\");\n    };\n```\n```\n\nAn interesting point about\
    \ anonymous methods is that they are effectively local to the code block that\
    \ contains them, and they have access to local variables in this scope. If you\
    \ use such a variable, then it becomes an outer variable. Outer variables are\
    \ not disposed of when they go out of scope as other local variables are; instead,\
    \ they live on until the anonymous methods that use them are destroyed. This might\
    \ be some time later than you expect, so it's definitely something to be careful\
    \ about. If an outer variable takes up a large amount of memory, or if it uses\
    \ resources that are expensive in other ways (for example, resources that are\
    \ limited in number), then this could cause memory or performance problems.\n\n\
    # EXPANDING AND USING CARDLIB\n\nNow that you've had a look at defining and using\
