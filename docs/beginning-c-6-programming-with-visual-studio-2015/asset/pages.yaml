- pgno: 344
  md: "One member, Sum(), returns a string listing each vector in turn, along with\
    \ the result of summing them all together (using the overloaded + operator from\
    \ the original Vector class). Because each vector can be thought of as a direction\
    \ and a distance, this effectively constitutes a route with an endpoint:\n\n```\n\
    ```csharp\npublic string Sum()\n{\n    StringBuilder sb = new StringBuilder();\n\
    \    Vector currentPoint = new Vector(0.0, 0.0);\n    sb.Append(\"origin\");\n\
    \    foreach (Vector vector in this)\n    {\n        sb.AppendFormat(\" + {vector}\"\
    );\n        currentPoint += vector;\n    }\n    sb.AppendFormat(\" = {currentPoint}\"\
    );\n    return sb.ToString();\n}\n```\n```\n\nThis method uses the handy StringBuilder\
    \ class, found in the System.Text namespace, to build the response string. This\
    \ class has members such as Append() and AppendFormat() (used here), which make\
    \ it easy to assemble a string — the performance is better than concatenating\
    \ individual strings. You use the ToString() method of this class to obtain the\
    \ resultant string.\n\nYou also create two methods to be used as delegates, as\
    \ static members of VectorDelegates. Compare() is used for comparison (sorting),\
    \ and TopRightQuadrant() for searching. You'll look at these as you review the\
    \ code in Program.cs.\n\nThe code in Main() starts with the initialization of\
    \ a Vectors collection, to which are added several Vector objects (you can find\
    \ this code in Ch12Ex03\\Program.cs):\n\n```\n```csharp\nVectors route = new Vectors();\n\
    route.Add(new Vector(2.0, 90.0));\nroute.Add(new Vector(1.0, 180.0));\nroute.Add(new\
    \ Vector(0.5, 45.0));\nroute.Add(new Vector(2.5, 315.0));\n```\n```\n\nThe Vectors.Sum()\
    \ method is used to write out the items in the collection as noted earlier, this\
    \ time in their initial order:\n\n```\n```csharp\nWriteLine(route.Sum());\n```\n\
    ```\n\nNext, you create the first of your delegates, sorter. This delegate is\
    \ of type Comparison<Vector> and, therefore, can be assigned a method with the\
    \ following return type and parameters:\n\n```\n```csharp\nint method(Vector objectA,\
    \ Vector objectB)\n```\n```\n\nThis matches VectorDelegates.Compare(), which is\
    \ the method you assign to the delegate:\n\n```\n```csharp\nComparison<Vector>\
    \ sorter = new Comparison<Vector>(\n    VectorDelegates.Compare);\n```\n```"
