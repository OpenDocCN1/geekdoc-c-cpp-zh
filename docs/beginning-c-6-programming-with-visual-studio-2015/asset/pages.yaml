- pgno: 643
  md: '# WHAT YOU LEARNED IN THIS CHAPTER


    | TOPIC | KEY CONCEPTS |

    |---|---|

    | XML basics | XML documents are created from an XML declaration, XML namespaces,
    XML elements, and attributes. The XML declaration defines the XML version. XML
    namespaces are used to define vocabularies and XML elements and attributes are
    used to define the XML document content. |

    | JSON basics | JSON is a data language used when transferring JavaScript and
    web services. JSON is more compact than the XML but harder to read. |

    | XML schema | XML schemas are used to define the structure of XML documents.
    Schemas are especially useful when you need to exchange information with third
    parties. By agreeing on a schema for the data that is exchanged, you and the third
    party will be able to check that the documents are valid. |

    | XML DOM | The Document Object Model (XML DOM) is the basis for .NET Framework
    classes provided for creating and manipulating XML. |

    | JSON packages | You can use a JSON package such as Newtonsoft to convert XML
    to JSON and vice versa, and do other manipulations with JSON similar to the .NET
    classes for XML. |

    | XPath | XPath is one of the possible ways to query data in XML documents. To
    use XPath, you must be familiar with the structure of the XML document in order
    to be able to select individual elements from it. Although XPath can be used on
    any well-formed XML document, the fact that you must know the structure of the
    document when you create the query means that ensuring that the document is valid
    also ensures that the query will work from document to document, as long as the
    documents are valid against the same schema. |'
  merge: -1
  img_proc: true
