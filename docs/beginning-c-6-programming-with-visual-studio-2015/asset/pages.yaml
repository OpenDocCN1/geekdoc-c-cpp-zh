- pgno: 299
  md: "```\npublic Cloner(int newVal)\n{\n    MyContent.Val = newVal;\n}\npublic object\
    \ GetCopy() => MemberwiseClone();\n}\n```\n\nIn this case, the shallow copy obtained\
    \ though GetCopy() has a field that refers to the same object as the original\
    \ object. The following code, which uses this Cloner class, illustrates the consequences\
    \ of shallow copying reference types:\n\n```\nCloner mySource = new Cloner(5);\n\
    Cloner myTarget = (Cloner)mySource.GetCopy();\nWriteLine($\"myTarget.MyContent.Val\
    \ = {myTarget.MyContent.Val}\");\nmySource.MyContent.Val = 2;\nWriteLine($\"myTarget.MyContent.Val\
    \ = {myTarget.MyContent.Val}\");\n```\n\nThe fourth line, which assigns a value\
    \ to mySource.MyContent.Val, the Val public field of the MyContent public field\
    \ of the original object, also changes the value of myTarget.MyContent.Val. That's\
    \ because mySource.MyContent refers to the same object instance as myTarget.MyContent.\
    \ The output of the preceding code is as follows:\n\n```\nmyTarget.MyContent.Val\
    \ = 5\nmyTarget.MyContent.Val = 2\n```\n\nTo get around this, you need to perform\
    \ a deep copy. You could just modify the GetCopy() method used previously to do\
    \ this, but it is preferable to use the standard .NET Framework way of doing things:\
    \ implement the ICloneable interface, which has the single method Clone(). This\
    \ method takes no parameters and returns an object type result, giving it a signature\
    \ identical to the GetCopy() method used earlier.\n\nTo modify the preceding classes,\
    \ try using the following deep copy code:\n\n```\npublic class Content\n{\n  \
    \  public int Val;\n}\npublic class Cloner : ICloneable\n{\n    public Content\
    \ MyContent = new Content();\n    public Cloner(int newVal)\n    {\n        MyContent.Val\
    \ = newVal;\n    }\n    public object Clone()\n    {\n        Cloner clonedCloner\
    \ = new Cloner(MyContent.Val);\n        return clonedCloner;\n    }\n}\n```"
