    ```\n```\n\nPutting everything in this section together and using this code would\
    \ give you the result shown in Figure 13-9.\n\n![](img/cf72ea860016d2d680fc085fc06f265a_395_0.png)\n\
    \nFIGURE 13-9\n\nAttributes can be extremely useful and crop up all over .NET\
    \ applications — and WPF and Windows Store applications in particular. You will\
    \ encounter them repeatedly throughout the remainder of this book.\n\n# INITIALIZERS\n\
    \nUp to now you have learned to instantiate and initialize objects in various\
    \ ways. Invariably, that has required you either to add code to class definitions\
    \ to enable initialization or to instantiate and initialize objects with separate\
    \ statements. You have also learned how to create collection classes of various\
    \ types, including generic collection classes. Again, you might have noticed that\
    \ there was no easy way to combine the creation of a collection with adding items\
    \ to the collection.\n\nObject initializers provide a way to simplify your code\
    \ by enabling you to combine instantiation and initialization of objects. Collection\
    \ initializers give you a simple, elegant syntax to create and populate collections\
    \ in a single step. This section explains how to use both of these features.\n\
    \n# Object Initializers\n\nConsider the following simple class definition:\n\n\
    ```\n```csharp\npublic class Curry\n{\n    public string MainIngredient { get;\
    \ set; }\n}\n```\n```"
