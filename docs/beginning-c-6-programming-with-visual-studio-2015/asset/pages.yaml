  md: '+   13. Select the Capabilities tab and ensure that the Pictures Library capability
    is checked.

    +   14. Run the app.


    # How It Works


    The code uses three RelativePanels to move its content about. None of the panels
    have any positioning instructions directly on them; instead the entire layout
    is defined in the Visual State Manager. In this case, we are using two adaptive
    triggers, one that activates if the view is wider than 720 pixels and one that
    activates if the view is wider than 0 pixels.


    The FlipView itself is almost the least amount of code in the example.


    ```

    <FlipView x:Name="flipView" VerticalAlignment="Stretch"

    HorizontalAlignment="Stretch" >

    <FlipView.ItemTemplate>

    <DataTemplate>

    <Image x:Name="image" Source="{Binding}" Stretch="Uniform"/>

    </DataTemplate>

    </FlipView.ItemTemplate>

    </FlipView>

    ```


    In this code, we tell the FlipView that it should use the ItemTemplate we define
    here, and this just includes a single Image control. From this it is apparent
    that you can use the FlipView to display anything, not just images.


    The code in the GetFiles method demonstrates several of the interfaces that you
    can use to access files and resources in an app. Later in this chapter we will
    discuss the concept of sandboxed apps and what limitations they put on your code,
    but you have already seen some of this in action in this example. The following
    code gets a StorageFolder object if the app has access to it and throws a UnauthorizedAccessException
    exception if it does not.


    ```

    StorageFolder picturesFolder = KnownFolders.PicturesLibrary;

    ```


    In normal .NET you don''t have this class, and the determination of whether access
    is granted is based on the user''s permissions in the file system. For apps, this
    is very different. Here you have to declare up front which resources the app will
    need access to, and the user must accept these for the application to run. In
    step 13 you declared that the app will include the capability to access to the
    Pictures Library. If you didn''t do that, you will get an exception when you run
    the app.


    Next you used the GetFilesAsync method of the StorageFolder to retrieve the files,
    ordered by date.


    Once we have the files, we open them by calling OpenAsync on the StorageFile objects


    ```

    using (Windows.Storage.Streams.IRandomAccessStream fileStream = await file.

    OpenAsync(FileAccessMode.Read))

    ```


    This returns a file stream we can use to access the content of the files. In this
    case, we don''t want to write to it, so we specify Read access only.


    Finally, we set the ItemsSource of the FlipView to the list of images we have
    loaded from the Pictures Library.'
