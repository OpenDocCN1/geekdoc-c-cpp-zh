  md: "# Serialization, Streams, and Async Programming\n\nIn Chapter 14, you used\
    \ the `[Serializable]` attribute to allow classes to be serialized. .NET for Universal\
    \ apps do not include this attribute, but you can use a similar attribute called\
    \ `[DataContract]` instead. The `DataContract` attribute works with the `DataContractSerializer`\
    \ class to serialize the content of a class. In order to get the serialized content\
    \ to or from disk, you need to use some file access types, but unlike with normal\
    \ .NET, you can't create these directly. Instead, you use file pickers to create\
    \ the stream objects, which you can use with `DataContractSerializer` to save\
    \ and load your files.\n\n> NOTE The projects you can download for this chapter\
    \ from www.wrox.com/go/beginningvisualc#2015programming include a certificate\
    \ file that you may not be able to use, but can generate yourself. Follow these\
    \ steps to do so:\n> \n> 1. With the project open, double-click the file Package.appxmanifest.\n\
    > 2. Select the Packaging tab.\n> 3. Click Choose Certificate.\n> 4. Select Create\
    \ test certificate from the Configure Certificate.\n> 5. Click OK.\n\nThe next\
    \ Try It Out demonstrates using `DataContractSerializer` with streams created\
    \ by `FileOpenPicker` and `FileSavePicker` to load and save XML representations\
    \ of a data model.\n\n# TRY IT OUT Disk Access: Ch23Ex03\n\n+   1. Create a new\
    \ project in Visual Studio by selecting Blank App (Universal Windows) and name\
    \ it DataSerialization.\n+   2. Create a new class in the project named AppData.\n\
    +   3. Mark the class with the `[DataContract]` attribute and add the `System.Runtime.Serialization`\
    \ namespace to the section:\n+   4. Add a property of type `int` to the class\
    \ and mark it with the `[DataMember]` attribute:\n\n```\nusing System.Runtime.Serialization;\n\
    \nnamespace DataSerialization\n{\n    [DataContract]\n    class AppData\n    {\n\
    \    }\n}\n```\n\n```\n[DataMember]\npublic int TheAnswer { get; set; }\n```"
