- pgno: 65
  md: 'The first line declares a variable of type int with a name of myInteger, and
    the second line declares a variable of type string called myString.


    > **NOTE** Variable naming is restricted; you can''t use just any sequence of
    characters. You learn about this in the section titled “Variable Naming.”


    The next two lines of code assign values:


    ```

    myInteger = 17;

    myString = "\"myInteger\" is";

    ```


    Here, you assign two fixed values (known as literal values in code) to your variables
    using the = assignment operator (the “Expressions” section of this chapter has
    more details about operators). You assign the integer value 17 to myInteger, and
    you assigned the following string (including the quotes) to myString:


    ```

    "myInteger" is

    ```


    When you assign string literal values in this way, double quotation marks are
    required to enclose the string. Therefore, certain characters might cause problems
    if they are included in the string itself, such as the double quotation characters,
    and you must escape some characters by substituting a sequence of other characters
    (an escape sequence) that represents the character(s) you want to use. In this
    example, you use the sequence \" to escape a double quotation mark:


    ```

    myString = "\"myInteger\" is";

    ```


    If you didn''t use these escape sequences and tried coding this as follows, you
    would get a compiler error:


    ```

    myString = ""myInteger" is";

    ```


    Note that assigning string literals is another situation in which you must be
    careful with line breaks — the C# compiler rejects string literals that span more
    than one line. If you want to add a line break, then use the escape sequence for
    a newline character in your string, which is \n. For example, consider the following
    assignment:


    ```

    myString = "This string has a\nline break.";

    ```


    This string would be displayed on two lines in the console view as follows:


    ```

    This string has a

    line break.

    ```


    All escape sequences consist of the backslash symbol followed by one of a small
    set of characters (you''ll see the full set later). Because this symbol is used
    for this purpose, there is also an escape sequence for the backslash symbol itself,
    which is simply two consecutive backslashes (\\).


    Getting back to the code, there is one more new line to look at:


    ```

    Console.WriteLine($"{myString} {myInteger}");

    ```'
