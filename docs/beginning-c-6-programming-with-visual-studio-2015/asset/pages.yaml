  md: "You're just using the args parameter as you would any other string array. You're\
    \ not doing anything fancy with the arguments; you're just writing whatever is\
    \ specified to the screen. You supplied the arguments via the project properties\
    \ in the IDE. This is a handy way to use the same command-line arguments whenever\
    \ you run the application from the IDE, rather than type them at a command-line\
    \ prompt every time. The same result can be obtained by opening a command prompt\
    \ window in the same directory as the project output (C:\\BegCSharp\\Chapter06\\\
    Ch06Ex04\\Ch06Ex04\\bin\\Debug) and typing this:\n\n```\nCh06Ex04 256 myFile.txt\
    \ \"a longer argument\"\n```\n\nEach argument is separated from the next by spaces.\
    \ To supply an argument that includes spaces, you can enclose it in double quotation\
    \ marks, which prevents it from being interpreted as multiple arguments.\n\n#\
    \ STRUCT FUNCTIONS\n\nThe last chapter covered struct types for storing multiple\
    \ data elements in one place. Structs are actually capable of a lot more than\
    \ this. For example, they can contain functions as well as data. That might seem\
    \ a little strange at first, but it is, in fact, very useful. As a simple example,\
    \ consider the following struct:\n\n```\nstruct CustomerName\n{\n    public string\
    \ firstName, lastName;\n}\n```\n\nIf you have variables of type CustomerName and\
    \ you want to output a full name to the console, you are forced to build the name\
    \ from its component parts. You might use the following syntax for a CustomerName\
    \ variable called myCustomer, for example:\n\n```\nCustomerName myCustomer;\n\
    myCustomer.firstName = \"John\";\nmyCustomer.lastName = \"Franklin\";\nWriteLine($\"\
    {myCustomer.firstName} {myCustomer.lastName}\");\n```\n\nBy adding functions to\
    \ structs, you can simplify this by centralizing the processing of common tasks.\
    \ For example, you can add a suitable function to the struct type as follows:\n\
    \n```\nstruct CustomerName\n{\n    public string firstName, lastName;\n    public\
    \ string Name() => firstName + \" \" + lastName;\n}\n```\n\nThis looks much like\
    \ any other function you've seen in this chapter, except that you haven't used\
    \ the static modifier. The reasons for this will become clear later in the book;\
    \ for now, it is"
