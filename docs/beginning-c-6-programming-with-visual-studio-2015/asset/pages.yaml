- pgno: 505
  md: "# WPF USER CONTROLS\n\nWPF provides a set of controls that are useful in many\
    \ situations. However, as with all the .NET development frameworks, it also enables\
    \ you to extend this functionality. Specifically, you can create your own controls\
    \ by deriving your classes from classes in the WPF class hierarchy.\n\nOne of\
    \ the most useful controls you can derive from is UserControl. This class gives\
    \ you all the basic functionality that you are likely to require from a WPF control,\
    \ and it enables your control to snap in beside the existing WPF control suite\
    \ seamlessly. Everything you might hope to achieve with a WPF control — such as\
    \ animation, styling, and templating — can be achieved with user controls.\n\n\
    You can add user controls to your project by using the Project → Add User Control\
    \ menu item. This gives you a blank canvas (well, actually a blank Grid) to work\
    \ from. User controls are defined using the top-level UserControl element in XAML,\
    \ and the class in the code-behind derives from the System.Windows.Controls.UserControl\
    \ class.\n\nOnce you have added a user control to your project, you can add controls\
    \ to lay out the control and code-behind to configure the control. When you have\
    \ finished doing that, you can use it throughout your application, and even reuse\
    \ it in other applications.\n\nOne of the crucial things you need to know when\
    \ creating user controls is how to implement dependency properties. Chapter 14\
    \ briefly discussed dependency properties, and now that you are getting closer\
    \ to writing your own controls, it is time to take a closer look at them.\n\n\
    # Implementing Dependency Properties\n\nYou can add dependency properties to any\
    \ class that inherits from System.Windows.DependencyObject. This class is in the\
    \ inheritance hierarchy for many classes in WPF, including all the controls and\
    \ UserControl.\n\nTo implement a dependency property to a class, you add a public,\
    \ static member to your class definition of type System.Windows.DependencyProperty.\
    \ The name of this member is up to you, but best practice is to follow the naming\
    \ convention <PropertyName>Property:\n\n```\npublic static DependencyProperty\
    \ MyStringProperty;\n```\n\nIt might seem odd that this property is defined as\
    \ static, as you end up with a property that can be uniquely defined for each\
    \ instance of your class. The WPF property framework keeps track of things for\
    \ you, so you don't have to worry about this for the moment.\n\nThe member you\
    \ add must be configured by using the static DependencyProperty.Register() method:\n\
    \n```\npublic static DependencyProperty MyStringProperty =\n    DependencyProperty.Register(...);\n\
    ```\n\nThis method takes between three and five parameters, as shown in the Table\
    \ 15-4 (these are shown in order, with the first three parameters being the mandatory\
    \ ones)."
