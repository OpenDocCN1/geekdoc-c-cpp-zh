- pgno: 333
  md: "to put the result in the int type variable result. The ?? operator handles\
    \ this conversion for you. Alternatively, you can pass the result of a ?? evaluation\
    \ into an int? with no problems:\n\n```\nint? result = op1 * 2 ?? 5;\n```\n\n\
    This behavior makes the ?? operator a versatile one to use when dealing with nullable\
    \ variables, and a handy way to supply defaults without using either a block of\
    \ code in an if structure or the often confusing ternary operator.\n\n# The ?.\
    \ Operator\n\nThis operator, often referred to as the Elvis operator or the null\
    \ condition operator, helps to overcome code ambiguity caused by burdensome null\
    \ checking. For example, if you wanted to get the count of orders for a given\
    \ customer, you would need to check for null before setting the count value:\n\
    \n```\nint count = 0;\nif (customer.orders != null)\n{\n    count = customer.orders.Count();\n\
    }\n```\n\nIf you were to simply write this code and there were no orders existing\
    \ for the customer (i.e. it's null), a System.ArgumentNullException is thrown:\n\
    \n```\nint count = customer.orders.Count();\n```\n\nUsing the ?. operator results\
    \ in the int? count being set to null instead of an exception happening.\n\n```\n\
    int? count = customer.orders?.Count();\n```\n\nCombining the null coalescing operator\
    \ ?? discussed in the previous section with the null condition operator ?. makes\
    \ it possible to set a default value when the result is null.\n\n```csharp\nint?\
    \ count = customer.orders?.Count() ?? 0;\n```\n\nAnother use of the null conditional\
    \ operator is to trigger events. Events are discussed in detail in Chapter 13.\
    \ The most common way to trigger an event is by using this code pattern:\n\n```csharp\n\
    var onChanged = OnChanged;\nif (onChanged != null)\n{\n    onChanged(this, args);\n\
    }\n```\n\nThis pattern is not thread safe because someone might unsubscribe the\
    \ last event handler just after the null check is done. When that happens an exception\
    \ is thrown and the application crashes. Avoid this by using the null condition\
    \ operator as shown here:\n\n```csharp\nOnChanged?.Invoke(this, args);\n```"
