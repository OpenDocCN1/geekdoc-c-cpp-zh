    # WHAT YOU LEARNED IN THIS CHAPTER


    | TOPIC | KEY CONCEPTS |

    |---|---|

    | Namespace qualification | To avoid ambiguity in namespace qualification, you
    can use the :: operator to force the compiler to use aliases that you have created.
    You can also use the global namespace as an alias for the top-level namespace.
    |

    | Custom exceptions | You can create your own exception classes by deriving from
    the root Exception class. This is helpful because it gives you greater control
    over catching specific exceptions, and allows you to customize the data that is
    contained in an exception in order to deal with it effectively. |

    | Event handling | Many classes expose events that are raised when certain triggers
    occur in their code. You can write handlers for these events to execute code at
    the point where they are raised. This two-way communication is a great mechanism
    for responsive code, and prevents you from having to write what would otherwise
    be complex, convoluted code that might poll an object for changes. |

    | Event definitions | You can define your own event types, which involves creating
    a named event and a delegate type for any handlers for the event. You can use
    the standard delegate type with no return type and custom event arguments that
    derive from System.EventArgs to allow for multipurpose event handlers. You can
    also use the EventHandler and EventHandler<T> delegate types to define events
    with simpler code. |

    | Anonymous methods | Often, to make your code more readable, you can use an anonymous
    method instead of a full event handler method. This means defining the code to
    execute when an event is raised in-line at the point where you add the event handler.
    You achieve this with the delegate keyword. |

    | Attributes | Occasionally, either because the framework you are using demands
    it or because you choose to, you will make use of attributes in your code. You
    can add attributes to classes, methods and other members using [AttributeName]
    syntax, and you can create your own attributes by deriving from System.Attribute.
    You can read attribute values through reflection. |'
