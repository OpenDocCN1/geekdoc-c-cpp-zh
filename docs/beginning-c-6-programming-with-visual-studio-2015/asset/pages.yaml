- pgno: 124
  md: "Alternatively, you can use literal values for initial assignment. Here, you\
    \ use nested blocks of curly braces, separated by commas:\n\n```\ndouble[,] hillHeight\
    \ = { { 1, 2, 3, 4 }, { 2, 3, 4, 5 }, { 3, 4, 5, 6 } };\n```\n\nThis array has\
    \ the same dimensions as the previous one — that is, three rows and four columns.\
    \ By providing literal values, these dimensions are defined implicitly.\n\nTo\
    \ access individual elements of a multidimensional array, you simply specify the\
    \ indices separated by commas:\n\n```\nhillHeight[2,1]\n```\n\nYou can then manipulate\
    \ this element just as you can other elements. This expression will access the\
    \ second element of the third nested array as defined previously (the value will\
    \ be 4). Remember that you start counting from 0 and that the first number is\
    \ the nested array. In other words, the first number specifies the pair of curly\
    \ braces, and the second number specifies the element within that pair of braces.\
    \ You can represent this array visually, as shown in Figure 5-10.\n\n![](img/cf72ea860016d2d680fc085fc06f265a_124_0.png)\n\
    \nFIGURE 5-10\n\nThe foreach loop gives you access to all elements in a multidimensional\
    \ way, just as with single-dimensional arrays:\n\n```\ndouble[,] hillHeight =\
    \ { { 1, 2, 3, 4 }, { 2, 3, 4, 5 }, { 3, 4, 5, 6 } };\nforeach (double height\
    \ in hillHeight)\n{\n    WriteLine(\"{0}\", height);\n}\n```\n\nThe order in which\
    \ the elements are output is the same as the order used to assign literal values.\
    \ This sequence is as follows (the element identifiers are shown here rather than\
    \ the actual values):\nhillHeight[0,0]\nhillHeight[0,1]\nhillHeight[0,2]"
