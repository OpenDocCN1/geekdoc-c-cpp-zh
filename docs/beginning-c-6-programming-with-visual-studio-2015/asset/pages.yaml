- pgno: 34
  md: '.NET garbage collection works by periodically inspecting the memory of your
    computer and removing anything from it that is no longer needed. There is no set
    time frame for this; it might happen thousands of times a second, once every few
    seconds, or whenever, but you can rest assured that it will happen.


    There are some implications for programmers here. Because this work is done for
    you at an unpredictable time, applications have to be designed with this in mind.
    Code that requires a lot of memory to run should tidy itself up, rather than wait
    for garbage collection to happen, but that isn’t as tricky as it sounds.


    # Fitting It Together


    Before moving on, let’s summarize the steps required to create a .NET application
    as discussed previously:


    +   1. Application code is written using a .NET-compatible language such as C#
    (see Figure 1-1).

    +   2. That code is compiled into CIL, which is stored in an assembly (see Figure
    1-2).


    ![](img/cf72ea860016d2d680fc085fc06f265a_34_0.png)


    ![](img/cf72ea860016d2d680fc085fc06f265a_34_1.png)


    3. When this code is executed (either in its own right if it is an executable
    or when it is used from other code), it must first be compiled into native code
    using a JIT compiler (see Figure 1-3).


    ![](img/cf72ea860016d2d680fc085fc06f265a_34_2.png)'
  merge: -1
  img_proc: true
