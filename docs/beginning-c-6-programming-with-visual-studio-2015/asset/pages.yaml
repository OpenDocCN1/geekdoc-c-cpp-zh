- pgno: 23
  md: 'such as arrays in Chapter 5. In Chapter 6 you’ll start to encapsulate your
    code in the form of functions, which makes it much easier to perform repetitive
    operations and makes your code much more readable.


    By the beginning of Chapter 7 you’ll have a handle on the fundamentals of the
    C# language, and you will focus on debugging your applications. This involves
    looking at outputting trace information as your application is executed, and at
    how Visual Studio can be used to trap errors and lead you to solutions for them
    with its powerful debugging environment.


    From Chapter 8 onward you’ll learn about object-oriented programming (OOP), starting
    with a look at what this term means and an answer to the eternal question, “What
    is an object?” OOP can seem quite difficult at first. The whole of Chapter 8 is
    devoted to demystifying it and explaining what makes it so great, and you won’t
    actually deal with much C# code until the very end of the chapter.


    Everything changes in Chapter 9, when you put theory into practice and start using
    OOP in your C# applications. This is where the true power of C# lies. You’ll start
    by looking at how to define classes and interfaces, and then move on to class
    members (including fields, properties, and methods) in Chapter 10. At the end
    of that chapter you’ll start to assemble a card game application, which is developed
    over several chapters and will help to illustrate OOP.


    Once you’ve learned how OOP works in C#, Chapter 11 moves on to look at common
    OOP scenarios, including dealing with collections of objects, and comparing and
    converting objects. Chapter 12 takes a look at a very useful feature of C# that
    was introduced in .NET 2.0: generics, which enable you to create very flexible
    classes. Next, Chapter 13 continues the discussion of the C# language and OOP
    with some additional techniques, notably events, which become very important in,
    for example, Windows programming. Chapter 13 wraps up the fundamentals by focusing
    on C# language features that were introduced with versions 3.0, 4, 5, and 6 of
    the language.


    # Windows Programming (Chapters 14–15)


    Chapter 14 starts by introducing you to what is meant by Windows programming and
    looks at how this is achieved in Visual Studio. It focuses on WPF as a tool that
    enables you to build desktop applications in a graphical way and assemble advanced
    applications with the minimum of effort and time. You’ll start with the basics
    of WPF programming and build up your knowledge in both this chapter and Chapter
    15, which demonstrates how you can use the wealth of controls supplied by the
    .NET Framework in your applications.


    # Cloud Programming (Chapters 16–17)


    Chapter 16 starts by describing what cloud programming is and discusses the cloud
    optimized stack. The cloud environment is not identical to the way programs have
    been traditionally coded, so a few cloud programming patterns are discussed and
    defined. To complete this chapter, you require an Azure account, which is free,
    so that you can create an App Services Web App, then using the Azure SDK with
    C#, you create and access a storage account from an ASP.NET 4.6 web application.'
  merge: -1
  img_proc: true
