- pgno: 178
  md: 'The sixth, seventh, and eighth icons control program flow in break mode. In
    order, they are as follows:


    +   - **Step Into** — Execute and move to the next statement to execute.

    +   - **Step Over** — Similar to Step Into, but won''t enter nested blocks of
    code, including functions.

    +   - **Step Out** — Run to the end of the code block and resume break mode at
    the statement that follows.


    To look at every single operation carried out by the application, you can use
    Step Into to follow the instructions sequentially. This includes moving inside
    functions, such as Maxima() in the preceding example. Clicking this icon when
    the cursor reaches line 17, which is the call to Maxima(), results in the cursor
    moving to the first line inside the Maxima() function. Alternatively, clicking
    Step Over when you reach line 17 moves the cursor straight to line 18, without
    going through the code in Maxima() [although this code is still executed). If
    you do step into a function that you aren''t interested in, you can click Step
    Out to return to the code that called the function. As you step through code,
    the values of variables are likely to change. If you keep an eye on the monitoring
    windows just discussed, you can clearly see this happening.


    You can also change which line of code will be executed next by right-clicking
    on a line of code and selecting Set Next Statement, or by dragging the yellow
    arrow to a different line of code. This doesn''t always work, such as when skipping
    variable initialization. However, it can be very useful for skipping problematic
    lines of code to see what will happen, or for repeating the execution of code
    by moving the arrow backward.


    In code that has semantic errors, these techniques may be the most useful ones
    at your disposal. You can step through code right up to the point where you expect
    problems to occur, and the errors will be generated as if you were running the
    program normally. Or you can cause statements to be executed more than once by
    changing the executing code. Along the way, you can watch the data to see just
    what is going wrong. Later in this chapter, you''ll step through some code to
    find out what is happening in an example application.


    # Immediate and Command Windows


    The Command and Immediate windows (found on the Debug Windows menu) enable you
    to execute commands while an application is running. The Command window enables
    you to perform Visual Studio operations manually (such as menu and toolbar operations),
    and the Immediate window enables you to execute additional code besides the source
    code lines being executed, and to evaluate expressions.


    These windows are intrinsically linked. You can even switch between them by entering
    commands — immed to move from the Command window to the Immediate window and cmd
    to move back.


    This section concentrates on the Immediate window because the Command window is
    only really useful for complex operations. The simplest use of this window is
    to evaluate expressions, a bit like'
