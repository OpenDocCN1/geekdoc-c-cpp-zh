- pgno: 406
  md: 'This uses an array that is implicitly typed to an anonymous type, using a combination
    of syntax from this section and the “Type Inference” section earlier in this chapter.
    The result is that the curries variable contains three instances of an anonymous
    type.


    The first thing the code does after creating this array is output the result of
    calling ToString() on the anonymous type:


    ```

    WriteLine(curries[0].ToString());

    ```


    This results in the following output:


    ```

    { MainIngredient = Lamb, Style = Dhansak, Spiciness = 5 }

    ```


    The implementation of ToString() in an anonymous type outputs the values of each
    property defined for the type.


    The code next calls GetHashCode() on each of the array’s three objects:


    ```

    WriteLine(curries[0].GetHashCode());

    WriteLine(curries[1].GetHashCode());

    WriteLine(curries[2].GetHashCode());

    ```


    When implemented, GetHashCode() should return a unique integer for an object based
    on the object’s state. The first two objects in the array have the same property
    values, and therefore the same state. The result of these calls is the same integer
    for each of these objects, but a different integer for the third object. The output
    is as follows:


    ```

    1789653062

    1789653062

    2116426892

    ```


    Next, the Equals() method is called to compare the first object with the second
    object, and then to compare the first object with the third object:


    ```

    WriteLine(curries[0].Equals(curries[1]));

    WriteLine(curries[0].Equals(curries[2]));

    ```


    The result is as follows:


    ```

    True

    False

    ```


    The implementation of Equals() in anonymous types compares the state of objects.
    The result is true where every property of one object contains the same value
    as the comparable property on another object.


    That is not what happens when you use the == operator, however. The == operator,
    as shown in previous chapters, compares object references. The last section of
    code performs the same comparisons as the previous section of code but uses ==
    instead of Equals():


    ```

    WriteLine(curries[0] == curries[1]);

    WriteLine(curries[0] == curries[2]);

    ```'
