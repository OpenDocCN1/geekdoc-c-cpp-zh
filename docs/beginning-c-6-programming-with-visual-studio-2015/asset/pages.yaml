- pgno: 588
  md: '# 18


    # Files


    # WHAT YOU WILL LEARN IN THIS CHAPTER


    +   - Discovering the File and Directory classes

    +   - Understanding how .NET uses streams to access files

    +   - Writing to and reading from a file

    +   - Reading and writing compressed files

    +   - Serializing and deserializing objects

    +   - Monitoring files and directories for changes


    # WROX.COM CODE DOWNLOADS FOR THIS CHAPTER


    You can find the wrox.com code downloads for this chapter at www.wrox.com/go/beginning
    visualc#2015programming on the Download Code tab. The code is in the Chapter 18
    download and program names match the names used in the examples throughout the
    chapter.


    Files can be a great way to store data between instances of your application,
    or they can be used to transfer data between applications. User and application
    configuration settings can be stored to be retrieved the next time your application
    is run.


    This chapter shows you how to use files effectively in your applications, touching
    on the major classes used to create, read from, and write to files, and the supporting
    classes used to manipulate the file system from C# code. Although you won’t examine
    all of the classes in detail, this chapter goes into enough depth to give you
    a good idea of the concepts and fundamentals.'
  merge: -1
