- pgno: 739
  md: 'Rather than forcing your users to look at the complexity of your app through
    the menu, the app style presents the application to the users, and they can activate
    the menu when needed. When the menu is displayed, it should be simple, containing
    only the main options. It is up to you to decide where and when to display the
    menu.


    # Tiles and Badges


    Windows uses something called live tiles to display the apps on the Start menu
    and page. The “live” part of the name springs from the fact that the tiles can
    change based on the current content or state of the app. For example, you will
    see photo apps rotating through your pictures on the Start page, mail clients
    displaying the number of unread mails, games displaying screenshots from the last
    save, and so on. The possibilities are virtually endless.


    Providing a good tile for your application is more important than providing a
    good icon for a desktop application, and that’s pretty important as well. Tiles
    are embedded in the manifest for the application, and, as you will see later in
    the chapter, they are easy to include using Visual Studio.


    A badge is a small version of the tile that Windows can use on the Lock Screen
    and in other situations. You don’t have to provide a badge for your app unless
    it will show notifications on the Lock Screen.


    # App Lifetime


    Classic Windows Desktop applications can be closed by clicking a button in the
    top-right corner of the caption bar, but Universal apps don’t normally display
    a caption bar, so how do you close them? Generally speaking, you don’t need to
    close an app. Whenever a Universal app loses focus, it is suspended and will stop
    using processor resources entirely. This allows many apps to appear to be running
    at the same time, when in fact they are just suspended. The suspension happens
    automatically in Windows as soon as an app loses focus. It’s not really something
    that you notice as a user, but it is a very important fact to know and handle
    as an app developer.


    # Lock Screen Apps


    Some apps should keep running when they lose focus. Examples of this kind of app
    include GPS navigation and audio-streaming apps. Users expect these types of apps
    to continue running even if they start driving or begin using other apps. If your
    app needs to keep running in the background, you must declare it as a Lock Screen
    app and provide information to display notifications on the Lock Screen.


    # APP DEVELOPMENT


    When you start developing Windows Universal apps, you have a number of options
    regarding programming and UI language. This book uses C# and XAML, but other possibilities
    include using JavaScript and HTML5, C++ and DirectX, or Visual Basic and XAML.'
  merge: -1
  img_proc: true
- pgno: 740
  md: 'The XAML that is used to create the user interfaces of the Universal apps is
    not entirely identical to the XAML used by WPF, but it is close enough that you
    should feel comfortable working with it. Many of the controls you are familiar
    with exist for Universal apps as well, though they tend to look slightly differently
    than their Windows Desktop counterparts. There are also a number of controls that
    are optimized to touch.


    > **NOTE** As was the case with Windows 8 apps, Microsoft has released a design
    guide for Universal Apps. You can find it here: https://msdn.microsoft.com/library/windows/apps/hh65424.aspx


    # Adaptive Displays


    Adaptive displays are displays that are able to change in response to user actions
    such as a phone being flipped on its side or the window changing size. Your app
    should be able to gracefully switch from portrait to landscape mode when the user
    flips her phone on the side and should work and look good regardless of whether
    it is deployed on a laptop or on a phone.


    The first thing you will notice when you create a new Windows Universal app project
    is that the page displayed in the designer looks rather small. This is because
    this project defaults to a view that is optimized for a 5" phone display. You
    can change this using the Device Preview panel shown in Figure 23-2. You can also
    use this panel to change the layout from portrait to landscape.


    ![](img/cf72ea860016d2d680fc085fc06f265a_740_0.png)


    FIGURE 23-2


    A well-behaved app is able to display itself well in many if not all of the form-factors
    shown in the Device Preview panel. Considering that the range in this list is
    anything from a 569x320 pixels Internet of Things (IoT) device to a 3840x2160
    pixels Surface Hub, this is a daunting task. Happily,'
  merge: -1
