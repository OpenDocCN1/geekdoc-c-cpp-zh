- pgno: 37
  md: 'Any of these types might also require some form of database access, which can
    be achieved using the ADO.NET (Active Data Objects .NET) section of the .NET Framework,
    through the ADO.NET Entity Framework, or through the LINQ (Language Integrated
    Query) capabilities of C#. Many other resources can be drawn on, such as tools
    for creating networking components, outputting graphics, performing complex mathematical
    tasks, and so on.


    # C# in this Book


    The first part of this book deals with the syntax and usage of the C# language
    without too much emphasis on the .NET Framework. This is necessary because you
    can’t use the .NET Framework at all without a firm grounding in C# programming.
    You’ll start off even simpler, in fact, and leave the more involved topic of OOP
    until you’ve covered the basics. These are taught from first principles, assuming
    no programming knowledge at all.


    After that, you’ll be ready to move on to developing more complex (but more useful)
    applications. Part II tackles cloud based web application programming, and Part
    III examines data access (for ORM database concepts, filesystem, and XML data)
    and LINQ. Part IV of this book looks at desktop and Windows Store application
    programming.


    # VISUAL STUDIO 2015


    In this book, you use the Visual Studio 2015 development tool for all of your
    C# programming, from simple command-line applications to more complex project
    types. A development tool, or integrated development environment (IDE), such as
    Visual Studio isn’t essential for developing C# applications, but it makes things
    much easier. You can (if you want to) manipulate C# source code files in a basic
    text editor, such as the ubiquitous Notepad application, and compile code into
    assemblies using the command-line compiler that is part of the .NET Framework.
    However, why do this when you have the power of an IDE to help you?


    # Visual Studio Express 2015 Products


    In addition to Visual Studio 2015, Microsoft also supplies several simpler development
    tools known as Visual Studio Express or Community 2015 Products. These are freely
    available at https://www.visualstudio.com/en-us/downloads/download-visual-studio-vs.


    The various express products enable you to create almost any C# application you
    might need. They function as slimmed-down versions of Visual Studio and retain
    the same look and feel. While they offer many of the same features as Visual Studio,
    some notable feature are absent, although not so many that they would prevent
    you from using these tools to work through the chapters of this book.


    > NOTE This book was written using the Enterprise version of Visual Studio 2015
    because the Express products were not available. At the time of writing, there
    is an Express product scheduled for release called Visual Studio Express 2015
    for Windows Desktop that should be sufficient for following along with the first
    part of this book. The remainder of the book may also allow you to use Visual
    Studio Express 2015 for Windows 10 and Visual Studio Express 2015 for Web, but
    at the time of writing we can’t say for certain whether that will hold true.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Solutions


    When you use Visual Studio to develop applications, you do so by creating *solutions*.
    A solution, in Visual Studio terms, is more than just an application. Solutions
    contain *projects*, which might be WPF projects, Cloud/Web Application projects,
    and so on. Because solutions can contain multiple projects, you can group together
    related code in one place, even if it will eventually compile to multiple assemblies
    in various places on your hard disk.


    This is very useful because it enables you to work on shared code (which might
    be placed in the GAC) at the same time as applications that use this code. Debugging
    code is a lot easier when only one development environment is used, because you
    can step through instructions in multiple code modules.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# WHAT YOU LEARNED IN THIS CHAPTER


    | TOPIC | KEY CONCEPTS |

    |---|---|

    | .NET Framework fundamentals | The .NET Framework is Microsoft''s latest development
    platform, and is currently in version 4.6. It includes a common type system (CTS)
    and common language runtime (CLR). .NET Framework applications are written using
