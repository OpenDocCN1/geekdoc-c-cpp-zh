- pgno: 419
  md: "The C# compiler knows the delegate type required by the Elapsed event, so it\
    \ can fill in the blanks. However, you should use this syntax with care because\
    \ it can make it harder to read your code and know exactly what is happening.\
    \ When you use an anonymous method, the sequence of events shown earlier is reduced\
    \ to a single step:\n\n+   1. Use an inline, anonymous method that matches the\
    \ return type and the parameters of the delegate required by an event to subscribe\
    \ to that event.\n\nThe inline anonymous method is defined by using the delegate\
    \ keyword:\n\n```\nmyTimer.Elapsed +=\n    delegate(object source, ElapsedEventArgs\
    \ e)\n    {\n        WriteLine(\"Event handler called after {0} milliseconds.\"\
    ,\n            (source as Timer).Interval);\n    };\n```\n\nThis code works just\
    \ as well as using the event handler separately. The main difference is that the\
    \ anonymous method used here is effectively hidden from the rest of your code.\
    \ You cannot, for example, reuse this event handler elsewhere in your application.\
    \ In addition, the syntax used here is, for want of a better description, a little\
    \ clunky. The delegate keyword is immediately confusing because it is effectively\
    \ being overloaded — you use it both for anonymous methods and for defining delegate\
    \ types.\n\n# Lambda Expressions for Anonymous Methods\n\nThis brings you to lambda\
    \ expressions. Lambda expressions are a way to simplify the syntax of anonymous\
    \ methods. In fact, they are more than that, but this section will keep things\
    \ simple for now. Using a lambda expression, you can rewrite the code at the end\
    \ of the previous section as follows:\n\n```\nmyTimer.Elapsed += (source, e) =>\
    \ WriteLine(\"Event handler called after \" +\n    $\"{(source as Timer).Interval}\
    \ milliseconds.\");\n```\n\nAt first glance this looks...well, a little baffling\
    \ (unless you are familiar with so-called functional programming languages such\
    \ as Lisp or Haskell, that is). However, if you look closer you can see, or at\
    \ least infer, how this works and how it relates to the anonymous method that\
    \ it replaces. The lambda expression is made up of three parts:\n\n+   - A list\
    \ of (untyped) parameters in parentheses\n+   - The => operator\n+   - A C# statement\n\
    \nThe types of the parameters are inferred from the context, using the same logic\
    \ shown in the section “Anonymous Types” earlier in this chapter. The => operator\
    \ simply separates the parameter list from the expression body. The expression\
    \ body is executed when the lambda expression is called."
