  md: "![](img/cf72ea860016d2d680fc085fc06f265a_306_0.png)\n\nFIGURE 11-6\n\n# How\
    \ It Works\n\nThis example illustrates the various results possible when using\
    \ the is operator. Three classes, an interface, and a structure are defined and\
    \ used as parameters to a method of a class that uses the is operator to determine\
    \ whether they can be converted into the ClassA type, the interface type, and\
    \ the struct type.\n\nOnly the ClassA and ClassD (which inherits from ClassA)\
    \ types are compatible with ClassA. Types that don't inherit from a class are\
    \ not compatible with that class.\n\nThe ClassA, ClassB, and MyStruct types all\
    \ implement IMyInterface, so these are all compatible with the IMyInterface type.\
    \ ClassD inherits from ClassA, so it too is compatible. Therefore, only ClassC\
    \ is incompatible.\n\nFinally, only variables of type MyStruct itself and boxed\
    \ variables of that type are compatible with MyStruct, because you can't convert\
    \ reference types to value types (although, of course, you can unbox previously\
    \ boxed variables).\n\n# Value Comparisons\n\nConsider two Person objects representing\
    \ people, each with an integer Age property. You might want to compare them to\
    \ see which person is older. You can simply use the following code:\n\n```\nif\
    \ (person1.Age > person2.Age)\n{\n    ...\n}\n```"
