    The OK button event handler saves the settings to disk using an XmlSerializer.
    The Cancel event handler sets the game options field to null, ensuring that the
    selections made by the user are cleared. Both event handlers close the window.


    # Starting a Game with the ListBox Control


    You are now only one window short of having created all the supporting windows
    in the game. The last window before creating the game board is a window where
    the player can add new players and select the players who will be participating
    in a new game. This window will use a ListBox to display the names of the players.


    ListBoxes and ComboBoxes can often be used for the same purpose, but where a ComboBox
    normally allows you to select only a single entry, ListBoxes often allows the
    user to select multiple items. Another key difference is that a ListBox will display
    its content in a list that is always expanded. This means that it takes up more
    real estate on the window, but it allows the user to see the options available
    right away.


    Table 14-8 lists a few particularly interesting properties for the ListBox control.


    TABLE 14-8: Interesting ListBox Properties


    | PROPERTY | DESCRIPTION |

    |---|---|

    | SelectionMode | This property controls how the user can select items from the
    list. There are three possible values: Single, which allows the user to select
    only one item, Multiple, which allows the user to select multiple items without
    holding down the Ctrl key, and Extended, which allows the user to select multiple
    consecutive items by holding down the Shift key, and non-consecutive items by
    holding down the Ctrl key. |

    | SelectedItem | Gets or sets the first selected item or null if nothing is selected.
    Even if multiple items are selected, only the first item is returned. |

    | SelectedItems | Gets a list containing the items that are currently selected.
    |

    | SelectedIndex | Works like SelectedItem, but returns the index instead of the
    item itself and -1 instead of null if nothing is selected. |'
