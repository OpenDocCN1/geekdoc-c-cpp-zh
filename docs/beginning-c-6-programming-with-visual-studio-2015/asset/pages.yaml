    # How It Works


    It is important that the Visual State Manager in the example is placed as the
    first child of the root grid. This allows the interpreter to find the controls
    that are referenced. You will not get any errors if you place it in another position,
    but you will not get the expected result.


    The Visual State Manager uses the AdaptiveTrigger with the property MinWindowWidth
    to change the behavior of the display:


    ```

    <AdaptiveTrigger MinWindowWidth="0" />

    ```


    We define two states, one that is activated if the view is at least 0 pixels wide,
    and another that activates if the view is at least 720 pixels wide. You might
    expect that both will be active when the view is wider than 720 pixels, but that''s
    not how it works. Rather, only one of the states will be active at any time, and
    the one that matches best will be selected. So, when the view is 1024 pixels wide,
    only the wide state is selected.


    In the narrowView, we set three properties:


    ```

    <VisualState.Setters>

    <Setter Target="textBoxFirstName.(RelativePanel.Below)" Value="textBlockFirstName"
    />

    <Setter Target="textBoxFirstName.(RelativePanel.AlignVerticalCenterWith)" Value=""
    />

    <Setter Target="textBoxFirstName.(RelativePanel.AlignLeftWith)" Value="textBlockFirstName"
    />

    ```


    First we ensure that the textbox should be moved below the TextBlock. Second,
    we clear the AlignVerticalCenterWith property. If we didn''t change this, it will
    overrule the instruction to move'
