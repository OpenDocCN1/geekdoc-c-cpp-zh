  md: "# How It Works\n\nIn this example you use a method that returns one of two\
    \ types of objects to obtain a dynamic value, and then attempts to use the object\
    \ obtained. The code compiles without any trouble, but an exception is thrown\
    \ (and handled) when an attempt is made to access a non-existent method.\n\nTo\
    \ begin, you add a using statement for the namespace that contains the RuntimeBinderException\
    \ exception:\n\n```\nusing Microsoft.CSharp.RuntimeBinder;\n```\n\nNext, you define\
    \ two classes, MyClass1 and MyClass2, where MyClass1 has an Add() method and MyClass2\
    \ has no members:\n\n```\nclass MyClass1\n{\n    public int Add(int var1, int\
    \ var2) => var1 + var2;\n}\nclass MyClass2\n{\n}\n```\n\nYou also add a field\
    \ (callCount) and a method (GetValue()) to the Program class to provide a way\
    \ to obtain an instance of one of these classes:\n\n```\nstatic int callCount\
    \ = 0;\nstatic dynamic GetValue()\n{\n    if (callCount++ == 0)\n    {\n     \
    \   return new MyClass1();\n    }\n    return new MyClass2();\n}\n```\n\nA simple\
    \ call counter is used so that this method returns an instance of MyClass1 the\
    \ first time it is called, and instances of MyClass2 thereafter. Note that the\
    \ dynamic keyword can be used as a return type for a method.\n\nNext, the code\
    \ in Main() calls the GetValue() method twice and then attempts to call GetString()\
    \ and Add() on both values returned in turn. This code is placed in a try...catch\
    \ block to trap any exceptions of type RuntimeBinderException that occur:\n\n\
    ```\nstatic void Main(string[] args)\n{\n    try\n    {\n        dynamic firstResult\
    \ = GetValue();\n        dynamic secondResult = GetValue();\n        WriteLine($\"\
    firstResult is: {firstResult.ToString()}\");\n        WriteLine($\"secondResult\
    \ is: {secondResult.ToString()}\");\n```"
  merge: -1
  img_proc: true
- pgno: 411
  md: "```\nWriteLine($\"firstResult call: {firstResult.Add(2, 3)}\");\nWriteLine($\"\
    secondResult call: {secondResult.Add(2, 3)}\");\n}\ncatch (RuntimeBinderException\
    \ ex)\n{\n    WriteLine(ex.Message);\n}\nReadKey();\n}\n```\n\nSure enough, an\
    \ exception is thrown when secondResult.Add() is called, as no such method exists\
    \ on MyClass2. The exception message tells you exactly that.\n\nThe dynamic keyword\
    \ can also be used in other places where a type name is required, such as for\
    \ method parameters. You could rewrite the Add() method as follows:\n\n```\npublic\
    \ int Add(dynamic var1, dynamic var2) => var1 + var2;\n```\n\nThis would have\
    \ no effect on the result. In this case, at runtime the values passed to var1\
    \ and var2 are inspected to determine whether a compatible operator definition\
    \ for + exists. In the case of two int values being passed, such an operator does\
    \ exist. If incompatible values are used, a RuntimeBinderException exception is\
    \ thrown. For example, if you try,\n\n```\nWriteLine($\"firstResult call: {0}\"\
    , firstResult.Add(\"*2\", 3));\n```\n\nthe exception message will be as follows:\n\
    \n```\nCannot implicitly convert type 'string' to 'int'\n```\n\nThe lesson to\
    \ be learned here is that dynamic types are very powerful, but there's a warning\
    \ to learn too. These sorts of exceptions are entirely avoidable if you use strong\
    \ typing instead of dynamic typing. For most C# code that you write, avoid the\
    \ dynamic keyword. However, if a situation arises where you need to use it, use\
    \ it and love it — and spare a thought for those poor programmers of the past\
    \ who didn't have this powerful tool at their disposal.\n\n# ADVANCED METHOD PARAMETERS\n\
    \nC# 4 extended what is possible when defining and using method parameters. This\
    \ is primarily in response to a specific problem that arises when using interfaces\
    \ defined externally, such as the Microsoft Office programming model. Here, certain\
    \ methods expose a vast number of parameters, many of which are not required for\
    \ every call. In the past, this has meant that a way to specify missing parameters\
    \ has been necessary, or that a lot of nulls appear in code:\n\n```\nRemoteCall(var1,\
    \ var2, null, null, null, null, null);\n```\n\nIn this code it is not at all obvious\
    \ what the null values refer to, or why they have been omitted.\n\nPerhaps, in\
    \ an ideal world, there would be multiple overloads of this RemoteCall() method,\
    \ including one that only required two parameters as follows:\n\n```\nRemoteCall(var1,\
    \ var2);\n```"
