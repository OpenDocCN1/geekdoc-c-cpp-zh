  md: "4. Run the application. The result is shown in Figure 18-1.\n\n![](img/cf72ea860016d2d680fc085fc06f265a_599_0.png)\n\
    \nFIGURE 18-1\n\n# How It Works\n\nThis application opens its own .cs file to\
    \ read from. It does so by navigating two directories up the file structure with\
    \ the .. string in the following line:\n\n```\nFileStream aFile = new FileStream(\"\
    ../../Program.cs\", FileMode.Open);\n```\n\nThe two lines that implement the actual\
    \ seeking and reading from a specific point in the file are as follows:\n\n```\n\
    aFile.Seek(174, SeekOrigin.Begin);\naFile.Read(byteData, 0, 200);\n```\n\nThe\
    \ first line moves the file pointer to byte number 174 in the file. This is the\
    \ n of namespace in the Program.cs file; the 174 characters preceding it are the\
    \ using directives. The second line reads the next 200 bytes into the byte array\
    \ byteData.\n\nNote that these two lines were enclosed in try...catch blocks to\
    \ handle any exceptions that are thrown:\n\n```\ntry\n{\n    aFile.Seek(113, SeekOrigin.Begin);\n\
    \    aFile.Read(byteData, 0, 100);\n}\ncatch (IOException e)\n{\n    WriteLine(\"\
    An IO exception has been thrown!\");\n    WriteLine(e.ToString());\n    ReadKey();\n\
    \    return;\n}\n```\n\nAlmost all operations involving file I/O can throw an\
    \ exception of type IOException. All production code should contain error handling,\
    \ especially when dealing with the file system. The examples in this chapter all\
    \ include a basic form of error handling.\n\nOnce you have the byte array from\
    \ the file, you need to convert it into a character array so that you can display\
