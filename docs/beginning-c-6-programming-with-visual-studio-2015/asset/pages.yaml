  md: 'Note that here the result variable is also of type int?. The following code
    will not compile:


    ```

    int? op1 = 5;

    int result = op1 * 2;

    ```


    To get this to work you must perform an explicit conversion or access the value
    through the Value property, which requires code such as,


    ```

    int? op1 = 5;

    int result = (int)op1 * 2;

    ```


    or:


    ```

    int? op1 = 5;

    int result = op1.Value * 2;

    ```


    This works fine as long as op1 has a value — if it is null, then you will get
    an exception of type System.InvalidOperationException.


    This raises the obvious question: What happens when one or both values in an operator
    evaluation that involves two nullable values are null, such as op1 in the following
    code?


    ```

    int? op1 = null;

    int? op2 = 5;

    int? result = op1 * op2;

    ```


    The answer is that for all simple nullable types other than bool?, the result
    of the operation is null, which you can interpret as "unable to compute." For
    structs you can define your own operators to deal with this situation (as shown
    later in this chapter), and for bool? there are operators defined for & and |
    that might result in non-null return values. The results in the table make perfect
    sense logically — if there is enough information to work out the answer of the
    computation without needing to know the value of one of the operands, then it
    doesn''t matter if that operand is null.


    # The ?? Operator


    To further reduce the amount of code you need in order to deal with nullable types,
    and to make it easier to deal with variables that can be null, you can use the
    ?? operator. Known as the null coalescing operator, it is a binary operator that
    enables you to supply an alternative value to use for expressions that might evaluate
    to null. The operator evaluates to its first operand if the first operand is not
    null, or to its second operator if the first operand is null. Functionally, the
    following two expressions are equivalent:


    ```

    op1 ?? op2

    op1 == null ? op2 : op1

    ```


    In this code, op1 can be any nullable expression, including a reference type and,
    importantly, a nullable type. This means that you can use the ?? operator to provide
    default values to use if a nullable type is null, as shown here:


    ```

    int? op1 = null;

    int result = op1 * 2 ?? 5;

    ```


    Because in this example op1 is null, op1 * 2 will also be null. However, the ??
    operator detects this and assigns the value 5 to result. Importantly, note here
    that no explicit conversion is required'
