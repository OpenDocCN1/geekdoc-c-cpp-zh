- pgno: 460
  md: '![](img/cf72ea860016d2d680fc085fc06f265a_460_0.png)


    FIGURE 14-7


    # How It Works


    By dividing the grid into two columns and two rows, you have changed how the controls
    can be positioned in the grid. When you set the `Grid.Row` and `Grid.Column` to
    0 for the first button, you move it from its previous position on the form to
    the top-left section.


    The second button more or less stays put, but when you drag the `GridSplitter`
    slider, you see that the margin of the button is now relative to the left edge
    of the column in which it is placed, meaning that it slides across the window
    as you move the slider.


    # THE GAME CLIENT


    Now that you know the basics of what it means to work with WPF and Visual Studio,
    it is time to start working with the controls to create something useful. The
    remaining sections of this chapter and Chapter 15 are dedicated to writing a game
    client for the card game you have been developing over the previous chapters.
    You are going to use a lot of controls to write the game client, and you are even
    going to write one yourself.


    In this chapter you are going to write the supporting dialog boxes of the game
    — this includes the About, Options, and New Game windows.


    # The About Window


    An About window, or About box as it''s sometimes called, is used to display information
    about the developer of the application and the application itself. Some About
    windows are quite complex, like the one found in Microsoft Office applications
    and Visual Studio, and display version and licensing'
  merge: -1
  img_proc: true
- pgno: 461
  md: 'information. By convention, the About window can be accessed from the Help
    menu where it is usually the last item on the list.


    Figure 14-8 shows a screenshot of the finished dialog box that you are about to
    create.


    # Designing the User Interface


    An About window is not something that the user is going to see very often. In
    fact, the reason that it is usually located on the Help menu is that it is very
    often only used when the user needs to find information about the version of the
    application or who to contact when something is wrong. But this also means that
    it is something the user has a specific purpose for visiting and if you include
    such a window in your application, you should treat it as important.


    ![](img/cf72ea860016d2d680fc085fc06f265a_461_0.png)


    FIGURE 14-8


    Whenever you are designing an application, you should strive to keep the look
    and feel as consistent as possible. This means that you should stick to a few
    select colors and use the same styling of controls everywhere in the application.
    In the case of Karli Cards, you are going to work with three main colors — red,
    black, and white.


    If you look at Figure 14-8 you will see that the top-left corner of the window
    is occupied by a Wrox Press logo. You have not used images before, but adding
    a few select images to your applications can make the user interface look more
    professional.


    # The Image Control


    `Image` is a very simple control that can be used to great effect. It allows you
    to display a single image and to resize this image as you see fit. The control
    exposes two properties, as shown in Table 14-2.


    TABLE 14-2: Image Control


    | PROPERTY | DESCRIPTION |

    |---|---|

    | Source | Use this property to specify the location of the image. This can be
    a location on disk or somewhere on the web. As you will see in Chapter 15, it
    is also possible to create a static resource and use it as the source. |'
  merge: -1
  img_proc: true
- pgno: 462
  md: '| PROPERTY | DESCRIPTION |

    |---|---|

    | `Stretch` | It''s actually pretty rare to have an image that is exactly the
    right size for your purpose, and sometimes the size of the image must change as
    the application window is resized. You can use this property to control how the
    image behaves. There are four possibilities:


    None — The image doesn''t resize.

    Fill — The image resizes to fill the entire space. This may contort the image.

    Uniform — The image keeps its aspect ratio and doesn''t fill the available space
    if this would change the aspect ratio.

    UniformToFill — The image keeps its aspect ratio and fills the available space.
    If keeping the ratio means that some of the image is too large for the space available,
    the image is clipped to fit. |


    # The Label Control


    You have already seen this most simple of controls used in some of the previous
    examples. It displays simple text information to the user and in some cases relays
    information about shortcut keys. The control uses the `Content` property to display
    its text. The `Label` control displays text on a single line. If you prefix a
    letter with an underscore “ _ ” character, the letter will become underlined and
    it will then be possible to access the control directly by using the prefixed
    letter and Alt. For example, `_Name` assigns the shortcut Alt+N to any control
    directly following the label.


    # The TextBlock Control


    Like `Label`, this control displays simple text without any complicated formatting.
    Unlike the `Label`, the `TextBlock` control is capable of displaying multiple
    lines of text. It is not possible to format individual parts of the text.


    The `TextBlock` displays the text even if it will not fit in the space granted
    to the control. The control itself does not provide any scrollbars in this case,
    but it can be wrapped in a handy view control when needed: the `ScrollViewer`.


    # The Button Control


    Like the `Label` control, you have already seen quite a bit of the `Button` control.
    This control is used everywhere and is easily recognized on a user interface.
    Your users will expect that they can left-click it to perform an action — no more
    and no less. Altering this behavior will most likely lead to bad interface design
    and frustrated users.


    By default, the button displays itself with a single short line of text or an
    image that describes what happens when you click on it.


    The button does not contain any properties to display images or text, but you
    can use the `Content` property to display simple text or embed an `Image` control
    in the content to display an image. You can find this code in the downloaded code
    at Ch14Ex01\ImageButton.xaml:'
  merge: -1
  img_proc: true
