  md: "is equivalent to:\n\n```\npublic class MyClass : IMyInterface1, IMyInterface2\
    \ { ... }\n```\n\nPartial class definitions can include a base class in a single\
    \ partial class definition, or more than one partial class definition. If a base\
    \ class is specified in more than one definition, though, it must be the same\
    \ base class; recall that classes in C# can inherit only from a single base class.\n\
    \n# PARTIAL METHOD DEFINITIONS\n\nPartial classes can also define partial methods.\
    \ Partial methods are defined in one partial class definition without a method\
    \ body, and implemented in another partial class definition. In both places, the\
    \ partial keyword is used:\n\n```\npublic partial class MyClass\n{\n    partial\
    \ void MyPartialMethod();\n}\npublic partial class MyClass\n{\n    partial void\
    \ MyPartialMethod()\n    {\n        // Method implementation\n    }\n}\n```\n\n\
    Partial methods can also be static, but they are always private and can't have\
    \ a return value. Any parameters they use can't be out parameters, although they\
    \ can be ref parameters. They also can't use the virtual, abstract, override,\
    \ new, sealed, or extern modifiers.\n\nGiven these limitations, it is not immediately\
    \ obvious what purpose partial methods fulfill. In fact, they are important when\
    \ it comes to code compilation, rather than usage. Consider the following code:\n\
    \n```\npublic partial class MyClass\n{\n    partial void DoSomethingElse();\n\
    \    public void DoSomething()\n    {\n        WriteLine(\"DoSomething() execution\
    \ started.\");\n        DoSomethingElse();\n        WriteLine(\"DoSomething()\
    \ execution finished.\");\n    }\n}\npublic partial class MyClass\n{\n    partial\
    \ void DoSomethingElse() =>\n        WriteLine(\"DoSomethingElse() called.\");\n\
    }\n```"
