    \ you need a new class or relationship. If you change the code in a class connected\
    \ to a database, via the Entity Framework, you will encounter the Invalid Operation\
    \ Exception shown in Figure 21-14 when you first run the changed program.\n\n\
    ![](img/cf72ea860016d2d680fc085fc06f265a_695_0.png)\n\nFIGURE 21-14\n\nKeeping\
