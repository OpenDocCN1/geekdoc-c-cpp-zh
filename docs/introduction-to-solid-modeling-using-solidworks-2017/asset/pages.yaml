  md: 'We want to locate the raised area concentric with the rounded tip of the boss.
    In order to establish this relation, we will first need to “wake up” the arc that
    makes this raised tip, allowing the center point to be used as a snap point in
    our sketch.


    # FIGURE 3.68


    Click the Sketch tab of the CommandManager. Without clicking, drag the cursor
    until it touches the arc, as shown in Figure 3.68.


    ![](img/30075d71cb1be5651669ffe0f9695010_114_0.png)


    The center point of the arc now appears, and it can be used as a snap point for
    the center of the circle.


    # FIGURE 3.69


    Drag out a circle, starting at the center mark. Select the Smart Tool, and dimension
    the circle to be I in diameter, as shown in Figure 3.69.


    ![](img/30075d71cb1be5651669ffe0f9695010_114_1.png)


    Select the Extruded Boss/Base Tool from the Features group of the CommandManager.
    Extrude the sketch upward for a distance of 0.050 inches, as shown in Figure 3.70.


    A reinforcing rib will now be added to the part.


    Select the Right Plane from the FeatureManager, and select the Right View. Select
    the Line Tool from the sketch group of the CommandManager, and sketch the line
    shown in Figure 3.71. The endpoints of your line should snap to the edges of the
    solids, but not to any specific point on the edges. Recall that a coincident relation
    symbol next to cursor indicates that you are snapping to the edge.


    # FIGURE 3.70


    ![](img/30075d71cb1be5651669ffe0f9695010_114_2.png)


    Add one horizontal and one vertical line coincident with the edges of the solid
    (snap to the endpoints of the first line and the intersection point of the edges),
    completing the profile of the rib, as shown in Figure 3.72.


    # FIGURE 3.71


    # FIGURE 3.72


