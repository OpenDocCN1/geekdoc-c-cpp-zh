  md: '# CHAPTER 4


    # Advanced Part Modeling


    ![](img/30075d71cb1be5651669ffe0f9695010_133_0.png)


    # Introduction


    The parts that we have made so far have been made primarily with extruded and
    revolved bases, bosses, and cuts. In this chapter, we will introduce several other
    tools for creating and modifying parts, including the Loft, Shell, and Sweep Tools.


    # Chapter Objectives


    In this chapter, you will:


    +   - create a lofted feature from multiple sketches,

    - use the Shell Tool to create a thin-wall part,

    - learn how to change the order in which features are created and modified,

    - create raised letters on a part,

    - learn how to create a 3-D sketch, and,

    - create a feature by sweeping a cross-section around a planar or 3-D path.


    # 4.1 A Lofted and Shelled Part


    In this exercise, we will construct the business card holder shown in Figure 4.1.
    Note that the top of the part is rounded, while the bottom of the part is rectangular.
    These dissimilar shapes will be joined into a solid with the Loft Tool. Also,
    notice that the part is not solid, but rather hollow underneath, as the view in
    Figure 4.2 shows. The Shell Tool allows this type of construction to be easily
    modeled.


    FIGURE 4.1


    ![](img/30075d71cb1be5651669ffe0f9695010_133_1.png)


    FIGURE 4.2


    ![](img/30075d71cb1be5651669ffe0f9695010_133_2.png)


    119'
