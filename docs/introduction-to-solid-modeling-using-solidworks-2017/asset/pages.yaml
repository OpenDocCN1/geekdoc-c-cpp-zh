  md: '# DESIGN INTENT Symmetry in Modeling


    In this chapter we mirrored techniques for sketch entities and to define symmetric
    elements in a part. The four mounting holes in the bracket, which were created
    with a linear pattern, could have been defined with mirror commands. The advantage
    of doing so would be that if we change the dimensions of the bracket (6 inches
    by 4 inches), the hole positions would be updated to the correct positions. Same
    associativity between the hole locations and the size of the bracket can be added
    if a linear pattern


    is used, but will require the addition of equations, which will be explained in
    Chapter 5.


    Using symmetric elements in a part is good modeling practice. if a part contains
    planes of symmetry, plan your model to take advantage of those planes. In the
    bracket model, we centered the sketch about the origin. We placed the part so
    that the Right Plane coincided with the symmetry plane of the entire part, and
    the Top Plane coincided with an additional symmetry plane of the vertical portion
    of the part.


    The Feature-Extrude2 (the hole used) will be shown in the "Features to Pattern"
    indicating that this is the base for the linear pattern. "Direction 1" box in
    the PropertyManager will be highlighted; this allows the first direction of the
    pattern to be established.


    Click on the top horizontal edge of the rectangular base to establish the first
    direction, as shown in Figure 3.95. In the PropertyManager, set the Direction
    1 distance to 5 inches and the number of instances to 2, as shown in Figure 3.96.
    The Direction 2 box in the PropertyManager will be highlighted.


    Click on a vertical edge of the rectangular base to establish the second direction,
    as shown in Figure 3.97.


    FIGURE 3.95


    FIGURE 3.96


    FIGURE 3.97


    ![](img/30075d71cb1be5651669ffe0f9695010_120_0.png)'
