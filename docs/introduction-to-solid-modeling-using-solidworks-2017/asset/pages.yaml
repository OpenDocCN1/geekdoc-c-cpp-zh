  md: '# # CHAPTER 2 Engineering Drawings


    # Chapter Objectives


    Even companies that design parts exclusively with solid modeling software still
    need to produce 2-D drawings. A multiple-view 2-D drawing is the best way to design
    the design, showing all of the dimensions necessary to produce the part. Since
    no manufacturing process can produce "perfect" parts, the tolerances (variations
    from the stated dimension of a part) allowed for important dimensions are also
    shown on 2-D drawings.


    The SOLIDWORKS program allows for 2-D drawings to be quickly and easily produced
    from 3-D models. The drawing will be fully associative with the part file, so
    that changes to the part will be automatically reflected in the drawing, and vice
    versa.


    +   In this chapter, you will:

    * make a 2-D drawing from a SOLIDWORKS part,

    * create a custom drawing sheet format, and

    * use eDrawings software to create a drawing file that allows for easy sharing
    and collaborative editing.


    # 2.1 Drawing Tutorial


    In this tutorial, a 2-D drawing of the flange from Chapter 1 will be made.


    Open the SOLIDWORKS program. Click on the New Document Tool, as shown in Figure
    2.1. Select the Drawing icon, as shown in Figure 2.2, and click OK.


    FIGURE 2.1


    FIGURE 2.2


    ![](img/30075d71cb1be5651669ffe0f9695010_69_0.png)


    > * eDrawings is a trademark of Dassault Systèmes SolidWorks Corporation.


    55'
