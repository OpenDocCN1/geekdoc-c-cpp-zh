  md: '# Chapter 5 Parametric Modeling Techniques 159


    Add the two lines indicated in Figure 5.38 to close the sketch contour.


    If the lines are horizontal and vertical then the sketch should be fully defined.


    Select the Extruded Boss/Base from the Features group of the CommandManager. Extrude
    the rib as a Mid Plane Extrusion with a thickness of 0.125 inches, as shown in
    Figure 5.39.


    FIGURE 5.38


    ![](img/30075d71cb1be5651669ffe0f9695010_173_0.png)


    FIGURE 5.39


    ![](img/30075d71cb1be5651669ffe0f9695010_173_1.png)


    The result is shown in Figure 5.40.


    FIGURE 5.40


    While the geometry of the rib appears to be satisfactory, there are two areas
    where the defillets do not blend smoothly. These areas are the intersections between
    the rib and the fillets of the flange. The intersection at the lower fillet is
    shown in Figure 5.41; a similar area exists at the intersection with the upper
    fillet. We have a flat part (the rib mating with a curved surface (the fillet).
    The contour of the rib that matches extruded out to the mid-surface of the rib
    is slightly higher than the fillet''s. Although the difference is small, this
    type of mismatch can result in errors when extending the geometry to a 3-D printer,
    tool path generator, or element analysis program.


    FIGURE 5.41


    One solution to this mismatch would be to replace the extruded rib with one that
    by revolving the cross-section of the flange with a small angle. However, this
    would result in a rib that is much thicker towards the outer edge of the flange.
    We could try adding some small fillets to smooth the mismatched surfaces or use
    a revolved cut to remove the portions of the rib that extends beyond the fillets.
    This inch of creating a cutting tool that precisely matches the profile of the
    mid-surface of the rib, and sweep it around the center axis of the flange.


    One way to fix the rib profile is to open a new sketch and repeat the steps of
    identifying the silhouettes of the fillets and converting them to arcs'
