  md: '# Part Two Applications of SOLIDWORKS


    Analytically, the vectors can be added by adding the components of the two vectors.
    If we define an x-y coordinate system, each vector can be broken into its x and
    y components, as shown in Figure 10.2.


    FIGURE 10.2


    ![](img/30075d71cb1be5651669ffe0f9695010_290_0.png)


    The components of the resultant vector R are found by adding the components of
    A and B:


    | x component | y component |

    |---|---|

    | A | -60 cos (25°) = -54.38 lb. | 60 sin (25°) = 25.36 lb. |

    | B | 70 cos (60°) = 35.00 lb. | 70 sin (60°) = 60.62 lb. |

    | R | -19.38 lb. | 85.98 lb. |


    From the components, the magnitude and direction of R can be determined (See Figure
    10.3):


    FIGURE 10.3


    ![](img/30075d71cb1be5651669ffe0f9695010_290_1.png)


    $R = \sqrt{(19.38)^2 + (85.98)^2} = 88.14$ lb.

    $\theta = \tan^{-1} \left(\frac{85.98}{19.38}\right) = 77.3$ deg


    # 10.2 Vector Addition in SOLIDWORKS


