  md: '# # CHAPTER 13


    # ## The Use of SOLIDWORKS to Accelerate the Product Development Cycle


    # ### Introduction


    Any company that designs and/or manufactures products has seen an increase in
    global competition over the past decades. To remain competitive, there is pressure
    to develop new products. As a result, product models have shorter lives, and development
    costs are spread over a fewer number of units.


    With these increased pressures, there has been a greater emphasis on improving
    and accelerating the product development processes. While different industries
    and companies have their own unique procedures, there are some activities that
    are typically a part of a modern product development cycle:


    +   - Physical prototypes are used early and often.

    - Computer analysis is used extensively to complement physical testing.

    - Engineering functions are performed simultaneously as much as possible, necessitating
    better team work and data sharing.


    Solid modeling is an important tool in the product development process. The solid
    model becomes the common database used for a variety of engineering functions.
    In this chapter, we will explore two of the most common uses of solid modeling
    in product design: additive manufacturing and finite element analysis. We will
    also consider the challenge of managing and controlling the data produced during
    the product development cycle.


    # ### Chapter Objectives


    +   In this chapter, you will:

    - be introduced to the most popular additive manufacturing processes,

    - see how a stereolith file is used to define a solid part,

    - learn how to create an .stl file,

    - be introduced to the capabilities and limitations of finite element analysis,

    - learn about Product Data Management software.


    ![](img/30075d71cb1be5651669ffe0f9695010_365_0.png)'
  merge: -1
  pgno: 365
- img_proc: true
  md: '# Additive Manufacturing


    Additive manufacturing (AM), which is also widely known as “3D printing,” is a
    technology that is closely allied with solid modeling. In additive manufacturing,
    parts are built layer-by-layer using equipment driven by computer models of the
    part being built. The layer-by-layer building process is called an additive process
    to contrast it with traditional subtractive machining processes which start with
    solid material stock and create the part by cutting away material.


    Additive manufacturing technologies can be grouped into the following seven broad
    categories:


    +   - vat polymerization,

    - powder bed fusion,

    - material extrusion,

    - binder jetting,

    - material jetting,

    - sheet lamination, and

    - directed energy deposition


    ![](img/30075d71cb1be5651669ffe0f9695010_366_0.png)


    Vat polymerization was the first AM technology to be commercially introduced.
    In these types of process, parts are built using a liquid resin that cures by
    exposure to a certain wavelength of light. A light source is used to selectively
    cure the resin, as driven by a computer model of the part. *Stereolithography*
    was the first commercially available version of this, and is still the most widely
    used vat polymerization technology. In this process, a photopolymer, a liquid
    resin that cures under the application of certain wavelengths of light, is cured-by-layer
    by a precisely guided laser. The SLA process is illustrated in 13.I. The part
    is submerged in a photopolymer, supported on an elevator platform. The fabrication
    of each layer begins with the elevator lowering the thickness of a layer, typically
    around 0.005 inches. The part is then covered by cured. A mirror directs the laser
    beam across the area to cure that particular cross-section. Laser power and the
    speed of the beam across the resin surface are controlled to ensure a complete
    cure of the resin while maximizing the speed of the process. When all of the layers
    are completed, which is typically several hours after the beginning of the build,
    the elevator lifts the finished part out of the resin. Cleaning the part with
    a solvent and curing in a UV oven to complete the cure of the photopolymer are
    usually the only steps necessary to finish the part. Other forms of vat polymerization,
    which use light projectors to cure the layers of material, are currently in production.
    These offer build speeds faster than traditional beam-steered laser systems, as
    entire layers can be cured at instant.


    Powder bed fusion processes are those in which a fine powder of material is exposed
    to an energy source, which melts the material into a solid part. The most common'
  merge: -1
  pgno: 366
- img_proc: true
  md: '# Chapter 13 The Use of SOLIDWORKS to Accelerate the Product Development Cycle
    353


    example of this process is caused by Selective Laser Sintering (SLS). In this
    process, powder is sintered or fused, by the heat from a precisely guided laser
    beam. The SLS process is illustrated in Figure 13.2. As each layer is completed,
    the build platforms by the thickness of one layer, and a fresh layer of powder
    is spread over the part and level. The laser is indented onto the new powder layer,
    sintering the powder in the desired shape. A major advantage of this and other
    powder fusion processes is that many materials, including nylon, polycarbonate,
    and various others can be used. Another advantage of these processes is for complex
    parts as it is being built. In most other AM processes, supporting structures
    must be built for complex parts, and removed in a post-processing operation.


    FIGURE 13.2


    ![](img/30075d71cb1be5651669ffe0f9695010_367_0.png)


    Material extrusion processes are perhaps the most commonly seen throughout industry,
    academic institutions, and even today. The most common form of this technique
    is called Fused Deposition Modeling (FDM). The FDM process is illustrated in Figure
    13.3. The FDM process is thought of as precisely directing a fine hot-glue line
    to build up a part. The thermoplastic material (such as ABS, polycarbonate, or
    PLA) is fed from a spool. In large industrial systems, there are actually two
    feeds and extruder heads, as the material for building support structures is different
    from the part material, to dissolve in water or another solvent. Introduction
    of FDM was especially significant in that no laser or hazardous materials were
    required, allowing the machine to be placed in an office environment (although
    the machines should be used in well-ventilated areas to minimize fumes from the
    plastic).


    FIGURE 13.3


    ![](img/30075d71cb1be5651669ffe0f9695010_367_1.png)


    Jinter processes can be thought of as being similar to powder fusion processes,
    that instead of using a laser to sinter the powder together, an inkjet printer
    head is used to spread binder fluid onto the surface of the part. A powder-based
    concept model is shown in Figure 13.4. Notice the cross-section of the ribbed
    flange part from Chapter 5 printing.


    FIGURE 13.4


    ![](img/30075d71cb1be5651669ffe0f9695010_367_2.png)


    Material jetting processes are similar in concept to traditional inkjet jet printing,
    except'
  merge: -1
  pgno: 367
- img_proc: true
  md: '# 354 Part Two Applications of SOLIDWORKS


    drops of material are deposited in layers on an indexing platform rather than
    ink on paper. The layers are cured, generally with exposure to a UV light source.
    This process has again well-suited to production of parts from multiple materials,
    as multiple print heads with different materials can be used to print on a single
    layer before curing.


    In lamination processes, the individual layers are cut to shape using some form
    of subtractive manufacturing, generally a laser or computer-guided cutting system.
    These layers then fused together into a solid part, using either adhesives or
    ultrasonic welding. The materials available from paper to plastics to sheet metal.


    Directed energy deposition is an emerging technology for additive manufacturing
    of metal parts. It uses a very high power source, such as an electron beam, to
    deposit and fuse together material provided in the form of a powder or wire. In
    some sense, it can be thought of as producing a solid part through computer-controlled
    welding. These systems are very expensive to purchase and operate. They produce
    very high quality functional parts.


    Additive manufacturing techniques have long been used for prototyping of mechanical
    components, but as speed has increased and material properties have improved these
    techniques are finding acceptance in the production of end-use components for
    both industrial and commercial applications. While production quality can cost
    several hundred thousand dollars, low-cost machines based on FDM and even SLA
    technology can be found for a few thousand dollars. Low-cost machines based on
    FDM technology can be found for a few hundred dollars. Web-based businesses where
    hobbyists upload solid model files and have them built using AM processes are
    becoming popular, and have made the term "3D printing" a household term.


    Most modern AM machines accept as input a type of file called stereolith (.stl)
    file. The structure of an .stl file is quite simple: the surfaces are broken into
    sets of triangles, the simplest planar area. Each triangle is defined by four
    parameters: the coordinates of the three corners, and a normal vector that points
    away from the part, identifying which of the two faces of the triangle represents
    the outer surface of the part.


    FIGURE 13.5


    FIGURE 13.6


    To illustrate how an .stl file defines a solid part, consider the simple part
    shown in Figure 13.5. Since this part has only flat, rectangular surfaces, two
    triangles can exactly define each surface, as shown in Figure 13.6. Since the
    part has six surfaces, the part can be described by 12 triangles.


    ![](img/30075d71cb1be5651669ffe0f9695010_368_0.png)'
  merge: -1
  pgno: 368
- img_proc: true
  md: '# Chapter 13 The Use of SOLIDWORKS to Accelerate the Product Development Cycle
    355


    To illustrate how an .stl file is created for curved surfaces, consider the ribbed
    flange part modeled in Chapter 5, which is shown in Figure 13.7.


    To create an stl file from a SOLIDWORKS part, select File: Save As from the main
