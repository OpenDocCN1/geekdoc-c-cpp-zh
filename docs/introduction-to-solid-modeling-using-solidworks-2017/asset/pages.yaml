    Although part was modified with the decimal places set to 3, the number of decimal
    places does not affect the accuracy of the model, only the way the dimensions
    are displayed. For a drawing, the number of decimal places should be related to
    the tolerance level of the most dimensions. Note that there is an option for setting
    the unit of dimension lengths. Often drawings,


    show one of dimensions in the primary unit and a second set of dimensions in boxes.
    In this way, both US and SI units can be displayed on a single drawing. Since
    we need both units, we do not need to change the default setting. As the part
    that we modified and saved in Chapter 1, we have set the number of decimal places
    twice. Since the number of decimal places can be changed in two places, we have
    set both number of decimal places in places to ensure they are saved in the drafting
    template.


    Before saving these settings in a template, we will set the type of projection
    to third angle. The third-angle option displays the Front, Top, Right, and With
    View in the lower left position (standard for most US drawings), while the first-angle
    option displays the Front, Top, and Left Views, with the Front View in the upper
