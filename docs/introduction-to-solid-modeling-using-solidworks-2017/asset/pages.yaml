  md: '# CHAPTER 8 Assembly Drawings


    # Introduction


    In Chapters 6 and 7, the development of solid models of assemblies from SOLIDWORKS
    part files was described. In this chapter, the documentation of these assemblies
    through the use of 2-D assembly drawings will be introduced.


    # Chapter Objectives


    +   In this chapter, you will:

    - create a 2-D assembly drawing.

    - incorporate an exploded view into an assembly drawing, and

    - generate a Bill of Materials.


    # 8.1 Creating an Assembly Drawing


    In this section, an assembly drawing of the assembly created in Chapter 6 will
    be produced.


    Open the assembly file "Door.LSADM.\ Make sure that the assembly is in the "collapsed"
    configuration. Click the arrow next to the New Document Tool, and select Make
    Drawing from Part/Assembly, as shown in Figure 8.1.


