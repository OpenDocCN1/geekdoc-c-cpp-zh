  md: '# Exploiting Associativity


    In Chapter 1, we defined the position of the bolt in the flange by creating a
    construction circle and specifying the diameter of the circle. Alternatively,
    we could have located a single hole by specifying its radial dimension from the
    center point of the flange. We modeled the flange, either dimensioning technique
    would locate the first hole in where we wanted, and either alternative would be
    acceptable. When drawing the dimension, however, we see that drawing a bolt circle
    and dimensioning its diameter is the preferred way to show the radial dimension
    of the bolt holes.


    the distance was defined by a radial dimension, then we could simply define the
    radial dimension in the drawing, adding a construction circle, and add a new dimension.
    However, the new dimension would not be associative with the part. That is, the
    added 4.2-inch dimension would not change the bolt hole positions, and changing
    the radial dimension would not cause the drawing to be updated. Therefore, maintaining
    full associativity between the part and the drawing would require editing of the
    part file.


    The font for dimension can be changed individually, but if you want to change
    the font type or for all dimensions, you can do that from the Document Properties.


    Select the Options Tool. Under Document Properties, select Dimensions, click the
    Font button, and select a font and font size. The section size may be input in
    inches or points. The figures in the remainder of this chapter were made with
    the default font (Century Gothic) at a size of 18 points. Click OK to apply the
    selected font.


    # FIGURE 2.30


    A section view will help show the center hole and the chamfer more clearly.


    Click the View Layout tab on the CommandManager, and select the Section View Tool
    as shown in Figure 2.30.


    # FIGURE 2.31


    In the PropertyManager, make sure that Section is selected (so that a full view—one
    that passes completely through the part—will be created). Select the horizontal
    section option, as shown in Figure 2.31.


    ![](img/30075d71cb1be5651669ffe0f9695010_76_0.png)


