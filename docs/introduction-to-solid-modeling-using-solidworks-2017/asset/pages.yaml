  md: '# 372 Appendix B The SOLIDWORKS Interface: Use and Customization


    FIGURE B.4


    Note that these toolbars are ''docked'' to the left and right edges of screen.
    A toolbar can be moved from its default position by clicking and dragging the
    ''handle'' at the top or left of a docked toolbar, as shown in Figure B.4. (If
    the handle is not present, the ''Lock Commander and toolbars'' checkbox shown
    in Figure B.2 is properly checked). The toolbar can be docked to another position
    any edge of the screen, as shown in Figure B.5, or ''floated'' over the graphics
    area, as shown in Figure B.6 (an exception is the Head-Up View Toolbar, which
    is edited or turned off, but is always positioned at the top of the graphics area).


    ![](img/30075d71cb1be5651669ffe0f9695010_386_0.png)


    FIGURE B.5


    When floated, the toolbar''s handle can be moved by clicking and dragging its
    title bar. The toolbar can be re-sized by clicking and dragging an edge of the
    toolbar, as shown in Figure B.7 (although the re-sizing of some tools is limited
    by the way in which tools are grouped within a toolbar). Clicking the X in the
    upper right corner of the toolbar closes that toolbar, and it can be reopened
    as described in the next paragraph.


    ![](img/30075d71cb1be5651669ffe0f9695010_386_1.png)


    FIGURE B.6


    There are many other toolbars available. To select the complete list, Customize
    from the pull-down menu beside the Options Tool (or right-click any toolbar or
    the CommandManager). Any active toolbar will have a check mark beside its name.
    To open another toolbar, click to place a check, as shown in Figure B.8 Note that
    if the toolbar is docked in a position where there is not enough space for all
    tools to be displayed, as shown in Figure B.9, then a double-arrow at the bottom
    or right end of the toolbar indicates that not all tools are shown. Clicking on
    the double-arrow displays the hidden tools, as shown in Figure B.10.


    ![](img/30075d71cb1be5651669ffe0f9695010_386_2.png)


    FIGURE B.7


    The advantage of using toolbars instead of the CommandManager is that all tools
    are available with a single mouse click, while with the CommandManager it is often
    necessary to click once to expand the group of tools and then again to select
    the desired tool. For new users, the CommandManager is preferred because many
    tools have text labels.


