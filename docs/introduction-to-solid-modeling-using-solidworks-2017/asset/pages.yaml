  md: '# Open a new part.


    You will notice that some of the changes made earlier to the interface, such as
    the number of tabs on the CommandManager and the tools on the Heads-Up Toolbar,
    are still in effect. Others, such as the background color, have reverted to the
    initial settings and need to be changed again. These document-specific settings
    are stored in the Part template. We will edit the template so that we do not have
    to make these changes every time we begin a part.


    Change the background color to Plain White from the Apply Scene Tool of the Heads-Up
    Toolbar. Select the Options Tool, and click the Document Properties tab. Change
    the drafting standard to ANSI. Under Dimensions, select the Primary precision
    to .123 (three decimal places). Select Grid/Snap, and check the box labeled “Display
    Grid.” Select Units, and change the unit system to IPS, the number of decimals
    for length dimensions to .123, and the number of decimals for angles to None.


    Note that we have set the number of decimal places in two separate locations.
    The number of places can be changed in either location; by setting both to .123
    we ensure the template will be set correctly.


    Any of the other settings you want to change can be stored in the Document Properties
    tab in the template. For example, you may want to change the font for dimensions
    or turn the display of the grid (most of the parts in this book are made with
    a larger font and with the grid for clarity).


    # FIGURE 1.148


    ![](img/30075d71cb1be5651669ffe0f9695010_50_0.png)


    From the main menu, select File: Save As. Change the file type to Templates (*.prtdot).
    Click on the file “Part.prtdot” to select it, as shown in Figure 1.148, and click
    Save. Click Yes when asked if you want to replace the existing template.


    The next time you begin a new part, the settings that you just made will be effective.
    Note that when you changed the file type to Templates, the working directory automatically
    changed to default directory for SOLIDWORKS. This directory is located in the
    Program Files or Data directory on the drive containing your operating system.
    Furthermore, it is not a


    good to store your work. The next time you save a document, the directory will
    default to the last one accessed; in this case the directory where the templates
    are saved. Make sure to change the directory to the one you want before saving
    your documents. We will note this when we save the pull file later in this section.'
