  md: '# 126 Part One Learning SOLIDWORKS


    # FIGURE 4.32


    Select the Front Plane from the FeatureManager. Click on the Section View Tool
    in the Heads-Up Toolbar, as shown in Figure 4.32. Click the check mark, and the
    cross-section of the part is displayed, as shown in a Front View in Figure 4.33.


    ![](img/30075d71cb1be5651669ffe0f9695010_140_0.png)


    Note that we pre-selected the Front Plane as the section plane, but either of
    the other principal planes (Top or Right) can be selected from the PropertyManager.
    Also, the section plane can be offset from the selected principal plane by entering
    an offset distance in the PropertyManager or by dragging the arrow that appears
    when the Section View Tool is selected.


    # FIGURE 4.33


    Zooming in the filleted edges shows the problem. Because the filletting was performed
    after the shell operation, the wall is thinner than desired at the upper corners,
    as shown in Figure 4.34. (Similarly, the wall is thicker than desired in the lower
    corners.)


    # FIGURE 4.34


    To correct this problem, we could fillet the sharp corners to maintain a constant
    wall thickness. We could also shell the part after creating the fillets. It is
    the easier way to produce the constant wall thickness. It is not necessary to
    delete the fillet and shell operations and redo them in the proper order; we simply
    redo them in the FeatureManager.


    Click on the Shell in the FeatureManager, as shown in Figure 4.35, and hold down
    the left mouse button.


    Drag the cursor until the arrow and the pop-up message indicate that the Shell
    will be moved after the second fillet, as shown in Figure 4.36.


    Release the mouse button, and the features are reordered, as shown in Figure 4.37.


    # FIGURE 4.35


    ![](img/30075d71cb1be5651669ffe0f9695010_140_1.png)


    # FIGURE 4.36


    ![](img/30075d71cb1be5651669ffe0f9695010_140_2.png)


    # FIGURE 4.37


    ![](img/30075d71cb1be5651669ffe0f9695010_140_3.png)


    The wall thickness is now constant, as shown in Figure 4.38. Note that not all
    features can be reordered, as some operations will be based on geometries created
    by prior operations.


    # FIGURE 4.38


    ![](img/30075d71cb1be5651669ffe0f9695010_140_4.png)


    Click on the Section View Tool.


    This will toggle off the display of the section view.'
