  md: '# 42 Part One Learning SOLIDWORKS


    # DESIGN INTENT Choosing the Initial Sketch Plane


    The choice of the initial sketch plane for a part should be considered before
    the first sketch. Standard practice is to orient the part so that the Front View
    provides the best visualization of part of all the principal views (Front, Back,
    Top, Bottom, Right, and Left). The Trimetric View, which emphasizes the front
    of the part, provides the best (3-D) view. As we will see in Chapter 2, continuing
    the part properly will make the creation of a multi-view drawing easier, as well.
    For the flange part created earlier the initial circle in the Front Plane resulted
    in the proper orientation of the flange.


    ![](img/30075d71cb1be5651669ffe0f9695010_56_0.png)


    In the case of the pulley, which is created by evolved views, the circular profile
    of the part is the most descriptive view, so we choose the Right Plane as the
    sketch plane for our initial sketch. We could have also sketched in the Top Plane
    and achieved the same result.


    Once a part has been created in a certain orientation, it is difficult to re-orient
    it. There is no command to rotate the part relative to the axes. It is possible
    to change the plane in which a sketch is contained by right-clicking the sketch
    in the FeatureManager


    selecting Edit Sketch Plane. However, this may cause errors in subsequent features.
    Therefore, it is good practice to carefully consider the orientation of the part
    before selecting the initial sketch plane.


    When using either the Centerline Tool or Line Tool, note that there are two different
    methods for drawing line segments. If you click once to set the first endpoint,
    move the cursor and then click to set the other endpoint, you can then move the
    cursor to create another line segment at the previous endpoint. This technique
    allows you to double-click after the last endpoint has been placed which allows
    you to start a new group of segments, while de-pressing the Esc key turns off
    the Line or Centerline Tool. The second method is used to create discontinuous
    line segments. Click to place the first endpoint, and hold the mouse button while
    dragging to the other end. Releasing the mouse button places the second endpoint.
    The cursor can then be moved to the starting point of a new segment.'
