    It should be noted that the display of the sketch relation icons can be toggled
    on and off by selecting View: Sketch Relations from the Main Menu. There may be
    occasions where a sketch becomes cluttered that turning off the display of the
    relation icons is desirable, but in most cases the display icons is helpful when
    creating and editing sketches.


    ![](img/30075d71cb1be5651669ffe0f9695010_48_1.png)


    FIGURE 1.142


    ![](img/30075d71cb1be5651669ffe0f9695010_48_2.png)


    As we have noted, both dimensions and relations are used to fully sketch geometry.
    As a general rule, we try to use as few dimensions as possible and rely on relations
    to complete the geometry definition. For example, consider the T-beam section
    of Figure 1.142. The sketch consists of horizontal and vertical lines, and the
    bottom line is fixed to the origin. To fully define the sketch, six dimensions
    are required. However, the design intent of the part is made from this sketch.
    We probably desire two "legs" at the top of the section to be the same thickness
    and width. Therefore, we can delete two dimensions and replace them with the relations
    shown in Figure 1.143. The advantage of this approach is


    ![](img/30075d71cb1be5651669ffe0f9695010_48_3.png)


    if we make a change, say to the thickness of the legs, we have only one dimension
    to change, and our design intent of equal dimension is maintained. Another solution
    is shown in Figure 1.144, where the relation of a single point to the origin has
    been replaced by a vertical centerline and a symmetric relation of two sides about
    the centerline. Either of these solutions causes the pre-defined Right Plane to
    become a plane of symmetry of the resulting part (assuming that the sketch is
    in the Front Plane). The use of symmetry is good design practice, and will be
    emphasized in the pulley tutorial in the next section and in the tutorials of
    Chapter 3.


    FIGURE 1.144


