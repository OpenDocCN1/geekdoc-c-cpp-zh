  md: '# Appendix B The SOLIDWORKS Interface: Use and Customization


    such as copy and paste, match standard Windows shortcuts. A list of some of the
    most handy keyboard shortcuts is shown here:


    | KEY(S) | COMMAND |

    |---|---|

    | Viewing Tools | |

    | F | Zoom to fit: entire model to be seen |

    | Z | Zoom out |

    | Shift + Z | Zoom in |

    | Space Bar | Orientation: displays a pop-up menu of standard view orientations
    |

    | F10 | Toggle Filters: toggles the toolbars and CommandManager to provide a larger
    graphics |

    | Selection Tools | |

    | E | Filter Edges: allows only edges to be selected |

    | X | Filter Faces: allows only faces to be selected |

    | F6 | Toggle Filters: toggles the selected filter off and on |

    | File Tools | |

    | Ctrl+N | New File |

    | Ctrl+O | Open File |

    | Ctrl+P | Print |

    | Ctrl+S | Save File |

    | Other Commands | |

    | F6 | Shortcut Bar |


    A note about the selection filter tools, which are often used in assembly mates
    to assist in selecting the proper entity: when a selection filter is active, a
    "filter" icon appears next to the cursor, as shown in Figure B.42. When a selection
    filter is active, then only the type of entity specified by the filter can be
    selected. Occasionally, a user will press a key by accident (most likely the X
    key), which causes a filter to become active, preventing any other selections.
    If this happens, pressing the F6 key clears the filter.


    ![](img/30075d71cb1be5651669ffe0f9695010_393_0.png)


    Another way of selecting some commands is with mouse gestures. When mouse gestures
    are enabled, holding the right mouse button while moving the mouse slightly in
    any direction displays a circular menu like the one shown in Figure B.43. If the
    mouse is moved to any of the segments of the circle, then the corresponding command
    is executed. Mouse gestures are controlled by selecting Customize from the pull-down
    menu beside the Options Tool


    ![](img/30075d71cb1be5651669ffe0f9695010_393_1.png)'
  merge: -1
  pgno: 393
- img_proc: true
  md: '# 380 Appendix B The SOLIDWORKS Interface: Use and Customization


    and selecting the Mouse Gestures tab, as shown in Figure B.44. If mouse gestures
    are enabled, the menu can be set to include four commands, as shown in Figure
    B.43, or eight commands, as shown in Figure B.45. The commands on the Mouse Gestures
    menu are context-dependent. The commands in Figures B.43 and B.45 are associated
    with part and assembly documents; a different set of commands is displayed in
    drawings or if a sketch is active. Mouse gestures may seem awkward at first, but
    with practice some users will find them useful.


    FIGURE B.44


    ![](img/30075d71cb1be5651669ffe0f9695010_394_0.png)


    FIGURE B.45


    ![](img/30075d71cb1be5651669ffe0f9695010_394_1.png)


    In this Appendix, we have seen that the SOLIDWORKS User Interface allows for multiple
    ways to select commands and for a great deal of customization to fit a user’s
    preferences. In this book, we focus primarily on the CommandManager and the Heads-Up
    Toolbar to select commands, with a minimal amount of customization (such as adding
    the Rotate View, Pan, and Trimetric View Tools to the Heads-Up Toolbar), and we
    recommend that new users limit customization. Experienced users will no doubt
    find many individual preferences for setting up and using the interface.'
