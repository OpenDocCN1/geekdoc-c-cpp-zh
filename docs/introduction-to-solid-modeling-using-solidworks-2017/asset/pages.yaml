    Select the variable Ribs from the list, as shown in Figure 5.73.


    Note that we have created only one variable; if we had created more, each would
    appear in the Global Variables list.


    Click the check mark to complete and evaluate the equation. Click OK to close
    the dialog box.


    This equation establishes a parametric relation that ties the number of holes
