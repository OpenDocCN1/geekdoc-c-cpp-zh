  md: '# About the Authors


    Ed Howard is an Associate Professor in the Department of Engineering at East Carolina
    University, where he teaches classes in solid modeling, engineering computations,
    solid mechanics, and composite materials. Prior to joining ECU, Ed taught at Milwaukee
    School of Engineering. He holds a BS in Civil Engineering and an MS in Engineering
    Mechanics from Virginia Tech, and a Ph.D. in Mechanical Engineering from Marquette
    University.


    Ed worked in design, analysis, and project engineering for 14 years before beginning
    his academic career. He worked for Thiolokol Corporation in Smyrna, TN, Spaulding
    Composites Company in Smyrna, TN, and Sta-Rite Industries in Delavan, WI. He is
    a registered Professional Engineer in Wisconsin.


    Joe Musto is a Professor in the Mechanical Engineering Department at Milwaukee
    School of Engineering, where he teaches in the areas of machine design, solid
    modeling, and numerical methods. He holds a BS degree from Clarkson University,
    and both an M.Eng. and Ph.D. from Rensselaer Polytechnic Institute, all in mechanical
    engineering. He is a registered Professional Engineer in Wisconsin.


    Prior to joining the faculty at Milwaukee School of Engineering, he held industrial
    positions with Brady Corporation (Milwaukee) and Eastman Kodak Company (Rochester,
    NY). He has been using and teaching solid modeling using SOLIDWORKS since 1998.


    Joe and Ed, together with Rick Williams of East Carolina University, are the authors
    of Engineering Computations: An Introduction using MatLab® and Excel®, part of
    the McGraw-Hill “Best” Series.'
