  md: '# CHAPTER 7


    # Advanced AssemblynOperations


    # Introduction


    In Chapter 6, the basic operations required to create a SOLIDWORKS assembly were
    introduced. In this chapter, some advanced modeling, visualization, and analysis
    operations will be developed. The new assembly model that will be created is shown
    in Figure 7.1. It includes the door assembly created in Chapter 6, as well as
    additional part models.


    ![](img/30075d71cb1be5651669ffe0f9695010_241_0.png)


    # Chapter Objectives


    In this chapter, you will:


    +   - use an assembly model as a subassembly in a more complex assembly model,

    - create an assembly model that allows for motion between components, and

    - use the interference detection and collision detection features to analyze the
    assembly model.


    # 7.1 Creating the PartnModels


    Two additional parts must be created for the new assembly model.


    The first model that we will create is the hinge pin.


    Open a new part, and sketch a 0.5-inch diameter circle in the Right Plane, centered
    at the origin. Extrude it 4 inches. Add a 1-inch diameter cap on the pin, extruding
    away from the pin body 0.25 inches.


    The pin is shown in Figure 7.2. Using a new color for this component will aid
    in visualization of the final assembly.


    ![](img/30075d71cb1be5651669ffe0f9695010_241_1.png)


    227'
