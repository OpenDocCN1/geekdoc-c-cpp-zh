  md: '# 4.2 Parts Created with Swept Geometry


    In this section, we will learn how to create a solid by “sweeping” a cross-section
    along a path. We will start with a simple part in which the path is planar. Later,
    we will use a helix curve to form a helical spring. In the next section, we will
    introduce the 3-D sketch, which will be used to define a sweep path in 3-D space.


    The first part that we will create is a bent tubing by creating the sweep path.
    The geometry of the sweep path, which defines the centerline of the tubing, is
    shown in Figure 4.53.


    Open a new part. Select the Top Plane from the FeatureManager. Choose the Line
    Tool from the Sketch group of the CommandManager, and draw a vertical line beginning
    at the origin. Choose the Tangent Arc Tool, and drag out an arc from the line,
    as shown in Figure 4.54.


