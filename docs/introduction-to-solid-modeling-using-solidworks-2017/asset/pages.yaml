  md: '# 2.2 Creating a Drawing Sheet Format


    Most engineering drawings include a title block and a border. The title block
    can include a large amount of information. In addition to basic data, such as
    the name of the part, part number, the date created, etc., many companies require
    the names or initials of who must approve the drawing before it is released to
    users. Some require a revision history that tracks changes made to the drawing.
    Others require the listing of information about where the drawing is used in assemblies.


    The SOLIDWORKS program includes several default title blocks and borders, sheet
    formats. These sheet formats can be edited to fit the particular needs of a company.
    The sheet formats are different for every standard paper size. In this section,
    we will create a simple sheet format for A-size drawing. Our format will include
    some basic information without taking up much room on the sheet. Rather than modifying
    an existing title block, we will build it from scratch.


    Open a new drawing. Choose A-Landscape as the paper size; leave the "Sheet format"
    box unchecked, as in Figure 2.70. Check the X in the PropertyManager to close
    the Model View command, as shown in Figure 2.71.


    ![](img/30075d71cb1be5651669ffe0f9695010_85_0.png)


    Note that you can prevent the Model View from starting automatically by clearing
    the mark from the box labeled "Start command" when creating a new drawing in the
    PropertyManager. However, since we will be creating a drawing from an existing
    part, we will allow the command to continue to start automatically.


    Right-click in the drawing space. Select Edit Sheet Format, as shown in Figure
    2.72.


    In a drawing, you can toggle editing the drawing itself and editing the sheet
    format, which contains the title block and border.


    ![](img/30075d71cb1be5651669ffe0f9695010_85_1.png)'
