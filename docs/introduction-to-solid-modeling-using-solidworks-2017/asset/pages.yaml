  md: '# Chapter 3 Additional Part Modeling Techniques


    Select the Smart Dimension Tool, and add the four dimensions from Table 3.1, as
    shown in Figure 3.18. Click the Esc key to turn off the tool.


    FIGURE 3.18


    ![](img/30075d71cb1be5651669ffe0f9695010_103_0.png)


    There is an almost limitless number of ways to relate relations that will fully
    define the sketch, utilizing equal, symmetric, and/or collinear relations. The
    method presented here is probably the simplest, in which two additional relations
    are required.


    Select the four horizontal lines shown in Figure 3.19 and add an equal relation.


    The result of this relation in Figure 3.20 is that the entire sketch is symmetric
    about the vertical center. To determine whether other relations are needed, it
    is helpful to see which entities are still blue, indicating that they are defined.
    Another way to determine is to find entities not fully defined and to drag a corner
    point. If the point does not move, then position is defined. If the point moves,
    then the allowable movement is an indication of the relation needed to fully define
    the sketch. For example, if you click and drag the corner point shown in Figure
    3.21, you will see that downward movement of the bottom flange is allowed, indicating
    that the thickness of the bottom flange is not defined. You also see that it moves
    along with the left portion as result of the collinear relation that was applied
    automatically during the earlier operation. Finally, you will notice that left-to-right
    movement of the point is not possible, indicating that the point''s position in
    that direction X-coordinate in the Property Manager) is fixed. By moving the point,
    it is easy to confirm that a relation is needed to define the thickness of the
    bottom flange.


    FIGURE 3.19


    ![](img/30075d71cb1be5651669ffe0f9695010_103_1.png)


    FIGURE 3.20


    ![](img/30075d71cb1be5651669ffe0f9695010_103_2.png)


    Select the two lines shown in Figure 3.22, and add an equal relation.


