  md: '# DESIGNINTENT Manufacturing Considerations


    The placement of the holes in the hatch and the hinges can be accomplished in
    one of three ways, and each way simulates a different approach to the manufacturing
    of the door assembly. First, the holes could be added to the hatch at part level,
    just as they are in the hinge. In the final method, the step hatch and the hinges
    would be received with the holes in place. The hinges would be aligned with the
    hatch, and the fasteners. In this method, the holes would be classified as part-level
    features. In the second method, neither the hinge nor the hatch would have holes
    before arriving at assembly, the holes would be classified as assembly-level features.
    In the third method, the hatch would be without


    holes, and the hinges received with the holes pre-drilled. The holes in the hatch
    would drill to match the holes in the hinge. This is the method developed in the
    tutorial. In this case, we have combined a part-level feature (the holes in hinges)
    with assembly-level features (the holes in the hatch). Although the final method
    would look the same regardless of which, the definition of where the holes are
    added is an important consideration in the manufacturing process, and the method
    used to create the solid model should represent the actual manufacturing steps.


    FIGURE 6.101


    ![](img/30075d71cb1be5651669ffe0f9695010_228_0.png)


    Sketch lines can be added to the exploded view to show how the parts fit together.
    Although they are not really necessary for a simple assembly as our, they can
    be very helpful in more complex assemblies.


    Explode Line Sketch Adds or edits a 3D sketch the relationship between exploded
    components.


    Select the Explode Line Sketch Tool from the Assembly group of the CommandManager,
    as shown in Figure 6.101.


    A-3D sketch will be opened. By default, the Route Line Tool will be active, as
    shown in Figure 6.102.


    FIGURE 6.102


    FIGURE 6.103


    Click on the lower half of the cylindrical surface of one of the edge of the corresponding
    hole in the hatch, as shown in Figure 6.103. Click the check mark to create the
    sketch line.


    ![](img/30075d71cb1be5651669ffe0f9695010_228_1.png)'
  merge: -1
