  md: '# Chapter 5 Parametric Modeling Techniques


    FIGURE 5.91


    Select the Extruded Cut Tool from the Features group of the CommandManager, and
    extrude a cut 0.245 inches deep to form the hex socket in the head, as shown in
    Figure 5.91.


    While screw threads can be modeled as solid features with the Thread Tool, this
    is rarely done, since it can slow down the performance of your computer. Also,
    since they are standardized, the thread profiles are not required to specify them
    on a drawing. Rather, cosmetic threads, graphical features used to show the threaded
    regions, are much more commonly used. Cosmetic threads can be added to any cylindrical
    feature.


    FIGURE 5.92


