  md: '# DESIGN INTENT Planning the Model


    As we build the 2.75-inch diameter of our flange, we can choose from two existing
    planes/surfaces or construct a new plane. The choice of constructing a new plane
    in order to allow us to add draft to our part is an example of design intent.
    There are ours:


    Design intent is the consideration of the end use of a part, and possible changes
    to the part, when creating a solid model.


    Throughout this book, we will identify examples of considering design intent when
    modeling.


    # FIGURE 1.65


    As shown by the preview (Figure 1.65), the extrusion is going away from the base
    feature rather than toward.


    In the PropertyManager, click the Reverse Direction button so that the extrusion
    is directed towards the base (Figure 1.66). In the pull-down menu, select Up Next
    as the type of extrusion, as shown in Figure 1.67. Click the check mark to complete
    the extrusion, which is shown in Figure 1.68.


    Using "Up Next" as the type of extrusion instead of defining the allows changes
    to be made easily. If we later decide to change the distance between Plane1 and
    the Front Plane, then the part will rebuild correctly; by default, the extrusion
    will still extend back to the base feature. Notice that by default, the "Merge
    result" option is chosen when adding a new feature. With this option, the two
    features that we have created combine to form a single solid. If the option is
    unchecked, then the features represent separate bodies.


    We can turn off the display of Plane1.


    From the Hide/Show Items Tool, click on the View Planes icon to toggle off the
    display of planes, as shown in Figure 1.69.


    # FIGURE 1.66


    # FIGURE 1.67


    # FIGURE 1.68


    # FIGURE 1.69


    ![](img/30075d71cb1be5651669ffe0f9695010_32_0.png)


    ![](img/30075d71cb1be5651669ffe0f9695010_32_1.png)


    ![](img/30075d71cb1be5651669ffe0f9695010_32_2.png)


    ![](img/30075d71cb1be5651669ffe0f9695010_32_3.png)


    Plane1 still exists in the model, but turning the display of planes results in
    a less cluttered view. Note that Plane1 could have been hidden by clicking its
    entry in the FeatureManager and selecting Hide.


    It is a good idea to save your work periodically.'
