  md: '# 3.3 Sharing and Displaying the Solid Model


    # FIGURE 3.103


    In Chapter 2, we created an eDrawing of a 2-D drawing. You can create an eDrawing
    of a part. An eDrawing can be viewed by anyone who downloads the free eDrawing
    viewer. The small file sizes of eDrawings make them easy to share via e-mail.


    Open the bracket created in the last section. From the main menu, select File:
    Publish to eDrawing, as shown in Figure 3.103.


    The eDrawing programs will open, and the bracket model will be displayed, as shown
    in Figure 3.104. Although the eDrawing models does not contain the history of
    the steps we used to create it, and cannot be edited, it contains the geometric
    data sufficient to view the model from various angles and view a cross-section,
    and it also contains the mass properties data.


    Click the Animate button, and the Next button will appear. Click the Next button
    several times, as shown in Figure 3.105.


    # FIGURE 3.104


    ![](img/30075d71cb1be5651669ffe0f9695010_122_0.png)


    # FIGURE 3.105


    ![](img/30075d71cb1be5651669ffe0f9695010_122_1.png)


    The Model View will shift from the Default View from the SOLIDWORKS file (trimetric)
    to isometric, and to each of the principal views. The Play button will automatically
    rotate the part through the various views until the Stop button is pressed. The
    Reset button


    # FIGURE 3.106


    ![](img/30075d71cb1be5651669ffe0f9695010_122_2.png)


    lar the view to the default. You can zoom in and out with tools similar to SOLIDWORKS.


    # FIGURE 3.107


    Select the Reset button, and then the Section Tool, as shown in Figure 3.106.
    From the pop-up buttons that appear, choose the YZ Plane as the section.


    ![](img/30075d71cb1be5651669ffe0f9695010_122_3.png)


    # FIGURE 3.108


    ![](img/30075d71cb1be5651669ffe0f9695010_122_4.png)


    Note that you can click and drag the plane through the part, as shown in Figure
    3.107.


    Click the Section Tool again to turn it off, and select the Properties Tool, as
    shown in Figure 3.108.'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# Chapter 3 Additional Part Modeling Techniques


    The mass, volume, and surface area are displayed, as in Figure 3.109. You may
    note that you can select different units and more decimal places if desired.


    # FIGURE 3.109


    Notice that there is a Measure Tool, but that tool may be inactive on your computer.
    You can change that if necessary.


    ![](img/30075d71cb1be5651669ffe0f9695010_123_0.png)


    Close the eDrawings program without saving the eDrawings file. In SOLIDWORKS,
    select File: Save As change the file type to eDrawings (.eptrt). Click the Options
    button, then check the box to show measurements, as shown in Figure 3.110, and
    Click Cancel the Save As window, and then select Publish to eDrawings.


    # FIGURE 3.110


    ![](img/30075d71cb1be5651669ffe0f9695010_123_1.png)


    Click on the Measure Tool, as shown in Figure 3.112. Click on an edge, and the
    parameters of that edge (diameter or radius) are displayed. If two entities are
    selected, the dimensions between the two entities are displayed. Figure 3.113
    shows two circles selected. The distance between the centers of the circles is
    displayed, along with the differences in x, y, and z coordinates. When you click
    in the space around the part, the selections are cleared. Clear with the Measure
    Tool, and then select Save and save the file to the desired location.


    # FIGURE 3.111


    ![](img/30075d71cb1be5651669ffe0f9695010_123_2.png)


    # FIGURE 3.112


    ![](img/30075d71cb1be5651669ffe0f9695010_123_3.png)


    Note that the file size is about the same as a small word processing file. This
    makes the file ideal for sharing via e-mail. The Mail Tool in eDrawings allows
    the file to be sent in other formats that include the eDrawings viewer. These
    formats are discussed in detail in Chapter 2.


    Close eDrawings, and return to SOLIDWORKS.


    Often, you want to display your model in a text document or in a pre-presentation.
    The easiest way is to do this with captures of the model.


    From the main menu, select View: Screen Capture: Image Capture, as shown in Figure
    3.114. Open a Word document, and select Paste.


    # FIGURE 3.114


    ![](img/30075d71cb1be5651669ffe0f9695010_123_4.png)


    The image is copied to the clipboard and then pasted into the Word (or PowerPoint)
    document. While the Prnt Scr key performs a primary function, an advantage of
    SOLIDWORKS Image Capture is that only the graphics are captured. With the Prnt
    Scr key, the entire screen is captured and must be cropped if only the model is
    desired in the image.'
