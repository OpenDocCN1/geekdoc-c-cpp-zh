  md: '# Change the color of the part, if desired, and save the part in a file named
    “Pin.”

    Close the file.


    The final component needed for the assembly is a frame.


    Open a new part, in the Front Plane sketch a 25-inch square centered at the origin.
    Extrude to a depth of 4 inches. Extrude a 14-inch square cut (centered on the
    front face of the component), yielding the part in Figure 7.3.


    Change the color, if desired. Save this in a file named “Frame,”

    close it.


    These parts, along with the assembly model from Chapter 6, will be used to create
    a model of the hatch assembly.


    # 7.2 Creating a Complex Assembly of Subassemblies and Parts


    In this section, we will create a new assembly using the door assembly created
    in the previous chapter as a subassembly. The assembly will be a model of a hatched
    door, shown in Figure 7.4.


    Open a new assembly. If the Assembly PropertyManager does not open automatically,
    select the Insert Components Tool from the Assembly group of the CommandManager.
    Browse to the Frame file, and click the check mark to place it in the assembly,
    as shown in Figure 7.5.


    In the next step, the door assembly created in the previous step will be used
    as a subassembly within the new assembly. An assembly can be inserted like a part.


    Select the Insert Components Tool and browse for a file. In the dialog box, choose
    the file type to option Files, or All Files, and locate it, click Open, as shown
    in Figure 7.6.


