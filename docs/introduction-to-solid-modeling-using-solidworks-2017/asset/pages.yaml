  md: "# CHAPTER 10\n\n# Solution of\nVector Problems\n\n# Introduction\n\nMany engineering\
    \ problems involve the manipulation of vectors. A vector is a representation of\
    \ a quantity that is defined by both a magnitude and a direction, as opposed to\
    \ a scalar quantity that can be defined by a magnitude only. For example, the\
    \ speed of an object is a scalar quantity, while velocity is defined by both the\
    \ speed and the direction of the object's motion, and therefore is a vector quantity.\
    \ The SOLIDWORKS 2-D drawing environment allows for easy graphical solution of\
    \ vector problems.\n\n# Chapter Objectives\n\nIn this chapter, you will:\n\n+\
    \   - learn how to add vector quantities graphically,\n- work with driving and\
    \ driven dimensions,\n- learn to solve for any two unknowns (magnitudes and/or\
    \ directions) in a vector equation,\n- perform position analysis for some common\
    \ mechanisms.\n\n# 10.1 Vector Addition\n\nConsider the two forces acting on the\
    \ hook as shown in Figure 10.1. We would like to find the resultant force, the\
    \ single force that affects the hook in an equivalent manner to the two forces.\
    \ The resultant force is the sum of the two forces A and B. (Vector quantities\
    \ are usually denoted by bold type or by a bar or arrow over the symbol: A or\
    \ $\bar{A}$ or $\\vec{A}$.)\n\nFIGURE 10.1\n\n![](img/30075d71cb1be5651669ffe0f9695010_289_0.png)\n\
    \n![](img/30075d71cb1be5651669ffe0f9695010_289_1.png)"
