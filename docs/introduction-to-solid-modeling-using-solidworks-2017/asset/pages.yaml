  md: '# Part One Learning SOLIDWORKS


    # FIGURE 2.37


    Note that the Drawing Heads-Up View Toolbar contains some of the icons as the
    Part Heads-Up View Toolbar, and also includes a Sheet to Sheet Tool, as shown
    in Figure 2.37. When this tool is selected, the entire drawing is displayed below
    the Heads-Up View Toolbar. You may add tools to the Heads-Up View Toolbar in the
    same manner as presented in Chapter 1. One tool is the Pan Tool, which allows
    you to view different regions of the drawing without changing the zoom level.


    ![](img/30075d71cb1be5651669ffe0f9695010_78_0.png)


    Zoom to Sheet

    Zoom the sheet to fit the window.


    # FIGURE 2.38


    Since we specified centerlines to be added automatically when we set the options
    for the drawing template, they appear in the view. If the centerlines are not
    wanted, they can be deleted by clicking on one and pressing the delete key. Centerlines
    may also be added to individual features or to all of the entities within a specific
    view with the Center Tool from the Annotation group of the CommandManager, as
    shown in Figure 2.38.


    ![](img/30075d71cb1be5651669ffe0f9695010_78_1.png)


    Center Mark

    Revision Symbol

    Blocks

    Centerline

    Revision Cloud

    Center ToolnAdds centerlines to a view or selected entities.


    # FIGURE 2.39


    Note that the view was shown without hidden edges as an option, and hidden edges
    are displayed in the front and top views. Hidden edges are not typically shown
    in view, but the display of hidden edges in any view can be changed by selecting
    the view and then choosing the style from the Heads-Up View Toolbar, as shown
    in Figure 2.39.


    ![](img/30075d71cb1be5651669ffe0f9695010_78_2.png)


    Hidden View

    Hidden edges are displayed in a different color in the view when selected.


    # SECTION A-A


