  md: '# APPENDIX B

    nThe SOLIDWORKS Interface:

    Use and Customization


    The SOLIDWORKS user interface allows for commands to be accessed in a number of
    different ways, and the interface can be customized to reflect the preferences
    of the user.


    In this book, we access most commands from the CommandManager. When any part,
    drawing, or assembly is open, the CommandManager can be toggled on and off by
    selecting Customize from the pull-down menu box labeled "Enable CommandManager"
    under the Options tab, as shown in Figure B.1, and checking/unchecking the box
    labeled "Lock CommandManager" under Toolbars tab, as shown in Figure B.2.


    In order to move the toolbars/or the CommandManager as will be discussed, the
    check box labeled "Lock CommandManager and toolbars" must be cleared.


    When the CommandManager is turned off, then toolbars corresponding to the active
    groups of the CommandManager are displayed. For example if the Features and Sketch
    groups are active on the CommandManager, then the corresponding toolbars are displayed
    when the CommandManager is turned off, as shown in Figure B.3.


    FIGURE B.1


    ![](img/30075d71cb1be5651669ffe0f9695010_385_0.png)


    FIGURE B.2


    ![](img/30075d71cb1be5651669ffe0f9695010_385_1.png)


    FIGURE B.3


    ![](img/30075d71cb1be5651669ffe0f9695010_385_2.png)'
