    surface to handy shortcuts. Below the "Show on selection" box is one labeled "Show
    in shortcut menus." A shortcut menu is the menu that appears when you right-click,
    either in the graphics or in the FeatureManager. For example, right-clicking the
    shortcut menu name in B.32 played. If the "Show menus" option is enabled, then
    the context toolbar is shown in the shortcut menu, as shown in B.32. If it is
    cleared, many of the commands from the context toolbar are displayed in the shortcut
    menu, as shown in B.33.


