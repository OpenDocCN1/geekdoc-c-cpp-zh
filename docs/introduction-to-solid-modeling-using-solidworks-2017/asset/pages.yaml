  md: '# # CHAPTER 9

    Generation of 2-D Layouts


    ![](img/30075d71cb1be5651669ffe0f9695010_267_0.png)


    # ## Introduction


    Earlier we learned to create 2-D drawings from solid parts and assemblies. For
    some tasks, however, working directly in the 2-D environment is preferred. For
    example, floor plans and site drawings, plant equipment layouts, and electrical
    schematic drawings are usually created in 2-D. The SOLIDWORKS program can be used
    for these applications, and the ease of changing dimensions allows multiple configurations
    to be evaluated.


    # ## Chapter Objectives


    In this chapter, you will:


    +   - choose and set the scale for a 2-D layout,

    - use a unit system of feet and inches,

    - create a floor plan and learn how to modify the layout to alternate configurations,

    - expand your knowledge of using relations with 2-D entities, andn- calculate
    the areas, centroid locations, and moments of inertias of 2-D areas.


    # ### 9.1 A Simple Floor Plan Layout


    In this exercise, we will prepare a layout drawing of a simple quality assurance
    lab for a manufacturing shop. The following items need to be placed in the lay:


    +   - A tensile test machine, with a rectangular “footprint” of 4 feet wide by
    3 feet deep

    - An inspection bench, 8 feet by 3 feet

    - A desk, 4 feet by 30 inches

    - Three cabinets for storing measuring tools and fixtures, 4 feet wide by 2 feet
    deep'
  merge: -1
  pgno: 267
