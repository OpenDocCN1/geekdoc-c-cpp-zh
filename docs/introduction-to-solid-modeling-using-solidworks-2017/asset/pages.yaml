  md: '# CHAPTER 1


    # Basic Part

    Modeling Techniques


    # Introduction


    Solid modeling has become an essential tool for companies that design mechanical
    structures and machines. Just 20 years ago, this would have been hard to imagine.
    3D modeling software existed, it was very expensive and required high-end computer
    workstations to run. An investment of $50,000 or more was required for every workstation
    without including training of the operator. As a result, only a few industries
    used solid modeling, and the trained to work exclusively with the software. The
    dramatic performance improvements and price drops of computer hardware, with increased
    competition among software vendors, significantly lowered the barrier for companies
    to enter the modeling age. The software has also become much easier to use, so
    that engineers who have many other functions can use solid modeling without required
    training. SOLIDWORKS® was among the first solid modeling programs to be written
    for for Microsoft Windows environment. Since its initial release in 1995, it has
    been adopted by thousands of companies worldwide. This text is laid out as a series
    of tutorials that cover most of the basic features of the SOLIDWORKS program.
    Although these tutorials will be of anyone desiring to learn the software, they
    are written primarily for freshmen engineering students. Accordingly engineering
    design topics are introduced along the way. “Future Study” boxes give a preview
    of coursework that engineering students will encounter later, and relate that
    coursework to the solid modeling tutorials. In this first chapter, we will learn
    how to make simple parts with SOLIDWORKS software.


    ![](img/30075d71cb1be5651669ffe0f9695010_17_0.png)


    # Chapter Objectives


    In this chapter, you will:


    +   - be introduced to the role of solid modeling in engineering design,


    +   - learn how to create 2-D sketches and create 3-D extruded and revolved geometry
    from these sketches,


    +   - use dimensions and relations to define the geometry of 2-D sketches,


    +   - add fillets, chamfers, and circular patterns of features to part models,


    +   - learn how to modify part models, and


    +   - define the material and find the mass properties of part models.


    > SOLIDWORKS is a registered trademark of Dassault Systèmes SolidWorks Corporation.'
  merge: -1
