  md: '# Chapter 9 Generation of 2-D Layouts 269


    # FUTURE STUDY


    # Mechanics of Materials


    The study of mechanics of materials involves determining stresses, strains, and
    deformations in bodies subjected to various loads. Stress is the force per unit
    area acting on a point in a body, and the calculation of stress is necessary to
    predict failure of a structure. Strain is a measure of geometrical changes within
    a body. Stress and strain are related by properties of the material used. Deformations
    are related to strains in the body. While strain is applied at a given point,
    deformation is the dimensional change of the entire body. For example, consider
    a 1 x 6-inch wooden plank resting on its ends. If the span of this beam is 6 feet,
    and a 175-pound middle stands in the middle, how much will the plank move downward?


    For a rectangular shape, the moment of inertia is:


    ```

    I = 1/12 bh³

    ```


    So for our plank, with b = 6 inches and height h = 1 inch, I = 50 in⁴ and the
    deflection = 1.81 inches. If we carefully placed the plank so that it is resting
    on the edge, the values of b and h are switched. The moment of inertia increases
    to 18 in³ and the deflection reduces to 0.05 inches. Therefore, bending stiffness
    of the plank has increased by a factor of 36 by changing its orientation. The
    moment is increased by moving to the greatest possible distance from the centroidal
    axis (the axis passing through the center, or area, of the section). With wood
    construction, this is done by aligning the members appropriately, as with floor
    beams that are placed with their long dimensions perpendicular to the floor. In
    steel construction, wide-flange beams maximize bending stiffness by placing the
    material in the flanges, as far from the centroidal axis as possible.


    ![](img/30075d71cb1be5651669ffe0f9695010_283_0.png)


    Using mechanics of materials concepts, it can be determined that the deflection
    of such a beam is:


    ```

    δ = PL³/48EI

    ```


    where:

    P = 175 lb

    L = 72 in

    E = modulus of the material. A typical value for wood = 1,500,000 lb/in²

    I = moment of inertia of the cross section


    When complex shapes are used, the moment of inertia can be cumbersome. First,
    the centroid must be located, and the moments of inertia of simple regions of
    the shape must be calculated and adjusted for their distances away from the centroidal
    axis. Finally, the moments of inertia of individual regions are summed.


    The Section Properties Tool could be a useful tool for calculating/or checking
    the value of inertia.'
