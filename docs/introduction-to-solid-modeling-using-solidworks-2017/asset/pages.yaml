  md: '# 314 Part Two Applications of SOLIDWORKS


    In a stable four-bar linkage, the links can be assembled in either of two configurations,
    shown in Figures 11.57 and 11.58. Once assembled, the configuration is set. To
    change from one configuration to the other, it is necessary to disassemble one
    joint, rearrange the links, and re-assemble the joint. In the linkage illustrated
    in Figure 11.57, Link 4''s path of oscillation will be completely above the ground
    link. In the linkage illustrated in Figure 11.58, Link 4''s path of oscillation
    will be completely below the ground link. In an unstable linkage, both configurations
    are possible, and the mechanism may switch from one configuration to the other
    during the motion cycle. Unstable mechanisms are generally avoided in real motion
    applications, since their behavior can be unpredictable.


