    2.00 inches. The resulting sketch is shown in Figure 4.3.


    ![](img/30075d71cb1be5651669ffe0f9695010_134_0.png)


    In previous tutorials, upon completing a sketch we have used a Features tool to
    convert the sketch into a 3-D object. However, a loft feature requires at least
    two sketches. Therefore, we will close this sketch and begin the second sketch.


    # FIGURE 4.4


    Close the sketch by clicking on the icon indicated in Figure 4.4, in the upper-right
    corner of the screen.


    ![](img/30075d71cb1be5651669ffe0f9695010_134_1.png)


    You can also close a sketch by choosing Exit Sketch from the Sketch group of the
    CommandManager.


    The second sketch, which will define the top of the part, will be created in a
    new plane.


    # FIGURE 4.5


    Select the Top Plane from the FeatureManager. Click on the Reference Geometry
    Tool, and choose Plane from the options listed, as shown in Figure 4.5. In the
    PropertyManager, set the offset distance as I inch.


    ![](img/30075d71cb1be5651669ffe0f9695010_134_2.png)


    Make sure the new plane is above the Top Plane, as shown in Figure 4.6 (check
    the Flip box to change the direction, if necessary), and click the check mark
