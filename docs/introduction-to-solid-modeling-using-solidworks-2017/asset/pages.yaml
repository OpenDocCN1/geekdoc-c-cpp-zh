    in Figure 13.11. In this example, 6358 triangles are created, resulting in a file
    size of 318 kb. This file size is small enough to be easily transferred by e-mail
    or temporary storage media.


    FIGURE 13.11


    Usually, the Fine quality is sufficient. For parts where resolution is desired,
    the Custom quality can be selected, and the slider bars moved toward the right.
    The only trade-off for this higher quality is file sizes. However, since the transfer
    of large files via e-mail or Internet has become easier in recent years, file
    size is usually not a major problem.


    When the .stl file is received by the computer controlling the AM machine, it
    is “sliced” into cross-sections by machine-specific software. Some machines allow
    for the thickness of the sections to be adjusted. Thinner layers result in greater
    accuracy, but course longer build times. Most machines allow for multiple parts
    to be made simultaneously.


    A model of the ribbed flange being removed from a binder jetting machine is shown
