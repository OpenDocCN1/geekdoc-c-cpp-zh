    Select the Circle Tool from the Sketch group of the CommandManager. Drag out a
    circle centered at the origin. Select the Smart Dimension Tool and add a 6-inch
    diameter dimension, as shown in Figure 5.2.


    Select the Extr Boss/Base Tool from the Features group of the CommandManager.
    Extrude the sketch outward to a thickness of 0.25 inches.


    FIGURE 5.2


    ![](img/30075d71cb1be5651669ffe0f9695010_166_1.png)'
