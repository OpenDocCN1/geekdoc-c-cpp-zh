  md: '# Chapter 13 The Use of SOLIDWORKS to Accelerate the Product Development Cycle
    357


    # 13.2 Finite Element Analysis


    Finite Element Analysis (FEA) is a method of predicting the response of a structure
    to loads by breaking the structure down into small pieces (elements). The where
    where corner points of elements merge are called nodes. Equations predicting the
    response of each element are assembled into a series of simultaneous equations.
    Solution of this system yields displacements of the nodes. From these displacements,
    stresses (forces per unit area) are calculated for each predicted. From the stresses,
    the factor of safety against failure of the structure can be predicted. The finite
    element method can also be applied to fluid flow analysis, heat transfer, and
    many other applications.


    Solid modeling has enabled the increased usage of FEA, because it allows the task
    in the past required most time: creating the geometric model and the finite mesh.
    A finite element mesh can be created from a solid model with only a few mouse
    clicks. Figure 13.14 shows a mesh created from the bracket model of Chapter 3.


    ![](img/30075d71cb1be5651669ffe0f9695010_371_0.png)


    A 50-pound load will be applied to the end of the flange. After the mesh is created,
    loads and boundary conditions are applied. Boundary conditions are the displacements
    controlled by external influences. For example, if we assume the bolts attaching
    the bracket to the wall cause the back face of the bracket to be perfectly fixed,
    then we would apply corresponding constraints to the movements of the nodes on
    that face. The stresses resulting from the 50-pound load are shown as stress contours
    in Figure 13.15.


    ![](img/30075d71cb1be5651669ffe0f9695010_371_1.png)


    As FEA has become easier to use, it has also become easier to misuse. While the
    software takes care of the number-crunching, a knowledgeable engineer is required
    to set up the analysis and interpret the results.


    Among the common errors made by inexperienced users of FEA are:


    +   * Inappropriate choice of elements.

    Solid modeling with a built-in FEA mesh generator allows a mesh of solid elements
    to be easily created from a solid model. However, in many cases solid elements
    are not the best choice. Relatively thin structures subjected to bending loads
    are usually better approximated with shell elements. A frame made up of welded
    members may require tens of thousands of solid elements to produce an acceptable
    grid, while a few beam elements will produce better results with substantially
    less calculation time.'
  merge: -1
  pgno: 371
- img_proc: true
  md: '+   Use of linear behavior. Linear analysis is based on the assumption that
    structural response varies linearly with loading. For example, under the assumption
    of linear behavior, the deflections and stresses of the bracket when loaded to
    100 pounds are exactly double those produced by a 50-pound load. There are two
    types of nonlinearities possible, however, that would violate this assumption.
    Geometric nonlinearity is present when the structure''s stiffness is significantly
    different in the displaced configuration than it is in original. Material nonlinearity
    is present when the material is stressed beyond its point. When the material has
    yielded, it may not break, but will defect with little or no additional loading.
    Both of these require iterative solution rather than applying all of load at once,
    an increment of the load is applied and the equations are solved. The equations
    are reformulated based on the results of the first solution, and solved again.
    This process is repeated until the solution is found. While this procedure requires
    much more processing time, it is necessary to obtain an accurate solution for
    many problems.


    +   Inappropriate boundary conditions. In the example of the bracket, it was the
    back of the face fixed to a rigid wall. Is this a reasonable assumption? Maybe,
    but if the screws hold the bracket loosen, then the bracket will separate from
    the wall, placing more force on the bottom of the bracket. Most actual restraints
    are neither perfectly fixed nor perfectly free, requiring the engineer to use
    judgment in specifying the constraints to be placed on the model. In some cases,
    the analysis may be performed several times with different boundary conditions
    to obtain the limits of possible structural response.


    +   Misinterpretation of results. In Figure 13.15, the stresses displayed are
    the von Mises stresses. These stresses are calculated based on a specific failure
    criterion (the von Mises criterion) that is an excellent predictor of the yielding
    of ductile materials, but may be inappropriate for predicting the failure of many
    materials.


    These common errors are not presented to discourage the proper use of the method.
    An engineer should have a good understanding of mechanics of materials and at
    least an introduction to FEA theory before using FEA for any important application.
    A tutorial for conducting a simple analysis of the bracket from Chapter 3 is available
    on the book''s website, www.mhhe.com/howard2017.


    # 13.3 Product Data Management


    We have mentioned earlier that solid modeling supports concurrent engineering,
    since many engineering functions can work from the same database (the solid model).
    Allowing multiple users to work on the same model or drawing, however, creates
    challenges, and How do companies manage their part files and drawings to control
    who can make changes?


    Before this question, it is helpful to consider how companies managed paper drawings
    and other data solid modeling was introduced. When a draftsman completed a drawing,
    it was checked and then through a release process in which it was approved and
    signed off by various department representatives (design engineering, manufacturing
    engineering, safety, etc.). Copies were made and distrib-'
  merge: -1
  pgno: 372
- img_proc: true
  md: '# Chapter 13 The Use of SOLIDWORKS to Accelerate the Product Development Cycle
    359


    uted, and then the released drawing was stored in a vault. Medium-sized and large
    companies had a configuration management department that controlled the release
    and subsequent changes. When a change was requested, a formal engineering change
    process was followed. When the change was approved, it was amended to the drawing,
    or the drawing was modified and given a revision number, if the change was significant.
    It should be noted that many drawings would have dozens of change orders, making
    this process an important job. When a user of the drawing, a stress analysis to
    begin an FEA model, needed, the configuration management department provided the
    latest version, including all change orders. Similarly, the Bill of Materials
    for each part was maintained and provided to the purchasing and manufacturing
    departments. In addition to controlling the drawing changes the configuration
    management department would maintain drawing trees that showed relation to each
    other.


    A change in part could affect an assembly at the next level. Other data might
    have been controlled but not necessarily linked to the drawings. For example,
    a stress analysis report might have been released and stored in the vault, a person
    looking at the drawing would probably not know that the analysis had been done,
    or where to find it. Similarly, in industries where weight is important, mass
    property reports were produced, but usually not linked to drawings.


    The introduction of solid modeling presents new challenges to configuration management.
    The features that make solid modeling so exciting to design engineers—associate
    between parts, assemblies, and drawings—ability to use the solid model for many
    functions—could huge problems from a data management perspective. That is, no
    person could make a seemingly simple change to a component that would change an
    entire assembly without the person being aware of its effect. Now that some companies
    model major systems with solid modeling, controlling who can make changes is vitally
    important.


    Product Data Management (PDM) software is used to perform some of the tasks of
    the configuration management department, while streamlining communications between
    different departments. PDM entails two categories of functions:


    +   - Data management, the control of documents (part files, drawings, stress
    reports, etc.), and

    - Process management, the control of in which people create and modify the documents.


    The data management function is similar to that of the paper-based configuration
    management department, except that the released drawings are electronic files
    and are stored in a virtual vault instead of physical vault. (Actually, backup
    tapes and disks of the virtual vault are often stored in a physical vault.) Since
    the part and drawing information is stored in a relational database, location
    and retrieval of files is possible and helps to reduce redundancy, especially
    among standard components such as fasteners. A design engineer who needs to specify
    a fastener can easily determine if there is already a similar fastener with a
    part number assigned in the system. If there is, then the purchasing department
    will not have an additional item to buy.


    Process management is the active control procedures: which generate the data and
    how the data are transferred from one group to another. One important feature
    of'
  merge: -1
  pgno: 373
- img_proc: true
  md: 'PDM systems is work management. In a paper-based system, having old, outdated
    drawings are an invitation for trouble, since they can be used by mis-take. By
    destroying old drawings, the history of modifications made to a drawing can be
    easily lost as well. PDM software can track the change history of a part, an important
    function in Total Quality Management (TQM), protecting against accidental usage.


    What does the future hold? Most manufacturing implemented Manufacturing Resource
    Planning (MRP) systems before PDM became popular. MRP systems allow the tracking
    of raw materials, work in progress, and finished inventory in the plant. The move
    to reduce inventories and adjust just-in-time raw deliveries necessitated the
    adoption of MRP systems. In many ways, implementing PDM to engineering functions
    is analogous to implementing MRP for manufacturing.


    The next step is to integrate all development data into a single system referred
    to Product Lifecycle Management (PLM). With any new large-scale system, implementation
    is expensive and time-consuming, so some systems are not widely used in industry.


    An example of the complexity of engineering data and the challenges of managing
    that data is the delay announced in 2006 of the production of the Airbus 380 jumbo
    jet. Both Airbus and its competitor in the commercial aircraft market, Boeing,
    have suppliers around. Coordinating the work of these suppliers is a monumental
    challenge. On October 3, 2006, Airbus CEO Strief announced that the delivery of
    the 550-seat A380 would be significantly delayed because of data translation problems
    between engineers in Germany, who were designing and building the wiring harness
    for the plane, and engineers in France, where the final assembly of the plane
    was taking place. As a result of the errors, the wiring harnesses would not fit
    correctly—a major problem for a plane with hundreds of miles of wiring. The problems
    were expected to cost Airbus over 56 billion dollars in profits.


    # 13.4 Some Final Thoughts


    The widespread adoption of solid modeling has been part of a revolution in the
    way that products are designed and developed. As many companies have thrived with
    new technology, others that have not kept up have not been able to compete and
    have been forced to close. Although no one can predict the future, one thing seems
    certain: the pressure to develop new products faster and better will not lessen.


    On a more personal scale, the same concept has held true for many engineers. An
    engineer who is adverse to change and reluctant to learn new tools is at a great
    competitive disadvantage to him or her peers.


    The good news is that most people who enter the engineering profession do so because
    have the curiosity to learn new things. Keeping that curiosity will allow an engineer
    to have a rewarding career that is always fresh and interesting.


    > ¹PLM: Boeing’s Dream, Airbus Nightmare,” Mel Duvall and Doug Bartholomew, Baseline,
    February 1, 2007, Vol 1 Number 69, Ziff Davis Media.'
