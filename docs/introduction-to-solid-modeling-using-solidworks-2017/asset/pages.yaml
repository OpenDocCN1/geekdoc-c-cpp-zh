  md: '# DESIGN INTENT Planning for Other Uses of the Model


    When adding dimensions to the initial sketch of the pulley, we could specify some
    of the dimensions as diameters or radii. For the 7-inch diameter dimension that
    defines the overall size of the pulley could just as easily be entered as a 3.5-inch-radius.
    However, if we plan to make a 2-D drawing of this part, then the diameter should
    be defined as a diameter on the drawing. By dimensioning the part in the same
    way we will dimension the drawing, then dimensions can be


    directly from the part file. This prevents us from having to add dimensions manually
    or override a dimension''s properties. When you are planning to make a 2-D drawing
    of a part; use the part in assemble; utilize the part for another use such as
    conducting stress analysis, creating a rapid prototype model, or developing a
    tool path; consideration of the uses of the model will influence the way to create
    and define the part geometry.


    From the Features group of the CommandManager, select the Revolved Boss/Base Tool,
    as shown in Figure 1.166.


    Note that no preview is displayed on the screen when we selected the Extrude Boss/Base
    tool earlier in the chapter. The reason for this is that there are two ambiguities
    in our sketch that we must define:


    +   There is more than one enclosed region within our sketch, so we need to define
    which of these regions will be revolved.


    +   There are two centerlines in the sketch, so we need to define which centerline
    is the axis of revolution.


    One way to approach the first ambiguity would be to use the Trim Tools to remove
    the overlapping portions of the sketch, so that the sketch consists of only a
    single closed contour. An easier way is to simply select the multiple contours.


