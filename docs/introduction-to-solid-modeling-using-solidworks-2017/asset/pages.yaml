- img_proc: true
  md: 'Chapter 4 Advanced Part Modeling 129


    # FUTURE STUDY


    # Industrial Design


    In this chapter, we created a part by using the Loft command to smoothly blend
    two shapes. Engineers in many industries are sometimes reluctant to use this type
    of construction, since the resulting surfaces are difficult to define mathematically.
    This makes the geometry difficult to specify on engineering drawings and often
    impossible to make with traditional manufacturing methods.


    tile, safety and convenience criteria, with concern for the user. (www.idsa.)


    The image that may associate with industrial designers is that of an artist working
    on a clay model of an automobile, creating the shapes that would eventually be
    seen on the showroom floor. The clay model would eventually be digitized by measuring
    thousands of points on the surface in order to define the shape for the tooling
    to stamp the sheet metal body parts. Industrial designers now create many of their
    models with the "virtual clay" of solid modeling, computer-controlled machining
    centers, and rapid prototyping methods.


    Complex geometries have always been an important tool for industrial designers.
    Industrial designers are important members of product development teams, but perform
    a different task than do design engineers. The Industrial Designers Society of
    America defines the role of the industrial designer as:


    The industrial designer''s unique contribution places emphasis on those aspects
    of the product or system that relate directly to human characteristics, needs
    and interests. This contribution requires specialized understanding of visual,
    tac-


    The roles of design engineer and industrial designer have begun to overlap as
    they have access to a similar set of product development tools. However, engineers
    should recognize and utilize the capabilities of industrial designers within the
    product design process.


