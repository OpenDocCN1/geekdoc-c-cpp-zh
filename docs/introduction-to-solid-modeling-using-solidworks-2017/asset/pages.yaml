    # A.5 Backing Up and Transferring Settings


    The settings that you have specified and stored can be easily copied for backup
    purposes or to transfer the settings to another computer. Except for the settings
    that were stored in the templates, settings are stored in the Windows registry.
    While editing the registry is not recommended, there is a tool for copying settings.
    To access this tool, select the Menu in Windows, browse to the SOLIDWORKS Tools
    2017 folder, and select Copy Settings Wizard 2017. The wizard will prompt you
    to save your settings, files and choices, as shown in Figure A.36. After specifying
    the location to store the files and choosing the settings, as shown in Figure
    A.37, an executable file is made, the icon for which is shown in Figure A.38.
    This is a small file that can be saved to a CD or flash drive. To apply these
    settings to a different computer or after a re-installation, double-click the
    file and choose Restore Settings.


