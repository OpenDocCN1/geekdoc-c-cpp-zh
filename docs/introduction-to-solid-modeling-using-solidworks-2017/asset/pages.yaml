  md: '# Part Modeling Tutorial: Bracket


    We will model the bracket shown in Figure 3.2. This part has a single plane of
    symmetry, which we will align with the Right Plane.


    Open a new part file. Click on the Front Plane in the FeatureManager to select
    it.


    From the Sketch group of the CommandManager, select the Center Rectangle Tool.


    Drag a rectangle centered at the origin.


    Click on the Smart Dimension Tool, and dimension a horizontal side of the rectangle
    to 6 inches and a vertical side to 4 inches, as shown in Figure 3.47.


    FIGURE 3.47


    ![](img/30075d71cb1be5651669ffe0f9695010_108_0.png)


    The rectangle is now dimensioned and located, so sketch is fully defined. By centering
    the rectangle at the origin, we will be placing the Right Plane so that it will
    be a plane of symmetry of the part.


    Click on the Features tab and then the Extr Boss/Base Tool. In the PropertyManager,
    enter 0.25 inches as the thickness, and click the check mark.


    The horizontal boss of the bracket will now be constructed. The feature will be
    sketched in a plane 1.25 inches below the top surface of the base part. To accomplish
    this, we will first need to create the reference plane to be used for sketching.


    Select the top surface of the base part, as shown in Figure 3.48.


    FIGURE 3.48


    ![](img/30075d71cb1be5651669ffe0f9695010_108_1.png)'
