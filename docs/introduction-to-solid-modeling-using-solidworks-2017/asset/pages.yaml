  md: 'Click and drag Link4 to the approximate position shown in Figure 11.26.


    Insert Link3 into the assembly. Add three mates:


    +   1. A coincident mate between the back face of Link3 and the front face of
    either Link2 or Link4,


    +   2. A concentric mate between the inner faces of the corresponding holes of
    Link2 and Link3, and


    +   3. A concentric mate between the inner faces of the corresponding holes of
