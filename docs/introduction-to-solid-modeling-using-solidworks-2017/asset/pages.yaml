    The View Settings Tool, shown in Figure 1.50, allows you to add shadows to either
    of the shaded modes. Also, the model can be shown in perspective mode. In perspective
    mode, lines converge at a single point (the vanishing point), producing a more
    realistic view. However, most engineering views are produced with parallel lines
    (these are called orthographic projections). Normally, we leave the Perspective
    view turned off. There is also a Cartoon View option, which is intended to make
    a model appear as though it were hand-drawn.


