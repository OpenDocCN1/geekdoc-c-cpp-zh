    # FIGURE B.18


    It should be noted that tools can be mixed and matched ontobars and Command groups.
    That is, tools other than sketch tools can be placed on the Sketch toolbar or
    the Sketch of the CommandManager, and tools can be duplicated. For example, the
    Evaluate group of the CommandManager contains the Properties Tool. You may find
    that you use this often but not use the Evaluate tools regularly. Rather than
    display the Evaluate group or access the Properties Tool from the menu when, the
    tool can be added to another group of the CommandManager, most logically the Features
    group. To do this, locate the tool from the Tools group of the Command list and
    drag it onto the Features group, as shown in Figure B.21. The Properties Tool
    is now available from the Features group, as shown in Figure B.22, as well as
    from the Evaluate group of the CommandManager.


