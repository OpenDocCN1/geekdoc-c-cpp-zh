  md: '# # CHAPTER 3

    Additional Part Modeling Techniques


    # Introduction


    The flange and pulley parts modeled in Chapter 1 required the use of a number
    of basic solid modeling construction techniques. In this chapter, some additional
    construction and dimensioning techniques will be explored. The parts that will
    be modeled in this chapter are a wide-flange beam segment, shown in Figure 3.1,
    and a wall-mounted bracket, shown in Figure 3.2.


    # Chapter Objectives


    +   In this chapter, you will:

    * use symmetry in part modeling,

    * learn to create different configurations of a part,

    * learn to use the Rib Tool,

    * create a linear hole pattern,

    * create an eDrawing of a part, and

    * learn how to create an animation of a part.


    FIGURE 3.1


    FIGURE 3.2


    ![](img/30075d71cb1be5651669ffe0f9695010_99_0.png)


    ![](img/30075d71cb1be5651669ffe0f9695010_99_1.png)


    For each part, we will take advantage of the part''s symmetry. A plane of symmetry
    exists if the half of the part on one side of the plane is a mirror image of the
    other half of the part. When a part contains a plane of symmetry, aligning that
    plane with one of the pre-defined SOLIDWORKS planes (Front, Top, and Right) is
    good practice and makes many modeling and assembly operations easier.'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# 3.1 Part Modeling Tutorial: Wide-Flange Beam Section


    Structural steel members are made in standard shapes that are defined by the American
    Institute of Steel Construction (AISC). Wide-flange beams are commonly used in
    steel construction. A wide-flange beam consists of two horizontal flanges joined
    by a vertical web. As shown in Figure 3.3, four dimensions are used to define
    the shape of the cross-section: the overall depth $d$, the thickness of the flanges
    $t_f$, and the thickness of the web $t_w$. (The edges between the web and flanges
    are filled, but the fillet radius is allowed to be somewhat and is not considered
    to be a standard dimension.)


    ![](img/30075d71cb1be5651669ffe0f9695010_100_0.png)


    The dimensions of three wide-flange beam shapes are listed in Table 3.1.


    TABLE 3.1 Dimensions of Some Wide-Flange Beam Shapes


    | Designation | Depth d, in | Flange Width b, in | Flange Thickness t_f, in |
    Web Thickness t_w, in | Area, in$^2$ |

    |---|---|---|---|---||

    | W12 x 65 | 12.1 | 12.000 | 0.405 | 0.390 | 19.1 |

    | W10 x 45 | 10.10 | 8.020 | 0.430 | 0.350 | 13.3 |

    | W8 x 31 | 8.00 | 7.995 | 0.435 | 0.285 | 9.13 |


    We will model the one-foot-long section of a W8 x 31. The designation W8 x 31
    means that the depth of the beam is approximately 8 inches and the beam weighs
    about 31 pounds per foot.


    ![](img/30075d71cb1be5651669ffe0f9695010_100_1.png)


    As we begin to model the beam section, we note that it is symmetric about three
    planes. We will create our model that the three planes of symmetry coincide with
    the Front, Top, and Right planes of the model, as shown in the Front and Right
    Views of Figure 3.4.'
  merge: -1
