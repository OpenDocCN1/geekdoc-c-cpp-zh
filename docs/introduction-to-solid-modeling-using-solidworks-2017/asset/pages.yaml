    # 11.5 Investigating Mechanism Design


    In this section, we will exploit the parametric modeling capabilities of SOLIDWORKS
    to further investigate the design of mechanisms. In Section 11.4, we simulated
    the motion of the four-bar linkage using given link lengths. In this section,
    we will modify the lengths and use motion simulation to predict the impact of
    the design changes on the motion of the mechanism.


    The motion profile of a four-bar linkage is controlled by the relative lengths
    of the links. In the existing linkage, Link2 is capable of rotating through a
    full 360°. Such a link is called a "crank"; in a four-bar linkage a crank link
    will exist when the following equation is satisfied:


    > L + S < P + Q


    where:


    +   L = length of the longest link

    S = length of the shortest link

    P, Q = length of the other two links.


    In our linkage, L = 7 inches, S = 3 inches, and Q = 6 inches. Since the condition
    is satisfied, at least one link (Link2) is a crank.


    We will now modify our mechanism, and use a motion study to determine the impact
    of the redesign on the motion of the linkage.'
