  md: '# Chapter 4 Advanced Part Modeling 123


    In the PropertyManager, set the offset distance to 0.20 inches. Check the Reverse
    box, as shown in Figure 4.18, so that the offset entities are inside the edges
    of the face.


    # FIGURE 4.18


    ![](img/30075d71cb1be5651669ffe0f9695010_137_0.png)


    The finished sketch is shown in Figure 4.19. Note that the 0.20-inch offset distance
    is shown as a dimension that can be edited by double-clicking. Also note that
    most tools in the Sketch group, the Offset Entities Tool cannot be activated by
    selecting the sketching plane and then clicking the tool. Instead, a sketch must
    be opened before selecting the Offset Entities Tool. The Convert Entities Tool
    is similar in this regard; a sketch must be opened before accessing the tool.


    # FIGURE 4.19


    ![](img/30075d71cb1be5651669ffe0f9695010_137_1.png)


    Before cutting the sketch into the part, we need to consider the design intent.
    We want this cut to be blind, so that the cards sit on the bottom of the hole,
    but we want the cut depth to vary with the overall height of the card holder.
    Neither a blind nor Through-All type of cut will work. Rather, we will specify
    the depth of cut so that the bottom of the cut is a fixed distance above the bottom
    of the card holder.


    Select the Extruded Cut Tool from the Features group of the CommandManager. Switch
    to the Trimetric View. set the type of extrusion to Offset Surface and the offset
    distance to .125 inches, as shown in Figure 4.20. As we work, we will select the
    bottom face of the part.


    To select the bottom surface, we switch to Bottom View or rotate the model until
    the surface is visible, but in the steps that follow, we will learn a handy technique
    for selecting a non-visible surface without rotating the model from the Trimetric
    View.


    # FIGURE 4.20


    ![](img/30075d71cb1be5651669ffe0f9695010_137_2.png)'
