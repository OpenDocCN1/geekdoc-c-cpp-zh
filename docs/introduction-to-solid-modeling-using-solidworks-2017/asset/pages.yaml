  md: 'x Preface


    # # Motivation For This Text


    When we saw a demonstration of the SOLIDWORKS software in 1998, we were both instantly
    hooked. Not only was the utility of the software obvious, but the program was
    easy to learn and to use. Since then, we have shared our enthusiasm with the program
    with hundreds of students in classes at Milwaukee School of Engineering and East
    Carolina University, in summer programs with high school students, and in informal
    sessions. Most of the material in this book began as tutorials that we developed
    for these purposes. We continue to be amazed at how quickly students at all levels
    can learn the basics of the program, and by the sophisticated projects that many
    students develop after a short time using the software.


    While anyone desiring to learn the SOLIDWORKS program can use this book, we have
    added specific elements for beginning engineers. With these students, we have
    attempted to introduce students to the design process and relate solid modeling
    to subjects that most engineering students will study later. We hope that the
    combination of the tutorial style approach to teaching the functionality of the
    software together with the integration of the material into the overall design
    of engineering will motivate student interest not only in the SOLIDWORKS software
    but in the profession of engineering.


    # # Philosophy of This Text


    The development of powerful and integrated solid modeling design packages has
    continued the evolution of computer-aided communication tools to full-fledged
    engineering design and analysis tools. A solid model is more than simply a drawing
    of an engineering component; it is a true representation of the part, which can
    be manipulated, with other parts into complex assemblies, used directly for analysis,
    and to drive the manufacturing equipment that will be used to produce the part.


    This text was developed to exploit this emerging role of solid modeling as an
    integral part of the engineering design process; while proficiency in the software
    will be achieved through the exercises provided in the text, the traditional "training"
    exercises will be augmented with information on the integration of solid modeling
    into the engineering design process. These topics include:


    +   - The exploitation of the parametric features of a solid model, not only provide
    an accurate graphical representation of a part but also to effectively capture
    an engineer''s design intent,

    - The use of solid models as an analysis tool, useful for determining properties
    of components as well as for virtual prototyping of mechanisms and systems,

    - The integration of solid modeling with component manufacturing, including the
    generation of molds, sheet metal patterns, and rapid prototyping files from component
    models.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'Through the introduction of these topics, students will be shown not only the
    modeling features of the SOLIDWORKS program, but also the role of the software
    as a full-fledged integrated engineering tool.


    # The Use of This Text


    This text primarily consists of chapter-long tutorials, which introduce both concepts
    in solid modeling (such as part modeling, drawing creation, and assembly modeling)
    and advanced applications of solid modeling in engineering analysis and design
    (such as mechanism modeling, creation sheet metal bending, and rapid prototyping).
    Each tutorial is organized as ''keystroke-level'' instructions, designed to teach
    the use of the software. For any reference, a guide to these tutorials is shown
    on the inside front cover.


    While these tutorials offer a level of detail appropriate for new students, this
    text was developed to be used as part of an introductory engineering course, taught
    around the use of solid modeling as an integrated design and analysis tool. Since
    the intended undergraduate students new to the field of engineering, the text
    contains features that help integrate the concepts learned in solid modeling into
    the overall study of engineering. These features include:


    +   - Design Intent Boxes: These are intended to augment the ''keystroke-level''
    tutorials to include the rationale behind the sequence of operations to create
    a model.

    - Future Study Boxes: These link the material contained in the chapters to topics
    that will be seen later in the academic and professional careers of new engineering
    students. They are intended to motivate interest in advanced study in engineering,
    and to place the material seen in the tutorials within the context of the profession.


    While these features are intended to provide additional motivation and context
    for beginning engineering students, they are self-contained, and may be omitted
    by professionals who wish to use this text purely for the software tutorials.


    # New in This Edition


    This new edition of the text has been fully updated for the SOLIDWORKS 2017 software
    package. All tutorials and figures have been modified for the new version of the
    software.


    # The Organization of This Text


    The organization of the chapters of the book reflects the authors'' preferences
    in teaching the material, but allows for several different options. We have found
    that covering drawings early in the course is helpful in that we can have students
    turn in drawings rather than parts as home-'
  merge: -1
