  md: '# CHAPTER 6


    # Creation of

    Assembly Models


    # Introduction


    In preceding chapters, the development of solid models of parts was covered in
    detail. In this chapter, methods for combining such part models into complex,
    interconnected solid models will be described. These types of models, composed
    of interconnected part models, are called assembly models.


    # Chapter Objectives


    The assembly that will be constructed in this chapter is a model of a hinged door,
    as shown in Figure 6.1.


    +   In this chapter, you will:

    - create holes using the Hole Wizard,

    - learn to import part models into an assembly,

    - use assembly mates to define how components fit together in assembly,

    - add assembly-level features to a model,

    - create an exploded configuration of an assembly model,

    - create an animation of exploded assembly.


    > Figure 6.1


    ![](img/30075d71cb1be5651669ffe0f9695010_205_0.png)


    The chapter will begin with a tutorial describing the construction of the part
    models of the components used in this assembly. After the models are constructed,
    they will be interconnected into an assembly model. The assembly model will be
    used to demonstrate the creation of an exploded configuration of the model.


    # 6.1 Creating the Part Models


    Before an assembly can be created, the parts to be assembled must be modeled.
    In this first step, solid models of the hinge and door components will be created.


    The first model that we will create is the hinge component.'
  merge: -1
