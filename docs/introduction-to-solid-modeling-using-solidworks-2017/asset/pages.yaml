    using the Sketch Filter Tool. However, doing so would change the lengths of the
    edges to join at fillets, using the equal relations applied to other lines to
    be temporarily lost. Also, our methodology is to keep sketches as much as possible,
    since no errors occur in sketches. Therefore, we will add the fillets as a separate
    feature rather than defining them within the sketch.


    ![](img/30075d71cb1be5651669ffe0f9695010_104_0.png)


