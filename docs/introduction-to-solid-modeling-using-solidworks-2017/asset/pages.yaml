  md: '# 310 Part Two Applications of SOLIDWORKS


    # FUTURE STUDY


    # Machine Dynamics and Machine Design


    In this chapter, we have examined a four-bar linkage and performed some simple
    motion analysis. If we were designing this mechanism for an engineering application,
    many more questions would remain:


    mechanisms and machinery, many mechanical engineering curricula include upper-level
    courses in the advanced application of kinematic and kinetic analysis. Such a
    course is often called a machine dynamics course, and may include study not only
    of linkages, but also of the dynamics of gears, cams, and other mechanical devices.


    +   - How will the output link oscillate, if we know the speed of the input link?


    +   - What size motor would be required to drive the input link?


    +   - How will we transmit the rotational power of the motor to the input link?


    Providing the answers to these questions would generally require the expertise
    of a mechanical engineer. The analysis of link speeds and accelerations is classified
    as a kinematics problem; extending this to the sizing of motors is classified
    as a kinetics problem. Most engineering curricula include basic courses in physics
    and dynamics, which address kinematic and kinetic analysis. However, because of
    the great emphasis in mechanical engineering on applying these principles to


    The question of power transmission requires their insight behind kinematic and
    kinetic analysis. The choice of transmission also requires the investigation of
    various alternatives, such as a geared transmission, a belt and pulley or a sprocket
    drive. The selection and sizing of that transmission system requires knowledge
    not only of kinematic and kinetic analysis, but also of the application of stress
    analysis to the transmission components. This type of analysis is often covered
    in mechanical engineering curricula in machine components and machine design courses.


