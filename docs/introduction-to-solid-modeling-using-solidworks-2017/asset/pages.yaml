  md: '# Part One Learning SOLIDWORKS


    # FIGURE 1.12


    Just to the left of the drawing area is the FeatureManager Design Tree. The steps
    that you will execute to create the part will be listed in the FeatureManager.
    This information is important when the part is to be modified. When you open a
    new part, the FeatureManager lists an origin and three predefined planes (Front,
    Top, and Right), as shown in Figure 1.12. As you select each part with your mouse,
    the part is highlighted in the graphics area. We can create other planes as needed,
    and so will later in this tutorial.


    At the top of the graphics area is the Heads-Up View Toolbar. This toolbar contains
    many options for displaying your model. We can explore these options in this tutorial.


    ![](img/30075d71cb1be5651669ffe0f9695010_22_0.png)


    # FIGURE 1.13


    We will now show some of the programs.


    Select the Options Tool from the Menu bar toolbar, as shown in Figure 1.13 (You
    can also access the options from the Main Menu, by selecting Tools: Options)


    ![](img/30075d71cb1be5651669ffe0f9695010_22_1.png)


    # FIGURE 1.14


    The dialog box contains settings for both the system and the specific document
    that is open.


    ![](img/30075d71cb1be5651669ffe0f9695010_22_2.png)


    Under the System Options tab, choose Colors and change the icon to "Classic" and
    the color scheme to "Green Highlight," as shown in Figure 1.14.


    The Classic for icons makes many of the icons in colors other than the default
    blue and black, making them easier to recognize for new users. The Green Highlight
    causes currently selected items to be highlighted in green, as the example implies.
    The default option for selected items is blue. Since another shade of blue is
    used for other purposes, highlighting is used in this book to avoid confusion.
    Since these changes were made to the SOLIDWORKS sessions, they will remain in
    effect for future documents, whereas Document Properties will only apply to the
    current part.


    # FIGURE 1.15


    ![](img/30075d71cb1be5651669ffe0f9695010_22_3.png)


    Select the Properties tab. In the list of options, Drawing Standard will be highlighted.
    Select ANSI from the pull-down menu, as shown in Figure 1.15.


    # FIGURE 1.16


    ![](img/30075d71cb1be5651669ffe0f9695010_22_4.png)


    ANSI is the American National Standards Institute, an organization that formats
    and publishes drawing standards used by most companies in the United States. European
    companies are more likely to use the standards of ISO, the International Organization
    for Standardization.


    Also under the Document Properties tab, select Dimensions. Use the pull-down box
