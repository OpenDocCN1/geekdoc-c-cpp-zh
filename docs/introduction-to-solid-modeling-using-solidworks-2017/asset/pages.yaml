  md: '# A Part Created with a 3-D Sketch as the Sweep Path


    The use of a 3-D sketch as a sweep path allows more complex parts to be created.
    As the name implies, a 3-D sketch contains entities in 3-D space, whereas typical
    sketches contain entities that exist in a plane. Not all sketch entities are available
    in a 3-D sketch.


    In this exercise, we will model the handlebars shown in Figure 4.76. Since the
    handlebars are defined in metric units, we need to set the units accordingly.


    ![](img/30075d71cb1be5651669ffe0f9695010_149_0.png)


    Open a new part. In the Status Bar at the bottom of the screen, click on the unit
    system (IPS) and select MMGS as the new unit system, as shown in Figure 4.77.


    If you want to change the number of decimal places displayed, you can do this
    from the Status Bar menu as well by selecting Edit Document Units ... as shown
    in Figure 4.77.


    From the Sketch group of the CommandManager, click the arrow under the Sketch
    Tool and select 3-D Sketch, as shown in Figure 4.78.


    Figure 4.77

    | MKS (meter, kilogram, second) |

    | CGS (centimeter, gram, second) |

    | MMGS (millimeter, gram, second) |

    | ☑ IPS (inch, pound, second) |

    | Edit Document Units... |

    | IPS - |


    When working with 3-D sketches, the axes displayed in the corner of the sketch,
    shown in Figure 4.79, are especially important. When we draw lines, we will do
    so in one of the primary planes—XY, YZ, or ZX.


    Select the Line.


    Note that beside the cursor, the line that will be drawn in is displayed. We want
    our first two lines to be sketched in the ZX plane, so we will change that orientation
    before proceeding.


    Press the Tab key, which causes the sketch plan to cycle between the three principal
    planes. When the sketch plan selected is ZX, as shown in Figure 4.80.


