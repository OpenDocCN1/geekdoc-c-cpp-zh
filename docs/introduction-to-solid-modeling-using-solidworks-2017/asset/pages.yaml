  md: '# 5.3 Modeling Tutorial: Cap Screw with Design Table


    Note: This tutorial requires Microsoft Excel to be installed on your computer.


    In this section, we will create a family of similar parts. Many parts are defined
    this way, especially common parts as fasteners, washers, seal rings, and so on.
    Rather than creating separate model files and drawings for every different part,
    a single part with multiple configurations is made. A single drawing can be made
    to define the parameters of all of the different configurations. The specifications
    of the dimensions that each configuration are contained in a spreadsheet called
    a design table.


    Open a new part. Select the Right Plane from the FeatureManager, and select the
    Circle Tool from the sketch group of the CommandManager. Draw a circle centered
    at the origin. Select the Smart Dimension Tool, and dimension the diameter of
    the circle as 0.50 inches, as shown in Figure 5.81.


    ![](img/30075d71cb1be5651669ffe0f9695010_183_0.png)


    Select the Extruded Boss/Base Tool from the Features group of the CommandManager,
    and extrude the circle 1.50 inches, in the direction shown in Figure 5.82.


    Select the face shown in Figure 5.83, and select the Normal View.


    Select the Circle Tool from the Sketch group of the CommandManager. Draw a circle
    centered at the origin. Select the Smart Dimension Tool and dimension the diameter
    of the circle as 0.75 inches, as shown in Figure 5.84.


    ![](img/30075d71cb1be5651669ffe0f9695010_183_1.png)


    ![](img/30075d71cb1be5651669ffe0f9695010_183_2.png)


    ![](img/30075d71cb1be5651669ffe0f9695010_183_3.png)'
