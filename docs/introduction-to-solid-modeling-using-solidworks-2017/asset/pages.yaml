  md: '# Manufacturing Processes, Geometric Dimensioning and Tolerancing, and Metrology


    In this example, we placed a relatively tight tolerance on the diameter of the
    center hole so that a tight fit could be realized between the flange and part
    that fits into the hole. How do you know the tolerance should be? Perhaps a better
    question is: what tolerance is required for the part as designed in an assembly?
    The answer to this question in many cases dictate the manufacturing process that
    can be used. Many engineers study manufacturing processes, but it is impossible
    to learn the specific details of the manufacturing processes in use today. On
    the job, engineers learn as much as possible about the manufacturing processes
    used by their company and its suppliers, in order to understand what tolerances
    are practical and economical.


    In able condition of a part, considering its function. In the example we just
    discussed, a straightforward tolerance might be required. In the drawing tutorial
    in this chapter, we added a specification to a surface that was necessary for
    sealing. Proper application of GD&T standards can reduce the cost of making many
    parts, since they control the important features of a part more efficiently than
    simply tightening the tolerance values of all dimensions. In many companies, the
    drawing of details is poor because departments use less-formal drawings and sketches.
    However, engineers detail their own. For engineers, study of GD&T standards and
    practices is necessary.


    Applying dimensions and tolerances engineering drawings is a more complex topic
    than first appears. For example, consider a simple part such as a pin that is
    required to fit into a hole. If we simply define the diameter of the pin and place
    tolerances on the diameter, we are sure that the pin will fit into the hole? What
    if the pin is slightly bent? Its diameter might be within the limits defined by
    the tolerance, but it may not work in its intended purpose. The process of Geometric
    Dimensioning and Tolerancing (GD&T) allows a designer to specify the accept


    A related area of metrology, the science of measurements. Many features are difficult
    to measure accurately with traditional methods, and coordinate-controlled Measuring
    Machines (CMMs) are now widely used in industry. Using statistical methods with
    measured data, quality assurance engineers track variations and control the processes
    that are used to produce the components. This method of Statistical Process Control
    (SPC) allows problems to be detected and corrected before defective parts


    # FIGURE 2.55


    In the Top View, click on the line corresponding to the back surface of the flange,
    as shown in Figure 2.55. Select the Geometric Tolerance Tool from the Annotation
    group of the CommandManager, as shown in Figure 2.56.


