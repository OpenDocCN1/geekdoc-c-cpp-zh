  md: '# Finding the Properties of 2-D Shapes


    The SOLIDWORKS program can be used to determine the properties of areas. For example,
    the areas of complex shapes can be determined, and the locations of centroids
    and the values of inertia of areas can be computed.


    # 9.2.1 Calculating the Area of a Shape


    Consider the built lot in Figure 9.45. Suppose that we want to find the acreage
    of this lot. The first step is to draw the lot on 8-1/2 x 11 inch sheet, the minimum
    scale factor possible will be 1320 inches (110 feet) divided by 8.5 inches = 155.
    We will use a scale factor of 1:200.


    FIGURE 9.45


    ![](img/30075d71cb1be5651669ffe0f9695010_280_0.png)


    FIGURE 9.46


    Open a new drawing. Choose an A-Landscape size without a sheet format default.
    Set the drawing to 1:200 and the units to feet & inches. Draw and show the dimension
    in Figure 9.45. Fix one corner of the lot, and the drawing should be fully defined.


    Press the Esc key to deselect any points or lines. Select Tools: Evaluate: Section
    Properties from the main menu, as shown in Figure 9.46. Click the Options button,
    make sure the Scientific Notation box is unchecked, and use the custom settings
    option. Set the units to feet and the number of decimal places to 6, as shown
    in Figure 9.47. Click OK.


    FIGURE 9.47


    ![](img/30075d71cb1be5651669ffe0f9695010_280_1.png)'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# Chapter 9 Generation of 2-D Layouts 267


    The area will be displayed in the units selected, in this case square feet. However,
    the area displayed will be that of the drawing, not the actual area. Since the
    area of the drawing in square feet is small, a large number of decimal places
    will be needed for accuracy.


    FIGURE 9.48


    The area is displayed 0.318910 square feet, as shown in Figure 9.48. To determine
    the actual area, the local area must be adjusted for the scale. Since area area
    has units of length squared, the actual area must be multiplied by the scale factor
    squared:


    ![](img/30075d71cb1be5651669ffe0f9695010_281_0.png)


    Area = (0.318910 ft)/(200²) = 12.756 ft²


    To convert to acres, the conversion factor of 43,560 ft²/acre must be applied:


    Area = (12,756 ft²)/(43,560 ft²/acre) = 0.29 acres


    # 9.2.2 Calculating the Section Properties of a Shape


    FIGURE 9.49


    In mechanics of materials, it is often necessary to compute the moment of inertia
    of the cross-section of a structural member. For simple shapes, such as a rectangle
    or circle, easy formulas can be used for this computation. For compound shapes,
    such as a T-beam constructed from two rectangular shapes, the calculations are
    lengthy.


    ![](img/30075d71cb1be5651669ffe0f9695010_281_1.png)


