  md: '# # CHAPTER 5

    Parametric Modeling Techniques


    # Introduction


    One of the tremendous advantages of solid modeling software is the ability to
    represent geometric relationships in a parametric form. In a parametric model,
    the description of the model contains both a geometric description (shape, orientation,
    etc.) and specific numerical parameters (number of instances, etc.). Consider,
    for example, a simple parameterized solid model of a cylinder; the definition
    of the hole by a geometric description defining the primitive parameters (diameter
    and length) to fully define the model. A "family" of cylindrical parts of different
    dimensions and lengths could be modeled with a single parameterized model, with
    only a numeric table of values used to differentiate the parts in the family.


    The Linear Pattern Tool used to define the hole pattern in Chapter 3 is another
    good example of a parameterized model; the geometric information used to describe
    a hole includes:


    +   * the shape of the hole (circular)

    * the type of extruded ("through all")


    The numeric parameters that must also be defined:

    * the vectors (axes) that define the two directions of the pattern

    * the "repeat" dimensions along the two directions

    * the number of instances of the holes in each direction


    Changes can be readily made to the parameters to update the model, without requiring
    any changes to the geometric information.


    This concept of using numeric parameters to drive a solid model can be exploited
    in design. One powerful tool that can be employed in the development of mathematical
    relationships (equations) that relate the values of two or more parameters in
    a model.


    ![](img/30075d71cb1be5651669ffe0f9695010_165_0.png)


    # Chapter Objectives


    In this chapter, you will:


    +   * use the Draft Tool to add draft to an existing solid part,

    * learn how to use a shared sketch to create more than one feature,

    * develop equations to embed parameterized relationships into a solid model,

    * use a design to create a family of similar parts, and

    * create a multiple-configuration part drawing.'
  merge: -1
  pgno: 165
- img_proc: true
  md: 'In our hole pattern, for example, we might want to restrict our model so that
    the number of holes in one direction is always the same as the number of instances
    of holes in the other direction. This is accomplished by relating the two parameters
    together with an equation, for example:


    (# of instances along Direction 2) = (# of instances along Direction 1)


    Once this parameterized relationship is established, any change to the dependent
    parameter (the number of holes along Direction 1) would automatically update the
    value of the dependent parameter (the number of holes along Direction 2), and
    the model would be updated accordingly. This allows the engineer to embed design
    intelligence and “rules-of-thumb” directly into solid models.


    In this chapter, an example of a mechanical part that contains embedded equations
    to drive specific parameters will be presented. The tutorial will introduce some
    new modeling operations that have not yet utilized in the preceding chapters.
    A second example will be presented where a spreadsheet-based design table is used
    to drive the dimensions of a model, producing an entire family of parts.


    # 5.1 Modeling Tutorial: Molded Flange


    In this exercise, the flange shown in Figure 5.1 will be created. Since this is
    to be a molded part, draft will be added to the appropriate surfaces.


    FIGURE 5.1


    ![](img/30075d71cb1be5651669ffe0f9695010_166_0.png)


