  md: 'Part One Learning SOLIDWORKS


    # # DESIGN INTENT Selecting a Modeling Technique


    The three fillets are added in a single step by selecting the three edges to be
    filleted within a single fillet command. With this method, only the first fillet
    is dimensioned. Another way to add the fillets is to close the Fillet Tool after
    each fillet is created, then the fillets are created in three separate steps.
    The preferred method


    depends on how you wish to edit the fillet. If you want all of the fillets to
    always have the same radius, the first method allows one value to be changed for
    all three fillets. If you prefer to edit the fillets separately, then the second
    method provides an editable edition for each fillet.


    Now we can add the chamfer to the center hole. A chamfer is a conical feature
    formed removing material from an edge.


    Select the arrow under the Fillet Tool in the CommandManager, and select the Chamfer
    Tool, as shown in Figure 1.96. Click on the edge shown in Figure 1.97 to select
    it as the edge to be chamfered. In the PropertyManager, select the chamfer parameters
    to 0.080 inches and 45 degrees, as shown in Figure 1.98, and click the check mark
    to finish.


    The finished part is shown in Figure 1.99.


    From the main menu, select File: Save. Leave the part file open for the next section,
    in which we will learn how to make modifications to the part.


