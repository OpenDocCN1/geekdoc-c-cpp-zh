  md: '# 14 Part One Learning SOLIDWORKS


    # FIGURE 1.43


    The View Orientation Tool opens a menu of standard view options, as shown in Figure
    1.43. The principal views—Front, Back, Top, Bottom, Left, and Right—can be displayed
    by clicking the appropriate icon. The right side of the menu is a pull-down menu
    of three views: Isometric, Trimetric, and Diometric, as shown in Figure 1.44.
    In an isometric view, the view orientation is such that the angles between the
    displayed edges of a cube are equal, in a trimetric view, two of the edges are
    equal, and in a trimetric view all angles are different. The Trimetric View in
    SOLIDWORKS emphasizes the focus of the front of the part, and is the default view.
    Best practice is to orient the view that is most descriptive of the part. At the
    bottom of the menu are tools for displaying multiple views in separate windows
    on the screen. We will demonstrate their use later in this chapter. The Normal
    To Tool aligns the view to be perpendicular to a selected plane or surface. This
    tool is useful when sketching in a plane that is not perpendicular to any of the
    views. When the View Selector Tool is turned on, the part is shown in “box,” as
    shown in Figure 1.46. Clicking on a side, edge, or corner of the box changes the
    view to be normal to the selection. The View Selector Tool can be toggled or off;
    in this book we will turn it off.


