    ![](img/30075d71cb1be5651669ffe0f9695010_125_0.png)


    # FIGURE 3.119


    ![](img/30075d71cb1be5651669ffe0f9695010_125_1.png)


    To play the animation, select Play Start, as shown in Figure 3.120.


    # FIGURE 3.120


    # FIGURE 3.121


    We will now save the animation as a video file. First, we will minimize the MotionManager
    so that the aspect ratio is better for the finished graphics.


    ![](img/30075d71cb1be5651669ffe0f9695010_125_2.png)


    ![](img/30075d71cb1be5651669ffe0f9695010_125_3.png)


    Collapse the MotionManager by selecting the arrow at the right edge of the screen,
    as shown in Figure 3.121. If desired, re-size the print window to the desired
    aspect ratio. Select the Animation Tool, as shown in Figure 3.122. Select the
    default settings, and accept the Video compression, choose the Microsoft Video
    compressor and uncheck the Key Frames box, as shown in Figure 3.123.


    # FIGURE 3.122


    # FIGURE 3.123


    ![](img/30075d71cb1be5651669ffe0f9695010_125_4.png)


    ![](img/30075d71cb1be5651669ffe0f9695010_125_5.png)


    The animation will run on the screen as it is created. When the animation is completed,
    the saved video file can be viewed from a standard player. Videos can also be
    embedded into PowerPoint presentations. This allows a model to be displayed and
    rotated during the presentation without having to run SOLIDWORKS on the presentation
    computer.


    Save and choose the SOLIDWORKS file.'
