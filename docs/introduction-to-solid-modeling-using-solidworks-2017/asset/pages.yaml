    defining the rib direction points towards the part, as shown in Figure 3.82. Click

    the check mark to complete the rib, which is shown in Figure 3.83. Hide Plane2.


    Earlier, we used the Mirror Entities Tool to create symmetric elements

    within a sketch. A similar tool in the Features group of the

