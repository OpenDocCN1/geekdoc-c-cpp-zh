  md: '# Chapter 2 Engineering Drawings


    When we modeled a part in Chapter 1, we found most of the commands we needed in
    the CommandManager. In the drawing mode, the CommandManager has three groups of
    commands that we will use regularly. To keep the interface as simple as possible,
    we will hide the others.


    Right-click on any of the CommandManager tabs. Click the name of each group other
    than View Layout, Annotation, and Sketch to clear the check mark and turn off
    display of drawing, as shown in Figure 2.16.


