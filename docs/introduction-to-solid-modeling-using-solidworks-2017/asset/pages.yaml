    the build process. When the model is removed, it has low strength and must be
    handled carefully. The model is then infused with wax, cyanoacrylate adhesive
    (“super glue”), or epoxy to give it strength. The finished model, infused with
    epoxy resin, is shown in Figure 13.13.


    FIGURE 13.12


