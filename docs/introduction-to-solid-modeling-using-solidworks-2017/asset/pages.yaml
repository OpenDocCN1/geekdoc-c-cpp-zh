  md: '# 7.3 Detecting Interferences and Collisions


    In the assembly mode, the SOLIDWORKS program has the ability to check for interferences
    between components. It does this by determining locations where solid volumes
    overlap. This tutorial will demonstrate these capabilities.


    Open the Hatch file. Click and drag on the hatch to rotate it into the approximate
    position shown in Figure 7.37. Press the Esc key to delete the hatch.


    In this doing, we have intentionally introduced an interference between the door
    and the frame.


    From the main menu, select Tools: Evaluate: Interference Detection.


    The PropertyManager shows the parts for which interference is to be analyzed.
    By default, the entire assembly is assembled.


    Click the Calculate button to commence interference detection, as shown in Figure
    7.38.


    In the PropertyManager, the interference between the frame and hatch is identified,
    as shown in Figure 7.39. Note that there are seventeen regions of interference
    detection. In addition to the overlap of the door and the frame, the sixteen screws
    in their undersized holes are detected. The Ignore button can be used to eliminate
    the intentional screwferences from the list.


    Click the X in the PropertyManager to end interference detection.


    Although we have seen that components in an assembly can be moved by simply clicking
    and dragging them, the Move Component Tool allows collision detection to be incorporated
    into part movements.


    Click and drag the hatch so that it no longer overlaps the frame.


    ![](img/30075d71cb1be5651669ffe0f9695010_248_0.png)


    ![](img/30075d71cb1be5651669ffe0f9695010_248_1.png)


    ![](img/30075d71cb1be5651669ffe0f9695010_248_2.png)'
