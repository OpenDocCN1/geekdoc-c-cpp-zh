- img_proc: true
  md: 'FIGURE 5.74


    Chapter 5 Parametric Modeling Techniques 167


    The model will be rebuilt, the Rib Pattern modified and the driven Hole modified
    as well, as shown in Figure 5.74.


    ![](img/30075d71cb1be5651669ffe0f9695010_181_0.png)


    While the number of holes is correctly tied to the number of ribs, our design
    intent may not be satisfied by this model. Note that the angular location of the
    holes was set at 30 degrees from the center of a rib; centered the hole between
    two ribs when there were six ribs in the pattern, it no longer provides for centering
    of the holes when the number of ribs is modified. We will create a new parametric
    equation to establish the relationship required by our


    design intent; the equation will drive the angular dimension of the holes so that
    they are centered between the ribs.


    From the main menu, select Tools: Equations. In the dialog box, click the Add
    Equation cell. click on the Bolt in the FeatureManager to display the dimensions
    associated with the bolt hole.


    The angular spacing between ribs is 360 degrees divided by the number of ribs.
    The first hole is located at one-half of this value away from the first rib. Therefore,
    the equation required to set the angular dimension in degrees to the desired value
    will be:


    Angular Dimension = (1/2) (360/Number of Ribs) or


    Angular Dimension = 180/Number of Ribs


    With the hole dimensions displayed, select the angular dimension location of the
    hole, as shown in Figure 5.75.


    FIGURE 5.75


    ![](img/30075d71cb1be5651669ffe0f9695010_181_1.png)


    In the “Value/Equation” column, type 180/"Ribs," as shown in Figure 5.76. Click
    the check mark.


    FIGURE 5.76


    | | | |

    |---|---|---|

    | "D1@Hole Pattern" | "Ribs" | 3 |

    | "D2@SketchS" | 180/"Ribs" | |'
  merge: -1
  pgno: 181
- img_proc: true
  md: 'The “Evaluates to” column confirms that the dimension will equal 60 degrees
    with the current number of ribs (3), as shown in Figure 5.77.


    # FIGURE 5.77


    | Equations | | |

    | --- | --- | --- |

    | "D1@Hole Pattern" = "Ribs" | 3 |

    | "D2@Sketch5" = 180 / "Ribs" | 60deg |


    Click OK to close the dialog box.


    The result is shown in Figure 5.78.


    # FIGURE 5.78


    ![](img/30075d71cb1be5651669ffe0f9695010_182_0.png)


    Change the number of ribs to other values and check to see that the number and
    locations of the holes in a consistent manner.


    Another example, with five ribs and holes, is shown in Figure 5.79.


    Note that there is a difference between driving and driven parameters. In this
    example, the number of ribs is a free design choice, and is therefore a driving
    parameter. As such, it appears only on the right side of the equal sign in parametric
    equations. Conversely, the number of holes and the angular hole location are driven
    parameters; they are determined by the choice of ribs, and appear on the left
    side of the equal sign in parametric equations. Their values are set by the established
    driving parameters, driven parameters cannot be modified directly in the model.


    # FIGURE 5.79


    ![](img/30075d71cb1be5651669ffe0f9695010_182_1.png)


    Perform the following demonstration to verify this.


    Double-click on the Hole Pattern in the FeatureManager to display the associated
    parameters in the model window. Double-click on number of holes in the pattern,
    to try to change the value.


    # FIGURE 5.80


    The “Σ” symbol displayed beside the value (see Figure 5.80) indicates that the
    dimension is controlled by an equation and cannot be changed.


    ![](img/30075d71cb1be5651669ffe0f9695010_182_2.png)


    Click the check mark to close the message box. Reset the number of ribs and holes
    to six, rebuild the model, and save the part file.'
  merge: -1
