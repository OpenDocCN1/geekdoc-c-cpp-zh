  md: '# # CHAPTER 11

    Analysis of Mechanisms


    ## Introduction

    A mechanism is an assemblage of links and joints that are connected together to
    achieve a desired motion task. The links provide the mechanical structure of the
    mechanism, while the joints provide the ability for the mechanism to move. Some
    typical kinds of mechanisms commonly used by mechanical engineers are shown in
    Figure 11.1.


    # ## Chapter Objectives


    +   In this chapter, you will:

    - learn some basic terminology associated with mechanism design,

    - use the assembly modeling techniques learned in Chapter 6 to develop a working
    model of a mechanism,

    - perform a motion simulation of a mechanism, and

    - export a motion simulation as a video file.


    FIGURE 11.1


    ![](img/30075d71cb1be5651669ffe0f9695010_309_0.png)


    The ways in which we can connect links with joints and provide a mechanism with
    the ability to move are seemingly endless. Also, the links can take on any shape
    and size we, the motion may change in complicated and seemingly unpredictable
    ways as we modify the links. The design of a mechanism may seem like a daunting
    task.'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# 296 Part Two Applications of SOLIDWORKS


    Computer-aided (CAD) packages have become valuable tools in the design and analysis
    of mechanisms. The ability for the design engineer to adjust the size, shape,
    and interconnectivity of links and joints quickly assess the impact on the mechanism
    has accelerated the design cycle of mechanisms. The SOLIDWORKS program, with its
    ability to represent geometric constraints between structural components using
    assembly mates, is ideally suited to the design and virtual prototyping of complex
    mechanisms.


    The remainder of this chapter will be devoted to the use of the SOLIDWORKS program
    in the design of mechanisms through a case study involving the design of a four-bar
    linkage. In Chapter 10, we evaluated the motion of a four-bar linkage in a 2-D
    sketch, with lines representing the links. In this chapter, we will model the
    links in 3-D parts, and use a motion study to visualize the motion of the linkage.


    # 11.1 Approaching Mechanism Design with SOLIDWORKS Assemblies


    Consider the four-bar linkage, a classic mechanism used in engineering, shown
    in Figure 11.2.


    ![](img/30075d71cb1be5651669ffe0f9695010_310_0.png)


    It consists of three structural links, connected to each other and fixed pivot
    joints that allow for rotating motion between the links. Though only three physical
    links, it is called a fourbar linkage because there is an implied fourth structural
    link that represents the fixed frame to which the linkage is attached and connects
    the fixed ground points, as shown in Figure 11.3.


    While the choice of a four-bar linkage as our preliminary design solution is an
    important step, the parametric design problem of selecting the appropriate link
    lengths and ground pivot locations to give the desired motion is a difficult engineering
    task. We will develop a model to aid in this parametric design phase.


    ![](img/30075d71cb1be5651669ffe0f9695010_310_1.png)


    The features that we will employ the assembly capabilities. The development of
    assembly mates and the definition of


    assembly mates were covered in Chapter 6. Mated assemblies are an ideal tool for
    use in mechanism design, since the joints that provide the physical relationships
    between the links are analogous to the mates that define the geometric relationships
    between parts.'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# Chapter 11 Analysis of Mechanisms 297


    Think about two links connected by a pin joint, as shown in Figure 11.4.


    The pin through the holes in the links allows for rotation between the links,
    giving a "scissors" action. The mated assembly representation of this type of
    link/joint assembly would involve two parts, with two mates serving the same geometric
    purpose as the pin in the physical linkage:


    +   - The front face of one link is aligned with the back face of the other link
    using a coincident mate; "slide by" allows one link to move without any interferences
    with the surfaces. (While a physical linkage would involve a low-friction spacer
    to separate the links slightly, it is not necessary to move the spacer to simulate
    the allowed motion of the joint.)


    +   - The hole in one link is aligned with the hole in the other link using a
    centric mate; this keeps the holes aligned at their central axes.


    By capturing the essential constraints that underpin a pin joint, this sequence
    of two mates imparts the same motion capabilities to the solid model that are
    seen in the physical mechanism.


    Using this simple two-link mechanism as a building block, complex mechanisms can
    be assembled and virtually tested. Mechanism motion can be tested and debugged
    without the need for physical prototypes to be constructed. The following section
    will show the development of a model of a four-bar linkage.


    ![](img/30075d71cb1be5651669ffe0f9695010_311_0.png)


    # 11.2 Development of Part Models of Links


    In this section, a step-by-step tutorial will lead you through the development
    of the part models required to make a "working" model of a four-bar linkage. Four
    links, in shape of different lengths, will be constructed.


    Open a new part. Select the Front Plane. Choose the Slot Tool from the Sketch
    Group of the CommandManager, as shown in Figure 11.5. In the PropertyManager,
    set the type of slot to Center Slot (this option can also be selected directly
    from the pull-down menu beside the Slot Tool), check the Add Dimensions box, and
    make sure the type of dimensioning is Center-to-Center, as shown in Figure 11.6.


    ![](img/30075d71cb1be5651669ffe0f9695010_311_1.png)


    ![](img/30075d71cb1be5651669ffe0f9695010_311_2.png)'
