  md: '# Chapter 2 Engineering Drawings


    click on one of these dots, the arrowheads will switch from outside to inside
    or versa, as shown in Figure 2.25.


    ![](img/30075d71cb1be5651669ffe0f9695010_75_0.png)


    Dimensions are shown in the view in which they were created. For example, the
    5.5-inch and 2.75-inch diameters are shown in the Front View, since they were
    created from circles sketched in the Front Plane (or sketch planes) to the Front
    Plane. However, standard drawing practice is for the diameter of a solid feature
    to be shown in a normal view to the one in which it appears as a circle. Therefore,
    we want to move these dimensions in the Top View. By deleting these dimensions
    from the Front View and adding them to the Top View, we simply move them.


    ![](img/30075d71cb1be5651669ffe0f9695010_75_1.png)


    Press and hold the Shift key. Click and drag the 5.5-inch dimension until the
    cursor is within the boundaries of the Top View. Release the leader button, and
    the dimension will be placed in the Top View, as shown in Figure 2.26. (Make sure
    to release the leader button before releasing the Shift key; otherwise, the operation
    will not work.) Repeat for the 2.75-inch dimension.


    Hole dimensions should be shown with layers, rather than linear dimensions. Depending
    on how you dimension the center in the part model, the 1.50-inch dimension may
    be imported as a linear dimension, as shown in Figure 2.23, or with a leader.


    > If the 1.5-inch diameter appears as a linear dimension, right-click on the dimension,
    and choose Display Options: Display as, as shown in Figure 2.27. Click and drag
    the dimension to a convenient location, as shown in Figure 2.28.


    ![](img/30075d71cb1be5651669ffe0f9695010_75_2.png)


    The orientation of diameter dimensions can be changed by clicking and dragging
    the dot that appears directly above the dimension value when it is. For example,
    if the 4.25-inch diameter is imported with the dimension line horizontal, it can
    be rotated 90 degrees by clicking and dragging the leader, as shown in Figure
    2.29. (This will permit the leaders of the hole dimensions from crossing the extension
    lines of 4.25-inch dimension.)


    ![](img/30075d71cb1be5651669ffe0f9695010_75_3.png)


    The options for changing the appearance of dimensions, dimension lines, and leaders
    are numerous, and we will cover only a few in this text. By clicking on any dimension
    and selecting Display Options or Properties, you will find that it is easy to
    change the appearance of the dimensions.


    ![](img/30075d71cb1be5651669ffe0f9695010_75_4.png)'
