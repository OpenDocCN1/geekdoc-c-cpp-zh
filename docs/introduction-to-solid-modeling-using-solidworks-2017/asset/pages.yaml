  md: '# PREFACE


    As design engineers and engineering professors, the authors have witnessed incredible
    changes in the way that products are designed and manufactured. One of the biggest
    changes over the past 20 years has been the development and widespread usage of
    solid modeling software. When we first saw modeling, it was used only by large
    companies. The cost of the software and the powerful workstations required to
    run it, along with the complexity of using the software, limited its use. As the
    cost of computing hardware dropped, solid modeling software was developed for
    personal computers. In 1995, the SolidWorks Corporation released the initial version
    of SOLIDWORKS® software, the first solid modeling program for the Microsoft Windows
    operating system. Since then, the use of solid modeling has become an indispensable
    tool for almost any company, large or small, that designs a product.


    One application of solid modeling in the design process, additive manufacturing,
    is illustrated on the cover of this book. The flanged member in Chapter 5 is converted
    to a stereolithography file, in which the surfaces of the part are represented
    by series of triangles. This file is then transferred to one of the many types
    of additive manufacturing machines (commonly referred to as 3D printers), where
    a prototype can be made quickly. The prototype be used to verify with other parts
    or tested for functionality. In some cases, fully functional parts can be made
    with additive manufacturing. The part on the cover was made with a Formlabs 2
    stereolithography printer, which uses a laser to create liquid resin layer-by-layer
    to produce a part. Additive manufacturing is discussed further in Chapter 13.


    SOLIDWORKS is a registered trademark of Dassault Systèmes SolidWorks Corporation.'
  merge: -1
