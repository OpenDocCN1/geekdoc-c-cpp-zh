    Most users will probably find it easier to select a command as "Insert Sketch"
    in the menu instead of a small icon. Therefore, in the text and Appendix A we
    recommend leaving the "Show on selection" option turned off. Leaving the "Show
    on selection" box checked and the "Show in shortcut menus" unchecked allows either
    option to be utilized: a command can be selected from the context toolbar by selecting
    (left-) the feature, or the command can be selected from a menu by right-clicking
    the feature.


    # FIGURE B.34


    ![](img/30075d71cb1be5651669ffe0f9695010_391_2.png)


    Many users find keyboard shortcuts to useful. For example, when you want to zoom
    out of your model, pressing the Z key allows you to zoom out without having to
    access any menu. Similarly, holding the Shift key while pressing the Z key allows
    you to zoom in. The F key scales the view so that the entire model can be seen
    (zoom to fit).


    ![](img/30075d71cb1be5651669ffe0f9695010_391_3.png)


    One keyboard shortcut that is worth mentioning is the Shortcut Bar, which is accessed
    by pressing the S key. The Shortcut Bar is context-sensitive; that is, it displays
    tools if a sketch is open and feature tools over. As an example, suppose we want
    to add a hole from the top surface of the block shown in B.34. We can open a sketch
    by selecting the Sketch Tool from the context toolbar. With the sketch open, pressing
    the S key causes the menu in B.35 to be displayed. The Circle Tool can be selected
    and a circle added. Pressing the S key again allows the selection of the Smart
    Dimension Tool, as shown in B.36, and the sketch can be dimensioned.


    # FIGURE B.36


    ![](img/30075d71cb1be5651669ffe0f9695010_391_4.png)'
