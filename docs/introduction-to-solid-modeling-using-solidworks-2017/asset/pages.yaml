  md: '# 216 Part One Learning SOLIDWORKS


    # FIGURE 6.110


    ![](img/30075d71cb1be5651669ffe0f9695010_230_0.png)


    In order to view this animation using the Animation Controller, access to the
    assembly model, all part models used in the assembly, and the SOLIDWORKS software
    package are required. To allow someone without access to the models and to view
    this animation, we can save it as a video AVI file.


    In the Animation Controller, click the Save Animation button, as shown in Figure
    6.110.


    # FIGURE 6.111


    ![](img/30075d71cb1be5651669ffe0f9695010_230_1.png)


    The Save Animation to File dialog box will appear, as shown in Figure 6.111. This
    allows us to select the appropriate directory and filename for a video. It also
    allows to set some parameters that control file size and quality, such as the
    number of frames to be saved when we create our video file. For this application,
    we will accept the default values.


    Browse to the file location, and click Save.


    The Video Compression dialog box will appear, as shown in Figure 6.112. This dialog
    allows us to select the video resolution and other parameters of the video file.
    High-resolution images will result in larger sizes. For this application, we will
    not use Key Frames (which cause errors with some operating systems).


    Set the Compression to Microsoft Video, and clear the Key Frame checkbox. Click
    OK to close the Video Compression dialog box.


    # FIGURE 6.112


    ![](img/30075d71cb1be5651669ffe0f9695010_230_2.png)


    The animation will be rendered in the graphics window. While this is occurring,
    the video file will be written at the frames per second and compression level
    specified.


    The video file will be stored using the name and location we specified. In this
    case, the file will be named Door.avi. This is a standalone video file; it is
    not linked to any of your SOLIDWORKS part files. As such, it can be viewed by
    any standard video playback software, such as Windows Media Player or RealPlayer.
    Do, however, that all associativity with the model is lost; subsequent changes
    to the assembly in SOLIDWORKS will not affect this video file. If changes are
    desired, a new video file must be created.


    Close the assembly, without saving the last changes made.'
