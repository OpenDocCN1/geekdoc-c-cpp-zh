  md: '# CHAPTER 12

    Design of Molds and Sheet Metal Parts


    # Introduction


    A design engineer must always consider the method of manufacture

    when designing any part. Failure to do so may result in part designs that

    are more expensive than necessary, have high scrap rates, or

    cannot be at all.


    Some manufacturing processes create unique challenges from a solid

    modeling standpoint. For example, when designing a mold, the shape of

    the part to be removed from the interior of the mold,

    usually with the dimensions adjusted to allow shrinkage of the part

    during the cool-down portion of the molding cycle. Sheet metal parts

    are cut from part material, and then bent into the final shape. Therefore,

    the part definition include both the flat shape and the finished

    geometry. The SOLIDWORKS program has specialized tools for work-

    ing molds and sheet metal parts.


    # Chapter Objectives


    +   - create a cavity within a mold base,

    - create and modify two mold halves that are linked to the mold base with a cavity,

    - make a simple sheet metal part,

    - learn how to show a sheet metal part in either the flat or bent state,

    - make a drawing of a sheet metal flat pattern.


    # 12.1 A Simple Two-Part Mold


    In this exercise, we will make a mold to produce a simple cylindrical

    part. We will be making the part itself.


    Open a new part. Draw and dimension a 3-inch diameter circle in the

    Right Plane, centered at the origin. Extrude the circle using a

    midplane extrusion, as shown in Figure 12.1. Set the total depth of

    extrusion to 5 inches. Create a new folder called “Cylinder Mold” to

    contain the files associated with this exercise. Save the part with the

    file name “Cylinder."


    325'
