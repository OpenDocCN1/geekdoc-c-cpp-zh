  md: '# Engineering Design and Solid Modeling


    The term design is used to describe many endeavors. A clothing designer creates
    new styles of apparel. An industrial designer creates the overall look and function
    of consumer products. Many design functions concentrate mainly on aesthetic considerations—how
    the product looks, and how it will be accepted in the marketplace. The term engineering
    design is applied to a process in which fundamentals of math and science are applied
    to the creation or modification of a product to meet a set of objectives.


    Engineering design is only one part of the creation of a new product. Consider
    a company making consumer products, for example bicycles. A marketing department
    determines the likely customer acceptance of a new bike and outlines the requirements
    for the new design. Industrial designers work on the preliminary design of the
    bike to produce a design that brings functionality and styling that customers
    will like. Manufacturing engineers must consider how the components of the product
    are made and assembled. A purchasing department will determine if some components
    will be more economical to buy than to make. Stress analysts will predict whether
    the bike will survive the forces and environment it will experience in service.
    A model shop may need to build a physical prototype for test functionality.


    During the years immediately following War II, most American companies performed
    the described above or less sequentially. That is, the engineer did not get involved
    in the process until the specifications were completed, and so on. From the 1990s,
    the concept of concurrent engineering became widespread. Concurrent engineering
    refers to the process in which engineering tasks are performed simultaneously
    rather than sequentially. The primary benefits of concurrent engineering are shorter
    product development times and lower development costs. The challenges of implementing
    concurrent engineering are mostly in communications—engineering groups must be
    continuously informed of the actions of the other groups.


    Solid modeling is an important tool in concurrent engineering that the various
    engineering groups work from a common database: the solid model. In a 2-D CAD
    (Computer-Aided Design) environment, the design engineer produced 2-D sketches
    of the component, and a draftsman produced 2-D drawings. These drawings were forwarded
    to the other engineering organizations, where much of the information was then
    duplicated. For example, a toolmaker created a tool from design, scratch, using
    the drawings as a basis. A model builder creates a physical prototype by hand.
    With a solid model, the tool, finite element model, and rapid prototype are all
    created directly from the solid file. In addition to the time savings of avoiding
    the steps of recreating the design for the various functions, many errors are
    avoided by having everyone working from a common database. Although 2-D drawings
    are usually still required, since they are the best way to document dimensions
    and tolerances, they are linked directly to the solid model and are easy to update
    as the solid model is changed.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Chapter 1 Basic Part Modeling Techniques 5


    A mechanical engineering system (assembly) may be composed of thousands of components
    (parts). The detailed design of each component is important to the operation of
    the system. In this chapter, we will step through the creation of simple components.
    In future chapters, we will learn how to make 2-D drawings from a part file, and
    how to put components together in an assembly file.


    # 1.2 Part Modeling Tutorial: Flange


    This tutorial will lead you through the creation of a simple solid part. The part,
    a flange, is shown in Figure 1.1 and is described by the 2-D drawing in Figure
    1.2.


