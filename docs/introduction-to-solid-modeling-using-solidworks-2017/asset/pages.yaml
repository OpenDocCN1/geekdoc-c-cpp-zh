    | Boundary Boss/Base | | |


    ![](img/30075d71cb1be5651669ffe0f9695010_222_3.png)


    At the bottom of the screw, sketch and dimension the lines shown in Figure 6.79
    in the Front Plane. Add a vertical centerline.


    Note that the "cutting tool" profile extends below the bottom of the part. An
    error is encountered when the profile comes to a single point on the centerline.'
