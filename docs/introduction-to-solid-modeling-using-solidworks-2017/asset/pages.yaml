  md: '# DESIGN INTENT Keeping It Simple


    In this exercise, we modeled the pulley using four features: A revolved base,
    a revolved cut for the V-belt groove, fillets, and an extruded cut for the keyway.
    These first three features could have been combined by sketching the complete
    cross-section as a single sketch, as shown here (the Sketch Fillet Tool was used
    to create the fillet profiles). Which method is better? Although the finished
    parts will be identical, breaking a part''s creation into multiple steps is usually
    the best approach. Many of the errors that are encountered when making parts


    related to sketches—duplicate entities, open contours, endpoints of lines and
    arcs that do not meet, and under defined geometry are examples of the types of
    errors that are associated with sketches.(Using the Shaded Sketch Contours Option
    is helpful for finding errors in complex sketches, as only closed contours are
    shaded.)The more complex the sketch, the more likely these errors are to occur,
    and the harder they are to troubleshoot. Also, design changes are easier to make
    with a part created from simple steps.


    ![](img/30075d71cb1be5651669ffe0f9695010_60_0.png)'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# Chapter I Basic Part Modeling Techniques 47


    # # FUTURE STUDY


    # # Dynamics (Kinetics)


    In physics, you learned Newton''s Second Law: take as much torque to bring the
    wheel on the left up to speed as it would the wheel on the right (over the same
    period of time). While a low mass of inertia is usually desirable, a notable exception
    is a flywheel. The inertia of a flywheel in an engine rotating at a high speed
    makes it difficult to slow down. As a result, the rotational speed of the engine
    remains smooth despite small fluctuations in power.


    F = ma or the forces (F) acting on a body equal the mass of the body (m) times
    its acceleration (a). For mechanical engineers designing machines with moving
    components, application of this law requires the forces required to move a body
    in a particular manner. In the field of engineering materials, the development
    of lightweight, strong materials allows moving components to be moved at extremely
    high accelerations, resulting in higher performance.


    The calculation of mass and moments of inertia for complex shapes can be tedious.
    The use of solid modeling software to perform these calculations saves time for
    engineers performing these types of analysis.


    The form of Newton''s Second Law written applies to bodies moving in linear or
    translational motions. Most components also move in rotational motions. Newton''s
    Second Law for rotational motions is:


    T = IR


    or the torques (T) acting on a body equal the mass of inertia (I) times the angular
    acceleration (β) of the body. This mass moment of inertia is a function of the
    body''s mass and the way in which the mass is distributed relative to the axis
    of rotation. For example, consider the two wheels shown here. The two wheels are
    the same diameter and have the same weight, but the wheel on the left has a mass
    of inertia almost twice that of the wheel on the right. If the wheels were mounted
    onto shafts, it would


    ![](img/30075d71cb1be5651669ffe0f9695010_61_0.png)


    asymmetric. If more decimal places are desired for any of the quantities displayed,
    then within the Mass Properties dialog choose Options: Use custom settings and
    choose the desired number of decimal places. You can also change the default number
    of decimal places by choosing Tools: Options: Document Properties: Units and changing
    the value Length under Mass/Section Properties. Also displayed are the part''
    moments of inertia, which are important in dynamic analysis and are often very
    cumbersome to calculate by hand (see the Future Study box).'
  merge: -1
