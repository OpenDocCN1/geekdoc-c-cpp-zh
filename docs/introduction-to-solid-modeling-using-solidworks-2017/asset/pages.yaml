- img_proc: true
  md: '# DESIGN INTENT Assembly-Level Dimensions


    When importing dimensions into our assembly drawing, we selected the option "Only
    assembly," as opposed to "Entire model." As a result, we imported dimensions only
    with assembly-level features. If the other option had been chosen, defining the
    components would have been imported as well. These dimensions could be edited,
    resulting in changes to the part files.


    Including component dimensions in an assembly drawing is not usually recommended.
    One reason is that the components are defined in separate drawings, so adding
    the dimensions to the assembly is redundant. Another reason is that a component
    may be used in multiple assemblies, so editing the assembly level may produce
    unexpected changes to other assemblies.


    ![](img/30075d71cb1be5651669ffe0f9695010_256_0.png)


    The PropertyManager will now contain a list of available orientations associated
    with the door assembly.


