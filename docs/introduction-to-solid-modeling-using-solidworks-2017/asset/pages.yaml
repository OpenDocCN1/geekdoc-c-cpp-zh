  md: '# DESIGN INTENT Part-Level and Assembly-Level Features


    Since the holes we are adding in the tutorial affect only the hatch part, we could
    have added them to the file. Instead, we have added them at the assembly level,
    and they do not appear in the part model (by opening the hatch file after adding
    one or more holes to the assembly). There are two types of features: part-level
    and assembly-level features. Where we apply features the actual manufacturing
    and assembly processes. For example, if the holes are extruded into the hatch
    part with the assembly with hinges, then the holes would be added to the part
    model and are considered part-level features. If the holes are added after placing
    the hinge on the hatch and using the hinge''s


    to locate the drilled holes in the hatch, then they are assembly-level features.


    The difference between part-level and assembly-level features is especially important
    when creating drawings. In this example, the part drawings would contain all information
    needed to manufacture and/or inspect hinge and hatch parts. The assembly drawing
    shows which parts make up the assembly (in a Bill of Materials), and would contain
    only the dimensions needed to assemble them. In this case, the dimensions to locate
    hinges and the hole definitions would be defined on the assembly drawing (we will
    learn how to make an assembly drawing in Chapter 8).


    ![](img/30075d71cb1be5651669ffe0f9695010_222_0.png)


    Switch to the Front View. In the Front Plane, sketch and dimension the three lines
    and vertical centerline shown in Figure 6.76. Be sure to add the 0.365-inch dimension
    as a diameter by clicking on the corner point and the centerline, and dragging
    the dimension to the left of the center. Select the Revolved Boss/Base Tool from
    the Features group of CommandManager, as shown in Figure 6.77. Click the check
    mark to accept the 360-degree default revolution.


    The revolved screw is shown in Figure 6.78.


    ![](img/30075d71cb1be5651669ffe0f9695010_222_1.png)


    ![](img/30075d71cb1be5651669ffe0f9695010_222_2.png)


