  md: '# Chapter I Basic Part Modeling Techniques 25


    # 1.3 Modifying the Flange


    One of the major advantages of solid modeling is the ability to make changes easily.
    As we have observed, the FeatureManager recorded all of the operations to make
    the flange, as shown in Figure 1.100. If we click on the arrow next to feature,
    we see that the sketch associated with each feature is stored, as well. When we
    hover the cursor over a feature or sketch name in the FeatureManager, arrows show
    the relationships of feature to other features in the part. For example, the first
    bolt is the basis for the hole features. In Figure 1.100, the dimension shows
    the move from the "parent" bolt to the "child" (CirPattern1). The display of these
    arrows can be toggled off or by right-clicking on the part in the FeatureManager
    and selecting the Dynamic Reference Visualization (Parent) and (Child) items.


    Let''s change the first item that we created by increasing the diameter of the
    base from 5.5 to 7 inches.


    Right-click Sketch1 in the FeatureManager, and select Edit Sketch.


    Note that if Edit Sketch does not appear in the menu, then an icon for the sketch
    appears in the Context toolbar at the top of the menu. Earlier in the chapter,
    we selected the Customize tool and checked the box labeled "Show in shortcut menu.\
    This causes commands as Edit Sketch, Edit Feature, Hide,, to appear as entries
    in the menu rather as icons at the top of the menu. If you missed this step early,
    then it is recommended that you check the box now. (See Appendix B for more information
    about customizing the SOLIDWORKS interface.)


    Double-click the 5.5-inch dimension, and change it to 7.0 inches, as shown in
    Figure 1.101. When you choose the sketch by clicking on the Edit Sketch Tool in
    the Sketch group of the CommandManager (see Figure 1.102), the part will be updated
    to the new dimension, as shown in Figure 1.103.


    An easier way to edit the sketch dimensions or the extrude depth is illustrated
    next.


    FIGURE 1.100


