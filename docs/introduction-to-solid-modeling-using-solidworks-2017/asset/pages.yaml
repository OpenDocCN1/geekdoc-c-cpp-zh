  md: '# Part One Learning SOLIDWORKS


    FIGURE 3.58


    With the Ctrl key depressed (allow for multiple selections), click to select the
    centerline, the solid line, and the tangent arc, as shown in Figure 3.58. Select
    Mirror Entities from the CommandManager, as shown in Figure 3.59. A symmetric
    sketch will be created about the selected centerline, as shown in Figure 3.60.


    ![](img/30075d71cb1be5651669ffe0f9695010_112_0.png)


    # FIGURE 3.59


    # FIGURE 3.60


    ![](img/30075d71cb1be5651669ffe0f9695010_112_1.png)


    While this sketch exhibit the required symmetry, it does not capture our design
    intent. We need to add an additional relation between the two tangent arcs.


    Select the two arcs, and apply a Concentric relation from the context menu or
    from the PropertyManager, as shown in Figure 3.61. Note: There may be only a single
    arc in your sketch. If you happen to drag the first arc so that its center lies
    on the centerline, then when you used the Mirror Entities Tool, the mirrored arc
    and the original arc were concentric and automatically combined into a single
    arc. If this is the case, you can proceed to the next step.


    The two arcs are now tangent to each other, as shown in Figure 3.62. Note that
    we could have specified a tangent relation instead of the concentric relation,
    but there are two possible solutions to the tangent relation. To ensure that the
    geometry is the way we want, the concentric relation provides only one solution.


    # FIGURE 3.61


    # FIGURE 3.62


    ![](img/30075d71cb1be5651669ffe0f9695010_112_2.png)


    ![](img/30075d71cb1be5651669ffe0f9695010_112_3.png)'
