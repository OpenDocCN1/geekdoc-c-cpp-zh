- img_proc: true
  md: 'The menu also includes a Record Video option, which records the screen as the
    motion is rotated on the screen. However, we can create animations with the MotionManager,
    which gives us better control over the manipulation of the model.


    # FIGURE 3.115


    Select the Motion Study tab at the bottom of the screen, as shown in Figure 3.115.
    (If the tab is not visible, right-click in the CommandManager and check MotionManager.)


    ![](img/30075d71cb1be5651669ffe0f9695010_124_0.png)


    A timeline is displayed. We will set the view orientations of the model that we
    desire along the timeline, using keys.


    Select the Tricetric View. Zoom and the pan as desired. Desire video will not
    show the FeatureManager, placing the model slightly to the left of center in the
    graphics area will result in centered-to-right in the view. Right-click diamond-shaped
    key orientation and Camera Views, and select Replace Key, as shown in Figure 3.116.
    Move the cursor to the t-second mark on the timeline, to the right of the Orientation
    and Camera entry. Right-click and select Place Key, as shown in Figure 3.117.


    # FIGURE 3.116


    ![](img/30075d71cb1be5651669ffe0f9695010_124_1.png)


    # FIGURE 3.117


    ![](img/30075d71cb1be5651669ffe0f9695010_124_2.png)


    The purpose of placing this second key is to display the selected orientation
    for two seconds before beginning to rotate it. The ribs are best seen from the
    Bottom View, we will rotate the model to that view.


    Select the Bottom View. Zoom and pan the model as desired, again placing it left
    of center in the graphics window. Move the cursor to the 4-second mark, and to
    the right of the Orientation and Camera Views, right-click and select Place Key.
    Repeat for the 6-second mark.'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# Chapter 3 Additional Part Modeling Techniques 111


    The timeline will show a line between the keys at 2 and 4 seconds, as shown in
    Figure 3.118. This indicates that the views are different at these two points,
    and the model will be rotated into the new view over this 2-second interval.


    Select the Right View and zoom the model as desired. Place keys at 8 and 10 seconds.
    Select the Trimetric View, zoom and pan as desired, and place keys at 12 and 14
    seconds.


    The finished timeline is shown in Figure 3.119. Note that individual keys can
    be deleted or replaced as necessary by right-clicking on that key. To start over,
    you can right-click a key, choose Select All, and delete the key.


