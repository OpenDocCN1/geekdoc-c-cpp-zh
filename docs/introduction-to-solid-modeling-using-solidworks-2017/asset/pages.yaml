  md: '# Chapter I Basic Part Modeling Techniques


    of the first line causes the second line''s first point to snap to the midpoint.
    As the line is dragged out, there are dashed guidelines parallel perpendicular
    to the first line displayed on the screen, as shown in Figure 1.135. If the second
    mouse click is made close to the perpendicular guideline, then a perpendicular
    relation between the two Lines is created. As shown in Figure 1.136, the sketch
    relation indicates the midpoint relation between the first line and the endpoint
