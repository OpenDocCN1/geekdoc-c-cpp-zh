    For the first rib, we added two lines to close the sketch and

    an an Extuded Boss to complete the rib. A

    rib can be created from an open sketch using the Rib Tool.


    Select the Rib Tool from the Features group of the CommandManager, as shown

    in Figure 3.80. In the FeatureManager, set the thickness to Both Sides and 0.100

    inches, as shown in Figure 3.81.


    The thickness can be set to offset from the plane in either

    direction, or so that the rib is symmetric about the plane

    (similar to the Mid-Plane Extrusion used for the first rib).

    By default, the middle of the three buttons, designating a rib

    symmetric about the plane, it is selected. For the extrusion

    direction, the rib can be defined as parallel to the plane of

    the sketch (default) or normal to the plane. Neither of these

    settings needs to be changed for our rib.


