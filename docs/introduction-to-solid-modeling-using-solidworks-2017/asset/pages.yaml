  md: '# 32 Part One Learning SOLIDWORKS


    rather than their radii. Since diameters can be directly measured, defining a
    component using diameters is good design practice.


    A fully defined sketch is usually not possible without sketch relations. In the
    case of the circles used in the flange, the location of the center points had
    to be specified in order for the sketches to be fully defined. In each sketch,
    the relation defining the circle and the origin are being coincident added automatically
    through a snap—the cursor was moved to the origin before the first mouse clicked
    and the center of the sketch “snapped” to the origin. In the case of the sketch
    defining the bolt hole, the snap was made to a quadrant point of the circle. These
    are examples of automatic relations. By default, SOLIDWORKS creates automatic
    relations. This feature can be turned off by selecting Settings: Automatic Relations
    from the Main Menu, but most users will not find reason to do so. In addition,
    automatic relations are created when specifying an entity’s geometry. For example,
    when drawing a line, a small icon beside the line indicates that the line will
    be horizontal or vertical, as shown in Figure 1.131. When the line is completed,
    it will have a horizontal or vertical relation associated with it, as indicated
    by the icon shown in Figure 1.132.


    ![](img/30075d71cb1be5651669ffe0f9695010_46_0.png)


    ![](img/30075d71cb1be5651669ffe0f9695010_46_1.png)


    ![](img/30075d71cb1be5651669ffe0f9695010_46_2.png)


    When an entity is selected, its relations are shown in the PropertyManager, as
    shown in Figure 1.133. In the PropertyManager, relations can be deleted by selecting
    them and pressing the Delete key or adding the appropriate icon. Of course, relations
    must be compatible with each other and with any dimensions existing in the sketch.
    For example, clicking the Vertical icon in this case would result in an error,
    since a line cannot be both horizontal and vertical.


    Horizontal and vertical relations, along with Fix, which simply fixes the location
    of an entity within the sketch, are relations that applied to single entities.
    Most relations apply to multiple entities. For example, Figure 1.134 adds a new
    line to an existing line. With the Line Tool selected, moving close to the midpoint


    ![](img/30075d71cb1be5651669ffe0f9695010_46_3.png)'
