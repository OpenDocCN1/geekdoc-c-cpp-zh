    # 6.2 Creating a Simple Assembly of Parts


    The features of the software that we will employ are the assembly capabilities.
    Assemblies are complex solid models that are made up of simpler part models, with
    specifically defined geometric relationships between the parts. The SOLIDWORKS
    program provides us with the ability to relate surfaces and other geometric features
    of one part to those of another. For example, we could:


    +   * Define two flat surfaces as *coincident*: This places the two flat surfaces
    in the same plane.

    * Define two flat surfaces as *parallel*.

    * Define two surfaces as a preset *distance apart*: This makes the two surfaces
    parallel, with a specified distance between them.

    * Define two lines or planes as *perpendicular* to one another.

    * Define two lines or planes at a preset *angle* to one another.'
