  md: Circles, lines and arcs all be dimensioned by clicking on the entity and then
    clicking away from the entity to place the dimension. (Arcs are automatically
    dimensioned with a radius rather than a diameter.) These are examples of dimensions
    applied to single entities. The Smart Dimension Tool also allows for dimensions
    relating two entities to one to be created. For example, consider the two parallel
    lines shown in Figure 1.126. With the Smart Dimension Tool selected, the first
    mouse click selects one of the lines. If the second mouse click is in the graphics
    area away from any other entity, then a linear dimension for the length of the
    line is created, as discussed above. However, if the second
  merge: -1
  pgno: 44
- img_proc: true
  md: '# Chapter I Basic Modeling Techniques 31


    mouse click is another entity, then a dimension is created between the two entities,
    and a third mouse click is required to place the dimension. In this example, the
    dimensionated the distance between the two lines, as shown in Figure 1.126. If
    the two lines are not parallel, then the same mouse clicks create an angular dimension,
    as shown in Figure 1.127.


    ![](img/30075d71cb1be5651669ffe0f9695010_45_0.png)


    ![](img/30075d71cb1be5651669ffe0f9695010_45_1.png)


    When a circle is one of the two entities selected, then the resulting dimension
    is always to the center of the circle, as shown in Figure 1.128. It is not necessary
    to select the center point of the circle; clicking on the perimeter of the circle
    and the centerline creates the dimension to the circle''s center.


    When a centerline is one of the entities selected, then the resulting dimension
    can define either the distance from the centerline to the second entity or the
    distance from the second entity to a mirror image of itself on the other side
    of the centerline. For example, consider the horizontal line and centerline shown
    in Figure 1.129. Clicking on the centerline and line creates a linear dimension,
    since they are parallel to each other. If the next mouse click is made between
    the two entities, then the dimension as shown in Figure 1.129 is created. However,
    if the cursor is dragged to the other side of the centerline before clicking to
    place it, then the dimension shown in Figure 1.130 is created. This method of
    dimensioning is especially useful when working with revolved geometry, as the
    pulley of the next section, in it, that allows for the diameters of revolved features
    to be specified


    ![](img/30075d71cb1be5651669ffe0f9695010_45_2.png)


    ![](img/30075d71cb1be5651669ffe0f9695010_45_3.png)


    ![](img/30075d71cb1be5651669ffe0f9695010_45_4.png)'
