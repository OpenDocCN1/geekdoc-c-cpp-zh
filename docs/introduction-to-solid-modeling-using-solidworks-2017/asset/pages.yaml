  md: '# 60 Part One Learning SOLIDWORKS


    We can add dimensions manually using the Smart Dimension Tool, we usually prefer
    to import the dimensions from the model. Doing so has the advantage that imported
    dimensions can be changed and will be reflected in the model. Dimensions added
    to the drawing with the Smart Dimension Tool will be driven dimensions, meaning
    that their values will be updated when changes are made to the model, but dimensions
    cannot be used to change the model drawing. Another advantage of importing dimensions
    is that if fully defined sketches are used to create the part, also checking the
    dimensions helps ensure that the drawing is fully defined. (However, using fully
    defined sketches does not guarantee that the drawing will be fully defined. In
    particular, a feature is positioned with relations, then additional dimensions
    will often need to be added to the drawing to precisely locate that feature.)


    # FIGURE 2.21


    ![](img/30075d71cb1be5651669ffe0f9695010_74_0.png)


    # FIGURE 2.22


    Click the Annotation tab of the CommandManager, and select the Model Items as
    shown in Figure 2.21. In the PropertyManager,select "Import items into all views"
    and "Eliminate duplicates," as shown in Figure 2.22. Click the check mark to import
    the model items (dimensions) in the drawing views.


    While the PropertyManager for Model Items contains options for controlling the
    import of dimensions, tolerances, etc., also checking the defaults is usually
    sufficient. Not all dimensions used to create the model are imported for one—the
    45-degree angle of the chamfer. The reason that dimension is not imported is that
    dimension would have to be applied to a feature that is hidden in the current
    drawing views. If the box "Include items from features" in the Model Items PropertyManager
    is checked then this dimension would have been imported. Instead, we will import
    the dimension into a detail view that we later add. Also note that the R2 dimension
    defining the fillet radius may show on a different fillet, depending on which
    edge you selected first when creating the fillets in the model.


    ![](img/30075d71cb1be5651669ffe0f9695010_74_1.png)


    # FIGURE 2.23


    Click and drag the dimensions on the drawing sheet so that they can be clearly
    seen, as shown in Figure 2.23. Note that a dimension will automatically align
    with other dimensions when you drag it to its position. Holding the Alt key when
    dragging the dimensions turns off the auto-align and allows you to place the dimensions
    more precisely.


    ![](img/30075d71cb1be5651669ffe0f9695010_74_2.png)


    # FIGURE 2.24


    You can also show how the arrows are displayed on linear dimensions, such as the
    2.25-inch dimension shown in Figure 2.24. When you click on the dimension to select,
    the dimension will appear in green and dots will appear on the arrowheads. When
    you


