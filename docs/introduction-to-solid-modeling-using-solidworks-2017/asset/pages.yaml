    A new part window is opened, and a copy of the base (including the cavity) is
    created. The advantage of creating a derived part rather than simply saving a
    copy of a base part is that associativity is maintained. That is, if a change
    is made to the cylinder part, the cavity in the assembly, the mold base, and the
    derived mold half part are all updated.


    Open a sketch on the front face of the new part. Select the Line Tool, and draw
