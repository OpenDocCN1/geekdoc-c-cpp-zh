    # 2.3 Creating an eDrawing


    One disadvantage of using drawings that are fully associative with part files
    is that in order to share the file with other users


    Another option for sharing drawings with others, including those who do not have
    access to SOLIDWORKS software, is to create an eDrawing. The eDrawing Viewer can
    be downloaded for free, and the eDrawings Publisher also allows the creation of
    executable files that can be read on any computer. Even within organizations using
