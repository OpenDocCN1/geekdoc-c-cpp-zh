  md: '# Chapter 5 Parametric Modeling Techniques 165


    # 5.2 Creation of Parametric Equations


    The use of parametric equations embedded in models to control dimensions is a
    powerful engineering technique. These equations can be embedded design intelligence
    directly into solid models. In this section, the flange created in Section 5.1
    will be modified to include parametric equations relating the hole pattern to
    the rib pattern.


    With the flange model open, select Tools: Equations from the main menu, as shown
    in Figure 5.66.


    The Equations, Global Variables, and Dimensions dialog will appear. In the model,
    the number of holes in the Hole Pattern feature will be controlled by the number
    of ribs in the Rib Pattern. An equation will be written to establish this parametric
    relationship. Equations can be established relating model parameters to one another,
    or relating model parameters to user-defined variables. In this tutorial, since
    the model is relatively complicated, and two different equations controlling parameters
    in the Rib Pattern, we will use the technique that involves the creation of a
    defined variable. We will therefore begin by defining a global variable that contains
    the number of ribs.


    Double-click on the Rib Pattern in the FeatureManager.


    This will display the parameters (6 ribs, 360° spacing) in the model window.


    ![](img/30075d71cb1be5651669ffe0f9695010_179_0.png)


    With the Equations View button selected, click the column in the "Name" column
    Added global variable, as shown in Figure 5.67. In the cell, type the variable
    name Ribs. Click in the column next to it,"Value/Equation" as shown in Figure
    5.68.


    ![](img/30075d71cb1be5651669ffe0f9695010_179_1.png)


    ![](img/30075d71cb1be5651669ffe0f9695010_179_2.png)'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# FIGURE 5.69


    Click on the "6" parameter (denoting the number of ribs) in the modeling window,
    as shown in Figure 5.69 (you may need to zoom in to find it). Click the green
    check mark, and the value of the parameter (6) will be associated with the variable
    and added to the "Evaluates to" column, as shown in Figure 5.70.


    ![](img/30075d71cb1be5651669ffe0f9695010_180_0.png)


    # FIGURE 5.70


    | Name | Value / Equation | Evaluates to |

    | --- | --- | --- |

    | Global Variables | | |

    | "Ribs" | "D1@Rib Pattern" | 6 |


    The variable Ribs can be used as a driving value in an equation. We will establish
    an equation that ties the number of holes in the hole pattern to the number of
    ribs in the rib pattern, which has been given name Ribs.


    In the FeatureManager, click on the Hole Pattern entry.


