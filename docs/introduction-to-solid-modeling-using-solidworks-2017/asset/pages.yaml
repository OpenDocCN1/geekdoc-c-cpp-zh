    The colors applied to a model can be viewed and/or edited from the DisplayManager.
    The DisplayManager can be viewed by clicking on the icon above the FeatureManager.
    As shown in Figure 121, there are several icons that can be used to display tools
    and options in the space occupied by the FeatureManager. These include the PropertyManager,
    which we have seen displayed one or more entities, the ConfigurationManager, which
    is used to select a specific configuration of a model (which will be discussed
    in Chapter 3), the DimExpertManager (which is not discussed in this text), and
