    denoted by blue entities.


    Other possibilities for the sketch are "Fully Defined," when the sketch contains
    exactly one dimension andor relations to define its size and position in space
    (by black entities), and "Over Defined," where the sketch has at least one dimension
    or relation that contradicts or is redundant to the other dimensions and relations
    (by red entities). Over defined sketches should be avoided.


