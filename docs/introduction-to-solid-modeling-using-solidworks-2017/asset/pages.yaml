    FIGURE B.37


    then be closed, also from the shortcut menu, as shown in Figure B.37. With the
    sketch closed, pressing the S key results in a menu of feature tools to be displayed,
    in the Extruded Cut Tool be selected, as shown in Figure B.38. Note that when
    the S key is pressed, the Shortcut Bar appears at the location of the cursor.
    This makes it very easy to select certain commands, minimizing the mouse movements
    between selections. The Shortcut Bar can be customized like any other toolbar
    by right-clicking the toolbar and choosing Customize. However, the default settings
    contain the most commonly used shortcuts and features tools, and most users will
    find these to be sufficient.


    ![](img/30075d71cb1be5651669ffe0f9695010_392_0.png)


    FIGURE B.38


    Just to the right of the Main Menu is the Command Search. The Command Search allows
    you to access commands by typing in a few letters, as shown in Figure B.39. This
    is a handy way to access commands that you do not use. By clicking the Show Command
    Location icon beside the CommandManager, the command will be shown, either in
    an open toolbar, or as shown in Figure B.40.


