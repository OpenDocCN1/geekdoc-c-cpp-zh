  md: '# Chapter 12 Design of Molds and Sheet Metal Parts 329


    The scale factor causes the cavity to be larger than the first part. Most molding
    materials shrink during cure or cooling, so the scale factor allows for shrinkage.


    The cavity can now be seen in the base, as shown in Figure 12.12. FIGURE 12.12nIf
    you look closely, you can see that there are gaps between the edges of the part
    and the corresponding edges of the cavity, because of the shrink factor.


    The base, which now includes the cavity, needs to be split into two halves. For
    this simple model, the two halves will be identical, and so we could cut any half
    of the original part base. However, if the two halves will be different (in the
    next exercise), copies of the base must be made. This procedure of creating derived
    parts is illustrated here.


    Select the Mold Base from the FeatureManager. From the main menu, select: Derive
    Component Part, as shown in Figure 12.13. FIGURE 12.13Click the check mark to
    place the new part at the origin.


