  md: 'P6.8 The packing factor of a crystal structure quantifies how tightly packed
    the atoms of the structure are, and is defined as the volume of atoms contained
    within a unit cell, or basic building block of the crystal structure, divided
    by the total volume available within the cell. Find the packing factor of the
    body-centered cubic structure by following this procedure:


    +   a. Cut away parts of the model created in Problem 6.7 to create a unit cell,
    as shown in Figure P6.8. (Note: Extuded cuts can be made using a similar tool
    to that used in parts. The Extruded Cut Tool for assemblies can be accessed from
    the Assembly Features Tool of the Assembly Group.)

    b. Use the Mass Properties Tool to find the volume of atoms within the unit cell.

    c. Calculate the volume of a solid cube of the same dimensions as the unit cell.

    d. Divide the volume of the atoms by the volume of the solid cube.

