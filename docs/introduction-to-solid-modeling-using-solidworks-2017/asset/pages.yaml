  md: '# 374 Appendix B The SOLIDWORKS Interface: Use and Customization


    # FIGURE B.13


    Tools can be added and removed from toolbars and the CommandManager. When Customize
    is selected from the pull-down menu beside the Options Tool, toolbars and all
    CommandManagers can be edited. To remove a simple tool, click and drag it to the
    graphics area. For example, in Figure B.13, the Plane Tool, which is used to create
    planes in a 3-D sketch, is removed by dragging it from its position in the Sketch
    group of the CommandManager into the graphics. As shown in Figure B.14, the other
    tools in the group are reordered to accommodate it. The Plane Tool has been removed.
    (Note that removing this tool from the CommandManager does not mean the tool itself
    is deleted; it can be accessed from the Main Menu under Tools: Commands)


    ![](img/30075d71cb1be5651669ffe0f9695010_388_0.png)


    Entities.) To add a tool, you must first locate it in the Customize box under
    the Commands tab. Commands are listed in groups. For example, you might want to
    add a Centerline Tool so that you do not have to select it from the pull-down
    menu of the Line tool when you want to use it. The Centerline Tool is located
    in the Sketch group, as shown in Figure B.15. To move it click and drag it to
    the desired position. A plus sign will appear near the cursor where the tool is
    placed, as shown in Figure B.16. Releasing the mouse button causes the tool to
    be placed, as shown in Figure B.17. Note that all tools with pull-down menus are
    included in the group "Flyout Toolbars." For example, the individual Line and
    Centerline Tools are contained in the Sketch group, where the Line that contains
    both the Line and Centerline Tools in a pull-down menu is contained in the Flyout
    groups.


    # FIGURE B.14


    ![](img/30075d71cb1be5651669ffe0f9695010_388_1.png)


