  md: '# 356 Part Two Applications of SOLIDWORKS


    FIGURE 13.10


    The triangles created for a resolution set to Coarse are shown in Figure 13.10.
    Note the rough approximation of the fillets by the triangles.


    ![](img/30075d71cb1be5651669ffe0f9695010_370_0.png)


    The number of triangles created and the file size are displayed in the Export
    dialog box. For the Coarse resolution, 2326 triangles are used, and the size of
    the .stl file is 116 kb.


    If the resolution is changed to Fine, then more triangles are added to the curved
