  md: '# Appendix B The SOLIDWORKS Interface: Use and Customization 373


    As with toolbars, the CommandManager can be moved to other locations on the screen.
    When the CommandManager is moved or turned off accidentally, then the default
    position can be restored by selecting View: Workspace: Default from the main menu.
    Users with wide screen monitors may try selecting View: Workspace: Widescreen.
    The Widescreen workspace modes place the CommandManager at the left side of the
    screen, as shown in Figure B.11, creating a better aspect ratio for the area.
    When the CommandManager is activated, the PropertyManager is available to float
    on the screen. The ability to move the PropertyManager configuration as well,
    but its default position is to occupy the same location as the FeatureManager.
    The FeatureManager is displayed unless it is selected, in which case the PropertyManager
    is displayed. When you click and drag the CommandManager to a new position, several
    "docking" positions appear on the screen, as shown in Figure B.12. Dragging the
    PropertyManager to the docking position at the top of the FeatureManager causes
    it to share the same space, as they do with the default workspace configuration.
    To return to the layout with the CommandManager at the top of the screen, select
    View: Workspace: Default.


