    # 10.5 Kinematic Sketch of a Simple Mechanism


    In Chapter 11, we will look at the application of the SOLIDWORKS program to model
    mechanisms, with assemblies of 3-D component parts. Often, the first step in the
    design of a mechanism is the preparation of a kinematic sketch, a 2-D drawing
    showing simplified representations of the members. For example, a four-bar linkage,
    which is a common mechanism used in many machines, can be represented by four
    lines, as shown in Figure 10.30.


    ![](img/30075d71cb1be5651669ffe0f9695010_298_1.png)


    In a kinematic analysis, the velocities and accelerations of the links and points
    are calculated, based on the velocity and acceleration of the driving link. For
    example, if Link 2 is connected to a motor and rotated about its pivot point at
    a constant velocity, the angular velocity and accelerations of the other two moving
    links and the translational velocities and accelerations of points on those links
    can be calculated. The accelerations are important because force is proportional
    to acceleration. (Note: Although there are only three moving members, the mechanism
    is referred to as a four-bar linkage because it is connected to a fixed or ground
    link, which is usually called Link 1.)'
  merge: -1
  pgno: 298
- img_proc: true
  md: "# Chapter 10 Solution of Vector Problems 285\n\nThe first step in any kinematic\
    \ analysis is a position analysis. For a given position of the driving link (the\
    \ angular position of Link 2), the positions of the other links must be calculated.\
    \ Obviously, these positions can be calculated using trigonometry. For many mechanisms,\
    \ a position analysis using trigonometry is surprisingly complex. A SOLIDWORKS\
    \ program is an excellent tool for graphical position analytes, in that dimensions\
    \ can be easily changed and the effects on the rest of the linkage can be determined.\n\
    \nFIGURE 10.31\n\nThe links are represented by vectors, as shown in Figure 10.31.\
    \ In this case, all of the vector magnitudes (lengths) are known, as well as two\
    \ of the vector angles. Link 1 is horizontal, and we will be performing the analysis\
    \ for a given orientation of Link 2, the driving link. Therefore, we can solve\
    \ the vector equation for the two unknown quantities, $\theta_3$ and $\theta_4$.\n\
    \n![](img/30075d71cb1be5651669ffe0f9695010_299_0.png)\n\nIn the previous sections,\
    \ we used a SOLIDWORKS drawing to create our sketches. For this example, we will\
    \ create sketch with a SOLIDWORKS part file. For creating a quick sketch, the\
    \ part file is often preferable because the sketches automatically scale. Since,\
    \ the sketch is not required to fit a paper size, we can enter the scale and simply\
    \ change the viewing scale to display the entry sketch. (Sketches can also be\
    \ created in assemblies. Often, a layout sketch within an assembly is used to\
    \ size and/or position the components of a mechanism.) To print a copy of a sketch\
    \ created in a part file, the screen capture utility can be used to copy and paste\
    \ the sketch to a word processing file. The advantages of using a drawing to create\
