    \ coord t = {.x=10, .y=20};\n\nprint_coord((struct coord){.x=10, .y=20}); // prints\
    \ \"10, 20\"\n```\n\nStill works!\n\n# 32.1.3 Unnamed Objects\n\nYou might have\
    \ noticed in the last example that we were using a struct, we were passing a copy\
    \ of the struct to print_coord() as opposed to passing a pointer to the struct.\n\
    \nTurns out, we can just take the address of an unnamed object & with likes always.\n\
    \nThis is because, if an operator would have worked on a variable of that type,\
    \ you can use that operator on an unnamed object of that type.\n\nLet's modify\
    \ the code <stdio.h> to pass a pointer to an unnamed object\n\n```\n#include <stdio.h>\n\
    \nstruct coord {\n    int x, y;\n};\n\nvoid print_coord(struct coord *c) {\n \
    \   printf(\"%d, %d\\n\", c->x, c->y);\n}\n\nint main(void) {\n    // Note the\
    \ &\n    //\n    print_coord((struct coord){.x=10, .y=20}); // prints \"10, 20\"\
    \n}\n\n// Additionally, this could be a nice way to pass even pointers to simple\
    \ objects:\n// Pass a pointer to an int with value 3490\nfoo(&(int)(3490));\n\
    ```\n\nEasy as that.\n\n# 32.1.4 Unnamed Objects and Scope\n\nThe lifetime of\
    \ an unnamed object ends at the end of its scope. The biggest way this could bite\
    \ you is if you make a new unnamed object, give a pointer to it, and then leave\
    \ the object's scope. In that case, the pointer will refer to a dead object.\n\
    \nSo this is undefined behavior:\n\n```\nint *p;\n{\n    p = &(int){10};\n}\n\n\
