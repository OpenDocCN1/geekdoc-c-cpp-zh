    \ 1\n#if ASSERT_ENABLED\n#define ASSERT(c, m) \\\ndo {\n    if ((c)) {\\\n   \
    \     fprintf(stderr, \"__FILE__:%d: assertion % failed: %s\\n\", \\\\\n     \
    \          __LINE__, #c, m); \\\\\n        exit(1); \\\\\n    }\n} while(0)\n\
