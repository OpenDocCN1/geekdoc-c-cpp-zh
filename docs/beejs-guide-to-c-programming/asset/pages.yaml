  md: 'The summary is to serialize the data, which is a general term that means to
    take all the data and write it out in a format that you control, that is well-known,
    and programmable to work the same way on all platforms.

    As you might imagine, this is a solved problem. There are a bunch of serialization
    libraries you can take advantage of, such as Google''s protocol buffers’’, out
