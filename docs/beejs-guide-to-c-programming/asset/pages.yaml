  md: "# Chapter 40. Atoms 285\n\n// ...\n\n```\nx = 2;\ny = 3;\n```\n\n```\nprintf(\"\
    %d %d\\n\", x, y);\n```\n\nAnswer: we don't know. The compiler or CPU could silently\
    \ reverse lines 5 and 6 and we'd be none-wiser. The code would run single-threaded\
    \ *as-if* if it executed in code order.\n\nIn a multithreaded scenario, we might\
    \ have something like this pseudocode:\n\n```\nint x = 0, y = 0;\n```\n\n```\n\
    thread1() {\n    x = 2;\n    y = 3;\n}\n```\n\n```\nthread2() {\n    while (y\
    \ != 3) {} // spin\n    printf(\"x is now %d\\n\", x); // 2? ...or 0?\n}\n```\n\
    \nWhat is the output from thread 2?\n\nWell, if x gets assigned 2 before y is\
    \ assigned 3, then I'd expect the output to be the very sensible:\n\nx is now\
    \ 2\n\nTwo threads synchronize when they agree on the state of shared memory.\
    \ As we see, they're not always in agreement with the code. So how do they agree?\n\
    \nUsing atomic variables can force the agreement¹. If a thread writes to an atomic\
    \ variable, it's saying \"anyone who reads this variable will also see all the\
    \ changes I made to memory (atomic or not) up and including the atomic variable.\n\
    \nOr, in more human terms, let's sit around the conference table and make sure\
    \ we're on the same page as to pieces of shared memory hold values. You agree\
    \ the memory changes you've made up-to-and the atomic store will be visible to\
    \ me after I do a load of the same atomic variable.\n\nSo we can easily fix our\
    \ example:\n\n```\nint x = 0;\natomic int y = 0; // Make atomic\n```\n\n```\n\
    thread1() {\n    x = 2;\n    y = 3; // Synchronize on\n}\n```\n\n```\nthread2()\
    \ {\n    while (y != 3) {} // Synchronize on read\n    printf(\"x is now %d\\\
