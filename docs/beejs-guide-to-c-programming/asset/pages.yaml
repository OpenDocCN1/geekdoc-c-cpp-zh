    ```\n\nAgain, this is kind of painful way of doing things compared to thread_local,\
    \ unless you really need that destructor, I'd use that instead.\n\n# 39.7 Mutexes\n\
    \nIf you want to only allow a single thread into a critical section of code at\
    \ a time, you can protect that section with a 'mutex'.\n\nFor example, if we had\
    \ a static variable and wanted to be able to get and set it in two operations\
    \ without another thread jumping in the middle and corrupting it, we could use\
    \ a mutex for that.\n\nYou acquire a mutex or release it. If you attempt to acquire\
    \ a mutex and succeed, you may continue execution. If you attempt and fail (because\
    \ someone holds it), you will block until the mutex is released.\n\nIf multiple\
    \ threads are waiting for a mutex to be released, one of them will be chosen to\
    \ run (at random, from our perspective), and the others will continue to sleep.\n\
    \nThe gameplan is that we'll initialize a mutex variable to make ready to use\
    \ with mtx_init().\n\nThen subsequent calls call mtx_lock() and mtx_unlock() to\
    \ get and release the mutex.\n\nWhen we're done with the mutex, we can destroy\
    \ it with mtx_destroy(), the logical opposite of mtx_init().\n\nFirst, let's look\
    \ at some code that does not use a mutex, and endeavors to print out a (static)\
    \ serial number and increment it. Because we're not using a mutex over the getting\
    \ of the value (to print it) and the setting (to increment it), threads might\
    \ get in each other's way in that critical section.\n\n```\n#include <stdio.h>\n\
    #include <threads.h>\n```\n\n```\nint run(void *arg)\n{\n    (void)arg;\n\n  \
    \  static int serial = 0; // Shared static variable!\n```\n\n> ^7 Short for \"\
    mutual exclusion\", AKA a \"lock\" on a section of code that only one thread is\
    \ permitted to execute.\n\n> ^8 That is, your process will go to sleep."
