  md: "# Chapter 8. Structs\n\n2. The struct is somewhat large and it's more expensive\
    \ to copy that onto the stack than it is to just copy a pointer.\n\nFor those\
    \ two reasons, it's far more common to pass a pointer to a struct to a function,\
    \ though by no means is illegal to pass the struct itself.\n\nLet's try passing\
    \ in a pointer, making a function that will allow you to set the .price field\
    \ of the struct car:\n\n```\n#include <stdio.h>\n\nstruct car {\n    char *name;\n\
    \    float price;\n    int speed;\n};\n\nint main(void) {\n    struct car saturn\
    \ = {.speed=175, .name=\"Saturn SL/2\"};\n\n    // Pass a pointer to this car,\
    \ along with a new,\n    // more realistic, price:\n    set_price(&saturn, 79.99);\n\
    \n    printf(\"Price: %f\\n\", saturn.price);\n}\n```\n\nYou should be able to\
    \ come up with the function signature for set_price() by looking at the types\
    \ of the arguments we have here.\n\nsaturn is a car, so saturn must be the address\
    \ of the struct car, AKA a pointer to a struct car, namely a struct 'car'.\n\n\
    And 79.99 is a float.\n\nSo the function declaration might look like this:\n\n\
    ```\nvoid set_price(struct car *c, float new_price)\n    c.price = new_price;\
    \ // ERROR!!\n```\n\nWe need to write the body. One attempt might be:\n\n```\n\
    void set_price(struct car *c, float new_price)\n    (*c).price = new_price; //\
    \ works, but it is ugly and non-idiomatic :\n```\n\nThat won't work the dot operator\
    \ works on structs... it doesn't work de-pointer it to get the struct itself.\
    \ Dereferencing a struct car\n\n* in the result so we can dereference the result\
    \ of the car that the pointer points to, which we should be able to use the dot\
    \ operator on:\n\nAnd that works! It's a little clumsy to type all these parens\
    \ and the asterisk. C has some syntactic sugar called the arrow operator that\
    \ helps with that.\n\n> ^3A pointer is 8 bytes on a 64-bit system."
