  md: "# Chapter 31. goto\n\nMany Unix-likes have a SA_RESTART flag you can pass to\
    \ sigaction() to request the OS automatically restart any syscalls failing of\
    \ EINTR.\n\nAgain, this is Unix-specific and is outside the C standard.\n\nThat\
    \ said, it's possible to use a similar technique any function should be restarted.\n\
    \n# 31.8 goto and Thread Prevention\n\nThis example is ripped directly from Operating\
    \ Systems: Three Easy Pieces, another excellent book from like-minded authors\
    \ who feel that quality books should be free to download. Not that I'm opinionated,\
    \ or anything.\n\nretry:\n\n```\nthread_mutex_lock(L1);\n\nif (thread_mutex_trylock(L2)\
    \ != 0) {\n    thread_mutex_unlock(L1);\n    goto retry;\n}\n```\n\nsave_the_day();\n\
    \n```\nthread_mutex_unlock(L2);\nthread_mutex_unlock(L1);\n```\n\nThere the happily\
    \ acquires the mutex L1, but then potentially to get the second resource guarded\
    \ by mutex L2 (if some other unoperative thread holds it, say). If our thread\
    \ can't get the L2 lock, it unlocks L1 and then uses goto to cleanly retry.\n\n\
    We hope our thread eventually manages to acquire both mutexes and save the day,\
    \ all while avoiding evil deadlock.\n\n# 31.9 goto and Variable Scope\n\nWe've\
    \ already seen that labels have function scope, but weird things can happen if\
    \ we jump past some variable initialization.\n\nLook at this example where we\
