    \ get all the proper magic in\n\n# 25.3 va_list Functionality\n\nWhat is va_list\
    \ variable we're using there? It's an opaque variable that holds information about\
    \ which argument we're going to get next with va_arg(). You see how we call va_arg()\
    \ over and over? The va_list variable is a placeholder's keeping track of progress\
    \ so far.\n\nBut we have to initialize va_list to some sensible state. That's\
    \ where va_start() comes into play.\n\nAnd that's why we have to initialize the\
    \ initial parameter, you can easily fetch subsequent arguments by calling va_arg()\
    \ repeatedly. When you do, you have to pass in your va_list (so it can keeping\
