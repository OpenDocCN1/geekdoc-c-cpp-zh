- pgno: 19
  md: '# # Chapter 3


    # # Variables and Statements


    > "It takes all kinds to make a world, does it not, Padre?""

    "So it does, my son, so it does."

    —Pirate Captain Thomas Bartholomew Red to the Padre, Pirates


    There sure can be lots stuff in a C program.


    Yup.


    And for various reasons, it''ll be easier for all of us if we classify some of
    the types of things you can find in a program, so we can be clear what we''re
    talking about.


    # ## 3.1 Variables


    It''s said “variables hold values”. But another way to think about it is that
    a variable is a human-readable name that refers to some data in memory.


    We''re going to take a second here and take a peek down the rabbit hole that is
    pointers. Don''t worry about it


    You can think of memory as a big array of bytes’. Data is stored in this “array”¹².
    If a number is larger than a single byte, it is stored in multiple bytes. Because
    memory is like an array, each byte of memory can be referred to by its index.
    This index into memory is also called an *address*, or a *location*, or a *pointer*.


    When you have a variable in C, the value of that variable is somewhere, at some
    address. After, where else would it be? But it''s a pain to refer to a value by
    its numeric address, so we make a name for it, and that''s what the variable is.


    The reason I''m bringing this up is twofold:


    +   1. It''s going to make it easier to understand pointer variables—they''re
    variables that hold the address of other variables!

    2. Also, it''s going to make it easier to understand pointers later.


    So a variable is a name for some data that''s stored in memory at some address.


    ¹‘byte’ is typically an 8-bit binary number. Think of it as an integer that can
    hold the values from 0 to 255, inclusive. Technically, C allows bytes to be any
    number of bits and if you want to unambiguously refer to an 8-bit number, you
    should use the term oct. But programmers assume you have 8 bits unless you specify
    otherwise.


    ²in seriously oversimplifying how modern memory works, here. But the mental model
    works,, so please forgive me.'
