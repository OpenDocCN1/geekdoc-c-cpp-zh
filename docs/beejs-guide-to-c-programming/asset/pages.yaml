  md: "# 18.2 Exit Status\n\nDid you notice that the function signatures for main()\
    \ have it returning type int? What's all about? It has to do with a thing called\
    \ the exit status, which is an integer that can be returned to the program that\
    \ launched to let know how things went.\n\nNow, there are a number of ways program\
    \ can exit in C, returning from main(), or calling one of the exit() variants.\n\
    \nAll of these methods accept an int as an argument.\n\nSide note: you did see\
    \ that in basically all my examples, even main() is supposed to return an int,\
    \ I don't actually returning anything? In any other function, this would be illegal,\
    \ but there's a special case in C: if execution reaches the end of main() without\
    \ finding a return, it automatically returns 0.\n\nBut what does it mean? What\
    \ other numbers can we put there? And how are they used?\n\nThe spec is both clear\
    \ and vague on, as is common. Clear because it spells out what you can do, but\
    \ vague in that it doesn't particularly limit it, either.\n\nNothing for it to\
    \ forge ahead and figure it out\n\nLet's Get Inception⁴ for a second: turns out\
    \ when you run your program, you're running it from another program.\n\nUsually\
    \ this other program is kind of shell⁵ which doesn't match on its own except launch\
    \ other\n\n+   1. The shell launches program\n2. The shell typically goes to sleep\
    \ (for command-line shells)\n3. Your program runs\n4. Your program terminates\n\
    5. The shell wakes up and waits for another command\n\nNow, there's a little piece\
    \ of communication that takes place between steps 4 and 5: the program can return\
    \ a status value that shell can interpolate. Typically, this value is used to\
    \ indicate the success or failure of your program, and, if applicable, what type\
    \ of failure.\n\nThis value is we've been returning from main(). That's the status.\n\
    \n| Status | Description |\n| --- | --- |\n| EXIT_SUCCESS or 0 | Program terminated\
    \ successfully. |\n| EXIT_FAILURE | Program terminated with error. |\n\nLet's\
    \ write a program that multiplies two numbers from the command line. We'll require\
    \ that exactly two values. If you don't, we'll print an error message, and exit\
    \ with an error status.\n\n```\n#include <stdio.h>\n#include <stdlib.h>\n```\n\
    \n```\nint main(int argc, char **argv)\n{\n  if (argc != 3) {\n```\n\n> ⁴https://en.wikipedia.org/wiki/Inception\n\
    ⁵https://en.wikipedia.org/wiki/Shell_(computing)"
