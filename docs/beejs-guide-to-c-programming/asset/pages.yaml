    Interesting! We see that on my system, EXIT_FAILURE is 1. The spec doesn''t spell
    this out, so it could be any number. But it''s 1 on your system, too.


    # 18.2.1 Other Exit Status Values


    The status $ definitely means success, but all the other integers, even negative
    ones?

    Here we''re going into the C spec and into Unix land. In general, while $0 means
    success, a positive non-zero number means failure. Bash says the exit code should
    be between 0 and 255, though a number of codes are reserved.


    In short, if you want to indicate different error statuses in a Unix environment,
    you can start with 1 and work your way up.


    On Linux, if you try any code range 0-255, it will bitwise AND the code with 0xff,
    effectively clamping to that range.


    > *In Windows cmd.exe, type echo %errorlevel%. In PowerShell, type $LastExitCode.'
