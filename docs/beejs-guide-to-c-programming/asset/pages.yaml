    }


    For the conversion functions that manage their own state, you can reset their
    internal state to the initial one by passing in NULL for char* arguments, for
    example:


    ```

    mbstowcs(NULL, NULL, 0); // Reset the parse state for mbstowcs()

    mbstowcs(dest, src, 100); // Parse some stuff

    ```


    For I/O, each wide stream manages its own mbstate_t and uses that for input and
    output conversions as it goes.


    And for the byte-oriented I/O functions like printf() and scanf() keep their internal
    state while doing their work.


    Finally, restatable conversion functions actually have their own internal state
    if you pass in NULL for the mbstate_t parameter. This makes them behave more like
    their non-restatable counterparts.


    # 27.11 Unicode Enings and C


    In this section, we''ll see what C can do (and can''t) when it comes to three
    specific Unicode encodings: UTF-8, UTF-16, and UTF-32.


    # 27.11.1 UTF-8


    To refresh this section, read the UTF-8 quick note, above.


    Aside from that, what are C''s UTF-8 capabilities?


    Well, not much, unfortunately.


    You can tell C you specifically want a string literal to be UTF-8 encoded, and
    it''ll do it for you. You can use a prefix with u8:


    ```

    char *s = u8"Hello, world!";

    ```


    ```

    printf("%\s\n", s); // Hello, world!---if you can output UTF-8

    ```


    Now, can you put Unicode characters in there?


    ```

    char *s = u8"\u123";

    ```


    Sure! If the extended character set supports it. (gcc does).


    What if it doesn''t? You can specify a Unicode code point with your favorite neighborhood
    \u and \U, as noted above.


    But that''s about it. There''s no portable in the standard library to take arbitrary
    input and turn it into UTF-8 unless your locale is UTF-8. Or to parse UTF-8 unless
    your locale is UTF-8.


    So if you want to do it, be either in a UTF-8 locale:


    ```

    setlocale(LC_ALL, "");

    ```


    or figure out a UTF-8 name on your local machine and set it explicitly like so:


    ```

    setlocale(LC_ALL, "en_US.UTF-8"); // Non-portable name

    ```


    Or use a third-party library.'
