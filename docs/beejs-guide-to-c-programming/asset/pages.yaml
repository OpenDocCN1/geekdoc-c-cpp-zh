    But if you want more?


    You can do either with a type qualifier or type specifier.

    First, specifier! It''s the keyword _Atomic with a type in parents⁵—suitable for
    use with typedef:

    typedef _Atomic(double) atomic_double;


    ```

    atomic_double f;

    ```


    Restrictions on the specifier: the type you''re making atomic can''t be of array
    or function, nor can it atomic or otherwise qualified.

    Next, qualifier! It''s the keyword _Atomic without a type in parents.

    So do similar things⁶:


    ```

    _Atomic(int i); // type specifier

    _Atomic(int j); // type qualifier

    ```


    The thing is, you can include other type qualifiers with the latter:

    Atomic volatile int k; // qualified atomic variable

    Restrictions on the qualifier: the type you''re making atomic can''t be of array
    or function.


    # 40.9 Lock-Free Atomic Variables


    Hardware architectures are limited in the amount of data that they can atomically
    read and write. It depends on how it was wired together. And it varies.


    If you use an atomic type, you can ensure that accesses to that type will be atomic...
    but there''s a catch: if the hardware can''t do it, it''s done with a lock, instead.


    > ⁵C++23 is adding this as a macro.

    ⁶The spec notes that they might differ in size, representation, and alignment.'
