- pgno: 307
  md: "# Chapter 41\n\n# Function Specifiers, Alignment\nSpecifiers/Operators\n\n\
    We don't see a heck of a lot of use in my experience, but we'll cover them here\
    \ for the sake of completeness.\n\n# 41.1 Function Specifiers\n\nWhen you declare\
    \ a function, you can give the compiler a couple tips about how the functions\
    \ call or would\nbe used. This enables or encourages the compiler to make certain\
    \ optimizations.\n\n# 41.1.1 inline for Speed—Maybe\n\nYou can declare a function\
    \ to be inline like this:\n\n```\nstatic inline int add(int x, int y) {\n    return\
    \ x + y;\n}\n```\n\nThis is meant to encourage the compiler to make this function\
    \ call as fast as possible. And, historically, one\nway to do this is inlining,\
    \ which means that the body of the function would be embedded in its entirety\n\
    where the call was made. This would avoid all the overhead of setting up the function\
    \ call and tearing it\nat the expense of larger code size as the function was\
    \ copied all over the place instead of being reused.\n\nThat would seem to be\
    \ the end of the story, but it's not. inline comes with a whole pile of rules\
    \ that make\nfor interesting times. I'm not sure I understand them all, and behavior\
    \ seems to vary from compiler\nto compiler.\n\nThe short answer is define the\
    \ inline function as static in the file that you need it. And then use it in\n\
    one file. And you never have to worry about the rest of it.\n\nBut if you're wondering,\
    \ here are more fun.\n\nLet's try leaving the static off.\n\n```\n#include <stdio.h>\n\
    \ninline int add(int x, int y) {\n    return x + y;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 308
  md: "# Chapter 41. Function Specifiers, Alignment Specifiers/Operators\n\n```\n\
    int main(void)\n{\n    printf(\"%kd\\n\", add(1, 2));\n}\n```\n\ngcc gives a linker\
    \ error on add()... unless you compile with optimizations (probably!)\nSee, a\
    \ compiler can choose to inline or not, but if it chooses to, it will use no function\
    \ at all. gcc doesn't inline unless you've defined an optimized build.\n\nOne\
    \ way around this is to define a non-inline external linkage version of the function\
    \ elsewhere, and that will be used when the inline one isn't. But as the programmer\
    \ can't determine which, perhaps. If both are available, its unspecified which\
    \ one the compiler chooses. With gcc the inline function will be used if you're\
    \ compiling with optimizations, and the non-inline one will be used otherwise.\
    \ If the bodies of these functions are created by\n\nAnother way is to declare\
    \ the function as extern inline. Then it will attempt to inline in this file,\
    \ but also create a version with external linkage. And so gcc will use one or\
    \ the other depending on optimizations, but at least they're the same function.\n\
    \nUnless, of course, you have another source file with an inline function of the\
    \ same name; it will use the inline function or the one with external linkage\
    \ depending on optimizations.\n\nBut let's say you're doing a build where the\
    \ compiler is inlining the function. In that case, you can just use a plain inline\
    \ in the definition. However, there are now additional restrictions.\n\nYou can\
    \ refer to any static statics:\n\n```\nstatic int b = 13;\n```\n\n```\ninline\
    \ int add(int x, int y)\n{\n    return x + y + b; // BAD -- can't refer to b\n\
    }\n```\n\nAnd you can define any non-const static local variables:\n\n```\ninline\
    \ int add(int x, int y)\n{\n    static int b = 13; // BAD -- can't define static\n\
    }\n```\n\n```\nreturn x + y + b;\n}\n```\n\nBut making it const OK:\n\n```\ninline\
    \ int add(int x, int y)\n{\n    static const b = 13; // OK -- static const\n\n\
    \    return x + y + b;\n}\n```\n\nNow, you know the functions are external by\
    \ default, so we should be able to call add() from another file. You'd like to\
    \ think than that, wouldn't you?\n\nBut you can't! If it's just a plain inline,\
    \ to static: it's only visible in that file.\n\nOkay, what if you throw an error\
    \ on there? Now we're coming full circle to what we discussed having inline mixed\
    \ with functions with external linkage.\n\nIf both are visible, the compiler can\
    \ choose which to use."
  merge: -1
  img_proc: true
- pgno: 309
  md: "Chapter 41. Function Specifiers, Alignment Specifiers/Operators\n\nHere's foo.c\
    \ with the inline.\n\n```\n// foo.c\n\n#include <stdio.h>\n\ninline char *func(void)\n\
    {\n    return \"foo's function\";\n}\n\nint main(void)\n{\n    printf(\"%s\\n\"\
    , func());\n\n    void bar(void);\n    bar();\n}\n```\n\nRecall that unless we're\
    \ not using an optimized build with gcc, func() will vanish and we'll get a linker\
    \ error. Unless, or we have a version with external linkage defined elsewhere.\n\
    \nAnd we do. In bar.c.\n\n```\n// bar.c\n\n#include <stdio.h>\n\nchar *func(void)\n\
    {\n    return \"bar's function\";\n}\n\nvoid bar(void)\n{\n    printf(\"%s\\n\"\
    , func());\n}\n```\n\nSo the question is, what is the output?\n\nSeems like when\
    \ we call func() from foo.c, it should print 'foo's function'. And from bar.c,\
    \ func() should print 'bar's function'.\n\nAnd if I compile with gcc with optimizations¹,\
    \ it will use inline functions, and we'll get the expected:\n\n```\nfoo.c: foo's\
    \ function\nbar.c: bar's function\n```\n\nGreat!\n\nBut if we compile in gcc without\
    \ optimizations, it ignores the inline function and uses the external linkage\
    \ func() from bar.c! And we get this:\n\n```\nfoo.c: foo's function\nbar.c: bar's\
    \ function\n```\n\n¹You can do this with -O on the command line."
  merge: -1
  img_proc: true
- pgno: 310
  md: "# Chapter 41. Function Specifiers, Alignment Specifiers/Operators\n\nIn short,\
    \ the rules are surprisingly complex. I give myself a 30% chance of having described\
    \ them correctly.\n\n# 41.1.2 nooreturn and _Noreturn\n\nThis indicates to the\
    \ compiler that a particular function will never return to its caller, i.e. the\
    \ program will exit by some mechanism before the function returns.\n\nIt allows\
    \ the compiler to perform some optimizations around the function call.\n\nIt also\
    \ allows you to indicate to devs that some program logic depends on a function\
    \ returning.\nYou'll likely never need to use this, but you'll see it in some\
    \ library calls exit()² and everyone would recommend including <stdnoreturn.h>\
    \ and using the easier-to-read nooreturn return instead.\n\nIt's undefined behavior\
    \ if a function specified as nooreturn actually does return. It's computationally\
    \ costly, see.\n\nHere's an example of using nooreturn correctly:\n\n```\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n#include <stdnoreturn.h>\n```\n\n```\nnooreturn\
    \ void foo(void) // This function should never return!\n{\n    printf(\"Happy\
    \ days\\n\");\n    exit(1); // And it doesn't return--it exits here!\n}\n```\n\
    \n```\nint main(void)\n{\n    foo();\n}\n```\n\nIf the compiler detects a nooreturn\
    \ function could return, it might warn you, helpfully.\n\nReplacing the foo()\
    \ function with this:\n\n```\nnooreturn void foo(void)\n{\n    printf(\"Breakin'\
    \ the law\\n\");\n}\n```\n\ngets me a warning:\n\nfoo.c:7:1: warning: function\
    \ declared 'nooreturn' should not return\n\n# 41.2 Alignment Specifiers and Operators\n\
    \nAlignment is all about multiples of addresses on which objects can be stored.\
    \ You can store this at any address? Or it must be a starting address that's divisible\
    \ by 2? Or 8?\n\n> ²https://beej.us/guide/bglr/html/split/stdlib.html#man-exit\n\
    ³https://beej.us/guide/bglr/html/split/stdlib.html#man-abort\n⁴https://en.wikipedia.org/wiki/Data_structure_alignment"
  merge: -1
  img_proc: true
- pgno: 311
  md: "# Chapter 41. Function Specifiers, Alignment Specifiers/Operators\n\nIf you're\
    \ coding something low-level like a memory allocator that interfaces with your\
    \ OS, you might need to consider this. Most devs go their careers without using\
    \ this functionality in C.\n\n# 41.2.1 aligns and Aligns\n\nThis isn't a function.\
    \ Rather, it's an alignment specifier that you can use with a variable declaration.\n\
    \nThe built-in is _Align, the header <stdalign.h> defines it as aligns for something\
    \ better looking.\n\nIf you need your char to be aligned like an int, you can\
    \ force it like this when you declare it:\n\n```\nchar aligns(int) c;\n```\n\n\
    You can also pass a constant value or expression for the alignment. This has to\
    \ be supported by the system, the process stops dictating what values you can\
    \ put in there. Small powers of 2 (1, 2, 4, 8, and 16) are generally safe bets.\n\
    \n```\nchar aligns(8) c; // align on 8-byte boundaries\n```\n\nIf you want align\
    \ at the maximum alignment used by your system, include <stddef.h> and use the\
    \ type max_align_t, like so:\n\n```\nchar aligns(max_align_t) c;\n```\n\nYou could\
    \ potentially over-align by specifying an alignment not than that of max_align_t,\
    \ but whether or not such things are aligned is system dependent.\n\n# 41.2.2\
    \ alignof and Alignof\n\nThis operator will return the address multiple a particular\
    \ type uses for alignment on this system. For example, maybe chars are aligned\
    \ every 1 address, and ints are aligned every 4 addresses.\n\nThe built-in operator\
    \ is _Alignof, the header <stdalign.h> defines it as alignof if you want to look\
    \ cooler.\n\nHere's a program that will print out the alignment of a variety of\
    \ different types. Again, these will vary from system to system. Note that the\
    \ type max_align_t will give you the maximum alignment used by the system.\n\n\
    ```\n#include <stdalign.h>\n#include <stdio.h> // for printf(void)\n#include <stddef.h>\
    \ // for max_align_t\n```\n\n```\nstruct t {\n  int a;\n  char b;\n  float c;\n\
    }\n```\n\n```\nint main(void) {\n  printf(\"char\" : %u\\n\", alignof(char));\n\
    \  printf(\"short\" : %u\\n\", alignof(short));\n  printf(\"int\" : %u\\n\", alignof(int));\n\
    \  printf(\"long\" : %u\\n\", alignof(long));\n  printf(\"long long\" : %u\\n\"\
    , alignof(long long));\n  printf(\"double\" : %u\\n\", alignof(double));\n  printf(\"\
    long double\" : %u\\n\", alignof(long double));\n}\n```"
  merge: -1
  img_proc: true
