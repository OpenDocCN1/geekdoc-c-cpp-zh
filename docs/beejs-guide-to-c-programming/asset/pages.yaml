    \ Passing and Returning structs and unions\n\nYou can pass a struct or union to\
    \ a function by value (as opposed to a pointer to it)—a copy of object to the\
    \ parameter will be as if assignment as per usual.\n\nYou can also return a struct\
    \ or union from a function and it is also passed by value back.\n\n```\n#include\
    \ <stdio.h>\n```\n\n```\nstruct foo {\n    int x, y;\n};\n```\n\n```\nstruct foo\
    \ f(void) {\n    return (struct foo){.x=34, .y=90};\n}\n```\n\n```\nint main(void)\
