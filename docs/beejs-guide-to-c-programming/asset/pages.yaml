  md: "# Chapter 11. Pointers II: Arithmetic\n\nNow—let's start incrementing p so\
    \ that it points at subsequent elements within the array. We'll do this until\
    \ p points to the 999; we'll do it until *p == 999:\n\n```\nwhile (*p != 999)\
    \    // While the thing p points to isn't 999\n    printf(\"%d\\n\", p); // Print\
    \ it\n    p++;                 // Move p to point to the next!\n}\n```\n\nCrazy,\
    \ right?\nWhen we give it a run, first p points to 11. Then we increment p, and\
    \ it points to 22, and then again, it points to 33. And so on, it counts until\
    \ 999 and we quit.\n\n# 11.1.3 Subtracting Pointers\n\nYou can subtract a value\
    \ from a pointer to get earlier address, as just like we were adding them to before.\n\
    \nBut we can subtract two pointers to find the difference between them, e.g. we\
    \ can calculate how many ints are between two int* within a single array—if the\
    \ pointers to anything, you get undefined behavior.\n\nRemember how strings are\
    \ char* in C? Let's see if we can write another variant of strlen() to compute\
    \ the length of a string that utilizes pointer subtraction.\n\nThe idea is that\
    \ if we have a pointer to the beginning of the string, we can find a pointer to\
    \ the end of the string by scanning ahead for the NUL character.\nAnd if we have\
    \ a pointer to the beginning of the string, and we computed the pointer to the\
    \ end of the string, we can just subtract the two pointers to come up with the!\n\
    \n#include <stdio.h>\n\n```\nint my_strlen(char *s)\n{\n    // Start scanning\
    \ from the beginning of the string\n    char *p = s;\n\n    // Scan until we find\
    \ the NUL character\n    while (*p != '\\0')\n        p++;\n\n    // Return the\
    \ difference in pointers\n    return p - s;\n}\n```\n\n```\nint main(void)\n{\n\
    \    printf(\"%d\\n\", my_strlen(\"Hello, world!\\)); // Prints \"13\"\n}\n```\n\
    \nRemember that you can only use pointer subtraction between two pointers that\
    \ point to the same array.\n\n> Or string, which is really an array of chars.\
    \ Seewhat peculiarly, you can also have a pointer that references one part of\
    \ the array without a problem and still do math on it. You can't difference it\
    \ when it's out there."
