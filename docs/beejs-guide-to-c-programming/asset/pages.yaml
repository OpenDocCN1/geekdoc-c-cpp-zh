  md: "# Chapter 40. Atomics\n\nThat is, the other will see the entire write of, say,\
    \ a 32-bit value. Not half of it. There's no way for one thread to interrupt another\
    \ that is in the middle of an atomic multi-byte write.\n\nIt's almost like there\
    \ is a lock around the getting and setting of one variable. (And there might be\
    \ See Lock-Free Atomic Variables, below.)\n\nAnd on that note, you can get away\
    \ without using atomics if you use mutexes to lock your critical sections. It's\
    \ just that there are a class of lock-free data structures that always allow other\
    \ threads to make progress instead of being blocked by a mutex... but these are\
    \ tough to create from scratch, and one of the things that are beyond the scope\
    \ of the guide, sadly.\n\nThat's only part of the story. But it's the part we'll\
    \ start with.\n\nBefore we go further, how do you declare a variable to be atomic?\n\
    \nFirst, include <stdatomic.h>.\n\nThis gives us types as atomic_int.\n\nAnd then\
    \ we can simply declare variables to be of that type.\n\nBut let's do a demo when\
