  md: '# 40.13 Memory Order


    p = &x; // OK!


    We''ve already talked about sequential consistency, which is the sensible one
    of the bunch. But there are a number of other ones:


    | memory_order | Description |

    | --- | --- |

    | memory_order_seq_cst | Sequential Consistency |

    | memory_order_acq_rel | Acquire/Release |

    | memory_order_release | Release |

    | memory_order_acquire | Acquire |

    | memory_order_consume | Consume |

    | memory_order_relaxed | Relaxed |


    You can specify others with certain library functions. For example, you can add
    a value to an atomic variable like this:


    ```

    atomic_int x = 0;

    x += 5; // Sequential consistency, the default

    ```


    Or you can do the same with this library function:


    ```

    atomic_int x = 0;

    atomic_fetch_add(&x, 5); // Sequential consistency, the default

    ```


    Or you can do the same thing with an explicit memory ordering:


    ```

    atomic_int x = 0;

    atomic_fetch_add_explicit(&x, 5, memory_order_seq_cst);

    ```


    But what if we didn''t want sequential consistency? And you wanted acquire/release
    instead for whatever reason? Just name it:


    ```

    atomic_int x = 0;

    ```


    ```

    atomic_fetch_add_explicit(&x, 5, memory_order_acq_rel);

    ```


    We''ll do a breakdown of the different memory orders, below. Don''t mess with
    anything other than sequential consistency unless you know what you''re doing.
    It''s really easy to make mistakes that will cause quite, hard-to-reproduce fails.


    # 40.1.3 Sequential Consistency


    +   * Load operations acquire (see below).

    * Store operations release (see below).

    * Read-modify-write operations acquire then release.


    Also, in order to maintain the total order of acquires and releases, no acquires
    or releases will be reordered with respect to each other. (The acquire/release
    rules do not forbid reordering a release followed by an acquire. But the sequentially
    consistent rules do.)'
