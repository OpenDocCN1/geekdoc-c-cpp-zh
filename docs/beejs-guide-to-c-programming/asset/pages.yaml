    \ make a new process and run this thing?\" If all goes well, the OS complies and\
    \ your program runs.\n\nBut there's a world outside your program in the shell\
    \ that can be interacted with from within C. We'll look at a few of those in this\
    \ chapter.\n\n# 18.1 Command Line Arguments\n\nMany command utilities accept command\
    \ line arguments. For example, if we want to see all files that end in .txt, we\
    \ can type something like this on a Unix-like system:\n\n```\nls *.txt\n```\n\n\
    (or instead of ls on a Windows system).\n\nIn this case, the command is ls, but\
    \ it all arguments are all files that end with .txt¹.\n\nSo how can we see what\
    \ is passed into program from the command line?\n\nSay we have a program called\
    \ that adds all numbers passed on the command line and prints the result:\n\n\
    ```\n../add 10 30 5\n45\n```\n\nThat's gonna pay the bills for!\n\nBut seriously,\
    \ this is a great tool for seeing to get those arguments from the command line\
    \ and break\nem down.\n\nFirst, let's see how to get them all. For this, we're\
    \ going to need a new main()!\n\nHere's a program that prints out all the command\
    \ line arguments. For example, if we name the executable\nfoo, we can run it like\
    \ this:\n\n```\n./foo i like turtles\n```\n\nand we'll see this output:\n\n> ¹Historically,\
    \ MS-DOS and Windows programs would do this differently than Unix. In Unix, the\
    \ shell would expand the wildcard\n all matching files before your program saw,\
    \ whereas the Microsoft variants would pass the wildcard expression into the program\n\
    to deal with. In any case, there are arguments that get passed into the program."
