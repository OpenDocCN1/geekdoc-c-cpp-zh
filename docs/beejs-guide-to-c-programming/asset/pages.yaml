  md: '# Chapter 23. Pointers III: Pointers to More


    Does it matter if it''s an int* or an int**? Is one more bytes than the other?
    Nope! Remember that all pointers are addresses, that is indexes into memory. And
    on my machine you can represent an index with 8 bytes... doesn''t matter what
    is stored at that index.


    Now check out what we did on line 9 of the previous example: double dereferenced
    q to get back to our 3490.


    This is the important about pointers and pointers to pointers:


    +   - You can get a pointer to anything & (including to a pointer!)

    - You can get the thing pointer points to * (including a pointer!)


    So if you think of & being used to make pointers, and * being the inverse—it goes
    the opposite direction of &-* to get to the thing pointed to.


    In terms of type, each time you run * another pointer level to the type.


    | If have | Then you run | The result type is |

    | int | &x | int * |

    | int * | &x | int ** |

    | int ** | &x | int *** |

    | int *** | &x | int **** |


    And each time you dereference (*), it does the opposite:


    | If have | Then you run | The result type is |

    | int ****x | *x | int *** |

    | int ***x | *x | int ** |

    | int **x | *x | int * |

    | int * | *x | int |


    Note that you can use *s in a row to quickly dereference, just like we saw in
    the example code with **, above. Each one strips away one level of indirection.


    | If have | Then you run | The result type is |

    | int ****x | **x | int * |

    | int ***x | **x | int * |

    | int **x | **x | int |


    In general, &E == E. The difference "undoes" the address-of.


    But doesn''t work the same way—you can only do one at a time, and have to store
    the result in intermediate variable:


    ```

    int x = 3490; // Type: int

    int *p = &x; // Type: int *, pointer to an int

    int **q = &p; // Type: int **, pointer to pointer to an int

    int ***r = &q; // Type: int ***, pointer to pointer to pointer to int

    int ****s = &r; // Type: int ****, you get the idea

    int *****t = &s; // Type: int *****

    ```


    > ^4Even if E is NULL, it turns out, weirdly.'
