  md: "# Chapter 16. Types IV: Qualifiers and Specifiers\n\n# 16.2.4 register\n\n\
    This is a keyword to hint the compiler that this variable is frequently-used,\
    \ and should be made as fast as possible to access. The compiler is under no obligation\
    \ to agree to it.\n\nNow, modern C compiler optimizers are pretty effective at\
    \ figuring out this themselves, so it's rare to see these days.\n\nBut if you\
    \ must:\n\n```\n#include <stdio.h>\n\nint main(void)\n{\n    register int a; //\
    \ Make \"a\" as fast to use as possible.\n\n    for (a = 0; a < 10; a++)\n   \
    \     printf(\"%d\\n\", a);\n\n}\n```\n\nIt comes at a price, however. You can't\
    \ take the address of a register\n\n```\nregister int a;\n*p = &a; // COMPILER\
    \ ERROR! Can't take address of a register\n```\n\nThe same applies to any part\
    \ of an array:\n\n```\nregister int a[] = {11, 22, 33, 44, 55};\n*p = &a[0]; //\
    \ COMPILER ERROR! Can't take address of a[0]\n```\n\nDereferencing any part of\
    \ an array:\n\n```\nregister int a[] = {11, 22, 33, 44, 55};\n```\n\n```\nint\
    \ a = (a + 2); // COMPILER ERROR! Address of a[0]\n```\n\nInterestingly, for the\
    \ equivalent with array notation, gcc only gives:\n\n```\nregister int a[] = {11,\
    \ 22, 33, 44, 55};\n```\n\n```\nint a = a[2]; // COMPILER WARNING!\n```\n\nwith:\n\
    \nwarning: ISO C forbids subscribing 'register' array\n\nThe fact that you can't\
    \ take the address of a register variable frees the compiler to make optimizations\
    \ around assumption that it hasn't figured it out already. Also adding register\
    \ to a const variable prevents from accidentally passing its pointer to another\
    \ function that would ignore its 'const'¹².\n\nA bit of historic back: inside\
    \ the CPU are little dedicated \"variables\" called 'registers'. They are super\
    \ fast to access RAM, so using them you get a speed boost. They're not in RAM,\
    \ so they don't have an associated address (which is why you can't take the address\
    \ of or get a pointer to them).\n\nBut, like I said, modern compilers are really\
    \ good at producing optimal code, using registers regardless of whether or not\
    \ you specified the register keyword. Not only that, but the spec allows them\
    \ to just treat it as if you'd typed out, there are no guarantees.\n\n> ¹https://gusted.wordpress.com/2010/08/17/a-common-misconception-the-register-keyword/\n\
    \n> ²https://en.wikipedia.org/wiki/Processor_register"
