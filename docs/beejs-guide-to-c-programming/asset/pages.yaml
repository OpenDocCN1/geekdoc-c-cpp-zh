    int my_strlen(char *s) // Works!\nint my_strlen(char *s[]) // Works, too\n```\n\
    \n# 11.3 void Pointers\n\nYou've already seen the keyword used with functions,\
    \ but this is an entirely separate, unrelated animal.\nSometimes it's useful to\
    \ have a pointer to a thing that you don't know the type of.\nI know. Bear with\
    \ me just a second.\nThere are basically two cases for this:\n\n+   1. A function\
    \ is going to operate on some byte-by-byte. For example, memcpy() copies bytes\
    \ of memory from one pointer to another, but those pointers can take advantage\
    \ of the fact that you iterate through char *s, you're iterating through the bytes\
    \ of no object no matter the type it is. This is more on the Multiverse section.\n\
    2. Another function is calling a function to pass it (as a callback), and it's\
    \ passing you data. You know the type of the data, but the function calling you\
    \ doesn't. So it passes void*s—cause it doesn't know the type—and you convert\
