    \ of listing a prototype for the above function; one of them involves a if you\
    \ don't want to specify name value in the VLA. It just indicates that the type\
    \ is a VLA as opposed to a regular pointer.\n\nVLA prototypes:\n\n```\nvoid do_something(int\
    \ count, int v[count]); // With names\nvoid do_something(int, int v[*]); // Without\
    \ names\n```\n\nAgain, that * only works with the prototype—in the function itself,\
    \ you'll have to put the explicit size. Now—let's get multidimensional! This is\
    \ where fun begins.\n\n# 30.5 Passing Multi-Dimensional VLAs to Functions\n\n\
    Same as you did with the second form of one-dimensional VLAs, above, but this\
    \ time we're passing in two dimensions and using those.\n\nIn the following example,\
    \ we build a multiplication table matrix of a variable width and height, and pass\
    \ it to a function to print out.\n\n```\n#include <stdio.h>\n\nvoid print_matrix(int\
    \ h, int w, int m[h][w]) {\n    for (int row = 0; row < h; row++) {\n        for\
    \ (int col = 0; col < w; col++) {\n            printf(\"%2d \", m[row][col]);\n\
    \        }\n        printf(\"\\n\");\n    }\n}\n\nint main(void)\n{\n    int rows\
    \ = 4;\n    int cols = 7;\n\n    int matrix[rows][cols];\n\n    for (int row =\
    \ 0; row < rows; row++) {\n        for (int col = 0; col < cols; col++) {\n  \
