  md: "# Chapter 20. structs II: More Fun with structs\n\nAnd, as you might have guessed,\
    \ the struct common is so code we can agnostically look at the type without mentioning\
    \ a particular animal.\n\nLet's look at the code to print a union animal:\n\n\
    ```\nvoid print_animal(union animal *x) {\n    switch (x->common.type) {\n   \
    \     case ANTELOPE:\n            printf(\"Antelope loudness=%d\\n\", x->antelope.loudness);\n\
    \            break;\n        case OCTOPUS:\n            printf(\"Octopus : sea_creature=%d\\\
    n\", x->octopus.sea_creature);\n            printf(\"      intelligence=%f\\n\"\
    , x->octopus.intelligence);\n            break;\n        default:\n          \
    \  printf(\"Unknown animal type%s\\n\");\n    }\n}\n```\n\n```\nint main(void)\
    \ {\n    union animal a = {.antelope.type=ANTELOPE, .antelope.loudness=12};\n\
    \    union animal b = {.octopus.type=OCTOPUS, .octopus.sea_creature=1, .octopus.intelligence=12.8};\n\
    \n    print_animal(&a);\n    print_animal(&b);\n}\n```\n\nSee how on line 29 we're\
    \ just passing in the union—we have no idea what type of animal struct is in use\
    \ within it.\n\nBut that's OK! Because on line 31 we check the type to see if\
    \ it's an antelope or an octopus, and then we can look the proper struct to get\
    \ the members.\n\nIt's definitely possible to get this same effect using just\
    \ structs, but you can do it this way if you want the memory-saving effects of\
    \ a union.\n\n# 20.10 Unions and Unnamed Structs\n\nYou know how you can have\
    \ an unnamed struct, like this:\n\n```\nstruct {\n    int x, y;\n} s;\n```\n\n\
    That defines a variable s that is of anonymous type (because the struct has no\
    \ name tag), members x and y.\n\nSo things like this are valid:\n\n```\ns.x =\
    \ 34;\ns.y = 90;\n```"
