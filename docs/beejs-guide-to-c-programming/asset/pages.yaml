  md: "# 20.3 Self-Referential structure\n\nFor any graph-like data structure, it's\
    \ useful to have pointers to the connected nodes/vertices. But this means that\
    \ in the definition of a node, you need to have a pointer to a node. It's chicken\
    \ and eggy! But it turns out you can do this in C with no problem whatsoever.\n\
    \nFor example, here's a linked list node:\n\n```\nstruct node {\n  int data;\n\
    \  struct node *next;\n}\n```\n\nIt's important to note that a pointer is a pointer.\
    \ This is what the whole thing en to build. Even though the compiler doesn't know\
    \ what the entire struct looks like yet, all pointers are the same size.\n\nHere's\
    \ a cheesy linked list program to test it:\n\n```\n#include <stdio.h>\ninclude\
    \ <stdlib.h>\n\nstruct node {\n  int data;\n  struct node *next;\n}\n\nint main(void)\
    \ {\n  struct node *head;\n  // Hackishly set up a linked list (11)->(22)->(33)\n\
    \  head = malloc(sizeof(struct node));\n  head->data = 11;\n  head->next = malloc(sizeof(struct\
    \ node));\n  head->next->data = 22;\n  head->next->next = malloc(sizeof(struct\
    \ node));\n  head->next->next->data = 33;\n  head->next->next->next = NULL;\n\n\
    \  // Traverse it\n  for (struct node *cur = head; cur != NULL; cur = cur->next)\
    \ {\n    printf(\"%d\\n\", cur->data);\n  }\n}\n```\n\nRunning that prints:\n\n\
    +   11\n22\n33\n\n# 20.4 Flexible Array Members\n\nBack in the good old days,\
    \ when people carved C code out of wood, some folks thought would be neat if they\
    \ could allocate structs that had variable length arrays at the end of them."
