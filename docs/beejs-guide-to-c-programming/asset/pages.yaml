    # 18.1.1 The Last argv is NULL


    One bit of trivia about argv is that after the last string is a pointer to NULL.

    That is:


    ```

    argv[argc] == NULL

    ```


    is always true!

    This might seem pointless, but it turns out to be useful in a couple places; we''ll
    take a look at one of those right now.


    # 18.1.2 The Alternate: char **argv


    Remember when you call a function, C doesn''t differentiate between array notation
    and pointer notation in the function signature.


    That is, these are the same:


    ```

    void foo(char[])

    void foo(char *a)

    ```


    Now, it''s convenient to use argv as an array of strings, i.e. an array of char*s,
    so that this makes sense:


    ```

    int main(int argc, char argv[])

    ```


    but because of the equivalence, you could also write:


    ```

    int main(int argc, char **argv)

    ```


    Yeah, that''s a pointer to a pointer, all right! If it makes it easier, think
    of it as a pointer to a string. But really, it''s a pointer to a value that points
    to a char.


    Also recall that these are equivalent:


    ```

    argv[i]

    *(argv + i)

    ```'
