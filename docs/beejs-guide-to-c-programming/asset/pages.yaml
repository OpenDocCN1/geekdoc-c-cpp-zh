  md: "# Chapter 38. Date and Time Functionality\n\nMon Apr 12 12:00:04 1982\nIs DST:\
    \ 0\n\nWhen you manually load a struct like that, it should be in local time.\
    \ mktime() will convert that local time into a time_t calendar item.\n\nWeirdly,\
    \ the standard doesn't give you a way to load a struct tm with a UTC and convert\
    \ that to a time_t. If you want to do that with Unix-likes, use the non-standard\
    \ timegm(). On Windows, _mkgmtime().\n\n# 38.4 Formatted Date Output\n\nWe've\
    \ already seen a couple ways to print formatted date to the screen. With time_t\
    \ we can use ctime(), and with struct tm we can use asctime().\n\n```\ntime_t\
    \ now = time(NULL);\nstruct tm *local = localtime(&now);\nstruct tm *utc = \"\
    UTC\" = gmtime(&now);\n```\n\n```\nprintf(\"Local time: %s\\n\", ctime(local));\
    \ // Local time with time_t\nprintf(\"Local time: %s\\n\", asctime(local)); //\
    \ Local time with struct tm\nprintf(\"UTC: %s\\n\", asctime(utc)); // UTC with\
    \ struct tm\n```\n\nBut what if I told you, dear, there's a way to have more control\
    \ over how the date was printed?\n\nSure, we could fetch individual fields out\
    \ of the struct tm, but there's a great function strftime() that will do all the\
    \ hard work for you. If it's printf(), except for days!\n\nLet's see some examples.\
    \ In each of these, we use a destination buffer, a maximum number of characters\
    \ to write, and a format string (in the style of—but not the same as—printf())\
    \ tells strftime() which components of a struct tm to print and how.\n\nYou can\
    \ add other characters to include in the format string, as well, just like with\
    \ printf().\n\nWe get a struct tm in this case from localtime(), but any source\
    \ works fine.\n\n```\n#include <stdio.h>\n#include <time.h>\n```\n\n```\nint main(void)\
    \ {\n  char s[128];\n  time_t now = time(NULL);\n\n  // c: print date as per current\
    \ locale\n  strftime(s, sizeof(s), \"%c\", localtime(&now));\n  puts(s); // Sun\
    \ Feb 28 22:29:00 2021\n\n  // %A: full weekday name\n  // %B: full month name\n\
    \  // %d: day of the month\n  strftime(s, sizeof(s), \"%A, %B %d\", localtime(&now));\n\
    \  puts(s); // Sunday, February 28\n\n  // %I: hour (12 hour clock)\n  // %M:\
    \ minute\n```"
