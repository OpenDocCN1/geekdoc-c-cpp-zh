  md: '# Chapter 5


    # Pointers—Cower In Fear!


    "How do you get to Carnegie Hall?"

    "Practice!"


    —20th-century joke of unknown origin


    Pointers are one of the most feared things in the C language. In fact, they are
    the one thing that makes language challenging at all. But why?


    Because, quite honestly, can cause electric shocks to come up through the keyboard
    and physically weld your arms permanently in place, cursing you to a life at the
    keyboard from the 70s!


    Really? Well, not really. I''m trying to set you up for success.


    Depending on what language you came from, you might already understand the concept
    of references, where a variable refers to an object of some type.


    This is very much the same, we have to be more explicit with C about when we''re
    talking about the reference or what it refers to.


    # 5.1 Memory and Variables


    Computer memory holds data of all kinds, right? It''ll hold floats, ints, or whatever
    you have. To make memory easy to copy, each byte of memory is identified by an
    integer. These integers increase sequentially as you move through memory. You
    can think of it as a bunch of numbered boxes, where each box holds a byte of data.
    Or a big array where each element holds a byte, if you come from a language with
    arrays. The number that represents each box is called its address.


    Now, not all data types use a byte. For instance, int is often four bytes, as
    a float is, but it really depends on the system. You can use the sizeof operator
    to determine how many bytes of a certain type use.


    ```

    // zu is the format specifier for size_t

    ```


    ```

    printf("int uses %zu bytes of memory\n", sizeof(int));

    ```


    ```

    // That prints "4" for me, but can vary by system.

    ```


    > Typically. I''m sure there are exceptions out there in the dark corridors of
    computing history.

    A byte is made up of no more than 8 binary digits, or bits for short. This means
    in decimal digits just like grandma used to use, it can hold an unsigned number
    between 0 and 255, inclusive.'
