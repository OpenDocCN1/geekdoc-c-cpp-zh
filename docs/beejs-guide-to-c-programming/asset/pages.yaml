  md: 'Chapter 27. Unicode, Wide Characters, and All That


    # 27.11.2 UTF-16, UTF-32, char16_t, and char32_t


    char16_t and char32_t are a couple potentially wide character types with sizes
    of 16 bits and 32 bits, respectively. Not necessarily wide, because if they can''t
    represent every character in the current locale, they lose their wide nature.
    The spec refers to them as "wide character" types all over the place, so there
    we are.


    These are here to make things a little Unicode-friendlyly.


    To include, <cuchar.h>. (That''s "u", not "uw").


    This header file doesn''t exist on OS X—bom. If you just want the types, you can:


    ```

    #include <stddef.h>


    typedef int_least16_char16_t;

    typedef int_least32_char32_t;

    ```


    But if you also want the functions, they''re all on you.


    Assuming you''re still good to go, you can declare a string or character of these
    types with the u and u prefixes:


    char16_t *s = "uHello, world!";nchar16_t *c = "uB";


    ```

    char32_t *t = "uHello, world!";nchar32_t d = "uB";

    ```


    Now—values are used in these stored in UTF-16 or UTF-32? Depends on the implementation.

    But you can test to see if they are. If the macros __STDC_UTF_16__ or __STDC_UTF_32__
    are defined (to 1) it means the types hold UTF-16 or UTF-32, respectively.

    If you''re curious, and I know the values, if UTF-16 or UTF-32, are stored in
    the native endianness, that you should be able to compare them straight against
    Unicode code point values:


    ```

    char16_t pi = "u\u03BC"; // pi symbol

    #if __STDC_UTF_16_

    pi == 0x03C; // Always true

    #else

    pi == 0x030; // Probably not true

    #endif

    ```


    # 27.11.3 Multibyte Conversions


    You can convert your multibyte encoding to char16_t or char32_t with a number
    of helper functions.

    (Like I said, though, the result might not be UTF-16 or UTF-32 unless the conversion
    macro is set to 1).

    All of these functions are restartable (i.e. you pass in your own mbstate_t),
    and all of them operate character by character.


    | Conversion Function | Description |

    |---|---|

    | mbrtoc16() | Convert a multibyte character to a char16_t character. |

    | mbrtoc32() | Convert a multibyte character to a char32_t character. |


    > ¹things get funky with multi-char16_t UTF-16 encodings.'
