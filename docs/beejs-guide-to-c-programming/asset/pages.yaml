- pgno: 251
  md: "# Chapter 34. Long Jumps with setjmp, longjmp\n\nTechnically, they only have\
    \ to be volatile if they change between the time setjmp() is called and longjmp()\
    \ is called.\n\nFor example, if we run this code:\n\n```\nint x = 20;\n\nif (setjmp(env)\
    \ == 0) {\n    x = 30;\n}\n```\n\nand then later longjmp() back, the value of\
    \ x will be indeterminate.\n\nIf we want to fix this, x must be volatile:\n\n\
    ```\nvolatile int x = 20;\n\nif (setjmp(env) == 0) {\n    x = 30;\n}\n```\n\n\
    Now the value will be 30 after a longjmp() returns us to this point.\n\n# 34.2.2\
    \ How Much State is Saved?\n\nWhen you longjmp(), execution resumes at the point\
    \ of the corresponding setjmp(). And that's it.\nThe spec points out that it's\
    \ just as if you'd jumped back into the function at point with local variables\
    \ set to whatever values when the longjmp() call was made.\n\nThings aren't restored,\
    \ paraphrasing the spec:\n\n+   * Floating point status flags\n* Open files\n\
    * Any other component of the abstract machine\n\n# 34.2.3 You Can't Name Anything\
    \ setjmp\n\nYou can't have any extern identifiers with the name setjmp. Or, if\
    \ setjmp is a macro, you can't define it.\nBoth are undefined behavior.\n\n# 34.2.4\
    \ You Can't setjmp() in a Larger Expression\n\nThat is, you cannot do like this:\n\
    \n```\nif (x == 12 && setjmp(env) == 0) { ... }\n```\n\nThat's too complex to\
    \ be allowed by the spec due to the machinations that must occur when unwrolling\
    \ the stack and all. We can't longjmp() back into some complex expression that's\
    \ only partially executed.\n\nSo there are limits on the complexity of that.\n\
    \n+   * It can be the entirely controlling expression of the conditional.\n\n\
    if (setjmp(env)) {...}\nwitch (setjmp(env)) {...}\n\n> 2 The rationale here is\
    \ that the program might store a value temporarily in a CPU register while it's\
    \ working on it. In that timeframe, the register holds the correct value, and\
    \ the value on the stack might be out of date. Then later register values would\
    \ get overwritten and the changes to the volatile variable."
