  md: "# Chapter 25. Variadic Functions\n\nWhat do you do put all the arguments that\
    \ must be passed first (remember there has to be at least one) and after that,\
    \ you put . . . Just like this:\n\n```\nvoid func(int a, ...)    // Literally\
    \ 3 dots here\n```\n\nHere's some code to demo that:\n\n```\n#include <stdio.h>\n\
    ```\n\n```\nvoid func(int a, ...)\n{\n    printf(\"a is %d\\n\", a);    // Prints\
    \ \"a is 2\"\n}\n```\n\n```\nint main(void)\n{\n    func(2, 3, 4, 5, 6);\n}\n\
    ```\n\nSo, great, we can get that first in variable a, but what about the rest\
    \ of the arguments? How do you get them?\n\nHere's where the fun begins!\n\n#\
    \ 25.2 Getting the Extra Arguments\n\nYou're going to include <stdarg.h> to make\
    \ any of this work.\n\nFirst things first, we're going to use a special variable\
    \ of type va_list (variable argument list) to keep track of which variable we\
    \ are accessing at a time.\n\nThe idea is that we start processing arguments with\
    \ a call to va_start(), process each argument in turn with va_arg(), and then,\
    \ when done, wrap it up with va_end().\n\nWhen you call va_start(), you need to\
    \ pass in the last named parameter (the one just before the ...) so it knows where\
    \ to looking for the additional arguments.\n\nAnd when you call va_arg() to get\
    \ the next argument, you need to tell it the type of argument to get next.\n\n\
    Here's a demo that adds an arbitrary number of integers. The first argument is\
    \ the number of integers to add. We'll make use of this to figure out how many\
    \ times we have to call va_arg().\n\n```\n#include <stdio.h>\n#include <stdarg.h>\n\
    ```\n\n```\nint add(int count, ...)\n{\n    int total = 0;\n    va_list va;\n\
    ```\n\n```\nva_start(va, count);    // Start with arguments after \"count\"\n\
    for (int i = 0; i < count; i++) {\n    int n = va_arg(va, int);    // Get the\
    \ next int\n    total += n;\n}\n```\n\n```\nva_end(va);    // All done\n```"
