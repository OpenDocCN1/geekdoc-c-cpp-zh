  md: '# Chapter 14. Types II: Way More Types!


    Turns out floating point numbers can encode numbers that require more decimal
    places to print completely.

    It''s just your big decimal number might not map to one of those.


    That is, when you look at floating point numbers from one to the next, there''s
    a gap. If you try to encode

    a decimal in that gap, you''ll use the closest floating point number. That is
    why you can only encode

    FLT_DIG for a float.


    But what about floating point numbers that aren''t in the gap? How many places
    do you need to print

    those out accurately?


    Another way to phrase this question is for any given floating point number, how
    many decimal digits do I

    have to preserve if I convert the decimal number back into an identical floating
    point number? That

    is, how many digits do I have to print in base 10 to recover all the digits in
    base 2 in the original number?


    Sometimes it might only be a few. But to be sure, you''ll want to convert to decimal
    with a certain safe number of decimal places. Number is encoded in the following
    macros:


    | Macro | Description |

    |---|---|

    | FLT_DECIMAL_DIG | Number of decimal digits encoded in a float. |

    | DBL_DECIMAL_DIG | Number of decimal digits encoded in a double. |

    | LDBL_DECIMAL_DIG | Number of decimal digits encoded in a long double. |

    | DECIMAL_DIG | Same as the widest encoding, LDBL_DECIMAL_DIG. |


    Let''s see an example where DBL_DIG is 15 (so that we have a constant), but DBL_DECIMAL_DIG

    is 17 (so we have to convert to 17 decimal numbers to preserve all the bits of
    the original double).


    Let''s assign 15 digits to 0.123456789012345 to x, and let''s assign the 1 significant
    digit

    number 0.0000000000000006 to y.


    ```

    x is: 0.123456789012345      Printed to 17 decimal places

    y is: 0.0000000000000006

    ```


    But let''s add them together. let''s look:0.12345678901234536, but that''s more
    than DBL_DIG, so

    strange things might happen.


    ```

    x + y = not quite right: 0.12345678901234559      Should end in 4560!

    ```


    What''s we get for printing more than DBL_DIG, right? But check this out...that
    number, above, is

    exactly representable as it is!


    If we assign 0.12345678901234559 (17 digits) to z and print, we get:

    z is: 0.12345678901234559      17 digits correct! But then DBL_DIG!


    If we truncated z down to 15 digits, it wouldn''t have the same value. That''s
    why to preserve all the

    bits of a double, we need DBL_DECIMAL_DIG and not just the lesser DBL_DIG.


    All being said, it''s clear that we''re messing with decimal numbers in general,
    it''s not safe to print

    more than FLT_DIG, DBL_DIG, or LDBL_DIG to be sensible in relation to the original
    base 10 numbers

    and any subsequent month.


    But when converting from float to a decimal representation and back to float,
    definitely use

    FLT_DECIMAL_DIG to do so that all the bits are preserved.


    # 14.5 Constant Numeric Types


    When you write down a constant number, like 1234, is it what type? Let''s look
    how C

    dec what type the constant is, and how to force it to choose a specific type.'
