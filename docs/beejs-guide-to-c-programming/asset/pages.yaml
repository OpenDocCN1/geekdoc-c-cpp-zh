    \ world!\" | char⁴ |\n\nC makes an effort to convert most numeric types when you\
    \ ask it to. But other than, all conversations are manual, not between string\
    \ and numeric.\n\nAll of the types in C are variants on these types.\n\nBefore\
    \ you use a variable, you have to declare a variable and tell C what the variable\
    \ holds. Once declared, the variable cannot be changed later at runtime. What\
    \ you set it to is what it is until it falls out of scope and reabsorbed into\
    \ the universe.\n\nLet's take our previous \"Hello, world\" and add couple variables\
    \ to it:\n\n```\n#include <stdio.h>\n\nint main(void) {\n    int i;      // Holds\
    \ signed integers, e.g. -3, 0, 1, 10\n    float f;    // Holds signed floating\
    \ point numbers, e.g. -3.14159\n\n    printf(\"Hello, World!\\n\"); // Ah, blessed\
    \ familiarity\n\n}\n```\n\nWe've declared a couple of variables. We've used them,\
    \ and they're both initialized. One holds an integer, and the other holding a\
    \ floating point (a real number, basically, if you have a background).\n\nUninitialized\
    \ variables have indeterminate value³. They have to be initialized or else you\
    \ must assume they contain some number.\n\n³I'm lying here little. 3.14159 is\
    \ of type double, but there are not yet and I you associate float with \"Floating\
