  md: "# Chapter 22\n\n# Enumerated Types: enum\n\nC offers us another way to have\
    \ constant integer values by name: enum.\n\nFor example:\n\n```\nenum {\n  ONE=1,\n\
    \  TWO=2\n}\n```\n\n```\nprintf(\"%d %d\", ONE, TWO); // 1 2\n```\n\nIn some ways,\
    \ it can be better—or than using a #define. Key differences:\n\n+   - enums can\
    \ only be integer types.\n- #define can define anything at all.\n- enums are often\
    \ shown by their symbolic identifier name in a debugger.\n- #defined numbers just\
    \ show as raw numbers which are harder to know the meaning of while debug-ging.\n\
    \nSince they're integer types, they can be used any place integers can be used,\
    \ including in array dimensions and case statements.\n\nLet's tearar into this\
    \ more.\n\n# 22.1 Behavior of enum\n\n# 22.1.1 Numbering\n\nenums are automatically\
    \ numbered unless you override them.\n\nThey start at 0, and autoincrement from\
    \ there, by default:\n\n```\nenum {\n  SHEEP, // Value is 0\n  WHEAT, // Value\
    \ is 1\n  WOOD, // Value is 2\n  BRICK, // Value is 3\n  ORE // Value is 4\n}\n\
    ```\n\n```\nprintf(\"%d\\n\", SHEEP, BRICK); // 0 3\n```"
