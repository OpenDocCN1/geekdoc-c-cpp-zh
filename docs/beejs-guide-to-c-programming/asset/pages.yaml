- pgno: 263
  md: '# Chapter 37. Fixed Width Integer Types


    The following types are guaranteed to be defined:


    ```

    int_least8_t      uint_least8_t

    int_least16_t   uint_least16_t

    int_least32_t   uint_least32_t

    int_least64_t   uint_least64_t

    ```


    ```

    int_fast8_t      uint_fast8_t

    int_fast16_t   uint_fast16_t

    int_fast32_t   uint_fast32_t

    int_fast64_t   uint_fast64_t

    ```


    There might be others of different widths, as well, but are optional.


    Hey! Where are the fixed types int16_t? Turns out these are entirely optional...unless
    certain conditions are met². And if you have an average run-of-the-mill modern
    system, then conditions are probably not met. And if they are, you''ll have these
    types:


    ```

    int8_t        uint8_t

    int16_t       uint16_t

    int32_t       uint32_t

    int64_t       uint64_t

    ```


    Other variants with different widths might be defined, but they''re optional.


    # 37.2 Maximum Integer Size Type


    There''s a type you can use that holds the largest representable integers available
    on the system, both signed and unsigned:


    ```

    intmax_t

    uintmax_t

    ```


    Use these types when you want to go as big as possible.


    Obviously values from any other integer types of the same size will fit in this
    type, necessarily.


    # 37.3 Using Fixed Size Constants


    If you have a constant that you want to fit in a number of bits, you can use these
    macros to automatically append the proper suffix to the number (e.g. 22LL or 3490ULL).


    ```

    INT8_C(x)      UINT_C(x)

    INT16_C(x)    UINT16_C(x)

    INT32_C(x)    UINT32_C(x)

    INT64_C(x)    UINT64_C(x)

    INTMAX_C(x)   UINTMAX_C(x)

    ```


    Again, this work only with constant integer values.


    For example, we can use one of these to assign constant values like so:

    uint16_t x = UINT16_C(12);

    intmax_t y = INTMAX_C(3490);


    > ²Namely, the system has 8, 16, 32, or 64 bit integers with no padding that two''s
    complement representation, in which case the int_N variant for that particular
    number of bits must be defined.'
