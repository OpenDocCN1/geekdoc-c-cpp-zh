  md: "# Chapter 20. structs II: More Fun with structs\n\n```\n#include <stdio.h>\n\
    \nstruct parent {\n    int a, b;\n};\n\nstruct child {\n    struct parent super;\
    \ // MUST be first\n    int c, d;\n};\n\n// Making the argument void* so we can\
    \ pass any type into it\n// (namely a struct parent or struct child)\nvoid print_parent(void\
    \ *p)\n{\n    // Expects a struct parent-but a struct child will also work\n \
    \   // because the pointer points to the struct parent in the first\n    // field:\n\
    \    struct parent *self = p;\n    printf(\"Parent: %d, %d\\n\", self->super.a,\
    \ self->super.b);\n}\n\nvoid print_child(struct child *self)\n{\n    printf(\"\
    Child: %d, %d\\n\", self->c, self->d);\n}\n```\n\n```\nint main()\n{\n    struct\
    \ child c = {.super.a=1, .super.b=2, .c=3, .d=4};\n\n    print_parent(&c);\n \
    \   print_child(&c); // Also works even though it's a struct child\n}\n```\n\n\
    See what we did on the last line of main()? We called print_parent() but passed\
    \ a struct child* as argument! Even though print_parent() needs the argument to\
    \ point to a struct parent, we're getting away with it because the first field\
    \ in the struct child is a struct parent.\n\nAgain, this works because a pointer\
    \ has the same value as a pointer to the first field in struct.\n\nAll this hinges\
    \ on part of the spec:\n\n> §6.7.2.11 [...] A pointer to a structure object, suitably\
    \ converted, points to its initial member [...], and vice versa.\n\nand\n\n> §6.7.5\
    \ An object shall have its stored value accessed only by an lvalue expression\
    \ that has one of following types:\n\n+   * a type compatible with the effective\
    \ type of the object\n* [...]\n\nand my assumption that \"suitably converted\"\
    \ means \"cast\" to the effective type of the initial member."
