    \ that you could pass all arguments to functions and then they'd be duly copied\
    \ into parameters, and then you could manipulate local copies of those variables\
    \ within the\n\nWhat if wanted to bring back more than one single piece of data\
    \ from the function? I mean, can you only return one, right? What if I answered\
    \ that question with another question? ...Er, two questions?\n\nWhat happens when\
    \ you pass a pointer as an argument to a function? Does a copy of the pointer\
    \ get put into its corresponding variable? Your best sweat peaks it. Remember\
    \ earlier I rambled on how EVERY SINGLE ARGUMENT got into parameters and the function\
    \ uses a copy of the argument? Well, the same is true. Here is the function you\
    \ get the pointer.\n\nBut, and this is the clever part: we will set up the pointer\
    \ in advance to that variable... and then the function can dereference its copy\
    \ of the pointer to get back to the original variable! The function can't see\
    \ the variable, but it can certainly dereference a pointer to that!\n\nThis is\
    \ analogous to writing a home address on a piece of paper, and then copying that\
    \ onto another piece of paper. You now have two pointers to that, but both are\
    \ equal to getting at getting you to the house itself.\n\nIn the case of a function\
    \ call, one of the copies is stored in a pointer variable in the calling scope,\
    \ and the other is stored in a pointer variable that is the parameter of the function.\n\
    \nExample! Let's revisit our own increment() function, but this time let's make\
    \ it that it actually increments the value in the caller\n\n```\n#include <stdio.h>\n\
    \nvoid increment(int *p) // note that it accepts a pointer to an int\n{\n    *p\
    \ = *p + 1;      // add one to the p pointers to\n}\n\nint main(void)\n{\n   \
    \ int i = 10;\n    int *j = &i;      // note the address-of; turns it into a pointer\
    \ to i\n\nprintf(\"i is %d\\n\", i);      // prints \"20\"\nprintf(\"i is also\
    \ %d\\n\", j);  // prints \"10\"\n\nincrement(j);\n}\n```"
