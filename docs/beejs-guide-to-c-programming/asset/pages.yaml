  md: "# Chapter 19. The C Preprocessor\n\n```\nif (!(x < 20)) {\n    fprintf(stderr,\
    \ \"foo.c:220: assertion x < 20 failed;\");\n    fprintf(stderr, \"x must be under\
    \ 20\\n\");\n    exit(1);\n}\n```\n\nWe can get the filename of the __FILE__ macro.\
    \ The message is already a string, with x < 20, so we'll have to struggle with\
    \ it #. We can make a multiline macro by using backslash escapes at the end of\
    \ the line.\n\n```\n#define ASSERT(c, m) \\\\\ndo {\n    if ((c)) {\\\n      \
    \  fprintf(stderr, \"__FILE__:%d: assertion % failed: %s\\n\", \\\\\n        \
    \       __LINE__, #c, m); \\\\\n        exit(1); \\\\\n    }\n} while(0)\n```\n\
    \n(It looks alike weird with __FILE__ out like that, but remember it is a string\
    \ literal, string literals next to each other are automatically concatenated.\
