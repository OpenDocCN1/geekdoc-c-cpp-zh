- pgno: 172
  md: '# Chapter 22. Enumerated Types: enum


    You can force particular integer values, as we saw earlier:


    ```

    enum {

    X=2,

    Y=18,

    Z=-2

    };

    ```


    Duplicates are not a problem:


    ```

    enum {

    X=2,

    Y=2,

    Z=2

    };

    ```


    if values are omitted, numbering continues counting in the positive direction
    from whichever value was last specified. For example:


    ```

    enum {

    A, // 0, default starting value

    B, // 1

    C=4, // 4, manually set

    D, // 5

    E, // 6

    F=3, // 3, manually set

    G, // 4

    H // 5

    }

    ```


    # 22.1.2 Trailing Commas


    This is perfectly fine, if that''s your style:


    ```

    enum {

    X=2,

    Y=18,

    Z=-2, // <-- Trailing comma

    };

    ```


    It''s gotten more popular in languages of the recent decades so you might be pleased
    to see it.


    # 22.1.3 Scope


    enums scope as you''d expect. If at file scope, the whole file can see it. If
    in a block, it''s local to that block. It''s really common for enums to be defined
    in header files so they can be #included at file scope.


    # 22.1.4 Style


    As you''ve noticed, it''s common to declare the enum symbols in uppercase (with
    underscores). This isn''t a requirement, but it is a very, very common idiom.


    # 22.2 Your enum is a Type


    This is an important thing to know about enum: they''re a type, analogous to how
    a struct is a type.'
