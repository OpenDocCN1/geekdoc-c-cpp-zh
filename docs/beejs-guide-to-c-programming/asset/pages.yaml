  md: "# 11.2 Array/Pointer Equivalence\n\nWe're finally ready to talk about this!\
    \ We've seen plenty of examples of places where we've intermixed array notation,\
    \ but let's get over the fundamental formula of array/pointer equivalence:\n\n\
    ```\na[b] == (a + b)\n```\n\nStudy that! Those equal and can be used interchangeably!\n\
    \nI've oversimplified it, because by overusing an example a and b both be expressions,\
    \ and we might want a few more parentheses to force order of operations in case\
    \ the expressions are complex.\n\nThe spec is specific, as always, declaring (in\
    \ C1 §6.5.2.1):\n\n```\nE1[2] is identical to (*((E1)+2))\n```\n\nbut that's a\
    \ little harder to make you parentheses if the expressions are complicated so\
    \ all your paths happen in the right.\n\nThis means we can decide if we're going\
    \ to use array or pointer notation for array or pointer (assuming it points to\
    \ an element of an array).\n\nLet's use array and pointer with both array and\
    \ pointer notation:\n\n```\n#include <stdio.h>\n\nint main(void) {\n    int a[]\
    \ = {11, 22, 33, 44, 55};\n\n    int *p = a; // p points to the first element\
    \ of a, 11\n\n    // Print all elements of the array a variety of ways:\n\n  \
    \  for (int i = 0; i < 5; i++)\n        printf(\"%d\\n\", a[i]); // Array notation\
    \ with a\n\n    for (int i = 0; i < 5; i++)\n        printf(\"%d\\n\", p[i]);\
    \ // Array notation with p\n\n    for (int i = 0; i < 5; i++)\n        printf(\"\
    %d\\n\", (a + i)); // Pointer notation with a a\n\n    for (int i = 0; i < 5;\
    \ i++)\n        printf(\"%d\\n\", (*p + i)); // Moving pointer with p Moving variable\
    \ a--ERROR!\n}\n\n```\n\nSo you can see that in general, if you have an array\
    \ variable, you can use pointer or array notation to access elements. Same with\
    \ a pointer variable.\n\nThe one big difference is that you can modify a pointer\
    \ to point to a different address, but you can't do that with an array.\n\n# 11.2.1\
