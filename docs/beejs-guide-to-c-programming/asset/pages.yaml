  md: "# Chapter 30\n\n# Variable-Length Arrays (VLAs)\n\nC provides a way for you\
    \ to declare an array whose size is determined at runtime. This gives you the\
    \ benefits of dynamic runtime sizing like you get with malloc(), but without needing\
    \ to worry about free()ing the memory after.\n\nNow, a lot of people don't like\
    \ VLAs. They've been banned from the Linux kernel, for example. We'll dig into\
    \ more of that rationale later.\n\nThis is an optional feature of the language.\
    \ The macro __STC_NO_VLA__ is set to 1 if VLAs are not present (They were mandatory\
    \ in C99, and then become optional in C11).\n\n```\n#if __STC_NO_VLA__ == 1\n\
    \  #error Sorry, need VLAs for this program!\n#endif\n```\n\nBut since neither\
    \ GCC nor Clang bather to define this macro, you may get limited mileage from\
    \ this. Let's dive first with an example, and then we'll look for the devil in\
    \ the details.\n\n# 30.1 The Basics\n\nA normal array is declared with a constant\
    \ size, like this:\n\n```\nint v[10];\n```\n\nWith VLAs, we can use a size determined\
    \ at runtime to set the array, like this:\n\n```\nint n = 10;\nint v[n];\n```\n\
    \nNow, that looks like the same thing, and in many ways is, but this gives you\
    \ the flexibility to compute the size you need, and then get an array of exactly\
    \ that size.\n\nLet's ask the user to input the size of the array, and then store\
    \ the index-times-10 in each of those array elements:\n\n```\n#include <stdio.h>\n\
    ```\n\n```\nint main(void)\n{\n  int n;\n\n  printf(\"Enter a number: \"); fflush(stdout);\n\
    ```"
