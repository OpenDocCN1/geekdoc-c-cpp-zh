    \ have:\n\n```\n2 1 0\n-- ...\n$100,000,000.00\n```\n\nThese are groups of three.\
    \ Group 0 (left of the decimal) has 3 digits. Group 1 (next group to the left)\
    \ has 3 digits, and the last one has 3.\n\nSo we could describe these groups,\
