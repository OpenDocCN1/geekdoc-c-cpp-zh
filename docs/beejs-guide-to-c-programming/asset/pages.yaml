  md: "# Chapter 23. Pointers III: Pointers to Pointers and More\n\nC makes one guarantee,\
    \ though you can convert a pointer to a uintptr_t type and you'll be able to convert\
    \ it back to a pointer without losing any data.\n\nuintptr_t is defined in `<stdint.h>`.\n\
    \nAdditionally, if you feel like being signed, you can use intptr_t to cause the\
    \ same effect.\n\n# 23.5 Casting Pointers to other Pointers\n\nThere's only one\
    \ safe pointer conversion:\n\n+   1. Converting to intptr_t or uintptr_t.\n2.\
    \ Converting to and void*.\n\nTWO! Two safe pointer conversions.\n\n+   3. Converting\
    \ to and char*.\n\nTHREE! Three safe conversions!\n\n+   4. Converting and a pointer\
    \ to a struct and a pointer to its first member, and vice-versa.\n\nFOUR! safe\
    \ conversions!\nIf you cast to a pointer of another type and access the object\
    \ it points to, the behavior is undefined due to something called *strict aliasing*.\n\
    \nPlain old *aliasing* refers to the ability to have more than one way to access\
    \ the same object. The access points are aliases for each other.\n\nStrict aliasing\
    \ says you are only allowed to access an object via compatible types to that object.\n\
    \nFor example, this is defined as:\n\n```\nint a = 1;\nint *p = &a;\n```\n\np\
    \ is a pointer to an int, and it points to a compatible type—namely int—so we\
    \ are golden.\n\nBut the following isn't good because because int and float are\
    \ not compatible types:\n\n```\nint a = 1;\nfloat *p = (float *) &a;\n```\n\n\
    Here's a demo that does aliasing. It takes a variable v of type uint32_t and aliases\
    \ it to a pointer to a struct. That struct has int16_t in it. These are incompatible,\
    \ so we're in violation of strict aliasing. The compiler will assume that these\
    \ two pointers never point to the same object...but we're making it they do so.\
    \ Which is naughty of us.\n\nLet's see if we can break something.\n\n```\n#include\
    \ <stdio.h>\n#include <stdint.h>\n```\n\n```\nstruct words {\n    int16_t v[2];\n\
    }\n```\n\n> ⁴It's an optional feature, so it might not be there—but it probably\
    \ is."
