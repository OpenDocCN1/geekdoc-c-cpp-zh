    # 12.5 Changing Allocated Size with realloc()


    If you''ve already allocated 10 ints, but later you need 20, what can you do?


    One option is to allocate some new space, and then memcpy the memory over... but
    it turns out sometimes you don''t need to move anything. And there''s one function
    that''s smart enough to do the right thing in all circumstances: realloc().


    It takes a pointer to some previously-allocated memory (by malloc() or calloc())
    and a new size for the memory region to be.


    It grows or shrinks that memory, and returns a pointer to it. Sometimes it might
    return the same pointer (if the data didn''t have to be copied elsewhere), or
    it might return a different one (if the data had to be copied).


    Be sure when you realloc(), you specify the number of bytes to allocate, and not
    just the number of elements that!


    ```

    num_floats = 2;

    ```


    ```

    np = realloc(p, num_floats); // WRONG: need bytes, number of elements!

    ```


    ```

    np = realloc(p, num_floats * sizeof(float)); // Better!

    ```


    Let''s allocate an array of 20 floats, and change our one and make it an array
    of 40.


    We''re going to assign the return value of realloc() into another pointer to make
    sure it''s NULL. If it''s not, then we can reassign it to our original pointer.
    (If we assigned the return value directly into the original pointer, we''d lose
    pointer if the function returned NULL and we''d have no way to get it back).


