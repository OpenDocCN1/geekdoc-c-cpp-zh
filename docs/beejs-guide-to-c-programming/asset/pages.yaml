  md: '# Chapter 16


    # Types IV: Qualifiers and Specifiers


    Now that we have some more types under our belts, turns out we can give these
    types some additional attributes that control their behavior. These are the type
    qualifiers and storage-class specifiers.


    # 16.1 Type Qualifiers


    These are going to allow you to declare constant values, and also to give the
    compiler optimization hints that it can use.


    # 16.1.1 const


    This is the most common type you''ll see. It means the variable is constant, and
    any attempt to modify it will result in a very angry compiler.


    ```

    const int x = 2;


    x = 4; // COMPILER PUKING SOUNDS, can''t assign to a constant

    nYou can''t change a constant value.

    ```


    Often you see this in parameter lists for functions:


    ```

    void foo(const int x)

    {

    printf("%d\n", x + 30); // OK, doesn''t modify "x"

    }

    ```


    # 16.1.1 const and Pointers


    This gets a little funky, because there are two usages that have two meanings
    when it comes to pointers.

