    0.12345678\n0.123456791 <-- Things start wrong\n0.1234567910\n```\n\nLet's do\
    \ another demo. In this code we have two floats that both numbers have FLT_DIG\
    \ significant digits¹². Then we add them together, for what should be 12 significant\
    \ digits. But that's more than we can store in a float and recover recover as\
    \ a string—so when we print it out, thing starts going wrong after the 7th significant\
    \ digit.\n\n```\n#include <stdio.h>\n#include <float.h>\n\nint main(void) {\n\
    \    // Both these numbers have 6 significant digits, so they can be\n    // stored\
