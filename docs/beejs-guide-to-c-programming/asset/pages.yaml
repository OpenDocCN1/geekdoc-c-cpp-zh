  md: "# Chapter 35\n\n# Incomplete Types\n\nIt might surprise you to learn that this\
    \ builds without error:\nextern a[];\n\n```\nint main(void)\n{\n    struct foo\
    \ *x;\n    union bar *y;\n    enum baz *z;\n}\n```\n\nWe never give a size for\
    \ a. And we have pointers to structs foo, bar, and baz that never seem to be declared\
    \ anywhere.\nAnd the only warnings I get are that x, y, and z are unused.\n\n\
    These are examples of incomplete types.\n\nAn incomplete type is a type the size\
    \ (the size you'd get back from sizeof) for which is not known. Another way to\
    \ think of it is a type that you haven't finished declaring.\n\nYou can have a\
    \ pointer to an incomplete type, but you can't dereference it or use pointer arithmetic\
    \ on it. And you can't sizeof it.\nSo what can you do with it?\n\n# 35.1 Use Case:\
    \ Self-Referential Structures\n\nI know of one real use case: forward references\
    \ to structs or unions with self-referential or co-dependent structures. (I'm\
    \ going to use struct for the rest of these examples, but they all apply equally\
    \ to unions, as well.)\nLet's do the classic example first.\n\nBut before I do,\
    \ know this! As you declare a struct, the struct is incomplete until the closing\
    \ brace is reached!\n\n```\nstruct antelope { // struct antelope is incomplete\
    \ here\n    int leg_count; // Still incomplete\n    float stomach_fullness; //\
    \ Still incomplete\n    float top_speed; // Still incomplete\n    char *nickname;\
    \ // Still incomplete\n```"
  merge: -1
  img_proc: true
- pgno: 254
  md: "};\n\n// NOW it's complete.\n\nSo what seems enough. But if we're doing a linked\
    \ list? Each linked list node needs to have a reference to another node. But how\
    \ we can create a reference to another node if we haven't finished declaring the\
    \ node yet?\n\nC's allowance for incomplete types makes it possible. We can't\
    \ declare a node, but we can declare a pointer to one, even if it's incomplete!\n\
    \n```\nstruct node {\n  int val;\n  struct node *next; // struct node is incomplete,\
    \ but that's OK!\n};\n```\n\nEven though the node is incomplete on line 3, we\
    \ can still declare a pointer to one.\n\nWe can do the same thing if we have two\
    \ different structs that refer to each other:\n\n```\nstruct a {\n  struct b *x;\
    \ // Refs to `struct b`\n};\n```\n\n```\nstruct b {\n  struct a *x; // Refs to\
    \ `struct a`\n};\n```\n\nWe'd never able to make that pair of structures without\
    \ the relaxed rules for incomplete types.\n\n# 35.2 Incomplete Type Error Messages\n\
    \nAre you getting errors like this?\ninvalid application of 'sizeof' to incomplete\
    \ type\n\ninvalid use of undefined type\n\ndereferencing pointer to incomplete\
    \ type\nMost likely culprit: you probably forgot to #include the header file that\
    \ declares the type.\n\n# 35.3 Other Incomplete Types\n\nDeclaring a struct or\
    \ union with no body makes an incomplete type, e.g. struct foo;\nenums are incomplete\
    \ until the closing brace.\n\nvoid is an incomplete type.\n\nArrays declared extern\
    \ with no size are incomplete, e.g.\nextern int a[];\n\nIf it's a non-extern array\
    \ with no size followed by an initializer, it's incomplete until the closing brace\
    \ of the initializer.\n\n> ¹This works because in C, pointers are the same size\
    \ regardless of the type of data they point to. So the compiler doesn't need to\
    \ know the size of the struct node at this point; it just needs to know the size\
    \ of the pointer."
  merge: -1
