    \ system that works on every platform I'm aware of.\n\nBasically, the environment\
    \ is the program that's going to run your program, or the bash shell. And it might\
    \ have some variables defined. In case you don't know, the shell can make its\
    \ own variables. Each shell is different, but in bash you can just set and it'll\
    \ show all of them.\n\nHere's an example of the 61 variables defined in bash shell:\n\
    \n```\nHOSTFILE=/home/beej/.bash_history\nHOSTFILESIZE=500\nHISTSIZE=500\nHOME=/home/bee\n\
    HOSTNAME=FBILAPTOP\nHOSTTYPE=XB86_64\nIFS=' \t'\n```\n\nNotice they are in the\
    \ form of key/value pairs. For example, one key is HOSTTYPE and its value is x86_64.\n\
    From a C perspective, all values are strings, even if they're numbers?\n\nSo,\
    \ anyway! Long story, it's possible to get these values from inside your C program.\n\
    \nLet's write a program that uses the standard getenv() function to look up a\
    \ value you set in the shell.\n\n```\n#include <stdio.h>\n#include <stdlib.h>\n\
    \nint main(void)\n{\n\tchar *val = getenv(\"FROTZ\"); // Try to get the value\n\
    \n\t// Check to make sure it exists\n\tif (val == NULL) {\n\t\tprintf(\"Cannot\
    \ find FROTZ environment variable\\n\");\n\t\treturn EXIT_FAILURE;\n\t}\n\n\t\
    printf(\"Value: %s\\n\", val);\n}\n```\n\nIf I run this directly, I get:\n\n$\
    \ ./foo\nCannot find FROTZ environment variable\n\nwhich makes sense, since I\
    \ haven't set it yet.\n\nIn bash, you can set it to something:8\n\n$ export FROTZ=\"\
    C\" is awesome!9\n\nThen I run it, I get:\n\n> 8 If you need a numeric value,\
    \ convert the string to something like atoi() or strtol.\n9 In Windows CMD.EXE,\
