    \nWoo hoo!\n\n# 9.6.1 struct and Number Caveats\n\nAs we saw in the structs, the\
    \ compiler is free to add padding to a struct as it sees fit. Different compilers\
    \ might do this differently. And the same compiler on different architectures\
    \ could do it differently. And the same compiler on the same architectures could\
    \ do it differently.\n\nWhat I'm getting at this is: it's not portable to fwrite()\
    \ an entire struct to a file when you don't know where the padding will end up.\n\
    \nHow do we fix this? Hold that thought—we'll look at some ways to do this after\
    \ looking at another related problem.\n\nNumbers!\n\nTurns out all architectures\
    \ don't represent numbers in memory the same way.\n\nLet's look at a simple fwrite(v)\
    \ of a 2-byte number. We will write it in hex so by byte. The most significant\
    \ byte will have the value 0x12 and the least significant will have the value\
    \ 0x34.\n\n```\nunsigned short v = 0x1234; // Two bytes, 0x12 and 0x34\n```\n\n\
    ```\nfwrite(&v, sizeof(v), 1, fp);\n```\n\nWhat ends up in the stream?\n\nWell,\
    \ it seems like it should be 0x12 followed by 0x34, right?\n\nBut if I is not\
    \ on my machine and he dumps the result, I get:\n\n34 12\n\nThey're reversed!\
    \ What gives?\n\nThis has something to do with what's called the endianness of\
    \ the architecture. Some write the most significant bytes first, and some the\
    \ least significant bytes first.\n\nThis means that if you write a multibyte number\
    \ out from memory, you can't do it in a portable way⁶.\n\nA similar problem exists\
    \ with floating point. Most systems use the same format for their floating point\
    \ numbers, but some do not. No guarantees!\n\nSo... how can we fix all these problems\
    \ with numbers and structs to get our data written in a portable way?\n\n> ⁵https://en.wikipedia.org/wiki/Endianness\n\
