    # 23.6 Pointer Differences


    As you know from the section on pointer arithmetic, you can subtract one pointer
    from another¹¹⁰ to get the difference between them in count of array elements.


    Now that the type of difference is something that''s up to the implementation,
    so it could vary from system to system.


    To be more portable, you can store the result in a variable of type ptrdiff_t
    defined in <stddef.h>.


    ```

    int cats[100];


    int *f = cats + 20;

    int *g = cats + 60;


    ptrdiff_t d = g - f; // difference is 40


    And you can print by prefixing the format specifier with t:

    printf("%d\n", d); // Print decimal: 40

    printf("%x\n", d); // Print hex: 28

    ```


    # 23.7 Pointers to Functions


    Functions are just collections of machine instructions in memory, so there''s
    no reason we can''t get a pointer to the first instruction of the function.


    And then call it.


    This can be useful for passing a pointer to a function into another function as
    an argument. Then the second one could call whatever passed in.


    The tricky part with these, is that C needs to know the type of the variable that
    is the pointer to the function.


    And it would really like to know all the details.


    Like "this be a pointer to a function that takes two arguments and returns void."


    How do you write that so you can declare a variable?


    Well, it turns out it looks very much like a function prototype, except with some
    extra parentheses.


    ```

    // Declare p to be a pointer to a function.

    // This function returns a float, and takes two ints as arguments.

    ```


    ```

    float (*p)(int, int);

    ```


    Also notice that you don''t have to give the parameters names. But you can if
    you want; they''re ignored.


    ```

    // Declare p to be a pointer to a function.

    // This function returns a float, and takes two ints as arguments.

    ```


    ```

    float (*p)(int a, int b);

    ```


    > ¹⁰Assuming they point to the same array object.'
