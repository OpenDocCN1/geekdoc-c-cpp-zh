  md: "# Chapter 30. Variable-Length Arrays (VLAs)\n\n# 30.7 typedef VLAs\n\nYou can\
    \ typedef a VLA, but the behavior might not be as you expect.\nBasically, typedef\
    \ makes a new type with the values as they existed the moment the typedef was\
    \ executed.\nSo it's not a typedef of a VLA so much as a new fixed size array\
    \ of the dimensions at the time.\n\n```\n#include <stdio.h>\n\nint main(void)\n\
    {\n    int w = 10;\n\n    typedef goat[w];\n\n    // goat is an array of 10 ints\n\
    \    goat x;\n\n    // Init with squares of numbers\n    for (int i = 0; i < w;\
    \ i++)\n        x[i] = i*i;\n\n    // Print them\n    for (int i = 0; i < w; i++)\n\
    \        printf(\"%d\\n\", x[i]);\n\n    // Now let's change w...\n\\    w = 20;\n\
    \n    // But goat is STILL an array of 10 ints, because that was the\n    // value\
    \ of w when the typedef was executed.\n}\n```\n\nSo it acts like an array of fixed\
    \ size.\nBut still can't use an initializer list on it.\n\n# 30.8 Jumping Pitfalls\n\
    \nYou have to watch out when using goto near VLAs because a lot of things aren't\
    \ legal.\nAnd when you're using longjmp() there's a case where you could leak\
    \ memory with VLAs.\nBut both of these we'll cover in their respective chapters.\n\
    \n# 30.9 General Issues\n\nVLAs have been banned from the Linux kernel for a few\
    \ reasons:\n\n+   - Lots of places they were used should just been fixed-size.\n\
    - The code behind VLAs is slower (a degree that most people would notice, but\
    \ makes a difference in an operating system).\n- VLAs are not supported to the\
    \ same degree by all C compilers.\n- Stack size is limited, and VLAs go on the\
    \ stack. If some code accidentally (or maliciously) passes a large value into\
    \ a kernel function that allocates a VLA, _Bad Things™ could happen."
  merge: -1
  img_proc: true
