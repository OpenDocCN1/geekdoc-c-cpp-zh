  md: "# Chapter 34. Long Jumps with setjmp, longjmp\n\n}\n\n```\nint main(void)\n\
    {\n    switch (setjmp(env)) {\n        case 0:\n            printf(\"Calling into\
    \ functions, setjmp returned 0\\n\");\n            depthi();\n            printf(\"\
    Returned from functions\\n\"); // This won't happen\n            break;\n\n  \
    \      case 3490:\n            printf(\"Bailed back to main, setjmp() returned\
    \ 3490\\n\");\n            break;\n    }\n}\n```\n\nWhen run, it outputs:\nCalling\
    \ into functions, setjmp() returned 0\nEntering depth 1\nEntering depth 2\nBailed\
    \ back to main, setjmp() returned 3490\n\nIf you try to match that and output\
    \ it with the code, it's really some *funky* stuff going on.\n of the most notable\
    \ things is that setjmp() returns twice. What the actual frank? What is this sorcery?\n\
    So here is the deal: if setjmp() returns 0, it means you've successfully set the\
    \ \"bookmark\" at that point.\nIf it returns non-zero, it means you've just returned\
    \ to the \"bookmark\" earlier. And the value returned is the one you pass to longjmp().\n\
    This way you can tell the difference between the bookmark and returning to it.\n\
    So the code, calls setjmp() the first time, setjmp() stores the state in the env\
    \ variable and returns 0. Later when we call longjmp() with that same env, it\
    \ restores the state and setjmp() returns the value longjmp() passed.\n\n#  34.2\
    \ Pitfalls\n\nUnder the hood, this is pretty straightforward. Typically the stack\
    \ pointer keeps track of the locations in memory that local variables are stored,\
    \ and the program counter keeps track of the address of the currently-executing\
    \ instruction¹.\n\nIf we want to jump back to an earlier function, it's basically\
    \ a matter of restoring the stack pointer and program counter to the values kept\
    \ in the jmp_buf variable, and making sure the return value is set correctly.\
    \ And then execution will resume.\n\nBut a variety of confus found, making a significant\
    \ number of undefined behavior traps.\n\n#  34.2.1 The Values of Local Variables\n\
    \nIf you want the values of automatic (non-static and non-extern) local variables\
    \ to persist in the function that called setjmp() after longjmp() happens, you\
    \ must declare those variables to be volatile.\n\n> ¹Both \"stack pointer\" and\
    \ \"program counter\" are related to the underlying architecture and C implementation,\
    \ and are not part of the spec."
