  md: "# 8.4 The Arrow Operator\n\nThe arrow operator helps refer to fields in pointers\
    \ to structs.\n\n```\nvoid set_price(struct car *c, float new_price) {\n  // (*c).price\
    \ = new_price; // Works, but non-idiomatic:\n  // /\n  // The line above is 100%\
    \ equivalent to the one below:\n\n  c->price = new_price; // That's the one!\n\
    }\n```\n\nSo when accessing fields, when do we use dot and when do we use arrow?\n\
    \n+   * If you have a struct, use dot ().\n* If you have a pointer to a struct,\
    \ use arrow (-).\n\n# 8.5 Copying and Returning structs\n\nHere's an easy one\
    \ for you!\nJust assign from one to the other!\n\n```\nstruct car a, b;\nb = a;\
    \   // Copy the struct\n```\n\nAnd returning a struct (as opposed to a pointer\
    \ to one) also makes a similar copy to the receiving variable.\nThis is not a\
    \ \"deep copy\"⁴. Fields are copied as-is, including pointers to things.\n\n#\
    \ 8.6 Comparing structs\n\nThere's only one way to think about it: compare each\
    \ field one at a time.\nYou might think you could use memcmp⁵, but that doesn't\
    \ handle the case of the possible padding bytes that might be in there.\nIf you\
    \ clear the struct to zero first with memset()⁶, then it might work, though there\
    \ could be weird elements that might not compare as you expect'.\n\n> ⁴A deep\
    \ copy follows pointer in the struct and copies the data they point to, as well.\
    \ A shallow copy just copies the pointers, not the things they point to. C doesn't\
    \ come with any built-in deep copy functionality.\n⁵https://beej.org/guide/bcgl/html/stringref.html#man-strcmcp\n\
    ⁶https://beej.org/guide/bcgl/html/stringref.html#man-memset\n⁷https://stackoverflow.com/questions/141720/how-do-you-compare-structs-for-equality-in-c"
