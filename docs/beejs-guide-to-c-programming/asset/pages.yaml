  md: "# Chapter 3. Variables and Statements\n\ny += x > 10? 17;\n\nWhat a mess! You'll\
    \ get used to it the more you read it. To help out a bit, I'll rewrite the above\
    \ expression using if statements:\n\n```\n// This expression:\n```\n\n```\ny +=\
    \ x > 10? 17;\n```\n\n```\n// is equivalent to this non-expression:\n```\n\n```\n\
    if (x > 10)\n    y += 17;\nelse\n    y += 37;\n```\n\nCompare those until you\
    \ see each of the components of the ternary operator.\n\nOr, another example is\
    \ that if a number stored in x is odd or even:\n\n```\nprintf(\"The number %d\
    \ is %s.\", x, x % 2 == 0? \"even\": \"odd\");\n```\n\nThe %s format specifier\
    \ in printf prints a string. If the expression x % 2 evaluates to 0, the value\
    \ of the entire ternary expression evaluates to \"even\". Otherwise it evaluates\
    \ to \"odd\".nPretty cool!\n\nIt's important to note that the ternary operator\
    \ isn't control flow like the if statement is. It's just an expression that evaluates\
    \ to a value.\n\n# 3.2.3 Pre-and-Post Increment-and-Decrement\n\nNow, let's mess\
    \ with another thing that you might not seen.\n\nThese are the legendary post-increment\
    \ and post-decrement operators:\n\n```\ni++; // Add one to i (post-increment)\n\
    i--; // Subtract one from i (post-decrement)\n```\n\nVery commonly, these are\
    \ just used as shorter versions of:\n\n```\ni += 1; // Add one to i\ni -= 1; //\
    \ Subtract one from i\n```\n\nbut they're more subtle than that, the clever scoundrels.\n\
    \nLet's take a look at this, pre-increment and pre-decrement:\n\n```\ni; // Add\
    \ one to i (pre-increment)\n--i; // Subtract one from i (pre-decrement)\n```\n\
    \nWith pre-increment and pre-decrement, the value of the variable is incremented\
    \ or decremented before the expression is evaluated. Then the expression is evaluated\
    \ with the new value.\n\nWith post-increment and post-decrement, the value of\
    \ the expression is first computed with the value as-is, and then the value is\
    \ incremented or decremented after the value of the expression has been determined.\n\
    \nYou can actually embed them in expressions, like this:\n\n```\ni = 10;\nj =\
    \ 5 + i++; // Compute 5 + i, _then_increment i\n```\n\n```\nprintf(\"%d, %d\\\
    n\", i, j); // Prints 11, 15\n```"
