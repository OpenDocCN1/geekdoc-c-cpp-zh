  md: '# Chapter 14. Types II: Way More Types!


    Diving in a bit, the number is basically represented as the significand (which
    is the number part—the significant digits themselves, sometimes referred to as
    the mantissa) and the exponent, which is what power to raise the digits to. Recall
    that a negative exponent can make a number smaller.


    Imagine we''re using 10 as a number to raise by an exponent. We could represent
    the numbers using a significand of 12345, and exponents of -3, 4, and 0 to encode
    the following floating point values:


    ```

    12345 × 10⁻³ = 12.345

    12345 × 10⁴ = 123450000

    12345 × 10⁰ = 12345

    ```


    For all those numbers, the significand stays the same. The only difference is
    the exponent.


    On your machine, the base for the exponent is probably 2, not 10, since computers
    like binary. You can check it by printing the FLT_RADIX max.


    So we have a type that''s represented by a number of bytes, encoded in some way.
    Because there are a limited number of bits patterns, a limited number of floating
    point numbers can be represented.


    But more practically, only a certain number of significand digits can be represented
    accurately.


    How can you get more? You can use larger types!


    And we have a couple of them. We know about float already, but for more precision
    we have double. And for more precision, we have long double (unrelated to long
    except by name).


    The spec doesn''t go (on my system) uses how many bytes of storage each type should
    take, but on my system, we can see the relative size increases:


    | Type | sizeof |

    | --- | --- |

    | float | 4 |

    | double | 8 |

    | long double | 16 |


    So each of the types (on my system) uses those additional bytes for more precision.


    But how much precision are we talking, How many decimal digits can be represented
    by the values?


    Well, C provides us with a bunch of macros in <float.h> to help us figure that
    out.


    It gets a little windy if you are using a base-2 (binary) system for storing the
    numbers (which is virtually everyone on the planet, but bear with me while we
    figure it out.


    # 14.4.1 How Decimal Digits?


    The million question is, “How many significant decimal digits can I store in a
    floating point type so that I get the same decimal number when I print it?


    The number of decimal digits you can store in a floating point type and surely
    get the same number back out when you print it is by these macros:


    | Type | Decimal Digits You Can Store | Minimum |

    | --- | --- | --- |

    | float | FLT_DIG | 6 |

    | double | DBL_DIG | 10 |

    | long double | LLD_DIG | 10 |'
