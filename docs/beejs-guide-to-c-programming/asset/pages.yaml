    \ | 1 if this implementation does not support complex types or <complex.h> |\n\
    | _STDC_NO_THREADS_ | 1 if this implementation does not support <threads.h> |\n\
    | _STDC_NO_VLA_ | 1 if this implementation does not support variable-length arrays\
    \ |\n\n# 19.5 Macros with Arguments\n\nMacros are more powerful than simple substitution,\
    \ though. You can set them up to take arguments that are substituted in, as well.\n\
    \nA question often arises for when to use macros versus functions. Short answer:\
    \ use functions. But you’ll see lots of macros in the wild and in the standard\
    \ library. People tend to use them for short, mathy things, and also for features\
    \ that might change from platform to platform. You can define different keywords\
    \ for one or the other.\n\n# 19.5.1 Macros with One Argument\n\nLet’s start with\
    \ a simple one that squares a number:\n\n```\n#include <stdio.h>\n\n#define SQR(x)\
    \ x * x // Not quite right, but bear with me\n\nint main(void)\n{\n    printf(\"\
    %d\\n\", SQR(12)); // 144\n}\n```\n\nWhat’s saying is “everywhere you see SQR\
    \ with some value, replace it with that value times itself”.\nSo line 7 be changed\
    \ to:\n\n```\nprintf(\"%d\\n\", 12 * 12); // 144\n```\n\nWhich C comfortably converts\
    \ to 144.\n\nWe’ve made an elementary error in that, one that we need to avoid.\n\
    \nLet’s check it out. If we wanted to compute SQR(3 + 4)? Well, 3 + 4 = 7, so\
    \ we must want to compute $7^2 = 49$. That’s 49—final answer.\nLet’s drop it in\
    \ our code and see what we get... 19!!\n\n```\nprintf(\"%d\\n\", SQR(3 + 4));\
    \ // 19!!\n```\n\nWhat happened?\nIf we follow the macro expansion, we get\n\n\
    printf(\"%d\\n\", 3 + 4 * 3 + 4); // 19!"
