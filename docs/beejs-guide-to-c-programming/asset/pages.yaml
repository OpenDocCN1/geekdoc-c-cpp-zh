  md: "# Chapter 9. File Input/Output\n\n# 9.3 End of File: EOF\n\nThere is a special\
    \ character defined as a macro: EOF. This is what fgetc will return when the end\
    \ of the file has been reached and you've attempted to read another character.\n\
    \nHow I learned that Fun FactM, now. Turns out EOF is the reason why fgetc() and\
    \ functions like it return an int instead of a char. EOF isn't a character proper,\
    \ and its value falls outside the range of char. Since fgetc() needs to return\
    \ any byte and EOF, it needs to be a wider type that can hold more values, so\
    \ int it is. But unless you're comparing the returned value against EOF, you can\
    \ know, it's a char.\n\nAll right! Back to reality! We can use this to read the\
    \ whole file in a loop.\n\n```\n#include <stdio.h>\n\nint main(void)\n{\n    FILE\
    \ *fp;\n    int c;\n\n    fp = fopen(\"hello.txt\", \"r\");\n\n    while ((c =\
    \ fgetc(fp)) != EOF)\n        printf(\"%c\\n\", c);\n\n    fclose(fp);\n}\n```\n\
    \nIf line 10 is too weird, just be aware EOF is the reason why the innermost-nested\
    \ parents. The first thing we do is assign the result of fgetc() into c, and then\
    \ we compare that against EOF. We've just crammed it into a single line. This\
    \ might look hard to read, but study it—it's idiomatic C.\n\nAnd running this,\
    \ we see:\n\nHello, world!\n\nBut still, we're operating a character at a time,\
    \ and lots of text make more sense at the line level. Let's switch to that.\n\n\
    # 9.3.1 Reading a Line at a Time\n\nSo can we get an entire line at once? fgets()\
    \ to the rescue! For arguments, it takes a pointer to a buffer to hold bytes,\
    \ and a FILE* to read from. It returns NULL on end-of-file or error. fgets() will\
    \ terminate the string when it does.\n\nLet's do a similar loop as before, except\
    \ let's have a multiline file and read it in a line at a time.\n\nHere's a file\
    \ quote.txt:\n\n> A wise man can learn more from a foolish question than a fool\
    \ can learn from a wise answer.\n-- Bruce Lee\n\nAnd here's some code that reads\
    \ a file at a time and prints out a line number before each one:\n#include <stdio.h>\n\
    \n> ^If the buffer's not big enough to read an entire line, it'll just stop reading\
    \ mid-line, and the next call to fgets() will continue reading the rest of the\
    \ line."
