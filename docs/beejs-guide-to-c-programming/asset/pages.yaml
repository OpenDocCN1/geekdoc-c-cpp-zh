  md: "# Chapter 30. Variable-Length Arrays (VLAs)\n\nThere's a bit more to it than.\
    \ You can also let C know that the array is a specific VLA size by passing that\
    \ in first and giving dimension in the parameter list:\n\n```\nint sum(int count,\
