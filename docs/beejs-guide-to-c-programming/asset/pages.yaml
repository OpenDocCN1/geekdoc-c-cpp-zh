  md: "# Chapter 13\n\n# Scope\n\nScope is all about what variables are visible in\
    \ what contexts.\n\n# 13.1 Block Scope\n\nThis is the scope of almost all the\
    \ variables devs define. It includes what other languages might call “function\
    \ scope”, i.e. variables that are declared inside functions.\n\nThe basic rule\
    \ is that if you've declared a variable in a block delimited by squirrelly braces,\
    \ the scope of that variable is that block.\n\nIf there's a block inside a block,\
    \ then variables declared in the inner block are local to that block, and cannot\
    \ be seen in the outer scope.\n\nOnce a variable's scope ends, that variable can\
    \ no longer be referenced, and you can consider its value to go into the great\
    \ bucket¹ in the sky.\n\nAn example with nested scope:\n\n```\n#include <stdio.h>\n\
    \nint main(void)\n{\n    int a = 12;           // Local to outer block, but visible\
    \ in inner block\n\n    if (a == 12) {\n        int b = 99;      // Local to inner\
    \ block, not visible in outer block\n\n        printf(\"%d %d\\n\", a, b); //\
    \ OK: \"12 99\"\n    }\n\n    printf(\"%d\\n\", a);      // OK, we're still in\
    \ a's scope\n    printf(\"%d\\n\", b);      // ILLEGAL, out of b's scope\n}\n\
    ```\n\n> ¹https://en.wikipedia.org/wiki/Bit_bucket"
