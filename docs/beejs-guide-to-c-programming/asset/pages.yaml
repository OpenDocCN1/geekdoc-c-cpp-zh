    # 19.3.3 #else


    But that''s not all we can do! There''s also an #else we can throw in the mix.


    Let''s mod the previous example:


    ```

    #ifdef EXTRA_HAPPY

    printf("I''m extra happy!\n");

    #else

    printf("I''m just regular\n");

    #endif

    ```


    Now if EXTRA_HAPPY is not defined, it''ll hit the #else clause and print:


    I''m just regular


    # 19.3.4 General Conditional: #if, #elif


    This works very much like the #ifdef and #ifnd directives that you can also have
    an #else and the whole thing wraps with #endif.


    The only difference is that the constant expression after the #if must evaluate
    to true (non-zero) for the code in the #if to be compiled. Instead of whether
    or not something is defined, we want an expression that evaluates to true.


    ```

    #include <stdio.h>

    ```


    ```

    #define HAPPY_FACTOR 1

    ```


    ```

    int main(void)

    {


    if HAPPY_FACTOR == 0

    printf("I''m not happy!\n");

    #elif HAPPY_FACTOR == 1

    printf("I''m just regular\n");

    #else

    printf("I''m extra happy!\n");

    #endif


    printf("OK!\n");

    }

    ```


    Again, for the unmatched #if clauses, the compiler won''t even see those lines.
    For the above code, the preprocessor finishes with it, all the compiler sees is:


    ```

    #include <stdio.h>

    ```


    ```

    int main(void)

    ```'
