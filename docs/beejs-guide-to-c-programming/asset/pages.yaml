  md: '# Chapter 29


    # Signal Handling


    Before we start, I''m just going to advise you to generally ignore this entire
    chapter and use your OS’s (very likely) superior signal handling functions. Unix-likes
    have the sigaction() family of functions, and Windows has... whatever it does.


    With that out of the variety, what are signals?


    # 29.1 What Are Signals?


    A signal is raised on a variety of external events. Your program can be configured
    to be interrupted to handle the signal, and optionally, continue where it left
    off once the signal has been handled.


    Think of it like a function that is automatically called when one of these external
    events occurs.


    What are these events? On your system, there are probably a lot of them, but in
    the C spec there are just a few:


    | Signal | Description |

    | SIGABRT | Abnormal termination—what happens when abort() is called. |

    | SIGFPE | Floating point exception. |

    | SIGILL | Illegal instruction. |

    | SIGINT | Interrupt—usually the result of CTRL-C being hit. |

    | SIGSEGV | “Segmentation Violation”: invalid memory access. |

    | SIGTERM | Termination requested. |


    You can set up your program to ignore, handle, or allow the default action for
    each of these by using the signal() function.


    # 29.2 Handling Signals with signal()


    The signal() takes two parameters: the signal in question, and an action to take
    when that signal is raised.


    The action can be one of three:


    +   * A pointer to a handler function.


    > ¹Apparently it doesn''t do Unix-style signals at all deep down, and they''re
    simulated for console apps.'
