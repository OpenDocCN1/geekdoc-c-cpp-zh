    # 31.7 Restarting Interrupted System Calls


    This is outside the spec, but commonly in Unix-like systems.


    Certain long-lived systems call return an error if they''re interrupted by a signal,
    and errno will be set to EINTR to indicate the syscall was fine; it just interrupted.


    In those cases, it''s really common for the program to restart the call and try
    it again.


    ```

    retry:

    byte_count = read(0, buf, sizeof(buf) - 1); // Unix read() syscall

    ```


    ```

    if (byte_count == -1) { // An error occurred...

    if (errno == EINTR) {

    // But it was just interrupted

    printf("Restarting...\n");

