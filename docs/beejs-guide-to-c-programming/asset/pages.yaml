- pgno: 103
  md: 'Chapter 14. Types II: Way More Types!


    | Type | Suffix |

    |---|---|

    | unsigned int | U |

    | unsigned long int | UL |

    | unsigned long int | ULL |


    I mentioned in the table that “no suffix” means int... but it’s actually more
    complex than that.


    So what happens when you have an unsuffixed number like:


    ```

    int x = 1234;

    ```


    What type is it?


    What C will generally do is choose the smallest type from int that can hold the
    value.


    But specifically, that depends on the number’s base (decimal, hex, or octal).


    The spec has a great table indicating which type gets used for what unsuffixed
    value. In fact, I’m just going

    to copy it whole right here.


    C11 §6.4.4.1 reads, “The type of an integer constant is the first of the first
    of the corresponding list

    in which its value can be represented.”


    And then goes on to show this table:


    | Suffix | Decimal Constant | Octal or Hexadecimal Constant |

    |---|---|---|

    | none | int long int | int unsigned int long int unsigned long int unsigned long
    int unsigned long long int |

    | u or U | unsigned int unsigned long int unsigned long long int | unsigned int
    unsigned long int unsigned long int unsigned long long int |

    | l or L | long int long int | long int unsigned long int long int unsigned long
    long int |

    | both u or U and l or L | unsigned long int unsigned long long int | unsigned
    long int unsigned long long int |

    | ll or LL | long int | long int long int unsigned long long int |

    | both u or U and ll or LL | unsigned long int unsigned long long int | unsigned
    long int unsigned long long int |


    What’s saying that is, for example, if you specify a number like 123456789U, first
    C will see if it is

    unsigned int. If it doesn’t fit it, it’ll try unsigned long int. And then unsigned
    long long int.

    It’ll use the smallest type that can hold the number.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# 14.5.3 Floating Point Constants


    You''d think a floating point constant like 1.23 would have a default type of
    float, right? Surprise Turns unsuffixed floating point numbers are type double!
    Happy belated birthday!


    You can force it to be of type float by appending an f (or F—it''s case-insensitive).
    You can force it to be of type long double by appending l (or L).


    | Type | Suffix |

    |---|---|

    | float | F |

    | double | None |

    | long double | L |


    For example:


    ```

    float x = 3.14f;

    double x = 3.14;

    long double x = 3.14L;

    ```


    This time though, we''ve been doing this, right?

    float x = 3.14;


    Isn''t left a float and a double right? Yes! But C''s pretty good with automatic
    numeric conversions, so it''s more common to have an unsuffixed floating point
    constant than not. Or on that later.


    # 14.5.3.1 Scientific Notation


    Remember earlier when we talked how a floating point number can be represented
    by a significand, base, and exponent?


    Well, there''s a common way of writing such a number, here shown followed by it''s
    more recognizable equivalent is what you get when you actually run the math:


    1.2345 × 10³ = 1234.5


    Writing numbers in the form s × b¹⁰ is called scientific notation¹⁴. In C, these
    are using "E notation", so these are equivalent::


    | Scientific Notation | E notation |

    |---|---|

    | 1.2345 × 10⁻³ | 1.2345e-3 |

    | 1.2345 × 10⁸ | 1.23450000e+8 |


    You can print a number in this notation with %:

    printf("%s\n", 1.234560e+05);

    A couple of little fun facts about scientific notation:


    +   - You don''t have to write them with a single leading digit before the decimal
    point. Any number of numbers can go in.


    ```

    double x = 123.456e3; // 123456

    ```


    However, when you print it, it will change the exponent so there is only one digit
    in front of the decimal point.


    > ¹⁴https://en.wikipedia.org/wiki/Scientific_notation'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'The plus can be left off the exponent, it''s default, but this is uncommon
    in practice from what I''ve seen.


    1.2345e10 == 1.2345e+10


    You can apply the F or L suffixes to E-notation constants:


    1.2345e10

    1.2345e10L


    # 14.5.3.2 Hexadecimal Floating Point Constants


    But wait, there''s more floating to be done!


    Turns out there are hexadecimal floating point constants, as well!


    These work similar to decimal floating point numbers, but they begin with a 0x
    just like integer numbers.


    The catch is that you must specify an exponent, and this exponent produces a power
    of 2. That is: 2^x.


    And then you use a p instead of an e when writing the number:


    So 0xa.1p3 is 10.0625 × 2^3 = 80.5.


    When using floating point constants, We can print hex scientific notation with
    %:


    double x = 0xa.1p3;


    ```

    printf("%a\n", x);   // 0x1.42p+6

    printf("%f\n", x);   // 80.500000

    ```'
