  md: "# Chapter 11. Pointers: Arithmetic\n\nit's also a dereference, as well.\n\n\
    And if you think about it, these rules make sense. All those operations rely on\
    \ knowing the size of the data pointed to, and with void*, we don't know the size\
    \ of the data being pointed to—it could be anything!\n\nBut wait—if you can't\
    \ dereference a void* what good can it do for you?\n\nLike memcpy(), it helps\
    \ you write generic functions that can handle multiple types of data. But the\
    \ secret is that, deep down, you convert the void* to another type before you\
    \ use it!\n\nAssignment is also easy: you can just assign it to a variable of\
    \ the desired type.\n\n```\nchar a = 'X'; // A single char\nvoid *p = &a; // p\
    \ points to the 'X'\nchar *q = p; // q also points to the 'X'\n```\n\n```\nprintf(\"\
    %s\\n\", p); // ERROR-cannot dereference void*\\nprintf(\"%s\\n\", q); // Prints\
    \ \"X\"\n```\n\nLet's write our own memcpy() to try this out. We can copy bytes\
    \ (chars), and we know the number of bytes because it's passed in.\n\n```\nvoid\
    \ *my_memcpy(void *dest, void *src, int byte_count) {\nchar *s = src, *d = dest;\n\
    \n// Now we have char*s, we can dereference and copy them\nwhile (byte_count--)\
    \ {\n    *d++ = *s++;\n}\n```\n\n// Most of these functions return the destination,\
    \ just in case\n// that's useful to the caller.\n\nRight there at the beginning,\
    \ we copy the void* into char*s so we can use them as char*s. It's easy as that.\n\
    \nThen some in a while loop, we decrement byte_count until it becomes (0). Remember\
    \ that with post-increment, the value of the expression is computed (for while\
    \ we use) and then the variable is decremented.\n\nAnd in some copy, we assign\
    \ *d = *s; to copy the byte, but we do it with post-increment so both d and s\
    \ move to the next byte after assignment is made.\n\nLastly, most memory and string\
    \ functions return a copy of a pointer to the destination just in case the caller\
    \ wants to use it.\n\nNow that we've done that, I just want to point out that\
    \ we can use this technique to iterate over the bytes of any object in C, floats,\
    \ structs, or anything!\n\nLet's run one more real-world example with the built-in\
    \ qsort() routine that can sort anything thanks to the magic of void*.\n\n(In\
    \ the following example, you can ignore the word count, which we haven't covered\
    \ yet.)"
