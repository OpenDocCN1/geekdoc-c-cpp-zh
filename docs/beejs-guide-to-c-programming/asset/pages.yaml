  md: '# Chapter 19


    # The C Preprocessor


    Before your program gets compiled, it actually runs through a phase called preprocessing.
    It''s almost like there''s a language on top of the C language that runs first.
    And it outputs the C code, which then gets compiled.


    We''ve already seen this to an extent with #include! That''s the C Preprocessor!
    Where it sees directive, it includes the named file right there, just as if you
    typed it in there. And the compiler builds the whole thing.


    But it turns out it''s a lot more powerful than just able to include things. You
    can define macros that are substituted... and even macros that make arguments!


    # 19.1 #include


    Let''s start with what we''ve already seen a bunch. This is, of course, a way
    to include other sources in your source. Very commonly used header files.


    While the spec allows for all kinds of behavior with #include, we''re going to
    take a more pragmatic approach and talk about the way it works on every system
    I''ve ever seen.


    We can split header files into two categories: system and local. Things that are
    built-in, stdio.h, stdlib.h, math.h, and so on, you can include with angle brackets:


    ```

    #include <stdio.h>

    #include <stdlib.h>

    ```


    Which, of course, implies that there must be a way to include local files from
    the current directory. And this is: with double quotes:


    ```

    #include "header.h"

    ```


    Or you can very probably include in relative directories using forward slashes,
    and like this:


    ```

    #include "mydir/header.h"

    #include "../someheader.py"

    ```


    Don''t use a backslash (\) for path separators in your #include! It''s undefined
    behavior! Use forward slash (/) only, even on Windows.


    In summary, use angle brackets (< >) for the system includes, and use double quotes
    (") for your personal includes.'
  merge: -1
  img_proc: true
- pgno: 136
  md: "# 19.2 Simple Macros\n\nA macro is an identifier that expanded to another piece\
    \ of code before the compiler even sees it. Think of it like a placeholder—when\
    \ the preprocessor sees one of these identifiers, it replaces it with another\
    \ value that you've defined.\n\nDo this with #define (often read as \"pound define\"\
    ). Here's an example:\n\n```\n#include <stdio.h>\n\n#define HELLO \"Hello, world\"\
    \n#define PI 3.14159\n\nint main(void)\n{\n    printf(\"%s, %f\\n\", HELLO, PI);\n\
    }\n```\n\nOn lines 3 and 4 we defined a macros. Wherever these appear elsewhere\
    \ in the code (line 8), they'll be substituted with the defined values.\n\nFrom\
    \ the compiler's perspective, it's exactly as if we'd written this, instead:\n\
    \n```\n#include <stdio.h>\n\nint main(void)\n{\n    printf(\"%s, %f\\n\", \"Hello,\
    \ world\", 3.14159);\n}\n```\n\nSee HELLO was replaced with \"Hello, world\" and\
    \ PI was replaced with 3.14159? From the compiler's perspective, it's just like\
    \ those values had appeared right there in the code. If the resulting C code is\
    \ invalid, the compiler will puke.\n\nNote that the macros don't have a specific\
    \ type, per se. Really all that happens is they get replaced wholesale with whatever\
    \ they're #defined as.\n\nYou can also define a macro with no value:\n\n```\n\
    #define EXTRA_HAPPY\n```\n\nin that case, the macro exists and is defined, but\
    \ is defined to nothing. So ayrıca it occurs in the text will be replaced with\
    \ nothing. We'll see some use for this later.\n\nIt's conventional to write macro\
    \ names in ALL_CAPS even though that's not technically required.\n\nOverall, this\
    \ gives you a way to define constant values that are effectively global and can\
    \ be used any place. Even in places where a constant variable won't work, e.g.\
    \ in switch cases and fixed array lengths.\n\nThat said, the debate ranges online\
    \ whether a typed const variable is better than #define macro in the general case.\n\
    \nIt can also be used to replace or modify keywords, a concept completely foreign\
    \ to const, though this practice should be used sparingly.\n\n# 19.3 Conditional\
    \ Compilation\n\nIt's possible to get the preprocessor to decide whether or not\
    \ present certain blocks of code to the compiler, or just remove them entirely\
    \ before compilation.\n\nWe do that by basically wrapping the code in conditional\
    \ blocks, similar to if-else statements."
  merge: -1
  img_proc: true
- pgno: 137
  md: "# 19.3.1 Defined, #ifdef and #endif\n\nFirst of all, let's try to compile code\
    \ depending on whether or not a macro is even defined.\n\n```\n#include <stdio.h>\n\
    ```\n\n```\n#define EXTRA_HAPPY\n\nint main(void)\n{\n    #ifdef EXTRA_HAPPY\n\
    \        printf(\"Im extra happy!\\n\");\n    #endif\n\n    printf(\"OK!\\n\"\
    );\n}\n```\n\nIn example, we define EXTRA_HAPPY (to nothing, but it is defined),\
    \ then on line 8 we check to if it is defined with an #ifdef directive. the subsequent\
    \ code will be included until the #endif.\n\nBecause it is defined, the code will\
    \ be included for compilation and the output will be:\n\nI'm extra happy!\nOK!\n\
    \nIf we were to comment out the #define, like so:\n\n```\n//define EXTRA_HAPPY\n\
    ```\n\nthen it wouldn't be defined, the code wouldn't be included in compilation.\
    \ And the output would just be:\nOK!\n\nIt's important to remember that these\
    \ decisions happen at compile time! The code actually gets compiled or removing\
    \ depending on the condition. This is in contrast to a standard if statement that\
    \ gets evaluated while the program is running.\n\n# 19.3.2 Not Defined, #ifdef\n\
    \nThere's also the negative sense of \"if defined\": \"if not defined\", or #ifdef.\
    \ We could change the previous example to output different things based on whether\
    \ or not something was defined:\n\n```\n#ifdef EXTRA_HAPPY\n    printf(\"I'm extra\
    \ happy!\\n\");\n#endif\n```\n\n```\n#ifdef EXTRA_HAPPY\n    printf(\"I'm just\
    \ regular\\n\");\n#endif\n```\n\nWe'll see a cleaner way to do that in the next\
    \ section.\n\nTying it all back to header files, we've seen how we can use header\
    \ files to only be included one time by wrapping them in preprocessor directives\
    \ like this:\n\n```\n#ifndef MYHEADER_H // First line of myheader.h\n#define MYHEADER_H\n\
    ```"
