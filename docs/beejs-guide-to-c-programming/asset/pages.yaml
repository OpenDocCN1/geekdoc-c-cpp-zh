  md: "# Chapter 16. Types IV: Qualifiers and Specifiers\n\n```\n{\n  int a; // auto\
    \ is the default...\n  auto int a; // So this is redundant\n}\n```\n\nThe auto\
    \ keyword indicates that this object has automatic storage duration. That is,\
    \ it exists in the scope in which it is defined, and is automatically deleted\
    \ when the scope is exited.\n\nOne gotcha with automatic variables is their value\
    \ is indeterminate until you explicitly initialize them. We say they're full of\
    \ \"random\" or \"garbage\" data, though neither of those really makes me happy.\
    \ In any case, you won't know what's in it unless you initialize it.\n\nAlways\
    \ initialize all automatic variables before use!\n\n# 16.2.2 static\n\nThis keyword\
    \ has two meanings, depending on if the variable is file scope or block scope.\n\
    \nLet's start with block scope.\n\n# 16.2.1 static in Block Scope\n\nThat is,\
    \ its value will persist between calls.\n\nstatic block scope with an initializer\
    \ will only be initialized one time on program startup, not each time the function\
    \ is called.\n\nLet's do an example:\n\n```\n#include <stdio.h>\n{\n  static int\
    \ counter = 1; // This is initialized one time\n\n  printf(\"This has been called\
    \ %d time(s)\\n\", counter);\n\n  counter++;\n}\n\nint main(void)\n{\n  counter();\
    \ // \"This has been called 1 time(s)\"\n  counter(); // \"This has been called\
    \ 2 time(s)\"\n  counter(); // \"This has been called 3 time(s)\"\n  counter();\
    \ // \"This has been called 4 time(s)\"\n}\n```\n\nSee the value of counter persists\
    \ between calls?\n\nOne thing to note is that static block variables are initialized\
    \ to 0 by default.\n\n```\nstatic int foo; // Default starting value is '0'\n\
    static int foo = 0; // So the '0' assignment is redundant\n```\n\nFinally, be\
    \ advised that if you're writing multithreaded programs, you have to be sure you\
    \ don't let multiple threads trample the same variable."
