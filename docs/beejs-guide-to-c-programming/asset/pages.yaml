    }\n```\n\nFor me, this outputs:\n\n+   0\n4\n8\n12\n\nindicating that we're using\
    \ 4 bytes for each of the fields. It's a little weird, because char is only 1\
    \ byte, right? The compiler is putting 3 padding bytes after char so that all\
    \ the fields are 4 bytes long. Presumably this will run on my CPU.\n\n# 20.7 Fake\
    \ OOP\n\nThere's a slightly obvious thing that's sort of OOP-like that you can\
    \ do with structs.\n\nSince the pointer to struct is the same as a pointer to\
    \ the first element of the struct, you can freely cast a pointer to the struct\
    \ to a pointer to the first element.\n\nWhat this means is we can set up a situation\
    \ like this:\n\n```\nstruct parent {\nint a, b;\n};\n\nstruct child {\nstruct\
    \ parent super; // MUST be first\nint c, d;\n}\n```\n\nThen we are able to pass\
    \ a pointer to a struct child to a function that expects either that or a pointer\
    \ to a struct parent!\n\nBecause parent super is the first item in the struct\
    \ child, a pointer to any struct child is the same as a pointer to that super\
    \ field.\n\nLet's set up an example here. We'll make structs as above, but then\
    \ we'll pass a pointer to a struct child to a function that needs a pointer to\
    \ a struct parent... and it'll still work.\n\n> super isn't a keyword, incidentally.\
    \ I'm just stealing some OOP terminology."
