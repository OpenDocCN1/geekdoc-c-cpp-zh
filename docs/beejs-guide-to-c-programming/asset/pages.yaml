  md: "# Chapter 7. Strings\n\n47\n\n+   - A pointer to the first character in the\
    \ string.\n- A zero-valued byte (NUL character) somewhere in memory after the\
    \ pointer that indicates the end of the string.\n\nA NUL character can be written\
    \ in C as \\0, though you don't often have to do this.\n\nWhen you include a string\
    \ in double quotes like this, the NUL character is automatically, implicitly included.\n\
    \n```\nchar *s = \"Hello\"; // Actually \"Hello\\0\" behind the scenes\nSo with\
    \ this in mind, let's write our own strlen() function that counts characters in\
    \ a string until it finds a NUL.\nThe procedure is to look down the string for\
    \ a single NUL character, counting as we:\n\nint my_strlen(char *s)\n{\n    int\
    \ count = 0;\n\n    while (s[count] != '\\0') // Single quotes for single char\n\
    \        count++;\n\n    return count;\n}\n```\n\n# 7.7 Copying a String\n\nYou\
    \ can't copy a string through the assignment operator (=). All that does make\
    \ is a copy of the pointer to the first character... so you end up with two pointers\
    \ to the same string:\n\n```\n#include <stdio.h>\n\nint main(void)\n{\n    char\
    \ s[] = \"Hello, world!\";\n    char *t;\n\n    // This makes a copy of the pointer,\
    \ not a copy of the string!\n    t = s;\n\n    // We modify t\n    t[0] = 'z';\n\
    \n    // But printing s shows the modification!\n    // Because t and s point\
    \ to the same string!\n    printf(\"%s\\n\", s); // \"zello, world\"\n}\n```\n\
    \nIf you want to make a copy of a string, you have to copy it byte at a time—but\
    \ this is easier using strcpy().\n\n> ³This is different than the NULL pointer,\
    \ and I'll abbreviate NUL when talking about the character versus NULL.\n\n> ⁴We'll\
    \ learn a new way to do it with pointer arithmetic.\n\n> ⁵There's a safer function\
    \ strcpy() that you should probably use instead, but we'll get to that later."
