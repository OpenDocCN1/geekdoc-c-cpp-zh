  md: "You can give them a tag name so you can refer to the type later and declare\
    \ variables of that type.\n\nNow, since enums are integer types, why not just\
    \ use int?\n\nIn C, the best reason for this is code clarity-it's a nice, typed\
    \ to describe your thinking in code. C (unlike C++) doesn't actually enforce any\
    \ values in range for a particular enum.\n\nLet's do an example where we declare\
    \ a r of type enum resource that can hold those values:\n\n```\n// Named enum,\
    \ type is \"enum resource\"\n\nenum resource {\n  SHEEP,\n  WHEAT,\n  WOOD,\n\
    \  BRICK,\n  ORE\n};\n```\n\n// Declare a variable \"r\" of type \"enum resource\"\
    \n\n```\nenum resource r = BRICK;\n\nif (r == BRICK) {\n  printf(\"I'll trade\
    \ you a brick for two sheep.\\n\")\n}\n```\n\nYou can also typedef these, of course,\
    \ though I personally don't like to.\n\n```\ntypedef enum {\n  SHEEP,\n  WHEAT,\n\
    \  WOOD,\n  BRICK,\n  ORE\n} RESOURCE;\n```\n\nRESOURCE r = BRICK;\n\nAnother\
    \ shortcut that's legal but rare to declare variables when you declare the enum:\n\
    \n// Declare an enum and some initialized variables of that type:\n\n```\nenum\
    \ {\n  SHEEP,\n  WHEAT,\n  WOOD,\n  BRICK,\n  ORE\n} r = BRICK, s = WOOD;\n```\n\
    \nYou can also give the enum name so you can use it later, which is probably what\
    \ you want to do in most cases.\n\n// Declare an enum and some initialized variables\
    \ of that type:\n\n```\nenum resource {\n// <-- type is now \"enum resource\"\n\
    \  SHEEP,\n  WHEAT,\n```"
