    \ We can iterate over elements of an array this way using an array:\n\n```\n```c\n\
    int a[5] = {11, 22, 33, 44, 55};\n\nint *p = &a[0]; // Or \"int *p = a;\" works\
    \ just well\n\nfor (int i = 0; i < 5; i++) {\n    printf(\"%d\\n\", *(p + i));\
    \ // Same as p[i]!\n}\n```\n```\n\nAnd that works as if we use array notation!\
    \ Oooo! Getting closer to that array/pointer equivalence thing! More on this in\
    \ a later chapter.\n\nBut what's actually happening? How does it work?\n\nRemember\
    \ from early on that memory is like a big array, where a byte is stored at each\
    \ array index?\nAnd the array index into memory has a few names:\n\n+   * Index\
    \ into memory\n* Location\n* Address\n* Pointer!\n\nSo a point is an index into\
    \ memory, somewhere.\n\nFor a random example, say that a 3490 was stored at address\
    \ (\"index\") 23,237,489,202. If we have an int pointer to 3490, that value of\
    \ pointer is 23,237,489,202... because the pointer is the memory address. Different\
    \ names for the same thing.\n\nAnd now let's have another number, 4096, stored\
    \ at address 23,237,489,210 (8 higher than the 3490 because each int in this example\
    \ is 8 bytes long).\n\nIf we add 1 to that pointer, it actually jumps sizeof(int)\
    \ bytes to the next int. It knows to jump that far ahead because it's an int pointer.\
    \ If it were a float pointer, it'd jump sizeof(float) bytes ahead to get the next\
    \ float!\n\nSo you can look at the next int, adding 1 to the pointer, the one\
    \ after by adding 2 to the pointer, and so on.\n\n# 11.1.2 Changing Pointers\n\
    \nWe saw how we could add an integer to a pointer in the previous section. This\
