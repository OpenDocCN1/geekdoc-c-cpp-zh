    3 3 3 3 3 3 3 3 3 3 3 3 3\n```\n\nbut that's crazy. Luckily, we can set \theta\
    \ to indicate that the previous group size repeats:\n\n```\n3 0\n```\n\nWhich\
    \ means to repeat every 3. That would handle $100, $1,000, $10,000, $10,000,000,\
    \ $100,000,000,000, and so on.\n\nYou can legitimately go crazy with these to\
    \ indicate some weird groupings.\n\nFor example:\n\n```\n4 3 2 1 0\n```\n\nwould\
