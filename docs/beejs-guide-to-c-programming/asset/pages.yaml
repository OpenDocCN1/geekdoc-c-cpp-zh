  md: '# Chapter 5. Pointers—Cower In Fear!


    Ok! There are a couple things to see here... not the least of which is that the
    increment() function takes an int as argument. We pass it an int in the call by
    changing the int variable i to an int * using the address-of operator. Remember,
    a pointer holds an address, so we make pointers to variables by incrementing them
    through the address-of operator.


    The increment() function gets a copy of the pointer. Both the original pointer
    j (in main()) and the copy of that pointer p (the parameter in increment()) point
    to the same address, namely the one holding the value i. (Again, like two pieces
    of paper with the same address written on them). Dereferencing either allows you
    to modify the original variable i! The function can modify a variable in another
    scope!

    Rock!


    The above example is more concisely written in the call by using address-of in
    the argument list:


    ```

    printf("is %d\n"

    ```


    Pointer enthusiasts will recall early on in the guide, we used a pointer to read
    from the keyboard, scanf()..., and although you might not have recognized it at
    the time, we used the address-of to pass a pointer to a value to scanf(). We do
    this because scanf() reads from the keyboard (typically) and stores the result
    in a variable. The only way to change that variable in the calling function''s
    scope is if we pass a pointer to:


    See, scanf() dereferences the pointer we pass to it in order to modify the variable
    it points to. And now you know why to that pesky ampersand in there!


    # 5.5 The Null Pointer


    Any variable of any type can be set to a special value called NULL. This indicates
    that this pointer doesn''t point to anything.


    ```

    int *p;

    ```


    p = NULL;

    Since it doesn''t point to a value, dereferencing it is undefined behavior, and
    probably will result in a crash:


    ```

    int *p = NULL;

    ```


    *p = 12; // CRASH OR SOMETHING PROBABLY BAD. BEST AVOIDED.

    Despite being the billion dollar mistake by your creator⁶ the NULL pointer is
    a good sentinel value⁷ and general indicator that a pointer hasn''t been initialized.


    (Of course, like other variables, the pointer to garbage unless you explicitly
    assign it to point to an address or NULL.)


    > ⁹https://en.wikipedia.org/wiki/Null_pointer#History

    ⁷https://en.wikipedia.org/wiki/Sentinel_value'
