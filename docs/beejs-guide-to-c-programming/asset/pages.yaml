  md: '# Chapter 9


    # File Input/Output


    We''ve already seen a couple examples of I/O with scanf() and printf() for doing
    I/O at the console (screen/keyboard).


    But we''ll push those concepts a little further this chapter.


    # 9.1 The FILE* Data Type


    When we do any kind of I/O in C, we do so through a piece of data that you get
    in the form of a FILE type. This FILE holds all the information needed to communicate
    with the I/O subsystem about which file we have open, where you are in the file,
    and so on.


    The spec refers to these as streams, i stream of data from a file or any source.
    I''m going to use "files" and "streams" interchangeably, but really you should
    think of a "file" as a special case of a "stream". There are other ways to stream
    data into a program than just reading from a file.


    We''ll see in how to go from a filename to getting an open FILE for it, but first
    I want to mention three streams that are already open for you and ready for use.


    | FILE name | Description |

    | --- | --- |

    | stdin | Standard Input, generally the keyboard by default |

    | stdout | Standard Output, generally the screen by default |

    | stderr | Standard Error, generally the screen by default, as |


    We''ve actually using these implicitly lately, it turns out. For example, these
    two calls are the:


    ```

    printf("Hello, world\n");

    printf(stdout,"Hello, world\n");   // printf to a file

    ```


    But more on that.


    Also you''ll notice that both stdout and stderr go to the screen. While this seems
    at first either like an oversight or redundancy, it actually isn''t. Typical operating
    systems allow you to redirect the output of either into different files, and it
    can be convenient to be able to separate error messages from non-error output.


    In a POSIX shell (like sh, kash, bash, etc.) on a Unix-like system, we could run
    a program and send just the non-error (stdout) output to one file, and all the
    error (stderr) output to another file.


    ```

    /foo > output.txt 2> errors.txt # This command is Unix-specific

    ```'
