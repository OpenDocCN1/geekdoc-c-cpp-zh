  md: "# # Chapter 15\n\n# # Types III: Conversions\n\nIn this chapter, we want to\
    \ talk all about converting from one type to another. C has a variety of ways\
    \ of doing this, and some might be a little different that you're used to in other\
    \ languages.\n\nBefore we talk about how conversions happen, let's talk about\
    \ how they work when they do happen.\n\n# ## 15.1 String Conversions\n\nUnlike\
    \ many languages, C doesn't string-to-number (and vice-versa) conversions in quite\
    \ as streamlined a manner as it does numeric conversions.\n\nFor these, we'll\
    \ have to call functions to do the dirty work.\n\n# ### 15.1.1 Numeric Value to\
    \ String\n\nWhen we want to convert a number to a string, we can use sprintf()\
    \ (pronounced SPRINT-f) or snprintf() (s-n-print-f*)\n\nThese basically work like\
    \ printf(), except they output to a string instead, and you can print that string\
    \ later, or whatever.\n\nFor example, turning part of the value π into a string:\n\
    \n```\n#include <stdio.h>\n\nint main(void)\n{\n    char s[10];\n    float f =\
    \ 3.14159;\n\n    // Convert \"f\" to string, storing in \"s\", writing at most\
    \ 10 characters\n    // including the NULL terminator\n\n    snprintf(s, 10, \"\
    %f\", f);\n\n    printf(\"String value: %s\\n\", s); // String value: 3.141590\n\
    }\n```\n\nSo you can use %d or %u like you're used to integers.\n\n> *They're\
    \ the same except snprintf() allows you to specify a maximum number of bytes to\
    \ output, preventing the overflowing of your string. So it's safer."
