  md: "# Chapter 39. Multithreading\n\nThe destructor is type tss_dtor_which is a\
    \ pointer to a function that returns void and takes a void as an argument (the\
    \ \"void*) points to the data stored in the variable). In other words, it's a\
    \ void (*)void*) that clears it up. I admit it probably doesn't. Check out the\
    \ example, below:\n\nGenerally, thread_local is probably by your go-to, but if\
    \ you use the destructor, then you can make use of that.\n\nThe usage is a bit\
    \ weird that we initialize it with type tss_t to be relative to the value on a\
    \ per thread basis. We initialize it with tss_create(). Eventually we get rid\
    \ of it with tss_delete(). Note that calling tss_delete() doesn't run the destructors-it's\
    \ thrd_exit(or returning from the run function) that does. tss_delete() releases\
    \ any memory allocated by tss_create().\n\nIn the middle threads we call tss_set()\
    \ and tss_get() to set and get the value.\n\nIn the following code, we set up\
    \ the TSS variable before creating, then clean up after the threads.\n\nIn the\
    \ run() function, the thread malloc() some space for a string and then store that\
    \ pointer in the TSS variable. When the thread exits, the destructor function\
    \ (free in this case) is called for all the threads.\n\n```\n#include <stdio.h>\n\
    #include <stdlib.h>\n#include <threads.h>\n\ntss_t str;\n\nvoid some_function(void)\n\
    {\n    // Retrieve the per-thread value of this string\n    char *tss_string =\
    \ tss_get(str);\n\n    // And print it\n    printf(\"TSS string: %s\\n\", tss_string);\n\
    }\n\nint run(int *arg)\n{\n    int serial = *(int*)arg; // Get this thread's serial\
    \ number\n    free(arg);\n\n    // malloc() space to hold the data for this thread\n\
    \    char *s = malloc(64);\n    printf(s, \"thread %d!:\\n\", serial); // Happy\
    \ little string\n\n    // Set this TSS variable to point at the string\n    tss_set(str,\
    \ s);\n\n    // Call a function that will get the variable\n    some_function();\n\
    \n    return 0; // Equivalent to thrd_exit(0)\n}\n\n#define THREAD_COUNT 15\n\n\
    int main(void)\n{}\n```"
