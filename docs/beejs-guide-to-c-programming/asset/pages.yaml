    # 27.7.2 Wide Characters


    If you''re not a multibyte character, then you''re a wide character.


    A wide character is a single value that can uniquely represent any character in
    the current locale. It''s analogous to Unicode code points. But it might not.
    Or it might be.


    Basically, multibyte characters are arrays of bytes, wide character strings are
    arrays of characters. So you can start thinking on a character-by-character basis
    rather than a byte-by-basis (the latter of which gets messy when characters start
    taking up varying numbers of bytes).


    Wide characters can be represented by a number of types, but the standout is wchar_t.
    It''s the main one. It''s like char, except wide.


    You might be wondering if it''s Unicode or not, and how does allow you so much
    flexibility in writing code? wchar_t opens some of doors, as there is a rich set
    of functions you can use with wchar_t (strings like getting the length, etc.)
    without caring the encoding.


    # 27.8 Using Wide Characters and wchar_t


    Time for a new turn: wchar_t is this main wide character type. Remember how a
    char is only one byte? And byte''s not enough to represent all characters, potentially?
    Well, this one is.


    To use wchar_t, include <wchar.h>.


    How many bytes is it? It''s not totally clear. It could be 16 bytes. It could
    be 32 bytes.


    But wait, you''re saying—if it''s only 16 bytes, it''s not enough to hold all
    the Unicode code points, is it? You right—it''s not. The spec doesn''t require
    it to. It just has to be able to represent all the characters in the current locale.


    This can cause grief with Unicode on platforms with 16-bit wchar_ts (—Windows).
    But that''s out of scope for this guide.


    You can declare a string or character of this type with the l prefix'
