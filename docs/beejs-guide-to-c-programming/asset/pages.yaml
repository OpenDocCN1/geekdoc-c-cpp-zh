  md: '# # Chapter 28


    # # Exiting a Program


    Turns out there are a lot of ways to do this, and even ways to set up "hooks"
    so that a function runs when a program exits.


    In this chapter we''ll dive in and check them out.


    We already covered the meaning of the exit status code in the Exit Status section,
    jump back there and review if you have to.


    All the functions in this section are in <stdlib.h>.


    # ## 28.1 Normal Exits


    We''ll start with the regular ways to exit a program, and then jump to some of
    the rarer, more esoteric ones.


    When you exit a program normally, all open I/O streams are flushed and temporary
    files removed. Basically it''s a nice exit where everything cleaned up and handled.
    It''s what you want to do almost all the time you have reasons to do otherwise.


    # ### 28.1.1 Returning From main()


    If you''ve noticed, normally, all return has a type of int... and you''ve lately,
    if ever, returning anything from main() at all.


    This is for main() only (and I can''t stress this special case only applies to
    main() and no other functions) have an implicit return  if you fall off the end.


    You can explicitly return from main() any time you want, and some programmers
    feel it''s more Right to always have a return at the end of main(). But if you
    leave it, C will put one for you.


    So... here are the rules for main():


    +   * You can exit a status from main() with a return statement. main() is the
    only function with this special behavior. Using return in any other function just
    returns from function to the caller.

    * If you don''t explicitly return and just fall off the end of main(), it''s just
    as if you''d returned or EXIT_SUCCESS.


    # ### 28.1.2 exit()


    This one has also made an appearance a few times. If you call exit() from anywhere
    in your program, will exit at that point.


    The argument you pass to exit() is the exit status.'
