    Because the threads synchronize across y, all writes in thread 1 that happened
    before the write to y are visible in thread 2 after the write from y (the while
    loop).


    It''s important to note a couple of things:


    +   1. Nothing sleeps. The synchronization is not a blocking operation. Both threads
    are running full bore until they exit. Even the one in the spin loop isn''t blocking
    anyone from running.

    2. The synchronization happens when one thread reads an atomic variable another
    thread writes. When thread 2 reads, all previous memory writes in thread 1 (namely
    setting x) will be visible in thread 2.

    3. Notice that x isn''t atomic. That''s BECAUSE we''re not synchronizing over
    x, and the synchronization over y when we write in thread 1 means that all previous
    writes—including x—in thread 1 will become visible to other threads... if those
    threads read y to synchronize.


    Forcing synchronization is inefficient and can be a lot slower than using a regular
    variable. This is why we don''t use atomics unless we have to for a particular
    application.


    So that''s the basics. Let''s look deeper


    # 40.4 Acquire and Release


    More terminology! It''ll pay off to learn this now.


    When a thread reads an atomic variable, it is said to be an acquire operation.


    When a thread writes an atomic variable, it is said to be a release operation.


    What are these? Let''s line them up with terms you already know when it comes
    to atomic variables:


    **Read = Load** — Acquire. When you compare an atomic variable or read it to copy
    it to another variable.

    **Write = Store** — Release. When you assign a value into an atomic variable.


    When using atomics with these acquire/release semantics, C spells out what can
    happen when.


    Acquire/release form the basis for the synchronization we just talked about.


    When a thread reads an atomic variable, it can see values set in another thread
    that released that variable.


    In other words:


    When a thread reads an atomic variable, it can see values set in another thread
    that wrote to that same variable.


    The synchronization happens across the acquire/release pair.


    More details:


    With read/acquire of a particular atomic variable:


    +   * All writes (atomic or non-atomic) in another thread that happened before
    that other thread wrote/stored this atomic variable are now visible in this thread.

    * The new value of the atomic variable by the other thread is also visible in
    this thread.

    * No reads or writes of any variables/memory in the current thread can be reordered
    to before this acquire.

    * The acquire acts as a one-way barrier when it comes to code reordering; reads
    and writes in the current thread can be moved down from before the acquire to
    after it. But, more importantly for synchronization, nothing can move up from
    after the acquire to before it.


