    Sorry!


    OK, now we know there''s a complex type, how can we use?


    # 36.2 Assigning Complex Numbers


    Since the complex number has a real and imaginary part, but both of them on floating
    point numbers to store values, we need to tell C what precision to use for those
    parts of the complex number.


    We do that by pinning a float, double, or long to the complex, before or after
    it.


    Let''s define a complex number for what we use for its components:


    ```

    float complex c; // Spec prefers this way

    complex float c; // Same thing--order doesn''t matter

    ```


    So that''s for declarations, but how do we initialize or assign them?


    ```

    double complex x = 5 + 2*I;

    double complex y = 10 + 3*I;

    ```


    For 5 + 2i and 10 + 3i, respectively.


    # 36.3 Constructing, Deconstructing, and Printing


    We''re getting there...


    We''ve already seen one way to write a complex number:


    ```

    double complex x = 5 + 2*I;

    ```


    There''s also problem using other floating point numbers to build it:


    ```

    double a = 5;

    double b = 2;

    double complex x = a + b*I;

    ```


    There is also a set of macros to help build these. The above code could be written
    using the CMPLX() macro, like so:


    ```

    double complex x = CMPLX(5, 2);

    ```'
