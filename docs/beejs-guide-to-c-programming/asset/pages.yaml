- pgno: 119
  md: "# Chapter 16. Types IV: Qualifiers and Specifiers\n\n# 16.2.2.2 static in File\
    \ Scope\n\nWhen you get out of file scope, outside blocks, the meaning rather\
    \ changes.\n\nVariables at file scope also persist between function calls, so\
    \ that behavior is already there.\n\nInstead static means in this context is that\
    \ this variable isn't visible outside of this particular file. Kind like \"global\"\
    , but only in this file.\n\nMore on that in the section about building with multiple\
    \ source files.\n\n# 16.2.3 extern\n\nThe extern storage-class specifier gives\
    \ us a way to refer to objects in other source files.\n\nLet's say, the file bar.c\
    \ had the following as its entirety:\n\n```\n// bar.c\n\nint a = 37;\n```\n\n\
    Just that. Declaring a new int in a file scope.\n\nBut if we had another source\
    \ file, foo.c, and we wanted to refer to the that's in bar.c?\n\nIt's easy with\
    \ the extern keyword:\n\n```\n// foo.c\n\nint main(void)\n{\n    printf(\"%d\\\
    n\", a); // 37, from bar.c!\n\n    a = 99;\n\n    printf(\"%d\\n\", a); // Same\
    \ \"a\" from bar.c, but it's now 99\n}\n```\n\nWe could also made the extern int\
    \ in a block scope, and it still would have referred to the a in bar.c.\n\n```\n\
    // foo.c\n\nint main(void)\n{\n    extern int a;\n\n    printf(\"%d\\n\", a);\
    \ // 37, from bar.c!\n\n    a = 99;\n\n    printf(\"%d\\n\", a); // Same \"a\"\
    \ from bar.c, but it's now 99\n}\n```\n\nNow, if a in bar.c had been marked static,\
    \ this wouldn't have worked. static variables at file scope are not visible outside\
    \ that file.\n\nA final note about extern on functions. For functions, extern\
    \ is the default, so it's redundant. You can declare a function static if you\
    \ only want visible in a single source file."
