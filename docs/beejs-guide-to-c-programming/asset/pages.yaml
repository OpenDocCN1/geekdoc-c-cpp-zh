  md: "# Chapter 23\n\n# Pointers III: Pointers to Pointers andnMore\n\nHere's where\
    \ we cover some intermediate and advanced pointer usage. If you don't have pointers\
    \ down well, review the previous chapters on pointers and pointer arithmetic before\
    \ starting on this stuff.\n\n# 23.1 Pointers to Pointers\n\nIf you can have a\
    \ pointer to a variable, and a variable can be a pointer, can you have a pointer\
    \ to a variablenthat itself is a pointer?\n\nYes! This is a pointer to a pointer,\
    \ and it's held in variable of type pointer-pointer.\n\nBefore we tear into that,\
    \ I want to try for a *feel* for how pointers to pointers work.\nRemember that\
    \ a pointer is just a number. It's a number that represents an index in computer\
    \ memory,\ntypically one that holds a value we're interested in for some reason.\n\
    \nThat pointer, which is a number, it has to be stored somewhere. And that place\
    \ is memory, just like everything\nelse.\n\nBut because it has an index it's stored\
    \ at, right? The pointer must have an index\nin memory where it is stored. And\
    \ that index is a number. It's the address of the pointer. A pointer to the\n\
    pointer.\n\nLet's start with a regular pointer to int, back from the earlier chapters:\n\
    \n```\n#include <stdio.h>\n\nint main(void)\n{\n    int x = 3490; // Type: int\n\
    \    int *p = &x; // Type: pointer to an int\n\n    printf(\"%d\\n\", p); // 3490\n\
    }\n```\n\n> There's some detail in the values that are stored in registers only,\
    \ but we can safely ignore that for our purposes here. Also the C spec makes no\
    \ stance on \"register\" things beyond the register keyword, the description for\
    \ which doesn't mention registers."
  merge: -1
  img_proc: true
- pgno: 176
  md: "# Chapter 23. Pointers III: Pointers to Pointers and More\n\nStraightforward\
    \ enough, right? We have two types represented: int and int*, and we set up p\
    \ to point to x. Then we dereference p on line 8 and print out the value 3490.\n\
    \nBut, like we said, we can have a pointer to any variable... so that means we\
    \ can have a pointer to p?\nin other words, what type is this expression?\n\n\
    ```\nint x = 3490; // Type: int\nint *p = &x;    // Type: pointer to an int\n\
    ```\n\n&p // <-- what is the address of p? AKA a pointer to p?\n x is int, then\
    \ &x is a pointer to an int that we've stored in p which is type int*. Follow\
    \ (Repeat this paragraph until you do!)\n\nAnd therefore p is a pointer to an\
    \ int*, AKA \"pointer to a pointer to an int\". AKA \"int-pointer-pointer\".\n\
    Got it? (Repeat the previous paragraph until you do!)\n\nWe write this type with\
    \ two asterisks: **. Let's see it in action.\n#include <stdio.h>\n\n```\nint main(void)\
    \ {\n    int x = 3490; // Type: int\n    int *p = &x;  // Type: pointer to int\n\
    \    int **q = &p; // Type: pointer to pointer to int\n\n    printf(\"%d %d\\\
    n\", p, *q); // 3490 3490\n}\n```\n\nLet's make up some addresses to address the\
    \ values as examples and see what these three variables might look like in memory.\
    \ The addresses, below, are just what I have made up for example purposes:\n\n\
    | Variable | Stored at Address | Value Stored There |\n| x | 28350 | 3490--the\
    \ value from the code |\n| p | 29122 | 28350--the address of x! |\n| q | 30848\
    \ | 29122--the address of p! |\n\nIndeed, let's try it for on our computer and\
    \ print out the pointer values with %p and I'll do the same table with actual\
    \ references (printed in hex).\n\n| Variable | Stored at Address | Value Stored\
    \ There |\n| x | 0x7ffd96a07b94 | 3490--the value from the code |\n| p | 0x7ffd96a07b98\
    \ | 0x7ffd96a07b94--the address of x! |\n| q | 0x7ffd96a07ba90 | 0x7ffd96a07b98--the\
    \ address of p! |\n\nYou can see those addresses are the same except the last\
    \ byte, just focus on those.\nOn our system, integers are 4 bytes, which is why\
    \ we're seeing the address go up by 4 times from x to p* and then q goes up by\
    \ 8 bytes.\n\n> 2You're very likely to get different numbers on yours.\n3There\
    \ is absolutely nothing in the spec that says this always work this way, but it\
    \ happens to work this way on our system."
