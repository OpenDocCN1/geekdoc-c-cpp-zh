- pgno: 161
  md: "```\nstruct foo {\n    unsigned int a:1;\n    unsigned int b:2;\n    unsigned\
    \ int c:3;\n    unsigned int d:4;\n};\n```\n\nthe compiler packs all these into\
    \ a single unsigned int. But what if you needed a and b in int, and c and d in\
    \ a different one?\n\nThere's a solution for that: put an unsigned bit-field of\
    \ width where you want the compiler to start anew with packing bits in a different\
    \ int:\n\n```\nstruct foo {\n    unsigned int a:1;\n    unsigned int b:2;\n  \
    \  unsigned int :0; // <--Zero-width unnamed bit-field\n    unsigned int c:3;\n\
    \    unsigned int d:4;\n};\n```\n\nIt's analogous to an explicit page break in\
    \ a word processor. You're telling the compiler, \"Stop packing in unsigned, and\
    \ start packing them in the next one.\"\n\nBy adding the zero-width unnamed bit\
    \ field in that spot, the compiler puts a and b in one unsigned int, and c and\
    \ d in another unsigned int. Total, for a size of 8 bytes on my system (unsigned\
    \ ints are 4 bytes each).\n\n# 20.9 Unions\n\nThese are basically like structs,\
    \ except the fields overlap in memory. The union will be large enough for the\
    \ largest field, and you can use only one field at a time.\n\nIt's a way to reuse\
    \ the same memory space for different types of data.\n\nYou declare them just\
    \ like structs, except it's union. Take a look at this:\n\n```\nunion foo {\n\
    \    int a, b, c, d, e, f;\n    float g, h;\n    char i, j, k, l;\n};\n```\n\n\
    Now, that's a lot of fields. If this was a struct, my system would tell me it\
    \ took 36 bytes to hold it all. The biggest one is int (or float), taking up 4\
    \ bytes on my system. And, indeed, if for the sizeof the union foo, it tells me\
    \ 4! The tradeoff is that you can only use one of fields at a time. However...\n\
    \n# 20.9.1 Unions and Type Punning\n\nYou can non-portably write to one union\
    \ field and read from another!\nDoing so is type pun², and you'd use it if you\
    \ really knew what you were doing, typically with some kind of low-level programming.\n\
    \n> https://en.en.wikipedia.org/wiki/Type_punning"
  merge: -1
  img_proc: true
- pgno: 162
  md: "# Chapter 20. structs II: More Fun with structs\n\nSince the members of a union\
    \ share the same memory, writing to one member necessarily affects the others.\
    \ And if you read from one what was written to another, you will get some weird\
    \ effects.\n\n```\n#include <stdio.h>\n```\n\n```\nunion foo {\n  float b;\n \
    \ short a;\n};\n\nint main(void) {\n  union foo x;\n\n  x.b = 3.14159;\n\n  printf(\"\
    %f\\n\", x.b); // 3.14159, fair enough\n\n  printf(\"%d\\n\", x.a); // But what\
    \ about this?\n}\n```\n\nOn my system, this prints out:\n3.141590\n4048\n\nbecause\
    \ under the hood, the object representation for the float 3.14159 was the same\
    \ as the object representation for the short 4048. On my system. Your results\
    \ may vary.\n\n# 20.9.2 Pointers to unions\n\nIf you have a pointer to a union,\
    \ you can cast pointer to any of the types of the fields in that union and get\
    \ the values out that way.\n\nIn this example, we see that the union has ints\
    \ and floats in it. And we get pointers to the union, way we cast them to *int*\
    \ and *float* types (the cast silences compiler warnings). And then if we dereference\
    \ those, we will see that the values were stored directly in the union.\n\n```\n\
    #include <stdio.h>\n```\n\n```\nunion foo {\n  int a, b, c, d, e, f;\n  float\
    \ g, h;\n  char i, j, k, l;\n};\n\nint main(void) {\n  union foo x;\n\n  int *foo_int_p\
    \ = (int *)&x;\n  float *foo_float_p = (float *)&x;\n\n  x.a = 12;\n  printf(\"\
    %d\\n\", x.a);      // 12\n  printf(\"%d\\n\", *foo_int_p); // 12, again\n}\n\
    ```"
