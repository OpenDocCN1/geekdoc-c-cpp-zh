    \ longer defined\n\n    #ifdef GOATS\n    printf(\"Goats detected, again!\\n\"\
    ); // doesn't print\n    #endif\n}\n```\n\n# 19.4 Built-in Macros\n\nThe standard\
    \ defines a lot of built-in macros that you can test and use for conditional compilation.\
