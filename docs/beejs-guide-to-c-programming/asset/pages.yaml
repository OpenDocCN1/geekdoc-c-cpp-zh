    All this tells us that, under the hood, all these values in a union start at the
    same place in memory,\sand that''s the same as where the entire union is.


    # 20.9.3 Common Initial Sequences in Unions


    If you have a union of structs, and all those structs begin with a common initial
    sequence, it''s valid to

    access members of that sequence from any of the union members.


    What?\Here are two structs with a common initial sequence:


    ```

    struct a {

    int x;           //

    float y;         // Common initial sequence

    };


    struct b {

    int x;           //

    float y;         // Common initial sequence


    double *p;

    short z;

    };

    ```


    Do you see it? It''s they start with int followed by float—that''s the common
    initial sequence. The

    members in the sequence of the structs have to be compatible types. And we see
    that with x and y, which are int and float relatively.


    Now let''s build a union of these:


    ```

    union foo {

    struct a sa;

    struct b sb;

    };

    ```


    This rule tells us that we are guaranteed that the members of the common initial
    sequences are inter-

    changeable in code. That is:


    +   - f.sa.x is as same as f.sb.x.


