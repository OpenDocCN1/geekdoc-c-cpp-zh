    It was another thread that (probably thread 0, from the look of it) and incremented\
    \ the value of foo behind thread 1's back!\n\nLet's solve this different ways.\
    \ (If you want all the threads to share the variable and not step on each other's,\
    \ you will have to read the next section.)\n\n# 39.6.1 _Thread_local_Storage-Class\n\
    \nFirst things first, let's just look at the easy way around this: _Thread_local_storage-class.\n\
    \nBasically we're just going to slip on this of our block static variable and\
