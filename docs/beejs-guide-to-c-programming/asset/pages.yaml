  md: "# 28.1.3 Setting Up Exit Handlers with atexit()\n\nYou can register functions\
    \ when a program exits whether by returning from main() or calling the exit()\
    \ function.\n\nA call to atexit() with the handler function name will get it done.\
    \ You can register multiple exit handlers, and they'll be called in the reverse\
    \ order of registration.\n\nHere's an example:\n\n```\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n```\n\n```\nvoid on_exit_1(void)\n{\n    printf(\"Exit handler called!\\\
    n\");\n}\n\nvoid on_exit_2(void)\n{\n    printf(\"Exit handler 2 called!\\n\"\
    );\n}\n\nint main(void)\n{\n    atexit(on_exit_1);\n    atexit(on_exit_2);\n\n\
    \    printf(\"About to exit...\\n\");\n}\n```\n\nAnd the output is:\n\nAbout to\
    \ exit...\nExit handler 2 called!\nExit handler 1 called!\n\n# 28.2 Quicker Exits\
    \ with quick_exit()\n\nThis is similar to a normal exit, except:\n\n+   * Open\
    \ files might not be flushed.\n* Temporary files might not be removed.\n* atexit()\
    \ handlers won't be called.\n\nBut there is a way to register exit handlers: call\
    \ at_quick_exit() analogously to how you'd call atexit\n\n```\n#include <stdio.h>\n\
    #include <stdlib.h>\n```\n\n```\nvoid on_quick_exit_1(void)\n{\n    printf(\"\
    Quick exit handler 1 called!\\n\");\n}\n```\n\n```\nvoid on_quick_exit_2(void)\n\
    {\n    printf(\"Quick exit handler 2 called!\\n\");\n}\n```"
