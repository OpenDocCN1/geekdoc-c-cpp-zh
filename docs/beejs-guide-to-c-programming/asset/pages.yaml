  md: "# Chapter 21. Characters and Strings II\n\nQuite a few things are happening\
    \ on line 7. First of all, we lead with a \\r to get to the beginning of the current\
    \ line, then we overwrite whatever with the current countdown. (There's ternary\
    \ operator to make sure we print 1 instead of 2 seconds.)\n\nAlso, there is a\
    \ space after the . . That's how we overwrite the last . when i drops from 10\
    \ to 9 and we get a column narrow. Try it without the space to see what I mean.\n\
    \nAnd wrap it up with a \\b to back up that space so the cursor sits at the exact\
    \ end of the line in an aesthetically-pleasant way.\n\nNote that line 14 has all\
    \ of spaces at the end to overwrite the characters that were already there from\
    \ before.\n\nFinally, we have a fflush(stdout) in there, whatever that means.\
    \ Short is most terminals by default, they don't actually display anything until\
    \ a newline is encountered. Since we don't have a newline (we have \\r), without\
    \ this, the program would just sit there until Llush() and then print everything\
    \ in one instant. fflush() overrides this behavior and outputs to buffer right\
    \ now.\n\n# 21.1.2 The Question Mark Use\n\nWhy bother this? After all, this works\
    \ just:\n\n```\nprintf(\"Doesn't it?\\n\");\n```\n\nAnd it works with the escape,\
    \ too:\n\n```\nprintf(\"Doesn't it?\\n\");    // Note \\?\n```\n\nSo what's the\
    \ point??\n\nLet's get more emphatic with another question mark and an exclamation\
    \ point:\n\n```\nprintf(\"Doesn't it??\\n\");\n```\n\nWhen I compile this, I get\
    \ this warning:\n\n```\nfoo.c: In function 'main'\nfoo.c:5:23: warning: trigraph\
    \ ?? converted to | -Wigraphs\n5 |\n printf(\"Doesn't it??\\n\");\n```\n\nAnd\
    \ running it gives us this result:\n\nDoesn't|\nSo graphics? What is the heck\
    \ this??\n\nI'm sure we'll revisit this corner of the language later, but the\
    \ short of it the compiler looks for certain triplets starting with ?? and it\
    \ substitutes other characters in their place. So if you're on some ancient terminal\
    \ without a pipe symbol () on the keyboard, you can type ??! instead.\n\nYou can\
    \ fix this by escaping the question mark, like so:\n\n```\nprintf(\"Doesn't it\\\
    ?\\?!\\n\");\n```\n\nAnd it compiles and works as expected.\n\nThese days, no\
    \ one ever uses trigraphs. But what that!!! sometimes appear if you decide to\
    \ use it in a string for example."
