  md: '# # Chapter 39


    # ## Multithreading


    C11 introduced, formally, multithreading to the C language. It''s very easily
    similar to POSIX threads¹, if you''ve ever used those.


    And if you''ve not, no worries. We''ll talk it through.


    Do note, however, that I''m not intending this to be a full-blown classic multithreading
    how-to; you''ll have to pick up a different very thick book for that, specifically.
    Sorry!


    Threading is an optional feature. If a C11+ compiler defines __STDC_NO_THREADS__,
    threads will not be present in the library. Whether you decided to go with a negative
    sense in macro is beyond me, but there we are.


    You can test for like it:


    ```

    #ifdef __STDC_NO_THREADS__

    #error I need threads to build this program

    #endif

    ```


    Also, you might need to specify certain links when building. In the case of Unix-likes,
    try appending -lpthreads to the end of the line to link the pthreads library²:


    ```

    gcc -std=c11 -o foo foo.c -lpthreads

    ```


    If you''re getting linker errors on your system, it could be because the appropriate
    library wasn''t loaded.


    # ##39.1 Background


    Threads are a way to have all those CPU cores you paid for do work in the same
    program.


    Normal, a C program runs on a single CPU core. But if you know how to split the
    work, you can give pieces of it to a number of threads and do the work simultaneously.


    Though the spec doesn''t say so, your system''s very likely C (or the OS at its
    behest) will attempt to balance the threads over all your CPU cores.


    And if you have more threads than cores, that''s OK. You won''t realize all those
    gains if they''re all trying to compete for CPU time.


    > ¹https://en.wikipedia.org/wiki/POSIX_Threads

    ²I''m more a fan of shared-threading, myself, and my skills with classic multithreading
    constructs are rusty, to say the least.

    ³Yes, pthreads with a "p". It''s for POSIX threads, a library that C11 borrowed
    liberally from for its threads implementation.'
