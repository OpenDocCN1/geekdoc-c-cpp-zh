  md: '# Chapter 10


    # typedef: Making New Types


    Well, not so much making new types as getting new names for existing types. Sounds
    kinda pointless on the surface, but we can really use this to make our code cleaner.


    # 10.1 typedef in Theory


    Basically, you take an existing type and you make an alias for it with typedef.

    Like this:


    ```

    typedef int antelope; // Make "antelope" an alias for "int"


    antelope x = 10;             // Type "antelope" is the same as type "int"

    You can take any existing type and do it. You can even make a number of types
    with a comma list:

    typedef int antelope, bagel, mushroom; // These are all "int"

    ```


    That''s really useful, right? That you can type mushroom instead of int? You must
    be super excited about this feature!

    Professor Sarcasm—we''ll get to some more common applications of this in a moment.


    # 10.1.1 Scoping


    typedef follows scoping rules.

    For reason, it''s quite common to find typedef file scope ("global") so that all
    functions can use the new types at will.


    # 10.2 typedef in Practice


    So renaming int to something else isn''t that exciting. Let''s see where typedef
    commonly makes an appearance.


    # 10.2.1 typedef and structs


    Sometimes a struct will be typedef''d to a new name so you don''t have to type
    the word struct over and over.'
