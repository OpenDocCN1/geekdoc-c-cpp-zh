- pgno: 102
  md: '# Chapter 14. Types II: Way More Types!


    # 14.5.1 Hexadecimal Octal


    In addition to go old'' decimal like Grandma used to bake, C also supports constants
    of different bases.


    If you lead a number with 0x, it is read as a hex number:


    ```

    int a = 01A2B2; // Hexadecimal

    int b = 01a2b2; // Case doesn''t matter for hex digits

    ```


    ```

    printf("%x", a); // Print a hex number, "1a2b"

    ```


    If you lead a number with a 0, it is read as an octal number:


    ```

    int a = 012;


    printfprintf("%o\n", a); // Print an octal number, "12"

    ```


    This is particularly problematic for beginners who try to pad decimal numbers
    on the left

    to line up nice and pricey, inadvertently changing the base of the number:


    ```

    int x = 11111; // Decimal 11111

    int y = 01111; // Decimal 73 (Octal 111)

    int z = 011111; // Decimal 585 (Octal 111)

    ```


    # 14.5.1.1 A Note on Binary


    An unofficial extension¹³ in many compilers allows you to represent a binary number
    with a 0b prefix:


    ```

    int x = 0b101010; // Binary 101010

    ```


    ```

    printf("%d\n", x); // Prints 42 decimal

    ```


    There''s no printf() format specifier for printing a binary number. You have to
    do it a character with

    bitwise operations.


    # 14.5.2 Integer Constants


    You can force an integer to be a certain type by adding a suffix to it that indicates
    the type.


    We''ll have some assignments to demo, but most often devans the suffix unless
    is needed to be precise.

    The compiler is pretty good at making sure types are compatible.


    ```

    int x = 1234;

    long int x = 1234L;

    long long int x = 1234LL

    ```


    ```

    unsigned int x = 1234U;

    unsigned int x = 1234UL;

    unsigned long int x = 1234LLU;

    ```


    The suffix can be uppercase or lowercase. The U and L or LL can appear either
    one first.


    | Type Suffix |

    | int None |

    | long int L |

    | long long int LL |


    > ¹³It''s really surprising that C doesn''t have this in the spec. In the C99
    Rationale document, they write, "A proposal to add

    binary constants were rejected due to lack of precedent and insufficient utility."
    Which seems kind of silly in light of some of the other

    features they kitchen-sinked in there! I''ll bet one of the next releases has
    it.'
  merge: -1
