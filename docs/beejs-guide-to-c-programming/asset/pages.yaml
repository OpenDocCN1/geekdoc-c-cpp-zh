  md: "# 19.3.5 Losing a Macro: #undef\n\nIf you've defined something but you don't\
    \ need it any longer, you can undefine it with #undef.\n\n```\n#include <stdio.h>\n\
    \nint main(void)\n{\n    #define GOATS\n\n    #ifdef GOATS\n    printf(\"Goats\
