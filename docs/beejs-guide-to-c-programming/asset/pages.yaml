    # 27.9 Wide Character Function


    Once we''re in wide character land, we have all kinds of functionality at our
    disposal. I''m just going to summarize a bunch of the functions here, but basically
    what we have are the wide character versions of the multibyte string functions
    we''re to use. For example, we know strlen() for multibyte strings; there''s wcslen()
    for wide character strings.


    # 27.9.1 wint_t


    A lot of these functions use wint_t to hold single characters, whether they are
    passed or returned.

    it is related to wchar_t in nature. A wint_t is an integer that can represent
    all values in the extended character set, and also a special end-of-file character,
    EOF.

    This is used by a number of single-character-oriented character functions.


    # 27.9.2 I/O Stream Orientation


    the trick here is not to mix and match byte-oriented functions (like printf())
    with wide-oriented functions (like fprintf()). Decide if a stream will be byte-oriented
    or wide-oriented and stick with those types of I/O functions.


    In more detail: streams can be either byte-oriented or wide-oriented. When a stream
    is first created, it has no orientation, but the first read or write will set
    it.'
