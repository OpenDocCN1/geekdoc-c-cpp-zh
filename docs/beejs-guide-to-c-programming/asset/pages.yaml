  md: "# Chapter 11. Pointers II: Arithmetic\n\nIf you have a function that takes\
    \ a pointer argument, e.g.:\n\n```\nint my_strlen(char *s)\n```\n\nthis means\
    \ you can pass either an array or a pointer to this function and have it work!\n\
