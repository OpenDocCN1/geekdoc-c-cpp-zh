  md: "# Chapter 23. Pointers III: Pointers to Pointers and More\n\n# 23.2 Multibyte\
    \ Values\n\nWe kinda had this version in a variety of places earlier, but clearly\
    \ not every value can be stored in a single byte of memory. Things take multiple\
    \ bytes of memory (assuming they're not chars). You can tell how many bytes by\
    \ sizeof. And you can tell which address in memory is the first byte of the object\
    \ by using the standard & operator, which returns the address of the first byte.\n\
    \nAnd here's another fun fact! If you iterate over the bytes of any object, you\
    \ get its object representation. These things with the object representation in\
    \ memory are equal.\n\nIf you want to iterate over the object representation,\
    \ you should do it with pointers to unsigned char.\n\nLet's make our version of\
    \ memory(5) that does exactly this:\n\n```\nvoid *memcopy(void *dest, void *src,\
    \ size_t n)\n{\n    // Make local variables for src and dest, but of type unsigned\
    \ char\n    unsigned char *s = src;\n    unsigned char *d = dest;\n\n    while\
    \ (n-- > 0) // For the given number of bytes\n        *d++ = *s++; // Copy source\
    \ to dest byte\n\n    // Most copy functions return a pointer to the dest as a\
    \ convenience\n    // to the caller\n\n    return dest;\n}\n```\n\n(There are\
    \ some good examples of post-increment and post-decrement in there for you to\
    \ study, as well.)\n\nIt's important to note that the version, above, is probably\
    \ less efficient than the one that comes with your system.\n\nBut you can pass\
    \ pointers to anything into it, and it'll copy these objects. Could be int, struct\
    \ animal*, or anything.\n\nLet's do another example that prints out the object\
    \ representation bytes of a struct we can see if there's any padding in there\
    \ and what it holds(6).\n\n```\n#include <stdio.h\n```\n\n```\nstruct foo {\n\
    \    char a;\n    int b;\n};\n\nint main(void)\n{\n    struct foo x = {0x12, 0x12345678};\n\
    \    unsigned char *p = (unsigned char *)&x;\n\n    for (size_t i = 0; i < sizeof(x);\
    \ i++) {\n        printf(\"%02x\\n\", p[i]);\n    }\n}\n```\n\n> ^5 https://beej.com/guide/bglcr/html/split/stringref.html#man-memcopy\n\
    ^6Your compiler is not required to add padding bytes, and the values of any padding\
    \ bytes that are added are indeterminate."
