  md: "# Chapter 7. Strings\n\nBefore you copy the string, make sure you have room\
    \ to copy it into, i.e. the destination array that's going\nhold the characters\
    \ needs to be at least as long as the string you're copying.\n\n```\n#include\
    \ <stdio.h>\n#include <string.h>\n\nint main(void)\n{\n    char s[] = \"Hello,\
    \ world!\";\n    char t[100]; // Each char is one byte, plenty of room\n\n   \
    \ // This makes a copy of the string!\n    strcpy(t, s);\n\n    // We modify t\n\
    \    t[0] = 'z';\n\n    // And s remains unaffected because it's a different string\n\
    \    printf(\"%s\\n\", s); // \"Hello, world!\"\n\n    // But t has been changed\n\
    \    printf(\"%s\\n\", t); // \"zello, world!\"\n}\n```\n\nNotice with strcpy(),\
    \ the destination pointer is the first argument, and the source pointer is the\
    \ second. A\nmnemonic I use to remember this is that' it's the order you would\
    \ have put t and s if an assignment = worked\nfor strings, with the source on\
    \ the right and the destination on the left."
