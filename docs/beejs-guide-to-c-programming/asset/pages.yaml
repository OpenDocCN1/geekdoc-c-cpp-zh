  md: '# Chapter 27


    # Unicode, Wide Characters, and All That


    Before we begin, note that this is an active area of language development in C
    as it works to get past some, erm, *growing pains*. When C2x comes out, updates
    here are probable.


    Most people are basically interested in the deceptively simple question, "How
    do I use such-and-such character set in C? We''ll get to that. But as we''ll see,
    it might already work on your system. Or you might have to point to a third-party
    library.


    We''re going to talk about a lot of things this—some are platform agnostic, and
    some are C-specific. Let''s get an outline first of what we''re going to look
    at:


    +   * Unicode background

    * Character encoding background

    * Source and Execution character Sets

    * Using Unicode and UTF-8

    * Using other character types like wchar_t, char16_t, and char32_t


    Let''s dive in!


    # 27.1 What is Unicode?


    Back in the day, it was popular in the US and much of the world to use a 7-bit
    or 8-bit encoding for characters in memory. This meant we could have 128 or 256
    characters (including non-printable characters) total. That was fine for a US-centric
    world, but there are actually other alphabets out there—who knew? Chinese has
    over 50,000 characters, and that''s not fitting in a byte.


    So people came with all kinds of elements to represent their own character sets.
    And that was fine, but turned into a compatibility nightmare.


    To escape it, Unicode was invented. One character to rule them all. It extends
    out into infinity (effectively) we''ll never run out of space for new characters.
    It has Chinese, Latin, Greek, cuneiform, chess symbols, emojis... just about everything,
    really! And more is added all the time!


    # 27.2 Code Points


    I want to talk about two concepts here. It''s confusing because they''re both
    numbers... different numbers for the same thing. But bear me.


    Let''s loosely define *code point* to mean a numeric value representing a character.
    (Code points can also represent unprintable control characters, but just assume
    I mean something like the letter "B" or the character'
