    Both mean the same thing, so you might as well use the pretier complex.


    You also get some types for imaginary numbers if you implementation is IEC 60559-compliant:


    _Imaginary imaginary


    These also mean the same thing, so you might as well use the pretier imaginary.


    You also get values for the imaginary number i, itself:


    I _Complex_I _Imaginary_I


    The macro I is set to _Imaginary_I (if available), or _Complex_I. So just I for
    the imaginary number.


    One side: I''ve said that if a compiler has _STDC_IEC_559_COMPLEX_ set to 1, it
