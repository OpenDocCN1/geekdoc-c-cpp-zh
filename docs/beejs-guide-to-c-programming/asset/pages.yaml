- pgno: 230
  md: "# Chapter 31. goto\n\ngoto sends execution jumping to the specified label,\
    \ skipping everything in between.\n\nYou can jump forward or backward to goto.\n\
    \n```\ninfinite_loop:\n    print(\"Hello, world!\\n\");\n    goto infinite_loop:\n\
    ```\n\nLabels are skipped over execution. The following will print all three numbers\
    \ in order just as if the labels weren't there:\n\n```\nprintf(\"Zero\\n\");\n\
    label_1:\n    printf(\"One\\n\");\nlabel_2:\n    printf(\"Two\\n\");\nlabel_3:\n\
    \    printf(\"Three\\n\");\n```\n\nAs you've noticed, it's a common convention\
    \ to justify all the labels on the left. This increases readability because a\
    \ reader can quickly scan to find the destination.\n\nLabels have function scope.\
    \ That is, no matter how many levels in blocks they appear, you can still get\
    \ them from anywhere in the function.\n\nIt means you can only go labels that\
    \ are in the same function as the goto itself. Labels in other functions are out\
    \ of goto's perspective. And it means you can use the same label name in two functions—just\
    \ not the same label in the same function.\n\n# 31.2 Labeled continue\n\nIn languages,\
    \ you can actually specify a label for a continue statement. C doesn't allow it,\
    \ but you can easily use goto instead.\n\nTo show the issue, check out continue\
    \ in this nested loop:\n\n```\nfor (int i = 0; i < 3; i++) {\n    for (int j =\
    \ 0; j < 3; j++) {\n        printf(\"%d, %d\\n\", i, j);\n        continue; //\
    \ Always goes to next\n    }\n}\n```\n\nAs we see, continue, like all continues,\
    \ goes to the next iteration of the nearest enclosing loop. If we want to continue\
    \ in the next loop out, right?\n\nWell, we can break to get to the outer loop,\
