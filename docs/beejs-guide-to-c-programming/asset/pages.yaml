- pgno: 38
  md: '# Chapter 5. Pointers—Cower In Fear!


    **Memory Fun Facts:** When you have a data type (like your typical int) that uses
    more than a byte of memory, the bytes that make up the data are always adjacent
    to one another in memory. Sometimes they''re in the order that you expect, and
    sometimes they''re not. While C doesn''t guarantee any memory order (it''s platform-dependent),
    it''s still possible to write code in a way that''s platform-independent where
    you don''t have to consider these pesky order.


    So anyway, if we can get on it and get a drum roll and some foreoding magic for
    the definition of a pointer, a pointer is a variable that holds an address. Imagine
    the classic story from 2001: A Space Odyssey at this point. Bam ba bam bam BAAAH!


    Ok, so might be a bit overwhelmed, there''s not a lot of mystery about pointers.
    They are the address of data. Just like an int can hold the value 12, a pointer
    variable can hold the address of data.


    This means all these things mean the same thing, i.e. a number that represents
    a pointer in memory:


    +   - Index into memory (if you''re thinking of memory like a big array)

    - Address

    - Location


    I''m going to use these interchangeably. And I just threw location there because
    you can never have enough that mean the same thing.


    And a pointer variable holds address number. Just like a float variable might
    hold 3.14159.


    Imagine you have a bunch of Post-I® all numbered in sequence with their addresses.
    The first one is int 0, the next is index 1, and so on.


    In addition to the number representing their positions, you can also write another
    number of choice on each. It could be the number of days you have or the months
    around Mars...


    ...Or, it could be the index of another pointer-note!


    If you have written the number of data you have, that''s a regular variable. But
    if you write the index of another-Post in there, that''s a pointer. It points
    to the other note!


    Another analogy might be with addresses. You can have a house with certain qualities,
    metal roof, solar, etc. You or de to have the address of that house. The address
    isn''t the same as the house itself. One''s a full-blown house, and the other
    is just a few lines of text. But the address of the house is a pointer to find
    where it is. It isn''t the house, but it tells you where to find it.


    And we can do this in the computer with data. You can have a data variable that
    holds some value. And value is in memory at some address. And you could have a
    different pointer variable hold the address of that variable.


    It''s not the data variable itself, but like a "pointer" to data. It tells us
    where to find it.


    When we have, we say we have a "pointer" to data. And we can follow the pointer
    to access the data itself.


    (Though doesn''t seem particularly useful, this becomes indispensable when used
    with function calls. Bear with me we got there.)


    So if we have an int, and we want a pointer to it, what is some way to get the
    address of that int, right? After all, the pointer holds the address of data.
    What operator do you suppose we''d use to find the address of the int?


    Well, a shocking surprise that comes as something of a shock to you, gentle reader,
    we use the address operator (which happens to be an ampersand: "&")to find the
    address of the data. Ampersand.


    > The order that bytes come in is referred to as endianness of the number. The
    usual suspects are big-endian (with the most significant byte first) and little-endian
    (with the most-significant byte last), or commonly now, mixed-endian (with the
    most-significant byte somewhere else).'
