  md: "# Chapter 15. Types III: Conversions\n\nLet's do an example where we convert\
    \ a string to an unsigned long, discarding error information (i.e. information\
    \ about bad characters in the input string):\n\n```\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n\nint main(void)\n{\n    char *s = \"3490\";\n\n    // Convert string\
    \ s, a number in base 10, to an unsigned long int.\n    // NULL means we don't\
    \ care to learn about any error information.\n\n    unsigned long int x = strtol(s,\
    \ NULL, 10);\n\n    printf(\"%lu\\n\", x); // 3490\n}\n```\n\nNotice a couple\
    \ things. Even though we didn't de capture any information about error characters\
    \ in the string, strtol() won't give us undefined behavior; it will just return\
    \ 0.\nAlso, we specified that this was a decimal (base 10) number.\nDoes this\
    \ mean we can convert numbers of different bases? Sure! Let's go binary!\n\n```\n\
    #include <stdio.h>\n#include <stdlib.h>\n\nint main(void)\n{\n    char *s = \"\
    10110\"; // What's the meaning of this number?\n\n    // Convert string s, a number\
    \ in base 2, to an unsigned long int.\n\n    unsigned long int x = strtol(s, NULL,\
    \ 2);\n\n    printf(\"%lu\\n\", x); // 42\n}\n```\n\nOK, that's all and games,\
    \ but what's that NULL in there? What's that for?\nThat helps us figure out if\
