    # 14.2 Character Types


    Remember char? The type we can use to hold a single character?


    ```

    char c = ''B'';


    printf("%\n\n", c); // "B"

    I a shaker for you: it''s actually an integer.


    char c = ''B'';

    ```


    ```

    // Change this from %c to %d:

    printf("%d\n", c); // 66 (!!)

    ```


    Deep down, char is just a small int, namely an integer that uses a single byte
    of space, limiting its range

    to to...


    Here the C spec gets a little fury. It assures us that char is a single byte,
    i.e. sizeof(char) == 1.

    But in C$3.6$ it goes out of its way to say:


    A byte is composed of a composite sequence of bits, the number of which is implementation-defined.


    What—what? Some of you might be used to the notation that a char is 8 bytes, right?
    I mean, what is it, right? And the answer is, "Almost certainty." But C is an
    old language, and machines back in the day, had we say, a more relaxed opinion
    over how many bits were a byte. And through the years, C has retained this flexibility.


    But assuming your bytes in C are 8 bytes, they are virtually all in the world
    that you''ll ever see, the range of a char is...


    —So I can tell you, it turns out char might be signed or unsigned depending on
    your compiler.

    Unless you specify.


    ```

    // Could be signed or unsigned

    char a;

    signed b; // Definitely signed

    unsigned char c; // Definitely unsigned

    ```


    OK, now, finally we can figure out char is fine if you don''t care about the sign
    of the data. But if you need signed or unsigned chars, you must be:


    So, assuming those, we can finally find our out:


    > ^3The industry term for a sequence of exactly, indisputably 8 bits is an octet.


    > ^4In general, if you have an n bit two''s complement number, the signed range
    is $-2^{n-1}$ to $2^{n-1}-1$. And the unsigned range is 0 to $2^n-1$.'
