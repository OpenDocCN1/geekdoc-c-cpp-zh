  md: "# Chapter 37. Fixed Width Integer Types\n\nTo this, we can take advantage of\
    \ a fact about C that you might have forgotten: adjacent string literals are automatically\
    \ concatenated to a single string. E.g.:\n\n```\nprintf(\"Hello, %world\\n\");\
    \    // Prints \"Hello, world!\"\n```\n\nAnd these macros are string literals,\
    \ we can use them like so:\n\n```\n#include <stdio.h>\n#include <stdint.h>\n#include\
    \ <intypes.h>\n\nint main(void)\n{\n    int_least16_t x = 3490;\n    printf(\"\
    The value is %%%PRIDLEAST16 \\!\\n\", x);\n}\n```\n\nWe also have a pile of macros\
    \ for printing unsigned types:\n\n| PRIon | PRIOLEASTn | PRIOFastn | PRIOMAX |\n\
    | PRIun | PRILEASTn | PRIUFastn | PRIuMAX |\n| PRIxn | PRILEXASTn | PRIXastn |\
    \ PRIXMAX |\n| PRIxn | PRILEXASTn | PRIFXastn | PRIxMAX |\n\nIn this case, o,\
    \ u, x, and X correspond to the documented format specifiers in printf().\n\n\
    And, as before, the lowercase should be substituted with 8, 16, 32, or 64.\n\n\
    But just when you think you had enough of macros, it turns out we have a complete\
    \ complementary set of them for scanf(!).\n\n| SCndn | SCDLEASTn | SCGFastn |\
    \ SCNMAX |\n| SCnIn | SCNLEASTn | SCNFastn | SCNIMAX |\n| SCnOn | SCNLEASTn |\
    \ SCGFastn | SCNMAX |\n| SCUn | SCUFEASTn | SCUFastn | SCuMAX |\n| SCxn | SCXLEASTn\
    \ | SCFXastn | SCxMAX |\n\nRemember: when you want to print out a fixed size integer\
    \ type with printf() or scanf(), grab the corresponding format specifier from\
    \ <intypes.h>."
