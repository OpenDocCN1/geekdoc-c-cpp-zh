  md: "# Chapter 20. structs III: More Fun with structs\n\n+   - f.sa.y is the same\
    \ as f.sb.y.\n\nBecause fields x and y are both in the common initial sequence.\n\
    \nAlso, the names of the members in the common initial sequence don't matter—all\
    \ that matters is that the types are the same.\n\nAll together, this allows us\
    \ to safely add some shared information between structs in the union. The best\
    \ example of this is probably using a field to determine the type of struct out\
    \ of the structs in the union that is \"in use\".\n\nThat is, if we weren't allowed\
    \ this and passed the union to some function, how would that function know which\
    \ member of the union was the one it should look at?\n\nTake a look at these structs.\
    \ Note the common initial sequence:\n\n```\n#include <stdio.h>\n\nstruct common\
    \ {\n    int type; // common initial sequence\n};\n\nstruct antelope {\n    int\
    \ type; // common initial sequence\n    int loudness;\n};\n\nstruct octopus {\n\
    \    int type; // common initial sequence\n\n    int sea_creature;\n    float\
    \ intelligence;\n}\n```\n\nNow let's throw them into a union:\n\n```\nunion animal\
    \ {\n    struct common common;\n    struct antelope antelope;\n    struct octopus\
    \ octopus;\n}\n```\n\nAlso, please indulge these two #defines for the demo:\n\n\
    ```\n#define ANTELOPE 1\n#define OCTOPUS 2\n```\n\nSo far, nothing special has\
    \ happened here. It seems the type field is completely useless.\n\nBut now let's\
    \ make a generic function that prints a union animal. It has to somehow be able\
    \ to tell if it's looking at a struct antelope or a struct octopus.\n\nBecause\
    \ of the magic of common initial sequences, it can look up the animal type in\
    \ any of these places for a particular union x:\n\n```\nint type = x.common.type;\
    \ // or...\nint type = x.antelope.type; // or...\nint type = x.octopus.type;\n\
    ```\n\nAll refer to the same value in memory."
