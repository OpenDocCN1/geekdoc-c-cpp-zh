- pgno: 200
  md: '# Chapter 27. Unicode, Wide Characters, and All That


    Notably, it''s a pain (though possible with escape sequences) to enter Unicode
    characters using only the basic character set.


    # 27.5 Unicode in C


    Before I get into encoding in C, let''s talk about Unicode from a code point standpoint.
    There is a way in C to specify Unicode characters and these will get translated
    by the compiler into the execution character set.

    So how we do it?


    How about the euro symbol, code point 0x20AC. (I''ve written it in hex because
    both ways of representing it in C require hex.) How can we put it in C?


    Use the \u to put it in a string, e.g. "\u20AC" (case for the hex doesn''t matter).
    You must put exactly four digits after the \u, padding with leading zeros if necessary.

    Here''s an example:


    ```

    char *s = "\u20AC1";

    ```


    ```

    printf("%s\n", s); // €1.23

    ```


    So \u works for 16-bit Unicode code points, but not ones bigger than 16 bits?
    For that, we need capitals:

    For example:


    ```

    char *s = "\u0001D4D1";

    ```


    ```

    printf("%s\n", s); // Prints a mathematical letter "B"

    ```


    It''s the same as \u, just with 32 bits instead of 16. These are equivalent:

    \u03C0

    \u000B3C0


    Again, these are translated into the execution character set during compilation.
    They represent Unicode code points, not any specific encoding. Furthermore, if
    a Unicode code point is not representable in the execution character set, the
    compiler can wonder why you can''t do this:


    ```

    char *s = "€1.23";

    ```


    ```

    printf("%s\n", s); // €1.23

    ```


    And probably can, if you use a modern compiler. The character set will be translated
    for you into the execution character set by the compiler. Compilers are free to
    poke out if they find any characters that aren''t included in their extended character
    set, and the € symbol certainly isn''t in the basic character set.

    Caveat this point you can''t use \u or \U to encode any code points except 0xA0
    for ($), 0x40 (@), and 0x60 (—)—these are precisely the three common punctuation
    marks from the basic character set. Apparently this restriction is relaxed in
    the upcoming version of the spec.


    Finally, you can use these identifiers in your code, with some restrictions. But
    I don''t want to get into here. We''re all about string handling in this chapter.


    And that''s it for Unicode in C (except encoding).


    > Presumably the compiler makes the best effort to translate the code point to
    whatever the output encoding is, but I can''t find any guarantees in the spec.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'Chapter 27. Unicode, Wide Characters, and All That


    # 27.6 A Quick Note on UTF-8 Before We Swerve into the Weeds


    It could be your source file on disk, the extended source characters, and the
    extended execution characters are all in UTF-8 format. The libraries you use expect
    UTF-8. This is the glorious future of UTF-8 everywhere.


    If that''s the case, and you don''t mind being non-portable to systems that aren''t
    like that, then just run with it. Stick Unicode characters in your source and
    data and it will be happy. Use regular C strings and be happy.


    A lot of things will work (almost non-portably) because UTF-8 strings can be NULL-terminated
    just like any other C string. But losing much for easier character handling is
    a tradeoff that''s worth it to you.


    There are some caveats:


    +   * Things strlen() returns the number of bytes in a string, not the number
    of characters, necessarily. (The mbstows returns the number of characters in a
    string when you convert it to wide characters. POSIX extends this so you can call
    NULL for the first argument if you just want the character count).

    * The following won''t work properly with characters of more than one character:
    strtok(), strchr() (use strcmp instead), strncpy()-functions, lower(), isalpha()-type
    functions, and probably more. Beware that operates on bytes.

    * If you want to malloc() for a string, or declare an array of chars for, be aware
    that the maximum size could be more than you were expecting. Each character could
    take up to MB_LEN_MAX bytes (<limits.h>);except characters in the basic character
    set are guaranteed to be one byte.

    * printf() variants allow for a way to print many bytes of a string. You want
    to make sure you print the number of bytes to end on a character boundary.


    And others I haven''t discovered. Let me know what pitfalls are out there...


    # 27.7 Different Character Types


    I want to introduce more character types. We''re used to char, right?

    But that''s too easy. Let''s make things a lot more difficult! Yay!


    # 27.7.1 Multibyte Characters


    First of all, I want to change your thinking about what a string (array of chars)
    is. These are strings made up of multibyte characters.


    That''s—run-of-the-mill string of characters is multibyte. When someone says “C
    string”, they mean “C multibyte string".


    Even if a particular character in the string is only a single byte, or if a string
    is made up of only single characters, it''s known as a multibyte string.


    For example:


    ```

    char c[128] = "Hello, world!\ // multibyte string

    ```


    What we''re saying is a particular character that''s not in the basic character
    set could be composed of multiple bytes. Up to MB_LEN_MAX of them (<limits.h>).
    Sure, it looks like one character on the screen, but it could be multiple bytes.


    You can throw Unicode values in there, as well, as we saw:


    > With a format specifier like ".12s", for example.'
