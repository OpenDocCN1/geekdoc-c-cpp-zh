    \ coord {\n    int x, y;\n};\n\nvoid print_coord(struct coord c)\n{\n    printf(\"\
    %d, %d\\n\", c.x, c.y);\n}\n\nint main(void)\n{\n    struct coord t = {.x=10,\
    \ .y=20};\n\n    print_coord(t); // prints \"10, 20\"\n}\n```\n\nStraightforward\
    \ enough.\n\nLet's modify it to use an unnamed object instead of the variable\
