    \ on a 64-byte boundary\n    char *p = aligned_alloc(64, 256); // 256 == 64 *\n\
    \n    // Copy a string in there and print it\n    strncpy(p, \"Hello, world!\"\
    );\n    printf(\"%s\\n\", p);\n\n    // Free the space\n    free(p);\n}}\n```\n\
    \nI want to throw a note here about realloc() and aligned_alloc(). realloc() doesn't\
    \ have any alignment guarantees, so if you need to get some aligned allocated\
    \ space, you'll have to do it the hard way with malloc(ptr).\n\nHere's a non-standard\
    \ aligned_realloc() function, if you need it:\n\n```\nvoid *aligned_realloc(void\
    \ *ptr, size_t size, size_t alignment, size_t size) {\n    char *new_ptr = aligned_alloc(alignment,\
    \ size);\n\n    if (new_ptr == NULL) {\n        return NULL;\n    }\n\n    size_t\
    \ copy_size = old_size < size ? old_size : size; // get min\n\n    if (ptr !=\
    \ NULL) {\n        memcpy(new_ptr, ptr, copy_size);\n    }\n\n    free(ptr);\n\
    \n    return new_ptr;\n}\n```\n\nNote that it always copies data, taking time,\
    \ while realloc() will avoid that if it can. This is hardly efficient. Avoiding\
    \ needing to reallocate custom-aligned data.\n\n> http://www.open-std.org/jtc1/sc22/wg14/www/docs/summary.html#dr_460"
