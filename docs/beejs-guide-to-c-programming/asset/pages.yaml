  md: '# Chapter 33. Arrays Part II


    Anything else is undefined behavior.


    ```

    int func(int p[static 4]) {}


    int main(void)

    {

    int a[] = {11, 22, 33, 44};

    int b[] = {11, 22, 33, 44, 55};

    int c[] = {11, 22};


    func(a); // OK! a is 4 elements, the minimum

    func(b); // OK! b is at least 4 elements

    func(c); // Undefined behavior! c is under 5 elements!

    }

    ```


    This basically sets the minimum size your array can have.


    Important note: there is nothing in the compiler that prohibits you from passing
    in a smaller array. The compiler probably won''t warn you, and it won''t detect
    it at runtime.


    By putting static in there, you''re saying, "I double PROMISE will never pass
    in a smaller array than this." And the compiler says, "Yeah, fine," and trusts
    you to not do it.


    And then the compiler can make certain code optimizations, safe in the knowledge
    that you, the programmer, will do the right thing.


    # 33.3 Equivalent Initializers


    C is a little bit, shall we say, flexible when it comes to array initializers.

    We''ve already seen some of this, where missing values are replaced with zero.


    For example, we can initialize a 5 element array to 1, 2, 0, 0, 0 with this:


    ```

    int a[5] = {1, 2};

    ```


    Or an array entirely to zero with:


    ```

    int a[5] = {0};

    ```


    But things get interesting when initializing multidimensional arrays.

    Let''s make an array of 3 rows and 2 columns


    ```

    int a[3][2];

    ```


    Let''s write some code to initialize it and print the result:


    ```

    #include <stdio.h>


    int main(void)

    {

    int a[3][2] = {

    (1, 2),

    {3, 4},

    {5, 6}

    }

    ```'
