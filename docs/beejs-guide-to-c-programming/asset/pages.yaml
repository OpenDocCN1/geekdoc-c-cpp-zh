  md: "# 39.8.2 Broadcast: Wake Up Waiting Threads\n\ncnd_signal())] cnd_signal()\
    \ only wakes up one thread to continue working. Depending on how your logic does,\
    \ it might make sense to wake up more than one thread to continue once the condition\
    \ is met.\n\nOf course only one of them can grab the mutex, but if you have a\
    \ situation where:\n\n+   * The newly-woken thread is responsible for waking up\
    \ the next one, and—n* There's a chance the spurious-wakeup loop condition will\
    \ prevent it from doing so, then—\n\nyou'll want to wake the up so that you're\
    \ sure to get at least one of the threads out of loop to launch the next one.\n\
    \nHow, you ask?\n\nSimply use cnd_broadcast() instead of cnd_signal(). Exact same\
    \ usage, except cnd_broadcast() wakes up all the threads that were waiting on\
    \ condition variable.\n\n# 39.9 Running a Function One Time\n\nLet's say you have\
    \ a function that could be run by many threads, but you don't know when, and it's\
    \ not work to try with all logic.\n\nThere's a way around it: use call_once().\
    \ Tons of threads could try to run the function, but only the first one counts¹²\n\
    \nTo work with this, you need a special flag variable you declare to keep track\
    \ of whether or not the thing's been run. And you need a wrapper to run the function,\
    \ which takes no parameters and returns no value.\n\nonce_flag of = ONCE_FLAG_INIT;\
    \ // Initialize it like this\n\n```\nvoid run_once_function(void)\n{\n    printf(\"\
    I'll only run once!\\n\");\n}\n\nint run(void *arg)\n{\n    call_once(&of, run_once_function);\n\
    \    // ...\n```\n\nIn this example, no matter how many threads get to the run()\
