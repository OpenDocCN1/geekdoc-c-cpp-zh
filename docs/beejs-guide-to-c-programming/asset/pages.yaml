    \n    printf(\"%.5f\\n\", f); // 3.14159 correct!\n    printf(\"%.11f\\n\", g);\
    \ // 0.000002653538 correct!\n\n    // Now add them up\n    f += g;          \
    \      // 3.141592653538 is what f _should_be\n\n    printf(\"%.11f\\n\", f);\
    \ // 3.141592653724101 wrong!\n}\n```\n\n(The above code has an f over the numeric\
    \ constants—this indicates that the constant is float, as opposed to the double\
    \ of double. More on this later.)\n\nRemember that FLT_DIG is the safe number\
    \ of digits you can store in a float. Sometimes you get one or two out of it.\
    \ But sometimes you'll get FLT_DIG digits back. The sure thing is: if you store\
    \ any number of digits up and including FLT_DIG in a float, you're sure to get\
    \ them back correctly.\n\nSo's the story. FLT_DIG. The End.\n...Or is it?\n\n\
    # 14.4.2 Converting to Decimal and Binary\n\nBut storing a base 10 in a floating\
    \ point number and getting it out is only half the story.\n\n> ¹²This program\
