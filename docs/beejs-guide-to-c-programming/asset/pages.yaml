  md: "# 20.8 Bit-Fields\n\nIn my experience, these are rarely used, but you might\
    \ see them out there time to time, especially in lower-level applications that\
    \ pack bits together into larger spaces.\n\nLet's take a look at some code to\
    \ demonstrate a use case:\n\n```\n#include <stdio.h>\n\nstruct foo {\n    unsigned\
    \ int a;\n    unsigned int b;\n    unsigned int c;\n    unsigned int d;\n};\n\
    ```\n\n```\nint main(void) {\n    printf(\"%%u\\n\", sizeof(struct foo));\n}\n\
    ```\n\nFor me, this prints 16. Which makes sense, since unsigneds are 4 bytes\
    \ on my system.\n\nBut if we know all the values that were going to be stored\
    \ in a and b would be stored in 5 bits, and the values in c, and d would be stored\
    \ in 3 bits? That's a total of 16 bits. Why have 128 bits reserved for them if\
    \ we're only going to use 16?\n\nWell, can we call C to pretty-pretty try to pack\
    \ these values. We can specify the maximum number of bits that values can take\
    \ (from 1 up to the size of the containing type).\n\nWe do this by putting a colon\
    \ after the field name, followed by the width in bits.\n\n```\nstruct foo {\n\
    \    unsigned int a:5;\n    unsigned int b:5;\n    unsigned int c:3;\n    unsigned\
    \ int d:3;\n};\n```\n\nNow when I ask how big my struct foo is, it tells me 16\
    \ bytes, but it's only 4. It has \"packed\" those 4 values down into 4 bytes,\
    \ which is a four-fold memory savings.\n\nThe tradeoff is, that the 5-bit fields\
    \ can only hold values from 0-31 and the 3-bit fields can only hold values from\
    \ 0-7. But life's all about compromise, after.\n\n# 20.8.1 Non-Adjacent Bit-fields\n\
    \nGotcha: C will only combine adjacent bit-fields. If they're interrupted by non-bit-fields,\
    \ you get not only savings:\n\n```\nstruct foo {\n    unsigned int a:1;\n    //\
    \ since a is not adjacent to c.\n    unsigned int b;\n    unsigned int c:1;\n\
    \    unsigned int d;\n};\n```\n\nIn example, since a is not adjacent to c, they\
    \ are both \"packed\" in their own towns.\n\nSo we have one each for a, b, c,\
    \ and d. Since my ints are 4 bytes, that's a grand total of 16."
  merge: -1
  img_proc: true
- pgno: 160
  md: "# Chapter 20. structs II: More Fun with structs\n\nA quick rearrangement yields\
    \ space savings from 16 bytes down to 12 bytes (on your system):\n\n```\nstruct\
    \ foo {\n    // sizeof(struct foo) == 12 (for me)\n    unsigned int a:1;\n   \
    \ unsigned int c:1;\n    unsigned int b;\n    unsigned int d;\n};\n```\n\nAnd\
    \ now, as a is int next to c, the compiler puts them together into a single int.\n\
    \nSo we have one int for a combined a and c, and one each for b and d. For a grand\
    \ total of 3 ints, or 12 bytes.\n\nPut all your bitfields together get the compiler\
    \ to combine them.\n\n# 20.8.2 Signed or Unsigned ints\n\nIf you declare a bit-field\
    \ to be int, the different compilers will treat it as signed or unsigned. Just\
    \ like the situation with char.\n\nBe specific about the signedness when using\
    \ bit-fields.\n\n# 20.8.3 Unnamed Bit-Fields\n\nIn some specific circumstances,\
    \ you might need to reserve some bits for hardware reasons, but not need to use\
    \ them in code.\n\nFor example, let's say you have a byte where the top 2 bits\
    \ have meaning, the bottom 1 bit has meaning, but the middle 5 bits do not get\
    \ used by you.\n\nWe could do something this:\n\n```\nstruct foo {\n    unsigned\
    \ char a:2;\n    unsigned char dummy:5;\n    unsigned char b:1;\n};\n```\n\nAnd\
    \ that work—in our code we use a and b, but never dummy. It's just to eat up 5\
    \ bits to make sure a and b are in the \"required\" (by this example) positions\
    \ within the byte.\n\nC allows a way to clean up this: unnamed bit-fields. You\
    \ can leave the name (dummy) out in this case, and C is perfectly happy for the\
    \ effect:\n\n```\nstruct foo {\n    unsigned char a:2;\n    unsigned char :5;\
    \ //-- unnamed bit-field!\n    unsigned char b:1;\n};\n```\n\n\n\n# 20.8.4 Zero-Width\
    \ Unnamed Bit-Fields\n\nSome esoteric out here... Let's say you were packing bits\
    \ into an unsigned int, and you needed some adjacent bit-fields to pack into the\
    \ next unsigned int.\n\nThat is, if you do:\n\n> 4Assuming 8-bit chars, i.e. CHAR_BIT\
    \ == 8."
