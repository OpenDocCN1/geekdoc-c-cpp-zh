    struct\" with no name. We also mention these in the typedef section, but we'll\
    \ refresh here.\n\nHere's a regular struct:\n\n```\nstruct animal {\n    char\
    \ *name;\n    int leg_count, speed;\n};\n```\n\nAnd here's the anonymous equivalent:\n\
    \n```\nstruct { // <-- No name!\n    char *name;\n    int leg_count, speed;\n\
    };\n```\n\nOkaaaay. So we have a struct, but it has no name, so we have no way\
    \ of using it later? Seems pretty pointless.\n\nAdmittedly, and in example, it\
    \ is. We can still make use of a couple ways.\n\nOne is rare, but since the anonymous\
    \ struct represents a type, we can just put some variable names after and use\
    \ them.\n\n```\nstruct { // <-- No name!\n    char *name;\n    int leg_count,\
    \ speed;\n} a, b, c; // 3 variables of this struct\n```\n\na.name = \"antelope\"\
    ; // for example\n\nc.leg_count = 4;\n\nBut that's not useful.\n\nFar more common\
    \ to use of anonymous structs with a typedef so that we can use it later (e.g.\
    \ to pass variables to functions).\n\n```\ntypedef struct { // <-- No name!\n\
    \    char *name;\n    int leg_count;\n} animal; // New type: animal\n```\n\nanimal\
    \ a, b, c;\n\na.name = \"antelope\"; // for example\n\nc.leg_count = 4;\n\nPersonally,\
    \ I don't use anonymous structs. I think it's more pleasant to see the entire\
    \ struct animal before the variable name in a declaration.\n\nBut that's just,\
    \ like, my opinion, man."
