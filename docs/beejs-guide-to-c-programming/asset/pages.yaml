- pgno: 271
  md: "# 38.6 Differences Between Times\n\nOne quick note about getting the difference\
    \ between two time_ts: since the spec doesn't dictate how type represents a time,\
    \ you might not be able to subtract two time_ts and get anything sensible.\n\n\
    Luckily you use difftime() to compute the difference in seconds between two dates.\n\
    \nIn the following example, we have two events that occur some time after, and\
    \ we use difftime() to compute the difference.\n\n```\n#include <stdio.h>\n#include\
    \ <time.h>\n\nint main(void) {\n    struct time_a = {\n        .tm_year=82,  \
    \    // years since 1900\n        .tm_mon=3,         // months since January --\
    \ [0, 11]\n        .tm_mday=12,       // day of the month -- [1, 31]\n       \
    \ .tm_hour=4,        // hours since midnight -- [0, 23]\n        .tm_min=0,  \
    \       // minutes after the hour -- [0, 59]\n        .tm_sec=04,        // seconds\
    \ after the minute -- [0, 60]\n        .tm_isdst=-1,     // Daylight Saving Time\
    \ flag\n    };\n\n    struct time_b = {\n        .tm_year=120,      // years since\
    \ 1900\n        .tm_mon=10,        // months since January -- [0, 11]\n      \
