  md: '# Chapter 19. The C Preprocessor


    | Pragma Name | Description |

    |---|---|n| FENV_ACCESS | Set to ON if you plan to access the floating point status
    flags. If OFF, the compiler might perform optimizations that change the values
    in the flags to be inconsistent or invalid. CX_LIMITED_RANGE | Set to ON allow
