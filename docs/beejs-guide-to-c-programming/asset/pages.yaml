  md: "# Chapter 23. Pointers III: Pointers to Pointers and More\n\n# 23.1.1 Pointer\
    \ Pointers and const\n\nIf you recall, declaring a pointer like this:\n\n```\n\
    int *const p;\n```\n\nmeans that you can't modify p. Trying to p++ would give\
    \ you a compile-time error.\nBut how does that work with int ** or ***? Where\
    \ does the const go, and what does it mean?\n\nLet's start with the simple bit.\
    \ The const right to the variable name refers to that variable. So if you want\
    \ to change it:\n\n```\nint ***const p;\n\nnp++; // Not allowed\n```\n\nBut here's\
    \ where things get a weird.\n\n```\nint main(void)\n{\n    int x = 3490;\n   \
    \ int *const p = &x;\n    int **q = &p;\n}\n```\n\nWhen I build that, I get a\
    \ warning:\n\n> warning: initialization discards 'const' qualifier from pointer\
    \ target type\n7 | int **q = &p;\n^\n\nWhat's going on? The compiler is telling\
    \ us that we had a variable that const, and we're assigning its value into another\
    \ variable that is not const in the same way. The \"constness\" is discarded,\
    \ probably isn't what we wanted to do.\n\nThe type of p is int *const p, and so\
    \ p is type int *const *. And we try to assign that into q.\nBut q is int **!\
    \ A type with different constness on the first! So we get a warning that the const\
    \ in p\nint *const is being ignored and thrown away.\n\nWe can fix that by making\
    \ sure q's type is at least as const as p.\n\n```\nint x = 3490;\nint *const p\
    \ = &x;\nint *const q = &p;\n```\n\nAnd now we're happy.\nWe could make even more\
    \ const. As it is, above, we're saying, \"q isn't itself const, but the thing\
    \ it points to is const.\" But we could make them both const:\n\n```\nint x =\
    \ 3490;\nint *const p = &x;\nint *const q = &p; // More const!\n```\n\nAnd that\
    \ works, too. Now we can modify q, or the pointer q points to."
