  md: '# Chapter 16. Types IV: Qualifiers and Specifiers


    If we were to take out the restrict keywords, above, that would allow both calls
    to work safely. But the compiler might not be able to optimize.


    restrict has block scope, the restriction only lasts for the scope it is used.
    If it''s in a pointer list for a function, it''s in the block scope of function.


    If the restricted pointer points to an array, it only applies to the individual
    objects in the array. Other pointers could read and write from the array as long
    as they didn''t read or write any of the elements as the restricted one.


    If it''s outside any function in file, the restriction covers the entire program.


    You''re likely to see this in library functions like printf():


    ```

    int printf(const char * restrict format, ...);

    ```


    Again, that''s just telling the compiler that inside the printf() function, there
    will be only one pointer that refers to any part of that format string.


    One last: if you''re using array notation in your function parameter for some
    reason instead of pointer notation, you can use restrict like:


    ```

    void foo(int p[restrict])      // With no size

    void foo(int p[restrict 10])   // Or with a size

    ```


    But pointer notation would be more common.


    # 16.1.3 volatile


    You''re unlikely to see or need this unless you''re dealing with hardware directly.


    volatile tells the compiler that a value might change its behind the back and
    should be looked up every time.


    An example might be when the compiler is looking in memory at an address that
    continuously updates behind the scenes, e.g. some kind of hardware timer.


    If the compiler decides to optimize and store the value in a register for a protracted
    time, the value in memory will update and won''t be reflected in the register.


    By declaring something volatile, you''re telling the compiler, "Hey, the thing
    this points at change at any time for reasons outside this program code.",


    ```

    volatile int *p;

    ```


    # 16.1.4 _Atomic


    This is optional C feature that we''ll talk about in the Atomics chapter.


    # 16.2 Storage-Class Specifiers


    Storage-class specifiers are similar to type quantifiers. They give the compiler
    more information about the type of a variable.


    # 16.2.1 auto


    You barely ever see this keyword, since auto is the default for block scope variables.
    It''s implied.


    These are the same:'
