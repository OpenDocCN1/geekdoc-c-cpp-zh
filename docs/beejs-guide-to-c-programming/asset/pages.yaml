  md: '# Chapter 5. Pointers—Cower In Fear!


    # 5.6 A Note on Declaring Pointers


    The syntax for declaring a pointer can get a little weird. Let''s look at this
    example:


    ```

    int a;

    int b;

    ```


    We can condense that into a single line, right:


    ```

    int a, b; // Same thing

    ```


    So a and b are both ints. No problem.


    But what about this?


    ```

    int a;

    int *p;

    ```


    Can we make that into one line? We can. But where does the * go?


    The rule is that the * goes in front of any variable that is a pointer type. That
    is, the * is not part of the int in this example. it''s a part of p.


    With in mind, we can write:


    ```

    int a, *p; // Same thing

    ```


    It''s important to note that the following line does not declare two pointers:


    ```

    int *p, q; // p is a pointer to an int; q is just an int.

    ```


    ```

    int *p, q; // p is a pointer to an int; q is just an int.

    ```


    So a look at this and determine which variables are pointers and which are not:


    ```

    int *a, b, c, *d, e, *f, g, h, *i;

    ```


    I''ll drop the answer in a footnoteᵇ.


    # 5.7 sizeof and Pointers


    Just a line of syntax that might be confusing and you might see it from time to
    time.


    Recall that sizeof operates on the type of the expression.


    ```

    int *p;

    ```


    ```

    // Prints size of an ''int''

    printf("%zu\n", sizeof(int));

    ```


    ```

    // p is type ''int'', so prints size of ''int*''

    printf("%zu\n", sizeof(p));

    ```


    ```

    // p is type ''int'', so prints size of ''int''

    printf("%zu\n", sizeof(p));

    ```


    You might see this code in the wild with sizeof in there. Just remember that sizeof
    is all about the type of the expression, not the variables in the expression themselves.


    > ᵇ pointer type variables are a, d, f, and i, because those are the ones with
    * in front of them.'
