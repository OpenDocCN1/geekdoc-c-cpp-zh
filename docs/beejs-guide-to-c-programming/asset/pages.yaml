  md: '# Chapter 2


    # Hello, World!


    # 2.1 What to Expect from C


    "Where do these stairs go?"

    "They go up."

    —Ray Stanz and Peter Venman, Ghostbusters


    C is a low-level language.


    It didn''t use to be. Back in the day when people carved punch cards out of granite,
    C was an incredible way to be free of the drudgery of lower-level languages like
    assembly¹.


    But now in modern times, current-generation languages offer all kinds of features
    that didn''t exist in 1972 when C was invented. This means C is a pretty basic
    language with not a lot of features. It can do anything, but it can make you work
    for it.


    So why would we use it?


    +   * As a learning tool: not only is C a versatile piece of computing history,
    but it is connected to the bare metal² in what that present-day languages are
    not. When you learn C, you learn about how software interfaces with computer memory
    at a low level. There are no seatsbelts. You will write software that crashes,
    I assure you. And that''s all part of the fun!

    * As a useful tool: C is used for certain applications, such as operating systems³
    or in embedded systems⁴. (Though the Rust⁵ programming language is eyeing these
    fields!)


    If you''re familiar with another language that hangs up people pointers. Virtually
    everything is easy, but pointers are the weird one. The concept behind pointers
    is likely one you already know, but C forces you to be explicit about it, using
    operators you''ve never seen before.


    It''s especially insidious because you know go⁶ pointers, they''re suddenly easy.
    But until that moment, they''re slippery eels.


    > ¹https://en.wikipedia.org/wiki/Assembly_language

    ²https://en.wikipedia.org/wiki/flare_machine

    ³https://en.wikipedia.org/wiki/Operating_system

    ⁴https://en.wikipedia.org/wiki/Embedded_system

    ⁵https://en.wikipedia.org/wiki/Rust_(programming_language)

    ⁶https://en.wikipedia.org/wiki/Grok'
