  md: "# Chapter 7. Strings\n\n46\n\nThe behavior is undefined. Probably, depending\
    \ on your system, a crash will result.\n\nDeclaring it an array is different.\
    \ This is a mutable copy of the string that we can change at will:\n\n```\nchar\
    \ t[] = \"Hello, again!\"; // t is an array copy of the string\nt[0] = 'z'; //\
    \ No problem\n```\n\n```\nprintf(\"%s\\n\", t); // \"zello, again!\"\n```\n\n\
    So remember: if you have a pointer to a string literal, don't try to change it!\
    \ And if you use a string in doublenquotes to initialize an array, that's not\
    \ actually a string literal.\n\n# 7.5 Getting String Length\n\nYou can't, C doesn't\
    \ track it for. And when I say \"can't\", I actually mean \"can1\". There's a\
    \ function in <string.h> called strlen() that can be used to compute the length\
    \ of any string in bytes.\n\n```\n#include <stdio.h>\n#include <string.h>\n```\n\
    \n```\nint main(void)\n{\n    char *s = \"Hello, world!\";\n    printf(\"The string\
    \ is %zu bytes long.\\n\", strlen(s));\n}\n```\n\nThe strlen() function returns\
    \ size_t, which is an integer type you can use for integer math.\nprint size_t\
    \ with %zu.\n\nThe above program prints:\n\nThe string is 13 bytes long.\n\nGreat!\
    \ So it is possible to get the string length!\n\nBut... if C doesn't track the\
    \ length of the string, how does it know how long the string is?\n\n# 7.6 String\
    \ Termination\n\nC strings a little differently than many programming languages,\
    \ and in fact doesn't almost everynmodern programming language.\n\nWhen you're\
    \ making a language, you have two options for storing a string in memory:\n\n\
    +   1. Store the bytes of the string along with a number indicating the length\
    \ of the string.\n2. Store the bytes of the string, and mark the end of the string\
    \ with a special byte called the terminator.\n\nIf you wants longer than 255 characters,\
    \ one requires at least two bytes to store the string. Whereas\noption 2 only\
    \ requires two bytes to terminate the string. So a bit of saves there.\n\nOf course,\
    \ this seems ridiculous to worry about saving a byte (or 3—lots of languages will\
    \ happennlet you have strings that are 4 gigabytes in length). But back in the\
    \ day, it was a bigger deal.\n\nSo C took approach #2. In C, \"string\" is defined\
    \ by two basic characteristics:\n\n> ¹It is true that C doesn't track the length\
    \ of the strings.\n\n> ²If you're using the basic character or an 8-bit character\
    \ set, you're used to use one character one byte. This's not true in allncharacter\
    \ encodings, though."
