  md: "# Chapter 8. Structs\n\nsaturn.speed = 175;\nprintf(\"Name: %s\\n\", saturn.name);\n\
    printf(\"Price (USD): %f\\n\", saturn.price);\nprintf(\"Top Speed (km): %d\\n\"\
    , saturn.speed);\nThere on the first lines, we set the values in the struct car,\
    \ and in the next bit, we print those out.\n\n# 8.2 Struct Initializers\n\nThat\
    \ example in the previous section was a little undue. There must be a better way\
    \ to initialize that struct variable!\nYou can do it with an initializer by putting\
    \ values for the fields in the order they appear in the struct when you define\
    \ the variable. (This won't work after the variable has been defined—it has to\
    \ happen in the definition).\n\n```\nstruct car {\n    char *name;\n    float\
    \ price;\n    int speed;\n}\n```\n\n```\n// Now with an initializer! Same field\
    \ order as in the struct declaration:\nstruct car saturn = {\\Saturn SL/2\", 16000.99,\
    \ 175};\n```\n\n```\nprintf(\"Name: %s\\n\", saturn.name);\nprintf(\"Price: %f\\\
    n\", saturn.price);\nprintf(\"Top Speed: %d km\\n\", saturn.speed);\n```\n\nThe\
    \ fact that the fields in the initializer needs to be in the same order is a little\
    \ tricky. If someone changes the order in struct car, it could break all the other\
    \ code!\nWe can be more specific with our initializers:\n\n```\nstruct car saturn\
    \ = {.speed=175, .name=\"Saturn SL/2\"};\n```\n\nNow it's independent of the struct\
    \ declaration. This is safer code, for sure.\nSimilar to array initializers, any\
    \ missing field designators are initialized to zero (in this case, that would\
    \ be .price, which I've omitted).\n\n# 8.3 Passing Structs to Functions\n\nYou\
    \ can do couple things to pass a struct to a function.\n\n+   1. Pass the struct.\n\
    2. Pass a pointer to the struct.\n\nRecall that when you pass something to a function,\
    \ a copy of that thing gets for the function to operate on, whether it's a copy\
    \ of a pointer, an int, a struct, or anything.\n\nThere are basically two cases\
    \ when you want to pass a pointer to the struct:\n1. You need the function to\
    \ be able to make changes to the struct that was passed in, and have those changes\
    \ show in the caller."
