  md: "# Chapter 30. Variable-Length Arrays (VLAs)\n\n```\nscanf(\"%d\", &n);\n```\n\
    \n```\nint v[n];\n\nfor (int i = 0; i < n; i++)\n    v[i] = i * 10;\n\nfor (int\
    \ i = 0; i < n; i++)\n    printf(\"%d] = %d\\n\", i, v[i]);\n```\n\n(On line 7,\
    \ I have fflush()) that forces the line to output even though I don't have a newline\
    \ at the end.)\n\nLine 10 is where the VLA—once execution gets past that line,\
    \ the size of the array is set to whatever n was at runtime. The array can't be\
    \ changed.\n\nYou can put an expression in the brackets, as well:\nint v[x * 100];\n\
    \n+   - You can't declare a VLA at file scope, and you can't make a static one\
    \ in block scope.\n- You can't use an initializer list to initialize the array.\n\
    \nAlso, entering a negative value for the size of the array invokes undefined\
    \ behavior—in this, anyway.\n\n# 30.2 sizeof and VLAs\n\nWe're used to sizeof\
    \ using the size in bytes of any particular object, including arrays. VLAs have\
    \ no exception.\n\nThe main difference is that sizeof on a VLA is computed at\
    \ runtime, whereas on a non-variably-sized variable it is computed at compile\
    \ time.*\n\nBut the usage is the same.\n\nYou can even compute the number of elements\
    \ in a VLA with the usual trick:\nsize_t num_elems = sizeof v / sizeof v[0];\n\
    \nThere's a subtle and correct implication from the line above: pointer arithmetic\
    \ works just like you'd expect for a regular array. So ahead and use it to your\
    \ heart's content:\n\n```\n#include <stdio.h>\n\nint main(void)\n{\n    int n\
    \ = 5;\n    int v[n];\n\n    int *p = v;\n\n    *(p+2) = 12;\n    printf(\"%d\\\
    n\", v[2]); // 12\n```\n\n*This is due to how VLAs are typically allocated on\
    \ the stack, and the whole idea with VLAs is they'll be automatically deallocated\
    \ when the end of the function."
