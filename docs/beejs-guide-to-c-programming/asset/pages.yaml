  md: "# # Chapter 8\n\n# # Structs\n\nIn C, we have something called a struct, which\
    \ is a user-definable type that holds multiple pieces of data, potentially of\
    \ different types.\n\nIt's a convenient way to bundle variables into a single\
    \ one. This can be beneficial for passing variables to functions (so you just\
    \ have to pass one instead of many), and useful for organizing data and making\
    \ code more readable.\n\nIf you come from another language, you might be familiar\
    \ with the idea of classes and objects. These don't exist in C, natively¹. You\
    \ can think of a struct as a class with only data members, and no methods.\n\n\
    You can declare a struct in your code like so:\n\n```\nstruct car {\n  char *name;\n\
    \  float price;\n  int speed;\n};\n```\n\nThis is often done at the global scope\
    \ outside any functions that the struct is globally available.\n\nWhen you do\
    \ this, you're making a new type. The full name is struct car. (Not just car—that\
    \ won't work).\n\nThere aren't any variables of type that yet, but we can declare:\n\
    \n```\nstruct saturn; // Variable \"saturn\" of type \"struct car\"\n```\n\nAnd\
    \ we have an uninitialized variable saturn² of type struct car.\n\nWe should initialize\
    \ it! But how do we set the values of those individual fields?\n\nIn many other\
    \ languages that stole from C, we're going to use the dot operator (.) to access\
    \ the individual fields.\n\n```\nsaturn.name = \"Saturn SL/2\";\nsaturn.price\
    \ = 15999.99;\n```\n\n> ¹Although in C individual items in memory are referred\
    \ to as \"objects\", they're not objects in an object-oriented programming sense.\n\
    \n> ²The Saturn was a popular brand of economy car in the United States until\
    \ it was put out of business by the 2008 crash, sadly so to us fans."
  merge: -1
