  md: "# Chapter 9. File Input/Output\n\n# 54\n\nFor this reason, you should send\
    \ serious error messages to stderr instead of stdout.\n\nMore on how to do that\
    \ later.\n\n# 9.2 Reading Text Files\n\nStreams are largely categorized two different\
    \ ways: text and binary.\n\nText streams are allowed to do significant translation\
    \ of the data, most notably translations of newlines to their different representations¹.\
    \ Text files are logically a sequence of lines separated by newlines. To be portable,\
    \ your input data should always end with a newline.\n\nBut the general rule is\
    \ that you're able to edit the file in the regular text editor, it's a text file.\
    \ Otherwise, it's binary. More on binary later.\n\nSo let's get to—how we open\
    \ a file for reading, and pull data out of it?\n\nLet's create a file called hello.txt\
    \ that has just this in it:\n\nHello, world!\n\nAnd let's write a program to open\
    \ the file, read a character out of it, and then close the file when we're done.\
    \ That's the game plan!\n\n```\n#include <stdio.h>\n{\n    FILE *fp; // Variable\
    \ to represent open file\n    fp = fopen(\"hello.txt\", \"r\"); // Open file for\
    \ reading\n\n    int c = getchar(fp); // Read a single character\n    printf(\"\
    %c\\n\", c);   // Print to stdout\n\n    fclose(fp); // Close the file when done\n\
    }\n```\n\nTo see how we opened the file with fopen(), it returned the FILE so\
    \ we could use it later. (I'm leaving out for brevity, but fopen( ) will return\
    \ NULL if something goes wrong, file-not-found, so you should really check it!)\n\
    \nAlso notice that the \"r\" we passed means \"open a text stream for reading\"\
    . (There are various strings we can pass to fopen() with additional meaning, like\
    \ writing, or printing, and so on.)\n\nAfter that, we used the getchar() to get\
    \ a character from the stream. You might be wondering why I've made a c instead\
    \ of a char—that hold on!\n\nFinally, we close the stream when we're done with\
    \ it. All streams are automatically closed when the program exits, it's good and\
    \ good housekeeping to explicitly close any files yourself when done with them.\n\
    \nThe FILE keeps track of position in the file. Subsequent calls to getchar()\
    \ would get the next character in the file, and then the next, until the end.\n\
    \nBut that sounds like a pat. Let's see if we can make it easier.\n\n> ¹We used\
    \ to have three different newlines in effect: Carriage Return (CR, used on old\
    \ Macs), Linefeed (LF, used on Unix systems), and Carriage Return/Linefeed (CRLF,\
    \ used on Windows systems). Thankfully the introduction of OS X, being Unix-based,\
    \ reduced this number to two."
