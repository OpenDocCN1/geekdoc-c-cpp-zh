    \ We're almost there! There's just one more piece of boilerplate we have to add.\n\
    \n# 17.2 Dealing with Repeated Includes\n\nIt's not uncommon that a header file\
    \ will #include other headers needed for the functionality of its corresponding\
    \ C files. I mean, why not?\nAnd it could be that you have a header #included\
