  md: "# Chapter 34\n\n# Long Jumps with setjmp, longjmp\n\nWe've already seen goto,\
    \ which jumps in function scope. longjmp() allows you to jump back to an earlier\
    \ point in execution, back to a function that called this one.\n\nThere are a\
    \ lot of limitations and caveats, but this can be a useful function for bailing\
    \ out from deep in the call stack back up to an earlier state.\n\nIn my experience,\
    \ this is very rarely-used functionality.\n\n# 34.1 Using setjmp and longjmp\n\
    \nThe dance we're going to do here is basically put a bookmark in execution with\
    \ setjmp(). Later on, we'll call longjmp() and it jump back to the earlier point\
    \ in execution where we set the bookmark with setjmp().\n\nAnd it can do this\
    \ if you've called subfunctions.\n\nHere's a quick demo where we call functions\
    \ a couple levels deep and then bail out of it.\n\nWe're going to use a file variable\
    \ env to keep the state of things when we setjmp() so we can restore them when\
    \ we call longjmp(). This is in the variable we remember our \"place\".\n\nThe\
    \ variable env is jmp_buf, an opaque type declared in <setjmp.h>.\n\n```\n#include\
    \ <stdio.h>\n#include <setjmp.h>\njmp_buf env;\nvoid depth2(void)\n{\n    printf(\"\
    Entering depth 2\\n\");\n    longjmp(env, 3490); // Bail out\n    printf(\"Leaving\
    \ depth 2\\n\"); // This won't happen\n}\nvoid depth1(void)\n{\n    printf(\"\
    Entering depth 1\\n\");\n    depth2();\n    printf(\"Leaving depth 1\\n\"); //\
    \ This won't happen\n```"
