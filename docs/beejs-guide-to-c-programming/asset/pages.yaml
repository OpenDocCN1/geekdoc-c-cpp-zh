  md: "# Chapter 9. File/Output\n\n```\nint main(void)\n{\n    FILE *fp;\n    char\
    \ s[1024]; // Big enough for any line program will encounter\n    int linecount\
    \ = 0;\n\n    fp = fopen(\"quote.txt\", \"r\");\n\n    while (fgets(s, sizeof\
    \ s, fp) != NULL)\n        printf(\"%d: %s\", ++linecount, s);\n\n    fclose(fp);\n\
    }\n```\n\nWhich gives the output:\n\n+   1: A wise man can learn more from\n2:\
    \ a foolish question than a fool\n3: can learn from a wise answer.\n4: --Bruce\
    \ Lee\n\n# 9.4 Formatted Input\n\nYou know how you can get formatted output with\
    \ fprintf() (and, thus fscanf() like we'll see, below)\nYou do the same thing\
    \ with sscanf().\nLet's have a file with a series of data records in it. In this\
    \ case, whales, with name, length in meters, and weight in tonnes. whales.txt:\n\
    \n```\nblue 29.0 173\nright 20.7 135\ngray 14.9 41\nhumpback 16.0 30\n```\n\n\
    Yes, we could read these with gets() and then parse the string with sscanf() (and\
    \ in some ways that's more resilient against corrupted files), but in this case,\
    \ let's use fscanf() and pull it directly.\nThe fscanf() function skips whitespace\
    \ when reading, and returns EOF on end-of-file or error.\n\n```\n#include <stdio.h>\n\
    \nint main(void)\n{\n    FILE *fp;\n    char name[1024]; // Big enough for any\
    \ line program will encounter\n    float length;\n    int mass;\n\n    fp = fopen(\"\
