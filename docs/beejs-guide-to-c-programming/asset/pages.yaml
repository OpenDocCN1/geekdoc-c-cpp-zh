  md: '# Chapter 26


    # # Locale and Internationalization


    Localization is the process of making your app ready to work well in different
    locales (or countries).


    As you might know, not everyone uses the same character for decimal points or
    for thousands separators— or for currency.


    These locales have names, and you can select one to use. For example, a US locale
    might write a number like:


    100,000.00


    Whereas in Brazil, the same might be written with the commas and decimal points
    swapped:


    100.000,00


    Makes it easier to write your code if it ports to other nationalities with ease!


    Well, sort of. Turns out C has only one built-in locale, and it''s limited. The
    spec really leaves a lot of ambiguity here; it''s hard to be completely portable.


    But we''ll do our best!


    # 26.1 Setting the Localization, Quick and Dirty


    For these calls, include `<locale>`.


    There is basically one thing you can do here in terms of declaring a specific
    locale. This is likely what you want to do so that the program is going to do
    locale anything:


    ```

    setlocale(LC_ALL, ""); // Use this environment''s locale for everything

    ```


    You''ll want to call that so so that the program gets initialized with your current
    locale.


    Getting into more details, there is one more thing you can do and stay portable:


    but that''s by default every time your program starts, so there''s not much need
    to do it yourself.


    In that second string, you can specify any locale supported by your system. This
    is completely-dependent, so it will vary. On my system, I can specify this:


    And that''ll work. But it''s only portable to systems that have that exact name
    for that exact locale, and you can''t guarantee it.'
