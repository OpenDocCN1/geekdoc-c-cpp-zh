  md: '# Chapter 40


    # Atomics


    "They tried and failed, all of them?"

    "Oh, no." She shook her head. "They tried and died.",


    > Paul Atreides and The Reverend Mother Gaius Helen Mohiam, Dune


    This is one of the more challenging aspects of multithreading with C. But we''ll
    try to make it easy.


    Basically, I''ll talk about the more straightforward uses of atomic variables,
    what they are, and how they work,

    etc. And I''ll mention some of the insanely-complex paths that are available to
    you.


    But I won''t go down those paths. Not only am I barely qualified to write about
    them, but if I you

    know them, you already know more than I do.


    But there are some weird things out here in the basics. So buckle your seatbelt,
    everyone, ''cause

    Kansas is goin'' bye-bye.


    # 40.1 Testing for Atomic Support


    Atomics are an optional feature. There''s a macro__STDC_NO_ATOMICS__ that''s 1
    if you don''t have atomics.

    That might not exist pre-C11, so we should test the language version with __STDC_VERSION__.


    ```

    #if __STDC_VERSION__ < 201102L || __STDC_NO_ATOMICS__ == 1

    #define HAS_ATOMIC 0

    #else

    #define HAS_ATOMIC 1

    #endif

    ```


    If tests pass, then you can safely include <atomic.h>, the header on which the
    rest of this chapter

    is based. But if there is no atomic support, header might not even exist.


    On some systems, you might need to add -atomic to the end of your compilation
    command line to use any

    functions in the header file.


    # 40.2 Atomic Variables


    Here''s part of how atomic variables work:


    If you have a shared atomic variable and write to it from one thread, that will
    be all-or-nothing in

    different thread.


    > The __STDC_VERSION__ macro didn''t exist in early C89, so if you''re worried
    about that, check it with #ifdef.'
