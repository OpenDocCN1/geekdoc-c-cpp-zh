  md: "# 7.3 String Variables as Arrays\n\nAnother option is this, nearly equivalent\
    \ to the above char* usage:\n\n```\nchar s[14] = \"Hello, world!\";\n```\n\n```\n\
    // or, if we were properly lazy and have the compiler\n// figure the length for\
    \ us:\n```\n\n```\nchar s[ ] = \"Hello, world!\";\n```\n\nThis means you can use\
    \ array notation to access characters in a string. Let's do exactly that to print\
    \ all the characters in a string on the same line:\n\n```\n#include <stdio.h>\n\
    ```\n\n```\nint main(void)\n{\n    char s[] = \"Hello, world!\";\n\n    for (int\
    \ i = 0; i < 13; i++)\n        printf(\"%c\\n\", s[i]);\n}\n```\n\nNote that we're\
    \ using the format specifier %c to print a single character.\nAlso, check this\
    \ out. The program will still work fine if the definition of s to be a char* type:\n\
    \n```\n#include <stdio.h>\n\nint main(void)\n{\n    char *s = \"Hello, world!\"\
    ; // char* here\n\n    for (int i = 0; i < 13; i++)\n        printf(\"%c\\n\"\
    , s[i]); // But still use arrays here?\n}\n```\n\nAnd we can use array notation\
    \ to get the job done when printing it out! This is surprising, but is still only\
    \ because we haven't talked about array/pointer equivalence yet. But this is yet\
    \ another hint that arrays and pointers are the same, deep down.\n\n# 7.4 String\
    \ Initializers\n\nWe've already seen some examples with initializing string variables\
    \ with string literals:\n\n```\nchar *s = \"Hello, world!\";\nchar t[] = \"Hello,\
    \ again!\";\n```\n\nBut these two are absolutely different.\n\nThis is a pointer\
    \ to a string literal (i.e. a pointer to the first character in a string):\n\n\
    ```\nchar *s = \"Hello, world!\";\n```\n\nIf you try to mutate that with this:\n\
    \n```\nchar *s = \"Hello, world!\";\ns[0] = 'z'; // BAD NEWS: tried to mutate\
    \ a string literal!\n```"
