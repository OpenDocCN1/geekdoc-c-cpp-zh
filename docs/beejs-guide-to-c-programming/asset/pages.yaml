    289


    ```

    call_once() thrd_create() thrd_join()

    mtx_lock() mtx_timedlock()

    mtx_timedlock() mtx_trylock()

    malloc() calloc()

    aligned_alloc() dealloc() realloc()

    ```


    call_once()—Synchronizes with all subsequent calls to call_once() for a particular
    flag. This way subsequent calls can be assured that if another thread sets the
    flag, you will see it.


    thrd_create()—Synchronizes with the beginning of the new thread. The new thread
    can be sure it sees all shared memory writes from the parent thread before the
    thrd_create().


    thrd_join()—When a thread dies, it synchronizes with this. The thread that has
    called thrd_join() can be assured that it sees all the latest thread shared writes.


    mtx_lock()—Earlier calls to mtx_unlock() on the same mutex synchronize. This is
    the case that mirrors the acquire release process we''ve already talked about.
    mtx_unlock() performs a release on the mutex variable, any subsequent thread that
    makes an acquire with mtx_lock() can see all shared memory changes in the critical
    section.


    mtx_timedlock() and mtx_trylock()—Similar to the synchronization with mtx_lock(),
    if this succeeds, earlier calls to mtx_unlock() synchronize with this one.


    **Dynamic Memory Functions**: If you allocate memory, it synchronizes with the
    previous deallocation of that same memory. All allocations and deallocations of
    that particular memory region in a single total order that all threads can agree
    upon. I think the idea here is that the deallocation will happen in the region
    it chooses, and we want to be sure that a subsequent allocation doesn''t see the
    non-wiped data. Someone let me know if there''s out.


