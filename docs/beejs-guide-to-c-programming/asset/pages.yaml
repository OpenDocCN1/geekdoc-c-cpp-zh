    \ variable so that we don't share that data.\n\n```\nint run(void *arg)\n n =\
    \ *(int*)arg; // Thread number for humans to differentiate\n\nfree(arg);\n\nthread_local\
    \ static int foo = 10; // No longer shared!!\n```\n\nAnd running we get:\n\nThread\
    \ 0: x = 10, foo = 10\nThread 1: x = 10, foo = 10\nThread 2: x = 10, foo = 10\n\
    Thread 4: x = 10, foo = 10\nThread 3: x = 10, foo = 10\n\nNo more weird problems!\n\
    \nOne thing: if a thread_local variable is block scope, it must be static. Them's\
    \ the rules. (But this is OK because non-static variables are per-thread already\
    \ since each thread's its own non-static variables.)\n\nA bit of a lie there:\
    \ block scope thread_local variables can also be extern.\n\n# 39.6.2 Another Option:\
    \ Thread-Specific Storage\n\nThread-specific storage (TSS) is another way of getting\
    \ per-thread data.\nOne additional feature is that these functions allow you to\
