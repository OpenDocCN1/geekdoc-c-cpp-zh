  md: "# Chapter 20. structs II: More Fun with structs\n\nI want to be clear that\
    \ the first part of the section is the old way of doing things, and we're going\
    \ to do things the new way after that.\n\nFor example, maybe you could define\
    \ a struct for holding strings and the length of that string. It would have a\
    \ length and an array to hold the data. Maybe something like this:\n\n```\nstruct\
    \ len_string {\n  int length;\n  char data[8];\n};\n```\n\nBut that has 8 hardcoded\
    \ as the maximum length of a string, and it's not much. What if we did something\
    \ clever and just malloc() some extra space at the end of the struct, and then\
    \ let the data overflow into that space?\n\nLet's do that, and then allocate 40\
    \ bytes on top of it:\n\n```\nstruct len_string *s = malloc(sizeof *s + 40);\n\
    ```\n\nBecause data is the last field of the struct, if we overflow that, it runs\
    \ out into that space that we already allocated! For this trick, this only works\
    \ if the short array is the last field in the struct.\n\n// Copy more than 8 bytes!\n\
    \n```\nstrcpy(s->data, \"Hello, world!\"); // Won't crash. Probably.\n```\n\n\
    In fact, this was a common compiler workaround for doing this, where you'd allocate\
    \ a zero length array at the end:\n\n```\nstruct len_string {\n  int length;\n\
    \  char data[];\n};\n```\n\nAnd then every extra byte you allocate was ready for\
    \ use in that string.\n\nBecause data is the last field of the struct, if we overflow\
    \ that, it runs out into that space that we already allocated!\n\n// Copy more\
    \ than 8 bytes!\n\n```\nstrcpy(s->data, \"Hello, world!\"); // Won't crash. Probably.\n\
    ```\n\nBut, of course, actually accessing the data beyond the end of that array\
    \ is undefined behavior! In modern times, we no longer need to resort to such\
    \ savagery.\n\nLikely for us, we can still get the same effect with C99 and now\
    \ it's legal.\n\nLet's just change our definition to have no size for the array¹:\n\
    \n```\nstruct len_string {\n  int length;\n  char data[];\n};\n```\n\nAgain, this\
    \ only works if the flexible array member is the last field in the struct.\n\n\
    And then we can allocate the space we want for strings by malloc() larger than\
    \ the struct len_string, as we do in this example that makes a new struct len_string_from_c_string\
    \ from a C string:\n\n```\nstruct len_string *len_string_from_c_string(char *s)\n\
    {\n```\n\n> ¹Technically we say that it has an incomplete type."
