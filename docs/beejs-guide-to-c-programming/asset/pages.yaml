  md: '# Chapter 36


    # Complex Numbers


    A tiny primer on Complex numbers¹ stolen directly from Wikipedia:


    **A complex number** is a number that can be expressed in the form $a + bi$, where
    $a$ and $b$ are real numbers [i.e. floating point types in C], and $i$ represents
    the imaginary unit, satisfying the equation $i^2 = -1$. Because no real number
    satisfies this equation, $i$ is called an imaginary number. For the complex number
    $a + bi$, $a$ is called the **real part**, and $b$ is called the **imaginary part**.


    But that''s as far I''m going to go. We''ll assume that you''re reading this chapter,
    you know what a complex number is and what you want to do with them.


    And all we need to cover is C''s faculties for doing so.


    Turns out, that complex number support in a compiler is an *optional* feature.
    Not all compliant compilers can do it. And the ones that do, might do to various
    degrees of completeness.


    You can test if your system supports complex numbers with:


    ```

    #ifdef _STDC_NO_COMPLEX_

    #error Complex numbers not supported!

    #endif

    ```


    Furthermore, there is a macro that indicates adherence to the ISO 60559 (IEEE
    754) for floating point math with complex numbers, as well as the presence of
    the _Complex imaginary type.


    ```

    #if _STDC_IEC_559_COMPLEX != 1

    #error Need IEC 60559 complex support!

    #endif

    ```


    More details on that are spelled out in Annex G in the C11 spec.


    # 36.1 Complex Types


    To use complex numbers, #include <complex.h>.


    With that, you have two least types:


    ```

    _Complex

    complex

    ```


    > ¹https://en.wikipedia.org/wiki/Complex_number'
