    }\n```\n\nFun fact: if you do this, you can use the . operator right off the function\
    \ call:\n\n```\nprintf(\"%d %d\\n\", f().x, f().y);\n```\n\n(Of course example\
    \ calls the function twice, efficiently.)\n\nAnd the same holds true for returning\
    \ pointers to structs and unions—just be sure to use the -> operator in that case."
