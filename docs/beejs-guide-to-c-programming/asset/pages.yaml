  md: '# # Chapter 7


    # # Strings


    Finally! Strings! What could be simpler?


    Well, turns out strings aren''t actually strings in C. That''s right! They''re
    pointers! Of course they are!


    Much like arrays, strings in C barely exist.


    But let''s check it out—it''s not really such a big deal.


    # ## 7.1 String Literals


    Before we start, let''s talk about string literals in C. These are sequences of
    characters in double quotes ("). (Single quotes enclose characters, and are a
    different animal entirely.)


    Examples:


    ```

    "Hello, world!\n"

    "This is a test."

    "When asked if this string had quotes in it, she replied, \"It does.\""

    ```


    The first one has a newline at the end—quite a common thing to see.


    The last one has quotes embedded within it, but you see each preceded by (we "escaped
    by") a backslash (\) indicating that a literal quote belongs to the string at
    this point. This is how the C compiler can tell the difference between printing
    a double quote and the double quote at the end of the string.


    # ## 7.2 String Variables


    Now we know how to make a string literal, let''s assign it to a variable so we
    can do something with it.


    ```

    char *s = "Hello, world!";

    ```


    Check out that type: pointer to a char. The string s is actually a pointer to
    the first character in that string, named the H.


    And we can print it with the %s (for "string") format specifier:


    ```

    char *s = "Hello, world!";


    printf("%s\n", s); // "Hello, world!"

    ```'
