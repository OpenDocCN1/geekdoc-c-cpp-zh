    \ use a way to skip the variable by passing in (parameter names listed above).\
    \ Check it out—we're replacing the variable with an unnamed object that we are\
    \ passing as the first argument:\n\n```\n// p[]           count\n// |----------|\
    \  |\nint s = sum((int){1, 2, 3, 4}, 4);\n```\n\nPretty slick!\n\n# 32.1.2 Unnamed\
    \ structs\n\nWe can do something without structs.\n\nFirst, let's do things without\
