  md: 'Chapter 40. Atoms


    # 40.13.2 Acquire


    This is what happens on a load/read operation on an atomic variable.


    +   - If another thread released this atomic variable, all the writes that thread
    did are now visible in this thread.

    - Memory accesses in this thread that happen after this load can''t be reordered
    before it.


    # 40.13.3 Release


    This is what happens on a store/write of an atomic variable.


    +   - If another thread acquires this atomic variable, all memory writes in this
    thread before atomic write become visible to that other thread.

    - Memory accesses in this thread that happen before the release can''t be reordered
    after it.


    # 40.13.4 Consume


    This is an old one, similar to a less-strict version of acquire. It affects memory
    accesses that are data-dependent on the atomic variable.


    Being “data dependent” vaguely means that the atomic variable is used in a calculation.


    That is, if a thread consumes an atomic variable then all operations in that thread
    that go on to use that atomic variable will be able to see the memory writes in
    the releasing thread.


    Compare with acquire memory writes in the releasing will be visible to all operations
    in the current thread, not just the data-dependent ones.

    Also acquire, there is a restriction on what operations can be reordered before
    consume. With acquire, you couldn''t reorder anything before it. With consume,
    you can''t reorder anything that depends on the loaded atomic value before.


    # 40.13.5 Acquire/Release


    This only applies to read-modify-write operations. It''s an acquire and release
    bundled into one.


    +   - An acquire happens for the read.

    - A release happens for the write.


    # 40.13.6 Relaxed


    No rules; it''s anarchy! Everyone can reorder everything! Dogs and cats living
    together—mass hysteria!

    Actually, there is a rule. Atomic reads and writes are all-or-nothing. The operations
    can be reordered whimsically and there is zero synchronization between threads.


    There are a few cases for this memory order, which you can find with a tiny bit
    of searching, e.g. simple counters.


    And you can use a fence to force synchronization after a bunch of relaxed writes.


    # 40.14 Fences


    You know the releases and acquires of atomic variables occur as you read and write
    them?


    Well, it’s possible to do a release or acquire without an atomic variable, as
    well.'
