- pgno: 17
  md: 'Chapter 2. Hello, World!


    # 2.3 Compilation Details


    Let''s talk a bit about how to build C programs, and what happens behind the scenes
    there.


    Like other languages, C has source code. But, depending on what language you''re
    coming from, you might never have had to compile your source code into an executable.


    Compilation is the process of taking your source code and turning it into a program
    that your operating system can execute.


    JavaScript and Python aren''t used to a separate compilation step at all-though
    behind the scenes it''s! Python compiles your source code into something bytecode
    that the Python virtual machine executes. Java devs are used to compilation, but
    that produces bytecode for the Java Virtual Machine.


    When compiling C, machine code is generated. It is the 1s and 0s that can be executed
    directly and quickly by the CPU.


    Languages that typically aren''t compiled are interpreted languages. But with
    Java and Python, they also have a compilation step. And there''s no rule saying
    that C can''t be interpreted (There!) it''s a bunch of gray areas. Compilation
    in general is just taking source code and turning it into another, more easily-executed
    form.


    The compiler is the program that does the compilation.


    As we''ve already stated, gcc is a compiler that''s installed on a lot of Unix-like
    operating systems¹². And it''s commonly run from the command line in a terminal,
    but not always. You can run it from your IDE, as well.


    So how do we build lines?


    # 2.4 Building with gcc


    If you have a source file hello.c in the current directory, you can build that
    into a program called hello with hello.c typed in a terminal:


    ```

    gcc -o hello.c

    ```


    The -o means "output to file"³. And there''s hello.c at the end, the name of the
    file we want to compile.


    If your source is broken up into multiple files, you can compile them together
    (almost as if they were one file, but the rules are actually more complex than
    that) by putting all .c files on the command line:


    ```

    gcc -o awesomegal ui.c characters.c npc.c items

    ```


    and they''ll all get built into a big executable.


    That''s enough to get started—we''ll tell details about multiple source files,
    object files, and all kinds of fun stuff.


    # 2.5 Building with clang


    On Macs, the stock compiler isn''t gcc—it''s clang. A wrapper is also installed
    so you can run gcc and have it work.


    You can also install the gcc compiler through Homebrew¹⁴ or other methods.


    > ¹²https://en.wikipedia.org/wiki/Unix


    > ¹³If you don''t give it an output filename, it will export to a file called
    .out by default—this filename has its roots deep in Unix history.


    > ¹⁴https://formulae.sh/formula/gcc'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 2.6 Building from IDEs


    If you''re using an Integrated Development Environment (IDE), you probably don''t
    have to build from the command line.


    With Visual Studio, CTRL-F7 you can build and CTRL-F5 will run.


    With VS Code, you can hit F5 to run via the debugger. (You''ll have to install
    the C/C++ Extension.)


    With Xcode, you can build with COMMAND-B and run with COMMAND-R. To get the command
    line tools, Google for "Xcode command line tools" and you''ll find instructions
    for installing them.


    For getting started, I encourage you to also try to build from the command line—it''s
    history!


    # 2.7 C Versions


    C has come long way over the years, and it has many named version numbers to describe
    which dialect of the language you''re using.


    These generally refer to the year of the specification.


    The most famous are C89, C99, C11, and C2x. We''ll focus on the latter in this
    book.


    But here''s a complete table:


    | Version | Description |

    | --- | --- |

    | K&R C | 1978, the original. Named after Brian Kernigh and Dennis Ritchie. Ritchie
    designed and coded the language, and Kernigh co-authored the book on it. You rarely
    see K&R code today. If you do, it''ll look odd, like Middle English looks to modern
    readers.

    | C89, ANSI C, C90 | In 1989, the American National Standards Institute (ANSI)
    produced a C language specification that set the tone for C that persists to this
    day. A year later, the reins were handed to the International Organization for
    Standardization (ISO) that produced the identical C90.

    | C99 | A rarely-mentioned addition to C89 that included character support. The
    big overhaul with lots of language additions. The most people remember the addition
    of //+ comments. This is the most popular version of C in use of this writing.

    | C11 | This major version includes Unicode support and multi-threading. Be advised
    that if you use these language features, you might be sacrificing portability
    with places that are still in C99. But, honestly, 1999 is getting to be a while
    back now.

    | C17, C18 | Bugfree update to C17 seems to be the official name, but the publication
    was delayed until 2018. As far as I can, these are interchangeable, with C18 being
    preferred.

    | C2x | What''s coming next! Expected to eventually become C23.


    You can force GCC to use one of these standards with the -std=c command line argument.
    If you want to be picky about standard, -pedantic.


    For example:


    ```

    gcc -std=c11 pediatric foo.c

    ```


    For this book, I compile programs for C2x with all warnings set:


    ```

    gcc -Wall -Wextra -std=c2x -pedantic foo.c

    ```'
