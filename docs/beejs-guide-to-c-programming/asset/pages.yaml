  md: "# Chapter 19. The C Preprocessor\n\n| Macro | Description |\n| _STDC_LIB_EXT1_\
    \ | 1 if this implementation supports a variety of “safe” alternate standard library\
    \ functions (they have _s suffixes on the name) |\n| _STDC_NO_ATOMICS_ | 1 if\
