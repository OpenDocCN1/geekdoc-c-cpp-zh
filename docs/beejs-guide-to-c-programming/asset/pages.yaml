  md: "# Chapter 31\n\n# goto\n\nThe goto statement is universally revered and can\
    \ be here presented without contest.\n\nJust kidding! Over the years, there has\
    \ been a lot of back-and-forth whether or not (often not) to goto is considered\
    \ harmful¹.\n\nIn this programmer's opinion, you should use whichever constructs\
    \ leads to the best code, factoring in main-tainability and some times this might\
    \ be goto!\n\nIn this chapter, we'll see how goto works in C, and then check out\
    \ some the common cases where it is used².\n\n# 31.1 A Simple Example\n\nIn this\
    \ example, we're going to use goto to skip a line of code and jump to a label.\
    \ The label is the identifier that can be a goto target—it ends with a colon (:).\n\
    \n```\n#include <stdio.h>\n\nint main(void)\n{\n    printf(\"One\\n\");\n    printf(\"\
    Two\\n\");\n\n    goto skip_3;\n\n    printf(\"Three\\n\");\n\nskip_3:\n    printf(\"\
    Five\\n\");\n}\n```\n\nThe output is:\n\nOne\nTwo\nFive!\n\n> ¹https://en.wikipedia.org/wiki/Goto#Criticism\n\
    \n> ²I'd like to point out that using goto in all these cases is avoidable. You\
    \ can use variables and loops instead. It's just that some people think goto produces\
    \ the best code in those circumstances."
