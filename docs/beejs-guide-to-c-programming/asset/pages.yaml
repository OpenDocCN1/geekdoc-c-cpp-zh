  md: "# Chapter 39. Multithreading\n\nThread running! 7\nThread running! 8\nThread\
    \ running! 9\n\nIf you need multiple mutexes, no problem: just have multiple variables.\n\
    \nAnd always remember the One Rule of Multiple Mutexes: Unlock mutexes in the\
    \ opposite order in which you lock them!\n\n# 39.7.1 Difference Mutex Types\n\n\
    As hinted, we have a few mutex types that you can create with mtx_init(). (Some\
    \ of these types are the result of a bitwise-OR operation, as noted in the table.)\n\
    \n| Type | Description |\n| --- | --- |\n| mtx_plain | Regular ol' mutex |\n|\
    \ mtx_timed | Mutex that supports timeouts |\n| mtx_plain|mtx_recursive | Recursive\
    \ mutex |\n| mtx_timed|mtx_recursive | Recursive mutex that supports timeouts\
    \ |\n\n\"Recursive\" means the holder of a lock can call mtx_lock() multiple times\
    \ on the same lock. They have to unlock an equal number of times before anyone\
    \ else can take the mutex. This might ease coding from time, especially if you\
    \ call a function that needs to lock the mutex when you already hold the mutex.\n\
    \nAnd the timeout gives a thread a chance to get the lock for a while, but then\
    \ bail out if it can't get it in that timeframe.\n\nFor timeout mutex, be sure\
    \ to create it with mtx_timed:\nmtx_init(&serial_mtx, mtx_timed);\n\nAnd when\
    \ you want it, you have to specify a time in UTC when it will unlock.\n\nThe function\
    \ times_get() from <time.h> can be of assistance here. It'll get the current time\
    \ in UTC in a struct timespec which what we need. In fact, it seems to exist merely\
    \ for this purpose.\n\nIt has two fields: tv_sec has the current time since epoch,\
    \ and tv_nsec has the nanoseconds (billions of a second) as the \"fractional\"\
    \ part.\n\nSo you can use the current time, and add it to get a specific timeout.\n\
    Then call mtx_timedlock() instead of mtx_lock(). If it returns the value thrd_timeout,\
    \ it is timed out.\nstruct timespec;\n\n```\ntimespec_get(&timeout, UTC);    //\
    \ Get current time\ntimeout.tv_sec += 1;                   // Timeout 1 second\
    \ after now\n```\n\n```\nint result = mtx_timedlock(&serial_mtx, &timeout);\n\n\
    if (result == thrd_timeout) {\n    printf(\"Mutex lock timed out!\\n\");\n}\n\
    ```\n\nOther than that, timed locks are the same as regular locks.\n\n> You might\
    \ have expected it to be \"time from now\", but you'd just like to think that,\
