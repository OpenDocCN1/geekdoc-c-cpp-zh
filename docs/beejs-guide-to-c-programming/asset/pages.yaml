  md: "# Chapter 16. Types IV: Qualifiers and Specifiers\n\n```\n// | |\n// int* const\
    \ int*\n```\n\nThe compiler is warning us that the value on the right side of\
    \ the assignment is const, but one of the left is not. And the compiler is letting\
    \ us know that it is discarding “const-ness” of the expression on the right.\n\
    \nThat is, we can still try to do the following, but it’s just wrong. The compiler\
    \ will warn, and it’s undefined behavior:\n\n```\nconst int x = 20;\nint *p =\
    \ &x;\n```\n\n```\n*p = 40; // Undefined behavior--maybe it modifies \"x\", maybe\
    \ not!\nprintf(\"%d\\n\", x); // 40, if you're lucky\n```\n\n# 16.12 restrict\n\
    \nTLDR: you never have to use this and can ignore it every time you see it. If\
    \ you use it correctly, you will realize some performance gain. If you use it\
    \ incorrectly, you will realize undefined behavior.\nrestrict is a hint to the\
    \ compiler that a particular piece of memory will only be accessed by one pointer\
    \ and never another. If a developer declares a pointer to be restrict and then\
    \ accesses the objects it points to in another way (e.g. via another pointer),\
    \ the behavior of the restrict pointer is undefined.\n\nC uses that information\
    \ to perform certain optimizations. For instance, if you are dereferencing the\
    \ restrict pointer in a loop, C might decide to cache the result and only store\
    \ the final result after the loop completes. If any other pointer referred to\
    \ that memory and accessed it in the loop, the result would not be accurate.\n\
    \n(Note that restrict has no effect on the object pointed to is never written\
    \ to. It’s all about optimizations surrounding memory.)\n\nLet’s write a function\
    \ to swap two variables, and we use the restrict keyword to assure C that never\
    \ passes pointers to the same thing. And then let’s blow it by trying pass pointers\
    \ to the same thing.\n\n```\nvoid swap(int *restrict a, int *restrict b)\n{\n\
    \    int t;\nt = *a;\n*a = *b;\n*b = t;\n}\n```\n\n```\nint main(void)\n{\n  \
    \  int x = 10, y = 20;\n\nswap(&x, &y); // OK! \"a\" and \"b\", point to different\
    \ things\n\nswap(&x, &x); // Undefined behavior! \"a\" and \"b\" point to the\
    \ same thing\n}\n```"
  merge: -1
