    \ off.\n\nIt's up to you a programmer to figure out which type you're going to\
    \ pass to va_arg(). In the above example, we just did. In case of printf(), it\
    \ uses the format string to determine which type you pull off.\n\nAnd when you\
    \ call va_end() to wrap it up. You must (the spec says) call on this particular\
    \ va_list variable before either call va_start() or va_copy() again. I know we\
    \ haven't talked about va_copy() yet.\n\nSo the standard progression is:\n\n+\
    \   * va_start() to initialize your va_list variable\n* va_arg() to get the values\n\
    * va_end() to deinitialize your va_list variable\n\nI mentioned va_copy() because\
    \ it makes a copy of your va_list variable in the exact same state. If you've\
