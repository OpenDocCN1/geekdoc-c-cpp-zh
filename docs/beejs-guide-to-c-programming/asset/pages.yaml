- pgno: 255
  md: "# 35.4 Use Case: Arrays in Header Files\n\nIt can be useful to declare incomplete\
    \ array types in header files. In those cases, the actual storage (where the complete\
    \ array is declared) should be in a single .c file. If you put it in the .h file,\
    \ it will be duplicated every time the header file is included.\n\nSo what you\
    \ do make a header file with an incomplete type that refers to the array, like\
    \ so:\n\n```\n// File: bar.h\n#ifndef BAR_H\n#define BAR_H\n\nextern int my_array[];\
    \ // Incomplete type\n\n#endif\n```\n\nAnd in the .c file, actually define the\
    \ array:\n\n```\n// File: bar.c\nint my_array[1024]; // Complete type!\n```\n\n\
    Then you can include the header from as many places as you'd, and every one of\
    \ places will refer to the same underlying my_array.\n\n```\n// File: foo.c\n\
    #include <stdio.h>\n#include \"bar.h\" // includes the incomplete type for my_array\n\
    \nint main(void) {\n    my_array[0] = 10;\n\n    printf(\"%d\\n\", my_array[0]);\n\
    }\n```\n\nWhen compiling files, remember to specify all the .c files to the compiler,\
    \ but not the .h files, e.g.:\ngcc -o foo foo.c bar.c\n\n# 35.5 Completing Incomplete\
    \ Types\n\nIf you have an incomplete type, you can complete it by defining the\
    \ complete struct, union, enum, or array in the same scope.\n\n```\nstruct foo\
    \ // incomplete type\nstruct foo *p; // pointer, no problem\nstruct foo foo; //\
    \ Error: incomplete type\n\nstruct foo {\n    int x, y, z;\n};\\ Now the struct\
    \ foo is complete!\n\nstruct foo foo; // Success!\n```"
  merge: -1
  img_proc: true
