  md: 'Unlike procedural programming and the C struct, a class can also have behavior.
    For instance, you are an instance of a Human. You encapsulate the data required
    as a human; you have a heart, lungs, bones, and muscle. However, you can exhibit
    behavior; you can run, walk, skip, jump. Nobody performs these tasks for you;
    you—the object instance of a Human—perform these tasks. In an object-oriented
    program, classes are no different than a Human—they encapsulate data and behavior
    into one construct. Objects are no different than you and I, instances of a human.


    After preliminarily analyzing a problem''s objects, as in Figure 4-3 earlier,
    you analyze how those objects interact with one another. This analysis determines
    each object''s behavior during a problem''s duration.


    # Class Interaction


    After determining a problem''s basic activity (Figure 4-2) and a preliminary conceptual
    object model (Figure 4-3), you should start analyzing how the objects interact
    with one another to solve the problem. A good modeling technique/diagram for this
    analysis is a sequence diagram. A sequence diagram models object interactions
    as a sequence of steps to accomplish some larger task. Figure 4-6 shows how I
    envision object instances from the classes in Figure 4-3 interacting.


    ![](img/b18903248e3f72f9f244af0aa5762631_104_0.png)


    Figure 4-6 A sequence diagram capturing the classes'' interactions'
