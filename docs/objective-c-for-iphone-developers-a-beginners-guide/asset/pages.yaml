  md: "# Listing 11-11 Modifying dealloc to removeObserver\n\n```\n(void)dealloc {\n\
    \  [fb release];\n  [NSNotificationCenter defaultCenter] removeObserver:self.myActivity];\n\
    \  [myActivity release];\n  super dealloc];\n}\n```\n\nIn this example SelectorDelayViewController\
    \ registers itself as an observer of all \"longMethodDone\" notifications. When\
    \ SelectorDelayViewController's views appears, it fully loads the view because\
    \ it runs the longMethod on the background thread.\n\n```\nfb performSelectorInBackground:@selector(longMethod)\
    \ withObject:nil;\n```\n\nNotice that the longMethod has no memory management\
    \ needs. It loops through 5000 iterations, logging a period to the debugger console.\
    \ In the meantime, while it is processing, your application is still responsive.\
    \ You could have used the performSelector:withObject:afterDelay: method to achieve\
    \ the same results.\n\n# Delegates\n\nNotifications are one way you might alert\
    \ another object that a particularly long method has completed. Another technique,\
    \ arguably better, is using a delegate. How it works is that you have a class\
    \ adopt protocol, where the protocol is the delegate. Then in the performSelector:\
    \ method, you pass the delegate as a parameter. The method invoked by the selector\
    \ then sends a message to the delegate when completed.\n\nRecall how you declare\
    \ a method that takes a protocol as a parameter.\n\n```\n(void)method:(id<FooBarDelegate>)delegate;\n\
    ```\n\nYou can invoke a method using the performSelector:method, then pass the\
    \ delegate as the object parameter. Because you know the method adopts the FooBarDelegate\
    \ protocol, the invoked method can then invoke one of FooBarDelegate's methods,\
    \ without worrying about the passed object not implementing it. The following\
    \ Try This illustrates."
