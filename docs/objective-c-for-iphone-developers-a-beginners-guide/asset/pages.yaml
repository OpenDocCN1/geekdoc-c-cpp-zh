  md: '# # No Overriding Instance Variables


    Remember, properties are nothing more than instance variables with accessor methods.
    Although you can override accessor methods, you cannot override instance variables.
    For instance, if you tried to create a count variable in Ball, Football, or Basketball,
    you would obtain the following compiler error: "error: duplicate member ''myCount''."
    You cannot redefine a parent''s instance variables with a child class instance
    variables.


    # # Method Overloading


    In a language as Java, you have an object-oriented principle called overloading.
    Overloading allows creating a method of the same name, but with different parameters.
    For instance, you might have the following two methods in a Java class:


    ```

    public void playSound(String soundURL);

    public void playSound(int soundID);

    ```


    Although languages such as Java allow creating two methods with the same name,
    Objective-C does not allow overloading. You cannot, for instance, have the following
    two methods in the same Objective-C class:


    +   - (void) playSound:(NSString*) soundURL;

    - (void) playSound:(int) soundID);


    Instead, you follow a loose convention that incorporates the parameter''s type
    into the name. For instance, the playsound methods would be modified to incorporate
    the parameters.


    +   - (void) playSoundFromURL:(NSString*) soundURL;

    - (void) playSoundFromInt:(int) soundID);


    You see this pattern in the Foundation framework classes, particularly the init
    method. For instance, the NSString''s initWithFormat: and initWithString: are
    examples of this convention. Now, before you hold up a method such as NSString''s
    initWithFormat: as an example of method overloading, recall the discussion on
    method syntax from Chapter 5. NSString actually has only one initWithFormat method;
    the other methods'' names are initWithFormat:arguments::, initWithFormat:locale:,
    and initWithFormat:locale:arguments::. Each of these is a distinct method name.'
