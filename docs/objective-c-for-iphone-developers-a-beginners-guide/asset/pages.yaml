    In this chapter, you explore Objective-C’s primitive data types and operators.
    Objective-C’s primitive data types and operators are the same as C’s. Therefore,
    if you understand C’s primitive data types, you also understand Objective-C’s
    primitive data types. After exploring Objective-C’s primitive data types, you
    explore Objective-C’s operators. Like the primitive data types, Objective-C’s
    operators are the same as C’s.


    # Primitive Data Types


    A data type tells a computer the data type a variable is to represent. By telling
    a computer variable''s type, the data type is informing the computer how much
    memory it must reserve for a variable and the range of possible values a variable
    might contain.


    > NOTE


    Realize how much memory is required—and how many values a primitive data type
    can represent—might vary on different platforms. However, in this book, as you
    are using the iPhone SDK, I can assume you are using an Intel-based Mac running
    OS X Snow Leopard. And so I can confidently state each data type’s size and value
    range.'
