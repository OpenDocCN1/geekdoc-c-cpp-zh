  md: '# Objective-C for iPhone Developers: A Beginner’s Guide


    # NOTE


    The official terminology for the runtime behavior in Figure 6-4 is "message dispatching."


    Notice that just for fun, you threw in the isKindOfClass, isSubclassOfClass, and
    respondsToSelector methods in Listing 6-9. The isKindOfClass method checks if
    an object is an instance of a class or an instance of one of a class’ classes.
    The isSubclassOfClass checks if a class is a subclass of another class. The respondsToSelector
    method checks if a class can respond to a message sent to it. In this example,
    all three return 1, or YES. Note that neither Orange nor Fruit implements a foo
    method, and so the respondsToSelector for foo returns 0, or NO.


    The important concept to take from this example is how inheritance works. Child
    classes inherit the instance variables and methods of their parent. They also
    inherit from every one of their ancestors.


    # Ancestry Inheritance


    If you haven’t surmised by now, child classes inherit the instance variables and
    methods from every class in their ancestor hierarchy. Moreover, when a message
    is dispatched to a child class, if the runtime doesn’t find the method, it searches
    the class’ inheritance hierarchy until it finds the method or reaches the child’s
    root class. For instance, consider Figure 6-5.


    Suppose you had an object that sent the isKindOfClass message to a Fuji instance.
    When the runtime fails to find the method in Fuji, it then checks Apple. It continues
    searching up the inheritance hierarchy until it finds the method in NSObject and
    calls it.


    # Inheriting Properties


    Before discussing inheriting properties, note that in reality, a child class inherits
    its parent’s instance variables and methods, not its properties. After all, properties
    are nothing more than instance variables and accessor methods.


    Good object-oriented programming dictates that you practice encapsulation even
    between parent and child classes. You should not access a parent’s instance variables
    directly. Instead, you should access them through accessor methods. Properties
    are the easiest way to generate accessor methods for instance variables, and so
    the next example illustrates using properties between classes.'
