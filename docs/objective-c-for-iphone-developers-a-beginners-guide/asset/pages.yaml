  md: '# Chapter 11: Selectors and Targets 301


    # CAUTION


    If you use a performSelector variant that runs a method on a different thread,
    note that the thread does not use the application''s main autorelease pool. You
    must either manually manage the memory of all methods called in the new thread
    or create a new autorelease pool for the thread.


    Consider the following code in a UIViewController''s viewWillAppear: method.


    ```

    [self performSelector:@selector(reallyLongMethod)withObject:nil afterDelay:.05]

    ```


    In this code, you are using the performSelector:withObject:afterDelay method to
    perform the selector after a 0.05 second delay. This might seem short to you and
    to a computer processor, this is a lifetime. The result is that the long-running
    method is fired milliseconds after the view-loading code—the view is visible to
    the user—and the application seems quicker and more responsive. This is a common
    trick that you will use many times as you develop iPhone applications.


    You could also use the performSelectorInBackground:with method to perform the
    selector on a different thread than the thread loading the display.


    ```

    [self performSelectorInBackground:@selector(reallyLongMethod)withObject:nil]

    ```


    Instead of waiting the 0.05 seconds to begin processing, it processes immediately.
    But remember, be careful with your memory management when using this method, as
    your application''s autorelease pool is not managing the thread''s memory.


    But there is a problem with using both methods. Suppose the view''s display depended
    upon the reallyLongMethod method''s results. The problem is that the view is already
    loaded before the selector completes. What you need to be able to do is however
    somehow communicate to the view that the selector is finished processing and that
    you can update its display.


    Two ways you might accomplish this are by using notifications or by using a delegate.
    In the next two sections you learn both techniques.


    # Notifications


    A notification broadcasts information about events to whoever receive the notification.
    For instance, you might register for an e-mail alert when a stock value changes.
    If you have experience with Java, you might be familiar with its event listeners.
    Mac and iPhone applications have a similar functionality called notifications.'
