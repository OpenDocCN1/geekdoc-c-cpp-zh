  md: '# Summary


    In this chapter you learned about the Model-View-Controller (MVC) design pattern,
    as implemented on the iPhone. As you encounter tutorials on the Web, you will
    see many examples that mix the controller with the model. Realize this mixture
    is out of convenience and not as production code. Always separate your model from
    your controller. It allows easier debugging and modification, and makes your code
    easier to understand.


    Model data is often persisted between application invocations. On the iPhone,
    you can persist data using the sqlite C-based database, using property lists,
    for archiving, and through Core Data. You, of course, implement your own persistence
    scheme; however, these four techniques are much easier. As this is a book on Objective-C
    and not the iPhone SDK, this chapter did not cover sqlite nor Core Data in any
    depth. You are encouraged to review both these topics in more depth.


    Another problem that perplexes beginning developers is passing data between views.
    It is not as problematic as it might seem. The easiest way to accomplish this
    data passing is by passing a data object to a view controller after it has been
    initialized from the xib, but before the view has been loaded. Then, when the
    view calls its view controller''s viewDidLoad, viewWillWillAppear:, and viewDidChange:
    methods, the data object has already been set and the view can initialize itself
    accordingly.'
