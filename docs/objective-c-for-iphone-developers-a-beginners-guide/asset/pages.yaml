  md: 'This snippet accesses an object''s myFoo instance variable using the myFoo
    property getter method.


    # Property Attributes


    Properties usually have one or more attributes further specifying to the compiler
    how to generate accessor methods for the property. Attributes are placed in parentheses
    immediately following the @property declaration. For instance, consider the following
    property declaration:


    ```

    @property (nonatomic, retain) Foo * myFoo;

    ```


    This line first declares that it is declaring a property. It then declares that
    the property is nonatomic and that the setter for the property should call retain
    on the object. Essentially, it is telling the compiler to generate the following
    setter:


    ```

    - (void) setFoo (Foo *) aFoo {

    [aFoo retain];

    [myFoo release];

    myFoo = aFoo;

    }

    ```


    Table 5-1 shows a list of property attributes you may use when declaring a property.


    | Attribute | Description |

    | Read/Write attributes. The default setting for a property is readwrite. |

    | readwrite | Tells the compiler that the property may be read and written to.
    |

    | readonly | Tells the compiler that the property may only be read. Setter attributes.
    The default setting for a property is assign. |

    | assign | Tells the compiler that the property uses assignment in the property''s
    setter. |

    | retain | Tells the compiler that the property''s setter should call retain on
    the property when setting it. |

    | copy | Tells the compiler that the property''s setter should create a new copy
    of the object. Other property attributes. |

    | nonatomic | Tells the compiler that the property''s accessor methods are not
    thread safe. |

    | setter= | Tells the compiler that you wish specifying a setter of your own name.
    |

    | getter= | Tells the compiler that you wish specifying a getter of your own name.
    |


    Table 5-1 Property Attributes You May Use When Declaring a Property'
