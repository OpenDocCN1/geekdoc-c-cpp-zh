  md: "# Protocols and id\n\nIn Listing 7-9 you used a protocol as a method's parameter.\
    \ Although this is valid, you often see methods that only take an id. In this\
    \ section you learn three different syntaxes you might use when declaring a method\
    \ that accepts a protocol as a parameter. The following three method declarations\
    \ illustrate the syntax you might see:\n\n+   - (void) doAttach: (id) aFloater;\n\
    - (void) detach:(<Floater>) aFloater;\n- (void) sinkAFloater: (id <Floater>) aFloater;\n\
    \nThe first method takes an id, the second protocol only, and the third an id\
    \ and a protocol. In reality, method declarations two and three are equivalent.\
    \ Consider all three in turn.\n\n# Using id Only\n\nOne way to use a protocol\
    \ as a method parameter is by using the id keyword. The id type is a generic pointer\
    \ that can point to any object.\n\n```\n- (void) doAttach:(id) aFloater {\n  if\
    \ ([aFloater conformsToProtocol:@protocol (Floater)]) {\n    [aFloater attach];\n\
    \  }\n```\n\nIn the detach method the id points to an object adopting the Floater\
    \ protocol. Because any object could be sent to doAttach;, it ensures the object\
    \ adopts the required protocol by using the conformsToProtocol: method. The conformsToProtocol:\
    \ method is inherited from NSObject and does exactly what its name says: it checks\
    \ if an id conforms to a protocol provided as a parameter, returning YES or NO.\n\
    \n# Using id with a Protocol Restriction\n\nWhen writing your own custom classes,\
    \ you will probably want your methods to accept parameters more strongly than\
    \ id. You can restrict a method's parameter so that it can still take an id, but\
    \ only if that id's object adopts the specified protocol. The following method\
    \ declaration illustrates:\n\n```\n- (void) detach:(<Floater>) aFloater {\n  [aFloater\
    \ detach];\n}\n```"
