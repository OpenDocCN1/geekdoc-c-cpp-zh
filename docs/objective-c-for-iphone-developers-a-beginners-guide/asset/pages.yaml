    Persisting a property-list object is straightforward. However, notice what they
    cannot

    do do; they cannot persist custom classes to a file. For instance, if you had
    an NSArray of

    Foo classes, you could not persist the NSArray as a property list because Foo

    isn''t one of the property-list classes.


    Persisting an NSArray containing Foo instances requires archiving. This

    chapter''s remainder discusses archiving. Archiving is a powerful way to persist
    custom

    objects between instances of your application running.


    # TIP


    Refer to Apple''s "Property List Programming Guide," available online, for more

    information on property lists.


    # Archiving


    You can only serialize and deserialize property-list objects when using the writeToFile:

    atomically: and readFromFile:atomically methods. But you can serialize

    deserialize other objects, including multiple objects, using archiving.


    The NSKeyedArchiver class creates keyed archives. Each field archived has its

    name, or key. When you archive an object, save its field value with key. This

    key/value combination is saved to a file. You can then later reconstitute the
    object

    from the file using the NSKeyedUnarchiver class. The NSKeyedUnarchiver class

    reads and reconstructs objects from the archived.'
