  md: '# Objective-C for iPhone Developers: A Beginner''s Guide


    A switch statement evaluates an integer and routes a program''s execution flow
    according to the integer''s value. A switch evaluation takes the following form:


    ```

    switch(myInt) { <body> }

    ```


    Within the body, several case statements provide values to test against the switch''s
    variable to be tested. A case statement takes the following form:


    ```

    case <value to test>:

    ```


    If the case statement''s value matches the switch statement''s value, then the
    code block following the case statement executes.


    A switch statement might also have an optional default statement:


    ```

    default:

    ```


    If a switch statement has a default, then if there is no exact match, then the
    code following the case statement executes.


    Now, here is the tricky part with switch statements. Notice the keyword, break,
    in Listing 3-7. The break keyword forces the switch statement to terminate, and
    control returns to code following the switch statement. However, if you do not
    provide a break statement in a case statements body, then upon completing the
    case statement, the switch statement evaluates the next case. In the preceding
    code, although the following case statements all evaluate to false, the default
    statement''s body is still entered and the program executes the statements in
    default''s statement block. Unless you explicitly wish case statements to be evaluated
    by your program, always ensure a case statements code block with a break statement.


    Consider Listing 3-7''s behavior in more depth. Listing 3-7 illustrates a switch
    statement and its control flow. When as part of a program, the first assigns x
    the value 0. It then enters the switch statement, using x to evaluate against
    the case statements. On the first loop, x equals 0, and so that it matches none
    of the case statements and the program executes the default statements logging
    statement. On the second loop x equals 1, and so the first case statement evaluates
    to 0 and the program executes its break statement. The break statement forces
    the program to exit the switch statement immediately, and so the program never
    reaches the default statement. The loop continues until x is not less than 6.
    With each loop, the program enters the switch statement and performs the relevant
    processing.'
