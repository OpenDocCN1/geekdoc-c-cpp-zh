    # Properties and Protocols


    You can declare properties in a protocol. Any classes that wish to adopt the protocol
    must either implement custom accessor methods or must synthesize the property.
    A property''s syntax in a protocol is similar to an interface, you only do not
    declare an instance variable.


    ```

    @protocol Countable

    @property (nonatomic, retain) NSNumber * maximumDigit;

    @end

    ```


    By declaring a property in a protocol, you are informing the compiler that implementing
    classes must either synthesize the property or create custom accessor methods.
    But note, any class implementing the protocol must synthesize the property and
    declare the property as an instance variable in the class'' header. The following
    Try This illustrates.'
