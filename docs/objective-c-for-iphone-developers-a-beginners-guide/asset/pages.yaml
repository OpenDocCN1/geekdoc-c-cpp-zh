  md: '# Properties


    Beginning with Objective-C 2.0, Apple introduced something called properties to
    the language. Properties greatly simplify using class instance methods, removing
    the tedium of writing accessor methods. Moreover, properties can handle retaining
    and releasing instance variables for you. Like Objective-C''s extensions to C,
    properties are implemented using compiler directives.


    # Declaring Properties


    Properties are declared in a class''s interface and defined in a class''s implementation.
    A property''s declaration begins with the @property compiler directive. Immediately
    following the @property directive is an optional list of attributes enclosed in
    parentheses. The instance variable''s type and name then follows. Listing 5-10
    illustrates a typical property declaration.


    +   Listing 5-10 A typical property declaration


    ```

    #import <Foundation/Foundation.h>

    @interface FooBar : NSObject

    NSString * myName;


    @property (nonatomic,retain) NSString * myName;

    @end

    ```


    After declaring a property, you define the property in a class''s implementation.
    The @synthesize directive goes in a class''s implementation (Listing 5-11). Defining
    a property is trivial when using the @synthesize compiler directive. The @synthesize
    compiler directive tells the compiler to create accessor methods for a property.


    +   Listing 5-11 A typical @synthesize directive


    ```

    #import "FooBar.h"

    @implementation FooBar

    @synthesize myName;

    @end

    ```


    The default getters and setters generated for a property are <propertyName> for
    the getter and set<propertyName> for the setter. Note that if a property''s first
    letter is lowercase, the method changes it to uppercase.


    FooBar * myFooBar;'
