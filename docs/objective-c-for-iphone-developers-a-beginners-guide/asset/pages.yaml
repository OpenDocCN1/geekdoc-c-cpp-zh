    # Modeling Inheritance


    The Unified Modeling Language (UML) offers a convenient syntax for modeling inheritance.
    Figure 6-1 illustrates a simple class diagram.


    A child class'' relationship with a parent class is modeled using an arrow with
    an open arrow. The arrow points from the child to the parent. In Figure 6-1, a
    Pear, Orange, and Apple are all children of Fruit. You can also, of course, create
    a more detailed class diagram, much as you did in Chapter 5 (Figure 6-2).


    In Figure 6-2, a LivingOrganism is the parent, while Animal and Plant are children
    of LivingOrganism. A class is modeled as a rectangle. The rectangle''s top compartment
    contains the class ''name''. The second compartment contains the class* instance
    variables. The third compartment contains the class'' methods.


    Figure 6-3 illustrates another inheritance principle. A child class inherits not
    only from its immediate parent; it also inherits from every ancestor to its root
    class.


    In Figure 6-3, a Fuji''s parent is Apple. An Apple''s parent is Fruit. A Fruit''s
    parent is NSObject. NSObject is the root class. A Fuji inherits from Apple, Fruit,
    and NSObject.


    # NOTE


    A parent class is also often referred to as a superclass, and a child class is
    often referred to as a subclass.


