    # Summary


    Property lists and archiving is an easy way to persist your application’s data
    between users running your application. When using property lists and archives,
    be certain you persist the data to your Documents directory, as this directory
    is persisted by iTunes. If you only wish to persist primitive values, use a property
    list. If you wish to persist objects, then use archiving. Both techniques are
    easy ways to persist your application’s data.


    If storing large amounts of data, you should use the SQLite database that comes
    with the iPhone or you should use Core Data. Both topics are outside this book’s
    scope, but for more information on using both in an iPhone application, refer
