  md: '# Multiple Argument Methods


    Methods can have more than one argument. Multiple argument methods are where Objective-C
    shines. Although at first confusing, Objective-C''s multiple argument syntax makes
    it easier to read and maintain than other languages such as Java and C++.


    # NOTE


    Parameter and argument are synonyms. They both refer to a value passed between
    methods.


    Consider the following C function being called, what exactly do the parameters?


    doIt("Bill Cosby", "Leonard Part 6", 37);


    Now consider the same as an Objective-C message.


    ```

    [myMultiple doIt:@"Bill Cosby" movieName:@"Leonard Part 6" timesSeen:37];

    ```


    You know exactly the last two methods mean, and you can infer the first method
    means. You are calling the method doIt with an actor name, a movie name, and the
    number of times the movie was seen.


    Objective-C methods that have more than one parameter use a space between arguments.
    For instance, you might implement the preceding doIt method as follows:


    ```

    (void) doIt:(NSString *) actorName movieName:(NSString*) valueSeen:(int)times
    {

    NSLog("%@@ %@ is my favorite actor in the movie %@, I saw it %i times.",

    actorName, value, times);

    }

    ```


    Objective-C''s first parameter is not named, while the remaining parameters are
    named. This allows you to know exactly what the remaining parameters mean. After
    the first argument, you specify each subsequent argument by name, a colon, the
    type, and the actual name referred to internally by the implementing method. Figure
    4-13 illustrates. Although this convention is initially confusing, you will use
    multiargment methods so frequently when using Foundation classes such as NSString,
    they will soon become second nature.'
