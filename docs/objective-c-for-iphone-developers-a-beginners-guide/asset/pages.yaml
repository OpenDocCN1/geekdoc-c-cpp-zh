    # Characters


    The char data type, actually one of the integers, stores a single character. For
    instance, the following stores the letter c in the myChar variable.


    ```

    char myChar = ''c'';

    ```


    You enclose C types in single quotes. You print a character to NSLog using %c.
    When writing C programs you use characters, and character aggregations (C strings
    and character arrays), extensively. When writing Objective-C programs for the
    iPhone, you will rarely use characters or character aggregations. Instead you
    will use NSString. If not familiar with NSString, do not worry, by book''s end
    you will be.


    # NOTE


    If you are coming from Java, note that neither Objective-C nor C has a byte data
    type. Instead, C programmers use an unsigned char to represent a single byte.
    As you will learn in later chapters, Objective-C programmers usually use a higher-level
    framework class called NSData.'
