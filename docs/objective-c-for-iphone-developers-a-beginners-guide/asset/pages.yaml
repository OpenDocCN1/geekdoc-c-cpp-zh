  md: '# Chapter 3: Flow Control Statements, Arrays, and Structures... 57


    # # The If Statement


    The if statement is the most common conditional statement; it takes the following
    form:


    ```

    if ( logical test ) { <body> }

    ```


    The statement says, "If a logical test evaluates to true, then execute the statements
    in the immediately following statement block." Remember, the statement block is
    everything between the opening brace immediately following the test and the corresponding
    closing brace. If the logical test, or the condition, evaluates to false, a program
    skips the statement block immediately following the if statement. The following
    is a typical if


    ```

    int x = 0;

    if(x < 9) {

    NSLog("x < 9");

    NSLog("This was a test.");

    ```


    When run as part of the program, the program first assigns x the value 0. It then
    tests if x is less than 9. It is, and so executes the two logging statements in
    the immediately following statement block.


    # # Nested If Statements


    A statement following an if statement can also contain statements. If these statements
    are called nested statements. The compiler is smart enough to distinguish which
    closing curly brace goes with which opening curly brace.


    ```

    int x = 0;

    int * p = &x;

    if(x < 9) {

    NSLog("This is a test.");

    if(sizeof(p) == sizeof(x)) {

    NSLog("x < 9 and is the size of an int");

    }

    }

    ```


    # # CAUTION


    When evaluating a logical condition, be certain to use == and not !=. Remember,
    one equal sign is assignment, while two is evaluation.'
