    Operators operate on variables. In this chapter, I discuss arithmetic, unary,
    and assignment operators.


    NOTE


    This chapter omits bitwise operators, as you will probably rarely use them. This
    chapter also omits memory operators (pointer-related operators).


    # Arithmetic Operators


    Arithmetic operators work as you might expect. Table 2-2 summarizes them.'
