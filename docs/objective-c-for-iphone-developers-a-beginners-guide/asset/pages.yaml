  md: "# 144 Objective-C for iPhone Developers: A Beginner's Guide\n\nHowever, a more\
    \ common technique many developers use is to not release a property at all but\
    \ to assign a nil value in the class's dealloc method (Listing 5-29).\n\nListing\
    \ 5-29 Foo.m assuming properties are set\n\n```\n#import \"Foo.h\"\n@implementation\
    \ Foo\n@synthesize myBar;\n-(void) dealloc {\n    [super dealloc];\n    self.myBar=nil;\n\
    }\n@end\n```\n\nRemember, when setting a class's property, the generated setter\
    \ first releases the property and assigns the property the new value. After assigning\
    \ the new value, the setter retains the object. When you set a property with nil,\
    \ the setter releases the old value, assigns nil as the new value, and then sends\
    \ retain to nil. Thus the property is released, but at the same time, if the property\
    \ is not allocated, no error is thrown. Of the two techniques, the second is more\
    \ popular because it is an easy way to ensure you release all of an object's properties\
    \ without risking that the properties were never allocated.\n\n# Summary\n\nIn\
    \ this chapter you explored memory management, properties, and IOutlet. Properties\
    \ simplify respecting a class's instance variable encapsulation by automatically\
    \ creating accessor methods. Always respect a class's encapsulation by accessing\
    \ an instance variable through the property; avoiding your own accessor methods\
    \ and let Objective-C do its job by making things easier for you properties. Properties\
    \ simplify your code, make your programs less prone to memory leaks, and help\
    \ reduce crashes.\n\nIOutlets are a directive to Interface Builder that connects\
    \ controls in your Interface Builder GUI to properties in your classes. IOutlet\
    \ compiles to void and so they are meaningless when compiled. You use Outlets\
    \ extensively when using Interface Builder."
