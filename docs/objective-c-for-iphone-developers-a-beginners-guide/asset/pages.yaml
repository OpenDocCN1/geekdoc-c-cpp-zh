  md: "# 52 Objective-C for iPhone Developers: A Beginner's Guide\n\nThe while loop,\
    \ like the for loop, performs a logical test before entering the loop's body.\
    \ If the test evaluates to zero, or \"true\", then the statements in the body\
    \ are executed. The while loop loops and evaluates the logical test again. This\
    \ repeats until the logical test evaluates to zero, or \"false\". For instance,\
    \ consider the following code snippet:\n\n```\nfloat r = 2.3;\nwhile(r < 33.99)\
    \ {\n  r *= 1.2;\n}\n```\n\nWhen executed as part of a program, the program first\
    \ assigns the variable r the value 2.3. The program then enters the while loop\
    \ then evaluates if r is less than 33.99. It is, and so the program multiplies\
    \ r by 1.2. The while loop continues looping until r is not 33.99.\n\nNotice that\
    \ the while loop performs its logical test before executing the statements in\
    \ its body. If the logical test evaluates to false, then the while loop's body\
    \ is skipped. For instance, the while loop never executes the loop because t is\
    \ equal to X and it skips the loop's body.\n\n```\nchar t = 'X';\nwhile(t != 'X')\
    \ {\n  NSLog(\"@I ran A.\");\n}\n```\n\n# The Do While Loop\n\nThe while loop\
    \ is similar to the while loop, only it always executes its body statements at\
    \ least once and then performs the logical test. The do while loop has the following\
    \ form:\n\n```\ndo{ <body> } while(logical test);\n```\n\nConsider the example.\n\
    \n```\nchar t = 'X';\ndo {\n  NSLog(\"@I ran B.\");\n} while(t != 'X');\n```\n\
    \nWhen run as a program, the program first assigns t the value X. It then enters\
    \ the do loop and executes the logging statement. After logging, the program evaluates\
    \ the logical test, which evaluates to false. Because the test failed, the program\
    \ does not loop but continues with the statements after the do while loop."
