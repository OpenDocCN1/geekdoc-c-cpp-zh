    # Data Type Conversions


    There are often times you might wish to convert a primitive from one type to another.
    For instance, you might have a situation where you sum sales figures.


    ```

    int numberSold = 20;

    float costItem = 23.22;

    float amount = numberSold * costItem; //amount = 464.399994

    ```


    The runtime knows to convert the integer to a float before multiplying. Programmers
    call this a widening conversion because you can widen an int to a float with no
    information loss. The converse is not true and often results in an incorrect value
    or a rounded value. Programmers call this a narrowing conversion.


    ```

    int amount = numberSold * costItem; //amount = 464, it rounds to int

    double grams = DBL_MAX;

    float amount = grams; //amount = #INF0 or infinity

    ```


    # TIP


    When a value falls outside the range supported by the specific data type, you
    obtain infinity, or #INF00.


    Although a compiler can usually figure out your intentions, you should always
    cast if you wish to convert a value to a narrower type. Casting is explicitly
    changing a variable''s data type from one type to another when using the variable.
    Casting does not affect the original variable''s type. Casting is essentially
    saying, "I know you are an integer, but for this division I want you to temporarily
    be a float." For instance, you might divide two integers and assign the results
    to a float.


    ```

    int points = 95;

    int papers = 10;

    float grade = points/papers;

    NSLog("%f", (float)grade);

    ```'
