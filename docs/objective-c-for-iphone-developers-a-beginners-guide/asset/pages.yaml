  md: '# 26 Objective-C for iPhone Developers: A Beginner’s Guide


    # Exploring Xcode Further


    Apple has good documentation using Xcode. You should read documentation. Apple’s
    “Xcode Workspace Guide” is a comprehensive Xcode document that you can read online
    or download. You do not need to read it fully—I never have—but you should skim
    it for things that can help you use Xcode productively.


    This document has many tidbits you might miss that make working with Xcode easier
    and quicker. For instance, the document covers the keyboard shortcuts, to reset
    Xcode, and how to take a snapshot of your project. The document is worth reviewing.


    # TIP


    You can take a snapshot of your work by Selecting File | Make Snapshot. This saves
    your project’s current state should you require reverting your project back to
    a previous state. Use this feature reasonably; many times I have made a complete
    mess of my project and needed to restore it to a known, more stable state. Should
    you need to restore, select File | Snapshots from Xcode’s menu to display the
    Snapshots dialog. You can then select the snapshot you wish to revert to.


    # Summary


    If new to programming, you found much material to digest. Do not be concerned
    if you do not understand all the concepts presented in this chapter. You should
    understand what a header file and a source file are and how you create them. You
    should also understand how to create a simple iPhone project from a template,
    compile it, and run it. You should understand that main.m contains a main method
    that is the starting point for all iPhone applications. If you do not fully understand
    pointers, as okay, you will learn more about them in the next couple chapters.
    For now, just remember that a pointer points to a variable’s location and not
    the variable’s value. In future chapters, almost every topic presented in this
    chapter will be covered in more depth. In the next chapter you explore primitive
    data types.'
