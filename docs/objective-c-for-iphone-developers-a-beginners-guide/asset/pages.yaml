    # Archiving Multiple Classes


    Although archiving a single object and the classes it has a relationship with
    useful, there are many times when you might wish to archive multiple unrelated
    objects at once the same time. You archive multiple objects at once by using a
    mutable buffer and an NSKeyedArchiver. What do you do to create a data buffer
    that you can add to.


    ```

    NSMutableData * theData = [NSMutableData data];

    ```


    You initialize the NSKeyedArchiver with the data buffer.


    ```

    NSKeyedArchiver * archiver = [[NSKeyedArchiver alloc]

    initForWritingWithMutableData:theData];

    ```


    After initializing the archiver, you encode the objects.


    ```

    [archiver encodeObject:myFoos forKey:@"myFoos"];

    [archiver encodeObject:myName forKey:@"name"];

    ```


    After encoding all the objects you wish to, send a message to the archiver telling
    it you are finished encoding. And you then write the data buffer to a file.


    ```

    [archiver finishEncoding];

    [theData writeToFile:pathToFile:NO];

    ```


    Reconstructing the objects from the archive is a similar process. You first read
    the data into an NSData object.


    ```

    NSData * data = [NSData dataWithContentsOf:pathToFile];

    ```'
