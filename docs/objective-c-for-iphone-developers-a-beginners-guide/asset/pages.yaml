    Constructing identical instance has limited value. In the real world, usually
    no two instances of something are truly identical. Return to the house building
    analogy. Once the house is built, the owners usually modify it before moving in.
    In this modification, initialization, makes the house the owners'' own unique
    house version. Although all houses built using the same drawing are initially
    identical, owners initialize the house. Same with Objective-C: after allocating
    space and building an object, you then initialize it.


    You initialize a class using the init method. Just like alloc, every Objective-C
    class inherits NObject''s init method. however, init is an instance method rather
    than a class method (more on instance methods later). You call a class'' init
    method immediately after allocating the class. For instance, the following code
    allocates an object and then initializes it:


    ```

    Foo * myFoo = [Foo alloc];n[myFoo init];

    ```


    # NOTE


    As you shall notice throughout this book, you usually see an object''s allocation
    and initialization written in a single line. The following line first allocates
    space for a Foo instance, it then initializes that and returns an id. That id
    is assigned to myFoo.


    ```

    Foo * myFoo = [[Foo alloc] init];

    ```


