    class rather than NSString. The NSMutableString is a subclass of NSString; it
    inherits all of NSString''s methods, but it also adds several methods for appending
    strings without requiring you to declare a new string. You initialize it the same
    way you would a regular string, only you use the mutable version.


    ```

