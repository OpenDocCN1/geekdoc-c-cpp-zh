  md: "# Chapter 12: The Model-View-Controller Design Pattern 351\n\n```\n(void)dealloc\
    \ {\n  [navigationController release];\n  [window release];\n  [super dealloc];\n\
    }@end\n```\n\nIn this application the two views shared data with each other programmatically\
    \ using the gotoNext: method.\n\n```\n- (IBAction) gotoNext:(id) sender {\n  MonkeyViewController\
    \ *monkeyDo = [[MonkeyViewController alloc]\n  initWithName:@\"MonkeyViewController\"\
    \ bundle:nil];\n  Monkey * aMonkey = [[Monkey alloc] init];\n  monkeyDo.myMonkey\
    \ = aMonkey;\n  monkeyDo.myMonkeyName = myMonkeyName.text;\n  [self.navigationController\
    \ pushViewController:monkeyDo animated:YES];\n  [monkeyDo release];\n  [aMonkey\
    \ release];\n}\n```\n\nBoth controllers are subviews of the navigation controller.\
    \ The first view's bar button invokes the gotoNext: action when tapped. This method\
    \ loads the MonkeyViewController, creates a Monkey instance, and assigns it to\
    \ the newly created MonkeyViewController's myMonkey property. After doing this,\
    \ it pushes the MonkeyViewController to the navigation controller and the MonkeyViewController\
    \ is displayed with the data passed to it before being displayed.\n\nIf you do\
    \ not fully understand the navigation controller, or how the view was displayed,\
    \ don't worry; for this example it is not important. What is important is that\
    \ you understand how you passed the data between the xibs. The controller in the\
    \ first xib instantiated the controller in the second xib. Then the second controller's\
    \ relevant properties. After setting the properties, passed control to the second\
    \ view controller, which loaded its view."
