  md: '# 214 Objective-C for iPhone Developers: A Beginner’s Guide


    # Key Skills & Concepts


    +   - Understanding Mutable and Nonmutable Objects

    - Using NSString and NSMutableString

    - Understanding Objective-C Numbers

    - Using Dates in Objective-C

    - Using NSArray and NSMutableArray

    - Using NSDictionary and NSMutableDictionary


    The Foundation framework is a collection of Objective-C classes that make working
    with primitive data elements and data structures as easier by wrapping them in
    an Objective-C class. The Foundation framework contains many classes that you
    can use when developing your application. In this chapter you explore several
    of the Foundation framework classes that you will use most when developing an
    iPhone application. But this chapter cannot possibly do the Foundation framework
    justice, and you should at least skim the Foundation framework’s online documentation
    at Apple’s web site so you have a better understanding of everything the Foundation
    framework has to offer. You cannot be a good iPhone developer unless you understand
    this framework.


    Although there are many Foundation framework classes available, in this chapter
    you only explore a few of those classes: namely the NSString, NSMutableString,
    NSNumber, NSDate, NSArray, NSMutableArray, NSDictionary, and NSMutableDictionary
    classes. These classes all make working with data easier. For instance, the NSNumber
    class wraps numeric primitives and provides many functions for manipulating its
    underlying primitive value. The NSString makes working with C character arrays
    much easier by providing many data manipulation functions. And the NSArray and
    NSDictionary classes make handling an Objective-C object collection easier. These
    eight classes are arguably the most important Foundation framework classes, and
    you should understand them all.


    # NOTE


    Using any of the Foundation framework classes only requires that you import the
    Foundation framework header file. You have already done this throughout this book.


    ```

    #import <Foundation/Foundation.h>

    ```


    You also must ensure you link against the framework, and Xcode does this for you
    when developing an iPhone project.'
