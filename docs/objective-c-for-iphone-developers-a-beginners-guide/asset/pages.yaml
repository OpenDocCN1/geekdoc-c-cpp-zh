  md: "# 50 Objective-C for iPhone Developers: A Beginner's Guide\n\n# ## Looping\n\
    \nObjective-C uses the same basic looping constructs as Java and C++. After all,\
    \ all three languages' lineage is C, so it is only fitting they share the same\
    \ looping constructs. Objective-C, being a superset, uses C's for, while, and\
    \ do loops.\n\nLoops allow repeating a block of code multiple times. For instance,\
    \ a car engine left will idle until the car's gas runs out. Or, for every roach\
    \ in your kitchen, you might wish to crush the roach. Loops allow a program to\
    \ repeat some behavior while a Boolean condition is true. In the next several\
    \ pages you explore the for, while, and do loops. Each loop, although similar,\
    \ allows slightly different behavior.\n\n# ## The For Loop\n\nThe for loop repeats\
    \ a block of code and is under the control of a counter variable. A for loop consists\
    \ of the statement followed by the loop body. A statement for statement has the\
    \ following:\n\n```\nfor(initialization; logical test; update){ <body> }\n```\n\
    \nThe loop's body is everything between the opening brace that immediately follows\
    \ the statement and its accompanying closing brace. For instance, consider the\
    \ following code:\n\n```\nfor (int i = 0; i < 5; i++) {\n  NSLog(\"%x\");\n}\n\
    ```\n\nThe variable i is declared and assigned the value 0. Each loop logs a period\
    \ to the debugger console. Before each loop, i is tested to ensure it is less\
    \ than 5. At the end of each loop, i is incremented by 1. The loop repeats five\
    \ times.\n\nYou can omit parts of a for loop statement. Although I personally\
    \ do not recommend writing this way, consider a few variations of the loop.\n\n\
    ```\nint j = 0;\nfor(j<=27;j++) {\n  NSLog(\"%x\");\n}\n```\n\nIn the preceding\
    \ example, the j variable is initialized before the loop's initialization; therefore,\
    \ you can skip initializing it in the for loop statement. Now consider a skipped\
    \ initialization and a different logical evaluation.\n\n```\nint q = 0;\nfor(q\
    \ != 7;){\n```"
