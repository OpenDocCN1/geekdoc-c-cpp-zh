  md: '# Multiple Xibs


    iPhone applications consist of multiple xibs. Each xib contains a single view.
    As a user navigates through an application, each xib is loaded as needed and displays
    its view. This saves memory, as your application only loads the xib''s content
    as needed. If all views were in one xib, then all views are loaded regardless
    of whether they are needed.


