  md: '# Chapter 4: Classes, Objects, and Messaging


    Notice the data flow through Figure 4-2. Looking up a stock results in a stock,
    which is the input for determining how many shares you can buy. Determining how
    many shares you can buy in a count. If the count is greater than 0, you buy shares.
    Buying shares results in owned shares, and you record the sale and store it.


    Like procedural analysis, object-oriented analysis often begins by reviewing activities
    and data flow. However, unlike procedural analysis, it does not implement the
    activities as functions. Instead, object-oriented analysis first analyzes the
    objects, or nouns, that compose an activity like Figure 4-2.


    # NOTE


    Another form of analysis, typically performed before activity analysis, is called
    use case analysis. Case analysis typically occurs after you gather a client''s
    requirements before conducting activity analysis. Use cases are the basis for
    transforming written requirements into more formal analysis and design. Refer
    to UML Demystified or Wikipedia''s page on the subject (http://en.wikipedia.org/wiki/Use_case_diagram)
    for more information on use analysis.


    # Object-Oriented Analysis


    After defining the problem, object-oriented analysis looks at a problem''s objects,
    or its nouns. In Figure 4-2, first consider the broad data types used by defining
    the nouns. The first noun I is Stock, and so I know I need a Stock class. I also
    need a Share. I can describe the activity as “purchasing a stock,” and so Imise
    that I need a Purchase class. Finally, I see two external systems, the trading
    system and the system used to store the purchase; I model both of these by creating
    a Storage class and a TradingSystem class. Figure 4-3 is a simple model illustrating
    the classes and their relationship with one another.


    # NOTE


    I use the pronoun “I” rather than “you” when analyzing Figure 4-2 to create Figure
    4-3. My pronoun use is intentional. Despite computer scientists'' attempts to
    make object-oriented analysis and design scientific, it remains largely an artistic
    endeavor. Figure 4-3 models how I see the activity in Figure 4-2, not necessarily
    how you see the activity. You could do the same analysis as I did and derive a
    very different diagram from Figure 4-3.


    # TIP


    The best book I have read on object-oriented programming and UML is the book Applying
