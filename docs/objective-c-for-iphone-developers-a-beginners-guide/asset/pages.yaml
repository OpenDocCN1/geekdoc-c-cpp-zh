  md: 'A user first initializes a purchase with a string containing the stock symbol
    and amount he or she has budgeted for purchasing stocks. This first interaction
    creates a Purchase. The Purchase then calls the TradingSystem to get the Stock''s
    information. The StockPurchase then determines how many stocks it can buy. If
    zero, it returns immediately with no further processing. If not zero, it calls
    TradingSystem to buy shares of the stock.


    # NOTE


    Do not be alarmed at the slight variance between the activity diagram in Figure
    4-2 and the sequence diagram in Figure 4-6. When performing object-oriented analysis
    and design, your understanding of a problem often matures as you progress through
    analysis and design.


    After purchasing the stock, the TradingSystem returns how many shares were purchased.
    Notice that the number of purchased shares is actually just a count, the sequence
    diagram does away with the Share class and instead makes it a property of the
    Stock class. After recording the sale, the system returns the Stock to the initiator
    and the sequence terminates.


    The sequence diagram in Figure 4-6 captures the interaction of specific object
    instances of your model''s classes. For instance, a Purchase instance gets a Stock
    instance''s information by asking a TradingSystem to get information on the stock.
    Together, these interactions, modeled in a sequence diagram, provide a more complete
    understanding of the methods needed, and their sequence, to complete a problem.


    You use the interactions in a sequence diagram to create each class'' methods.
    When creating methods, be certain you assign them to the appropriate class. For
    instance, Purchase is asking TradingSystem for stock information. Therefore, the
    getStockDetails method belongs to the TradingSystem class and not Purchase. Going
    through all the interactions in the sequence diagram creates a class model like
    Figure 4-7.


    Unlike a sequence diagram or activity diagram, a class diagram is static and models
    a class, not an object instance of a class. Think of this diagram as a blueprint
    for how you will actually write code rather than a diagram helping you understand
    a problem better.


    A class diagram like Figure 4-7, although similar to a conceptual class diagram
    like Figure 4-3, is much more detailed. It captures a class, its instance variables,
    and its methods.'
