  md: "# Objective-C for iPhone Developers: A Beginner's Guide\n\n| Listing 12-16\
    \ MyTabController |\n\n```\n#import \"MyPickerController.h\"\n@implementation\
    \ MyTabController\n@synthesize myMyAnswers;\n- (void)dealloc {\n    self.myMyAnswers\
    \ = nil;\n    [super dealloc];\n}\n@end\n```\n\nIn this example you created an\
    \ application whose only coupling is in ViewHandler. MultipleXibsViewController\
    \ knows nothing about SecondViewController. You share the data between the view\
    \ controllers using the model, not the individual UILabel. Although this distinction\
    \ is trivial, consider what happens if a view with many controls must share data\
    \ with another view. The amount of sharing becomes unmanageable. By passing a\
    \ single model object, sharing data becomes manageable.\n\nIn some respects, this\
    \ example is a bit extreme. Usually coupling view controllers is acceptable. However,\
    \ this example illustrates that you can totally decouple view controllers, and\
    \ views in xibs. Moreover, you can share data between them. The only coupling\
    \ is that both view controllers must know about the MyModel object. And of course\
    \ the ViewHandler class is coupled with both view controllers.\n\nIn the preceding\
    \ Try This you shared data between two xibs by using a shared data object that\
    \ was added to the xib in Interface Builder. However, often you will wish to share\
    \ an object between two xibs programmatically. Moreover, when using code to create\
    \ views you do not have this option of sharing data. Instead, you must manually\
    \ share data between xibs. Sharing data between xibs programmatically is arguably\
    \ even more straightforward than using Interface Builder. The following Try This\
    \ illustrates."
