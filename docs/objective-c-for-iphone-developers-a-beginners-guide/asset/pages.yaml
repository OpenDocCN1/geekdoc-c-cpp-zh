  md: '# NSCoding Protocol


    Archiving an object requires the object adopt the NSCoding protocol. The NSCoding
    protocol requires a class to implement the encodeWithCoder: and initWithCoder:
    methods. You encode an object using the encodeWithCoder: method, and decode an
    object using the intWithCoder: method.


    +   - (void) encodeWithCoder:(NSCoding*) encoder

    - (id) initWithCoder:(NSCoding*) decoder


    Your class implementing the NSCoding protocol encodes other objects that adopt
    NSCoding using the NSCoder''s encodeObject:forKey: method. It decodes these objects
    using decodeObject:forKey: method. The NSCoder can also encode and decode primitive
    objects; for instance, to encode and decode a float, you would use the encodeFloat:forKey:
    and decodeFloat:forKey: methods.


    # NSKeyedArchiver and NSKeyedUnarchiver


    The NSKeyedArchiver and NSKeyedUnarchiver classes archive and archive objects
    that adopt the NSCoding protocol. The NSKeyedArchiver encodes objects into a key/value
    archive, where you can retrieve the values based upon the objects'' keys. The
    NSKeyedUnarchiver class reconstitutes a class, or classes, from an archive.


    You can archive a single class, or you can archive multiple classes. When archiving
    a single class, you can also archive classes the class has a relationship with,
    provided those classes also adopt the NSCoding protocol.


    # Archiving a Single Class


    When archiving and unarchiving a single object, and its constituents, you can
    use NSArchiver''s archiveRootObject:ToFile class method to archive the object
    and unarchiveObjectWithFile class method to unarchive the object. These methods
    provide an easy means of archiving and unarchiving a single object hierarchy.
    To archive directly to a file, use the archiveRootObject:ToFile method.


    +   + (BOOL) archiveRootObject:(id)rootObjectToFile:(NSString *)path


    To unarchive directly from a file, use the unarchiveObjectWithFile: convenience
    method.


    +   + (id) unarchiveObjectWithFile:(NSString *)path'
