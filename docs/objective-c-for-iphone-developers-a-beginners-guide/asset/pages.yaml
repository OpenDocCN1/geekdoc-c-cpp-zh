  md: '# Introduction


    Apple opened the App Store on July 11, 2008. Since then it has offered over 100,000
    Apps. An App''s price can range from free to $999.99 U.S. Individuals, small companies,
    and large companies can all release Apps on the App Store. The App Store truly
    makes software development a cottage industry for many developers.


    But you must remember that the iPhone, iPod touch, and iPad are all computers.
    Computers require programs to make them do something interesting. Apple''s language
    of choice is Objective-C, a superset of C. In this book, the goal is getting you
    comfortable with basic programming, the C programming language, and the Objective-C
    programming language.


    # About This Book


    This book''s focus is Objective-C, not developing iPhone applications using the
    iPhone SDK. However, it uses the iPhone SDK to teach Objective-C. Throughout the
    book you use simple iPhone SDK applications to illustrate the chapter''s presented
    topics. The goal is that by the book''s end, you will be knowledgeable and comfortable
    enough with Objective-C and the iPhone SDK to begin working through an iPhone
    SDK book such as my iPhone SDK Programming: A Beginner''s Guide (McGraw-Hill/Professional,
    2009).'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Each Chapter’s Content


    Chapter 1 begins the book by exploring the iPhone SDK and presenting a few basic
    programming concepts. You must be a registered iPhone developer to download and
    begin using the SDK. You must be a paid developer to test applications on your
    device and upload applications to the App store. You should note that in this
    book, I present no examples requiring paid membership; all projects are developed
    for the iPhone simulator only.


    After presenting the essentials, Chapter 1 jumps into a crash course on beginning
    programming using the C programming language. The material is terse, so if you
    have never programmed before, you should consult some of the referenced material
    in the chapter for more help.


    Chapters 2 and 3 discuss basic programming concepts in Objective-C. The material
    should be familiar to you have some C or Java experience. Chapter 2 begins the
    book’s Objective-C coverage by discussing the language’s primitive data types
    and operators. Objective-C is a superset of C, if you know some C, then much of
    the material should provide familiar. Chapter 3 discusses Objective-C’s flow control
    statements, arrays, and structures. This chapter, like Chapter 2, should be familiar
    to you if you have some C programming experience.


    Chapter 4 begins Objective-C’s departure from standard C by discussing classes,
    objects, and messaging. The chapter begins by demonstrating procedural programming
    and then switches to object-oriented programming. It also uses Unified Modeling
    Language (UML) diagrams to help illustrate the chapter’s content.


    Chapter 5 discusses memory management. If you come from a Java or scripting language
    background such as PHP or ColdFusion, then you would be well to pay particular
    attention to this chapter. You must understand Objective-C’s memory management
    if you wish to program iphone applications. Remember, the iPhone has less memory
    than a desktop computer; if you fail to manage memory properly, your application
    will crash when running on an iPhone.


    Chapters 6 and 7 explore object-oriented programming using Objective-C. Chapter
    6 explores the object-oriented principle of inheritance. Inheritance allows much
    code reuse and makes your programs easier to build, debug, and maintain. Chapter
    7 discusses Objective-C’s protocols and categories. If you are familiar with Java,
    then simply think of protocols as interfaces; they are fundamentally the same
    concept. Categories, though, are something of an afterthought in Objective-C and
    have no corresponding Java construct. Categories let you arbitrarily extend a
    class’ functionality without inheriting from the class. If this doesn’t make sense,
    it should be by the end of Chapter 7.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Chapters 8, 9, and 10 introduce you to several Foundation framework concepts.


    Beginning with Chapter 8, the book diverges from presenting Objective-C language
    concepts and begins presenting fundamental classes and concepts for programming
    for the iPhone. These classes are all part of the Foundation framework, a collection
    of Appleprovided that makes writing applications easier. The concepts are tailored
    to iPhone development, so desktop-only classes or concepts are discussed. Chapter
    8 explores several Foundation framework classes. These classes make string manipulation,
    managing collections of objects, and reading and writing from files much easier.
    Chapter 9 presents the Foundation framework classes used for reading and writing
    to files. The chapter also discusses the iPhone directories you have available
    and provide specific code examples for working with those directories. Chapter
    10 continues presenting Foundation framework classes. In this chapter you learn
    about property lists, the NSCopy protocol, and how to archive and de-archive your
    application''s objects to a file.


    Chapter 11 introduces you to selectors and targets. Selectors and targets are
    initially one of Objective-C''s most confusing aspects. However, you should take
    the time to carefully learn these concepts, as they allow significant programming
    flexibility. In essence, what these allow is for a program to dynamically decide
    at runtime what objects and methods to call. If you are familiar with Java''s
    reflection, then selectors should not appear foreign. First, having extensively
    with both, I find Objective-C''s selectors and targets much easier than working
    with Java''s reflection.


    Chapter 12 returns to basic object-oriented principles by discussing the ModelViewController
    (MVC) design pattern. I end the book with the MVC for good reason. It is fundamental
    to how you write programs for the iPhone SDK. Moreover, this design pattern has
    a rich history and is arguably the most influential concept leading to the Mac
    and Windows operating systems. Without MVC, we might just still all be using DOS
    prompts.


    # Accompanying Tutorial Videos


    This book is only one of many books recently released on the Objective-C programming
    language. Moreover, it is relatively late to arrive, as there are several other
    high-quality beginner books already on the shelves. So why this book? First, as
    the author of course I believe this book to be superior to the other books. But
    more objectively, this book offers video tutorials for all its Try examples. Oftftimes,
    steps get lost in a numbered list of printed steps. Moreover, small details are
    often missed. By offering video tutorials, I hope to reinforce the tutorials presented
    in the book.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'The tutorials are available through my web site at www.jamesabannan.com and
    are free of charge. Links to the video and the Xcode projects are provided. The
    videos themselves are hosted on Vimeo at www.vimeo.com. You can watch the embedded
    videos online; if you wish to download the video to watch offline, you need to
    sign up as a Vimeo member. Vimeo''s basic membership is free.


    The tutorials are also packaged as both an iPad application and an iPhone/iPod
    touch application. Both are downloadable from Apple''s App Store for a nominal
    charge. The App bundles all the videos into an organized tutorial that follows
    the book''s Try This steps. You should note, though, that the written Try This
    steps are not presented in the App. For that you should buy the book. The tutorial
    Apps are intended as a supplement to this book, not a replacement. As an aside,
    I know as a reader, I rarely actually complete a book''s tutorials. Well, in this
    book you don''t have to; you can just watch them after reading the steps. Of course,
    officially, I recommend completing all examples using Xcode.


    # Realistic Expectations


    You are probably not going to get rich writing iPhone Apps. The iPhone App Store
    is maturing, and instant sales because of the App Store''s novelty is no longer
    the norm. Or is it? Before I try to instill an understanding of what I consider
    reality, consider an application like “Pocket Girlfriend” by Atrium Designs LLC.


    ![](img/b18903248e3f72f9f244af0aa5762631_17_0.png)'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'The application is rated two-and-a-half stars. A typical review says, “it blows”
    or

    “don’t buy” or “waste.” Of course, there are 7728 reviews as of December 12, 2009,

    at at 99 cents a download, that is over $3500 earned from people who hate the
    game.

    Moreover, for every review, there are probably countless folks who bought the
    App and

    d leave a review. Not bad for a product that folks universally condemn as dumb
    and

    waste of time. The reviews literally warn you not to buy it, but folks—presumably
    men—

    do anyway.


    But before you say, “aha, sex sexy,” search the App Store using the keyword “girls.”

    You will be disappointed; there are pages of time-wasting Apps featuring bikini-clad

    figures, from most of which the authors have little to money. So even if you write
    the

    next “virtual girlfriend” App, standing out from all the others will prove difficult

    ett time consuming. That’s the App Store’s reality. Moreover, every few months
    you will see

    Apple purging the store of questionable material, so why risk it?


    Getting noticed these days requires a quality product, with advertising and exposure.

    Although there are exceptions, you should approach iPhone development with a realistic

    perspective. Getting writing iPhone Apps requires work. Moreover, the quality
    of

    of your App doesn’t necessarily ensure success. Just like any other product in
    any other

    market, these days, most Apps require advertising. And advertising is not cheap.
    And even

    then, chances are, you will not earn enough money to quit your job or drop out
    of school.

    At least not immediately.


    Getting writing an App presupposes a quality App. A quality App requires

    understanding the iPhone SDK and Cocoa Touch. Understanding the iPhone SDK and

    Cocoa Touch requires basic Objective-C. So before you rush out and

    buy a book on “opening your iPhone business” you should first learn Objective-C’s

    fundamentals. This book teaches you fundamentals.


    # # A Teen Developer


    But you can make money on the App Store; even if you’re in high school, with your

    parents’ support, you can sell Apps on Apple’s App Store. Daniel Shaffer, a senior
    in high

    school in NYC, has made over $14,000 and has sold over eleven Apps. His Apps include

    iMPrint illusions, Utilitybox, and several others.'
