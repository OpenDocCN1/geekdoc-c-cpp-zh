  md: '# xviii Objective-C for iPhone Developers: A Beginner''s Guide


    ![](img/b18903248e3f72f9f244af0aa5762631_19_0.png)


    Now true, 14K is not enough to support a family, but it beats working at the local
    burger joint while in high school. At the very least, you can make enough money
    to help pay for your hobby, and perhaps more.


    # Summary


    Hopefully I wasn''t too discouraging. But you should have realistic expectations
    before setting out to learn iPhone programming. The iPhone is a computer, and
    computers require computer programming created using a computer language to get
    them to do something. The iPhone OS operating system uses Cocoa Touch, which is
    written using Objective-C. Before developing an iPhone application of any complexity,
    you will have a basic understanding of Objective-C.


    In this book you learn Objective-C, not the iPhone''s SDK in depth. But you are
    probably excited to begin programming the iPhone immediately, and so this book
    uses very basic iPhone applications to illustrate Objective-C principles. You
    will not gain a good understanding of the UIKit and how to develop a complex App,
    but you will understand how to write a simple, single-view iPhone application.
    And more important, you will obtain a solid understanding of Objective-C, as it
    applies to the iPhone SDK.'
