  md: '# Chapter 4: Classes, Objects, and Messaging


    Like a struct, a human is a class, I am an instance of a class, or an object.
    Now consider how Objective-C implements classes.


    # Objective-C Classes


    Enough on C structs and typedefs; although helpful for understanding the difference
    between classes and objects, they are not a class or an object. A true class encapsulates
    both data and behavior.


    Objective-C is an object-oriented language; as such, it relies upon classes and
    instances of classes, structs and typedefs. An Objective-C class consists of an
    interface, defined in a header file, and an implementation, defined in a source
    file. The interface contains the class'' declarations, while the implementation
    contains the class'' definitions. Figure 4-4 illustrates the sections of an Objective-C
    interface.


    # @interface


    An interface declares the class, its data, and its methods. Like a C header file,
    it does not implement methods but only declares them. At the file''s top go any
    import statements and @class directives. The class'' declaration begins with the
    @interface directive. This directive signals to the compiler that a class declaration
    has begun. Immediately following the @interface directive is the class'' name
    and its parent type. Instance variables between the curly braces immediately following
    the class declaration statement. Methods go after the closing curly brace, but
    before the @end compiler directive. The class'' declaration as a starts with the
    @interface compiler directive and ends with the @end compiler directive.


    ```

    #import <UIKit/UIKit.h>

    #import "stockquote.h"


    @interface StockQuoteWrapper:NSObject

    NSString *protocolURL;

    NSString *receivedData;

    NSConnection*theConnection;

    NSURL*theURL;

    NSURLRequest*theRequest;


    -(void)buildURL:(NSString*)symbol;

    -(void)doStockQuote:(NSDictionary*)dictionary;


    @end

    ```


    | Interface directive | |

    | --- | --- |

    | | Class name;parent name |

    | | Instance variables |

    | | Method declarations |

    | | End directive |


    Figure 4-4 Interface sections'
