  md: "# Deallocating and Nil Revisited\n\nBefore ending the chapter, there is one\
    \ final thing to cover using properties deallocating an object. Throughout this\
    \ chapter, and throughout this book in fact, all examples assume that a class's\
    \ properties are set. For instance, consider the class in Listing 5-27.\n\n+ \
    \  Listing 5-27 Foo.m assuming properties are set\n\n```\n#import \"Foo.h\"\n\
    @implementation Foo\n@synthesize myBar;\n-(void) dealloc {\n  [super dealloc];\n\
    \  [self.myBar release];\n}\n@end\n```\n\nThe code in Listing 5-27 appears sound,\
    \ but if myBar is never allocated and initialized, a runtime error results because\
    \ you are trying to release an unallocated object. When using properties, there\
    \ are two easy ways to deal with this potential problem. The first way is by implementing\
    \ your own init method, where you initialize the class's objects to nil (Listing\
    \ 5-28). Remember, sending a message such as release to nil is valid.\n\n+   Listing\
    \ 5-28 Foo.m initializing its property\n\n```\n#import \"Foo.h\"\n@implementation\
    \ Foo\n@synthesize myBar;\n-(void) init {\n  self = [super init];\n  self.myBar\
    \ = nil;\n}\n-(void) dealloc {\n  [super dealloc];\n  [self.myBar release];\n\
    }\n@end\n```"
