  md: "# Chapter 7: Protocols and Categories\n\nAn object that adopts Fighter must\
    \ punch and kick. Because these methods are required, they are preceded by the\
    \ @required compiler directive. Any methods declared after this compiler directive,\
    \ but before any @optional compiler directive, must be implemented by an adopting\
    \ class. The @required compiler directive is the default; methods without a preceding\
    \ compiler directive are assumed required.\n\nA Fighter doesn't cry; this method\
    \ declaration is preceded by the @optional compiler directive. By using the @optional\
    \ compiler directive, you can add declarations that are optional to adopting classes.\n\
    \nOptional methods require more thought than required methods. When trying to\
    \ send a message to a class adopting a protocol, you must now ensure the class\
    \ adopting the protocol implements the optional method. For instance, I might\
    \ wish to implement the following method in a class:\n\n+   - (void) hitFace:(id\
    \ <Fighter>)aighter;\n\nWhen hit in the face, some Fighters might cry, while others\
    \ might not. For instance, the famous American fighter, Butter, would definitely\
    \ not cry. The author, however, would cry like a baby. The problem is, both Author\
    \ and Butter adopt the Fighter protocol, but only Author implements the cry method.\
    \ If you wish to call an optional protocol in method such as hitFace, you must\
    \ check for the method's existence in the adopting class.\n\n```\n(void) hitFace:(id\
    \ <Fighter>)aighter\nif ([aighter respondsToSelector:@selector(cry)] {\n  [aighter\
    \ cry];\n}\n```\n\nThe easiest way to ensure a class adopts an optional protocol\
    \ method is through the respondsToSelector method. Notice you are using a compiler\
    \ directive @selector in this method. You haven't learned about selectors yet,\
    \ but you will in Chapter 11. For now, simply realize you are telling the compiler\
    \ to ensure the Fighter passed to the method does in fact implement the cry method.\
    \ As an aside, note that had cry taken a parameter, you would have written the\
    \ preceding line containing the selector as part of the @selector compiler directive.\n\
    \n+   -if ([aFighter respondsToSelector:@selector(cry):))"
