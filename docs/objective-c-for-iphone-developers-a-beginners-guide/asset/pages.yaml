  md: '# Preprocessor Directives and Compiler Directives


    Preprocessor directives begin with a # character. Compiler directives begin with
    an @ character. Both are important to an Objective-C program''s structure.


    The code also uses #import rather than C''s #include. Objective-C uses #import;
    the #import preprocessor directive is identical to #include but will not include
    the same header file more than once. Notice the compiler directives; Objective-C
    relies heavily upon compiler directives.


    # Preprocessor Statements


    The #include and #import statements are both preprocessor directives. When you
    compile your program, the compiler''s preprocessor processes statements with a
    # sign before compiling. For instance, #import <file.h> or #import "file.h" tells
    the preprocessor to replace the statement with file''s contents.


    You can also use preprocessor macros. For instance, the #define preprocessor directive
    is a commonly used macro. In Listing 1-4, you two constants, GREETING and AGE.
    When you compile this program, the preprocessor literally replaces all GREETING
    and AGE occurrences with their respective values.


    [Session started at 2009-08-08 16:53:47 -0400.

    2009-08-08 16:53:49.430 HelloWorld[745:20b] Hello James, Dawg. You are 40 years
    old.


    # Compiler Directives


    Compiler directives are what make Objective-C different from C. A compiler directive,
    like a preprocessor directive, instructs the compiler to do something before it
    actually compiles. Compiler directives begin with the @ character. Objective-C
    has its own preprocessor that processes these special directives. The @interface
    and @implementation statements in Listings 1-4 and 1-5 are compiler directives,
    for instance. You do not really need to understand how compiler directives work
    under the covers. Just realize that compiler directives actually take your Objective-C
    code and turn it into regular C code.'
