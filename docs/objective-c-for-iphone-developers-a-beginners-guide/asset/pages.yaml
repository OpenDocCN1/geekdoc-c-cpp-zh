  md: '# Objective-C for iPhone Developers: A Beginner''s Guide


    Methods taking a parameter follow its name with a colon. Methods without omit
    the colon. This distinction is important, as the colon becomes part of the method''s
    name.


    > NOTE

    Objective-C methods that take a parameter use a colon. That colon is part of the
    method''s name. For instance, the method''s name in Figure 4-11 is not buildHelloString;
    but rather, buildHelloString:this is an important distinction.


    If a method has a colon, then the parameter''s type, in parentheses, follows the
    colon. Following the parameter''s type is the parameter''s name, followed by a
    semicolon, which ends the declaration.


    An Objective-C class'' methods, when called by other objects, appear very different
    than coding C functions. This difference is because Objective-C uses called infix
    notation. Infix notation mixes operands and operators. Figure 4-12 illustrates
    an Objective-C message.


    An Objective-C message from one object to another begins with an opening square
    brace and ends with a closing square brace. The message begins with an opening
    square brace, followed by the object''s name (the receiver). The receiver is followed
    by a space, and then the object''s method being called (the message). If a message
    takes a parameter, then the method''s name includes a colon and a parameter value.


    # Class and Instance Methods


    Instance methods begin with a minus sign, while class methods begin with a plus
    sign. If you are familiar with Java, note that a class method is the same as a
    Java static method. A class method occurs at the class level and does not apply
    to an object instance of the class.


    Using a class method does not require creating a class instance before using it.
    As you saw earlier, alloc is a class method. You do not instantiate an instance
    and then call alloc, but rather, use alloc to instantiate an instance of an instance.


