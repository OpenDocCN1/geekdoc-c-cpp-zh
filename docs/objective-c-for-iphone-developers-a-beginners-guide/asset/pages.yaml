    In may you treat Duck as a Swimmer and a Floater. In LeadWeight''s sinkASinkable:
    method you treat Duck as a Sinkable. But notice nowhere in Duck''s interface or
    implementation do specify Duck adopts the Sinkable or Floater protocol. The same
