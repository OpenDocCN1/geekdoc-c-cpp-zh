    If you have ever programmed using Cold Fusion, PHP, or Java, then this chapter
    will seem intuitive. Objective-C allows developers to dynamically invoke a method
    at runtime. In this chapter you explore an Objective-C concept selectors. Selectors
    are arguably one of the most important topics in Objective-C, and allow developers
    significant flexibility.


    # Selectors


    Objective-C allows varying a message dynamically at runtime. Moreover, rather
    than invoking a method directly, or in Objective-C speak, sending a message to
    another object directly, you can use something called a selector to choose which
    method to invoke dynamically at runtime.


    > NOTE

    If you know C or C++, think of selectors as Objective-C''s equivalent to function
    pointers, only much easier to understand and use—at least to an ex-Java developer
    like the


    The @selector( is a compiler directive that when compiled replaces the method
    with a SEL type. A SEL identifies a method and can be used directly in your code.
    Then, rather than calling a method directly, you can call the selector. The following
    code illustrates a selector:


    ```

    SEL sinkFloatable;

    sinkFloatable = @selector(sinkDuck);

    ```'
