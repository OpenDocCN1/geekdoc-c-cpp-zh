    # Initializing an Array


    Arrays provide several convenience constructors for creating an array. One convenience
    constructor that you use often is the arrayWithObjects:method.


    ```

    NSArray * myArray = [NSArray arrayWithObjects:@"A","@B","@"C",nil];

    ```


    This method takes an list, terminated by nil, and creates a new array that contains
    the objects. The nil value indicates the array''s end; however, it is not included
    as part of the array. In the preceding code snippet, the array''s length is 3;
    nil is excluded.


    Rather than using the arrayWithObjects: convenience method, you could have allocated
    the array and then initialized it


    ```

    NSArray * myArray = [[NSArray alloc] initWithObjects:@"A","@B","@C",nil];

    ```


    Other convenience constructors you might use to create an array include the arrayWithArray:,arrayWithContentsFile:,arrayWithContentsOfURL:,arrayWithObject:,arrayWithObjects:,and
    arrayWithObjects:count: methods. With most other Foundation framework classes,
    each of these convenience constructors have a corresponding init method if you
    prefer to manage memory yourself by allocating the array and then initializing
    it.


    # NOTE


    Remember, if you use a convenience constructor, the convenience constructor adds
    the object instance created to the autorelease pool. The runtime, not you, manages
    these objects'' life cycle. If you allocate and then initialize the object, you
    must manage the object''s life cycle. If you wish to manage an object''s lifetime
    that was created using a convenience constructor, you must explicitly call retain
    on the object. But note, if you set a property to an object created using a constructor
    you are calling retain, making this note moot. For instance, the following line
    retains the string even though you use a convenience constructor, assuming myString
    is a property with the retain attribute in its @property directive.


    ```

    foo.myString = [NSString stringWith:@"A Test"];

    ```'
