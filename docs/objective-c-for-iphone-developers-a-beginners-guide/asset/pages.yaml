  md: 'If you must still import the used class'' interface in a class'' implementation
    to use the class, this begs the question, why should you use the @class directive
    instead of the #import directive? Most texts will tell you to avoid needless compilation.
    Their reasoning, although correct, is rarely going to be an issue when programming
    an iPhone App. However, there is a more practical reason for using the @class
    directive. You use the @class directive to mitigate circular dependencies.


    A circular dependency is when two classes are both dependent upon each other.
    For instance, Foo might need to print "foo" to the debugger console. Bar might
    need to print "barfoo" to the debugger console. Because they both rely upon one
    another, they would normally need to import each other''s header file. To build
    Foo, Foo.h must be included in Bar.h, and Bar.h must gets confused and refuses
    to compile. The @class directive mitigates this circular dependency; the following
    Try This illustrates.


    # ### Mitigating a Circular Dependency Using the @class Directive


    Suppose you had two classes that both refer to one another, as in Figure 4-9,
    where both classes must "know" about one another to do their jobs. In This Try
    you mitigate the problem of a circular dependency such as that in Figure 4-9 by
    using the @class directive.


