  md: "# True or False and BOOL\n\nBefore continuing, pause to consider what \"true\"\
    \ or \"false\" really means. C has no true or false but instead has zero or not\
    \ zero, zero is \"false\" and not zero is \"true.\" You must remember this fact\
    \ when evaluating primitives.\n\nA trick that C programmers often do is to define\
    \ a typedef for a Boolean value. For instance, consider the following:\n\n```\n\
    typedef int bool;\n#define FALSE 0\n#define TRUE (1)\n\nfor((q != 7) == TRUE);\
    \ {\n  q++;\n  NSLog(\"*@\");\n}\n```\n\nNow, in subsequent code a developer can\
    \ write code that uses TRUE and FALSE.\n\n> TIP: For everything you wanted to\
    \ know about Boolean data types and more, go to Wikipedia's page on the subject\
    \ (http://en.wikipedia.org/wiki/Boolean_data_type).\n\nObjective-C took this C\
    \ programmer trick and defines a BOOL type. As you already saw in Chapter 2, a\
    \ BOOL is simply a typedef where 0 is false and 1 is true. It is important you\
    \ note, though, that only 1 is true, not every value but 0. More on BOOL after\
    \ you learn about classes in Chapter 4; using BOOL will be second nature by the\
    \ book's end.\n\n# Conditional Statements\n\nThere are often points in a program\
    \ where it must make a choice and conditionally process one set of statements\
    \ or another. For instance, consider the following pseudocode:\n\nIf time is morning\
    \ then prepare breakfast.\nElse if time is afternoon then prepare lunch.\nElse\
    \ if time is evening then prepare dinner and go to bed.\n\nThe statement prior\
    \ to the word \"then\" is the conditional statement. It tells the program, \"\
    If this is true, then execute the following statement(s).\" Conditional statements\
    \ control an application's flow of execution."
