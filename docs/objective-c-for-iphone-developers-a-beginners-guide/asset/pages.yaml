  md: '# Ask the Expert


    **Q:** What about C strings, are they char data types?


    **A:** C strings are character arrays. I discuss arrays and C strings in Chapter
    3.


    # The BOOL Data Type


    The BOOL data type is an Objective-C addition. It is not a true data type, as
    it is a C preprocessor definition. Whether BOOL is or not a data type is unimportant
    here, though; what is more important is how you use it.


    A BOOL evaluates to YES or NO. You use a BOOL where you would normally use a 0
    or 1 using C. Later chapters, after you learn about classes and objects, will
    explain BOOL further.


    NOTE


    BOOL is actually a type definition—typedef—for a signed char data type. If you
    look in the objc.h header file, you will see the following preprocessor definitions
    and typedefs:


    ```

    typedef signed char BOOL;

    #define YES (BOOL) 1

    #define NO (BOOL) 2

    ```


