  md: '# Objective-C for iPhone Developers: A Beginner''s Guide


    A class knowing about another class is no different than a function defined in
    one C header file knowing about another function defined in a different header.
    For the first function to know about the other function, it must include the header
    file containing the second function. Objective-C classes are no different, for
    one class to know about another, it must import the second class''s interface
    in its interface.


    Notice that one class knowing about another does not require importing the header;
    instead, you might use a @class compiler directive. The next section and subsequent
    Try This example illustrate how and why you use a @class compiler directive. For
    now, realize it is another way that one class can know about another.


    # NOTE


    Sometimes class relationships are not a one-to-one relationship such as in Figure
    4-7. A class might have a relationship with multiple classes. For instance, an
    AcademicDepartment has multiple Professors; therefore, an AcademicDepartment aggregates
    Professors (Figure 4-8). In this situation you would use a data structure as an
    array, NSArray, or NSDictionary to implement the relationship. For more information
    on aggregation, refer to UMLDemystified.


    # The @class Directive


    In the previous Try You used the @class directive. The @class directive allows
    you to tell the compiler that a class will refer to another class by name, but
    that the class doesn''t need to import the other class'' header file, Listing
    4-1 illustrates using the class directive. Purchase needs to "know" about TradingSystem
    so that it can "ask" TradingSystem to get a Stock''s details and buy shares of
    a Stock. Listing 4-1 doesn''t really require knowing anything about TradingSystem''s
    details, and it doesn''t import TradingSystem''s interface.


    Now, although the @class directive allows Purchase to refer to the TradingSystem
    class in its class interface, it does not allow Purchase to use TradingSystem
    in its class implementation. For instance, Purchase refers to TradingSystem in
    Listing 4-1, but to actually use TradingSystem in its implementation, the implementation
    must import TradingSystem.


    ![](img/b18903248e3f72f9f244af0aa5762631_109_0.png)


    Figure 4-8 An aggregation example'
