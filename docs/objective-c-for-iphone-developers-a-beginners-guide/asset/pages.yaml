    # File Handling


    Once you obtain a path to a file, you usually wish to manipulate it in some way.
    The NSFileManager class has many methods you can use to manipulate both directories
    and files.


    # NSFileManager


    The NSFileManager class has many methods for manipulating files. Table 9-1 summarizes
    several of NSFileManager''s methods. For more complete NSFileManager coverage,
    and a listing of all methods, you should refer to Apple''s NSFileManager Class
    Reference.


    | Method Name | Description |

    | --- | --- |

    | fileExistsAtPath | Determines if the path specified exists. |

    | fileExistsAtPath:isDirectory: | Determines if the path specified exists and
    if it is a directory. |

    | contentsOfDirectoryAtPath:error: | Returns directories and files of the directory
    passed as a parameter. |

    | enumeratorAtPath: | Returns an NSDirectoryEnumerator to enumerate a directory''s
    contents. |

    | moveItemAtPath:toPath:error: | Moves a directory or file to a different location.
    |

    | copyItemAtPath:toPath:error: | Copies a directory or file to a different location.
    |

    | removeItemAtPath:error: | Deletes a directory or file. |

    | currentDirectoryPath | Returns the current directory path. |

    | changeCurrentDirectoryPath: | Changes the current directory path to the path
    specified in parameter. |


