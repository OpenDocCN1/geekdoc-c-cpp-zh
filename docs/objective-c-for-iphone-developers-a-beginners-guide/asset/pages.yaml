    protocol.


    Because Swimmer adopts the Floater protocol, which adopts the Sinkable protocol,
    the compiler understands that Duck adopts the Floater and Sinkable protocols in
    addition to the Swimmer protocol. Because Driftwood adopts the Floater protocol,
    the compiler understands that Driftwood also adopts the Sinkable protocol.


    # Protocols and Delegates in UIKit


    Enough about Ducks, Floaters, Swimmers, and Sinkables; you will use much more
    pragmatic protocols extensively when developing iPhone applications. The UIKit
    uses protocols to implement something called delegates.


    A delegate is an object whose purpose is to help another object. The UIKit implements
    these helpers as protocols and allows you to define the custom class implementing
    the helper. For instance, most delegates in the UIKit are protocols. Many protocols
    are predefined by the Foundation framework.


    A UIView for loading web pages and uses a delegate called a WebViewDelegate. The
    UIView handles the layout and all the technical aspects of making the page appear
    in your application. It does not handle events such as a page beginning to load,
    loading, and finishing loading. Instead, the UIKit provides the WebViewDelegate
    protocol. Developers are responsible for implementing that protocol should he
    or she wishes to respond to page loading events. They then register the specific
    protocol implementation with the UIView. In the following Try This you implement
    a simple view that loads a webpage. You accomplish this by creating a GuideViewController,
    which inherits from UIViewController and adopts the WebViewDelegate (Figure 7-8).'
