  md: '# Ask the Expert


    **Q:** In Step 5 of the previous Try This, you instructed me to be certain to
    place the exploreIntegers above the main method. Why?


    **A:** As discussed in Chapter 1, Objective-C programs, like C programs, contain
    source header files. Source files end with a .m extension, while header files
    end with a .h extension. Header files declare things, while source files implement
    them. One header files can contain function prototypes. A prototype lets the compiler
    know that a source file will define a function. For instance, in the previous
    Try This you might have declared the function exploreIntegers in a header file,
    explore_integers.h.


    ```

    void exploreIntegers(void);

    ```


    You could have then modified main.m to import the header file by adding an import
    statement to the file''s top.


    ```

    #import "explore_integers.h"

    ```


    When compiling the code, the compiler would then know a source file is to define
    the exploreIntegers function. You could then place the exploreIntegers method
    after main if you preferred.


    But in the previous Try This there is no header file, and so the compiler has
    no way of knowing that exploreIntegers is to be defined. Therefore, you must define
    exploreIntegers before calling it in the main method. Had you not placed exploreIntegers
    before calling it, the compiler would have complained that the method was undefined.


    # TIP


    You can use a short instead of an int or a long to save memory. A short takes
    two bytes, while an int and a long both take four bytes.


    # Numeric Types: Float and Double


    The float data type is a 32-bit (single precision) floating-point number. In computer
    science, rather than using decimal, you say floating-point, but you can just think
    of a float as a small to medium-sized decimal number. A double, like a float,
    is also a floating-point number; however, it is a 32-bit floating-point number.
    Think of a double as a large to very large decimal number.'
