    # Initializing a Mutable Array


    The NSArray is immutable. Once initialized, you cannot modify it. In contrast,
    the NSMutableArray allows modifying an array after creating it. Because it allows
    adding and removing objects from the array, the NSMutableArray has another convenience
    method arrayWithCapacity: This method allows creating a mutable array and allocating
    space in advance for a given number of objects to be added to the array.


    ```

    NSMutableArray *myArray = [NSMutableArray arrayWithCapacity:3];

    ```


    Note that the array in the preceding code snippet is not limited to three objects.
    The arrayWithCapacity: method allocates enough space for three objects; however,
    you can add more objects if needed. Moreover, you are not required to use the
    arrayWithCapacity: method when creating an NSMutableArray instance; any of the
    other NSArray convenience constructors or init methods work. The arrayWithCapacity:
    method is simply more efficient by allocating the needed space when created. When
    adding objects later, the runtime isn''t required to allocate the space for the
    objects.


    # Adding, Removing, and Replacing Objects


    When using an NSMutableArray, you can add, remove, and replace objects that are
    in the array. For instance, the addObject: and insertObject:AtIndex methods allow
    adding an object, the removeObjectAtIndex: method allows removing an object at
    a location in an array, and the replaceObjectAtIndex: method allows replacing
    an object.


