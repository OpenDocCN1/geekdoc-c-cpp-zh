    # Listing 1-3 The main method in main.m is an iPhone application’s starting point.


    ```

    int main(int argc, char *argv[]) {

    NSAutoreleasePool * pool = [[NSAutoreleasePool alloc] init];

    // Log hello world to the debugger console

    NSLog("@Hello World");

    int retVal = UIApplicationMain(argc, argv, nil, nil);

    [pool release]

    return retVal;

    }

    ```


    The main function is simply a C function. Like C''s main, it takes an integer
    and an array of C strings. It also returns an integer, where 0 usually indicates
    success and non-zero indicates an error. You almost never modify main when writing
    an Objective-C program for the iPhone, but understanding how an iPhone program
    begins is fundamental. Starting an iPhone application is the same as starting
    any other C or Objective-C application; it all begins with main.'
