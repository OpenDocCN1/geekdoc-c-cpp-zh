    # Comments


    Objective-C comments are the same as Java and C comments. Single-line comments
    begin with a double forward slash, while multiline comments begin with a forward
    slash followed by a star. A multiline comment ends with a star followed by a forward
    slash. The following code snippet illustrates:


    ```

    // This is a single-line comment

    /* This is a multiline

    comment */

    ```


    You use Objective-C comments the same as you would for most other programming
    languages. You use them to annotate your code and to mark code that you do not
    wish to delete but do not want the application to run. By commenting the code,
    you assure that the compiler does not compile the commented code. Because the
    code is never compiled, it never executes.'
