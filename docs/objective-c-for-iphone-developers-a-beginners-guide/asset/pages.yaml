  md: '# Allocating and Initializing Objects


    Remember, a class is a template, while an object is an instance of template. For
    instance, an architect''s drawing tells a builder how to create an instance of
    a house defined by the architect''s drawing. Moreover, a builder can create multiple
    instances of houses based upon the drawing. Think of the architect''s drawing
    as the class and the houses as objects that implement the drawing.


    Creating a house from a drawing is considerable work; the builders must construct
    the house to create an instance of it. Same with Objective-C, or any object-oriented
    program: to create an object instance of a class, a running program must instantiate
    the object.


    But before the builders can even begin, they must allocate land to build the house
    upon. Again, same with an Objective-C program: it must first allocate memory to
    build the object in. After allocating memory, the running program can then build
    the object.


    # Allocating Memory and Constructing


    If you are familiar with Java or C++, note that unlike these languages, there
    is no new keyword in Objective-C. In C++ and Java you use the new keyword to create
    a new object instance of a class. For instance, the Java creates a new object
    from a Foo class:


    ```

    Foo myFoo = new Foo ();

    In C++ this line would be written

    Foo *myFoo = new Foo();

    ```


    This statement both allocates space and constructs and initializes the new object
    in one statement. But Objective-C requires two steps to create an object instance.
    You allocate an object and build a generic instance of the object using the alloc
    keyword. Here is how alloc works. Every Objective-C class inherits from a base
    class NSObject (more on inheritance later). NSObject has a class method alloc
    (more on class methods later). The alloc method allocates the necessary space
    in memory for the object. It also builds a generic instance of the object according
    to the class template. The following code allocates space and builds a Foo instance:


    ```

    Foo * myFoo = [Foo alloc];

    ```


    Allocating memory instructs a running program to create space for an object instance
    and construct a generic instance of a class.'
