  md: '# # Encapsulation and Memory Management


    In previous sections you examined memory management within a method using local
    variables. In this section you explore memory management using an object''s instance
    variables. Remember, an instance variable''s scope is the same as the object''s,
    and they are declared in an object''s interface. Now, good object-oriented programmers
    never reference these variables externally, instead using something called accessor
    methods. To understand accessor methods better, first consider an object-oriented
    concept called encapsulation.


    Encapsulation is an object-oriented programming design denet stating that instance
    variables should be encapsulated from the outside world. In a nutshell, never
    access a class''s instance variables directly. Instead you should set or get a
    class''s instance variables using methods termed accessor methods. These methods
    are for getting and setting an instance variable properly, and allows things such
    as validation to occur prior to setting an object''s instance variable.


    Accessor methods are also further referred to as "getter" and "setter" methods.
    A getter is for getting an instance variable from an object, while a setter is
    for setting an instance variable in an object. Getters and setters take on increased
    importance in Objective-C program when you consider memory management and retain
    counts.


