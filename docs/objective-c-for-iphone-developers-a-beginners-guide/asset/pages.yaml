  md: '# Objective-C for iPhone Developers: A Beginner''s Guide


    Notifications allow your code to broadcast events, and information about events,
    to other classes that are registered to listen for those events. It accomplishes
    this functionality using NSNotificationCenter.


    Every application has a notification center called the default center. You obtain
    it using the following code:


    ```

    NSNotificationCenter * tempCenter = [NSNotificationCenter default];

    ```


    After obtaining the notification center, you can send notifications to it. You
    send notifications using the NSNotification class. You might send an “I-finished
    performing a long method” notification, for example.


    ```

    [NSNotificationCenter default] postNotificationName:@"LongMethodDone object:self];

    ```


    The code first obtains the default center and then posts a notification named
    “LongMethodDone”. The object parameter allows you to pass the notification’s sender.
    There is also a method that allows posting an NSDictionary containing more information
    you might wish to send with the notification.


    ```

    NSDictionary * myInfo = [NSDictionary dictionaryWithObject:@"information" key:@"informationkey];

    [NSNotificationCenter default] postNotificationName:@"LongMethodDone" object:self
    userInfo:myInfo];

    ```


    Other classes that receive the “LongMethodDone” notification can register as listeners
    with the notification center.


    ```

    [NSNotificationCenter defaultCenter] addObserver:self selector:@selector(handleLongMethodDone:)
    name:@"LongMethodDone" object:nil];

    ```


    In this code an object is registering itself as an observer of the “LongMethodDone”
    notification; it is also specifying that it receives the notification, the handleLongMethodDone:
    method restricts the notification center to only informing the registrant for
    events in a particular object. For instance, suppose Foo and Bar both fire the
    “LongMethodDone” event. Or, suppose you have many Foo instances, but you only
    wish to receive a notification for a particular Foo instance. In these situations,
    you would pass the object to the center. The center would then only inform the
    registrant of “LongMethodDone” events for the passed Foo.


    Objects that register as event observers can also deregister themselves as listeners.


    ```

    [NSNotificationCenter defaultCenter] removeObserver:self];

    ```'
