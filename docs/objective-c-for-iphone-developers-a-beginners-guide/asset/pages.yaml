  md: '# Objective-C for iPhone Developers: A Beginner''s Guide


    > NOTE

    Apple slightly modifies the Xcode interface with every minor release. Your Xcode
    interface will most likely appear slightly different than this book''s.


    # Header Files and Source Files


    Objective-C, like C, consists of header files and source files. Header files contain
    method prototypes and variable declarations and end with the .h file extension.
    Source files contain method implementations and variable implementations and end
    with the .m file extension. Objective-C, unlike C, uses header files to declare
    class interfaces and source files to declare class implementations. Listings 1-4
    and 1-5 illustrate an Objective-C header file and source file defining a SayHello
    class.


    +   Listing 1-4 An Objective-C Class interface in a header file


    ```

    #import <UIKit/UIKit.h>

    #define GREETING "Dawg"

    #define AGE 40

    @interface SayHello {

    NSString * test;

    }

    (void) sayHello:(NSString *)name;

    @end

    ```


    +   Listing 1-5 An Objective-C Class implementation in a source file


    ```

    #import "SayHello.h"

    @implementation SayHello

    (void) sayHello:(NSString *)name {

    NSLog("Hello %@, %@. You are %i years old.", name, GREETING, AGE);

    }

    @end

    ```


    Although Objective-C classes and class methods are not discussed until Chapter
    4, notice from the preceding two listings that Objective-C methods look different
    from C functions and Java methods. As you will learn in greater detail in Chapter
    4, Objective-C uses what is called infix notation.'
