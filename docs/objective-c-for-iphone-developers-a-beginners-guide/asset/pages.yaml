    Up to now, I have glossed over Objective-C''s strange syntax. However, this strange
    syntax is actually quite elegant. Figure 4-11 illustrates a typical method declaration
    in Objective-C.


    A method declaration begins with a + or - sign. As you learn in the next section,
    this indicates whether the method is a class method or instance method. The declaration
    then specifies the method''s return type. For instance, in Figure 4-11 the method
    returns an NSMutableString. Note that if a method does not return anything, you
    write void in the parentheses, as the following code illustrates:


    ```

    -(void) buildHelloString:(NSString *) methodName;

