  md: '# Key Skills & Concepts


    +   - Understanding Protocols

    - Modeling Protocols Using UML

    - Adopting Protocols

    - Using Protocols

    - Understanding Categories

    - Using Categories


    > if you know anything about Java''s interfaces, then you already have a reasonable
    understanding of Objective-C''s protocols. A protocol is a contract that specifies
    methods that an adopting class must implement if it is to properly adopt the protocol.
    Protocols are an important Objective-C programming concept that you must understand
    to successfully write iPhone applications. In this chapter you learn about protocols.


    # Protocols


    Protocols declare the behavior an object can exhibit or what other objects can
    do to an object. For instance, suppose you had Bumblebee, Jet, and Bird classes.
    All three, although unrelated, implement the flying behavior, and so you could
    say they are each a Flyer. Also notice that you could shoot all three with a gun,
    and so you could also say they are Shootable. In both situations you are using
    a concept to group unrelated objects based upon behaviors. Protocols model these
    types of situations.


    A class that wishes to adopt a protocol must implement the methods declared by
    the protocol. By requiring the adopting class to implement methods, a protocol
    forms a contract. That contract ensures the runtime that a class that adopts a
    protocol implements the methods declared by the protocol.'
