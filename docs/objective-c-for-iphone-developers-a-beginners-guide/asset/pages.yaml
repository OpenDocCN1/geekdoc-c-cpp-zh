    # NOTE


    If you wish to use a custom object as a key, you must adopt the NSCopying protocol.
    This means that any class you use as a key must implement the copyWithZone:zone
    method. You must also override the isEqual and hash methods in NSObject. For more
    information, refer to Apple’s documentation on the NSCopying protocol. It is much
    easier to just use a primitive value in a Foundation framework class as your key,
    though, and it will be sufficient for 99 percent of the code you write.


    # Creating a Dictionary


    There are several ways to create an NSDictionary. Using the dictionaryWithObjects:forKeys:
    is one way you might create a dictionary. For instance, the following code fragment
    declares an array of values and an array of keys. It then uses to create a dictionary.


    ```

    NSArray * myKeys = [NSArray arrayWithObjects:"@firstkey", "@secondkey",

    @thirdkey", nil];

    NSArray * myObjects = [NSArray arrayWithObjects:"@valueone", "@valuetwo",

    @valuethree", nil];

    NSDictionary *Dictionary = [NSDictionary dictionaryWithObjects:myObjects

    keys:myKeys];

    ```


    You can also create an NSMutableDictionary using the dictionaryWithCapacity: method.
    Like the NSMutableArray’s arrayWithCapacity: method, the dictionaryWithCapacity:
    method creates a dictionary and allocates memory for the dictionary.


    NSMutableDictionary * myDictionary = [NSMutableDictionary dictionaryWithCapacity:3];


    You can add objects to the dictionary as needed.


    ```

    [myDictionary setObject:"@valueone" forKey:"@firstkey\n[myDictionary setObject:"@valuetwo"
    forKey:"@secondkey\n[myDictionary setObject:"@valuethree" forKey:"@thirdkey\];

    ```


    As working with other Foundation framework classes, rather than using a convenience
    method, you can allocate and initialize an NSDictionary.


    ```

    NSDictionary * mydictionary = [[NSDictionary alloc] initWithWithObjects:myObjects

    keys:myKeys];

    ```'
