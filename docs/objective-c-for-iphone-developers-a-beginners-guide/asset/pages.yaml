  md: '# Target-Action


    Throughout this book you graphically connected IBActions in code to events fired
    by controls in Interface Builder. Although this ability is useful, there are many
    times when you must dynamically assign an IBAction to a control in your code.
    You can easily add a target to the control using the addTarget method. For instance,
    the following code adds the changeMyLabelText: method as an action for a UIButton
    for the "Touch Up Inside" event.


    ```

    self.myButtonOne addTarget:self action:@selector(changeMyLabelText:)

    forControlEvents:UIControl.EventTouchUpInside;

    ```


    All iPhone controls inherit from the UIColor class. This class has a method add:action:forControlEvents:
    that allows tying a control event to an action in code.


    +   - (void)addTarget:(id)target action:(SEL)action forControlEvents:(UIControlEvents);


    The target is the object that receives the action. The action is a selector identifying
    the method that should be invoked. The controlEvents are the control''s events
    that would fire the selector. The following Try This illustrates how to programmatically
    connect an action to a control event using code.


