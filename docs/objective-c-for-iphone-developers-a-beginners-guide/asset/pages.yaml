  md: 'UIViewController in your application inherits from the view controller implementing
    the color property. You can use this inheritance to great effect when creating
    non--trivial user interfaces.


    # Summary


    In this chapter you explored how Objective-C implements inheritance. A child class
    inherits its parent class'' instance variables and methods. Moreover, it inherits
    every ancestor''s instance variables and methods. This allows efficient code reuse
    and makes your applications less prone to error because it has less duplicated
    code.


    A child class can extend a parent and override a parent''s functionality. When
    extending a parent, a child adds new functionality to a parent. When overriding
    a parent''s functionality, it can either replace a parent''s functionality or
    add to it. But remember, you can only replace a parent''s methods and not its
    instance variables.


    You will use inheritance extensively when developing iPhone applications. All
    UIKit graphical controls ultimately inherit from the UIView class. When you create
    a view''s view controller, you almost always create a ViewController subclass.
    In fact, when using the Foundation framework or the UIKit, unless working directly
    with NSObject, you are always using a child class. Understanding inheritance is
    fundamental to understanding Objective-C.'
