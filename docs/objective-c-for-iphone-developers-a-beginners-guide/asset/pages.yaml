    # Adopting Multiple Protocols


    Sometimes you might wish to create a class that adopts multiple protocols. Consider
    ducks. Ducks can fly and so they should adopt the Flyer protocol you declared
    earlier. But ducks can also swim. Swimming, like flying, is a behavior shared
    by many unrelated entities, and you should probably create a Swimmer protocol
    with a swim method declaration.


    Duck should adopt both protocols. Objective-C allows objects to adopt more than
    one protocol. When a class adopts more than one protocol, you list the protocols
    as a comma-separated list.


    ```

    @interface Duck : NSObject <Flyer, Swimmer>

    ```


    The Duck class adopts the Flyer and Swimmer protocols in the preceding code snippet.
    A class is unlimited in how many protocols it can adopt. For instance, you might
    have the following interface declaration for a Duck:


    ```

    @interface Duck : NSObject <Flyer, Swimmer, Quacker, Roastable, Diver, Eaterable>

    ```


