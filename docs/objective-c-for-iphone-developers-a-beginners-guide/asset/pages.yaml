  md: '# Chapter 1: Exploring the iPhone SDK and Basic Programming


    # Pointers


    Pointers are important in Objective-C. However, successfully using them in Objective-C
    does not require a deep knowledge. In this section, I briefly discuss pointers.


    A pointer points to a location in memory. Consider an iPhone''s memory as one
    large cubbyhole; similar to the one you likely had in kindergarten. Each cubbyhole''s
    content is the actual value. For instance, the following statement assigns a value
    to a cubbyhole''s content.


    ```

    int cubbyHOne = 32;

    ```


    Now suppose each cubbyhole is numbered by a row and column. A pointer points to
    the cubbyhole''s address. So a pointer to cubbyHOne would look like the following:


    ```

    int *pointerToCubbyHole = &cubbyHoleOne;

    ```


    This statement creates a pointer to an integer and then assigns the pointer cubbyHOne''s
    address. Note that it is cubbyHOne''s address, not cubbyHole''s value. When declaring
    a pointer variable, you indicate that it is a pointer by using the * operator.
    When you use a variable by the *, you are referring to the variable''s address
    and not the variable''s value. Finally, if you wish to refer to the value a pointer
    points to, you precede it with a *. The following NSLog statement illustrates
    accessing the pointerToCubbyHOne''s actual value.


    ```

    NSLog("The value: %i", *pointerToCubbyHoleOne);

    ```


    You do not really need to understand much about pointers than that. In future
    chapters, you will use objects, you will be strictly using pointers to objects,
    and not the objects themselves. Basically, all you need to remember is that pointers
    allow Objective-C to pass objects around by reference and not the actual object,
    saving considerable memory.


    # Xcode Fundamentals


