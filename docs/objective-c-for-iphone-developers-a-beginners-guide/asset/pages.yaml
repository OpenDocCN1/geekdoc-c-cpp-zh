    # Collections


    Wikipedia defines a collection as a “grouping of some variable number of data
    items (possibly zero) that have some shared significance to the problem being
    solved and need to be operated together in some controlled fashion.” An array
    is a collection, for instance, as it is an ordered group of values with the same
    data type. Typical collections in most programming languages include sets, arrays,
    and dictionaries. In this section you explore the NSArray, NSMutableArray, NSDictionary,
    and NSMutableDictionary classes. These four classes, although not all the Objective-C
    collections classes, are the most important, as you will use them in almost every
    application you write.


    # NSArray and NSNSMutableArray


    The NSArray and NSNSMutableArray are collection classes for holding an ordered
    collection of Objective-C objects. The NSArray is immutable, meaning it cannot
    be changed, while the NSNSMutableArray is mutable and can be changed.'
