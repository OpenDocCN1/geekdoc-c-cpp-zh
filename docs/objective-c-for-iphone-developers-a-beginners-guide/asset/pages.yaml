  md: '# 232 Objective-C for iPhone Developers: A Beginner’s Guide


    Now, imagine a dictionary where its definitions are in random order, much as they
    would be if you randomly placed objects in an NSArray. Finding a word would require
    you to iterate through every value until you found the word you were searching.
    Real dictionaries, in contrast, let you thumb to the letter, and then let you
    thumb to the first few letters of a word. You can then scan the page and find
    the exact word.


    A dictionary, or hashmap, lets your application do the same thing. Using some
    searching algorithms, the NDictionary can search for a particular value more efficiently
    than you could by iterating through an array. This efficiency results in less
    wasted resources and quicker applications.


    # Dictionary Keys


    In an NSDictionary, for each there are two objects stored, the key and the value.
    The key is how you find an object stored in the dictionary; it is the "word.\
    For instance, the following code fragment searches a dictionary for a Foo object
    with the NSString having a value "firstFoo.\ Because the objectForKey: method
    returns an id, you cast the value before setting it to a concrete class


    ```

    NSString *myKey = @"firstFoo"

    Foo *myFoo = (Foo*)[myDictionary objectForKey:myKey];

    ```


    A key does not require its class to be an NSString. Any class that inherits from
    NSObject implements a method called isEqual:. This method checks if two objects
    are equivalent. The NSDictionary will call the isEqual: method to see if the object
    is equal to the key.


    +   - (BOOL)isEqual:(id)Object


    For instance, the NSNumber class checks to see if another number is the same as
    it, not if both NSNumbers point to the same underlying object.


    ```

    NSNumber *myNumber1 = [NSNumber initWithInt:2]

    NSNumber *myNumber2 = [NSNumber initWithInt:2]

    if ([myNumber2 isEqual:myNumber1]);

    ```


    Using another Foundation framework object as a key is straightforward. For instance,
    the following code snippet uses an NSNumber that contains an integer as a key:


    ```

    NSNumber *myKey = [NSNumber initWithInt:22]

    Foo *myFoo = (Foo*)[myDictionary objectForKey:myKey];

    ```'
