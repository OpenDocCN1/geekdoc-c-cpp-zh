    # NSData


    The NSData class holds binary data. As with NSString, you can initialize NSData
    with the contents of a file; instead of loading the file as text data, it loads
    the data as binary. Because it loads the file as binary data, you can load any
    file into NSData. Thus, NSData is useful for working with images and multimedia.


    The NSData class has convenience constructors. One you use often is the dataContentsFromFile:
    method. This method creates and initializes an NSData object with the binary content
    of a file. For instance, the following snippet obtains the image file, babelfish.png,
    from an application''s bundle and creates an NSData instance with the file''s
    content.


    ```

    NSData * tempData = [NSData dataWithContentsFile:[NSBundle mainBundle] pathResource:@"babelfish"
    ofType:@"png"]

    ```


    # NOTE


    Both NSString and NSData have several methods for working with URLs in addition
    to files. Refer to both classes'' documentation for more detail.


    The NSData class can hold anything, everything is binary. One common development
    pattern you use when developing an iPhone application is placing your app''s images
    in the bundle. You then dynamically load a UIImageView view with an image obtained
    from the bundle.


    Audio data is something you work with often as binary data. For instance, suppose
    you wished to play a sound system. You must load the data into an NSData class
    first. The Following Try Illustrates.


    # NOTE


    For more information on Audio handling, refer to iPhone SDK: A Beginner''s Guide
    and Apple''s online documentation.'
