  md: '# Objective-C for iPhone Developers: A Beginner''s Guide


    # Key Skills & Concepts


    +   - Downloading and Installing the iPhone SDK

    - Understanding Where to Get Help

    - Understanding Basic Programming Concepts Using C

    - Reviewing C''s Pointers

    - Writing a Basic Objective-C Program in Xcode

    - Understanding Where to Get More Information on Xcode


    This chapter covers several topics needed prior to delving into Objective-C. The
    first topic discussed is how to join the iPhone Developer''s Center. The chapter
    then discusses several resources that you can use to help you as you learn Objective-C
    and iPhone programming. Chances are, you are ready to begin programming now, and
    not when you have completed this book. So than waiting until the book''s end,
    I list several resources up front. These resources are invaluable for both beginners
    and more advanced developers, and will help you get started immediately.


    After covering the SDK and online resources, the chapter begins its Objective-C
    discussion by discussing C. In this chapter, though, I only discuss the most basic
    C concepts. For instance, I briefly discuss header files, preprocessor statements,
    comments, and C pointers. The chapter does not do any single basic subject, and
    you should seek out beginner resources on C programming if you have never programmed
