    NSArray * components = [pathToFile pathComponents];

    NSString * myEnum = nil;

    for(myEnum in components) {...}

    ```


    # pathExtension


    The pathExtension method is an NSString method for extracting a file extension
    from a path in an NSString. For instance, the following code creates a string
    with a path to the test1.txt file and then extracts txt from the string.


    ```

    NSString * pathToFile = [NSBundle mainBundle] pathForResource:@"test1" \ofType:@"txt"

    NSLog("path extension:%@", [pathToFile pathExtension]);

    ```


    # writeToFile:atomically:encoding:error:


    NSString can write its content directly to a file using the writeToFile:atomically:encoding:error:
    method.


    ```

    [myString writeToFile:filePath atomically:encoding:NSUTF8StringEncoding error:&myError];

    ```


    # NOTE


    The atomically parameter specifies the string should first write to a temporary
    file, before moving the data to the specified file. This helps avoid data corruption.'
