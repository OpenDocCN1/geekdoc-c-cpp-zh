  md: '# Delaying a Selector or Running in Background


    The performSelector:withObject:afterDelay: method allows calling a method after
    a short delay. Although at first glance, this might seem like a useless method,
    it allows you to easily accomplish things that other require multithreading.


    Suppose you wished to send a message to an object after a delay, then you could
    use the performSelector:withObject:afterDelay: method. The following code illustrates:


    ```

    [myFoo performSelector:@selector(sayFooName:) withObject:"Ralph"

    afterDelay:20];

    ```


    The preceding code line calls myFoo''s sayFooName: method after a twenty-second
    delay. It also passes the string "Ralph" as a parameter.


    Another method you might use is the performSelectorInBackground:withObject:method,
    which allows calling a method using a different thread, the background thread.


    ```

    SEL selector = @selector(sayFooName:);

    [myFoo performSelectorInBackground:selector:withObject:"Ralph"]];

    ```


    The performSelectorInBackground:withObject:method calls the selector immediately
    but does so on a new background thread.


    # Multithreading


    A single-threaded application can only do one thing at a time—Imagine if you could
    only do one thing at a time—you couldn''t drink your morning coffee and read the
    newspaper at the same time; you would have to wait until you finished drinking
    your coffee before reading the paper. A multithreaded application, in contrast,
    allows you to do multiple things simultaneously—you can drink your coffee and
    read the newspaper at the same time.


    Multithreaded applications are more difficult to write than single-threaded applications,
    but there are many times when you need a multithreaded application. For instance,
    suppose you were loading an iPhone screen''s view and part of that view required
    a long-running method. The view wouldn''t load until the method completed running
    the same thread that is the long-running method is also loading the view, and
    a single thread can only do one thing at a time.


    But using the performSelectorInBackground:withObject:method, you can create a
    new thread and run the method on a different thread than the thread loading the
    view. You could also mimic the behavior by using the performSelector:withObject:afterDelay:
    method.'
