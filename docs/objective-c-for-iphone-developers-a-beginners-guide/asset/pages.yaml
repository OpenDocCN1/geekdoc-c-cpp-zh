  md: '# Extending Protocols


    You can also have protocols adopt other protocols. Suppose you had driftwood and
    a duck. Both are buoyant, and so each adopts the “Floater” protocol. But only
    the duck implements the swimming behavior. Now, it seems reasonable that a Swimmer
    must be a Floater, otherwise how could a swimmer swim? And so you have the Swimmer
    protocol adopt the Floater protocol.


    The syntax for a protocol extending another protocol is as follows:


    ```

    @protocol Swimmer <Floater>

    ```


    You declare the protocol and then declare that it adopts the protocol you wish
    extending. In the preceding code snippet you are declaring a Swimmer protocol
    that adopts the Floater protocol. A class that adopts a child protocol automatically
    adopts the parent protocol. This means the class must implement both protocol’s
    methods. Note that you are not allowed to redefine methods in a protocol as you
    do with inherited classes.


