  md: 'Notice what this example also illustrates: poor design. Categories allow ad
    hoc additions to classes; but ad hoc additions are poor substitute for correctly
    designing your application. In a real project you should return to the original
    class and add the quick method to Duck. But sometimes this isn''t an option, for
    instance, when using the NSMutableString class. When changing the original class
    isn''t an option, you can either extend the original class with a new child class
    or you can use a category.


    # # Summary


    In this chapter you explored protocols and categories. Protocols are an important
    object-oriented concept that allows grouping related and unrelated objects based
    upon their behavior. In this chapter you used simplistic, real-world examples;
    however, you will see protocols used extensively when programming iPhone applications.


    The UIScrollView and its UIScrollViewDelegate is just one example of an iPhone
    application using a protocol to implement a ''class'' delegate. ACollectionView
    has a delegate property. When certain life-cycle methods occur, such as a page
    loading, it invokes the applicable delegate''s method. Because the class assigned
    to the delegate property adopts the UIScrollViewDelegate protocol, it implements
    the delegate methods called by the UIScrollView.


    Categories are a way you might add functionality to an existing class. When developing
    your application, you should not rely upon categories. For instance, if during
    a project, you find that you require a "BetterDuck," as in the Try This example,
    then you are better off modifying Duck than using a BetterDuck category. Categories
    should not be a license to add additional functionality to poorly-thought classes.


    Where categories are useful, though, when extending preexisting classes, such
    as Foundation framework classes. Often you do not wish to create a subclass of
    a class such as NSString. Instead, you only wish to add one or two additional
    methods. In this situation, you might consider using a category.'
