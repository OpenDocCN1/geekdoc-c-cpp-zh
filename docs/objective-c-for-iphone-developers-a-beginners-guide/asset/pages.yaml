    <Application Root>/tmp


    You write your application''s preferences to the Preferences folder. You write
    temporary files to the tmp folder. Data written to the tmp folder is not persisted
    between application invocations and not backed up by iTunes on a user''s desktop.
    You write your application''s data to the Documents directory. This directory''s
    content is persisted between invocations and is backed up by iTunes on a user''s
    desktop or laptop.


    # NSHomeDirectory


    Every iPhone application has a home directory. The home directory is your application''s
    root directory. The following code illustrates how you obtain the path to your
    root directory.


    ```

    NSString * pathToHome = NSHomeDirectory(void);

    ```


    Obtaining your application''s home directory isn''t very useful, though, as you
    do not write to this directory. Moreover, resources as images and text files that
    you place in your Xcode''s Resources group are placed in your application''s bundle
    and are more easily accessed using the NSBundle, as you will see in a couple sections.
    It is also not very useful for obtaining your application''s temporary, cache,
    or documents directory, as the easiest and most robust way to obtain one of these
    subdirectories is through the NSSearchForDirectoriesInDomains function.


    # NSearchPathForDirectoriesInDomains


    Obtain your application''s directories or caches using the NSSearchForDirectoriesInDomains
    method. This method takes three parameters: the directory to search, the search
    path mask, and a flag indicating if tilde should be converted to actual paths.
    The method returns an array of NSStrings for all found paths. On a desktop computer
    the method returns more than one path in the array, on the iPhone the method always
    returns an array with only one element. The following code snippet illustrates
    using NSSearchPathForDirectoriesInDomains method to obtain an application''s documents
    directory:


    ```

    NSArray * myPaths = NSSearchPathForDirectoriesInDomains (NSDocumentDirectory,

    UserDomainMask, YES);

    NSString * myDocPath = [myPaths objectAtIndex:0];

    ```


    Other values you might use for the directory parameter include NSApplicationDirectory,
    NSCachesDirectory, and NSApplicationSupportDirectory.'
