  md: '# Chapter 5: Memory Management and Properties 113


    # # Manual Memory Management


    Cocoa classes and Objective-C classes you create are subclasses of NSObject. NSObject
    has several methods used for memory management. The class method alloc allocates
    memory space for an object. The instance method dealloc deallocates an object''s
    memory. But you should never call dealloc in your code, though, as the runtime
    does for you. Instead you use something called reference counting.


    Along with alloc and dealloc, every object that inherits from NSObject also has
    retain and release methods. The retain method increases an object''s retainCount
    by 1. The release method decreases an object''s retainCount by 1.

    When memory is allocated for an object using the alloc keyword, the runtime increases
    an object''s retainCount variable by 1. During an object''s lifetime, you might
    create other reference variables you wish to point to the same underlying object.
    When you do that, you explicitly call retain, so the runtime knows the new reference
    is pointing to the object and has a stake in the object''s existence. This is
    commonly referred to as "ownership" by Objective-C developers.


    ```

    Foo * myFooOne = [[Foo alloc init]; // count is 1

    Foo * myFooTwo = myFooOne; //myFooTwo points to original Foo


    //retain count remains 1

    [myFooTwo retain]; //runtime now knows myFooTwo points to Foo,


    //retain count is 2

    ```


    In the preceding code snippet, by calling retain, myFooTwo is expressing to the
    runtime that it has an ownership stake in the original Foo. During an object''s
    lifetime, many different reference variables might retain the object. However,
    reference variables can also relinquish their ownership stake through the release
    method. The release method tells the runtime that the reference variable is finished
    with the object and no longer needs it, so the object''s retainCount is decreased
    by one.


    While an object has a retainCount of one or more, the runtime persists the object.
    When an object''s retainCount is zero, the runtime deallocates the object and
    reclaims its memory space.


    Figure 5-1 illustrates a Foo object''s lifetime. The Foo object is first allocated
    in memory by a myFooOne reference variable. At this point the Foo object''s retain
    count is 1.


    ```

    Foo * myFooOne = [[Foo alloc init];

    ```'
