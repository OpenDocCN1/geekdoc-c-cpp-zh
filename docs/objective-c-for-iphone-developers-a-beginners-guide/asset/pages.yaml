    # Inheritance


    Inheritance is a powerful object-oriented concept for extending a class''s functionality.
    You have already seen in previous chapters, Objective-C uses inheritance extensively.
    In this chapter you explore how Objective-C implements inheritance. You first
    learn Objective-C''s inheritance syntax and how you can model inheritance. You
    then explore how inheritance facilitates extending an ancestor class and also
    facilitates redefining an ancestor class.


    # Inheritance Explained


    Inheritance is an object-oriented principle that allows reusing existing code
    with less modification. How it works is that a child class extends a base class.
    A base class is also referred to as the child class'' parent. The child class
    can then use the base class''s instance variables and methods. This reuse is called
    inheritance because child classes inherit the methods and instance variables of
    its ancestor classes.


    A child classes can extend a parent class'' functionality. And a child class can
    replace a parent class'' functionality. For instance, all fruit have certain shared
    characteristics. However, different fruit can have different characteristics that
    specialize a Fruit. All fruits have skin, but apple, orange, and pear skins are
    all a little different. Or consider a living'
