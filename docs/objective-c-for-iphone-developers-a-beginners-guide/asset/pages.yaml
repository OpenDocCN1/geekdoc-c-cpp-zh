  md: '# Key Skills & Concepts


    +   - Understanding Property-List Objects

    - Serializing Objects Using writeToFile:atomically:

    - Deserializing Objects Using readFromFile:atomically:

    - Writing Your Own Serializable Classes


    In the last chapter you saw how to easily write data stored in an NSString or
    NSData object to a file. As you learn in this chapter, you could that because
    these classes are both property-list classes. A property-list object is an instance
    of a class that you can persist and reconstruct from a property-list file. In
    this chapter you explore property-list classes. You also learn how to persist
    several classes together as a single property-list. Property lists are an easy
    means of storing your application''s state to a file so that its state can easily
    be reconstructed the next time a user runs your application.


    After learning property lists, you then learn how to persist your custom objects
    using archiving. Archiving allows you to persist custom objects that implement
    the NSCoding protocol. You can persist single objects and also an arbitrary number
    of objects using archiving. In this chapter you do both.


    # Property Lists


    Mac and iPhone applications often rely heavily upon property lists. A property
    list is an object hierarchy that can persist and reconstruct from a file for the
    NSArray, NSDictionary, NSData, NSDate, and NSNumber classes (or their mutable
    equivalents). When persisting one of the collection classes, its constituents
    must also be one of the property-list classes.


    When you persist an array, or dictionary (i.e., a property list with multiple
    values), the list''s underlying format is XML. For instance, Listing 10-1 shows
    an NSArray and its corresponding XML file.


    Listing 10-1 An array and its plist


    ```

    NSArray *myArray = [[NSArray alloc] initWithObjects:@"first",@"second",@"third",nil];

    ```'
