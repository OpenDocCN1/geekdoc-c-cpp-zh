  md: '# Chapter 3: Flow Control Statements, Arrays, and Structures


    # Boolean Expressions


    A Boolean expression results in a Boolean value—true or false. For example, the
    expression "Apple equals Orange" evaluates to false, as an apple does not equal
    an orange. Another example, 5 > 3 evaluates to true, as 5 is greater than 3. Both
    statements result in a true or false value.


    You can combine Boolean expressions to form more complex expressions. For instance,
    you might write "Apple equals Orange AND 5 > 3." It evaluates to false even though
    5 is greater than 3, an apple is not an orange.


    Boolean expressions joined by AND must both be true. Boolean expressions joined
    by an OR must have one or the other expression evaluate to true for the entire
    expression to be true. For instance, the statement "Apple equals Orange OR 5 >
    3" evaluates to true even though apple is not an orange, 5 is greater than.


    You may group Boolean expressions using parentheses. For instance, consider the
    following expressions.


    +   (3 > 5 AND 5 < 9) OR ("a" == "a" AND "b" == "b")

    (4 == 4 AND 5 < 7) OR (7 == 7 AND 8 > 2)


    The first statement evaluates whether it is true or false that 3 is greater than
    5 and 5 is less than 9. Because 3 is not greater than 5, the first expression
    grouping evaluates to false. But the second grouping evaluates to true because
    a equals a and b equals b. A false or a true evaluates to true, and so the Boolean
    expression is true.


    The second statement evaluates if 4 equals 4 and if 5 is less than 7. Both are
    true, and it evaluates the first expression to true. The second expression is
    also true, as 7 equals 7 and 8 is greater than 2. Because both expression groupings
    are true, the Boolean expression as a whole evaluates to true.


    Understanding basic Boolean algebra is fundamental to understanding conditional
    logic and control flow. If you have never taken a computer science course, then
    you should seek out a tutorial or two on the web. A good place to start is Wikipedia''s
    page on truth tables (http://en.wikipedia.org/wiki/Truth_table). A truth table
    is nothing more than a table that evaluates True/False combinations and their
    ultimate Boolean evaluation. But do not worry about the more difficult combinations,
    as they are not required for this book. If you understand the little bit discussed
    in this section, you should okay to continue with looping and conditional statements.
    However, if you do not understand, be certain to seek out some other resources,
    as simple Boolean logic is fundamental to looping and conditional statements.'
