    # Summary


    In this chapter you explored file handling on the iPhone. When you write an iPhone
    application, you can only write files to directories in your application''s sandbox.
    The NSFileManager has many methods for working with files and directories. The
    NSString and NSData classes both have methods for working with files and directories
    also.


    An application''s bundle is where Xcode places items in the Resources grouping
    in Xcode. You obtain these resources using the NSBundle. But before you can modify
    a resource in your application''s bundle, you must copy or move the resource to
    another directory such as your documents or tmp directory.


    You could, of course, always use the C lower-level file handling functions, but
    the higher-level Foundation framework classes are easier to work with. You barely
    scratched the surface of the Foundation framework''s many file handling techniques.
    For more information you should refer to each class''s relevant documentation.'
