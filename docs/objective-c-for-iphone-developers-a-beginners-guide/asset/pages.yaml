  md: '# Essential Skills—Made Easy!


    Create your own iPhone and Mac OS applications with ease. Objective-C for iPhone
    Developers: A Beginner''s Guide shows how to use the Objective-C programming language,
    Apple''s Foundation framework, the iPhone SDK, and the Xcode development environment.
    The first stop for aspiring iPhone developers, hands-on guide teaches you how
    to create versatile, innovative, and marketable apps in no time. Real-world examples
    throughout the book correspond with downloadable Xcode projects and video tutorials
    so you can get started with your first app right away.


    # Designed for Easy Learning


    +   * Key Skills & Concepts—Chapter-opening lists of specific skills covered in
    the chapter

    * Ask the Expert—Q&A sections filled with bonus information and helpful tips

    * Try This—Hands-on exercises that show you how to apply your skills

    * Notes—Extra information related to the topic being covered

    * Tips—Helpful reminders or alternate ways of doing things

    * Annotated Syntax—Example code with commentary that describes the programming
    techniques being illustrated


    Ready-to-use code at mhprofessional.com/computingdownload and www.jamesbrannan.com.


    James. Brannan is a registered iPhone developer and creator of several iPhone
    apps. He is the author of iPhone SDK Programming: A Beginner''s Guide and other
    books. James has worked as a developer since 1994, using languages from Awk to
    C to Visual Basic. He is currently an independent iPhone consultant working with
    several clients. Instructional videos can be viewed at the author''s website,
    www.jamesbrannan.com.


    Learn more. Do more.


    MHPROFESSIONAL.COM


    Programming

    Cover Design: Jeff Weeks


