  md: '# 268 Objective-C for iPhone Developers: A Beginner''s Guide


    Note that there is some slight variation in NSString writeToFile:atomically: method,
    which is actually the writeToFile:atomically:encoding: method, as you must specify
    the string''s encoding.


    +   - (BOOL)writeToFile:(NSString*)path atomically:(BOOL)useAuxiliaryFile encoding:(NSStringEncoding)
    error:(NSError **)error


    Note that NSNumber and NSDate have no methods for reading and writing to a file.
    Property lists are meant for preserving lists of values; writing a single numeric
    value or date to a file doesn''t really make sense. Besides, you should simply
    use NSString instead.


    ```

    NSString *myValue = [NSNumber stringValue];

    [myValue writeToFile:"xyz.plist" atomically:NO error:nil];

    ```


    You can also write to a URL using a property-list object''s writeURL:atomically:method.


    # Reading a Property List


    You can read the property list back into its representative property-list object(s)
    using either a constructor or a custom initializer method. For instance, to reconstitute
    an NSArray from a plist file, you could use either technique.


    ```

    NSArray *myArray = [NSArray arrayWithContentsOfFile:myPathToPlist];

    NSArray *myArray = [[NSArray alloc] initWithContentsOfFile:myPathToPlist];

    ```


    Remember, though, the convenience constructor doesn''t give you ownership of the
    underlying object. You must explicitly retain it if you wish to persist the object
    for any time period. Of course, if you set the value to a property, behind the
    scenes Objective-C handles for you in your property''s setter method.


    The following Try illustrates persisting and reconstituting an NSArray as a property
    list.


