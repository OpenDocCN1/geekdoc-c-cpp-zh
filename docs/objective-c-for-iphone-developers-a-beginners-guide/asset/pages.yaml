  md: '# Chapter 5: Memory Management and Properties


    This method calls retain on the Foo instance passed to the method, increasing
    its retain count by 1. It releases its reference to the old Foo instance, decreasing
    its retain count by 1. It changes its myFoo reference to point to the Foo instance
    referenced by aFoo.


    The copy attribute specifies that a setter should make a bona object copy. It
    is a unique object instance. The behavior is to release the previous object instance,
    create a copy of the new object, and assign the instance variable the new copy.
    You can only use copy with objects that implement the NSCopy protocol. If you
    haven''t learned inheritance or how to copy an object yet, you will revisit the
    copy attribute at the end of Chapter 7.


    # Other Property Attributes


    The nonatomic attribute tells the compiler not to generate locks in a property''s
    getter and setter methods. Discussing threading, multithreaded programs, and mutexes
    (locks) is beyond this chapter''s scope. But think of your computer''s hardware.
    Chances are you a dual-core processor. This means your computer can do more than
    one thing at the same instance in time. As your skills progress, you can write
    programs that do more than one thing at the same time—these "things" are different
    threads in the same program. These multiple threads can access a property using
    its accessor methods at the same exact instance in time. A lock allows only one
    thread to access the variable at a time and forces the others to wait their turn.
    Realize this is a simplification, however, it gives you a general idea of how
    threading works. Until you start writing multithreaded iPhone applications, just
    use nonatomic.


