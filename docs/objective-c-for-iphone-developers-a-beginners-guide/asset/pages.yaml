  md: "# Chapter 3: Flow Control Statements, Arrays, and Structures 59\n\nNow consider\
    \ two statements joined by a logical operator.\n\n```\nint x = 2;\nif (x != 2\
    \ || (x/0)==7) {\n  //never reached error\n}\n```\n\nThe program knows when executing\
    \ the conditional statement that both conditions must be evaluated, as they are\
    \ joined by an || operator. After evaluating the first statement, despite being\
    \ false, the program evaluates the second condition, which divides by zero. And\
    \ so it raises an exception division by zero is undefined.\n\n# The If Else Structure\n\
    \nSometimes a program should do one if one conditional statement is true and another\
