    # Summary\n\nThis chapter touched on several topics normally reserved for more\
    \ advanced discussions. However, as you progress as an iPhone developer, you will\
    \ see the topics presented here repeatedly, so it's best to at least get an introduction\
    \ to them. Using an activity indicator to tell a user to \"please wait\" or using\
    \ a progress view to tell a user to \"please wait and you have this much time\
    \ remaining\" are typically used when a long-running task is to be performed.\
    \ Problem is, that task usually blocks the thread loading the view, and the application\
    \ \"freezes\" until the task completes. Using the two performSelector variants\
    \ in this chapter avoids this application \"freezing\".\n\nThe easiest method\
    \ to use is the performSelector:withObject:afterDelay: method as you don't need\
    \ to worry about memory management. Don't think that this is a substitute for\
    \ multithreading, as it is not. But it does allow avoiding multithreading for\
    \ many trivial tasks.\n\nYou learned about both notifications and delegates to\
    \ inform the class invoking the selector that has finished processing. Although\
    \ both work, in general, you should reserve notifications for general messages\
    \ to multiple observers, and use delegates for pointed \"notifications\" to a\
    \ particular class in a particular point in time. Delegates are the more robust\
    \ way for a particular class invoking perform SelectorInBackground:withObject:or\
    \ performSelector:withObject:afterDelay: to be notified that the selector's method\
    \ has completed."
