    \ the following code snippet.\n\n```\nif (x == 3) {\n  NSLog(\"@x == 3\");\n}\
    \ else {\n  NSLog(\"@x != 3\");\n}\n```\n\nThe code snippet says, \"If x is equal\
    \ to 3, then log 'x is equal to 3' to the debugger console; otherwise, log 'x\
    \ is not equal to 3' to the debugger console.\"\n\n# The If Else If Structure\n\
