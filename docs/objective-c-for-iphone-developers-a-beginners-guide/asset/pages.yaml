  md: '# Categories Explained


    Listing 7-39 illustrates a single category that adds additional functionality
    to the NSMutableString Foundation class.


    | Listing 7-39 NSMutableString+FooBar.h |


    ```

    #import <Foundation/Foundation.h>

    @interface NSMutableString (FooBar)

    - (void) addFooBar;

    @end

    ```


    A category declares an interface of the same name it wishes to add to. For instance,
    in Listing 7-39 the category declares an NSMutableString. It puts the name of
    the category in parentheses following the original class. By convention, developers
    typically name the header file the original class''s name + category''s name.
    Listing 7-39 has a filename of NSMutableString+FooBar.h, for instance.


    The category''s implementation also uses the original class''s name followed by
    the category''s name in parentheses (Listing 7-40).


    | Listing 7-40 NSMutableString+FooBar.m |


    ```

    #import "NSMutableString+FooBar.h"

    @implementation NSMutableString (FooBar)

    - (void) addFooBar {

    [self appendString:@"FooBar"];

    }

    ```


    The category implements the new method, but at the same time "inherits" the original
    class'' method. For instance, in Listing 7-41 you first import the header file
    declaring the category. You then work with the original class by name, but because
    you imported the category, the compiler is smart enough to add the additional
    functionality to the name. The main method treats NSMutableString as an NSMutableString,
    but behind the scenes, it knows that it is a FooBar category and adds the additional
    method.'
