    **Figure 4-2** Activity diagram for purchasing a stock


    Consider the activity diagram in Figure 4-2.

    Suppose you wish to purchase a stock. The first task is to obtain a stock. Obtaining
    a stock is nothing more than using its symbol to look up its name, last price,
    and last date from an external stock trading system. After obtaining the stock,
    you reach a decision point: if you cannot buy at least one share, then you are
    finished. If you can buy one or more shares, you continue to the next step, buying
    shares. You then buy shares. After buying shares, you store the purchase in an
    external data source such as a database, and then you are finished.


    # Ask the Expert


    **Q:** Shouldn''t you explain an activity diagram?


    **A:** An activity diagram analyzes a workflow. The ovals represent activities;
    the arrows between activities represent transitions. Text labeling the transitions
    represents guard conditions. A guard condition is something that must be true
    to progress to the next activity. Figure 4-2 is an activity diagram modeling how
    I envision the process of buying a stock. For more information on activity diagrams,
    refer to to UML Demystified, or refer to Wikipedia''s page on the subject (http://en.wikipedia.org/wiki/Activity_diagram).'
