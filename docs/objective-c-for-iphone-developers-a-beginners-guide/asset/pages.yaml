    When casting the integers as the compiler now says, "Hmm, I need to treat these
    as floats, so let me add a 0.000 to divide, and treat the result as a float."
    As an aside, note that you are not required to cast both points and papers as
    floats; you can cast one and the compiler recognizes it should treat the result
    as a float.


    If this seems seems confusing, do not worry about it. Just remember this rule:
    always explicitly cast when using different data types in the same expression.
    Doing this will prevent errors and make your code easier to read by other developers.
    Besides, casting does not make your code any slower.


