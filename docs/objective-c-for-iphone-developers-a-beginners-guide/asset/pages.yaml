    In this chapter you explore file handling. As most topics in this book, there
    are far many topics to adequately cover in a beginner’s book. However, you do
    explore the file handling aspects most relevant to getting started as an iPhone
    developer. Like the wrapper classes in Chapter 8, the Foundation framework makes
    working with files much easier than you used lower-level C file handling functions.


    You first explore the directories you may write to when writing an iPhone application.
    You then learn basic path manipulation using the FileManager class. After that
    you learn several of NSString’s methods for working with paths and files. You
    also explore NSData and using it to read and write binary data. Again, although
    not a comprehensive treatise on any single file handling subject, the chapter
    is enough to get you started.


    # iPhone Directories


    The iPhone operating system limits applications to only accessing files in its
    own directories. These directories are part of an application’s sandbox. It is
    called a sandbox because the operating system isolates the application and its
    files from the rest of the operating system. Things inside the sandbox cannot
    interact with things outside the sandbox, except through Apple-crafted APIs.


    When installed, an application is placed in its own root directory. Under this
    directory are the Documents, Preferences, Caches, and tmp directories. These are
    the directories available to you as a developer:


    ```

    <Application Root>/Documents

    <Application Root>/Preferences

    ```'
