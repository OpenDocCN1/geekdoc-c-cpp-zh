  md: '# Objective-C for iPhone Developers: A Beginner''s Guide


    The Bar class is a simple class with two instance variables, myAge and myName.
    The myAge variable is an integer, a primitive data type, and so there is no required
    memory management. The setMyAge method uses assignment to assign myAge to the
    parameter theAge. Name, in contrast, is an object. In the setName method you create
    a copy of the theName variable as a parameter.


    ```

    [myName release];

    ```


    ```

    myName = [theName copy];

    ```


    Creating a copy of an object creates a new object instance, and so myName references
    a distinct object. Because you are creating a copy, you do not retain, as copying
    automatically sets the myName retainCount to 1.


    Notice that you release myName before assigning the new value; if you did not,
    a memory leak would occur. Remember, myName points to an actual object; switching
    the address myName points to without releasing the underlying object would fail
    to decrement the object''s retainCount.


    Copying an object, like the myName variable, is not something you do frequently.
    You only make an object copy when you wish to ensure that nobody else has a reference
    to the object. You wish to have a unique object instance. More often, you simply
    create a new reference to an object. Foo''s setMyBar illustrates how you typically
    accomplish this task.


    ```

    [theBar retain];

    [myBar release];

    myBar = theBar;

    ```


    First you retain the passed parameter, theBar. Remember, once you set myBar to
    theBar, it points to the same underlying Bar object; increasing theBar''s retainCount
    is equivalent to increasing myBar''s retainCount. After retaining, you release
    myBar so that if it points to another object instance, the runtime knows to decrement
    the object''s retainCount. The method then sets myBar to refer to theBar, which
    refers to the underlying object instance.


    Notice that both getter methods, getName and getMyBar, return weak references
    to each class''s respective instance variable. If you wished to persist a variable
    obtained via one of these getters, then you would have to explicitly retain them.'
