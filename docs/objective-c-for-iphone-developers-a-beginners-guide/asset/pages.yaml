  md: '# The ViewController’s Life-Cycle Methods


    Throughout this chapter, without any explanation, you used the Utility Application
    template. This template creates a simple two-view application. The info button
    on the application''s first view, when pressed, takes the user to the second screen.


    The front view is the MainView, and its controller is the ViewController. The
    second view is the FlipsideView, and its controller is the FlipsideViewController.
    The ViewController represents a view, while a UIViewController represents a controller.
    Every view has a controller that handles life-cycle events for the view. When
    creating a view, you can either accept a default view controller by not creating
    your own, or you can override the default by creating your own view controller
    for a view. You create your own view using something called inheritance, which
    you will learn in Chapter 6.


    Figure 3-3 illustrates how the Utility Application implements its views and view
    controllers. Note that you can also create a custom view implementation, as Figure
    3-3 shows. For now, the most important thing to understand from Figure 3-3 is
    that the MainView and FlipsideView are both UIViews and that the MainViewController
    and FlipsideViewController are both ViewControllers. You should also understand
    that the View and the ViewController work together when displaying a view in an
    iPhone''s window. The View handles displaying a view. The ViewController handles
    life-cycle methods and other "behind-the-scenes" tasks when displaying a view.


    One "behind-the-scenes" job a ViewController handles is allowing a program to
    execute custom code when its ViewController loads, appears, disappears, and unloads.
