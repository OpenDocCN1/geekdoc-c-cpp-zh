  md: "# Compound If Statements\n\nSometimes multiple conditions must be met for a\
    \ program to execute a code block. You use the logical operators discussed in\
    \ Chapter 2 (&&, ||) when writing compound if statements. Consider the following\
    \ two statements:\n\n```\nint x = 0;\nint * p = &x;\nif (x < 9 && sizeof(p) ==\
    \ sizeof(x)) {\n    NSLog(\"compound if...and\");\n}\nif (x < 9 || sizeof(p) ==\
    \ sizeof(x)) {\n    NSLog(\"compound if...or\");\n}\n```\n\nThe first statement\
    \ says, \"If x is less than 9 and the size of p is equal to the size of x, then\
    \ execute the following statement block.\" The second statement, \"If x is less\
    \ than 9 or the size of p is equal to the size of x, then execute the following\
    \ statement block.\" You can combine the logical && and || operators to form complex\
    \ conditional statements if you wish.\n\n# Short-Circuit Evaluation\n\nObjective-C,\
    \ like C, short-circuits conditional statements. Short-circuiting relies upon\
    \ a technique called lazy evaluation. Lazy evaluation doesn't perform unnecessary\
    \ computations. So, if evaluating a compound conditional statement, and the first\
    \ part of the statement evaluates to false, then—depending on whether the compound\
    \ is an and or an or—a program can skip the rest of the statement. For instance,\
    \ the following statement uses a logical && operator.\n\n```\nint x = 2;\nif (x\
    \ != 2 && (x/0)==7) {\n    //never reached, no error\n}\n```\n\nThe program knows\
    \ when executing two conditions joined by an && must be true. However, x is equal\
    \ to 2 and the first condition is false. So the program knows the conditional\
    \ statement will evaluate to false and it skips the immediately following statement\
    \ block.\n\nNotice that the preceding code shows an unintended side effect of\
    \ short-circuiting. Division by zero is a runtime error, but because the statement\
    \ is never evaluated, the program never raises the error."
