  md: '# Chapter 7: Protocols and Categories 175


    NOTE

    If you come from a Java background, you are accustomed to classes implementing
    interfaces. In Objective-C terminology classes do not implement protocols, but
    rather they adopt them. But in reality adopt and implement have the same meaning.


    # Modeling Protocols


    The UML class diagram has a convenient notation for modeling protocols (Figure
    7-1).

    In Figure 7-1 the Bird, Jet, and Bumblebee all adopt the Flyer protocol so you
    draw a dashed arrow with a white point from the adopter to the adopted. The Flyer,
    being a protocol, is added the «protocol» stereotype. Don''t worry about a stereotype''s
    definition; all that it means here is that you are using a symbol normally used
    for a class to represent a protocol.


    # Syntax


    A protocol''s syntax is similar to a class'' interface. But unlike writing a class,
    you only create a header file and do not create an implementation. A protocol
    begins with the @protocol compiler directive and ends with the @end compiler directive.
    Between the two compiler directives go any method declarations you wish an class
    to implement.


    +   @protocol Hopper

    - (void) hop;

    - (BOOL) setHopDistance:(long long) distance

    @end


