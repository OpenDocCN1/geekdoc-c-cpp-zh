  md: '#  Writability


    Not all properties need a setter. Moreover, some properties, such as primitive
    data types, should use simple assignment, while other properties, such as objects,
    should either be retained or have a new copy created. The readwrite and readonly
    properties tell the compiler whether it should generate a setter or not. If not
    provided, the default behavior is to generate a setter. If readonly, the compiler
    generates only a getter for the property, making the property read-only. The following
    code snippet illustrates two read/write property declarations and one read-only
    property declaration:


    ```

    @property Foo * myFoo; //the default - read/write

    @property (readonly, retain) Foo * myFoo;

    @property (readonly) Foo * myFoo;

    ```


    #  Setter Attributes


    The assign, retain, and copy attributes direct how the compiler generates setter
    methods for a property. The assign attribute is for simple assignment and should
    only be used with primitives. Note that assign is a property''s default behavior;
    therefore, you should almost always specify a setter attribute. For instance,
    you might have an int property that you specify simple assignment.


    ```

    @property (assign) int myFooCount;

    ```


    While assign is useful for primitives, the retain property is the attribute you
    specify more often. The retain property tells the compiler that the setter should
    release the old reference and retain the new reference. Remember, every object
    derived from NSObject has an associated retain count that the runtime uses to
    decide if an object should be released or not. When setting a property, the old
    reference must be released; otherwise, a memory leak occurs. Consider the following
    property declaration (ignore the nonatomic property for now):


    ```

    @property (nonatomic, retain) Foo * myFoo;

    ```


    When compiling, the compiler generates the following setter method:


    ```

    -(void) setFoo : (Foo *) aFoo {

    [aFoo retain];

    [myFoo release];

    Foo = aFoo;

    }

    ```'
