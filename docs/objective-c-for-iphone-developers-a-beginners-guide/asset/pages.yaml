    # Arrays


    Sometimes you wish to use a series of values rather than a single value. Arrays
    help you work with multiple values easily. For instance, you might have a time
    series representing your expenses over the past ten days.


    ```

    (void) expenses() {

    float expenses[10];

    for(int i = 0; i < 10; i++) {

    expenses[i] = 100.0 + i;

    }

    ```


    The function''s first half allocates space for ten float values. The for loop
    then assigns the value i to each of the values, the results being the series:
    100.0, 101.0, 102.0, ..., 109. Note that i has the value 0 in the first loop,
    and so the value added to the expenses array is n-1.


    After assigning values to individual array elements, you can refer to those elements
    directly. For instance, the following code accesses the seventh array element
    and assigns it to a variable, for which, from expenses'' preceding initialization,
    you know the value is 106.


    ```

    float x = expenses[7];

    ```


