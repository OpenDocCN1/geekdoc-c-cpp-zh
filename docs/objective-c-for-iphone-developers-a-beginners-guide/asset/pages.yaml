  md: '# Key Skills & Concepts


    +   - Understanding the Model-View-Controller Design Pattern

    - Using Property Lists

    - Sharing Data Between Views


    Anybody can write a simple program. However, crafting a well-designed program
    that works well is a much more difficult endeavor. In this chapter you learn about
    the Model-View-Controller design pattern and how to apply it to your iPhone development
    efforts using Objective-C. The Model-View-Controller design pattern is arguably
    one of the biggest advances in computer science, so you would do well by learning
    it.


    # The Model-View-Controller Design Pattern


    The MVC design pattern separates a program''s objects based upon responsibility.
    The model is responsible for your program''s logical objects. These classes hold
    an application''s data and its business logic. Recall the silly classes used in
    previous chapters: Duck, Driftwood and Glutton are all examples of model classes.
    They are logical objects with data and behavior. Their behavior is unrelated to
    how your application''s user interfaces operate. Instead, logic was related to
    their business functions; hence the term business logic. Nowhere do these objects
    define an application''s appearance. These are logical objects that reside behind
    the scenes.


    Now consider the UIView and ViewController classes that you extended in previous
    Try Projects. The UIView is your view, and the view controller is your application''s
    controller. The view''s responsibility is to control the application''s appearance.
    The view controller''s responsibility is to handle the view''s life cycle methods
    and serve as a “middleman” between the view and the model. Figure 12-1 illustrates
    a typical MVC architecture.


    The MVC displays your application''s interface to its users. When a user interacts
    with the view, these events are forwarded to controller. The controller then updates
    the state of any related model objects and updates the view. Figure 12-2 illustrates
    the MVC and iPhone application.


    A UIView displays the iPhone application''s user interface. A UIView has an associated
    ViewController that responds to a user''s interactions with its view. For instance,
    suppose you have a simple game where a penguin waddles across a screen.'
