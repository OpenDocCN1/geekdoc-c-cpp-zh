  md: '# Assignment Operators


    An assignment operator assigns the value on the right of the assignment operator
    to the variable on the right. For instance, the following three statements are
    all assignments:


    ```

    int x = 19; int z = 4; int p = 20;

    ```


    The first statement assigns x the value 19, the second assigns z the value 4,
    and the third assigns p the value 20.


    You can also combine the assignment operator with additive operators to create
    compound assignment operators. For instance, consider the following statements
    and their equivalent using one of the compound assignment operators (Listing 2-8)


    # Listing 2-8 Assignment operators example


    ```

    int x = 20; int z = 4; int p = 20;

    x = x + 2; //x = 22

    x += 2; //z = 24

    z = z - 2; //z = 0

    p = p * 2; //p = 40

    p *= 2; //p = 80

    p = p/2; //p = 40

    p /= 2; //p = 20

    ```


    Table 2-4 illustrates the assignment operators. Note that in reality, you are
    combining the arithmetic operator with the assignment operator, but out of convenience,
    for short


    | Assignment Operator | Example Statement | Statement''s Effect | Equivalent Statement
    |

    | --- | --- | --- | --- |

    | = | int int = 2; | Assignment | |

    | += | int += 3; | Add 3 to value | myvar = myvar + 3; |

    | -= | myvar -= 3; | Subtract 3 from value | myvar = myvar - 3; |

    | /= | myvar /= 2; | Divide value by 2 | myvar = myvar/2; |

    | *= | myvar *= 2; | Multiply value by 2 | myvar = myvar * 2; |

    | %= | myvar %= 2; | Obtain remainder by 2 | myvar = myvar % 2; |


    # Table 2-4 Assignment Operators'
