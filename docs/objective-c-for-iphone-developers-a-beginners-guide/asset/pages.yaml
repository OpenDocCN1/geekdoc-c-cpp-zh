    NOTE

    In this chapter I focus on using protocols to model behavior. You can also use
    protocols to model what you can do to an object. For instance, you can hunt, roast,
    and eat a duck, so you could have a Duck class adopt the Huntable, Roastable,
    and Eatable protocols.


    # Adopting a Protocol

    Classes adopt protocols. For instance, a Frog class might implement the Hopper
    protocol. For Frog to adopt Hopper, it must first import the Hopper.h header file.
    It then includes Hopper in its @interface compiler directive.


    ```

    @interface Frog: Amphibian <Hopper>

    ```


    A Frog is an amphibian, and so it inherits from its Amphibian parent class. Following
    the parent class is the protocol frog adopts. The protocol''s name is surrounded
    by angle brackets. The following Try This illustrates adopting a protocol.


