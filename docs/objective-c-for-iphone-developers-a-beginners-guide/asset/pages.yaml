    # NSTemporaryDirectory


    Obtaining your application''s temporary directory is straightforward. You use
    the NSTemporaryDirectory method.


    ```

    NSString * myTempDirectory = NSTemporaryDirectory(void);

    ```


    This method returns the path to your application''s temporary directory. You use
    this directory to store temporary data that does not require persisting between
    application invocations. This directory is not backed up by iTunes when synchronizing
    a device.


    # CFBundle


    When you develop your app, you add resources to the Resources group in your iPhone
    project (Figure 9-1). These files are part of your application''s bundle. iPhone
    applications are bundled in a directory with a <filename>.app bundle. Although
    it appears and acts like a standard executable, it is actually a directory storing
    the application and resources.


    ![](img/b18903248e3f72f9f244af0aa5762631_259_0.png)


    **Figure 9-1** You store resources in your project''s Resources group.'
