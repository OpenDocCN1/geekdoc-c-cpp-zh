  md: "# The Break and Continue Statements\n\nYou can use the break keyword in other\
    \ places than switch statements. When looping, you can exit a loop early using\
    \ the break statement. You can also force a loop to skip the remaining statements\
    \ in its body and continue to the next loop using the continue statement.\n\n\
    # The Break Statement\n\nTo exit a loop immediately, use the break statement.\
    \ The following code snippet illustrates:\n\n```\nfor (int x = 0; x != 1000; x++)\
    \ {\n  if (x == 5) { break; }\n  NSLog(\"%@x\");\n```\n\nWhen executed as part\
    \ of a program, the for loop in the preceding code would loop 1000 times, from\
    \ x = 0 to x = 999. Here, however, when the x variable's value reaches 5, the\
    \ logical statement evaluates to false. When false, the program enters the code\
    \ block preceding the if statement and executes the break statement. The break\
    \ statement forces the program to exit the for loop immediately. And so the program\
    \ only logs 0 through 4 to the debugger console. On the fifth iteration, the program\
    \ exits the for loop.\n\n# The Continue Statement\n\nTo exit a loop's body and\
    \ return to a loop's logical test immediately, the following code snippet illustrates:\n\
    \n```\nfor (int x = 0; x < 10; x++) {\n  if (x==3) { continue; }\n  NSLog(\"%@x\"\
    , x);\n}\n```\n\nWhen run as part of a program, the program loops 10 times. Each\
    \ loop, except when x reaches 3, logs the x variable's value to the debugger console.\
    \ When x evaluates to 3, the logical statement evaluates to true and executes\
    \ the continue statement, which forces the program to skip the remaining statements\
    \ in the loop's body and return to the loop's logical test."
