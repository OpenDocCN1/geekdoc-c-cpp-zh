  md: '# Numeric Types: Integers


    An integer is any whole number. The integer data type is represented by the int
    keyword. For instance, consider the following statement.


    ```

    int x = 4;

    ```


    The int keyword identifies the primitive''s type, an integer, and 4 is the literal.
    The equal sign assigns x the literal 4. You can also write the statement in two
    steps if you prefer.


    ```

    int x = 0;

    x = 4;

    ```


    Integers can be further defined using the short, long, and unsigned qualifiers
    to form a short integer, a long integer, and an unsigned integer. Table 2-1 summarizes
    Objective-C''s integer data types.


    | Type | Range | Bytes | Formats (printing in NSLog) |

    | --- | --- | --- | --- |

    | short int | -32,768 to 32,768 | 2 | %hi |

    | unsigned short int | 0 to 65,535 | 2 | %hu |

    | unsigned int | 0 to 4,294,967,295 | 4 | %u |

    | int | -2,147,483,647 to 2,147,483,647 | 4 | %i |

    | long int | -2,147,483,647 to 2,147,483,647 | 4 | %li |

    | unsigned long int | 0 to 4,294,967,295 | 4 | %lu |

    | long long int | -9223372036854775807 to 9223372036854775808 | 8 | %lld |

    | unsigned long long int | 0 to 18446744073095551615 | 8 | %llu |


    **Table 2-1** Integer Data Types'
