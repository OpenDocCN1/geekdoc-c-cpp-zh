  md: '# About the Book


    Part Two (full version only), describes a set of new types and utilities that
    were added to the Standard Library. The helper types create a potential new vocabulary
    for C++ code: like when you use optional, any variant or string_view. And what''s
    more, you have powerful capabilities, especially in the form of parallel algorithms
    and the standard filesystem. A lot of examples in this part will use many other
    features from C++17.


    Part Three (full version only) brings together all the changes in the language
    and shows examples where a lot of new features are used alongside. You''ll see
    discussions about refactoring, simplifying code with new template techniques or
    working with parallel STL and the filesystem. While the first and second part
    can also be used as a reference for individual changes, the third part shows more
    of larger C++17 patterns that join many features.


    A considerable advantage of the book is the fact that with each new feature you''ll
    get information about the compiler support and the current implementation status.
    That you''ll be able to check if a particular version of the most popular compilers
    (MSVC, GCC or Clang) implements it or not. The book also gives practical hints
    on how to apply techniques in your current codebase.


