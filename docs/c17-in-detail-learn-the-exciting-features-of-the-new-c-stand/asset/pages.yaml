  md: "# Structured Binding Declarations\n\nDo you often work with tuples or pairs?\n\
    If not, then you should probably start looking into those handy types. Tuples\
    \ enable you to bundle data ad-hoc with excellent library support instead of creating\
    \ small custom types. The language features like structured binding make the code\
    \ even more expressive and concise.\nConsider a function that returns two results\
    \ in a pair:\n\n```\nstd::pair<int, bool> InsertElement(int el) { ... }\n```\n\
    \nYou can write:\n\n```\nauto ret = InsertElement(...);\n```\n\nAnd then refer\
    \ to ret.first or ret.second. However, referring to values as .first or .second\
    \ is also not expressive - you can easily confuse the names, and it's hard to\
    \ read. Alternatively you can leverage std::tie which will unpack the tuple/pair\
    \ into local variables:\n\n```\nint index { 0 };\nbool flag { false };\nstd::tie(index,\
    \ flag) = InsertElement(10);\n```\n\nSuch code might be useful when you work with\
    \ std::set::insert which returns std::pair:\n\n```\nstd::set<int> mySet;\nstd::set<int>::iterator\
    \ iter;\nbool inserted { false };\n```\n\n```\nstd::tie(iter, inserted) = mySet.insert(10);\n\
    ```\n\n```\nif (inserted)\n    std::cout << \"Value was inserted\\n\";\n```\n\n\
    As you see, such a simple pattern - returning several values from a function -\
    \ requires several lines of code. Fortunately, C++17 makes it much simpler!"
