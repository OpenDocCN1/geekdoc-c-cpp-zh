  md: '# Deduction Guides


    The compiler uses special rules called “Deduction Guides” to work out parameter
    types.

    There are two types of guides: compiler-generated (implicitly generated) and user-defined.

    To understand how the compiler uses guides, let''s look at a simplified deduction
    guide¹

    std::array;


    ```

    template<typename T, typename... U>

    array(T, U...) ->

    array<enable_if_t<is_same_v<T, U...>,>, 1 + sizeof...(U)>;

    ```


    The syntax looks like a template function with a trailing return type. The compiler
    treats “imaginary” function as a candidate for the parameters. If the pattern
    matches, the found types are returned from the deduction.

    In our case when you write:


    ```

    std::array arr{1, 2, 3, 4};

    ```


    Then, assuming T and U... are arguments of the same type, we can build up an array
    object of the type std::array<int, 4>.

    In most cases, you can rely on the compiler to generate automatic deduction guides.
    They will be created for each constructor (also copy/move) of the primary class
    template. Please note that classes which are specialised or partially specialised
    won''t work here.

    As mentioned, you might also write custom deduction guides. A classic example
    is a deduction of std::string rather than const char*:


    ```

    template<typename T> struct MyType {

    T str;

    };

    ```


    ```

    // custom deduction guide

    MyType(const char *) -> MyType<std::string>;

    MyType t{"Hello World"}; // deduces std::string

    ```


    Without the custom deduction T would be deduced as const char*.'
