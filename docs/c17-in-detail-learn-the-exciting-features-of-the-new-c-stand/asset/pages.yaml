  md: "# Nested Namespaces\n\nNamespaces allow grouping types and functions into separate\
    \ logical units.\n\nFor example, it's common to see that each type or function\
    \ from a library XY will be stored\nin a namespace xy. Like in the below case,\
    \ where there is SuperCompressionLib and it\nexposes calling Compress() and Decompress():\n\
    \n```\nnamespace SuperCompressionLib {\n    bool Compress();\n    bool Decompress();\n\
    }\n```\n\nThings get interesting if you have two or more nested namespaces.\n\n\
    ```\nnamespace MySuperCompany {\n    namespace SecretProject {\n        namespace\
    \ SafetySystem {\n            class SuperArmor {\n                // ...\n   \
    \         }\n            class SuperShield {\n                // ...\n       \
    \     }\n        } // SafetySystem\n    } // SecretProject\n} // MySuperCompany\n\
    ```\n\nWith C++17 nested namespaces can be written more compactly:\n\n```\nnamespace\
    \ MySuperCompany::SecretProject::SafetySystem {\n    class SuperArmor {\n    \
    \    // ...\n    }\n    class SuperShield {\n        // ...\n    }\n}\n```\n\n\
