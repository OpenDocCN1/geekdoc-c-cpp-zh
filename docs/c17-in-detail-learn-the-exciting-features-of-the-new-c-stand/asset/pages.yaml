  md: "# Language Clarification\n\nThe alignment for Vecd3 is larger than __STCPP_DEFAULT_NEW_ALIGNMENT__,\
    \ thus the compiler will select the overloads with the align_val_t parameter.\n\
    \n> In Clang and GCC you can control the alignment by the new-alignment switch\
    \ (see Clang's documentation¹⁰). The MSVC compiler exposes the /Z:alignedNew¹\
    \ flag that turns the feature on or off.\n\nWe can also provide custom implementation,\
    \ we have a look:\n\nChapter Clarification/aligned_new.cpp\n\n```\nvoid* operator\
    \ new(size_t size, std::align_val_t align) {\n#if defined(__WIN32) || defined(__CYWIN__)\n\
    \    auto ptr = _aligned_malloc(size, static_cast<std::size_t>(align));\n#else\n\
    \    auto ptr = std::aligned_alloc(static_cast<std::size_t>(align), size);\n\n\
    \    if (ptr) throw std::bad_alloc();\n\nstd::cout << \"new: \" << size << \"\
    , \"\n              << static_cast<std::size_t>(align) << \", \" << ptr << '\\\
    \\n';\n}\n\nvoid operator delete(void* ptr, std::size_t size, std::align_val_t\
    \ align) noexcept {\n    std::cout << \"delete: \" << size << \", \" << align\
    \ << \", \"\n              << static_cast<std::size_t>(align) << \", \" << ptr\
    \ << '\\\\n';\n    _aligned_free(ptr);\n#else\n    std::free(ptr);\n#endif\n\n\
    void operator delete(void* ptr, std::align_val_t align) noexcept { ... } // hidden\n\
    ```\n\nThe code uses _aligned_malloc() and _aligned_free() for the Windows version¹².\
    \ It's because the Windows platform use different allocation mechanisms for over-aligned\n\
    \n> ¹⁰https://clang.llvm.org/docs/ClangCommandLineReference.html#cmallocoption-f-alignment\n\
    ¹https://docs.microsoft.com/en-us/cpp/build/reference/zc-alignednew?view=vs-2019\n\
    ¹²this applies to MSVC, MinGW, Clang on Windows or Cygwin."
