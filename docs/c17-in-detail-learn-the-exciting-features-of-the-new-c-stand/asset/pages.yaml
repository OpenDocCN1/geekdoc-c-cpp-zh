  md: "# Capturing [*this] in Lambda Expressions\n\nWhen you write a lambda inside\
    \ a class method, you can reference a member variable by capturing this. For example:\n\
    \nChapter General Language Features/capture_this.cpp\n\n```\nstruct Test {\n \
    \   void foo() {\n        std::cout << m_str << '\\\\n';\n        auto addWordLambda\
    \ = [this]() { m_str += \"World\"; };\n        addWordLambda();\n        std::cout\
    \ << m_str << '\\\\n';\n    }\n\n    std::string m_str {\"Hello \"};\n};\n```\n\
    \nIn the line with auto addWordLambda = [this](){ } we capture this pointer and\
    \ later we can access m_str.\n\nPlease notice that we captured this by value...\
    \ to a pointer. You have access to the member variable, not its copy. The same\
    \ effect happens when you capture by [] or [&]. That's why when you call foo()\
    \ on some Test object then you'll see the following output:\n\nHello\nHello World\n\
    \nfoo() prints m_str two times. The first time we see \"Hello\", but the next\
    \ time it's \"Hello World\" because the lambda addWordLambda changed it.\n\nHow\
    \ about more complicated cases? Do you know what will happen with the following\
    \ code?"
