  md: '# # Why Do We Need Attributes?


    Have you ever used __declspec, __attribute__ or #pragma directives in your code?

    For example:


    ```

    // set an alignment

    struct S { short f[3]; } __attribute__ ((aligned (8)));


    // this function won''t return

    void fatal () __attribute__ ((noreturn));

    ```


    Or for DLL import/export in MSVC:


    ```

    # COMPILING_DLL

    #define DLLEXPORT __declspec(dllexport)

    else

    #define DLLEXPORT __declspec(dllimport)

    #endif

    ```


    Those are existing forms of compiler-specific attributes/annotations.

    So what is an attribute?


    An attribute is additional information that can be used by the compiler to produce
    code. It might be utilised for optimisation or some code generation (like DLL
    stuff, OpenMP, etc.). Also, annotations allow you to write more expressive syntax
    and help other developers to reason about code.


    Contrary to other languages like C#, in C++, the compiler has fixed the meta-information
    system. You cannot add user-defined attributes. In C# you can derive from System.
    Attribute.


    What''s best about Modern C++ attributes?


    Since C++11, we get more and more standardised attributes that will work with
    other compilers. We''re moving away from compiler-specific annotation to standard
    forms. Rather than learning various annotation syntaxes you''ll be able to write
    code that is common and has the same behaviour.


    In the next section, you''ll see how attributes are used to work before C++11.'
  merge: -1
