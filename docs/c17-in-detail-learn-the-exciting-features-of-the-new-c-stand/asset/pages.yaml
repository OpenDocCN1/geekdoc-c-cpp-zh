  md: "# constexpr Lambda Expressions\n\nLambda expressions were introduced in C++11,\
    \ and since that moment they've become an essential part of modern C++. Another\
    \ significant feature of C++11 is the constexpr specifier, which is used to express\
    \ that a function or value can be computed at compiletime. In C++17, the two elements\
    \ are allowed to exist together, so your lambda can be invoked in a constant expression\
    \ context.\n\nIn C++14 the following code doesn't compile, but works with C++17:\n\
    \n```\nChapter General Language Features/lambda_square.cpp\nint main () {\n  \
    \  constexpr auto SquareLambda = [] (int n) { return n*n; };\nstatic_assert(SquareLambda(3)\
    \ == 9, \"\");\n}\n```\n\nSince C++17 lambda expressions (their call operator\
    \ operator ()) that follow the rules of standard constexpr functions are implicitly\
    \ declared as constexpr.\n\nWhat are the limitations of constexpr functions? Here's\
    \ a summary (from 10.1.5 constexpr specifier [dcl.constexpr]¹¹⁰):\n\n+   * they\
    \ cannot be virtual\n* their return type should be a literal type\n* their parameter\
    \ types should be a literal type\n* their functions cannot contain: asm definition,\
    \ a goto statement, try-block, or a variable that is a non-literal type or static\
    \ or thread storage duration\n\nIn practice, in C++17, if you want your function\
    \ or lambda to be executed at compile, the body of this function shouldn't invoke\
    \ any code that is not constexpr. For example, you cannot allocate memory dynamically\
    \ or throw exceptions.\n\nconstexpr lambdas are also covered in the Other Changes\
    \ Chapter and in a free ebook: C++ Lambda Story¹¹¹.\n\n# Extra Info\n\nThe change\
    \ was proposed in: P0170¹⁰.\n\n¹⁰https://timsong-cpp.github.io/cpppp/n4659/dcl.constexpr#3\n\
    ¹¹https://leanpub.com/cppplamba\n¹¹https://wg21.link/p0170"
