  md: "# Pack Expansions in Using Declarations\n\nThe feature is an enhancement for\
    \ variadic templates and parameter packs.\nThe compiler will now support the using\
    \ keyword in pack expansions:\n\n```\ntemplate<class... Ts> struct overloaded\
    \ : Ts... {\n    using Ts::operator()...;\n};\n\n```\n\nThe overloaded class exposes\
    \ all overloads for operator () from the base classes. Before C++17, you would\
    \ have to use recursion for parameter packs to achieve the same result. The overloaded\
    \ pattern is a very useful enhancement for std::visit, read more in the “Overload”\
    \ section in the Variant chapter.\n\nHere's an example in P0195.\n\n# Logical\
    \ Operation Metaunctions\n\nC++17 adds handy template metafunctions:\n\n+   -\
    \ template<class...> B> struct conjunction; - logical AND\n- template<class...>\
    \ B> struct disjunction; - logical OR\n- template<class B> struct negation; -\
    \ logical negation\n\nHere's an example, based on the code from proposal:\n\n\
    ```\ntemplate<typename... Ts>\nstd::enable_if_t<std::conjunction_v<std::is_same<int,\
    \ Ts...>> >\nPrintIntegers(Ts... args) {\n    (std::cout << << args) << '\\n';\n\
    }\n\n```\n\nThe above function PrintIntegers works with a variable number of arguments,\
    \ but they all have to be of type int.\nThe helper metafunction increase the readability\
    \ of advanced template code. They are available in <type_traits> header.\n\nMore\
    \ information in P00138.\n\n> ^17https://wg21.link/P0195\n^18https://wg21.link/P00138"
