  md: '# 2. Removed or Fixed Language Features


    The C++17 Standard contains over 1600 pages, growing over 200 pages compared to
    C++14! Fortunately, the language specification was cleaned up in a few places,
    and some old or potentially harmful features could be cleared out. This short
    lists several severe language elements that were removed or fixed. See the Removed
    And Deprecated Library Features Chapter for a list of changes in the Standard
    Library.


    In this chapter, you''ll learn:


    +   - What was removed from the language like the register keyword or operator++
    for bool

    - What was fixed, notably the auto type deduction with brace initialisation.

    - Other improvements like for static_assert and range-based for loops.'
