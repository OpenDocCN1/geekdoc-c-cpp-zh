  md: "# Init Statement for if and switch\n\nC++17 provides new versions of the if\
    \ and switch statements:\n\n```\nif (init; condition)\n```\n\nAnd\n\n```\nswitch\
    \ (init; condition)\n```\n\nIn the init section you can specify a new variable,\
    \ similarly to the init section in for loop. Then check the variable in the condition\
    \ section. The variable is visible only in if/else scope.\n\nTo achieve a similar\
    \ result, before C++17, you had to write:\n\n```\n{\nauto val = GetValue();\n\
    if (condition(val))\n    // on success\nelse\n    // on false...\n}\n```\n\nPlease\
    \ note that val has a separate scope, without that ‘leaks’ to enclosing scope.\n\
    Now, in C++17, you can write:\n\n```\nif (auto val = GetValue(); condition(val))\n\
    \    // on success\nelse\n    // on false...\n```\n\nNow, val is visible only\
    \ inside the if and else statements, so it doesn’t ‘leak.’ condition might be\
    \ any boolean condition.\n\nWhy is this useful?\n\nLet’s say you want to search\
    \ for a few things in a string:"
