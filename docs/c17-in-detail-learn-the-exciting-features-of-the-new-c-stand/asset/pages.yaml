  md: '# About the Book


    C++11 was a major update for the language. With all the modern features like lambdas,
    constexpr, variadic templates, threading, range-based for loops, smart pointers
    and many powerful elements, it signalled enormous progress for the language. Even
    now, in 2019, many teams struggle to modernise their projects to leverage the
    modern features. Later there was a minor update - C++14, which improved some things
    from the previous Standard and added a few smaller elements.


    Although C++17 is not as big as C++11, it''s larger than C++14 and brings many
    exciting additions and improvements. This book will guide through all of them!


    The book brings exclusive content about C++17 and draws from the experience of
    many articles that have appeared at bfilepek.com. The material was rewritten from
    the ground-up and updated with the latest information. All of that equipped with
    lots of new examples and practical tips. Additionally, the book provides insight
    into the current implementation status, compiler support, performance issues and
    other relevant knowledge to boost your current projects.


    # Who This Book is For


    The book is intended for all C++ developers who have at least essential experience
    with C++11/14.


    The principal aim of the book is to equip you with practical knowledge about C++17.
    After reading the book, you''ll be able to move past C++11 and leverage the latest
    C++ techniques in your day to day tasks.


    Please don''t worry if you''re not an expert in C++11/14. This book provides the
    necessary background, so you''ll get the information in a proper context.'
