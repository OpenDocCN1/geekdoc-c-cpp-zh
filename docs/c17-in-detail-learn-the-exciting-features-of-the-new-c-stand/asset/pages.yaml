  md: '# # Part 1 - Language Features


    We can say that C++ comes in two parts: The Language and The Standard Library.
    The first element, The Language, focuses on the expressive code and conscience
    syntax. The second element gives you tools, utilities and algorithms. For example,
    in C++11, we get lambdas that simplified writing short function objects. C++14
    allowed ''auto'' type deduction for function return types which also shorten code
    and simplified code.


    C++17, as a major update to the Standard, brings many amazing language elements
    that generally, make the language clearer and more straightforward. For instance,
    you can reduce the need to use enable_if and tag dispatching techniques by leveraging
    constexpr You can treat tuples like first class language citizens thanks to structured
    bindings, rely on and understand expression evaluation order, write code that
    naturally uses copy-elision mechanism, and much, much more!


    In this part you''ll learn:


    +   * What was removed from the language and what is deprecated

    * How the language is more precise: for example, thanks to expression evaluation
    order guarantees

    * What are new features of templates: like if or fold expressions

    * What are the new standard attributes

    * How you can write cleaner and more expressive code thanks to structured binding,
    inline variables, compile-time if or template argument deduction for classes'
