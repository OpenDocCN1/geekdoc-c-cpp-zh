  md: "# Exception Specifications in the Type System\n\nException Specification for\
    \ a function didn't use to belong to the type of the function, but now it will\
    \ be part of it. You can now have two function overloads: one with noexcept and\
    \ the second without it. See below:\n\nChapter Clarification/func_noexcept_void_type.cpp\n\
    \n```\nusing TnoexceptVoidFunc = void (()) noexcept;\nvoid SimpleNoexceptCall(TnoexceptVoidFunc\
    \ f) { f(); }\n\nvoid TVoidFunc = void (());\nvoid SimpleCall(TVoidFunc f) { f();\
    \ }\n\nvoid fnoexcept() noexcept { }\nvoid fRegular() { }\n\nint main() {\n  SimpleNoexceptCall(fnoexcept);\n\
    \  //SimpleNoexceptCall(fRegular); // cannot convert\n\n  SimpleCall(fnoexcept);\
    \ // converts to regular function\n  SimpleCall(fRegular);\n}\n```\n\nA pointer\
    \ to noexcept function can be converted to a pointer to a regular function (this\
    \ also works for a pointer to a member function). But it's not possible the other\
    \ way around (from a regular function pointer into a function pointer that is\
    \ marked with noexcept).\n\nOne of the reasons for adding the feature is chance\
    \ to optimise the code better. If the compiler has a guarantee that a function\
    \ won't throw, then it can generate faster code.\n\nAlso, as described in the\
    \ previous chapter about Language Fixes, in C++17, the Exception Specification\
    \ is cleaned up. Effectively, you can only use the noexcept specifier¹⁵ for declaring\
    \ a function that won't throw.\n\n# Extra Info\n\nThe change was proposed in:\
    \ P0012R1¹⁵.\n\n¹⁵http://en.cppreference.com/w/cpp/language/noexcept_spec\n¹⁶http://wg21.link/p0012r1"
