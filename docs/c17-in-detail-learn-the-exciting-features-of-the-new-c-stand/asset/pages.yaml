  md: '# # Preface


    After the long-awaited C++11, the C++ Committee has made changes to the standardisation
    process, and we can now expect a new language standard every three years. In 2014
    the ISO Committee delivered C++14. Now it''s time for C++17, which was published
    at the end of 2017. As I am writing these words, in the middle of 2019, the C++20
    draft is feature ready and prepared for the final review process.


    As you can see, the language and the Standard Library evolves quite fast! Since
    2011 you''ve got a set of new library modules and language features every three
    years. Thus, staying up to date with the whole state of the language has become
    quite a challenging task, and that is why this book will help you.


    This book describes all the significant changes in C++17 and will give you the
    essential knowledge to stay current with the latest features. What''s more, each
    section contains lots of practical examples and also compiler-specific notes to
    provide you with a more comfortable start.


    It''s a pleasure for me to write about new and exciting things in the language
    and I hope you''ll have fun discovering C++17 as well!


    Best regards,

    Bartek'
