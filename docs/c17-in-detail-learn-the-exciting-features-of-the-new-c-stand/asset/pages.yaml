  md: 'Another example of custom deduction guide comes from the overload pattern:


    ```

    template<class... Ts>

    struct overload : Ts... { using Ts::operator()... };

    ```


    ```

    template<class... Ts>

    load(Ts...) -> overload<Ts...>; // deduction guide

    ```


    The overlad class inherits from other classes Ts... and then exposes their operator().

    The custom deduction guide is used here “transform” a list of callable types into
    the list of classes that we can derive from.


    # CTAD Limitations


    In C++17 template argument deduction for classes has the following limitations:


    +   - it doesn''t work with template aggregate types

    - the deduction doesn''t include inheriting constructors

    - it doesn''t work with template aliases


    Those limitations will be removed in C++20 through the already accepted proposal:
    P1021.


    # Extra Info


    The CTAD feature was proposed in: P0091R3 and P0433 - Deduction Guides in the
    Standard Library.


    Please note that while a compiler might declare full support for Template Argument
    Deduction for Class Templates, its corresponding STL implementation might still
    lack of custom deduction guides for some STL types. See the Compiler Support section
    at the end of the chapter.


