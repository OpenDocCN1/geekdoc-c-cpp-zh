    \ options, you have to alter the printing technique and use fold over comma:\n\
    \n```\ntemplate<typename ...Args>\nvoid FoldSeparateLine(Args&&... args) {\n \
    \ auto separateLine = [](const auto& v) {\n    std::cout << v << '\\n';\n  };\n\
    \  (..., separateLine(std::forward<Args>(args))); // over comma operator\n}\n\
    ```\n\nThe technique with fold over the comma operator is handy. Another example\
    \ of it might be a special version of push_back:\n\n```\ntemplate<typename ...Args>\n\
