  md: '# Stricter Expression Evaluation Order


    Until C++17 the language hasn’t specified any evaluation order for function parameters.

    Period.


    For example, that’s why in C++14 make_unique is not just syntactic sugar, but
    it guarantees memory safety:


    Consider the following examples:


    ```

    foo(unique_ptr<T>(new T), otherFunction()); // first case

    ```


    And with explicit new:


    ```

    make_unique<T>(), otherFunction()); // second case

    ```


    Considering the first case, in C++14, we only know that T is guaranteed to happen
    before the unique_ptr construction, but that’s all. For example, new T might be
    called first, then otherFunction(), and then the constructor unique_ptr is invoked.


    For such evaluation order, when otherFunction() throws, then new T generates a
    leak (as the pointer is not yet created).


    When you use make_unique, as in the second case, the leak is not possible as you
    wrap memory allocation and creation of unique pointer in one call.


    C++17 addresses the issue shown in the first case. Now, the evaluation order of
    function arguments is “practical” and predictable. In our example, the compiler
    won’t be allowed to call otherFunction() before the expression unique_ptr<T>(new
    T) is fully evaluated.


    # The Changes


    In an expression:


    ```

    f(a, b, c);

    ```


    The order of evaluation of a, b, c is still unspecified, but any parameter is
    fully evaluated before the next one is started. It’s especially crucial for complex
    expressions like this:'
