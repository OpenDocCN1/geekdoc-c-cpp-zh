  md: "# Different begin and end types in Range-Based For Loop\n\nC++11 added range-based\
    \ for loops:\n\n```\nfor (for-range-declaration : for-range-initializer)\n   \
    \ statement);\n```\n\nAccording to the C++14 standard loop is equivalent to the\
    \ following code:\n\n```\nauto __range = for-range-initializer;\nfor ( auto __begin\
    \ = begin-expr, __end = end-expr;\n    __begin != __end ) {\n    for-range-declaration\
    \ = *__begin;\n    statement;\n}\n```\n\nAs you can see, __begin and __end have\
    \ the same type. This works nicely but is not scalable enough. For example, you\
    \ might want to iterate until some sentinel value with a different type than the\
    \ start of the range.\n\nIn C++17 range-based for loops are defined as equivalent\
    \ to the following code:\n\n```\nauto __range = for-range-initializer;\nauto __begin\
    \ = begin-expr;\nauto __end = end-expr;\nfor ( ; __begin != __end; ) {\n    for-range-declaration\
    \ = *__begin;\n    statement;\n}\n```\n\nThe types of __begin and __end might\
    \ be different; only the comparison operator is required. That change has no effect\
    \ on existing loops but it provides more options for libraries. For example, this\
    \ little allows Range TS (and Ranges in C++20) to work with the range-based for\
    \ loop.\n\n# Extra Info\n\nThe change was proposed in: P0184R0."
