  md: "# [[fallthrough]] Attribute\n\nIndicates that a fall-through in a switch statement\
    \ is intentional and a warning should not be issued for it.\n\n```\nswitch (c)\
    \ {\n  case 'a':\n    f(); // Warning! fallthrough is perhaps a programmer error\n\
    \  case 'b':\n    g();\n    [[fallthrough]]; // Warning suppressed, fallthrough\
    \ is ok\n  case 'c':\n    h();\n}\n```\n\nWith this attribute, the compiler can\
    \ understand the intentions of a programmer. It’s also much more readable than\
    \ using a comment.\n\n# [[maybe_unused]] Attribute\n\nSuppresses compiler warnings\
    \ about unused entities:\n\n```\nstatic void impl1() { ... } // Compilers may\
    \ warn when function not called\n[[maybe_unused]] static void impl2() { ... }\
    \ // Warning suppressed\n```\n\n```\nvoid foo() {\n  int x = 42; // Compilers\
    \ may warn when x is not used later\n  [[maybe_unused]] int y = 42; // Warning\
    \ suppressed for y\n}\n```\n\nSuch behaviour is helpful when some of the variables\
    \ and functions are used in debug only path. For example in assert() macros:\n\
    \n```\nvoid doSomething(std::string_view a, std::string_view b) {\n  assert(a.size()\
    \ < b.size());\n}\n```\n\nIf later a or b is no used in this function, then the\
    \ compiler will generate a warning in release only builds. Marking the given argument\
    \ with [[maybe_unused]] will solve this warning."
