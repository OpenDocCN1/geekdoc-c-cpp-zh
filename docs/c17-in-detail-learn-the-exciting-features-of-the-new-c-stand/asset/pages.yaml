    \ some compiler-specific attribute, you might even get an error when compiling\
    \ in another compiler that doesn't support it. Now, the compiler omits the attribute\
    \ specification and won't report anything (or just a warning). This wasn't mentioned\
    \ in the Standard, and it needed clarification.\n\n¹⁰https://wg21.link/n4266\n\
    ¹¹https://wg21.link/n4196"
