  md: "# [[nodiscard]] Attribute\n\n[[nodiscard]] can be applied to a function or\
    \ a type declaration to mark the importance of the returned value:\n\n```\n[[nodiscard]]\
    \ int Compute();\nvoid Test() {\n    Compute(); // Warning! return value of a\n\
    \    // nodiscard function is discarded\n}\n```\n\nIf you forget to assign the\
    \ result to a variable, then the compiler should emit a warning. What if you want\
    \ to handle errors. What happens if you forget about using the return value from\
    \ new or std::async()?\n\nAdditionally, the attribute can be applied to types.\
    \ One case for it might be error codes:\n\n```\nenum class [[nodiscard]] ErrorCode\
    \ {\n    OK,\n    Fatal,\n    System,\n    FileIssue\n};\n```\n\n```\nErrorCode\
    \ OpenFile(std::string_view fileName);\nErrorCode SendEmail(std::string_view sendto,\
    \ std::string_view text);\nErrorCode SystemCall(std::string_view text);\n```\n\
    \nNow, every time you'd like to call such functions, you're “forced” to check\
    \ the return value. For important functions checking return codes could be crucial\
    \ and using [[nodiscard]] might save you from a few bugs.\n\nYou might also ask\
    \ what it means “not to use” a return value\n\nIn the Standard, it’s defined as\
    \ “Discarded-value expressions”. It means you call a function only for its side\
    \ effects. In other words, there’s no statement around or an assignment expression.\
    \ In that case, when a type is marked as [[nodiscard]] the compiler is encouraged\
    \ to report a warning.\n\nHowever, to suppress it you can explicitly cast the\
    \ return value to void or [[maybe_unused]]:\n\n> http://en.cppreference.com/w/cpp/language/expressions#Discarded_value_expressions"
