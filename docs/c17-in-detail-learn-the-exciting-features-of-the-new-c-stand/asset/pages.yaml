    \ binding is that you can use it inside a range based for loop:\n\n```\nstd::map<KeyType,\
    \ ValueType> myMap;\n// C++14:\nfor (const auto& elem : myMap) {\n  // elem.first\
    \ - is vel key\n  // elem.second - is the value\n}\n// C++17:\nfor (const auto&\
    \ [key,val] : myMap) {\n  // use key/value directly\n}\n```\n\nIn the above example,\
    \ we bind to a pair of [key, val] so we can use those names in the loop. C++17\
    \ you had to operate on an iterator from the map - which returns a pair <first,\
    \ second>. Using the names key/value is more expressive.\n\nThe above technique\
    \ can be used in:\n\n```\n#include <map>\n#include <iostream>\n#include <string>\n\
