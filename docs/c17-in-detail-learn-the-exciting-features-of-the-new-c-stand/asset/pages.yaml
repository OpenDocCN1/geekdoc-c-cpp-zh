  md: "# Declaring Non-Type Template Parameters With auto\n\nThis is another part\
    \ of the strategy to use auto everywhere. With C++11 and C++14, you can use it\
    \ to deduce variables or return types automatically, yet there are also generic\
    \ lambdas. Now you can also use it for deducing non-type template parameters.\n\
    \nFor example:\n\n```\ntemplate <auto value> void f() { \nf<10>();    // deduces\
    \ int\n```\n\nThis is useful, as you don't have to have a separate parameter for\
    \ the type of non-type parameter. In C++11/14:\n\n```\ntemplate <typename Type,\
    \ Type value> constexpr Type TConstant = value;\nconstexpr auto MySuperConst =\
    \ TConstant<int, 100>;\n```\n\nWith C++17 it's a bit simpler:\n\n```\ntemplate\
    \ <auto value> constexpr auto TConstant = value;\nconstexpr auto MySuperConst\
    \ = TConstant<100>;\n```\n\nThere's no need to write explicitly.\nAs one of the\
    \ advanced uses has lots of papers, and articles point to an example of heterogeneous\
    \ compile time list:\n\n```\ntemplate <auto ... vs> struct HeterogeneousValueList\
    \ {};\nusing MyList = HeterogeneousValueList<'a', 100, 'b'>;\n```\n\nBefore C++17\
    \ it was not possible to declare this list directly, some wrapper class would\
    \ have to be provided first.\n\n> Extra Info\nThe change was proposed in: P0127R12.\
    \ In P0127R13, you can find some examples and reasoning."
