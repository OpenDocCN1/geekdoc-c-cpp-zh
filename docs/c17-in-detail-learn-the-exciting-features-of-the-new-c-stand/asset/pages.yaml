  md: "# # Fixes\n\nWe can argue what is a fix in a language standard and what is\
    \ not. Below there are three things that might look like a fix for something that\
    \ was missing or not working in the previous rules.\n\n# ## New auto rules for\
    \ direct-list-initialisation\n\nSince C++11 there's been a strange problem where:\n\
    \n```\nauto x = { 1 };\n```\n\nIs deduced as std::initializer_list<int>. Such\
    \ behaviour is not intuitive as in cases you should expect it to work like x {\
    \ 1 };\n\nBrace initialisation is the preferred pattern modern C++, but such exceptions\
    \ make the feature weaker.\n\nWith the new Standard, we can fix this so that it\
    \ will deduce int.\n\nTo make this happen, we need to understand two ways of initialisation\
    \ - copy and direct:\n\n```\n// foo() is a function that returns some Type by\
    \ value\nauto x = foo();           // copy-initialisation\nauto x(foo());    \
    \        // direct-initialisation, initializes an\n                          \
    \       // initializer_list (until C++17)\n```\n\n```\nint x = foo();        \
    \   // copy-initialisation\nint x{foo()};          // direct-initialisation\n\
    ```\n\nFor the direct initialisation, C++17 introduces new rules:\n\n+   - For\
    \ a braced-init-list with a single element, auto deduction will deduce from that\
    \ entry.\n- For a braced-init-list with more than one element, auto deduction\
    \ will be ill-formed."
