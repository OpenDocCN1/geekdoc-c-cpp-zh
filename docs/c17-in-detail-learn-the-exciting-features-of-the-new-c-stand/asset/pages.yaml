  md: '# Removed Elements


    One of the core concepts behind each iteration of C++ is its compatibility with
    previous versions. We''d like to have new things in the language, but at the same
    time, our old projects should still compile. However, sometimes, there''s a chance
    to remove parts that are wrong or rarely used.


    This section briefly explains what was removed from the Standard.


    # Removing the register Keyword


    The register keyword was deprecated in 2011 (C++11), and it has had no meaning
    since then. It was removed in C++17. The keyword is reserved and might be repurposed
    in future revisions of the Standard (for example auto keyword was reused and is
    now an entirely new and powerful feature).


    If you use register to declare a variable:


    ```

    register int a;

    ```


    You might get the following warning (GCC8.1 below)


    warning: ISO C++17 does not allow ''register'' storage class specifier


    or error in Clang (Clang 7.0)


    error: ISO C++17 does not allow ''register'' storage class specifier


    > Extra Info

    The change was proposed in: P0001R1².'
