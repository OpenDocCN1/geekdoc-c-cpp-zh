  md: '# Before C++11


    In the era of C++98/03, each compiler introduced its own set of annotations, usually
    with a different keyword.


    Often, you could see code with #pragma, __declspec, __attribute spread throughout
    the code.


    Here’s the list of the common syntax from GCC/Clang and MSVC:


    # GCC Specific Attributes


    GCC uses annotation in the form of __attribute__((attr_name)). For example:


    ```

    int square (int) __attribute__ ((pure)); // pure function

    ```


    Documentation:


    +   - Attribute Syntax - Using the GNU Compiler Collection (GCC)¹n- Using the
    GNU Compiler Collection (GCC): Common Function Attributes²


    # MSVC Specific Attributes


    Microsoft mostly used __declspec keyword, as their syntax for various compiler-extensions.
    See the documentation here: __declspec Microsoft Docs³.


    __declspec (deprecated) void LegacyCode() { }


    # Clang Specific Attributes


    Clang, as it’s straight forward to customise, can support different types of annotations,
    look at the documentation to find more. Most of GCC attributes work with Clang.


    See the documentation here: Attributes in Clang — Clang documentation⁴.


    > ¹https://gcc.gnu.org/linedocs/gcc-4.8.1/gcc/Attribute-Syntax.html

    ²https://gcc.gnu.org/linedocs/Common-Function-Attributes#Common-Function-Attributes

    ³https://docs.microsoft.com/en-us/cpp/declspec

    ⁴https://clang.llvm.org/AttributeReference.html'
