  md: '# Other Changes


    In C++17 there are also other language and library features related to templates
    that are worth mentioning:


    # Allow typename in a Template Template Parameters.


    Allows you to use typename instead of class when declaring a template parameter.
    Normal type parameters can use them interchangeably, but template template parameters
    were restricted to class.


    More information in N4051¹⁴.


    # Allow Constant Evaluation for all Non-Type Template Arguments


    Remove syntactic restrictions for pointers, references, and pointers to members
    to appear as non-type template parameters.


    More information in N4268¹⁵.


    # Variable Templates for Traits


    All the traits that yield ::value accompanying _v variable templates. For example:


    ```

    std::is_integral<T>::value has std::is_integral_v<T>

    ```


    ```

    std::is_class<T>::value has std::is_class_v<T>

    ```


    This improvement already follows the _t suffix additions in C++14 (template aliases)
    of traits that returns ::type. Such change can considerably shorten template code.


    More information in P0006R¹⁶.'
