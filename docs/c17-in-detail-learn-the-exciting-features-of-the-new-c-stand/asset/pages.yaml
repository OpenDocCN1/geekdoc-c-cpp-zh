  md: "# Fold Expressions\n\nC++11 introduced variadic templates, which is a powerful\
    \ feature, especially if you want to work with a variable number of input template\
    \ parameters to a function. For example, previously (pre C++11) you had to write\
    \ several different versions of a template function (one for one parameter, another\
    \ for two parameters, another for three params...).\n\nStill, variadic templates\
    \ required some additional code when you wanted to implement \"recursive\" functions\
    \ like sum, all. You had to specify rules for the recursion.\n\nFor example:\n\
    \n```\nauto SumCpp11() {\n    return 0;\n}\n\ntemplate<typename ...Args>\nauto\
    \ SumCpp11(T1 s, T... ts) {\n    return s + SumCpp11(ts...);\n}\n```\n\nAnd with\
    \ C++17 we can write much simpler code:\n\n```\ntemplate<typename ...Args> auto\
    \ sum(Args ...args) {\n    return (args + ... + 0);\n}\n\n// or even:\ntemplate<typename\
    \ ...Args> auto sum2(Args ...args) {\n    return (args + ...);\n}\n```\n\nThe\
    \ following variations of fold expressions* with binary operators (op) exist:\n\
    \n| Expression | Name | Expansion |\n|---|---|---|\n| (... op e) | unary left\
    \ fold | ((e1 op e2) ... op eN) |\n| (init op ... op e) | binary left fold | (((init\
    \ op e1) op e2) ... op eN) |\n| (e op ... op) | unary right fold | e op (... op\
    \ (eN-1 op eN)) |\n| (e op ... op init) | binary right fold | e op (... op (eN-1\
    \ op (eN init))) |\n\n> *https://en.cppreference.com/w/cpp/language/fold"
  merge: -1
  pgno: 72
- img_proc: true
  md: "op is any of the following 32 binary operators: - * % ^ & | = > << >> += =\n\
    = *= /= %= ^= &= |= <= >> == != <= >= && || , .* -->. In a binary fold,\nboth\
    \ ops must be the same.\n\nFor example, when you write:\n\n```\ntemplate<typename...Args>\
    \ auto sum2(Args...args) {\n    return (args + ...); // unary right fold over\
    \ '+'\n}\n```\n\nauto value = sum2(1, 2, 3, 4);\n\nThe template function is expanded\
    \ into:\n\nauto value = 1 + (2 + (3 + 4));\n\nAlso by default we get the following\
    \ values for empty parameter packs:\n\n| Operator | default value |\n| && | true\
    \ |\n| || | false |\n| , any other | ill-formed code |\n\nThat's why you cannot\
    \ call sum2() without any parameters, the unary fold over operator\n+ doesn't\
    \ have any default value for the empty parameter list.\n\n# More Examples\n\n\
    Here's a quite nice implementation of a printf using folds P0036R0':\n\n> ^http://wg21.link/p0036r0"
