  md: "# __has_include Preprocessor Expression\n\nIf your code has to work under two\
    \ different compilers, then you might experience two deffer sets of available\
    \ features and platform-specific changes.\n\nIn C++17 you can use __has_include\
    \ preprocessor constant expression to check if a given header exists:\n\n```\n\
    #if __has_include(<header_name>)\n#if __has_include(\"header_name\")\n```\n\n\
    __has_include was available in Clang as an extension for many years, but now it\
    \ was added to the Standard. It's a part of \"feature testing\" that helps you\
    \ to check if a particular C++ feature or a header is available. If a compiler\
    \ supports this macro, then's accessible even without the C++17 flag, that's why\
    \ you can check for a feature also if you are in C++11, or C++14 \"mode\".\n\n\
    As an example, we can test if a platform has <charconv> header that declares C++17's\
    \ low-level conversion routines:\n\nChapter General Language Features/has_include.cpp\n\
    \n```\n#if defined __has_include\n# if __has_include(<charconv>)\n    define has_charconv\
    \ 1\n    include <charconv>\n#endif\n#endif\n```\n\n```\nstd::optional<int> ConvertToInt(const\
    \ std::string& str) {\n    int value = {};\n#ifdef has_charconv\n    const auto\
    \ last = str.data() + str.size();\n    const auto res = std::from_chars(str.data(),\
    \ last, value);\n    if (res.ec == std::errc{} && res.ptr == last)\n        return\
    \ value;\n#else\n    // alternative implementation...\n#endif\n\n    return std::nullopt;\n\
    }\n```"
