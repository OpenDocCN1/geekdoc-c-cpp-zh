    \ {\n    auto foo() {\n        return [=] { std::cout << s << '\\n'; };\n    }\n\
    \    std::string s;\n};\n\nint main() {\n    auto f1 = Baz(\"ala\").foo();\n \
    \   f1();\n}\n```\n\nThe code declares a Baz object and invokes foo(). Please\
    \ note that foo() returns a lambda that captures a block [=] suggests we capture\
    \ variables by value, but if you access members of a class in a lambda expression,\
    \ then it does this implicitly via this pointer. So we captured a copy of this\
    \ pointer, which is a dangling pointer as soon as we exceed the lifetime of the\
    \ Baz object.\n\nIn C++17 you can write [*this] and that will capture a copy of\
    \ the whole object.\n\n```\nauto lam = [*this]() { std::cout << s; };\n```\n\n\
    In C++14, the only way to make the code safe is to capture [*this]:\n\n```\nauto\
    \ lam = [self=*this] { std::cout << self.s; };\n```\n\nCapturing this might get\
    \ tricky when a lambda can outlive the object itself. This might happen when you\
    \ use async calls or multithreading.\nIn C++20 (see P0806¹) you'll also see an\
    \ extra warning if you capture [=] in a method. Such expression capture this pointer,\
    \ and it might not be exactly what you want.\n\n> Extra Info\nnThe change was\
    \ proposed in: P0018¹."
