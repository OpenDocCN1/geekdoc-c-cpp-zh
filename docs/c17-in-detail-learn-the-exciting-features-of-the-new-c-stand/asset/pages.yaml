  md: "# Templates ... 57\n\n```\ntemplate<typename ...Args>\nvoid FoldPrint(Args&&...\
    \ args) {\n  (std::cout << << std::forward<Args>(args) << '\\n');\n}\n```\n\n\
    ```\nFoldPrint(\"hello\", 10, 20, 30);\n```\n\nHowever, above FoldPrint will print\
    \ arguments one by one, without any separator. For the above function call, you'll\
