    }\n\nint main() {\n    auto largeMoveableObj = make(90); // 构建对象\n    return largeMoveableObj.v;\n\
    }\n```\n\n上述代码在 C++14 下由于缺少拷贝和移动构造函数无法编译。在 C++17 中不需要，因为 largeMoveableObj 将就地构造。请注意，C++17\
    \ 的拷贝消除仅适用于匿名临时对象，而命名 RVO 是强制的。要理解标准中定义的拷贝消除/延迟实例化，我们必须理解下一节介绍的值类别。\n\n# 更新的值类别\
    \ (Value Categories)\n\n在 C++98/03 中，表达式有两种基本值类别：\n\n- 左值（lvalue）：可以出现在赋值左侧的表达式\n\
    - 右值（rvalue）：只能出现在赋值右侧的表达式\n\nC++11 扩展了这一分类法（由于移动语义），增加了三个类别：\n\n- 将值（xvalue）：即将消失的左值\n\
    - 原值（prvalue）：纯右值、临时对象或子对象，或与对象关联的值\n- 广义左值（glvalue）：一个对象\n\n示例：\n\n```cpp\nstd::string\
    \ str;\nstr;             // 左值\n42;             // 原值\nstr + \"10\"       // 原值\n\
    std::move(str); // 将值\n```\n\n这是一张显示类别之间关系的图表：\n\n![](img/ac4435c2a52cc3a8ff1174f162a38_0.png)\n\
    \n# 语言说明\n\n以下是三个核心类别：\n\n- 左值（lvalue）：具有恒性标识的表达式，我们可以获取其地址\n- 将值（xvalue）：“即将消失的左值”——我们可以移动的对象，通常其生命周期很快结束\n\
    - 原值（prvalue）：纯右值——没有名称、我们无法获取其地址、我们可以移动的东西\n\n为了支持拷贝消除，提议作者提供了 glvalue 和 prvalue\
    \ 的更新定义：\n\n- glvalue：求值计算对象、位域或函数位置的表达式\n- prvalue：求值初始化对象、位域或运算符操作数的表达式，具体取决于其所处的上下文\n\
    \n例如：\n\n```cpp\nclass X { int a; };\nX{10} // 此表达式是原值\nx;     // 左值\nx.a // 左值（位置）\n\
    ```\n\n简而言之：prvalues 执行初始化，glvalues 描述位置。C++17 标准规定了，当 prvalue 初始化某个 glvalue 时，就不需要创建临时对象，我们可以延迟其实例化。\n\
    \n在 C++17 中，拷贝消除/延迟实例化发生在：\n\n- 从原值初始化对象时：Type T()\n- 在返回原值的函数中——如我们的示例。\n\n#\
    \ 额外信息\n\n该变更提于：P0135R0（推理）和 P0135R1（措辞）。\n\n⁴https://timsong-cpp.github.io/cpppp/n4659/basic.level\n\
    ⁵https://wg21.cpp.link/p0135r\n⁶https://wg21.cpp.link/p0135r1\n\n# 超对齐数据的内存分配\
    \ (Dynamic Memory Allocation for Over-Aligned Data)\n\n嵌入式环境、内核、驱动程序、游戏开发等领域可能需要非默认的内存对齐。遵守这些要求可能会性能或满足某些硬件接口。\n\
    \n例如，使用 SIMD 指令执行几何数据处理时，你可能需要对持有 3D 坐标的结构体进行 16 字节或 32 字节对齐：\n\n```cpp\nstruct\
    \ alignas(32) Vec3d { // alignas 从 C++11 开始\n  double x, y, z;\n}\nauto pVectors\
    \ = new Vec3d[1000];\n```\n\nVec3d 包含 double 字段，通常自然对齐应该是 8 字节。现在通过 alignas 关键字，我们将此对齐改为\
    \ 32。这种方法允许编译器将对象放入 SIMD 寄存器中（如 AVX）。\n\n遗憾的是，在 C++14 中，你无法保证 `new[]` 后的内存是对齐的。通常，你必须使用如\
    \ `std::aligned_alloc()` 或 MSVC 的 `_aligned_malloc()` 等例程来确保对齐。这并不理想，因为它们很难与智能指针配合，并让内存管理变得代码可见。\n\
    \nC++17 通过引入带有 `align_val_t` 参数的 `new()` 和 `delete()` 内存分配函数重载修复了这个漏洞。示例函数签名如下：\n\
    \n```cpp\nvoid* operator new(size_t, align_val_t);\nvoid operator delete(void*,\
    \ size_t, align_val_t);\n```\n\n标准定义了 `__STDCPP_DEFAULT_NEW_ALIGNMENT__` 宏，指定动态内存分配的默认对齐。在常用平台上，Clang、GCC\
    \ 和 MSVC 指定其为 16 字节。\n\n现在，在 C++17 中，你分配：\n\n```cpp\nauto pVectors = new Vec3d[1000];\n\
    ```\n\n> *单指令多数据流，例如 SSE2、AVX，详见 https://en.wikipedia.org/wiki/Streaming_SIMD_Extensions\n\
    *查看所有 22 个 new() 重载请访问 https://en.cppreference.com/wpp/memory/new/operator_new\n\
    \n"
