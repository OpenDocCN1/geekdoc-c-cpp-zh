  mdcn: "\n\n例如：\n\n```\nstd::pair(a, 1.0f);\nauto [x, y] = a;\n```\n\nx 绑定到生成对象中存储的\
    \ `int`，该对象是 a 的拷贝。同样地，y 绑定到 `float`。\n\n# 修饰符\n\n结构绑定可以使用多种修饰符：\nconst 修饰符：\n\
    \n```\nconst auto [a, b, c, ...] = expression;\n```\n\n引用：\n\n```\nauto& [a, b,\
    \ c, ...] = expression;\nauto&& [a, b, c, ...] = expression;\n```\n\n例如：\n\n```cpp\n\
    std::pair(a, 1.0f);\nauto [x, y] = a;\nx = 10; // 可写访问\n// a.first 现在是相同的\n```\n\
    \n在示例中中，x 绑定到生成对象中的元素，该元素是 a 的引用。\n现在获取元组成员的引用非常简单：\n\n```cpp\nauto& [ refA, refB,\
    \ refC, refD ] = myTuple;\n```\n\n你也可以为结构绑定添加 [[attribute]]：\n[[maybe_unused]]\
    \ auto [a, b, c, ...] = expression;\n\n# 结构化绑定还是解构声明？\n\n你可能见过用于该特性的另一个名称：“解构声明（decomposition\
    \ declaration）”。在标准化过程中，考虑了这两个名称，但选择了“结构化绑定（structured bindings）”。\n\n![](img/ac44c350c2a527cc3a8ffb11074f162a_48_0.png)\n\
    \n# 结构绑定局限性\n\n结构绑定有一些局限性。它们不能被声明为 `static` 或 `constexpr`，且不能在 lambda 函数中使用。例如：\n\
    \n```cpp\nconstexpr auto [x, y] = std::pair(a, 0);\n// 生成：\nerror: structured\
    \ binding declaration cannot be 'constexpr'\n```\n\n绑定的链接（linkage）此前也不明确。编译器可以自由选择实现方式（因此某些编译器可能允许在\
    \ lambda 中捕获结构绑定）。幸运的是，这些局限性可能会被 C++20 提议移除：P1091：扩展结构绑定以使其更像变量声明。\n\n# 绑定\n\n\
    结构绑定不仅限于元组（tuples），我们有三种情况可以进行绑定：\n\n- 1. 如果初始化器是数组：\n\n```cpp\n// 适用于数组：\ndouble\
    \ myArray[3] = { 1.0, 2.0, 3.0 };\nauto [a, b, c] = myArray;\n```\n\n在这种情况下，数组被拷贝到一个临时对象中，a、b\
    \ 和 c 引用数组中拷贝的元素。\n\n- 2. 如果初始化器支持 `std::tuple_size<`、提供了 `get<N>()` 并暴露了 `std::tuple_element`\
    \ 函数：\n\n```cpp\nstd::pair myPair(a, 1.0f);\nauto [a, b] = myPair; // 绑定到 myPair.first/second\n\
    ```\n\n在上面的代码段中，我们绑定到 myPair。这也意味着只要你添加了 `get<N>` 接口实现，你就可以支持自己的类。参见后文章节中的示例。\n\
    \n> https://wg21.link/P1091\n\n- 3. 如果初始化器的类型仅包含非静态数据成员：\n\n```cpp\nstruct Point\
    \ {\n    double x;\n    double y;\n};\n```\n\n```cpp\nPoint GetPoint() {\n   \
    \ return { 0.0, 0.0 };\n}\n```\n\nconst auto [x, y] = GetPoint();\n\nx 和 y 引用\
    \ Point 结构中的 `Point::x` 和 `Point::y`。\n该类不需要是 POD（纯数据），但标识符的数量必须等于非静态数据成员的数量。这些成员在给定上下文中必须是可以的。\n\
    \n> 注意：在 C++17 中，最初你可以使用结构绑定绑定类成员，只要它们是公有的。当你想要在友元函数环境甚至结构体实现内部访问此类成员时，可能会出现问题。这个问题很快被识别为一个缺陷，并在\
    \ C++17 中已修复。参见 P0969R0。\n\n# 示例\n\n本节将向你展示几个结构绑定很有用的示例。在第一个示例中，我们将使用它们来编写更具表现力的代码；在下一个示例中，你将看到如何为你的类提供\
    \ API 以支持结构绑定。\n\n# 使用结构绑定的表现力代码\n\n如果你有一个元素 map，你可能知道它们在内部被存储为 `<const Key, ValueType>`\
    \ 键对。\n\n# 通用语言特性\n\n现在，你遍历该 map 的元素：\n\n```cpp\nfor (const auto& elem : myMap)\
    \ { ... }\n```\n\n你需要编写 `elem.first` 和 `second` 来引用键和值。结构绑定最酷的用法之一是在基于范围的 for\
    \ 循环（range based for loop）中使用：\n\n```cpp\nstd::map<KeyType, ValueType> myMap;\n\
    // C++14:\nfor (const auto& elem : myMap) {\n  // elem.first - 是键\n  // elem.second\
    \ - 是值\n}\n// C++17:\nfor (const auto& [key,val] : myMap) {\n  // 直接使用 key/value\n\
    }\n```\n\n在上面的示例中，我们绑定到键对 `[key, val]`，这样我们可以在循环中使用这些名称。在 C++17 中，你不需要操作迭代器。\n\
    \n```cpp\n#include <map>\n#include <iostream>\n#include <string>\n\nint main()\
    \ {\n  std::map<std::string, int> myMap = {{\"apple\", 1}, {\"banana\", 2}};\n\
    \n  // C++14 风格\n  for (const auto& elem : myMap) {\n    // std::cout << elem.first\
    \ << \": \" << elem.second << \"\\n\";\n  }\n\n  // C++17 风格（使用结构绑定）\n  for (const\
    \ auto& [key,val] : myMap) {\n    // 直接使用 key/value\n    std::cout << key << \"\
    : \" << val << \"\\n\";\n  }\n  return 0;\n}\n```\n\n"
