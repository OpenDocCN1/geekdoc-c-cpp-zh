    With C++17 you can write thw following:


    ```

    std::set<int> mySet;

    ```


    ```

    auto [iter, inserted] = mySet.insert(10);

    ```


    Now, instead of pair.first and pair.second, you can use variables with concrete
    names. In addition, you have one line instead of three, and the code is easier
    to read. The code is also safer as iter and inserted are initialised in the expression.


    Such syntax is called a structured binding expression.


    # The Syntax


    The basic syntax for structured bindings is as follows:


    ```

    auto [a, b, c, ...] = expression;

    auto [a, b, c, ...] { expression };

    auto [a, b, c, ...] ( expression );

    ```


    The compiler introduces all identifiers from the a, b, c, ... list as names in
    the surrounding scope and binds them to sub-objects or elements of the object
    denoted by expression.


    Behind the scenes, the compiler might generate the following pseudo code:


    ```

    auto tempTuple = expression;

    using a = tempTuple.first;

    using b = tempTuple.second;

    using c = tempTuple.third;

    ```


    Conceptually, the expression is copied into a tuple-like object (tempTuple) with
    variables that are exposed through a, b and c. However, the variables a, b and
    c are not references; they are aliases (or bindings) to the generated object member
    variables. The temporary object has a unique name assigned by the compiler.'
- md: "\nFor example:\n\n```\nstd::pair(a, 1.0f);\nauto [x, y] = a;\n```\n\nx binds\
    \ to int stored in the generated object that is a copy of a. And similarly, y\
    \ binds to float.\n\n# Modifiers\n\nSeveral modifiers can be used with structured\
    \ bindings:\nconst modifiers:\n\n```\nconst auto [a, b, c, ...] = expression;\n\
    ```\n\nReferences:\n\n```\nauto& [a, b, c, ...] = expression;\nauto&& [a, b, c,\
    \ ...] = expression;\n```\n\nFor example:\n\n```\nstd::pair(a, 1.0f);\nauto [x,\
    \ y] = a;\nx = 10; // write access\n// a.first is now the same\n```\n\nIn the\
    \ example, x binds to the element in the generated object, that is a reference\
    \ to a.\nNow it's quite easy to get a reference to a tuple member:\n\n```\nauto&\
    \ [ refA, refB, refC, refD ] = myTuple;\n```\n\nYou can also add [[attribute]]\
    \ to structured bindings:\n[[maybe_unused]] auto [a, b, c, ...] = expression;\n\
    \n# Structured Bindings or Decomposition Declaration?\n\nYou might have seen another\
    \ name used for this feature: \"decomposition declaration.\" During the standardisation\
    \ process, both names were considered, but \"structured bindings\" was selected.\n\
    \n![](img/ac44c350c2a527cc3a8ffb11074f162a_48_0.png)\n\n# Structured Binding Limitations\n\
    \nThere are several limitations related to structured bindings. They cannot be\
    \ declared as static or constexpr also cannot be used in lambda functions. For\
    \ example:\n\n```\nconstexpr auto [x, y] = std::pair(a, 0);\n// generates:\nerror:\
    \ structured binding declaration cannot be 'constexpr'\n```\n\nIt was also unclear\
    \ about the linkage of the bindings. Compilers had a free choice to implement\
    \ it (and thus some of them might allow capturing a structured binding in lambdas).\
    \ Fortunately, those limitations might be removed by C++20 proposal (already accepted):\
    \ P1091: Extending structured bindings to be more like variable declarations.\n\
    \n# Binding\n\nStructured Binding is not limited to tuples, we have three cases\
    \ from which we can bind from:\n\n- 1. If the initializer is an array:\n\n```\n\
    // works with arrays:\ndouble myArray[3] = { 1.0, 2.0, 3.0 };\nauto [a, b, c]\
