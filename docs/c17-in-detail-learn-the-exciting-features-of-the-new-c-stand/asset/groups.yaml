    \  } else {\n    return nullptr;\n}\n```\n\nNow, the compiler evaluates the if\
    \ constexpr condition at compile-time and for the expression `auto p = constructArgs<Test>(10,\
    \ 10, 10);` the whole if branch will be \"removed\" from the second step of the\
    \ compilation process.\n\nTo be precise, the discarded branch is not entirely\
    \ removed from the compilation phase. Only expressions that are dependent on the\
    \ template parameter used in the condition are not instantiated. The syntax must\
    \ always be valid.\n\nFor example:\n\n```cpp\ntemplate <typename T>\nvoid Calculate(T\
    \ t) {\n  if constexpr (std::is_integral_v<T>) {\n    // /\n    static_assert(sizeof(int)\
    \ == 100);\n  } else {\n    execute(t);\n  }\n  strange syntax\n}\n```\n\nIn the\
    \ above artificial code, if the type T is int, then the else branch is discarded,\
    \ which means execute(t) won't be instantiated. But the line `strange syntax`\
    \ will still be compiled (as it's not dependent on T) and that's why you'll get\
    \ a compile error about that. Furthermore, another compilation error will come\
    \ from static_assert, the expression is also not dependent on T, and that's why\
    \ it will always be evaluated.\n\n# Template C++17 Simplification\n\nBefore C++17\
    \ if you have several versions of an algorithm - depending on the type requirements\
    \ - you could use SFINAE or tag dispatching to generate a dedicated overload resolution\
    \ set.\n\nFor example:\n\nChapter Templates/sfinae_example.cpp\n\n```cpp\ntemplate\
    \ <typename T>\nstd::enable_if_t<std::is_integral_v<T>, T> simpleTypeInfo(T t)\
    \ {\n    std::cout << \"integral T > \" << t << '\\n';\n    return t;\n}\n```\n\
    \n```cpp\ntemplate <typename T>\nstd::enable_if_t<!std::is_integral_v<T>, T> simpleTypeInfo(T\
    \ t) {\n    std::cout << \"not integral \\n\";\n    return t;\n}\n```\n\nIn the\
    \ above example, we have two implementations, but only one of them will end up\
    \ in overload resolution set. If `is_integral_v` is true for T type, then the\
    \ top function is taken, and the second one rejected to SFINAE.\n\nThe same thing\
    \ can happen using tag dispatching:\n\nChapter Templates/tag_dispatching_example.cpp\n\
    \n```cpp\ntemplate <typename T>\nvoid simpleTypeImpl(T t, std::true_type) {\n\
    \    std::cout << \"integral T > \" << t << '\\n';\n}\n```\n\n```cpp\ntemplate\
    \ <typename T>\nvoid simpleTypeImpl(T t, std::false_type) {\n    std::cout <<\
    \ \"not integral \\n\";\n}\n```\n\n```cpp\ntemplate <typename T>\nvoid simpleTypeInfo(T\
    \ t) {\n    simpleTypeImpl(t, is_integral<T>{});\n}\n```\n\nInstead of SFINAE,\
    \ we generate a unique tag for the condition: true_type or false_type. Depending\
    \ on implementation, only one is selected. We can now simplify this pattern with\
    \ constexpr:\n\n```cpp\ntemplate <typename T>\nvoid simpleTypeInfo(T t) {\n  \
    \  if constexpr (std::is_integral_v<T>) {\n        std::cout << \"integral T >\
    \ \" << t << '\\n';\n    } else {\n        std::cout << \"not integral \\n\";\n\
