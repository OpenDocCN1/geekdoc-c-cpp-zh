    \ myPair.first/second\n```\n\nIn the above snippet, we bind to myPair. But this\
    \ also means that you can support your classes, assuming you add get<N> interface\
    \ implementation. See an example in the later section.\n\n> https://wg21.link/P1091\n\
    \n- 3. If the initialiser's type contains only non-static data members:\n\n```cpp\n\
    struct Point {\n    double x;\n    double y;\n};\n```\n\n```cpp\nPoint GetPoint()\
