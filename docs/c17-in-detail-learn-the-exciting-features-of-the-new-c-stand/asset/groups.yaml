    early, the improvement is available in GCC 5.0 (Mid 2015). Clang 3.8 (Early 2016)
    and MSVC 2015 (Mid 2015). Much earlier than C++17 was approved.


    # static_assert With no Message


    This feature adds a new overload for static_assert. It enables you to have the
    condition inside static_assert without passing the message.


    It will be compatible with other asserts like BOOST_STATIC_ASSERT. Programmers
    with boost experience will now have no trouble switching to C++17 static_assert.


    ```

    static_assert(std::is_arithmetic<T>, "T must be arithmetic");

    static_assert(std::is_arithmetic_v<T>); // no message needed since C++17

    ```


    In many cases, the condition you check is expressive enough and doesn''t need
    to be mentioned in the message string.


    # Extra Info


    The change was proposed in: N3928.


