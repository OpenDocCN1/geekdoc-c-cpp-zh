    float.


    # Modifiers


    Several modifiers can be used with structured bindings:

    const modifiers:


    ```

    const auto [a, b, c, ...] = expression;

    ```


    References:


    ```

    auto& [a, b, c, ...] = expression;

    auto&& [a, b, c, ...] = expression;

    ```


    For example:


    ```

    std::pair(a, 1.0f);

    auto [x, y] = a;

    x = 10; // write access

    // a.first is now now

    ```


    In the example, x binds to the element in the generated object, that is a reference
    to a.

    Now it''s quite easy to get a reference to a tuple member:


    ```

    auto& [ refA, refB, refC, refD ] = myTuple;

    ```


    You can also add [[attribute]] to structured bindings:

    [[maybe_unused]] auto [a, b, c, ...] = expression;


    # Structured Bindings or Decomposition Declaration?


    You might have seen another name used for this feature: "decomposition declaration.\
    During the standardisation process, both names were considered, but "structured
    bindings" was selected.


    ![](img/ac44c350c2a527cc3a8ffb11074f162a_48_0.png)'
  - '[PAGE 49]


    # Structured Binding Limitations


    There are several limitations related to structured bindings. They cannot be declared
    as static or constexpr also cannot be used in lambda functions. For example:


    ```

    constexpr auto [x, y] = std::pair(@, 0);

    // generates:

    error: structured binding declaration cannot be ''constexpr''

    ```


    It was also unclear about the linkage of the bindings. Compilers had a free choice
    to implement it (and thus some of them might allow capturing a structured binding
    in lambdas). Fortunately, those limitations might removed by C++20 proposal (already
    accepted): P1091: Extending structured bindings to be more like variable declarations.


    # Binding


    Structured Binding is not limited to tuples, we have three cases from which we
    can bind from:


    +   1. If the initializer is an array:


    ```

    // works with arrays:

    double myArray[3] = { 1.0, 2.0, 3.0 };

    auto [a, b, c] = myArray;

    ```


    In this case, an array is copied into a temporary object, and a, b and c refers
    to copied elements from the array.


    2. If the initializer supports std::tuple_size<>, provides get<N>() and also exposes
    std::tuple_element functions:


    ```

    std::pair myPair(@, 1.0f);

    auto [a, b] = myPair; // binds myPair.first/second

    ```


    In the above snippet, we to myPair. But this also means that you can support for
    your classes, assuming you add get<N> interface implementation. See an example
    in the later section.


    > https://wg21.link/P1091'
