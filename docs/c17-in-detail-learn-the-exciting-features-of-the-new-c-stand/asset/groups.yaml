    # Attributes in C++11 and C++14


    C++11 took one big step to minimise the need to use vendor-specific syntax. By
    introducing the standard format, we can move a lot of compiler-specific attributes
    into the universal set.


    C++11 provides a cleaner format of specifying annotations over our code.


    The basic syntax is just [[attr]] or [[namespace::attr]].


    You can use [[attr]] over almost anything: types, functions, enums, etc., there.


    For example:


    ```

    [[attrib_name]] void foo() {} // on a function

    struct [[deprecated]] OldStruct {} // on a struct

    ```


    # C++11 we have the following attributes:


    [[noreturn]] :


    It tells the compiler that control flow will not return to the caller. Examples:


    +   - [[noreturn]] void terminate() noexcept;

    - functions like std::abort or std::exit are also marked with this attribute.


    [[carries_dependency]] :


    Indicates that the dependency chain in release-consume std::memory_order propagates
    in and out of the function, which allows the compiler to skip unnecessary memory
    fence instructions. Mostly to help to optimise multi-threaded code and when using
    different memory models.


    # C++14 added:


    [[deprecated]] and [[deprecated("reason")]] :


    Code marked with this attribute will be reported by the compiler. You can set
    its reason.'
  - '[PAGE 91]


    # Standard Attributes


    Example of [[deprecated]]:


    ```

    [[deprecated("use AwesomeFunc instead")) void GoodFunc() { }

    ```


    ```

    // call somewhere:

    GoodFunc();

    ```


    GCC reports the following warning:


    warning: ''void GoodFunc()'' is deprecated: use AwesomeFunc instead

    [-Wdeprecated-declarations]


    You know a bit about the old approach, new way in C++11/14... so what''s the deal
    with C++17?


    # C++17 Additions


    With C++17 we get three more standard attributes:


    +   - [[fallthrough]]

    - [[nodiscard]]

    - [[maybe_unused]]


    # Extra Info


    The new attributes are specified in P0188 and P0068(reasoning).


    Plus three supporting features:


    +   - Attributes for Namespaces and Enumerators

    - Ignore Unknown Attributes

    - Using Attribute Namespaces Without Repetition


    Let''s go through the new attributes.'
