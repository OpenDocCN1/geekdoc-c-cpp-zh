    \ is a powerful feature, especially if you want to work with a variable number\
    \ of input template parameters to a function. For example, previously (pre C++11)\
    \ you had to write several different versions of a template function (one for\
    \ one parameter, another for two parameters, another for three params...).\n\n\
    Still, variadic templates required some additional code when you wanted to implement\
    \ \"recursive\" functions like sum, all. You had to specify rules for the recursion.\n\
    \nFor example:\n\n```\nauto SumCpp11() {\n    return 0;\n}\n\ntemplate<typename\
    \ ...Args>\nauto SumCpp11(T1 s, T... ts) {\n    return s + SumCpp11(ts...);\n\
    }\n```\n\nAnd with C++17 we can write much simpler code:\n\n```\ntemplate<typename\
    \ ...Args> auto sum(Args ...args) {\n    return (args + ... + 0);\n}\n\n// or\
    \ even:\ntemplate<typename ...Args> auto sum2(Args ...args) {\n    return (args\
    \ + ...);\n}\n```\n\nThe following variations of fold expressions* with binary\
    \ operators (op) exist:\n\n| Expression | Name | Expansion |\n|---|---|---|\n\
    | (... op e) | unary left fold | ((e1 op e2) ... op eN) |\n| (init op ... op e)\
    \ | binary left fold | (((init op e1) op e2) ... op eN) |\n| (e op ... op) | unary\
    \ right fold | e op (... op (eN-1 op eN)) |\n| (e op ... op init) | binary right\
    \ fold | e op (... op (eN-1 op (eN init))) |\n\n> *https://en.cppreference.com/w/cpp/language/fold"
