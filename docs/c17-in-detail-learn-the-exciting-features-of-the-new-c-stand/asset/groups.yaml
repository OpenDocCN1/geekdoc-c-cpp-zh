  - "[PAGE 92]\n\n# [[fallthrough]] Attribute\n\nIndicates that a fall-through in\
    \ a switch statement is intentional and a warning should not be issued for it.\n\
    \n```\nswitch (c) {\n  case 'a':\n    f(); // Warning! fallthrough is perhaps\
    \ a programmer error\n  case 'b':\n    g();\n    [[fallthrough]]; // Warning suppressed,\
    \ fallthrough is ok\n  case 'c':\n    h();\n}\n```\n\nWith this attribute, the\
    \ compiler can understand the intentions of a programmer. It’s also much more\
    \ readable than using a comment.\n\n# [[maybe_unused]] Attribute\n\nSuppresses\
    \ compiler warnings about unused entities:\n\n```\nstatic void impl1() { ... }\
    \ // Compilers may warn when function not called\n[[maybe_unused]] static void\
    \ impl2() { ... } // Warning suppressed\n```\n\n```\nvoid foo() {\n  int x = 42;\
    \ // Compilers may warn when x is not used later\n  [[maybe_unused]] int y = 42;\
    \ // Warning suppressed for y\n}\n```\n\nSuch behaviour is helpful when some of\
    \ the variables and functions are used in debug only path. For example in assert()\
    \ macros:\n\n```\nvoid doSomething(std::string_view a, std::string_view b) {\n\
    \  assert(a.size() < b.size());\n}\n```\n\nIf later a or b is no used in this\
    \ function, then the compiler will generate a warning in release only builds.\
    \ Marking the given argument with [[maybe_unused]] will solve this warning."
  - "[PAGE 93]\n\n# [[nodiscard]] Attribute\n\n[[nodiscard]] can be applied to a function\
    \ or a type declaration to mark the importance of the returned value:\n\n```\n\
    [[nodiscard]] int Compute();\nvoid Test() {\n    Compute(); // Warning! return\
    \ value of a\n    // nodiscard function is discarded\n}\n```\n\nIf you forget\
    \ to assign the result to a variable, then the compiler should emit a warning.\
    \ What if you want to handle errors. What happens if you forget about using the\
    \ return value from new or std::async()?\n\nAdditionally, the attribute can be\
    \ applied to types. One case for it might be error codes:\n\n```\nenum class [[nodiscard]]\
    \ ErrorCode {\n    OK,\n    Fatal,\n    System,\n    FileIssue\n};\n```\n\n```\n\
    ErrorCode OpenFile(std::string_view fileName);\nErrorCode SendEmail(std::string_view\
    \ sendto, std::string_view text);\nErrorCode SystemCall(std::string_view text);\n\
    ```\n\nNow, every time you'd like to call such functions, you're “forced” to check\
    \ the return value. For important functions checking return codes could be crucial\
    \ and using [[nodiscard]] might save you from a few bugs.\n\nYou might also ask\
    \ what it means “not to use” a return value\n\nIn the Standard, it’s defined as\
    \ “Discarded-value expressions”. It means you call a function only for its side\
    \ effects. In other words, there’s no statement around or an assignment expression.\
    \ In that case, when a type is marked as [[nodiscard]] the compiler is encouraged\
    \ to report a warning.\n\nHowever, to suppress it you can explicitly cast the\
    \ return value to void or [[maybe_unused]]:\n\n> http://en.cppreference.com/w/cpp/language/expressions#Discarded_value_expressions"
  - "[PAGE 94]\n\n# Standard Attributes\n\n```\n[[nodiscard]] int Compute();\nvoid\
    \ Test() {\n    static_cast<void>(Compute()); // fine...\n\n    [[maybe_unused]]\
    \ auto ret = Compute();\n}\n```\n\nIn addition, in C++20 the Standard Library\
    \ will use [[nodiscard]] in a few places like operator new, std::async(), std::allocate(),\
    \ std::launder(), and std::empty().\nThis feature was already merged in C++20\
    \ with P0600*.\n\nThe second addition to C++20 is [[nodiscard(\"reason\")]], see\
    \ in P1301*.\nThis lets specify why not using a returned value might generate\
    \ issues — for example, some resource leak.\n\n# Attributes for Namespaces and\
    \ Enumerators\n\nThe idea for attributes in C++11 was to be able to apply them\
    \ to all sensible places like classes, functions, variables, typedefs, enumerations...\
    \ But there was an issue in the specification that blocked attributes when they\
    \ were applied on namespaces or enumerators.\nThis is fixed in C++17. We can now\
    \ write:\n\n```\nnamespace [[deprecated(use \"BetterUtils\")]] GoodUtils {\n \
    \   void DoStuff() { }\n}\n```\n\n```\nnamespace BetterUtils {\n    void DoStuff()\
    \ { }\n}\n```\n\n```\n// use:\nGoodUtils::DoStuff();\n```\n\n> https://wg21.link/p0600\n\
    https://wg21.link/P1301"
  - "[PAGE 95]\n\n# Standard Attributes\n\nClang reports:\n\n```\nwarning: 'GoodUtils'\
    \ is deprecated: use BetterUtils\n[-Wdeprecated-declarations]\n```\n\nAnother\
    \ example is the use of deprecated attribute on enumerators:\n\n```\nenum class\
    \ ColorModes {\n  RGB [[deprecated(\"use RGB8\")]],\n  RGBA [[deprecated(\"use\
    \ RGBA8\")]],\n  RGB8\n  RGBA8\n};\n```\n\n```\n// use:\nauto colMode = ColorModes::RGBA;\n\
    ```\n\nUnder GCC we'll get:\n\n```\nwarning: 'RGBA' is deprecated: use RGBA8\n\
    [-Wdeprecated-declarations]\n```\n\n# Extra Info\n\nThe change was described in\
    \ N4266¹⁰(wording) and N4196¹¹(reasoning).\n\n# Ignore Unknown Attributes\n\n\
    The feature is mostly for clarification.\n\nBefore C++17, if you tried to use\
    \ some compiler-specific attribute, you might even get an error when compiling\
    \ in another compiler that doesn't support it. Now, the compiler omits the attribute\
    \ specification and won't report anything (or just a warning). This wasn't mentioned\
    \ in the Standard, and it needed clarification.\n\n¹⁰https://wg21.link/n4266\n\
    ¹¹https://wg21.link/n4196"
  - "[PAGE 96]\n\n// compilers which don't\n// supportCompilerSpecificNamespace will\
    \ ignore this attribute\n[[MyCompilerSpecificNamespace::do_special_thing]];\n\
    void foo();\n\nFor example in GCC 7.1 there's a warnings:\n\nwarning: 'MyCompilerSpecificNamespace::do_special_thing'\n\
    scoped attribute directive ignored [-Wattributes]\nvoid foo();\n\n# Extra Info\n\
    \nThe change was described in P0283R12(wording) and P0283R11(reasoning).\n\n#\
    \ Using Attribute Namespaces Without Repetition\n\nThe feature simplifies the\
    \ case where you want to use multiple attributes, like:\n\n```\nvoid f() {\n \
    \ [[rpr::kernel, rpr::target(cpu,gpu)]] // repetition\n  doTask();\n}\n```\n\n\
    Proposed change:\n\n```\nvoid f() {\n  [[using rpr: kernel, target(cpu,gpu)]]\n\
    \  doTask();\n}\n```\n\nThat simplification might help when building tools that\
    \ automatically translate annotated code of that type into different programming\
    \ models.\n\n# Extra Info\n\nThe change was described in P0028R4¹.\n\n¹¹²https://wg21.link/p0283r2\n\
    ¹¹³https://wg21.link/p0283r1\n¹⁴http://wg21.link/p0028r4"
  - '[PAGE 97]


    # Section Summary


    Attributes available in C++17:


    | Attribute | Description |

    |---|---|

    | [[noreturn]] | a function does not return to the caller |

    | [[carries_dependency]] | extra information about dependency chains |

    | [[deprecated]] | an entity is deprecated |

    | [[deprecated("reason")]] | provides additional message about the deprecation
    indicates a potential fall-through in a switch statement |

    | [[fallthrough]] | a warning is generated if the return value is discarded |

    | [[maybe_unused]] |


    Each compiler vendor can specify its syntax for attributes and annotations. In
    Modern C++, the ISO Committee tries to extract common parts and standardise it
    as [[attributes]].


    There''s also a relevant quote from Bjarne Ststrup''s C++11 FAQ about suggested
    use:


    > There is a reasonable fear that attributes will be used to create dialects.
    The recommendation is to use attributes to only control things that do not affect
    the meaning of a program but might help detect errors (e.g. [[noreturn]]) or help
    optimisers (e.g. [[carries_dependency]]).


    # Compiler support


    | Feature | GCC | Clang | MSVC | C++ Builder |

    |---|---|---|---|---||

    | [[fallthrough]] | 7.0 | 3.9 | VS 2017 15.5 | 10.3 Rio |

    | [[nodiscard]] | 7.0 | 3.9 | VS 2017 15.3 | 10.3 Rio |

    | [[maybe_unused]] | 7.0 | 3.9 | VS 2017 15.3 | 10.3 Rio |

    | Attributes for namespaces and enumerators | 4.9(namespaces)/6(enums) | 3.4 |
    VS 2015 14.0 | 10.3 Rio |

    | Ignore unknown attributes | yes | 3.9 | VS 2015 14.0 | 10.3 Rio |

    | Using attribute namespaces without repetition | 7.0 | 3.9 | VS 2017 15.3 | 10.3
    Rio |


    ```

    http://stroustrup.com/C++11FAQ.html#attributes

