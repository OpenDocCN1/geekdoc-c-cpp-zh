  - '[PAGE 68]


    # Template Argument Deduction for Class Templates


    C++17 filled a gap in the deduction rules for templates. Now, the template argument
    deduction can occur for class templates and not just for functions. That also
    means a lot of your code that uses make_Type functions can now be removed.


    For instance, to create a std::pair object, it was usually more comfortable to
    write:


    ```

    auto myPair = std::make_pair(42, "hello world");

    ```


    Rather than:


    ```

    std::pair<int, std::string> myPair(42, "hello world");

    ```


    Because C++17, the conformant compiler will nicely deduce the tion of function
    template arguments and there''s no need to write:


    ```

    auto myPair = std::make_pair<int, std::string>(42, "hello world");

    ```


    Now, since C++17, the conformant compiler will nicely deduce the template parameter
    types for class templates too!


    The feature is called "Class Template Argument Deduction" or CTAD in short.


    In our example, you can now write:


    ```

    using namespace std::string_literals;

    std::pair myPair(42, "hello world"); // deduced automatically

    ```


    CTAD also works with copy initialisation and when allocating memory through new():


    ```

    auto otherPair = std::pair(42, "Hello"s); // also deduced

    auto ptr = new std::pair(42, "World"s); // for new

    ```'
  - '[PAGE 69]


    # Templates


    CTAD can substantially reduce complex constructions like:


    ```

    // lock guard;

    std::shared_timed_mutex mut;

    std::lock_guard<std::shared_timed_mutex> lck(mut);


    // array;

    std::array<int, 3> arr {1, 2, 3};

    ```


    Can now become:


    ```

    std::shared_timed_mutex mut;

    std::lock_guard lck(mut);

    std::array arr { 1, 2, 3 };

    ```


    Note, that partial deduction cannot happen, you have to specify all the template
    parameters or none:


    ```

    std::tuple t(1, 2, 3);                   // OK: deduction

    std::tuple<int,int,int> t(1, 2, 3);     // OK: all arguments are provided

    std::tuple<int> t(1, 2, 3);                // Error: partial deduction

    ```


    With this feature, a lot of make_Type functions might not be needed - especially
    those that "emulate" deduction for classes.


    Still, there are factory functions that do additional work. For example, std::make_shared
    -n it only creates the shared_ptr, and the pointed object are allocated in one
    memory region:


    ```

    // control block and int might be in different places in memory

    std::shared_ptr<int> p(new int{10});

    ```


    ```

    // the control block and int are in the same contiguous memory region

    auto p2 = std::make_shared<int>(10);

    ```


    How does template argument deduction for classes work?


    Let’s enter the “Deduction Guides” area.'
- md: "\n# Deduction Guides\n\nThe compiler uses special rules called “Deduction Guides”\
    \ to work out parameter types.\nThere are two types of guides: compiler-generated\
    \ (implicitly generated) and user-defined.\nTo understand how the compiler uses\
    \ guides, let's look at a simplified deduction guide¹\nstd::array;\n\n```cpp\n\
    template<typename T, typename... U>\narray(T, U...) ->\narray<enable_if_t<is_same_v<T,\
    \ U...>,>, 1 + sizeof...(U)>;\n```\n\nThe syntax looks like a template function\
    \ with a trailing return type. The compiler treats “imaginary” function as a candidate\
    \ for the parameters. If the pattern matches, the found types are returned from\
    \ the deduction.\nIn our case when you write:\n\n```cpp\nstd::array arr{1, 2,\
    \ 3, 4};\n```\n\nThen, assuming T and U... are arguments of the same type, we\
    \ can build up an array object of the type std::array<int, 4>.\nIn most cases,\
    \ you can rely on the compiler to generate automatic deduction guides. They will\
    \ be created for each constructor (also copy/move) of the primary class template.\
    \ Please note that classes which are specialised or partially specialised won't\
    \ work here.\nAs mentioned, you might also write custom deduction guides. A classic\
    \ example is a deduction of std::string rather than const char*:\n\n```cpp\ntemplate<typename\
    \ T> struct MyType {\nT str;\n};\n```\n\n```cpp\n// custom deduction guide\nMyType(const\
    \ char *) -> MyType<std::string>;\nMyType t{\"Hello World\"}; // deduces std::string\n\
    ```\n\nWithout the custom deduction T would be deduced as const char*.\n\nAnother\
    \ example of custom deduction guide comes from the overload pattern:\n\n```cpp\n\
    template<class... Ts>\nstruct overload : Ts... { using Ts::operator()... };\n\
    ```\n\n```cpp\ntemplate<class... Ts>\nload(Ts...) -> overload<Ts...>; // deduction\
    \ guide\n```\n\nThe overload class inherits from other classes Ts... and then\
    \ exposes their operator().\nThe custom deduction guide is used here “transform”\
    \ a list of callable types into the list of classes that we can derive from.\n\
    \n# CTAD Limitations\n\nIn C++17 template argument deduction for classes has the\
    \ following limitations:\n\n- it doesn't work with template aggregate types\n\
    - the deduction doesn't include inheriting constructors\n- it doesn't work with\
    \ template aliases\n\nThose limitations will be removed in C++20 through the already\
    \ accepted proposal: P1021.\n\n# Extra Info\n\nThe CTAD feature was proposed in:\
    \ P0091R3 and P0433 - Deduction Guides in the Standard Library.\n\nPlease note\
    \ that while a compiler might declare full support for Template Argument Deduction\
    \ for Class Templates, its corresponding STL implementation might still lack of\
    \ custom deduction guides for some STL types. See the Compiler Support section\
    \ at the end of the chapter.\n\n> ²Read more about this pattern in the chapter\
    \ about std::variant, section related to std::visit()\n³https://wg21.link/P1021\n\
    ⁴https://wg21.link/p0091r3\n⁵https://wg21.link/p0433\n\n# Fold Expressions\n\n\
    C++11 introduced variadic templates, which is a powerful feature, especially if\
    \ you want to work with a variable number of input template parameters to a function.\
    \ For example, previously (pre C++11) you had to write several different versions\
    \ of a template function (one for one parameter, another for two parameters, another\
    \ for three params...).\n\nStill, variadic templates required some additional\
    \ code when you wanted to implement \"recursive\" functions like sum, all. You\
    \ had to specify rules for the recursion.\n\nFor example:\n\n```cpp\nauto SumCpp11()\
    \ {\n    return 0;\n}\n\ntemplate<typename ...Args>\nauto SumCpp11(T1 s, T...\
    \ ts) {\n    return s + SumCpp11(ts...);\n}\n```\n\nAnd with C++17 we can write\
    \ much simpler code:\n\n```cpp\ntemplate<typename ...Args> auto sum(Args ...args)\
    \ {\n    return (args + ... + 0);\n}\n\n// or even:\ntemplate<typename ...Args>\
    \ auto sum2(Args ...args) {\n    return (args + ...);\n}\n```\n\nThe following\
    \ variations of fold expressions* with binary operators (op) exist:\n\n| Expression\
    \ | Name | Expansion |\n|---|---|---|\n| (... op e) | unary left fold | ((e1 op\
    \ e2) ... opN) |\n| (init op ... e) | binary left fold | (((init e1) op e2) ...\
    \ opN) |\n| (e op ... op) | unary right fold | e op (... (eN-1 op eN)) |\n| (e\
    \ op ... init) | binary right fold | e op (... (eN-1 op init)) |\n\n> *https://en.cppreference.com/w/cpp/fold_expressions\
    \ op is any of the following binary operators: + - * / % << >> += *= %= &= |=\
    \ <= != >=. In a binary fold, both ops must be the same.\nFor example, when you\
    \ write:\n\n```cpp\ntemplate<typename...Args> auto sum2(Args...args) {\n    return\
    \ (args + ...); // unary fold over '+'\n}\n\nauto value = sum2(1, 2, 3, 4); //\
    \ The template function is expanded into: auto value = 1 + (2 + (3));\n\nAlso\
    \ by default we get the following values for empty packs:\n\n| Operator | default\
    \ value |\n|---|---|\n| && | true |\n| || | false |\n| , | ill-formed code |\n\
    \nThat's why you cannot call sum2() without any parameter list, the unary fold\
    \ operator doesn't have any default value.\n\n# More Examples\n\nHere's a quite\
    \ nice implementation of folds using P0036R0:\n\n```cpp\ntemplate<typename ...Args>\n\
    void FoldPrint(Args&&... args) {\n  (std::cout << ... << std::forward<Args>(args));\n\
    }\n\nFoldPrint(\"hello\", 10, 30);\n```\n\nHowever, above FoldPrint will print\
    \ arguments one by one, without any separator. For the above call, you'll see\
    \ \"hello1030\". If you want separators and more formatting options, you have\
    \ to alter the technique and use fold over comma:\n\n```cpp\ntemplate<typename\
    \ ...Args>\nvoid FoldSeparate(Args&&... args) {\n  auto separateLine = [](const\
    \ auto& v) {\n    std::cout << v << '\\n';\n  };\n  (..., separateLine(std::forward<Args>(args)));\
    \ // over comma operator\n}\n```\n\nThe technique with fold over the comma operator\
    \ is handy. Another example of it might be a special version of push_back:\n\n\
    ```cpp\ntemplate<typename ...Args>\nvoid push_back_vec(std::vector<T>& v, Args&&...\
    \ args) {\n  (v.push_back(std::forward<Args>(args)), ...);\n}\n```\n\n```cpp\n\
    std::vector<float> vf;\npush_back_vec(vf, 10.5f, 0.7f, 1.1f, 0.8f);\n```\n\nIn\
    \ general, fold expression allows you to write cleaner, shorter and probably more\
    \ comfortable to read the code.\n\n> Extra Info\nThe change was proposed in: N4295\
    \ and P0036R0.\nhttps://wg21.link/n4295\nhttps://wg21.link/p0036r0\n\n# if constexpr\n\
    \nThis is a big one! The compile-time if for C++!!\n\nThe feature allows you to\
    \ discard branches of an if statement at compile-time based on constant expression\
    \ condition.\n\n```cpp\nif constexpr (cond)\n    statement1; // Discarded if cond\
    \ is false\nelse\n    statement2; // Discarded if cond is true\n```\n\nFor example:\n\
    \n```cpp\ntemplate <typename T>\nauto get_value(T t) {\n    if constexpr (std::is_pointer_v<T>)\n\
    \        return *t;\n    else\n        return t;\n}\n```\n\nif constexpr has the\
    \ potential to simplify a lot of template code - especially when tag dispatch,\
    \ SFINAE or preprocessor techniques are used.\n\n# Why Compile Time?\n\nAt first,\
    \ you may ask, why do we need if constexpr and those complex templated expressions...\
    \ wouldn’t a regular if work?\n\nHere’s a code example:\n\n```cpp\ntemplate <typename\
    \ Concrete, typename...> Ts\nstd::unique_ptr<Concrete> constructArgs(Ts&&... params)\
    \ {\n    if (std::is_constructible_v<Concrete, Ts...>) // regular 'if'\n     \
    \   return std::make_unique<Concrete>(std::forward<Ts>(params)...);\n    else\n\
    \        return nullptr;\n}\n```\n\nThe above routine is an \"updated\" version\
    \ of std::make_unique: it returns std::unique_ptr when the parameters allow it\
    \ to construct the wrapped objects, or it returns nullptr.\n\nBelow there simple\
    \ code that tests constructArgs:\n\n```cpp\nclass Test {\npublic:\n    Test(int,\
    \ int) {}\n};\n\nint main() {\n    auto p = constructArgs<Test>(10, 10, 10); //\
    \ 3 args\n}\n```\n\nThe code tries to build Test of three parameters, but please\
    \ notice that Test has only constructor that takes two int arguments.\n\nWhen\
    \ compiling you might get a similar compiler error:\n\n> instantiation of <typename\
    \ std::MakeUniq<Tp>::__single_object\nstd::make_unique(_Args&&...) [with _Tp =\
    \ Test; _Args = {int, int, int}];\ntypeename std::MakeUniq<Tp>::__single_object\n\
    std = std::unique_ptr<Test, std::default_delete<Test>>':\n\n```cpp\nmain.cpp:8:40:\
    \ required from 'std::unique_ptr<Tp>\nconstructArgs(Ts&&...) [with Concrete =\
    \ Test; Ts = {int, int, int}]'\n```\n\nLet's try to understand this error message.\
    \ After the template deduction the compiler compiles the following code:\n"
  mdcn: "\n\n# 推导指南\n\n编译器使用一种称为“推导指南”（Deduction Guides）的特殊规则来确定参数类型。\n指南有两种类型：编译器生成的（隐式生成）和用户定义的。\n\
    为了理解编译器如何使用推导指南，让我们来看一个简化的推导指南¹\nstd::array;\n\n```cpp\ntemplate<typename T, typename...\
    \ U>\narray(T, U...) ->\narray<enable_if_t<is_same_v<T, U...>,>, 1 + sizeof...(U)>;\n\
    ```\n\n这种语法看起来像是一个带有尾随返回类型的模板函数。编译器将“虚拟”函数视为参数的候选。如果模式匹配，则从推导中返回找到的类型。\n在我们案例中，当你写下：\n\
    \n```cpp\nstd::array arr{1, 2, 3, 4};\n```\n\n那么，假设 T 和 U... 是相同类型的参数，我们可以构建一个类型为\
    \ `std::array<int, 4>` 的数组对象。\n在大多数情况下，你可以依赖编译器生成自动推导指南。它们会为主类模板的每个构造函数（以及拷贝/移动构造函数）创建。请注意，特化或部分特化的类在这里不起作用。\n\
    如前所述，你可能还会编写自定义的推导指南。一个经典的例子是推导 `std::string` 而不是 `const char*`：\n\n```cpp\ntemplate<typename\
    \ T> struct MyType {\nT str;\n};\n```\n\n```cpp\n// 自定义推导指南\nMyType(const char\
    \ *) -> MyType<std::string>;\nMyType t{\"Hello World\"}; // 推导出 std::string\n\
    ```\n\n如果没有这个自定义推导，T 将被推导为 `const char*`。\n\n另一个自定义推导指南的例子来自重载模式：\n\n```cpp\n\
    template<class... Ts>\nstruct overload : Ts... { using Ts::operator()... };\n\
    ```\n\n```cpp\ntemplate<class... Ts>\nload(Ts...) -> overload<Ts...>; // 推导指南\n\
    ```\n\n该 `overload` 类继承自其他类 Ts...，然后暴露它们的 `operator()`。\n在这里，自定义推导指南用于“转换”一个可调用类型列表到我们可以派生的类列表。\n\
    \n# 类模板参数推导 (CTAD) 的限制\n\n类模板参数推导有以下限制：\n\n- 不适用于聚合类型（aggregate types）\n- 不包含继承构造函数\n\
    - 不适用于类型别名\n\n这些限制将在 C++20 中已接受的提案 P1021 中移除。\n\n# 额外信息\n\nCTAD 特性是在 P0091 和 P0433\
