    \n我们可以认为，将更多代码放入初始化部分会降低代码的可读性，请注意此类情况。\n\n# 额外信息\n\n该更改提议源于：P0305R1。\n\n# 内联变量\n\
    \n随着 C++11 引入的非静态数据成员初始化（Non-Static Data Member Initialisation），你现在可以在一个地方声明并初始化成员变量：\n\
    \n```cpp\nclass User {\n    int _age{};\n    std::string _name{\"unknown\"};\n\
    };\n```\n\n然而，对于静态变量（或常量静态变量），你需要在实现文件中进行声明，然后定义。\n\nC++11 的 `constexpr` 关键字允许你在一个地方声明并定义静态变量，但它仅限于常量表达式。\n\
    \n以前，只有方法/函数可以被指定为内联（inline），但现在你可以在头文件中对变量执行相同的操作。\n\n根据提议 [P0386R2]*：\n\n> 内联声明的变量具有与内联声明的函数相同的语义：它可以在多个翻译单元中以相同的方式进行定义，必须在使用它的每个翻译单元中都被定义，并且程序的行为就像恰好存在一个变量。\n\
    \n例如：\n\n```cpp\n// 在头文件内部：\nstruct MyClass {\n    static const int sValue;\n\
    };\n```\n\n```cpp\n// 随后在同一个头文件中：\ninline int const MyClass::sValue = 777;\n```\n\
    \n或者直接在一个地方进行声明和定义：\n\nhttp://wg21.link/p0386r2\n\n```cpp\nstruct MyClass {\n\
    \    inline static const int sValue = 777;\n};\n```\n\n此外，注意 `constexpr` 变量是隐式内联的，因此不需要使用\
    \ `constexpr inline myVar = 10`。\n\n内联变量比 `constexpr` 变量更灵活，因为它不需要用常量表达式初始化。例如，你可以用\
    \ `rand()` 初始化内联变量，但 `constexpr` 变量无法做到。\n\n# 如何简化代码？\n\n许多仅头文件（header-only）库可以限制黑科技（如使用内联函数模板）的数量，并切换到使用内联变量。\n\
    \n例如：\n\n```cpp\nclass MyClass {\n    static inline int Seed(); // 静态方法\n};\n\
    inline int MyClass::Seed() {\n    static const int seed = rand();\n    return\
    \ seed;\n}\n```\n\n可以改为：\n\n```cpp\nclass MyClass {\n    static inline int seed\
    \ = rand();\n}\n```\n\nC++17 保证 `MyClass::seed` 在所有编译单元具有相同的值（在运行时生成）！\n\n> 额外信息\n\
    该更改提议源于：P0386R2。\n\n# constexpr Lambda 表达式\n\nLambda 表达式是在 C++11 中引入的，从那时起它们已成为现代\
    \ C++ 不可缺的一部分。C++11 的另一个显著特性是 `constexpr` 限定符，用于表示函数或值可以在编译时计算。在 C++17 中，这两个元素允许共存。\n\
    \n在 C++17 中，如果 Lambda 表达式在常量文中被调用，则必须是 `constexpr`：\n\n```cpp\nconstexpr auto\
    \ square = [](int n) { return n * n; };\nstatic_assert(square(3) == 9);\n```\n\
    \n`constexpr` Lambda 表达式的限制如下：\n\n- 它们不能是虚函数\n- 它们的返回类型应该是常量类型\n- 它们的参数类型应该是常量类型\n\
    - 它们不能包含：`asm` 语句、`try` 块或静态存储期\n\n在实践中，如果 Lambda Lambda 是 constexpr，可以使用 `constexpr`\
    \ 关键字。\n\n该更改提议源于：P0386。\n\n# 在 Lambda 中捕获 this\n\n当你在类内部编写 Lambda 时，可以引用成员变量。例如：\n\
    \nGeneral Features/capture_this.cpp\n\n```cpp\nstruct Test {\n    void foo() {\n\
    \        std::cout << m_str << '\\n';\n        auto addLambda = [this]() { m_str\
    \ += \"World\"; };\n        addLambda();\n        std::cout << m_str << '\\n';\n\
    \    }\n\n    std::string m_str{\"Hello \"};\n};\n```\n\n在 `auto addLambda = [this]()\
    \ {}` 这一行中，我们捕获了此指针。请注意 `[=]` 建议捕获值，但如果你在 Lambda 表达式中访问成员，它会隐式通过此指针进行捕获。因此，一旦超过了对象的生命周期，该指针就会变成悬指针。\n\
    \n在 C++17 中，你可以使用 `[*this]` 来捕获整个对象：\n\n```cpp\nauto lam = [*this]() { std::cout\
    \ << s; };\n```\n\n在 C++14 中，使代码安全的办法是捕获 `[*this]`：\n\n```cpp\nauto lam = [self=*this]\
    \ { std::cout << self.s; };\n```\n\n# 从方法返回 Lambda\n\n```cpp\n#include <iostream>\n\
    \nstruct Baz {\n    auto foo() {\n        return [=] { std::cout << s << '\\n';\
    \ };\n    }\n    std::string s;\n};\n\nint main() {\n    auto f1 = Baz{\"ala\"\
    }.foo();\n    f1();\n}\n```\n\n代码声明了一个 Baz 对象并调用了 `foo()`。请注意 `foo()` 返回了一个捕获块\
    \ `[=]`，（`[=]` 建议捕获值，但如果你在 Lambda 表达式中访问成员，它会隐式通过此指针进行捕获）。因此，一旦超过了 Baz 对象的生命周期，该指针就会变成悬指针。\n\
    \n在 C++17 中，你可以使用 `[*this]` 来捕获整个对象。\n\n捕获 this 当 Lambda 的生命周期超过对象本身时可能会变得棘手。这可能发生在使用异步调用或多线程时。\n\
    \n在 C++20 中（参见 P0806¹），如果你在方法中捕获 `[=]`，你还会看到额外的警告。这种表达式捕获此指针，而这可能不是你想要的。\n\n"
