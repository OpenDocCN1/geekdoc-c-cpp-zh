    \  - 如何并行化 CSV Reader\n- 附录 A - 编译器支持\n- 附录 B - 资源与链接\n\n第一部分关于语言特性较短，将让你快速浏览最重的变化。你可以按照喜欢的任何顺序阅读。\n\
    \n第二部分（仅限完整版）描述了添加到标准库中的系列新类型和实用工具。这些辅助类型为 C++ 代码创建了潜在的新词汇：例如当你使用 optional、any\
    \ 或 string_view 时。此外，你还拥有了强大的能力，特别是并行算法和标准文件系统的形式。此部分的许多示例将使用 C++17 的许多其他特性。\n\
    \n第三部分（仅限完整版）汇总了语言的所有更改，并展示了同时使用许多新特性的示例。你将看到关于重构、使用新模板技术简化代码以及与并行 STL 和文件系统工作的讨论。虽然第一、二部分也可以作为单个更改的参考，但第三部分展示了更多结合许多特性的大型\
    \ C++17 模式。\n\n本书的一个显著优势是，对于每个新特性，你都会获得有关编译器支持和当前实现状态的信息。你能够检查最流行的编译器（MSVC、GCC\
    \ 或 Clang）的特定版本是否实现了它。本书还提供了关于如何在你当前的代码库中应用技术的实用提示。\n\n# 读者反馈\n\n如果你发现错误、拼写错误、语法错误……或任何其他需要修正的内容（尤其是逻辑问题！），请向\
