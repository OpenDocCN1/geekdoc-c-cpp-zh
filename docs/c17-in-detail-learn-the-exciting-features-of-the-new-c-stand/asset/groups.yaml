    };\n```\n\nS s;\nauto [a, b, c] = s;\n\nHowever, if you have a custom type (with\
    \ private members), then it’s also possible to override get<N> functions so that\
    \ structured binding can work. Here’s some code to demonstrate this idea:"
  - "[PAGE 81]\n\n```\nclass MyClass {\npublic:\n    int GetA() const { return a;\
    \ };n    float GetB() const { return b; };\n\nprivate:\n    int a;\n    float\
    \ b;\n};\n```\n\n```\ntemplate<std::size_t I> auto get(MyClass& c) {\n    if constexpr\
