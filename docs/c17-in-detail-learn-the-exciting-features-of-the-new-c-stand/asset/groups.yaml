    \n- 允许返回不可移动/不可拷贝的对象——提高代码的可移植性，因为每个符合标准的编译器都支持相同的规则\n- 支持“按值返回”模式而非使用参数\n- 提高性能\n\
    \n下面是一个基于 P0135R0 的不可移动/拷贝类型示例：\n\nChapter Clarification/copy_elision_non_movable.cpp\n\
