    operator<<((operator<<(std::cout, a()), b())), c);


    Before C++17, a(), and c() could be evaluated in any order. In C++17, a() will
    be evaluated first, then b() and c().


    Here are more rules described in the paper P0145R3:


    +   the following expressions are evaluated in the order a, then b:


    1. a.b

    2. a->*b

    3. a->*b

    4. a(b1, b2, b3) // b1, b2, b3 - in any order

    5. b @= // ''@'' means any operator

    6. a[b]

    7. a << b

    8. a >> b


    If you''re not sure how your code might be evaluated, it''s better to make it
    simple and split it into several clear statements. You can find some guides in
    the Core C++ Guidelines, for example ES.44 and ES.44.


    # Extra Info


    The change was proposed in: P0145R3.


    ^1https://wg21.link/p0145r3

    2http://isocpp.github.io/CppCoreGuidelines/Res-order

    3http://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#es44-depend-on-order-of-evaluation-of-function-arguments

    4https://wg21.link/p0145r3'
