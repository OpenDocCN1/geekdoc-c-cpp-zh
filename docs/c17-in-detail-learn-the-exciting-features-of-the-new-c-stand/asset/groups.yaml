    \ the chapter Structured Bindings - the section about custom get<N> specialisations.\
    \ You can also see the following article: Simplify code with constexpr in C++17\n\
    \n# Declaring Non-Type Template Parameters With auto\n\nThis is another part of\
    \ the strategy to use auto everywhere. With C++11 and C++14, you can use it to\
    \ deduce variables or return types automatically, yet there are also generic lambdas.\
