  - "[PAGE 59]\n\n# constexpr Lambda Expressions\n\nLambda expressions were introduced\
    \ in C++11, and since that moment they've become an essential part of modern C++.\
    \ Another significant feature of C++11 is the constexpr specifier, which is used\
    \ to express that a function or value can be computed at compiletime. In C++17,\
    \ the two elements are allowed to exist together, so your lambda can be invoked\
    \ in a constant expression context.\n\nIn C++14 the following code doesn't compile,\
    \ but works with C++17:\n\n```\nChapter General Language Features/lambda_square.cpp\n\
    int main () {\n    constexpr auto SquareLambda = [] (int n) { return n*n; };\n\
    static_assert(SquareLambda(3) == 9, \"\");\n}\n```\n\nSince C++17 lambda expressions\
    \ (their call operator operator ()) that follow the rules of standard constexpr\
    \ functions are implicitly declared as constexpr.\n\nWhat are the limitations\
    \ of constexpr functions? Here's a summary (from 10.1.5 constexpr specifier [dcl.constexpr]¹¹⁰):\n\
    \n+   * they cannot be virtual\n* their return type should be a literal type\n\
    * their parameter types should be a literal type\n* their functions cannot contain:\
    \ asm definition, a goto statement, try-block, or a variable that is a non-literal\
    \ type or static or thread storage duration\n\nIn practice, in C++17, if you want\
    \ your function or lambda to be executed at compile, the body of this function\
    \ shouldn't invoke any code that is not constexpr. For example, you cannot allocate\
    \ memory dynamically or throw exceptions.\n\nconstexpr lambdas are also covered\
    \ in the Other Changes Chapter and in a free ebook: C++ Lambda Story¹¹¹.\n\n#\
    \ Extra Info\n\nThe change was proposed in: P0170¹⁰.\n\n¹⁰https://timsong-cpp.github.io/cpppp/n4659/dcl.constexpr#3\n\
    ¹¹https://leanpub.com/cppplamba\n¹¹https://wg21.link/p0170"
  - "[PAGE 60]\n\n# Capturing [*this] in Lambda Expressions\n\nWhen you write a lambda\
    \ inside a class method, you can reference a member variable by capturing this.\
    \ For example:\n\nChapter General Language Features/capture_this.cpp\n\n```\n\
    struct Test {\n    void foo() {\n        std::cout << m_str << '\\\\n';\n    \
    \    auto addWordLambda = [this]() { m_str += \"World\"; };\n        addWordLambda();\n\
    \        std::cout << m_str << '\\\\n';\n    }\n\n    std::string m_str {\"Hello\
    \ \"};\n};\n```\n\nIn the line with auto addWordLambda = [this](){ } we capture\
    \ this pointer and later we can access m_str.\n\nPlease notice that we captured\
    \ this by value... to a pointer. You have access to the member variable, not its\
    \ copy. The same effect happens when you capture by [] or [&]. That's why when\
    \ you call foo() on some Test object then you'll see the following output:\n\n\
    Hello\nHello World\n\nfoo() prints m_str two times. The first time we see \"Hello\"\
    , but the next time it's \"Hello World\" because the lambda addWordLambda changed\
    \ it.\n\nHow about more complicated cases? Do you know what will happen with the\
    \ following code?"
  - "[PAGE 61]\n\n# Returning a Lambda From a Method\n\n#include <iostream>\n\n```\n\
    struct Baz {\n    auto foo() {\n        return [=] { std::cout << s << '\\n';\
    \ };\n    }\n    std::string s;\n};\n\nint main() {\n    auto f1 = Baz(\"ala\"\
    ).foo();\n    f1();\n}\n```\n\nThe code declares a Baz object and invokes foo().\
    \ Please note that foo() returns a lambda that captures a block [=] suggests we\
    \ capture variables by value, but if you access members of a class in a lambda\
    \ expression, then it does this implicitly via this pointer. So we captured a\
    \ copy of this pointer, which is a dangling pointer as soon as we exceed the lifetime\
    \ of the Baz object.\n\nIn C++17 you can write [*this] and that will capture a\
    \ copy of the whole object.\n\n```\nauto lam = [*this]() { std::cout << s; };\n\
    ```\n\nIn C++14, the only way to make the code safe is to capture [*this]:\n\n\
    ```\nauto lam = [self=*this] { std::cout << self.s; };\n```\n\nCapturing this\
    \ might get tricky when a lambda can outlive the object itself. This might happen\
    \ when you use async calls or multithreading.\nIn C++20 (see P0806¹) you'll also\
    \ see an extra warning if you capture [=] in a method. Such expression capture\
    \ this pointer, and it might not be exactly what you want.\n\n> Extra Info\nnThe\
    \ change was proposed in: P0018¹."
- md: "\n# Nested Namespaces\n\nNamespaces allow grouping types and functions into\
    \ separate logical units.\n\nFor example, it's common to see that each type or\
    \ function from a library XY will be stored\nin a namespace xy. Like in the below\
    \ case, where there is SuperCompressionLib and it\nexposes calling Compress()\
    \ and Decompress():\n\n```\nnamespace SuperCompressionLib {\n    bool Compress();\n\
    \    bool Decompress();\n}\n```\n\nThings get interesting if you have two or more\
    \ nested namespaces.\n\n```\nnamespace MySuperCompany {\n    namespace SecretProject\
    \ {\n        namespace SafetySystem {\n            class SuperArmor {\n      \
    \          // ...\n            }\n            class SuperShield {\n          \
    \      // ...\n            }\n        } // SafetySystem\n    } // SecretProject\n\
    } // MySuperCompany\n```\n\nWith C++17 nested namespaces can be written more compactly:\n\
    \n```\nnamespace MySuperCompany::SecretProject::SafetySystem {\n    class SuperArmor\
    \ {\n        // ...\n    }\n    class SuperShield {\n        // ...\n    }\n}\n\
    ```\n\nSuch syntax is comfortable, and it will be easier to use for developers\
    \ that have experience\nin languages like C# or Java.\n\n## General Language Features\n\
    \nIn C++17 also the Standard Library was \"compacted\" in several places by using\
    \ the new nested namespace feature:\n\nFor example, for regex.\n\nIn C++17 it's\
    \ defined as:\n\n```\nnamespace std::regex_constants {\n  typedef T1 syntax_option_type;\n\
    \  // ...\n}\n```\n\nBefore C++17 the same was declared as:\n\n```\nnamespace\
    \ std {\n  namespace regex_constants {\n    typedef T1 syntax_option_type;\n \
    \   // ...\n  }\n}\n```\n\nThe above nested declarations appear in the C++ Specification,\
    \ but it might look different in an STL implementation.\n\n## Extra Info\n\nThe\
    \ change was proposed in: N4230¹⁵.\n\n# __has_include Preprocessor Expression\n\
    \nIf your code has to work under two different compilers, then you might experience\
    \ two deffer sets of available features and platform-specific changes.\n\nIn C++17\
    \ you can use __has_include preprocessor constant expression to check if a given\
    \ header exists:\n\n```cpp\n#if __has_include(<header_name>)\n#if __has_include(\"\
    header_name\")\n```\n\n__has_include was available in Clang as an extension for\
    \ many years, but now it was added to the Standard. It's a part of \"feature testing\"\
    \ that helps you to check if a particular C++ feature or a header is available.\
    \ If a compiler supports this macro, then it's accessible even without the C++17\
    \ flag, that's why you can check for a feature also if you are in C++11, or C++14\
    \ \"mode\".\n\nAs an example, we can test if a platform has <charconv> header\
    \ that declares C++17's low-level conversion routines:\n\nChapter General Language\
    \ Features/has_include.cpp\n\n```cpp\n#if defined __has_include\n# if __has_include(<charconv>)\n\
    \    define has_charconv 1\n    include <charconv>\n#endif\n#endif\n```\n\n```cpp\n\
    std::optional<int> ConvertToInt(const std::string& str) {\n    int value = {};\n\
    #ifdef has_charconv\n    const auto last = str.data() + str.size();\n    const\
    \ auto res = std::from_chars(str.data(), last, value);\n    if (res.ec == std::errc{}\
    \ && res.ptr == last)\n        return value;\n#else\n    // alternative implementation...\n\
    #endif\n\n    return std::nullopt;\n}\n```\n\n## General Language Features\n\n\
    In the above code, we declare has_charconv based on the __has_include condition.\
    \ If the header is not there, we need to provide an alternative implementation\
    \ for ConvertToInt. You can check this code using GCC 7.1 and GCC 9.1 and see\
    \ the effect as GCC 7.1 doesn't expose the charconv header.\n\nNote: In the above\
    \ code we can write:\n\n```cpp\n#if __has_include && __has_include(<charconv>)\n\
    ```\n\nAs in older compilers - that don't support __has_include we'd get a compile\
    \ error. The compiler will complain that since since __has_include is not defined\
    \ and the whole expression is wrong.\n\nAnother important thing to remember is\
    \ that sometimes a compiler might provide a header stub. For C++14 the __execution__\
    \ header might be present (it defines C++17 parallel algorithm execution modes),\
    \ but the whole file will be empty (due to ifdefs). If you check for this code\
    \ with __has_include and use C++14 mode, then you'll get a result.\n\n> In C++20\
    \ we've standardised feature test macros that simplify checking for various C++\
    \ parts. For example, to test std::any you can use __cpp_any, for lambda support\
    \ there's __cpp_lambdas. There's even a macro that checks for attribute support:\
    \ __has_cpp_attribute( attrib-name). GCC, Clang and Visual Studio exposes many\
    \ of the macros already, before C++20 is ready. Read more in Feature testing (C++20)\
    \ - cpppreference¹⁶\n\n__has_include along with feature test macros might greatly\
    \ simplify multiplatform code that usually needs to check for available platform\
    \ elements.\n\n## Extra Info\n\n__has_include was proposed in: P0061¹⁷.\n\n##\
    \ Compiler support\n\n| Feature | GCC | Clang | MSVC | C++ Builder |\n|---|---|---|---|---|\n\
    | Structured Binding Declarations | 7.0 | 4.0 | VS 2017 15.3 | 10.3 Rio |\n| Init-statement\
    \ for if/switch | 7.0 | 3.9 | VS 2017 15.3 | 10.3 Rio |\n| Inline variables |\
    \ 7.0 | 3.9 | VS 2017 15.5 | 10.3 Rio |\n| constexpr Lambda Expressions | 7.0\
    \ | 5.0 | VS 2017 15.3 | 10.3 Rio |\n| Lambda Capture of *this | 7.0 | 3.9 | VS\
    \ 2017 15.3 | 10.3 Rio |\n| Nested namespaces | 6.0 | 3.6 | VS 2015 | 10.3 Rio\
    \ |\n| has_include | 5 | Yes | VS 2017 15.3 | 10.3 Rio |\n\n## 5. Templates\n\n\
    Do you work with templates?\n\nIn C++17 the answer is \"YES\", because in this\
    \ chapter you'll learn:\n\n- Template argument deduction for classes\n- Fold expressions\n\
    - constexpr\n- C++17 introduced many enhancements\n\n## Template Deduction for\
    \ Classes\n\nCTAD can substantially reduce complex constructions like:\n\n```cpp\n\
    // lock guard\nstd::shared_timed_mutex mut;\nstd::lock_guard<std::shared_timed_mutex>\
    \ lck(mut);\n\n// array\nstd::array<int, 3> arr {1, 2, 3};\n```\n\nCan now become:\n\
    \n```cpp\nstd::shared_timed_mutex mut;\nstd::lock_guard lck(mut);\nstd::array\
    \ arr { 1, 2, 3 };\n```\n\nNote, that partial deduction cannot happen, you have\
    \ to specify all the template parameters or none:\n\n```cpp\nstd::tuple t(1, 2,\
    \ 3);                   // OK: deduction\nstd::tuple<int,int,int> t(1, 2, 3);\
    \     // OK: all arguments are provided\nstd::tuple<int> t(1, 2, 3);         \
    \       // Error: partial deduction\n```\n\nWith this feature, a lot of make_Type\
    \ functions might not be needed - especially those that \"emulate\" deduction\
    \ for classes.\n\nStill, there are factory functions that do additional work.\
    \ For example, std::make_shared -n it only creates the shared_ptr, and the pointed\
    \ object are allocated in one memory region:\n\n```cpp\n// control block and int\
    \ might be in different places in memory\nstd::shared_ptr<int> p(new int{10});\n\
    ```\n\n```cpp\n// the control block and int are in the same contiguous memory\
    \ region\nauto p2 = std::make_shared<int>(10);\n```\n\n## Templates\n\nThe feature\
    \ is called \"Class Template Deduction\" or CTAD in short.\n\nIn our example,\
    \ you can now write:\n\n```cpp\nusing std::string_literals;\nstd::pair(42, \"\
    hello world\"); // deduced\n```\n\nCTAD also works with copy initialisation and\
    \ when allocating memory through new():\n\n```cpp\nauto otherPair = std::pair(42,\
    \ \"Hello\"s); // also deduced\nauto ptr = new std::pair(42, \"World\"s); // for\
    \ new\n```\n"
  mdcn: "\n\n# 嵌套命名空间 (Nested Namespaces)\n\n命名空间允许将类型和函数分组到独立的逻辑单元中。\n\n例如，通常可以看到库\
    \ XY 的每个类型或函数都存储在命名空间 xy 中。如下例所示，其中有一个 `SuperCompressionLib`，它暴露了调用 `Compress()`\
    \ 和 `Decompress()` 的方法：\n\n```\nnamespace SuperCompressionLib {\n    bool Compress();\n\
    \    bool Decompress();\n}\n```\n\n如果你有两个或多个嵌套的命名空间，情况就会变得有趣起来。\n\n```\nnamespace\
    \ MySuperCompany {\n    namespace SecretProject {\n        namespace SafetySystem\
    \ {\n            class SuperArmor {\n                // ...\n            }\n \
    \           class SuperShield {\n                // ...\n            }\n     \
    \   } // SafetySystem\n    } // SecretProject\n} // MySuperCompany\n```\n\n在 C++17\
    \ 中，嵌套命名空间可以写得更紧凑：\n\n```cpp\nnamespace MySuperCompany::SecretProject::SafetySystem\
    \ {\n    class SuperArmor {\n        // ...\n    }\n    class SuperShield {\n\
    \        // ...\n    }\n}\n```\n\n这种语法非常简洁，并且对于具有 C# 或 Java 等语言经验的开发者来说会更容易使用。\n\
    \n## 通用语言特性 (General Language Features)\n\n在 C++17 中，标准库也通过新的嵌套命名空间功能在多个处进行了“紧凑化”：\n\
    \n例如，正则表达式（regex）。\n\n在 C++17 中，它的定义如下：\n\n```cpp\nnamespace std::regex_constants\
    \ {\n  typedef T1 syntax_option_type;\n  // ...\n}\n```\n\n在 C++17 之前，同样的声明为：\n\
    \n```cpp\nnamespace std {\n  namespace regex_constants {\n    typedef T1 syntax_option_type;\n\
    \    // ...\n  }\n}\n```\n\n上述嵌套声明出现在 C++ 规范中，但在 STL 实现中它们看起来可能有所不同。\n\n## 额外信息\
    \ (Extra Info)\n\n该更改提议：N4230¹⁵。\n\n# __has_include 预处理器表达式\n\n如果你的代码必须在两个不同的编译器下运行，那么你可能会遇到两套可用特性集和特定平台的更改。\n\
    \n在 C++17 中，你可以使用 `__has_include` 预处理器常量表达式来检查给定的头文件是否存在：\n\n```cpp\n#if __has_include(<header_name>)\n\
    #if __has_include(\"header_name\")\n```\n\n`__has_include` 多年来一直作为 Clang 的扩展可用，但现在它已被加入标准中。它是“特性测试”的一部分，可以帮助你检查特定的\
    \ C++ 特性或头文件是否可用。如果编译器支持此宏，即使没有开启 C++17 标志也可以访问，这就是为什么即使你处于 C++11 或 C++14 “模式”下也可以检查某个特性。\n\
    \n例如，我们可以测试平台是否具有 `<charconv>` 头文件，该头文件声明了 C++17 的低级转换程序：\n\nChapter General Language\
    \ Features/has_include.cpp\n\n```cpp\n#if defined __has_include\n# if __has_include(<charconv>)\n\
    \    define has_charconv 1\n    include <charconv>\n#endif\n#endif\n```\n\n```cpp\n\
    std::optional<int> ConvertToInt(const std::string& str) {\n    int value = {};\n\
    #ifdef has_charconv\n    const auto last = str.data() + str.size();\n    const\
    \ auto res = std::from_chars(str.data(), last, value);\n    if (res.ec == std::errc{}\
    \ && res.ptr == last)\n        return value;\n#else\n    // 替代实现...\n#endif\n\n\
    \    return std::nullopt;\n}\n```\n\n## 通用语言特性 (General Language Features)\n\n\
    在上述代码中，我们根据 `__has_include` 条件声明了 `has_charconv`。如果头文件不存在，我们需要为 `ConvertToInt`\
    \ 提供一个替代实现。你可以使用 GCC 7.1 和 GCC 7.1 检查此代码。\n"
