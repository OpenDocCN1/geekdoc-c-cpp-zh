- md: "\n## Part 1 - Language Features\n\nWe can say that C++ comes in two parts:\
    \ The Language and The Standard Library. The first element, The Language, focuses\
    \ on the expressive code and concise syntax. The second element gives you tools,\
    \ utilities and algorithms. For example, in C++11, we get lambdas that simplified\
    \ writing short function objects. C++14 allowed 'auto' type deduction for function\
    \ return types which also shorten code and simplified code.\n\nC++17, as a major\
    \ update to the Standard, brings many amazing language elements that generally,\
    \ make the language clearer and more straightforward. For instance, you can reduce\
    \ the need to use enable_if and tag dispatching techniques by leveraging constexpr.\
    \ You can treat tuples like first class language citizens thanks to structured\
    \ bindings, rely on and understand expression evaluation order, write code that\
    \ naturally uses copy-elision mechanism, and much, much more!\n\nIn this part\
    \ you'll learn:\n\n- * What was removed from the language and what is deprecated\n\
    - How the language is more precise: for example, thanks to expression evaluation\
    \ order guarantees\n- What are new features of templates: like if or fold expressions\n\
    - What are the new standard attributes\n- How you can write cleaner and more expressive\
    \ code thanks to structured binding, inline variables, compile-time if or template\
    \ argument deduction for classes\n\n## 1. Quick Start\n\nTo make you more curious\
    \ about the new Standard, below, there are a few code samples that present combined\
    \ language features.\n\nDon't worry if you find the examples confusing or too\
    \ complicated. All the new features are individually explained in depth in the\
    \ coming chapters.\n\n### Working With Maps\n\nPart I/demo_map.cpp\n\n```cpp\n\
    #include <iostream>\n#include <map>\n\nint main() {\n    std::map<std::string,\
    \ int> mapUsersAge { \"Alex\", 45 }, { \"John\", 25 };\n\n    std::map mapCopy(mapUsersAge);\n\
    \n    if (auto [iter, wasAdded] = mapCopy.insert_or_assign(\"John\", 26); !wasAdded)\n\
    \        std::cout << iter->first << \" reassigned...\\n\";\n\n    for (const\
    \ auto& [key, value] : mapCopy)\n        std::cout << key << \": \" << value <<\
    \ \"\\n\";\n\n}\n```\n\nThe code will output:\n\nJohn reassigned...\nAlex, 45\n\
    John, 26\n\nThe above example uses the following features:\n\n- * Line 7: Template\
    \ Argument Deduction for Class Templates - mapCopy type is deduced from the type\
    \ of mapUsersAge. No need to declare std::map<std::string, int> mapCopy{...}.\n\
    - - Line 9: New inserting member function for maps - insert_or_assign.\n- - Line\
    \ 9: Structured Bindings - captures a returned pair from insert_or_assign into\
    \ separate names.\n- - Line 9: init if statement - iter and wasAdded are only\
    \ visible in the scope of the surrounding statement.\n- - Line 12: Structured\
    \ Bindings inside a range-based loop - we can iterate using key and value rather\
    \ than pair.first and pair.second.\n\n### Debug Printing\n\nPart/demo_print.cpp\n\
    \n```cpp\n#include <iostream>\n\ntemplate<typename T> void linePrinter(const T&\
    \ x) {\n    if constexpr (std::is_integral_v<T>) {\n        std::cout << \"num:\
    \ \" << x << '\\n';\n    } else if constexpr (std::is_floating_point<T>) {\n \
    \       const auto frac = x - static_cast<long>(x);\n        std::cout << \"flt:\
    \ \" << x << \", \" << frac << '\\n';\n    } else if constexpr (std::is_pointer_v<T>)\
    \ {\n        std::cout << \"ptr: \" << x << '\\n';\n        linePrinter(x);\n\
    \    } else {\n        std::cout << x << '\\n';\n    }\n}\n\ntemplate<typename...\
    \ Args> void printWithInfo(Args... args) {\n    (linePrinter(args), ...); // fold\
    \ expression over the comma operator\n}\n\nint main() {\n    int i = 10;\n   \
    \ float f = 2.56f;\n    printWithInfo(&i, &f, 30);\n}\n```\n\nThe code will output:\n\
    \n```\nptr, num: 10\nptr, flt: 2.56, frac 0.56\nnum: 30\n```\n\nHere you can see\
    \ the following features:\n\n- - Line 4, 6, 10: if constexpr to discard code at\
    \ compile-time, used to match template parameter.\n- - Line 4, 6, 10: variable\
    \ traits - no need to write std::type_name<T>::value.\n- - Line 19: Fold Expressions\
    \ inside printWithInfo. This feature simplifies variadic templates.\n\nThe code\
    \ you've seen so far is just the tip of the iceberg! Continue reading to see more:\
    \ fixes in the language, removed things (like auto), and the new stuff: constexpr,\
    \ structured bindings, inline variables, template argument deduction for classes.\
    \ The Standard contains over 1600 pages, growing over 200 pages compared to C++14.\
    \ Fortunately, the language specification was cleaned up in a few places, and\
    \ some old or potentially harmful features could be cleared out. This section\
    \ lists several language elements that were removed or fixed. See the Removed\
    \ or Fixed Features Chapter for a list of changes in the Standard Library.\n\n\
    In this chapter, you'll learn:\n\n- What was removed from the language like the\
    \ register keyword or operator for bool\n- What was fixed, notably the type deduction\
    \ with brace initialization.\n- Other improvements like static_assert and range-based\
    \ loops.\n\n## Removed Elements\n\nOne of the core concepts behind C++ is its\
    \ compatibility with previous versions. However, sometimes, old projects should\
    \ still compile. This section briefly explains what was removed from the Standard.\n\
    \n## Removing register\n\nThe register keyword was deprecated in 2011 (C++11),\
    \ and it had no meaning since then. It was removed in C++17. The keyword is reserved\
    \ and might be repurposed in future revisions (for example an entirely new and\
    \ powerful feature).\n\nIf you use register to declare a variable:\n\n```cpp\n\
    register int a;\n```\n\nYou might get the following warning (GCC 8.1):\n\nwarning:\
    \ ISO C++17 does not allow 'register' storage specifier\n\nor error in Clang (7.0):\n\
    \nerror: ISO C++17 does not allow 'register' storage specifier\n\nThe change was\
    \ proposed in: P0001R1.\n\n## Removing deprecated operator++\n\nThe increment\
    \ operator for bool has been already deprecated for a very long time. The committee\
    \ recommended against its use back in 1998 (C++98), but they only finally agreed\
    \ to remove it from the language. Note that operator-- was never enabled for bool.\n\
    \nIf you try to write the following code:\n\n```cpp\nbool b;\nb++;\n```\n\nYou\
    \ should get a similar error like this from GCC (8.1):\n\nerror: use of an operand\
    \ of type 'bool' in 'operator++' is forbidden in C++17\n\nThe change was proposed\
    \ in: P0002R1.\n\n## Removing deprecated exception specifications\n\nIn C++17,\
    \ exception specification will be part of the type system (as discussed in the\
    \ next chapter about Language Clarification). However, the standard contains old\
    \ and deprecated exception specification that appeared to be impractical and unused.\
    \ For example:\n\n```cpp\nvoid throwInts(int a) throw(int) {\n    printf(\"can\
    \ throw ints\\n\");\n    if (a == 0)\n        throw 1;\n}\n```\n\nPay special\
    \ attention to throw(int) part. The above code has been deprecated since C++11.\
    \ The only practical exception declaration is throw() which means this code won't\
    \ throw anything. Since C++11 it's been advised to use noexcept.\n\n## Removed\
    \ or Fixed Language Features\n\nFor example in clang 4.0 you'll get the following\
    \ error:\n\nerror: ISO C++11 does not allow dynamic exception specifications [-Wdynamic-exception-spec]\
    \ note: use 'noexcept(false)'\n\nThe change was proposed in: P0003R5.\n\n## Removing\
    \ trigraphs\n\nTrigraphs are special character sequences that could be used when\
    \ a system doesn't support 7-bit ASCII (like ISO 646). For example ?? generated\
    \ #, ?? produced ~. (All of C++'s basic source character set fits in 7-bit ASCII).\
    \ Today, trigraphs are rarely used, and by removing them from the translation\
    \ phase, the compilation process can be more straightforward. See a table below\
    \ with all the trigraphs that were declared until C++17:\n\n| Trigraph | Replacement\
    \ |\n| --- | --- |\n| ??= | # |\n| ??( | [ |\n| ??< | { |\n| ??/ | \\ |\n| ??)\
    \ | ] |\n| ??> | ~ |\n| ??' | ^ |\n| !! | | |\n| ??- | \\ |\n\nThe change was\
    \ proposed in: N4086.\n"
  mdcn: "\n\n## 第一部分 - 语言特性\n\n我们可以说 C++ 由两部分组成：语言和标准库。第一个元素是语言，它侧重于具有表现力的代码和简洁的语法。第二个元素则为你提供了工具、实用程序程序和算法。例如，在\
    \ C++11 中，我们获得了 lambdas，它简化了短函数对象的编写。C++14 允许对函数返回类型使用 `auto` 类型推导，这同样缩短并简化了代码。\n\
    \nC++17 作为标准的一次重大更新，带来了许多惊人的语言元素，这些元素通常使得语言更加清晰、直观。例如，你可以利用 `constexpr` 来减少对 `enable_if`\
    \ 和标签分发（tag dispatching）技术的需求。得益于结构化绑定，你可以将元组视为一等语言公民，依赖并理解表达式求值顺序，编写自然使用拷贝消除（copy-elision）机制的代码，等等！\n\
    \n在本部分中你将学习到：\n\n- 语言中删除了哪些内容，哪些是已弃用的\n- 语言变得更加精确：例如，得益于表达式求值顺序的保证\n- 模板的新特性有哪些：如\
    \ `if` 或折叠表达式（fold expressions）\n- 新的标准属性有哪些有哪些\n- 你如何通过结构化绑定、内联变量、编译时 `if` 或类的模板参数推导来编写更整洁、更具表现力的代码\n\
    \n## 1. 快速上手\n\n为了让你对新标准产生更多好奇，下面提供了一些展示组合语言特性的代码示例。\n\n如果你发现这些示例令人困惑或太复杂，请担心。所有新特性将在接下来的章节中进行详细的解释。\n\
    \n#### 使用 Maps 操作\n\nPart I/demo_map.cpp\n\n```cpp\n#include <iostream>\n#include\
    \ <map>\n\nint main() {\n    std::map<std::string, int> mapUsersAge { \"Alex\"\
    , 45 }, { \"John\", 25 };\n\n    std::map mapCopy(mapUsersAge);\n\n    if (auto\
    \ [iter, wasAdded] = mapCopy.insert_or_assign(\"John\", 26); !wasAdded)\n    \
    \    std::cout << iter->first << \" reassigned...\\n\";\n\n    for (const auto&\
    \ [key, value] : mapCopy)\n        std::cout << key << \": \" << value << \"\\\
    n\";\n\n}\n```\n\n代码将输出：\n\nJohn reassigned...\nAlex, 45\nJohn, 26\n\n上述示例使用了以下特性：\n\
    \n- * 第 7 行：类模板的模板参数推导 - `mapCopy` 的类型从 `mapUsersAge` 的类型推导得出。不需要声明 `std::map<std::string,\
    \ int> mapCopy{...}`。\n- 第 9 行：map 的新插入成员函数 - `insert_or_assign`。\n- 第 9 行：结构化绑定\
    \ - 将 `insert_or_assign` 返回的 pair 捕获到独立的名称中。\n- 第 9 行：带化的 if 语句 - `iter` 和 `wasAdded`\
    \ 仅在周围语句的作用域内可见。\n- 第 12 行：范围循环内的结构化绑定 - 我们可以使用 `key` 和 `value` 进行迭代，而不是使用 `pair.first`\
    \ 和 `pair.second`。\n\n#### 调试打印\n\nPart/demo_print.cpp\n\n```cpp\n#include <iostream>\n\
    \ntemplate<typename T> void linePrinter(const T& x) {\n    if constexpr (std::is_integral_v<T>)\
    \ {\n        std::cout << \"num: \" << x << '\\n';\n    } else if constexpr (std::is_floating_point<T>)\
    \ {\n        const auto frac = x - static_cast<long>(x);\n        std::cout <<\
    \ \"flt: \" << x << \", \" << frac << '\\n';\n    } else if constexpr (std::is_pointer_v<T>)\
    \ {\n        std::cout << \"ptr: \" << x << '\\n';\n        linePrinter(x);\n\
    \    } else {\n        std::cout << x << '\\n';\n    }\n}\n\ntemplate<typename...\
    \ Args> void printWithInfo(Args... args) {\n    (linePrinter(args), ...); // 逗号操作符折叠表达式\n\
    }\n\nint main() {\n    int i = 10;\n    float f = 2.56f;\n    printWithInfo(&i,\
    \ &f, 30);\n}\n```\n\n代码将输出：\n\n```\nptr, num: 10\nptr, flt: 2.56, frac 0.56\n\
    num: 30\n```\n\n在这里你可以看到以下特性：\n\n- 第 4, 6, 10 行：`if constexpr` 在编译时丢弃代码，用于匹配模板参数。\n\
    - 第 4, 6, 10 行：变量属性（traits） - 不需要编写 `std::type_name<T>::value`。\n- 第 19 行：`printWithInfo`\
    \ 内部折叠表达式。这一特性简化了变长模板。\n\n你到为止看到的代码只是冰山一角！继续阅读以查看更多：语言的修复、移除的内容（如 `auto`）以及新内容：`constexpr`、结构化绑定、内联变量、类的模板参数推导。\n\
    \n"
