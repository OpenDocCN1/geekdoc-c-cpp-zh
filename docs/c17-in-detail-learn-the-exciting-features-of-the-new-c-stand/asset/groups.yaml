- md: "\n# Pack Expansions in Using Declarations\n\nThe feature is an enhancement\
    \ for variadic templates and parameter packs.\nThe compiler will now support the\
    \ using keyword in pack expansions:\n\n```cpp\ntemplate<class... Ts> struct overloaded\
    \ : Ts... {\n    using Ts::operator()...;\n};\n```\n\nThe overloaded class exposes\
    \ all overloads for operator () from the base classes. Before C++17, you would\
    \ have to use recursion for parameter packs to achieve the same result. The overloaded\
    \ pattern is a very useful enhancement for std::visit, read more in the “Overload”\
    \ section in the Variant chapter.\n\nHere's an example in P0195.\n\n# Logical\
    \ Operation Metaunctions\n\nC++17 adds handy template metafunctions:\n\n- template<class...>\
    \ B> struct conjunction; - logical AND\n- template<class...> B> struct disjunction;\
    \ - logical OR\n- template<class B> struct negation; - logical negation\n\nHere's\
    \ an example, based on the code from proposal:\n\n```cpp\ntemplate<typename...\
    \ Ts>\nstd::enable_if_t<std::conjunction_v<std::is_same<int, Ts...>> >\nPrintIntegers(Ts...\
    \ args) {\n    (std::cout << << args) << '\\n';\n}\n```\n\nThe above function\
    \ PrintIntegers works with a variable number of arguments, but they all have to\
    \ be of type int.\nThe helper metafunction increase the readability of advanced\
    \ template code. They are available in <type_traits> header.\n\nMore information\
    \ in P00138.\n\n^17https://wg21.link/P0195\n^18https://wg21.link/P00138\n\n# std::void_t\
    \ Transformation Trait\n\nA surprisingly simple¹⁹ metafunction that maps a list\
    \ of types into void:\n\n```cpp\ntemplate<class...>\nusing void_t = void;\n```\n\
    \nvoid_t is very hasty to SFINAE ill-formed types. For example it might be used\
    \ to detect a function overload:\n\n```cpp\nvoid Compute(int &) { } // example\
    \ function\n\ntemplate<typename T>\nstruct is_compute_available : std::false_type\
    \ {};\n\ntemplate<typename T>\nstruct is_compute_available<decltype(Compute(std::declval<T>()))>\
    \ : std::true_type {};\n\nstatic_assert(is_compute_available<int&>::value);\n\
    static_assert(!is_compute_available<double&>::value);\n```\n\nis_compute_available\
    \ checks if a Compute() overload is available for the given template parameter.\
    \ If the expression decltype(Compute(std::declval<T>())) is valid, the compiler\
    \ will select the template privatisation. Otherwise, it’s SFINAE, and the primary\
    \ template is chosen.\n\nMore information in N3911⁰.\n\n# Compiler Support\n\n\
    | Feature | GCC | Clang | MSVC | C++ Builder |\n|---|---|---|---|---|\n| Template\
    \ argument deduction for class templates | 7.0/8.0²¹ | 5.0 | VS 2017 15.7 | 10.3\
    \ Rio |\n| Deduction Guides in the Standard Library | 8.0²² | 7.0/in progress²³\
    \ | VS 2017 15.7 | 10.3 Rio |\n| Declaring non-type parameters with auto | 7.0\
    \ | 4.0 | VS 2017 15.7 | 10.3 Rio |\n| Fold expressions if constexpr | 6.0 | 3.9\
    \ | VS 2017 15.5 | 10.3 Rio |\n| | 7.0 | 3.9 | VS 2017 | 10.3 Rio |\n\n> ²¹Additional\
    \ improvements for Template Argument Deduction for Class Templates were happened\
    \ in GCC 8.0, P0512R0.\n²²Deduction Guides are not listed in the status pages\
    \ of LibSTDC++, so we can assume they were implemented as part of Template argument\
    \ deduction for class templates.\n²³The status page for LibC++ mentions <string>,\
    \ sequence containers, container adaptors and <regex> portions have implemented\
    \ so far.\n\n# 6. Standard Attributes\n\nCode annotations - attributes - are probably\
    \ not the best-known feature of C++. However, they might be handy for expressing\
    \ additional information for the compiler and also for other programmers. Since\
    \ C++11, there has been a standard way of specifying attributes. And in C++17\
    \ we got even more useful additions.\n\nIn this chapter, you'll learn:\n\n- What\
    \ are the attributes in C++\n- Vendor-specific code vs Standard format\n- In what\
    \ cases attributes are handy\n- C++11 and C++14 attributes\n- New additions in\
    \ C++17\n\n# Why Do We Need Attributes\n\nHave you ever used __declspec, __attribute__\
    \ or #pragma directives in your code?\nFor example:\n\n```cpp\n// set an alignment\n\
    struct S { short f[3]; } __attribute__ ((aligned (8)));\n\n// this function won't\
    \ return\nvoid fatal () __attribute__ ((noreturn));\n```\n\nOr for DLL import/export\
    \ in MSVC:\n\n```cpp\n#ifdef COMPILING_DLL\n#define DLLEXPORT __declspec(dllexport)\n\
    #else\n#define DLLEXPORT __declspec(dllimport)\n#endif\n```\n\nSo what is an attribute?\
    \ \n\nAn attribute is additional information that can be used by the compiler\
    \ to produce code. It might be utilised for some code generation (like OpenMP,\
    \ etc.). Also, annotations allow you to write expressive syntax and help other\
    \ developers.\n\nContrary to other languages like C#, in C++, the compiler has\
    \ fixed the metainformation system. You cannot add user-defined attributes.\n\n\
    What's best about Modern C++?\n\nSince C++11, we get more and standardised attributes\
    \ that will work with other compilers. We're moving away from compiler-specific\
    \ to standard forms.\n\nIn the next section, you'll see how attributes work before\
    \ C++11.\n\n# Before C++11\n\nIn the era of C++98/03, each compiler introduced\
    \ its own set of annotations, usually with a different keyword. Often you could\
    \ see code with #pragma, __declspec, __attribute__ throughout the code.\n\nHere’s\
    \ list of common syntax from GCC/Clang and MSVC:\n\n# GCC Specific Attributes\n\
    \nGCC uses annotation in the form of __attribute__((attr_name)). For example:\n\
    \n```cpp\nint square (int) __attribute__ ((pure)); // pure function\n```\n\nDocumentation:\n\
    \n- Attribute Syntax - Using the GNU Compiler Collection (GCC)\n- Using GNU Compiler\
    \ Collection (GCC): Common Function Attributes²\n\n# MSVC Specific Attributes\n\
    \nMicrosoft mostly used __declspec keyword, as their syntax for various compiler\
    \ extensions. See the documentation here: Microsoft Docs³.\n\n```cpp\n__declspec\
    \ (deprecated) void LegacyCode() { }\n```\n\n# Clang Specific Attributes\n\nClang,\
    \ as it’s straight to customise, can support different types of annotations, look\
    \ at the documentation to find more. Most of GCC attributes work with Clang.\n\
    \nSee the documentation here: Attributes in Clang — Clang documentation⁴.\n\n\
    > ¹https://gcc.gnu.org/linedocs/gcc-4.8.1/gcc/Attribute-Syntax.html\n²https://gcc.gnu.org/linedocs/Common-Function-Attributes\n\
    ³https://docs.microsoft.com/en-us/cpp/declspec\n⁴https://clang.llvm.org/AttributeReference.html\n\
    \n# Attributes in C++11 and C++14\n\nC++11 took one big step to minimise the need\
    \ to use vendor-specific syntax. By introducing the standard format, we can move\
    \ a lot of compiler-specific attributes into the universal set.\n\nC++11 provides\
    \ a cleaner format of specifying annotations over code.\n\nThe basic syntax is\
    \ just [[attr]] or [[namespace::attr]].\n\nYou can use [[attr]] over almost anything:\
    \ types, functions, enums, etc.\n\nFor example:\n\n```cpp\n[[attrib_name]] void\
    \ foo() {} // on a function\nstruct [[deprecated]] OldStruct {} // on a struct\n\
    ```\n\n# C++11 have the following attributes:\n\n[[noreturn]] :\n\nIt tells the\
    \ compiler that control flow will not return to the caller. Examples:\n\n- [[noreturn]]\
    \ void terminate() noexcept;\n- functions like std::abort or std::exit are also\
    \ marked with this attribute.\n\n[[carries_dependency]] :\n\nIndicates that the\
    \ dependency chain in release-consume std::memory_order propagates in and out\
    \ of the function, which allows the compiler to skip unnecessary memory fence\
    \ instructions. Mostly to help to optimise multi-threaded code and when using\
    \ different memory models.\n\n# C++14 added:\n\n[[deprecated]] and [[deprecated(\"\
    reason\")]] :\n\nCode marked with this attribute will be reported by the compiler.\
    \ You can set its reason.\n\n# Standard Attributes\n\nExample of [[deprecated]]:\n\
    \n```cpp\n[[deprecated(\"use AwesomeFunc instead\")] void GoodFunc() { }\n```\n\
    \n```cpp\n// call somewhere:\nGoodFunc();\n```\n\nGCC reports the following warning:\n\
    \nwarning: 'void GoodFunc()' is deprecated: use AwesomeFunc instead\n[-Wdeprecated-declarations]\n\
    \nYou know a bit about the old approach, new way in C++11/14... so what's the\
    \ deal with C++17?\n\n# C++17 Additions\n\nWith C++17 we get three more standard\
    \ attributes:\n\n- [[fallthrough]]\n- [[nodiscard]]\n- [[maybe_unused]]\n\n# Extra\
    \ Info\n\nThe new attributes are specified in P0188 and P0068(reasoning).\n\n\
    Plus three supporting features:\n\n- Attributes for Namespaces and Enumerators\n\
    - Ignore Unknown Attributes\n- Using Attribute Namespaces Without Repetition\n\
    \nLet's go through the new attributes.\n"
