  - "[PAGE 57]\n\n# Inline Variables\n\nWith Non-Static Data Member Initialisation\
    \ introduced in C++11, you can now declare and initialise member variables in\
    \ one place:\n\n```\nclass User {\n    int _age{};\n    std::string _name{\"unknown\"\
    };\n};\n```\n\nHowever, with static variables (or const static) you need a declaration\
    \ and then a definition in the implementation file.\n\nC++11 constexpr keyword\
    \ allows you to declare and define static variables in one place, but it's limited\
    \ to constant expressions only.\n\nPreviously, only methods/functions could be\
    \ specified as inline, but now you can do the same with variables, inside a header\
    \ file.\n\nFrom the proposal [P0386R2]*:\n\n> A variable declared inline has the\
    \ same semantics as a function declared inline: it can be defined, identically,\
    \ in multiple translation units, must be defined in every translation unit in\
    \ which it is used, and the behaviour of the program is as if there was exactly\
    \ one variable.\n\nFor example:\n\n```\n// inside header file:\nstruct MyClass\
    \ {\n    static const int sValue;\n};\n```\n\n```\n// later in the same header\
    \ file:\ninline int const MyClass::sValue = 777;\n```\n\nOr even declaration and\
    \ definition in one place:\n\n*http://wg21.link/p0386r2"
  - "[PAGE 58]\n\n```\nstruct MyClass {\n    inline static const int sValue = 777;\n\
    };\n```\n\nAlso, note that constexpr variables are inline implicitly, so there's\
    \ no need to use\\constexpr inline myVar = 10.\n\nAn inline variable is also more\
    \ flexible than a constexpr variable as it doesn't have to\nised with a constant\
    \ expression. For example, you can initialise an inline variable\nwith rand(),\
    \ but it's not possible to do the same with constexpr variable.\n\n# How Can it\
    \ Simplify the Code?\n\nA lot of header-only libraries can limit the number of\
    \ hacks (like using inline functions\ntemplates) and switch to using inline variables.\n\
    \nFor example:\n\n```\nclass MyClass {\n    static inline int Seed(); // static\
    \ method\n};\ninline int MyClass::Seed() {\n    static const int seed = rand();\n\
    \    return seed;\n}\n```\n\nCan be changed into:\n\n```\nclass MyClass {\n  \
    \  static inline int seed = rand();\n}\n```\n\nC++17 guarantees that MyClass::seed\
    \ will have the same value (generated at runtime)\nacross all the compilation\
