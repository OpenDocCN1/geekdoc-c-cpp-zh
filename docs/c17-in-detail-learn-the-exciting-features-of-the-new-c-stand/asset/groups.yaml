    \  case 'b':\n    g(); // fallthrough is ok\n  case 'c':\n    h();\n}\n```\n\n\
    With this attribute, the compiler can understand the intentions of a programmer.\
    \ It’s also more readable than using a comment.\n\n# [[maybe_unused]] Attribute\n\
