    Removed or Fixed Language Features


    For example:


    ```

    auto x1 = { 1, 2 };    // decltype(x1) is std::initializer_list<int>

    auto x2 = { 1, 2.0 };   // error: cannot deduce element type

    auto x3{ 1, 2 };      // error: not a single element

