    \ in the condition section. The variable is visible only in if/else scope.\n\n\
    To achieve a similar result, before C++17, you had to write:\n\n```\n{\nauto val\
    \ = GetValue();\nif (condition(val))\n    // on success\nelse\n    // on false...\n\
    }\n```\n\nPlease note that val has a separate scope, without that ‘leaks’ to enclosing\
    \ scope.\nNow, in C++17, you can write:\n\n```\nif (auto val = GetValue(); condition(val))\n\
    \    // on success\nelse\n    // on false...\n```\n\nNow, val is visible only\
    \ inside the if and else statements, so it doesn’t ‘leak.’ condition might be\
    \ any boolean condition.\n\nWhy is this useful?\n\nLet’s say you want to search\
    \ for a few things in a string:"
- md: "\n# General Language Features\n\n```cpp\nconst std::string myString = \"My\
    \ Hello World Wow\";\n```\n\n```cpp\nconst auto pos = myString.find(\"Hello\"\
    );\nif (pos != std::string::npos)\nstd::cout << \" Hello\\n\";\n```\n\n```cpp\n\
    const auto pos2 = myString.find(\"World\");\nif (pos2 != std::string::npos)\n\
    std::cout << pos2 << \" World\\n\";\n```\n\nYou have use different names for pos\
    \ or enclose it with a separate scope:\n\n```cpp\n{\nconst auto pos = myString.find(\"\
    Hello\");\nif (pos != std::string::npos)\nstd::cout << \" Hello\\n\";\n}\n```\n\
    \n```cpp\n{\nconst auto pos = myString.find(\"World\");\nif (pos != std::string::npos)\n\
    std::cout << pos << \" World\\n\";\n}\n```\n\nThe new if statement will make additional\
    \ scope in one line:\n\n```cpp\nif (const auto pos = myString.find(\"Hello\");\
    \ pos != std::string::npos)\nstd::cout << \" Hello\\n\";\n```\n\n```cpp\nif (const\
    \ auto pos = myString.find(\"World\"); pos != std::string::npos)\nstd::cout <<\
    \ \" World\\n\";\n```\n\nAs mentioned before, the variable defined in the if statement\
    \ is also visible in the else block. So you can write:\n\n```cpp\nif (const auto\
    \ pos = myString.find(\"World\"); pos != std::string::npos)\nstd::cout << pos\
    \ << \" World\\n\"\nelse\nstd::cout << pos << \" not found!!\\n\";\n```\n\nPlus,\
    \ you can use it with structured bindings (following Herb Sutter code):\n\n```cpp\n\
    // better together: structured bindings + if initializer\nif (auto [iter, succeeded]\
    \ = mymap.insert(value); succeeded) {\n    use(iter); // ok\n// ...\n} // iter\
    \ and succeeded are destroyed\n```\n\nIn the above example, you can refer to iter\
    \ and succeeded rather than pair.first and pair.second that is returned from mymap.insert.\n\
    \nAs you can see, structured bindings and tuples allow you to create even more\
    \ variables in the init section of the if-statement. But this is the code easier\
    \ to read that way?\n\nFor example:\n\n```cpp\nstring str = \"Hi World\";\nif\
    \ (auto [pos, size] = pair(str.find(\"Hi\"), str.size()); pos != string::npos)\n\
    std::cout << pos << \" Hello, size is \" << size;\n```\n\nWe can argue that putting\
    \ more code into the init section makes the code less readable, pay attention\
    \ to such cases.\n\n# Extra Info\n\nThe change was proposed in: P0305R1.\n\n#\
    \ Inline Variables\n\nWith Non-Static Data Member Initialisation introduced in\
    \ C++11, you can now declare and initialize member variables in one place:\n\n\
    ```cpp\nclass User {\n    int _age{};\n    std::string _name{\"unknown\"};\n};\n\
    ```\n\nHowever, with static variables (or const static) you need a declaration\
    \ and then a definition in the implementation file.\n\nC++11 constexpr keyword\
    \ allows you to declare and define static variables in one place, but it's limited\
    \ to constant expressions only.\n\nPreviously, only methods/functions could be\
    \ specified as inline, but now you can do the same with variables, inside a header\
    \ file.\n\nFrom the proposal [P0386R2]*:\n\n> A variable declared inline has the\
    \ same semantics as a function declared inline: it can be defined, identically,\
    \ in multiple translation units, must be defined in every translation unit in\
    \ which it is used, and the behaviour of the program is as if there was exactly\
    \ one variable.\n\nFor example:\n\n```cpp\n// inside header file:\nstruct MyClass\
    \ {\n    static const int sValue;\n};\n```\n\n```cpp\n// later in the same header\
    \ file:\ninline int const MyClass::sValue = 777;\n```\n\nOr even declaration and\
    \ definition in one place:\n\nhttp://wg21.link/p0386r2\n\n```cpp\nstruct MyClass\
    \ {\n    inline static const int sValue = 777;\n};\n```\n\nAlso, note that constexpr\
    \ variables are inline implicitly, so there's no need to use `constexpr inline\
    \ myVar = 10`.\n\nAn inline variable is also more flexible than a constexpr variable\
    \ as it doesn't have to be initialized with a constant expression. For example,\
    \ you can initialize an inline variable with rand(), but it's not possible to\
    \ do the same with constexpr variable.\n\n# How Can it Simplify the Code?\n\n\
    A lot of header-only libraries can limit the number of hacks (like using inline\
    \ functions templates) and switch to using inline variables.\n\nFor example:\n\
    \n```cpp\nclass MyClass {\n    static inline int Seed(); // static method\n};\n\
    inline int MyClass::Seed() {\n    static const int seed = rand();\n    return\
    \ seed;\n}\n```\n\nCan be changed into:\n\n```cpp\nclass MyClass {\n    static\
    \ inline int seed = rand();\n}\n```\n\nC++17 guarantees that MyClass::seed will\
    \ have the same value (generated at runtime) across all the compilation units!\n\
    \n> Extra Info\nThe change was proposed in: P0386R2.\n\n# constexpr Lambda Expressions\n\
    \nLambda expressions were introduced in C++11, and since that moment they've become\
    \ an essential part of modern C++. Another significant feature of C++11 is the\
    \ constexpr specifier, which is used to express that a function or value can be\
    \ computed at compiletime. In C++17, the two elements are allowed to exist together,\
    \ so your lambda can be invoked in a constant expression context.\n\nIn C++14\
    \ the following code doesn't compile, but works with C++17:\n\n```cpp\n// General\
    \ Language Features/lambda_square.cpp\nint main () {\n    constexpr auto SquareLambda\
    \ = [] (int n) { return n*n; };\n    static_assert(SquareLambda(3) == 9, \"\"\
    );\n}\n```\n\nSince C++17 lambda expressions (their call operator operator ())\
    \ that follow the rules of standard constexpr functions are implicitly declared\
    \ as constexpr.\n\nWhat are the limitations of constexpr functions? Here's a summary\
    \ (from 10.1.5 constexpr specifier [dcl.constexpr]¹¹⁰):\n\n- they cannot be virtual\n\
    - their return type should be a literal type\n- their parameter types should be\
    \ a literal type\n- their functions cannot contain: asm definition, a goto statement,\
    \ try-block, or a variable that is a non-literal type or static or thread storage\
    \ duration\n\nIn practice, in C++17, if you want your function or lambda to be\
    \ constexpr, you can use the `constexpr` keyword.\n\nThe change was proposed in:\
    \ P0386.\n\n# Capturing this in Lambda Expressions\n\nWhen you write a lambda\
    \ inside a class, you can reference member variables by capturing this. For example:\n\
    \nGeneral Language Features/capture_this.cpp\n\n```cpp\nstruct Test {\n    void\
    \ foo() {\n        std::cout << m_str << '\\n';\n        auto addLambda = [this]()\
    \ { m_str += \"World\"; };\n        addLambda();\n        std::cout << m_str <<\
    \ '\\n';\n    }\n\n    std::string m_str{\"Hello \"};\n};\n```\n\nIn the line\
    \ with `auto addLambda = [this](){ }` we capture this pointer. Please note that\
    \ [=] suggests we capture variables by value, but if you access members of a class\
    \ in a lambda expression, then it does this implicitly via this pointer. So we\
    \ captured a copy of this pointer, which is a dangling pointer as soon as we exceed\
    \ the lifetime of the object.\n\nIn C++17 you can write `[*this]` and that will\
    \ capture a copy of the whole object.\n\n```cpp\nauto lam = [*this]() { std::cout\
    \ << s; };\n```\n\nIn C++14, the only way to make the code safe is to capture\
    \ `[*this]`:\n\n```cpp\nauto lam = [self=*this] { std::cout << self.s; };\n```\n\
    \n# Returning a Lambda From a Method\n\n```cpp\n#include <iostream>\n\nstruct\
    \ Baz {\n    auto foo() {\n        return [=] { std::cout << s << '\\n'; };\n\
    \    }\n    std::string s;\n};\n\nint main() {\n    auto f1 = Baz{\"ala\"}.foo();\n\
    \    f1();\n}\n```\n\nThe code declares a Baz object and invokes foo(). Please\
    \ note that foo() returns a lambda that captures a block [=] suggests we capture\
    \ variables by value, but if you access members of a class in a lambda expression,\
    \ then it does this implicitly via this pointer. So we captured a copy of this\
    \ pointer, which a dangling pointer as soon as we exceed the lifetime of the Baz\
    \ object.\n\nIn C++17 you can write `[*this]` and that will capture a copy of\
    \ the whole object.\n\nCapturing this might get tricky when a lambda can outlive\
    \ the object itself. This might happen when you use async calls or multithreading.\n\
    \nIn C++20 (see P0806¹) you'll also see an extra warning if you capture [=] in\
    \ a method. Such expression capture this pointer, and it might not be exactly\
    \ what you want.\n"
