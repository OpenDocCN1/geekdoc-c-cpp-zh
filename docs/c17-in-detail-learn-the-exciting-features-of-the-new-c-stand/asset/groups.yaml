    # Deduction Guides


    The compiler uses special rules called “Deduction Guides” to work out parameter
    types.

    There are two types of guides: compiler-generated (implicitly generated) and user-defined.

    To understand how the compiler uses guides, let''s look at a simplified deduction
    guide¹

    std::array;


    ```

    template<typename T, typename... U>

    array(T, U...) ->

    array<enable_if_t<is_same_v<T, U...>,>, 1 + sizeof...(U)>;

    ```


    The syntax looks like a template function with a trailing return type. The compiler
    treats “imaginary” function as a candidate for the parameters. If the pattern
    matches, the found types are returned from the deduction.

    In our case when you write:


    ```

    std::array arr{1, 2, 3, 4};

    ```


    Then, assuming T and U... are arguments of the same type, we can build up an array
    object of the type std::array<int, 4>.

    In most cases, you can rely on the compiler to generate automatic deduction guides.
    They will be created for each constructor (also copy/move) of the primary class
    template. Please note that classes which are specialised or partially specialised
    won''t work here.

    As mentioned, you might also write custom deduction guides. A classic example
    is a deduction of std::string rather than const char*:


    ```

    template<typename T> struct MyType {

    T str;

    };

    ```


    ```

    // custom deduction guide

    MyType(const char *) -> MyType<std::string>;

    MyType t{"Hello World"}; // deduces std::string

    ```


    Without the custom deduction T would be deduced as const char*.'
  - '[PAGE 71]


    Another example of custom deduction guide comes from the overload pattern:


    ```

    template<class... Ts>

    struct overload : Ts... { using Ts::operator()... };

    ```


    ```

    template<class... Ts>

    load(Ts...) -> overload<Ts...>; // deduction guide

    ```


    The overlad class inherits from other classes Ts... and then exposes their operator().

    The custom deduction guide is used here “transform” a list of callable types into
    the list of classes that we can derive from.


    # CTAD Limitations


    In C++17 template argument deduction for classes has the following limitations:


    +   - it doesn''t work with template aggregate types

    - the deduction doesn''t include inheriting constructors

    - it doesn''t work with template aliases


    Those limitations will be removed in C++20 through the already accepted proposal:
    P1021.


    # Extra Info


    The CTAD feature was proposed in: P0091R3 and P0433 - Deduction Guides in the
    Standard Library.


    Please note that while a compiler might declare full support for Template Argument
    Deduction for Class Templates, its corresponding STL implementation might still
    lack of custom deduction guides for some STL types. See the Compiler Support section
    at the end of the chapter.


    > ²Read more about this pattern in the chapter about std::variant, section related
    to std::visit()

    ³https://wg21.link/P1021

