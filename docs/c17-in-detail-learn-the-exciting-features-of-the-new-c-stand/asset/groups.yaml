    \ for loops, smart pointers and many powerful elements, it signalled enormous\
    \ progress for the language. Even now, in 2019, many teams struggle to modernise\
    \ their projects to leverage the modern features. Later there was a minor update\
    \ - C++14, which improved some things from the previous Standard and added a few\
    \ smaller elements.\n\nAlthough C++17 is not as big as C++11, it's larger than\
    \ C++14 and brings many exciting additions and improvements. This book will guide\
    \ through all of them!\n\nThe book brings exclusive content about C++17 and draws\
