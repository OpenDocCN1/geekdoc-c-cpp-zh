    ```


    As in older compilers - that don''t support __has_include we''d get a compile
    error. The compiler will complain that since since __has_include is not defined
    and the whole expression is wrong.


    Another important thing to remember is that sometimes a compiler might provide
    a header stub. For C++14 the __execution__ header might be present (it defines
    C++17 parallel algorithm execution modes), but the whole file will be empty (due
    to ifdefs). If you check for this code with __has_include and use C++14 mode,
    then you''ll get a result.


    > In C++20 we''ve standardised feature test macros that simplify checking for
    various C++ parts. For example, to test std::any you can use __cpp_any, for lambda
    support there''s __cpp_lambdas. There''s even a macro that checks for attribute
    support: __has_cpp_attribute( attrib-name). GCC, Clang and Visual Studio exposes
    many of the macros already, before C++20 is ready. Read more in Feature testing
    (C++20) - cpppreference¹⁶


    __has_include along with feature test macros might greatly simplify multiplatform
    code that usually needs to check for available platform elements.


    # Extra Info


    __has_include was proposed in: P0061¹⁷.'
