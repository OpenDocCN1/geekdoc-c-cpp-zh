    Removed or Fixed Language Features


    For example in clang 4.0 you''ll get the following error:


    error: ISO C++11 does not allow dynamic exception specifications [-Wdynamic-exception-spec]
    note: use ''noexcept(false)'' instead


    # Extra Info


    The change was proposed in: P0003R5.


    # Removing Trigraphs


    Trigraphs are special character sequences that could be used when a system doesn''t
    support 7-bit ASCII (like ISO 646). For example ?? generated #, ?? produced ~.
    (All of C++''s basic source character set fits in 7-bit ASCII). Today, trigraphs
    are rarely used, and by removing them from the translation phase, the compilation
    process can be more straightforward. See a table below with all the trigraphs
    that were declared until C++17:


    | Trigraph | Replacement |

    |--- | --- |

    | ??= | # |

    | ??( | [ |

    | ??< | { |

    | ??/ | \ |

    | ??) | ] |

    | ??> | ~ |

    | ??'' | ^ |

    | !! | | |

    | ??- | \


    # Extra Info


    The change was proposed in: N4086.


