  mdcn: "\n\n# 修复 (Fixes)\n\n我们可以争论语言标准中什么是修复，哪些不是。以下有三项内容看起来像是对之前规则中缺失或无法正常工作的修复。\n\
    \n## 用于直接列表初始化的新 auto 规则\n\n自 C++11 以来，存在一个奇怪的问题，即：\n\n```cpp\nauto x = { 1 };\n\
    ```\n\n被推导为 `std::initializer_list<int>`。这种行为是不直观的，因为在某些情况下，你期望它运行像 `x { 1 };`\
    \ 一样。\n\n大括号初始化（Braceisation）是现代 C++ 中的首选模式，但此类异常使得该特性变得薄弱。\n\n有了新标准，我们可以修复这个问题，使其推导为\
    \ `int`。\n\n为了实现这一点，我们需要理解两种初始化方式——拷贝初始化和直接初始化：\n\n```cpp\n// foo() 是一个按值返回某些\
    \ Type 的函数\nauto x = foo();           // 拷贝初始化\nauto x(foo());            // 直接初始化，初始化一个\n\
    \                                 // initializer_list (直到 C++17)\n```\n\n```cpp\n\
    int x = foo();           // 拷贝初始化\nint x{foo()};          // 直接初始化\n```\n\n对于直接初始化，C++17\
    \ 引入了新规则：\n\n- 对于只有单个元素的大括号初始化列表（braced-init-list），auto 推导将从该元素进行推导。\n- 对于包含多个元素的大括号初始化列表，auto\
    \ 推导将是违法的（ill-formed）。\n\n已移除或修复的语言特性\n\n例如：\n\n```cpp\nauto x1 = { 1, 2 };  \
    \  // decltype(x1) 为 std::initializer_list<int>\nauto x2 = { 1, 2.0 };   // 错误：无法推导元素类型\n\
    auto x3{ 1, 2 };      // 错误：不是元素\nauto x4 = { 3 };       // decltype(x4) 为 std::initializer_list<int>\n\
    auto x5{ 3 };         // decltype(x5) 为 int\n```\n\n# 额外信息 (Extra Info)\n\n该更改提议：N3922*\
    \ 和 N3681。编译器很早就修复了这个问题，该改进在 GCC 5.0 (2015年中期) 中可用。Clang 3.8 (2016年初) 和 MSVC 2015\
    \ (2015年中) 也可用。这早于 C++17 的获批准得多。\n\n# 不带消息的 static_assert\n\n此特性为 `static_assert`\
    \ 增加了一个新的重载。它允许你在 `static_assert` 内部编写条件而不必传递消息。\n\n它将与如 `BOOST_STATIC_ASSERT`\
    \ 等其他断言兼容。具有 boost 经验的程序员现在切换到 C++17 `static_assert` 将没有任何问题。\n\n```cpp\nstatic_assert(std::is_arithmetic<T>,\
    \ \"T must be arithmetic\");\nstatic_assert(std::is_arithmetic_v<T>); // C++17\
    \ 起不需要消息\n```\n\n在很多情况下，你检查的条件已经足够明确，不需要在消息字符串中提到它。\n\n# 额外信息 (Extra Info)\n\n\
    该更改提议：N3928。\n\n^6 http://wg21.link/n3922\n7 http://wg21.link/n3681\n8 https://wg21.link/n3928\n\
    \n# 基于范围的 for 循环中不同的开始和结束类型\n\nC++11 增加了基于范围的 for 循环：\n\n```cpp\nfor (for-range-declaration\
    \ : for-range-initializer)\n    statement;\n```\n\n根据 C++14 标准，循环等同于以下代码：\n\n\
    ```cpp\nauto __range = for-range-initializer;\nfor ( auto __begin = begin-expr,\
    \ __end = end-expr;\n    __begin != __end ) {\n    for-range-declaration = *__begin;\n\
    \    statement;\n}\n```\n\n你可以看到，`__begin` 和 `__end` 具有相同类型。这种方式运行良好，但扩展性不足。例如，你可能希望迭代到某个与范围起点类型不同的哨兵值（sentinel\
    \ value）。\n\n在 C++17 中，基于范围的 for 循环被定义等同于以下代码：\n\n```cpp\nauto __range = for-range-initializer;\n\
    auto __begin = begin-expr;\nauto __end = end-expr;\nfor ( ; __begin != __end;\
    \ ) {\n    for-range-declaration = *__begin;\n    statement;\n}\n```\n\n`__begin`\
    \ 和 `__end` 的类型可能不同；只需要比较运算符。该更改对现有循环没有影响，但它为库提供了更多选项。例如，这允许 Range TS（以及 C++20\
    \ 中的 Ranges）与基于范围的 for 循环配合。\n\n# 额外信息 (Extra Info)\n\n该更改提议：P0184R0。\n\n# 编译器支持\
    \ (Compiler Support)\n\n| 特性 | GCC | Clang | MSVC | C++ Builder |\n|---|---|---|---|---|\n\
    | 移除 register 关键字 | 7.0 | 3.8 | VS 2017 | | |\n| 移除废用的 operator++(bool) | 7.0\
    \ | 3.8 | VS 2017 15.3 | 10.3 Rio |\n| 移除废弃的异常规格 | 7.0 | 4.0 | VS 2017 15.5 |\
    \ 10.3 Rio |\n| 移除三连字 (trigraphs) | 5.1 | 3.5 | VS 2017 | | |\n| 直接列表初始化的新 auto\
    \ 规则 | 7.0 | 3.8 | VS 2017 | | |\n| 不带消息的 static_assert | 7.0 | 3.8 | VS 2017\
    \ | | |\n| 基于范围的 for 循环中不同的开始和结束类型 | 7.0 | 3.8 | VS 2017 | |\n\n*表格行是碎片化的；我已根据特性进行了重构。）*\n\
    \n# 澄清 (Clarification)\n\nC++17 解决了函数链调的问题。在 C++14 中，函数链调用被指定从左到右（因此 `addInt()`\
    \ 在 `addFloat()` 之后），但内部表达式的求值顺序可能不同。\n准确来说：\n\n表达式之间是不确定顺序的。\n\n# 直接列表初始化的新 auto\
    \ 规则\n\n自 C++11 以来，存在一个奇怪的问题，即：\n\n```cpp\nauto x = { 1 };\n```\n\n被推导为 `std::initializer_list<int>`。这种行为是不直观的，因为在某些情况下，你期望它运行像\
    \ `x { 1 };` 一样。\n\n大括号初始化（Braceisation）是现代 C++ 中的首选模式，但此类异常使得该特性变得薄弱。\n\n有了新标准，我们可以修复这个问题，使其推导为\
    \ `int`。\n\n为了实现这一点，我们需要理解两种初始化方式——拷贝初始化和直接初始化：\n\n```cpp\n// foo() 是一个按值返回某些\
    \ Type 的函数\nauto x = foo();           // 拷贝初始化\nauto x(foo());            // 直接初始化，初始化一个\n\
    \                               // initializer_list (直到 C++17)\n```\n\n```cpp\n\
    int x = foo();           // 拷贝初始化\nint x{foo()};          // 直接初始化\n```\n\n对于直接初始化，C++17\
    \ 引入了新规则：\n\n- 对于只有单个元素的大括号初始化列表，auto 推导将从该元素进行推导。\n- 对于包含多个元素的大括号初始化列表，auto 推导将是违法的（ill-formed）。\n\
    \n# 已移除或修复的语言特性\n\n例如：\n\n```cpp\nauto x1 = { 1, 2 };    // decltype(x1) 为 std::initializer_list<int>\n\
    auto x2 = { 1, 2.0 };   // 错误：无法推导元素类型\nauto x3{ 1, 2 };      // 错误：不是元素\nauto\
    \ x4 = { 3 };       // decltype(x4) 为 std::initializer_list<int>\nauto x5{ 3 };\
    \         // decltype(x5) 为 int\n```\n\n# 额外信息 (Extra Info)\n\n该更改提议：N3922* 和\
    \ N3681。编译器很早就修复了这个问题，该改进在 GCC 5.0 (2015年中期) 中可用。Clang 3.8 (2016年初) 和 MSVC 2015\
    \ (2015年中) 也可用。这早于 C++17 的获批准得多。\n\n# 不带消息的 static_assert\n\n此特性为 `static_assert`\
