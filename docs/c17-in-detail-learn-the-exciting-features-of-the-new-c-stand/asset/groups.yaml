    \n```cpp\ntemplate <auto value> void f() { \n    f<10>(); // deduces int\n}\n\
    ```\n\nThis is useful, as you don't have to have a separate parameter for the\
    \ type of non-type parameter. In C++11/14:\n\n```cpp\ntemplate <typename Type,\
    \ Type value> constexpr Type TConstant = value;\nconstexpr auto MySuperConst =\
    \ TConstant<int, 100>;\n```\n\nWith C++17 it's a bit simpler:\n\n```cpp\ntemplate\
    \ <auto value> constexpr auto TConstant = value;\nconstexpr auto MySuperConst\
    \ = TConstant<100>;\n```\n\nThere's no need to write explicitly. As one of the\
    \ advanced uses has lots of papers, and articles point to an example of heterogeneous\
    \ compile time list:\n\n```cpp\ntemplate <auto ... vs> struct HeterogeneousValueList\
    \ {};\nusing MyList = HeterogeneousValueList<'a', 100, 'b'>;\n```\n\nBefore C++17\
    \ it was not possible to declare this list directly, some wrapper class would\
    \ have to be provided first.\n\n> Extra Info\nThe change was proposed in: P0127R12.\
    \ In P0127R13, you can find some examples and reasoning.\n\n# Other Changes\n\n\
    In C++17 there are also other language and library features related to templates\
    \ that are worth mentioning:\n\n# Allow typename in a Template Template Parameters.\n\
    \nAllows you to use typename instead of class when declaring a template parameter.\
    \ Normal type parameters can use them interchangeably, but template template parameters\
    \ were restricted to class.\n\nMore information in N4051.\n\n# Allow Constant\
    \ Evaluation for all Non-Type Template Arguments\n\nRemove syntactic restrictions\
    \ for pointers, references, and pointers to members to appear as non-type template\
    \ parameters.\n\nMore information in N4268.\n\n# Variable Templates for Traits\n\
    \nAll the traits that yield ::value accompanying _v variable templates. For example:\n\
    \n```cpp\nstd::is_integral<T>::value has std::is_integral_v<T>\n```\n\n```cpp\n\
    std::is_class<T>::value has std::is_class_v<T>\n```\n\nThis improvement already\
    \ follows the _t suffix additions in C++14 (template aliases) of traits that returns\
    \ ::type. Such change can considerably shorten template code.\n\nMore information\
    \ in P0006.\n"
  mdcn: "\n\n```cpp\nif (std::is_constructible_v<Concrete, int, int, int>)\n  return\
    \ std::make_unique<Concrete>(10, 10, 10);\nelse\n  return nullptr;\n```\n\n在运行时，如果某个分支不会被执行——因为\
    \ `is_constructible_v` 返回 false，但该分支中的代码必须通过编译。\n\n这就是为什么我们需要 `constexpr`，用来“丢弃”代码并只编译匹配的语句。\n\
    \n要修复代码，你需要添加 `constexpr`：\n\n```cpp\ntemplate <typename Concrete, typename...\
    \ Ts>\nstd::unique_ptr<Concrete> constructArgs(Ts&&... params) {\n  if constexpr\
    \ (std::is_constructible_v<Concrete, Ts...>) { // 修复了！\n    return std::make_unique<Concrete>(std::forward<Ts>(params)...);\n\
    \  } else {\n    return nullptr;\n  }\n}\n```\n\n现在，编译器在编译时评估 `if constexpr` 条件，对于表达式\
    \ `auto p = constructArgs<Test>(10, 10, 10);`，整个 `if` 分支将在编译过程的第二步被“移除”。\n\n准确来说，被丢弃的分支并没有完全从编译阶段中移除。只有依赖于条件中使用的模板参数的表达式才不会实例化。语法必须始终保持有效。\n\
    \n例如：\n\n```cpp\ntemplate <typename T>\nvoid Calculate(T t) {\n  if constexpr\
    \ (std::is_integral_v<T>) {\n    // /\n    static_assert(sizeof(int) == 100);\n\
    \  } else {\n    execute(t);\n  }\n  strange syntax\n}\n```\n\n在上面的示例代码中，如果类型\
    \ `T` 是 `int`，则 `else` 分支会被丢弃，这意味着 `execute(t)` 不会被实例化。但 `strange syntax` 这一行仍然会被编译（因为它不依赖于\
    \ `T`），这就是为什么你会收到关于它的编译错误。此外，`static_assert` 还会产生另一个编译错误，该表达式也不依赖于 `T`，因此它总是会被求值。\n\
    \n# C++17 模板简化\n\n在 C++17 之前，如果你有多个版本的算法——取决于类型要求——你可以使用 SFINAE 或标签分发（tag dispatching）来生成专门的重载解析集。\n\
    \n例如：\n\nChapter Templates/sfinae_example.cpp\n\n```cpp\ntemplate <typename T>\n\
    std::enable_if_t<std::is_integral_v<T>, T> simpleTypeInfo(T t) {\n    std::cout\
    \ << \"integral T > \" << t << '\\n';\n    return t;\n}\n```\n\n```cpp\ntemplate\
    \ <typename T>\nstd::enable_if_t<!std::is_integral_v<T>, T> simpleTypeInfo(T t)\
    \ {\n    std::cout << \"not integral \\n\";\n    return t;\n}\n```\n\n在上面的示例中，我们有两个实现，但只有其中一个会进入重载解析集。如果\
    \ `is_integral_v` 对于类型 `T` 为真，则采用第一个函数，第二个第二个则被 SFINAE 拒绝。\n\n使用标签分发也可以发生相同的情况：\n\
    \nChapter Templates/tag_dispatching_example.cpp\n\n```cpp\ntemplate <typename\
    \ T>\nvoid simpleTypeImpl(T t, std::true_type) {\n    std::cout << \"integral\
    \ T > \" << t << '\\n';\n}\n```\n\n```cpp\ntemplate <typename T>\nvoid simpleTypeImpl(T\
    \ t, std::false_type) {\n    std::cout << \"not integral \\n\";\n}\n```\n\n```cpp\n\
    template <typename T>\nvoid simpleTypeInfo(T t) {\n    simpleTypeImpl(t, is_integral<T>{});\n\
    }\n```\n\n与其使用 SFINAE，我们生成一个唯一的标签：`true_type` 或 `false_type`。根据实现情况，只有一个会被选中。我们现在可以使用\
    \ `constexpr` 简化这种模式：\n\n```cpp\ntemplate <typename T>\nvoid simpleTypeInfo(T\
    \ t) {\n    if constexpr (std::is_integral_v<T>) {\n        std::cout << \"integral\
    \ T > \" << t << '\\n';\n    } else {\n        std::cout << \"not integral \\\
    n\";\n    }\n}\n```\n\n编写模板代码变得“自然”，不再需要许多“技巧”。\n\n# 示例\n\n来看几个例子：\n\n# 打印器\n\n\
    你可能已经在书的开头见过这个例子了。让我们深入查看 `linePrinter` 是如何工作的。\n\n```cpp\ntemplate <typename\
    \ T>\nvoid linePrinter(const T& x) {\n    if constexpr (std::is_integral_v<T>)\
    \ {\n        std::cout << \"num: \" << x << '\\n';\n    } else if constexpr (std::is_floating_point_v<T>)\
    \ {\n        auto frac = static_cast<long>(x);\n        std::cout << \"float:\
    \ \" << frac << '\\n';\n    } else {\n        linePrinter(*x);\n    }\n}\n```\n\
    \n`linePrinter` 使用 `constexpr` 来检查输入类型。基于此我们可以输出额外信息。有趣的事情发生在指针类型上——它解引用并递归调用\
    \ `linePrinter`。\n\n# 声明 get<N> 函数\n\n结构绑定适用于具有成员的简单结构：\n\n```cpp\nstruct S {\n\
    \    int n;\n    std::string s;\n    float d;\n};\n```\n\n```cpp\nS s;\nauto [a,\
    \ b, c] = s;\n```\n\n然而，如果你有一个自定义类型（带有私有成员），也可以通过重载 `get<N>` 函数使结构绑定工作。以下是演示此点的的代码：\n\
    \n```cpp\nclass MyClass {\npublic:\n    int GetA() const { return a; }\n    float\
    \ GetB() const { return b; }\n\nprivate:\n    int a;\n    float b;\n};\n```\n\n\
    ```cpp\ntemplate<std::size_t I>\nauto get(MyClass& c) {\n    if constexpr (I ==\
    \ 0) return c.GetA();\n    else if constexpr (I == 1) return c.GetB();\n}\n```\n\
    \n```cpp\n// 支持 tuple 类接口的特化\nnamespace std {\n    template <> struct tuple_size<MyClass>\
    \ : integral_constant<size_t, 2> {};\n\n    template <> struct tuple_element<0,\
    \ MyClass> { using type = int; };\n    template <> struct tuple_element<1, MyClass>\
    \ { using type = float; };\n}\n```\n\n在上面的代码中，优点是将所有内容放在一个函数中。可以通过模板特化来实现：\n\n\
    ```cpp\ntemplate <> auto& get<0>(MyClass& c) { return c.GetA(); }\ntemplate <>\
    \ auto& get<1>(MyClass& c) { return c.GetB(); }\n```\n\n欲更多示例，可以阅读关于用 `constexpr`\
    \ 替换 `std::enable_if` 的章节，以及结构绑定章节中关于 `get<N>` 特化的部分。你也可以查看以下文章：使用 C++17 中的 constexpr\
    \ 简化代码。\n\n# 使用 auto 声明非类型模板参数\n\n这是处处使用 `auto` 策略的另一部分。在 C++11 和 C++14 中，你可以它自动推导变量或返回类型，还有泛型\
    \ lambda。现在你也可以用它来推导非类型模板参数。\n\n例如：\n\n```cpp\ntemplate <auto value> void f()\
    \ { \n    f<10>(); // 推导出 int\n}\n```\n\n这很有用，因为你不需要为非类型参数的类型准备单独的参数。在 C++11/14\
    \ 中：\n\n```cpp\ntemplate <typename Type, Type value> constexpr Type TConstant\
    \ = value;\nconstexpr auto MySuperConst = TConstant<int, 100>;\n```\n\n在 C++17\
    \ 中变得简单了：\n\n```cpp\ntemplate <auto value> constexpr auto TConstant = value;\n\
    constexpr auto MySuperConst = TConstant<100>;\n```\n\n不需要显式编写。作为其高级用法之一，有很多论文，文章指向了异构编译时列表的示例：\n\
    \n```cpp\ntemplate <auto ... vs> struct HeterogeneousValueList {};\nusing MyList\
    \ = HeterogeneousValueList<'a', 100, 'b'>;\n```\n\n在 C++17 之前无法直接声明此列表，必须先提供某些包装类。\n\
    \n> 额外信息\n> 该更改提现在 P0127R12。在 P0127R13 中，你可以找到一些示例和推理。\n\n# 其他更改\n\n在 C++17 中还有其他与模板相关的语言和库特性值得提及：\n\
    \n# 在模板模板参数中使用 typename。\n\n允许在声明模板参数时使用 `typename` 代替 `class`。普通类型参数可以互换使用，但模板模板参数以前被限制为\
    \ `class`。\n\n更多信息见 N4051。\n\n# 允许对所有非类型模板参数进行常量求值\n\n移除了指针、引用和成员指针作为非类型模板参数的语法限制。\n\
    \n更多信息见 N4268。\n\n# 用于特性的变量模板\n\n所有产生 `::value` 的特性都伴随 `_v` 变量模板。例如：\n\n```cpp\n\
    std::is_integral<T>::value 有 std::is_integral_v<T>\n```\n\n```cpp\nstd::is_class<T>::value\
    \ 有 std::is_class_v<T>\n```\n\n这种改进已经遵循了 C++14 为返回 `::type` 的特性添加 `_t` 后缀的做法。这种更改可以显著缩短模板代码。\n\
    \n更多信息见 P0006。\n\n"
