    if (const auto pos = myString.find(\"Hello\"); pos != std::string::npos)\nstd::cout\
    \ << \" Hello\\n\";\n```\n\n```cpp\nif (const auto pos = myString.find(\"World\"\
    ); pos != std::string::npos)\nstd::cout << \" World\\n\";\n```\n\n如前提到的，在 if 语句中定义的变量在\
    \ else 块中也是可见的。因此你可以写：\n\n```cpp\nif (const auto pos = myString.find(\"World\"\
    ); pos != std::string::npos)\nstd::cout << pos << \" World\\n\"\nelse\nstd::cout\
    \ << pos << \" not found!!\\n\";\n```\n\n此外，你可以将其与结构化绑定（遵循 Herb Sutter 的代码）：\n\
    \n```cpp\n// 结合更好：结构化绑定 + if 初始化器\nif (auto [iter, succeeded] = mymap.insert(value);\
