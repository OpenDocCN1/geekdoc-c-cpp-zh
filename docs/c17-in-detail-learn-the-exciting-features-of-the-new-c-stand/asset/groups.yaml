    # 关于作者


    Bartłomiej (Bartek) Filipek 是一位拥有超过12年专业经验的 C++ 开发者。2010年，他毕业于克拉科夫雅盖隆大学，获得计算机科学硕士学位。


    Bartek 目前在 Xara 工作，开发文档编辑器的功能。他在桌面图形、游戏开发、大规模系统以及编写显卡驱动程序方面拥有经验。自2011年以来，Bartek
    经常在 bfilipe.com 上写博客。最初的话围绕图形编程展开，但现在博客的核心是原生 C++。他还是克拉科夫 C++ 用户组的联合组织者。你可以在 CppCast
    节目中听到 Bartek  C++17、博客和文本处理。


    在空闲时间，他喜欢和儿子一起收集乐高模型。


    # 技术评审员


    Jacek Galowicz 是一位拥有十年左右 C++ 专业经验的软件工程师。他在德国亚琛工业大学获得了电气工程硕士学位。


    Jacek 在2017年初创立了 Cyberus Technology GmbH，致力于底层网络安全、虚拟化、微内核和高级测试基础设施的产品。在之前的工作中，他在德国
    Intel 和 FireEye 为 Intel x86 虚拟化实现了性能和安全敏感的微内核操作系统。总而言，他在内核驱动开发、3D 图形编程、数据库、网络通信和物理仿真方面积累了经验，主要使用
    C 或 C++。


    业余，Jacek 维护着一个小小的 C++ 博客，在编写《C++17 STL Cookbook》期间，该博客曾缺乏关注。他是汉诺威和布伦斯瑞克 C++ 用户小组的常客。为了更好地进行元编程和泛型编程，他还学习并使用了
    Haskell，这反过来激发了他将纯函数式编程的优势引入 C++ 的兴趣。


