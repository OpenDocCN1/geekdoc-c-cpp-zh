    \n[content]\n# About the Book\n\nC++11 was a major update for the language. With\
    \ all the modern features like lambdas, constexpr, variadic templates, threading,\
    \ range-based for loops, smart pointers and many powerful elements, it signalled\
    \ enormous progress for the language. Even now, in 2019, many teams struggle to\
    \ modernise their projects to leverage the modern features. Later there was a\
    \ minor update - C++14, which improved some things from the previous Standard\
    \ and added a few smaller elements.\n\nAlthough C++17 is not as big as C++11,\
    \ it's larger than C++14 and brings many exciting additions and improvements.\
    \ This book will guide through all of them!\n\nThe book brings exclusive content\
    \ about C++17 and draws from the experience of many articles that have appeared\
    \ at cppfilepek.com. The material was rewritten from the ground-up and updated\
    \ with the latest information. All of that equipped with lots of new examples\
    \ and practical tips. Additionally, the book provides insight into the current\
    \ implementation status, compiler support, performance issues and other relevant\
    \ knowledge to boost your current projects.\n\n# Who This Book is For\n\nThe book\
    \ is intended for all C++ developers who have at least essential experience with\
    \ C++11/14.\n\nThe principal aim of the book is to equip you with practical knowledge\
    \ about C++17. After reading the book, you'll be able to move past C++11 and leverage\
    \ the latest C++ techniques in your day to day tasks.\n\nPlease don't worry if\
    \ you're not an expert in C++11/14. This book provides the necessary background,\
    \ so you'll get the information in a proper context.\n\n# Overall Structure of\
    \ the Book\n\nC++17 brings a lot of changes to the language and the Standard Library.\
    \ In this book, all the new features were categorised into a few segments, so\
    \ that they are easier to comprehend.\n\nAs a result, the book has the following\
    \ sections:\n\n- Part One - C++17 Language Features\n  - Fixes and Deprecation\n\
    \  - Language Clarification\n  - General Language Features\n  - Templates\n  -\
    \ Attributes\n- Part Two - C++17 The Standard Library (full version only)\n  -\
    \ std::optional\n  - std::variant\n  - std::any\n  - std::string_view\n  - String\
    \ Operations\n  - Filesystem\n  - Parallel STL\n  - Other Changes\n- Part Three\
    \ - More Examples and Use Cases (full version only)\n  - Refactoring with std::optional\
    \ and std::variant\n  - Enforcing Code Contracts With [[nodiscard]]\n  - Replacing\
    \ enable_if if constexpr\n  - How to Parallelise CSV Reader\n- Appendix A - Compiler\
    \ Support\n- Appendix B - Resources and Links\n\nPart One, about the language\
    \ features, is shorter and will give you a quick run over the most significant\
    \ changes. You can read it in any order you like.\n\nPart Two (full version only),\
    \ describes a set of new types and utilities that were added to the Standard Library.\
    \ The helper types create a potential new vocabulary for C++ code: like when you\
    \ use optional, any variant or string_view. And what's more, you have powerful\
    \ capabilities, especially in the form of parallel algorithms and the standard\
    \ filesystem. A lot of examples in this part will use many other features from\
    \ C++17.\n\nPart Three (full version only) brings together all the changes in\
    \ the language and shows examples where a lot of new features are used alongside.\
    \ You'll see discussions about refactoring, simplifying code with new template\
    \ techniques or working with parallel STL and the filesystem. While the first\
    \ and second part can also be used as a reference for individual changes, the\
    \ third part shows more of larger C++17 patterns that join many features.\n\n\
    A considerable advantage of the book is the fact that with each new feature you'll\
    \ get information about the compiler support and the current implementation status.\
    \ That you'll be able to check if a particular version of the most popular compilers\
    \ (MSVC, GCC or Clang) implements it or not. The book also gives practical hints\
    \ on how to apply techniques in your current codebase.\n\n# Reader Feedback\n\n\
    If you spot an error, a typo, a grammar mistake... or anything else (especially\
    \ logical issues!) that should be corrected, then please send your feedback to\
    \ bartlomiej.filipek.com.\n\nYou can also use two places to leave your feedback:\n\
    \n- Leanpub Book's Feedback Page⁸\n- GoodReads Book's Page⁹\n\n# Example Code\n\
    \nYou can find the ZIP package with all the example on the book's website:\n\n\
    cppindetail.com/data/cpp17indetail.zip¹⁰\n\n> ⁸https://leanpub.com/cpp17indetail/feedback\n\
    ⁹https://www.goodreads.com/book/show/4147221-c-17-in-detail\n¹⁰https://www.cppindetail.com/data/cpp17indetail.zip\n\
    \nThe same ZIP package should also be attached with the ebook.\n\nMany examples\
    \ in the book are relatively short. You can copy and paste the lines into your\
    \ favourite compiler/IDE and then run the code snippet.\n\n# Code License\n\n\
    The code for the book is available under the Creative Commons License.\n\n# Compiling\n\
    \nTo use C++17 make sure you provide a proper flag for your compiler:\n\n- For\
    \ GCC (at least 7.1 or 8.0 or newer): use -std=c++17 or -std=c++2a\n- For Clang\
    \ (at least 4.0 or newer): use -std=c++17 or -std=c++2a\n"
  mdcn: "\n\n# 关于本书\n\nC++11 是该语言的一次重大更新。凭借 lambda、constexpr、变长模板、多线程、基于范围的 for 循环、智能指针许多强大元素等现代特性，它标志着该语言的巨大进步。即使在现在（2019\
    \ 年），许多团队仍在努力使他们的项目现代化，以利用这些现代特性。后来又有了一个小版本更新——C++14，它改进了之前标准中的某些内容并添加了一些较小的元素。\n\
    \n虽然 C++17 不如 C++11 那么大，但它比 C++14 大，并带来了许多令人兴奋的新增和改进。本书将引导你了解所有这些！\n\n本书提供了关于\
    \ C++17 的独家内容，并借鉴了出现在 cppfilepek.com 上大量文章的经验。素材从头开始重写，并用最新信息进行了更新。所有内容都配备了大量新示例和实用技巧。此外，本书还提供了当前实现状态、编译器支持、性能问题和其他相关知识的见解，以助力你当前的项目。\n\
    \n# 本书适合读者\n\n本书适用于所有对 C++11/14 至少具有基础经验的 C++ 开发者。\n\n本书的主要目标是让你具备关于 C++17 的实用知识。阅读完本书后，你将能够超越\
    \ C++11，并在日常任务中利用最新的 C++ 技术。\n\n如果你不是 C++11/14 专家，请不要担心。本书提供了必要的背景知识，使你能够在适当的语文中获取这些信息。\n\
    \n# 本书的整体结构\n\nC++17 为语言和标准库带来了许多变化。在书中，所有新特性被归类为几个部分，以便理解。\n\n因此，本书包含以下章节：\n\n\
    - 第一部分 - C++17 语言特性\n  - 修复与弃用\n  - 语言说明\n  - 通用语言特性\n  - 模板\n  - 属性\n- 第二部分 -\
