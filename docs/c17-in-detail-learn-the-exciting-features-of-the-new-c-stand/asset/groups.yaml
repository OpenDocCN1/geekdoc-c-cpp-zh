    \n# 折叠表达式\n\nC++11 引入了变长模板，这是一个强大的功能，特别是当你想要处理可数量的输入参数时。例如，以前（C++11 之前）你必须编写多个版本的模板函数（一个参数、两个参数、三个参数……）。\n\
    仍然，当你实现像 `sum`、`all` 这样的“递归”函数时，变长模板需要一些额外的代码。\n例如：\n\n```cpp\nauto Sum11() {\n\
    \    return 0;\n}\n\ntemplate<typename ...Args>\nauto Sum11(T s, T... ts) {\n\
    \    return s + ts...;\n}\n```\n\n使用 C++17我们可以编写更简单的代码：\n\n```cpp\ntemplate<typename\
    \ ...Args> auto sum(Args ...args) {\n    return (args + ... + 0);\n}\n\n// 或者：\n\
    template<typename ...Args> auto sum2(Args ...args) {\n    return (args + ...);\n\
    }\n```\n\n二元运算符的折叠表达式变体如下：\n\n| 表达式 | 名称 | 展开 |\n|---|---|---|\n| (... op e) |\
    \ 一元左折叠 | ((e1 op e2) ... opN) |\n| (init op ... e) | 二元左折叠 | (((init e1) op e2)\
    \ ... opN) |\n| (e op ... op) | 一元右折叠 | e op (... (eN-1 op)) |\n| (e op ... init)\
    \ | 二元右折叠 | e op (... (eN-1 op init)) |\n\n> *op 是以下任何二元运算符之一：`+ - / % << >> *=\
    \ %= |= <= != >=`。在二元折叠中，运算符必须相同。\n例如，当你写下：\n\n```cpp\ntemplate<typename...Args>\
    \ auto sum2(Args...args) {\n    return (args + ...); // 对 '+' 的一元折叠\n}\n\nauto\
    \ value = sum2(1, 2, 3, 4); // 模板函数展开为：auto value = 1 + (2 + (3));\n\n此外，对于空包我们默认获得以下值：\n\
    \n| 运算符 | 默认值 |\n|---|---|\n| && | true |\n| || | false |\n| , | 格式错误 |\n\n这就是为什么你不能带任何参数调用\
    \ `sum2()`，一元折叠运算符没有默认值。\n\n# 更多示例\n\n这是一个使用 P0036R0 进行折叠的良好实现：\n\n```cpp\ntemplate<typename\
    \ ...Args>\nvoid FoldPrint(Args&&... args) {\n  (std::cout << ... << std::forward<Args>(args));\n\
    }\n\nFoldPrint(\"hello\", 10, 30);\n```\n\n然而，上面的 `FoldPrint` 将逐个打印参数，没有任何分隔符。对于上面的调用，你会看到\
    \ \"hello1030\"。如果你想要分隔符更多的格式选项，你必须修改技术并使用逗号折叠：\n\n```cpp\ntemplate<typename ...Args>\n\
    void FoldSeparate(Args&&... args) {\n  auto separateLine = [](const auto& v) {\n\
    \    std::cout << v << '\\n';\n  };\n  (..., separateLine(std::forward<Args>(args)));\
    \ // 逗号运算符\n}\n```\n\n使用逗号运算符折叠的技术非常方便。它的另一个例子可能是 `push_back` 的特殊版本：\n\n```cpp\n\
    template<typename T, typename ...Args>\nvoid push_back_vec(std::vector<T>& v,\
    \ Args&&... args) {\n  (v.push_back(std::forward<Args>(args)), ...);\n}\n```\n\
    \n```cpp\nstd::vector<float> vf;\npush_back_vec(vf, 10.5f, 0.7f, 1.1f, 0.8f);\n\
    ```\n\n通常情况下，折叠表达式允许你编写更整洁、更短且可能更易读的代码。\n\n> 额外信息\n> 该更改是在 N4295 和 P0036R0 中提出的。\n\
    > https://wg21.link/n4295\n> https://wg21.link/p0036r0\n\n# if constexpr\n\n这是一个大！C++\
    \ 的编译时 if！！\n\n该功能允许你根据常量表达式条件在编译时丢弃 `if` 语句的分支。\n\n```cpp\nif constexpr (cond)\n\
    \    statement1; // cond 为 false 时丢弃\nelse\n    statement2; // cond 为 true 时丢弃\n\
    ```\n\n例如：\n\n```cpp\ntemplate <typename T>\nauto get_value(T t) {\n    if constexpr\
    \ (std::is_pointer_v<T>)\n        return *t;\n    else\n        return t;\n}\n\
    ```\n\n`if constexpr` 具有简化大量模板代码，特别是在使用标签分发、SFINAE 或预处理器技术时。\n\n# 为什么要在编译时？\n\n\
    起初你可能会问，为什么我们需要 `if constexpr` 和那些复杂的模板表达式……普通的 `if` 不行吗？\n\n这里有一个代码示例：\n\n```cpp\n\
