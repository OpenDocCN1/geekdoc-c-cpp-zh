  - '[PAGE 38]


    # Updated Value Categories


    In C++98/03, we had two basic categories of expressions:


    +   - lvalue - an expression that can appear on the left-hand side of an assignment

    - rvalue - an expression that can appear only on the right-hand side of an assignment


    C++11 extended this taxonomy (due to the move semantics), with three more categories:


    +   - xvalue - an Expiring lvalue

    - prvalue - a pure rvalue, an xvalue, a temporary object or subobject, or a value
    that is not associated with an object.

    - glvalue - a generalised lvalue, which is an lvalue or an xvalue


    Examples:


    ```

    std::string str;

    str;             // lvalue

    42;             // prvalue

    str + "10"       // prvalue

    std::move(str); // xvalue

    ```


    Here’s a diagram that shows how the categories are related:


    ![](img/ac44c350c2a527cc3a8ffb11074f162a_38_0.png)'
  - '[PAGE 39]


    # Language Clarification


    There are three core categories (below with colloquial “definitions”):


    +   * lvalue - an expression that has an identity, and which we can take the address
    of

    * xvalue - “expiring lvalue” - an object that we can move from, which we can reuse.

    Usually, its lifetime ends soon

    * prvalue - pure rvalue - something without a name, which we cannot take the address
    of, which we can move from this expression


    To support Copy Elision, the authors of the proposal provided the updated definitions
    of glvalue and prvalue. the Standard³.


    > * glvalue - A glvalue is an expression whose evaluation computes the location
    of an object, bit-field, or function

    * prvalue - A prvalue is an expression whose evaluation initialises an object,
    bit-field, or operand of an operator, as specified by the context in which it
    appears


    For example:


    ```

    class X { int a; };

    X{10} // this expression is prvalue

    x x; // x is lvalue

    x.a // it''s lvalue (location)

    ```


    In short: prvalues perform initialisation, glvalues describe locations. The C++17
    Standard specifies when there’s a prvalue initialising some glvalue, then there’s
    no need to create a temporary and we can defer its materialisation.


    In C++17 Copy Elision/Deferred Temporary Materialization happens when:


    +   * in initialisation of an object from a prvalue: Type = T())

    * in a function where the function returns a prvalue - like in our examples.


    # Extra Info


    The change was proposed in: P0135R0 (reasoning) - and P0135R1 (wording).


    ⁴https://timsong-cpp.github.io/cpppp/n4659/basic.lvl

    ⁵https://wg21.cpp.link/p0135r

    ⁶https://wg21.cpp.link/p0135r1'
  - "[PAGE 40]\n\n# Dynamic Memory Allocation for Over-Aligned Data\n\nEmbedded environments,\
    \ kernel, drivers, game development and other areas might require a non-default\
    \ alignment for memory allocations. Complying those requirements might improve\
    \ the performance or satisfy some hardware interface.\n\nFor example, perform\
    \ geometric data processing using SIMD* instructions, you might need 16-byte or\
    \ 32-byte alignment for structures that hold 3D coordinates:\n\n```\nstruct alignas(32)\
    \ Vec3d { // alignas is available since C++11\n  double x, y, z;\n}\nauto pVectors\
    \ = new Vec3d[1000];\n```\n\nVec3d holds double fields, and usually, its natural\
    \ alignment should be 8 bytes. Now, with alignas keyword, we change this alignment\
    \ to 32. Approach allows the compiler to fit the objects into SIMD registers like\
    \ AVX (256-bit-width).\n\nUnfortunately, in C++/14, you have no guarantee that\
    \ the memory will be aligned after new[]. Often, you have use routines like std::aligned_alloc()\
    \ or MSVC's _aligned_malloc() to be sure alignment is preserved. This is not ideal\
    \ as it's not working easily with smart pointers and makes memory management visible\
    \ in the code.\n\nC++17 fixes that hole by introducing new memory allocation function\
    \ overloads for new() and delete() with the align_val_t parameter. Example function\
    \ signatures below:\n\n```\nvoid* operator new(size_t, align_val_t);\nvoid operator\
    \ delete(void*, size_t, align_val_t);\n```\n\nThe Standard defines __STDCPP_DEFAULT_NEW_ALIGNMENT__\
    \ macro that specifies the default alignment for dynamic memory allocation. On\
    \ common platforms, Clang, GCC and MSVC specify it as 16 bytes.\n\nNow, in C++17,\
    \ you allocate:\n\n```\nauto pVectors = new Vec3d[1000];\n```\n\n> *Single Instruction,\
    \ Multiple Data, for example, SSE2, AVX, see https://en.wikipedia.org/wiki/Streaming_SIMD_Extensions\n\
    *See all 22 new() overloads at https://en.cppreference.com/wpp/memory/new/operator_new"
- md: "\n# Language Clarification\n\nThe alignment for Vecd3 is larger than __STCPP_DEFAULT_NEW_ALIGNMENT__,\
    \ thus the compiler will select the overloads with the align_val_t parameter.\n\
    \n> In Clang and GCC you can control the alignment by the new-alignment switch\
    \ (see Clang's documentation¹⁰). The MSVC compiler exposes the /Z:alignedNew¹\
    \ flag that turns the feature on or off.\n\nWe can also provide custom implementation,\
    \ we have a look:\n\nChapter Clarification/aligned_new.cpp\n\n```cpp\nvoid* operator\
    \ new(size_t size, std::align_val_t align) {\n#if defined(__WIN32) || defined(__CYWIN__)\n\
    \    auto ptr = _aligned_malloc(size, static_cast<std::size_t>(align));\n#else\n\
    \    auto ptr = std::aligned_alloc(static_cast<std::size_t>(align), size);\n\n\
    \    if (!ptr) throw std::bad_alloc();\n\n    std::cout << \"new: \" << size <<\
    \ \", \"\n              << static_cast<std::size_t>(align) << \", \" << ptr <<\
    \ std::endl;\n    return ptr;\n#endif\n}\n\nvoid operator delete(void* ptr, std::size_t\
    \ size, std::align_val_t align) noexcept {\n#if defined(__WIN32) || defined(__CYWIN__)\n\
    \    _aligned_free(ptr);\n#else\n    if (ptr) {\n        std::cout << \"delete:\
    \ \" << size << \", \"\n                  << static_cast<std::size_t>(align) <<\
    \ \", \" << ptr << std::endl;\n        std::free(ptr);\n    }\n#endif\n}\n\nvoid\
    \ operator delete(void* ptr) noexcept {\n#if defined(__WIN32) || defined(__CYWIN__)\n\
    \    _aligned_free(ptr);\n#else\n    std::free(ptr);\n#endif\n}\n```\n\nThe code\
    \ uses `_aligned_malloc()` and `_aligned_free()` for the Windows version¹ because\
    \ Windows platform uses different allocation mechanisms for over-aligned data.\n\
    \n¹⁰ https://clang.llvm.org/docs/ClangReference.html#option-alignment\n¹ https://docs.microsoft.com/en-us/cpp/build/cpp/alignednew?vs=19\n\
    ¹² applies to MSVC, MinGW, Clang on Windows or Cygwin, and that's why `std::free()`\
    \ wouldn't release the memory correctly. On other platforms that conform with\
    \ C++11 can use `std::aligned_alloc()`, since C++17 the Standard is based on C++11\
    \ specification.\n\nThe new functionality can significantly improve the code,\
    \ and you can now hold aligned objects in standard containers without writing\
    \ custom allocators or custom deleters. For example:\n\nChapter Clarification/aligned_new.cpp\n\
    \n```cpp\nstd::vector<Vecd3> vec;\nvec.push_back({});\nvec.push_back({});\nassert(reinterpret_cast<uintptr_t>(vec.data())\
    \ % alignof(Vecd3) == 0);\n```\n\nWhen executed, allocation might log the following:\n\
    \n```\nnew: 32, align: 32, ptr: 0x000001F86625960\nnew: 64, align: 32, ptr: 0x000001F86625680\n\
    delete: 32, align: 32, ptr: 0x000001F86625960\nnew: 96, align: 32, ptr: 0x000001F86625EA0\n\
    delete: 64, align: 32, ptr: 0x000001F86625680\ndelete: 96, align: 32, ptr: 0x000001F86625EA0\n\
    ```\n\nThe example allocates for a single entry, then it deletes and increases\
    \ the size for the vector to make space for all elements. At the end we check\
    \ the pointer alignment to be aligned to 32 bytes. You can read more about experiments\
    \ with the new functionality at New() - Alignment Parameter for operator()³. This\
    \ blog post also shows the dangerous side when you ask for non-standard alignment\
    \ with placement new.\n\n# Extra Info\n\nThe change was proposed in: P0035⁴.\n\
    \n# Exception Specifications in the Type System\n\nException Specification for\
    \ a function didn't belong to the type of the function, but now it will be part\
    \ of it. You can now have two overloads: one with noexcept and the second without\
    \ it. See below:\n\nChapter Clarification/func_noexcept_type.cpp\n\n```cpp\nusing\
    \ TnoexceptFunc = void() noexcept;\nvoid SimpleNoexceptCall(TnoexceptFunc f) {\
    \ f(); }\n\nusing TVoidFunc = void();\nvoid SimpleCall(TVoidFunc f) { f(); }\n\
    \nvoid fnoexcept() noexcept { }\nvoid fRegular() { }\n\nint main() {\n  SimpleNoexceptCall(fnoexcept);\n\
    \  // SimpleNoexceptCall(fRegular); // cannot convert\n  SimpleCall(fnoexcept);\
    \ // converts to regular function\n  SimpleCall(fRegular);\n}\n```\n\nA pointer\
    \ to noexcept function can be converted to a pointer to a regular function (this\
    \ also works for a pointer to member function). But it's not possible the other\
    \ around (from a regular function pointer into a function pointer that is marked\
    \ with noexcept).\n\nOne of the reasons for adding the feature is chance to optimise\
    \ the code better. If the compiler has a guarantee that a function won't throw,\
    \ then it can generate faster code.\n\nAlso, as described in the previous chapter\
    \ about Language Fixes, in C++17, the Exception Specification is cleaned up. Effectively,\
    \ you can only use the noexcept specifier⁵ for declaring a function that won't\
    \ throw.\n\n# Extra Info\n\nThe change was proposed in: P0012R1⁵.\n\n¹⁵ http://en.cppreference.com/w/cpp/language/noexcept_spec\n\
    ¹⁶ http://wg21.link/p0012r1\n\n# Compiler Support\n\n| Feature | GCC | Clang |\
    \ MSVC | C++ Builder |\n|---|---|---|---|---|\n| Stricter expression evaluation\
    \ order | 7.0 | 4.0 | VS 2017 | 10.3 |\n| Guaranteed copy elision | 7.0 | 4.0\
    \ | VS 2017 | 15.6 |\n| Exception specifications part of the type system | 7.0\
    \ | 4.0 | VS 2017 | 15.5 |\n| Dynamic memory allocation for over-aligned data\
    \ | 7.0 | 4.0 | VS 2017 | 15.5 |\n\n# 4. General Language Features\n\nIn this\
    \ section of the book, we'll look at widespread improvements to the language that\
    \ have the potential to make your code more compact and expressive. A perfect\
    \ example of such a general feature is structured binding. Using that feature,\
    \ you can leverage a comfortable syntax for tuples (and tuple-like expressions).\
    \ Something easy in other languages like Python is now possible with C++17.\n\n\
    In this chapter, you'll learn:\n\n- Structured bindings/Decomposition declarations\n\
    - How to provide Structured Binding interface for your custom classes\n- Init-statement\
    \ for if/switch\n- Inline variables and their impact on header-only libraries\n\
    - Lambda expressions that might be used in a constexpr\n- How to properly wrap\
    \ this pointer in lambda expressions\n- Simplified use of nested namespaces\n\
    - How to test for header existence\n\n# Structured Binding Declarations\n\nDo\
    \ you often work with tuples or pairs? If not, you should start looking into those.\
    \ Structured binding enables you to bundle data into variables. Consider a function\
    \ that returns two results:\n\n```cpp\nstd::pair<int, bool> InsertElement(int\
    \ el) { ... }\n```\n\nYou can write:\n\n```cpp\nauto ret = InsertElement();\n\
    ```\n\nAnd then refer to .first or .second. However, referring to values as .first\
    \ or .second is also not expressive. Alternatively, you can use std::tie which\
    \ will unpack the tuple/pair into local variables:\n\n```cpp\nint index { 0 };\n\
    bool flag { false };\nstd::tie(index, flag) = mySet.insert(10);\n```\n\n```cpp\n\
    if (inserted)\n    std::cout << \"Value was inserted\\n\";\n```\n\nAs you see,\
    \ such a simple pattern - returning several values from a function - requires\
    \ several lines of code. Fortunately, C++17 makes it much simpler!\n\n# The Syntax\n\
    \nThe basic syntax for structured bindings is as follows:\n\n```cpp\nauto [a,\
    \ b, c, ...] = expression;\nauto [a, b, c, ...] { expression };\nauto [a, b, c,\
    \ ...] ( expression );\n```\n\nThe compiler introduces all identifiers from the\
    \ a, b, c, ... list as names in the surrounding scope and binds them to sub-objects\
    \ or elements of the object denoted by expression.\n\nBehind the scenes, the compiler\
    \ might generate the following pseudo code:\n\n```cpp\nauto tempTuple = expression;\n\
    using a = tempTuple.first;\nusing b = tempTuple.second;\nusing c = tempTuple.third;\n\
    ```\n\nConceptually, the expression is copied into a tuple-like object (tempTuple)\
    \ with variables that are exposed through a, b and c. The temporary object has\
    \ a unique name assigned by the compiler.\n"
