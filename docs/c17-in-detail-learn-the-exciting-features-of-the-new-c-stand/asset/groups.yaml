  - "[PAGE 80]\n\n# Line Printer\n\nYou might have already seen the below example\
    \ in the Jump Start section at the beginning of this Part of the book. Let’s dive\
    \ into the details and see how the code works.\n\n```\ntemplate<typename> void\
