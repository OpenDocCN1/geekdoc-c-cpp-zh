- md: '

    ## Additional Reviewers & Supporters


    Without the support of many good people, this book would have been far less than
    it is. It is a great pleasure to thank them. A lot of people read drafts, found
    errors, pointed out confusing explanations, suggested different wording, tested
    programs, and offered support and encouragement. Many reviewers generously supplied
    insights and comments that I was able to incorporate into the book. Any mistakes
    that remain are, of course, my own.


    Thanks specially to the following reviewers, who commented on large sections of
    the book, smaller parts or gave me a general direction for the whole project.


    - Patrice Roy - Patrice has been playing with C++, either professionally, for
    pleasure (most of the time) for over 20 years. After a few years doing R&D and
    working on military flight simulators, he moved on to academics and has been teaching
    computer science since 1998. Since 2005, he''s been more specifically in helping
    graduate students and professionals from the fields of real-time systems and game
    programming develop the skills they need to face today''s challenges. The rapid
    evolution of C++ in recent years has made his job more enjoyable.

    - Jonathan Bocara - Jonathan is a passionate C++ developer working on large codebase
    of financial software. His interests revolve around making code expressive. He
    has created and regularly blogs on Fluent C++, where he explores how to use the
    C++ language to write expressive code, making existing code clearer, and also
    how to keep your spirits up when facing unclear code.

    - Łukasz Rachwalski - Software engineer - founder C++ User Group Krakow.

    - Michał Czaja - C++ software developer and network engineer. Works in telecom
    industry since 2009.

    - Arne Mertz - Software Engineer from Hamburg, Germany. He is a C++ and clean
    code enthusiast. He''s the author of the Simplify C++2 blog.

    - JFT - Has been involved with computer programming and “computer techy stuff”
    for over 45 years - including OS development and teaching c++ in the mid 1990''s.

    - Victor Ciura - Senior Software Engineer at CAPHYON and Technical Lead on the
    Advanced Installer team. For over a decade, he designed and implemented several
    core components and libraries of Advanced Installer. He''s a regular guest at
    Computer Science Department of his Alma Mater, University of Craiova, where he
    gives student lectures & workshops on "Using C++STL for Competitive Programming
    and Software Development”. Currently, he spends most of his time with his team
    on improving and extending the repackaging and virtualization technologies in
    Advanced Installer IDE, helping clients migrate their Win32 desktop apps to the
    Windows Store (MSIX).

    - Karol Gasiński - Tech Lead on macOS VR in Apple’s GPU SW Architecture Team.
    As a member of KRONOS group, he contributed to OpenGL 4.4 and OpenGL ES 3.1 Specifications.
    Except for his work, Karol’s biggest passion is game development and low-level
    programming. He conducts research in the field of VR, new interfaces and game
    engines. In game industry is known from founding WGK conference. In the past,
    he was working on mobile versions of such games as Medieval Total War, Pro Evolution
    Soccer and Silent Hill.

    - Marco Arena - Software Engineer and C++ in the Specialist building mission critical
    and high performance software products in the Formula 1 Industry. Marco is very
    active in the C++ ecosystem as a blogger, speaker and organizer: he founded the
    Italian C++ Community in 2013, he joined isocpp.org editors in 2014 and has been
    involved in community activities for many years. Marco has held the Microsoft
    MVP Award since 2016. Discover more at marcoarena.com.

