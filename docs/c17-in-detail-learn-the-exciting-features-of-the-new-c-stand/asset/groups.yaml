    \ not. Below there are three things that might look like a fix for something that\
    \ was missing or not working in the previous rules.\n\n## New auto rules for direct-list-initialisation\n\
    \nSince C++11 there's been a strange problem where:\n\n```cpp\nauto x = { 1 };\n\
    ```\n\nIs deduced as std::initializer_list<int>. Such behaviour is not intuitive\
    \ as in cases you should expect it to work like x { 1 };\n\nBrace initialisation\
    \ is the preferred pattern in- modern C++, but such exceptions make the feature\
    \ weaker.\n\nWith the new Standard, we can fix this so that it will deduce int.\n\
    \nTo make this happen, we need to understand two ways of initialisation - copy\
    \ and direct:\n\n```cpp\n// foo() is a function that returns some Type by value\n\
    auto x = foo();           // copy-initialisation\nauto x(foo());            //\
    \ direct-initialisation, initializes an\n                                 // initializer_list\
    \ (until C++17)\n```\n\n```cpp\nint x = foo();           // copy-initialisation\n\
    int x{foo()};          // direct-initialisation\n```\n\nFor the direct initialisation,\
    \ C++17 introduces new rules:\n\n- For a braced-init-list with a single element,\
    \ auto deduction will deduce from that entry.\n- For a braced-init-list with more\
    \ than one element, auto deduction will be ill-formed.\n\nRemoved or Fixed Language\
    \ Features\n\nFor example:\n\n```cpp\nauto x1 = { 1, 2 };    // decltype(x1) is\
    \ std::initializer_list<int>\nauto x2 = { 1, 2.0 };   // error: cannot deduce\
