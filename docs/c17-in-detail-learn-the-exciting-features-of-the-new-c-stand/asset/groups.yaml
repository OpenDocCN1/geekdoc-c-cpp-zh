    # std::void_t Transformation Trait


    A surprisingly simple¹⁹ metafunction that maps a list of types into void:


    ```

    template<class...>

    using void_t = void;

    ```


    void_t is very hasty to SFINAE ill-formed types. For example it might be used
    to detect a function overload:


    ```

    void Compute(int &) { } // example function


    template<typename T>

    struct is_compute_available : std::false_type {};


    template<typename T>

    struct is_compute_available<decltype(Compute(std::declval<T>()))> : std::true_type
    {};


    static_assert(is_compute_available<int&>::value);

    static_assert(!is_compute_available<double&>::value);

    ```


    is_compute_available checks if a Compute() overload is available for the given
    template parameter. If the expression decltype(Compute(std::declval<T>())) is
    valid, the compiler will select the template privatisation. Otherwise, it’s SFINAE,
    and the primary template is chosen.


    More information in N3911¹⁰.'
