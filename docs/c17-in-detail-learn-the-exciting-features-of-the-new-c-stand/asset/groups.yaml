    # About the Author


    Bartłomiej (Bartek) Filipek is a C++ developer with more than 12 years of professional
    experience. In 2010 he graduated from Jagiellonian University in Cracow with a
    Masters Degree in Computer Science.


    Bartek currently works at Xara, where he develops features for document editors.
    He also has experience with desktop graphics, game development, large-scale systems,
    writing graphics drivers. In the past, Bartek has also taught programming (mostly
    game and graphics courses) at local universities.


    Since 2011 Bartek has been regularly blogging at bfilipe.com. Initially, the topics
    revolved around graphics programming, but now the blog focuses on core C++. He''s
    also a co-organiser of the C++ User Group in Cracow. You can hear Bartek in one
    CppCast episode where he talks about C++17, blogging and text processing.


    In his spare time he loves collecting and assembling Lego models with his little
    son.


    # Technical Reviewer


    Jacek Galowicz is a Software Engineer with roughly a decade of professional experience
    in C++. He got his master of science degree in electrical engineering at RWTH
    Aachen University in Germany.


    Jacek co-founded the Cyberus Technology GmbH in early 2017 and works on products
    around low-level cybersecurity, virtualization, microkernels, and advanced testing
    infrastructure. At former jobs, he implemented performance- and security-sensitive
    microkernel operating systems for Intel x86 virtualization at Intel and FireEye
    in Germany. In general, he gained experience with kernel driver development, 3D
    graphics programming, databases, network communication, physics simulation, mostly
    in C or C++.


    In his free time, Jacek maintains a little C++ blog, which has seen some lack
    of love while he wrote the C++17 STL Cookbook. He is a regular visitor of the
    C++ Usergroups in Hannover and Braunschweig. In order to do meta programming and
    generic programming better, he also learned and uses Haskell, which in turn sparked
    his interest to generally bring the advantages of purely functional programming
    to C++.

