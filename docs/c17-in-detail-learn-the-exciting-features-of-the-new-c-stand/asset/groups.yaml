    # General Language Features


    Alternatively, you can also use explicit get<> specialisations rather than if
    constexprpr:


    ```

    template<> string get<0>(const UserEntry& u) { return u.getName(); }

    template<> unsigned get<1>(const UserEntry& u) { return u.getAge(); }

    ```


    For a lot of types, writing two (or several) functions might be more straightforward
    using constexprpr.


    Now you can use UserEntry in a structured binding, for example:


    ```

    UserEntry u;

    u.Load();

    auto [name, age] = u; // read access

    std::cout << name << " " << age << ''\n'';

    ```


    This example only allows read access of the class. If you want write access, the
    class should also provide accessors that return references to members. Later you
    have to implement constexpr with references support.


