  - "[PAGE 77]\n\n```\nif (std::is_constructible_v<Concrete, int, int, int>)\n  return\
    \ std::make_unique<Concrete>(10, 10, 10);\nelse\n  return nullptr;\n```\n\nDuring\
    \ the runtime, if which branch wont be executed - as is_constructible_v returns\
    \ false, yet the code in the branch must compile.\n\nThat's why we need constexpr,\
    \ to \"discard\" code and compile only the matching statement.\n\nTo fix the code\
    \ you have to add constexpr:\n\n```\ntemplate <typename Concrete, typename...\
    \ Ts>\nstd::unique_ptr<Concrete> constructArgs(Ts&&... params) {\n  if constexpr\
    \ (std::is_constructible_v<Concrete, Ts...>) { // fixed!\n    return std::make_unique<Concrete>(std::forward<Ts>(params)...);\n\
    \  else\n    return nullptr;\n);\n```\n\nNow, the compiler evaluates the if constexpr\
    \ condition at compile-time and for the expression auto p = constructArgs<Test>(10,\
    \ 10, 10); the whole if branch will be \"removed\" from the second step of the\
    \ compilation process.\n\nTo be precise, the discarded branch is not entirely\
    \ removed from the compilation phase. Only expressions that are dependent on the\
    \ template parameter used in the condition are not instantiated. The syntax must\
    \ always be valid.\n\nFor example:\n\n```\ntemplate <typename T>\nvoid Calculate(T\
    \ t) {\n  if constexpr (std::is_integral_v<T>) {\n    // /\n    static_assert(sizeof(int)\
    \ == 100);\n  }\nelse\n    execute(t);\n    strange syntax\n}\n```"
  - "[PAGE 78]\n\nIn the above artificial code, if the type T is int, then the else\
    \ branch is discarded, which means execute(t) won't be instantiated. But the line\
    \ strange syntax will still be compiled (as it's not dependent on T) and that's\
    \ why you'll get a compile error about that. Furthermore, another compilation\
    \ error will come from static_assert, the expression is also not dependent on\
    \ T, and that's why it will always be evaluated.\n\n# Template C++17 Simplification\n\
    \nBefore C++17 if you have several versions of an algorithm - depending on the\
    \ type requirements - you could use SFINAE or tag dispatching to generate a dedicated\
    \ overload resolution set.\n\nFor example:\n\nChapter Templates/sfinae_example.cpp\n\
    \n```\ntemplate <typename T>\nstd::enable_if_t<std::is_integral_v<T>, T> simpleTypeInfo(T\
    \ t) {\n    std::cout << \"foointegral T > \" << t << '\\\\n';\n    return t;\n\
    }\n```\n\n```\ntemplate <typename T>\nstd::enable_if_t<std::is_integral_v<T>,\
    \ T> simpleTypeInfo(T t) {\n    std::cout << \"not integral \\n\";\n    return\
    \ t;\n}\n```\n\nIn the above example, we have two function implementations, but\
    \ only one of them will end up in the overload resolution set. If std::is_integral_v\
    \ is true for the T type, then the top function is taken, and the second one rejected\
    \ to SFINAE.\n\nThe same thing can happen when using tag dispatching:"
  - "[PAGE 79]\n\n# Chapter Templates/tag_dispatching_example.cpp\n\n```\ntemplate\
    \ <typename T>\nT simpleTypeInfoImpl(T t, std::true_type) {\n    std::cout <<\
    \ \"foo<integral T>\" << t << '\\\\n';\n    return t;\n}\n```\n\n```\ntemplate\
    \ <typename T>\nT simpleTypeInfoImpl(T t, std::false_type) {\n    std::cout <<\
    \ \"not integral \\n\";\n    return t;\n}\n```\n\n```\ntemplate <typename T>\n\
    T simpleTypeInfo(T t) {\n    return simpleTypeInfoImpl(t, std::is_integral<T>{});\n\
    }\n```\n\nInstead of SFINAE, we generate a unique type tag for the condition:\
    \ true_type or false_type. Depending on one implementation, the result, only one\
