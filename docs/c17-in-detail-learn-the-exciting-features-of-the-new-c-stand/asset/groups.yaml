    \nChapter Chapter General Language Features/custom_structured_bindings.cpp\n\n\
    ```\nclass UserEntry {\npublic:\n    void Load() { }\n\n    std::string GetName()\
    \ const { return name; }\n    unsigned GetAge() const { return age; }\nprivate:\n\
    \    std::string name;\n    unsigned age;\n    size_t cacheEntry { 0 }; // not\
    \ exposed\n};\n```\n\nThe interface for Structured Bindings:\n\nChapter Chapter\
    \ General Language Features/custom_structured_bindings.cpp\n\n```\n// with if\
    \ constexpr\ntemplate <size_t I> auto get(const UserEntry & u) {\n    if constexpr(I\
    \ == 0) return u.GetName();\n    else if constexpr(I == 1) return u.GetAge();\n\
    }\n\nnamespace std {\ntemplate <> struct tuple_size<UserEntry> : integral_constant<size_t,\
    \ 2> { };\n\ntemplate <> struct tuple_element<0,UserEntry> { using type = std::string;\
    \ };\ntemplate <> struct tuple_element<1,UserEntry> { using type = unsigned; };\n\
    }\n\n```\n\ntuple_size specifies how many fields are available, tuple_element\
    \ defines the type for a specific element and get<N> returns the values."
