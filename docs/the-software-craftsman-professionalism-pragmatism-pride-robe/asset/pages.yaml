    # Where Do We Start?


    After a period of time in a new project or organization, ideas for starting pop
    into our heads like popcorn in a microwave. And once we identify all the different
    types of skeptics we face, it is hard to imagine how difficult it will be to push
    our ideas forward. So where do we start?


    # Establish Trust


    We can''t change if people don''t trust us. The best way to build trust (with
    fellow developers, delivery managers, clients) is by consistently delivering quality
    software. The trick here is to understand what quality means. For others, it may
    mean that we have written meaningful and readable tests, and that there are no
    duplicates—that is, if the code is easy to maintain. It may mean software that
    satisfies their requirements, has no bugs, and is delivered on time. For clients,
    it may mean software that is in production, saving them, saving money, or protecting
    their revenue.


    Although essential, consistently delivering quality software is not enough to
    build trust. You can''t change if you don''t have passion. People need to recognize
    that you have something interesting to see. You need to be visible. You need demonstrate
    how passionate you are and how much you care about the project and what you are
    proposing. People are far more inclined to follow someone who is passionate than
    someone doesn''t exhibit anything.


