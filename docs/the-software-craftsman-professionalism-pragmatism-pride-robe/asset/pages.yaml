- pgno: 11
  md: 'Software Craftsmanship proposes a very different mindset for developers and
    companies. Although Software Craftsmanship is not a methodology, it strongly recommends
    the adoption of certain technical practices and disciplines, mostly the ones defined
    by Extreme Programming. With a great synergy with Agile and Lean principles, Software
    Craftsmanship promises to take our industry to the next level. Professionalism,
    technical excellence, and customer satisfaction are the main focus of Software
    Craftsmanship. One of its main focuses is changing the perceptions that software
    developers are like workers on a production line and that software projects can
    be run as if running a factory.


    How can we become better developers? How can we deliver better software projects?
    With real stories and practical advice for developers and companies, this book
    is relevant to all software developers and every professional directly involved
    in a software project.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# About the Author


    Sandro Mancusco has coded since a very young age but only started his professional
    career in 1996. He has worked for startups, software houses, product companies,
    international consultancy companies, and investment banks. In October 2013, Sandro
    cofounded Codurance, a consultancy company based on Software Craftsmanship principles
    and values.


    During his career, Sandro has worked on various projects, with different languages
    and technologies and across many different industries. Sandro has a lot of experience
    bringing the Software Craftsmanship ideology and Extreme Programming practices
    to organizations. Sandro is internationally renowned for his work in spreading
    Software Craftsmanship principles at many conferences around the world. His professional
    aspiration is to raise the bar of the software industry by helping developers
    become better at—and care more abouttheir craft through sharing his knowledge,
    skills, and experiences.


    Sandro''s involvement with Software Craftsmanship started in 2010, when he founded
    the London Software Craftsmanship Community (LSCC), which has become the largest
    and most active Software Craftsmanship community in the world, with more than
    2,000 craftsmen he has inspired and helped developers to start and organize many
    other Software Craftsmanship communities in Europe, the United States, and other
    parts of the world.'
