- pgno: 105
  md: 'I worked with few teams in Eastern Europe—my mission there to disseminate the
    Software Craftsmanship ideology and attitude, and also to introduce the teams
    to Extreme Programming (XP) practices. Helping developers to get better at writing
    code, one of my main goals was to insert some passion into the teams and help
    them to create a culture of learning.


    While working with them, "What are your career aspirations? Where do you want
    to be in a few years?" "I want to become an architect. Another want to be a manager,"
    one said. Other developers said head of department, product owner. No one said,
    "I want to be a developer." I said, "Why not a developer?" I asked them. An awkward
    minute of silence with a strong accent, one of the guys said, "Here, if you are
    a developer when you are over 30. I am 35," I said loudly, and I felt very proud
    to be a developer.


    From that onward, the developers seemed freer. They were enjoying what they were
    doing, pairing with each other, making a good effort to test tries, trying to
    make their code run well, internal sessions, really getting better at writing
    code. They realized that you could have a successful (and a lot of fun) career
    that you love.


    Unfortunately, that was not a situation I encountered only in Eastern Europe.
    I see similar situations in Asia, Brazil, and also in the UK and the US. We have
    companies that treat developers like second-class professionals, who are just
    there to type off on the keyboard. Developers, on the other hand, think that is
    how they work, and they do want to be up in their careers, from development, so
    they can be treated as professionals.


    Fortunately, this mentality is changing. Many there recognize how important software
    developers are for their businesses, and they offer excellent packages to attract
    the best ones. Today, every company is a software company, and companies that
    fail to understand will struggle to compete in the future. Companies that fail
    to recognize developers as high-skilled professionals will never have craftsmen
    for their team.


    # Different Leaders


    Every person has a career leader. Software development is: we are at the start
    and move upward as we become more experienced.


    Climbing up the software development ladder is a challenge. The skills needed
    to become a great manager are not necessarily the same ones needed to become a
    great developer (and vice versa). Developers, for one reason or another, decide
    to take roles as managers or architects are not climbing the software development;
    they are switching developers.


    # Roads and Milestones


    There is a difference between following a career within a company and following
    your own career as a craftsman. A successful software craftsman carefully plans
    her career; she looks for opportunities where she is to learn the things she wants
    to learn in order to become a better professional. Different people have different
    aspirations and these aspirations require planning the next steps is key for a
    successful career.


    Moreover, looking for a new job. "I will offer my career knowledge and time in
    exchange for the highest salary I can get." That''s very shortsighted. For professionals
    who are interested in leading and successful careers, a job is for more than money.
    It''s a constant investment in their careers.


    Besides the things for what we do, we should also value all our dedication, passion,
    commitment, and what we acquire. Working outside hours to make the workplace a
    better place—where everyone can live and learn. Investing in working out a better
    environment creates more opportunities for enriching our owners.


    I never focused on just what was specified in the job I was listing. "That''s
    not my job." In fact, I don''t ever look back at any job description or consider
    before being hired. I tried for hours to get more of, to do more, and to make
    sure everyone around me happy as much as I could, regardless of what role or position
    was. This is what I my investment. It was an investment not only in my job, but
    also in my individual career, but for my personal life, and for the world that
    I worked in. Some people value certain technologies or industries; experience
    with different types of projects; opportunities to develop skills, different roles,
    and have different types of responsibilities; or even more money were all that
    at some point in my career I wanted a start. Money was not my priority—good software
    professionals will always have money when they need to earn a little. I always
    did my best to provide as much as I could—the company''s t-shirt, as we say back
    home—and got my return back.


    I changed some jobs by time during my career, spending two years in each company.
    There were a few exceptions though. There was one company where I stayed for five
    years, and another company where I stayed for three months. In the one where I
    spent three months, I was working with lovely people, I realized in the first
    couple of months that the job was not aligned with my career aspirations, so I
    did all of us favor and recognized - Hui Wei'
