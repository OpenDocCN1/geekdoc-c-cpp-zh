  md: '# The Agile Transformation Era


    Agile was a revolution in our industry and, bit by bit, companies adopted it.
    Consultancy companies and individuals became specialized in helping companies
    go through the Agile journey. The role of the Agile coach emerged. Agile coaches
    to companies; analyze their problems, processes, and people; and help them to
    change in order to become more agile.


    During Agile transformations. Scrum, combined with a few other specific techniques,
    was normally the methodology of choice. What was a great entry point into Agile
    world. The notion of self-organizing teams was all for many companies. Accepting
    the idea of having teams backlogs, deining and splitting stories, estimating with
    priority features at the end of each iteration was a massive step forward. Communication
    was also improved. Teams started to talk to each other and with their customers
    much more often—another agile thing in certain companies.


    Providing an environment where people interact with each other helped companies
    to solve problems and understand weaknesses and strengths of teams and individuals.
    Agile processes helped unite team members, providing them with a common goal.


    Agile processes definitely helped companies move forward, not only exposing their
    problems but also providing a feedback mechanism that allowed them to react and
    adapt.


    # The Agile Hangover


    For a few years, companies and teams were in this Agile transformation part. Companies
    were transformed. Meetings became stand-up meetings—although some companies have
    them in home, setting down for one hour. Burn-down charts, iteration backlogs,
    and release backlogs became the new project management tools. We became user stories.
    Project managers became Scrum Masters And Agile became the new name for their
    way of working. But some changes were negative. If you looked at offices from
    before and after the Agile transformation, the difference could be massive.


    We often had ten or more people standing around a single computer, and whiteboards
    everywhere. Some companies have everyone with whiteboards, colored in color Post-Its.
    And what was Agile meant to many companies. The new color of Post-Its on a whiteboard
    became their true measure of Agile. The very Agile companies could be identified
    by their use of Post-Its, of course, or different thing. Anyway, everyone could
    see the color Post-Its—some moving with some time they could do something well,
    a bit faster, but not at all), and everyone had that feeling of freedom and empowerment.
    Freedom meant could do whatever he wanted or what she wanted—as long as he or
    her boss lasted. And one day, after a few months, or in years, some cases of Agile
    ended up with a massive Agile hangover.


    They realized that after all this, they were still not delivering software with
    quality enough fast. In fact, many of the teams and companies still had the same
    problems they had before the Agile transformation. They were taking a long time
    to do anything and still producing what they needed. They had technical debt,
    even in projects that they started from scratch in Agile. Motivation was a big
    problem. The quality assurance (QA) teams were still needed. Many companies had
    a period of (a few days, to a few weeks) after each change in a sprint their code
    base became a mess and was slowing them down. The size of logs was not large enough.
    They still had applications that were not well documented and everyone was scared
    to touch it. Debugging and log analysis were their main techniques for figuring
    out what the hell was going on. Managers were still bad at decommitting applications
    just a few weeks after they had been written, which was slowing the whole process.


    The new applications in Agile, were also badly designed, complex, and with the
    help developed development teams were still needed to ensure the changes that
    were desperately needed by the developers. For example, they had a bad architecture
    and were not talking to each other constantly. In terms of the actual technical
    work they did, nothing had really changed. The same problems were still there:
    stagnant skill, low morale and motivation, mountains of technical debt, lack of
    unit tests, unscalable release process, system loss, discovery of bugs, unnecessary
    tests every long cycles, and requirements were not understood until they were
    started to ask. ''What went wrong?'' ''That was not what we were.'' At the end
    of the day, the main reason to change the whole process and adopt Agile was that
    they could have a better return on the investment in their softare.


    # A Partial Transformation


    Over the years I have seen, and was part of many Agile transformation projects.
    I have seen many companies strongly that they wanted to adopt Agile but not much
    effort to actually be agile. They wanted a prescription: something that they could
    follow to magically make them better. Many companies and teams claimed that Agile
    does not work. They went through this Agile transformation and were not really
    much better than they were before.'
