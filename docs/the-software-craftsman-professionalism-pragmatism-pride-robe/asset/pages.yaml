- pgno: 30
  md: '# 4. The Software Craftsmanship Attitude


    If we think this piece of code we wrote in the past is still good today, it means
    we didn''t learn anything since.


    For some craftsmen, caring about and being proud of the work that we do is a given.
    Constantly finding ways to become better professionals is a lifetime commitment.
    Satisfying and helping our customers to achieve what they want to achieve in the
    most efficient way, is our main goal. Sharing our knowledge with less-experienced
    software craftsmen is our obligation.


    I was not sure what to say or say about his concerns. I had two promotions during
    that period, worked on a few good projects, and learned many new things." I suddenly
    asked him a few seconds of awkward silence. He didn''t understand what I asked
    and asked me to repeat it. "Who is in charge of your career and your professional
    future?" asked him again. After a few years since we had this conversation, I
    remembered the puzzle in his eyes.


    In this chapter I will discuss how we can care about our careers, keep ourselves
    up to date, practice, and discover the things we didn''t know. I will also talk
    about how to create for all these things.


    # Who Owns Your Career?


    What if the company we work for does not buy us? If the company never sends us
    to any training or courses? Or will it be that we could learn new things? Does
    it really mean the company is bad?


    Imagine that you have a problem to solve in your house. Imagine that you need
    a lawyer for any legal issues, or a doctor or a dentist when you have an aching
    tooth. Normally you go to these professionals when you have a problem, so imagine
    turning them back and saying, "Can you make me a book? Can you send me on a course?"
    What would you think about? To make things even worse, imagine that you, for some
    reason, decide to buy the book or send them on a service, and they acquired the
    knowledge you gave them, they come back and charge you for their services. How
    does it sound to you?


    These professionals need to invest in their own careers so they can do a good
    job, satisfy their customers, and hopefully receive other clients. They need to
    satisfy their current clients. Those that don''t end up losing clients, receive
    fewer rewards for forever, and will slowly be forced out of their business.


    On the other hand, factories work, for example rely on training. Factories need
    to train their employees to use new machines and perform work. Factory workers
    have no say in what machines the factory should buy they are just to be told what.


    Clients pay with the expectation and experience of receiving a good service. They
    pay professionals to solve the problems in the best way possible. Clients don''t
    pay for learning. Clients pay for their knowledge and skills. Professionals are
    expected to provide solutions, viable alternatives, and ideas to their clients.
    Professionals are expected to help their clients achieve whatever they want to
    achieve in the best way possible, and that is how they build their trust and reputation.


    We have all wanted to be respected as professionals before we that we need to
    start behaving like professionals. That means that we should use our own time
    and money to get better at what we do. We should show our own careers and what
    we learn and what we earn. We should be in a position that we can help clients
    and employees to achieve their goals. Those who only rely on their company knowledge
    are not professional software developers. They are just factory workers in disguise


    > "Companies should not be investing in their own people?" you may be asking.
    No, that is not what I mean. Companies should invest in people but software professionals
    do not see that as their obligation. That should be a bonus, a win-win situation.
    Companies that provide time to get better at what they do are much better and
    can become far more efficient. Passionate developers will always favor these companies
