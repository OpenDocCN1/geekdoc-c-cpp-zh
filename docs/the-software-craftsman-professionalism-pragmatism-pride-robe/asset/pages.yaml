  md: 'Fortunately, not all projects and companies are like that.


    # Constrained by Lack of Motivation


    Every company has every single employee, without effort, could easily come up
    with a big list of things they wished were better. But, if employees know what
    to be changed and how things could be improved, why don''t they do anything about
    it? Here are the most common reasons, in no particular order:


    +   * They don''t feel empowered to do it.

    * They don''t want to be the ones pushing it.

    * Nah! Too much hassle.

    * They don''t believe things could be changed.

    * No one agrees on what a better thing is.

    * They don''t care. It''s just a job.


    The reason why many companies fail to improve the way they work is low motivation.
    There is no way we can change an organization when people are not motivated and
    don''t care about their jobs. Before trying to convince people to work in a different
    way, ask yourself: are they motivated to do a good job? Do they really care about
    improving the way they work? Are they constantly trying to get better at what
    they do? Do even believe in like what the company does?


    # Injecting Passion


    Embedding craftsman in a team, either hiring them or bringing in external craftsmen
    for a period of time is the most effective way to motivate developers. The differences
    between regular development and software is that craftsmen are on a mission. They
    are on a mission to make things better, to deliver value to their clients, and
    to inspire people around them. They are not afraid to lead the way and develop.
    For software craftsmen, striving to always do their best is just a natural state
    of mind.


    There is nothing more annoying for a developer than having a manager or an architect
    dictating what she should do. Instead of telling others what to do, software craftsmen
    can sit and pair with other developers, sharing their knowledge, experience, and
    passion. Besides getting the work done, they are always keen to act mentors to
    other developers. Software craftsmen are always looking to share their ideas with
    the team to help them do better.


    While working in an unfamiliar bank, we joined many other things, to inject passion
    into the team. We were a few senior developers but many of them were not really
    excited about their jobs. They were coming to the office doing what they were
    asked to do, and going home. Although we were in the middle of an Agile transformation,
    they had loads of bugs in their systems, and we were deploying software only once
    or twice three years, and had very little innovation to develop.


    We have done many things over the last years since I was there, but there is no
    book on Agile transformation and change. I''ll focus on some simple ones that
    ended up having a very good result.


    One of the first things we did was hire a craftsman to join us. The bringing of
    a few craftsmen to the team that we were all allergic to really helped to inject
    passion and bring innovation.


    We used Scrum and at the end of our daily stand-up meeting, we started: ''Has
    anyone learned anything from our stand-up meeting?'' In the first week one developer
    would answer and yes then shared something we read in a book or blog post, some
    we discussed and we tried the right approach, or some code we had written. As
    weeks went by, more and more developers became motivated to learn and share in
    our daily stand-ups. We shared blog post links, videos, and books. All of them,
    and some manner of conversations about software, techniques, practices, and some
    possible solutions to some of our problems. We experienced the new craftsman and
    they wanted to be part of it.


    I bought a copy of Seven Languages in Weekend by Bruce A and started going through
    the first chapter (Ruby) and spent a few times during our stand-up, coffee breaks,
    and pairing sessions. At some point it the developers asked if they could join
    me when I was ready to start the language (Prolog). We then agreed that we would
    meet every Wednesday at 12 pm and spend our lunch together. After each session,
    we were excited and wanted to talk about it. More and more developers got interested
    and at one point we had 12 developers to coming to the sessions and some of them
    joined us.


    Things like completely changed our environment. Developers were excited by technology
    again and were keen to get better. They were all more inclined to pair-program
    and try new things. Many innovations were brought to our department, many technical
    problems were fixed, the number of bugs reduced dramatically, and we started deploying
    production more often. The general mood was so great that even product owners,
    project managers, and production services noticed it. We were happy to work with
    the developers as well.'
