  md: 'same as another, unrelated object. Metaphor is a type of analogy and is closely
    related to other rhetorical figures of speech that achieve their effects via association,
    comparison, or resemblance.


    Using metaphors is a common, and quite often, very easy and efficient way to explain
    or describe something. The problem is, when taken out of context or too literally—usually
    by people who don''t know enough about the original context in which the metaphor
    was first used—all sorts of misunderstandings and myths are created. I hope this
    book will help to make things a bit clearer.'
