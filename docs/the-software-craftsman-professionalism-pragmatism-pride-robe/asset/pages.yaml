    not be as valuable as before. Examples would be books about Hibernate, Nodejs,
    or Code.

    * Conceptual books are those that give us the foundation in our careers. These
    are the books that get us introduced to concepts, patterns and practices. The
    knowledge we acquire through this type of book cannot always be applicable; it
    may take a significant amount of time to digest the information and become proficient.
