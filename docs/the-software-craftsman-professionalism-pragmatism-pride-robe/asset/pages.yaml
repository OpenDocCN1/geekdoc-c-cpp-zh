    # Legacy Code


    > Attitude is a thing that makes a big difference.

    Winston Churchill


    During one of my days on Software Craftsmanship asked asked would like to work
    on a green-field project. Almost everyone raised hands. Then I asked who would
    like to work with legacy code. Only one or two people, else keep their hands down.


    It is always nice to start a project from scratch, but to choose legacy code teaches
    us about the latest frameworks, and a lot of writing code without breaking existing
    features. It''s great when we can write code without understanding existing code.
    Working on legacy code is great, especially with an experienced and disciplined
    team from day one. Projects proceed quickly and naturally.


    However, if we are working with code written by people who are long gone, with
    no tests and no documentation, we went mental. We notice we are going crazy by
    the number of WTFs that we have to debug. We get moody and hating our job. Frustration
    becomes a constant. The bad news is that changing jobs rarely helps. In fact,
