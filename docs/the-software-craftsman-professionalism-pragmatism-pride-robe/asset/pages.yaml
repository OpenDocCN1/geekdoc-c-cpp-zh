    # The Right Focus


    Don''t waste interview time talking about things that are not relevant. On what
    is important and more valuable to the company.


    # Mind-Mapping a Conversation


    One technique I find very useful when conducting interviews (or should I say conversations)
    is mind-mapping. I use a few pieces of paper and a pen, and I start the interview
    with an open question. What is well-crafted for you? What are the mind maps in
    a software project? In these examples, well-crafted software could be the root
    of my mind map.


    Open questions that lead to be answered with a list of things like maintainability,
    testability, readability, performs well, satisfies requirements, and so on. Each
    item in this list becomes a node, hanging off the mind map root well-crafted software.
    With that, we can start exploring one of the nodes and mapping the conversation
    against it, creating new nodes for what is said by the interviewer or the candidate.
    Whenever I''m happy with the conversation about one of the topics I can expand
    it to nodes that are hanging off the mind map. That was back, you also mentioned
    that. Could you expand that?


    If the conversation deviates in a way that I don''t find useful, I can look at
    the map and choose another node (topic) to explore. If I want to have a conversation
    about a completely different topic, I create a brand-new map on a different piece
    of paper, or other node under the root node.


    If I want to be more specific, because the conversation doesn''t get to where
    I want it to, then I ask another more direct question: "What do you think about
    TDD?" This will lead to another interesting conversation captured by the mind
    map.


    Once the interview is finished, I have the entire conversation mapping, which
    helps me to remember every conversation I had with each of the candidates.


