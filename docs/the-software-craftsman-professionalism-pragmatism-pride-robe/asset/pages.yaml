    asking me about other shortcuts and took notes of all of them. Fifteen minutes
    later, had on, piece of paper, some of the basic shortcuts and started to feel
    more comfortable.


    He also struggled with Mockito. "If you tell me what to do, I can do it for you,"
    he said. "I want to make this class and that constant every time the public method
    is invoked," I then wrote the code according what he wanted to do. That helped
    him to understand how Mockito worked. By the end of the interview, he was using
    Eclipse and Mockito quite well.


    The only thing I regretted about that interview was we were not fast enough to
    get back to him and he got a job somewhere else.


