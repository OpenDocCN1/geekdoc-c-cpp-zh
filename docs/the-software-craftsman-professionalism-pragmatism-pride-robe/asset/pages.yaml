  md: 'Expecting a return on investment should not be mistaken for the selfish and
    unprofessional attitude as "CV building," where developers don''t care about their
    jobs and are to improve their CVs, choosing technologies and methodologies for
    personal reasons and not because they are fit for a specific purpose. Also, software
