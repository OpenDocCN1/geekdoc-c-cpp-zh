- pgno: 27
  md: 'The main problem you have when working with applications that is fear. No,
    I''m not calling you a coward. I''m just stating that you are a responsible developer
    who understands the implications of making the wrong change in a code because
    you are scared to change parts of this code you do not understand how it works,
    and you have no confidence you will not break something.


    This application is working software, but is it enough? Well-crafted software
    matters, regardless of how old the application is, can change easily. The side
    effects are well known and controlled. It has high and reliable clear simple design,
    and business language expressed in the code. Adding or changing features does
    not take longer than it used to take at the beginning of the project, when the
    code base was small.


    The code must be maintainable. Developers must know what is going when changing
    the code and must not be afraid to change it. Changes should be localized and
    not affect other parts of the application—no ripple effects. In a few minutes,
    not seconds, after pressing a button, tests will check the application and inform
    you if something breaks.


    In order to evolve, developers must not shy away from changing. Using Test-Driven
    Development, simple design, and using the business language in the code are the
    best ways to keep your well-healthy and well-crafted code.


    # Not Responding to Change, But Steadily Adding Value


    Have you ever wondered how software projects work? Think about the developers
    working on it. Now think about all the professionals who are also part of the
    project, teams, production services, operations, business analysts, products,
    and project managers. There are also marketing, sales, customer service, and back
    office people. How much is spent in salaries. Now add all the cost of computers,
    communication infrastructure, office rent, desks, furniture, and coffee. They
    all come with it. On top of that,


    Software projects are normally a massive investment and with any normal investment,
    companies will want a return. The only reason for companies to invest in a project
    is to make money, save or project revenue. With in of that, it is our job to help
    them achieve this


    When we talk about adding value, we are not just talking about new features and
    fixing bugs. It is also about improving the software to be clean, testable, and
    easy to maintain.


    It is our job to make sure the older and better the software, the more the company
    will benefit from. We want to keep adding to the project and make the appropriate
    changes at the same speed that we have used at the beginning of the project. This
    would allow companies to react quickly to the market regardless how old their
    software is. As it gets older, software should become more valuable and not a
    source of pain and frustration.


    Increasing the lifespan, and the ability to keep it fast enough, is our main goal.
    Good software development, automated testing skills, and talented developers are
    essential for that we should always have the code cleaner than we found


    The focus on high-quality software must be the number one if you want long-lasting
    applications. Rewriting an agile a few years after it has been developed for a
    poor return on investment. In many occasions, the decision to rewrite an application
    is made because of the prohibitive costs of maintaining it.


    > Insanity is doing the same thing over and again and expecting different results.

    —Einstein


    The problem is that same bad techniques that were used to build the old application
    will also be used to build the new—making the new application as old as the old
    after a few months or years. It is our job to break this cycle, building applications
    with well-crafted code.


    # Not Only Individuals and Interactions, but also a Community of Professionals


    Sharing and mentoring are at the heart of Software Craftsmanship. Software crafters
    are passionate and always strive to be better. However, we have a bigger mission
    we are responsible for preparing the next generation of craftsmen.


    The best way to move our industry is by sharing what we have learned through mentoring
    and inspiring less-experienced developers. This also relates to the ideas of apprentices,
    mentors, and masters, where Software Craftsmanship must mentor help them in their
    journey. Knowledge, ideas, successes, and failures must be shared and discussed
    within the community in order to move our industry forward.


    I was surprised to hear from some developers and Agile coaches that the Software
    Craftsmanship community is a group of selected and elite developers. An average
    developer cannot be considered a software craftsman if he is not thinks Software
    Craftsmanship is elite, it is not enough to learn from others, or is not willing
    to share his knowledge and mentor less-experienced developers. From my experience,
    the Software Craftsmanship community is'
