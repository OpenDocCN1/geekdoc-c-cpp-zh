- pgno: 85
  md: 'available.


    +   - Take another vote but only the most-voted topics.

    - Propose to discuss one topic for the first half of the meeting and the other
    topic for the second.


    After 45 minutes (30 if you don''t have enough time), interrupt the discussion
    and ask if people want to switch topics or carry on with the decision made.


    # Switch Projects for an Iteration


    Within a company, it is common to have different teams working on different applications
    or in different parts of the system. After a period of time, projects take into
    a routine; some of the initial challenges have been solved and the best design
    decisions have been made. However, projects rarely evolve. As developers become
    comfortable with their teams and decisions, they may also consider better ways
    of doing things. Learning takes over.


    Assuming that developers are constantly pairing with each other, we can solve
    this problem by providing an opportunity for developers to switch projects for
    at least a iteration. Pairing with different teams offers opportunities to develop
    technologies, ways of working and knowledge. Having different teams join an existing
    project, even for a small period of time, makes the team rethink their problems
    and solutions and explain why they do the way they do. This may bring a few positive
    effects:


    +   - Validation of the decisions: The new person, understanding the context in
    the decisions made, can confirm it was a good decision.

    - Knowledge sharing: The new developer learns how certain problems can be solved.

    - Improvements: The new developer can propose better ways to solve those problems.

    - Collective learning: After discussing the current situation and sharing knowledge
    with each other, existing members of the team and the new developer can come up
    with a better solution.


    Periodic exchanges generally improve motivation, spread ideas across projects,
    and break knowledge silos. The Scrum master of one team can swap places with a
    tester from another team.


    # Switch Projects for a Few Hours


    As a variation to the approach described, we could have developers working with
    different teams for just a few hours or days. Developers can organize the themselves.
    They just need to walk to the team''s location, sit with one of the developers,
    and pair for a couple of hours.


    I once worked for a large organization where all the software developed was written
    in Java. Over time, different teams started using Gradle as a testing framework,
    instead of Maven and JUnit. The team I was working with decided to use Scala and
    a commercial in-memory data grid instead of Java and Oracle for our new projects.


    Being able to walk over to another team and if we could pair with someone for
    a few hours every day was a great way to expose many of us to different technologies.
    At the time of this writing, one of our teams is already migrating to Gradle and
    Spock, and another team is considering Gradle.


    # Conduct Group Code Reviews


    Group code reviews are another interesting way to create a culture of learning.
    It''s amazing what we learn debating with colleagues whether a piece of code could
    be improved or if it could be used as an example that should be followed. If done
    right, group reviews bring the whole team together; everyone feels responsible
    for the decisions of what quality for them.


    Although I value code reviews, it is important to get it right. But what does
    "get it right”?


    +   - Comments should never be personal.

    - It doesn''t matter who wrote the code.

    - Never look at the commit history during a group code review. Focus on changing
    the future, not dwelling on the past.

    - Comments should be objective and constructive. The focus is on how to make the
    best code and not why it says so much.

    - Sometimes using a facilitator helps. Her role is to make sure everyone speaks
    and that there is no fingerpointing.

    - Don''t expect to make a lot of progress. If developers want to spend a lot of
    time discussing an issue, let them do it.'
