    employers and employees. On the other hand, we have the type of relationship that
    professionals have with their clients. The top-down, command and control of management
    became very popular during the Industrial Revolution and again has returned when
    the manager of work is doing manual or repetitive work. However, it does not work
    for creative workers. This style of management can be detrimental to the morale
    of creative professionals, making the company far less innovative. Companies that
    are still using this type of management struggle to hire talented professionals
    and slowly losing the ones they still have. But, course, this is just one of the
    many stories we hear every day. What is said in the industry is that if developers
    want to be treated as professionals, they should start acting as professionals.
    A software professional must, among other things, get involved and contribute
