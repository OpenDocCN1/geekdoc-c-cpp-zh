    value their ever-increasing knowledge, passion, dedication, and professional attitude
    in every job they do. Therefore, for like any other type of work, we need to be
    clear about what we expect as a return, and we need to measure it regularly throughout
    the length of the investment.


    After a few months of interviews and networking, I finally accepted a job in an
    investment bank. For many days, Well then I doubted myself that investment banking
