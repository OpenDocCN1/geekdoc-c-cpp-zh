    productive everything. We want to see tests architecture and code. We want to
    have a nice conversation and see

    if we can work together well. We want to feel how it would be to work with that
    person.


    There is a huge demand for good developers and if we want them to join our company,
    we must learn how to

    interview them properly. We also need to remember that developers are not the
