  md: '# Focus and Determination


    Vojra said, "You''ve got to be careful if you don''t know where you''re going
    because you might not get there." We software craftsmen, value and control our
    careers. We understand that a career is a life-long journey, depending on the
    choices we make, we or may not lead us to mastery.


    Defining the direction we want to go in our careers is important. However, this
    is a long-term goal and many things can change. Think about your career if you
    are managing a multilayer project. Once we understand the project vision —the
    ultimate goal—we take the most important requirements, break them down into smaller
    pieces, and iterate. While working on small iterations, we also re-evaluating
    the project goals and adapting when necessary. It''s the same with our careers.


    # But If We Don''t Know Where We Are Going?


    It sounds simple but we do not always know where to go next. Actually, defining
    the direction we want to take our careers can be an extremely difficult thing
    to do. We don''t decide it once and for all. We need to constantly evaluate our
    career decisions based not just our passion but also all the events in our personal
    and professional lives.

    We need to be where we are in relation to our goals and our dreams. We need to
    create situations where opportunities can be presented to us. No one will knock
    on our doors and offer us a opportunity if we keep ourselves isolated from the
    rest of the world, locked inside our houses and offices. No one will offer us
    a opportunity if they don''t know who we are, what we do, and most importantly,
    how we work. We need to go out and speak to people. We need to show other people
    what we can do. We need to be comfortable with technical practices, and to talk
    about what we want to do next, create an environment where other people and companies
    can present us with some options. When we have a few doors, and a few options
    available to you, you will be in a better place to decide what to do.


    Here are a few things we can do in order to create opportunities:


    +   - Expand our technical knowledge, studying things that are out of our comfort
    zone, like new languages and technologies.

    - Attend user groups and community events.

    - Network with other developers and businesspeople.

    - Blog about what we are learning and doing.

    - Contribute to open source projects.

    - Develop projects and make them publicly available.

    - Attend conferences.

    - Present at a conference.


    The things described above create situations where we can receive options that
    we were not considering before, and this could help us decide what to do.


    # Job as Investment


    The definition of a great career in software development is very personal: each
    of us have a different dream, aspiration, and different person has it. However,
    the process of career aspirations is very similar. The most important thing is
