  md: '# 16. Career As a Software Craftsman


    Being a software developer is awesome. Look around. Everything that is man-made
    today has software behind it. The chair you are sitting on comes from a factory
    that uses software. TVs, refrigerators, and cars all have software running inside
    them. The food you eat is connected to software—if not for the many companies
    using millions of lines of code in their systems, from so many suppliers and countries
    wouldn''t have marketplaces. Software lives—many of the advancements in modern
    life were possible because of software. Transport, communications, entertainment,
    sports, everything has benefited. Software enables businesses to succeed and thrive,
    empowers people in need. Software provides vital support for the authorities and
    volunteers to help, minimizing suffering after natural disasters. Software helps
    to prevent, injustices, assists law enforcement, and helps restore water, electricity,
    and communication to remote parts of the world. Software also gives us cold beer
    and herds of cattle in our TV boxes. Software unites families and friends, and
    for one another, life becomes less lonely. What? How can we treat our jobs as
    “just a job?” Can we not care when we know that what we do is important, sometimes
    essential, for our own lives? Software developers are essential for the future
    of the world we live in.


    In this chapter we will discuss what it is to be a craftsman and how to have a
    successful and fulfilling career.


    # Being a Craftsman


    Passion. That summarizes all. Software craftsmen are passionate about software
    development and profession. They are passionate about solving problems with simple
    solutions. It is a life of continuous learning, teaching, and sharing. Software
    craftsmen are passionate about helping the industry to evolve; sharing craft;
    mentoring developers through their experiences via blogs, talks, videos, and conversations;
    and being active in technical communities. Software craftsmen are always, ready
    to learn from more-experienced developers, and help the less experienced.


    It is no secret that software is only going to grow in the next few decades, making
    everyone ever more dependent on it. It is our to do well with this demand, software
    craftsmen feel they have a social and moral obligation to pay the next generation
    of craftsmen, making our industry better and more than before.


    Being a craftsman is more than being who writes good code and delivers business
    value. It’s a lifestyle. A life where we choose to do things well, to the best
    we can. It’s a life where we are prepared to make some sacrifices to learn and
    help others learn the craft. It’s a life of dedication to the art of writing code.
    It is a constant search for better and more efficient ways to deliver value through
    software.


    Being a craftsman means to explore and experiment with new ideas not to be dogmatic
    about tools, languages and frameworks. It means to be pragmatic about using the
    right tools for simple solutions and avoiding jargon. Although dogmatic about
    them, a craftsman must master a good set of tools, languages, and frameworks.


    True software craftsmen focus on solving problems, not on writing code. When they
    need to leave left behind or because they were the only one who could understand
    the code it is easy to understand and maintain. A craftsman is needed for the
    right reasons. No developer will leave a craftsman because the mess they left
    was the only one who could understand the code they wrote. A craftsman is needed
    for the right reasons: insightful contributions, encouragement, knowledge, and
    most, being a great colleague.


    # Honesty and Courage


    Honesty and courage are essential qualities of a software craftsman. “Well, but
    that is valid to you,” he says. “But by honesty and courage I mean saying “no”
    to clients when it is necessary. I mean being honest and courageous to tell them
    what they are asking for is unrealistic and not to go along with iteven if we
    know they will be annoyed by it. I mean telling their clients they are making
    a bad decision. We need to tell our clients that we are not going to commit, or
    to be responsible, for something that they don''t feel right.


    Often, saying “no” is not acceptable for a craftsman’s attitude. ‘A no’ is followed
    by, ‘But this will not work, but maybe we could try this thing instead.’ Or, ‘There
    is a big change and we are not going to meet the deadline, maybe we could rethink
    the features, and release the result as soon as we can.’ Or, “But sorry what you
    are asking for is not to happen within the time frame you expect. I would advise
    you to speak to the stakeholders and then call me so we can discuss the alternatives.
    I cannot commit to what you are asking because I know that the risk is too high.


    The career of a craftsman is built on honesty and courage. A craftsman never hides
    from customers. Crafts and customers are in a partnership, where honesty, courage,
    and transparency are key.


    # Career Progression'
