    Design, object-oriented design, functional programming, or modeling with NoSQL
    databases are examples of such books. The knowledge we get in this category is
    not that will be far more helpful than learning a specific technology, and it
    may take many years before we get comfortable with them. However, conceptual books
    are those that give us the foundation to learn specific technologies much quiecer.

    * Behavioral books are the books that make us more efficient when working in teams
    and better professionals in their field. They help us learn how to deal with people,
    clients, decisions, team members, and so on. By knowing programming languages,
    frameworks, and practices is not enough if we want to be a good professional.
    We also need to learn how to deal with everything that is not related to our job
    but is also part of a software project or organization. Books in this category
    will cover the more human and professional side of software development, including
    topics like Agile methodologies. Software Craftsmanship, Lean software development,
    philosophy, and management.

    * Revolutionary books (some call them classics) are the ones that make the way
    we work or even of some'
