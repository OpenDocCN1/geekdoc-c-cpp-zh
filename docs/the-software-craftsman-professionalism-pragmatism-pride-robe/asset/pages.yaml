  md: '# # Preface


    In the mid-twenties, two years after I started my professional career, a large
    international company in Sao Paulo announced that there were 60 developers in
    need. The selection process would take a few weeks and was divided into four phases:
    a three-hour technical; two weeks of training in their proprietary technology
    followed by a test; a full day of group dynamics; and a round of interviews. It
    announced in a newspaper and 900 applicants. I was working for a small software
    house at the time, a place where I was very happy, but I felt that I was looking
    for something better. Since the first few weeks would be on a Saturday, I had
    to apply a bit. Fewer than 300 candidates passed to the first phase, and I was
    nervous and confident but not. I had to resign from my current job in order to
    move forward with the selection process I would need to take many days off for
    the remaining days. Then my financial situation was so weak and I could not count
    on any monetary support from my family. It was quite hard to resign a job I liked
    in order to pursue a dream I had no idea would come true. Also, I had to learn
    everything in the new job. That was the type of company I wanted to work for.
    For that I wanted.


    I was 21 years old, and I already had a few years of experience starting when
    I was 11 and started my professional career when I was 19. The problem is this
    mix of youth and a bit of cockiness that could easily lead me to arrogance. I
    was of an arrogant, young person you could know. I could beat anyone hands down.
    I thought of myself, better than any other person who studied with me at university,
    but I was better than the majority of developers who worked with me in my previous
    jobs.


    After going through all four phases, the international company announced that
    they could not find 60 developers at the level they were expecting. They hired
    32 and I was one of them. I was the more and more cocky each day. In my first
    few months, while speaking to different business modules, I was responsible for
    delivering one business modules of the system. We started talking about this team,
    a team that seemed the best team in the company. They were the "architecture"
    team, responsible for the core and for providing all architecture code used by
    the business.


    The architecture team was led by this incredible guy, who also did the management
    work, was also a fantastic developer. He was a man, but he had always a few time
    to check code, code in his name, and review the code written by his team. His
    team was always working on interesting things and that their code was really good.
    It was exactly what I wanted.


    After a few weeks, I was asked to be the manager of the architecture team, this
    guy I heard so much about. I didn''t really know what to say or what I was expecting.
    I was only one of them. I had nothing to lose. The worst-case scenario he would
    say that he was not interested to be on his team. One day I saw him alone in the
    company I was shaking. I was nervous. He looked at me and smiled with a hand.
    "I''m Namce he said. Nice to meet you." He was calm and relaxed. "I want you to
    work for us," he said after a few seconds. I was a bit surprised but it turned
    out it in a very positive way. We then started talking about the selection process,
    why I applied, what I was expecting from the job. He asked me if I had projects
    to show. I mentioned some technologies I knew and some other things that I did.
    And after around 30 minutes of conversation the meeting had started. I was shocked.
    That was not what I was expecting. So we agreed to schedule a meeting, a formal
    interview and so on. It took me a long time to get used to the situation and I
    was very concerned about my professional development. I was wondering whether
    I was capable of doing the right thing.


    My first day was a Monday. Namce came to my desk and started assigning me a task.
    He explained one of the applications and what I had to do. He said it would be
    the best way to check what I could do. It was short. That was my challenge. I
    had to show him how well I wanted to be there. I stayed in the office until midnight,
    felt shift, a few hours later every Tuesday, and around two o''clock in the afternoon.
    I had finished my assignment with less than half of the time I had given. I was
    feeling great. I had many ideas of how to be able to contribute to the project.
    It was a huge achievement for me.


    I rushed to Namce''s office and said it with excitement. "It''s done. I finished
    it." and then he was stopping and turned to me. "Making things is the work I expect
    from someone who is part of me," he said. "What you say is finished, if it proves
    it." That was like a big slap in my face. My face faded a bit and I was embarrassed.
    Maybe I was too fast. I went back to my desk for a long day. He did not have much
    else to say. "Sit here and let''s see what you do," he said. There and I watched
    him typing in the command line, checking the code from source and my opening .pas
    file containing all the code. He opened the file with this horrible black and
    green editor on the command line. That was the first time I had seen it. We were
    using Delphi instead of an integrated development environment (IDE). For me, seeing
    some Delphi files vi (a Unix text editor) was very alien. "Close it so we can
    have a look at it," he said. He positioned the cursor on the first and started
    looking at the code line. Every five lines he would stop and say things like,
    "Do you know happens when we allocate and deactivate memory? Can you see here?
    You are allocating memory in one method and'
