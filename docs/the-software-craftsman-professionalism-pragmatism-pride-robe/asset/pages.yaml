- pgno: 106
  md: 'Throughout my career, I chose one of my jobs very carefully. I never sent a
    bunch of CVs to different companies with the expectation that at least one of
    them made an offer. I always knew exactly what type of job I wanted to work for.
    And when I had to face reality, I was told I was not ready or good enough for
    that type of job. I took time, prepared myself, and tried again. Each helped me
    to move forward with my career. Each job was a very important step in the very
    ladder that carries me—long road to mastery.


    This not be confused with "CV building". CV building is good, while working for
    a company, developers use the force of a technology or a methodology that is not
    fit for the purpose they want to have on their CV. This is not only wrong, but
    also unprofessional.


    # Building Our Careers, One Job at a Time


    Before I chose a job, I ask myself the following questions:


    +   * What I want for my career?

    * What is the next step to achieve?

    * Is this job aligned with my career aspirations?

    * How much value can I add to this company?

    * What is the return on my investment?

    * How long (the duration of my mastery)?

    * How would this job help me to get to where I want to be as professional?

    * In this job, will I have autonomy, mastery, and purpose?

    * Will I have a productive partnership with my employer, where both sides would
    be happy with what they are getting out of the day?


    > The questions are completely unrelated to the type of contract I had. I was
    a permanent employee for the last part of my career, this is not exclusive to
    contractors or consultants.


    Knowing all the answers before starting employment is almost impossible. We only
    get some of these questions answered after we started our employment. This doesn''t
    mean we didn''t try to get these answers upfront. As is mentioned in previous
    chapters that the hiring process is a two-way street, and there was no secrecy
    about the information about employment as early as possible


    So, the question is why I have resigned from so carefully chosen jobs? If employers
    could make me exactly what I wanted when I joined, why have I left? There are
    a few reasons for that. Over time, my aspirations changed. Personal life changed.
    Some of my employers changed. When things changed, I spoke to them, and within
    their limits, they were able to give me what I was looking for. So I spoke to
    them when I wanted new projects or doing different things. Some employers gave
    me more things. Some gave me more responsibilities, and some gave me pay and raises.
    However, times when they could not offer what I was looking for, I left. Without
    staying away from my career aspirations, I wanted to work for more. I wanted to
    work for a different company; I wanted my startup; for a global company with different
    teams; live abroad; I wanted to reduce the amount of time I was spending away
    from home while working on projects. At different stages of career or mastery
    I wanted different from that. With one or two exceptions, all my employers were
    great, but at some point, we had to separate ways.


    I see a career as long, and curvy road. The path of the road, is the Promised
    Land: mastery; however, this road also has roadblocks, confusing signs, and many
    junctions to leading. It is very difficult to find the way, and whether to take
    the right or wrong turn. Going too long in a circle can make a direction less
    clear, and if I am not careful, taking one path and another conditions do not
    allow us to see far ahead.


    After a few years of working as a software developer, I thought, I was really
    getting my goal in sight. I was getting closer to becoming a master. But after
    a meeting with more and developers, out of my circle, I realized that I was as
    away as I was before. I was not traveling fast on a German Autobahn like I thought.
    Reality showed me that I was traveling very slowly on a Brazilian country road.
    I was so far away from mastery that I could not even see it. I was disappointed,
    and it took me to recover from that. That when I realized I had to do something
    about it. I had to take my blinds and seek opportunities where I could learn and
    evolve.


    Each is a milestone, a step in a ladder. Each job should be taken carefully. The
    amount of time we stay in a job can vary enormously—it can be from a few months
    to many'
