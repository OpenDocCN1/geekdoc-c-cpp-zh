  md: '# 8. The Long Road


    Everyone wants to be good at something. The motivations vary a little but one
    thing is true for all of us: mastering things gives us pleasure. We become proud,
    even if no one else cares about it. However, even a ball nights giving us the
    focus and determination that is required to master something. We are well of enough
    to walk the long and road to mastery.


    This chapter is about our careers and the things that really motivate us. Are
    we really looking after our careers? Do we really know where we are or where we
    want to go? What are the things that really motivate us to do a great job? Should
    we show our jobs as interest? If yes, what should be the return on our investment?


    # A Tale from a Brazilian Teenager


    As a middle-class teenager living in a small town in the Brazilian country, my
    dream was to live in London. I could never explain why, but there was something
    about London that fascinated me. My parents avoided conversations about it because
    they knew the chances of it happening close to zero; our ever-struggling financial
    situation would never allow me to get a good education or live in a better city.
    On top of that, the town we lived in didn''t even have a European football team.
    To be a good professional, on top of that, I could not speak English well and
    I didn''t have any experience in the UK market. How could my CV stand out in a
    country that has some of the best universities in the world?


    Even so, when I finished high school, I had to decide which career I would follow.
    My dreams were limited because I couldn''t afford the best universities. Taking
    into account the things I was passionate about, as a young teenager, I never had
    a very clear idea what to do but I wanted a best option. So back then, the dream
    to live in London was always there.


    After a few years working as a software developer, I finally could afford to start
    a very long and expensive Italian course; my parents were Italians. I had a lot
    of money to pay people to help me find some documents that proved I had Italian
    citizenship. I had to translate all of them into Portuguese, and then make them
    legal in Brazil. For a Brazilian middle-class boy like me, that was hard, but
    having a European passport was almost essential if I had to pursue my dream.


    In 2000, with my career in motion, I traveled to the UK on holidays. I was 21
    years old and what I liked about it was that I had never wanted to travel to see
    London, and the rest of the UK, was exactly what I thought it was.


    I wanted to know exactly what to do in order to be competitive in the UK market.
    For 30 days I traveled around the UK and spoke to some developers, who could then
    help me the trip via an online website similar to LinkedIn. And I realized that
    I had a few years of experience as a developer, Delphi was not enough for the
    UK market. I needed to speak to more developers to find jobs on job websites.
    The way I had back then. Then, as I worked as a software developer in London,
    I could find orders and direction at a manager''s, but my English was not good
    enough to talk to other developers, for interviews, or any of the conversations
    we needed to have when working on software projects. I felt like a stranger to
    the people around me.


    After a wonderful time in the UK, and back in Brazil, I knew what to do: find
    a job and to live. I hired a private English teacher who could teach me in the
    evenings; and I enrolled in a post-graduate course. It was a bit weird that my
    academic record wouldn''t. be. I decided to take a few courses well-not that they
    would eventually prove but it would help in showing my CV on matters that London
    could recognize.


    At that point, I realized that my career was important for me; I was not just
    preparing to move to the UK. I was preparing to have to move out of my comfort
    zone, take ownership of my career, and constantly look for opportunities live.
    I realized that I had to make my dream important. It was my life, and I had to
    make it my own.


    For the next years, keeping an eye on the UK market, I prepared myself. In January
    2004, a little later with a European passport in hand, I contacted few developers
    and companies in London, moved to London, and within two years I started my first
    job.


    A journey that lasted more than a decade had come to an end. I finally living
    in London and working as a developer. I realized my dream was just starting, as
    new opportunities opened up. But something even deeper had happened to me. When
    I arrived in London I was not the same with a teenager anymore. I was a 27-year-old
    professional software developer who was still at the very beginning of my journey.
    I realized that my career was a very long road to mastery and that this exciting
    journey was just about to start.'
