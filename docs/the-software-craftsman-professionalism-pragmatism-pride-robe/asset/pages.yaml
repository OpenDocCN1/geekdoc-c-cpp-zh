  md: '# Have Hands-On-Coding Sessions


    Hands-on coding sessions are sessions where developers get together to write code.
    The facilitator will choose an exercise, normally a kata, and add some twist (constraints)
    to it to spice things up. The main objective of a hands-on coding session is not
    to finish the exercise; the focus is to writing the best code we can possibly
    write and challenge ourselves. Here are some suggestions for running a hands-on
    session:


    +   - The facilitator must be familiar with the exercise; she would have done
    the exercise herself at least twice before the session.

    - Developers work in pairs, with a person that they never paired before.

    - As a rule, TDD is mandatory, unless stated otherwise by the facilitator.

    - All developers should work on the same exercise; the retrospective more relevant
    and focused.

    - The facilitator should walk around and help developers they''ve done; normally
    he or she should asking questions, not give them the answer or directions.

    - The facilitator should run a small retrospective at the end, where all developers
    can share what they''ve done, how they''ve learned it.

    - Developers thank their pairs when the session is over.


    Hands-on sessions are very helpful for injecting passion into your teams. It creates
    an opportunity for developers to learn from each other, and it is a bit of fun
    to whack.


    I suggest you follow the suggestions above if you plan to organize hands-on sessions.
    They serve as a base for all of the very successful hands-on sessions organized
    by the London Software Craftsmanship Community (LSCC) and the ones we run internally
    in our companies.


    +   - Some other important points for running a hands-on session:

    - Don''t make it work. The focus is to practice and learn in a safe environment.

    - Allocate two hours for the session: one hour from the company''s time and one
    hour from the developers'' own personal time (i.c. 4 to 6 pm if the working day
    finishes at 5 pm). This is why we have a mutual commitment to creating a culture
    of learning.

    - Be prepared to run the first few sessions yourself. Very rarely will other developers
    put themselves to run the first sessions. Make sure you run them in a very informal
    and friendly way so others get encouraged.


    # Factor Technology-Agnostic


    Running technology-agnostic sessions It is always easier to run technology-specific
    sessions, if developers are not interested in the technology, they won''t.


    When running technology-agnostic sessions, developers are in control of technologies
    they want to use, which will make the session far more enjoyable for everyone.
    Choose a kata, add a few constraints (you cannot use all else) ask them to pair
    up with you, pair your code every two minutes. You need to use a test-don''t-approach
    approach (write the test first), and let them choose which languages and frameworks
    they want to use.


    Technology-agnostic sessions encourage variety. There will always be a pair trying
    to use a new language or framework. The retrospectives becoming more interesting
    and interactive, because people will talk about the challenges they faced while
    using the technology they''ve chosen.


    # Start Internal Communities of Practice (Cop)


    If you have a few regular sessions running, invite the developers who come more
    often to them to help organize the sessions. Try to meet regularly to discuss
    these sessions and share the load of the organization and facilitation of the
    Cop. Keep it open and democratic so everyone can participate.


    You might need just few people to start the community, internal or external. That
    is exactly how the largest Software Craftsmanship community in the world started,
    so you also start like that. You just need two people meeting regularly to attract
    more people to join. Just sure people are aware that you are meeting and how much
    fun you are having. Share what you are learning during informal conversations
    over coffee or lunch. In no time, and more developers will be joining.


    A just of caution: don''t focus on growing the community. Focus on having fun
    and running good sessions. The growth will come naturally.


    # Encourage Pet-Project Time


    If you or anyone on the team has a pet project, or wants to start a pet project,
    make it known. There is nothing'
