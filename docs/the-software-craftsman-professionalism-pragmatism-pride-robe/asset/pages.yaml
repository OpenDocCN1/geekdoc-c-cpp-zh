- pgno: 109
  md: '# A. Craftsmanship Myths and Further Explanations


    I''ve had many discussions about Software Craftsmanship over the years, and it
    seems there are a lot of myths and misunderstandings related to the terminology
    used by the Software Craftsmanship movement. Even inside different Software Craftsmanship
    communities, there are some differences of opinion about what counts as truly.


    Unfortunately, this is not an easy problem to solve. Myths and misunderstandings
    are unavoidable, especially when a specific topic becomes popular, and many people
    around the world get it in. It has happened before. It happened to Agile, Scrum,
    Kanban, programming paradigms, management and many others. Due to the vast diversity
    of our industry, and the many personal experiences and biases, it is no surprise
    that we have so many different opinions about Software Craftsmanship.


    In this appendix, I will try to clarify some of these misunderstandings and myths.
    My opinions are based on personal experiences, my heavy involvement in the Software
    Craftsmanship movement, and many conversations I have had with many professionals
    that I generally respect. Some of these professionals are deeply involved in the
    Software Craftsmanship movement, while others never wanted to associate with it;
    for one reason or another, they don''t agree with some of the things that came
    out of the Software Craftsmanship movement.


    # Software Craftsmanship versus Software Developers


    Every craftsman is a developer but not every developer is a craftsman. To many
    people, this has nothing to do with seniority or skills. The difference is more
    about what each developer attaches to his or her profession. Through many developers
    I know, saying that you are a craftsman doesn''t make you a craftsman. Similarly,
    saying that you have values means nothing if you don''t adhere to those values
    at all times. The values are formed by your actions, not words.


    I''ve met a few developers who prefer not to call themselves craftsmen. They don''t
    want to "label" themselves and don''t really care about this whole "craftsmanship
    thing." However, their profession, the care for what they do, the practices they
    use, the dedication they have to improving themselves, and the respect they have
    for their work make them craftsmen, like or not.


    Being a craftsman doesn''t mean you are superior or better than any other developer.
    When a developer calls herself a craftsman, she is just stating her values and
    professional stature. But that doesn''t mean that developers don''t craftsmen
    have the same values or attitude.


    # Elitism


    Quite a few times I have heard that the Software Craftsmanship is an elitist movement.
    I must confess that I was really surprised when I first heard that. From my experience,
    the Software Craftsmanship community is one of the most inclusive communities
    I ever seen. It embraces developers from all sorts of backgrounds and levels of
    experience. All the sessions promoted by the communities are about sharing knowledge
    and learning from each other, and every single developer there is more than welcome
    to join.


    But as you have a large group of people, there''s always a small minority of individuals
    that may not behave according to the values of the group.


    # Apprentice, Journey, and Master


    To be honest, I don''t really like this part of the metaphor and that''s the reason
    I barely mentioned it in the book. In reality, terms like "journey" and "master"
    are very used within the Software Craftsmanship community. They are just metaphors
    and we don''t care too much about.


    The relationship between "mentors" and "apprentices" is used far often, and respect
    favor better than what we believe.


    A common misunderstanding is to think that developers who call themselves "craftsmen"
    are also calling them "masters." I have personally never seen a single example
    of that. The interesting thing about this metaphor is that the critics of Software
    Craftsmanship talk about far more often than the software craftsmen.


    # Master Craftsman


    This is a title that a very experienced software craftsman may have inside a company
    that is based on the Software Craftsmanship principles and values. However, this
    doesn''t make the master craftsman a master craftsman for every single craftsman
    out there.


    No one calls herself "master," but some professionals may consider other professionals
    as "masters" in certain disciplines.'
