  md: '# # 10. Software Craftsmen


    Interviews are a two-way street. Companies try to find developers who can help
    them achieve their goals, and developers try to find out if the hiring company
    is a good fit for their career aspirations.


    As companies generally conduct multiple interviews as part of their selection
    process, it is vital that developers use the interviews to learn as much as about
    the hiring company. Choosing a new job is an important career decision and can
    also have a direct impact on our personal lives; we may be spending more time
    at work than we spend with our loved ones.


    In this chapter we look at how companies and developers can identify whether they
    will have a productive partnership. We will then look at some interview techniques
    and describe how to interview software craftsmen.


    # ## A Business Negotiation


    As technology evolves, the need for software professionals increases. In order
    to have a competitive advantage, companies now demand that they hire talented
    and passionate developers and, most importantly, pay them well. This is highlighted
    in an article in InfoWorld. The US Bureau of Labor Statistics projects a 30 percent
    job growth in the coming years, and CareerCraft deemed software engineering all-around
    best for 2012.


    During an interview, it is important to remember that we are not begging for a
    job. We are doing a business negotiation. On one side we have needs and goals.
    On the other side we have a software perspective which could help the company
    negotiate better contracts; the most important aspect of providing a service,
    as a contractor or a permanent employee, is to understand and measure the rewards
    and risks of that negotiation.


    Every craftsman has a reputation and anything that can damage that reputation
    must be a risk. An example would be to join a project that is behind schedule,
    with dubious business value, control and management, and in a company where developers
    are treated as factory workers—just following orders, coding a piece of software,
    with no say in, and with no contact with users and stakeholders. The chances of
    bringing a project like that back on track are close to zero, meaning that the
    only software craftsman who can save it is yourself. This is a frustrating situation,
    and the partnership must not be rebuilt by a software craftsman. However, if the
    project is in trouble but developers have total autonomy to do whatever is best
    to save the project, working with collaboration, then this project can be a great
    opportunity for a craftsman.


    # ## Identifying Predictive Partnerships


    Companies and developers are looking for the same thing: a productive partnership.
    However, during interviews, each side has a different perspective on what a productive
    partnership should be. Let''s look at these different perspectives.


