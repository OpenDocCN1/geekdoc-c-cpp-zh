  md: 'Almost immediately after the start, the conversation was taken to the Internet
    via a Google group. A few people from England and a few other countries also jumped
    in and had plenty to contribute. Bit by bit, Software Craftsmanship starting in
    the UK, a few places in Europe, and to many other countries around the world.


    In March 2009, after loads of debate, a summary of the general consensus was decided.
    It was presented publicly, for both viewing and signing, in the form of the Software
    Craftsmanship Manifesto.


    # # Crossing Borders


    On February 26, 2009, the first international Software Craftsmanship Conference
    was held in London. Also in London, in May 2009, Adewale Oshine held a seminar
    for the aspiring software craftsman, and Enrique Rieiesen started The Wandering
    Book, a book that travels from craftsman to craftsman, the current thinking, the
