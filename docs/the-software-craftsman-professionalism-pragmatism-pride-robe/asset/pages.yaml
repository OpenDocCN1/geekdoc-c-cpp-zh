    help them with the technical disciplines. However the average Agile coach, due
    to a lack of technical knowledge, will overwhelm the process side (misleading
    the client) and, often will not mention the technical side at all.


    It is far easier to sell process management than the importance of technical excellence
    and all the effort we need to make Agile. Senior managers really well fail to
    see the benefits of developers playing a part bigger than just writing code. They
    also fail to understand the importance of paying attention to the quality of the
    code produced by developers. As they at how it works, they are happy


    Senior managers, coming from technical backgrounds, are easily misled by bad Agile
    coaches. After a few months, or years, of adoption, when things goes wrong, it
    is very easy for Agile coaches and managers to blame the developers. Sometimes
    they are at fault, but the question here is how will the Agile transformation
