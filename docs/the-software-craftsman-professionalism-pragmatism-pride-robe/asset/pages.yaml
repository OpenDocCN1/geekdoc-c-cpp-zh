    One way of making the system is working correctly, once all the changes made by
    developers are integrated, is to have a QA team. While they manually execute a
    prescribed set of tests and plans, and report back after a few days or weeks there
    are any bugs or not. But that will be the feedback loop.


    Continuous integration, with TDD, can reduce this feedback loop. Every time a
    developer commits some code, the suite of tests is executed and an error message
    tells the entire team when that tests fail.


    This practice needs to be built without a broken build, which means the problem
