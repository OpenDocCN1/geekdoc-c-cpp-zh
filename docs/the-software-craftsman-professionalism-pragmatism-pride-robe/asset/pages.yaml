    +   **The Fanatic**: They are totally devoted to a single subject (or point of
    view) in a manic fashion to the point where it can be considered an obsession.
    Developers in this group are the ones who dedicated a long time to learn and become
    a specialist in one particular—usually a tool, language, or framework. This is
    the only thing they know well, neglecting all other possible alternatives. Their
    obsession is not always about a particular tool or framework. Sometimes they have
    to disagree with anything you are proposing, which is very particular particular
    design technique, methodology, or process. They are very well-prepared to have
    debates for extended periods of time.


    # Be Prepared


    There are a few things you must have to want to change things now. The most important
    is courage. You cannot be afraid to engage in debates with managers, technical
    leaders, and fellow developers; discussions are unavoidable and you need to be
    prepared for them. You must be brave and say everything you think, no matter what.
    Honesty and transparency are core values for any software craftsman. You also
    need to believe that you will be able to convince others to do anything if they
    don''t feel they know what you are talking about.'
