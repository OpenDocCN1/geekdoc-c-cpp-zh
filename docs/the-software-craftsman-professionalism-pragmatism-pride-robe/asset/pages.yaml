    # Rejecting Technical Practices


    But there is the other side as well. There are very good Agile coaches and consultancy
    companies out there doing an excellent job advising and helping their customers.
    When it comes to XP days, they get ugly. Many customers immediately reject the
    idea of having two developers pairing together—think it is a complete waste of
    money. They immediately reject the idea of investing in tests upfront and the
