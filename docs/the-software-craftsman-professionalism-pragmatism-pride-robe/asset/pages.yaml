  md: 'development is not an exciting career, and like theirs, they start planning
    how to become managers or architects; they believe this is their natural career
    progression. These young developers, as they join our industry, have to deal with
    much and unnecessarily complex code produced by their seniors that, for them,
    creating presentations on PowerPoint and spreadsheets on Excel seems more attractive
    than writing code.


    On the other hand, if the same developers had been brought up in an environment
    where their seniors were always trying to get ahead as they do, getting excited
    every time they found a better way to do things or learning new tricks—these developers
    would have enjoyed their professions. With highly motivated developers who favor
    doing what they do and who are constantly looking outside their own cubes, companies
    could benefit immensely from all the innovations and efficiencies they would bring.


    However, instead of many managers trying to improve how, when, and what developers
    should learn, companies should foster freedom which may lead to lack of interest.
    Let developers decide how, when, and what they want to learn. With this freedom,
    developers have a much better chance of creating and building a culture of learning.
    The better the developers, the more innovative and agile the company can be. If
    the company becomes a place where developers are happy, many other good developers
    will be attracted to it.


    Let''s explore some of the things developers can do to create such an environment.


    # Start a Book Club


    Pick a book and tell everyone you will start. Tell them what the book is and check
    if anyone is interested in having a discussion about it at lunchtime—or any other
    suitable time. If at least one developer is interested, you are ready to start.


    If one is interested, ask what other developers sort of book (or subject) they
    want to explore. Make a list of the topics, pick the one that is most interested
    in, do some research, and present them with a small list of books on the topic.
    As a group, choose one of them and schedule the first meeting.


    If no one is interested, start reading the book, take the time to share what you
    are learning during informal conversations. Maybe some of the developers initially
    not interested will change their minds and join you.


    # Have a Tech Lunch (Bag Session)


    Ask your team, if they want, would like to have lunch together while talking about
    technical stuff. The meeting doesn''t need to have anything; decide what you want
    to talk about when you get there. Although it could be beneficial to discuss improvements
    to the project you are working on, don''t make this about Work. What about learning.
    Make about different technologies, approaches, techniques, or whoever else you
    want to share and discuss. If people do want to talk about work, then some of
    the ideas discussed could be used to improve the project you are working on, schedule
    a time to discuss it.


    Tech lunches are easy to set up because there is no preparation or organization
    needed. You just need a place and bring people along. I recommend using a meeting
    room near a coffee shop or restaurant; that you can use whiteboards, charts and
    projectors


    # Have Group Discussions (Roundtables)


    Divide a wall or whiteboard in two. One side is for talks; the other side is for
    topics to be discussed in a group. Hang Post-its for all the participants (or
    them on the table). Ask participants to write the title of the talk they want
    to give (five minutes for the talk, two minutes for questions) or the topic they
    want to discuss as group.


    Start with the talking. Giving people talk can stand up and speak. You can use
    the whiteboard or projector if they want. Make sure you control the talk. If there
    are many questions after the talk is finished, interrupt with time and moving
    the talk Post-it to the group discussion. Tell everyone that they will have the
    opportunity to discuss that topic if they want to.


    Once the listening (if any) are over, move on to the group discussion. Read the
    first talk out loud and whoever it wrote a 30-second summary about what they want
    to discuss. Do it for all the talks. Once all the talks are explained, check if
    anyone has any questions. In a single discussion: make sure people collaborate
    and are happy about merging the topics. Once this is done, start all the topics
    again, then ask people to raise their hands if they would like to discuss that
    topic. Write down next to the topic (or on the board) the number of people interested
    in the topic. If there is a clear winner, ask the person who proposed the topic
    to start the discussion. Before the voting, tell people that they should try to
    vote for a single topic but if they are really undecided, it is OK to vote for
    more than one.


    If there are two or three topics that have the same amount of votes, you can do
    one of the following:


    +   * Take the two most-voted topics and split the people in two groups (you will
    need to have another'
