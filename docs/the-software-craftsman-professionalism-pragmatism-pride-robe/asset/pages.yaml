  md: '# 9. Recruitment


    The first thing to do when hiring a new person is to make we are not making our
    existing problem bigger. If we are unhappy with how our developers work or behave,
    there is no point in hiring more developers who work and behave in the exact same
    way. If we want developers to be constantly learning, bringing innovations, adopting
    more efficient practices, caring about the project and quality of the code, self-organizing
    to solve problems, and striving to be better than they do, why would we hire more
    developers who satisfy this criteria? Although this sounds obvious to many of
    us, it is not so obvious to hiring managers and the human resources department.
    Although every company would say they want the best people, they do not really
    know what that means. And a proof of that is they are averse to job openings.


    In this chapter we look at how to attract software developers to our organizations
    and how to do proactive recruitment. We will also look at how to craft job descriptions
    and how to avoid descriptions altogether.


    # An Ordinary Job Description


    The following advertisement was adapted from a job site and anonymized to protect
    the poor souls who wrote it. Financial institutions normally have job listings
    like the following:


    | Our Client, Major Bank, is currently looking for a Java developer to work in
    their London office on a long-term contract basis. |

    The successful applicant for the Java Developer position will have the following
    skills and experience:

    * Strong Java programming skills, multi-threading and concurrency (minimum of
    5 years'' experience)

    * Very good Spring background (Integration, Spring Batch, MVC and IoC)

    * Banking background (minimum two years)

    * Latency High Frequency Trading systems—Foreign Exchange

    * FX price (soft, but towards future and precious metals)

    * Front office trading risk management and pricing in Foreign Exchange

    * Strong academic background in Computer Science (preferably Masters or PhD)

    * Solaris, Linux, RMDS, 27, KvQ, SQL (Oracle), Coherence

    * Desirable: C, C++, messaging, Agile methodologies, distributed/replicated caches,
    Sbase, DB2

    We offer £80k–90k base + up to 30% bonus; excellent package to include 20–30 days
    holiday + private care for family + good pension + other benefits.


    If you are interested in this Java Developer position and have questions please
    contact us. The above requirements apply immediately.


    Due to my experience and personal knowledge, I know that the companies that list
    job bindings are not only looking for another Java developer. They have far bigger
    problems in their projects, processes, culture, and what they are really dealing
    with. Unfortunately, they do not know how to solve these problems or how to hire
    the right people to help them.

    This job listing is about investment banking. Many of the developers who created
    these legacy enterprise systems in one bank are first focused on spending even
    more money on projects after they realize that they can easily find a Java developer
    for another bank. They tick off all the keys in the list: they have competent
    developers, experience where they have the technologies (although they do not
    know how to use them) and have investment banking experience. These developers
    are free to move from one bank to another to whoever they want. They be to want
    to deliver quality software, but they don''t realize that they need to hire the
    right people who can do it better. But, for unfortunately, they don''t really
    understand that it is if they want to hire better people, they will need to change
    their recruitment process. They will need to change how they attract great developers,
    starting with their job description. This listing is misleading because it says
    they have no previous experience in an investment bank, a degree in computer science,
    or don''t (have) experience with the specific technology.


    Of course this is not just about investment banking. Many companies with similar
    problems also have advertisements like this. For companies to change their culture,
    struggling with low morale, with technical debt, and lacking passion to innovate,
    how is this job listing? If the goal is to improve their delivery, change the
    way things are done and improve the culture of the company—this job listing is
    totally pointless. The listing has the wrong focus, to express the company''s
    values and the attitude that it expects from each candidate. Hiring people بمعنى
    based on technical knowledge will not help drive technical and cultural changes.'
