    # Proactive Recruitment


    When we started Codature, one of our first clients, an international company,
    asked us for a unusual service. They asked us to help reshape their recruitment
    process and interview candidate.


    We were growing fast and had to hire more than 70 developers to cope with their
    demand. They needed developers of all levels—junior, senior, architects, employees,
    contractors. They also needed analysts, developers (Ops), and testers. They were
    hiring for many new projects and needed developers in various languages and technologies.


    One of the reasons we asked to help them is that they couldn''t cope with the
    volume of interviews, and they were not able to quite how to recruit all developers.
    They needed us to get talented developers to join the team because these developers
    would work directly with their clients, developing bespoke software.


    Before they hired us, they were in desperation. They had no time to fill all those
    roles in order to not lose business opportunities. The problem is that when you
    are in desperation, you increase the risk of making mistakes, especially when
    it comes to recruitment. You ended up lowering the bar and recruiting anyone you
    please.


    It took us some time, but we managed to help them reshape their recruitment, with
    the advice we wrote in this book, and we manage to select some developers for
    them.


    We learned a lesson which never allow your company to be in this situation. When
    you are desperate you will you bring the wrong people to your organization, although
    you may think that you are at least getting some developers in place which are
    going to end. They will end even before you expect, your clients will be very
    dissatisfied with the service provided by them bad.. Besides damaging the reputation
    of the company, your company now has many developers on the bench, waiting for
    their next project.


    At Codature, we decided to be proactive with our recruitment process. We did not
    want to wait until a bad developer came in to start hiring. Hiring good developers
    is very difficult when you are in a hurry; that are when you really need a good
    developer, you can only find one quickly with enough. The difference is that we
    make our specific process enough so that only the types of developers we are actually
    looking for apply. This helps us not only to reduce the number of applications,
    but also to increase quality.


    When we are not ready to hire but still have applicants, we tell them at the start
    of the recruitment process that we are not hiring straightway. If they want to
    go through the selection process and pass, they will be the first ones we call
    as soon as we need to. As part of our selection process, we use code assignment
    that at least is a way to test and convince them to go through the process, even
    that we are not ready to hire, we provide them with a very comprehensive review
    of their code. With this approach, applicants at least get some valuable advice
    on their code, and we can build a pool of talented developers who have passed
    our process, and we can call them when we are ready to hire.


    # Summary


    Companies can benefit from engaging with local users and communities. It gives
    them a good chance to meet great and well-established professionals, as well as
    many young developers with high potential. Due to their conflict of interest,
    they do not always care about their clients'' interests and values. Matching keywords
    in a job description to CVs is how usually they are filtering. Their lack of understanding
    about about software development and technologies makes them very poor talent
    scouts.'
