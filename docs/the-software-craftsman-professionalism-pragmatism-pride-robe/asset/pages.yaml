- pgno: 51
  md: 'However, does context always matter?


    Are there companies that really don''t care about satisfying their customers?
    Are there any companies that moved all to getting a good return on their investment?
    Are there any companies that are willing to pay for software that does not attend
    to their needs? Would it be better if the software they are investing in lasted
    five years instead of months? Agile context is important, there are many things
    that are not context dependent.


    # # Extreme Programming


    In 1996, Kent Beck introduced a set of practices that originated XP. Kent was
    the project leader on the Chrysler Comprehensive Combination (C3) project, and
    he proposed and implemented changes in their practices—some of them based on his
    work with Cunningham in the 1990s.


    The multimillion-dollar C3 project needed high-caliber developers working, opposed
    to working in competition and isolation. Beck invited Jeff to the project to help
    develop and refine these methods. Jeff acted as a catalyst to instill Agile practices
    in the team had more Agile practitioners, including Beck Fowler, Martin Beck,
