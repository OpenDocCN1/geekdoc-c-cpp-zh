- pgno: 28
  md: 'of the most open and friendly communities I know. By its nature, language agnostic,
    it is a community that embraces all sorts of developers, regardless of their level
    of seniority or technology.


    Learning from each other is by far the best way for us to become better. Writing
    blogs, contributing to open source projects, making our code publicly, becoming
    part of our local communities, and pairing with other developers are some of the
    ways we can contribute to the great good of our industry.


    Since 2010, Software Craftsmanship communities are being created in Europe and
    the United States and they have many free events every month. We welcome developers
    from all sorts of backgrounds, industries, and levels of experience. These communities
    promote an environment where developers can share, meet, and write code together.


    Besides excites communities, this in our manifesto also includes our work. Great
    developers want to work with great developers. Great developers want to work for
    great companies. What we want to work with people who can make us better, that
    we want to learn and learn from each. We do not want mediocre. We want passionate
    and inspired professionals that we can call colleagues.


    # Not Only Customer, but Also Product Producers


    The first thing to mention here is that we do not believe in the employee/employer
    type of relationship. What the contract says you are a permanent employee, contractor,
    vendor, paid per day, hour, or month is just for formality. We believe in partnership
    above all. If you are a permanent employee, you should treat your customer as
    customer, the same way as if you were a contractor or consultant. Employers, on
    the other hand, should also expect their employees to provide great service at
    all times, like a consultant and craftsman is supposed to. Turning up to work,
    keeping your head down, and doing what you are told to do is not what it means
    to be professional.


    Software craftsmen are not factory. We want to actively contribute to the success
    of the project, questioning requirements, understanding the business, processes
    and product partnering with our customers or employers. This is a different approach
    to the traditional employee/employer model and the advantages for employers. A
    highly motivated team will make the project succeed. Passion and talented people
    want to succeed and will always find ways to overcome problems and boundaries.


    Software craftsman want need successful projects to build their reputations. We
    want to be proud of what. Successfully delivering high-quality software and having
    satisfied customers are essential for a software craftsman''s craft


    Although extremely important, writing good code is one of the things we need to
    do to have a project to succeed. We help our customers to improve their processes,
    provide them with more viable options, help them to remove unnecessary bureaucracy,
    understand their business, question their requirements in the value they provide,
    provide them with good information and knowledge, help them to plan and prioritize
    work, and work on things, although they are not their own. Every detail is important
    to the project. Providing value to our customers at all levels is what we mean
    by having a productive partnership.


    The core business of many of our customers is not building software, so it is
    our obligation to help them run a project in the best possible way. That''s what
    we pay. For developers that says it is not their job if the task is not related
    to real software craftsmen.


    # But Some Customers Are Not Ready for a Productive ...


    Unfortunately, there are some customers that are not ready for this type of partnership.
    They see software development as an industrial process and the least important
    part of the project. For some customers, software developers are as factory workers,
    who are there to follow orders from smarter people.


    Some of these companies focus on getting the cheapest developers they can find
    and always have technical managers to micro-manage them. They will not welcome
    or listen to developers when it comes to business decisions. Some will have no
    say in development skills, to the technical leader (or dictator)


    Working for a company with this mentality is always very difficult for any software
    craftsmen. We always try to turn around this situation and try to prove to our
    customers that we could help them far more if they wanted.


    However, in the same way that customers have to have good developers, software
    craftsmen also want to work for good companies. There is no point in spending
    all our energy and health to help those who do not want to. There is a limit to
    the efforts we make to help our customers. How to select clients (or employers)
    is an essential skill for a craftsman. Choosing for a client who is not interested
    in or does not value the skills of a software craftsman is pointless.


    Choosing clients carefully is essential for software craftsmen to build their
    reputations and move forward with their careers. A partnership, by nature, is
    a two-way street. A partnership is a good partnership only if it is good for both
    parties involved. If you don''t find that the partnership with your client is
    good for you, it is probably time for you to find another client.'
