    bureaucracy and their hierarchies. However, I realized I could help them adopt
    technical practices and bring new ideas into the existing ones. I was looking
    for a job where I could find some of the gaps that I had in my career. The return
    on investment I was looking for was experience in developing software at a very
    scale, with teams all around (the world I was not familiar with), and opens doors
    in an industry that was closed to me—usually you need to have previous experience
    or a financial background to be hired as a high in an investment bank. I wanted
    to see how effective of all my preferred software development projects and techniques
    would work. Exposing myself to an unfamiliar environment allowed me to learn and
    discover different ways of doing things. That was the return on investment I was
    expecting from this job.


    > Note'
