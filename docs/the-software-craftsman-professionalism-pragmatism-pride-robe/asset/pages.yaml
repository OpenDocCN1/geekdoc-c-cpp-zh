  md: 'deallocating in another method. This is a potential risk of memory leak. You
    have heard about temporal coupling? Can you see this of lines here? If you thought
    a little harder, you could reduce these lines to two. Do you know what happens
    when you have a try/catch block this? What about the names of this variable and
    method? What do they mean? Have you ever thought that some of couplings, needing
    to change this, may not have the same amount of information and context as you
    now? How would you feel if you knew about this part of the code? If you had to
    maintain it every you wanted to change where it points to, would you need to open
    it, change it, and explain why? Do you have this code duplicated all over the
    place? This is a method. How would you need to keep in head if every single method
    was there? What about making smaller and naming them after behavior?


    At some point he started starting at a fence of keys. In the 1990s, a developer
    would be considered a senior if he could code that no one else could! He must
    be really good. I have no idea what his code did. And I had to have to sort through
    all of it for some time before I figured out what the code did. I was expecting
    a compliment, at last. "How disrespectful is this?" he said. Now working on a
    large system, with many developers and working on the same base. Can you imagine
    how hard it would be to understand someone''s code written to show off what he
    is if he''s imagine? Imagine things, if millions, of lines like that." And he
    said.


    It was just 200 lines of code, and I could not answer any of his questions or
    find a good response to the hints he gave. By line by line, I corrected it, and
    explained to him how it could be better. Because we reached the end of the file,
    he was strange and extremely annoyed. He was also very calm, if he had been looking
    at some code writing that was absent for a long time. He agreed with all the why
    missing?

    Without saying a word, I said. "Do you feel you could code this code in a better
    way?" Without looking at him, I just nodded. I changed a few keys and deleted
    the entry with all of it. "Excellent since you have three days left to do it."


    "Sandro," he called when I reached the door. I stood up and looked back at him.
    "How is it as important as getting it done."


    I was frustrated. In fact I left his office, went straight down stairs, and then
    outside the building. The code he wrote was so bad that I thought he was a joke
    for a guy like that. Not with this company. I was resigning. After a few cigarettes,
    lighting a little cigar, I started reflecting what had happened. Never had I spent
    an hour over one hour through my code and explaining to him how it could be improved.
    I learned from the occasion that if I wanted to be a great, I had to be much better.
    I realized that for the first time since I wrote the first line of my life, I
    found someone who took the time to show how to write good code. I found someone
    who was better far and more experienced than I, who really cared about making
    others better. I found someone who cared about quality and became my first mentor.


    After a few cigarettes I pulled myself together and became a different person.
    That day what I learned was not good as I thought. I learned to be humble. I had
    a lot more to learn. I learned that getting things done was not enough, especially
    when you are working in a team. I learned to be to people and not keep crap code
    just about his or her work


    For two years I worked with him and some of the best developers I ever met. That
    experience shaped me not just as a professional, but also as a person. Although
    we never used the method, I realized more than that from my first experience with
    Software Craftsmanship. I learned from all those them. What was really important
    to learn was the attitude that makes a better developer.

    Technically speaking, it was a great experience, but it was not the most important
    thing. The last thing he said during our first code review session changed me.
    Years later, I joined the London Software Craftsmanship (LSC) (https://meetup.com/group/software-craftsmanship/)
    and Namur''s works. "How is it as important as getting it done," were some of
    the first words I heard on the website. Later I had LSC''s shirts with those words
    on them. Those words did not make me a better professional, but they also made
    me a better person.


    # About This Book


    After decades and many different methodologies, software are still failing. Why
    they fail, there are a few things that cannot be ignored; companies see software
    development as a production line; not how to manage projects and how to hire good
    developers, and many developers still behave like unskilled, unmotivated workers,
    providing very poor service to their employees and clients. With the advent of
    Agile methodologies, the software industry took a step forward, but the percentage
    of failing projects is still incredibly high. Why are we all failing? Why are
    we so bad at delivering successful projects? What is missing?


    Although the term "Software Craftsmanship" has been around for over a decade,
    it was not until it emerged as a viable solution for many of the problems faced
    by the software industry today.'
