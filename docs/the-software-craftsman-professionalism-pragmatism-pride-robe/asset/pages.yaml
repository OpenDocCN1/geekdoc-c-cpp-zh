- pgno: 110
  md: 'I have a lot of respect and admiration for a few professionals inside and outside
    the Software Craftsmanship movement. They are people who taught me a lot and inspired
    my career. For me, and maybe for others, they are "masters."


    # Narrow Focus


    Another very misunderstanding is to think that Software Craftsmanship is TDD and
    "beautiful" code. Some very uninformed people, mainly from the Agile community,
    have made comments that software craftsmen are shortsighted and have a very narrow
    focus. I hope that the content of this book helps explain that Software Craftsmanship
    goes beyond TDD and well crafted code.


    Lean, Agile and Craftsmanship are totally aligned and have similar values. They
    all focus on providing value to clients through transparency and feedback loops.
    The major difference is that their practices and disciplines are best applied
    in different spheres of an organization.


    # Craftsmanship versus XP


    Craftsmanship is an ideology, XP is a methodology. An ideology is about values,
    attitude, and behavior. A methodology is about practices that solve specific problems.


    XP is also based on values (simplicity, communication, feedback, respect, and
    courage), but it is more commonly known for its practices.


    Craftsmanship focuses on, a professional attitude is totally related to the practices
    we use, and currently, the majority of these practices are XP practices.


    # Attachment to Practices


    Software craftsmen are not attached to practices. They are attached to the practices
    that give them. For the vast majority of projects, XP practices have to be the
    practices that provide value to clients and development, and that is the reason
    why Software Craftsmanship advocates them.


    Our industry is in constant evolution and we are always trying to uncover better
    and more efficient ways to deliver software. Practices are chosen according to
    the value they bring, and whenever we find practices that could give us more than
    the XP practices, we are more happy to adopt them.


    # Agile Coaches and Managers


    While reviewing this, I noticed that it was quite tough, unf own on, Agile coaches
    and managers. My professionalism, knowledge, and ability to express opinion about
    a specific subject, is not as easy to put down into the implied knowledge and
    personal experiences we have which serve as a context for that position.


    I have the pleasure of working with some great Agile coaches and managers. Their
    ability to deal with tough situations (business or people-related), was so rare.
    Unfortunately, I worked with many bad Agile coaches and many managers who were
    useless, or at best, not very good at their jobs.


    Due to their positions, power, and influence, these changes can damage not projects,
    but also an entire organization. Working under bad leadership and being advised
    by bad Agile coaches can destroy the motivation of a team, causing a lot of frustration,
    and even make the best leave the company.


    In many parts of the book, when referring to Agile coaches and managers, I was
    thinking about all the bad ones I worked with and not the good ones.


    Agile coaches and managers are very important in some organizations, and I have
    a lot of respect for great professionals, regardless of what type of work they
    do.


    # Software Apprenticeships


    Some people have asked why I started writing about software apprenticeship. For
    a Software Craftsmanship book, this is a fair question. There were a few reasons
    that me did not decide to it. The main reason was that software apprenticeship
    is a huge topic, with many different people and companies doing in a completely
    different way. Although I have my own views on the subject of a software apprenticeship
    program at Codars,, I felt the topic would take a big chunk of the book and would
    end up deviating from it core message. However, it is still my plan to write about
    it in the future. Maybe in another book or a series of articles.


    # The Problem with Metaphors


    A metaphor is a figure of speech that describes by asserting that it is, on some
    point of comparison, the'
