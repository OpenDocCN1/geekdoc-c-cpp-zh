- pgno: 26
  md: 'The LSCC is currently the largest and most active community in the world with
    over 2,000 developers, organizing around four to five events per month, and an
    annual Software Craftsmanship conference–SoCrates UK. The LSCC also serves as
    a menu to help others organize communities around the world they started.


    # # The Software Craftsmanship Manifesto


    Trying to avoid out the anticlimactic aftermath of the 2002 Software Craftsmanship
    Summit, Micah Martin really wanted to come out of the Software Craftsmanship Summit.
    He wanted something to write down and a craft of some kind that he could call
    his own. They discussed, among other things, what it means to be a craft and what
    it means to be an apprentice. They also discussed the document who would be written
    for, what the contents of it would be, if the document already existed, and if
    it needed to exist at all. The ideas were captured on a whiteboard and they came
    up with lots of ideas, there was far too much and it was far too much shorten
    to a finished document. Before closing the summit, Micah asked everyone to sign
    on what they had on the whiteboard


    Doug Bradbury went into action and proposed the outcome of the summit in the group
    and collected feedback. In February 2009, Doug made an email "The New Left Side,"
    which started to get the values and was refined into the actual Software Craftsmanship
    Manifesto. There was a debate about the Agile Manifesto and the Software Craftsmanship
    Manifesto, which was critical in moving forward. The manifesto they discussed
    was "The New Left Side" by Doug Bradbury and "Side Revisited" by Scott Firth.


    The discussion revolved around the question, "Why a Software Craftsmanship manifesto?"
    Cory Haines agreed saying, "By making a community, publishing a manifesto, beginning
    on establishing principles and schools of thought, we are creating a new type
    of developers who can see. Those who are really interested in apprenticeships,
    journeys, and programs. In some cases, this will need someone to foster these
    ideas, hopefully following their footsteps then they create a new manifesto for
    themselves."


    It was a fascinating conversation which shaped the final language of the manifesto.
    The whole discussion could be read in the Software Craftsmanship group. After
    a few weeks, Doug presented an elegant manifesto based on the ideas discussed,
    with the structure of the Agile Manifesto. It was great, and the community in
    general approved it. Within another couple weeks they built and published a site
    where people could use "The Manifesto for Software Craftsmanship."


    # # The Manifesto


    As aspiring Craftsmen we are raising the bar of professional development by practicing
    it and helping others learn the craft. Through this work we can come to the following
    value:


    +   - Not working software

    - also well-crafted software

    - Not only responding to change,

    - but also adding value

    - Not only individuals and interactions,

    - but also a community of professionals

    - but productive partnerships


    That is, in pursuit of the items on the left we have the items on the right to
    be indispensable


    In the manifesto, the essence of Software Craftsmanship is captured in its "Raising
    the Bar." The manifesto summarizes values, frustrations and aspirations of very
    experienced and talented developers. For them, projects had to stop failing because
    of poor management, ill-defined processes, and of course, code written well.


    Developers are taking the matter into their own hands and are trying to change
    how the industry software development works. They do not just by proposing new
    revolutionary and processes but also by showing their customers what they can
    do. When they show that their customers want to work together with them in order
    to produce and long-lived software, helping them to achieve whatever they want
    to


    Not Only Working, but Also Well-Crafted Software

    Think about a five-year-old application. Imagine an application that has no tests;
    no one knows exactly how the application works; the code is full of technical
    debt and infrastructure instead of expanding the business, classes and methods
    however, if not thousands of. Also imagine that you need to make changes to this
    application; writing tests is to a massive undertaking. Of course, you, can pair
    with the other developers on the team. No is no team. You are the team. All the
    developers who work the application have left and the only thing you have is a
    graduate who was hired few weeks ago to look after the application.'
