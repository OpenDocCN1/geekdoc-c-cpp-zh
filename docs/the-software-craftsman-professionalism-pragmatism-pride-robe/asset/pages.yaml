- pgno: 14
  md: '# 1. Software Development in the Twenty-First Century


    I remember my early career in the 90s. After those years, I considered myself
    a senior developer. I could mix assembly with Pascal and import my friends. I
    could code in at least four programming languages. Most important, I could write
    Delphi code—to see a few lines of code and understand Windows programming interfaces
    (APIs)—that very few developers were able to understand.


    That''s how seniority was measured back then. If you couldn''t understand a piece
    of code, normally it was because you were not senior enough. And without stupidity,
    it was common to hear managers and developers say—“We can''t change this code
    right now. We need to wait for Henry Hacker to fix it because no one else can
    understand.


    After years in the industry, I was done being a developer. It was time to move
    on with my career. I didn''t want to be called a developer, or forbid, a programmer
    or any coder. From that point onward I would call myself a software architect.
    At that time I was working for a business company and our projects were large
    Java Enterprise Applications (JEE). We were also using Rational Unified Process
    (RUP), and had to struggle with entities, classes, and sequences.


    After some time with this great company, I was promoted and moved to the architecture
    team, where we never had to draw our classes without first using Design Patterns
    books. Besides the Gang of Four (GoF) design patterns and the JEE patterns extremely,
    I knew Unified Modeling Language (UML) and Java certifications. I had more experience
    than skills, and credentials to be called a software architect.


    nMy job, as an architect, was to speak to business analysts, understand the functional
    and non-functional requirements, and create diagrams that specified what developers
    had to do. I also had to think hard—very often using my crystal ball and checking
    the direction with my finger—to come up with the rights that architecture would
    work without growing input. I had to predict the needs of all the features that
    would be added to the system in the future, and it was impossible to predict exactly
    how the system would grow. The solution to this problem was to let adds and design
    patterns all over the place. Today, we call this over-engineering and stupidity.


    After a few months on the architecture team, I realized that I was far more connected
    to my teammates in the development team than I was the others. I was constantly
    having lunch with the developers, talking to them, and also had to show them how
    they were using different parts of the application. I also realized I was spending
    far more time than using code in my spare time; now I know it was because I was
    not writing code at all and I missed writing code and debugging.


    After one year just being de-coupled from documentation, I had enough. My boss
    wanted to move back to being a developer as a technical architect. You know how
    many developers would like to be in the architecture team? You know how many of
    them wanted to be like me? Of course, I was a developer before. I knew how many
    of them wanted to be architects. “This will be a very easy problem for those who
    want to be told,” they said.


    You have many developers you can choose from to places with me. One week later
    I was back in the development team. Life was good.


    I realized how important that decision was. I spent weeks trying to figure out
    how the development team was the right thing to do. On one hand I had the “status”
    of being an architect in a large company, seniority (recognition you don''t write
    code, you tell people what to do), superiority (compared to other developers),
    visibility (by management), career advancement, and responsibility (looking at
    the big picture). On the other hand I loved being a developer, creating diagrams,
    writing code, and discussing long-term tasks that very rarely satisfied the test
    of time. Then I made my decision: to choose happiness. Happiness was being I could
    write code every day I wanted. From that point, I promised that I would only choose
    jobs and positions that would make me to wake up in the morning and go to work.


    Decisions that can change our careers personally and professionally. If I had
