    Book in a few blogs.


    In October 2009, the first Apprenticeship Patterns: Guidance for the Aspiring
    Software Craftsman, by Adewale Oshine, published. This book was one of the first
    books to publish, with practical advice, software developers to look after their
    careers, purpose, and their profession.


    From forward, Software Craftmanship Conferences have been held every year in the
    United States, Kingdom, and from 2011, in Germany as well.


    # # Craftman Swan


    In April 2009, Lyth and Olivia mentioned many of the details about the swap. The
    Chicago Tribune covered it on June 15, 2009, mentioning the mutual respect between
    the two companies, in terms of their technical capabilities, which made them believe
    they could learn a lot from other. Many, as a first reaction, would think this
    is utter but in reality it shows that the companies have a different way of seeing
    things. "I like not really competing against each other but against the people
    we there [whose] want is to get as much money as they can... just putting out
    freely without thinking how software has lived for a long period of time," - Cory
    Hames, who helped to organize the swap and was the originator of the idea.


    > "Initially there were concerns from both sides on how it would work and we were
    all very excited," said Tyler Jenkins from Obama. "We experienced that they couldn''t
    get anything else anywhere. We [send] someone who was both an experienced developer
    and someone we thought represented the Obama view."


    The developers involved as normal developers, working with other developers and
    doing real work. They wrote code, in meetings, and behaved as if they were working
    for the other company-at least during that which helped them learn new patterns,
    new styles, new languages, and so on.


    > "Experience - I know that the benefits to the company were not necessarily visible
    in the direct sense, but for the those who participated and the community," said
    Tyler. During the conversation I asked him if he would recommend other companies
    to do the same and if he had any advice." He said, "It makes a lot of sense for
    software development companies to do this, especially if they''re not in direct
    competition. It works well especially if they are careful, thoughtful developers,
    a.k.a.''craftman, a.k.a.''crafts,'' should swap regularly. There are many different
    ways to approach a problem successfully and it has been my experience that each
    group has things more than the others. Swap lets companies to take the best practices
    from each to improve their own."


    In my view, this was a starting point for the industry as a whole. Initiatives
    like this software developers to get better and help companies to be more competitive.
    producing products and solutions.


    # # Software Craftsmanship Communities


    Although there was some noise about Software Craftsmanship since 1999, it was
    in 2009 that the field flourished. Besides communities and a few conferences,
    the Software Craftsmanship movement really gained traction with the creation of
    a global list and a few communities in the United States, London, and a few others
    in Europe.


    In December 2009, Levi founded the Israel Software Craftsmanship Community. In
    August 2010, David Green and I founded the London Software Craftsmanship Community
    (LSCC). SoCates2011, Craftsmanship and Testing conference in Germany, several
    Software Craftsmanship communities were founded: the Paris Software Craftsmanship
    Community was founded in October 2011, the same time the Softwarekammer started
    with Software Craftsmanship communities in Germany. The Germany are now more than
    than fifteen communities around the world. Many other communities have been created
    around the world since.'
