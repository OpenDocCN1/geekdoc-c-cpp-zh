  md: '# 11. Interview Anti-Patterns


    Paying attention to detail during the selection process is one of the best ways
    to get insights into the culture and values of the company. Experienced and talented
    developers are very selective about the clients they want to work with. On top
    of the financial offer, autonomy, mastery, purpose, productive partnership, and
    talented people, and a good working environment are some of the things they will
    consider before accepting any offer. How they are interviewed, and most importantly,
    the people who are interviewing them can be decisive factors in them accepting
    the job.


    In order to attract software craftsmen, as an interviewer it is important to know
    what to avoid when conducting interviews.


    In this chapter we cover many interview anti-patterns that should be avoided if
    you want to attract software craftsmen to your organization.


    # Don''t Be a Smart-Ass Interviewer


    Don''t try to make yourself look smarter and better than the candidate. Don''t
    intimidate the candidate by putting them in a tough situation for your pleasure.
    Don''t try to impress the candidate with your title, responsibilities, and skills.
    Don''t talk to the candidate as if you were the most powerful person in the world.
    Simply put, don''t be an ass.


    Don''t try to look smart by asking tricky and irrelevant questions. Experienced
    and talented developers will notice this and won''t be very nice to work with.


    When recruiting for talent, you should be looking for a partner, a person who
    can join your team and help you to better, and not a subordinate developer who
    follows your orders.


    Just be honest and humble. Treat candidates like professional developers, and
    conduct the interview as if you were having a great conversation with someone
    you. Most importantly, listen to the candidates and keep your open mind. You may
    learn a few things.


    # Don''t Use Beastayers


    Avoid stupid questions that are totally unrelated to the job. How many golf balls
    can you fit into an airplane? A clerk at a butcher shop stands 5 feet 10 inches
    tall and size 13 sneakers. What does the weight to answer these These stupid beastayers
    has nothing to do with writing-coded code, being a good player, or having a professional
    attitude. Beastayers are a total waste of time, Google finally realized after
    using them for a long time. At least for them, later than never.


    # Don''t Ask Questions to Who You Know the Answers


    Googling for questions and answers to ask candidates before the interview makes
    no sense. If you, as an interviewer, are not sure about the questions and answers
    they are probably not very important to the job. If you are a good interviewer,
    you will know what is important and what is not.


    Don''t try to confuse the candidate with misleading questions. If we don''t do
    that to our colleagues, and even get mad when people do it to us why would we
    do it to likes?


    # Don''t Try to Make the Candidate Look a Fool


    Once I was invited to interview for a very well-known company. They were interested
    in me because I had worked for them for years and had been recommended by a very
    senior person.


    I met two interviewers: a director and a lead architect, whom—hired—would be reporting
    to the director. The director started the interview talking about general things,
    to get to know me better, asking things that I held and discussed software projects.
    We quickly ended up talking about Agile, autonomy, and collaboration. A few times
    they spent 15 minutes talking about the architecture, saying, ''That''s like.''
    What was trying to tell you before I like this:


    Based on the conversation and body language the director and I could work well
    together. However, the lead architect was not at all. He then questioned the conversation
    and asked me to explain bits of the architecture he designed and implemented in
    a previous project. I immediately stood up, went to the whiteboard, and explained
    the high-level architecture and why one of my previous systems worked. After I
    finished, the lead architect looked at me, back again, and with disdain said,
    ''That looks too simple. It''s not a real architecture.'' I could clearly see
    contempt in his attitude.


    I took a deep breath and counted until 25. From that point on, I knew I would
    not able to work with the lead architect. ''Thank you. I''ll take it as a great
    compliment. This simple architecture today is responsible for providing the'
