  md: '# #13. Culture of Learning


    No change can be made effectively if the people involved are not motivated or
    don''t really care about their jobs. Over and over again I have seen managers
    trying to define strategies to make the organizations more efficient. And there
    they would go, with their PowerPoint presentations, telling everyone how change
    would be. They would also say, with a big smile, what everyone had to do with
    the new policy. "From now on, developers must do Test-Driven Development (TDD).
    Development teams must do Agile. Everyone is now expected to follow our new "process.
    Developers would ask themselves: "What does she know about writing code? Could
    she sit and pair with us? Does she understand the details well enough to test
    our work?"


    But let''s not underestimate people''s ability to make things worse. Some people
    would comply with the new (and improved) way of working, managers would make that
    type of people''s objectives and bonuses. However, when it comes to software development,
    this approach can lead to disastrous consequences.


    In this chapter we discuss many different things we can do to create a culture
    of learning. All the things described in this chapter have been used in large
    financial companies and also in few smaller companies in various industries, with
    positive results in all of them.


    # ## Motivation


    There was a time when a well-known investment bank hired the consultancy firm
    for work. For they had a specific requirement: "We want some developers who can
    unit test their code to base." The consultancy asked me to be one of these developers.
    I was surprised by surprise, but on the bench; I couldn''t really say no. To make
    things even worse, they wanted us to do it from our own office. This was not quite
    right: the financial systems were complex and they wanted the code to be accessed
    from their premises.


    For a few months colleagues and I wrote unit tests for the code without ever telling
    any of the developers who wrote it. We just said, "You need to write the tests.
    Your target is to get the test coverage up to 70 percent." However, we had no
    idea if the code had a bug or if the behavior we found was the desired behavior.
    And we tried to do it, but that was not part of their job and they were not interested
    in talking to us.


    To make things even worse, the developers working for the bank were not keeping
    the tests up to date as they made changes to the code, not writing tests either.
    Every single time we updated with the latest version of the code, we found that
    many of our tests were broken.


    After a few months of blindly refactoring tests, without having a clause if the
    code was fit for the purpose, we managed to keep the test coverage above 70 percent.
    A few weeks later, the bank was happy and the contract terminated


    Sometimes the project was finished with failure (if we could call that a project),
    we asked our managers what project was really about. As part of their targets
    for the year, some technical managers had to bring the test coverage of their
    applications to at least 70 percent. As part of their targets, bonuses would be
    directly impacted if they didn''t do. So they did.


    Looking back, what I know today, I feel that what we did was immense folly. Our
    company should have accepted that type of work. I should have said no. If we had,
    we would have helped them understand that what they were asking was not just,
    but also dangerous. Some people would think that the system was reliable and could
    be deployed into production. Bad tests are no better than no tests at all. So
    we had tests, at least 70 percent of them, but nobody knew what they were with
    no context of the business, understanding. Or (if the application) had a bug,
    we created tests that would perpetuate that failure. If the test is bad, the code
    is bad,


    At the end of the day, the client knew what we were doing was wrong, but they
    only cared about the bonuses. We learned a lesson: we will never change an organization
    by forcing people to adopt a new process or something. Instead, we should create
    a culture of learning, where people can find their own motivation to make things


    # ## Creating a Culture of Learning


    Creating a culture of learning is one of the most efficient ways of injecting
    passion into a company. Not many developers have been exposed to environments
    where their senior colleagues were constantly looking for ways to improve themselves.
    Many developers started their careers in places where senior developers didn''t
