    so disappointed with this attitude that I decided not to hire them. As a hiring
    company, we expect to have partnerships with those whom we hire. We expect that
    the people working with us will show what they want to achieve, what they can
    do, and contribute to our success.


    I want talents that, as a hiring company, share our values and want to improve
    the way we work. If the developers'' opinions are not aligned, there will be no
    reason to hire talent. Collaboration and empowerment are key for any successful
    team. The developer''s job (and also the types of questions) asked by an interviewee
    may be a good indicator of how much this person cares. If the interviewee asks
    many questions about the company or about the interview process, it may be that
    he is just looking for a job, regardless of which one. If the interviewee asks
    of questions, I can assume that she really cares about her career and find the
    right company. Always remember that when a candidate asks questions, it doesn''t
    mean they are better than the ones who don''t ask questions; but, it shows they
    care enough to be in it they will.


    Here are some of the things we should pay attention to: how enthusiastic and passionate
    the candidates are are when talking about technology, their previous projects
    and jobs, and their own achievements. How they describe their'
