  md: '# 7. Technical Practices


    What is the real business value of technical practices? Why should I, as a project
    manager or product owner, care about technical practices? As a developer, why
    care about Test-Driven Development (TDD), pair programming, and all other Extreme
    Programming (XP) practices? I''ve been developing software for a long time and
    never needed them.


    This chapter addresses all these questions and gives you more ammunition to convince
    your peers and managers to adopt technical practices, or at least review the ones
    that you use currently.


    # The Right Thing versus the Thing Right


    The feedback loop provided by process-oriented Agile enables us to regularly inspect
    whether the business goals are being met. Instead of freezing change for long
    periods of time, companies can inspect and adapt on a daily basis. There is nothing
    them to a ton of diagrams, documents, plans, or contracts in a distinct pace.
    Agile methodologies embraces changes instead of them. They may have found their
    way to establish a quick and fast feedback loop.


    With exceptions, I believe that Agile methodologies are a better alternative to
    waterfall and other heavyweight, document-based methodologies. They provide a
    short fast feedback loop, which helps us to make sure we are building the right
    thing. This is achieved through a combination of practices and activities: visualizing
    work in progress, time-boxed prioritization, planning, and focusing on minimum
    marketable features (MMFs), stand-up meetings, burndown, user stories, acceptance
    criteria, scenarios, definition of done, cross-functional teams, regular demos,
    and everything else that provides value. These practices can improve the quality
    of your code.


    The problem is that we cannot make the quality of our applications through the
    practices and activities mentioned above Unfortunately, when companies realize
    that one of the biggest impediments for achieving business agility in the state
    of their code is bad, it is often too late. The cost of improving a base code
    or rewriting the whole application can be prohibitive. The "code" that is dectable
    can be very difficult for the business to identify and when it is finally discovered.
    Bad code is like a cancer, difficult to identify in the beginning, and hard to
    treat when it is finally discovered. Disappearing and adopting it is unavoidable.


    So can we make sure we are building the right thing?How can we get the same quality
    and short feedback loop on the quality and design of our code?


    Although there are overlaps between Agile and Software Craftsmanship, Softwaresmanship
    complements Agile by focusing on technical practices and providing a quick and
    short feedback loop on the quality of our code. Technical practices help us to
    make sure we are building the right thing.


    # Context


    Software Craftsmanship, promotes a more professional and ethical approach, also
    encourages the adoption of XP practices like Test-Driven Development (TDD), pair
    programming, refactoring, simple, continuous integration, and other practices.
    These practices will be discussed later


    Many developers cannot explain why they dont use XP on a daily basis. After asking
    developers over the years, a common explanation is: "You don''t know the company.
    You don''t know the people I work with. This would never work in my company. My
    boss would never allow us to do that. I would say the whole codebase is a mess,
    and we need time to see and understand what I''m saying."


    Context is important. If we are adopting Agile methodologies, which can significantly
    change the way we work, context is extremely important. Context needs to be taken
    into consideration when choosing a more suitable work to our problems. A change
    in the process may impact roles, responsibilities, and information flow, which
    makes understanding the context essential.


    315*'
