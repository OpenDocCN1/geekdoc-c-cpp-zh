    better quality. Agile software development helps companies to shorten their feedback
    loop, giving them the opportunity to quickly adapt to changes and the demands
    of their clients. Unfortunately, during their Agile adoptions, many companies
    tend to pay a lot of attention to Agile processes but totally neglect technical
