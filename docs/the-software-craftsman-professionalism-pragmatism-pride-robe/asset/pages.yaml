- pgno: 8
  md: '# Foreword


    In 1973 Roberta Flack sang "Killing Me Softly." You''ve never heard it in elevators
    or on your grandmother''s radio station. It''s a soft, lilting ballad about a
    woman who goes to a concert and hears a young man singing a song that she so identifies
    with that she wonders the young man had found and read her letters. She expresses
    herself better than she feels when he strums his guitar, and it is the song of
    her life.


    The book you are holding feels that may validate you. Sandro Caruso''s career
    has been very different from mine. He is much better than I. We have lived and
    worked our careers on different continents and in different cultures. We share
    nothing but irony. I''ve met him a few times, and each time it was never for a
    few minutes.


    Within the pages you are holding you will find a fascinating alternation between
    biographical anecdotes based on those experiences. If you are a programmer, you
    will feel these stories and recommendations resonate with you. If you are to say
    yourself, as I did, "Been there that." And you will feel the pain aching in your
    mind as he strums your pain.


    And strum your pain you will feel, because this book is about it. It is about
    pain. The ache that you and I, and, all in an un-profession. It is the pain of
    feeling trapped constrained to do a poor job. It is the pain of wanting to do
    better and not knowing how.


    This book also contains the antidote for that pain. I believe it contains the
    cure. You see, this is is about software professionalism. Not just individual
    professionalism, but the professionalism of the software organization. This is
    a book about Software Craftsmanship.


    In these pages the author lays out a plan, a strategy, a set of attitudes, and
    a suite of principles that every programmer, team, and software organization can
    use to haul themselves out of the mire of mediocrity, to make themselves more
    professional, more productive, and more of the work they do like.


    The scope of this book is midway wide. Topics range from design patterns, pair
    programming, and Test-Driven Development to how to conduct and manage deadlines,
    how to respond to tight deadlines, how to write job descriptions, and how to relate
    to coworkers and managers.


    In short, this book is an encyclopedia of the behavior, attributes, and structure
    of an organization striving to grow in professionalism and adhere to the principles
    of Software Craftsmanship.


    If you are the type of programmer, team lead, or manager who craves to be able
    to go home after a long day of work, look in the mirror, and say "Damn, I did
    a good job today?" then this is the book for you.


    -Robert C. Martin

    August 2014'
