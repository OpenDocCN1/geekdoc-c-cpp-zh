  md: 'tomorrow. Maybe in a few years. Software Craftsmanship will be strongly encouraging
    the adoption of a completely different set of practices.


    Being pragmatic is one of the best qualities that a software craftsman can have.
    We should not follow practices just because someone said so, or just for the sake
    of it. We should constantly look for ways of doing our job better and satisfying
    our customers. If that means TDD, we should use DD. Whenever we find something
    that could give us a quicker feedback loop, then we should use that instead of
    TDD.


    Pragmatic thinking is also a virtue. We should constantly ask ourselves why we
    are doing what we do. Is there anything better than what we do today? Are the
    practices we chose for our project? What is their value? Is it time to try something
    else?


    The best way to get better feedback is to compare the value they bring to the
    project, compare how long they take, and how much effort they should require.
    If we can''t identify the value that certain practices bring, maybe we should
    not use them. For practices that give similar value, we should choose whatever
    the team is more comfortable with. It is worth remembering that nothing is set
    in stone. Choosing to adopt a practice does not mean using it forever if not works
    for us. As Agile developers have taught us, we should inspect and adapt. If certain
    practices are found to be better than what we do today, we should adopt that better
    practice. As software craftsmen, we should always keep an open mind and choose
    the best technologies, tools, processes, methodologies, and practices for the
    job.


    # Summary


    Many developers struggle to convince their managers and other developers to adopt
    technical practices because they fail to explain the value that those practices
    bring to the project. Adopting technical practices doesn''t come for free. There
    is a learning curve, and the more we are getting familiar with the new practices,
    the more they will probably be slower and a bit frustrated of.


    So, instead of saying to the team that they should do TDD, continuous integration,
    refactoring, pair programming, and other practices, we should say, "What if we
    could press a button and be confident, after a few minutes (if not seconds) that
    our entire application is working correctly and has no regressions? We could even
    do it multiple times a day. What if we could immediately verify that changes made
    by different developers are not conflicting with each other or causing a problem
    in a different part of the application? That could save us a lot of time. How
    long does it take us to test and deploy our application to production? What if
    we could reduce that to minutes and do it multiple times a day, whenever we find
    a bug and have a new version of the application deployed? We also have a big gap
    in skill within the team. How can we address that? How can we gain understanding
    of the different parts of the application, including its configuration, deployment,
    and frameworks? It would be great to reduce the dependency on certain members
    of the team."


    Before talking about adopting practices, we should discuss what we want to achieve.
    What parts of our software delivery process would we like to improve and by how
    much? Once we define that, we can then discuss which practices we should use to
    achieve:'
