  md: '# 15. Pragmatic Craftsmanship


    There is an assumption that quality takes time. Managers and developers believe
    they need to choose between expensive well-crafted code that takes a long time
    to make or cheap code that is delivered faster. Unfortunately, cheap average code
    to deliver usually overwhelms developers over-crafted code.


    In this chapter we bust the myth that quality is expensive. We will also discuss,
    with examples, what pragmatic craftsmanship means.


    # Quality Is Always Expected


    I''ve met a person who wouldn''t want quality if quality were inexpensive or if
    quality didn''t need to be a trade-off for earning whatever she judged important
    at some point in time—like time to market or cost. Managers expect bad quality
    regardless of what they say, they will always expect high value. When developers
    tell them how many times quality will suffer if they want to keep the code and
    deliver faster, they will not in mind but they will expect quality.


    The main problem is that cheap and average code is good enough—maybe in the short
    term, but not in the and long term. For a project that usually uses average code,
    more often than not, average means very poor. As the big build of crud, cheap
    doesn''t mean the number of bugs increases, but time to deliver features becomes
    more and more, and managers and sponsors don''t see that. In software development,
    software is a service just like any other service they pay for. And any other
