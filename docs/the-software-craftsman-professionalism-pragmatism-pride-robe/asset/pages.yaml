- pgno: 24
  md: 'craft. Many I know, people whom I really respect, do not agree with this at
    all. For some, it is a trade. For

    others, it is engineering. Very few would say that software development is a science.


    Every developer has many arguments why software development should be viewed as
    art, craft,

    engineering, or science. When listening to all the reasons why software development
    is one thing or the other, the

    reasons make sense—some more than others, but they all make some sense.


    Another big debate about Software Craftsmanship is the name itself. Some people
    absolutely hate it. They cannot see

    the point of comparing the most innovative and fast-crafting industry to something
    that go back to medieval times.

    And it may have a point


    Over the years, I joined some of these debates and spent a lot of energy trying
    to convince people why Software

    Craftsmanship is a good method and why software development is art. As I was getting
    involved with it, I

    sud realized that it didn''t really matter. This is by far the least thing we
    were discussing. I personally like

    the metaphor and treat software development as craft, but what I really import
    and care are the

    values of Software Craftsmanship.


    At the end of the day, what we all care about is raising the bar of our profession
    and helping developers, including

    inothers, to professional developers and not just unskilled workers who do what
    they are told to.


    # # Software Craftsmanship History


    Although John J. Reeves suggested that software development is more than an craft
    in 1992, I

    believed that Software Craftsmanship really begins with the Thematic Programmer:
    From Jouryman to Master

    by Andy Hunt and Thomas Thomas Then Peter McConnell published Software Craftsmanship:
    The New Imperative,

    the book that introduced the ideas of that we used to shape the Software Craftsmanship
    movement years

    later.


    In 2002, Ken hosted a Apprenticeship Summit in North Carolina, and invited, among

    few others, Peter McConnell, Ron Jeffries, and Robert Martin (Uncle Bob). At the
    time, Uwe was already holding

    apprenthips. The conclusion of the summit was a call to form a community around
    software apprenticeship,

    the company founded by Uncle Bob. Then on, Object Mentor started having on apprentices.
    But there wasn''t much formality or process around it, but

    several years later we went through apprenticeship again.


    In 2006, Michael Martin and Paul gained right as an embodiment of Software

    Craftsmanship values. The Eight founded a Software Craftsmanship company from
    the start, aiming to

    hire apprentices to cultivate disciplined talent. Eight software craftsmen, not
    developers, andnttheir disagreements did not occur.


    Around same time Light was created, Dave Hoover took a position at Ativium (created
    by Groupon in

    2001). Shortly after Eight launched their apprenticeship program, Bob offering
    apprentices as well. So

    bame a friendly rivalry.


    Although there were few people in Chicago embraced Software Craftsmanship, nothing
    really happened

    the field between 2001 and (when Peter McConnell''s book came out) 2003. Agile
    was the new thing, with

    dag, methodologies, and techniques shaping the foundations of the software development
    industry. Back then,

    there was no real need for Software Craftsmanship because people believed that
    the biggest problems in our

    industry could be addressed by one of the Agile methodologies and practices.


    In August 2008, during his keynote at an Agile conference, Bob published a fifth
    value for the Agile

    Manifesto: "craftsmanship over craft". He changed his proposal to "craftsmanship
    over execution." Also

    in August 2008, he published Clean Code: A Handbook of Software Craftsmanship
    and in May 2011, The Clean

    Code: A Craft of Conduct for Professional Program, two of the most, if not the
    most, influential books in the

    Craftsmanship circle.


    # # Software Craftsmanship Summit


    In 2008, years since the Agile summit, it became apparent that things in the world
    were not going well as

    asexpected. The deviation from Agile methodologies like Extreme Programming (XP)
    and the

    commercialization of the process-oriented methodologies brought to some of the
    original Agile

    innovators.


    There were lots of talks about Software Craftsmanship in the Agile community,
    which Michael Martin and

    Paul joined to put a public face on Software Craftsmanship in order to better
    and define it. The main goal was

    they invites were all people who expressed interest, to some extent,

    in Software Craftsmanship.


    The summit took place on December 13, 2008, in Libertyville, Illinois, just a
    few kilometers from Chicago. The summit

    lastered for six hours and there were roughly 30 people, including Uncle Bob,
    Brian Mariak, Corey Haines, Dave

    Hoover, Doug Bradley, and Chelsea Thomas.'
