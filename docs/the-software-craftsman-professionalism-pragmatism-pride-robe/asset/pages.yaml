    # Focus: The Pomodoro Technique


    In order to use our time outside working hours, it is extremely important that
    we have a focus. A good technique is to decide before what we want to do we actually
    use this time. It is like deciding the agenda before scheduling a meeting. It
    does not need to be perfect, but we need at least have a good idea of what we
    want to achieve. Once this is done, we must ensure we can get it done. One way
    we can achieve this is by using the Pomodoro technique. There are five basic steps
    to implement this technique:


    +   1. Decide on the task to be.


    +   2. Set the Pomodoro (timer) to 25 minutes.


    +   3. Work on the task until the timer rings.


    +   4. Take a short break (normally 5 minutes).


    +   5. Every four "Pomodoros", take a longer break (15-30 minutes).


    During a Pomodoro, we focus on the task and nothing else. The breaks between Pomodoros
    are for a quick rest, checking emails, a phone call, checking your Twitter, or
    whatever you feel like. We do whatever to finish the Pomodoro with no interruptions
    but if it needs to be interrupted (there is an important call we need to take
    or we need to speak to someone), then the Pomodoro must be terminated and not
    counted. If so, there are many Pomodoro tools available out there. There are some
    sophisticated that can keep track of all the tasks you completed, interrupted
    Pomodoros, and many other statistics. I, personally prefer the simple ones but
    feel free to use that that suits you better.


    # Balance


    Whatever you do, a sustainable pace is key. Keeping a healthy-work-life balance
    is tough but not. If you are the type of person who says, "I don''t want to work
    for a computer outside," you should think about your career choice; maybe balance
    development is not for you. For the majority of us, software development—besides
    being our job—is also a hobby, which makes it relatively easy to find enough time
    to practice and better ourselves.


    Keeping your professional life is essential for a healthy life. An unhealthy professional
    life, where we are constantly worried about not being paid well, or we may not
    find another well-paid and interesting job if we are made redundant in the market,
    puts us in a good position not to worry too much about our professional lives
    and gives us our families and the attention they much deserve.


    # Summary


    Owning our careers is hard. We need to put a lot of effort into getting to a position
    where we can. I feel confident I can find a well-paid job whenever I want. Determination
    and passion are essential for a successful career as a software craftsman. However,
    how of our efforts are wasted. We need to learn how to keep ourselves up to date
    and how to practice. We need to learn how to use our time well. The day we start
    losing control of our careers. The more knowledge and skills we have, the easier
    it is to use our careers—that means we are able to choose where, and for whom
    to work, and how much to charge for our services.


    Time should never be used as an excuse for not doing things. Every all we have,
    in fact we have exactly the same amount of time. The difference is how we choose
    to spend our time.'
