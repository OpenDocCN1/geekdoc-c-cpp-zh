    # Community Involvement


    The best way for companies to hire talented developers is to be in contact with
    the wider community. Supporting users groups and technical communities is a great
    way to attract and approach great developers.


    The chief technology officer of a small profitable company in the financial sector
    came to one of the first Software Craftsmanship roundtables we ran as part of
    the London Software Craftsmanship Society (LSCC). He came to demonstrate the company''s
    testing framework, which is now open. Later months the company became one of the
    LSCC sponsors, honoring one of our monthly meetings. We also sponsored the London
    User Group (LSUG).


    It had a few advantages in sponsoring LSCC and LSUG:


    +   - **Exposure to developers**: Many here directly, sharing their time and money.

    - **Opportunity for developers to learn from**: Many of them attend our hands-coding
    sessions, where we pair-program different solutions, and they also attend our
    Software Craftsmanship roundtables, where we discuss various topics in an open-face
    fashion.

    - **Free technical advice**: Their developers have the opportunity to talk to
    other developers about how to solve their problems.

    - **Cheap investment**: It takes just a few hours and office space once or twice
    a month.


    One of the advantages of actively supporting the community is that we can spot
    talent and approach directly. The team is there for developers. They can analyze
    the culture of the company, the developers working there, the types of applications
    they work on, and how they work. Because user groups and technical communities
    meet on a regular basis, it is easy for both developers and companies to identify
    opportunities together.


    For months, if not years, developers and companies have the opportunity to know
    and help each other. A close contact is mutually beneficial—it can lead to business
    partnerships, employment agreements, and a great deal of knowledge sharing.


    # Defining Effective Criteria


    Relying on recommendations and community involvement is not always enough. Which
    means that we need to use the conventional channels, like job boards and job descriptions.
    When that is the case, we are back to our original problem: not enough time to
    interview.


    Large organizations and well-known companies tend to receive CVs every time they
    advertise a job position. It is totally impossible to interview every developer,
    so we need to create filters to filter out those who have a better chance of satisfying
    their needs. The filter criteria can be quite vague and non-specific. HR or recruiters,
    when in charge of the filtering, will do it by a combination of keyword matching
    and some random criteria like years of experience or academic background. When
    hiring managers, they analyze the candidates'' previous experience in each role,
    the companies and industries, and all the experience written by the candidate
    describing her role in each of the previous CVs.


    Once I was recruiting for an investment bank. We were looking for an experienced
    developer to join our team. The agencies and vendors for us sent some CVs, and
    at some point, had more than 50 CVs that looked exactly the same. They satisfied
    all the items in the investment bank job description—similar to the first job
    described earlier in this article. Because each interview may take a few days,
    if not.


    I started to think about what I really valued about a developer and what type
    of culture we were trying to create. We wanted software craftsmen. Passion was
    the most important criterion, even when compared to technical and programming
    languages. I wanted people who were constantly learning, who took the time to
    learn new things, who loved to share what they think, and who were active in their
    communities.


    There is no job description that could describe what I wanted: "I want you to
    find passionate and talented developers." They kept me to push them, segmenting
    them, and I replied, "If you want keywords to match a CV, I''ll give you one:
    ''passion.''" One: "passion.\" The majority of them never got back to me."


    Whatever filter criteria we apply, we will always filter good developers. If we
    say we filter out loads of talented developers who have never worked for an investment
    bank. It would be if we asked for bachelors'' degrees in computer science, experience
    with a specific framework, or a certain number of years of experience.'
