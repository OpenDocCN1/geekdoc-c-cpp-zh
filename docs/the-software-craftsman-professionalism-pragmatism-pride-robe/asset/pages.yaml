- pgno: 107
  md: 'My way is to stay in a job for as long as it remains aligned with our career
    aspirations. Whenever it starts to diverge from our career aspirations, the partnership
    with employees gets weary and less beneficial for both. Whenever we are not moving
    forward, we are not learning or enjoying ourselves, we should move on. Loving
    the company and its colleagues is not enough to stay in a job. People move on,
    companies move on, and so we. Looking for a job that is more aligned with our
    career aspirations is a favor that we do in order to bring in new, with fresh
    ideas and energy to inspire the status quo and what we do. From experience, I
    believe that staff turnover of 15 to 30 percent a year is very healthy for a company.
    New people with new ideas help the company remain to date, competitive, and fresh.


    # What If We Don''t Know Where to Go?


    At first, this is a little scary, but it happens to everyone. When we don''t know
    where to go or what to do next, some things can get lost. A little bit of courage
    to adapt at that, but when we do to ourselves, things get better. Once we know
    where we are going, we can be more focused and objective in our way. That for-
    has certainly happened to me. In fact, it has happened three times in my career.
    There is a lot you can do when you want to meet people. Get out of yourself and
    open as many doors as you can. Start attending networking events. Starting to
    open new opportunities. In conversations in meetings. Look for people. Go out
    there and show people where you are going. You will see there is a world out there
    full of people, and with opportunities you never expected before. This will help
    you decide where to go next. Personally, I know a few stories from developers
    who met in technical communities and started their own companies, found great
    jobs, or changed their careers.


    # Job Diversity


    Software development is a very diverse profession, and skillful craftsmen have
    very broad experiences. Being a developer in startup and building games for mobiles
    is very different from being a developer building applications for a global investment
    bank. Developing a mass-market product is very different from developing software.
    Developing tools is very different from building bespoke software. Developing
    web applications is very different from developing applications with no user interface.
    Although you can argue that software should be treated as a product-internal tools
    or other systems as we are-clients is not always the case. By using your applications,
    you will learn many of the good practices that apply in many different types of
    software, the whole environment is different. People are different. The relationship
    with clients or users is different. The amount of pressure you are under in certain
    projects is different and experienced professionally. In certain applications,
    a bug can cause huge damage (millions of dollars in finance, or even endangerment
    of human life), while in others, a bug production might not be a big deal (some
    may get a bit annoyed but they will get it over soon, when the bug is fixed).


    Working for a company can be tough if you are not exposed to different types of
    projects and environments. I''m not saying this is bad, but it''s definitely no
    great deal. A consultancy company has many different environments and they provide
    us with many different opportunities. As you move from project to project, you
    have opportunities to work with different technologies, different types of software,
    different types of companies, different team dynamics, and different tools and
    processes. You may have all of these experiences while still working for a company
    with your career. On top of that, you can increase your network, which can be
    very handy as you move with your career to a new company. Working on various projects
    can be exciting; it makes you go to places you have never been before. Experiencing
    many different opening doors can lead you to places you have never considered
    before. As a consultant is not for everyone, but this is something to consider,
    mainly early in your career. Working for a few years can give you a lot of exposure,
    experience, and options, making it easier for you to decide where to take your
    career in.


    # The Mission


    Software craftsmen is not an industry. They focus on better themselves, constantly
    investing in their own careers and learning, teaching, sharing, and delivering
    value to every single client. This is mission but not just clients—that''s just
    one part of it. The real mission of a software craftsman is to make a contribution
    to the raise of the software industry, with professionalism, passion, and care.
    Software craftsmen are not more than ordinary developers who were hired to do
    a job. Craftsmen focus on helping others get better at their craft and to be what
    they do and why they do. The goal is, that, the quality and reach of software
    products you are


    But about being a specialist in an industry or sector? No, nothing wrong with
    this either. You can still be a great and very specialized craftsman. Specialists
    are needed and essential in many types of projects and industries. However, exposure
    to different environments and types of projects will give you more ammunition
    to come up with better in the area in which you desired to specialize. Moving
    from project to project, experiencing different environments, companies, technologies,
    and approaches to software, is what I would consider to be the craftsman''s mission.'
