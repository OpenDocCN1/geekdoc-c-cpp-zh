    Knowledge is the most common reason for investment in a job. Developers choose
    jobs according to what they want to learn, and they leave jobs either when they
    are not learning or whatever it is to learn is not aligned with their careers.


    Our lives also play an important role in our decisions. We want just more money,
    and that''s OK. If our career can be significantly improved with more money, we
    should invest in a job that can give us a better income. Some want just more stability
    and security, if we are starting a new family or our family is about to grow.
    We are tired of traveling all the time. Sometimes we need a job where we don''t
    work extra hours, so we can spend more time with family and honing our craft


    When it comes to our career, is it right or wrong? But there is something worth
    keeping in mind: knowledge is forever; money, stability and security are not.
    If, whatever reason, our job is terminated, knowledge and experience are the only
    things we will take with us. If we always focus on learning and becoming better
    craftsmen, jobs that can provide us with a good income, stability and security
    will be much smaller task than if we have spent our careers focusing on getting
    more money.


    # Autonomy, Mastery, and Purpose


    In Drive: The Surprising Truth What Motivates Us, Daniel Pink says—that what makes
    a job of the table—workers are motivated by three things: autonomy, mastery, and
    purpose.


    +   - Autonomy: it is when we are in control of what we do, how we do it, and
    when we do it. That will always be the case in a true Agile context

    - Mastery: it is when we are constantly learning and evolving—becoming better
    professionals and better human beings

    - Purpose: it is when we feel that our job is important and we are contributing
    to making things—instead of just doing what we are understanding why.


    The assumption of money being off the table is not important. When our basic needs
    are not satisfied, it is very difficult to focus and do what we love. The feeling
    of being undervalued always leaves a sour taste in our mouths. Even when we work
    for the company, we are just questioning whether we are fairly treated or being
    undervalued.


    Software craftsmen choose jobs where they have autonomy, mastery, and purpose.
    These are key aspects that help any person to have a sense of satisfaction. Choosing
    jobs for the money that can bring our careers to a halt, making it impossible
    to put it in motion.


    For me, autonomy and mastery are absolutely non-negotiable and deal-breakers.
