  md: 'pair-grouping session.


    There is a lot we can get from a pair-grouping interview:


    +   * How well the developer decides on tests to write—that shows experience

    * How familiar is she with the tools (the integrated development environment [IDE]),
    language, testing and mocking frameworks, usage of shortcuts, etc.)

    * Choice of names for classes, methods, and attributes

    * How clean and expressive the code is

    * How the developer reacts when the interviewer makes suggestions or comments

    * Her thought process

    * Her care in not solving the problem for but also how she is solving the problem


    However, pair-grouping interviews can be very tricky to conduct and choosing a
    good problem to work on can be quite challenging.


    A common approach is to choose one of the katas publicly available or to create
    our own kata. Katas are great when we want to use TDD and general clean-code principles.


    Another approach is to take an existing code from our own code base, especially
    one that is badly written and without tests, and ask the candidate to write and
    make it better. This is valuable for projects with loads of legacy red skills
    the candidate would need if using it.


    It is important to have realistic expectations when conducting pair-grouping interviews.
    We need to remember that, as interviewers, we already know the domain the candidate
    doesn''t know. We shouldn''t expect the candidates to get certain solutions strategies.
    When we know something, tend to forget how much time we spend learning.


    If we provide tools (Computer, IDE, testing and mocking frameworks), we need to
    bear in mind that the candidate may not be familiar with them. This is not a bad
    thing. Every mainstream language has many testing frameworks and is supported
    by many different IDEs and editors. It''s common for candidates getting stuck
    when they don''t know the expected environment or IDE provided during the interview.
    Pay attention to how the candidate reacts to that, and whether they need help.
    Since this is a pair-grouping exercise, the interviewer should show what the candidate
    can do in the right direction.


    Whatever we do as an interviewer, we should not leave the candidate to struggle
    too long. We should wait for maximum of three or four minutes, and then ask for
    suggestions. The candidate is already under pressure, and making her struggle
    too long will just make things worse. As we can mentally keep track of the points
    where the candidate struggled, we should give them feedback at the end of the
    interview.


    Pair programming means pair programming and not standing over someone''s mistake
    and applying unnecessary pressure. That''s not how we usually work with our colleagues
    and there is no point to benefit this way with a candidate.


    Once I interviewed a very experienced guy. On my machine I had Eclipse, JUnit,
    and Mockito (a Java mocking framework). He told me he was more familiar with IntelliJ
    and Mockk. He never used Mockito, so he''s at least learning it quickly.


