    Whoever is responsible for it. The selection process must be changed and whoever
    is behind it should be fired.


    The identity and culture of an organization are defined by its people and not
    by its chief executive officer (CEO). Delegating recruitment to HR, recruitment
    agencies or vendors means delegating the identity and culture of your organization
    to companies that do not understand or care about it.


    # Too Busy to Interview


    The main mistake that makes interviewing so easy is that they say to interview:
    "We can''t spend too much time interviewing. We have work to do."


    We spend more time with our colleagues than we spent with our ones—which makes
    it even more important that we trust and have relationships with them. The truth
    is that if you can''t allocate enough time to interview, you''ll be responsible
    for building a great team.


    Because the majority of businesses rely heavily on developers, developers play
    a big part in the success or failure of a business. Developers are the ones who
    maintain the machine that enables businesses to stay alive.


    Since hiring developers is key, the quality of the interviewers is extremely important.
    Job candidates are always judged from a biased perspective: they will be considered
    good or bad developers according to the interviewer''s own views, values, and
    technical abilities. People who do not value themselves and believe in hierarchies
    will not hire anyone better than themselves. On the other hand, people who always
    seek to do things in a better way will always look for people who are better or
    at least good as them.


    Although we need to allocate time to interview, the whole recruitment process—from
    collecting CVs to interviewing—can take weeks or months. If not, we wasted a lot
    of time looking at all-the-other CVs and interviewing many unsuitable candidates.


    Time-consuming activities or defining a formal recruitment process is not the
    solution. The wasted interviewing and wrong candidates is the problem we must
    address. Hiring interviewing to find four or five is not viable, and delegating
    the recruitment activity is too risky; the only alternative is to be more specific
    with our filtering criteria.


    # No Job Descriptions


    Job descriptions are anti-patterns. Lod Asher has a series of articles on the
    topic at the website itlt.com. He says that traditional skills and experience-based
    job descriptions are "anti-talent and anti-diversity, aside from being terrible
    predictors of future success.


    Here are some reasons:


    +   * Absolute numbers are: arbitrary, misleading, and confusing. Defining that
    a candidate needs to have five or more years of experience in Java or a certain
    university degree does not make sense. Having five years of experience is different
    from having five times one year of experience. Many developers have worked with
    the same technology for a long time but never learned anything after they were
    hired. A good university degree doesn''t mean anything because the students are
    not ready to be a professional software developer when they graduate. It is what
    developers do at work and in their spare time,'
