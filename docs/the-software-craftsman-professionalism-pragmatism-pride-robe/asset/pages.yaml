  md: '# 3. Software Craftsmanship


    Before we discuss Software Craftsmanship, let''s describe what it ****is not:**


    +   * Beautiful code

    * Test-Driven Development

    * Self-selected group of people

    * Specific technologies or methodologies

    * Certifications

    * Religion


    So, what is Software Craftsmanship then? This chapter presents a few definitions
    and discusses its origins and history. This chapter also covers the Software Craftsmanship
    Manifesto, with an in-depth explanation of what it really means.


    # A Better Metaphor


    In a very simple way, we can say that Software Craftsmanship is a better metaphor
    for software development than software engineering. Apprentices would work with
    more experienced blacksmiths, traveling from place to place and working for different
    masters, learning different tools and techniques, and improving their craft until
    the they were good enough to become a master themselves. There is more to it,
    but bear with me for now.


    # What Does Wikipedia Say?


    [Software Craftsmanship] "is an approach to software development that emphasizes
    the coding skills of the software developers. It is a response by software developers
    to the mainstream software industry


    I personally don''t like this definition. It''s very dry and I don''t think it
    captures the essence of what being a software craftsman means to a software developer.


    # A More Personal Definition


    Software Craftsmanship is a long journey to mastery. It is a mindset where software
    developers choose to be responsible for their own craft, constantly learning new
    tools and techniques and constantly better themselves. Software Craftsmanship
    is all about putting responsibility, professionalism, pragmatism, and pride back
    into software development.


    # A Shorter Defion


    Software Craftsmanship is about professionalism in software development.


    This is probably the most important thing about Software Craftsmanship. If you
    only remember one thing after reading this book, I you remember this.


    # Beyond Definitions


    I prefer to think of Software Craftsmanship as an ideology or a mindset. It is
    something to express and give a name to all the things I always believed. Many
    developers, including myself, may say that they are the majority of the things
    that Software Craftsmanship talks about: caring about what they do; trying to
    be better; sometimes being professional; delight customers by helping them achieve
    whatever they want; learning from other developers what they knew; mentoring less-experienced
    colleagues.


    If you have valued the things above then great you are a software craftsman, even
    if you do not like to refer to yourself as such. Many people do not really like
    labels or do even agree with the Software Craftsmanship method. That is totally
    fine. The important things here are the things we should care about as software
    professionals.


    # Craft, Trade, Engineering, Science, or Art


    When I first got with the Software Craftsmanship movement, I remember having many
    discussions about what software development was. I originally liked to describe
    it as an art. Then, over the years, I preferred to treat it as a'
