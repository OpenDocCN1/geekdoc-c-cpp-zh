    will get things done by the imposed date, because they are afraid to go against
    their managers or because they want to avoid conflict. When they are unable to
    deliver all the features they imposed, developers end up ending with conflict.


    The outcome of this is usually very bad. Systems are riddled with full of bugs,
    and people are unhappy and full of distrust. After working hard for many days,
    and sacrificing time with their loved ones, developers feel undervalued by some
