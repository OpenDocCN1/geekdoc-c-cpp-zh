  md: 'project. When I hear developers saying that their code is good, they know what
    they are doing, and that they don''t need to write tests, I always say that they
    are egocentric and selfish. Software projects are not about a single developer.
    Projects are not about you. It is easy for a clear developer may not be so easy
    or clear for others on the team, and as the system grows, everyone will pay the
    price of these small selfish decisions.


    # Using Time Wisely


    Our clients and employers are interested in software that satisfies their needs.
    They want software that can be changed almost as fast as they change their minds.
    It is our job to provide them with that. The way we go satisfying their expectations
    is up to us. Although they may mention things like testing and Agile methodologies,
    what they really is a good return on investment. We need to use (our) money and
    time wisely, whatever we. We can quantify how much time we are spending on repetitive
    tasks and how much on any new feature. We should prepare the system to handle
    changes in a nice way, so we can just slide a new feature in, with no friction.
    We should make sure that whatever code can be easily tested and deployed. When
    estimating and planning our work, we should make sure that we factor in all the
    things we need to create not only well-coded code, but also tests. We also want
    to avoid giving the false impression that we have enough time to foster test cases,
    unit testing, refactoring, and so on, as optional. The less time we waste testing
    applications, for slow builds, debugging, to get our IDEs to work nicely with
    our totally crazy project structure, or by deploying the application, the more
    we have left to focus on the quality of our applications and make our clients
    happy.


    # A Few Months Later


    The team I mentioned above, after a lot of hard work, commitment from management,
    and a significant amount of investment, managed to turn around and became one
    of the best teams in their organization. Some of the teams managed to rewrite
    their entire test suite, replacing an unreliable testing framework with an open
    source test suite which used to take four hours to run and were always broken,
