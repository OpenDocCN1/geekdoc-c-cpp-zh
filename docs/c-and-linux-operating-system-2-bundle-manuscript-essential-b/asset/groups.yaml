    signify appending, so “cat >> test.txt” will place the output at the end of the
    file rather than erasing the contents at the beginning.


    The vertical line character, or the “pipe”, uses another form of I/O redirection
    to take the output of one command and directly insert it into the input of another.
    “ls | sort -r” would take the output of ls and sort it into a backwards list.
    We redirected the output and gave it to another command to accomplish this.


    And finally, the “grep” command is used very often within I/O redirection. Grep
    can search for a certain string within a specified file and return the results
    to standard output. Using redirection, this output can be put into other commands.
    An interesting feature of Linux to note is that object is a file, even hardware.
    So our CPU is actually a file that stores relevant data inside of it, and we can
    use grep and other tools to search within it. That example is fairly advanced,
    but here is a simpler instance:'
  - '[PAGE 185]


    “grep Conclusion report.txt"


    And it will search within the file for that specific word. I/O redirection can
    become a complicated process with all of the new symbols and commands, but it
    is a feature that you can incorporate into your scripts and daily use that often
    allows for certain features and functions of Linux to be done in a single line.


    Linux and the terminal are difficult concepts to fully master. But with practice
    and continuing dedication you will be able to perform masterful feats of computing
    and do helpful tasks that are not possible in Windows or OSX. Learning more about
    commands and how to use them certainly helps in this regard, so persist in your
    studies of new commands and their use. Positively the only command you actually
    need to memorize is “man”, a command that will show the manual pages and documentation
    of any other command specified. The manual pages show switches, examples, and
    the intended'
  - '[PAGE 186]


    use of every command on your system.

    Use the tool to your advantage and gain intimate knowledge of your system.'
  - '[PAGE 187]


    # More Linux Information


    To continue learning about Linux and the possibilities it can provide, consider
    the examples in this section. It will briefly discuss more uses for Linux, and
    a few other concepts that have yet to be talked about.


    The "Linux file system" refers to the main layout of the files and folders on
    your computer. If you continue to "cd .." in the terminal, or if you click the
    back button on the GUI until it goes no further you will stumble upon the "root"
    directory. The folders here, bin, boot, etc, usr, and so on are how your hardware
    and settings are configured. Each folder has a specific purpose and use, and you
    can understand them by exploring the contents. As an example, user data is stored
    in home, but user programs are stored in usr. Because of how diverse and complicated
    the file system actually is it will not be discussed here, but if you wish to
    learn more do an Internet search or read the'
  - '[PAGE 188]


    documentation associated with your operating system.


    Linux systems are often used for purposes other than desktop use. Dedicated machines
    run variants of Linux because of the power and stability it provides. Even our
    cars have a Linux kernel running to keep track of error codes and help mechanics.


    Servers often have Linux installed because of reliability and the functions the
    distributions have within them. For instance, Linux machines are used as firewalls
    because the “iptables” application provides excellent port blocking and intelligent
    filtering. You yourself can run a firewall on your system with the application
    as well, thus gaining business-level software for free. In this way, Linux is
    also great for networking. The machine can act as a switch, router, DNS server,
    DHCP server, and more just by installing the relevant applications.'
  - '[PAGE 189]


    And finally, Linux systems are not limited to the interfaces we have seen insofar.
    Every distro has its preferred desktop environment, but the interface can be extremely
    customized to the individual’s preference. There are even file and web browsers
    for the terminal, which is greatly helpful for those using SSH or remote computing.
    All-in-all, you should try out different DE’s by installing them and configuring
    them to your liking.'
  - '[PAGE 190]


    # What Next and Conclusion


    How you continue depends on what you want to do with your Linux distribution.
    For casual browsing and simple use, continue with Ubuntu and install the programs
    you need. For more adventurous people, consider installing a new distribution
    to see what each has to offer. Those wishing to learn even more deeply about Linux
    can install one such as Arch or DSL to build their own OS from scratch. Administrators
    and power users can install a server version of a distro to build their own Linux
    network, or they can consider changing over their environment from other operating
    systems to entirely free ones.


    Conclusively, Linux is a powerful and relatively easy to use set of operating
    systems. But their real potential comes from the hard-to-master terminal and command
    line functions. Thank you for reading this publication, and I hope that it has
    shed some light on the mysterious subject of the defacto alternative operating
    system.'
  - '[PAGE 191]


    If Linux has confused you or did not live up to expectations, I implore you to
    take a second look at the features it can offer. While it may not have the same
    caliber of games or 3rd party proprietary software, the OS is simple and customizable
    enough to be used as a primary OS with maybe Windows or OSX as a secondary OS.
    Alternatives exist for just about every program, so if it is possible to get rid
    of Microsoft and Apple entirely, it is highly recommended you do so. Thank you
    again, and make good use of your new Linux knowledge.'
  - '[PAGE 192]


