    并输入“rmdir Programming”来删除该目录。Linux 将毫不犹豫地删除指定的目录。同样，使用“rm”将删除指定的文件。


    Linux 有一种许多用户并不习惯的设计哲学。在 Windows 和 OSX 中，操作系统几乎总是会双击确认是否想要执行删除文件或卸载程序等操作。Linux
