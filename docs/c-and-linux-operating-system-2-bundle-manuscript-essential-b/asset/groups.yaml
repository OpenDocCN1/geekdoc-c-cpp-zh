    # 管理目录


    目录（Directories）是文件夹的别名，工作方式与其他操作系统相同。文件夹存放文件，你必须当前访问某个目录才能与其内部的文件进行交互。你可以使用终端命令“cd”来切换目录并在文件系统中移动。例如，在
    Home 文件夹中输入“cd Desktop”将你带到该文件夹。现在使用“ls”不会显示任何内容（除非你在桌面上添加了文件）。要返回上一级，输入“cd ..”.练习以这种方式在文件系统中导航：`cd`
    进入目录并用 `ls` 查看文件。


    由于你输入的是命令，Linux 期望你的输入是精确的。如果你拼写错了命令，它将无法运行；如果你输入的文件夹或文件名称错误，它会尝试引用不存在的内容。在使用终端时，请仔细检查你的输入。


    打开文件使用不同的命令——“ [文件名]”。点（.）用于启动指定的文件，所以如果你尝试打开一张图片，可以这样做：`./house.png`。点和斜杠都是必要的，因为表示你正在运行当前目录下的文件。当你运行一个文件时，它将用分配给该文件类型的默认应用程序打开，因此对于图片，它最可能在图像查看器中打开。


    你也可以通过终端创建和删除目录及文件。在此示例中，导航到 Home 目录。作为快捷键，你可以输入“cd ~”将目录切换到 Home，因为波浪号（~）是“当前用户家目录”的缩写。使用“mkdir”命令创建一个目录；输入“mkdir
