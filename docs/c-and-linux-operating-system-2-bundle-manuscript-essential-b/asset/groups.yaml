- md: "\n## Arithmetic operators\n\nAnother of the operators that you are able to\
    \ use is the arithmetic operators. These are pretty much the same as using math\
    \ in school. You are going to tell the program to add, subtract, and do other\
    \ equations with the information that you are providing. Some of the arithmetic\
    \ operators that you are able to use include:\n\n- + (+): this is the addition\
    \ operator that will add together two operands of your choices.\n- - (-): this\
    \ is the subtraction operator. It is going to take the right hand operand and\
    \ subtract it from the left hand operand.\n- * (*): this is the operator that\
    \ makes it possible to do multiplication in the C++ language.\n- (/ (/): this\
    \ operator helps you to do division in C++.\n- (++): this is the increment operator.\
    \ It is going to increase the value of your operand by one.\n- -- (--): this is\
    \ the decrement operator. It is going to decrease the operand value by just one.\n\
    \n## Assignment operators\n\nThe assignment operators will make it easier for\
    \ you to assign a name to your variable and can help with searching for, saving,\
    \ and so on with the different parts of the code that you are writing. Some of\
    \ the assignment operators that you may use inside of C++ include:\n\n- = (=):\
    \ this is the simple assignment operator. It is going to assign the value of the\
    \ operand on the right hand to the one that is on the left.\n- += (+=): this one\
    \ is called the Add AND operator. It is going to add together the values from\
    \ both operands and then assigns the sum of these over to the operand on the left\
    \ side.\n- *= (**=): this is the Multiply AND operator. It is going to multiply\
    \ both of the operands and then gives the results over to the operand on the left\
    \ side.\n- -= (-=): this is the one that will subtract the value of your operand\
    \ on the right side from the one on the left and then gives this difference to\
    \ the left operand.\n- /= (/=): this is the divide operator. It is going to divide\
    \ the value that is on the left side from the one on the right side and then assigns\
    \ this amount to the left side.\n\nThere are a few other assignment operators\
    \ that are available, but they are more advanced so we will just stick with some\
    \ of these basic ones to help keep things in order!\n\n## Relational Operators\n\
    \nRelational operators can be really helpful when you are working inside of the\
    \ C++ language. Some of the ones that you can use include:\n\n- == (==): this\
    \ is the operator that is going to check the equality of your two operands. If\
    \ they are equal, the conditions will be true.\n- > (>): this operator is going\
    \ to check the value of your operands. If the operand on the left side is higher\
    \ than the one on the right, the condition will be true.\n- < (<): this operator\
    \ is basically the opposite of the one above. If you find that the value of your\
    \ operand on the left side is greater than the one on the right side, the condition\
    \ will be true.\n- != (!=): this one is going to check the equality of your two\
    \ operands and if the values are unequal, your condition is true.\n- <= (<=):\
    \ this operator is going to check whether the operand on the left side is less\
    \ than or equal to the operand on the right side. If it meets this criteria, the\
    \ condition is true.\n- >= (>=): this one is going to check if the value of the\
    \ operand on the left side is greater or equal to the one on the right side. If\
    \ it is true, the condition is true.\n\n## Chapter 6: Helping C++ to Make Decisions\n\
    \nThere are times when you will need the program to make decisions for you. You\
    \ are able to set it up to act in a certain way based on the information that\
    \ the user puts into the computer and what you decide needs to be met for the\
    \ conditions to be true. The decision making is a bit more advanced inside of\
    \ this system, but you will find that is pretty easy to learn and will open up\
    \ a lot of ideas that you are able to work with in the C++ system. Let’s take\
    \ a look at some of the things that you are able to do to help the system to make\
    \ decisions on its own.\n\n## Switch Statements\n\nThe first decision that we\
    \ are going to work with inside of this system are the switch statements. These\
    \ statements are nice because they are going to allow you to check the equality\
    \ of your variable against a set of values, or cases. The variable that you are\
    \ trying to check is going to be compared with each of the cases. A good example\
    \ of the syntax that you are able to use for this include:\n\n```cpp\nSwitch(expression){\n\
    \    case constant-expression:\n    statement(s);\n    break; //optional\n   \
    \ case constant-expression:\n    statement(s);\n    break; //optional\n    //you\
    \ can add in as many of these case statements as you would like\n\nDefault: //Optional\n\
    statement(s);\n}\n```\n\nWhen you are working inside of these statements, there\
    \ are a few rules that you should keep in mind. First, the expression of the switch\
    \ statement should be the integral or enumerated class type. In addition, it can\
    \ also belong to a class that has a conversion function. With C++, there isn't\
    \ going to be a limit to the amount of case statements that you add into the syntax\
    \ so you can make them as long or short as you would like. Just remember that\
    \ you need to have a colon and a value in each of them.\n\nOnce the variable finds\
    \ a value that it is equal to, it is going to keep running until it finds a break\
    \ statement. The system finds the break statement, the system will stop.\n\n##\
    \ if statements\n\nOne of the most basic things that you are able to do in your\
    \ programs is create an if statement. These are going to be based on what is true.\
    \ If the condition is met, the program is going to run whatever you set up in\
    \ the example.\n\nSo let’s keep it simple. Let’s say that you have 2 +2 on the\
    \ system. If the person guesses that 4 is the answer, you can set that up in the\
    \ first part to be the true statement and then the message “That’s Right! Good\
    \ Job!” will come up on the screen. But if the user puts in the answer 5 (or any\
    \ other answer than 4), you can have a message like “Sorry, that is not the right\
    \ answer” come up on the screen.\n\n## if else statement\n\nNow as we discussed\
    \ a bit above, there are some limitations that can come up when you are using\
    \ the if statement. If the person puts in the wrong answer, the screen is just\
    \ go blank. Plus, there are times when the user will need to put in a variety\
    \ of answers, such as when they will put in their age and you want to separate\
    \ those out.\n\nA good syntax to use in order to work with the if else statements\
    \ include:\n\n```cpp\nif(boolean_expression)\n{\n    //statement(s) will execute\
