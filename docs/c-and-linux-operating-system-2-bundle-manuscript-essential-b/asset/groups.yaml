    \ find where the mistake has been made. If everything is all jumbled together,\
    \ then they would not be able to find anything very easily, now would they?\n\n\
    You can also indicate line breaks by using \\n This is the same as endl; but is\
    \ a lot faster to type. You can use whichever method you want but choose one and\
    \ stick with it.\n\n# The importance of the basics of C++\n\nI know what you are\
