    - Float: this is a floating point that is going to have single precision.\n- Int:\
    \ this is an integer\n- Char: this is often going to be just one byte and is a\
    \ type of integer.\n- Bool: this is going to work with values that are either\
    \ true or false.\n\nYou can also define other types of variables.\nThese variables\
    \ are things like pointer, array, reference, enumeration, data structures, and\
    \ classes.\n\n# Creating a new line\n\nNow that you know the data types and modifiers,\
    \ and all about making a comment in your program, it is time to learn about how\
    \ to create a new line. This is a problem that a lot of new programmers run into.\
    \ They have their program all nice and laid out in the input, but the output is\
    \ still really mashed together and really unkempt. This is because they did not\
    \ properly create a new line. Remember that whitespace is ignored, so you cannot\
