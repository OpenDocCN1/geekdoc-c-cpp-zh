    所以，这里有一些你可以学习的更多步骤，以及你开始精通这门语言需要了解的一些重要函数。


    ## 常量与字面量


    常量和字面量是学习 C++ 的不可或缺的一部分。它们指的是数据类型以及这些数据类型中的变量。它们是常量，不能被更改。


    它们的作用与其他任何变量都一样，不同在于它们是静态的，你无法更改它们。你使用的整数被称为字面量整数（literal integers）。它们可以带有如 `U`
    或 `L` 的后缀，分别代表未赋值和长型。这些变量用于大写和小写，并可以很好地辅助你的程序运行。


    ## 浮点字面量


    这些是代码的一部分，包含一个整数、小数点、小数部分和一个指数部分。它们可以通过指数形式或十进制形式显示。


    在编写代码时可以使用的一些浮点字面量包括：


    ```cpp

    .e55 // 这些是非法的，因为缺少了小数部分或整数

    ```


    ```cpp

    21of: // 这些是非法的，因为它们没有指数或小数点

    ```


    ```cpp

    510E // 这些是非法的，因为指数不完整

    ```


    ```cpp

    314159E-5L // 这些是合法的

    ```


    当你在代码中看到字符字面量时，你会注意到它们是用单引号括起来的。它们可以很简单，使用像 `''x'' 这样的字符来告知命令，也可以很长。这些是你可以添加到代码中的基础内容，可以使处理起来变得容易得多。


    ## 字符串字面量


    你可以处理的另一种字面量是字符串字面量。这些是用双引号括起来的。字符串包含与字符字面量类似的字符，包括通用字符、转义序列和普通字符等选项。你可以以多种方式使用字符串字面量，包括将其中一行拆分为两行，以及将内容分开以便于阅读。你可以使用的字符串示例包括：


    ```cpp

    "hello, Mother"

    "hello, \

    Mother"

    "hello, "M" "other"

    ```


