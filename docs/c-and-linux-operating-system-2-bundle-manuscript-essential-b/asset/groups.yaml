    \ `cout`。\n\nReturn- 这会将值返回给零，并终止函数。它指令程序结束进程并返回开头。\n\n现在来编译并执行你的第一个正式的 C++ 程序了。\n\
    \n首先，你必须知道如何保存文件。打开你选择的文本编辑器，并输入上方看到的代码。完成后，点击“另存为”，并选择一个容易找到的文件位置。为了方便组织，最好为你的所有程序准备一个单独的文件夹。将文件保存为\
    \ `hello.cpp`，一旦保存完成，在进入保存文件所在的目录之前，你应该打开命令提示符。\n\n要让文件在编译器中打开，请从输入 `g++ hello.cpp`\
    \ 开始。然后你可以按回车键，代码就会正常打开。只要没有错误，提示符就会生成一个 `a.out` 可执行文件。要运行程序，输入 `./a.out` 并观察编译器的运行。从此以后，你应该在计算机上得到的信息包括：\n\
    \n```\n$ g++ hello.cpp\n$ ./a.out\n```\n\n### 尝试一下\n\n确保你正在以正确的方式输入所有变量，并记住，这些内容是区分大小写的。如果你不以正确的方式输入函数，你会发现事情往往会出错。编码的关键在于你必须严谨。这种注重细节的个人特质适用于所有的编程语言！然而，只要愿意注意，任何人都可以做到。\n\
    \n基础函数命令并不是你唯一需要使用的。在构建提示符时，还有其他重要的内容，因为它们也指令程序执行特定的任务。其中一些内容是代码块和分号。\n\n当你想到分号时，你可能认为它是句子中的停顿，然而，在\
    \ C++ 程序中，它们是完全停止。分号表示语句的结束。这意味着每个单独的语句必须通过使用分号来标识。以下是三个不同的语句。\n\n```\nx=y;\n\
    y=y+1;\nadd(x,y);\n```\n\n每一个语句之间不仅由换行符隔开，还由分号。你也可以这样做：\n\n```\nx=y; y=y+1; add(x,y);\n\
    ```\n\n仅仅因为分号，每一个都会被识别为独立的语句。如此简单的东西竟然能产生如此大的影响，简直令人大为惊。\n\n在这个编程语言中，代码块是一组你用括号括起来的语句。这些语句是逻辑实体，程序由于主命令提示符将其显示在屏幕上。例如：\n\
    \n```\n{\n  cout << \"I like Pizza\"; //打印 I like Pizza\n  return 0;\n}\n```\n\
    \n行的结束并不是终止符，如上面所示。分号是终止语句的唯一东西。\n\n# 标识符\n\n现在让我们转向程序中的标识符。这些标识符用于标识多个事物，例如块内的类、模块、函数和变量。标识符是一组字母和数字，你可以用它们命名你的程序或文件，它们必须以字母开头，之后可以是任何你想要的字母或数字。除了句子中可能看到的符号外，不允许使用标点字符作为标识符。你不会看到如\
    \ @、&、% 或 $ 等字符，并且编程是区分大小写的。这意味着 YokoOno 与 Yokoono、yokoOno 和 yokoono 是不同的。确保你在程序中只对应该大写的字母进行大写。\n\
    \n虽然几乎任何东西都可以是标识符，但 C++ 中有些词是预留给关键字的，不能作为标识符。这些单词如下：\n\n| asm | | |\n| Break |\
    \ Bool | Auto |\n| Char | Catch | Case |\n| Const cast | Const | Class |\n| Delete\
    \ | Default | Continue |\n| Dynamic cast | Double | Do |\n| Explicit | Enum |\
    \ Else |\n| False | Extern | Export |\n| Friend | For | Float |\n| Inline | If\
    \ | Goto |\n| Mutable | Long | Int |\n| Protected | Private | Namespace |\n| Signed\
    \ | Static | Size |\n| Template | Switch | Struct |\n| True | Throw | Type |\n\
    | Unsigned | Typedef | Try |\n| Void | Virtual | Using |\n| While | Volatile |\
    \ With |\n\n# 三连字符 (Trigraphs)\n\n三连字符是代表单个字符的三个字符序列。然而，由于其混乱的性质，所有编译器都支持三连字符。这里是一些使用的三连字符以供示例：\n\
    \n```\n? = \\\n^ = !\n! = |\n$ = +\n@ = -\n# = ;\n```\n\n# 空格 (Whitespace)\n\n\
    继续是空白格。这是程序中编译器忽略的空行。它仅用于让你的程序看起来组织整齐且易读。语句之间应该至少有一空格。\n\n# 测验\n\n你以为只要你注意，就可以不经过测试就直接翻过这本书吗？也不要作弊！像普通测验一样对待它，真正弄清楚你是否需要回顾。\n\
    \n1. 什么是空白格？\n2. 填空：cout <<y+1;\n3. 什么是三连字符？\n4. 谁发明了带类的语言？\n5. 大多数函数使用的头文件是什么？\n\
    \n答案\n\n1. 编译器忽略的空格或注释\n2. cout << y+1;\n3. 代表单个字符的三个字符序列\n4. Bjarne Stroustrup\n\
    5. <iostream>\n\n# 第三章：深入探讨程序注释、数据类型、行和字符\n\n现在在我们涵盖了 C++ 的基础知识后，是时候进入一些围绕程序的更深入的主题了。虽然这些内容更深入，但它们仍然是所有人学习的核心概念。\n\
    \n# 程序注释\n\n所以，你会有很多时候想在代码中写一些注释。这些注释很重要，因为它们允许你在代码中留下一条小信息，以便以后阅读它的人能够清楚地看到你的代码是如何运行的，并提供你尝试实现的目标参考。此外，在代码行中留下笔记是提醒自己代码可能出错之处的好方法。通过在代码中放入注释，你\n\
    \n"
