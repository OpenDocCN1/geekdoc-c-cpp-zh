    GUI，但每个 Linux 发行版也内置了基于文本的界面，你可以在其中输入并执行强大的命令。将终端看作是一个功能强大的命令行提示符，因为你完全可以通过终端来使用你的计算机。


    通过启动它或使用快捷键 Ctrl+Alt+T 来打开终端。一个紫色窗口将打开并等待你的输入。输入命令并按回车键激活它。对于我们的第一个命令，输入 "ls"。这是
    list（列表）的缩写，它将显示当前目录下的所有文件。你将看到 Home（Ubuntu 主用户文件夹）中的文件和文件夹。如果你迷路了，可以随时输入 "pwd"
