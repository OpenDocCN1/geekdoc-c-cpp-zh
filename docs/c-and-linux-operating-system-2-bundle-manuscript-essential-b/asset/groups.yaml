- md: "\n## Chapter 2: Let's Begin\n\nLet’s begin! There are a lot of places we can\
    \ start, but let’s talk about environments first. While you do not really need\
    \ to set up your own environment, as there are many online. An environment is\
    \ a compiler of your choice that takes your code, and does all of the functions\
    \ for you. In the old days, you would have to open your command prompts and create\
    \ an environment to use, but those days are over. A simple mistake back in the\
    \ day could do some serious damage to their computers. Now you can practice some\
    \ risky prompts without any risk to your device whatsoever.\n\nThere are many\
    \ examples to try out and use on the internet. To try them out, the easiest place\
    \ to go is http://www.compileonline.com Choose the “Learn C++” option down at\
    \ the bottom, and it will take you to where you need to go.\n\nHere is an example\
    \ to try. The output should be the words “Try This”.\n\n```cpp\n#include <iostream>\n\
    \nusing namespace std;\n\nint main () {\n    cout << \"Use This One!\";\n    return\
    \ 0;\n}\n```\n\nNow you can choose to type these codes into the compiler directly,\
    \ or you can write several, and save them to your computer, and access them whenever,\
    \ so that you don't have to retype them every time you want to mess with them.\
    \ You can use several different types of text editors. However, some of them are\
    \ device type specific. This means they only work on the type of device that you\
    \ create them on.\n\nThe text editors that you can use are OS edit command, Brief,\
    \ EMACS, epsilon, Windows Notepad, vim or vi. However, only vim and vi are multi\
    \ platform usable. Make sure to save the files with the extension .c or .cpp.\n\
    \nYou should start in a text editor to get the rough draft going on your program\
    \ before you even think of moving to a compiler. This is because once you get\
    \ to a compiler, it is a lot easier to mess up your program, and not catch it\
    \ it. However, if you have it laid out in a nice, clean-cut fashion in a text\
    \ editor, then you should have no problems with getting things going in the compiler.\
    \ \n\n## C++ Compilers\n\nThere are many different compilers out there, and a\
    \ lot of them are pretty expensive. Those compilers are for the elite programmers\
    \ who have mastered the lower level compilers already. Beginners only need a basic\
    \ compiler, and most of those are free. However, just like with anything that\
    \ is free, you have to be careful of what you are getting. There are more bad\
    \ cheap compilers than good ones out there so on the pretense of being free, I\
    \ would suggest paying additional functions past the start up page. These additional\
    \ functions are usually very cheap anyways so you won't have to break the bank\
    \ to get them.\n\nOne of the most popular compilers available is the GNU C/C++\
    \ compiler. It is used most commonly in UNIX and Linux installations. To see if\
    \ you already have the compiler, pull up the command line in your UNIX/Linux application\
    \ and type in the following\n\n```bash\n$ g++ -v\n```\n\nIf the compiler is installed,\
    \ then you should see this message on the screen:\n\n```\nUsing built-in specs.\n\
    Target: i386-redhat-linux\nConfigured with: ../configure --prefix=/usr ......\n\
    Thread model: posix\n```\n\n```\ngcc version 4.1.2 20080704 (Red Hat\n4.1.2-46)\n\
    ```\n\nIf this message does not come up on your screen, the compiler either isn't\
    \ on the computer or you installed it incorrectly and you will need to go through\
    \ and get it properly installed.\n\nIn this book, we will go over how to install\
    \ using the Windows platform. If you have a different platform, then you should\
    \ go to http://gcc.gnu.org/install/ and read the instructions on how to download\
    \ it onto your platform.\n\nTo install this compiler on your Windows computer,\
    \ you will need to first install MinGW. This is the software that makes the compiler\
    \ compatible with your computer, and it is very important that you have this software,\
    \ otherwise you will not even be able to download the compiler at all.\n\nTo install\
    \ this software, you can go to the homepage of the software at www.mingw.org and\
    \ allow it to direct you to where you need to go. Once you install that you should\
    \ install gcc core, gcc-g++, MinGW runtime and binutils, at the bare minimum,\
    \ but you can install more if you would like. Once you are done with the install,\
    \ you can run all of the GNU tools from the Command line on Windows.\n\nNow that\
    \ you have everything set up to where you can run it, you can start learning more\
    \ about how to run the programs themselves. \n\n## Basic Syntax\n\nC++ can be\
    \ defined as not only the program, but objects that collectively communicate by\
