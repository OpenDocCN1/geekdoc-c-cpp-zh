    在启动器（dash）中打开“启动应用程序”（startup applications）程序，并以脚本作为源创建一个新应用。现在，每当用户登录时，脚本都会运行。这对于设置某些选项或启动后台服务非常有用，而不需要用户亲自操作。


    为特定时间安排任务可以使用 Cron 守护进程完成。它在某些系统中是默认安装的，但如果没有，可以使用 `sudo apt-get install cron`。使用
    `service cron start` 启动服务，并使用 `crontab -e` 创建一个新的 crontab 文件。选择 nano 作为你的文本编辑器。在创建的文件底部，添加一个包含我们预定任务的新行。格式如下：


