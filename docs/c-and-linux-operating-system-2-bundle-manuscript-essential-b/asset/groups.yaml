    这些都是使用 C++ 开发的。这是因为这种语言的扩展性极强，既可以用于简单的游戏，也可以用于复杂的购物应用程序。


    C++ 还被用于许多其他次要领域，例如 VoIP 通话。它也是使用 C++ 创建的。事实上，你会一次又一次地听到 C++ 是一门正在死去的语言，但实际上，这只是
    JAVA 程序员为了恐吓人们切换语言而使用的诡计，以确保 C++ 成为一门死去的语言。


    ## 为什么使用它


    使用 C++ 不仅是因为它的灵活性和速度，还因为它有很多组件，学习相对容易，而且如果你精通 C++，你就可以轻而易举地掌握其他语言。这是因为当你先学习比其他任何东西稍微复杂的内容时，那些简单的内容就会迎刃而解；如果你习惯了容易学习的主题，那么你会发现更困难的内容很难学习，因为你不习惯于在正尝试学习的科目上投入那么多精力。


    如果你想学习一种可以在计算机技术领域用于不同类型函数的语言，那么这门语言适合你。你用它几乎可以做任何事情，一旦你对它有了足够的了解，你可能发现操纵这种语言来实现它通常无法做的事情的方法。


    在计算机编程方面，C++ 是一门非常重要的语言，尽管它的布局有很多变量，但它非常容易阅读，也非常容易创建。这使其成为世界上最受期待的编程语言之一，因为没有人想挣扎于阅读代码。没有人想把所有时间花在那些他们知道是正确的事情上，仅仅因为他们找不到哪里出了错。


    ## 职业前景


    是的，世界上有很多工作仍然依赖 C++ 运行。你可以做许多不同的事情，而且所有这些事情都会影响社区中的其他人。视频游戏设计和网页设计是目前世界上两个最著名的领域。你还可以成为一名白帽黑客。


    但根据 payscale.com（搜索软件工程师），具有 C++ 软件工程师背景的人员根据经验可以获得 $57,000 到 $120,000 不等的收入。中位数约为
    $80,363。拥有 C++ 编程语言背景的人的其他头衔还包括计算机程序员、电气工程师和应用程序开发人员。


    然而，为了做到最好，你应该始终掌握两三门编程语言以保持市场竞争力。虽然这些语言不会包含在书中，但不要让自己迷恋于一种语言。相反，就像人类语言一样，拓宽你的视野并涉猎几门，但保留一门作为你的主语言。


    由于多功能性，C++ 应该是你的备份主语言。也许可以使用 JAVA 或 Linux 作为你的其他语言，但 C++ 是最好的主语言，而你只想拥有最好的主语言。


    C++ 是一种静态编写的低级语言，这意味着它是一门简洁且扩展的语言。


    C++ 是 C 的全功能超集，支持面向对象编程。这意味着它支持 OOP 的所有支柱，如封装、数据隐藏、继承和多态。


    要了解更多关于面向对象的知识，你可以在网上进行快速搜索并发现更多信息。最好获得关于它的知识，但它对你的 C++ 知识并不是至关重要的，因此它不会真正包含在书中，除了几处的顺带提到以及这里那里的一些零碎信息。


    ## C++ 的三个重要组件


    标准 C++ 由三个非常重要的概念组成。


    - 核心语言（Core Language）：它由所有的变量、数据类型、字面量和其他语言的重要方面组成，创建了进入下一阶段的基石。

    - C++ 标准库（C++ Standard Library）：这允许你操作文件以及语言中的其他工作，并使其按照你的意愿运行。

    - STL：代表标准模板库（Standard Template Library），它提供了函数来操作数据结构、变量以及类似的内容。


    ## 为什么 C++ 被认为是世界上最好的语言？


    嗯，除了反复提到的灵活性、速度和简单之外，它是一门跨越了三十多年的语言，并且今天仍然被广泛使用。在生活的任何领域中，没有多少产品可以说同样的话。产品和公司来去去，但只有完美会留下。好吧，这句话是这么说的。老实说，从那时
    C++ 进行了很多更新，但核心过程仍然没有 way。它出现时领先时代光年，由于保持其领先地位的更新，今天仍然是一项非常先进的技术。


    关于为什么 C++ 被认为是最好的，还有很多观点。虽然有很多人说 C++ 不再流行了，但有更多的人保证它仍然是世界上最好的语言，并且是他们的备份语言。这是他们最熟悉的语言，也是他们放在心头的语言。原因各异，但
    90% 的程序员默认使用 C++，说明它目前是世界上最好的编程语言。


    C++ 是少数完全遵循 ANSI 标准的语言之一，这就是为什么你玩过的最好的游戏仍然是用 C++ 编写的。因为它们的编译器被设置为跨平台工作，所以无论你使用
    Microsoft、Mac 还是 Windows，都可以使用它。这是一件好事，因为通用性使其变得易用且可移植。使用 C++ 时你可以享受到很多好处。


    ## 使用 C++ 的好处


    使用 C++ 时你将享受很多好处。其中一些好处包括：


    - 大库：由于 C++ 已经存在了很久，他们拥有一个非常大的库。这个库供你使用，你可以从中挑选你需要的代码，节省一些时间甚至学习一些新知识。

    - 与其他语言协作的能力：C++ 是一种与其他一些语言配合使用的极佳语言。这让你真正从事你想要的项目变得更容易，因为你可以从不同的语言中添加你喜欢的部分并将它们结合。

    - 适用于许多项目：大多数其他编程语言将只关注一个或两个项目。例如，使用 JavaScript 意味着你只是在网站。但使用 C++，你可以用它来帮助许多不同的项目。无论你是想做网站、想创建一个新程序，还是用编程做其他事情，你都可以在
    C++ 的帮助下完成。

    - 快速且可靠：如果你用过过去流行的其他一些编码语言，你会发现它们有时并不最可靠。信息可能会泄露，或者它们不会以你喜欢的方式工作。如果你想要一种一次就能运行且可靠的东西，那么选择
    C++ 是个好主意。

    - 提供强大的力量：喜欢编程并希望在所做工作中拥有强大力量的人会发现 C++ 是他们选择的正确选项。它拥有世界上编程语言中一些最强大的功能。


    这些只是当你使用 C++ 编程语言时可以享到的少数好处。它看起来可能比其他一些语言（如 Python）稍微难用，但它拥有你需要的很多力量，并且可以与其他编程语言良好协作。通过一些练习，你将掌握这门语言的基础知识，并真正享受你用这门编程语言所能做的一切。

    '
