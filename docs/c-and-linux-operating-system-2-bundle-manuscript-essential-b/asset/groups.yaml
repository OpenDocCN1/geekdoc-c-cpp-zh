    `service cron start` 启动服务，并使用 `crontab -e` 创建一个新的 crontab 文件。选择 nano 作为你的文本编辑器。在创建的文件底部，添加一个包含我们预定任务的新行。格式如下：


    分钟， 小时， 日， 月份， 星期， 命令


    我们通过这些选项对其进行格式化，以指定运行命令的时间。时间数字从 0 开始，因此小时范围是 0 到 23，分钟范围是 0 到 59。将任何选项替换为星号 (*)则表示它将在任何值上运行。请注意这些示例：


