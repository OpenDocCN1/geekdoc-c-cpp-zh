    ctrl+x 保存并退出。在保存时，你将为其指定关联名称和文件扩展；notes.txt 将创建一个名为“notes”的文本文件。或者，你可以通过输入“nano
    notes.txt”编辑文件。在那个示例中，我们在编辑器中打开 notes 并在编辑状态下显示其内容。


    Nano 可能非常简单，但无疑是强大的，并且是快速更改和创建文件的节省时间利器。


    ## # 连接 Windows / Mac 计算机


    Windows 和 OSX 计算机具有内置的网络功能，如工作组、域、共享等。将 Linux 计算机集成到由 Windows 服务器计算机主导的网络基础设施中是非常容易的，而且正确的设置将允许你查看
    Windows 共享并加入公司域。


    实现相互通信的第一步是安装“samba”包。可以通过软件中心找到它，或者输入“sudo apt-get install samba”来获取并安装必要的软件。


    从你的 Ubuntu 向其他计算机共享文件涉及创建一个 samba 共享。Samba 运行与其他流行的文件共享方法相同的协议，因此从 Ubuntu 机器共享的文件可以很容易在
    Windows 上看到。安装 samba 后，使用“sudo nano /etc/samba/smb.conf”开始编辑配置文件。在文件的最底端添加这些行：


    ```ini

    [share]

    comment = File Share from Ubuntu

    path = /srv/samba/share

    browsable = yes

    guest ok = yes

    read only = no

    create mask = 0755

    ```


    现在，创建“path”指定的文件夹（sudo mkdir -p /srv/samba/share）并设置权限（sudo chown nobody:nogroup
    /srv/samba/share/），以便任何人访问其内容。将你想共享任何文件放在该目录下，然后重启服务（sudo restart smbd, sudo restart
    nmbd）使共享生效。最后，登录你的其他计算机并导航到网络共享。在 Windows 中，它们将出现在文件资源器的左侧面板。如果共享没有自动出现，在文件路径框中输入
    IP（通过 ifconfig 查找 Ubuntu 的 IP）。现在你可以从其他操作系统访问 Ubuntu 的文件。


    你可能还需要在 Ubuntu 计算机上查看其他操作系统的文件。首先，打开 Ubuntu 文件管理器。从菜单栏点击“文件 (files)”，然后选择“连接服务器
    (connect to server)”。在结果框中，输入你想访问的共享的 URL。它可以是一个 ftp 地址 (ftp://ftp.test.com)、http://test.com)
    或共享地址 (smb://share/Folder)。无需任何额外的硬件或设置，你就可以这样查看文件。


    最后，加入如 Active Directory 之类的域允许你的计算机与其他系统交互并完成其他面向业务的任务。无论你是拥有一个小小的家庭网络，还是正在将 Linux
    计算机加入公司域，过程都是一样的。安装几个额外的包（realmd, sssd, sssd-tools, samba-common, samba-common-bin,
    samba-libs, krb5-user, adcli, packagekit）。安装它们时，它会要求输入域名。用全大写输入。输入“kinit -V adminname”，将该替换为域中的管理员账户名称。输入密码后，你已通过域的验证。现在加入域可以使用“realm
    --verbose join -U adminname domainname.loc”。


    如果失败了，意味着我们设备上的 DNS 配置错误。输入“echo ‘ad_hostname = nix01.domainname.loc’ >> /etc/sssd/sssd.conf”，然后输入“echo
    ‘dyndns_update = True’ >> /etc/sssd/sssd.conf”，最后使用“service sssd restart”使用这些新设置重启。第一行设置了我们计算机的
    FDN，因此该行需要根据我们的域设置进行更改。在使用正确设置成功重启后，终端将声称已加入域。通过“realm list”进行测试。现在连接到 AD，你可以管理
    Linux 设备了！


    然而，对于大多数用户来说，创建共享和加入域远超连接需求。简单的文件共享通过 USB 驱动器传输或如 Dropbox 等服务要好得多。事实上，Dropbox
    可以安装在三大操作系统上，并且无需额外设置即可在它们之间同步文件。在 Ubuntu 上，可以直接从网站下载 .deb 文件，从软件中心安装，或者使用“sudo
    apt-get install nautilus-dropbox”获取该应用程序。在 Dropbox 文件夹内，放置你想在计算机之间传输任何文件，它将自动在你拥的所有其他
    Dropbox 计算机上下载并更新。

    '
