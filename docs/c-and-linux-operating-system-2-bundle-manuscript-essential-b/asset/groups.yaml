  mdcn: "\n更有可能知道你在哪里成功了，或者在哪里出了错。\n\n这些注释可以根据你的需要尽可能简单，也可以非常复杂。有些人只需要写一两个单词来帮助其他用户，如果那样已经足够的话；但在其他情况下，你可能需要将几行内容组合在一起，以确保一切运行正常，并让另一个人理解代码内部正在发生什么。\n\
    \n在这种语言中，你只需要使用 `//` 符号来表示你正在编写注释。你可以让它具有任意长度，只需确保在注释结束时跳到下一行，这样程序就知道它应该重新读取内容了。\n\
    \n程序在遇到 `//` 之后就会停止读取，这不会影响程序的运行方式。查看代码的其他程序员会看到你编写的注释，但当程序执行时，这些注释将会被跳过。你可以在程序中添加任意数量的注释，但尽量保持保持有限，因为它们可能会导致代码变得拥挤，从而难以阅读和理解。\n\
    \n程序注释基本上是代码内部的语句。这些语句（或注释）的作用是帮助使用你代码的人理解每个函数的作用。所有的编程语言都允许某种类型的注释，但它们并不允许所有类型的注释。最常用的是单行注释。这是所有编程语言都允许的。这些注释是简单的解释行，用一个简单的句子告诉下一个读者其目的。\n\
    \n还有多行注释。这是极少数编程语言允许的类型之一。C++ 就是这少数语言之一。有时你有一个更复杂的解释，它需要跨越多行。这在 C++ 中是可以实现的。\n\
    \n当你使用单行注释时，你会看到它在代码中用 `//` 写出，并且可以延伸到行的末尾。\n这是一个这样的示例：\n\n```cpp\n{\n  cout <<\
    \ \"that's great\"; // prints that's great\n  return 0;\n}\n```\n\n最终输出将是 \"that's\
    \ great\"，而没有其他内容。编译器会忽略注释，这样你可以让其他程序员了解代码的用途，或者你需要对代码进行哪些处理。\n\n然而，如果你尝试获取某些代码的帮助，你应该使用多行注释，以便能够轻松充分利用你复杂的代码。多行注释被这些符号\
    \ `/*-*/` 包围。这样打出来看起来几乎像一个表情符号。例如\n\n```cpp\n/* I need help making the puppet\
    \ dance*/ // 是一个注释。然而，这仍然是一个单行注释。一个更好的例子是\n\n/* I need help making the puppet\
    \ dance\n*All he does at this point is sway from side to side */\n```\n\n这就是多行注释。如你所见，当你开始新行时，应该在开头放置星号，以指示程序你仍在编写注释，并且下一行确实是空白区域。编译时，它将忽略注释并只显示你想让显示的内容。\n\
    \n虽然你可以混合使用注释样式，但目前最好将它们分开，直到你掌握了一切内容。\n\n# 数据类型\n\n在使用任何语言编写程序时，你必须使用不同的变量。这些无非是预留的内存值，存储在编译器内存中某些空间的位置。上面的预留关键字列表在这里也有用。虽然有很多关键字，但有七个定义数据类型的基本关键字。\n\
    \n| 类型 | 关键字 |\n| :--- | :--- |\n| 宽字符 | Wchar_t |\n| 无值 | Void |\n| 双精度浮点 | Double\
    \ |\n| 浮点 | Float |\n| 整数 | Int |\n| 字符 | Char |\n| 布尔 | bool |\n\n你可以使用的大部分数据类型可以使用以下修饰符之一进行修改以提供帮助：\n\
    \n- Long\n- Short\n- Unsigned\n- Signed\n\n# 变量类型继续\n\n当你在编码语言内部使用变量时，你提供了一些存储空间，使得程序更容易操作。你使用的所有变量都将关联到不同的类型，这些类型将决定变量内存的布局和大小。它还将设定你可以在此内存空间上存储的值范围。\n\
    \n变量命名与命名标识符类似。你只能用字母或下划线命名，并且字母是区分大小写的。在此之后，你可以使用任何你喜欢的数字、字母和字符。\n\n再次，你可以在这里使用的基本变量的详细信息包括：\n\
    \n- Wchar_t: 这是宽字符类型。\n- Void: 这代表类型的缺失。\n- Double: 这是一个具有双精度的浮点值。\n- Float: 这是一个具有单精度的浮点数。\n\
    - Int: 这是一个整数。\n- Char: 这通常只有一个字节，是整数的一种。\n- Bool: 这将适用于真或假的值。\n\n你还可以定义其他类型的变量。\n\
    这些变量如指针、数组、引用、枚举、数据结构和类。\n\n# 创建新行\n\n现在你已经知道了数据类型和修饰符，以及关于在程序中编写注释的所有知识，是时候学习如何创建新行了。这是许多新程序员都会遇到的问题。他们的程序在输入中排版得很好，但输出仍然非常挤在一起且非常凌乱。这是因为他们没有正确地创建新行。记住，空白是被忽略的，所以你不能只是跳过一行，就期望在程序中跳过了一行。你必须指示编译器你想开始新行。这非常重要，因为当你运行程序时，你希望它运行得顺畅。你不希望看到类似这样的：\n\
    \n今天尝试一下：I ate Pizza and I did math. 6= (7-1) that is what I learned today.\n\n\
    你可能更愿意看到这种\n\n# 尝试这种\n\ntoday I ate pizza and I did math\n6=(7-1)\nthat is what\
    \ I learned today\n\n为了区分，你必须使用正确的函数，因为编程依赖于拥有正确的函数。\n\n要创建换行，你必须使用函数 `endl;`；这会表示你想换行，你甚至不需要添加空白，尽管建议这样做，因为这能让你的程序更易读。\n\
    \n例如，这样：\n\n```cpp\n{\n  cout << \"Try This\" << endl;\n  cout << \"today I ate\
    \ pizza and I did math\" << endl;\n  cout << \"6=(7-1)\" << endl;\n  cout << \"\
    that is what I learned today\" << endl;\n  return 0;\n}\n```\n\n比这个好得多：\n\n```cpp\n\
    {\n  cout << \"Try This\" << endl << \"today I ate pizza and I did math\" << endl\
    \ << \"6=(7-1)\" << endl << \"that is what I learned today\" << endl; return 0;\n\
    }\n```\n\n你能看到这对阅读代码的人会有多混乱吗？你希望你的文件容易阅读，这样如果其他人必须修复某些东西，他们很容易找到错误之处。如果所有内容都混在一起，他们就无法很容易找到任何东西，不是吗？\n\
    \n你也可以通过 `\\n` 来指示换行，这与 `endl;` 相同但输入速度快得多。你可以使用任何想要的方法，但选择一种并坚持下去。\n\n# C++ 基础的重要性\n\
    \n我知道你在想什么，为什么在刚开始时必须学习这些无意义的知识碎片，原因在于，如果你现在不学，你以后就不会认为自己需要它们，而当你阅读别人编写的程序时，你会疑惑所有额外字符意味着什么，以及为什么有这么多空白。养成处理简单但有些枯燥任务的习惯，对于掌握更复杂的任务至关重要。\n"
