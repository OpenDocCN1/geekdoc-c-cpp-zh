    30 18 25 12 * /usr/bin/scripts/test.sh

    ```


    这将在每年的圣诞节 6:30 运行 /usr/bin/scripts 目录下的 test.sh。


    总之，脚本编写和脚本自动化是管理定期出现任务极佳方法。继续编写脚本，或者在网上查找示例，查看 bash 如何让你的计算体验变得更简单。


    ## 高级终端概念


    精通 Linux 在于对操作系统可用工具及其如何使用的深入理解。本章讨论的许多主题将关注更多任务以及如何完成它们，或者对操作系统进行的一些通用质量（QOL）改进。


    文件的压缩和解压缩通常会让 Linux 初学者困惑。这些工具通常已经安装，但必须使用命令行。此外，奇怪的 .tar 和 .gz 文件类型是 Linux 特有的格式，你可能会经常遇到。所有文件都可以使用
    gzip 工具解压缩或压缩。Ubuntu 预装了它，我们通过 `tar` 命令访问它。要压缩一个文件夹及其包含的文件，在终端中导航到该目录并输入 `tar
    -czvf name.tar.gz columnspan`。C 代表“create”（创建），z 表示“compress (gzip)”（压缩），v 代表“verbose”（详细），f
    允许指定文件名。如果你需要更高的压缩率（但以时间为代价），可以将 -z 选项替换为 -j，使用 gzip2 压缩文件夹。


    现在提取同一个压缩包可以使用 `tar -xzvf name.tar.gz` 完成。你会发现 -c 被替换为 -x，这表示提取。再次，如果你处理的是 bzip2
    文件，请使用 -j 。


    继续高级终端概念，让我们来聊一些可以在终端中为你节省时间的质量提示和技巧。在输入命令或文件名时，在输入途中按下 tab 键。这项功能——tab 补全（tab
    completion），将猜测你尝试输入的内容并填充短语的剩余部分。对于文件，它将按目录显示完成名称，或通过考虑你正在尝试的操作来完成命令。Linux 专家和任何经常使用终端的人似乎以极高的准确性和速度输入他们完全想要的内容，但他们实际上只是在使用
    tab 补全。


    用户（特别是管理员）会花费大量时间使用 `sudo` 命令，因为他们的指令需要提升权限才能运行。但在输入一个长命令并忘记输入 sudo 时，你会因为必须重新输入它而生气。相反，只需输入
    `sudo !!`，它是“super user do again”的简写。它慷慨地避免了再次输入整个命令。


    另一种重复命令的方法是使用向上和向下箭头键。连续按向上键会循环切换之前输入的命令。你也可以使用左箭头和右箭头编辑命令以更改内容。


