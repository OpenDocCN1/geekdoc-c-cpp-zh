  mdcn: "\n\n## 第二章：让我们开始吧\n\n让我们开始吧！我们有很多地方可以开始，但让我们先谈谈环境。虽然你并不真的需要搭建自己的环境，因为有很多在线环境。环境就是你选择的编译器，它接收你的代码并为你你完成所有功能。在过去，你必须打开命令提示符创建一个环境来使用，但那些日子已经结束了。过去的一个小错误可能会给他们的电脑造成严重的损坏。现在，你可以练习一些高风险的命令而不会对你的设备产生任何风险。\n\
    \n互联网上有许多可以尝试和使用的示例。要尝试这些示例，最简单的地方是 http://www.compileonline.com。选择底部的“Learn C++”选项，它将带你去你需要的地方。\n\
    \n这里有一个可以尝试的示例。输出应该是“Try This”。\n\n```cpp\n#include <iostream>\n\nusing namespace\
    \ std;\n\nint main () {\n    cout << \"Use This One!\";\n    return 0;\n}\n```\n\
    \n现在，你可以选择直接将这些代码输入编译器，或者编写几段代码并将其保存到计算机中，以便随时访问，这样你就不用在每次想修改它们时重新输入。你可以使用几种不同类型的文本编辑器。然而，其中一些是针对特定设备类型的。这意味着它们只在你创建它们的设备类型上运行。\n\
    \n你可以使用的文本编辑器有 OS edit command、Brief、EMACS、epsilon、Windows Notepad本、vim 或 vi。然而，只有\
    \ vim 和 vi 是多平台可用的。确保使用 .c 或 .cpp 扩展保存文件。\n\n在考虑移动到编译器之前，你应该先在文本编辑器中开始编写程序的草稿。这是因为一旦你进入编译器，就很容易弄乱你的程序且无法发现。然而，如果你在文本编辑器中以一种整洁、清晰的方式布局了它，那么在编译器中运行它时应该不会有问题。\
    \ \n\n## C++ 编译器\n\n世界上有很多不同的编译器，其中许多相当昂贵。那些编译器是为已经精通低级编译器的精英程序员准备的。初学者只需要基础编译器，而且大多数都是免费的。但是，就像任何免费的东西一样，你必须对你得到的东西小心。市面上糟糕的廉价编译器比好的要多，因此在免费的名义下，我建议在启动页面之后支付额外功能。这些额外功能通常很便宜，所以你不需要花费巨资就能获得它们。\n\
    \n最流行的编译器之一是 GNU C/C++ 编译器。它最用于 UNIX 和 Linux 安装。要检查你是否已经有了该编译器，在你的 UNIX/Linux\
    \ 应用程序中打开命令行并输入以下内容：\n\n```bash\n$ g++ -v\n```\n\n如果已安装编译器，你应该会在屏幕上看到这条消息：\n\n\
    ```\nUsing built-in specs.\nTarget: i386-redhat-linux\nConfigured with: ../configure\
    \ --prefix=/usr ......\nThread model: posix\n```\n\n```\ngcc version 4.1.2 20080704\
    \ (Red Hat\n4.1.2-46)\n```\n\n如果你的屏幕上没有这条消息，说明编译器要么不在电脑上，要么是你安装得不对，你需要重新检查并进行正确的安装。\n\
    \n在本书中，我们将介绍如何使用 Windows 平台进行安装。如果你有不同的平台，应该去 http://gcc.gnu.org/install/ 并阅读关于如何将其下载到你平台的说明。\n\
    \n若要在你的 Windows 计算机上安装此编译器，你首先需要安装 MinGW。这是让编译器与你的计算机兼容的软件，拥有这个软件非常重要，否则你甚至无法下载编译器。\n\
    \n要安装此软件，你可以前往软件主页 www.mingw.org 并让它引导你前往你需要的地方。一旦安装完成，你至少应该安装 gcc core、gcc-g++、MinGW\
    \ runtime 和 binutils，但如果你愿意，也可以安装更多。安装完成后，你可以在从 Windows 命令行运行所有的 GNU 工具。\n\n现在你已经准备好了一切，可以开始学习更多关于如何运行程序本身的知识。\n\
    \n## 基础语法\n\nC++ 不仅可以定义为程序，还可以是通过调用其他方法共同通信的对象。在使用 C++ 时，你最应该知道上述这四件事的含义。\n\n\
    -   **类 (Class)**：这是一个模板或蓝图，规定了对象及其支持类型，并描述了对象的行为。这意味着对象根据它们的行为和动作/支持分类到符合问题对象描述的类中。\n\
    -   **对象 (Object)**：对象具有行为和状态。例如，如果你看一只狗，它有状态。这些状态可以被分类为颜色、品种、名字、品种标准（AKC/AKA/APC\
    \ 注册表）。“狗”也表现出某些行为。它们摇尾巴、汪叫、喘气、吃干狗粮，并在院子外的上厕所。这些构成了狗。\n-   **方法 (Method)**：这是行为的另一个术语。你可以根据需要选择任意数量。它们特别重要，因为没有它们，你的程序就不知道它应该做什么。\n\
    -   **瞬时变量 (Instant Variables)**：指的是每一个个体。这些通过使用值分配给对象。现在你已经知道了编程的四个主要定义，让我们来看看你可以编写的可以打印出“Try\
    \ This”的代码。\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\n// main()\
    \ [这是程序开始执行的时候。]\n\nint main()\n{\n    cout << \"Try This\"; // 打印 Try This\n\
    \    return 0;\n}\n```\n\n此函数将允许你打印任何你想打印的内容，而不只是“Try This”这些单词。现在让我们分解上面列出的程序的各个方面。这种语言有几个不同的方面是你必须考虑的。每个方面对于运行它都同样重要，如果你不……\n\
    \n**头文件 (Headers)**：C++ 有许多头文件，它们对对你的编程操作都是必须的，或至少是有用的。然而，对于大多数函数，你会看到 <iostream>\
    \ 之上的头文件。当你使用头文件时，务必正确包含它，并在它之前加上 #include 以提示程序使用该头文件。\n\n**命名空间 (Namespace)**：命名空间是\
    \ C++ 中一个相当新的新增，仅在 2011 年的更新中出现。除了描述使用哪个命名空间外，它们没有太大作用。虽然它们不是必须，但它们可以减少你在函数方面的困惑。它们只是作为一种更系统地组织你的函数的方式。\n\
    \n**主函数 (Main)**：这是函数执行正式开始的地方。如果你不包含它，整个过程将停止，因为你没有引入变量，而没有变量，程序就丢失了。\n\n"
