    \ to read.\n\nFor example, this:\n\n```cpp\n{\n  cout << \"Try This\" << endl;\n\
    \  cout << \"today I ate pizza and did math\" << endl;\n  cout << \"6=(7-1)\"\
    \ << endl;\n  cout << \"that is what I learned today\" << endl;\n  return 0;\n\
    }\n```\n\nLooks way better than this:\n\n```cpp\n{\n  cout << \"Try This\" <<\
    \ endl << \"today I ate pizza and did math\" << endl << \"6=(7-1)\" << endl <<\
    \ \"that is what I learned today\" << endl; return 0;\n}\n```\n\nCan you see how\
    \ confusing that would get for someone reading the code? You want your file to\
