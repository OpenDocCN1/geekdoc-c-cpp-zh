    # 第一章：基础背景、历史与 C++ 的成果


    在我们开始学习如何使用 C++ 之前，你必须先了解它是什么，以及它是如何产生的。原因很简单：要真正了解某事，你必须掌握关于该主题可能学到的所有知识，特别是当涉及到计算机编程这种技术性极强的领域时。


    C++ 是计算机和互联网历史上非常重要的一部分。它简单地交织在我们今天所知的科技世界历史之中。此外，如果没有 C++，智能手机上的应用和其他功能将不复。


    当你学习 C++ 时，你会惊讶地发现一种编程语言竟然对我们的日常生活产生如此巨大的影响。几乎每一台制造出来的计算机都可以归功于可以追溯到 C++ 语言的特定方面。学习这种语言的好处之一是能够轻松学习其他语言。学习
    C++ 的能力将增强你对其他编程语言的理解，这就是为什么许多人将其计算机编程的“教父”。此外，许多大公司仍然需要掌握 C++ 的程序员，因为他们依赖这种编程语言来运行中央计算机系统。所以，当困难发生时，只要知道从长远来看它对你有益，就要保持强大并进入编程状态！


    # C++ 历史


    比雅恩·斯特鲁普（Bjarne Stroustrup）在写他的博士论文时，决定使用一种名为 Simula 的编程语言。这种语言是计算机时代最早的编程语言之一。但它非常慢而且充满了
    Bug。


    斯特鲁普提出了“带类的 C”（C with Classes）的想法。这是一种比 Simula 快得多的编程语言。带类的 C 后变成了 Cfront，加速了创建语言的过程。然而，当
    C++ 出现时，Cfront 就被甩在了后面，因为它在语言中加入了编译器，使其比当时的任何其他项目语言都更容易、更快地使用。


    从那时起，出现了许多注释参考指南和语言更新，以使其变得更好、更快、甚至更容易使用。《傻傻学 C++》（C++ for Dummies）是该语言的一本流行指南。


    C++ 是目前最流行的语言之一。这种语言在许多行业中都是最佳选择，与其花费大量时间开发新语言，他们他们了 C++，因为其本质具有通用性。


    # 到底什么是 C++


    C++ 不仅仅是任何一种编程语言，它是面向对象的。面向对象编程（简称 OOP）是围绕对象进行的编程。它就像是一次性观察整个画面，而不是每一个碎片。


    这种编程语言的设计考量了灵活性和速度，因为当时的语言非常慢，且只能做一件，所以每当你想创建一个新事物时，都需要一种新语言。


    - 封装脚本：这些脚本爱好者和新手黑客用来练习编程技巧。由于现在许多人想走捷径，预先准备脚本是大多数黑客寻找的，因此包需要改进，而他们使用 C++ 这一点。

    - 视频游戏：现在似乎每个人在生活的某个阶段都会玩视频游戏。无论是长大还是有了孩子，你都会陷入视频游戏的世界，并且无法逃脱。这些游戏都可以归功于某种形式的
    C++ 使用。如果你喜欢制作游戏，并通过画面为世界带来快乐，那么学习这种语言绝对是一个好主意。

    - 网页：如今似乎每个人都有智能手机，这意味着应用泛滥。那里有成千上万的应用，每天都有新的应用产生。有些应用是免费的，有些是付费的，但一个好的'
