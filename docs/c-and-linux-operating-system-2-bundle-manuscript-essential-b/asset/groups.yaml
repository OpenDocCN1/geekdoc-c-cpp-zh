    UNIX），但该项目迅速壮大并吸引了更多开发者。内核不断演变，直到它变得可移植（可以在各种系统上运行）并且完全可以用于计算。然而，内核并不是一个操作系统，因此
    Linux 与 GNU 核心实用程序相结合，创建了一个类似于操作系统的计算环境。


    然后，第三方机构采用了基础 Linux 产品并添加了他们自己的高层软件和功能，从而创建了 Linux“发行版”。直到今天，Linux 仍然是一个免费的爱好项目，因此托瓦尔斯和社区不断对其进行更新和修订。在整个
    2000 年代，许多其他第三方看到了 Linux 环境的用途，并开始将其整合到他们的生产环境和企业中。今天，Linux 以在服务器和业务环境中被广泛使用而闻名，拥有一小部分专门的桌面用户。面向未来，内核已经达到了它永远不会消失的流行程度。大公司因为
    Linux 的优势和实用性而青睐它，因此内核和各种发行版将始终作为最好的替代操作系统存在。


