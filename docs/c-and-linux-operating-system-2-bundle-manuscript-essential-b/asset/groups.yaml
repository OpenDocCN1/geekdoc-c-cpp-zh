    需要了解不同的发行版，并选择哪一个最适合你。请阅读以下章节，以了解一些最流行的发行版的用途。


    Ubuntu 是本文写作时最广为人知的发行版。在整个 2000 年代，它因易于使用和直观性而广受。。Ubuntu 基于更早的 Debian 发行版，在使用上与
    Windows 电脑非常相似，这意味着它是 Linux 新手的极佳选择。正因如此，我们将在书的后部分安装一个 Ubuntu 变体。Canonical 公司是积极开发
    Ubuntu 的公司； yearly 版本更新意味着该操作系统始终处于最新状态，并能兼容新兴技术。尽管如此，Ubuntu 仍然可以在许多旧设备上以合理的速度运行。应用程序可以从某种“商店”安装，这意味着初学者不需要理解经常使用的命令行。总之，Ubuntu
    发行版是初次 Linux 用户的绝佳选择，你应该安装它来学习 Linux 是如何工作的，而无需深陷更复杂的发行版。


    对于更特定的计算场景，Ubuntu 拥有各种子发行版或“变体”（flavors）。这些是以 Ubuntu 为基础但侧重点不同的发行版，例如 Lubuntu
    强调轻量级应用。以下是其中几个：


    - Lubuntu – 一种设计在旧硬件或资源有限的电脑运行的 Ubuntu 版本。安装文件小于 1GB，硬件要求远低于标准 Ubuntu。使用此发行版可以复活旧电脑，同时保留
    Ubuntu 的易用性。

    - Ubuntu Studio – 为艺术家（包括数字画家、音频制作人员和视频剪辑师）设计的 Ubuntu。Ubuntu Studio 是已经预装了编辑工具的
    Ubuntu。

    - Kubuntu – 使用 KDE 桌面环境重绘的 Ubuntu。Kubuntu 的外观和感受与经典的 Ubuntu 感觉不同，它提供了一个更接近其他操作系统的桌面环境。

    - Xubuntu – 另一个轻量级发行版，但没有 Lubuntu 那么精简。Xubuntu 牺牲了体积和硬件要求，以提供一个可以在旧但不过分老的电脑上运行的操作系统。它比其他极简
    Linux 发行版更美观，并且以 Ubuntu 为基础，具有易用熟悉熟悉。

    - Ubuntu Server – 一种更适合工业和企业需求的 Ubuntu 变体，Ubuntu Server 可以无头运行，并为网络中的其他 Linux
    系统提供功能。

    - Mythbuntu – 一个预装了电视流媒体和直播节目的变体。这是一个通过 Kodi 将旧电脑转换为“智能电视”设备的绝佳发行版。


    总之，广泛的 Ubuntu 发行版意味着每个人都有一个适合自己的初级操作系统。强烈建议你利用 Ubuntu 中包含的易用性特性和通用熟悉感。它作为一个跳板性质的操作系统，将逐步引导你接触
    Linux。


    Linux Mint 是 Linux 世界中被广泛使用的操作系统。“强大且易于使用”，Mint 包含了开源自由软件（FOSS）和专有软件，旨在为 Linux
    初学者提供完整的体验。虽然不是完全像 Linux，但 Mint 是作为第一个备用操作系统的极佳选择。它一直位列最常用的操作系统之列，其默认布局与 Windows
    非常相似，有助于向 Linux 世界的平稳过渡。


    Debian 是最古老的 Linux 发行版之一，创建于 1993 年。结合 Linux 哲学，Debian 将稳定和稳固作为指导开发的原则。无疑，Debian
    存在的时间之久是其精炼程度的指标，因此那些追求无错误和故障体验的用户可以转向 Debian。自由开源软件在 Debian 中也有一席之地，因为包含的大部分软件都是
    FOSS。但这并不意味着你受到了限制，因为对于 Adobe Flash 等专有程序，有一个官方的非自由软件仓库。Debian 是初学者的不错选择，但 Ubuntu
    仍然是最好的入门操作系统。安装 Debian 是为了稳定性、FOSS 和纯正的 Linux 体验。


    Slackware 是比 Debian 还要久的操作系统。它保持接近原始 Linux 的意图，这意味着你必须安装自己的 GUI 和程序依赖项。由于这一事实，Slackware
    主要面向中级 Linux 用户，因为初学者会对不熟悉的方法感到困惑。然而，如果你想体验一个接近 UNIX 根源的 Linux 发行版，Slackware 可以为你提供。


    Fedora 是一个更倾向于工作站和业务用途的操作系统。甚至林斯·托瓦兹（Linus Torvalds）本人也是 Fedora 的用户，这归功于该操作系统的流行和使用。Fedora
    更新非常频繁，意味着它始终保持最新，并处于 Linux 技术的前沿。安全和 FOSS 也是该操作系统的重点，这就是为什么它通常用于小企业的终端电脑。不过，在
    Fedora 上工作可能会面临挑战，因此将其视为一个中级操作系统。


    Arch Linux 是另一个发行版，但它主要是为经验丰富的用户设计的。该操作系统以系统外壳的形式出现，用户可以根据喜好进行自定义，仅添加他们需要的程序和服务。由于由于，Arch
    很难设置，但也是一种有回报且具有学习性的体验。通过构建自己的个人系统，你将理解隐藏在高级别发行版中的更深层 Linux 概念。在非常熟悉基础知识后，安装这个高级操作系统。


    最后，还有许多其他独特的发行版值得提及。在接下来的列表中，我们将讨论其中几个。请注意，发行版如此多，整本书都可以用来描述每一个小众用途。


    - CrunchBang – 一种基于 Debian 的发行版，旨在减少资源密集度。它非常简单，且没有某些发行版默认包含的臃肿软件。CrunchBang 可以快速运行且在计算方面非常高效。

    - Android – 流行的手机操作系统实际上是一个 Linux 变体。由于许多手机的规格低于全功能桌面电脑，因此该操作系统是笔记本电脑、触摸设备或家庭媒体电脑的极佳选择。此外，你可以使用应用商店中的许多
    Google 应用，这意味着手机和电脑上可以使用成千上万的应用、游戏和工具。虽然不推荐作为第一个 Linux 操作系统，但它对于尝试旧电脑或儿童电脑绝对是一个很酷的选择。

    - Chrome OS – Google 开发的另一种移动类型操作系统，Chrome OS 本质上是一个为在线设计的轻量级 Linux 浏览器。Google
    在 Chromebook 上预装了该操作系统，它们的规格低于其他笔记本电脑。但该操作系统实际上只是全屏 Chrome 浏览器，因此对于想要简单体验或专用上网的用户来说是完美的。

    - Tiny Core – 一个以 MB 为单位的操作系统，适用于古董电脑或嵌入式设备。该操作系统主要面向有爱好项目或特定目的的中级用户。

    - Damn Small Linux – 另一个极简 Linux 变体，该操作系统最适合快速访问 Linux 命令行。

    - openSUSE – 这是一个面向经验丰富的电脑用户的发行版。为管理员和程序开发人员提供了许多工具，openSUSE 是自信自己技能的用户最佳操作系统。

