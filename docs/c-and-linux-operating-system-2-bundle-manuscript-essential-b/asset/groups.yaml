    you are putting into the system. Some of the logical operators that you can work
    with include:


    +   (||): this is known as the logical OR. With this one, the condition is going
    to be true if one of your operands is not zero.


    +   (&): this one is known as the logical AND. If you have two operands and they
    are not zero, your condition is true.


    +   (!): this is the logical NOT. You will be able to use this to reverse the
