    为了比较 Linux 对于电脑来说是一个多么出色的选择，我们将它与更熟悉的现代操作系统进行比较。


    首先，Linux 是免费的。GNU 的背景将 Linux 置于一种“自由和开源”的心态中，随 Linux 提供的绝部分（如果不是全部）软件都是免费的。自由开源（FOSS）指的是两点——软件既在金钱上是免费的，其源代码也是透明的。FOSS
    与专有软件的区别在于，FOSS 的一切都是开放的，在使用它时不涉及任何隐藏的间谍软件、费用或猫腻。软件通常更安全，因为任何人都可以对随手可的源代码贡献并使其变得更好。由于
    Linux 以及你为它下载的大多数软件都是免费的，因此对于预算有限的小型企业或个人用户来说，这是一个极佳的操作系统。不收取费用无疑没有牺牲质量，因为 Linux
