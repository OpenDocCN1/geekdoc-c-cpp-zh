- md: '

    # Managing Hardware and Software


    Hardware in Linux is actually much easier to manage than hardware on Windows.
    Instead of downloading individual drivers for devices, most of the drivers are
    built-in to the OS itself. This means that most popular devices can simply be
    installed with no further steps before they are usable. Printers, networks, hard
    drives, and other common devices are included; fiddling with drivers is not usually
    needed on Linux.


    However, powerful graphics cards and other specific hardware will need proprietary
    drivers from that company to function. Because although your graphics card works
    by default with Linux, the secret often hidden technology can only be fully utilized
    with that company’s software. On Ubuntu the process is straightforward: open the
    “additional drivers” application and search for you. After determining whether
    you have devices, it will ask you which version to use. Follow any on-screen prompts
    to enable third-party drivers. For any devices that do not appear, research on
    the manufacturer’s website to determine a specific driver you can download.


    Software is another aspect of Linux that excels over Windows. Much like Apple
    computer, Ubuntu has an app store of sorts from which you can search through applications
    that are compatible with your device to download and install just a few clicks.
    Just search for the “Software Center” to open. From there you can browse individual
    categories such as “Games”, “Office”, or “System” for a list of programs, or you
    can search directly by name. After finding a program, click on it and then queue
    up the download by clicking “install”. After authenticating yourself the software
    will automatically download and install.


    Another method of installing software is available through the terminal, but we
    will discuss that later. Ubuntu is not totally limited to software found in the
    app store, because programs downloaded from the Internet can also be. Overall,
    managing hardware and software in Ubuntu is effortless. Whether installing a new
    hardware or downloading a popular program, Linux distributions make your computing
    experience trouble-free. That is not to say that Linux is wholly meant for beginners,
    because great choice for power users and experienced admins.


    # The Command Line / Terminal


    Before modern computers, hardware and software were interfaced using keyboards
    exclusively. The mouse brought graphical interfaces and simplified the process,
    but many functions remained text-only. In Linux this process continues today.
    There exists the GUI that is present on most distributions, but every Linux distro
    also has a built-in text-based interface as well, from which powerful commands
    can be typed and executed. Think of the terminal as a much more powerful command
    prompt, because you can completely use your computer through the terminal alone.


    Begin the terminal by launching it or using the Ctrl+Alt+T shortcut. A purple
    window will open and wait for your input. Type a command and press enter to activate
    it. For our first command enter "ls". This is short for list, and it will display
    all the files within our current directory. You will be able to see the files
    and folders in Home, Ubuntu’s main user folder. If you are lost, you can always
    type "pwd" to print the working directory and display the name of the folder you
    are currently browsing. As you learn commands, it helps to write them down to
    better internalize their use.


    # Managing Directories


    Directories, another name for folders, work the same as they do in other operating
    systems. Folders hold files, and you must be currently accessing a directory in
    order to interact with the files inside it. You can use the terminal command “cd”
    to change directory and move about the file system. As an example, typing “cd
    Desktop” from the Home folder will transfer you to that folder. Now using “ls”
    will not show anything (unless you added files to the desktop). To back out, type
    “cd ..”. Practice navigating around the file system in this fashion: cd into a
    directory and ls to view the files.


    Because you are typing commands, Linux expects your input to be exact. If you
    missspell a command it will simply not work, and if you type folder or file incorrectly
    it will try to reference something that does not exist. Watch your input carefully
    when using the terminal.


    Opening a file is done with a different command – "". The period is used to start
    the specified file, so if you were attempting to open a picture it could be done
    like so: "./house.png”. Both the period and the slash are necessary, as it denotes
    that you are running a file within the current directory. When you run a file
    it will be opened with the default application assigned to the file type, so in
    the case of a picture it will most likely be opened in an image viewer.


    You can also create and remove directories and files through terminal as well.
    For this example navigate to the Home directory. As a shortcut you can type “cd
    ~” to change the directory to your Home, because the tilde key is short for “the
    current user’s home”. Make a directory with the “mkdir” command; type, “mkdir
    Programming” to create a new folder with that title. You can go cd into it, or
    you can go to the GUI and enter it to prove that you have indeed created a new
    folder. Now remove that directory by going Home and typing “rmdir Programming”.
    Without hesitation, Linux will remove the specified directory. Similarly, using
    “rm” will remove the specified file.


    Linux has a design philosophy that many users are not used to. In Windows and
    OSX, the OS will almost always double check that you want to commence with an
    action such as deleting a file or uninstalling a program. Linux distributions
    believe that if you are initiating an event, you definitely mean to follow through
    with it. It will not typically confirm deleting something, nor will it display
    any confirmation messages (file successfully deleted). Rather, the absence of
    a message indicates the process completed successfully. While the philosophy is
    somewhat dangerous (because you could potentially ruin your OS installation without
    warning), it serves as a design contrast to other operating systems. Linux gives
    you complete control, and it never tries to hide obscure options because users
    want to be respected by the technology they own.


    # Apt


    Learning the terminal opens up computer functions that are not available through
    the GUI. Also, you can shorten the amount of time it takes to do many things by
    typing it instead. Take, for instance, the amount of work required installing
    a program. If you wanted to download the Google Chromium browser, you would have
    to open the software center, type in the name of the program, locate the correct
    package, mark it for installation, and execute the action. Compare that to typing
    “sudo apt-get install chromium-browser” into the terminal. With that one command,
    Ubuntu will save you many minutes.


    Apt (advanced packaging tool) is the command associated with managing applications
    in Ubuntu. Other distributions may use their own tool, but apt is commonly used
    for its large repositories and simple commands. Packages are installed with the
    “apt-get install” formatting, where you specify the name of the program you wish
    to

