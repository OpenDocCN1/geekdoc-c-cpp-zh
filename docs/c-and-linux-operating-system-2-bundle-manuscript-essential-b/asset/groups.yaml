    \ if the boolean expression is false\n}\n```\n\nYou are able to add in as many\
    \ of these into your statement as you would like. So if you would like to have\
    \ a program that set apart people in five different age groups, you could set\
    \ that up based on more of the “else” in your syntax.\n"
  mdcn: "\n\n## 算术运算符\n\n你能够使用的运算符另一种是算术运算符。这些与在学校学习数学几乎相同。你将告诉程序根据你提供的信息进行加法、减法和其他其他方程计算。你可以使用的一些算术运算符包括：\n\
    \n- + (+): 这是加法运算符，它会将你选择的两个操作数相加。\n- - (-): 这是减法运算符。它将取右侧的操作数并从左侧操作数中减去。\n- *\
    \ (*): 这是在 C++ 语言中可以进行乘法的运算符。\n- (/ (/): 这个运算符帮助你在 C++ 中进行除法。\n- (++): 这是自增运算符。它将把你的操作数的值增加\
    \ 1。\n- -- (--): 这是自减运算符。它将把操作数的值减少 1。\n\n## 赋值运算符\n\n赋值运算符将让你更容易为变量变量命名，并可以帮助对你所编写的代码的不同部分进行搜索、保存等操作。你在\
    \ C++ 中可能使用的一些赋值运算符包括：\n\n- = (=): 这是简单的赋值运算符。它将右侧操作数的值赋值给左侧。\n- += (+=): 这个被称为“加并赋值”运算符。它会将两个操作数的值相加，然后将这些和赋值给左侧的操作数。\n\
    - *= (**=): 这是“乘并赋值”运算符。它会将两个操作数相乘，然后将结果给给左侧的操作数。\n- -= (-=): 这个运算符会将你右侧操作数的值从左侧减去，然后将差值给给左侧操作数。\n\
    - /= (/=): 这是除法运算符。它将左侧的值除以右侧的值，然后将此结果赋值给左侧。\n\n还有其他一些可赋值运算符，但它们更高级，所以我们只坚持这些基础运算符来帮助保持条理！\n\
    \n## 关系运算符\n\n当你在 C++ 语言内部工作时，关系运算符会非常有帮助。你可以使用的一些包括：\n\n- == (==): 这是用于检查两个操作数是否相等的运算符。如果它们相等，条件将为真（true）。\n\
    - > (>): 这个运算符将检查你操作数的值。如果左侧的操作数大于右侧的操作数，条件将为真。\n- < (<): 这个运算符基本上与上一个相反。如果你发现左侧操作数的值小于右侧，条件将为真。\n\
    - != (!=): 这个将检查你的两个操作数是否相等，如果值不相等，你的条件即为真。\n- <= (<=): 这个运算符将检查左侧的操作数是否小于或等于右侧的操作数。如果满足此标准，条件将为真。\n\
    - >= (>=): 这个将检查左侧操作数的值是否大于或等于右侧的值。如果为，条件将为真。\n\n## 第 6 章：帮助 C++ 做出决策\n\n有时你需要程序为你做出决策。你可以根据用户输入计算机的信息以及你决定的需要满足什么条件才能使条件为真，来设置它以某种方式运行。在这个系统内部，决策要高级一些，但你会发现它非常容易学习，并且为你在\
    \ C++ 系统中开启许多可以操作的想法。让我们来看看你可以做一些帮助系统自主做出决策的事情。\n\n## Switch 语句（分支语句）\n\n我们在系统中要处理的第一个决策是\
    \ switch 语句。这些语句很好，因为它们允许你检查变量与一组值（或情况，cases）的相等性。你尝试检查的变量将与每个 case 进行比较。你可以使用的语法的一个良好示例包括：\n\
    \n```cpp\nSwitch(expression){\n    case constant-expression:\n    statement(s);\n\
    \    break; //可选\n    case constant-expression:\n    statement(s);\n    break;\
    \ //可选\n    //你可以根据需要添加任意数量的这些 case语句\n\nDefault: //可选\nstatement(s);\n}\n```\n\
    \n当你在这些语句内部工作时，有一些规则你应该记在脑中。首先，switch 语句的表达式应该是整数类型或枚举类类型。此外，它也可以属于一个具有转换函数的类。在\
    \ C++ 中，你向语法中添加的 case 语句数量没有限制，因此你可以根据需要让它们变长或变短。只需记住在每个语句中都需要一个冒号和一个值。\n\n一旦变量找到了与它相等的值，它将继续运行，直到找到一个\
    \ break 语句。一旦系统找到 break 语句，系统将停止。\n\n## if 语句\n\n你在程序中能够做的最基础的事情之一就是创建一个 if 语句。这些是基于“真”成立的。如果满足了条件，程序将运行你在示例中设置的任何内容。\n\
    \n所以让我们保持简单。假设你在系统中有 2 +2。如果某人猜测答案是 4，你可以将第一部分设置为真语句，然后“正确！干得好！”的消息出现在屏幕上。但如果用户输入的答案是\
    \ 5（或除4以外的其他答案），你可以让“抱歉，答案不正确”的消息出现在屏幕上。\n\n## if else 语句\n\n现在正如我们上面讨论的，在使用 if\
