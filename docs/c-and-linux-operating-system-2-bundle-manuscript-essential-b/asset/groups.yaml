    \ what I learned today\n\nTo make the distinction, you have to have the right\
    \ function, as that is what programming relies on, having the correct function.\n\
    \nTo create a line break, you have to use the function endl; this will indicate\
    \ that you want a line break, and you do not even have to add whitespace if you\
