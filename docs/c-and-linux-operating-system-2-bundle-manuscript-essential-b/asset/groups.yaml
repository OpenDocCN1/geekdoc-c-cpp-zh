    # Bonus: Brief Hacking History and Overview


    Many people have heard the name C++ but really think nothing of it. If you are
    not very technologically versed then you may think that it is about having a mediocre
    letter grade, but that is not the case.


    Believe it or not, C++ is a hacking language, and while it is not the only one
    out there, it is one of the more important ones because it is versatile and also
    easy to use. To learn the most about C++, you have to know more about the reason
    it came about and that would be hacking.


    # Hacking


    Hacking is not a new concept. For as long as there has been any type of technologies
    around, there have been people figuring out ways to hack them. Hacking is the
    manipulations'
  - '[PAGE 93]


    and/or interruptions of any technological stream of data that is being sent from
    one place to another. This is done with scripts. While you can get pre-packaged
    scripts online, many people prefer the old fashioned way of writing their own
    scripts, as is gives them more flexibility to do what the want with the information.
    Scripts that come already set up into packages have limited mobility and are pretty
    visible. The goal of a hacker who truly wants to hack is to remain discreet. If
    you are caught, unless you have permission to be doing what you are doing, you
    can get in a heap of trouble.


    # History of Hacking


    Hacking began officially in the 1970s when teenagers were banned from using the
    phone lines because they were trying to make free calls, and figured out how to
    do so. Phone hacking was the biggest thing, and continued for over a hundred years.
    Making calls used to be expensive, especially when the phone lines were new, so
    of course people were trying to find ways to save money, and usually it caught
    up with them. Such was the case for a man named John Draper. He was arrested for
    figuring out how to make distance calls simply by blowing a note into the receiver
    that'
  - '[PAGE 94]


    prompted it to make a long distance call without an operator. You could then input
    the number and talk as long as you wish. Genius, but illegal.


    He started a revolution though. A group of young teens banded together to create
    a phone line that hacked the system to help people make free calls. Once this
    spread like wild fire, Steve Jobs decided to come up with a product that he could
    market that hacked the phone lines and helped people make free calls by themselves.


    Big time computer hacking didn''t actually start until the 1980s. However, once
    it began, it spread like wildfire, and there were a lot of people who thought
    that it would be a great idea to see what all they could do, and how they could
    manipulate these computers.


    # Types of Hacking'
  - '[PAGE 95]


    There are several different types of hacking out there. And while the media portrays
    all hackers as bad, they are not. It is not black and white either. While those
    are the two most popular groups when talking about hacking, there are so many
    categories in between, that it would not be beneficial to only talk about the
    two that are most known.


    The two main categories that all the sub categories fall between however, are
    ethical and unethical hacking.


    Ethical hacking is hacking that is used only for good purposes. There are a lot
    of people who have full permissions to hack into a system, and find all of the
    bugs of the software or hardware.


    Ethical hackers are the ones that are responsible for all of the bug fixes in
    your phone, apps, tablets, or computers. These people are hired by a company to
    figure out what is wrong with their systems, and find the best way to fix it.
    These hackers are an essential part of the hacking community.'
