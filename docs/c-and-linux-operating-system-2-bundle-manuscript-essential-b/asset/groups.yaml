    # 管理硬件与软件


    Linux 的硬件管理实际上比 Windows 上的硬件要容易得多。Linux 无需为每个设备单独下载驱动程序，大多数驱动程序已内置在操作系统本身中。这意味着大多数流行设备在安装后，无需额外步骤即可直接投入使用。打印机、网络设备、硬盘和其他常见设备都包含在内；在
    Linux 上，通常不需要费心调整驱动程序。


    然而，强大的显卡和其他特定硬件需要该公司的专有驱动程序才能正常工作。因为尽管你的显卡在 Linux 下默认可以工作，但那些通常隐藏的秘密技术只有通过该公司的软件才能被充分利用。在
    Ubuntu 上，这个过程非常简单：打开“附加驱动”（additional drivers）应用程序并进行搜索。在确定你是否有设备后，它会询问你想要使用哪个版本。按照屏幕上的提示启用第三方驱动。对于任何未出现的设备，请在制造商网站上研究以确定可以下载的特定驱动程序。


    软件是 Linux 优于 Windows 的另一个方面。与苹果电脑一样，Ubuntu 有一个类似于应用商店，你可以在其中搜索与设备兼容的应用程序，只需点击点击即可下载并安装。只需搜索“软件中心”（Software
    Center）即可打开。从那里，你可以浏览如“游戏”、“办公”或“系统”等各个分类的程序列表，也可以直接通过名称搜索。找到程序后，点击它，然后点击“安装”进入下载队列。通过身份验证后，软件将自动下载并安装。


