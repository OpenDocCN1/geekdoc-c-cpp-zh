    | Type | Keyword |\n| :--- | :--- |\n| Wide character | Wchar_t |\n| Valueless\
    \ | Void |\n| Double floating point | Double |\n| Floating point | Float |\n|\
    \ Integer | Int |\n| Character | Char |\n| Boolean | bool |\n\nMost of the data\
    \ types that you can use can be modified using one of these following modifiers\
    \ to help:\n\n- Long\n- Short\n- Unsigned\n- Signed\n\n# Variable Types Cont...\n\
    \nWhen you are using variables inside of a coding language, you are providing\
    \ some storage space that makes it easier for the program to manipulate. All of\
    \ the variables that you use will be attached to a different type and these types\
    \ are going to determine the layout and the size of the memory of the variable.\
    \ It is also going to set a range of values that you are able to store on this\
