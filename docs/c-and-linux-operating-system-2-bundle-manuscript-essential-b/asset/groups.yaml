    \ everything.\n\n# Data Types\n\nYou have to use different variables when you\
    \ are writing a program using any language. These are nothing more than just reserved\
    \ memory values that store locations in some space in the memory of the compiler.\
    \ The above list of reserved keywords are useful here as well. While there are\
