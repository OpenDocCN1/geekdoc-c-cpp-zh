  - 8. 定义一个名为 List 的类，可以保存类型为 double 的值列表。参照第 11.10 节中给出的 TemperatureList 类来设计你的类定义，但你的
    List 类在输出值时不会提及温度。值可以代表任何类型的数据项，只要它们是 double 类型即可。包含自我测试练习 21 和 22 中指定的附加功能。更改成员函数名，使其不引用温度。
- - '##'
  - 9. 定义一个名为 StringSet 的类，将用于存储一组 STL 字符串。使用数组或向量来存储字符串。创建一个构造函数，以字符串数组作为输入参数，用于集合的初始值。然后编写成员函数来向集合添加字符串、从集合中删除字符串、清空整个集合、返回集合中字符串的数量以及输出集合中的所有字符串。重载
    + 运算符，使其返回两个 StringSet 对象的并集。还重载 * 运算符，使其返回两个 StringSet 对象的交集。编写一个程序来测试类中的所有成员函数和重载运算符。
- - '##'
  - 10. 本编程项目要求你先完成编程项目 9。
- - '##'
  - 11. 重新做第 9 章的编程项目 6（或第一次做），但这次将动态数组和数组大小封装在一个类中。该类应具有公共成员函数 addEntry 和 deleteEntry。使数组和大小变量为私有。这将需要添加用于获取和设置数组中特定项的函数以及返回数组当前大小的函数。添加一个析构函数以释放分配给动态数组的内存。还添加一个拷贝构造函数并重载赋值运算符，以便动态数组能正确地从赋值运算符右侧的对象复制到左侧的对象。将你的类嵌入到合适的测试程序中。
- - '##'
  - 12. 为了打击选举舞弊，你的城市正在实施一种新的投票程序。选票上与选民可能做出的每个选择都关联一个字母。示例选票如下所示。
- - '##'
  - 13. 创建一个名为 Document 的类，存储一个 String 对象的向量。定义一个默认构造函数，创建一个空向量。定义一个拷贝构造函数，复制 Document
    对象及其包含的所有字符串。创建一个名为 addString 的方法，接受并将字符串添加到文档末尾。重载 << 运算符，以便文档可以以每个字符串对象之间有一个空格的方式输出。定义一个名为
    getLength 的方法，返回文档的总长度。提示：使用方法 string.length() 来获取每个单独字符串的长度。编写一个驱动程序来测试你的类。
- - '##'
  - 14. 做第 8 章的编程项目 16，但使用 Racer 类来存储每个参赛者的信息。该类应存储参赛者的姓名、号码布号码、完赛名次以及 RFID 传感器记录的所有分段时间。你可以选择合适的结构来存储此信息。包含适当的函数来访问或更改参赛者的信息，以及一个构造函数。创建一个
    Racer 对象的数组或向量来存储整个比赛结果。
- - '##'
  - 15. 定义一个名为 Box 的类，其中包含该形状的长度、宽度和高度字段。包含一个计算盒子体积的函数。重载 ==、<、<=、>、>= 运算符以比较不同盒子对象的体积。编写一个驱动程序来测试你的类。
