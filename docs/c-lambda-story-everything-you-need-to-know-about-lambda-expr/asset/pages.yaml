  md: "```\nlambda:\n\n// C++17\nauto ForwardToTestFunc = [](auto... ...args) {\n\
    \    // what's the type of args ?\n    return TestFunc(std::forward<decltype(args)>(args...);\n\
    };\n```\n\nEach time you want to access the type of the template argument, you\
