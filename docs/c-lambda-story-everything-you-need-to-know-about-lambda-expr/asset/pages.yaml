- pgno: 77
  md: "}\n\nA pointer to a noexcept function can be converted to a pointer to a regular\
    \ function (this also works for a pointer to a member function and also for lambdas).\
    \ But it's not possible the other way around (from a regular function pointer\
    \ into a function pointer that is marked with noexcept ).\n\nOne of the reasons\
    \ for adding the feature is a chance to optimise the code better. If the compiler\
    \ guarantees that a function won't throw, then it can potentially generate faster\
    \ code 10. Inside the Standard Library, there are many places where noexcept is\
    \ checked and based on the code can be more efficient. This is how it works for\
    \ std::vector which can differentiate between stored types that can move without\
    \ throwing or not.\n\nHere's an example which uses type traits and constexpr to\
    \ check if a given object is marked with noexcept\n\n```\n#include <iostream>\n\
    #include <type_traits>\n\ntemplate <typename Callable>\nvoid CallWith10(Callable&&\
    \ fn) {\n    if constexpr (std::is_nothrow_invocable_v<Callable, int> ) ) {\n\
    \        std::cout << \"Calling fn(10) with optimisation \\n \";\n        fn(10);\n\
    \    } else {\n        std::cout << \"Calling fn(10) normally \\n \";\n      \
    \  fn(10);\n    }\n}\n\nint main() {\n    int x {10};\n    const auto lam = [&x](int\
    \ y) noexcept { x += y; };\n    CallWith10(lam);\n\n    const auto lamEx = [&x](int\
    \ y) {\n        std::cout << \"LamEx with x = \" << x << '\\n';\n        x +=\
    \ y;\n    };\n    CallWith10(lamEx);\nn}\n```\n\n# The output:\n\nCalling fn(10)\
    \ with optimisation\nCalling fn(10) normally\nlamEx with x = 20"
  merge: -1
