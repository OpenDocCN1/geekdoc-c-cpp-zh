  md: "# Inheriting from a Lambda\n\nIt might be surprising to see, you can also derive\
    \ from a lambda!\n\nSince the compiler expands a lambda expression into a functor\
    \ object operator() , then we can inherit from this type.\n\nHave a look at the\
    \ basic code:\n\n```\nInheriting from a single Lambda. Live code @Wandbox\n#include\
    \ <iostream>\n\ntemplate < typename Callable>\nclass ComplexFunctor : public Callable\
    \ {\npublic:\n    explicit ComplexFunctor(Callable f) : Callable(f) {}\n};\n\n\
    template < typename Callable>\nComplexFunctor(Callable&& cal) {\n    return ComplexFunctor<Callable>(cal);\n\
    }\n\nint main() {\n    const auto func = MakeComplexFunctor([]() {\n        std::cout\
    \ << \"Hello Functor!\";\n    });\n    func();\n}\n```\n\nIn the example, there's\
    \ the ComplexFunctor class which derives from Callable which is a template parameter.\
    \ If we need to derive from a lambda, we need to do a little trick, unless we\
    \ cannot spell out the exact type of the closure type (unless we wrap it in a\
    \ std::function ). That's why we need the MakeComplexFunctor function to perform\
    \ the template argument deduction and get the type of the lambda closure.\n\n\
    The ComplexFunctor, apart from its name, is just a simple wrapper without much\
    \ of a use. Are there any use cases for such code patterns?\n\nFor example, we\
    \ can extend the code above and inherit it from two lambdas and create an overloaded\
    \ set:\n\n```\nInheriting from two Lambdas. Live code @Wandbox\n#include <iostream>\n\
    \ntemplate < typename TCall, typename UCall>\nclass SimpleOverloaded : public\
    \ TCall, UCall {\n```"
