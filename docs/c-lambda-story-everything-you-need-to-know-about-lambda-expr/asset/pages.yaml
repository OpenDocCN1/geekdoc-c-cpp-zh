    \    return second_val;\n  }\n  return default_value;\n});\n```\n\nAs you can\
    \ see, there's no need to write () at the end of the expression, and it's now\
    \ clear that the code invokes something.\n\nstd::invoke() is located in the <functional>\
    \ header file.\n\n# Updates to Variadic Generic Lambdas\n\nIn the C++14 chapter,\
    \ we talked about the variadic argument list that we can use with generic lambdas.\
    \ Thanks to fold expressions in C++17 we can write even more compact code. Here's\
    \ the converted example for the sum calculation:\n\n> Sum with Fold Expressions.\
    \ Live code @Wandbox\n\n```\n#include <iostream>\nint main() {\n  const auto sumLambda\
    \ = [] (auto ... args) {\n    std::cout << \"sum of: \" << sizeof...(args) <<\
    \ \" numbers \\n \";\n    return (args + ... + 0);\n  };\n\n  std::cout << sumLambda(1.1,\
    \ 2.2, 2.3, 3.4, 4.5, 5.5, 6.6, 7.7, 8.8, 9.9);\nn}\n```\n\nIf you compare this\
    \ to the previous example from C++14, you can quickly notice that there's no need\
