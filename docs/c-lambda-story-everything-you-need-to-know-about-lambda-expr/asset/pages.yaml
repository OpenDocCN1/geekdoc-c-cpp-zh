- pgno: 74
  md: "```\nconst auto f_impl = [](int n, const auto& impl) noexcept -> int {\n  return\
    \ n > 1 ? n * impl(n - 1, impl) : 1;\n};\nreturn factorial(n, f_impl);\n}\nreturn\
    \ factorial(5);\n```\n\nThis time we create an internal lambda that performs the\
    \ primary processing (f_impl). Later, we pass a generic argument to it (const\
    \ auto& impl). This parameter is a callable object that we can call recursively.\
    \ Thanks to generic lambdas in C++14 we can avoid the cost of std::function and\
    \ rely on auto type deduction.\n\n# More Tricks\n\nIf you'd like to see more tricks,\
    \ then you can also have a look at the following resources:\n\n+   - c++ - Recursive\
    \ lambda functions in C++11 - Stack Overflow\n- Recursive lambdas in C++(14) -\
    \ Pedro Melendez\n\n# Is recursive lambda the best alternative?\n\nIn this section,\
    \ you could see some of the tricks with the lambda expression. Nevertheless, the\
    \ complexity of those techniques is way ahead of a simple solution with just a\
    \ recursive function call. That’s why there might be cases where recursive lambda\
    \ is not the best and the most straightforward option. On the other hand, the\
    \ strong points for complicated recursive lambdas are its locality and the ability\
    \ to take auto arguments.\n\n# Summary\n\nAs you saw in this chapter, C++14 brought\
    \ several key improvements to lambda expressions. You can now declare new variables\
