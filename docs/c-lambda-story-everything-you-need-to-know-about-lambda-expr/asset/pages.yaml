- pgno: 78
  md: "The code uses std::is_nothrow_invocable_v to check if the given callable object\
    \ is marked with noexcept.\n\n> In C++17, the Exception Specification is cleaned\
    \ up. Effectively, you can only use noexcept for declaring a function that won't\
    \ throw. The dynamic exception specification, i.e. throw(X, Y, Z) is now removed.\n\
    \n> > **Quick Question:** What happens if you mark a function with noexcept and\
    \ yet it throws an exception? In that case, the compiler will call std::terminate.\n\
    \n# constexpr Lambda Expression\n\nSince C++11, constexpr allowed more and more\
    \ code to be evaluated at compile time. This not only affects the performance\
    \ but more importantly makes compile-time coding much more pleasant and potent.\
    \ In C++17, this powerful keyword can also be applied on lambdas Let’s see specification\
    \ expr.prim.lambda #4\n\n> The function call operator is a constexpr function\
    \ if either the corresponding lambda-expression's parameter-declaration-clause\
    \ is followed by constexpr , or it satisfies the requirements for a constexpr\
    \ function.\n\nIn other words, if the lambda body follows the rules of a constexpr\
    \ function then, operator() for the closure type is implicitly defined as constexpr\
    \ . To recall, in C++17, a constexpr function has the following rules n4659/dcl.constexpr#3\n\
    \n+   * it shall not be virtual;\n* its return type shall be a literal type;\n\
    * each of its parameter types shall be a literal type;\n* its function-body shall\
    \ be delete , default , or a compound-statement does not contain\n    * an asm-definition,\n\
    \    * a goto statement,"
