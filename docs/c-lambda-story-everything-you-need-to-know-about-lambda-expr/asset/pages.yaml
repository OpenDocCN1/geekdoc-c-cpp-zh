- pgno: 97
  md: 'allows you to parallelise most of the algorithms from the Standard Library.

    All you have to do is to specify the first argument into the algorithm, for

    example:


    ```

    auto myVec = GenerateVector();

    std::sort(std::execution::par, myVec.begin(), myVec.end());

    ```


    Please notice the first argument: std::execution::par . It’s used to enable

    parallel execution of the sort algorithm.


    And we have other options:


    | Policy Name | Description |

    |---|---|

    | sequenced_policy | It is an execution policy type used as a unique type to disambiguate
    parallel algorithm overloading and require that a parallel algorithm’s execution
    not be parallelised. |

    | parallel_policy | It is is an execution policy type used as a unique type to
    disambiguate parallel algorithm overloading and indicate that a parallel algorithm’s
    execution may be parallelised. |

    | parallel_unsequenced_policy | It is an execution policy type used as a unique
    type to disambiguate parallel algorithm overloading and indicate that a parallel
    algorithm’s execution may be parallelised and vectorised. |


    For each policy we have a predefined global instance that you can pass to

    algorithms:


    +   * std::execution::par

    * std::execution::seq

    * std::execution::par_unseq


    Execution policy declarations and global objects are located in the

    <execution> header.'
