  md: "As we can see, it's quite handy to create a thread with a lambda expression.\
    \ It's local to your executing thread, and you can do everything like with a regular\
    \ function or functor object.\n\nLet's now try another technique that is available\
    \ in C++.\n\n# Lambdas with std::async\n\nA second way that you can leverage multithreading\
    \ is through std::async . We got that functionality together with threads in C++11.\
    \ This is a high-level API that you set up and call computations lazily or fully\
    \ asynchronously.\n\nLet's convert our example with iota into the async call:\n\
    \n```\nInvoking code asynchronously with std::async . Live code @Coloru\n#include\
    \ <iostream>\n#include <future> // for async and future\n#include <vector>\n#include\
    \ <numeric> // for std::iota\n\nint main () {\n    const auto printThreadID =\
    \ [](const char * str) {\n        std::cout << str << \" \" << std::this_thread::get_id()\
    \ << \" thread id \\n \" << \";\n    };\n\n    std::vector<int> numbers(100);\n\
    \n    std::future<void> iotaFuture = std::async(std::launch::async,\n        [&numbers,\
    \ startArg=10, &printThreadID](){\n        std::iota(numbers.begin(), numbers.end(),\
    \ startArg);\n        printThreadID(\"iota in\");\n    });\n\n    iotaFuture.get();\
    \ // make sure we get the results...\n    printThreadID(\"printing numbers in\"\
    );\n    for (const auto &num : numbers)\n        std::cout << num << \" \";\n\n\
    }\n```\n\nThis time after threads, we rely on the mechanism of std::future. This\
    \ is an object that handles the synchronisation and guarantees that the results\
    \ of the invocation are available when we ask it through .get().\n\nIn our case\
    \ we schedule the execution of the lambda through std::async, and then we need\
    \ to call .get() to finish the computations. .get()"
