  md: '# Syntax Highlighting Limitations


    The current version of the book might show some limitations regarding syntax highlighting.


    For example:


    +   - if constexpr - Link to Pygments issue: #1432 - C++ if constexpr not recognized
    (C++17).

    - The first method of a class is not highlighted: #1084 - First method of class
    not highlighted in C++.

    - Template method is not highlighted #1434 - C++ lexer doesn''t recognize function
    return type is templated.

    - Modern C++ attributes are sometimes not recognised properly.


    Other issues for C++ and Pygments: issues C++ .


    # Online Compilers


    Instead of creating local projects to play with the code samples, you can also
    leverage online compilers. They offer a basic text editor and usually allow you
    compile only one source file (the code you edit). They are convenient if you want
    to play with code samples and check the results using various compilers vendors
    and versions.


    For example, many of the code samples for this book were created using Coliru
    Online, Wandbox or Compiler Explorer and then adapted for the book.


    Here''s a list of the useful services:


    +   - Coliru - uses GCC 9.2.0 (as of July 2020), offers link sharing and a basic
    text editor, it''s simple but very effective.

    - Wandbox - offers a list of compilers, including most Clang and GCC versions,
    can use libraries; offers link sharing and multiple file compilation.

    - Compiler Explorer - offers many compilers, shows generated assembly code, can
    execute the code, or make static code analysis.

    - CppBench - runs simple C++ performance tests (using google benchmark library).'
