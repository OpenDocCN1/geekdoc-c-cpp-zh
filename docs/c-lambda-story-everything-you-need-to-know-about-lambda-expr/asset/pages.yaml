  md: "# Capturing Two Variables by Copy and Mutable. Live code @Wandbox\n\n```\n\
    #include <iostream>\n\nint main() {\n    const auto print = [](const char *str,\
    \ int x, int y) {\n        std::cout << str << \" \" << x << \" \" << y << '\\\
    n';\n    };\n    int x = 1, y = 1;\n    print(\"in main()\", x, y);\n    auto\
    \ foo = [x, y, &]() mutable {\n        ++x;\n        ++y;\n        print(\"in\
    \ foo()\", x, y);\n    };\n    foo();\n    print(\"in main()\", x, y);\n}\n```\n\
    \nOutput:\n\nin main(): 1 1\nin foo(): 2 2\nin main(): 1 1\n\nIn the above example,\
    \ we can change the values of x and y . Since those are only the copies of x and\
    \ y from the enclosing scope, we don't see their new values after foo is invoked.\n\
    \nOn the other hand, if you capture by reference, then you don't need to apply\
    \ mutable to the lambda to modify the value. This is because the captured member\
    \ variables are references and cannot be bound inside a const member function,\
    \ but you can change the referenced values.\n\n> Capturing a Variable by Reference\n\
    \n```\nint x = 1;\nstd::cout << x << '\\n';\nconst auto foo = [&x]()() noexcept\
    \ { ++x; };\nfoo();\nstd::cout << x << '\\n';\n```\n\nIn the above example, the\
    \ lambda is not mutable, but it can change the referenced value.\n\nOne important\
    \ thing to notice is that when you apply mutable , then you cannot mark your resulting\
    \ closure object with const as it prevents you from invoking the lambda!"
