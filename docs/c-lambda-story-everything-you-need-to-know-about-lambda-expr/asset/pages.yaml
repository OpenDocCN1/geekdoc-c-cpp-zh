    \ are recognised and understood, C++ programmers found\nways to work around the\
    \ issues with C++98/03. One solution is to prepare a\nset of helpers.\n\n# Composing\
    \ With Functional Helpers\n\nHow about having some helpers and predefined functors?\n\
    \nIf you check the <functional> header from the Standard Library, you'll findna\
    \ lot of types and functions that can be immediately used with the standard\n\
