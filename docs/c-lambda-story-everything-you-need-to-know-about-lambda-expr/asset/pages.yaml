    \n> Recursive Lambda with std::function . Live code @Wandbox\n\n```\n#include\
    \ <functional>\nint main() {\n    const std::function<int(int)> factorial = [&factorial](int\
    \ n) {\n        return n > 1 ? factorial(n - 1) : 1;\n    };\n    return factorial(5);\n\
    }\n```\n\nIn the previous code sample, inside is a captured std::function object.\
    \ This object is fully defined, and that’s why the compiler has no issues when\
    \ accessing and calling it.\n\nIf you want to use only stateless lambdas, then\
    \ you might even try with a function pointer rather than std::function as it should\
    \ cost much less memory.\n\nBut there’s one more trick:\n\n# Internal Lambda and\
    \ a Generic Parameter\n\nWith C++14 we can use the following alternative:\n\n\
    > Recursive Lambda with internal implementation. Live code @Wandbox\n\n```\nint\
    \ main() {\n    const auto factorial = [](int n) noexcept {\n```"
