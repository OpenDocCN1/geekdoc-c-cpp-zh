- pgno: 25
  md: "```\nstruct {\n  void operator()(int x) const {\n    std::cout << x << '\\\\\
    n';\n  }\n} someInstance;\n```\n\nThe process of translation or \"expansion\"\
    \ can be easily viewed on C++ Insights an online tool that takes valid C++ code\
    \ and produces a source code version that the compiler generates: like anonymous\
    \ functors for lambdas, template instantiation and many other C++ features.\n\n\
    In the next sections we'll dive more into the individual parts of the lambda expression.\n\
    \n# The Type of a Lambda Expression\n\nSince the compiler generates a unique name\
    \ for each lambda (the closure type), there's no way to \"spell\" it upfront.\n\
    \nThat's why you have to use auto (or decltype )) to deduce the type.\n\n```\n\
    auto myLambda = [](int a) -> double * a;\n```\n\nWhat's more, if you have two\
    \ lambdas that look the same:\n\n```\nauto firstLam = [](int x) { return x * 2;\
    \ }\nauto secondLam = [](int x) { return x * 2; };\n```\n\nTheir types are different\
    \ even if the \"code-behind\" is the same! The compiler is required to declare\
    \ two unnamed types for each lambda.\n\nWe can prove this property with the following\
    \ code:\n\n```\n#include <type_traits>\nifferent Types, Same Code. Live code @Wandbox\n\
    ```\n\n```\nint main() {\n  const auto oneLam = [](int x) noexcept { return x\
    \ * 2; }\n  const auto twoLam = [](int x) noexcept { return x * 2; }\n  static_assert(std::is_same<decltype(oneLam),\
    \ decltype(twoLam)>::value, \"must be different!\");\n}\n```\n\nThe example above\
    \ verifies the closure types for oneLam and twoLam are not the same."
