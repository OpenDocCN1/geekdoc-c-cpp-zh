- pgno: 32
  md: "variables which are also references.\n\n> The value of the value-captured variable\
    \ is at the time the lambda is defined - not when it is used! The value of a ref-captured\
    \ variable is the value when the lambda is used - not when it is defined.\n\n\
    While specifying [] and [& might be convenient, as it captures all automatic storage\
    \ duration variables, it's clearer to capture a variable explicitly. That way\
    \ the compiler can warn you about unintended effects (see notes global and static\
    \ variable for example).\n\nYou can also read in item 31 in \"Effective Modern\
    \ C++\" 3 by Scott Meyers: \"Avoid default capture modes.\"\n\n> The C++ closures\
    \ do not extend the lifetimes of the captured references. Be sure that the capture\
    \ variable still lives when lambda is invoked.\n\n# The mutable Keyword\n\nBy\
    \ the default operator() of the closure type is marked as const , and you cannot\
    \ modify captured variables inside the body of the lambda.\n\nIf you want to change\
    \ this behaviour, you need to add the mutable keyword after the parameter list.\
    \ This syntax effectively removes the const from the call operator declaration\
    \ in the closure type. If you have a simple lambda expression with a mutable :\n\
    \n```\nint x = 1;\nauto foo = [x]() mutable { ++ x; };\n```\n\nIt will be \"expanded\"\
    \ into the following function:\n\n```\nstruct _lambda_x1 {\n    void operator()\
    \ { ++ x; }\n    int x;\n};\n```\n\nAs you can see, the call operator can change\
    \ the value of the member fields."
