- pgno: 49
  md: "```\npublic :\n    SimpleOverloaded(TCall tf, UCall uf) : TCall(tf), UCall(uf)\
    \ {\n        using TCall::operator();\n        using UCall::operator();\n    }\n\
    \ntemplate <typename TCall, typename UCall> MadeOverloaded(TCall& tf, UCall& uf)\
    \ {\n    return SimpleOverloaded<TCall, UCall>(tf, uf);\n}\n\nint main() {\n \
    \   const auto func = std::cout << \"Int! \\n \", {\n        [](int) { },\n  \
    \      [](float) { std::cout << \"Float! \\n \" }\n    };\n    func(10);\n   \
    \ func(10.0f);\n}\n```\n\nThis time we have a bit more code: we derive from two\
    \ template parameters, but we also need to expose their call operators explicitly.\n\
    \nWhy is that? It's because when looking for the correct function overload the\
    \ compiler requires the candidates to be in the same scope.\n\nTo understand that,\
    \ let's write a simple type that derives from two base classes. The example also\
    \ comments out two using statements:\n\n```\n#include <iostream>\n\nstruct BaseInt\
    \ {\n    void Func(int) { std::cout << \"BaseInt... \\n \" ; }\n};\n\nstruct BaseDouble\
    \ {\n    void Func(double) { std::cout << \"BaseDouble... \\n \" ; }\n};\n\nstruct\
    \ Derived : public BaseInt, BaseDouble {\n    //using BaseInt::Func;\n    //using\
    \ BaseDouble::Func;\n}\n```\n\n```\nint main() {\n    Derived d;\n    d.Func(10.0);\n\
    }\n```\n\nWe have two base classes that implement Func . We want to call that\
    \ method from the derived object."
