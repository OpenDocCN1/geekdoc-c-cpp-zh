  md: "```\n#include <iostream>\n#include <string>\n#include <vector>\n\nstruct PrintFunctor\
    \ {\n    PrintFunctor(const std::string& str)\n        : strText(str), numCalls(0)\
    \ {}\n\n    void operator()(int x) const {\n        std::cout << strText << x\
    \ << '\\n';\n        ++numCalls;\n    }\n\n    std::string strText;\n    mutable\
    \ int numCalls;\n};\n\nint main() {\n    std::vector<int> v;\n    v.push_back(1);\n\
    \    v.push_back(2);\n    const std::string introText(\"Elem: \");\n    const\
    \ PrintFunctor visitor = std::for_each(v.begin(), v.end(),\n                 \
    \                   PrintFunctor(introText));\n    std::cout << \"num calls: \"\
    \ << visitor.numCalls << '\\n';\n}\n```\n\nIn this version, PrintFunctor takes\
    \ an extra parameter to initialise member variable. Then this variable is used\
    \ in the call operator. So the expected output is as follows:\n\n+   - Elem: 1\n\
    - Elem: 2\n- num calls: 2\n\n# Issues with Functors\n\nAs you can see, functors\
    \ are powerful. They are represented by a separate class, and you can design them\
    \ any way you like.\n\nHowever, in C++98/03, the problem was that you had to write\
    \ a function or a functor in a different place than the invocation of the algorithm.\
    \ This could mean that the code for a function could be dozens or hundreds of\
    \ lines later or further in the source file.\n\nAs a potential solution, you might\
    \ have tried writing a local functor class, since C++ always has support for that\
    \ syntax. But that didn't work...\n\nSee this code:"
