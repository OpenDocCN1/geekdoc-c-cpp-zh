- pgno: 43
  md: "If your lambda doesn't capture any variables then the compiler can convert\
    \ it to a regular function pointer. See the following description from the Standard\
    \ expr.prim.lambda6 :\n\n> The closure type for a lambda-expression with no lambda-capture\
    \ has a public-virtual non-explicit const conversion function to pointer having\
    \ the same parameter and return types as the closure type's function call operator.\
    \ The value returned by this conversion function shall be the address of a function\
    \ that, when invoked, has the same effect as invoking the closure type's function\
    \ call operator.\n\nTo illustrate how a lambda can support such conversion let’s\
    \ consider the following example. It defines a functor baz that explicitly defines\
    \ the conversion operator:\n\nConversion to a Function Pointer. Live code @Sandbox\
    \ line-numbers-on\n#include <iostream>\n\n```\nvoid callWith10(void (* bar)(int))\
    \ {\n  bar(10);\n}\n\nint main () {\n  struct {\n    using f_ptr = void (*)(int);\n\
    \n    void operator()(int s) const { return call(s); }\n    operator f_ptr() const\
    \ { return &call; }\n\n  private:\n    static void call(int s) { std::cout <<\
    \ s << '\\n'; };n  } baz;\n\ncallWith10(baz);\ncallWith10([baz](int x) { std::cout\
    \ << x << '\\n'; });\n}\n```\n\nIn the preceding program, there's a function callWith10\
    \ that takes a function pointer. Then we call it with two arguments (lines 18\
    \ and 19): the first one uses baz which is a functor that contains necessary conversion\
    \ operators - it converts to f_ptr which is the same as the input parameter for\
    \ callWith10 . Later, we have a call with a lambda. In this case, the compiler\
    \ performs the required conversions underneath\n\nSuch conversion might be handy\
    \ when you need to call a C-style function that requires some callback. For example,\
    \ below you can find code that calls"
