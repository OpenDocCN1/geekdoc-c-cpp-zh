- pgno: 28
  md: "If you copy a lambda, then you also copy its state. This is important when\
    \ we talk about capture variables. In that context, a closure type stores captured\
    \ variables as member fields. Performing a lambda copy will copy those data member\
    \ fields.\n\n> > A peek into the future\nIn C++20 a stateless lambda will be default\
    \ constructible and assignable.\n\n# The Call Operator\n\nThe code that you put\
    \ into the lambda body is \"translated\" to the code in the operator() of the\
    \ corresponding closure type.\n\nBy default, in C++11, it's a inline member function.\
    \ For instance:\n\n```\nauto lam = [](double param) { /* do something*/ };\n```\n\
    \nExpands into:\n\n```\nstruct _anonymousLambda {\n    inline void operator()(double\
    \ param) const { /* do something*/ };\n}\n```\n\n# Overloading\n\nOne that is\
    \ worth mentioning is that when you define a lambda there's no way to create \"\
    overloaded\" lambdas taking different arguments. Like:\n\n```\n// doesn't compile!\n\
    auto lam = [](double param) { /* do something*/ };\nauto lam = [](int param) {\
    \ /* do something*/ };\n```\n\nAbove, the code won't compile as the compiler cannot\
    \ translate two lambdas in a single functor, and you cannot redefine the same\
    \ variable. On the other hand, it's possible to create a functor that has two\
    \ call operators:\n\n```\nstruct MyFunctor {\n    inline void operator()(double\
    \ param) const { /* do something*/ }\n    inline void operator()(int param) const\
    \ { /* do something*/ };\n}\n```"
  merge: -1
