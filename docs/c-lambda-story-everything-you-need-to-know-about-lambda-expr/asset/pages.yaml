  md: "# 2. Lambdas Improve Locality of the Code\n\nIn C++98/03, you had to create\
    \ functions or functors that could be far away from the place where you passed\
    \ them as callable objects.\n\nThis is hard to show on simple artificial examples,\
    \ but you can imagine a large source file, with more than a thousand lines of\
