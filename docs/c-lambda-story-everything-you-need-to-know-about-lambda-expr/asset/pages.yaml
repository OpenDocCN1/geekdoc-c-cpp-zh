- pgno: 92
  md: "This section won't be a tutorial on how to write concurrent code in C++, but\
    \ it aims to show problems that you can encounter with lambdas in asynchronous\
    \ code. For more information about concurrency in C++, you can consult separate\
    \ books like Concurrency with Modern C++ by Rainer Grimmer or C++ Concurrency\
    \ in Action by Anthony Williams.\n\n# Lambdas with std::thread\n\nLet's start\
    \ with std::thread which is available since C++11. As you might already know std::thread\
    \ accepts a callable object in its constructor. It might be a regular function\
    \ pointer, a functor or a lambda expression. A simple example:\n\nPassing lambda\
    \ to a thread. Live code @Coliru\n\n```\n#include <iostream>\n#include <thread>\n\
    #include <vector>\n#include <numeric> // for std::iota\n\nint main() {\n    const\
    \ auto printThreadID = [=](const char * str) {\n        std::cout << str << \"\
    : \" << std::this_thread::get_id() << \" thread id \\\\n\";\n    };\n\n    std::vector<int>\
    \ numbers(100);\n\n    std::thread iotaThread([&numbers, &printThreadID](int startArg)\
    \ {\n        std::iota(numbers.begin(), numbers.end(), startArg);\n        printThreadID(\"\
    iota in \\\");\n    }, 10);\n\n    iotaThread.join();\n    printThreadID(\"printing\
    \ numbers in \\\");\n\n    for (const auto &num : numbers) {\n        std::cout\
    \ << num << \"\\\", \\\\\";\n    }\n\n}\n```\n\nIn the above example, we create\
    \ a thread with a lambda expression. The std::thread class has a flexible constructor,\
    \ so we can even pass a value for the argument. In our code 10 is passed into\
    \ the lambda as startArg.\n\nThe code is simple because we can control the thread\
    \ execution, and by joining it, we know that the results of the iota will be ready\
    \ before we print them."
  merge: -1
  img_proc: true
- pgno: 93
  md: "The critical thing to remember is while lambdas make it easy and convenient\
    \ to create a thread, it’s still the asynchronous execution. Closures are not\
    \ “special” and also vulnerable to all race conditions and blocking.\n\nThis is\
    \ visible in the following example:\n\n```\n#include <iostream>\n#include <thread>\n\
    #include <vector>\n\nint main() {\n    int counter = 0;\n\n    auto maxThreads\
    \ = std::hardware_concurrency();\n    std::vector<std::thread> threads(maxThreads);\n\
    \    for (int t = 0; t < maxThreads; ++t) {\n        threads.push_back([&counter]()\
    \ noexcept {\n            for (int i = 0; i < 1000; ++i) {\n                counter++;\n\
    \                counter--;\n                counter++;\n                counter--;\n\
    \            }\n        });\n    }\n\n    for (auto &thread : threads) {\n   \
    \     thread.join();\n    }\n\n    std::cout << counter << std::endl;\n}\n```\n\
    \nIn the example, we’re creating several threads 13, and each thread performs\
    \ some computations on the counter variable. The variable is shared among all\
    \ the threads.\n\n> In C++20 you can use std::thread which is a thread that joins\
    \ on destruction and also accepts stop tokens. This new kind of threading object\
    \ allows more control for the thread execution.\n\nWhile you might expect to see\
    \ 0 as the final value of counter , the result is undefined. One thread can read\
    \ the value while others might simultaneously write to it, causing the final result\
    \ to be non-deterministic."
  merge: -1
  img_proc: true
- pgno: 94
  md: "To fix the issue, as regular threading scenarios, we should use some sort of\
    \ a synchronisation mechanism. For this example, we can use atomics as they seem\
    \ to be the easiest to use.\n\nChanging atomic value. Live code @Wandbox\n\n```\n\
    #include <iostream>\n#include <thread>\n#include <vector>\n\nint main() {\n  \
    \  std::atomic<int> counter = 0;\n\n    const auto maxThreads = std::thread::hardware_concurrency();\n\
    \    std::vector<std::thread> threads(maxThreads);\n    threads.reserve(maxThreads);\n\
    \    for (int tCounter=0; tCounter < maxThreads; ++ tCounter) {\n        threads.push_back([&counter]()\
    \ noexcept {\n            for (int i = 0; i < 1000; ++ i) {\n                counter.fetch_add(1);\n\
    \                counter.fetch_sub(1);\n                counter.fetch_add(1);\n\
    \                counter.fetch_sub(1);\n            }\n        });\n    }\n\n\
    \    for (auto &thread : threads) {\n        thread.join();\n    }\n\n    std::cout\
    \ << counter.load() << std::endl;\n}\n```\n\nThe code above works as expected\
    \ because increment and decrement operations are now atomic. It means that when\
    \ value cannot interrupt this action. The synchronisation makes code safer but\
    \ at a price of the performance. This is, however, a topic for a much longer discussion\
    \ and a separate book.\n\n+   Another option to solve the synchronisation problem\
    \ is to have a local variable in each thread that is computed. Then, before the\
    \ thread ends, we could lock and update the global value. It is also worth adding\
    \ that defining a variable volatile doesn't provide correct synchronisation. In\
    \ C++20 volatile is deprecated in many places."
  merge: -1
