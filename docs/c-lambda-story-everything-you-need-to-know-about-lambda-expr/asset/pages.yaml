  md: "qsort from the C Library and uses a lambda to sort elements in the reverse\n\
    order:\n\nCalling a C-style function. Live code @Wandbox\n\n```\n#include <cstdlib>\n\
    #include <iostream>\n\nint main() {\n    int values[] = { 8, 9, 2, 5, 1, 4, 7,\
    \ 3, 6 };\n    constexpr size_t nElements = sizeof(values)/ sizeof(values[]);\n\
    \n    std::qsort(values, nElements, sizeof(int),\n        [](const void * a, const\
    \ void * b) noexcept {\n            return (*(int *)b - (*(int *)a);\n       \
    \ });\n\n    for (const auto &val : values) {\n        std::cout << val << \"\
    , \";\n    }\n}\n```\n\nAs you can see in the code sample uses qsort which takes\
    \ only\nfunction pointers as the comparator. The compiler can do an implicit\n\
    conversion of the stateless lambda that we pass.\n\n# A Tricky Case\n\nBefore\
    \ we move on to another topic there's also one case that might be\ninteresting\
    \ to analyse:\n\nPlus and a Lambda. Live code @Wandbox\n\n```\n#include <type_traits>\n\
    int main() {\n    auto funcPtr = +[](){};\n    static_assert(std::is_same<decltype(funcPtr),\
    \ void (*)()>::value);\nn}\n```\n\nPlease notice the strange syntax with + . If\
    \ you remove the plus sign then the\nstatic_assert fails. Why is that?\n\nTo understand\
    \ how it works we can look at the output generated by the C++\nInsights. See the\
    \ working example:\n\n```\nusing FuncPtr_4 = void (());\nFuncPtr_4 funcPtr = \n\
    \    + static_cast<void (*)()>(_{__la::operator la::__la::retType_4_18()});\n\
    /* PASSED: static_assert(std::integral_constant<bool, 1>::value); */\n```"
