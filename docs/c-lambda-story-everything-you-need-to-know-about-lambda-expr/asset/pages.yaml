    \n```\n// C++20:\nauto ForwardToTestFunc = []<typename... T>(T&& ...args) {\n\
    \    return TestFunc(std::forward<T>(args...)); // we have all the types!\n};\n\
    ```\n\nAs you can see, template lambdas provide cleaner syntax and better access\
    \ to types of arguments.\n\nBut there's more! You can also use concepts with lambdas!\
    \ See in the next section.\n\n# Concepts and Lambdas\n\nConcepts are a revolutionary\
    \ approach for writing templates! They allow you to put constraints on template\
    \ parameters which improve the readability of code, might speed up compilation\
    \ time and give better error messages.\n\nOne simple example:\n\n```\n// define\
    \ a concept:\ntemplate < class T>\nconcept SignedIntegral = std::is_integral_v<T>\
    \ && std::is_signed_v<T>;\n\n// use:\ntemplate < SignedIntegral T>\nvoid signedIntsOnly(T\
    \ val) { }\n```\n\nIn the code above we create a concept that describes types\
    \ that are signed and integral. Please notice that we can use existing traits.\
    \ Later, we use it to define a template function that supports only types that\
    \ match the concept. Here we don't use typename T but we can refer to the name\
    \ of a concept.\n\nOk, but how is that related to lambda expressions?"
