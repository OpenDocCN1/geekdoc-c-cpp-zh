  md: "# For example:\n\nCapture With An Initialiser. Live code @Wandbox\n\n```\n\
    #include <iostream>\n\nint main () {\n    int x = 30;\n    int y = 12;\n    const\
    \ auto foo = [z = x + y]() { std::cout << z << '\\n'; };\n    x = 0;\n    y =\
    \ 0;\n    foo();\n}\n```\n\n# The output:\n\n42\n\nIn the example above, the compiler\
    \ generates a new member variable and initialises it with x+y . The type of the\
    \ new variable is deduced in the same way if you put auto in front of this variable.\
    \ In our case:\n\n```\nauto z = x + y;\n```\n\nIn summary, the lambda from the\
    \ preceding example resolves into a following (simplified) functor:\n\n```\nstruct\
    \ __unnamedLambda {\n    void operator()() const {\n        std::cout << z <<\
    \ '\\n';\n    }\n\n    int z;\n} someInstance;\n```\n\nz will be directly initialised\
    \ (with x+y) when the lambda expression is defined.\n\nKeep in mind the previous\
    \ sentence. The new variable is initialised at the place where you define a lambda\
    \ and not where you invoke it.\n\nThat's why if you modify x or y variables after\
    \ you created the lambda, the variable z won't change. In the example, you can\
    \ see that immediately after the lambda was defined I changed the values of x\
    \ and y . The output will be still 42 as z was initialised earlier."
