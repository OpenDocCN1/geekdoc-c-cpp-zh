- pgno: 18
  md: "the given value.\n- std::bind2nd - creates a callable object with the second\
    \ argument fixed\nto the given value.\n- and many more.\n\nLet's write some code\
    \ that benefits from the helpers:\n\nUsing old C++98/03 functional helpers. Live\
    \ code @Wandbox\n\n```\n#include <algorithm>\n#include <functional>\n#include\
    \ <vector>\n\nint main() {\n    std::vector<int> v;\n    v.push_back(1);\n   \
    \ v.push_back(2);\n    // push_back until 9...\n    const size_t smaller5 = std::count_if(v.begin(),\
    \ v.end(),\n        std::bind2nd(std::less<int>(),), 5));\n\n    return smaller5;\n\
    }\n```\n\nThe example uses std::bind2nd and fixes its second argument by using\n\
    std::bind2nd. This whole \"composition\" is passed into count_if. As you\ncan\
    \ probably guess, the code expands into a function that performs a simple\ncomparison:\n\
    \nreturn x < 5;\n\nIf you wanted ready-to-use helpers, then you can also look\
    \ at the boost\nlibrary, for example boost::bind.\n\nUnfortunately, the main issue\
    \ with this approach is the complexity and hard-\nto-learn syntax. for instance\
    \ writing code that composes two or more\nfunctions is not natural. Have a look\
    \ below:\n\nComposing functional helpers. Live Code @Wandbox\n\n```\nstd::vector<int>\
    \ v;\nv.push_back(1);\nv.push_back(2);\n// push_back until 9...\nconst size_t\
    \ val = std::count_if(v.begin(), v.end(),\n    std::bind(std::logical_and<bool>(),),\n\
    \    std::bind(std::greater<int>(),_1, 2),\n    std::bind(std::less_equal<int>(),_1,\
    \ 6)));\n```"
