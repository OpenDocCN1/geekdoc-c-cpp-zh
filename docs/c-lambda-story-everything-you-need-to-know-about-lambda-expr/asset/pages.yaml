  md: "the function signature and c++ include some extra header file <functional>\n\
    \ If you recall from the C++11 chapter, std::function is a heavy object (in\n\
    GCC 9 the sizeof shows 32 bytes) and it needs some advanced internal mechanics\
    \ so that it can handle any callable objects.\n\nThanks to the improvements in\
    \ C++14, we can now heavily simplify the\ncode:\n\n```\nAuto return type deduction\
    \ for lambdas. Live code @Wandbox\n#include <iostream>\nauto CreateMullLambda(int\
    \ x) noexcept {\n    return [x](int param) noexcept { return x * param; };\n}\n\
    int main() {\n    const auto lam = CreateMullLambda(10);\n    std::cout << sizeof(lam);\n\
    \    return (2);\n}\n```\n\nThis time we can entirely rely on the compile-time\
    \ type deduction, and no\nhelper types are required. On GCC the size of lambda\
    \ sizeof(lam) is just 4\nbytes and it's far cheaper than the solution with std::function\
    \ . Please\nnotice that we could also mark CreateMullLambda with noexcept as there\
    \ are no\nway it can throw any exception. This was not the case when returning\n\
    std::function.\n\n# Captures With an Initialiser\n\nNow some more significant\
    \ updates!\n\nAs you recall, in a lambda expression you can capture variables\
    \ from the\noutside scope. The compiler expands that capture syntax and creates\
    \ member\nvariables (non-static members) in the closure type.\n\nNow, in C++14,\
    \ you can create new member variables and initialise them in\nthe capture clause.\
    \ Then you can access these variables inside the lambda.\nIt's called capture\
    \ with an initialiser or another name for this feature is\ngeneralised lambda\
    \ capture."
