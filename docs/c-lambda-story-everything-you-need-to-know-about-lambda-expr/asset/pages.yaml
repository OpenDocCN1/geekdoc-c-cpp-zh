- pgno: 45
  md: "```\n// la is _lambda_4_18 in cppinnights\n```\n\nThe code uses + which is\
    \ a unary operator. This operator can work on pointers, so the compiler converts\
    \ our stateless lambda into a function pointer and assigns it to funcPtr. On the\
    \ other hand, if you remove the plus, then funcPtr is a regular closure object,\
    \ and that's why the static_assert fails.\n\nWhile it's probably not the best\
    \ idea to write such a syntax with \"+\", it has the same effect if you write\
    \ static_cast . You can apply this technique in a situation when you don't want\
    \ the compiler to create too many function instantiations. For example:\n\nCasting\
    \ to a Function Pointer. Live code @CppInsights\n\n```\ntemplate <typename F>\n\
    void call_function(F f) {\n  f(10);\n}\n\nint main() {\n  call_function(static_cast<int\
    \ *>(int int)> ([])(int x){\n    return x * 2;\n  });\n  call_function(static_cast<int\
    \ *>(int int)> ([])(int x){\n    return x * 2;\n  });\n}\n```\n\nIn the above\
    \ example the compiler has create only a single instantiation of call_function\
    \ - as it only takes a function pointer int (*)int) . But if you remove static_cast\
    \ s you'll get two versions of call_function as the compiler has to create two\
    \ separate types for lambdas.\n\n# IIFE - Immediately Invoked Functional Expression\n\
    \nIn most of the examples, you could notice that I defined a lambda and then call\
    \ it later.\n\nHowever, you can also invoke lambda immediately:\n\nCalling Lambda\
    \ Now. Live code @Wandbox\n\n```\n#include <iostream>\nint main() {\n  int x =\
    \ 1, y = 1;\n  [&]() noexcept { ++ x; y; }(); // -- call ()\n  std::cout << x\
    \ << \" \" << y;\n}\n```"
  merge: -1
