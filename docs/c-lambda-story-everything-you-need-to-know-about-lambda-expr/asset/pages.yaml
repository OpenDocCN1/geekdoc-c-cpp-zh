    \    lam();\n    }\n    std::string s;\n}\n```\n\nThere are no compiler errors\
    \ now.\n\nYou can use [=] or [&] to capture this (they both have the same effect\
    \ in C++14).\n\nPlease note that we captured this by value... to a pointer. That's\
    \ why you have access to the member variable, not its copy.\n\nIn C++11 (and even\
    \ in C++14) you cannot write:\n\n```\nauto lam = ['* this]() { std::cout << s;\
    \ };\n```\n\nThe code won't compile in C++11/14; it is, however, allowed in C++17."
