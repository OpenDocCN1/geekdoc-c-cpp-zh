- pgno: 76
  md: "# Lambda Syntax Update\n\nWith C++17, we have a few changes to the syntax of\
    \ lambda expressions:\n\n+   - You can now add constexpr after the parameter list.\n\
    - The dynamic exception specification was deprecated in C++11 and removed in C++17,\
    \ so in practice, you should only use noexcept.\n\n```\n() specifiersCall attrtr\
    \ -> ret { /code; / }\n^ ^ ^\n| | |\n| | |\n| | optional: trailing return type\n\
    | optional: mutable, constexpr, noexcept, attributes\n|\nparameter list (optional\
    \ when no specifiers added)\nlambda introducer with an optional capture list\n\
    ```\n\nYou can read about this new modification in the next section.\n\n# Exception\
    \ Specification in Type System\n\nBefore we move to syntax improvements for lambdas,\
    \ we need to cover one “general” language feature that was introduced in C++17.\n\
    \nException Specification for a function didn't use to belong to the type of the\
    \ function, but in C++17, it's part of it. You can have two function overloads:\
    \ one with noexcept and the second without it. See below:\n\n> Exception Specification\
    \ in Type System. Live code @Wandbox\n\n```\nusing TnoexceptVoidFunc = void (*)()\
    \ noexcept;\nvoid SimplenoexceptCall(TnoexceptVoidFunc f) { f(); }\n\nusing TVoidFunc\
    \ = void (*)();\nvoid SimpleCall(TVoidFunc f) { f(); }\n\nvoid fnoexcept() noexcept\
    \ {}\nvoid fRegular() {}\n\nint main() {\n    SimplenoexceptCall(fnoexcept);\n\
    \    SimplenoexceptCall([]{} noexcept { });\n    // SimplenoexceptCall([]{} fRegular);\
    \ // cannot convert\n    SimplenoexceptCall([]{} {}); // cannot convert\n\n  \
    \  SimpleCall(fnoexcept); // converts to regular function\n    SimpleCall(fRegular);\n\
    \    SimpleCall([]{} noexcept { }); // converts\n    SimpleCall([]{} {});\n```"
  merge: -1
