    \n```\nauto foo = [](int x) {\n    if (x < 0)\n        return x * 1.1f; // float!\n\
    \    else\n        return x * 2.1;    // double!\n};\n```\n\nThe above code won't\
    \ compile as the first return statement returns float while the second double\
    \ decide . The compiler cannot decide, so you have to select the single type.\n\
    \nWhile deciding integers or doubles might be helpful, there are far more reasons\
