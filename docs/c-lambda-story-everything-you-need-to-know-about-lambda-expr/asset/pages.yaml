- pgno: 46
  md: "You can see above, the lambda is created and isn't assigned to any closure\
    \ object. But then it's called with () . If you run the program, you can expect\
    \ to see 2, as the output\n\nThis kind of expression might be useful when you\
    \ have a complex initialisation of a const object.\n\n```\nconst auto val = []()\
    \ {\n  /* several lines of code... */\n(); // call it!\n```\n\nAbove, val is a\
    \ constant value of a type returned by lambda expression, i.e:\n\n```\n// val1\
    \ = int\nconst auto val1 = []() { return 10; };\n\n// val2 = std::string\nconst\
    \ auto val2 = []() -> std::string { return \"ABC\"; };\n```\n\nBelow you can find\
    \ a longer example where you use IIFE as a helper lambda to create a constant\
    \ function inside:\n\nIIFE and HTML Generation. Live code @Wandbox\n\n```\n#include\
    \ <iostream>\n#include <string>\n\nvoid ValidateHTML(const std::string& link,\
    \ const std::string& text) {\n  const std::string html = [&link, text];\n  const\
    \ auto &inText = text.empty() ? link : text;\n  return \"<a href=\\\"\" + link\
    \ + \"\\\">\" + inText + \"</a>\";\n} // call!\n\nValidateHTML(html);\n\nreturn\
    \ html;\n\n}\n\nint main() {\n  try {\n    const auto ahref = BuildAHref(\"www.leanpub.com\"\
    , \"Lean Store\");\n    std::cout << ahref;\n  } catch (...) {\n    std::cout\
    \ << \"bad format...\";\n  }\n}\n```"
