- pgno: 29
  md: "MyFunctor can now work with double and int arguments. If you want a similar\
    \ behaviour for lambdas, then you can see the section about inheriting from lambdas\
    \ in this chapter and also about the overloaded pattern from the C++17 chapter.\n\
    \n# Other Modifiers\n\nWe briefly touched on this topic in the syntax section,\
    \ but you're not limited to a default declaration of the call operator for a closure\
    \ type. In C++11 you can add mutable or exception specification.\n\n> If possible\
    \ longer examples of this book try to mark the closure object with const and also\
    \ make the lambda noexcept.\n\nYou can use those keywords by specifying mutable\
    \ and noexcept after the parameter declaration clause:\n\n```\nauto myLambda =\
    \ [](int a) mutable noexcept { /* do something */ }\n```\n\nThe compiler will\
    \ expand this code into:\n\n```\nstruct _anonymousLambda {\n    inline void operator()(double\
    \ param) noexcept { /* do something */ }\n};\n```\n\nPlease notice that the const\
    \ keyword is gone now and the call operator can now change the member variables\
    \ of a lambda.\n\nBut what members? How can we declare a member variable of lambdas?\
    \ The next section about “capturing” variables:\n\n# Captures\n\nThe [] does not\
    \ only introduce the lambda but also holds a list of captured variables. It's\
    \ called “capture clause”.\n\nBy capturing a variable from outside of the lambda,\
    \ you create a member variable (a non-static data member) in the closure type.\
    \ Then, inside the lambda body, you can access it."
