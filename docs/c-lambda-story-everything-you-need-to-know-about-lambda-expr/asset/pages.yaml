  md: "# Lambda Syntax Update\n\nWith C++20, we have more changes regarding the syntax\
    \ of lambda expressions:\n\n+   - You can now add consteval after the parameter\
    \ list.\n- There's an option to specify the template tail.\n- And after the trailing\
    \ return you can put requires declaration.\n\n```\n<params> () specifiers exception\
    \ attr - -> requires { /code; /* */\n  ^       ^       ^\n  |       | |\n  | \
    \      optional: trailing return type\n  |  optional: mutable, constexpr, consteval,\
    \ noexcept, attributes\n  | parameter list (optional when no specifiers added)\n\
    \  |\noptional: template parameter list\n|\nlambda introducer with an optional\
    \ capture list\n```\n\nYou can read about new modifications in the next sections.\n\
    \n# A Quick Overview of the Changes\n\nWith C++20 we'll get the following features\
