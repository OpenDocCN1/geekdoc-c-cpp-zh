  md: "as auto template parameters.\n\nFor a lambda:\n\n```\n[(auto x) { x; }\n```\n\
    \nThe compiler generates a call operator that corresponds to the following template\
    \ method:\n\n```\ntemplate < typename T>\nvoid operator()(T x) { x; }\n```\n\n\
    But there was no way to change this template parameter and use “real” template\
    \ arguments. With C++20 it is possible now.\n\nFor example, how can we restrict\
    \ our lambda to work only with vectors of some type?\n\nWe can write a generic\
    \ lambda:\n\n```\nauto foo = [](auto & vec) {\n  std::cout << std::size(vec) <<\
    \ '\\n';\n  std::cout << vec.capacity() << '\\n';\n};\n```\n\nBut if you call\
    \ it with an int parameter (like foo(10) ) then you might get some hard-to-read\
    \ error:\n\n```\nprog.cc: In instantiation of\n'main()::<lambda(const auto:1)>\
    \ [with auto:1 = int]'\nprog.cc:16:11: required from here\nprog.cc:11:30: error:\
    \ no matching function for call to 'size(const int&)'\n11 | std::cout<<std::size(vec)\
    \ << '\\n';\n```\n\nIn C++20 we can write:\n\n```\nauto foo = []typename T>(std::vector<T>\
    \ const & vec) {\n  std::cout << std::size(vec) << '\\n';\n  std::cout << vec.capacity()\
    \ << '\\n';\n};\n```\n\nThe above lambda resolves to a templated call operator:\n\
    \n```\n< typename T>\nvoid operator() (std::vector<T> const & s) { ... }\n```"
