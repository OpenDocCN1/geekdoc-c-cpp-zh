  md: "Equipped with the knowledge we can use inheritance and the overloaded pattern\
    \ for something more practical. Have a look at an example with the visitation\
    \ of std::variant:\n\n# The Overloaded Pattern with variant and visit. Live code\
    \ @Compiler Explorer\n\n```\n#include <iostream>\n#include <variant>\n\ntemplate\
    \ <class... Ts> struct overloaded : Ts... { using Ts::operator()...; };\ntemplate\
    \ <class... Ts> overloaded(Ts...) -> overloaded<Ts...>;\n\nint main() {\n    const\
    \ auto PrintVisitor = [](const auto& t) { std::cout << t << \" \\n\"; };\n\n \
    \   std::variant<int, float, std::string> intFloatString(\"Hello\");\n\n    std::visit(PrintVisitor,\
    \ intFloatString);\n\n    std::visit(overloaded(\n        [](int& i) { *i *= 2;\
    \ },\n        [](float& f) { *f = 2.0f; },\n        [](std::string& s) { s = s\
    \ + s; }\n    ), intFloatString);\n\n    std::visit(PrintVisitor, intFloatString);\n\
    n}\n```\n\nIn the code above we create a variant class that can hold integers,\
    \ floating-point or string values. There's a call to PrintVisitor which outputs\
    \ the current value of the variant. Please notice that thanks to the generic lambda,\
    \ the visitor can support all types (which have the << operator implemented).\n\
    \nNow, we have another call to std::visit that creates a visitor in place, with\
    \ three different lambda expressions - one for each type. In this artificial example,\
    \ we want to multiply the value by two, and for strings, it means joining values\
    \ together.\n\n# Concurrent Execution Using Lambdas\n\nIt's easy to show examples\
    \ where the lambda runs on the same thread as the caller. But how about asynchronous\
    \ cases? What if you want to call a lambda on a separate thread? What problems\
    \ might you encounter? Let's review them in this section."
