  md: "In C++17 we can use static_assert with no message and also helper variable\
    \ templates\nfor type traits is_same_v:\nstatic_assert(std::is_same_v<double,\
    \ decltype(baz(10)));\n\nHowever, while you don't know the name, you can spell\
    \ out thensignature of the lambda and store it in std::function . In general,\
    \ what\ncan't be done with a lambda defined as auto can be done if the lambda\
    \ is\nusing std::function<> type. For example, the previous lambda has\nsignature\
    \ of double(int) as it takes an input parameter and\nreturns double . We can then\
    \ create a std:: function object in the following\nway:\n\n```\nstd::function\
    \ double (int) MyFunc = [](int a) -> double { return 2.0 * a };\n```\n\nstd::function\
    \ is a heavy object because it needs to handle all callable\nobjects. To do that,\
    \ it requires advanced internal mechanics like type pushing\nor dynamic memory\
    \ allocation. We can check its size in a simple\nexperiment:\n\n```\nstd::function\
    \ and auto type Deduction. Live code @Wandbox\n#include <functional>\n#include\
    \ <iostream>\n\nint main() {\n    const auto MyLambda = [](int a) noexcept ->\
    \ double {\n        return 2.0 * a;\n    };\n\n    const std::function<double\
    \ (int)> MyFunc =\n        [](int a) noexcept -> double {\n            return\
    \ 2.0 * a;\n        };\n\n    std::cout << \"sizeof(MyLambda) is \" << sizeof(MyLambda)\
    \ << '\\\\n';\n    std::cout << \"sizeof(MyFunc) is \" << sizeof(MyFunc) << '\\\
    \\n';\n\n    return MyLambda(10) == MyFunc(10);\nn\n```\n\n# On GCC the code will\
    \ print:\n\nsizeof(MyLambda) is 1\nsizeof(MyFunc) is 32"
