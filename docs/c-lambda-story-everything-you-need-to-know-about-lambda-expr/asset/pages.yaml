- pgno: 41
  md: "# Return Type\n\nIn many cases, you can skip the return type of the lambda\
    \ and then the compiler will deduce the typename for you.\n\nInitially, return\
    \ type deduction was restricted to lambdas with bodies containing a single return\
    \ statement. However, this restriction was quickly lifted as there were no issues\
    \ with implementing a more convenient version.\n\nC++ Standard Core Language Defect\
    \ Reports and Accepted Issues 5\n\nTo sum up, since C++11, the compiler will be\
    \ able to deduce the return type as long as all of your return statements are\
    \ of the same type.\n\n| If all rvalue return an expression and the types of the\
    \ return expressions after lvalue-to-rvalue conversion (7.1 [conv.val]), array-to-pointer\
    \ conversion (7.2 [conv.array]), and function-to-pointer conversion (7.3 [conv.func])\
    \ are the same, common type |\n\nReturn Type Deduction. Live code @Wandbox\n\n\
    ```\n#include <traits>\nint main () {\n    const auto baz = [[](int x) noexcept\
    \ {\n        if (x < 20)\n            return x * 1.1;\n        else\n        \
    \    return x * 2.1;\n    }];\n    static_assert(std::is_same<double, decltype(baz(10))::value,\n\
    \        \"has to be the same!\");\n}\n```\n\nIn the above lambda, we have two\
    \ return statements, but they all point to double so the compiler can deduce the\
    \ type.\n\n> In C++14 return type of lambda will be updated to adapt to the rules\
    \ of auto deduction for regular functions. See this section.\n\n# Trailing Return\
    \ Type Syntax"
  merge: -1
  img_proc: true
- pgno: 42
  md: "If you want to be explicit about the return type, you can use trailing return\
    \ type specification. For example, when you return a string literal:\nReturning\
    \ a string literal from a lambda\n\n```\n#include <iostream>\n#include <string>\n\
    \nint main() {\n    const auto testString = [][](int speed) noexcept {\n     \
    \   if (speed > 100) {\n            return \"you're a super fast\";\n        }\n\
    \        return \"you're a regular\";\n    };\n\n    auto str = testString(100);\n\
    \    str += \"driver\"; // oops! no += on const char*\n\n    std::cout << str;\n\
    \n    return 0;\n}\n```\n\nThe above code doesn't compile because the compiler\
    \ dedces const char* as the return type for the lambda. Because there's no +=\
    \ operator available on string literals, so the code breaks.\n\nWe can fix the\
    \ problem by explicitly setting the return type to std::string:\n\n```\nauto testString\
    \ = [][](int speed) -> std::string {\n    if (speed > 100) {\n        return \"\
    you're a super fast\";\n}\n    return \"you're a regular\";\n}\n```\n\n```\nauto\
    \ str = testString(100);\nstr += \"driver\"; // works fine\n```\n\nYou can play\
    \ with the code @Coliru\n\nPlease notice that we had to remove noexcept now, as\
    \ the std::string creation might throw.\n\nAs a side note, you can also use namespace\
    \ std::string_literals; and then you return \"you're a regular\"s to indicate\
    \ the std::string type.\n\n# Conversion to a Function Pointer"
  merge: -1
