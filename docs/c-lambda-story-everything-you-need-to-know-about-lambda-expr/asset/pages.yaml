    \ their sum.\n* std::minus<T>() - takes two arguments and returns their difference.\n\
    * std::less<T>() - takes two arguments and returns if the first one is\nsmaller\
    \ than the second.\n* std::greater_equal<T>() - takes two arguments and returns\
    \ if the first\nis greater or equal to the second.\n* std::bindist - creates a\
    \ callable object with the first argument fixed to"
