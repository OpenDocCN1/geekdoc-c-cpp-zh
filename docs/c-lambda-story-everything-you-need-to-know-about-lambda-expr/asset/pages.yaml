  md: "For example (sample from the spec draft):\n\n# Aggregate Initialisation\n\n\
    ```\nstruct base1 { int b1, b2 = 32 };\n\nstruct base2 {\n  base2() { b3 = 64\
    \ }\n  int b3;\n};\n\nstruct derived : base1, base2 {\n  int d;\n};\n\nderived\
