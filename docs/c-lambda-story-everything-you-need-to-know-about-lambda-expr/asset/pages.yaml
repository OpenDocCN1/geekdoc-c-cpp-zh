- pgno: 88
  md: "```\n// what is LambdaType1 and LambdaType2 ??\n```\n\nThe only way that could\
    \ work would be make function (as template argument deduction works for function\
    \ templates, since, like, always):\n\n```\ntemplate <typename ... T>\nconstexpr\
    \ auto make_overload(T& ... t) {\n    return overloaded<T...>(std::forward<T>(t)...);\n\
    }\n```\n\nWith template argument deduction rules that were added in C++17, we\
    \ can simplify the creation of common template types and the make_overloader function\
    \ is not needed.\n\nFor example, for simple types, we can write:\n\n```\nstd::pair\
    \ strDouble { std::string(\"Hello\"), 10.0 };\nn// strDouble is std::pair<std::string,\
    \ double>\n```\n\nThere's also an option to define custom deduction guides. The\
    \ Standard library uses a lot of them, for example, for std::array:\n\n```\ntemplate\
    \ <class T, class... U>\narray(T, U...) -> array<T, 1 + sizeof...(U)>;\n```\n\n\
    and the above rule allows us to write:\n\n```\narray test{1, 2, 3, 4, 5};\n//\
    \ test is std::array<int, 5>\n```\n\nFor the overloaded pattern we can specify\
    \ a custom deduction guide:\n\n```\ntemplate <class... Ts> overloaded(Ts...) ->\
    \ overloaded<Ts...>;\n```\n\nNow, when we initialise an overload with two lambdas:\n\
    \n```\noverloaded myOverload{ [](int) { }, [](double) { } };\n```\n\nThe template\
    \ arguments for overload will be correctly deduced. In our case, the compiler\
    \ knows the types of the two lambdas so it can resolve the types which the overload\
    \ inherits from."
