- pgno: 38
  md: "If you use your lambdas in the context of a single method, then capturing this\
    \ will be fine. But how about more complicated cases?\n\nDo you know what will\
    \ happen with the following code?\n\n# Returning a Lambda From a Method\n\n```\n\
    #include <functional>\n#include <iostream>\n\nstruct Baz {\n    std::function<void()>\
    \ foo() {\n        return [&] { std::cout << s << endl; };\n    }\n    std::string\
    \ s;\n};\n\n main() {\n    auto f1 = Baz(\"abc\").foo();\n    auto f2 = Baz(\"\
    xyz\").foo();\n    f1();\n    f2();\n}\n```\n\nThe code declares a Baz object\
    \ and invokes foo(). Please note that foo() returns a lambda (in std::function)\
    \ that captures a member of the class. 4\n\nSince we use temporary objects, we\
    \ cannot be sure what will happen when you call f1 and f2 . This is a dangling\
    \ reference problem and generates Undefined Behaviour.\n\nSimilarly to:\n\n```\n\
    struct Bar {\n    std::string const &() foo() const { return s; }\n    std::string\
    \ s;\n};\nauto && f1 = Bar(\"abc\").foo(); // a dangling reference\n```\n\nPlay\
    \ with code @Wordbox\n\nAgain, if you state the capture explicitly ([s]) :\n\n\
    ```\nstd::function<void()> foo() {\n    return [s] { std::cout << s << endl; };\n\
    }\n```"
