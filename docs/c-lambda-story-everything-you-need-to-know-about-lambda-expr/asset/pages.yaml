- pgno: 39
  md: "All in all, capturing this might get tricky when a lambda can outlive the object\
    \ itself. This might happen when you use async calls or multithreading.\n\nWe'll\
    \ return to that topic in the C++17 chapter. See this section\n\n# Moveable-only\
    \ Objects\n\nIf you have an object that is movable only (for example unique_ptr\
    \ ), then you cannot move it to lambda as a captured variable. Capturing by value\
    \ does not work; you can only capture by reference.\n\n```\nunique_ptr<int> p\
    \ = p(new int {10});\nauto foo = [p]() {}; // does not compile.\nauto foo_ref\
    \ = [&p]() {}; // compiles, but the ownership\n// is not passed\n```\n\nIn the\
    \ example, you can see the only way to capture unique_ptr by reference. This approach,\
    \ however, might not be the best as it doesn't transfer the ownership of the pointer.\n\
    \nIn the next chapter, about C++14], you'll see this issue is fixed to the capture\
    \ with initialiser. of this section to follow up on this topic.\n\n# Preserving\
    \ Const\n\nIf you capture a const variable, then the constness is preserved:\n\
    \n> Preserving const . Live code @Wandbox\n\n```\n#include <iostream>\n#include\
    \ <type_traits>\n\nint main() {\n    const int x = 10;\n    auto foo = [x]() mutable\
    \ {\n        std::cout << std::is_const<decltype(x)>::value << std::endl;\n  \
    \      x = 11;\n    }\n    foo();\n}\n```\n\nThe above code doesn't compile as\
    \ the captured variable is constant. The example even tried to use mutable , but\
    \ this doesn't help.\n\n# Capturing a Parameter Pack"
