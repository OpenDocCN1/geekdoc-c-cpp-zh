- pgno: 50
  md: "# GCC reports the following error:\n\nerror: request for member 'Func' is ambiguous\n\
    \nSee a demo @Wandbox\n\nBecause we commented the using statements ::Func() can\
    \ be from a scope of BaseInt or BaseDouble. The compiler has two scopes to search\
    \ the best candidate, and according to the Standard, it's not allowed.\n\nOk,\
    \ let's go back to our primary use case:\n\nSimpleOver is an elementary class,\
    \ and it's not production-ready. Have a look at the C++17 chapter where we'll\
    \ discuss an advanced version of this pattern. Thanks to several C++17 features,\
    \ we'll be able to inherit from multiple lambdas (thanks to variadic templates)\
    \ and leverage more compact syntax!\n\n# Storing Lambdas in a Container\n\nAs\
    \ the final technique in this chapter, let's have a look at the problem of storing\
    \ closures in a container.\n\nBut didn't I wrote that lambdas could not be default\
    \ created and assigned?\n\nYes... however we can do some tricks here.\n\nOne of\
    \ the techniques is to leverage the property of stateless lambdas which convert\
    \ to function pointers. While you cannot store closure objects directly, you can\
    \ save function pointers converted from lambda expressions.\n\nFor example:\n\n\
    ```\nStoring Lambdas As Function Pointers. Live code @Wandbox\n#include <iostream>\n\
    #include <vector>\n\nint main () {\n  using TFunc = void (*)(int &);\n  std::vector<TFunc>\
    \ ptrFuncVec;\n\n  ptrFuncVec.push_back([](int &x) { std::cout << x << '\\n';\
    \ });\n  ptrFuncVec.push_back([](int &x) { x *= 2; });\n  ptrFuncVec.push_back(ptrFuncVec[0]);\
    \ // print it again;\n```"
