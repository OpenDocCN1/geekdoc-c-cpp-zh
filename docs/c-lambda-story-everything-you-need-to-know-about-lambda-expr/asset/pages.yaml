- pgno: 27
  md: "Because myLambda is just a stateless lambda, it’s also an empty class, without\
    \ any data member fields, so its minimal size is only one byte. On the other hand,\
    \ the std::function version is much larger - 32 bytes. That’s why you can, rely\
    \ on the auto type deduction to get the smallest possible closure objects.\n\n\
    When we talk about std::function , it’s also important to mention that this type\
    \ doesn’t support movable-only closures. You can read more about this issue in\
    \ the C++14 chapter on movable types.\n\n# Constructors and Copying\n\nIn the\
    \ specification of the feature at [expr.prim.lambda] we can also read the following:\n\
    \n| The closure type associated with a lambda-expression has a deleted (ldcl.fct.def.delete)\
    \ default constructor and a deleted copy assignment operator. |\n\nThat’s why\
    \ you cannot write:\n\n```\nauto foo = [&x, &y]() { ++x; ++y; };\ndecltype(foo)\
    \ fooCopy;\n```\n\nThis gives the following error on GCC:\n\n```\nerror: use of\
    \ deleted function 'main()::<lambda<>()()'\ndecltype(foo) fooCopy;\n~~~\n```\n\
    \nnote: a lambda closure type has a deleted default constructor\n\nHowever, you\
    \ can copy lambdas:\n\nCopying lambdas. Live code @Wbox\n\n```\n#include <type_traits>\n\
    int main () {\n    const auto firstLam = [](int x) noexcept { return x * 2; };\n\
    \    const auto secondLam = firstLam;\n    static_assert(std::is_same<firstLam,\
    \ decltype(secondLam)>::\nvalue,\n    \"must be the same\";\n}\n```"
