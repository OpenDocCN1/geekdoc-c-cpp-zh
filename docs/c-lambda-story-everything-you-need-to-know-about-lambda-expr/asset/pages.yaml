  md: "# Capturing Global Variables\n\nIf you have a global variable and you use [=]\
    \ in your lambda, you might\nthnink that your global object is also captured by\
    \ value... but it's not. See the\ncode:\n\n> Capturing Globals. Live code @Wandbox\n\
    \n```\n#include <iostream>\n\nint global = 10;\n\nint main() {\n    std::cout\
    \ << global << std::endl;\n    auto foo = [() mutable noexcept { ++ global; };\n\
    \    foo();\n    std::cout << global << std::endl;\n    const auto increaseGlobal\
    \ = [()] noexcept { ++ global; };\n    increaseGlobal();\n    std::cout << global\
    \ << std::endl;\n    const auto moreIncreaseGlobal = [()] noexcept { ++ global;\
    \ };\n    moreIncreaseGlobal();\n    std::cout << global << std::endl;\n}\n```\n\
    \nThe above example defines global and uses it with several lambdas\nif you run\
    \ the code, no matter the way\nyou capture, it will always point to the global\
    \ object, and no local copies will\nbe created.\n\nIt's because only variables\
    \ with automatic storage duration can be captured.\nGCC can even report the following\
    \ warning:\n\n```\nwarning: capture of variable 'global' with non- automatic\n\
    storage duration\n```\n\nThis warning will appear only if you explicitly capture\
    \ a global variable, so if\nyou use [= it won't help.\n\nThe clang compiler is\
    \ even more helpful, as it generates an error :\n\n```\nerror: 'global' cannot\
    \ be captured because it does not have\namatic storage duration\n```\n\nSee clang\
    \ live example @Wandbox.\n\n# Capturing Statics"
