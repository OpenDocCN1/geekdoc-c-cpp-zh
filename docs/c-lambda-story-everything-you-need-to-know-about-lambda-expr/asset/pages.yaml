  md: "This syntax, however, will be possible with C++20, see in this section .\n\n\
    # Improvements for Existing Issues\n\nAll in all, new C++14 feature can solve\
    \ a few problems, for example with movable only types or allow some extra optimisation.\n\
    \nLet's review now.\n\n# Move\n\nPreviously, in C++11, you couldn't capture a\
    \ unique pointer by value. Only capturing by reference was possible. Now, since\
    \ C++14, we can move an object into a member of the closure type:\n\nCapturing\
    \ a movable type code @Wandbox\n\n```\n#include <iostream>\n#include <memory>\n\
    \nint main() {\n    std::unique_ptr<int> p(new int{10});\n    const auto bar =\
    \ [ptr=move(p)] {\n        std::cout << \"pointer in lambda: \" << ptr.get() <<\
    \ '\\n';\n    };\n    std::cout << \"pointer in main: \" << p.get() << '\\n';\n\
    bar();\n}\n```\n\n# The output:\n\n```\npointer in main(): 0\npointer in lambda:\
    \ 0x1413c20\n```\n\nThanks to the closure initialiser you can move the pointer\
    \ ownership into lambda. As you can see in the example the unique pointer is set\
    \ to nullptr just after the closure is created. When you call a lambda, then you'll\
    \ see a valid memory address.\n\n# One Gotcha with std::function\n\nHaving a movable-only\
    \ captured variable in a lambda makes the closure object not copyable. This might\
    \ be an issue if you want to store such a lambda in std::function which accepts\
    \ only copyable callable objects.\n\nWe can observe this in detail if we run C++Insights\
    \ on the previous example"
