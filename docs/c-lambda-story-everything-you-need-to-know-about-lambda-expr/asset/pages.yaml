  md: "# Default Parameters for Lambdas\n\nLet’s start with some smaller updates:\n\
    \nIn C++14 you can use default parameters in a function call. This is a small\
    \ feature that makes lambda more like a regular function.\n\nLambda with Default\
    \ Parameter. Live code @Wandbox\n\n```\n#include <iostream>\nint main () {\n \
    \   const auto lam = [](int x = 10 ) { std::cout << x << '\\n'; };\n    lam();\n\
    \    lam(100);\n}\n```\n\nIn the above example, we call the lambda twice. The\
    \ first time without any arguments, and then it uses a default x = 10. The second\
    \ time we use 100.\n\nWhat’s interesting is that GCC and Clang have supported\
    \ this feature since C++11.\n\n# Return Type\n\nIf you remember from the previous\
    \ chapter, the return type for a simple lambda could be deduced by the compiler.\
    \ This functionality was “extended” on regular functions and in C++14 you can\
    \ use auto as a return type:\n\n```\nauto myFunction () {\n    int x = computeX(...);\n\
    \    int y = computeY(...);\n    return x + y;\n}\n```\n\nAbove, the compiler\
    \ will deduce int as a return type.\n\nThe concept of deducing return type was\
    \ improved and extended in C++14. For lambda expressions, it means that they share\
    \ the same rules as functions with auto return type:\n\n[expr.prim.lambda#4]:\
    \ :"
