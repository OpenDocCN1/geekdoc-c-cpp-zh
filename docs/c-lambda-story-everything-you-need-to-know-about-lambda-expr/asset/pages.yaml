  md: "```\nint x = 10;\nconst auto lam = [x]() mutable { ++ x; }\nlam(); // // doesn't\
    \ compile!\n```\n\nThe last line won't compile as we cannot call a non-const member\
    \ function on a const object.\n\n# Invocation Counter - An Example of Captured\
    \ Variables\n\nBefore we move on to some more complicated topics with capturing,\
    \ we can have a little break and focus on a more practical example.\n\nLambda\
    \ expressions are handy when you want to use some existing algorithm from the\
    \ Standard Library and alter the default behaviour. For example, for std::sort\
    \ you can write your comparison function.\n\nBut we can go further and enhance\
    \ the comparator with an invocation counter. Have a look:\n\n> Invocation Counter.\
    \ Live code @Compiler Explorer\n\n```\n#include <algorithm>\n#include <iostream>\n\
    #include <vector>\n\nint main() {\n    std::vector<int> vec { 0, 5, 2, 9, 7, 6,\
    \ 1, 3, 4, 8 };\n    size_t compCounter = 0;\n    std::sort(vec.begin(), vec.end(),\n\
    \        [&compCounter](int a, int b) noexcept {\n            ++compCounter;\n\
    \            return a < b;\n        });\n\n    std::cout << \"number of comparisons:\
    \ \" << compCounter << '\\\\n';\n    for (const auto & v : vec) {\n        std::cout\
    \ << v << \", \";\n    }\n}\n0\n```\n\nThe comparator provided in the example\
    \ works in the same way as the default one, it returns if a is smaller than b,\
    \ so we use the natural order from lowest to the highest. However, the lambda\
    \ to std::sort also captures a local variable compCounter . The variable is then\
    \ used to count all the invocations of this comparator from the sorting algorithm."
