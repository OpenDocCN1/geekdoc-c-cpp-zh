  md: "Creating variables through initialiser is also flexible as you can, for example,\
    \ create a reference to variables from the outside scope.\n\nReference as Capture\
    \ With An Initialiser. Live code @Wandbox\n\n```\n#include <iostream>\nint main()\
    \ {\n    int x = 30;\n    const auto foo = [&z = x]() { std::cout << z << '\\\\\
    n'; };\n    foo();\n    x = 0;\n    foo();\n}\n```\n\nThis time the z variable\
    \ is a reference to x . It's created in the same way as you'd write:\n\nauto &\
    \ z = x;\n\nIf you run the example, you should see that the first line prints\
    \ 30, but the second line shows 0 . This is because we captured a reference so\
    \ when you modify the referenced variable, the z object will change.\n\n# Limitations\n\
    \nPlease note that you can capture with initialiser as a reference, it's not possible\
    \ to write r-value reference && That's why the code below is invalid:\n\n```\n\
    [&& z = x] // invalid syntax!\n```\n\nAnother limitation for the feature is that\
    \ it doesn't allow parameter packs. Let's have a look at the section 24 of [expr.prim.lambda]\
    \ :\n\n> A simple-capture followed by an ellipsis is a pack expansion ([temp.variadic)).\
    \ An init-capture followed by an ellipsis is ill-formed.\n\nIn other words, in\
    \ C++14, you cannot write:\n\n```\ntemplate <class... Args>\nauto captureTest(Args...\
    \ args) {\n    return lambda = [...capturedArgs] = std::move(args)(){};\n    //\
    \ ...\n```"
