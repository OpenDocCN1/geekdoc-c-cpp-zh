  md: "While the algorithms from the Standard Library are convenient, some issues\
    \ are hard to solve. One of them is passing function overloads into function templates\
    \ that takes a callable object.\n\nFor example:\n\n# Calling function overloads\n\
    \n```\n#include <algorithm>\n#include <vector>\n\n// two overloads:\nvoid foo\
    \ (int ) {}\nvoid foo (float) {}\n\nint main() {\n    const std::vector<int> vi\
    \ = {1, 2, 3, 4, 5, 6, 7, 8, 9 };\n    std::for_each(vi.begin(), vi.end(), foo);\n\
    }\n```\n\nIn the example above, we try to use two overloads for int and float\
    \ and pass it to for_each. Unfortunately, we get the following error from GCC\
    \ 9 (trunk):\n\n```\nerror: no matching function for call to\nfor_each(std::vector<int>::iterator,\
    \ std::vector<int>::iterator,\n<unresolved overloaded function type>)\nstd::for_each(vi.begin(),\
    \ vi.end(), foo);\n                       ^^^^\n```\n\nThe main issue is here\
    \ that the compiler sees foo as a template parameter, it needs to resolve the\
    \ type of it. But to do this it would have to check what types foo accepts, which\
    \ is not possible.\n\nHowever, there's a trick where we can use lambda and then\
    \ call the desired function overload.\n\nIn a basic form, for simple value types,\
    \ for our two functions, we can write the following code:\n\n```\nstd::for_each(vi.begin(),\
    \ vi.end(), [](auto x) { return foo(x); });\n```\n\nNow, we have a wrapper (a\
    \ generic lambda) which handles the overload resolution and calls the proper overload\
    \ for foo().\n\nWe can improve this by using perfect forwarding:"
