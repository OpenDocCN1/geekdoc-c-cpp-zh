- pgno: 47
  md: "The above example contains a function BuildAHref which takes two parameters\
    \ and then builds a <a></a> HTML tag. Based on the input parameters, we build\
    \ the html variable. If the text is not empty, then we use it as the internal\
    \ HTML value. Otherwise, we use the link . We want the html variable to be const\
    \ , yet it's hard to write compact code with the required conditions on the input\
    \ arguments. Thanks to IIFE we can write a separate lambda with const . Later\
    \ the variable can be passed to validateHTML.\n\n# # One Note About the Readability\n\
    \nSometimes having a lambda which is immediately invoked might cause some readability\
    \ issues.\n\nFor example:\n\n```\nconst auto EnableErrorReporting = [&]() {\n\
    \    if (HighLevelWarningEnabled())\n        return true;\n\n    if (HighLevelWarningEnabled())\n\
    \        return UsersWantReporting();\n\n};\\nif (EnableErrorReporting) {\n  \
    \  // ...\n}\n```\n\nIn the above example, the lambda code is quite complicated,\
    \ and developers who read the code to decipher not only that the lambda is invoked\
    \ immediately, but they also have to reason about the EnableErrorReporting type.\
    \ They might assume that EnableErrorReporting is the closure object and not just\
    \ a const variable. For such cases, you might consider not using auto so that\
    \ we can easily see the type. And maybe even add a comment next to the () // call\
    \ it now.\n\n> More on IIFE: You may want to read the chapter about C++17 changes\
    \ and see an upgraded version of IIFE."
