  md: "```\nint x = 10;\nfor (const auto &entry : ptrFuncVec)\nentry(x);\n}\n```\n\
    \nIn the above example, we create a vector of functions that will be applied to\
    \ the variable. There are three entries in the container:\n\n+   - The first one\
    \ prints the value of the input argument.\n- The second one modifies the value.\n\
    - The third is a copy of the first, so it also prints the value.\n\nThe solution\
    \ works, but it's limited to stateless lambdas only. What if we wanted to lift\
    \ this restriction?\n\nTo solve this issue we can reach for the heavy helper:\
    \ std::function To make the example interesting, it switched from simple integers\
    \ to lambdas that use std::string objects:\n\nStoring Lambdas As std::function.\
    \ Live code @Wandbox\n\n```\n#include <algorithm>\n#include <functional>\n#include\
    \ <iostream>\n#include <vector>\n\nint main() {\n    std::vector<std::function<std::string(const\
    \ std::string&)>> vecFilters;\n\n    size_t removedSpaceCounter = 0;\n    auto\
    \ removeSpaces = [&removedSpaceCounter](const std::string& str) {\n        std::string\
    \ tmp;\n        std::copy_if(str.begin(), str.end(), std::back_inserter(tmp),\
    \ [](char c) { return std::isspace(c); });\n        removedSpaceCounter += str.length()\
    \ - tmp.length();\n        return tmp;\n    };\n\n    auto makeUpperCase = [](const\
    \ std::string& str) {\n        std::string tmp = str;\n        std::transform(tmp.begin(),\
    \ tmp.end(), tmp.begin(), [](unsigned char c) { return std::toupper(c); });\n\
    \        return tmp;\n    };\n\n    vecFilters.emplace_back(removeSpaces);\n \
    \   vecFilters.emplace_back([](const std::string& str) {\n        return str +\
    \ \" Amazing: \";\n    });\n    vecFilters.emplace_back([](const std::string&\
    \ str) {\n        return str + \" Modern: \";\n    });\n    vecFilters.emplace_back([](const\
    \ std::string& str) {\n        return str + \" C++: \";\n    });\n}\n```"
