- pgno: 40
  md: "To close off during the capture clause, we should mention that you can also\
    \ leverage captures with variadic templates. The compiler expands the pack into\
    \ a list of non-static data members which might be handy if you want to use lambda\
    \ in a templated code. For example, here's a code sample that experiments with\
    \ the captures:\n\n# Capturing a Variadic Pack. Live code [Wandbox](Wandbox)\n\
    \n```\n#include <iostream>\n#include <tuple>\n\ntemplate <class... Args>\nvoid\
    \ captureTest(Args... args) {\n    const auto lambda = [args...];\n    const auto\
    \ tuple = std::make_tuple(args...);\n    std::cout << \"tuple size: \" << std::tuple_size<decltype(tuple)>()\
    \ << '\\\\n';\n    std::cout << \"tuple ist: \" << std::get<0>(tuple) << '\\\\\
    n';\n    lambda(); // call it\n}\n\nint main() {\n    captureTest(1, 2, 3, 4);\n\
    \    captureTest(\"Hello world\", 10.0f);\n}\n```\n\nAfter running the code, we'll\
    \ get the following output:\n\ntuple size: 4\ntuple ist: 1\ntuple size: 2\ntuple\
    \ ist: Hello world\n\nThis somewhat experimental code shows that you can capture\
    \ a variadic parameter pack (by reference is also possible) and then the pack\
    \ is “stored” into a tuple object. We then call helper functions to access its\
    \ data and properties.\n\nYou can also use CInsights to see how the compiler generates\
    \ the code and extends templates, parameter packs and lambdas in code. See the\
    \ example here [C++Insight](@C++Insight).\n\n> See the [C++14 chapter](C++14 chapter)\
    \ where it's possible to capture movable only type and also in the [C++20 chapter](C++20\
    \ chapter) for improvements on variadic parameter pack."
