    \ 5, 2, 9, 7, 6, 1, 3, 4, 8};\n    size_t compCounter = 0;\n    std::sort(vec.begin(),\
    \ vec.end(), [&compCounter](int a, int b) noexcept {\n        ++compCounter;\n\
    \        return a < b;\n    });\n\n    std::cout << \"number of comparisons: \"\
    \ << compCounter << '\\n';\n    for (const auto & v : vec) {\n        std::cout\
    \ << v << \",\";\n    }\n}\n```\n\nAs you can see, we can capture a local variable\
    \ and then use it across all invocations of the binary comparator. Such behaviour\
    \ is not possible with regular functions, but it's not straightforward with custom\
    \ functions types. Lambdas make it very natural and also very convenient to use.\n\
    \n## 4. Lambdas Allow Several Overloads in the Same Place\n\nThis is one of the\
    \ coolest examples not just related to lambdas, but also to several major Modern\
    \ C++ features (primarily available in C++17). We learned about this technique\
    \ in the C++17 chapter, where we discussed the ability to inherit from several\
    \ lambdas.\n\nHave a look:\n\n```cpp\n// The overloaded pattern. Line @Compiler\
    \ Explorer\n#include <iostream>\n#include <string>\n#include <variant>\n\ntemplate\
    \ <class... Ts> struct overload : Ts... { using Ts::operator()...; };\ntemplate\
    \ <class... Ts> overload(Ts...) -> overload<Ts...>;\n\nint main() {\n    std::variant<int,\
    \ float, std::string> intFloatString(\"Hello\");\n    std::visit(overload(\n \
    \       [](const int & i) { std::cout << \"int: \" << i; },\n        [](const\
    \ float & f) { std::cout << \"float: \" << f; },\n        [](const std::string\
    \ & s) { std::cout << \"string: \" << s; }\n    ), intFloatString);\n}\n```\n\n\
    The above example is a handy approach to building a callable object with all possible\
    \ overloads for variant types on the fly. The overloaded pattern is conceptually\
    \ equivalent to the following structure:\n\n### The Visitor Structure\n\n```cpp\n\
    struct PrintVisitor {\n    void operator()(const int & i) const { std::cout <<\
    \ \"int: \" << i; }\n    void operator()(float & f) const { std::cout << \"float:\
    \ \" << f; }\n    void operator()(const std::string& s) const { std::cout << \"\
    str: \" << s; }\n};\n```\n\nAdditionally, it's also possible to write a compact\
    \ generic lambda for all types from a variant object. This can support runtime\
    \ polymorphism based on std::variant.\n\nRuntime Polymorphism Based on std::variant/std::visit.\
    \ Live code @Compiler Explorer\n```cpp\n#include <variant>\n\nstruct Circle {\
    \ void Draw() const { }; };\nstruct Square { void Draw() const { }; };\nstruct\
    \ Triangle { void Draw() const { }; };\n\nint main() {\n  std::variant<Circle,\
    \ Square, Triangle> shape;\n  shape = Triangle();\n  const auto callDraw = [](auto\
    \ & sh) { sh.Draw(); };\n  std::visit(callDraw, shape);\n}\n```\n\nThis technique\
    \ is an alternative to runtime polymorphism based on virtual functions. Here we\
    \ can work with unrelated types. There's no need for a common base class. You\
    \ can read about this approach in my blog article: Runtime Polymorphism with std::variant\
    \ and std::visit.\n\n## 5. Lambdas Get Better with Each Revision of C++\n\nHere's\
    \ the list of major features related to lambdas that we got with C++ Standards\
    \ after the initial release with C++11:\n\n### C++14\n\n### C++17\n\n- constexpr\
    \ lambdas - in C++17 your lambdas can work in a constexpr context.\n- Capturing\
    \ this improvements - Before C++17 this pointer was captured only as a pointer\
    \ which might lead to dangling issues. In C++17 you can capture a copy of the\
    \ object represented by *this.\n- Fold Expressions\n\n### C++20\n\n- Template\
    \ lambdas - in C++20 you can use template parameters directly in lambdas.\n- Concepts\
    \ - You can use concepts to constrain lambda parameters.\n"
  mdcn: "\n\n## 2. Lambda 提升了代码的局部性\n\n在 C++98/03 中，你必须创建函数或仿函数，而它们可能与你将其作为可调用对象传递的地方离得很远。\n\
    \n在简单的人工示例中很难体现这一点，但你可以想象一个超过千行代码的大源文件。代码的组织可能导致仿函数位于文件的某个位置（例如顶部），而对该仿函数的使用可能在代码的几百行之后或之前。因此，如果你想查看某个仿函数的定义，就必须跳转到文件中完全不同的地方。这种频繁跳转可能会降低你的工作效率。\n\
    \n![](img/7cb35845bb98e3b897191af3bab607e2_118_0.png)\n\n我们还应该为第一点和第二点增加更多内容。Lambda\
    \ 提升了局部性和可读性，但同时也具有**命名方面的的优势**。由于 Lambda 是匿名的，你不需要为所有微型函数或仿函数选择一个有意义的名字。\n\n\
    ## 3. Lambda 允许方便地存储状态\n\n在 C++11 中，我们涵盖了一个修改 `std::sort` 默认比较器的简单示例，以便我们计算调用的次数。\n\
    \n> 捕获状态。实时代码 @Compiler Explorer\n\n```cpp\n#include <algorithm>\n#include <iostream>\n\
    #include <vector>\n\nint main () {\n    std::vector< int> vec {0, 5, 2, 9, 7,\
    \ 6, 1, 3, 4, 8};\n    size_t compCounter = 0;\n    std::sort(vec.begin(), vec.end(),\
    \ [&compCounter](int a, int b) noexcept {\n        ++compCounter;\n        return\
    \ a < b;\n    });\n\n    std::cout << \"number of comparisons: \" << compCounter\
    \ << '\\n';\n    for (const auto & v : vec) {\n        std::cout << v << \",\"\
    ;\n    }\n}\n```\n\n如你所见，我们可以捕获局部变量并在二元比较器的所有调用中使用它。这种行为在普通函数中是不可能的，但对于自定义函数类型来说实现并不直观。Lambda\
    \ 让这一切变得非常自然且方便。\n\n## 4. Lambda 允许在同一处编写多个重载\n\n这不仅与 Lambda 有关，还涉及到多个主要的现代 C++\
    \ 特性（主要在 C++17 中可用）的最酷示例之一。我们在 C++17 章节中学习了这种技术，当时我们讨论了继承多个 Lambda 的能力。请看：\n\n\
    ```cpp\n// The overloaded pattern. Line @Compiler Explorer\n#include <iostream>\n\
    #include <string>\n#include <variant>\n\ntemplate <class... Ts> struct overload\
    \ : Ts... { using Ts::operator()...; };\ntemplate <class... Ts> overload(Ts...)\
    \ -> overload<Ts...>;\n\nint main() {\n    std::variant<int, float, std::string>\
    \ intFloatString(\"Hello\");\n    std::visit(overload(\n        [](const int &\
    \ i) { std::cout << \"int: \" << i; },\n        [](const float & f) { std::cout\
    \ << \"float: \" << f; },\n        [](const std::string & s) { std::cout << \"\
    string: \" << s; }\n    ), intFloatString);\n}\n```\n\n这不仅是与 Lambda 有关，还涉及到多个主要的现代\
    \ C++ 特性（主要在 C++17 中可用）的最酷示例之一。我们在 C++17 章节中学习了这种技术，当时我们讨论了继承多个 Lambda 的能力。\n\n\
    上面的示例是动态构建具有所有可能重载的可调用对象的有用方法。这种重载模式在概念上等同于以下结构：\n\n### 访问者结构\n\n```cpp\nstruct\
    \ PrintVisitor {\n    void operator()(const int & i) const { std::cout << \"int:\
    \ \" << i; }\n    void operator()(float & f) const { std::cout << \"float: \"\
    \ << f; }\n    void operator()(const std::string& s) const { std::cout << \"str:\
    \ \" << s; }\n};\n```\n\n此外，还可以为 variant 类型编写一个的泛型 Lambda。这支持基于 `std::variant`\
    \ 的运行时多态。\n\n基于 std::variant/std::visit 的运行时多态。实时代码 @Compiler Explorer\n```cpp\n\
    #include <variant>\n\nstruct Circle { void Draw() const { }; };\nstruct Square\
