  - "[PAGE 24]\n\nlike constexpr or constval in C++17 and C++20.\n\n# Attributes\n\
    \nThe syntax for lambdas also allows using attributes introduced in the form of\
    \ [[attr_name]]. However, if you apply an attribute to a lambda, then it applies\
    \ to the type of the call operator and not to the operator itself. That's why\
    \ currently (and even in C++20) there are no attributes that make sense to put\
    \ on a lambda. Most compilers report an error. If we take a C++17 attribute and\
    \ try to use it with the expression:\n\n```\nauto myLambda = [](int a) [[nodiscard]]\
    \ { return a * a; };\n```\n\nGenerates the following errors on Clang (see code\
    \ @Sandbox):\n\nerror: 'nodiscard' attribute cannot be applied to types\n\n# Compiler\
    \ Expansion\n\nAs a summary, here's a basic example that shows how to write a\
    \ lambda expression and pass it to std::for_each. For comparison, the code also\
    \ illustrates the corresponding functor type:\n\nFirst Lambda and a Corresponding\
    \ Functor. Live code @Wandbox\n\n```\n#include <algorithm>\n#include <iostream>\n\
    #include <vector>\n\nint main() {\n  struct {\n    void operator()(int x) const\
    \ {\n      std::cout << x << '\\n';\n    } someInstance;\n\n  const vector<int>\
    \ v = { 1, 2, 3 };\n  std::for_each(v.begin(), v.end(), someInstance());\n  std::for_each(v.begin(),\
    \ v.end(), [] (int x) {\n    std::cout << x << '\\n';\n  });\n\\}\n```\n\nIn the\
    \ example, the compiler transforms...\n\n```\n[](int x) { std::cout << x << '\\\
    n'; }\n```\n\n...into an anonymous functor that in a simplified form can look\
    \ as follows:"
  - "[PAGE 25]\n\n```\nstruct {\n  void operator()(int x) const {\n    std::cout <<\
    \ x << '\\\\n';\n  }\n} someInstance;\n```\n\nThe process of translation or \"\
    expansion\" can be easily viewed on C++ Insights an online tool that takes valid\
    \ C++ code and produces a source code version that the compiler generates: like\
    \ anonymous functors for lambdas, template instantiation and many other C++ features.\n\
    \nIn the next sections we'll dive more into the individual parts of the lambda\
    \ expression.\n\n# The Type of a Lambda Expression\n\nSince the compiler generates\
    \ a unique name for each lambda (the closure type), there's no way to \"spell\"\
    \ it upfront.\n\nThat's why you have to use auto (or decltype )) to deduce the\
    \ type.\n\n```\nauto myLambda = [](int a) -> double * a;\n```\n\nWhat's more,\
    \ if you have two lambdas that look the same:\n\n```\nauto firstLam = [](int x)\
    \ { return x * 2; }\nauto secondLam = [](int x) { return x * 2; };\n```\n\nTheir\
    \ types are different even if the \"code-behind\" is the same! The compiler is\
    \ required to declare two unnamed types for each lambda.\n\nWe can prove this\
    \ property with the following code:\n\n```\n#include <type_traits>\nifferent Types,\
    \ Same Code. Live code @Wandbox\n```\n\n```\nint main() {\n  const auto oneLam\
    \ = [](int x) noexcept { return x * 2; }\n  const auto twoLam = [](int x) noexcept\
    \ { return x * 2; }\n  static_assert(std::is_same<decltype(oneLam), decltype(twoLam)>::value,\
    \ \"must be different!\");\n}\n```\n\nThe example above verifies the closure types\
    \ for oneLam and twoLam are not the same."
