  - '[PAGE 99]


    We can fix the synchronisation problem by having a mutex and locking it before
    each call of push_back . But is that code still efficient? If the filter condition
    is straightforward and fast to execute, then you might even get slower performance
    than the serial version (seq ).


    Not to mention that by running it in parallel, you don’t know the order of the
    copied elements in the output vector.


    This section shows only a basic overview of the parallel algorithms, and if you
    like to see more, please have a look at the following article: Bartek’s coding
    blog: The Amazing Performance of C++17 Parallel Algorithms, is it Possible?


    # Lambdas And Async - Wrap Upon


    To wrap up: Lambda expressions are convenient when you want to start a thread,
    invoke asynchronous code through std::async or use with parallel algorithms. However,
    it’s essential to keep in mind that closure objects aren’t unique regarding the
    concurrency and all challenges apply here as well.


    # Summary


    In this chapter, you’ve seen that C++17 joined two essential elements of C++:
    constexpr with lambdas. This is a necessary step towards improved metaprogramming
    support in the language. We’ll see that more in the next chapter about C++20.
    What’s more, the C++17 Standard also addressed the capturing this problem. In
    the new standard, you can capture this by value so that the code can be much safer.


    We also had a look at some use cases for lambdas: IIFE technique, fold expressions
    and variadic generic lambdas, deriving from lambda expressions and asynchronous
    code execution. Thanks to the various features enabled in C++17, we now have much
    nicer syntax and more straightforward ways to write efficient code.'
