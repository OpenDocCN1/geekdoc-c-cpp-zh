    \n首先，我们有一些澄清和改进：例如对 `this` 的捕获、捕获结构化绑定，以及能够默认构造无状态 lambda 的能力。此外，还有更重要的新增！现在一个显著的特性是模板\
    \ lambda 和概念（concepts）——这让你对泛型 lambda 拥有更多的控制权。\n\n总之，有了 C++20 及其所有特性，lambda 变得更加强大的工具！\n\
