  - "[PAGE 118]\n\n# 2. Lambdas Improve Locality of the Code\n\nIn C++98/03, you had\
    \ to create functions or functors that could be far away from the place where\
    \ you passed them as callable objects.\n\nThis is hard to show on simple artificial\
    \ examples, but you can imagine a large source file, with more than a thousand\
    \ lines of code. The code organisation might cause functors to be located in one\
    \ place of a file (for example on top). Then the use of a functor could be hundreds\
    \ of lines further or earlier in the code, so if you wanted to see the definition\
    \ of a functor you had to navigate to a completely different place in the file.\
    \ Such jumping might slow your productivity.\n\n![](img/7cb35845bb98e3b897191af3bab607e2_118_0.png)\n\
    \nWe should also add more topic to the first and the second point. Lambdas improve\
    \ locality, readability, but there's also **the naming part** . Since lambdas\
    \ are anonymous, there's no need for you to select the meaningful name for all\
    \ of small functions or functors.\n\n# 3. Lambdas Allow Storing State Easily\n\
    \nIn the C++11, we covered a simple example of modifying the default comparator\
    \ for std::sort that we could count the number of invocations.\n\n> Capturing\
    \ state. Live code @Compiler Explorer\n\n```\n#include <algorithm>\n#include <iostream>\n\
    #include <vector>\n\nint main () {\n    std::vector< int> vec {0, 5, 2, 9, 7,\
    \ 6, 1, 3, 4, 8};\n    size_t compCounter = 0;\n    std::sort(vec.begin(), vec.end(),\
    \ [&compCounter](int a, int b) noexcept {\n        ++compCounter;\n        return\
    \ a < b;\n    });\n```"
  - "[PAGE 119]\n\n```\n}};\nstd::cout << \"number of comparisons: \" << compCounter\
    \ << '\\\\n';\nfor (const auto & v : vec) {\nstd::cout << v << \",\";\n}\n```\n\
    \nAs you can see, we can capture a local variable and then use it across all invocations\
    \ of the binary comparator. Such behaviour is not possible with regular functions\
    \ 15, but it's not straightforward with custom functions types. Lambdas make it\
    \ very natural and also very convenient to use.\n\n# 4. Lambdas Allow Several\
    \ Overloads in the Same Place\n\nThis is one of the coolest examples not just\
    \ related to lambdas, but also to several major Modern C++ features (primarily\
    \ available in C++17). We learned about this technique in the C++17 chapter, where\
    \ we discussed the ability to inherit from several lambdas.\n\nHave a look:\n\n\
    ```\nThe overloaded pattern. Line @Compiler Explorer\n\n#include <iostream>\n\
    #include <string>\n#include <variant>\n\ntemplate <class...> struct overload :\
    \ Ts... { using Ts::operator ()...; };\ntemplate <class...> Ts:: overload(Ts...)\
    \ -> overload<Ts...>;\n\nint main() {\nstd::variant<int, float, std::string> intFloatString(\"\
    Hello\");\nstd::visit(overload(\n    [](const int & i) { std::cout << \"int: \"\
    \ << i; },\n    [](const float & f) { std::cout << \"float: \" << f; },\n    [](const\
    \ std::string & s) { std::cout << \"string: \" << s; }\n), intFloatString);\n\
    }\n);\n```\n\nThe above example is a handy approach to building a callable object\
    \ with all possible overloads for variant types on the fly. The overloaded pattern\
    \ is conceptually equivalent to the following structure:\n\n# The Visitor Structure\n\
    \n```\nstruct PrintVisitor {\n    void operator()(const int & i) const { std::cout\
    \ << \"int: \" << i; }\n```"
