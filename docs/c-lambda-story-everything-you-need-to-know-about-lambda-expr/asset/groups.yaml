    - The limitations of functors and function pointers.\n- Why functional helpers\
    \ weren't good enough.\n- The motivation for the new feature for C++0x/C++11.\n\
    \n## Callable Objects in C++98/03\n\nOne of the fundamental ideas of the Standard\
    \ Library is that algorithms like std::sort, std::for_each, std::transform and\
    \ many others, can take any callable object and call it on elements of the input\
    \ container. However, in C++98/03, we can only use function pointers or functors.\n\
    \nIn C++98/03, a functor is a class that overloads the `operator()`. For example:\n\
    \n```cpp\n#include <algorithm>\n#include <iostream>\n#include <vector>\n\nstruct\
    \ Count {\n    mutable int count;\n    void operator()(int) const {\n        count++;\n\
    \    }\n};\n\nint main() {\n    std::vector<int> v = {1, 2, 3, 4, 5};\n    Count\
    \ c;\n    std::for_each(v.begin(), v.end(), c);\n    std::cout << \"Count: \"\
    \ << c.count << std::endl;\n    return 0;\n}\n```\n\nThe example above uses a\
    \ functor to count the number of elements. Since the `operator()` is a const member\
    \ function, I had to use a mutable variable.\n\nWe can also use a temporary functor\
    \ without naming it. For example:\n\n```cpp\n#include <algorithm>\n#include <iostream>\n\
    #include <vector>\n\nint main() {\n    std::vector<int> v = {1, 2, 3, 4, 5};\n\
    \    std::for_each(v.begin(), v.end(), [](int x) {\n        std::cout << x <<\
    \ \"\\n\";\n    });\n    return 0;\n}\n```\n\nWait, the example above uses a lambda\
    \ expression, which was introduced in C++11. In C++98/03, we would have to write:\n\
    \n```cpp\n#include <algorithm>\n#include <iostream>\n#include <vector>\n\nstruct\
    \ Print {\n    void operator()(int x) const {\n        std::cout << x << \"\\\
    n\";\n    }\n};\n\nint main() {\n    std::vector<int> v = {1, 2, 3, 4, 5};\n \
    \   std::for_each(v.begin(), v.end(), Print());\n    return 0;\n}\n```\n\nThe\
    \ problem with this approach is that we have to define a new class for every functor\
    \ we want to use. This is very verbose and can clutter the code. Lambdas were\
    \ introduced in C++11 to solve this problem. They allow us to define functors\
    \ in-place.\n\n```cpp\n#include <algorithm>\n#include <iostream>\n#include <vector>\n\
    \nint main() {\n    std::vector<int> v = {1, 2, 3, 4, 5};\n    std::for_each(v.begin(),\
    \ v.end(), [](int x) {\n        std::cout << x << \"\\n\";\n    });\n    return\
    \ 0;\n}\n```\n\nLambdas can also capture variables from the surrounding scope.\
    \ For example:\n\n```cpp\n#include <algorithm>\n#include <iostream>\n#include\
    \ <vector>\n\nint main() {\n    std::vector<int> v = {1, 2, 3, 4, 5};\n    int\
    \ threshold = 10;\n    std::for_each(v.begin(), v.end(), [threshold](int x) {\n\
    \        if (x < threshold) {\n            std::cout << x << \"\\n\";\n      \
    \  }\n    });\n    return 0;\n}\n```\n\nThe `[threshold]` captures the variable\
    \ by value, while `[&]` captures all variables by reference. We can also capture\
    \ specific variables by reference. In C++17, we have even more powerful capture\
    \ features, such as init-capture.\n\n```cpp\n#include <algorithm>\n#include <iostream>\n\
    #include <vector>\n\nint main() {\n    std::vector<int> v = {1, 2, 3, 4, 5};\n\
    \    int sum = 0;\n    std::for_each(v.begin(), v.end(), [&sum](int x) {\n   \
    \     sum += x;\n    });\n    std::cout << \"Sum: \" << sum << std::endl;\n  \
    \  return 0;\n}\n```\n"
