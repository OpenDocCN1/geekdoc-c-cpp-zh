    # 5. Lambdas in C++20


    During the meeting in Prague, in February 2020, the ISO Committee finally approved
    the C++20 Standard and pushed it to the official publication (probably at the
    end of 2020). The new specification brings a lot of substantial improvements to
    the language and the Standard Library! Lambda expressions also got a few upgrades.


    In this chapter, you''ll see:


    +   * What changes in C++20.

    * New options to capture this pointer.

    * Template lambdas.

    * How to improve generic lambdas with concepts.

    * How to use lambdas with constexpr algorithms.

    * How to make the overloaded pattern even shorter.


    You can see the specification related to lambdas in N4861 (the current C++20 draft,
    post Prague version) and the lambda section: [expr.prim.lambda].'
