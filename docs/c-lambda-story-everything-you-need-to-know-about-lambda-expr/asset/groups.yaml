    \n但我不是写过 lambda 无法默认创建和赋值吗？\n\n是的……不过我们这里可以采取一些技巧。\n\n技巧之一是利用无状态 lambda（stateless\
    \ lambdas）的属性，它可以转换为函数指针。虽然你不能直接存储闭包对象，但你可以保存从 lambda 表达式转换而来的函数指针。\n\n例如：\n\n\
    将 Lambda 存储为函数指针。Wandbox 实时代码\n#include <iostream>\n#include <vector>\n\nint main\
    \ () {\n  using TFunc = void (*)(int &);\n  std::vector<TFunc> ptrFuncVec;\n\n\
