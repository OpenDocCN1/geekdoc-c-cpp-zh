    \ LambdaType2> myOverload { ... } // ???\n// what is LambdaType1 and LambdaType2\
    \ ??\n```\n\nThe only way that could work would be to make function (as template\
    \ argument deduction works for function templates, since, like, always):\n\n```cpp\n\
    template <typename ... T>\nconstexpr auto make_overload(T& ... t) {\n    return\
    \ overloaded<T...>(std::forward<T>(t)...);\n}\n```\n\nWith template argument deduction\
    \ rules that were added in C++17, we can simplify the creation of common template\
    \ types and the make_overloader function is not needed.\n\nFor example, for simple\
    \ types, we can write:\n\n```cpp\nstd::pair strDouble { std::string(\"Hello\"\
    ), 10.0 };\n// strDouble is std::pair<std::string, double>\n```\n\nThere's also\
    \ an option to define custom deduction guides. The Standard library uses a lot\
    \ of them, for example, for std::array:\n\n```cpp\ntemplate <class T, class...\
    \ U>\narray(T, U...) -> array<T, 1 + sizeof...(U)>;\n```\n\nand the above rule\
    \ allows us to write:\n\n```cpp\narray test{1, 2, 3, 4, 5};\n// test is std::array<int,\
    \ 5>\n```\n\nFor the overloaded pattern we can specify a custom deduction guide:\n\
    \n```cpp\ntemplate <class... Ts> overloaded(Ts...) -> overloaded<Ts...>;\n```\n\
    \nNow, when we initialize an overload with two lambdas:\n\n```cpp\noverloaded\
    \ myOverload{ [](int) { }, [](double) { } };\n```\n\nThe template arguments for\
    \ overload will be correctly deduced. In our case, the compiler knows the types\
    \ of the two lambdas so it can resolve the types which the overload inherits from.\n\
    \nCheck out the C++20 chapter as in the new Standard, the Class Template Argument\
    \ Deduction is improved! For the overloaded pattern, it means we don't have to\
    \ have custom deduction guides!\n\nLet's go to the last missing part of the puzzle\
    \ - aggregate initialization.\n\n## Extension to Aggregate Initialisation\n\n\
    This functionality is relatively straightforward: we can now aggregate initialize\
    \ a type that derives from other types. From the specification dcl.init.aggr :\n\
    \n> An aggregate is an array or a class with:\n- no user-provided, explicit, or\
    \ inherited non-static constructors\n- no private or protected non-static data\
    \ members\n- no virtual functions, and\n- no virtual, private, or protected base\
    \ classes\n\nFor example (sample from the spec draft):\n\n```cpp\nstruct base1\
    \ { int b1, b2 = 32 };\n\nstruct base2 {\n  base2() { b3 = 64 }\n  int b3;\n};\n\
    \nstruct derived : base1, base2 {\n  int d;\n};\n\nderived d1{{1, 2 }, {}, 4 };\n\
    derived d2{{{}, {}, 4 }};\n```\n\nThe code initializes d1.b1 with 1, d1.b2 with\
    \ 2, d1.b3 with 64, d1.d with 4. And for the second object we have: d2.b1 with\
    \ 0, d2.b2 with 32, d2.b3 with 64, d2.d with 4.\n\nIn our case, it has a more\
    \ significant impact. Because for the overload class, without the aggregate initialization,\
    \ we'd had to implement the following constructor:\n\n```cpp\nstruct overloaded\
    \ : Fs {\n  template < class ... Ts>\n  overloaded(Ts&& && ...ts) : Fs(std::forward<Ts>(ts)...)\n\
