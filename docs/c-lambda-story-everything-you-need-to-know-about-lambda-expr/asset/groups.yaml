    \n```cpp\nauto lam = ['* this]() { std::cout << s; };\n```\n\n这段代码在 C++11/14 中无法编译；但在\
    \ C++17 中是允许的。\n\n如果你在单方法的上下文中使用你的 lambda，那么捕获 `this` 是没问题的。但更复杂的情况呢？\n\n你知道以下代码会发生什么吗？\n\
    \n## 从方法返回 Lambda\n\n```cpp\n#include <functional>\n#include <iostream>\n\nstruct\
    \ Baz {\n    std::function<void()> foo() {\n        return [&] { std::cout <<\
    \ s << std::endl; };\n    }\n    std::string s;\n};\n\nint main() {\n    auto\
    \ f1 = Baz(\"abc\").foo();\n    auto f2 = Baz(\"xyz\").foo();\n    f1();\n   \
    \ f2();\n}\n```\n\n该代码声明了一个 Baz 对象并调用了 `foo()`。请注意，`foo()` 返回了一个（在 `std::function`\
    \ 中）捕获类成员的 lambda。\n\n由于我们使用了临时对象，我们无法确定调用 `f1` 和 `f2` 时会发生什么。这是一个悬空引用问题，会导致未定义行为。\n\
    \n类似于：\n\n```cpp\nstruct Bar {\n    std::string const &() foo() const { return\
    \ s; }\n    std::string s;\n};\nauto && f1 = Bar(\"abc\").foo(); // 一个悬空引用\n```\n\
    \n玩玩代码 @Wordbox\n\n再次，如果你显式说明捕获（`[s]`）：\n\n```cpp\nstd::function<void()> foo()\
    \ {\n    return [s] { std::cout << s << std::endl; };\n}\n```\n\n总而言之，当 lambda\
    \ 的生命周期可能超过对象本身时，捕获 `this` 可能会变得棘手。这在使用异步调用或多线程时可能会发生。\n\n我们会在 C++17 章节回到这个主题。参见此节\n\
    \n## 仅可移动的对象\n\n如果你有一个仅可移动的对象（例如 `unique_ptr`），那么你无法将其作为捕获变量移动到 lambda 中。按值捕获是不起的；你只能按引用捕获。\n\
    \n```cpp\nstd::unique_ptr<int> p = std::make_unique<int>(10);\nauto foo = [p]()\
    \ {}; // 无法编译。\nauto foo_ref = [&p]() {}; // 可以编译，但所有权\n// 没有传递\n```\n\n在示例中，你可以看到通过引用捕获\
    \ `unique_ptr` 的唯一方法。然而，这种方法可能不是最好的，因为它没有指针的所有权。\n\n在下一个关于 C++14 的章节中，你将看到这个问题通过捕获得到了解决。\n\
    \n## 保持 const\n\n如果你捕获了一个 `const` 变量，那么它的 const 性会被保持：保持 const。实时代码 @Wandbox\n\
    \n```cpp\n#include <iostream>\n#include <traits>\n\nint main() {\n    const int\
    \ x = 10;\n    auto foo = [x]() mutable {\n        std::cout << x << std::endl;\n\
    \    };\n    foo();\n}\n```\n\n上面的代码在 lambda 包含多个返回语句时是无法编译的。保持 const。\n\n## 捕获参数包\n\
    \n如果你在单方法中使用你的 lambda，那么捕获 `this` 是没问题的。例如：捕获参数包。实时代码 @Wandbox\n\n```cpp\n#include\
    \ <iostream>\n#include <tuple>\n\ntemplate <class Args>\nvoid captureTest(Args...\
    \ args) {\n    auto lambda = [args...]() {\n        (std::cout << ... << args)\
    \ << std::endl;\n    };\n    lambda();\n}\n\nint main() {\n    captureTest(1,\
    \ 2, 3);\n}\n```\n\n运行上述代码，你会得到：\n\n```\n1 2 3\n```\n\n## 返回类型\n\n如果你想显式指定返回类型，可以使用尾随类型。例如，当你返回字符串字面量时：从\
    \ lambda 返回字符串字面量\n\n```cpp\n#include <iostream>\n#include <string>\n\nint main()\
    \ {\n    const auto testString = [](int speed) noexcept {\n        if (speed >\
    \ 100) {\n            return \"you're a super fast\";\n        }\n        return\
    \ \"you're a regular\";\n    };\n\n    auto str = testString(100);\n    str +=\
    \ \"driver\"; // 哦！const char* 没有 +=\n\n    std::cout << str;\n\n    return 0;\n\
    }\n```\n\n上面的代码无法编译，因为编译器推导出 lambda 的返回值为 `const char*`。由于字符串字面量没有 `+=` 运算符，代码崩溃了。\n\
    \n我们可以通过显式将返回类型设置为 `std::string` 来解决这个问题：\n\n```cpp\nauto testString = [](int\
    \ speed) -> std::string {\n    if (speed > 100) {\n        return \"you're a super\
    \ fast\";\n    }\n    return \"you're a regular\";\n};\n```\n\n```cpp\nauto str\
    \ = testString(100);\nstr += \"driver\"; // 正常工作\n```\n\n你可以玩玩这段代码 @Coliru\n\n\
    请注意我们现在必须移除 `noexcept`，因为 `std::string` 的创建可能会抛出异常。\n\n作为顺带，你还可以使用命名空间 `std::string_literals;`，然后你可以返回\
    \ `\"you're a regular\"s 来指示 `std::string` 类型。\n\n"
