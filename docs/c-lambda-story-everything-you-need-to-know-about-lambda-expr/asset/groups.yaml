    # Replacing std::bind1st and std::bind2nd with Lambdas


    In the chapter about C++98/03, I mentioned and showed a few code samples with
    functional helpers like std::bind1st and std::bind2nd . However, since C++11 the
    functionality becomes deprecated, and in C++17, the functions were removed.


    Functions like bind1() /bind2nd() /mem_fun(), ... were introduced in the C++98-era
    and are not needed now as you can apply a lambda or use modern alternatives. What''s
    more, the routines we needed updated to handle perfect forwarding, variadic templates,
    decltype and other techniques from C++11. Thus it''s not best way to use them
    in modern code.


    Here''s the list of deprecated functionality:


    +   - unary_function() /pointer_to_unary_function()

    - binary_function() /pointer_to_binary_function()

    - bind1st() /binder1st

    - bind2nd() /binder2nd

    - ptr_fun()

    - mem_fun()

    - mem_fun_ref()


    To replace bind1st /bind2nd you can use lambdas or std::bind (available since
    C++11) or std::bind_front (since C++20).


    Let''s consider the following code which uses the old functionality:


    ```

    const auto onePlus = std::bind1st(std::plus<int>(), 1 );

    const auto minusOne = std::bind2nd(std::minus<int>(), 1 );

    std::cout << onePlus(10) << " * "" << minusOne(10) << "\n";

    ```


    In the preceding example, object is a callable object composed of std::plus with
    the first argument fixed. In other words when you write'
