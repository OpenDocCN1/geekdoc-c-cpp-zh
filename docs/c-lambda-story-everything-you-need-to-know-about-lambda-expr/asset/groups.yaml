    \ vec.end(), 0);\n    std::vector<int> output;\n    std::for_each(std::execution::par,\
    \ vec.begin(), vec.end(),\n        [&](int &elem) {\n            if (elem % 2\
    \ == 0) {\n                output.push_back(elem);\n            }\n        });\n\
    \n    for (const auto & elem) cout << elem << \", \";\n}\n}\n```\n\n> The code\
