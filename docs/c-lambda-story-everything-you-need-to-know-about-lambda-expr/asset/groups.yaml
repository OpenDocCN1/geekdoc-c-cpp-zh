  mdcn: "\n我们可以通过使用互斥锁并在每次调用 `push_back` 之前对其加锁来解决同步问题。但这种代码仍然高效吗？如果过滤条件非常简单且执行速度快，那么你的性能可能比串行版本\
    \ (seq) 还要慢。\n\n更不用说，通过并行运行它，你无法确定输出向量中被复制元素的顺序。\n\n本节仅展示了并行算法的基本概览，如果你想了解更多内容，请参阅以下文章：Bartek\
    \ 的编程博客：C++17 并行算法的惊人性能，可能吗？\n\n## Lambda 与 Async - 封装（Wrap Upon）\n\n总结一下：当你想启动线程、通过\
    \ `std::async` 调用异步代码或与并行算法一起使用时，Lambda 表达式非常方便。然而，务必记住，闭包对象在并发方面并不是唯一的，所有的挑战在这里同样适用。\n\
    \n## 总结\n\n在本章中，你已经看到 C++17 结合了 C++ 的两个核心元素：`constexpr` 与 Lambda。这是向改进语言中元编程支持的必要一步。我们将在下一个关于\
    \ C++20 的章节中看到更多内容。此外，C++17 标准还解决了捕获 `this` 的问题。在新标准中，你可以通过值捕获它，使得代码变得安全得多。\n\n\
    我们还查看了 Lambda 的一些用例：IIFE（立即调用函数表达式）技术、折叠表达式和变长通用 Lambda，以及 Lambda 表达式和异步代码执行。得益于\
    \ C++17 提供的各种特性，我们现在有了更优雅的语法和更直接的方法编写高效代码。\n\n## 5. C++20 中的 Lambda\n\n在 2020\
    \ 年 2 月于拉格的会议上，ISO 委员会最终批准了 C++20 标准并将其推正式发布（可能在 2020 年底）。新规范为语言和标准库带来了许多实质改进！Lambda\
    \ 表达式也得到了几次升级。\n\n在本章中，你将看到：\n\n- C++20 中的哪些变化。\n- 捕获 `this` 指针的新选项。\n- 模板 Lambda。\n\
    - 如何使用概念（concepts）改进通用 Lambda。\n- 如何将 Lambda 与 `constexpr` 算法结合。\n- 如何让重载模式更短。\n\
    \n你可以在 N4861（当前的 C++20 草案，拉格版本之后）以及 lambda 章节：`[expr.prim.lambda]` 中查看与 lambda\
    \ 规范。\n\n## Lambda 语法更新\n\n在 C++20 中，我们关于 Lambda 表达式的语法有了更多变化：\n\n- 你现在可以在参数列表后添加\
    \ `consteval`。\n- 有一个指定模板尾部（template tail）的选项。\n- 在尾部返回之后你可以放置 `requires` 声明。\n\
    \n```\n<params> () specifiers exception attr - -> requires { /code; /* */\n  ^\
    \       ^       ^\n  |       | |\n  |       optional: 尾部返回类型\n  | optional: mutable,\
    \ constexpr, consteval, noexcept, attributes\n  | 参数列表（当未添加修饰符时可选）\n  |\noptional:\
    \ 模板参数列表\n|\n带有可选捕获列表的 lambda 引导符\n```\n\n你可以在后续章节中阅读新的修改内容。\n\n## 变更快速概述\n\n\
    通过 C++20，我们将获得以下与 Lambda 表达式相关的特性：\n\n- 允许使用 `[=, this]` 作为 Lambda 捕获 - P049R2，并弃用通过\
    \ `[]` 隐式捕获 `this` - P0806。\n- Lambda 初始化捕获中的包展开：`...args = std::move(args) {}`\
    \ - P0780。\n- 用于结构化绑定的 `static`、`thread_local` 和 Lambda 捕获 - P1091。\n- 模板 Lambda（带概念）\
    \ - P0428R2。\n- 简化隐式 Lambda 捕获 - P0588R1。\n- 可默认构造和赋值的静态 Lambda - P0624R2。\n-\
