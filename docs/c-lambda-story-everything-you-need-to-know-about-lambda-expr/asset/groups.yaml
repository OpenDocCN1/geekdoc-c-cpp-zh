  - "[PAGE 35]\n\n# Capturing Global Variables\n\nIf you have a global variable and\
    \ you use [=] in your lambda, you might\nthnink that your global object is also\
    \ captured by value... but it's not. See the\ncode:\n\n> Capturing Globals. Live\
    \ code @Wandbox\n\n```\n#include <iostream>\n\nint global = 10;\n\nint main()\
    \ {\n    std::cout << global << std::endl;\n    auto foo = [() mutable noexcept\
    \ { ++ global; };\n    foo();\n    std::cout << global << std::endl;\n    const\
    \ auto increaseGlobal = [()] noexcept { ++ global; };\n    increaseGlobal();\n\
    \    std::cout << global << std::endl;\n    const auto moreIncreaseGlobal = [()]\
    \ noexcept { ++ global; };\n    moreIncreaseGlobal();\n    std::cout << global\
    \ << std::endl;\n}\n```\n\nThe above example defines global and uses it with several\
    \ lambdas\nif you run the code, no matter the way\nyou capture, it will always\
    \ point to the global object, and no local copies will\nbe created.\n\nIt's because\
    \ only variables with automatic storage duration can be captured.\nGCC can even\
    \ report the following warning:\n\n```\nwarning: capture of variable 'global'\
    \ with non- automatic\nstorage duration\n```\n\nThis warning will appear only\
    \ if you explicitly capture a global variable, so if\nyou use [= it won't help.\n\
    \nThe clang compiler is even more helpful, as it generates an error :\n\n```\n\
    error: 'global' cannot be captured because it does not have\namatic storage duration\n\
    ```\n\nSee clang live example @Wandbox.\n\n# Capturing Statics"
  md: "\nWe did a similar thing for PrintFunctor in the C++98/03 Chapter. In that\
    \ class, we added a member variable std::string strText which was initialised\
    \ in the constructor. Having a member variable allows us to store state in the\
    \ callable object.\n\nThe syntax for captures:\n\n- [&] capture by reference all\
    \ automatic storage duration variables declared in the scope.\n- [=] capture by\
    \ value (create a copy) all automatic storage duration variables declared in the\
    \ scope.\n- [x, &] capture by value and y by a reference explicitly.\n- [args...]\
    \ - capture a template argument pack, all by value.\n- [&args...] - capture a\
    \ template argument pack, all by reference.\n\nAnd a summary with examples:\n\n\
    ```\nint x = 2, y = 3;\nconst auto l1 = [&](){ return 1; }; // No capture\nconst\
    \ auto l12 = [=](){ return x; }; // All by value (copy)\nconst auto l13 = [&](){\
    \ return y; }; // All by ref\nconst auto l14 = [x](){ return x; }; // Only x by\
    \ value (copy)\n// const auto l15 = [=](){ return x; }; // wrong syntax, no need\
    \ for\n\nconst auto l15 = [&y](){ return y; }; // = to copy x explicitly\nconst\
    \ auto l16 = [x, y](){ return x * y; }; // x by value and y by ref\nconst auto\
    \ l17 = [, &x](){ return x + y; }; // All by value except x\nconst auto l18 =\
    \ [&, y](){ return x - y; }; // which is ref\n// // All by ref except which\n\
    // is by value\n```\n\nTo understand what happens with a captured let's consider\
    \ the following code sample:\n\n## Capturing a Variable\n\n```\nstd::string str(\"\
    Hello World\");\nauto foo = [str]() { return std::cout << str << '\\n'; };\nfoo();\n\
    ```\n\nFor the lambda, str is captured by value (i.e. it is copied). The compiler\
    \ will generate the local functor:\n\n## A Possible Compiler Generated Functor,\
    \ Single Variable\n\n```\nstruct _unnamedLambda {\n_unnamedLambda(std::string\
    \ s) : str(s) {} // copy\n```\n\n![](img/7cb35845bb98e3b897191af3bab607e2_30_0.png)\n\
    \n```\nvoid operator () const {\n    std::cout << str << '\\n';\n}\n\nstd::string\
    \ str;\n};\n```\n\nA variable is passed into the constructor that is conceptually\
    \ called \"in-place\" of lambda declaration.\n\nTo be precise the standard mentions\
    \ in [expr.prim.lambda#21] :\n\n> When the lambda-expression is evaluated, the\
    \ entities that are captured by copy are used to direct-initialise each corresponding\
    \ non-static data member of the resulting closure object.\n\nA possible constructor\
    \ that I showed above (_unnamedLambda) is only for demonstration purpose, the\
    \ compiler might implement it differently and won't expose it.\n\n## Capturing\
    \ Two Variables by Reference\n\n```\nint x = 1, y = 1;\nstd::cout << x << \" \"\
    \ << y << std::endl;\nconst auto foo = [&x, &y](() noexcept { ++ x; ++ y; };\n\
    foo();\nstd::cout << x << \" \" << y << std::endl;\n```\n\nFor the above lambda,\
    \ the compiler might generate the following local functor:\n\n```\nA Possible\
    \ Constructor Generated Functor, Two References. Live code @Wandbox\nstruct _unnamedLambda{\n\
    \    _unnamedLambda(int &a, int &b) : x(a), y(b) {}\n\n    void operator () const\
    \ noexcept {\n        ++ x; ++ y;\n    }\n\n    int &x;\n    int &y;\n};\n```\n\
    \nSince we capture x and y by reference, the closure type will contain member\
    \ variables which are also references.\n\n> The value of the value-captured variable\
    \ is at the time the lambda is defined - not when it is used! The value of a ref-captured\
    \ variable is the value when the lambda is used - not when it is defined.\n\n\
    While specifying [] and [& might be convenient, as it captures all automatic storage\
    \ duration variables, it's clearer to capture a variable explicitly. That way\
    \ the compiler can warn you about unintended effects (see notes global and static\
    \ variable for example).\n\nYou can also read in item 31 in \"Effective Modern\
    \ C++\" 3 by Scott Meyers: \"Avoid default capture modes.\"\n\n> The C++ closures\
    \ do not extend the lifetimes of the captured references. Be sure that the capture\
    \ variable still lives when lambda is invoked.\n\n## The mutable Keyword\n\nBy\
    \ the default operator() of the closure type is marked as const , and you cannot\
    \ modify captured variables inside the body of the lambda.\n\nIf you want to change\
    \ this behaviour, you need to add the mutable keyword after the parameter list.\
    \ This syntax effectively removes the const from the call operator declaration\
    \ in the closure type. If you have a simple lambda expression with a mutable :\n\
    \n```\nint x = 1;\nauto foo = [x]() mutable { ++ x; };\n```\n\nIt will be \"expanded\"\
    \ into the following function:\n\n```\nstruct _lambda_x1 {\n    void operator()\
    \ { ++ x; }\n    int x;\n};\n```\n\nAs you can see, the call operator can change\
    \ the value of the member fields.\n\n## Capturing Two Variables by Copy and Mutable.\
    \ Live code @Wandbox\n\n```\n#include <iostream>\n\nint main() {\n    const auto\
    \ print = [](const char *str, int x, int y) {\n        std::cout << str << \"\
    \ \" << x << \" \" << y << '\\n';\n    };\n    int x = 1, y = 1;\n    print(\"\
    in main()\", x, y);\n    auto foo = [x, y, &]() mutable {\n        ++x;\n    \
    \    ++y;\n        print(\"in foo()\", x, y);\n    };\n    foo();\n    print(\"\
    in main()\", x, y);\n}\n```\n\nOutput:\n\nin main(): 1 1\nin foo(): 2 2\nin main():\
    \ 1 1\n\nIn the above example, we can change the values of x and y . Since those\
    \ are only the copies of x and y from the enclosing scope, we don't see their\
    \ new values after foo is invoked.\n\nOn the other hand, if you capture by reference,\
    \ then you don't need to apply mutable to the lambda to modify the value. This\
    \ is because the captured member variables are references and cannot be bound\
    \ inside a const member function.\n\n## Capturing a Variable by Reference\n\n\
