    - `[=]` 按值捕获（创建副本）作用域内声明的所有自动存储时期变量。\n- `[x, &]` 显式地按值捕获 x 并按引用捕获 y。\n- `[args...]`\
    \ - 捕获模板参数包，全部按值。\n- `[&args...]` - 捕获模板参数包，全部按引用。\n\n以及带有示例的总结：\n\n```\nint x\
    \ = 2, y = 3;\nconst auto l1 = [&](){ return 1; }; // 无捕获\nconst auto l12 = [=](){\
    \ return x; }; // 全部按值（拷贝）\nconst auto l13 = [&](){ return y; }; // 全部按引用\nconst\
    \ auto l14 = [x](){ return x; }; // 仅 x 按值（拷贝）\n// const auto l15 = [=](){ return\
