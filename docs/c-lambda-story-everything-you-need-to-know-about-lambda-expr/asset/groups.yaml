    # # 1. Lambdas in C++98/03


    To start out, it''s good to create some background for our main topic. To do this,
    we''ll move into the past and look at code that doesn''t use any modern C++ techniques.


    In this chapter, you''ll learn:


    +   * How to pass functors to algorithms from the Standard Library.

    * The limitations of functors and function pointers.

    * Why functional helpers weren''t good enough.

    * The motivation for the new feature for C++0x/C++11.'
  - "[PAGE 14]\n\n# Callable Objects in C++98/03\n\nOne of the fundamental ideas of\
    \ the Standard Library is that algorithms like std::sort, std::for_each, std::transform\
    \ and many others, can take any callable object and call it on elements of the\
    \ input container. However, in C++98/03, this only included pointers to functions\
    \ and functors.\n\nAs an example, let's have a look at an application that prints\
    \ all elements of a vector.\n\nIn the first version we'll use a regular function:\n\
    \n> A basic print function. Live code @Wandbox\n\n```\n#include <algorithm>\n\
    #include <iostream>\n#include <vector>\n\nvoid PrintFunc (int x) {\n    std::cout\
    \ << x << std::endl;\n}\n\nint main() {\n    std::vector<int> v;\n    v.push_back(1);\n\
    \    v.push_back(2);\n    std::for_each(v.begin(), v.end(), PrintFunc);\n}\n```\n\
    \nThe code above uses std::for_each to iterate over a vector (we use C++98/03\
    \ so range-based for loop is not available!) and then passes PrintFunc as a callable\
    \ object.\n\nWe can convert this simple function into a functor:\n\n> A basic\
    \ print function. Live code @Wandbox\n\n```\n#include <algorithm>\n#include <iostream>\n\
    #include <vector>\n\nstruct PrintFunctor {\n    void operator()(int x) const {\n\
    \        std::cout << x << std::endl;\n    }\n}\n\nint main() {\n    std::vector<int>\
    \ v;\n    v.push_back(1);\n    v.push_back(2);\n    std::for_each(v.begin(), v.end(),\
    \ PrintFunctor);\n}\n```"
  - "[PAGE 15]\n\nThe example defines a simple functor with operator(). .\n\nWhile\
    \ function pointers are usually stateless 1, functors can hold member variables\
    \ which allow storing state. One example is to count the number of invocations\
    \ of a callable object in an algorithm. This solution needs to store a counter\
    \ that is updated with each lambda call:\n\nFunctor with a state. Live code @Wandbox\n\
    \n```\n#include <algorithm>\n#include <iostream>\n#include <vector>\n\nstruct\
    \ PrintFunctor {\n    PrintFunctor() : numCalls(0) {}\n    void operator()(int\
    \ x) const {\n        std::cout << x << '\\n';\n        ++numCalls;\n    }\n\n\
    \    mutable int numCalls;\n};\n\nint main() {\n    std::vector<int> v;\n    v.push_back(1);\n\
    \    v.push_back(2);\n    const PrintFunctor visitor = std::for_each(v.begin(),\
    \ v.end(), PrintFunctor());\n    std::cout << \"num calls: \" << visitor.numCalls\
    \ << '\\n';\n}\n```\n\nIn the above example, we used a member variable numCalls\
    \ to count the number of invocations of the call operator. Since the call operator\
    \ is a const member function, I had to use a mutable variable.\n\nAs you can easily\
    \ predict, we should get the following output:\n\n1\n2\nnum calls: 2\n\nWe can\
    \ also \"capture\" variables from the calling scope. To do that we have to create\
    \ a member variable in our functor and initialise it in the constructor.\n\nFunctor\
    \ with a 'captured' variable. Live code @Wandbox\n\n```\n#include <algorithm>\n\
    ```"
  - "[PAGE 16]\n\n```\n#include <iostream>\n#include <string>\n#include <vector>\n\
    \nstruct PrintFunctor {\n    PrintFunctor(const std::string& str)\n        : strText(str),\
    \ numCalls(0) {}\n\n    void operator()(int x) const {\n        std::cout << strText\
    \ << x << '\\n';\n        ++numCalls;\n    }\n\n    std::string strText;\n   \
    \ mutable int numCalls;\n};\n\nint main() {\n    std::vector<int> v;\n    v.push_back(1);\n\
    \    v.push_back(2);\n    const std::string introText(\"Elem: \");\n    const\
    \ PrintFunctor visitor = std::for_each(v.begin(), v.end(),\n                 \
    \                   PrintFunctor(introText));\n    std::cout << \"num calls: \"\
    \ << visitor.numCalls << '\\n';\n}\n```\n\nIn this version, PrintFunctor takes\
    \ an extra parameter to initialise member variable. Then this variable is used\
    \ in the call operator. So the expected output is as follows:\n\n+   - Elem: 1\n\
    - Elem: 2\n- num calls: 2\n\n# Issues with Functors\n\nAs you can see, functors\
    \ are powerful. They are represented by a separate class, and you can design them\
    \ any way you like.\n\nHowever, in C++98/03, the problem was that you had to write\
    \ a function or a functor in a different place than the invocation of the algorithm.\
    \ This could mean that the code for a function could be dozens or hundreds of\
    \ lines later or further in the source file.\n\nAs a potential solution, you might\
    \ have tried writing a local functor class, since C++ always has support for that\
    \ syntax. But that didn't work...\n\nSee this code:"
