  - "[PAGE 41]\n\n# Return Type\n\nIn many cases, you can skip the return type of\
    \ the lambda and then the compiler will deduce the typename for you.\n\nInitially,\
    \ return type deduction was restricted to lambdas with bodies containing a single\
    \ return statement. However, this restriction was quickly lifted as there were\
    \ no issues with implementing a more convenient version.\n\nC++ Standard Core\
    \ Language Defect Reports and Accepted Issues 5\n\nTo sum up, since C++11, the\
    \ compiler will be able to deduce the return type as long as all of your return\
    \ statements are of the same type.\n\n| If all rvalue return an expression and\
    \ the types of the return expressions after lvalue-to-rvalue conversion (7.1 [conv.val]),\
    \ array-to-pointer conversion (7.2 [conv.array]), and function-to-pointer conversion\
    \ (7.3 [conv.func]) are the same, common type |\n\nReturn Type Deduction. Live\
    \ code @Wandbox\n\n```\n#include <traits>\nint main () {\n    const auto baz =\
    \ [[](int x) noexcept {\n        if (x < 20)\n            return x * 1.1;\n  \
    \      else\n            return x * 2.1;\n    }];\n    static_assert(std::is_same<double,\
    \ decltype(baz(10))::value,\n        \"has to be the same!\");\n}\n```\n\nIn the\
    \ above lambda, we have two return statements, but they all point to double so\
    \ the compiler can deduce the type.\n\n> In C++14 return type of lambda will be\
    \ updated to adapt to the rules of auto deduction for regular functions. See this\
    \ section.\n\n# Trailing Return Type Syntax"
