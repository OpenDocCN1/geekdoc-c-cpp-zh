    \ I have reconstructed the logical structure based on the readable segments.)\n\
    \n## Concurrent Execution Using Lambdas\n\nIt's easy to show examples where the\
    \ lambda runs on the same thread. But how about asynchronous cases? What if you\
    \ want to call a lambda on separate thread? What problems you encounter? Let's\
    \ review them in this section.\n\n## Lambdas with std::thread\n\nLet's start with\
    \ std::thread which is available since C++11. As you might already know std::thread\
    \ accepts a callable object in its constructor. It might be a function pointer,\
    \ a functor or a lambda expression. A simple example:\n\nPassing lambda to a thread.\n\
    \n```cpp\n#include <iostream>\n#include <thread>\n#include <vector>\n#include\
    \ <numeric> // for std::iota\n\nint main() {\n    const auto printThreadID = [=](const\
    \ char * str) {\n        std::cout << str << \": \" << std::this_thread::get_id()\
    \ << \" thread id \\n\";\n    };\n\n    std::vector<int> numbers(100);\n\n   \
    \ std::thread iotaThread([&numbers, &printThreadID](int startArg) {\n        std::iota(numbers.begin(),\
    \ numbers.end(), startArg);\n        printThreadID(\"iota in \\\");\n    }, 10);\n\
    \n    iotaThread.join();\n    printThreadID(\"printing numbers in \\\");\n\n \
