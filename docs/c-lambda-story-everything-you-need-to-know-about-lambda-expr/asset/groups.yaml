    }\n```\n\n- 哪些标准算法是 constexpr 的？`<algorithm>`、`<utility>` 和头文件中的所有算法现在都标记为 constexpr，除了\
    \ `shuffle`、`sample`、`stable_sort`、`stable_partition`、`inplace_merge` 以及接受执行策略（Execution\
    \ Policy）参数的重载。更多信息请阅读论文 P0202 和 P1645。\n\n# C++20 对重载模式（Overloaded Pattern）的更新\n\
    \n在上一章中，你学习了如何继承多个 lambda 表达式并通过重载模式将其暴露出来。这种技术对于 `std::variant` 访问非常有用。\n\n得益于\
    \ C++20 类模板参数推导（CTAD）的更新，我们现在可以拥有更短的语法！\n\n为什么？\n\n因为在 C++20 中 CTAD 有了扩展，并且聚合体会被自动处理。这意味着不需要编写自定义推导指南。\n\
    \n对于简单类型：\n\n```cpp\ntemplate < typename T, typename U, typename V>\nstruct Triple\
    \ { T t; U u; V v; };\n```\n\n在 C++20 中你可以写：\n\n```cpp\nTriple ttt{ 10.0f , 90\
    \ , std::string{\"hello\"} };\n```\n\n并且 `t` 将被推导为 `float`，`u` 为 `int`，`v` 为 `std::string`。\n\
    \nC++20 中的重载模式现在只需为：\n\n```cpp\ntemplate < class... > struct overload: Ts... {\
    \ using Ts::operator (().); };\n```\n\n该特性的提案可用于 P1021 以及 P1816（措辞）。\n\n> GCC10\
