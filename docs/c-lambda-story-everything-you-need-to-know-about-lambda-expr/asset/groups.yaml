    #include <iostream>\n```\n\n```cpp\n#include <string>\n\nvoid foo (const std::string&)\
    \ { std::cout << \"foo(const string&) \\n\" ; }\nvoid foo (std::string&&) { std::cout\
    \ << \"foo(string&&) \\n\" ; }\n\nint main () {\n    const auto callFoo = [](auto&&\
    \ str) {\n        std::cout << \"Calling foo on: \" << str << '\\n';\n       \
    \ foo(std::forward<decltype(str)>(str));\n    };\n\n    const std::string str\
    \ = \"Hello World\";\n    callFoo(str);\n    callFoo(\"Hello World Ref\");\n\n\
    }\n```\n\n## 输出：\n\nCalling foo on: Hello World\nfoo(const std::string&)\nCalling\
    \ foo on: Hello World Ref\nfoo(std::string&&)\n\n示例代码为 `std::string` 的 const 和右值引用定义了两个函数重载。`callFoo`\
    \ lambda 使用了一个通用引用（universal reference）作为泛型参数。如果你想将此 lambda 重写为普通的函数模板，它看起来可能是这样：\n\
    \n```cpp\ntemplate < typename T>\nvoid callFooFunc(T&& str) {\n    std::cout <<\
    \ \"Calling foo on: \" << str << '\\n';\n    foo(std::forward<T>(str));\n}\n```\n\
    \n如泛型 Lambda 所示，你有更多的选项来编写局部匿名函数。\n\n但不仅如此。\n\n## 推导正确的类型\n\n此外，当类型推导很复杂时，泛型 Lambda\
    \ 可能会非常有帮助。\n\n例如：\n\nmap 迭代的正确类型。实时代码 @Wandbox\n\n```cpp\n#include <algorithm>\n\
    #include <iostream>\n#include <map>\n#include <string>\n\nint main() {\n    const\
    \ std::map<std::string, int> numbers = {\n        {\"one\", 1}, {\"two\", 2},\
    \ {\"three\", 3}\n    };\n\n    // 每次 entry 都从 pair-const string, int 拷贝！\n  \
    \  std::for_each(std::begin(numbers), std::end(numbers),\n        [](const std::pair<const\
    \ std::string, int>& entry) {\n            std::cout << entry.first << \" = \"\
    \ << entry.second << '\\n';\n        });\n\n}\n```\n\n## 我在这里写错了吗？entry 的类型正确吗？\n\
    \n这是一个错误，因为 map 的值类型是 `std::pair<const Key, T>`，而不是 `const std::pair<const std::string,\
    \ int>`。在我们的案例中，由于 `std::pair<const std::string, int>` 和 `const std::pair<std::string,\
    \ int>&` 之间的转换（即 `const std::string` 转换为 `std::string`），代码执行了拷贝：\n\n## 使用 auto\
    \ 可以修复\n\n```cpp\nstd::for_each(std::begin(numbers), std::end(numbers),\n    [](const\
    \ auto& entry) {\n        std::cout << entry.first << \" = \" << entry.second\
    \ << '\\n';\n    });\n```\n\n现在模板推导将充分地获取 entry 的正确类型，并且不会创建额外的拷贝。更不用说代码更易读、更更短了。\n\
    \n查看完整示例，示例中还包含了打印 entry 地址的代码：\n\nmap 迭代的正确类型，实时代码 @Wandbox\n\n```cpp\n#include\
    \ <algorithm>\n#include <iostream>\n#include <map>\n#include <string>\n\nint main()\
    \ {\n    const std::map<std::string, int> numbers = {\n        {\"one\", 1}, {\"\
    two\", 2}, {\"three\", 3}\n    };\n\n    // 打印地址：\n    for (auto mit = numbers.begin();\
    \ mit != numbers.cend(); ++ mit)\n        std::cout << \" \" << mit << \" = \"\
    \ << mit->second << \"\\n\";\n\n    // 每次 entry 都从 pair<string, int> 拷贝\n    std::for_each(std::begin(numbers),\
    \ std::end(numbers),\n        [](const std::pair<string, int> &entry) {\n    \
    \        std::cout << \" \" << entry.first << \" = \" << entry.second << \"\\\
    n\";\n            entry.first << \" = = \" << entry.second << \"\\n\";\n     \
    \   });\n\n    // 虽然这些 entry 没有被拷贝，但它们的地址相同\n    std::for_each(std::begin(numbers),\
    \ std::end(numbers),\n        [](const auto &entry) {\n            std::cout <<\
    \ \" \" << entry.first << \" = \" << entry.second << \"\\n\";\n            entry.first\
    \ << \" = = \" << entry.second << \"\\n\";\n        });\n}\n```\n\n这里有一个可能的输出：\n\
    \n1 0x165dc40, 0x165dc60\n2 0x165dce0, 0x165dd00\n3 0x165dc90\n\n"
