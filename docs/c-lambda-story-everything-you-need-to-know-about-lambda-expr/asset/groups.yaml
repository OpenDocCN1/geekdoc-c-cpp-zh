    # The Syntax of Lambda Expression


    Below you can find a “diagram” that illustrates the syntax for lambdas:


    ```

    [] () qualifiers exception attr -> ret { /*code */ }

    ^ ^ ^

    | | | |

    | | optional: trailing return type

    | optional: mutable, exception specification or noexcept, attributes

    | parameter list (optional when no specifiers added)

    lambda introducer with an optional capture list

    ```


    Before we start it''s handy to bring some core definitions from the C++ Standard:


    From [expr.prim.lambda#2] :


    > The evaluation of a lambda-expression results in a prvalue temporary. This temporary
    is called the closure object.


    And from [expr.prim.lambda#3] :


    > The type of the lambda-expression (which is also the type of the closure object)
    is a unique, unnamed non-union class type — called the closure type.'
  - '[PAGE 23]


    # A Few Examples of Lambda Expressions:


    ```

    // 1. the simplest lambda expression:

    [] {};

    ```


    In the first example, you can see a "minimal" lambda expression. It only needs
    the [] and then the empty {} for the function body. The argument list - () - is
    optional and not needed in this case.


    ```

    // 2. with two params:

    [](float f, int a) { return a * f; }

    [](int a, int b) { return a < b; };

    ```


    In the second example, probably one of the most common, you can see that the arguments
    are passed into the () section, just like for a regular function. The return type
    is not needed, as the compiler will automatically deduce it.


    ```

    // 3. trailing return type:

    [](MyClass t) -> int { auto a = t.compute(a); print(a); return a; };

    ```


    In the above example, we explicitly set a return type. The trailing return type
    is also available for function declaration since C++11.


    ```

    // 4. additional specifiers:

    [x](int a, int b) mutable { return a < b; }

    [](float param) noexcept { return param * param; }

    [x](int a, int b) mutable noexcept { return a < b; };

    ```


    The last example shows that before the body of the lambda, you can use other specifiers.
    In the code, we used mutable (so that we can change the captured variable) and
    noexcept. The third lambda uses mutable and noexcept and they have to appear in
    that order (so you cannot write mutable as the compiler rejects it).


    While the () is optional, if you want to apply mutable or noexcept then () to
    be in the expression:


    ```

    // 5. std::cout << x; // no () needed

    [x] std { mutable { ++ x; }; // won''t compile!

    []() mutable { ++ x; }; // fine - () required mutable

    [] noexcept { }; // won''t compile!

    () noexcept { }; // fine

    ```


    The same pattern for other specifiers that can be applied on lambdas'
