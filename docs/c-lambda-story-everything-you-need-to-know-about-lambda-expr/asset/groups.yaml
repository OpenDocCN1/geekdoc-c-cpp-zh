    \ C++17 中，它是类型的一部分部分。你可以拥有两个重载：一个带有 `noexcept`，另一个则不带。见下文：\n\n```cpp\nusing noexceptFunc\
    \ = void (*)() noexcept;\nvoid CallWith(noexceptFunc f) { f(); }\n\nusing voidFunc\
    \ = void (*)();\nvoid CallWith(voidFunc f) { f(); }\n\nvoid fnoexcept() noexcept\
    \ {}\nvoid fRegular() {}\n\nint main() {\n    CallWith(fnoexcept);\n    CallWith([]()\
