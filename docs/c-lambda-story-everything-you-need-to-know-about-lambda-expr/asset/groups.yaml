    # 2. Lambdas in C++11


    Hooray! The C++ Committee heard voices of developers, and since C++11 we got lambda
    expression!


    Lambdas quickly become one of the most recognisable features of modern C++.


    You can read the spec located under N3337 - the final draft of C++11.


    And the separate section for lambdas: [expr.prim.lambda].


    I think the committee added lambdas in a smart way to the language. They incorporate
    new syntax, but then the compiler “expands” it into an unnamed “hidden” functor
    object. This way we have all the advantages (and disadvantages) of the real strongly
    typed language, and it’s relatively easy to reason about the code.


    In this chapter, you’ll learn:


    +   - The basic syntax of lambdas.

    - How to capture variables.

    - How to capture member variables.

    - The return type of a lambda.

    - What a closure object is.

    - How lambda can be converted to a function pointer and use it with C-style API.

    - What’s IIFE.

    - How to inherit from a lambda expression and why it can be useful.


    Let’s go!'
