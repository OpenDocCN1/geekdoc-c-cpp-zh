  - '[PAGE 121]


    # C++17


    +   - constexpr lambdas - in C++17 your lambdas can work in a constexpr context.

    - Capturing this improvements - Before C++17 this pointer was captured only as
    a pointer which might lead to dangling issues. In C++17 you can capture a copy
    of the object represented by this*.

    - Fold Expressions that can improve generic variadic lambdas.


    # C++20


    +   - Template lambdas - improvements to generic lambdas which offer more control
    over the input template argument.

    - Lambdas and concepts - Lambdas can also work with constrained auto and Concepts,
    they are as flexible as functors as template functions.

    - Lambdas in unevaluated contexts - you can now create a map or a set and use
    a lambda as a predicate.'
