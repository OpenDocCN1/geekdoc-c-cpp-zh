    \ its second argument by using\nstd::bind2nd. This whole \"composition\" is passed\
    \ into count_if. As you\ncan probably guess, the code expands into a function\
    \ that performs a simple\ncomparison:\n\nreturn x < 5;\n\nIf you wanted ready-to-use\
