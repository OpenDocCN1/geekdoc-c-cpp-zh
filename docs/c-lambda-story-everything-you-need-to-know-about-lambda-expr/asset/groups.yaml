    \ the future mechanism:\n\n```cpp\nstd::future<std::vector<int>> iotaFuture =\
    \ std::async(std::launch::async, []() {\n    std::vector<int> numbers(100);\n\
    \    std::iota(numbers.begin(), numbers.end(), 10);\n    std::cout << \"calling\
    \ from: \" << std::this_thread::get_id() << \" thread id\" << std::endl;\n   \
    \ return numbers;\n});\nauto vec = iotaFuture.get(); // make sure we get the results...\n\
    ```\n\nIt seems that over the years std::async/std::future has earned itself a\
    \ mixed reputation. It looks like the functionality was a bit too rushed. It works\
    \ for relatively simple cases but fails with advanced scenarios like:\n\n- continuation\n\
    - task merging\n- no cancellation/joining\n- it's not a regular type\n- and few\
    \ other issues\n\nIf you want to know more, you read or watch the following resources:\n\
    \n- There is a Better Future - Felix Petriconi - code::dive 2018 - YouTube\n-\
    \ code::dive 2016 conference – Sean Parent – Better Code: Concurrency - YouTube\n\
    - Core C++ 2019 :: Avi Kivity :: Building efficient I/O intensive applications\
    \ with Seastar - YouTube\n\n# Lambdas and Parallel Algorithms from C++17\n\nAfter\
    \ discussing the threading support in C++11, we can move to further standards:\
    \ C++17. This time you have a easy-to-use technique that allows you to parallelise\
    \ most of the algorithms from the Standard Library. All you have to do is to specify\
    \ the first argument into the algorithm, for example:\n\n```cpp\nauto myVec =\
    \ GenerateVector();\nstd::sort(std::execution::par, myVec.begin(), myVec.end());\n\
    ```\n\nPlease notice the first argument: std::execution::par. It’s used to enable\
    \ parallel execution of the sort algorithm.\n\nAnd we have other options:\n\n\
    | Policy Name | Description |\n|---|---|\n| sequenced_policy | It is an execution\
    \ policy type used as a unique type to disambiguate parallel algorithm overloading\
    \ and require that a parallel algorithm’s execution not be parallelised. |\n|\
    \ parallel_policy | It is an execution policy type used as a unique type to disambiguate\
    \ parallel algorithm overloading and require that a parallel algorithm’s execution\
    \ may be parallelised. |\n| parallel_unenced_policy | It is an execution policy\
    \ type used as a unique type to disambiguate parallel algorithm overloading and\
    \ require that a parallel algorithm’s execution may be parallelised. |\n\nExecution\
    \ policy declarations and global objects are located in the <execution> header.\
    \ For each policy we have predefined instances:\n\n- std::execution::par\n- std::execution::seq\n\
    - std::execution::par_unseq\n\nIn C++20, there's also one more execution policy:\
    \ unsequenced_policy along with the global instance std::execution::unseq. It's\
    \ used to enable vectorised execution on a single thread.\n\nWhile we can easily\
    \ enable parallel sorting, we can also quickly write some bad code:\n\n```cpp\n\
    #include <iostream>\n#include <vector>\n#include <numeric>\n#include <execution>\n\
    \nint main() {\n    std::vector<int> vec(1000);\n    std::iota(vec.begin(), vec.end(),\
    \ 0);\n    std::vector<int> output;\n    std::for_each(std::execution::par, vec.begin(),\
    \ vec.end(), [&](int &elem) {\n        if (elem % 2 == 0) {\n            output.push_back(elem);\n\
    \        }\n    });\n\n    for (const auto & elem : output) {\n        std::cout\
    \ << elem << \", \";\n    }\n}\n```\n\nBy passing a lambda to std::for_each we\
    \ need to remember that the execution doesn't happen on a single thread and locally.\
    \ Several threads might be used here, for example, using a thread pool solution.\
    \ That's why accessing a shared output vector is not the best idea. Not only can\
    \ you insert elements in a wrong order, but it can crash if several threads attempt\
    \ to change the vector at the same time.\n"
  mdcn: "\n需要记住的关键点是，虽然 lambda 让创建线程变得简单方便，但它仍然是异步执行的。闭包（Closures）并不“特殊”，它们同样容易受到所有竞态条件和阻塞的影响。\n\
    \n这在下面的示例中是可见：\n\n```cpp\n#include <iostream>\n#include <thread>\n#include <vector>\n\
    \nint main() {\n    int counter = 0;\n\n    auto maxThreads = std::hardware_concurrency();\n\
    \    std::vector<std::thread> threads(maxThreads);\n    for (int t = 0; t < maxThreads;\
    \ ++t) {\n        threads.push_back([&counter]() noexcept {\n            for (int\
    \ i = 0; i < 1000; ++i) {\n                counter++;\n                counter--;\n\
    \                counter++;\n                counter--;\n            }\n     \
    \   });\n    }\n\n    for (auto &thread : threads) {\n        thread.join();\n\
    \    }\n\n    std::cout << counter << std::endl;\n}\n```\n\n在示例中，我们创建了几个线程，每个线程都对\
    \ `counter` 变量进行一些计算。该变量在所有线程之间共享。虽然我们可能期望看到 `counter` 的最终值为 0，但结果是未定义的。一个线程在读取值时，其他线程可能正在对其写入，导致非确定性的结果。要修复这个问题，我们应该使用原子操作（atomics），因为它们看起来是最容易用的。\n\
    \n### 修改原子值\n\n```cpp\n#include <iostream>\n#include <thread>\n#include <vector>\n\
    #include <atomic>\n\nint main() {\n    std::atomic<int> counter{0};\n\n    auto\
    \ maxThreads = std::hardware_concurrency();\n    std::vector<std::thread> threads;\n\
    \    threads.reserve(maxThreads);\n    for (int tCounter = 0; tCounter < maxThreads;\
    \ ++tCounter) {\n        threads.push_back([&counter]() noexcept {\n         \
    \   for (int i = 0; i < 1000; ++i) {\n                counter.fetch_add(1);\n\
    \                counter.fetch_sub(1);\n                counter.fetch_add(1);\n\
    \                counter.fetch_sub(1);\n            }\n        });\n    }\n\n\
    \    for (auto &thread : threads) {\n        thread.join();\n    }\n\n    std::cout\
    \ << counter.load() << std::endl;\n}\n```\n\n上面的代码运行符合预期，因为递增和递减操作现在是原子的。这意味着该操作无法被中断。同步化使得代码更安全，但是以性能为代价的。不过，这是一个值得进一步讨论的话题。解决该问题的另一个方案是在每个线程中拥有一个进行计算的局部变量。然后在线程结束之前，我们可以更新全局值。\n\
    \n在 C++20 中，正如我们所见，使用 lambda 表达式创建线程是非常方便的。它是线程线程本地的，你可以像使用普通函数或对象一样执行一切。\n\n\
    ### 配合 std::async 使用 Lambda\n\n利用多线程的第二种方法是通过 `std::async`。这是一个层级 API，你可以设置它并以惰性或完全异步的方式调用它。结合\
    \ C++11 中的线程，我们依赖于 `std::future` 机制。这是一个处理同步的对象，并保证当我们通过 `.get()` 请求结果时，结果是可用的。在我们的案例中，我们通过\
    \ `std::async` 调度 lambda 的执行，然后我们需要调用 `.get()` 来完成阻塞的计算。\n\n让我们将带有 iota 的示例转换为异步调用：\n\
    \n```cpp\n#include <iostream>\n#include <future>\n#include <vector>\n#include\
    \ <numeric>\n\nint main() {\n    int startArg = 10;\n    auto printThreadID =\
    \ [](const char* str) {\n        std::cout << str << \" \" << std::this_thread::get_id()\
    \ << \" thread id\" << std::endl;\n    };\n\n    std::vector<int> numbers(100);\n\
    \    std::future<std::vector<int>> iotaFuture = std::async(std::launch::async,\
    \ [&numbers, startArg]() {\n        std::iota(numbers.begin(), numbers.end(),\
    \ startArg);\n        printThreadID(\"iota in\");\n        return numbers;\n \
    \   });\n\n    std::vector<int> vec = iotaFuture.get(); // 确保我们得到了结果...\n    printThreadID(\"\
    printing numbers\");\n    for (const auto &num : vec) {\n        std::cout <<\
    \ num << \" \";\n    }\n}\n```\n\n然而，上面的代码有点“作弊”，我们使用了 `future<void>` 且 `vector`\
    \ 仍然通过 lambda 捕获的引用传递。作为替代方案，你可能想创建 `std::future<std::vector<int>>`，以便我们通过 future\
    \ 机制传递：\n\n```cpp\nstd::future<std::vector<int>> iotaFuture = std::async(std::launch::async,\
    \ []() {\n    std::vector<int> numbers(100);\n    std::iota(numbers.begin(), numbers.end(),\
    \ 10);\n    std::cout << \"calling from: \" << std::this_thread::get_id() << \"\
    \ thread id\" << std::endl;\n    return numbers;\n});\nauto vec = iotaFuture.get();\
    \ // 确保我们得到了结果...\n```\n\n多年来，`std::async/std::future` 似乎获得了一个褒誉参半的评价。看起来功能实现得有些仓促。它对于相对简单的情况有效，但在以下场景中表现不佳：\n\
    \n- 连续\n- 合并\n- 不取消\n- 某些类型\n- 某些其他问题\n\n如果你想了解更多，可以参考以下资源：\n\n- There is a Future\
    \ - Felix Petric\n- Core C++ Concurrency - Sean Parent\n- Building efficient I/O\
    \ with Seastar\n\n# Lambda 与并行算法\n\n在讨论了 C++11 的线程支持后，我们可以转向 C++17。这允许你并行化标准库中的大多数算法。你只需要为算法指定第一个参数，例如：\n\
    \n```cpp\nauto myVec = Generate();\nstd::sort(std::execution::par, myVec.begin(),\
    \ myVec.end());\n```\n\n请注意第一个参数：`std::execution::par`。它用于启用算法的并行。\n\n还有其他选项：\n\
    \n| 策略名称 | 描述 |\n|---|---|\n| sequenced_policy | 一种执行策略，用于区分重载算法，并要求算法的执行不并行。\
    \ |\n| parallel_policy | 一种执行策略，用于区分重载算法，并要求算法的执行可以并行。 |\n| parallel_unenced_policy\
    \ | 一种执行策略，用于区分重载算法，并要求算法的执行可以并行。 |\n\n执行策略的声明和全局对象位于 `<execution>` 头文件中。对于每个策略，我们都有预定义的实例：\n\
    \n- `std::execution::par`\n- `std::execution::seq`\n- `std::execution::par_unseq`\n\
    \n在 C++20 中，还有一种执行策略：`unenced_policy`，配合全局实例 `std::execution::unseq`。它用于启用单线程上的向量化执行。\n\
    \n虽然我们可以轻松开启并行排序，但也可以快速写出糟糕的代码：\n\n```cpp\n#include <iostream>\n#include <vector>\n\
    #include <numeric>\n#include <execution>\n\nint main() {\n    std::vector<int>\
    \ vec(1000);\n    std::iota(vec.begin(), vec.end(), 0);\n    std::vector<int>\
    \ output;\n    std::for_each(std::execution::par, vec.begin(), vec.end(), [&](int\
    \ &elem) {\n        if (elem % 2 == 0) {\n            output.push_back(elem);\n\
    \        }\n    });\n\n    for (const auto & elem : output) {\n        std::cout\
    \ << elem << \", \";\n    }\n}\n```\n\n通过将 lambda 传递给 `std::for_each`，我们需要记住执行并不是在单线程上本地发生的。这里可能会使用多个线程，例如使用线程池解决方案。这就是为什么访问共享输出\
    \ `vector` 不是好主意。你不仅可能会以错误的顺序插入元素，而且如果多个线程尝试更改 vector，它可能会崩溃。\n"
