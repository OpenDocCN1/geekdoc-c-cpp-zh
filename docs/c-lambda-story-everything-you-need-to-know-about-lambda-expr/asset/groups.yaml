    \n代码使用了传递给 `SimpleAccumulate` 的 `constexpr` lambda。该 lambda 没有显式标记为 `constexpr`，但编译器会将其调用运算符声明为\
    \ `constexpr`。\n\n作为另一个示例，我们可以使用并增强 C++14 章节中的递归 lambda：\n\n```cpp\nint main()\
