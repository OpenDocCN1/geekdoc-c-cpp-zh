  md: "\n## 4. Lambdas in C++17\n\nC++17 added two significant enhancements to lambda\
    \ expressions:\n\n- constexpr lambdas\n- Capture of `this`\n\nThe new C++17 also\
    \ updated the type system - it now contains exception specification which also\
    \ relates to lambda expressions. You can see specification related to lambdas\
    \ in N65 (just before publication) and the lambda section. Additionally, you'll\
    \ learn about the following:\n\n- How to improve the IIFE pattern in C++17.\n\
    - How to improve variadic generic lambdas with fold expressions.\n- How to derive\
    \ from multiple lambdas.\n\n## Lambda Syntax\n\nWith C++17, we have a few changes\
    \ to the syntax of lambda:\n\n- You can now add `constexpr` after parameter list.\n\
    - The dynamic exception specification was deprecated in C++11 and removed in C++17,\
    \ so in practice, you should only use `noexcept`.\n\n```cpp\n() specifiers ->\
    \ ret\noptional: trailing return type\noptional: mutable, constexpr, noexcept,\
    \ attributes\nparameter list (optional specifiers added)\nlambda with optional\
    \ capture list\n```\n\nYou can read about this new modification in the next section.\n\
    \n## Exception Specification in Type System\n\nBefore we move to syntax improvements\
    \ for lambdas, we need to cover one “general” feature that was introduced in C++17.\
    \ Exception Specification for a function didn't belong to the type of the function,\
    \ but in C++17, it's part of it. You can have two overloads: one with `noexcept`\
    \ and the second without it. See below:\n\n```cpp\nusing noexceptFunc = void (*)()\
    \ noexcept;\nvoid CallWith(noexceptFunc f) { f(); }\n\nusing voidFunc = void (*)();\n\
    void CallWith(voidFunc f) { f(); }\n\nvoid fnoexcept() noexcept {}\nvoid fRegular()\
    \ {}\n\nint main() {\n    CallWith(fnoexcept);\n    CallWith([]() noexcept { });\
    \ // cannot convert\n    CallWith([]() {}); // cannot convert\n    \n    CallWith(fnoexcept);\
    \ // converts to regular function\n    CallWith(fRegular);\n    CallWith([]()\
    \ noexcept { }); // converts\n    CallWith([]() {});\n}\n```\n\nA pointer to `noexcept`\
    \ function can be converted to a pointer to a regular function (this also works\
    \ for pointer to a member function and also for lambdas). But it's not possible\
    \ the way around (from a regular function pointer into a function pointer that\
    \ is marked with `noexcept`).\n\nOne of the reasons for adding this feature is\
    \ chance to optimise the code better. If the compiler guarantees that a function\
    \ won't throw, it can potentially generate faster code. Inside the Standard Library,\
    \ there are many places where `noexcept` is checked and based on this the code\
    \ can be more efficient. This is how it works for `std::vector` which can differentiate\
    \ between types that can throw or not. Here's an example which uses type traits\
    \ and `constexpr` to check if a given object is marked with `noexcept`:\n\n```cpp\n\
    #include <iostream>\n#include <type_traits>\n\ntemplate <typename Callable>\n\
    void CallWith(Callable&& fn) {\n    if constexpr (std::is_nothrow_invocable_v<Callable,\
    \ int>) {\n        std::cout << \"Calling fn with optimisation\" << std::endl;\n\
    \        fn(10);\n    } else {\n        std::cout << \"Calling fn normally\" <<\
    \ std::endl;\n        fn(10);\n    }\n}\n\nint main() {\n    int x = 10;\n   \
    \ const auto lam = [&x](int y) noexcept { x += y; };\n    CallWith(lam);\n\n \
    \   const auto lamEx = [&x](int y) {\n        std::cout << \"lamEx with x = \"\
    \ << x << std::endl;\n        x += y;\n    };\n    CallWith(lamEx);\n}\n```\n\n\
    ### The output:\n\n```\nCalling fn with optimisation\nCalling fn normally\nlamEx\
    \ with x = 20\n```\n\nThe code uses `std::is_nothrow_invocable_v` to check if\
    \ the given callable object is marked with `noexcept`.\n\n> In C++17, the Exception\
    \ Specification is cleaned up. Effectively, you can only use `noexcept` for declaring\
    \ a function that won't throw. The dynamic exception specification, i.e. `throw(X,\
    \ Y, Z)`, is now removed.\n\n> **Quick Question:** What happens if you mark a\
    \ function with `noexcept` and yet it throws an exception? In that case, the compiler\
    \ will call `std::terminate`.\n\n## constexpr Lambda Expression\n\nSince C++11,\
    \ `constexpr` allowed more and more code to be evaluated at compile time. This\
    \ not only affects the performance but more importantly makes compile-time coding\
    \ much more pleasant and potent. In C++17, this powerful keyword can also be applied\
    \ on lambdas. Let’s see `expr.prim.lambda`.\n\n> The function call operator is\
    \ a `constexpr` function if either the corresponding lambda-expression's parameter-declaration-clause\
    \ is followed by `constexpr`, or it satisfies the requirements for a `constexpr`\
    \ function.\n\nIn other words, if the lambda body follows the rules of a `constexpr`\
    \ function then `operator()` for the closure type is implicitly defined as `constexpr`.\
    \ To recall, in C++17, a `constexpr` function has the following rules:\n\n- it\
    \ shall not be virtual;\n- its return type shall be a literal type;\n- each of\
    \ its parameter types shall be a literal type;\n- its function-body shall be `delete`,\
    \ `default`, or a compound-statement does not contain:\n    - an asm-definition,\n\
    \    - a goto statement,\n    - an identifier label,\n    - a try-block, or\n\
    - a definition of a variable of non-literal type or static or thread storage duration\
    \ and for which no initialization is performed.\n\n### For example:\n\n```cpp\n\
    constexpr auto Square = [](int n) { return n * n; }; // implicit constexpr\nstatic_assert(Square(2)\
    \ == 4);\n```\n\nSince the body of `Square` is simple and it doesn't violate `constexpr`\
    \ rules, then it's implicitly marked as `constexpr` and we can call it at compile-time\
    \ with `static_assert`.\n\n## Examples\n\nHow about more practical code samples?\
    \ At start, let's consider an implementation of a popular numerical algorithm:\n\
    \n```cpp\nconstexpr lambda - Simple Accumulate\n#include <iostream>\n#include\
    \ <array>\n\ntemplate <typename Range, typename Func, typename T>\nconstexpr T\
    \ SimpleAccumulate(Range&& range, Func func, T init) {\n    for (auto && elem\
    \ : range) {\n        init += func(elem);\n    }\n    return init;\n}\n\nint main()\
    \ {\n    constexpr std::array arr{ 1, 2, 3 };\n\n    constexpr auto sum = SimpleAccumulate(arr,\
    \ [](auto i) {\n        return i * i;\n    }, 0);\n\n    static_assert(sum ==\
    \ 14);\n}\n```\n\nThe code uses `constexpr` lambda which is passed to `SimpleAccumulate`.\
    \ The lambda is not explicitly marked as `constexpr`, but the compiler will declare\
    \ its call operator with `constexpr`.\n\nAs another example we can use and enhance\
    \ a recursive lambda from the C++14 chapter:\n\n```cpp\nint main() {\n    constexpr\
    \ auto factorial = [](int n) constexpr -> int {\n        constexpr auto fact_impl\
