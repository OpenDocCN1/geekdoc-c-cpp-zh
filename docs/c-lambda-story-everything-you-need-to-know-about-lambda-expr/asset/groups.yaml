  - "[PAGE 93]\n\nThe critical thing to remember is while lambdas make it easy and\
    \ convenient to create a thread, it’s still the asynchronous execution. Closures\
    \ are not “special” and also vulnerable to all race conditions and blocking.\n\
    \nThis is visible in the following example:\n\n```\n#include <iostream>\n#include\
    \ <thread>\n#include <vector>\n\nint main() {\n    int counter = 0;\n\n    auto\
    \ maxThreads = std::hardware_concurrency();\n    std::vector<std::thread> threads(maxThreads);\n\
    \    for (int t = 0; t < maxThreads; ++t) {\n        threads.push_back([&counter]()\
    \ noexcept {\n            for (int i = 0; i < 1000; ++i) {\n                counter++;\n\
    \                counter--;\n                counter++;\n                counter--;\n\
    \            }\n        });\n    }\n\n    for (auto &thread : threads) {\n   \
    \     thread.join();\n    }\n\n    std::cout << counter << std::endl;\n}\n```\n\
    \nIn the example, we’re creating several threads 13, and each thread performs\
    \ some computations on the counter variable. The variable is shared among all\
    \ the threads.\n\n> In C++20 you can use std::thread which is a thread that joins\
    \ on destruction and also accepts stop tokens. This new kind of threading object\
    \ allows more control for the thread execution.\n\nWhile you might expect to see\
    \ 0 as the final value of counter , the result is undefined. One thread can read\
    \ the value while others might simultaneously write to it, causing the final result\
    \ to be non-deterministic."
