    \ @Wandbox\n\n```cpp\nstd::vector<int> v;\nv.push_back(1);\nv.push_back(2);\n\
    // push_back until 9...\nconst size_t val = std::count_if(v.begin(), v.end(),\n\
    \    std::bind(std::logical_and<bool>(),),\n    std::bind(std::greater<int>(),_1,\
    \ 2),\n    std::bind(std::less_equal<int>(),_1, 6)));\n```\n\n```cpp\n// _1 comes\
    \ from the std::placeholder namespace\n```\n\nThe composition uses std::bind (from\
    \ C++11, so we cheated a bit, it's not\n++98/03) with std::greater and std::less_equal\
    \ connected with\nstd::logical_and. Additionally, the code uses _1 which is a\
    \ placeholder for\nthe first input argument.\n\nWhile the above code works, you\
    \ can define it locally, you probably\nagree that it's complicated and not natural\
    \ syntax. To mention that this\ncomposition represents only a simple condition:\n\
    \n```cpp\nreturn x > 2 && x <= 6 ;\n```\n\nIs there anything better and more natural\
    \ to use?\n\n# Motivation for a New Feature\n\nAs you can see, in C++98/03, there\
    \ were several ways to declare and pass a\ncallable object to algorithms and utilities\
    \ from the Standard Library.\nHowever, all of those options were a bit limited.\
    \ For example, you couldn't\ndeclare a local functor object, or it was complicated\
    \ to compose a function\nwith functional helper objects.\n\nFortunately with C++11\
    \ we finally saw a lot of improvements!\n\nFirst of all, the C++ Committee lifted\
    \ the template\ninstantiation with a local type. Now you can write functors locally,\
    \ in the\nplace where you need them.\n\nWhat's more, C++11 also brought another\
    \ idea to life: what if the compiler\ncould “write” such small functors for developers?\
    \ That would mean that with\nsome new syntax, we could create functors “in place”\
    \ and open the door to\ncleaner and compact syntax.\n\nAnd that was the birth\
    \ of “lambda expressions”!\n\nIf we look at N3337 - the final draft of C++11,\
    \ we can see a separate section\nfor lambdas: [expr.prim.lambda].\n\nLet’s have\
    \ a look at this new feature in the next chapter.\n\n# 2. Lambdas in C++11\n\n\
    Hooray! The C++ Committee heard voices of developers, and since C++11 we got lambda\
    \ expression!\n\nLambdas quickly become one of the most recognisable features\
    \ of modern C++.\n\nYou can read the spec located under N3337 - the final draft\
    \ of C++11.\n\nAnd the separate section for lambdas: [expr.prim.lambda].\n\nI\
    \ think the committee added lambdas in a smart way to the language. They incorporate\
    \ new syntax, but then the compiler “expands” it into an unnamed “hidden” functor\
    \ object. This way we have all the advantages (and disadvantages) of the real\
    \ strongly typed language, and it’s relatively easy to reason about the code.\n\
    \nIn this chapter, you’ll learn:\n\n- The basic syntax of lambdas.\n- How to capture\
    \ variables.\n- How to capture member variables.\n- The return type of a lambda.\n\
    - What a closure object is.\n- How lambda can be converted to a function pointer\
    \ and use it with C-style API.\n- What’s IIFE.\n- How to inherit from a lambda.\n\
    \n# The Syntax of Lambda\n\nBelow you can find a “diagram” that illustrates the\
    \ syntax for lambdas:\n\n```\n[] () qualifiers -> ret {code }\n^ ^ ^\n| | | optional:\
    \ return type\n| | optional: parameter list\n| introducer with optional capture\
    \ list\n```\n\nThe last example shows that before the body of the lambda, you\
    \ can use other specifiers. In the code, we used mutable (so that we can change\
    \ the captured variable) and noexcept. The third lambda uses mutable and noexcept\
    \ and they have to appear in that order (so you cannot write mutable as the compiler\
    \ rejects it).\n\n# A Few Examples of Lambda Expressions:\n\n```cpp\n// 1. the\
    \ simplest lambda expression:\n[] {};\n```\n\nIn the first example, you can see\
    \ a \"minimal\" lambda expression. It only needs the [] and then empty {} for\
    \ function body. The argument list - () - is optional and not needed in this case.\n\
    \n```cpp\n// 2. with two params:\n[](float f, int a) { return a * f; }\n[](int\
    \ a, int b) { return a < b; };\n```\n\nIn the second example, probably one of\
    \ the most, you can see that the arguments are passed into the () section, just\
    \ like a regular function. The return type is not needed, as the compiler will\
    \ automatically deduce it.\n\n```cpp\n// 3. trailing return type:\n[](MyClass\
    \ t) -> int { auto a = t.compute(a); print(a); return a; };\n```\n\nIn the above\
    \ example, we explicitly set a return type. The trailing return type is also available\
    \ for function declaration since C++11.\n\n```cpp\n// 4. additional specifiers:\n\
    [x](int a, int b) mutable { return a < b; }\n[](float param) noexcept { return\
    \ param * param; }\n[x](int a, int b) mutable noexcept { return a < b; };\n```\n\
    \nThe last example shows that before the body of the lambda, you can use other\
    \ specifiers. In the code, we used mutable (so that we can change the captured\
    \ variable) and noexcept. The third lambda uses mutable and noexcept and they\
    \ have to appear in that order.\n\nWhile the () is optional, if you want to apply\
    \ mutable or noexcept then () to be in the expression:\n\n```cpp\n// 5. std::cout\
    \ << x; // no () needed\n[x] std { mutable { ++ x; }; // won't compile!\n[]()\
    \ mutable { ++ x; }; // fine - () required mutable\n[] noexcept { }; // won't\
    \ compile!\n() noexcept { }; // fine\n```\n\nThe same pattern for other specifiers\
    \ that can be applied on lambdas.\n"
