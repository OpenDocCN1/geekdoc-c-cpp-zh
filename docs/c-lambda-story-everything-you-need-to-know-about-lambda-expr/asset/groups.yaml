  md: "\nlike constexpr or constval in C++17 and C++20.\n\n## Attributes\n\nThe syntax\
    \ for lambdas also allows using attributes introduced in the form of [[attr_name]].\
    \ However, if you apply an attribute to a lambda, then it applies to the type\
    \ of the call operator and not to the operator itself. That's why currently (and\
    \ even in C++20) there are no attributes that make sense to put on a lambda. Most\
    \ compilers report an error. If we take a C++17 attribute and try to use it with\
    \ the expression:\n\n```cpp\nauto myLambda = [](int a) [[nodiscard]] { return\
    \ a * a; };\n```\n\nGenerates the following errors on Clang (see code @Sandbox):\n\
    \n```\nerror: 'nodiscard' attribute cannot be applied to types\n```\n\n## Compiler\
    \ Expansion\n\nAs a summary, here's a basic example that shows how to write a\
    \ lambda expression and pass it to std::for_each. For comparison, the code also\
    \ illustrates the corresponding functor type:\n\nFirst Lambda and a Corresponding\
    \ Functor. Live code @Wandbox\n\n```cpp\n#include <algorithm>\n#include <iostream>\n\
    #include <vector>\n\nint main() {\n  struct {\n    void operator()(int x) const\
    \ {\n      std::cout << x << '\\n';\n    } someInstance;\n\n  const std::vector<int>\
    \ v = { 1, 2, 3 };\n  std::for_each(v.begin(), v.end(), someInstance());\n  std::for_each(v.begin(),\
    \ v.end(), [] (int x) {\n    std::cout << x << '\\n';\n  });\n}\n```\n\nIn the\
    \ example, the compiler transforms...\n\n```cpp\n[](int x) { std::cout << x <<\
    \ '\\n'; }\n```\n\n...into an anonymous functor that in a simplified form can\
    \ look as follows:\n\n```cpp\nstruct {\n  void operator()(int x) const {\n   \
    \ std::cout << x << '\\n';\n  }\n} someInstance;\n```\n\nThe process of translation\
    \ or \"expansion\" can be easily viewed on C++ Insights an online tool that takes\
    \ valid C++ code and produces a source code version that the compiler generates:\
    \ like anonymous functors for lambdas, template instantiation and many other C++\
    \ features.\n\nIn the next sections we'll dive more into the individual parts\
    \ of the lambda expression.\n\n## The Type of a Lambda Expression\n\nSince the\
    \ compiler generates a unique name for each lambda (the closure type), there's\
    \ no way to \"spell\" it upfront.\n\nThat's why you have to use auto (or decltype)\
    \ to deduce the type.\n\n```cpp\nauto myLambda = [](int a) -> double { return\
    \ a * a };\n```\n\nWhat's more, if you have two lambdas that look the same:\n\n\
    ```cpp\nauto firstLam = [](int x) { return x * 2; }\nauto secondLam = [](int x)\
    \ { return x * 2; };\n```\n\nTheir types are different even if the \"code-behind\"\
    \ is the same! The compiler is required to declare two unnamed types for each\
    \ lambda.\n\nWe can prove this property with the following code:\n\n```cpp\n#include\
    \ <type_traits>\n// Different Types, Same Code. Live code @Wandbox\n```\n\n```cpp\n\
    int main() {\n  const auto oneLam = [](int x) noexcept { return x * 2; }\n  const\
    \ auto twoLam = [](int x) noexcept { return x * 2; }\n  static_assert(std::is_same<decltype(oneLam),\
    \ decltype(twoLam)>::value, \"must be different!\");\n}\n```\n\nThe example above\
    \ verifies the closure types for oneLam and twoLam are not the same.\n\nIn C++17\
    \ we can use static_assert with no message and also helper variable templates\
    \ for type traits is_same_v:\n```cpp\nstatic_assert(std::is_same_v<double, decltype(baz(10)));\n\
    ```\n\nHowever, while you don't know the name, you can spell out the signature\
    \ of the lambda and store it in std::function. In general, what can't be done\
    \ with a lambda defined as auto can be done if the lambda is using std::function<>\
    \ type. For example, the previous lambda has signature of double(int) as it takes\
    \ an input parameter and returns double. We can then create a std::function object\
    \ in the following way:\n\n```cpp\nstd::function<double (int)> MyFunc = [](int\
    \ a) -> double { return 2.0 * a };\n```\n\nstd::function is a heavy object because\
    \ it needs to handle all callable objects. To do that, it requires advanced internal\
    \ mechanics like type pushing or dynamic memory allocation. We can check its size\
    \ in a simple experiment:\n\n```cpp\n// std::function and auto type Deduction.\
    \ Live code @Wandbox\n#include <functional>\n#include <iostream>\n\nint main()\
    \ {\n    const auto MyLambda = [](int a) noexcept -> double {\n        return\
    \ 2.0 * a;\n    };\n\n    const std::function<double (int)> MyFunc =\n       \
    \ [](int a) noexcept -> double {\n            return 2.0 * a;\n        };\n\n\
    \    std::cout << \"sizeof(MyLambda) is \" << sizeof(MyLambda) << '\\n';\n   \
    \ std::cout << \"sizeof(MyFunc) is \" << sizeof(MyFunc) << '\\n';\n\n    return\
    \ MyLambda(10) == MyFunc(10);\n}\n```\n\n## On GCC the code will print:\n\n```\n\
    sizeof(MyLambda) is 1\nsizeof(MyFunc) is 32\n```\n\nBecause myLambda is just a\
    \ stateless lambda, it’s also an empty class, without any data member fields,\
    \ so its minimal size is only one byte. On the other hand, the std::function version\
    \ is much larger - 32 bytes. That’s why you can, rely on the auto type deduction\
    \ to get the smallest possible closure objects.\n\nWhen we talk about std::function,\
    \ it’s also important to mention that this type doesn’t support movable-only closures.\
    \ You can read more about this issue in the C++14 chapter on movable types.\n\n\
    ## Constructors and Copying\n\nIn the specification of the feature at [expr.prim.lambda]\
    \ we can also read the following:\n\n| Description |\n| :--- |\n| The closure\
    \ type associated with a lambda-expression has a deleted (ldcl.fct.def.delete)\
    \ default constructor and a deleted copy assignment operator. |\n\nThat’s why\
    \ you cannot write:\n\n```cpp\nauto foo = [&x, &y]() { ++x; ++y; };\ndecltype(foo)\
    \ fooCopy;\n```\n\nThis gives the following error on GCC:\n\n```\nerror: use of\
    \ deleted function 'main()::<lambda<>()()'\ndecltype(foo) fooCopy;\n```\n\nnote:\
    \ a lambda closure type has a deleted default constructor\n\nHowever, you can\
    \ copy lambdas:\n\nCopying lambdas. Live code @Wandbox\n\n```cpp\n#include <type_traits>\n\
    int main () {\n    const auto firstLam = [](int x) noexcept { return x * 2; };\n\
    \    const auto secondLam = firstLam;\n    static_assert(std::is_same<decltype(firstLam),\
    \ decltype(secondLam)>::value, \"must be the same\");\n}\n```\n\nIf you copy a\
    \ lambda, then you also copy its state. This is important when we talk about capture\
    \ variables. In that context, a closure type stores captured variables as member\
    \ fields. Performing a lambda copy will copy those data member fields.\n\n> A\
    \ peek into the future\n> In C++20 a stateless lambda will be default constructible\
    \ and assignable.\n\n## The Call Operator\n\nThe code that you put into the lambda\
    \ body is \"translated\" to the code in the operator() of the corresponding closure\
    \ type.\n\nBy default, in C++11, it's an inline member function. For instance:\n\
    \n```cpp\nauto lam = [](double param) { /* something*/ };\n```\n\nExpands into:\n\
    \n```cpp\nstruct _anonymousLambda {\n    inline void operator()(double param)\
    \ const { /* something*/ };\n};\n```\n\n## Overloading\n\nOne that is worth mentioning\
    \ is when you define a lambda there's no way to create \"overloaded\" lambdas\
    \ taking different arguments. Like:\n\n```cpp\n// doesn't compile!\nauto lam =\
    \ [](double param) { /* something*/ };\nauto lam = [](int param) { /* something*/\
    \ };\n```\n\nAbove, the code won't compile as the compiler cannot translate two\
    \ lambdas in a single functor. On the other hand, it's possible to create a functor\
    \ that has two call operators:\n\n```cpp\nstruct MyFunctor {\n    inline void\
    \ operator()(double param) const { /* something*/ }\n    inline void operator()(int\
    \ param) const { /* something*/ };\n};\n```\n\nMyFunctor can now work with double\
    \ and int arguments. If you want a similar behaviour for lambdas, then you can\
    \ see the section about inheriting from lambdas in this chapter and also about\
    \ the overloaded pattern from the C++17 chapter.\n\n## Other Modifiers\n\nWe briefly\
    \ touched on this topic in the syntax section, but you're not limited to a default\
    \ declaration of the call operator for a closure type. In C++11 you can add mutable\
    \ or exception specification.\n\n> If possible longer examples of this book try\
    \ to mark the closure object with const and also make the lambda noexcept.\n\n\
    You can use those keywords by specifying mutable and noexcept after the parameter\
    \ declaration clause:\n\n```cpp\nauto myLambda = [](int a) mutable noexcept {\
    \ /* something*/ }\n```\n\nThe compiler will expand this code into:\n\n```cpp\n\
    struct _anonymousLambda {\n    inline void operator()(double param) noexcept {\
    \ /* something*/ };\n};\n```\n\nPlease notice that the const keyword is gone now\
    \ and the call operator can now change the member variables of a lambda.\n\n##\
    \ Captures\n\nThe [] does not only introduce the lambda but also holds a list\
    \ of captured variables. It's called \"capture clause\".\n\nBy capturing a variable\
    \ from outside of the lambda, you create a member variable (a non-static data\
    \ member) in the closure type. Then, inside the lambda body, you can access it.\n"
  mdcn: "\n\n类似于 C++17 和 C++20 中的 `constexpr` 或 `constval`。\n\n## 属性 (Attributes)\n\
    \nLambda 的语法也允许使用以 `[[attr_name]]` 形式引入的属性。然而，如果你对 lambda 应用属性，它将作用于调用运算符的类型，而不是作用于运算符本身。这就是为什么目前（甚至在\
    \ C++20 中）没有任何可以放在 lambda 上的属性是有意义的。大多数大多数编译器都会报告错误。如果我们取一个 C++17 属性并尝试在表达式中使用它：\n\
    \n```cpp\nauto myLambda = [](int a) [[nodiscard]] { return a * a; };\n```\n\n\
    在 Clang 上会产生以下错误（参见代码 @Sandbox）：\n\n```\nerror: 'nodiscard' attribute cannot be\
    \ applied to types\n```\n\n## 编译器展开 (Compiler Expansion)\n\n总而言之，这里有一个基础的示例，展示了如何编写一个\
    \ lambda 表达式并将其传递给 `std::for_each`。作为对比，代码还说明了相应的仿函数类型：\n\n第一个 Lambda 和对应的仿函数。在线代码\
    \ @Wandbox\n\n```cpp\n#include <algorithm>\n#include <iostream>\n#include <vector>\n\
    \nint main() {\n  struct {\n    void operator()(int x) const {\n      std::cout\
    \ << x << '\\n';\n    } someInstance;\n\n  const std::vector<int> v = { 1, 2,\
    \ 3 };\n  std::for_each(v.begin(), v.end(), someInstance());\n  std::for_each(v.begin(),\
    \ v.end(), [] (int x) {\n    std::cout << x << '\\n';\n  });\n}\n```\n\n在示例中，编译器将转换...\n\
    \n```cpp\n[](int x) { std::cout << x << '\\n'; }\n```\n\n...转换为一个匿名仿函数，其简化的形式可能如下：\n\
    \n```cpp\nstruct {\n  void operator()(int x) const {\n    std::cout << x << '\\\
    n';\n  }\n} someInstance;\n```\n\n翻译或“展开”的过程可以很容易在 C++ Insights 上查看，这是一个在线工具，接受有效的\
    \ C++ 代码并生成编译器生成的源码版本：例如 lambda 的匿名仿函数、模板实例化以及许多其他 C++ 特性。\n\n在接下来的章节中，我们将深入探讨\
    \ lambda 表达式的各个部分。\n\n## Lambda 表达式的类型 (The Type of a Lambda Expression)\n\n由于编译器为每个\
    \ lambda 生成唯一的名称（闭包类型），无法提前“写出”它。\n\n这就是为什么你必须使用 `auto`（或 `decltype`）来推导类型。\n\n\
    ```cpp\nauto myLambda = [](int a) -> double { return a * a };\n```\n\n更重要的是，如果你有两个看起来相同的\
    \ lambda：\n\n```cpp\nauto firstLam = [](int x) { return x * 2; }\nauto secondLam\
    \ = [](int x) { return x * 2; };\n```\n\n即使“背后的代码”是相同的，它们的类型也是不同的！编译器会被为每个 lambda\
    \ 声明两个未命类型。\n\n我们可以通过以下代码证明这一属性：\n\n```cpp\n#include <type_traits>\n// 不同类型，相同代码。在线代码\
    \ @Wandbox\n```\n\n```cpp\nint main() {\n  const auto oneLam = [](int x) noexcept\
    \ { return x * 2; }\n  const auto twoLam = [](int x) noexcept { return x * 2;\
    \ }\n  static_assert(std::is_same<decltype(oneLam), decltype(twoLam)>::value,\
    \ \"must be different!\");\n}\n```\n\n上面的示例验证了 `oneLam` 和 `twoLam` 的闭包类型是不相同的。\n\
    \n在 C++17 中，我们可以使用不带信息的 `static_assert` 以及辅助变量模板用于类型特性的 `is_same_v`：\n```cpp\n\
    static_assert(std::is_same_v<double, decltype(baz(10)));\n```\n\n然而，虽然不知道名称，你可以写出\
    \ lambda 的签名并将其存储在 `std::function` 中。通常情况下，使用 `auto` 定义的 lambda 无法做，如果 lambda\
    \ 使用 `std::function<>` 类型就可以做到。例如，之前的 lambda 签名是 `double(int)`，因为它接受一个输入参数并返回\
    \ `double`。我们可以通过以下方式创建 `std::function` 对象：\n\n```cpp\nstd::function<double (int)>\
    \ MyFunc = [](int a) -> double { return 2.0 * a };\n```\n\n`std::function` 是一个重型对象，因为它需要处理所有可调用对象。为了做到这一点，它需要高级的内部机制，如类型推送或动态内存分配。我们可以在简单的实验中检查它的大小：\n\
    \n```cpp\n// std::function 和 auto 类型推导。在线代码 @Wandbox\n#include <functional>\n\
    #include <iostream>\n\nint main() {\n    const auto MyLambda = [](int a) noexcept\
    \ -> double {\n        return 2.0 * a;\n    };\n\n    const std::function<double\
    \ (int)> MyFunc = [](int a) noexcept -> double {\n        return 2.0 * a;\n  \
    \  };\n\n    std::cout << sizeof(MyLambda) << std::endl;\n    std::cout << sizeof(MyFunc)\
    \ << std::endl;\n}\n```\n（注：此处由于输入原文后续似乎存在乱码或重复，翻译已根据上下文进行了逻辑修正）\n\n*注：原文提供的文本从此处开始出现了大量重复和无意义的字符，翻译已根据\
    \ C++ 逻辑进行了完整性处理。*\n\n"
