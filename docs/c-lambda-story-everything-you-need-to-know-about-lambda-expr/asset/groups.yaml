    \n  if (result != vs.end()) {\n    std::cout << prefix << \"-something found!\
    \ \\n\";\n  }\n}\n```"
  - "[PAGE 61]\n\nThe code above shows two calls to std::find_if . In the first scenario,\
    \ we capture prefix and compare the input value against prefix + \"bar\"s . Every\
