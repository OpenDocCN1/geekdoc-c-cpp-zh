    \n虽然 C++11 的 `constexpr` 允许在编译阶段执行函数，但在运行时运行这些函数也是可能的。似乎在某些情况下，将功能仅限制在编译时是最好的。这就是为什么在\
    \ C++20 中，我们有一个新的关键字，它可以创建符合 `constexpr` 函数规则但只能在编译时评估的函数。这类函数也称为“立即函数”（immediate\
