    int main() {\n  std::variant<Circle, Square, Triangle> shape;\n  shape = Triangle();\n\
    \  const auto callDraw = [](auto & sh) { sh.Draw(); };\n  std::visit(callDraw,\
    \ shape);\n}\n```\n\n这种技术是基于虚函数的运行时多态的替代方案。在这里我们可以处理无关的类型。不需要公共基类。你可以在我的博客文章中学习这种方法：使用\
    \ std::variant 和 std::visit 实现运行时多态。\n\n## 5. Lambda 随着 C++ 版本的更新不断改进\n\n以下是自\
    \ C++11 发布以来，每个 C++ 标准修订版获得的 Lambda 相关的主要功能列表：\n\n### C++14\n\n### C++17\n\n-\
    \ constexpr Lambda - 在 C++17 中，你的 Lambda 可以在 `constexpr` 上下文中工作。\n- 捕获 this 的改进\
    \ - 在 C++17 之前，该指针仅作为指针捕获，可能会导致悬空问题。在 C++17 中，你可以捕获由 *this* 表示的对象的拷贝。\n- 折叠表达式\n\
    \n### C++20\n\n- 模板 Lambda - 在 C++20 中，你可以在 Lambda 中直接使用模板参数。\n- 概念（Concepts）\
