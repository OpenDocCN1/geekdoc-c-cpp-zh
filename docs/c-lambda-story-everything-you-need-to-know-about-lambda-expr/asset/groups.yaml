  - '[PAGE 5]


    # About the Book


    The book shows the story of lambda expressions. You''ll learn how to use this
    powerful feature in a step-by-step manner, slowly digesting the new capabilities
    and enhancements that come with each revision.


    We''ll start with C++98/03, and then we''ll move on to the latest C++ Standards.


    +   - C++98/03 - how to code without lambda support. What was the motivation for
    the new modern C++ feature?

    - C++11 - early days. You''ll learn about all the elements of a lambda expression
    and even some tricks. This is the longest chapter as we need to cover a lot.

    - C++14 - updates. Once lambdas were adopted, we saw some options to improve them.

    - C++17 - more improvements, especially by handling this pointer and allowing
    constexpr.

    - C++20 - in this section we''ll have a glimpse of the future.


    Additionally, you''ll find techniques and handy patterns throughout the chapters
    for using lambda in your code.


    Walking through the evolution of this powerful C++ feature allows us not only
    to learn lambdas but also to see how C++ has changed over recent years. In one
    section you''ll see a technique and then it will be “iterated” and updated in
    further chapters when new C++ elements are available. When possible, the book
    cross-links to other related sections of the book.


    # Roots Of The Book


    The idea for the content started after a coding presentation given by Tomasz Kamiński
    at our local Cracow C++ User Group.


    I took the ideas from the presentation (with Tomek''s permission, of course )'
  - '[PAGE 6]


    and then created two articles that appeared at bfilipek.com:


    +   - Lambdas: From C++11 to C++20, Part 1

    - Lambdas: From C++11 to C++20, Part 2


    Later, I decided I wanted to offer my readers not only blog posts but a nice-looking
    PDF. Leanpub provides an easy way to create such PDFs, so it was the right choice
    to copy the articles’ content and create a Leanpub book.


    Why not move further?


    After some time, I decided to write more content, update the examples, better
    use cases and patterns. And here you have the book! It''s now almost four times
    the size of the initial material that is available on the blog!


    # Who This Book is For


    This book is intended for all C++ developers who like to learn all about a modern
    C++ feature: lambda expressions.


    # Reader Feedback


    If you spot an error, a typo, a grammar mistake... or anything else (especially
    logical issues!) that should be corrected, please send your feedback to bartlomiej.filipek
    AT bfilipek.com.


    You can also use this place:


    +   - Leanpub Book’s Feedback Page


    What’s more, the book has a dedicated page at GoodReads. Please share your review
    here:


    +   - C++ Lambda Story @GoodReads


    # Code License


    The code for the book is available under the Creative Commons License.'
