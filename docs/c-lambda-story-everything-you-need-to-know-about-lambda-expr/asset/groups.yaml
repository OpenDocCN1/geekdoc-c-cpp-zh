    \    captureTest(std::move(ptr), 2, 3, 4);\n    captureTest(std::move(ptr), 'a',\
    \ 'b');\n}\n```\n\n输出：\n\n0xf06cb20, 2, 3, 4\na, b\n\n在示例中，我们使用了一个打印对象，与我们在 C11\
    \ 章节中编写的代码相似，但这次我们捕获变量而不是而不是作为 Lambda 参数传递它们。\n"
