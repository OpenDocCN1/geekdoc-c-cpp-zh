    \ << '\\\\n';\n    std::cout << \"tuple ist: \" << std::get<0>(tuple) << '\\\\\
    n';\n    lambda(); // call it\n}\n\nint main() {\n    captureTest(1, 2, 3, 4);\n\
    \    captureTest(\"Hello world\", 10.0f);\n}\n```\n\nAfter running the code, we'll\
