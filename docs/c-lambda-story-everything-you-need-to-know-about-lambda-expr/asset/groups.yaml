    \n关于隐式 *this 捕获*。实时代码 @Wandbox\n\n```cpp\nstruct Baz {\n    auto foo() {\n   \
    \     return [=]() { cout << s << '\\n'; };\n    }\n    std::string s;\n};\n```\n\
    \n使用 GCC 9 编译会产生以下警告：\n\nwarning: implicit capture of 'this' ['=] is deprecated\
    \ in C++20\n\n警告的出现是因为，即使使用 `[=]`，你也会将 `this` 作为指针捕获。最好显式地写出你想要的：`[=, this]` 或\
