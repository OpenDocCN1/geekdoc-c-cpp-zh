    \n## C++17 章节\n\n- IIFE - 立即调用函数表达式 - 一种高效计算 `const` 变量值的方法，该方法需要复杂的初始化，而无需创建额外的函数。\n\
    - 传递 C++：将无捕获 lambda 作为函数指针传递给 C 风格 API 函数。\n- 如何在容器中存储 lambda - 我们可以使用一个小技巧，并存储封装在\
