- pgno: 110
  md: '# Changing the contents of a variable


    To change the value of a variable, simply assign a new value to it. Here, the
    variable "gifts" has the value 2. It changes to 3 when it''s assigned a new value.


    ```

    >>> gifts = 2

    >>> print(gifts)

    2

    >>> gifts = 3

    >>> print(gifts)

    3

    ```


    Changes the value of the variable


    ![](img/72d218a7a73c4d4abc7be582ebd85385_110_0.png)


    # Using variables


    The value of one variable can be assigned to another using the "=" sign. For example,
    if the variable "rabbits" contains the number of rabbits, we can use it to assign
    the same value to the variable "hats", so that each rabbit has a hat.


    > EXPERT TIPS


    # Naming variables


    There are some rules you have to follow when naming your variables:


    +   All letters and numbers can be used.

    You can''t start with a number.

    Symbols such as -, _, #, or @ can''t be used.

    Spaces can be used.

    An underscore (_) can be used instead of a space.

    Uppercase and lowercase letters are different. Python treats "Dogs" and "dogs"
    as two different variables.

    Don''t use words Python as a command, such as "print".


    +   Assign the variables

    This code assigns the number 5 to the variable "rabbits". It assigns the same
    value to the variable "hats".


    | Variable name | Value assigned to the variable |

    | >>> rabbits = 5

    >>> hats = 5 | "hats" now has the same value as "rabbits" |


    +   Print the values

    To print two variables, put them in brackets after the "print" command, and put
    a comma between them. Both "hats" and "rabbits" contain the value 5.


    +   Change the value of "rabbits"

    If you change the value of "rabbits", it doesn''t affect the value of "hats".
    The "hats" only changes when you assign it a new value.


    ```

    >>> print(rabbits, hats)

    5 5

    ```


    Leave a space after the comma


    ```

    >>> rabbits = 10

    >>> print(rabbits, hats)

    10 5

    ```


    "rabbits" a new value

    Value for "hats" remains the same


    ![](img/72d218a7a73c4d4abc7be582ebd85385_110_1.png)'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Types of data


    There are several different types of data in Python. Most of the time, Python
    will work out what type is being used, but sometimes you''ll need to change data
    from one type to another.


    # Numbers


    Python has two data types for numbers. “Integers” are whole numbers (numbers without
    a decimal point). “Floats” are numbers with a decimal point. An integer can be
    used to count things such as sheep, while a float can be used to measure things
    such as weight.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_111_0.png)


    ```

    >>> sheep = 1

    >>> print(sheep)

    1

    ```


    > An integer is a whole number


    ```

    >>> sheep = 1.5

    >>> print(sheep)

    1.5

    ```


    > 1.5 is a float


    +   - Integers

    An integer is a number without a decimal point, such as the 1 in the variable
    “sheep”.


    +   - Floats

    A float is a number with a decimal point, such as 1.5. They aren''t normally used
    to count whole objects.


    # Strings


    Just like in Scratch, a piece of text in Python is called a “string”. Strings
    can include letters, numbers, spaces, and symbols such as full stops and commas.
    They are usually put inside single quote marks.


    > Always remember that strings need quote marks at the start and the end.


    +   - Using a string

    To assign a string to a variable, put the text inside single quote marks.


    ```

    >>> a = ‘Coding is fun!’

    >>> print(a)

    Coding is fun!

    ```


    > The string in quotes


    > The value of the variable “a” printed out


    ![](img/72d218a7a73c4d4abc7be582ebd85385_111_1.png)'
