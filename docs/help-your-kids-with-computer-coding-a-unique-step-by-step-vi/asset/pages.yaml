- pgno: 153
  md: '# Libraries


    Writing new code takes time, so it''s useful to reuse bits of other programs.
    These snippets of code can be shared in packages called “libraries”.


    # Standard Library modules


    Python comes with a “Standard Library” that has lots of useful bits of code ready
    to use. Stand-alone sections of a library called “modules” can be added to Python
    to make it even more powerful.


    | SEE ALSO |

    | Making 154-155 > windows |

    | Color and 156-157 > coordinates |


    +   - Batteries included

    Python''s motto is "batteries are included". This means it comes with lots of
    ready-use code.


    +   - Random

    This module can pick a random number, or shuffle a list into a random order.


    +   - Turtle

    This module is used to draw lines and shapes on the screen.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_153_0.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_153_1.png)


    +   - Time

    The Time module gives the current time and date, and can calculate dates—for instance,
    what will it be in three days'' time?


    ![](img/72d218a7a73c4d4abc7be582ebd85385_153_2.png)


    +   - Tkinter

    Tkinter is used to make buttons, windows, and other graphics that help users interact
    with programs.


    +   - Math

    Use the Math module to work with complex mathematical calculations.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_153_3.png)


    +   - Socket

    The code in this module helps connect to each other over networks and the Internet.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_153_4.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_153_5.png)'
