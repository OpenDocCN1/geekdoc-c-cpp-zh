- pgno: 39
  md: '# Making things move


    Computer games are all about firing, dodging, catching, and escaping. Characters
    might run, spaceships, or drive fast cars. To create great games in Scratch, you
    need to learn how to make sprites move.


    # Motion blocks


    The dark blue “Motion” blocks make sprites move. Start a new project by clicking
    the "File" menu and choosing "New." The new project begins with the cat in the
    middle of the stage, ready for action.


    +   First steps

    Drag the "10 steps" block from the "Motion" section of the blocks palette and
    drop it into the scripts area to its right. Each time you click the block, the
    cat moves.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_39_0.png)


    +   Keep on moving

    Drag a "forever" block from the blocks palette and drop it around the "10 steps"
    block. Click the green flag on the stage to run the program. The cat moves until
    it hits the edge of the stage.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_39_1.png)


    +   Bouncing

    Drag an "if edge, bounce" block inside your "forever" block. Now the cat bounces
    when it hits the edge of the stage. The cat is upside down when it walks to the
    left.


    This block makes the cat turn around when it hits the edge of the stage


    ![](img/72d218a7a73c4d4abc7be582ebd85385_39_2.png)'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Which direction?


    The cat is marching left and right across the screen. It’s possible to change
    the cat’s direction, so it walks up and down, or even diagonally. The “Motion”
    blocks can be used to make a game of cat and mouse.


    The direction -90° means "left"


    ![](img/72d218a7a73c4d4abc7be582ebd85385_40_0.png)


    Click the block to make the cat change direction


    Select or type in a new number to change the direction of the cat


    # Heading the right way


    Drag the "point in direction" block into the scripts area and opens its drop-down
    menu. There are four directions to choose from. Or, click the number in the window
    and type in a new direction.


    +   point in direction 45

    (90) right

    (-90) left

    (0) up

    (180) down


    Directions are measured in degrees, from 0° at the top. You can use any number
    between -179 and +180.


    The cat will follow the mouse-pointer


    # Cat and mouse


    Remove the "move 10 steps" and "if on edge, bounce" blocks from the script. Now
    drag a "point" block into the "forever" block. Open the menu and choose "mouse-pointer".


    The drop-down menu gives you four options


    Click the green flag to start the program


    ![](img/72d218a7a73c4d4abc7be582ebd85385_40_1.png)


    +   when clicked

    forever

    point towards mouse-pointer


    ![](img/72d218a7a73c4d4abc7be582ebd85385_40_2.png)


    As the mouse-pointer moves, the cat turns to it


    # Chase the mouse


    Can the cat catch the mouse? Drag a "move 10 steps" block into the "forever" loop.
    Now the cat walks towards the mouse-pointer.


    +   when clicked

    forever

    point towards mouse-pointer

    move 10 steps


    Sprites are objects in a Scratch program that you can move around (see pp.28–29).
    Every new project stars the cat sprite, but you can add cats, dinosaurs, dancers,
    and all sorts of sprites from the library. You can even go go at designing your
    own.


    Adjust the number of steps to change the cat’s speed'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Costumes


    To change what a sprite looks like, its expression,

    or its position, you need to change its "costume."

    nCostumes are pictures of a sprite in different positions.


    > SEE ALSO


    < 38–39 Making

    things move


    Sending 70–71 >

    messages


    # Changing costumes


    Different costumes can make your sprite

    look like it''s moving its arms and legs. When

    you switch between the cat''s two costumes,

    it looks like it''s walking. Start a new project

    and try this example.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_41_0.png)


