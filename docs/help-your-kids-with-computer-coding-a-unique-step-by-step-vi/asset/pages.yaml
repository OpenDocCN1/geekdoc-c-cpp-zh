- pgno: 213
  md: '# Bad programs


    Not all programs are fun games or useful apps. Programs are designed to steal
    your data or damage your computer. They will often seem harmless, and you might
    not realize that you have been a victim.


    # Malware


    Programs that do things without your knowledge or permission are known as “malware”.
    Unauthorized access to a computer is a crime, but there are many different types
    of programs that try to sneak on your computer.


    +   Worm

    A worm is a type of malware that crawls around a network from computer to computer.
    Worms can clog networks, slowing them down—the first worm brought the Internet
    to a virtual standstill in 1988.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_213_0.png)


    +   Virus

    Just like a virus in the human body, this malware copies itself over and again.
    They are usually spread through emails, USB sticks, or other methods of transferring
    files between computers.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_213_1.png)


    +   Trojan

    Malware that pretends to be a harmless program is known as a “trojan”. The word
    comes from the Trojan War: the Greeks gave the Trojans a giant wooden horse, with
    soldiers inside. By breaching the Trojan defenses without detection, they won
    the


    | SEE ALSO |

    | 194-195 The Internet |

    | 202-203 Busy programs |


    # REAL WORLD

    Famous worm


    On May 5, 2000, Internet users in the Philippines received emails with the subject
    “ILOVYOU”. An attachment appeared to be a love letter, but was actually a piece
    of malware that corrupted files.


    +   ILOVYOU

    This worm quickly spreads to computers around the world. It is estimated to have
    cost more than $20 billion to fix the damage it caused.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_213_2.png)'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# What malware does


    Viruses, worms, and trojans are all types of malware that are created to get into
    your machine, but what do they do once they have infected their target? They might
    delete or corrupt files, steal passwords, or seek to control your machine for
    some larger purpose as part of an organized “zombie botnet”.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_214_0.png)


    +   > Zombie botnets

    Botnets are collections of infected computers that can be used to send spam emails,
    or flood a target website with traffic to bring it crashing down.


    # Good software to the rescue


    Thankfully, people aren’t defenseless in the fight against malware. Anti-malware
    software has become big business, with many providers competing to provide the
    best protection. Two well-known examples are firewalls and antivirus programs.


    | LINGO | Hackers |

    |---|---|


    Coders study and write malware are known as “hackers”. Those who write malware
    to commit crimes are known as “black-hat” hackers, and those who write programs
    to try to protect against malware are known as “white-hat” hackers.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_214_1.png)


    +   > Antivirus programs

    Antivirus software tries to detect malware. It identifies bad programs by scanning
    files and comparing their contents with a database of suspicious code.


    +   > Firewalls

    Firewalls aim to prevent malware and dangerous network traffic from reaching your
    computer. They can scan all incoming data from the Internet.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_214_2.png)


    | White-hat hacker | Black-hat hacker |

    |---|---|'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# 214 PROGRAMMING IN THE REAL WORLD


    # Mini computers


    Computers don''t have to be big or expensive. A wide range of small and cheap
    computers are available. Because of their small size and low cost, these computers
    are being used in lots of new and exciting ways.


    # SEE ALSO


    +   - 180–181 Inside a computer

    - 202–203 Busy programs


    # Raspberry Pi


    The Pi is a credit-card-sized computer, created to teach the basics of how computers
    work. For its size it is impressively powerful, with the ability to run similar
    programs to a modern PC.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_215_0.png)


    Audio output for headphones or speakers


    LED lights show the Pi is working


    Two USB connectors for a mouse, a keyboard, or any other add-ons


    Video output for older TVs


    Input and output pins for sensing and control (good for robots)


    Network connection to access the Internet


    Removable memory store operating systems, programs, and data


    HDMI video output—to connect to modern TVs


    Power connector


    # Arduino


    The Arduino is cheaper than the Pi, but less powerful. It is often used as a low-cost
    and simple way to build custom electronic or robotic machines.


    Many input and output pins make the Arduino very adaptable


    Microcontroller—a single-chip computer


    Reset button


    ![](img/72d218a7a73c4d4abc7be582ebd85385_215_1.png)


    Sockets for connecting the Arduino to other electronics


    USB connector used to load programs on the Arduino from a PC


    Power connector'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Using mini computers


    There are endless useful things a mini computer can do because of its many connection
    options. Here are just a few suggestions.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_216_0.png)


    +   ### Computer

    Connect a keyboard, mouse and monitor for a fully working desktop computer.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_216_1.png)


    +   ### Audio output

    Connect a set of speakers and then send music to them over the network.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_216_2.png)


    +   ### Mobile phones

    Connect the computer to the Internet using a mobile phone.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_216_3.png)


    +   ### Gadgets

    Connect LED lights and other simple electronics to make robots or gadgets.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_216_4.png)


    +   ### Television

    Connect a TV and use it as a media center to show all of your movies and pictures.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_216_5.png)


    +   ### Camera

    Connect a basic camera to your mini computer to create your own webcam.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_216_6.png)


    +   ### USB

    Connect a USB hard drive and share your files over your network.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_216_7.png)


    +   ### SD card

    Change the programs on your mini computer just by swapping SD cards.


    # REAL WORLD

    Home-built robots


    With their small size, cost, and weight, mini computers are being used more and
    more to build different types of robot. For example:


    Weather balloons that record weather conditions in the atmosphere.


    Mini vehicles that can sense obstacles using sonar like a bat.


    Robotic arms that pick up and move different objects.


