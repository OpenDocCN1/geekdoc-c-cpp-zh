- pgno: 29
  md: '# 28 STARTING FROM SCRATCH


    # Sprites


    Sprites are the basic components of Scratch. Every Scratch program is made up
    of sprites and the scripts that control them. The “Escape the dragon!” program
    on pages 32–37 uses the cat, dragon, and donut sprites.


    SEE ALSO

    (26–27 Scratch interface

    Costumes 40–41

    Hide and seek 42–43)


    # What can sprites do?


    Sprites are the images on the stage. Scripts are programmed to make them do things.
    Sprites can be instructed to react to other sprites and the user of the program.
    Here are a few things sprites can do:


    ![](img/72d218a7a73c4d4abc7be582ebd85385_29_0.png)


    +   Move around the stage


    +   React when they touch things


    +   Change their appearance


    +   Be controlled by the user


    +   Play sounds and music


    +   Talk in speech bubbles


    ![](img/72d218a7a73c4d4abc7be582ebd85385_29_1.png)


    # Sprites in the Scratch interface


    Each project can have several sprites, and each one can have its own scripts.
    It''s important to add scripts to the correct sprite, and to know how to switch
    between them.


    The sprites being belong to the sprite shown here


    ![](img/72d218a7a73c4d4abc7be582ebd85385_29_2.png)


    Select sprites by clicking on them


    +   Sprites and scripts

    A project can have lots of sprites, and each sprite can have lots of scripts.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Creating and editing sprites


    Games are more exciting when there are more sprites to hit, dodge, or chase each
    other after the stage. It''s simple to create, copy, and delete sprites.


    +   - Create a sprite

    Use the buttons below the sprite list to add or create a sprite for your program.


    +   - Copy or delete a sprite

    To copy a sprite and its scripts, right-click on it in the sprite list and choose
    "duplicate."


    ![](img/72d218a7a73c4d4abc7be582ebd85385_30_0.png)


    # Naming a sprite


    When you start a new program in Scratch the cat sprite is called "Sprite1.". It''s
    easier to write programs if you give your sprites more meaningful names. It also
    makes it easier to understand and manage scripts.


    +   1 Select the sprite

    Select a sprite in the sprite list, and click on the blue "i" button in the corner.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_30_1.png)


    +   2 Change the name

    When the information panel opens, click on the text box and use the keyboard to
    change the name of the sprite.


    +   3 Renamed sprite

    Click the blue arrow to the left of the sprite to close the information panel.


    Type the sprite''s new name here


    ![](img/72d218a7a73c4d4abc7be582ebd85385_30_2.png)'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Colored blocks and scripts


    Blocks are color-coded depending on what they do. Putting them together builds
    scripts that run in the order in which they are placed.


    SEE ALSO

    | 26-27 Scratch interface |

    | Escape the 32-37 dragon! |


    # Colored blocks


    There are ten different types of blocks in Scratch. Switch between them using
    the buttons in the blocks palette. Click on a color to see all the blocks in that
    section.


    | Scripts | Costumes | Sounds |

    | Motion | Events |

    | Looks | Control |

    | Sound | Sensing |

    | Pen | Operators |

    | Data | More Blocks |


    ![](img/72d218a7a73c4d4abc7be582ebd85385_31_0.png)


    # Functions of blocks


    Different types of blocks do different things in programs. Some of them make sprites
    move, manage some sounds, and some decide when things happen.


    Motion, looks, sound, and pen

    These blocks control what a sprite does on screen—this is called the output of
    a program. Pick a sprite and try each block to see what it does.


    Events and sensing

    Brown "Events" blocks make things happen. Light blue "Sensing" blocks detect information
    about the keyboard, mouse, and what a sprite is touching.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_31_1.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_31_2.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_31_3.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_31_4.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_31_5.png)


    Checks whether the spacebar is pressed'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Data and operators


    Orange “Data” blocks and green

    “Operators” blocks store numbers

    and words and do things with them.


    # Control


    The “Control” blocks make decisions about

    when blocks run. They can be programmed

    to repeat instructions.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_32_0.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_32_1.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_32_2.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_32_3.png)


    # Flow of scripts


    When a program runs, Scratch carries out the

    instructions on the blocks. It starts at the top

    of the scripts and works its way down.


    > The thoughtful cat

    When this script is used with the cat sprite,

    t cat will wait 2 seconds, think for

    moment, pause 1 second, and then move.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_32_4.png)


    Programs run

    to top

    bottom


    ![](img/72d218a7a73c4d4abc7be582ebd85385_32_5.png)


    To stop all scripts in a program

    that are running, click the red stop

    button above like a hexagon. You''ll find it beside

    t green flag button used to start

    y program.


    # Running scripts


    When a script is running, it glows. Use the green

    flag button on the stage to run a script or

    block to make it run.


    The glowing outline

    means this script

    is running


    ![](img/72d218a7a73c4d4abc7be582ebd85385_32_6.png)


    Press this

    button to stop a

    program


    ![](img/72d218a7a73c4d4abc7be582ebd85385_32_7.png)


    Testing scripts

    Test whether a script is

    working properly by

    clicking on it.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_32_8.png)


    *'
