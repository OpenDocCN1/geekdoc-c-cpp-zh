- pgno: 73
  md: "# Creating blocks\n\nTo avoid repeating the same set of blocks over and over\
    \ again, it is possible to take a shortcut by creating new blocks. Each new block\
    \ can contain several different instructions.\n\n# Making your own block\n\nYou\
    \ can make your own blocks in Scratch that run a script when they're used. Try\
    \ this example to see how they work. Programmers can use these reusable pieces\
    \ of code as \"subprograms\" or \"functions\".\n\n+   - Create a new block\nClick\
    \ on the \"More Blocks\" button, and select \"Make a Block\". Type the word \"\
    jump\" and click \"OK\".\n\n+   - New block appears\nYour new block \"jump\" appears\
    \ in the blocks palette, and a \"define\" block appears in the scripts area.\n\
    \n![](img/72d218a7a73c4d4abc7be582ebd85385_73_0.png)\n\n| Scripts | Costumes |\
    \ Sounds |\n|---|---|--|\n Motion | Events | |\n Looks | Control | |\n Sound |\
    \ Sensing | |\n Pen | Operators | |\n Data | More Blocks | |\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_73_1.png)\n\
    \nClick here\n\nto make a new block\n\n+   - Define the block\nThe \"define\"\
    \ block tells Scratch which blocks to run when using the new block. Add this script\
    \ to define the block.\n\n+   - Use the block in a script\nThe new block can now\
    \ be used in any script. It's as if jumping blocks were in the script individually.\n\
    \n```\ndefine jump\nchange y by 50\nwait 1 secs\nchange y by -50\n```\n\n```\n\
    when clicked\nforever\njump\nwait 1 secs\n```\n\nStarts your block definition\n\
    \nJumps up\n\nThe new block runs the jumping script that has already been defined\n\
    \nDrops down\n\nWaits 1 second before repeating the loop"
  merge: -1
  img_proc: true
