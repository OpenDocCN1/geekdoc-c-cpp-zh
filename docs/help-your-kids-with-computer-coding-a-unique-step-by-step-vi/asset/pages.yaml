- pgno: 20
  md: "# What is Python?\n\nPeople around the world use Python to build games, tools,\
    \ and websites. It's a great language to master because it can help you build\
    \ all kinds of different programs. Python looks like a mixture of recognizable\
    \ words and characters, so it can be easily read and understood by humans.\n\n\
    ```\nIDLE File Edit Shell Debug Window Help\nghostgame\n# Ghost Game\nfrom random\
    \ import randint\nprint('Ghost Game')\nfeeling_brave = True\nscore = 0\nwhile\
    \ feeling_brave:\n    ghost_door = randint(1, 3)\n    print('Three doors ahead...')\n\
    ```\n\nA program written in Python\n\n# Getting started\n\nIt's time to start\
    \ programming. All you need is a computer with an Internet connection. This book\
    \ starts with Scratch—the perfect language to help you on your way to becoming\
    \ a coding expert. Get ready to jump into the exciting world of computer coding.\n\
    \n![](img/72d218a7a73c4d4abc7be582ebd85385_20_0.png)\n\n> EXPERT TIPS\nEnjoy experimenting\n\
    \nAs a programmer you should experiment with the code and programs you make. One\
    \ of the best ways to learn programming is to play around and see what happens\
    \ when you change different parts of the code. By tinkering and fiddling, you'll\
    \ discover new ways of doing things. You'll learn much more about computer programming\
    \ and have even more fun."
