- pgno: 194
  md: '# Directories


    It’s easier to find files on a computer system if they are well organized. To
    help with this, files can be grouped together in “directories”, also known as
    “folders”. It’s often useful for directories to contain other directories in the
    form of a directory tree.


    +   - Directory tree


    When directories are placed inside other directories, it creates a structure that
    resembles an upside-down tree, and just like a tree it has roots and branches
    (confusingly called “paths”).


    > PERT TIPS


    # Managing files


    A file manager program helps find files and directories. Each operating system
    has different one:


    Windows: Use Windows Explorer to look around the directory tree.


    Apple: Use Finder to look around the directory tree.


    Ubuntu: Use Nautilus to look around the directory tree.


    The “root” of the directory tree, where you start looking for files


    This “path” contains Jack’s user data


