- pgno: 163
  md: "# # Reacting to events\n\nComputers receive a signal when a key is pressed\
    \ or a mouse is moved. This is called an “event”. Programs can instruct the computer\
    \ to respond to any events it detects.\n\n+   SEE ALSO\n* 158–159 Making shapes\n\
    * 160–161 Changing things\n\n# Event names\n\nLots of different events can be\
    \ triggered using input devices like a mouse or keyboard. Tkinter has names to\
    \ describe each of these events.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_163_0.png)\n\
    \n# Mouse events\n\n# Keyboard events\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_163_1.png)\n\
    \nTo make a program respond to mouse events, simply link (or bind) a function\
    \ to an event. Here, the function “burp” is created, then bound to the “Button-1”\
    \ event.\n\nThis brings the Tkinter window to the front of your screen\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_163_2.png)\n\
    \n```\nwindow.attributes('-topmost', 1)\ndef burp(event):\n    mouth_open()\n\
    \    c.itemconfig(words, text='Burp!')\nc.bind_all('<Button-1>', burp)\n```"
  merge: -1
  img_proc: true
- pgno: 164
  md: "# Key events\n\nFunctions can also be bound to keys on the keyboard in the\
    \ same way. Type in the code below to make the alien blink when the \"A\" and\
    \ \"Z\" keys are pressed.\n\n```\ndef blink2(event):\n  c.itemconfig(eye, fill='green')\n\
    \  c.itemconfig(eyeball, state=HIDDEN)\ndef unblink2(event):\n  c.itemconfig(eye,\
    \ fill='white')\n  c.itemconfig(eyeball, state=NORMAL)\nc.bind_all('<KeyPress-a>',\
    \ blink2)\nc.bind_all('<KeyPress-z>', unblink2)\n```\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_164_0.png)\n\
    \n**Make the alien blink**\nWhen this code is run, the \"A\" key will make the\
    \ eye close, and the \"Z\" key will make it open again.\n\n# Moving with keys\n\
    \nKey presses can also be used to trigger movement. This code binds the arrow\
    \ keys to functions that make the alien's eyeball movement.\n\n```\ndef eye_control(event):\n\
    \  key = event.keysym\n  if key == \"Up\":\n    c.move(eyeball, 0, -1)\nelif key\
    \ == \"Down\":\n    c.move(eyeball, 0, 1)\nelif key == \"Left\":\n    c.move(eyeball,\
    \ -1, 0)\nelif key == \"Right\":\n    c.move(eyeball, 1, 0)\nc.bind_all('<Key>',\
    \ eye_control)\n```\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_164_1.png)\n\n\
    **Eyeball control**\nThe eyeball moves in the direction of the pressed key."
  merge: -1
  img_proc: true
- pgno: 165
  md: '# PROJECT 7


    # # Bubble blaster


    This project uses all the skills taught in this chapter to make a game. It’s a
    big project, so tackle it in stages and remember to save the program regularly.
    Try to understand how each part fits together before moving on to the next stage.
    By the end you’ll have a game that you can play and share with friends.


    | SEE ALSO |

    | 154–155 Making windows |

    | 156–157 Color and coordinates |

    | 158–159 Making shapes |


    # ## Aim of the game


    Before writing any code, think about the overall plan for the game and how it
    should work. Here are the main rules that set out how the game will be played:


    +   - The player controls a submarine


    +   - The arrow keys move the submarine


    +   - Popping bubbles scores points


    +   - A timer is set to 30 seconds at the start


    +   - Scoring 1,000 points earns extra time


    +   - The game ends when the time runs out


    ![](img/72d218a7a73c4d4abc7be582ebd85385_165_0.png)'
