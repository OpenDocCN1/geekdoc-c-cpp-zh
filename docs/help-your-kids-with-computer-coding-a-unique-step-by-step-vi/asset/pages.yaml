  md: '# # Make some noise!


    Scratch programs don’t have to be silent. Use the pink “Sound” blocks to try out
    sound effects and create music. You can also use sound files you already have
    or record new sounds for your program.


    # ## Adding sounds to sprites


    To play a sound, it must be added to a sprite. Each sprite has its own set of
    sounds. To control them, click the “Sounds” tab above the blocks palette.


    | SEE ALSO |

    | Sensing 66–67 > and detecting |

    | Monkey 74–81 > mayhem |


