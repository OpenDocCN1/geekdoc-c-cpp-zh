  img_proc: true
- pgno: 55
  md: '# Strings and lists


    In programming, a sequence of letters and symbols is called a "string". Strings
    can contain any character on the keyboard (including spaces) and be of any length.
    Strings can also be grouped together in lists.


    > SEE ALSO

    < 50–51 Variables

    Strings 114–115 > in Python


    Keyboard characters are lined up as if they were hanging from a string


    ![](img/72d218a7a73c4d4abc7be582ebd85385_55_0.png)


    # Working with words


    +   Create a new variable

    Click the "Data" button in the blocks palette and click the "Make a Variable"
    button. Create a variable called "greeting".


    Programs often need to remember words, such as a player''s name. Variables can
    be created to remember these words. Scratch programs can also ask the user questions,
    which they answer by typing into a text box that pops up. The following script
    asks for the user''s name, and then makes a sprite say "Hello" to them.


    ```

    Make a Variable

    Make a List

    greeting

    ```


    Name your variable "greeting"


    Asking a question

    This script makes the sprite ask a question. Whatever the user types into the
    text box that pops up on the screen is stored in a new variable called "answer".
    The script then combines the strings contained in the "greeting" and "answer"
    variables to greet the user.


    This block puts "Hello" into the variable "greeting". Leave a space at the end
    of "Hello " to make the output of the program nearer


    ```

    when clicked

    set greeting to Hello

    ask What''s your name? and wait

    say join greeting

    ```


    The "ask" box (from the Sensing section of blocks palette) makes a text box appear,
    which the user types their answer


    The "answer" variable (from the "Sensing" section) contains whatever the user
    typed into the text box


    The "say" bubble creates a speech bubble for the sprite


    The "greeting" variable holds the string "Hello "'
