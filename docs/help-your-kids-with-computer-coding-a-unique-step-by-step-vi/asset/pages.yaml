    # Draw an alien


    You can draw almost anything by combining different shapes. Here are some instructions
    for creating an alien using ovals, lines, and triangles.


    +   Create the alien

    For each part of the alien, you must define the type of shape, size, position
    on the canvas, and color. Each shape has a unique ID number that can be stored
    in a variable.


    | from tkinter import * Sets ''Alien'' as the title of the window |

    window = Tk() |

    window.title(''Alien'') Creates the canvas |

    c = Canvas(window, height=300, width=400) Draws a green oval for the body |

    c.pack() | |

    body = c.create_oval(100, 150, 300, 250, fill=''green'') Draws a black dot inside
    the eye |

    eye = c.create_oval(170, 70, 230, 130, fill=''white'') |\eyeball = c.create_oval(190,
    90, 210, 110, fill=''black'') |

    mouth = c.create_oval(150, 220, 250, 240, fill=''red'') Draws a red oval for the
    mouth |

    neck = c.create_line(200, 150, 200, 230) | |

    hat = c.create_polygon(180, 75, 220, 75, 200, 20, fill=''blue'') Draws a blue
    triangle for the alien''s hat


    +   Meet the alien

    Run the code to draw the alien. It has a green body, a red mouth, and one eye
    on a stalk. It’s also wearing a lovely blue hat.


