- pgno: 61
  md: '# PROJECT 2


    # Roll the dice


    Simple programs can be both useful and fun. This program creates a dice that can
    be rolled. Play it to see who can get the highest number, or use it instead of
    a real dice when you play a board game.


    # How to create a rolling dice


    The dice in this program uses six costumes. Each costume shows a face of the dice
    with a different number on it—from one to six.


    +   Select the paintbrush button under the stage to draw a new sprite.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_61_0.png)


    +   Click the rectangle button on the left of the painting area. To make your
    dice colorful, select a solid color from the palette (see box below). Then in
    the painting area hold the "shift" key, press the mouse button, and drag the mouse-pointer
    to make a square in the middle.


    +   The rectangle button makes a square when the "shift" key is pressed


    > EXPERT TIPS


    # Changing colors


    Under the painting area are the color controls. Click the rectangle to draw a
    block of solid color. Use the empty rectangle to draw an outline of a square or
    rectangle. Use the slider to change the thickness of the square''s lines. To choose
    a color, simply click it.


    | SEE ALSO |

    | 40–41 Costumes |

    | 46–47 Simple loops |

    | 50–51 Variables |

    | 52–53 Math |


    | Click for outline of block | Click for block of solid color | Currently color
    |


    ![](img/72d218a7a73c4d4abc7be582ebd85385_61_1.png)


    | Change the line width using the slider | Click on this box for more colors |
    Choose a color from the color palette | Use this to select a color already on
    the drawing |'
