  md: "# Loops in Python\n\nPrograms that contain repeating lines of code can be time-consuming\
    \ to type in and difficult to understand. A clearer way of writing them is by\
    \ using a loop command. The simplest loops are those that repeat a certain number\
    \ of times, such as “for” loops.\n\nSEE ALSO\n| 48–49 Pens and turtles |\nWhile\
    \ loops 124–125 |\nEscaping 126–127 |\n\n# Repeating things\n\n“for” loop repeats\
    \ the code without having to type it again. It can be used to repeat something\
    \ certain number of times, for example, if you want to print the names of a class\
    \ of 30 students.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_123_0.png)\n\n+\
    \   Program the turtle\n- “for” loop can also be used to shorten the code. This\
    \ program allows the user to control a turtle that draws a line as it moves across\
    \ the screen, the user can draw shapes on the screen, by directing the turtle’s\
    \ movements.\n\n```\nfrom turtle import *\nforward(100)\nright(120)\nforward(100)\n\
    right(120)\nforward(100)\nright(120)\n```\n\n> Loads all the commands that control\
    \ the turtle\n\n> This command moves the turtle forward\n\nThis makes the turtle\
    \ turn 120 degrees to the right\n\n+   The turtle draws a triangle\n- The program\
    \ tells the turtle how to draw a triangle by giving it the length of the three\
    \ sides and the angles between them. The turtle will appear in a separate window\
    \ when you run the program.\n\n+   Use a “for” loop\n- The program gives the turtle\
    \ the same two commands, “forward(100)” and “right(120)”, three times – once for\
    \ each side of the triangle. An alternative to this is to use these two commands\
    \ inside a “for” loop. Try drawing a triangle simply using the code shown below.\n\
    \n```\nfor i in range(3):\n    forward(100)\n    right(120)\n```\n\n> The “for”\
    \ loop tells the program to repeat the instructions three times\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_123_1.png)\n\
    \nThe turtle in Python\n\n> The block of instructions in a loop is indented by\
    \ four spaces\n\n> The program makes a triangle"
