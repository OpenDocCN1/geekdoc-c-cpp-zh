    > Circuits in a processor

    The circuits are kept synchronized by a clock pulse, just like an orchestra is
    kept in time by a conductor.


    # Machine code


    Processors only understand a set of program instructions called "machine code".
    These simple instructions for operations like adding, subtracting, and storing
    data are combined to create complex programs.


