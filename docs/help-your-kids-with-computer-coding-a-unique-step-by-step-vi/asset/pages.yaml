- pgno: 162
  md: "# Hide and show\n\nShapes can be hidden using the \"itemconfig() function.\
    \ If you hide the eyeball, and then show it again a moment later, the alien looks\
    \ as though it is blinking.\n\nBlinking alien\nTo make the alien blink, you need\
    \ to hide the pupil and make the white of the alien green.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_162_0.png)\n\
    \n+   Create blinking functions\nThis code creates two functions so you can make\
    \ the alien blink.\n\nBlink and unblink\nType this code into the shell window\
    \ to make the alien blink.\n\nTurns the white of the alien green\n\n```\ndef blink():\n\
    \  itemconfig(eye, fill='green')\n  itemconfig(eyeball, state=HIDDEN)\ndef unblink():\n\
    \  white again\n  itemconfig(eye, fill='white')\n  itemconfig(eyeball, state=NORMAL)\n\
    ```\n\n```\n>>> blink()\n>>> unblink()\n```\n\nThe shape's ID\n\n\"unblink()\"\
    \ncommand makes the eye appear open again\n\nHides the pupil\n\nReveals the pupil\n\
    \n# Saying things\n\nText can also be displayed on the screen to make the alien\
    \ talk. You can even make it say different things in response to user commands.\n\
    \n> I am an alien!\n\n+   Adding text\nThis code adds text to the graphic of the\
    \ alien and creates a function to steal its hat.\n\nPositions the text\non the\
    \ canvas\n\nPut what you want\nthe alien to say in\nquote marks\n\n```\nwords\
    \ = c.create_text(200, 280, text='I am an alien!')\ndef steal_hat():\n  itemconfig(hat,\
    \ state=HIDDEN)\n  itemconfig(words, text='Give my hat back!')\n```\n\nHides the\n\
    hat\n\nAs soon as the hat\ndisappears the alien\nwill ask for it\n\nA new message\n\
    appears when the\nhat\n\n+   Steal the hat\nType this code into the shell window\n\
    and see what happens.\n\nType this to\nsteal the hat\n\n```\n>>> steal_hat()\n\
    ```\n\nGive my hat back!"
