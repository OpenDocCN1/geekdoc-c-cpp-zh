    \ \"note\" first\n\nThe tempo is measured in beats per minute, or \"bpm.\"\n\n\
    Increase the tempo to make your music faster, or use a negative to make it slower.\n\
    \n```\nchange tempo by [60]\n```\n\n```\ntempo\n```\n\nChecking this box makes\
