- pgno: 190
  md: '# Memory


    Like processors, memory chips are printed on silicon. A few logic gates are combined
    to create a “latch circuit”. Each stores one bit (the smallest unit of data by
    a binary value of either 1 or 0), and many latches are combined to create megabytes
    and gigabytes of storage.


    # RAM


    Memory is often referred to as RAM ("Random Access Memory”), meaning any part
    of it can be accessed directly. Early types of storage could only access data
    in order from start to end, which was much slower.


    Memory is made up of repeated identical blocks of circuit


    Every item of data has a number (called an "address") so it can be found quickly


    Each block of memory can store millions or billions of bits of data


    Programs and data

    Programs constantly read, write, and update the data stored in the memory.


    # Processing information


    The processor and memory, when combined with input and output devices, give you
    everything you need for a computer. In a game program, for example, the user inputs
    data by clicking the mouse, the processor does the calculations, reads and writes
    memory, and then produces output in the form of making the character jump on the
    screen.


    Contains the position of the character


    A game program running


    Memory click


    The character jumps on screen'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Essential programs


    There are a few programs that every computer needs in order to work. Some of the
    most important programs are operating systems, compilers, and interpreters.


    # Operating system


    The operating system (OS) is the manager of the computer''s resources. It controls
    which programs are allowed to run, how long they run for, and which parts of the
    computer they use interfaces, such as file browsers, to let a user interact with
    the computer. Common operating systems include Windows and Mac OS X.


    This program has run and is now waiting for its next slice of processor time


    Each program has its own space in the computer''s memory


    ![](img/72d218a7a73c4d4abc7be582ebd85385_191_0.png)


    The operating system is like an octopus, with tentacles connecting to all parts
    of the computer


    The operating system manages the processor''s time


    +   - How it works


    The processor''s time is divided into slices. A program will be given a slice.
    If it can''t finish in that time, it is paused and the next program runs.


    This program is waiting to run'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Compilers and interpreters


    The languages you write programs with, such as Python, are known as “high-level
    languages”. Computer processors do not understand these languages, so compilers
    and interpreters are used to translate them into a low-level language (known as
    “machine code”) that a computer does understand.


    # Compiler


    ![](img/72d218a7a73c4d4abc7be582ebd85385_192_0.png)


    Compiler

    Compilers produce translated machine code that can be saved and run later.


    # Interpreter


    Interpreter

    Interpreters translate the code and execute the program at the same time.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_192_1.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_192_2.png)


    +   - Links to monitor

    - Links to keyboard

    - Links to speaker

    - Links to mouse

    - Links to printer

    - Links to network

    - Links to storage


    > The OS acts as a bridge between the programs you want to run and the computer’s
    hardware'
