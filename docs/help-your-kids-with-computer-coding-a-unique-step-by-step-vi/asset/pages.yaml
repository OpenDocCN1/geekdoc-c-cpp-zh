  md: "# Two ways to separate strings\n\nSo far, the output has been printed on one\
    \ line with a space between the items. Here are two ways of separating strings.\n\
    \n```\n>>> print(a, b, c, sep='-')\nDave-is-12\n```\n\nHyphenate the outputs\n\
    A hyphen can be put between the variables when they're printed. Other characters,\
    \ such as \"+\" or \"*\" can be used too.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_118_0.png)\n\
    \n```\n>>> print(a, b, c, sep='\\n')\nDave\nis\n12\n```\n\nOutputs on new lines\n\
    The space or character between the outputs is called a \"separator\" (\"sep\"\
    ). Using \"\\n\" prints each output on a new line.\n\n# Three ways to end output\n\
    \nThere are several different ways to signal the end of the output of a \"print\"\
    \ function.\n\n```\n>>> print(a, ' ')\nDave .\n```\n\n```\n>>> print(a, end='.')\n\
    Dave .\n```\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_118_1.png)\n\n# Options\
    \ at the end\n\nThe \"end\" and \"sep\" labels tell Python that the next item\
    \ in the program isn't just another string. Remember to use them; otherwise, the\
    \ program will not work correctly.\n\n+   Add a period to the output\nA period\
    \ can be added as another string to be printed, but it will print with a space\
    \ before it. To avoid this, use \"end='.'\" instead.\n\n```\n>>> print(a, end='\\\
    n\\n\\n')\nDave\n```\n\n```\n>>> for n in range(3):\n    print('Hurray!', end='\
    \ ')\nHurray! Hurray! Hurray!\n```\n\n+   Output on one line\nUsually, each new\
    \ \"print\" command starts on a new line. To get the output all on one line use\
    \ a space as the \"end\" character.\n\n+   Blank lines at the end\nUsing \"\\\
    n\" starts each output from a new line. Several of them can be used together to\
