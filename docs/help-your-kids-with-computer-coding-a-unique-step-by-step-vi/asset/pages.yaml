- pgno: 66
  md: '# # Branching instructions


    Often you want a program to do one thing if a condition is true, and something
    else if it is not. The "if-then-else" block gives a program two possible routes,
    called "branches". Only one branch will run, depending on the answer to the Boolean
    expression.


    # Branching program


    This program has two branches: one will run if the answer is "yes", and the other
    run if it is not.


    # Is answer yes?


    ![](img/72d218a7a73c4d4abc7be582ebd85385_66_0.png)


    This branch will run if the answer to the question is "yes"


    ![](img/72d218a7a73c4d4abc7be582ebd85385_66_1.png)


    # How it works


    The program checks whether you typed in "yes". If so, it shows the first message.
    If not, it shows the second.


    # EXPERT TIPS


    # Boolean shapes


    The Boolean expression blocks in Scratch have pointed ends. You can put them into
    some nonpointed shaped holes to.


    This branch will run if the answer to the question is anything except "yes"


    ![](img/72d218a7a73c4d4abc7be582ebd85385_66_2.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_66_3.png)


    # "Sensing" blocks


    These blocks can test whether a sprite is touching another sprite, or whether
    a button is pressed.


    # "Control" blocks


    Several "Control" blocks have Boolean-shaped holes in them for Boolean expressions.


    # Branches


    The branches of a tree, branches of a program split and go in different directions.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# STARTING FROM SCRATCH


    # Sensing and detecting


    The "Sensing" blocks enable a script to see what is happening on your computer.
    They can detect keyboard controls, and let sprites react when they touch each
    other.


    | SEE ALSO |

    | 40–41 Costumes |

    | 56–57 Coordinates |


    # Keyboard controls


    Using "Sensing" blocks with "if-then" blocks allows you to move a sprite around
    the screen using the keyboard. The "key pressed?" block has a menu of most of
    the keys on the keyboard, so a sprite can be programmed to react to any. You can
    also link actions to the click of a mouse button.


    This block checks if a key is being pressed. You can choose which key to check.


    ```

    key space ▼

    ```


    This block checks if the mouse button is being pressed


    ```

    mouse down?

    ```


    Putting everything inside a "forever" block repeats the checks for key presses


    "Sensing" blocks Adding these inside an "if-then" block allows the program to
    detect if a mouse button or key is being pressed.


    The script checks to see if the arrow is pressed. If it is, the sprite moves upwards
    on the screen


    ```

    when clicked

    if key up arrow pressed? then

    change y by -10

    ```


    ```

    if key down arrow pressed? then

    change y by -10

    ```


    ```

    if key left arrow pressed? then

    change x by -10

    ```


    ```

    if key right arrow pressed? then

    change x by -10

    ```


    ![](img/72d218a7a73c4d4abc7be582ebd85385_67_0.png)


    Controlling sprites

    Keyboard controls give you precise control over your sprites, which is especially
    useful in games.


    Movement script

    This script lets you move sprites up, down, left, or right using the arrow keys
    on the keyboard.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_67_1.png)'
  merge: -1
  img_proc: true
- pgno: 68
  md: "# Sprite collisions\n\nIt can be useful to know when one sprite touches another—in\
    \ games, for example. Use “Sensing” blocks to make things happen when sprites\
    \ touch each other, or when a sprite crosses an area that is a certain color.\n\
    \n![](img/72d218a7a73c4d4abc7be582ebd85385_68_0.png)\n\n> Use this block to identify\
    \ when a sprite touches another\n\n> This block senses when a sprite touches an\
    \ area of a particular color\n\n# Using “Sensing” blocks\n\nUse the “Sensing”\
    \ blocks to turn your controllable cat into a game. Start by adding the movement\
    \ script created on the opposite page to the cat sprite, then add the “room1”\
    \ backdrop and the elephant sprite. Using the “Sounds” tab, add the “trumpet2”\
    \ sound effect to the elephant, then build it it script.\n\n+   Find the elephant\n\
    \nThis script uses “Sensing” blocks to control the relationship between the cat\
    \ and the elephant. As the cat gets nearer, the elephant grows. When the cat touches\
    \ it, the elephant switches costume, makes a sound, and hides somewhere else.\n\
    \n![](img/72d218a7a73c4d4abc7be582ebd85385_68_1.png)\n\n> The “forever” loop keeps\
    \ sensing and adjusting the elephant’s size and position\n\n> This checks how\
    \ far the cat is from the elephant\n\n```\nwhen clicked\nforever\n  set size to\
    \ 200\n  distance to Sprite1 %\n  if touching Sprite1 ? then\n    switch costume\
    \ to elephant-b\n    play sound trumpet2 until done\n    switch costume to elephant-a\n\
    \  go to x: pick random (-240) to (240) y:\n```\n\nThe farther away the cat is,\
    \ the smaller the elephant will be\n\n> If the sprites touch, the blocks inside\
    \ the “if-then” block run\n\n> This block selects a random place for the elephant\
    \ to hide"
