  md: '# Ghost game decoded


    The ghost game displays some of the key features of Python. You can break down
    the code to see how the program is structured and what the different parts of
    it do.


    # Code structure


    Python uses spaces at the start of lines to work out which instructions belong
    together. These spaces are called "indents". For example, the code after "feeling_brave"
    is indented by four spaces to show it''s all part of the main loop.


    # SEE ALSO


    +   - 96-97 Ghost game

    - Program 100-101 flow


    ![](img/72d218a7a73c4d4abc7be582ebd85385_99_0.png)


    Game setup


    The main loop


    Code key


    This diagram shows the structure of the ghost game. The numbered parts are explained
    in more detail below.


    Branching part


    This is a "comment". It''s not shown when the game is run


    Game ending


    # Game setup


    These instructions only run once—at the beginning of the game. They set the title,
    variables, and the "randint" command.


    # # Ghost Game


    ```

    from random import randint

    print(''Ghost Game'')

    feeling_brave = randint(0)

    ```


    This sets up the "randint" command, which generates random numbers


    The "print" command displays text when the game is run


    This resets the score


    # EXPERT TIPS


    # Type carefully


    When using Python, enter the code very carefully. If you leave out a colon, quotation
    mark, or parenthesis, the program will not work properly. You need to match the
    use of capital letters and spaces exactly too.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_99_1.png)'
