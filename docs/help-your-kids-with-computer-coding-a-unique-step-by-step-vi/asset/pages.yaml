- pgno: 161
  md: "# Changing things\n\nOnce a graphic has been drawn on the canvas, it doesn't\
    \ need to stay the same. Code can be used to change how it looks, or move it around\
    \ the screen.\n\n> SEE ALSO\n< 158–159 Making shapes\nReacting to 162–163 >\n\n\
    # Moving shapes\n\nTo make a shape move on the canvas, you need to tell the computer\
    \ what to move (the name or ID you gave the shape) and where to move it.\n\n>\
    \ REMEMBER\nMful names\nIt's a good idea to use sensible names to identify the\
    \ shapes on the canvas. These pages use names like \"eyeball\" and \"mouth\" so\
    \ the code is easy to read and understand.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_161_0.png)\n\
    \nThe eyeball\nturns left, then\nback again\nShape's name,\nor ID\n\n```\n>>>\
    \ c.move(eyeball, -10, 0)\n>>> c.move(eyeball, 10, 0)\n```\n\nMoving eyeballs\n\
    Type this code into the shell\nwindow to make the eyeball turn\nto the left, then\
    \ turn back again.\n\nThis function\nmoves shapes\nSets coordinates\nfor the movement\n\
    \n# Changing colors\n\nYou can make the mouth look as though\nit is opening and\
    \ closing by simply\nchanging the color of the oval.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_161_1.png)\n\
    \nMouth open\nMouth closed\n\n+   Write the code\nType this code to create two\n\
    functions that will make the mouth\nseem to open and close.\n\nThe function\n\"\
    itemconfig() changes\nthe properties\nof shapes you use\nalready drawn\n\nThe\
    \ opened\nmouth will\nbe black\n\n+   Open and close\nType this code into the\
    \ shell window\nto make the mouth open and close.\n\n```\ndef mouth_open():\n\
    \    c.itemconfig(mouth, fill='black')\ndef mouth_close():\n    c.itemconfig(mouth,\
    \ fill='red')\n```\n\nThe shape's ID\nThe closed\nmouth will\nbe red\n\n```\n\
    >>> mouth_open())\n>>> mouth_close()\n```\n\nUse these commands to\nmake the alien\
    \ open and\nclose its mouth"
