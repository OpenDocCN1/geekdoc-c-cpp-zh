- pgno: 70
  md: '# # Waiting


    It''s easier to play a game or see what''s going on in a program if you can make
    a script pause for a moment. Different blocks can make a script wait a seconds
    or until something is true.


    > > Waiting blocks The "wait secs" block waits a set amount of time. The "wait
    until" block responds to what''s happening in the program.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_70_0.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_70_1.png)


    +   "wait secs" block With the "wait secs" block you can enter the number of seconds
    you want a sprite to wait.


    +   "wait until" block This block waits until the Boolean expression in it is
    true.


    # # Magnetic mouse


    Different loops can be used together to make programs. This program starts once
    the mouse button is pressed. The sprite follows the mouse-pointer until the mouse
    button is released. It then jumps up and down five times. The whole thing repeats
    itself because it''s all inside a "forever" loop.


    As soon as the condition is true, the sprite moves to the mouse-pointer


    The script repeats until the mouse button is released


    ![](img/72d218a7a73c4d4abc7be582ebd85385_70_2.png)


    The "not" detects when the mouse button is not being pressed


    ![](img/72d218a7a73c4d4abc7be582ebd85385_70_3.png)


    This makes the sprite jump up


    This makes the sprite drop down


    +   Nested loops pay careful attention to how the loops are nested inside the
    "forever" loop.


    The "repeat 5" block makes the sprite jump up and down five times'
  merge: -1
