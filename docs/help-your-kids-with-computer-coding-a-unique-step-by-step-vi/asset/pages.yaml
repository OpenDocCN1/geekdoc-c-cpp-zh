- pgno: 200
  md: '# Languages from the past


    Many languages that were famous twenty or thirty years ago have fallen in popularity,
    despite still being used in very important systems. These languages are often
    seen as difficult to code by modern standards.


    # BASIC


    Designed in 1964 at Dartmouth College, in the US, BASIC was very popular when
    home computers first became available.


    # Millennium bug


    Many programs in other languages like COBOL used two digits to represent a year
    (such as up for 1999). The "millennium bug" was predicted to cause problems in
    2000 when these dates rolled over into the new millennium as 00.


    # Fortran


    Designed in 1954 at IBM, a technology firm, Fortran is mainly used for calculations
    on large computers. It is still being used in weather forecasting.


    Computers all over the world had to be updated to prevent the millennium bug


    ![](img/72d218a7a73c4d4abc7be582ebd85385_200_0.png)


    # COBOL


    Designed in 1959 by a committee of experts, COBOL is still being used in many
    business and banking programs.


    # Weird languages


    Among the thousands of languages a few have been created for very specific and
    strange purposes.


    ```

    (&*99]-1)-j2XwvW-POqONSHijg%B@a=<M:9)p6tls1TS/

    QJO]L(&$7"~Z-A@UZ=Ruvtt$R5p3mLEHD,T*(&b$87!|W

    ```


    +   Malbolge


    The Malbolge language was designed to be impossible to program. The first working
    code did not emerge until two years after its release, and was written by another
    program.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_200_1.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_200_2.png)


    +   Piet


    Programs created in Piet code look like abstract art. The "Hello World!" program
    is shown above.


    +   Chef


    A program written in Chef is meant to resemble a cooking recipe. However, in practice,
