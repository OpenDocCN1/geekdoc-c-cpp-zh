- pgno: 195
  md: '# The Internet


    The Internet is a network of computers all across the world. With so many computers,
    clever systems are needed to make sure information goes to the right place.


    # IP addresses


    Every computer or phone connected to the Internet has an address, much like a
    building. The addresses are called "Internet Protocol (IP) addresses" and each
    one is made up of a series of numbers.


    +   SEE ALSO

    * 182-183 Binary and bases

    * 192-193 Storing data in files


    +   Sending information

    Files travel between computers in small chunks called packets. Special computers
    called routers forward these packets to their destination.


    Receiving computer accepts packets


    Packets are put back together in the right order


    Sending computer transmits data


    ![](img/72d218a7a73c4d4abc7be582ebd85385_195_0.png)


    Packets hop from router to router around the globe


    File is broken down into small chunks of data called packets


    > EXPERT TIPS

    Internet protocol


    A protocol is a list of rules.

    "Internet Protocols" are rules for how big packets can be and how they are structured.
    All Internet devices must follow these rules if they want to be able to communicate
    with each other.


    +   to...

    10.150.93.22

    from...

    62.769.20.57


    +   Address information

    Every packet of data is labeled with the destination and sender''s IP addresses.
    Domain names like "dk.com" are translated into IP addresses.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Moving data


    Before packets can be sent between devices, they have to be translated into binary
    signals (ones and zeros) that can travel over great distances. Every device on
    the Internet has a "network adapter" to perform this task. Different devices send
    data in different forms.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_196_0.png)


    +   Electrical signals

    Copper wires carry ones and zeros as electrical signals of different strengths.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_196_1.png)


    +   Light

    Special glass fibres, called fibre optic cables, transmit data as pulses of light.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_196_2.png)


    +   Radio waves

    Different types of radio waves carry ones and zeros without using wires.


    # Ports


    Just as you mail a letter to a specific person in an apartment building, you may
    want to send packets to a specific program on a device. Computers use numbers
    called "ports" as addresses for individual programs. Some common programs have
    ports specially reserved for them. For example, web browsers always receive packets
    through port number 80.


    +   Port numbers

    The numbers used for ports range from 0 to 65535 and are divided into three types:
    well-known, registered, and private.


    A device''s IP address is like the street address of a building


    # IP 165.193.128.72


    A port within a device is like an apartment in a building


    Routers deliver packets like mailmen to the correct addresses


    ![](img/72d218a7a73c4d4abc7be582ebd85385_196_3.png)


    > EXPERT TIPS


    The combination of an IP address and a port is known as a "socket". Socket let
    programs send data directly to each other across the Internet, which is useful
    for things such as playing online games.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_196_4.png)'
  merge: -1
  img_proc: true
