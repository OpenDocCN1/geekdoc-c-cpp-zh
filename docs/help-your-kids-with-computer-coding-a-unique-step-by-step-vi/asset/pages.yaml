    # EXPERT TIPS

    One script at a time


    There’s an important difference between Scratch and Python. In Scratch, lots of
    scripts can run at the same time. however, the program is made of only one script.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_102_0.png)


    +   Input

    In Python, the "input()" function takes an input from the keyboard. It’s similar
    to the "ask and wait" block in Scratch.


    The question in the Scratch block


    ```

    door = input(''1, 2 or 3?'')

    ```


    "ask and wait" Scratch block


    +   Processing

    Variables are used to keep track of the score and the function "randint" picks
    a random door. Different blocks are used to do these things in Scratch.


    This Scratch block sets the value of the variable "score" to 0


