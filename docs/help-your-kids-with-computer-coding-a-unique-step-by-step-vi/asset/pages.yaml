    Computers use binary code to translate numbers into electrical signals. But how
    would a computer use binary code to store the words and characters on this page?


    # ASCII


    The first computers each stored characters in their own unique way. That worked
    fine until date was needed to be moved between computers. At this point, a common
    system was chosen, the American Standard Code for Information Interchange (ASCII,
    pronounced "akey").


