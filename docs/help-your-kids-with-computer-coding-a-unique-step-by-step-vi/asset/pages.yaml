  md: "# The main loop\n\nThis loop tells the story and receives the player's guess.\
    \ It keeps going on as long as there isn't a ghost behind the door that's picked.\
    \ When a ghost appears, the \"feeling_brave\" variable changes to \"False\" and\
    \ the loop stops repeating.\n\n```\nwhile feeling_brave:\n```\n\n```\n  ghost_door\
    \ = randint(1, 3)\n```\n\n```\n  print('Three doors ahead...')\n```\n\n```\n \
    \ print('A ghost behind one.')\n```\n\nThis selects a random number between 1\
    \ and 3\n\n```\n  print('Which door do you open?')\n```\n\nThe \"print\" command\
    \ displays the text on screen\n\n```\n  door = input(1, 2 or 3?)\n```\n\nThis\
    \ line asks for the player's\n\n```\n  door_num = int(door)\n```\n\n# Branching\
    \ point\n\nThe program takes a different path depending on whether or not there\
    \ is a ghost behind the door that was picked. If there was a ghost, the \"feeling_brave\"\
    \ variable is set to \"False\" if not, the player's score increases by one.\n\n\
    ```\nif door_num == ghost_door:\n```\n\n```\n  print('GHOST!')\n```\n\nThis branch\
    \ runs if there's a ghost behind the door the player picks\n\n```\n  feeling_brave\
    \ = False\n```\n\n```\nelse:\n```\n\nIf there's no ghost, the player sees this\
    \ room.\n\n```\n  print('No ghost!')\n```\n\n```\n  print('You enter the next\
    \ room.')\n```\n\n```\n  score = score + 1\n```\n\nThis shows a message telling\
    \ the player to run away from the ghost\n\n# Game ending\n\nThis runs just once,\
    \ when you meet the ghost and the loop ends. Python knows this isn't part of the\
    \ loop because it's indented.\n\n```\nprint('Run away!')\n```\n\n```\nprint('Game\
    \ over! You scored', score)\n```\n\nThe score is a variable—it change depending\
    \ on how many rooms the player gets through\n\n# REMEMBER\n\n# Achievements\n\n\
    Congratulations—you've created your first Python game! You'll learn more about\
    \ these commands in the book, but you've already achieved a lot:\n\nRun a program:\
