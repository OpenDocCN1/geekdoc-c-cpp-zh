  md: '# Tuples and dictionaries


    Python uses lists for keeping data in order. It also has other data types for
    storing information called “tuples” and “dictionaries”. Data types such as these,
    which hold lots of items, are called “containers”.


    # Tuples


    Tuples are a bit like lists, but the items inside them can''t be changed. Once
    a tuple is set up it always stays the same.


    SEE ALSO

    | 110–111 Types of data |

    | 128–129 Lists |


    ![](img/72d218a7a73c4d4abc7be582ebd85385_135_0.png)


    > Tuples are surrounded by brackets


    What is a tuple?

    A tuple contains items separated by commas and surrounded by brackets. Tuples
    are useful for collecting several bits of data, such as a dragon''s name, age,
    and height.


    ```

    >>> dragonA = (''Sam'', 15, 1.70)

    >>> dragonB = (''Fiona'', 16, 1.68)

    ```


    > The items in a tuple are separated by commas


    ![](img/72d218a7a73c4d4abc7be582ebd85385_135_1.png)


    Grabbing an item from a tuple

    Get an item from a tuple, use its position in the tuple (its index). Tuples count
    from zero, just like lists and strings.


    ```

    >>> dragonB[2]

    1.68

    ```


    > This selects the item from position 2


    ```

    >>> name, age, height = dragonA

    >>> print(name, age, height)

    Sam 15 1.7

    ```


    Splitting a tuple into variables

    Assign variables to the tuple “dragon”—”name”, “age”, and “height”. Python splits
    the tuple into three items, putting one in each.


    > The items that make up the tuple “dragon” are displayed separately


    Create a list of tuples

    Lists go in square brackets


    +   Putting tuples in a list

    Tuples can be put into a list containers can go inside each other. Use this code
    to create a list of tuples.


    ```

    >>> dragons = [dragonA, dragonB]

    >>> print(dragons)

    (''Sam'', 15, 1.7), (''Fiona'', 16, 1.68)]

    ```


    Each tuple is surrounded by round brackets inside the list''s square brackets


    Python displays all the items that are in the list, not just the names of the
    tuples'
