- pgno: 95
  md: '# # Errors


    Sometimes programs don’t work the first time, but they can always be fixed. When
    code for a program isn’t entered correctly, Python will display an error message
    telling you what has gone wrong.


    # ## Errors in the code window


    When trying to run a program in the code window, you might see a pop-up window
    appear with an error message (such as "SyntaxError") in it. These errors stop
    the program from running and need to be fixed.


    SEE ALSO

    Bugs and 148-149 > debugging

    What next? 176-177 >


    +   1. Syntax error

    If a pop-up window appears with a "SyntaxError" message, it often means there’s
    a spelling mistake or typing error in the code.


    +   2. Error highlighted

    Click "OK" in the pop-up window and you’ll go back to your program. There will
    be a red highlight on or near the error. Check that line matters carefully.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_95_0.png)


    ```

    print(''Hello World''!)

    ```


    > There is a missing quote mark here

    The error is highlighted


    # ### EXPERT TIPS: classic errors


    Some mistakes are particularly easy to make. Keep an eye out for these common
    problems:


    +   **Upper vs lower case:** The case has to match exactly. If you write "Print"
    instead of "print", Python won’t understand the instruction.

    **Single and double quotes:** Don’t mix up single and double quotes. All quotes
    needs a matching closing quote.

    **Minus and underscore:** Underline can confuse the minus (-) with the underscore
    (_).

    **Different brackets:** Different-shaped brackets, such as (), and [], are used
    for different things. Use the correct ones, and check there’s a complete pair.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Errors in the shell window


    Sometimes, an error message will appear in red text in the shell window. This
    will also stop the program from working.


    # Name error


    If the error message "NameError" appears, it means Python can''t understand one
    of the words that has been used. If the error is in code in the code window, right-click
