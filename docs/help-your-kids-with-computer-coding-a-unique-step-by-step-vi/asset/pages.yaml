- pgno: 129
  md: '# Lists


    If you need to keep lists of data in one place, you can put it in a list. Lists
    can contain numbers, strings, other lists, or a combination of all these things.


    # What is a list?


    A list is a structure in Python where items are kept in order. Each entry is given
    a number that you can use to refer back to it. You can change, delete, or add
    to the items in a list at any point.


    +   Looking at lists


    Each item in a list sits inside single quote marks, and is separated from the
    next item by a comma. The whole list sits inside a pair of square brackets.


    The list is stored in the variable `mylist`


    ```

    >>> mylist = [''apple'', ''milk'', ''cheese'', ''icecream'', ''lemonade'', ''tea'']

    ```


    This character is used to make code over two lines


    The items in the list sit inside a pair of square brackets


    The items in a list are separated by commas


    Just like strings, Python starts counting the items in a list from zero. So, here,
    the position (or "index") of "apple" is "0"


    # ▷ How it works


    You can think of lists as a row of shelves in a kitchen. Each shelf holds one
    item from the list. To make changes to an item, you must refer to the shelf it
    is on.


    Typing `mylist[1] = ''cake''` would replace "milk" on shelf 1 with "cake"


    ```

    [0]

    ```


    The value of `mylist[2]` is "cheese"


    ```

    [1]

    ```


    You could add an orange to the front of the cake by typing `mylist.insert(3, ''orange'')`.
    The ice cream would then move to position 4, and so on


    ```

    [2]

    ```


    To get to an item on the list, you must go to the right shelf


    Writing `del mylist[4]` would delete "lemonade" from the list, and move "tea"
    into position 4 instead


    ```

    [3]

    ```


    You could add a new item, "pie", at the end of the list by writing `mylist.append(''pie'')`.
    This will then be added after "tea", in position 6


    ```

    [4]

    ```


    The position of an item in a list is called its "index"


    ```

    [5]

    ```


    ![](img/72d218a7a73c4d4abc7be582ebd85385_129_0.png)'
