- pgno: 57
  md: '# # Coordinates


    To put a sprite in a particular spot, or to find out its exact location, you can
    use coordinates. Coordinates are a pair of numbers that pinpoint a sprite''s position
    on the stage using an x and y grid.


    | SEE ALSO |

    | 38-39 Making things move |

    | 52-53 Math |


    # ## x and y positions


    The x and y positions of a sprite and the mouse-pointer are shown on the Scratch
    interface. It can be helpful to know a sprite''s coordinates when writing a script.


    ```

    x: 240 y: 180

    ```


    > Position of the mouse-pointer


    The mouse-pointer''s coordinates are shown at the bottom right of the stage. Move
    the mouse-pointer over the stage and watch the coordinates change.


    > Position of a sprite

    You can see a sprite''s current coordinates in the top right corner of the scripts
    area.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_57_0.png)


    +   - x position

    - y position


    > Show coordinates on the stage

    Check the boxes beside the "x position" and "y position" blocks to show a sprite''s
    position on the stage.


    # ## x and y grid


    To pinpoint a spot, count the number of steps left or right, and up or down, from
    the middle of the stage. Steps to the left or right are called "x". Steps up or
    down are called "y". Use negative numbers to move left and down.


    ```

    Untitled

    by abcd (shared)

    ```


    ![](img/72d218a7a73c4d4abc7be582ebd85385_57_1.png)


    The stage is based upon an x and y grid


    This sprite is 190 steps left (-190) and 150 steps down (-150) from the middle
    of the stage


    ![](img/72d218a7a73c4d4abc7be582ebd85385_57_2.png)'
