- pgno: 207
  md: '# Making apps


    Mobile phones have opened up a world of possibilities for coders. With a computer
    in everyone’s pocket, mobile apps can use new inputs, such as location-finding
    and motion-sensing, to give users a better experience.


    # What is an app?


    “App” (short for “application”) is a word that describes programs that run on
    mobile devices, smartphones, tablets, and even wearable technology such as washes.
    There are many different categories of apps that do different things.


    | SEE ALSO |

    | 190–191 Essential programs |

    | 198–199 Computer languages |

    | 204–205 Computer games |


    +   - Social network

    Apps can allow people to connect with friends, whether they are nearby or far
    away, to share thoughts, pictures, music, and videos.


    +   - Games

    All sorts of games are available on mobile devices, from simple puzzle games to
    fast-paced action adventures.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_207_0.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_207_1.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_207_2.png)


    +   - Travel

    Travel apps use your location combined with other users’ reviews to provide recommendations
    for restaurants, hotels, and activities.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_207_3.png)


    +   - Weather

    Mobile apps use your location to provide accurate weather forecasts, and also
    allow you to check the weather around the world.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_207_4.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_207_5.png)


    +   - Sport

    People use apps to track their fitness when running or cycling, and can also keep
    up to date on the latest sports scores while on the go.


    +   - Education

    Educational apps are great for learning. Young children can learn to count and
    spell, and older people can learn a new language.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_207_6.png)'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# How to build an app


    There are many questions to answer before building an app. What will it do? What
    devices will it run on? How will the user interact with it? Once these questions
    are answered, building an app is a step-by-step process.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_208_0.png)


    +   - Mac

    - Android

    - Which operating system?


    Will the app target a certain type of mobile device? Coders can often use tools
    that let them write their application once and then adapt it for different operating
    systems.


    +   Have an idea

    Any idea for a new app must be well suited to mobile devices. It might be a completely
    new idea, or it could be an improvement on an already existing idea to make a
    better version.


    +   Learn to make apps

    Whichever platform the app will run on, a coder needs to learn the language and
    other skills needed to build a good app. Online tutorials and local coding clubs
    can help.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_208_1.png)


    +   Create the program

    Good apps take time to make. A basic version might be working in weeks, but for
    an app to be really successful, it will need to be developed for a few months
    before its release.


    +   Test it

    Users will quickly get rid of an app if it contains bugs. Putting in tests as
    part of the code, and getting friends and family to try out the app can help clean
    up any errors before the app is released.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# Programming for the Internet


    Websites are built using coding languages that work just like Python. One of the
    most important of them is JavaScript, which makes websites interactive.


    # How a web page works


    Most web pages are built using several different languages. An email website,
    for instance, is made with CSS, HTML, and JavaScript. The JavaScript code makes
    the site respond instantly to mouse clicks without reloading the page.


    > SEE ALSO

    > 198–199 Computer languages

    Using 210–211 JavaScript


    ![](img/72d218a7a73c4d4abc7be582ebd85385_209_0.png)


    CSS

    The language CSS (Cascading Style Sheets) controls the colors, fonts, and layout
    of the page.


    | INBOX | CONTACTS | CALENDAR |

    |---|---|--|

    | Compose | Delete | Move |

    | Inbox | Sam | Funny cat video |

    | Drafts | Lizzie | Presents for Ben |

    | Sent | Fiona | Lunch? |

    | Spam | Shaila | No thanks |

    | Trash | Paula | Come to my party? |

    | | Dan | Re: Barnyard dance |

    | | Ben | Re: Amazing picture |

    | | Sarah | Hockey match |

    | | Vicky | Re: New York |

    | | Ella | Book review |

    | | Phil | Ben''s presents |


    ![](img/72d218a7a73c4d4abc7be582ebd85385_209_1.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_209_2.png)


    HTML

    HTML(Hyper Markup Language) builds the structure of the page, with different sections
    that contain text or images.


    JavaScript

    JavaScript controls how the page changes when you use it. Click on an email, for
    instance, and JavaScript makes a message open up.'
