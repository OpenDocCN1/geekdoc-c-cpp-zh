- pgno: 210
  md: '# HTML


    When you open a website, your Internet browser downloads an HTML file and runs
    the code to turn it into a web page. To see how it works, type the code here into
    IDLE code window (see pp.92–93) and save it as a file with the ending "html".
    Double click the file and it will launch a browser window saying "Hello World!


    ```

    <html>

    <head>

    <title>The Hello World</</title>

    </head>

    <body>

    <h1>Hello World in HTML</h1>

    <p>Hello World!</p>

    </body>

    </html>

    ```


    Blocks of text are are surrounded by "tags", a very common feature in HTML code.
    This tag gives the window title


    This tag shows where the HTML code ends


    The "<p>" and "</p>" tags surround ordinary text


    # Trying JavaScript


    It''s easy to experiment with JavaScript because all modern web browsers can understand
    it. JavaScript code is usually placed within HTML code, so the example below uses
    two coding languages at once. The JavaScript section is surrounded by "<script>"
    tags.


    # EXPERT TIPS


    # Games in JavaScript


    JavaScript is so good at creating interactive features that it can be used to
    make games—from simple puzzles to fast-paced racing games. These will work in
    any modern web browser, so there''s no need to install the first game. JavaScript
    is used to create web apps as webmail or interactive calendars.


    +   Write some JavaScript


    Open a new IDLE code window and type out the code. Check the code very carefully.
    If there are any errors, you''ll just see a blank page.


    ```

    <script>

    alert("Hello!");

    </script>

    ```


    "<script>" tag introduces JavaScript code


    "''alert'' command will make an alert box pop up


    ![](img/72d218a7a73c4d4abc7be582ebd85385_210_0.png)


    +   Save your file


    Save the file and enter a filename as "test.html" so the code is saved as an HTML
    file and not a Python file. Then double click the file to test it.


    +   Pop-up appears


    The browser will open and an interactive alert box will pop up with the greeting
    "Hello World!" Click "OK" to dismiss the box.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_210_1.png)


    Don''t forget to give your filename an ".html ending


    JavaScript

    Hello World!


    JavaScript creates interactive features such as buttons


    ![](img/72d218a7a73c4d4abc7be582ebd85385_210_2.png)'
