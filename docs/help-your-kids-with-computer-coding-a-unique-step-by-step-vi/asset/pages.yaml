- pgno: 83
  md: '# Time to experiment


    Now you''ve learned the basics of Scratch, you can experiment with some of its
    more advanced features. The more you practice, the better your coding will become.


    | SEE ALSO |

    | What is 86–87 > Python? |

    | Simple 102–103 > commands |


    # Things to try


    Not sure what to do next with Scratch? Here are a few ideas. If you don''t feel
    ready to write a whole program on your own yet, you can start with one that has
    already been written and change parts of it.


    +   - Join a coding club: Is there a coding club in your school or local area?
    They''re great places to meet other Scratch users and share ideas.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_83_0.png)


    Scratch allows you to look at the coding of all projects on its website


    ![](img/72d218a7a73c4d4abc7be582ebd85385_83_1.png)


    +   - Look at code: Looking at other programs is a great way to learn. Go through
    projects shared on the Scratch website. What can you learn from them?


    +   - Remix existing projects: You can improve the projects on the Scratch website?
    Scratch lets you add new features and then share your vision.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_83_2.png)


    # Backpack


    The backpack enables you to store useful scripts, sprites, sounds, and costumes
    and move them from project to project. It''s found at the bottom of the Scratch
    screen.


    +   - Drag and drop: You can drag sprites and scripts into your backpack, then
    add them to other projects.


    Drag and drop to copy a script or sprite into the backpack


    ![](img/72d218a7a73c4d4abc7be582ebd85385_83_3.png)


    A sprite in your backpack


    ![](img/72d218a7a73c4d4abc7be582ebd85385_83_4.png)'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Help!


    It can be hard to write a program if you don''t know about some of the blocks
    you could use. Scratch has a help menu to make sure you understand every block.


    +   - Block help

    To find out more about a particular block, click the ''block help'' button on
    the cursor bars at the top of the screen.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_84_0.png)


    The help window explains every block

    This is the ''block help'' button


    +   - Ask a question

    The cursor will turn into a question mark. Use this to click on the block you
    want to know about.


    The cursor becomes a question mark


    ![](img/72d218a7a73c4d4abc7be582ebd85385_84_1.png)


    +   - Help window

    The help window opens to tell you how the block works, with tips on how it can
    be used.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_84_2.png)


    # Learn another language


    You''re now on your way to mastering your first programming language. Learning
    other languages will enable you to write different types of programs. Why not
    try Python? What you''ve already learned about Scratch will help you pick up Python
    quickly.


    +   - Similar to Scratch

    Python uses loops, variables, and branches too. Use your Scratch knowledge to
    start learning Python!


    ![](img/72d218a7a73c4d4abc7be582ebd85385_84_3.png)'
  merge: -1
  img_proc: true
