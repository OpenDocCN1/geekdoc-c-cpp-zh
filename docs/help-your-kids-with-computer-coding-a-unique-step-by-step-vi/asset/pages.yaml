- pgno: 150
  md: "# BUGS AND DEBUGGING 149\n\n# Add a \"print\" and \"input(i)\"\n\nThe program\
    \ doesn't show what it's doing at each step. Adding a \"print\" command will help\
    \ you see what's happening. The \"input()\" command waits for the \"return\" or\
    \ \"Enter\" key to be pressed before looping.\n\n```\ntop_num = 5\ntotal = 0\n\
    for n in range(top_num):\n    total = total + n\n    print('DEBUG: n=', n, 'total=',\
    \ total)\n    input(0)\nprint('Sum of numbers 1 to', top_num, 'is', total)\n```\n\
    \nThe total() command prints the current value of the loop and the variable so\
    \ far\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_150_0.png)\n\n# New output\n\
    \nThe loop is only adding the numbers from 0 to 4, and not to 5. This is because\
    \ a \"for\" loop always starts counting from 0 (unless otherwise), and always\
    \ stops 1 before the end of the range.\n\n```\nDEBUG: n=0 total=0\nDEBUG: n=1\
    \ total=1\nDEBUG: n=2 total=3\nDEBUG: n=3 total=6\nDEBUG: n=4 total=10\nSum of\
    \ numbers 1 to 5 is 10\n```\n\nThis is actually the sum of the numbers from 0\
    \ to 4, not 1 to 5\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_150_1.png)\n\n\
    # Fix the faulty line\n\nThe range should go from 1 up to \"top_num + 1\", so\
    \ that the loop adds up the numbers from 1 to \"top_num\" (5).\n\n```\ntop_num\
    \ = 5\ntotal = 0\nfor n in range(1, top_num + 1):\n    total = total + n\n   \
    \ print('DEBUG: n=', n, 'total=', total)\n    input(0)\nprint('Sum of numbers\
    \ 1 to', top_num, 'is', total)\n```\n\nThe new range will count from 1 and stop\
    \ at \"top_num\" (1 less than \"top_num+1\")\n\n# Correct output\n\nThe \"print\"\
    \ command shows that the program is adding the numbers from 1 to 5 and getting\
    \ the correct answer. The bug has now been fixed!\n\n```\nDEBUG: n=1 total=1\n\
    DEBUG: n=2 total=3\nDEBUG: n=3 total=6\nDEBUG: n=4 total=10\nDEBUG: n=5 total=15\n\
    Sum of numbers 1 to 5 is 15\n```\n\n\"n=3\", the total is (1+2+3)\n\nThe correct\
    \ answer is now printed\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_150_2.png)\n\
    \n![](img/72d218a7a73c4d4abc7be582ebd85385_150_3.png)\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_150_4.png)"
