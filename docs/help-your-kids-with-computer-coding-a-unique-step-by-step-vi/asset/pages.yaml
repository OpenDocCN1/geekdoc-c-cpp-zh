- pgno: 53
  md: '# Math


    As well as storing numbers in variables (see pp.50–51), Scratch can be used to
    carry out all sorts of calculations using the “Operator” blocks.


    | SEE ALSO |

    | 50–51 Variables |

    | Math 112–113 in Python |


    # Doing sums


    There are four “Operator” blocks that can be used to do simple calculations. These
    are addition, subtraction, multiplication, and division.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_53_0.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_53_1.png)


    +   - Addition

    The “+" block adds the two numbers in the block together.


    +   - Subtraction

    The “-" block subtracts the second number from the first.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_53_2.png)


    +   - Printing results

    Drag a “+" block into the scratch area and drop a “+" inside it. Now add two numbers
    together and watch your sprite think the answer.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_53_3.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_53_4.png)


    +   - Multiplication

    Computers use "*" symbol for multiplication because “x” looks like a letter.


    +   - Division

    There’s no division sign on the keyboard, so Scratch uses the "/" symbol instead.


    # Results in a variable


    For more complex calculations, such as fixing the sale price of an item, instead
    of just using numbers you can use the value of a variable in a sum. The result
    can be stored in a variable too.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_53_5.png)


    +   - Create variables

    Go to the "Data" section of the blocks palette and create two variables—“sale
    price” and “price".


    +   - Set the price

    Select the "set price" block and fix the price of an item to 50.


    +   - Calculate the sale price

    Use this script to calculate half the price of an item and set it as the sale
    price.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_53_6.png)'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Random numbers


    The "pick random" block can be used to select a random number between two values.
    This block is useful for rolling dice in a game or when you want to mix up a sprite''s
    contents.


    # EXPERT TIPS


    # Gaming


    Computers often use random numbers to add surprises to games. For example, an
    alien can be made to appear in a random place, or after a random amount of time.
    It can be used to select a random value, as if you were rolling a dice, or a random
    costume for a sprite.


    ```

    pick random 1 to 10

    ```


    # Pick a random number


    You can change the numbers in the block to choose a number between 1 and 12.


    ```

    when

    forever

    wait 2 sec

    switch costume to

    ```


    This block makes sprite wait for two seconds before switching to another costume


    Chooses a costume between 1 and 3 at random


    ```

    pick random 1 to 3

    ```


    # Switching costumes


    This script changes a sprite''s costume at random every two seconds.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_54_0.png)


    # Hard math


    Simple "Operator" blocks can do most calculations, but Scratch can also do more
    complex math. The "mod" block divides two numbers and gives the remainder, which
    is the number that is left over. The "round" block rounds to the nearest number,
    and the "sqrt" block gives the square of a root.


    ```

    mod 3

    ```


    Divides 3 by 3 and gives the remainder—the number that is left over


    Gives nearest whole number to 44.7


    ```

    round 44.7

    ```


    Chooses different functions from the drop-down menu


    # More math


    The "Operator" section has blocks of advanced math functions that can be used
    to do complex calculations.


    ```

    sqrt 9

    ```


    Calculates the square root of 9'
