  md: '# Unicode


    As computers across the world began to share data, the limits of ASCII began to
    show. Thousands of characters used in hundreds of languages had to be represented,
    so a universal standard called Unicode was agreed upon.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_186_0.png)


    Unicode has over 110,000 characters!


    International code

    Unicode represents all the languages of the world. For example, the Arabic characters
    are represented in the range 0600–06FF.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_186_1.png)


    Unicode characters

    Unicode characters are represented by their hexadecimal value, which appears as
    a series of letters and numbers (see pp.182–183). Each character has its own code.
    More characters are added all the time, and there are some unusual ones, as a
    mini umbrella.


