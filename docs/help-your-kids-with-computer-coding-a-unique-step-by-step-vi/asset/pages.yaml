  md: "# Bugs and debugging\n\n148\nPLAYING WITH PYTHON\n\nSEE ALSO\n94-95 Errors\n\
    122-123 Loops\nin Python\nWhat next? 176-177>\n\nProgrammers aren’t perfect, and\
    \ most programs\ncontain errors at first. These errors are known as\n“bugs” and\
    \ tracking them down is called “debugging”.\n\n# Types of bugs\n\nThree main types\
    \ of bugs can turn up in programs—syntax,\nruntime, and logic errors. Some are\
    \ quite easy to spot, while others\nare more difficult, but there are ways of\
    \ finding and fixing them all.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_149_0.png)\n\
    \nThe Python keyword\nis is “for” not “fir”\n\nThis will cause\nan error as no\n\
    number be divided by 0\n\nAge cannot be less than 5\nand greater than 8 at the\n\
    same time, no free tickets\n\n```\nfir i in range(5):\nprint(i)\n```\n\n```\n\
    a = 0\nprint(10 / a)\n```\n\n```\nif age < 5 and age > 8:\n    print('Free ticket!')\n\
    ```\n\n+   - Easy to spot\nA error is a mistake in the\nprogram’s words or symbols,\
    \ such\nas misspelled keywords, missing\nbrackets, or incorrect intents.\n\n+\
    \   - Harder to spot\nRuntime errors appear only\nwhen the program is running.\n\
    Adding numbers to strings or\ndiding by 0 can cause them.\n\n+   - hardest to\
    \ spot\nLogic errors are mistakes in a program’s\nthinking. Using \"<\" instead\
    \ of \">\",\nexample, or adding when you should\nubtract result in these errors.\n\
    \n# Find and fix a bug\n\nSyntax errors are easy to spot because IDLE highlights\
    \ them in red\nwhen you run the program. Finding runtime and logic errors takes\
    \ a\nbit more work.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_149_1.png)\n\n\
    ```\ntop_num = 5\ntotal = 0\nfor n in range(top_num):\ntotal = total + n\nprint('Sum\
    \ of numbers 1 to ‘, top_num, ‘is’, total)\n```\n\n1 Program\nThis program aims\
    \ to\nadd all the numbers\nfrom 1 up to the value\nstored in the variable\n“top_num”.\
    \ It then\nprints the total.\n\n2 Output\nThe answer for the program should\n\
    eas (1 + 2 + 3 + 4), it shows the\nanswer as “10”. You need to find out why.\n\
    \n# Sum of numbers 1 to 5 is 10\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_149_2.png)\n\
    \nThe answer should be “15”, not “10”."
