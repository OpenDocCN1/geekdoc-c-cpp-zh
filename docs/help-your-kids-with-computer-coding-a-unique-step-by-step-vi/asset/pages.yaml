- pgno: 15
  md: '# What is a computer program?


    A computer program is a set of instructions that a computer follows to complete
    a task. “Coding", or “programming", means writing the step-by-step instructions
    that tell the computer what to do.


    # Computer programs are everywhere


    We are surrounded by computer programs. Many of the devices and gadgets we use
    every day are controlled by them. These machines all follow step-by-step instructions
    written by a computer programmer.


    SEE ALSO

    Thinking like 16–17 a computer

    Becoming 18–19 a coder


    ![](img/72d218a7a73c4d4abc7be582ebd85385_15_0.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_15_1.png)


    +   Mobile phones

    Programs allow you to make a phone call or send text messages. When you search
    for a contact, a program finds the correct phone number.


    +   Computer software

    Everything a computer does, from browsing the Internet to writing documents or
    playing music, works because of code written by a computer programmer.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_15_2.png)


    +   Games

    Consoles are just another type of computer, and all the games that run on them
    are programs. All the graphics, sounds, and controls are written in computer code.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_15_3.png)


    +   Washing machines

    Washing machines are programmed to follow different cycles. Computer code controls
    how hot the water is and how long the wash takes.


    +   Cars

    In some cars, computer programs monitor the speed, temperature, and amount of
    fuel in the tank. Computer programs can even help control the brakes to keep people
    safe.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_15_4.png)'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# How computer programs work


    Computers might seem very smart, but they are actually just boxes that follow
    instructions very quickly and accurately. As intelligent humans, we can get them
    to carry out different tasks by writing programs, or lists of instructions.


    +   Computers can''t do anything by itself. It''s up tonthe computer programmer

    to give it instructions.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_16_0.png)


    Without instructions a computer is clueless


    +   Write a program

    You can tell a computer what to do by writing a set of very detailed instructions
    called a program. Each instruction has to be small enough that the computer can
    understand it. If the instructions are incorrect, the computer won''t behave the
    way you want to.


    This is a computer program counting down to launch


    +   Programming languages

    Computers can only follow instructions in a language they understand. It''s up
    to the programmer to choose which language is best for the task.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_16_1.png)


    ```

    for count in range(10, 0, -1):

    print("Counting down", count)

    ```


    ![](img/72d218a7a73c4d4abc7be582ebd85385_16_2.png)


    ```

    for count in range(10, 0, -1):

    print("Counting down", count)

    ```


    All programs are finally converted into "binary code", a basic computer language
    that uses only ones and zeroes


    ![](img/72d218a7a73c4d4abc7be582ebd85385_16_3.png)


    | 1010 | 1011 | 1000 | 1100 |

    | 1000 | 0110 | 0100 | 1001 |

    | 0100 | 1001 | 0001 | 0101 |


    ![](img/72d218a7a73c4d4abc7be582ebd85385_16_4.png)


    # Hardware and software


    "Hardware" means the physical parts of the computer that you can see or touch
    (all the wires, circuits, the keyboard, the display screen, and so on). "Software"
    means the programs that run on the computer and control how it works. Software
    and hardware work together to make computers useful things.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_16_5.png)'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Think like a computer


    A programmer must learn to think like a computer. All tasks must be broken down
    into small chunks so that they are easy to follow and impossible to get wrong.


    # Thinking like a robot


    Imagine a café where the waiter is a robot. The robot has a simple computer brain,
    and needs to be told how to get from the café kitchen to serve food to diners
    seated at tables. First the process has to be broken down into simple tasks the
    computer can understand.


    SEE ALSO

    | 14–15 What is a computer program? |

    | Becoming 18–19 coder |


    > Algorithm

    An algorithm is a set of simple instructions for performing a task. A program
    is an algorithm that has been translated into a language that computers can understand.


    +   Waiter robot program 1

    Using this program robot grabs the food from the plate, crashes straight through
    the kitchen wall into the dining area, and puts the food on the floor. This algorithm
    wasn''t detailed enough.


    +   - Pick up food

    - Move from kitchen to diner''s table

    - Put food down


    > Disaster!

    The instructions weren''t clear; we forgot to tell the robot to use the door.
    It might seem obvious to humans but computers can''t think for themselves.


    +   Waiter robot program 2

    This time we''ve told the robot to use the kitchen door. It makes through the
    door, but then hits the café cat, trips, and smashes the plate on the floor.


    +   - Pick up a plate with food on it

    - Move from kitchen to diner''s table by:

    - Move to door between kitchen and dining area

    - Move from door to the table

    - Put plate down on the table in front of the diner


    > Still not perfect

    The robot doesn''t know how to deal with obstacles like the cat. The program needs
    to give the robot even more detailed instructions so it can move around safely.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Waiter robot program 3


    In this version of the program, the robot successfully delivers the food to the
    diner avoiding any obstacles. But after putting the plate down, the robot remains
    standing at the table while food piles up in the kitchen.


    +   1. Pick up a plate with food holding it level at all times


    +   2. Move from kitchen to diner''s table by:


    +   Move to door between kitchen and dining area


    +   checking for obstacles and steering around them


    +   Move from door to the table


    +   checking for obstacles and steering around them


    ![](img/72d218a7a73c4d4abc7be582ebd85385_18_0.png)


    > Success at last?

    The robot can deliver the food safely. But we forgot to give it instructions to
    go back to the kitchen and get the next plate.


    +   3. Put plate down on the table in front of the diner


    # Real-world example


    The waiter robot might be imaginary, but algorithms like this are in action all
    around us. For example, a computercontrolled elevator faces the same sort of problems.
    Should it go up or down? Which floor should it go to next?


    ![](img/72d218a7a73c4d4abc7be582ebd85385_18_1.png)


    +   1. Wait until doors are closed


    +   2. Wait for button to be pressed


    +   If button pressed is higher than current floor:


    +   Move lift upwards


    +   If button pressed is lower than current floor:


    +   Move lift downwards


    > Elevator program

    For the elevator to work correctly and safely, every step has to be precise, clear,
    and cover every possibility. The programmers have to make sure they create a suitable
    algorithm.


    +   3. Wait until current floor equals button pressed


    +   4. Open doors'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Becoming a coder


    Coders are the people who write the programs behind everything we see and do on
    a computer. You can create your own programs by learning a programming language.


    # Programming languages


    There are a huge range of programming languages to choose from. Each one can be
    used for different tasks. Here are some of the most popular languages and what
    they are often used for:


    | C | MATLAB | Ideal for programs that need to carry out lots of calculations.
    |

    |---|---|---|

    | Ada | A powerful language for building operating systems. |

    | Used to control spacecraft, satellites, and airplanes. | Ruby | Automatically
    turns lots of information into web pages. |

    | Java | Works on computers, cell phones, and tablets. | Javascript | A language
    used to build interactive websites. |


    | Scratch | A visual language that''s ideal for learning programming. This is
    the first language covered in this book. | Python | A text-based language that
    can be used to build all kinds of things. It''s the second language covered in
    this book. |


    # What is Scratch?


    Scratch is a great way to start coding. Programs are created by connecting blocks
    of code, instead of typing it out. Scratch is quick and easy to use, and also
    teaches you the key ideas you need to use other programming languages.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_19_0.png)


    The program appears on this side of the screen


    Code is made by connecting colored blocks together'
  merge: -1
