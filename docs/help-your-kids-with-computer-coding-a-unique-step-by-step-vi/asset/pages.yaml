- pgno: 49
  md: '# Pens and turtles


    Each sprite has a pen tool that can draw a line behind it wherever it goes. To
    create a picture, turn on the pen and move the sprite across the stage, like moving
    a pen across paper.


    > SEE ALSO

    - 44–45 Events

    - 46–47 Simple loops


    # Pen blocks


    The dark green blocks are used to control the pen. Each sprite has its own pen
    that can be turned on by using the “pen down” block and turned off using the “pen
    up” block. The size and color of the pen can also be changed.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_49_0.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_49_1.png)


