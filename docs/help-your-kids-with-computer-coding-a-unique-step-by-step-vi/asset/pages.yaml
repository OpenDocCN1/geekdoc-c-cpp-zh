- pgno: 187
  md: '# Logic gates


    Computers use electrical signals not only to understand numbers and letters but
    also to make decisions using devices called "logic gates". There are four main
    types of logic gates: "AND", "NOT", "OR", and "EXCLUSIVE OR".


    # AND gate


    Gates use one or more input signals to produce an output signal, based on a simple
    rule. AND gates switch their output signal "on" only when both input signals are
    "on" (1 and 1).


    ![](img/72d218a7a73c4d4abc7be582ebd85385_187_0.png)


    Inputs 1 and 1 = output

    Both input signals are "on", so the AND gate produces an "on" output signal.


    Inputs 1 and 0 = output

    If one input is "on" but the other is "off", the output signal is "off".


    Inputs 0 and 0 = output

    An AND gate produces an "off" output signal if both input signals are "off".


    # NOT gate


    These gates "flip" any input to its opposite. "On" input becomes "off" output,
    and "off" input turns to gates are also known as "inverters".


    > REAL WORLD

    George Boole (1815–64)


    George Boole was an English mathematician whose work made logic gates possible.
    He worked out a system to solve logic problems. This kind of math, which deals
    in values that can be only true or false (positive or negative), is known as "Boolean
    logic" in his honor.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_187_1.png)


    Input 1 = output 0

    The NOT gate flips an "on" input to an "off" output, and vice versa.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# OR gate


    An OR gate produces an "on" output when either one

    of the inputs are "on", or when both are "on".


    ![](img/72d218a7a73c4d4abc7be582ebd85385_188_0.png)


    +   - Inputs 1 and 1 = output 1

    Two "on" inputs produce

    an "on" output.


    +   - Inputs 1 and 0 = output 1

    One "on" and one "off" input still

    produce an "on" output.


    +   - Inputs 0 and 0 = output 0

    Only two "off" inputs produce

    an "off" output from an OR gate.


    # EXCLUSIVE OR gate


    This type of gate gives only

    an"on" output when one

    input is "on" and the other is

    "off". Two "on" or two "off"

    inputs will produce an "off"

    output. Gates like this are also

    known as "XOR" gates.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_188_1.png)


    +   - Inputs 1 and 1 = output 0

    Two "on" inputs produce

    an "off" output.


    +   - Inputs 1 and 0 = output 1

    The output is only "on" when

    the inputs are different.


    # ### Building computer circuits


    | By combining these four basic

    logic gates, you can create circuits

    to perform a whole range of

    advanced functions. For example,

    by linking an AND gate to an XOR

    gate, you can create a circuit (that

    add two binary digits (bits)

    together. By linking two OR gates | with two NOT gates in a loop,

    you can create a circuit that

    will store a bit of data (a single

    1 or 0). Even the most powerful

    computers are based on

    billions of tiny logic circuits. |


    ![](img/72d218a7a73c4d4abc7be582ebd85385_188_2.png)


    Computer chips contain

    many logic circuits'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Processors and memory


    Inside a computer are many types of electronic chips.

    Most importantly, the processor chip runs programs and memory chips store data
    for instant access.


    # The processor


    Processors are a collection of very small and complex circuits, printed on a glasslike
    material called silicon. Small switches called transistors are combined to form
    simple logic gates, which are further combined to form complex circuits. These
    circuits run all the programs on your computer.


    +   SEE ALSO

    * 180-181 Inside a computer

    * 186-187 Logic gates


