- pgno: 52
  md: '# Using a variable


    Variables can be used to change a sprite''s speed. This simple script shows you
    how.


    +   **Set the value of a variable**nCreate this script. Use the "sets steps to
    0" block and change the name to 5. Drag the "move 10 steps" block into the script,
    but drop the "steps" variable over the "10".


    +   **Changing the value of a variable**nUse the "change steps by 1" block to
    increase the value of the variable "steps" by 1. Put it inside the "forever" block,
    so the cat keeps on getting faster.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_52_0.png)


    This sets the value of "steps" to 5

    Here, "steps" means 5, as the value has been set above


    The "steps" variable keeps on increasing as the "forever" loop goes around and


    ![](img/72d218a7a73c4d4abc7be582ebd85385_52_1.png)


    Set my speed using the "set steps to 0" block.


    > EXPERT TIPS


    # Read-only variables


    # Deleting variables


    When you no longer want a variable, right-click on it in the blocks palette and
    then select "delete variable."You''ll lose any information that was in it.


    Some variables are set by Scratch and can''t be changed. They''re still variables,
    though, because their values vary. These blocks are known as sensing blocks.


    Tracks the distance to something, such as the mouse-pointer.


