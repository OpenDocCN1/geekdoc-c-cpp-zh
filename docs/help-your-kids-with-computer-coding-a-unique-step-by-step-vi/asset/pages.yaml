    \ the \"do\" value is a letter that the function cannot recognize\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_143_1.png)\n\
    \nThe starting position of the turtle\n\nThis calls this function using its name\n\
    \n\"do\" and \"val\" inputs to the turtle to move 100 steps forward\n\nHere are\
    \ some examples of how to use the Turtle controller. Each time it is used, it\
