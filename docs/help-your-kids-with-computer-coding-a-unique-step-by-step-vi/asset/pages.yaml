- pgno: 69
  md: '# Complex loops


    Simple loops are used to repeat parts of a program forever, or a certain number
    of times. Other, clever loops can be used to write programs that decide exactly
    when to repeat instructions.


    # Looping until something happens


    Add the "Dog 1" sprite to a project, and then give the below script to the cat
    sprite. When you run the script, "repeat until" block makes sure the cat keeps
    moving until it touches the dog. It will then stop and say "Ouch!"


    > SEE ALSO

    >> 46–47 Simple loops

    > 62–63 True or false?


    ![](img/72d218a7a73c4d4abc7be582ebd85385_69_0.png)


    **Repeat until" block**

    The blocks inside the "repeat until" block keep repeating until the condition
    is true (the cat touches the dog).


    ![](img/72d218a7a73c4d4abc7be582ebd85385_69_1.png)


    This block stops the cat from standing on its head


    Select "Dog 1" from the drop-down menu


    These instructions keep on repeating until the cat touches the dog


    ![](img/72d218a7a73c4d4abc7be582ebd85385_69_2.png)


    This will only happen when the cat touches the dog


    **Testing the program**

    Move the dog out of the cat''s way and run the program. Then drag and drop the
    dog into the cat''s path to see what happens.


    # Stop!


    Another useful "Control" block is the "stop all" block, which can stop all scripts
    from running. It''s useful if you want to stop sprites from moving at the end
    of a game.


    This stops all scripts in a program


    This stops only the script this block is


    This stops the sprite''s other scripts, but continue to run the script this block
    in


    **Stopping scripts**

    Use the drop-down menu to choose which scripts to stop.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_69_3.png)'
