- pgno: 6
  md: 'CAROL VORDERMAN M.A. (CANT), MBE is one of Britain''s best-loved TV presenters
    and is renowned for her skills in mathematics. She has a degree in Engineering
    from the University of Cambridge. Carol has a keen interest in coding, and feels
    strongly that every child should have the chance to learn such a valuable skill.
    She has hosted numerous TV shows on science and technology, such as Tomorrow''s
    World and How 2, as well as The Pride of British Awards, on the BBC, ITV, and
    Channel 4. With co-hosting Channel 4''s Countdown for 26 years, becoming the second
    best female fiction author of the decades in the UK, or advising British Prime
    Minister David Cameron on the future of potential mathematics education in the
    UK, Carol has a passion and devotion to explaining mathematics, science, and technology
    in an exciting and easily understandable way.


    DR. JON WOODCOCK M.A. (OXON) has a degree in Physics from the University of Oxford
    and a Ph.D. in Computational Astrophysics from the University of London. He started
    coding at the age of eight and has programmed all kinds of computers from single-chip
    microcontrollers to world-class supercomputers. His many projects include giant
    space simulations, research in high-tech companies, and intelligent robots from
    junk. Jun has a passion for science and technology education, giving talks on
    space and running programming clubs in schools. He has worked on numerous science
    and technology books as a contributor and consultant.


    SEAN MCMUS learned to program when he was nine. His first programming language
    was Logo. Today he is an expert technology author and journalist. His other books
    include Scratch Programming in Easy Steps, Web Design in Easy Steps, and Raspberry
    Pi For Dummies. He visits his website at www.sean.co/uk for Scratch games and
    tutorials.


    CRAIG STEELE is a specialist in Computing Science education. He is Project Manager
    for CDojo Scotland, which runs free coding clubs for young people. Craig has previously
    worked for the Scottish Qualification Authority, Glasgow Science Centre, and the
    University of Glasgow. Craig''s first computer was a ZX Spectrum.


    CLAIRE QUIGLEY studied Computing Science at Glasgow University where she has a
    B.S. and a Ph.D. She has worked in the Computer Laboratory at Cambridge University
    and on a project that aimed to develop computational thinking skills in primary
    school pupils. She is a mentor at CDojo Scotland, a coding club for young people.


    DANIEL MCCAFFERY holds a degree in Computer Science from the University of Strathclyde.
    Since graduating, he has been developing software for all of the world''s largest
    investment banks. In his spare time, Daniel is a mentor at CoderDojo for young
    people.'
