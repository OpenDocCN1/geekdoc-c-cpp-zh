- pgno: 154
  md: '# Importing modules


    Before using a module, you have to tell the computer to import it so it can be
    used by your program. This allows the bits of code it contains to be available
    to you. Importing modules is done using the "import" command. Python can import
    modules in a few different ways.


    > EXPERT TIPS


    # Pygame


    Pygame is a Python library designed for writing video games. Pygame gives you
    access to sound modules and special graphics that can be used in games. You''ll
    be able to use Pygame once you have a good understanding of the basics of Python
    covered in this book.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_154_0.png)


    ```

    import random

    ```


    This way of importing requires you to type the module name at the start of the
    code. It makes it easier to read which module it came from.


    ```

    random.randint(1, 6)

    random.choice(my_list)

    ```


    The module name comes before each function


    Imports all the functions from the Random Module


    ```

    from random import *

    ```


    Importing a module like this works well for small programs. But it can get confusing
    with bigger programs because it''s unclear which module the function belongs to.


    ```

    randint(1, 6)

    choice(my_list)

    ```


    This code doesn''t show which module the function comes from


    Imports only the "randint" function


    ```

    from random import randint

    ```


    "from random randint"

    You can import a single function from the module. This can be more efficient than
    importing the whole module if it''s the only function you want to use.


    ```

    randint(1, 6)

    ```


    Only the "randint" function is available


    # Help and document


    | Help |

    | About IDLE |

    | IDLE Help |

    | Python Docs |


    Not sure how to use a module or what functions are available? The Python Library
    Reference has all the details. Simply click on the library you want to learn more
    about. It''s a good idea to get know the libraries, modules, and functions that
    are available, so you don''t waste time writing code that already exists.


    Help!

    at the top of any IDLE window, click "Help" and choose "Python Docs". This brings
    up lots of useful information.'
