  img_proc: true
- pgno: 158
  md: "# Drawing on a canvas\n\nTo create graphics using Python, you need to make\
    \ a blank area to draw on. This is known as a canvas. You can use x and y coordinates\
    \ to tell Python exactly where to draw on the canvas.\n\n> EXPERT TIPS\n\n# Coordinates\n\
    \nIn Tkinter, x coordinates get larger moving to the right, and y coordinates\
    \ get larger moving downward. (0,0) is in the top-left corner.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_158_0.png)\n\
    \n# Create a graphics program\n\nUse this code to create a window and put a canvas\
    \ inside it. It will then draw random circles on the canvas.\n\n```\nfrom random\
    \ import *\nfrom tkinter import *\nsize = 500\nwindow = Tk()\ncanvas = Canvas(window,\
    \ width=size, height=size)\ncanvas.pack()\nwhile True:\n    col = choice(['pink',\
    \ 'orange', 'purple', 'yellow'])\n    x0 = randint(0, size)\n    y0 = randint(0,\
    \ size)\n    canvas.create_oval(x0, y0, x0 + d, y0 + d, fill=col)\n    window.update()\n\
    ```\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_158_1.png)\n\n# Colored canvas\n\
    \nRun the code and the program will start drawing circles on the canvas.\n\nCircles\
    \ are drawn at random places"
