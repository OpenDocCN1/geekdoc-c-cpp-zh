- pgno: 167
  md: "# BUBBLE BLASTER\n\n# Controlling the submarine\n\nThe next stage of the program\
    \ is to write the code that makes the submarine move when the arrow keys are pressed.\
    \ The code will create a function called an \"event handler\". The event handler\
    \ checks which key has been pressed and moves the submarine.\n\n+   - Type this\
    \ code to create a function called \"move_ship\".This function will move the submarine\
    \ in the correct direction when a cursor is pressed. Try running it to see how\
    \ it works.\n\n```\nSHIP_SPD = 10\ndef move_ship(event):\n    if event.keysym\
    \ == 'Up':\n        c.move(ship_id, 0, -SHIP_SPD)\n        c.move(ship_id2, 0,\
    \ -SHIP_SPD)\n    elif event.keysym == 'Down':\n        c.move(ship_id, 0, SHIP_SPD)\n\
    \        c.move(ship_id2, 0, SHIP_SPD)\n    elif event.keysym == 'Left':\n   \
    \     c.move(ship_id, -SHIP_SPD, 0)\n        c.move(ship_id2, -SHIP_SPD, 0)\n\
    \    elif event.keysym == 'Right':\n        c.move(ship_id, SHIP_SPD, 0)\n   \
    \     c.move(ship_id2, SHIP_SPD, 0)\nc.bind_all('<Key>', move_ship)\n```\n\n>\
    \ The sub will move this\nfar when a key is pressed\n\n> Moves the two parts of\n\
    t sub up when the\narrow key is pressed\n\n> These lines are activated when\n\
    town down arrow key is pressed,\nand the sub moves down\n\n> The sub moves left\
    \ when\nleft arrow key is pressed\n\n> Moves the sub right\nwhen the right\narrow\
    \ key is pressed\n\n> y coordinate gets\nsmaller moving up\n\n> Tells Python to\
    \ run \"move_ship\"\nwheneverever any key is pressed\n\n> x coordinate gets\n\
    sm going left\n\nHow it works\nThe \"move_ship\" function moves the\nsub in different\
    \ directions. Adding to\nt sub's x and y coordinates moves\nit right and down,\
    \ while subtracting\nfrom them moves it left and up.\n\n> y coordinate gets\n\
    larger moving down\n\n> x coordinate gets\nlarger going right\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_167_0.png)\n\
    \n![](img/72d218a7a73c4d4abc7be582ebd85385_167_1.png)\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_167_2.png)\n\
    \n![](img/72d218a7a73c4d4abc7be582ebd85385_167_3.png)"
  merge: -1
  img_proc: true
- pgno: 168
  md: "# Get ready for bubbles\n\nNow the submarine can move, start creating the bubbles\
    \ for the player to pop. Each bubble will be a different size and move at a different\
    \ speed.\n\n+   Every bubble needs an ID number (so the program can identify each\
    \ specific bubble), a size, and a speed.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_168_0.png)\n\
    \n```\nfrom random import randint\nbub_id = list()\nbub_r = list()\nbub_speed\
    \ = list()\nMIN_BUB_R = 10\nMAX_BUB_R = 30\nMAX_BUB_SPD = 100\ndef create_bubble():\n\
    \    x = WIDTH + GAP\n    y = randint(0, HEIGHT)\n    r = randint(MIN_BUB_R, MAX_BUB_R)\n\
    \    id1 = c.create_oval(x - r, y - r, x + r, y + r)\n    ub_id.append(id1)\n\
    bub_r.append(r)\nbub_speed.append(randint(1, MAX_BUB_SPD))\n```\n\nThis creates\
    \ three empty lists used to store the ID, radius (size), and speed of each bubble\n\
    \nSets the minimum radius of the bubble to 10, and the maximum to 30\n\nSets the\
    \ position of the bubble on the canvas\n\nPicks a random size for the bubble,\
    \ between the minimum and maximum possible\n\nThis line of code creates the bubble\
    \ shape\n\nAdds the ID, radius, and speed of the bubble to the three lists\n\n\
    # EXPERT TIPS\n\n# Bubble lists\n\nThree lists are used to store information about\
    \ each bubble. The lists start off empty, and information about each bubble is\
    \ added as you create. Each list stores a different bit of information.\n\n| bub_id:\
    \ stores the ID number of the bubble so the program can make it later. |\n| bub_r:\
    \ stores the radius (size) of the bubble. |\n| bub_speed: stores how fast the\
    \ bubble travels across the screen. |\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_168_1.png)\n\
    \nDon't forget to save your work"
  merge: -1
  img_proc: true
- pgno: 169
  md: "# 168 PLAYING WITH PYTHON\n\n# BUBBLE BLASTER\n\n# Make the bubbles move\n\n\
    There are now lists to store the ID, size, and speed of the bubbles, which are\
    \ randomly generated. The next stage is to write the code that makes the bubbles\
    \ move across the screen.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_169_0.png)\n\
    \n+   This function will go through the list of bubbles and move each one turn.\n\
    \n```\ndef move_bubbles():\n    for i in range(len(bub_id)):\n        c.move(bub_id[i],\
    \ -bub_speed[i], 0)\n```\n\n> Goes through each bubble in the list\n\n+   This\
    \ will be the main loop for the game. It will be repeated over and while the game\
    \ is running. Try running it!\n\n> Moves the bubble across the screen according\
    \ to its speed\n\n> Imports the functions you need from the Time library\n\n```\n\
    from time import sleep\nBUB_CHANCE = 10\n# MAIN GAME LOOP\nwhile True:\n    if\
    \ randint(1, BUB_CHANCE) == 1:\n        create_bubble()\n        move_bubbles()\n\
    \        window.update()\n        sleep(0.01)\n```\n\n> Generates a random number\
    \ from 1 to 10\n\n> If the random number is 1, the program creates a new bubble\
    \ (average 1 in 10 times - so there aren't too many bubbles!)\n\n> Slows the game\
    \ down so it's not too fast to play\n\n> Runs the \"move_bubbles\" function\n\n\
    > Updates the window to redraw bubbles that have moved\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_169_1.png)\n\
    \nDon't forget to save your work\n\n+   Now you're going to create a useful function\
    \ to find where particular bubble is, based on the ID. This code should be added\
    \ to the program after the code you created in step 5.\n\n> Works out the coordinate\
    \ of the bubble\n\n```\ndef get_coords(id_num):\n    pos = c.coords(id_num)\n\
    \    x = (pos[0] + pos[2])//2\n    y = (pos[1] + pos[3])//2\n    return x, y\n\
    ```\n\n> Works out the coordinate of the bubble\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_169_2.png)\n\
    \n(x0, y0)\n\n(x1, y1)\n\n# Locating bubbles\n\nThe function finds the middle\
    \ of the bubble by taking the point halfway between the corners of the box around\
    \ it."
  merge: -1
  img_proc: true
- pgno: 170
  md: "# # How to make bubbles pop\n\nThe player will score points when the bubbles\
    \ are popped, so the program has to make bubbles disappear from the screen. These\
    \ next functions will allow it to do that.\n\nThis function deletes the bubble\
    \ with ID \"i\"\n\nThis function will be used to remove a bubble from the game.\
    \ It does this by deleting it from all the lists, and this code should be added\
    \ directly after the code you typed out in step 7.\n\nDeletes the bubble from\
    \ the radius and speed lists\n\n```\ndef del_bubble(i):\n    del bub_r[i]\n  \
    \  del bub_speed[i]\n    c.delete(bub_id[i])\n    del bub_id[i]\n```\n\nDeletes\
    \ the bubble from the canvas\n\nDeletes the bubble from the ID list\n\nType this\
    \ code to create a function that cleans up bubbles that have floated off screen.\
    \ This code should go directly after the code from step 8.\n\n```\ndef clean_up_bubbles():\n\
    \    for i in range(len(bub_id)-1, -1, -1):\n        x, y = get_coords(bub_id[i])\n\
    \        if x < -GAP:\n            del_bubble(i)\n```\n\nThis goes through the\
    \ bubble list backward to avoid the \"for\" loop causing an error when bubbles\
    \ are deleted\n\nFind out where the bubble is\n\nIf the bubble is off the screen\
    \ then it is deleted; otherwise, it would slow the game down\n\nNow update the\
    \ main game loop (from step 6) to include the helpful functions you have just\
    \ created. Run it to make sure you haven't included any errors.\n\n# MAIN GAME\
    \ LOOP\nWhile:\n\n```\nif randint(1, BUB_CHANCE) == 1:\n    create_bubble()\n\
    move_bubbles()\nclean_up_bubbles()\nwindow.update()\n    sleep(0.01)\n```\n\n\
    Updates the positions\n\nof all bubbles\n\nMakes a new bubble\n\nRedraws the window\
    \ to show the changes\n\nRemoves bubbles that are off the screen\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_170_0.png)"
  merge: -1
  img_proc: true
- pgno: 171
  md: "# 170 PLAYING WITH PYTHON\n\n# BUBBLE BLASTER\n\n# Figuring out the distance\
    \ between points\n\nIn this game, and lots of others, it is useful to know the\
    \ distance between two objects. Here's how to use a well-known mathematical formula\
    \ to have the computer work it out.\n\n+   This function calculates the distance\
    \ between two objects. Add this bit of code directly after the code you wrote\
    \ in 9.\n\n```\nfrom math import sqrt\ndef distance(id1, id2):\n    x1, y1 = get_coords(id1)\n\
    \    x2, y2 = get_coords(12)\n    return sqrt((x2 - x1)**2 + (y2 - y1)**2)\n```\n\
    \n# Pop the bubbles\n\nThe player scores by popping bubbles. Big bubbles and fast\
    \ bubbles are worth more points. The next section of code works out each bubble\
    \ is popped by using its radius (the distance from the center to the edge).\n\n\
    +   When the submarine and a bubble crash into each other, the program needs to\
    \ pop the bubble and update the score. This bit of code could come directly after\
    \ the code in step 11.\n\n> Collision sensing\nIf the distance between the center\
    \ of the sub and the center of a bubble is less than their radii added together,\
    \ they have collided.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_171_0.png)\n\
    \n```\ndef collision():\n    points = 0\n    for bub in range(len(bub_id)-1, -1,\
