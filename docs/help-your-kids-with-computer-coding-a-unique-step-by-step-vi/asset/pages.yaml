- pgno: 155
  md: "# Making windows\n\nMany programs have windows and buttons that can be used\
    \ to control them. These make up the \"graphical user interface,\" or \"GUI\"\
    \ (pronounced gooey).\n\n# Make a simple window\n\nThe first step in creating\
    \ a GUI is to make the window that will hold everything inside it. Tkinter (from\
    \ Python's Standard Library) can be used to create a simple one.\n\n+   Enter\
    \ the code\nThis code imports Tkinter from the library and creates a new window.\
    \ Tkinter must be imported before it can be used.\n\n+   A Tkinter window appears\n\
    Run the code and a window appears. It looks a bit dull for now, but this is only\
    \ the first part of your GUI.\n\n```\nfrom tkinter import *\nwindow = Tk() # This\
    \ creates a Tkinter window\n```\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_155_0.png)\n\
    \n# Add buttons to the window\n\nMake the GUI more interactive by adding buttons.\
    \ A different message will be displayed when the user clicks each button.\n\n\
    +   Create two buttons\nWrite this code to create a simple window with two buttons.\n\
    \n```\nfrom tkinter import * # This message appears when button A is pressed\n\
    def bAction():\n    print('Thank you!') # This message appears when button B is\
    \ pressed\ndef bAction():\n    print('Ouch! That hurt!')\nwindow = Tk()\nbuttonA\
    \ = Button(window, text='Press me!', command=bAction)\nbuttonB = Button(window,\
    \ text='\\t press!', command=bAction)\nbuttonA.pack() # This label will appear\
    \ on button A\nbuttonB.pack() # This label will appear on button B\nThis code\
    \ tells the computer to put the buttons in the window\n```\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_155_1.png)"
  merge: -1
  img_proc: true
- pgno: 156
  md: "# MAKING WINDOWS\n\nClick the buttons to print messages\nWhen the program is\
    \ run, with two buttons appears. Click the buttons and different messages appear\
    \ in the shell. You've made an interactive GUI that responds to the user's commands.\n\
    \nTk\n\nClick the button to show a message\n\nOutput appears in the shell window\n\
    \nPress me!\n\nThank you!\n\nDon't press!\n\nOuch! That hurt!\n\n# Roll the dice\n\
    \nTkinter can be used to build a GUI for a simple application. The code below\
    \ creates a program that simulates rolling a six-sided dice.\n\n+   Create a dice\
    \ simulator\nThis program creates a button, when pressed, tells the function \"\
    roll()\" to display a random number between 1 and 6.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_156_0.png)\n\
    \n```\nfrom tkinter import *\nfrom random import randint\ndef roll():\n    text.delete(0.0,\
    \ END)\n    text.insert(END, str(randint(1,6)))\nwindow = Tk()\ntext = Text(window,\
    \ width=1, height=1)\nbuttonA = Button(window, text='Press to roll!', command=roll)\n\
    text.pack()\nbuttonA.pack()\n```\n\nThis imports the function \"randint\" from\
    \ the random library\n\nThis clears the text inside the box and replaces it with\
    \ a random number between 1 and 6\n\nThis creates a text box to display the random\
    \ number\n\nThis tells the program function to run when the button is clicked\n\
    \nThis label appears on the button\n\n+   Press the button tonroll the dice\n\
    Run the program, then click the button to roll the dice and see the result. This\
    \ program can be simply changed so that it simulates a 12-sided dice, or a coin\
    \ being tossed.\n\nTk\n\n# EXPERT TIPS\n\n# Clear and simple\n\nWhen you're designing\
    \ a GUI, not to confuse the user by filling the screen with many buttons. Label\
    \ each button with a sensible name to make the application easy to understand.\n\
    \n6\n\nPress to roll!\n\nA new number appears here each time the button is clicked\n\
    \n![](img/72d218a7a73c4d4abc7be582ebd85385_156_1.png)"
