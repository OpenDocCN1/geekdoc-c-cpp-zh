- pgno: 23
  md: '# # What is Scratch?


    Scratch is a visual programming language that makes coding simple. It can be used
    to make all sorts of fun and interesting programs.


    # Understanding Scratch


    Scratch is perfect for making games and animations. It has large collections (or
    "libraries") of cool graphics and sounds that you can play around with.


    | SEE ALSO |

    | Installing and 24–25 > launching Scratch |

    | Scratch 26–27 > interface |

    | Colored blocks 30–31 > and scripts |


    ![](img/72d218a7a73c4d4abc7be582ebd85385_23_0.png)


    +   **Start programming**n Scratch is a programming language. There''s not much
    typing, and it''s easy to get started.

    **Put together programming blocks**n Scratch uses colored blocks of code. Blocks
    are selected and joined together to make a script, which is a set of instructions.


    Write your first program in Scratch!


    > LINGO

    Why is it called Scratch?

    "Scratching" is a way of mixing different sounds to make new music. The Scratch
    programming language enables you to mix pictures, sounds, and scripts to make
    new computer programs.


    +   **Make sprites move and speak**n Objects such as people, vehicles, and animals
    can be added to a program. These objects are called sprites. Scripts make them
    move and speak.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_23_1.png)


    Sprites can be programmed to walk, run, and dance'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# A typical Scratch program


    Here is an example of a Scratch program. All of the action takes place in an area
    on the screen called the "stage." Background images and sprites can be added to
    the stage, and you can write scripts to make things happen.


    The red button stops a program


    The green flag runs a program


    +   Running a program

    Starting a program is called "running" it. To run a program in Scratch, click
    the green flag above the stage.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_24_0.png)


    Background image Adding a script makes the shark sprite move Several sprites can
    be on the stage at once


    +   Scripts make sprites move

    atch contains blocks that can be used to make scripts. This script makes the shark
    bounce around the screen. The "next costume" block makes it open and close the
    mouth with each movement.


    The "forever" block keeps the sprite moving endlessly


    | | clicked |

    |---||

    | forever |

    | next costume |

    | wait 0.25 secs |

    | move 10 steps |

    | if edge, bounce |


    > REMEMBER

    Scratch programs

    In Scratch, when you save your work it is called a "project." A project includes
    all the sprites, backgrounds, sounds, and scripts you''re working with. When you
    load project again later, everything will be where it was when you saved it. A
    Scratch project is a computer program.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Installing and launching Scratch


    To start programming in Scratch, you need to have the Scratch software. It can
    be installed on a computer, or it can be used online.


    > REMEMBER

    Scratch website


    Find the Scratch website at:

    ://scratch.mit.edu/


    ![](img/72d218a7a73c4d4abc7be582ebd85385_25_0.png)


    # Create a Scratch account


    A Scratch account can be used to share the programs you make on the Scratch website.
    It''s also used to save work online. Visit the Scratch website at: http://scratch.mit.edu/
    and click "Join Scratch" to create your account.


    +   - Getting started

    The way Scratch is set up depends on whether it''s used over the Internet (online)
    or from downloaded software (offline).


    ![](img/72d218a7a73c4d4abc7be582ebd85385_25_1.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_25_2.png)


    # Set-up


    # Launching Scratch


    Visit http://scratch.mit.edu and click "Join Scratch." Fill in the form to create
    a username and password. Make sure you get permission from your parent or caregiver
    to join the website.


    Once you''ve joined the Scratch website, click "Sign in," and enter your username
    and password. Click "Create" at the top of the screen to begin a new program.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_25_3.png)


    Download the software version of Scratch at: http://scratch.mit.edu/scratch2download/.
    Run the installation program and a Scratch icon will appear on your desktop.


    Double-click the icon on the desktop and Scratch will start, ready to begin programming.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_25_4.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_25_5.png)'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# INSTALLING AND LAUNCHING SCRATCH


    # EXPERT TIPS


    # Different versions of Scratch


    # Mouse control


    The "click" instruction means press the left mouse button if there is more than
    one. "Right-click" means use the right mouse button. If a mouse has only one button,
    hold the "CTRL" key on the keyboard and press the mouse button to perform a right-click.


    This book uses Scratch 2.0, the latest version of Scratch. Use this version if
    possible. An older version will differ slightly.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_26_0.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_26_1.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_26_2.png)


    +   Scratch 1.4


    +   Scratch 2.0


    The older version of Scratch has the stage on the right of the screen.


    The latest version of Scratch has some new commands and the stage is on the left
    of the screen.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_26_3.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_26_4.png)


    # 3 Saving work


    # 4 Operating systems


    When you''re logged in, Scratch automatically saves work for you. To find your
    work, click your username at the top right of the screen and click "My Stuff."


    The web version of Scratch works well on Windows, Ubuntu, and Mac operating systems.
    It needs Adobe Flash software, though, so it won''t work on some tablets.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_26_5.png)


    Click the "File" menu at the top of the screen and choose "Save As." Ask the person
    who owns the computer where you should save your work.


    The offline version of Scratch works well on computers with Windows and Mac operating
    systems. It doesn''t work on computers that use Ubuntu. If a computer uses Ubuntu,
    try the online version instead.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_26_6.png)'
  merge: -1
  img_proc: true
