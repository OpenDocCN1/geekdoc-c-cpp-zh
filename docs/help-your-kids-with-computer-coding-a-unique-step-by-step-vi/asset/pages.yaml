- pgno: 63
  md: '# True or false?


    Computers decide what to do by asking questions and determining whether the answers
    are true or false. Questions that only have two possible answers are called “Boolean
    expressions”.


    # SEE ALSO


    +   - Decisions and 64–65 > branches


    +   - Making 118–119 > decisions


    # Comparing numbers


    You can compare numbers using the “=” block from the “Operators” section of the
    blocks palette.


    # “=” block


    This block will give one of two answers:“true” if the two numbers in the boxes
    are equal, and “false” if they aren’t.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_63_0.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_63_1.png)


    True answer

    Using “=”block in a speech block will make “true” or “false”appear in a sprite’s
    speech bubble.


    False answer

    If the numbers in the block are different, the sprite’s speech bubble will contain
    the word “false”.


    # Comparing variables


    You can use variables inside comparison blocks. It’s not worth comparing fixed
    numbers because the result will always be the same, whereas the value of variables
    can change.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_63_2.png)


    This means “equals”, so the block is asking if ‘age’ is equal to 7. The answer
    is “false”, because “age” is 10


    ![](img/72d218a7a73c4d4abc7be582ebd85385_63_3.png)


    This means “more than”, so the block is asking if ‘age’ is greater than 11. The
    answer is “false”, 10 is not bigger than 11


    ![](img/72d218a7a73c4d4abc7be582ebd85385_63_4.png)


    This means “less than”, so the block is asking if ‘age’ is less than 18. The answer
    will be “true”, 10 is smaller than 18


    ![](img/72d218a7a73c4d4abc7be582ebd85385_63_5.png)


    Create a variable

    Click the “Data” block in the blocks palette and create a new variable called
    ‘age’. Set its value to 10 (click on the block to make sure the value changed).
    Drag the “age”variable into the comparison blocks.


    # Comparing numbers


    Find the green comparison blocks in the “Operators” menu. As well as checking
    whether two numbers are equal, you can check whether one is greater or less than.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# TRUE OR FALSE?


    ![](img/72d218a7a73c4d4abc7be582ebd85385_64_0.png)


    # Comparing words


    The "=" block is not just used for numbers; it can also be used to check whether
    two strings are the same. It ignores capital letters when comparing strings.


    The variable "name" contains "Lizzie", so the answer is true


    ![](img/72d218a7a73c4d4abc7be582ebd85385_64_1.png)


    Drag and drop the variable into the comparison block


    The answer is false because the variable doesn''t contain "Dan"


    ![](img/72d218a7a73c4d4abc7be582ebd85385_64_2.png)


    +   Create a variable

    to experiment with comparing strings, create a new variable "name" and set its
    value to "Lizzie".


    # Not!


    The "not" block can simplify things by reversing the answer of a Boolean expression,
    it''s easier to check if someone''s age is not 10 to check if every other possible
    age.


    The "not" block changes the answer around, from true to false and from false to
    true.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_64_3.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_64_4.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_64_5.png)


    +   Without the "not" block

    Here, 10 isn''t equal to 7, so the answer is false.


    +   With the "not" block

    Adding the "not" block to the same question changes the answer. Because 7 does
    not equal 10, the answer is now true.


    # Combining questions


    To ask more complicated questions, you can combine comparison blocks and ask more
    than one question at the same time.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_64_6.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_64_7.png)


    Comparison blocks

    The "or" and "and" blocks are used to combine Boolean expressions in different
    ways.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_64_8.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_64_9.png)


    Here, the answer is true when either the left or the right side is true


    The answer here is only when both the left and right sides are true


    +   In practice

    The top block checks whether someone is under 18 or older than 65. The bottom
    block checks if they are aged 11, 12, 13, or 14.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_64_10.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_64_11.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_64_12.png)'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Decisions and branches


    Tests of whether something is true or false can be used to tell the computer what
    to do next. It will perform a different action depending on whether the answer
    is true or false.


    # Making decisions


    The "if" blocks use Boolean expressions to decide what to do next. To use them,
    put other blocks inside their "jaws". The blocks inside the "if" blocks will only
    run if the answer to the Boolean expression is true.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_65_0.png)


    SEE ALSO

    | 62–63 True or false? |

    | Sensing and 66–67 detecting |


    ![](img/72d218a7a73c4d4abc7be582ebd85385_65_1.png)


    +   “if-then” block

    If Boolean expression is true, the blocks between the “if-then” block''s jaws
    will run.


    +   “if-then else” block

    If Boolean expression is true, the first set of blocks runs. If not, the second
    set runs.


    # Using the "if-then" block


    The "if-then" block lets you choose whether or not to run part of a script depending
    on the answer to a Boolean expression. Attach this script to the cat to sprite
    it out.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_65_2.png)


    ```

    when clicked ask Do you want me to meow? and wait answer = yes play sound meow
    until done think hmm for 2 secs think Time to eat some fish! for 2 secs

    ```


    Is answer?

    | True False |

    Play Skip

    meow meow |


    > “=" block from the “Operators" section into the "if-then" block. Then put the
    "variable" from the "Sensing" section inside it


    > This is inside the jaws of the "if-then" block, so the cat will only meow if
    the answer is "yes"


    > This is the end of the "if-then" block


    > “think" blocks are outside the "if-then" loop, they will run whatever the answer
    is to the question


    +   Meowing

    This program checks the Boolean expression and will only run the part between
    the "if-then" block''s jaws if it is true. This means the cat only meows when
    you tell it to.


    +   How it works

    The program checks whether the Boolean expression is true. If it is, it runs the
    blocks inside the "if-then" block''s.'
