- pgno: 181
  md: '# Inside a computer


    The earliest computers were simple calculators. At a basic level, computers haven''t
    changed much since then. They take in data (input), perform calculations, and
    give out answers (output).


    # Basic elements


    A computer consists of four parts: input, memory, processor, and output. Input
    devices gather data, similar to the way your eyes or ears collect information
    about the world around you. Memory stores the data, while processors examine and
    alter it, just like a human brain. Output devices show the results of the calculations,
    like a person speaking or moving after deciding what to do.


    The memory contains information in sections, like books on library shelves. Memory
    is used to store programs and the data they use


    # Memory


    The control unit retrieves programs from the memory in order to run them


    ![](img/72d218a7a73c4d4abc7be582ebd85385_181_0.png)


    +   Von Neumann architecture


    A scientist called John von Neumann first came up with the standard layout for
    a computer in 1945. His plan is still followed today, with some improvements.


    The control unit loads and carries out instructions from programs


    # Processor


    # Input


    # Control unit


    Language and information can be input through the keyboard


    ![](img/72d218a7a73c4d4abc7be582ebd85385_181_1.png)


    Keyboard


    Icons and menus can be selected using the mouse


    Mouse


    ![](img/72d218a7a73c4d4abc7be582ebd85385_181_2.png)'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Computer hardware


    Hardware is the physical parts of a computer. Computers contain many different
    bits of hardware working together. As computer makers pack more and more features
    into smaller machines, the hardware components have to be smaller, generate less
    heat, and use less power.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_182_0.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_182_1.png)


    # GIGO


    "Garbage in, garbage out" ("GIGO for short) is a computing phrase meaning that
    even the best programs will output nonsense if they receive the wrong input.


    The arithmetic logic unit retrieves data for its calculations from the memory


    The processor is made up of two parts, one to carry out instructions and the other
    to perform calculations


    ![](img/72d218a7a73c4d4abc7be582ebd85385_182_2.png)


    The arithmetic logic unit (ALU) performs any calculations the program needs


    # Arithmetic logic unit


    # Output


    Printers output data onto paper


    Speakers turn data into sounds


    ![](img/72d218a7a73c4d4abc7be582ebd85385_182_3.png)


    Printer


    Screens provide visual output


    Screen


    Speaker'
