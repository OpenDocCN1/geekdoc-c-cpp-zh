- pgno: 45
  md: '# STARTING FROM SCRATCH


    # Events


    The brown "Events" blocks in Scratch start scripts when certain things happen.
    For example, when the user presses a key, clicks a sprite, or uses a webcam or
    microphone.


    SEE ALSO

    | Sensing 66–67 > and detecting |

    | Sending 70–71 > messages |


    # Clicking


    A script can be added to a sprite that makes it do something if the sprite is
    clicked while the program is running. Experiment with different blocks to see
    what a sprite can do when clicked.


    > LINGO

    What is an event?


    An event is something that happens, such as a key being pressed or the green flag
    clicked. The blocks that look for events at the top of a script. The script waits
    until the event happens, and then it runs.


    Drag this block from the "Events" menu to start the script


    ```

    when this sprite clicked

    s sound meow until done

    ```


    +   Click a sprite

    This script makes the cat sprite meow when you click it.


    The cat sprite already has this sound effect attached to it


    ![](img/72d218a7a73c4d4abc7be582ebd85385_45_0.png)


    # Key presses


    Programs can be built to react when different keys on the keyboard are pressed.
    For another way of using the keyboard that is better for creating games, see pages
    66–67.


    Choose the key here


    Change the text here


    Choose the key here


    ```

    when h key pressed

    say Hello! for 1 secs

    ```


    ```

    when g key pressed

    say Goodbye! for 1 secs

    ```


    +   Say hello

    Add this script to a sprite and when H key is pressed, the sprite says "Hello!"


    +   Say goodbye

    This script uses the G key to make a sprite say "Goodbye!"'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Sound events


    If your computer has a microphone, sprites can detect how loud sounds in a room
    are on a scale of 0 (very quiet) to 100 (very loud). Use the “when loudness >
    10”block to make a script when the sounds are loud enough.


    # EXPERT TIPS


    # Asking permission


    Scratch asks for permission to use your webcam and microphone. When the box pops
    up, click “Allow.”


    # Make the cat sensitive to noise


    Start a new project, and add the “room3” backdrop image from the backdrop library.
    Drag the cat sprite on the chair and add the script shown here.


    # Shout at the cat


    Shout into the microphone—the cat will jump out of its seat with fright and meow.
    It will also respond to music and other sounds if they are loud enough.


    ```

    when loudness > (40)

    go to x: (145) y: (130)

    play sound meow until done

    go to x: (145) y: (0)

    ```


    Change the number to 40


    This makes the cat jump up


    This makes the cat fall back down


    ![](img/72d218a7a73c4d4abc7be582ebd85385_46_0.png)


    # Webcam motion detector


    If you have a webcam, it can be used with Scratch too Add this script to the cat,
    and when you wave at the webcam, it will mew back.


    ```

    when video motion > (40)

    play meow until done

    ```


    Change the number to 40


    > Detect motion


    Use the “when loudness > 10”block. Click the menu to change “loudness” to “video
    motion.”The script will start when you’re moving around enough.


    # EXPERT TIPS


    # Backdrop changes


    A sprite can react to the backdrop changing. For example, you can have a backdrop
    that makes the sprite disappear. Upload a new backdrop from the stage list in
    the bottom left of the screen, and then add the “when backdrop switches to block
    to do this.


    Choose the backdrop here


    ```

    when backdrop switches to (desert)

    hide

    ```


    Hides the sprite when the backdrop changes'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# # Simple loops


    A loop is a part of a program that repeats itself. The loop blocks (from the "Control"
    section) tell Scratch which blocks to repeat, and how many times. They save us
    from adding the same blocks over and over again.


    # SEE ALSO


    | Complex 68-69 |n| loops |n| Loops 122-123 |n| in Python |


    # Forever loop


    Whatever you put inside the "forever" block repeats itself forever. There''s no
    option to join anything at the bottom, because a "forever" loop never ends.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_47_0.png)


    No option to add more Scratch blocks


    > Looping forever

    When the last block inside the loop ends, the loop goes back to the start again.


    When the actions finish the program goes back to the start of the loop again


    # Repeat loop


    To repeat an action a certain number of times, use a "repeat 10" block. Change
    the number in it to set how many times the loop will repeat itself. Add the "Dinosaur1"
    sprite to a new project and build it script.


    # REMEMBER

    Loop shape


    The loop blocks are shaped like jaws. Drop the blocks that you want to repeat
    into the jaws, so the loop wraps around them. As you add more blocks, the jaws
    stretch to make room for them.


    Add more blocks after a "repeat" loop


    Dancing dino

    When the green flag is clicked, the dinosaur dances. He repeats his moves three
    times.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_47_1.png)'
  merge: -1
  img_proc: true
