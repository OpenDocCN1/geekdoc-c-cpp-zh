- pgno: 130
  md: "# Using lists\n\nOnce a list has been created, you can write programs to manipulate\
    \ the data inside it—in a loop; for example. You can also combine lists to make\
    \ new lists.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_130_0.png)\n\n# Mutable\
    \ objects\n\nLists in Python are \"mutable\". This means they can change. You\
    \ can add or delete items, or switch around their order. Other functions in Python,\
    \ such as tuples (pp. 134–135), can't altered once you create them. They are called\
    \ \"immutable\".\n\n+   - The list is stored in the variable \"names\"\n\n```\n\
    >>> names = ['Simon', 'Kate', 'Vanya']\n>>> for item in names:\n    print('Hello',\
    \ item)\n```\n\n+   - The body of the loop must be indented by four spaces\n\n\
    Hello Simon\nHello Kate\nHello Vanya\n\n+   - When run, this program displays\
    \ \"Hello\", followed by each name on the list\n\n# Lists in loops\n\nYou can\
    \ use a loop to work through every item in a list. This program says \"Hello\"\
    \ to a series of names, one after the other.\n\n```\nx = [1, 2, 3, 4]\ny = [5,\
    \ 6, 7, 8]\nz = x + y\nprint(z)\n[1, 2, 3, 4, 5, 6, 7, 8]\n```\n\n+   - Remember,\
    \ lists are contained within square brackets\n\n+   - The new list contains everything\
    \ from list \"x\" followed by everything from list \"y\"\n\n# Adding lists\n\n\
    Two lists can be added together. The new list will contain the items from both\
    \ of the old lists.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_130_1.png)\n\n\
    +   - Lists in lists\n\nThe items in a list are themselves. The \"suitcase\" list\
    \ below contains lists of clothes—one is a suitcase shared by people, who each\
    \ pack three items.\n\nBecause the list is inside square brackets, it becomes\
    \ an individual item within the \"suitcase\"—suitcase[0]\n\n\"suitcase[1]\"\n\n\
    ```\n>>> suitcase=[['hat', 'tie', 'sock'], ['bag', 'shoe', 'shirt']]\n>>> print(suitcase)\n\
    [['hat', 'tie', 'sock'], ['bag', 'shoe', 'shirt']]\n>>> print(suitcase[1])\n['bag',\
    \ 'shoe', 'shirt']\n>>> print(suitcase[1][2])\n```\n\nThis will print the suitcase\
    \ list\n\nThis will print everything in the second list, \"suitcase[1]\"\n\nThis\
    \ prints the item at index 2 in \"suitcase[1]\"—remember, Python starts counting\
    \ the items from zero\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_130_2.png)"
  merge: -1
  img_proc: true
- pgno: 131
  md: "# # Functions\n\nA function is a piece of code that performs a specific task.\
    \ It bundles the code, gives it a name, and can be used any time by “calling”\
    \ it. A function can be used to avoid entering the same lines of code more than\
    \ once.\n\nSEE ALSO\nSilly 132–123 > sentences\nVariables and 138–139 > functions\n\
    \n# ## Useful functions\n\nPython contains lots of useful functions for performing\
    \ certain tasks. When a function is called, Python retrieves the code for that\
    \ function and then runs it. When the function is finished, the program returns\
    \ to the line of code that called it and runs the next command.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_131_0.png)\n\
    \n![](img/72d218a7a73c4d4abc7be582ebd85385_131_1.png)\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_131_2.png)\n\
    \n“print()” function\nThis function lets the program send output to the user by\
    \ printing instructions or results on the screen.\n\n“input()” function\nThis\
    \ function is the offset of “print()” function. It lets the user give instructions\
    \ or data to the program by typing them in.\n\n“randint()” function\nThis function\
    \ gives a random number (like throwing a dice). It can be used to add an element\
    \ of chance to programs.\n\n# ## Making and calling functions\n\nThe functions\
    \ that come with Python aren’t the only ones that can be used. To make a new function,\
    \ collect the code you want to use in a special “wrapper” and give it a name.\
    \ This name allows the function to be called whenever it is needed.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_131_3.png)\n\
    \n+   1 Define a function\nThe definition of a function will always have the keyword\
    \ “def” and the function’s name at the beginning of the code.\n\n+   2 Call the\
    \ function\nTyping the function name followed by parentheses into the shell window\
    \ calls the function and shows the output.\n\n```\ndef greeting():\n    print('Hello!')\n\
    ```\n\nA colon marks the end of the function’s name and the start of the code\
    \ it contains\n\n```\n>>> greeting():\nHello!\n```\n\nThis is the code within\
    \ the function\n\nThe “greeting” function is called and the output is displayed\n\
    \nParentheses show that this is a function call, not a variable"
  merge: -1
  img_proc: true
- pgno: 132
  md: "# Passing data to functions\n\nA function has to be told values to work with.\
    \ For example, in \"print(a, b, c)\", the function \"print()\" is passed the values\
    \ \"a\", \"b\", and \"c\". In \"height(1, 45)\", the values 1 and 45 are being\
    \ passed to the function \"height\".\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_132_0.png)\n\
    \n+   Add parameters to the function\nValues passed to a function are called \"\
    parameters\". Parameters are put inside parentheses next to the function's name\
    \ in its definition.\n\n+   Values are defined\nThe code inside the function uses\
    \ the values that are passed to it.\n\n\"m\" and \"cm\" are the parameters\n\n\
    Calls the function to get the answer when \"m\" = 1 and \"cm\" = 45\n\n```\ndef\
    \ height(m, cm):\n    total = (100 * m) + cm\n    print(total, 'cm tall')\n```\n\
    \n```\n>>> height(1, 45)\n145 cm tall\n```\n\nPrints the value of \"total\" followed\
    \ by \"cm tall\"\n\nShows that 1 m 45 cm is equal to 145 cm\n\nWork out in the\
    \ total \"cm\", the value of \"m\" needs to be multiplied by 100 (because 1 m\
    \ = 100)\n\n# Getting data back from functions\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_132_1.png)\n\
    \nFunctions are most useful when they send some data back to the program—a return\
    \ value. To make a function return a value, add \"return\" followed by the value\
    \ to be sent.\n\n+   Define a function that returns a number\nPython's \"input()\"\
    \ always returns a string, even if never is a number. The new function below gives\
    \ back a number number.\n\n+   Number as output\nIf the program used the function\
    \ \"input\", \"a + b\" would put the strings \"10\" and \"7\" together to get\
    \ \"107\".\n\n```\ndef num_input(prompt):\n    type = input(prompt)\n    num =\
    \ int(type)\n    return num\n```\n\n```\nEnter a 10\nEnter b 7\na + b = 17\n```\n\
    \nReturns the value stored in the variable\n\nThis converts the string into a\
    \ number and stores it in the variable \"num\"\n\n```\na = num_input('Enter a')\n\
    b = num_input('Enter b')\nprint('a + b =', a + b)\n```\n\nAdding \"a + b\" outputs\
    \ \"107\" because the function \"num_input\" gives back numbers, not strings"
  merge: -1
  img_proc: true
