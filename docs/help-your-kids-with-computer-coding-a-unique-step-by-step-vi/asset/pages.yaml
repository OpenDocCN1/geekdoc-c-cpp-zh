- pgno: 166
  md: "# Create the game window and the submarine\n\nStart by setting the scene. Open\
    \ a new code window in IDLE. Type in the code below to create the window for the\
    \ game, and the submarine that the player controls.\n\nIDLE File Edit Shell Debug\
    \ Window Help\nBubble Blaster\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_166_0.png)\n\
    \n+   The Tkinter library to build the graphical user interface (GUI). This code\
    \ will create the main window for the game.\n\n```\nfrom tkinter import * Imports\
    \ all of the\nTkinter functions\nHEIGHT = 500 Sets the size\nWIDTH = 800 of the\
    \ window\nwindow = Tk() Give the game\nsnappy\nwindow.title('Bubble Blaster')\
    \ Sets dark blue as\nthe color of the\nbackground (the)\nc = Canvas(window, width=WIDTH,\
    \ height=HEIGHT, bg='darkblue')\nc.pack()\n```\n\nCreates a canvas that can be\
    \ drawn on\n\n+   A simple graphic will represent the submarine in this game.\
    \ This can be made using the drawing functions from Tkinter. Type out this code,\
    \ then run it.\n\nThe submarine will be represented by a triangle inside\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_166_1.png)\n\
    \nDraw a red triangle for the submarine\n\n```\nship_id = c.create_polygon(5,\
    \ 5, 5, 25, 30, 15, fill='red')\nship_id2 = c.create_oval(0, 0, 30, 30, outline='red')\n\
    SHIP_R = 15 The radius of the submarine\nMID_X = WIDTH / 2 The variables \"MID_X\
    \ and Draws a red\n\"MID_Y\" gives the coordinates circle outline\nthe middle\
    \ of the screen\nMID_Y = HEIGHT / 2 \nc.move(ship_id, MID_X, MID_Y) Moves both\
    \ parts of the submarine\nc.move(ship_id2, MID_X, MID_Y) to the center of the\
    \ screen\n```\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_166_2.png)\n\nDon't\
    \ forget to save your work"
