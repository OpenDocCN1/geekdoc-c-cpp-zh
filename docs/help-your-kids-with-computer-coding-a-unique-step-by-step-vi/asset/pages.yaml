    \ score of how many bats the player hits, and add a game over screen that appears\
    \ once the player is out of time.\n\nCreate a new variable called \"Time\". Make\
    \ sure it's available for all sprites in the game by selecting the \"For all sprites\"\
    \ option. Check that the box next to the variable in the blocks palette is ticked,\
    \ so that players can see the time displayed on the stage.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_79_0.png)\n\
    \n+   Click on the small picture of the stage in the list, then select the \"\
    Backdrops\" tab above the blocks palette. Right-click the existing backdrop and\
    \ duplicate it. Add the words \"GAME OVER\" to the new backdrop.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_79_1.png)\n\
    \nUse the text tool to write on the duplicate backdrop\n\nYour \"game over\" screen\
    \ will look something like this\n\n+   Click the \"Scripts\" tab and add this\
    \ script to the stage to set up the timer. When the timer begins, it starts a\
    \ count-down loop. When the loop finishes, \"GAME OVER\" screen is shown and the\
    \ game ends.\n\n```\nwhen clicked\nswitch backdrop to wall1\nset Time to 30\n\
    repeat until\n  Time = 0\nwait 1 secs\nchange Time by -1\n```\n\nThis sets the\
    \ time limit to 30 seconds\n\nCounts down until the timer reaches zero\n\nEnds\
    \ the game\n\n```\nswitch backdrop to wall2\nstop all\n```\n\nSwitches to the\
    \ \"GAME OVER\" backdrop"
