- pgno: 151
  md: '# Algorithms


    An algorithm is a set of instructions for performing a task. Some algorithms are
    more efficient than others and take less time or effort. Different types of algorithms
    can be used for simple tasks such as sorting a list of numbers.


    > SEE ALSO

    < 16–17 Think like a computer

    Libraries 152–153 >


    # Insertion sort


    Imagine you''ve been given your class''s exam papers to put in order from the
    lowest to the highest mark. "Insertion sort" creates a sorted section at the top
    of the pile and then inserts each unsorted paper into the correct position.


    +   - How it works "Insertion sort" goes through each of these stages sorting
    the numbers far quicker than a human could.


    When counting the positions, Python starts at 0


    ![](img/72d218a7a73c4d4abc7be582ebd85385_151_0.png)


    +   - Sorting in order "Insertion sort" takes each paper in turn and inserts it
    into the correct (sorted) place.


    6 is sorted into position 1


    6 is more than 2, so is sorted after 2 in the sorted section


    5 is sorted into position 1


    The value of 5 is between 2 and 6, and so moves to position 1. 6 shifts to position
    2


    1 is sorted into position 0


    1 is less than 2, so moves to position 0. 2, 5 and 6 shuffle down


    4 is sorted into position 2


    4 is between 2 and 5, so moves to position 2. 5 and 6 shuffle down


    3 is sorted into position 2


    Sorted!


    4, 5, and 6 shuffle along to make room for 3 in position 2'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Selection sort


    "Selection sort" works differently to "insertion sort". It swaps pairs of items
    rather than constantly shifting all of the items. Each swap moves one number to
    its final (sorted) position.


    Swap the smallest value with the first value


    ![](img/72d218a7a73c4d4abc7be582ebd85385_152_0.png)


    Swapping positions

    Switching one with another is usually quick and doesn''t affect anything else
    in the list.


    Swaps 1 and 2


    ![](img/72d218a7a73c4d4abc7be582ebd85385_152_1.png)


    Swap the smallest value in the unsorted part (2) with the first value in the unsorted
    part (6)


    Swaps 2 and 6


    ![](img/72d218a7a73c4d4abc7be582ebd85385_152_2.png)


    3 is the smallest value in the unsorted part. Swap it with 5, the first value
    in the unsorted part


    Swaps 3 and 5


    ![](img/72d218a7a73c4d4abc7be582ebd85385_152_3.png)


    5 isn''t in the right position yet, but 4 is smaller so it''s swapped


    Swaps 4 and 6


    ![](img/72d218a7a73c4d4abc7be582ebd85385_152_4.png)


    The largest number is in last position after the swap, so no further swapping
    is required


    Sorted!


    ![](img/72d218a7a73c4d4abc7be582ebd85385_152_5.png)


    # EXPERT TIPS


    # Sorting in Python


    There are lots of different sorting algorithms, each with different strengths
    and weaknesses. Python''s "sort()" uses an algorithm called "Timsort", named after
    its designer, Tim Peters. It''s based on two sorting algorithms: "Insertion sort"
    and "Merge sort". Type in this code to see how it works.


    > "a" is a list of unsorted numbers


    ```

    >>> a = [4, 9, 3, 8, 2, 6, 1, 5, 7]

    >>> a.sort()

    >>> a

    [1, 2, 3, 4, 5, 6, 7, 8, 9]

    ```


    This calls the "sort()" function


    The numbers in list "a" are now sorted'
