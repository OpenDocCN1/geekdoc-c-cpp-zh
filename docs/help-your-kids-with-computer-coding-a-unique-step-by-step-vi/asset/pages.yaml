- pgno: 33
  md: '# # Escape the dragon!


    This project introduces some basic Scratch coding. It shows how to make a game
    to help the cat sprite dodge a fire-breathing dragon.


    # ## Make the cat move


    This stage explains how to make the cat sprite move around and chase the mouse-pointer.
    Follow the instructions carefully because the game might not work.


    +   1 Open Scratch. Click "File" on the menu and select "New" to start a new project.
    The cat sprite appears.


    +   2 Click the yellow "Control" button in the blocks palette. Then click the
    "forever" block, keep the mouse button down, and drag the block into the scripts
    area on the right. Release the button to drop the block.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_33_0.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_33_1.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_33_2.png)


    ```

    wait 10 secs

    repeat 10

    forever


    forever

    ```


    Drag the block into the scripts area


    ![](img/72d218a7a73c4d4abc7be582ebd85385_33_3.png)


    +   3 Click the blue "Motion" button in the blocks palette. The blue "Motion"
    commands will appear. Drag the "point toward" block into scripts area and drop
    it inside the "forever" block. Click the block arrow in the block and choose "mouse-pointer".


    +   4 Click the "Events" button in the blocks palette. Drag thewhen green flag
    clicked" block into the scripts area. Join it to the top of your script.


    This block snaps to the top of the script


    ![](img/72d218a7a73c4d4abc7be582ebd85385_33_4.png)


    ```

    clicked

    forever

    point towards mouse-pointer

    ```


    The menu shows "mouse-pointer" has been chosen'
  merge: -1
  img_proc: true
