- pgno: 157
  md: '# Color and coordinates


    Pictures and graphics on a computer screen are made up of tiny colored dots pixels.
    To create graphics in a program, the computer needs to be told exactly what color
    each pixel should.


    # SEE ALSO


    +   - 154–155 Making windows

    - Making 158–159 shapes

    - Changing 160–161 things


    # Selecting colors


    # EXPERT TIPS


    It''s important to describe colors in a way that computers can understand. Tkinter
    includes a useful tool to help you do this.


    # Mixing colors


    Each pixel can give out red, green, and blue light. By mixing these colors together,
    you can make any color imaginable.


    +   1 Launch the color selection tool

    Type the following code into the shell window to launch the Tkinter tool for selecting
    colors.


    This imports all of the Tkinter functions


    Red and green make yellow

    Red and blue make purple


    ```

    >>> from tkinter import *

    >>> t = Tk()

    >>> colorchooser.askcolor()

    ```


    Use the American spelling of color


    Select the color you want by clicking on it


    Mixing all three makes white


    +   2 Choose a color

    The "color chooser" window will appear. Pick the color you want and then click
    the "OK" button.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_157_0.png)


    This window makes it easy to pick the exact color you want


    +   3 Color values

    When a color is selected, a list of numbers will appear in the shell window. These
    numbers are the values of red, green, and blue that have been mixed to make the
    chosen color.


    ```

    ((60.234, 190.742, 52.203), ''#3cbe34'')

    ```


    +   - Red value

    - Green value

    - Blue value

    - Code for the color in hexadecimal (see pp.182–183)'
