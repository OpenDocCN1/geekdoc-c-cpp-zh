- pgno: 217
  md: '# Become a master programmer


    The secret to becoming a master programmer is to have fun. As long as you''re
    enjoying yourself, no limit to how skilled you can become at coding, whether as
    a hobby or a lifelong career.


    +   SEE ALSO

    - 176-177 What next?

    - 214-215 Mini computers


    # Ways to become a better programmer


    Like skiing, learning the piano, or playing tennis, coding is a skill that you''ll
    get better and better over time. It can take years to become a true expert, but
    if you''re having fun on the way, it will feel like an effortless journey. Here
    are a few tips to help you become a master programmer.


    +   Code a lot

    People say practice makes perfect—and it''s true. The more code you write, the
    better you''ll get. Keep going and you''ll soon be an expert.


    +   Be nosy

    Read websites and books about programming and try out other people''s code. You''ll
    pick up expert tips and tricks that might have you years to figure out on your
    own.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_217_0.png)


    +   Steal ideas

    If you come across a great program, think how you might code it in your own. Look
    for clever ideas to use the best programmers copy each other''s ideas and try
    to improve them.


    +   Show a friend

    Teach someone else to code and you''ll learn a lot yourself. Explaining how coding
    works is a great way of making sure you understand it thoroughly.


    +   Train your brain

    Your brain is like a muscle—if you exercise it, it will get stronger. Do things
    that you think like a programmer. Solve logic puzzles and brainteasers, take up
    Sudoku, and work on your math.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Test your code


    Test your code by entering crazy values to see what happens. See how well it stands
    up to errors. Try rewriting it to improve it or try rewriting someone else''s—you''ll
    learn all their secret tricks.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_218_0.png)


    | Scala | Pascal | SQL |

    | Ruby on rails | C++ |


    ![](img/72d218a7a73c4d4abc7be582ebd85385_218_1.png)


    # Build a robot army


    You can connect your computer to all sorts of programmable devices, from flashing
    LED lights to robots. It''s fun and you''ll learn lots as you figure out how to
    conquer the world.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_218_2.png)


    # Learn new languages


    Become multilingual. Every new programming language you learn will teach you more
    about the ones you already know (or thought you knew). You download free versions
    of most languages.


    # Pull a computer to bits


    Take an old computer apart to see how it works (ask permission!). There aren''t
    many components, so it won''t take long to figure out all the bits are. Best of
    all, build your own computer and run your code on it.


    # Win a prize


    When your skills develop, why not enter an online coding contest? There are lots
    to choose from all different levels. The toughest worldwide competitions are Google''s
    Code Jam, but there are easier challenges.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_218_3.png)


    > REMEMBER

    Have fun!


    Coding is a lot like trying to solve puzzles. It''s challenging and you''ll often
    get stuck. Sometimes it''s frustrating. But you''ll also have breakthroughs when
    you solve a problem and feel a buzz of excitement at seeing your code fun. The
    best way to keeping fun is to take on challenges that suit you. If a project is
    too easy you''ll get bored; if it''s too hard you''ll lose interest. Never be
    afraid to fiddle, tinker, experiment, and break the rules—let your curiosity lead
    you. But most of all, remember to have fun!


    ![](img/72d218a7a73c4d4abc7be582ebd85385_218_4.png)'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Glossary


    algorithm

    A set of step-by-step instructions followed when performing a task: for example,
    by a computer program.


    call

    To use a function in a program.


    event

    Something a computer program can react to, such as a key pressed or the mouse
    being clicked.


    GUI

    The GUI, or graphical user interface, is the name for the buttons and windows
    that make up the part of the program you can interact with.


    compression

    A way of making data smaller so that it takes less storage space.


    execute

    See run.


    hacker

    A person who breaks into a computer system. "White hat" hackers work for security
    companies and look for problems in order to fix them. "Black hat" hackers break
    into systems to cause harm or to profit from them.


    ASCII

    "American Standard Code for Interchange"—a code used for storing text characters
    as binary code.


    computer network

    A link to two or more computers together.


    file

    A collection of data stored with a name.


    binary code

    A way of writing numbers and data that uses only 0s and 1s.


    container

    A part of a program that can be used to store a number of numerical values.


    float

    A number with a decimal point in it.


    function

    A piece of code that does a larger task.


    bit

    A binary digit—0 or 1. The smallest unit of digital information.


    hardware

    The physical parts of a computer that you can see or touch, such as wires, the
    keyboard, and the display screen.


    Boolean expression

    A question that has only two possible answers, such as "true" and "false".


    debug

    To look for and correct errors in a program.


    hexadecimal

    A number system based on 16, where the numbers 10 to 15 are represented by the
    letters A to F.


    branch

    A point in a program where two different options are available to choose from.


    debugger

    A program that checks all other programs for errors in their code.


    directory

    A place to store files to keep them organized.


    gate

    Used by computers to make decisions. Use one or more signals to produce an output
    signal, based on a rule. For example, "AND" gates a positive output only when
    input signals are positive. Other gates use "OR" and "NOT".


    bug

    An error in a program''s code that makes it behave in an unexpected way.


    GPU

    A graphics processing unit (GPU) allows images to be displayed on a computer screen.


    index number

    A number given to an item in a list. The index number of the first item will be
    0, the second one and so.


    byte

    A unit of digital information contains eight bits.


    encryption

    A way of encoding data so that only people can read or access it.


    graphics

    Visual elements on a screen that are not text, such as pictures, icons, and symbols.


    input

    Data that is entered into a computer: for example, from a microphone, keyboard,
    or mouse.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# integer


    Any number that does not contain a decimal point and is not written as a fraction
    (whole number).


    # memory


    A computer chip inside a computer that stores data.


    # programming language


    A language that is used to give instructions to a computer.


    # statement


    The smallest complete instruction a programming can be broken down into.


    # interface


    The means by which the user interacts with software or hardware.


    # module


    A section of code that performs a single part of an overall program.


    # random


    A function in a computer program runs unpredictable outcomes. Useful when creating
    games.


    # string


    A series of characters. Strings can contain numbers, letters, or symbols, as a
    colon.


    # IP address


    A series of numbers makes up an individual address when it is connected to the
    Internet.


    # operator


    A symbol that performs a function, like "+"(addition) or "-” (subtraction).


    # run


    The command to make a program start.


    # syntax


    The rules that determine how a program is structured in order for it to work properly.


    # OS


    A computer''s operating system (OS) provides the base for other programs to run,
    and connects them to hardware.


    # server


    A computer that stores files accessible via a network.


    # trojan


    A piece of malware that pretends to be another piece of software to trick the
    user.


    # library


    A collection of functions that can be reused in other projects.


    # single-step


    A way of making a computer run one step at a time, to check that each step is
    working properly.


    # loop


    Part of a program that repeats itself to prevent the need for the same piece of
    code to be typed multiple times.


    # output


    Data that is produced by a computer program and viewed by the user.


    # tuple


    A list of items separated by commas and surrounded by brackets.


    # port


    A series of numbers used by a computer as the "address" for a specific program.


    # socket


    The combination of IP address and a port, which lets segments of data reach each
    other over the Internet.


    # Unicode


    A universal code used by computers to represent thousands of symbols and text
    characters.


    # processor


    A type of electronic chip inside a computer that runs programs.


    # machine code


    The basic language understood by computers. Programming languages must be translated
    into machine code before the processor can read them.


    # software


    The programs that run on a computer and how it works.


    # variable


    A named place where you can store information that can be changed.


    # malware


    Software that is designed to harm or disrupt a computer. Malware is short for
    "malicious software".


    # program


    A set of instructions that a computer follows in order to complete a task.


    # sprite


    A movable object.


    # virus


    A type of malware that works by multiplying itself to spread between computers.'
