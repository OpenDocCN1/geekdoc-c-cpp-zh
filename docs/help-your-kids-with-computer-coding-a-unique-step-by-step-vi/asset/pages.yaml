- pgno: 71
  md: '# 70 STARTING SCRATCH


    # Sending messages


    Sometimes it''s useful for sprites to communicate with each other. Sprites can
    use messages to tell other sprites what to do. Scratch also lets you create conversations
    between sprites.


    > SEE ALSO

    * 38–39 Making things move

    * 40–41 Costumes

    * 44–45 Events


    # Broadcasting


    The broadcast blocks in the “Events” menu enable sprites to send and receive messages.
    Messages don''t contain any information other than a name, but can be used to
    fine-tune a sprite''s actions. Sprites only react to messages that they are programmed
    to respond to—they ignore any other messages.


    This "Events" block lets a sprite send a message to all the other sprites


    This block starts a script when a sprite receives a message


    ```

    broadcast message 1

    ```


    ```

    when I receive message1

    ```


    +   Broadcast blocks

    One type of broadcast block lets a sprite send a message. The other tells the
    sprite to receive a message. Choose an existing message or create a new one.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_71_0.png)


    This message starts the script that makes the starfish swim away from the shark


    ![](img/72d218a7a73c4d4abc7be582ebd85385_71_1.png)


    ```

    when clicked

    ```


    ```

    when I receive shark_here

    ```


    ```

    show

    ```


    ```

    broadcast shark_here

    ```


    ```

    switch costume to: starfish-b

    ```


    ```

    glide 5 secs to x: (150) y: (-150)

    ```


    ```

    glide 1 secs to x: (133) y: (91)

    ```


    Choose "new message..." from the menu


    The starfish glides out of the shark''s way, showing its scared costume


    ```

    hide

    ```


    This message tells the shark that the starfish is gone, so it''s safe to return


    ```

    broadcast shark_gone

    ```


    ```

    glide 5 secs to x: (-150) y: 150

    ```


    ![](img/72d218a7a73c4d4abc7be582ebd85385_71_2.png)


    Shark danger

    Choose two sprites—a shark and a starfish. Give the shark the script above, and
    the starfish the two scripts on the right. When the shark sends it a message,
    which makes the starfish swim away.


    ```

    when I receive shark_gone

    ```


    ```

