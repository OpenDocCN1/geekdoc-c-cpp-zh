- pgno: 212
  md: '# Events


    An event is any action that a program can detect, as a mouse click or a keystroke.
    The section of code that reacts to an event is called an "event handler". Event
    handlers are used a lot in JavaScript and can trigger many different functions,
    making web pages fun and interactive.


    # Type the code


    ```

    In this example, an event (clicking a button) triggers a simple function (a "tongue-twister
    answer"). Type the code in an IDLE code window and save the file with a "html"
    ending.


    <button onclick="tonguetw()">Say this!</button>

    <script>

    Name of the function

    function tonguetwist() {

    Curly brackets surround a block of code—they work in a similar way to indents
    in Python

    document.write("She sells seashells");

    }

    </script>

    ```


    HTML code links the function to a button


    JavaScript code defines the function


    Click the button


    +   Run the programnDouble-click the file to launch the program in a browser window.


    The tongue-twister appears


    # Loops in JavaScript


    A loop is a section of code that repeats. Using loops is much quicker and easier
    than typing out the same line of code over and again.


    # Loop code


    Like Python, JavaScript uses "for" to set up a loop. The repeated lines of code
    are enclosed in curly brackets. This loop creates a simple counter that increases
    each time it repeats.


    # Loop output


    Save the code as a "html" file and run it. It keeps repeating as long as less
    than "x<6" in the code. To increase the number of repeats, use a higher number
    after the "x<"-symbol.


    ```

    <script>

    for (var x=0; x<6; x++) {

    ndocument.write("Loop count: " + x);

    }

    </script>

    ```


    The <script> tag introduces the JavaScript code


    This line creates a counter called "x with a starting value of 0, rising by "x+"
    in each repeat loop


    This line tells the computer to write the text "Loop count: " followed by counter
    number


    | Loop count: 0 |

    | Loop count: 1 | The loop repeats six timesn| Loop count: 2 | |

    | Loop count: 3 | |

    | Loop count: 4 | |

    | Loop count: 5 | |'
