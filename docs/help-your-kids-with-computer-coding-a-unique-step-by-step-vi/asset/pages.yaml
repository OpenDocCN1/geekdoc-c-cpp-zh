  md: '# Blocks with inputs


    Windows in a new block can be used to give it numbers and words to work with.
    These holes can be used to change how far the block moves a sprite.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_74_0.png)


    Click here to see all of the options


    +   Make a new block

    Make a new block called ''slide'' and then click on ''Options'': Select ''Add
    number input'' and type ''steps''. Select ''Add label text'' and change it to
    ''and shout''. Click ''Add string input'' and call it ''greeting''. Then click
    ''OK''.


    +   Define the block

    In the ''define'' block, the holes are replaced with variables called ''steps''
    and ''greeting''. Drag variables from the ''define'' block into the script wherever
    you need them. Add this to your script to your sprite.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_74_1.png)


    The steps variable


    The greeting variable


    > Drag variables from the ''define'' block into the script


    +   Use the block in a script

    Now add the below script to a sprite. By putting different numbers of steps and
    greetings into the block, you can make your sprite behave differently.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_74_2.png)


    This block makes the number of steps negative


    > Use a sensible name for a new block so the program will be easier to read and
    change.


