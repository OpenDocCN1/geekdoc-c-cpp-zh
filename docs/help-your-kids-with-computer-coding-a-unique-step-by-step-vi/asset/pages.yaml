  md: "# DRAWING MACHINE\n\n# The Turtle controller\n\nThe first part of the program\
    \ is a function that moves the turtle, one command at a time. It is planned out\
    \ in the flowchart on the previous page. This code enables the turtle to convert\
    \ the \"do\" and \"val\" values into movement commands.\n\nThis code creates the\
    \ Turtle controller function. It turns \"do\" inputs into directions for the turtle,\
    \ and \"val\" inputs into angles and distances.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_143_0.png)\n\
    \nLoads all the commands that control the turtle\n\nDefines \"do\" and \"val\"\
    \ inputs for the function\n\n```\nfrom turtle import *\ndef turtle_controller(do,\
    \ val):\n    do = do.upper()\n    if do == 'F':\n        forward(val)\n    elif\
    \ do == 'B':\n        backward(val)\n    elif do == 'R':\n        right(val)\n\
    \    elif do == 'L':\n        left(val)\n    elif do == 'U':\n        penup()\n\
    \    elif do == 'D':\n        pendown(val)\n    elif do == 'N':\n        reset()\n\
    \    else:\n        print('Unrecognized command ')\n```\n\nThis command converts\
    \ all the letters in \"do\" to upper case (capital letters)\n\nThis tells the\
    \ function to turn a \"do\" value of F into the turtle command \"forward\"\n\n\
    As in the flowchart, the function checks the \"do\" counter against all the letters\
