    Nationality: British


    Dates: 1815–52


    Dates: 1912–54


    Famous for: Ada Lovelace is considered to be the first computer programmer. In
    1843, she published the first program for Charles Babbage''s Analytical Engine
    (a proposed computer). She also suggested methods for representing characters
