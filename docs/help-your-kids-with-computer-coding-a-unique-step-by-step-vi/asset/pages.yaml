    | Scripts | Costs | Sounds |


    New sound:


    Record a sound using the computer’s microphone


    Upload a recording from the computer


    # ## Playing a sound


    There are two blocks that play sounds: “play sound” and “play sound until done”.
    Until done makes the program wait until the sound has finished before it moves
    on.


    # ## Turn up the volume


    Each sprite has its own volume control, which is set using numbers. 0 is silent
    and 100 is the loudest.


    Use the block to choose which sound to play


    100 is the maximum volume


