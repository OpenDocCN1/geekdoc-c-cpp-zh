- pgno: 139
  md: "# Variables and functions\n\nVariables created inside a function (local variables)\
    \ and variables created in the main program (global variables) work in different\
    \ ways.\n\n# Local variables\n\nLocal variables only exist inside a single function,\
    \ so the main program and other functions can't use them. If you try to use a\
    \ local variable outside of the function, an error message appears.\n\n+   Variable\
    \ inside the function\nCreate a local variable called \"func1\". Print out the\
    \ value of \"a\" by calling \"func1\" from the main program.\n\n+   Variable outside\
    \ the function\nIf you try to print \"a\" directly from the main program, it gives\
    \ an error: \"a\" only exists inside \"func1\".\n\nLocal variables are like film\
    \ stars in a car with mirrored windows—they are inside the car (function) but\
    \ no one can see them\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_139_0.png)\n\
    \n```\n>>> def func1():\n    a = 10\n    print(a)\n>>> func1()\n10\nfunc1 prints\
    \ the value of \"a\"\n```\n\n```\n>>> print(a)\nTraceback (most recent call last):\n\
    File \"<pshell6>\", line 1, in <module>\n    print(a)\nNameError: name 'a' is\
    \ not defined\n```\n\n# Global variables\n\nA variable created in the main program\
    \ is called a global variable. Other functions can read it, but they can't change\
    \ its value.\n\n+   Variable outside the function\nCreate a global variable called\
    \ \"b\" in the main program. The new function (\"func2\") can read the value of\
    \ \"b\" and print it.\n\n+   Same global variable\nWe can also print \"b\" directly\
    \ from the main program. \"b\" can be seen everywhere because it wasn't created\
    \ inside a function.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_139_1.png)\n\n\
    ```\n>>> b = 1000\n>>> def func2():\n    print(b)\n>>> func2()\n1000\nfunc2 gives\
    \ you the value stored in \"b\"\n```\n\n```\n>>> print(b)\n1000\n```\n\nGlobal\
    \ variable \"b\" can be used anywhere in the main program\n\nGlobal variables\
    \ are like people walking along the street—everyone can see them"
  merge: -1
  img_proc: true
- pgno: 140
  md: "# Variables as input to functions\n\nWhen a variable is used as input to a\
    \ function its value is copied into a new local variable. Therefore, changing\
    \ the value of this new local variable inside the function doesn't change the\
    \ value of the original variable.\n\n+   Changing values inside a variable\n\"\
    func3\" uses input \"y\", which is a local variable. It prints the value of \"\
    y\", then changes that to \"bread\" and prints the new value.\n\n+   Print variable\n\
    Printing the value of \"z\" after calling \"func3\" it hasn't changed. Calling\
    \ \"func3\" copies the value in \"z\" into local variable \"y\", but \"z\" is\
    \ left unchanged.\n\n```\n>>> def func3(y):\n  print(y)\n  y = 'bread'\n  print(y)\n\
    >>> z = 'bread'\n>>> func3(z)\n# This creates a local variable \"z\"\nbread bread\n\
    ```\n\ny contains the value passed to it when \"func3\" is called\nHere contains\
    \ \"bread\"\nThis creates a local variable \"z\"\nThe input \"y\" now contains\
    \ the value of \"z\" passed to it when \"func3\" is called\nLocal variable \"\
    y\" of \"func3\" holds a copy of the value in \"z\". Although \"y\" has been changed\
    \ to \"bread\", the value in global variable \"z\" isn't affected and is still\
    \ \"bread\"\n\n# Masking a global variable\n\nA global variable can't be changed\
    \ by a function. A function trying to change a global variable actually creates\
    \ a local variable with the same name. It covers up, or \"masks\", the global\
    \ variable with a local version.\n\n+   Changing a global variable\nglobal \"\
    c\" is given the value 12345. \"func4\" gives \"c\" the value 555 and prints it\
    \ out. It looks like our global variable \"c\" has been changed.\n\n```\n>>> c\
    \ = 12345\n>>> def func4():\n  c = 555\n  print(c)\n>>> func4())\n555\n```\n\n\
    Initial value in global variable \"c\"\nPrints the value of \"c\" inside \"func4\"\
    \n\n+   Print variable\nIf we print \"c\" from outside the function, we see that\
    \ \"c\" hasn't changed at all. \"func4\" only prints the value of its new local\
    \ variable—also called \"c\".\n\n```\n>>> print(c)\n12345\n```\n\nThe value in\
    \ global variable \"c\" hasn't changed\n\n> EXPERT TIPS\n\n# a.function()\n\n\
    Other functions are called by adding their name at the end of the data object\
    \ (\"a\") after a period."
  merge: -1
