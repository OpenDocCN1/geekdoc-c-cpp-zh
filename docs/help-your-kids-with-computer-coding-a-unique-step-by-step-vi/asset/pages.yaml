- pgno: 56
  md: "# # Making lists\n\nVariables are perfect if you just want to remember one\
    \ thing. To remember lots of similar things, lists can be used instead. Lists\
    \ can store many items of data (numbers and strings) at the same time—for example,\
    \ all of the high scores in a game. The following program shows one way of using\
    \ a list.\n\n+   - Create a list\n  Start a new project. Go into the \"Data\"\
    \ section of the blocks palette and click the \"Make a List\" button. Give your\
    \ list the name \"sentence\".\n\n+   - Using your list\n  This script asks the\
    \ user to type words into a list. Each word appears in the speech's bubble as\
    \ it is added to the list.\n\nThis block makes sure the list is empty at the start\
    \ of the program\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_56_0.png)\n\nThe\
    \ \"ask\" block asks the user to type in a word\n\nCall your list \"sentence\"\
    \nThis adds the user's answer to the list\nThe \"think\" block makes a thought\
    \ bubble appear\n\nAdding \"sentence\" here means that the list will be shown\
    \ in the thought bubble\n\n+   - Seeing the list\n  If you check the box beside\
    \ the list in the blocks palette, it is shown on the stage. You can see each new\
    \ word as it is added to the list.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_56_1.png)\n\
    \nThese blocks are used to change the contents of a list. Each item in a list\
    \ has a number—the first item is 1, and so on. These numbers can be used to remove,\
    \ insert, or replace items.\n\nDelletes the first item in the list\n\nAdds \"\
    cherry\" as the first item in the list\n\nReplaces the first item with \"cherry\""
