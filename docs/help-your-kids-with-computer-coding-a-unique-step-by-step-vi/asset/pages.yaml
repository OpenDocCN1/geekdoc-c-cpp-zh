  md: "# Making your own music\n\nScratch has blocks that can be used to invent musical\
    \ sounds. You have a whole orchestra of instruments to conduct, as well as a full\
    \ drum kit. The length of each note is measured in beats.\n\nThis decides how\
    \ low or high the pitch of a note is\n\n```\nplay note [60] for [0.5] beats\n\
    ```\n\nBig numbers make a note longer. It can also be shorter than a beat, as\
    \ shown here\n\n```\nset instrument to [1]\n```\n\nClick here to choose an instrument\
    \ from a drop-down menu\n\n```\nplay drum [1] for [0.25] beats\n```\n\n```\nrest\
    \ for [0.25] beats\n```\n\nUse this menu to choose between different types of\
    \ drum\n\nThis block adds a silent break in the music. Higher numbers will give\
    \ you a longer break\n\n# Playing music\n\n# EXPERT TIPS\n\nConnecting notes makes\
    \ a tune. Create a variable called \"note\" (see pages 50–51), and then add the\
    \ script below to sprite to create a piece of music.\n\n# Tempo\n\nThe speed of\
    \ music is called its tempo. The tempo decides how long a beat is within a piece\
    \ of music. There are three blocks for managing the tempo.\n\n```\nwhen [clicked]\n\
    set [note] to [1]\nset [instrument] to [1]\nforever:\n  choose an instrument\n\
