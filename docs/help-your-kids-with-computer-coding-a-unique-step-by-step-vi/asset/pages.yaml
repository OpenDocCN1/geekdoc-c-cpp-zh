- pgno: 159
  md: "# Making shapes\n\nAs well as adding windows, buttons, and colors to a graphical\
    \ user interface (GUI), Tkinter can also be used to draw shapes.\n\nCreating basic\
    \ shapes\n\n\n\nRectangles and ovals are useful shapes for drawing all sorts of\
    \ types. Once a canvas has been created, the following functions can be used to\
    \ draw shapes on it.\n\nSEE ALSO\nChanging 160-161 > | things\nReacting 162-163\
    \ > | events\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_159_0.png)\n\n```\n>>>\
    \ tkinter import * # Creates a canvas\n>>> window = Tk() \n>>> drawing = Canvas(window,\
    \ height=500, width=500)\n>>> drawing.pack() # Draws a rectangle\nrect1 = drawing.create_rectangle(100,\
    \ 100, 300, 200)\nsquare1 = drawing.create_rectangle(30, 30, 80, 200)\noval1 =\
    \ drawing.create_oval(100, 100, 300, 200)\ncircle1 = drawing.create_oval(30, 30,\
    \ 80, 80)\n```\n\nSets the size of the canvas\n\nSets the position and size of\
    \ the rectangle using coordinates (see below)\n\nA square can be made by drawing\
    \ a rectangle with all sides the same length\n\nSets the position of the canvas\n\
    \nDraws a circle\n\n# Drawing with coordinates\n\nCoordinates are used to tell\
    \ the computer where to create shapes. The first number (“x”) tells the computer\
    \ how far along the screen to go. The second number (“y”) tells the computer how\
    \ far down to go.\n\nCoordinates grid\nThe top-left corner of the rectangle is\
    \ at (50, 50). The bottom-right is at (250, 300).\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_159_1.png)\n\
    \n(x1=50, y1=50)\n\nThis is the name of\nthe canvas\n\nCoordinates for\ntop left\
    \ of the rectangle\n\n```\n>>> drawing.create_rectangle(50, 50, 250, 350)\n```\n\
    \nSetting the coordinates\nThe first two numbers give the\ncoordinates for the\
    \ top-left corner of the\nrectangle. The second two numbers\nlocate the bottom-right\
    \ corner.\n\nCoordinates for\nthe bottom right\nof the rectangle\n\n(x2=250, y2=350)"
