- pgno: 203
  md: '# PROGRAMMING IN THE REAL WORLD


    # Busy programs


    Computers and programs have become an invisible part of daily life. Every day,
    people benefit from very complex computer programs that have been written to solve
    incredibly tough problems.


    SEE ALSO

    | 180-181 Inside a computer |

    | 192-193 Storing data in files |


    # Compressing files


    Almost every type of file that is sent over the Internet is compressed (squeezed)
    in some way. When a file is compressed, data that isn''t needed is identified
    and thrown away, leaving only the useful information.


    # REAL WORLD

    Music files


    Without music compression programs, you could only fit a few songs on your music
    player. By compressing audio files, the average smartphone can hold thousands
    of songs.


    > Squeezing data

    Compressing a file is like squeezing a jack-in-the-box to make it fit into a smaller
    space.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_203_0.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_203_1.png)


    # Secret codes


    When you log in to a website, buy something, or send a message across the Internet,
    smart programs scramble your secret data so that anyone who intercepts it won''t
    be able to understand it. Global banking systems rely on these advanced programs
    capable of hiding secret information.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_203_2.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_203_3.png)


    > Cryptography

    Cryptography is the study of codes. Complex mathematical codes scramble and unscramble
    personal data to keep it safe from thieves.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Artificial Intelligence


    Intelligent programs do more than just make computer games fun. Artificial Intelligence
    (AI) is being used to provide better healthcare, as well as helping robots operate
    in places too dangerous for humans to go, such as war zones and areas destroyed
    by natural disasters.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_204_0.png)


    +   Medicine Systems are able to analyze a huge database of medical information
    and combine it with details from the patient to suggest a diagnosis.


    +   Bomb disposal Many soldiers'' lives can be saved by using an intelligent robot
    to dispose of a bomb in an area that has been cleared of people.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_204_1.png)


    # Supercomputers


    Supercomputers—used by high-tech organizations such as NASA—combine the power
    of thousands of computer processors that share data and communicate quickly. The
    result is a computer that can perform millions of calculations per second.


    # REAL WORLD Weather forecast


    Weather patterns are unpredictable. Supercomputers crunch the huge amounts of
    data needed to accurately predict what will happen. Each processor in the supercomputer
    calculates the weather for a small part of the map. All the results are combined
    to produce the whole forecast.


    +   3 Each processor works on one of the smaller problems


    +   4 Each sub-problem is solved separately


    +   5 Computer puts back together


    +   2 Computer breaks problem into smaller-problems


    ![](img/72d218a7a73c4d4abc7be582ebd85385_204_2.png)


    +   1 Complex problem is entered into supercomputer


    +   6 Final result appears much faster


    ![](img/72d218a7a73c4d4abc7be582ebd85385_204_3.png)


    How it works Problems are broken into smaller problems that are all worked separately
    at the same time by different processors. The results are then combined together
    to give the answer.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Computer games


    What does it take to make a modern video game?

    All computer games are a different mix of the same ingredients. Great games are
    usually made by the teams of software developers—not just programmers.


    # Who makes computer games?


    Even simple games on your mobile phone might be made by large teams of people.
    For a game to be popular and successful, attention to detail needs to be given
    to every area during its development, which involves many people with lots of
    different skills.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_205_0.png)


    +   - Coder

    Programmers write the code that will make the game work, but they can only do
    this with input from the rest of the team.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_205_1.png)


    +   - Level designer

    The architects of the game''s virtual world, level designers create settings and
    levels that are fun to play.


    +   - Graphic designer

    All of the levels and characters need to look good. The graphic designers define
    the structure and appearance of everything in the game.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_205_2.png)


    +   - Tester

    Playing games all day may seem like a great job, but testers often play the same
    level over and over again to check for bugs.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_205_3.png)


    A console is a special type of computer that is well suited to running games.
    Consoles, such as the PS4 and Xbox One, often have advanced graphics and sound
    processors capable of running many things at once, making realistic games possible.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_205_4.png)


    +   - Scriptwriter

    Modern games have interesting plots just like films. Scriptwriters develop all
    the characters and stories for the game.


    +   - Sound designer

    Just like a good movie, a great game needs to have quality music and sound effects
    to set the mood.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_205_5.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_205_6.png)'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# Game ingredients


    The most common ingredients in games are often combined into a “game engine”.
    Engines provide an easy-to-use base so that new games can be developed quickly.


    +   - All games must have a good story and some sort of goal aim for, such as
    saving the princess. Well-designed game logic keeps players interested.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_206_0.png)


    +   - In a virtual world, the rules of the real world, such as gravity and collisions,
    must be re-created to make the game more believable.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_206_1.png)


    As games become more realistic their graphics must become more complex. Body movements,
    smoke, and water are particularly hard to get right.


    +   - Familiar controls that make sense to the player help make a great game.
    Good control design makes the player forget that they are using a controller.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_206_2.png)


    All of the words spoken in the game must be recorded, as well as the background
    music and the sound effects that change throughout the game.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_206_3.png)


    Open the pod bay doors, Hal


    I''m sorry Dave, I''m afraid I can''t do


    ![](img/72d218a7a73c4d4abc7be582ebd85385_206_4.png)


    # Serious games


    Games are being used for more than just fun. Pilots, surgeons, and soldiers are
    just some of the professionals who use games at work for training purposes. Some
    businesses even use strategy games to improve their employees’ planning skills.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_206_5.png)


    +   - Human players often play alongside or against computer-controlled players.
    Artificial intelligence programming allows these characters to respond realistically.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_206_6.png)'
