- pgno: 42
  md: '# Dancing ballerina


    Now try making a ballerina dance. Add the ballerina sprite from the sprite list.
    Select your cat in the sprite list and drag its script on to the ballerina in
    the sprite list. This copies the script to the ballerina.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_42_0.png)


    The green flag starts the ballerina''s dance


    Drop the script on to the ballerina in the sprite list


    ![](img/72d218a7a73c4d4abc7be582ebd85385_42_1.png)


    # Ballerina''s script


    The same script works for the ballerina and the cat. The ballerina has four costumes,
    and she uses them all as she dances on the stage.


    # EXPERT TIPS


    # Switching


    You can choose to show a specific costume for your sprite using the "switch costume
    to" block. You can use this block to choose a particular position for your sprite.


    ```

    switch costume to ballerina-a

    ```


    Switch costumes: Use the menu in the block to choose a costume.


    ```

    switch backdrop to backdrop1

    ```


    Switch backdrops: Change the picture on the stage with this block.


    # Adding speech bubbles


    You can add speech bubbles to make your sprites when they change costumes. Use
    the "say Hello! for 2 secs" block and change the text in it to make your sprite
    say something else.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_42_2.png)


    The ballerina stands up


    ```

    switch costume to ballerina-a

    ```


    ```

    say Up! for 1 secs

    ```


    ```

    switch costume to ballerina-b

    ```


    ```

    say Down! for 1 secs

    ```


    The ballerina says "Up!"


    She crouches and says "Down!"'
