    It''s not only computers that need to be able to read code, it should be clear
    to people too. It''s important to make your code as easy to understand as possible.


    Use functions to break your code into smaller chunks. Each function should do
    a single task in the program.


    Give your variables and functions names that they do: "age_in_years" makes more
    sense than "aily",


