- pgno: 87
  md: '# # What is Python?


    Python is a text-based programming language. It takes a bit longer to learn than
    Scratch, but can be used to do much more.


    # # A useful language


    Python is a versatile language that can be used to make many different types of
    programs, from word processing to web browsers. Here are a few great reasons to
    learn Python.


    +   - **Easy to learn and use**: Python programs are written in simple language.
    The code is quite easy to read and write, compared to many programming languages.


    > SEE ALSO


    Installing 88–91 >**

    **Simple 102–103 >**

    **Harder 104–105 >**


    +   - **Contains ready-to-use code**: Python contains libraries of preprogrammed
    code that you can use in your programs. It makes it easier to write complex programs
    quickly.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_87_0.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_87_1.png)


    +   -Useful for big organizations**: Python is powerful. It can be used to write
    real-world programs. It is used by Google, NASA, and Pixar, among others.


    > EXPERT TIPS

    **Getting started**

    Before learning how to program in Python, it''s useful to get familiar with how
    it works. The next few pages will teach you how to:


    **Install**: Python is free, but you''ll have to install it yourself (see pp.88–91).

    **Use the interface**: Make a simple program and save it on the computer.

    **Experiment**: Try some simple programs to see how they work.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_87_2.png)'
  merge: -1
  img_proc: true
- pgno: 88
  md: "# Scratch and Python\n\nLots of elements that are used in Scratch are also\
    \ used in Python—they just look different. Here are a few similarities between\
    \ the two languages.\n\n```\nprint('Hello World!')\n```\n\nThis block displays\
    \ the message in a speech bubble\n\nType the message you want here\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_88_0.png)\n\
    \nHello World!\n\nThe message appears on screen like this\n\nHello World!\n\n\
    In Scratch, the \"say\" block is used to show something on the screen.\n\nIn Python,\
    \ a command called \"print\" displays text on the screen.\n\n+   Print in Scratch\n\
    \n+   Print in Python\n\nTurns the pen on\n\nRepeats the blocks inside it 24 times\
    \ to draw a circle\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_88_1.png)\n\nMoves\
    \ the sprite forward\n\n```\nfrom turtle import *\npendow()\nfor n in range(24):\n\
    \    forward(10)\n    right(15)\n```\n\nTurns the turtle clockwise 15 degrees\n\
    \nTurns the pen off\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_88_2.png)\n\n\
    +   Turtle graphics in Scratch\n\nThe script uses the \"pen down\" block to move\
    \ the cat sprite and draw a circle.\n\n+   Turtle graphics in Python\n\nThere's\
    \ also a turtle in Python. The code can be used to draw a circle.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_88_3.png)"
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Installing Python


    Before you can use the Python programming language, you need to download and install
    it on your computer. Python 3 is free, easy to install, and works on Windows PCs,
    Macs, and Linux operating systems as Ubuntu.


    # What is IDLE?


    When you install Python 3, you''ll also get a free program called IDLE (Integrated
    Development Environment). Designed for beginners, IDLE includes a basic text editor
    that allows you to write and edit Python code.


    > EXPERT TIPS


    # Save code


    When saving work in Python, you will need to use the "File > Save As..." menu
    command so you can name your files. First create a folder to keep all your files
    in. Give the folder a clear name, like "PythonCode", and agree with the person
    who owns the computer where to keep it.


    # WINDOWS


    +   - Windows


    Before you download Python, check what kind of operating system your computer
    has. If you have Windows, find out whether it''s the 32-bit or 64-bit version.
    Click the "Start" button, right-click "Computer", and left-click "Properties".
    Then choose the option appears.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_89_0.png)


    # MAC


    +   - Mac


    If you use an Apple Mac, find out which operating system it has before you install
    Python. Click the apple icon in the top left and choose "About This Mac".


    # UBUNTU


    +   - Ubuntu


    Ubuntu is a free operating system that works just like Windows and Macs. To find
    out how to install Python on Ubuntu, turn to page 91.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_89_1.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_89_2.png)'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# # Python 3 on Windows


    Before you install Python 3 on a Windows PC, make sure you get permission from
    the computer''s owner. You may also need to ask the owner to provide an admin
    password during installation.


    +   **Go to the Python website**

    Type the address below your Internet browser to open the Python website. Click
    on "Download" to open the download page.


    +   **Download Python**

    Click on the latest version of Python for Windows, beginning with the number 3,
    which will be near the top of the list.


    ```

    http://www.python.org

    ```


    This is the URL (web address) for Python


    Choose this if you have a 32-bit version of Windows


    +   - Python 3.3.3 Windows x86 MSI Installer


    +   - Python 3.3.3 Windows x86-64 MSI Installer


    Don''t worry about the exact number, as long as it has a 3 at the front


    Choose this if you have a 64-bit version of Windows


    +   **Install**

    The installer file will download automatically. When it finishes, double-click
    to install Python. Choose "install for all users" and click "next" at each prompt,
    without changing the default settings.


    +   **Run Idle**

    Now check that the program installed correctly. Open the "Start" menu, click on
    "All Programs", "Python", and then choose "IDLE".


    ![](img/72d218a7a73c4d4abc7be582ebd85385_90_0.png)


    Make sure you select Python 3


    The Windows installer icon appears when Python is installing


