- pgno: 9
  md: '# Foreword


    Just a few years ago, computer coding seemed like a mysterious skill that could
    only be practiced by specialists. To many people, the idea that coding could be
    fun was a strange one. But then the world changed. In the space of a few years,
    the Internet, email, social networks, smartphones, and apps hit us like a tornado,
    transforming the way we live.


    Computers are a huge part of life that we all now take for granted. Instead of
    calling someone on the phone, we send a text message or use social media. From
    shopping and entertainment to news and games, we guzzle everything computers have
    to offer. But we can do more than just use this technology, we can create it.
    If we can learn to code, we can make our own digital masterpieces.


    Everything computers do is controlled by lines of code that someone has typed
    out on a keyboard. It might look like a foreign language, but it''s a language
    anybody can pick up quite quickly. Many would argue that coding has become one
    of the most important skills you can learn in the 21st century.'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'Learning to code is tremendous fun because you can get instant results, no
    matter how much more you have to learn. In fact, it’s such fun creating games
    and programs that it feels effortless once you’re hooked. It’s also creative—perhaps
    the first science that combines art, logic, storytelling, and business.


    Not only that, coding is a fantastic skill for life. It strengthens logical thinking
    and problem-solving skills—vital in many different areas of life, from science
    and engineering to medicine and law. The number of jobs that require coding is
    set to increase dramatically in the future, and there’s already a shortage of
    good coders. Learn to code, and the digital world is yours for the taking!


    ![](img/72d218a7a73c4d4abc7be582ebd85385_10_0.png)


    CAROL VORDERMAN'
  merge: -1
  img_proc: true
