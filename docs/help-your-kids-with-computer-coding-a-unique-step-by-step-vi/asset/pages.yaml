- pgno: 183
  md: '# Binary and bases


    How can computers solve complex calculations when all they understand electrical
    signals? Binary numbers are used to translate these signals into numbers.


    # SEE ALSO


    +   Symbols 184–185 > and codes

    Logic gates 186–187 >


    # What is a base number?


    “base” is the number of values that can be shown using only one digit. Each extra
    digit increases the number of values that can be shown by a multiple of the base.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_183_0.png)


    +   > Decimal system


    The decimal system is the most familiar counting system, and has a base of 10.
    It can show 10 values with one digit, 100 values with two, and 1,000 with three
    digits.


    # Binary code


    At the most basic level, computers only understand two values: electrical signals
    that are “on” and “off”. Because there are only two values, computers deal with
    numbers using a base of two, or “binary”. Each digit is either a 1 or a 0, and
    each extra digit in the number is twice times the previous digit.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_183_1.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_183_2.png)


    +   > Binary. The range of values that can be written doubles with each digit
    added.


    1x128 + 1x64 + 1x32 + 1x16 + 0x8 + 0x4 + 0x2 + 1x1 = 3274'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Hexadecimal


    When using numbers in computer programs, a base of 16 is often used because it''s
    easy to translate from binary. Because there are only 10 symbols for numbers (0–9),
    the values for 10–16 are represented by the letters A–F.


    # Understanding nibbles


    A"nibble" is made up of four binary digits, which can be represented by one hexadecimal
    digit.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_184_0.png)


    The number 241 in binary code


    Binary numbers can be broken down into nibbles made up of four digits


    The number in hexadecimal


    1111 in binary is 15, which is F in hexadecimal


    0001 in binary is 1, which is 1 in hexadecimal


    The number in decimal


    # Comparing base systems


    Using this table, you can see that expressing numbers in hexadecimal gives the
    fewest digits.


    # DIFFERENT BASES


    | Decimal | Binary | Hexadecimal |

    | 0 | 0000 | 0 |

    | 1 | 0001 | 1 |

    | 2 | 0010 | 2 |

    | 3 | 0011 | 3 |

    | 4 | 0100 | 4 |

    | 5 | 0101 | 5 |

    | 6 | 0110 | 6 |

    | 7 | 0111 | 7 |

    | 8 | 1000 | 8 |

    | 9 | 1001 | 9 |

    | 10 | 1010 | A |

    | 11 | 1011 | B |

    | 12 | 1100 | C |

    | 13 | 1101 | D |

    | 14 | 1110 | E |

    | 15 | 1111 | F |


    > REMEMBER


    # Bits, nibbles, and bytes


    A binary digit is known as a "bit", and is the smallest unit of memory in computing.
    Bits are combined to make "nibbles" and "bytes". A kilobit is 1,024 bits. A megabit
    is 1,024 kilobytes.


    Bits: Each bit is a single binary digit—a 1 or 0.


    Nibbles: Four bits make up a nibble—enough for one hexadecimal digit.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_184_1.png)


    Bytes: Eight bits, or two hexadecimal digits, make up a byte. This gives us a
    range of values from 0 to 255 (00 to FF).'
  merge: -1
  img_proc: true
