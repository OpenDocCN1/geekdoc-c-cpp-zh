    \ indents to structure a program.\n\nUsed variables: You've used variables to\
    \ store the score.\n\nEntered a program: You've typed a program into Python and\
    \ saved it.\n\nDisplayed text: You've displayed messages on the screen.\n\n![](img/72d218a7a73c4d4abc7be582ebd85385_100_0.png)"
