    ![](img/72d218a7a73c4d4abc7be582ebd85385_49_3.png)


    Turns the pen on off clears all drawings leaves a picture of the sprite


    Playing with pens

    Experiment with how you can use the pen blocks to make drawings.


    # Draw a square


    To draw a square, you simply put the pen on the stage and then move the sprite
    in a square shape. Use a loop to draw the sides and turn the corners.


    The sprite will leave a line behind it


    ![](img/72d218a7a73c4d4abc7be582ebd85385_49_4.png)


    Change the shape

    This code will draw a square. To draw a triangle, change the “repeat” loop to
    repeat three times for the three sides, and change the turn from 90 to 120 degrees.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_49_5.png)


    Draws a line of the square turns the pen on corners makes it easier to see what''s
    happening'
  merge: -1
  img_proc: true
