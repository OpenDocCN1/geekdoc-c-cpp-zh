- pgno: 107
  md: '# # Which window?


    There are two different windows to choose from in IDLE. The code window can be
    used to write and save programs, while the shell window runs Python instructions
    right away.


    SEE ALSO

    * 92-93 Introducing IDLE

    * 96-97 Ghost game


    # The code window


    So far in this book, the code window has been used to write programs. You enter
    the program, save it, run it, and the output appears in the shell window.


    Running programs

    This process is used for running Python programs. Programs always have to be saved
    before running them.


    | Enter code | Save | Output |


    +   * Enter a program in the code window

    Enter this code in the code window, save it, and click "Run module" in the "Run"
    menu to run the program.


    +   * Output in the shell window

    When the program runs, its output (the results of the program) is shown in the
    shell window.


    ```

    a = 10

    b = 4

    print(a + b)

    print(a - b)

    ```


    > Give "a" the value 10

    Give "b" the value 4

    The "print" command shows the answers to these sums


    ```

    >>>

    14

    6

    ```


    > The answers to the sums in the shell window


    # The shell window


    Python can also understand commands that are typed in the shell window. They run
    as soon as you type them in, and the result is shown straight away.


    > The first two commands have no output because they are just assigning values
    to "a" and "b"


    ```

    >>> a = 10

    >>> b = 4

    >>> a + b

    14

    >>> a - b

    6

    ```


    > Code and output togethernThe shell window shows the code and the output together.
    It''s easier to tell which answer belongs to which sum when the commands are typed
    in the shell window.


    > Test your ideas

    The shell window gives you an immediate response, which makes it ideal for testing
    instructions and exploring what they can do.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_107_0.png)'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Python playground


    The shell window can be used to try out all sorts of Python commands, including
    drawing. The turtle is used to draw on screen in the same way that the pen is
    used in Scratch.


    # Colors in the code


    IDLE color-codes the text. The colors gives you some clues about what Python thinks
    each piece of text.


    ```

    >>> from turtle import *

    >>> forward(100)

    >>> right(12)

    >>> forward(100)

    ```


    Enter the code

    Type these instructions in the shell window. They run after each one is typed.
    As the turtle moves, it draws a line.


    +   Built-in functions

    Commands in Python, such as "print", are shown in purple.


    +   Strings in quotes

    Green indicates strings. If the brackets are green, there''s a missing quote.


    +   Most symbols and names

    Most code is shown in black.


    Turtle graphic

    Can work out how to draw other shapes, such as a square or a pentagon. To start
    over, type "clear()" into the shell window.


    Output

    Python''s output in the shell window is shown in blue.


    Keywords

    Keywords, such as "if" and "else", are orange. Python won''t let you use keywords
    as variable names.


    Errors

    Python uses red to alert you to any error messages in the shell window.


    # Which window should you use?


    Should you use the code window or the shell? It depends on the type of program
    you''re writing, and whether it is to be repeated.


    Code window

    The code window is ideal for longer pieces of code they can be saved and because
    it''s easier than retyping all the instructions if you want to do the same thing
    again or try something similar. It needs to be saved and run each time, though.


    # Code vs Shell


    Shell window

    The shell window is perfect for quick experiments, such as checking how a command
    works. It''s also a handy calculator. It doesn''t save the instructions though,
    if you''re trying something you want to repeat, consider using the code window
    instead.


    ![](img/72d218a7a73c4d4abc7be582ebd85385_108_0.png)'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# # Variables in Python


    Variables are used to remember pieces of information in a program. They are like
    boxes where data can be stored and labeled.


    # Creating a variable


    When a number or string is put into a variable it''s called assigning a value
    to the variable. You use an "=" to do this. Try this code in the shell window.


    ```

    >>> bones = 3

    ```


    Assign a number

    To assign a number, type in the variable name, an equals sign, and then the number.


    ```

    >>> dogs_name = ''Bruno''

    ```


    Assign a string

    To assign a string, type in the variable name, an equals sign, and then the string
    in quote marks.


    # Printing a variable


    The "print" command is used to show something on the screen. It has nothing to
    do with the printer. You can use it to show the value of a variable.


    ```

    >>> print(bones)

    3

    ```


    Number output

    The variable "bones" contains the number 3, so that''s what the shell window prints.


    ```

    >>> print(dogs_name)

    Bruno

    ```


    String output

    The variable "dogs_name" contains a string, so the string is printed. No quote
    marks are shown when you print a string.


    > REMEMBER

    Variables in Scratch

    The command to assign a variable in Python does the same job as this Scratch block.
    However, in Python you don''t have to click a button to create a variable. Python
    creates the variable as soon as you assign a value to it.


    SEE ALSO

    Types of data 110-111

    Math in 112-123 Python

    Strings in 116-115 Python

    Input and 116-117 output

    Functions 130-131


    ![](img/72d218a7a73c4d4abc7be582ebd85385_109_0.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_109_1.png)


    ![](img/72d218a7a73c4d4abc7be582ebd85385_109_2.png)'
