    and how to take your programming skills further.


    # # Experiment


    Play around with the code samples in this book. Find new ways to remix them or
    add new features—and don''t be afraid to break them too! This is your chance to
    experiment with Python. Remember that it is a professional programming language
    with a lot of power—you can do all sorts of things with it.


    # # Build your own libraries


    Programmers love to reuse code and share their work. Create your own library of
    useful functions and share it. It''s a great feeling to see your code being used
    by another programmer. You might build something as useful as Tkinter or Turtle!


