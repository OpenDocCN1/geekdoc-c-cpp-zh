  \n输出 8.8：提升图\n\n\n\n\n图 8.2 的右侧显示了预测空间被分为五个不同的区域。这些区域可以被看作高维矩形框。这些区域通过划分特征空间创建，使得每个区域的残差平方和（`RSS`）\
  \ 最小。\n\n一旦划分完成，预测新的未见观测值就变得非常简单直接。这是通过一系列 IF-THEN 问题来实现的。图 8.3 显示了确定新观测值值的逻辑步骤。\n\
  \n| 图 8.3![](img/Image11331.png) | 这种基于树的模型构建得像一棵倒立的树。树的第一部分被称为根节点。它提供了数据的初始分段。这是对数据提出的第一个\
  \ IF-THEN 问题。例如，如果某个值小于或等于一个给定的值 `()`，那么我们将继续沿着树的左侧移动。然而，如果大于该值，我们将沿着树的右侧移动。 |\n\
  \n决策算法遵循的路径被称为分支。该路径显示了决策过程从根节点到下一个内部节点，再到最终叶子节点的流向。\n\n下一个决策点被称为内部节点。这是将对数据提出的下一组\
  \ IF-THEN 问题。例如，如果初始根节点决策遵循了树的左侧，那么下一个提出的 IF-THEN 问题是某个值是否大于或等于 `.`。如果答案是，那么数据将被分类在区域一，否则数据将被分类在区域二。树的这些终端部分被称为叶节点。\n\
  \n对于分类问题，我们只需要分析每个区域并计算该区域的众数。该众数将是该区域任何新观测值的预测值。对于回归问题，我们将计算每个区域的平均值，并将该值填充为该区域任何新观测值的预测（平均值）。\n\
  \n# 优点与缺点\n\n我们已经可以看到决策树提供了易于理解的决策路径。它是对如何分类数据以及新观测值评分的常用语言描述。然而，决策树的所有方面并不是有利的。表\
  \ 8.3 快速总结了决策树的优缺点。\n\n## 表 8.3：决策树模型的优缺点\n\n| 优点 | 缺点 |\n| :--- | :--- |\n| 易于理解\
  \ | 贪心算法 |\n| 利用数值和分类数据 | 倾向于过拟合 |\n| 所需数据预处理少 | 不稳定性 |\n| 评分速度快 | 对多数类偏向 |\n\n\
  ### 优点\n- **易于理解** – 决策树被归类为“白盒”。这意味着每个决策点都易于理解，研究人员对决策点的如何构建以及新观测值如何评分有完全的。\n-\
  \ **利用数值和分类数据** – 决策树可以在同一个模型中利用数值和分类数据的组合。\n- **所需数据预处理少** – 不需要对输入数据进行归一化或标准化。不需要创建虚拟变量、填充缺失数据或调整离群值。决策树与原始数据配合良好。\n\
  - **评分速度快** – 一旦构建了决策树，就可以很小的计算能力快速为新观测值评分。\n\n### 缺点\n- **贪心算法** – 考虑特征空间的所有可能划分在计算上是徒劳的。因此，决策树算法为树的每一步选择数据最可能的拆分。然而，它不会根据树的后续拆分点来重新考虑之前的划分。决策树采用自上而下的方法，不重新考虑之前的拆分。\n\
  - **倾向于过拟合** – 无限制的决策树会产生非常细的叶节点。这些往往是具有许多层决策点（内部节点）的深度决策树。这些无限制的树会过拟合训练数据。\n- **不稳定性**\
  \ – 决策树可能非常不稳定。输入数据的微小变化可能导致完全不同的决策树。\n- **对多数类偏向** – 不平衡的数据可能导致决策树倾向于多数类。\n\n##\
  \ 决策树方法论\n\n我们检查了决策树的一般结构，但我们需要理解每个节点是如何确定的。\n\n你可以选择两种方法来创建决策树：`Entropy`（熵）和 `Gini\
  \ Impurity`（吉尼不纯度）。这些指标中的每一个都描述了数据的混乱或不纯程度。\n\n## 公式 8.1：熵\n![](img/Eq8.1.jpg)\n\
  \n## 公式 8.2：吉尼不纯度\n![](img/Eq8.2.jpg)\n\n这些方法的要目标是找到目标变量信息最多的变量。这意味着对于数值变量，算法将搜索每个数值变量可能的拆分点并确定最佳拆分点。最佳拆分点是能够最好分离目标变量的段点。对于字符变量，拆分点已经由字符变量内的类别数量确定了。\n\
  \n| 图 8.4![](img/Image1171.png) | 两种方法之间几乎没有实际区别，因为它们产生了非常相似的结果。然而，由于熵方法利用对数方法，这使得方法更消耗资源。让我们来看一个例子。图\
  \ 8.4 显示了我们之前展示的数据分布，但这次我们为根节点考虑两个可能的拆分点。第一个拆分点显示为 `t1` 并用蓝线表示。注意，这个拆分点左侧有目标变量观测值（用金星表示），右侧有七个。\
  \ |\n| 第二个可能的拆分点显示为 `t2` 并用红线表示。这个拆分点导致左侧五个观测值，右侧五个观测值。\n\n由于划分的目标是创建最好分离目标变量的段，我们将选择第一个拆分点作为根节点。\n\
  \n## 决策树构建\n\n决策树与回归模型完全不同。它们采用非参数方法，尝试将特征空间分为最好分离目标变量的不同段。这些段可以呈任何形状，但通常由矩形框表示。由于这与回归模型是不同的方法，让我们花时间从从原始数据到最终决策树的示例。\n\
  \n表 8.4 显示了我们将用于演示的数据集的随机样本。它是基于我们用于 `KNN` 示例的同一个；但为了简单进行了修改。我为四个预测变量中的每个变量创建了两个水平的分类变量，并平衡了数据集，使得正负结果观测值的数量相等。\n\
  \n## 表 8.4：随机样本\n\n| 联系方式 | 年份 | 活动次数 | 年龄分类 | 目标 |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| telephone | 1st half | 1 or 2 | LE 45 | no |\n| telephone | 1st half\
  \ | 1 or 2 | 45+ | no |\n| cellular | 2nd half | 1 or 2 | 45+ | no |\n| cellular\
  \ | 2nd half | 1 or 2 | LE 45 | no |\n| cellular | 2nd half | 1 or 2 | 45+ | no\
  \ |\n| telephone | 1st half | 1 or 2 | LE 45 | no |\n| cellular | 2nd half | Greater\
  \ than 2 | 45+ | no |\n| cellular | 2nd half | 1 or 2 | LE 45 | no |\n\n\n\n\n|\
  \ 手机 | 上半段 | 大于 2 | 不于 45 | 是 |\n| :--- | :--- | :--- | :--- | :--- |\n| 手机 | 上半段\
  \ | 大于 2 | 45+ | 是 |\n| 手机 | 上半段 | 1 或 2 | 不于 45 | 是 |\n| 手机 | 上半段 | 1 或 2 | 不于\
  \ 45 | 是 |\n| 手机 | 下半段 | 1 或 2 | 不于 45 | 是 |\n| 手机 | 下半段 | 1 或 2 | 不于 45 | 是 |\n\
  | 电话 | 上半段 | 1 或 2 | 45+ | 是 |\n| 手机 | 下半段 | 1 或 2 | 不于 45 | 是 |\n| 手机 | 下半段 | 1\
  \ 或 2 | 不于 45 | 是 |\n\n构建分类决策树的过程包含四个主要步骤：\n\n1. 计算每个变量的 `Gini` 不指数得分。\n2. 选择能最好分离数据的变量作为根节点。\n\
  3. 递归地划分数据以构建完整的决策树。\n4. 剪枝决策树以防止过拟合。\n\n为了手动构建决策树，我们首先需要为每个预测变量和目标变量创建一个交叉表。图 8.5\
  \ 显示了每个预测变量与目标变量之间执行 `PROC FREQ` 的结果。我们可以看到，每个预测变量只有两个水平，且正、负结果观测值的数量相等。\n\n###\
  \ 图 8.5：`PROC FREQ` 结果\n\n![](img/Image1222.png)\n\n| ![图 8.6：频率分布与划分计算](img/Image1242.png)\
  \ | 要确定哪个预测变量应该放在决策树的顶部（根节点），我们首先需要计算每个变量的 `Gini` 不指数得分。一旦完成计算，我们就可以比较得分并选择 `Gini`\
  \ 不指数最低的预测变量作为根节点。图 8.5 的右侧显示了计算第一个预测变量“contact”（联系）的 `Gini` 不指数得分的步骤。这是一个三步过程，我们首先计算变量左侧（`cellular`\
  \ 手机）的 `Gini` 不指数。第二步是对预测变量右侧（`telephone` 电话）执行相同的计算。最后，我们计算预测变量左侧和右侧的加权平均值。contact\
  \ 变量的最终 `Gini` 不指数得分为 0.4727。我不会为了折磨你对每个变量演示相同的过程。相反，表 8.5 包含了每个预测变量的 `Gini` 不指数得分。\
  \ |\n\n### 表 8.5：Gini 不指数得分\n\n| 变量 | GI 得分 |\n| :--- | :--- |\n| Contact (联系) |\
  \ 0.4727 |\n| Year (年份) | 0.4983 |\n| Campaigns (活动) | 0.4439 |\n| Age Cat (年龄段)\
  \ | 0.4443 |\n\n我们可以看到，高亮的变量“campaigns”（活动）在所有预测变量中具有最低的 `Gini` 不指数。该变量将被选为根节点，因为它在分离数据方面表现最好。\n\
  \n一旦确定了根节点，通过对每个划分点产生的人群执行相同的过程来递归构建决策树，就是一项机械性的练习。手动执行这一过程将是非常痛苦的。这就是为什么我们让计算机来完成完成。\n\
  \n#### 划分过程何时停止？\n\n到目前为止，我们只是回顾了构建决策树的步骤，但必须有一个点停止递归划分并创建叶节点。当下一个节点的 `Gini` 不指数大于上一个节点时，就会创建一个叶节点。一旦发生这种情况，具有较低\
  \ `Gini` 不指数的节点将成为叶节点。\n\n### 连续变量\n\n连续变量的划分点没有分类变量那么简单。对于连续变量，我们必须首先将数据从低到高排序。图\
  \ 8.7 展示了这一过程。\n\n### 图 8.7：连续变量划分\n\n![](img/Image1263.png)\n\n数据一旦好后，就会计算两个相邻值之间的平均值。接下来，计算每个平均值的\
  \ `Gini` 不指数得分。最后，选择 `Gini` 不指数最低的平均分作为连续变量的划分点。\n\n一旦确定了每个连续变量的划分点，就可以像上述的分类数据示例一样构建决策树。这种方法还允许决策树在同一棵树中同时包含分类变量和连续变量。\n\
  \n### 剪枝决策树\n\n决策树最大的问题之一是它们倾向于使模型过拟合到训练数据。这是因为如果模型不受限制，算法将继续构建树并构建非常精细的叶节点。这些被称为“深层树”，因为有几层内部节点通向叶节点。我们需要一种方法在所有可能的树的庞大空间中找到最优树。\n\
  \n限制算法并防止深树的一种方法是给模型施加约束。这种约束应该在不降低预测准确性的情况下减小决策树的。\n\n有两种被广泛使用的剪枝方法：\n\n1. **误差减少剪枝\
  \ (Reduced Error Pruning)**：对于决策树的每个叶节点，将该叶节点替换为代表占多数类别的节点。如果预测准确性没有下降，则保留该节点。\n\
  2. **代价剪枝 (Cost Complexity Pruning)** – 这种技术在树的大小和错误率之间进行权衡，以防止过拟合。引入了一个标记为 `alpha`\
  \ (`α`) 的复杂度参数，代表每个新叶节点的代价。\n\n#### 公式 8.3：复杂度\n```\n复杂度 = 错误率 + (alpha * 叶节点数量)\n\
  ```\n\n## 决策树模型\n\nSAS 提供了一个直观且易于理解的过程来构建决策树。`PROC HPLIT` 是一个高性能过程，允许数据科学家使用单一框架自定义构建各种树类型。\n\
  \n为了演示 `PROC HPLIT`，我们将使用在 KNN 模型示例中使用的数据集。银行营销数据包含了多种代表客户特征的预测变量，以及一个指示电话推销是否导致定期产品的二进制目标变量。许多字符变量已转换为虚拟变量。\n\
  \n程序 8.6 展示了 `PROC HPLIT` 的通用结构。\n\n```\nODS GRAPHICS ON;\n\nPROC HPLIT DATA=mydata.bank_train(DROP=row_num);\n\
  \  CLASS TARGET _CHARACTER_;\n  MODEL TARGET(EVENT='1') = _NUMERIC_ _CHARACTER_;\n\
  \  PRUNE costcomplexity;\n  PARTITION FRACTION(VALIDATE=0.3) SEED=42);\n  CODE FILE='C:/Users/James\
  \ Gearheart/Desktop/SAS Book Stuff/Data/bank_tree.sas';\n  OUTPUT OUT = SCORED;\n\
  run;\n```\n\n程序 8.6 说明：\n\n- 包含了 `ODS GRAPHICS ON` 语句以提供决策树的所有视觉元素。\n- 使用 `PROC\
  \ HPLIT` 在 `MYDATA.BANK_TRAIN` 数据集上开发决策树。该数据集之前经过过平衡处理，以确保正负目标值的数量相等。这将防止决策树过高估计多数类。\n\
  \n\n\n\n\n- `CLASS` 语句指定了目标变量以及包含在模型中的任何字符变量。\n- `MODEL` 语句是 `PROC HPSPLIT` 必须的。该语句列出了包含在模型中的变量。首先指定目标变量，额外的\
  \ `EVENT` 语句指定了我们想要建模的目标变量值。预测变量位于等号之后。对于此模型，我包含了所有的数值变量（因为字符变量之前已转换成数值哑变量）。任何可能导致数据泄露（data\
  \ bleed）的变量已提前从数据集中删除。\n- `PRUNE` 语句指定了我们想要如何修剪决策树以防止过拟合。\n- `PARTITION` 语句指定了我们想要如何应用\
  \ `PRUNE` 语句。与其使用 `PARTITION` 语句，我们也可以选择在 `DATA` 语句之后包含 `CVMODELFIT` 语句来使用交叉验证方法。\n\
  - `CODE FILE` 语句将输出一个包含决策树逻辑的 SAS 脚本。我们将使用此逻辑对保留的 `TEST` 数据集进行评分。\n- `OUTPUT OUT`\
  \ 语句将输出评分后的 `TRAIN` 数据集。\n\n### PROC HPSPLIT Options\n`PROC HPSPLIT` 提供了许多选项来自定义您的决策树，包括指定最大树深度、最大分支数量、您希望树如何生长、是否要对连续变量进行分箱、输出显示选项等许多。\n\
  \n对于我们选择的树结构，输出 8.9 显示了关于树的高级信息。注意在模型信息（Model Information）部分，`PROC HPSPLIT` 过程使用了熵法来选择分裂点。这是默认选项，但我们可以包含\
  \ `GROW` 语句并选择 `GINI` 或其他各种选项来生长决策树。\n\n同样注意在模型信息部分，决策树在修剪之前最初生长了 142 个叶子节点。在进行成本复杂度修剪后，这棵大树被减少到仅\
  \ 17 个叶子节点。\n\n输出 8.9：PROC HPSPLIT 输出\n\n![](img/Image1270.png)\n\n### 树的可视化表示\n\
  `PROC HPSPLIT` 输出的后续包含决策树的可视化表示。这是大多数人提到决策树时所想的视觉效果。\n\n输出 8.10 的左侧显示了完整决策树的可视化表示。这种表示还提供了决策树每个阶段人口数量的视觉线索。连接分支节点的线条粗细代表人口数量，而柱状图代表每个分支节点内目标值的分布情况。\n\
  \n输出 8.10 的右侧显示了决策树顶部部分的更多细节。此可视化图提供了每个分支节点的名称和分裂点信息。它还提供了每个节点中观测值的实际数量以及目标变量在每个节点内的分布。\n\
  \n输出 8.10：PROC HPSPLIT 树可视化\n\n| ![](img/Image1296.png) | ![](img/Image1306.png)\
  \ |\n\n### 评价指标\n输出的后续部分包含训练集和验证集的混淆矩阵。该表显示了实际与预测目标值以及相应的错误率。注意，验证错误率与训练集错误率非常接近。这是一个模型没有过拟合的良好信号。\n\
  \n输出 8.11：PROC HPSPLIT 评价指标\n\n![](img/Image1316.png)\n\n![](img/Image1327.png)\n\
  \n选定树拟合统计（Fit Statistics for Selected Tree）表显示了训练集和验证集的拟合统计。这些信息还提供了一个质量检查，以验证模型没有过拟合\
  \ `TRAIN` 数据集。与 `VALIDATION` 数据集相比，`TRAIN` 数据集的平均平方误差 (`ASE`) 和误分类率均略低。与 `VALIDATION`\
  \ 数据集相比，`TRAIN` 数据集的敏感性、特异性和曲线下面积 (`AUC`) 均略高。\n\n输出 8.12 显示了训练集和验证集的 ROC 曲线。这些信息也包含在上述统计表的\
  \ `AUC` 列中。\n\n输出 8.12：ROC \n\n![](img/Image1338.png)\n\n## 变量重要性\n输出 8.13 显示了变量重要性表。该表为我们提供了每个变量在最终模型中的能力以及它们预测目标变量相对重要性的关键信息。请记住，最重要的变量可能不在树的最顶部。变量重要性通过四个指标确定：\n\
  \n- `Count` – 变量被用作分裂规则的次数。\n- `Surrogate Count` – 变量被用在代理分裂规则中的次数。\n- `Reduction\
  \ in RSS` – 当节点发现分裂时，残差平方和的变化。\n- `Relative Importance` – 单个变量基于 `RSS` 的重要性除以最大\
  \ `RSS` 重要性。\n\n输出 8.13：变量重要性表\n\n![](img/Image1345.png)\n\n### 成本复杂度修剪\n输出 8.14\
  \ 显示了目标变量的成本复杂度修剪图。该图比较了完整决策树（修剪前）的叶子数量，并将其与误分类率（或分类模型）进行绘图。这是针对训练集和验证数据集都进行的。最佳叶子数量显示为垂直蓝色线，该线指定了验证数据集误分类率最低的点。如果这是一个回归模型，y\
  \ 轴将是 `RSS` 值。\n\n输出 8.14：成本复杂度图\n\n![](img/Image1356.png)\n\n### 对 TEST 数据集评分\n\
  `PROC HPSPLIT` 内部没有在过程中对保留的 `TEST` 数据集评分的能力。然而，它可以输出一个包含决策树逻辑的 SAS 脚本。我们将使用此逻辑对保留的\
  \ `TEST` 数据集进行评分。\n\n输出 8.7 显示了对保留数据集评分的代码。\n\n程序 8.7：对 TEST 集评分\n```\nDATA test_scored;\n\
