  \ | 1353 | 11004 |\n\n程序 8.4 计算了几个常用于评估分类模型性能的标准性能指标。\n\n### 程序 8.4：创建性能指标\n\n```\n\
  DATA METRICS;\n```\n\n```\n SET MYDATA.MASTER;\n```\n\n```\n ERROR_RATE = (FP+FN)/(P+N);\n\
  ```\n\n```\n ACCURACY = (TP+TN)/(P+N);\n```\n\n```\n SENSITIVITY = TP/P;\n```\n\n\
  ```\n SPECIFICITY = TN/N;\n```\n\n```\n PRECISION = TP/(TP+FP);\n```\n\n```\n FALSE_POSITIVE_RATE\
  \ = 1-SPECIFICITY;\n```\n\n```\nRUN;\n```\n\n我们将在专门介绍模型评估的章节中详细回顾这些性能性能指标，但现在让我们专注于关注“敏感性”（sensitivity）和“特异性”（specificity）这两个指标。\n\
  \n敏感性（也称为“召回率”，Recall）是真正性率。该指标展示了模型预测正确的实际正值的百分比。\n\n特异性是真负性率。该指标展示了模型预测正确的实际负值的百分比。\n\
  \n| ![](img/Image1117.png) | 为超参数选择“正确”的值以及算法必须提供的相关性能指标并不是一个非黑即白的决定。不存在绝对正确的模型。这是因为模型是为了解决业务问题而创建的。例如，如果你的模型是为了预测欺诈，你可能希望模型更加保守，并且会选择能够最大化真正性率（敏感性）的模型超参数。然而，如果模型是为营销目的设计的，你可能希望关注模型的特异性。\
  \ |\n\n数据科学家和他们的业务伙伴通常需要根据业务需求进行权衡并平衡决策。通常会选择平衡了特异性和敏感性的模型值。输出 8.7 显示了在程序 8.4 中创建的性能指标。\n\
