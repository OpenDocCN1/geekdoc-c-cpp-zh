  \ 产生的下一个信息是变量重要性表。该表与线性回归产生的“进入效应”（Effect Entered）表类似，因为它告诉我们与目标变量相关的最重要的变量是什么。注意，此表中的变量及其出现顺序与线性回归输出中“进入效应”表中的变量相似。\n\
  \n决策树模型可以轻松处理多级分类变量，如 `zip` 和 `neighbour_cleansed`。这些变量包含了大量关于房价的信息，因为它们是特定位置的。线性回归无法使用它们，因为它们包含太多层次；然而，决策树通过按最佳分裂点对它们进行分组，轻松地利用这些变量包含的信息。\n\
