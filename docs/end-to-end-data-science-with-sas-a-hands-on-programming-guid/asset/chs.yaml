- "# SAS 端到端数据科学：实用编程指南\n\n\n\n\n本手册的正确参考文献引用格式如下：Gearhart, James. 2020. End-to-End\
  \ Data Science with SAS®: A Hands-On Programming Guide. Cary, NC: SAS Institute\
  \ Inc.\n\n\n\n\n\n## 关于本书\n\n### 本书涵盖了什么？\n\n你好，我叫 James，我是一个成瘾者。我痴迷于数据科学书籍、网络课程、教学视频、博客、数据科学播、预测建模竞赛和编程。这种痴迷占据了我大部分的精神精力。从我醒来到入睡（以及整个梦境），我通常都在思考数据科学概念和代码。我敢打赌你们中的许多人也处于类似的境地。如果是这样，我信你们也对教学数据科学市场中的巨大空白感到像我一样感到沮丧。\n\
  \n![](img/Image967.png)\n\n市场上充斥着关于 Python、R 和 Hadoop 的数据科学书籍。这些书籍提供了数据科学的概述，并对各种机器学习模型进行了详细说明，还提供了这些特定编程语言的相关开发代码。虽然这些书籍对于数据科学家来说是很好的资源，但它们没有为商业领域最流行的编程语言提供直接的编程指导。SAS\
  \ 被 95% 的财富 500 强公司使用，而这些公司是数据科学家最大的雇主。现在有一个极佳的机会，可以通过真实案例来满足专业数据科学家对实战机器学习训练的需求。\n\
  \n许多 SAS 程序员面临的遗憾现实是，我们往往无法获得最新、最强大的 SAS 产品。SAS Enterprise Miner、SAS Visual Analytics、SAS\
  \ Forecast Server 和 SAS Viya 都是非常优秀的产品，但它们并非所有 SAS 程序员都能获得。对于在 SAS 环境中工作的数据科学家来说，能够在任何\
  \ SAS 环境中开发和实施机器学习模型是非常关重要的。即使数据科学家可以使用 SAS Viya，对他们来说，深入理解驱动他们在 SAS Viya 中开发的模型的编程代码也将是极其有益的。\n\
  \n本书 `End-to-End Data Science in SAS®` 为所有 SAS 程序员提供了在任何行业开发机器学习模型所需的模型、方法论和 SAS\
  \ 编码洞察。所有代码和数据集均在 GitHub 仓库中公开。\n\n### 这本书适合你吗？\n\n如果你对这本书感兴趣，那么你（很可能是你所属的机构）电脑上安装了\
  \ SAS。然而，并不是所有的 SAS 安装都是同等的。有些程序员使用 Base SAS（也称为 PC SAS）。其他人可以使用多种 SAS 软件：\n\n*\
  \ SAS Enterprise Guide\n* SAS Enterprise Miner\n* Visual Analytics\n* SAS Studio\n\
  * SAS Viya\n\n![](img/Image974.png)\n\n此列表只是许多 SAS 产品中的示例。除了这些产品外，SAS 还提供了若干软件组件：\n\
  \n* SAS/ACCESS\n* SAS/ETS\n* SAS/IML\n* SAS ODS Graphics Editor\n* SAS/OR\n* SAS/STAT\n\
  \n你公司的 IT 部门通常决定你拥有的 SAS 产品以及你可以使用的软件组件。如果你渴望使用 SAS Viya 或 SAS/ETS，你通常需要“努力”才能获得。我衷心希望你能获得这些\
  \ SAS 产品中的一个或多个，因为它们非常棒，会让你的数据科学家工作变得更容易、更高效。如果你像我一样，在没有 SAS 提供工具的情况下开发预测模型，那么这本书正是你需要的。\n\
  \n## SAS 软件要求\n\n书中介绍的大多数过程的最低要求是安装了 SAS/STAT 的 SAS 9.2。这涵盖了大多数 SAS 用户。根据最低要求，我们可以开发：\n\
  \n* 线性回归\n* 逻辑回归\n* 聚类\n* 决策树\n\n一些更高级的过程需要安装 SAS Enterprise Miner。这些过程将包括：\n\n\
  * `PROC HPFOREST`\n* `PROC TREEBOOST`\n* `PROC SVM`\n\n\n\n\n\n不要慌！仅仅因为你受限于安装了 `SAS/STAT`\
  \ 的 Base SAS，并不意味着我们受限于 `SAS/STAT` 自带的预定义过程。我们唯一的限制就是想象力。我将介绍如何仅使用 `SAS/STAT` 中可用的过程，从头开始开发并实现一些更高级过程的方法。从头创建这些过程的代码可能会相当复杂，但我将提供逐步解释，并且所有代码都可以在存储库中找到。\n\
  \n## 假设具备的编程知识\n\n如果你只有使用 Microsoft Excel 表格的经验，那么不要担心；我们可以让你在 SAS 中快速上手。然而，如果你从未以任何形式接触过过数据（包括\
  \ Excel 表格），那么这本书可能并不适合你。\n\n我将假设你具有编写基础公式的经验。例如，在 Excel 中：\n\n```excel\n=AVERAGE(B12:\
  \ B32)\n```\n\n```excel\n=SUM(A1: A14)\n```\n\n我还会假设你能够执行基本的计算机命令，如创建新文件、保存文件、打开文件等。\n\
  \n只要你满足了这些最低要求，并渴望学习能够保证增加你对任何组织价值的优秀新技能，我们就可以开始了。\n\n## 本书中使用的图标\n\n| ![](img/Image1022.png)\
  \ | 此图标表示警告或困难的主题 |\n| ![](img/Image1117.png) | 此图标表示数据科学家必须做出的决策 |\n\n## 示例代码和数据\n\
  \n书中示例使用的所有数据都是通过公共使用数据库获取的。这些存储库提供了跨越各个学科的广泛数据集。书中演示的代码主要由作者创建。任何展示的非作者创建的代码都已引用并向开发者给予了相应的感谢。存在一个非常大的\
  \ SAS 开发者社区，他们向世界公开分享自己的代码。我强烈建议你搜索网络，并在 SAS 网站、GitHub、Stack Overflow 以及其他几个社区与这些社区建立联系。\n\
  \n你可以通过访问 GitHub 存储库 [`github.com/Gearhj/End-to-End-Data-Science`](https://github.com/Gearhj/End-to-End-Data-Science)\
  \ 获取本书书的示例代码和数据。\n\n## SAS University Edition\n\n本书兼容 SAS University Edition。如果你正在使用\
  \ SAS University Edition，请从这里开始：[`support.sas.com/ue-data`](https://support.sas.com/ue-data)。\n\
  \n## 我们想听取你的反馈\n\n你对正在阅读的 SAS Press 书有疑问吗？请通过 `saspress@sas.com`(mailto:saspress@sas.com)\
  \ 联系我们。\n\nSAS Press 书由 SAS 用户为 SAS 用户编写。请访问 [sas.com/books](http://www.sas.com/books)\
  \ 注册请求如何成为 SAS Press 作者的信息。\n\n我们欢迎你参与新书的开发，并对你正在使用的 SAS Press 书提供反馈。请访问 [sas.com/books](http://www.sas.com/books)\
  \ 注册评审书籍。\n\n了解新书和专属折扣。立即刻在 [`support.sas.com/en/books/subscribe-books.html`](https://support.sas.com/en/books/subscribe-books.html)\
  \ 订阅我们的新书邮件列表。\n\n通过访问他的作者页面 `http://support.sas.com/gearheart` 了解更多关于作者的信息。你可以在那里下载免费书籍节选、访问示例代码和数据、阅读最新评论、获取更新等。\n\
  \n## 作者致谢\n\n我要感谢 SAS 允许我通过 SAS Press 出版这本书。成为 SAS 作者社区的一员我的荣幸。我还要感谢我的编辑 Suzanne\
  \ Morgen，感谢她的耐心和对细节惊人的洞察力。\n\n还要感谢所有审稿员，他们辛辛苦地审查了原始章节并提供了必要的批判性反馈：\n\n* Christopher\
