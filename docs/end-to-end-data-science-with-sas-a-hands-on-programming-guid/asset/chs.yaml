  \n## 概述\n到为止，我们已经回顾了参数模型。这些模型假设了一个预定义的函数形式，例如线性回归方程（方程 6.1）或逻辑回归方程（方程 7.1）。要将这些模型应用于数据集，假设数据服从正态分布；对于线性回归模型，假设数据与目标变量之间存在线性关系，且方差齐性。由于我们对数据集施加了这些假设，估计数据函数形式的问题被大大简化。我们不需要探索目标变量与预测变量之间所有可能的关系；只需要计算现有函数的系数即可。\n\
  \n线性回归和逻辑回归模型被归类参数模型，因为估计数据函数形式的问题被简化为估计给定模型的参数。由于这些限制，与非参数模型相比，参数模型的运行速度更快、更容易训练，且所需的计算资源极少。然而，目标变量与预测变量之间的关系很少是线性的。事实上，线性回归模型仅适用于极少数建模情况。通常情况下，目标变量与预测变量之间的关系完全是非线性的。\n\
  \n非参数模型不具有与参数模型相关的限制。它们不对数据的函数形式做任何假设；因此，它们可以自由探索并开发目标变量与预测变量之间所有可能的关系。这种自由为非参数模型提供了极大的灵活性，但代价是复杂性和计算资源。\n\
  \n参数模型面临着假设的函数形式不能代表数据真实函数形式的风险，而非参数模型则没有这种风险。但这种模型拟合风险的降低是需要代价的。非参数模型需要大量的观测值来准确估计数据的底层函数形式。由于观测数量的增加以及需要在整个\
  \ p 维函数形式空间中进行搜索，非参数建模方法是非常耗费资源的。\n\n本章将回顾几种不同类型的非参数模型。\n\n## 数据集建模\n由于本书的主题是数据科学和机器学习的实战方法，我将从实用的角度解释每个非参数模型，并为每个算法使用相同的建模数据集。这样，我们可以在保持底层数据不变的情况下，看到每个算法之间的相似之处和差异。\n\
  \n我们在本章将使用的数据来自著名的 UCI 机器学习存储库。数据集名为“银行营销数据集”（Bank Marketing Data Set），可以在此处找到：http://archive.ics.uci.edu/ml/datasets/Bank+Marketing。\n\
  \n该数据集代表了由葡萄牙银行机构进行的直接营销活动（电话访问）。直接营销活动的目标是让客户订阅定期存款产品。数据集包含 15 个独立变量，代表客户属性（年龄、工作、婚姻状况、教育等）和营销活动属性（月份、星期几、营销活动次数等）。\n\
  \n数据集中的目标变量表示为 `y`。该变量是一个二元指示器，表示电话推销是否导致了定期存款产品的销售（`yes`）或未销售（`no`）。为了我们的起见，我将重新编码该变量并将其标记为\
  \ `TARGET`，二元结果中 `yes` 为 1，`no` 为 0。\n\n导入数据和转换目标变量的代码可以在 GitHub 仓库找到：https://github.com/Gearhj/End-to-End-Data-Science。\n\
  \n数据导入后，我们可以通过 `MEANS` 过程快速查看数值变量。`PROC MEANS` 的输出所示输出 8.1。\n\n输出 8.1：`PROC MEANS`\
  \ 输出\n\n![](img/Image726.png)\n\n此输出向我们展示了我们需要注意的两个关键变量。`pdays` 变量代表客户自上一次营销活动被联系后的天数。我们可以很快看到其最大值为\
  \ 999。这是该变量包含“特殊值”的一个良好指标。特殊值是与数据其他部分不同的观测值的数值表示。在这种情况下，值 999 代表客户以前没有接触过营销活动。将该值解释为自上次营销活动联系该客户以来已过去\
  \ 999 天将是错误的。\n\n我们更关心的第二个变量是 `duration` 变量。该变量的解释非常直观。它代表了与活动相关的联系电话持续的分钟数。这显然是一个非常强大的预测变量。然而，我们事先并不知道这一信息。将此变量包含在任何预测模型中都是错误的，因为这是一个严重的数据泄露（data\
  \ bleed）案例。我们对该变量能做的事情就是从建模数据集中删除它。\n\n数据集包含十个字符变量。每个变量都有自己的描述性类别。例如，`loan` 变量有三个可能值：`no`、`yes`\
  \ 和 `unknown`。表 8.1 显示了每个字符变量的级别数量。\n\n\n\n\n\n| 表 8.1: 字符变量级别!![](img/Image7641.png)\
  \ | 任何基于树的算法都能轻松地接受字符变量作为模型输入，而无需将其转换为数值表示（虚拟变量）。然而，由于我们准备使用此数据集来演示几种不同的非参数算法，我们需要将字符变量转换为虚拟变量。有关虚拟变量及其构建方式的更多详细信息，请参阅第\
  \ 5 章：创建建模数据集。开发虚拟变量的代码可以在 GitHub 仓库中找到。 |\n\n现在我们已经对数据进行了转换，现在我们按照 70/30 的比例将数据划分为\
  \ `TRAIN` 和 `TEST` 数据集。程序 8.1 显示了使用 `PROC SURVEYSELECT` 方法划分数据并构建 `TRAIN` 和 `TEST`\
  \ 数据集的过程。\n\n###  程序 8.1：TRAIN/TEST 数据拆分\n\n```\nPROC SURVEYSELECT DATA=MYDATA.BANKFULL\
  \ RATE=0.3 OUTALL OUT=class SEED=42; RUN;\n```\n\n```\nPROC FREQ DATA=class; TABLES\
  \ selected; RUN;\n```\n\n```\nDATA MYDATA.BANK_TRAIN MYDATA.BANK_TEST;\n```\n\n\
  ```\n SET class;\n```\n\n```\n IF selected = 0 THEN OUTPUT MYDATA.BANK_TRAIN; ELSE\
  \ OUTPUT MYDATA.BANK_TEST;\n```\n\n```\n DROP selected;\n```\n\n```\nRUN;\n```\n\
  \n```\nPROC FREQ DATA=MYDATA.BANK_TRAIN; TABLES TARGET; RUN;\n```\n\n```\nPROC FREQ\
  \ DATA=MYDATA.BANK_TEST; TABLES TARGET; RUN;\n```\n\n最后查看 `TRAIN` 和 `TEST` 数据集的频率分布，可以看出数据已经过随机选择，且两个数据集的事件发生率是可比的。\n\
  \n### 输出 8.2：TRAIN 和 TEST 数据集中目标变量的频率分布\n\n![](img/Image775.png)\n\n![](img/Image783.png)\n\
  \n## K-近邻模型\n\n物以类群。– 威廉·特纳\n\n你和你相处时间最多的五人的平均值。– 吉姆·罗恩\n\nK-近邻 (KNN) 模型可能是最简单的建模结构，但它非常有效。它具有高度的通用性，可以用于分类或回归建模，并应用于从营销到基因组学的广泛非线性应用中。该建模算法被归类为非参数算法，因为它对数据的函数形式不作任何假设。它也被称为惰学习算法，因为它不基于训练数据进行泛化。对于这种算法，训练阶段非常微小。\n\
  \n与所有机器学习算法一样，使用 KNN 模型也有其优缺点。表 8.2 列出了 KNN 模型最相关的优缺点。\n\n### 表 8.2：KNN 模型的优缺点\n\
  \n| 优点 | 缺点 |\n| :--- | :--- |\n| 实现简单 | 计算密集 |\n| 于分析处理 | 需要大量存储 |\n| 对局部信息具有高度适应性，可形成非线性决策边界\
  \ | 极易受到维度灾难的影响 |\n\nKNN 模型非常简单。我们将取一个建模数据集并表示在网格上。网格将展示每个观测值在 X-Y 平面上的位置，并显示每个观测的目标变量值。\n\
  \n图 8.1 显示了数据网格的基本概念。填充网格的初始数据是训练数据。左图显示了训练数据的分布。注意在这个例子，数据被聚类到特定的组，这些组通过颜色编码来表示分类目标变量的三个级别。我们可以看到，由于类别聚集在一起，目标变量的底层数据具有相似的分布。\n\
  \n### 图 8.1：数据网格\n\n![](img/Image805.png)\n\n初始训练数据的分布仅显示了 X 和 Y 变量之间的关系以及如何根据目标变量分组。对于任何新观测值，我们只需要根据自身的\
  \ X 和 Y 坐标将新观测值放在网格上，并计算最近的数据点与新观测值之间的距离。\n\nKNN 中的 `k` 代表我们用于确定新观测值预测目标值的“邻居”数量。如果\
  \ `k = 1`，我们只需确定哪个训练数据点离新观测值最近，将其目标值分配给新观测值。\n\n然而，使用 `k=1` 很少有用。这可能导致预测极不稳定。如果我们增加\
  \ `k` 的值，我们将找到由 `k` 表示的最近邻居数量，并计算回归模型的平均值（或分类模型的众数），用以分配给新观测值的目标值。例如，如果我们选择了 `k=5`，那么我们将找到离新观测值最近的五个训练数据点。如果这五个训练数据点中有三个的目标值为\
  \ 1，那么我们就为新观测值分配目标值 1。这就是 KNN 算法中数据评分的方式。\n\n图 8.1 的右侧显示决策边界的示例。这些颜色编码的空间是基于 `k=5`\
  \ 最近邻算法创建的。如果新数据点的坐标使其位于红色区域的任何位置，则新数据点将被分配与红色组相关的目标值。\n\n## KNN 分类\n\n在上一章关于参数分类模型的章节中，我们回顾了\
  \ `PROC DISCRIM`。该过程对于观测值较少或分类水平多于两个的分类问题非常有有用。这个灵活的过程也可以用于开发 KNN 模型。\n\n`PROC DISCRIM`\
  \ 有两个关键选项可以用于开发模型。`METHOD` 选项允许我们选择 `NPAR`，表示我们要开发非参数模型。`K` 选项允许我们指定用于投票的邻居数量。程序\
  \ 8.2 首先将所有数值变量放入全局变量，然后使用 `PROC DISCRIM` 开发模型。\n\n### 程序 8.2：使用 PROC DISCRIM 创建\
  \ KNN\n\n```\n/* 创建包含在 KNN 模型中的全局变量 */\n```\nPROC CONTENTS NOPINT DATA=MYDATA.BANK_TRAIN\
  \ (_NUMERIC_ drop=ROW_NUM)\nOUT=VAR4 (KEEP=name);\nRUN;\n```\n\n```\nPROC SQL NOPINT;\n\
  ```\n```\nSELECT name INTO: num_vars separated by “ ” FROM VAR4;\n```\n```\nQUIT;\n\
  ```\n\n```\n%PUT &num_vars;\n```\n\n```\n/* 使用 PROC DISCRIM 进行 KNN */\n```\n```\n\
  PROC DISCRIM DATA=MYDATA.BANK_TRAIN METHOD=NPAR K=5\nTESTDATA=MYDATA.BANK_TEST TESTOUT=SCORED;\n\
  CLASS TARGET;\nVAR &num_vars.;\nRUN;\n```\n\n#### 程序 8.2 注意：\n\n- `PROC CONTENTS`\
  \ 用于选择所有数值变量。注意 `TARGET` 和 `ROW_NUM` 变量被排除在外。\n- `PROC SQL` 将选定的数值变量放入名为 `num_vars`\
  \ 的全局变量中。\n- `PROC DISCRIM` 用于开发模型。该过程使用 `MYDATA.BANK_TRAIN` 数据作为输入训练数据。\n- `METHOD`\
  \ 语句设置为 `NPAR`，这告诉模型使用非参数方法推导分类准则。\n- `K` 选项指定邻居的数量。虽然我们最初将其设置为 5，但在下一节中，我将展示如何识别\
  \ `K` 的最优值。\n- `TESTDATA` 语句指定测试数据集，`TESTOUT` 语句指定了评分后的测试输出数据集。\n- `CLASS` 语句指定目标变量。\n\
  - `VAR` 语句指定用于模型的预测变量。\n\n\n\n\n\n| ![](img/Image1022.png) | 在实现 KNN 模型时，需要记住的一点是，该模型非常消耗资源。这意味着\
  \ SAS 必须保留训练数据集中每个观测值之间的所有关系（距离）。如果你有一个较大的训练数据集（超过 10 万条），这可能会导致处理时间过长，甚至导致存储空间不足。\
  \ |\n\n# KNN 模型输出\n\n由 `PROC DISCRIM` 派生的 KNN 模型默认输出包含了关于输入数据集的摘要信息，以及针对 `TRAIN`（训练集）和\
  \ `TEST`（测试集）数据集的混淆矩阵（confusion matrix）。混淆矩阵是专为分类模型开发的一种信息表，它总结了正确分类的数量和错误分类的数量。这些信息可以用于开发特定的指标，这些指标将在下一节中进行审查。\n\
  \n输出 8.3 显示了模型输出的第一部分。大多数 SAS 建模过程都会产生此类摘要信息。信息表提供了观测值的总数、预测变量的数量以及分类变量的级别数量。此部分信息还提供了事件率，显示为每个分类级别观测值占的比例。\n\
  \n## 输出 8.3：KNN 模型输出\n\n![](img/Image839.png)\n\n模型输出的下一部分如图 8.3 所示。此部分显示了训练数据集的混淆矩阵。实际响应值垂直列在左侧作为行，而预测响应值水平列在表格的顶部部分作为列。\n\
  \n实际响应等于 1 且预测响应等于 1 的交叉点显示模型对于实际正值的预测是准确的。实际响应值为 0 且预测响应值为 0 的交叉点显示模型对于实际负值的预测也是准确的。\n\
  \n当实际值为 0 但模型预测该值为 1 时，即为假阳性（第 1 类错误）。当实际值为 1 但模型预测该值为 0 时，即为假阴性（第 2 类错误）。这些信息在输出\
  \ 8.4 中被突出显示。\n\n## 输出 8.4：混淆矩阵\n\n![](img/Out_8.4.jpg)\n\n上述训练数据集的混淆矩阵显示，模型对于正响应值存在高度过拟合。错误计数估计表（Error\
  \ Count Estimates table）显示，模型仅在百分之零三的案例中错误地分类了实际正值。然而，模型在 28% 的案例中错误分类了负响应。尽管这仍然比随机选择要好（随机选择会在\
  \ 50% 的案例中错误分类正负响应值，由先验概率表示），但我们需要意识到该模型并没有很好地拟合数据。\n\n记住，我们不根据训练数据集来评估模型的准确性。我们需要评估在留出测试数据集上开发的混淆矩阵。输出\
  \ 8.5 显示了由我们在 `PROC DISCRIM` 中包含的 `TESTOUT = SCORED` 语句创建的数据集的混淆矩阵。\n\n## 输出 8.5：TEST\
  \ 数据集混淆矩阵\n\n![](img/Out_8.5.jpg)\n\n注意，与在 `TRAIN` 数据集上开发的表相比，留出 `TEST` 数据集的错误计数估计表有有巨大差异。留出\
  \ `TEST` 数据集的正响应值错误率为 37%。当我们与此值与 `TRAIN` 数据集生成的 0.03% 错误率比较时，可以验证数据对训练数据高度过拟合。\n\
  \n# 超参数调优\n\n模型对训练数据集过拟合的主要原因之一是因为我们没有进行超参数调优。超参数是数据科学家在运行模型之前选择的值。每种机器学习算法都有自己的可用超参数列表，数据科学家必须在运行算法之前对这些参数做出决定。\n\
  \n例如，在回归章节中，我们包含了 `SLE=0.1` 语句。`SLE` 指定了变量进入模型的显著性水平。该值是在运行模型**之前**选择的。\n\n模型参数与超参数之间的区别在于，模型生成的参数是算法创建的输出。而超参数是在运行模型**之前**选择的，它们定义了模型的局限性。\n\
  \n在程序 8.2 中开发的 KNN 示例通过 `K=5` 指定了最近邻的数量。无法先验地知道 `K` 的正确值。我们需要探索一个值范围来优化模型。\n\n程序\
  \ 8.3 创建了一个循环，在 1 到 15 的 `K` 值之间循环，并为每个 `K` 值创建摘要指标。\n\n## 程序 8.3：KNN 超参数调优\n\n\
  ```sas\n/*创建一个用于存储评估指标的数据集*/\nDATA MYDATA.MASTER;\n  TP = 1; FP = 1; TN = 1; FN\
  \ = 1; P = 1; N = 1;\nRUN;\n\n/*创建一个在 1 到 15 K 值之间循环的 DO LOOP*/\n%MACRO KNN;\n %do\
  \ k=1 %to 15;\n  /*为每个 K 值构建一个 KNN 模型*/\n  PROC DISCRIM DATA=MYDATA.BANK_TRAIN METHOD=NPAR\
  \ K=&k.\n  TESTDATA=MYDATA.BANK_TEST TESTOUT=SCORED_&k.;\n  CLASS TARGET;\n  VAR\
  \ &num_vars.;\n  RUN;\n  /*为指标创建指示符*/\n  DATA SUM;\n  SET SCORED_&k.;\n  if TARGET\
  \ = 1 and predicted = 1 then TP = 1;\n  if TARGET = 0 and predicted = 1 then FP\
  \ = 1;\n  if TARGET = 1 and predicted = 0 then FN = 1;\n  if TARGET = 0 and predicted\
  \ = 0 then TN = 1;\n  /* 指标计算逻辑 ... */\n  RUN;\n %end;\n%END;\n```\n\n## 关于程序 8.3\
  \ 的说明\n\n- `DATA` 步骤创建了主数据集。\n- `%KNN` 宏在 1 到 15 的 `K` 值之间迭代。\n- 在循环内部，`PROC DISCRIM`\
  \ 使用 `TESTOUT=SCORED_&k.` 选项为每个 `K` 创建临时数据集。\n- `SUM` 步骤根据实际预测值计算指标。\n\n\n\n\n\n\
