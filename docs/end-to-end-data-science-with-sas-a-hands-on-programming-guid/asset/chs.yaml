  \ MAX 值*/\n```\n\n```\n%MACRO loopit(mylist);\n```\n\n```\n %LET n = %SYSFUNC(countw(&mylist));\n\
  ```\n\n```\n %DO I=1 %TO &n;\n```\n\n```\n %LET val = %SCAN(&mylist,&I);\n```\n\n\
  ```\n data chk;\n```\n\n```\nset mydata.chk(keep=row_num &val\n```\n\n*(注：由于您提供的原始文本在程序\
  \ 5.25 处发生了截断，以上翻译已涵盖您提供的最后一行。)*\n\n\n\n在处理真实世界的数据时，数据转换是一种常见的需求。这是将数据从一种格式或结构转换为另一种格式或结构的过程。例如，通常数据集会包含一个格式化为字符变量的连续变量。在回归模型中使用该变量将很困难，因为模型会将其解释为分类变量，而不是连续的数值输入变量（关于这些细节将在回归章节中介绍）。即使模型能够完成处理，结果看起来也会很奇怪。基于树的模型也会发生相同的问题。树算法会单独评估字符变量的每一个单独值，并将共同的值分组到拆分点的一侧。同样，这看起来会非常奇怪且非常难以解释。\n\
  \n幸运的是，我们本章的示例数据集没有包含任何本应为数值型却被错误格式化为字符值的变量。不过，让我们来看一下这种问题发生的几个常见示例。\n\n## 将字符转换为数值格式\n\
  \n转换变量格式的过程可能是所有 SAS 程序员必须执行的最常见的数据转换技术。需要记住的最重要点是：在从数值转换为字符时使用 `PUT` 语句，在从字符转换为数值时使用\
  \ `INPUT` 语句。让我们来看几个例子：\n\n程序 5.28 取一个数值变量并将其转换为字符变量。在这个示例中，我只保留了我想转换的数值变量。这是为了提高处理速度。我通常不会将数据集限制为单个变量。该程序创建了一个名为\
  \ `char_loan` 的新变量，它的值与 `loan_amnt` 变量完全相同，只是格式变为字符变量。我使用了 `PUT` 语句，并在括号中指定了我想转换的变量以及我想将其转换的格式。\n\
  \n程序 5.28：数值转为字符\n\n```\nDATA num_to_char;\nSET MYDATA.LOAN_LIMIT (KEEP=loan_amnt);\n\
  char_loan = put(loan_amnt, $8.);\nDROP loan_amnt;\nRUN;\n```\n\n程序 5.29 展示了相反的转换。我将新创建的字符变量转换回数值格式。注意唯一的区别是我使用了指定了正确数值格式的\
  \ `INPUT` 语句。\n\n程序 5.29：字符转换为数值\n\n```\nDATA char_to_num;\nSET num_to_char;\nnum_loan\
  \ = input(char_loan, 8.);\nDROP char_loan;\nRUN;\n```\n\n## 转换日期值\n\n由于日期表示方式多样，日期值往往会带来问题。如果它们被格式化为字符变量，你可以简单地使用上述演示的转换技术。唯一的不同在于，你可能想要将\
  \ `FORMAT` 语句作为最后一行代码（`FORMAT start_date date8.`）。\n\n另一个常见的日期值格式化问题发生在数据以 `DATETIME`\
  \ 格式表示时。变量看起来像这样：`01APR2001:12:01:37`\n\n该变量显示日期为 `01APR2001`，时间戳为 `12:01:37`。将这些变量分为不同的日期和时间变量通常很有用。程序\
  \ 5.30 展示了将 datetime 变量分为独立日期变量的示例。这段代码将包含在 `DATA` 语句中。\n\n程序 5.30：识别日期和时间部分\n\n\
  ```\ndate = datepart(datetime);\ntime = timepart(datetime);\n```\n\n转换日期值时另一个实用的项是为年、月、日和周创建独立值的能力。在处理时间序列模型时，这些变量可能非常有价值。程序\
  \ 5.31 展示了如何为这些日期值中的每个创建一个单独变量。生成的数据集将包含每个创建变量的数值。\n\n程序 5.31：创建日期变量\n\n```\nDATA\
  \ date_values;\nSET dataset;\nyear  = year(date);\nmonth = month(date);\nday   =\
  \ day(date);\nweek  = week(date);\nRUN;\n```\n\n这些变量现在可以作为时间序列模型的独立输入，或者你可以使用它们来执行计算。\n\
  \n## 特征工程\n\n特征工程是从现有变量的组合或转换创建新变量的过程。我们上面审查的转换过程就是特征工程的一种。有几种不同类型的特征工程可以应用于我们的\
  \ Lending Club 数据集。这些包括组合变量、创建多项式、创建虚拟变量以及其他其他方法。程序 5.32 在 Lending Club 数据集上展示了这些技术中的几种。\n\
  \n程序 5.32：特征工程\n\n```\nDATA new_features;\nSET MYDATA.LOAN_LIMIT (KEEP=installment\
  \ annual_inc int_rate term);\n/*创建新变量：债务收入比*/\ndti = installment / (annual_inc /\
  \ 12);\n/*多项式*/\nint_rate_sq = int_rate**2;\n/*虚拟变量*/\nIF term = ‘36 months’ THEN\
  \ t36 = 1; ELSE t36 = 0;\nIF term = ‘60 months’ THEN t60 = 1; ELSE t60 = 0;\nRUN;\n\
  ```\n\n程序 5.32 备注：\n\n- 债务收入变量是通过对 Lending Club 数据集中包含的变量应用公式创建的。`installment` 变量用作分子，`annual_inc`\
  \ 变量除以 12 以创建分母。这个新变量可以作为独立特征用于建模数据集中。\n- `int_rate` 变量的多项式在建模中是有益的，因为它可以强调低、中、高值之间的差异。例如，对于\
  \ 3.4、9.2 和 17.8 这些基础值，这些数字的平方分别为 11.56、84.64 和 316.84。多项式带来的分离通常非常有价值。多项式还有表达非线性关系的优点。\n\
  - 字符变量 `term` 有两个值。这些值可以分为两个独立的数值值，仅作为这些值的二值指示。虚拟变量非常常见，在预测建模中可能非常有价值。\n\n## 特征缩放\n\
  \n特征缩放是转换输入变量以调整数据范围和分布的过程。对于某些类型的模型，这是一个至关重要的步骤。例如，“最近邻”模型根据两个或多个预测变量之间的计算距离为观测值分配值。如果这些变量的尺度差异巨大，某些变量将掩盖其他变量。然而，如果所有变量的缩放相似，那么所有变量在预测空间中都会得到均匀表示。\n\
  \n特征缩放有两种主要方法。\n\n归一化——对数据应用转换，使转换后的数据大致呈正态分布。这种方法通常通过对数变换完成，尽管还有其他归一化方法。\n\n程序\
  \ 5.33：创建对数变量\n\n```\nlog_income = log(annual_inc);\n```\n\n\n\n\n## 标准化\n\n标准化（Standardization）——调整输入变量使其处于相同尺度的过程。简单的公式是减去平均值并除以标准差。这个过程会产生标准分，告诉我们特定变量处于平均值之上或下方多少个标准差处。这种方法允许我们比较不同类型变量之间的得分。\n\
  \n程序 5.34 展示了 `STDIZE` 过程。该过程非常灵活，允许数据科学家在 18 种不同的标准化方法之间进行选择。`PROC STDIZE` 利用标准化的\
  \ `STD` 方法，这也被称为 z-score 方法。该方法从观测值中减去平均值，并除以标准差，以产生标准化后的结果。\n\n### 程序 5.34：创建标准化变量\n\
  \n```sas\nPROC STDIZE DATA=MYDATA.Loan_limit(KEEP=annual_inc int_rate)\nMETHOD=STD\
  \ OUT=std_vars;\nVAR annual_inc int_rate;\nRUN;\n```\n\n让我们来看看原始值与新生成的标准化值之间的差异。表\
  \ 5.1 显示了 Lending Club 数据集中 `int_rate` 和 `annual_inc` 变量的前十个观测值。左侧变量组显示了变量的原始尺度。显然，利率值与申请人的年收入值之间存在巨大差异。这些变量具有完全不同的尺度。\n\
  \n右侧变量组显示了这些变量的标准化版本。`STD` 方法对这些变量进行了标准化。由于这些变量现在已转换为 z-score，我们可以通过在相似的尺度上绘制图来比较变量（图\
  \ 5.2）。\n\n### 表 5.1：原始值与标准化值的比较\n\n| | 原始变量 | | 标准化变量 | | |\n| :--- | :--- | :---\
  \ | :--- | :--- |\n| **OBS** | **INT_RATE** | **ANNUAL_INC** | **INT_RATE** | **ANNUAL_INC**\
  \ |\n| 1 | 13.56 | 55000 | -1.34 | -0.548 |\n| 2 | 18.94 | 90000 | 1.149 | -0.097\
  \ |\n| 3 | 17.97 | 59280 | 0.701 | -0.493 |\n| 4 | 18.84 | 92000 | 1.149 | -0.071\
  \ |\n| 5 | 16.14 | 57250 | -0.15 | -0.519 |\n| 6 | 15.02 | 152500 | -0.66 | 0.708\
  \ |\n| 7 | 17.97 | 51000 | 0.701 | -0.6 |\n| 8 | 13.56 | 65000 | -1.34 | -0.419\
  \ |\n| 9 | 17.97 | 53580 | 0.701 | -0.566 |\n| 10 | 14.47 | 300000 | -0.92 | 2.609\
  \ |\n\n图 5.2：原始值与标准化值的可视化\n\n![](img/Figure_5.2.jpg)\n![](img/Figure_5.2pt2.jpg)\n\
  \n图 5.2 中的第一个散点图显示了变量的原始尺度。我们可以看到 `annual_inc` 变量主导了数据的分布。然而，第二个散点图显示了标准化后的变量。这种数据视图对于最近邻模型要有益得多，因为两个变量对数据分布的贡献是相同的。\n\
  \n# 证据权重 (Weight of Evidence)\n\n“能赢就赢，输了就输，但永远要作弊！” – Jesse Ventura\n\nETL 过程是非常耗时的。调查每个变量、识别并填充缺失值、识别并封顶异常值以及应用适当的特征缩放技术都需要大量。有时你时间紧迫，需要对数据进行快速转换，以建立基础模型来确定该项目是否值得投入。如果有一个处理所有这些数据的捷径，那难道不是很好吗？如果有机会，你不想稍微“作弊”一下吗？\n\
  \n欢迎学习证据权重（WOE）转换。\n\nWOE 表达了自变量相对于因变量的预测能力。作为一个通用公式，WOE 是通过对非事件百分比与事件百分比的比取自然对数计算得出的。\n\
  \n![](img/WOEEq.jpg)\n\n对于我们的示例 Lending Club 数据集，因变量（目标变量）标记为 `BAD`。该指标表示客户的贷款状态是否为坏（定义为核销或逾期）。WOE\
  \ 简单地衡量了“好”客户和“坏”客户的分离。\n\n![](img/WOEEq2.jpg)\n\n好分布（Distribution of Goods）定义为特定组中好客户的百分比。坏分布（Distribution\
  \ of Bads）定义为特定组中坏客户的百分比。\n\nWOE 是一个分箱过程（binned procedure）。这意味着算法创建了数据的若干箱或数值范围，并计算每个箱箱的\
  \ WOE 值。该过程相对简单：\n\n1. 对变量进行排序并将其分成相等的部分。标准的箱数通常是 10 或 20。因此，每个箱将包含 10% 或 5% 的数据。\n\
  2. [后续步骤省略原文]。\n\n\n\n\nWOE 和 IV 算法可以应用于数据中的所有数值变量。一个通用规则是保留所有 `IV` 分数大于 `0.1` 的变量。这是一个快速高效的变量选择方法，因为你只保留了与目标变量具有强相关的变量。\n\
  \n表 5.3 总结了 WOE 程序的优缺点。\n\n### 表 5.3：WOE 的优缺点\n\n| 优点 | 缺点 |\n| :--- | :--- |\n\
  | 处理缺失值 | 仅适用于逻辑回归建模 |\n| 处理离群值 | 数值难以解释 |\n| 无需虚拟变量 | 创建的是阶梯模型 |\n\nWOE 程序的优点非常直观易懂。而缺点方面可能需要一些额外的解释。\n\
  \n1. **仅适用于逻辑回归建模** – WOE 程序创建了基于分布的对数值的数据转换。这与逻辑回归的输出函数是一致的。其他分类模型（如决策树）不适合结合 WOE\
  \ 程序使用。\n2. **数值难以解释** – WOE 程序的输出是分箱数据的对数转换。这种输出没有经理能够理解的、易于解释的通用语言定义。\n3. **创建的是阶梯模型**\
  \ – WOE 的分箱程序创建了非连续的信息类别。这些分箱组导致了阶梯模型，而不是连续变量模型。\n\n尽管 WOE 程序的局限性限制了该方法的适用性，但不应否定其优点。这是一种快速高效的方法，可用于构建快速的逻辑回归模型，并确定目标变量与预测变量之间关系的强度。\n\
  \n## 加载 (Load)\n\n本章重点关注 ETL 过程。我们研究了提取（Extract）和转换（Transform）部分，现在剩下流程最后的加载（Load）部分。虽然提取和转换部分需要大量的解释和相关代码，但加载部分高度依赖于你工作的环境。加载是指将你最终转换后的数据集加载到数据仓库或建模环境中。执行加载步骤的环境通常有三类。\n\
  \n## 单机\n如果你是一个独立的研究员或学生，那么你的环境最可能是一台单机，你可能已经在这台机器上下载了数据并执行了转换。你很会在同一个环境中构建并部署你的模型。在这种环境下，加载步骤是不必要的，因为数据已经加载到了你将执行所有后续模型开发和部署步骤的环境中。\n\
  \n## 云端环境\n许多数据科学家已将数据集提取到特定环境并对数据执行了转换。然而，模型的建模和部署将在云端环境中进行，例如 `AWS`、`Azure`、`IBM`、`Google`\
  \ 以及许多提供云数据存储和预测建模工具的选项。\n\n对于这些研究人员来说，一旦数据在他们的 `SAS` 环境中经过适当转换，他们就需要将数据导出（通常作为\
  \ `CSV`、`txt` 或 `JSON` 文件）并将数据加载到他们选择的云端环境中。\n\n## 企业环境\n尽管云端环境正在迅速普及，但企业环境是大多数数据所在的地方。这些仅存放特定公司数据的数据仓库。这些数据仓库通常由该公司拥有和运营。在这种环境中，一旦你提取了数据（通常来自数据仓库中的各种数据库）并为了建模目的转换了数据，你就需要将数据加载到相应的建模工具可以访问的数据库中。\n\
  \n即使你有 `SAS` 作为公司主要的分析工具，你可能仍需要从 `SAS` 库中导出转换后的数据，并将其加载到可以其他 SAS 建模工具（如 `SAS Enterprise\
  \ Miner` 或 `SAS Viya`）访问的环境中。好消息是，由于这些都是 `SAS` 系统，通常不需要以 `CSV` 或 `txt` 等其他格式导出文件。所有\
  \ `SAS` 工具都可以导入 `SAS` 数据集。\n\n最后一点是，即使你已经完成了提取和转换步骤，并在你的 `SAS` 环境中继续构建和评估模型，你仍然需要将最终的模型输出导出（或加载）到一个可以利用你的模型输出的环境中。这高度取决于模型的业务目的。某些模型用于根据潜在客户申请产品的意愿进行评分，而另一些模型用于在申请点对客户进行评分。这是两个完全不同的环境，需要将模型加载到相应的环境中。\n\
  \n## 本章总结\n本章回顾了开发建模数据集时重要且耗时的问题。数据科学家彻底评估其数据集并针对该特定数据集进行适当转换至关重要。遗憾的是，没有一种标准方法可以适用于所有数据集。这就是为什么数据科学家不仅要了解如何执行数据转换的代码，还要了解这些转换的必要性，这非常重要。一旦你的数据集准备就绪，建模部分将变得更容易、更成功。\n\
  \n# 第 6 章：线性回归模型\n\n- 概述\n- 回归结构\n- 梯度下降\n- 线性回归假设\n- 线性关系\n- 多重正态性\n- 多共线性\n- 自相关性\n\
  - 同方差性\n- 线性回归\n- 分析目标变量\n- 分析预测变量\n- 简单线性回归\n- 多元线性回归\n- 多元线性回归方程\n- 简约多元回归模型\n\
  - 正则化模型\n- 岭回归\n- Lasso 回归\n- 本章总结\n\n## 概述\n在上中，我们回顾了 ETL 过程以及将原始数据集准备为建模数据集所需的所有数据转换。这一耗时的过程对于确保数据针对建模目的进行优化是必要的。原始数据可能充满了缺失值、离群值、高度相关的变量和连续类别等许多会导致任何建模算法性能不佳的问题。\n\
  \n我们在第 5 章中执行的许多数据转换专门与回归建模对齐。现在我们已经理解了 ETL 的理论和实践，下一步是进行一些实际建模。\n\n\n\n\n坦白说：线性回归模型是我最喜欢的预测模型类型。当有许多不同类型的复杂模型极其有趣且产生异常精确的模型结果时，这听起来可能很奇怪。相比之下，线性回归显得简单且过时。然而，线性回归模型是机器学习模型的基石。这些模型训练速度快，能够很好地处理高维数据，具有高度的可解释性。当开发得当时，这些模型通常可以与本书后面描述的更复杂的机器学习模型媲美。这些模型还具有透明性的额外优点，并为企业提供有关单个变量的信息，用于做出业务决策。\n\
  \n本章将回顾线性回归的结构和实现，并对其扩展，包含不同的回归方法以及如何使用这些方法。\n\n## 回归结构\n\n如果你还记得统计学 101 课程，你可能记得线性回归模型的基本结构。\n\
  \n### 方程 6.1：线性回归\n\n`Y ≈ β0 + β1 X1`\n\n该方程可以解释为：目标变量（`Y`）可以通过截距值（`β0`）与单个变量值（`X1`）乘以其系数（`β1`）的组合来近似确定（`≈`）。如果你从图形上观察它，该方程将表示为直线，其中截距值（`β0`）跨越\
  \ y 轴，单个变量（`β1`）在 x 轴上表示，而系数 `()` 决定了连接这两点的直线的斜率。\n\n图 6.1 应该看起来很。我们之前在第 1 章“数据科学概述”中用过它来演示两个变量之间的关系。\n\
  \n### 图 6.1：简单线性回归可视化\n\n![](img/Image730.png) ![](img/Image737.png)\n\n图 6.1 左侧的图显示了\
  \ FICO 分数的收入分布散点图。该图展示了预测变量（`Income`）与目标变量（`FICO score`）之间的正相关关系。尽管存在正相关关系，但并不是一对一的完美拟合关系。我们可以看到存在总体的上升趋势，但这两个变量之间看起来并不是完美匹配。\n\
  \n右侧的图显示了线性趋势线和误差棒，它们展示了线性模型的残差误差。你可以通过这些点画出许多不同的直线；然而，与数据拟合程度最好的线将是残差误差最小的那条线。残差误差是每个观测值与回归线之间距离平方值的和。方程\
  \ 6.2 代表残差平方和。\n\n![](img/Eq6.2.jpg)\n\n我们可以构建一个简单的线性回归来模拟这两个变量之间的关系。方程 6.3 表示 FICO\
  \ 分数与收入之间的关系。\n\n`FICO Score ≈ β0 + β1 (Income)`\n\n该方程简单地说明了 FICO 分数可以通过截距值以及个人收入乘以一个常数来近似确定。记住，FICO\
  \ 分数是由信贷机构创建的分数，根据几项个人财务指标（如信用历史、信用期限、开户账户数量以及其他几个财务指标）来代表客户风险。\n\n让我们来看一些实际值。表\
  \ 6.1 显示了一个代表个人年度收入及其相关 FICO 分数的数值表。图 6.2 的顶部图表以图形形式表示了此表。我们可以很容易地看到 FICO 分数与收入之间存在正相关关系。然而，我们可能想创建一个方程来模拟这种关系。如果我们拥有的信息只是某人的收入，这可以帮助我们估计该人的\
  \ FICO 分数。\n\n| 表 6.1 | |\n| 收入（千） | FICO 分数 |\n| :--- | :--- |\n| 2025322945384870656690729588711009512587113\
  \ | 525546545595610635643679585695716728745753770794805826838845 |\n\n| 图 6.2：收入和\
  \ FICO 表可视化![](img/Figure6.2.1.jpg)![](img/Figure6.2.2.jpg) |\n\n图 6.2 的底部图表显示了一条代表\
  \ FICO 分数与收入之间线性关系的线。方程 `y = 480 + 3.1(x)` 可以这样解释：一个人的 FICO 分数可以通过 `480` 加上 `3.1`\
  \ 乘以个人收入（以千美元为单位）的值来估计。\n\n让我们测试一下。我们可以查看表 6.1 中的数据，并应用从简单线性回归模型创建的方程产生估计值。表 6.2\
  \ 显示了每个观测值的模型结果和残差平方值。\n\n### 表 6.2：模型结果表\n\n| 收入（千） | FICO 分数 | 模型结果 | 平方差 |\n\
  | :--- | :--- | :--- | :--- |\n| 2025322990729588711009512587113 | 525546545595716728745753770794805826838845\
  \ | 542558579570759703775753700790775868750830 | 2891321,1706301,84961587004,886169301,7227,797216\
  \ |\n\n表 6.2 第三列中的模型结果是通过应用简单线性回归模型创建的。例如，第一行数据显示该观测值的收入为 `20`。我们可以将该值代入方程 `480\
  \ + 3.1(x)`，得到 `480 + 3.1(20)`。该方程的结果为 `542`。实际值表示在第二列中。\n\n## 梯度下降\n\n此时，你可能会问算法如何为线性回归模型选择一组特定的系数。在上例中，当算法产生方程\
  \ `y=480+3.1(x)` 时，它是如何得到这些值的？答案是梯度下降。\n\n梯度下降将误差指标相关的“越低越好”的概念的形式化。它是一种通用的优化算法，能够找到各种问题的最优解。这个概念非常简单但强大。首先，让我们定义一个重要的术语。\n\
  \n\n\n\n# 代价函数\n\n代价函数 – 衡量预测模型的性能。该函数量化了实际值与预测值之间的误差，并将其表示为单一指标。例如，残差平方和（`RSS`）是由代价函数产生的单一误差指标（等式\
  \ 6.2）。\n\n梯度下降是一种将代价函数应用于各种参数（对于线性回归，这些参数为 `β`）并调整这些参数的方法，以有规律地降低代价函数（`RSS`），直到无法进一步降低代价函数为止。\n\
  \n梯度下降算法通过循环一系列步骤来达到最终值。这些步骤概述如下：\n\n1. 梯度下降算法首先为 `β` 分配一个随机值。这被称为随机初始化。然后应用代价函数，并计算得误差指标（`RSS`）。\n\
  2. 梯度下降算法将为 `β` 分配一个新值并计算该值的误差指标。如果得到的新代价函数值高于上一个代价函数值，则认为这是一个较差的结果。请记住，越低越好。\n\
  3. 如果上一个结果较差且新值高于初始值，则梯度下降算法将为 `β` 分配一个较低的值并计算误差指标。然而，如果上一个结果较差且新值低于初始值，则梯度下降算法将为\
  \ `β` 分配一个较高的值并计算误差指标。这种方法是梯度下降决定向哪个方向（较高或较低）调整 `β` 值的方法。\n4. 如果新的误差指标低于之前的误差指标，则梯度下降将继续对\
  \ `β` 应用新值，该值比上值较高或较低，取决于较高或较低的值是否产生更好（较低）的误差指标。对 `β` 值调整的幅度被称为学习率。\n5. 当梯度下降算法无法找到更低的误差指标时，该过程停止。最小误差指标被称为收敛。\n\
  \n当我们从图形化的角度来看这一概念时，可以更好地理解。图 6.4 的左侧显示了 `β` 值与代价函数之间的关系。`β` 的初始随机值绘制在图表的左侧。随机值具有高\
  \ `RSS` 值并不令人意外。当对 `β` 应用一个新值时，相应的代价函数会降低。此过程将重复多次，直到确定一个能产生最小代价函数值的 `β` 值。\n\n\
  图 6.4 的右侧通过切线表达了相同的概念。初始随机值具有高斜率的切线。梯度下降这个短语意味着估计将沿着切线斜率小于之前估计的方向移动。这个过程将一直持续直到达到斜率为零。\n\
  \n## 图 6.4: 梯度下降可视化\n\n![](img/Image811.png)\n\n需要注意的一个关键点是，学习率决定了每次 `β` 值调整步长的大小。学习率的值对模型性能和结果产生显著影响。例如，如果学习率设置得太低，算法将经过多次迭代才能收敛到最终的最小代价函数值。这将显著影响运行模型的时间。图\
  \ 6.5 图形显示了小学习率的影响。\n\n## 图 6.5: 小学习率可视化\n\n![](img/Image819.png)\n\n当然，情况也可能相反，即学习率设置得太高。算法不是采取增量步，而是跨越代价曲线采取大步。这可能导致算法无法收敛到全局最小值。图\
  \ 6.6 图形描述了这一过程。\n\n## 图 6.6: 大学习率可视化\n\n![](img/Image826.png)\n\n让我们从理论转向实践。几页之前，在表\
  \ 6.2 中，我们展示了一个 FICO 和收入值表以及每对值对应的模型结果。该表是由简单的线性回归算法生成的，该算法产生了方程 `y=480+3.1(x)`。让我们看看幕后，确定算法是如何产生这个方程的。\n\
  \n| 请记住，梯度下降算法将为截距和直线斜率（`β`）提供一些初始随机值。算法将调整这些值，这些调整的大小被称为学习率。为了简化对这一过程的研究，我们只需关注对斜率的调整。表\
  \ 6.3 包含了梯度下降算法的结果，其中学习率被设置为每次迭代调整斜率一个点。所得的 `RSS` 值包含在表中。此表可以用图形化表示。图 6.7 绘制了每个斜率值对应的所得\
  \ `RSS` 值。 | 表 6.3: RSS 表 |\n\n| 系数 | RSS 值 |\n| :--- | :--- |\n| `β=7.1`, `β=6.1`,\
  \ `β=5.1`, `β=4.1`, `β=3.1`, `β=2.1`, `β=1.1`, `β=0.1`, `β=-0.1`, `β=-1.1` | 1,817,164,\
  \ 1,034,330, 475,949, 142,020, 32,543, 147,518, 486,944, 1,050,823, 1,190,533, 2,023,754\
  \ |\n\n## 图 6.7: RSS 表可视化\n\n![](img/Image869.png)\n\n如果斜率的初始随机值设置为 7.1，且学习率设置为每次迭代斜率值调整一个点，那么得到的梯度下降曲线将看起来像图\
  \ 6.7 的左侧。算法将从一个高 `RSS` 值开始，并进行有规律地降低 `RSS` 的调整。这个过程将一直持续直到达到全局最小值。在该点，对斜率的任何额外调整都不会降低\
  \ `RSS` 值。\n\n然而，如果学习率设置得太高，算法产生的结果将从图表的左侧跳到图表的右侧。这将是无效的，并可能导致不收敛。\n\n# 线性回归假设\n\
  \n线性回归模型并不适用于数据集。为了让线性回归模型正常运行，底层数据需要满足某些标准。通常情况下，底层数据不符合一项或多项要求，需要进行调整。\n\n1. 线性关系\n\
  2. 多变量正态性\n3. 低共线性或无共线性\n4. 无自相关\n5. 同方差\n\n## 线性关系\n\n每个独立变量（预测变量）都需要与因变量（目标）具有线性关系。评估两个数值变量之间关系的一种快速方法是在它们之间创建散点图。图\
  \ 6.8 展示了如何使用散点图评估因变量（`Y`）与独立变量（`X`）之间的关系。\n\n## 图 6.8: 数据分布\n\n![](img/Image8781.png)\n\
  \n图 6.8 中的第一个图显示了因变量和独立变量之间标准的线性关系。数据的总体趋势显示，随着独立变量（`X`）的增加，因变量（`Y`）减少。\n\n尽管图 6.8\
  \ 中的中间图显示了因变量和独立变量之间是非线性关系，但通过创建一个捕捉这两个变量之间动态关系的多项式变量，它仍可以用于线性回归。我们不是使用当前形式的 `X`\
  \ 变量，而是对该变量进行平方，以捕捉两个变量之间总体趋势的曲线。\n\n第三个图显示两个变量之间没有关系。该变量将不会被选取线性回归模型。\n\n## 多变量正态性\n\
  \n\n\n\n\n多元正态性假设认为所有变量都从正态分布。正态分布是一个钟形曲线，大多数观测值集中在均值附近。观测值距离均值越远，数量越少。图 6.9 显示了正态分布以及在一个、两个、三个标准差范围内的观测值数量。\n\
  \n图 6.9：正态分布曲线\n\n![](img/Image8851.png)\n\n可以通过直方图或 Q-Q 图直观检查多元正态性假设。也可以通过 Kolmogorov-Smirnov\
  \ 检验（KS 检验）从统计学角度检查正态性。通常，非正态分布变量可以通过非线性变换（如对数变换）转换为正态分布变量。\n\n## 多共线性\n\n共线性只出现在具有多个变量的算法中。因此，它不会出现在线性回归模型中。然而，对于包含多个变量的回归模型，当两个或多个解释变量之间存在高度线性相关时，就会产生共线性。\n\
  \n### 多共线性问题\n回归模型的主要目标是分离每个自变量（预测变量）与因变量（目标变量）之间的关系。回归模型中的每个系数代表了在保持其他其他变量不变的情况下，因变量变化一个单位时，自变量的平均变化。\n\
  \n多共线性问题在于，如果两个或多个变量之间高度相关，那么一个变量的变化必然意味着与其高度相关的另一个变量也发生了变化。这种相似性违反了变量之间的独立性假设。当存在共线性时，模型无法单独估计每个自变量与因变量之间的关系，因为高度相关的自变量倾向于同步变化。\n\
  \n### 多共线性的后果\n共线性会对你的模型估计和准确性产生严重影响：\n\n- 系数估计值可能会根据模型中包含的其他变量而发生巨大变化。这是因为共线性会增加系数估计的方差，并使估计对模型的微小变化非常敏感。模型将变得不稳定且难以解释。这种不稳定性是变量间不独立的确定信号。\n\
  - 共线的存在会降低系数估计的精确度。这削弱了模型的统计功效。P 值可能不再是统计显著性的有力指标，结果是你无法信任模型的输出。\n\n当存在共线性时，你无法独立地评估模型中的每个变量。一个变量的微小变化可能会导致另一个变量的巨大变化。这甚至可能导致系数估计值的符号从正变为负。由于方差膨胀导致\
  \ P 值减弱，你甚至无法确定给定变量是否应该保留在模型中。\n\n### 如何检测共线性\n你可以使用 `REG` 过程中提供的某些检验来检测共线性。该过程具有生成以下检验的选项：相关矩阵（`COLLIN`）、容差（`TOL`）和方差膨胀因子（`VIF`）。\n\
  \n- **相关矩阵**：`PROC REG` 中的 `COLLIN` 选项可以生成 Pearson 相关系数矩阵，其中包含数据集中每对变量的相关系数。相关系数需要小于\
  \ 1 才能保留在建模数据集中。检查模型中任何地方是否存在共性的良好全局方法是评估 `COLLIN` 选项产生的条件指数。如果任何变量的条件指数大于 30，则数据中一定存在共线性。\n\
  - **方差膨胀因子**：该检验衡量了由于模型中其他独立变量导致自变量方差的增加情况。该检验通过 `PROC REG` 中的 `VIF` 选项产生。虽然设置 `VIF`\
  \ 阈值的标准因项目而异，但一个经验法则是模型中每个变量的 `VIF` 应该小于 5。\n- **容差**：容差是每个自变量中未被所有其他自变量解释的方差比例。该检验通过\
  \ `PROC REG` 中的 `TOL` 选项产生。容差定义为 `1/VIF`。\n\n### 如何修复共线性\n简单的方法是移除高 `VIF` 值的变量。我建议首先移除\
  \ `VIF` 值最大的变量，然后重新运行模型。新模型将为剩余变量重新计算 `VIF` 值。逐个移除每个超过 `VIF` 阈值的变量，直到你获得一个所有变量的\
  \ `VIF` 值都低于你的阈值的数据集。\n\n处理共线性的另一种方法是通过数据中心化来转换数据。这种方法简单地计算每个自变量的均值，然后从该变量的每个观测值中减去均值。这些新“中心化”的变量被用于模型。这种方法在\
  \ SAS 中可以通过 `PROC STDIZE` 轻松实现。\n\n## 自相关\n\n自相关通常是时间序列数据中的问题。当残差之间互不独立时，就会发生自相关。在时间序列数据中，一个时间段的误差与上一个时间段的误差相关是常见的。这是一种滞后相关的形式。自相关的存在会大幅降低模型的准确性。\n\
  \n### 自相关问题\n残差之间的正自相关会导致误差方差估计过小。当误差方差错误地过小时，会导致置信区间过窄，拒绝真实零假设的概率更高。\n\n残差之间的负自相关会导致误差方差过大，导致置信区间过宽。发生这种情况时，显著性检验的功效会降低。\n\
  \n### 如何检查自相关\n残差散点图可以显示自相关模式。这种残差散点图应该是随机的，没有明显的模式。如果存在自相关，你通常会在残差中看到 U 形模式或其他曲线模式。\n\
  \n检查自相关的最佳方法是 Durbin-Watson D 检验。这可以通过 `PROC REG` 中的 `DW` 选项产生。该检验会产生一个 0 到 4 之间的值。2\
  \ 左右的值（1.5 到 2.5 之间）表示不存在自相关。\n\nDurbin-Watson D 用于检测一阶自相关。一阶意味着间隔一个单位的观测之间是相关的。虽然\
  \ Durbin-Watson D 设计并非用于检测二阶自相关，但该检验能够充分检测大多数自相关情况，因为大多数形式的自相关都表现出某种形式的一阶自相关。\n\n\
  ### 如何修复自相关\n自相关通常是模型中缺少相关的自变量的结果。因此，你首先应该做的是考虑模型中的变量，并试图弄清楚还有哪些缺失的信息可以解释因变量的变异。\n\
  \n\n\n\n如果你无法获取更多数据，那么第二种方法是对数据应用不同的建模技术。这通常是针对时间序列的模型，例如自回归模型。SAS 拥有一系列时间序列模型可用于处理自相关问题。我最喜欢的模型之一是\
  \ `AUTOREG` 过程。\n\n## 同方差\n\n同方差是一个高级的说法，意味着回归线周围的方差应该保持恒定。图 6.10 显示了单个预测变量（`X`）和目标值（`Y`）的示例图。注意，回归线起点和终点的观测值到回归线的距离大致相等。然而，中间的观测值显示出离回归线的巨大方差。\n\
  \n### 图 6.10：同方差可视化\n\n![](img/Image8931.png)\n\n回归线周围的“噪声”应该是一致的。当预测变量的方差不一致时，这被称为异方差性。\n\
  \n### 异方差问题\n普通最小二法回归模型的目标是最小化残差，以产生尽可能小的标准误差。回归模型对所有观测值赋予相同的权重；然而，当存在异方差时，离回归线较远的观测值对模型的影响比靠近回归线的观测值更大。这可能导致标准误差产生偏差，从而导致对回归系数显著性得出错误的结论。\n\
  \n### 如何检查异方差性\n有三种检查异方差性的主要方法：\n\n*   **White 检验 (White test)** —— `White` 检验的逻辑有点复杂，但基本上，它提取原始回归模型的残差平方，并将其作为额外的预测变量与原始自变量一起输入第二个回归模型中。该理论是，如果存在异方差性，那么新回归模型中的系数不应为零，且\
  \ `R2` 值将很大。\n\n在 SAS 的几个不同建模过程中，可以使用 `(WHITE)` 选项调用 `White` 检验。零假设是模型误差是同方差的。模型输出将包含一个标题为“异方差检验”的表格，该表将有一个\
  \ P 值。该 P 值可用于接受/拒绝同方差的零假设。\n\n*   **Breusch-Pagan 检验 (Breusch-Pagan test)** ——\
  \ 该检验与 `White` 检验非常相似，首先创建一个初始回归模型，并将该模型的残差输出作为预测变量，与原始自变量一起输入第二个回归模型中。整体模型的 P 值（通常在\
  \ ANOVA 模型输出中）用于确定是否应该拒绝零假设（模型误差是同方差的）。\n\n在 SAS 的几个不同建模过程中，可以使用 `(BREUSCH)` 选项调用\
  \ `Breusch-Pagan` 检验。\n\n*   **拉格朗日乘子检验 (Lagrange Multiplier test)** —— 该检验与 `White`\
  \ 和 `Breusch-Pagan` 检验类似。该检验根据受限模型的残差测试横面效应或时间效应。它通常与 `Breusch-Pagan` 检验结合使用。由于其能够检测时间序列数据的影响，它最常用于\
  \ `PROC AUTOREG` 等时间序列模型。\n\n`(GARCH)` 和 `(ARCHTEST)` 选项最常测试时间序列数据中的序列相关。\n\n###\
  \ 如何修复异方差\n异方差有两种常见的解决方法：\n\n*   **Box-Cox 变换 (Box-Cox transformation)** —— 你可以通过\
  \ Box-Cox 变换转换因变量（`Y`）来解决异方差问题。这是将变量转换为正态分布的方法。SAS 提供了通过 `TRANSREG` 过程实现 Box-Cox\
  \ 的简单方法。\n\n*   **加权最小二法 (Weighted Least Squares)** —— 记住，异方差的核心问题在于由于某些变量方差增加，它们在模型中具有更大的影响（或权重）。你可以按照以下步骤手动计算权重：\n\
  \    1. 使用目标变量和显示异方差的预测变量创建一个初始简单线性回归模型。\n    2. 计算该模型残差的绝对值。\n    3. 创建第二个简单线性回归模型，将预测变量对新创建的残差绝对值变量进行回归。\n\
  \    4. 使用估计的标准差计算权重。\n\n程序 6.1 显示了该过程每一步的示例。\n\n```\n/*创建初始简单线性回归模型*/\nPROC REG\
  \ DATA=example;\nMODEL Y=X;\nOUTPUT OUT=pred RESIDUAL=RESID;\nRUN;\n```\n\n```\n\
  /*计算残差的绝对值*/\nDATA abs_resid;\nSET pred;\nabsresid = ABS(RESID);\nRUN;\n```\n\n\
  ```\n/*创建另一个简单线性回归模型*/\n/*将 X 对残差的绝对值进行回归*/\nPROC REG DATA=abs_resid;\nMODEL absresid\
  \ = X;\nOUTPUT OUT=abs_weights PREDICTED=abs_hat;\nRUN;\n```\n\n```\n/*使用估计的标准差计算权重*/\n\
  DATA weights;\nSET abs_weights;\nweight = 1/(abs_hat**2);\nRUN;\n```\n\n*   **使用新预测变量重新构建模型**\
  \ —— 重新开始始终是最后的选择；然而，有时如果其他方法都失败了，你可能需要根据新的属性重新构思你的项目。\n\n## 线性回归\n\n简单线性回归是我们可以开发的最基础参数模型。该模型只有两个组件：目标变量和单一预测变量。这个简单的结构可以扩展以创建非常复杂的模型设计。然而，让我们从基础简单线性回归开始，并在后续章节中增加其复杂性。\n\
  \n\n\n\n请记住，我们在第 5 章“创建建模数据集”中，已经将原始 Lending Club 数据集转换为完全调整的建模数据集。该数据集通过将缺失值替换为相应的平均值，并根据\
  \ 1.5 IQR 规则对离值进行封帽处理而完成。由于这些转换，当我们检查数据的摘要统计结果和图表时，预计会出现某种不自然的限制。\n\n输出 6.1 显示了\
  \ `revol_bal` 变量的 `PROC UNIVARIATE` 输出。\n\n输出 6.1：程序 6.2 的结果\n\n![](img/Image901.png)\n\
  \n![](img/Image908.png)\n\n数据的转换导致了一个不自然的模式，其中前 10% 的观测值具有相同的值 (32713.5)。这是因为根据\
  \ 1.5 IQR 规则，前 10% 的数据被视为离值，并被封帽在该值上。\n\n由于 `revol_bal` 变量将作为该模型的目标变量，我们需要决定如何处理该变量。该变量的当前分布如输出\
  \ 6.2 所示。\n\n输出 6.2：目标变量直方图\n\n![](img/Image9181.png)\n\n我们可以清楚看到，前 10% 的值都已封帽在一个常数上，这导致了数据的偏态表示。从此图中可能很难看出，但低端离值也被封帽为零（没有负值）。\n\
  \n当变量作为预测因子时，这些人工限制可以帮助模型；然而，我们必须格外谨慎地处理目标变量，因为所有的预测变量都试图与目标变量建立相关性。\n\n| ![](img/Image1117.png)\
  \ | 在这种情况下，我建议将数据集限制在 `revol_bal` 变量介于 10 到 30000 之间的观测值。这种限制将避免变量转换带来的任何后果，一旦模型完成，我们能够对这些\
  \ 30000 以上的值进行模型性能测试。 |\n\n程序 6.3 将数据限制在 `revol_bal` 在 10 到 30000 之间的观测值，并对这个新的限制数据集创建\
  \ `PROC UNIVARIATE`。\n\n```\nDATA base_reg;\nSET MYDATA.MODEL_TRAIN;\nWHERE 10 le\
  \ revol_bal le 30000;\nRUN;\nPROC UNIVARIATE DATA=base_reg;\nVAR revol_bal;\nHISTOGRAM;\n\
  RUN;\n```\n\n输出 6.3 显示了根据新的限制数据集创建的 `revol_bal` 变量直方图。\n\n输出 6.3：目标变量修订直方图\n\n![](img/Image9701.png)\n\
  \n关于新的限制数据集和目标变量 `revol_bal` 的分布，有几点注意：\n\n- 目标变量范围相当广泛，从 10 到 30,000 不等。\n- 分布呈现轻微右偏。\n\
  - 目标变量的平均值为 11,293，但观测值最大的比例出现在 `revol_bal` 为 6,000 左右。\n\n由于分布向右倾斜，这被称为正偏数据。正偏数据的转换方法包括对数转换、平方根转换和立方根转换。\n\
  \n如果数据向左倾斜，则被视为负偏数据，可以使用平方（不是平方根）、立方根和对数转换进行处理。\n\n经过一些实验，平方根方法似乎是将目标变量调整为正态分布的最佳转换方法。程序\
  \ 6.4 显示了转换过程，输出 6.4 显示了结果直方图。\n\n程序 6.4：转换目标变量\n\n```\nDATA base_reg;\nSET MYDATA.MODEL_TRAIN;\n\
  WHERE 10 le revol_bal le 30000;\nsqrt_revol_bal = sqrt(revol_bal);\nDROP revol_bal;\n\
  RUN;\nPROC UNIVARIATE DATA=base_reg;\nVAR sqrt_revol_bal;\nHISTOGRAM;\nRUN;\n```\n\
  \n输出 6.4：转换后的目标变量直方图\n\n![](img/Image978.png)\n\n尽管新转换的目标变量具有轻微的负偏，但我们可以看到，它比原始变量更接近于正态分布。\n\
  \n## 分析预测变量\n\n现在我们已经选择了目标变量、限制了数据集并将目标变量转换为正态分布，现在可以继续分析预测变量了。在第 5 章中，我们将所有字符变量转换成了这些变量的数值表示。这些转换将使开发回归模型变得简单得多，因为我们不需要单独分析字符变量，也不必担心回归模型中这些字符变量的自由度。\n\
  \n### 连续变量\n\n尽管我们的数据集中有很多连续变量，但我们只想保留那些符合我们业务标的变量。例如，如果我们保留了预测变量 `revol_util`（定义为“循环贷额度利用率”），这将违背模型的初衷。我们正试图寻找与目标变量独立但又与目标变量相关的预测因子。某些变量（如\
  \ `revol_util`）只是目标变量的不同表达方式。如果我们保留该变量，它将几乎是一个预测因子，但无法获得任何新信息。\n\n| ![](img/Image1117.png)\
  \ | 数据科学家通常需要决定将哪些变量包含在集中。并非所有的变量都适用于模型的业务目的。 |\n\n不应包含在建模数据集中的变量包括：\n\n- 目标变量的不同表达方式\n\
  - 会导致虚假相关性的变量\n- 在模型实施时不可用的变量\n- 对业务决策没有用的变量\n\n我知道许多教程都说你可以包含所有变量并让建模算法选择显著性变量。虽然这是构建模型的方法之一，但这种方法的风险在于，你最终可能会得到一个毫无意义、无法解决业务问题且无法实施的模型。考虑到这一点，我们将选择一些合适的变量保留在建模数据集中，并定义保留它们的业务理由。表\
  \ 6.4 显示了我们将保留的连续变量。\n\n表 6.4：保留的建模变量\n\n| 变量 | 描述 | 业务理由 |\n| --- | --- | --- |\n\
  | `annual_Inc` | 借款人在注册期间提供的的年收入 | 财务状况指标 |\n| `bc_Util` | 所有银行卡账户总余额与高额额度的比例 |\
  \ 信用利用率指标 |\n| `dti` | 使用借款人每月债务总额除以自报月收入计算的比例 | 财务状况指标 |\n| `loan_Amnt` | 借款人申请的贷款金额\
  \ | 总债务 |\n| `mths_since_oldest_il_open` | 从开设第一个分期贷款账户以来月数 | 信用时长指标 |\n| `mths_since_recent_bc`\
  \ | 从最近开设银行卡账户以来月数 | 寻求信用行为指标 |\n| `pct_tl_nvr_dlq` | 从未违约的交易百分比 | 信用稳定性指标 |\n|\
  \ `tot_hi_cred_lim` | 总高额信用额度 | 整体信用强度指标 |\n\n\n\n\n\n让我们检查这些变量及其与目标变量之间的关系。程序 6.5\
  \ 开发了一个名为 `cont` 的全局变量和一个宏，该宏将遍历此变量列表并创建每个变量与目标变量之间的散点图。我只保留了 5000 个观测值，以便散点图看起来不会过于拥杂。\n\
  \n### 程序 6.5：连续变量散点图宏\n\n```\n%let cont = annual_inc bc_util dti loan_amnt mo_sin_old_il_acct\
  \ mths_since_recent_bc pct_tl_nvr_dlq tot_hi_cred_lim        total_bc_limit total_rec_int;\n\
  ```\n\n```\n%MACRO loopit(mylist);\n %LET n = %SYSFUNC(countw(&mylist));\n %DO I=1\
  \ %TO &n;\n %LET val = %SCAN(&mylist,&I);\n proc sgplot data=base_reg (obs=5000);\n\
  \ SCATTER X=&val.\n Y=sqrt_revol_bal;\n RUN;\n %END;\n%MEND;\n%LET list = &cont.;\n\
  %loopit(&list);\n```\n\n让我们查看宏输出的几个示例。输出 6.5 显示了三个连续变量与目标变量的绘图结果。\n\n### 输出 6.5：连续变量的散点图\n\
  \n| ![](img/Image1041.png) | ![](img/Image1050.png) |\n| ![](img/Image1059.png)\
  \ |  |\n\n我们可以看到，前两个散点图与目标变量之间存在正相关，且这种关系看起来是凹性的。这可能是由于目标变量通过平方根函数转换的结果。右侧的最后一个图似乎没有显示预测变量与目标变量之间存在关系。\n\
  \n根据散点图中显示的观测值分布，我们可以推断出简单的线性模型将产生偏态残差。直接穿过前两个预测变量之一的线性回归线将导致 U 型残差图。因此，我们可以尝试使用某种方法转换预测变量，使目标变量与预测变量之间产生线性关系。\n\
  \n程序 6.6 为其中两个预测变量开发了平方根转换。所有变量的完整代码包含在 GitHub 仓库中。\n\n### 程序 6.6：预测变量的转换\n\n```\n\
  data change;\nset base_reg;\n sqrt_annual_inc = sqrt(annual_inc);\n sqrt_bc_util\
  \ = sqrt(bc_util);\nrun;\n```\n\n我们现在可以为新转换的连续变量平方根版本创建一个全局宏，并在新数据集上运行该宏。\n\n###\
  \ 程序 6.7：转换后预测变量的散点图宏\n\n```\n%let trans = sqrt_annual_inc sqrt_bc_util sqrt_dti\
  \ sqrt_loan_amnt sqrt_mo_sin_old_il_acct sqrt_mths_since_recent_bc sqrt_pct_tl_nvr_dlq\
  \ sqrt_tot_hi_cred_lim sqrt_total_bc_limit         sqrt_total_rec_int;\n%MACRO loopit(mylist);\n\
  \ %LET n = %SYSFUNC(countw(&mylist));\n %DO I=1 %TO &n;\n %LET val = %SCAN(&mylist,&I);\n\
  \ proc sgplot data=change (obs=5000);\n SCATTER X=&val.\n Y=sqrt_revol_bal;\n RUN;\n\
  \ %END;\n%MEND;\n%LET list = &trans.;\n%loopit(&list);\n```\n\n让我们检查之前研究的相同变量的散点图。输出\
  \ 6.6 显示了与输出 6.5 相同的变量平方根版本。\n\n### 输出 6.6：转换后预测变量的散点图\n\n| ![](img/Image1085.png)\
  \ | ![](img/Image1097.png) |\n| ![](img/Image1113.png) |  |\n\n注意前两个散点图如何显示与目标变量的线性关系，而第三个散点图显示目标与预测变量之间没有关系。\n\
  \n### 间距变量\n\n间距变量是整数数值变量（0、1、2、3 等）。这类数据不适用于散点图分析。相反，我们可以开发箱线图来直观检查数据。程序 6.8 识别适用于建模的变量，并创建一个宏，为这些每个变量生成箱线图。\n\
  \n### 程序 6.8：间距变量的箱线图宏\n\n```\n%let box = acc_open_past_24mths app_individual app_joint\
  \ emp_10 emp_0to4 emp_5to9 emp_NA grade_A grade_B grade_C grade_D grade_E grade_F\
  \ grade_G home_mort home_own home_rent    inq_last_6mths int_rate mo_sin_rcnt_tl\
  \ months_since_issue mort_acc mths_since_recent_inq;\n%MACRO loopit(mylist);\n %LET\
  \ n = %SYSFUNC(countw(&mylist));\n %DO I=1 %TO &n;\n %LET val = %SCAN(&mylist,&I);\n\
  \ proc sort data=base_reg out=temp by=&val; run;\n data temp; set base_reg; run;\n\
  \ proc boxplot data=temp var=&val;\n vaxis sqrt_revol_bal;\n quit;\n %END;\n%MEND;\n\
  %LET list = &box;\n%loopit(&list);\n```\n\n\n\n\n\n- `PLOTS` 选项被设置为 `ALL`。此设置将为我们提供与\
  \ `REG` 过程相关的所有可用图表。\n- `MODEL` 语句中的第一个项是目标变量（`sqrt_revol_bal`）。预测变量出现在等号之后。\n-\
  \ `SLE` 选项指定了变量进入模型的显著性水平。\n- `SLS` 选项指定了保留在模型中的显著性水平。对于简单线性回归模型，此选项并非必需的，但当我们开始向模型中添加变量以创建多元线性回归模型时，它变得非常重要。\n\
  - `INCLUDE` 语句指定模型应该包含截距值。\n- `OUTPUT` 语句创建一个输出数据集。我还指定了我想保留 `PREDICTED`（预测值）和 `RESIDUAL`（残差）值。\n\
  \n输出 6.8 包含了由简单线性回归生成的输出。该输出显示预测变量 `sqrt_total_bc_limit` 与目标变量之间显著相关。\n\n### 输出\
  \ 6.8：简单线性回归输出\n\n![](img/Output6.8.jpg)\n\n#### 方差分析 (Analysis of Variance)\n输出\
  \ 6.8 显示了 `PROC REG` 模型的摘要统计数据。在方差分析部分，测试了预测变量与目标变量之间没有显著相关的零假设。P 值小于 0.05 则拒绝该零假设。\n\
  \n#### 误差指标 (Error Metrics)\n摘要统计数据输出的下一部分显示 `RMSE` 值为 32.23。这个值本身意义不大，但当我们将此模型与其他更复杂的模型进行比较时，我们可以使用此值作为基准。\n\
  \n该部分还包含 `R2` 值。`R2` 指标代表模型解释观测值变异的百分比。使用该指标来评估你的模型是非常吸引人的，因为它直观易懂。然而，`R2` 指标存在固有问题：\n\
  \n- 当你向模型中添加更多预测变量时，`R2` 指标总是增加。即使这些预测变量是与目标变量无关的随机也是如此。\n- `R2` 指标可能会误导模型的强度。它不衡量拟合优度，当模型完全正确时，它可能会人为偏低。如果数据的标准差很大，即使模型设定正确，较大的标准差也会驱动\
  \ `R2` 趋于零。\n- `R2` 指标可能会人为偏高，即使在模型是错误的情况下也是如此。这通常发生在数据明显为非线性的情况下，如数据的散点图所示。穿过数据的直线可能会捕捉到许多观测值并产生高额的\
  \ `R2` 值，但最合适的模型将是非线性方法。\n- 如果你改变了预测变量的范围，它对 `R2` 值可能会产生巨大影响。\n\n#### 参数估计 (Parameter\
  \ Estimates)\n`PROC REG` 摘要统计的最后一部分是参数估计部分。当我们谈论“模型”时，指的就是这一部分。该部分包含了线性回归方程的所有值。记住简单线性回归模型的基本结构是：\n\
  \n`Y ≈ β0 + β1X`\n\n现在，我们可以将一些真实的变量和数值加入这个通用方程中：\n\n`sqrt_revol_bal ≈ 49.37 + sqrt_total_bc_limit(0.3656)`\n\
  \n该方程可以解释为：当预测变量增加 1 时，预测目标变量 `sqrt_revol_bal` 增加 0.3656。此外，如果预测变量为 0，则目标变量为 49.37。由于这些变量是以平方根形式表示的，可以通过对平方根值取指数来轻松转换回原始值。\n\
  \n输出 6.9 显示了当 `ODS` Graphics 设置为 `ON` 时 `REG` 过程生成的图形输出。\n\n### 输出 6.9：sqrt_revol_bal\
  \ 的拟合诊断\n\n![](img/Image1257.png)\n\n该输出提供了大量的模型输出可视化结果，重点是残差的分布。\n\n- 左上角的图表显示残差随预测值的分布。残差呈随机分布，这告诉我们平方根变换是合适的。\n\
  - 左中间的图表是 Q-Q 图。该图用于检查预测变量是否符合正态分布。实际分布与理论（正态）分布进行对比。如果生成的图形是直线，意味着实际值与理论值是对齐的；但如果生成的图形是曲线，则表明预测变量偏态。\n\
  - 左下角的图表显示残差的分布。你希望它看起来像正态分布。\n- 中间的图表显示了预测值相对于目标值的分布。尽管我们看到数据在高端被人为限制，但数据的分布是随机的。\n\
  - 右中间显示的是 Cook's D 图。这显示了相对于预测变量而言对模型有显著影响的观测值。\n- 输出的右下部分显示了模型输出的摘要。虽然此输出提供了模型指标的快速查看，但最好查看模型摘要统计中方差分析和误差指标部分包含的信息来评估你的模型。记住，你不应该用该指标来评估模型拟合情况。在连续线性回归模型的情况下，均方根误差\
  \ (`RMSE`) 是一个更好的指标。\n\n#### 模型评估 (Model Evaluation)\n到此时，我们已经在样本上开发了简单线性回归（记住我们只选择了\
  \ 5000 个观测值），并评估了 `TRAIN` 数据集。但记住，最终的模型评估是在测试数据集上进行的。因此，我们还需要执行几个步骤：\n\n- 我们需要在完整的训练数据上上重建模型。\n\
  - 我们需要以相同的方式调整测试数据集。\n- 我们将完整线性回归模型应用到测试数据集并评估结果。\n\n程序 6.10 在完整数据集上创建简单线性回归。由于我们已经确定变量\
  \ `sqrt_total_bc_limit` 是显著的，我们可以精简代码。\n\n### 程序 6.10：完整数据集上的简单线性回归\n\n```\nPROC\
  \ REG OUTEST=RegOut;\nMODEL sqrt_revol_bal = sqrt_total_bc_limit / SELECTION=STEPWISE;\n\
  OUTPUT OUT=WORK.REG_PRED PREDICTED=P RESIDUAL=R;\nRUN;\n```\n\n与原始程序 6.10 代码相比有两个重要变化：\n\
  \n- 模型是在完整的调整训练总体上开发的。之前的简单线性回归模型是在 5000 个观测值的样本上开发的，以让我们了解目标与预测变量之间的关系。完整模型是在 300,000\
  \ 个观测值的数据集上开发的。\n- `PROC REG` 中有一个新选项 `OUTEST`。该选项创建一个包含预测变量估计值以及模型截距和一些摘要统计输出数据集。我们将使用此输出数据集应用于测试数据集。\n\
  \n\n\n\n\n```\n sqrt_revol_bal = sqrt(revol_bal);\n```\n\n```\n sqrt_annual_inc\
  \ = sqrt(annual_inc);\n```\n\n```\n sqrt_bc_util = sqrt(bc_util);\n```\n\n```\n\
  \ sqrt_dti = sqrt(dti);\n```\n\n```\n sqrt_loan_amnt = sqrt(loan_amnt);\n```\n\n\
  ```\n sqrt_mo_sin_old_il_acct = sqrt(mo_sin_old_il_acct);\n```\n\n```\n sqrt_mths_since_recent_bc\
  \ = sqrt(mths_since_recent_bc);\n```\n\n```\n sqrt_pct_tl_nvr_dlq = sqrt(pct_tl_nvr_dlq);\n\
  ```\n\n```\n sqrt_tot_hi_cred_lim = sqrt(tot_hi_cred_lim);\n```\n\n```\n sqrt_total_bc_limit\
  \ = sqrt(total_bc_limit);\n```\n\n```\n sqrt_total_rec_int = sqrt(total_rec_int);\n\
  ```\n\n```\nRUN;\n```\n\n该程序创建了一个 `TEST` 数据集，其中观测值限制在循环余额介于 10 到 30000 之间的案例。对于剩余观测值，连续变量通过平方根函数进行了转换。\n\
  \n现在我们已经有了一个模型和一个适用于该模型集，我们需要做的就是使用简单线性回归模型对这个新数据集进行评分并评估结果。程序 6.12 执行了这三个任务。\n\n\
  ### 程序 6.12：将简单线性回归模型应用于 TEST 数据集\n\n```\nPROC SCORE DATA=test_reg SCORE=RegOut\
  \ OUT=RScoreP TYPE=parms;\n```\n\n```\n var sqrt_total_bc_limit;\n```\n\n```\nRUN;\n\
  ```\n\n```\n/*为 TEST 数据集计算 RMSE */\nDATA eval;\n SET RScoreP;\n RESIDUAL = (MODEL1-sqrt_revol_bal)**2;\n\
  \ sqrt_residual = sqrt(residual);\n KEEP row_num model1 sqrt_revol_bal residual\
  \ sqrt_residual;\nRUN;\n\nPROC MEANS DATA=eval N MEAN;\n VAR RESIDUAL sqrt_residual;\n\
  RUN;\n```\n\n#### 关于程序 6.12 的说明：\n\n- `PROC SCORE` 用于将包含在 `RegOut` 数据集中模型结果应用于新调整的名为\
  \ `test_reg` 的 `TEST` 数据集。`PROC SCORE` 代码输出一个名为 `RScoreP` 的评分数据集，其中包含 `TEST` 数据集中的所有观测值以及一个新变量\
  \ `MODEL1`。这是每个观测值的模型估计值。\n- `DATA` 步通过应用简单公式取预测值（`MODEL1`）与实际值（`sqrt_revol_bal`）之差的平方来创建平方根值。下一步是取该值的平方根。\n\
  - 最后一步是 `PROC MEANS`，它简单地计算了 `sqrt_residual` 值的平均值。这为我们提供了均方根误差（RMSE）。\n\n此评估过程得输出\
  \ 6.10 中包含的指标。\n\n### 输出 6.10：评估过程的结果\n\n![](img/Image1265.png)\n\n![](img/Image1274.png)\n\
  \n![](img/Image1286.png)\n\n![](img/Image1299.png)\n\n输出 6.10 的前三个部分显示了在完整数据集上开发的简单线性回归的方差分析和模型指标输出。输出的最后部分包含由\
  \ `MEANS` 过程生成的 RMSE 值。简单线性回归模型在留出的 `TEST` 数据集上的 RMSE 为 24.24。我们将使用此值作为基准指标来与更复杂的模型进行比较。\n\
  \n### 多元线性回归\n\n对简单线性回归结构和输出的回顾为我们如何将回归应用于实际数据以及输出的样貌提供了良好的基础。然而，在业务决策中，你很少会在回归模型中使用单个预测变量。简单线性回归方法提供了一个评估单个变量并理解其与目标变量关系的极佳方法；但是，我们需要探索整合多种变量的方法，每个变量都与目标变量相关，并让它们协同工作讲述关于数据的完整故事。欢迎来到多元线性回归。\n\
  \n#### 多元线性回归方程\n\n多元线性回归的基本方程只是简单线性回归的扩展。方程仍然说明目标变量（`Y`）近似建模为（`≈`）截距值（`β0`）加上单个变量（`X1`）的值乘以其系数（`β1`）。\n\
  \n简单线性回归方程的扩展仅仅是在模型中添加了预测变量及其相关系数。因此现在，我们不仅有（`β1 * X1`），方程中还包含几个额外的预测变量以及一个误差项（`ε`）：\n\
  \n**方程 6.4：多元线性回归方程**\n\n`Y ≈ β0 + β1 X1 + β2 X2 + β3 X3… + βp Xp + ε`\n\n现在我们已经理解了多元线性回归模型的基本结构，让我们将其付诸实践。程序\
  \ 6.13 使用 `PROC REG` 在“change”数据集上开发了一个多元线性回归模型。记住，该数据集由我们第 5 章建模数据集中的变量子组成，并且通过平方根函数对某些变量进行了转换。\n\
  \n#### 程序 6.13：多元线性回归\n\n```\nODS GRAPHICS ON;\nPROC REG DATA=change (obs=5000)\
  \ PLOTS(ONLY)=ALL;\nMODEL sqrt_revol_bal = &trans. &box / SELECTION=STEPWISE COLLIN\
  \ VIF;\nOUTPUT=WORK.REG_PRED=P RESIDUAL=R;\nRUN;\n```\n\n#### 关于程序 6.13 的说明：\n\n\
  - 用于简单线性回归的 `PROC REG` 相同结构用于多元线性回归。\n- 全局变量 `&trans` 和 `&box` 用于指定预测变量。记住 `trans`\
  \ 包含通过平方根函数转换的变量列表，`box` 包含间距变量列表。\n- `SELECTION` 语句指定使用 `STEPWISE` 建模过程。该语句的选项有\
  \ `FORWARD`、`BACKWARD` 和 `STEPWISE`。该语句指的是变量如何添加到模型。\n    - `FORWARD` 选项从单个变量开始，对其进行评估并决定是否将其保留在模型中。一旦做出决定，算法将评估下一个变量并处理整个列表。\n\
  \    - `BACKWARD` 选项从模型中的所有变量开始，每次决定剔除哪些。\n    - `STEPWISE` 选项类似于 `FORWARD` 选项，每次添加一个变量。但在每次变量评估迭代中，算法都会评估已保留的每个变量，并决定是否将其留在模型中。\n\
  - 因此，`FORWARD` 和 `STEPWISE` 选择方法的区别在于，一旦使用 `FORWARD` 方法添加变量，它将留在模型中。而使用 `STEPWISE`\
  \ 方法添加变量时，由于新变量包含的信息，它可能会在过程后期被剔除。\n- 模型包含 `COLLIN` 语句以评估模型的共线性。\n- 模型包含 `VIF` 语句以创建方差膨胀因子指标。\n\
  \n\n\n\n摘要统计输出的下一部分显示 RMSE 值为 `19.98`。当我们将此值与上一节中简单线性回归模型生成的 RMSE（`RMSE: 32.23`）进行比较时，可以看到新模型生成的\
  \ RMSE 几乎减少了 40%。由于我们从额外变量中获得了所有这些新信息，预测准确性得到了大幅提升。\n\n## 参数估计\n\n`Parameter Estimates`（参数估计）部分显示，有\
  \ 19 个变量达到了保留在模型中的临界显著性水平。虽然没有硬性规定来规定模型中应该保留多少变量，但我们可以评估模型输出，并确定每个变量对最终模型贡献的程度。输出\
  \ 6.12 显示了从模型生成的两项信息。\n\n### 输出 6.12：从模型生成的新信息\n\n![](img/Image1446.png)\n\n![](img/Image1453.png)\n\
  \n输出 6.12 上方的表格显示了每个变量进入模型的顺序。该顺序由添加特定变量后模型值的整体影响决定。底部的图表显示了多个模型指标中添加每个变量的图形化表示。\n\
  \n`Fit Criteria`（拟合标准）图表显示，进入模型的前五个变量模型提高了模型准确性。接下来的五个变量显示出额外的边际收益。其余变量在统计学上是显著的，但它们没有为模型提供太多的预测权重。\n\
  \n我们可以利用这些信息选择一个变量子集，以最少的变量提供最大级别的预测准确性。这种方法被称为精简建模（parsimonious modeling）。\n\n\
  ## 精简多线性回归模型\n\n根据我们在输出 6.12 中获得的信息，我们可以非常有心地选择前十个变量，并使用它们作为预测变量输入到新模型。程序 6.14 显示了精简模型的代码。\n\
  \n### 程序 6.14：精简线性回归\n\n```\nODS GRAPHICS ON;\n```\n\n```\nPROC REG DATA=change\
  \ (obs=5000) PLOTS(ONLY)=ALL;\n```\n\n```\nMODEL sqrt_revol_bal = sqrt_total_bc_limit\
  \ sqrt_bc_util\n```\n\n```\nopen_acc sqrt_loan_amnt sqrt_dti \n```\n\n```\nsqrt_annual_inc\
  \ sqrt_pct_tl_nvr_dlq home_mort \n```\n\n```\nacc_open_past_24mths num_actv_bc_tl\n\
  ```\n\n```\n / SELECTION=STEPWISE\n```\n\n```\nSLE=0.1\n```\n\n```\nSLS=0.1\n```\n\
  \n```\nINCLUDE=0\n```\n\n```\nCOLLIN VIF;\n```\n\n```\nOUTPUT OUT=WORK.REG_PRED\
  \ PREDICTED=P RESIDUAL=R;\n```\n\n```\nRUN;\n```\n\n我没有使用全局变量来定义预测变量，而是直接将变量名称硬编码到模型方程中。\n\
  \n输出 6.13 显示了精简模型生成的输出。注意到 RMSE 仅增加了 `0.12`。与全多线性回归模型相比，这种差异微乎其微，但精简模型中只有十个变量，而全模型中有十九个。\n\
  \n### 输出 6.13：精简线性回归输出\n\n![](img/Image1460.png)\n\n![](img/Image1467.png)\n\n![](img/Image1475.png)\n\
  \n精简方法允许我们以最少量的预测变量保留全模型几乎所有的预测能力。通过仅选择全模型中的前五个变量，可以进一步简化该模型。虽然我不会显示这个进一步简化模型的代码和诊断输出，但我确实创建了该模型，它产生的\
  \ RMSE 为 `20.35`。与全模型相比，差异仅为 `0.37` 个单位；与十变量精简模型相比，差异仅为 `0.25` 个单位。\n\n## 将精简模型应用于留留\
  \ TEST 数据集\n\n将精简模型应用于留留 `TEST` 数据集的方法与我们在本章简单线性回归部分回顾的步骤非常相似。因此，没有必要对过程的每个部分详细说明。程序\
  \ 6.15 展示了如何将精简模型应用于调整后的留留 `TEST` 数据集。\n\n### 程序 6.15：评分并评估留留 TEST 数据集\n\n```\n\
  /*将精简模型应用到完整的 TRAIN 数据集*/\n```\n\n```\n%LET parsi_vars = sqrt_total_bc_limit sqrt_bc_util\
  \ open_acc\n```\n\n```\nsqrt_loan_amnt sqrt_dti sqrt_annual_inc;\n```\n\n```\nPROC\
  \ REG DATA=change OUTEST=RegOut       ;\n```\n\n```\nMODEL sqrt_revol_bal = &parsi_vars.\
  \ / SELECTION=STEPWISE;\n```\n\n```\nOUTPUT OUT=WORK.REG_PRED PREDICTED=P RESIDUAL=R;\n\
  ```\n\n```\nRUN;\n```\n\n```\n/*将精简模型应用到 TEST 数据集*/\n```\n\n```\nPROC SCORE DATA=test_reg\
  \ SCORE=RegOut OUT=RScoreP TYPE=parms;\n```\n\n```\nVAR &parsi_vars.;\n```\n\n```\n\
  run;\n```\n\n```\n/*计算 TEST 数据集的 RMSE*/\n```\n\n```\nDATA eval;\n```\n\n```\nSET\
  \ RScoreP;\n```\n\n```\nRESIDUAL = (MODEL1-sqrt_revol_bal)**2;\n```\n\n```\nsqrt_residual\
  \ = sqrt(residual);\n```\n\n```\nKEEP row_num model1 sqrt_revol_bal;\n```\n\n```\n\
  RUN;\n```\n\n```\nPROC MEANS DATA=eval MEAN;\n```\n\n```\nVAR RESIDUAL sqrt_residual;\n\
  ```\n\n```\nRUN;\n```\n\n### 输出 6.14：TEST 数据评估指标\n\n![](img/Image485.png)\n\n此输出显示精简模型的\
  \ RMSE 为 `14.66`。与简单回归模型生成的 `24.24` 相比，这是一个大幅的减少。在此基础上，我们可以判定精简模型比简单回归模型提供了更好的估计。\n\
  \n精简方法是以极少变量获得最佳模型的一种极佳方法。然而，它需要大量的模型创建、评估和重新评估。难道你不希望有一个自动化过程来完成这些减少和评估吗？欢迎来到正则化模型。\n\
  \n## 正则化模型\n\n在第一章数据科学概述中，我们讨论了模型复杂度，以及随着模型复杂度增加会出现过拟合的现象。我们模型开发的目标是创建一个能够捕捉数据中信号但不建模噪声的模型。我们希望优化模型复杂度。复杂度太低会导致欠拟合，复杂度过高会导致过拟合。\n\
  \n正则化模型在模型方程中引入了一个新项，通过限制模型系数来惩罚模型复杂度。该项被称为收缩惩罚。该项实际上是一个调优参数，允许模型开发者作为目标函数的一部分来调整模型复杂度。调优参数将模型系数向零收缩。这一过程防止了目标函数产生过于复杂的模型。\n\
  \n记得模型系数是通过最小化损失函数的过程确定的。在线性回归中，损失函数通常是方程 6.5 所示的残差平方和（RSS）。\n\n## 岭回归\n\n正则化方法向\
  \ RSS 方程中添加一个惩罚项。该惩罚项通常表示为 lambda (λ)，并应用于每个模型系数。有两种主要的正则化方法：岭回归和 Lasso 回归。它们在损失函数中表达\
  \ lambda 项的方式不同，因此让我们分别进行检查。\n\n岭回归方法将惩罚项应用于每个模型系数的平方。方程 6.6 显示了 RSS 方程中额外的惩罚项：\n\
  \n方程 6.6：岭回归 RSS\n\n![](img/Eq6.6.jpg)\n\n\n\n\n该方程表明，对于所有 `λ` ≥ 0 的情况，模型系数的平方值将被乘以因子\
  \ `λ`。如果 `λ = 0`，则该方程与普通最小二乘法方程相同。然而，随着 `λ` 的增加，收缩惩罚的影响也会随之增大。这种收缩的结果是模型系数将趋于零。\n\
  \n需要记住的一个重要事实是，岭回归（ridge regression）方法永远不会将模型系数收缩到零。系数可能会变得非常小，因此它们在模型中将是不显著的。然而，岭回归模型仍然包含最初输入算法的所有预测变量，并为它们中的每一个变量创建系数。\n\
  \n这与我们在多元回归模型示例中使用的“最佳子集”方法非常不同，在示例中，我们使用 `STEPWISE` 模型选项来选择模型属性。而这种方法仅选择了符合我们选择标准的预测变量子集。\n\
  \n程序 6.16 显示了更新了 `RIDGE` 选项的 `PROC REG`。与其对岭调优参数应用单一值，我们可以选择一个值范围并评估结果，以确定调优参数的最佳值。\n\
  \n### 程序 6.16：岭回归模型\n\n```\nODS GRAPHICS ON;\n```\n\n```\nPROC REG DATA=change OUTEST=b\
  \ RIDGE=0 to 1 by .05\n```\n\n```\n PLOTS(ONLY)=ALL       ;\n```\n\n```\n MODEL\
  \ sqrt_revol_bal = &trans. &box.;\n```\n\n```\n OUTPUT OUT=WORK.RIDGE_PRED PREDICTED=P\
  \ RESIDUAL=R;\n```\n\n```\nRUN;\n```\n\n#### 程序 6.16 备注：\n- `OUTEST` 选项创建一个数据集，其中包含每个岭调优参数值值对应的参数值。该数据集证明，随着\
  \ `lambda` 的增加，每个参数的值都会减小。\n- `RIDGE` 选项包含一个从 0 开始并以 0.05 的间隔持续到 1 的值范围。\n\n输出 6.15\
  \ 显示了岭回归模型产生的 ODS 输出。图表的上半部分显示了方膨胀因子 (`VIF`)，而图表的下半部分显示了标准化系数。\n\n### 输出 6.15：岭回归\
  \ VIF 输出\n\n![](img/Image1497.png)\n\n似乎，当调优参数设置为 0.01 时，图中显示的所有预测变量的 `VIF` 均减少到\
  \ 3 以下，且这些预测变量已稳定在常定的标准化值。如果你在回归中有中有输入变量，输出将包含多个图表，每个图表有约 10 个变量组。\n\n### 将岭回归模型应用于留出测试集\n\
  \n现在我们已经开发了岭回归模型，可以将该模型应用于留出的 TEST 数据集。该过程与简化模型（parsimonious model）部分的详细过程完全相同，因此我不会在此重新创建代码。岭回归的\
  \ `RSME` 显示在输出 6.16 中。\n\n### 输出 6.16：岭回归评估指标\n\n![Output 6.25 – 岭回归评估指标](img/Image1510.png)\n\
  \n我们可以看到岭回归模型的 `RSME` 为 14.41。这个得分略优于 `RMSE` 为 14.66 的简化模型。这一指标为我们提供了证据，证明岭回归模型提供的预测比简化模型略好。\n\
  \n### 岭回归模型的优缺点\n\n**优点** – 正则化方法的主要优点之一是，你不需要确定数据集是否包含多共线性，并在建模前进行必要的调整。调优参数将收缩模型系数，并而减少模型的方差。这就是为什么我们看到随着调优参数的增加，每个预测变量的\
  \ `VIF` 指标都在减小的原因。\n\n**缺点** – 岭回归方法保留了所有输入回归算法的变量。尽管许多模型变量的系数非常小，对模型输出的影响微乎其微，但这些变量仍然在模型中。这种保留的原因是，正则化模型不需要进入模型所需的显著性水平，例如我们在程序\
  \ 6.16 中开发的 `STEPWISE` 选择方法 `PROC REG` 中的 `SLE` 选项。\n\n简化模型的主要优点之一是它选择了最少数量的变量，且具有与完全无限制多元线性回归模型等效的预测能力。岭回归模型的优点是可以吸收所有预测变量并使用正则化参数处理多共线性；然而，所有预测变量都被保留在最终模型中。\n\
  \n如果有一种方法可以吸收所有预测变量，让模型处理多共线性并仅保留这些预测变量的显著子集呢？欢迎来到 Lasso 回归。\n\n## Lasso 回归\n\n\
  Lasso 回归方法对模型系数的每个绝对值应用惩罚项。方程 6.7 显示了 `RSS` 方程中额外的惩罚项。\n\n### 方程 6.7：Lasso 回归 RSS\n\
  \n![](img/Eq6.7.jpg)\n\n该方程表明，对于所有 `λ` ≥ 0 的情况，模型系数的绝对值将被乘以因子 `λ`。\n\n岭回归和 lasso\
  \ 回归之间的重要区别在于，岭回归通过将系数收缩为极小值来惩罚弱预测变量，而 lasso 方法可以将系数收缩为零。这是一种变量简化方法。\n\n在 SAS 中，`PROC\
  \ REG` 不提供 lasso 回归方法。相反，我们将使用 `PROC GLMSELECT`。这是一个灵活的程序（GLM），允许数据科学家从多种方法中进行选择。\n\
  \n### 程序 6.17：Lasso 回归模型\n\n使用 `PROC GLMSELECT` 开发 lasso 回归模型。\n\n```\nPROC GLMSELECT\
  \ DATA=change PLOTS(UNPACK)=ALL;\n```\n\n```\n MODEL sqrt_revol_bal = &trans. &box.\
  \ \n```\n\n```\n / SELECTION=lasso(CHOOSE=CP) STATS=ALL;\n```\n\n```\n SCORE DATA=test\
  \ OUT=test_pred RESIDUAL;\n```\n\n```\nRUN;\n```\n\n#### 程序 6.17 备注：\n- `PROC GLMSELECT`\
  \ 用于调整后的数据集 `change`。\n- `SELECTION` 选项设置为 `lasso`。额外的选项 `CHOOSE=CP` 告诉回归算法选择将是优化\
  \ Cp 指标的模型。\n- `PROC GLMSELECT` 可以在程序内对单独的数据集评分。不需要单独的 `PROC SCORE`。`SCORE` 选项允许我们对留出的\
  \ TEST 数据集评分并输出结果。\n\n`GLMSELECT` 程序的输出与 `PROC REG` 输出略不同。虽然它仍然提供方差分析中的详细信息，但它还提供了拟合指标列表，包括\
  \ `RMSE`、`AIC`、`BIC` 和 Mallows’s Cp 指标。输出 6.17 展示了几个模型输出。\n\n### 输出 6.17：Lasso 回归输出\n\
  \n| ![](img/Image1553.png) |  |\n\n| ![](img/Image1562.png) | ![](img/Image1572.png)\
  \ |\n\n| ![](img/Image1582.png) | ![](img/Image1590.png) |\n\n注意输出 6.17 中的参数估计表包含保留在模型中的\
  \ 23 个预测变量。对比岭回归模型中保留的全部 46 个变量。这种差异表明 lasso 回归方法是一种变量简化方法。\n\n通过指定你想在模型输出中保留的变量数量，可以进一步减少此列表。例如，如果你想在模型中保留\
  \ 10 个变量，可以在 `PROC GLMSELECT` 的 `SELECTION` 选项中指定。程序 6.18 显示了更新后的 `SELECTION` 语句。\n\
  \n### 程序 6.18：Lasso 选择方法\n\n```\nSELECTION=lasso(CHOOSE=CP STEPS=10) STATS=ALL;\n\
  ```\n\n\n\n此选择选项将产生一个仅包含 10 个预测变量的模型。\n\n## 对留出 TEST 数据集应用 Lasso 回归\n\n评估 lasso\
  \ 回归模型性能的最后一步是评估留出 TEST 数据集的 `RMSE`。评估代码中唯一的一处微小更新是，模型预测结果包含在字段 `p_sqrt_revol_bal`\
  \ 中。`p_` 前缀表示这是预测值。更新后的程序如程序 6.19 所示。\n\n#### 程序 6.19：评估留出 TEST 数据集的 RMSE\n\n```sas\n\
  DATA eval;\n```\n\n```sas\n SET test_pred;\n```\n\n```sas\n RESIDUAL = (p_sqrt_revol_bal-sqrt_revol_bal)**2;\n\
  ```\n\n```sas\n sqrt_residual = sqrt(residual);\n```\n\n```sas\n KEEP row_num model1\
  \ sqrt_revol_bal residual sqrt_residual;\n```\n\n```sas\n RUN;\n```\n\n```sas\n\
  PROC MEANS DATA=eval N MEAN;\n```\n\n```sas\n VAR RESIDUAL sqrt_residual;\n```\n\
  \n```sas\n RUN;\n```\n\n生成的 `RMSE` 显示在输出 6.18 中。这表明 lasso 回归方法对于调整后的留出 TEST 数据集的\
  \ `RMSE` 为 `14.51`。\n\n#### 输出 6.18：留出 TEST 数据集的评估指标\n\n![](img/Image1599.png)\n\
  \n此时，你可能想比较我们从简单、简约、岭和 lasso 回归模型收集到的 `RMSE` 值。在所有这些模型中，岭回归模型对留出 TEST 数据集产生了最低的\
  \ `RMSE`。\n\n然而，这并不意味着岭回归方法优于我们探索的所有其他建模类型。我们从这次练习中得出的唯一结论是，对于给定的数据集，结合我们应用于数据的假设和转换，岭回归对于特定的留出\
  \ TEST 数据产生了最低的 `RMSE`。\n\n虽然预测准确性是模型开发的主要目标之一，但它并不意味着在选择哪个模型作为生产模型时，它是唯一的考虑因素。在这个例子中，岭回归有\
  \ 46 个变量，其预测能力仅比简约和 lasso 回归模型略高一点。数据科学家无疑有充分的理由选择一个更简洁的模型进入生产环境。\n\n你在选择选择哪个模型时并不受限于单一指标。选择哪个模型的决策是模型准确性、可解释性、效率、控制、业务影响和业务接受度之间的平衡。\n\
  \n## 章节回顾\n\n本章的目标是向你介绍线性回归的概念，并演示在 SAS 中生成线性回归模型的几种方法。我们从简单的方法（简单线性回归）开始，通过添加更多预测变量和演示不同的建模技术来增加模型的复杂性。演示的每种模型方法都有其优缺点，数据科学家的工作是为特定项目确定正确的建模方法。\n\
  \n当需要理解建模算法中哪些变量是重要的，以及每个预测变量如何影响预测结果时，线性回归模型是一种首选建模方法。这就是为什么线性回归模型在任何需要大量模型监管的业务（金融、保险、医疗保健、政府等）中非常流行。\n\
  \n这类模型也适用于非常大的数据集，特别是包含高维数据的数据集。参数建模方法非常高效，可以在比复杂建模方法短得的时间内产生建模结果。\n\n有整本教科书专门回归方法。我们只讨论了许多可能方法中的几种，并且讨论了这些模型提供的几种选项。线性回归模型高度灵活性、高效，并为模型中的每个预测变量提供特定信息。这种建模算法的透明性使其成为数据科学家工具箱中最重要的建模技术之一。\n\
  \n## 第 7 章：参数分类模型\n\n## 概述\n- 分类概述\n- 线性回归与逻辑回归的区别\n- 逻辑回归\n- 损失函数\n- 数据\n- 数据限制\n\
  - 可视化\n- 逻辑回归模型\n- PROC LOGISTIC 代码\n- PROC LOGISTIC 模型输出\n- TEST 数据集的评分\n- 线性判别分析\n\
  - PROC DISCRIM\n- PROC DISCRIM 模型输出\n- 章节回顾\n\n## 概述\n\n在上章节中，我们关注了线性回归模型。两个重要特征定义了这些模型：1.)\
  \ 它们旨在支持定量目标变量。2.) 它们假设了一个函数形式（`Y ≈ β0 + β1 X1`）；因此，它们被归类参数模型。\n\n线性回归模型通过利用线性回归方程来拟合数据。假设函数形式限制正是线性回归模型如此强大的原因。方程是透明的，并且快速建模数据，因为它只需要拟合数据。在随后的章节中，我们将回顾功能多变且强大的非参数模型，但其代价是计算资源。\n\
  \n尽管线性回归模型非常强大，但在许多情况下并不适用。关于使用什么类型的模型的决策点通常由目标变量的性质驱动。记住，线性回归模型适用于定量变量。如果因变量是定性的怎么办？\n\
  \n定性变量通常是二元的（是或否，1 或 0，开或关），但它们也可以是多级类别（第一、第二、第三）或（红、黄、绿）。注意，这些类别不需要是数值。它们通常是描述性类别，我们需要将它们转换为数据的数值表示。\n\
  \n存在专门的模型用于预测分类因变量，同时保留预定义的函数形式。本章将重点介绍这些模型中的两种：逻辑回归和判别分析。\n\n### 分类概述\n\n分类问题在建模世界中普遍。事实上，确定事件是否发生通常比确定事件精确的时间或值更重要。例子包括：\n\
  \n- 观众会点击广告吗？\n- 借款人会违约吗？\n- 这种新药能降低患者的血压吗？\n- 这笔交易是欺诈吗？\n- 公司应该在三个地点中的哪一个钻井？\n\n\
  每个示例的答案都可以表示为二元或多级响应。我们仍然可以像第 5 章：创建建模数据集中回顾的那样构建我们的建模数据集，唯一的区别将是目标变量的选择或创建。建模数据集仍然包含几个独立预测变量，我们用它们来尝试确定结果变量。因此，如果几乎都与线性回归模型相同，为什么不直接使用线性回归模型来预测分类结果？\n\
  \n### 线性回归与逻辑回归的区别\n\n\n\n\n\n如前所述，线性回归与逻辑回归的主要区别在于因变量的结构。线性回归假设变量是定量数值，而逻辑回归假设目标变量是定性分类变量。图\
  \ 7.1 展示了这些建模类型的数值示例分布。\n\n图 7.1：线性回归 vs. 逻辑回归数据分布\n\n![](img/Image733.png)\n\n\
  在这个示例中，线性回归模型可以取零到一之间的任何值。假设目标值代表“在给定特定折扣率（`X`）的情况下，售票百分比（`Y`）”。该值可以是 0%、31%、73%、100%\
  \ 或其之间的任何值。\n\n右侧的图显示了逻辑回归模型的示例二元分布。假设目标值代表“售出或未售”。在给定特定折扣率（`X`）的情况下，“售”（表示为 `1`）和“未售”（表示为\
  \ `0`）之间没有其他值。\n\n如果我们尝试用线性回归模型来对二元结果进行建模，将会得到一些令人困惑的结果。图 7.2 比较了线性回归和逻辑回归在二元目标变量上的建模方法。\n\
  \n图 7.2：二元结果上的线性模型 vs. 逻辑模型\n\n![](img/Image7401.png)\n\n线性回归模型旨在最小化数据的残差平方和（`RSS`）。模型的底层函数形式假设因变量（`Y`）是一个连续值。在这一假设下，直线是数据的最佳拟合线。我们实际上可以使用线性回归模型对数据进行预测，声明任何位于绿色虚线以上的预测值都将购买，而任何位于绿色虚线以下的值将不购买。\n\
  \n这种方法的问题之一是，当你接近预测变量的最高或最低值时，线性回归的逻辑就会失效。注意，当 `X` 的值接近 0% 时，购买的预测值为负数；而当我们接近 `X`\
  \ 的高端时，预测值大于 1。这两种结果都是可能的，因为它们超出了 `[0,1]` 范围。\n\n也许我们只是在线性回归模型的使用上过于挑剔和学术化了。我们可以简单地规定，所有大于\
  \ 1 的预测值将被限制为 1，所有小于 0 的预测值将被限制为 0。问题解决了，对吧？遗憾的是，并没有。\n\n### 我们不应在分类问题上使用线性回归的三个主要原因：\n\
  \n1. 上述的概率大于 1 或小于 0 的问题。\n2. 同方差——线性回归的假设是 `Y` 的方差在 `X` 的所有范围内保持不变。然而，对于二元模型，方差的计算方式为正值的比例（`P`）乘以负值的比例（`Q`）。因此，方差为\
  \ `(PQ)`。该值在逻辑回归曲线上变化。例如，在逻辑回归线的中间点，当 `P = 0.5` 时，`Q = 0.5`，方差为 `PQ = 0.25`。但在逻辑回归线的远端，当\
  \ `P = 0.1` 且 `Q = 0.9` 时，方差为 `PQ = 0.09`。\n3. 线性回归假设残差呈正态分布。由于分类问题具有二元目标，这一假设很难成立证明。\n\
  \n### 逻辑回归\n\n更好的方法是将二元结果变量建模为事件发生的概率。该概率在图 7.2 中表示为 S 曲线回归线。该线的公式与线性回归公式大不相同，但也有一些相似之处。\n\
  \n方程 7.1：线性回归\n```\nY ≈ β0 + β1 X1\n```\n\n方程 7.2：逻辑回归\n![](img/Eq7.2.jpg)\n\n逻辑回归方程（方程\
  \ 7.2）包含四个主要部分：\n\n1. `p(X)` 代表正值（`1`）的概率，这也就是 1 的比例。这是 `Y` 的平均值（与线性回归一样）。\n2. 由于这是一个逻辑模型，我们应该预期在模型中看到自然对数底（`e`）的基值。\n\
  3. 值 `β0` 代表当 `X` 为 0 时的 `P`（类似于线性回归的截距值）。\n4. 值 `β1` 调整概率随 `X` 单位变化而变化的速度（类似于线性回归中的\
  \ `β1` 值）。\n\n逻辑回归方程被称为逻辑函数，我们使用该函数是因为它对所有 `X` 值都能产生 0 到 1 之间的输出，并且它允许 `Y` 的方差随\
  \ `X` 的值变化而变化。\n\n### 损失函数\n\n在线回归章节中，我们描述了通过梯度下降过程最小化 `RSS` 代价函数来确定 `β` 值的过程。对于逻辑回归，由于我们处理的是\
  \ S 曲线逻辑回归线，没有数学解可以像线性回归模型中那样最小化平方和。对于逻辑回归模型，`β` 值是通过极大似然法确定的。\n\n记住，我们处理的是概率。似然（likelihood）一词代表条件概率\
  \ `P(Y|X)`，即在给定 `X` 时 `Y` 的概率。逻辑回归函数的参数（`β0` 和 `β1`）通过选择值来确定，使得每个观测值的预测概率 `p̂(xi)`\
  \ 尽可能地与观测值的实际值对应。\n\n因此，极大似然意味着我们选择的 `β0` 和 `β1` 值使得所有的 1 概率接近一，所有的 0 概率接近零。这之所以被称为极大似然，是因为我们试图最大化模型估计的似然（条件概率）。\n\
  \n### 数据\n\n在第 5 章创建建模数据集中，我们开发了一个具有二元目标变量的建模数据集。现在我们应该对这个数据集很熟悉了。我们在第 5 章中详尽检查了变量，并在第\
  \ 6 章线性模型中使用该数据集开发了线性回归模型。让我们通过使用同一个数据集演示参数二分类器的开发和解释，以此结束对参数模型的之旅。\n\n\n\n\n现在我们已经构建了基础建模数据集，在建模之前，我们需要做出最终决定。由于我们的数据集是自\
  \ Lending Club 数据库成立以来所有贷款账户的完整列表，我们需要理解存在一个初始的爬升期，期间的贷款量很低，而且我们还需要意识到贷款不会立即坏账。从申请到最终违约之间存在一个延迟。图\
  \ 7.3 显示了在 Lending Club 数据集十一年的历史上，坏状态账户数量的趋势。\n\n### 图 7.3：Lending Club 账户趋势\n\n\
  ![](img/Fig_7.3.jpg)\n\n我们可以很容易地看到，数据集的爬升期从成立一直持续到 2012 年初。在段时间内，贷款量非常低。如果我们将这段时间包含在建模数据集中，它将无法充分代表我们在模型实施时点所预期的贷款类型和数量。图\
  \ 7.4 提取了 Lending Club 数据集中坏状态账户的体量。\n\n### 图 7.4：Lending Club 坏状态趋势\n\n![](img/Fig_7.4.jpg)\n\
  \n该图表显示，坏账数量（坏状态账户）从 2012 年初开始增加，并在 2016 年 3 月达到顶峰，之后坏账数量一直减少到时间段结束。\n\n数据科学家应该利用这些信息做什么呢？这些图表让我们洞察了目标变量的本质。我们现在理解到存在一个明显的爬升期，期间发放的贷款数量较少，在那段时间内，坏账数量非常低。这种情况很可能是因为贷款不会立即坏账。贷款发放时期与违约之间通常存在延迟。我们也可以在后期的时间段观察到这种现象，即在后几个月里坏账数量正在减少。这很可能是因为这些贷款还没有足够的时间变成坏账。\n\
  \n如果我们想要建立一个充分代表真实坏账率的模型，我会选择一个紧凑的时间范围，范围内有足够的数量，并且有足够的时间坏账。为了我们的建模目的，我将数据限制在 2015\
  \ 年 1 月 1 日至 2015 年 12 月 31 日之间的贷款发放日期。这将为我们提供一个稳健的一年代表性贷款量时期。\n\n程序 7.1 将训练数据集限制在指定的时间段，并为“坏”变量开发了频率分布。\n\
  \n### 程序 7.1：按范围限制数据集\n\n```\nDATA TRAIN; \n```\n\n```\n SET MYDATA.MODEL_TRAIN;\n\
  ```\n\n```\n WHERE ‘01JAN2015’d le issue_date le ‘01DEC2015’d;\n```\n\n```\nRUN;\n\
  ```\n\n```\nPROC FREQ DATA=TRAIN; TABLES BAD; RUN;\n```\n\n### 输出 7.1：目标值频率分布\n\n\
  ![](img/Image749.png)\n\n输出 7.1 显示，在指定时间内发放的贷款中有 18.01%导致了坏状态。\n\n### 可视化\n\n任何建模过程的第一步都是数据可视化。这一步将帮助你理解预测变量之间的关系，以及每个预测变量与目标变量之间的关系，但可视化数据还有另一个、往往未被说明的理由。通过可视化，你可以先验地获得关于模型分离正目标值与非正目标值能力好坏的想法。\n\
  \n只需一眼，你通常在进行任何建模之前就能知道二分类目标值之间是否存在清晰的分隔，如果是这样，你可以预期获得强大的建模结果。如果二分类目标值之间没有清晰的分隔，你可以预期你的模型不会那么强大。\n\
  \n输出 7.2 显示了一个散点图，展示了预测变量 `loan_amnt` 和 `int_rate` 之间的关系。该图还把目标变量 `bad` 表示为：`bad\
  \ = 0` 情况用蓝色圆圈，`bad = 1` 情况用红色三角形表示。程序 7.2 提供了生成此图表的代码。\n\n### 程序 7.2：预测变量的散点图\n\
  \n```\nods graphics / attrpriority=none;\n```\n\n```\nproc sgplot data=TRAIN (obs=1000);\n\
  ```\n\n```\nstyleattrs datasymbols=(circlefilled trianglefilled) ;\n```\n\n```\n\
  \ scatter x=loan_amnt y=int_rate / group=bad;\n```\n\n```\n title ‘Scatter Plot\
  \ of Loan Data’;\n```\n\n```\nrun;\n```\n\n当我们检查输出 7.2 时注意的第一点是，目标变量似乎随机分布在整个决策空间中。在这两个变量上，“好”和“坏”之间似乎没有强力的分离。\n\
  \n### 输出 7.2：贷款数据散点图\n\n![](img/Image757.png)\n\n也许这个问题只是这些特定变量的结果。为了更广泛地理解该问题，我们可以开发一个包含多个变量的散点矩阵，并将它们相互绘制对比。这种方法可以为我们提供目标变量的不同视角，并获得关于我们开发的任何模型应有何种额外信息。\n\
  \n程序 7.3 提供了开发按目标变量分组的变量散点矩阵的代码。\n\n### 程序 7.3：预测变量的散点矩阵\n\n```\nproc sgscatter\
  \ data=TRAIN (obs=250);\n```\n\n```\n title “Scatterplot Matrix for Loan Data”;\n\
  ```\n\n```\n matrix loan_amnt total_bc_limit dti int_rate / group=bad;\n```\n\n\
  ```\nrun;\n```\n\n输出 7.3 显示了四个预测变量的散点矩阵，其中每个变量都按目标变量进行了分组。在图中，蓝色圆圈表示 `bad = 0` 的地方，红色加号表示\
  \ `bad = 1` 的地方。\n\n散点矩阵很容易在视觉上让人信息过载。一张图里包含了太多信息。注意我在图表中只包含了 250 个观测值。请记住，对于如此小的样本，我们可以预期结果中存在某些偏差。然而，这确实向我们展示了，好坏之间存在不明显决策边界的问题在所有这些预测变量中都是普遍存在的。\n\
  \n### 输出 7.3：预测变量的散点矩阵\n\n![](img/Image764.png)\n\n大多数关于数据科学的书籍都依赖于那些“好”和“坏”之间有清晰决策边界、且每个预测变量都是强显著预测子的例子。然而，在现实世界中，数据是混乱的。事实上，大多数时候，要在目标和预测变量列表之间寻找显著的预测关系是一个挑战。\n\
  \n当存在关于允许使用的变量类型的限制（例如监管限制，如年龄、种族、性别、地点）时，这种挑战尤为突出。此外还有建模问题如数据泄露，即预测变量中包含了关于目标变量的直接信息。其他技术问题如数据可用性、数据刷新计划以及将某些变量移动到生产环境的能力也会限制你构建可能最好的模型。在开发模型时，需要考虑所有这些限制。\n\
  \n现在我们已经考虑了所有的限制，并且对模型分离好坏的有效有了先验的想法，我们可以预期二分类器模型具有中等的有效性。如果我们得到的 Gini 分数约为 40，总准确率约为\
  \ 80%，而不感到意外。不要担心，Gini 和准确率的概念将在接几节中解释。\n\n## 逻辑回归模型\n\n\n\n\n\n我们已经强调了在任何建模工作之前进行变量选择的重要性。这一选择过程确保了我们要包含在模型中的变量是合适的（无数据泄露）、被允许的（符合监管标准）以及可用的（受控制数据基础设施的\
  \ IT 部门允许）。一旦满足了这些限制，我们就可以开发预测模型了。\n\n请记住，我们模型的业务目标是预测贷款在未来某个时刻是否会产生坏账（bad status）。我们希望在贷款申请阶段实现此模型，因此所有输入模型的变量在申请时时都必须是可用的。当有人申请贷款时，我们并不知道他们是否已经错过了任何付款，或者他们是否处于逾期状态，或者是否产生了催收费用。我们无法获得这些任何信息，因为在申请时，这些变量并不存在，因此我们不能将它们包含在模型中。\n\
  \n如果我们包含了这些变量，就会导致数据泄露（data bleed）问题，也称为信息泄漏（information leakage）。这是模型中包含了与目标变量直接相关的变量。如果你包含了这些变量，你的模型将会非常准确，但这是一种虚假的准确，因为由于这些变量在申请时不可用，你无法实施该模型。\n\
  \n我冒昧地检查了 Lending Club 数据集中的所有变量列表，并仅选择了在申请时可用的变量。表 7.1 显示了符合我们标准的 45 个变量列表。\n\n\
  ### 表 7.1：申请时可用的变量\n\n| acc_open_past_24mths | grade_F | purpose_other |\n| :---\
  \ | :--- | :--- |\n| annual_inc | grade_G | revol_bal |\n| app_individual | home_mort\
  \ | term_36 |\n| app_joint | home_own | term_60 |\n| bc_util | home_rent | tot_hi_cred_lim\
  \ |\n| dti | inq_last_6mths | total_bc_limit |\n| emp_10 | int_rate | ver_not |\n\
  | emp_0to4 | loan_amnt | ver_source |\n| emp_5to9 | mo_sin_old_il_acct | ver_verified\
  \ |\n| emp_NA | mo_sin_rcnt_tl | num_actv_bc_tl |\n| grade_A | mort_acc | num_bc_tl\
  \ |\n| grade_B | mths_since_recent_bc | num_il_tl |\n| grade_C | mths_since_recent_inq\
  \ | open_acc |\n| grade_D | purpose_dc | pct_tl_nvr_dlq |\n| grade_E | purpose_hi\
  \ | purpose_cc |\n\n这些变量代表了多种贷款属性，包括借款人信息（年收入、工龄、住房拥有情况）、贷款信息（贷款等级、用途、期限）、之前的借款人行为（过去\
  \ 24 个月内开的账户数、过去 6 个月内的贷款查询、从未逾约的交易比例），以及其他几个描述性变量。\n\n我可以利用 `LET` 语句轻松地将这些变量放入全局变量。程序\
  \ 7.4 将变量放入标记为 `num_vars` 的全局变量中。\n\n### 程序 7.4：创建包含模型变量名的宏变量\n\n```\n%LET num_vars\
  \ = acc_open_past_24mths annual_inc app_individual app_joint bc_util dti emp_10\
  \ emp_0to4 emp_5to9 emp_NA grade_A grade_B grade_C grade_D grade_E grade_F grade_G\
  \ home_mort home_own home_rent inq_last_6mths int_rate loan_amnt mo_sin_old_il_acct\
  \ mo_sin_rcnt_tl mort_acc mths_since_recent_bc mths_since_recent_inq num_actv_bc_tl\
  \ num_bc_tl num_il_tl open_acc pct_tl_nvr_dlq purpose_cc purpose_dc purpose_hi purpose_other\
  \ revol_bal term_36 term_60 tot_hi_cred_lim total_bc_limit ver_not ver_source ver_verified\
  \ ;\n```\n\n### PROC LOGISTIC 代码\n\n现在我们已经构建了训练数据集，并将预测变量放入了全局变量中，我们已经准备好开发逻辑回归算法了。程序\
  \ 7.5 使用目标变量 `bad` 和包含在全局宏变量 `num_var` 中的中的预测变量，开发了一个标准的逻辑回归模型。\n\n### 程序 7.5：逻辑回归模型\n\
  \n```\nODS GRAPHICS ON;\nPROC LOGISTIC DATA=TRAIN DESCENDING PLOTS=ALL;\nMODEL BAD\
  \ = &num_vars. / SELECTION=STEPWISE \nSLE=0.01 SLS=0.01 CORRB OUTROC=performance;\n\
  OUTPUT OUT=MYDATA.LOG_REG_PROB PROB=score;\nRUN;\n```\n\n程序 7.5 备注：\n- `ODS GRAPHICS`\
  \ 语句被设置为 `ON`。这将为我们提供逻辑回归选项中指定的所有输出图表。\n- `PROC LOGISTIC` 用于开发模型。这是一个非常灵活的过程，可以用于预测二分类、序数或分类响应。有多个可用选项允许研究人员自定义其模型规格：\n\
  \    - `DESCENDING` 选项反转响应变量水平的排序顺序。这确保模型预测的是 `BAD = 1` 的事件。\n    - `PLOTS` 选项设置为\
  \ `ALL`。这指定了要在输出中包含所有的图表。\n    - `SELECTION` 方法设置为 `STEPWISE`。这与 `FORWARD` 选择方法相似，但不能保证变量会保留在模型中。\n\
  \    - `SLE` 选项指定了使用 `FORWARD` 或 `STEPWISE` 方法进入模型的卡方显著性水平。\n    - `SLS` 选项指定了在\
  \ `BACKWARDS` 回归消除中保留在模型的卡方显著性水平。\n- `CORRB` 语句显示参数估计的相关系数矩阵。\n- `OUTROC` 语句创建一个包含开发受工作特征（ROC）曲线所需信息的输出数据集。\n\
  - `OUT=` 语句指定了创建一个新的数据集，其中包含目标变量、所有预测变量以及新开发的模型输出评分。\n- `SCORE` 选项指定了我们将新创建的预测变量命名为\
  \ `score`。\n\n\n\n\n\n### 输出 7.4：逻辑回归输出\n\n![](img/Image8201.png)\n\n![](img/Image829.png)\n\
