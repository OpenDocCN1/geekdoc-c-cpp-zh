  RUN;\n%INCLUDE ‘C:/Users/James Gearheart/Desktop/SAS Book Stuff/Projects/separation.sas’;\n\
  %separation(data = GB_SCORED, score = P_TARGET1, y = target);\n```\n\n该程序将存储的评分代码应用于保留的\
  \ `TEST` 数据集，然后我应用提升表（lift table）宏来评估模型在 `TEST` 数据集上的性能。\n\n输出 8.25 显示了由提升宏生成的提升表。该表显示，梯度提升算法在分离好样本和坏样本方面表现良好，Gini\
  \ 分数为 49.11。\n\n### 输出 8.25：`TEST` 数据集提升表\n\n| 数据 `GB_TEST` 中 `P_TARGET1` 的好坏样本分离报告\
  \ |\n| :--- |\n| `MAXIMUM KS = 39.5621，对应的评分分点为 0.5837` |\n| `( AUC STATISTICS =\
  \ 0.7456, GINI COEFFICIENT = 0.4911, DIVERGENCE = 1.0044 )` |\n| | MIN | MAX | GOOD\
  \ | BAD | TOTAL | ODDS | BAD | CUMULATIVE | BAD | CUMU. BAD |\n| SCORE | SCORE |\
  \ # | # | # | RATE | BAD RATE | PERCENT | PERCENT | | |\n| BAD | 0.9303 | 0.994\
  \ | 19 | 259 | 278 | 0.07 | 93.17% | 93.17% | 18.77% | 18.77% |\n| | 0.8182 | 0.9301\
  \ | 47 | 232 | 279 | 0.2 | 83.15% | 88.15% | 16.81% | 35.58% |\n| | 0.6168 | 0.8179\
  \ | 82 | 196 | 278 | 0.42 | 70.50% | 82.28% | 14.20% | 49.78% |\n| | 0.505 | 0.6165\
  \ | 153 | 126 | 279 | 1.21 | 45.16% | 72.98% | 9.13% | 58.91% |\n| | 0.4374 | 0.5049\
  \ | 149 | 129 | 278 | 1.16 | 46.40% | 67.67% | 9.35% | 68.26% |\n| | 0.3828 | 0.4369\
  \ | 180 | 99 | 279 | 1.82 | 35.48% | 62.30% | 7.17% | 75.43% |\n| | 0.3219 | 0.3828\
  \ | 177 | 101 | 278 | 1.75 | 36.33% | 58.59% | 7.32% | 82.75% |\n| | 0.262 | 0.3217\
  \ | 187 | 92 | 279 | 2.03 | 32.97% | 55.39% | 6.67% | 89.42% |\n| V | 0.1913 | 0.2618\
  \ | 208 | 70 | 278 | 2.97 | 25.18% | 52.04% | 5.07% | 94.49% |\n| GOOD | 0.0248\
  \ | 0.1909 | 202 | 70 | 278 | 2.97 | 25.18% | 52.04% | 5.07% | 94.49% |\n\n\n\n\n\
  如果数据分布使得每个好观测值的两侧都有坏观测值，那么支持向量分类器（Support Vector Classifiers）的效果并不理想。在这种情况下，我们需要使用支持向量机（SVM）。我们可以通过将数据移动到更高维（例如通过对其平方）来转换数据，并在数据的视图视图创建一个支持向量分类器。通过在数据表示中添加非线性特征，我们可以让线性模型变得强大得多。数据现在投影到三维轴（Z）上，显示出类别之间清晰的分离。\n\
  \n我们如何决定如何转换数据？为了使数学计算可行，SVM 使用了被称为核函数（kernel functions）的东西来系统地在高维中寻找 SVC。这被称为“核技巧”（kernel\
  \ trick）。之所以称之为技巧，是因为在 100 多维的特征空间中计算所有可能的交互将计算成本极大。相反，算法可以在高维空间中学习分类器，而无需实际执行每个表示的计算。它的工作原理是针对一系列特征表示计算数据点的距离，而无需实际计算这些特征。\n\
  \n将数据映射到高维空间的方法有两种：多项式核（polynomial kernel）和径向基函数（RBF）。多项式核计算直到特定阶的所有可能的多项式，而 RBF\
  \ 则计算所有阶的所有可能的多项式，但随着阶数的增加，特征的重要性会逐渐降低。它的行为类似于一个加权最近邻模型。\n\n## SVM 模型\n\n在进入 SVM\
  \ 的编码方面之前，将数据可视化是非常重要的，这样我们就能对模型能在多大程度上分离好坏样本有一个先验的认识。如果数据有清晰的视觉分离，我们可以预期模型将提供强有力的结果。然而，如果数据没有良好分离，那么像\
  \ SVM 模型的分类性能将远差于树模型。程序 8.14 开发了模型中仅两个连续特征：`pdays` 和 `age` 的散点图。\n\n### 程序 8.14：预测变量散点图\n\
  \n```\nods graphics / attrpriority=none;\n```\n\n```\nproc sgplot data=mydata.bank_train\
  \ (where=(pdays ne 999));\n```\n\n```\nstyleattrs datasymbols=(circlefilled trianglefilled)\
  \ ;\n```\n\n```\n scatter x=pdays y=age / group=target;\n```\n\n```\n title ‘Scatter\
  \ Plot of Bank Marketing Data’;\n```\n\n```\nrun;\n```\n\n程序的运行如输出 8.26 所示。我们可以看到，数据分布中好坏样本之间没有清晰的区别。对于我们选择可视化的两个变量，`target`\
  \ 变量没有显示出任何分离或分组的迹象。我们应该预计这将导致 SVM 模型表现优于树模型或 KNN。\n\n输出 8.26：预测变量散点图\n\n![](img/Image1726.png)\n\
  \n## 多项式模型设计\n\n程序 8.15 在银行营销数据集上开发了多项式 SVM 模型。\n\n### 程序 8.15：支持向量机示例\n\n```\n\
  PROC HPSVM DATA=mydata.bank_train;\n```\n\n```\n KERNEL POLYNOM;\n```\n\n```\n INPUT\
  \ pdays age pout_succ previous contact_tele / LEVEL=interval;\n```\n\n```\n TARGET\
  \ target / LEVEL=binary;\n```\n\n```\n PENALTY C=0.1 to 0.5 by 0.05;\n```\n\n```\n\
  \ SELECT FOLD=3 CV=SPLIT;\n```\n\n```\n OUTPUT OUTCLASS=outclass OUTFIT=outfit OUTTEST=outest;\n\
  ```\n\n```\nRUN; \n```\n\n#### 程序 8.15 备注：\n\n- `PROC HPSVM` 应用于 `MYDATA.BANK_TRAIN`\
  \ 数据集。该过程是一种高性能算法，提供了最大的处理效率。\n- `KERNEL` 语句被设置为 `POLYNOM`。这告诉算法要开发多项式 SVM 模型。其他选项包括\
  \ `LINEAR`、`RBF` 和 `SIGMOID`。\n- `INPUT` 语句指定了数值变量并将 `LEVEL` 分为间隔（interval）。如果数据集包含字符变量，它们将有一个单独的\
  \ `INPUT` 语句且 `LEVEL` 将设置为“nominal”。\n- `TARGET` 语句指定了目标变量 `LEVEL` 设置为二（binary）。\n\
  - `PENALTY` 语句指定了 `C`（正则参数）的取值范围。我选择了一个从 0.1 到 0.5、步长为 0.05 的取值范围。这将帮助我们确定 `C` 的最优值。\n\
  - `SELECT FOLD` 语句结合 `CV=SPLIT` 语句指定了我们使用三折交叉验证来寻找 `C` 的最优值。\n- `OUTPUT` 语句指定了将创建的输出数据集。\n\
  \n`PROC HPSVM` 提供了大量信息，让你确切知道模型在做什么，并为你提供评估指标。\n\n输出 8.27 显示了模型信息表。该表显示数据已自动从 0\
  \ 到 1 进行缩放，且核函数是多项式的。`C` 的值优化为 0.1，算法循环了 25 次迭代。\n\n输出 8.27：PROC HPSVM 输出\n\n![](img/Image1736.png)\n\
  \n输出 8.28 显示了惩罚选择表。该表显示了超参数调优方法。使用交叉验证来选择提供最大准确性的 `C` 值。记住，在输入的代码中，我们输入的 `C` 取值范围是从\
  \ 0.1 到 0.5，增量为 0.05。\n\n输出 8.28：PROC HPSVM 惩罚选择\n\n![](img/Image1747.png)\n\n输出\
  \ 8.29 提供了分类矩阵和拟合统计数据。分类矩阵按照标准方式结构，左侧为观测值，顶部为预测值。\n\n输出 8.29：PROC HPSVM 评估指标\n\n\
  ![](img/Image1758.png)\n\n![](img/Image1765.png)\n\n拟合统计表显示了标准的评估指标。\n\n## RBF 模型设计\n\
  \n程序 8.16 开发了 RBF 模型设计。\n\n### 程序 8.16：支持向量机设计\n\n```\nPROC HPSVM DATA=mydata.bank_train\
  \ METHOD=activeset;\n```\n\n```\n KERNAL RBF / K_PAR = 1.5;\n```\n\n```\n INPUT\
  \ pdays age pout_succ previous contact_tele /LEVEL=interval;\n```\n\n```\n TARGET\
  \ target / LEVEL=binary;\n```\n\n```\n OUTPUT OUTCLASS=outclass OUTFIT=outfit OUTEST=outest;\n\
  ```\n\n```\nRUN;\n```\n\n#### 程序 8.16 备注：\n\n- `PROC HPSVM` 应用于 `MYDATA.BANK_TRAIN`\
  \ 数据集。`METHOD` 语句指定了训练期间使用的方法。\n- `KERNEL` 选项设置为 `RBF`。`K_PAR` 选项指定了核参数。\n- `INPUT`\
  \ 语句指定了数值变量并将 `LEVEL` 分为间隔。如果数据集包含字符变量，它们将有一个单独的 `INPUT` 语句且 `LEVEL` 将设置为“nominal”。\n\
  - `TARGET` 语句指定了目标变量 `LEVEL` 设置为二。\n- `OUTPUT` 语句指定了将创建的输出数据集。\n\n输出 8.30 显示了 RBF\
  \ 模型的信息表。我们可以看到优化技术已改为“活动集”（Active Set），核函数现在是 RBF。该模型的最优惩罚参数为 1.0。\n\n输出 8.30：PROC\
  \ HPSVM RBG 模型输出\n\n![](img/Image1774.png)\n\n输出 8.31 显示了 RBF 模型的分类矩阵和拟合统计表。\n\n\
  输出 8.31：PROC HPSVM RBG 评估指标\n\n![](img/Image1781.png)\n\n![](img/Image1789.png)\n\
  \n## 神经网络\n\n\n\n\n神经网络无疑占据了机器学习新闻的头条。无论是图像识别、语音转文字、教机器人聊天、创造出一台能在多项游戏中击败世界冠军的机器，还是在人工智能领域取得突破，神经网络都是应对这些深度学习挑战的首选算法。\n\
  \n## 什么是深度学习？\n\n深度学习是指在海量数据上训练深层神经网络。它是在大极大数据集上应用多节点神经网络，目标是正确地分类或预测结果。\n\n图 8.13\
  \ 显示了增加更多数据和额外的隐藏节点对神经网络性能的提升。其他类型的机器学习程序在达到一定量的数据后会遇到瓶颈。但神经网络在接触到额外数据以及通过增加隐藏节点层来增加复杂度时，具有独特的能力，能够继续学习更多信息并做出更复杂的预测。\n\
  \n### 图 8.13：额外数据的性能提升\n\n![](img/Image1796.png)\n\n## 神经网络结构\n\n神经网络并不一定非常复杂。它们可以像标准的简单线性回归一样简单。图\
  \ 8.14 展示了一个简单的线性回归示例，使用单个预测变量（马力）来预测汽车价格。\n\n### 图 8.14：简单线性回归示例\n\n![](img/Image1803.png)\n\
  \n图中显示了一条简单的线性回归线，它在预测汽车价格方面表现良好。预测变量与目标值之间的关系可以用传统的线性回归方程表示。然而，我们也可以用另一种方式来表示这种关系。\n\
  \n图 8.15 以神经网络的形式表示了相同的方程。\n\n### 图 8.15：回归模型的神经网络形式\n\n![](img/Image1811.png)\n\
  \n对于该模型，神经元代表一个表示预测变量与目标变量之间关系的简单线性方程。这看起来似乎是线性回归模型的简单简化，但神经网络模型并不限于单个线性回归方程。我们可以将多个此类神经元堆叠在一起，以在许多预测变量与单个目标变量之间建立复杂的关系。\n\
  \n图 8.16 展示了一个具有四个输入特征和一层隐藏层节点的简单神经网络。\n\n### 图 8.16：隐藏节点示例\n\n![](img/Image1820.png)\n\
  \n我们仍然可以将初始结构看作一个简单的线性回归模型。我们有四个输入特征 (`x`) 试图预测输出特征 (`y`)。主要的偏差发生在图 8.16 的中间部分。这个空间就是隐藏节点出现的地方。我们并没有显式地告诉程序这些隐藏节点是什么。神经网络会自己找出答案。我们显式告诉程序的信息只有输入和输出特征。\n\
  \n神经网络可以评估所有可用特征，并创建代表这些特征汇总类别的隐藏节点。这个过程是神经网络自动执行的一种特征生成形式。在这个示例中，前两个特征是马力和防锁刹车。神经网络可能会发现这些特征内部的相似性，并创建一个代表“性能”的隐藏节点。这个新节点在直觉上是合理的，因为动力更强的车辆需要防锁刹车。\n\
  \n同样的方法可以在最后两个特征（安全评级和品牌/型号）中找到。这些特征的组合可以汇总以创建一个代表“豪华”的隐藏节点。这些隐藏节点随后被被用于预测结果变量。\n\
  \n在这个示例中，信息流是前向的。这种神经网络设计被称为多层感知器。神经网络可以被看作多个处理阶段，每个阶段由预测结果的线性模型泛化版本组成。\n\n如果这是一个简单的线性回归，方程将看起来像方程\
  \ 8.4。\n\n### 方程 8.4\nY ≈ β0 + β1 X1 + β2 X2 + β3 X3 + β4 X4\n\n系数权重如方程 8.4 所示。这些权重是隐藏节点的输入特征。图\
  \ 8.17 显示了这些节点如何输出预测结果变量的新加权特征。初始特征权重显示为连接隐藏节点的连接器。隐藏节点通过自己的权重生成新特征，并馈到最终预测中。\n\n\
  深度神经网络是具有额外隐藏节点层的算法。隐藏节点层越多，算法就越复杂，计算密集程度也越高。\n\n### 图 8.17：系数权重示例\n\n![](img/Image1829.png)\n\
  \n神经网络在预测结果变量之前还会执行最后一个技巧。在计算完每个隐藏单元的加权之和后，会对结果应用一个非线性函数。这个非线性函数通常是修正线性单元函数 (`ReLU`)\
  \ 或双曲正切函数 (`tanh`)。`ReLU` 函数强制预测结果大于零，而 `tanh` 函数的作用类似于逻辑回归的 logit 函数，强制预测结果处于 -1.0\
  \ 到 1.0 之间。这些激活函数允许神经网络学习到比简单线性回归模型复杂多的函数。\n\n## 神经网络的类型\n\n尽管所有不同类型神经网络的细节超出了本书的范围，但我们可以快速简述四种基本的神经网络类型：\n\
  \n*   标准型（前馈）—— 这就是上述的多层感知器模型。\n*   卷积型—— 卷积神经网络 (`CNN`) 设计用于识别图像。模型内部包含卷积，用于识别图像上识别的物体边缘。\n\
  *   循环型—— 循环神经网络 (`RNN`) 设计用于识别序列，例如语音信号或文本。\n*   混合型—— 这是一种包含卷积和循环特性的组合神经网络。这常见于自动驾驶汽车。\n\
  \n`CNN` 和 `RNN` 模型类型的差异总结在表 8.8 中。\n\n### 表 8.8：CNN 与 RNN\n\n| CNN | RNN |\n| :---\
  \ | :--- |\n| 固定大小的输入输出 | 任意长度输入输出 |\n| 前馈 | 使用内部内存处理任意序列 |\n| 使用神经连接模式 | 使用时间序列信息\
  \ |\n| 适用于图像和视频处理 | 适用于文本和语音分析 |\n\n## 神经网络模型\n\n`PROC NEURAL` 允许你在易用的框架内构建前馈多层感知器模型。程序\
  \ 8.17 展示了利用 `PROC NEURAL` 开发神经网络。\n\n### 程序 8.17：神经网络示例\n\n```\nPROC NEURAL DATA=MYDATA.BANK_TRAIN;\n\
  \ ARCHITECTURE MLP;\n INPUT &num_vars.;\n TARGET target / LEVEL=nom;\n HIDDEN 10;\n\
  \ HIDDEN 5;\n TRAIN;\n SCORE OUT=scored_NN;\nCODE FILE= ‘C:/Users/James Gearheart/Desktop/SAS\
  \ Book Stuff/Data/NN_Model.sas’;\nrun;\n```\n\n程序 8.17 说明：\n\n* `PROC NEURAL` 应用于\
  \ `MYDATA.BANK_TRAIN` 数据集。\n* `ARCHITECTURE` 设置为 `MLP`。该语句指定神经网络设计设计为多层感知器。\n* `INPUT`\
  \ 指定数值变量。如果数据集包含字符变量，则会包含另一个 `INPUT` 语句来指定字符变量。\n* `TARGET` 语句指定目标变量并将 `LEVEL` 设置为\
  \ `NOM`。这指定目标变量是名义变量，在这种情况下是一个二分类变量。\n\n\n\n\n# 引言\n\n*   此程序中有两个 `HIDDEN` 语句。第一个\
  \ `HIDDEN` 语句指定了第一个隐藏层中隐藏神经元的数量，第二个 `HIDDEN` 语句指定了第二个隐藏层中隐藏神经元的数量。因此，该程序有两个隐藏层，第一层有\
  \ 10 个神经元，第二层有 5 个神经元。\n*   `TRAIN` 语句促使 `PROC HPNEURAL` 使用训练数据来训练由 `ARCHITECTURE`、`INPUT`、`TARGET`\
  \ 和 `HIDDEN` 语句定义的神经网络模型。\n*   `SCORE` 语句结合 `OUT` 语句创建了初始训练数据的评分数据集。\n*   `CODE\
  \ FILE` 语句创建一个包含所有评分逻辑的 SAS 程序。该 SAS 程序可以应用于与训练数据结构相同的新数据集，以便对新观测值进行评分。\n\n## 神经网络模型输出\n\
  \n`PROC HPNEURAL` 提供了几个重要的输出表来评估模型的性能。`Model Information` 表提供了开发者所选超参数值的摘要。\n\n\
  输出 8.32 显示了我们开发的模型的 `Model Information` 表。该表指明该模型是基于 `MYDATA.BANK_TRAIN` 数据集构建的，且神经网络架构是多层感知器。我们开发了两个隐藏层，它们之间共有\
  \ 15 个隐藏神经元。\n\n紧随 `Model Information` 表之后的是数据使用情况摘要，显示了模型中读取和使用的观测值总数。它还提供了用于训练和验证的观测值数量细分。\n\
  \n输出 8.32: `PROC HPNEURAL` 输出\n\n![](img/Image1888.png)\n![](img/Image1900.png)\n\
  \n输出 8.33 显示了 `PROC HPNEURAL` 的 `Fit Statistics` 表。该表提供了训练集和验证集的绝对误差和误分类指标。\n\n\
  输出 8.33: `PROC HPNEURAL` 评估指标\n\n![](img/Image1907.png)\n![](img/Image1916.png)\n\
  \n## 评分算法\n\n在 `CODE FILE` 语句中创建的 SAS 代码可以包含在 `DATA` 步中对新观测值进行评分。程序 8.18 显示了代码文件在留集（hold-out\
  \ set）上的实现。\n\n程序 8.18: 使用 `PROC HPNEURAL` 评分数据集\n\n```\nDATA test_scored;\nSET\
  \ MYDATA.bank_test;\nINCLUDE 'C:/Users/James Gearheart/Desktop/SAS Book Stuff/NN_Model.sas';\n\
