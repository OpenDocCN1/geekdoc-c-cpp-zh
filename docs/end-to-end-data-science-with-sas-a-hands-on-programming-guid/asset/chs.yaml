  \ 数据集计算出的 RMSE 值。\n\n#### 表 2.9：模型 RMSE 表\n\n![](img/Image1369.png)\n\n敏锐的读者可能会在这里停下来并指责我进行不公平的比较。线性回归模型是一个变量较少的简洁模型。如果我们减少简单决策树中的变量呢？那么它们的比较将会如何？幸运的是，我这种以数据为中心的强迫症迫使我根据相对变量重要性的前十个变量构建一个简单决策树，以便与线性回归模型进行比较。\n\
