  \ | 2,777 | 7.19 | 12.15% | 22.28% | 5.01% | 9.1% |\n\n### 群体稳定性指数 (PSI)\n\n`Population\
  \ Stability Index` 衡量变量的分布，并将其与不同时期的同一变量分布进行比较。这一指标之所以有价值，是因为我们需要知道变量的分布是否随时间而变化。如果它随时间变化，那么你开发的模型在不同时期将不再有效。\n\
  \n在你根据不同时期开发了独立的模型和样本（OOT）数据集后，按照以下步骤计算 PSI：\n\n1. 使用 `PROC RANK` 将数值变量划分为模型和 OOT\
  \ 数据集中相等数量的桶。通常设置为十个桶以创建十分位数分类。\n2. 计算模型样本每个桶的记录百分比。\n3. 获取模型样本中区间的截断点。\n4. 将截断点应用于\
  \ OOT 样本。\n5. 创建 OOT 样本的分布。\n6. 从模型和 OOT 数据集中收集到的统计数据计算 PSI。\n\n表 9.5 显示了一个示例 PSI\
  \ 表。\n\n#### 表 9.5: 群体稳定性指数表\n\n![](img/Image989.png)\n\n\n\n\n\n# 等式 9.14：群体稳定性指数（PSI）公式\n\
  \n![](img/Eq9.14.1.jpg)\n\n例如，顶行的 PSI 可以按如下计算：\n\n![](img/Eq9.14.2.jpg)\n\n计算出的\
  \ PSI 的各个分箱被汇总，以为该变量创建一个单一的 PSI 指标。该指标可以根据以下经验法则进行解释：\n\n- `<0.1`: 变化非常微\n- `0.1-0.2`:\
  \ 有较小变化\n- `>0.2`: 显著变化\n\n图 9.5 显示了上述示例 PSI 输出的图形演示。变量 `acc_open_past_24mths` 的整体\
  \ PSI 为 `0.001453`。这远低于表明显著变化的范围，因此我们可以确定该变量在建模和 OOT（样本外测试）时间范围内是稳定的。\n\n图 9.5：PSI\
  \ 宏输出\n\n![](img/Image9961.png)\n\n该信息表和输出图是由由 Alec Zhixiao Lin 创建的一个优秀宏生成的。我已将此宏包含在\
  \ GitHub 仓库中，并将其标记为“PSI Macro”。有关群体稳定性指数和此宏开发的更多信息，请查看 Alec 的优秀论文，名为“Examining Distributional\
  \ Shifts by Using Population Stability Index (PSI) for Model Validation and Diagnosis”。\n\
  \n## 黑盒评估工具\n\n黑盒模型是指我们无法准确说明某个值是如何生成的模型。这种洞见的缺乏可能是因为模型内部的随机化（例如随机森林），也可能是因为目标值的偏移和系数的不断重新平衡（例如梯度提升），或者可能是因为具有变化权重是非线性模型的复杂隐藏层（例如神经网络），也可能是由于其他几个因素。\n\
  \n由于在模型开发期间会发生这些神秘的过程，学术和组织模型审查委员会都必须特别关注黑盒模型。为了理解影响因素以及这些因素的重要性，我们必须能够开发评估方法，使我们能够理解最终输出值是如何确定的。\n\
  \n## 变量重要性\n\n尽管我们可能无法确定变量对输出变量开发的确切影响（例如回归模型中的系数权重），但仍然可以创建一个重要性指标，告诉我们黑盒模型中每个变量的相对重要性。\n\
  \n变量重要性表通常作为树结构模型的输出。在评估随机森林和梯度提升算法中的变量时，此输出非常有帮助。\n\n表 9.6 显示了变量重要性表。该表提供了关于每个变量在模型中的能力及其预测目标变量相对重要性的关键信息。记住，最关键的变量可能不在树的顶端。变量重要性通过四个指标确定：\n\
  \n- `Count` – 变量被用分裂规则的次数。\n- `Surrogate Count` – 变量被用于替代分裂规则的次数。\n- `Reduction\
  \ in RSS`（残差平方和的减少）– 当在节点发现分裂时，残差平方和的变化。\n- `Relative Importance`（相对重要性）– 个变量基于\
  \ RSS 的重要性除以最大 RSS 重要性。\n\n表 9.6：变量重要性表\n\n![](img/Image1345.png)\n\n变量重要性可以解释为根据每个预测因子对模型的贡献对其进行排名。`0.000`\
  \ 的相对重要性可以解释为：由于该变量从未被用于分割列，因此它对模型的预测价值没有贡献。\n\n变量重要性可以用作变量减少技术。由于该表根据变量的用性对其进行了排序，数据科学家可以根据其相对价值选择保留哪些变量，以构建更精简的模型。\n\
  \n## 部分依赖性（PD）图\n\n我们需要向任何模型审查者回答的最关键问题之一是：“模型输入与预测之间存在什么关系？”这个问题对于回归模型和简单决策树等透明模型很容易回答，但对于黑盒模型来说变得困难得多。我们知道输入是什么，由于变量重要性图，我们知道哪些变量是模型预测的最强驱动因素，但我们仍然需要能够表达模型输入与预测值之间的实际关系。\n\
  \n部分依赖图（PD Plots）是描述模型输入与其输出之间函数关系的图。此图可以显示单个变量与预测之间的关系是线性关系、阶梯函数还是其他关系。\n\nPD 图试图解释模型预测如何随输入值的变化而变化。这些图被称为“模型无关”（model\
  \ agnostic），因为它们可以适用于各种模型设计。PD 图是一种事时的模型解释方法，因为它展示了当输入发生变化时模型的行为，但它没有评估模型是如何创建预测的。\n\
  \nPD 图简单地为每个输入变量的值绘制平均预测值。此图是一个简单的图表，直观地展示了输入变量与预测之间的关系。\n\nSAS 首席机器学习开发者 Ray Wright\
  \ 在他的论文中提供了优秀的解释和配套的 SAS 代码，论文名为“Interpreting Black-Box Machine Learning Models\
  \ Using Partial Dependence and Individual Conditional Expectation Plots”。该论文和配套宏可以在我的\
  \ GitHub 仓库中找到。\n\n让我们使用 Ray 的名为 `%PDFunction` 的 PD 图宏开发一个示例。该示例将在第 8 章使用的 `MYDATA.BANK_TRAIN`\
  \ 数据集上开发。\n\nPD 图允许我们不仅检查预测因子与输出之间的关系，还可以允许我们比较模型设计之间的差异。例如，程序 9.6 在 `MYDATA.BANK_TRAIN`\
  \ 数据集上使用少量预测因子开发了一个简单的决策树。\n\n一旦从 Ray 的论文或我的 GitHub 网站下载了宏并运行，就可以适当规范应用 `%PDFunction`\
  \ 宏。\n\n程序 9.6：部分依赖宏\n\n```sas\nproc hpsplit data=MYDATA.BANK_TRAIN leafsize = 10;\n\
  \ target / level = interval;\n input age pdays pout_succ contact_tele\npout_non\
  \ contact_cell previous / level = int;\n code='C:/Users/James Gearheart/Desktop/SAS\
  \ Book Stuff/Data/treecode.sas’;\nrun;\n\n%PDFunction( dataset=MYDATA.BANK_TRAIN,\
  \ target=target, PDVars=age,\notherIntervalInputs=pdays pout_succ contact_tele pout_non\
  \ contact_cell previous, otherClassInputs=,\nscoreFile='C:/Users/James Gearheart/Desktop/SAS\
  \ Book Stuff/Data/treecode.sas’, outPD=partialDependence );\n\nproc sgplot data=partialDependence;\n\
  series x = age y = AvgYHat;\nrun;\n```\n\n`%PDFunction` 使用存储的建模代码并在宏中定义的变量创建 PD\
  \ 输出数据集。最后一步是应用折线图来可视化 PD 输出中开发的关系。\n\n输出 9.7 显示了变量 `age` 与目标变量之间的关系。我们可以看到这种关系是一个阶梯函数。\n\
  \n输出 9.7：部分依赖图\n\n![](img/Image1012.png)\n\n为了比较模型设计，我们可以创建一个新模型并对其应用 PD 图宏，以便我们能够检查相同的两个变量之间的关系，但这种关系是通过新模型定义的。\n\
  \n\n\n\n\n程序 9.7 在 `MYDATA.BANK_TRAIN` 数据集上开发了一个神经网络模型，使用了与我们在决策树示例中相同的输入变量。模型输出代码被输入到\
  \ `%PDFunction` 宏，并生成了一个折线图来显示相同输入变量与目标变量之间的关系。\n\n### 程序 9.7：部分依赖性宏示例\n\n```\n\
  PROC HPNEURAL DATA=MYDATA.BANK_TRAIN;\nARCHITECTURE MLP;\nINPUT age pdays pout_succ\
  \ contact_tele \npout_non contact_cell previous;\nTARGET target / LEVEL=nom;\nHIDDEN\
  \ 10;\nHIDDEN 5;\nTRAIN;\nSCORE OUT=scored_NN;\nCODE FILE= ‘C:/Users/James Gearheart/Desktop/SAS\
  \ Book Stuff/Data/NN_Model.sas’;\nrun;\n```\n\n```sas\n%PDFunction( dataset=mydata.bank_train,\
  \ target=target, PDVars=age, \notherIntervalInputs= pdays pout_succ contact_tele\
  \ pout_non contact_cell previous, otherClassInputs=, \nscorecodeFile='C:/Users/James\
  \ Gearheart/Desktop/SAS Book Stuff/Data/NN_Model.sas’, outPD=partialDependence );\n\
  proc sgplot data=partialDependence;\nseries x = age y = AvgYHat;\nrun;\n```\n\n\
  输出 9.8 显示神经网络模型在两个变量之间建立了一种平滑的关系。两个模型的整体关系方向相似。平均目标值在较低年龄段处于中间位置，然后在中等年龄段显著下降，随后在年较大的年龄段又显著增加。两个模型及其相关的\
  \ PD 图讲述了相同的故事，但我们可以很容易地看出，模型之间的函数关系是不同的。\n\n### 输出 9.8：部分依赖图\n\n![](img/Image1019.png)\n\
  \n### 个体化条件期望 (ICE) 图\n\n与部分依赖图密切相关的一个概念是个体化条件期望（Individual Conditional Expectation，简称\
  \ ICE）图。ICE 图允许数据科学家深入挖掘变量之间的关系，并发现模型输入之间的子组和交互作用。\n\nPD 图检查了目标变量的平均值并将其与给定变量的值进行比较。ICE\
  \ 图则深入到单个观测层面。查看单个观测值的图可能会让人眼目缭乱。对于即使只有一百个观测值的数据集，要理解一张包含一百条不同折线图的图也是挑战性的。这就是为什么\
  \ ICE 图会对单个观测值进行采样或聚类。\n\n在上述“部分依赖性”部分中引用的 Ray Wright 论文中，Ray 还提供了一个用于开发 ICE 图的宏（感谢\
  \ Ray！）。该宏也可以在本书 GitHub 仓库中找到。\n\n程序 9.8 显示 `%ICEPlot` 宏是 `%PDFunction` 宏的延续。一旦你运行了\
  \ `%PDFunction` 宏，`%ICEPlot` 宏将采用相同的数据、输入特征和模型预测作为输入来开发 ICE 图。\n\n### 程序 9.8：个体化条件期望宏调用\n\
  \n```sas\n%ICEPlot( ICEVar=age, samples=10, YHatVar=p_target1 );\n```\n\n调用 `%ICEPlot`\
  \ 宏只需几条语句。你只需要指定绘图变量、采样的观测数量以及预测变量。\n\n输出 9.9 显示了由神经网络模型创建的 ICE 图输出。\n\n### 输出 9.9：个体化条件期望图\n\
  \n![](img/Image1026.png)\n\n我们可以看到，尽管我们指定了十个单独观测值，但图中只代表了四个。这种差异是因为某些观测值相互重叠。该图告诉我们，在某些情况下预测值受年龄的影响，但顶部的线表明某些年龄并不影响预测值。\n\
  \n如果我们样本数量增加到五十，将会得到一张像输出 9.10 那样的图。\n\n### 输出 9.10：个体化条件期望图\n\n![](img/Image1034.png)\n\
  \n这张图清楚地显示了预测值作为年龄函数的观测值与预测值不受年龄影响的观测值之间存在区别。\n\n## 本章总结\n\n本章可能是书中最重要的一章。这是因为评估指标是我们对所产生的数据科学产品负责的一种方式。适当开发的评估指标可以揭示我们所有的错误假设、数据错误和偏见。如果在模型开发过程的每个阶段都进行了适当的评估，那么在项目结束时就不应该有意外。\n\
  \n我们通常可以通过可视化数据分布来判断模型拟合数据的良坏程度。我们还可以创建连续目标变量的直方图和二分类目标变量的频率分布，以对模型性能获得某些洞察。我们可以查看预测变量的散点图和条形图，观察它们与目标变量之间的关联有多强。这些评估是在任何建模之前进行的。\n\
  \n到此时，你应该对预测变量与目标变量之间关系的强度有很好的了解。强关联表明预测模型将产生准确的预测，而弱关联则表明预测模型将产生较差的预测。\n\n模型开发的下一个阶段是模型的初始构建。通过\
  \ `AIC` 或 `BIC` 等评估指标，我们可以确定回归模型中预测变量对模型结果的影响；而对于分类模型，我们可以通过 `Variable Importance`（变量重要性）指标获得同样的洞察。这两种技术以及其他技术都可以让我们了解在建模算法限制范围内目标变量是如何与预测变量变量的。目标变量与预测变量之间关系的强度可以在模型开发的这一阶段再次进行评估。\n\
  \n最后，在 `TRAIN` 数据集上开发的模型被应用于留出的 `TEST` 数据集。应用于留出 `TEST` 数据集的评估指标将决定你的整体模型拟合情况。这些指标通常是回归模型的\
  \ `RMSE` 和分类模型的 `Gini`。\n\n"
