  \ | 1,404 | 1,380 | 2,784 | | | | | | | | | | | | |\n\n我们可以看到，应用于留存 `TEST` 数据集的神经网络模型的\
  \ Gini 系数为 `48.19`。该模型与基于树的模型具有竞争力，仅次于随机森林 `51.60` 的 Gini 系数。\n\n## 章节总结\n\n本章涵盖了内容。在整个章节中，我们看到了从高解释性模型（如简单决策树）到日益透明的黑箱模型的转变。\n\
  \n\n\n\n\n数据源说明通常以电子表格或 Word 文档的形式存在。它包含了评审人员理解的所有信息，以便了解你将使用什么类型的数据、可以在何处找到数据以及数据量的一些指示。\n\
  \n## 数据字典\n\n评审人员需要的另一项关键信息是数据字典。数据字典是模型中使用的所有变量的摘要。某些模型治理机构要求你为模型考虑过的所有变量提交数据字典，而其他模型治理机构则仅要求对最终模型保留的变量提供数据字典。\n\
  \n表 9.2 显示了数据字典的一般结构。\n\n### 表 9.2：数据字典结构\n![](img/Image736.png)\n\n该表显示了数据集中表示变量名称、实际业务名称（数据资产的通用语言名称）以及变量的定义。\n\
  \n## 变量摘要\n\n我们将涉及的最后几项通用信息是变量摘要、统计数据和图表。这些信息为评审人员提供了关于你数据集中每个变量的详细信息。\n\n我们将使用在第\
  \ 2 章中开发的 Airbnb 数据集来演示变量摘要。该数据集包含连续型数值变量和分类字符变量。对于数值变量，我们可以运行简单的 `PROC MEANS` 来获取这些变量的概览。程序\
  \ 9.1 开发了数值变量摘要。\n\n### 程序 9.1：数值变量摘要\n```\nPROC MEANS DATA=TRAIN N NMISS MIN MAX\
  \ MEAN STDDEV;\n```\n```\n VAR price bedrooms bathrooms accommodates square_feet;\n\
  ```\n```\nRUN;\n```\n\n此程序为了演示目的仅提取了几个选定的数值变量。使用的数据是未经过缺失值、离群值或特定值限制处理的原始数据。输出 9.1\
  \ 显示了数据输出。\n\n### 输出 9.1：少数选定变量的变量摘要\n![](img/Image745.png)\n\n原始数据显示了缺失值和较大的标准差。模型评审人员需要知道在数据进行任何处理之前数据是什么样子的。\n\
  \n一旦数据经过处理，你可以提供最终建模数据集的另一个变量摘要。该摘要为模型评审人员提供了建模数据集在处理前后的对比。输出 9.2 显示了应用于最终建模数据集的相同\
  \ `PROC MEANS`。\n\n### 输出 9.2：最终建模数据集的变量摘要\n![](img/Image753.png)\n\n通过评估数据处理前后的对比，模型评审人员可以很容易地看到不再有缺失值，目标变量\
  \ `price` 被设置了阈值，标准差已显著降低，并且变量 `square_feet` 由于存在大量缺失值而被移除。\n\n对于目标变量等关键变量，可能需要额外的分析。这种分析将包括对变量的统计审查。最常用的方法是对目标变量创建\
  \ `PROC UNIVARIATE`。程序 9.2 开发了 `price` 变量的统计分析。\n\n### 程序 9.2：目标变量的单变量分析\n```\n\
  PROC UNIVARIATE DATA=train_final;\n```\n```\n VAR price;\n```\n```\n HISTOGRAM;\n\
  ```\n```\n RUN;\n```\n\n`PROC UNIVARIATE` 的输出在第 2 章和第 3 章中都经过审查，因此请参考这些章节获取更多关于输出解释的细节。模型评审人员通常会检查输出\
  \ 9.3 显示的 `Moments` 和 `Basic Statistical Measures` 表。\n\n### 输出 9.3：PROC UNIVARIATE\
  \ 输出\n![Output 9.13 – PROC UNIVARIATE Output](img/Image760.png)\n\n对于字符变量，`PROC\
  \ FREQ` 将提供有关每个字符变量类别数量和每个类别数量的必要信息。程序 9.3 显示了一个示例 `PROC FREQ` 语句。\n\n### 程序 9.3：字符变量分析\n\
  ```\nPROC FREQ DATA=train_final;\n```\n```\n TABLES _CHARACTER_;\n```\n```\n RUN;\n\
  ```\n\n模型评审人员可能需要的最后一条信息是一组变量分布的图形化描述。这种图表通常并不是所有变量都需要的，但为目标变量和几个关键预测变量生成图形化分布是常见的。\n\
  \n| 输出 9.4：少数关键变量的图形化分布![](img/Image796.png) | 程序 9.2 中的 `PROC UNIVARIATE` 包含一个\
  \ `HISTOGRAM` 语句，它产生了输出 9.4 所示的数据图形化分布。目标变量的这种视图允许模型评审人员看到该变量是右偏的，大部分值分布在每晚 $50\
  \ 到 $150 之间。 |\n\n## 模型输出\n\n学术审查和组织模型治理将要求对模型如何开发进行详细描述。你可以使用用于学术目的的标准模板，大多数机构都有需要你填写的详细表格。这些表格将引导你详细说明你的开发过程。这些表格的某些部分将要求你提供模型概述信息和模型评估指标。本节将侧重于引导你解释最常见的模型指标，以及模型概述部分预期的内容。\n\
  \n### 模型概述\n\n模型开发完成后，我们就可以提供关于模型某些特征的详细信息。如果开发的模型是线性回归、逻辑回归或简单的决策树，那么我们可以提供类似于表\
  \ 9.3 的模型概述表。\n\n### 表 9.3：模型概述表\n![](img/Image806.png)\n\n此表对于“白盒”模型非常有用。这些模型允许我们精确地了解模型内部变量层面的情况。因此，我们可以列出相关变量，并提供关于每个变量的信息，例如系数值、基于\
  \ Wald 卡方值的百分比贡献、变量描述、变量与目标变量之间关系的方向，以及定义该变量如何与目标变量作用的业务描述。\n\n“黑盒”模型将需要我们在本章中探索的替代解释方法。\n\
  \n### 准确率统计\n\n模型准确性指标可以分为两类：回归和分类。回归模型包含一个连续数值目标变量，而分类模型包含一个分类目标变量。由于这种差异，评估模型准确性的方法取决于正在使用哪种模型设计。\n\
  \n## 回归模型\n\n在回归模型的构建和审查期间，我们需要检查模型准确性的不同阶段。在构建阶段，我们需要评估训练误差率，该误差率将实际观测值与预测值进行比较（例如\
  \ `MAE` 和 `RMSE`）。一旦给定的误差指标最小化，我们还需要确定在一系列模型中，哪一个在测试集上表现最好（例如 `AIC` 和 `BIC`）。最后，一旦选定了模型，我们还需要确定模型的整体准确性（例如\
  \ `R2` 和 `Adjusted R2`）。\n\nRSS, `MAE`, `MSE`, `RMSE` 和 `MAPE`\n\n\n\n\n\n在第 6 章中，我们回顾了线性回归模型，并引入了准确性指标主题，例如残差平方和\
  \ (`RSS`)）。`RSS` 简单来说实际值与预测值之差的平方和。公式 9.1 显示了 `RSS` 的计算公式。该指标用于构建回归模型的系数权重。这些权重是在\
  \ `RSS` 最小处被选出的。\n\n公式 9.1：残差平方公式\n\n![](img/Eq9.1.jpg)\n\n虽然这是我们理解模型预测准确性时需要计算的一个重要误差指标，但它绝不是我们通过实际值与预测值之差计算出的唯一误差指标。\n\
  \n图 9.1 展示了一个样本数据集实际值与预测值的对比示例。\n\n图 9.1：实际值 vs. 预测值\n\n![](img/Image813.png)\n\n\
  ### 平均绝对误差 (MAE)\n平均绝对误差 (`MAE`) 是通过取实际值与预测值之差的绝对值计算的。\n\n公式 9.2：平均绝对误差公式\n\n![](img/Eq9.2.jpg)\n\
  \n该指标减轻了离群值对模型性能指标的影响，因为每个残差对总误差的贡献成正比。这意味着离群值对整体误差的贡献是线性的。\n\n###均方误差 (MSE)\n均方误差\
  \ (`MSE`) 可以被视为 `RSS` 和 `MAE` 方法的结合。该公式采用了 `RSS` 公式并将其除以观测值的总数。\n\n公式 9.3：均方误差公式\n\
  \n![](img/Eq9.3.jpg)\n\n由于我们对项的差进行了平方处理，`MSE` 几乎总是大于 `MAE`。由于 `MAE` 和 `MSE` 的计算方式不同，我们无法公平地比较这两种结果。对于\
  \ `MSE` 指标，平方项放大了离群值的影响。这意味着误差项相对于离群值将呈二次方增长。\n\n### 均方根误差 (RMSE)\n均方根误差 (`RMSE`)\
  \ 是 `MSE` 指标的平方根。该指标将单位归一化为使其与目标变量相同的尺度。如果说 `MSE` 可以认为是模型的方差，那么 `RMSE` 就可以认为是模型的标准差。\n\
  \n公式 9.4：均方根误差公式\n\n![](img/Eq9.4.jpg)\n\n### 平均绝对百分误差 (MAPE)\n平均绝对百分误差 (`MAPE`)\
  \ 是通过将 `MAE` 转换为百分比计算的。`MAPE` 的主要优点是人们理解百分比，因此该指标的解释更容易容易理解。我们仍然得到了离群值与整体误差之间的线性关系，就像\
  \ `MAE` 一样。如果说 `MAE` 是模型产生的误差平均幅度，那么 `MAPE` 就是模型预测值与其相应输出之间的平均偏差程度。\n\n公式 9.5：平均绝对百分误差公式\n\
  \n![](img/Eq9.5.jpg)\n\n### Mallow’s Cp, AIC 和 BIC\n当我们构建回归模型时，选择了一种方法来指定变量如何添加到模型中。可能的方法包括全选择、前向选择、后选择和逐步选择。每种方法都会产生一组包含不同数量预测变量子集的模型。我们可以使用上一节讨论过的模型误差指标（`MAE`、`MSE`、`RMSE`、`MAPE`）在训练数据集上评估模型误差。\n\
  \n这些指标对于确定训练数据的最佳模型是有益的。然而，我们是根据测试（TEST）数据来选择整体最佳模型的。为了评估测试数据集上的误差指标，我们可以创建独立的留出测试数据集并调查这些数据集上的准确性统计，或者我们可以根据模型大小调整训练误差，这将模拟测试数据集的性能指标。这种方法可以帮助我们在一组具有不同变量的模型中选出最佳模型。\n\
  \nMallows’s `Cp` 在训练 `RSS` 中增加了一个惩罚因子，以调整训练误差低估测试误差的情况。公式 9.6 显示 Mallows’s `Cp`\
  \ 增加了 `2dσ̂2` 的惩罚因子。\n\n公式 9.6：Mallows’s Cp 公式\n\n![](img/Eq9.6.jpg)\n\n该惩罚因子有两个主要影响：\n\
  1. 随着模型中变量变量（由 `d` 表示），惩罚增加。\n2. `σ̂2` 项是与每个响应测量相关的误差方差的估计。\n\n`Cp` 统计量可以解释为“越低越好”。这种解释是因为对于测试误差较低的模型，`C_p`\
  \ 的值往往较小。\n\n赤池信息准则 (`AIC`) 的功能与 Mallows’s `Cp` 统计量相似。公式 9.7 显示 `AIC` 与 `Cp` 统计量之间的区别在于\
  \ `AIC` 分母中包含了方差。\n\n公式 9.7：赤池信息准则公式\n\n![](img/Eq9.7.jpg)\n\n`AIC` 的另一种公式形式见公式\
  \ 9.8。\n\n公式 9.8：AIC 的另一种公式形式\n\n```\nAIC = –2 ln (L) + 2k\n```\n\n这种方法强调了 `AIC`\
  \ 使用模型的最大似然估计（对数似然）作为拟合度量（其中 `L` 是似然，`k` 是参数个数）。\n\n`AIC` 可以以与 Mallows’s `Cp` 相同的方式进行解释。越低越好。\n\
  \n贝叶斯信息准则 (`BIC`) 得出了与 Mallows’s `Cp` 非常相似的结果。`BIC` 将 Mallows’s `Cp` 中的 `2dσ̂2`\
  \ 替换为 `log (n)σ̂2`。这种替换使得 `BIC` 对变量更多的模型施加了更重的惩罚，与 Mallows’s `Cp` 和 `AIC` 相比，结果更为保守。\n\
  \n公式 9.9：贝叶斯信息准则公式\n\n![](img/Eq9.9.jpg)\n\n### R2 和 调整 R2\n上述指标允许我们在范围内评估并选择最佳模型。但我们如何评估模型拟合度呢？对于回归模型，模型拟合度通常由包括\
  \ `R2` 和调整 `R2` 在内的多种指标衡量。\n\n`R2` 指标代表模型解释观测值变化的百分比。公式 9.10 显示 `R2` 是通过残差平方和 (`RSS`)\
  \ 与总平方和 (`TSS`) 的比例计算的。\n\n公式 9.10：R2 公式\n\n![](img/Eq910.jpg)\n\n人们很容易使用这个指标来评估模型，因为它直观易懂。然而，`R2`\
  \ 指标存在固有问题：\n- 当向模型中添加更多预测变量时，`R2` 指标总是增加。即使这些预测变量与目标变量没有关系随机变量也是如此。\n- `R2` 指标可能会误导强度。它并不衡量拟合优，在模型完全正确时可能人为偏低。如果数据的标准差很大，这将驱动\
  \ `R2` 趋于零，即使模型是正确指定的。\n- 当模型是错误的时，`R2` 指标可能会人为偏高。这通常发生在数据明显非线性时，通过数据散点图可以证明。穿过数据的直线可能会捕捉许多观测值并产生高\
  \ `R2` 值，但最合适的模型是非线性方法。\n- 如果你改变了预测变量的范围，会对 `R2` 值产生巨大影响。\n\n回归模型构建过程的一个关键组成部分是，模型试图减少训练数据集的\
  \ `RSS` 值。它通过调整模型系数来实现这一点，并选择导致训练 `RSS` 最小的系数。\n\n\n\n\n\n与其使用 `R2`，你可以使用 `Adjusted\
  \ R2`（调整后 R2）。该误差指标会对模型中添加的每一个额外项对 `R2` 进行惩罚。因此，你无法仅仅通过向模型中添加更多特征来人为提高模型性能。`Adjusted\
  \ R2` 要求每个新增的特征必须为模型增加显著的预测能力，以克服基于自由度的固有调整。\n\n### 方程 9.11：调整后 R2 公式\n\n![](img/Eq9.11.jpg)\n\
  \n方程中的 `d` 项代表模型中的变量数量。当方程 `9.11` 的分子最小化时，`Adjusted R2` 达到最大值。该方程表明 `Adjusted R2`\
  \ 指标会对模型中包含不当变量的情况进行惩罚。\n\n对于大多数回归设计，SAS 为上述审查的每个统计量提供了详细输出。这些统计量包括如图 9.2 所示的图形表示。\n\
  \n### 图 9.2：拟合标准图表\n\n![](img/Image821.png)\n\n图形表示法为每个模型拟合统计量提供了一个易于理解的概述。这些图表告诉我们，对于\
  \ `R2` 和 `Adjusted R2`，值越高越好；对于其余拟合指标，值越低越好。SAS 还包含一个指示（图上的星号），显示了预测变量数量产生最低 `RSS`\
  \ 值的位置。\n\n### 方差膨胀因子 (Variance Inflation Factor)\n\n此测试衡量了由于模型中其他独立变量导致独立变量方差的增加。方差膨胀因子测试通过\
  \ `REG` 程序中的 `VIF` 产生。虽然设置 `VIF` 阈值的问题因项目而异，但一个好的经验法则是模型中每个变量的 `VIF` 应该小于 5。\n\n\
  程序 `9.4` 显示了包含在 `PROC REG` 模型中的 `VIF` 语句。\n\n```\nPROC REG DATA=train_final;\n```\n\
  \n```\n MODEL price_log = r_entire log_accom n_manhattan \n```\n\n```\n p_group1\
  \ log_bath poly_accom / SELECTION=STEPWISE\n```\n```\n SLE=0.1 SLS=0.1 INCLUDE=0\
  \ COLLIN VIF;\n```\n```\n RUN;\n```\n\n`PROC REG` 模型的标准输出包含 `Parameter Estimates`（参数估计）表。由于我们在程序中包含了\
  \ `VIF` 语句，最后一列包含了 `VIF` 值。\n\n### 输出 9.5：PROC REG 参数估计输出\n\n![](img/Image8291.png)\n\
  \n### 分类模型\n\n| ![](img/Image1022.png) | 进入该领域的新数据科学家在评估分类模型性能时经常犯一个常见的错误。即，他们只检查训练集和测试集的分类准确率或误分类率。虽然这个指标很重要，但它可能会通过误导性的评分给你带来虚假的成就感。例如，如果你有一个不平衡的数据集，其中事件率仅占总观测次数的\
  \ 1.3%，那么简单地预测所有观测值均为非事件，很容易获得较低的误分类率。在这种情况下，你的准确率将达到 98.7%。在许多情况下，在不平衡数据集上构建的模型会导致对多数类别的偏差。\
  \ |\n\n更好的方法是创建一个平衡的数据集，使得你的训练数据集中事件和非事件的数量相等。如果你的数据集足够大，你可以简单地提取所有事件，并对非事件进行随机采样，样本大小相当于事件种群的大小。如果你的种群不够大，你可以通过放回抽样创建自助数据集以增加你的种群规模。\n\
  \n请记住，训练/测试划分必须在创建平衡数据集之前进行。这是因为你将在平衡的训练数据集上构建模型，但最终的准确性评估必须由包含真实事件率的留出测试数据集决定。\n\
  \n### 分类准确率与误分类率\n\n分类准确率简单是指正确预测次数与总观测次数的比率。方程 `9.12` 显示了这一计算。\n\n### 方程 9.12：分类准确率\n\
  \n![](img/Eq9.12.jpg)\n\n误分类率代表错误预测次数与总观测次数的比率。方程 `9.13` 显示了这一计算。\n\n### 方程 9.13：误分类率\n\
  \n![](img/Eq9.13.jpg)\n\n在平衡数据集上，这些指标可以提供模型性能的良好概述。\n\n## 分类矩阵与错误率\n\n分类矩阵（也称为混淆矩阵）是一个信息表，显示了\
  \ 2X2 矩阵，表示给定组别的实际观测值数量以及被归类为给定组别的预测值数量。这些值允许研究人员确定模型预测正确的次数和预测错误的次数。\n\n如果一个观测值的实际值为\
  \ 1，且该观测值的预测值被归类为 1，那么就是准确的预测。然而，当实际值为 0 且模型预测为 1 时，则是一个错误的预测。相反方向也是如此。\n\n图 `9.3`\
  \ 显示了分类矩阵。\n\n### 图 9.3：分类矩阵\n\n|  | 预测阳性 | 预测阴性 |  |\n\n| 真阳性 | TP | FN | 阳性条件\
  \ |\n\n| 真负性 | FP | TN | 阴性条件 |\n\n|  | 预测阳性条件 | 预测阴性条件 | 总种群 |\n\n| 分类准确率 | =(TP+TN)/Total\
  \ Pop |\n\n| 误分类率 | =(FP+FN)/Total Pop |\n\n|  |  |\n\n| 回回率 (Sensitivity) | =TP\
  \ / 阳性条件 |\n\n| 精密度 (Specificity) | =TP / 预测阳性 |\n\n| F1 分数 | =2 / ((1/Recall) +\
  \ (1/Precision)) |\n\n图 `9.3` 显示了分类矩阵可以用于开发分类模型的关键指标。这些指标比总体错误率提供了更多信息。\n\n- 假阳性\
  \ (`FP`) 单元也被称为第一类错误。\n- 假阴性 (`FN`) 单元也被称为第二类错误。\n- 真阳性率也被称为 `Recall` 或 `Sensitivity`。该值回答了：“当实际为阳性时，模型预测为阳性的概率是多少？”\n\
  - 假阳性率计算为 `(1- Specificity)`。该值回答了：“当实际为阴性时，模型预测为阳性的概率是多少？”\n- 预测预测值也被称为 `Precision`\
  \ 或 `Specificity`。该值回答了：“当预测为阳性时，实际为阳性的概率是多少？”\n- `F1 分数` 是真阳性率和真阴性率的加权平均值。\n\n\
  ### 受者工作特征曲线 (ROC) 与曲线下面积 (AUC)\n\n分类模型中的一种常用方法是创建一个 `0.5` 的概率阈值，并将任何大于或等于阈值的观测值判定为阳性，将任何小于阈值的观测值判定为阴性。这是一个合理的起点；然而，并没有硬性规定阈值必须是\
  \ `0.5`。我们可以选择 0 到 1 之间的任何值。在所有可能的选择中，我们如何确定哪个点是设置阈值的最佳位置？\n\n\n\n\n\n| 图 9.4: ROC\
  \ 曲线![](img/Image915.png) | ROC 曲线是 0 到 1 之间所有可能选择的可视化表示。该图在 y 轴上显示真阳率（敏感性），在 x\
  \ 轴上显示假阳性率（1-特异性）。图 9.4 显示了一个样本 ROC 图形。x 轴和 y 轴的范围均为 0 到 1。平分图的对角线代表真阳率等于假阳性率的点。也就是说，跨越对角线的每个位置，概率均为\
  \ 50%（掷硬币）。该线上的任何一点都意味着正确分类样本的比例与错误分类样本的比例相等。 |\n\n### 受试者工作特征 (ROC) 曲线\n\n曲线代表模型在不同阈值下的概率评分。因此，`ROC`\
  \ 是一条概率曲线。最优阈值点可以在曲线靠近左上角的最高点处确定。该位置是平衡点，在此处真阳率最大化的同时假阳性率最小化。\n\n`AUC` 是 `ROC` 概率曲线下的面积。这一指标告诉我们分离性的程度或衡量。`AUC`\
  \ 越高，模型区分正样本和负样本的能力就越强。\n\n### Gini 分数\n\n`Gini score`（称为 Somers’ D 分）通过 `2 * AUC\
  \ -1\\` 计算。该公式为我们提供了一个单一指标，代表二分类分类模型分离类别的良好坏程度。\n\n取决于你所研究的主题，`Gini score` 有不同的解释方式。对于营销模型来说，40\
  \ 分可能是弱的，但对于临床模型来说可能很强。为了我构建营销和风险模型的目的，我开发了表 9.4，它提供了一个非常广泛的经验来解释你的 `Gini score`\
  \ 结果。\n\n#### 表 9.4: 模型强度表\n\n| Gini 分数 | 模型强度 |\n| :--- | :--- |\n| 0 到 20 | 不是模型\
  \ |\n| 20 到 30 | 极弱模型 |\n| 31 到 40 | 轻微预测性 |\n| 41 到 60 | 中等预测性 |\n| 61 到 70 | 强预测性\
  \ |\n| 71 到 80 | 强模型 |\n| 大于 80 | 异常强 - 检查是否存在数据泄露 |\n\n### 提升表 (Lift Table)\n\n\
  `Lift tables` 提供了 `ROC` 图表中总结的额外信息。记住，`ROC` 图上的每个点都是概率阈值。提升表为 `ROC` 曲线上的每个点提供了详细信息。\n\
  \n我在第 7 章和第 8 章中反复引用的模型评估宏是由 Wensui Liu 开发的。这个易用的宏标记为“`separation`”，可以应用于任何二分类模型输出以评估模型结果。\n\
  \n我将此宏放在了我的 `C` 盘上，并使用 `%INCLUDE` 语句调用它。程序 9.5 显示了该宏的应用。\n\n#### 程序 9.5: 提升表评估宏\n\
  \n```sas\n%INCLUDE ‘C:/Users/James Gearheart/Desktop/SAS Book Stuff/Projects/separation.sas`;\n\
  ```\n\n```sas\n%separation(data = TEST_SCORE, score = P_1, y = bad);\n```\n\n第一行简单地说明了我放置宏的位置和宏名称。实际宏通过\
