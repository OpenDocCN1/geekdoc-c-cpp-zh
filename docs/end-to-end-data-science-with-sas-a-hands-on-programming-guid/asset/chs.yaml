  \n## 数据科学技能\n\n我确信你们大多数人和我一样，对下面图 1.2 中的图表感到厌了。我们在每个数据科学博客、演示和教学媒介中都见过它。无论这个图表多么无处不在，它仍然传达了一个明确的信息。它展示了三个传统上独立执行的不同领域之间至关重要的相互作用和交叉。\n\
  \n### 图 1.2：数据科学维恩图\n\n![](img/Image697.jpg)\n\n改编自: Conway, Drew. (September 2010).\
  \ The Data Science Venn Diagram. Retrieved from `http://drewconway.com/zia/2013/3/26/the-data-science-venn-diagram`。\n\
  \n图 1.2 图中的主要部分如下：\n\n- **计算机技能** – 由图中“黑客技能”（Hacking Skills）部分表示。这项技能对于访问和处理结构化及非结构化数据至关重要。数据科学家需要能够收集数据、清洗数据、与其他数据合并、为建模做准备，并在这些数据上实施机器学习算法以回答特定问题。\n\
  \n- **数学和统计知识** – 数据科学家需要具备先的统计背景，以理解预测算法的目标、过程和功能。\n\n- **业务知识** – 由图中“领域专业知识”（Substantive\
  \ Expertise）部分表示。在这种语境下，“业务”一词可以代表任何需要特定环境知识的研究领域。机器学习模型的开发是为了回答业务问题。数据科学家需要拥有该环境的知识，以开发可以建模的初始业务问题。这类知识对于判断回答问题需要什么类型的数据、数据应该向什么方向移动以及哪些答案是违反直觉的至关重要。\n\
  \n图 1.2 图中的子部分是：\n\n- **机器学习** – “黑客技能”与“数学和统计知识”的交叉部分，排除了“领域专业知识”技能集。这部分指的是计算机科学家，他们仅通过在给定数据集中寻找相关性来开发复杂的预测模型。无论这些模型有多复杂或多准确，它们都缺乏背景业务知识，因此容易产生虚假相关性、弱推断和伦理问题。\n\
  \n- **传统研究** – “数学和统计知识”与“领域专业知识”的交叉部分，排除了图中的“黑客技能”部分。在应用计算机解决所有日常问题之前，研究人员必须将数学知识应用到他们的专业领域以开发理论模型。如果你在\
  \ 1995 年之前获得高级学位，那么我说的的就是你。\n\n- **危险区域** – 绝对是我最喜欢的图。“黑客技能”与“领域专业知识”的交叉且排除了“数学和统计知识”的区域，凸显了模型不匹配、结果误读和无根据的结论等危险区域。\n\
  \n## 数据科学概念简介\n\n数据科学的语言基于一系列概念，这些概念代表了数据科学家在开发项目时必须考虑的问题。这些术语和定义是数据科学家在项目每一步中必须考虑的深度理论问题的简写。例如，如果我向另一位同事抱怨我常用的回归模型在这个新项目中运行并不良好，他可能会回答：“没有免费的午餐”。这并不意味着他假设我要偷他的午餐盒！\n\
  \n在本节中，我将概述数据科学中一些常见的概念，以便我们对这些概念有一个共同的理解。\n\n### 监督与无监督\n\n机器学习模型主要分为两大类：监督模型和无监督模型。目标变量（target\
  \ variable）的存在区分了它们。目标变量代表你感兴趣的项目，也称为响应变量（response variable）。如果你有一个试图预测的值，你就有监督方法。监督模型有目标变量，而无监督模型没有目标变量。\n\
  \n许多数据科学术语互用。预测变量（Predictor variables）也称为描述变量、独立变量或输入变量。目标变量也称为响应变量或因变量。\n\n###\
  \ 监督模型\n\n你接触的大多数模型都是监督模型。这些是主要的预测模型，负责过滤你的垃圾邮件、识别你的手写、推荐你的下一首歌、决定向你展示什么广告，并每天为你做数千次选择。\n\
  \n这些模型包括但不限于：\n\n- 回归模型\n- 决策树\n- 随机森林\n- 梯度提升\n- 神经网络\n- 支持向量机 (SVM)\n- K-近邻\n\
  - 朴素贝叶斯模型\n\n这些每一个模型都是建立在具有目标变量以及一个到几千个预测变量的数据集上的。如果一个数据集包含目标变量，那么监督机器学习算法通常用于此类数据。这些机器学习算法识别预测变量与目标变量之间的关联。结果是一个可以用于目标值未知的新观测值的公式。\n\
  \n\n\n\n\n例如，如果你想预测一瓶葡萄酒的质量排名，那么你通常会有一个数据集，其中包含多个观测值，每个观测值都有葡萄酒的排名。质量排名就是目标变量。数据集还包含几个与目标相同的描述性变量。这些描述性变量描述了影响目标变量的不同因素。表\
  \ 1.1 显示了与变量“质量”相关的九个预测变量。\n\n用数学术来说，预测变量通常被标记为 `X`，多个预测变量被列为 `X1`、`X2`、`X3` 等。目标变量被标记为\
  \ `y`，因此对于预测测量值的每个观测，都有对应的响应测量值，其中 `i` 代表第 `ith` 个观测值。\n\n### 表 1.1：葡萄酒数据\n\n| 固定酸度\
  \ | 挥发性酸度 | 柠檬酸 | 糖 | 氯化物 | 密度 | pH | 硫酸 | 酒精 | 质量 |\n| --- | --- | --- | --- |\
  \ --- | --- | --- | --- | --- | --- |\n| 8.6 | 0.23 | 0.4 | 4.2 | 0.035 | 0.995\
  \ | 3.1 | 0.53 | 9.70 | 5 |\n| 7.9 | 0.18 | 0.37 | 1.2 | 0.040 | 0.992 | 3.2 | 0.63\
  \ | 10.80 | 5 |\n| 6.6 | 0.16 | 0.4 | 1.5 | 0.044 | 0.991 | 3.5 | 0.52 | 12.40 |\
  \ 7 |\n| 8.3 | 0.42 | 0.62 | 19.25 | 0.040 | 1.000 | 3 | 0.67 | 9.70 | 5 |\n| 6.6\
  \ | 0.17 | 0.38 | 1.5 | 0.032 | 0.991 | 3.3 | 0.55 | 11.40 | 7 |\n| 6.3 | 0.48 |\
  \ 0.04 | 1.1 | 0.046 | 0.993 | 3.2 | 0.36 | 9.60 | 6 |\n| 6.2 | 0.66 | 0.48 | 1.2\
  \ | 0.029 | 0.989 | 3.3 | 0.39 | 12.80 | 8 |\n\n在我们葡萄酒质量预测的案例中，你可以构建一个回归模型，得到如下的公式：\n\
  \n```\nQuality = 0.796 + FixedAcidity (0.0349) + VolatileAcidity (-0.8287) + Cholorides\
  \ (-0.0464) + pH (-0.203) + Sulphates (0.1386) + Alcohol (0.4663)\n```\n\n该公式表明葡萄酒的质量评分是葡萄酒六个主要特征的函数。模型通过评估每个特征与质量评分之间的相关性，来确定哪些特征与葡萄酒质量评分相关。模型还会产生模型权重（也称为系数），用于预测尚未评分的新瓶葡萄酒的质量评分。\n\
  \n如果我们获得一瓶尚未质量评分的新葡萄酒的信息表，那么我们就能将这些预测变量的每一个信息输入到公式中，并预测葡萄酒的质量，如表 1.2 所示。\n\n###\
  \ 表 1.2：葡萄酒数据集预测权重\n\n| | 新葡萄酒信息 | 预测权重 |\n| --- | --- | --- |\n| | 模型截距 | 未知 0.796\
  \ |\n| 预测变量 | 固定酸度 | 7.2 | 0.0349 |\n| 挥发性酸度 | 0.22 | -0.8287 |\n| 氯化物 | 0.042 |\
  \ -0.0464 |\n| pH | 3.2 | -0.203 |\n| 硫酸 | 0.61 | 0.1386 |\n| 酒精 | 10.2 | 0.4663\
  \ |\n| | | |\n| | 预测评分 | |\n| | 质量（目标） | 5.0542 |\n\n新葡萄酒信息的每个值都乘以模型产生的预测权重（系数）。这些计算出的值与模型截距相结合，生成预测评分。\n\
  \n根据我们的预测模型，这瓶新葡萄酒的质量评分应为 5。注意，并不是所有的预测变量都用于最终的预测模型。模型仅保留与目标变量具有统计学显著关系的预测变量。不要担心；这些概念将在书的回归建模章节中详细解释。\n\
  \n## 无监督模型\n\n无监督模型构建在没有目标变量的数据集上。由于缺乏目标变量通常提供的方向，这类分析稍微困难一些。无监督模型的目标从本质上不同于监督模型。监督模型通常构建用于预测未来观测的响应，或者为了更好地理解预测变量与目标变量之间的关系。相反，无监督模型不预测任何内容。它们的建立是为了理解给定变量之间的关系。无监督模型的目标是识别自然发生的观测分组或分类。\n\
  \n最常见的无监督学习模型包括：\n\n- `k-Means 聚类`\n- `分层次聚类分析 (HCA)`\n- `主成分分析 (PCA)`\n- `t-分布随机邻域嵌入\
  \ (t-SNE)`\n\n例如，假设你有一个客户属性数据库，你想知道是否可以检测出相似客户的群体。这些小组在营销活动或目标定位中可能有用。通常做法是运行 `k-means\
  \ 聚类`算法，根据提供的特征将每个观测值分配到 `k` 个组之一。`k-means 聚类` 中的 `k` 代表你希望分配的组数。在特征空间中彼此较近的数据点被分配到同一个组或簇中。\n\
  \n本节的结论是，簇是在没有目标变量引导的情况下有机形成的。变量之间的关系是无监督学习的基础。\n\n聚类算法的优点之一是它们通常通过可视化来表示。聚类算法在散点图中很容易理解，可以根据所属的簇对观测点进行染色或标记。图\
  \ 1.3 显示了一个典型的聚类模型。该可视化根据 `X` 和 `Y` 特征展示了四个不同的组。每个组都包含一个质心点，用于确定特征空间中的簇。\n\n图 1.3：聚类模型可视化\n\
  \n## 降维\n\n无监督模型最强大的应用之一是降维。建模数据集中具有数百个预测变量并不罕见。虽然我们总是想要更多数据，但事实是更多数据可能会导致更多问题。大量的预测变量会迅速遇到维度灾难（在接下来的几节中详细解释）和相关性问题。降维是在不丢失过多信息的情况下简化数据的能力。\n\
  \n诸如主成分分析 (`PCA`) 之类的算法收集相关变量并将它们合并为一个单一特征，该特征代表数据的一个重要维度。例如，房屋的面积和卧室的数量是高度相关的。这些特征可以合并为一个可能代表家庭规模的属性。\n\
  \n### 机器学习分类\n\n图 1.4 展示了机器学习算法的高级分类。机器学习这一大类可以分为监督学习和无监督学习模型。监督学习可以进一步细分为分类和回归模型。无监督学习可以进一步细分为聚类和降维模型。这些概念都将在接下来的章节中详细解释。\n\
  \n图 1.4：机器学习分类\n\n![](img/Figure_1.4.jpg)\n\n\n\n\n\n一旦你检查了数据并决定要构建一个监督模型，下一步就是尝试确定哪种模型最适合这些数据。本书的稍后部分将介绍几种涉及变量检查、数据绘图和相关性分析的方法。当你执行这些技术时，你正在尝试理解预测变量与目标变量之间关系的函数形式。在检查数据时，你需要问问自己：\n\
  \n● 数据是线性的吗？\n● 数据是聚类的吗？\n● 数据是弯曲的吗？\n● 分布看起来是否存在某种模式？\n● 数据是随机的吗？\n\n这些方法将为你提供线索，告诉你应该对数据应用什么类型的模型。图\
  \ 1.5 显示了两种非常不同的数据分布。左侧的图显示了 `X` 和 `Y` 变量之间的线性关系，而右侧的图没有显示线性关系。\n\n当我们试图决定对数据应用什么类型的模型时，我们需要对\
  \ `X` 和 `Y` 之间关系的函数形式做出假设。线性模型会尝试穿过数据点画一条直线，使该直线与观测点之间的距离最短。如果我们对第一组数据应用线性回归模型，我认为我们可以得到不错的拟合效果。然而，如果我们对第二组数据应用线性回归模型，我们将得到一个拟合非常差的模型。\n\
  \n### 图 1.5：数据分布类型\n\n![](img/Image785.png) ![](img/Image792.png)\n\n模型通分为大类：参数模型和非参数模型。\n\
  \n#### 参数模型\n\n参数模型对预测变量与目标变量之间底层关系的函数形式做出了假设。通过对数据的检查，你可能会确定目标变量与预测变量之间存在线性关系。在这种情况下，你实际上假设了一个线性函数形式：\n\
  \n`f(X)= β0+β1 X1+β2 X2+···+βp Xp`\n\n由于我们假设 `f(X)` 是线性的，那么我们只需要估计系数 `β0`、`β1`……`βp`。这通常通过普通最小二法完成（这一概念将在回归章节中详细解释）。\n\
  \n回归模型被归类为参数模型，是因为它们将 `p` 维函数（`p` 是预测变量的总数）简化为对一组给定参数的估计。\n\n参数模型包括但不限于：\n\n● 线性回归\n\
  ● 逻辑回归\n● 朴素贝叶斯\n● 线性判别分析\n● 简单神经网络\n\n参数模型的优点是：\n\n• **透明性**：这些模型相对简单易于理解。你确切知道输入是什么，系数是什么。\n\
  • **它们速度更快**：由于这些模型不需要搜索整个特征空间来寻找任意的 `p` 维函数，因此它们的训练速度比非参数模型快。\n• **它们需要的数据较少**：与非参数模型相比，参数模型可以在有限的数据上开发。虽然系数会随着数据的增加而进行调整，但存在一个收益递减的节点，额外的观测值将不会产生可察觉的模型拟合改进。\n\
  \n## 非参数模型\n\n如果说参数模型假设了 `f` 的函数形式，那么你可能猜到非参数模型并不假设 `f` 的函数形式。这些模型可以学习数据的任何函数形式，因为它们不受假设的限制。在没有预定义函数形式限制的情况下，这些算法试图估计一个尽可能接近训练数据的函数，并且它对未见数据具有良好的泛化能力。非参数模型的显著优势是，它们能够拟合比参数模型广得多的函数形式。\n\
  \n例如，最近邻模型不假设数据的任何函数形式。它只是在特征空间中寻找彼此接近的观测值，无论数据如何分布。所做的唯一假设是特征空间中相互接近的观测值具有相似的目标值。\n\
  \n非参数模型包括但不限于：\n\n● k-最近邻 (k-NN)\n● 决策树\n● 复杂神经网络\n● 支持向量机 (SVM)\n\n非参数模型的优点是：\n\
  \n● **灵活性**：这些模型不假设函数形式；因此，它们可以检测广泛的函数形式。\n● **准确性**：这些模型通常会产生更准确的模型。\n\n非参数模型可以应用于线性分布的数据。但将非参数模型应用于本可以用参数模型建模的数据集时，其缺点是：\n\
  \n● **数据需求**：非参数模型通常需要更多数据来充分训练模型。如果数据集的大小有限，参数模型将提供更准确的模型拟合。\n● **训练时间**：由于非参数模型不假设数据的函数形式，这些模型必须搜索\
  \ `p` 维特征空间以评估最佳的模型拟合效果。\n● **透明性**：许多类型的非参数模型被称为“黑箱模型”，因为很难理解模型预测是如何构建的。参数模型可以通过检查系数权重来轻松理解。大多数非参数模型不输出模型权重，因此难以解释。\n\
  \n表 1.3 提供了参数模型和非参数模型之间的总结。\n\n### 表 1.3：参数模型与非参数模型\n\n| 模型类型 | 数据 | 速度 | 透明性 |\
  \ 函数形式 | 准确性 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 参数模型 | 较 | 快 | 透明\
  \ | 有限 | 较低 |\n| 非参数模型 | 多 | 慢 | 黑箱 | 无限 | 高 |\n\n#### 回归与分类\n\n变量可以分为两个大类。定量变量取数值。这些值是连续值（`1.1`、`1.2`、`1.3`\
  \ ……）。这类变量的例子有身高、体重、金钱、距离、时间以及任何可以用数值表示的数量。\n\n变量也可以定性的。这些变量代表类别中的值。例如，房屋价格可以被分类为高、中、低。人的性别可以被分类为男性、女性或其他。任何描述性标签都可以转化为定性变量。\n\
  \n\n\n\n\n我最好的建议是不要纠结于模型的名称。一旦你理解了每个模型的工作原理以及它们的相对优缺点，你就会对特定情况下应该使用哪种模型有更清晰的把握。\n\
  \n表 1.4 提供了回归模型和分类模型的一些通用描述。\n\n### 表 1.4：回归与分类模型\n\n| | 回归 | 分类 |\n| :--- | :---\
  \ | :--- |\n| 通用描述 | 回归意味着使用训练数据预测输出值 | 分类意味着将组划分到某个类别中 |\n| 示例 | 使用训练数据预测保险理赔的金额（$金额）\
  \ | 使用训练数据预测保险理赔的类型（欺诈与非欺诈） |\n| 目标变量 | 如果是实数/连续值，则为回归问题 | 如果是离散/分类变量，则为分类问题 |\n\
  \n## 过拟合与欠拟合\n\n过拟合（Overfitting）和欠拟合（Underfitting）的概念是数据必须理解的最重要问题之一。数据科学家的大量工作都在评估模型是对数据产生了过拟合还是欠拟合。为了理解这些概念，我们首先需要理解“信号”（signal）和“噪声”（noise）之间的区别。\n\
  \n每个机器学习模型都试图捕捉目标变量与预测变量之间的底层关系。如果存在这种关系，模型应该识别出这种关系并用它来预测新案例。然而，在每个数据集中存在某些随机误差。这种随机误差可能来自与目标变量关联很弱或没有任何关联的变量，也可能来自离群值、偏斜数据以及许多其他数据问题。这种随机误差被称为“噪声”。\n\
  \n### 过拟合\n\n当机器学习模型描述的是随机误差（噪声）而非变量与目标之间的底层关系时，该模型被称为过拟合了。过拟合通常发生在模型对于给定数据集过于复杂时。如果机器学习模型相对于观测数量包含了过多的预测变量，它将开始对随机误差建模，而不是预期的底层关系。过拟合的模型将针对其开发时使用的数据集（称为训练数据集）进行高度调优。然而，它无法很好地泛化到新数据。这种泛化能力的缺乏会导致模型在新数据上的表现很差。\n\
  \n让我们来看一个简单的例子。在金融领域，我们经常使用客户的 FICO 分数来确定信誉状况。FICO 分数是一个介于 350 到 800 之间的三位数数字，由信用局计算并报告，代表了客户的还款历史、信用期限、信用违约以及许多其他财务因素。我们可以根据客户\
  \ FICO 分数与其收入之间的关系构建一个非常简单的数据集（图 1.6）。\n\n#### 图 1.6：简单线性关系\n\n![](img/Image848.png)\n\
  ![](img/Image857.png)\n\n图 1.6 上方的图显示了 FICO 分数和收入分布的散点图。我们可以看到预测变量（`Income`）与目标变量（`FICO\
  \ score`）之间存在正相关关系。尽管存在正相关，但这并非一一完美的拟合关系。我们可以看到总的上升趋势，但两个变量之间看起来并不是完美匹配。\n\n图 1.6\
  \ 下方的图显示了线性趋势线和误差棒，展示了线性模型的残差误差。如果你还记得统计学基础课程，几条不同的线可以拟合到这个数据集，但最佳拟合线是总残差误差最低的那一条。我们可以通过计算观测值与直线之间的距离来轻松找到它；然后将此差平方以确保获得正值，最后将它们相加得到总残差误差。\n\
  \n所以，你可能会问自己，如果我创建一个多项式模型（由多项式变量生成的曲线），让我的线通过每一个数据点呢？那意味着我的总残差误差为零。那就太棒了！遗憾的是，那并不完美。尽管你实现了减少残差误差的目标，但你的模型针对其开发时的数据集进行了高度调优，以至于它无法很好地泛化到新数据。\n\
  \n图 1.7 提供了一个视觉示例。上方的图显示了一条通过所有数据点且残差误差率为零的多项式线。然而，下方的图用星号表示新的数据点。多项式线没有为这些新数据点提供良好的预测，但线性预测对预测值提供了良好的估计。使用线性模型，如果给定客户的收入，我可以预测其\
  \ FICO 分数的值。如果我使用多项式线，我的预测结果将糟糕得多。\n\n#### 图 1.7：高阶多项式模型\n\n![](img/Image864.png)\n\
  ![](img/Image872.png)\n\n有几种方法可以检测过拟合，而且这个重要问题也有简单的解决方案。这些方法将在书的后部分详细描述，但几个亮点包括：\n\
  \n- 交叉验证\n- 通过减少参数数量或减少高阶多项式来简化模型\n- 正则化\n- 通过寻找并修复离群值和偏斜数据元素来清理数据集\n- 获取更多数据（更多观测值，而不一定是更多参数）\n\
  \n### 欠拟合\n\n欠拟合的概念是过拟合的对立面。在欠拟合的情况下，模型没有识别预测变量与目标之间的底层关系。它没有检测到数据中存在的信号。用通俗的话说，你的模型太弱了。\n\
  \n如果我们使用与过拟合演示中相同的例子，可以看到线性模型实际上是对数据产生了欠拟合。图 1.8 比较了线性模型生成的残差与低阶多项式模型生成的残差。这种中等多项式模型捕捉到了线性模型未捕捉的变量与目标之间的动态关系。中等多项式模型的整体残差误差低于线性模型，因此它是更好的拟合。\n\
  \n#### 图 1.8：低阶多项式模型\n\n![](img/Image857.png)\n![](img/Image887.png)\n\n有解决数据欠拟合的方法。这些：\n\
  \n- 增加模型复杂性：通过更多参数、特征工程或选择更强大的建模算法\n- 减少正则化（减少对模型的约束）\n\n## 批量学习与在线学习\n\n机器学习模型可以进一步分类为“批量”或“在线”模型。这些模型之间的区别在于模型是否可以从传入的新数据流中学习。\n\
  \n### 批量模型\n\n在批量模型中，算法（我们用于预测目标值的模型方程）已经预先开发，新观测根据预定义的模型进行评分。这种模型的优点是，由于它已经预先开发，学习算法可以考虑所有可用训练数据，并花费需要的时间来输出评分算法。某些深度学习模型已知运行一个月后才能构建出最终的模型权重。\n\
  \n\n\n\n\n通过在实施之前开发模型，数据科学家可以尝试几种不同的方法并进行各种类型的测试，以在正式实施前确定模型的效能。如果数据科学家想对新数据使用批处理模型，那么他们必须在这一新数据集上从头开始训练一个全新的模型。\n\
  \n每周甚至每晚对最新的可用数据进行新的数据集训练是常见操作。只要建立了建模流水线，并且新数据可以被导入、清洗、准备好以供建模、进行建模并评估，那么就可以相对无缝地实施新模型。\n\
  \n批处理模型通常需要大量的数据、计算资源和处理时间。这些需求可能会给组织带来巨大的成本。由于这些资源问题，人们已经开发了能够进行增量学习的模型设计。\n\n\
  ### 在线学习模型\n\n解决批处理模型资源需求的一种方案是向模型输入连续的新数据流，或者向模型输入小批次（称为“mini-batches”）的数据。这些数据可以被模型算法评估，并在在使用后迅速丢弃。这种模型设计非常适合接收持续数据流（如网络点击或股票价格）的数据环境。在线学习模型可以快速适应数据流的变化。\n\
  \n此类系统主要的注意事项之一是，这些模型需要持续监控，因为它们对新数据非常敏感。新数据可能是错误的，也可以是有意的有害数据（在线攻击、欺诈、垃圾邮件、劣质传感器、系统操纵等）。这类新数据会对在线学习模型产生负面影响。\n\
  \n数据科学家通常通过两种方式来应对这类失控场景：\n\n1. **持续监控模型结果** – 数据科学家构建系统来实时监控模型结果。这些系统将设有阈值水平，当某个值达到或超过给定水平时会触发警告。\n\
  2. **调整学习率** – 在此语境下，学习率衡量模型整合新数据并根据这些新数据调整模型结果的速度。这种调整需要一种微妙的平衡，因为如果你设置的学习率过高，模型将非常快地适应新数据，导致失控的结果。然而，如果你设置的学习率太低，模型将无法捕捉数据中的新趋势，这可能会违背实施在线学习模型的目的。\n\
  \n## 偏差-方差权衡 (Bias-Variance Tradeoff)\n\n现在是时候谈谈机器学习中最核心的概念之一了。数据科学家的大部分工作与偏差-方差权衡的概念直接相关。\n\
  \n数据科学家需要能够确定针对特定的业务问题应用哪种算法，以及该算法需要多复杂。即使是像只有一个预测变量的简单线性回归这样的简单模型，如果你将该变量转换为高阶多项式，它也会变得复杂。例如：\n\
  \n* 简单：`FICO Score=Income(x)`\n* 复杂：`FICO Score=Income(x)10`\n\n尽管每个模型只包含一个变量，高阶多项式也被认为是复杂模型。\n\
  \n可以通过以下方式增加模型复杂度：\n\n* 增加预测变量的数量\n* 特征工程\n* 变量转换\n* 交互项\n* 模型构建\n    * 决策树中的分支数量\n\
  \    * 回归模型中的正则化值\n    * 神经网络中的隐藏节点数量\n    * SVM 中 `C` 的值\n    * 许多许多其他\n\n数据科学家的目标是开发一个能够捕捉数据中信号，又能良好泛化到未见新数据的模型。虽然这听起来可能很容易，但存在一个不可避免的权衡。为了理解这种权衡，我们必须定义偏差（bias）和方差（variance）的概念。幸运的是，这些概念与我们几页前刚刚过的欠拟合和过拟合密切相关。\n\
  \n### 偏差 (Bias)\n\n当我们对数据做出简单的假设，或对数据集应用简单的模型时，就会产生偏差。这些简单的模型无法充分识别数据中的底层信号。模型将对数据欠拟合，并导致非优的模型预测。\n\
  \n例如，图 1.8 所示的数据显示了顶部拟合到数据上的线性模型，而底部是拟合的多项式模型。顶部的模型存在高偏差，因为该模型未能充分代表底层数据。由于模型选择不当，它遭受了系统性的拟合性。。当我们通过将预测变量转换为多项式来增加模型复杂度时，模型将开始更好地代表数据中的底层信号。这种模型复杂度的增加降低了模型的偏差。\n\
  \n### 方差 (Variance)\n\n方差与偏差是完全相反的问题。当你通过对训练数据应用过多或过强的数据转换来过拟合数据，或者在一个不需要模型的数据集上使用过度复杂的模型时，就会产生高方差。例如，图\
  \ 1.7 所示的预测模型展示了一个高方差模型。它对数据高度过拟合，无法泛化到新的观测值。\n\n使用“方差”一词的常识性解释是：如果我们改变底层训练数据（即反复更改它），那么每次更改底层数据时，我们都会得到非常不同的模型。这被称为“高方差”。这种模型捕捉的是数据中的噪声，而不是信号。\n\
  \n那么，我们如何知道模型复杂度何时达到了正确的平衡？图 1.9 显示了偏差和方差之间的权衡。当模型复杂度较低时，我们具有高偏差。这是因为更复杂的模型通常比非常简单的模型能更好地捕捉数据中的底层关系。高偏差的简单模型将产生很高的总误差。\n\
  \n图 1.9：最优模型复杂度\n\n![](img/Image897.png)\n\n另一方面，过度复杂的模型将具有高方差。该模型对训练数据的调节过高，以至于无法良好地泛化到新的观测值。具有高方差的过度复杂模型也将产生很高的总误差。\n\
  \n存在一个平衡点，此时模型总误差将降低到最低点。这一点就是最优模型复杂度的点。虽然这并不是偏差最低或方差最低的点，但它是两者之间的平衡点。当然，你的下一个问题必然是，我如何找到最优复杂度的点？\n\
  \n## 训练和测试数据集\n\n数据科学中的一项重要技术（书中稍后部分将详细介绍）是将你的数据集分为两个部分。这些部分被称为“训练数据集”和“测试数据集”。根据经验，你的约\
  \ 70% 数据将位于训练集中。这是你将用于构建模型的数据集。剩下的 30% 数据将位于你的留存测试集中。这是你将应用模型并评估结果的数据集。\n\n创建训练和测试数据集有两个重要的注意事项：\n\
  \n1. 数据需要随机分配到训练集或测试集中。这种随机化将避免选择偏差。如果数据不是随机抽样的，那么生成的样本数据集将不能代表旨在分析的总体。\n\n\n\n\n\
  \n## 2. 不得偷看！\n\n在对训练数据集上构建模型之前，不允许评估测试数据集。你通过调查测试数据集所获得的任何信息都可能影响你在训练数据集上构建模型的方式。这种“内幕消息”在模型投入生产后是无法获得的。这种作弊行为会导致模型开发环境与生产环境之间产生显著的性能差异。\n\
  \n图 1.10 展示了训练集和测试集如何与欠拟合、过拟合、偏差、方差、信号和噪声等概念相关。如果我们观察图表的左侧，这部分代表低复杂度的模型（想象一个简单的线性回归模型）。当我们评估模型同时应用于训练集和测试集时的性能时，其错误率很高。这个简单的模型没有捕捉到数据中的底层信号。由于模型没有捕捉到信号，因此存在**高偏差**；因为如果我们抽取不同的样本来构建模型，模型的结果不会发生太大变化，所以存在**低方差**。\n\
  \n随着我们向右移动并增加模型复杂度，训练集的错误率和测试集的错误率都开始下降。随着模型复杂度的增加，我们捕捉到了数据中更多的信号。增加模型复杂性的结果是模型偏差开始下降，而模型方差开始增加。这种效应是因为我们捕捉了数据中更多的信号，但模型变得越来越针对底层的训练数据。如果我们抽取了不同的随机样本来创建训练数据，我们将得到一个略有不同的模型。然而，由于我们能够更好地识别数据中的信号，训练错误率和测试错误率开始下降。\n\
  \n### 图 1.10：偏差与方差的权衡\n\n![](img/Image904.png)\n\n当我们继续增加模型复杂度时，训练错误率和测试错误率将持续下降，直到达到最优模型复杂度点。在这一点上，模型捕捉了数据中的信号，测试错误率处于最低点。一旦我们将模型复杂度增加到最优点之外，测试错误率开始开始。这种增加是因为模型现在对训练数据过拟合，并开始无法对未见数据进行良好的泛化。\n\
  \n| ![](img/Image1022.png) | 有趣的是，随着我们增加模型复杂度，训练数据的错误率会继续下降。这是许多缺乏经验的数据科学家陷入困扰的地方。看着训练数据集上的错误率随着复杂度的增加而持续下降，会带给你一种虚假的成就感。很容易欺骗自己相信你真的做棒了！要意识到，你实际上是对训练数据集对模型进行了过拟合，当你的模型投入生产并应用于未见数据时，会导致非常高的错误率。\
  \ |\n\n## 寻找最优模型复杂度的分步示例\n\n好了，话非常多，如果你和我一样，那么很容易被冗长的解释搞混淆。我通过图片学习得更好。所以，让我们来看调整模型以达到最优模型复杂度（从而使错误率最小）的视觉示例。\n\
  \n让我们回到预测个人 FICO 分数的例子。这种预测对于营销或根据个人的信用分动态调整方案是有益的。我们关于 FICO 分如何产生的背景业务知识让我们认为我们需要与个人收入、还款历史、总余额和信用历史长度相关的预测变量。这个变量列表应该为我们提供一个良好的预测模型，尝试确定新客户的\
  \ FICO 分。\n\n### 第 1 步——简单线性回归\n\n图 1.11 显示了一个分为训练数据（点）和测试数据（星号）的简单数据集。构建的第一个模型是简单线性回归。我们可以以这种形式考虑该模型：\n\
  \n```\nFICO Score=Intercept+Income(x)+ ε\n```\n\n记住，对于线性回归模型，我们将拥有目标变量（`FICO Score`）、模型截距、系数（`Income`）和误差项（`ε`）。\n\
  \n这个带有单一预测变量的简单线性回归会导致训练集和测试集产生高错误率。它捕捉到了数据中的一些通用信号，但它对底层数据的真实关系并非动态。\n\n### 图 1.11：简单线性回归\n\
  \n![](img/Image955.png)\n\n### 第 2 步——两个变量的线性回归\n\n图 1.12 展示了向模型中添加另一个预测项的效果。除了\
  \ `Income` 项外，我们还在模型中添加了 `Payments` 项：\n\n```\nFICO Score=Intercept+Income(x)+Payments(x)+\
  \ ε\n```\n\n通过在考虑收入的同时考虑个人的还款历史，我们可以对他们的 FICO 分数得到更好的预测。新模型显示，额外的预测项降低了训练错误率和测试错误率。由于测试错误率已经下降，我们可以确认添加新的预测项对我们的模型有益。\n\
  \n### 图 1.12：两个变量的线性回归\n\n![](img/Image962.png)\n\n### 第 3 步——三个变量的线性回归\n\n图 1.13\
  \ 显示了向模型中添加第三个预测变量的效果。`Balance` 项代表个人账户的未决余额。更新后的模型方程包含了三个预测项：\n\n```\nFICO Score=Intercept+Income(x)+Payments(x)+Balance(x)+\
  \ ε\n```\n\n### 图 1.13：三个变量的线性回归\n\n![](img/Image970.png)\n\n`Balance` 项的添加允许模型调整并捕捉数据中更多的信号。这个额外的变量降低了训练数据和测试数据的错误率。\n\
  \n### 第 4 步——四个变量的线性回归\n\n图 1.14 展示了向模型中添加第四个预测项的效果。`Credit Tenure` 变量的添加允许模型适应个人的信用历史长度。更新后的方程变为：\n\
  \n```\nFICO Score=Intercept+Income(x)+Payments(x)+Balance(x)+Credit Tenure(x)+ ε\n\
  ```\n\n`Credit Tenure` 变量的添加降低了训练数据和测试数据的错误率。我们可以确认，这第四个变量的添加让我们越来越最优模型复杂度。\n\n\
  ### 图 1.14：四个变量的线性回归\n\n![](img/Image977.png)\n\n在此时，我们已经耗尽了根据背景知识选择的所有变量。我们现在拥有与收入、还款历史、总余额和信用历史相关的变量。模型对底层数据是动态的。它捕捉了数据中的信号，没有对数据中的噪声过拟合。\n\
  \n### 如果我们继续增加模型复杂度会怎样？\n\n#### 第 5 步——五个变量的线性回归\n\n图 1.15 展示了向模型中添加 `Income` 多项式项的效果。收入平方值的添加将模型方程变为：\n\
  \n```\nFICO Score=Intercept+Income(x)+Payments(x)+Balance(x)+Credit Tenure(x)+Income(x)2+\
  \ ε\n```\n\n\n\n\n该模型正过度拟合底层训练数据，并开始无法对未见的测试数据进行良好的泛化。这种过度拟合可以通过检查两个数据集的错误率来证明。训练率持续下降，是因为模型对该数据集变得高度拟合。它开始对噪声和信号一起进行建模。然而，测试数据的错误率已开始增加。这种增加是因为在训练数据上开发的模型无法良好地泛化到测试数据。过度拟合的模型在预测新案例时表现不佳，导致测试错误率较高。\n\
  \n### 图 1.15：五个变量的线性回归\n\n![](img/Image985.png)\n\n### 第 6 步 – 六变量线性回归\n\n为了更透彻地说明这一点，我们可以添加第六个预测项，即\
  \ `Balance` 项的项项式。该项的加入将我们的方程变为：\n\n`FICO Score = Intercept + Income(x)+Payments(x)\
  \ + Balance(x) + Credit Tenure(x) + Income(x)2 + Balance (x)2 + ε`\n\n图 1.16 展示了该模型过度拟合到了什么种程度。模型现在对训练数据的拟合程度如此之高，以至于在测试数据上完全失灵。训练错误率继续下降，而测试错误率则继续增加。\n\
  \n### 图 1.16：六变量线性回归\n![](img/Image994.png)\n\n### 第 7 步 – 最优线性回归模型\n\n这种视觉化演示允许我们确定模型在何处出了问题。通过评估测试错误率，我们可以确定具有四个预测变量的模型是拟合最好的。这个模型是测试错误率最小的时刻。\n\
  \n`FICO Score = Intercept + Income(x) + Payments(x) + Balance(x) + Credit Tenure(x)\
  \ + ε`\n\n图 1.17 显示了该数据集的最优模型复杂度。该模型能够捕捉训练数据集中的信号，并利用它准确预测测试数据集中的值。\n\n### 图 1.17：最优线性回归模型\n\
  ![](img/Image1005.png)\n\n本书的大量内容将集中在寻找最优模型复杂度的每个概念上。上述简单的示例考虑的是一个简单的线性回归模型。实际上，数据科学家需要能够选择适用于其底层数据的模型类型范围。这个模型类型范围需要缩小到一种或两种模型类型，最后选择一种单一的模型类型。然后他们需要像我们刚刚做的那样，调整所选模型的超参数。超参数是模型中控制模型性能的预设参数。这些值取决于模型类型，但可能包括学习率、采样率、训练比例、`alpha`\
  \ 以及许多其他选项。\n\n## 维度灾咒\n\n维度灾咒之所以棘手，因为它违背了我们所学到的关于数据的所有知识，即数据越多越好。数据科学家的工作是识别出许多良好的数据属性以构建预测模型。某些建模数据集可能具有数千甚至数百万个预测变量。这听起来很棒，对吧？你可能认为你拥有近乎无限的预测变量来构建模型。但当我们思考模型实际上在做什么时，这个想法开始动摇了。\n\
  \n如果我们取一个分类模型（例如，考虑 `KNN` 或决策树模型），我们正试图识别在维度空间特定区域内相互接近的观测值。模型通常会计算给定区域内的观测值数量，并使用这些观测值构建预测器。如果一个新的观测值落在该区域内，我们可以假设它与该区域的其他观测值相似，并根据该空间中的其他观测值推出新观测值的预测值。\n\
  \n图 1.18 显示了增加维度数量时开始发生的情况。记住，维度的数量等于你模型中预测变量的数量。具有单个预测变量的模型可以通过图 1.18 左侧的图进行可视化。这个简单模型只有一个维度，因此单个区域内存在许多变量是常见现象。这个模型的优点是拥有许多预测观测值来推断新观测值的值，但由于它只代表数据的一个方面（一个维度），它无法告诉我们关于新观测值的太多信息。\n\
  \n### 图 1.18：维度增加\n![](img/Image1017.png)\n\n图 1.18 中间的图显示了相同的观测值分布在两个维度上。额外的维度为数据增加了更多信息，并允许我们推断关于给定空间内出现的新变量更多信息；然而，给定区域内的观测值现在变少了，因为观测值分布在两个维度上而不是单个维度上。\n\
  \n图 1.18 右侧的图显示相同的数据分布在三个维度上。再次，通过额外的预测变量（维度）获得了更多信息，但数据变得更加分散。每个区域中用于预测的观测值远少于以前。\n\
  \n记住我们正在将有限的观测数量分布在依赖于特征的维度空间中。算法必须计算观测点之间的距离以识别观测值组。两个笛卡尔坐标之间的欧几里得距离公式如下，其中 `p`\
  \ 是第一个坐标，`q` 是第二个坐标：\n\n![](img/CartesiaEq.jpg)\n\n（抱歉要涉及数学，但有时有必要解释得充分）。这个方程表明，对于我们每添加的每一个额外预测项，观测点之间的距离都会增加。当我们继续添加预测变量但保持观测值数量不变时，结果就是稀疏特征空间。\n\
  \n我们的大脑很难想象四维空间，我们无法无法想象 10000 维空间。然而，数学告诉我们，要在高维空间中保持一致密度所需的观测数量呈指数级增长。表 1.5 显示了维持等效密度所需的指数级增长。\n\
  \n表 1.5：特征空间中的一致密度\n\n| 维度 | 指数级增长 | 观测值 |\n| :--- | :--- | :--- |\n| 1 维度 | 101\
  \ | 10 |\n| 2 维度 | 102 | 100 |\n| 3 维度 | 103 | 1000 |\n| n 维度 | 104 | 一大堆 |\n\n\
  简单来说，维度灾咒就是：当你向模型中添加更多预测变量时，你将需要指数级的观测值数量来维持模型性能。\n\n## 透明模型与黑盒模型\n\n\n\n\n简单模型易于解释。对于简单的线性回归，你可以很容易地解释直线的方程。这类模型中没有任何隐藏的内容。我们确切知道截距、系数权重和误差项是什么。简单的决策树也容易解释。我们可以很容易地看到决策路径的逻辑，并理解每个分裂点是如何计算的。这些模型的方法论是开放供检查的，并且易于理解。事实上，它们是如此直观，以至于你的经理都能理解这些模型。（嘿！让那些管理层见见识吧！）\n\
  \n然而，随着模型复杂性的增加，模型的透明性质开始发生变化。某些模型，如`random forests`（随机森林），采用了决策树的基本设计，并在构建许多决策树时引入了随机性，并汇总它们的集体预测。要对每个变量如何产生结果给出一个稳固的解释，并不是容易的，因为这种解释会随着随机森林中数百棵决策树的每一棵不同而改变。\n\
  \n`Gradient boosting decision trees`（梯度提升决策树）通过系统地获取上一棵树的残差，并将其作为下一棵树的目标值，来编译许多决策树的结果。在这类模型中，目标值在不断变化。这个循环会重复很多次。结果通常非常准确，但并不容易解释预测器层级发生了什么。\n\
  \n“黑盒模型”一词描述的是一种复杂且在生成输出时无法清晰洞察预测是如何生成的模型。`Neural networks`（神经网络）众闻成为成为黑盒模型的典型代表。这类模型在图像分类方面表现出色；然而，对于哪些特定因素导致了预测，还没有清晰的理解。是下颌的曲线、还是嘴唇的角度、或者是人的肤色抑或是他们穿的衣服？虽然神经网络模型考虑了所有这些因素，但你无法为图片的某个特定维度分配具体的数值。在很多情况下，图像的细微变化或角度略有不同都可能导致完全不同的预测。\n\
  \n# 伦理\n\n黑盒模型是机器学习伦理学家极关注的问题。随着我们因为这些模型惊人的预测准确性而变得越来越依赖，我们正进一步远离可解释性，并因此无法对其使用提供合理性证明。这里是机器学习中权衡取舍另一个例子。解释性与准确性之间的权衡不仅仅是一个理论问题，它可能对你的日常生活产生不可想象的影响。\n\
  \n想象你被指控犯了罪。新的`AI`刑事司法系统判定你有罪并自动为你判处刑。你可能想知道它定你罪给出了什么理由。如果答案是冷冰冰的“算法这么说的”，你可能会感到失望。这是一个反乌托邦小说的场景，由一个不可质疑且毫无感情的`AI`主宰决定你的命运。\n\
  \n有很多黑盒算法产生结果的例子，在这些情况下我们对其决策提出解释，但并没有提供：\n\n* 拒绝贷款\n* 识别癌性囊肿\n* 自主驾驶汽车驶离道路\n* 刑事判刑\n\
  \n讽刺的现实是，我们由于这些黑盒模型的准确性和自动化而依赖于它们。它们极其快速、精确且准确。然而，我们将这些算法整合到日常生活中越深，对模型结果的人类水平解释的要求就越高。这可能是一个可怕的想法：即使是选择了输入变量、模型设计和参数的模型开发者，也无法对其自身设计内如何做出决策提供清晰解释。但从好的一面来说，我不需要手动在照片中标记我的朋友。我想这算是一个胜利。\n\
  \n# 没有免费午餐\n\n数据科学家构建了一系列强大的模型，可以完成惊人的任务。其中一些模型类型被持续用于执行最困难的机器学习任务。`Gradient boosting\
  \ machines`（梯度提升机）经常赢得预测建模竞赛，而`deep neural networks`（深度神经网络）经常解决复杂的图像分类问题。你可能会问自己，哪种模型是最好的？如果`deep\
  \ neural networks`如此优秀，为什么我们不在每个数据问题上都使用它们呢？\n\n遗憾的答案是，不存在一种适用于所有可能数据集的“钥匙模型”。对于许多数据集，我们对数据的分布做出假设。如果一个数据集看起来是线性的，我们就使用`linear\
  \ model`（线性模型）。如果一个数据集看起来是聚类的，我们可以使用`KNN`模型。然而，如果我们放松所有假设，在不带任何关于分布的预设观点的情况下接触数据集，那么没有任何单一模型可以应用到所有数据集并优于所有其他模型。\n\
  \n这是因为模型需要根据底层数据分布进行恰当选择。某些数据集在设计上是线性的，而另一些是聚类的。有些是稀疏的，而有些是稠密的。有些具有稳定的模式，而有些是反复无常的。每一个数据集都有最适合它的特定模型类型。\n\
  \n“没有免费午餐”的概念简单意味着你不能走捷径对每个问题都使用你那信赖的`neural network model`（神经网络模型）。对于许多数据集，`simple\
  \ linear regression`（简单线性回归）的效果会比`deep neural network`好得多。确定使用哪种模型的唯一方法是评估底层数据并对数据分布做出假设。然后，你需要选择一组与该类型数据分布对齐的模型类型并将其应用于数据。最后，你必须比较这些不同模型类型的结果，并选择哪一个对给定的数据有效，以便在特定的时间范围内为特定的人群回答给定的问题。\n\
  \n## 本章总结\n\n本章是你理解数据科学的基础。数据科学中几乎所有的主要概念和问题都已得到详细解释。所有这些概念将在贯本书的剩余部分以及你开发的每一个数据科学项目中被使用。在继续开发数据科学项目和构建建模算法之前，理解这些基础概念是非常重要的。\n\
  \n\n\n\n# 调整测试数据集\n## 构建预测模型\n### 基准模型\n## 回归模型\n## 非参数模型\n## 决策时间\n### 实现\n## 本章总结\n\
  \n## 概述\n\n学习数据科学非常像学习乐器。这里有很多底层技术理论，但根结底，学习演奏的唯一方法就是手放在乐器上进行练习。本章就像一场音乐会会（或是酒吧里的即兴演奏）。它将是对各种方法和技术的演示。目标是展示我们在引言章节提到的某些概念，以及将在后续章节中详细介绍的内容的现实示例。\n\
  \n本章的目标是为你提供一个完整的数据科学项目。很容易在所有必要的步骤中迷失，因此这里是工作流的概述：\n\n* 识别业务机会\n* 回顾针对该问题之前的工作\n\
  * 寻找数据\n* 选择性能指标\n* 创建 `TRAIN` / `TEST` 数据集\n* 分析目标变量\n* 分析预测变量\n* 开发建模数据集\n* 构建预测模型\n\
  * 分析结果\n* 实现模型\n\n本章介绍的许多概念将在后续章节中进一步展开，那些章节将对特定的概念和技术提供深入解析。如果你不熟悉某个术语，或者某个概念只是作为工作流的一部分被简单介绍，请不要担心。这些概念在后面的章节中会有详细解释。\n\
  \n本章还将包含大量的 SAS 代码。如果你不 SAS 编码，不要担心。接下来的两个章节将对本章展示的所有技术提供详尽解释。\n\n## 业务机会\n\n想象你是一个拥有某些编程技能的聪明人，你想在居家办公的同时通过在线业务赚大笔钱，并且只花极少的时间维护业务。我知道，这很牵强。谁能想象出这样的人呢？*注：讽刺在书面上很难表现得到位。*\n\
  \n由于具有创业精神，你决定开发一种可以支持另一种更受欢迎的产品。这类产品可以让你获得既有目标观众的收益。这吸引了你懒惰的天性，因为你不需要从开始建立观众。经过一番头脑风暴，你想出了几个想法：\n\
  \n### 亚马逊\n* **业务需求** – 订单总额低于 25 美元的免邮门槛。\n* **解决方案** – 一种在线搜索工具，返回能让你的总额达到最低运费门槛的产品。\n\
  \n### Ticketmaster\n* **业务需求** – 演唱会门票很贵，人们需要知道票价，以便他们攒钱去看 Van Halen 的重聚巡演。\n* **解决方案**\
  \ – 一种在线工具，可以预测在特定日期、特定地点某场演唱会的成本。\n\n### 麦当劳\n* **业务需求** – 冷掉的薯条太难吃了了。\n* **解决方案**\
  \ – 一种在线工具，可以预测任何一家麦当劳何时会有新鲜、热腾的薯条。\n\n这些都是绝妙的主意；然而，其中一些是不可行的。\n\n* **亚马逊** – 快速搜索发现该产品已经存在。第一轮淘汰。\n\
  * **Ticketmaster** – 你太喜欢 Van Halen 了，不希望别人买走门票让你任由黄牛票的摆布。第二轮淘汰。\n* **麦当劳** – 构建模型需要数据，而你无法找到一个包含所有可能的麦当劳历史薯条供应时间的数据库。也许汉堡王有这样一个数据库，但你由于挫败而放弃了。第三轮淘汰。\n\
  \n在你等待下一个绝妙主意时，你决定将你的公寓列在最流行的点对点房屋租赁网站 `Airbnb` 上，通过出租你的客房产生一些被动收入。`Airbnb` 是一个让房东将其房屋或房间租给客人的在线服务。\n\
  \n你登录 `Airbnb`，设置账户，列出公寓特征并上传一些照片。太好了，你准备好赚钱了。然而，你的列表需要回答的最后一个问题是，你每晚想收多少钱？\n\n\
  你不知道你的公寓每晚值多少钱。你住在纽约，所以你的地方很贵，对吧？但你并不住在昂时尚的社区。现在是四月，天气很冷，不是旅游季节。你所在的地区是否有游戏、节日或演唱可能会增加需求，从而提高你可以收取的每晚价格？\n\
  \n你查看周围公寓的可用列表，但它们和你的不一样。有些更大或更小，有些位于不同地区，并提供不同的特征。你正准备由于挫败而放弃。\n\n突然，灵感降临。就是它！这就是你一直在寻找的业务机会。你可以开发一个交互式网络工具，人们可以在其中输入房屋特征，它就会根据特定的地点、日期和特定的房屋特征给出最优的\
  \ `Airbnb` 日价。太棒了！\n\n## 初始问题\n\n现在你有了这个绝妙的主意，你需要回答这四个初始问题：\n\n* 业务机会是什么？\n* 我们有数据来支持这个项目吗？\n\
  * 之前在这方面做了什么工作？\n* 解决方案是什么样子的？\n\n### 业务机会是什么？\n\n快速搜索显示，1994 年 `Airbnb` 在 194 个国家有\
  \ 400 万个房屋列表。尽管这是一个令人鼓舞的消息，但你只想关注美国。进一步的研究显示，美国有近 600,000 个列表。好消息；然而，你是一个谨慎的研究员，你发现每个房东平均有三个列表。因此，你的总市场人口大约为\
  \ 200,000。\n\n你可以为产品选择不同的定价方案：\n\n* 为估价收取一次性费用\n* 收取每月会员费以提供无限估价\n* 放弃费用以换取广告收入\n\
  \n我确定你可以想出许多其他让产品变现的方法，但我们需要专注于开发产品。\n\n### 我们有数据来支持这个项目吗？\n\n在进行网络搜索后，你中奖了！你发现了一个名为\
  \ Inside Airbnb 的项目，那里美国几个城市以及世界其他地方城市的原始 Airbnb 数据已公开（`www.insideairbnb.com`）。Murray\
  \ Cox 创建这个项目是为了阐明关于 Airbnb 对住房动态影响的持续争论。由于 Airbnb 对数据守口如如，这些数据看起来是从网络上爬取的。感谢你，Murray！\n\
  \n| ![](img/Image661.png) | 这是你的第一个决策点。你想承担这个问题的多少部分？你相当有信心每个城市都有其该地区独特的住房动态。你决定将你的数据分析集中在纽约市。这是你居住的地方，你对这座城市的动态非常熟悉。从熟悉的区域开始是合理的方法，在你证明了自己能够成功建模该环境之后再扩展。\
  \ |\n\n\n\n\n稍后我们将详细查看数据，但我们的初步观察显示，数据被分为两类：`Listings`（列表）和`Calendar`（日历）。`Listings`数据集包含了截至\
  \ 2018 年 12 月 6 日纽约市每个列表房源的物理、地理和房主相关的属性描述。`calendar` 数据集包含了大多数房源未来 12 个月的每晚租价格记录。这两个数据集都编码了相关信息，这些信息可能是决定这些物业定价的潜在因素。\n\
  \n太好了，我们已经有了业务计划和数据来支持我们的项目。现在让我们看看在这个领域已经进行过哪些类似的工作。我们不想重复轮子。\n\n## 针对此类问题，之前做过哪些工作？\n\
  \n自从“共享经济”诞生以来，已经有大量关于 Airbnb 以及其他点对点住宿网络网站的文章和学术论文。尽管你已经审查了其中几篇论文，但其中两项研究似乎对你的项目最相关。\n\
  \n### 研究 #1\n\n由 Nick Amato 编写题为《使用 Scikit-Learn 和 Apache Spark 预测 Airbnb 房源价格》的在线文章于\
  \ 2016 年 4 月 20 日发布在 Mapr 博客站点。该文章详细介绍了如何使用 `Python` `Scikit-Learn` 包结合 `Apache\
  \ Spark` 增强性能来构建预测模型。作者在 `Apache Spark` 系统上结合 `GradientBoostingRegressor` 预测模型和\
  \ `GridSearchCV` 交叉验证技术，实现了每晚租金 21.43 美元的误差。\n\n#### 启示\n\n这篇文章提供了一个开发多个预测模型并评估这些模型准确性的极佳分步观察视角。作者还演示了大型建模数据集是如何产生处理问题的。他不得不依靠\
  \ `Apache Spark` 来提高处理效率，并允许在模型开发中使用全范围的穷举搜索方法。所以，让我们记住，`listings` 和 `calendar`\
  \ 数据集的结合产生了一个巨大的数据集，需要大量的计算能力来处理。\n\n### 研究 #2\n\n在《旧金山 Airbnb 房源的邻社区和价格预测》中，Emily\
  \ Tang 和 Kunal Sangani 探索了来自 Inside Airbnb 项目的数据，该数据包含了截至 2015 年 11 月 2 日旧金山 Airbnb\
  \ 平台上完整的 7,029 个待租房源列表。\n\n他们并没有尝试将价格预测为连续变量，而是创建了一个价格的二分类响应变量，指示预测价格是高于还是低于数据集中的中位数价格。这种方法的优点是简化了价格预测任务和模型优劣的评估。然而，这种方法的缺点是，简单线性回归不再是为价格响应变量建模的选，而且预测结果的用处有限，特别是在向房主提供定价建议的应用方面。\n\
  \n此外，在数据清洗阶段，所有包含 70 个或更少房源的社区都被删除了。虽然这减轻了社区分类器的负担，但也限制了模型在房源数量较多社区的实用性。\n\n####\
  \ 启示\n\n价格和社区的最终模型都具有令人印象深刻的预测能力。在测试集中，价格被归类到正确组别（高于或低于中位数）的准确率约为 81%，而社区的分类准确率为\
  \ 42%。虽然这种性能看起来不错，但作者指出，对于大多数应用，将预测价格离散化为更小的箱体（bins）可能是必要的，这也是未来工作的一个很有前景的方向。\n\n\
  ## 解决方案是什么样子的？\n\n我们已经做了功课并审查了不同的方法。我们从之前的研究人员那里获得了一些关于数据的见解，并从这些研究人员那里学习了一些最佳实践。连续目标变量和二分类目标变量方法似乎都有优点。我们建模方法的决策将取决于我们希望解决方案呈现出什么样。\n\
  \n| ![](img/Image661.png) | 下一个决策点是确定我们要尝试解决的问题是什么。我们是想将其构建为回归问题还是分类问题？我们可以很快意识到，我们试图解决的问题是一个连续目标变量问题。Airbnb\
  \ 要求客户列出他们每晚对房屋收取的准确金额。这不是一个二元的是或否问题。我们需要生成一个连续的美元价值。 |\n\n现在我们已经确定了目标变量的类型，我们在建模类型上有几种选择：\n\
  \n1. **透明模型 – 回归模型。**\n    a. **优点** – 这种模型的优点是它会为房屋的每个特征产生一个美元值（通过系数权重显示）。客户将确切知道每个特征对其房屋每晚总成本价值贡献了多少。\n\
  \    b. **缺点** – 这类模型传统上没有更复杂的建模类型准确。这可能导致房主的每晚房价收费过低或过高。\n\n2. **黑箱模型** – 这将是一种更复杂的模型类型（`random\
  \ forest`、`neural network`、`gradient boosting decision tree` 等）。\n    c. **优点**\
  \ – 这种模型的优点是它通常能产生更准确的预测。这可以为房主为其物业提供最可能的挂牌价格。\n    d. **缺点** – 尽管我们能够确定决定每晚房价的最重要特征，但我们无法像使用回归模型那样提供“每个特征的成本”。\n\
  \n我们已经建立了业务模型，识别了数据集，从其他研究人员那里学习了最佳实践，并构思了我们的实施方案。一个不坏的开始。但在幻想由这项业务支付的普拉亚德尔曼度假喝椰奶加汁之前，我们还有更多工作要做。\n\
  \n### 获取数据\n\n我们已经概述了机会；但为了让这个项目落地，我们还需要做出许多决策。这些决策不是盲目做出的。数据科学的一个通用原则是让数据引导你。所以，让我们获取数据。\n\
  \n获取数据有两种方法：\n\n1. 你可以去 Airbnb 数据源直接从他们的网站拉取数据。这是一个优秀的网站，提供了大量的背景信息、见解和许多数据属性。你绝对应该去这个网站看看（`www.insideairbnb.com`）。\n\
  2. 我下载了纽约市的 Inside Airbnb 数据集：`Listings` 和 `Calendar`，并将它们放在了我们专门的 GitHub 仓库中。这些是我们分析将使用的两个主要数据集。\n\
  \n为了保持一致，我建议你使用我们 GitHub 仓库中的数据。Inside Airbnb 网站经常更新数据，因此目前他们网站上的数据可能与我们作为项目一部分分析的数据不同。如果你想重现这个分析以感受数据科学的流程（强烈推荐），请使用\
  \ GitHub 中的数据。\n\n\n\n\n\n依赖用户输入的 Web 数据是出了名的混乱。人们使用的命名规范不一致（例如：NY vs. New York\
  \ vs. NYC），而且他们的拼写通常非常糟糕。我冒昧通过标准化特定字段中使用的命名规范、为每个 `variable` 创建逻辑且一致的格式，对数据进行了清理，并删除了所有的描述性文本字段。这些描述性文本字段通常是体巨大的字段，会消耗大量的内存和处理能力。\n\
  \n如果我们以后想扩展分析，引入自然语言处理（NLP）技术以创建基于文本开发的变量，我们随时可以使用这些描述性文本字段。但现在，让我们先处理清洗后数据集中的数值型和分类字段。\n\
  \n从 GitHub 下载数据并将其放置在你的本地数据文件夹中。获取数据后，你将需要把数据导入 SAS。数据导入代码见下方的程序 2.1。请不要取笑我那糟糕的文件命名规范。\n\
  \n### 程序 2.1: 导入数据\n\n```\nFILENAME REFFILE ‘C:\\Users\\James Gearheart\\Desktop\\\
  SAS Book Stuff\\Data\\listings_clean.csv’;\n```\n\n```\nPROC IMPORT DATAFILE=REFFILE\n\
  ```\n\n```\n DBMS=CSV\n```\n\n```\n OUT= MYDATA.Listings;\n```\n\n```\n GETNAMES=YES;\n\
  ```\n\n```\nRUN;\n```\n\n```\nPROC CONTENTS DATA=MYDATA.Listings; RUN;\n```\n\n\
  对于那些 SAS 编程的新学者来说，这段代码可能看起来有些困惑。别担心；我将在下一章专注于学习 SAS 编程的章节对代码的每个部分进行详细说明。记住，本章的目的是让你了解示例数据科学项目的步骤和决策路径。\n\
  \n### 输出 2.1: 数据内容概览\n\n#### CONTENTS 过程\n\n| 数据集名称 | WORK.LISTINGS | 观测值 | 49056\
  \ |\n| :--- | :--- | :--- | :--- |\n| 成员类型 | DATA | 变量 | 54 |\n\n`PROC CONTENTS`\
  \ 输出的前两行显示，`Listings` 数据集中有 49,056 个观测值和 54 个变量。`PROC CONTENTS` 过程还会生成变量和属性列表。由于该数据中有\
  \ 54 个变量，我将不再在这里列出所有变量。\n\n记住房地产界的老话：“位置，位置，还是位置。”你的模型对房产的位置非常敏感。当你的数据科学问题针对特定位置时，生成数据的地图图表是一个好主意。\n\
  \n### 程序 2.2: 创建地理地图\n\n```\nODS GRAPHICS / RESET WIDTH=6.4in HEIGHT=4.8in;\n```\n\
  \n```\nPROC SMAP plotdata=WORK.Listings;\n```\n\n```\n openstreetmap;\n```\n\n```\n\
  \ scatter x=longitude y=latitude / \n```\n\n```\nmarkerattrs=(size=3 symbol=circle);\n\
  ```\n\n```\nRUN;\n```\n\n```\nODS GRAPHICS / RESET;\n```\n\n| SAS 仅需几行代码就能创建出精美的地图。它们具有极高的定制性，能够创建分级地图和泡泡图，以及许多其他自定义功能。需要更多信息时，你可以根据分类特征对数据点进行分组。程序\
  \ 2.3 中的代码显示了按“社区分组”（Neighborhood Group）特征进行着色的 Airbnb 房源。 | 图 2.1: 程序 2.2 的输出![](img/Image720.png)\
  \ |\n\n### 程序 2.3: 创建彩色地图\n\n```\n /*社区分组地图视图*/\n```\n\n```\nODS GRAPHICS / RESET\
  \ WIDTH=6.4in HEIGHT=4.8in;\n```\n\n```\nPROC SMAP plotdata=WORK.Listings;\n```\n\
  \n```\n openstreetmap;\n```\n\n```\n scatter x=longitude y=latitude /\n```\n\n```\n\
  \ group=neighbourhood_group_cleansed\n```\n\n```\n name=”scatterPlot” markerattrs=(size=3\
  \ symbol=circle);\n```\n\n```\n keylegend “scatterPlot” / \n```\n\n```\n title=’neighbourhood_group_cleansed’;\n\
  ```\n\n```\nRUN;\n```\n\n```\nODS GRAPHICS / RESET;\n```\n\n| 图 2.2 中按社区分组的地图视图提供了数据的直观快照。我们可以看到曼哈顿和布鲁克林的房源似乎最多，而布朗克斯和斯塔滕岛的房源相对较少。\
  \ | 图 2.2: 按社区划分的视图![](img/Image740.png) |\n\n### 选择性能指标\n\n要成为一名成功的数据科学家，你需要对自己极其诚实。很容易在各处通过以下手段小聪明地作弊：\n\
  \n* 有选择性地挑选测试用例\n* 分析 `TEST` 数据集以学习将包含在模型中的信息\n* 选择一个更有利的性能指标\n\n| ![](img/Image661.png)\
  \ | 性能指标是用于衡量过程实现预定义结果良好程度的指标。在预测建模的背景下，性能指标提供了一种评估模型准确性的客观方法。在开始开发模型之前，你首先需要决定一个符合你的目标\
  \ `variable` 且与模型目标一致的性能指标。连续变量最常用的性能指标之一是均方根误差 (RMSE)。该指标衡量了预测值与实际观测值之间的平方距离。 |\n\
  \n![](img/Eq1.jpg)\n\n在使用此指标时需要记住的一个重要事实是，它会对较大的误差进行严厉惩罚。这要求在预测出现巨大偏差时需要格外谨慎。\n\n\
  `RMSE` 是我们将使用的性能指标。\n\n### 训练/测试划分\n\n在开始调查数据并进行任何调整之前，我们首先将其划分为 `TRAIN` 和 `TEST`。\n\
  \n我们通过 `PROC SURVEYSELECT`过程创建 `TRAIN` 和 `TEST` 数据集。对于采样比例的大小没有硬性规定，但 80/20 的划分是一个标准做法。\n\
  \n`PROC SURVEYSELECT` 过程也提供了指定你想要应用的采样策略的选项。\n\n最后，我想建立一个种子。这指定了随机生成的初始种子。在项目的开发阶段，我们希望每次运行代码时都能创建相同的数据。建立种子是确保结果可复的极佳方法。\n\
  \n可以使用任何数字作为种子值。我使用 42 是因为道拉斯·亚当斯在《银河系漫游指南》系列告诉我们，42 是“生命、宇宙及万物的终极问题的答案”。\n\n###\
  \ 程序 2.4: 开发 80/20 划分指示\n\n```\n/*按 80/20 划分数据为 TRAIN 和 TEST 数据集*/\n\n```\nPROC\
  \ SURVEYSELECT DATA=MYDATA.Listings SAMPRATE=0.20 SEED=42\n```\n\n```\n OUT=Full\
  \ OUTALL METHOD=SRS;\n```\n\n```\nRUN;\n```\n\n`PROC SURVEYSELECT` 过程在现有的 `WORK.Listings`\
  \ 数据集中添加了一个字段。`Selected` 字段是一个二值变量，赋值为 1 或 0。随机选择的 20% 观测值标记为 1，而剩下的 80% 则标记为 0。\n\
  \n\n\n\n\n## 输出 2.2: PROC SURVEYSELECT Summary 输出\n\n![](img/Image770.png)\n\n我们可以通过根据\
  \ `Selected` 字段的值将记录输出到每个数据集，从而创建 `TRAIN` 和 `TEST` 数据集。一旦数据正确分配到数据集中，我们就可以删除 `Selected`\
  \ 变量。\n\n## 程序 2.5：创建 TRAIN 和 TEST 数据集\n\n```\nDATA TRAIN TEST;\nSET Full;\nIF Selected=0\
  \ THEN OUTPUT TRAIN; ELSE OUTPUT TEST;\nDROP Selected;\nRUN;\n```\n\nSAS 的优秀特性之一是日志（log）为你提供了大量的信息。一旦提交程序\
  \ 2.5，你就可以检查日志以确认 `TRAIN` 和 `TEST` 数据集的大小符合预期，并且处理过程中没有错误。\n\n```\nNOTE: There were\
  \ 49056 observations read from the data set WORK.FULL.\nNOTE: The data set WORK.TRAIN\
  \ has 39244 observations and 54 variables.\nNOTE: The data set WORK.TEST has 9812\
  \ observations and 54 variables.\nNOTE: DATA statement used (Total process time):\n\
  real time           0.09 seconds\ncpu time            0.07 seconds\n```\n\n太棒了！现在数据已经正确划分，我们可以先把\
  \ `TEST` 数据集放在，直到我们开发出模型并准备在留存样本（hold-out sample）上对其进行测试时再查看它。\n\n## 目标变量分析\n\n\
  项目开发的下一步是识别并分析目标变量。\n\n| ![](img/Image794.png) | 我们将详细详细审查目标变量分析。彻底探索你的目标变量并理解该变量的内容至关重要。我们将做出将影响建模数据集构建和我们最终结果的关键性决策。\
  \ |\n\n由于两个主要因素，目标变量的处理方法与预测变量有所不同：\n\n1. **缺失值和无意义值** – 不建议对目标变量推断此类值。对预测变量进行缺失值推断是常见做法；但你不应该对目标变量这样做。\n\
  2. **预测变量可以合并或删除** – 我们在预测变量上有有许多不同的选择。这些包括推断值、重新分组或删除这些变量。然而，我们只有一个目标变量，因此我们不能删除它，也不能通过推断值来改变变量的根本性质。我们可以以不同的方式转换变量，但这些方法无法改变变量的根本性质。\n\
  \n让我们从关注 `TRAIN` 数据集中的截面数据开始。我们正尝试预测截至 2018 年 12 月 6 日纽约市 Airbnb 房源的每日房价。该数据集包含了几个价格变量供我们选择：\n\
  \n* 价格（Price）\n* 周价\n* 月价\n* 押金（Security deposit）\n* 清洁费\n* 额外客人费\n\n`Price` 变量看起来是用于我们模型的正确选择的。其他与成本相关的变量是以后之后可能使用的重要信息，但现在，我们将调查选定的目标变量。\n\
  \n`PROC UNIVARIATE` 过程是研究连续变量的一种极方法。几行简单的代码就能产生大量关于连续变量分布和范围的信息。\n\n### 程序 2.6：调查目标变量\n\
  \n```\nPROC UNIVARIATE DATA=TRAIN;\nVAR Price;\nHISTOGRAM;\nRUN;\n```\n\n这段代码在 `TRAIN`\
  \ 数据集上调用了 `PROC UNIVARIATE` 过程。我们指定了想要查看 `Price` 变量。我们还请求输出 `Price` 变量的直方图。\n\n\
  `PROC UNIVARIATE` 过程的输出包含大量信息，让我们逐部分查看。\n\n输出 2.3 的第一部分显示数据包含 39,242 个观测值，价格的平均值为\
  \ $152.15。然而，你立即发现该变量存在一个问题。标准差大于平均值。这种差异表明某些巨大的离群值拉高了平均价格。我们还看到偏度（skewness）非常高。偏度衡量数据的对称性。根据一般的经验法则，你希望数据的偏度在\
  \ -1 到 1 之间。这个范围表示数据呈正态分布。由于我们的目标变量的偏度大约比我们要求的出 20 倍，我们可能需要转换变量以创建正态分布。\n\n### 输出\
  \ 2.3：PROC UNIVARIATE 矩表\n\n![](img/Image802.png)\n\n`PROC UNIVARIATE` 输出的后续部分显示基本统计量。此部分包含了\
  \ `Price` 变量的平均值（平均数、中位数和众）以及变异性衡量（标准差、方差、范围和四分位距）。\n\n### 输出 2.4：PROC UNIVARIATE\
  \ 基础统计量表\n\n![](img/Image810.png)\n\n平均值和中位数之间存在显著差异。这种差异进一步证明离群值影响了平均值。范围指标显示了最高值和最低值之间的差异。价格的每日范围是\
  \ $10,000。哇，那个高端一定是个极好的居住地方。\n\n### 输出 2.5：PROC UNIVARIATE 四分位数、极值观测值和缺失值\n\n![](img/Image818.png)\n\
  \n`PROC UNIVARIATE` 输出的最后部分（输出 2.5）包含了关于分布的更多信息。\n\n2.5 的第一部分显示了变量的分位数。它包含了最小值、最大值以及某些百分比点的值。`Price`\
  \ 变量的最大值为 10,000，而最小值为 0。\n\n在这一点，我们需要问自己一个问题。有人每晚收 0 元房费合理吗？也许他们很孤独，只是想要个陪伴。这可能只是数据输入错误的结果。\n\
  \n我们还看到输出的缺失值部分有两个观测值缺失价格数据。这实际上是一个好消息。通常，用户输入的数据比这更混乱。这些统计数据显示，只有极少部分的数据需要调整或删除。我们将在近期做出这些决策。\n\
  \n在分布的高端，我们看到 99% 的切分点值是 $750。99% 和 100% 值之间存在巨大差异。那顶部 1% 的观测值是极端数据点。\n\n我们可以检查的最后一部分输出是\
  \ `Price` 变量的直方图。分布图为我们刚刚查看的统计数据提供了视觉演示。\n\n直方图（输出 2.6）显示出一个高度偏态的分布，带有一个非常长的右尾。这张图表告诉我们的故事与我们在统计表中看到的\
  \ 20.25 偏度值完美吻合。\n\n### 输出 2.6：PROC UNIVARIATE 直方图\n\n![](img/Image825.png)\n\n\
  | ![](img/Image855.png) | 这是我们需要解决的主要决策点之一，它将影响我们的整个项目。我们必须决定保留哪些观测值来建立建模数据集。极端离群值在模型开发中是一个大问题，因为它们以一种不代表大多数数据的方式拉动预测值。\
  \ |\n\n\n\n\n离群值影响的一个旧例子是：如果房间里有 100 个人，他们的平均净资产可能是每人 50,000 美。然而，如果比尔·盖茨走进房间，平均净资产会突然升至每人\
  \ 100,000,000 美。由于比尔净资产处于极端的离群值状态，他拉偏了平均净资产。建立准确平均净资产的唯一方法是将比尔踢出房间。\n\n这个故事的启示是，我们需要剔除某些观测值，以确保模型不受极端离群值的影响。根据经验法则，如果目标值被确定为极端离群值或无意义的数据，我们可以排除前\
  \ 1% 和后 1% 的值。\n\n一个重要的注意事项是，我们只因为目标变量的离群性质而排除了这些观测值。当我们在预测变量中看到离群值时，可以选择设置最大最小阈值并对这些值进行重新编码。\n\
  \n因此，我们调查了目标变量，并确定缺失或为 `$0` 的条目是不合理的。我们还调查了高端值，并确定 `$750` 的截断点可以消除极端离群值。让我们来代码代码……\n\
  \n### 程序 2.7：限制数据并创建对数调整目标值\n\n```sas\n/* 离群值并创建对数变换的价格变量 */\n```\n\n```sas\nDATA\
  \ Price;\n```\n\n```sas\n SET TRAIN;\n```\n\n```sas\n WHERE 30 le Price le 750;\n\
  ```\n\n```sas\n Price_Log = LOG(Price);\n```\n\n```sas\n RUN;\n```\n\n日志显示调整后的数据集包含\
  \ 38,523 个观测值。原始数据集包含 39,241 个；因此，我们只丢失了 715 个观测值。这些被排除的观测值大部分是日房价为 `$0` 的房产。\n\n\
  ```sas\nNOTE: There were 38503 observations read from the data set WORK.TRAIN.\n\
  ```\n\n```sas\n WHERE (Price>=30 and Price<=750);\n```\n\n```sas\nNOTE: The data\
  \ set WORK.PRICE has 38503 observations and 55 variables.\n```\n\n```sas\nNOTE:\
  \ DATA statement used (Total process time):\n```\n\n```sas\n real time         \
  \  0.07 seconds\n```\n\n```sas\n cpu time            0.03 seconds\n```\n\n尽管在建立了上下边界后，我们的目标变量现在变得干净得多，但我们预计数据分布仍然会向右偏。针对\
  \ `Price` 变量开发的 `PROC UNIVARIATE` 过程显示右尾偏度值为 `2.13`。（参见输出 2.7。）\n\n#### 输出 2.7：PROC\
  \ UNIVARIATE 矩形表和直方图\n\n![](img/Image863.png)\n\n![](img/Image870.png)\n\n为了预见这种偏度，我在上一步\
  \ `DATA` 步骤（程序 2.7）中创建了 `Price` 变量的对数变换版本。这种方法将 `Price` 变量转换为正态变量。针对对数变换后的 `Price`\
  \ 变量开发的 `PROC UNIVARIATE` 显示偏度值为 `0.26`。\n\n#### 输出 2.8：针对对数调整目标变量的 PROC UNIVARIATE\
  \ 矩形表和直方图\n\n![](img/Image878.png)\n\n![](img/Image885.png)\n\n太棒了！我们现在有了一个消除了极端离群值和无意义值的数据集。我们还将目标变量转换为正态分布变量。记住，我们可以始终通过对对数取指数将变量的对数值转换回原始比例。但现在，我们准备好继续调查预测变量了。\n\
  \n### 预测变量分析\n\n在开始分析预测变量之前，最好花点思考项目的目标是什么，以及我们如何设想完成后的项目。我们希望开发一种工具，让房东可以使用该工具为他们在\
  \ Airbnb 上的房产提供最佳日房价。预测变量将是房东输入的用于描述其房产特征的值。您可以选择根据地区因素（旅游景点、犯罪率、活动等）包含额外的特征，但目前，我们将重点关注已经收集到的数据。\n\
  \n在这种场景下，我们可以做出一些假设：\n\n*   我们预预期传统的房屋特征在模型中将是显著的：\n    *   位置\n    *   房产类型\n \
  \   *   房产可容的人数\n    *   床的数量、浴室的数量、房间的数量等\n*   某些数据在应用时可能不可用：\n    *   用户评价分数\n\
  \    *   评价数量\n\n这是数据科学家与机器学习工程师区别的一个良好例子。机器学习工程师通常会使用所有可能的数据属性，并通过专注于最小化 `TEST`\
  \ 数据集上的性能指标来创建尽可能可能的预测模型。\n\n数据科学家必须利用业务知识来剔除数据。这在你听来可能很疯狂。我们都接受过数据越多越好的训练。然而，为了实现我们最终项目的愿景，我们需要将数据限制在应用时可用的属性上。尽管数据集包含了许多关于\
  \ Airbnb 上当前房产的特征，但我们无法使用所有这些特征。\n\n### 建模考虑因素\n\n我们在调查预测变量时需要考虑的另一个重要课题是模型设计问题。我们还没有确定要使用何种类型的模型。然而，根据最终实现的模型类型，我们需要采取不同的方法。以下是我们的选择：\n\
  \n*   **参数模型** —— 这可能是某种回归模型，我们知道函数形式。这种类型的模型要求我们对预测变量进行彻底评估：\n    *   数据质量——缺失数据和离群值需要调整。\n\
  \    *   相关性——关联的预测变量需要被识别。\n    *   分类——具有许多水平的变量需要合并为较小的类别。\n    *   缩放——当数值处于不同尺度上时，回归模型表现不佳。例如，房屋价格范围可能是\
  \ `$15K` 到 `$500K`，而同一个模型的“浴室数量”范围为 0 到 5。\n*   **非参数模型** —— 这些模型不假设函数形式，因此可以适应更广泛的函数形式。这些模型（通常）对回归模型的问题不敏感。例如，将原始数据输入树型模型并允许算法确定分类和分点通常是有益的。\n\
  \n我们将从回归模型开始预测变量的分析。我们以后可以使用原始变量来构建非参数模型。\n\n#### 数值变量\n\n理解预测变量的第一步是将数值变量和分类变量分开。我们需要根据变量的构造执行不同类型的分析。\n\
  \n`PROC MEANS` 语句可以为我们提供数值变量的概述。此过程不适用于分类变量，因此我们在 `KEEP` 语句中指定只保留数值变量。\n\n程序 2.8：使用\
  \ PROC MEANS 研究数值数据\n\n```sas\nPROC MEANS DATA=Price (KEEP = _NUMERIC_) N NMISS\
  \ MIN MAX MEAN MEDIAN STD; RUN;\n```\n\n输出 2.9：PROC MEANS 输出\n\n![](img/Image893.png)\n\
  \n这些变量中的某些可以安全地忽略。`ID` 和 `Host_ID` 变量是唯一标识符，因此只要缺失数量（NMISS）值为 0，我们就不需要进一步调查这些。我们也可以忽略\
  \ `Latitude` 和 `Longitude` 变量，因为它们仅用于地图。\n\n### 排除某些预测变量\n\n\n\n\n\n在应用点处，某些数值变量将不可用。我们假设我们工具的用户将列出新属性，而不是已经包含用户评价评分的属性。\n\
  \n因此，我们将排除以下变量：\n\n* 评论数量 (Number of reviews)\n* 评分等级 (Review scores rating)\n*\
  \ 评分准确性 (Review scores accuracy)\n* 评分清洁度 (Review scores cleanliness)\n* 评分入住情况\
  \ (Review scores check-in)\n* 评分沟通情况 (Review scores communication)\n* 评分位置 (Review\
  \ scores location)\n* 评分价值 (Review scores value)\n* 每月评论数 (Reviews per month)\n\
  * 第一条评论 (First review)\n* 最后一条评论 (Last review)\n* 房东加入时间 (osHHost since)\n\n我们还会排除\
  \ `calculated_host_listing_count`，因为这是一个系统生成的变量，在应用点处不可用。`host_listing_count` 变量似乎是该变量的合理替代方案，但我们需要处理它，因为它的最大值（`2310`）和标准差（`92`）看起来非常高。\n\
  \n## 数值缺失值\n\n| ![](img/Image1117.png) | 数据科学家必须做出的常见决策之一是如何处理缺失值。几个变量存在缺失值。这个问题对于回归模型来说特别棘手。回归模型会排除任何包含单个缺失值的观测值。这种排除可能会导致模型产生严重偏差。因此，我们需要对如何处理这些变量做出一些决策。\
  \ |\n\n快速查看表 2.1 中具有某些缺失值的每个变量可以发现，缺失值的百分比从几乎所有值（`square_feet = 99.1%`）到几乎没有值（`host_listings_count\
  \ = 0.0%`）。\n\n表 2.1: PROC MEANS 缺失数据分析\n\n![](img/Image935.png)\n\n我们将根据变量的性质和缺失值的数量采取缺失值插补方法。\n\
  \n* `Square_feet` – 由于几乎所有的观测值都是缺失的，该变量为数据集增加了极少的信息。尝试插补几乎所有的值是荒谬的。我们将从模型中排除此变量。\n\
  * `Security_deposit` 和 `cleaning_fee` – 这些值缺失的逻辑原因是这些属性在租赁协议条件中不需要押金或清洁费。我们将这些缺失值设为零。\n\
  * `Zipcode` – 用均值插补邮政编码没有意义。相反，我们可以识别社区与邮政编码之间的正确相关性，并将其应用于缺失邮政编码值的社区。\n* `Bedrooms`,\
  \ `bathrooms`, `beds`, `host listing count` – 缺失值的观测值很少。我们可以用全局均值来插补它们的值。\n\n##\
  \ 数值调整\n\n| ![](img/Image1117.png) | 数据科学家在处理项目时将做出的最重要的决策之一是他们是否会对预测变量进行调整。这些调整可以包括插补值、设置阈值、缩放和排除变量。本节回顾了我们针对数值变量的一些此类决策点。\
  \ |\n\n* `Host_listings_count` – 该变量具有高度偏态性，某些房东被列出在 Airbnb 上有超过 2,300 个房源。这种偏态可能是数据录入问题，也可能是真实数据；我们并不真正清楚。无论如何，我们都需要调整此变量以处理其分布的偏态性。\n\
  \n对该变量的进一步分析显示，拥有单个房源的房东与拥有 2 到 10 个房源的房东以及拥有超过 10 个房源的大房东之间存在差异。我为这些级别创建了一个分类变量，并弃用了原始的数值变量。\n\
  \n表 2.2: 新创建变量的频率分布\n\n![](img/Image9551.png)\n\n* `Additional fees` – 从直觉上来说，为押金、清洁和额外人员收取的费用会影响属性的基础日费率，这并不符合逻辑。你可以主认为这些费用反映了属性的质量水平，但它们完全是主观的，而不是属性的固有特征。这些费用可以单独进行建模，并为您的客户生成建议的费用金额。目前，我们将选择在建模中排除它们。\n\
  * `Zipcode` – 这是一个很难处理的特征。邮政编码显然是一个强预测因素，因为我们的背景业务知识告诉我们，位置是日费率的主要驱动因素。然而，对于我们的数据集，这里有\
  \ 187 个不同的邮政编码。对于我们的回归模型方法，这会严重膨胀模型中的自由度，我们面临着维度灾难。（关于此主题的概述请参见上一章）。\n\n其他分类特征提供了类似的信息。这些包括\
  \ `neighbourhood_cleansed`、`neighbourhood_group` 和 `city`。包含 `ZIP code` 可能会导致过拟合。对于我们的回归模型方法，我们需要对使用哪个位置变量做出决策。我建议超过\
  \ 20 个级别的位置变量会导致稀疏的建模空间，使用具有五个级别的 `neighbourhood_group_cleansed` 变量将让我们获益。其他位置变量将保留用于其他建模方法。\n\
  \n* `Maximum_nights` 和 `minimum_nights` – 这些是高度偏态的数据属性，并带有明显的录入错误。这些变量被截断在 99% 分位数值。对于最大晚数，我们设置了\
  \ 1125 的上限阈值，对于最小晚数，我们设置了 31 的上限阈值。\n\n* `Beds`, `bedrooms` 和 ` bathrooms` – 这些每个变量都有相关的离群值。例如，`beds`\
  \ 变量的最大值为 21，而第 99 分位数仅为 5 张床。我们需要在第 99 分位数处截断这些变量，以避免影响模型。因此，`beds` 变量截断在 5，`bedrooms`\
  \ 变量截断在 4，`bathrooms` 变量截断在 3。\n\n## 共线性分析\n\n回归模型的基础假设之一是预测变量需要相互独立（不相关）。这一假设非常重要，因为当两个或多个变量密切相关时，很难分离它们各自的影响。最终，共线性会通过增大回归系数的标准误来降低估计的准确性。\n\
  \n下表提供了一个解释相关系数的良好经验法则。任何大于 0.7 或小于 -0.7 的相关系数都被认为高度相关。\n\n表 2.3: 相关性表\n\n| 相关性大小\
  \ | 解释 |\n| :--- | :--- |\n| 0.9 到 1.0 (-0.9 到 -1.0) | 极相关 |\n| 0.7 到 0.9 (-0.7\
  \ 到 -0.9) | 高相关 |\n| 0.5 到 0.7 (-0.5 到 -0.7) | 中度相关 |\n| 0.3 到 0.5 (-0.3 到 -0.5)\
  \ | 低相关 |\n| 0.0 到 0.3 (0.0 到 -0.3) | 忽略不计的相关 |\n\nSAS 提供了两种很好的方法通过 `CORR` 和 `REG`\
  \ 过程识别多重线性。`PROC CORR` 创建了一个包含每个变量组合相关系数的相关矩阵。\n\n这里有一个很好的 SAS 技巧。你可以创建一个全局变量，包含数据集中所有的变量，并将它们放入单个宏变量中。下面的代码展示了你如何调用\
  \ `CONTENTS` 过程并保留该过程中的变量名称，并将它们放入单独的数据集中。然后，创建一个 SQL 过程，将这些变量放入一个用取符号符号（`&`）调用的宏变量中。现在，你只需要调用宏变量，而不是反复编写每个变量名称了！\n\
  \n程序 2.9: 将所有变量放入宏变量\n\n```\n/* 创建全局数值变量 */\n```\n\n\n\n\n\n```\nPROC CONTENTS NOPRINT\
  \ DATA=Clean (KEEP=_NUMERIC_ DROP=id host_id latitude longitude Price Price_Log)\
  \ OUT=var1 (KEEP=name);\n```\n\n```\nRUN;\n```\n\n```\nPROC SQL NOPRINT;\n```\n\n\
  ```\n SELECT name INTO:varx separated by “ “ FROM var1;\n```\n\n```\nQUIT;\n```\n\
  \n```\n%PUT &varx;\n```\n\n```\n/* 创建相关性分析 */\n```\n\n```\nPROC CORR DATA=Clean;\n\
  ```\n\n```\n VAR &varx.;\n```\n\n```\nRUN;\n```\n\n`PROC CORR` 使用了我在宏变量中保留的数值变量。默认的相关性统计量是皮尔逊\
  \ r。该过程的结果如下所示。我对我前 10% 的高低相关性值进行了颜色编码。\n\n表 2.4：相关性矩阵\n\n![](img/Image991.png)\n\
  \n如果相关系数高于 0.7 或低于 -0.7，则认为变量之间高度相关。相关性值的最低 10% 被高亮为绿色。我们可以看到负相关并不是问题，因为最强的负相关仅为\
  \ -0.07。\n\n对于正相关变量，我们看到若干相关系数高于 0.7 的情况。可用性变量之间高度相关是合理的。如果一个物业在 30 天内可用，那么它在接下来的\
  \ 60 天、90 天和 365 天内也是可用的。此外，入住人数（accommodates）与床位（beds）之间的相关性也是合理的。如果一个物业有更多的床，它就能容纳更多的人。\n\
  \n### 方差膨胀因子 (VIF)\n\n让我们从另一个角度观察这些特征之间的相关性。我们可以创建一个带有 `VIF` 选项的 `REG`过程，这将为模型中的每个变量提供方差膨胀因子。方差膨胀因子通过全模型方差比例除以单变量模型的方差计算得出。`VIF`\
  \ 的最小可能值为 1，但一个好的经验法是，你希望 `VIF` 小于或等于 5。\n\n带有数值宏变量和 `VIF` 语句的 `PROC REG` 代码包含在下面的程序\
  \ 2.10 中。我还添加了产生共线性诊断的 `COLLIN` 语句。\n\n程序 2.10：PROC REG 中的方差膨胀因子\n\n```\nPROC REG\
  \ DATA=WORK.CLEAN PLOTS=ALL;\n```\n\n```\n model Price_Log= &varx / \n```\n\n```\n\
  \ selection=forward VIF COLLIN;\n```\n\n```\nRUN;\n```\n\n输出 2.10：带有 VIF 值的参数估计表\n\
  \n![](img/Image998.png)\n\n我们从输出 2.10 中看到 `availability_60` 和 `availability_90`\
  \ 变量的 `VIF` 已经脱离图表了！如果我们考虑这些变量告诉了我们关于物业的信息，可能会将其解释为需求的衡量标准。我相信，我们可以安全地排除 60、90 和\
  \ 365 天的可用性变量，仍然保留从单个 `availability_30` 变量中获取的必要信息。\n\n| ![](img/Image1022.png)\
  \ | 然而，对于这个数据集，相关性问题刚刚开始。我们计划创建额外的变量（称为特征工程），并计划在模型中添加多项式变量。所有这些变量与它们所基于的其他变量都会具有某种程度的相关性。因此，我们与其尝试找到所有相关的变量并逐个剔除，不如向预测模型中引入正则化选项。正则化的概念在本书的回归章节中进行了详细检查。正则化模型是一种在算法中引入收缩参数的模型。该参数限制了模型，以确保模型不会过拟合数据。\
  \ |\n\n正则化的两个主要选项是 `RIDGE` 和 `LASSO` 回归。对于此项目，我们将使用 `LASSO` 回归。`LASSO` 方法在回归函数中添加了绝对值偏置项。这种方法减少了多共线性的负面影响，从而减少了模型的方差。这种方法的效果是在不相关时不将系数置零。我们将在书的后部分详细回顾\
  \ `LASSO` 方法论，但目前，我们只需要理解它是一种减少我们模型中多共线性影响的方法。\n\n到此时，你可能开始意识到，数据科学不仅仅是把你的所有数据都丢进一个\
  \ `XGBOOST` 模型中（嘿，它们在 Kaggle 上总是获胜）并最小化你的测试误差指标。这种方法在建模竞赛和学术领域效果良好，但如果你正在构建支持真实世界业务的的模型，就有许多必须做出的决策，这些决策可能会不利你最小化测试指标的能力。\n\
  \n你必须问自己的问题是：“我的目标是什么？”最小化测试指标不是目标。通过为客户提供尽可能具有操作性的信息来建立对他们有价值的业务才是你的目标。\n\n###\
  \ 散点矩阵\n\n分析我们数值变量的另一种方法是生成每个变量与目标变量之间关系的散点图。SAS 通过散点矩阵图为这些关系提供了很好的视觉化演示。该图包含一系列散点图，允许研究人员轻松查看每个数值预测变量与目标变量之间的关系。我们还可以看到数值预测变量彼此之间的关系。在输出\
  \ 2.11 中，我们看到 `price` 与 `accommodates` 之间存在强正相关关系，以及 `price` 与 `guests included`\
  \ 之间的关系。 | 输出 2.11：散点矩阵![](img/1043.png)\n\n程序 2.11：散点矩阵\n\n```\nPROC SGATTER DATA=Clean;\n\
  ```\n\n```\n TITLE‘散点矩阵’;\n```\n\n```\n MATRIX Price_Log accommodates guests_included\
  \ minimum_nights maximum_nights/ \n```\n\n```\n START=TOPLEFT ELLIPSE = (ALPHA=0.05\
  \ TYPE=PREDICTED) NOLEGEND;\n```\n\n```\nRUN;\n```\n\n## 特征工程\n\n特征工程根据现有变量创建额外变量的过程。它不仅仅向数据集中添加新特征，而是花时间考虑你的变量及其包含的信息，从而从中挖掘更多价值。\n\
  \n例如，下面的代码根据 `accommodates`、`beds` 和 `bathrooms` 创建了新变量。当我们考虑房地产定价以及潜在租客在查看 Airbnb\
  \ 列表时寻找的特征时，我们可能会考虑不仅是总床数、浴室数和总入住人数，还会考虑“每人床数”和“每人浴室数”的比率。\n\n程序 2.12：特征工程\n\n```\n\
  /*     特征工程 */\n```\n\n```\nIF beds not in (., 0) then\n```\n\n```\n beds_per_accom\
  \ = accommodates / beds;\n```\n\n```\nelse beds_per_accom = 0;\n```\n\n```\nIF bathrooms\
  \ not in (., 0) then\n```\n\n```\n bath_per_accom = accommodates / bathrooms;\n\
  ```\n\n```\nelse bath_per_accom = 0;\n```\n\n如果一个物业声称可以容纳 12 人，但它只有一个浴室，这会严重影响需求，因此可能是一个包含在模型中的强大特征。\n\
  \n### 多项式变量\n\n目标变量与预测变量之间的所有关系并不是线性的。事实上，大多数时候都不是线性的。在模型中添加多项式变量为模型提供了捕捉数值变量中非线性关系的机会。\n\
  \n为二值数值指示创建多项式变量是没有意义的。因此我们只对已经决定保留在回归数据集中的连续数值变量生成多项式变量。\n\n程序 2.13：创建多项式\n\n```\n\
  poly_accom = accommodates**2;\n```\n\n```\npoly_bath = bathrooms**2;\n```\n\n```\n\
  poly_guests = guests_included**2;\n```\n\n```\npoly_min = minimum_nights**2;\n```\n\
  \n```\npoly_max = maximum_nights**2;\n```\n\n\n\n\n\n```\npoly_avail = availability_30**2;\n\
  ```\n\n## 标准化数值变量\n\n对于数值变量，我们需要考虑的最后一个调整与尺度问题有关。如果你查看散点矩阵图，你会发现每个变量的尺度都是不同的。尺度远大的变量对模型的影响比尺度较小的变量更强。例如，与\
  \ `guests_included` 相比，`maximum_nights` 变量对模型结果的影响会被人为放大。调整数值变量以考虑尺度差异的一种简单方法是对其它们进行标准化。标准化有几种不同的方法论，我们将在稍后的章节中介绍其中几种。如果你对预测变量运行\
  \ `PROC UNIVARIATE`，你会发现它们的尺度都各不相同，且其中几个变量呈现出显著的偏态。处理这两个问题的简单方法是对这些变量进行对数数转换（log\
  \ transform）。\n\n| 输出 2.12: 缩放后的散点矩阵![](img/Image1065.png) |\n\n程序 2.14 根据原始数值数据创建了对数转换。注意，我为每个变量都加了\
  \ 1。这样做是因为如果变量的值为 0，对数转换是未定义的。这种情况会产生缺失值。（记住，带有缺失值的观测值会被排除在回归算法之外）。因此，如果我们给值加 1，会将\
  \ 0 变为 1，而当我们取 1 的对数时，值为 0。这种轻微的全局偏移导致所有变量正移动一个单位，这不会影响结果；但它确保了数据集中没有不可预见的缺失值。\n\
  \n### 程序 2.14: 创建对数转换\n\n```\n/*使用对数转换标准化变量*/\n```\n\n```\nlog_accom    = log(accommodates\
  \ +1);\n```\n\n```\nlog_bath     = log(bathrooms +1);\n```\n\n```\nlog_bedrooms\
  \ = log(bedrooms +1);\n```\n\n输出 2.12 显示了对数变量的散点矩阵。注意变量尺度的变化（特别是 `maximum_nights`\
  \ 变量）。此外，由于对数转换，变量的分布也变得中心化了。\n\n我们对数值变量做了大量工作：\n\n- 我们研究了这些变量的分布，并对上限和下限阈值做了决策。\n\
  - 我们识别了在应用点无法获得的变量，因此将它们排除在进一步考虑之外。\n- 我们识别了缺失值，并对每个变量应用了适当的推断。\n- 我们对连续变量进行了分箱，并在必要时创建了分类变量。\n\
  - 我们进行了相关性分析，并决定使用 `LASSO` 回归模型设计来处理多共线性问题。\n- 我们通过特征工程创建了新变量。\n- 我们开发了多项式变量以识别非线性关系。\n\
  - 我们通过对数转换对变量进行了缩放。\n\n还不糟，但我们才刚刚开始！我希望你并不认为只需把原始数据丢进深度学习神经网络模型，它就会奇迹般地给你完美的答案。无论我多么希望如此，实际的预测建模在任何建模发生之前都需要大量的初步数据分析和决策。\n\
  \n让我们继续查看字符变量。\n\n## 字符变量\n\n我们应用了多种不同的技术来分析和调整数值变量。这些技术包括 `PROC MEANS` 和 `PROC\
  \ UNIVARIATE`。这些技术对于数值变量效果很好，但对字符变量并不理想。字符变量的主要分析方法是 `FREQ` 过程。\n\n我们可以通过在 `PROC\
  \ FREQ` 的 `KEEP` 语句中保留字符变量来分析它们。\n\n### 程序 2.15: 字符变量的频率分布\n\n```\nPROC FREQ DATA=Clean\
  \ (KEEP= _CHARACTER_) ORDER=FREQ; RUN;\n```\n\n`FREQ` 过程会创建一个信息表，包含分类变量的每个层级以及观测值的频率、占总观测值的百分比、累计频率和观测值的累计百分比。`room_type`\
  \ 变量的 `PROC FREQ` 输出示例位于下方输出 2.13。\n\n### 输出 2.13: PROC FREQ 输出\n\n![](img/Image1074.png)\n\
  \n根据你应用于数据集的机器学习算法类型，字符变量的处理方式也不同：\n\n- **回归模型**：具有大量类别（层级）的分类变量可能会带来很大问题。对于每个层级，回归模型都会增加一个自由度。你可以将每个层级视为自己的变量。因此，如果一个分类变量有\
  \ 100 个层级，那么就等于向你的建模数据集中添加了 100 个独立变量。你可以很容易看到这会导致维度灾难（由于维度过多导致数据集非常稀疏）。\n- **基于树的模型**：字符变量的层级会自动组合在一起，以确定最佳分割点。这类模型不需要你折叠层级，因为算法会为你完成。缺点是，你将无法获得每个分类层级的详细信息。\n\
  \n我假设我们将同时构建回归模型和决策树模型以进行比较。对于回归建模数据集，我将指示应该使用哪种插补方法来准备建模数据。\n\n下方包含了分类变量的摘要表，以及每个变量拥有的层级数量和我建议的插补方法。\n\
  \n| 房东相关字段 – 这些字段与房东及其与 Airbnb 的关系直接相关。它们还包含了描述房东可以选择的要求的字段。这些是二进制字段（两个层级）且没有缺失值，因此我们不需要插补这些值。这些包括：Host_is_superhost,\
  \ Host_has_profile_pic, Host_identity_verified, Instant_bookable, Require_guest_profile_picture,\
  \ Require_guest_phone_verification | 表 2.5: 字符变量表![](img/Image1099.png) | 位置字段 –\
  \ 这些字段具有许多层级，且它们之间强相关。层级范围从 5 到 223。虽然位置变量对定价非常重要，但我们无法在回归模型中使用所有这些变量。所有这些变量都在告诉我们相同的信息，即所在地。我们可以预计，如果将这些变量留在模型中，模型将过拟合\
  \ `TRAIN` 数据集，无法良好地泛化到 `TEST` 数据集。\n\n如果我们把 `zip`、`city`、`neighbourhood_cleansed`\
  \ 和 `neighbourhood_group_cleansed` 作为变量引入回归模型，这四个变量会导致模型产生数千个额外的分层（维度灾难）！然而，所有这些变量都\
  \ reality 提供给基于树的模型，算法会将层级分组为在树叶节点具有最佳分割点的类别。\n\n| ![](img/Image1117.png) | 由于我们首先开发的是回归模型，让我们决定层级超过\
  \ 20 级的分类变量不适合我们的模型。幸运的是，我们仍然拥有 `neighbourhood_group_cleansed` 变量，它有五个层级，我们可以将其保留用于回归模型。\
  \ | 物业类型 – 该变量有多个层级；但 97%的观测值被前 5 个变量捕捉。剩余的 24 个层级可以合并。我使用了识别与目标变量相关率的层级的方法。这是在\
  \ `PROC MEANS` 中使用 `CLASS` 语句处理分类变量的一种有趣用法。 |\n\n\n\n\n\n## 程序 2.16：识别具有相似目标值率的水平\n\
  \n```sas\nPROC MEANS DATA=Clean;\nCLASS Property_Type;\nVAR Price;\nRUN;\n```\n\n\
  该分析结果显示，剩余的 24 个水平可以合并为两组，平均每晚高于 200 美元的水平与平均每晚低于 200 美元的水平之间有清晰的界限。我们可以在 `DATA`\
  \ 语句中将这些水平合并两组。\n\n### 程序 2.17：合并分类水平\n\n```sas\nDATA TRAIN_ADJ;\nSET Clean;\nIF\
  \ Property_Type in (‘Apartment’, ‘House’, ‘Townhouse’, ‘Loft’, ‘Condominium’) THEN\
  \ Property_CAT = Property_Type;\nELSE IF Property_Type in (‘Houseboat’, ‘Resort’,\
  \ ‘Tent’, ‘Serviced ap’, ‘Aparthotel’, ‘Hotel’, ‘Boat’, ‘Other’, ‘Boutique ho’)\
  \ THEN Property_CAT = ‘Group 1’;\nELSE Property_CAT = ‘Group 2’;\nIF host_has_profile_pic\
  \ = ‘ ‘ then host_has_profile_pic = ‘f’;\nIF host_identity_verified = ‘ ‘ then host_identity_verified\
  \ = ‘f’;\nIF host_is_superhost = ‘ ‘ then host_is_superhost = ‘f’;\nDROP Property_Type\
  \ is_location_exact calendar_updated host_response_rate host_response_time;\nRUN;\n\
  ```\n\n对新开发的 `Property_CAT` 变量进行频率分布分析，输出 2.14 显示了合并后的水平。\n\n## 输出 2.14：新分类的频率分布\n\
  \n![](img/Image1126.png)\n\n## 虚拟变量\n\n不，我并不是在侮辱这些变量。虚拟变量是一种用于表示包含某一类别的二变量。例如，你可以在模型中创建一个单一吸烟类别，包含\
  \ `smoker`（烟民）和 `non-smoker`（非烟民）值。我们可以为这些类别创建一个虚拟变量，并设置值为 1 或 0 的 `smoke_ind` 变量来指示观测值是否被分类为\
  \ `smoker`。设置一个 `non-smoker_ind` 变量是多余的，因为任何 `smoker_ind` 值为 0 的观测值必然是 `non-smoker`。\n\
  \n对于我们决定保留在建模数据集中的字符变量，我们将为这些变量的每个水平创建虚拟变量。例如，`bed_type`（床型）变量的五个水平可以创建五个独立的虚拟变量：\n\
  \n### 程序 2.18：虚拟变量创建\n\n```sas\nIF bed_type = ‘Airbed’ then b_air = 1; else b_air\
  \ = 0; \nIF bed_type = ‘Couch’ then b_couch = 1; else b_couch = 0; \nIF bed_type\
  \ = ‘Futon’ then b_futon = 1; else b_futon = 0; \nIF bed_type = ‘Pull-out Sofa’\
  \ then b_pullout = 1; else b_pullout = 0;\nIF bed_type = ‘Real Bed’ then b_real\
  \ = 1; else b_real = 0;\n```\n\n我们将对以下字符变量遵循此步骤：\n\n- `Bed_type`\n- `Neighbourhood_group_cleansed`\n\
  - `Room_type`\n- `Host_is_superhost`\n- `Host_has_profile_pic`\n- `Host_identity_verified`\n\
  - `Instant_bookable`\n- `Require_guest_profile_picture`\n- `Require_guest_phone_verification`\n\
  - `Host_count_CAT`\n- `Property_CAT`\n\n相比之下，字符变量的分析和调整比数值变量更简单。我们不需要担心任何字符变量的相关性、离群值、转换或缩放。我们只需要确保水平不过过多，并且它们对于我们的模型目的具有直觉逻辑。建模算法将决定哪些字符变量是重要的。\n\
  \n## 调整 TEST 数据集\n\n我们花了大量时间探索 `TRAIN` 数据集并进行了若干调整。我们需要对 `TEST` 数据集应用相同的调整，以便模型能够正确应用到我们的留存\
  \ `TEST` 数据集并分析我们的结果。\n\n让我们尝试记住为调整 `TRAIN` 数据集以准备回归建模所做的所有工作：\n\n- 对目标变量（`price`）进行对数转换\n\
  - 对目标变量设置阈值，即价格不缺失且不等于 30 美元或大于 750 美元\n- 通过通过 `neighbourhood_cleansed` 交叉引用邮编推断\
  \ `zipcode` 的缺失值\n- 将 `security_deposit`（押金）和 `cleaning_fees`（清洁费）的缺失值设置为 0\n- 将\
  \ `bathrooms`（浴室）、`bedrooms`（卧室）和 `beds`（床）的缺失值设置为 1\n- 将 `bathrooms` 的上限设置为 4，`bedrooms`\
  \ 设置为 5，`beds` 设置为 5\n- 将 `host_listing_count`（房源数量）的缺失值设置为 1\n- 为房源数量创建一个分类变量，将值分为三类\n\
  - 设置 `maximum_nights`（最大晚数）的上限为 1125，`minimum_nights`（最小晚数）为 31\n- 合并 `property_type`（物业类型）变量\n\
  - 创建特征工程变量\n- 创建多项式变量\n- 从分类变量创建虚拟变量\n- 对数值变量进行对数转换\n\n尽管从 `TRAIN` 数据集中删除了几个变量……\n\
  \n## 构建预测模型\n\n终于！这就是我们来的目的！你们忍受了 30 页的数据分析就为了进入预测建模的光明世界。有一句说法，数据科学家 80% 的时间用于研究数据，20%\
  \ 时间用于建模。\n\n### 基准模型\n\n基准模型被认为是具有少量数据元素的简单模型。许多人使用简单回归作为基准模型。这是一种不需要特征工程和超参数调优即可快速建立模型的方法。然而，我建议我们退一步查看更基础的平均值模型。\n\
  \n检查简单平均值产生的误差可以作为最基础的基准模型。我们只需计算 TRAIN 数据集中所有观测值的全局平均值，并将其作为预测值。\n\n让我们进一步扩展这个概念创建基础平均值：\n\
  \n- 全局平均值——TRAIN 数据集中所有观测值的单一值。\n- `Neighbourhood_Group_Cleansed` 平均值——该变量五个水平的区域平均值。\n\
  - `Neighbourhood_Cleansed` 平均值——该变量 223 个水平的区域平均值。\n\n创建这些平均值和预测误差的代码包含在 GitHub\
  \ 仓库中。\n\n下面的信息表和相关的条形图显示了预测器的性能有多糟糕。\n\n### 表 2.6：基准 RMSE 性能指标\n\n| | Baseline\
  \ Global Avg | Baseline Neigh Group Avg | Baseline Neigh Avg |\n| :--- | :--- |\
  \ :--- | :--- |\n| TRAIN | $ 102.11 | $ 96.84 | $ 90.32 |\n| TEST | $ 101.21 | $\
  \ 96.09 | $ 89.26 |\n\n### 图 2.3：基准 RMSE 性能的条形图\n\n![](img/Figure_2.3.jpg)\n\n\n\
  \n\n哇，这些模型太糟糕了。`RMSE` 值极高。对这些误差的一种解释可能是：如果你有一个房产的正确日补贴标准为 $300，那么全局平均模型建议的价格为 $139.26，因为每个房产的预测价格都是这个值。这导致了\
  \ $160.74 的残差误差。我不会为这项服务支付一分钱。\n\n从这个例子中可以的一个很好的启示是，随着你向模型中添加更多信息，残差误差将会减少。全局平均包含的信息非常少，因此错误率最高。获得更差错误率的唯一方法是在\
  \ $30 到 $750 之间计算一个随机价格（因为这是我们的价格范围），并将其作为预测价格。出于好奇，我确实这样做了，随机价格预测的 `RMSE` 为 $356.10。\n\
  \n当我们通过为 `neighbour_group_cleansed` 和 `neighbour_cleansed` 变量创建平均价格来增加更多信息时，我们的错误率稳定下降。然而，尽管有所改进，这些模型仍然非常糟糕。\n\
  \n但这确实为我们提供了一个展示预测建模力量的机会。\n\n## 建模方法\n\n构建模型有两种不同的方法。第一种是非常谨慎的方法，模型开发者刻意选择包含在模型变量，并理解每个变量将如何对最终预测值做出贡献。这种方法通常用于模型需要高度可解释性的场景。\n\
  \n第二类方法用于模型开发者不需要理解变量如何贡献于最终预测值的情况。这类模型的主要目标是预测准确性。\n\n这两种模型都有价值，取决于它们所解决的业务问题以及它们将实施的环境。例如，如果这是一个预测地区将获得公共援助金额的政府模型，那么该模型最好具有高度的可解释性。对模型的输入、方法论和输出将会有大量的审查。\n\
  \n然而，如果模型是一个图像识别模型，那么目前对于理解模型如何得到特定的预测值并没有那么多审查。这里的关注关注点是准确性。没有人真的会在意你是如何获得正确的图像分类的；他们只关心它是否准确。\n\
  \n我们将开发这两种类型的模型，以展示这些不同方法的益处。\n\n## 回归模型\n\n我们在建模之前执行的大多数数据分析和转换都是专门为回归建模准备数据而设计的。要建立成功的回归模型，你需要理解每个变量的内容和分布，以及这些变量之间的关系。\n\
  \n当满足以下条件时，回归模型的参数函数形式性能最佳：\n\n* 识别了缺失值和离群值，并进行了适当的填补和限制处理。\n* 单个数据属性不是偏态的（这就是我们创建对数转换的原因）。\n\
  * 预测变量之间互不相关（这就是我们开发相关性分析的原因）。\n* 类别变量被合并并转换为虚拟变量。\n\n## 广线性模型\n\n`GLMSELECT` 过程在广线性模型框架内执行效应选择。这种方法是非常灵活的过程，具有多种选择方法和输出选项。该过程允许通过指定包含标准、停止标准、评估指标和其他许多选项来自定义你的模型。\n\
  \n开发此模型的第一步是创建一个宏（参见高级 SAS 编程章节），其中包含了我们想要提供给模型的所有变量。此代码创建一个名为 `lasso_var` 的宏变量，我们将将其作为\
  \ `GLMSELECT` 过程的预测变量。\n\n### 程序 2.19：创建宏变量\n\n```\n*************************************************;\n\
  ```\n\n```sas\n/* GLM 回归模型                  */\n```\n\n```\n*************************************************;\n\
  ```\n\n```sas\n%let lasso_var = log_accom log_bath log_guest log_min log_max log_avil30\
  \ log_bedsper n_bronx n_brooklyn n_manhattan n_queens r_entire r_private h_super\
  \ h_profile h_verified b_couch b_futon b_pullout b_real instant require_pic require_phone\n\
  ```\n\n```sas\nhcount_level1 hcount_level2 hcount_level3 p_apart p_condo p_group2\
  \ p_house p_loft p_townhouse n_staten r_shared b_air p_group1 poly_accom poly_bath\
  \ poly_guests poly_min poly_max poly_avail; \n```\n\n为了生成评估图表，我们首先确保包含了 `ODS GRAPHICS\
  \ ON` 语句。此时，我不会详细描述 `PROC GLMSELECT` 语句中的每种选择，因为我们将在本书的线性回归章节中详细介绍它们。\n\n### 程序\
  \ 2.20：PROC GLMSELECT 模型\n\n```sas\nPROC GLMSELECT DATA=WORK.TRAIN_FINAL OUTDESIGN(ADDINPUTVARS)=Work.reg_design\
  \ \n```\n\n```sas\n PLOTS(stepaxis=normb)=all;\n```\n\n```sas\n MODEL Price_Log=&lasso_var.\
  \ / \n```\n\n```sas\nselection=lasso(stop=&k choose=SBC);\n```\n\n```sas\n OUTPUT\
  \ OUT = train_score;\n```\n\n```sas\n SCORE DATA=TEST_FINAL PREDICTED RESIDUAL OUT=test_score;\n\
  ```\n\n```sas\nrun;\n```\n\n关于此代码的几点需要注意：\n\n* `PROC GLMSELECT` 语句的第一行包含了 `OUTDESIGN`\
  \ 语句。该语句将选定的效应列表保存在宏变量 `&_GLSMOD` 中，该宏变量稍后可以使用。\n* 我指定了我想要使用的图表。\n* 我指定要使用宏变量 `lasso_var`\
  \ 来预测 `price_log`。\n* 我指定要使用 LASSO 正则化方法，并使用施瓦茨贝叶斯准则 (`SBC`) 停止。\n* 我指定要输出 `TRAIN`\
  \ 数据集。\n* 我指定要对 `TEST` 数据集进行评分，并输出预测值和残差。\n\n\n\n\n让我们从另一个角度来看这个问题。我们可以构建相同的 `GLMSELECT`\
  \ LASSO 模型，但我们可以一次添加一个变量，并在每次添加变量时计算一次 `RMSE` 评分。然后，我们可以评估该变量对 `TRAIN` 和 `TEST`\
  \ 数据集的影响。通过这种方法，我们能够看到留出 `TEST` 数据集的最佳变量截断点在哪里。\n\n代码有点长，但我将向你展示启动循环的开头部分：\n\n###\
  \ 程序 2.21：逐个向 GLMSELECT 模型中添加变量\n\n```\n%macro do_glm;\n%do k=1 %to 42;\nPROC GLMSELECT\
  \ DATA=WORK.TRAIN_FINAL OUTDESIGN(ADDINPUTVARS)=Work.reg_design \nPLOTS(stepaxis=normb)=all;\n\
  MODEL Price_Log=&lasso_var. / \nselection=lasso(stop=&k choose=SBC);\nOUTPUT OUT\
  \ = train_score;\nSCORE DATA=TEST_FINAL PREDICTED RESIDUAL \nOUT=test_score;\nrun;\n\
  %end;\n%mend;\n%do_glm\n```\n\n注意，我在宏内部创建了一个 `DO` 循环。这个过程创建了一个从 1 到 42 的值范围。`DO`\
  \ 循环从 `lasso_var` 宏变量中的第一个变量开始，一直循环到列表中的最后一个变量。循环的每次执行都会将顺序列表中的下一个变量添加到模型中。\n\n\
  需要了解的重要的一点是，变量是根据之前的 `GLMSELECT` LASSO 模型确定的重要性顺序排序的。这个顺序非常重要，因为我们正在遍历变量，并按照从最重要到不重要的顺序添加它们。\n\
  \n因此，本质上，我们运行了 42 次 `GLMSELECT` LASSO 模型。GitHub 仓库中代码的其他部分计算了 `TRAIN` 和 `TEST` 数据集的\
  \ `RMSE`，并将其附加到主 `RMSE` 表中。\n\n下面的图表显示了 `TRAIN` 和 `TEST` 数据集的计算出的 `RMSE` 值。这与上面的\
  \ `SBC` 图表相似，在图中我们看到前几个变量带来了巨大的收益，但随着额外变量的增加，收益在递减。\n\n#### 图 2.4：TRAIN 和 TEST 数据集的计算\
  \ RMSE 值\n\n![](img/Figure_2.4.jpg)\n\n该分析告诉我们，当第 25 个变量进入模型时，模型开始过拟合。这一点是 `TEST`\
  \ 数据集的 `RMSE` 开始增加的点。注意，随着我们向模型中添加更多变量，`TRAIN` 的 `RMSE` 持续下降（或至少保持平稳）。这正是我们在第一章中学到的偏差-方差权衡（bias-variance\
  \ tradeoff）的知识。\n\n所以，现在我们有了关于 `GLMSELECT` LASSO 模型的两个视角。第一个视角是在我们运行模型并评估 `TRAIN`\
  \ 数据集的模型输出时生成的。该视角表明数据集中有 33 个具有统计学意义的变量。\n\n第二个视角考虑了偏差-方差权衡，并显示了 `TRAIN` 与 `TEST`\
  \ 数据集之间 `RMSE` 的差异。该视角显示模型在发生过拟合之前有 24 个具有统计学意义的变量可以使用。\n\n这两种视角在技术上都是正确的；然而，我们正在构建一个业务模型，而这类模型的重要考虑因素之一就是它的简洁性（parsimonious）。\n\
  \n### 简洁模型（Parsimonious Model）\n\n简洁模型是指用最少的预测变量实现所需的解释水平的模型。这一想法源于奥卡剃刀原理（Occam’s\
  \ razor）。该原理是一种哲学，主张人不应该做出比最小需求更多的假设。\n\n| 快速查看表 2.7 可以发现，前四个变量为模型提供了大量信息。其余 38\
  \ 个变量为模型增加了少量信息。我们可以尝试通过计算每个变量导致 `TEST` `RMSE` 下降百分比来量化每个额外变量的影响。表 2.7 显示，前四个变量对\
  \ `TEST` `RMSE` 有显著影响。然而，在第四个变量加入模型后，这种影响迅速消失。 | 表 2.7：RMSE 分析![](img/Image1219.png)\
  \ |\n\n当我们对比基于 `TRAIN` vs. `TEST` `RMSE` 建议使用 24 个预测变量的模型，与仅建议使用四个变量的简洁模型时，24 个变量模型的\
  \ `TEST` `RMSE` 为 0.40776，而 四个变量模型的 `TEST` `RMSE` 为 0.42649。其差异为 (-0.01873)。你可以认为这种差异充其量是微不足道的。\n\
  \n#### 自助模型（Bootstrapped Model）\n\n在转向非参数模型之前，我们可以最后看一眼 `GLMSELECT` LASSO 模型。我们需要解决的问题是，我们的模型结果是否由于一个特别幸运的数据集恰好为我们产生了一个好值。根本问题是模型在多次抽取数据时是否稳定。\n\
  \n自助模型反复对建模数据集进行采样，并在每个样本上构建一个模型。然后对这些模型进行平均处理，以创建系数的最终估计。下面的代码创建了自助模型。\n\n####\
  \ 程序 2.22：自助 GLMSELECT 模型\n\n```\n%let parsi_var = r_entire\nods noproitle;\nods\
  \ graphics / imagemap=on;\nproc glmselect data=WORK.TRAIN_FINAL outdesign(addinputvars)=Work.reg_design\
  \ \nplots=(stepaxis=normb)=all n_group1;\nmodel Price_Log=&lasso_var. / \nselection=lasso(stop=&k\
  \ choose=SBC)\nseed=1;\noutput out = train_score;\nscore data=TEST_FINAL PREDICTED\
  \ RESIDUAL \nout=test_score;\nrun;\n```\n\n关于程序 2.22 的几点说明：\n\n| ● 我从简洁模型中选择了前四个变量，并将它们放入宏变量\
  \ `parsi_var`。● 我们仍然使用 LASSO 选择法并根据 `SBC` 进行选择。● 我们通过放回创建 1000 个样本并对所有样本取平均。 | 输出\
  \ 2.16a：自助模型效应选择![](img/1239.png) |\n\n自助方法的输出为我们提供了大量信息。效应选择百分比告诉我们特定变量具有显著性的样本百分比。输出\
  \ 2.16 证实了四个预测变量在 1000 个样本中的每一个都是显著的。\n\n自助模型的下一个部分显示了 1000 个样本的平均参数估计。这种方法不仅产生了系数估计，还产生了标准差以及估计分位数。这些值对于理解每个预测变量的估计范围至关重要。\n\
  \n输出 2.16b：自助模型参数估计\n\n![](img/1248.png)\n\n| 最后，自助模型输出包含每个参数估计的图形分布，以及截距。该图显示了\
  \ 1000 个样本中截距和系数计算值的分布。这是中心极限定定理的一个很好的真实案例。 | 输出 2.16c：自助模型参数分布![](img/1268.png)\
  \ |\n\n| ![](img/1117.png) | 我们针对回归模型需要做的最终决定是决定应该使用哪种回归模型。 |\n\n我们的选择有：具有 33 个统计学意义变量的全线性回归模型、基于\
  \ `TRAIN/TEST` 评估的具有 24 个统计学意义变量的线性回归模型，以及具有 4 个统计学意义变量的简洁自助模型。\n\n简洁模型的益处超过了另外两个回归模型带来的微小预测收益。我建议我们采用具有四个变量的简洁自助线性回归模型。\n\
  \n\n\n\n## 非参数模型\n\n当我们开始构建 Airbnb 模型的建模过程时，我们的初始假设是构建一个回归模型。在此假设下，我们对数据进行了几项更改：\n\
  \n-   对某些数值变量进行了分类\n-   合并了某些字符变量\n-   对数值变量进行了标准化\n-   为字符变量创建了哑变量（dummy variables）\n\
  -   排除了层级过多的字符变量\n\n这些都是构建回归模型时的必要步骤。该过程的结果是一个建模数据集，它包含了服从正态分布的目标变量和预测变量，以及一系列二变量，回归模型可以轻松将这些变量读入算法，并为最终建模输出中的每个显著变量产生系数。这些调整为我们提供了一个透明的模型，我们理解每个变量是如何纳入模型的，并且拥有每个变量的最终系数权重。对于我们如何推导出特定观测值的预测值，没有任何任何未被解释的地方。\n\
  \n正如我们在第一章中所学到的，建模还有另一种方法。非参数模型不假设特定的函数形式。这类模型可以适应各种函数形式。线性回归模型假设目标变量与预测变量之间的关系是线性的（因此得名）。非参数模型如\
  \ `decision trees`（决策树）、`support vector machines`（支持向量机）、`neural networks`（神经网络）以及其他模型并不假设目标与预测变量之间的关系是线性的。\n\
  \n非参数模型非常灵活并能产生高度准确的预测，但代价是缺乏透明度。例如，`gradient boosting decision tree`（梯度提升决策树）模型产生的测试指标分通常比线性回归模型低得多，但无法清楚看到算法是如何产生这些结果的。我们将在书中详细探讨这些算法及其输出，但现在，让我们将这些建模类型应用到我们的\
  \ Airbnb 数据集，并将它们的预测结果与线性回归模型进行比较。\n\n为了比较，我们将非参数建模类型限制在基于树的模型。构建其他类型的非参数模型可能会有额外的收益，但在这个例子中让我们专注于基于树的模型。\n\
  \n### 建模数据\n\n基于树的模型的主要优势之一是，我们不需要担心预测变量的分布。在上一节中，我们花费了大量时间分析每个变量并进行了多处更改为建模准备数据。基于树的模型不要求数值变量服从正态分布，分类变量层级过多也不是一个问题。这是因为决策树算法将预测空间划分若干若干简单的区域。\n\
  \n算法会识别使 `Residual Sum of Squares (RSS)`（残差平方和）最小化的变量和分裂点。我们将在书中后面详细回顾决策树的方法论，但现在，我们需要理解决策树方法从根本上不同于线性回归方法。决策树评估每个变量（包括数值和分类变量），并对变量分裂点进行最优选择，以减少预测空间的\
  \ `RSS`。数值变量在连续谱的某处进行分裂，而分类变量的层级则被归到最优分组中以减少 `RSS`。\n\n由于分类变量的层级被分组，我们不需要担心诸如 `ZIP\
  \ code`（邮政编码）这样具有数百层级的变量。算法将评估该变量，并识别该变量分为两个类别的最优分组，以划分预测空间。例如，如果一个分类变量有 100 层，决策树可能会将其中\
  \ 95 个变量归为一类，将剩下的 5 个变量归为另一类。这些类别在每组中不需要具有等数量层级。\n\n### 决策树\n\n我们将探索的第一类基于树的模型是简单的决策树。这种方法在完整的\
  \ `TRAIN` 数据集上构建单棵决策树，我们可以将生成的模型应用于留存的 `TEST` 数据集。这类模型被称为 `recursive binary splitting\
  \ model`（递归二分分裂模型）。这是因为该方法从单个变量开始，将预测空间分为两个（二分）空间，然后算法评估每个生成的预测空间并递归地（反复地）应用相同的分裂方法。\n\
  \n这种方法被称为“贪婪的”（greedy），因为它在树的每个分支上都选择最好的分裂点。它从不前瞻地做出可能产生更好结果的分裂决策。\n\n既然我们现在可以利用完整的\
  \ Airbnb 数据集，我们可以从访问在创建所有哑变量之前构建的数据集开始。该数据集包含了在合并并转换为二元哑变量之前的所有分类变量。\n\n下面的代码从创建哑变量之前创建的数据集中收集数值变量和字符变量，并将数值和字符变量放入两个独立的宏变量中。这对于稍后我们需要为每种变量类型制定不同的规范将很有帮助。\n\
  \n### 程序 2.23: 创建数值和字符宏变量\n\n```\n/*为数值变量创建宏变量*/\nPROC CONTENTS NOPRINT DATA=TRAIN_ADJ\
  \ (KEEP=_NUMERIC DROP=id\nhost_id price price_log)\nOUT=VAR3 (KEEP=name);\nRUN;\n\
  \nPROC SQL NOPRINT;\nSELECT name INTO:tree_num separated by “ “ FROM VAR3;\nQUIT;\n\
  \n%PUT &tree_num;\n\n/*为字符变量创建宏变量*/\nPROC CONTENTS NOPRINT DATA=TRAIN_ADJ (KEEP=_CHARACTER_\
  \ \nDROP=Property_CAT)\nOUT=VAR4 (KEEP=name);\nRUN;\n\nPROC SQL NOPRINT;\nSELECT\
  \ name INTO:tree_char separated by “ “ FROM VAR4;\nQUIT;\n\n%PUT &tree_char;\n```\n\
  \n生成的数据集包含 43 个变量，混合了原始数值变量、对数转换后的数值变量、特征工程后的数值变量、多项式数值变量以及未经任何合并的原始字符变量。这些变量如表\
  \ 2.8 所示所示我们将所有这些变量交给决策树算法，允许它选择最优变量和分裂点，从而产生最低的 `RSS` 值。\n\n表 2.8: Variable Listing!\
  \ Images/Image1302.png\n\n尽管这个过程为建模算法提供了更大的自由，但与线性回归方法相比，它还需要大量的计算能力。当我们通过向决策树中添加随机化和提升来增加复杂性时，我们相应地增加了开发这些模型所需的计算能力。对于这种规模的数据集来说这可能不是问题，但当你尝试将这些技术应用于更大的数据集时，你将遇到计算能力和内存空间的问题。幸运的是，SAS\
  \ 有几个功能可以帮助你将建模任务分散到不同的计算机核心上，这可以缓解这一问题。\n\n为了创建单棵决策树，我选择使用 `HPSPLIT`。这是一种高性能的决策树算法，具有许多自定义选项。下面的代码在\
  \ `TRAIN` 数据集上开发单棵决策树，并输出一个评分代码文件，该文件可以应用于留存的 `TEST` 数据进行评估。\n\n### 程序 2.24: 简单决策树模型\n\
  \n```\nODS GRAPHICS ON;\nPROC HPSPLIT DATA=WORK.TRAIN_ADJ seed=42;\nCLASS &tree_char.;\n\
  ```\n\n\n\n\n\n```\n MODEL price = &tree_char. &tree_num.;\n```\n\n```\n OUTPUT\
  \ OUT=hpsplout;\n```\n\n```\n CODE FILE='C:\\Users\\James Gearheart\\Desktop\\SAS\
  \ Book Stuff\\Data\\hpsplexc.sas’;\n```\n\n```\nrun;\n```\n\n### 关于决策树代码的说明\n\n\
  - 我正在基于 `TRAIN_ADJ` 数据集构建模型。该数据集包含了适用于建模的所有数值型和字符变量。\n- 我包含了一个 `SEED` 语句以确保结果的可重复性。\n\
  - `CLASS` 语句包含了所有的字符变量。\n- 目标变量是 `PRICE_LOG`，预测变量是包含所有数值型和字符变量的两个宏变量。\n- 代码文件输出一个包含所有分裂逻辑的\
