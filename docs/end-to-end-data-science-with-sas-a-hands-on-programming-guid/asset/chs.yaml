  \ | 228 | 93 | 321 | 2.45 | 28.97% | 56.02% | 6.74% | 87.61% | |\n| V | 0.2762 |\
  \ 0.2762 | 157 | 79 | 236 | 1.99 | 33.47% | 53.80% | 5.72% | 93.33% | |\n| GOOD\
  \ | 0.1481 | 0.1962 | 298 | 92 | 390 | 3.24 | 23.59% | 49.57% | 6.67% | 100.00%\
  \ | |\n| | 0.1481 | 0.9448 | 1404 | 1380 | 2784 | | | | | | |\n\n## 随机森林\n\n单个决策树模型的主要缺点是它是一种“贪婪算法”。这意味着它在树构建的每个阶段都选择最佳变量和分裂点，但它永远不会向前或向后回看，以确定其他划分方式是否会产生更好的整体结果。这个过程导致了静态树的产生，无法保证它是基于树的最佳方法。\n\
  \n随机森林算法试图缓解决策树的这种固有缺点。它是一种集成方法，通过构建几棵不同的决策树并对结果进行平均处理。它在算法上等同于“群体智慧”。\n\n随机森林的通用构建从构建自助数据集（bootstrapped\
  \ data set）开始。图 8.8 展示了自助数据集的通用构建。我们将使用表 8.4 中的相同数据表来演示构建自助数据集的过程。该过程包含两个部分：\n\n\
  1. **随机选择预测器** – 在示例中，数据集中只有四个预测器。通常，在真实数据集中会有更多预测器。随机选择合适数量预测器的通用经验规则是取预测器数量的平方根（`sqrt()`）。稍后在我们讨论超参数调优时，可以调整此值以找到最优值。\n\
  2. **随机选择观测值** – 对基础数据集进行随机采样，以创建一个与原始基础数据集具有相同观测数量自助数据集。需要记住的一点是，这是有放回抽样。因此，同一个观测值可能会被包含多次。\n\
  \n### 图 8.8：自助数据集的构建\n\n![](img/Image1414.png)\n\n图 8.8 显示预测器 `Year`（年份）和 `Age Cat`（年龄分类已被随机选择为自助数据集的预测器。然后对基础数据集的观测值进行随机采样，创建一个与基础数据集观测量相同的自助数据集。注意，灰色高亮的观测值每个都被选择了两次，而深灰色观测值被选择了四次。\n\
  \n一旦构建了自助数据集，就会在该数据集上开发决策树。在随机森林模型中构建单个决策树的第一步，是随机选择一个可用预测器的子集来评估根节点。在确定根节点后，会选择另一组随机变量来确定分支节点。这种随机选择过程贯穿于树的构建始终。随机森林算法在树构建的每一步中只考虑变量的随机子集。\n\
  \n上述开发单个树的过程会重复数百次。由于树构建的随机性，这产生了各种不同的树。\n\n## 对未见观测值进行评分\n\n一旦所有的决策树都构建完成，一个新的未见观测值将输入所有决策树中，每棵树的结果将汇总为所有树的总和。例如，如果一个分类随机森林模型中有\
  \ 100 棵决策树，那么结果可能如表 8.6 所示。\n\n### 表 8.6：随机森林总结示例\n\n| 是 | 否 |\n| :--- | :--- |\n\
  | 85 | 15 |\n\n在这个示例中，随机森林中的 85 棵独立决策树导致最终的类别响应为“是”，而 15 棵独立决策树的结果为“否”。随机森林模型的最终预测结果通过分类模型的投票法实现。因此，在这个示例中，最终预测值将是\
  \ `Yes`。\n\n对于分类树，投票法决定最终结果；对于回归树，平均值决定最终结果。使用自助数据集并利用聚合进行决策的过程被称为自助法（bagging）。\n\
  \n## 评估模型准确性\n\n由于在构建自助数据集期间随机选择了观测值，通常原始数据集的约 1/3 不会进入自助数据集。这被称为“袋外”（out-of-bag）数据集。我们可以使用此数据集作为留出测试数据。我们可以使用此数据集作为留出测试数据，并运行随机森林来评估准确性。图\
  \ 8.9 显示了袋外观测值的划分。\n\n### 图 8.9：袋外观测\n\n![](img/Image438.png)\n\n我们可以通过随机森林测量袋外样本的准确性。袋外样本被错误分类的比例是“袋外误差”。\n\
  \n随机森林模型的一个关键优势是可以使用整个数据集作为训练集。不需要将数据集分为 `TRAIN` 和 `TEST` 数据集。\n\nSAS 提供了一个高性能的过程来\
  \ To 随机森林。`PROC HPFOREST` 是一个灵活的过程，可以通过选择超参数值来定制您的模型。程序 8.8 展示了该过程的通用结构和若干超参数选项。\n\
  \n为了一致性，我们将继续使用在本章中使用的数据集。\n\n### 程序 8.8：随机森林示例\n\n```sas\nPROC HPFOREST DATA=mydata.bank_train\
  \ \n```\n\n```sas\n VARS_TO_TRY=8 MAXTREES=300 TRAINFRACTION=0.6\n```\n\n```sas\n\
  \ MAXDEPTH=15 LEAFSIZE=10\n```\n\n```sas\n ALPHA=0.1;\n```\n\n```sas\n TARGET target/LEVEL=binary;\n\
  ```\n\n```sas\n INPUT &num_vars. / LEVEL=interval;\n```\n\n```sas\n/*       INPUT\
  \ &char_vars. / LEVEL=nominal;*/\n```\n\n```sas\n SAVE FILE = ‘C:/Users/James Gearheart/Desktop/SAS\
  \ Book Stuff/Data/bank_RF.bin’;\n```\n\n```sas\n ODS OUTPUT FITSTATISTICS = FITSTATS(rename=(Ntrees=Trees));\n\
  ```\n\n```sas\nrun;\n```\n\n关于程序 8.8 的说明：\n\n● 使用 `mydata.bank_train` 数据集开发随机森林。\n\
  \n● 在 `PROC HPFOREST` 选项中指定了若干超参数值。\n\n● 每一个选项都可能对模型的准确性产生重大影响。\n\n\n\n\n\n- 指定了\
  \ `TARGET` 变量。所有输入变量（包括目标变量）必须指定数据类型。在这种情况下，目标变量是一个 1 或 0 的数值二分类指标。\n- `INPUT` 语句指定了要包含在模型中的预测变量。`PROC\
  \ HPSPLIT` 要求分别指定数值和字符变量。由于我之前已经为数值变量和字符变量分别创建了独立的宏变量，因此我使用了数值宏变量 `num_vars` 来指定数值变量。`LEVEL`\
  \ 语句指定这些变量为间隔变量。\n- 尽管我在为建模准备数据时已经将字符变量转换了数值型，但我包含了一段如何指定字符变量并将其值设置为名义（nominal）的语句。该语句已被注释掉。\n\
  - 包含了 `SAVE FILE` 选项，以便我们可以随机森林模型对其他数据集进行评分。我将此评分逻辑保存在 C 盘的一个空间中。请注意该文件是 `.bin`\
  \ 文件，而不是 `.sas` 文件。\n- `OUT` 语句为 `PROC HPSPLIT` 创建的拟合统计量创建一个输出文件。我将 `NTREES` 字段重命名为\
  \ `TREES`。\n\n## 随机森林模型输出\n\n`PROC HPSPLIT` 提供了几个重要的输出表来评估模型性能。模型信息表（Model Information）提供了开发者的超参数值以及\
  \ SAS 提供的默认值的摘要。输出 8.16 显示了我们开发的模型的模型信息表。在模型信息表之后，SAS 提供了额外的表格，包括观测值数量（Number of\
  \ Observations）表和基准拟合统计（Baseline Fit Statistics）表。最后一张表提供了训练数据的平均平方误差、误分类率和对数损失（log\
  \ loss）。基准拟合统计描述了模型构建之前的数据。\n\n## 输出 8.16：`PROC HPFOREST` 输出\n\n![](img/Image1445.png)\n\
  ![](img/Image1452.png)\n![](img/Image14601.png)\n\n输出 8.17 显示了作为随机森林部分的每棵树的拟合统计表。该表将包含开发的所有\
  \ 300 棵树的信息；但由于空间限制，我只显示了前 20 棵树。\n\n## 输出 8.17：`PROC HPFOREST` 拟合统计表\n\n![](img/Image1469.png)\n\
  \n第一列显示添加到随机森林中的树的数量。这是一个累积过程，每增加一棵树都会与之前所有的树结合。因此，我们可以看到每增加一棵树对整个森林的累积收益。\n\n第二列显示了随机森林的叶节点数量。注意，随着向森林中添加更多的树，这个数字会不断增加。\n\
  \n第三列和第四列显示了训练集和袋外（OOB）数据集的平均平方误差（ASE）。我们可以看到，随着森林中树的增加，ASE 持续下降。\n\n第五列和第六列显示了训练集和\
  \ OOB 数据集的误分类率，而第七列和第八列显示了训练集和 OOB 数据集的对数损失（log loss）。注意，随着树的增加，所有的误差指标都在继续下降。\n\
  \n你可能会认为，如果继续增加更多的树，误差率可能会缩小到零。遗憾的是，事实并非如此。存在一个收益递减的点，增加更多的树不会影响模型的准确性。\n\n| ![](img/Image1022.png)\
  \ | 随机森林不能过拟合数据是一个常见的误解。虽然增加更多树不会导致过拟合，但模型可能会以与决策树相同的方式发生过拟合。也就是说，如果树深太深，或者给定类别中允许的最小观测数太小，模型将过拟合训练数据，无法良好地泛化到未见的观测值。\
  \ |\n\n## 变量重要性\n\n`PROC HPSPLIT` 输出结果之一是损失减少变量重要性（Loss Reduction Variable Importance）表。该表显示了数据每个变量的相对重要性。虽然我们无法像在回归模型那样评估每个变量的实际值，但变量重要性表允许研究人员查看由数百棵树生成的海量数据，并提取每个变量的相对重要性。\n\
  \n输出 8.18 显示了损失减少变量重要性表中的前 10 个变量。\n\n## 输出 8.18：`PROC HPFOREST` 变量重要性表\n\n![](img/Image1511.png)\n\
  \n确定变量重要性有两个标准：\n\n1. 排除变量时准确率下降的程度。\n2. 选择该变量划分节点时吉尼纯度（Gini impurity）的下降程度。\n\n\
  随机森林被认为是“黑盒”模型，因为我们并不确切预测是如何生成的。我们无法确定变量 `pdays` 的值恰好是 `0.375`。这是由于自助法（bootstrapping）过程的随机性，该特定变量在随机森林的每棵树中都会变化，而在其中几棵树中该变量并没有被包含。\n\
  \n变量重要性表提供了对模型中每个变量相对重要性的某种洞察。表按 OOB Gini 列排序。\n\n## 评分算法\n\n`PROC HPSPLIT` 没有直接在过程中对新数据集进行评分的选项。相反，该过程允许你输出一个\
  \ `SCORE FILE`，你可以在 `HP4SCORE` 过程中将其应用于未见的数据。程序 8.9 展示了 `PROC HP4SCORE`。\n\n## 程序\
  \ 8.9：使用 `PROC HP4SCORE` 评分数据集\n\n```sas\nPROC HP4SCORE DATA=mydata.test;\nID;\n\
  SCORE FILE = ‘C:/Users/Jamesheart/Desktop/SAS/bank.bin’\nOUT = RF_SCORED;\nRUN;\n\
  ```\n\n### 程序 8.9 注意：\n\n- `PROC HP4SCORE` 应用于 `mydata.test` 数据集。该数据集是用于构建随机森林的袋外数据集。\n\
  - `ID` 选项指定数据中的唯一标识。这通常是账户号码或客户编号。在我们情况下，我们在构建初始数据集时使用了唯一标识。\n- `SCORE FILE` 语句指定了路径、文件名和类型。该评分文件包含了应用于随机森林的所有逻辑，并与训练数据集结构相同。\n\
  - `OUT` 语句创建一个评分后的输出数据集。\n\n一旦我们对袋外数据集进行了评分，就可以像使用 KNN 和简单决策树那样评估模型的准确性。这为我们提供了一个一致的指标，以与之前在数据集上构建的模型进行比较。随机森林应用于袋外数据集得到的吉尼分数为\
  \ 51.60。\n\n\n\n\n\n| | | 0.4149 | 0.4494 | 162 | 117 | 279 | 1.38 | 41.94% | 63.38%\
  \ | 8.48% | 76.74% |\n| | | 0.3675 | 0.4148 | 175 | 103 | 278 | 1.7 | 37.05% | 59.62%\
  \ | 7.46% | 84.20% |\n| | | 0.3134 | 0.3674 | 202 | 77 | 279 | 2.62 | 27.60% | 55.61%\
  \ | 5.58% | 89.78% |\n| V | 0.2589 | 0.3133 | 204 | 74 | 278 | 2.76 | 26.62% | 52.39%\
  \ | 5.36% | 95.14% |\n| GOOD | 0.1184 | 0.2587 | 211 | 67 | 278 | 3.15 | 24.10%\
  \ | 49.57% | 4.86% | 100.00% |\n| | | 0.1184 | 0.9778 | 1,404 | 1,380 | 2,784 |\
  \ | | | | |\n\n## 超参数调优算法\n\n在 `PROC HPSPLIT` 提供的所有可用选项，你如何知道选择哪些值可以产生最佳树呢？随机森林中应该包含多少棵树？算法应该随机采样多少个变量？这些问题都通过超参数调优的概念来解答。超参数调优的主要方法是为每个选项尝试一系列范围的值，并选择产生最佳结果的值。让我们来看看直接从优秀的\
  \ SAS 在线文档网站提取的两个示例：[`documentation.sas.com/`](https://documentation.sas.com/)。\n\
  \n## 评估最佳树的数量\n\n在程序 8.7 的原始 `PROC HPSPLIT` 中，我们创建了一个 `output` 语句，将拟合统计量放入一个名为“fitstats”的数据集中。现在我们可以利用该输出数据集来检查随着树数量增加，误分类率的变化。程序\
  \ 8.10 展示了该分析的开发过程。\n\n### 程序 8.10：调优“树的数量”超参数\n\n```\ndata fitstats;\nset fitstats;\n\
  label Trees = ‘Number of Trees’;\nlabel MiscAll = ‘Full Data’;\nlabel Miscoob =\
  \ ‘OOB’;\nrun;\nproc sgplot data=fitstats;\ntitle “OOB vs Training”;\nseries x=Trees\
  \ y=MiscAll;\nseries x=Trees y=MiscOob/lineattrs=(pattern=shortdash thickness=2);\n\
  yaxis label=’Misclassification Rate’;\nrun;\n```\n\n该程序简单地重新标记了几个属性，使解释更于理解，然后创建了一个折线图来数据化数据。输出\
  \ 8.20 显示了通过 `PROC SGPLOT` 开发的图表。\n\n### 输出 8.20：完整数据集和 OOB 数据集的误分类率\n\n![](img/Image1577.png)\n\
  \n此图显示了完整数据和 OOB 数据集的误分类率。我们可以看到，当模型中加入前十几棵树时，误分类率开始迅速下降。之后，误分类率继续下降，直到模型中加入约 150\
  \ 棵树。此时，误分类率的趋势变得平缓。我们可以从分析中确定，150 棵树是随机森林中包含的最佳数量。\n\n## 确定最佳变量数量\n\n超参数调优的方法可能稍微复杂。在尝试确定采样的最佳变量数量时，我们需要创建一个程序，在几个值上构建随机森林，并确定其中哪些值产生了最佳结果。程序\
  \ 8.11 展示了该分析的开发过程。\n\n```\n%macro hpforest(Vars=);\nproc hpforest data=mydata.bank_train\
  \ maxtrees=300\nvars_to_try=&Vars.;\nTARGET target/LEVEL=binary;\nINPUT &num_vars.\
  \ / LEVEL=interval;\nods output FitStatistics = fitstats_vars&Vars.(rename=(Miscoob=VarsToTry&Vars.));\n\
  run;\n%mend;\n%hpforest(vars=all);\n%hpforest(vars=40);\n%hpforest(vars=26);\n%hpforest(vars=7);\n\
  \ndata fitstats;\nset fitstats;\nlabel Trees = ‘Number of Trees’;\nlabel MiscAll\
  \ = ‘Full Data’;\nlabel Miscoob = ‘OOB’;\nrun;\nproc sgplot data=fitstats;\ntitle\
  \ “OOB vs Training”;\nseries x=Trees y=MiscAll;\nseries x=Trees y=MiscOob/lineattrs=(pattern=shortdash\
  \ thickness=2);\nyaxis label=’Misclassification Rate’;\nrun;\n```\n*(注：原文包含程序 8.10\
  \ 的冗余/重复代码块，为了清晰起见已进行合并，同时保持了逻辑。）*\n\n\n\n\n\n3. 计算观测目标值减去平均值以得到残差值。\n\n4. 使用残差值作为更新的目标值，并针对该目标值构建一个浅决策树。浅决策树在超参数中指定，其中叶节点数量限制在\
  \ 8 到 32 之间。\n\n5. 梯度提升会缩放树，但算法会对所有树进行相同幅缩放。然后梯度提升根据上一棵树的误差构建另一棵树，然后对该树进行缩放。此过程一直持续，直到算法构建了要求的树数量，或者额外的树不再提高模型拟合效果。\n\
  \n6. 取连续目标变量的平均值作为初始权重。通过实际值减去平均值产生残差。这产生了一系列残差。现在构建决策树来预测这些残差。\n\n7. 梯度提升添加一个学习率来缩放新树的贡献。这样做是为了避免过拟合。学习率的加入强制算法向最终预测迈出小步（以梯度下降的方式）。这使得对测试集的预测结果更好。\n\
  \n8. 然后，我们根据上一棵树的残差添加另一棵树，并继续这种基于上一棵树残差添加树的过程。\n\n9. 对于分类问题，初始预测是几率对数（log of the\
  \ odds）。我们使用逻辑函数将几率对数转换为概率。\n\n![](img/LoFuncEq.jpg)\n\n10. 然后我们计算观测值的残差并继续在残差值上构建决策树。\n\
  \n## 梯度提升模型\n\nSAS  `TREEBOOST` 过程用于构建梯度提升决策树。该过程的结构与决策树和随机森林过程类似，尽管 `PROC TREEBOOST`\
  \ 相比简单的决策树有许多更多可用选项。\n\n程序 8.12 展示了 `PROC TREEBOOST` 的结构和选项。\n\n## 程序 8.12\n\n```\n\
  ODS GRAPHICS ON;\n```\n\n```\nPROC TREEBOOST DATA = mydata.bank_train\n```\n\n```\n\
  \ CATEGORICALBINS = 10\n```\n\n```\n INTERVALBINS = 100\n```\n\n```\n EXHAUSTIVE\
  \ = 5000\n```\n\n```\n INTERVALDECIMALS = MAX\n```\n\n```\n LEAFSIZE = 32\n```\n\
  \n```\n MAXBRANCHES = 2\n```\n\n```\n ITERATIONS = 1000\n```\n\n```\n MINCATSIZE\
  \ = 50\n```\n\n```\n MISSING = USEINSEARCH\n```\n\n```\n SEED = 42\n```\n\n```\n\
  \ SHRINKAGE = 0.1\n```\n\n```\n SPLITSIZE = 100\n```\n\n```\n TRAINPROPORTION =\
  \ 0.6;\n```\n\n```\n INPUT &num_vars. / LEVEL = INTERVAL;\n```\n\n```\n/*      \
  \ INPUT &charx. / LEVEL = NOMINAL;*/\n```\n\n```\n TARGET TARGET / LEVEL = BINARY;\n\
  ```\n\n```\n IMPORTANCE NVARS = 50 OUTFIT = BASE_VARS;\n```\n\n```\n SUBSERIES BEST;\n\
  ```\n\n```\n CODE FILE = ‘C:/Users/James Gearheart/Desktop/SAS Book Stuff/Data/bank_GB.bin’;\n\
  ```\n\n```\n SAVE MODEL = GBS_TEST FIT = FIT_STATS \n```\n\n```\n IMPORTANCE = IMPORTANCE\
  \ RULES = RULES;\n```\n\n```\n RUN;\n```\n\n## 程序 8.12 的注释（这些定义直接取自 SAS 9.3 SAS\
  \ Enterprise Miner 和 Text Miner 过程参考）：\n\n- 调用 `PROC TREEBOOST` 以在 `MYDATA.TRAIN`\
  \ 数据集上开发梯度提升算法。\n- `CATEGORICALBINS` 选项设置为 `10`。该选项指定了在搜索分裂点之前用于收集分类输入值的初步分箱数量。\n\
  - `INTERVALBINS` 选项设置为 `100`。该选项指定了为输入区间值创建的初步分箱数量。\n- `EXHAUSTIVE` 选项设置为 `5000`。该选项指定了在对所有可能的划分进行完全枚举时允许的最大分裂点数。\n\
  - `INTERVALDECIMALS` 选项设置为 `MAX`。该选项指定了区间输入变量分裂点的小数位精度。\n- `LEAFSIZE` 选项设置为 `32`。该选项指定了形成新分支所需的最小观测值数量。\n\
  - `MAXBRANCHES` 选项设置为 `2`。该选项指定了分裂规则可以产生的最大子集数量。\n- `ITERATIONS` 选项设置为 `1000`。该选项指定了提升序列中的项数。对于区间和二分类目标，迭代次数等于树的数量。\n\
  - `MINCATSIZE` 选项设置为 `50`。为了为分类变量的特定值创建分裂规则，必须具有该值的观测值数量。\n- `MISSING` 选项设置为 `USEINSEARCH`。此参数指定了用于处理缺失值的策略。\n\
  - `SEED` 选项设置为 `42`。该选项指定了随机数生成器的种子。\n- `SHRINKAGE` 选项设置为 `0.1`。该选项指定了以百分比减少每棵树预测值的比例。该值必须在\
  \ 0 到 1 之间，默认值为 `0.2`。\n- `SPLITSIZE` 选项设置为 `100`。`TREEBOOST` 过程只有在节点包含至少此数量观测值时才会分裂。默认值是\
  \ `LEAFSIZE=` 参数中指定值的两倍。\n- `TRAINPROPORTION` 设置为 `0.6`。该选项指定了用于训练的观测值比例。如果你使用的少于所有数据，可能会提高泛化误差。\n\
  - `INPUT` 值指定了一个包含所有数值变量的全局变量。`LEVEL` 选项设置为 `INTERVAL`。\n- `TARGET` 选项指定了目标变量的名称。在此数据集中，我们将目标命名为\
  \ `TARGET` 并将 `LEVEL` 设置为 `BINARY`。\n- `IMPORTANCE` 语句使用基于观测的方法来评估变量或变量对对预测重要性。对于每个观测值，`IMPORTANCE`\
  \ 语句会使用实际值输出一次预测，使用具有信息的变量值输出一次。\n- `OUTFIT` 语句产生一个包含拟合优度统计的数据集。该数据集中的观测值数量为变量数加上对数一。该数据集包含与\
  \ `SCORE` 数据集相同的变量，外加两个变量。这些变量包含了无信息变量的名称。\n- `SUBSERIES` 语句指定了模型中使用序列中的多少迭代。对于二分类或区间目标，迭代次数等于树的数量。对于具有\
  \ $k$ 个类别的分类目标，$k > 2$，每次迭代包含 $k$ 棵树。\n- 如果你想用以前训练过的神经网络对数据集进行评分，可以使用 `CODE` 语句。`CODE`\
  \ 语句将 SAS DATA 代码写入文件或目录项。此代码可以包含在带有 `SET` 语句读取评分数据集的 DATA 步中。\n\n\n\n\n\n输出 8.24\
  \ 显示了梯度提升算法的第一棵树。请记住，这些是设计为“弱学习器”的浅树。第一棵树只有三个节点和两个变量。\n\n### 输出 8.24：`PROC TREEBOOST`\
  \ 树逻辑示例\n\n![](img/Image1631.png)\n\n### 梯度提升评分\n\n`PROC TREEBOOST` 本身并不对新数据集进行评分。该算法没有提供\
  \ `SCORE` 选项。相反，评分是独立完成的，其方法与决策树评分过程相同。\n\n`PROC TREEBOOST` 允许你创建一个输出的 `SCORE FILE`，你可以将其应用于任何与\
  \ `PROC TREEBOOST` 输入数据集具有相同结构的数据。可以使用 `%INCLUDE` 语句调用此评分文件。程序 8.13 展示了如何将评分算法应用于单独的数据集。\n\
