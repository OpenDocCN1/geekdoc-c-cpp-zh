  \ 500 棵决策树中每棵树的拟合统计数据。我在这里只展示了前十棵树。我们可以看到，输出包含了向整个随机森林模型中添加每棵额外树的累计结果。随着每棵独特的树添加到评估中，叶节点数量就会增加，而训练（`train`）和测试（`OOB`）数据集的均方误差都会减小。\
