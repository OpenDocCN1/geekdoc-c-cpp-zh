  \ Ann Gearheart 的所有爱和支持，以及我的兄弟 Scott、Glen、Kenny、George 和 Tod。你们一直都在我身边。\n\n我可爱的儿子\
  \ Jacob Gearheart 是我生命的骄傲，我每天都对你的机智、魅力、才华和善良感到惊讶。我祈祷我每天都能变得更像你。\n\n当然，还有我生命中的爱人\
  \ Tanya Gearheart。我一定给你写过一千封情书，但其中没有一封能表达我有多么爱你。\n\n## 关于作者\n\n![](img/Image747.jpg)\n\
  \nJames Gearheart 是一位经验丰富的高级数据科学家和机器学习工程师，曾开发过变革性的机器学习和人工智能模型。他在数字营销、金融服务、公共医疗、环境服务、社会保障和工人赔偿等行业拥有\
  \ 20 多年的的经验。他的研究兴趣包括应用数据科学、机器学习和人工智能。\n\n\n\n\n在过去的十年里，人们对将统计学应用于全球几乎每人每秒产生的海量数据产生了爆发性的兴趣。这种兴趣主要由科技巨头驱动的，他们学会了如何通过向个人提供免费服务来换这些个人产生的数据，从而实现这些信息的变现。每一次点击、推文、图片上传、页面访问、点赞、分享、关注、购买、评论、转发、电子邮件和登录，都存储在科技巨头维护的大型数据仓库中，并供他们的数据科学家团队使用，以将你的数据转化为可操作的洞察。\n\
  \n你可能会觉得很荣幸，因为你有一个秘密恋慕者痴迷于你的每一次点击、兴趣、愿望和梦想、需求、不安全感以及你最狂野的幻想。你可能会想象像马克·扎克伯格或杰夫·贝佐斯这样的科技万富翁在深夜彻夜未眠，思考着你以及如何准确地提供你想要的一切。也许这个画面有点夸张，但这些首席执行官以及所有的竞争对手确实将客户置于其业务模型的核心。这种现象不仅限于科技公司。传统的实体店（沃尔玛、Target、百思齐）、电信公司（AT&T、Verizon、Comcast）、医疗机构、娱乐集团、公用事业公司和政府部门都有数据科学家团队，他们的唯一职是在你自己发现之前就知道想要什么。\n\
  \n亚马逊知道，因为你对数据科学书籍感兴趣，你可能对这一本感兴趣。Netflix 知道，因为你上周末刷完了整个《黑镜》的前三季，你也会对《极际边界》的重启版感兴趣。这些洞察是数据科学家团队的结果，他们访问你免费提供的信息，并开发模型根据各种属性将个人归类为相似小组。他们还开发了预测模型，试图确定你未来将做什么或想要什么。\n\
  \n不信我？这里有一个快速测试。根据我关于你的唯一信息（你对专注于 `SAS` 的数据科学书籍感兴趣），我假设你是一个 25 到 40 岁之间的男性，拥有研究生学历，并居住在英语国家。你很可能在一家大公司工作。也许你的办公桌有点乱，但你的混乱中自有有章法。\n\
  \n我表现得怎么样？如果这些猜测完全错误，那么你一定是一个独特的个体，没有落入数据科学家任何传统的人口统计和兴趣类别。但我猜至少有一半的描述与你有关。这些猜测看起来可能有点宽泛或笼统。但记住，它们仅基于一个通用的信息：你对专注于\
  \ `SAS` 的数据科学书籍感兴趣。\n\n现在想象一下，我有你整个网络历史的数据库，包括你过去所有的购买记录、社交关系、财务报表、搜索词、电子邮件和观看习惯。想象我将所有这些信息输入到一个复杂的预测模型中，该模型的建立唯一目的是计算你对特定产品感兴趣的概率。想象我为一千万个人收集了相同的信息数据库（在数字信息领域，数据集可以包含数万亿个数据点，这是一个很小的样本），并建立了一个深度学习模型，计算你对带有\
  \ 2% 返现计划的旅游奖励信用卡优惠感兴趣的概率。\n\n这是一个非常具体的定义变量！考虑到我掌握的人群信息数量和质量以及定义良好的目标变量，我应该能够建立一个预测模型，以合理的置信度计算个人对该信用卡优惠做出响应的概率。这些信息可以用于高效分配我的营销预算。与预算花在面向大众的电台广播广告相比，通过这种方法我可能会获得更高的响应率。如果旅游网站活动的响应率是\
  \ 1.5%，而电台广告的响应率是 0.03%，那么我们的预测模型将响应率提供了 50 倍的提升！这就是优化你营销预算的一种方式。\n\n在这个例子中，所有这些数据都用于在正确的时间，向正确的人通过正确的信息提供正确产品的极具针对性的广告。这种目标定位机制只是各种企业每天使用数据科学的一个例子。大型公司已使用数据科学技术对客户行为的每个方面进行定位、分类、分段、聚类、推荐、调整报价、个性化、向上销售、交叉销售、影响和预测。\n\
  \n## 最小有效剂量\n\n本书将遵循最小有效剂量（`MED`）方法教授数据科学。这种方法的目标是让你获得关于各种数据科学技术的足够背景并开始运行，为你提供具体的示例、访问真实数据的机会，并提供详尽解释的\
  \ `SAS` 代码。我不希望你深陷关于程序内部运作机制的一堆数学理论。我们将涉及公式，但我不会对此进行长篇大论。如果你对数据科学数学的详尽解释感兴趣，我建议你查看由\
  \ Hastie、Tibshirani 和 Friedman 编写的《统计学习方法》（The Elements of Statistical Learning*）。它是数据科学界统计数学的圣经。\n\
  \n### 那么，`MED` 意味着什么？\n\n* 没有数学！（嗯……非常少的数学）\n* 对数据科学方法进行易懂且实用的解释：\n    * 在特定情况下应使用哪种方法\n\
  \    * 需要注意什么\n    * 数据科学如何与真实业务数据结合（你不会在书中找到标准的学术数据集，如 `iris` 数据集或 `MNIST` 数据集）\n\
  * 执行特定步骤的逐步说明\n* 如何评估你的模型的性能：\n    * 如何将你的模型应用于新数据\n    * 如何理解提供的 `SAS` 代码\n\n##\
  \ 当前的数据科学格局\n\n在过去的几年里，业务分析师的职位名称发生了变化。职位名称的变化反映了业务分析师的额外需求。如果你在 2012 年之前从事业务分析领域，你可能拥有以下职位名称之一：\n\
  \n* 分析师 (Analyst)\n* 统计学家 (Statistician)\n* 量化师 (Quant)\n* 研究员 (Researcher)\n* 分析咨询师\
  \ (Analytical Consultant)\n* 数据架构师 (Data Architect)\n* 数据库管理员 (Database Administrator)\n\
  * 数据专家 (Data Guy)\n\n自 2012 年以来，许多这些职位名称已变为：\n\n* 数据科学家 (Data Scientist)\n* 机器学习工程师\
  \ (Machine Learning Engineer)\n* 人工智能工程师 (Artificial Intelligence Engineer)\n\n\
  你可能提出的第一个问题之一是“数据科学家和分析师之间有什么区别？”初始答案是他们 80% 的工作是相同的：\n\n* 访问数据\n* 清理数据\n* 合并数据集\n\
  * 总结数据\n* 回答业务问题\n* 创建报告\n\n然而，数据科学家在工具箱中拥有一些兴奋的工具，包括：\n\n* 访问和使用非结构化数据：网络爬取、Twitter\
  \ 推文、Facebook 评论等\n* 使用无监督机器学习方法理解他们不的数据：聚类和 `PCA`\n* 预测未来结果：预测和预测建模\n\n数据科学家的这些额外功能将其角色提升到了新的高度，使其能够超越传统的报告描述性统计，进入预测性分析、规范性分析和优化的精彩世界。\n\
  \n## 分析的类型\n\n让我们看看数据科学家应该熟悉的几种不同的分析。\n\n\n\n\n## 分析概览\n\n**描述性分析** – 这是对过去发生过和当前正在发生情况的回顾性观察。企业生成大量的描述性分析来理解业务趋势、客户需求、生产阈值以及无数其他业务指标。描述性报告并不华丽，但它是所有业务的命脉。由于这些是已经发生的事件，此类报告侧重于报告实际数字以及相关的统计数据（平均值、标准差等）。\n\
  \n**预测性分析** – 使用历史数据对未来进行预测。这些是基于历史数据对未来可能性的统计估计。这类报告通常伴随着置信区间、优势比和概率。\n\n**规范性分析**\
  \ – 也称为优化，规范性分析识别产生影响的因素，并推荐这些因素的最优值以实现预定义的的结果。\n\nSAS 创建了图 1.1。该图将之前的列表进一步细分为八个层级的分析。通过提高这些分析产品的智能化水平，我们正在扩展分析对组织的业务价值。前四个阶段基于分析的报告功能，而后四个阶段则基于分析的概率功能。这些函数的业务价值对企业非常有益。\n\
