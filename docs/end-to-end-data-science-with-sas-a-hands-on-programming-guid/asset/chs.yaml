  \ 略增到 0.366。此分析的结论是，将简单决策树应用于 Airbnb 数据集的效果优于线性回归模型。这种性能的提升是因为底层数据结构是非线性的。\n\n既然我们已经发现了数据的非线性本质，我们就可以开发更多几个基于树的模型。你显然足够敏锐，能从上面的表中看到我们将构建一个随机森林和一个梯度提升决策树模型。\n\
  \n## 随机森林\n\n我们在开发简单决策树时提到过一个问题，即它本质上是贪婪的。这意味着它选择能够减少预测空间 RSS（残差和）的最佳变量和分裂点，然后移动到树的下一个分支。尽管这种方法在树的每个分支上都做出最优决策，但它从不会向前看，在单个分支上做出的决策可能对该特定分支不是最优的，但对树更深处的整体\
  \ RSS 有益。随机森林方法的开发是为了缓解这一问题。\n\n\n\n\n\n随机森林是一种“集成式（ensemble）”建模方法。这意味着将多个模型结合在一起以创建一个单一预测。为了开发随机森林，会对\
  \ `TRAIN` 数据集按照指定的采样率进行多次有放回的采样。在我们的示例中，`TRAIN` 数据集包含 38,527 条观测值。如果我将采样率设置为 60%，那么将有\
  \ 23,116 个随机选择的观测值包含在采样的训练集中。剩余的 40% 观测值将处于留出数据集（hold-out data set），该数据集将用于计算“袋外”（`OOB`）误差指标。`OOB`\
  \ 是每个采样训练数据集的平均预测误差。你可以将其比作一个微型的 `TRAIN/TEST` 环境，其中在采样的训练集中开发一个决策树，并将其应用于留出的 `OOB`\
  \ 测试数据集上。\n\n所选观测值的随机化并不是随机森林中唯一的随机化部分。对于任何数据集，通常有一两个变量会压过其他变量。这些变量是与目标变量相关性最强的变量。如果这些变量包含在简单的决策树中，它们将成为树的根节点并主导初始的分层决策。随机森林缓解这种变量主导问题的一种巧妙方法，是从所有可能的变量中随机选择一个子集包含在特定的决策树中。\n\
  \n在我们的 Airbnb 示例中，有 43 个变量可以提供给算法。构建决策树的一个经验法则是：将随机选择的预测变量数量设置为预测变量总数的的平方根。43 的平方根是\
  \ 6.557，因此我们将向上取整，并指定每棵决策树中包含七个随机选择的变量。\n\n由于这是一个递归过程，我们还需要指定算法构建这些随机选择的树的次数。请记住，你指定的树的数量越多，你的计算机系统所需的处理能力就越大。\n\
  \n下面的代码开发了一个由 500 棵随机采样树组成的随机森林，每棵树都有 7 个随机采样的预测变量。由于观测值和预测变量的随机化，这些树中的都是不同的。\n\n\
  ### 程序 2.26：随机森林模型\n\n```\nproc hpforest data=WORK.TRAIN_ADJ\nmaxtrees= 500 vars_to_try=7\n\
  seed=42 trainfraction=0.6\nmaxdepth=20 leafsize=6\nalpha= 0.1;\ntarget price_log/\
  \ level=interval;\ninput &tree_num. / level=interval;\ninput &tree_char. / level=nominal;\n\
  ods output train_scored fitstatistics = fit;\nSAVE FILE = “C:\\Users\\James Gearheart\\\
  Desktop\\SAS Book Stuff\\Data\\rfmodel_fit.bin”;\nrun;\n```\n\n#### 程序 2.26 备注：\n\
  - 我正在基于 `TRAIN_ADJ` 数据集构建模型。该数据集包含了所有适用于建模的数值和字符变量。\n- 我指定要构建 500 棵树（`MAXTREES`），并在每棵树中包含\
  \ 7 个预测变量（`VARS_TO_TRY`）。\n- 我指定使用 60% 的数据（`TRAINFRACTION`）作为采样的训练数据集。\n- 我包含了一个\
  \ `SEED` 语句以确保结果的可重复性。\n- 数值变量和字符变量有单独的 `INPUT` 语句。\n- 目标变量是 `PRICE_LOG`，且目标指定为间隔变量（interval\
  \ variable）。\n- 代码文件输出一个包含所有分层逻辑的 SAS 程序。该文件可以应用于其他数据集进行评分。\n\n| 随机森林输出的第一部分包含模型超参数设置的摘要。我在代码中指定了其中一些设置，而另一些留了默认值。从列表中，你可以看到有多种方法可以自定义你的算法，而且这些设置的相互作用可能会导致非常不同的预测值。如果你选择采用随机森林并选择此建模算法作为驱动你业务的模型，你必须开发一个网格搜索，循环遍历这些超参数的不同组合，以找到在你的留出\
