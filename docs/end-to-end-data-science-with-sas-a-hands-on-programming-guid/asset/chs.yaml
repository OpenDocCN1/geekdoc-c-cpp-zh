  \n## 优势比估计\n\n模型输出的下一部分显示了优势比估计表。`PLOTS=ALL` 选项提供了该表的视觉化描述。这些输出部分在输出 7.8 中。\n\n\
  ### 输出 7.8：逻辑回归优势比\n\n![](img/982.png)\n\n![](img/990.png)\n\n优势比很容易解释。如果一个变量的优势比为\
  \ 1，这意味着该变量对目标变量没有影响。优势比大于 1 意味着当暴露于该变量时，结果事件发生的概率更高。优势比小于 1 意味着当暴露于该变量时，结果发生的概率较低。\n\
  \n\n\n\n让我们来看这个例子。变量 `total_bc_limit`、`total_hi_cred_limit` 和 `loan_amnt` 的优势比均为\
  \ 1。这在它们的原始形式下是合理的，因为模型对 `loan_amnt` 的估计值为 `0.000012`，几乎为 0。如果将优势比扩展到七位小数，那么我们就能看到该变量对结果事件发生几率的产生微小影响。如果优势比估计表（Odds\
  \ Estimate table）是使用新缩放后的变量构建的（例如：`每 $10,000 的贷款金额 = 0.12`），那么我们就能看到这些缩放后变量具有明显的正或或的优势比。\n\
  \n变量 `Grade_A` 的优势比为 `0.795`。这可以解释为：当虚拟变量 `Grade_A` 为 `1` 时，目标变量 `BAD` 为正的概率会降低。这是合理的，因为变量\
  \ `Grade_A` 代表了风险最低的借款人类别。如果贷款被归类为 `Grade_A`，那么其坏账的概率（几率）就会更低。\n\n相反，变量 `Grade_C`\
  \ 和 `Grade_D` 代表风险更高的贷款。当其中任一变量为正值时，响应变量 `BAD` 为正的概率会增加。\n\n## 模型评估指标\n\n到目前为止，我们已经看到了与模型开发多个阶段相关的\
  \ SAS 输出。这些阶段包括输入模型的数据、模型是如何构建的、以及模型选择过程的每一步、点估计和优势比。这些虽然都是极具价值的信息，但它们没有回答一个最重要的问题：我的模型到底好不好？\n\
  \n对于二分类分类模型，有多种模型评估方法。我们将在专门评估模型输出的章节中介绍其中几种方法。现在，我们将重点关注两种主要的评估方法，它们是 `PROC LOGISTIC`\
  \ 的标准输出：\n\n* Gini 指标和 Somers’ D 分\n* ROC 和 AUC 曲线\n\n## Gini 指标和 Somers’ D 分\n\n\
  `PROC LOGISTIC` 语句创建的标准输出表之一是“预测概率与观测响应的关联（Association of Predicted Probabilities\
  \ and Observed Responses）”。该表包含一个重要的模型评估指标以及该指标如何构建的信息。输出 7.9 显示了此表及其相关组件。\n\n输出\
  \ 7.9：逻辑回归评估指标\n\n![](img/Image997.png)\n\n该表显示的主要指标是 Somers’ D。该指标也常被称为 Gini 指标或准确率（Accuracy\
  \ Ratio）。尽管计算这些指标的方法不同，但它们的含义相同。`PROC LOGISTIC` 中计算 Somers’ D 统计量的默认方法是通过一致性（concordance）和并结百分比（tied\
  \ percent）。所有信息都包含在上面的表中，但让我们回顾这些信息是如何创建和使用的。\n\n**步骤 1**：逻辑回归输出会创建一个包含实际事件数据和预测概率字段的输出表。这些数据被分为两个数据集。第一个数据集包含所有目标事件（`BAD`\
  \ = 1）的观测值，以及这些观测值相关的预测概率。第二个数据集包含所有目标事件（`BAD` = 0）的观测值，以及这些观测值相关的预测概率。\n\n**步骤\
  \ 2**：SAS 创建一个矩阵数据集，将第一个数据集中的每个观测与第二个数据集中的每个观测进行比较。这是事件与非事件的笛卡尔积（交叉连接）。该矩阵数据集的容量显示在输出\
  \ 7.9 的 `Pairs` 字段中。我们可以看到矩阵包含 628K 个观测值。\n\n**步骤 3**：评估一致性。如果 `event = 1` 且预测概率高于\
  \ `event = 0` 的观测值，则认为这对观测值是一致的（concordant）。如果相反，则认为是不一致的（discordant），即 `event =\
  \ 0` 的观测值的预测概率高于 `event = 1` 的观测值。如果 `event = 1` 的观测值与 `event = 0` 的观测值之间的预测概率相同，则该对为并结（tied）。\n\
  \n**步骤 4**：计算最终百分比值：\n\n* `Percent Concordant = 100*[(一致对数量) / 总对数]`\n* `Percent\
  \ Discordant = 100*[(不一致对数量) / 总对数]`\n* `Percent Tied = 100*[(并结对数量) / 总对数]`\n\n\
  **步骤 5**：计算评估指标：\n\n* `Somers’ D = 2 * AUC – 1`（也可以计算为 `(Percent Concordant – Percent\
  \ Discordant)`）\n    * 该指标用于确定变量对之间关系的强度和方向。其值范围从 -1.0（所有对都不一致）到 1.0（所有对都一致）。\n\
  \    * 这与其他二分类分类器产生的 Gini 指标非常相似。\n* `Gamma` – 使用与 Somers’ D 指标几乎相同的方法，但 `Gamma`\
  \ 指标不对并结进行惩罚。由于不对并结进行惩罚，它的值通常比 Somers’ D 值高。\n* `Tau-a = (2(一致数量 – 不一致数量) / (N(N-1)))`\n\
  \    * 该方程的分母代表所有可能的配对。\n    * 此值通常远低于 Somers’ D 值，因为通常有很多具有相同响应的对观测值。\n* `曲线下面积\
  \ (AUC) = (Percent Concordant + 0.5 * Percent Tied) / 100`\n    * 这在输出 7.10 中标记为\
  \ `c`。该值也称为受试者工作特征（ROC）曲线。\n    * 该值范围从 0.5 到 1.0，0.5 代表模型随机选择，1.0 代表模型完美预测响应。\n\
  \    * 输出 7.10 显示了由 `PROC LOGISTIC` 产生的 ROC 曲线。\n\n输出 7.10：ROC 曲线\n\n![](img/Image1007.png)\n\
  \n关于 曲线的详细信息将在评估章节提供。\n\n## 对测试集评分\n\n到目前，我们已经选择并转换了训练数据集，开发了逻辑回归模型，并在训练数据集上进行了评估。然而，为了真正评估模型的预测准确性，我们需要将其应用于留存群体。\n\
  \n将模型应用于未用于模型开发的集合有两种主要方法：\n\n1. `PROC LOGISTIC` 中的 `SCORE` 选项\n2. 将方程硬编码到 `DATA`\
  \ 步中\n\n这两种方法对于给定的数据集产生相同的评分。\n\n## 转换留存测试集\n\n对留存测试集评分的第一步是确保该数据集接受了应用于训练数据集的相同处理和过滤。对于我们的示例，许多原始数据转换（缺失值插补、特征工程、异常值调整）已经应用于测试集。这一过程在第\
  \ 5 章：创建建模数据集中进行了详细说明。\n\n然而，在本章中，开发逻辑回归模型之前，我们对数据进行了一些额外的过滤。由于启动期和响应变量的滞后，我们决定将数据限制在贷款发放日期\
  \ 2015 年 1 月 1 日至 2015 年 12 月 31 日之间。\n\n如果我们不以相同的方式限制数据，那么我们在测试集上的模型结果将非常糟糕。这是因为该模型的设计是为了计算在因变量事件发生率为\
  \ 18.01%（见表 7.1）的时间段内，一组自变量为正的概率。\n\n\n\n\n程序 7.7 将 `MYDATA.MODEL_TEST` 数据集过滤到与\
  \ `TRAIN` 数据集相同的时间段。再次，我们选择这些日期的唯一原因是事件率在 Lending Club 数据集的整个时间段内是变化的。\n\n### 程序\
  \ 7.7：按时间范围限制 TEST 数据集\n\n```\nDATA TEST; \n```\n\n```\n SET MYDATA.MODEL_TEST;\n\
  ```\n\n```\n WHERE ‘01JAN2015’d le issue_date le ‘01DEC2015’d;\n```\n\n```\nRUN;\n\
  ```\n\n```\nPROC FREQ DATA=TEST; TABLES BAD; RUN;\n```\n\n输出 7.11 显示，该时间段内 `TEST`\
  \ 数据集的事件率为 17.66%。这与 `TRAIN` 数据集的事件率相比，偏差在半个百分点的范围内。\n\n### 输出 7.11：TEST 数据集目标值频率分布\n\
  \n![](img/Image1014.png)\n\n既然我们已经为 `TEST` 数据集选择了适当的时间范围，可以将模型应用到 `TEST` 数据集上了。\n\
  \n### SCORE 选项\n\n`PROC LOGISTIC` 包含一个名为 `SCORE` 的选项，允许你指定想要在使用 `TRAIN` 数据集开发的模型进行评分的数据集。程序\
  \ 7.8 显示了该选项在原始 `PROC LOGISTIC` 中的用法。注意，评估选项（`PLOTS`、`CORRB`、`OUTROC`）已从程序中移除。如果你需要，可以保留这些选项，但它们只会生成我们在初始模型开发部分已经检查过的相同评估输出。\n\
  \n### 程序 7.8：在 PROC LOGISTIC 程序中对 TEST 数据集\n\n```\nPROC LOGISTIC DATA=TRAIN DESCENDING\
  \ PLOTS=NONE;\n```\n\n```\n MODEL BAD = &num_vars. / SELECTION=STEPWISE SLE=0.01\
  \ SLS=0.01;\n```\n\n```\n SCORE DATA=TEST OUT=TEST_SCORE;\n```\n\n```\nRUN;\n```\n\
  \n`SCORE` 选项允许你指定想要评分的数据集。`DATA=TEST` 语句告诉 SAS 你想对保留 `TEST` 数据集进行评分，而 `OUT=TEST_SCORE`\
  \ 告诉 SAS 你想创建一个包含概率评分和 `TEST` 数据集中所有原始数据的输出数据集。\n\n`SCORE` 选项的默认输出包含 `TEST` 数据集中所有原始数据以及两个额外字段：\n\
  \n* `P_1` – 观测值因变量 = 1 的概率\n* `P_0` – 观测值因变量 = 0 的概率\n\n我们可以使用 `PROC MEANS` 检查评分后的\
  \ `TEST` 数据。程序 7.9 开发了此程序。\n\n### 程序 7.9：分析模型预测值\n\n```\nPROC MEANS DATA=TEST_SCORE\
  \ N NMISS MIN MAX MEAN;\n```\n\n```\n VAR BAD P_0 P_1;\n```\n\n```\nRUN;\n```\n\n\
  程序 7.9 创建了一个分析表，显示原始目标变量 `BAD` 的值以及两个预测概率变量的值。输出 7.12 显示了分析输出。\n\n![](img/Image1021.png)\n\
  \n该表显示实际目标变量 `BAD` 的平均率为 17.66%。变量 `P_1` 显示事件的预测概率，事件的平均预测概率为 17.95%。这项分析为我们提供了关于模型预测准确性的初步高层次分析。实际事件率和预测事件率之间的差异并不大。\n\
  \n### 评估宏\n\n我们已经看到标准的 `LOGISTIC` 过程为开发模型的数据集提供了评估指标（Somers’ D 和 ROC 图表）。然而，标准的模型输出并不包含对评分数据集的评估指标。为了评估评分的数据集，你必须自己计算评估指标。\n\
  \n幸运的是，互联网上已经有很多开发好且免费使用的评估宏。我将在“模型评估指标”章节中详细探索其中的一些。但现在，我将快速应用一个我从互联网上收集的模型评估宏，并用它来评估模型在\
  \ `TEST` 数据集上的准确性。\n\n我将使用的模型评估宏由 Wensui Liu 开发，并标记为“separation”。这个易于使用的宏可以创建多个评估指标和图表。我将此宏放在\
  \ C 盘上，并用 `%INCLUDE` 语句调用它。程序 7.10 显示了该宏的应用。\n\n### 程序 7.10：宏的应用\n\n```\n%INCLUDE\
  \ ‘C:/Users/James Gearheart/Desktop/SAS Book Stuff/Projects/separation.sas’;\n```\n\
  \n```\n%separation(data = TEST_SCORE, score = P_1, y = bad);\n```\n\n第一行简单地说明了所在放置宏的位置以及宏的名字。实际的宏通过\
  \ `%separation` 语句调用，随后跟上你想要评估的数据集的规范。\n\n* `DATA` 语句允许你指定想要评估的数据集名称。\n* `SCORE`\
  \ 语句允许你指定预测概率变量名称。\n* `Y` 语句允许你指定目标变量名称。\n\n通过这三个简单的语句，该宏将对你评分数据集的分离能力和准确性进行详细分析。输出\
  \ 7.13 显示了该宏生成的输出之一。该输出表将在评估章节中详细审查。该输出的主要结论是分离能力和准确性。在输出 7.13 中，我们可以看到 `TEST` 数据集已经过评估。\n\
  \n\n\n\n\n```\n (tot_hi_cred_lim / 10000) * -0.0099 +\n```\n\n```\n (loan_amnt /\
  \ 10000) * 0.12 +\n```\n\n```\n num_actv_bc_tl * 0.044 +\n```\n\n```\n home_mort\
  \ * -0.1802 +\n```\n\n```\n term_36 * -0.1451 +\n```\n\n```\n inq_last_6mths * 0.0903\
  \ +\n```\n\n```\n grade_A       * -0.2291 +\n```\n\n```\n grade_C       * 0.109\
  \ +\n```\n\n```\n criterion is also known as the classification.\n```\n\n```\n mort_acc\
  \ * -0.04 +\n```\n\n```\n ver_not * -0.0832 +\n```\n\n```\n home_own * -0.1067 +\n\
  ```\n\n```\n grade_D * 0.0776;\n```\n\n```\nscore = exp(xb)/(1+exp(xb));\n```\n\n\
  ```\nRUN;\n```\n\n### 程序 7.11 注意：\n\n- `DATA` 步骤用于开发和处理逻辑回归方程。此 `DATA` 步骤输入 `TEST`\
  \ 数据集。\n- 数据被过滤到定义的范围内，以便与开发数据的事件率对齐。此时，数据集与 `TEST` 数据集完全相同，使用了 `SCORE` 选项。\n- 逻辑回归方程通过输入模型截距和每个模型变量及其关联权重值来创建。\n\
  - 注意，三个变量（`total_bc_limit`, `tot_hi_cred_lim`, `loan_amnt`）已通过除以 10000 进行了转换。它们的关联权重值已相应调整。\n\
  - 最终预测值标记为 `score`。该值基于等式 7.2 中引入的：\n\n![](img/Eq7.2.jpg)\n\n编码评分技术非常有用，因为每当你将模型应用于新数据集时，不需要重新开发\
  \ `PROC LOGISTIC`。当你将模型移动到生产环境并将其交给 IT 团队实施时，这种方法也非常实用。每当你对新的贷款申请人进行评分时，运行 `PROC\
  \ LOGISTIC` 是不实际的。\n\n### 判别分析\n\n我们刚刚查看了逻辑回归模型如何给定预测变量 `X` 直接对响应变量 `Y` 建模（方程 7.2）。判别分析\
  \ (LDA) 模型的目标也是估计这些条件概率，但方法略有不同。LDA 算法为每个响应类 (`Y`) 分别对预测变量 (`X`) 建模。然后算法利用贝斯定理将这些分布转换为与逻辑回归非常相似的形式。\n\
  \nLDA 算法开发了一个判别函数。目标变量定义了一组组，判别函数将每个观测值分类到定义的组之一。广义平方距离衡量决定了该判别函数。这些组被投影到组间分离最大的低维平面上。判别函数确定了描述组之间差异所需的维度。\n\
  \n由于 LDA 算法本质上是将数据集投影到低维空间，因此通常被用作降维技术。它与主成分分析 (PCA) 非常相似；然而，PCA 试图寻找数据差异最大的成分轴，而\
  \ LDA 算法试图寻找组间分离最大的成分轴。\n\n由于投影映射，LDA 有两种使用方式：\n\n1. **描述性判别分析** – 一种数据预处理降维方法，将多个独立变量减少到投影的低维平面。这些新创建的组间分离变量可以输入其他预测模型。\n\
  2. **预测性判别分析** – 这是一种预测两个或多个类别概率的机器学习分类技术。\n\n在本章中，我们将关注预测判别分析方法。\n\n### 何时使用 LDA\
  \ 进行预测\n\n尽管逻辑回归是参数分类的标准建模方法，但在某些情况下，你可能使用 LDA 模型而不是逻辑回归模型：\n\n1. 当有多个响应类时。\n2.\
  \ 当类别之间分离良好时。（在这种情况下，逻辑回归模型的参数估计可能不稳定，因此首选 LDA。）\n3. 观测值较少。\n4. 预测变量的分布近似于正态。\n\n\
  如果你的数据集包含上述一个或多个特征，那么 LDA 模型可以提供具有稳定模型系数的显著预测能力。\n\n### PROC DISCRIM\n\n可以使用 SAS\
  \ 在 SAS 中创建线性判别分析预测模型。此灵活过程允许研究人员通过指定各种选项来自定义模型，包括模型是参数的还是非参数的，以及协方差矩阵是否合并。研究人员还可以指定分类阈值、指定非参数方法，并选择交叉验证方法。\n\
  \n为了我们的目的，我们将在用于逻辑回归模型的相同 Lending Club 数据集和相同目标变量 `BAD` 上开发一个基础 LDA 预测模型。这将允许我们比较逻辑回归和\
  \ LDA 的输出。\n\n程序 7.12 创建了一个名为 `log_vars` 的全局变量，它包含了逻辑回归模型中显著的所有预测变量。此变量列表被输入 `PROC\
  \ DISCRIM`。\n\n#### 程序 7.12：创建一个包含所有预测变量的宏变量\n\n```\n%LET log_vars = int_rate acc_open_past_24mths\
  \ dti emp_NA total_bc_limit tot_hi_cred_lim loan_amnt num_actv_bc_tl home_mort term_36\
  \ inq_last_6mths grade_A grade_C mort_acc ver_not home_own grade_D ;\n```\n\n```\n\
  PROC DISCRIM DATA=TRAIN OUTSTAT=DIS out=discrim_out \n TESTDATA=TEST TESTOUT=TEST_OUT;\n\
  \ CLASS BAD;\n VAR &log_vars.;\nRUN;\n```\n\n### 程序 7.12 注意：\n\n- `PROC DISCRIM`\
  \ 用于在 `TRAIN` 数据集上创建 LDA 模型。\n- `OUTSTAT` 语句告诉 SAS 创建一个包含均值、标准差和相关性等各种统计数据的数据集。\n\
  - `OUT` 语句告诉 SAS 创建一个包含 `TRAIN` 数据集变量以及模型评分（也称为后验概率）的输出数据集。\n- `TESTDATA` 语句告诉 SAS\
  \ 我们要用在 `TRAIN` 数据集上构建的 LDA 模型对留出的 `TEST` 数据集进行评分。\n- `TESTOUT` 语句告诉 SAS 创建一个包含所有\
  \ `TEST` 变量的数据集。\n- `CLASS` 语句指定分析的组。\n- `VAR` 语句指定模型的预测变量。在本例中，我将列表限制为逻辑回归模型中显著的变量。\n\
  \n### PROC DISCRIM 输出\n\n`PROC DISCRIM` 创建多种输出，包括建模数据的摘要信息、广义平方距离以及目标变量的线性判别函数。\n\
  \n### 模型摘要信息\n\n第一组输出提供了对你模型输入的验证。输出 7.14 显示模型是在 `TRAIN` 数据集上开发的，该数据集包含 17 个预测变量和一个具有两个类别的目标变量。它还说明在模型开发使用了所有\
  \ 65,252 个观测值，没有观测值被排除。\n\n类级信息表显示了目标变量的频率和比例以及该变量的先验概率。\n\n输出 7.14: PROC DISCRIM\
  \ 输出\n\n![](img/Image1101.png)\n\n![](img/Image1108.png)\n\n![](img/Image1115.png)\n\
  \n方法详情\n\n\n\n\n\n`PROC DISCRIM` 允许你指定要使用合并协方矩阵还是组内协方矩阵来计算广义平方距离。默认选项为 `POOL=YES`。此选项指定模型将计算线性判别函数。如果将选项更改为\
  \ `POOL=NO`，则程序将使用组内协方矩阵，模型将计算二次判别函数。\n\n输出 7.15 显示了合并协方矩阵行列式的自然对数。\n\n输出 7.15：合并协方矩阵\n\
  \n![](img/Image1122.png)\n\n该程序还允许你指定想要创建参数化模型还是非参数模型。此选项通过 `METHOD` 语句指示。默认值为 `METHOD=NORMAL`。这将创建一个参数化的\
  \ LDA 模型。如果选项更改为 `METHOD = NPAR`，则将使用非参数方法来开发模型。\n\n## 线性判别函数\n\n线性判别函数类似于逻辑回归模型的估计值。它展示了如何使用数据将观测值分类为给定的组（目标水平）。本示例展示了\
  \ 0 和 1 的二分类。然而，如果分类组多于两个，则每个分类级别将有一个独立的线性判别函数。输出 7.16 显示了二分类目标 `BAD` 的线性判别函数。\n\
  \n输出 7.16：线性判别函数\n\n![](img/Image1130.png)\n\n## 分类矩阵与错误率\n\n`PROC DISCRIM` 输出分类矩阵（也称为混淆矩阵）。该信息表显示了给定组（目标水平）的实际观测数量，以及分类为给定组的预测观测数量。表格还提供了行百分比。这些值允许研究人员确定模型预测正确的次数和预测错误的次数。\n\
  \n如果一个观测值的实际值为 1，且其预测值被归类为 1，则该预测是准确。输出 7.17 显示，当实际值为 1 时，模型在 62.58% 的观测值中正确预测了该值。然而，当实际值为\
  \ 0 时，模型在 37.42% 的观测值中错误地预测为 1。\n\n分类由 0.5 的阈值决定。如果预测概率小于 0.5，则观测值被分类为组 0。如果预测概率大于或等于\
  \ 0.5，则观测值被分类为组 1。输出 7.17 显示了分类矩阵。\n\n输出 7.17：混淆矩阵\n\n![](img/Output17.jpg)\n![](img/Image1095.png)\n\
  \n## 错误计数估计\n\n错误计数表显示了与先验概率相比的错误百分比。该表显示，在随机分配的情况下，预计 50% 的观测值是错误的。然而，对于实际值为 1\
  \ 的观测值，模型在 37% 的观测值中提供的预测值是错误的。这些是 II 类阴性。尽管有较高比例的观测值被错误分类，但模型相比随机分配提供了显著的提升。输出\
  \ 7.18 显示了评分后 `TEST` 集的分类矩阵。表格的第一部分验证了所有 `TEST` 数据观测值均已评分。\n\n输出 7.18：TEST 数据混淆矩阵\n\
  \n![](img/Image1229.png)\n![](img/Image236.png)\n\n分类矩阵和错误计数估计中的剩余信息与从 `TRAIN` 数据集生成的数据非常相似。如果\
  \ `TRAIN` 数据集的错误计数远低于 `TEST` 数据集的错误计数，我们必须担心模型过拟合了 `TRAIN` 数据，未能良好地泛化到 `TEST-out`\
  \ 数据。\n\n作为 LDA 模型的最后查看，我们可以使用应用于逻辑回归的相同评估宏。这类宏是灵活的工具，可以应用于任何具有二分类目标和连续预测分的数据集。程序\
  \ 7.13 显示了将 Wens Liu 创建的宏应用于评分后 `TEST` 数据的代码。\n\n程序 7.13：宏的应用\n\n```sas\n%INCLUDE\
  \ 'C:/Users/Jamesheart/Desktop/Projects/separation.sas';\n%separation(data = TEST_OUT,\
  \ score = BAD);\n```\n\n这显然与逻辑回归开发的评分代码相似。然而，注意评分字段被标记为 `BAD`。在这种情况下，为了指定该字段，SAS\
