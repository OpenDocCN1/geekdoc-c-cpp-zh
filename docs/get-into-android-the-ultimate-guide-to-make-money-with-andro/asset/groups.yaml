    \ Google 和开放手持设备联盟创建的操作系统。\n\n亚马逊的全新 Kindle Fire（iPad 的直接竞争对手）内部运行着 Android 的分叉版本，而这家出版巨头已为该操作系统开设了专属市场。甚至\
    \ Facebook 据说也在制造一款基于 Android 的“Facebook 智能手机”！\n\n而这仅仅是制造商方面的情况。\n\n迪士尼等娱乐公司，T-Mobile\
    \ 和 Sprint 等运营商，以及无数其他公司都在加入 Android 市场，因为每个人都认为 Android 是真正且毋庸置疑的关键参与者。\n\n你想错过这场持续的移动狂潮吗？如果你的答案是否定的，那就继续读下去。**加入\
    \ Android 革命，进入 Android。**\n\n你可能是下一个 Edward Kim，他宣布他的汽车定位器应用程序（我在“应用程序有什么用？”中解释了什么是应用程序）每月赚取\
    \ **13,000 美元**！他的故事现在在开发者中很流行，他甚至在一本名为《如何推广你的 Android 应用程序的最佳书籍》的书中写到了此事。\n\n\
    Kim 的“成功故事”是我们每天听到的众多故事之一，由于 Android 和移动平台非常年轻，我们可以期待它增长到超出最乐观的预期。在一篇文章中，Kim 表示：“Android\
    \ 只是它最终将成长为的东西的一小部分”。\n\n我认为，这一点至关重要。如果今天 Android 还没有为开发者带来巨额收益，那是因为我们尚未达到消费者数量足以支付巨额分红的点。在我写下这些文字时，Android\
    \ 提供的收入不错，但未来会更好。\n\n我询问了 James Lamberti（移动公司 In-Mobi 的全球研究与营销副总裁）他对此事的看法，他回答说：\n\
    \n> 我们对 Android 看好，并且确实相信它最终将为开发者带来更多收益。关键在于 Android 现在正在开放的全球市场。这可能需要一两年时间，但有几种趋势指向这一结论。首先，显而易见的是，销售的\
    \ Android 设备数量比 iOS 设备多。这个开放的、多制造商、多运营商的平台现在正在带来分红。\n\nAndroid 的增长令人惊叹，移动市场的增长也是如此。据估计，三年内将有\
    \ 25 亿用户通过手机访问互联网*。移动行业简直是在爆炸式增长！\n\n在此背景下，Android 最近在智能手机之战中推翻了诺基亚的移动操作系统 Symbian，并且正在迅速追赶\
    \ Apple 的 iOS。最新数据告诉我们，全球市场同比增长了 73%，2011 年第二季度出货量超过 1.077 亿部*。\n\n2011 年底，Android\
    \ 达到了 2 亿次激活（即新设备上线），每天 50 万次激活的速度丝毫没有放缓的迹象。\n\nAndroid 已内置于 15 个不同品牌的 300 款机型中，而且还在增加。有基于\
    \ Android 的智能手机、平板电脑、上网本、超极本、电子书阅读器等等。\n\n全球各地的人们都在称赞该操作系统，相比于智能手机领域的其他替代方案，它更加开放、灵活，并且对最终用户更友好。\n\
    \n想想这个市场已经有多大，以及未来还能变得多大。想象一下，你可以向真正的全球受众提供的所有新产品、服务和事物。可能性是无限的。\n\n* * *\n\n\
    一个移动技术为王的新世界秩序正在我们眼前展开。是否加入，取决于你自己的选择。如果你想加入，我的书将向你展示通过 Android 赚钱的众多方式，包括：\n\n\
    - 关于正在进行的 Android 淘金热的提示。\n- 应用程序开发。应用程序有什么用，以及为什么人们如此热议它们。如何为新应用程序获取创意并将其实现，即使你对计算机世界一无所知。\n\
    - 如何销售你的应用程序，教授有效的方法来触达全球市场，并通过你的应用程序每月赚取数千美元。什么是成功的应用程序，涵盖了 Android 市场上最受赞誉——且最盈利——软件背后的故事。\n\
    - 移动时代的营销将向你展示传递信息并与世界沟通的最有效方式，不仅是你的应用程序，还有你想要推广的任何产品或服务。\n- 最后，我们分析更多从 Android\
    \ 获利的可能方式。一个充满可能性的全新世界正在此时敞开！\n\n所有章节都提供资源和参考点，以便继续探索。正如我在网站上所述，我的意图是使本指南尽可能全面，我会经常对其进行扩展！\n\
    \n请注意：\n\n本书不是开发者的技术书籍；它是一本面向每一个想要在这个蓬勃发展的移动通信新行业中赚钱的普通人的指南。\n\n如果你愿意，可以将“进入 Android”视为一本面向大众的入门作品，旨在让人们了解\
    \ Android 世界。\n\n如果你是开发者，这当然会有帮助，但如果你在寻找编程方面的具体建议，我推荐你阅读外面众多优秀的书籍（例如《Hello, Android》[ISBN\
    \ 978-1934356173] 和《Android for Dummies》[ISBN 978-1118027707]）。\n\n"
