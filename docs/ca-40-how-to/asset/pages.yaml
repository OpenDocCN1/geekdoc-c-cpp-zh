    \ of C:\\MyImage.bmp onto the clipboard\nClipboard.SetImage(bitmap);\n```\n\n\
    ```\n//to retrieve it\nImage image = Clipboard.GetImage();\nstring text = Clipboard.GetText();\n\
    ```\n\n# Cut and Paste Text and Images Together\n\nMany programs support more\
    \ advanced clipboard functionality. For example, you copy text to the clipboard\
    \ from Microsoft Word, it copies that text in many"
