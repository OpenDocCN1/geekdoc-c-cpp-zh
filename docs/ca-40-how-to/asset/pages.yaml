  md: "# Cut and Paste User-Defined Objects\n\nIf your program is, for example, a\
    \ CAD program for widgets, chances are you want to support copy and paste functionality\
    \ on widgets. You have two options:\n\n+   * Transform your widgets into a standard\
    \ clipboard format (such as text) and put that on the clipboard. Then translate\
    \ it back when pasting.\n\n+   * Put arbitrary binary data on the clipboard and\
    \ serialize and deserialize your class (with minimal effort).\n\nThe good news\
    \ is that the second option is easy to use.\n\nSuppose you have a ListView containing\
    \ the name, sex, and age of various people. To put these rows on the clipboard,\
    \ define an intermediate class that is serializable:\n\n```\n[Serialized]\nclass\
    \ MyClipboardItem\n{\n    // We must have a unique name to identify\n    // our\
    \ data type on the clipboard\n    // we're naming it this, but we'll actually\
    \ store a list of these\n    public const string FormatName =\n        \"HowToCSharp.ch16.ClipboardDemo.MyClipboardItem\"\
    ;\n    public static readonly DataFormats.Format Format =\n        static MyClipboardItem()\n\
    \        {\n            return DataFormats.GetFormat(FormatName);\n        }\n\
    \n    public string Name { get; set; }\n    public string Sex { get; set; }\n\
    \    public string Age { get; set; }\n\n    public MyClipboardItem(string name,\
    \ string sex, string age)\n    {\n        this.Name = name;\n        this.Sex\
    \ = sex;\n        this.Age = age;\n    }\n}\n```"
