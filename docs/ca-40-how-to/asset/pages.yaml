    \n# # Play a Sound File\n\n> > Scenario/Problem: You want to play back a sound\
    \ file.\n\n**Solution:** Use the PlaySound API via P/Invoke.\n\n```\nclass Win32\n\
    {\n    [DllImport(\"winmm.dll\", EntryPoint = \"PlaySound*\")n    CharSet = CharSet.Auto)]\n\
    \    public static extern int PlaySound(String pszSound, int hmod, int flags);\n\
    \n    [Flags]\n    public enum Soundflags\n    {\n        SND_SYNC = 0x0000,\n\
    \        SND_ASYNC = 0x00001,\n        SND_NODEFAULT = 0x00002,\n        SND_MEMORY\
    \ = 0x00004,\n        SND_LOOP = 0x00008,\n        SND_NOSTOP = 0x00010,\n   \
    \     SND_NOWAIT = 0x00002000,\n        SND_ALIAS = 0x00010000,\n        SND_ALIAS_ID\
    \ = 0x00110000,\n    }\n```"
  merge: -1
