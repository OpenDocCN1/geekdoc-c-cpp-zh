  md: "# Implement Undo Using Command Objects\n\n**Scenario/Problem:** You want to\
    \ be able to undo commands in your application.\n\n**Solution:** Most programs\
    \ that let the user edit content have the ability to let the\nuser undo the previous\
    \ action. This section demonstrates a simple widget applica-\ntion that allows\
    \ undo functionality (see Figure 25.1).\n\n![](img/c237887cbbac0db0e18bd0eecbc77950_561_0.png)\n\
    \nFIGURE 25.1\\This simple application allows the user to undo moves, creations,\
    \ and deletions.\n\nThe most popular way to implement this involves command objects\
    \ that know how to\\undo themselves. Every possible action in the program is represented\
    \ by a command\nobject.\n\n> **NOTE** Not everything the user can do in your application\
    \ needs to be a command.\nFor example, moving the cursor and changing the current\
    \ selection aren’t usually\nconsidered actions. Generally, undoable commands should\
    \ be those that change the\nuser’s data.\n\n# Define the Command Interface and\
    \ History Buffer\n\nHere’s a possible interface:\n\n```\ninterface ICommand\n\
    {\n    void Execute();\n    void Undo();\n    string Name { get; }\n}\n```"
