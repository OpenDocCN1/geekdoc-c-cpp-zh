    # Write XML from Scratch


    When creating XML from scratch, there are, in general, two methods you can use:


    +   * Write out each element and attribute, from start to finish.

    * Build a document object model (DOM).


    There are tradeoffs between these two methods. Basically, it''s between speed
    and efficiency in working with the data. Building a DOM in memory allows you to
    easily work with any nodes, but it takes up a lot of resources and is slow. Just
    writing out the elements is very fast, but this can be harder for more complex
    data models. Examples of both are shown in this section.


    # Write XML Using XmlDocument


    | Scenario/Problem: You want to build up an XML document from scratch using a
    rich set of tools that represent the document object model |


    Solution: The XmlDocument class is the in-memory version of XML''s node structure.


    ```

    XmlDocument doc = new XmlDocument();

    XmlElement bookElement = doc.createElement("Book");

    bookElement.setAttribute("PublishYear", "2009");

    XmlElement titleElement = doc.createElement("Title");

    titleElement.innerText = "Programming, or engineering?";

    XmlElement authorElement = doc.createElement("Author");

    ```'
