    Strings are so fundamental a data type that their usage is often covered elsewhere,
    as it relates to other types. Nevertheless, some topics are specific to strings,
    and those are covered in this chapter.


    # Convert a String to Bytes (and Vice Versa)


    Scenario/Problem: You need to convert text to and from a binary format.


    Solution: The System.Text namespace defines a number of classes that help you
    work with textual data. To convert and from bytes, use the Encoding class. Although
    it is possible to create your own text-encoding scheme, you will usually use one
    of the pre-created static members of the Encoding class, which represent the most
    common encoding standards, such as ASCII, Unicode, UTF-8, and so on.


    The GetBytes() method will get the byte representation:


    ```

    string myString = "C# Rocks";

    byte[] bytes = Encoding.ASCII.GetBytes(myString);

    ```


    If you want to output the string and the bytes, it would look like this:


    Original string: C# Rocks!

    ASCII bytes: 43-23-20-52-6F-63-6B-63-73-21


    Using Encoding.Unicode, it would look like this:


    Unicode bytes: 43-00-23-00-20-00-52-00-6F-00-63-00-6B-00-63-00-73-00-21-00


    To convert back, use Encoding.GetString() and pass in the bytes:


    ```

    string result = Encoding.ASCII.GetString(bytes);

    ```


    This is all enough, but consider the string "C# Rocks!". The music has no ASCII
    equivalent. This character will be converted to a question mark (?) if you convert
    to a byte format with no valid encoding, as in this example:


    ```

    string myString = "C# Rocks!";

    byte[] bytes = Encoding.ASCII.GetBytes(myString);

    string result = Encoding.GetString(bytes);

    Console.WriteLine("Round trip: {0}->{1}->{2}",

    myString,

    Converter.ToString(bytes),

    result);

    ```


    This has the following output:


    Round trip: C# Rocks!->43-23-20-52-6F-63-6B-63-73-21-3F->C# Rocks!'
