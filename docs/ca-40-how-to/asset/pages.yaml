    # Create a New Entity


    To create a new Book, declare the object and its properties before adding it to
    the entity collection. In this case, since ID is an auto-incrementing property,
    you don''t need to set it.


    ```

    BookEntities entities = new BookEntities();

    newBook = new Book();

    newBook.Title = "C# 4 How-to";nnewBook.PublishYear = 2010;

    entities.AddToBooks(newBook);

    entities.SaveChanges();

    ```


    # Look Up an Entity


    You can use the ObjectQuery<T> class to create queries for you, as in this example:


    ```

    ObjectQuery<Book> bookQuery =

    new ObjectQuery<Book>(

    "SELECT VALUE FROM BookEntities.Books AS Book",

    entities.Where("it.ID = 1");

    ```


    However, this syntax becomes awkward quickly. Instead, you should use LINQ, which
    is discussed in Chapter 21. The equivalent query would look like this:


    ```

    var books = from book in entities.Books

    where book.ID == 1

    select book;

    ```


    # Delete an Entity


    To delete an entity, pass it to the entity list''s DeleteObject method:


    ```

    BookEntities entities = new BookEntities();

    ```


    ```

    //create a new entity

    newBook = new Book();

    newBook.Title = "C# 4 How-to";nnewBook.PublishYear = 2010;

    entities.AddToBooks(newBook);

    entities.SaveChanges();

    ```


    ```

    entities.DeleteObject(newBook);

    entities.SaveChanges();

    ```'
