    \ 1970737339\n01:Completed\n02:Completed\nPress any key to exit...\n\n# Use an\
    \ Event Broker\n\n> Scenario/Problem: You have two unrelated components that must\
    \ respond to each others' events. You don't want to have them directly refer to\
    \ each other.\n\nSolution: An event broker is merely an object that acts as middleman\
    \ for any number of events from any objects to any other object. In a way, this\
    \ is taking the Observer Pattern (see previous section) even further.\n\nHere's\
    \ a simple event broker implementation:\n\n```\npublic class EventBroker\n{\n\
    \    Dictionary<string, List<Delegate>> _subscriptions =\n        new Dictionary<string,\
    \ List<Delegate>>();\n\n    public void Register(string eventId, Delegate method)\n\
    \    {\n        //associate an event handler for an eventId\n        List<Delegate>\
    \ delegates = null;\n        if (!_subscriptions.TryGetValue(eventId, out delegates))\n\
    \        {\n            delegates = new List<Delegate>();\n            _subscriptions[eventId]\
    \ = delegates;\n        }\n        delegates.Add(method);\n    }\n\n    public\
    \ void Unregister(string eventId, Delegate method)\n    {\n        //unassociate\
    \ a specific event handler method for the eventId\n        List<Delegate> delegates\
    \ = null;\n        if (_subscriptions.TryGetValue(eventId, out delegates))\n \
    \       {\n            delegates.Remove(method);\n            if (delegates.Count\
    \ == 0)\n            {\n                _subscriptions.Remove(eventId);\n    \
    \        }\n        }}\n```"
