  md: "# Signal Threads with Events\n\nScenario/Problem: Often, threads need to wait\
    \ until something significant happens before continuing.\n\nSolution: Events are\
    \ some of the most useful signaling mechanisms available. There are two types\
    \ of events: those with a manual reset, and those that automatically reset.\n\n\
    Setting an event is what causes other threads to wake up and continue with their\
    \ work. When a ManualResetEvent is set, all waiting threads are woken up and the\
