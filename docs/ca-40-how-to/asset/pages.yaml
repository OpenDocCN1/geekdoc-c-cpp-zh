  md: "# Access a Bitmap's Pixels Directly for Performance\n\nSee the DrawToBitmap\
    \ sample in the projects for this chapter for the complete example.\n\n> NOTE\
    \ In some applications, you will find that you need to render multiple types of\
    \ devices. In such cases, you should factor out the code that does the actual\
    \ drawing into something that can be called independently of the actual output\
    \ device.\n\n# Access a Bitmap's Pixels Directly for Performance\n\nScenario/Problem:\
    \ You need to manipulate individual pixels in a bitmap image.\n\nSolution: The\
    \ Bitmap class provides handy GetPixel() and SetPixel() methods, which are okay\
    \ for small changes, but if you need to do a large-scale transformation of a bitmap's\
    \ pixels, you'll need to access the image data directly.\n\nThis example shows\
    \ how to manipulate an image's pixels by copying to a new image and halving the\
    \ brightness:\n\n```\n//pictureBoxSource is a PictureControl that\n//contains\
    \ the image resource\nBitmap sourceImg = new Bitmap(pictureBoxSource.Width, sourceImg.Height);\n\
    Bitmap destImg = new Bitmap(sourceImg.Width, sourceImg.Height);\nRectangle dataRect\
    \ = new Rectangle(0,0, sourceImg.Width, sourceImg.Height);\nBitmapData sourceData\
    \ = sourceImg.Locks(dataRect, ImageLockMode.ReadOnly,\nPixelFormat.Format32bppArgb);\n\
    BitmapData destData = destImg.Locks(dataRect, ImageLockMode.WriteOnly,\nPixelFormat.Format32bppArgb);\n\
    \nIntPtr sourcePtr = sourceData.Scan0;\nIntPtr destPtr = destData.Scan0;\nbyte[]\
    \ buffer = new byte[sourceData.Stride*row];\n\nfor (int row = 0; row < sourceImg.Height;\
    \ row++) {\n  // yes we could copy the whole bitmap in one go,\n  // but want\
    \ to demonstrate the point\n```"
  merge: -1
