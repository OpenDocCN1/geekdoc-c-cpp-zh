  md: "Solution: .NET makes creating a TCP/IP client and server very easy. Let's do\
    \ the server first (see Listing 12.1). The logic is pretty easy to follow:\n\n\
    +   - Run in a loop. Inside the loop, wait for a connection.\n- Once a connection\
    \ is established, spawn a thread to handle it.\n- Receive a message.\n- Send a\
    \ response.\n- Close the connection and return from the thread.\n\n# LISTING 12.1\
    \ TCP Server\n\n```\nusing System;\nusing System.Net.Sockets;\nusing System.Text;\n\
    using System.Threading;\n\nnamespace TcpServer\n{\n    class Program\n    {\n\
    \        static void Main(string[] args)\n        {\n            IPAddress localhost\
    \ = IPAddress.Parse(\"127.0.0.1\");\n            TcpListener listener =\n    \
    \            System.Net.Sockets.TcpListener(localhost, 1330);\n            listener.Start();\n\
    \n            while (true)\n            {\n                Console.WriteLine(\"\
    Waiting for connection\");\n                //AcceptTcpClient waits for a connection\
    \ from the client\n                TcpClient client = listener.AcceptTcpClient();\n\
    \                //start a new thread to handle this connection so we can\n  \
    \              //go back to waiting for another client\n                Thread\
    \ thread = new Thread(\n                    new ParameterizedThreadStart(HandleClientThread));\n\
    \                thread.Start(client);\n            }\n        }\n\n        static\
    \ void HandleClientThread(object obj)\n        {\n            TcpClient client\
    \ = obj as TcpClient;\n```"
