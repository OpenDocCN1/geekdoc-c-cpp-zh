  md: "# CHAPTER 11 Files and Serialization\n\nYou can also call watcher.WaitFor(),\
    \ which will wait until something happens before returning, but usually the event-based\
    \ mechanism will work for you.\n\n# Get the Paths to My Documents, My Pictures,\
    \ Etc.\n\n| Scenario/Problem: You need to get the path of a user's special folders,\
    \ as his documents folder.|\n\nSolution: You should never hard-code the paths.\
    \ Not only can different versions of the OS have folder names, but the user can\
    \ change these folders to be in whatever location wants. Use Environment.GetFolder()\
    \ with the Environment.SpecialFolder enumeration to retrieve the actual folder\
    \ on the disk. The following code will print the entire list:\n\n```\nforeach\
    \ (Environment.SpecialFolder folder in\n    Enum.GetValues(Environment.SpecialFolder))\n\
    {\n    string path = Environment.GetFolderPath(folder);\n    Console.WriteLine(\"\
    {0}=={1}\", folder, path);\n}\n```\n\n> NOTE In general, you should put your application's\
    \ data in the LocalApplicationData (nonroaming) or ApplicationData (roaming).\
    \ That is these folders are for example. Examine them on your own computer to\
    \ see how other software uses them. You should never write program data to ProgramFiles\
    \ or anywhere file security is an issue. The ApplicationData directory will be\
    \ replicated on all computers to which the user logs on in a domain, so putting\
    \ unnecessary data there. Starting with Windows Vista, the operating system enforces\
    \ file security much more strongly, and an application that doesn't pay attention\
    \ to security issues can break.\n\n# Serialize Objects\n\n| Scenario/Problem:\
    \ You want to store .NET objects in a binary form suitable for storage or transmission\
    \ via a network.|\n\nSolution: The easy way to allow a type to be serialized is\
