    # Detect Empty Strings


    > Scenario/Problem: You need to detect if a string contains content.


    Solution: When handling string input, you generally need to be aware of four possible
    states:


    +   1. String is null.

    2. String is empty.

    3. String contains nothing but whitespace.

    4. String contains content.


    The first two conditions are handled by the static method String.IsNullOrEmpty(),
    which has existed in .Net for a while.

    .Net 4 adds String.IsNullOrEmptyOrWhitespace(), which also handles condition 3.

    bool containsContent = !String.IsNullOrEmptyOrWhitespace(myString);


    # Concatenate Strings: Should You Use StringBuilder?


    > Scenario/Problem: You need to append a large number of strings together to form
    a single string. You have heard that StringBuilder should always be used.


    Solution: Not necessarily. Use of StringBuilder has become somewhat of a dogmatic
    issue in the C# community, and some explanation is useful.


    In C#, strings are immutable objects, meaning they cannot be changed once created.
    This has ramifications for string manipulation, but they are probably not as drastic
    as you might be to believe. There are essentially two options for string concatenation:
    using plain String objects and using StringBuilder.


    Here''s an example using plain string objects:


    ```

    string a = "Hello";

    string b = " ";

    string c = "World";

    string s = a + b + c;

    ```'
