  md: "# Prevent Instantiation with an Abstract Base Class\n\n```\nConsole.WriteLine(\"\
    var Part, Weight: {0}\", part.Weight);\nConsole.WriteLine(\"var Part, ToString():\
    \ {0}\", part.ToString());\nConsole.WriteLine(\"var Part, Type: {0}\", part.GetType());\n\
    ```\n\nThis program produces the following output:\n\n```\nvar Part, Weight: 2.5\n\
    var Part, ToString(): { ID = 1, Name = Part01, Weight = 2.5 }\nvar Part, Type:\
    \ <f__AnonymousType`3[System.Int32,System.String,System.Double]>\n```\n\nSee Chapter\
    \ 3, \"General Coding,\" for more information on how to use the var keyword.\n\
    \n> NOTE var might look like it's untyped, but don't be fooled. The compiler is\
    \ generating a strongly typed object for you. Examine this code sample:\nvar type1\
    \ = new { ID = 1, Name = \"A\" };\nvar1Same = new { ID = 2, Name = \"B\" };\n\
    var type2 = new { ID = 3, Name = \"C\", Age = 13 };\ntype1 = type1Same; //Ok\n\
    type1 = type2; //Not ok\nFor that last line, the compiler will give this error:\n\
    Cannot convert type 'AnonymousType#2' to 'AnonymousType#1'.\n\n# Prevent Instantiation\
    \ with an Abstract Base Class\n\n> Scenario/Problem: You want a base class with\
    \ common functionality, but you don't want to allow anyone to instantiate the\
    \ base class directly.\n\nSolution: Mark your class as abstract.\n\n```\npublic\
    \ abstract MyClass\n{\n  ...\n}\n```"
