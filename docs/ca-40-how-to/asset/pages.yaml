  md: '# INTRODUCTION


    # Overview of C# 4.0 How-To


    This book is very different from a typical “bible” approach to a topic. By structuring
    the book as a “how-to,” it presents the material by scenario in steps that are
    easily followed. Throughout, I have tried to keep the explanatory text to the
    minimum necessary and keep the focus on the code itself. Often, you will find
    comments embedded in the code to explain non-obvious bits.


    This book is not strictly a language/library book. Besides covering the language
    features themselves, it dives into practical examples of application patterns,
    useful algorithms, and handy tips that are applicable in many situations.


    Developers, both beginner and advanced, will find hints of useful topics in this
    book. Whether it’s a section on lesser-known C# operators, how to sort strings
    that contain numbers in them, or how to implement Undo, this book contains recipes
    that are useful in a wide variety of situations, regardless of skill level.


    In short, this book I wish had on my desk when I was first learning programming
    and C# as well as now, whenever I need a quick reference or reminder about how
    to do something.


    # How-To Benefit from This Book


    We designed this book to be easy to read from cover to cover. The goal is to get
    a full understanding of C# 4.0. The subject matter is divided into four parts
    with easy-to-navigate and easy-to-use chapters.


    Part I, “C# Fundamentals,” covers the common C# functionality that you will use
    in every type of programming. While it may seem basic, there are a lot of tips
    to get you the most of these fundamental topics.


    +   - Chapter 1, “Type Fundamentals”


    +   - Chapter 2, “Creating Versatile Types”


    +   - Chapter 3, “General Coding”


    +   - Chapter 4, “Exceptions”


    +   - Chapter 5, “Numbers”'
