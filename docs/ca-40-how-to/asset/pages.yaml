    \ of it).\n\n# Protect Data in Multiple Processes\n\nScenario/Problem: You need\
    \ to protect memory, files or other resources that are shared across multiple\
    \ processes.\n\nSolution: You can use a mutex, which is like a Monitor object,\
    \ but at an operating system level. Mutexes must be named so that both processes\
    \ can open the same mutex object.\n\nHere's a sample program that uses a mutex\
    \ to protect a file from being written to two instances of this same program (see\
    \ Figure 23.1):\n\n```\nstatic void Main(string[] args)\n{\n    Mutex mutex =\
    \ new Mutex(false, \"MutexDemo\");\n    Process me = Process.GetCurrentProcess();\n\
    \    string outputfile = \"MutexDemoOutput.txt\";\n\n    while (!Console.KeyAvailable)\n\
    \    {\n        mutex.WaitOne();\n        Console.WriteLine(\"Process {0} gained\
    \ control\", me.Id);\n        using (FileStream fs = new FileStream(logfile, FileMode.OpenOrCreate))\n\
