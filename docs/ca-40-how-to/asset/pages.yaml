  md: "One of the greatest advantages of using a managed language such as C# in the\
    \ Common Language Runtime (CLR) environment is that you don't have to worry about\
    \ memory management as much as you did in languages such as C or C++. That said,\
    \ there are still memory-related topics that you need to understand as a C# developer.\
    \ Furthermore, sometimes you just have to drop out of the world of managed code\
    \ and get access to pointers. It's ugly, and you should try to avoid it, but there's\
    \ when you need it.\n\n# Measure Memory Usage of Your Application\n\n| Scenario/Problem:\
    \ You need to find out how much memory your application is using |\n\nSolution:\
    \ The GC class contains many handy memory-related methods, including GetTotalMemory(),\
    \ which is the amount of memory the garbage collector thinks is allocated to your\
    \ application. The number may not be exactly right because of objects that haven't\
    \ garbage collected yet. However, this has the advantage of being able to tell\
    \ you how much memory a certain part of your program uses, rather than the entire\
    \ process.\n\n```\nlong available = GC.GetTotalMemory(false);\nConsole.WriteLine(\"\
    Before allocations: {0:N0}\", available);\n\nint allocSize = 400000000;\nbyte[]\
    \ bigArray = new byte[allocSize];\n\navailable = GC.GetTotalMemory(false);\nConsole.WriteLine(\"\
    After allocations: {0:N0}\", available);\n```\n\nThis same code prints the following:\n\
    Before allocations: 651,064\nAfter allocations: 40,690,080\n\n# Get the OS View\
    \ of Your Application's Memory\n\nYou can also ask the operating system to give\
    \ you information about your process:\n//the Process class is in the System.Diagnostics\
    \ namespace\nProcess proc = Process.GetCurrentProcess();\nConsole.WriteLine(\"\
    Process Info: {0:N0}\"+Environment.NewLine+\nn  \"Private Memory Size: {1:N0}\"\
    +Environment.NewLine +\n  \"Virtual Memory Size: {1:N0}\" + Environment.NewLine\
    \ +\n  \"Working Set Size: {2:N0}\" + Environment.NewLine +"
