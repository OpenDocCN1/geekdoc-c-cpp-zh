  md: "# Expand and Collapse a Group of Controls\n\nScenario/Problem: You have a group\
    \ of controls that you want to be able to collapse when not in use.\n\nSolution:\
    \ An Expander is similar to a GroupBox in that it lets you group related elements\
    \ under a common header. An Expander, however, also allows you to collapse the\
    \ group to save UI space.\n\nHere is one of the Expander elements from the ImageView\
    \ sample app (see Figure 18.3):\n\n```\n<Expander Header=\"Image Info\" IsExpanded=\"\
    True\" x:Name=\"imageInfoGroup\">\n  <Grid Dock=\"DockPanel.Dock=Left\">\n   \
    \ <Grid.ColumnDefinitions>\n      <ColumnDefinition/>\n    </Grid.ColumnDefinitions>\n\
    \    <Grid.RowDefinitions>\n      <RowDefinition/>\n      <RowDefinition/>\n \
    \     <RowDefinition/>\n    </Grid.RowDefinitions>\n    <Label Grid.Row=\"0\"\
    \ Grid.Column=\"0\">Filename</Label>\n    <TextBox IsReadOnly=\"True\" Grid.Row=\"\
    0\" Grid.Column=\"1\" Text=\"Binding Path=FileName, Mode=OneWay\"/>\n    <Label\
    \ Grid.Row=\"1\" Grid.Column=\"0\">Width</Label>\n    <TextBox IsReadOnly=\"True\"\
    \ Grid.Row=\"1\" Grid.Column=\"1\" Text=\"Binding Path=Width, Mode=OneWay, Converter={StaticResource\
    \ formattingConverter}, ConverterParameter={0:N0}\"/>\n    <Label Grid.Row=\"\
    2\" Grid.Column=\"0\">Height</Label>\n    <TextBox IsReadOnly=\"True\" Grid.Row=\"\
    2\" Grid.Column=\"1\" Text=\"Binding Path=Height, Mode=OneWay, Converter={StaticResource\
    \ formattingConverter}, ConverterParameter={0:N0}\"/>\n  </Grid>\n</Expander>\n\
    ```"
