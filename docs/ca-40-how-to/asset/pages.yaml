  md: "# Add a Status Bar\n\n> Scenario/Problem: You need to add a status bar to the\
    \ bottom of a WPF window.\n\nSolution: The StatusBar can easily be docked to the\
    \ bottom of the DockPanel, as shown in this example:\n\n```\n<Window x:Class=\"\
    WpfEditor.Window1\"\n  ...\n  <DockPanel Name=\"dockPanel1\" VerticalAlignment=\"\
    Stretch\"\n             HorizontalAlignment=\"Stretch\">\n    <Menu DockPanel.Dock=\"\
    Top\" Height=\"Auto\">\n      ...\n    </Menu>\n    <StatusBar DockPanel.Dock=\"\
    Bottom\">\n      <TextBlock Text=\"{Binding ElementName=textBox, Path=Text.Length}\"\
    \ />\n    </StatusBar>\n  </DockPanel>\n</Window>\n```\n\nThe StatusBar contains\
    \ a TextBlock that binds to the Text's Length property of the TextBox. Data binding\
    \ is discussed later in this chapter.\n\n> One of the great powers of WPF is that\
    \ it's not tied to Win32 in any way, you have a lot of freedom over layout. You\
    \ can make your StatusBar contain a button, a menu, or a custom control if you\
    \ want. The layout system is completely flexible. You can embed text boxes in\
    \ buttons, and movies into check boxes (if you wanted to do such an odd thing),\
    \ among many, many other things.\n\n# Add a Toolbar\n\n> Scenario/Problem: You\
    \ want to add toolbar to a WPF window.\n\nSolution: Toolbars are the same concept\
    \ as in Windows Forms but come with the flexibility inherent in all WPF controls:"
  merge: -1
