  md: "```\n}\n\nprivate RssLib.Channel GetFeedFromDB() {\n    using (IDataReader\
    \ reader = CreateDataSet().CreateDataReader()) {\n        RssLib.Channel channel\
    \ = new RssLib.Channel();\n        channel.Title = \"Test Feed\";\n        channel.Link\
    \ = \"http://localhost\";\n        channel.Description = \"A sample RSS generator\"\
    ;\n        channel.Culture = CultureInfo.CurrentCulture;\n        channel.Items\
    \ = new List<RssLib.Item>();\n        while (reader.Read()) {\n            RssLib.Item\
    \ item = new RssLib.Item();\n            item.Title = reader[\"title\"] as string;\n\
    \            item.Link = reader[\"link\"] as string;\n            item.PubDate\
    \ = reader[\"date\"] as string;\n            item.Description = reader[\"description\"\
    ] as string;\n            channel.Items.Add(item);\n        }\n    }\n    return\
    \ channel;\n}\n\nprivate static DataSet CreateDataSet() {\n    DataSet dataset\
    \ = new DataSet();\n    //get results from database and populate DataSet\n   \
    \ return dataset;\n}\n```\n\nTo use this in a web project, you must modify the\
    \ web project's web.config to reference it:\n\n```\n<httpHandlers>\n    <!-- type=\"\
    Namespace.ClassName,AssemblyName\" -->\n    <add verb=\"GET\" path=\"feed.xml\"\
    \ type=\"IISRssHandler.RssGeneratorHandler,IISRssHandler\" />\n</httpHandlers>\n\
    ```\n\nNow, whenever you access the project's feed.xml file via a web browser,\
    \ the handler will intercept the request and run your code to generate the RSS."
