    }\n```\n\n```\npublic Vertex3d(double x, double y, double z)\n{\n    this._x =\
    \ x;\n    this._y = y;\n    this._z = z;\n}\n```\n\n# Override ToString() for\
    \ Simple Output\n\nTo get a simple string representation of the vertex, override\
    \ ToString() to return a string of your choosing.\n\n```\npublic override string\
    \ ToString()\n{\n    return string.Format(\"{0}, {1}, {2}\", X, Y, Z);\n}\n```\n\
    \nThe code\n\n```\nVertex3d v = new Vertex3d(1.0, 2.0, 3.0);\nTrace.WriteLine(v.ToString());\n\
    ```\n\nproduces the following output:\n\n(1, 2, 3)\n\n# Implement Custom Formatting\
    \ for Fine Control\n\n> Scenario/Problem: You need to provide consumers of your\
