  md: '# Determine Web Browser Capabilities


    Scenario/Problem: You need to change your application''s behavior based on the
    browser the user is using.


    Given how many platforms display on these days, different browsers, operating
    systems, and mobile devices, it can seem amazing that the Web works at all. Each
    web browser has differences in rendering, the ability to load add-ons such as
    ActiveX controls, JavaScript engines, and more.


    Solution: .NET provides an easy way to discover many of these capabilities automatically,
    using the Request.Browser structure, which contains Boolean or string values for
    many important properties.


    CreateCapabilityRow is just a helper method to create a table row to insert the
    results, as shown in Figure 19.2.


    ```

    CreateCapabilityRow("ActiveX", Request.Browser.ActiveXControls),

    CreateCapabilityRow("AOL", Request.Browser.AOL),

    CreateCapabilityRow("Background Sounds",

    Request.Browser.BackgroundSounds),

    CreateCapabilityRow("Beta", Request.Browser.Beta),

    CreateCapabilityRow("Browser", Request.Browser.Browser);

    ```


    ![](img/c237887cbbac0db0e18bd0eecbc77950_420_0.png)


    Figure 19.2

    You can easily detect many differences in browsers that can affect your functionality.'
  merge: -1
  pgno: 420
- img_proc: true
  md: "# Redirect to Another Page\n\n**Scenario/Problem:** You need to redirect the\
    \ user to another page for further processing.\n\n**Solution:** There are two\
    \ ways to send the user to another page. The first uses standard redirection:\n\
    \n```\nprotected void buttonRedirect_Click(object sender, EventArgs e)\n{\n  \
    \  Response.Redirect(\"TargetPage.aspx\");\n}\n```\n\nThis tells the user’s browser\
    \ to actually navigate to the target page.\n\nIf instead you want to actually\
    \ transfer the processing of the current request to another page in the same directory\
    \ without notifying the user (that is, the user’s browser does not actually go\
    \ to the other page), you can do the following:\n\n```\nprotected void buttonSubmit_Click(object\
    \ sender, EventArgs e)\n{\n    if (ProcessingChoice.SelectedValue == \"Transfer\"\
    )\n{\n    Server.Transfer(\"TargetPage.aspx\");\n}\n}\n```\n\nFrom the user’s\
    \ perspective, the URL has not changed.\n\nTo see exactly how this works, look\
    \ at the FormSubmitAndRedirect project in the included sample code.\n\nFigure\
    \ 19.3 shows the application running with a form allowing the user to select forms\
    \ of transfer that should be done. Figure 19.4 shows the results if the second\
    \ option is chosen."
  merge: -1
  pgno: 421
