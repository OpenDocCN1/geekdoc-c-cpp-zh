  md: 'Most applications deal with data in some manner. Often, such data resides in
    a relational database such as SQL Server, Oracle, or MySQL (among many others).


    This chapter covers the basics of database access from .NET. If you do not have
    a database to play around with, I recommend either SQL Server Express Edition
    or MySQL Community Edition, either of which can be found via your favorite search
    engine. Both databases have components that allow you create and edit databases
    directly from Visual Studio.


    All the examples use a database called TestDB, with a single table called Books.
    The first section will walk through creating this in SQL Server.


    # Create a New Database from Visual Studio


    Scenario/Problem: You want to create a new database from Visual Studio.


    **Solution:** First, make sure you have SQL Server (the Express Edition is fine)
    or another database installed. Although SQL Server will automatically integrate
    with Visual Studio, you may have to download additional components to allow third-party
    databases to work inside Visual Studio. This section will assume you are using
    SQL Server.


    +   1. Open Server Explorer (Ctrl+W, L or from the View menu).

    2. Right-click Data Connections and choose Create New SQL Database.

    3. Pick your server instance from the drop-down box and select the appropriate
    authentication method (usually chosen when you set up the server).

    4. Type in a name—for example, “TestDB”—and hit OK.

    5. Expand the new database that was created for you.

    6. Right-click Tables and select Add New Table.

    7. Configure the table similar to what is shown in Figure 13.1.

    8. Close the window and give the table name Books.

    9. To add data, right-click the created table and select Show Table Data. You
    can see the values I added in Figure 13.2.'
