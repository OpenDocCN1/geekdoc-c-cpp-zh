  md: "We also need a way to track all our commands in the order they were issued:\n\
    \n```\nclass CommandHistory\n{\n    private Stack<ICommand> _stack = new Stack<ICommand>();\n\
    \n    public bool CanUndo()\n    {\n        get\n        {\n            return\
    \ _stack.Count > 0;\n        }\n    }\n\n    public string MostRecentCommandName()\n\
    \    {\n        get\n        {\n            if (CanUndo)\n            {\n    \
    \            ICommand cmd = _stack.Peek();\n                return cmd.Name;\n\
    \            }\n            return string.Empty();\n        }\n    }\n\n    public\
    \ void PushCommand(ICommand command)\n    {\n        _stack.Push(command);\n \
    \   }\n\n    public ICommand PopCommand()\n    {\n        return _stack.Pop();\n\
    \    }\n}\n```\n\nGiven these two things, the specific implementations of commands\
    \ depends on the data structures of the application.\n\nIn this case, we have\
    \ an IWidget interface defining all our objects:\n\n```\ninterface IWidget\n{\n\
    \    void Draw(Graphics graphics);\n    bool HitTest(Point point);\n```"
