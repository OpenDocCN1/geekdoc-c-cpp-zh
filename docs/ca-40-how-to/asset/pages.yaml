  md: "# CHAPTER 25 Application Patterns and Tips\n\nAlthough there is an infinite\
    \ number of ways to build an application, over time a few reusable patterns emerge\
    \ that are particularly helpful when designing complex programs. This chapter\
    \ covers just a few particularly useful patterns.\n\nAs with all design, there\
    \ is no single way to implement these. In some cases, the overall design and idea\
    \ are more important than the specific code used to implement them.\n\nIn addition\
    \ to application patterns, there are some handy tips for building applications\
    \ that didn’t fit in anywhere else.\n\n# Use a Stopwatch to Profile Your Code\n\
    \n> Scenario/Problem: You need to measure how long some code takes to run, especially\
    \ for debugging and analysis.\n\nSolution: Use the System.Diagnostics.Stopwatch\
    \ class.\n\nWhile there are many extensive profiling packages out there (there\
    \ is a profiler included in some editions of Visual Studio), sometimes you just\
    \ need to time a known block of code with a stopwatch.\n\n```\nSystem.Diagnostics.Stopwatch\
    \ timer = new System.Diagnostics.Stopwatch();ntimer.Start();nDecimal total = 0;\n\
    int limit = 1000000;\nfor (int i = 0; i < limit; ++i)\n{\n    total = total +\
    \ (Decimal)Math.Sqrt(i);\n}\ntimer.Stop();\nConsole.WriteLine(\"Sum of sqts: {0}\"\
    ,total);\nConsole.WriteLine(\"Elapsed milliseconds: {0}\",ntimer.ElapsedMilliseconds());\n\
    Console.WriteLine(\"Elapsed time: {0}\", timer.Elapsed);\n```\n\nThis produces\
    \ the output:\nSum of sqts: 666666166.45882210823608\nElapsed milliseconds: 282\n\
    Elapsed time: 00:00:00.2828692\n\nA useful trick when you need to use the Stopwatch\
    \ for debugging purposes is to utilize the IDisposable interface to automate the\
    \ use of the stopwatch:"
  merge: -1
