  md: "# Catch Multiple Exceptions\n\nScenario/Problem: You must handle many potential\
    \ exceptions.\n\n**Solution:** You can have multiple catch blocks after a try.\
    \ .NET will go to the first catch block that is polymorphically compatible with\
    \ the thrown exception. If you have code that throws both ArgumentException and\
    \ ArgumentNullException, for example, the order of your catch blocks is important\
    \ because ArgumentNullException is a child class of ArgumentException.\n\nHere's\
    \ an example of what not to do:\n\n```\ntry {\n    throw new ArgumentNullException();\n\
    } catch (ArgumentException ex) {\n    // will reach here\n} catch (ArgumentNullException\
    \ ex) {\n    // will not reach here!\n}\n```\n\nBecause ArgumentNullException\
    \ is a type of ArgumentException, and ArgumentException is first in the catch\
    \ list, it will be called.\n\nThe rule is: Always order exception catch blocks\
    \ in most-specific-first order.\n\n```\ntry {\n    throw new ArgumentNullException();\n\
    } catch (ArgumentException ex) {\n    // now we will reach here!\n} catch (ArgumentException\
    \ ex) {\n    // catch any other ArgumentException or child\n}\n```"
