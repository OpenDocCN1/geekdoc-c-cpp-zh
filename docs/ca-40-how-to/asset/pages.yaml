    ```\n\n```\nprivate void UndoMostRecentCommand()\n{\n    ICommand command = _history.PopCommand();\n\
    \    command.Undo();\n}\n```\n\n> **NOTE** Although WPF has the notion of command\
    \ objects already, they do not have the ability to undo themselves (which makes\
    \ sense because undo is an application-dependent operation). The ideas in this\
    \ section can be easily translated to WPF.\n\n# Use Model-View-ViewModel in WPF\n\
    \n**Scenario/Problem:** You want to separate UI from underlying data and behavior\
    \ in WPF.\n\nSolution: As WPF has increased in popularity, the Model-View-ViewModel\
    \ pattern has emerged as a variation of Model-Presenter, which works very well\
    \ with the WPF binding system.\n\nThe ViewModel solves the problem of associating\
    \ WPF controls with data objects that don't have any knowledge of UI. It maps\
    \ data objects to data that WPF can bind to. For example, a color code in a database\
    \ could be translated to a Brush for the view to use. The following sections tackle\
