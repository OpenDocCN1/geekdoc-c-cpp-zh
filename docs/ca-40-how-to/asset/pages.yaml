    # Determine if an Integer Is a Power of 2 (aka, A Single Bit Is Set)


    | Scenario/Problem: You need to determine if an integer is a power of 2, or if
    there is exactly one set bit in a number. |


    Solution: The solution relies on the fact that integers are twos-complement encoded
    and a power of 2 has only a single 1 bit.


    ```

    private static bool IsPowerOfTwo(Int64 number)

    {

    return (number != 0) && ((number & -number) == number);

    }

    ```


