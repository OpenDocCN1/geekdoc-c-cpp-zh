  md: "The AttributeTargets enumeration allows you to decide what target are valid\
    \ for this attribute. The valid values are Assembly, Module, Class, Struct, Enum,\
    \ Constructor, Method, Property, Field, Event, Interface, Parameter, Delegate,\
    \ ReturnValue, GenericParameter, and All. If you want to combine values you can\
    \ use the `|` operator, like this: `AttributeTargets.Field | AttributeTargets.Property`.\n\
    \nYou can also specify with AllowMultiple whether multiple instances of this attribute\
    \ are valid on a single element.\n\nTo apply this attribute, you use the square\
    \ brackets:\n\n```\n[Culture(\"en-CA\")\n[Culture(\"en-US\")\nclass MyClass\n\
    {\n    //...\n}\n```\n\nSince every attribute ends in \"Attribute,\" the compiler\
    \ will allow you to just specify the first part of the class when naming them.\n\
    \nIn order to make use of the attribute, you must write code that is aware of\
    \ the CultureAttribute class and look for it.\n\n```\n[Culture(\"en-US\")\n[Culture(\"\
    en-GB\")\nclass Program\n{\n    static void Main(string[]) attributes =\n    \
    \    (CultureAttribute[])typeof(Program).GetCustomAttributes(\n            typeof(CultureAttribute),\
    \ true);\n    //easy comma-separated list\n    string list =\n        attributes.Aggregate(\"\
    \",\n            (output, next) =>\n                (output.Length > 0)\n    \
    \            ? (output + \", \" \" + next.Culture)\n                : next.Culture);\n\
    \n    Console.WriteLine(\"Cultures of Program: {0}\", list);\n\n    Console.ReadLine();\n\
    }\n```\n\nThis example produces the output:\n\nCultures of Program: en-US, en-GB"
