  md: "# Use a Reader-Writer Lock\n\nScenario/Problem: You need to protect access\
    \ to a resource that is read often written to less-often, on multiple threads.\n\
    \nSolution: It's safe to let multiple threads read the data at the same time,\
    \ but when a thread needs to write, all other threads need to be blocked..NET\
    \ originally provided the ReaderWriterLock for this situation, but it has performance\
    \ problems that outweigh its usefulness in many situations. Frankly, there is\
    \ ReaderWriterLockSlim, which corrects many of its predecessor's shortcomings.\n\
    \nThis program demonstrates using a ReaderWriterLockSlim on an array that changes\
    \ among a single writer and three readers:\n\n```\nclass Program\n{\n    const\
    \ int MaxValues = 25;\n    static int[] _array = new int[MaxValues];\n    static\
    \ ReaderWriterLockSlim _lock = new ReaderWriterLockSlim();\n\n    static void\
    \ Main(string[] args)\n    {\n        ThreadPool.QueueUserWorkItem(WriteThread);\n\
    \n        for (int i = 0; i < 3; i++)\n        {\n            ThreadPool.QueueUserWorkItem(ReadThread);\n\
    \        }\n\n        Console.ReadKey();\n    }\n\n    static void WriteThread(object\
    \ state)\n    {\n        int id = (int)Thread.CurrentThread.ManagedThreadId;\n\
    \        for (int i = 0; i < MaxValues; ++i)\n        {\n            _lock.EnterWriteLock();\n\
    \            _array[i] = i*i;\n            Console.WriteLine(\"Added {0} to array\
    \ on thread {1}\", _array[i], id);\n            _lock.ExitWriteLock();\n     \
    \   }\n    }\n\n    static void ReadThread(object state)\n    {\n        for (int\
    \ i = 0; i < MaxValues; i++)\n        {\n            _lock.EnterReadLock();\n\
    \            Console.WriteLine(\"Read {0} from thread {1}\", _array[i], (int)Thread.CurrentThread.ManagedThreadId);\n\
    \            _lock.ExitReadLock();\n        }\n    }\n}\n```"
