  md: 'Here''s an example using StringBuilder:


    ```

    StringBuilder sb = new StringBuilder();

    sb.append("Hello");

    sb.append("

    ```


    Conventional wisdom tells you to use StringBuilder for concatenating strings,
    but that answer is simple. In fact, the official guidelines gives as good guidance
    as we''re likely to find. The following is the MSDN documentation for

    System.StringBuilder (http://msdn.microsoft.com/en-us/library/system.text.string-builder.aspx):


    The performance of a concatenation operation for a String or StringBuilder object
    depends on how often a memory allocation occurs. A String concatenation operation
    always allocates memory, whereas a StringBuilder concatenation only allocates
    memory if the StringBuilder object is too small to accommodate the new data. Consequently,
    the String class is preferable for a concatenation operation if a fixed number
    of String objects are concatenated. In that case, individual concatenation operations
    might be combined into a single operation by the compiler. A StringBuilder object
    is preferable for a concatenation operation if an arbitrary number of strings
    are concatenated; for example, if a loop concatenates a random number of strings
    of user input.


    Running my own tests basically confirms this strategy. StringBuilder is only faster
    once we''re dealing with a lot of strings, As Figure 7.1 shows. String append
    being much slower, we''re still talking about milliseconds either way.


    ![](img/c237887cbbac0db0e18bd0eecbc77950_134_0.png)


    FIGURE 7.1

    Using StringBuilder doesn''t matter (for performance) when there are relatively
    few strings.'
