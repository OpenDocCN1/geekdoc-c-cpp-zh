  md: '# CHAPTER 7 Strings


    What is the output of this program?

    Are file and FILE equal?

    Invariant culture: yes

    Turkish culture: no


    As you can see, the culture can drastically change how strings are interpreted.

    In general, you should use String.Compare() and supply the culture you want to
    use.

    For nonlocalized strings, as internal program strings or settings names, using
    the invariant culture is acceptable.


    # Change Case Correctly


    Scenario/Problem: You need to change the case of a localized string.


    Solution: This is nearly the same issue as comparing two strings. You must specify
    the culture to do it correctly. Again, use the built-in functionality and remember
    the culture.


    Using our Turkish example again, here is the sample code:

    string original = "file";

    Console.WriteLine("Original: "+original);

    Console.WriteLine("Uppercase (invariant): " + original.ToUpperInvariant())\nConsole.WriteLine("Uppercase
    (Turkish): " + original.ToUpper(CultureInfo.CreateSpecificCulture("tr-TR")));


    What is the difference in output?

    Original: file

    Uppercase (invariant): FILE

    Uppercase (Turkish): FILE


    Seemingly nothing, but let''s look at the bytes of the uppercase strings:

    Bytes (invariant): 46-00-49-00-4C-00-45-00

    Bytes (Turkish): 46-00-30-01-4C-00-45-00


    You can see the difference, even though the visual representation is the same.
    The lesson here is just because a character looks the same, it doesn''t mean it
    is the same.'
