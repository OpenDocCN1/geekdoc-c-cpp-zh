  md: '# 628 APPENDIX Essential Tools


    NOTE For best results in a virtual machine, we have a lot of memory available.
    8GB of RAM in my development desktop, which means I can dedicate fully 2GB to
    a virtual installation of Windows 7. To take advantage of this much memory, you
    must be running a 64-bit version of Windows.


    ![](img/c237887cbbac0db0e18bd0eecbc77950_644_0.png)


    FIGURE A.5

    Running Windows 98 has never been so fun since...1998. By the way, .NET 2.0 does
    run on Windows 98. Go ahead, I dare you.


    # Process Explorer and Process Monitor


    > Purpose: To analyze running programs for process, thread, file, network and
    registry information.


    SysInternals (now owned by Microsoft) produced some gems of utilities, and the
    two use most are Process Explorer and Process Monitor.


    Process Explorer, shown in Figure A.6, is sort of a super version of the Windows
    Task Manager. In addition to processes, it can show you, which process has open
    handles on a file, performance information, and for .NET processes, numerous CLR
    counters.


    Process Monitor, shown in Figure A.7, is a real-time trace of file, registry,
    network, and process information. You can use it to see how a process is using
    the file system, for example, or where in the registry it is writing.'
  merge: -1
