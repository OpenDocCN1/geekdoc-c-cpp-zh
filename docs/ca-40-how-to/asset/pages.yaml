  md: "```\n//very important--icon won't show up without this!\nthis.FlatStyle = FlatStyle.System;\n\
    ```\n\n```\n}\n```\n\nThe Win32 class is a simple wrapper for P/Invoked functionality\
    \ (see the section “Call Native Windows Functions Using P/Invoke” later in this\
    \ chapter):\n\n```\nclass Win32\n{\n    [DllImport(\"User32.dll\")\n    public\
    \ static extern IntPtr SendMessage(Handle hWnd, UInt32 Msg, IntPtr wParam, IntPtr\
    \ lParam);\n\n    //defined in Commctrl3.h\n    public const UInt32 BCM_SETSHSHIELD\
    \ = 0x0000160C;\n}\n```\n\nIt is impossible to elevate a process's privileges\
    \ once the process has started, so the technique is to start process as an admin\
    \ and pass it command-line arguments (or otherwise communicate with it) to tell\
    \ it what to do. That second process will do the desired behavior, then leaving.\
    \ Leaving the second, elevated, process running and having the first exit is not\
    \ recommended—your programs should always run with the least privilege possible.\n\
    \nHere is the event handler (which has to do something requiring elevation):\n\
    private void buttonCreateSource_Click(object sender, EventArgs e)\n{}\n\n```\n\
    //you cannot elevate the current process--you have to start a new one\nProcessStartInfo\
    \ startInfo = new ProcessStartInfo();\nstartInfo.FileName = Application.ExecutablePath;\n\
    startInfo.Arguments = \"-createEventSource\";n//trigger the UAC prompt\nstartInfo.Verb\
    \ = \"runas\"\ntry\n{\n    Process proc = Process.Start(startInfo);\n    proc.WaitForExit();\n\
