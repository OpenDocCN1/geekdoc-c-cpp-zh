  md: "# 316 CHAPTER 16 Windows Forms\n\nTable 16.1 describes the differences between\
    \ user settings and application settings.\n\n| TABLE 16.1 The Scope of the Configuration\
    \ Settings |\n| Setting | Description |\n| Application | All instances and users\
    \ are affected by these settings. They cannot be changed during runtime. The configurations\
    \ live in the file located with the executable. |\n| User | The settings can be\
    \ changed on a user basis. They can be changed during runtime. The settings file\
    \ is stored in the user's application data directory. |\n\nBehind the scenes,\
    \ Visual Studio will generate properties of the correct type for your code. Here's\
    \ an example:\n\n```\npublic partial class Form1 : Form\n{\n    public Form1()\n\
    \    {\n        InitializeComponent();\n        //load the settings into our UI\n\
    \        this.textBoxAppConfigValue.Text =\n            Properties.Settings.Default.MyAppSetting;\n\
    \        this.textBoxUserConfigValue.Text =\n            Properties.Settings.Default.MyUserSetting;\n\
    \    }\n\n    //save settings when we close\n    protected override void OnClosing(CancelEventArgs\
    \ e)\n    {\n        Properties.Settings.Default.MyUserSetting =\n           \
    \ textBoxUserConfigValue.Text;\n\n        //can't do this--app settings are read-only!\n\
    \        Properties.Settings.Default.MyAppSetting =\n            //textBoxAppConfigValue.Text;\n\
    \n        //better save if you want to see the settings next time\n        //the\
    \ app runs\n        Properties.Settings.Default.Save();\n    }\n}\n```\n\nFor\
    \ a demo and the full source code, see the ConfigValuesDemo project in this chapter's\
    \ sample code."
