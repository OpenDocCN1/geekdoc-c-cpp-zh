  md: "Solution: Starting with Windows Vista, applications are prohibited from running\
    \ administrative privileges by default. Attempting to do something that requires\
    \ administrative access results in a system dialog box requesting confirmation\
    \ and possibly a password for less-privileged users. This feature is implemented\
    \ in two parts:\n\n+   - A special icon indicating User Access Control (UAC) will\
    \ be invoked.\n\n+   - Performing the action in an elevated process.\n\nThe icon\
    \ doesn't do anything in it of itself, and there is no direct support for it in\
    \ .NET. You can turn it on by sending a message to the Button control button class\
    \ that implements this functionality:\n\n```\npublic class UACButton : Button\n\
    ```\n\n```\n{\n    private bool _showShield = false;\n    public bool ShowShield\n\
    \    {\n        get {\n            return _showShield;\n        }\n        set\
    \ {\n            bool needToShow = value && !IsElevated();\n            //pass\
    \ in 1 for true in lParam\n            if (this.Handle != IntPtr.Zero) {\n   \
    \             Win32.SendMessage(new HandleRef(this.Handle), Win32.BCM_SETSHIELD,\
    \ new IntPtr(0), new IntPtr(needToShow ? 1 : 0));\n                _showShield\
    \ = needToShow;\n            }\n        }\n    }\n\n    //don't need to elevate\
    \ if we already are\n    private bool IsElevated()\n    {\n        WindowsIdentity\
    \ identity = WindowsIdentity.GetCurrent();\n        WindowsPrincipal principal\
    \ = new WindowsPrincipal(identity);\n        return principal.IsInRole(WindowsBuiltInRole.Administrator);\n\
    \    }\n}\n```\n\n```\npublic UACButton()\n{}\n```"
