  md: "NOTE Constructors do not need to be public. For example, you could make a protected\
    \ constructor that is only accessible from derived classes. You could even make\
    \ a private constructor that prevents instantiation (for utility classes) or is\
    \ accessible only from other methods in the same class (static factory methods,\
    \ perhaps).\n\n# Add a Static Constructor and Initialization\n\nScenario/Problem:\
    \ The class has static data that needs to be initialized.\n\nSolution: Static\
    \ fields can be initialized in two ways. One way is with a static constructor,\
    \ which is similar to a standard constructor, but with no accessibility modifier\
    \ or arguments:\n\n```\npublic class Vertex3d\n{\n    private static int _numInstances;\n\
    \    static Vertex3d()\n    {\n        _numInstances = 0;\n    }\n    ...\n}\n\
    ```\n\nHowever, because of performance reasons, it is preferable to initialize\
    \ static fields inline whenever possible, as shown here:\n\n```\npublic class\
    \ Vertex3d\n{\n    private static int _numInstances = 0;\n}\n```\n\n# Initialize\
    \ Properties at Construction\n\nScenario/Problem: You want to initialize class\
    \ properties when the variable is created, even if the constructor does not provide\
    \ the arguments to do so."
