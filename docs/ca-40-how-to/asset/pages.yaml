  md: '# Maintain Application State


    429


    ![](img/c237887cbbac0db0e18bd0eecbc77950_445_0.png)


    FIGURE 19.10


    ASP.NET provides easy-to-use validation controls as well as a way to custom validation,
    in the prime number check in this example.


    > **NOTE** You should consider these data-validation controls to be for the user''s
    benefit, not yours. Just because you use validation in the browser means nothing
    for your own integrity. For example, a user who disables JavaScript will not have
    his data validated on the client-side at all.

    You should always validate data on the server side. Frankly, ASP.NET does quite
    a bit of this for you with the included validation controls. But always remember
    to add your custom validation routines on the server when needed and include them
    in the .aspx file. When submitting, check the Page. IsValid property to ensure
    that server-side validation succeeds before testing the data.

    A popular way to think about this is in terms of a boundary of trusted data. All
    user input has to pass through the trusted boundary, where it is inspected, sanitized,
    and normalized, being whatever (minimal) level of trust you give it.

    Remember, never trust user input. Never.


    # Maintain Application State


    Scenario/Problem: You need to store data on an application-wide basis.


    Application data is exactly that: It is the same across the entire app, for all
    users in all sessions. It is the equivalent of a global variable.'
  merge: -1
