  md: "# Instantiate a Class Dynamically\n\n**Scenario/Problem:** You want to instantiate\
    \ a class from a dynamically loaded assembly.\n\n**Solution:** Using reflection,\
    \ it's possible to instantiate code from assemblies that are not referenced at\
    \ build time. Suppose you have a class defined in DynamicInstantiateLib.dll:\n\
    \n```\npublic class TestClass\n{\n    public int Add(int a, int b)\n    {\n  \
    \      return a + b;\n    }\n\n    public string CombineStrings<T>(T a, T b)\n\
    \    {\n        return a.ToString() + \" \"\" + b.ToString();\n    }\n}\n```\n\
    \nIn a separate assembly that does not have a reference to DynamicInstantiateLib.dll,\
    \ you can use this code to nevertheless create an instance of TestClass:\n\nAssembly\
    \ assembly = Assembly.LoadFrom(\"DynamicInstantiateLib.dll\");\n\nType type =\
    \ assembly.GetType(\"DynamicInstantiate.TestClass\");\nobject obj = Activator.CreateInstance(type);\n\
    \nBecause you don't have a reference, you can't use the actual type to refer to\
    \ it. This would seem to make it hard to use, but there are a few ways around\
    \ this, as seen in the next section.\n\n# Invoke a Method on a Dynamically Instantiated\
    \ Class\n\n**Scenario/Problem:** You need to execute code on a dynamically instantiated\
    \ type."
