    # Render 3D Geometry


    > Scenario/Problem: You want to render 3D geometry.


    **Solution:** Starting in this section, you''ll see that WPF provides the unprecedented
    ability to merge 3D graphics with standard user interface elements and multimedia.


    Effectively using 3D graphics requires learning a little about cameras, lighting,
    materials, and coordinate systems. Thankfully, WPF makes a lot of this very easy.


    This simple demonstration creates a cube, complete with color and lighting, as
    seen in Figure 18.6


    ![](img/c237887cbbac0db0e18bd0eecbc77950_405_1.png)


    FIGURE 18.6


    This cube demonstrates simple lighting and texture usage.'
