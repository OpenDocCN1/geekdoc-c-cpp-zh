- img_proc: true
  md: "# CHAPTER 27 Fun Stuff and Loose Ends\n\n```\nSND_FILENAME = 0x00020000,\n\
    SND_RESOURCE = 0x00040004,\nSND_FLAGS = 0x0040,\nSND_APPLICATION = 0x00080\n```\n\
    \nThe first argument to PlaySound can be a filename, alias, or resource, depending\
    \ on the flags you pass. The aliases are defined in the registry and the Sounds\
    \ control applet.\n\n```\nWin32.PlaySound(\"Default\", 0, (int)(Win32.Soundflags.SND_ALIAS\
    \ | Win32.Soundflags.SND_ASYNC | Win32.Soundflags.SND_NOWAIT));\n```\n\nThe SND_ASYNC\
    \ flag tells the system to start playing the sound, but to return immediately,\
    \ before it's done playing. This is usually what you want, to avoid hanging the\
    \ UI while a sound plays.\n\n# Shuffle Cards\n\n> Scenario/Problem: You need to\
    \ shuffle elements in a collection, such as cards in a deck.\n\nSolution: Although\
    \ simple, this solution is a very easy thing to get wrong, algorithmically. For\
    \ more information, look at Wikipedia's entries on card-shuffling algorithms.\n\
    \n```\nclass Card { \nRandom rand = new Random();\nprivate static void ShuffleDeck(Card[]\
    \ cards)\n{\n  int n = cards.Length;\n\n  while (n > 1)\n  {\n    int k = rand.Next(n);\n\
    \    --n;\n    Card temp = cards[n];\n    cards[n] = cards[k];\n    cards[k] =\
    \ temp;\n  }\n}\n```\n\nThe accompanying source code wraps this algorithm into\
    \ a test program that runs millions of times and tracks the outcomes to see if\
    \ the results are skewed in any way."
