  md: "# Take Advantage of Contravariance\n\n**Scenario/Problem:** In previous versions\
    \ of .NET, there were situations where delegates did not behave as expected. For\
    \ example, a delegate with a type parameter of a base class should be assignable\
    \ to delegates of a more derived type parameter because any delegate that is callable\
    \ with the base class should also be callable with the derived class. The following\
    \ code sample demonstrates the issue:\n\nGiven these class definitions:\n\n```\n\
    class Shape\n{\n    public void Draw() { Console.WriteLine(\"Drawing shape\");\
    \ }\n}\n```\n\n```\nclass Rectangle : Shape\n{\n    public void Expand() { /*...*/\
    \ }\n}\n```\n\nAnd given this delegate and method:\n\n```\ndelegate void ShapeAction<\
    \ T>(T shape);\nstatic void DrawShape(Shape shape)\n{\n    if (shape != null)\n\
    {\n        shape.Draw();\n    }\n}\n```\n\nYou would expect this scenario to work:\n\
    ShapeAction<Shape> action = DrawShape;\nShapeAction<Rectangle> rectAction2 = action;\n\
    \nAfter all, DrawShape can take any type of shape, including Rectangle. Unfortunately,\
    \ this scenario did not work as expected.\n\n**Solution:** In .NET 4, contravariance\
    \ on delegates fixed this to enable you to assign less-specific delegates to more-specific\
    \ delegates, as long as the type parameter T is declared as \"in\", which means\
    \ the delegate does not return T. In the following code, the delegate's type parameter\
    \ has been modified with in."
  merge: -1
  pgno: 307
- img_proc: true
  md: "```\nclass Shape\n{\n    public void Draw() { Console.WriteLine(\"Drawing shape\"\
    ); }\n}\n```\n\n```\nclass Rectangle : Shape\n{\n    public void Expand() { /*...*/\
    \ }\n}\n```\n\n```\nclass Program\n{\n    delegate void ShapeAction<in T>(T shape);\n\
    \    static void DrawShape(Shape shape)\n    {\n        if (shape != null)\n \
    \       {\n            shape.Draw();\n        }\n    }\n    static void Main(string[]\
    \ args)\n    {\n        //this should obviously be ok\n        ShapeAction<Shape>\
    \ action = DrawShape;\n        action(new Rectangle());\n    }\n```\n\n+   * Intuitively,\
    \ you know any method that\n* conforms to a ShapeAction<Shape> delegate\n* should\
    \ also work on a Rectangle because\n* Rectangle is a type of Shape.\n\n* It's\
    \ all possible to assign a less derived _method_\n* to a more-derived delegate,\
    \ but until .NET 4\n* you could not assign a less-derived _delegate_ to\n* a more-derived\
    \ delegate: an important distinction.\n\n* Now, as long as the type parameter\
    \ is marked as \"in\"\n* you can.\n\n```\n//this was possible before .NET 4\n\
    ShapeAction<Rectangle> rectAction1 = DrawShape;\nrectAction1(new Rectangle());\n\
    ```"
