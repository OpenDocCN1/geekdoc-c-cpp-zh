  md: "# 280 CHAPTER 15 Delegates, Events, and Anonymous Methods\n\nAlthough not directly\
    \ related to user interaction per se, delegates and events form the fundamental\
    \ building blocks upon which the GUI layer operates.\n\nDelegates and events,\
    \ in particular, are a way of decoupling various parts of your program. By creating\
    \ events for components, they can signal changes in themselves, without needing\
    \ to care about the interfaces of external components that are interested in finding\
    \ out those changes.\n\nAnonymous methods and lambda expressions are in some ways\
    \ merely simplifications of syntax when dealing with delegates.\n\n# Decide Which\
    \ Method to Call at Runtime\n\nScenario/Problem: You need to be able to decide\
    \ which method gets called at runtime.\n\nSolution: Declare a delegate that matches\
    \ the signature of the target methods. In C#, delegates are kind of like object-oriented,\
    \ type-safe function pointers. They can be generic. This example shows how delegates\
    \ can be aggregated and stored like any other piece of data, and then executed.\n\
    \n```\nclass Program\n{\n    delegate T MathOp<T>(T a, T b);\n\n    static void\
    \ Main(string[] args)\n    {\n        //yes, this is an array of methods-\n  \
    \      //that all conform to MathOp<T> delegate\n        List<MathOp<double>>\
    \ opsList = new List<MathOp<double>>();\n\n        opsList.Add(Add);\n       \
    \ opsList.Add(Divide);\n        opsList.Add(Add);\n        opsList.Add(Multiply);\n\
    \n        double result = 0.0;\n        foreach (MathOp<double> op in opsList)\n\
    \        {\n            result = op(result, 3);\n        }\n        Console.WriteLine(\"\
    result = {0}\", result);\n    }\n\n    static double Divide(double a, double b)\n\
    {}\n```"
