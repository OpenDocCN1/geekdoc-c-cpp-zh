  md: '# NDepend


    > **Purpose: To analyze the codebase as well as show statistics, dependencies,
    and areas for improvement.**


    NDepend is such a powerful program that it’s hard to describe everything that
    it can do. It can show you at a glance the largest or most complex parts of your
    program are. It can show you dependencies among classes or assemblies. You can
    give and even create custom queries to report on—for example, all methods starting
    with “Do” that have more than 15 parameters and a cyclomatic complexity greater
    than 2.6. NDepend is shown in Figure A.3.


    ![](img/c237887cbbac0db0e18bd0eecbc77950_642_0.png)


    FIGURE A.3.


    The default view of NDepend shows many of its capabilities, and hints at some.


    > **Some editions of Visual Studio also contains analysis and code metrics tools,
    but they are not as extensive as NDepend.**


    # FXCop


    > **Purpose: To analyze your source code for design, globalization, performance,
    and other problems.**'
  merge: -1
  pgno: 642
- img_proc: true
  md: 'This is a good sanity check on your code to ensure you''re following best practices
    feasible. You can analyze your code, recommend changes, tell you if the recommended
    change is breaking, and point you to more information about why the change was
    recommended.


    There is also an SDK where you can create your own set of rules particular to
    your company or project.


    I ran the ComplexNumber class mentioned earlier in this chapter. As you can see
    in Figure A.4, it has a few recommendations.


    ![](img/c237887cbbac0db0e18bd0eecbc77950_643_0.png)


    FIGURE A.4


    FXCop is a valuable check that you''re using .NET according to recommended patterns
    and practices.


    # Virtual PC


    > Purpose: To run virtualized operating systems for testing.


    It is very difficult to maintain all computers with possible operating systems
    on which your application must run. Rather, install them all in virtual machines.
    This is far more convenient for testing software so you can do it on your desktop.


    Virtual PC is free (as of writing), but you must have licenses for the operating
    systems if you have Windows 7, you can get Windows Virtual PC, instead.'
  merge: -1
