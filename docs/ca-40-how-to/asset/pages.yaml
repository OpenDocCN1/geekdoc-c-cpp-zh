  md: "# Get a Collection of a Portion of Objects (Projection)\n\n> Scenario/Problem:\
    \ Given Our Book object, you want to return a collection of objects that represent\
    \ just the titles and publication years, dropping the author.\n\nSolution: Before\
    \ LINQ, this involved some usually trivial but clunky code to iterate over all\
    \ the objects and insert the desired properties into a new collection. With LINQ,\
    \ a single line (which is broken here due to the limited width of the page:)\n\
    \n```\nvar justTitlesAfter1850 = from book in books\nwhere book.PublishYear >\
    \ 1850\nselect book.Title;\n```\n\nThis line returns titles of books published\
    \ after 1850:\n\nTitles of books after 1850:\nNapoléon le Petit\nLes Châiments\n\
    Les Contemplations\nLes Misérables\n\nThe result, justTitlesAfter1850, is a collection\
    \ of string objects, but what if you want to project out more than one field?\
    \ See the next section.\n\n# Perform a Join\n\n> Scenario/Problem: You want to\
    \ combine data from multiple tables.\n\nSolution: Use the join keyword to combine\
    \ tables on a common field.\n\nThis is where the true power of LINQ shines through.\
    \ In this example, the Author collection will be combined with the Book collection,\
    \ and only the author and title information will be projected out.\n\n```\nvar\
    \ withAuthors = from book in books\njoin author in authors on book.AuthorId equals\
    \ author.Id\nselect new { Book = book.Title,\nAuthor = author.FirstName + \" \"\
    \ + \n+ author.LastName };\nConsole.WriteLine(\"Join with authors:\");\nforeach\
    \ (var bookAndAuthor in withAuthors)\n{\nConsole.WriteLine(\"{0}, {1}\",\n```"
  merge: -1
  pgno: 481
- img_proc: true
  md: "# CHAPTER 21 LINQ\n\n```\nbookAndAuthor.Book,\nbookAndAuthor.Author);\n}\n\
    ```\n\nHere’s the output:\n\n+   Join with authors:\nLe Rhin, Victor Hugo\nLes\
    \ Burgraves, Victor Hugo\nNapoléon le Petit, Victor Hugo\nLes Châtiments, Victor\
    \ Hugo\nLes Contemplations, Victor Hugo\nLes Misérables, Victor Hugo\n\nSo what\
    \ is the type ofWith? Is it an anonymous type (see Chapter 1, “Type Fundamentals”)\
    \ generated for the purpose of this LINQ query. Because there is no type name\
    \ for it (at least, in the code there isn’t), var must be used to refer to both\
    \ the collection and the collection’s objects.\n\n> NOTE LINQ can generate these\
    \ anonymous objects as needed, but it can also set properties in an existing named\
    \ object that you specify. See the LINQ to Bing example later in this chapter.\n\
    \n# Query XML\n\nScenario/Problem: You want to extract data from XML documents.\n\
    \nSolution: LINQ contains its own set of XML-manipulation classes that are optimized\
    \ for LINQ queries. The syntax of the query is exactly the same as with plain\
    \ objects:\n\n```\nXDocument doc = XDocument.Load(\"LesMis.xml\");\nvar chaptersWithHe\
    \ = from chapter in doc.Descendants(\"Chapter\")\nwhere chapter.Value.Contains(\"\
    he\")\nselect chapter.Value;\n```\n\n```\nConsole.WriteLine(\"Chapters with 'he':\"\
    );\nforeach (var title in chaptersWithHe)\n{\n  Console.WriteLine(title);\n}\n\
    ```"
