    \n```\nbool done = false;\nwhile (!done)\n{\n    string received = ReadMessage(client);\n\
    \    Console.WriteLine(\"Received: {0}\", received);\n    done = received.Equals(\"\
    bye\");\n    if (done) SendResponse(client, \"BYE\");\n    else SendResponse(client,\
    \ \"OK\");\n}\nclient.Close();\nConsole.WriteLine(\"Connection closed\");\n\n\
    private static string ReadMessage(TcpClient client)\n{\n    byte[] buffer = new\
    \ byte[256];\n    int totalRead = 0;\n    //read bytes until stream indicates\
    \ there are no more\n    do\n{\n        int read = client.GetStream().Read(buffer,\
    \ totalRead,\n        buffer.Length - totalRead);\n        totalRead += read;\n\
    \    } while (client.GetStream().DataAvailable);\n\n    return Encoding.Unicode.GetString(buffer,\
    \ 0, totalRead);\n}\n\nprivate static void SendResponse(TcpClient client, string\
    \ message)\n{\n    //make sure the other end decodes with the same format!\n \
    \   byte[] bytes = Encoding.Unicode.GetBytes(message);\n    client.GetStream().Write(bytes,\
    \ 0, bytes.Length);\n}\n```\n\nThe only way to stop this server is with Ctrl+C\
    \ (which is fairly standard for console servers).\n\nNext, the client (see Listing\
    \ 12.2). Its logic is similarly easy:\n\n+   - Connect to the server.\n- Loop\
    \ until an exit is signaled."
