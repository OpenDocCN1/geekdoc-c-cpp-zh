  md: '# How-To Continue Expanding Your Knowledge


    You can access the code samples used in this book by registering on the book’s
    website at informit.com/register. Go to this URL, sign in, and enter the ISBN
    to register (free registration required). After you register, look on your Account
    page, under Registered Products, for a link to Access Bonus Content.


    # How-To Continue Expanding Your Knowledge


    No book can completely cover C#, the .NET Framework, and even however hope to
    cover a small topic within that world. And if there were, you probably couldn’t
    lift it, let alone read it in your lifetime.


    Once you’ve mastered the essentials, there are plenty of resources to get your
    questions answered and dive deeply into .NET.


    Thankfully, the MSDN documentation for .NET (located at http://msdn.microsoft.com/en-us/library/aa139615.aspx)
    is top-notch. Most topics have code samples and an explanation use. An added bonus
    is the ability at the bottom of every topic for anyone to add useful content.
    There are many good tips found here from other .NET developers.


    The .NET Development forums (http://social.msdn.microsoft.com/Forums/en-US/category/netdevelopment)
    are an excellent place to get your questions answered by the experts, who, in
    many cases, were involved in the development and testing of .NET.


    I have also found StackOverflow.com a good place to get questions answered.

    The best advice I can give on how to continue expanding your knowledge is to just
    write software. Keep at it, think of new projects, use new technologies, go beyond
    your abilities. This and other books are very useful, After that, you just need
    to dive in and start coding, using the book as a faithful reference when you don’t
    know how to approach a topic.


    Happy coding!'
