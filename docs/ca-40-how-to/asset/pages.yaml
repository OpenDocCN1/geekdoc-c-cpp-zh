    \ strip everything but the content.\n\n**Solution:** A common practice of analyzing\
    \ web data sources when they do not provide an API for structured access is to\
    \ scrape the web pages themselves. This is an imprecise process and prone to easy\
    \ breakage, but sometimes useful. One part of this process could be useful to\
    \ remove the HTML content, leaving just the text on the page. This could also\
    \ be useful in a simple web-indexing application. You can use regular expressions\
    \ to accomplish this (see Chapter 8, \"Regular Expressions,\" for more information):\n\
    \n```\nprivate string StripHtml(string source)\n{\n  string[] patterns = {\n \
    \   \"<(\\.|\\n)*?>\", //general HTML tags\n    \"<script>.*?</script>\" //script\
    \ tags\n  };\n  string stripped = \"\";\n  foreach (string pattern in patterns)\n\
    \  {\n    stripped = System.Text.RegularExpressions.Regex.Replace(stripped, pattern,\
    \ string.Empty);\n  }\n  return stripped;\n}\n```\n\n# ## Embed a Web Browser\
    \ in Your Application\n\n**Scenario/Problem:** You want to enable users to browse\
    \ the Internet (or an intranet site) directly in your application. Alternatively,\
    \ you just want to be able to render HTML with a standard browser rendering engine."
