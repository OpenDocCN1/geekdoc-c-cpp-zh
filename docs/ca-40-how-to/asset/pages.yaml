  md: '# Convert Colors Between RGB to HSV


    > Scenario/Problem: You want to give the user the option to specify colors in
    the natural HSV format.

    The RGB format that colors use in computers is extremely convenient—for computers.
    Not so much for humans, where HSV (hue, saturation, value) is more intuitive and
    easier to control.

    Most decent paint programs allow you to control color in either format, and you
    should give your users the same freedom.


    Solution: The science and math behind color and how to convert it is beyond the
    scope of this book. There are plenty of explanations on the Internet.


    The ColorConverter sample app, shown in Figure 17.2, puts this conversion code
    into a unity format that demonstrates some useful UI techniques. It uses LinearGradientBrushes
    generously to indicate the effect of changing each slider. The full code for this
    app is not presented in the book but is in the ColorConverter sample application
    in the accompanying source code for this chapter.


    ![](img/c237887cbbac0db0e18bd0eecbc77950_347_0.png)


    The system color picker gives you quick-and-easy access to a basic color-selection
    interface.'
