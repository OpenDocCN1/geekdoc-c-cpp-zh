    \ have to implement the algorithm yourself with direct manipulation of the bitmap.\n\
    \n# Create a Thumbnail of an Image\n\n**Scenario/Problem:** You want to quickly\
    \ generate a thumbnail of an image, possibly asynchronously (for use in a web\
