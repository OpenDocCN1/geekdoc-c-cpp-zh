  md: "# Implement a String Index\n\nUnlike regular arrays, however, you are not limited\
    \ to integer indices. You can use any type at all, most commonly strings, as in\
    \ this example:\n\n```\npublic double this[string dimension]\n{\n    get\n   \
    \ {\n        switch (dimension)\n        {\n            case \"x\":\n        \
    \    case \"X\": return _x;\n            case \"y\":\n            case \"Y\":\
    \ return _y;\n            case \"z\":\n            case \"Z\": return _z;\n  \
    \          default: throw new ArgumentOutOfRangeException(\"dimension\",\n   \
    \             \"Only dimensions X, Y, and Z are valid!\");\n        }\n    }\n\
    \    set\n    {\nn        switch (dimension)\n        {\n            case \"x\"\
    :\n            case \"X\": _x = value; break;\n            case \"y\":\n     \
    \       case \"Y\": _y = value; break;\n            case \"z\":\n            case\
    \ \"Z\": _z = value; break;\n            default: throw new ArgumentOutOfRangeException(\"\
    dimension\",\n                \"Only dimensions X, Y, and Z are valid!\");\n \
    \       }\n    }\n}\n```\n\nSample usage:\n\n```\nVertex3d v = new Vertex3d(1,\
    \ 2, 3);\nConsole.WriteLine(v[0]);\nConsole.WriteLine(v[\"Z\"]);\n```\n\nOutput:\n\
    \n1\n3"
