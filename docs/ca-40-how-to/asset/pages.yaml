  md: "# Use Entity Inheritance with LINQ\n\nThe Entity Framework allows you to specify\
    \ inheritance relationships within the data-tables. LINQ works seamlessly with\
    \ this feature:\n\n```\nvar textBooks = from book in bookContext.BookSet where\
    \ book is Textbook\n    select book as Textbook;\nforeach (var textbook in textbooks)\n\
    {\n    //load the author info\n    textbook.AuthorReference.Load();\n    Console.WriteLine(\"\
    {0}, {1} - {2} - {3}\",\n        textbook.Title, textbook.Author.FirstName,\n\
    \        textbook.Author.LastName, textbook.Subject);\n}\n```\n\n# Query a Web\
    \ Service (LINQ to Bing)\n\n> **Scenario/Problem:** You want to query a web service's\
    \ public API with LINQ.\n\n**Solution:** Out of the box, LINQ can query object\
    \ collections. SQL, entities, and XML. To expand its capabilities, you have a\
    \ choice: Implement a custom LINQ provider, or convert your target into one of\
    \ the current implementations.\n\nThe latter option is generally much easier to\
    \ implement and is shown in Listings 21.1 and 21.2. The Bing API is used to demonstrate\
    \ using LINQ to convert the XML to custom objects.\n\nLISTING 21.1 **Bing.cs**\n\
    \n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.Xml.Linq;\n\nnamespace LinqToBing\n{\n    class\
    \ SearchResult\n    {\n        public string Title { get; set; }\n        public\
    \ string Url { get; set; }\n        public string Description { get; set; }\n\
    \    }\n}\n```"
