    \ a Document\n\nScenario/Problem: You want to print from Silverlight to a printer\
    \ attached to the user's computer.\n\n**Solution:** Silverlight 4 now contains\
    \ printer support which you can easily take advantage of.\n\nRemember from Chapter\
    \ 17, “Graphics with Windows Forms and GDI+\\” that printing in .NET is similar\
    \ to drawing on the screen. In Silverlight, to print, all you need to generate\
    \ any UIElement-derived object and pass it to the printing system, as this code\
    \ demonstrates:\n\n```\nprivate void buttonPrint_Click(object sender, RoutedEventArgs\
    \ e)\n{\n    PrintDocument doc = new PrintDocument();\n    doc.PrintPage += new\
    \ EventHandler<PrintPageEventArgs>(doc.PrintPage);\n    doc.Print();\n}\n```\n\
    \n```\nvoid doc_PrintPage(object sender, PrintPageEventArgs e)\n{\n    //simply\
    \ set the PageVisual property to the UIElement\n    //that you want to print\n\
    \    e.PageVisual = canvas;\n    e.HasMorePages = false;\n}\n```\n\nThe PrintPage\
    \ event handler sets the PageVisual property to whatever you want to printed—it’s\
    \ as easy as that. See the full example, the SketchPad sample project in the accompanying\
    \ source code. This app lets you draw with the mouse and print the results."
