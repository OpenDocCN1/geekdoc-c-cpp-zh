  md: "# Give Types an Index\n\n**Scenario/Problem:** Your type has data values that\
    \ can be accessed by some kind of index, either numerical or string based.\n\n\
    **Solution:** You can index by any type. The most common index types are int and\
    \ string.\n\n# Implement a Numerical Index\n\nYou use the array access brackets\
    \ to define an index on the this object, like this sample.\n\n```\npublic double\
    \ this[int index]\n{\n    get {\n        switch (index) {\n            case 0:\
    \ return _x;\n            case 1: return _y;\n            case 2: return _z;\n\
    \            default: throw new ArgumentOutOfRangeException(\"index\",\n     \
    \           \"Only indexes 0-2 valid!\");\n        }\n    }\n    set {\n     \
    \   switch (index) {\n            case 0: _x = value; break;\n            case\
    \ 1: _y = value; break;\n            case 2: _z = value; break;\n            default:\
    \ throw new ArgumentOutOfRangeException(\"index\",\n                \"Only indexes\
    \ 0-2 valid!\");\n        }\n    }\n}\n```"
  merge: -1
  pgno: 52
