  md: "# 334 CHAPTER 17 Graphics with Windows Forms and GDI+\n\npublic static Color\
    \ HsvToRgb(int hue, int saturation, int value)\n{\n\n```\ndouble h = hue;\ndouble\
    \ s = saturation / 100.0;\ndouble v = value / 100.0;\n\ndouble r=0, g=0, b=0;\n\
    if (s == 0)\n{\n    // no saturation = gray\n    r = g = b = v;\n}\nelelse\n{\n\
    \    double sector = h / 60;\n    int sectorNumber = (int)Math.Floor(sector);\n\
    \    double sectorPart = sector - sectorNumber;\n```\n\n```\n//three axes of color\n\
    double p = v * (1 - s);\ndouble q = v * (1 - (s * sectorPart));\ndouble t = v\
    \ * (1 - (s * (1 - sectorPart)));\n\nwitch (sectorNumber)\n{\n    case 0://dominated\
    \ by red\n        r = v;\n        g = t;\n        b = p;\n        break;\n   \
    \ case 1://dominated by green\n        r = q;\n        g = v;\n        b = p;\n\
    \        break;\n    case 2:\n        r = p;\n        g = v;\n        b = t;\n\
    \        break;\n    case 3://dominated by blue\n        r = p;\n        g = q;\n\
    \        b = v;\n        break;\n```"
