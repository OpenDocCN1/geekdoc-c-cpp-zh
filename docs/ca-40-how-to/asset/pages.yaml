    \ memory so it can schedule collections better\n        //((note--still doesn't\
    \ change the amount\n        //that GC.GetTotalMemory returns)\n        GC.AddMemoryPressure(MemorySize);\n\
    \n    Int32* pI = (Int32*)_memory;\n    for (int i = 0; i < NumObjects; ++i)\n\
    \    }\n```"
