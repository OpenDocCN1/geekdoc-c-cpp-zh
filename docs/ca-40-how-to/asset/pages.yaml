    # Generate Better Random Numbers


    > Scenario/Problem: You need random numbers for anything related to security.


    Solution: The standard way to generate random numbers is with the System. Random
    class, which produces numbers that appear random, based on a seed value (the current
    time). Usage is shown here:


    ```

    Random rand = new Random();

    Int32 randomNumber = rand.Next();

    ```


    If you need an arbitrary number for noncryptographic purposes, this is perfectly
    fine. However, if you are doing anything security related, you should never use
    Random. Instead, use System.Security.Cryptography.

    RNGCryptoServiceProvider.System.Security.Cryptography.RNGCryptoServiceProvider();cryptRand
    = byte[] bytes = new byte[4];cryptRand.GetBytes(bytes);

    Int32 number = Converter.ToInt32(bytes, 0);


    > NOTE Both methods of generating random numbers are actually pseudorandom (that
    is, not random). Random numbers are based on some seed, or known data. Random
    uses a seed value (the current time), and RNGCryptoServiceProvider uses a combination
    of processor info, operating system counters, cycle counters, time, and other
    information to generate cryptographically secure bytes. True randomness can generally
    be achieved through more complicated phenomena (static noise, mouse movement,
    network traffic patterns, and so on).'
