  md: "# Define the ViewModel\n\nBecause we'll have multiple ViewModel classes in\
    \ this app, and they have some common functionality, let's define a base class:\n\
    \n```\nabstract class BaseViewModel : INotifyPropertyChanged\n{\n    private string\
    \ _displayName=\"Unknown\";\n\n    public string DisplayName\n    {\n        get\n\
    {\n            return _displayName;\n        }\n        set\n{\n            _displayName\
    \ = value;\n            OnPropertyChanged(\"DisplayName\");\n        }\n    }\n\
    \n    protected BaseViewModel(string displayName)\n    {\n        this.DisplayName\
    \ = displayName;\n    }\n}\n\n#region INotifyPropertyChanged Members\n\npublic\
    \ event PropertyChangedEventHandler PropertyChanged;\n\n#endregion\n\nprotected\
    \ void OnPropertyChanged(string propertyName)\n{\n    if (PropertyChanged != null)\n\
    \    {\n        PropertyChanged(this, new PropertyChangedEventArgs(propertyName));\n\
    \    }\n}\n\n```\n\nWPF uses the INotifyPropertyChanged interface to know when\
    \ to update views that are bound to these ViewModel objects."
