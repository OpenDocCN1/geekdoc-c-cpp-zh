    # Force a Garbage Collection\n\n+   Scenario/Problem: You think you need to force\
    \ a garbage collection.\n\nSolution: The short answer is, don't. You are unlikely\
    \ to outguess the garbage-collection system for efficiency. That said, if you\
    \ really know what you're doing and you're going to measure the effects, here's\
    \ how to do it:\n\nGC.Collect();\n\nOne reason why people force collection is\
    \ that they're beginning a performance-sensitive operation that they don't interrupted\
    \ by garbage collection. However, the garbage collection system in .NET 4 has\
    \ undergone major revision from previous versions and does more collections in\
    \ the background, so the need to forced collections should be lessened.\n\n# Create\
    \ a Cache That Still Allows Garbage Collection\n\n+   Scenario/Problem: You want\
    \ to cache objects (say, from a database) but still allow them to be garbage collected\
    \ when necessary.\n\nSolution: The problem is just holding a reference to an object\
    \ prevents it from being garbage collected. Enter WeakReference.\n\nThis simple\
    \ Cache uses WeakReference objects to store the actual values, allow-ing to be\
    \ garbage collected as needed.\n\n```\npublic class Cache<TKey, TValue> where\
    \ TValue:class\n{\n    //store WeakReference instead of TValue,\n    //so they\
    \ can be garbage collected\n```"
