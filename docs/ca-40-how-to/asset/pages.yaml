  md: "# 462 CHAPTER 21 LINQ\n\nLanguage Integrated Query, LINQ, is a flexible, SQL-like\
    \ query language designed to give the programmer consistent syntax to query any\
    \ data set, whether database, XML, or just plain objects. What's more, it's usable\
    \ from the comfort and safety of your everyday C# file.\n\n> NOTE LINQ is a language\
    \ that merely looks like SQL, and only superficially. If you're familiar with\
    \ SQL, you'll notice that the various parts of the query appear in a different\
    \ order than you're used to. LINQ is not directly related to actual database SQL\
    \ languages and is not a way of embedding actual SQL queries in your code. It\
    \ is a way of embedding generic queries in your code that may eventually turn\
    \ into database queries, LINQ can do much more.\n\n# Query an Object Collection\n\
    \n| Scenario/Problem: You want to query a collection for all objects meeting some\
    \ criteria. |\n\nSolution: LINQ and the following examples use some data objects\
    \ to demonstrate how LINQ works.\n\nclass Book\n\n```\n{\n    public string Title\
    \ { get; set; }\n    public int AuthorId { get; set; }\n    public int PublishYear\
    \ { get; set; }\n\n    public Book(string title, int authorID, int year)\n{\n\
    \        this.Title = title;\n        this.AuthorId = authorID;\n        this.PublishYear\
    \ = year;\n    }\n\n    public override string ToString()\n{\n        return string.Format(\"\
    {0} - {1}\", Title, PublishYear);\n    }\n}\n```\n\nclass Author\n\n```\n{\n \
    \   public int Id { get; set; }\n    public string FirstName { get; set; }\n}\n\
    ```"
