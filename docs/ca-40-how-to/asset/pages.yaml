  md: "# Use ListView Efficiently in Virtual Mode\n\n**Scenario/Problem:** Have you\
    \ ever tried to enter over a few thousand items into a ListView control? If so,\
    \ you know that it does not perform well. However, it is possible to efficiently\
    \ list over, say 100,000,000 items in a ListView without choking.\n\n**Solution:**\
    \ The key is to use ListView's virtual mode, which uses callbacks to retrieve\
    \ the data it needs to display.\n\nYou should use virtual mode intelligently to\
    \ avoid continually re-creating objects that the garbage collector will need to\
    \ clean up. For this, the following sample code sets up a simple caching system\
    \ where ListItem objects are reused when ListView needs to update which items\
    \ it is currently displaying:\n\n```\npublic class Form1 {\n    //our simple cache\
    \ of items\n    private List<ListItem> _listItemCache = new List<ListItem>();\n\
    \    //needed so can map the index in our cache\n    private int _topIndex = -1;\n\
    \n    public Form1() {\n        InitializeComponent();\n        listView.VirtualMode\
    \ = true;\n        listView.VirtualListSize = (int)numericUpDown1.Value;\n   \
    \     listView.CacheVirtualItemsEventHandler += CacheVirtualItemsEventHandler;\n\
    \        listView.RetrieveVirtualItem += RetrieveVirtualItemEventHandler;\n  \
    \  }\n    //called when the ListView is about to display a new row of items\n\
    \    void listView_CacheVirtualItems(object sender, CacheVirtualItemsEventArgs\
    \ e) {\n        _topIndex = e.StartIndex;\n        //find out if we need more\
    \ items\n        //(note we never make the list smaller--not very good cache)\n\
    \        int needed = (e.EndIndex - e.StartIndex) + 1;\n        if (_listItemCache.Capacity\
    \ < needed\n```"
