  md: "Figure 21.1 shows the Entity Framework diagram of an Author and Book table,\
    \ in addition to a Textbook table that is used later in this section.\n\n![](img/c237887cbbac0db0e18bd0eecbc77950_484_0.png)\n\
    \nFIGURE 21.1\n\nLINQ works well with the Entity Framework, and you should use\
    \ that rather than the deprecated LINQ to SQL when possible.\n\nThe LINQ code\
