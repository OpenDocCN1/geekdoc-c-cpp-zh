    # Store Session State


    Scenario/Problem: You must decide where users’ session information be stored,
    especially if the default of in-process will not work for you.


    This becomes a more important issue when your site is large enough to need multiple
    web servers or has enough users whose session information has significant memory
    requirements.


    Solution: Session state is configured in the machine.config file, which is located
    in the Config directory under the .NET runtime installation folder. On my machine,
    this is C:\Windows\Microsoft.NET\Framework\v4.0.21006\Config. Each web server
    must have the machine.config file configured with the correct session state settings.


    # Store State in the Process


    This is the default settings and does not need to be configured but to make explicit:


    ```

    <sessionState

    mode="InProc"

    cookeless="false"

    timeout="20" />

    ```


    The cookeless setting applies to any type of session state server and tells .NET
    whether cookies should be used to identify clients.


    The timeout setting is the number of minutes before a session is abandoned.


    # Store State on a State Server


    A state server is a machine running the aspnet_state.exe service, which you can
    find in the Services apps in the Administrative Tools folder.


    ```

    <sessionState

    mode="StateServer"

    connectionString="tcpip=127.0.0.1:42626"

    cookeless="false"

    timeout="20" />

    ```


    Just put the machine''s IP address in the stateConnectionString attribute.*'
