  md: '# 622 APPENDIX Essential Tools


    Over the years, every developer builds an essential suite of tools for designing,
    debugging, building, analyzing, testing, and otherwise manipulating code. This
    chapter is about just a few that I have found most useful. Consider these a starting
    point. Because URLs are prone to change over the years, I am omitting download
    links for these tools. You should be able to easily find them using your favorite
    search engine


    # Reflector


    Purpose: To browse and decompile any .NET assembly into source code.


    Originally developed by Lutz Roeder, Red Gate now maintains and furthers this
    handy little utility that destils .NET assemblies into source code (choice of
    C#, VB, IL, and more).


    I use this mostly as an educational tool for seeing what the . Framework library
    is doing internally. It''s generally a bad idea to rely on implementation details,
    but sometimes it''s nice to know what native API the Framework Framework uses—as
    an instructive example. Reflector is shown in Figure A.1.


    ![](img/c237887cbbac0db0e18bd0eecbc77950_638_0.png)


    FIGURE A.1 Reflector is a great educational tool for seeing how the Framework
    classes work.'
  merge: -1
  pgno: 638
