  md: "# Build a Download and Playback Progress Bar\n\n# # Build a Download and Playback\
    \ Progress Bar\n\n**Scenario/Problem:** You want to display a progress bar that\
    \ shows how much the video is buffered as well as the current playback position.\n\
    \n**Solution:** One thing every media content downloader needs a bar that shows\
    \ both download progress and playback position. Thankfully, Silverlight fully\
    \ supports the concept of custom controls. Listing 20.3 shows the XAML, and Listing\
    \ 20.4 shows the code-behind for this.\n\nLISTING 20.3 PlayDownloadProgressControl.xaml\n\
    \n```\n<UserControl x:Name=\"VideoPlayer.PlayDownloadProgressControl\"\nxmlns=\"\
    http://schemas.microsoft.com/winfx/2006/xml/presentation\"\nxmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\
    \nWidth=\"400\" Height=\"300\">\n  <Canvas x:Name=\"LayoutRoot\" Background=\"\
    White\">\n    <Line x:Name=\"DownloadProgress\" X1=\"0\" Y1=\"0\"\n      X2=\"\
    0\" Y2=\"0\" Stroke=\"DarkGray\"\n      Canvas.Left=\"0\" Canvas.Top=\"2\" StrokeThickness=\"\
    3\"/>\n    <Line x:Name=\"PlaybackProgress\" X1=\"0\" Y1=\"0\"\n      X2=\"0\"\
    \ Y2=\"0\" Stroke=\"DarkGreen\"\n      Canvas.Left=\"0\" Canvas.Top=\"2\" StrokeThickness=\"\
    3\"/>\n  </Canvas>\n</UserControl>\n```\n\nLISTING 20.4 PlayDownloadProgressControl.xaml.cs\n\
    \n```\nusing System;\nusing System.Net;\nusing System.Windows;\nusing System.Windows.Controls;\n\
    \nnamespace VideoPlayer\n{\n  public partial class PlayDownloadProgressControl\
    \ : UserControl\n  {\n    public PlayDownloadProgressControl()\n    {\n      InitializeComponent();\n\
    \    }\n  }\n```"
