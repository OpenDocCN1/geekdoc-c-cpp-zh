    \n# Call Native Windows Functions Using P/Invoke\n\n+   Scenario/Problem: You\
    \ want to call native Win32 API functions from .NET.\n\nSolution: Use P/Invoke,\
    \ which is shorthand for Platform Invocation Services. It allows you to call native\
    \ code directly from .NET. You've already seen some examples throughout the book\
    \ we need to supplement .NET's functionality with that OS.\n\nUsing P/Invoke involves\
    \ defining any structures you will need in .NET and then adding an import reference\
    \ to the function you want to call, potentially mapping each argument to equivalent\
    \ types.\nHere's an example of the declaration for the SendMessage function:\n\
    \n```\n[DllImport(\"User32.dll\")\npublic static extern IntPtr SendMessage(HandleRef\
    \ hWnd,\n    UInt32 Msg, IntPtr wParam,\n    IntPtr lParam);\n```\n\nTo call this,\
    \ you would write the following:\nSendMessage(new HandleRef(this, this.Handle),\
    \ MESSAGE_NUMBER,\n    new IntPtr(0), new IntPtr(1));\n\nA more sophisticated\
    \ example is when you need the API function to fill in a structure:\n[StructLayout(LayoutKind.Sequential)]\n\
    struct SYSTEM_INFO\n{\n\n```\npublic ushort wProcessorArchitecture;\npublic ushort\
    \ wReserved;\npublic uint dwPageSize;\npublic IntPtr lpMinimumApplicationAddress;\n\
    public IntPtr lpMaximumApplicationAddress;\npublic UInt dwActiveProcessorMask;\n\
    public uint dwNumberOfProcessors;\n```"
