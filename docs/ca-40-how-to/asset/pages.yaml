    \ sender, PropertyChangedEventArgs e)\n{\n    //do something when data changes\n\
    }\n```\n\n# # Overload Appropriate Operators\n\nScenario/Problem: You want to\
    \ define what the +, *, ==, and != operators do when called on your type.\n\n\
    Solution: Operator overloading is like sugar: a little is sweet, but a lot will\
    \ make you sick. Ensure that you only use this technique for situations that make\
    \ sense.\n\n# ## Implement operator +\n\nNotice that the method is public static\
    \ and takes both operators as arguments.\n\npublic static Vertex3d operator+(Vertex3d\
    \ a, Vertex3d b)\n{\n    return new Vertex3d(a.X + b.X, a.Y + b.Y, a.Z + b.Z);\n\
    }\n\nThe same principal can be applied to the -, *, %, &, |, <<, >>, !, ~, +,\
    \ and -- operators as well.\n\n# ## Implement operator == and != !\n\nThese should\
    \ always be implemented as a pair. Because we've already implemented a useful\
    \ Equals() method, just call that instead.\n\n```\npublic static bool operator\
    \ ==(Vertex3d a, Vertex3d b)\n{\n    return a.Equals(b);\n}\n```\n\n```\npublic\
    \ static bool operator !==(Vertex3d a, Vertex3d b)\n{}\n```"
