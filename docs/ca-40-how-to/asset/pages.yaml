    \ HorizTiltWheelDemo project in the accompanying sample source code for all the\
    \ code.\n\n# Cut and Paste\n\n|Scenario/Problem: You need to place items on the\
    \ clipboard.\n\nSolution: There is a simple way and a simpler way to do this,\
    \ depending on your requirements—if you need to put multiple formats to the clipboard\
    \ simultaneously or if only one will do. I'll cover each method in the following\
    \ sections, as well as how to put your custom objects on the clipboard.\n\n# Cut\
    \ and Paste as a Single Data Type\n\nThe naive way to cut and paste is to simply\
    \ use the methods.SetText(). Clipboard.SetImage(), and so on.\n\n```\n//puts the\
