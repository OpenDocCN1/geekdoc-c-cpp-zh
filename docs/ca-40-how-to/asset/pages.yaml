  md: "```\npublic class Vertex3d\n{\n    public static Vertex3d Add(Vertex3d a, Vertex3d\
    \ b)\n    {\n        Vertex3d result = new Vertex3d();\n        result.X = a.X\
    \ + b.X;\n        result.Y = a.Y + b.Y;\n        result.Z = a.Z + b.Z;\n     \
    \   return result;\n    }\n}\n```\n\nThe static method is called like in this\
    \ example:\nVertex3d a = new Vertex3d(0,0,1);\nVertex3d b = new Vertex3d(1,0,1);\n\
    Vertex3d sum = Vertex3d.Add(a, b);\n\n# Add a Constructor\n\n| Scenario/Problem:\
    \ You need to have automatic initialization of new objects of the class |\n\n\
    Solution: Define a special method, called a constructor, with the same name as\
    \ the class, with no return type. A constructor runs when a type is created—it\
    \ is never called directly.\n\nHere are two constructors for the Vertex3d class—one\
    \ taking arguments, the other performing some default initialization.\n\n```\n\
    Vertex3d\n{\n    public Vertex3d()\n    {\n        _x = _y = _z = 0.0;\n    }\n\
    \n    public Vertex3d(double x, double y, double z)\n    {\n        this._x =\
    \ x;\n        this._y = y;\n        this._z = z;\n    }\n}\n```"
