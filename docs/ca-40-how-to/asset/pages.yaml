    \n**Solution:** Use Image's GetThumbnailImage method.\n\nThis sample code figures\
    \ out what the correct proportional size should be, given a maximum size:\n\n\
    ```\nstatic void Main(string[] args)\n{\n    /* Parse arguments ... */\n    int\
    \ maxSize = 100;\n    string outputFile = @\"C:\\output_thumb.bmp\";\n    try\n\
