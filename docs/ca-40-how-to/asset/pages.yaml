    ```\n\n> **NOTE** Because Monitor.Enter() and Monitor.Exit() take any object for\
    \ the lock, you might be tempted to pass this to the methods. In a sense you're\
    \ right—but However, this ends up being a bad idea because you can't control who\
    \ locks on your object. Instead, the best practice is just to create a private\
    \ dummy object in your class to serve as an explicit lock object.\n\nThere is\
    \ a shortcoming to the preceding code. What if an exception is thrown between\
    \ Enter and Exit? That value will be inaccessible until the process exits. The\
