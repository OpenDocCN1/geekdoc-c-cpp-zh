  md: "# Stop Subscription to an Event\n\n> Scenario/Problem: You no longer want to\
    \ listen to an event that you've previously subscribed.\n\nSolution: Use the -\
    \ = syntax to remove your event handler. Here's an example:\n\n```\nbutton1.Click\
    \ -= new EventHandler(button1_Click);\n```\n\n# Publish an Event\n\n> Scenario/Problem:\
    \ You want to notify external components of changes in your class.\n\nSolution:\
    \ Create an event in your class that anyone else can subscribe to. You should\
    \ follow the established event-raising pattern established in the .NET Framework,\
    \ as demonstrated in the following example.\n\nThis example simulates the loading\
