    \ You need to force an object to remain in its memory location, especially for\
    \ interop with native code.\n\nThe garbage collector runs, it moves around in\
    \ memory a compaction process. This requires fixing up all the memory addresses\
    \ for the moved objects. Obviously, this is not possible for objects the GC does\
    \ not know about—such as in a native code interop situation."
