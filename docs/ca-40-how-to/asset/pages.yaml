  md: '# CHAPTER 20 Silverlight


    In some ways, Silverlight is Microsoft''s answer to Adobe Flash. More accurately,
    it''s a way of getting .NET and WPF into users'' browsers in an easily deployable
    format. Silverlight is essentially a web-deployed application that runs on the
    end user''s computer.


    Silverlight 1.0 was essentially a glorified media player. The only programming
    language it supported was JavaScript.


    Silverlight 2 added a small version of the .NET Framework, more controls, a subset
    of WPF, and more data-access options. It was more programmable with any supported
    .NET language.


    Silverlight 3 added more controls, more video and audio decoding options, more
    3D support, more graphics hardware acceleration, and other improvements.


    Silverlight 4 (in beta at the time of this writing) adds printing, even more controls,
    localization enhancements, web cam can support, drag and drop, for multitouch
    interfaces, and more.


    This chapter demonstrates creating a Silverlight application and shows how to
    take advantage of new features in Silverlight 3 and 4.


    # Create a Silverlight Project


    > Scenario/Problem: Create a new Silverlight project.


    Solution: As with all .NET code, you can use the SDKs alone with your text editor
    of choose to create Silverlight applications. For most of us, Visual Studio is
    usually the tool of choice. Use Visual Studio for Silverlight projects, you need
    to install the Silverlight 4 Beta Tools for Visual Studio, available from http://silverlight.net/getstarted/silverlight-4-beta/.


    Once this is installed, you can follow these steps to create a basic Silverlight
    application:


    +   1. In the Visual Studio menu, go to File, New, Project.


    +   2. Find Silverlight in the project type tree.


    +   3. Select Silverlight Application.


    +   4. Select the appropriate options in the New Silverlight Application dialog
    box, shown in Figure 20.1. A Silverlight project must be hosted in a website,
    and this dialog box allows you to select which existing web project to associate
    it with (or you can create a new).


    +   5. Click OK, and Visual Studio generates two projects for you, named ApplicationName
    and ApplicationName.Web by default.'
