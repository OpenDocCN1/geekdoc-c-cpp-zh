  md: "64 CHAPTER 4 Exceptions\n\nExceptions are .NET's primary mechanism for communicating\
    \ error conditions.\nExceptions have great power, but with great power comes great\
    \ responsibility. Like anything, exceptions can be abused, but that is no excuse\
    \ to underuse them.\n\nCompared to returning error codes, exceptions offer numerous\
    \ advantages, such as being able to jump up many frames in a call stack and including\
    \ as much information as you want.\n\n# Throw an Exception\n\nScenario/Problem:\
    \ You need to indicate an unrecoverable error from an exceptional situation. In\
    \ this case, unrecoverable means unrecoverable at this level in the code. It's\
    \ possible something higher can handle it.\n\nSolution: Use the throw syntax while\
    \ creating the exception.\n\n```\nprivate void DoSomething(string value)\n{\n\
    \    if (string.IsNullOrEmpty(value))\n    {\n        throw new ArgumentException(\"\
    value\",\n            \"parameter value cannot be null\");\n    }\n    ...\\n}\n\
    ```\n\n# Catch an Exception\n\nScenario/Problem: You must handle an exception\
    \ that was thrown.\n\nSolution: Wrap the code that could potentially throw an\
    \ exception inside a try { } followed by a catch { }.\n\n```\ntry\n{\n    DoSomething(null);\n\
    }\ncatch (ArgumentException ex)\n{\n    Console.WriteLine(\"Exception: \" + ex.Message);\n\
    }\n```"
