    {\n    pI[i] = 13;\n}\n```\n\n> NOTE You should keep memory fixed only long as\
    \ you absolutely need to. While memory is fixed in place, the GC is less efficient\
    \ as it attempts to work around the unmovable block.\n\n# Allocate Unmanaged Memory\n\
    \n+   Scenario/Problem: You need a buffer of memory that unmanaged code can access\
    \ and you don't want the GC involved at all.\n\nSolution: Use the Marshal.AllocHGlobal()\
    \ method and manually add some memory pressure.\n\n```\nunsafe class MyDataClass\n\
    {\n    IntPtr _memory = IntPtr.Zero;\n\n    public int NumObjects { get; private\
    \ set; }\n    public int MemorySize { get; return sizeof(Int32) * NumObjects;\
    \ }\n\n    public MyDataClass(int numObjects)\n    {\n        this.NumObjects\
    \ = numObjects;\n\n        _memory = Marshal.AllocHGlobal(MemorySize);\n     \
