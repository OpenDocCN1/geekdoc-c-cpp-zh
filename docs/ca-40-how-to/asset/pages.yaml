    public const int MK_LBUTTON = 0x00001

    public const int MK_RBUTTON = 0x00002

    public const int MK_SHIFT = 0x00004

    public const int MK_CONTROL = 0x00008

    public const int MK_MBUTTON = 0x00010

    public const int MK_XBUTTON1 = 0x00020

    public const int MK_XBUTTON2 = 0x00040


    public const int WHEEL_DELTA = 120;

    ```


    ```

    //(Vista or Server 2008 and up required!)

    public const int SPI_GETWHEELSCROLLCHARS = 0x0066C;

    ```


    ```

    class TiltAwarePanel : Panel

    ```


    ```

