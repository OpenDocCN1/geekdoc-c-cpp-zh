  md: "# Make Types Hashable with GetHashCode()\n\n**Scenario/Problem:** You want\
    \ to use your class as the key part in a collection that indexes values by unique\
    \ keys. To do this, your class must be able to convert the \"essence\" of its\
    \ values into a semi-unique integer ID.\n\n**Solution:** You always want to override\
    \ GetHashCode(), especially with value types, for performance reasons. Generating\
    \ a hash value is generally done by somehow distributing the values in your class\
    \ to an integer representation that is different for every value your class can\
    \ have. You should override GetHashCode() whenever you override Equals().\n\n\
    ```\npublic override int GetHashCode()\n{\n    // Note: This is just a sample\
    \ hash algorithm.\n    // picking a good algorithm can require some\n    // research\
    \ and experimentation\n    return ((int)_x ^ (int)_z << 16) |\n           ((int)_y\
    \ & 0x000FFFF);\n}\n```\n\n> NOTE Hash codes are not supposed to be unique for\
    \ every possible set of values your type can have. This is actually impossible,\
    \ as you can deduce from the previous code sample. For this reason, comparing\
    \ hash values is not a good way to compute equality.\n\n# Make Types Sortable\n\
    \n**Scenario/Problem:** Objects of your type will be sorted in a collection or\
    \ otherwise compared to each other.\n\n**Solution:** Because you don't know how\
    \ your type will be used, making the objects sortable is highly recommended whenever\
    \ possible.\n\nIn the Vector3d class example, in order to make the objects comparable,\
    \ we'll add an _id field and implement the IComparable<Vertex3d> interface.\n\n\
    The _id field will be what determines the order (it doesn't make much sense to\
    \ sort on coordinates, generally)."
