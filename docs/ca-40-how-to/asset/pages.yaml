- img_proc: true
  md: "If the class does not specify the accessibility, it defaults to internal.\n\
    \n# Define Fields, Properties, and Methods\n\n**Scenario/Problem:** You need to\
    \ add fields, properties, and methods to a class definition.\n\n**Solution:**\
    \ Let's add some usefulness to the Vertex3d class.\n\n```\npublic class Vertex3d\n\
    {\n    //fields\n    private double _x;\n    private double _y;\n    private double\
    \ _z;\n    //properties\n    public double X\n    {\n        get { return _x;\
    \ }\n        set { _x = value; }\n    }\n    public double Y\n    {\n        get\
    \ { return _y; }\n        set { _y = value; }\n    }\n    public double Z\n  \
    \  {\n        get { return _z; }\n        set { _z = value; }\n    }\n    //method\n\
    \    public void SetToOrigin()\n    {\n        X = Y = Z = 0.0;\n    }\n}\n```\n\
    \nSome notes on the preceding code:\n\n+   - The fields are all declared private,\
    \ which is good practice in general.\n- The properties are declared public, but\
    \ could also be private, protected, or protected internal, as desired."
