    MyCDll.dll\", ExactSpelling=false,\nCallingConvention=CallingConvention.Cdecl,\
    \ EntryPoint=\"SayHello\")\npublic static int SayHello(\n[MarshalAs(UnmanagedType.LPArray)]\
