  md: "# Create a Simple AJAX Page\n\nScenario/Problem: You want to allow rich interaction\
    \ and send data to and from the web server without a full page refresh.\n\nIn\
    \ the last few years, Asynchronous Javascript and XML (AJAX) has become the facto\
    \ standard for defining rich (well, richer than plain HTML) interaction on modern\
    \ websites. AJAX allows you to update part of a web page without forcing a full\
    \ refresh (and, incidentally, scrolling the page to the top).\n\nSolution: Taking\
    \ advantage of AJAX is easy with the built-in UpdatePanel control. Controls placed\
    \ in an UpdatePanel automatically update themselves asynchronously using the same\
    \ style you're already used to.\n\nThe AJAX demo in Listings 19.11 and 19.12 shows\
    \ two examples: a typical update to a button and a timer that causes a regular\
    \ refresh of content. Figure 19.9 shows the demo in action\n\nLISTING 19.11 AJAX\
    \ Demo—Default.aspx\n\n```\n<@ Language=\"C#\" AutoEventWireup=\"true\"\nCodeBehind=\"\
    Default.aspx.cs\"\nInherits=\"AJAXDemo.Default\" %>\n\n<!DOCTYPE html PUBLIC \"\
    //W3C//DTD HTML 1.0 Transitional//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
    >\n\n<html xmlns=\"http://www.w3.org/1999/xhtml\" >\n<head runat=\"server\">\n\
    \    <title>AJAX Demo</title>\n</head>\n<body>\n    <form id=\"form1\" runat=\"\
    server\">\n    <asp:ScriptManager ID=\"ScriptManager1\" runat=\"server\" />\n\
    \    <div>\n        <asp:UpdatePanel ID=\"UpdatePanel1\" runat=\"server\">\n \
    \           <ContentTemplate>\n                <asp:TextBox ID=\"TextBoxValue\"\
    \ runat=\"server\" ReadOnly=\"True\"@></asp:TextBox>\n                <br />\n\
    \                <asp:Button ID=\"ButtonIncrement\" runat=\"server\" Text=\"Increment\"\
    \ onclick=\"ButtonIncrement_Click\" />\n            </ContentTemplate>\n     \
    \   </asp:UpdatePanel>\n    </div>\n    </form>\n```"
