  md: "To convert from Vertex3d to Vertex3i then, you would do the following:\n\n\
    ```\nVertex3d vd = new Vertex3d(1.5, 2.5, 3.5);\nVertex3i vi = (Vertex3i)vd;\n\
    ```\n\nIf you tried it with the cast, you would get the following:\n//Vertex3i\
    \ vi = vd;\nError: Cannot implicitly convert type 'Vertex3d' to 'Vertex3i'.\n\
    An explicit conversion exists (are you missing a cast?)\n\n# Implicit Conversion\
    \ (No Loss of Precision)\n\nIf there will be no loss in precision, the conversion\
    \ can be implicit, meaning the compiler will allow you to assign the type with\
    \ no explicit conversion. We can implement this type of conversion in the Vertex3i\
    \ class because it can convert up to a double with no loss of precision.\n\n```\n\
    public static implicit operator Vertex3d(Vertex3i vertex)\n{\n    return new Vertex3d(vertex._x,\
    \ vertex._y, vertex._z);\n}\n```\n\nWe can now assign without casting:\n\nVertex3i\
    \ vi = new Vertex3i(1, 2, 3);\nVertex3d vd = vi;\n\n# Prevent Inheritance\n\n\
    Scenario/Problem: You want to prevent users of your class from inheriting from\
    \ it.\n\nSolution: Mark the class as sealed.\n\n```\nsealed class MyClass\n{\n\
    \    ...\n}\n```\n\nStructs are inherently sealed."
