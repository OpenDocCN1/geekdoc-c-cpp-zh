  md: "This example uses the same LesMis.xml file from Chapter 14's XPath discussion.\n\
    output is as follows:\n\nChapters with 'he':nWhat he believed\nWhat he thought\n\
    \n# Create XML\n\nScenario/Problem: You need to easily generate XML in a quick,\
    \ hierarchical way.\n\nSolution: Although LINQ can of course load and query XML\
    \ generated from your source, it also provides very easy XML-creation mechanisms.\n\
    \n```\nXElement xml = new XElement(\"Books\",\n    new XElement(\"Book\",\n  \
    \      new XAttribute(\"year\",1856),\n        new XElement(\"Title\", \"Les Contemplations\"\
    ),\n    new XElement(\"Book\",\n        new XAttribute(\"year\", 1843),\n    \
    \    new XElement(\"Title\", \"Les Burgraves\")\n);\n```\n\nThe preceding creates\
    \ the following XML fragment:\n\n```\n<Books>\n  <Book year=\"1856\">\n    <Title>Les\
    \ Contemplations</Title>\n  </Book>\n  <Book year=\"1843\">\n    <Title>Les Burgraves</Title>\n\
    \  </Book>\n</Books>\n```\n\n# Query the Entity Framework\n\nScenario/Problem:\
    \ You need to query a database.\n\nSolution: Although there is such a thing as\
    \ LINQ to SQL, LINQ only works with SQL Server, and it has been more or less deprecated\
    \ by Microsoft. The recommendation is to use LINQ to Entity Framework, so that\
    \ is what will be discussed here."
