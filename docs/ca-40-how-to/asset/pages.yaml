  md: "public MyDerivedClass : MyClass\n{\n...\n}\nMyClass myClass = new MyClass();\
    \ //not allowed!\nMyClass myClass = new MyDerivedClass(); //this is ok\n\nYou\
    \ can also make individual methods inside a class as abstract to giving them any\
    \ default implementation, as shown here:\n\n```\npublic abstract MyClass\n{\n\
    \    public abstract void DoSomething();\n}\nMyClass myClass = new MyClass();//not\
    \ allowed!\n```\n\n# Interface or Abstract Base Class?\n\nWhen designing hierarchies,\
    \ you often need to decide whether classes at the root of the hierarchy (the parent\
    \ classes) should be abstract base classes, or whether to implement the concrete\
    \ classes in types of interfaces.\nHere are some guidelines to help make this\
    \ decision.\n\nIn favor of interfaces:\n\n+   - Will classes need to implement\
    \ multiple base classes? This isn't possible in C#, but it is possible to implement\
    \ multiple interfaces.\n- Have you separated concerns to the point where you understand\
    \ the difference between what your class is and what it does? Interfaces are often\
    \ about what the class does, whereas a base class can anchor what it is.\n- Interfaces\
    \ are often independent of what a class is and can be used in many situations.\
    \ They can be added to the class without concern for what it is.\n- Interfaces\
    \ allow a very loosely coupled design.\n\nIn favor of base classes:\n\n+   - Is\
    \ there reasonable common functionality or data for all derived types? An abstract\
    \ base class may be useful.\n- Implementing the same interface over many types\
    \ can lead to a lot of repetition of code, whereas an abstract base class can\
    \ group common code into a single implementation."
