- img_proc: true
  md: "# (Almost) Guarantee Execution with finally\n\nStack trace from rethrow (stack\
    \ preservation):\nat Rethrow.Program.DoSomething() in Program.cs:line 39\nat Rethrow.Program.RethrowWithPreservation()\
    \ in Program.cs:line 65\nat Rethrow.Program.Main(String[]) args in Program.cs:line\
    \ 26\n\nYou can see that the first stack trace has the original source of the\
    \ problem (DoSomething), while the second has preserved it.\n\n> NOTE Be smart\
    \ about when to intercept an exception. For example, you don't usually want to\
    \ log an exception and then rethrow at multiple levels, causing the same error\
    \ to be logged over and over again. Often, logging should be handled at the highest\
    \ level. Also, beware of the trap of habitually handling exceptions at too low\
    \ of a level. If you can't do something intelligent about, just let a higher level\
    \ worry about it.\n\n# (Almost) Guarantee Execution with finally\n\nScenario/Problem:\
    \ You need to guarantee that resources are cleaned up, even when exceptions occur.\
    \ When using objects that encapsulate external resources (such as database connections\
    \ or files), you want to ensure that you release the resources when you're done.\
