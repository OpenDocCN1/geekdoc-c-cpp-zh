  md: "# Separate Look from Functionality\n\n> NOTE WPF elements use RoutedEvents,\
    \ which are regular .NET events with a bunch of features added onto them. They\
    \ are required because WPF elements can have many layers of embedding. For example,\
    \ if you embedded a StackPanel, a TextBlock, and an Image inside a button and\
    \ you click on the image, you still want it to seem to your application like a\
    \ button was clicked, not the image.\n\nRoutedEvents come in a few flavors: direct,\
    \ bubbling, and tunneling.\n\nDirect events are similar to .NET events: the source\
    \ element itself can call event handlers.\n\nBubbling events are the most common\
    \ in the WPF UI. The event starts with the source element and \"bubbles\" up to\
    \ its parent, and its parent, and so on.\n\nTunneling events start at the element\
    \ root and travel downward to the source element.\n\n# Separate Look from Functionality\n\
    \n+   Scenario/Problem: You want to separate the look of a control from what it\
    \ does and be able to change the look independently.\n\nSolution: The Web introduced\
    \ the concept of separating visual style from functionality to many developers.\
    \ WPF uses the same idea with its powerful system style.\n\nStyles are resources\
    \ that can be defined in dedicated resource files or in an element's own resource\
    \ section.\n\n```\n<Window x:Class=\"ImageView.Window1\">\n...\n  <Window.Resources>\n\
    \    <Style TargetType=\"{x:Type Label}\">\n      <Setter Property=\"FontSize\"\
    \ Value=\"12.0\" />\n    </Style>\n  </Window.Resources>\n...\n</Window>\n```\n\
    \nThis simple style merely sets the FontSize property of a Label to 12.\n\n> NOTE\
    \ Because the Style in this example specifies a TargetType but does not specify\
    \ a name, it applies to all Label elements in its scope. You could alternatively\
    \ name the style with <Style x:Key=\"MyStyle\" ... /> and apply it to a specific\
    \ Label with <Label Style=\"StaticResource MyStyle\" ... />."
  merge: -1
  pgno: 393
- img_proc: true
  md: "# Use Triggers to Change Styles at Runtime\n\n> Scenario/Problem: You want\
    \ events in the UI to cause an element's style to change at runtime.\n\n**Solution:**\
    \ Triggers are a powerful functionality that can cause certain things to happen\
    \ when events occur or data changes. They can be used in particular with styles\
    \ to cause visual changes in response to the user's input.\n\nThis example modifies\
    \ the same Label style as before change the look when the user houses the mouse\
    \ over it (see Figure 18.4).\n\n```\n<Window x:Class=\"*ImageView.Window\">\n\
    \  <Window.Resources>\n    <Style TargetType=\"x:Type Label\">\n      <Setter\
    \ Property=\"FontSize\" Value=\"12.0\" />\n      <Style.Triggers>\n        <Trigger\
    \ Property=\"IsMouseOver\" Value=\"True\">\n          <Setter Property=\"Label.FontWeight\"\
    \ Value=\"Bold\" />\n          <Setter Property=\"Label.FontSize\" Value=\"14.0\"\
    \ />\n          <Setter Property=\"Label.Background\" Value=\"LightBlue\" />\n\
    \        </Trigger>\n      </Style.Triggers>\n    </Style>\n  </Window.Resources>\n\
    </Window>\n```\n\n![](img/c237887cbbac0db0e18bd0eecbc77950_394_0.png)\n\nYou can\
    \ use triggers to cause visual changes to appear in response to user actions."
  merge: -1
  pgno: 394
