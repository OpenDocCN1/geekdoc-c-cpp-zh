  md: "# Rethrow an Exception\n\nScenario/Problem: You need to handle an exception\
    \ at one level (logging it or changing program behavior, for example) and then\
    \ pass it up for higher-level code to handle.\n\nSolution: There are two ways\
    \ to do this, and the difference is important.\n\nThe naive (that is, usually\
    \ wrong) way is:\n\n```\ntry {\n  DoSomething();\n} catch (ArgumentNullException\
    \ ex) {\n  LogException(ex);\n  // probably wrong way to do this\n  throw ex;//\
    \ rethrow it for higher up\n}\n```\n\nWhat's wrong with this? Whenever an exception\
    \ is thrown, the current stack location is saved to the exception (see later in\
    \ this chapter). When you rethrow like this, you replace the stack location that\
    \ was originally in the exception with the one from this catch block—probably\
    \ not what you wanted, and a stumbling block during debugging. If you want to\
    \ rethrow while preserving the original stack trace call, throw without the exception\
    \ variable.\n\n```\ntry {\n  DoSomething();\n} catch (ArgumentNullException ex)\
    \ {\n  LogException(ex);\n  throw //rethrow it for higher up, preserve the stack\n\
    }\n```\n\nHere's the difference in a sample program:\n\nStack trace from rethrow\
    \ (no stack preservation):\nat Rethrow.Program.RethrowWithNoPreservation() in\
    \ Program.cs:line 52\nat Rethrow.Program.Main(String[]) args in Program.cs:line\
    \ 14"
  merge: -1
