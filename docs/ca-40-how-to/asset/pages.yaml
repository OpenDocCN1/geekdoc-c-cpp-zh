    kernel32.dll\")\nstatic extern void GetSystemInfo(ref SYSTEM_INFO lpSystemInfo);\n\
    ```\n\nA question that often arises is how to translate between various string\
    \ representations. Windows uses C-style, NULL-terminated strings, whereas .NET\
    \ uses the String object. The next section demonstrates how to do this.\n\n# Call\
    \ C Functions in a DLL from C#\n\n| Scenario/Problem: You need to call a C-style\
    \ function located in a DLL from C.# |\n\nSolution: P/Invoke is most commonly\
