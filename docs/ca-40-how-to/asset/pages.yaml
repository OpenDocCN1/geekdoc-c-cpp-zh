  md: '# Take Advantage of Horizontal Wheel Tilt


    **Scenario/Problem:** Most mice these days come with a scroll wheel, which is
    fairly well supported by most controls. Some mice, however, also come with a horizontal
    "tilt" capability. The support for this is a little spotty. If you have a form
    with automatic scrollbars, but the mouse scrolling and tilt scrolling will work
    fine. If you instead want scrolling in a custom control, you''ll find the horizontal
    scrolling isn''t there.


    **Solution:** This support could be added in future versions of .NET, but until
    then, here is an example of how to achieve this functionality in a control derived
    from Panel by taking some of the underlying Win32 processing:


    ```

    abstract class Win32Messages

    ```


    ```

