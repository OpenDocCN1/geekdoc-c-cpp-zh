  md: "Whenever you create your own classes, you need to consider the circumstances\
    \ under which they could be used. For example, two instances of your Item struct\
    \ ever be compared for equality? Will your Person class need to be serializable,\
    \ or sortable?\n\n> NOTE Versatility means being able to do many things well.\
    \ When you're creating your own types, it means outfitting your objects with enough\
    \ \"extra\" stuff that they can easily be used in a wide variety of situations.\n\
    \nThis chapter is all about making your own objects useful and versatile as possible.\
    \ In many cases, this means implementing the standard interfaces .NET provides\
    \ or simply overriding base class methods.\n\n# Format a Type with ToString()\n\
    \nScenario/Problem: You need to provide a string representation of an object for\
    \ output and debugging purposes.\n\nSolution: By default, ToString() will display\
    \ the type's name. To show your own values, you must override the method with\
    \ one of your own. To illustrate this, let's continue our Vertex3d class example\
    \ from the previous chapter.\n\nAssume the class initially looks like this:\n\n\
    ```\nstruct Vertex3d\n{\n    private double _x;\n    private double _y;\n    private\
    \ double _z;\n\n    public double X\n    {\n        get { return _x; }\n     \
    \   set { _x = value; }\n    }\n\n    public double Y\n    {\n        get { return\
    \ _y; }\n        set { _y = value; }\n    }\n}\n```"
