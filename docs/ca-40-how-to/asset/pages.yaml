  md: "# Automatically Map Data to Objects with the Entity Framework\n\n# Automatically\
    \ Map Data to Objects with the Entity Framework\n\nScenario/Problem: You want\
    \ to access database data through .NET objects with having to create your own\
    \ data object library.\n\nSolution: Use the Entity Framework to automatically\
    \ map database tables and their relationships to objects you can use in C# code.\n\
    \nThe Entity Framework is Microsoft's Object-Relational Mapping library and is\
    \ fully integrated with Visual Studio.\n\nTo create an object for the Books introduced\
    \ earlier in this chapter, follow these steps:\n\n+   1. Right-click your project,\
    \ select Add, New Item.\n2. Select ADO.NET Entity Data Model and give it the name\
    \ Books.edmx. Click Add.\n3. In the Entity Data Model Wizard that comes up, select\
    \ “Generate From Database” and click Next.\n4. Select the database, from the drop-down\
    \ list.\n5. For the value under “Save entity connection settings in App.Config\
    \ as:” type BookEntities.\n6. Click Next.\n7. Check the Books table.\n8. Set the\
    \ Model Namespace to “BookModel” and click Finish.\n\nThis will create the Book\
    \ and BookEntities object for you. The following sections will demonstrate how\
    \ to use them.\n\n# Get a List of All Entities\n\nThe BookEntities represents\
    \ the interface to the collection. The following code prints out all values in\
    \ the table via the entity collection:\n\n```\n//get a list of all entities\n\
    BookEntities entities = new BookEntities();\nforeach (var book in entities.Books)\n\
    {\n    Console.WriteLine(\"{0}, {1}\", book.ID, book.Title, book.PublishYear);\n\
    }\n```"
