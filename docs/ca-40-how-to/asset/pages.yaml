  md: "# NUnit\n\nPurpose: Unit-testing framework and harness.\n\nWhether you use\
    \ test-driven development or not, having a solid set of unit tests can give you\
    \ a lot of assurances in code quality and the ability to refactor when necessary.\n\
    NUnit includes a library to annotate source code as tests, as well as a GUI and\
    \ command-line harness to run the tests.\nAs an example, let's see some tests\
    \ of an incomplete ComplexNumber class:\n\nusing System;\n\n```\nnamespace MathLib\n\
    {\n    public struct ComplexNumber\n    {\n        private double _real;\n   \
    \     private double _imaginary;\n\n        public double RealPart\n        {\n\
    \            get { return _real; }\n            set { _real = value; }\n     \
    \   }\n        public double ImaginaryPart\n        {\n            get { return\
    \ _imaginary; }\n            set { _imaginary = value; }\n        }\n\n      \
    \  public ComplexNumber(double real, double imaginary)\n        {\n          \
    \  _real = real;\n            _imaginary = imaginary;\n        }\n\n        public\
    \ static ComplexNumber operator*(ComplexNumber a, ComplexNumber b)\n        {\n\
    \            return new ComplexNumber((a.RealPart * b.RealPart) - (a.ImaginaryPart\
    \ * b.ImaginaryPart),\n(a.RealPart * b.ImaginaryPart) + (b.RealPart * a.ImaginaryPart));\n\
    \        }\n    }\n```"
