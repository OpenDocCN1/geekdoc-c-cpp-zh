  md: 'This and the next sections build up a simple WPF-based text editor, complete
    with menu, toolbar, status bar, and commands.


    # Choose a Layout Method


    > Scenario/Problem: You need to position controls in your window.


    Solution: WPF is all about automatic layout. You should rarely need to manually
    position UI elements. This makes it easier to deal with dynamic content and internationalization,
    for example, WPF provides a number of layout controls for you, which are rarely
    need to build your own.


    TABLE 18.1 WPF Layout Controls

    | Name | Description |

    | DockPanel | Elements can be attached to any of the four sides, and the last
    element takes up the rest of the space. Popular for top-level window layout. |

    | Grid | Each child specifies a cell it appear in, including spanning multiple
    cells. A very good option for laying out elements in ordered, tale-like manner.
    |

    | Uniform Grid | Similar to StackPanel, but each cell is the same size. |

    | StackPanel | Orders elements one after the other, either horizontally or vertically.
    |

    | WrapPanel | A little like StackPanel, but wraps around to the beginning when
    the end of the layout space is reached. |

    | Canvas | Allows explicit positioning of elements. This is most like the old
    way of doing things. It allows absolute control but does not give you the benefits
    of many the other layout controls. |


    Nearly any interface can be composed of combinations of these layouts. The examples
    in this chapter use Grid, StackPanel, and DockPanel.


    # Add a Menu Bar


    > Scenario/Problem: You need to add a menu bar to a WPF window.


    Solution: Many WPF examples show off the 3D capabilities, or its advanced data-binding
    features, but WPF excels at standard interfaces (menu bar, toolbar, status bar)
    just as easily, we''ll start there before moving on to the more “wow” capabilities.'
