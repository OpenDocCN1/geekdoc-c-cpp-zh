  md: "# Detect Database Connection Is Available\n\n> **Scenario/Problem:** Your application\
    \ operates in an environment where the database connection can be unreliable and\
    \ you want your program to pause operations if it detects a problem.\n\n**Solution:**\
    \ Ideally, you want to ensure that databases can’t disappear from the network,\
    \ but sometimes you need to be extra cautious.\n\nHere’s a simple function that\
    \ tries to open a connection and returns a Boolean value depending on whether\
    \ it was successful or not:\n\n```\nprivate static bool TestConnection()\n{\n\
    \    try {\n        using (SqlConnection conn =\n            new SqlConnection(GetConnectionString()))\
    \ {\n            conn.Open();\n            return (conn.State == ConnectionState.Open);\n\
    \        }\n    } catch (SQLException) {\n        return false;\n    } catch (InvalidOperationException)\
    \ {\n        return false;\n    }\n}\n```\n\n> **NOTE** Using this won’t guarantee\
    \ the database is available for you—after all, the server could fail right after\
    \ this method returns true. Ultimately, your code must be very robust in the face\
    \ of failure. Nevertheless, I found this code useful on a network where there\
    \ was a reliably inconsistent connection to the database."
