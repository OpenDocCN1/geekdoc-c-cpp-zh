  md: "# Bind Control Properties to Another Object\n\nSolution: We already have some\
    \ simple data binding in the preceding examples. It is, in fact, *hard* to do\
    \ WPF without using data binding, because that is what naturally wants to do.\n\
    \nFor binding to work, the binding must be associated with a DataContext. Elements\
    \ search up their parent tree for the closest DataContext. Data binding is relative\
    \ to that, unless explicitly stated otherwise (using `ElementName` or `RelativeSource`).\n\
    \nFor the ImageViewer sample, a data object was created specifically for data\
    \ binding and set to the window's DataContext.\n\nListings 18.1 and 18.2 demonstrate\
    \ data binding with a drag-and-drop image viewer. Every time an image is dropped\
    \ on the application, a new ImageInfoViewModel is created and assigned to the\
    \ window's DataContext property. The view model abstracts the actual model (the\
    \ image) and presents a simple class that is used in data binding for the UI.\
    \ For more on the view model and the overall design pattern here, see Chapter\
    \ 25, “Application Patterns and Tips.\\”\n\n# LISTING 18.1 ImageInfoViewModel.cs\n\
    \n```\nusing System;\nusing System.Collections.Generic;\nusing System.Windows.Media.Imaging;\n\
    using System.IO;\nusing System.ComponentModel;\n```\n\n```\nnamespace ImageViewer\n\
