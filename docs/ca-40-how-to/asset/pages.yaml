  md: '+   An abstract base class can provide a default implementation.


    +   Abstract base classes tend to rigidly structure code. This may be desirable
    in some cases.


    If you find yourself trying to put too much functionality into abstract base classes,
    another possibility is to look into componentizing the various areas of functionality.


    As you gain experience, you''ll come to realize what makes sense in different
    situations. Often, some combination of the two makes sense.'
