    \ case, you have to handle null values for both a and b, as in this example:\n\
    \n```\npublic static bool operator ==(CatalogItem a, CatalogItem b)\n{\n    if\
    \ ((object)a == null && (object)b == null)\n        return true;\n    if ((object)a\
    \ == null || (object)b == null)\n        return false;\n    return a.Equals(b);\n\
    }\n\npublic static bool operator !==(CatalogItem a, CatalogItem b)\n{\n    return\
    \ !(a == b);\n}\n```\n\n# Convert One Type to Another\n\nScenario/Problem: You\
    \ need to convert one type to another, either automatically or by requiring an\
    \ explicit cast.\n\nSolution: Implement a conversion operator. There are two types\
    \ of conversion operators: implicit and explicit. To understand the difference,\
    \ we'll implement a new struct called Vertex3i that is the same as Vertex3d, except\
    \ the dimensions are integers instead of doubles.\n\n# Explicit Conversion (Loss\
    \ of Precision)\n\nExplicit conversion is encouraged when the conversion result\
    \ in a loss of precision. When you're converting from System.Double to System.Int32,\
    \ for example, all of the decimal precision is lost. You don't (necessarily) want\
    \ the compiler to convert this automatically, so make it explicit. This code goes\
    \ in the Vertex3d class:\n\n```\npublic static explicit operator Vertex3i(Vertex3d\
    \ vertex)\n{\n    return new Vertex3i((Int32)vertex._x, (Int32)vertex._y, (Int32)vertex._z);\n\
    }\n```"
