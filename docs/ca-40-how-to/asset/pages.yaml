  md: "# Use Interlocked Methods Instead of Locks\n\n**Scenario/Problem:** You need\
    \ to manipulate shared integer primitives and need to avoid the performance implications\
    \ of using locks.\n\n**Solution:** Looking at a preceding example,\n\n```\npublic\
    \ void AddOne()\n{\n    lock(valueLock)\n    {\n        ++value;\n    }\n}\n```\n\
    \nyou might wonder if a lock is really necessary just to increment a variable.\
    \ After all, increment and decrement are extremely common operations and locks\
    \ can be expensive.\n\nThankfully, there are a few functions to atomically perform\
    \ some simple operations for you:\n\n```\nint value = 13;\n\nprivate void ThreadProc()\n\
    {\n    Interlocked.Increment(ref value);//adds one\n    Interlocked.Decrement(ref\
    \ value);//subtracts one\n    Interlocked.Add(ref value, 13);//adds 13\n\n   \
    \ //set value to 99 and return the original value\n    int originalValue = Interlocked.Exchange(ref\
    \ value, 99);\n\n    string s1 = \"Hello\";\n    string sNew = \"Bonjour\";\n\
    \    string sCompare = \"Hello\";\n\n    // if (s1 == sCompare) s1 = sNew;\n \
    \   string sOriginal = Interlocked.CompareExchange<string>(ref s1,\n    sNew,\n\
    \    sCompare);\n}}\n```"
