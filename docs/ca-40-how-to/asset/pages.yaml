  md: "```\npublic string LastName { get; set; }\npublic Author(int id, string firstName,\
    \ string lastName)\n{\n    this.Id = id;\n    this.FirstName = firstName;\n  \
    \  this.LastName = lastName;\n}\n//\nList<Book> books = new List<Book>{\nnew Book(\"\
    Le Rhin\", 1, 1842),\nnew Book(\"Les Burgraves\", 1, 1843),\nnew Book(\"Napoléon\
    \ le Petit\",1, 1852),\nnew Book(\"Les Châtsiments\",1, 1853),\nnew Book(\"Les\
    \ Contemplations\", 1, 1856),\nnew Book(\"Les Misérables\", 1, 1862) };\n```\n\
    \n```\nList<Author> authors = new List<Author>\n{\nnew Author(1, \"Vector\", \"\
    Hugo\")\n};\n```\n\nThe most basic LINQ query retrieves all the book information.\n\
    \n```\nvar allBooks = from book in books select book;\nforeach (Book book in allBooks)\n\
    {\n    Console.WriteLine(book.ToString());\n}\n```\n\nThe var keyword is often\
    \ used with LINQ for reasons you will see later. In this case, allBooks is a collection\
    \ of Book objects. The output is as follows:\n\n+   Le Rhin - 1842\nLes Burgraves\
    \ - 1843\nNapoléon le Petit - 1852\nLes Châtsiments - 1853\nLes Contemplations\
    \ - 1856\nLes Misérables - 1862\n\n# Order the Results\n\nScenario/Problem: You\
    \ want to organize the results in some order."
