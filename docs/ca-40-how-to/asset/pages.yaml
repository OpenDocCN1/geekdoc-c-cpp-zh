    # Use ASP.NET Model-View-Controller (MVC)


    Scenario/Problem: You want to use a framework to abstract the data, view, and
    control parts of a web application, making it easier to build and easier modify
    over time.


    Solution: There are many frameworks out there that work on top of ASP.NET. Microsoft
    provides one called ASP.NET MVC (for Model-View-Controller), which ships with
    Visual Studio 2010.


    In this section, we''ll build a simple app to display our books database which
    was created in Chapter 13, “Databases.”


    # Create the Application


    In Visual Studio, create a new project and for the type select ASP.NET MVC 2 Web
    Application.


    When it asks whether you want to create a unit test project, select No.


    This creates a new project that contains a number of folders and files that are
    already generated for you, including folders for each of the types of components:
    controllers, models, and views.


    # Create the Model


    For this, we''ll use the Entity Framework, which was introduced in Chapter 13.


    +   - Right-click the Models folder and an ADO.NET Entity Data Model called Book.edmx.

    - In the Entity Data Model Wizard that comes up, select Generate from Database
    and click Next.

    - Choose the database we created in Visual Studio in Chapter 13, type BooksDBEntities
    for the connection settings, and click Next.'
