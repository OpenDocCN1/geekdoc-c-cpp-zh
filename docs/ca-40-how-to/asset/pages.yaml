  md: '# TABLE 10.2 Nongeneric Collections with No Generic Equivalent


    | Collection | Description |

    | --- | --- |

    | ArrayList | Similar to List<object>. |

    | BitArray | Array of bit (Boolean) values. You can perform Boolean logic on this
    collection. |

    | BitVector32 | Like BitArray, but limited to (and optimized for) 32 bits. |

    | ListDictionary | An implementation of IDictionary (association semantics) using
    a linked list. Designed for very small collections (10 or fewer elements). Operations
    are O(n). |

    | HybridDictionary | Uses ListDictionary when there are few items, but switches
    to Hashtable when the collection grows. |

    | StringCollection | Equivalent to List<string>. |

    | StringDictionary | Equivalent to Dictionary<string, string>. |


    # Use Concurrency-Aware Collections


    > **Scenario/Problem:** You need a collection that will be accessed by multiple
    threads simultaneously.


    **Solution:** Either protect the access yourself using thread synchronization
    objects (see Chapter 23, "Threading and Asynchronous Programming") or use the
    collections in the System.Collections.Concurrent namespace. These include the
    following:


    +   - ConcurrentBag<T> (similar to a set, but and duplicates are allowed)

    - ConcurrentDictionary<TKey, TValue>

    - ConcurrentQueue<T>

    - ConcurrentStack<T>


    > **NOTE** Beware of using these collections. Every access will be protected,
    which will greatly affect performance. Often, thread synchronization should be
    handled at a higher level than the collection.


