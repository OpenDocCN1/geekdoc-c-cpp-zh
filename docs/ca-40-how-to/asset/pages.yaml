  md: "# Protect Data Used in Multiple Threads\n\n```\n//volatile indicates the value\
    \ should always be read from memory,\n//never CPU cache\nprivate volatile int\
    \ value = 13;\n// use a dummy object for the lock\nprivate object valueLock =\
    \ new object();\npublic void AddOne()\n    Monitor.Enter(valueLock);\n    ++value;\n\
    \    Monitor.Exit(valueLock);\n}\n```\n\n```\npublic void SubtractOne()\n{\n \
