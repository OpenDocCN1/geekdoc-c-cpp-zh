  md: '# 410 CHAPTER 19 ASP.NET


    **Solution**: Master pages are essentially templates that define the overall structure

    of a page. They contain all the common elements for a set of pages as well as

    content placeholder objects that are filled in by content pages.


    Listing 19.4 shows the master page for a book inventory application, which is
    the

    BooksApp sample application in the accompanying source code.


    # **LISTING 19.4 BooksApp—MasterPage.master**


    ```

    <%@ Master Language="C#" AutoEventWireuptrue"

    CodeBehind="MasterPage.master.cs"

    -Inherits="BooksApp.MasterPage" %>


    <!DOCTYPE html PUBLIC "//W3C//DTD XHTML 1.0 Transitional//EN"

    -"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">


    <html xmlns="http://www.w3.org/1999/xhtml">

    <head runat="server">

    <asp:ContentPlaceholder ID="runat"at="server">

    <title>Books App</title>

    </asp:ContentPlaceholder>

    </head>

    <body>

    <form id="form1" runat="server">

    <div style="position:absolute;top:0px;width:800px;height:50px">

    <asp:ContentPlaceholder ID="Header" runat="server">


    </asp:ContentPlaceholder>

    </div>

    <div style="position:absolute;top:100px;left:110px;width:700px">

    <asp:ContentPlaceholder ID="MainContent" runat="server">


    </asp:ContentPlaceholder>

    </div>

    </form>

    </body>

    </html>

    ```


    As you can see, a master page is very similar to a normal .aspx page. Master pages
    can

    also have code-behind. This master page contains three ContentPlaceholder objects

    for the <head> element, the body’s header, and content sections. Note that the

    <head> placeholder contains a default <title> tag. This will be used if the content

    page does not put its own content there.'
  merge: -1
