- img_proc: true
  md: 'The intelligent use of collections is in many ways central to building large,
    well-factored applications. How you store and access your data can strongly influence
    or even determine everything else. Thus, it is crucial to get it right. This chapter
    contains tips for working with collections and creating your own.


    # Pick the Correct Collection Class


    Scenario/Problem: You need to pick the correct type of collection for your data
    structure.


    Solution: Use Tables 10.1 and 10.2 to help you decide which collection class to
    use.


    Note that only the basic Array type cannot grow beyond its initial size. All the
    others will manage their internal storage such that objects can be added to infinitely
    (limited by memory, of course).


    | Type | Insert | Remove | Find | Grows | Allows Duplicates |

    | --- | --- | --- | --- | --- | --- |

    | Array | O(n)* | O(n)* | O(n)† | No | Yes |

    | List<T> | O(n) | O(n) | O(n) | Yes | Yes |

    | LinkedList<T> | O(1) | O(1) | O(n) | Yes | Yes |

    | SortedList<TKey, Value>† | O(1) | O(1) | O(n) | O(log n) | Keys:no, Values:yes
    |

    | Stack<T> | O(1) | O(1) | O(n) | Yes | Yes |

    | Queue<T> | O(1) | O(1) | O(n) | Yes | Yes |

    | HashSet<T> | O(1) | O(1) | O(1) | Yes | No |

    | SortedSet<T> | O(1) | O(1) | O(1) | Yes | No |

    | Dictionary<TKey, Value> | O(1) | O(1) | O(1) | Yes | Keys:no, Values:yes |

    | SortedDictionary<TKey, Value>† | O(log n) | O(log n) | O(log n) | Yes | Keys:no,
    Values:yes |


    *O(1) if at the end.

    †O(log n) if you keep the array sorted so you can use a binary search.

    ‡SortedList and SortedDictionary are similar in that both are implemented as a
    binary search tree. Both have similar retrieval times, but SortedList uses less
    memory, SortedDictionary SortedList is faster at inserting already sorted data.'
