  md: '# CHAPTER 26 Interacting with the OS and Hardware


    Applications don''t exist in a vacuum. They rely on the operating system to provide
    many vital services. Some of these, such as the location of important folders
    or the installed network adapters, are carried in earlier chapters (Chapters 11,
    “Files and Serialization,” and 12, “Networking and the Web,” respectively).


    The OS can also present more information about itself and the hardware environment
    it''s running on. This chapter talks mostly about the information you can obtain,
    as well as some Windows-specific technologies, such as the event log, Windows
    services, and memory-mapped files.


    # Get OS, Service Pack, and CLR Version


    +   Scenario/Problem: You need to get version information for the current operating
    system.


    Solution: Use the System.Environment.OSVersion class, as in this sample:


    ```

    OperatingSystem os = System.Environment.OSVersion;

    Console.WriteLine("Platform: {0}", os.Platform);

    Console.WriteLine("Service Pack: {0}", os.ServicePack);

    Console.WriteLine("Version: {0}", os.Version);

    Console.WriteLine("VersionString: {0}", os.VersionString);

    Console.WriteLine("CLR Version: {0}", System.Environment.Version);

    ```


    This produces the following output (on my Windows 7 system):


    ```

    Platform: Win32NT

    Service Pack:

    Version: 6.1.7600.0

    VersionString: Microsoft Windows NT 6.1.7600.0

    CLR Version: 4.0.21006.1

    ```


    The version information is in a struct, so you can make decisions based on version
    or subversion values.


    > Notice that nowhere does it say “Windows 7” in the version information. “Windows
    7” is really the brand, which has relatively little to do with version information.
    Your programs should make decisions based on version numbers, names.


    # Get CPU and Other Hardware Information


    +   Scenario/Problem: You need to get the number of CPUs, amount of memory, or
    other hardware information.'
  merge: -1
  pgno: 592
