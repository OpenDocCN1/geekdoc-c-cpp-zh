  md: "# CHAPTER 18 WPF\n\nFirst, there was plain-old Win32: C interfaces and a lot\
    \ of work to get anything done. MFC wrapped up some of the complexity into an\
    \ object-oriented framework, but it was a fairly thin layer on top of Win32..NET's\
    \ Windows Forms was a more elegant attempt at abstracting away the old C interfaces,\
    \ they were still somewhere. Windows Presentation Foundation (WPF) throws all\
    \ of that and gives you a completely new framework from which to build user interfaces.\
    \ It is designed to be hardware-accelerated to take advantage of today's modern\
    \ graphics cards.\n\nAs with any new framework, there is a lot to learn. However,\
    \ especially in the case of WPF, the payoff is huge. You can do things in WPF\
    \ with little effort that would require you to learn a specialized graphics API,\
    \ such as DirectX. WPF is nearly boundless in amount you could learn, but the\
    \ examples and tips in this chapter will get you well on your way to creating\
    \ astounding interfaces in far less time than with the older framework.\n\n# Show\
    \ a Window\n\n| Scenario/Problem: You need to display a simple window in WPF.\
    \ As with most applications, you usually need to start with a window |\n\nSolution:\
    \ Although most things in WPF can be expressed as either XAML or code, most examples\
    \ will use XAML as much as possible.\n\nHere's the code in Window1.xaml:\n\n```\n\
    <Window x:Class=\"WpfEditor.Window\"\nxmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
    \nxmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\nTitle=\"WPF Text Editor\"\
    \ Height=\"300\" Width=\"300\">\n</Window>\n```\n\nThe corresponding code in Window1.xaml.cs\
    \ is even simpler:\n\n```\npublic partial class Window1 : Window\n{\n    public\
    \ Window1()\n    {\n        InitializeComponent();\n    }\n}\n```\n\nThe base\
    \ Windows class's InitializeComponent method will do the XAML parsing and present\
    \ the window."
  merge: -1
  pgno: 382
