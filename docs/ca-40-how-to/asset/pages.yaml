  md: "# Put Commands into the ViewModel\n\nNow we just need to hook everything up\
    \ with the MainWindow and MainViewModel needs to execute some commands, which\
    \ should be done in the ViewModel. To do this, you can't use the standard WPF\
    \ RoutedUIEvent, you can easily develop your own command classes. A common way\
    \ to do this is to create a command object that calls a delegate you specify:\n\
    \n```\n//this is a common type of class, also known as RelayCommand\nclass DelegateCommand\
    \ : ICommand\n{\n    //delegates to control command\n    private Action<object>\
    \ _execute;\n    private Predicate<object> _canExecute;\n\n    public DelegateCommand(Action<object>\
    \ executeDelegate)\n        :this(executeDelegate, null)\n    {\n}\n    public\
    \ DelegateCommand(Action<object> executeDelegate, Predicate<object> canExecuteDelegate)\n\
    \    {\n        _execute = executeDelegate;\n        _canExecute = canExecuteDelegate;\n\
    \    }\n    #region ICommand Members\n    public bool CanExecute(object parameter)\n\
    \    {\n        if (_canExecute == null)\n        {\n            return true;\n\
    \        }\n        return _canExecute(parameter);\n    }\n    public event EventHandler\
    \ CanExecuteDelegateChanged;\n    public void Execute(object parameter)\n    {\n\
    \        _execute(parameter);\n    }\n    #endregion\n}\n```"
