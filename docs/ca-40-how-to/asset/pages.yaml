  md: '# Respond to System Configuration Changes


    **Scenario/Problem:** Your application needs to be aware of when the system''s
    configuration changes, such as when screens change resolution (or get disconnected),
    when the power status changes, and so on.


    **Solution:** The Microsoft.Win32 namespace contains the SystemEvents class, which
    contains a number of static events your application can listen to, such as the
    following:


    +   - DisplaySettingsChanged (and -Changing)

    - InstalledFontsChanged

    - PaletteChanged

    - PowerModeChanged

    - SessionEnded (the user is logging off; also -Ending)

    - SessionSwitch (the current use has changed)

    - TimeChanged

    - UserPreferenceChanged (and -Changing)


    For example, if your application listens for the PowerModeChanged event, you can
    detect the computer is entering standby and you can shut down threads, stop computations,
    and so on.


    > You should always make sure your application detaches the event handlers when
    it ends; otherwise, you will leak memory in some cases.


    # Take Advantage of Windows 7 Features


    **Scenario/Problem:** You want to access functionality specific to Windows 7,
    such as Libraries, common file dialogs, power managements APIs, application restart
    and recovery APIs, DirectX, and more.


    **Solution:** Use the free Windows API Code Pack for Microsoft® .NET Framework,
    available at the MSDN code library. (The URL at the time of writing was http://code.msdn.microsoft.com/WindowsAPICodePack.)'
