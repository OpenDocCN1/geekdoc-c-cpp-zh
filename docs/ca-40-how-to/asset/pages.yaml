  md: "# CHAPTER 25 Application Patterns and Tips\n\nYou can also make it an error\
    \ to use the obsolete code:\n[Obsolete(\"Don't use this because...\", true)]nclass\
    \ MyClass { }\n\n# Combine Multiple Events into a Single Event\n\nScenario/Problem:\
    \ You have a class that can generate a lot of events in a short period of time.\
    \ You don't want to waste overhead on just responding to events.\n\nFor example,\
    \ if you have a UI that responds to updates from a data source, you need to take\
    \ care that if the data source produces a lot of updates, your UI performance\
    \ doesn't suffer.\nSolution: Rather than notifying subscribers of each update,\
    \ group them into a meta-event. For a starting example, assume you have a collection\
    \ that notifies listeners when it has been updated:\n\n```\nclass ItemAddedEventArgs<T>\
    \ : EventArgs\n{\n    private T _item;\n    public T Item {get};\n\n    public\
    \ ItemAddedEventArgs(T item)\n    {\n        _items = item;\n    }\n}\nclass MyCollection<T>\n\
    {\n    List<T> _data = new List<T>();\n\n    public event EventHandler<ItemAddedEventArgs<T>>\
    \ ItemsAdded;\n\n    protected void OnItemsAdded(T item)\n    {\n        if (ItemsAdded\
    \ != null)\n        {\n            ItemsAdded(this, new ItemAddedEventArgs<T>(item));\n\
    \        }\n    }\n```"
