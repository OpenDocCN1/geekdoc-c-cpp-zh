  md: "# Reuse Code in Multiple Constructors\n\n**Scenario/Problem:** You have multiple\
    \ constructors, but they have a subset of functionality that is common among them.\
    \ You want to avoid duplicating code. C++ and some previous languages, you often\
    \ had the case where a class with multiple constructors needed to call common\
    \ initialization. In these cases, you usually factored out the common code into\
    \ a common function that each constructor called.\n\n```\n///C++ example\nclass\
    \ MyCppClass\n{\npublic:\n    MyCppClass() { Init(); }\n    MyCppClass(int arg)\
    \ { Init(); }\nprivate:\n    void Init() { /* common init here* };\n}\n```\n\n\
    **Solution:** In C#, you are allowed to call other constructors within the same\
    \ class using this keyword, as shown next:\n\n```\npublic class Vertex3d\n{\n\
    \    public Vertex3d(double x, double y, double z)\n    {\n        this._x = x;\n\
    \        this._y = y;\n        this._z = z;\n    }\n\n    public Vertex3d(System.Drawing.Point\
    \ point)\n        :this(point.X, point.Y, 0)\n    {\n    }\n    ...\n}\n```\n\n\
    # Derive from a Class\n\n**Scenario/Problem:** You need to specialize a class\
    \ by adding and/or overriding behavior."
