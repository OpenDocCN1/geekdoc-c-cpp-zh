- img_proc: true
  md: "System.Runtime.InteropServices.Marshal.Copy(\nsourcePtr, buffer, 0, sourceData.Stride);\n\
    \n```\n//fiddle with the bits\nfor (int i = 0; i < buffer.Length; i+=4)\n{\n \
    \   // pixel is represented by 4 bytes\n    // last byte is transparency, which\
    \ we'll ignore\n    buffer[i + 0] /= 2;\n    buffer[i + 1] /= 2;\n    buffer[i\
    \ + 2] /= 2;\n}\n```\n\n```\nSystem.Runtime.InteropServices.Marshal.Copy(\nbuffer,\
    \ 0, destPtr, destData.Stride);\nsourcePtr = new IntPtr(sourcePtr.ToInt64() +\
    \ sourceData.Stride);\ndestPtr = new IntPtr(destPtr.ToInt64() + destData.Stride);\n\
    }\n```\n\n```\nsourceImg.UnlockBits(sourceData);\ndestImg.UnlockBits(destData);\n\
    ```\n\nSee the BitmapDirect sample project for the full source code. It shows\
    \ the difference in time to copy and change a bitmap with this method using GetPixel\
    \ and SetPixel.\n\nWhat's the difference in performance, do you ask? In my informal\
    \ tests with a 1600×1200 image, using GetPixel() and SetPixel() took 3 to 5 seconds.\
    \ Locking the bits and performing the manipulation directly took less than half\
    \ a second.\n\n> NOTE Be careful. Locking bits in memory is not something you\
    \ want to do haphazardly. When you lock memory, you prevent the .NET memory system\
    \ from moving it, which can interfere with garbage collection and optimum memory\
    \ usage. Use it when you need it, but don't keep locked around indefinitely.\n\
    \n# Draw with Anti-Aliasing\n\nScenario/Problem: You want to eliminate jagged\
