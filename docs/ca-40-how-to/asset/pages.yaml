  md: '# Scale


    Scaling is just resizing an object along the X and Y dimensions.


    ```

    // Scale

    //make it twice as long and 3/4 as wide

    e.Graphics.ScaleTransform(2.0f, 0.75f);

    e.Graphics.FillEllipse(Brushes.Green, ellipseRect);

