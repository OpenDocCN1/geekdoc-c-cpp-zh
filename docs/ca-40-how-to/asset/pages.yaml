  md: "# Prevent Overriding of a Single Method\n\n**Scenario/Problem:** You don't\
    \ want to ban inheritance on your type, but you want to prevent certain methods\
    \ or properties from being overridden.\n\n**Solution:** Put sealed as part of\
    \ the method or property definition.\n\n```\nclass ParentClass\n{\n    public\
    \ virtual void MyFunc() {}\n}\n\nclass ChildClass : ParentClass\n{\n    // seal\
    \ base class function into this class\n    public sealed override void MyFunc()\
    \ {}\n}\n\nclass GrandChildClass : ChildClass\n{\n    //yields compile error\n\
    \    public override void MyFunc() {}\n}\n```\n\n# Allow Value Type to Be Null\n\
    \n**Scenario/Problem:** You need to assign null to a value type to indicate the\
    \ lack of a value. This scenario often occurs when working with databases, which\
    \ allow any data type to be null.\n\n**Solution:** This isn't technically something\
    \ you need to implement in your class.\\NET 2.0 introduced the Nullable<T> type,\
    \ which wraps any value type into something that can be null. It's useful enough\
    \ that there is a special C# syntax shortcut to do this. The following two lines\
    \ of code are semantically equivalent:\n\n```\nNullable<int> _id;\nint? _id;\n\
    ```\n\nLet's make the _id field in our Vertex3 class Nullable<T> to indicate the\
    \ lack of a valid value. The following code snippet demonstrates how it works:"
