  md: "# Produce an RSS Feed Dynamically in IIS\n\n> **Scenario/Problem:** You want\
    \ to generate an RSS feed dynamically from a content database.\n\n**Solution:**\
    \ You already have all the pieces you need to actually create the feed: It's merely\
    \ an XML file, after all. The more important question is this: When do you generate\
    \ it?\n\nThere are a few options:\n\n+   - Each time content is created or updated.\n\
    - On a regular schedule (once an hour, for example).\n- On each request (possibly\
    \ with caching).\n\nAn example of the last option is to create a custom handler\
    \ for IIS. In a class library project, define this class:\n\n```\nclass RssGenerator\
    \ : System.Web.IHttpHandler\n{\n    RssLib.Feed feed = new RssLib.Feed();\n\n\
    \    #region IHttpHandler Members\n    public bool IsReusable\n    {\n       \
    \ get { return true; }\n    }\n    public void ProcessRequest(System.Web.HttpContext\
    \ context)\n    {\n        context.Response.ContentType = \"application/xml\"\
    ;\n        CreateFeedContent(context.Response.OutputStream);\n    }\n    #endregion\n\
    \n    private void CreateFeedContent(Stream outStream)\n    {\n        RssLib.Channel\
    \ channel = GetFeedFromDB();\n        feed.Write(outStream, channel);\n    }\n\
    ```"
  merge: -1
