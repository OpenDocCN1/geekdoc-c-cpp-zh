  md: "This chapter contains essential, general C# knowledge that doesn’t fit easily\
    \ into other chapters: from the multitude of ways to declare variables to the\
    \ different types of multidimensional arrays and some of the “unusual” operators\
    \ in C#.\n\n# Declare Variables\n\nScenario/Problem: You need to store data in\
    \ a class.\n\nSolution: C# provides many ways to declare and define variables.\
    \ We’ll start with the simplest:\n\n```\nint x = 13;//declare and define at once\n\
    int y;//declare and define later\ny = 13;\n```\n\n# Use Type Inference (Implicit\
    \ Typing)\n\nScenario/Problem: You want to declare a variable and assign it a\
    \ value, without having to figure out the type, but still take advantage of strong\
    \ typing rules.\n\nSolution: Type inference allows you to let the compiler decide\
    \ what a local variable is (it cannot be used for class fields). It is important\
    \ to realize that variables are still strongly typed—var is not equivalent to\
    \ Object. You are merely giving the job of figuring out the type to the compiler.\
    \ Once that’s done, the type cant change during runtime.\n\n```\nclass MyType\
    \ { }\n\nclass Program\n{\n    static void Main(string[] args)\n    {\n      \
    \  var x = 13;\n        var myObj = new MyType();\n        var myNums = new double[]\
    \ { 1.0, 1.5, 2.0, 2.5, 3.0 };\n        //not allowed to initialize to null\n\
    \        var myNullObj = null;\n        //but setting it to null after definition\
    \ is ok\n        var myNullObj = new MyType();\n        myNullObj = null;\n```"
