  md: "# Create a Custom Collection\n\nScenario/Problem: If the collections built\
    \ into .NET are not sufficient, you need to create your own collection class.\n\
    \nSolution: So that they can play nicely with other components, all collections\
    \ in .NET implement a subset of the collection-related interfaces. Table 10.3\
    \ briefly describes the common interfaces as they relate to collections.\n\n|\
    \ Interface | Description | Methods |\n| --- | --- | --- |\n| ICollection<T> |\
    \ Basic methods that pertain to most collection types. Inherits IEnumerable<T>.\
    \ | Add, Clear, Contains, CopyTo, Remove |\n| IEnumerable<T> | Specifies that\
    \ the collection's objects can be enumerated using foreach. | GetEnumerator |\n\
    | IDictionary<TKey, TValue> | Allows access to collections by key/value pairs.\
    \ Inherits from IKeyValuePair<TKey, TValue>. | ContainsKey, TryGetValue |\n| IList<T>\
    \ | Specifies that the collection can be accessed by index. Inherits from ICollection<T>.\
    \ | IndexOf, Insert, RemoveAt |\n\nNote although not explicitly stated in the\
    \ table for space purposes, any interface that inherits from another also includes\
    \ the base interface's methods in its definition.\n\nThe example I will use over\
    \ this and the next section implements a binary search tree, complete with three\
    \ different traversals. We'll start with the following definition:\n\n```\nclass\
    \ BinaryTree<T> : ICollection<T>, IEnumerable<T>\n    where T: IComparable<T>\n\
    {\n    //this class is private because\n    //only the tree needs to know about\
    \ it\n    private class Node<T>\n    {\n        public T Value;\n```"
