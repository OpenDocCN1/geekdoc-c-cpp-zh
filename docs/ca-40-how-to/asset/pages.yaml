  md: "```\nclass AutoStopwatch : System.Diagnostics.Stopwatch, IDisposable\n{\n \
    \   public AutoStopwatch()\n    {\n        Start();\n    }\n\n    public void\
    \ Dispose()\n    {\n        Stop();\n        Console.WriteLine(\"Elapsed: {0}\"\
    , this.Elapsed);\n    }\n}\n```\n\nNow you can take advantage of the using {}\
    \ syntax:\n\n```\nusing (new AutoStopwatch())\n{\n    Decimal total2 = 0;\n  \
    \  int limit2 = 1000000;\n    for (int i = 0; i < limit2; ++i)\n    {\n      \
    \  total2 = total2 + (Decimal)Math.Sqrt(i);\n    }\n}\n```\n\nBesides Start()\
    \ and Stop(), there are also Reset(), which stops and sets Elapsed to 0, and Restart(),\
    \ which sets Elapsed to 0, but lets timer continue running.\n\n# Mark Obsolete\
    \ Code\n\n> Scenario/Problem: You have “dead” code that should no longer be used,\
    \ but you can’t remove it because too many other parts use it. This is especially\
    \ problematic when developing libraries.\n\nSolution: Mark the method or class\
    \ with the [Obsolete] attribute.\n\nThe compiler will warn anyone an entity marked\
    \ as obsolete with at least a warning. You can optionally supply a message for\
    \ the compiler to present:\n\n```\n[Obsolete(\"Don’t use this because...\"))]\n\
    class MyClass { }\n```"
