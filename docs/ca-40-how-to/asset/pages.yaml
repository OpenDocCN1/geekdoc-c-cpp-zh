    # Add a Menu Bar


    Scenario/Problem: You want to provide a menu system in your application.


    Solution: This section starts an example that will be used over the next few

    sections. In the example, you''ll build up a very, very simple file browser application,

    complete with menus, status bar, toolbar, and a split pane window (see Figure
    16.2).


    ![](img/c237887cbbac0db0e18bd0eecbc77950_313_0.png)


    FIGURE 16.2

    Windows Forms has a number of controls that make it easy to create standard interfaces.


    All of these are instances of controls that can be placed inside a ToolStripContainer,

    which is a convenient layout control that allows easy placement of controls on
    all sides

    of a form.


    > NOTE Controls derived from ToolStrip are far more powerful than their predecessors.\ors.
    For example, not only can they host standard text items and buttons, but they

    can host combo boxes, progress bars, and more—anything that is derived from

    ToolStripItem.'
