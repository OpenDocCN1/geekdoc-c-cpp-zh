  md: "Solution: Define a converter class derived from IValueConverter and implement\
    \ one or both methods:\n\n```\nclass FilenameToColorConverter : IValueConverter\n\
    {\n    public object Convert(object value,\n        Type target,\n        object\
    \ parameter,\n        System.Globalization.CultureInfo culture)\n{\n    if (string.IsNullOrEmpty(value\
    \ as string))\n    {\n        return Brushes.Red;\n    }\n    else\n    {\n  \
    \      return Brushes.Green;\n    }\n}\n\n    public object ConvertBack(object\
    \ value,\n        Type target,\n        object parameter,\n        System.Globalization.CultureInfo\
    \ culture)\n{\n    // you only need to implement this for two-way conversions\n\
    \    throw new NotImplementedException();\n}\n```\n\nIn your window XAML, define\
    \ a resource and specify the converter where needed. In the example, the background\
    \ color is bound to the filename with so that the converter turns red if the filename\
    \ is null:\n\n```\n<Window x:Class=\"ImageView.Window\"\nxmlns=\"http://schemas.microsoft.com/winfx/2006/presentation\"\
