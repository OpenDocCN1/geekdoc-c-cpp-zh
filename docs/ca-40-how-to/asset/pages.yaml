    , Address = \"Redmond, WA\" };\n\n# Use const and readonly\n\n| Scenario/Problem:\
    \ You need to specify fields that cannot be changed at runtime. |\n\n**Solution:**\
    \ Both const and readonly are used to define data that does not change, but there\
    \ are important differences: const fields must be defined at declaration. Because\
    \ of this and the fact that they cannot change value, it implies that they belong\
    \ to the type as static fields. On the other hand, readonly fields can be set\
    \ at declaration or in the constructor, but nowhere else.\n\n```\npublic class\
    \ Vertex3d {\n    private const string Name = \"Vertex\";\n    private readonly\
    \ int ver;\n\n    public Vertex3d() {\n        ver = Config.MyVersionNumber//Ok\n\
    \    }\n\n    public void SomeFunction() {\n        ver = 13//Error!\n    }\n\
    }\n```"
