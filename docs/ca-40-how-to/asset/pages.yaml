  md: "# Response to Timer Events on the UI Thread\n\nScenario/Problem: You want a\
    \ timer that fires events on the UI thread so you you don't have to do the UI\
    \ invoking yourself.\n\nSolution: There are a few different timers you can use\
    \ for triggering events at specific intervals, but recall that all UI updates\
    \ must occur from the UI thread. You can always use BeginInvoke to marshal a delegate\
    \ to the UI thread, but there's a simpler way. WPF and Silveright provide DispatcherTimer\
    \ class in the System.Windows.Threading namespace, which always fires on the UI\
    \ thread. You can use this timer for updating the playback progress.\n\n```\n\
    private System.Windows.Threading.DispatcherTimer timer =\n    new System.Windows.Threading.DispatcherTimer();\n\
    \npublic void MainPage()\n{\n    InitializeComponent();\n    //one second\n  \
    \  timer.Interval = new TimeSpan(0,0,1);\n    timer.Start();\n    timer.Tick +=\
    \ new EventHandler(timer_Tick);\n}\n\nvoid timer_Tick(object sender, EventArgs\
    \ e)\n{\n    switch (videoPlayer.CurrentState)\n    {\n        case MediaElementState.Playing:\n\
    \        case MediaElementState.Buffering:\n            if (videoPlayer.NaturalDuration.TimeSpan)\n\
    \            {\n                double total = videoPlayer.NaturalDuration.TimeSpan.TotalMilliseconds;\n\
    \                if (total > 0.0)\n                {\n                    double\
    \ elapsed = videoPlayer.Position.TotalMilliseconds;\n                    progressBar.UpdatePlaybackProgress(100.0\
    \ * elapsed / total);\n                }\n            }\n    }\n    break;\n```"
