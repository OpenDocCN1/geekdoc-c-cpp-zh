  md: "# CHAPTER 1 Type Fundamentals\n\nThis chapter explains the basics of creating\
    \ types in C#. If you are already familiar with C#, much of this chapter will\
    \ be a review for you.\n\nAfter we cover class members as fields, properties,\
    \ and methods, you'll learn after constructors, how to create and implement interfaces,\
    \ and when to use structs.\n\nThe information in this chapter is basic, but vital.\
    \ Like so many things, if you don't the fundamentals right, nothing else will\
    \ work out.\n\n# Create a Class\n\nScenario/Problem: You need to create a class\
    \ declaration.\n\nSolution: Let's begin by declaring a simple class that will\
    \ hold 3D coordinate points.\n\n```\n//default namespaces to import, that Visual\
    \ Studio includes in each file\nusing System:\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\n\nnamespace ClassSample\n{\n    //public\
    \ so that it's visible outside of assembly\n    public class Vertex3d\n}\n\n```\n\
    \nThe class we've defined is so empty so far, but we'll fill it up throughout\
    \ this chapter.\nThe class is defined as public, which means it is visible to\
    \ every other type that references its instance. C# defines a number of accessibility\
    \ modifiers, as detailed in Table 1.1.\n\nTABLE 1.1 Accessibility Modifiers\n\n\
    | Accessibility | Applicable To | Description |\n|---|---|--|\n| Public | Types,\
    \ members | Accessible to everybody, even outside the assembly |\n| Private |\
    \ Types, members | Accessible to code in the same type |\n| Internal | Types,\
    \ members | Accessible to code in the same assembly |\n| Protected | Members |\
    \ Accessible to code in the same type or derived type |\n| Protected internal\
    \ | Members | Accessible to code in the same assembly or a derived class in another\
    \ assembly |"
  merge: -1
