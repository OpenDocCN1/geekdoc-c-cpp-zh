  md: 'Windows Forms is the direct evolutionary step of Win32 programming and Microsoft
    Foundation Classes (MFC). It is relatively easy to learn and use for long-time
    programmers.


    Because Windows Forms have a lot of code that is generated and maintained for
    you by Visual Studio, many of the examples in this chapter requires that are not
    presented in the book. For the complete, runnable examples, please see the sample
    projects for this chapter on the book''s Web Site.


    # Create Modal and Modelless Forms


    > **Scenario/Problem:** You need to create a window that must be dealt with before
    the user can continue using the application, or you want to create a window that
    the user can keep up while using the rest of the application.


    Solution: Two types of forms are available: modal and modelless. Modal forms must
    be dealt with and dismissed the rest of the application can be used, whereas modeless
    forms can stick around while the user goes back and forth to other forms (see
    16.1).


    ![](img/c237887cbbac0db0e18bd0eecbc77950_312_0.png)


    FIGURE 16.1

    Modeless windows remain active, but only a single modal window can appear at a
    time.


    In .NET, there is a difference in how the forms are launched:


    ```

    // show form properly

    Popup form = new PopupForm();

    form.ShowDialog(this);

    ```


    and


    ```

    // show form modeless

    Popup form = new PopupForm();

    //setting the parent will allow better behavior of child and parent

    ```'
