    \            size.Width, size.Height,\n            ThumbnailAbortCallback, IntPtr.Zero);\n\
    \        thumbnail.Save(outputFile);\n    }\n    catch (OutOfMemoryException ex)\n\
    \    {\n        Console.WriteLine(ex);\n    }\n    catch (FileNotFoundException\
