  md: "Enumerations bridge the gap between numbers and objects. More than a numerical\
    \ ID, less than a struct, they fill that niche where you want a well-understood\
    \ name without any extra baggage. You can think of them as (mostly) type-safe\
    \ constants.\nEnumerations also provide type-safe functionality for flags.\n\n\
    # Declare an Enumeration\n\nScenario/Problem: You need to represent a limited\
    \ set of well-known, constant values. These can be a set of options, aliases for\
    \ IDs, or (as we'll see later) flags.\n\nSolution: Enumerations can be defined\
    \ within namespaces or classes with this syntax:\n\n```\nenum BookBinding\n{\n\
    \  None,\n  Hardcover,\n  Paperback\n}\n```\n\nThis code declares a BookBinding\
