    \ by telling C# that T must be a reference type, you can assign null to an instance\
    \ of type T.\n\nTo add a constraint, you add a clause after the declaration, as\
    \ in the examples in the following sections.\n\n# Constrain to a Reference Type\n\
    \nThe class keyword is used to denote a reference type, as in this example:\n\n\
    ```\nclass Indexer<T> where T : class {\n    public T DoSomething() {\n      \
    \  //now we can do this\n        return null;\n    }\nIndexer<string> index1 =\
    \ new Indexer<string>();//ok\nIndexer<int> index2 = new Indexer<int>();//not allowed!\n\
    ```\n\n# Constrain to a Value Type\n\nSometimes, you'll want to restrict interfaces\
    \ or collections—for example, for value types only. You can do this with the struct\
    \ keyword, as in this example:\n\n```\nclass Indexer<T> where T : struct {\n \
    \   T val;\n    public T DoSomething() {\n        return val;\n        //return\
    \ null;//not allowed!\n    }\nIndexer<int> index1 = new Indexer<int>();//ok\n\
    Indexer<string> index2 = new Indexer<string>();//not allowed!\n```\n\nNote that\
    \ even though the syntax says struct, any value type, including the built-in ones,\
    \ is allowed.\n\n# Constrain to an Interface or Base Class\n\nYou can constrain\
    \ to any type, whether it's an interface, base class, or a class itself. Anything\
    \ that is that type or derived from that type will be valid. By doing this, the\
    \ compiler allows you to call methods defined on the specified type. Here’s an\
    \ example:"
