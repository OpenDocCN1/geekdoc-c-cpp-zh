- img_proc: true
  md: "Solution: A common workflow for user authentication on websites is to wait\
    \ for a user to access a protected area, redirect him to a login form, send him\
    \ on to where he wanted to go. This is very easy to accomplish in ASP.NET.\n\n\
    First, you need to create your login page (see Listings 19.1 and 19.2).\n\n# LISTING\
    \ 19.1 LoginForm.aspx\n\n```\n<%@ Language=\"C#\" AutoEventWire=\"true\"\n   \
    \ CodeBehind=\"LoginForm.aspx.cs\"\n    Inherits=\"AuthDemo.LoginForm\" %>\n<!DOCTYPE\
    \ html PUBLIC \"-//W3C//DTD HTML 1.0 Transitional//EN\"\n    n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head run=\"server\">\n<title>LoginForm</title>\n\
    </head>\n<body>\n<form id=\"form1\" runat=\"server\">\n<div>\n  Username:\n  <asp:TextBox\
    \ ID=\"TextBoxUsername\" runat=\"server\" />\n  <br />\n  Password:<asp:TextBox\
    \ ID=\"TextBoxPassword\" runat=\"server\" />\n  <br />\n  <asp:Button ID=\"ButtonStatus\"\
    \ runat=\"server\" Text=\"Submit\"\n    onclick=\"ButtonStatus_Click\" />\n  <br\
    \ />\n  <asp:Label ID=\"LabelStatus\" runat=\"server\"\n    Text=\"Enter your\
    \ login info\" />\n</div>\n</form>\n</body>\n</html>\n```\n\n# LISTING 19.2 LoginForm.aspx.cs\n\
    \n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Web;\nusing System.Web.UI;\nusing System.Web.UI.WebControls;\nusing\
    \ System.Web.Security;\n```"
  merge: -1
  pgno: 423
- img_proc: true
  md: "# 408  CHAPTER 19 ASP.NET\n\nLISTING 19.2  LoginForm.aspx.cs (continued)\n\n\
    ```\nnamespace AuthDemo\n{\n    public partial class LoginForm : System.Web.UI.Page\n\
    \    {\n        protected void Page_Load(object sender, EventArgs args)\n    \
    \    {\n        }\n\n        protected void ButtonStatus_Click(object sender,\
    \ EventArgs args)\n        {\n            if (AuthenticateUser(TextBoxUsername.Text,\
    \ TextBoxPassword.Text))\n            {\n                //want to keep user logged\
    \ in? pass true instead\n                FormsAuthentication.RedirectFromLoginForm(TextBoxUsername.Text,\
    \ false);\n            }\n            else\n            {\n                LabelStatus.Text\
    \ = \"Oops\";\n            }\n        }\n\n        private bool AuthenticateUser(string\
    \ username, string password)\n        {\n            //you could authenticate\
    \ against a database or a file here\n            return username == \"user\" &&\
    \ password == \"pass\";\n        }\n    }\n}\n```\n\nThen add the following configuration\
    \ information to web.config under the <system.web> section:\n\n```\n<authentication\
    \ mode=\"Forms\">\n    <forms name=\".ASPAUTH\" loginUrl=\"LoginForm.aspx\" />\n\
    </authentication>\n<!-- Require authentication for all pages in this folder-->\n\
    <authorization>\n    <deny users=\"?\" />\n</authorization>\n```\n\nThe only other\
    \ page in this example is the default page, shown in Listing 19.3, which will\
    \ automatically be protected by login."
  merge: -1
  pgno: 424
- img_proc: true
  md: "# LISTING 19.3 Default.aspx\n\n```\n<@ Page Language=\"C#\" AutoEventWireup=\"\
    true\"\nCodeBehind=\"Default.aspx.cs\"\nInherits=\"AuthDemo..Default\" %>\n```\n\
    \n```\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 1.0 Transitional//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
