    # Match an Email (or Not)


    So far, we''ve seen some simple examples of regular expression validation, but
    what about something a little more complex, such as an email address? As it happens,
    this isn''t a little more complex—it''s a lot more complex! You will see that
    the syntax gets more complex, regular expressions can become quite large and unwieldy.
    In fact, it is not possible to do an absolutely correct email validation with
    regular expressions. That doesn''t stop people from trying, though. If you do
    a web search, you will come across many regular expressions for email addresses
    that range from a few lines to a few pages.


    Beware of turning to such things as a solution. Chances are, with such an enormous
    regular expression, you will not be able to understand it once written. There
    is also the possibility that the data format is just too complex and the regular
    expression can''t capture all of it. Also, you do not want to be in the position
    of refusing information from a user who has an unusual email address. That''s
    a user who may not come back! (You will notice that most websites don''t validate
    email addresses anyway—they ask the user to enter the address twice to make sure
    it''s correct).


    If you do need to use large, unreadable regular expressions, ensure that you have
    very thorough unit tests to cover your input cases. With unit tests, you''ll be
    able to modify the regular expression with confidence that you''re not breaking
    existing functionality.'
