  md: '# About the Author


    **Ben Watson** has been developing in .Net since its release. Before joining Microsoft,
    he worked as a lead developer for satellite imaging firm GeoEye, where he developed
    nautical communication systems in .Net. More recently, he has been working on
    the Query Pipeline team for Bing, where he helps design and implement massively
    scalable distributed systems and other internals of the search engine.'
