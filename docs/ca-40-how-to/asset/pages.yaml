    # Communicate Between Processes on the Same Machine (WCF)


    > Scenario/Problem: You need to communicate with a process running on the same
    machine.


    Solution: Use Windows Communication Foundation (WCF) with named pipe bindings.


    Before WCF, you had many, many communications choices, including COM, DCOM, .NET
    Remoting, SOAP, TCP/IP, HTTP, named pipes, and more. WCF wraps all of those into
    a single framework. It separates what you communicate from how you communicate.
    As you''ll see, you can change from using named pipes to HTTP with only configuration
    changes.


    WCF was designed from the ground up to unify communication technologies under
    a single framework. This allows you to be resilient to change when you need to
    modify how they communicate. In addition, you get an enormous amount of supporting
    abilities like security, auditing, extensibility, and more. If you need to use
    more one protocol, you can interact with both of them through the command interface
    of WCF rather than worrying about protocol specs. WCF can be in command-line APIs,
    GUIs, Windows services, or IIS components.


    WCF is a large enough topic for its own book (or series of books), but we''ll
    present enough to get you started.


    A WCF generally has three components:


    +   * A service interface and implementation. This can be implemented in the same
    assembly as the server, but it is useful to keep it in a separate assembly so
    that it can be used in multiple hosts if needed.


    +   * A server that hosts the service implementation.


    +   * A client that calls the server via a proxy class that implements the library’s
    interfaces.


    This section will handle each component in turn.'
