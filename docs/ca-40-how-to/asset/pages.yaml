  md: 'Suppose, for example, you have a line drawing consisting of a thousand points.
    If you want to rotate drawing 30 degrees? How could you do that? Would you change
    every single point? You could, but I don''t recommend it.


    Alternatively, suppose you have a shape you want to draw in multiple places on
    the screen. It doesn''t make sense to have multiple copies of the object in memory
    just to draw in different places.


    **Solution:** Both scenarios are easily handled with transformations, which are
    mathematical ways of manipulating coordinates with matrices. Frankly, .NET has
    a lot of built-in functionality that hides much of the complexity of transformations,
    as shown in the following sections.


    # Translate


    Translation is linearly moving an object. Its size and orientation remain unchanged.


    Rectangle ellipseRect = new Rectangle(25, 25, 100, 50);


    ```

    // Translation

    // move it 100 pixels down

    e.Graphics.TranslateTransform(0, 100)

    e.Graphics.FillEllipse(Brushes.Blue, ellipseRect)

    e.Graphics.ResetTransform();

    ```


    # Rotate


    The rotation amount is specified in degrees and is similar in usage to translation.


    ```

    // Rotation, angles are in degrees

    e.Graphics.RotateTransform(-15)

    e.Graphics.FillEllipse(Brushes.Red, ellipseRect)

    e.Graphics.ResetTransform();

    ```


    # Translate and Rotate


