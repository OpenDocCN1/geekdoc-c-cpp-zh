  md: "# Communicate Between Processes on the Same Machine (WCF)\n\nThe configuration\
    \ file is where the action is. In this case, it tells WCF to use named pipes to\
    \ communicate with clients, which is ideal for processes located on the same machine.\n\
    \n```\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<configuration>\n  <system.serviceModel>\n\
    \    <services>\n      <service name=\"FileServiceLib.FileService\"\n        \
    \       behaviorConfiguration=\"FileServiceMEXBehavior\">\n        <endpoint address=\"\
    net.namedPipedBining\"\n                  contract=\"FileServiceLib.IFileService\"\
    />\n        <!-- A MEX endpoint allows WCF to exchange code -->\n        <metadata\
    \ about your connection=\"mex\" />\n        <endpoint address=\"net.namedPipedBining\"\
    \n                  contract=\"IMetadataExchange\"/>-->\n        <host>\n    \
    \      <baseAddresses>\n            <add baseAddress=\"net.pipe://localhost/FileService\"\
    />\n          </baseAddresses>\n        </host>\n      </service>\n    </services>\n\
    \    <behaviors>\n      <behavior name=\"FileServiceMEXBehavior\">\n        <serviceMetadata\
    \ />\n      </behavior>\n    </behaviors>\n  </system.serviceModel>\n</configuration>\n\
    ```\n\nThe WCFHost project in the accompanying source code.\n\n# Create the Client\n\
    \nTo allow the client to communicate with the server seamlessly, without any knowledge\
    \ of the underlying protocols, you use a proxy class, which converts normal method\
    \ calls into WCF commands that eventually translate into bytes that go over the\
    \ network. You could create this class by hand, but it's easier to start up the\
    \ server and use a utility to generate it for you.\n\nThe file svcutil.exe ships\
    \ with the Windows SDK. It generates two files: a C# code file with the proxy\
    \ class implementation, and a configuration file to use in the client."
  merge: -1
