  md: "# Capture a Webcam\n\nScenario/Problem: You want to display video output from\
    \ an attached web camera.\n\nSolution: Use Silverlight 4’s support for video capture\
    \ devices.\n\nTo set this up, you need to first ask the user for permission to\
    \ use the web cam. If granted, you can assign the device to a CaptureSource object\
    \ and then assign that object to a VideoBrush. The VideoBrush can then be used\
    \ as the Fill brush for the destination control (a Rectangle in this case).\n\n\
    This technique is demonstrated in Listings 20.5 and 20.6.\n\n# LISTING 20.5 MainPage.xaml\n\
    \n```\n<UserControl x:Class=\"WebCam.MainPage\"\nxmlns=\"http://schemas.microsoft.com/\n\
    xmlns:winc=\"http://2006/xaml/presentation\"\nxmlns:x=\"http://schemas.microsoft.com/\n\
    xmlns:winc=\"http://2006/xaml\"\nxmlns:d=\"http://schemas.microsoft.com/\nxmlns:expression/blend/2008\"\
    \nxmlns:mc=\"http://schemas.openxmlformats.org/\nxmlns:markup-compatibility/2006\"\
    \nmc:Ignorable=\"d\"\nd:DesignHeight=\"300\" d:DesignWidth=\"400\">\n\n  <Grid\
    \ x:Name=\"LayoutRoot\" Background=\"White\">\n    <Rectangle x:Name=\"VideoRect\"\
    \ Fill=\"Bisque\"\n               Width=\"640\" Height=\"480\"\n             \
    \  VerticalAlignment=\"Top\"\n               HorizontalAlignment=\"Left\"/>\n\
    \    <Button Content=\"Start Webcam\"\n            Name=\"buttonStartWebcam\"\n\
    \            Width=\"98\"\n            Height=\"23\"\n            HorizontalAlignment=\"\
    Left\"\n            VerticalAlignment=\"Top\"\n            Click=\"buttonStartWebcam_Click\"\
    \ />\n  </Grid>\n</UserControl>\n```"
