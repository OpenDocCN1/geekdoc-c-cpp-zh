    \nFigure A.2\n\nNUnit's GUI is a great way to see at a glance which tests are\
    \ passing or failing.\n\n> NOTE Although you can and install NUnit into your local\
    \ system, you should also copy the main unit binaries into a subfolder in your\
    \ project, especially if you are using a source control system and/ automated\
