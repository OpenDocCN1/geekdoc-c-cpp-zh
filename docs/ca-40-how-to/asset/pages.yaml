  md: "Software is increasingly a web-based proposition, ASP.NET is a wonderful platform\
    \ for building advanced applications. With ASP.NET, you have access to the rich\
    \ functionality of the entire .NET Framework. Although the topic of ASP.NET is\
    \ large, this chapter gives you a jumpstart into the important topics.\n\n# View\
    \ Debug and Trace Information\n\n> **Scenario/Problem:** You need to debug an\
    \ ASP.NET application that is behaving badly, or you want to add your own trace\
    \ information to output.\n\nDebugging ASP.NET applications can be a very different\
    \ process from debugging native client applications. During development, Visual\
    \ Studio's integrated debugger gives you a lot of power, but once an application\
    \ is deployed, it's not always feasible to attach a debugger to a web app. Debug\
    \ and trace information becomes vitally important.\n\n**Solution:** ASP.NET has\
    \ built-in support for dumping a lot of data to logs or appending it to the bottom\
    \ of the page you're looking at so you can easily view it. The following sections\
    \ demonstrate a few different techniques you can use.\n\n# Enable Tracing for\
    \ a Specific Page\n\nTo enable tracing for a specific page, add Trace=\"true\"\
    \ to the @Page element in the .aspx file:\n\n```\n<%@Page Language=\"C#\" AutoWireup=\"\
    true\"\nCodeInherits=\"BrowserCapsAndTracing,\\_Default\" Trace=\"true\" %>\n\
    ```\n\nThis will cause details of the web request to be dumped to the end of the\
    \ web page (see Figure 19.1).\n\n# Enable Tracing for All Pages\n\nIf you cannot\
    \ modify the pages themselves, or want to see trace info on every page, you can\
    \ modify web.config to enable tracing on all pages:\n\n```\n<system.web>\n  <trace\
    \ enabled=\"true\" localOnly=\"true\" pageOutput=\"true\"/>\n  ...\n```"
  merge: -1
  pgno: 418
- img_proc: true
  md: "# Log Your Own Trace Messages\n\nYou can use the Trace class to write your\
    \ own messages to the trace log:\nprotected void Page_Load(object sender, EventArgs\
    \ e)\n\n```\n{\n    if (IsPostBack)\n    {\n        Trace.Write(\"Creating Capabilities\
    \ Table\");\n        Table1.Rows.AddRange(\n            new TableRow[]\n{\n  \
    \              CreateCapabilityRow(\"ActiveX\",\n                Request.Browser.ActiveXControls),\n\
    \            })\n        );\n    }\n}\n```\n\nYou can see the message \"Creating\
    \ Capabilities Table\" in the trace output in Figure 19.1.\n\n![](img/c237887cbbac0db0e18bd0eecbc77950_419_0.png)\n\
    \nFigure 19.1\nTracing can dump of the request to the end of the produced page."
  merge: -1
