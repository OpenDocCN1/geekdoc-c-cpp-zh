  md: "Solution: Your exception can contain whatever data you desire, but there are\
    \ a few guidelines to follow. In particular, you should have certain standard\
    \ constructors:\n\n+   - No arguments (default constructor).\n\n+   - Takes a\
    \ message (what is returned by the Message property).\n\n+   - Takes a message\
    \ and an inner exception.\n\n+   - Takes data specific to your exception.\n\n\
    +   - Serialization objects. Exceptions should always be serializable and should\
    \ override GetObject(from ISerializable).\n\nHere is a sample exception that implements\
    \ all of these recommendations:\n\n```\n[Serializable]\npublic class MyException\
    \ : Exception, ISerializable\n{\n    private double _exceptionData = 0.0;\n\n\
    \    public double ExceptionData\n    {\n        get { return _exceptionData;\
    \ }\n    }\n\n    public MyException()\n{\n}\n\n    public MyException(string\
    \ message)\n    :base(message)\n{\\}\n\n    public MyException(string message,\
    \ Exception innerException)\n    : base(message, innerException)\n{\\}\n\n   \
    \ public MyException(double exceptionData, string message)\n    :base(message)\n\
    \    {\n        _exceptionData = exceptionData;\n    }\n\n    public MyException(double\
    \ exceptionData, string message, Exception innerException)\n    :base(message,\
    \ innerException)\n```"
