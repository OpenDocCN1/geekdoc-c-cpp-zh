  md: "# Use a Timer\n\nScenario/Problem: You want to call a function at regular intervals,\
    \ or just once after a specified interval.\n\nSolution: Use a timer. .NET provides\
    \ many types of timers, but perhaps one of the most common and easiest to use\
    \ is the System.Windows.Forms.Timer class, which uses the normal event-handling\
    \ mechanism to notify users when it ticks.\n\nHere's a simple example that alternates\
    \ the text in a Label every second. The Button and Label are defined in Form's\
    \ code-behind file, which you can find in the TimerDemo sample project for this\
    \ chapter.\n\n```\npublic partial class Form1 {\n    private Timer _timer;\n \
    \   bool _tick = true;\n    bool _stopped = true;\n\n    public Form1() {\n  \
    \      Initialize();\n\n        _timer = new Timer();\n        _timer.Interval\
    \ = 1000;//1 second\n        _timer.Tick += new EventHandler(_timer_Tick);\n \
    \   }\n\n    void _timer_Tick(object sender, EventArgs e) {\n        labelOutput.Text\
    \ = _tick ? \"Tick\" : \"Tock\";\n    }\n```\n\n![](img/c237887cbbac0db0e18bd0eecbc77950_329_0.png)"
  merge: -1
  pgno: 329
- img_proc: true
  md: "```\n_tick = !tick;\n}\n\nprivate void buttonStart_Click(object sender, EventArgs\
    \ e)\n{\n    if (_stopped){\n        _timer.Enabled = true;\n        buttonStart.Text\
    \ = \"&Stop\";\n    } else {\n        _timer.Enabled = false;\n        buttonStart.Text\
    \ = \"&Start\";\n    }\n    _stopped = !stopped;\n}\n```\n\n> **NOTE** Be wary\
    \ of the accuracy of timers. This timer is implemented using the normal event\
    \ model and is not designed to be super-accurate. For a more accurate timer, you\
    \ can use the one discussed in Chapter 23, \"Threads, Asynchronous, and Parallel\
    \ Programming.\\ Even then, however, don't put all your trust in its accuracy.\
    \ Windows is not a real-time operating system and is therefore not guaranteed\
    \ to honor strict timing requests.\n\n# Use Application and User Configuration\
