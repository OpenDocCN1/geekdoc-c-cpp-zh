  md: '# CHAPTER 26 Interacting with the OS and Hardware


    ![](img/c237887cbbac0db0e18bd0eecbc77950_608_0.png)


    FIGURE 26.1


    You can choose the target architecture of your assemblies.


    However, there are times when it''s not that simple. If your .NET assembly needs
    to reference or import with another unmanaged assembly or managed DLL that was
    compiled with a specific architecture, then your assembly needs to match.


    Let''s look at an example. Suppose you have the following:


    +   - .NET assembly: Any CPU

    - 32-bit COM component


    On a 32-bit operating system, this scenario will work because the .NET assembly
    will be just-in-time compiled as 32 bits.


    However, on a 64-bit operating system, the .NET assembly will be 64 bits, and
    when it tries to call the COM component, things will break.


    In this case, it would be better to specify that your assembly should always be
    32 bit. Keep in mind that x64 operating systems run 32-bit processes just fine.


    Another consideration to keep in mind is that while .NET itself largely isolates
    you from platform architecture considerations, when you drop into unsafe code,
    use pointers, or rely on the size of IntPtr, you are asking for trouble when running
    on multiple architectures.'
