    \ buffer = new byte[size];\n    int returnVal = SayHello(buffer, size);\n    string\
    \ result = Encoding.ASCII.GetString(buffer,0, returnVal);\n    Console.WriteLine(\"\
    \"{0}\", return value: {1}\", result, returnVal);\n}\n```\n\n# Use Memory-Mapped\
    \ Files\n\n> Scenario/Problem: You want to access a file as if it were a memory\
    \ buffer, or you need to access a file that is too large to put entirely in memory.\n\
    \nSolution: Memory-mapped files are not the most used technology, but when you\
    \ need them, they are very good at what they do. Memory-mapped files are exactly\
    \ what they sound like: A portion of a file is put into memory. What's the difference\
    \ between that and just reading the file in with a FileStream, you ask? Well,\
    \ what if the file is 100GB in size?\n\nAs of this writing, loading a file that\
    \ size into memory is out of the question for modern computers. Memory-mapped\
    \ files allow you to specify a portion of that file to load into memory, where\
    \ you can manipulate it as much as any in-memory structure, such as an array,\
    \ and the changes are written back to the file automatically."
