  md: "```\n//these are public fields so that we can use \"ref\" to simplify\n//the\
    \ algorithms\npublic Node<T> LeftChild;\npublic Node<T> RightChild;\n```\n\n```\n\
    public Node(T val)\n{ this.Value = val; this.LeftChild = this.RightChild = null;\n\
    public Node(T val, Node<T> left, Node<T> right)\n{ this.Value = val;\n  this.LeftChild\
    \ = left; this.RightChild = right; }\n```\n\n```\nprivate Node<T> _root;\nprivate\
    \ int _count = 0;\n```\n\nBecause binary search trees depend on comparing items\
    \ to get their ordering correct, we must ensure that type T is comparable. We'll\
    \ implement ICollection<T> and IEnumerable<T> on this collection (neither IList<T>\
    \ nor IDictionary<TKey, TValue> seem to make sense with a binary search tree).\n\
    \nHere are the ICollection<T> methods:\n\n```\npublic void Add(T item)\n{\n  AddImpl(new\
    \ Node<T>(item), ref _root);\n}\n```\n\n```\n//a convenience method for adding\
    \ multiple items at once\npublic void Add(params T[] items)\n{\n  foreach (T item\
    \ in items)\n  {\n    Add(item);\n  }\n}\n```\n\n```\n//recursively finds where\
