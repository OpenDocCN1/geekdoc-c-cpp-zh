- img_proc: true
  md: 'Solution: Assuming the following code, you have a few options:


    Assembly assembly = Assembly.LoadFrom("DynamicInstantiateLib.dll");


    Type type = assembly.GetType("DynamicInstantiate.TestClass");

    object obj = Activator.CreateInstance(type);


    # Method 1:


    ```

    //invoke the Add method

    int result = (int)type.InvokeMember("Add", BindingFlags.Instance |

    BindingFlags.InvokeMethod | BindingFlags.Public,

    null, obj,

    new object[] { 1, 2 });

    ```


    Note that the obj because an instance method, and obj is that instance.


    # Method 2:


    InvokeMember does not work for generic methods, so here''s another way (also valid

    for Add):


    ```

    MethodInfo mi = type.GetMethod("CombineStrings");

    MethodInfo genericMi = mi.MakeGenericMethod(typeof(double));

    string combined = (string)genericMi.Invoke(obj, new object[] {2.5, 5.5});

    ```


    # Method 3:


    New in C# 4.0, you can use dynamic types to have the method called at

    runtime, as essentially a shortcut syntax for the previous methods:


    ```

    //invoke the Add method using dynamic

    dynamic testClass = Activator.CreateInstance(type)

    result = testClass.Add(5, 6);

    ```


    ```

    //invoke the CombineStrings using dynamic

    combined = testClass.CombineStrings<double>(13.3, 14.4);

    ```


    You won''t get IntelliSense with dynamic types, but this definitely cleaner than

    using MethodInfo objects and Invoke calls.


    > Beware: Putting off type checking until runtime has its costs, mostly in

    unforeseen errors. Take advantage of compiler-enforced static typing whenever
    possi-

    ble and only use dynamic typing when absolutely necessary.'
