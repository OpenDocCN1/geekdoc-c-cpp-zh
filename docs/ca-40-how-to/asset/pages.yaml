- img_proc: true
  md: "The sorting function is simple. It takes an object of Vertex3d and returns\
    \ one of three values:\n\n| < 0 | this is less than other |\n| 0 | this is same\
    \ as other |\n| > 0 | this is greater than other |\n\nWithin the CompareTo function,\
    \ you can do anything you want to arrive at those values. In our case, we can\
    \ do the comparison ourselves or just call the same function on the _id field.\n\
    \n```\nstruct Vertex3d : IFormattable, IEquatable<Vertex3d>,\\IComparable<Vertex3d>\n\
    {\n    private int _id;\n\n    public int Id\n    {\n        get {\n         \
    \   return _id;\n        }\n        set {\n            _id = value;\n        }\n\
    \    }\n\n    public Vertex3d(double x, double y, double z)\n    {\n        _x\
    \ = x;\n        _y = y;\n        _z = z;\n        _id = 0;\n    }\n    ...\n \
    \   public int CompareTo(Vertex3d other)\n    {\n        if (_id < other._id)\n\
    \            return -1;\n        if (_id == other._id)\n            return 0;\n\
    \        return 1;\n        /* We could also just do this:\n         * return\
    \ _id.CompareTo(other._id); */\n    }\n```"
