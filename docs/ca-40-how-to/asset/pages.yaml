  md: "```\npublic override bool HitTest(System.Drawing.Point location)\n{\n    /*\n\
    \     * X^2 + Y^2 = R^2 is the formula for a circle.\n     * Where R is the radius\n\
    \     * A point is in the circle if X^2 + Y^2 <= R^2\n     *\n     * This formula\
