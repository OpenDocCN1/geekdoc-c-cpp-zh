    \ sample project for the full source code.\n\n# Add a Custom Attribute\n\nScenario/Problem:\
    \ You want to attach metadata to a class, method, property, field, event, or method\
    \ argument.\n\nSolution: Define attribute class. Attributes are used extensively\
    \ in .NET. You've seen in Chapter 11, \"Files and Serialization,\" that all you\
    \ need to do to get basic serialization working on a class is to add the [Serializable]\
    \ attribute above the class definition. In Chapter 12, \"Networking and the Web,\"\
    \ you saw that attributes on methods define service interfaces in WCF.\n\nThere\
    \ is nothing magical about Attributes, however. They all do is attach metadata\
    \ to another piece of code. It's up to your code to extract that metadata and\
    \ do something with it.\n\nThe following example shows a simple attribute (which\
    \ we used in Chapter 6, \"Enumerations\") that allows a developer to attach a\
    \ culture string to any other construct.\n\n```\n//attribute class name must end\
    \ in \"Attribute\"\n[AttributeUsage(AttributeTargets.All, AllowMultiple=true)]\n\
    class CultureAttribute : Attribute\n{\n    string _culture;\n\n    public string\
    \ Culture\n    {\n        get {\n            return _culture;\n        }\n   \
    \ }\n\n    public CultureAttribute(string culture)\n    {\n        _culture =\
    \ culture;\n    }\n}\n```"
