    # Use Complex Numbers


    Scenario/Problem: Many engineering and mathematical problems require the use of
    imaginary numbers, often represented in the form 4+3i, where i is the square root
    of -1.


    Solution: Use the System.Numerics.Complex class to represent imaginary numbers.
    Complex wraps both the real and imaginary parts using doubles as the underlying
    format.


    ```

    Complex a = new Complex(2, 1);

    Complex b = new Complex(3, 2);

    Console.WriteLine("a = {0}", a);

    Console.WriteLine("b = {0}", b);

    Console.WriteLine("a + b = {0}", a + b);

    Console.WriteLine("pow(a={0}", Complex.Pow(a,2));

    Console.WriteLine("a / 0 = {0}", a / Complex.Zero);

    ```


    ```

    // will assign -1 to the real part, and 0 to the imaginary part

    Complex c = -1;

    Console.WriteLine("c = {0}", c);

    Console.WriteLine("Sqrt(c) = {0}", Complex.Sqrt(c));

    ```


    This has the output


    ```

    a = (2, 1)

    b = (3, 2)

    a + b = (5, 3)

    pow(a,2) = (3, 4)

    a / 0 = (NaN, NaN)

    c = (-1, 0)

    Sqrt(c) = (0, 1)

    ```


    # Format a Complex Number


    While (a, b) is a valid format for imaginary numbers, it is common to see it written
    a+bi instead. This is easily accomplished with a custom formatter (as you learned
    in Chapter 2, "Creating Versatile Types")'
