  md: "# Make Types Equatable\n\nwant to provide your behavior. With value types,\
    \ the default behavior is to reflect\nover each field and do a bit-by-bit comparison.\
    \ This can have a very negative impact\non performance, and in nearly every case\
    \ you should provide your own implementa-\nof Equals().\n\n```\nstruct Vertex3d\
    \ : IFormattable, IEquatable<Vertex3d>\n{\n    ...\n    public override bool Equals(object\
    \ obj)\n    {\n        if (obj == null)\n            return false;\n        if\
    \ (obj.GetType() != this.GetType())\n            return false;\n        return\
    \ Equals((Vertex3d)obj);\n    }\n\n    public bool Equals(Vertex3d other)\n  \
    \  {\n        /* If Vertex3d were a reference type you would also need:\n    \
    \       * if ((object)other == null)\n           * return false;\n           *\
    \ if (!base.Equals(other))\n           * return false;\n        */\n\n       \
    \ return this._x == other.x\n            && this._y == other._y\n            &&\
    \ this._z == other._z;\n    }\n}\n```\n\n> >Pay special attention to the note\
    \ in Equals(Vertex3d other). If Vertex3d\nwas a reference type and other was null,\
    \ the type-safe version of the function was\ncalled, the Object version. You also\
    \ need to call all the base classes in the\nhierarchy so they have an opportunity\
    \ to check their fields.\n\nThere’s nothing stopping you from also implementing\
    \ IEquatable<string> (or any\nother type) on your type—you can define it however\
    \ you want. Use with caution,\nhowever, because this may confuse people have to\
    \ use your code."
