  md: "# 226  CHAPTER 12 Networking and the Web\n\nMy copy of scutil.exe is located\
    \ in C:\\Program Files (x86)\\Microsoft SDKs\\Windows\\v7.0\\bin\\. Your location\
    \ may vary. After starting the server, I ran the following command at the console:\n\
    \n```\nD:\\>C:\\Program Files (x86)\\Microsoft SDKs\\Windows\\v7.0\\bin\\\n->scutil.exe\"\
    \n->net.pipe://localhost/FileService :out:FileServiceLib_Proxy.cs\n->config:app.config\n\
    ```\n\n> Visual Studio can also generate a proxy class for the Add Service Reference\
    \ dialog. However, if you have multiple developers working on a project, you should\
    \ stick to using scutil.exe because Visual Studio generates additional metadata\
    \ fields that also need to be checked in, but these can be different on different\
    \ machines, which can cause headaches. It's better to just avoid it.\n\n> The\
    \ proxy is generated for the interface and is the same regardless of which protocol\
    \ is used. This allows you to make protocol changes in the configuration without\
    \ having to rebuild the application.\n\nIn example, the client is a Win app that\
    \ allows you to call each service method and then shows the results.\n\nFirst,\
    \ add both of the scutil.exe-generated files to the project. The app.config file\
    \ looks similar to:\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<configuration>\n\
    \  <system.serviceModel>\n    <bindings>\n      <netnamedPipeBinding>\n      \
    \  <binding name=\"NetNamedPipeBinding_IFileSync\"\n          closeTimeout=\"\
    00:01:00\"\n          openTimeout=\"00:01:00\" receiveTimeout=\"00:10:00\"\n \
    \         sendTimeout=\"00:01:00\"\n          transactionFlow=\"false\" transferMode=\"\
    Buffered\"\n          transactionProtocol=\"OleTransactions\"\n          hostNameComparisonMode=\"\
    StrongWildcard\"\n          maxPoolSize=\"524288\"\n          maxBufferSize=\"\
    65536\" maxConnections=\"10\"\n          maxReceivedMessageSize=\"65536\">\n \
    \       <readerQuotas\n          maxDepth=\"32\"\n          maxStringContentLength=\"\
    8192\"\n          maxArrayLength=\"16384\"\n          maxBytesPerDay=\"4096\"\n\
    \          maxNameTableCharCount=\"16384\" />\n        </readerQuotas>\n     \
    \ </binding>\n    </netnamedPipeBinding>\n    </bindings>\n    <security mode=\"\
    transport\">\n      <transport protectionLevel=\"EncryptAndSign\" />\n```"
