  md: "Using threads can give you great power, but as the old saying goes, with great\
    \ power comes great responsibility. Using threads irresponsibly can easily lead\
    \ to poor performance and unstable applications. However, using good techniques\
    \ with threads can produce programs with higher efficiency and more responsive\
    \ interfaces.\n\nThankfully, much research has been done in recent years in an\
    \ attempt to simplify multithreading. In particular, the Task Parallel Library,\
    \ now a part of .NET 4, allows you to easily split your code execution onto multiple\
    \ processors without any messing around with threads or locks.\n\n# Easily Split\
    \ Work Among Processors\n\n> Scenario/Problem: You have a task that is easily\
    \ split independent subtasks, or you have data that can be partitioned and computed\
    \ separately.\n\nSolution: Use the Parallel class in the System.Threading namespace\
    \ to assign tasks to be automatically scheduled and wait for them to complete.\
    \ The Parallel class automatically scales to the number of processors.\n\n# Process\
    \ Data in Parallel\n\nWhen you have a set of data that can be split over multiple\
    \ processors and processed independently, you can use constructs such as Parallel.For(),\
    \ as in this example computing prime numbers:\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading;\nusing System.Diagnostics;\n\
    using System.Threading.Tasks;\n```\n\n```\nnamespace TPLPrimes\n{\n    class Program\n\
