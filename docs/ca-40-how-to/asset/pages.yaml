  md: "# Connect and Retrieve Data\n\n**Scenario/Problem:** You need to connect to\
    \ a database and run a simple query against it.\n\n**Solution:** Most database\
    \ access is based around the following set of steps:\n\n+   1. Create a connection\
    \ using a connection string.\n2. Create a command using SQL syntax.\n3. Execute\
    \ the command upon connection and possibly get data back.\n\nWe'll see specific\
    \ examples of this in the following sections. Most code samples in this chapter\
    \ require the System.Data.SqlClient namespace, even though it's not always explicitly\
    \ referenced in the code samples.\n\n# Connect to SQL Server\n\n.NET ships with\
    \ a connector for SQL Server, we'll start with an example of that:\n\n```\nstatic\
    \ void Main(string[] args)\n{\n    try\n    {\n        string connectionString\
    \ = GetConnectionString();\n        using (SqlConnection conn = new SqlConnection(connectionString))\n\
    \        {\n            conn.Open();\n            //don't forget to pass the connection\
    \ object to the command\n            using (SqlCommand cmd = new SqlCommand(\n\
    \                \"SELECT * FROM Books\", conn))\n            {\n            \
    \    using (SqlDataReader reader = cmd.ExecuteReader())\n                {\n \
    \                   //SqlDataReader reads the rows one at a\n                \
    \    //at time from the database\n                    //as you request them\n\
    \                    while (reader.Read())\n                    {\n          \
    \              Console.WriteLine(\"{0}\\t{1}\\t{2}\",\n                      \
    \      reader.GetInt32(0),\n                            reader.GetString(1),\n\
    \                            reader.GetInt32(2));\n                    }\n   \
    \             }\n            }\n        }\n    }\n    }\n```"
