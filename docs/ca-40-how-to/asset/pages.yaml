    \     FileMode.Open);\n    _buffer = new byte[inputStream.Length];\n    //pass\
    \ in the inputStream as the argument to the \"Done\" method\n    IAsyncResult\
    \ result = inputStream.BeginRead(buffer, 0,\n        buffer.Length,\n        FileReadDone,\n\
    \        inputStream);\n```"
