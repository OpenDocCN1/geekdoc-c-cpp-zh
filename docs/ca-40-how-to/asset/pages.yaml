  md: "# 450 CHAPTER 20 Silverlight\n\n# LISTING 20.4 PlayDownloadProgressControl.xaml\
    \ (continued)\n\n```\npublic void UpdatePlaybackProgress(double playbackPercent)\n\
    {\n    PlaybackProgress.X2 = PlaybackProgress.X1 +\n    (playbackPercent * LayoutRoot.ActualWidth\
    \ / 100.0);\n}\n\npublic void UpdateDownloadProgress(double downloadPercent)\n\
    {\n    DownloadProgress.X2 = DownloadProgress.X1 +\n    (downloadPercent * LayoutRoot.ActualWidth\
    \ / 100.0);\nn}\n```\n\nTo incorporate this video player app, add the following\
    \ bolded lines to the\n MainPage.xml file from Listing 20.1:\n\n```\n...\n<MediaElement\
    \ Grid.Row=\"0\"\n    x:Name=\"videoPlayer\"\n    Stretch=\"Fill\"\n    DownloadProgressChanged=\"\
    videoPlayer_DownloadProgressChanged />\n</MediaElement>\n<local:PlayDownloadProgressControl\
    \ x:Name=\"progressBar\"\n    Height=\"4\" Grid.Row=\"0\"\n    VerticalAlignment=\"\
    Bottom\"/>\n<StackPanel Grid.Row=\"1\">\n...\n```\n\nThe DownloadProgressChanged\
    \ event notifies you when a new chunk has been\ndownloaded so you can update the\
    \ progress:\n\n```\nprivate void videoPlayer_DownloadProgressChanged(object sender,\n\
    \    RoutedEventArgs e)\n{\n    progressBar.UpdateDownloadProgress(\n        100.0\
    \ * videoPlayer.DownloadProgress);\n}\n```\n\nHowever, there is no equivalent\
    \ event for playback progress (which makes sense if you\nthink about it. How often\
    \ should an event fire that frequently? Every millisecond\nSecond? Every minute?)\
    \ Because playback is application dependent, it is up to\ny monitor the playing\
