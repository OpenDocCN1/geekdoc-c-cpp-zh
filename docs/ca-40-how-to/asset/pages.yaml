  md: "Solution: The first way to store this is in the global Application static class,\
    \ accessible from any page:\n\n```\nprotected void Page_Load(object sender\n```\n\
    \nIf you have data that you want to expire at some point, you can instead use\
    \ the application cache:\n\n```\nprotected void Page_Load(object sender, EventArgs\
    \ e)\n{\n    //will not expire from cache\n    Context.Cache[\"MyData\"] = myDataSet;\n\
    \nContext.Cache.Add(\n    \"MyExpiringData\",\n    myExpiringDataSet,\n    //\
    \ other cache objects that depend on this one\n    null,\n    // absolutely remove\
    \ from cache in one hour\n    DateTime.UtcNow.AddHours(1),\n    // until then,\
    \ remove 15 minutes after last access\n    TimeSpan.FromMinutes(15),\n    System.Web.Caching.ItemPriority.Normal,\n\
    \    // delegate to call when an object is removed from cache\n    null\n)\n```\n\
    \n# Maintain UI State\n\nScenario/Problem: You have state associated with a specific\
    \ control that needs to be maintained across page loads.\n\nSolution: The standard\
    \ ASP.NET controls use called View state to encode their values from one page\
    \ load to another. View state is included as a hidden field in the request object.\
    \ You can include your own information as well."
