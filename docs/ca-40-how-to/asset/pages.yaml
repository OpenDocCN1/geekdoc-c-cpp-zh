  md: "# Use Lambda Expression Syntax for Anonymous Methods\n\n**Scenario/Problem:**\
    \ You want an anonymous method with simplified syntax.\n\n**Solution:** Use the\
    \ lambda expression syntax for anonymous methods. Lambda expressions can be used\
    \ for anonymous methods, as well as to create expression trees in LINQ. This code\
    \ does the same thing as the previous example:\n\n```\npublic partial class Form1\
    \ : Form\n{\n    Point prevPt = Point.Empty;\n    public Form1()\n    {\n    \
    \    InitializeComponent();\n        // the type of the arguments can be inferred\
    \ by the compiler\n        this.MouseMove += (sender, e) =>\n        {\n     \
    \       if (prevPt != e.Location)\n            {\n                this.textBox1.AppendText(\n\
    \                    string.Format(\"MouseMove: {0},{1}\", e.X, e.Y));\n     \
    \           + Environment.NewLine,\n                prevPt = e.Location;\n   \
    \         }\n        n\n        // a single-line lambda expression is really simple\n\
    \        this.MouseClicked += (sender, e) =>\n            this.textBox1.AppendText(string.Format(\"\
    MouseClicked: {0},{1} 2\" + \n            Environment.NewLine, e.X, e.Y, e.Button));\n\
    \n        this.MouseDown += (sender, e) =>\n            this.textBox1.AppendText(\"\
    *MouseDown\" +\n            + Environment.NewLine);\n        this.MouseUp += (sender,\
    \ e) =>\n            this.textBox1.AppendText(\"*MouseUp\"\n            + Environment.NewLine);\n\
    \    }\n}\n```"
