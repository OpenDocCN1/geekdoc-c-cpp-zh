  md: '# CHAPTER 5 Numbers


    # Group Digits


    To group digits, use the "N" format option, as shown here:


    ```

    int number = 12345;

    Console.WriteLine(number.ToString("N", CultureInfo.InvariantCulture));

    ```


    This produces the following output:


    ```

    12,345

    ```


    # Print Leading Zeros


    You can print leading zeros with the D and X format strings. The number specifies
    the total number of digits to output. If this number is greater than the number
    of digits in the number, the output is padded with zeros; otherwise, the number
    is output normally. Here''s an example:


    ```

    int number = 12345;

    Console.WriteLine(number.ToString("D8", CultureInfo.InvariantCulture));

    ```


    And here''s the output:


    ```

    0012345

    ```


    # Specify Number of Decimal Places


    You can specify the number of decimal places with the C, E, F, G, N, and P format
    strings:


    ```

    double number = 12345.6789;

