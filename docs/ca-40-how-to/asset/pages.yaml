    \ 1,-1,-1\"\nTriangleIndices=\"0 1 2 0 2 3\"/>\n\n<MaterialGroup x:Key=\"defaultMaterial\"\
    >\n  <DiffuseMaterial Brush=\"*Red*\" />\n  <SpecularMaterial SpecularPower=\"\
    *30* Brush=\"*Yellow*\" />\n</MaterialGroup>\n</Window.Resources>\n```\n\nThe\
