  md: '# Localize a Windows Forms Application


    > **NOTE** .Net, culture applies to a thread. Each thread actually has two culture
    settings: culture and UI culture.


    The culture is automatically determined from your region format. In Windows, this
    is set in Control Panel | Region and Language | Formats. This determines the default
    formats of numbers, times, and currencies in string formatting (see Chapter 5),
    but does not affect which localized resources are used.


    The UI culture is automatically determined from the computer''s native display
    language. To view the Windows UI in other languages, you need a localized copy
    of Windows, or you can install a language pack (only available with certain editions
    of Windows). Windows 7 lets you change language in Control Panel | Region and
    Language | Keyboards and Languages | Display language.


    To ease testing for the purposes of this section, the UI culture is manually set
    to be the same as the non-UI culture in configuration files or in the application
    startup code.


    > **NOTE** .Net applications, regardless of platform, obey a hierarchy when looking
    for resource files. They look from most specific to least specific, until they
    get to the default resource properly (usually the application executable itself)

    ultures can be specified with either just the language (French: "fr") or the language
    and a region (French-Canada: "fr-CA"). You must create all of resource files using
    this standard naming scheme. If resources are stored in a file called Resources.dll,
    .Net will look for files in this order:


    +   1. Resources.fr-CA.dll

    2. Resources.fr.dll

    3. Resources.dll

    4. Application.exe


    This general pattern holds true, even if resources are stored in separate folders.


    # Localize a Windows Forms Application


    Windows Forms has the strongest support for localization in the Visual Studio
    IDE. To localize a form, follow these steps:


    +   1. Change the form''s Localizable property to true.

    2. Change the form''s Language property to each language you wish to localize.
    This will generate new resource files for the form, such as Form1.resx, Form1.itx,
    and so on.

    3. With the appropriate language selected, modify the text and other properties
    (such as location or size) of each element you wish to localize.

    4. To add a new control, you must set the language back to Default.'
