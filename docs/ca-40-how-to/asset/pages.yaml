  md: "# CHAPTER 1 Type Fundamentals\n\n+   - Properties can have get, set, or both.\n\
    - In properties, value is the implied argument (that is, in the code).\n\nIn the\
    \ following example, 13.0 would be passed to X in the value argument:\n\n```\n\
    Vertex3 v = new Vertex3d();\nv.X = 13.0;\n```\n\n# Use Auto-Implemented Properties\n\
    \nYou will often see the following pattern:\n\n```\nclass MyClass\n{\n    private\
    \ int _field = 0;\n    public int Field { get { return _field; } set { _field\
    \ = value; } }\n}\n```\n\nC# as a shorthand syntax for this:\n\n```\nclass MyClass\n\
    {\n    public int Field {get;set;}\n\n    //must initialize value in constructor\
    \ now\n    public MyClass()\n    {\n        this.Field = 0;\n    }\n}\n```\n\n\
    > NOTE You cannot have an auto-implemented property with only a get (if there’s\
    \ no backing field, how would you set it?), but you can have a private set:\n\
    public int Field { get; private set; }\n\n# Define Static Members\n\n> Scenario/Problem:\
    \ You need to define data or methods that apply to the type, not individual instances.\
    \ They are also often used for methods that operate on multiple instances of the\
    \ type.\n\nSolution: Add the modifying keyword static, as in the following method\
    \ for adding two Vertex3 objects:"
