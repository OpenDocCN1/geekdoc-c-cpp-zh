  md: "```\npublic class DerivedClass : BaseClass\n{\n    public DerivedClass()\n\
    \    : base(1, 2, 3)\n{\n}\n}\n```\n\n# Override a Base Class’s Method or Property\n\
    \n**Scenario/Problem:** You want to override a base class’s behavior in your child\
    \ class.\n\n**Solution:** The base class’s method or property must be declared\
    \ virtual and must be accessible from the derived class. The derived class will\
    \ use the override keyword.\n\n```\npublic class Base\n{\n    Int32 _x;\n    public\
    \ virtual Int32 MyProperty\n    {\n        get\n        {\n            return\
    \ _x;\n        }\n    }\n\n    public virtual void DoSomething()\n    {\n    \
    \    _x = 13;\n    }\n}\n```\n\n```\npublic class Derived : Base\n{\n    public\
    \ override Int32 MyProperty\n    {\n        get\n        {\n            return\
    \ _x * 2;\n        }\n}\n```"
