  md: "# Use the Asynchronous Programming Model\n\n# # Use the Asynchronous Programming\
    \ Model\n\n**Scenario/Problem: You have many actions in your application that\
    \ can be accomplished in the background.\n\nOn many I/O classes, you will find\
    \ a common set of methods. For example, from streams you can call Read or BeginRead.\
    \ The first is a synchronous method that does not return until the data has been\
    \ read. The second returns immediately, letting your program continue while the\
    \ file is read from disk, the network, or another data source.\n\n**Solution:**\
    \ The TextTokenizer app, shown in Figure 23.4, demonstrates how to use this method\
    \ of programming. If only synchronous methods were used, it would be impossible\
    \ to interact with the program (even just to close it!), but asynchronous methods\
    \ allow your program to respond to users and perform other tasks while the I/O\
    \ is completing.\n\n![](img/c237887cbbac0db0e18bd0eecbc77950_531_0.png)\n\nFIGURE\
    \ 23.4\n\nThe TextTokenizer app demonstrates asynchronous file reading as well\
    \ as implementing asynchronous BeginXXX methods on your own class.\n\n```\nprivate\
    \ void button_Click(object sender, EventArgs e)\n{\n    UpdateProgress(\"Reading\
