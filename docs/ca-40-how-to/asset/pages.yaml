  md: '# CHAPTER 25 Application Patterns and Tips


    | TABLE 25.1 Pros and Cons of WPF Localization techniques |

    | Pros | Cons |

    |---|---|

    | XAML | Localization completely separate from development process | No easy way
    to repeat process with UI updates, unless you are extremely good at version control
    |

    | More efficient than data binding | The tool is unsupported Hard to integrate
    with resource files |

    | | Easy to modify CSV files | No Visual Studio support |

    | Resources and data binding | Data-binding is easy and well-understood by WPF
    developers | No type conversion You must manually map each XAML element to a resource
    |

    | | Bindings are strongly typed and checked by the | | works on dependency properties
    |

    | | Resources are relatively easy to manage, and are similar to the other .Net
    platforms | Some tools, such as Blend, do not load resources from satellite assemblies
    (yet) |


    # XAML Localization


    To localize your WPF application using the XAML method, follow these steps:


    +   1. Manually edit the project file and add `<Culture>en-US</Culture>` under
    the `<PropertyGroup>` section.

    2. Add this line to your `AssemblyInfo.cs` file:

    `[assembly: NeutralResourcesLanguageAttribute("en-US", UltimateResourceFallbackLocation.Satellite)]`

    3. Open a command prompt and navigate to your project''s directory. Run the command:

    `msbuild /t:updateuid`


    This will generate a UID for every WPF element, modifying your XAML files in the
    process. You should not manually edit these UIDs.


    > NOTE msbuild is located with the .Net frameworks, and it is easy to run it to
    start the command prompt with the shortcut that Visual Studio installs; this initialize
    the correct environment settings to access the .NET Framework binaries.


    +   4. Rebuild the project. A directory called en-US will appear in the output
    directory. This contains the resource DLL.

    5. Obtain the LocBam tool from the Windows SDK. On your computer, it was packed
    in C:\Program Files\Microsoft SDKs\v7.0\Samples\WPFSamples.zip. To get it to work
    in .Net 4, I had to recreate the project'
