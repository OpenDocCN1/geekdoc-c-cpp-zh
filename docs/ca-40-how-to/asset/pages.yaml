  md: "Numbers form an integral part of many applications. Although seemingly a simple\
    \ topic, when you consider how the world’s many cultures represent numbers, and\
    \ even how computers represent numbers, the topic is not so simple after all.\
    \ This chapter covers a lot of tips that are useful in many applications.\n\n\
    # Decide Between Float, Double, and Decimal\n\n| Scenario/Problem: You need to\
    \ decide which floating-point type to use in a situation |\n\nSolution: Deciding\
    \ which floating-point type to use is application dependent, but here are some\
    \ things to think about:\n\n+   - How big do the numbers need to be? Are they\
    \ on the extreme, either positive or negative?\n\n+   - How much precision do\
    \ you need? Is seven digits enough? Sixteen? Need more?\n\n+   - Do you have memory\
    \ requirements that influence you choose?\n\n+   - Are the numbers coming from\
    \ a database that already specifies the size you use? Which method should you\
    \ choose so you don't lose data.\n\nGiven these questions, Table 5.1 demonstrates\
    \ the differences.\n\n| Type | Range | Precision (Digits) | Largest Exact Integer\
    \ | Size |\n|---|---|---|---|-|\n| Float | $\\pm1.5\times10^{-45}$ - $\\pm3.4\t\
    imes10^{38}$ | 7 | $2^{24}$ | 4 bytes |\n| Double | $\\pm5.0\times10^{-324}$ -\
    \ $\\pm1.7\times10^{308}$ | 15–16 | $2^{63}$ | 8 bytes |\n| Decimal | $\\pm1.0\t\
    imes10^{-28}$ - $\\pm7.9\times10^{28}$ | 28–29 | $2^{113}$ | 16 bytes |\n\nExact\
    \ integer means the largest integer value that can be represented without loss\
    \ of precision. These values should be kept in mind when you're converting between\
    \ integer and floating-point types.\n\n> NOTE For any calculation involving money\
    \ or finances, the Decimal type should always be used. Only this type has the\
    \ appropriate precision to avoid critical rounding errors."
