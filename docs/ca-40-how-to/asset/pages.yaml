  md: "# Notify Clients when Changes Happen\n\n**Scenario/Problem:** You want users\
    \ of your class to know when data inside the class changes.\n\n**Solution:** Implement\
    \ the INotifyPropertyChanged interface (located in System.ComponentModel).\n\n\
    using System.ComponentModel;\n\n```\nclass MyDataClass : INotifyPropertyChanged\n\
    {\n    public event PropertyEventHandler PropertyChanged;\n\n    protected void\
    \ OnPropertyChanged(string propertyName)\n    {\n        if (PropertyChanged !=\
    \ null)\n        {\n            PropertyChanged(this, new PropertyChangedEventArgs(propertyName));\n\
    \        }\n    }\n\n    private int _tag = 0;\n    public int Tag\n    {\n  \
    \      get\n        { return _tag; }\n        set\n        {\n            _tag\
    \ = value;\n            OnPropertyChanged(\"Tag\");\n        }\n    }\\}\n```\n\
    \nThe Windows Presentation Foundation (WPF) makes extensive use of this interface\
    \ for data binding, but you can use it for your own purposes as well.\nTo consume\
    \ such a class, use code similar to this:\n\n```\nvoid WatchObject(object obj)\n\
    {\n    INotifyPropertyChanged changeableObj = obj as INotifyPropertyChanged;\n\
    ```"
