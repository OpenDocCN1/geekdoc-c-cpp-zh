  md: '# RegexBuddy


    Purpose: To interactively construct and test regular expressions.


    Yes, you could build a regular expression tester yourself, but the ones already
    out there offer some not-so-trivial features. RegexBuddy, shown in Figure A.8,
    is one of the best, and there are others.


    Among other things, they offer menus for inserting subexpressions, explain the
    expressions in English (or close to it), give instant graphical feedback, provide
    syntax highlighting, and more.


    ![](img/c237887cbbac0db0e18bd0eecbc77950_646_0.png)


    FIGURE A.8


    RegexBuddy(and its many cousins) offer vast tools for analyzing and creating regular
    expressions.


    # LINQPad


    Purpose: Builds queries with LINQ, primarily for LINQ to SQL.


    This application is kind like RegexBuddy for LINQ. It has a tight interface that
    lets you quickly test LINQ queries against databases.'
  merge: -1
  pgno: 646
- img_proc: true
  md: 'LINQPad also lets you just test out code snippets to see the results, without
    having to create dummy test project. Figure A.9 shows the tool in action against
