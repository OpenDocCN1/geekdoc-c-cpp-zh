  md: "# Speed Up Queries with PLINQ (Parallel LINQ)\n\n> Scenario/Problem: You want\
    \ to take advantage of multiple processor cores during LINQ queries.\n\nSolution:\
    \ Use the AsParallel() extension method.\n\nIf your original query is\n\n```\n\
    var query = from val in data\n      where (ComplexCriteria(val)==true)\n     \
    \ select val;\nforeach (var q in query)\n{\n    //process result\n}\n```\n\nwhere\
    \ ComplexCriteria is just an arbitrary Boolean function that examines the values\
    \ in the data, then you can parallelize this with a simple addition:\n\n```\n\
    var query = from val in data.AsParallel()\n      where (ComplexCriteria(val)==true)\n\
    \      select val;\nforeach (var q in query)\n{\n    //process result\n}\n```\n\
    \n> NOTE You are more likely to get elements returned out of order using PLINQ\
    \ unless you specify that you want order preserved using the AsOrdered() or OrderBy()\
    \ extension method, as shown here:\n\n```\nvar query = from obj in data.AsParallel().AsOrdered()\
    \ select obj;\nvar query = from obj in data.AsParallel().OrderBy(obj.Name)\n \
    \     select obj;\n```\n\nUnfortunately, this might negate some of the benefits\
    \ of PLINQ.\n\n> NOTE PLINQ only works on LINQ to Objects and LINQ to XML."
  merge: -1
