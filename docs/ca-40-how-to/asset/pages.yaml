- img_proc: true
  md: 'Solution: Use the orderby statement.


    Here''s how to order the results in ascending order (the default):


    ```

    var ordered = from book in books orderby book.Title select book;

    ```


    Use the following for descending order:


    ```

    var ordered = from book in books

    orderby book.Title descending

    select book;

    ```


    And here''s how to sort multiple columns:


    ```

    var ordered = from book in books

    orderby book.PublishYear, book.Title descending

    select book;

    ```


    # Filter a Collection


    Scenario/Problem: You want to select objects from a collection that satisfy a
    given condition.


    Solution: Like SQL, LINQ has a where clause which can be used to filter the results
    according to the conditions you specify:


    ```

    var before1850 = from book in books

    where book.PublishYear < 1850

    select book;

    ```


    Here''s the output:


    Books before 1850:

    Le Rhin - 1842

    Les Burgraves - 1843


    If you want to use multiple conditions, use the && and || operators just as you
    would in an if statement:


    ```

    var dateRange = from book in books

    where book.PublishYear >= 1850

    && book.PublishYear <= 1855

    select book;

    ```'
