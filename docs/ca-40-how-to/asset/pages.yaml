  md: "# Use Enormous Integers (BigInteger)\n\n**Scenario/Problem**: You need an integer\
    \ larger than can fit in a UInt64.\n\n**Solution**: .NET 4 ships with the BigInteger\
    \ class, located in the System.Numerics namespace (you will need to add a reference\
    \ to this assembly). With it, you can arbitrarily parse large integer math, such\
    \ as the following:\n\n```\nBigInteger a = UInt64.MaxValue;\nBigInteger b = UInt64.MaxValue;\n\
    \n//this is a really, really big number\nBigInteger c = a * b;\n```\n\nBigInteger\
    \ is immutable, which means calling\nBigInteger a = 1;\n++;\n\nwill result in\
    \ the creation of a second BigInteger object, assigning it back to a.\nAlthough\
    \ this is transparent to you in practice, you should be aware that it has potential\
    \ performance implications.\n\nBigInteger has many static methods, such as the\
    \ typical Parse(), TryParse(), and ToString() methods which support hex format\
    \ as well and found in other integer types, as well as mathematical helpers as\
    \ Pow(), Log(), Log10(), and others.\nBigInteger's ToString() method accepts the\
    \ usual format specifiers (\"C\", \"N0\", and plus one more: \"R\". With except\
    \ \"R\", fifty digits of integer precision are output, with the rest replaced\
    \ by zeros. With \"R\", all digits are preserved, but you cannot apply other formatting\
    \ (as digit separators). The difference is shown here:\n\n```\nstring numberToParse\
    \ = \n\"2374365237842034578374955679534985475346847965672309\"\n-482359874390\"\
    \nBigInteger bi = BigInteger.Parse(numberToParse);\nConsole.WriteLine(\"N0: {0:N0}\"\
    , bi);\nConsole.WriteLine(\"R: {0:R}\", bi);\n```\n\nOutput:\n0: 234,743,652,378,423,045,783,479,556,793,498,574,534,684\n\
    -795,672,300,000,000,000,000,000\nR: 237436523784203457837495567953498547534684796567230948235987437390"
