  md: "# 286 CHAPTER 15 Delegates, Events, and Anonymous Methods\n\nBecause of the\
    \ way they're implemented internally, Windows UI elements must be accessed on\
    \ the same thread that created them. Previous frameworks (such as MFC) didn't\
    \ enforce this so much, .NET does. Windows Forms and WPF handle this slightly\
    \ differently.\n\n# In WinForms\n\nIn WinForms, you can check if you're running\
    \ on the UI thread by polling InvokeRequired on any UI element. If it's true,\
    \ you need to switch to the main thread by calling Invoke() and passing it a delegate.\n\
    \nIn practice, there are a few ways to do this, but an easy way (from the previous\
    \ example) is demonstrated in the data_LoadStarted event handler:\n\n```\npublic\
    \ Form1()\n{\n    InitializeComponent();\n\n    data = new ProgramData();\n  \
    \  data_LoadStarted += new EventHandler<EventArgs>(data_LoadStarted);\n    data_LoadEnded\
    \ += new EventHandler<ProgramDataEventArgs>(data_LoadEnded);\n\n    data.BeginLoad();\n\
    }\n\nvoid _data_LoadStarted(object sender, EventArgss e)\n{\n    if (this.InvokeRequired)\n\
    \    {\n        // if we're not on the UI thread, call recursively,\n        //\
    \ but on the UI thread\n        Invoke(new EventHandler<EventArgs>(data_LoadStarted),\
    \ sender, e);\n    }\n    else\n    {\n        TextBox.AppendText(\"Load started\"\
    \ + Environment.NewLine);\n    }\n}\n```\n\n# In WPF\n\nIn WPF, the concept is\
    \ similar. Each WPF element has a property called Dispatcher. By comparing the\
    \ Dispatcher's thread to the current thread, you can tell when need to call Invoke.\
    \ The following example demonstrates this in a simple WPF app (see the WPFInvoke\
    \ sample project):"
