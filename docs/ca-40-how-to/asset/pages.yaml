  md: "It is a rare application these days that does not have some functionality tied\
    \ to the Internet. The software world is increasingly connected, and much software\
    \ is expected to have some networking functionality, even if it is as simple as\
    \ checking for updates to itself.\n\nGood networking is hard, but this chapter\
    \ will get you well on your way with some basics and some not-so-basics.\n\n#\
    \ Resolve a Hostname to an IP Address\n\nScenario/Problem: You need to translate\
    \ a hostname, such as microsoft.com, to its IP addresses.\n\nSolution: The System.Net\
    \ namespace contains much of the functionality you'll see in this chapter, including\
    \ basics as the IPAddress and Dns classes.\n\n```\nstring host = \"www.microsoft.com\"\
    ;\n//note that a host can have multiple IP addresses\nIPAddress[] addresses =\
    \ Dns.GetHostAddresses(host);\nforeach (IPAddress addr in addresses) {\n    Console.Write(\"\
    \\t{0}\", addr);\n}\n```\n\nHere is the output from a sample run of a few common\
    \ hostnames:\\www.microsoft.com\n\n```\n207.46.19.254 207.46.19.190\nwww.live.com\n\
    204.2.160.40 204.2.160.49\nwww.google.com\n208.67.219.230 208.67.219.230\nwww.yahoo.com\n\
    209.131.36.158\n```\n\n# Get This Machine's Hostname and IP Address\n\nScenario/Problem:\
    \ You want to retrieve the current machine's hostname and IP addresses.\n\nSolution:\
    \ In addition to the solution in the previous section, all you need to is make\
    \ one additional call to get the current hostname:"
