  md: "# Call a Base Class Constructor\n\nSolution: Use inheritance to reuse the base\
    \ class and add new functionality.\n\n```\npublic class BaseClass {\n    private\
    \ int _a;\n    protected int _b;\n    public int _c;\n}\n\npublic class DerivedClass\
    \ : BaseClass {\n    public DerivedClass() {\n        _a = 1;//! not allowed!\
    \ private in BaseClass\n        _b = 2;//ok\n        _c = 3;//ok\n    }\n    public\
    \ void DoSomething() {\n        _c = _b = 99;\n    }\n}\n```\n\nDeriving from\
    \ a base class gives access to a base class's public and protected members, but\
    \ not private members.\n\n# Call a Base Class Constructor\n\n| Scenario/Problem:\
    \ You have a child class and its constructor to call a specific base class constructor.\
    \ |\n\nSolution: Similar to calling other constructors from the constructor of\
    \ a class, you can call specific constructors of a base class. If you do not specify\
    \ a constructor, the base class's default constructor is called. If the base class's\
    \ default constructor requires arguments, you will be required to supply them.\n\
    \n```\npublic class BaseClass {\n    public BaseClass(int x, int y, int z) {\n\
    \        ....\n    }\n}\n```"
