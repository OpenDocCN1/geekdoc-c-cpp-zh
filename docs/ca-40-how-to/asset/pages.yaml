  md: "# Animate Element Properties\n\n> **Scenario/Problem: You want to change UI\
    \ properties over time.**\n\n**Solution:** As far as WPF is concerned, animation,\
    \ animation is the change of an element's properties over time. For example, you\
    \ could change the x position of a button from 1 to 100, over 5 seconds. This\
    \ would have the effect of moving the button on the screen during that time. You\
    \ can animate any dependency property in WPF.\n\nThe ImageView application uses\
    \ a single animation to fade in the left-side panel over 5 seconds when the application\
    \ starts. Figure 18.5 shows the application with it faded about halfway.\n\nFirst,\
    \ define the storyboard with animation in the Window's resources:\n\n```\n<Window.Resources>\n\
    \  <Storyboard x:Key=\"FadeInLeftPanel\">\n    Storyboard.TargetName=\"LeftPanel\"\
    \n    &lt;!-- Double refers to the Type of the property --&gt;\n    &lt;DoubleAnimation\\\
    gt;\n      Storyboard.TargetProperty=\"Opacity\"\n      From=\"0.0\" To=\"1.0\"\
    \ Duration=\"0:0:5\" />\n    &lt;/DoubleAnimation&gt;\n  </Storyboard>\n</Window.Resources>\n\
    ```\n\nOnce the animation is defined, you need to start with a trigger:\n\n```\n\
    <Window>\n  <Window.Resources>\n    ...\n  </Window.Resources>\n  <Window.Triggers>\n\
    \    <EventTrigger RoutedEvent=\"Window.Loaded\">\n      <BeginStoryboard>\n \
    \       Storyboard=\"{StaticResource FadeInLeftPanel}\" />\n      </BeginStoryboard>\n\
    \    </EventTrigger>\n  </Window.Triggers>\n  ...\n</window>\n```"
  merge: -1
  pgno: 404
