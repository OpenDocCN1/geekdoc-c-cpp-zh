  md: "# CHAPTER 16 Windows Forms\n\nformats simultaneously, including plain text,\
    \ Word format, HTML, and even an image of the text you can paste into a graphics\
    \ program! This is a built-in feature of the Windows clipboard you can take advantage\
    \ of. When pasting, it is up to each program to decide what format to ask for\
    \ by default, or even to give the user a choice.\n\nHere is how to put both text\
    \ and an image on the clipboard:\n\n```\nBitmap bitmap = Bitmap.FromFile(\"C:\\\
