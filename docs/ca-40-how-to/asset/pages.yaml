  md: "# Do Data Validation\n\n![](img/c237887cbbac0db0e18bd0eecbc77950_441_0.png)\n\
    \nFIGURE 19.9\nThese fields are updated independently of each other, without a\
    \ page reload.\n\n# Do Data Validation\n\n> Scenario/Problem: You want to validate\
    \ user input before sending it to the server.\n\n**Solution:** In general, there\
    \ are two places to input and data validation: on the client and the server. On\
    \ the client side, ASP.NET provides various controls for automatically checking\
    \ that the input is in a certain range. On the server, ASP.NET runs these rules\
    \ automatically for you. If you have more complex validation methods, these can\
    \ be run on the server.\n\nThe Validation demo in Listings 19.13 and 19.14 shows\
    \ some of the built-in validators in action as well as a custom, server-side validator.\
    \ Figure 19.10 shows a screenshot of the Validation demo.\n\n# LISTING 19.13 Validation\
    \ Demo—Default.aspx\n\n```\n<%@ Language=\"C#\" AutoEventWireup=\"true\"\nCodeBehind=\"\
    Default.aspx.cs\"\nInherits=\"ClientSideValidation_Default %>\n\n<!DOCTYPE html\
    \ PUBLIC \"-//W3C//DTD HTML 1.0 Transitional//EN\"\nn \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
    >\n\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n  <head runat=\"server\">\n\
    \    <title>Validation Demo</title>\n```"
