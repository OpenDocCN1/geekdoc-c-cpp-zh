  md: "# Enumerate Types in an Assembly\n\nReflection is generally all about getting\
    \ information about code. However, using the reflection APIs, you can dynamically\
    \ execute code you load from an arbitrary assembly, giving you an easy way to\
    \ implement a plugin architecture in your app.\n\n| **Scenario/Problem:** | You\
    \ want to dynamically discover the types present in a .NET assembly |\n\n**Solution:**\
    \ Reflection is most commonly used for discovery, and nearly everything in .NET\
    \ is discoverable.\n\nThis snippet of code populates a System.Windows.Forms.TreeView\
    \ control with classes, methods, properties, fields, and events from an assembly:\n\
    \n```\nprivate void ReflectAssembly(string filename)\n{\n    treeView.Nodes.Clear();\n\
    \n    Assembly assembly = Assembly.LoadFrom(filename);\n    foreach (Type t in\
    \ assembly.GetTypes())\n    {\n        TreeNode typeNode = new TreeNode(\"T\"\
    ) + \" \" + t.Name);\n        treeView.Nodes.Add(typeNode);\n        // get methods\n\
    \        foreach (MethodInfo mi in t.GetMethods())\n        {\n            typeNode.Nodes.Add(new\
    \ TreeNode(\"M\") + \" \" + mi.Name);\n        }\n        // get properties\n\
    \        foreach (PropertyInfo pi in t.GetProperties())\n        {\n         \
    \   typeNode.Nodes.Add(new TreeNode(\"P\") + \" \" + pi.Name);\n        }\n  \
    \      // get fields\n        foreach (FieldInfo fi in t.GetFields(BindingFlags.Instance\
    \ | BindingFlags.NonPublic | BindingFlags.Public))\n        {\n            typeNode.Nodes.Add(new\
    \ TreeNode(\"F\") + \" \" + fi.Name);\n        }\n        // get events\n    \
    \    foreach (EventInfo ei in t.GetEvents())\n        {\n            typeNode.Nodes.Add(new\
    \ TreeNode(\"E\") + \" \" + ei.Name);\n        }\n    }\n}\n```"
