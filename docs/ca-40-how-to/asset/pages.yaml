  md: "# Define the Service Interface\n\nThe service in this example will be a simple\
    \ file server that implements three methods to retrieve directory and file data\
    \ for the client. The methods are defined in an interface inside a class library\
    \ that the server references and implements.\n\n```\nusing System;\nusing System.ServiceModel;\n\
    \nnamespace FileService\n{\n    [ServiceContract]\n    public interface IFileService\n\
    \    {\n        [OperationContract]\n        string[] GetSubDirectories(string\
    \ directory);\n\n        [OperationContract]\n        string[] GetFiles(string\
    \ directory);\n\n        [OperationContract]\n        int RetrieveFile(string\
    \ filename, int amountToRead, out byte[] bytes);\n    }\n}\n```\n\nThe attributes\
    \ on the interface and methods tell WCF that these should be part of the service.\n\
    \nThe implementation is simple:\n\n```\nusing System;\nusing System.ServiceModel;\n\
    using System.IO;\n\nnamespace FileService\n{\n    public class FileService : FileServiceLib.IFileService\n\
    \    {\n        //just because it's a file service doesn't mean that you have\
    \ to\n        //actually use the real underlying file system--you could make\n\
    \        //your own virtual file system\n\n        public string[] GetSubDirectories(string\
    \ directory)\n        {\n            return System.IO.Directory.GetDirectories(directory);\n\
    \        }\n    }\n```"
  merge: -1
  pgno: 239
- img_proc: true
  md: "# CHAPTER 12 Networking and the Web\n\n```\npublic string[] GetFiles(string\
    \ directory)\n{\n    return System.IO.Directory.GetFiles(directory);\n}\n```\n\
    \n```\npublic int RetrieveFile(string filename, int amountToRead,\n    out[] bytes)\n\
    {\n    bytes = new byte[amountToRead];\n    using (FileStream stream = File.OpenRead(filename))\n\
    {\n        return stream.Read(bytes, 0, amountToRead);\n    }\n}\n```\n\nSee the\
    \ FileServiceLib project in the accompanying source code.\n\n# Create the Server\n\
    \nIn this case, the server is going to be a console application for simplicity.\
    \ You could just easily make it part of a Windows service or run it under IIS.\n\
    using System;\nusing System.ServiceModel;\nusing FileServiceLib;\n\n```\nnamespace\
    \ WCFHost\n{\n    class Program\n    {\n        static void Main(string[] args)\n\
    \        {\n            Console.WriteLine(\"FileService Host\");\n           \
    \ //tell WCF to start our service using the\n            //info in app.config\
    \ file\n            using (ServiceHost serviceHost = new ServiceHost(typeof(FileServiceLib.FileService)))\n\
    \            {\n                serviceHost.Open();\n                Console.ReadLine();\n\
    \            }\n        }\n    }\n}\n```"
