  md: "# CHAPTER 17 Graphics with Windows Forms and GDI+\n\nIf you're familiar with\
    \ Win32 and the Graphics Device Interface (GDI), GDI+ will be very recognizable\
    \ to you. It is just what the name implies: GDI with a little extra. GDI+ is a\
    \ very basic method of drawing custom graphics in your application that is quite\
    \ easy to learn.\n\n# Understand Colors\n\nColor definitions are implemented using\
    \ the System.Drawing.Color struct. This is basically a wrapper around four 1-byte\
    \ values: red, green, blue, and alpha (for transparency).\n\nColor color = Color.FromArgb(255,\
    \ 255, 255, 255); // opaque pure white\n\nFor well-known colors, you can use one\
    \ of the many static properties on the Color struct:\n\nColor color = Color.White;\n\
    \n> NOTE Be aware that colors are different from colors you define yourself! What\
    \ do you think the value of this expression?\nbool e = Color.White.Equals(Color.FromArgb(255,\
    \ 255, 255, 255));\nne is false, even though they are visually equivalent colors.\n\
    \nThere are properties to access each color component:\n\n```\nint red = color.R;\n\
    ```\n\n# Use the System Color Picker\n\nScenario/Problem: You need to provide\
    \ the user with a basic ability to pick colors.\n\nSolution: A built-in color\
    \ picker is available (see Figure 17.1):\n\n```\nColor c = Color.FromArgb(25,\
    \ 50, 75);\nSystem.Windows.Forms.ColorDialog cdg =\n  new System.Windows.Forms.ColorDialog();\n\
    cdg.Color = c;\nif (cdg.ShowDialog() == DialogResult.OK\n{\n  c = cdg.Color;\n\
    }\n```"
