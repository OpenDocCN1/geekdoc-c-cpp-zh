  md: "4. Expand the Tables tree and check the box next to the Books table. For Model\
    \ Namespace, type BooksDB.Models, and click Finish.\n\nYou've now created an object\
    \ model that maps the database table.\n\n# Create the Controller\n\nUnlike traditional\
    \ ASP.NET where each URL maps to a specific page file in your source code, MVC\
    \ maps URLs to controllers and methods. For example, the URL http://localhost:1000/Home/Index\
    \ maps to a controller named HomeController, which must be in the Controllers\
    \ folder of your project and named HomeController.cs. (The project creation wizard\
    \ should have created this for you.)\n\nIn addition, the Index portion of the\
    \ URL maps to a public method Index that returns an ActionResultResult.\n\nModify\
    \ the HomeController code to look like this:\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Web;\nusing System.Web.Mvc;\n```\n\n```\nnamespace\
    \ MVCBooksApp.Controllers\n{\n    [HandleError]\n    public class HomeController\
    \ : Controller\n    {\n        MVCBooksApp.Models.BooksDBEntities _db =\n    \
    \        new Models.BooksDBEntities();\n\n        public ActionResult Index()\n\
    \        {\n            //return a view named Index\n            return View(_db.Books.ToList());\n\
    \        }\n    }\n}\n```\n\nAt this point, you should build the project.\n\n\
    # Create the View\n\nASP.NET MVC looks for Views based on the name of the controller\
    \ and the method being called."
