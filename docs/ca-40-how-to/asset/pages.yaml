    \ package.\n\n> NOTE All editions of Visual Studio now include built-in unit testing\
    \ tools with the classes in Microsoft.VisualStudio.TestTools.UnitTesting namespace.\
    \ It does not have the feature of NUnit or other competing products, but it does\
