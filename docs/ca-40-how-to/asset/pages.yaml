  md: "However, what about this situation?\n\n```\nCursor oldCursor = this.Cursor;\n\
    this.Cursor = Cursors.WaitCursor;\n//do work\nthrow new Exception(\"Oops, something\
    \ happened!\");\n//uh-oh, the old cursor never gets set back!\nthis.Cursor = oldCursor;\n\
    ```\n\nIn this case, an error prohibits the cursor from being set back to normal.\n\
    \n**Solution:** Although you could wrap this in a try...finally block, here is\
    \ a simple\nhack to fix this shortcuts by using the IDisposable interface:\n\n\
    ```\nclass AutoWaitCursor : IDisposable\n{\n    private Control _target;\n   \
    \ private Cursor _prevCursor = Cursors.Default;\n\n    public AutoWaitCursor(Control\
    \ control)\n    {\n        if (control == null)\n        {\n            throw\
    \ new ArgumentNullException(\"control\");\n        }\n        _target = control;\n\
    \        _prevCursor = _target.Cursor;\n        _target.Cursor = Cursors.WaitCursor;\n\
    \    }\n\n    public void Dispose()\n    {\n        _target.Cursor = _prevCursor;\n\
    \    }\n}\n```\n\nNow you can just do the following, and the cursor is automatically\
    \ reset:\nusing (new AutoWaitCursor(this))\n{\n\n```\n//do work...\nthrow new\
    \ Exception();\n}\n```"
