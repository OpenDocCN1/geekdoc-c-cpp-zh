    \ he is redirected to Login.aspx first, shown in Figure 19.5, and then back to\
    \ Default.aspx upon a successful authentication.\n\n![](img/c237887cbbac0db0e18bd0eecbc77950_425_0.png)\n\
    \n# Use Master Pages for a Consistent Look\n\nScenario/Problem: You want your\
    \ pages to have a consistent, templated look and feel."
