  ### 什么是仪表板？\n\n简单来说，业务或数字仪表板是以数字或图形形式显示的指标。这些指标（或通常所说的度量/measures）的范围很大，取决于客户和组织类型。仪表板的组件各不相同，但通常一目了包含以下一项或多项：\n\
  \n* 为业务问题提供答案\n* 显示比较，例如今年（TY）销售额与去年（LY）销售额的比较\n* 达成目标的进度或状态，例如达到销售、生产或安全目标\n* 趋势，例如识别某活动趋势是上升、下降还是持平\n\
  \n仪表板通常局限于一个功能领域，如制造、人力资源、财务、物流或营销，可以是静态的也可以是交互的。\n\n### 仪表板设计\n\n良好的数字仪表板设计元素与仪表板用户紧密合作，以理解：\n\
  \n* 他们计划如何使用仪表板中的信息来改进目标？他们是跟踪性能、监控进度还是其他？\n* 他们将如何衡量仪表板的成功或实用性？\n* 你的受众是否需要单独的数据切片？也许某个经理只想看他们自己的地理区域。\n\
  * 你的受众将如何查看或访问仪表板？纸质版、网站还是移动设备？如果你的受众在黑白打印的纸上阅读仪表板，你需要留意间距和颜色的使用。\n\n### 仪表板图形\n\
  \n除了图表，Excel® 还提供了许多内置图形来辅助仪表板开发。在后续章节中，我们将研究如何使用这些图形，以及创建多透视表基础。\n\n| 注意！ |\n|\
  \ :--- |\n| 并非所有图表类型都支持透视表数据，包括地图、漏斗图、散点图等。我们仍然可以在仪表板中使用这些图形，但数据必须以兼容特定图表类型的方式进行准备。\
  \ |\n\n### 圆环图\n\nrsrc21.jpg`圆环图`是`饼图`的变体，它同样适用于展示作为整体一部分的百分比。然而，在仪表板中使用时通常比较两个值。这是因为当评估两个或三个以上的值时，圆环图很难阅读。\n\
  \n### 圆环图示例\n\n让我们练习如何使用透视表数据创建圆环图。\n\n1. 打开 [DashboardGraphics.xlsx](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)电子表格，并选择\
