  \n![](img/rsrc35H.jpg)\n8. 从时间轴工具功能区的`选项`下转到`标题`并输入`Time Frame`的新名称（有关如何更改标题的详细说明，请参见第\
  \ 9 章）。\n\n![](img/rsrc35R.jpg)\n\n在下一章中，我们将回顾如何刷新数据透视表和仪表板数据。\n\n## 第 15 章 刷新数据透视表和仪表板数据\n\
  \n***\n\n一旦你按照首选布局和格式创建了数据透视表和/或仪表板，就可以接收新数据了。可以使用`刷新`功能通过追加或覆盖现有数据向现有透视表中添加新信息。刷新数据允许你保留当前的格式和计算。只需记住在初始设计中为追加记录时可能创建的额外行留留空间。\n\
  \n***\n\n练习网址和文件名：[`bentonbooks.wixsite.com/bentonbooks/excel-2019`](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)\
  \ `Autoparts_Sales_Refresh_Data.xlsx`\n\n### 追加现有的（内部）数据源\n\n在我们的第一个示例中，我们将通过使用`刷新`功能通过追加或覆盖现有数据向现有透视表中添加新信息。刷新数据允许你保留当前的格式和计算。只需记住在初始设计中为追加记录时可能创建的额外行留出空间。\n\
  \n1. 打开 `Autoparts_Sales_Refresh_Data.xlsx`工作表。\n2. 选择`数据`选项卡。\n3. 复制单元格 `I:O`。\n\
  4. 选择`仪表板`。\n\n![](img/rsrc36.jpg)\n5. 按下 `Ctrl+V`。\n\n![](img/rsrc36.jpg)\n6. 回到`数据`选项卡。\n\
  7. 从数据透视表工具功能区选择`分析`选项卡。\n8. 点击`刷新`下拉箭头并选择`全部刷新`。\n\n![](img/rsrc37.jpg)\n注意：更新的信息：![](img/rsrc37.jpg)\n\
  \n### 刷新与全部刷新\n\n`刷新`与`全部刷新`的区别在于，`刷新`仅更新活动的数据透视表，而`全部刷新`更新仪表板中的所有数据透视表。\n\n###\
  \ 覆盖现有数据（手动）\n\n在第 13 章中，我们通过追加记录来显示数据。覆盖数据的过程与追加类似，不同之处在于添加新数据之前需要删除现有数据。\n\n![](img/rsrc37.jpg)\n\
  \n| 注意 |\n| 在覆盖记录时，请确保在添加新数据之前完全删除旧数据。 |\n\n删除旧信息并添加新信息的过程可以手动完成，也可以使用 VBA（视觉 Basic\
  \ 应用程序）自动完成。我们可以按照以下步骤操作：\n* 选择数据透视表中的单元格\n* 然后从数据透视表工具功能区选择`分析`选项卡\n* 点击`刷新`下拉箭头并选择`全部刷新`。\n\
  \n\n\n\n\n## 练习使用的网页地址与文件名：[https://bentonbooks.wixsite.com/bentonbooks/excel-2019]\n\
  `Autoparts_Sales_Refresh_Data.xlsx`\n\n### 隐藏您的透视表源数据\n\n1. 打开 `Autoparts_Sales_Refresh_Data.xlsx`\
  \ 工作表。\n2. 若要隐藏“数据 (Data)”工作表，在标签页上点击右键，并在弹出菜单中选择“隐藏 (Hide)”。\n\n![](img/rsrc3AC.jpg)\n\
  3. 从功能带中选择 `Review : Protect Workbook`。\n\n![](img/rsrc3AJ.jpg)\n将出现以下对话框：\n![](img/rsrc3AP.jpg)\n\
  \n4. 可选，输入密码 `Password` 或留空。\n5. 点击“确定”按钮。\n\n- 若要移除“保护工作簿”锁定，请重复第 3 步。\n- 然后，若要显示工作表标签页，右键点击任何标签页并选择“取消隐藏\
  \ (Unhide...)”（一旦标签页被隐藏，“取消隐藏...”选项将变为可用）。\n\n### 保护仪表板或其他工作表\n\n保护工作簿可以防止用户访问隐藏的标签页，但不能防止他们对其余可见的工作表进行更改，或刷新、更改数据源。因此，我们必须完成额外的步骤：\n\
  \n1. 选择“仪表板 (Dashboard)”工作表。\n2. 从功能带中选择 `Review : Protect Sheet`。\n\n![](img/rsrc3B9.jpg)\n\
  将出现以下对话框：\n![](img/rsrc3BD.jpg)\n\n3. 您可以输入密码或留空。\n4. 良好的做法是保持前两个复选框勾选：\n    - 选择锁定单元格\n\
  \    - 选择未锁定的单元格\n这将允许您的客户点击单元格并进行滚动操作，但无法更改任何内容。\n5. 点击“确定”按钮。\n\n如果用户尝试修改工作表，他们将收到以下消息之一：\n\
  ![](img/rsrc3C1.jpg)\n![](img/rsrc3C5.jpg)\n\n- 若要取消保护，从功能带中选择 `Review : Unprotect\
  \ Sheet`。\n\n![](img/rsrc3CB.jpg)\n\n## 感谢！您的意见如何？\n\n感谢您购买并阅读本书，我们希望它对您有所帮助！您的反馈对我们非常宝贵！请花几分钟留个评价。\n\
