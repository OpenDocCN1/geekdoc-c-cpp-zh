- "# Excel 2019 透视表与仪表板入门指南：分步教程指南（Excel 2019 分步教程系列）\n\n# 第一章：如何使用本书\n\n\n\n\n\n\
  ## 练习文件\n练习文件可以通过以下网站下载：[`bentonbooks.wixsite.com/bentonbooks/excel-2019`](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)\n\
  \n## 第 2 章 透视表简介\n\n### 什么是透视表？\n透视表是 Microsoft Excel® 中的一项功能，它可以提取单个单元格或数据项，并让你将其排列成许多类型的计算视图。这些汇总数据的快照只需极少精力即可创建，并且可以通过在报告中简单点击或拖动字段来更改。\n\
  \n通过使用内置函数和筛选，透视表允许你快速组织和汇总大量数据。你可以进行过滤和钻取以对数字进行更详细的检查，并且无需在正在分析的表格中手动输入公式即可完成各种类型的分析。![](img/rsrc76.jpg)\n\
  \n例如，下方的透视表基于一个包含 3,888 条个人记录的详细表格，记录了飞机零件信息。在不到 1 分钟的时间里，我生成了以下按区域划分零件数量报告：![](img/rsrc7B.jpg)\n\
  \n这些透视表报告还可以进行格式化以提高可读性。然而，格式化需要额外的时间来完成。格式化后的示例：![](img/rsrc7J.jpg)\n\n在当今拥有海量信息的世界上，你可能被要求分析这些数据的很大一部分。可能由几千、数十万甚至数百万条记录组成。你可能需要协调来自许多不同来源和格式的数字，例如整合来自以下材料：\n\
  \n*   由其他应用程序（如旧系统）生成的报告\n*   通过数据库或其他应用程序的查询导入 Excel® 的数据\n*   从网络或屏幕抓取活动复制、剪切并粘贴到\
  \ Excel® 中的数据\n*   分析来自多个对象的测试或研究结果\n*   由于公司合并或收购而整合信息\n\n执行各种复杂类型分析和报告的最简单方法之一是使用透视表。\n\
  \n### 透视表的主要部分部分什么？\n在我们开始第一个练习之前，让我们回顾一下透视表的三个主要组件：\n\n1.  **行（Rows）**：行部分通常代表你希望如何对数据进行分类或分组。示例包括：员工姓名、地区、部门、零件编号等。\n\
  2.  **列（Columns）**：列显示你显示计算的级别或多个级别。通常是一个时间段（如月份、季度或年份），也可以是类别、产品线等。\n3. **值（Values）**：值是报告的计算部分，这些数字可以是和、百分比、计数、平均值、排名或自定义计算。![](img/rsrc8M.jpg)\n\
  \n## 第 3 章 创建你的第一个透视表\n\n对于第一个练习，我们将使用一个月份的警察犯罪数据。下面是一个示例，但由于空间限制，未显示完整的数据集。![](img/rsrc95.jpg)\n\
  \n### 准备工作表\n在创建透视表时，对要分析的每个工作表的做法是：\n\n*   数据集内部不包含空白行或空列\n*   没有合并的单元格\n*   每个列标题都有唯一的名称\n\
  \n例如：![](img/rsrc9R.jpg)![](img/rsrc9V.jpg)\n\n为了创建一个基础透视表，我们将利用 Microsoft Excel\
  \ 的 `Recommended PivotTables`（推荐透视表）功能。当你需要进行快速、高级分析，或被要求提供临时内容时，此工具非常有用。通常，这些报告不会经过格式化或分发给客户。为了说明此功能如何工作，我们将选取以下包含警察犯罪数据的表格并汇总：\n\
  \n*   按地理位置划分的犯罪总数\n\n对于此练习，我们将使用包含 3,636 条个人犯罪记录的 `PoliceCrimeData.xlsx` 表格，按 `Area`\
  \ 统计唯一 `ID` 字段的数量。`Rows`（分组）将是地理 `AREA`，`Values`（计算）将是 `ID` 记录的 `COUNT`。在演示中，我们将没有列级别的详细信息。\n\
  \n**练习网址与文件名**：[`bentonbooks.wixsite.com/bentonbooks/excel-2019`](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)\
  \ `PoliceCrimeData.xlsx`\n\n### 推荐透视表功能\n以下是使用 Microsoft Excel 的 `Recommended PivotTables`\
  \ 功能创建基础透视表的步骤：\n\n1.  打开 `PoliceCrimeData.xlsx` 表格\n2.  选择列 `A:D`\n![](img/rsrcAK.jpg)\n\
  3.  从丝栏选择 `Insert`（插入）：`Recommended PivotTables`（推荐透视表）\n![](img/rsrcAU.jpg)\n\n\
  出现以下对话框：\n4.  选择 `Count of ID`（ID 计数）的 `AREA` 预览\n5.  点击 `OK`（确定）\n![](img/rsrcB5.jpg)\n\
  \n将创建一个按区域计算 `ID` 的报告。注意：这创建了一个新工作表 `Sheet1` 以及新工作表左侧的 `PivotTable Fields` 区域。![](img/rsrcBA.jpg)\n\
  \n恭喜！你创建了第一个透视表！在短短几分钟内，你就能快速汇总按时间段划分的犯罪总数。\n\n## 第 4 章基础透视表功能\n\n让我们在创建和修改透视表的基础上，通过包含多个总计、查看特定值的详细信息以及对结果进行格式化来扩展。\n\
  \n### 示例：练习中我们将选取包含水果销售信息的表格并：\n\n*   按地区和季度确定销售总额\n*   按地区和季度显示个人销售额\n\n**数据**\n\
  \n### 汇总数据\n\n1.  打开 `FruitSales.xlsx` 表格并选择单元格 `A1:I65`\n2.  从丝栏选择 `Insert`（插入）：`PivotTable`（透视表）\n\
  ![](img/rsrcCM.jpg)\n\n出现以下对话框，请注意数据范围和新透视表将所在的位置：![](img/rsrcCV.jpg\n3.  点击 `OK`（确定）\n\
  \n将创建一个新标签页并显示所示。注意：新工作表左侧有 `PivotTable Fields` 区域。![](rsrcD4.jpg)\n\n接下来，我们将对报告进行分类并选择计算值。\n\
  \n4.  在 `PivotTable Fields` 区域中选择以下字段：\n\n*   `REGION`（行区域）\n*   `TOTAL`（∑ 值区域）\n\
  \n\n\n\n![](img/rsrcDK.jpg)# 为什么“∑ 值”字段有时会默认显示“计数”而不是“求和”？\n\n当透视表的源数据包含空行时，例如选择了整个列（如\
  \ `(Sheet1!$A:$I)`）而不是特定的单元格范围（如 `(Sheet1!$A$1:$I$65)`），Excel® 将默认将添加到“∑ 值”区域的字段计算方式设置为“计数”而不是“求和”。\n\
  \n如果发生这种情况，要将“∑ 值”区域从计数更改为求和：\n\n*   点击 `Count of TOTAL`（总计计数）下拉箭头，然后从子菜单中选择 `Value\
  \ Field Settings…`（值字段设置…）\n\n![](img/rsrcE0.jpg)将出现 `Value Field Settings…` 对话框：\n\
  \n*   从`汇总值字段`列表中选择 `Sum` 选项\n*   点击 `OK` 按钮\n\n![](img/rsrcEA.jpg)\n\n***\n\n继续我们的示例：你的屏幕右侧应显示以下内容。注意：该格式并不易读。![](img/rsrcEM.jpg)\n\
  \n5. 我们可以更改列标签和数字格式。在下面的示例中：\n\n*   选择单元格 `A3` 并将文本从 `Row Labels`（行标签）更改为 `REGION`（区域）\n\
  *   选择单元格 `B3` 并将文本从 `Sum of TOTAL`（总计）更改为 `TOTAL SALES`（总销售额）\n*   你还可以更改单元格 `B4:B7`\
  \ 中的货币格式。在下面的示例中，格式被更改为零小数位的美元\n\n![](img/rsrcF2.jpg)以下是格式化后的示例：![](img/rsrcF8.jpg)为了进一步增强报告，我们将添加季度列。这个“级别”维度将提供水果总销售量的更详细信息。\n\
  \n6. 在“透视表字段”窗中，将 `QUARTER`（季度）字段拖到 `Columns`（列）区域。\n\n| 重要！ |\n| :--- |\n| Excel®\
  \ 将“季度”读取为数值，因此如果你直接点击而不是将字段拖到 `Columns` 区域，Excel® 将应用某种计算。如果发生这种情况，点击 `∑ Values`\
  \ 区域中 `Sum of QUARTER`（季度求和）的下拉箭头，并选择 `Move to Column Labels`（移动到列标签） |\n\n![](img/rsrcFZ.jpg)我们现在已摘要中添加了\
  \ `QUARTER`\n\n7. 选择单元格 `B3`并将文本从 `Column Labels`（列标签）更改为 `BY QUARTER`（按季度）\n8.\
  \ 单元格 `B4`、`C4`、`D4` 和 `E4` 的标签通过在每个季度数字前添加缩写 `QTR` 已更改\n\n格式化前![](img/rsrcGA.jpg)格式化后：![](img/rsrcGF.jpg)\n\
  \n## 如何钻取透视表数据\n\n在继续我们的示例之前，假设你想进一步调查为什么中部地区的 Q1 结果远高于东部和西部地区。![](img/rsrcGR.jpg)透视表允许你双击任何计算值来查看该单元格的详细信息。通过双击该值，将创建一个新的工作表，其中包含该单元格详细信息的\
  \ Excel® 表格。\n\n*   例如，双击单元格 `B5` 中的计算值\n\n![](img/rsrcGZ.jpg)\n\n*   要删除该表格，右键点击\
  \ `Sheet3` 并选择 `Delete`（删除）\n\n![](img/rsrcH7.jpg)\n\n*   你将收到以下消息，点击 `Delete` 按钮\n\
  \n![](img/rsrcHE.jpg)\n\n***\n\n## 为透视表添加额外行（类别）\n\n最后，我们将回顾如何按区域和季度显示各个水果销售情况。\n\
  \n1. 将 `QUARTER` 字段从 `COLUMNS`（列）区域拖到 `ROWS`（行）区域。\n\n![](img/rsrcHT.jpg)\n\n2.\
  \ 将字段 `APPLES`（苹果）、`ORANGES`（橙子）和 `MANGOS`（芒果）拖到透视表字段窗的 `∑ Values`区域，将水果字段放在 `TOTAL\
  \ SALES` 值之前\n\n![](img/rsrcJ0.jpg)结果应类似于所示：![](img/rsrcJ6.jpg)\n\n# 第 5 章在透视表中显示百分比\n\
  \n***\n\n使用透视表的另一个巨大优势是能够以各种描述性格式显示数字。在本章中我们将探索如何使用百分比。\n\n***\n\n示例：你是一名分析师，需要确定：\n\
  \n*   按区域销售的飞机零件百分比\n*   按类别和区域销售的飞机零件百分比\n\n***\n\n练习网地址和文件名：[`bentonbooks.wixsite.com/bentonbooks/excel-2019`](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)AirplaneParts.xlsx\n\
  \n***\n\n本章的示例数据，由于空间限制，未显示完整数据集。![](img/rsrcK7.jpg)创建一个新的透视表报告，要查看步骤 #1 - #3 的截图说明，请参见第\
  \ 4 章 基础透视表功能：\n\n1. 打开 `AirplaneParts.xlsx` 表格并选择单元格 `A1:F3889`\n2. 从带区选择 `Insert\
  \ : PivotTable`（插入：透视表）\n3. 点击 `OK` 按钮\n\n将创建一个新标签页，“透视表字段”窗应出现在屏幕的左侧。\n\n4. 在“透视表字段”窗中选择：\n\
  *   `REGION`（行区域）\n*   `QTY`（∑ 值区域）\n\n应显示类似于下面的报告：![](img/rsrcKX.jpg)\n\n5. 点击\
  \ `Sum of QTY` 下拉箭头，然后点击 `Value Field Settings…`![](img/rsrcM4.jpg)\n\n6. 选择选项卡\
  \ `Values As`（值显示）\n7. 从 `Show values as`（显示值方式）列表中选择 `% of Grand Total`（总计百分比）\n\
  8. 在字段 `Custom Name:`（自定义名称）更改为 `% of QTY`\n9. 点击 `OK` 按钮\n\n![](img/rsrcMT.jpg)\n\
  \n| 重要！ |\n| :--- |\n| 在 Excel® 中，百分比求和有时可能不等于 100%，这是由于 Excel 对百分比进行了四舍五入。 |\n\n\
  我们现在已经回答了问题：按区域销售的飞机零件百分比是多少。\n\n***\n\n要确定按类别销售的飞机零件百分比：\n\n1. 在“透视表字段”窗中拖动以下内容：\n\
  *   `CATEGORY`（行区域）\n\n让我们提高报告的可读性\n\n2. 选择单元格 `B4:B19`，从带区选择 `Home`（首页），并在 `Number`（数字）部分将小数减少两位\n\
  3. 选择单元格 `A3`并将文本从 `Row Labels`（行标签）更改为 `Sales By Region`（按区域销售）![](img/rsrcNN.jpg)\n\
  \n4. 选择单元格 `A3`，从透视表工具选择 `Design`（设计）选项卡 5.选择 `Subtotals`（汇总）下拉箭头，然后选择 `Show all\
  \ Subtotals at Bottom of Group`（组底部显示所有汇总）![](img/rsrcNZ.jpg)\n\n# 第 6 章透视表数据分组\n\
  \n***\n\n虽然透视表非常适合汇总信息，有时会有大量的详细记录，例如客户统计、销售等。对于这种粒度的数据，当你可以将这些记录聚类到类别或范围时，通常可以获得更深入的见解。为了完成这种细分分析，我们可以利用“分组”功能。\n\
  \n***\n\n示例：你收到了大量的详细记录，需要：\n\n*   按支出对客户分组\n*   每个部分占总销售额的百分比\n\n***\n\n练习网地址和文件名：（同上）CustomerSales.xlsx\n\
  \n***\n\n本章的示例数据，由于空间限制，未显示完整数据集。![](img/rsrcR2.jpg)分组记录创建一个新的透视表报告，要查看步骤 #1 - #3\
  \ 的截图说明，请参见第 4 章 基础透视表功能：\n\n1. 打开 `CustomerSales.xlsx` 表格并选择单元格 `A1:B31`\n2. 从带区选择\
  \ `Insert : PivotTable`（插入：透视表）\n3. 点击 `OK` 按钮\n\n将创建一个新标签页，“透视表字段”窗应出现在屏幕的左侧。\n\
  \n4. 在“透视表字段”窗中拖动以下字段：\n*   `AMOUNT PURCHASED`（行区域）\n*   两次 `CUSTOMER ID`（∑ 值区域）\n\
  \n![](img/rsrcRT.jpg)\n\n5. 点击单元格 `A4`\n6. 从透视表工具带区选择选项卡 `Analyze : Group Field`（分析：分组字段）\n\
  \n\n\n\n\n![](img/rsrcS2.jpg)将出现以下对话框：![](img/rsrcS7.jpg)\n\n7. 验证“起始于：(Starting\
  \ at:)”和“结束于：(Ending at:)”复选框均已勾选：\n\n*   “起始于：”将默认值为 100（这是数据集中的最小值）\n*   “结束于：”将默认值为\
  \ 1500（这是数据集中的最大值）\n*   在“间隔：(By:)”字段中输入 100（这是分组分段之间的金额）\n\n8. 点击“确定(OK)”按钮\n\n\
  我们现在已经将客户购买金额分成了不同的段，每个区间的差额代表大约 100。然而，此表并没有提供有意义的信息，因为它错误地汇总了“客户 ID (CUSTOMER\
  \ ID)”。要修复此问题：![](img/rsrcSP.jpg)\n\n9. 在“透视表字段”列表中，在`∑ Values`部分，点击第一个 `Sum of\
  \ CUSTOMER ID`（客户 ID 之和）旁边的下拉箭头\n\n10. 选择`值字段设置...(Value Field Settings...)`选项\n\
  \n![](img/rsrcSY.jpg)\n\n### 计数函数\n计数函数返回特定值在特定范围内出现的次数。在我们的示例中，我们正在统计在特定价格点范围内购买的客户人数。\n\
  \n11. 在`值字段汇总方式(Summarize value field by)`列表框中选择`Count`计数）\n\n12. 在`自定义名称:(Custom\
  \ Name:)`字段中更改为`NUMBER OF CUSTOMERS`客户人数）\n\n13. 点击“确定(OK)”按钮\n\n![](img/rsrcTD.jpg)\n\
  \n14. 在“透视表字段”列表中，在`∑ Values`部分，点击第二个 `Sum of CUSTOMER ID`（客户 ID 之和）旁边的下拉箭头\n\n\
  15. 选择`值字段设置...(Value Field Settings...)`选项\n\n16. 在`值字段汇总方式(Summarize value field\
  \ by)`列表中选择`Count`计数）\n\n17. 在`自定义名称:(Custom Name:)`字段中更改为`% OF CUSTOMERS（客户占比）\n\
  \n![](img/rsrcTU.jpg)\n\n18. 点击`显示值(Show Values As)`选项卡\n\n19. 点击`显示值方式(Show values\
  \ as)`下拉箭头并选择`% of Grand Total`总计百分比）\n\n![](img/rsrcU3.jpg)\n\n20. 点击“确定(OK)”按钮\n\
  \n21. 将单元格`A3`中的文本从“行标签(Row Labels)”更改为“AMOUNT PURCHASED（购买金额）”\n\n我们现在有了一份报告，根据支出金额对客户人数进行分组，并显示每个购买组占销售总额的百分比。![](img/rsrcUF.jpg)\n\
  \n## 第 7 章 切片器、时间轴与筛选\n\nExcel®提供了多种筛选选项，在本章中，我们将检查一些最常用的选项。前两个是图形化的，并为您的报告提供一种简单且直观的交互方式，它们是：\n\
  \n*   **时间轴 (Timeline)**：是一种滑块或按钮筛选，允许用户将单个日期值快速分类为月份、季度或年份。\n*   **切片器 (Slicers)**\
  \ 是按钮筛选，允许用户通过选择一个或多个文本值进行筛选。\n\n这些时间轴和切片器可以结合使用，非常适合喜欢从许多不同角度查看数据的分析师或客户。本章通过回顾几个内置的条件筛选来结束，这些包括如何快速识别表现最好和最后的者，以及仅返回符合特定数值阈值或文本的记录。\n\
  \n### 示例\n你是一名支持一家航天零件制造公司的财务分析师。你被要求参加一个针对区域经理的临时销售会议。议程尚未确定，你被要求准备过去 12 个月的销售数据，并在问题出现时进行回答。由于你不确定经理们会问什么，因此你决定创建一个带有时间轴和分类切片器的透视表报告。\n\
  \n### 练习的网页地址与文件名\n[`bentonbooks.wixsite.com/bentonbooks/excel-2019`](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)\n\
  `AirplaneParts.xlsx`\n\n本章的示例数据，由于空间限制，未显示整个数据集。注意：列`E`是一个日期值。![](img/rsrcVG.jpg)\n\
