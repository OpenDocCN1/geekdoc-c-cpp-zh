  \ 的连接后，我们将合并这些查询。完成后，我们就可以创建汇总的透视表报告。本质上，我们到目前为止完成的是创建两个连接，从两个独立的工作簿中选择所有数据。接下来，我们需要通过创建一个新查询将这两个查询合并在一起。合并查询有两种选项：`Append`（追加）和\
  \ `Merge`（合并）：\n\n#### Power Query 中的 Append 与 Merge\n\n`Append`：用于你要合并的数据在结构上相似（即具有相同的列数和列名），并且你想将每个查询中的所有行合并在一起。这就像是从一个文件复制所有数据并将其粘贴到另一个文件的底部，从而创建一个包含所有记录的大文件。\n\
  \n`Merge`：当你要合并的数据仅包含某些共同的列时使用。这些共同列可能有不同的列名，但它们之间的内容和数据类型是相同的。在这种情况下，我们有一个主查询和一个主键值，该键值匹配次要查询中的相同值。新查询的结果将汇总了两个查询之间键值匹配的记录。与合并所有数据的追加不同，在合并（Merge）时，我们只组合来自不同源的特定列和行。![](img/rsrc1WN.jpg)在我们的示例中，内容的列名和数据类型是相同的，我们需要每个查询中的所有行来制作报告，因此我们将使用\
  \ `Append` 方法。\n\n### 8. 从功能区（Ribbon）选择 `Data`\n\n### 9. 点击 `Get Data` 下拉箭头并选择 `Combine\
