    \ Data.CHAPTER 11Consolidating Data From Separate Workbooks To Create A Single\
    \ PivotTable\n\n* * *\n\nA common real-world challenge is collecting data from\
    \ different sources and assimilating it into a single file where further analysis\
    \ may be performed.  This process is time consuming and prone to errors.  As we\
    \ saw in chapter 10, Microsoft Excel® offers several options to import data. In\
    \ this chapter, we’re going explore how to use another one them called Power Query.Power\
    \ QueryPower Query is an extremely useful feature available in newer versions\
    \ of [Excel](https://support.office.com/en-us/article/introduction-to-microsoft-power-query-for-excel-6e92e2f4-2079-4e1f-bad5-89f6269cd605)[®](https://support.office.com/en-us/article/introduction-to-microsoft-power-query-for-excel-6e92e2f4-2079-4e1f-bad5-89f6269cd605)\
    \ [[1]](#part0021.xhtml_page_167)  that allows users to connect and bring together\
    \ data from many different sources. Once the information is collected in the [Power\
    \ Query Editor](https://www.microsoft.com/en-us/download/details.aspx?id=39379&CorrelationId=cf9e02f4-a5ed-47fe-b9b9-0bdad0fef6b4)[[2]](#part0021.xhtml_a3K2)\
    \ it can be merged or appended.  The analysis options are similar to writing your\
    \ own SQL (Structured Query Language) queries, such as grouping, date, text, numeric\
    \ and more, all available in an easy-to-use interface.These queries and their\
    \ results can be saved and/or loaded into an Excel® spreadsheet, PivotTable, or\
    \ PivotChart.  The data may be refreshed for up-to-date reporting or testing without\
    \ having to make any changes to your original work.Power Query can also be useful\
    \ for development projects such as temporary or project-based reporting or prototyping\
    \ to assist in refining your customer’s data requirements.Power Query can help\
    \ you become more efficient and once you start using it, you’ll likely find so\
    \ many ways of incorporating it into your daily work.  However, by providing an\
    \ almost effortless method to merge data, Power Query brings with it a high risk\
    \ of inaccurate analysis and reporting.  There is no substitute for understanding\
    \ your underlying content, how it is structured, and the quality of the data. \
    \ Also, having some basic knowledge of data modeling and the relationship between\
