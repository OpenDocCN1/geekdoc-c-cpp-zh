  raw: "Like with many tasks in Excel®, file importing and parsing can be accomplished\
    \ in multiple ways.  The following example describes how to read and parse a .CSV\
    \ (comma separated value) file using Excel’s® Data Model.  After the data is imported,\
    \ we’ll create two PivotTable reports.The Excel® Data ModelThe Excel® Data Model\
    \ is a feature in which data from different sources can be brought together into\
    \ a single workbook via a computer or network connection and queries.  Once this\
    \ information is in the workbook, you’ll be able to create PivotTables and Charts.This\
    \ type of reporting may also be achieved by using macros (Visual Basic for Applications),\
    \ Power Pivot, Power Query (please see next chapter), and Power View.  Deciding\
    \ which method to use depends on a variety of factors, such as:\n\n*   The amount\
    \ of data you’re analyzing\n\n*   The complexity and time it takes to complete\
    \ your analysis\n\n*   Your audience’s requirements\n\n*   Your skill level with\
    \ Excel® and the version you’re using\n\nIn the following example, the reporting\
