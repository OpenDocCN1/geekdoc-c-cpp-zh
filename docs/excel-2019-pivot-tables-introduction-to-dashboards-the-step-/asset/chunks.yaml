    Area.  The Rows (our grouping) will be the geographic ‘AREA’ and the Values (our
    calculation) will be a ‘COUNT’ of the ID records.  In this demonstration we will
    not have a Column level of detail.


    * * *


    WEB ADDRESS & FILE NAME FOR EXERCISE:[https://bentonbooks.wixsite.com/bentonbooks/excel-2019](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)PoliceCrimeData.xlsxThe
    Recommended PivotTables featureBelow are the steps to create a basic PivotTable
    using Microsoft Excel’s® Recommended PivotTables Feature, to begin:


    1.  Open the PoliceCrimeData.xlsx spreadsheet


    2.  Select columns A:D


    ![](rsrcAK.jpg)


    3.  From the Ribbon select Insert : Recommended PivotTables


     ![](rsrcAU.jpg)The following dialogue box will appear:


    4.  Select the preview for ‘Count of ID by AREA’


    5.  Click the ‘OK’ button


    ![](rsrcB5.jpg)A new report will be created counting the number of ID fields by
    area.  Note: this created a new worksheet, ‘Sheet1’ and the ‘PivotTable Fields’
    pane on the left side of the new worksheet.![](rsrcBA.jpg)Congratulations!  You
    created your first PivotTable!  In just a few short minutes, you were able to
    quickly summarize the total number of crimes that occurred for a time period by
