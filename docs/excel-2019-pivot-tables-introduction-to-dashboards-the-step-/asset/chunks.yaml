    \n## Conditional Filters\n\nIn the first part of this chapter we reviewed how\
    \ `Timelines` and `Slicers` may be used for interactive filtering. In this section,\
    \ we’ll demonstrate how to use built-in `PivotTable` filtering for specific conditions.\
    \ If you’re familiar with Excel’s conditional formatting capabilities, this is\
    \ very similar.\n\n***\n\n### EXAMPLE:\n\nIn the airplane parts spreadsheet, if\
    \ we wanted to know:\n\n* The top 10 airplane parts sold by category?\n* The bottom\
    \ 10 airplane parts sold by category?\n* The top 10 airplane parts sold by `Quarter`?\n\
    * How many parts sold more than 800 in quantity?\n\n#### Value Filters (Top &\
    \ Bottom Performers)\n\n1. Open the `AirplaneParts.xlsx` spreadsheet and select\
    \ cells ‘A1:F3889’.\n2. From the Ribbon select `Insert` : `PivotTable`.\n3. Click\
    \ the ‘OK’ button.\n\nA new tab will be created and the ‘PivotTable Fields’ pane\
    \ should appear on the left side of your screen.\n\n4. In the ‘PivotTable Fields’\
    \ pane select the following fields:\n    * `CATEGORY` (Columns section)\n    *\
    \ `PART` (Rows section)\n    * `QTY` (∑ Values section)\n5. Select cell ‘A4’ and\
    \ click the drop-down arrow of ‘Row Labels’.\n6. From the menu select `Value Filters`\
    \ then `Top 10…`.\n\n![](rsrc11W.jpg)\n\n7. The following prompt will appear,\
    \ click the ‘OK’ button.\n\n![](rsrc124.jpg)The following will be the result,\
    \ you may change the quantity from 10 to any number you would like to see.- ![](rsrc129.jpg)Similarly,\
    \ we may change to show the bottom 10.\n\n8. Select cell ‘A4’ and click the drop-down\
    \ arrow of ‘Row Labels’.\n9. From the menu select `Value Filters` then `Top 10…`.\n\
    10. The following prompt will appear, click the drop-down arrow that says ‘Top’\
    \ and change to ‘Bottom’.\n11. Click the ‘OK’ button.\n\n![](rsrc12K.jpg)The following\
    \ will be the result, you may change the quantity from 10 to any number you would\
    \ like to see.- ![](rsrc12S.jpg)You may add a [Timeline](#part0011.xhtml_toc24_Timeline)\
    \ to quickly see the top or bottom 10 by time frames.\n\n***\n\nLet’s review another\
    \ example, this time we’ll specify the quantity.\n\n1. Select cell ‘A4’ and click\
    \ the drop-down arrow of ‘Row Labels’.\n2. From the menu select `Value Filters`\
    \ then `Greater Than Or Equal To…`.\n\n![](rsrc131.jpg)\n\n3. The following prompt\
    \ will appear, enter the number `800` in the field after the drop-down box ‘is\
    \ greater than or equal to’.\n4. Click the ‘OK’ button.\n\n![](rsrc138.jpg)The\
    \ following will be the result:- ![](rsrc13E.jpg)\n\n#### Removing Filters\n\n\
    To remove a filter:\n\n1. Select cell ‘A4’ and click the drop-down arrow of ‘Row\
    \ Labels’.\n2. From the menu select `Value Filters` then `Clear`.\n\n## CHAPTER\
    \ 8 Pivot Charts\n\n***\n\nPivotTables provide an excellent way to summarize large\
    \ amounts of data in form. In this chapter, we’ll explore four most common types:\
    \ `Bar`, `Column`, `Pie` and `Line`.\n\n* `Bar` charts are best for comparing\
    \ numbers.\n* `Column` charts display data vertically for comparison.\n* `Pie`\
    \ charts are ideal for illustrating percentages as the whole.\n* `Line` charts\
    \ are used to demonstrate changes over time.\n\nIrrespective of the type used,\
