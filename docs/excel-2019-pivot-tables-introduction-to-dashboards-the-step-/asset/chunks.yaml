    answer questions. Before adding the Timeline, let’s re-arrange the PivotTable
    to be user friendly.


    6. In the `PivotTable Fields` pane uncheck the following:

    *   `Quarters` (Rows section)

    *   `Years` (Rows section)


    7. Drag the `EOM_DATE` field to the `Columns` section


    ![](rsrc8.jpg)

    8. Insert blank rows above 3

    9. Select cell `A14`, then from the PivotTable Tools Ribbon select `Analyze :
    Insert Timeline`


