    ### 7. Repeat steps 3 – 6 for the file `Data_File - North_South.xlsx`


    After the connection to the file `Data_File - North_South.xlsx` has been established,
    we’ll combine the queries. Once this is done, we can create our consolidated PivotTable
    report.EssentiallyEssentially, what we’ve completed so far is create two connections
    that select all data from the two separate workbooks. Next, we need to bring these
    two queries together by creating a new query. There are two options for joining
    queries `Append` and `Merge`:


    #### Append vs. Merge in Power Query


    `Append`: is used when the data you’re joining is structurally similar (i.e. the
    same number of columns and column names) and you want to combine all the rows
    from each query together. Think of this like copying all the data from one file
    and pasting it to the bottom of another to create one large file with all the
    records.


    `Merge`: is utilized when the data you’re joining contains only select columns
    in common. These common columns may have different column names, but the content
    and data type between them is the same. In this situation, we have a primary query
    and primary key value, this key value matches an identical value in a secondary
    query. The result of the new query brings together only those records in which
    the key values match between the two queries. Unlike appending where we’re bringing
    together all of the data, when merging we’re only combining select columns and
    rows from the different sources.![](rsrc1WN.jpg)In our example the column names
    and data types of the content are the same, and we want all the rows from each
    query for our report, therefore we’ll be using the `Append` method.


    ### 8. From the Ribbon select `Data`


    ### 9. Click the `Get Data` drop-down arrow and select `Combine Queries : Append`


    ![](rsrc1WZ.jpg)


    ### 10. Select the following when prompted:


    * Select the radio button for `Three or more tables`

    * Select all 4 tables and click the `Add >>` button

    * Click the `OK` button


    ![](rsrc1XB.jpg)This will open the Power Query Editor![](rsrc1XG.jpg)


    ### 11. Select the `Close & Load` drop-down arrow and then `Close & Load To..`


    ![](rsrc1XN.jpg)It may take a moment for the following prompt to appear:


    ### 12. For the `Import Data` prompt:


    * Select the radio button for `PivotTable Report`

    * Click the check box for `Add this data to the Data Model`

    * Click the `OK` button


    ![](rsrc1Y1.jpg)We’ve taken four separate queries and combined them into one and
    now may create and modify the PivotTable as needed.


    ### 13. In the `PivotTable Fields` pane select the following fields:


    * `REGION` (Rows section)

    * `PLAN` (∑ Values section)


    ![](rsrc1YF.jpg)


    ### 14. Optionally, format the PivotTable report to improve readability


    ![](rsrc1YM.jpg)We’ve now completed the request to consolidate four Regional detailed
    monthly sales plans for the year 2020 into a single high level summary.Please
    see [Chapter 15](#part0019.xhtml_a3NT) to learn more about Refreshing PivotTable
    Data.


    # CHAPTER 12 Introduction To Dashboards


    ## What is a Dashboard?


    A business or digital dashboard in the simplest terms, is a display of metrics
    in numeric or graphical form. These metrics or what is commonly referred to as
    measures, range widely depending on the customer and type of organization. The
    components of a dashboard vary, but typically include one-or-more of the following,
    at a glance:


    * Provide an answer to a business question

    * Show comparisons such as this year’s (TY) sales compared to last year’s (LY)
    sales

    * The progress or status of meeting a target, for example reaching a sales, production,
    or safety goal

    * Trends such as identifying if an activity is trending up, down, or about the
    same


    A dashboard is usually limited to one functional area, like Manufacturing, Human
    Resources, Finance, Logistics, or Marketing and may be static or interactive.


    ## Dashboard Design


    The elements of a well-designed digital dashboard include working closing with
    the consumers of the dashboard to understand:


    * How are they planning to use the information in the dashboard to improve their
    objectives? Will they be tracking performance, monitoring progress, or something
    else?

    * How will they measure the success or usefulness of the dashboard?

    * Does your audience require separate slices of the data? Perhaps a manger is
    interested in seeing only their own geographic area.

    * How will your audience view or access the dashboard? In paper form, on a website,
    mobile device? You’ll want to be mindful of spacing and the use of colors if your
    audience reads the dashboard on paper printed in black and white ink. Likewise,
    you may need to...


    ## Dashboard Graphics


    In addition to charts, Excel® offers a number of built-in graphics to aid in dashboard
    development. In the following chapters we’ll examine how to use of these, along
    with creating a multi-PivotTable based.


    | IMPORTANT! |

    | Not all chart types work with PivotTable data, these include, `Map`, `Funnel`,
    `Scatter` and more. We can still use these graphs in our dashboards, but the data
    must be prepared in a way compatible with the particular chart type. |


    ### Doughnut Chart


    rsrc211.jpgA`Doughnut Chart` is a variation of a `Pie Chart`, it too is most appropriate
    for illustrating percentages as part of the whole. However, when using in a dashboard
    typically two values are compared. This is because Doughnut charts can be difficult
    to read when more than two or three values are being evaluated.


    ### Doughnut Chart Example


    Let’s walk through an exercise on how to create a Doughnut chart using PivotTable
    data.


    1. Open the [DashboardGraphics.xlsx](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)
    spreadsheet and select the worksheet `Doughnut Chart`


    ![](rsrc21B.jpg)


    2. From the Ribbon select `PivotTable Tools : Analyze` and then the `PivotChart`
    icon


    ![](rsrc14Z.jpg)

