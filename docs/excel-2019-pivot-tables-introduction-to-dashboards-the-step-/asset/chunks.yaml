  trans: "\n\n| 通过选择列而非特定单元格，我们将准备好仪表板以接受新数据。当我们收到新一周的视图数据时，我们可以覆盖现有的数据集而无需进行任何额外更改。\
    \ |\n\n## 5. 将新工作表从‘Sheet1’重命名为‘Media Dashboard’\n\n![](img/rsrc2D4.jpg)\n\n##\
    \ 6. 在‘数据透视字段’窗格中选择以下字段：\n\n* `MEDIUM`（行区域）\n* `DATE`  （列区域）\n* `VIEWS`  （∑ 值区域）\n\
    \n![](img/rsrc2DJ.jpg)\n\n## 7. 选择单元格‘J4’\n\n## 8. 从数据透视表工具区选择`Design`（设计）选项，然后点击`Grand\
    \ Totals`（总计）下拉箭头\n\n## 9. 选择‘仅列显示’选项\n\n![](img/rsrc2DX.jpg)\n\n## 10. 点击标记为`Column\
    \ Labels`的单元格`B3`的下拉箭头，并取消勾选`(blank)`（空白）复框\n\n## 11. 点击‘确定’按钮\n\n![](img/rsrc2E5.jpg)\
    \ 数据透视表的样式应如下所示：![](img/rsrc2EA.jpg)\n\n## 为仪表板添加趋势线\n在本节中，我们将向仪表板添加趋势线，以便显示每周的趋势。\n\
    \n1. 右键点击列 `I`，选择`Column Width…`（列宽…），设置为 45 并点击‘确定’按钮\n\n![](img/rsrc2EM.jpg)\n\
    \n2. 将光标置在单元格`I5`中，从功能区选择`Insert`（插入）\n\n3. 从`Sparklines`菜单选择`Line`（折线）\n\n![](img/rsrc2EX.jpg)\n\
    \n4. 在`Data Range:`（数据范围）对话框中选择单元格 `B5:H5`\n\n5. 点击‘确定’按钮\n\n![](img/rsrc2F6.jpg)\n\
    \n6. 激活单元格 `I5`后，从功能区选择趋势线工具：`Design`（设计）选项卡\n\n7. 在`Show`（显示）区域点击`Markers`（标记）选项\n\
    \n![](img/rsrc2FF.jpg)\n\n8. 选择‘复制’或在键盘上按 `Ctrl+C`\n\n9. 将此公式复制到单元格 `I6:I11`，然后在键盘上按\
    \ `Ctrl+V`（粘贴）\n\n10. 按键盘上的`Esc`（退出）键\n\n11. 选择单元格 `I4`并输入 `TREND`\n\n![](img/rsrc2FU.jpg)\n\
    \n## 条件格式与图标集\n接下来，我们将添加视觉指示器，帮助查看者识别每日视图量未达到六的媒介。\n\n1. 选择单元格 `B5:H10`\n\n2.\
    \ 从功能区选择`Home`（主页）：`Conditional Formatting`（条件格式）\n\n3. 选择`Highlight Cells Rules:\
    \ Less Than…`（突出显示单元格规则：小于…）\n\n![](img/rsrc2G4.jpg)\n\n4. 对于`Format cells that\
    \ are LESS THAN:`（格式化小于单元格），输入数值 6\n\n5. 点击‘确定’按钮\n\n![](img/rsrc2GD.jpg)\n\n\
    6. 选择单元格 `B5:H10`\n\n7. 从功能区选择`Home`（主页）：`Conditional Formatting`（条件格式）\n\n8.\
    \ 选择`Icon Sets…`（图标集…）以及 ![](img/rsrc2GM.jpg)指示器\n\n![](img/rsrc2GU.jpg)\n\n9.\
    \ 从功能区选择`Home`（主页）：`Conditional Formatting`（条件格式）\n\n10. 选择`Manage Rules…`（管理规则…）\n\
    \n![](img/rsrc2H2.jpg)\n\n11. 选择图标集规则\n\n12. 点击`Edit Rule...`（编辑规则...）按钮\n\n![](img/rsrc2HA.jpg)\n\
    \n13. 完成以下操作：\n    1. 将`Type`（类型）更改`Number`（数字）\n    2. 将`Values`（值）改为 6\n   \
    \ 3. 点击`when value is`（数值为）下拉箭头并选择`No Cell Icon`（无单元格图标）\n    4. 点击`when < 6 and`（小于\
    \ 6 且）下拉箭头并选择`No Cell Icon`（无单元格图标）\n    5. 点击‘确定’按钮\n\n![](img/rsrc2HW.jpg)\n\
    \n14. 点击‘应用’按钮，然后点击‘确定’按钮\n\n"
