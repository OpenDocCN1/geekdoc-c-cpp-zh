    ![](img/rsrcDK.jpg)# 为什么“∑ 值”字段有时会默认显示“计数”而不是“求和”？


    当透视表的源数据包含空行时，例如选择了整个列（如 `(Sheet1!$A:$I)`）而不是特定的单元格范围（如 `(Sheet1!$A$1:$I$65)`），Excel®
    将默认将添加到“∑ 值”区域的字段计算方式设置为“计数”而不是“求和”。


    如果发生这种情况，要将“∑ 值”区域从计数更改为求和：


    *   点击 `Count of TOTAL`（总计计数）下拉箭头，然后从子菜单中选择 `Value Field Settings…`（值字段设置…）


    ![](img/rsrcE0.jpg)将出现 `Value Field Settings…` 对话框：


    *   从`汇总值字段`列表中选择 `Sum` 选项

    *   点击 `OK` 按钮


    ![](img/rsrcEA.jpg)


    ***


    继续我们的示例：你的屏幕右侧应显示以下内容。注意：该格式并不易读。![](img/rsrcEM.jpg)


    5. 我们可以更改列标签和数字格式。在下面的示例中：


    *   选择单元格 `A3` 并将文本从 `Row Labels`（行标签）更改为 `REGION`（区域）

    *   选择单元格 `B3` 并将文本从 `Sum of TOTAL`（总计）更改为 `TOTAL SALES`（总销售额）

    *   你还可以更改单元格 `B4:B7` 中的货币格式。在下面的示例中，格式被更改为零小数位的美元


    ![](img/rsrcF2.jpg)以下是格式化后的示例：![](img/rsrcF8.jpg)为了进一步增强报告，我们将添加季度列。这个“级别”维度将提供水果总销售量的更详细信息。


    6. 在“透视表字段”窗中，将 `QUARTER`（季度）字段拖到 `Columns`（列）区域。


    | 重要！ |

    | :--- |

    | Excel® 将“季度”读取为数值，因此如果你直接点击而不是将字段拖到 `Columns` 区域，Excel® 将应用某种计算。如果发生这种情况，点击
    `∑ Values` 区域中 `Sum of QUARTER`（季度求和）的下拉箭头，并选择 `Move to Column Labels`（移动到列标签）
    |


    ![](img/rsrcFZ.jpg)我们现在已摘要中添加了 `QUARTER`


    7. 选择单元格 `B3`并将文本从 `Column Labels`（列标签）更改为 `BY QUARTER`（按季度）

    8. 单元格 `B4`、`C4`、`D4` 和 `E4` 的标签通过在每个季度数字前添加缩写 `QTR` 已更改


    格式化前![](img/rsrcGA.jpg)格式化后：![](img/rsrcGF.jpg)


