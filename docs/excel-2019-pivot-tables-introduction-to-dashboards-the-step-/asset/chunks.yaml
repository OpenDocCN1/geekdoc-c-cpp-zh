    本章的示例数据，由于空间限制，未显示完整数据集。![](img/rsrcR2.jpg)分组记录创建一个新的透视表报告，要查看步骤 #1 - #3 的截图说明，请参见第
    4 章 基础透视表功能：


    1. 打开 `CustomerSales.xlsx` 表格并选择单元格 `A1:B31`

    2. 从带区选择 `Insert : PivotTable`（插入：透视表）

    3. 点击 `OK` 按钮


    将创建一个新标签页，“透视表字段”窗应出现在屏幕的左侧。


    4. 在“透视表字段”窗中拖动以下字段：

    *   `AMOUNT PURCHASED`（行区域）

    *   两次 `CUSTOMER ID`（∑ 值区域）


    ![](img/rsrcRT.jpg)


    5. 点击单元格 `A4`

    6. 从透视表工具带区选择选项卡 `Analyze : Group Field`（分析：分组字段）


