    ![](img/rsrcS2.jpg)将出现以下对话框：![](img/rsrcS7.jpg)


    7. 验证“起始于：(Starting at:)”和“结束于：(Ending at:)”复选框均已勾选：


    *   “起始于：”将默认值为 100（这是数据集中的最小值）

    *   “结束于：”将默认值为 1500（这是数据集中的最大值）

    *   在“间隔：(By:)”字段中输入 100（这是分组分段之间的金额）


    8. 点击“确定(OK)”按钮


    我们现在已经将客户购买金额分成了不同的段，每个区间的差额代表大约 100。然而，此表并没有提供有意义的信息，因为它错误地汇总了“客户 ID (CUSTOMER
    ID)”。要修复此问题：![](img/rsrcSP.jpg)


    9. 在“透视表字段”列表中，在`∑ Values`部分，点击第一个 `Sum of CUSTOMER ID`（客户 ID 之和）旁边的下拉箭头


    10. 选择`值字段设置...(Value Field Settings...)`选项


    ![](img/rsrcSY.jpg)


    ### 计数函数

    计数函数返回特定值在特定范围内出现的次数。在我们的示例中，我们正在统计在特定价格点范围内购买的客户人数。


    11. 在`值字段汇总方式(Summarize value field by)`列表框中选择`Count`计数）


    12. 在`自定义名称:(Custom Name:)`字段中更改为`NUMBER OF CUSTOMERS`客户人数）


    13. 点击“确定(OK)”按钮


    ![](img/rsrcTD.jpg)


    14. 在“透视表字段”列表中，在`∑ Values`部分，点击第二个 `Sum of CUSTOMER ID`（客户 ID 之和）旁边的下拉箭头


    15. 选择`值字段设置...(Value Field Settings...)`选项


    16. 在`值字段汇总方式(Summarize value field by)`列表中选择`Count`计数）


    17. 在`自定义名称:(Custom Name:)`字段中更改为`% OF CUSTOMERS（客户占比）


    ![](img/rsrcTU.jpg)


    18. 点击`显示值(Show Values As)`选项卡


    19. 点击`显示值方式(Show values as)`下拉箭头并选择`% of Grand Total`总计百分比）


    ![](img/rsrcU3.jpg)


    20. 点击“确定(OK)”按钮


    21. 将单元格`A3`中的文本从“行标签(Row Labels)”更改为“AMOUNT PURCHASED（购买金额）”


    我们现在有了一份报告，根据支出金额对客户人数进行分组，并显示每个购买组占销售总额的百分比。![](img/rsrcUF.jpg)


    # 第 7 章 切片器、时间轴与筛选


    Excel®提供了多种筛选选项，在本章中，我们将检查一些最常用的选项。前两个是图形化的，并为您的报告提供一种简单且直观的交互方式，它们是：


    *   **时间轴 (Timeline)**：是一种滑块或按钮筛选，允许用户将单个日期值快速分类为月份、季度或年份。

    *   **切片器 (Slicers)** 是按钮筛选，允许用户通过选择一个或多个文本值进行筛选。


    这些时间轴和切片器可以结合使用，非常适合喜欢从许多不同角度查看数据的分析师或客户。本章通过回顾几个内置的条件筛选来结束，这些包括如何快速识别表现最好和最后的者，以及仅返回符合特定数值阈值或文本的记录。


    ### 示例

    你是一名支持一家航天零件制造公司的财务分析师。你被要求参加一个针对区域经理的临时销售会议。议程尚未确定，你被要求准备过去 12 个月的销售数据，并在问题出现时进行回答。由于你不确定经理们会问什么，因此你决定创建一个带有时间轴和分类切片器的透视表报告。


    ### 练习的网页地址与文件名

    [`bentonbooks.wixsite.com/bentonbooks/excel-2019`](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)

    `AirplaneParts.xlsx`


    本章的示例数据，由于空间限制，未显示整个数据集。注意：列`E`是一个日期值。![](img/rsrcVG.jpg)


    ### 时间轴

    创建一个新的透视表报告，要查看步骤 #1 - #3 的截图说明，请参阅第 4 章 基本透视表功能：


    1. 打开`AirplaneParts.xlsx`电子表格并选择单元格`A1:F3889`

    2. 从功能区选择`插入(Insert) : 透视表(PivotTable)`

    3. 点击“确定(OK)”按钮


    将创建一个新标签页，“透视表字段”窗格应出现在屏幕左侧。


    4. 在`透视表字段`窗格中选择以下字段：

    *   `REGION`（区域）（行区域）

    *   `CATEGORY`（类别）（行区域）

    *   `QTY`（数量）（`∑ Values`区域）


    | 注意！ |

    | :--- |

    | 为了使用时间轴，日期列中的所有数据必须格式化日期。 |


    在此示例中，一旦我们点击字段 `EOM_DATE`，Excel® 将创建额外的日历选项季度和年份。![](img/rsrcWJ.jpg)


    5. 点击字段 `EOM_DATE`


    ![](img/rsrcWS.jpg)

    如你所见，Excel® 现在创建了季度和年份字段，但这种显示并不有用。财务分析师将无法快速回答问题。在添加时间轴之前，让我们重新排列透视表以对用户友好。


    6. 在`透视表字段`窗格中取消勾选以下字段：

    *   `Quarters`（季度）（行区域）

    *   `Years`（年份）（行区域）


    7. 将 `EOM_DATE`字段拖到`列`区域


    ![](img/rsrc.jpg)

    8. 在上方插入空白行

    9. 选择单元格`A14`，从透视表工具区选择`分析(Analyze) : 插入时间轴(Insert Timeline)`


    ![](img/rsrc.jpg)

    10. 勾选`EOM_DATE`并点击“确定(OK)”按钮

    11. 时间轴现在出现了，将其拖到单元格`A1`附近


    ![](img/rsrcY.jpg)

    通过选择单个月份尝试视图的变化。例如选择`Jan 2020`和`Feb 2020`![](img/rsrc5.jpg)


    ### 将时间轴更改为季度的示例![](img/rsrcYA.jpg)


    ### 切片器

    1. 选择单元格`A14`，从透视表工具区选择`分析(Analyze) : 插入切片器(Insert Slicer)`


    ![](img/rsrcYK.jpg)

    将得到以下内容：![](img/rsrcYS.jpg)


    2. 选`CATEGORY`并点击“确定(OK)”按钮

    3. 切片器现在出现了，将其拖到单元格`G1`附近


    ![](img/rsrcYZ.jpg)

    财务分析师现在只需点击即可回答所有类型的问题，无需手动排序或删除公式。例如：

    *   `Feb 2020`的燃料销售额是多少？

    *   在过去的 12 个月中，仅`Structural`（结构）和`Wing`（机翼）的合并销售额是多少？

    *   提供`2020 Q3`


    ### 报告连接

    报告连接允许将时间轴和/或切片器连接到多个透视表。要查看此功能的详细示例，请参阅第 14 章 自动仪表板。


    ### 时间轴与切片器的格式化

    更改时间轴或切片器的显示名称：


    1. 选择时间轴或切片器

    2. 从时间轴或切片器工具区选择`选项(Options)`

    3. 选择`时间轴标题(Timeline Caption)`或`切片器标题(Slicer Caption)`框并输入新名称


    ![](img/rsrcZN.jpg![](rsrcZS.jpg)


    更改时间轴或切片器的样式格式：


    4. 选择时间轴或切片器

    5. 从时间轴或切片器工具区选择`选项(Options)`

    6. 选择`时间轴样式(Timeline Styles)`或`切片器样式(Slicer Styles)`下拉菜单并选择新样式


    ![](img/rsrc101.jpg)


    ### 分组日期数据

    虽然将月份、季度和年份字段自动添加到`透视表字段`列表中是有帮助的，但有时您可能需要在报告中包含单个日期。使用我们当前的示例：


    1. 移除所有时间轴和切片器筛选，显示所有月份和类别

    2. 选择单元格`A14`，并在`透视表字段`窗格中取消勾选字段`REGION`和`CATEGORY`

    3.将`EOM_DATE`字段从`列`区域拖到`行`区域

    4. 选择任何月份，然后从透视表工具区选择`分析(Analyze) : 取消分组(Ungroup)`


