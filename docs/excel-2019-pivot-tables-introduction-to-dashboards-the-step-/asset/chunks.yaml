    ### Report Connections

    Report connections allow you to connect Timelines and/or Slicers to multiple PivotTables.
    To see a detailed example of how this functionality works, please see [Chapter
    14 Auto Parts Dashboard](#part018.xhtml_aMY).


    ### Formatting Timelines & Slicers

    To change the display name of either a Timeline or Slicer:


    1. Select either the Timeline or Slicer

    2. From the Timeline or Slicer Tools Ribbon, select `Options`

    3. Select either the `Timeline Caption` or `Slicer Caption` box and enter a new
    name


    ![](rsrcZN.jpg)![](rsrcZS.jpg)


    To change the Style format of a Timeline or Slicer:


    4. Select either the Timeline or Slicer

    5. From the Timeline or Slicer Tools Ribbon, select `Options`

    6. Select either the `Timeline Styles` or `Slicer Styles` drop-down menu and select
    a new style


    ![](rsrc101.jpg)


    ### Grouping Date Data

    While having the date fields Month, Quarter, & Year automatically be added to
    our `PivotTable Fields` list is helpful, there still may be times when you want
    to have the individual dates included in your report. Using our current example:


    1. Remove all Timeline and Slicer filters, so all months and categories are being
    displayed

    2. Select cell `A14` and from the `PivotTable Fields` pane uncheck fields `REGION`
    & `CATEGORY`

    3. Drag the `EOM_DATE` field from the `Columns` section to the `Rows` section

    4. Select any month, then from the PivotTable Tools Ribbon select the tab `Analyze
    : Ungroup`

