    \ button, either ‘Modify’ or ‘Delete’\n\n6.  Click the ‘OK’ button\n\n![](rsrc302.jpg)Calculated\
    \ Field LimitationsWhile calculated fields are helpful, they do have their limitations.\
    \ The problem is related to Grand Total calculations.  Most often this occurs\
    \ when you attempt to multiply two fields in a dataset where some aggregation\
    \ has already occurred.For example, when your data contains fields called  ‘Units’\
    \ & ‘Price’ and you attempt to determine the extended price, i.e.  Units * Price,\
    \ the individual rows will calculate correctly. However, the Totals will compute\
    \ as the  SUM of(Units)*SUM of(Price).Let’s walk through an illustration, let’s\
    \ say you’re attempting to calculate each vehicle type’s total sales, however\
    \ the vehicles were sold at different prices.![](rsrc30B.jpg)You create a PivotTable\
    \ with a calculated field called ‘SALES_TOTAL’ which is the  units * price, the\
    \ individual rows are correct, however the totals are not.![](rsrc30F.jpg)Microsoft\
    \ is aware of this [issue](https://support.microsoft.com/en-us/help/211470/calculated-field-returns-incorrect-grand-total-in-exce),[[3]](#part0021.xhtml_a3MD)\
    \ however has not provided a timeframe as to when the problem will be fixed.Let’s\
