- fmt: "\n![](rsrcDK.jpg)# Why Do The ‘∑ Values’ Fields sometimes default to Count\
    \ instead of Sum?\n\nWhen PivotTable source data contains blank rows, for example\
    \ when selecting the entire column such as `(Sheet1!$A:$I)` instead of a specific\
    \ cell rage `(Sheet1!$A$1:$I$65)`, Excel® will default the calculation of a field\
    \ added to the ‘∑ Values’ section to count instead of sum. \n\nIf this happens,\
    \ to change the ‘∑ Values’ section from count to sum:\n\n*   Click the `Count\
    \ of TOTAL` drop-down arrow, then from the sub-menu select `Value Field Settings…`\n\
    \n![](rsrcE0.jpg)The following `Value Field Settings…` dialogue box will appear:\n\
    \n*   From the `Summarize value field by` list, select the `Sum` option\n*   Click\
    \ the `OK` button\n\n![](rsrcEA.jpg)\n\n***\n\nContinuing with our example:The\
    \ following should be displayed on the right side of your screen.  Note: the format\
    \ is not very easy to read.![](rsrcEM.jpg)\n\n5. We can change the column labels\
    \ and format of the numbers. In the below example:\n\n*   Select cell `A3` and\
    \ change the text from `Row Labels` to `REGION`\n*   Select cell `B3` and change\
    \ the text from `Sum of TOTAL` to `TOTAL SALES`\n*   You may also change the currency\
    \ format in cells `B4:B7`. In the below example, the format was changed to U.S.\
    \ dollars with zero decimal places\n\n![](rsrcF2.jpg)Below is the formatted example:![](rsrcF8.jpg)To\
    \ enhance the report further we’re going going add Quarter columns. This “level”\
    \ dimension will provide greater detail of the total fruit sales.\n\n6. Inside\
    \ the ‘PivotTable Fields’ pane drag the `QUARTER` field to the `Columns` section.\n\
    \n| IMPORTANT! |\n| :--- |\n| Excel® is reading the ‘Quarter’ as a numeric value,\
    \ therefore if you click, instead of drag the field to the `Columns` section,\
    \ Excel® will apply a calculation.If this happens, click the drop-down arrow for\
    \ `Sum of QUARTER` in the `∑ Values` section and select the option `Move to Column\
    \ Labels` |\n\n![](rsrcFZ.jpg)We now have `QUARTER` added to the summary\n\n7.\
    \ Select cell `B3` and change the text from `Column Labels` to `BY QUARTER`\n\
    8. The labels for cells `B4`, `C4`, `D4`, & `E4` were changed by adding the abbreviation\
    \ text `QTR` in front of each quarter number\n\nBefore formatting:![](rsrcGA.jpg)After\
    \ formatting:![](rsrcGF.jpg)\n\n# How To Drill-Down PivotTable Data\n\nBefore\
    \ continuing with our example, let’s say you wanted to investigate further why\
    \ the Central Region’s Q1 results are so much higher than the East & West regions.![](rsrcGR.jpg)PivotTables\
    \ allow you to double-click on any calculated value to see the detail of that\
    \ cell. By double clicking the value, this will create a new worksheet containing\
    \ an Excel® table with the details of that cell.\n\n*   For example, double-click\
    \ on the calculated value in cell `B5`\n\n![](rsrcGZ.jpg)\n\n*   To delete the\
    \ table, right-click on `Sheet3` and select `Delete`\n\n![](rsrcH7.jpg)\n\n* \
    \  You’ll receive the following message, click the `Delete` button\n\n![](rsrcHE.jpg)\n\
    \n***\n\n# Adding Additional Rows (categories) To Your PivotTable\n\nLastly, we’ll\
    \ review how to display the individual fruit sales by region and quarter.\n\n\
    1. Drag the `QUARTER` field from the `COLUMNS` section to the `ROWS` section.\n\
    \n![](rsrcHT.jpg)\n\n2. Drag the fields `APPLES`, `ORANGES`, & `MANGOS` to the\
    \ `∑ Values` section of the `PivotTable Fields` pane, place the fruit fields before\
    \ the `TOTAL SALES` value\n\n![](rsrcJ0.jpg)The results should look similar to\
    \ the following:![](rsrcJ6.jpg)\n\n# CHAPTER 5 Displaying Percentages In PivotTables\n\
    \n***\n\nAnother great benefit of using PivotTables is the ability to display\
    \ numbers in various descriptive formats. In this chapter we’ll explore how to\
    \ use percentages.\n\n***\n\nEXAMPLE:You’re an analyst and need to determine:\n\
    \n*   The percentage of Airplane Parts sold by Region\n*   The percentage of Airplane\
    \ Parts sold by Category and Region\n\n***\n\nWEB ADDRESS & FILE NAME FOR EXERCISE:[https://bentonbooks.wixsite.com/bentonbooks/excel-2019](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)AirplaneParts.xlsx\n\
    \n***\n\nSample data for this chapter, due to space limitations the entire data\
    \ set is not displayed.![](rsrcK7.jpg)Create a new PivotTable report, to see screenshot\
    \ illustrations of steps #1 - #3, please see [chapter 4 Basic PivotTable Functionality](#part0008.xhtml_toc12_Summarizing_Data):\n\
    \n1. Open the `AirplaneParts.xlsx` spreadsheet and select cells `A1:F3889`\n2.\
    \ From the Ribbon select `Insert : PivotTable`\n3. Click the `OK` button\n\nA\
    \ new tab will be created and the `PivotTable Fields` pane should appear on the\
    \ left side of your screen.\n\n4. In the `PivotTable Fields` pane select:\n* \
    \  `REGION` (Rows section)\n*   `QTY` (∑ Values section)\n\nA report similar to\
    \ the following should be displayed:![](rsrcKX.jpg)\n\n5. Click the `Sum of QTY`\
    \ drop-down arrow, then `Value Field Settings…`![](rsrcM4.jpg)\n\n6. Select the\
    \ tab `Values As`\n7. From the `Show values as` list select `% of Grand Total`\n\
    8. In the field `Custom Name:` change to `% of QTY`\n9. Click the `OK` button\n\
    \n![](rsrcMT.jpg)\n\n| IMPORTANT! |\n| :--- |\n| In Excel®, often percentages\
    \ when summed may not equal 100%, this is due to Excel rounding the percentages\
    \ up or down. |\n\nWe’ve now answered the question, what is the percentage of\
    \ Airplane Parts sold by Region.\n\n***\n\nTo determine the percentage of Airplane\
    \ Parts sold by Category:\n\n1. In the `PivotTable Fields` pane drag the following:\n\
    *   `CATEGORY` (Rows section)\n\nLet’s improve the readability of the report\n\
    \n2. Select cells `B4:B19`, from the Ribbon, select `Home` and in the `Number`\
    \ section reduce the decimal place by two\n3. Select cell `A3` and change the\
    \ text from `Row Labels` to `Sales By Region`![](rsrcNN.jpg)\n\n4. Select cell\
    \ `A3` and from the PivotTable Tools select the `Design` tab own5. Select the\
    \ `Subtotals` drop-down arrow and then `Show all Subtotals at Bottom of Group`![](rsrcNZ.jpg)\n\
    \n# CHAPTER 6 Grouping PivotTable Data\n\n***\n\nWhile PivotTables are excellent\
    \ at summarizing information, there may be times when you have a lot of detailed\
    \ records such as customer demographics, sales, etc. With this type of data granularity,\
    \ often more insight can be gained when you can cluster these records into categories\
    \ or ranges. To complete this type of segmented analysis we can utilize the `Grouping`\
    \ feature.\n\n***\n\nEXAMPLE:You received a large amount of detailed customer\
