    ## Calculated Fields


    For our next two PivotTables, we’ll be using a custom calculated field. As demonstrated
    in the previous chapters, PivotTables have many built-in mathematical features,
    however the type of analysis you perform may require more complex calculations
    than those included in the standard set of PivotTable ‘Value Field Settings’.
    This is when the ability to insert your own ‘Calculated Fields’ is particularly
    helpful.


    ***


    ## PivotTable #4 – Employees Below 5% OF GOAL


    1.  Select cells ‘G8:H14’ right-click and select ‘Copy’ or press `Ctrl+C` on your
    keyboard


    2.  Place your cursor in cell ‘J8’ and or press `Ctrl+V` (paste) on your keyboard


    3.  With your cursor in cell ‘J8’, right-click and select ‘PivotTable Options...’
    enter `Employees_Below` for the PivotTable Name


    4.  Click the ‘OK’ button


    5.  Inside the `PivotTable Fields` pane uncheck the `CATEGORY` & `SALES` boxes


    6.  Inside the `PivotTable Fields` pane check the `EMPLOYEE` box


    7.  Select cell ‘J8’ change the name from ‘CATEGORY’ to `EMPLOYEE`


    8.  From the PivotTable Tools Ribbon select the tab `Design`


    9.  Click the drop-down box for ‘Grand Totals’ and select ‘Off for Rows and Columns’


    ![](rsrc2W1.jpg)


    10. From the PivotTable Tools Ribbon select the tab `Analyze`


    11. Click the `Fields, Items & Sets` drop-down box and select `Calculated Field...`


    ![](rsrc2W9.jpg)


