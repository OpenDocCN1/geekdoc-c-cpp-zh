    # CHAPTER 15 Refreshing PivotTable and Dashboard Data


    ***


    Once you have created a PivotTable and/or Dashboard with the preferred layout
    and formatting, you’re ready to receive new data. New information may be added
    to your existing PivotTable(s) either by appending or overwriting the existing
    data using the `Refresh` feature. Refreshing your data, allows you to keep your
    current formatting and calculations. Just remember in your initial design to allow
    for additional rows and columns that may be created when appending records.


    ***


    WEB ADDRESS & FILE NAME FOR EXERCISE: [https://bentonbooks.wixsite.com/bentonbooks/excel-2019](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)
    `Autoparts_Sales_Refresh_Data.xlsx`


    ## Appending An Existing (internal) Data Source


    In our first example, we’ll review using the `Refresh` feature by appending records.
    If you recall in chapter 14 the Auto Parts Dashboard, we created the initial PivotTable
    by selecting columns and not specific cells. Thus, we can receive a new month’s
    worth of sales and append our existing dataset, while continuing to keep all of
    our existing formatting and calculations.


    1. Open the `Autoparts_Sales_Refresh_Data.xlsx` worksheet.

    2. Select the `Data` tab.

    3. Copy cells `I2:O1441` by pressing `CTRL+C` on your keyboard or:


    ![](rsrc36N.jpg)

    4. Place your cursor in cell `A2882` and press `CTRL+V` on your keyboard.


    ![](rsrc36U.jpg)

    5. Return to the `Dashboard` tab and select cell `A8`.

    6. From the PivotTable Tools Ribbon select the tab `Analyze`.

    7. Click the `Refresh` drop-down arrow and select `Refresh All`.


    ![](rsrc375.jpg)

    Note: the updated information:![](rsrc37A.jpg)


    ### Refresh vs. Refresh All


    The difference between selecting `Refresh` vs. `Refresh All` is `Refresh` only
    updates the active PivotTable, by selecting `Refresh All` we’re updating all of
    the PivotTables in the Dashboard.


    ### Overriding Existing Data (Manually)


    In chapter 13 the Social Media Dashboard our requirements were to display the
    most recent week’s data and not a cumulative view. The process to override data
    is similar to appending, however with the additional step of deleting the existing
    data before adding the new records.


    ![](rsrc37M.jpg)


    | IMPORTANT! |

    | When overriding records always make sure to completely delete all of the old
    data before adding the new information. |


    The process of removing the old information and adding the new can be completed
    manually or automatically using VBA (Visual Basic for Applications). After the
    above is complete, you would follow the same process of:

    * Selecting a cell in the PivotTable

    * Then from the PivotTable Tools Ribbon select the tab `Analyze`

    * Clicking the `Refresh` drop-down arrow and selecting `Refresh All`


    ## Refreshing Data From An External Source


    In chapters 10 & 11 we created our PivotTable reports from imported data by connecting
    to external files. If we had saved the reports and then re-opened them, we may
    receive the following message: !SECURITY WARNING External Connections have been
    disabled![](rsrc38G.jpg)This is not a concern as long as the file being opened
    is from a trusted source. We would click the `Enable Content` button and then
    to refresh these reports we may follow the same process of:

    * Selecting a cell in the PivotTable

    * Then from the PivotTable Tools Ribbon select the tab `Analyze`

    * Clicking the `Refresh` drop-down arrow and selecting `Refresh All`


    | IMPORTANT! |

    | Never open or download files from a non-trusted source |


    Alternatively, you may also refresh the data by:

    * From the Ribbon select `Data`

    * Select the `Refresh` drop-down arrow and then choose the option `Refresh All`


    ![](rsrc39A.jpg)When refreshing from external sources you do not need to delete
    any existing data. The records will automatically be overwritten with the up-to-date
    information.


    # CHAPTER 16 Protecting Your Dashboard


    ***


    Depending on your audience, you may want to consider protecting your Dashboard
    to prevent unauthorized users from modifying it. As well as, hide any data source
    tabs, thus only allowing your customers to see the Dashboard itself.


    | IMPORTANT! |

    | Protecting the workbook or worksheet disables the use of slicers and prevents
    users from manually refreshing the data. |


