    \   Category Name\n\n    *   Value\n\n    *   Separator drop-down choose: (New\
    \ Line)\n\n![](rsrc26D.jpg)A chart similar to the below should now be displayed:You\
    \ may need to expand the length & width of the Map chart for better viewing![](rsrc26K.jpg)To\
    \ see a United Kingdom Map Chart example, please click on the worksheet tab labeled\
    \ ‘UK Map Chart Example’.![](rsrc26S.jpg)Icons (Graphics)![](rsrc26Y.jpg)Icons\
    \ are a simple way to give your dashboard visual appeal.  There are a variety\
    \ of options to choose from and their fill-color can be changed to enhance their\
    \ use.>Icon Example\n\n1.  Open the [DashboardGraphics.xlsx](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)\
    \ spreadsheet and select the worksheet ‘Icons’\n\n2.  From the Ribbon select INSERT\n\
    \n3.  Click the Illustrations drop-down arrow then Icons\n\n![](rsrc279.jpg)\n\
    \n4.  When prompted, under the ‘Analytics’ section, select the up & down arrow\
    \ chart icons\n\n5.  Click the ‘Insert’ button\n\n![](rsrc27F.jpg)The icons should\
    \ now be inserted into the worksheet; however, they may be overlapping each other\
    \ and need to be separated.\n\n6.  Select the down-arrow graph icon, right-click,\
    \ and select the option ‘Format Graphic’\n\n![](rsrc27N.jpg)\n\n7.  When prompted\
    \ select the ‘Fill’ color red\n\n![](rsrc27V.jpg)\n\n8.  Repeat steps 6 & 7 for\
    \ the up-arrow graph icon, this time select the ‘Fill’ color green\n\n![](rsrc281.jpg)People\
    \ (Add-Ins)![](rsrc287.jpg)The People Graph is a visually appealing chart type\
    \ to display numeric amounts versus using a bar or column chart.The People Graph\
    \ is considered an Excel® Add-in, requiring the user to install before the display\
    \ will work.>People Graph Example\n\n1.  Open the [DashboardGraphics.xlsx](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)\
    \ spreadsheet and select the worksheet ‘Add-in’\n\n2.  From the Ribbon select\
    \ INSERT\n\n3.  Click the People icon from the ‘Add-ins’ section\n\n![](rsrc28K.jpg)The\
    \ following prompt should now be displayed:![](rsrc28S.jpg)\n\n4.  Click the ‘Trust\
    \ this add-in’ button, it make a minute or two for the add-in to load\n\n5.  After\
    \ the add-in has loaded select the ‘Data’ button\n\n![](rsrc291.jpg)\n\n6.  Change\
    \ the Title to ‘Amount Raised By Volunteer’\n\n7.  Click the ‘Select your data’\
    \ button\n\n![](rsrc29A.jpg)\n\n8.  Select rows ‘A2:B11’ and click the ‘Create’\
    \ button\n\n![](rsrc29H.jpg)\n\n9.  Click the ‘Settings’ button\n\n![](rsrc29S.jpg)\n\
    \n10.  Select ‘Shape’ then the money bag symbol\n\n![](rsrc29Z.jpg)A chart similar\
    \ to the below should now be displayed:![](rsrc2A4.jpg)SparklinesSparklines are\
    \ mini trend charts contained inside a single cell of a worksheet.  Each sparkline\
    \ represents a single data element and can be displayed in three forms:\n\n1.\
    \  Line\n\n![](rsrc2AD.jpg)\n\n2.  Column\n\n![](rsrc2AM.jpg)\n\n3.  Win/Loss\n\
    \n![](rsrc2AV.jpg)Please see chapters [13](#part0017.xhtml_toc71_Adding_Sparklines_To_The_Dashboard)\
    \ & [14](#part0018.xhtml_a3M9) for examples using SparklinesIcon Sets (Conditional\
    \ Formatting)Icon sets are a type of conditional formatting allowing users to\
    \ visually identify cell values with a graphic symbol based on specific criteria,\
    \ such as thresholds, percentiles, or a formula.  The most commonly used indicators\
    \ are directional arrows; positive, negative, neutral indicators; and ratings:![](rsrc2B2.jpg)![](rsrc2B6.jpg)Please\
    \ see [chapter 13](#part0017.xhtml_a3NZ) for an examples using Icon SetsCHAPTER\
    \ 13Social Media Dashboard Example\n\n* * *\n\nA Marketing manager has asked you\
    \ to create a weekly dashboard for her to monitor social media trends and to ensure\
    \ money spent on the different mediums is generating a minimum of six views a\
    \ day.The dashboard should include the following:\n\n*   The date, day of the\
    \ week, and number of views for each medium\n\n*   A small chart displaying each\
    \ medium’s weekly trend\n\nThe data is generated from a database query.  You’ll\
    \ receive updated data at the start of every week for the prior week’s views. \
    \ Users will access the dashboard online as well as mobile devices.\n\n* * *\n\
    \nWEB ADDRESS & FILE NAME FOR EXERCISE:[https://bentonbooks.wixsite.com/bentonbooks/excel-2019](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)SocialMediaData.xlsx\n\
    \n* * *\n\nSample data for this chapter, due to space limitations the entire data\
    \ set is not displayed.![](rsrc2C4.jpg)Preparing The DataThe dashboard is the\
    \ end product; however, we must first transform the raw data into a format in\
    \ which graphics may be applied and allows the customer to perform the analysis\
    \ requested.First, we’ll create a PivotTable to display the data in a tabular\
    \ layout.\n\n1.  Open exercise file  SocialMediaData.xlsx and select columns ‘A:C’\n\
    \n2.  From the Ribbon select Insert : PivotTable\n\n3.  Select the ‘New Worksheet’\
    \ radio button\n\n4.  Click the ‘OK’ button\n\n![](rsrc2CH.jpg)\n\n| Cells vs\
    \ Columns |"
