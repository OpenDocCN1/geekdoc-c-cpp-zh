    最后，我们将回顾如何按区域和季度显示各个水果销售情况。


    1. 将 `QUARTER` 字段从 `COLUMNS`（列）区域拖到 `ROWS`（行）区域。


    ![](img/rsrcHT.jpg)


    2. 将字段 `APPLES`（苹果）、`ORANGES`（橙子）和 `MANGOS`（芒果）拖到透视表字段窗的 `∑ Values`区域，将水果字段放在
    `TOTAL SALES` 值之前


    ![](img/rsrcJ0.jpg)结果应类似于所示：![](img/rsrcJ6.jpg)


    # 第 5 章在透视表中显示百分比


    ***


    使用透视表的另一个巨大优势是能够以各种描述性格式显示数字。在本章中我们将探索如何使用百分比。


    ***


    示例：你是一名分析师，需要确定：


    *   按区域销售的飞机零件百分比

    *   按类别和区域销售的飞机零件百分比


    ***


    练习网地址和文件名：[`bentonbooks.wixsite.com/bentonbooks/excel-2019`](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)AirplaneParts.xlsx


    ***


    本章的示例数据，由于空间限制，未显示完整数据集。![](img/rsrcK7.jpg)创建一个新的透视表报告，要查看步骤 #1 - #3 的截图说明，请参见第
    4 章 基础透视表功能：


    1. 打开 `AirplaneParts.xlsx` 表格并选择单元格 `A1:F3889`

    2. 从带区选择 `Insert : PivotTable`（插入：透视表）

    3. 点击 `OK` 按钮


    将创建一个新标签页，“透视表字段”窗应出现在屏幕的左侧。


    4. 在“透视表字段”窗中选择：

    *   `REGION`（行区域）

    *   `QTY`（∑ 值区域）


    应显示类似于下面的报告：![](img/rsrcKX.jpg)


    5. 点击 `Sum of QTY` 下拉箭头，然后点击 `Value Field Settings…`![](img/rsrcM4.jpg)


    6. 选择选项卡 `Values As`（值显示）

    7. 从 `Show values as`（显示值方式）列表中选择 `% of Grand Total`（总计百分比）

    8. 在字段 `Custom Name:`（自定义名称）更改为 `% of QTY`

    9. 点击 `OK` 按钮


    ![](img/rsrcMT.jpg)


    | 重要！ |

    | :--- |

    | 在 Excel® 中，百分比求和有时可能不等于 100%，这是由于 Excel 对百分比进行了四舍五入。 |


    我们现在已经回答了问题：按区域销售的飞机零件百分比是多少。


    ***


    要确定按类别销售的飞机零件百分比：


    1. 在“透视表字段”窗中拖动以下内容：

    *   `CATEGORY`（行区域）


    让我们提高报告的可读性


    2. 选择单元格 `B4:B19`，从带区选择 `Home`（首页），并在 `Number`（数字）部分将小数减少两位

    3. 选择单元格 `A3`并将文本从 `Row Labels`（行标签）更改为 `Sales By Region`（按区域销售）![](img/rsrcNN.jpg)


    4. 选择单元格 `A3`，从透视表工具选择 `Design`（设计）选项卡 5.选择 `Subtotals`（汇总）下拉箭头，然后选择 `Show all
    Subtotals at Bottom of Group`（组底部显示所有汇总）![](img/rsrcNZ.jpg)


    # 第 6 章透视表数据分组


    ***


    虽然透视表非常适合汇总信息，有时会有大量的详细记录，例如客户统计、销售等。对于这种粒度的数据，当你可以将这些记录聚类到类别或范围时，通常可以获得更深入的见解。为了完成这种细分分析，我们可以利用“分组”功能。


    ***


    示例：你收到了大量的详细记录，需要：


    *   按支出对客户分组

    *   每个部分占总销售额的百分比


    ***


    练习网地址和文件名：（同上）CustomerSales.xlsx


