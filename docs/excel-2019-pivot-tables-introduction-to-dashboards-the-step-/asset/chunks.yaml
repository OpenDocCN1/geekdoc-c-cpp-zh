    \ values match between the two queries.Unlike appending where we’re bringing together\
    \ all of the data, when merging we’re only combining select columns and rows from\
    \ the different sources.![](rsrc1WN.jpg)In our example the column names and data\
    \ types of the content are the same, and we want all the rows from each query\
    \ for our report, therefore we’ll be using the ‘Append’ method.\n\n8.  From the\
    \ Ribbon select Data\n\n9.  Click the ‘Get Data’ drop-down arrow and select Combine\
    \ Queries : Append\n\n![](rsrc1WZ.jpg)\n\n10.  Select the following when prompted:\n\
    \n    *   Select the radio button for ‘Three or more tables’\n\n    *   Select\
    \ all 4 tables and click the ‘Add >>’ button\n\n    *   Click the ‘OK’ button\n\
    \n![](rsrc1XB.jpg)This will open the Power Query Editor![](rsrc1XG.jpg)\n\n11.\
    \  Select the ‘Close & Load’ drop-down arrow and then ‘Close & Load To..’\n\n\
    ![](rsrc1XN.jpg)It may take a moment for the following prompt to appear:\n\n12.\
    \  For the ‘Import Data’ prompt:\n\n*   Select the radio button for ‘PivotTable\
    \ Report’\n\n*   Click the check box for ‘Add this data to the Data Model’\n\n\
    *   Click the ‘OK’ button\n\n![](rsrc1Y1.jpg)We’ve taken four separate queries\
    \ and combined them into one and now may create and modify the PivotTable as needed.\n\
    \n13.  In the ‘PivotTable Fields’ pane select the following fields:\n\n    * \
    \  REGION (Rows section)\n\n    *   PLAN      (∑  Values section)\n\n![](rsrc1YF.jpg)\n\
    \n14.  Optionally, format the PivotTable report to improve readability\n\n![](rsrc1YM.jpg)We’ve\
    \ now completed the request to consolidate four Regional detailed monthly sales\
    \ plans for the year 2020 into a single high level summary.Please see [Chapter\
    \ 15](#part0019.xhtml_a3NT) to learn more about Refreshing PivotTable Data.CHAPTER\
    \ 12Introduction To DashboardsWhat is a Dashboard?A business or digital dashboard\
    \ in the simplest terms, is a display of metrics in numeric or graphical form. \
    \ These metrics or what is commonly referred to as measures, range widely depending\
    \ on the customer and type of organization.The components of a dashboard vary,\
    \ but typically include one-or-more of the following, at a glance:\n\n*   Provide\
    \ an answer to a business question\n\n*   Show comparisons such as this year’s\
    \ (TY) sales compared to last year’s (LY) sales\n\n*   The progress or status\
    \ of meeting a target, for example reaching a sales, production, or safety goal\n\
    \n*   Trends such as identifying if an activity is trending up, down, or about\
    \ the same\n\nA dashboard is usually limited to one functional area, like Manufacturing,\
    \ Human Resources, Finance, Logistics, or Marketing and may be static or interactive.Dashboard\
    \ DesignThe elements of a well-designed digital dashboard include working closing\
    \ with the consumers of the dashboard to understand:\n\n*   How are they planning\
    \ to use the information in the dashboard to improve their objectives?  Will they\
    \ be tracking performance, monitoring progress, or something else?\n\n*   How\
    \ will they measure the success or usefulness of the dashboard?\n\n*   Does your\
    \ audience require separate slices of the data? Perhaps a manger is interested\
    \ in seeing only their own geographic area.\n\n*   How will your audience view\
    \ or access the dashboard?  In paper form, on a website, mobile device?  You’ll\
    \ want to be mindful of spacing and the use of colors if your audience reads the\
    \ dashboard on paper printed in black and white ink.  Likewise, you may need to\
    \ limit the amount of information displayed or use of charts if viewing on a mobile\
    \ device.\n\n*   Will the dashboard be temporary or a permanent part of your customer’s\
    \ daily, weekly, or monthly routine?\n\n*   What data sources and at what frequency\
    \ (real-time, daily, weekly, or monthly) are available for your dashboard?\n\n\
    *   Are there data restrictions or information security concerns with publishing\
    \ the dashboard?\n\n*   How will you maintain the dashboard?  Will it require\
    \ manual updating or will your design allow the data to be refreshed when a customer\
    \ accesses it?  This may also be dependent on the required permissions to the\
    \ data source.\n\nThe purpose of the dashboard should be clear to anyone viewing\
    \ it and include:\n\n*   A title or brief description of the dashboard\n\n*  \
    \ The time period the data covers\n\nIt’s been my experience to start small when\
    \ creating a dashboard. Once your customers start using the information, they\
    \ almost always ask for more and request changes to the layout.You’ll want to\
    \ manage customer expectations accordingly. What seems like a simple change or\
    \ graphic to your customer may require a lot of data preparation behind the scenes. \
    \ It is important to balance the amount of time you spend creating and maintaining\
    \ the dashboard with the benefits it provides.Dashboard GraphicsIn addition to\
    \ charts, Excel® offers a number of built-in graphics to aid in dashboard development. \
    \ In the following chapters we’ll examine how to use some of these, along with\
    \ creating a multi-PivotTable based dashboard.In chapter 8, we explored how to\
    \ use four types of Pivot Charts.  In this chapter, we’ll explore Sparklines,\
    \ Add-Ins, Icon Sets, and two additional Excel® charts (Doughnut & Map).\n\n|\
    \ IMPORTANT! |\n\n| Not all chart types work with PivotTable data, these include,\
    \ ‘Map’, ‘Funnel’, ‘Scatter’ and more.  We can still use these graphs in our dashboards,\
    \ but the data must be prepared in a way compatible with the particular chart\
    \ type. |\n\nThe following describes some of the most commonly used illustrative\
    \ tools in Excel®, however, does not review all visual mechanisms available.Doughnut\
    \ Chart![](rsrc211.jpg)A ‘Doughnut Chart’ is a variation of a ‘Pie Chart’, it\
    \ too is most appropriate for illustrating percentages as part of the whole. \
    \ However, when using in a dashboard typically only two values are compared. \
    \ This is because Doughnut charts can be difficult to read when more than two\
    \ or three values are being evaluated.>Doughnut Chart ExampleLet’s walk through\
    \ an exercise on how to create a Doughnut chart using PivotTable data.\n\n1. \
    \ Open the [DashboardGraphics.xlsx](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)\
    \ spreadsheet and select the worksheet ‘Doughnut Chart’\n\n![](rsrc21B.jpg)\n\n\
    2.  From the Ribbon select PivotTable Tools : Analyze and then the PivotChart\
    \ icon\n\n![](rsrc14Z.jpg)\n\n| IMPORTANT! |"
