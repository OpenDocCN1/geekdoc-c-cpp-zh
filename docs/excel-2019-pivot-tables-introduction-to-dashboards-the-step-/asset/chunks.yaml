  trans: "\n\n像 Excel® 中的许多任务一样，文件的导入和解析可以通过多种方式完成。以下示例描述了如何使用 Excel® 数据模型（Data Model）读取并解析\
    \ `.CSV`（逗号分隔值）文件。导入数据后，我们将创建两个数据透表（PivotTable）报告。\n\n# Excel® 数据模型\nExcel® 数据模型是一个功能，通过计算机或网络连接以及查询，可以将不同来源的数据整合到单个工作簿中。一旦这些信息进入工作簿，你就可以创建数据透表和图表。这种类型的报告也可以通过宏（Visual\
    \ Basic for Applications）、Power Pivot、Power Query（请参阅下一章）和 Power View 实现。决定哪种方法取决于多种因素，例如：\n\
    \n*   你正在分析的数据量\n*   完成分析的复杂程度所需的时间\n*   受众的需求\n*   你对 Excel® 的熟悉程度以及你使用的版本\n\n\
    在以下示例中，报告非常简单。我们将报告少于 100 条记录，我们的 Excel® 数据模型将仅包含数据源（一个 `.CSV` 文件）。![](img/rsrc1KU.jpg)\
    \ 第 11 章描述了如何使用“Power Query”合并来自多个工作簿且记录数较大的数据以创建数据透表。![](img/rsrc1KZ.jpg)\n\n\
    ***\n\n## 示例：你是一名业务分析师，收到更改每月员工销售报告的请求。管理层现在希望：\n\n*   按月份划分区域销售摘要\n*   按区域分组并汇总员工销售额\n\
    \n员工销售额记录在一个遗留系统中。该旧系统生成一个一个月的 `.CSV` 文件并将其保存到公司服务器的某个位置。为了节省每月每月格式化相同报告的时间，你创建了两个数据透表来导入并格式化数据。\n\
    \n***\n\n### 练习网地址与文件名\n[`bentonbooks.wixsite.com/bentonbooks/excel-2019`](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)\n\
    `EmployeeSales.csv`\n`MonthlySalesReport.xlsx`\n\n***\n\n| 本章的额外步骤 |\n| :--- |\n\
    | 将 `EmployeeSales.csv` 文件保存到你可以轻松访问的位置，例如临时文件夹或桌面桌面。 |\n\n***\n\n来自 `.CSV` 文件：![](img/rsrc1N0.jpg)\n\
    \n***\n\n到 Excel® 报告：![](img/rsrc1N6.jpg)\n\n***\n\n| 重要！ |\n| :--- |\n| 以下步骤和截图使用\
    \ Excel® 2019 版本，之前的版本 Excel® 界面非常不同。 |\n\n***\n\n1.  将 `EmployeeSales.csv` 练习文件下载到你可以轻松访问的位置，例如临时文件夹或桌面桌面\n\
    2.  打开 `MonthlySalesReport.xlsx` 表格\n3.  从功能区选择`数据（Data）`，然后选择“来自文本/CSV”![](img/rsrc1NV.jpg)\n\
    4.  打开 `EmployeeSales.csv` 文件所在的位置\n5.  选择文件并点击“导入（Import）”按钮![](img/rsrc1P4.jpg)\
    \ 将出现提示：\n6.  点击`加载（Load）`下拉框并选择`加载到...（Load To...`选项![](img/rsrc1PC.jpg)\n7.\
    \  对于“导入数据（Import Data）”提示：\n    *   选择“数据透表报告”单选按钮\n    *   选择“现有工作表”单选按钮，在单元格位置输入\
    \ `=$E$3`\n    *   勾选“将此数据添加到数据模型”复框\n    *   点击`确定（OK）`按钮![](img/rsrc1PR.jpg)![](img/rsrc1PV.jpg)\n\
    8.  在“数据透表字段”窗中选择以下字段：\n    *   `REGION`（行区域）\n    *   `MONTH`（列区域）\n    *   `SALES`（∑\
    \ 值区域）![](img/rsrc1R9.jpg)\n9.  右键点击“总计（Grand Total）”字段（单元格 `G4`）并选择“删除总计”![](img/rsrc1RG.jpg)\n\
    10. 格式更改：\n    *   单元格 `E3` 文本更改为 `SALES`\n    *   单元格 `F3` 文本更改为 `MONTH`\n  \
    \  *   单元格 `E4` 文本更改为 `REGION`\n    *   单元格 `E9` 文本更改为 `TOTAL`\n    *   单元格 `F5:F9`\
    \ 设置你喜好的货币格式![](img/rsrc1S4.jpg) 复制数据透表\n11. 选择单元格 `E3:F9`，右键点击并选择`复制`或在键盘上按 `Ctrl+C`\n\
    12. 将光标放在单元格 `A3` 中，并在键盘上按 `Ctrl+V`（粘贴）\n13. 在“数据透表字段”窗中选择 `SALES PERSON LAST\
    \ NAME` 框\n14. 将光标放在单元格 `A5` 中，右键点击并选择`汇总“REGION”`](rsrc1SG.jpg)\n15. 格式更改：\n\
    \    *   单元格 `A3` 文本更改为 `REGION`\n    *   单元格 `A4` 文本更改为 `EMPLOYEE`\n\n最终报告应该看起来所示：![](img/rsrc1SX.jpg)\
    \ 请查看第 15 章了解更多关于刷新数据透表数据的信息。\n\n# 第 11 章：合并独立工作簿的数据以创建单个数据透表\n\n***\n\n现实世界中常见的挑战是从不同来源收集数据并将其整合到一个文件中。这个过程非常耗时且容易出错。然而，具备数据建模和不同来源之间关系的某些知识是至关重要的。\n\
    \n"
