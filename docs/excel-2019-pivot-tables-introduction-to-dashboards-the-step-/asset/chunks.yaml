  trans: "\n\n* 勾选 `West` 复选框\n* 点击 `Load` 下拉箭头并选择 `Load To…` \n\n![](img/rsrc1VH.jpg)\n\
    \n### 6. 对于 `Import Data` 提示框：\n\n* 选择 `Only Create Connection` 单选按钮\n* 勾选 `Add\
    \ this data to the Data Model` 复选框\n* 点击 `OK` 按钮\n\n![](img/rsrc1VV.jpg)![](img/rsrc1PV.jpg)当连接建立后，你的屏幕应该看起来如下：![](img/rsrc1W1.jpg)\n\
    \n### 7. 针对文件 `Data_File - North_South.xlsx` 重复步骤 3–6\n\n在建立与文件 `Data_File - North_South.xlsx`\
    \ 的连接后，我们将合并这些查询。完成后，我们就可以创建汇总的透视表报告。本质上，我们到目前为止完成的是创建两个连接，从两个独立的工作簿中选择所有数据。接下来，我们需要通过创建一个新查询将这两个查询合并在一起。合并查询有两种选项：`Append`（追加）和\
    \ `Merge`（合并）：\n\n#### Power Query 中的 Append 与 Merge\n\n`Append`：用于你要合并的数据在结构上相似（即具有相同的列数和列名），并且你想将每个查询中的所有行合并在一起。这就像是从一个文件复制所有数据并将其粘贴到另一个文件的底部，从而创建一个包含所有记录的大文件。\n\
    \n`Merge`：当你要合并的数据仅包含某些共同的列时使用。这些共同列可能有不同的列名，但它们之间的内容和数据类型是相同的。在这种情况下，我们有一个主查询和一个主键值，该键值匹配次要查询中的相同值。新查询的结果将汇总了两个查询之间键值匹配的记录。与合并所有数据的追加不同，在合并（Merge）时，我们只组合来自不同源的特定列和行。![](img/rsrc1WN.jpg)在我们的示例中，内容的列名和数据类型是相同的，我们需要每个查询中的所有行来制作报告，因此我们将使用\
    \ `Append` 方法。\n\n### 8. 从功能区（Ribbon）选择 `Data`\n\n### 9. 点击 `Get Data` 下拉箭头并选择\
    \ `Combine Queries : Append`\n\n![](img/rsrc1WZ.jpg)\n\n### 10. 提示时选择以下内容：\n\n\
    * 选择 `Three or more tables` 单选按钮\n* 选择所有 4 个表并点击 `Add >>` 按钮\n* 点击 `OK` 按钮\n\n\
    ![](img/rsrc1XB.jpg)这将打开 Power Query 编辑器![](img/rsrc1XG.jpg\n\n### 11. 选择 `Close\
    \ & Load` 下拉箭头然后选择 `Close & Load To..`\n\n![](rsrc1XN.jpg)出现后续提示可能需要一些时间：\n\n\
    ### 12. 对于 `Import Data` 提示框：\n\n* 选择 `PivotTable Report` 单选按钮\n* 勾选 `Add this\
    \ data to the Data Model` 复选框\n* 点击 `OK` 按钮\n\n![](img/rsrc1Y1.jpg)我们已经将四个独立的查询合并为一个，现在可以根据需要创建和修改透视表。\n\
    \n### 13. 在 `PivotTable Fields` 窗格中选择以下字段：\n\n* `REGION`（行区域）\n* `PLAN`（∑ Values\
    \ 值区域）\n\n![](img/rsrc1YF.jpg)\n\n### 14. 可选：格式化透视表报告以提高可读性\n\n![](img/rsrc1YM.jpg)我们现在已经完成了将\
    \ 2020 年四个地区的详细月度销售计划合并为高层摘要的请求。请查看第 15 章了解更多关于刷新透视表数据的知识。\n\n# 第 12 章 仪表板简介\n\
    \n## 什么是仪表板？\n\n简单来说，业务或数字仪表板是以数字或图形形式显示的指标。这些指标（或通常所说的度量/measures）的范围很大，取决于客户和组织类型。仪表板的组件各不相同，但通常一目了包含以下一项或多项：\n\
    \n* 为业务问题提供答案\n* 显示比较，例如今年（TY）销售额与去年（LY）销售额的比较\n* 达成目标的进度或状态，例如达到销售、生产或安全目标\n\
    * 趋势，例如识别某活动趋势是上升、下降还是持平\n\n仪表板通常局限于一个功能领域，如制造、人力资源、财务、物流或营销，可以是静态的也可以是交互的。\n\n\
    ## 仪表板设计\n\n良好的数字仪表板设计元素与仪表板用户紧密合作，以理解：\n\n* 他们计划如何使用仪表板中的信息来改进目标？他们是跟踪性能、监控进度还是其他？\n\
    * 他们将如何衡量仪表板的成功或实用性？\n* 你的受众是否需要单独的数据切片？也许某个经理只想看他们自己的地理区域。\n* 你的受众将如何查看或访问仪表板？纸质版、网站还是移动设备？如果你的受众在黑白打印的纸上阅读仪表板，你需要留意间距和颜色的使用。\n\
    \n## 仪表板图形\n\n除了图表，Excel® 还提供了许多内置图形来辅助仪表板开发。在后续章节中，我们将研究如何使用这些图形，以及创建多透视表基础。\n\
    \n| 注意！ |\n| :--- |\n| 并非所有图表类型都支持透视表数据，包括地图、漏斗图、散点图等。我们仍然可以在仪表板中使用这些图形，但数据必须以兼容特定图表类型的方式进行准备。\
    \ |\n\n### 圆环图\n\nrsrc21.jpg`圆环图`是`饼图`的变体，它同样适用于展示作为整体一部分的百分比。然而，在仪表板中使用时通常比较两个值。这是因为当评估两个或三个以上的值时，圆环图很难阅读。\n\
    \n### 圆环图示例\n\n让我们练习如何使用透视表数据创建圆环图。\n\n1. 打开 [DashboardGraphics.xlsx](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)电子表格，并选择\
    \ `Doughnut Chart` 工作表\n\n![](img/rsrc21B.jpg)\n\n2. 从功能区选择 `PivotTable Tools\
    \ : Analyze`，然后点击 `PivotChart` 图标\n\n![](img/rsrc14Z.jpg)\n\n"
- fmt: "\n| If you do not see the PivotTable Tools : Analyze option on your Ribbon,\
    \ click any PivotTable cell. This option only appears when a PivotTable field\
    \ is active. |\n\n3. Select ‘Pie’ from the dialogue box\n\n4. Select the last\
    \ option ‘Doughnut’\n\n![](rsrc21W.jpg)\n\n5. Click the ‘OK’ button\n\nA chart\
    \ similar to the below should now be displayed:![](rsrc223.jpg)The following steps\
    \ 6 – 20 are optional\n\n6.  Hide the Field buttons, right-click over any Field\
    \ button and select ‘Hide All Field Buttons on Chart’\n\n7.  With the chart selected,\
    \ click the plus `+` button next to the chart and uncheck the ‘Legend’ box\n\n\
    ![](rsrc22B.jpg)\n\n8.  Click the paint brush button, select ‘Color’ then a ‘Monochromatic’\
    \ color of your choice\n\n![](rsrc22J.jpg)\n\n9.  Double click to select the smaller\
    \ portion of the Doughnut chart\n\n![](rsrc22T.jpg)\n\n10. From the `Format Data\
    \ Point` menu, select the `Paint Bucket` and click the `Pattern fill` radio button\n\
    \n11. Select a pattern format of your choice\n\n![](rsrc232.jpg)\n\n12. Click\
    \ outside the chart, for example cell `C2`\n\n13. From the `Ribbon` select `Insert\
    \ : Illustrations : Shapes`\n\n![](rsrc23B.jpg)\n\n14. From the `Shapes` drop-down\
    \ menu select the `Text Box` shape\n\n![](rsrc23J.jpg)\n\n15. Drag the upside-down\
    \ cross to the center of the Doughnut chart and draw a square\n\n![](rsrc23T.jpg)\n\
    \n16. With your cursor inside the `TextBox`, select the formula bar and enter\
    \ `=$B$2` (press the `Enter` button on your keyboard) to link the formula to the\
    \ `TextBox)\n\n![](rsrc240.jpg)\n\n17. Change the font size and style of the `TextBox`\
    \ to a theme of your choice\n\n![](rsrc247.jpg)\n\n18. Select `TextBox` and right-click,\
    \ from the sub-menu select `Format Shape…`\n\n19. Select the `Paint Bucket` and\
    \ click the `No Fill` and `No Line` radio buttons\n\n![](rsrc24G.jpg)\n\n20. Change\
    \ the title from ‘Total’ to ‘% of Repeat Donors’\n\nA chart similar to the below\
    \ should now be displayed:![](rsrc24S.jpg)Geographic (Maps)![](rsrc24Y.jpg)The\
    \ Map chart type is useful for understanding high level geographic information.\
    \ At the time of this book’s publication, the Map chart does not support lower\
    \ level geographical data such as cities. For example, if you were analyzing a\
    \ percentage of sales by US State, and wanted to drill-down to see sales by city\
    \ in the State of California, this chart type would not work. Also, this chart\
    \ type does not work with PivotTable data and creating or updating the chart requires\
    \ an internet connection. Existing Map charts do not require a network access.\n\
    \n| IMPORTANT! |\n\n| The following steps & screenshots use Excel® version 2019,\
    \ the interface for the previous versions of Excel® is very different. |\n\n###\
    \ Map Example\n\n1. Open the [DashboardGraphics.xlsx](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)\
    \ spreadsheet and select the worksheet `Map Chart`\n\n![](rsrc25F.jpg)\n\n2. Select\
    \ cells `A2:B20`\n\n3. From the Ribbon select `INSERT`\n\n4. Under the Charts\
    \ menu, click the `Maps` drop-down arrow\n\n5. Choose ‘Filled Map’\n\n![](rsrc25S.jpg)\n\
    \n6. With the chart selected, click the plus `+` button next to the chart\n\n\
    7. Select the arrow next to `Data Labels` then `Show More Data Label Options…`\n\
    \n![](rsrc25Z.jpg)\n\n8. From the `Format Data Labels…` menu select:\n    * Category\
    \ Name\n    * Value\n    * Separator drop-down choose: (New Line)\n\n![](rsrc26D.jpg)A\
    \ chart similar to the below should now be displayed:You may need to expand the\
    \ length & width of the Map chart for better viewing![](rsrc26K.jpg)To see a United\
    \ Kingdom Map Chart example, please click on the worksheet tab labeled ‘UK Map\
    \ Chart Example’.(rsrc26S.jpg)\n\n### Icons (Graphics)![](rsrc26Y.jpg)Icons are\
    \ a simple way to give your dashboard visual appeal. There are a variety of options\
    \ to choose from and their fill-color can be changed to enhance their use.\n\n\
    > Icon Example\n\n1. Open the [DashboardGraphics.xlsx](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)\
    \ spreadsheet and select the worksheet `Icons`\n\n2. From the Ribbon select `INSERT`\n\
    \n3. Click the `Illustrations` drop-down arrow then `Icons`\n\n![](rsrc279.jpg)\n\
    \n4. When prompted, under the `Analytics` section, select the up & down arrow\
    \ chart icons\n\n5. Click the `Insert` button\n\n![](rsrc27F.jpg)The icons should\
    \ now be inserted into the worksheet; however, they may be overlapping each other\
    \ and need to be separated.\n\n6. Select the down-arrow graph icon, right-click,\
    \ and select the option `Format Graphic`\n\n![](rsrc27N.jpg)\n\n7. When prompted\
    \ select the `Fill` color red\n\n![](rsrc27V.jpg)\n\n8. Repeat steps 6 & 7 for\
    \ the up-arrow graph icon, this time select the `Fill` color green\n\n![](rsrc281.jpg)\n\
    \n### People (Add-Ins)![](rsrc287.jpg)The People Graph is a visually appealing\
    \ chart type to display numeric amounts versus using a bar or column chart. The\
    \ People Graph is considered an Excel® Add-in, requiring the user to install before\
    \ the display will work.\n\n> People Graph Example\n\n1. Open the [DashboardGraphics.xlsx](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)\
    \ spreadsheet and select the worksheet `Add-in`\n\n2. From the Ribbon select `INSERT`\n\
    \n3. Click the `People` icon from the `Add-ins` section\n\n![](rsrc28K.jpg)The\
    \ following prompt should now be displayed:![](rsrc28S.jpg)\n\n4. Click the `Trust\
    \ this add-in` button, it make a minute or two for the add-in to load\n\n5. After\
    \ the add-in has loaded select the `Data`\n\n![](rsrc291.jpg)\n\n6. Change the\
    \ title to ‘Amount Raised By Volunteer’\n\n7. Click the `Select your data`\n\n\
    ![](rsrc29A.jpg)\n\n8. Select rows `A2:11` and click the `Create`\n\n![](rsrc29H.jpg)\n\
    \n9. Click the `Settings`\n\n![](rsrc29S.jpg)\n\n10. Select `Shape` then money\
    \ bag symbol\n\n![](rsrc29Z.jpg)A chart similar to the below should now be displayed:![](rsrc2A4.jpg)SparklinesSparklines\
    \ are mini trend charts contained inside a single cell of a worksheet. Each sparkline\
    \ represents a single data element and can be displayed in three forms:\n\n1.\
    \ Line\n\n![](rsrc2AD.jpg)\n\n2. Column\n\n![](rsrc2AM.jpg)\n\n3. Win/Loss\n\n\
    ![](rsrc2AV.jpg)\n"
