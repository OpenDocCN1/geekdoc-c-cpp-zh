    本书书可以作为教程或快速参考指南。它适用于已经熟悉 Microsoft Excel® 基础知识，并准备好通过学习透视表（PivotTables）和仪表板（Dashboards）来扩展技能的用户。本书书假设你已经知道如何创建、打开、保存和修改
    Excel® 工作簿，并且对 Excel® 丝栏（功能区）有通了解。书中的所有示例均使用 Microsoft Excel® 2019，但大多数功能可以在 Microsoft
    Excel® 2016 版本中使用。书中的所有截图均使用 Microsoft Excel® 2019。虽然本书书提供了几个透视表示例，但书中并未涵盖所有可用的
    Microsoft Excel® 透视表功能、公式和操作。


    请务必备份你的工作并频繁保存。在尝试任何新功能时，良好的做法是创建原始表格的副本，并在复制的表格上进行更改。如果发生任何问题，你还有原始表格可以供参考。请参下图。


    图 1:![](img/rsrc6B.jpg)


    ## 练习文件

    练习文件可以通过以下网站下载：[`bentonbooks.wixsite.com/bentonbooks/excel-2019`](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)


    ## 第 2 章 透视表简介


    ### 什么是透视表？

    透视表是 Microsoft Excel® 中的一项功能，它可以提取单个单元格或数据项，并让你将其排列成许多类型的计算视图。这些汇总数据的快照只需极少精力即可创建，并且可以通过在报告中简单点击或拖动字段来更改。


    通过使用内置函数和筛选，透视表允许你快速组织和汇总大量数据。你可以进行过滤和钻取以对数字进行更详细的检查，并且无需在正在分析的表格中手动输入公式即可完成各种类型的分析。![](img/rsrc76.jpg)


    例如，下方的透视表基于一个包含 3,888 条个人记录的详细表格，记录了飞机零件信息。在不到 1 分钟的时间里，我生成了以下按区域划分零件数量报告：![](img/rsrc7B.jpg)


    这些透视表报告还可以进行格式化以提高可读性。然而，格式化需要额外的时间来完成。格式化后的示例：![](img/rsrc7J.jpg)


    在当今拥有海量信息的世界上，你可能被要求分析这些数据的很大一部分。可能由几千、数十万甚至数百万条记录组成。你可能需要协调来自许多不同来源和格式的数字，例如整合来自以下材料：


    *   由其他应用程序（如旧系统）生成的报告

    *   通过数据库或其他应用程序的查询导入 Excel® 的数据

    *   从网络或屏幕抓取活动复制、剪切并粘贴到 Excel® 中的数据

    *   分析来自多个对象的测试或研究结果

    *   由于公司合并或收购而整合信息


    执行各种复杂类型分析和报告的最简单方法之一是使用透视表。


    ### 透视表的主要部分部分什么？

    在我们开始第一个练习之前，让我们回顾一下透视表的三个主要组件：


    1.  **行（Rows）**：行部分通常代表你希望如何对数据进行分类或分组。示例包括：员工姓名、地区、部门、零件编号等。

    2.  **列（Columns）**：列显示你显示计算的级别或多个级别。通常是一个时间段（如月份、季度或年份），也可以是类别、产品线等。

    3. **值（Values）**：值是报告的计算部分，这些数字可以是和、百分比、计数、平均值、排名或自定义计算。![](img/rsrc8M.jpg)


    ## 第 3 章 创建你的第一个透视表


    对于第一个练习，我们将使用一个月份的警察犯罪数据。下面是一个示例，但由于空间限制，未显示完整的数据集。![](img/rsrc95.jpg)


    ### 准备工作表

    在创建透视表时，对要分析的每个工作表的做法是：


    *   数据集内部不包含空白行或空列

    *   没有合并的单元格

    *   每个列标题都有唯一的名称


    例如：![](img/rsrc9R.jpg)![](img/rsrc9V.jpg)


    为了创建一个基础透视表，我们将利用 Microsoft Excel 的 `Recommended PivotTables`（推荐透视表）功能。当你需要进行快速、高级分析，或被要求提供临时内容时，此工具非常有用。通常，这些报告不会经过格式化或分发给客户。为了说明此功能如何工作，我们将选取以下包含警察犯罪数据的表格并汇总：


    *   按地理位置划分的犯罪总数


    对于此练习，我们将使用包含 3,636 条个人犯罪记录的 `PoliceCrimeData.xlsx` 表格，按 `Area` 统计唯一 `ID` 字段的数量。`Rows`（分组）将是地理
    `AREA`，`Values`（计算）将是 `ID` 记录的 `COUNT`。在演示中，我们将没有列级别的详细信息。


    **练习网址与文件名**：[`bentonbooks.wixsite.com/bentonbooks/excel-2019`](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)
    `PoliceCrimeData.xlsx`


    ### 推荐透视表功能

    以下是使用 Microsoft Excel 的 `Recommended PivotTables` 功能创建基础透视表的步骤：


    1.  打开 `PoliceCrimeData.xlsx` 表格

    2.  选择列 `A:D`

    ![](img/rsrcAK.jpg)

    3.  从丝栏选择 `Insert`（插入）：`Recommended PivotTables`（推荐透视表）

    ![](img/rsrcAU.jpg)


    出现以下对话框：

    4.  选择 `Count of ID`（ID 计数）的 `AREA` 预览

    5.  点击 `OK`（确定）

    ![](img/rsrcB5.jpg)


    将创建一个按区域计算 `ID` 的报告。注意：这创建了一个新工作表 `Sheet1` 以及新工作表左侧的 `PivotTable Fields` 区域。![](img/rsrcBA.jpg)


    恭喜！你创建了第一个透视表！在短短几分钟内，你就能快速汇总按时间段划分的犯罪总数。


    ## 第 4 章基础透视表功能


    让我们在创建和修改透视表的基础上，通过包含多个总计、查看特定值的详细信息以及对结果进行格式化来扩展。


    ### 示例：练习中我们将选取包含水果销售信息的表格并：


    *   按地区和季度确定销售总额

    *   按地区和季度显示个人销售额


    **数据**


    ### 汇总数据


    1.  打开 `FruitSales.xlsx` 表格并选择单元格 `A1:I65`

    2.  从丝栏选择 `Insert`（插入）：`PivotTable`（透视表）

    ![](img/rsrcCM.jpg)


    出现以下对话框，请注意数据范围和新透视表将所在的位置：![](img/rsrcCV.jpg

    3.  点击 `OK`（确定）


    将创建一个新标签页并显示所示。注意：新工作表左侧有 `PivotTable Fields` 区域。![](rsrcD4.jpg)


    接下来，我们将对报告进行分类并选择计算值。


    4.  在 `PivotTable Fields` 区域中选择以下字段：


    *   `REGION`（行区域）

    *   `TOTAL`（∑ 值区域）

