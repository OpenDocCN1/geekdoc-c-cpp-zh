  raw: 'This book can be used as a tutorial or quick reference guide.  It is intended
    for users who are comfortable with the fundamentals of Microsoft Excel® and are
    now ready to build upon this skill by learning PivotTables and Dashboards.This
    book assumes you already know how to create, open, save, and modify an Excel®
    workbook and have a general familiarity with the Excel® toolbar (Ribbon).All of
    the examples in this book use Microsoft Excel® 2019, however most of the functionality
    can be applied using Microsoft Excel® version 2016.  All screenshots in this book
    use  Microsoft Excel® 2019.While this book provides several PivotTable examples,
    the book does not cover ALL available Microsoft Excel® PivotTable features, formulas,
    and functionality.Please always back-up your work and save often.  A good best
    practice when attempting any new functionality is to create a copy of the original
    spreadsheet and implement your changes on the copied spreadsheet.  Should anything
    go wrong, you then have the original spreadsheet to refer back to.  Please see
    the diagram below.Diagram 1:![](rsrc6B.jpg)Files For ExercisesThe exercise files
    are available for download at the following website:[https://bentonbooks.wixsite.com/bentonbooks/excel-2019](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)CHAPTER
    2Introduction To PivotTablesWhat Are PivotTables?PivotTables are a feature within
    Microsoft Excel® that takes individual cells or pieces of data and lets you arrange
    them into numerous types of calculated views.  These snapshots of summarized data,
    require minimal effort to create and can be changed by simply clicking or dragging
    fields within your report.By using built-in functions and filters, PivotTables
    allow you to quickly organize and summarize large amounts of data.  You can filter
    and drill-down for more detailed examination of your numbers and various types
    of analysis can be completed without the need to manually enter formulas into
    the spreadsheet you’re analyzing.![](rsrc76.jpg)For example, the below PivotTable
    is based on a detailed spreadsheet of 3,888 individual records containing information
    about airplane parts.  In less than 1 minute, I was able to produce the following
    report for the quantity of parts sold by region:![](rsrc7B.jpg)These PivotTable
    reports can also be formatted to improve readability.  However, formatting does
    require a little more time to complete.Formatted example:![](rsrc7J.jpg)In today’s
    world with the massive amounts of information available, you may be tasked with
    analyzing significant portions of this data. Perhaps consisting of several thousand,
    hundreds of thousands, or even millions of records.  You may have to reconcile
    numbers from many different sources and formats, such as assimilating material
    from:


    *   Reports generated by another application, such as a legacy system


    *   Data imported into Excel® via a query from a database or other application


    *   Data copied or cut, and pasted into Excel® from the web or other types of
    screen scraping activities


    *   Analyzing test or research results from multiple subjects


    *   Integrating information due to company mergers or acquisitions


    One of the easiest ways to perform various and complex types of analysis and reporting
    is to use PivotTables.What Are The Main Parts Of A PivotTable?Before we begin
    our first exercise, let’s review the three main components of a PivotTable:


    1.  Rows:  The rows section typically represents how you would like to categorize
    or group your data.  Some examples include: employee name, region, department,
    part number etc.


    2.  Columns:  The columns show the level or levels in which you’re displaying
    your calculations.  Often a time period such as a month, quarter, or year, but
    can also be categories, product lines, etc.


    3.  Values:  Values are the calculation portion of the report, these figures can
    be sums, percentages, counts, averages, rankings or custom computations.


    ![](rsrc8M.jpg)CHAPTER 3Creating your first PivotTable


    * * *


    For our first exercise we’ll be using a month’s worth of police crime data.  Below
    is a sample, however due to space limitations the entire data set is not displayed.![](rsrc95.jpg)Preparing
    the worksheetWhen creating PivotTables, the best practice for each worksheet to
    be analyzed is:


    *   Contain no blank rows or columns inside your dataset


    *   Have no merged cells


    *   Each column heading has a unique name


    For example:![](rsrc9R.jpg)![](rsrc9V.jpg)To create a basic PivotTable, we’ll
    utilize Microsoft Excel’s® ‘Recommended PivotTables’ feature.  This tool is useful
    when you need to perform quick, high-level analysis, or are being asked for something
    ad hoc.  Typically, these reports are not formatted or distributed to a customer. 
    To illustrate how this functionality works, we’ll take the following spreadsheet
    containing police crime data and summarize:


