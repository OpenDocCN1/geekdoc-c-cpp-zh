  trans: "\n\n# 练习使用的网页地址与文件名：[https://bentonbooks.wixsite.com/bentonbooks/excel-2019]\n\
    `Autoparts_Sales_Refresh_Data.xlsx`\n\n## 隐藏您的透视表源数据\n\n1. 打开 `Autoparts_Sales_Refresh_Data.xlsx`\
    \ 工作表。\n2. 若要隐藏“数据 (Data)”工作表，在标签页上点击右键，并在弹出菜单中选择“隐藏 (Hide)”。\n\n![](img/rsrc3AC.jpg)\n\
    3. 从功能带中选择 `Review : Protect Workbook`。\n\n![](img/rsrc3AJ.jpg)\n将出现以下对话框：\n![](img/rsrc3AP.jpg)\n\
    \n4. 可选，输入密码 `Password` 或留空。\n5. 点击“确定”按钮。\n\n- 若要移除“保护工作簿”锁定，请重复第 3 步。\n- 然后，若要显示工作表标签页，右键点击任何标签页并选择“取消隐藏\
    \ (Unhide...)”（一旦标签页被隐藏，“取消隐藏...”选项将变为可用）。\n\n#### 保护仪表板或其他工作表\n\n保护工作簿可以防止用户访问隐藏的标签页，但不能防止他们对其余可见的工作表进行更改，或刷新、更改数据源。因此，我们必须完成额外的步骤：\n\
    \n1. 选择“仪表板 (Dashboard)”工作表。\n2. 从功能带中选择 `Review : Protect Sheet`。\n\n![](img/rsrc3B9.jpg)\n\
    将出现以下对话框：\n![](img/rsrc3BD.jpg)\n\n3. 您可以输入密码或留空。\n4. 良好的做法是保持前两个复选框勾选：\n    -\
    \ 选择锁定单元格\n    - 选择未锁定的单元格\n这将允许您的客户点击单元格并进行滚动操作，但无法更改任何内容。\n5. 点击“确定”按钮。\n\n\
    如果用户尝试修改工作表，他们将收到以下消息之一：\n![](img/rsrc3C1.jpg)\n![](img/rsrc3C5.jpg)\n\n- 若要取消保护，从功能带中选择\
    \ `Review : Unprotect Sheet`。\n\n![](img/rsrc3CB.jpg)\n\n## 感谢！您的意见如何？\n\n感谢您购买并阅读本书，我们希望它对您有所帮助！您的反馈对我们非常宝贵！请花几分钟留个评价。\n\
    \n## 作者提供的更多书籍\n\n如需完整列表，请访问：[https://bentonbooks.wixsite.com/bentonbooks/buy-books]\n\
    \n- Excel® 2019 VLOOKUP 逐步阶指南\n- Excel® 2016 30 个常用公式与功能 - 逐步阶指南\n- Excel® 2016\
    \ 30 分钟掌握 VLOOKUP 公式 逐步阶指南\n- Microsoft Excel® (版本 2013) 中 VLOOKUP 公式逐步阶指南\n-\
    \ 面向业务用户的 Excel® 宏与 VBA - 初学者指南\n\n## 问题 / 反馈\n\n电子邮件：[bentontrainingbooks@gmail.com]\n\
    网站：[https://bentonbooks.wixsite.com/bentonbooks]\n\n## 参考文献\n\n- [1] Excel for\
    \ Office 365, Excel 2019, Excel 2016, Excel 2013, Excel 2010, 于 2019 年 11 月 18\
    \ 日检索自 Microsoft® [https://support.office.com/en-us/article/introduction-to-microsoft-power-query-for-excel-6e92e2f4-2079-4e1f-bad5-89f6269cd605]\n\
    - [2] Power Query for Excel® 载项，于 2019 年 11 月 18 日检索自 Microsoft® [https://www.microsoft.com/en-us/download/details.aspx?id=39379&CorrelationId=cf9e02f4-a5ed-47fe-b9b9-0bdad0fef6b4]\n\
    - [3] Excel 中的计算字段返回了错误的总计，于 2019 年 11 月 18 日检索自 Microsoft® [https://support.microsoft.com/en-us/help/211470/calculated-field-returns-incorrect-grand-total-in-excel]\n\
    \n"
