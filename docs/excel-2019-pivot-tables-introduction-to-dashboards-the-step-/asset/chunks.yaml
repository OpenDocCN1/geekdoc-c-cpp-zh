    3. 将光标置于单元格 `P8` 中，右键点击并选择`数据透视表选项…`，在透视表名称中输入 `Trend`。

    4. 点击`确定`按钮。

    5. 在`数据透视表字段`窗格中，取消勾选`REGION`框。

    6. 在`数据透视表字段`窗格中，勾选`EOM_DATE`框。注意：这添加了一个名为`Months`的额外字段。


    ![](img/rsrc313.jpg)


    7. 在`数据透视表字段`窗格中，一旦添加了`Months`字段，取消勾选`EOM_DATE`。

    8. 在`数据透视表字段`窗格中，将`SALES`字段拖到`∑ 值`区域。


    ![](img/rsrc31C.jpg)

    9. 点击`销售额和`旁的下拉箭头并选择`值字段设置…`。


    ![](img/rsrc31K.jpg)


    10. 从`值字段设置`提示框中：

    * 选择`显示值方式`选项卡

    * 在`显示值方式`下拉列表中选择`从基值的百分比`

    * 选择基础字段：`Months` & 基础项目：`(上一个)`

    * 将`数字格式`更改为保留一位小数的百分比

    * 在`自定义名称:`中输入`+/- LAST MN`

    * 点击`确定`按钮。


    ![](img/rsrc329.jpg)


    11. 选择单元格 `P8`，并将文本从`REGIONS`更改为`MONTH`。

    12. 从数据透视表工具功能区中选择`设计`选项卡。

    13. 点击`分类总计`下拉框并选择`关闭行和列总计`。


    ![](img/rsrc32M.jpg)


    ## 为仪表板添加迷你趋势图


    1. 将光标置于单元格 `P6` 中，从功能区中选择`插入`。

    2. 从`迷你趋势图`子菜单中选择`胜/负`。


    ![](img/rsrc32Z.jpg)

    3. 在`数据区域:`的对话框中，选择单元格 `R10:R22`（我们正准备最终接收 12 个月的数据）。

    4. 点击`确定`按钮。


    ![](img/rsrc338.jpg)

    5. 选择单元格 `P6:R6`，然后从功能区中选择`首页：合并并居中`。


    ![](img/rsrc33E.jpg)![](img/rsrc33H.jpg)


    ## 为仪表板添加图表


    1. 选择单元格 `G9:H13`，从功能区中选择`数据透视表工具：分析`，然后点击`数据透视图`图标。

    2. 选择`饼`选项。

    3. 点击`确定`按钮。

    4. 将图表移动到`REGIONS`数据透视表的下方（单元格 `A17`）。

    5. 扩展长度和宽度以便于查看。

    6. 隐藏字段按钮，在任何字段按钮上右键点击并选择`隐藏图表上的所有字段按钮`。

    7. 点击饼图，从数据透视图工具功能区中选择`设计`选项卡。

    8. 点击`快速布局`下拉列表并选择`布局 1`。


    ![](img/rsrc344.jpg)

    9. 更改颜色方案，选择第五种蓝色单色选项。


    ![](img/rsrc349.jpg)

    10. 将图表标题从`Total`更改为`各类别销售额百分比`。


    ![](img/rsrc34G.jpg)


    ## 为仪表板添加时间轴


    仪表板的最后一部分是包含一个时间轴，允许用户轻松地查看不同的时间段。


    1. 选择单元格 `P8`，从功能区中选择`数据透视表工具：分析`，然后点击`插入时间轴`。


    ![](img/rsrc34S.jpg)

    2. 出现提示，勾选`EOM_DATE`框。

    3. 点击`确定`按钮。


    ![](img/rsrc350.jpg)

    4. 将时间轴拖动到单元格 `G17`附近的区域。


    ### 报告连接


    5. 右键点击新添加的时间轴，从弹出菜单中选择`报告连接…`。


    ![](img/rsrc35A.jpg)

    6. 提示时，勾选所有复选框。

    7. 点击`确定`按钮。


    ![](img/rsrc35H.jpg)

    8. 从时间轴工具功能区的`选项`下转到`标题`并输入`Time Frame`的新名称（有关如何更改标题的详细说明，请参见第 9 章）。


    ![](img/rsrc35R.jpg)


    在下一章中，我们将回顾如何刷新数据透视表和仪表板数据。


    # 第 15 章 刷新数据透视表和仪表板数据


    ***


    一旦你按照首选布局和格式创建了数据透视表和/或仪表板，就可以接收新数据了。可以使用`刷新`功能通过追加或覆盖现有数据向现有透视表中添加新信息。刷新数据允许你保留当前的格式和计算。只需记住在初始设计中为追加记录时可能创建的额外行留留空间。


    ***


    练习网址和文件名：[`bentonbooks.wixsite.com/bentonbooks/excel-2019`](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)
    `Autoparts_Sales_Refresh_Data.xlsx`


    ## 追加现有的（内部）数据源


    在我们的第一个示例中，我们将通过使用`刷新`功能通过追加或覆盖现有数据向现有透视表中添加新信息。刷新数据允许你保留当前的格式和计算。只需记住在初始设计中为追加记录时可能创建的额外行留出空间。


    1. 打开 `Autoparts_Sales_Refresh_Data.xlsx`工作表。

    2. 选择`数据`选项卡。

    3. 复制单元格 `I:O`。

    4. 选择`仪表板`。


    ![](img/rsrc36.jpg)

    5. 按下 `Ctrl+V`。


    ![](img/rsrc36.jpg)

    6. 回到`数据`选项卡。

    7. 从数据透视表工具功能区选择`分析`选项卡。

    8. 点击`刷新`下拉箭头并选择`全部刷新`。


    ![](img/rsrc37.jpg)

    注意：更新的信息：![](img/rsrc37.jpg)


    ### 刷新与全部刷新


    `刷新`与`全部刷新`的区别在于，`刷新`仅更新活动的数据透视表，而`全部刷新`更新仪表板中的所有数据透视表。


    ### 覆盖现有数据（手动）


    在第 13 章中，我们通过追加记录来显示数据。覆盖数据的过程与追加类似，不同之处在于添加新数据之前需要删除现有数据。


    ![](img/rsrc37.jpg)


    | 注意 |

    | 在覆盖记录时，请确保在添加新数据之前完全删除旧数据。 |


    删除旧信息并添加新信息的过程可以手动完成，也可以使用 VBA（视觉 Basic 应用程序）自动完成。我们可以按照以下步骤操作：

    * 选择数据透视表中的单元格

    * 然后从数据透视表工具功能区选择`分析`选项卡

    * 点击`刷新`下拉箭头并选择`全部刷新`。


