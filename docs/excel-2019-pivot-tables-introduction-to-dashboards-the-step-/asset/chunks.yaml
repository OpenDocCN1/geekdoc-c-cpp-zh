    ![](img/rsrc19R.jpg)现在应该显示类似下面的堆叠柱状图：![](img/rsrc19V.jpg)


    # 折线图示例


    分析的下部分涉及理解犯罪趋势。报告的犯罪是在增加、减少还是保持不变？


    1. 打开 `Pivot_Charts.xlsx` 表格并选择 `Line Chart`（折线图）工作表。


    ![](img/rsrc1A4.jpg)分组数据透视表数据


    你已经确定按周报告的犯罪是最佳衡量标准。因此，在创建数据透视表之前，你需要执行几个额外的步骤来准备数据。


    2. 选择单元格 `A2`，右键点击然后选择 `Group…`（分组）选项。


    ![](img/rsrc1AD.jpg)


    3. 完成以下分组：


    *   取消勾选 `Starting at:`（起始于）和 `Ending at:`（结束于）框。

    *   将日期值更改为从周日（2/3/2019）开始，并在周六（3/30/2019）结束。在现实世界中，这需要查看日历。

    *   在 `By` 框中仅选择 `Days`（天）。

    *   将 `Number of days:`（天数）数量改为 `7`。

    *   点击 `OK` 按钮。


    ![](img/rsrc1AX.jpg)现在应该显示以下按周的犯罪数量：![](img/rsrc1B2.jpg)


    4. 从功能区选择 `PivotTable Tools : Analyze`（数据透视表工具：分析），然后点击 `PivotChart`（数据透视图）图标。

    5. 选择 `Line`（折线），然后选择 `Line with Markers`（带有标记的折线）。

    6. 点击 `OK` 按钮。


    ![](img/rsrc1BC.jpg)


    7. 将图移动到数据透视表报告摘要下方，并扩展长度和宽度以便查看。


    让我们通过隐藏部分周的数据提高可读性。


    8. 点击 `DATE`（单元格 `A1`）的下拉箭头并取消勾选：


    *   `<2/3/2019`

    *   `>3/30/2019`


    ![](img/rsrc1BW.jpg)


    9. 点击 `OK` 按钮。

    10. 选中图表，从功能区选择 `PivotChart Tools : Design`（数据透视图工具：设计）。


    11. 在 `Chart Styles`（图样式）下选择第二个选项。


    ![](img/rsrc1C5.jpg)


    12. 将标题更改为 `Crimes Reported By Week 02/03/2019 - 03/30/2019`（2019/02/03 - 03/30
    期间按周报告的犯罪数量）。


    现在应该显示一个类似下面的图表。![](img/rsrc1CC.jpg)此图表显示 2 月份最后两周犯罪率出现激增。现在可以进一步调查其原因。


    # 柱状图示例


    根据之前的分析，我们知道车辆盗窃（Car Prowls）是最常报告的犯罪。让我们看看这种犯罪是否是 2 月份最后两周总体犯罪激增的最大因素。


    1. 打开 `Pivot_Charts.xlsx` 表格并选择 `Column Chart`（柱状图）工作表。


    ### 图表化时的正、负值


    我们只想分析按周划分的车辆盗窃数据。我们将测量与上周相比的百分比差异。在创建数据透视图之前，我们先创建此指标。


    2. 选择单元格 `B4`，右键点击并选择：


    *   `Show Value As`（显示值方式）

    *   `% Difference From…`（与…的百分比差异）


    ![](img/rsrc1D0.jpg)


    3. 提示时，点击 `Base Item:`（基准项目）的下拉箭头并选择 `(previous)`（上一个）。


    ![](img/rsrc1D6.jpg)


    4. 点击 `OK` 按钮。

    5. 从功能区选择 `PivotTable Tools : Analyze`（数据透视表工具：分析），然后点击 `PivotChart`（数据透视图）图标。

    6. 选择 `Column`（柱形），然后选择选项 `Clustered Column`（簇柱形）。

    7. 点击 `OK` 按钮。


    ![](img/rsrc1DJ.jpg)


    8. 将图移动到数据透视表报告摘要下方并扩展长度和宽度以便查看。

    9. 隐藏字段按钮，右键点击任何字段按钮并选择 `Hide All Field Buttons on Chart`（在图上隐藏所有字段按钮）。

    10. 选中图表，从功能区选择 `PivotChart Tools : Design`（数据透视图工具：设计）。

    11. 从 `Quick Layout`（快速布局）下拉框中选择第五个选项。


    ![](img/rsrc1DZ.jpg)


    12. 在 `Chart Styles`（图样式）下，选择深色背景选项。


    ![](img/rsrc1E7.jpg)


    13. 选中图表，点击 `+` 符号并取消勾选 `Axis Titles`（轴标题）。


    ![](img/rsrc1EE.jpg)


    14. 将标题更改为 `% Increase or Decrease of Car Prowls By Week 02/10/2019 - 03/30/2019`（2019/02/10
    - 03/30 期间按周车辆盗窃的百分比增长）。


    现在应该显示一个类似下面的图表：![](img/rsrc1EN.jpg)从这个柱图可以看出，数据显示车辆盗窃与 `2019/02/17 – 02/23` 这一周总体犯罪的激增之间存在某种相关性。然而，需要进一步调查以理解
    2 月份最后一周犯罪激增的贡献因素。


    # 第 9 章：数据透视表结果的排名与排序


    * * *


    在之前的章节中，我们关注的是汇总层面的分析。数据透视表还赋予了我们对单个结果进行比较的能力，例如对结果进行排名和排序。这可以在不需要手动排序或向原始数据源添加额外计算列的情况下完成。


    * * *


    ### 示例：在本章中，我们将演示如何：


    *   根据个人销售额的总销售额和平均销售额对每位销售人员进行排名


    * * *


    **练习的网页地址和文件名：** [`bentonbooks.wixsite.com/bentonbooks/excel-2019`](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)
    `FruitSales.xlsx`


    * * *


    本章的示例数据由于空间限制，未显示完整的数据集。![](img/rsrcCA.jpg)创建一个新的数据透视表报告，要查看步骤 #1 - #3 的截图说明，请参见第
    4 章 基础数据透视表功能：




    1. 打开 `FruitSales.xlsx` 表格并选择单元格 `A1:I65`。

    2. 从功能区选择 `Insert : PivotTable`（插入：数据透视表）。

    3. 点击 `OK` 按钮。


    将创建一个新标签页，屏幕左侧会出现 `PivotTable Fields` 格。


    4. 在 `PivotTable Fields` 格中拖动以下字段：


    *   `SALES PERSON ID`（销售人员 ID）（行区域）

    *   `TOTAL`（总额）三次（∑ 值）


    目前报告显示如下。注意：将在后续步骤中处理这些。


    5. 修改以下标签：


    *   `A3` 为 `SALES PERSON ID`

    *   `B3` 为 `TOTAL`

    *   `C3` 为 `AVERAGE`

    *   `D3` 为 `RANK`


    6. 将 `B` 和 `C` 的格式更改为零小数位的货币。在本例中我将使用英镑。![](img/src1GJ.jpg)


    7. 在 `PivotTable Fields` 格中，在 `∑ Values` 区域点击 `AVERAGE SALES` 的下拉箭头。

    8. 从子菜单选择 `Value Field Settings…`（值字段设置）。


    ![](img/r1GT.jpg)


    9. 在值字段设置框中：


    *   选择 `Show Values As`（显示值方式）选项卡。

    *   在 `Show values as` 列表中选择 `Rank Largest to Smallest`（从大到排名）。

    *   在 `Base field:`（基准字段）框中选择 `SAL PERSON ID`。

    *   点击 `OK` 按钮。


    ![](img/r1HT.jpg)


    10. 选中单元格 `A3`，从数据透视表工具功能区选择 `Design`（设计）选项卡。

    11. 勾选 `Banded Rows`（条纹行）。


    ![](img/1J7.jpg)


    12. 将光标置于单元格 `A3` 中并点击下拉箭头。

    13. 选择 `More Sort Options…`（更多排序选项……）。


    ![](img/r1JE.jpg)此对话框将出现：


    14. 选择 `Descending (Z to A) by:`（降序（Z 到 A））单选按钮。

    15. 从下拉框中选择 `RANK`。

    16. 点击 `OK` 按钮。


    ![](img/r1JR.jpg)我们现在拥有了一个格式良好的报告，显示了每位销售人员的销售排名以及他们的总销售额和平均销售额。![](img/r1JW.jpg)


