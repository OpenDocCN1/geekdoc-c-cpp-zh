    ![](rsrc19R.jpg)A stacked bar chart similar to the following should now be displayed:![](rsrc19V.jpg)


    # Line Chart Example


    The next part of your analysis involves understanding crime trends. Are reported
    crimes increasing, decreasing, or staying the same?


    1. Open the `Pivot_Charts.xlsx` spreadsheet and select the `Line Chart` worksheet.


    ![](rsrc1A4.jpg)Grouping Pivot Chart Date Data


    You’ve determined crimes reported by week is the best measure. Therefore, you
    need to take a few additional steps to prepare the data before you can create
    the Pivot Chart.


    2. Select cell `A2`, right click and then choose the `Group…` option.


    ![](rsrc1AD.jpg)


    3. Complete the following grouping:


    *   Uncheck the `Starting at:` and `Ending at:` boxes.

    *   Change the date values to start on a Sunday (`2/3/2019`) and end on a Saturday
    (`3/30/2019`). In a real world situation, this would require looking at a calendar.

    *   For the `By` box select only `Days`.

    *   Change the `Number of days:` quantity to `7`.

    *   Click the `OK` button.


    ![](rsrc1AX.jpg)The following count of crimes by week, should now be displayed:![](rsrc1B2.jpg)


    4. From the Ribbon select `PivotTable Tools : Analyze` and then the `PivotChart`
    icon.

    5. Select `Line`, then the `Line with Markers` option.

    6. Click the `OK` button.


    ![](rsrc1BC.jpg)


    7. Move the chart below the PivotTable report summary and Expand the length &
    width to allow for easier viewing.


    Let’s improve the readability by hiding the partial weeks of data.


    8. Click the drop-down arrow for `DATE` (cell `A1`) and uncheck:


    *   `<2/3/2019`

    *   `>3/30/2019`


    ![](rsrc1BW.jpg)


    9. Click the `OK` button.

    10. With the chart active, from the Ribbon select `PivotChart Tools : Design`.


    11. Under `Chart Styles` select the second option.


    ![](rsrc1C5.jpg)


    12. Change the title to `Crimes Reported By Week 02/03/2019 - 03/30/2019`.


    A chart similar to below should now be displayed.![](rsrc1CC.jpg)This chart shows
    a spike in crime in the last two weeks in February. Further investigation into
    the reasons why may now be explored.


    # Column Chart Example


    Based on previous analysis, we know Car Prowls are the most frequently reported
    crime. Let’s see if this offense is the largest contributing factor to the spike
    in overall crime for the last two weeks in February.


    1. Open the `Pivot_Charts.xlsx` spreadsheet and select the `Column Chart` worksheet.


    ### Positive & Negative Values When Charting


    We want to analyze the data for only Car Prowls by week. We’ll be measuring the
    difference as a percent from the previous week. Before creating the Pivot Chart,
    we’ll first create this metric.


    2. Select cell `B4`, right-click, and select:


    *   `Show Value As`

    *   `% Difference From…`


    ![](rsrc1D0.jpg)


    3. When prompted, click the drop-down arrow for `Base Item:` and select `(previous)`.


    ![](rsrc1D6.jpg)


    4. Click the `OK` button.

    5. From the Ribbon select `PivotTable Tools : Analyze` and then the `PivotChart`
    icon.

    6. Select `Column`, then the option `Clustered Column`.

    7. Click the `OK` button.


    ![](rsrc1DJ.jpg)


    8. Move the chart below the PivotTable report summary and Expand the length &
    width to allow for easier viewing.

    9. Hide the Field buttons, right-click over any Field button and select `Hide
    All Field Buttons on Chart`.

    10. With the chart active, from the Ribbon select `PivotChart Tools : Design`.

    11. From the `Quick Layout` drop-down box select the fifth option.


    ![](rsrc1DZ.jpg)


    12. Under `Chart Styles`, select a dark background option.


    ![](rsrc1E7.jpg)


    13. With the chart active Click the `+` (plus) symbol and uncheck `Axis Titles`.


    ![](rsrc1EE.jpg)


    14. Change the title to `% Increase or Decrease of Car Prowls By Week 02/10/2019
    - 03/30/2019`.


    A chart similar to below should now be displayed:![](rsrc1EN.jpg)As we can see
    from this bar chart, the data shows some correlation between Car Prowls and the
    spike in overall crime for the week of `02/17/2019 – 02/23/2019`. However, further
    investigation is needed to understand the contributing factors to the spike in
    crime the last week in February.


    # CHAPTER 9: Ranking & Sorting PivotTable Results


    * * *


    In the previous chapters, we focused on summary level analysis. PivotTables also
    give us the capability to analyze individual results for comparisons, such as
    ranking and sorting our results. This may be accomplished without the need to
    manually sort or add additional calculated columns to our original data source.


    * * *


    ### EXAMPLE: In this chapter we’ll demonstrate how to:


    *   Rank each Sales Person by their individual Total & Average Sales


    * * *


    **WEB ADDRESS & FILE NAME FOR EXERCISE:** [https://bentonbooks.wixsite.com/bentonbooks/excel-2019](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)
    `FruitSales.xlsx`


    * * *


    Sample data for this chapter, due to space limitations the entire data set is
    not displayed.![](rsrcCA.jpg)Create a new PivotTable report, to see screenshot
    illustrations of steps #1 - #3, please see [chapter 4 Basic PivotTable Functionality](#part0008.xhtml_toc12_Summarizing_Data):




    1. Open the `FruitSales.xlsx` spreadsheet and select cells `A1:I65`.

    2. From the Ribbon select `Insert : PivotTable`.

    3. Click the `OK` button.


    A new tab will be created and the `PivotTable Fields` pane should appear on the
    left side of your screen.


    4. In the `PivotTable Fields` pane drag the following fields:


    *   `SALES PERSON ID` (Rows section)

    *   `TOTAL` three times (`∑` Values)


    A report similar to the following should be.Note: all three `Sum of TOTAL` columns
    are currently the same. We will be addressing this in the ensuing steps.![](src1G4.jpg)


    5. Change the label text for the following:


    *   `A3` to `SALES PERSON ID`

    *   `B3` to `TOTAL`

    *   `C3` to `AVERAGE`

    *   `D3` to `RANK`


    6. Change the formatting for `B` & `C` to a currency of choice with zero decimal
    places. In this example I will use British Pound.![](rsrc1GJ.jpg)


    7. In the `PivotTable Fields` pane, in the `∑ Values` section, click the drop-down
    arrow for `AVERAGE SALES`.

    8. From the sub-menu select `Value Field Settings…`.


    ![](rsrc1GT.jpg)The following dialogue box should appear


    9. From the Summarize By list select `Average`. Note: this will change the `Custom
    Name:` to `Average of TOTAL`, change back to `AVERAGE SALES`.

    10. Click the `OK` button.


    ![](rsrc1H2.jpg)


    11. In the `PivotTable Fields` pane, in the `∑ Values` section, click the drop-down
    arrow for `RANK`.

    12. From the sub-menu select `Value Field Settings…`.


    ![](rsrc1H9.jpg)


    13. From the Value Field Settings box:


    *   Select the `Show Values As` tab.

    *   From the `Show values as` list select `Rank Largest to Smallest`.

    *   For the `Base field:` box select `SAL PERSON ID`.

    *   Click the `OK` button.


    ![](rsrc1HT.jpg)


    14. Select cell `A3` and from the PivotTable Tools Ribbon select the `Design`
    tab.

    15. Check the box `Banded Rows`.


    ![](src1J7.jpg)


    16. Place your cursor in cell `A3` and click the drop-down arrow.

    17. Select the option called `More Sort Options…`.


    ![](rsrc1JE.jpg)The following dialogue box will appear:


    18. Select the `Descending (Z to A) by:` radio button.

    19. Select `RANK` from the drop-down box.

    20. Click the `OK` button.


    ![](rsrc1JR.jpg)We now have a nicely formatted report that shows us each Sales
    Person’s sales rank and their Total and Average Sales.![](rsrc1JW.jpg)

