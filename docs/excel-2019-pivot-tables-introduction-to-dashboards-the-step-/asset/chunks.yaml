    # CHAPTER 7 Slicers, Timelines, & Filtering


    Excel® offers a number of filtering options, in this chapter we’ll examine some
    of the most commonly used. The first two are graphical and provide an easy and
    intuitive way for your reporting to be interactive, these are:


    *   Timeline: is a slider or button filter allowing users to quickly categorize
    individual date values into months, quarters, or years.

    *   Slicers are button filters and allow the user to filter by selecting one or
    more text values.


    These Timelines and Slicers may be used in combination with one another and are
    ideal for analysts or customers who like to examine data from many different perspectives.
    This chapter concludes by reviewing a few of the built-in conditional filters,
    these include how to quickly identify top & bottom performers, and return only
    records that meet a specific numeric threshold, or text.


    ### EXAMPLE

    You’re a Financial Analyst that supports a manufacturing company of aerospace
    parts. You’ve been asked to attend an impromptu sales meeting for Regional Managers.
    The agenda has not been determined, instead you’ve been asked to prepare the sales
    data for the last 12 months and answer questions as they arise. Since you’re unsure
    of what the managers will ask, you decide to create a PivotTable report with a
    Timeline and a category Slicer.


    ### WEB ADDRESS & FILE NAME FOR EXERCISE

    [https://bentonbooks.wixsite.com/bentonbooks/excel-2019](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)

    `AirplaneParts.xlsx`


    Sample data for this chapter, due to space limitations the entire data set is
    not displayed. Note: Column `E` is a date value.![](rsrcVG.jpg)


    ### Timeline

    Create a new PivotTable report, to see screenshot illustrations of steps #1 -
    #3, please see [chapter 4 Basic PivotTable Functionality](#part0008.xhtml_toc12_Summarizing_Data):


    1. Open the `AirplaneParts.xlsx` spreadsheet and select cells `A1:F3889`

    2. From the Ribbon select `Insert : PivotTable`

    3. Click the ‘OK’ button


    A new tab will be created and the `PivotTable Fields` pane should appear on the
    left side of your screen.


    4. In the `PivotTable Fields` pane select the following fields:

    *   `REGION` (Rows section)

    *   `CATEGORY` (Rows section)

    *   `QTY` (`∑ Values` section)


    | IMPORTANT! |

    | :--- |

    | In order for a Timeline to be used all the data in the date column must be formatted
    as a date. |


    In this example, once we click the field `EOM_DATE` Excel® will create the additional
    calendar options Quarters & Years.![](rsrcWJ.jpg)


    5. Click the field `EOM_DATE`


    ![](rsrcWS.jpg)

    As you can see, Excel® has now created fields for Quarters & Years, however this
