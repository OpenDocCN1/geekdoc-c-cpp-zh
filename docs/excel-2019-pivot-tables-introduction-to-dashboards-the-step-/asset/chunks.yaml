  trans: "\n\n![](img/rsrc10E.jpg)现在应该显示单个日期:-\n![](img/rsrc10K.jpg)\n\n## 条件筛选\n\n\
    在本章的第一部分，我们回顾了如何使用 `Timelines`（时间轴）和 `Slicers`（切片）进行交互式筛选。在本节，我们将演示如何使用内置的 `PivotTable`（透视表）筛选来实现特定条件。如果你熟悉\
    \ Excel 的条件格式功能，这将会非常相似。\n\n***\n\n### 示例：\n\n在飞机零件表格中，如果我们想知道：\n\n* 按分类销名前前 10\
    \ 的飞机零件？\n* 按分类销量最少的 10 个飞机零件？\n* 按`季度`销名前前 10 的飞机零件？\n* 销售数量超过 800 的零件有多少个？\n\
    \n#### 值筛选（最高与最低表现者）\n\n1. 打开 `AirplaneParts.xlsx` 表格并选择单元格‘A1:F3889’。\n2. 从功能带（Ribbon）选择\
    \ `Insert`（插入）：`PivotTable`（透视表）。\n3. 点击‘OK’（确定）按钮。\n\n将创建一个新标签页，“透视表字段”窗格将出现在屏幕左侧。\n\
    \n4. 在‘透视表字段’窗格中选择以下字段：\n    * `CATEGORY`（分类）（列区域）\n    * `PART`（零件）（行区域）\n  \
    \  * `QTY`（数量）（∑ 值区域）\n5. 选择单元格‘A4’并点击‘Row Labels’（行标签）的下拉箭头。\n6. 从菜单选择 `Value\
    \ Filters`（值筛选）然后 `Top 10…`（前 10 个…）。\n\n![](img/rsrc11W.jpg)\n\n7. 将出现以下提示，点击‘OK’按钮。\n\
    \n![](img/rsrc124.jpg)结果将如下所示，你可以将数量从 10 更改为你看到的任何数字.- ![](img/rsrc129.jpg)同样，我们可以更改显示最后\
    \ 10 个。\n\n8. 选择单元格‘A4’并点击‘Row Labels’（行标签）的下拉箭头。\n9. 从菜单选择 `Value Filters`（值筛选）然后\
    \ `Top 10…`（前 10 个…）。\n10. 将出现以下提示，点击写有‘Top’（前）的箭头并更改为‘Bottom’（后）。\n11. 点击‘OK’按钮。\n\
    \n![](img/rsrc12K.jpg)结果将如下所示，你可以将数量从 10 更改为你看到的任何数字.- ![](img/rsrc12S.jpg)你可以添加\
    \ Timeline 来快速查看按时间范围划分的前或后 10 个。\n\n***\n\n让我们来看另一个例子，这次我们将指定具体的数量。\n\n1. 选择单元格‘A4’并点击‘Row\
    \ Labels’（行标签）的下拉箭头。\n2. 从菜单选择 `Value Filters`（值筛选）然后 `Greater Than Or Equal To…`（大于等于…）。\n\
    \n![](img/rsrc131.jpg)\n\n3. 将出现以下提示，在‘is greater than or equal to’（大于等于）下拉框后的字段中输入数字\
    \ `800`。\n4. 点击‘OK’按钮。\n\n![](img/rsrc138.jpg)结果将如下所示:- ![](img/rsrc13E.jpg)\n\
    \n#### 删除筛选\n\n要删除筛选：\n\n1. 选择单元格‘A4’并点击‘Row Labels’（行标签）的下拉箭头。\n2. 从菜单选择 `Value\
    \ Filters`（值筛选）然后 `Clear`（清除）。\n\n## 第 8 章 透视图\n\n***\n\n透视表提供了一种以形式汇总大量数据的极佳方法。在本章中，我们将探索四种常见类型：`Bar`（条形图）、`Column`（柱形图）、`Pie`（饼图）和\
    \ `Line`（折线图）。\n\n* `Bar` 图最适合比较数字。\n* `Column` 图垂直显示数据以进行比较。\n* `Pie` 图非常适合展示作为整体的百分比情况。\n\
    * `Line` 图用于演示随时间变化的情况。\n\n无论使用哪种类型，注意颜色都非常重要。如果颜色太多，图表将变得模糊且难以阅读。\n\n***\n\n\
    ### 示例\n\n以下内容重点介绍于如何使用透视图。\n\n***\n\n[NAME](https://bentonsite.com/2019) -[bentonsite.com/2019](https://bentonsite.com/2019)\n\
    \n***\n\n#### 饼图示例\n\n现在我们已经知道了犯罪发生的地点，让我们看看哪种类型的犯罪报告最多。\n\n1. 打开 `PivotCharts.xlsx`\
    \ 表格并选择 `Pie Chart`（饼图）。\n\n![](img/rsrc15.jpg)\n\n2. 从功能带选择 `PivotChart Tools`（透视图工具）：Design（设计）然后\
    \ `Change Chart Type`（更改图表）。\n\n3. 选择第二个选项。`Stacked Bar`（聚集条形图）。\n\n4. 点击‘OK’按钮。\n\
    \n***\n\n#### 条形图示例\n\n现在我们已经知道了犯罪发生的地点，让我们看看报告最多。\n\n1. 打开 `PivotCharts.xlsx`\
    \ 表格并选择 `Bar Chart`（条形图）。\n\n![](img/rsrc16.jpg)\n\n2. 从功能带选择 `PivotChart Tools`（透视图工具）：Design（设计）然后\
    \ `Filter`（筛选）图标。\n\n![](img/rsrc17.jpg)注：图表中的行是降序排列的。\n\n7. 将光标放在单元格‘A1’中并点击下拉箭头。\n\
    8. 选择 `More Sort Options…`（更多排序选项…）。\n\n![](img/rsrc17.jpg)\n\n9. 将出现以下对话框：\n\
    \    * 选择 `Ascending (A to Z) by:`（按升序 (A 到 Z) ：）\n    * 从下拉框中选择 `REPORTED`（报告）\n\
    \    * 点击‘OK’按钮。\n\n![](img/rsrc17U.jpg)由于条形图呈降序，我们可以很容易看到‘Car Prowl’（偷车）是最多的犯罪.-\
    \ ![](img/rsrc17Y.jpg)\n\n#### 值筛选与透视图\n\n让我们看看是否可以将资源集中在前 5 名报告的项目上。\n\n1. 将光标放在单元格‘A1’中并点击下拉箭头。\n\
    2. 选择 `Value Filters`（值筛选）然后 `Top 10…`（前 10 个…）。\n\n![](img/rsrc18.jpg)将出现以下对话框：\n\
    \n3. 将数量更改为 `5` 并点击‘OK’按钮。\n\n![](img/rsrc18G.jpg)![] (rsrc18M.jpg)\n\n***\n\n\
    #### 图表样式\n\n接下来，让我们提高图表的可读性。\n\n1. 激活图表，从功能带选择 `PivotChart Tools`（透视图工具）：Design（设计）。\n\
    2. 在‘Chart Styles’下选择第三种选项。\n\n***\n\n#### 聚集条形图\n\n最后，让我们看看是否可以通过聚集条形图来更深入地了解这些前\
    \ 5 名犯罪发生的地点。\n\n1. 激活图表，从工作表左侧的 `PivotChart Fields`窗格中将 `Precinct`（分区）拖到 `Legend\
    \ Series`（图例项）框中。\n\n![](img/rsrc19.jpg)\n\n"
