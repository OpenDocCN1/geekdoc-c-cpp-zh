    \n12.  In the Name: field enter ‘%_OF_GOAL’\n\n13.  In the Formula field: enter\
    \ the following formula\n\n=(SALES-PLAN)/PLAN\n\n14.  Click the ‘OK’ button\n\n\
    ![](rsrc2WR.jpg)Note: the ‘%_OF_GOAL’ field was added to our PivotTable results:![](rsrc2WW.jpg)\n\
