  trans: "\n\n| 如果你在功能区上没有看到“透视表工具：分析”选项，请点击任意透视表单元格。此选项仅在透视表字段活动状态时才会出现。 |\n\n3.\
    \ 从对话框中选择“饼图”（Pie）\n\n4. 选择最后一个选项“环形图”（Doughnut）\n\n![](img/rsrc21W.jpg)\n\n5.\
    \ 点击“确定”按钮\n\n现在应该显示一个与其类似的图表：![](img/rsrc223.jpg)以下步骤 6 – 20 是可选的\n\n6. 隐藏字段按钮：在任何字段按钮上点击右键，并选择“在图上隐藏所有字段按钮”\n\
    \n7. 选中图表，点击图表旁边的加号 `+` 按钮，取消勾选“图例”（Legend）框\n\n![](img/rsrc22B.jpg)\n\n8. 点击画刷按钮，选择“颜色”，然后选择一种你喜欢的的“单色”颜色\n\
    \n![](img/rsrc22J.jpg)\n\n9. 双击选择环形图中较小的部分\n\n![](img/rsrc22T.jpg)\n\n10. 从`设置数据点`（Format\
    \ Data Point）菜单中，选择`油桶`（Paint Bucket）并点击`图案填充`（Pattern fill）单按钮\n\n11. 选择你喜欢的图案格式\n\
    \n![](img/rsrc232.jpg)\n\n12. 点击图表外部，例如单元格 `C2`\n\n13. 从`功能区`（Ribbon）选择`插入 : 插图\
    \ : 形状`\n\n![](img/rsrc23B.jpg)\n\n14. 从`形状`（Shapes）下拉菜单中选择`文本框`（Text Box）形状\n\
    \n![](img/rsrc23J.jpg)\n\n15. 拖动倒置的十字光标到环形图中心并画一个正方形\n\n![](img/rsrc23T.jpg)\n\
    \n16. 当光标位于`文本框`（TextBox）内部时，选择公式栏并输入 `=$B$2`（按下键盘上的`Enter` 键）将公式链接到`文本框`\n\n\
    ![](img/rsrc240.jpg)\n\n17. 将`文本框`（TextBox）的字体大小和样式更改为你喜欢的主题\n\n![](img/rsrc247.jpg)\n\
    \n18. 选择`文本框`（TextBox）并点击右键，从子菜单中选择`设置形状…`（Format Shape…）\n\n19. 选择`油桶`（Paint\
    \ Bucket）并点击`无填充`（No Fill）和`无线条`（No Line）按钮\n\n![](img/rsrc24G.jpg)\n\n20. 将标题从“总量”（Total）更改为“重复捐赠占比”（%\
    \ of Repeat Donors）\n\n现在应该显示一个与其类似的图表：![](img/rsrc24S.jpg)地理（地图）[](rsrc24Y.jpg)地图图表类型适用于理解高层地理信息。在本书出版时，地图图表不支持较低的地理数据（如城市）。例如，如果你正在分析美国各州的销售额百分比，并想深入查看加州各城市的销售额，则此图表类型将无法工作。此外，此图表类型不支持透视表数据，且创建或更新图表需要连接互联网。现有的地图图表不需要网络访问。\n\
    \n| 重要！ |\n\n| 以下步骤和截图使用的是 Excel® 2019 版本，之前版本的 Excel® 界面有很大不同。 |\n\n### 地图示例\n\
    \n1. 打开[DashboardGraphics.xlsx](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)\
    \ 电子表格并选择工作表 `Map Chart`\n\n![](img/rsrc25F.jpg)\n\n2. 选中单元格 `A2:B20`\n\n3. 从功能区选择“插入”（INSERT）\n\
    \n4. 在图表菜单下，点击“地图”（Maps）下拉箭头\n\n5. 选择“填充填充地图”（Filled Map）\n\n![](img/rsrc25S.jpg)\n\
    \n6. 选中图表，点击图表旁边的加号 `+` 按钮\n\n7. 点击“数据标签”（Data Labels）旁边的箭头，然后选择“更多数据标签选项…”（Show\
    \ More Data Label Options…）\n\n![](img/rsrc25Z.jpg)\n\n8. 从`设置数据标签…`（Format Data\
    \ Labels…）菜单中选择：\n    * 类别名称（Category Name）\n    * 值（Value）\n    * 分隔符下拉菜单选择：（换行）（New\
    \ Line）\n\n![](img/rsrc26D.jpg)现在应该显示一个与其类似的图表：你可能需要扩大地图图表的长度和宽度以获得更好的查看效果![](img/rsrc26K.jpg)要查看英国地图图表示例，请点击标记为“UK\
    \ Map Chart Example”的工作表标签页。(rsrc26S.jpg)\n\n### 图标（图形）![](img/rsrc26Y.jpg)图标是让你的仪表板具有视觉吸引力的简单方法。有多种选项供选择，并更改它们的填充颜色以增强效果。\n\
    \n> 图标示例\n\n1. 打开[DashboardGraphics.xlsx](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)\
    \ 电子表格并选择工作表 `Icons`\n\n2. 从功能区选择“插入”（INSERT）\n\n3. 点击“插图”（Illustrations）下拉箭头然后点击“图标”（Icons）\n\
    \n![](img/rsrc279.jpg)\n\n4. 在提示时，在“分析”（Analytics）部分选择向上和向下箭头图标\n\n5. 点击“插入”（Insert）按钮\n\
    \n![](img/rsrc27F.jpg)图标现在已插入到工作表中；但它们可能会重叠，需要分开。\n\n6. 选择向下箭头图表，点击右键，并选择“设置图形”（Format\
    \ Graphic）\n\n![](img/rsrc27N.jpg)\n\n7. 在提示时选择红色`填充`\n\n![](img/rsrc27V.jpg)\n\
    \n8. 为向上箭头图标重复步骤 6 和 7，这次选择绿色`填充`\n\n![](img/rsrc281.jpg)\n\n### 人数图（加载项）![](img/rsrc287.jpg)人数图是一种视觉吸引力强的图表类型，用于显示数值的对比。人数图被视为\
    \ Excel® 加载项，需要用户在使用之前进行安装。\n\n> 人数图示例\n\n1. 打开[DashboardGraphics.xlsx](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)\
    \ 电子表格并选择工作表 `Add-in`\n\n2. 从功能区选择“插入”（INSERT）\n\n3. 在“加载项”（Add-ins）部分点击“人数”（People）图标\n\
    \n![](img/rsrc28K.jpg)现在应该显示以下提示：![](img/rsrc28S.jpg)\n\n4. 点击“信任此加载项”（Trust this\
    \ add-in）按钮，加载项加载需要一到两分钟\n\n5. 加载项加载后选择“数据”（Data）\n\n![](img/rsrc291.jpg)\n\n\
    6. 将标题更改为“志愿者募集金额”（Amount Raised By Volunteer）\n\n7. 点击“选择数据”（Select your data）\n\
    \n![](img/rsrc29A.jpg)\n\n8. 选择行 `A2:11` 并点击“创建”（Create）\n\n![](img/rsrc29H.jpg)\n\
    \n9. 点击“设置”（Settings）\n\n![](img/rsrc29S.jpg)\n\n10. 选择“形状”（Shape）然后选择钱袋符号\n\n\
    ![](img/rsrc29Z.jpg)现在应该显示一个与其类似的图表：![](img/rsrc2A4.jpg)快速趋势图（Sparklines）是包含在工作表单个单元格内的微趋势图表。每个快速趋势图代表单个数据元素，并以三种形式显示：\n\
    \n1. 折线图（Line）\n\n![](img/rsrc2AD.jpg)\n\n2. 柱状图（Column）\n\n![](img/rsrc2AM.jpg)\n\
    \n3. 胜负图（Win/Loss）\n\n![](img/rsrc2AV.jpg)\n\n"
- fmt: "\n| By selecting columns instead of specific cells we’ll be preparing the\
    \ dashboard to accept new data. When we receive a new week’s worth of views, we\
    \ can override our existing dataset and not have to make any additional changes.\
    \ |\n\n## 5. Rename the new worksheet from ‘Sheet1’ to ‘Media Dashboard’\n\n![](rsrc2D4.jpg)\n\
    \n## 6. In the ‘PivotTable Fields’ pane select the following fields:\n\n* `MEDIUM`\
    \ (Rows section)\n* `DATE`  (Columns section)\n* `VIEWS`  (∑ Values section)\n\
    \n![](rsrc2DJ.jpg)\n\n## 7. Select cell ‘J4’\n\n## 8. From the PivotTable Tools\
    \ Ribbon select the `Design` tab, then the `Grand Totals` drop-down arrow\n\n\
    ## 9. Select the option ‘On for Columns Only’\n\n![](rsrc2DX.jpg)\n\n## 10. Select\
    \ the drop-down arrow for cell `B3` labeled `Column Labels` and uncheck the box\
    \ for `(blank)`\n\n## 11. Click the ‘OK’ button\n\n![](rsrc2E5.jpg) The PivotTable\
    \ should look similar to the following:![](rsrc2EA.jpg)\n\n## Adding Sparklines\
    \ To The Dashboard\nIn this section, we’ll be adding Sparklines to the dashboard\
    \ in order to display the trend for the week.\n\n1. Right-click on column `I`,\
    \ select `Column Width…`, set to 45 and click the ‘OK’ button\n\n![](rsrc2EM.jpg)\n\
    \n2. Place your cursor in cell `I5`, from the Ribbon select `Insert`\n\n3. From\
    \ the `Sparklines` menu select `Line`\n\n![](rsrc2EX.jpg)\n\n4. In the dialogue\
    \ box for `Data Range:` select cells `B5:H5`\n\n5. Click the ‘OK’ button\n\n![](rsrc2F6.jpg)\n\
    \n6. With cell `I5` active, from the Ribbon select the Sparkline Tools : `Design`\
    \ tab\n\n7. In the `Show` section click the `Markers` option\n\n![](rsrc2FF.jpg)\n\
    \n8. Select ‘Copy’ or press `Ctrl+C` on your keyboard\n\n9. Copy this formula\
    \ to cells `I6:I11` then press `Ctrl+V` (paste) on your keyboard\n\n10. Press\
    \ the `Esc` (escape) button on your keyboard\n\n11. Select cell `I4` and type\
    \ `TREND`\n\n![](rsrc2FU.jpg)\n\n## Conditional Formatting & Icon Sets\nNext,\
    \ we’ll add visual indicators to assist the viewer with identifying mediums that\
    \ are not generating the minimum of six views a day.\n\n1. Select cells `B5:H10`\n\
    \n2. From the Ribbon select `Home` : `Conditional Formatting`\n\n3. Select `Highlight\
    \ Cells Rules: Less Than…`\n\n![](rsrc2G4.jpg)\n\n4. For the `Format cells that\
    \ are LESS THAN:` enter the value 6\n\n5. Click the ‘OK’ button\n\n![](rsrc2GD.jpg)\n\
    \n6. Select cells `B5:H10`\n\n7. From the Ribbon select `Home` : `Conditional\
    \ Formatting`\n\n8. Select `Icon Sets…` and the ![](rsrc2GM.jpg) indicators\n\n\
    ![](rsrc2GU.jpg)\n\n9. From the Ribbon select `Home` : `Conditional Formatting`\n\
    \n10. Select `Manage Rules…`\n\n![](rsrc2H2.jpg)\n\n11. Select the Icon Set rule\n\
    \n12. Click the `Edit Rule...` button\n\n![](rsrc2HA.jpg)\n\n13. Complete the\
    \ following:\n    1. Change the `Type` to `Number`\n    2. Change the `Values`\
    \ to 6\n    3. Click the drop-down arrow for `when value is` and select `No Cell\
    \ Icon`\n    4. Click the drop-down arrow for `when < 6 and` and select `No Cell\
    \ Icon`\n    5. Click the ‘OK’ button\n\n![](rsrc2HW.jpg)\n\n14. Click the ‘Apply’\
    \ button, then the ‘OK’ button\n\n![](rsrc2J3.jpg)\n\n## Formatting The Dashboard\n\
    Lastly, we’ll format the dashboard to improve readability.\n\n1. CHANGE and CENTER\
    \ the label names:\n* Cell text `A3` to `DAILY VIEWS`\n* Cell text `A4` to `MEDIUM`\n\
    * Cell text `B3` to `DAY`\n* Cell text `A11` to `TOTAL`\n* Change the font to\
    \ bold for cell `I4`\n\n![](rsrc2JT.jpg)\n\n2. Select row 2, right-click, and\
    \ select `Delete`\n\n![](rsrc2JZ.jpg)\n\n3. Select cell `A1` and type `Social\
    \ Media Trends`\n\n4. Select cell `A1` change the font to Bold, size 22, and `Merge\
    \ & Center` across columns `A:I`\n\n![](rsrc2K8.jpg)\n\n5. Select cells `A3:I10`\n\
    \n6. Click the `Boarders` drop-down arrow and choose option `All Boarders`\n\n\
    ![](rsrc2KG.jpg)\n\n7. Select cells `A2:I3` and choose a font shading option of\
    \ your choice\n8. Select cells `A10:H10` and choose a font shading option of your\
    \ choice\n\n![](rsrc2KS.jpg)\n\n9. Select rows `4 - 10` right-click and select\
    \ `Row Height…`\n10. When prompted enter the `Row height` 35\n11. Click the ‘OK’\
    \ button\n\nThe dashboard should look similar to the following:![](rsrc2EA.jpg)\n"
