  raw: '![](rsrc10E.jpg)The individual dates should now be displayed:![](rsrc10K.jpg)Conditional
    FiltersIn the first part of this chapter we reviewed how Timelines and Slicers
    may be used for interactive filtering.  In this section, we’ll demonstrate how
    to use built-in PivotTable filtering for specific conditions.  If you’re familiar
    with Excel’s conditional formatting capabilities, this is very similar.


    * * *


    EXAMPLE:In the airplane parts spreadsheet, if we wanted to know:


    *   The top 10 airplane parts sold by category?


    *   The bottom 10 airplane parts sold by category?


    *   The top 10 airplane parts sold by Quarter?


    *   How many parts sold more than 800 in quantity?


    Value Filters (Top & Bottom Performers)


    1.  Open the AirplaneParts.xlsx spreadsheet and select cells ‘A1:F3889’


    2.  From the Ribbon select Insert : PivotTable


    3.  Click the ‘OK’ button


    A new tab will be created and the ‘PivotTable Fields’ pane should appear on the
    left side of your screen.


    4.  In the ‘PivotTable Fields’ pane select the following fields:


    *   CATEGORY (Columns section)


    *   PART (Rows section)


    *   QTY (∑  Values section)


    5.  Select cell ‘A4’ and click the drop-down arrow of ‘Row Labels’


    6.  From the menu select ‘Value Filters’ then ‘Top 10…’


    ![](rsrc11W.jpg)


    7.  The following prompt will appear, click the ‘OK’ button


    ![](rsrc124.jpg)The following will be the result, you may change the quantity
    from 10 to any number you would like to see.![](rsrc129.jpg)Similarly, we may
    change to show the bottom 10.


    8.  Select cell ‘A4’ and click the drop-down arrow of ‘Row Labels’


    9.  From the menu select ‘Value Filters’ then ‘Top 10…’


    10.  The following prompt will appear, click the drop-down arrow that says ‘Top’
    and change to ‘Bottom’


    11.  Click the ‘OK’ button


    ![](rsrc12K.jpg)The following will be the result, you may change the quantity
    from 10 to any number you would like to see.![](rsrc12S.jpg)You may a add a [Timeline](#part0011.xhtml_toc24_Timeline)
    to quickly see the top or bottom 10 by time frames.


    * * *


    Let’s review another example, this time we’ll specify the quantity.


    1.  Select cell ‘A4’ and click the drop-down arrow of ‘Row Labels’


    2.  From the menu select ‘Value Filters’ then ‘Greater Than Or Equal To…’


    ![](rsrc131.jpg)


    3.  The following prompt will appear, enter the number 800 in the field after
    the drop-down box ‘is greater than or equal to’


    4.  Click the ‘OK’ button


    ![](rsrc138.jpg)The following will be the result:![](rsrc13E.jpg)Removing FiltersTo
    remove a filter:


    1.  Select cell ‘A4’ and click the drop-down arrow of ‘Row Labels’


    2.  From the menu select Clear Filter From “<filter value will be listed here>”


    ![](rsrc13S.jpg)CHAPTER 8Pivot Charts


    * * *


    PivotTables provide an excellent way to summarize large amounts of data in a numeric
    table-layout.  Pivot Charts make your analysis even more effective by presenting
    the information in graphical form.In this chapter, we’ll explore four of the most
    common PivotChart types; Bar, Column, Pie and Line.  These charts fall into two
    main categories; 1) comparison and 2) trend.![](rsrc149.jpg)Bar  and  Column charts
    are best for comparing numbers, such as currency or quantity.  Column charts display
    data vertically, and are a better choice if your data includes negative values.Pie
    charts also compare data and are ideal for illustrating percentages as part of
    the whole, for example sales or product allocation.Line charts are used to demonstrate
    changes over a period of time and are helpful in understanding trends.  Often
    used when studying financial or frequency figures.Irrespective of the chart type
    used, it’s important to be mindful of the number of elements you’re displaying
    and the use of colors.  If there are too many, your charts will be become ambiguous
    and difficult to read, especially if your customer is viewing a black and white
    print out of your chart.Similarly, if your chart is part of a presentation being
    projected, audience members sitting farther back from the screen will have a hard
    time seeing more than 4 – 5 chart values or distinguishing between subtle color
    differences.


    * * *


    EXAMPLES:The following four examples focus on how to use Pivot Charts.  To aid
    in the learning process, the PivotTables have already been created.


    * * *


    WEB ADDRESS & FILE NAME FOR EXERCISE:[https://bentonbooks.wixsite.com/bentonbooks/excel-2019](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)Pivot_Charts.xlsxPie
    Chart ExampleFor our first example, you’re an analyst and want to understand if
    crimes are occurring more often in a particular area of the county.


    1.  Open the Pivot_Charts.xlsx spreadsheet and select the worksheet ‘Pie Chart’


    2.  From the Ribbon select PivotTable Tools : Analyze and then the PivotChart
    icon


    ![](rsrc14Z.jpg)


    | IMPORTANT! |


    | If you do not see the PivotTable Tools : Analyze option on your Ribbon, click
    any PivotTable cell.  This option only appears when a PivotTable field is active.
    |


    3.  Select ‘Pie’ from the dialogue box


    4.  Click the ‘OK’ button


    ![](rsrc15H.jpg)A chart similar to the below should now be displayed:![](rsrc15P.jpg)Quick
    Layout Options


    1.  From the Ribbon select PivotChart Tools : Design,  then the ‘Quick Layout’
    drop-down arrow


    2.  Select the first option from the ‘Quick Layout’ drop-down box


    ![](rsrc15Z.jpg)The following Pie Chart should now be displayed:![](rsrc163.jpg)


    3.  Edit the Chart Title by double-clicking inside the “Total” field, change text
    from ‘Total’ to ‘Crimes Reported By Area 02/01/2019 – 03/31/2019’.


    4.  Optional step: hide the Field buttons, right-click over any Field button and
    select the appropriate hide option


    ![](rsrc16C.jpg)This Pie Chart shows most of the crimes are being committed in
    the North and West areas of the county.![](rsrc16H.jpg)


    * * *


    Bar Chart ExampleNow that we know where the majority of crimes are occurring,
    let’s take a look at what type of offenses are being reported the most.


    1.  Open the Pivot_Charts.xlsx spreadsheet and select the ‘Bar Chart’ worksheet


    ![](rsrc16V.jpg)


    2.  From the Ribbon select PivotTable Tools : Analyze and then the PivotChart
    icon


    3.  Select the ‘Bar’ option


    4.  Click the ‘OK’ button


    5.  Move the chart below the PivotTable report summary


    6.  Expand the length & width to allow for easier viewing


    ![](rsrc179.jpg)Note: the crime offense rows in the bar chart are in descending
    order.  Our display would be more effective and easier to read if we show the
    crime count total reported in cascading order.


    7.  Place your cursor in cell ‘A1’ and click the drop-down arrow


    8.  Select ‘More Sort Options…’


    ![](rsrc17G.jpg)


    9.  The following dialogue box will appear:


    *   Select the ‘Ascending (A to Z) by:’ radio button


    *   Select ‘REPORTED’ from the drop-down box


    *   Click the ‘OK’ button


    ![](rsrc17U.jpg)With the bar chart in cascading order, we can now easily see ‘Car
    Prowl’ is the most often reported crime by a wide margin.![](rsrc17Y.jpg)Value
    Filters & PivotChartsLet’s see if we can focus our resources on the TOP 5 crimes
    reported.


    1.  Place your cursor in cell ‘A1’ and click the drop-down arrow


    2.  Select ‘Value Filters’ then ‘Top 10…’


    ![](rsrc189.jpg)The following dialogue box will appear:


    3.  Change the quantity to 5 and click the ‘OK’ button


    ![](rsrc18G.jpg)![](rsrc18M.jpg)


    * * *


    Chart StylesNext, let’s improve the readability of the chart.


    1.  With the chart active, from the Ribbon select PivotChart Tools : Design


    2.  Under ‘Chart Styles’ select the third option


    ![](rsrc18Z.jpg)Stacked Bar ChartLastly, let’s see if we can gain more insight
    into where these TOP 5 crimes are being reported by using a stacked bar chart.


    1.  With the chart active, from the ‘PivotChart Fields’ pane on the left side
    of the worksheet drag ‘Precinct’ to the ‘Legend Series’ box.


    ![](rsrc199.jpg)


    2.  From the Ribbon select PivotChart Tools : Design then the Change Chart Type
    icon


    ![](rsrc19E.jpg)


    3.  Select the second option. ‘Stacked Bar’.


    4.  Click the ‘OK’ button'
