- fmt: "\nLike with many tasks in Excel®, file importing and parsing can be accomplished\
    \ in multiple ways. The following example describes how to read and parse a `.CSV`\
    \ (comma separated value) file using Excel’® Data Model. After the data is imported,\
    \ we’ll create two PivotTable reports.\n\n# The Excel® Data Model\nThe Excel®\
    \ Data Model is a feature in which data from different sources can be brought\
    \ together into a single workbook via a computer or network connection and queries.\
    \ Once this information is in the workbook, you’ll be able to create PivotTables\
    \ and Charts. This type of reporting may also be achieved by using macros (Visual\
    \ Basic for Applications), Power Pivot, Power Query (please see next chapter),\
    \ and Power View. Deciding which method to use depends on a variety of factors,\
    \ such as:\n\n*   The amount of data you’re analyzing\n*   The complexity and\
    \ time it takes to complete your analysis\n*   Your audience’s requirements\n\
    *   Your skill level with Excel® and the version you’re using\n\nIn the following\
    \ example, the reporting is straightforward. We’ll be reporting on less than 100\
    \ records and our Excel® Data Model will contain only one data source (a `.CSV`\
    \ file).![](rsrc1KU.jpg) Chapter 11 describes how to consolidate data with larger\
    \ record counts and from multiple workbooks to create a PivotTable using ‘Power\
    \ Query’.![](rsrc1KZ.jpg)\n\n***\n\n## EXAMPLE: You’re a Business Analyst and\
    \ a request has been made to change a monthly employee sales report. Management\
    \ would now like:\n\n*   A Regional sales summary by month\n*   Employee sales\
    \ grouped and subtotaled by Region\n\nEmployee sales are captured in a legacy\
    \ system. This older system produces a monthly `.CSV` file and saves it to a location\
    \ on a company server. To save yourself time formatting the same report each month\
    \ you create two PivotTables to import and format the data.\n\n***\n\n### WEB\
    \ ADDRESS & FILE NAMES FOR EXERCISE\n[https://bentonbooks.wixsite.com/bentonbooks/excel-2019](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)\n\
    `EmployeeSales.csv`\n`MonthlySalesReport.xlsx`\n\n***\n\n| ADDITIONAL STEP FOR\
    \ THIS CHAPTER |\n| :--- |\n| Save the `EmployeeSales.csv` file to a location\
    \ you can easily access such as a temporary folder or your desktop. |\n\n***\n\
    \nFrom `.CSV` file:![](rsrc1N0.jpg)\n\n***\n\nTo Excel® Report:![](rsrc1N6.jpg)\n\
    \n***\n\n| IMPORTANT! |\n| :--- |\n| The following steps & screenshots use Excel®\
    \ version 2019, the interface for the previous versions of Excel® is very different.\
    \ |\n\n***\n\n1.  Download the `EmployeeSales.csv` exercise file to a location\
    \ you can easily access such as a temporary folder or your desktop\n2.  Open the\
    \ `MonthlySalesReport.xlsx` spreadsheet\n3.  From the Ribbon select `Data` and\
    \ then ‘From Text/CSV’![](rsrc1NV.jpg)\n4.  Open the location where the `EmployeeSales.csv`\
    \ file is located\n5.  Select the file and click the ‘Import’ button![](rsrc1P4.jpg)\
    \ The following prompt will appear:\n6.  Click the `Load` drop-down box and select\
    \ the `Load To...` option![](rsrc1PC.jpg)\n7.  For the `Import Data` prompt:\n\
    \    *   Select the radio button for ‘PivotTable Report’\n    *   Select the radio\
    \ button for ‘Existing worksheet’ enter `=$E$3` for the cell location\n    * \
