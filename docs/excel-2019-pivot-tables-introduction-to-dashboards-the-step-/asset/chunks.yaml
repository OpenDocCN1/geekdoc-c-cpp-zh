    \  Select cells ‘A3:I10’\n\n6.  Click the ‘Boarders’ drop-down arrow and choose\
    \ option ‘All Boarders’\n\n![](rsrc2KG.jpg)\n\n7.  Select cells ‘A2:I3’ and choose\
    \ a font shading option of your choice\n\n8.  Select cells ‘A10:H10’ and choose\
    \ a font shading option of your choice\n\n![](rsrc2KS.jpg)\n\n9.  Select rows\
    \ ‘4 - 10’ right-click and select ‘Row Height…’\n\n10.  When prompted enter the\
    \ ‘Row height:’ value 35\n\n11.  Click the ‘OK’ button\n\n![](rsrc2M3.jpg)The\
    \ dashboard should look similar to the following:![](rsrc2M8.jpg)We’ve met the\
    \ customer’s requirements of building a weekly dashboard displaying the date,\
    \ day of the week, and number of views for each medium and each medium’s weekly\
    \ trend.Please see [Chapter 15](#part0019.xhtml_toc88_Overriding_Existing_Data__Manually_)\
    \ to learn more about Refreshing PivotTable Data.CHAPTER 14Auto Parts Dashboard\
    \ Example\n\n* * *\n\nThe Director of Sales has asked you to create a monthly\
    \ dashboard for her to ensure auto part sales are on-track to meet monthly and\
    \ annual targets for four US regions.The dashboard should include the following\
    \ for a YTD (year-to-date) time period:\n\n*   Sales by region\n\n*   The total\
    \ sales compared to plan dollars\n\n*   Sales by auto category\n\n*   The number\
    \ of employees not meeting their sales goals by 5% or more\n\n*   The number of\
    \ employees exceeding their sales goals by 5% or more\n\n*   The overall monthly\
    \ sales trend\n\nThe data is generated from a database query.  You’ll receive\
    \ updated data at the start of every month for the prior month’s sales.  Users\
    \ will access the dashboard online, including mobile devices, as well as some\
    \ users will receive a print-out of the dashboard.\n\n* * *\n\nWEB ADDRESS & FILE\
    \ NAME FOR EXERCISE:[https://bentonbooks.wixsite.com/bentonbooks/excel-2019](https://bentonbooks.wixsite.com/bentonbooks/excel-2019)Autopart_Sales_Dashboard.xlsx\n\
    \n* * *\n\n| IMPORTANT! |\n\n| To save our readers time and to aid in the learning\
    \ process most graphics and formatting have already been applied to this exercise\
    \ file.  To learn about how the graphics were added, please see the worksheet\
    \ named ‘Formatting Information’. –Thank you! |\n\nSample data for this chapter,\
    \ due to space limitations the entire data set is not displayed.![](rsrc2NR.jpg)\n\
    \n* * *\n\nYou’ve reviewed the customer’s requirements and while they didn’t initially\
    \ ask for the ability to filter by time period, you anticipate this is something\
    \ they may want in the future and therefore decide to design accordingly.In order\
    \ to build this dashboard you will need to:\n\n*   Accommodate up-to 12 months\
    \ of data\n\n*   Create 6 PivotTables\n\n*   Add 1 Sparkline\n\n*   Include 1\
    \ pie chart\n\n*   Insert 6 icon graphics\n\n*   Add 1 Timeline\n\n*   Size to\
    \ fit or be “shrunk down” to display on one standard size (8 ½ x 11 inch) piece\
    \ of paper (landscape)\n\n*   Use colors sparingly, as you don’t know if the paper\
    \ form will be printed in color or in black and white ink\n\n*   Prepare the dashboard\
    \ to receive new data and keep the existing formatting\n\nAdding Multiple PivotTables\
    \ To A Single WorkbookWe’ll begin by preparing our data for the dashboard.  This\
    \ will involve creating six PivotTables.PivotTable #1 - Sales By Region\n\n1.\
    \  Open the Autopart_Sales_Dashboard.xlsx spreadsheet\n\n![](rsrc2PS.jpg)\n\n\
    2.  Click the ‘Data’ tab and select columns A:G\n\n3.  From the Ribbon select\
    \ Insert : PivotTable\n\n4.  When you receive the Create PivotTable prompt, select\
    \ the ‘Existing Worksheet’ radio button\n\n5.  Place your cursor inside the ‘Location:’\
    \ box\n\n*   With your cursor still inside the ‘Location:’ box click the ‘Dashboard’\
    \ tab and then cell ‘A8’\n\nThe ‘Location:’ box should now have Dashboard!$A$8\
    \ entered\n\n6.  Click the ‘OK’ button\n\n![](rsrc2R6.jpg)\n\n| Cells vs Columns\
    \ |\n\n| By selecting columns instead of specific cells, we’ll be preparing the\
    \ dashboard to accept new data.  When we receive a new month’s worth of sales,\
    \ we can append our existing dataset and not have to make any additional changes.\
    \ |\n\n7.  With your cursor in cell ‘A8’ of the ‘Dashboard’ tab, right-click and\
    \ select ‘PivotTable Options…’\n\n![](rsrc2RN.jpg)\n\n8.  Make the following PivotTable\
    \ Option updates:\n\n    *   Enter ‘Regions’ for the PivotTable Name\n\n    *\
    \   Check the box for ‘Merge and center cells with labels’\n\n    *   Uncheck\
    \ the box for ‘Autofit column widths on update’\n\n    *   Click the ‘OK’ button\n\
    \n![](rsrc2S6.jpg)\n\n9.  In the ‘PivotTable Fields’ pane select the following\
    \ fields:\n\n    *   REGION (Rows section)\n\n    *   SALES   (∑  Values section)"
