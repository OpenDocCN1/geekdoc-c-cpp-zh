    The following dialogue box will appear, please note the Data Range and location
    where the new PivotTable will be located:![](rsrcCV.jpg

    3. Click the `OK` button


    A new tab will be created and appear similar to the following. Note: the `PivotTable
    Fields` pane on the left side of the new worksheet.![](rsrcD4.jpg)


