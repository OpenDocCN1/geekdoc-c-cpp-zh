    ## 10. 格式化透视表


    *   选择‘A8’单元格，将文本从‘Row Labels’更改为 `REGIONS`

    *   选择‘B8’单元格，将文本从‘Sum of TOTAL’更改为 `SALES_$`

    *   选择‘A15’单元格，将文本从‘Grand Total’更改为 `TOTAL`

    *   选择‘B9:B14’单元格，并更改为你选择的货币格式


    ![](img/rsrc2T4.jpg)


    11. 选择‘A8’单元格，然后从数据透视表工具区中选择 `Design` 选项卡：`PivotTable Styles`


    12. 从 `PivotTable Styles` 下拉菜单中选择你喜欢的格式样式


    ![](img/rsrc2TA.jpg)


    13. 选择‘A8:B15’单元格并为表格添加边框，从功能带的 `Home`：`Font`：`Boarders` 下拉菜单：`All borders`


    ![](img/rsrc2TG.jpg)


    14. 选择‘A8’单元格，点击下拉箭头并取消勾选‘(blank)’选项


    15. 点击‘OK’按钮


    ![](img/rsrc2TT.jpg)仪表板外观应如下所示：![](img/rsrc2TX.jpg)


    ***


    现在我们已经构建并格式化了第一个透视表，可以将其复用于后续的指标。


    ## 透视表 #2 - 目标完成率


    1.  选择‘A8:B14’单元格，右键点击并选择‘Copy’或在键盘上按下 `Ctrl+C`


    2.  将光标放在‘D8’单元格中，并在键盘上按下 `Ctrl+V`（粘贴）


    3.  当光标位于‘D8’单元格时，右键点击并选择‘PivotTable Options...’，为透视表名称输入 `%_Of_Goal`


    4.  点击‘OK’按钮


    5.  在 `PivotTable Fields` 格中，取消勾选 `REGION` 框


    6.  在 `PivotTable Fields` 格中，点击 `PLAN` 框或将此字段拖到 `∑ Values` 区域


    7.  选择‘E8’单元格，将文本从‘Sum of PLAN’更改为 `PLAN_$`


    8.  选择‘E9’单元格，并更改为你选择的货币格式


    ![](img/rsrc2UM.jpg)


    ***


    ## 透视表 #3 – 按分类销售


    1.  选择‘D8:E9’单元格，右键点击并选择‘Copy’或在键盘上按下 `Ctrl+C`


    2.  将光标放在‘G8’单元格中，并在键盘上按下 `Ctrl+V`（粘贴）


    3.  当光标位于‘G8’单元格时，右键点击并选择‘PivotTable Options...’，为透视表名称输入 `Sales_By_Category`


    4.  点击‘OK’按钮


    5.  在 `PivotTable Fields` 格中，取消勾选 `PLAN` 框


    6.  在 `PivotTable Fields` 格中，点击 `CATEGORY` 框或将此字段拖到 `Rows` 区域


    7.  选择‘G8’单元格，将文本从‘REGIONS’更改为 `CATEGORY`


    8.  选择‘G8’单元格，点击下拉箭头并取消勾选‘(blank)’选项


    ![](img/rsrc2V9.jpg)


    ## 计算字段


    对于接下来的两个透视表，我们将使用自定义计算字段。正如前面的章节所示，虽然透视表具有许多内置的数学功能，但你所执行的分析类型可能比标准透视表‘Value Field
    Settings’中包含的计算更复杂。这时，插入自定义‘Calculated Fields’的能力就尤为有用了。


    ***


    ## 透视表 #4 – 低于目标 5% 的员工


    1.  选择‘G8:H14’单元格，右键点击并选择‘Copy’或在键盘上按下 `Ctrl+C`


    2.  将光标放在‘J8’单元格中，或在键盘上按下 `Ctrl+V`（粘贴）


    3.  当光标位于‘J8’单元格时，右键点击并选择‘PivotTable Options...’，为透视表名称输入 `Employees_Below`


    4.  点击‘OK’按钮


    5.  在 `PivotTable Fields` 格中，取消勾选 `CATEGORY` 和 `SALES` 框


    6.  在 `PivotTable Fields` 格中，勾选 `EMPLOYEE` 框


    7.  选择‘J8’单元格，将名称从‘CATEGORY’更改为 `EMPLOYEE`


    8.  从透视表工具区选择 `Design` 选项卡


    9.  点击‘Grand Totals’下拉框并选择‘Off for Rows and Columns’


    ![](img/rsrc2W1.jpg)


    10. 从透视表工具区选择 `Analyze` 选项卡


    11. 点击 `Fields, Items & Sets` 下拉菜单并选择 `Calculated Field...`


    ![](img/rsrc2W9.jpg)


    12. 在 `Name:` 字段中输入 `%_OF_GOAL`


    13. 在 `Formula` 字段中：输入以下公式


    ```

    =(SALES-PLAN)/PLAN

    ```


    14. 点击‘OK’按钮


    ![](img/rsrc2WR.jpg)注意：`%_OF_GOAL` 字段已添加到我们的透视表结果中：![](img/rsrc2WW.jpg)


    15. 点击 `Sum of %_OF_GOAL` 下拉框并选择‘Value Field Settings...’


    ![](img/rsrc2X3.jpg)


    16. 在 `Custom Name:` 字段中，将 `Sum of %_OF_GOAL` 更改为 `%_OF_GOAL`


