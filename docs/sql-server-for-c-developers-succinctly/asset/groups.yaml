    \n| 图 7：保存更改脚本\n\n如你所示，SQL Server 实际上创建了一个临时表，删除了原表并进行了更改。它做的比你想的要得多！你可以保存此脚本并毫不费力地（或自动地）在另一个环境中执行它。遗憾的是，删除并重建表很慢且消耗资源，你可能仍然想编写自己的脚本。你可以使用屏幕左上角的“新建查询”按钮打开新查询窗口，或使用\
