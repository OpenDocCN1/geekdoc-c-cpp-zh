    # Chapter 5 SQL Server Data Tools


    Using the Visual Studio SQL Server Data Tools, you can create databases in pretty
    much the same way you can see in SQL Server Management Studio. It gets better
    though—you can compare and deploy databases with ease. For this chapter, I have
    undone all the changes we made to the SuccinctlyExamples database in the previous
    chapters, so I''m starting fresh again.


    If you followed all my steps in the Visual Studio installation, you will have
    the SQL Server Data Tools. If you haven''t, you can change your installation by
    going to the Windows Control Panel, then Programs and Features. In the list of
    programs, look for Microsoft Visual Studio X (with Update Y), select it, and click
    Change. Now make sure you select the Data Tools.


    I should mention that I got a new laptop writing the previous chapters and this
    one, so instead of LAPTOP23:SQLEXPRESS, you''ll see1446. All the above still applies,
    of course; it''s just a name change.


    # Database Project


    Start Visual Studio—you don''t even have to start or open a project. In the menu,
    go to View and then SQL Server Object Explorer. You should now get a window on
    the right or left side of the screen (depending on your settings) showing two
    nodes, SQL Server and Projects. Right-click SQL Server and click Add SQL Server.
    You should now see a tree view similar to that in SSMS.


    As you right-click on the objects, you''ll notice that you can add tables, columns,
    and other objects. You can generate scripts of objects, execute scripts, and add
    or alter data. It''s all pretty cool that you can do in this Visual Studio, but
    you could do this in SSMS as well.


    Now here comes the awesome part—right-click the SuccinctlyExamples database, and
    Create New Project. Choose a name for your project, ideally the name of your database
    (I was lazy and kept the default, Database1). You''ll probably want to check Create
    new solution, and possibly Create directory for solution; they''re off by default,
    so I''ll leave it to you. Click Start, and a new database project will be created.
    In the new solution, your Solution Explorer should now look something like this.'
- md: "\n# Solution 'Solution1' (1 project)\n\n- Database1\n  Properties\n  References\n\
    \  dbo\n    Tables\n      Gender.sql\n      Person.sql\n\nFigure 14: Database\
    \ project Solution Explorer\n\nAn alternative method for creating a database project,\
    \ even when you don't have an existing database, by simply starting a new project\
    \ and choosing SQL Server Database Project from the installed templates. In the\
    \ new project, you can create objects and deploy them, or import an existing database\
    \ by right-clicking your database project in the Solution Explorer, selecting\
    \ Import, and then selecting Database.\n\n![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_61_0.png)\n\
    \nFigure 15: The SQL Server Database Project template\n\nLet's continue with the\
    \ Database1 project. Double-clicking on a table, you get to the designer, which\
    \ is pretty similar to that of SSMS. Here you can add new columns and foreign\
    \ keys, change columns, etc. In the lower part of the screen you'll see the SQL\
    \ script for the table; it changes as you change the table.\n\n# Publishing\n\n\
    Before you do anything, let's assume the SuccinctlyExamples database is production\
    \ ready, so we want to deploy it. Right-click your database project in the Solution\
    \ Explorer and choose **Deploy**. In the **Publish Database** window, select a\
    \ database connection. The following window is a bit confusing, as you're presented\
    \ some connections, but your current connection is hidden. To show your current\
    \ connection details, click **Show Connection Properties**. You can just pick\
    \ the **SuccinctlyExamples** database for now.\n\n![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_62_0.png)\n\
    \nFigure 16: The Connection window\n\nIn the Publish database window, pick a database\
    \ name. We're going to create a new database, so let's pick a name that doesn't\
    \ exist. I've called **ProductionDb**. In a real environment you'd probably have\
    \ the same database name, but another server instance. Since we don't have servers\
    \ lying around, we're going to use the same server instance, by using a different\
    \ database name. You can choose to disable numerous options under the Advanced\
    \ menu as well, most notably if data is lost. Unless you check **Block incremental\
    \ deployment if data loss might occur**, you'll never be able to delete columns\
    \ in tables that have rows. There are too many options to discuss them all, but\
    \ be sure to look at them.\n\nNow you can ever the script, change it, and run\
    \ it (in the upper left), or just run the script directly. If you run the script\
    \ directly, it will be placed in the bin folder of your project. Also, a Data\
    \ Tools Operations opens, allowing you to open the script directly. Whichever\
    \ method you choose, you should now have a new ProductionDb database that is the\
    \ same as the SuccinctlyExamples database. That's pretty awesome!\n\n# Updating\n\
    \nNow that we have deployed our database, we're going to get change requests.\
    \ Let's add a column to the **Person** table. Double-click the **Person.sql**\
    \ script in the Visual Studio Solution Explorer. You can right-click in the white\
    \ space of the table designer to add or remove designer columns such as Length,\
    \ Description, and Identity. Now add a column, let's say Title. It also.\n\n|\
    \ Script File: Person.sql |\n| Name | Data Type | Allow Nulls | Default |\n|---|---|---|---|---|\n\
    | Id | int | | | |\n| FirstName | varchar(256) | | | |\n| LastName | varchar(256)\
    \ | | | |\n| DateOfBirth | datetime | | | |\n| Gender | int | | | |\n| Title |\
    \ varchar(254) | | | |\n\n| Keys (1) |\n| PK_Person (Primary Key, Clustered: Id)\
    \ |\n| Constraints (0) |\n| Indexes (0) |\n| Foreign Keys (1) |\n| FK_Person_Gender\
    \ (Id) |\n| Triggers (0) |\n\n![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_63_0.png)\n\
    \n```\nCREATE TABLE [dbo].[Person (\n    [Id] INT IDENTITY (1, 1) NOT NULL,\n\
    \    [FirstName] VARCHAR (256) NULL,\n    [Lastname] VARCHAR (256) NULL,\n   \
    \ [DateOfBirth] SMALLDATETIME NULL,\n    [GenderId] INT NULL,\n    [Title] VARCHAR\
    \ (64) NULL,\n    CONSTRAINT [FK_Person_Gender] FOREIGN KEY ([GenderId]) REFERENCES\
    \ [dbo].[Gender] ([Id]),\n    CONSTRAINT [PK_Person] PRIMARY KEY ([Id])\n);\n\
    ```\n\nFigure 17: Title column\n\nNow publish the database, again this time, simply\
    \ publish to the Succinctly database. After inserting a CREATE script, Visual\
    \ Studio will generate an ALTER script. If you run it (directly or by generating\
    \ the script and running it), your database will now have the new **Title** column.\n\
    \nUpdating a table or column—that is, changing it—results in a refactor log (or\
    \ one thereof). This is necessary for Visual Studio to figure out that it has\
    \ to rename the table or column rather than drop the table or the column with\
    \ the old name. Once you publish the change, a system table is created on your\
    \ database called __RefactorLog (note the two underscores). The table contains\
    \ a single column indicating schema changes have been published.\n\n# Comparing\n\
    \nAnother cool feature of the Data Tools is to compare databases. We have a few\
    \ options: compare database schemas against other databases, compare schemas against\
    \ database projects, and compare data databases.\n\nLet's start comparing schemas\
    \ between databases. Right-click on the database project and click **Schema Compare**.\
    \ In the window that opens, you can now choose a source and a target. The source\
    \ is your current project by default. Change the source to the **SuccinctlyExamples**\
    \ database and the target to the **ProductionDb** database. Now click **Compare**\
    \ in the upper-left corner, and Visual Studio will visually show you the differences.\
    \ You can now, again, update the target automatically or generate a SQL script\
    \ and run it manually. You can also pick objects to exclude from the generated\
    \ script in the Action column. So now, simply update the ProductionDb any way\
    \ you want.\n\nWe can also compare a project to a database, which is basically\
    \ an alternative to Deploy (except it won't recognize renames). It works exactly\
    \ the same as a compare between databases, except that your source is now a database\
    \ project. Things interesting when you put the database as your source and the\
    \ project as your target (you can easily switch them with)\n"
