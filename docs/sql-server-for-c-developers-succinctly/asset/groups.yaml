  - '[PAGE 71]


    The MERGE JOIN is the fastest join around. It only works when two sets of data
    are ordered in the same way, and when two rows have to match on a key. In this
    case, both tables are ordered on BusinessEntityID. MERGE JOIN reads a row from
    one input and compares it with a row from the other. If the rows don''t match,
    the row with the smaller value can be discarded and the next row is until all
    rows have been read. The maximum number of reads necessary for this operation
    is the number of rows in the first input, plus the number of rows in the second
    input.


    The alternatives are LOOP JOIN and HASH JOIN. LOOP JOIN loops through all rows
    of the second input until a match is found. This is less efficient than a MERGE
    JOIN, as the maximum number of reads is now the number of rows in input one the
    number of rows in input two.


    The HASH JOIN can require the most processing before the scenes, and if you encounter
    it, you probably should check your design. The HASH JOIN algorithm creates a hash
    table for the smaller of the input (and possibly writes to this disk if on memory),
    and then compares it to the other values using a hash function. Small inputs can
    be very efficient, but if you have bigger inputs, this might slow down your query
    considerably.


    As we can see, this query is optimal: we have the optimal search algorithm and
    the JOIN algorithm. The next query is from optimal, and since the data is relatively
    small, even though it''s not giving us any troubles, we''re going to optimize
    it for the sake of practice.


    # Code List 65: A query with a suboptimal plan


    ```

    SELECT FirstName, MiddleName, LastName, Title

    FROM Person.Person

    WHERE MiddleName > ''Z''

    OPTION (RECOMPILE)

    ```


    I have added the OPTION (RECOMPILE) so that we''re sure SQL Server always generates
    a new plan for this query (so we''re not looking at cached plans). Here is the
    generated plan.


    ![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_71_0.png)


    # Figure 25: A suboptimal query plan


    We see here that we''re doing an Index Scan, but when we execute the query, we
    only get one result. So we''re scanning the entire table (almost 20,000 rows)
    for just one row. Also notice the Key Lookup. This happens when an index is used
    that does not have all the requested values. In this case, the Index Scan is done
    on IX_Person_LastName_FirstName_MiddleName, but we''re requesting fields just
    than those three because we also want Title. The Key'
  - '[PAGE 72]


    Lookup searches for the row index and retrieves all missing fields. Of course,
    SQL Server needs to join the results of the Index Scan and the Key Lookup, which
    costs even more time and resources.


    > Tip: The problem with slowly executing queries is that sometimes they run very
    slowly (like maybe an hour or more). In these cases,"Include Execution Plan" is
    not an option, as it requires you to run the query, but you can''t wait for hours
    to finish, taking up resources and possibly blocking other queries. For such cases,
    SQL Server has an option in the context menu, "Display Execution Plan." This option
    does not run the query and only creates the estimated plan. It may not give you
    the actual plan, but more often than not it''s pretty accurate, and you can at
    least inspect the plan and identify possible bottlenecks.


    # Indexing


    So we have an index that uses index, but still needs to look up the row in the
    primary key index. That happens when an index is not covering. When all requested
    fields from a table are contained in a single index, this is called a covering
    index. In this case, Title is missing from the index. So let''s add Title to the
    index. We can do two things: add Title to the actual index, or include it in the
    index.


    To the difference, we must understand that an index is a virtual sorting of one
    or more fields. IX_Person_LastName_FirstName_MiddleName is sorted by LastName,
    then FirstName and MiddleName. That SQL Server can use the Binary Search algorithm
    to quickly find all rows with a specific LastName, for all people with that LastName
    and FirstName. Finally, for people with LastName and FirstName, it can find all
    people with a specific MiddleName.


    If we added Title to the index, we could find people with a specific name and
    specific Title as well. Unfortunately, indexing comes with price. Every time one
    of the fields is updated, the index must be updated as well. Adding Title to the
    index means the index must be updated when any LastName, FirstName, MiddleName,
    or Title is updated. So inserts, updates, and deletes on this table will take
    the performance hit. We''re probably never going to query for such a name with
    a specific title, so we''d rather not do that.


    Likely we have a second choice: include Title as an included field. It''s not
    included in the sorting, but meaning whenever Title is updated, the index doesn''t
    have to update. The only cost we have is that there is some extra memory usage,
    a fair price to pay if it speeds up our query. To include a field in an index,
    find the index in the Object Explorer, right-click, choose Properties, and add
    the field to the Included columns tab (NOT the "Index keys" tab). Now let''s execute
    the query again.


    Changing the index worked, since our plan no longer requires a Lookup.'
