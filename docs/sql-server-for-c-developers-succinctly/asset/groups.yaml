    \ here is parameterization. Don't worry, everything is parameterized just fine.\
    \ It's just that in the previous example there are no parameters. We query for\
    \ the people with a GenderId of 2. The value 2 is a constant, so our query won't\
    \ have any parameters. If, somewhere in the code, we query for a GenderId of 1,\
    \ we'll get a new query with a new plan. So suppose we want to parameterize this\
    \ query. What would we need to do? Easy—create a!\n\n> Code List 33: A parameterized\
    \ query\n\n```\nusing (var context = new SuccinctlyExamplesEntities())\n{\n//\
    \ Not parameterized.\ncontext.People.Where(p => p.GenderId == 2).ToList();\n\n\
    int female = 2;\n// New, re-used query.\n// Doesn't re-use the previous plan.\n\
    context.People.Where(p => p.GenderId == female).ToList();\n\nint male = 1;\n//\
    \ Parameterized, use same query as above.\ncontext.People.Where(p => p.GenderId\
    \ == male).ToList();\n}\n```\n\nOf there are a few downsides to IQueryable as\
    \ well. You have no influence on what queries are generated. Some queries are\
    \ monstrous that it really pays off to just write them yourself, and this is where\
    \ SQL knowledge really comes in handy. Sometimes EF can't generate clean SQL queries\
    \ from your IQueryable, for example, joining two completely unrelated tables.\
    \ EF will generate a query and get you what you want, but it won't be fast or\
