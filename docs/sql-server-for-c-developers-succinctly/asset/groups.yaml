    The really interesting values here are the Estimated Number of Rows and the Actual
    Number of Rows. When SQL Server expects no rows to be returned, the estimated
    number will be 1, and SQL Server will optimize for that. However, the actual number
    of rows returned was 31,465. That''s a huge difference, and it''s indicative that
    you''re probably missing an index, your statistics are out-of-sync, or you''ve
    become victim of parameter sniffing.


    Parameter sniffing is not a bad thing, but it has its quirks. There are a few
    ways to solve parameter sniffing. First, when you''re sure each plan will be different,
    you can recompile your queries. Recompilation makes that a new plan is created
    every time the query is executed. You will get an optimal plan for order dates
    2010, 2012, and 2015, but every execution will incur a performance hit for the
    addition plan creation. You can recompile single queries or entire procedures.'
  - "[PAGE 78]\n\n# Code Listing 70: Recompiling queries and procedures\n\n```\nALTER\
    \ PROCEDURE GetOrdersByDate\n@OrderDate DATETIME\nAS\nBEGIN\n    SET NOCOUNT ON;\n\
    \n    SELECT *\n    FROM SalesOrderHeader\n    WHERE OrderDate < @OrderDate\n\
    \    OPTION (RECOMPILE)\nEND\n-- OR\nALTER PROCEDURE GetOrdersByDate\n@OrderDate\
    \ DATETIME\nWITH RECOMPILE\nAS\nBEGIN\n    SET NOCOUNT ON;\n\n    SELECT *\n \
    \   FROM SalesOrderHeader\n    WHERE OrderDate < @OrderDate\nEND\n```\n\nAnother\
    \ option is to tell SQL Server to optimize for a specific value. In this case,\
    \ we're sure this procedure will be called with an order date that's pretty close\
    \ to today, so 99 out of 100 times we expect to fetch thousands of rows.\n\n#\
    \ Code Listing 71: Optimize for value\n\n```\nALTER PROCEDURE GetOrdersByDate\n\
    @OrderDate DATETIME\nAS\nBEGIN\n    SET NOCOUNT ON;\n\n    SELECT *\n    FROM\
    \ SalesOrderHeader\n    WHERE OrderDate < @OrderDate\n    OPTION (OPTIMIZE FOR\
    \ (@OrderDate = '20150101'))\nEND\n```\n\nOrder date 2010 will have a suboptimal\
    \ query, but 2012 and 2015 run fine and don't incur the performance penalty for\
    \ creating the plan. In case you're not sure about an ideal value, you may optimize\
    \ for unknown. SQL Server will generate a plan based on some statistical average\
    \ of your data distribution. The downside, of course, is that this optimization\
    \ is unpredictable and may still result in parameter sniffing issues."
  - "[PAGE 79]\n\n# Code List 72: Optimize for unknown\n\n```\nOPTION (OPTIMIZE FOR\
    \ UNKNOWN)\n```\n\nIn cases, SQL Server may make a wrong call considering the\
    \ index to use. Or maybe it's not wrong, just not like I it to. A while ago I\
    \ found myself in such a situation. A coworker had created a lengthy stored procedure\
    \ and the execution wasn't all that it was supposed to be. Sure enough, we were\
    \ missing an index. We added the index and cleared the query cache, but nothing\
    \ happened. A quick look at the execution plan revealed that SQL Server wasn't\
    \ using our index. In this instance, we wanted it to use our index.\n\n# Code\
    \ List 73: Forcing an index\n\n```\nALTER PROCEDURE [dbo].[GetOrdersByDate] @OrderDate\
    \ DATETIME\nAS\nBEGIN\n    SET NOCOUNT ON;\n\n    SELECT *\n    FROM Sales.SalesOrderHeader\n\
    \    WITH (INDEX(IX_SalesOrderHeader_CustomerID))\n    WHERE OrderDate < @OrderDate\n\
    END\n```\n\nSurely that index makes no sense! The fun part is if you run now and\
    \ look at the query, SQL Server will give you a hint that an index on OrderDate\
    \ (with all other fields included, which we don't).\n\nAnother option is to make\
    \ a local variable from your input parameter. The idea is that SQL Server optimizes\
    \ queries for a given value: the one that is passed to the stored procedure. However,\
    \ when you use a local variable, SQL Server cannot know the value of that variable\
    \ in the query plan stage. As a result, a local variable will create the same\
    \ output as OPTION (OPTIMIZE FOR UNKNOWN).\n\n# Code List 74: Using a local variable\n\
    \n```\nALTER PROCEDURE [dbo].[GetOrdersByDate] @OrderDate DATETIME\nAS\nBEGIN\n\
    \    SET NOCOUNT ON;\n\n    DECLARE @LocalOrderDate DATETIME = @OrderDate\n\n\
    \    SELECT *\n    FROM Sales.SalesOrderHeader\n    WHERE OrderDate < @LocalOrderDate\n\
    END\n```"
- md: "\nAs you can see, there are some solutions to parameter sniffing when working\
    \ in SQL Server. You can apply the same methods in C# when working with ADO.NET.\
    \ You're building the query, so you can also include hints like OPTION (RECOMPILE),\
    \ OPTION (OPTIMIZE FOR ...), or WITH (INDEX(...)). Unfortunately, when using Entity\
    \ Framework, you're not building your own queries. But you have a few options.\
    \ You can use stored procedures for troublesome queries (in fact, some people\
    \ always use stored procedures for everything, but that's another discussion).\
    \ You can also use plain ADO.NET for troublesome queries. If you're stuck with\
    \ EF, you can use EF Interceptors (EF6 and onwards only), as discussed in the\
    \ next chapter.\n\n## Chapter 7 Interception, Locking, Dynamic Management Views\n\
    \nIn this chapter we will look at three relatively advanced topics: customizing\
    \ default behaviors by intercepting SQL execution from C# code, the issues around\
    \ SQL locking, and performance tuning using Dynamic Management Views.\n\n## Interception\n\
    \nSQL interception using C# is not easy, and is probably best avoided. It gives\
    \ you some low-level control over the generated SQL and additional actions EF\
    \ should take when it's executing, or has executed, queries. Interception is around\
    \ a couple of interfaces, most notably System.Data.Entity.Interception.IDbInterceptor.\n\
    \nThere are different interceptors for use cases, such as executing queries (DbInterceptor),\
    \ working with transactions (DBTransactionInterceptor), and connections (DBConnectionInterceptor).\
    \ For our case, we need the IDbInterceptor, we derive from the base class DBCommandInterceptor\
    \ (which implements DBCommandInterceptor).\n\nAs you can see, each method (SomeExecuting\
    \ or SomethingExecuted) gets a DbCommand, which can be manipulated, and a DbCommandInterceptionContext.\
    \ Now we can simply concatenate \" OPTION (RECOMPILE) \" to ANY SELECT query.\n\
    \n> Code Listing 75: RecompileInterceptor\n\n```\npublic class RecompileInterceptor\
    \ : DbCommandInterceptor\n{\n    public override void ReaderExecuting(DbCommand\
    \ command, DbCommandInterceptionContext<DbDataReader> interceptionContext)\n \
    \   {\n        base.ReaderExecuting(command, interceptionContext);\n        AddOptionRecompile(command,\
    \ interceptionContext);\n    }\n\n    public override void NonQueryExecuting(DbCommand\
    \ command, DbCommandInterceptionContext<int> interceptionContext)\n    {\n   \
    \     base.NonQueryExecuting(command, interceptionContext);\n        AddOptionRecompile(command,\
    \ interceptionContext);\n    }\n\n    public override void ScalarExecuting(DbCommand\
    \ command, DbCommandInterceptionContext<object> interceptionContext)\n    {\n\
    \        base.ScalarExecuting(command, interceptionContext);\n        AddOptionRecompile(command,\
    \ interceptionContext);\n    }\n}\n```\n\n```\nprivate void AddOptionRecompile<T>(DbCommand\
    \ command,\nDbCommandInterceptionContext<T> interceptionContext)\n{\n    // DbContexts.Any\
    \ indicates the query is not EF overhead.\n    if (interceptionContext.DbContexts.Any()\
    \ &&\n        command.CommandText.StartsWith(\"SELECT\",\nStringComparison.OrdinalIgnoreCase))\n\
    \    {\n        command.CommandText += \" OPTION (RECOMPILE)\";\n    }\n}\n```\n\
    \nTo use an DbInterceptor, we can use the DbInterceptor class. Unfortunately,\
    \ once registered, an interceptor will be used for every query in your application\
    \ (including other threads). You can, of course, unregister them.\n\nCode Line\
    \ 76: Add an interceptor\n\n```\nRecompileInterceptor interceptor = new RecompileInterceptor();\n\
    DbInterceptor.Add(interceptor);\nusing (DbContext context = new CodeFirstContext())\n\
    {\n    context.Database.Log = Console.Write;\n    context.People.Where(p => p.Gender\
    \ == 1).ToList();\n}\nDbInterceptor.Remove(interceptor);\nConsole.ReadKey();\n\
    ```\n\nInterceptors are powerful tools. They can be used for logging, additional\
    \ security, canceling queries, or altering other things.\n\n## Locking and deadlocks\n\
    \nAnother issue you might be facing when queries are running slowly. I've been\
    \ in situations where queries such as SELECT Field From Table WHERE Id = X were\
    \ running slowly. We know that such queries should be very fast, that parameter\
    \ sniffing shouldn't be a problem since the plan should be the same for every\
    \ value of X. Chances are this query is simply not running because some other\
    \ query is blocking access to the specified table. We can easily simulate such\
    \ scenarios. First of all, I want to remind you that it's possible to run only\
    \ parts of a script in a single query window. Let's simulate such scenarios. First\
