    ## Free? What is the catch?


    There is no catch here. Syncfusion has a vested interest in this effort.


    As a component vendor, our unique claim has always been that we offer deeper and
    broader frameworks than anyone else on the market. Developer education greatly
    helps us market and sell against competing vendors who promise to ‘enable AJAX
    support with one click,” or ‘turn the moon to cheese!’


    ## Let us know what you think


    If you have any topics of interest, thoughts, or feedback, please feel free to
    send them to us at succinctly-series@syncfusion.com.


    We sincerely hope you enjoy reading this book and that it helps you better understand
    the topic of study. Thank you for reading.


    Please follow us on Twitter and “Like” us on Facebook to help us spread the word
    about the Succinctly series!


    ![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_6_0.png)


    ![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_6_1.png)


    ## About the Author


    Sander Rossel is a professional developer with working experience in .NET (VB
    and C#), WinForms, MVC, WebAPI, Entity Framework), JavaScript, Git, Jenkins, Oracle,
    and SQL Server.


    He has an interest in various technologies including, but not limited to, functional
    programming, NoSQL, Continuous Integration (and more generally, Software Quality),
    and software design.


    He''s written another e-book in the Succinctly series that you can download for
    free: Object-Oriented Programming in C# Succinctly.


    He seeks to educate others on his blog, Sander''s bits - Writing the code you
    need, on his CodeProject profile, and through his continuing book-writing.


    ## Introduction


    When writing many applications, you will almost certainly need some kind of database.
    And when you use a database, you''re going to have work with it. Whether you have
    database administrators (DBAs) or develop both the database and the application,
    a little database knowledge always comes handy.


    This book is for everyone who develops C# applications with a SQL Server database.
    In this book, we''re going to connect to a database using ADO.NET, and using the
    Entity Framework, we''re going to look at different methods to develop your database.
    We''ll see common pitfalls, why your database is running slow, and how we can
    troubleshoot issues, and how we can test and deploy our SQL Server database. The
    first half of the book has a focus on C# and development. The second half of the
    book has a focus on troubleshooting using the SQL Server tools.


    C# and SQL (the query language) knowledge is assumed.


    ## Tools


    In this book we''ll make use of Visual Studio 2015 Community Edition and SQL Server
    2014 Express on a Windows machine (I''m using Windows 8.1 Pro and Windows 10).
    You will need a Microsoft account to download these files. When prompted for a
    specific SQL Server version, pick SQL Server Express with Tools (or SQL Server
    Express with Advanced Services, if you want to play around with Reporting Services
    and Full Text Search, which aren''t a part of this book).


    The provided links take you to the product website and will probably let you download
    the newest version of the respective tool. You may download the newest version
    at your own risk (the examples in this book probably still apply), or you may
    search for the version I have used throughout this book. Most of the examples
    also apply to older versions of the tools, so if you already installed something,
    just continue and see if it works.


    Installation is pretty straightforward. When installing Visual Studio, make sure
    you select the SQL Server Data Tools check box, and when installing SQL Server,
    make sure you select Management Tools - Complete. When prompted for an instance
    name in the SQL Server installer, pick any name you like, or choose Default instance
    (my instance is called SQLEXPRESS). Other than that, you can leave on all the
    defaults, accept the license terms, and just click Next, Next, Next.


    ## Chapter 1 SQL Server Management Studio


    If you followed the steps in the introduction, you now have a clean installation
    of both Visual Studio and SQL Server. So let''s open up SQL Server Management
    Studio (SSMS for short). Log in to your default instance, which is localhost\your
    instance (default name is MSSQLEXPRESS) with Windows Authentication if you followed
    the defaults. You should now see the following window:


    ![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_9_0.png)


    Figure 1: Microsoft SQL Server Management Studio


    I have always found SSMS very intuitive to use. To execute any script, simply
    click New Query in the toolbar. Make sure you select the correct database (if
    applicable) in the upper-left corner (or put USE [database_name]). Now let''s
    create a database to use in future examples. In the Object Explorer, open up the
    Databases node. It''s probably empty, so right-click on the Databases node and
    click New database. Pick a name (for which we''ll use SuccinctlyExamples), leave
    all the defaults, and click OK. Now that you have a database, you can open that
    node and view all tables, views, and stored procedures.


    So let''s create a table. Right-click the Tables node and click Table. Now create
    the table in the following figure. Make sure to set the Id column as Primary Key
    and make it auto-increment (which is what the Identity Specification property
    does).


    | Column Name | Data Type | Allow Nulls |

    | --- | --- | --- |

    | Id | int | |

    | FirstName | varchar(256) | x |

    | LastName | varchar(256) | x |

    | DateOfBirth | datetime | |

    | GenderId | int | |


    | Column Name | Data Type | Allow Nulls |

    | --- | --- | --- |

    | Id | int | |

    | Code | varchar(16) | |

    | Description | varchar(64) | |


    Figure 2: Person table


    When saving, name the table Person.


    Now we go back to your Person table. If you''ve closed the tab, you can right-click
    the table and click Design. Right-click-anywhere, and then click Relationships.
    Add a new one, click Tables and Columns Specification, and make sure it follows
    as follows:


    | Column Name | Data Type | Allow Nulls |

    | --- | --- | --- |

    | Id | int | |

    | FirstName | varchar(256) | x |

    | LastName | varchar(256) | x |

    | DateOfBirth | datetime | |

    | GenderId | int | |


    | Tables and Columns | ? |

    | --- | --- |

    | Relationship name: | |

    | FK_Person_Gender | |

    | Primary key table: | Foreign key table: |

    | Gender | Person |

    | Id | |


    Figure 4: A foreign key relationship


    | Column Name | Data Type | Allow Nulls |

    | --- | --- | --- |

    | Id | int | |

    | Code | varchar(16) | |

    | Description | varchar(64) | |


    Figure 3: Gender table


    When saving this table, name it Gender.


