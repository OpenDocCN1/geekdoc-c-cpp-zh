    # Query plans


    Now that you know how to get the queries that may cause trouble, you want to find
    out why exactly they cause trouble. The most obvious way to do this is by looking
    at the query plan. Before a query is executed, SQL Server estimates the quickest
    way to fetch all the data. For example a JOIN can be realized internally by a
    LOOP, MERGE, or HASH JOIN. Take two JOINS in a single query and we have 3-9 ways
    to execute this query. A WHERE clause, and things grows exponentially. A single
    query can have hundreds or thousands of different plans. SQL Server takes an educated
    guess as what plan might be optimized. We''ve already talked about this a bit
    in the parameterization chapter, but now we''re going to look at actual plans.


    Unfortunately, Synchronization doesn''t have a Succinct ebook on query plans (yet?),
    but you could always check out this free e book on query plans by SimpleTalk.


    For now, open SSMS, browse to the AdventureWorks database, and open a new query
    window. Right-click on the empty query window, and in the context menu, check
    Include Actual'
