  - "[PAGE 57]\n\n# Seeds\n\nAnother thing that makes CodeFirst pretty noticed is\
    \ the ability to seed your database with some initial data. You may have already\
    \ noticed it when we created the Configuration class, but there is a Seed method\
    \ with some example in the code. Let's make sure that we have least our Genders\
    \ in place and a Person to use for testing.\n\nCode Listing 58: The Seed method\n\
    \n```\nprotected override void Seed(CodeFirstContext context)\n{\n    context.Genders.AddOrUpdate(new[]\n\
    \    {\n        new Gender { Id = 0, Code = \"UNKNOWN\", Description = \"Not saying\"\
    \n        new Gender { Id = 1, Code = \"MALE\", Description = \"Male\" },\n  \
    \      new Gender { Id = 2, Code = \"FEMALE\", Description = \"Female\" }\n  \
    \  });\n    context.Person.AddOrUpdate(p =>\n    {\n        FirstName = p.FirstName,\n\
    \        LastName = p.LastName\n    },\n    new Person\n    {\n        FirstName\
    \ = \"Sander\",\n        LastName = \"Rossel\",\n        GenderId = 1\n    });\n\
    }\n```\n\nWe can simply insert our three Genders. EF will check if the ID is already\
    \ present in the database and do insert or update based on that. The Id of Gender\
    \ is not an autounumbering field, so we have to set it itself. The Id of a Person\
    \ is not known to us, since it's an autounumbering. With autounumbering, there\
    \ is no way for us to insert a Person with a specific Id, and EF will just insert\
    \ the same Person every time (giving it some autounumber Id). We can however,\
    \ specify an alternative means of looking up a specific entity. This is the first\
    \ method to AddOrUpdate which takes an anonymous object containing all the fields\
    \ that make up a unique Person. In this example, I've taken the combination of\
    \ FirstName and LastName not present in the database, EF will insert the Person,\
    \ otherwise it will do an update. If you run the code, these rows will be inserted\
    \ into the database if they're not already present.\n\nIf you would like to start\
    \ with a fresh database (including an initial test set) every time you start your\
    \ debug session, you may opt for a custom DatabaseInitializer. I already mentioned\
    \ a few, so let's create one. The following initializer will always recreate a\
    \ database and seed some data."
  - "[PAGE 58]\n\n# Code Listing 59: A custom DatabaseInitializer\n\n```\npublic class\
    \ CleanDbInitializer :\n    DropCreateDatabaseAlways<CodeFirstContext>\n{\n  \
    \  protected override void Seed(CodeFirstContext context)\n    {\n        context.Genders.AddOrUpdate(new{\n\
    \            new Gender { Id = 0, Code = \"UNKNOWN\", Description = \"Not saying\"\
    \ },\n            new Gender { Id = 1, Code = \"MALE\", Description = \"Male\"\
    \ },\n            new Gender { Id = 2, Code = \"FEMALE\", Description = \"Female\"\
    \ }\n        });\n        context.People.AddOrUpdate(p =>\n        {\n       \
    \     FirstName = p.FirstName,\n            LastName = p.LastName\n        },\n\
    \        new Person\n        {\n            FirstName = \"Sander\",\n        \
    \    LastName = \"Rossel\",\n            GenderId = 1\n        });\n    }\n}\n\
    ```\n\nTo get it working, simply go to your DbContext and change the constructor.\
    \ Make sure you don't have any migrations (delete the Migrations folder), or your\
    \ database won't actually get deleted, and you will get an exception.\n\n# Code\
    \ Listing 60: Usage of CleanDbInitializer\n\n```\npublic CodeFirstContext()\n\
    \    : base(\"CodeFirst\")\n{\n    Database.SetInitializer(new CleanDbInitializer());\n\
    }\n```\n\nIt is also possible to change the initialization using your App.config\
    \ or Web.config file. Simply remove the SetInitializer from your DbContext constructor\
    \ and add the following value in your config file."
  - "[PAGE 59]\n\n# Code Listing 61: MigrateDatabaseToLatestVersion with Configuration\
    \ in config\n\n```\n<contexts>\n  <context type=\"CodeFirst.CodeFirstContext,\
    \ CodeFirst\">\n    <databaseInitializer\n      type=\"System.Data.Entity.MigrateDatabaseToLatestVersion`\
    \ 2[[CodeFirst.DbContext, CodeFirst],\n      [CodeFirst.Migrations.Configuration,\
    \ CodeFirst]], EntityFramework\"//>\n  </context>\n</contexts>\n```\n\nNow we're\
    \ switching to our custom initializer.\n\n# Code Listing 70: Custom initializer\
    \ in config\n\nAs you can see, by using Code First, Migrations, and Seeds, working\
    \ with multiple local database instances while still making daily database updates\
    \ becomes a breeze."
