    \ 设置为 `true`。\n\n代码列表 49：启用自动迁移\n\n```csharp\nAutomaticMigrationsEnabled = true;\n\
    ```\n\n接下来我们需要做的是在 `DbContext` 中进行此配置。我们可以在构造函数中设置它。\n\n代码列表 50：为迁移配置 DbContext\n\
