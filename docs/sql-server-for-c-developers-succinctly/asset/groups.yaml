    \n# 更新\n\n现在我们已经部署了数据库，我们将收到更改请求。让我们给 **Person** 表添加一列。在 Visual Studio 解决方案管理器中双击\
    \ **Person.sql** 脚本。你可以在表设计器的空白区域右键点击，以添加或删除设计器列，如 Length、Description 和 Identity。现在添加一列，假设命名为\
