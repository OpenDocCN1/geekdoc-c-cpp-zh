    \ advantage of storing various settings in a configuration file is that you can\
    \ change the behavior of your application without actually changing and redeploying\
    \ your application, allowing different settings in multiple environments. Storing\
    \ connection strings in configuration files is so common that I added the SuccinctlyDB\
    \ connection string to my app.config file.\n\nCode Listing 5: connectionStrings\
    \ in config file\n\n```\n<xml version=\"1.0\" encoding=\"utf-8\" ?>\n<configuration>\n\
    \  <connectionStrings>\n    <add name=\"SuccinctlyDB\" connectionString=\"Server=LAPTOP23\\\
    SQLEXPRESS;Database=SuccinctlyExamples; Integrated Security=SPI\" />\n  </connectionStrings>\n\
    \  <startup>\n    <supportedRuntime version=\"v4.0\" sku=\".NETFramework,Version=v4.6\"\
    \ />\n  </startup>\n</configuration>\n```\n\nWe can now easily retrieve the connection\
    \ string from the config file. We will need to add a project reference to System.Configuration.\
