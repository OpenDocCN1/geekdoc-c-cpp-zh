    \         firstName = (string)param.Value;\n        }\n        return firstName;\n\
    \    }\n}\n```\n\n## Data sets\n\nRetrieving data and manually mapping to your\
    \ own C# classes is quite a bit of tedious work. An easier method of getting the\
    \ data from your database directly into memory is using the\nSqlDataAdapter. The\
    \ SqlDataAdapter is pretty obsolete technology, but I want to\nbriefly discuss\
    \ it for completeness, and you might still find it uses. It's also a\nlittle introduction\
    \ to the next chapter, Entity Framework.\n\nThe SqlDataAdapter maps the data in\
    \ your database to a DataSet or DataTable. A\nDataTable is your database table\
    \ in C# memory. A DataSet is a collection of DataTables\nwith references, constraints,\
    \ etc. What's awesome is that CREATE, UPDATE, and DELETE\nstatements can be generated\
    \ automatically. Using DataTables, you can also pass table\nparameters to SQL\
    \ Server.\n\nTo populate a DataTable with people from the database, we simply\
    \ call the Fill method\nthe SqlDataAdapter and give it a DataTable.\n\n## Code\
    \ Listing 24: Populating a DataTable\n\n```csharp\npublic DataTable GetPeople()\n\
    {\n    DataTable people = new DataTable();\n    string connectionString =\n\n\
    \    ConfigurationManager.ConnectionStrings[\"SuccinctlyDB\"].ConnectionString;\n\
    \    using (SqlConnection connection = new SqlConnection(connectionString))\n\
    \    using (SqlCommand command = new SqlCommand(\n        \"SELECT ID, FirstName,\
    \ LastName, DateOfBirth, GenderId FROM\n        dbo.Person\", connection))\n \
    \   using (SqlDataAdapter adapter = new SqlDataAdapter(command))\n    {\n    \
    \    adapter.Fill(people);\n    }\n    return people;\n}\n```\n\nThe SqlDataAdapter\
    \ takes a SqlCommand in its constructor. The SqlCommand is the command that's\
    \ used to select the data. There are a few overloads, taking the SELECT statement\
    \ and a connection string. The adapter manages the connection, so there is no\
    \ need to open and close explicitly.\n\nNow this looks wonderful. The code is\
    \ a shorter than what we had previously, but how can we read the data from a DataTable?\
    \ Unfortunately, the DataTable is a collection of rows, in it is a collection\
    \ of columns. To read everything, we have to loop through the rows and then loop\
    \ through the columns. The columns can be accessed by index or name. The values\
    \ are all objects—so there is still boxing, and we still need to cast—and even\
    \ DBNull is still DBNull. Basically, mapping to C# objects is just as hard as\
    \ the SqlDataReader.\n\nThe strength of Datasets becomes apparent when you use\
    \ them directly in your code. This makes sense, for example, in WinForms environments\
    \ with binding. You can update your DataSet directly and the DataSet keeps track\
    \ of changes.\n\n## Code Listing 25: Insert, update and delete with the\n\n```csharp\n\
    public void UpdatePeople()\n{\n    DataTable people = new DataTable();\n    string\
