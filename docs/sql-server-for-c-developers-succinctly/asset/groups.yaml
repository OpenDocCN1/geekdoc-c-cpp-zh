    \ `LastLoginTime` 列，并将 `GenderId` 改为非空。\n\n| 列名 | 数据类型 | 允许 NULL |\n| --- | ---\
    \ | --- |\n| Id | int | |\n| FirstName | varchar(256) | |\n| LastName | varchar(256)\
