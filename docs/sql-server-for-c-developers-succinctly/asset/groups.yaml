  mdcn: "\n如你所见，在 SQL Server 中工作时，参数嗅探（parameter sniffing）有一些解决方案。在 C# 中使用 ADO.NET\
    \ 时也可以应用相同的方法。由于你正在构建查询，因此也可以包含如 `OPTION (RECOMPILE)`、`OPTION (OPTIMIZE FOR ...)`\
    \ 或 `WITH (INDEX(...))` 等提示信息。遗憾的是，在使用 Entity Framework (EF) 时，你并没有构建自己的查询。但你有几个选择：对于棘手的查询，可以使用存储过程（事实上，有些人对所有内容都使用存储过程，但那是另一个话题）。你也可以对棘手的查询使用原生\
    \ ADO.NET。如果你受限于 EF，可以使用 EF 拦截器（EF Interceptors，仅限 EF6 及更高版本），正如下一节所讨论。\n\n##\
    \ 第 7 章 拦截、锁定、动态管理视图\n\n在本章中我们将介绍三个相对高级的话题：通过从 C# 代码中拦截 SQL 执行来自定义默认行为、SQL 锁定问题以及使用动态管理视图（Dynamic\
    \ Management Views）进行性能调优。\n\n## 拦截\n\n使用 C# 进行 SQL 拦截并不容易，可能最好避免。它让你让你对生成的 SQL\
    \ 获得一些低级控制，并在 EF 执行或已执行查询时应采取的额外操作。拦截围绕几个接口展开，最著名的是 `System.Data.Entity.Interception.IDbInterceptor`。\n\
    \n不同的用例有不同的拦截器，例如执行查询（DbInterceptor）、处理事务（DBTransactionInterceptor）和连接（DBConnectionInterceptor）。对于我们的情况，我们需要\
    \ `IDbInterceptor`，我们从中派生自基类 `DBCommandInterceptor`（它实现了 `DBCommandInterceptor`）。\n\
    \n如你所见，每个方法（`SomeExecuting` 或 `SomethingExecuted`）都会获取一个可以操作的 `DbCommand` 以及一个\
    \ `DbCommandInterceptionContext`。现在我们可以简单地向任何 `SELECT` 查询拼接 `\" OPTION (RECOMPILE)\
    \ \"`。\n\n> 代码列表 75：RecompileInterceptor\n\n```sharp\npublic class RecompileInterceptor\
    \ : DbCommandInterceptor\n{\n    public override void ReaderExecuting(DbCommand\
    \ command, DbCommandInterceptionContext<DbDataReader> interceptionContext)\n \
    \   {\n        base.ReaderExecuting(command, interceptionContext);\n        AddOptionRecompile(command,\
    \ interceptionContext);\n    }\n\n    public override void NonQueryExecuting(DbCommand\
    \ command, DbCommandInterceptionContext<int> interceptionContext)\n    {\n   \
    \     base.NonQueryExecuting(command, interceptionContext);\n        AddOptionRecompile(command,\
    \ interceptionContext);\n    }\n\n    public override void ScalarExecuting(DbCommand\
    \ command, DbCommandInterceptionContext<object> interceptionContext)\n    {\n\
    \        base.ScalarExecuting(command, interceptionContext);\n        AddOptionRecompile(command,\
    \ interceptionContext);\n    }\n}\n```\n\n```csharp\nprivate void AddOptionRecompile<T>(DbCommand\
    \ command,\nDbCommandInterceptionContext<T> interceptionContext)\n{\n    // DbContexts.Any\
    \ 表示查询不是 EF 的开销。\n    if (interceptionContext.DbContexts.Any() &&\n        command.CommandText.StartsWith(\"\
    SELECT\",\nStringComparison.OrdinalIgnoreCase))\n    {\n        command.CommandText\
    \ += \" OPTION (RECOMPILE)\";\n    }\n}\n```\n\n要使用 `DbInterceptor`，我们可以使用 `DbInterceptor`\
    \ 类。遗憾的是，一旦注册，拦截器将用于应用程序中的每个查询（包括其他线程）。当然，你可以注销它们。\n\n代码行 76：添加拦截器\n\n```csharp\n\
    RecompileInterceptor interceptor = new RecompileInterceptor();\nDbInterceptor.Add(interceptor);\n\
    using (DbContext context = new CodeFirstContext())\n{\n    context.Database.Log\
    \ = Console.Write;\n    context.People.Where(p => p.Gender == 1).ToList();\n}\n\
    DbInterceptor.Remove(interceptor);\nConsole.ReadKey();\n```\n\n拦截器是强大的工具。它们可以用于日志记录、额外的安全性、取消查询或更改其他内容。\n\
    \n## 锁定与死锁\n\n另一个你在查询运行缓慢时可能面临的问题是。我曾遇到过诸如 `SELECT Field From Table WHERE Id =\
    \ X` 这样的查询运行缓慢的情况。我们知道此类查询应该非常快，参数嗅探不应该是一个问题，因为对于 X 的每个值，执行计划应该是相同的。很可能是此查询之所以没有运行，是因为某个其他查询阻塞了对指定表的访问。我们可以轻松地模拟此类场景。首先，我想提醒你，在单个查询窗口中可以只运行脚本的部分。让我们模拟此类场景……（注：原文此段存在大量重复的句子，已按要求处理并避免重复输出）。\n\
    \n另一个你在查询运行缓慢时可能面临的问题。我曾遇到过诸如 `SELECT Field From Table WHERE Id = X` 这样的查询运行缓慢的情况。我们知道此类查询应该非常快，参数嗅探不应该是一个问题，因为对于\
