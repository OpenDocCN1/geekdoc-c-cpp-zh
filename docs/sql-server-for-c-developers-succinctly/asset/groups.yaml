    to SQL Server 2014 in the project properties. If everything went well, you should
    have a database with a single table and a single stored procedure.


    To create a unit test, right-click on the stored procedure, and in the context
    menu, choose Create Unit Tests... You now get a window where you can pick stored
    procedures to test, select a type and name for your test project, and pick a name
    for your unit test. Be sure to change the default Vb to a C# project. Call the
    project you like; I''ve called it DbTest.Tests. I''ve called my unit test GetFullName.
    In next, you can pick a connection, a secondary connection, and whether or not
    your changes should automatically be deployed before you run. Set the connection
    to your new DbTest and select Automatically deploy... Pick your DbTest as Database
    project and deploy it as Deployment


    You now get a Test Project with a SQL Server unit test and a regular unit test
    class. The SQL Server unit contains a SQL script that "database unit for dbo.GetFullName"
    at the top. It should be shown by default after you create the project. Underneath
    the script are the test conditions. You will want to delete the default Inconclusive
    condition, as it will always make your test fail. Now change the script to the
    following.'
  - '[PAGE 92]


    # Code List 89: SQL unit test


    ```

    EXEC GetFullName 1

    ```


    Add a test condition of the type Scalar Value. In the options of the condition,
    set Null expected to False and Expected value to Sander Rossel (or your own name).
    You can rename your type in the top right above your query; I renamed it FirstAndLastName.


    Now, in SSMS, add some data to your database. If you didn''t test for Sander Rossel
    in the condition, make sure the value you changed in the following script as well.


    # Code List 90: Insert test data


    ```

    INSERT INTO Person

    (FirstName, LastName)

    VALUES

    (''Sander'', ''Rossel''),

    (''Satya'', NULL)

    ```


    Now you are ready to run your test. In Visual Studio, go to the menu and select
    Test > Windows > Test Explorer, simply click Run All. Your test should now run
    and pass, if you did everything.


    Now let''s add a failing test. Go to GetFullName again, and add a test by clicking
    the green plus somewhere in the bar the query. Name your test OnlyFirstName. Again,
    remove the inclusive conclusion add a Scalar Value, and test for Satya. Change
    your script to the following.


    # Code List 91: Failing unit test


    ```

    EXEC GetFullName 2

    ```


    Now you run your tests again, and OnlyFirstName should fail. It will tell you
    that value Satya was expected, the returned value was NULL. That''s right, the
    procedure simply concatenates FirstName and LastName, and LastName is NULL, and
    by default, + NULL = NULL. We should use the CONCAT function instead. In Visual
    Studio, go to the GetFullName file and change the SELECT line with the following.


    # Code List 92: Fixed procedure


    ```

    SELECT CONCAT(FirstName, '' '' + LastName)

    ```


    Run your tests again, and this should pass both. The change is automatically published
    because that''s what we specified when we created the project. If someone changed
    this procedure back to what it was, because it has less verbose syntax, and he
    doesn''t quite get CONCAT, our test will fail again. More likely, if someone adds
    MiddleName, we''ll know soon if their change broke our cases where MiddleName
    is NULL. Likewise, they can add unit tests for MiddleName.'
- md: '

    # Deployment


    Deploying a database is often a manual task, DBAs want to keep total control of
    their database. The IT department doesn''t trust automated deployment, or is afraid
    it''s triggered at a wrong time. They''re not confident that the development team
    has their scripts in order so that an automatic database update goes exactly as
    planned, always. When the database goes awry, it''s often a costly to get everything
    running again. In short, automated updates make a lot of people nervous. Manually
    running scripts is the way to go. We have seen that (semi-) automated deployment
    is pretty easy using Entity Framework or Database Projects. When using a Database
    Project, you could go for (manual) deployment using a Data-tier application package.


    As that it is, it is possible to automate database deployment. Perhaps you''d
    like it for non-critical environments, such as a test environment. Redgate has
    a good, expensive, solution. We''ve talked about Database Projects, so I''m skipping
    that here. One last thing I''d like to discuss is the SQL Server command line
    tool, or sqlcmd. Chances you need to download it, especially when you use the
    Command Line Utilities for SQL Server in the Microsoft Download Center. With this
    tool, you can execute scripts from the command line, batch scripts, and your favorite
    CI tools. The sqlcmd tool was introduced with SQL Server 2005, when it replaced
    the functionally similar isql and osql tools.


    Once you have sqlcmd installed:


    > Code Listing 93: SELECT using sqlcmd


    ```

    sqlcmd -S [servername][instancename] -E -d AdventureWorks2014

    SELECT

    FROM Person.Person

    WHERE BusinessEntityID = 1

    GO

    ```


    On the first line, we connect to our database. Each line that makes up your query,
    which is executed after a GO command. The -S parameter is the name of your server,
    -E indicates we''re logging in with a trusted connection, and -d specifies the
    database. To use sqlcmd, you must specify exit. Note that all parameters are case
    sensitive. If you''re not on a trusted connection and you would like to use a
    username and password, you can use the following command instead.


    > Code Listing 94: sqlcmd using SQL Server login


    ```

    sqlcmd -S [servername][instancename] -U username -P password -d

    AdventureWorks2014

    ```


    When you run the sqlcmd from the command prompt, you can stretch your query over
    multiple lines and execute using GO. When you''re not in the command prompt, you
    need to use -q (query) or -Q (query and exit) and a single line query.


    # Code Listing 95: sqlcmd using a direct query command.


    ```

    sqlcmd -S [server\instance] -E -d AdventureWorks2014 -Q "SELECT * FROM Person.Person
    WHERE BusinessEntityID = 1"

    ```


    Of course, you can also specify a script file to run using -i. Create a file somewhere
    (I put it in C:\Temp), name it something (SelectPerson1.sql), and then you can
    run the following command.


    # Code Listing 96: sqlcmd using an input file


    ```

    sqlcmd -S [server\instance] -E -d AdventureWorks2014 -i C:\Temp\SelectPerson1.sql

    ```


    Now the results are a little hard to read in the command prompt. You can also
    output them to a file using -o.


    > Code Listing 97: sqlcmd using an output file


    ```

    sqlcmd -S [server\instance] -E -d AdventureWorks2014 -i C:\Temp\SelectPerson1.sql
    -o C:\Temp\result.txt

    ```


    Another option you might like to use is -b, which terminates the job if an error
    occurs. You can find all options in the sqlcmd documentation.


    Using the sqlcmd, you can automate certain SQL tasks by running them from the
    command line. I should mention that this in no way replaces the SQL Agent, which
    also runs automated SQL jobs. The thing is, you can''t run the SQL Agent from
    your CI tool, while you can run the sqlcmd utility. The sqlcmd tool still does
    not automate your deployments, but it may be useful for running scripts automatically
    before your tests start off, or after you commit new scripts to your source control
    system.


    # Conclusion


    The tools laid out in this book do not make you the best C# developer around,
    nor do they teach you how to be an awesome DBA. They give you the middle ground
    of both. I''ve seen many developers who lack even the most basic database skills.
    SQL injection still happens way too often. Software becomes slow after a year
    of production because the SQL queries are everything but optimal. Companies have
    to invest in expensive server hardware because developers put queries in loops,
    surprised by the lazy-loading ability of ORMs, or just write plain awful SQL queries.
    While this book has not helped you much in the ways of writing your queries, it
    hopefully helped in giving you a broader perspective on the database in general.
    Parameterize your queries, but be wary of parameter sniffing. Know that your one
    query that takes five minutes to run is possibly blocking the entire system. Identify
    such bottlenecks and fix, or prevent them from ever happening.

    '
  mdcn: '


    # 部署


    部署数据库通常是一项手动任务，数据库管理员（DBA）希望对自己的数据库保持完全控制。IT 部门不信任自动化部署，或者担心它会在错误的时间触发。他们不确定开发团队的脚本是否准备就绪，以确保自动数据库更新始终完全按照计划执行。当数据库出现问题时，让一切重新运行通常是高昂的。简而言之，自动化更新让许多人感到紧张。手动运行脚本才是正道。我们已经看到使用
    Entity Framework 或数据库项目（Database Projects）进行（半）自动化部署非常简单。当使用数据库项目时，你可以使用数据层应用程序包（Data-tier
    application package）进行（手动）部署。


    尽管如此，自动化数据库部署是可能的。也许你想将其用于非关键环境，例如测试环境。Redgate 有一个很好用但昂贵的解决方案。我们已经讨论过数据库项目，所以我这里就跳过它。我想讨论的最后一点是
    SQL Server 命令行工具或 `sqlcmd`。你可能需要下载它，特别是当你使用微软下载中心中的 SQL Server 命令行实用时。通过此工具，你可以从命令行、批处理以及你喜欢的
    CI 工具中执行脚本。sqlcmd 工具随 SQL Server 2005 引入，它取代了功能相似的 `isql` 和 `osql` 工具。


    一旦你安装了 sqlcmd：


    > 代码列表 93：使用 sqlcmd 执行 SELECT


    ```

    sqlcmd -S [servername][instancename] -E -d AdventureWorks2014

    SELECT

    FROM Person.Person

    WHERE BusinessEntityID = 1

    GO

    ```


    在第一行中，我们连接到数据库。构成查询的每一行都会在 `GO` 命令后执行。`-S` 参数是服务器名称，`-E` 表示我们使用受信任连接登录，`-d` 指定数据库。要使用
    `sqlcmd`，你必须指定 `exit`。注意所有参数对大小大小敏感。如果你不在受信任连接上且想使用用户名和密码，可以使用以下命令。


    > 代码列表 94：使用 SQL Server 登录的 sqlcmd


    ```

    sqlcmd -S [servername][instancename] -U username -P password -d

    AdventureWorks2014

    ```


    当你从命令提示符运行 `sqlcmd` 时，你可以将查询跨越多行并使用 `GO` 执行。当你不在命令提示符中时，你需要使用 `-q`（查询）或 `-Q`（查询并退出）以及单行查询语句。


    # 代码列表 95：使用直接查询命令的 sqlcmd


    ```

    sqlcmd -S [server\instance] -E -d AdventureWorks2014 -Q "SELECT * FROM Person.Person
    WHERE BusinessEntityID = 1"

    ```


    当然，你也可以使用 `-i` 指定要运行的脚本文件。在某处创建一个文件（我把它放在了 C:\Temp），命名为某个名称（SelectPerson1.sql），然后你就可以运行以下命令。


    # 代码列表 96：使用输入文件的 sqlcmd


    ```

    sqlcmd -S [server\instance] -E -d AdventureWorks2014 -i C:\Temp\SelectPerson1.sql

    ```


    现在结果在命令提示符中可能有点难读。你也可以使用 `-o` 将它们输出到文件中。


    > 代码列表 97：使用输出文件的 sqlcmd


    ```

    sqlcmd -S [server\instance] -E -d AdventureWorks2014 -i C:\Temp\SelectPerson1.sql
    -o C:\Temp\result.txt

    ```


    你可能喜欢的使用的另一个选项是 `-b`，它会在发生错误时终止作业。你可以在 sqlcmd 文中找到所有选项。


    使用 `sqlcmd`，你可以通过从命令行运行来自动化某些 SQL 任务。我应该提到的是，这完全不能替代 SQL Agent，后者也可以运行自动化的 SQL
    作业。问题在于，你无法从 CI 工具运行 SQL Agent，但你可以运行 `sqlcmd` 实用程序。sqlcmd 工具仍然没有自动化你的部署，但它可能对于测试开始之前或将新脚本提交到版本控制系统之后自动运行脚本有用。


    # 结


    书中介绍的工具不会让你成为最优秀的 C# 开发者，也不会教你如何成为一名出色的 DBA。它们为你提供了两者的折中方案。我见过许多缺乏基本数据库技能的开发者。SQL
    注入仍然发生得频繁。由于 SQL 查询完全不理想，软件在生产一年后会变得缓慢。公司不得不投资昂贵的服务器硬件，是因为开发者在循环中放置了查询、对 ORM 的懒加载功能感到惊讶，或者仅仅是编写了极其糟糕的
    SQL 查询。虽然这本书在编写查询方面对你帮助不大，但它可能帮助你对整个数据库有一个更宽广的视角。参数化你的查询，但要小心参数嗅探（parameter sniffing）。要清楚你一个运行五分钟的查询可能会阻塞整个系统。识别这些瓶颈并修复，或者防止它们发生。


    '
