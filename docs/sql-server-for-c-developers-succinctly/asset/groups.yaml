    \ This plan basically contains instructions for the SQL engine to get the queried\
    \ data in some way that's probably pretty fast. The creation of an execution plan\
    \ takes some time, but luckily SQL Server caches the plan and will reuse it in\
    \ the future if the query comes along. This is a double-edged sword, but I'll\
    \ get back to that. For now, we want to reuse query plans as much possible.\n\n\
    For a query \"SELECT FirstName, LastName from dbo.Person\" is straightforward.\
    \ If the same query comes along, the cached plan will be used. But what if the\
