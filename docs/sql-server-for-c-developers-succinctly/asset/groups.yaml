    ## Chapter 6 Troubleshooting


    Once in a while queries go awry. Unfortunately, there can be many reasons for
    this. Maybe your database has grown to the point where a query that always worked
    is now very slow. Maybe one of your environments is missing an index. Maybe a
    query with a cached query plan is not optimal for the current parameter value.
    In this chapter we''re going to look out how we can identify troublesome queries
    and how to solve these issues.


    For a few examples, we need a database with a little body. Microsoft has a sample
    database we can use called Adventure Works. You can download it from CodePlex.
    Alternatively, you can Google (or Bing) AdventureWorks2014 and see what shows
    up. Download the Adventure Works 2014 Full Database Backup.zip file and unzip
    the .bak file. In SSMS, right-click the Databases in your Object Explorer and
    then click Restore Database... in the Restore Database window, enable Device,
    click the button ..., and add the file you just unzipped. Then simply click OK,
    and the database should be available.


    ![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_66_0.png)


    Figure 20: Restoring Adventure Works


    ## Profiling


    First of all, we''ll need to know which queries are running slowly. For this (and
    many more) we can use the profiler. I recommend using the profiler often when
    developing, as it shows you just everything that happens in a database. For example,
    you may have a well-performing piece of code, but maybe it only performs because
    you''re testing locally with few data. The profiler may show you that you''re
    actually sending thousands of queries to your database (because of EF lazy-loading,
    or because you''re executing queries in a loop). I''ve often run into scenarios
    that run smoothly on a test environment, but bring the database to a grinding
    halt (and that''s never fear).


    To start the profiler, use SSMS, and in the menu, go to Tools and SQL Server Profiler.
    You can also run it as a stand-alone application from your start (wherever you
    have it). If you start from SSMS, it will automatically start a new trace. If
    you start it from Windows, you can find New Trace under the File menu. Next, you
    will have to log in to the instance you want to trace. Be careful when tracing
    a production environment, as it will put a load on the system. Connect to your
    local instance, and get a window called "Trace Properties". On the General tab,
    you can name your trace, save to file, or pick a template. We''re going to ignore
    this. Instead, go to the Events Selection tab. On this tab you find all kinds
    of events that are raised by the database. A few are already selected for you,
    but there are many more. Check the Show events and Show all columns boxes, and
    you will see what I mean. In the following events: Stored Procedures -> RPC:Completed
    and SP:BatchCompleted and TSQL -> SQL:BatchCompleted. Now run it to trace.


    ![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_67_0.png)


    If you now go into SSMS query a table, or you run the execution we created in
    the previous chapter, you will see the queries in the profiler. and, unfortunately,
    you may see a whole lot (I''m also seeing queries from my Report Server and some
    other stuff I''ve got running). You can pause the trace and put some filters in
    place.


    ![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_68_0.png)


    Figure 22: Trace Pause and Properties


    In the Events Selection tab, go to Column Filters... and filter on Application
    like "EntityFramework". If you haven''t manually changed the Application in your
    DbContext, you will only see queries that are fired from your application. A filter
    on LoginName or NTUserName can also come in handy, especially when you have millions
    of queries and you''re only interested in a single user. Another filter I quite
    often is Duration greater than; set it to 5000 (milliseconds) and you''ll get
    all the queries that take at least five seconds. If one query pops up a lot, you
    may need to have a look at it. Anyway, with your Application filter in place,
    run some query from your application and look it up in the profiler. ran context.
    p => p.Id == 1);


    | EventClass | TextData | ApplicationName | NTUserName | CPU | Reads | Duration
    |

    |---|---|---|---|---|---|---|

    | SQL:BatchCompleted | select(cast(Id as int) as ...) | EntityFramework | SR |
    0 | 0 | 0 |

    | RPC:Completed | select Statement(SQL) FROM (SELECT TOP 100 PERCENT... | EntityFramework
    | SR | 0 | 0 | 0 |

    | SP:Completed | select * FROM People where Id = ... | EntityFramework | SR |
    0 | 0 | 0 |

    | SQL:BatchCompleted | SELECT ... (Id) AS | EntityFramework | SR | 0 | 0 | 0 |


    Figure 23: Query in profiler


    As you can see, EF has shown over, and only the fifth row is actual query. By
    looking at the columns, we can see database returned 1 row, and 0 milliseconds
    to make up the result. When looking for troublesome queries, you might want to
    keep an eye on those values. isn''t necessarily bad, but it might be an indication
    that something can be optimized. Now we can copy and paste the query and run it
    in SSMS manually. The profiler can be used for many things, for example trace
    deadlocks. Look at all the events and queries with the Duration filter prove to
    be useful. Sometimes you might want to run trace for a while. You can set up your
    trace and then in the File menu, go to Export then Trace Definition for SQL Server
    2005-2014... Save the script wherever you want (for example C:\MyTrace) and run
    it.


    Now doesn''t matter whether the profiler is running or not; everything will be
    saved to the trace file. Of course you could do this using Trace Properties, but
    I wanted to show you the script as well. By the way, if you''re having trouble
    opening the file, try to run it as administrator. To see which traces are running,
    you can use the following.


    ### Listing 63: View SQL traces

    ```sql

    SELECT * FROM fn_trace_info(default)

    ```


    To stop, start, and delete a trace, you can use the following.


    ### Listing 64: Stop, start, and delete trace

    ```sql

    SELECT * FROM fn_trace_info(default)

    -- The file we created got trace 3.

    -- Yours may be different, check first.

    DECLARE @TraceId INT = 3


    -- Stop the trace.

    EXEC sp_trace_status @TraceId, 0


    -- Start the trace.

    EXEC sp_trace_status @TraceId, 1


    -- To delete the trace, first stop it.

    EXEC sp_trace_status @TraceId, 0

    EXEC sp_trace_status @TraceId, 2

    ```


    ## Query plans


    Now that you know how to get the queries that may cause trouble, you want to find
    out why exactly they cause. The most obvious way to do this is by looking at the
    query plan. Before a query is executed, SQL Server estimates the quickest way
    to fetch all the data. For example, a JOIN can be realized internally by a LOOP,
    MERGE, or HASH JOIN. Take two JOINS in a single query and we have ways to execute
    this. A WHERE clause and things grows exponentially. A single query can have hundreds
    or thousands of different plans. SQL Server takes an educated guess as what plan
    might be optimized. We''ve already talked about this a bit in the parameterization
    chapter, but now we''re going to look at actual plans.


    Unfortunately, Synchronization doesn''t have a Succinct ebook on query plans (yet?),
    but you could always check out this free ebook on query plans by SimpleTalk.


    For now, open SSMS, browse to the AdventureWorks database, and open a new query
    window. Right-click on the empty query window, and in the context menu, check
    Include Actual Execution Plan. For some extra information, run the following statements
    in your query window.


    ### Listing 74: Enabling statistics

    ```sql

    SET STATISTICS ON

    SET STATISTICS TIME ON

    ```


    These statistics will be shown in your Messages tab after you run a query. You
    can delete the statements from your window; they will be active in this window
    until you close it or until you explicitly turn it off again (SET STATISTICS OFF).
    Now run the following query (in the same query window).


    ### Listing 75: A SQL query with JOIN

    ```sql

    SELECT p.FirstName + '' '' + p.LastName AS FullName

    FROM Person.Person p

    JOIN Person.EmailAddress e ON e.BusinessEntityID = p.BusinessEntityID

    ```


    You now get the Results, Messages, and an additional tab, the Execution plan.


    ![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_70_0.png)


    Figure 24: An execution plan


    You should read the execution plan from left to right (the SELECT is executed
    last). The thicker an arrow between two nodes, the more data that was handled
    by that node. SQL Server serves by doing a scan on the Person table (using the
    primary key). It computes the scalar FullName. It does another scan on EmailAddress
    using the primary key for table. It then does a merge join between Person and
    EmailAddress. Finally, it selects the data.

    '
