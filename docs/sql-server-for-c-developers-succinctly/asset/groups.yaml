    \ simply write the classes that would be generated by Database First yourself.\
    \ Code First is especially awesome when you're working in a team and everyone\
    \ has their own local copy of the database. Updating databases and inserting data\
    \ is very easy, and can even be done automatically—no more having to run and update\
    \ scripts manually. Once again, create a Console Application and install EF (using\
    \ NuGet).\n\nNow, adding the classes to your project. Also make sure you use the\
    \ CodeFirst connection string to your config file (without EF metadata, just a\
    \ \"plain\" connection string).\n\n> *Listing 44: EF Code First classes*\n\n```\n\
    public class Person {\n    public int Id { get; set; }\n    public string FirstName\
    \ { get; set; }\n    public string LastName { get; set; }\n    public DateTime\
    \ DateOfBirth { get; set; }\n    public int GenderId { get; set; }\n    public\
    \ Gender Gender { get; set; }\n}\n\npublic class Gender {\n    public int Id {\
    \ get; set; }\n    public string Code { get; set; }\n    public string Description\
    \ { get; set; }\n    public virtual ICollection<Person> People { get; set; }\n\
    }\n\npublic class CodeFirstContext : DbContext {\n    public CodeFirstContext()\n\
    \        : base(\"CodeFirst\") {}\n\n    public DbSet<Person> People { get; set;\
    \ }\n}\n```\n\nThose classes may look familiar. It's pretty much what EF database\
    \ first generated for us earlier. Please note the virtual keyword for the ICollection.\
    \ At runtime, EF will create a proxy class for Gender, overriding the People property,\
