    # Chapter 3 Entity Framework Database First


    Everything in the previous chapter was a lot of typing, a little tedious, and
    not very easy to do. It''s not very hard to create an abstraction layer that automatically
    maps fields from your select statements to properties on C# objects, but it won''t
    be pretty. To do something like that is a little harder, but fortunately such
    an abstraction already exists. In this chapter we''ll take a look at Microsoft''s
    Entity Framework (EF), an Object Relational Mapper (ORM) that does everything
    we did in the previous chapter, but a bit easier.


    An ORM, as the name implies, maps objects from a relational database to objects
    in your code. The Entity Framework has two modes of development. First, and most
    traditional, is that EF generates C# classes from an existing database. Second
    is that you code out your classes with properties, foreign keys, and primary keys,
    and have EF generate the database for you. These two modes are called Database
    First and Code First, respectively. A third option exists where EF creates C#
    classes from an existing database, but pretends you''ve used Code First, allowing
    you to use Code First with an existing database. In this chapter I''m going to
    show you Database First and Code First. From there it shouldn''t be difficult
    to use the Code First from an existing database option.


    To extensively explain EF, we''d need a not-so-succinct fact, I''ve got a book
    counting over 600 pages for an older version of EF when Code First wasn''t even
    an option. Add to the LINQ queries you can write, for which you can read a completely
    different book, and the T4 Template technology that EF uses, and you''ll understand
    that I really only scratch the surface of EF in this chapter. The goal of this
    chapter is not to make you an expert of EF, but to apply the lessons from the
    previous chapter to an ORM and some of the first "gotcha" details of EF that will
    save you a lot of gray hairs later.


    # Database First


    Let''s start with Database First, as it is pretty straightforward. Create a new
    C# Console Application Project, save it, and install EntityFramework from NuGet.
    In the menu, go to Tools > NuGet Package Manager > Manage NuGet Packages for Solution.
    Browse for EntityFramework, select your project in the list of projects on the
    right side of the window, and install it. Now, add a new item to your project
    and choose ADO.NET Data Model, and name it SuccinctlyExamplesModel.


    The Data Model Wizard presents you a few options; select designer from database
    to pick a database. Pick the SuccinctlyExamples database you created. After you''ve
    created your connection, you get a tree view with database objects. Check the
    tables (dbo.Gender and dbo.Person), make sure you Pluralize or singularize object
    names, and finish.


    You''ll find a file called SuccinctlyModels.edmx added to your project. The edmx
    (Entity Data Model extension) file holds all your mappings from database to code.
    Right-clicking the file and selecting Open allows you to select an Editor and
    view your mappings in XML. You should never need the XML, but if you get deeper
    into EF, you''ll find yourself editing or inspecting it more than you''d like.
    For this tutorial, though, we''re not going to look at it. If you double-click
    on the edmx file, you''ll get a diagram showing all the database objects you imported
    earlier. If you want to import more objects or update existing objects, simply
    right-click somewhere in the model and click Update Model from Database. Unfortunately,
    if you import a table, you will always get all properties, and an update will
    update all already imported tables.


    ![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_38_0.png)


    Figure 8: Entity Framework diagram


    Notice that Gender has a People attribute and Person has a Gender attribute (if
    you named GenderId, the attribute would be named Gender1, y!). The line between
    them describes the relation. The edmx file allows you to visualize these relationships.

    '
