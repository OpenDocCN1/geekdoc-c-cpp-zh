    That was a quick overview of the Entity Framework. We''ve addressed creating a
    model, importing tables, creating queries, parameterization, lazy-loading, and
    CRUD operations. Unfortunately, as you''ve seen, there are many "gotchas" when
    working with EF (or any ORM, for that matter). I know these things because I have
    done them in the past. I have seen entire teams, with years of experience, still
    fall for some of the pitfalls laid out in this chapter. Often I have heard "EF
    sucks because it is so slow," but more often than not, this was the result of
    not parameterizing, not knowing when Iables are executed (or even just not knowing
