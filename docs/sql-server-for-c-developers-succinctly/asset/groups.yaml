- md: "\nSSMS will automatically name your foreign key FK_Person_Gender, so you can\
    \ leave all the rest and save. You have now told SQL Server that the Gender column\
    \ in the Person table may only contain values that are also a value in the Id\
    \ column of the Gender table.\n\n> Note: Many people believe relational databases\
    \ are called so because it is possible to define foreign key relationships between\
    \ tables. That is not true though more than a constraint, guaranteeing data integrity.\
    \ The actual reason relational databases are called so because the mathematical\
    \ term for a table is relation. A relation is an unordered set of values. A value\
    \ is a collection of unique values. A value in SQL Server is a tuple, which is\
    \ a collection of values. Uniqueness of a value is guaranteed by a primary key.\
    \ That also means that any table (or view) without a unique primary key is actually\
    \ not a relation!\n\nNow, right-click the Gender table and click Edit Top 200\
    \ Rows. It doesn't really matter what you insert, but maybe you should follow\
    \ your example.\n\n| Id | Code | Description |\n|---|---|---|\n| 0 | UNKNOWN |\
    \ Not saying |\n| 1 | MALE | Male |\n| 2 | FEMALE | Female |\n| | NULL | NULL\
    \ |\n\nFigure 5: Genders\n\nNow we also insert one or more people in the Person\
    \ table.\n\n| Id | FirstName | LastName | DateBirth | GenderId |\n|---|---|---|---|---|\n\
    | 1 | Sander | Rossel | 1987-11-08 00:00:00 | 1 |\n| 2 | Bill | Gates | 1955-10-28\
    \ | 1 |\n| * | NULL | NULL | NULL | NULL |\n\nFigure 6: People\n\nSo that was:\
    \ We set up two tables, created a foreign key, and inserted some data. We are\
    \ missing one though... the scripts! You're going to need the scripts if you want\
    \ to do these steps on a different database (or the same database on another environment).\
    \ Luckily, SSMS has few options for generating scripts.\n\nThe first method is\
    \ to right-click an object, select Script [Object] as >, and make your pick. Only\
    \ scripts only export objects, this is probably fine for fetching tables (which\
    \ can't be overwritten without losing data). For example, the Person table CREATE\
    \ script is as follows:\n\nCode Listing 1: CREATE TABLE [dbo].[Person]\n\n```\n\
    CREATE TABLE [dbo].[Person] (\n  [Id] [int] IDENTITY(1,1) NOT NULL,\n  [FirstName]\
    \ [varchar](256) NOT NULL,\n```\n\n```\n[LastName] [varchar](256) NULL,\n[DateOfBirth]\
    \ [smalldatetime] NULL,\n[GenderId] [int] NULL,\nCONSTRAINT [PK_Person] PRIMARY\
    \ KEY CLUSTERED\n(\n[Id] ASC\nWITH (PAD_INDEX = OFF, STATISTICS_NORECOMPUTE =\
    \ OFF, IGNORE_DUP_KEY = OFF,\nALLOW_ROW_LOCKS = ON, ALLOW_PAGE_LOCKS = ON) [PRIMARY]\n\
    )\n\nGO\n\nSET ANSI_PADDING OFF OFF\nGO\n\nALTER TABLE [dbo].[Person] WITH CHECK\
    \ CONSTRAINT [FK_Person_Gender]\nFOREIGN KEY([GenderId])\nREFERENCES [dbo].[Gender]\
    \ ([Id])\nGO\n\nALTER TABLE [dbo].[Person] CHECK CONSTRAINT [FK_Person_Gender]\n\
    GO\n```\n\nThat's awesome, but do note that we need the Gender table first, or\
    \ this script will fail. We added the foreign key constraint later, but it's all\
    \ here in this one script.\n\nFor updates to tables, we can go into the Design\
    \ window, add a column, change a type, add a constraint, and then right-click,\
    \ and choose Generate Change Script. For example, I've added a LastLoginTime column,\
    \ and I've changed GenderId to be non-nullable.\n\n| Column Name | Data Type |\
    \ Allow Nulls |\n| --- | --- | --- |\n| Id | int | |\n| FirstName | varchar(256)\
    \ | |\n| LastName | varchar(256) | |\n| DateOfBirth | smalldatetime | |\n| GenderId\
    \ | int | |\n| LastLoginTime | datetime | |\n\n## Save Change Script\n\n![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_14_0.png)\n\
    \nFigure 7: Save Change Script\n\nAs you can see, SQL Server actually creates\
    \ a temporary table, drops the tables, and makes the changes. It does more than\
    \ you'd thought! You can save this script and execute it on another environment\
    \ effortlessly (or automated). Unfortunately, dropping and recreating a table\
    \ is slow and resource-heavy, you might want to write your own scripts anyway.\
    \ You can open a new query window using the New Query button in the upper-left\
    \ side of the screen, or by using Ctrl + N. Be mindful to make sure you execute\
    \ scripts (using Execute button or F5) on the correct database—a common mistake\
    \ is executing scripts on master database, which is selected as default.\n\nThe\
    \ following simple script will also add a LoginTime column and make GenderId nullable.\n\
    \nCode Listing 2: ALTER TABLE\n\n```\nALTER TABLE dbo.Person ADD LoginTime DATETIME\n\
    ALTER TABLE dbo.Person ALTER COLUMN GenderId INT\n```\n\n> Tip: It is possible\
    \ to execute only certain parts of scripts in a single query. Simply select the\
    \ part of query you want to execute and hit F5. This is especially when you are\
    \ testing some software and would like to inspect the data, run your code again,\
    \ and repeat. While a SELECT statement and an UPDATE/DELETE statement in a single\
    \ window, you can execute the two (or more) statements independently, without\
    \ having to switch all the time.\n\nLast, but not least, you can script a database\
    \ with all some selected objects, without data. Right-click your database, go\
    \ to Tasks -> then Generate Scripts. Go through the wizard and experiment with\
    \ it (it's not very complicated, but it has a lot of options). Here is the generated\
    \ script for the table, including data.\n\nCode List 3: CREATE TABLE [dbo].[Gender]\n\
    \n```\nCREATE TABLE [dbo].[Gender](\n[Id] [int] NOT NULL,\n[Code] [varchar](16)\
    \ NOT NULL,\n[Description] [varchar](64) NOT NULL,\nCONSTRAINT [PK_Gender] PRIMARY\
    \ KEY CLUSTERED\n([Id] ASC\nWITH (PAD_INDEX = OFF, STATISTICS_NORECOMPUTE = OFF,\
    \ IGNORE_DUP_KEY = OFF,\nALLOW_ROW_LOCKS = ON, ALLOW_PAGE_LOCKS = ON) ON [PRIMARY])\n\
    ```\n\n```\nGO\nSET ANSI_PADDING OFF\nGO\nINSERT [dbo].[Gender]([Id], [Code],\
    \ [Description]) VALUES (0, 'UNKNOWN', 'Not saying')\nGO\nINSERT [dbo].[Gender]([Id],\
    \ [Code], [Description]) VALUES (1, 'MALE', 'Male')\nGO\nINSERT [dbo].[Gender]([Id],\
    \ [Code], [Description]) VALUES (2, 'FEMALE', 'Female')\nGO\n```\n\nThat was a\
    \ brief introduction to SQL Server Management Studio. The tree view combined with\
    \ right-click context menus work well. Of course, you can use all kinds of shortcut\
    \ keys if you want; just look them up in the menus. We're going to use SSMS more\
    \ often throughout this book.\n\n> Tip: When creating new objects in your database,\
    \ you will not get full design time support when writing queries against these\
    \ created objects. They won't show up in autocomplete, and SSMS will tell you\
    \ these objects don't exist if you manually type them in your query. Your queries\
    \ will run successfully, though. Even a database refresh will not help you here.\
    \ For a long time, I thought restarting SSMS was the only way to load new objects\
    \ into the object cache. It turned out Ctrl + Shift + R also does the trick—no\
    \ more squiggly lines under objects you've just created!\n\n## Chapter 2 ADO.NET\n\
    \nNow that we have a database, let's see how we can get data from that database\
    \ into our application, or from our application into our database. An obvious\
    \ choice nowadays would be an Object Relational Mapper (ORM) that automatically\
    \ creates classes from our tables and knows how to read and store data with a\
    \ simple, single command. It can be. However, a lot is still happening that you\
    \ do not know about. It is my belief that you can't truly understand ORM if you\
    \ haven't done the same thing without it. In fact, I've met developers who have\
    \ never used anything other than an ORM, and were absolutely clueless when their\
    \ ORM spoke out huge queries 100 times a second! If you don't really understand\
    \ your ORM, you're going to have a hard time (and a slow application). So let's\
    \ work without an ORM first, and see what happens at a (somewhat) lower level.\n\
    \nOpen up Visual Studio and create a new Console Application in C# (or Visual\
    \ Basic if you like, but my examples will be in C#). The .NET Framework has a\
    \ set of components for working with data sources (such as databases or spreadsheets),\
    \ collectively called ADO.NET. Microsoft first introduced ADO, which is short\
    \ for ActiveX Data Objects, long before the .NET Framework. Most of ADO is in\
    \ the System.Data namespace, which is automatically available when you create\
    \ a new project.\n\nLet's say we need to retrieve a person from the database and\
    \ use it in our software. The first we'd need is a connection to the database.\
    \ For now, we're assuming we'll always use a SQL Server database. In this case,\
    \ we're going to make extensive use of the System.Data.SqlClient namespace.\n\n\
    ## Establishing a connection\n\nThe first thing we'll need is an actual connection.\
    \ Without a connection, we'll never be able to anything with our database.\n\n\
    ## The connection string\n\nIn order to set up a connection, we'll need a connection\
    \ string: a value specifying various options necessary to set up a connection,\
    \ such as the server on which instance is running, the database to connect to,\
    \ login credentials, a name for the connection, timeout, language, and more.\n\
    \nYou can connect to any type of database using a connection string, and every\
    \ database vendor has their own. Luckily, we have websites like connections.com\
    \ to help us out. The typical connection string looks as follows:\n\n```\nServer=server\\\
    instance; Database=database; User Id=username;\nPassword=password.\n```\n"
  mdcn: "\n\nSSMS 将自动为你的外键 `FK_Person_Gender` 命名，因此你可以忽略其他设置并保存。你现在已经告诉 SQL Server，`Person`\
    \ 表中的 `Gender` 列只能包含在 `Gender` 表的 `Id` 列中存在的值。\n\n> 注意：许多人认为关系型数据库之所以被称为关系型是因为可以在表之间定义外键关系。但事实并非如此，这不仅仅是一种约束，还能保证数据完整性。关系型数据库之所以被称为关系型，是因为在数学中，“表”的术语是“关系”（relation）。一个关系是一个无序的值集合。一个值是一组唯一值的集合。SQL\
    \ Server 中的一个值是一个元组（tuple），它是一组值的集合。值的唯一性由主键来保证。这意味着，任何没有唯一主键的表（或视图）实际上并不是“关系”！\n\
    \n现在，右键点击 `Gender` 表并点击“编辑前 200 行”。你插入什么其实并不重要，但也许你应该遵循你的示例。\n\n| Id | Code |\
