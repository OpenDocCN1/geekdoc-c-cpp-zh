    # Parameter sniffing


    Your query runs really slow when executed from your C# code, while other times
    it completes a few milliseconds. Multiple things can happen here. First, and we''ll
    get to this, blocking queries. Another option is parameter sniffing. What SQL
    Server does when it encounters a new query that uses parameters is that it creates
    a query plan that is (approximately) optimal for the current value of the parameter.
    Remember that query plans are cached and reused if the same query is executed
    again. However, if the same query now has a different value for its parameter,
    the plan may be suboptimal. Likely we can replicate this issue quite easily (although
    we won''t see the performance hit, as our database is still small).


    First we need parameterized query. An ad hoc query in a query window is not parameterized
    unless you use sp_execql, an in-build procedure that runs a SQL query and can
    optionally take parameters. What C# sends to the database if you run a parameterized
    query. Running a string is not very easy to type, (as you have to escape it),
    let''s go with the already, stored procedure. Create the following procedure in
    the AdventureWorks database (never mind that this procedure is perfectly useless
    and becomes literally useless after some million orders).


    Code Listing 68: SP GetOrdersByDate


    ```

    CREATE PROCEDURE GetOrdersByDate

    @OrderDate DATETIME

    BEGIN

    SET NOCOUNT ON;


    SELECT *

    FROM Sales.SalesOrderHeader

    WHERE OrderDate < @OrderDate

    ```'
