  - "[PAGE 43]\n\nIn this case we have three genders, so we have the call to get all\
    \ genders, and an additional call for each gender to get the people, which is\
    \ a total of four database calls. In many scenarios you really don't know how\
    \ many entities you're getting, and before you know it, you're doing thousands\
    \ of database calls! This is called lazy-loading, and can be turned off in your\
    \ EF diagram. However, with lazy-loading turned off, your People will not be loaded\
    \ and it may have no people at all. I've seen systems very slow because of lazy-loading,\
    \ but when used correctly, it's pretty awesome. Luckily, EF does caching for you,\
    \ so once a Navigation Property is loaded, EF won't access the database again.\
    \ \"Think before you query\" is the message!\n\nLet's look at some cool extensions,\
    \ which make working with IQueryable a lot easier. Working with dates is always\
    \ a pain, so let's create an OlderThan extension method. I confess got the SQL\
    \ query from Stack Overflow and converted it to LINQ. It's accurate enough for\
    \ the example.\n\n> Code List 37: OlderThan extension method\n\n```\npublic static\
    \ class Extensions\n{\n    public static IQueryable<Person> OlderThan(this IQueryable<Person>\
    \ q, int age)\n    {\n        return q.Where(p => DbFunctions.DiffHours(p.DateOfBirth,\
    \ DateTime.Today) / 8766) > age);\n    }\n}\n```\n\nThe usage is simple and readable.\
    \ The original query would be unreadable to anyone, but it's clear what it does\
    \ from the name (OlderThan). It's a win-win situation.\n\n> Code List 35: OlderThan\
    \ usage\n\n```\nvar context = new SuccinctlyExamplesEntities()\n{\n    List<Person>\
    \ people = context.People.OlderThan(45).ToList();\n}\n```\n\nThe function or property\
    \ you're using in an IQueryable must be present in the data source. Creating an\
    \ interface and using that on different types to reuse your extension method is\
    \ only possible when the interface member has the same name as your entity member.\
    \ If you have multiple entities with a DateOfBirth and you want to reuse your\
    \ extension method, that's possible, but only when you implement the extension\
    \ method as a generic function (after all, IQueryable works on entities, not on\
    \ interface types). The generic must be a class, because a struct may not be an\
    \ entity.\n\n> Code List 36: Using an interface\n\n```\npublic interface IDateOfBirth\n\
    {\n    DateTime DateOfBirth { get; set; }\n}\n```"
  - "[PAGE 44]\n\n```\npublic partial class Person : IDateOfBirth\n }\n\npublic static\
