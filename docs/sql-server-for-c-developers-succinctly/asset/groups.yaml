    \ 通过 `Person` 推断了这一点。此外还有一个 `dbo.__MigrationHistory` 表（注意有两个下划线）；我们稍后会查看它。让我们先通过重写\
    \ `DbContext` 中的 `OnModelCreating` 来修复复数命名问题。\n\n# 代码列表 50：非复数化的 DbContext\n\n\
    ```csharp\npublic class CodeFirstContext : DbContext\n{\n    public CodeFirstContext()\n\
    \        : base(\"CodeFirst\")\n    {\n\n    protected override void OnModelCreating(DbModelBuilder\
    \ modelBuilder)\n    {\n        modelBuilder.Conventions.Remove<PluralizingTableNameConvention>();\n\
    \    }\n\n    public DbSet<Person> People { get; set; }\n}\n```\n\n有许多这样的约定，你也可以添加自己的约定。在\
    \ SSMS 中右键点击数据库并点击“删除”。在对话框中，勾选“关闭现有的连接”。当你运行应用程序时，你的表将分别命名为 `dbo.Person` 和 `dbo.Genders`。如果你不删除数据库，将会得到一个运行时异常——我们稍后会修复它。\n\
    \n进一步观察数据库，你会发现所有字符串属性都被翻译成了 `nvarchar(max)`。你可能并不希望这样做。此外，`FirstName` 是不可空的，所以让我们修复一下这个问题。使用数据注解（在\
    \ `System.ComponentModel.DataAnnotations` 命名空间中）这其实非常简单。只需向你的模型添加一些属性即可。\n\n#\
    \ 代码列表 45：数据注解\n\n```csharp\n[Required]\n[MaxLength(256)]\npublic string FirstName\
    \ { get; set; }\n[MaxLength(256)]\npublic string LastName { get; set; }\n```\n\
    \n再次删除你的数据库并重新运行代码。这些字段现在将分别生成为 `varchar(256) not null` 和 `varchar(256) null`。你可以进行更多调整，例如不使用自动生成的键、映射到数据库中的另一个列名、更改生成的类型，或者将属性设为\
    \ `Key` 主键。\n\n# 代码列表 52：非生成的键\n\n```csharp\n[DatabaseGenerated(DatabaseGeneratedOption.None)]\n\
    public int Id { get; set; }\n```\n\n通过重写 `OnModelCreating(Dbcontext)`，你在自定义生成方面有很大的灵活性。\n\
    \n# 代码列表 46：在 OnModelCreating 中自定义\n\n```csharp\nprotected override void OnModelCreating(DbBuilder\
    \ modelBuilder)\n{\n    modelBuilder.Conventions.RemovePluralizingTableNameConvention();\n\
    \n    modelBuilder.Entity<Person>()\n        .Property(p => p.DateOfBirth)\n \
    \       .HasColumnName(\"DOB\")\n        .HasColumnType(\"smalldatetime\");\n\n\
    \    modelBuilder.Properties()\n        .Where(p => p.Name == \"Key\")\n     \
    \   .Configure(p => p.IsKey());\n}\n```\n\n通过使用 `NotMappedAttribute`，属性将完全被 EF\
    \ 忽略（例如你通过 `FirstName` 和 `LastName` 组合 `FullName` 属性）。\n\n# 代码列表 47：未映射到数据库的属性\n\
    \n```csharp\n[NotMapped]\npublic int FullName { get; set; }\n```\n\n你可能已经明白了 Code\
    \ First 的精髓：编写代码和配置，让 EF 为你创建数据库。\n\n# 迁移 (Migrations)\n\n到目前，我们每次修改模型时都会删除数据库。这在现实世界中显然不可行的。EF\
