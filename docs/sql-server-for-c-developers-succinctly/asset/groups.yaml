    \ 和 **DropDatabasealways**。这些被称为 **DatabaseInitializers**（数据库初始化器）。你可能会在使用它们时遇到一些麻烦。如果你在数据库中有数据或映射的实体，当\
    \ EF 删除数据库并重新创建它们时，你会丢失它们（想象一下在生产环境中发生这种情况）。新版本的 EF 引入了 `MigrateDatabaseToLatestVersion`。在此之前，它的效果并不理想——毕竟，当你的模型变化时，你会得到一个异常。\n\
    \n启用迁移\n\n![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_52_0.png)\n\n> 图 12：使用 NuGet\
