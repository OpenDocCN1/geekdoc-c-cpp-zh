    ## 动态管理视图


    进一步了解如何控制查询、执行计划和其他数据可能会非常有用。SQL Server 拥有所谓的动态管理视图，或 DMVs。你的数据库结构、表、存储过程以及数据库中的几乎所有内容都存储在这些视图中。例如，以下查询列出了所有表（两次）。


