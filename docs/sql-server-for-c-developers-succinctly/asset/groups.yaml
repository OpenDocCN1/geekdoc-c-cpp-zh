    In the Package Console, type **update-database**, and your database will be updated.
    You can run your code and query against an updated database. Make sure you don''t
    give two migrations the same name, or you will get name conflicts in your C# code.


    Now add property to Person, for example, int Age, and run another migration **"Add
    Person.Age"** and **update-database**. Unfortunately, whatever reason, your last
    database change has been rolled back. Luckily, Up and Down methods are generated,
    so this should be easy. To revert migrations, simply update to an older migration
    and new migrations will be rolled back. In the console, type **"update-database
    -TargetMigration:Add Person.FullName"** and run it. Add Person.Age will be reverted.


    As I was playing around migrations, I created FullName, then removed it, and again,
    as a result with two C classes AddPersonFullName. No problem, I deleted the oldest
    and ran my. However, when rolling back, I got a conflict as AddPerson.FullName
    was ambiguous. Luckily, everything you have to do is delete **dbo__MigrationHistory**
    and simply run **"update-database -TargetMigration:201605211180341_AddPersonFullName"**
    to remove the ambiguity, without a lot of tedious manual.


