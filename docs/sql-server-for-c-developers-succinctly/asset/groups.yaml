    # 第 3 章 Entity Framework 数据库优先


    上一章中的所有内容都涉及大量的输入，有些枯燥，而且并不容易实现。创建一个抽象层来自动将 `select` 语句中的字段映射到 C# 对象的属性并不难，但这样做看起来不会很好看。要做这类事情会困难一些，但幸运的是，这种抽象已经存在了。在本章中，我们将查看微软的
    Entity Framework (EF)，它是一个对象关系映射 (ORM)，可以完成我们在上一章中做过的所有工作，但操作起来更简单。


    顾如其名，ORM 将关系型数据库中的对象映射到你代码中的对象。Entity Framework 有两种开发模式。第一种（也是最传统的）是让 EF 从现有数据库生成
    C# 类。第二种是你自己编写带有属性、外键和主键的类，并让 EF 为你生成数据库。这两种模式分别称为“数据库优先”（Database First）和“代码优先”（Code
    First）。还有第三种选择：EF 从现有数据库创建 C# 类，但伪装成你使用了“代码优先”，从而允许你在现有数据库上使用“代码优先”。在本章中，我将向你展示数据库优先和代码优先。在此基础上，使用“从现有数据库使用代码优先”的选项应该并不困难。


    要详尽地解释 EF，我们需要并不怎么简洁的事实：我有一关于旧版本 EF 的书超过 600 页，而那时“代码优先”甚至还一个选项。再加上你可以编写的 LINQ
    查询（你可以为此读另一本完全不同的书）以及 EF 使用 T4 模板技术，你会发现我在本章中真的只接触了 EF 的皮毛。本章的目标不是让你成为 EF 专家，而是将上一章的课程应用到
    ORM，并介绍 EF 的一些早期“陷阱”细节，这些细节以后将帮你省去很多白头发。


    # 数据库优先


    让我们从数据库优先开始，因为它非常直观。创建一个新的 C# 控制台应用程序项目，保存它，并从 NuGet 安装 EntityFramework。在菜单中，转到
