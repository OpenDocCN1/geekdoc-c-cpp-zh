    \n```\npeopleQuery.Where(p => p.FirstName == \"Sander\").ToList();\n```\n\n```\n\
    (extension) IQueryable<Person> IQueryable<Person>.Where<Person>(System.Linq.Expressions.Expression<Func<Person,\
    \ bool>> predicate)\n根据谓词过滤值序列。\n```\n\n图 10: IQueryable.Where\n\n```\npeopleEnum.Where(p\
    \ => p.FirstName == \"Sander\").ToList();\n```\n\n```\n(extension) IEnumerable<Person>\
    \ IEnumerable<Person>.Where<Person>(Func<Person, bool> predicate)\n根据谓词过滤值序列。\n\
    ```\n\n图 11: IEnumerable.Where\n\n`Expression<SomeType, bool>` 基本上是将 `SomeType,\
    \ bool` 作为对象图的表示。在 `IEnumerable` 中，你传递的不是一个方法，而是传递一个代表该方法的对象。在这种情况下，编译器会创建对象图，所以你不需要担心。\n\
    \n在上一个示例中，这意味着 `IEnumerable` 会对集合进行枚举，强制进行一次数据库往返（实际上 `IEnumerable` 变量是一个 `IQueryable`），在此之后才会执行该函数。结果是，你将从数据库中获取**所有**人员，而不仅仅是名字为“Sander”的人。请务必小心，不要意外破坏你的\
    \ `IQueryable` 链。\n\n为了好玩，这里是编译器从该 Lambda 表达式创建的 `Expression<Person, bool>`。\n\
    \n代码行 38：Expression<Person, bool>>\n\n```\nParameterExpression parameter = Expression.Parameter(typeof(Person),\
