  - '[PAGE 17]


    # Chapter 2 ADO.NET


    Now that we have a database, let''s see how we can get data from that database
    into our

    application, or from our application into our database. An obvious choice nowadays
    would be an

    Object Relational Mapper (ORM) that automatically creates classes from our tables
    and knows

    how to read and store data with a simple, single command. It can be that. However,
    a lot is

    still happening that you do not know about. It is my belief that you can''t truly
    understand

    ORM if you haven''t done the same thing without an. In fact, I''ve met developers
    who have

    never used anything other than an ORM, and were absolutely clueless when their
    ORM spoke out huge queries

    100 times a second! If you don''t really understand your ORM, you''re going to
    have a hard time

    (and a slow application). So let''s work without an ORM first, and see what happens
    at a

    (somewhat) lower level.


    Open up Visual Studio and create a new Console Application in C# (or Visual Basic
    if you like,

    but my examples will be in C#). The .NET Framework has a set of components for
    working with

    data sources (such as databases or spreadsheets), collectively called ADO.NET.
    Microsoft first\introduced ADO, which is short for ActiveX Data Objects, long
    before the .NET Framework.

    Most of ADO is in the System.Data namespace, which is automatically available
    when you

    create a new project.


    Let''s say we need to retrieve a person from the database and use it in our software.
    The first

    we''d need is a connection to the database. For now, we''re assuming we''ll always
    use a

    SQL Server database. In this case, we''re going to make extensive use of the

    System.Data.SqlClient namespace.


    # Establishing a connection


    The first thing we''ll need is an actual connection. Without a connection, we''ll
    never be able to

    anything with our database.


    # The connection string


    In order to set up a connection, we''ll need a connection string: a value specifying
    various

    options necessary to set up a connection, such as the server on which instance
    is running,

    the database to connect to, login credentials, a name for the connection, timeout,
    language, and

    more.


    You can connect to any type of database using a connection string, and every database
    vendor

    has their own. Luckily, we have websites like connections.com to help us out.

    The typical connection string looks as follows:


    ```

    Server=server\instance; Database=database; User Id=username;

    Password=password.

    ```'
- md: "\nOr, in case you choose integrated security, instead of User Id and Password\
    \ you can put in Trusted_Connection=True; or Integrated Security=True; even Integrated\
    \ Security=SSPI(they're all the same).\n\nLikewise, Data Source=serverinstance\
    \ is a much-used alternative to Server=serverinstance, and Integrated Security=database\
    \ is a much-used alternative to Database=database.\n\nSo let's fill in the blanks\
    \ and create a connection. My connection string looks as follows: Server=Laptop23;SQLEXPRESS;\
    \ Database=SuccinctlyExamples; Integrated Security=SSPI.\n\n## Creating a connection\n\
    \nNow let's create a connection in code and open it. A short note on the code:\
    \ I'm using \"...\" syntax for strings, which is a new feature in C# 6.0. It is\
    \ a basically shorthand for string.Format.\n\nCode Listing 4: Creating a SqlConnection\n\
    \n```csharp\ntry\n{\n    using (SqlConnection connection = new SqlConnection(\n\
    \        @\"Server=LAPTOP23;SQLEXPRESS; Database=SuccinctlyExamples;\n       \
    \ Integrated Security=SSPI\"))\n    {\n        connection.Open();\n        //\
    \ The database is closed when Dispose() (or Close).\n    }\n    Console.WriteLine(\"\
    Successfully opened and closed the database.\");\n}\ncatch (Exception ex)\n{\n\
    \    Console.WriteLine(\"Something went wrong while opening a connection to the\
    \ database: {ex.Message}\");\n}\nConsole.WriteLine(\"Press any key to close.\"\
    );\nConsole.ReadKey();\n```\n\nThe first line of code creates a new SqlConnection\
    \ in System.Data.SqlClient and passes the parameters in the connection string.\
    \ A lot of objects we will use need to be properly disposed to release resources\
    \ (in this case the database connection), so we properly wrap the SqlConnection\
    \ in a using block. The connection is automatically closed when the Close() or\
    \ Dispose() method is called (using the block). The connection.Open() opens the\
    \ connection.\n\nA lot can go wrong in these few lines of code, hence the try-catch\
    \ block. Try making a typo in the connection string (for example, SServer), use\
    \ a non-existing database (any random value), supply invalid credentials, or try\
    \ to open the connection twice (without closing in between). All of those will\
    \ result in an Exception being thrown.\n\n## Configuring your connection string\n\
    \nHaving the connection string hard-coded in C# may be convenient during development,\
    \ but is not very practical (secure) in a production environment. You will need\
    \ to change it, rebuild, and redeploy every time your database or environment\
    \ (development, test, production) changes.\n\nConnection strings are often stored\
    \ in config files. The configuration file for your application is usually different\
    \ for each environment. The big advantage of storing various settings in a configuration\
    \ file is that you can change the behavior of your application without actually\
    \ changing and redeploying your application, allowing different settings in multiple\
    \ environments. Storing connection strings in configuration files is so common\
    \ that I added the SuccinctlyDB connection string to my app.config file.\n\nCode\
    \ Listing 5: connectionStrings in config file\n\n```xml\n<?xml version=\"1.0\"\
    \ encoding=\"utf-8\" ?>\n<configuration>\n  <connectionStrings>\n    <add name=\"\
    SuccinctlyDB\" connectionString=\"Server=LAPTOP23\\SQLEXPRESS;Database=SuccinctlyExamples;\
    \ Integrated Security=SSPI\" />\n  </connectionStrings>\n  <startup>\n    <supportedRuntime\
    \ version=\"v4.0\" sku=\".NETFramework,Version=v4.6\" />\n  </startup>\n</configuration>\n\
    ```\n\nWe can now easily retrieve the connection string from the config file.\
    \ We will need to add a project reference to System.Configuration. We can now\
    \ easily replace the first line of code to use the value from the config file.\n\
    \nCode Listing 6: Use connection string from the config file\n\n```csharp\nstring\
    \ connectionString =\nConfigurationManager.ConnectionStrings[\"SuccinctlyDB\"\
    ]?.ConnectionString;\nusing (SqlConnection connection = new SqlConnection(connectionString))\n\
    ```\n\nNotice that when the connection string is not present in the config file,\
    \ connectionString will be empty and an Exception will be raised when trying to\
    \ open the connection (\"The ConnectionString property was not initialized\").\
    \ Without the ?. null-conditional operator, we would get a NullReferenceException\
    \ when trying to get the ConnectionString property instead.\n\n## Building a connection\
    \ string\n\nIn some cases, you might want to edit the connection string or create\
    \ it from scratch (for example, writing in the SSMS login form). For this use\
    \ case, we can use a SqlConnectionString. The SqlConnectionString does pretty\
    \ much what its name implies; it creates connection strings using parameters.\
    \ Let's look at a simple example.\n\nCode Listing 7: The SqlConnectionString\n\
    \n```csharp\nSqlConnectionString builder = new SqlConnectionString();\nbuilder.DataSource\
    \ = \"LAPTOP23\\SQLEXPRESS\";\nbuilder.InitialCatalog = \"SuccinctlyExamples\"\
    ;\nbuilder.IntegratedSecurity = true;\n```\n\nNotice that the SqlConnectionString\
    \ actually uses terms instead of Database. Also, we can use SqlConnectionString\
    \ to edit connection strings. The constructor is overloaded, so you can set it.\n\
    \nCode Listing 8: editing a connection\n\n```csharp\nstring baseConnectionString\
    \ =\nConfigurationManager.ConnectionStrings[\"SuccinctDB\"].ConnectionString;\n\
    SqlConnectionString builder = new SqlConnectionString(baseConnectionString);\n\
    builder.IntegratedSecurity = false;\nusing (SqlConnection connection = new SqlConnection(builder))\n\
    ```\n\n## Querying your database\n\nThe next step is using the connection to retrieve\
    \ some data. To do this, we need to create the SqlCommand, with our connection,\
    \ and have to execute it.\n\n> Tip: Never use * in your production code. * retrieves\
    \ all columns in a table, which is not always what you want. For example, when\
    \ used in a view, * will select all fields that were present at the time the view\
    \ was created, not all fields are present when the view is queried (removing a\
    \ column will still break your view). Overall, it's best to avoid * except for\
    \ ad-hoc queries.\n\n## Reading data\n\nWhen using ExecuteReader function on a\
    \ SqlCommand instance, its query is executed and we get a SqlDataReader that holds\
    \ the retrieved data. A SqlDataReader, unfortunately, is not easy to work with.\
    \ I know why, but it requires a bit of typing. The SqlDataReader reads the set\
    \ by row (forward), and you can access columns by index as well. Obviously, selecting\
    \ by index is not very easy, especially in big queries (who knows which column\
    \ index is?), but getting the index by name returns the value object and requires\
    \ the programmer to make the proper conversions. Use the SqlDataReader methods\
    \ to get the correct values. Then, if no value is present (say the value is NULL),\
    \ you will have to make a conversion to a default value or null. Fact: NULL from\
    \ your database is something different than null in C#. A database NULL is represented\
    \ in C# by the static DBNull.Value. Tedious, to say the least. We'll probably\
    \ want to store the results in custom objects, so we'll need to create a Person\
    \ class. Let's see what this looks like.\n\nFirst, let's create a simple Person\
    \ class.\n\nCode Listing 9: A Person class\n\n```csharp\npublic class Person\n\
    {\n    public int Id { get; set; }\n    public string FirstName { get; set; }\n\
    \    public string LastName { get; set; }\n    public DateTime DateOfBirth { get;\
    \ set; }\n    public int? GenderId { get; set; }\n}\n```\n\nAnd now for the code\
    \ to get all people from the database:\n\nCode Listing 10: Usage of the SqlDataReader\n\
    \n```csharp\ntry\n{\n    List<Person> people = new List<Person>();\n    string\
    \ connectionString =\n    ConfigurationManager.ConnectionStrings[\"SuccinctDB\"\
    ].ConnectionString;\n    using (SqlConnection connection = new SqlConnection(connectionString))\n\
    \    using (SqlCommand command = new SqlCommand(\n        \"SELECT Id, FirstName,\
    \ LastName, DateOfBirth, GenderId FROM\n        dbo.Person\",\n        connection))\n\
    \    using (SqlDataReader reader = command.ExecuteReader())\n    {\n        while\
    \ (reader.Read())\n        {\n            people.Add(new Person\n            {\n\
    \                Id = reader.GetInt32(0),\n                FirstName = reader.GetString(1),\n\
    \                LastName = reader.GetString(2),\n                DateOfBirth\
    \ = reader.GetDateTime(3),\n                GenderId = reader.IsDBNull(4) ? (int?)null\
    \ : reader.GetInt32(4)\n            });\n        }\n    }\n}\ncatch (Exception\
    \ ex)\n{\n    Console.WriteLine($\"Error: {ex.Message}\");\n}\n```\n"
  mdcn: "\n\n或者，如果你选择集成安全（integrated security），可以使用 `Trusted_Connection=True;` 或 `Integrated\
    \ Security=True;` 代替 User Id 和 Password，甚至可以使用 `Integrated Security=SSPI`（它们都是相同的）。\n\
    \n同样，`Data Source=serverinstance` 是 `Server=serverinstance` 的常用替代方案，而 `Integrated\
    \ Security=database` 是 `Database=database` 的常用替代方案。\n\n现在，让我们填空空白并创建一个连接。我的连接字符串如下：`Server=Laptop23;SQLEXPRESS;\
    \ Database=SuccinctlyExamples; Integrated Security=SSPI`。\n\n## 创建连接\n\n现在让我们在代码中创建一个连接并打开它。关于代码的简短说明：我字符串字符串使用了\
    \ `\"...\"` 语法，这是 C# 6.0 的新功能。它基本上是 `string.Format` 的简写。\n\n代码列表 4：创建一个 SqlConnection\n\
    \n```csharp\ntry\n{\n    using (SqlConnection connection = new SqlConnection(\n\
    \        @\"Server=LAPTOP23;SQLEXPRESS; Database=SuccinctlyExamples;\n       \
    \ Integrated Security=SSPI\"))\n    {\n        connection.Open();\n        //\
    \ 数据库在 Dispose() (或 Close) 时会关闭。\n    }\n    Console.WriteLine(\"成功打开并关闭了数据库。\"\
    );\n}\ncatch (Exception ex)\n{\n    Console.WriteLine($\"打开数据库连接时出错：{ex.Message}\"\
    );\n}\nConsole.WriteLine(\"按任意键关闭。\");\nConsole.ReadKey();\n```\n\n第一行代码在 `System.Data.SqlClient`\
    \ 中创建了一个新的 `SqlConnection` 并传递了连接字符串中的参数。我们将使用的许多对象都需要被妥善释放以释放资源（在这种情况下是数据库连接），因此我们使用\
    \ `using` 块正确地封装了 `SqlConnection`。当调用 `Close()` 或 `Dispose()` 方法时（使用 `using` 块），连接会自动关闭。`connection.Open()`\
    \ 打开连接。\n\n这几行代码可能会发生很多错误，因此使用了 `try-catch` 块。尝试在连接字符串中输入拼写错误（例如，`SServer`），使用不存在的数据库（任何随机值），提供无效的凭据，或尝试打开两次连接（中间不关闭）。所有这些操作将导致抛出异常（Exception）。\n\
    \n## 配置你的连接字符串\n\n在 C# 中硬编码连接字符串在开发期间可能很方便，但在生产环境中并不实际（不安全）。每当数据库或环境（开发、测试、生产）发生变化时，你都需要更改、重新编译并重新部署。\n\
    \n连接字符串通常存储在配置文件中。应用程序的配置文件每个环境通常不同。在配置文件存储各种设置的巨大优势是，你可以在不实际更改和重新部署应用程序的情况下更改应用程序的行为，允许在多个环境中具有不同的设置。在文件中存储连接字符串是非常常见的，因此我将\
    \ `SuccinctlyDB` 连接字符串添加到我的 `app.config` 文件中。\n\n代码列表 5：配置文件中的 connectionStrings\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<configuration>\n  <connectionStrings>\n\
    \    <add name=\"SuccinctlyDB\" connectionString=\"Server=LAPTOP23\\SQLEXPRESS;Database=SuccinctlyExamples;\
    \ Integrated Security=SSPI\" />\n  </connectionStrings>\n  <startup>\n    <supportedRuntime\
    \ version=\"v4.0\" sku=\".NETFramework,Version=v4.6\" />\n  </startup>\n</configuration>\n\
    ```\n\n现在我们可以轻松地从配置文件中检索连接字符串。我们需要向项目添加 `System.Configuration` 的引用。现在我们可以轻松地替换第一行代码，以使用来自配置文件的值。\n\
    \n代码列表 6：从配置文件使用连接字符串\n\n```csharp\nstring connectionString =\nConfigurationManager.ConnectionStrings[\"\
    SuccinctlyDB\"]?.ConnectionString;\nusing (SqlConnection connection = new SqlConnection(connectionString))\n\
    ```\n\n注意，当配置文件中不存在连接字符串时，`connectionString` 将为空，并且在尝试打开连接时会抛出异常（“ConnectionString\
    \ 属性未初始化”）。如果没有 `?.` 空条件运算符，相反，在尝试获取 `ConnectionString` 属性时，我们将得到一个 `NullReferenceException`（空引用异常）。\n\
