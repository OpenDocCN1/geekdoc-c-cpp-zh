- md: "\nThe two methods differ in parameter, and in what they return. The IQueryable\
    \ takes an Expression<Func<Person, bool>> as input and returns an IQueryable,\
    \ whereas the IEnumerable takes a Expression<Func<Person, bool>> as input and\
    \ returns an Enumerable.\n\n```\npeopleQuery.Where(p => p.FirstName == \"Sander\"\
    ).ToList();\n```\n\n```\n(extension) IQueryable<Person> IQueryable<Person>.Where<Person>(System.Linq.Expressions.Expression<Func<Person,\
    \ bool>> predicate)\nFilters a sequence of values based on a predicate.\n```\n\
    \nFigure 10: IQueryable.Where\n\n```\npeopleEnum.Where(p => p.FirstName == \"\
    Sander\").ToList();\n```\n\n```\n(extension) IEnumerable<Person> IEnumerable<Person>.Where<Person>(Func<Person,\
    \ bool> predicate)\nFilters a sequence of values based on a predicate.\n```\n\n\
    Figure 11: IEnumerable.Where\n\nThe Expression<SomeType, bool> is basically a\
    \ representation of the SomeType, bool as an object graph. Instead of passing\
    \ a method in the IEnumerable, you pass in an object that represents the method.\
    \ In this case the compiler creates the object graph, so you don't need to worry\
    \ about\n\nIn the previous example, that means the IEnumerable enumerates over\
    \ the collection, forcing a roundtrip to the database (all, the IEnumerable variable\
    \ is actually an IQueryable), and after that does it execute the function. As\
    \ a result, you'll ALL people from the database instead of just with the FirstName\
    \ \"Sander\". Be very careful that you don't accidentally break your IQueryable\
    \ chain.\n\nJust for fun, here's the Expression<Person, bool> the compiler created\
    \ from that lambda expression.\n\nCode Line 38: Expression<Person, bool>>\n\n\
    ```\nParameterExpression parameter = Expression.Parameter(typeof(Person), \"p\"\
    );\nExpression property = Expression.Property(parameter,\ntypeof(Person).GetProperty(\"\
    FirstName\"));\nExpression constant = Expression.Constant(\"Sander\");\nExpression\
    \ binary = Expression.Equal(property, constant);\nExpression<Func<Person, bool>>\
    \ lambda = Expression.Lambda<Func<Person,\nbool>>(binary, parameter);\npeopleQuery.Where(lambda).ToList();\n\
    ```\n\nThis means that when you want to add your own (extension) methods, you'll\
    \ have to keep in mind that you're doing Expressions. And if you want to create\
    \ other types of abstraction, you might even need to create your own manually.\
    \ Creating Expressions is little too advanced for this, but let's take a look\
    \ at an extension method.\n\nWhat happens if you want to include, for example,\
    \ additional select logic in your extension method? Just be sure to put in an\
    \ Expression. Failing to do so will give no errors or warnings, but will call\
    \ the method on IEnumerable, forcing a database call before your action executes.\n\
    \n## Code Listing 39: Extension with selector\n\n```sharp\npublic static List<T>\
    \ SelectOlderThan<T>(this IQueryable<Person> q, int\nage,\nExpression<Func<Person,\
    \ T>> selector)\n{\n    return q\n    .Where(p => (DbFunctions.DiffHours(p.DateOfBirth,\
    \ DateTime.Today) /\n8766) > age)\n    .Select(selector)\n    .ToList();\n}\n\
    ```\n\nUsage is, again, pretty straightforward.\n\n## Code Listing 40: Usage of\
    \ SelectOlderThan\n\n```c\nvar people = context.People.SelectOlderThan(45, p =>\n\
    {\n    Name = p.FirstName,\n    DateOfBirth = p.DateOfBirth\n});\n```\n\n## CRUD\n\
    \nLet's check out the CRUD operations. You won't believe how easy it is.\n\n##\
    \ Code Listing 41: CRUD operations\n\n```csharp\nusing (var context = new SuccinctlyExamplesEntities())\n\
    {\n    // Update Sander\n    Person sander = context.People.FirstOrDefault(p =>\
    \ p.FirstName ==\n    \"Sander\");\n    sander.FirstName = \"John\";\n\n    //\
    \ Create Google CEO.\n    Person sundar = new Person();\n    sundar.FirstName\
    \ = \"Sundar\";\n    sundar.LastName = \"Pichai\";\n    sundar.DateOfBirth = new\
    \ DateTime(1972, 7, 12);\n    sundar.GenderId = 1;\n    context.People.Add(sundar);\n\
    \n    // Delete Mark Zuckerberg.\n    Person mark = context.People.FirstOrDefault(p\
    \ => p.FirstName ==\n    \"Mark\");\n    context.People.Remove(mark);\n}\n```\n\
    \n```csharp\ncontext.SaveChanges();\n}\n```\n\nThat's all there is it! It's so\
    \ easy, you don't really need further explanation.\n\nRemember that I said \"\
    SELECT * ...\" can be very harmful to a system. What we're doing now is basically\
    \ that. If we update our model and Person gets 100 new fields, system suddenly\
    \ gets a lot slower. We can fix this using Select.\n\n## Code Listing 42: Using\
    \ Select\n\n```csharp\nusing (var context = new SuccinctlyExamplesEntities())\n\
    {\n  // Using an anonymous type.\n  var satyaAnon = context.People.Where(p =>\
    \ p.FirstName == \"Satya\")\n  .Select(p => new\n  {\n      Id = p.Id,\n     \
    \ FirstName = p.FirstName,\n      LastName = p.LastName\n  }).SingleOrDefault();\n\
    \  // Use the anonymous type here...\n\n  // Using a known type.\n  PersonModel\
    \ satyaKnown = context.People.Where(p => p.FirstName == \"Satya\")\n  .Select(p\
    \ => new\n  {\n      Id = p.Id,\n      FirstName = p.FirstName,\n      LastName\
    \ = p.LastName\n  }).SingleOrDefault();\n  // ... logic continues (Wait, the source\
