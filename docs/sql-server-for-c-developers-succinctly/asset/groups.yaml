    \ ASC\n```\n\n建立此索引后，再次运行之前的查询（并带上所有的 DBCC FREEPROCCCACHE），第一个查询看起来肯定会有所不同！它现在对\
    \ IX_SalesOrderHeader_OrderDate 执行了索引查找（Index Seek），这对于这个特定查询要好得多。\n\n遗憾的是，我们无法在每个查询之前都执行\
    \ DBCC FREEPROCCCACHE。事实上，除非你确定自己正在进行嗅探（sniffing），否则永远不要在生产服务器上运行 DBCC FREEPROCCCACHE。运行以下查询并检查查询计划，你将看到参数嗅探的影响。\n\
    \n# 代码列表 69：参数嗅探\n\n```\nDBCC FREEPROCCCACHE\nEXECUTE GetOrdersBy @OrderDate ='20100101'\n\
    EXECUTE GetOrdersBy @OrderDate ='20120101'\nEXECUTE GetOrdersBy @OrderDate ='20150101'\n\
    ```\n\n现在每次执行的查询计划又变得相等了。遗憾的是，对于 2012 和 2015 年的日期来说，这远非最优。此时，你可能会想：“为什么它会使用如此次优的计划？”或“为什么我的查询这么慢？”当你悬停在查询计划中的某个节点上时，你可以看到可能有助于查明问题错误的各种统计信息。\n\
    \n# 索引查找 (非聚集)\n从非聚集索引中扫描特定范围的行。\n\n索引查找 (非聚集)\nIX_SalesOrderHeader_OrderDate\n\
