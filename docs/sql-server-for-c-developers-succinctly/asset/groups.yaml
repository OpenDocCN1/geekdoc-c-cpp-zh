    One of the two queries should return an error: Msg 1205, Level 13, State 51, Line
    7


    Transaction (Process ID 54) was deadlocked on lock resources with another process
    and has been chosen as the deadlock victim. Return the transaction.


    The transaction of that query is automatically rolled back. In the other window,
    you can manually execute ROLLBACK Tran.


    You can track locks and deadlocks using the SQL Profiler. Open a new session,
    unselect all events, and select the Deadlock graph event under Locks. If you repeat
    the previous steps, you will get an event and a graph. It should look something
    like this.


    ![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_85_0.png)


    Figure 31: A deadlock graph


    The ovals are the queries in the deadlock, and the objects that were locked and
    requested. Deadlock graphs can get very complicated, having tens of arrows and
    rectangles.


    We already have two methods of fixing locks that will fix all deadlocks: using
    SNAPSHOT ISOLATION and lowering your ISOLATION LEVEL to READ UNCOMMITTED. Another
    method that will prevent deadlocks is to access database objects in the same order.
    Unfortunately, that''s not always easy or possible. Keeping transactions short
    so the chances of (dead) locking are minimized.


    ## Dynamic management views


    Knowing a little more on how to get a grip on queries, plans, and other data may
    be very useful. SQL Server has what are called dynamic management views, or DMVs.
    The structure of your database, tables, procedures, and practically everything
    in your database is stored in these views. For example, the following query lists
    all tables (twice).


    ```sql

    SELECT * FROM sys.tables

    SELECT * FROM INFORMATION_SCHEMA.TABLES

    ```


    You can find the views in the Object Explorer under Views and then System Views.
    You''ll find views called sys.something and a few INFORMATION_SCHEMA_VIEWS. INFORMATION_SCHEMA
    views are standards, and when you use them in your queries, in theory, make them
    work in Oracle, MySQL or any other SQL database that adheres to ISO standards.
    There are about twenty INFORMATION_SCHEMA DMVs, and (I''m guessing) well over
    a hundred sys DMVs, so you just go with the views, as all you need.


    Next to the DMVs, there are system SPs and functions. You can find them under
    Programmability > Stored Procedures > System Stored Procedures > Programmability
    Functions > System Functions. You can simply scroll through them and try them
    out. You''ll probably have been using many functions, such as CAST, MAX, and CURRENT_TIMESTAMP.


    Let''s move on to the good stuff. We are talking query plans. There is a view
    called sys.dm_exec_cached_plans which has a list of all cached plans. Data in
    it is a little cryptic, in its current form, it''s of no use to us.


    ```sql

    SELECT *

    FROM sys.dm_exec_cached_plans

    ```


    | objid | userscount | size_in_pages | memory_address | cachetype | dbtype | plan_handle
    | plan_id | parent_plan_handle |

    |---|---|---|---|---|---|---|---|---|

    | 21915 | 2 | 32768 | 0000000046E5A4E0 | Compiled | Adhoc | 0x00000007B5C4C31E76000000000000000
    | 1 | NULL |

    | 4049 | 2 | 4096 | 0000000046E5A4E0 | Compiled | Adhoc | 0x00000007B5C4C31E7600000000000000
    | 1 | NULL |

    | 26173 | 2 | 32768 | 0000000046E5A4E0 | Compiled | Adhoc | 0x00000007B5C4C31E7600000000000000
