    # Code Listing 90: A blocking query


    ```

    BEGIN TRAN

    UPDATE Production Product

    SET Name = ''Adjustable Racer''

    WHERE ProductID = 1

    ```


    SQL Server locks the row for ProductID 1 Different kinds of locks exist, and SQL
    Server will determine the best locking strategy, depending on your query. For
    example, not specifying a WHERE clause would probably end up in a table lock.
    While a certain is locked, rows, pages, tables, and other objects can''t access
    it. Usually a lock is lifted when a transaction completes and never committed
    or rolled back. The transaction will just stay open and lock this row. Locking
    is not a bad thing, though; it prevents other processes querying data that is
    not committed, preventing dirty reads.


    Open a new window and execute the following query.


    # Code Listing 91: A blocked query


    ```

    SELECT *

    FROM Production.Product

    WHERE ProductID = 1

    ```


    You will notice this query will start executing and simply never complete. It''s
    actually waiting for our first query to complete.


    There are a few fixes here. First of all, we should examine why our first query
    is taking so long to complete and if we can rewrite it so it finishes sooner.
    Second, we could set our TRANSACTION ISOLATION LEVEL to (READ COMMITTED) SNAPSHOT.
    This means that whenever SQL Server locks a resource, it makes a copy of resource
    and then uses the copy when selecting data, or your SELECT queries aren''t blocked,
    but return committed data.


    SNAPSHOT ISOLATION is not in the scope of this, but a quick Google Search will
    not give you a lot of resources on the subject. I''m going to show you here how
    to set the ISOLATION LEVEL of the SELECT query to READ UNCOMMITTED so that it
    will read uncommitted data. In many cases this is a fine solution, since cases
    of dirty reads (reading uncommitted data) are very small, and dirty reads may
    be acceptable. If your SELECT query is running, you can stop it by hitting the
    Cancel Executing Query button or with Alt + Break. Alternatively, you could return
    to the UPDATE query window and execute ROLLBACK TRAN, causing the transaction
    to end and the SELECT query to finish. If you decide to end your transaction,
    be sure to start it again for the following example.


    So, assuming you have a lock on ProductID 1, you can tell a SELECT query to do
    dirty by giving it the NOLOCK hint.


    # Code Listing 77: Dirty reads WITH (NOLOCK)


    ```

    SELECT *

    FROM Production.Product WITH (NOLOCK)

    WHERE ProductID = 1

    ```'
  - '[PAGE 84]


    If you have multiple statements and would like to execute them all using dirty
    reads, you can set your TRANSACTION ISOLATION LEVEL instead.


    # Code Listing 78: Dirty reads with READ UNCOMMITTED


    ```

    SET TRANSACTION ISOLATION LEVEL READ UNCOMMITTED


    SELECT *

    FROM Production.Product

    WHERE ProductID = 1

    ```


    Both queries will return instantly, even when your other transaction is still
    running. However, both queries will return Name Adjustable Racers, which is not
    committed. However, rollback your UPDATE query, and no one will ever be able to
    get Adjustable Racers ever again.


    A connection usually has a timeout (the default is 30 seconds). This means that
    when a query is started from C# and takes over 30 seconds to complete, or is blocked
    for at least 30 seconds, you''ll get a TimeoutException.


    When one transaction is waiting for another transaction, and then that other transaction
    requests a resource that is locked by the first transaction, you''re having a
    deadlock. The concept of deadlocks should be familiar to programmers, as multithreaded
    applications can run into the same problems.


    Let''s fake a deadlock. Open up a query window and execute the following.


    # Code Listing 79: A locking query


    ```

    BEGIN TRAN


    UPDATE Production.Product

    SET Name = ''Adjustable Racer''

    WHERE ProductID = 1

    ```


    Now open up another query window, make it wait for the open transaction, and lock
    another resource.


    # Code Listing 80: A locking and waiting query


    ```

    BEGIN TRAN


    UPDATE Production.Location

    SET Name = ''Tool Cribs''

    WHERE LocationID = 1


    SELECT *

    FROM Production.Product

    WHERE ProductID = 1

    ```


    Go back to the first window, where the transaction is still open, and request
    LocationID 1, which is locked.'
