    \ there is no FullName column in your table, be sure to run your queries against\
    \ your actual data source. You might be surprised that the following query will\
    \ work as expected.\n\n# Code Listing 35: Valid code\n\n```\nusing (var context\
    \ = new SuccinctlyExamplesEntities())\n{\n    List<Person> peopleWithS = context.People\n\
    \        .Where(p => p.FirstName.ToLower() == \"sander\")\n        .ToList();\n\
    }\n```\n\nThe ToLower function is known in SQL, and the EF team will make that\
    \ this function translates correctly. In theory, the StartWith function can be\
    \ translated to SQL (SQL's LEFT) as, but this is not supported. For some additional\
    \ functions (such as LEFT, RIGHT, DIFFDAYS, etc.), check out the System.Data.Entity.Dbfunctions\
    \ and System.Data.Entity.SqlServer.Sqlfunction classes. It's also possible to\
    \ add your own functions to EF, but this is outside the scope of this book.\n\n\
    There is another pitfall to the previous example. Consider the following code.\n\
    \n# Code Listing 36: Lazy-loading\n\n```\nusing (var context = new SuccinctlyExamplesEntities())\n\
    {\n    List<Gender> genders = context.Genders.ToList();\n    foreach (Gender g\
    \ in genders)\n    {\n        foreach (Person p in g.Description)\n        {\n\
    \            Console.WriteLine(\"{p.FirstName} is a {g.Description}\");\n    \
    \    }\n    }\n}\n```\n\nHow often will this code access the database? The only\
    \ correct answer is \"I don't know.\\ We get all the possible genders, which is\
    \ one database call. But then we loop through the genders and we're accessing\
    \ the People of that Gender. Guess what? The People are not yet loaded into our\
    \ memory, each time we access Person, EF will access the database to get all people\
