    \n创建数据库项目的另一种方法是，即使你没有现有数据库，也可以通过启动新项目并从已安装的模板中选择 SQL Server 数据库项目。在新项目中，你可以创建对象并部署它们，或者通过在解决方案管理器中右键点击你的数据库项目，选择“导入”，然后选择“数据库”来导入现有数据库。\n\
