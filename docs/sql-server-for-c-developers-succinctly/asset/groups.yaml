    ## 第6 章 故障排除


    查询偶尔会出问题。不幸的是，这可能有许多原因。也许你的数据库已经增长到这种程度，使得以前一直运行良好的查询现在变得非常缓慢。也许你的某一个环境缺少了索引。也许一个带有缓存查询计划的查询对于当前的参数值来说并不是最优的。在本章中，我们将介绍如何识别有问题的查询以及如何解决这些问题。


    为了几个示例，我们需要一个稍微规模的数据库。微软提供了一个名为 Adventure Works 的示例数据库可以使用。你可以从 CodePlex 下载它。或者，你可以在
    Google（或 Bing）搜索 AdventureWorks2014 看看会出现什么结果。下载 Adventure Works 2014 Full Database
    Backup.zip 文件并解压 .bak 文件。在 SSMS 中，在对象资源管理器中右键点击“数据库”，然后点击“还原...”。在还原窗口中，启用“设备”，点击
    `...` 按钮，并添加你刚刚解压的文件。然后只需点击“确定”，数据库就可以使用了。


    ![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_66_0.png)


    图 20：还原 Adventure Works


    ## 性能分析


    首先，我们需要知道哪些查询运行缓慢。对于此（以及许多其他情况），我们可以使用性能调优器（profiler）。我建议在开发时经常使用性能分析器，因为它能向你展示数据库中发生的所有事情。例如，你可能有一段性能良好的代码，但它之所以良好可能是因为你正在本地进行测试且数据很少。性能分析器可能会显示，你实际上正在向数据库发送成千上万次查询（因为
    EF 的延迟加载，或者因为你在循环中执行查询）。我经常遇到这样的场景：在测试环境中运行得很顺畅，但在生产环境中会让数据库陷入停滞（而这永远是令人担心）。


    要启动性能分析器，请使用 SSMS，在菜单中转到“工具”和“SQL Server 分析器”。你也可以从开始菜单中作为独立应用程序运行它（只要你在那里安装了它）。如果你从
    SSMS 启动，它会自动启动一个新的跟踪。如果你从 Windows 启动，可以在“文件”菜单下找到“新建跟踪”。接下来，你必须登录你想要跟踪的实例。在跟踪生产环境时要小心，因为它会给系统带来负载。连接到本地实例，得到一个名为“跟踪属性”的窗口。在“常规”选项卡上，你可以为跟踪命名、保存到文件或选择一个模板。我们将忽略这一点。相反，请转到“事件选择”选项卡。在此选项卡上，你可以找到由数据库触发的所有类型的事件。其中已经为你勾选了几个，但还有很多。勾选“显示事件”和“显示所有列”复选框，你就会明白我的意思了。在以下事件中：Stored
    Procedures -> RPC:Completed 和 SP:BatchCompleted 以及 TSQL -> SQL:BatchCompleted。现在运行它以进行跟踪。


    ![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_67_0.png)


