    | 1 | NULL |


    Figure 32: sys.dm_exec_cached_plans


    The plan_handle is very useful. Now that we have the plan_handle and the query_plan,
    we want the actual query. Another function called sys.dm_exec_sql_text has a plan_handle
    as input. We also have the text and database ID. We can get the database name
    from DB_ID(database_name).


    ```sql

    SELECT plan_handle, query_plan, [text]

    FROM sys.dm_exec_cached_plans cp

    CROSS APPLY sys.dm_exec_query_plan(plan_handle) AS q

    CROSS APPLY sys.dm_exec_sql_text(plan_handle) AS st

    WHERE cp.[dbid] = DB_ID(''AdventureWorks014'')

    ```


    Now here is a peculiar thing: open a new query window and run DBCC FREECACHE.
    Remove it, and in the same window, run SELECT * FROM Person (or whatever you like).
    Empty the query window again and run SET ARITHORT OFF. Clear the query window
    and run SELECT * FROM Person.Person. Now list the query plan, and you will see
    that SELECT * FROM Person.Person is listed twice! But how could this be? Isn''t
    a query plan reused by SQL Server unless the query is exactly the same and certain
    settings are the same as well? ARITHORT is one that will trigger SQL to create
    a new plan if the setting differs from a currently stored plan. These settings
    can be retrieved using the function sys.dm_exec_plan_attributes. There are a lot
    of attributes, and their values are stored together in a single value, which is
    completely unheard. Luckily SQL Server MVP Erlandson has written a lengthy (but
    very good and detailed) article about this. This is especially relevant in "Plans
    for Different Settings". I''m going to use this trick to get all these attributes
    on one line; you can read his blog to make sense of it all.


    ## Code List 84: list plan attributes


    ```sql

    SELECT cp.plan_handle, q.query_plan, [text], attrlist

    FROM sys.dm_exec_cached_plans cp

    CROSS APPLY sys.dm_exec_query_plan(plan_handle) AS q

    CROSS APPLY sys.dm_exec_query_text(plan_handle) AS st

    CROSS APPLY ep.attribute = ''='' + convert(nvarchar(127), ep.value)

    FROM sys.dm_exec_plan_attributes(plan_handle) ep

    WHERE ep.is_cache_key = 1

    ORDER BY ep.attribute

    FOR XML PATH('''') AS attrlist

    WHERE q.[dbid] = DB_ID(''Adventureworks014'')

    ```


    The takeaway is that SQL Server creates a plan based on certain settings. ARITHORT
    is a very nasty one, too. When you''re running a query from C# code through ADO.NET
    or Entity Framework, ARITHORT is set to OFF by default. Whenever your application
    is running slowly because of some query, and you''re running the query in SSMS,
    it will probably be lightning-fast—it will create a new plan because ARITHORT
    is different. I have been stumbling in the dark for reasons not knowing about
    this!


    Now that you know how to get the query plan for a single query, it is also possible
    to delete this plan from the cache. We have used DBCC FREECACHE to delete all
    plans from the cache, but you can use the plan_handle to delete just that one.
    Grab the handle and pass it to DBCC FREECACHE.


    ## Code List 100: DBCC FREECACHE (plan_handle)


    ```sql

    DBCC FREECACHE (0x060007003A0E5604409D1360400000000000000000000000000000000000000000000000)

    ```


    Another DMV we can use is sys.dm_tran_locks. It shows currently active requests
    to the lock manager. Additionally, sys.dm_os_waiting_tasks shows all sessions
    that are currently waiting on a lock resource. By combining the two, we get the
    sessions that are currently waiting to acquire a lock along with the lock information.


    Code Listing 101: List blocked sessions


    ```sql

    SELECT *

    FROM sys.dm_tran_locks tl

    JOIN sys.dm_os_waiting_tasks owt ON tl.lock_owner_address = owt.resource_address

    ```


    The most interesting columns right now are the request_session_id in dm_tran_locks
    (which should correspond to the session_id in dm_os_waiting_tasks) and the blocking_session_id
    in dm_os_waiting_tasks. We can use these columns to get the associated sessions
    from sys.dm_exec_connections.


    Code Listing 85: List blocked connections


    ```sql

    SELECT *

    FROM sys.dm_tran_locks tl

    JOIN sys.dm_os_waiting_tasks owt ON tl.lock_owner_address = owt.resource_address

    JOIN sys.dm_exec_connections ew ON ew.session_id = tl.request_session_id

    JOIN sys.dm_exec_connections ec ON ec.session_id = owt.blocking_session_id

    ```


    The dm_exec_connections view has a column most_recent_session_handle. This is
    the last query that was executed by the session, and must be the queries that
    are currently blocking and waiting. We have already seen how to get the query
    text and plan from a sql_handle, so we can apply that here. Furthermore, a lock
    is requested on some partition, as indicated by the resource_associated_entity_id
    in dm_tran_locks. The partition belongs to an object, so this is how we get the
    object ID, which we can then use to get the object name. If we filter out fields,
    we''re left with a resulting table that''s actually readable.


    Code Listing 86: List blocked queries


    ```sql

    SELECT tl.request_session_id

    owt.blocking_session_id

    tl.resource_type

    waiting_text [text] AS WaitingText

    blocking_text [text] AS BlockingText

    OBJECT_NAME(p.object_id) AS ObjectName

    FROM sys.dm_tran_locks tl

    JOIN sys.dm_os_waiting_tasks owt ON tl.lock_owner_address = owt.resource_address

    JOIN sys.dm_exec_connections ew ON ew.session_id = tl.request_session_id

    JOIN sys.dm_exec_connections ec ON ec.session_id = owt.blocking_session_id

    JOIN sys.partitions p ON p.partition_id = tl.resource_associated_entity_id

    ```

