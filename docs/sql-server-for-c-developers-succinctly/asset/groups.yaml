  - "[PAGE 75]\n\nYou have to know thing about SQL Server when dealing with plans.\
    \ SQL Server keeps all kinds of statistics internally. When you're going to execute\
    \ this procedure, SQL Server will inspect @OrderDate and make some assumptions\
    \ based on its statistics. That makes things a little easier for us. At this point\
    \ we know there is no index on OrderDate. As a result, so many rows, SQL Server\
    \ will just scan the table for each value we assign to @OrderDate. We can simply\
    \ test this by executing this query with a few values and inspecting the plan.\n\
    \n```\nCode Listing 80: Multiple plans for the same query\n```sql\nDBCC FREEPROCACHE\n\
    EXECUTE GetOrdersByDate @OrderDate = '20100101'\nDBCC FREEPROCACHE\nEXECUTE GetOrdersByDate\
    \ @OrderDate = '20120101'\nDBCC FREEPROCACHE\nEXECUTE GetOrdersByDate @OrderDate\
    \ = '20150101'\n```\n```\n\nDBCC FREEPROCACHE clears all queries from the cache,\
    \ so we know SQL Server isn't reusing any plans. We get the plan for each parameter.\n\
    \nQuery 1: Query cost (relative to the batch): 33%\nSELECT * FROM Sales.SalesOrderHeader\
    \ WHERE OrderDate < @OrderDate\n\n![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_75_0.png)\n\
    \nQuery 2: Query cost (relative to the batch): 33%\nSELECT * FROM Sales.SalesOrderHeader\
    \ WHERE OrderDate < @OrderDate\n\n![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_75_1.png)\n\
    \nQuery 3: Query cost (relative to the batch): 35%\nSELECT * FROM Sales.SalesOrderHeader\
    \ WHERE OrderDate < @OrderDate\n\n![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_75_2.png)\n\
    \nFigure 29: Equal plans\n\nThat isn't helping our example very much. It also\
    \ seems, @OrderDate = '20100101' returns 0 rows, that a table scan isn't optimal.\
    \ So let's make SQL Server know this. Let's put an index on OrderDate.\n\n```\n\
    Code Listing 81: Index on OrderDate\n```sql\nCREATE NONCLUSTERED INDEX IX_SalesOrderHeader_OrderDate\n\
    \ Sales.SalesOrderHeader\n```\n```"
  - '[PAGE 76]


    [OrderDate] ASC


    With this index in place, run the previous query again, with all the DBCC FREEPROCCCACHE,
    and surely the first query will look a little different! It now does Index Seek
    on IX_SalesOrderHeader_OrderDate, which is a lot better for this particular query.


    Unfortunately, we can''t go around and execute DBCC FREEPROCCCACHE before every
    query. In fact, never run DBCC FREEPROCCCACHE on a production server unless you
    know you''re sniffing. Running the following query, check the query plans, and
    you will see the effects of parameter sniffing.


    # Code Listinging 69: Parameter sniffing


    ```

    DBCC FREEPROCCCACHE

    EXECUTE GetOrdersBy @OrderDate =''20100101''

    EXECUTE GetOrdersBy @OrderDate =''20120101''

    EXECUTE GetOrdersBy @OrderDate =''20150101''

    ```


    The query plans are now equal again for each execution. Unfortunately, this is
    far from optimal order dates 2012 and 2015. At this point you may be wondering,
    “Why did it use such suboptimal plans?” or “Why is my query so slow?” When you
    hover over a node in the query plan, you get to see all kinds of statistics that
    may be helpful in figuring out what went wrong.'
