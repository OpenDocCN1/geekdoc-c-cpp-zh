- md: "\nIn the Package Console, type **update-database**, and your database will\
    \ be updated. You can run your code and query against an updated database. Make\
    \ sure you don't give two migrations the same name, or you will get name conflicts\
    \ in your C# code.\n\nNow add property to Person, for example, int Age, and run\
    \ another migration **\"Add Person.Age\"** and **update-database**. Unfortunately,\
    \ for whatever reason, your last database change has been rolled back. Luckily,\
    \ Up and Down methods are generated, so this should be easy. To revert migrations,\
    \ simply update to an older migration and new migrations will be rolled back.\
    \ In the console, type **\"update-database -TargetMigration:Add Person.FullName\"\
    ** and run it. Add Person.Age will be reverted.\n\nAs I was playing around migrations,\
    \ I created FullName, then removed it, and again, as a result with two C classes\
    \ AddPersonFullName. No problem, I deleted the oldest and ran my. However, when\
    \ rolling back, I got a conflict as AddPerson.FullName was ambiguous. Luckily,\
    \ everything you have to do is delete **dbo__MigrationHistory** and simply run\
    \ **\"update-database -TargetMigration:201605211180341_AddPersonFullName\"** to\
    \ remove the ambiguity, without a lot of tedious manual.\n\n| Migration | Context\
    \ | Model | ProductVersion |\n|---|---|---|---|---|\n| 1 | 20160521141034_InitialCreate\
    \ | CodeFirst.Migrations.Configuration | 0xF1B8000000000000A0D5ED64D32BED36BE181FFBFFFF74B\
    \ | 6.1-4.3002 |\n| 2 | 20160521141572_AutomaticMigration | CodeFirst.Migrations.Configuration\
    \ | 0xF1B8000000000000A0D5ED64D32BED36BE181FFB1FF74B | 6.1-4.3002 |\n| 3 | 20160521141931_AutomaticMigration\
    \ | CodeFirst.Migrations.Configuration | 0xF1B8000000000000A0D5ED64D32BED36BE367C0FE41D3\
    \ | 6.1-4.3002 |\n| 4 | 20160521142035_AutomaticMigration | CodeFirst.Migrations.Configuration\
    \ | 0xF1B8000000000000A0D5ED64D32BED36BE181FFBFF74B | 6.1-4.3002 |\n| 5 | 20160521142205_AutomaticMigration\
    \ | CodeFirst.Migrations.Configuration | 0xF1B8000000000000A0D5ED64D32BED36BE361727FF2E5A\
    \ | 6.1-4.3002 |\n| 6 | 20160521144406_AutomaticMigration | CodeFirst.Migrations.Configuration\
    \ | 0xF1B8000000000000A0D5ED64D32BED36BE181FFBFF74B | 6.1-4.3002 |\n| 7 | 20160521151427_Add\
    \ PersonFullName | CodeFirst.Migrations.Configuration | 0xF1B8000000000000A0D5ED64D32BED36BE361727FF2E5A\
    \ | 6.1-4.3002 |\n| 8 | 20160521152319_Add PersonFullName | CodeFirst.Migrations.Configuration\
    \ | 0xF1B8000000000000A0D5ED64D32BED36BE181FFBFF74B | 6.1-4.3002 |\n| 9 | 20160521157438_Add\
    \ PersonFullName | CodeFirst.Migrations.Configuration | 0xF1B8000000000000A0D5ED64D32BED36BE181FFBFF74B\
    \ | 6.1-4.3002 |\n| 10 | 20160521180258_AutomaticMigration | CodeFirst.Migrations.Configuration\
    \ | 0xF1B8000000000000A0D5ED64D32BED36BE181FFBFF74B | 6.1-4.3002 |\n| 11 | 20160521180431_Add\
    \ PersonFullName | CodeFirst.Migrations.Configuration | 0xF1B8000000000000A0D5ED64D32BED361D70D2F0D7FEB9\
    \ | 6.1-4.3002 |\n| 12 | 20160521189453_Add Person.Age | CodeFirst.Migrations.Configuration\
    \ | 0xF1B8000000000000A0D5ED64D32BED361D1FF2E69 | 6.1-4.3002 |\n\nAnother option\
    \ for you is to get the actual SQL script that generates migrations. For example,\
    \ I added Person.FullName and generated the script. You can generate it using\
    \ **update-database -Script** from the Package Console. You'll get the following\
    \ script.\n\nFigure 13: Generated SQL\n```sql\nALTER TABLE [dbo].[Person] ADD\
    \ [FullName] [nvarchar](max)\nINSERT [dbo].[__MigrationHistory] ([Context], [Model],\
    \ [ProductVersion])\nVALUES ('20160521141034_InitialCreate', 'CodeFirst.Migrations.Configuration',\
    \ 0xF1B8000000000000A0D5ED64D32BED36BE181FFBFFFF74B', '6.1-4.3002')\n```\n\n##\
    \ Seeds\n\nAnother thing that makes CodeFirst pretty cool is the ability to seed\
    \ your database with initial data. You may have already noticed when we created\
    \ the Configuration class, but there is a Seed method with some example in the\
    \ code. Let's make sure we have our Genders in place and a Person to use for testing.\n\
    \nCode Listing 57: The Seed method\n```csharp\nprotected override void Seed(CodeFirstContext\
    \ context)\n{\n    context.Genders.AddOrUpdate(new[]\n    {\n        new Gender\
    \ { Id = 0, Code = \"UNKNOWN\", Description = \"Not saying\" },\n        new Gender\
    \ { Id = 1, Code = \"MALE\", Description = \"Male\" },\n        new Gender { Id\
    \ = 2, Code = \"FEMALE\", Description = \"Female\" }\n    });\n    context.Person.AddOrUpdate(p\
    \ =>\n    {\n        FirstName = p.FirstName,\n        LastName = p.LastName\n\
    \    },\n    new Person\n    {\n        FirstName = \"Sander\",\n        LastName\
    \ = \"Rosell\",\n        GenderId = 1\n    });\n}\n```\n\nWe can simply insert\
    \ our Genders. EF will check if the ID is already present in the database and\
    \ insert or update based on that. The Id of Gender is not an autounumber field,\
    \ so we have to set it itself. The Id of a Person is not known to us, since it's\
    \ autounumber. With autounumbering, there is no way for us to insert a Person\
    \ with a specific Id, and EF will just insert the same Person every time (giving\
    \ it some autounumber). We can however, specify an alternative means of looking\
    \ up a specific entity. This is the method to AddOrUpdate which takes an anonymous\
    \ object containing all the fields that make up a unique Person. In this example,\
    \ I've taken the combination of FirstName and LastName not present in the database,\
    \ EF will insert the Person, otherwise it will do an update. If you run the code,\
    \ these rows will be inserted into the database if they're not present.\n\nIf\
    \ you would like to start with a fresh database (including an initial test set)\
    \ every time you start your debug session, you may opt for a custom DatabaseInitializer.\
    \ I already mentioned a few, so let's create one. The following initializer will\
    \ always recreate a database and seed some data.\n\nCode Listing 58: A custom\
    \ DatabaseInitializer\n```csharp\npublic class CleanDbInitializer :\n    DropCreateDatabaseAlways<CodeFirstContext>\n\
    {\n    protected override void Seed(CodeFirstContext context)\n    {\n       \
    \ context.Genders.AddOrUpdate(new[]\n        {\n            new Gender { Id =\
    \ 0, Code = \"UNKNOWN\", Description = \"Not saying\" },\n            new Gender\
    \ { Id = 1, Code = \"MALE\", Description = \"Male\" },\n            new Gender\
    \ { Id = 2, Code = \"FEMALE\", Description = \"Female\" }\n        });\n     \
    \   context.People.AddOrUpdate(p =>\n        {\n            FirstName = p.FirstName,\n\
    \            LastName = p.LastName\n        },\n        new Person\n        {\n\
    \            FirstName = \"Sander\",\n            LastName = \"Rosell\",\n   \
    \         GenderId = 1\n        });\n    }\n}\n```\n\nTo get it working, simply\
    \ go to your DbContext and change the constructor. Make sure you don't have any\
    \ migrations (delete the Migrations folder), or your database won't actually get\
    \ deleted, and you will get an exception.\n\nCode Listing 59: Usage of CleanDbInitializer\n\
    ```csharp\npublic CodeFirstContext()\n    : base(\"CodeFirst\")\n{\n    Database.SetInitializer(new\
    \ CleanDbInitializer());\n}\n```\n\nIt is also possible to change the initialization\
    \ using your App.config or Web.config file. Simply remove the SetInitializer from\
    \ your DbContext constructor and add the following value in your config file.\n\
    \nCode Listing 60: MigrateDatabaseToLatestVersion with Configuration in config\n\
    ```xml\n<contexts>\n  <context type=\"CodeFirst.CodeFirstContext, CodeFirst\"\
    >\n    <databaseInitializer\n      type=\"System.Data.Entity.MigrateDatabaseToLatestVersion`2[[CodeFirst.DbContext,\
    \ CodeFirst],\n      [CodeFirst.Migrations.Configuration, CodeFirst]], EntityFramework\"\
    />\n  </context>\n</contexts>\n```\n\nNow we're switching to our custom initializer.\n\
    \nCode Listing 70: Custom initializer in config\n\nAs you can see, by using Code\
    \ First, Migrations, and Seeds, working with multiple local database instances\
    \ becomes easier.\n\n## Chapter 5 SQL Server Data Tools\n\nUsing Visual Studio\
    \ SQL Data Tools, you can create databases in pretty much the same way you see\
    \ in SQL Server Management Studio. It gets better though—you can compare and deploy\
    \ databases with ease.\n\n## Database Project\n\nStart Visual Studio—you don't\
    \ even have to start or open a project. In the menu, go to View and then SQL Server\
    \ Object Explorer. You should now get a window on the right or left side of the\
    \ screen (depending on your settings) showing two nodes, SQL Server and Projects.\
    \ Right-click SQL Server and click Add SQL Server. You should now see a tree view\
    \ similar to that in SSMS.\n"
  mdcn: "\n在包控制台（Package Console）中，输入 **update-database**，你的数据库将会更新。你可以针对更新后的数据库运行代码并进行查询。确保不要为两个迁移设置相同的名称，否则你会在\
    \ C# 代码中遇到名称冲突。\n\n现在向 Person 类中添加一个属性，例如 `int Age`，然后运行另一个迁移 **\"Add Person.Age\"\
    ** 并执行 **update-database**。遗憾的是，由于某种原因，你最后的数据库更改被回滚了。幸运的是，系统生成了 Up 和 Down 方法，所以这应该很简单。要撤销迁移，只需更新到旧版本的迁移，新的迁移就会被回滚。在控制台中，输入\
    \ **\"update-database -TargetMigration:Add Person.FullName\"** 并运行它。Add Person.Age\
    \ 将被回滚。\n\n在我尝试迁移时，我创建了 FullName，然后将其删除，结果再次导致了两个 C 类 AddPersonFullName。没问题，我删除了最旧的并运行了它。然而，在回滚时，我遇到了一个冲突，因为\
    \ AddPerson.FullName 具有歧义。幸运的是，你所做的只是删除 **dbo__MigrationHistory**，然后只需运行 **\"\
