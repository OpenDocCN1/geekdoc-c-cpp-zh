    # Execution Plan. For some extra information, run the following statements in
    your query window.


    Code Listing 74: Enabling statistics


    ```

    SET STATISTICS ON

    SET STATISTICS TIME ON

    ```


    These statistics will be shown in your Messages tab after you run a query. You
    can delete the statements from your window; they will be active in this window
    until you close it or until you explicitly turn it off again (SET STATISTICS X
    OFF). Now run the following query (in the same query window).


    Code Listing 75: A SQL query with JOIN


    ```

    SELECT p.FirstName + '' '' + p.LastName AS FullName,

    FROM Person.Person p

    JOIN Person.EmailAddress e ON e.BusinessEntityID = p.BusinessEntityID

    ```


    You now get the Results, Messages, and an additional tab, the Execution plan.


    ![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_70_0.png)


    Figure 24: An execution plan


    You should read the execution plan from left to right (the SELECT is executed
    last). The thicker an arrow between two nodes, the more data that was handled
    by that node. SQL Server serves by doing a scan on the Person table (using the
    primary key). It computes the scalar FullName. It does another scan on EmailAddress
    using the primary key for table. It then does a merge join between Person and
    EmailAddress. Finally, it selects the data. To interpret this, you must have a
    little knowledge of the inner workings of SQL Server, and quite possibly, knowing
    the alternatives is a must. So let''s dissect this plan and check out the alternatives.


    We start with an Index Scan. The alternative is an Index Seek. An Index Seek simply
    reads rows through your input (in this case an index tab) and takes out rows that
    match the queries criteria. In this case we read all rows, so we can not get faster
    than just fetching all rows like we do now. Let''s say we expect one row to be
    returned because we filter on an ID—surely an table scan would be a waste of resources.
    That''s when SQL Server uses an Index Seek, which only goes through pages and
    rows that contain qualifying data. Somewhere between all rows and none or one
    row is a turning point where one of the two is faster than the alternative.'
- md: "\nThe MERGE JOIN is the fastest join around. It only works when two sets of\
    \ data are ordered in the same way, and when two rows have to match on a key.\
    \ In this case, both tables are ordered on BusinessEntityID. MERGE JOIN reads\
    \ a row from one input and compares it with a row from the other. If the rows\
    \ don't match, the row with the smaller value can be discarded and the next row\
    \ is read until all rows have been read. The maximum number of reads necessary\
    \ for this operation is the number of rows in the first input, plus the number\
    \ of rows in the second input.\n\nThe alternatives are LOOP JOIN and HASH JOIN.\
    \ LOOP JOIN loops through all rows of the second input until a match is found.\
    \ This is less efficient than a MERGE JOIN, as the maximum number of reads is\
    \ now the number of rows in input one times the number of rows in input two.\n\
    \nThe HASH JOIN can require the most processing before the scenes, and if you\
    \ encounter it, you probably should check your design. The HASH JOIN algorithm\
    \ creates a hash table for the smaller of the input (and possibly writes to this\
    \ disk if on memory), and then compares it to the other values using a hash function.\
    \ Small inputs can be very efficient, but if you have bigger inputs, this might\
    \ slow down your query considerably.\n\nAs we can see, this query is optimal:\
    \ we have the optimal search algorithm and the JOIN algorithm. The next query\
    \ is far from optimal, and since the data is relatively small, even though it's\
    \ not giving us any troubles, we're going to optimize it for the sake of practice.\n\
    \n# Code List 65: A query with a suboptimal plan\n\n```\nSELECT FirstName, MiddleName,\
    \ LastName, Title\nFROM Person.Person\nWHERE MiddleName > 'Z'\nOPTION (RECOMPILE)\n\
    ```\n\nI have added the OPTION (RECOMPILE) so that we're sure SQL Server always\
    \ generates a new plan for this query (so we're not looking at cached plans).\
    \ Here is the generated plan.\n\n![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_71_0.png)\n\
    \n# Figure 25: A suboptimal query plan\n\nWe see here that we're doing an Index\
    \ Scan, but when we execute the query, we only get one result. So we're scanning\
    \ the entire table (almost 20,000 rows) for just one row. Also notice the Key\
    \ Lookup. This happens when an index is used that does not have all the requested\
    \ values. In this case, the Index Scan is done on IX_Person_LastName_FirstName_MiddleName,\
    \ but we're requesting fields more than those three because we also want Title.\
    \ The Key Lookup searches for the row index and retrieves all missing fields.\
    \ Of course, SQL Server needs to join the results of the Index Scan and the Key\
    \ Lookup, which costs even more time and resources.\n\n> Tip: The problem with\
    \ slowly executing queries is that sometimes they run very slowly (like maybe\
    \ an hour or more). In these cases, \"Include Execution Plan\" is not an option,\
    \ as it requires you to run the query, but you can't wait for hours to finish,\
    \ taking up resources and possibly blocking other queries. For such cases, SQL\
    \ Server has an option in the context menu, \"Display Execution Plan.\" This option\
    \ does not run the query and only creates the estimated plan. It may not give\
    \ you the actual plan, but more often than not it's pretty accurate, and you can\
    \ at least inspect the plan and identify possible bottlenecks.\n\n# Indexing\n\
    \nSo we have an index that uses index, but still needs to look up the row in the\
    \ primary key index. That happens when an index is not covering. When all requested\
    \ fields from a table are contained in a single index, this is called a covering\
    \ index. In this case, Title is missing from the index. So let's add Title to\
    \ the index. We can do two things: add Title to the actual index, or include it\
    \ in the index.\n\nTo the difference, we must understand that an index is a virtual\
    \ sorting of one or more fields. IX_Person_LastName_FirstName_MiddleName is sorted\
    \ by LastName, then FirstName and MiddleName. That SQL Server can use the Binary\
    \ Search algorithm to quickly find all rows with a specific LastName, for all\
    \ people with that LastName and FirstName. Finally, for people with LastName and\
    \ FirstName, it can find all people with a specific MiddleName.\n\nIf we added\
    \ Title to the index, we could find people with a specific name and specific Title\
    \ as well. Unfortunately, indexing comes with a price. Every time one of the fields\
    \ is updated, the index must be updated as well. Adding Title to the index means\
    \ the index must be updated when any LastName, FirstName, MiddleName, or Title\
    \ is updated. So inserts, updates, and deletes on this table will take the performance\
    \ hit. We're probably never going to query for such a name with a specific title,\
    \ so we'd rather not do that.\n\nLikely we have a second choice: include Title\
    \ as an included field. It's not included in the sorting, but meaning whenever\
    \ Title is updated, the index doesn't have to update. The only cost we have is\
    \ that there is some extra memory usage, a fair price to pay if it speeds up our\
    \ query. To include a field in an index, find the index in the Object Explorer,\
    \ right-click, choose Properties, and add the field to the Included columns tab\
    \ (NOT the \"Index keys\" tab). Now let's execute the query again.\n\nChanging\
    \ the index worked, since our plan no longer requires a Lookup.\n\n![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_73_0.png)\n\
    \n# Figure 26: Key Lookup eliminated\n\nUnfortunately, we still have an Index\
    \ Scan instead of an Index Seek. Apparently our indexes just don't cut it. You\
    \ might well remove the Title from the index columns now, as we're going to create\
    \ an index completely optimized for this query. Simply add an index and put MiddleName\
    \ in the index columns, and FirstName, LastName, and Title in the Included columns.\n\
    \n# Code Listing 66: Index on MiddleName\n\n```\nCREATE NONCLUSTERED INDEX IX_Person_MiddleName\n\
    ON Person.Person\n(\n    MiddleName\n) INCLUDE (FirstName, LastName, Title)\n\
    ```\n\nIf we run the query again, we will see that we have eliminated the Index\
    \ Scan as well, and the query is now optimal.\n\n![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_73_1.png)\n\
    \n# Figure 27: Optimal query plan\n\nIn some cases, SQL Server may suggest indexes\
    \ for you. For example, run the following query and inspect the query plan.\n\n\
    # Code Listing 67: Non-indexed query\n\n```\nSELECT *\nFROM Sales.SalesOrderHeader\n\
    WHERE OrderDate = '2012-01-01'\n```\n\n# Parameter Sning\n\nYour query runs really\
    \ slow when executed from C# code, while other times it completes a few milliseconds.\
    \ Multiple things can happen here. First, and we'll get to this, blocking queries.\
    \ Another option is parameter sniffing. What SQL Server does when it encounters\
    \ a new query that uses parameters is that it creates a query plan that is (approximately)\
    \ optimal for the current value of the parameter. Remember that query plans are\
    \ cached and reused if the same query is executed again. However, if the same\
    \ query now has a different value for its parameter, the plan may be suboptimal.\
    \ Likely we can replicate this issue quite easily (although we won't see the performance\
    \ hit, as our database is still small).\n\nFirst we need parameterized query.\
    \ An ad hoc query in a query window is not parameterized unless you use sp_execql,\
    \ a built-in procedure that runs a SQL query and can optionally take parameters.\
    \ What C# sends to the database if you run a parameterized query. Running a string\
    \ is not very easy to type, (as you have to escape it), let's go with the already\
    \ stored procedure. Create the following procedure in the AdventureWorks database\
    \ (never mind that this procedure is perfectly useless and becomes literally useless\
    \ after some million orders).\n\nCode Listing 68: SP GetOrdersByDate\n\n```\n\
    CREATE PROCEDURE GetOrdersByDate\n@OrderDate DATETIME\nBEGIN\nSET NOCOUNT ON;\n\
    \nSELECT *\nFROM Sales.SalesOrderHeader\nWHERE OrderDate < @OrderDate\nEND\n```\n"
  mdcn: "\nMERGE JOIN（合并连接）是最快速的连接方式。它仅在两组数据以相同方式排序，且两个行必须根据某个键进行匹配时才有效。在这种情况下，两个表都根据\
    \ `BusinessEntityID` 排序。MERGE JOIN 从一个输入端读取一行，并将其与另一个输入端的行进行比较。如果行不匹配，则值较小的行会被丢弃，直到读取完所有行。此操作的最大读取次数是第一个输入的行数加上第二个输入的行数。\n\
    \n替代方案有 LOOP JOIN（循环连接）和 HASH JOIN（哈希连接）。LOOP JOIN 遍历第二个输入的所有行直到找到匹配项。这比 MERGE\
    \ JOIN 效率低，因为最大读取次数是输入一行数乘以输入二行数。\n\nHASH JOIN 在处理之前可能需要哈希表，如果遇到它，它会为较小的输入创建一个哈希表（可能写入内存），然后使用哈希函数将其与其他值进行比较。对于较小的输入，HASH\
    \ JOIN 非常高效，但如果输入很大，这可能会减慢你的查询。\n\n我们可以看到，当数据量较小时，这种查询是最优的：我们拥有最优的搜索算法。\n\n# 代码列表\
    \ 65：带有非优计划的查询\n\n由于数据相对较小，尽管这没有给我们带来麻烦，但下一个查询将非最优。\n\n```sql\nSELECT FirstName,\
    \ MiddleName, LastName, Title\nFROM Person.Person\nWHERE MiddleName > 'Z'\nOPTION\
    \ (RECOMPILE)\n```\n\n我添加了 `OPTION (RECOMPILE)`，这样 SQL Server 就会为该查询生成新计划（而不是查看缓存计划）。这里是生成的计划。\n\
    \n![](img/a56ca9d7c6fd98834c26b14abef8ccb_71_0)\n\n# 图 25：非优查询计划\n\n我们在这里看到正在执行的是\
    \ Index Scan（索引扫描），但当我们执行查询时，只得到了一个结果。这意味着我们扫描了整个表（几乎有 20,000 行）。此外注意 Key Lookup（键查找），这发生在使用的索引没有包含所有请求值时。在这种情况下，在\
    \ `IX_Person_LastName_FirstName_MiddleName` 上执行了 Index Scan，但请求的字段多于这三个，因为我们还需要\
    \ `Title`。Key Lookup 查找行并检索所有缺失字段。当然，这消耗了更多的时间资源。\n\n> 提示：查询执行缓慢的问题是它们有时运行得非常慢（可能需要一小时或更久）。在这些情况下，“包含执行计划”不是一个选项，因为你需要等待它完成，从而占用资源并可能阻塞其他查询。对于此类情况，SQL\
    \ Server 在右键菜单中有一个选项为“显示执行计划”。此选项不会运行查询，仅创建估计计划。它可能不会给你实际计划，但大多数情况下相当准确，你可以至少检查计划并识别可能的瓶颈。\n\
    \n# 索引\n\n所以我们有一个使用了索引但仍然需要在主键索引中查找行。这发生在索引不是覆盖索引时。当表中的所有请求字段都包含在单个索引中，这被称为覆盖索引。在这种情况下，索引中缺少\
    \ `Title`。因此，让我们把 `Title` 添加到索引中。我们可以做两件事：将 `Title` 添加到索引中，或者将其包含在索引中。\n\n区别在于，我们理解索引是一个或多个字段的虚拟排序。`IX_Person_LastName_FirstName_MiddleName`\
    \ 按 `LastName`、然后是 `FirstName` 和 `MiddleName` 排序。SQL Server 可以使用二分查找算法快速找到所有特定\
    \ `LastName` 的行，以及具有该 `LastName` 和 `FirstName` 的所有人。最后，对于具有 `LastName` 和 `FirstName`\
    \ 的人，它可以找到所有特定 `MiddleName` 的人。\n\n如果我们把 `Title` 添加到索引中，也可以找到具有特定姓名和特定 `Title`\
    \ 的人。不幸的是，索引是有代价的。每更新一个字段，索引也必须更新。将 `Title` 添加到索引意味着当任何 `LastName`、`FirstName`、`MiddleName`\
    \ 或 `Title` 更新时，索引必须更新。因此，此表的插入、更新和删除将受到性能影响。我们可能永远不会查询具有特定标题的名字，所以我们不想这样做。\n\n\
    我们可能有第二个选择：将 `Title` 作为包含字段。它不包含在排序中，这意味着每当 `Title` 更新，索引不需要更新。我们唯一的代价是有额外的内存占用，如果这能加速我们的查询，这是一个公平的代价。要向索引中包含字段，在对象资源管理器中找到索引，右键点击，选择“属性”，并将字段添加到“包含列”选项卡（而不是“索引键”选项卡）。现在再次执行查询。\n\
    \n更改索引起作用了，因为我们的计划不再需要 Lookup。\n\n![](img/a56ca9d7c6fd98834c26b14abef8ccb_73_0.png)\n\
    \n# 图 26：消除了 Key Lookup\n\n不幸的是，我们仍然是 Index Scan 而不是 Index Seek（索引查找）。显然我们的索引还不够。你现在可以从索引列中移除\
    \ `Title`，因为我们将创建一个完全针对此查询优化的索引。只需添加索引，并将 `MiddleName` 放在索引列中，将 `FirstName`、`LastName`\
    \ 和 `Title` 放在“包含列”中。\n\n# 代码列表 66：针对 MiddleName 的索引\n\n```sql\nCREATE NONCLUSTERED\
    \ INDEX IX_Person_MiddleName\nON Person.Person\n(\n    MiddleName\n) INCLUDE (FirstName,\
    \ LastName, Title)\n```\n\n如果我们再次运行查询，我们将看到已经消除了 Index Scan，而且查询现在是最优的。\n\n![](img/a56ca9d7c6fd98834c26b14abef8ccb_73_1.png)\n\
    \n# 图 27：最优查询计划\n\n在某些情况下，SQL Server 可能会为你建议索引。例如，运行以下查询并检查计划。\n\n# 代码列表 67：非索引查询\n\
    \n```sql\nSELECT *\nFROM Sales.SalesOrderHeader\nWHERE OrderDate = '2012-01-01'\n\
    ```\n\n# 参数嗅探 (Parameter Sniffing)\n\n当查询从 C# 代码执行时有时运行非常慢，而其他时间它在几毫秒内完成。这里可能发生多种情况。首先（我们会讨论这一点）是阻塞查询。另一种可能是是参数嗅探。\n"
