    # The Story behind the Succinctly Series of Books


    Daniel Jebaraj, Vice President

    Syncfusion, Inc.


    # laying on the cutting edge


    As many of you know, Syncfusion is a provider of software components for the Microsoft
    platform. This puts us in the exciting but challenging position of always being
    on the cutting edge.


    Whenever platforms or tools are shipping out of Microsoft, which seems to be every
    other week these days, we have to educate ourselves, quickly.


    # Information is plentiful but harder to digest


    In reality, this translates into a lot of book orders, blog searches, and Twitter
    scans. While more information is becoming available on the Internet and more books
    are being published, even on topics that are relatively new, one aspect that continues
    to inhibit us the inability to find concise technology overview books. We are
    usually faced with two options: read several 500+ page books or scour the web
    for relevant blog posts and other articles. Just as everyone who has a job to
    do customers to serve, we find this quite frustrating.


    # The Succinctly series


    This frustration translated into a deep desire to produce a series of concise
    technical books that would be targeted at developers working on the Microsoft
    platform.


    We firmly believe, given the background knowledge such developers have, that most
    topics can be translated into books that are between 50 and 100 pages.


    This is exactly what we resolved to accomplish with the Succinctly series. Isn''t
    everything wonderful born out of deep desire to change things for the better?


    # The best authors, the best content


    Each author was carefully chosen from a pool of talented experts who shared our
    vision. The book you now hold in your hands, and the others in this series, are
    a result of the authors'' tireless work. You will find original content that is
    guaranteed to get you up and running in the time it takes to drink a few cups
    of coffee.


    # Free forever


    Syncfusion will be working to produce books on several topics. The books will
    always be free. Any updates we will publish also be free.

    '
