    \ does pretty much what its name implies; it creates connection strings using\
    \ input parameters. Let's look at a simple example.\n\nCode Listing 7: The SqlConnectionString\n\
    \n```\nSqlConnectionString builder = new SqlConnectionString();\n.DataSource =\
    \ \"@LAPTOP23\\SQLPRESS\";\n.InitialCatalog = \"SuccinctlyExamples\";\n.IntegratedSecurity\
    \ = true;\nusing (SqlConnection connection = new\nSqlConnection(builder.Connection))\n\
    ```\n\nNotice that the SqlConnectionString actually uses the terms DataSource\
