  md: 'Now here is a peculiar thing: open a new query window and run DBCC FREECACHE.
    Remove it, and in the same window, run SELECT * FROM Person.Person (or whatever
    you like). Empty the query window again and run SET ARITHABORT OFF. Clear the
    query window and run SELECT * FROM Person.Person again. Now list the query plan,
    and you will see that SELECT * FROM Person.Person is listed twice! But how could
    this be? Isn''t a query plan reused?


    SQL Server query plans, unless the query is exactly the same, and certain settings
    are the same as well, ARITHABORT is one that will trigger SQL to create a new
    plan if the setting value differs from a currently stored plan. These settings
    can be retrieved using the function sys.dm_exec_plan_attributes. There are a lot
    of attributes, and their values are stored together in a single value, which is
    completely unheard. Luckily for, SQL Server MVP Erland Somerkog has written a
    lengthy (but very good and detailed) article about this phenomenon. This is especially
    relevant in "His Plans for Different Settings". I''m going to use this trick to
    get all these attributes on one line; you can read his blog to make sense of it
    all.


    # Code List 84: list plan attributes


    ```

    SELECT cp.plan_handle, qp.query_plan, [text], attrlist

    FROM sys.dm_exec_cached_plans cp

    CROSS APPLY sys.dm_exec_query_plan(cp.plan_handle) AS q

    CROSS APPLY sys.dm_exec_query_text(cp.plan_handle) AS st

    CROSS APPLY ep.attribute = ''='' + convert(nvarchar(127), ep.value)


    FROM sys.dm_exec_plan_attributes(cp.plan_handle) ep

    WHERE ep.is_cache_key = 1

    ORDER BY ep.attribute

    FOR XML PATH('''')) AS attrlist

    WHERE qp.[dbid] = DB_ID(''Adventureworks2014'')

    ```


    The takeaway is that SQL Server creates a plan based on certain settings. ARITHABORT
    is a very nasty one, too. When you''re running a query from C# code, it is through
    ADO.NET or Entity Framework, ARITHABORT is set to OFF by default. Whenever your
    application is running slowly because of some query, and you''re running the query
    in SSMS, it will probably be lightning-fast—it will create a new plan because
    ARITHABORT is setting different. I have been stumbling in the dark for reasons
    not knowing about this!


    Now that you know how to get the query plan for a single query, it is also possible
    to delete this plan from the cache. We have used DBCC FREECACHE to delete all
    plans from the cache, but you can use the plan_handle to delete just that one.
    Grab the handle and pass it to DBCC FREECACHE.


    # Code List 100: DBCC FREECACHE (plan_handle)


    ```

    DBCC FREECACHE

    (0x060007003A0E5604409D1360400000000000000000000000000000000000000000000000)

    ```'
