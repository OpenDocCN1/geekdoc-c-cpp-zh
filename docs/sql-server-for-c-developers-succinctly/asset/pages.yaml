  md: '# # Chapter 8 Continuous Integration


    Up to now, we have seen how we can develop applications using C# and SQL Server
    using ADO.NET and the Entity Framework. But developing applications is only one
    aspect of the typical developer''s job. At the start of the day we check out the
    newest code, at the end of the day we commit our own changes, and we probably
    do that a few times in between. Source control is an invaluable tool in our day-to-day
    lives. Next to that, we have to make sure that our changes don''t break any existing
    code, and if they do, we want to know as soon as possible. Writing unit tests
    for our code—whether, test-driven development, or after we''ve written the code—has
    become a big part of our jobs. Last, but least, we want to deploy our application
    to any environment, and the few manual actions we have to take, the better.


    Yet, when we do all this, the database is usually just a bunch of scripts that
    we have to save, test, and deploy manually. I have to admit that''s how I do it,
    too. Unfortunately, databases aren''t just a bunch of files that can easily be
    compiled and copied for deployment. Even I have little experience with the topics
    in this chapter, that doesn''t mean I can''t point you in the right direction.


    # ## Source control


    When you''re using Entity Framework Code First or Database Projects to develop
    your database, you already get some sort of source control. After all, it''s pretty
    easy to update a database or go back to a specific version. However, when you''re
    not using either of those, you''re probably sticking SQL controls, and they probably
    go one way only, so going back to a previous version isn''t an option. None of
    those are examples of source control, unfortunately, all SQL source control systems
    I could find were paid ones, and I''m not discussing paid products in this book.
    So SSMS has options for source control, this is only to select a third-party plugin,
    and the choices are limited.


    It is possible to put your database into source control systems like SVN or Git.
    Probably the best one out is SQL Source Control by Redgate, I have used Redgate
    products in the past, and they''re very good tools. Unfortunately, they aren''t
    cheap.


    Other tools I''ve found are GitSQL, ApexSQL (I''ve used their Diff tool), AgentSvn,
    and Liquibase. All have free trials or (very) limited free versions, so you can
    try them at your own risk and leisure.


    Now, for it seems database projects are the easiest and, most of all, cheapest
    method of maintaining some sort of source control for your database. And that''s
    only your schema—getting (some) data into source control seems, for now, impossible.'
  merge: -1
  pgno: 90
