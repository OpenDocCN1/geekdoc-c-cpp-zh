  md: "# Migrations\n\nUp to now, we have deleted the database every time we made\
    \ a change to our model. That, of course, won't work well in the real world. EF\
    \ has a few options for the creation of a database: **CreateDatabaseIfNotExists**\
    \ (the default), **DropDatabaseIfModelChanges**, and **DropDatabasealways**. These\
    \ are called **DatabaseInitializers**. You probably see some trouble with those.\
    \ If you have data or mapped entities in your database, you'll lose them when\
    \ EF drops the database and recreates them (imagine that happening in production).\
    \ Newer versions of EF introduced the MigrateDatabaseToLatestVersion. Up to that\
    \ yours hasn't worked so well—after all, you will get an exception when your model\
    \ changes.\n\nTo enable migrations\n\n![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_52_0.png)\n\
    \n> Figure 12: Migrations using NuGet Console\n\nYou'll find that a class **Configuration**\
    \ will be created for you.\n\nCode Listing 48: Generated Configuration class\n\
    \n```\nnamespace CodeFirst.Migrations\n{\n    using System;\n    using System.Data.Entity;\n\
    \    using System.Data.Entity.Migrations;\n    using System.Linq;\n\n    internal\
    \ sealed class Configuration :\n    DbMigrationsConfiguration<CodeFirst.CodeFirstContext>\n\
    \    {\n        public Configuration()\n        {\n            AutomaticMigrationsEnabled\
    \ = false;\n        }\n    }\n}\n```"
