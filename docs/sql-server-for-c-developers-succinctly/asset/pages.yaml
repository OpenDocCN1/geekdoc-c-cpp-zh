  md: '# Publishing


    Before you do anything, let''s assume the SuccinctlyExamples database is production
    ready, so we want to deploy it. Right-click your database project in the Solution
    Explorer and choose **Deploy**. In the **Publish Database** window, select a database
    connection. The following window is a bit confusing, as you''re presented some
    connections, but your current connection is hidden. To show your current connection
    details, click **Show Connection Properties**. You can just pick the **SuccinctlyExamples**
    database for now.


    ![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_62_0.png)


    Figure 16: The Connection window


    In the Publish database window, pick a database name. We''re going to create a
    new database, so let''s pick a name that doesn''t exist. I''ve called **ProductionDb**.
    In a real environment you''d probably have the same database name, but another
    server instance. Since we don''t have servers lying around, we''re going to use
    the same server instance, by using a different database name. You can choose to
    disable numerous options under the Advanced menu as well, most notably if data
    is lost. Unless you check **Block incremental deployment if data loss might occur**,
    you''ll never be able to delete columns in tables that have rows. There are too
    many options to discuss them all, but be sure to look at them.


    Now you can ever the script, change it, and run it (in the upper left), or just
    run the script directly. If you run the script directly, it will be placed in
    the bin folder of your project. Also, a Data Tools Operations opens, allowing
    you to open the script directly. Whichever method you choose, you should now have
    a new ProductionDb database that is the same as the SuccinctlyExamples database.
    That''s pretty awesome!


    # Updating


    Now that we have deployed our database, we''re going to get change requests. Let''s
    add a column to the **Person** table. Double-click the **Person.sql** script in
    the Visual Studio Solution Explorer. You can right-click in the white space of
    the table designer to add or remove designer'
