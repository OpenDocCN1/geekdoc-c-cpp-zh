  md: '# Execution Plan. For some extra information, run the following statements
    in your query window.


    Code Listing 74: Enabling statistics


    ```

    SET STATISTICS ON

    SET STATISTICS TIME ON

    ```


    These statistics will be shown in your Messages tab after you run a query. You
    can delete the statements from your window; they will be active in this window
    until you close it or until you explicitly turn it off again (SET STATISTICS X
    OFF). Now run the following query (in the same query window).


    Code Listing 75: A SQL query with JOIN


    ```

    SELECT p.FirstName + '' '' + p.LastName AS FullName,

    FROM Person.Person p

    JOIN Person.EmailAddress e ON e.BusinessEntityID = p.BusinessEntityID

    ```


    You now get the Results, Messages, and an additional tab, the Execution plan.


    ![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_70_0.png)


    Figure 24: An execution plan


    You should read the execution plan from left to right (the SELECT is executed
    last). The thicker an arrow between two nodes, the more data that was handled
    by that node. SQL Server serves by doing a scan on the Person table (using the
    primary key). It computes the scalar FullName. It does another scan on EmailAddress
    using the primary key for table. It then does a merge join between Person and
    EmailAddress. Finally, it selects the data. To interpret this, you must have a
    little knowledge of the inner workings of SQL Server, and quite possibly, knowing
    the alternatives is a must. So let''s dissect this plan and check out the alternatives.


    We start with an Index Scan. The alternative is an Index Seek. An Index Seek simply
    reads rows through your input (in this case an index tab) and takes out rows that
    match the queries criteria. In this case we read all rows, so we can not get faster
    than just fetching all rows like we do now. Let''s say we expect one row to be
    returned because we filter on an ID—surely an table scan would be a waste of resources.
    That''s when SQL Server uses an Index Seek, which only goes through pages and
    rows that contain qualifying data. Somewhere between all rows and none or one
    row is a turning point where one of the two is faster than the alternative.'
