  md: '# Chapter 5 SQL Server Data Tools


    Using the Visual Studio SQL Server Data Tools, you can create databases in pretty
    much the same way you can see in SQL Server Management Studio. It gets better
    though—you can compare and deploy databases with ease. For this chapter, I have
    undone all the changes we made to the SuccinctlyExamples database in the previous
    chapters, so I''m starting fresh again.


    If you followed all my steps in the Visual Studio installation, you will have
    the SQL Server Data Tools. If you haven''t, you can change your installation by
    going to the Windows Control Panel, then Programs and Features. In the list of
    programs, look for Microsoft Visual Studio X (with Update Y), select it, and click
    Change. Now make sure you select the Data Tools.


    I should mention that I got a new laptop writing the previous chapters and this
    one, so instead of LAPTOP23:SQLEXPRESS, you''ll see1446. All the above still applies,
    of course; it''s just a name change.


    # Database Project


    Start Visual Studio—you don''t even have to start or open a project. In the menu,
    go to View and then SQL Server Object Explorer. You should now get a window on
    the right or left side of the screen (depending on your settings) showing two
    nodes, SQL Server and Projects. Right-click SQL Server and click Add SQL Server.
    You should now see a tree view similar to that in SSMS.


    As you right-click on the objects, you''ll notice that you can add tables, columns,
    and other objects. You can generate scripts of objects, execute scripts, and add
    or alter data. It''s all pretty cool that you can do in this Visual Studio, but
    you could do this in SSMS as well.


    Now here comes the awesome part—right-click the SuccinctlyExamples database, and
    Create New Project. Choose a name for your project, ideally the name of your database
    (I was lazy and kept the default, Database1). You''ll probably want to check Create
    new solution, and possibly Create directory for solution; they''re off by default,
    so I''ll leave it to you. Click Start, and a new database project will be created.
    In the new solution, your Solution Explorer should now look something like this.'
  merge: -1
  pgno: 60
