  md: '# Code List 89: SQL unit test


    ```

    EXEC GetFullName 1

    ```


    Add a test condition of the type Scalar Value. In the options of the condition,
    set Null expected to False and Expected value to Sander Rossel (or your own name).
    You can rename your type in the top right above your query; I renamed it FirstAndLastName.


    Now, in SSMS, add some data to your database. If you didn''t test for Sander Rossel
    in the condition, make sure the value you changed in the following script as well.


    # Code List 90: Insert test data


    ```

    INSERT INTO Person

    (FirstName, LastName)

    VALUES

    (''Sander'', ''Rossel''),

    (''Satya'', NULL)

    ```


    Now you are ready to run your test. In Visual Studio, go to the menu and select
    Test > Windows > Test Explorer, simply click Run All. Your test should now run
    and pass, if you did everything.


    Now let''s add a failing test. Go to GetFullName again, and add a test by clicking
    the green plus somewhere in the bar the query. Name your test OnlyFirstName. Again,
    remove the inclusive conclusion add a Scalar Value, and test for Satya. Change
    your script to the following.


    # Code List 91: Failing unit test


    ```

    EXEC GetFullName 2

    ```


    Now you run your tests again, and OnlyFirstName should fail. It will tell you
    that value Satya was expected, the returned value was NULL. That''s right, the
    procedure simply concatenates FirstName and LastName, and LastName is NULL, and
    by default, + NULL = NULL. We should use the CONCAT function instead. In Visual
    Studio, go to the GetFullName file and change the SELECT line with the following.


    # Code List 92: Fixed procedure


    ```

    SELECT CONCAT(FirstName, '' '' + LastName)

    ```


    Run your tests again, and this should pass both. The change is automatically published
    because that''s what we specified when we created the project. If someone changed
    this procedure back to what it was, because it has less verbose syntax, and he
    doesn''t quite get CONCAT, our test will fail again. More likely, if someone adds
    MiddleName, we''ll know soon if their change broke our cases where MiddleName
    is NULL. Likewise, they can add unit tests for MiddleName.'
