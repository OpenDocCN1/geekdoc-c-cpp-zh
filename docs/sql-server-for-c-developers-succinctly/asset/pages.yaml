  md: "# Code Listing 30: Use the DbContext\n\n```\nusing (var context = new SuccinctlyExamplesEntities())\n\
    {\n    // Access the database.\n    List<Person> people = context.People.ToList();\n\
    }\n```\n\nThat's how easy it is to fetch all people from your database and load\
    \ them into memory!\n\n# IQueryable\n\nUnfortunately, there's a lot going on in\
    \ one line of code, so let's elaborate. First of all, context.People doesn't really\
    \ do anything yet—the Context property allows that database access. This is a\
    \ VERY important detail. The context property is a DbSet<Person>, which in turn\
    \ is an IQueryable<Person>. The IQueryable<T> interface looks like any collection\
    \ (IEnumerable) on the outside, but acts very differently. When using IQueryable,\
    \ a query is built for the data, in this case SQL Server. The query is only executed\
    \ when IQueryable is enumerated, when ToList or foreach is called. This allows\
    \ you to create queries using Where, OrderBy, or Select without ever executing\
    \ it to the database. If you could imagine this becoming very slow indeed!\n\n\
    Let's build a more advanced query.\n\n# Code Listing 31: An IQueryable<Person>\n\
    \n```\nusing (var context = new SuccinctlyExamplesEntities())\n{\n    // Don't\
    \ access the database just yet...\n    IQueryable<Person> query = context.People\n\
    \    .Where(p => p.GenderId == 2)\n    .OrderBy(p => p.LastName);\n\n    // Access\
    \ the database.\n    List<Person> women = query.ToList();\n}\n```\n\nThis also\
    \ allows you to create queries based on conditions.\n\n# Code Listing 32: Build\
    \ queries using conditionals\n\n```\nusing (var context = new SuccinctlyExamplesEntities())\n\
    {\n    bool orderResults = false;\n\n    // Don't access the database just yet...\n\
    \    IQueryable<Person> query = context.People\n    .Where(p => p.GenderId ==\
    \ 2);\n}\n```"
