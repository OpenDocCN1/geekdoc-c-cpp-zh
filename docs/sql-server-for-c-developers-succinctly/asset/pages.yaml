  md: '# # Chapter 6 Troubleshooting


    Once in a while queries go awry. Unfortunately, there can be many reasons for
    this. Maybe your database has grown to the point where a query that always worked
    is now very slow. Maybe one of your environments is missing an index. Maybe a
    query with a cached query plan is not optimal for the current parameter value.
    In this chapter we''re going to look out how we can identify troublesome queries
    and how to solve these issues.


    For a few examples, we need a database with a little body. Microsoft has a sample
    database we can use called Adventure Works. You can download it from CodePlex.
    Alternatively, you can Google (or Bing) AdventureWorks2014 and see what shows
    up. Download the Adventure Works 2014 Full Database Backup.zip file and unzip
    the .bak file. In SSMS, right-click the Databases in your Object Explorer and
    then click Restore Database... in the Restore Database window, enable Device,
    click the button ..., and add the file you just unzipped. Then simply click OK,
    and the database should be available.


    ![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_66_0.png)


    Figure 20: Restoring Adventure Works'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# Profiling


    First of all, we''ll need to know which queries are running slowly. For this (and
    many more) we can use the profiler. I recommend using the profiler often when
    developing, as it shows you just everything that happens in a database. For example,
    you may have a well-performing piece of code, but maybe it only performs because
    you''re testing locally with few data. The profiler may show you that you''re
    actually sending thousands of queries to your database (because of EF lazy-loading,
    or because you''re executing queries in a loop). I''ve often run into scenarios
    that run smoothly on a test environment, but bring the database to a grinding
    halt (and that''s never fear).


    To start the profiler, use SSMS, and in the menu, go to Tools and SQL Server Profiler.
    You can also run it as a stand-alone application from your start (wherever you
    have it). If you start from SSMS, it will automatically start a new trace. If
    you start it from Windows, you can find New Trace under the File menu. Next, you
    will have to log in to the instance you want to trace. Be careful when tracing
    a production environment, as it will put a load on the system. Connect to your
    local instance, and get a window called "Trace Properties". On the General tab,
    you can name your trace, save to file, or pick a template. We''re going to ignore
    this. Instead, go to the Events Selection tab. On this tab you find all kinds
    of events that are raised by the database. A few are already selected for you,
    but there are many more. Check the Show events and Show all columns boxes, and
    you will see what I mean. In the following events: Stored Procedures -> RPC:Completed
    and SP:StmlCompleted and TSQL -> SQL:BatchCompleted. Now run it to trace.


    ![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_67_0.png)'
  merge: -1
  pgno: 67
- img_proc: true
  md: 'If you now go into SSMS query a table, or you run the execution we created
    in the previous chapter, you will see the queries in the profiler. and, unfortunately,
    you may see a whole lot (I''m also seeing queries from my Report Server and some
    other stuff I''ve got running). You can pause the trace and put some filters in
    place.


    ![](img/a56ca9d7c6fd98834c26b14a4bef8ccb_68_0.png)


    Figure 22: Trace Pause and Properties


    In the Events Selection tab, go to Column Filters... and filter onApplication
    like "EntityFramework". If you haven''t manually changed the Application in your
    DbContext, you will only see queries that are fired from your application. A filter
    on LoginName or NTUserName can also come in handy, especially when you have millions
    of queries and you''re only interested in a single user. Another filter I quite
    often is Duration greater than; set it to 5000 (milliseconds) and you''ll get
    all the queries that take at least five seconds. If one query pops up a lot, you
    may need to have a look at it. Anyway, with your Application filter in place,
    run some query from your application and look it up in the profiler. I ran context.
    People(p => p.GenderId == 1).ToList();


    | EventClass | TextData | ApplicationName | NTUserName | CPU | Reads | Writes
    | Duration |

    |---|---|---|---|---|---|---|--|

    | SQL:BatchCompleted | select(cast(GenderId as int) as ...) | EntityFramework
    | SR | 0 | 0 | 0 | 0 |

    | RPC:Completed | select Statement(SQL, SCR) FROM (SELECT TOP 100 PERCENT... |
    EntityFramework | SR | 0 | 2 | 0 | 0 |

    | SP:Completed | select * FROM People where GenderId = ... | EntityFramework |
    SR | 0 | 0 | 0 | 0 |

    | SQL:BatchCompleted | SELECT ... (GenderId) AS AS | EntityFramework | SR | 0
    | 18 | 1 | 19 |


    Figure 23: Query in the profiler


    As you can see, EF has shown over, and only the fifth row is my actual query.
    By looking at the generated query, I can see 1 [Extent1].GenderId was not parameterized
    (as in my query). Looking at the columns, we can see the database returned 18
    rows, a single write, and 19 milliseconds to make up the result. When looking
    for troublesome queries, you might want to keep an eye on those values. Higher
    isn''t necessarily bad, but it might be an indication that something can be optimized.
    Now we can copy and paste the query and run it in SSMS manually.


    The profiler can be used for many things, for example, trace deadlocks "Locks
    -> Deadlock graph". Look at all the events and queries you''ll see that we need
    another book to fully understand just this one tool. For my day-to-day activities,
    the BatchCompleted and StmtCompleted events, with the Duration filter, prove to
    be useful.


    Sometimes you might want to run the trace for a while. You can set up your trace
    and then in the File menu, go to Export and then Script Trace Definition and for
    SQL Server 2005 - 2014... Save the script wherever you want. Be sure to replace
    InsertFileNameHere (for example, C:\MyTrace, but make sure to save the folders)
    and run the script.'
