  md: '# Testing


    When it comes to testing our code, we usually mock our data layer. After all,
    our tests should run independent of the database. We test if our logic is correct,
    if 1 + 1 equals 2. But what we often don''t test is whether the database returns
    what we expect it to return.


    Once again, Redgate has a rather pricey testing tool for SQL Server unit. I''m
    not discussing it here, but if you really want a good tool, that''s probably the
    way to go. For testing, however, we don''t need a third-party tool. The Visual
    Studio Database Project includes testing tools.


    Start Visual Studio and create a new SQL Server Database Project. I''ve called
    it DbTest, Next, add whatever you want. Now add a table, and call it Person. Make
    the default Id by Identity Specification to True an auto-incrementing field, in
    the options pane. Then add a non-nullable field, FirstName varchar(256), and a
    nullable field, LastName varchar(256). Add a stored procedure to the project,
    call it GetFullName, and change the contents of the created file to the following.


    Code Listing 88:GetPeople stored procedure


    ```

    CREATE PROCEDURE [dbo].[GetFullName]

    AS

    SET NOCOUNT ON

    SELECT FirstName + '' '' + LastName

    FROM Person

    WHERE Id = @PersonId

    ```


    Now publish the database. If it fails, you may need to set the Target Platform
    to SQL Server 2014 in the project properties. If everything went well, you should
    have a database with a single table and a single stored procedure.


    To create a unit test, right-click on the stored procedure, and in the context
    menu, choose Create Unit Tests... You now get a window where you can pick stored
    procedures to test, select a type and name for your test project, and pick a name
    for your unit test. Be sure to change the default Vb to a C# project. Call the
    project you like; I''ve called it DbTest.Tests. I''ve called my unit test GetFullName.
    In next, you can pick a connection, a secondary connection, and whether or not
    your changes should automatically be deployed before you run. Set the connection
    to your new DbTest and select Automatically deploy... Pick your DbTest as Database
    project and deploy it as Deployment


    You now get a Test Project with a SQL Server unit test and a regular unit test
    class. The SQL Server unit contains a SQL script that "database unit for dbo.GetFullName"
    at the top. It should be shown by default after you create the project. Underneath
    the script are the test conditions. You will want to delete the default Inconclusive
    condition, as it will always make your test fail. Now change the script to the
    following.'
