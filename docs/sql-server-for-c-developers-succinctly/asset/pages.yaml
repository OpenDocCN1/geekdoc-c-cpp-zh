  md: '# Deployment


    Deploying a database is often a manual task, DBAs want to keep total control of
    their database. The IT department doesn''t trust automated deployment, or is afraid
    it''s triggered at a wrong time. They''re not confident that the development team
    has their scripts in order so that an automatic database update goes exactly as
    planned, always. When the database goes awry, it''s often a costly to get everything
    running again. In short, automated updates make a lot of people nervous. Manually
    running scripts is the way to go. We have seen that (semi-) automated deployment
    is pretty easy using Entity Code or Database Projects. When using a Database Project,
    you could go for (manual) deployment using a Data-tier application package.


    As that it is, it is possible to automate database deployment. Perhaps you''d
    like it for noncritical environments, such as a test environment. Redgate has
    a good, expensive, solution. We''ve talked about Database Projects, so I''m skipping
    that here. One last thing I''d like to discuss is the SQL Server command line
    tool, or sqlcmd. Chances you need to download it, especially when you use the
    Command Line Utilities for SQL Server in the Microsoft Download Center. With this
    tool, you can execute scripts from the command line, batch scripts, and your favorite
    CI tools. The sqlcmd tool was introduced with SQL Server 2005, when it replaced
    the functionally similar isql and osql tools.


    Once you have sqlcmd installed


    > Code Listing 93: SELECT using sqlcmd


    ```

    sqlcmd -S [servername][instancename] -E -d AdventureWorks2014

    SELECT

    FROM Person.Person

    WHERE BusinessEntityID = 1

    GO

    ```


    On the first line, we connect to our database. Each line that makes up your query,
    which is executed after a GO command. The -S parameter is the name of your server,
    -E indicates we''re logging in with a trusted connection, and -d specifies the
    database. To use sqlcmd, you must specify exit. Note that all parameters are case
    sensitive. If you''re not on a trusted connection and you would like to use a
    username and password, you can use the following command instead.


    > Code Listing 94: sqlcmd using SQL Server login


    ```

    sqlcmd -S [servername][instancename] -U username -P password -d

    AdventureWorks2014

    ```


    When you run the sqlcmd from the command prompt, you can stretch your query over
    multiple lines and execute using GO. When you''re not in the command prompt, you
    need to use -q (query) or -Q (query and exit) and a single line query.'
  merge: -1
  pgno: 93
- img_proc: true
  md: '# Code Listing 95: sqlcmd using a direct query command.


    ```

    sqlcmd -S [server\instance] -E -d AdventureWorks2014 -Q "SELECT * FROM Person.Person
    WHERE BusinessEntityID = 1"

    ```


    Of course, you can also specify a script file to run using -i. Create a file somewhere
    (I put it in C:\Temp), name it something (SelectPerson1.sql), and then you can
    run the following command.


    # Code Listing 96: sqlcmd using an input file


    ```

    sqlcmd -S [server\instance] -E -d AdventureWorks2014 -i C:\Temp\SelectPerson1.sql

    ```


    Now the results are a little hard to read in the command prompt. You can also
    output them to a file using -o.


    # Code Listing 97: sqlcmd using an output file


    ```

    sqlcmd -S [server\instance] -E -d AdventureWorks2014 -i C:\Temp\SelectPerson1.sql
    -o C:\Temp\result.txt

    ```


    Another option you might like to use is -b, which terminates the job if an error
    occurs. You can find all options in the sqlcmd documentation.


    Using the sqlcmd, you can automate certain SQL tasks by running them from the
    command line. I should mention that this in no way replaces the SQL Agent, which
    also runs automated SQL jobs. The thing is, you can''t run the SQL Agent from
    your CI tool, while you can run the sqlcmd utility. The sqlcmd tool still does
    not automate your deployments, but it may be useful for running scripts automatically
    before your tests start off, or after you commit new scripts to your source control
    system.'
