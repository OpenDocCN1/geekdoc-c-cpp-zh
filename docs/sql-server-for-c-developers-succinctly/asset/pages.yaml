  md: '```

    SELECT * FROM sys.tables

    SELECT * FROM INFORMATION_SCHEMA.TABLES

    ```


    You can find the views in the Object Explorer under Views and then System Views.
    You''ll find views called sys.something and a few INFORMATION_SCHEMA_VIEWS. INFORMATION_SCHEMA
    views are standards, and when you use them in your queries, in theory, make them
    work in Oracle, MySQL or any other SQL database that adheres to ISO standards.
    There are about twenty INFORMATION_SCHEMA DMVs, and (I''m guessing) well over
    a hundred sys DMVs, so you just go with the views, as all you need.


    Next to the DMVs, there are system SPs and as functions. You can find them under
    Programmability > Stored Procedures > System Stored Procedures > Programmability
    Functions > System Functions. You can simply scroll through them and try them
    out. You''ll probably have been using many functions, such as CAST, MAX, and CURRENT_TIMESTAMP.


