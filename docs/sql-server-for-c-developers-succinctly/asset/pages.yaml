  md: "SSMS will automatically name your foreign key FK_Person_Gender, so you can\
    \ leave all the rest and save. You have now told SQL Server that the Gender column\
    \ in the Person table may only contain values that are also a value in the Id\
    \ column of the Gender table.\n\n> > Note: Many people believe relational databases\
    \ are called so because it is possible to define foreign key relationships between\
    \ tables. That is not true though more than a constraint, guaranteeing data integrity.\
    \ The actual reason relational databases are called so because the mathematical\
    \ term for a table is relation. A relation is an unordered set of values. A value\
    \ is a collection of unique values. A value in SQL Server is a tuple, which is\
    \ a collection of values. Uniqueness of a value is guaranteed by a primary key.\
    \ That also means that any table (or view) without a unique primary key is actually\
    \ not a relation!\n\nNow, right-click the Gender table and click Edit Top 200\
    \ Rows. It doesn't really matter what you insert, but maybe you should follow\
    \ your example.\n\n| Id | Code | Description |\n|---|---|---|\n| 0 | UNKNOWN |\
    \ Not saying |\n| 1 | MALE | Male |\n| 2 | FEMALE | Female |\n| | NULL | NULL\
    \ |\n\nFigure 5: Genders\n\nNow we also insert one or more people in the Person\
    \ table.\n\n| Id | FirstName | LastName | DateBirth | GenderId |\n|---|---|---|---|---|\n\
    | 1 | Sander | Rossel | 1987-11-08 00:00:00 | 1 |\n| 2 | Bill | Gates | 1955-10-28\
    \ | 1 |\n| * | NULL | NULL | NULL | NULL |\n\nFigure 6: People\n\nSo that was:\
    \ We set up two tables, created a foreign key, and inserted some data. We are\
    \ missing one though... the scripts! You're going to need the scripts if you want\
    \ to do these steps on a different database (or the same database on another environment).\
    \ Luckily, SSMS has few options for generating scripts.\n\nThe first method is\
    \ to right-click an object, select Script [Object] as >, and make your pick. Only\
    \ scripts only export objects, this is probably fine for fetching tables (which\
    \ can't be overwritten without losing data). For example, the Person table CREATE\
    \ script is as follows:\n\nCode Listing 1: CREATE TABLE [dbo].[Person]\n\n```\n\
    CREATE TABLE [dbo].[Person] (\n  [Id] [int] IDENTITY(1,1) NOT NULL,\n  [FirstName]\
    \ [varchar](256) NOT NULL,\n```"
