  md: "In this case we have three genders, so we have the call to get all genders,\
    \ and an additional call for each gender to get the people, which is a total of\
    \ four database calls. In many scenarios you really don't know how many entities\
    \ you're getting, and before you know it, you're doing thousands of database calls!\
    \ This is called lazy-loading, and can be turned off in your EF diagram. However,\
    \ with lazy-loading turned off, your People will not be loaded and it may have\
    \ no people at all. I've seen systems very slow because of lazy-loading, but when\
    \ used correctly, it's pretty awesome. Luckily, EF does caching for you, so once\
    \ a Navigation Property is loaded, EF won't access the database again. \"Think\
    \ before you query\" is the message!\n\nLet's look at some cool extensions, which\
    \ make working with IQueryable a lot easier. Working with dates is always a pain,\
    \ so let's create an OlderThan extension method. I confess got the SQL query from\
