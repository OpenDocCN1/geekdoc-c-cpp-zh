    \ SELECT *\n    FROM SalesOrderHeader\n    WHERE OrderDate < @OrderDate\n    OPTION\
    \ (RECOMPILE)\nEND\n-- OR\nALTER PROCEDURE GetOrdersByDate\n@OrderDate DATETIME\n\
