  md: 'The MERGE JOIN is the fastest join around. It only works when two sets of data
    are ordered in the same way, and when two rows have to match on a key. In this
    case, both tables are ordered on BusinessEntityID. MERGE JOIN reads a row from
    one input and compares it with a row from the other. If the rows don''t match,
    the row with the smaller value can be discarded and the next row is until all
    rows have been read. The maximum number of reads necessary for this operation
    is the number of rows in the first input, plus the number of rows in the second
    input.


    The alternatives are LOOP JOIN and HASH JOIN. LOOP JOIN loops through all rows
    of the second input until a match is found. This is less efficient than a MERGE
    JOIN, as the maximum number of reads is now the number of rows in input one the
    number of rows in input two.


    The HASH JOIN can require the most processing before the scenes, and if you encounter
    it, you probably should check your design. The HASH JOIN algorithm creates a hash
    table for the smaller of the input (and possibly writes to this disk if on memory),
    and then compares it to the other values using a hash function. Small inputs can
    be very efficient, but if you have bigger inputs, this might slow down your query
    considerably.


    As we can see, this query is optimal: we have the optimal search algorithm and
    the JOIN algorithm. The next query is from optimal, and since the data is relatively
    small, even though it''s not giving us any troubles, we''re going to optimize
    it for the sake of practice.


