  md: 'The two methods differ in parameter, and in what they return. The IQueryable
    takes an Expression<Func<Person, bool> as input and returns an IQueryable, whereas
    the Iumerable takes a Expression<Func<Person, bool> as input and returns an Enumerable.


    ```

    peopleQuery.Where(p => p.FirstName == "Sander").ToList();

    ```


    ```

    (extension) IQueryable<Person> IQueryable<Person>.Where<Person>(System.Linq.Expressions.Expression<Func<Person,
    bool>> predicate)

    Filters a sequence of values based on a predicate.

    ```


    Figure 10: IQueryable.Where


    ```

    peopleEnum.Where(p => p.FirstName == "Sander").ToList();

    ```


    ```

    (extension) IEnumerable<Person> IEnumerable<Person>.Where<Person>(Func<Person,
    bool> predicate)

    Filters a sequence of values based on a predicate.

    ```


    Figure 11: IEnumerable.Where


    The Expression<SomeType, bool> is basically a representation of the SomeType,
    bool as an object graph. Instead of passing a method in the IEnumerable, you pass
    in object that represents the method. In this case the compiler creates the object
    graph, so you don''t need to worry about


    In the previous example, that means the IEnumerable enumerates over the collection,
    forcing a roundtrip to the database (all, the IEnumerable variable is actually
    an IQueryable), and after that does it execute the function. As a result, you''ll
    ALL people from the database instead of just with the FirstName "Sander". Be very
    careful that you don''t accidentally break your IQueryable chain.


    Just for fun, here''s the Expression<Person, bool> the compiled created from that
    lambda expression.


    Code Line 38: Expression<Person, bool>>


    ```

    ParameterExpression parameter = Expression.Parameter(typeof(Person), "p");

    Expression property = Expression.Property(parameter,

    typeof(Person).GetProperty("FirstName");

    Expression constant = Expression.Constant("Sander");

    Expression binary = Expression.Equal(property, constant);

    Expression<Func<Person, bool>> lambda = Expression.Lambda<Func<Person,

    bool>>(binary, parameter);

    peopleQuery.Where(lambda).ToList();

    ```


    This means that when you want to add your own (extension) methods, you''ll have
    to keep in mind that you''re doing Expressions. And if you want to create other
    types of abstraction, you might even need to create your own manually. Creating
    Expressions is little too advanced for this, but let''s take a look at an extension
    method.


    What happens if you want to include, for example, additional select logic in your
    extension method? Just be sure to put in an Expression. Failing to do so will
    give no errors or warnings, but will call the method on IEnumerable, forcing a
    database call before your action executes.'
