  md: 'Another DMV we can use sys.dm_tran_locks. It shows currently active requests
    to the lock manager. Additionally, sys.dm_os_waiting_tasks shows all sessions
    that are currently waiting on a lock resource. By combining the two, we get the
    sessions that are currently waiting to acquire a lock along with the lock information.


    > Code Listing 101: List blocked sessions


    ```

    SELECT *

    FROM sys.dm_tran_locks tl

    JOIN sys.dm_os_waiting_tasks AS owt ON tl.lock_owner_address =\owt.resource_address

    ```


    The most interesting columns right now are the request_session_id in dm_tran_locks
    (which should correspond to the session_id in dm_os_waiting_tasks) and the blocking_session_id
    in dm_os_waiting_tasks. We can use these columns to get the associated sessions
    from sys.dm_exec_connections.


    > Code Listing 85: List blocked connections


    ```

    SELECT *

    FROM sys.dm_tran_locks tl

    JOIN sys.dm_os_waiting_tasks AS owt ON tl.lock_owner_address =\owt.resource_address

    JOIN sys.dm_exec_connections AS ew ON ew.session_id =

    tl.request_session_id

    JOIN sys.dm_exec_connections AS ec ON ec.blocking_session_id =\owt.blocking_session_id

    ```


    The dm_exec_connections view has a column most_recent_session_handle. This is
    the last query that was executed by the session, and must be the queries that
    are currently blocking and waiting. We have already seen how to get the query
    text and plan from a sql_handle, so we can apply that here. Furthermore, a lock
    is requested on some partition, as indicated by the resource_associated_entity_id
    in dm_tran_locks. The partition belongs to an object, so this is how we get the
    object ID, which we can then use to get the object name. If we filter out fields,
    we''re left with a resulting table that''s actually readable.


    > Code Listing 86: List blocked queries


    ```

    SELECT tl.request_session_id

    owt.blocking_session_id

    tl.resource_type

    waiting_text [text] AS WaitingText

    blocking_text [text] AS BlockingText

    OBJECT_NAME(p.object_id) AS ObjectName

    FROM sys.dm_tran_locks tl

    JOIN sys.dm_os_waiting_tasks AS owt ON tl.lock_owner_address =\owt.resource_address

    JOIN sys.dm_exec_connections AS ew ON ew.session_id =

    tl.request_session_id

    JOIN sys.dm_exec_connections AS ec ON ec.blocking_session_id =\owt.blocking_session_id

    ```'
