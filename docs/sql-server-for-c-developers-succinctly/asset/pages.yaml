    \    SET NOCOUNT ON;\n\n    DECLARE @LocalOrderDate DATETIME = @OrderDate\n\n\
    \    SELECT *\n    FROM Sales.SalesOrderHeader\n    WHERE OrderDate < @LocalOrderDate\n\
