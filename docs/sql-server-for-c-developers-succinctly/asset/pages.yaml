    The plan_handle is very useful


    Now that we have the plan_handle and the query_plan, we want the actual query.
    This another function, called sys.dm_exec_sql_text, which also has a plan_handle
    as input parameter. We also have the text and, database ID. We can get the database
    from a database name DB_ID(database_name).


    ```

    SELECT cp.plan_handle, query_plan, [text]

    FROM sys.dm_exec_cached_plans cp

    CROSS APPLY sys.dm_exec_query_plan(cp.plan_handle) AS q

    CROSS APPLY sys.dm_exec_sql_text(cp.plan_handle) AS st

    WHERE cp.[dbid] = DB_ID(''AdventureWorks2014'')

