  md: "# Code List 72: Optimize for unknown\n\n```\nOPTION (OPTIMIZE FOR UNKNOWN)\n\
    ```\n\nIn cases, SQL Server may make a wrong call considering the index to use.\
    \ Or maybe it's not wrong, just not like I it to. A while ago I found myself in\
    \ such a situation. A coworker had created a lengthy stored procedure and the\
    \ execution wasn't all that it was supposed to be. Sure enough, we were missing\
    \ an index. We added the index and cleared the query cache, but nothing happened.\
    \ A quick look at the execution plan revealed that SQL Server wasn't using our\
    \ index. In this instance, we wanted it to use our index.\n\n# Code List 73: Forcing\
    \ an index\n\n```\nALTER PROCEDURE [dbo].[GetOrdersByDate] @OrderDate DATETIME\n\
    AS\nBEGIN\n    SET NOCOUNT ON;\n\n    SELECT *\n    FROM Sales.SalesOrderHeader\n\
    \    WITH (INDEX(IX_SalesOrderHeader_CustomerID))\n    WHERE OrderDate < @OrderDate\n\
    END\n```\n\nSurely that index makes no sense! The fun part is if you run now and\
    \ look at the query, SQL Server will give you a hint that an index on OrderDate\
    \ (with all other fields included, which we don't).\n\nAnother option is to make\
    \ a local variable from your input parameter. The idea is that SQL Server optimizes\
    \ queries for a given value: the one that is passed to the stored procedure. However,\
    \ when you use a local variable, SQL Server cannot know the value of that variable\
    \ in the query plan stage. As a result, a local variable will create the same\
    \ output as OPTION (OPTIMIZE FOR UNKNOWN).\n\n# Code List 74: Using a local variable\n\
