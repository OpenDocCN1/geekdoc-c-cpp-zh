    SQL Authority. Next time you''re troubleshooting query, you know what to do.


    > Tip: We have seen various methods of finding out what''s going on in your SQL
    Server database. Another way of seeing what''s up is using the Activity Monitor.
    It shows processor, waits, I/O, and recent expensive queries. It''s less detailed
    than the methods laid out in this chapter, but gives a nice overall picture of
