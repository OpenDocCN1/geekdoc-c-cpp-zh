  md: "System.ComponentModel.DataAnnotations namespace. Simply add some Attributes\
    \ to your model.\n\n# Code Listing 45: DataAnnotations\n\n```\n[Required]\n[MaxLength(256)]\n\
    public string FirstName { get; set; }\n[MaxLength(256)]\npublic string LastName\
    \ { get; set; }\n```\n\nAgain, delete your database and run the code again. These\
    \ fields will now be generated as varchar(256) not null and varchar(256) null,\
    \ respectively. You can tweak a lot more, for example, by not having an autogenerated\
    \ key, mapping to another column name in the database, changing generated types,\
    \ or making properties Key a primary key by default.\n\n# Code Listing 52: Non-ogenerated\
    \ key\n\n```\n[DatabaseGenerated(DatabaseGeneratedOption.None)]\npublic int Id\
    \ { get; set; }\n```\n\nBy overriding OnModelCreating(Dbcontext), you have a lot\
    \ of flexibility in customizing generation.\n\n# Code Listing 46: Customizing\
    \ in OnModelCreating\n\n```\nprotected override void OnModelCreating(DbBuilder\
    \ modelBuilder)\n{\n    modelBuilder.Conventions.RemovePluralizingTableNameConvention();\n\
    \n    modelBuilder.Entity<Person>()\n        .Property(p => p.DateOfBirth)\n \
    \       .HasColumnName(\"DOB\")\n        .HasColumnType(\"smalldatetime\");\n\n\
    \    modelBuilder.Properties()\n        .where(p => p.Name == \"Key\")\n     \
    \   .Configure(p => p.IsKey());\n}\n```\n\nBy using the NotMappedAttribute, a\
    \ property is ignored by EF altogether (for example, a FullName property that\
    \ you're going to compose FirstName and LastName.\n\n# Code Listing 47: A property\
    \ that's not mapped to the database\n\n```\n[NotMapped]\npublic int FullName {\
    \ get; set; }\n```\n\nYou probably get the gist of Code First: write code and\
    \ configuration and have EF create a database for you."
