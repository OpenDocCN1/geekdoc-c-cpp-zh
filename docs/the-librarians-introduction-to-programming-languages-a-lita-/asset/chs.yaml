  \ 编程. [`en.wikibooks.org/wiki/C_Sharp_Programming`](https://en.wikibooks.org/wiki/C_Sharp_Programming).\n\
  \n## 第十章：Java\n\nAmanda Cowell\n\n### 历史与发展\n\n`Java` 是一种基于类的面向对象编程语言，其口号是“一次编写，随运行”（WORA），这意味着它是平台无关的，代码可以编译一次并运行在任何平台上。其他类似的语言（如\
  \ `C++`）则每个平台都需要特定的编译器。`Java` 的设计还考虑了简单性，并可以自动管理内存的创建和删除，从而减少了编码错误。虽然 `Java` 被广泛用于应用程序，但实际上它在创建之初并不是为了在线应用程序设计的。`Java`\
  \ 最初是为家用电器内部的嵌入式应用程序设计的，例如微波炉和洗碗机。许多不同品牌的设备需要相同的软件功能但使用的硬件不同。这就是为什么平台无关性变得如此重要的原因。随着互联网的普及，人们发现\
  \ `Java` 的移植性对于在线环境同样理想。今天，尽管是一门老牌语言，`Java` 仍然保持着人气，并且是开发 Android 移动设备应用的主要平台。\n\
  \n`Java` 最初名为 `Oak`，由太阳系统公司（Sun Microsystems）于 1991 年开发。它是作为名为“绿色项目”（Green Project）的一部分而创建的。太阳绿色项目的目标是创建一种可以在多个操作系统上运行而无需重新编译的可移植编程语言。在\
  \ `Java` 开发期间，大部分程序都是用 `C++` 开发的，而 `C++` 为每个平台都需要编译器。当时需要一种可以嵌入消费电子设备的软件解决方案（Schildt\
  \ 2011）。`Java` 开发有五个主要目标：\n\n- 简单、面向对象且熟悉\n- 健壮且安全\n- 架构中立且可移植\n- 高性能\n- 解释型、多线程且动态\n\
  \n（Oracle 1997）。\n\n`Java` 于 1995 年面向公众发布，当时互联网正在发展。人们很快发现，困扰嵌入式代码的跨平台问题也会出现在互联网代码中，由于硬件、浏览器和操作系统的不兼容。`Java`\
  \ 自然成为了最用于互联网应用程序的编程语言（Schildt 2011）。\n\n1999 年，太阳系统公司发布了 Java 2 微型平台（J2ME），作为手机和其他类似设备的平台。当时对这些设备的消费应用兴趣并不大，手机硬件也没有准备好支持这些类型的应用程序。随着手机和其他移动设备的普及以及这些设备能力的提升，`Java`\
  \ 创建设备内容的能力也随之提高。2008 年，第一代安卓手机发布，到 2013 年，安卓占了全球智能手机市场的 81.3%（Deitel, Deitel, and\
  \ Deitel 2014）。`Java` 运行在所有这些设备上的所有应用程序，证明了尽管历史悠久，它仍然是一门强大且重要的编程语言。\n\n### 用途\n\n\
  虽然 `Java` 代码可以移植到任何类似的应用程序，但部署 Java 应用程序的打包取决于你创建的应用程序类型（Gassner 2011）。例如，你打包移动应用程序的方式与桌面应用程序或\
  \ 应用程序不同。大多数情况下，可执行文件仍然是 `.jar` 文件，但它们的创建和运行方式不同。这意味着为某种类型的微波炉编写的代码可以在具有不同硬件的微波炉上运行，但不太可能运行在浏览器中；同样，安卓应用也不可能运行在微波炉上。\n\
  \n\n\n\n同样地，开发不同类型的应用程序需要不同的工具。例如，如果你计划开发一个 Android 应用程序，你将需要安装 `Android SDK/ADT\
  \ Bundle` 以获取开发 Android 应用程序所需的类和工具。你可以在 [`developer.android.com/sdk/index.html`](http://developer.android.com/sdk/index.html)\
  \ 下载此包。不同的 Java 库和开发环境并不会让事情变得复杂，但它们是必要的，以便开发者能够利用其所开发设备的特定功能。例如，Android 移动设备具有多点屏，而为这些设备开发的\
  \ Java 应用程序需要利用各种触摸手势（Deitel, Deitel, and Deitel 2014）。\n\n如果你用 Java 开发 Web 应用程序，创建一个\
  \ `Java applet` 可能比创建一个 `Java console-based application`（控制台应用程序）更有价值。`Java applet`\
  \ 是一个可以嵌入网页的小型应用程序。Applets 是 Web 应用程序的理想选择，因为它们对本地资源的访问有限，这避免了计算机病毒的传播并有助于保护用户隐私。为了构建\
  \ applet，用户需要包含 `Abstract Window Toolkit (AWT)` 和包含 `Applet` 类的 `applet` 包。创建的每个\
  \ applet 都必须 `Applet` 的子类（Schildt 2011）。由于其他工具经常可以更快地执行这些相同的任务，Applets 的人气有所下降，且\
  \ Java applets 在过去面临过一些安全问题，但 Java applets 仍然是 Web 上强大且频繁使用的工具。\n\n由于 Java 的悠久、流行程度和开源设计，有数百种免费和付费的工具可以帮助\
  \ Java 开发者完成任何项目。有用于 Java 开发的工具，例如集成开发环境（`IDEs`），它们将在本章后面的部分进行讨论。广泛存在用于调试和测试代码的工具。还有辅助图形开发的工具。在\
  \ Java 使用的二十年里，开发者在每个方向上测试并扩展了它的局限，寻找 Java 工具来协助任何项目总是值得的。\n\n### 优缺点\n\n尽管 Java\
  \ 是一门较老的语言，但它在不断演进，并有许多当前应用。它简单、面向对象、架构中立，并且可以移植到几乎任何平台。Java 是原生 Android 应用程序中使用的语言，也是创建动态\
  \ Web 应用程序的语言。如果你想为你的库开发移动应用程序，学习 Java 是必不可少的。\n\nJava 的历史也增加了一些优势，因为它在过去的二十年里得到了很好的使用和记录。对于\
  \ Java 初学者可能想要进行的几乎每项任务，都开发了工具。还有一个庞大的开发者社区为其他用户提供支持。在网上找到操作说明或解决开发过程中遇到的大多数问题的解决方案并不困难。\n\
  \n虽然脚本语言多年来变得越来越流行，例如 `JavaScript`（与 Java 无关）、`Perl`、`Python` 和 `Ruby` 等，但它们并不适用于大规模编程。脚本语言之所以流行是因为它们使用的结构更容易学习，并允许更快速地开发代码。虽然许多脚本语言正在开发能够增强其能力的改进方案，但用于构建大型应用程序时，它们的可用性仍然显著低得多（Niemeyer\
  \ and Leuck 2013）。\n\n此外，尽管 Java 设计简单，但它可能是一门难以学习的复杂语言，因为它要求开发者理解面向对象的编程。要真正成为一名\
  \ Java 开发者并获得成功，仅仅知道 Java 语法是不够的；还需要对对象、类和继承有良好的理解。这可能让学习 Java 变成一项比用户最初预期的更大的任务。好消息是，Java\
  \ 将此变得尽可能简单，许多 `IDEs` 可以让初学者的开发更容易。\n\n此外，虽然 Java 是一种开发的可移植语言，但已不能说 Java 可以运行在任何平台上了。`Apple\
  \ IOS` 不允许 Java 在 iPhone 和 iPad 等 Apple 设备上运行。这需要为移动端创建非 Java 版本的站点，因为大量的移动用户通过\
  \ Apple 设备连接。此外，任何为 Android 设备用 Java 开发的移动应用程序都需要为 `IOS` 环境重新创建。这对 Java 语言流行程度的影响目前尚不清楚，但显然，Java\
  \ 的兼容性不再影响产品的使用或流行度。没有 Java，Web 开发仍将继续。\n\n## 环境与设置\n\nJava 开发的第一步是确保你的机器上安装了 Java。Microsoft\
  \ Windows 机器已经安装了 Java，Windows 用户可以跳过本段的剩余部分。如果你使用的是 Mac，你的机器上可能安装了也可能没有安装，取决于你使用的操作系统。测试你是否在\
  \ Mac 上运行 Java 的最佳方法是打开 `Terminal` 并输入 `java -version`。你可能会得到没有 Java 的错误信息，也可能会看到一个指示\
  \ Java 版本的数字字符串。例如，如果终端输出 Java 版本 `1.8.0_45`，则你的机器上运行的是 Java 8。如果你发现没有安装 Java 或版本过旧，请访问此处获取在你的机器上下载最新版本\
  \ Java 的指令：[`www.java.com/en/download/help/mac_install.xml`](https://www.java.com/en/download/help/mac_install.xml)。\n\
  \nMac 和 Windows 用户的下一步都是安装 `Java Development Kit (JDK)`。`JDK` 是 Java 开发中最广泛使用的软件开发包（`SDK`），由\
  \ Oracle 免费提供。在本书编写时，`Java SE`（标准版）的最新版本 `JDK` 可以在这里找到：[`www.oracle.com/technetwork/java/downloads/index.html`](http://www.oracle.com/technetwork/java/downloads/index.html)。下载\
  \ `JDK` 将安装开发 Java 需要的所有内容，包括 `Java Virtual Machine`。\n\n安装完成后，Java 准备就绪，但在开始编程之前，你需要选择一个文本编辑器。虽然\
  \ Java 软件文件只是文本文件，可以在任何文本编辑器中编辑，但有很多选项供选择。如果你已经是一个经验丰富的程序员，可以继续使用过去使用的文本编辑工具。另一种，`IDEs`\
  \ 在入门阶段非常有用，特别是如果你对软件开发不太熟悉，因为它们可以帮助你构建、编辑、调试和编译应用程序。\n\n有很多非常适合入门的 IDE 选项。有些 `IDEs`\
  \ 只在 Mac 上运行，有些只在 Windows 上运行，许多是跨平台的。既有免费的 `IDEs`，也有通过许可费用提供更复杂功能的付费 IDE。有些 `IDEs`\
  \ 适用于小型程序，而另一些则更适合更大更复杂的项目。有许多需要考虑的因素，每个工具都有其优缺点。\n\n一个很好的入门 IDE 是 `Eclipse`。`Eclipse`\
  \ 并不一定适合每个人的环境，但 `Eclipse` 有许多优势。`Eclipse` 可以在 Windows 或 Mac 上使用，是开源免费的，并且内置了 Android\
  \ 开发工具，这可以使其成为初级 Android 开发者的很好的工具。它也是开发本章示例代码所使用的工具。\n\n## 示例\n\n```\nHello World\n\
  ```\n\n\n\n\n\n这是一个基础 Hello World 应用程序。它是测试 Java 运行环境的好方法，可以确保你可以成功编译并运行代码。\n\n\
  ```java\npublic class HelloWorld {\n    public static void main(String[] args) {\n\
  \        System.out.println(\"Hello World!!!!\");\n    }\n}\n```\n\n如果运行成功，这段代码将简单地打印出\
  \ Hello World!!!! 行。尽管它非常简单，但值得逐行查看这段代码，以更好地理解它的作用。\n\n```java\npublic class HelloWorld\
  \ {\n```\n\n第一行创建了一个名为 HelloWorld 的类。每个 Java 应用程序都构建在类内部。这使得它与其他编程环境非常不同。在 Java\
  \ 中，一切都是对象，而对象是由类创建的。在类内部，代码被封装在函数中。\n\n```java\npublic static void main(String[]\
  \ args)\n```\n\n简单 World 程序中上面的函数被称为 `main`，因为它是我们代码执行的地方。任何应用程序中都只有一个 `main` 函数，它必须始终被声明为\
  \ `public static void` 并接受一个 `String`，传统上命名为 `args`。该函数由 Java 虚拟机自动调用，如果没有它，你的代码将无法运行。\n\
  \n```java\nSystem.out.println(\"Hello World!!!!\");\n```\n\n代码的最后一行是打印我们想要显示的文本的代码。\n\
  \n### 扩展的 Hello World\n\n下面的程序输出与上面的程序完全相同。为了进一步解释“一切都是对象”的意思，创建了第二个名为 `Welcomer`\
  \ 的类。\n\n```java\npublic class HelloWorld {\n    public static void main(String[]\
  \ args) {\n        Welcomer welcomer = new Welcomer();\n        welcomer.sayHello();\n\
  \    }\n}\n```\n\n```java\npublic class Welcomer {\n    private String welcome =\
  \ \"Hello World!!!!\";\n    public void sayHello() {\n        System.out.println(welcome);\n\
  \    }\n}\n```\n\n初始类 HelloWorld 仍然存在，并包含 Java 运行所需的强制 `main` 函数。\n\n```java\npublic\
  \ class HelloWorld {\n    public static void main(String[] args) {\n        Welcomer\
  \ welcomer = new Welcomer();\n```\n\n`main` 函数做的第一件事是创建一个 `Welcomer`。对于这个程序而言，`Welcomer`\
  \ 可以被认为一个在被要求说话时会大喊“Hello World!!!!”的对象。你可以想象你创建了一个实际的对象，比如一个机器人，它可以执行任务。现在我们只需要告诉它说就行。\n\
  \n```java\nwelcomer.sayHello();\n```\n\n但是，为了让它工作，需要定义第二个类 `Welcomer`。\n\n```java\n\
  public class Welcomer {\n    private String welcome = \"Hello World!!!!\";\n   \
  \ public void sayHello() {\n        System.out.println(welcome);\n    }\n}\n```\n\
  \n这个类创建了 `welcome` 并包含了所有的属性。`welcome` 可以执行的每个函数都在这个类中。在这个类内部，我们创建了一个带有 hello 文本的字符串。然后我们创建了一个新函数来打印我们的\
  \ hello 文本字符串。这段代码显然让一个打印 Hello World 的非常简单的函数变得显著复杂得多。这主要是为了展示 Java 中的一切都是对象。有许多理由你想要创建具有不同行为的类。创建多个类仍然是一个有用的实践，因为它简化了扩展程序的过程。例如，如果程序员决定为\
  \ `Welcomer` 添加任务，例如要求程序用户填写调查卷，可以通过在 `Welcomer` 类内部创建新函数，并在 `main` 函数中调用它们，而只对现有代码进行有限的修改。\n\
  \n### 不只有正确的方法\n\n在 Java 中，像许多许多其他编程语言一样，通常有多种方法来完成同一个类。一种方法并不比另一种更好。有时选择取决于代码如何被使用。在其他情况下，它取决于开发者的喜好。下面的示例显示了遍历简单数组的四种方法。每种循环类型产生相同的输出。\n\
  \n```java\npublic class Main {\n    static private String[] numbers = {\"one\",\
  \ \"two\", \"three\", \"four\", \"five\"};\n    public static void main(String[]\
  \ args) {\n        for (String number : numbers) { // for loop\n            System.out.println(number);\n\
  \        }\n        for (int number=0; number < numbers.length; number++) { // for\
  \ loop\n            System.out.println(numbers[number]);\n        }\n        int\
  \ number = 0;\n        while(number < numbers.length) { // while loop\n        \
  \    System.out.println(numbers[number]);\n            number++;\n        }\n  \
  \      number = 0;\n        do { // do while loop\n            System.out.println(numbers[number]);\n\
  \            number++;\n        } while (number < numbers.length);\n    }\n}\n```\n\
  \n上面使用的循环是 `for`、`for each`、`while` 和 `do while`，如注释所示。这些选择没有对错之分，也没有哪一个效率比另一个更高或更低。在\
  \ Java 中，经常会有关于如何执行程序的选择，可能五位经验丰富的程序员会提出五个不同的解决方案，而它们都是正确的。在开发 Java 或任何编程语言时，对于开发者来说，保持开放的心态、富有创造力并找到适合自己的风格是非常重要的。这并不是说在很多情况下没有正确和错误的选择，但也有很大的创意和个人风格空间。\n\
  \n### 使用内置类\n\nJava 的优点之一是有很多内置类，它们已经包含了完成你可能想要执行的任务的函数。在 Java 中编写程序之前，查看是否已经有可以完成操作的\
  \ Java 类是值得的。这是一个使用 Java 内置类类的示例。下面的程序读取你的出生月份、日期和年份，并返回你出生星期几。例如，如果你在 1977 年 7\
  \ 月 25 日出生，程序将返回 Monday（星期一）。\n\n```java\nimport java.util.Calendar;\nimport java.util.GregorianCalendar;\n\
  import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        Scanner input = new Scanner(System.in);\n        System.out.println(\"\
  Enter the month of your birth\");\n        int month = input.nextInt(); // Read\
  \ in month\n        System.out.println(\"Enter the day of your birth\");\n     \
  \   int day = input.nextInt(); // Read in day\n        System.out.println(\"Enter\
  \ the year of your birth\");\n        int year = input.nextInt(); // Read in year\n\
  \        month = month-1; // Java 中的月份是 0-11 而不是 1-12\n        GregorianCalendar\
  \ birthday = new GregorianCalendar(year, month, day);\n        String namesOfDays[]\
  \ = { \"Sunday\", \"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\"\
  , \"Saturday\"};\n        String weekday = namesOfDays[(birthday.get(Calendar.DAY_OF_WEEK))\
  \ - 1];\n        System.out.println(weekday);\n        input.close();\n    }\n}\n\
  ```\n\n`java.util.Calendar` 类是一个抽象类，它提供了方法用于在特定时间与 `YEAR`、`MONTH` 等日历字段之间进行转换，并对日历字段进行操作，例如获取下周的日期。\n\
  \n\n\n\n\n`java.util.GregorianCalendar` 是 `Calendar` 的一个具体子类，提供了世界上大多数地区使用的标准日历系统。`GregorianCalendar`\
  \ 类允许程序员以熟悉的格式（月份、日期、年份等）输入日期，并轻松地将其转换为 Java 能够理解的日期。`GregorianCalendar` 类还提供了数学函数，使你可以通过对日期进行加减时间来操作日期（Oracle\
  \ 2015）。`java.util.Scanner` 类是将数据读入 Java 的众多方法之一。它是一个简单的文本扫描器，可以使用正则表达式解析基本数据类型和字符串（Oracle\
  \ 2015）。\n\n使用现有的 Java 类时，需要记住的一个重要点是，它的工作方式可能与你预期的完全不同。在使用类类的函数之前，理解其功能是非常重要的，否则你可能会得到意外的结果。例如，在上面的代码读取了一个月份整数后，它减了\
  \ 1。\n\n```java\nmonth = month-1; // Calendar 类中的月份是 0-11，而不是 1-12\n\nGregorianCalendar\
  \ birthday = new GregorianCalendar(year, month, day);\n```\n\n这是因为正如注释所指出的，日历类中的月份是从\
  \ 0 到 11，而不是 1 到 12。如果该程序的用户出生在 1 月，当被提示时他可能会输入 1 作为出生月份，但 Java 会将其解释为 2 月。确保数据被正确解释是程序开发者的责任。\n\
  \n这个特定的例子可能永远不会出现，但很多时候，类或函数的行为并不完全按照不熟悉的用户可能预期的方式运行。在在使用新事物时，阅读文档始终是一个好主意。\n\n\
  有许多这类内置类可以帮助各种操作，例如 `File` (`java.io.File`)，允许用户编辑文件；`Math` (`java.io.Math`)，用于复杂的数学方程；或者\
  \ `NumberFormat` (`java.io.NumberFormat`)，它允许用户指定数字数字格式，甚至精确到货币类型（包括欧元和美元）。Java\
  \ 8 包含的所有类列表可以在此处找到：[`docs.oracle.com/javase/8/docs/api/allclasses-noframe.html`](http://docs.oracle.com/javase/8/docs/api/allclasses-noframe.html)。\n\
  \n如果你想查看某个类包含哪些方法或如何使用某个特定方法，查询该类的文档是值得的。此外，如果你尝试使用某些东西但它运行不像你的预期，在互联网上搜索 Java 论坛总是很有。很有可能有人遇到过和你同样的困惑。\n\
  \n## Java Applet\n\n这是一个生成可以嵌入网页浏览器的 Java applet 代码示例。与基于控制台的应用程序不同，applet 代码运行不需要\
  \ `static void main` 函数。此函数对 `graphic` 类的使用非常少，但它可以用于进行更复杂的绘制。还有一个 3D 图形类，可以实现三维图形，以及许多其他的图形类。\n\
  \n```java\nimport java.applet.Applet;\nimport java.awt.Graphics;\nimport java.awt.Color;\n\
  \npublic class Main extends Applet\n{\n    public void paint(Graphics g) {\n   \
  \     Color color = Color.RED;\n        g.setColor(color);\n        g.drawString(\"\
  This is a Java Applet\", 25, 25);\n    }\n}\n```\n\n这使用 `Color` 类来设置文本颜色。在这种情况下，示例使用了内置常量\
  \ `RED`，但代码也允许使用颜色十六进制代码来获取用户想要的精确颜色。\n\n## 总结\n\nJava 是一种健壮、可移植、面向对象且熟悉的语言。它是所有\
  \ Android 应用程序使用的语言，也可以用于许多其他类型的项目，包括从开发 Web 应用程序到为 SIM 卡和其他微设备的一切。虽然 Java 的学习可能比一些较新的语言复杂，但它是一门拥有深厚历史、庞大用户群可用工具集的成熟语言，可以帮助新手和老手。Java\
  \ 的可移植性、易用性和成熟性使其成为各种各种大小编程项目的强大工具。\n\n## 参考文献\n\n- Deitel, P., H. Deitel, and A.\
  \ Deitel. 2014. *Android for Programmers: An App-Driven Approach*. Upper Saddle\
  \ River, NJ: Prentice Hall.\n- Gassner, D. 2011. “Java Essential Training.” [Lynda.com](http://Lynda.com).\
  \ [`www.lynda.com/Java-tutorials/Java-Essential-Training/377484-2.html`](http://www.lynda.com/Java-tutorials/Java-Essential-Training/377484-2.html).\n\
  - Murach, J. 2011. *Java Programming*. 4th ed. Fresno, CA: Mike Murach & Associates.\n\
  - Niemeyer, P., and D. Leuck. 2013. *Learning Java*. Beijing: O’Reilly Media.\n\
  - Oh, H. S., B. J. Kim, H. K. Choi, and S. M. Moon. 2012. “Evaluation of Android\
  \ Dalvik Virtual Machine.”\n- Schildt, H. 2014. *Java: A Beginner’s Guide*. New\
  \ York: McGraw-Hill Education.\n\n\n\n\n\n### 基于类的编程 (class-based programming)\n\
  一种面向对象的编程风格，通过定义对象类来实现继承，而不是对象本身。\n\n### 编译器/编译型语言 (compiler/compiled language)\n\
  一种接受源代码并产生二进制可执行程序的计算机程序（或一组程序）；换句话说，它是执行代码中所含指令的另一个程序。编译型语言是在执行任何代码之前先通过编译器的语言。与解释器/解释型语言相比。\n\
  \n### 控制台应用 (console-based application)\n一种设计用于纯文本计算机界面的计算机程序。\n\n### 数据库结构 (database\
  \ structure)\n数据库结构定义了组织和存储数据的格式。结构类型有很多，但大多数会指定文件、数组、记录和表。结构类型包括平面文件（内部的记录之间没有任何关系）、关系型（多个相互相关的数据库）和面向对象型（数据被视为对象）。\n\
  \n### 数据类型 (data type)\n数据类型是指定对象能够持有的数据类型的属性。这种数据类型规范会影响值、操作、值的存储方式以及数据的含义。数据类型包括文本、字节、整数、货币等。\n\
  \n### 声明式语言 (declarative language)\n用于描述高级编程语言的术语，这类语言可以在程序员不知道具体步骤的情况下，用于解决问题。\n\
  \n### 嵌入式应用 (embedded application)\n一种永久驻留在工业或消费级设备中的软件应用程序。\n\n### 环境 (environment)\n\
  通常情况下，编程环境是执行编程的基础。这包括完成编程功能所需的软件和硬件。\n\n### 文件句柄 (filehandle / file handle)\n操作系统在文件打开后立即分配给文件的数字。\n\
  \n### 函数 (function)\n在编程语言的语境下，函数是一种接收输入、执行某些操作并可能返回输出值的构造结构。与数学函数不同，编程函数可以对非数值输入进行操作。例如，`toUppercase`\
  \ 函数可能会接收一段文本并返回相同的文本，但将所有小写字母转换为其对应的大写字母。\n\n### Gem (gem)\nGem 是 Ruby 程序和库的自包含容器。`RubyGems`\
  \ 是用于分发 gem 的包管理器。\n\n### 哈希表 (hash)\n哈希表类似于数组，但它不要求值是整数，而是允许任何对象类型。\n\n### HTML\n\
  超文本标记语言（HyperText Markup Language）的缩写，是驱动网页的标记语言。HTML 具有角括号包裹的“标签”，例如 `<title>`，它们告诉浏览器不同文本字符串的含义和功能。\n\
  \n### HTML5\n一组松散的网页浏览器功能和标准，旨在将万维网从静态文档转变为功能全应用程序开发平台，能够与移动和桌面操作系统竞争。HTML5 特性的示例包括地理定位、客户端数据存储以及\
  \ `<video>` 和 `<audio>` HTML 标签。\n\n### 继承 (inheritance)\n当一个对象或类基于另一个对象或类时，使用相同的实现来保持相同的行为。\n\
  \n### 集成开发环境 (IDE)\n一种为计算机程序员提供软件开发全方位设施的软件应用程序。IDE 通常由源代码编辑器、构建自动化工具和调试器组成。\n\n\
  ### 解释器/解释型语言 (interpreter/interpreted language)\n一种接受源代码并立即执行其指令的计算机程序，在执行期间不创建另一个可执行程序。解释型编程语言是一种使用解释器执行其代码的语言。与编译器/编译型语言相比。\n\
  \n### 库 (library)\n在计算机编程中，库是存储用于不频繁使用的的相似对象集合，通常用于开发软件。这些可能包括配置数据、文档、帮助数据、消息模板、预写代码和子程序、类、值或类型规范。\n\
  \n### 循环 (loop)\n循环是重复的编码指令序列。该序列不断重复，直到满足特定条件。\n\n### 对象/面向对象编程 (object/object-oriented\
  \ programming / OOP)\n一种将数据结构与函数结合的编程语言，用于创建可重用的对象。这些对象具有数据字段（描述对象的属性）和称为方法的关联过程。例如，在程序中，一个书籍对象可能既有一个文本字符串格式的\
  \ `title` 属性，又有一个 `get_cover_image` 方法，该方法在调用时会返回一个从第三方服务获取的封面图像。大多数编程语言都支持某种形式的\
  \ OOP。\n\n### 解析 (parse)\n解析文本或代码意味着将文本字符串（可以将其想象为文学中的句子）拆分成它的组成部分。\n\n### 可移植的\
  \ (portable)\n同一种软件在不同环境下的可用性。\n\n### 私有变量 (private variable)\n仅对所属的类可见的变量。\n\n\
  ### 过程化编程 (procedural programming)\n过程化语言是指按步骤过程运行的语言，在移动到下一个步骤之前建立需要完成的每个过程。通常，这些是较旧的语言，如\
  \ `C`。\n\n### 保护变量 (protected variable)\n仅对所属的类及其任何子类可见的变量。\n\n### 公共变量 (public\
  \ variable)\n对所有类可见的变量。\n\n### 正则表达式 (regex)\n`Regex`（正则表达式）用于描述搜索模式的字符串或文本或代码序列。Regex\
  \ 用于搜索代码以找到特定的序列或模式进行更新或修改。\n\n### 运行时 (runtime environment)\n运行时环境本质上是支持程序所需的软件和硬件配置。环境支持包括\
  \ CPU 类型、操作系统以及执行任务所需的其他程序或插件。\n\n### 脚本 (script)\n脚本是由另一个程序读取并执行的指令或程序序列，而不是由计算机本身或人类操作员。这增强了所执行功能的自动化程度。\n\
  \n### 脚本语言 (scripting language)\n脚本语言支持脚本的使用。\n\n### 软件开发工具包 (SDK)\n一组软件开发工具，允许为特定的软件软件包创建应用程序。\n\
  \n### 强类型或弱类型语言 (strongly or weakly typed language)\n这些术语根据个人的观点，通常具有主观性。但通常，强类型语言是指每个变量或值都需要分配数据类型的语言。弱类型语言则更灵活，不需要显式分配数据类型。\n\
  \n### 终端 (terminal)\n终端允许你与计算机或网页通信。通信是双向的——发送和接收信息。通常，终端涉及显示器和键盘，尽管也有更复杂的终端。\n\n\
  ### XHR/XmlHttpRequest\n参见 AJAX。\n\n### 类型/类型系统 (type/type system)\n一种编程语言，其内部将每个数据结构关联到一个枚举类型（程序员通常可以添加这些类型），每种类型具有不同的行为，并且可能只能参与某些操作。例如，这种类型系统会坚持认为文本字符串\
  \ `hello` 不能乘以浮点数 `1.23`。\n\n在阅读文本时，以下网站可能对有所帮助：\n\n- http://www.computerhope.com/jargon.htm\n\
  - http://www.math.utah.edu/~wisnia/glossary.html\n- http://www.csci.csusb.edu/dick/cs202/glossary.html\n\
  - http://www.cs.kent.ac.uk/people/staff/djb/oop/glossary.html\n\n\n\n\n\n[`whatis.techtarget.com/glossary/Programming`](http://whatis.techtarget.com/glossary/Programming)\n\
  \n# 额外资源\n\n编辑者注：由于有很多可选项目，还有大量的在线选项，选择起来非常困难。以下项目源于个人经验、对评价持保留态度的审视，以及编写代码的同事的推荐。还有其他资源，例如常见的《傻傻\
  \ way》（For Dummies）、O’Reilly 系列和 Head Start 系列，它们可能同样适用。视频（包括 YouTube 上的视频）提供了很好的技巧和编程示例，在线论坛和培训网站也是如此。然而，作为管理员，我们都知道要评估来源的质量。\n\
  \n## 通用资源\n\n- **Codecademy**: [`codeacademy.com`](http://codeacademy.com)。免费的交互式课程（尽管基于文本），用于学习\
  \ `Python`、`Ruby`、`JavaScript`、`PHP`、`SQL` 和 `Java` 的基础知识。\n\n- **Code School**:\
  \ [`www.codeschool.com/free`](https://www.codeschool.com/free)。学习 `Ruby`、`JavaScript`\
  \ 和 `SQL` 基础的免费课程。\n\n- **Coding Bat**: [`codingbat.com`](http://codingbat.com)/。`Java`\
  \ 和 `Python` 的编程练习。与其说是教程，不如说是查看示例并确定其背后逻辑的地方。提供文本和视频指导。一旦你理解了它的设计，就是一个很好的来源。\n\n\
  - **W3Schools**: [`www.w3schools.com`](http://www.w3schools.com)/。针对 `JavaScript`、`SQL`\
  \ 和 `PHP` 的免费教程和代码示例。\n\n## 书\n\n### 通用编程与编码\n\n- **Abraham, Nikhil. 2015. Coding\
  \ For Dummies. New York: For Dummies.**: 专注于基于 Web 的语言（`JavaScript`、`Ruby` 和 `Python`），这本书帮助读者理解语言之间协作时的互动以及各语言的特性。读者将构建一个真实的\
  \ Web 应用程序。包含通过浏览器工具检查代码。需要基础术语知识，但它很好地解释了入门主题。提供了一个用于尝试教程、练习编程并接收输出的环境，并包含了“章末”挑战。`Codecademy`\
  \ 开发的在线练习有助于在练习时磨练编码技能并演示结果。\n\n- **Farrell, Mary E. 2007. Computer Programming\
  \ for Teens. Boston: Cengage Learning.**: 推荐用于对概念和基础编程主题进行有效解释。拥有良好的背景以及对概念和术语的理解将使得学习编程语言语法变得更容易。\n\
  \n- **Martin, Robert C. 2008. Clean Code: A Handbook of Agile Software Craftsmanship.\
  \ Upper Saddle River, NJ: Prentice Hall.**: 介绍了编码的最佳实践，包括有意义的命名、相关的注释、针对遵循者的格式化等项目。`Java`\
  \ 是示例中使用的语言，但这些指南适用于大多数语言。建议尽早阅读以遵循最佳实践。\n\n- **Sande, Warren, and Carter Sande.\
  \ 2013. Hello World! Computer Programming for Kids and Other Beginners. 2nd ed.\
  \ Greenwich, CT: Manning.**: 不仅仅是给孩子看的。指令易于遵循。虽然是为青少年编写的，但图像、类比和语言让读者专注于内容而非复杂的术语。将复杂的想法（如\
  \ `variable nested loops`嵌套循环）转化为通俗易懂的语言。作者并不假设读者具备基本的技术知识。有用的功能是注释和附录，提供了 `Python\
  \ 2.x` 和 `Python 3.x` 之间的一些关键区别。章末提供练习。软件容易安装和访问。包含了对游戏开发的关注。提供了“测试你的知识”和“尝试一下”章节。\n\
  \n- **Wang, Wallace. 2008. Beginning Programming All-in-One Desk Reference for Dummies.\
  \ New York: For Dummies.**: 对计算机科学的良好概述，但本身并不教编程。它确实提供了多种语言的编程基础。由于书籍年代久远，示例将无法正常运行。讨论了重要的概念，包括编译、算法、调试、最佳实践等。进阶概念包括生物信息学、计算机安全和人工智能。\n\
  \n- **Yelton, Andromeda. 2015. Coding for Librarians: Learning by Example. Chicago:\
  \ American Library Association.**: 汇编了对管理员的采访，收集了如今图书馆中真实的可学习程序示例，这得益于那些学习编码来解决问题的管理员。\n\
  \n- **Zelle, John. 2010. Python Programming: An Introduction to Computer Science.\
  \ 2nd ed. Portland, OR: Franklin, Beedle & Associates.**: 对通用理论计算机科学概念非常好的介绍，重点关注使用\
  \ `Python 3` 作为首选语言解决问题。被评认为是对普通编程和特定的 `Python` 来说都是初者的优秀教材。示例较具有数学性，因此可能较学，但提供了关于可以实现的坚实示例。它没有一步步教\
  \ `Python`。其他书籍提供了更好的 `Python` 编程。\n\n### Python\n\n- **Severance, Charles R. 2013.\
  \ Python for Informatics: Exploring Information. Seattle: CreateSpace.**: 免费且最好结合他的\
  \ Coursera ([coursera.com](http://coursera.com)) 课程一起使用。尽管标题如此，但它是以真实世界数据示例为背景的\
  \ `Python` 介绍。一本简洁且引人入胜的入门书。适用于 `Python 2.x`。\n\n- **Shaw, Zed A. 2015. Learn Python\
  \ the Hard Way. [`learnpythonthehardway.org/book`](http://learnpythonthehardway.org/book)/.**:\
  \ 初学者的 `Python` 坚实概述。并不总是易于遵循，但提供了综合教程风格。\n\n- **Sweigart, Al. 2015. Automate the\
  \ Boring Stuff with Python: Practical Programming for Total Beginners. San Francisco:\
  \ No Starch Press.**: 针对 `Python` 编程新手的技能和概念，但不一定是绝对初学者。提供了通用编程概念的坚实背景。将内容拆成小块以便记忆。构建日常使用的工具。涵盖\
  \ `Python 3`。\n\n### Ruby\n\n- **Metz, Sandi. 2012. Practical Object-Oriented Design\
  \ in Ruby: An Agile Primer. Boston: Addison-Wesley.**: 关于对象设计的坚实论述。以 `Ruby` 为背景，但内容可以扩展到其他对象语言。对于绝对初学者来说可能太多，但一旦掌握了\
  \ `Ruby` 的基础，非常值得读。\n\n- **Pine, Chris. Learn to Program. 2nd ed. Frisco, TX: Pragmatic\
  \ Bookshelf.**: `Ruby` 编程的良好介绍。\n\n### JavaScript\n\n- **Free Code Camp**. [`www.freecodecamp.com`](http://www.freecode.com)/.\
  \ 练习 `JavaScript` 的免费在线资源。\n\n- **Myers, Mark. 2014. A Smarter Way to Learn JavaScript:\
  \ The New Approach That Uses Technology to Cut Your Effort in Half. Seattle: CreateSpace.**:\
  \ 为 `JavaScript` 基础提供了坚实的基础，特别是许多“初级”书籍忽略的最基础内容。用易于遵循的语言编写，设计良好。提供了一个沙盒环境来练习示例。互动性极强。示例非常多。\n\
  \n- **Zakas, Nicholas C. 2014. The Principles of Object-Oriented JavaScript. San\
  \ Francisco: No Starch Press.**: 在某些基础的基础上构建，因为它完全适用于 `JavaScript` 的对象特性。解释非常清晰。\n\
  \n## Perl\n\n- **Christiansen, Tom, Brian D. Foy, Larry Wall, and Jon Orwant. 2012.\
  \ Programming Perl: Unmatched Power for Text Processing and Scripting. 4th ed. Sebastopol,\
  \ CA: O’Reilly Media.**: 被认为是 `Perl` 之书。不作为初学者书籍，但在具有编程经验后是第二阶教材。\n\n\n\n\n\nSchwartz,\
  \ Randal L., Brian D. Foy, and Tom Phoenix. 2011\\. Learning Perl. 6th ed. Sebastopol,\
  \ CA: O’Reilly Media. 该书为 `Perl` 的机制提供了一种非常实用的方法，侧重于随着章节推进而不断积累的知识。它是学习 `Perl` 的极佳入门。可能需要旁边放一本通用的编程书籍，因为这本书本身并不介绍编程概念。\n\
  \n### PHP\n\n[C4Learn.com](http://C4Learn.com). [`www.c4learn.com/php/php-syntax/`](http://www.c4learn.com/php/php-syntax/)。一个设计良好的网站，左侧始终可见目录。它通过易于遵循的示例引导用户从基础转向更复杂的编程。\n\
  \nPHP The Right Way. [`www.phptherightway.com`](http://www.phptherightway.com)/.\
  \ 涵盖了从基础到高级的信息，包括模板、错误与异常、服务器与部署以及额外资源。\n\n## SQL\n\nForta, Ben. 2012\\. SQL in\
  \ 10 Minutes. 4th ed. Indianapolis: Sams. 为初学者使用 `SQL` 提供了坚实的背景。包含了最常见的语句和子句。对术语定义清晰。在结尾介绍了一些高级主题，以展示\
  \ `SQL` 的功能。通过主要的 DBMS：`MYSQL`、`SQL Server`、`Oracle` 和 `DB2` 进行示例教学。可下载的材料结合分步骤说明以及两个免费数据库工具，有助于巩固信息。\n\
  \n## C\n\nPerry, Greg, and Dean Miller. 2013\\. C Programming Absolute Beginner’s\
  \ Guide. 3rd ed. Indianapolis: Que. 这是一本非常适合初学者的书，从基础开始引导用户进入更高级的话题。作者将主题分成短章节，提供了强大且多样化的示例。内容专为非技术人员编写。\n\
  \n## C#\n\nMiles, Rob. 2015\\. The C# Programming Yellow Book. [`www.robmiles.com/c-yellow-book/`](http://www.robmiles.com/c-yellow-book/)。同样提供\
  \ Amazon Kindle 电子书版本。提供了关于 `C#` 语言的细节，并为专业编程的推荐实践提供了良好的背景。文编写良好且易于理解。\n\nUsing\
  \ the Visual C# Development Environment. [`msdn.microsoft.com/en-us/library/ms173063.aspx`](https://msdn.microsoft.com/en-us/library/ms173063.aspx)。良好涵盖了\
