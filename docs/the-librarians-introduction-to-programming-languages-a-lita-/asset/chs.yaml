  \n### 图书与论文\n\n- Burch, Carl. 2011\\. Python 程序员的 C 语言。 [`www.toves.org/books/cpy`](http://www.toves.org/books/cpy)/.\
  \ Python 的流行使其成为许多想要学习编程的人的首选。这本在线教程/书籍旨在向熟悉 Python 的人介绍 C 语言。\n- Klemens, Ben.\
  \ 2014\\. 21 世纪的 C：新流派的 C 技巧. 第 2 版. 加州塞巴斯托波尔: O’Reilly Media。这是一本现代论著，讨论了 C 在当今语言格局中的作用。它是为已经具有一定编程知识并希望学习\
  \ C 语言的读者写的，特别关注仍然具有意义的内容。\n- 硬核方法学 C。 [`c.learncodethehardway.org/book`](http://c.learncodethehardway.org/book)/。不要被标题误导。这本在线书籍介绍了一种现代\
  \ C 语言学习课程，并提供了五十多个教程，展示了 C 语言的现代用途以及它作为一种语言仍然重要的原因。\n- Miller, Evan. 2014\\. “你不能向上挖掘.”\
  \ [`www.evanmiller.org/you-cant-dig-upwards.html`](http://www.evanmiller.org/you-cant-dig-upwards.html)。虽然这篇随笔并不是关于\
  \ C 语言的教程，但它确实为为什么 C 是一门值得花学习的重要语言提供了思考。Miller 在编写良好、安全且高效的代码与 C 知识如何为实现这一点提供见解之间建立了类比。\n\
  - Purdum, Jack J. 2012\\. Arduino C 入门：为 Arduino 及兼容微控制器学习 C 语言编程。纽约: Springer E-Books。这本书介绍了\
  \ Arduino 微控制器，并专门查看了与其配合的编程语言在外观和功能上如何像 C。它是为没有任何编程经验或 Arduino 实验经验的初级读者设计的。\n\n\
  ## 第九章\n\n## C#\n\nPeter Tyrrell\n\n### 历史与发展\n\nC# (读作 See Sharp) 是微软开发的一种用于 .NET\
  \ 框架编程的语言。.NET 是由指令、方法和库组成的庞大体系，反映了你在 Windows 环境中要求计算设备执行的所有可能任务。.NET 是 Windows\
  \ 本身的核心，也是微软在过去十年中几乎所有产品的核心：SQL Server 数据库平台、MS Office、Windows 手机和平板、Windows 服务器和桌面版、网站和\
  \ Web 应用程序等。关键点在于，C# 与 .NET 不可分，极很少在没有它的情况下单独使用。作为一名管理员，你可能会使用 C# 创建动态网站、移动端应用程序、命令行工具、Office\
  \ 插件或为 Windows 设计的软件应用程序。\n\nC# 的历史与微软 .NET 框架的诞生和成熟紧密相关（Hasan 2012）。.NET 取代了早期为不同目的而独立开发的框架，这些框架因此像是孤岛一样。例如，在\
  \ 20 世纪 90 年代末 .NET 发明左右，网络的重要性日益增加，因此微软自然地发布了一个框架来利用这一点——它被称为 ASP，或活动服务器页面（Active\
  \ Server Pages），它是脚本引擎的早期尝试。也就是说，你可以创建根据用户输入做出反应的网页，或者与数据库通信并提供结果，而不像仅限于 HTML 的静态网页那样简单。\n\
  \n虽然 ASP 在网页功能上迈出了一大步，但它在与主机服务器交互方面存在许多局限性。服务器端函数是脆弱的，因为 Windows 上的多个应用程序可能依赖于一组被称为\
  \ COM 对象的函数。在任何时刻，只允许一个 COM 对象的特定版本处于激活，因此程序员很容易对 COM 对象进行微小的更改，从而破坏许多应用程序。这在口语中被称为\
  \ `DLL 地狱`（DLL hell），我亲眼看到过由于这种直接结果，程序员大声咒着非常难听的话。\n\n.NET 的创建是为了解决兼容性问题，并消除 Windows\
  \ 环境下编程领域那种杂乱无章的本质。它为“微软的一切的事物”提供了一个全面且一致的接口——大部分情况下如此。当然，关于它的细微之处存在争论，但总体来说，人们在\
  \ .NET 的驾驶舱内编写 Windows 桌面软件、ASP.NET 网站或手机 App 会感到很自如。.NET 是你进入微软广阔领域必须携带的瑞士军刀。\n\
  \n那么，回到 C#。发明 C# 的原因并不完全清楚。微软有一种名为 Visual Basic 的首选语言，你今天在为 .NET 编程时仍然可以使用。目前 .NET\
  \ 演进的主流方向是向一个更通用的平台发展，你可以在选择的操作系统（甚至是 Mac 和 Linux）上带来你选择的语言。但在 2000 年，人们认为有必要发明能够以最小失真反映\
  \ .NET 哲学和本质的语言，从而最大限地发挥 .NET 带来的优势和变化。企业自尊可能也起了作用，但我们在这里不对一个组织设定基调并引导使用其工具的人的想法意愿做出评判。\n\
  \n\n\n\nC# 曾与 Java 进行过比较，它在该竞争语言/框架出现仅六年后被发明。它们在语法和表达上有着表面上的相似之处，甚至在对于组织代码的假设（例如，面向对象的方法）上也是如此。面向对象的语言使用“类”，即经过封装的代码模块，这些模块具有功能上的统一性，并暴露方法和属性，这些类可以被其他类扩展、继承或与其进行交互。然而，对\
  \ C# 诞生产生最大影响的可能是 `C` 语言及其派生语言 `C++`：`C#` 这个名字正反映了这一点。`C` 和 `C++` 被“严肃”的程序员广泛使用，而\
  \ C# 旨在为这一群体提供通往 `.NET` 的桥梁，但 C# 的发明者们也想解决他们认为这些早期语言存在的缺陷（Hasan 2012）。\n\n尽管 C#\
  \ 与其他 C 类语言共享语法特征，但它的受托管程度要得多。这意味着它在后台做了大量工作，以确保一个“安全”的环境，从而缓解或消除了常见的编程失误。一个例子就是它的自动内存管理和垃圾回收（清理未使用的内存）。`C`\
  \ 或 `C++` 的程序员需要为其代码运行分配内存，然后确保代码在执行后自行清理，以避免内存泄漏，这可能是一项非常繁琐的操作。多少内存才足以避免内存溢出异常？多少内存又太多，导致其他组件饥饿？在使用后应该多频繁、多激进地回收内存，考虑到垃圾回收本身会产生性能开销？尽管\
  \ `C` 和 `C++` 程序员可以构建出等同于老虎般低哮的方程式 1 赛车，并针对它们前方的道路进行高度优化，但所需的极高专业知识和细致入微的努力是大众广泛普及编程的障碍。\n\
  \n微软意识到，其 `.NET` 框架成功的关键在于开发者的采纳——尽可能多的开发者——因此 C# 语言必须在表达能力、对编程环境的控制以及易用性之间取得平衡。你可以很容易地找到那段流传视频，那是当时的微软首席执行官史夫·鲍尔默在一次会议上大汗淋漓，沙哑地对着一群可能感到惊讶但很快变得热情的观众大道：“开发者！开发者！开发者！开发者们！”（Know\
  \ Your Meme 2012）。微软真的——真的想吸引开发者使用 `.NET` 和 C#，而他们成功了。正如 20 世纪 90 年代后期和 21 世纪初，视频、摄影、新闻、观点和内容创作的负担从专门专家转向业余人员和爱好者，编程和开发也找到了更庞大的创作者群体，他们将产生下一代软件，特别是在网络上。这些开发者甚至对\
  \ `.NET` 本身及其辅助语言 C# 的方向施加了巨大的影响。如今，C# 已经非常成熟，尽管有几十种语言被适配用于 `.NET`，但 C# 仍然是最流行的。\n\
  \n### 用途\n\nC# 允许你操作 `.NET` 框架，它是微软工具、服务和技术的表示，因此 C# 的实际用途与该框架一样广泛。\n\n## Web 应用\n\
  \n`ASP.NET` 是 `.NET` 的 Web 开发部分。它依赖于 `.NET` 框架的存在并大量使用它，但它也包含了其他与 `.NET` 本身无关的组件和技术。这些其他组件都与生成网页有关，因为\
  \ `ASP.NET` 可以被定义为创建一个提供动态内容的网页的工具箱。如果你打算提供的网页在显示内容时必须做出决策、必须验证用户身份、或必须从搜索引擎或远程\
  \ API 获取内容，或者必须与数据库通信、记录页面的操作等，那么你需要一种编程语言。这就是 C# 的用用场。\n\n明确的是，C# 是一种服务端或后端语言，这意味着它在服务器上执行，而不是像\
  \ `JavaScript` 那样在客户端浏览器上执行。网络是一个无状态的环境；浏览器与服务器之间没有实时且持续的连接。一个很好的类比是邮政系统：浏览器将请求寄给服务器，服务器处理请求并发送响应。在这些短暂的活动爆发之间，服务器和浏览器被动地坐在那里，彼此都不知道对方在做什么，甚至不知道对方是否在此期间被熊拖离线。C#\
  \ 契合了场景中的“服务器处理请求”部分。\n\n在服务器上，每个响应都有一个生命周期。为了方便起见，我们称响应为网页，尽管它同样可以是编码为 `XML` 或\
  \ `JSON`（JavaScript 对象表示法）的原始信息，或者是文件，而不是 HTML 文档。`ASP.NET` 提供了响应生命周期中事件的程序化访问，在这些点上，你可以干预并做出决策或以某种方式修改输出。从实践上说，你的大部分代码倾向于位于同一个事件点，即你可以获取有关客户端请求的所有信息的地方，以及关于当前服务器状态的大量信息。\n\
  \n让我们来看典型的响应生命周期。首先，验证客户端请求。在用户尚未登录时，他们会被引导到登录页面的这一点。通常情况下，身份验证是 `ASP.NET` 中的一个配置问题，你不需要代码来专门检查每次请求的身份验证。\n\
  \n### 登录示例\n\n```csharp\npublic class AuthenticationController : BaseController\n\
  {\n    private readonly IAuthenticateService _authService;\n\n    public AuthenticationController(IAuthenticateService\
  \ authService, ILogger logger)\n    : base(logger)\n    {\n        _authService\
  \ = authService;\n    }\n\n    [AllowAnonymous]\n    public ActionResult Login(string\
  \ returnUrl)\n    {\n        return View(\"Login\");\n    }\n}\n\n/*\n声明式属性（如 [HttpPost]）是对其修饰的方法的元编程。[HttpPost]\
  \ 声明这个登录方法重载（而不是上面那个）将处理 POST 请求（即用户提交登录表单时）。[AllowAnonymous] 声明允许未验证的用户访问——否则他们如何登录？\n\
  */\n\n    [HttpPost]\n    [AllowAnonymous]\n/*\nLoginViewModel 包含了用户在登录表单中输入的值。returnUrl\
  \ 是用户在重定向到登录之前尝试访问的地方，也是登录成功后用户将被返回的地方。\n*/\n    public ActionResult Login(LoginViewModel\
  \ login, string returnUrl)\n    {\n        if (!ModelState.IsValid)\n        {\n\
  \            ViewBag.Error = \"表单无效；请检查并重试。\";\n            return View(\"Login\"\
  );\n        }\n\n        /*\n身份验证服务如何检查凭据在这里被隐藏了（可能它会与数据库通信），但这正是关键所在。我们在此级别不需要知道。这使得更改身份验证服务内部的工作方式变得容易，而不破坏依赖它的代码。\n\
  */\n        if (_authService.Authenticate(login.User, login.Password))\n       \
  \ {\n            /*\nFormsAuthentication 是内置于 .NET 的。SetAuthCookie() 方法将 Cookie\
  \ 形式的加密身份令牌添加到响应中。从以后，Cookie 将每次请求/响应中往返传递，并每次由内置的 ASP.NET 检查器进行检查，因此我们不需要手动操作。\n\
  \            */\n        }\n    }\n```\n\n\n\n\n\n```csharp\nFormsAuthentication.SetAuthCookie(login.Username,\
  \ false);\n\nif (_authService.ValidateReturnUrl(returnUrl))\n{\n    return Redirect(returnUrl);\n\
  }\nelse\n{\n    return RedirectToAction(\"Index\", \"Home\");\n}\n}\n\nViewBag.Error\
  \ = \"Credentials invalid. Please try again.\";\nreturn View(\"Login\");\n}\n\n\
  public ActionResult Logout()\n{\n    Session.Clear();\n    FormsAuthentication.SignOut();\n\
  \    return RedirectToAction(\"Index\", \"Home\");\n}\n```\n\n如果请求已经过身份验证，你可能仍然需要检查用户是否有权获取响应。例如，如果页面仅供管理员访问，则你需要检查他们是否属于管理员角色。\n\
  \n### 授权示例\n\n```csharp\n[Authorize(Roles = \"Administrator, Super User\")]\npublic\
  \ ActionResult Admin() {\n    return View();\n}\n```\n\n接下来，检查客户端请求以获取如何操作的信号。这些信号可能编码在请求的\
  \ URL 路径中，或者在查询字符串中以键值对的形式参数化，或者是随请求包中提交的与 URL 值完全无关的任意数据（包括 cookie）。还可以查看请求头——这些头通常包含关于请求和请求者的元信息。然后，获取满足客户端请求所需的任何内容。这可能需要查询数据库或其他数据源。\n\
  \n### 永久链接示例\n\n```csharp\npublic class HomeController : BaseController {\n    private\
  \ readonly ISearchService _searchService;\n    private readonly ILogger _logger;\n\
  \    public HomeController(ISearchService searchService, ILogger logger)\n    :\
  \ base(logger) {\n        _searchService = searchService;\n        _logger = logger;\n\
  \    }\n/*\n\n永久链接 URL 可能是 http://example.andornot.com/permalink/123，但除非我们显式检查，否则我们在这一层并不知道。URL\
  \ 在早的路由代码中经过检查，如果匹配到永久链接模式，则会将 ID 部分发送到这里。这意味着你可以有多个模式路由到此 Permalink 方法。\n*/\n\n\
  \    public ActionResult Permalink(string id) {\n        if (string.IsNullOrEmpty(id))\
  \ {\n            /*\n            不向视图传递模型等同于传递 null。视图可以检查模型是否为空并显示“无此类永久链接”的内容。\n\
  \            */\n            return View(\"Permalink\");\n        }\n/*\n      \
  \  ISearchResults 是我们在别处定义的代码，用于存储搜索引擎返回的搜索结果信息。搜索服务也是我们编写的与搜索引擎通信的代码。因此，“模型”将封装有关搜索引擎查询的所有信息，包括如果搜索成功时对应\
  \ ID 的结果。\n*/\n        ISearchResults model = _searchService.Single(id);\n/*\n \
  \       视图负责样式和渲染模型中持有的原始搜索结果数据。这是你看到 HTML 的地方。\n*/\n        return View(\"Permalink\"\
  , model);\n    }\n}\n```\n\n将原始信息传递给视图，在视图中将其绑定到 HTML 或用于做出如何构建 HTML 的决策。\n\n###\
  \ 永久链接视图示例\n\n```razor\n@model ISearchResultModel // 注意：原文中此处应为模型定义\n/*\n此视图包含在通用布局视图的\
  \ HTML 包装中。\n*/\n```\n此处根据原文代码块翻译：\n```razor\n@model ISearchResultModel\n\n@{\n\
  /*\n此视图包含在通用布局视图的 HTML 包装中。\n*/\n    Layout = \"~/Views/Shared/_Layout.cshtml\"\
  ;\n/*\n模型包含作为强类型文档集合的搜索结果。Model.Documents 的类型为 List<Document>。\n*/\n    var doc\
  \ = Model.Documents.SingleOrDefault();\n    string title = doc == null ? \"Bad Permalink\"\
  \ : doc.Title;\n/*\nViewBag 是内置于视图的动态集合（“袋”）。它提供了一种在视图与视图之间传递任意信息的方便方法。这里的标题将被分配给布局中的\
  \ HTML 标签。\n*/\n    ViewBag.Title = title;\n}\n@if (doc == null)\n{\n    <ul>\n\
  \        <li>\n            <h2><span class=\"text-found\">未找到</span>该 ID 的文档。<span\
  \ class=\"divider\"> </span></h2>\n        </li>\n        <li>\n            那里是拼写错误吗？请重试，或者尝试改用\
  \ @Html.ActionLink(\"新搜索\", \"Index\", \"Home\")。\n        </li>\n    </ul>\n}\n\
  else\n{\n    <div class=\"permalink-view\">@{\n/*\n在这里我们将模型传递给共享视图，在共享视图中，如果单个搜索结果是搜索结果集的一部分，它将以相同的方式布局。我们不需要仅为永久链接视图重新创建布局，并且保持了\
  \ DRY（不要重复自己）。\n*/\n    Html.RenderPartial(\"_List\", Model);\n}\n    </div>\n}\n\
  ```\n\n### 优缺点\n\n有两组 C# 的优缺点需要考虑：与其他编程框架相比的 C# 和 .NET，以及与 .NET 框架内其他语言相比的 C#。\n\
  \n### C# 和 .NET 与其他框架的对比\n\n选择与何种编程框架或环境一起工作是基础性的：这一决定将影响你从今以后做的一切，从编写软件时使用的工具到它可以部署的操作系统。框架将影响你的设计、你解决问题的方法，甚至你可能遇到的问题类型。框架对思维的影响是微妙但深远的，这就是为什么框架倾向于产生编程文化的原因。\n\
  \nJava 国家与 .NET 王国隔着一个海洋，尽管它们都距离那片由 Ruby on Rails 土地、PHP 霸权和 Python 公国组成的人类大陆有万里之遥。这些国家和其他少数国家都有自己独特的边界、死忠的爱国者和无休止的竞争。必须以审慎的态度对待其他者对框架的任何批评。反之，建议可能带有真信者的热情，必须以怀疑的态度来看。我认为人们习惯于为自己选择的群体激烈辩护其优点，但在编程问题上，事实是它们都绰绰有余。\n\
  \n合理的做法是选择你容易获取、运行在你熟悉的操作系统上运行、并且在需要帮助时可以寻求的支持和理解的编程框架和语言。更不用说你可能会在这一决定上投入多年的人生——中途换马是不明智的。在做出框架决定时，你应该问自己以下问题：\n\
  \n* 你是否可以轻松地在计算机上设置所需的编辑工具？\n* 或者更好，是否可以使用你已经拥有并喜欢的编辑器？\n* 调试你编写的代码有多容易？\n* 你是否需要将代码编译成程序集或可执行文件，还是它作为脚本直接运行？\n\
  * 你将你制作的东西部署在何处，目标机器运行需要什么？例如，Web 需要复杂的 Web 服务器堆栈，而命令行工具只是谦虚地需要几个基础要求。\n\n### C#\
  \ 和 .NET 的优点\n\n* 文档齐全，有官方和非官方来源的广泛报道。\n\n\n\n\n\n*   拥有庞大的从业者群体可以共同交流和分享信息。\n*\
  \   成熟：十五年的迭代发布意味着 `C#` 功能完备，且充满了许多省力的快捷表达式。\n*   Windows 环境下的强有力选择：`.NET` 嵌入在每个\
  \ Windows 操作系统中。\n*   可以通过 Microsoft Azure 使用云服务器架构。\n*   `.NET Core Framework`、用于构建\
  \ Web 的 `ASP.NET 5` 以及 `C#` 编译器 `Roslyn` 已于 2014 年 11 月开源（Landwerth 2014）。\n*  \
  \ 由微软支持。\n*   微软拥有巨大的资源，并且对其编程框架的成功和采用有着深切的利益。\n*   在过去的十年里，微软的开发者部门变得日益开放，并对从业者的响应更加迅速。\n\
  \n在使用 `C#` 时，与某些完全由社区引导的开源框架相比，在解决问题时可选的方案和工具较少。初看这可能是一个缺点，但实际上是塞翁得福。通常情况下，这意味着对于某事有一种“正确”或至少是“最佳”的方法，而且这种方法通常由微软专业人士认证，而不是在无数意见以及重叠或冗余的工具中进行筛选和选择。民主是一件好事，但并不一定像仁慈的独裁那样高效。\n\
  \n### C# 和 .NET 的缺点\n\n*   在历史上与 Windows 绑定，尽管即将发布的版本将扩大对 MacOS、iOS、Linux 和 Android\
  \ 的支持。\n*   开发环境的复杂性以及初始设置的相对困难。\n\n## Visual Studio\n\n你的编程环境几乎不可避免地依赖于 `Visual\
  \ Studio`，这是由微软提供的集成开发环境（IDE）。它是一个强大的工具包，但其强大和复杂性可能会令人望而生畏。微软喜欢将 `Visual Studio`\
  \ 和 `.NET` 称为开发者“生态系统”，这应该让你对其巨大的规模和多样性有个概念。`Visual Studio` 是一个代码编辑器，对其包含的所有语言提供语法高亮和代码补全，此外支持\
  \ `CSS`、`XML`、`JavaScript` 以及其他资源。\n\n你编写的代码需要编译成程序集或可执行文件，这意味着你需要一个编译器。`Visual\
  \ Studio` 既是代码编辑器也是编译器。在技术上，没有 `Visual Studio` 编译代码是可能的，但那是一项相当高级的。\n\n一旦你的代码达到一定的复杂程度，调试（即通过步进当前运行的程序集或可执行文件的源代码，以观察正在发生的情况）就变得必要的。调试需要调试器，并需要投入一些时间学习如何有效地进行调试。`Visual\
  \ Studio` 是 `.NET` 代码作为调试器的唯一实际选择。\n\n`Visual Studio` 的好消息是，虽然专业版 `Visual Studio`\
  \ 每个许可证花费数百美元，但有一个名为 `Visual Studio Community Edition`（以前称为 `Visual Studio Express`）的免费版本。`Community\
  \ Edition` 可供个人开发者或为“非企业组织”工作的人员开发免费或付费应用。`Community Edition` 不像它的祖先 `Visual Studio\
  \ Express` 那样有功能限制，而且许可条款非常慷慨，因为“企业”被定义为拥有超过 250 台电脑或年收入超过百万美元的组织。即使在企业内部，`Community\
  \ Edition` 也可以用于贡献开源项目、学术研究或教学场景。\n\n## C# 与 .NET 内的其他语言的比较\n\n可以使用三十种语言来为 `.NET`（[`en.wikipedia.org/wiki/List_of_CLI_languages`](https://en.wikipedia.org/wiki/List_of_CLI_languages)）编程。除了使用最广泛的\
  \ `C#` 之外，著名的示例还包括以 `Managed JScript`、`IronRuby` 和 `IronPython` 形式存在的 `Javascript`、`Ruby`\
  \ 和 `Python`。\n\n`C#` 有许多技术特性比我们这里提供的空间更多，而且它们与其他语言相比是优点还是缺点在很大程度上取决于你个人的观点。可以说，`C#`\
  \ 拥有许多技巧和省力设备，可以帮助你简洁地表达意图，并有旨在防止你犯错的安全网。以下是一些功能列表，学习这些功能将使你进一步了解它们的努力有所回报：\n\n\
  *   强类型、匿名类型、类型安全\n*   面向对象，通过接口实现多重继承\n*   `LINQ`\n*   泛型 (`Generics`)\n*   Lambda\
  \ 表达式和函数式编程\n*   可空类型\n*   通过特性（attributes）进行元编程\n\n## 示例\n\n### LINQ\n\n`LINQ`\
  \ 代表语言集成查询（Language-Integrated Query）。它提供了一套查询和更新的模式，这些模式平滑并抽象了所处理的数据存储的特殊性。`LINQ\
  \ to Objects`、`LINQ to XML` 和 `LINQ to SQL` 是 `.NET` 框架默认提供的程序（Microsoft Developer\
  \ Network n.d.），例如 `LINQ to JSON` 和 `LINQ to ODATA`。\n\n`LINQ` 的优势在于这些模式相对容易学习，一旦掌握，就能为你提供一种处理各种数据源的标准方法。没有\
  \ `LINQ`，你被迫编写许多行辅助代码来支持你真正感兴趣的操作，并且你需要更深入地理解底层数据存储的反复。此外，`LINQ` 能够极大地简化原始语言中复杂混乱的语句——这对于\
  \ `SQL` 尤为如此（Albahari nd）。`LINQ` 节省了大量的时间脑脑。\n\n提到 `SQL`，你可能会发现 `LINQ` 运算符让你联想起\
  \ `SQL` 语法。这并不是因为我们一定在查询 `SQL` 数据库，而是因为了趋同演化：这些运算符是高效的表达式。尽管 `LINQ` 语法受到 `SQL` 语言的影响，但无论底层数据源性质如何，它看起来都一样。\n\
  \n### 需要的工具\n\n你需要 `LINQpad` ([`www.linqpad.net`](http://www.linqpad.net)) 或 `Visual\
  \ Studio` IDE ([`www.visualstudio.com`](https://www.visualstudio.com))。\n\n### LINQ\
  \ to Objects\n\n`.NET` 框架中任何可枚举的对象都可以用 `LINQ` 进行操作。所有内置集合类都继承自 `IEnumerable` 或 `IEnumerable<T>`\
  \ 接口，任何人都可以编写一个具有相同功能的新集合。接口是一个模板，强制你向代码中添加其命名的方法或属性。例如，`IEnumerable` 强制你添加一个 `GetEnumerator()`\
  \ 方法。至于你如何编写该方法并让它像预期的那样返回 `IEnumerator` 对象，取决于你。接口只强制方法签名。\n\n数组和列表是常用枚举集合的示例。我们通常使用\
  \ `foreach` 运算符来枚举它们，但我们也可以使用 `LINQ`，特别是当我们打算返回一个子集时。\n\n```csharp\nstring[] array\
  \ = new string[] {\"Chupacabra\", \"Sasquatch\", \"Honest Politician\"};\n\n// 通过\
  \ foreach 加载 'rarities'\nvar rarities = new List<string>();\nforeach (string item\
  \ in array) {\n  if (item.StartsWith(\"Honest\")) {\n    rarities.Add(item);\n \
  \ }\n}\n\n// 通过 LINQ 加载 'rarities'\nvar rarities =\n  from item in array\n  where\
  \ item.StartsWith(\"Honest\")\n  select item;\n```\n\n`LINQ` 版本的优势可能并非显而易见，但：\n\n\
  *   它在一个语句中声明并设置了 `rarities` 变量，这在阅读代码时消除了对 `rarities` 用途的任何歧义。\n*   片段的整体目的更容易理解。`foreach`\
  \ 循环只告诉你将进行迭代，而没有告诉你迭代将实现什么，而 `LINQ` 的 `select` 运算符清晰地信号了语句的意图。\n\n### LINQ to XML\n\
  \n\n\n\n该 XML 示例有一个根节点 `Catalog`，其中包含多个 `Book` 节点。每个 `Book` 包含一些基本元数据作为子节点，但 `id`\
  \ 除外（它是 `Book` 的一个属性）。多个作者通过重复的 `Author` 节点表示。\n\nXPath 可用于查询 XML，但在 .NET 中实现起来非常笨拙。在示例中，功能性但复杂的\
  \ XPath 方法与 LINQ 版本的简洁性之间存在相当差异。\n\n```csharp\nvar rawXml = @\"\n<Catalog>\n   \
  \ <Book id='book001'>\n        <Author>Pilkey, David</Author>\n        <Title>The\
  \ Adventures of Captain Underpants</Title>\n        <Genre>YA Fiction</Genre>\n\
  \        <PublishDate>2013-04-30</PublishDate>\n        <Description>George and\
  \ Harold have created the greatest superhero in the history of their elementary\
  \ school—and now they're going to bring him to life!</Description>\n    </Book>\n\
  \    <Book id='book002'>\n        <Author>Albahari, Joseph</Author>\n        <Author>Albahari,\
  \ Ben</Author>\n        <Title>LINQ Pocket Reference</Title>\n        <Genre>Nonfiction</Genre>\n\
  \        <PublishDate>2008-03-07</PublishDate>\n        <Description>This guide\
  \ has the detail you need to grasp Microsoft's new querying technology, and concise\
  \ explanations to help you learn it quickly.</Description>\n    </Book>\n</Catalog>\"\
  ;\n\n// 通过 XPath 获取作者\nvar xml = new XmlDocument();\ndoc.LoadXml(rawXml);\nXPathNavigator\
  \ navigator = xml.CreateNavigator();\nXPathExpression authorQuery = avigator.Compile(\"\
  /Catalog/Book/Author\");\nXPathNodeIterator iterator = navigator.Select(authorQuery);\n\
  var authors = new List<string>();\nwhile (iterator.MoveNext()) {\n    authors.Add(navigator.Value);\n\
  }\n\n// 通过 LINQ 获取作者\nvar xml = XElement.Parse(rawXml);\nvar authors =\n    from\
  \ e in xml.Descendants(\"Author\")\n    select e.Value;\n```\n\nLINQ 版本要简单得多！编写更快，阅读更易。XPATHPATH\
  \ 版本受困于过多的变量和复杂的多个步骤过程。当我阅读它时眼睛都看直了，而这还是我自己写的。XPATH 表达式本身没有问题，实际上确实有在 LINQ to XML\
  \ 中处理 XPATH 的方法，但在大多数情况下你甚至不需要它。\n\n### SQL 示例\n\n两个表分别代表书籍（表 9.1）和作者（表 9.2），中间有一个连接表，以便为每本书分配多个作者（表\
  \ 9.3）。表 9.4 显示了 BooksToAuthor 的结果。\n\n### 表 9.1.书籍信息\n\n| BookId | Title | Genre\
  \ | PublishDate | Description |\n| :--- | :--- | :--- | :--- | :--- |\n| book001\
  \ | The Adventures of Captain Underpants | YA Fiction | April 30, 2013 | George\
  \ and Harold have created the greatest superhero in the history of their elementary\
  \ school—and now they’re going to bring him to life! |\n| book002 | LINQ Pocket\
  \ Reference | Nonfiction | March 7, 2008 | This guide has the detail you need to\
  \ grasp Microsoft’s new querying technology, and concise explanations to help you\
  \ learn it quickly. |\n\n### 表 9.2. 作者信息\n\n| AuthorId | Name |\n| :--- | :--- |\n\
  | 1 | Pilkey, David |\n| 2 | Albahari, Ben |\n| 3 | Albahari, Joseph |\n\n### 表\
  \ 9.3. 书籍、作者与书籍作者关系\n\n| Books | BooksToAuthors | Authors |\n| :--- | :--- | :---\
  \ |\n| BookId | Id | AuthorId |\n| Title | BookId | Name |\n| Genre | AuthorId |\
  \ |\n| PublishDate | | |\n| Description | | |\n\n### 表 9.4. 书籍作者关系\n\n| Id | BookId\
  \ | AuthorId |\n| :--- | :--- | :--- |\n| 1 | book001 | 1 |\n| 2 | book002 | 2 |\n\
  | 3 | book002 | 3 |\n\n### SQL 查询对比：原生 SQL\n\n以下是 Transact-SQL (T-SQL) 中的 `select`\
  \ 语句：\n\n```sql\nSELECT\n    b.BookId,\n    b.Title,\n    b.Genre,\n    a.Name AS\
  \ Author\nFROM Books b\nINNER JOIN BooksToAuthors b2a ON b2a.BookId = b.BookId\n\
  INNER JOIN Authors a ON a.AuthorId = b2a.AuthorId\nWHERE b.Title LIKE \"LINQ%\"\n\
  ```\n\n`select` 查询的结果如表 9.5 所示。\n\n### 表 9.5. 查询结果\n\n| BookId | Title | Genre |\
  \ Author |\n| :--- | :--- | :--- | :--- |\n| book002 | LINQ Pocket Reference | Nonfiction\
  \ | Albahari, Ben |\n| book002 | LINQ Pocket Reference | Nonfiction | Albahari,\
  \ Joseph |\n\n尽管有一本书符合查询条件，但结果被去规范化为两行，每个作者各占一行。可以使用 SQL 将作者合并为单行，但这需要一些技巧。即使将作者连接（concatenate）到同一列中，它们也会变成一个单一值，例如\
  \ `Albahari, Ben|Albahari, Joseph`。人类肉眼可以很容易地理解该值是两个合并的子值，但除非被告知要分割，否则计算机并不知道它们是独立的实体。这并非不可能的任务，只是不符合理想。另一种方案是获取这两行并编写代码根据\
  \ `id` 手动将它们合并，以准确反映数据作为单一标题的真实本质。如果查询结果已经反映了这一点难道不是更好吗？\n\n### SQL 查询对比：LINQ\n\n\
  下面的 LINQ 语句与上面的 SQL 内部连接（inner join）基本等，但在这种情况下实际上不需要显式的连接语法即可获取所需。变量 `db` 代表 SQL\
  \ 数据库对象，并假设在配置 LINQ 作为对象关系映射（ORM）过程的一部分时已经定义。因此，它了解 SQL 表、列类型和关系。简而言之，这就是 LINQ to\
  \ SQL 强大之处的大部分：我们不需要在每次编写查询时都定义连接，而是提前解释这些关系，并从更简洁的代码中获益。\n\n我们动态创建一个作者集合，以便将多个作者分组在一起，并过滤出有作者的书籍。\n\
  \n```csharp\nvar books =\n    from b2a in db.BooksToAuthor\n    where b2a.Books.Title.StartsWith(\"\
  LINQ\")\n    let authors = b2a.Authors.Name\n    where authors.Any()\n    select\
  \ new CatalogBook\n    {\n        Id = b2a.BookId,\n        Title = b2a.Books.Title,\n\
  \        Genre = b2a.Books.Genre,\n        Authors = authors\n    };\n```\n\n查询的结果始终是一个\
  \ `enumerable` 集合。在这种情况下，变量 `books` 包含了每个匹配项的 `CatalogBook` 对象。我们本可以为每个创建一个匿名对象，省去在某处定义\
  \ `CatalogBook` 类型的麻烦，但使用强类型类如 `CatalogBook` 替代匿名对象的优势是，我们在处理它时总是知道会有什么。`CatalogBook`\
  \ 的实例将具有一个值数组属性 `Authors`，而不是有时是数组有时是单一值。预知是 . . . er，力量：我们可以在代码的其他地方继续使用 `CatalogBook`，且始终保持相同的预期，而无需手动解释或转换数据库查询的结果。\n\
  \n将数据库结果立即映射到强类型对象还有另一个更细微的好处，即如果数据库结果不符合对象的预期，将在该点发生错误。错误！没错——而且这是好事。“尽早失败，经常失败”这一建议听起来违背直觉，但由于错误可以在代码中被捕获和处理，因此越早知道问题在何时、何地以及是如何发生的就越好。被放任的问题会在以后引起问题，那时将更难诊断并追溯到其实的源头。“Enumerable”意味着该集合可以进行循环，如下所示的\
  \ `foreach` 结构：\n\n```csharp\nforeach (var book in books) {\n    Console.WriteLine(string.Format(\"\
  {0}, {1}, {2}, {3}\",\n        book.BookId,\n        book.Title,\n        book.Genre,\n\
  \        string.Join(\"; \", book.Authors));\n}\n```\n\n\n\nC# 是一种无处不在的服务端语言，与 `.NET`\
  \ 紧密相连。这使得 `C#` 在 Windows 环境能够完美胜各种任务。在微软的有力支持下，`C#` 拥有完善的文档并广泛讨论。除了相当容易学习之外，它还提供了一些安全保障，让初学者保持“安全”。\n\
