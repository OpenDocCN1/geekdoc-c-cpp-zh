  \n[content]\n要处理 CSV 数据，我们首先导入 `csv` 包，这只是一个预定义的包，是 Python 基础安装的一部分。然后我们使用相同的代码两次打开\
  \ `issns_from_catalog.csv` 和 `issns_from_vendor.csv` 文件，分别使用 `'r'` 参数指定只读，并将每个文件命名为\
  \ `f`（在此时我们可以给它们任何名称；f 只是打开文件时的常用变量命名惯例）。\n\nOnce we have our two lists, we simply\
  \ say, “for every `issn` in the `from_catalog` list, check if it is not in the `from_vendor`\
  \ list, and print those to the screen.” This example demonstrates one very simple\
  \ way to go about this.\n\nNext,我们可以对上面的比较代码进行微调：\n\n```python\nnot_in_both = []\n\
  \nfor issn in from_catalog:\n    if issn not in from_vendor:\n        not_in_both.append(issn)\n\
  ```\n\n\n\n如你所见，这段代码的工作原理与上面的代码非常相似。现在我们只是先通过空括号创建一个名为 `not_in_both` 的空列表（在 `Python`\
  \ 以及许多其他语言中，你可以通过空括号或空大括号来创建一个容器的空版本；当你想要一个列表但希望在过程中填充它，而不是一次性填满时，这些非常有用），我们将在处理过程中将存在于\
  \ `from_catalog` 中但不在 `from_vendor` 中的 ISSN 填充该列表。一旦完成检查，我们就使用 `.append` 将这些 ISSN\
  \ 放入 `not_in_both` 中，该方法的作用是将一个项添加到列表的末尾。\n\n为了更直观地理解 `.append()`，请想象一个物理例子：假设我们有一个名为\
  \ `numbers` 的列表，其中包含 1, 2 和 3，例如 `numbers = [1,2,3]`。如果我们想向该列表添加 4，使用 `numbers.append(4)`\
  \ 就会得到列表 `[1,2,3,4]`。因此，当这段代码执行结束时，我们已经处理了数千个期刊的 ISSN，并列出了那些我们的目录声称拥有访问权限但供应商未列出的\
  \ ISSN。对于大约十一行代码来说，这很不错了。\n\n我们可能想要做的最后一个改进是创建一个新文件列出所有这些 ISSN，这样我们就可以将它们发送给目录员或供应商，以从根源解决差异问题。为了做到，我们将像之前打开\
  \ CSV 文件一样打开另一个文件，但有一个关键区别。\n\n```python\nwith open('compared_lists.txt', 'w') as\
  \ f:\n    for issn in not_in_both:\n        f.write(issn+'\\n')\n```\n\n我们的起始方式与上面打开\
  \ CSV 文件非常相似，使用 `with open` 和文件名来实际打开文件，但这次我们使用参数 `'w'` 告诉 `Python` 我们要向该文件写入，而不是使用\
  \ `'r'` 读取（请注意：每当你使用 `'w'` 打开文件时，文件中当前的所有内容都会在添加任何新内容之前被删除，因此请小心不要覆盖重要信息）。然后，我们使用\
  \ `for` 遍历刚刚创建的 `not_in_both` 列表中的所有内容。对于该列表中的每一项，我们告诉 `Python` 将 ISSN 写入我们称为 `f`\
  \ 的文件，并添加换行符 (`\\n`)，以便每个 ISSN 独占一行。作为一个额外奖励，你甚至不需要担心在打开之前是否存在一个名为 `compared_lists.txt`\
  \ 的文件；如果它不存在，`Python` 将自动为你创建。\n\n我们可以将所有部分组合在一起，得到一个小型程序，可以自动完成人类视觉需要花费数小时的任务。如果一切还没有完全理解，请坚持下去，并知道列表、文件操作、包、函数等细节将随着你的学习和实践而变得清晰。即使现在还不清楚，我们也希望你能看到\
  \ `Python` 是编写这些可以自动化常用任务的简短实用程序的优秀语言，而且只需要大约十四行代码，我们就打开了两个文件，从中获取了数条信息，对它们进行了比较，并创建了一个列出结果的新文件。\n\
  \n这是我们刚刚创建的完整程序：\n\n```python\nimport csv\n\nwith open('issns_from_catalog.cvs',\
  \ 'r') as f:\n    catalog_reader = csv.reader(f, delimiter=',')\n    from_catalog\
  \ = list(catalog_reader)\n\nwith open('issns_from_vendor.csv', 'r') as f:\n    vendor_reader\
  \ = csv.reader(f, delimiter=',')\n    from_vendor = list(vendor_reader)\n\nnot_in_both\
  \ = []\n\nfor issn in from_catalog:\n    if issn not in from_vendor:\n        not_in_both.append(issn)\n\
  \nwith open('compared_lists.txt', 'w') as f:\n    for issn in not_in_both:\n   \
  \     f.write(issn+'\\n')\n```\n\n#### 用于批量处理 MARC 记录的 PyMARC\n\n对于编目员来说，`PyMARC`\
  \ 模块对于批量处理 MARC 记录集和自动化技术服务工作流特别有用。可以通过运行命令 `pip install pymarc` 下载 `PyMARC`。你可以在\
  \ `PyMARC` 的 GitHub 页面 [`github.com/edsu/pymarc`](https://github.com/edsu/pymarc)\
  \ 找到文档。`PyMARC` 包含了许多核心函数，允许你从原始二进制 MARC 记录数据中提取、分析、添加或删除字段和子字段。这些核心函数根据操作级别分为不同的类，例如文件级、记录级或字段级。\n\
  \n例如，有一些文件级函数允许你读取或写入 `.mrc` 格式的二进制 MARC 记录文件——`MARCReader()` 和 `MARCWriter()` 函数。这两个函数都需要将\
  \ `.mrc` 文件的文件名作为参数传递给函数，如下：\n\n```python\nmarc_recs_in = pymarc.MARCReader(file('marc_input.mrc'))\n\
  ```\n\n```python\nmarc_recs_out = pymarc.MARCWriter(file('marc_output.mrc'), 'w')\n\
  ```\n\n注意 `MARCWriter()` 函数也需要 `'w'` 以确保文件是可写的。还有额外的可选参数可以配合 `MARCReader` 使用来处理\
  \ Unicode 和 UTF8：\n\n```python\nmarc_recs_in = pymarc.MARCReader(file('marc_input.mrc'),\
  \ to_unicode=True, force_utf8=True)\n```\n\n在记录级，常用的函数涉及三个任务：\n\n1. 使用 `record.get_fields()`\
  \ 从记录获取字段\n2. 使用 `record.remove_field()` 从记录中删除字段\n3. 使用 `record.add_field()` 向记录中添加字段\n\
  \n`get_fields()` 函数接受一个或多个由逗号分隔的字段标记，并返回这些字段的实例。`remove_field()` 函数接收字段对象并将其移除。`add_field()`\
  \ 函数接收你要构建的字段对象。\n\n字段级函数的工作与记录级函数非常相似，只是你是在字段而不是记录上获取、设置或删除：\n\n1. 使用 `field.get_subfields()`\
  \ 从字段获取子字段\n2. 使用 `field.delete_subfield()` 从字段中删除子字段\n3. 使用 `field.add_subfield()`\
  \ 向字段添加子字段\n\n现在假设你想为这本书创建一个占位记录，直到你有机会对其进行完整的编目。你首先将导入所需的模块，在本例中为 `pymarc`，然后创建一个新记录。它将作为一个空白“记录对象”开始，向其添加字段。\n\
  \n```python\nimport pymarc\n\nnew_record = pymarc.Record()\n```\n\n首先，将其命名为 `new_record`\
  \ 没什么。你可以命名为 `gryffindor` 程序同样可以运行，但良好的做法是用描述其内容的方式来命名。注意，由于 `Record()` 函数来自 `pymarc`\
  \ 模块，我们必须告诉 `Python` 从那里获取 `Record()`，因此在前面加上 `pymarc`。\n\n接下来，我们将使用 `Field()` 函数为我们的记录创建一个新字段：\n\
  \n```python\nnew_field_245 = pymarc.Field(\n    tag = '245',\n    indicators = ['0','0'],\n\
  \    subfields = [\n        'a', 'Programming for librarians /',\n        'c', 'edited\
  \ by Beth Thomsett-Scott.'\n    ]\n)\n```\n\n在这里我们只是告诉 `Python` 这是一个字段。然后我们提供有关该字段的信息，包括\
  \ MARC 标签号、指示值以及子字段及其内容的列表。与大多数编程语言一样，文本字符串是非常字面的，所以注意标点必须包含在字段内容值中，以便按照标准的 AACR\
  \ 规则（[`www.aacr2.org`](http://www.aacr2.org)/）创建子字段。上面的 `Field()` 命令创建了以下 245 标题字段，并将其赋值给变量\
  \ `new_field_245`：\n\n\n\n\n\n# 245 0 0 $aProgramming for librarians / $cedited\
  \ by Beth Thomsett-Scott.\n\n我们可以对任何数量的字段执行操作。例如，由于我们知道编辑者，我们可以为她创建一个 700 个人名字段：\n\
  \n```python\nnew_field_700 = pymarc.Field(\n    tag = '700',\n    indicators = ['1','\
  \ '],\n    subfields = ['a', 'Thomsett-Scott, Beth C.']\n)\n```\n\n最后，我们想将这两个字段都添加到我们的记录中，并将该记录写入文件（正如本章提供的第一个示例所示）。\n\
  \n```python\nnew_record.add_ordered_field(new_field_245)\nnew_record.add_ordered_field(new_field_700)\n\
  with open('output.mrc', 'w') as f:\n    f.write(new_record.as_marc())\n```\n\n这告诉\
  \ Python 使用 `add_ordered_field()` 函数按照字段编号将我们创建的两个字段添加到记录中，通过运行 `as_marc()` 确保其格式正确，然后将记录写入名为\
  \ `output.mrc` 的文件。这样，我们就可以通过脚本程序化地创建一个 MARC 记录，该脚本可以快速升级，通过从 CSV 文件或其他数据源提取字段数据（即标题和作者），一次性创建数百条记录。创建此新简短记录的完整脚本汇总如下。\n\
  \n```python\nimport pymarc\n\nnew_record = pymarc.Record()\n\nnew_field_245 = pymarc.Field(\n\
  \    tag = '245',\n    indicators = ['0','0'],\n    subfields = ['a', 'Programming\
  \ for librarians /',\n    'c', 'edited by Beth Thomsett-Scott.']\n)\n\nnew_field_700\
  \ = pymarc.Field(\n    tag = '700',\n    indicators = ['1',' '],\n    subfields\
  \ = ['a', 'Thomsett-Scott, Beth C.']\n)\n\nnew_record.add_ordered_field(new_field_245)\n\
  new_record.add_ordered_field(new_field_700)\nwith open('output.mrc', 'w') as f:\n\
  \    f.write(new_record.as_marc())\n```\n\n## 总结\n\nPython 是一种开源、简单、灵活的编程语言，用于从系统开发到\
  \ Web 开发的各个领域。这种语言以及使用它的充满活力的活跃社区非常看重代码的可读性和尽可能的直观性；清晰优于巧妙，开放优于隐藏。这促使社区发布了大量的开源代码，包括像\
  \ `PyMARC` 这样针对特定库的包，使得人们可以轻松完成任务，而不是重复造轮子。这些清晰的元素（它强烈鼓励你从一开始就编写编写良好、易读的代码）以及深度，使其成为非常适合学习的第一门编程语言，同时也成为用于大型复杂项目的一种强大且可扩展的语言。\n\
