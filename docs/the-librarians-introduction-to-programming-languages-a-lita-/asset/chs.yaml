  \ 命令和脚本文件名调用并运行完整的 Python 脚本之间的区别（此处为 Windows DOS 提示符）：`C:\\> python myPythonScript.py`。Python\
  \ shell 允许在使用之前检查函数的运行情况，或者在交互式环境中解决一些棘手代码。这是一个很有用的功能，但你的任何精妙代码都不会被保存，因此一旦你使用提示符解决了某个问题，务必将其移动到\
  \ `.py` 文件并保存，以便以后像上面所示使用。\n\n## 示例\n\n## 使用 Python 对馆品\n\nPython 擅长的一个领域是编写较短的脚本来自动化日常任务。例如，如果我们有一份来自供应商的馆品列表，并想将其与我们目录中的馆品进行比对，即使馆品数量较少，这项任务也会变得繁重。然而，通过\
  \ Python 我们可以快速编写一个脚本来自动化我们的任务，腾出时间去喝杯咖啡。\n\n```\nfrom_vendor = ['1234-5678', '2345-6789',\
  \ '3456-7890']\nfrom_catalog = ['1234-5678', '2345-6789', '3456-7890', '1111-2222']\n\
  \nfor issn in from_catalog:\n    if issn not in from_vendor:\n        print issn\n\
  ```\n\n这个示例演示了处理此任务的一种非常简单的方法。我们创建了两个变量 `from_vendor` 和 `from_catalog`，并将 ISSN 数字列表放入这些变量中（在\
  \ Python 中，方括号通常表示列表，直白来说就是一个用逗号分隔的数据点列表；此外，这些数据点可以是任何内容，因此 `['a', 'number', 3]`\
  \ 是一个完全有效的列表）。之后我们使用 `for` 循环比较这两个列表。Python 的编写方式有时被称为“可执行伪代码”，因为该语言的语法比大多数编程语言更接近英语，这段代码可以给你一些思路。\n\
