  \ `Window`（窗口）然后选择面板名称来切换面板的显示。\n\n![](img/Figure_6.1.jpg)\n图 6.1. 初始化新项目。\n\n![](img/Figure_6.2.jpg)\n\
  图 6.2. 新项目设置。\n\n![](img/Figure_6.3.jpg)\n图 6.3. 新项目运行配置。\n\n![](img/Figure_6.4.jpg)\n\
  图 6.4. NetBeans 完成设置。\n\n为了测试 NetBeans 和 WampServer 是否协同工作，在 `my_project` 中创建一个名为\
  \ `index.php` 的新文件。\n\n- 选择 `File` > `New File`（文件 > 新文件）。\n- 在 `File Types`（文件类型）下选择\
  \ `PHP File`，然后点击 `Next`。\n- 使用 `index` 作为文件名。NetBeans 将自动添加 `.php` 扩展名。\n- 选择 `Finish`（完成）。\n\
  \n如果 NetBeans 和 WampServer 配置正确，访问 `http://localhost/my_project` 应该得到一个没有任何错误的空白页面，如图\
  \ 6.5 所示。\n\n![](img/Figure_6.5.jpg)\n图 6.5. 配置界面。\n\n与传统的编程语言不同，PHP 的预览速度与开发环境保存文件的速度一样。换句话说，PHP\
  \ 不需要可以在服务器接受文件之前编译脚本。缺点是，每当请求脚本时，与请求页面相关的文件都必须拉入内存并进行“实时”编译。这导致了一个主要的考虑因素：需要大量内存密集型资源的项目使用\
  \ Java 等编译型语言可能会运行得更快。不适合作为 PHP 候选的应用程序是那些索引大量文档的程序。“大”无法准确指定，因为它取决于实际生产环境和文档的大小；然而，考虑到库作为数据聚合器的角色，这一考虑是非常重要的。更复杂的是，PECL\
  \ 中存在缓存扩展，可以减少服务器重新编译脚本的频率。\n\n### 谈论 PHP\n\n如果将 PHP 视为一种语言，可以将其视为类似于学习一种外语。任何语言的基础构建块都是名词和动词。如果\
  \ PHP 是一门书面语言，变量就是名词。变量存储了关于谁、什么、何时、何地和为什么的信息。函数、语句和运算符是 PHP 的动词，而运算符也可以充当形容词的角色。这种比较不应理解得太字面，但它可能有意想不到的帮助。此外，类似于书面语言，PHP\
  \ 语法同样是任意的，只是词序在说话者（代码）和听话者（WampServer）之间已协商好，以避免混淆。示例见表 6.1。\n\n表 6.1. PHP 与英语的对比\n\
  \n| 英语 | PHP |\n| :--- | :--- |\n| John 十岁。 | `$john = 10;` |\n| Mary 比 John 大两岁。\
  \ | `$mary = 2 + $john;` |\n| 用你的脚关门。 | `close (\"door\", \"foot\");` |\n| 你对不起。\
  \ | `echo \"You're sorry\";` |\n| 你对 Mary 有什么了解？ | `$raw_results = $mysql_connection->query(\"\
  SELECT age FROM people WHERE name = 'Mary'\");` |\n\n- 每条语句以分号（`;`）结束。\n- 字符串应该封装在单引号（`'`）或双引号（`\"\
  `）中，例如。\n- 双斜杠（`//`）之后的字符被 PHP 解析器忽略，可以作为行内注释：`$a_complicated_variable; //注释`。\n\
  - 注释也可以通过将其放在 `/*` 和 `*/` 之间创建：\n```\n/* 这种风格的注释\n可以跨行并包含任何内容 */\n```\n函数和语句可以执行大量的动作。函数的语法通常需要它作用的对象，这位于括号中。例如，`sort($vegetables)`\
  \ 将对蔬菜数组进行排序，按字母顺序。运算符是简单的动作动词。有一些运算符与其算术对应相同：\n\n- `+` 加、组合或连接\n- `-` 减\n- `*`\
  \ 乘\n- `/` 除\n- `%` 取模或取余数。`7%3` 结果为 `1`，因为 `3` 除 `7` 两次余 `1`。\n- `.`（点）连接字符串。`echo\
  \ $x . \"pesos\";` 将输出类似 30pesos。\n- `=` 赋值。`$mary = 12` 将数字 12 赋值给变量 `$mary`。\n\
  - `==` 比较运算符。`3 == 1+2` 返回 `true`。这种比较被认为是“宽松”的，因为 PHP 会检查值是否相等，所以 `\"3\" == 3`\
  \ 返回 `true`。\n- `===` 严格比较运算符。`3 === 1+2` 返回 `true`。这种比较被认为是“严格”的，因为 PHP 会检查值是否相同，所以\
  \ `\"3\" === 3` 返回 `false`，因为 `\"3\"` 是字符串而 3 是数字。如果开发者使用宽松比较而不是严格比较，NetBeans 将警告他们，因为在大多数情况下，严格比较更稳定且运行更快。与宽松比较相比，倾向严格比较也是最佳实践，因为它减少了某些安全问题的可能性。PHP\
  \ 缺乏严格的数据类型，如果开发者丢失对使用的变量类型的跟踪，可能会难以预测运算符。\n\n- `>`, `<`, `>=`, `<=` 分别大于、小于、大于等于、小于等于。\n\
  \n\n\n\n\n### 运算符\n\n*   `! Not !=` 不等于（松散比较）。`!==` 严格不等于。例如，`$josh !== “human”`\
  \ 等同于 `!($josh === “human”)`。\n\n这里还有特殊情况和额外的运算符，包括此处未包含的位运算符。有关所有运算符的权威列表和描述，请访问\
  \ [`php.net/manual/en/language.operators.php`](http://php.net/manual/en/language.operators.php)。PHP\
  \ 拥有与 C 语言相似的控制语句结构（见表 6.2）。\n\n### 表 6.2 常见 PHP 控制语句\n\n| 语句 | 描述 | 示例 |\n| :---\
  \ | :--- | :--- |\n| `if` | 经典的编程“分支”结构。它通常通过比较两个变量形成。 | `if($mary > $frank) { echo\
  \ \"Mary is old\";}}` |\n| `else` | 用在 `if` 语句之后，为开发者提供一种方法，定义当 `if` 语句为假时应该执行的代码。\
  \ | `if($mary > $frank) { echo \"Mary is old\";} else { echo \"Frank is as old or\
  \ older\";}}` |\n| `while` | 一种基础循环，重复执行直到某个条件为假。 | `$x = 0;while($x < 5) { echo\
  \ $x . \", \"; $x = $x + 1;}` 这将输出 0, 1, 2, 3, 4, |\n| `for` | 编写 `while` 循环的快捷方法，旨在运行\
  \ `$x` 次。 | `for($x =0; $x < 5; $x = $x + 1) {echo $x . \", \";}` 这将输出 0, 1, 2,\
  \ 3, 4, . 与上一个示例相同，但少了两行。 |\n| `for each` | 编写 `for` 循环的快捷方法，旨在处理数组或对象中的每个元素。 |\
  \ `$fruits = array(\"A\", \"B\", \"C\");foreach($fruits as $item) {echo $item \"\
  \ \";}` 这将输出 A B C |\n\n### PHP 5 OOP\n\nPHP 的面向对象编程（OOP）风格允许开发者利用高级编程技术，包括设计模式。其他编程语言引领技术世界进入了面向对象时代，导致\
  \ PHP 在这一领域起步稍晚。正如其名称所示的那样，面向对象编程关注作为变量的对象。对象可以执行 PHP 代码并存储其他变量。\n\n在编程语境下，有很多比喻可以帮助理解对象。如果对象并不是显而易见的，请不要气馁，因为从定义上来说它们是抽象的。对象基于易于复用的代码部分。用我们的比喻来来说，鱼先生（Mr.\
  \ Fish）是鱼群的一部分，鱼群中的所有成员除了年龄和在海中的物理位置外，都是相同的。每条鱼都根据其 `DNA` 知道如何游泳、进食和吐泡泡。如果我们能肉眼看到每条鱼，就能判断它是在游泳、进食还是吐泡泡。如果我们改变了鱼先生游泳的方式，鱼群中所有的鱼都会根据这些新的\
  \ DNA 变化而改变。通过对这个比喻进行几个单词替换，我们就可以描述 PHP 中的对象。鱼是对象，`DNA` 是代码，鱼群是类（表 6.3）。\n\n###\
  \ 表 6.3 英语到 PHP 语法\n\n| 英语 | PHP |\n| :--- | :--- |\n| 鱼先生是魭群的一部分。他四岁，在水下十英尺处。 |\
  \ `$mrFish = new Mackerel(4);$mrFish->position = -10;` |\n| 鱼先生游向水面。 | `$mrFish->swim(0);`\
  \ |\n| 如果鱼先生正在吐泡泡，他应该吃饭。 | `if($mrFish->is_blowing_bubbles) { $mrFish->eat();}`\
  \ |\n\n开发者将属性（properties）和方法（methods）称为对象的描述和对象可以执行的操作。`Position` 和 `age` 是鱼先生的属性。`Swim`、`eat`\
  \ 和 吐泡泡是鱼先生的方法。\n\n自习室预订系统是图书馆面向对象编程的一个良好示例。房间需要定义方法来预订房间、查看房间何时可用以及提供房间的路线。每个房间都需要定义名称、位置和房间号的属性。预订本身也可以是对象。预订的属性包括房间、日期、时间和读者；方法包括创建、取消、批准、移动房间、更改时间等。总之，一个预订系统可以包含预订、房间、读者和建筑的类。\n\
  \n使用 PHP 进行面向对象编程还提供了急需的代码和文件组织。在应用程序中，为每个类创建一个新的 PHP 文件是最佳实践。对于房间预订系统，每个类都是一个以其包含的类命名的独立文件。预订系统将结构化类似于以下的文件：\n\
  \n*   [`index.php`](http://index.php)\n*   `[folder]`共享\n    *   [`shared.configuration.php`](http://shared.configuration.php)\n\
  \    *   [`shared.database.php`](http://shared.database.php)\n*   `[folder]` 预订\n\
  \    *   [`reservations.buildings.php`](http://reservations.buildings.php)\n   \
  \ *   [`reservations.patrons.php`](http://reservations.patrons.php)\n    *   [`reservations.reservations.php`](http://reservations.reservations.php)\n\
  \    *   [`reservations.rooms.php`](http://reservations.rooms.php)\n\n## 使用设计模式在库中维护复杂的程序\n\
  \n设计模式有详尽的文档，是任何面向对象语言开发者的必修课。这些模式解决了 PHP 中常见的复杂问题。并不是说没有设计模式或没有对象就无法解决复杂问题。特别是图书馆，需要意识到它们的程序将如何适应未来需求，或者可能如何与其他机构共享。毫无疑问，有才华的程序员可以发明解决设计模式可以解决的问题的方法；但这会让后续或团队程序员的代码变得难以理解。此外，设计模式在开源项目中日益增长的趋势表明，随着越来越多的图书馆软件转向社区开发，开发者需要更稳固地掌握设计模式。虽然设计模式不在介绍范围内，但应用程序设计为解决常见的开发挑战提供了一个有趣的介绍。关于“软件设计模式”的维基百科文章是一个极佳的概述（[`en.wikipedia.org/wiki/Software_design_pattern`](https://en.wikipedia.org/wiki/Software_design_pattern)）。\n\
  \n## 示例\n\n此示例将处理将用户输入发送到数据库的表单提交。常见任务充满了安全问题。\n\n\n\n\n\n### 配置\n`C:\\Wamp\\www\\\
  my_project\\configuration.php`\n\n```php\n<?php\n$db_host = \"localhost\";\n$db_type\
  \ = \"mysql\";\n$db_user = \"me\";\n$db_pass = \"my_password\";\n$db_database =\
  \ \"my_data\";\n?>\n```\n\n### 索引页\n索引文件向用户展示一个表单。尽管该文件使用了 `.php` 扩展，但文件中并没有声明 PHP\
  \ 代码。\n\n`C:\\Wamp\\www\\my_project\\index.php`\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n    <meta charset=\"UTF-8\">\n    <title>A sample form</title>\n</head>\n\
  <body>\n    <form action=\"sumbit.php\" method=\"POST\">\n        <label for=\"\
  user_name\">Your name</label>\n        <input type=\"text\" id=\"user_name\" name=\"\
  user_name\">\n        <label for=\"user_number\">Your number</label>\n        <input\
  \ type=\"text\" id=\"user_number\" name=\"user_number\">\n        <label for=\"\
  user_message\">Your message</label>\n        <input type=\"text\" id=\"user_msg\"\
  \ name=\"user_msg\" >\n        <button type=\"submit\">Submit</button>\n    </form>\n\
  </body>\n</html>\n```\n\n### 提交逻辑\n该文件接收来自提交表单的数据，然后将这些数据发送到数据库进行存储。\n\n`C:\\Wamp\\\
  www\\my_project\\submit.php`\n\n```php\n<!DOCTYPE html>\n<html>\n<head>\n    <meta\
  \ charset=\"UTF-8\">\n    <title>Submission page</title>\n</head>\n<body>\n<?php\n\
  \    require_once('configuration.php');\n    $connection = new PDO( $db_type . \"\
  :host=\" . $db_host . \";dbname=\" . $db_database,\n        $db_user,\n        $db_pass);\n\
  \n    /*\n    传统上，通过 $_POST['var_name'] 访问输入，但 filter_input 允许更多的过滤以减少注入访问。user_name,\
  \ user_number, user_msg 是上一个页面输入的值。\n    */\n    $str_user_name = filter_input(INPUT_POST,\
  \ 'user_name');\n    $str_user_number = filter_input(INPUT_POST, 'user_number');\n\
  \    $str_user_msg = filter_input(INPUT_POST, 'user_msg');\n\n    //这将会测试浏览器是否发送了数据\n\
  \    if($str_user_name !== null) {\n        //quote 方法为数据库输入对字符串进行消毒处理\n       \
  \ $connection->exec(\"INSERT INTO user_messages SET user_name=\".$connection->quote($str_user_name).\"\
  ,\n            user_number=\".$connection->quote($str_user_number).\",\n       \
  \     user_msg=\".$connection->quote($str_user_msg).\");\n        echo \"Thank you\
  \ for your message\";\n    } else {\n        echo \"There was an error.\";\n   \
  \ }\n?>\n</body>\n</html>\n```\n\n上面的示例演示了 PHP 如何运行。在现实中，一个提交页会包含 CSS、图像以及用于库品牌展示的额外\
  \ HTML。如果这个示例演变成一个包含更多素材的更完整的网站，PHP 行数与 HTML 行数之间的比例可能会减少其表面的影响。考虑到 PHP 编写和阅读的便利性，PHP\
  \ 的重要性可能是误导性的。可以关注围绕 PHP、Joomla 和 MediaWiki 构建的会议来寻找持不同意见的群体。由于 PHP 易于集成到网站中，它可能会被忽视一种重要的语言。\n\
  \n## 总结\nPHP 是一种广泛使用的开源脚本语言。PHP 常用于生成动态页面内容，兼容大多数服务器和平台。总的来说，PHP 易于学习，有大量的支持，并用于许多任务。\n\
  \n## 参考文献\n- `php.net`. 2015a. “PHP Manual.” `php.net/manual/en/index.php`.\n- ——\
  \ 2015b. “Vendor Specific Extensions.” `php.net/manual/en/refs.database.php`.\n\n\
  ## 推荐资源\n- **Drupal**: Drupal 是一个强大的开源内容管理系统，能够管理从简单的博客到整个大学的网站呈现的内容。`https://www.drupal.org/`。\n\
  - **Laravel Framework**: Laravel 是一个健壮的框架，能够快速交付机构级的 Web 应用程序。这不是一个入门级框架；然而，它为复杂的应用场景提供了预构建的解决方案。`https://laravel.com/`。\n\
  - **PHP Extension Community Library**: `https://pecl.php.net/`。\n- **PHP-FIG**:\
  \ 一组自愿的最佳实践，关注 PHP 程序的互操作性。`http://www.php-fig.org/`。\n- **php.net**: `php.net`\
  \ 是 PHP 的权威，提供完全可搜索的免费文档。`http://www.php.net`。\n- **WordPress**: WordPress 是一个开源内容管理系统，最初围绕博客构建，但已发展到支持各种其他网站结构。`https://wordpress.org/`。\n\
  \n## 第七：SQL\nEmily R. Mitchell 和 Lauren Magnuson\n\n### 历史与发展\n结构化查询语言 (`SQL`) 是一种用于与存储应用程序数据交互的基本编程语言，这些数据是即使在你关闭程序或重启计算机时一直存在的持久性数据。它主要是一种声明性语言，这与用于编写应用程序的过程性语言（如\
  \ `PHP` 或 `Ruby`）区分开来。`SQL` 的基本语法用于创建、查询、更新和删除存储在数据库中的数据。`SQL` 用于各种图书馆背景，理解它的工作原理可以让图书馆员更好地理解图书馆数据存储、检索、分析的方式，并可能将其扩展到新的应用程序和服务中。要理解为什么\
  \ `SQL` 如此重要，你需要了解 `SQL` 出现之前的生活是什么样的。在 `SQL` 之前，如果你想让程序使用持久数据，你必须告诉程序具体如何获取这些信息。\n\
  \n如果你能想象在一个没有索书号的图书馆里工作，并试图为需要找书的非常胆小且按字面意思的读者提供逐步指示，那么你的思路是正确的。你必须告诉该读者转身，走上两层楼梯，右转，穿过门，走到右侧的第三架书架，并选择从顶部数起第二层的第四本书。如果图书馆购买了更多排在书架上该书之前的书，你必须知道这一点并更改你的指示，这样下一次有人要求这本书时，你可以让他们去拿第六本书而不是第四本。\n\
  \n上面的例子说明了在 `SQL` 时代之前处理持久数据的一个情况。1970 年，E. F. Codd 发表了一篇论文，第一行写道：“未来大型数据库的用户必须保护他们不必知道数据在机器中是如何组织的（内部表示）”（Codd\
  \ 1970, 377）。\n\n\n\n\nCodd 的论文非常有理论性，并没有实际上创造出一种能够实现他所描述功能的编程语言。他拥有开创性的想法，但许多人怀疑这些想法是否能够可行，更不用说能够高效地运行了（Anthes\
  \ 2010）。过了几年之后，Codd 的雇主 IBM 才重新组织了其数据库研究团队，并安排他们投入开发 `System R`——这是一个基于 Codd 想法的新型数据库系统（Biancuzzi\
  \ and Warden 2009）。在那之后又几年，Patricia Selinger 发表了一篇论文，展示了使用 Codd 关系模型的系统如何达到足够高的效率，足以与竞争对手竞争（Anthes\
  \ 2010）。\n\n`System R` 是一个永远改变数据库的项目。Selinger 是 `System R` 团队的成员之一，另外两位是 Donald\
  \ Chamberlin 和 Ray Boyce。Chamberlin 和 Boyce 被分配开发查询语言，以将 Codd 的想法变为现实。这两位研究人员对他们的新语言有很多目标，包括它应该具备以下功能：\n\
  \n*   使用易于理解的英语关键词；\n*   允许用户创建数据库；控制谁有访问权限；并允许用户添加、删减和查询信息；\n*   能够独立运行，但也能与其他编程语言良好协作（Biancuzzi\
  \ and Warden 2009）。\n\nChamberlin 和 Boyce 将他们的语言命名为 `SQL` 并发表了关于它的论文，向世界分享了这种语言。这使得其他小组能够向前推进，在\
  \ IBM 实现 `SQL` 的同时进行实现。事实上，市场上首个基于 `SQL` 的商业产品并非来自 IBM——而是来自 Relational Software\
  \ Inc. 的产品 `Oracle`，它后来变成了 Oracle 公司。`Oracle` 版本二（第一个面向公众的版本）于 1979 年推出（Preger 2012）。如今\
  \ `Oracle` 是数据库领域的主要参与者。\n\n由于有许多小组都在基于 `SQL` 创建自己的系统，`SQL` 在 1986 年成为了创建和管理关系数据库的国际标准。多年来，这些标准得到了更新和改进，增加了新功能并解决了许多问题（Preger\
  \ 2012）。然而，由于每个实现 `SQL` 的小组方式各不相同，超出基础标准的合规性一直是一个存在的问题（Sheldon and Moes 2005）。\n\
  \n因此，如今数据库开发人员可以使用许多不同的 `SQL` 方言。在图书馆世界，最常用的两种 `SQL` 类型是 `MySQL` 和 `PostgreSQL`。就像人类语言的方言一样，这些方言足够相似，使得开发者可以能够毫不费力地理解不熟悉的方言中的大部分内容。然而，要在特定方言中达到真正的精通需要一些努力。这意味着所有的\
  \ `SQL` 数据库都将以表格的形式存储信息，表中的每行代表一个独立的条目，但用于向表中添加信息、从表中提取信息以及其他过程的准确措辞在不同方言之间会有不同。本章中的示例将以\
  \ `MySQL` 为例。\n\n值得注意的是，近年来数据库系统领域取得了进一步进展。各种类型的 `NoSQL`（或“不仅是 SQL”）在扩展规模以处理大数据集方面正逐渐增长增长势头（Vaish\
  \ 2013）。`NoSQL` 世界中目前的一些知名品牌包括 `MongoDB`、`CouchDB` 和 `Hadoop` 等。\n\n这并不是说 `SQL`\
  \ 数据库不值得花时间去学习。图书馆在 `SQL` 数据库投入了大量精力。我们的大多数系统都运行在上面，任何想在图书馆世界进行任何编程的人都可能迟早会遇到某种形式的\
  \ `SQL`。\n\n## 环境与设置\n\n`SQL` 语言是一种在各种关系型数据库管理系统（或 `RDBMSs`）中广泛实现的标准。为了使用 `SQL`，你需要访问一个\
  \ `RDBMS`。对于那些想要尝试使用 `SQL` 查询但并不一定想在服务器或其他计算机上安装本地 `RDBMS` 环境的人来说，华盛顿大学开发了一个名为 `SQLShare`\
  \ 的创新项目，它允许用户通过 `SQLShare` 接口自由地上传数据并运行 `SQL` 查询。本章中使用的几个示例可以利用 `SQLShare` 平台运行。\n\
  \n不过，如果你想真正深入学习并应用 `SQL`，你可能想要安装本地的 `RDBMS` 环境。这些环境的示例包括 `MySQL`、`SQLite` 或 `PostgreSQL`。这三者都是流行的开源\
  \ `RDBMSs`，可以免费下载并安装在服务器或其他计算机上。\n\n`MySQL` 是常用服务器设置（或技术栈）`LAMP`（Linux Apache MySQL\
  \ PHP）中不可或缺的一部分。`LAMP` 服务器利用 Linux 操作系统、Apache Web 服务器通过浏览器浏览器内容、`MySQL` `RDBMS`\
  \ 以及用于编写应用的 `PHP`。因此，如果你有一台 `LAMP` 服务器，它已经安装了 `MySQL` 并已准备就绪。\n\n可以安装在 OS X 或 Windows\
  \ 计算机上的类似软件包包括 `MAMP`（用于 Mac OS X）或 `WAMP/XAMPP`（用于 Windows）。此类技术栈通常用于在你自己的计算机上开发软件，而不是服务器上。如果你安装了\
  \ `MAMP` 或 `WAMP`，你可以用它开启托管在你自己机器上的 Web 服务器，这允许你在自己的计算机（称为“localhost”）上“托管”网页和 Web\
  \ 应用程序。\n\n当你使用 `MySQL` 时，最好记住 `MySQL` 本身是为命令行交互设计的，没有原生的图形用户界面（GUI）。不过，存在工具可以防止\
  \ `MySQL` 用户使用命令行。例如，`phpMyAdmin` 是一个随 `LAMP` 栈的常用的 `MySQL` 交互界面。可以使用 `phpMyAdmin`\
  \ 创建和删除（drop）`MySQL` 数据库和表。\n\n尽管如此，在处理自定义应用程序时，了解 `MySQL` 命令行是有用的。关于与 `MySQL` 命令行交互的详尽文档可以在此处找到：[`dev.mysql.com/doc/refman/5.5/en/mysql.html`](http://dev.mysql.com/doc/refman/5.5/en/mysql.html)。本章的“示例”部分提供了使用\
  \ `MySQL` 的命令行操作示例。\n\n### 用途\n\n`SQL` 环境存在于图书馆各种应用程序中，包括集成图书馆系统（ILS）和资源共享系统、网站内容管理系统（CMS）、数字资产管理系统（DAMS）等。\n\
  \n### 集成图书馆和发现系统\n\n`SQL` 存在多个集成图书馆和发现系统中，包括：\n\n*   `Koha` 开源 `ILS` (`MySQL`)\n\
  *   `Evergreen` 开源 `ILS` (`PostgreSQL`)\n*   `Sierra` Innovative Interfaces Inc.\
  \ `ILS` (`PostgreSQL`)\n*   `Intota` ProQuest `ILS` (Microsoft SQL)\n*   `VuFind`\
  \ 开源发现界面 (`MySQL`)\n\n在 `ILS` 和发现应用中，理解 `SQL` 语法对于从这些系统中自定义数据收集变得越来越有用。`SQL` 语法知识使图书馆能够收集没有作为“预设”报告直接构建在软件中的数据。\n\
  \n\n\n例如，存储在 Koha 开源集成管理系统（ILS）中的数据可以直接被查询，Koha 用户已经收集了大量关于编写自定义查询的文档（[`wiki.koha-community.org/wiki/SQL_Reports_Library`](http://wiki.koha-community.org/wiki/SQL_Reports_Library)）。报告通常涉及从数据库中提取数据，或者用\
  \ SQL 用户的话说，即选择（selecting）这些数据。Koha 中的查询与简单的 SQL 请求有所不同，但随着你对 SQL 的了解，你会很快熟悉其基本语法。下面的\
  \ Koha 示例从 Koha 的 `biblioitems` 表中检索特定的 MARC 标签（存储为 `MARCXML`）（[`wiki.koha-community.org/wiki/SQL_Reports_Library`](http://wiki.koha-community.org/wiki/SQL_Reports_Library)#Query_MARC）：\n\
  \n```sql\nSELECT\n    ExtractValue((\n        SELECT marcxml\n        FROM biblioitems\n\
  \        WHERE\n            biblionumber=14),\n        '//datafield[@tag=\"952\"\
  ]/subfield[@code>=\"a\"]') AS ITEM;\n```\n\nInnovative Interfaces 的 Sierra ILS 允许图书馆创建自定义应用程序，直接查询图书馆的\
  \ PostgreSQL 数据库，以创建新的服务或报告机制。例如，参见此支持 Sierra PostgreSQL 数据库中记录模型的 Ruby on Rails\
  \ 应用程序：[`github.com/uclibs/active_sierra`](https://github.com/uclibs/active_sierra)。Sierra\
  \ 客户的文档（需要身份验证）可以在此处处览：[`techdocs.iii.com/sierradna/app`](http://techdocs.iii.com/sierradna/app)。掌握\
  \ SQL 后，图书馆可以例如“编写一个脚本或应用程序，将采购事务数据提取出来并加载到外部会计系统中”([`blog.sierra.iii.com/feature`](http://blog.sierra.iii.com/feature)-spotlight-sierradna-application)。\n\
  \n## 内容管理与数字资产管理系统\n\n许多图书馆使用的最流行的内容管理系统（Connell 2013）都使用了 `MySQL`，包括：\n\n*   WordPress\n\
  *   Drupal（也可以使用 `PostgreSQL` 或 `SQLite`）\n*   LibGuides\n*   基于 Fedora Commons\
  \ 的数字资产管理系统，包括 `DSpace`、`Hydra` 和 `Islandora`（后者也使用了 `Drupal`）。这些仓库可以使用多种关系型数据库（RDBMS），包括\
  \ `MySQL`、`PostgreSQL`、`SQLite`、`Oracle` 和 `MS SQL server`。访问 [`wiki.duraspace.org/display/FEDORA37/Installation`](https://wiki.duraspace.org/display/FEDORA37/Installation)+and+Configuration#InstallationandConfiguration-PrepareDatabase\n\
  \n对于图书馆 CMS 管理员来说，SQL 语法和架构（schemas）对于排除应用程序中的故障、备份和恢复 CMS 数据库数据，以及编写额外的自定义功能（例如在现有\
  \ CMS 数据库中存储和访问额外数据的 `Drupal` 模块或 `WordPress` 插件）至关重要。以图书馆中心的 Drupal 模块列表请参见 [`groups.drupal.org/libraries/modules`](https://groups.drupal.org/libraries/modules)。\n\
  \n其他图书馆应用还包括：\n\n*   Guide on the Side，这是一个由亚利桑那大学开发的教程应用程序，它利用 `MySQL` 存储教程数据、元数据和用户信息（[`code.library.arizona.edu/gots`](http://code.library.arizona.edu/gots)/）。\n\
  *   Illiad、Odyssey 和 Ares (OCLC/Atlas Systems) 资源共享系统均使用 `Microsoft SQL (MS SQL)`\
  \ 服务器。\n*   SFX (ExLibris) 链接解析软件利用 `MySQL`。\n\n### 优缺点\n\nSQL 的存在是为了处理持久化数据，但当然也有其他替代方案。例如，如果你只需要一个较短的名字和地址列表，那么文字处理文档中的字母顺序列表（平面文件）就足够了。在这种情况下，没有必要费力建立\
  \ SQL 数据库。然而，一旦你的需求超出此范围，SQL 就会显现威力。\n\n想象你图书馆的 ILS 是由平面文件组成的。这对于基本的借阅任务意味着什么？你可能有一份列出所有有效读者的文档，按证号排序。当有人来到借还台并出示卡时，你打开该文档并扫描，直到在文档中找到对应的条目。然后你输入那个人想要借的书的所有信息，包括还书日期。\n\
  \n这可能很慢，但真的有那么糟吗？对于这种非常基础的任务，它看起来可能不坏，但现实生活很快就会变得复杂。例如，如果有几个人同时在借还台工作怎么办？普通的文字处理文档无法同时处理来自不同计算机的几名工作人员的输入。\n\
  \n此外，考虑一下你想知道现在有多少视频逾期时会发生什么。你可以手动检查文档并统计逾期视频，但那花费的时间远超任何人的空闲时间。你可以尝试写一个程序来判断这一点，但编写一个能处理此类查询的程序将是一项复杂的工程。\n\
  \n与使用 SQL 解决相同问题相比。确实，使用 SQL 的初始设置会比直接打开文档更复杂。你首先需要安装 SQL，然后确定数据架构（data schema），这是一致表示你想要捕获的数据的方法。在这种情况下，你的架构应该包含一个关于读者的表（姓名、证号和地址）。你还需要一个材料的表（包括物品类型、标题、作者等信息）。你还需要第三张表，显示什么被借走了、谁借的、以及什么时候还。你可以画出你的架构图，如图\
  \ 7.1 所示。\n\n![](EBPS/image/Figure_7.jpg\n\n图 7.1 SQL 架构示例。\n\n每个框中的字段在 SQL 中实现时将成为表中的列。每个读者的信息将是读者表中的行；每本书或视频将是材料表中的行；每个被借出的物品将在借出表中获得一行，并在归还时移除。\n\
  \n然而，一旦你完成了 SQL 数据库的设置，你的速度将比使用文字处理文件快得多。想按证号查找某人？查询数据库并选择 `cardnumber` 匹配的条目。想运行一个告诉你哪些视频逾期的报告？连接\
  \ `materials` 和 `checkedout` 表，并选择所有 `duedate` 已过的视频。\n\n简而言之，平面文件是\n\n*   容易设置和理解\n\
  *   难以保持更新和准确\n*   几乎无法运行报告\n\nSQL 是\n\n*   设置较复杂\n*   易于更新和准确\n*   易于运行报告\n\nNoSQL\
  \ 数据库共享 SQL 的基本优点。然而，与 SQL 相比，它们的优缺点更为微妙，部分是因为有许多类型的 NoSQL 数据库。不同类型的 NoSQL 都有自己的优劣。要说明在什么情况下你可能会考虑研究某种\
  \ NoSQL 是更容易的。如果出现以下情况，你可能对 NoSQL 感兴趣：\n\n*   你将处理海量信息（许多 TB），并分布在许多不同的服务器/计算机上；你预计需要将你的数据库与另一个数据库合并，后者的设置与你的不同。\n\
  \n相反，如果，你可能仍然希望坚持使用 SQL：\n\n*   你需要数据库中的每个事务在移动下一个事务之前都必须成功。\n\n\n\n\n-   你需要表示不同类型/份数据之间的关系；\n\
  -   你希望尽可能多的开发者在你离开后仍能理解你的代码。\n\n## 示例\n\n### 在 Drupal 内容管理系统中使用 MySQL\n\n此示例演示了如何创建一个\
  \ `MySQL` 数据库，以便在安装 Drupal 内容管理系统时使用。Drupal 是一种广泛使用的 CMS，被图书馆网站使用，也被用作 Islandora\
  \ 数字资产管理系统的前端用户界面本节中使用的命令可以用于各种需要 `MySQL` 的应用程序，用于创建新用户、创建新数据库以及设置用户权限。\n\n此示例假设运行了如适用于\
  \ Mac OS X 的 MAMP 本地服务器，并使用 Mac 内置的终端（Terminal）应用程序（位于“实用工具 > 终端”下）。第一步需要使用终端进入\
  \ `MySQL` 的交互模式，这允许使用 `MySQL` 的命令行语法来执行 `MySQL` 操作。要进入交互模式，首先确保你的本地 `MySQL` 服务器正在运行（点击\
  \ MAMP 应用程序菜单中的“Start Servers”）。然后打开终端并输入以下内容：\n\n```bash\n/Applications/MAMP/Library/bin/mysql\
  \ --host=localhost -uroot –proot\n```\n\n此命令的各个部分包括以下内容：\n\n- `/Applications/MAMP/Library/bin/mysql`——进入\
  \ `MySQL` 软件应用程序的位置\n- `--host=localhost`——将 `MySQL` 数据库的主机定义为本地机器或 localhost\n\
  - `-uroot -proot`——这些元素（`-u` 和 `-p`）分别引用用户名和密码。在这种，用户名和密码相同（`root`）。注意，在本地开发中使用这种容易猜到的用户名和密码组合是可以的，但不能用于生产环境应用程序。在生产环境中使用\
  \ `MySQL` 时，建议将 root `MySQL` 密码改为难以猜测的内容。\n\n终端进入 `MySQL` 交互模式，每行都将显示 `mysql>` 提示符，表示预期输入\
  \ `MySQL` 语句。在交互模式下，可以输入 `MySQL` 命令来创建用户和设置权限、创建和删除（drop）数据库等。例如，在 `MySQL` 交互模式下，以下命令创建一个名为\
  \ `mydatabase` 的数据库：\n\n```sql\nmysql> CREATE DATABASE mydatabase;\n```\n\n输入此命令后，`MySQL`\
  \ 服务器将报告：\n\n```text\nQuery OK, 1 row affected (0.01 sec)\n```\n\n每当你在 `MySQL` 交互模式下输入命令时，请确保每个语句都以分号（`;`）结束，否则命令行将认为后续输入是同一条记录的一部分。\n\
  \nWeb 服务器利用“端口”为服务器应用程序提供不同的访问点。应用程序可以通过连接到服务器端口 `3306` 并传递身份凭据来访问 `MySQL` 数据。这些身份凭据通常存储在应用程序的配置设置中。例如，在安装\
  \ Drupal 等 CMS 时，安装过程的一个步骤是输入凭据以允许应用程序连接到 `MySQL` 数据库（图 7.2）。详细说明可以从 [`www.drupal.org/documentation/install/run`](https://www.drupal.org/documentation/install/run)-脚本找到。\n\
  \n![](img/Figure_7.2.jpg)\n\n图 7.2. Drupal 安装：“设置数据库”登录屏幕。\n\n在这一步中，数据库名称是你运行 `CREATE\
  \ DATABASE` 命令时指定的名称（在上面的示例中，数据库名为 `mydatabase`）。数据库名称、用户名和密码是区分大小写的。虽然在开发过程中，你可以使用访问\
  \ `MySQL` 命令行时相同的 root 凭据，但建议针对应用程序需要访问的数据库创建具有特定权限的唯一用户名和密码。这样，如果一组数据库凭据被泄露或黑客，潜在的损害可能限于创建这些凭据的特定数据库和权限。如果凭据受到限制，例如，黑客无法轻易使用被破解的凭据删除或更改你\
  \ `MySQL` 安装中的所有数据库。数据库用户名和密码也可以在命令行中使用以下语法进行创建，其中 `myuser` 是用户名，`mypass` 是与该用户名关联的密码：\n\
  \n```sql\nmysql> CREATE USER 'myuser'@'localhost' IDENTIFIED BY 'mypass';\n```\n\
  \n为特定数据库创建数据库用户名和密码时，必须设置指示这些凭据有权执行的操作权限。权限根据应用程序的要求而异。例如，Drupal 需要一个具有以下权限的用户：\n\
  \n```sql\nmysql> GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, INDEX, ALTER,\
  \ CREATE TEMPORARY TABLES ON mydatabase.* TO 'username'@'localhost' IDENTIFIED BY\
  \ 'password';\n```\n\n这意味着为 Drupal 创建的用户需要：\n\n- 从此数据库的表中选择数据\n- 向这些表中插入新数据\n- 更新（更改）已存在的数据\n\
  - 删除数据\n- 创建新表\n- 删除（删除）表\n- 为表建立索引\n- 更改表的列\n- 创建临时表（这在你学习高级 SQL 时很有用）\n\n如果你出于某些原因需要删除\
  \ `MySQL` 数据库或表，你可以使用 `DROP` 命令来实现。例如，如果你想完全删除所有 Drupal 数据并从头重新安装整个 CMS，将输入此命令：\n\
  \n```sql\nmysql> DROP DATABASE <db_name>;\n```\n\n除非你的数据库已经备份，否则数据库一旦删除就无法撤销，因此请务必谨慎使用\
  \ `DROP` 命令，并确保这是你真正想要的操作。备份和导出 `MySQL` 数据库的一种简单方法是使用 `mysqldump` 方法，如位于 [`www.lampdev.org/tutorial/mysql/backup_restore/mysqldump_tutorial.html`](http://www.lampdev.org/tutorial/mysql/backup_restore/mysqldump_tutorial.html)\
  \ 教程所示。\n\n### 使用 SQLShare 进行 SQL 查询\n\n此示例不需要使用 RDBMS；相反，你可以利用华盛顿大学的 `SQLShare`\
  \ 环境来运行 SQL 查询并返回数据，而无需本地安装任何软件。\n\n开始之前，请从 GitHub 下载以下文件 ([`github.com/lpmagnuson/sqlshare`](http://github.com/lpmagnuson/sqlshare))：\n\
  \n- `books.csv`\n- `users.csv`\n- `checkouts.csv`\n\n在华盛顿大学的 `SQLShare` 网上创建一个账户，创建一个唯一账户或使用\
  \ Google 账户登录。将所有三个文件上传到 `SQLShare` 网站。\n\n在以下示例中，将 `youraccount` 替换为你实际创建的账户标识符。通过帐户引用数据的结构是\
  \ `SQLShare` 模型特有的，在大多数 RDBMS 环境中并不。\n\n#### 获取所有英语专业学生\n\n此查询非常直观：`user` 表中哪些是英语专业的？为了只查看用户名和专业，我们可以使用此查询从\
  \ `users` 表中选择这两列：\n\n```sql\nSELECT [youraccount].[table_users.csv].username, [youraccount].[table_users.csv].major\
  \ FROM [youraccount].[table_users.csv]\nWHERE major = 'English'\n```\n\n输出如图 7.3\
  \ 所示。\n\n![](img/Figure_7.3.jpg)\n\n图 7.3. SELECT 查询的输出。\n\n#### 按专业统计用户人数\n\nSQL\
  \ 最用的功能之一是累加值并报告它们。`COUNT` 函数可以查看列的值并统计所有唯一值。注意，`COUNT` 函数需要一个相应的 `GROUP BY` 语句，以便\
  \ SQL 输出知道如何显示结果：\n\n```sql\nSELECT [youraccount].[table_users.csv].major, count([youraccount].[table_users.csv].major)\
  \ as number\nFROM [youraccount].[table_users.csv]\nGROUP BY [youraccount].[table_users.csv].major\n\
  ```\n\n输出如图 7.4 所示。\n\n![](img/Figure_7.4.jpg)\n\n\n\n\n图 7.4. `COUNT` 查询的输出。\n\n\
  ### 查找此集合中最流行的书籍\n\n在此查询中，我们将再次使用 `COUNT`，但这次我们统计的是借阅次数。我们将按照标题对输出进行分组，并按降序排列书籍，这样流行的书籍就会出现在列表顶部。\n\
  \n为了显示书名（这在输出中比项目编号更具可读性），我们可以使用 `JOIN` 函数。这允许我们利用数据内部的关系。每本书在 `checkouts` 表中通过一个唯一标识符列出，该标识符在\
  \ `books` 表的对应记录中也能找到，使我们能够将两个表连接起来。只要两个表中都存在我们预期的匹配值，我们就可以创建一个语句，为 `checkouts.csv`\
  \ 表中列出的每本书从 `books.csv` 中查找标题。恰好，`books.csv` 中的 `record_number` 与 `checkouts.csv`\
  \ 中 `item_number` 列中的的数值集是相同的，因此我们可以根据该维度进行 `JOIN`：\n\n```\nSELECT [youraccount].[table_books.csv].title,\
  \ COUNT([youraccount].[table_checkouts.csv].item_number) as checkouts\n    FROM\
  \ [youraccount].[table_books.csv] JOIN [youraccount].[table_checkouts.csv]\n   \
  \ ON [youraccount].[table_books.csv].record_number = [youraccount].[table_checkouts.csv].item_number\n\
  \    GROUP BY [youraccount].[table_books.csv].title\n    ORDER BY checkouts DESC\n\
  ```\n\n输出请见图 7.5。\n\n![](img/Figure_7.5.jpg)\n\n图 7.5. `JOIN` 函数的输出。\n\n## 总结\n\n\
  SQL 是一种广泛应用于各种关系型数据库管理系统的标准。SQL 有许多不同的版本，包括 `MySQL`、`PostgreSQL` 和 `SQLite`。所有 SQL\
  \ 版本的设计旨在允许与存储在数据库中的持久化数据进行交互。由于如此，SQL 通常与其他编程语言配合使用，这些语言通常有非常不同的优势。SQL 直观且易学习的语法使其在图书馆领域的业余和专业程序员中都广受欢迎。\n\
