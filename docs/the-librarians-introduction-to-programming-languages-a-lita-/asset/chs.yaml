  - Get Perl，图形用户界面：[`sourceforge.net/projects/citrusperl/files`](https://sourceforge.net/projects/citrusperl/files)/。\n\
  - 模块库 CPAN：[`www.cpan.org`](http://www.cpan.org)/。\n\n### 书籍\n\n- Christiansen,\
  \ Tom, Brian D. Foy, Larry Wall, and Jon Orwant. 2012. *Programming Perl: Unmatched\
  \ Power for Text Processing and Scripting*. 第 4 版. Sebastopol, CA: O’Reilly Media.\n\
  - Christiansen, Tom, and Nathan Torkington. 2003. *Perl Cookbook*. 第 2 版. Sebastopol,\
  \ CA: O’Reilly Media.\n- Schwartz, Randal L., and Brian D. Foy. 2011. *Learning\
  \ Perl*. 第 6 版. Sebastopol, CA: O’Reilly Media.\n- Siever, Ellen, Stephen Spainhour,\
  \ and Nathan Patwardhan. 2002. *Perl in a Nutshell: A Desktop Quick Reference*.\
  \ 第 2 版. Sebastopol, CA: O’Reilly Media.\n\n### 作者链接\n\n- MARC 程序：[`homepages.wmich.edu/~zimmer/marc_index.html`](http://homepages.wmich.edu/~zimmer/marc_index.html)。\n\
  - Perl Stuff：[`homepages.wmich.edu/~zimmer/links/proglang.html#perl`](http://homepages.wmich.edu/~zimmer/links/proglang.html#perl)。\n\
  \n## 六章\n\n### PHP\n\nJason Steelman\n\n### 历史与发展\n\nPHP 是一种优美且简单的语言。它的优势在于无处不在、平台兼容性、易用性以及任何编程语言中最丰富的开源社区。通常情况下，PHP\
  \ 在服务器内部工作，连接网页与数据库并执行网页处理的重活；然而，PHP 也可以独立运行。找到让 PHP 处理视频、进行网络爬虫或作为网站内容管理系统骨的免费扩展并不罕见。大多数关于获取新软件的图书馆讨论底线是成本。PHP\
  \ 的无处不在和开源许可意味着该语言几乎总是出现在选项之列。考虑 PHP 的一个重要因素是该语言开发者群体对项目提供的长期支持。寻找新开发者在很大程度上取决于应用程序语言的复杂度。PHP\
  \ 开发者通常比其他强大的语言开发者更便宜，也更容易签约或雇佣。如果项目涉及复杂的程序，使用 PHP 可能会增加额外的时间和初始成本。只要截止日期灵活，且 PHP\
  \ 能够解决问题，图书馆就可以利用 PHP 开发成本较低的优势。\n\n\n\n\nPHP 在库网站中的作用可能很难被界定，因为它可能被归咎为承担了应用程序中某些它并未执行的任务。PHP\
  \ 通常不负责数据的字面存储，通常也不负责网页的视觉显示。PHP 在网站上的通常职责是从数据库或文件系统中查找数据，对这些数据运行某些计算，并将数据发送给用户。PHP\
  \ 被要求执行的计算逻辑由程序员编写的 PHP 脚本定义。这种计算可以简单到“计算此笔订单的税费”，也可以复杂到“判断此用户是否有权访问我们的机密文件”。PHP\
  \ 并不负责了解税率，也不负责了解订单详情。它必须从数据库请求订单详情和税率，以完成请求的计算。PHP 不控制订单摘要在用户面前的视觉呈现，因为那是用户浏览器结合\
  \ HTML、CSS、图像和 JavaScript 完成的工作。由于 PHP 拥有定义良好的脚本来获取数据、对数据运行计算并返回结果，因此 PHP 往往是网站显示原始数据（如书籍零售价格列表）的一种简单方式。无论显示原始数据还是处理后的数据，需要向用户展示数据库信息的网站通常都依赖\
  \ PHP。\n\nWeb 的演进与 PHP 的演进密切相关。PHP 的第一个版本被用作更新个人“个人主页”的工具，这也是 PHP 名称的由来。作为一种旨在运行单个页面的服务器语言，PHP\
  \ 的健壮性是恰当的，因为当时的网站包含了闪烁的跑灯和动画 GIF 火炬。早期的 Web 不需要处理大数据或移动端电子商务的复杂流水线，PHP 没有理由提供这些功能。随着\
  \ Web 开发者开始扩展对网站的期望，PHP 也随着 Web 的进步而发展。PHP 被重命名为代表 PHP: Hypertext Preprocessor（超文本预处理器），并开始支持现代\
  \ Web 程序员所渴望的功能。\n\n这种缓慢的演进给 PHP 语言留下了伤痕，包括不一致的命名规范、奇怪的代码顺序要求以及遗留支持问题。考虑询问变量是否已定义（`isset`）、是否为整数（`is_int`）或是否为公共变量（`isPublic`）的函数名。由于\
  \ PHP 对大小敏感，开发者必须记住所有函数的正确拼写，或者随时准备好 PHP 手册。现代编码工具通过代码补全来缓解这个问题，代码补全就像是程序员的自动拼写检查，但函数名可能会让\
  \ PHP 的入门变得异常烦恼。 PHP 文的最佳来源是 [php.net](http://php.net)。\n\n这种缓慢演进的优势在于 PHP 周全地包含了丰富的功能和各种开发环境。程序员还可以访问\
  \ PECL（PHP 扩展社区库），其中包含免费的 PHP 插件，用于扩展对缓存、压缩、数据库连接、图像处理、电子邮件、调试、加密、国际化等的支持。\n\n##\
  \ 环境与设置\n\n在开始使用某种编程语言之前所需的物理组件（硬件）和程序（软件）被称为开发环境；然而，你的家用和工作电脑可能完全有能力开发 PHP 程序。任何网站在运行实时\
  \ Web 应用时都需要显著更高的硬件，但 PHP 程序员可以在任何普通的工作站上开发和测试应用程序。运行实时 PHP 程序所需的功率取决于观众的规模。\n\n\
  生产环境中最常见的 PHP 安装使用了一系列普通电脑用户会感到陌生的程序；然而，这在服务器管理中非常常见，以至于获得了一个缩写 LAMP。LAMP 中的每个字母都代表一个程序：Linux、Apache、MySQL\
  \ 和 PHP。我们为编写 PHP 建立的测试环境与假设的生产环境之间最重要的区别在于 Linux。Linux 是 Windows 和 Apple OS 系统的服务器版本。作为运行个人电脑的软件，Windows\
  \ 和 Apple OS 旨在提供一种视觉化的使用和维护电脑的方法，并在某些程序需要用户注意时提供视觉警报。Web 服务器不需要视觉警报环境，因为服务器的设计是为了在不需要持续监控的情况下运行。Linux\
  \ 刻意排除了那些让个人电脑变得具有个性化的软件，以换取额外的动力、稳定性和。\n\n为了以模拟 Web 服务器上可能发生的情况来测试脚本，程序员会尝试在测试计算机上尽可能地复制生产环境。在学习\
  \ PHP 期间，并不强调创建一个完美、甚至是良好的测试环境。只要 PHP 可以处理开发者所需的脚本并忽略非脚本内容，该环境就可以用于教程。指定某个文件或文件的某部分为\
  \ PHP 脚本最简单的方法是使用封装标签，就像 HTML 本身一样：\n\n```php\n<?php echo \"Hello World!\"; ?>\n\
  ```\n\n在这个示例中，发送到 PHP 的唯一代码部分是命令 `echo` “Hello World!”。当浏览器查看此页面时，它将看到类似 `<p>Hello\
  \ World!</p>` 的内容。还有其他区分 HTML 和 PHP 的方法，例如排除字母 php（`<?php echo “I'm missing the\
  \ php letters, but why?”; ?>`），这在技术上是允许的，但与今天的最佳实践不符。\n\nPHP 本质上是不一致的，在某些领域，开发者可以通过同意在存在多种方法的情况下使用一种方法来提供帮助。这些约定总和被称为最佳实践或编码标准。大多数最佳实践是常识性的指南，但某些内容管理系统（包括\
  \ Drupal 和 WordPress）在操作这些系统时会增加额外的最佳实践。使用 PHP 构建的项目通常对该系统有经过深思熟的最佳实践。Drupal 作为这些项目最大的一个，已经建立了渗透到通用\
  \ PHP 开发者世界中的指南。关于文档的指南是 Drupal 影响的一个重要最佳实践，但它们并非诞生于 Drupal，而是被标准化的。代码组织、文件组织和文件夹结构与编码本身关系不大，但统一的项目组织方式使得团队工作变得容易得多。以符合最佳实践的方式组织代码和文件，可以确保同事、社区开发者和未来的开发者能够快速理解你的代码。非框架特定的标准代表了创建互操作\
  \ PHP 最佳实践的努力。最著名的非框架标准是 PSR-1，它来自 PHP-FIG 的 PHP 标准建议（[`www.php-fig.org/psr/psr`](http://www.php-fig.org/psr/psr))-1，这是一套经过民主批准并自愿采用的标准。\n\
  \n\n\n\n图书馆软件中使用的主要编程语言是 `PHP`。Drupal、ContentDM、Joomla、ResourceSpace、WordPress、LibGuides、MediaWiki\
  \ 和 PHPMyAdmin 完全或部分使用 `PHP` 编写。`PHP` 通常包含 HTML、`CSS` 和 `JavaScript` 以构建视觉效果美观的网站，这是很常见的。如果图书馆需要对这些系统进行任何未包含在初始安装或支持合同范围内的定制化处理，都必须由\
  \ `PHP` 开发人员完成。Drupal、WordPress、Joomla 和 MediaWiki 是专注于可扩展性的开源项目，拥有由开发者社区贡献的模块化扩展。模块化扩展背后的灵感观点是：没有任何一个机构或图书馆是孤岛；同样，图书员为了帮助读者而编写的任何功能，都可以帮助其他许多图书馆的读者。在机构内部工作的员工应该检查确保其机构的知识产权政策与他们参与开源项目的职位一致。\n\
  \n现代网站\n现代网站已经引入了为移动端站点开发的特性，这些特性使其更像具有高度响应式设计的 Web 应用。这通常通过 `JavaScript` 调用由 `PHP`\
  \ 驱动的应用程序接口（`API`）来实现。当其他机制不可行时，`API` 为浏览器提供了与服务器通信的方法。当用户请求 页面时，`PHP` 可以生成发送到浏览器的数据；然而，一旦页面加载，`PHP`\
  \ 就无法更改页面的任何部分。相反，页面包含了 `JavaScript`，它通过向 `API` 请求更新用新数据更新页面的某些部分。用户无需刷新页面即可找到实时天气更新、选举结果、物流状态和更新的社交媒体帖子。需要注意的是，`PHP`\
  \ 并不是创建 `API` 的唯一语言；然而，它是图书馆环境中广流行的选择。\n\n`PHP` 是 `API` 编程语言的常用选择，因为 `PHP` 具有记录良好的易于数据库通信性。`PHP`\
  \ 可以与 `CUBRID`、`DB++`、`dBase`、`filePro`、`Firebird/InterBase`、`FrontBase`、`IMB DB2`、`Informix`、`Ingres`、`MaxDB`、`MongoDB`、`mSQL`、`Mssql`、`MySQL`、`Oracle\
  \ OCI8`、`Paradox`、`PostgreSQL`、`SQLite`、`SQLite3`、`SQLSRV`、`Sybase` 以及 `tokyo_tyrant`\
  \ 进行通信 ([`php.net/manual/en/refs/database.vendors.php`](http://php.net/manual/en/refs/database.vendors.php))。`PHP`\
  \ 对高级数据库功能的支持最终取决于应用程序中使用的特定数据库。如果所选数据库缺乏对某些功能的支持，`PHP` 有时可以进行适配。\n\n## PHP 基础\n\
  \n处理进入数据库和从数据库返回的信息是变量的作用。变量是任何编程语言的核心，而 `PHP` 处理变量的方式是其历史中削弱的领域之一。其他语言显式将变量定义为数字或单词时，`PHP`\
  \ 中的变量没有严格的数据类型。从一个资深 `PHP` 开发者的角度来看，要求的数据类型定义似乎是一个烦人的障碍。缺乏说明的数据类型可能会在学习语言时产生问题，特别是在提高应用程序效率方面。如果你的应用程序有一系列真/假变量，以存储整本教科书的方式将其存储在内存中将浪费宝贵的内存。`PHP`\
  \ 尝试为每块数据分配足够的内存，而不会让系统过载。考虑到大多数数据库都显式定义了每条数据，与数据库一起工作带来了有趣的问题。在发送数据到数据库进行存储时，需要仔细考虑。从数据库检索数据则没那么痛苦，因为将数据从一个更具体的容器移动到一个不那么具体的容器更容易。同样，将一个开启/关闭开关转换为单词，比将单词转换为开关的开启或关闭更容易。\n\
  \n图书馆和特殊收藏品对编码档案文档的兴趣日益增加。电子论文或学位（ETD）的性质决定了每个字段都应该针对特定类型的数据进行仔细考虑。如果不在应用程序本身内部进行保留，这种精确性可能会丢失。支持数据类型的语言需要变量类型（数字、字符串、真/假、日期及类似类型），这在处理\
  \ ETD 时具有明显优势。`PHP` 开发人员可能会认为这些数据类型考虑是有些没必要的，仅仅因为 `PHP` 语言中没有清晰的方法来跟踪变量类型。\n\n###\
  \ 数据类型\n字符串、整数、浮点数、数组、`Boolean`、对象和资源是 `PHP` 可以存储为变量的七种数据类型。在 `PHP` 中，使用美元符号后跟想要创建或更改的变量名称来定义变量。例如，`$my_variable\
  \ = 123`。\n\n*   字符串是数字或字符的序列。字母、单词、句子、段落和书籍都可以存储为字符串：`$my_variable = “Go Gamecocks!”`。\n\
  *   整数是一个全整数：`$my_variable = 2`。\n*   浮点数（有时称为双精度数或 float）是一个小数：`$my_variable =\
  \ 3.14159`。\n*   数组是一个包含其他变量合集的变量。它的形式第一次看时可能有点困惑，其真实用处超出了本介绍的范围，但像所有 `PHP` 主题一样，免费教程并不匮乏：`$my_variable\
  \ = array(“Cat”, “Dog”, 2, 4, 6, 8)`。\n*   `Boolean` 变量持有 `true` 或 `false` 的二值值。这种数据类型有非常广泛的用途，例如开启/关闭、是/否、狗/不是狗：`$book_checked_out\
  \ = true`。\n*   对象是一种变量类型，类似于子程序可以在内部持有自己的代码和变量。对象将在 `PHP` 的面向对象编程章节中讨论：`$my_object\
  \ = new my_object()`。\n*   资源是连接 `PHP` 到额外资源的对象：`$my_connection = new database_connection()`。\n\
  \n### 变量规则\n变量有一些小规则和最佳实践。这些禁止规则看起来过于严格，但在实践中使变量更易于识别：\n\n*   变量名只能包含大小写字母、数字和下划线：`$this!0lid`。\n\
  *   不能以数字开头：`$2bad`。\n*   （最佳实践）名称应该描述它们的功能：`$time_event_starts = “2020-05-29”`。\n\
  *   （最佳实践）名称不应以下划线开头：`$_generally_bad`。\n\n\n\n\n\n- 默认情况下，你现在应该能够在你喜喜浏览器中访问 `http://localhost`。如果你收到关于连接服务器的错误，说明\
  \ WampServer 安装存在问题。\n- 从 [`netbeans.org/downloads`](https://netbeans.org/downloads)\
  \ 下载带有 HTML5 和 PHP 的 NetBeans。\n- 安装 NetBeans。NetBeans 安装过程中没有哪些选项会影响本教程。\n\n要创建一个可以在\
