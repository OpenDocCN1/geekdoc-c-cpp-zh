  \n## 第八章\n\n## C Tim Ribaric\n\n### 历史与发展\n\n`C` 是最持久的计算机编程语言之一。与其他在 20 世纪 70 年代创建的语言不同，`C`\
  \ 仍被活跃地用于许多应用程序。对比这种寿命，例如用 `FORTRAN` 编写的代码。许多拥有遗留系统的机构也拥有遗留系统。\n\n### C 的演变\n\n\
  `C` 是 `Ken Thompson` 和 `Dennis Ritchie` 工作成果，他们就职于 `AT&T 贝尔实验室`。在 1969 年至 1973 年期间，`Thompson`\
  \ 和 `Ritchie` 致力于开发一种重新实现 `UNIX` 操作系统的语言，这项工作最初使用一种名为 `B` 的语言。结果是巨大的成功，因为它允许 `UNIX`\
  \ 使用硬件无关的语言 `C` 来编写。\n\n\n\n\n*   **ANSI C**——于 1989 年正式诞生，是首次尝试创建一个更完整、更标准的 C 语言版本，以便开始用于新兴的微型计算机家用市场。在此之前，C\
  \ 主要用于大型机。\n*   **C99**——首次于 1999 年定稿，其目标是引入一系列新功能，允许如内联函数和变长数组等特性。\n*   **C11**——该版本的工作始于\
  \ 2007 年，但第一份官方规范于 2011 年发布。与 C99 的迭代类似，这个版本的 C 试图为语言添加更多特性。\n\n引人注目的是，在四十之后，C 仍然被积极地扩展和改进。这证明了该语言的无处不在和实用性。那么\
  \ C 的后代又是呢？既然 C 是一种用于实现 UNIX 的通用语言，它的后代是什么？它们又是何时开始的？全面的回顾将耗费数卷书的内容，但这里是一些亮点：\n\n\
  *   **C++**——C 的扩展，引入了一种名为面向对象编程的编程范式；其规范首次发布于 1983 年。\n*   **C#**——读音类似于音符：C-sharp。它可以被看作\
  \ C 和 C++ 的演进，由微软开发，用于在其专有的 .NET 平台上。它于 2000 年首次发布。\n*   **Objective-C**——C 语言的微扩展，Apple\
  \ 广泛用于 OS X 和 iOS 操作系统，也最早出现在 1983 年。\n*   **Python**——Python 经常是对编程感兴趣者的首选语言，尤其是在过去的几年里。它是一种构建在\
  \ C 之上的语言，其主要目标是创建人类可读的代码，并用简短的代码片段封装非常复杂的操作。Python 首次于 1991 年引入。深入理解 C 让编码者能够真正欣赏\
  \ Python 程序所能的美感和复杂性。\n\n### 用途\n如上述，C 的最初用途是实现 UNIX 操作系统。随着时间的推移，C 证明了对于编写各种应用程序非常有用（Klemens\
  \ 2014）。C 要求使用它的程序员有大量的理解能力。该语言没有提供一个完全结构化的环境，在需要时交互式地包含所有模块/库。然而，并非所有的 C 用法都是晦涩或特定于操作系统的。C\
  \ 知识非常有用处的一个有趣领域是 Arduino 微控制器（Purdum 2006）。Arduino 是一块信用卡大小的微型电路板，它是近期创客空间趋势的关键组件之一。\n\
  \n图 8.1 显示了一块名为 Yun 的现代 Arduino 板。它的定义特征是内置了 Wi-Fi。回形针是为了展示比例。Arduino 是一种设备，让你能够通过连接在板上的各种不同组件制造与计算机接口的硬件设备（Purdum\
  \ 2006）。将开关、按钮、LCD 显示器和红外发射器视为可能的组件。这些传感器插入一系列黑色插头中。你为 Arduino 编写 代码多或是 C 的变体。\n\
  \nOpenWrt 是一种流行的家用路由器第三方操作系统，它是附带了用 C 编写的工具的 UNIX 版本（Kernighan and Ritchie 1978）。OpenWrt\
  \ 是驱动 LibraryBox 的操作系统，LibraryBox 是一个独立的 Wi-Fi 供电文件共享哨站。\n\n![](img/Figure_8.1.jpg)\n\
  \n图 8.1. Yun，一块 Arduino 板。\n\n### 优缺点\n一种编程语言如果没有一些迷人的品质，是无法真正拥有四十年的历史的。从缺点来说，这些优点相当特殊。\n\
  \n### 优点\n#### 快速且充分利用硬件\n使用 C 的主要且明显的优势是它能非常好地利用其正在运行的计算机/机器。因此，你可以在运行 UNIX 或其变体（如\
  \ Linux）的嵌入式系统中找到 C 程序。你家中的路由器很可能在低功耗处理器上运行某个版本的 Linux。通过 Wi-Fi 天线发送无线电波可能是通过某种\
  \ C 代码实现的。OpenWrt 是一种流行的家用路由器第三方操作系统，它是附带了用 C 编写的工具的 UNIX 版本。\n\n#### 广泛的支持和现有产品\n\
  由于 C 已经存在了很久，很有可能已经有一个你的程序可以使用的现成库。例如，如果你正在编写某些使用加密算法的软件，你可以利用一个名为 `cryptlib` 的库，该库用\
  \ C 编写，并可以执行你可能需要的所有复杂数学。事实上，许多开源应用都是编译后的 C 产品。例如，用于保护网络浏览器中 HTTPS 流量的软件包 OpenSSL\
  \ 就是一个 C 程序。\n\n#### C 无处不在\n尽管你可能使用其他语言编写和创建程序，但该语言使用的底层编译器实际上可能是用 C 编写的。如前所述，Python\
  \ 编程语言本身就是 C 的分支。通过一点努力，可以将 Python 程序编译为相应的 C 程序，这通常是为了让代码运行得更快。同样还有极其流行且无处不在的 Web\
  \ 语言 PHP。用于解释该语言的底层软件名为 `Zend Engine` 的平台，它是用 C 编写的。\n\n### 缺点\n#### 集成到 Web 环境中\n\
  今天大多数初学编码的人对创建基于 Web 的服务感兴趣。因此，目前最流行的开发形式似乎是制作通过 浏览器访问的应用。遗憾的是，C 并不擅长此。如果迫于，你可以利用通用网关接口（CGI）程序，Web\
  \ 服务器可以渲染网页并将 C 程序的输出包含在最终的 HTML 中（Oliphant 1997）。虽然在 CGI 编程中使用 C 是可行的，但 Perl 通常是这种设置的首选语言。再加上考虑到\
  \ CGI Web 编程通常从不认为是 Web 开发者的首选（Dowling 2005）。\n\n#### 基于 GUI 的应用程序\n由于 C 诞生于 UNIX\
  \ 命令行，它大多只能创建命令行程序。如果你想创建一个运行在 GUI 中的桌面应用程序，你需要花时间学习如何使用在界面中渲染窗口的外部库。这可能是类似于 `GTK+`\
  \ 之类的东西。对比 Visual Basic，例如，它允许你交互式地绘制控件和表单并添加代码，过程是流畅且交互的。\n\n## 环境与设置\n\n\n\n\n\
  搭建一个用于编写和编译 C 程序的环境对于每个操作系统来说略有不同。在 Linux 或 Mac OS 环境中，基础工具是开箱即用的，而在 Windows 环境中，则需要在计算机上安装一些额外的工具。这种差异源于这两类操作系统的血缘。UNIX\
  \ 及其后代被称为 `POSIX` 兼容系统。该缩写代表“可移植操作系统接口”（Portable Operating System Interface），它是\
  \ IEEE 编写的一项标准，概述了操作系统必须具备的某些要素。这些前提条件大部分与 C 语言的实现细节以及特定的 Linux 实用程序。Windows 的演进路径与\
  \ UNIX 是独立且不同的，因此 `POSIX` 兼容性从未是该操作系统的驱动因素。\n\n重要的的一点是，`POSIX` 标准的主要目标是确保系统之间的兼容性（Isaak\
  \ 1990）。这与之前提到的 C 语言的原始目标是一致的，即作为一种可以通过编译 C 代码来构建 UNIX 的语言。符合 `POSIX` 标准的操作系统隐式地包含了编写\
  \ C 代码所需的所有工具。相反，Windows 并不是 `POSIX` 兼容操作系统，获取基础工具需要安装一个软件，让你的 Windows 计算机表现得更像基于\
  \ UNIX 的机器（Daintith and Wright 2008）。然而，在按照下面描述的方法配置计算机后，你可能不想开始编写企业级代码；本章严格来说是一个入门课程，将为你提供关于\
  \ C 语言是什么以及它与其他语言区别的初步体验。\n\n### Linux 和 Mac OS\n\n正如刚才提到的，工具是开箱即用的。我们的研究将使用两个工具。首先是\
  \ GCC，代表 GNU C 编译器（GNU C Compiler）。如果你打开 `Terminal` 窗口并输入 `gcc` 然后按回车，你可能会看到一些错误和如\
  \ `compilation terminated` 的消息，这实际上意味着编译已完成。太棒了，这很简单。其次，使用任何文本编辑器输入代码。我们将使用 `nano`。在\
  \ Linux（在此情况下为 Ubuntu）和 Mac OS 中，`nano` 都是预装的。要进行验证，打开 `Terminal` 并输入 `nano`。你将看到屏幕上画出一个原始的界面。按\
  \ `Ctrl + X` 退出。完成。现在将此与 Windows 的说明进行对比。\n\n### Windows\n\n你需要的 C 工具版本并未随 Windows\
  \ 发行。然而，如果你安装了某个版本的微软 Visual Studio，它将带有所需的工具。但在我们的案例中，我们将采取一些不同的做法。我们将安装一个名为 `Cygwin`\
  \ 的工具。`Cygwin` 本质上是一个帮助你在 Windows 中重现 Linux 环境的软件。`Cygwin` 的额外好处是它允许你运行其他有趣且非常有用的\
  \ UNIX shell 命令，例如 `more` 和 `echo`。稍后会详细介绍。\n\n首先，从 `http://cygwin.com/install.html`\
  \ 下载正确版本的 Cygwin。为了方便起见，先尝试 64 位版本，如果不起作用再尝试 32 位。一旦运行下载的文件，系统将提示你进行多次点击。你需要选择一个下载站点（图\
  \ 8.2）；任何站点都可以。\n\n![](img/Figure_8.2.jpg)\n\n图 8.2. 选择下载站点界面。\n\n你也可以选择地理位置较的站点以加速下载。只需寻找与你的所在地匹配的域名即可。一旦安装了基础系统，将提示你安装你需要的包。这里有很多选项，但我们要做的只是展开\
  \ `Devel` 复选框并点击双向箭头，这样所有内容都会被安装。它看起来应该像图 8.3 所示。\n\n![](img/Figure_8.3.jpg)\n\n\
  图 8.3. Cygwin 设置 Devel 安装。\n\n“Bin?” 下方的框将从空方框变为带钩的方框。现在搜索 “nano”，展开 `Editors`，点击\
  \ `Skip` 将其切换为带钩方框（图 8.4）。\n\n![](img/Figure_8.4.jpg)\n\n图 8.4. 选择 Editors 界面。\n\
  \n点击几次 `Next`，等待下载并安装。在最后一步点击 `Finish` 完成过程。在开始菜单中寻找 `Cygwin Terminal` 或类似的内容。结果是一个带有闪烁光标的框，准备让你输入。\n\
  \n## 示例\n\n在开始一些实际示例之前，我们需要对创建 C 程序所涉及的步骤进行通俗概述：\n\n*   编写应用程序的源代码。源代码扩展名为 `.c`。\n\
  *   将源代码编译成中间“对象文件”，该文件介于人类可读代码和计算机将运行的二进制指令之间。\n*   将新生成的对象文件与额外的对象文件链接，这些额外的文件引入了应用程序所需的内置库函数。例如，如果你的程序包含了处理文件的代码，你将链接到提供此功能的对象文件。这些内置函数的人类可读版本保存在扩展名为\
  \ `.h` 的头文件中。\n*   最后一步是创建一个可以在 `Terminal` 命令行上独立运行的可执行文件。\n\n在我们的检查中，我们将对这些步骤进行简写，以便理解。\n\
  \n### Hello World\n\n打开 `Terminal` 窗口（取决于你的系统为 Cygwin）并输入：\n\n```\nnano helloworld.c\n\
  ```\n\n你将看到一个原始的文本编辑器界面。输入以下内容：\n\n```c\n/* Hello World program */\n#include<stdio.h>\n\
  \nmain() {\n\nprintf(\"Hello World\\n\");\n}\n```\n\n按 `Control + O` 保存文件。然后按 `Control\
  \ + X` 退出。一旦回到命令行，输入以下：\n\n```\ngcc helloworld.c\n```\n\n这会将你的程序编译并链接成可执行文件。\n\n\
  ```\nls\n```\n\n这将显示当前文件夹/目录的内容。\n\n```\n./a.out\n```\n\n这将运行你的程序。`a.out` 是 `gcc`\
  \ 编译出的默认程序名称。我们在命令开头加上 `./` 是因为我们正在指示先查看当前目录。`.` 是一个引用当前目录的快捷操作符。当我们想要引用目录中的某个内容时，我们使用\
  \ `/` 字符。\n\n在经过这些魔法操作后，只完成了最基础的任务。这是遵循所有步骤后命令行终端的输出：\n\n```\n>nano helloworld.c\n\
  >gcc helloworld.c\n>ls\na.out helloworld.c\n>./a.out\nHello World\n```\n\n\n\n\n\
  第 4 行是主函数的左大括号。每当你在 C 中定义函数时，你都需要左、右大括号字符。棒的一点是 C 并不不在乎缩进或空格。这些仅仅是为了阅读代码的人而存在的。\n\
  \n第 5 行是该程序的有效负载。这个 `printf` 语句是一个函数，它接收提供的参数（在我们的例子中，是每个程序员都不情愿学习的那句经典的介绍性语句），并将其打印到标准输出。在大多数情况下，输出将是屏幕。字符串末尾的\
  \ `\\n` 部分是一个转义字符，会在字符串末尾添加一个新行。`printf` 之后是一个分号。C 中的每行代码都需要以分号结束，`include` 行除外。在处理完这个强制性的示例之后，让我们深入研究一些特别具有\
  \ C 语言风格的内容。\n\n### 值的地址\n\n回到命令行提示符，尝试使用 `nano` 启动一个名为 `address.c` 的文件，然后输入以下文本并保存文档：\n\
  \n```c\n/* 查看变量的地址 */\n\n#include <stdio.h>\n\nmain() {\n    int x;\n    int y;\n\
  \    x = 3;\n    y = 7;\n    printf(\"Value of x is: %d and located: %p\\n\",x,&x);\n\
  \    printf(\"Value of y is: %d and located: %p\\n\",y,&y);\n}\n```\n\n此示例的命令行工作流应该是这样的：\n\
  \n```bash\n>nano address.c\n>gcc address.c\n>ls\naddress.c a.out a.helloworld.c\n\
  >./a.out\nValue of x is: 3 and located: 0x7ffe28fd9a08\nValue of y is: 7 and located:\
  \ 0x7ffe28fd9a0c\n```\n\n你的输出将与图片中的不同，我们将逐行分析，跳过我们在第一个代码中看过的部分。第 4 行和第 5 行声明了两个整数。作为任何语言的基础数据类型，值在第\
  \ 6 行和第 7 行被赋值给新创建的整数。\n\n第 8 行和第 9 行是我们看到 C 运行的地方。我们再次使用 `printf` 将一些值打印到屏幕上。`printf`\
  \ 是一个非常多功能的函数，它的功能比你想象的要多。如果你给它一个嵌入了 `%` 字符的文本字符串，它会将提供的其他变量填充到 `%` 所在的位置。在我们的第一个示例中，我们使用\
  \ `%d` 序列打印 `x`。这是另一个 C 语言特性：C 并不真正知道任何内存地址中是什么，所以通过 `%d`，你是在告诉解释器打印该内存地址的内容，就像它是整数一样。如果你想在序列中放入字符串，可以使用\
  \ `%s`，对于浮点数使用 `%f`，以此此类推。第二部分是 `%p`，代表指针。`printf` 的第三个参数是 `&x`，它是 `x` 所在的内存地址。`&`\
  \ 运算符告诉 C 你想要你正在查看的实的地址，而不是该实体的值。\n\n这个示例的目的是向你展示 C 代码可以低到什么种程度。当我们打印两个整数时，首先打印它们的值。然后我们做了一件非常模糊的事：打印存储该值的内存位地址（对于\
  \ `x` 来说，这是 `0x7ffe28fd9a08`）。这种查看某个所在地地址的能力是 C 语言的一个基础部分，这种机制被称为指针。理解指针是一项终身追求，任何声称对它们有深入理解的人可能并没有。由于\
  \ C 没有面面向对象的特征，也没有像 Python 等其他语言那样高度抽象的数据结构，当你想要执行复杂操作时，通常会传递一个指向你复杂对象起始部分的指针。例如，一个包含\
  \ `n` 个整数的数组实际上只是内存中 `n` 个连续的位置，每个位置的大小与整数相同。当你想要引用数组中的第三项时，你基本上引用的是位于数组中第一项内存地址偏移加二\
  \ 处的内存内容。回想之前提到的关于糟糕的 C 代码会产生问题。如果你直接访问内存内容，你极有可能会写入或读取一个你不该访问的值。\n\n在移动到下一个示例之前，查看两个整数变量的内存地址之间的区别是值得的。这些数字是用一种叫做十六进制的表示法写的。所以从\
  \ 0 计数到 9，然后是 A 到 F，最后再添加占位符。例如，当你用十进制（我们通常的方法）计数时，当我们从 9 变到 10 时，我们开始新的一一列（`1`），后面跟着\
  \ `0`。在十六进制中，在 F 之后开始新的一列。为了防止事情变得更加混乱，我们每次写十六进制数时都使用前缀 `0x`。在我们的代码中，我们有两个整数，它们很可能被放在计算机内存的连续位置。这两个地址之间的差异是\
  \ `0x4`。因此，一个整数占用四个字节的内存。是的，C 全都是关于这类事情的。太了，我们为什么要关心这个？下一个示例试图说明这种重要性。\n\n### 哎\n\
  \n再次使用 `nano` 编辑文件 `oops.c`：\n\n```c\n/* 访问一段内存 */\n#include <stdio.h>\n\nmain ()\
  \ {\n    int oops;\n    oops = 8;\n    printf(\"Address of oops is: %p\\n\",oops);\n\
  \    printf(\"Contents of oops is: %d\\n\",oops);\n}\n```\n\n程序运行后终端的输出应该是这样的：\n\
  \n```bash\n>nano oops.c\n>gcc oops.c\n>ls\naddress.c a.out oops.c\n>./a.out\nAddress\
  \ of oops is: 0x7ffe28fd9a08\nContents of oops is: 8\n```\n\n为了演示访问你不该访问的内存，尝试这段代码并保存为\
  \ `overflow.c`：\n\n### 溢出\n\n```c\n/* 缓冲区溢出 */\n#include <stdio.h>\n#include <string.h>\n\
  \nint main()\n{\n    int super_user = 0;\n    char login[10];\n    printf(\"Enter\
  \ username: \");\n    gets(login);\n    if (strcmp(\"bob\",login) == 0 )\n    {\n\
  \        super_user = 1;\n    }\n    if(super_user)\n    {\n        printf(\"Super\
  \ Access granted!\\n\");\n    }\n    else\n    {\n        printf(\"Sorry, you are\
  \ not a super user\\n\");\n    }\n    /* 做一些只有超级用户才能做的事 */\n    return 0;\n}\n```\n\
  \n让我们逐行分析。3 行（忽略空行）包含了 `string.h`，以便我们稍后调用 `strcmp`。在第 4 行中，我们声明 `main` 函数返回一个 `int`，或整数值。这是为了让示例按预期工作。第\
  \ 7 行声明了一个长度为 10 的字符数组，这是 C 语言（无论好坏）表示字符串的方式。第 9 行让我们使用内置的 `gets` 函数获取直到用户按下回车的输入。\n\
  \n以下显示了代码编写-保存-编译循环以及最终产品的几次运行输出。注意我们必须通过命令行参数向 `GCC` 传递一些额外信息，以关闭编译器通常使用的某些保护。\n\
  \n```bash\n>nano overflow.c\n>gcc -wall -fno-stack-protector overflow.c\n>ls\naddress.c\
  \ a.out helloworld.c oops.c overflow.c\n>./overflow.out\nEnter username: bob\nSuper\
  \ Access granted!\n>./overflow.out\nEnter username: peter\nSorry, you are not a\
  \ super user\n>./overflow.out\nEnter username: joe\nSorry, you are not a super user\n\
  >./overflow.out\nEnter username: abcdefghijklmno\nSuper Access granted!\n```\n\n\
  \n\n第 12 行将用户输入的值与神奇的超级用户账户名进行比较。`C` 以标准方式（逐字符地）对字符串进行比较，并返回整数形式的差异值。因此，两个相同字符串的差异为\
  \ `0`。在这种情况下，它会检查 `super_user` 是否被设置为 `1` 或 `true`。第 16 行表示，如果 `super_user` 为 `true`，我们就知道用户具有特殊权限，因此我们使用\
  \ `printf` 语句告知用户。第 22 行允许我们通过返回任意整数 `0`（第 23 行）在不产生编译错误的情况下结束 `main` 函数。与字符串比较类似，我们在这里使用\
  \ `0` 表示成功，这与检查 `super_user` 的情况不同，在后者中非零数字表示成功。没错，又一个“C 语言特性”在发挥作用。\n\n这个例子是一个刻意设计的示例，用于展示\
  \ `C` 创造所谓的“缓冲区溢出”的能力。当你将过多的数据挤入一系列内存位置时，并导致了奇怪的结果，就会发生缓冲区溢出。这个简单的程序首先要求某人输入用户名。如果该用户名是\
  \ `bob`，它就会授予该用户超级权限。然而，这个程序是可以被利用的。软件作者认为用户名只会有十个字符。但是，如果你是一个进取的个人，你可能会发现如果你输入一个超过十个字符的用户，程序会尝试将所有这些字符挤进十个位置，导致它们溢出到相邻内存中，并引起各种问题。在这种情况下，它跳过了将输入的用户名与“bob”进行比较的尝试，如果是这种情况，则会将\
  \ `super_user` 设置为 `1`。为了让你更透彻地理解这个例子，用于编译程序的 `GCC` 行与我们目前看到的略有不同。在这种情况下，我们显式地告诉编译器不要检查缓冲区溢出。\n\
  \n## 神秘代码\n\n如果你觉得 `C` 看起来很困惑，那是因为它确实很复杂。如之前所示，在 `C` 中访问一切内容都是在非常低的机器层面完成的，甚至到了直接查看内存位置的地步。给你的数据结构非常简陋，基本上是一块你需要非常小心地引用的连续内存。这些低级规范创建了运行良好的代码，但代价是代码可能完全不可读。这种不协调性在\
  \ `C` 语言程序员参与的一系列事件中达到了惊人的极端。例如，“阴险 C 竞赛”（Underhanded C Contest）是一项比赛，参赛者必须创建一段看似无害但实际上执行了某些可疑功能的代码。在之前一年的比赛中，目标是创建一个模拟航空公司行李处理系统的软件，如果记录中应用了某个特定的自由文本注释，该系统必须秘密地重路由某些行李。代码的编写方式还必须让看到它的人无法推断其意图。\n\
  \n另一个珍宝是“国际混淆 C 代码大赛”（International Obfuscated C Code Contest）。例如，这段代码块是对 `1990`\
  \ 年提交的某些代码的轻微修改。在名为 `mystery.c` 的文件中输入以下内容：\n\n```c\n#include<stdio.h>\n\nv,i,j,k,l,s,a[99];\n\
  \nmain()\n\n{\n\nfor(scanf(\"%d\",&s);*a-s;v=a[j*=v]-a[i],k=i<s,j+=(v=j<s&&(!k&&!!printf(2+\"\
  \\n\\n%c\"-(!l<<!j),\" #Q\"[l^v?(l^j)&1:2])&&++l||a[i]<s&&v&&v-i+j&&v+i-j))&&!(l%=s),v||(i==j?a[i+=k]=0:++a[i])>=s*k&&++a[--i])\n\
  \    ;\n\n}\n```\n\n如果没有清晰的提示、图表和礼貌的描述，可能无法推断这段代码的意思。比赛组织者提供了关于如何运行它以及结果应该是什么样的提示。这里显示了输入和编译步骤：\n\
  \n```bash\nnano mystery.c\ngcc matery.c\n```\n\n```\nmystery.c:2:1: warning: data\
  \ definition has no type\n      or storage class [enabled default]\necho 8 | ./a.out\n\
  ```\n\n你可能会收到一些错误信息，但忽略它是安全的。在描述和最终结果之前，让我们来看最后一行：\n\n```bash\necho 8 | ./a.out\n\
  ```\n\n这是另一个完美的例子，展示了 `C` 与 `UNIX` 结合得有多紧密。如果我们从左到右读这一行，`echo` 是 `UNIX` 工具的名称，它会将后面的任何内容回显到屏幕。`8`\
  \ 是你预期的，数字 `8`。接下来是 `|` 符号。在 `UNIX` 中，这是一个命令行参数，本质上是取左侧程序的输出（显示在屏幕上的数字 `8`），并将其作为下一个程序的输入，在我们的例子中就是我们刚刚编译的神秘代码。这个过程被称为“管道”。你可以将几乎任何\
  \ `UNIX` 命令的输出管道到任何其他 `UNIX` 命令，这使得在短时间内对计算机执行非常复杂的操作变得可能。看看我们的示例生成的输出。在阅读描述之前，你能通过观察这个判断代码在做什么吗？\n\
  \n```\n # #Q# #\n # Q # #\nQ# # # #\n# # # Q\n # Q # #\n# # #Q#\n # # # Q\n# Q #\
  \ #\nQ# # # #\n# # #Q#\n Q # # #\n# # # #\n# # #\n# # #\n```\n\n\n\n\nOliphant,\
  \ Zan. 1997\\. “用 C 编程 CGI.” PC Magazine 16 (5): 235.\n\nPurdum, Jack J. 2006\\\
  . Arduino C 入门。柏林: Springer.\n\nRajaraman, V. 2012\\. “Dennis M Ritchie.” Resonance:\
  \ 科学教育期刊 17 (8): 721–23.\n\nStackhouse, Jim. 1996\\. “C 语言语言.” [`www.csc.villanova.edu`](http://www.csc.villanova.edu)/~lab/C/.\n\
  \nVine, Michael A. 2002\\. 初学者 C 语言编程：趣味编程的方法。辛辛那提: Premier Press.\n\n## 推荐资源\n\n\
