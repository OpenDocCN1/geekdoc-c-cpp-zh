  \ 可购买或免费在线阅读，它提供了一种学习 Python 的实用方法，以深思熟虑的节奏巩概念。这是熟悉语法和编程原则极极方法。\n\nLibrary Juice\
  \ (Python 课程)。图书馆专业人员职业发展服务定期提供入门课程。\n\n## 第三章：Ruby\n\nAshley Blewer 和 Jessica Rudder\n\
  \n### 历史与发展\n\n#### 什么是 Ruby，它与其他语言有何不同？\n\n既然我们已经定义了 Ruby，让我们快速回顾一下它的历史。在 20 世纪\
  \ 90 年代初，存在多种编程语言，从 `C`（一种广泛用于系统编程的低级语言）到 `Python`（功能与 Ruby 相似的语言）。与许多仅为了满足特定编程需求而开发的语言不同，Ruby\
  \ 的创建同时兼顾了功能性和美学目的。\n\nRuby 是由松本裕（俗称 `Matz`）在 20 世纪 90 年代中期设计的。尽管他熟悉 `Perl`，但 `Matz`\
  \ 不认为它能够在生产环境中创建可靠、可维护的程序。他也了解 `Python`，但不认为它是真正的面向对象语言，这对他来说是一个非常重要的特性。据松本所说，“作为一个\
  \ 15 年的语言狂热爱好者和[面向对象的粉丝]，我真的想要一种真正的面向对象、易用的脚本语言。我寻找过但没有找到。所以我决定自己做一个” (Matsumoto\
  \ 1999)。\n\n松本还想创造一种编程起来令人愉悦的美语言。他认为大多数计算机语言为了减轻计算机的负担，而在编写代码的人施加了负担。这导致了编程变得异常困难。松本认为重点应该放在人而不是机器上，因此他的目标是创建一种让无论是初学者还是编程多年的人员都能享受编程的语言。为了实现这一目标，他根据以下三个原则设计了\
  \ Ruby：\n\n\n\n\n\n## 简洁原则\n松本（Matsumoto）认为计算机应该能够通过非常少的指令完成大量工作。通过要求计算机承担更多繁重的工作（例如推断变量类型和处理内存管理），并减少程序员编写的指令，从而减轻了编写代码时的内存和时间负担。为了直观感受，你可以对比流行的面向对象语言\
  \ `Java` 和 `Ruby` 的“Hello, World”代码。在 `Java` 中，代码看起来如下：\n\n```java\nclass HelloWorld\
  \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
  Hello World!\");\n    }\n}\n```\n\n在 `Ruby` 中：\n\n```ruby\nputs \"Hello, World!\"\
  \n```\n\n这两组代码产生相同的结果。屏幕上会打印出文本 Hello, World!。`Ruby` 的代码短得多，对程序员来说编写和理解都更加容易。\n\n\
  ## 一致性原则\nRuby 被认为遵循“最小惊讶原则”（POLA），这意味着它的行为应该尽可能地减少编写该语言的人的困惑。`Ruby` 旨在保持深度的同时尽可能简单，以最大地提高易用性。`Ruby`\
  \ 的意义不仅仅是简单——`Ruby` 旨在读起来是自然的，就像非计算机语言应该是自然的一样。\n\n```ruby\n5.times do\n    puts\
  \ \"Hello, World!\"\nend\n```\n\n即使是没有编程经验的人，也可以阅读上面的代码，并很好地感知这段代码在运行时会做什么。\n\n\
  ## 灵活性原则\n松本认为语言（包括计算机语言）是为了表达思想的。语言不应该限制人类思维，而应该促进它。因此，`Ruby` 在创建时拥有一个小小的、不可更改的核心语法，并能够在整个库中根据需要和意愿扩展语言的能力。与强调完成任务有“唯一正确方法”的\
  \ `Python` 相比，`Ruby` 尝试提供许多方法，以便开发者可以找到最适合自己的一种。执行多次某项的任务代码就是一个极佳的例子：\n\n1. `10.times\
  \ do`\n   puts \"Ruby is flexible!\"\nend\n\n2. `(1..10).each { puts \"Ruby is flexible!\"\
  }`\n\n3. `for i in 1..10 do`\n   puts \"Ruby is flexible!\"\nend\n\n4. `1.upto(10)\
  \ { puts \"Ruby is flexible!\"}`\n\n上述四个示例的结果是相同的。在每种情况下，短句 Ruby is flexible! 均出现了十次。这种灵活性对于新接触\
  \ `Ruby` 的人来说特别有用，因为它允许他们从多个角度来处理同一个问题。\n\n除了语言开发背后的理论，`Ruby` 还受到 `Perl`、`Smalltalk`、`Eiffel`、`Ada`\
  \ 和 `Lisp` 等其他面向对象编程语言的影响。它的语法类似于 `Perl`，语义则类似于 `Smalltalk`。\n\n## 环境与安装\nRuby 默认内置在\
  \ Mac 机器上。可以使用 `HomeBrew` ([`brew.sh`](http://brew.sh)/)——一个 Mac 系统的包管理器来安装其他版本的\
  \ `Ruby` 和其他相关程序。这个包管理器是用 `Ruby` 构建的！如果你使用的是 Windows 机器，你将必须安装 `Ruby`，因为它不是原生内置的。有一个名为\
  \ `RubyInstaller` 的项目可以帮助（[`rubyinstaller.org`](http://rubyinstaller.org)/）完成这种安装。\n\
  \n要立即开始使用 `Ruby`，你可以打开交互式 Ruby 终端，即 `IRB`。`IRB` 随 `Ruby` 一起内置，因此它在安装 `Ruby` 时会被安装。在安装语言后快速开始并立即编写代码的能力是\
  \ `Ruby` 的优势之一。\n\n`IRB` 是一个“壳”，允许你在计算机的 `Terminal` 中安全地编写和测试 `Ruby` 代码。在 Mac 上，输入\
  \ `irb` 会会在屏幕上打开它。输入 `quit` 会退出程序并回到普通的 `Terminal` 屏幕。`Ctrl-D` 也会退出程序。在 Windows\
  \ 机器上打开 `IRB`，你可以点击“开始”并在菜单中选择 Interactive Ruby。\n\n你可以通过打开 `IRB` 并输入以下代码来尝试 `Ruby`\
  \ 编程：\n\n```ruby\nname = \"Ruby programmer\"\nputs \"Hello, #{name}!\"\n```\n\n\
  在这个小型程序中，`name` 是一个“变量”，一种存储位置，现在它包含了短语“Ruby programmer”。第二行代码告诉 `Ruby` 将变量 `name`\
  \ 的内容插入到短语“Hello, _____!”中，并将最终短语“Hello, Ruby programmer!”输出到屏幕。\n\n当你退出 `IRB` 时，你的代码也会消失。除了使用\
  \ `IRB`，你还可以编写 `Ruby` 程序。在文本编辑器（如 `SublimeText`、`Atom` 或 `TextWrangler`）中编写 `Ruby`\
  \ 并将其保存为 `.rb` 文件将创建一个 `Ruby` 脚本文件。然后可以在命令行中通过输入 `ruby [filename.rb]` 并回车来运行该文件。使用上述\
  \ `IRB` 部分的代码来尝试一下。在运行文件后，你应该会在终端中看到“Hello, Ruby programmer!”。注意，在这种情况下，Microsoft\
  \ Word 不能作为文本编辑器，因为它会在文件中存额外信息，导致程序无法运行。\n\n`Ruby` 是一门奇妙的语言，允许你快速高效地编写程序。`Ruby`\
  \ 的另一个优秀特性是 `gems` 概念。`gems` 是 `Ruby` 代码的库，易于安装和使用。即使是大型框架如 `Ruby on Rails` 也被封装为\
  \ `Ruby gem`，只需一行代码即可下载并安装：`gem install rails`。任何人都可以通过 RubyGems.org](http://RubyGems.org)（Ruby\
  \ 托管服务）创建并共享 gem。\n\n### 用途\nRuby 最常用于 Web 开发，`Ruby on Rails` 框架基于 Ruby 语言。较小的框架包括\
  \ `Sinatra` 和 `Middleman`，它们允许轻松创建网站并由 `Ruby` 驱动。`Ruby` 在网站后端非常高效，允许你的计算机连接到提供数据的服务器。\n\
  \n由于 `Ruby` 原生内置于 Mac 并在 Windows 上容易安装，对于解析小型数据集非常有用。例如，如果你有一千包含读者数据的记录，但只需要他们的电子邮件地址，你可以编写一个小型脚本将这些数据导出到新文件中供通讯稿使用。\n\
  \n几个用于图书馆科学的大框架都基于 Ruby。`Blacklight`、`Hydra` 和 `Avalon` 项目都是用 `Ruby` 构建的；因此，对 `Ruby`\
  \ 工作原理的基本知识有助于这些框架的安装、开发和维护。\n\n\n\n\n\n创建了一些更小的脚本和 gem 来优化以库为中心的工作。例如：`ruby-oai`，一个用于构建\
  \ OAI-PMH 客户端和服务器的 Ruby 库 ([`github.com/code4lib/ruby`](https://github.com/code4lib/ruby)-oai)；`nypl-collections`，一个用于轻松访问纽约公共图书馆数字收藏的\
  \ gem ([`rubygems.org/gems/nypl`](https://rubygems.org/gems/nypl)-collections)；以及\
  \ `marc`，一个用于（你猜得懂的）处理 MARC 目录记录的 gem ([`rubygems.org/gems/marc/versions`](https://rubygems.org/gems/marc/versions)/1.0.0)\
  \ 。\n\n## 优点与缺点\n\nRuby 语言追求人类可读性，这可能是它最大的优势。Ruby 的目标不仅仅是简单，而是要像英语母语者阅读英语一样自然。Ruby\
  \ 易于理解，但要理解它的全部潜力时却非常复杂。\n\n```ruby\n5.times do\n  puts \"I love Ruby!\"\nend\n\
  ```\n\n有了像这样简单的脚本，即使你没有之前的编程经验，也能猜出将发生什么。这段代码将在屏幕上打印五次 `I love Ruby!`。\n\n安装非常简单，无论是这门语言还是你可能想要安装的任何语言库都是。Ruby\
  \ 在 Mac 上是原生打包的，并为 Windows 或 Linux 机器提供了安装说明。代码库（称为 gems）可以使用命令行上的 `gem install`\
  \ 命令轻松安装。考虑到上述注释，Ruby 是一门非常适合初者的语言，因为初可以学习编程的核心概念，而不会被困难的语法或环境设置错误所困扰。\n\n除了代码本身，Ruby\
  \ 还拥有一个强大且专注的用户和开发者社区。由于 Ruby 是开源的，任何人都可以改进这种语言，或者创建让其他人更容易使用该语言的库。\n\n对于初学者来说，Ruby\
  \ 是一个很好的选择，但取决于学习编程语言的原因，长期来看可能不是最佳选择。例如，Ruby 非常适合开发面向 Web 的代码，但 `JavaScript` 是一种为\
  \ Web 构建并运行在 Web 之上的强大语言。因此，如果你学习编程的主要目的是制作网站，那么 `JavaScript` 可能是更有效的长期选择。\n\n当涉及到将\
  \ Web 扩展到 Facebook 级别的规模时，取决于部署的数据类型以及是否在更新时需要实时运行，Ruby 的速度比所需的要“慢”。然而，Codecademy、AirBNB\
  \ 以及其他主要网站运行在 Ruby on Rails 上。Ruby 中的每个操作——即使是整数加法——都是通过调用方法完成的，因此搜索和调用方法的成本不忽视，特别是对于简单的程序而言。然而，当程序变得更大更复杂时，不会因为方法产生显著的性能差异\
  \ (Matsumoto 2000)。\n\n`JavaScript` 围绕数据可视化构建了更好的库。Ruby 仍然缺乏编写创建复杂可视化代码的能力。这并不是因为\
  \ Ruby 语言本身出了问题，而是遗憾的是，Ruby 程序员还没有构建所需的库。\n\nRuby 和 `Python` 是非常相似的编程语言。如果主要重点是基于科学的学习，`Python`\
  \ 可能比 Ruby 更合适。`Python` 更频繁地用于研究和数据科学，`Python` 社区也支持了这些需求。\n\n## 示例\n\n### 解析 JSON\
  \ 数据\n\nJSON 代表 JavaScript 对象表示法（JavaScript Object Notation）。它的构建是为了作为数据从一个系统传输到另一个系统的轻量级方式。其设计目标是便于人类读写，并便于计算机解析和创建。它是基于文本且与语言无关的，这意味着你的\
  \ JSON 可以用于用 Ruby、`Python`、`C++` 和其他语言编写的程序。\n\n以下是从 Twitter API 文档提取的一些 JSON 示例\
  \ ([`dev.twitter.com/rest/reference/get/statuses/show`](https://dev.twitter.com/rest/reference/get/statuses/show)/:id)：\n\
  \n```json\n{\n  \"coordinates\": null,\n  \"favorited\": false,\n  \"truncated\"\
  : false,\n  \"created_at\": \"Wed Jun 06 20:07:10 +0000 2012\",\n  \"id_str\": \"\
  210462857140252672\",\n  \"entities\": {\n    \"urls\": [\n      {\n        \"expanded_url\"\
  : \"https://dev.twitter.com/terms/display-guidelines\",\n        \"url\": \"https://t.co/Ed4omjYs\"\
  ,\n        \"indices\": [\n          76,\n          97\n        ],\n        \"display_url\"\
  : \"dev.twitter.com/terms/display-\\u2026\"\n      }\n    ],\n    \"hashtags\":\
  \ [],\n    \"text\": \"Twitterbird\",\n    \"indices\": [\n      19,\n      31\n\
  \    ]\n    ],\n    \"user_mentions\": []\n  },\n  \"in_reply_to_user_id_str\":\
  \ null,\n  \"contributors\": [\n    14927800\n  ],\n  \"text\": \"Along with our\
  \ new #Twitterbird, we've also updated our Display Guidelines: https://t.co/Ed4omjYs\
  \ ^JC\",\n  \"retweet_count\": 66,\n  \"in_reply_to_status_id_str\": null,\n  \"\
  id\": 210462857140252672,\n  \"geo\": null,\n  \"retweeted\": true,\n  \"possibly_sensitive\"\
  : false,\n  \"in_reply_to\": {\n    \"user\": {\n      \"id\": 210462857140252672,\n\
  \      \"id_str\": \"210462857140252672\",\n      \"name\": \"Twitter API\",\n \
  \     \"screen_name\": \"twitterapi\",\n      \"location\": \"San Francisco, CA\"\
  ,\n      \"description\": \"The Real Twitter API. I tweet about API changes, service\
  \ issues and happily answer questions about Twitter. Don't get an answer? It's on\
  \ my website.\",\n      \"profile_image_url\": null,\n      \"profile_image_url_https\"\
  : null,\n      \"followers_count\": 12163,\n      \"friends_count\": 31,\n     \
  \ \"following\": true,\n      \"statuses_count\": 3333,\n      \"protected\": false,\n\
  \      \"verified\": true,\n      \"verified_ true,\n      \"time_zone\": \"\n Time\n\
  \n\"utc_offset\": -28800,\n      \"geo_enabled\": true,\n      \"background_image_url\"\
  : null,\n      \"background_image_url_https\": null,\n      \"background_color\"\
  : \"DEEF6\",\n      \"border_color\": \"C0ED\",\n      \"text_color\": \"333333\"\
  ,\n      \"lang\": \"en\",\n      \"profile_use_background\": true,\n      \"listed_count\"\
  : 10774\n    },\n    \"in_reply_to_status_id\": null,\n    \"in_reply_to_status\"\
  : null\n  },\n  \"source\": \"web\"\n}\n```\n\n记住，以上是与一条推文相关的所有元数据。想象一下，如果不仅仅是一个\
  \ JSON 块，而是成千上万个，每个都包含不同的数据。如果可以获取所有所需的信息而不需要翻阅上万行大括号，将会简单得多，不是吗？Ruby 可以帮助你做到。\n\
  \n在开始处理 JSON 之前，你需要安装一个为 Ruby 创建的 JSON 库。如果你还没有安装过，你需要运行 `gem install 'json'`。然后，在你的文本文档顶部，包含\
  \ `require 'json'`。用 Ruby 打开一个有效的 JSON 文件：\n\n```ruby\nfile = open('test.json')\n\
  json = file.read\ndata = JSON.parse(json)\n```\n\n\n\n\n上述内容依赖于 `JSON` 库以必要的方式修改数据，使其能够被\
  \ Ruby 读取。现在数据已经过修改，可以对其进行组织了。这里是我们可以做的一些简单操作：\n\n```ruby\ndata[0]\n\n### 这将返回系列中的第一条推文\n\
  \ndata[2][\"text\"]\n\n### 这将返回系列中第三条推文的内容\n```\n```\n\n如果我们想一次查看不仅仅是一条推文呢？我们可以遍历整个文本来提取出所需的信息。\n\
  \n```ruby\ndata.each do |tweet|\n  p tweet[\"text\"]\nend\n```\n\n这将返回每个 `JSON`\
  \ 对象的文本（即推文的“tweet”部分）。每条推文都包含大量的关联元数据，使用这种类似的方法可以收集到更有趣的信息，例如转发次数、地理数据、使用的标签或作者描述。\n\
  \n### 使用 Nokogiri 爬取网页\n\n什么是网络爬虫？网络爬虫是通过通过程序化地从互联网抓取数据，以便你可以在自己的应用程序中使用这些数据。`Nokogiri`\
  \ 是一个 Ruby 库，它可以让你轻松地从网页上爬取数据。它也是一种从各种来源持续获取数据并将其整合在一个处进行分析的简单方法。`Nokogiri`（源自日语单词“鋸”，锯子）是一个\
  \ HTML、XML、SAX 和 Reader 解析器。在 `Nokogiri` 的众多功能中，包含了通过 `XPath` 或 `CSS3` 选择器搜索文档的能力（[`www.nokogiri.org`](http://www.nokogiri.org)）。\n\
  \n要使用 `Nokogiri`，我们还需要 `Open-URI`。`Open-URI` 是 Ruby 中的一个模块，允许我们程序化地发送 http 请求。它允许我们通过命令行轻松地打开并解析\
  \ HTML 页的内容。\n\n你可以编写一个一次性执行所有操作的文件，也可以通过教程配合 `IRB` 逐步进行——记住，你可以通过 Mac 终端输入 `IRB`\
  \ 或在 Windows 机器的开始菜单中选择它来访问。在你的文件顶部，你需要 `require` 这两个库，以便你的程序知道它需要它们。这只需要在文本文档顶部添加以下代码行即可：\n\
  \n```ruby\nrequire 'nokogiri'\nrequire 'open-uri'\n```\n\n选择一个感兴趣的网站。在这个示例中，我们将使用美国国会的“访问图书馆”页面（图\
  \ 3.1）。一旦选定了页面，使用 `Open-URI` 打开该网站。我们这样操作：\n\n```ruby\nhtml = open([`www.loc.gov/visit`](http://www.loc.gov/visit))\n\
  ```\n\n屏幕上应该打印出一个临时对象。要用 `Nokogiri` 解析该数据，我们可以运行以下代码：\n\n```ruby\nnokogiri = Nokogiri::HTML(html)\n\
  ```\n\n这将该网站的内容显示在屏幕上。你看到我们在做什么了吗？我们正在声明一个变量并命名为 `nokogiri`（尽管你可以给它任何名字，就像上面的 `html`\
  \ 变量一样）。\n\n![](img/Figure_3.1.jpg)\n\n图 3.1，“访问图书馆”（美国国会）。\n\n检查网页的 HTML，我们可以看到\
  \ Tours（行程）、Exhibitions（展览）和其他其他标题使用了 `h2` 标签。如果你想在不访问网站的情况下快速提取此列表，可以使用 `Nokogiri`。\n\
  \n现在我们已经将网站加载到变量 `nokogiri` 中，我们可以从网站中提取内容。这一行 `title = nokogiri.css('h2').text`\
  \ 将提取页面上所有的 `h2` 标签。由于代码中额外的空格，文本看起来会有些杂乱。Ruby 会清理这些数据。\n\n```ruby\ntitle = nokogiri.css('h2').collect\
  \ do |titles|\n  titles.text.strip!\nend\n```\n\n现在我们不仅拥有了想要的标题，还拥有许多 `nil` 标题。这是由于网站上杂乱的数据，这些标签内部没有任何内容。所有这些空白标签都返回了\
  \ `nil`。\n\n```\n[nil, nil, nil, nil, nil, nil, nil, nil, nil, nil, nil, nil, nil,\
  \ nil, nil, nil, nil, nil, nil, nil, nil, nil, \"Visiting the Library\", \"Tours\"\
  , \"Maps & Floor Plans\", \"Dining\", \"Shopping\", \"Volunteer Opportunities\"\
  , \"Contact Visitor Services\", nil, nil, nil, nil]\n```\n\n我们也可以通过运行 `compact!`\
  \ 方法用 Ruby 快速清理。\n\n```ruby\ntitle.compact!\n```\n\n现在我们有了一个包含所有所需选项的数组：\n\n```\n\
  [\"Visiting the Library\", \"Tours\", \"Maps & Floor Plans\", \"Dining\", \"Shopping\"\
  , \"Volunteer Opportunities\", \"Contact Visitor Services\"]\n```\n\n这是一个非常简单的示例，但有很多方法可以使用\
  \ `Nokogiri` 爬取网页，然后用 Ruby 轻松地处理数据。你只需要将上面的示例和 `CSS` 替换为你自己的网站和你想要爬取的对象，就可以在你自己的网站上测试。网络爬虫对于不同页面具有重复数据结构的网站非常有用，类似于美国国会主题分类权威页面（[`authorities.loc.gov`](http://authorities.loc.gov)）。即使你更改在\
  \ `Open-URI` 中设置的 URL，你仍然可以使用它。\n\n## 总结\n\nRuby 是一种动态的、面向对象的开源编程语言，其目标是让编程变得简单愉悦。Ruby\
  \ 遵循的三个原则是简洁性、一致性和灵活性。\n\n## 参考文献\n\nMatsumoto, Yuki. 1999. “ruby-talk:0382.” 6\
  \ 月 4 日。[`marc.info/?l=ruby-talk&m=9639833724637&w=2`](http://marc.info/?l=ruby-talk&m=9639833724637&w=2)。\n\
  \n———. 2000. “The Ruby Language.” InformIT，6 月 12 日。[`www.informit.com/articles.aspx?p=18225&seqNum=2`](http://www.informit.com/articles.aspx?p=18225&seqNum=2)。\n\
  \n## 推荐资源\n\n#### 在线资源\n\n[HacketyHack.com](http://HacketyHack.com): [`www.hackety.com`](http://www.hackety.com)\n\
  \n[Learn.co](http://Learn.co): [`learn.co`](https://learn.co)\n\nLearn Ruby with\
  \ the Neo Ruby Koans: [`rubykoans.com`](http://rubykoans.com)\n\nTry Ruby: [`tryruby.org`](http://tryruby.org)\n\
  \nWhy’s (Poignant) Guide to Ruby: [`mislav.uniqpath.com/poignant-guide/`](http://mislav.uniqpath.com/poignant-guide/)\n\
  \n####籍\n\nBlack, David A. 2014. *The Well-Grounded Rubyist*. Greenwich, CT: Manning.\n\
  \nCooper, Peter. 2011. *Beginning Ruby: From Novice to Professional*. New York:\
  \ Apress.\n\nFernandez, Obie, and Kevin Faustino. 2014. *The Rails 4 Way*. Boston:\
  \ Addison-Wesley Professional.\n\nMetz, Sandy. 2012. *Practical Object-Oriented\
  \ Design in Ruby: An Agile Primer*. Boston: Addison-Wesley Professional.\n\nOlsen,\
  \ Russ. 2011. *Eloquent Ruby*. Boston: Addison-Wesley Professional.\n\nShaughnessy,\
  \ Pat. 2013. *Ruby under a Microscope: An Illustrated Guide to Ruby Internals*.\
  \ San Francisco: No Starch Press.\n\n\n\n理解 JavaScript 的历史是理解该语言本质的重要一步。它由 Netscape\
  \ Communications 公司于 1995 年作为一种网络浏览器的脚本语言开发出来。臭名昭彰的是，原始开发者仅给了十天时间来设计并编写整门语言，而这种语言还面临着必须嵌入超文本标记语言（HTML）中的技术挑战（Wood\
  \ et al. 2014）。为了理解这种复杂性，请考虑 HTML 依赖于标签周围的角括号，例如 `<body>`，因此即使是用于比较的大、小于号等常用数学符号，也为新语言的设计带来了困难。鉴于其仓促的发展和面临的挑战，JavaScript\
  \ 出现一些怪异和显而易见的错误并不意外。尽管如此，JavaScript 成功了，并且实际上是地球范围内最使用的编程语言之一，其表达能力创新特性备受某些人的赞誉。\n\
  \n当 Netscape 开发者们开始为浏览器设计一种脚本语言时，他们希望它是易于上手的，特别是对于初学者而言（Wood et al. 2014）。该语言的设计目标集中于简单性，使其能够通过少量代码完成任务，且不需要编译。编译是将计算机代码传递给产生二进制执行文件的“编译器”程序的过程。JavaScript\
  \ 的灵感源自现有语言，如 `Scheme`、`HyperTalk` 和 `Smalltalk`，而不是当时更复杂的编译型语言（包括 `C` 和 `Java`）。这个名称本身通常是困惑的源源：JavaScript\
  \ 与 `Java` 之间没有任何正式关系。相反，JavaScript 这个名字是一种营销噱头，旨在将这种新的脚本语言与流行的 `Java` 语言联系起来（Wood\
  \ et al. 2014）。虽然两者在表面上确实有一些相似之处，但在哲学思想和用例方面实际上非常不同。事实上，虽然 JavaScript 是一个广为人知的名称，但该语言由主持该标准的\
  \ Ecma 国际组织标准化为 `ECMAScript`。\n\nJavaScript 的命运与网络浏览器的命运紧密相连，无论好坏。自从 JavaScript\
  \ 在发布后不久就开始被全球范围的网站使用以来，纠正这门语言最初的缺陷变得困难。虽然其他编程语言可以发布新的编译器或解释器程序来移除存在问题的功能或彻底改变其语法，但\
  \ JavaScript 基于 Web 的特性使其演进变得艰辛。随着时间的推移，网络浏览器对该语言开发了不一致、竞争性且偶尔有缺陷的实现。由于浏览是该语言的主要用途，很难区分语言本身的缺陷与设计不当浏览器功能。在经历了以\
  \ 1999 年发布第三版 `ECMAScript` 为结束的一系列初始更新后，该语言陷入了停滞。第四版曾开始启动，但由于编写委员会内部的分歧，从未完成（Wood\
  \ et al. 2014）。然而，浏览器也推动了 JavaScript 的流行及其一些最具创新的用途。\n\n微软的 Internet Explorer 在\
  \ 20 世纪 90 年代后期引入了后来变成 `XMLHttpRequest` 功能（Flanagan 2011, 491–94）。这一浏览器功能是所谓 `AJAX`（Asynchronous\
  \ JavaScript 和 XML 的缩写，尽管可以使用非 XML 数据格式）编程的基础，这是一种无需刷新整个页面即可将数据抓取到网页中的轻量级技术。`AJAX`\
  \ 最终催生了大量用 JavaScript 编写的创新型 Web 应用程序，如 `Outlook Web App`、`Gmail` 和 `Google Maps`。这些动态应用程序不断刷新其数据并智能地响应用户输入，这与\
  \ 20 世纪 90 年代早期 Web 特有的相互连接但静态的文档集有巨大差异。\n\n随着复杂的 Web 应用程序的普及以及互联网公司实现盈利，JavaScript\
  \ 变成了一门极其重要的语言。它的停滞面临着阻碍 Web 开发的风险。各大科技公司注意到了并开始推动该语言的发展。`Apple`、`Ebay`、`Google`、`Intel`、`Microsoft`\
  \ 和 `Mozilla` 的员工代表负责 `ECMAScript` 标准的 `TC39` 委员会（ECMAScript Wiki n.d.）。Web 领域的新一波投资导致了\
  \ 2009 年改进后的第五版 `ECMAScript` 以及松散归类在 `HTML5` 术语下的大量浏览器功能。`HTML5` 让 Web 进一步从一个基于文档的超文本系统转向可能成为跨平台应用开发的首选平台。JavaScript\
  \ 获取了存储和数据库、地理位置信息、高级几何绘图和图形能力、音频和视频，以及麦克风和摄像头等用户硬件，而这些曾是 `Adobe Flash` 等浏览器插件的专属领域。今天，JavaScript\
  \ 是一门强健且繁荣的语言。针对网络浏览器和语言本身的新特性正在被快速开发。这门语言开始在网络浏览器之外生根，并在下文中讨论了令人兴奋的新用途。\n\n###\
  \ 用途\n\nJavaScript 主要因一特性而闻名：让网站具有交互性。虽然其他框架也尝试过这一点——特别是 `Java applets` 和 `Adobe\
  \ Flash`——但它们通过用户必须安装的浏览器插件实现，而 JavaScript 包含在每个常用的网络浏览器中。`Apple` 决定不在 iPhone 的\
  \ `Mobile Safari` 浏览器上允许 `Adobe Flash`，这给了 JavaScript 巨大的优势。人们广泛认为使用 JavaScript\
  \ 是编写跨平台交互网站的最佳方式，这也是该语言的主要区别。\n\n创建一个多标签搜索框是 JavaScript 能力的一个良好例子。多标签搜索框是图书馆网站的常见功能，因为许多图书馆提供多个搜索引擎：书籍和媒体目录、包含期刊文章的发现层、跨多个独立搜索引擎的联邦搜索、期刊搜索、`LibGuides`、特藏、档案。这些这些每项都为用户提供不同的维度和指令，而在你的网站上一个一个放置搜索表单会占用大量的空间。一次显示一个搜索表单的标签式搜索节省了空间，但通过其他标签为用户提供了访问各种搜索引擎的机会。这些接口是用\
  \ JavaScript 实现的，当点击标签时，它会显示相应的搜索表单。\n\n另一个改进搜索体验的 JavaScript 用途是在网络浏览器中过滤和排序搜索结果。复杂的搜索引擎提供了多个不同的维度来控制返回的结果类型。例如，人们可以在图书馆目录中搜索作者\
  \ `Toni Morrison`，然后选择过滤仅显示带有“文学——历史与批评”（Literature—History and criticism）美国图书馆主题分类的结果。或者人们可能希望先看到最新发布的结果，而不是根据与搜索查询的相关性排序的结果。现代搜索引擎通过向用户提供复选框或下拉菜单来实现这些过滤和排序功能，在选择后更新结果。没有\
  \ JavaScript，更新显示的唯一方法是重新加载整个 Web 页面，这是一个缓慢且令用户困惑的过程。通过 JavaScript，可以动态更新显示的结果，甚至可以在不刷新网页的情况下整合来自\
  \ Web 服务器的新信息。\n\n\n\n\n许多图书馆使用 JavaScript 来记录其网络属性的流量。虽然这本身并不需要具备编程知识，因为大多数分析解决方案都会提供一段简单的代码段供你粘贴到网站的标记中，但\
  \ JavaScript 也可以记录由用户定义的自定义事件。这些事件可以是 JavaScript 可以访问的任何内容，包括用户点击了页面的哪些部分、他们如何与标签页搜索界面交互、是否播放了嵌入视频等。有许多库利用这种能力来发现用户行为，而这些行为反过来可以用于改进用户界面或证明特定服务的受欢迎程度。仅举两个例子：Kirk\
  \ Hess 使用通过 JavaScript 跟踪和广受欢迎的 Google Analytics 服务服务的自定义事件，来了解访问者是如何与伊利诺伊大学厄巴纳-香槟分校的数字图书馆交互的（Hess\
  \ 2012）；而 JavaScript 则被用于记录 Summon 发现层的使用数据（Pattern 2012; Reidsma 2012）。\n\nSummon\
  \ 并没有报告馆员感兴趣的统计数据，因此需要诉诸于 JavaScript。图书馆通常会订阅供应商的 Web 产品，这些产品虽然提供了一些自定义选项，但并未对其所有功能提供细粒度的控制。管理员可能可以在网站的特定部分插入自定义\
  \ HTML，但无法关闭某些功能或构建新功能。幸运的是，如果供应商网站允许插入 JavaScript（通常通过在自定义 HTML 头部或页脚中使用 `<script>`\
  \ 标签），那么自定义的可能性是非常巨大的。由于 JavaScript 专为为修改网页而设计的，可以以许多方式对供应商网站进行修改：可以删除元素、更改页面上的文本、覆盖供应商\
  \ JavaScript 指定的交互，并插入自定义功能。值得注意的是，所有的自定义都存在与原始功能冲突的风险，或者在供应商对其网站引入更改时导致崩溃的风险。\n\
  \n多标签页搜索框、无需刷新页面即可过滤搜索结果、记录自定义分析以及自定义供应商网站，这些只是 JavaScript 在图书馆中常见的用途之几。数据可视化、使用来自第三方的数据、使用存储在\
  \ cookie 中的信息进行个性化等许多功能都可以实现。JavaScript 是 Web 的编程语言，Web 的无处不在使其成为处理几乎任何任务的强大工具。\n\
  \n尽管在历史上 JavaScript 几乎仅用于 Web 浏览器环境，但最近的项目开始为 JavaScript 增加创建动态 HTML 文档之外的能力。Mozilla\
  \ 的 Rhino 项目提供了在 Java 中嵌入 JavaScript 的手段（Mozilla Developer Network 2014）。例如，Rhino\
  \ 被用于使 EQUELLA 数字存储库中的某些函数具有脚本化。尽管 Rhino 是将 JavaScript 引入浏览器之外的早期项目之一，但 Ryan Dahl\
  \ 在 2009 年引入的 `Node.js` 在扩展该语言的用途方面发挥了重要作用（Dahl 2009）。`Node.js` 增加了执行 Web 服务器和文件系统操作的能力，允许程序员编写快速的\
  \ Web 应用程序和命令行工具。还有诸如 Apache Cordova 等项目，允许人们使用传统的 Web 技术（HTML、CSS 和 JavaScript）而不是典型的\
  \ Objective C 或 Java 来编写原生应用（Apache Software Foundation n.d.）。最近，Apple 将其 OS X 桌面操作系统中的程序自动化手段从仅支持其专有的\
  \ AppleScript 语言扩展到包含了 JavaScript（Apple 2014）。虽然 JavaScript 曾经仅在浏览器中使用，但它现在可以创建服务器端应用程序、原生移动应用和桌面软件。这种灵活性意味着该语言是\
  \ Python 和 Ruby 等流行多用途解释型语言的竞争者。\n\n### 优缺点\n\nJavaScript 的极受欢迎是一项幸事，特别是对初学者而言。由于在编写\
  \ JavaScript 时几乎每个问题都已经被遇到过，因此网上存在大量的答案、教程和文档。此外，还有许多流行的 JavaScript 库可以解决常见问题。这些库可以用来帮助你用极少的自有代码快速开发复杂的应用程序。虽然许多编程语言都拥有一套强大的库和在线帮助，但\
  \ JavaScript 是其中最好的之一。\n\nJavaScript 是一种灵活且宽容的语言。像许多高级脚本语言一样，它抽象了处理计算机硬件和担心内存分配的复杂细节。人们可以在不理解底层机器必须如何处理代码的情况下编写代码。总的来说，JavaScript\
  \ 倾向于宽限。当其他语言抛出错误并停止程序运行时，JavaScript 会继续运行，同时提供关于某些地方出现问题的线索。这种仁慈的一个极佳例子是访问尚不存在的对象属性；在一种情况下，许多其他语言会抛出引用错误（reference\
  \ error），但 JavaScript 会返回 `\"undefined\"`。因此，人们不需要复杂的错误处理模式，只需进行简单的测试来检查属性是否存在。该语言还具有灵活的类型系统。类型是编程语言对不同数据分类的方式，例如整数、文本字符串或具有一组特殊属性的复杂对象。JavaScript\
  \ 不强制要求在创建变量时声明其类型，允许变量在其生命周期内更改类型，并且不强制要求声明允许传递给函数的数据类型。\n\n关于强类型或弱类型编程语言哪个更优的争论已经持续了几十年。这一段文字无法解决这一争论。尽管如此，弱类型系统有利于初学者。初学者不需要在在使用语言之前首先积累关于该语言数据结构的详尽知识。此外，用弱类型语言编写的代码可以创建出优雅的界面，接受多种数据类型，并根据给定的内容执行直观的操作。极其受欢迎的\
  \ jQuery 库（将在后文中介绍）极好地利用了这一机会。例如，一旦你用 jQuery 选择了一个 HTML 元素，你就可以用 `css` 方法更改它的外观。该方法可以接受一对字符串——第一个是属性名，第二个是它的值——以便将用层叠样式表（CSS）语言编写的样式应用到该元素。但\
  \ `css` 方法也接受一个属性-值对的对象，允许程序员一次性设置多个样式。如果 JavaScript 是强类型的，`css` 将只能接受两个字符串或一个对象，使得这种直观的界面变得不可能。\n\
  \nJavaScript 对函数的实现特别强大。该语言将函数视为一等对象，这意味着本质上函数可以被动态创建、作为参数传递，或者在其他语言限制程序员只能使用文本字符串或数字等静态数据类型的地方使用。\n\
  \n\n\n\n为了展示 JavaScript 函数的强大，让我们来看看如何将函数作为参数。由于函数具有一等公民的地位，可以将一个函数作为参数传递给另一个函数。例如，考虑一个执行某些数据处理的函数，它可能会成功完成，也可能会遇到错误（可能是因为最初传递了格式错误的数据）。你可以编写一个\
  \ `processData` 函数，它接受两个函数作为参数：一个在处理成功时调用，并将处理后的数据作为参数传递给它；另一个在发生错误时调用，并将错误作为参数传递给它。这提供了极大的灵活性，因为不需要在处理函数内部指定错误或成功行为，而是可以将这些情况抽离到单独的函数，这些函数在程序运行过程中可以有所不同。你可以在一个上下文中调用\
  \ `processData` 并传入一个非常严格的错误处理函数，导致整个程序停止；然后在另一个上下文中再次调用它，此时用户会被通知错误并有机会纠正其输入。\n\
  \n将函数作为参数传递给其他函数是异步编程的常见特性。异步程序并不是按照编写顺序从上到下执行的；相反，某些“事件”可能会任何时间发生并触发相应的代码。异步编程模式在\
  \ Web 和界面设计中很常见。在 JavaScript 中，事件包括从另一个 Web 服务器接收数据或用户交互（如鼠标移动）。例如，每当信息在不刷新的情况下突然出现在网页上时（例如社交网络加载新帖子），都是异步\
  \ JavaScript 代码在起作用。\n\n遗憾的是，JavaScript 并不是一种完美的编程语言。与其他语言不同（其他语言的设计选择可能不符合所有人的口味，但通常有其逻辑依据），JavaScript\
  \ 存在甚至其创建者也承认的缺陷。JavaScript 中最明显的缺陷可能是，所有变量默认都是全局的（Crockford 2008）。全局变量的特点是它在程序的任何地方都可访问，而局部变量的值仅在有限的作用范围内可用。过度使用全局变量会导致\
  \ Bug，因为程序互不连接的各个可能会使用相同的变量名，却期望不同的值。在 JavaScript 中，任何没有使用 `var` 关键字声明的变量都是全局变量。当来自多个作者的多个脚本组合时，全局变量会迅速导致冲突，这在即使是简单的网站上也经常发生。例如，`jQuery`\
  \ 和 `Prototype` 库都创建名为 `$` 的全局变量；如果想在一个页面上同时使用这两个库，必须小心避免冲突，例如使用 `jQuery` 的 `noConflict`\
  \ 方法（jQuery Foundation n.d.-e）。\n\nJavaScript 的类型系统虽然灵活，但也包含一些难以处理的细微差别。JavaScript\
  \ 的比较运算符可以分为双等号和三等号。双等号比较两个变量的值，而三等号同时比较它们的值和类型。如果这听起来很晦涩，那它确实很如此。`==` 和 `===`（以及它们的伴侣\
  \ `!=` 和 `!==`）之间的区别是混乱的根源。编程中另一个由于 JavaScript 类型系统而变得复杂的常见任务是确定特定变量中存储的是什么数据类型。在\
  \ JavaScript 中，变量获取当前值的方式会影响语言的 `typeof` 运算符报告的结果。例如，像 `var s = 'hi'` 这样声明的字符串字面量\
  \ `typeof === 'string'`，而使用 `String` 函数创建的字符串如 `var s = String('hi')` 则 `typeof\
  \ === 'object'`，尽管在几乎所有的用途和目的上这两个变量是等价的。出于原因，对于字符串、数字和正则表达式，最好使用字面量，而不是 JavaScript\
  \ 对应的 `String`、`Number` 和 `RegExp` 构造函数。在此问题之上，`typeof` 对数组报告为 `object`，无论它们是用 `Array`\
  \ 构造函数还是字面量初始化的，这使得检测该数据类型变得困难。\n\n由于 JavaScript 的缺陷相对为人所知，出现了一些实用的程序通过“代码检查”（lint）你的代码来寻找常见问题。这些问题从显而易见的语法错误到技术上正确但可能产生误导或导致意外副作用的代码不一。例如，上述两种缺陷都可以通过代码检查工具缓解，这些工具会警告不要使用双等号或内置构造函数。虽然\
  \ Douglas Crockford 的 `JSLint` 是最初让 JavaScript 检查工具流行的程序，但现如今 `JSHint` 是一个更好的选择。`JSHint`\
  \ 是开源的，拥有大量的配置选项，并有多种版本，如代码编辑器插件和命令行工具（JSHint n.d.）。语言本身也在尝试通过引入新功能来解决其设计中的缺陷，这些功能要么替换旧的、有缺陷的功能，要么帮助程序员编写更安全的代码。2009\
  \ 年在 ECMAScript 5 中引入的严格模式（Strict Mode）通过将不良的实践转换为错误来强制更严格的编码标准，而像 `Array.isArray`\
  \ 这样的特性纠正了上述确定变量类型的问题（ECMA International 2011, 51, 123; Mozilla Developer Network\
  \ n.d.）。\n\n## 环境与设置\n\n文档对象模型（DOM）是一种可视化和描述网页及应用的方式。换句话说，它是网页的抽象。这是文献中用于描述网页和应用的抽象，更重要的是，当浏览器“解释”开发者编写的\
  \ Web 代码时，会使用这种抽象的细节。Web 浏览器的这种功能被称为 DOM 应用程序编程接口（API）（World Wide Web Consortium\
  \ n.d.）。通过 DOM API，JavaScript 等脚本语言可以访问 Web 文的内容。简单来说，DOM 描述了一个树形结构，网页中的所有内容形成一个对象（或节点）的层次结构。Web\
  \ 文档中的一切，无论是标题、按钮还是图像，都构成了文档中的一个对象。某些对象属于其他对象。例如，一段文本可能位于表格单元格下方，因为该单元格是文本所在。对于\
  \ DOM API 而言，一个对象以 HTML 标记开始并结束。\n\n网页或应用看起来像一个单一单元，但它通常是由许多协作工作的部分构建的。用户看到的网站是由这些语言构建并在\
  \ 浏览器中运行的。在某种意义上，Web 浏览器就像计算机中的计算机。这被称为 Web 代码的“客户端”（client side），因为源代码本身实际上运行在用户的计算机上（“客户端”）。构建客户端\
  \ Web 代码的三种主要语言是 HTML、CSS 和 JavaScript。每种语言都应该在客户端执行特定的工作。由于技术的限制、这些语言引入的时间跨度以及粗糙的\
  \ Web 代码，这些语言允许在某种程度上相互交叉。然而，通过将它们限制在本文描述的角色或范围内，开发者将更有机会构建更可靠的页面和应用。\n\nHTML 是这些语言中最古老的，旨在告诉\
  \ Web 浏览器网页中的对象是什么。HTML 标记告诉浏览器页面中什么是标题、什么是段落，以及页面如何划分为逻辑部分。\n\n\n\n另一方面，CSS 的目的是告诉浏览器网页中的对象看起来什么样。CSS\
  \ 非常强大且粒度极细，允许开发者根据对象的任意属性设置颜色、字体、大小甚至可见性。CSS 也可以是可变的，可以根据条件（伪类）设置不同的颜色，例如鼠标指针是否悬停在目标对象上。\n\
  \n本章的主题 `JavaScript` 从根本上与 HTML 和 CSS 有所不同。JavaScript 的目的是告诉浏览器网页中的对象做什么。与 HTML（它仅仅是用于标记对象的语言）或\
  \ CSS（它仅仅是用于描述这些对象外观的语言）不同，JavaScript 是一门真正的编程语言。使用强大的 `DOM API`，JavaScript 可以操作网页文档中的任何节点。在\
  \ `DOM` 中，发生在网页文档内部或作用于网页文档的事务（事件）也是对象。正如前面提到的，由于它采用了异步编程范式，JavaScript 可以监听这些事件并对它们做出响应，甚至以多种方式修改事件本身。近年来，HTML5\
  \ 和 CSS3 为 JavaScript 与 `DOM` 的交互提供了许多令人兴奋的新方法，创造了新的机会，但也要求更灵活的 JavaScript 技能方法（Bengtson\
  \ 2013）。\n\n在它的范围内，JavaScript 极其强大；然而，出于安全考虑，JavaScript 有许多事情是不允许做的。例如，JavaScript\
  \ 不允许从你的本地计算机保存、修改，在大多数情况下甚至加载文件。JavaScript 无法直接发送电子邮件。JavaScript 不能从其所在文档域之外的任何域名加载数据文件（如\
  \ `XML`）（Ruderman 2014）。最后一条规则有两个例外，但一个必须在服务器上激活，另一个是称为 `JSON-P` 的高级技术，它仅适用于 JavaScript\
  \ 对象表示法（`JSON`）数据文件。`JSON-P` 的水平略超出了本章脚本的范围。你需要理解的是，有很多操作超出了 JavaScript 的范围，但可以使用使用端脚本脚本语言（如\
  \ `PHP`、`Python` 或 `Perl`）有效地完成，这些语言在其他章节中都会讨论。\n\n## 向网页文档添加 JavaScript\n\n将 JavaScript\
  \ 添加到网页文档有三种基本方法。最快最简单的两种方法也是最草率的：`内部 JavaScript`（internal JavaScript）和`内联 JavaScript`（inline\
  \ JavaScript）。这两种方法都有使用的时间和场合，特别是当你由于时间限制而不得不稍微草率时，但它们产生的 Web 代码质量较低，并可能为应用程序或页面引入意外问题。第三种也是最好的方法是使用外部\
  \ JavaScript 文件。除了让 JavaScript 与 HTML 和 CSS 的分离更加清晰外，外部 JavaScript 文件像外部 CSS 文件一样可以被多个网页轻松复用。此外，正如我们后面看到的，使用外部\
  \ JavaScript 文件强制开发者采用更健康的技术来处理 `DOM` 中的事件。\n\n### 内部 JavaScript\n\n网页文档中的内部 JavaScript\
  \ 看起来非常内部 CSS。脚本放在 `<script>` 标签内部，如下：\n\n```html\n<script>\ndocument.getElementById('container').innerHTML=\"\
  <p>这是一个段落</p>\";\n</script>\n```\n\n### 内联 JavaScript\n\n内联 JavaScript 利用特殊的标签属性，允许将\
  \ JavaScript 直接放入 HTML 标签中，以便标签定义的 HTML 对象根据事件执行。寻找事件的 JavaScript 被称为 `事件监听器`（event\
  \ listener），而在检测到事件时响应的 JavaScript 被称为 `处理器`（event handler）。这里有一些简单的内联 JavaScript\
  \ 示例：\n\n```html\n<a href=\"#\" onclick=\"changeColor();\">点击此链接更改背景颜色</a></a>></a>\n\
  ```\n\n如果点击链接，`onclick` 属性将调用 `changeColor()` 函数。链接的默认行为通过在 `href` 属性中使用 `#` 来处理。本质上，我们告诉链接在用户点击它时不要去任何地方。这可能看起来非常简单直观。然而，正如稍后描述\
  \ `jQuery` 事件处理器时将进一步讨论的，内联 JavaScript 有一些固有问题。\n\n### 外部 JavaScript\n\n向网页文档添加外部\
  \ JavaScript 文件很容易。本质上，它只需要一个包含 `src` 属性的 `script` 标签，该属性指向一个 JavaScript 文件，如下：\n\
  \n```html\n<script type=\"text/JavaScript\" src=\"js/combined.js\"></script>\n```\n\
  \n## jQuery\n\n正如前面提到的，在它的范围内，JavaScript 极其强大。然而，对于简单任务，它也可能异常地难以处理。考虑到 JavaScript\
  \ 本质上是允许网页中的元素实际执行有用操作的“接线”，而且在大多数情况下，你希望网页代码执行的操作将由用户的操作（事件）驱动，因此将你的 JavaScript\
  \ “挂载”到网页中的对象上是关重要的。这种挂载会在用户对这些元素执行操作时触发 JavaScript，例如用户点击按钮或尝试拖动图像时。然而，使用纯 JavaScript\
  \ 为网页中的元素构建这些事件处理器往往很笨拙。假设我们有一个 `id` 为 `push_this` 的按钮，我们希望在用户点击时激活函数 `doSomething()`。要在\
  \ JavaScript 中为它挂载点击事件，我们的代码看起来如下：\n\n```javascript\ndocument.getElementById('push_this').addEventListener('click',\
  \ function() {doSomething();});\n```\n\n我们也可以直接将函数添加到按钮元素本身的 `onclick` 属性中（内联 JavaScript），如下：\n\
  \n```html\n<button id=\"push_this\" onclick=\"doSomething();\"></button>\n```\n\n\
  然而，这种事件处理方式是草率的，并且会导致难以排错和重写的 Web 代码。最好的总是避免混合脚本和标记语言，因为正如前面提到的，以这种方式运行的所有 JavaScript\
  \ 都在所谓的“全局”作用域中。换句话说，你可能会遇到多个 JavaScript 操作之间相互干扰的问题，因为它们处于同一个作用域。\n\n使用名为 `jQuery`\
  \ 的 JavaScript 库可以改进整个过程。`jQuery` 扩展了 JavaScript 的功能，使客户端脚本更容易编写。`jQuery` 库是免费的，可以从网上下载到你的网站。`jQuery`\
  \ 与其他外部 JavaScript 文件一样，使用 `script` 标签加载到你的页面：\n\n```html\n<script type=\"text/JavaScript\"\
  \ src=\"jquery.js\"></script>\n```\n\n网上还有 jQuery 的托管副本供你引用，而不是使用本地副本。优点是如果这些托管副本位于内容分发网络（CDN），它们加载到用户页面的速度可能比位于你的服务器上更快。缺点是你无法对这些托管副本或其运行的服务器进行控制。这可能会导致意外停机或内容服务器受到攻击引起的问题。我建议使用\
  \ `jQuery` 等库的本地副本。\n\n`jQuery` 增强了 JavaScript 的力量，使客户端脚本变得简单。让我们使用 `jQuery` 为之前看到的按钮添加事件处理器：\n\
  \n```javascript\n$(\"#push_this\").click(function(){ doSomething(); });\n```\n\n\
  \n\n\njQuery 灵活且精确地选择网页中对象的能力，以及轻松地为它们添加事件处理程序，这仅仅是其真实实力的一角。jQuery 在处理跨浏览器兼容性问题方面也表现出色（jQuery\
  \ Foundation n.d.-c）。也就是说，并不是所有浏览器对 JavaScript 的解释方式都是相同的。它们在导航文档对象模型（DOM）中的节点的方式，或者允许\
  \ JavaScript 与 DOM 交互的方式，可能存在细微差异。jQuery 的设计初衷是为了处理浏览器之间的细微差别，以便你的脚本的最终结果对用户来说保持相对的一致。\n\
  \n就像 jQuery 为选择对象提供了简写一样，jQuery 提供了提供了多种函数和方法（在网页元素上执行的命令），供 Web 开发人员使用，以便更快速地完成常见和复杂的任务。例如，在\
  \ Web 文档中可以通过设置位置或更改外边距设置来移动对象。然而，使用 jQuery，你可以直接使用 `.animate()` 方法（jQuery Foundation\
  \ n.d.-b）。对于 AJAX，jQuery 拥有一系列函数可以平滑浏览器支持差异并简化整个过程，如表 4.1 所示（jQuery Foundation n.d.-a）。从更改元素属性到让网页文档对象出现或消失，一切操作都可以使用\
  \ jQuery 方法快速高效地处理。表 4.1 显示了许多 jQuery 方法中的几种。\n\n### 表 4.1 jQuery 方法示例\n\n| 方法 |\
  \ 描述 |\n| :--- | :--- |\n| `.hide()` | 将 HTML 元素设置为 `display:none`，使其消失 |\n| `.show()`\
  \ | 让隐藏的 HTML 元素显示 |\n| `.attr()` | 查找或更改 HTML 元素属性的值 |\n| `.css()` | 查找或更改 HTML\
  \ 元素的 CSS 属性 |\n| `.each()` | 遍历匹配的元素集合 |\n| `.val()` | 用于查找或更改 HTML 元素的值 |\n| `.html()`\
  \ | 设置 HTML 元素的 `innerHTML` 值（允许你重写元素的 HTML） |\n| `.wrap()` | 使用另一个元素包裹所选的 HTML\
  \ 元素 |\n| `.bind()` | 为 HTML 元素添加事件处理程序 |\n\n感谢 jQuery Foundation 提供\n\n使用这些方法，我们可以简化\
  \ JavaScript。以以下使用原生 JavaScript 为识别出的 HTML 对象添加类的方法为例：\n\n```\ndocument.getElementById(\"\
  topHeader\").setAttribute(\"class\", \"green\");\n```\n\n通过采用 jQuery，我们可以使用 jQuery\
  \ 选择器和方法实现相同的功能：\n\n```javascript\n$(\"#topHeader\").attr(\"class\", \"green\");\n\
  ```\n\n为了进一步简化，我们不直接使用通用的 `.attr` 方法，而是使用专门的 `addClass` 方法，如下：\n\n```javascript\n\
  $(\"#topHeader\").addClass(\"green\");\n```\n\n同样，这个让 div 消失的繁琐语句：\n\n```javascript\n\
  document.getElementById(\"hideThis\").setAttribute(\"style\", \"display:none\");\n\
  ```\n\n可以重写为：\n\n```javascript\n$(\"#hideThis\").hide();\n```\n\n要为网页文档中的对象附加事件处理程序，或使用方法影响对象，该对象必须存在于网页文档中。这种语句听起来像是一个显而易见的观察，但事实上，它具有重大的影响，因为浏览器是从上到下读取网页文档的。换句话说，你需要在引用的对象之后将\
  \ JavaScript 方法引入网页文档中。这就是为什么一些开发者长期坚持认为，虽然大多数像 jQuery 这样的库应该添加到网页文档的 `head` 中，但其他\
  \ JavaScript 应该在关闭 `body` 标签之前添加。然而，jQuery 有一种更好的方法来处理这个问题，即使用 `.ready()` 函数（jQuery\
  \ Foundation n.d.-f）。\n\n你可以将网页文档的所有事件处理程序和方法封装在 `.ready()` 函数中（该函数作为事件处理程序附加到文档对象上），如下：\n\
  \n```javascript\n$( document ).ready(function() {\n  $(\"#push_this\").click(function(){\
  \ doSomething(); });\n});\n```\n\n现在，在文档框架就绪之前，事件处理器不会被引用，确保了事件处理程序有可以挂钩的内容。这是一种使用封装函数（称为闭包）来控制\
  \ JavaScript 作用域的通用方法（Johns n.d.）。闭包是一个比这里能提供的更多讨论的话题，但通过控制作用域而不是让脚本处于默认的全局作用域，编写整洁的\
  \ JavaScript 将变得更容易。闭包是处理 JavaScript 中存在的默认全局作用域的一种技术。\n\njQuery 让编写 JavaScript\
  \ 变得更容易，改进了跨浏览器兼容性，并使高质量的客户端脚本成为可能。对于任何希望尽可能无痛地编写高质量 JavaScript 的人来说，jQuery 库都是一个强大的工具。\n\
  \n## 示例\n\n这里有几个简单的脚本供读者入门。为了提供可以直接输入到读者文本编辑器并在 浏览器中测试的示例，JavaScript 在此处显示为内部（在\
  \ `script` 标签之间），而不是单独的文件。读者可以通过将这些示例键入到简单的文本编辑器（如记事本），将其保存为 `.html` 扩展的文件，并在浏览器中打开它们来轻松进行测试。不要使用\
  \ Word 或 Pages 等文字处理程序，因为它们会向网页代码添加特殊字符，可能会导致代码无法运行。读者可以根据自己的意愿复制和使用这些脚本。\n\n###\
  \ 加两个数\n\n此脚本创建了两个提示框，每个框接受一个数字。在答案输出到警示框之前，会将数字相加。在调用提示框时使用 `parseFloat` 将它们通常捕取的字符串（纯文本字符）转换为浮点数，以便可以进行加法。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\" content=\"\
  text/html; charset=UTF-8\">\n<title>Add Two Numbers</title>\n</head>\n<body>\n<script>\n\
  function addThem(first, second)\n{\n      var answer=first+second;\n      alert(\"\
  the answer is: \"+answer);\n}\n\nvar first = parseFloat(prompt(\"Enter Your First\
  \ Number\", 0));\nvar second = parseFloat(prompt(\"Enter Your Second Number\", 0));\n\
  \naddThem(first, second);\n</script>\n</body>\n</html>\n```\n\n### 说出我的名字\n\n以下示例使用提示框接受用户名，然后向警示框中输出个性化消息。再次，脚本块使用函数，它接收提示框中的名称作为参数。然而，在这个示例中，我们将用户输入的“字符串”视为文本字符串，因此不需要像上一个示例那样将此输入转换为数值。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\" content=\"\
  text/html; charset=UTF-8\">\n<title>Say My Name</title>\n</head>\n<body>\n<script>\n\
  function myName(name)\n{\n      var message=\"Hello \"+name+\". We are sending you\
  \ this message from earth orbit. Do not adjust your television!\";\n      alert(message);\n\
  }\n\nvar name = prompt(\"Please Enter Your Name: \");\n\nmyName(name);\n</script>\n\
  </body>\n</html>\n```\n\n### 根据像素大小重定向到移动站点\n\n\n\n\n\n这个简单的脚本结合了屏幕像素宽度和浏览器信息，当检测到移动设备访问网站时，将用户重定向到移动端站点。必须将\
  \ `http://www.google.com` 替换为真实的移动端站点 URL。此脚本包含了一些有趣的特性。`screen.width` 提供 `screen`\
  \ 对象以像素为单位的“宽度”属性。`window.location.assign()` 是从指定 URL 加载新网页文档的方法之一。`navigator.userAgent`\
  \ 是传递给浏览器的关于设备信息的字符串。在脚本中，我们正在这个“用户代理字符串”中搜索“mob”，以查看字符串中是否有指示设备为移动设备的标识，作为测试屏幕尺寸的补充（这对于高分辨率设备尤为重要）。\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\" content=\"\
  text/html; charset=UTF-8\">\n<title>Mobile Redirect</title>\n</head>\n<body>\n<h1>This\
  \ is the desktop Site</h1>\n<p>Here is a paragraph of scintillating information</p>\n\
  <script>\nif (screen.width <= 799 || navigator.userAgent.indexOf('Mob') != -1)\n\
  {\n    window.location.assign(\"http://www.google.com\");\n}\n</script>\n</body>\n\
  </html>\n```\n\n(Bengtson 2012b)\n\n## 为移动设备更改链接目标\n\n此脚本使用了与上述类似的机制。对于分配了 `mobile`\
  \ 类并且在 HTML 中通过 `data-mobile` 属性添加了移动端友好备用目标 URL 的链接，当脚本检测到移动设备访问网站时，链接目标将发生切换。此脚本需要\
  \ `jQuery`。你应该会注意到这段网页代码的两个有趣之处。首先，我们通过第一个 `<script>` 标签从内容分发网络（CDN）向网页文档加载 `jQuery`。这是一个加载外部\
  \ JavaScript 文件的示例，它仅在连接互联网的计算机上有效。其次，与我们的其他示例不同，在这里我们将 JavaScript 添加到网页文档的头部 部分中。正如之前讨论的，我们可以使用\
  \ `jQuery` ready 函数让事件处理程序在网页文档填充完成后后再绑定。\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\">\n\
  <title>Smartlinks Document</title>\n<script src=\"https://code.jquery.com/jquery-2.1.4.min.js\"\
  ></script>\n<script>\n$(document).ready(function(){\n    $(\"a.mobilev\").click(function(e){\n\
  \        e.preventDefault();\n        var linkm=$(this).attr(\"data-mobile\");\n\
  \        var linkr=$(this).attr(\"href\");\n        mobileswitch(linkm, linkr);\n\
  \    });\n    function mobileswitch(linkm, linkr)\n    {\n        if ((screen.width\
  \ <= 799)|(navigator.userAgent.indexOf('Mobile') != -1))\n        {\n          \
  \  window.location = linkm;\n        }\n        else\n        {\n            window.location\
  \ = linkr;\n        }\n    }\n});\n</script>\n</head>\n<body>\n<h1>This is the desktop\
  \ Site</h1>\n<p>Here is a paragraph of scintillating information</p>\n<a class=\"\
  mobilev\" href=\"http://thenormaldestination.com\" data-mobile=\"http://themobiledestination.com\"\
  >Here Is My Link</a>\n</body>\n</html>\n```\n\n(Bengtson 2012a)\n\n## 总结\n\nJavaScript\
  \ 是赋予 Web 许多活力的语言，使其对于图书馆来说不可或缺的。无论你是想为网站增添色彩、创建满足各种需求的复杂 Web 应用，还是构建能够与数据源通信的 Web\
  \ 工具，JavaScript 都能为你提供灵活的工具箱来帮助实现目标。当你在本章基础的基础上进行构建时，请记住，JavaScript 中发现的编程结构和（随着你对它的日益熟悉）面向对象的方法也会出现在其他语言中，包括本书涵盖的许多其他语言。JavaScript\
  \ 为学习这些技能提供了一种实用的方法。\n\n## 参考文献\n\n- Apache Software Foundation. n.d. “Apache Cordova.”\
