  - OpenWrt Wiki: [`wiki.openwrt.org`](http://wiki.openwrt.org)/.\n- 第七届国际混淆 C 代码大赛:\
  \ [`www.ioccc.org/years.html`](http://www.ioccc.org/years.html)#1990.\n- 劣劣 C 大赛:\
