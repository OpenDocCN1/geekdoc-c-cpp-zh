  \ JavaScript 在 Web 中的许多常见应用。涵盖了语言的所有主要结构方面，从在 HTML 中嵌入脚本到操作动态网页。\n\n## 第五章\n\n##\
  \ Perl\n\nRoy Zimmer\n\n### 历史与发展\n\nPerl 由 Larry Wall 在 1987 年创建。Perl 的设计深受 Larry\
  \ 语言学背景的影响，这导致了 Perl 极大的灵活性。与 Perl 相关的有两个缩写：PERL 本身，代表可编程提取与报告语言（Programmable Extraction\
  \ and Reporting Language），反映了它最初的用途；以及 TMTOWTDI：不止有一种种方法可以实现某事。Perl 有时被称为编程语言的瑞士军刀。\n\
  \nPerl 最初编写是为了从系统管理员必须查看的计算机日志文件中提取详细信息。系统管理员是维护计算机及其程序良好运行的人。日志文件包含了计算机在任何给定时刻发生的许多事情的详细记录。\n\
  \n1987 年后的几年里，Perl 发布了几个版本，并在 1994 年以版本 5 “结束”。版本 5 仍在更新中，使用类似 `[5.NN](http://5.NN).n`\
  \ 的版本号，更主要的更新会增加 `NN` 部分。Perl 有一个版本 6，相关工作于 2000 年开始。从设计上讲，版本 6 与 Perl 5 有显著不同且相互独立，尽管你可以使用，但它仍处于进行工作中。本章仅关注\
  \ Perl 5，因为那通常被人们认为是 Perl。指代 Perl 的正确方式仅将首字母 P 大写。\n\n在 Web 早期阶段，Perl 在编写网页交互方面非常流行，那时编写了一些糟糕的\
  \ Perl 代码。这导致了 Perl 是一门应该避免的语言的误解。编写良好的 Perl 代码，就像用几乎任何语言编写的代码一样，可以是运行高效的“优美代码”。\n\
  \n### 用途\n\nPerl 的广泛采用和持续更新让你几乎可以在运行几乎任何操作系统的任何类型的计算机上执行任何事情。Perl 足够应对大型且密集的计算需求，早期就被用于基因测序工作（[`web.stanford.edu/class/gene211/handouts/How_Perl_HGP.html`](https://web.stanford.edu/class/gene211/handouts/How_Perl_HGP.html)）。BBC\
  \ 创建了一个包含追溯到 1920 年代的超过 400 万个广播电视节目的在线数据库，并在其他软件中，在 Web 服务器（[`genome.ch.bbc.co.uk`](http://genome.ch.bbc.co.uk)）上\
  \ Perl。至少有一个主要的 ILS 在后台使用 Perl 并在产品中安装它。\n\n你可以用 Perl 做什么？与数据库（如 Oracle、MySQL 和\
  \ Access）交互。自定义 Web 服务器处理用户与网页之间交互的方式。更改文件中存储的数据类型，例如从逗号分隔值 (CSV) 变为制表符分隔。处理图像（图片），操作并转换文件，从中提取数据。这些都是你在图书馆环境中可能想用\
  \ Perl 完成的一些示例。\n\n### 优缺点\n\nPerl 是一种脚本语言，因此创建和运行程序的过程相对简单快速。鉴于 Perl 中通常有多种方法来实现某事，你可能会遇到难以阅读的代码。在这种情况下，查阅\
  \ Perl 书以获得必要的理解。编写良好的 Perl 代码，就像用几乎任何语言编写的代码一样，可以是运行高效的“优美代码”。\n\nPerl 是一种脚本语言，因此创建和运行程序的过程相对简单快速。鉴于\
  \ Perl 中通常有多种方法来实现某事，你可能会遇到难以阅读的代码。在这种情况下，查阅 Perl 书以获得必要的理解。编写良好的 Perl 代码，就像用几乎任何语言编写的代码一样，可以是运行高效的“优美代码”。\n\
  \nPerl 的强项之一是使用 `regex`。这个奇怪的词是正则表达式的缩写。使用 `regex`，你可以搜索特定的单词、字符序列或（最强大的）字符模式。`regexes`\
  \ 还可以用于替换或删除。正则表达式的起源可以追溯到 1940 年代和 1950 年代的神经科学、逻辑和计算机科学。Perl 的出现是正则表达式在程序员中被广泛理解的主要力量之一。\n\
  \n## 示例\n\nJosie 有一个问题。她的图书馆有一组分类良好的书籍。搜索这些书籍并不总是显示结果。她想修复这个问题，但不知道如何。由于对计算机感兴趣不仅限于使用，Josie\
  \ 在她的旧笔记本电脑上尝试了 Linux。她发现了如何提取和加载 MARC 记录文件，与她的图书馆 ILS 一起工作，但到此为止了。她没有找到为每个条目添加字段的方法以使集合可搜索。她的一个朋友\
  \ Lisa 职业是写软件，曾提到过她有多喜欢使用 Perl，所以 Josie 认为可以尝试一下。在 Lisa 乐意帮助和 Josie 解释 MARC 记录结构之间，他们觉得可以解决这个问题。由于任何运行\
  \ Linux 的计算机通常都带有 Perl，而 Josie 的笔记本电脑也有，这消除了一个障碍。\n\nCPAN，综合档案网络。\n\n在 Josie 的 Linux\
  \ 机器上，Lisa 让她到达命令提示符。在本章中，命令提示符显示为 `>>`（你的提示符可能不同）。然后，为了检查 Perl 是否安装，让 Josie 输入命令\
  \ `perl`。由于结果是 `/usr/bin/perl`，他们就准备好了。否则，如果结果只是命令行提示符，Lisa 就必须为 Josie 安装 Perl。\n\
  \nLisa 决定让 Josie 开始编写一个简单的“你好，世界”的程序。她让 Josie 使用文本编辑器，输入以下两行，并将其保存为 `hello.pl`：\n\
  \n```perl\n#!/usr/bin/perl\n```\n\n\n\n\n\n```perl\nprint \"Hello, world\\n\";\n\
  ```\n\nJosie 学到的一点是，默认情况下，你创建的任何文件或程序只有读取权限。必须显式地赋予文件执行权限才能运行它。然而，在 Windows 上并非如此。Lisa\
  \ 向她展示了实现这一点的方法：\n\n```bash\nchmod 755 hello.pl\n```\n\n并让 Josie 运行了程序：\n\n```bash\n\
  perl hello.pl\n```\n\n它成功了！这就是他们看到的内容：\n\n```text\nHello, world\n```\n\n让我们检查一下\
  \ `hello.pl`。第 1 行告诉 Linux Perl 的安装位置。为什么呢？因为系统中可能安装了多个版本的 Perl（或其他程序），而这一行明确地指示了去哪里找到它。整行代码对于\
  \ Perl 来说都是一个注释，所以 Perl 会忽略它。在这种情况下，操作系统（即 Linux）会“查看”这个注释。第一行（或其变体）在 `Perl` 程序中是必须的。如果你使用\
  \ `Windows`，则可以省略这一行。第 2 行以 `print` 函数开始，后面是包围你想要打印的字符的双引号。末尾的 `\\n` 是什么？它告诉 `print`\
  \ 函数“移动”到下一行的开头。你看到第 2 行末尾的分号了吗？它告诉 `Perl` 第 2 行已完成。有时，当你有一行很长的代码时，将其拆分成多行会更具可读性。`Perl`\
  \ 在遇到分号时才知道那才是该行的真正结束。请注意，运行 `Perl` 程序有多种方法：`perl program.pl` 或者使用 `./program.pl`。\n\
  \n### 从文件中读取数据\n\nLisa 告诉 Josie，她现在将向她展示如何使用 `Perl` 读取文件，于是 Lisa 先让她创建了一个名为 `testinput.file`\
  \ 的文件，并在其中放入了若干行文本。新程序名为 `fileio.pl`，如下所示。左侧的行号仅供参考，不要在程序中输入它们。\n\n```perl\n1 #!/usr/bin/perl\n\
  2 # fileio.pl\n3 use strict;\n4 use autodie;\n5 my $infile = \"testinput.file\"\
  ;\n6 my $record;\n7 open(INFILE, \"<\", $infile);\n8 while ($record = <INFILE>)\n\
  9 {\n10     print $record;\n11 }\n12 close(INFILE);\n```\n\nJosie 创建了程序，Lisa 解释了它的工作原理。我们已经知道第\
  \ 1 行了——这是一个标准。第 2 行是一个包含程序名的注释。将程序名作为前几行之一是一个良好的习惯，通常还会带有对程序功能的简短说明。`#` 字符之后行内的任何内容都会被视为注释并被\
  \ `Perl` 忽略。稍后我们会来看第 3 行和第 4 行的作用。第 5 行定义了要读取的文件名；它将双引号内的文件名放入变量 `$infile` 中。在 `Perl`\
  \ 中，简单变量被称为标量（scalars），它们始终以 `$` 作为变量名的开头。第 6 行声明了一个变量但保持其为空，也就是说，初始没有没有存储任何数据。第\
  \ 7 行准备读取文件。`INFILE` 是文件句柄（将其想象为程序和文件之间的连接器），应该始终全部大写。\n\n接下来的部分 `<` 指定了我们想对这个文件做什么。把它想象成一个箭头，指示文件数据移动的方向；在这种情况下，由于我们正在读取文件，数据从文件名流向文件句柄。在第\
  \ 8 行，我们开始了文件读取活动的循环。`$record = <INFILE>` 读取输入文件的一行并将该数据放入变量 `$record` 中。文件句柄必须在\
  \ `< >` 尖括号内。这一行以 `while` 单词开头，它需要一个条件语句，且该语句必须括在括号中。这看起来不像条件（比如 `if` 这样 . . . ），确实如此，但它是隐含的。当\
  \ `$record` 接收到数据时，`($record = <INFILE>)` 被求值为真。因此，第 8 行的意思是：只要（或当）`$record` 获取数据的条件为真，就执行后续大括号\
  \ `{ }` 中的任何内容。大括号内可以包含任意数量要运行的代码。只要我们成功读取了数据，这些代码就会执行。当我们到达结束的 `}` 时，我们返回 `while`\
  \ 部分并尝试从文件中读取另一行。当整个文件都被读取完毕——该 `while` 条件求值为假（没有更多数据）——我们就退出循环，并跳转到结束的 `}` 之后的程序行，即第\
  \ 12 行。现在我们完成了并关闭输入文件。`while` 循环内部的代码是一行将我们的输入记录打印到屏幕上的代码。\n\n但等一下，我们忘记了一些什么……真的吗？记得在\
  \ `hello.pl` 的 `print` 语句中，我们在打印内容末尾有一个 `\\n` 吗？为什么我们在这里没有呢？当 `Perl` 读取一行时，`\\n`\
  \ 已经包含在文件中了。因此，我们不需要在 `print` 语句中添加它。\n\n现在我们来看第 3 行和第 4 行。每当我们看到 `use some_module`\
  \ 这种结构时，我们就在调用或包含位于你计算机其他处的指定模块代码。这些模块包含了我们可以在程序中使用（包含）的大量代码，但我们实际上不需要看到它们。这让我们的程序保持简单。那么\
  \ `use strict` 是什么？把它想象成程序的校对。它无法捕捉所有问题，但如果你有语法错误或使用了未定义的变量，它会报错。`use strict` 是可选的，但我建议你始终使用它，因为它会让你的生活更轻松。如果你输入了程序并运行它且没有任何错误，那太好了。编辑你的程序，通过在开头注释掉第\
  \ 5 行。现在再次运行程序。`use strict` 会注意到有一个未定义的变量并不允许运行程序。现在也注释掉第 3 行，消除该检查，再次尝试运行程序。\n\n\
  `use autodie` 不是强制要求的，但也非常建议。如果没有它，当与文件交互（`open`、`read`、`write`、`close`）出现问题时，你会得到比更有用的错误信息。注意：如果你尝试运行此程序时在第\
  \ 4 行报错，说明你使用的是内置 `autodie` 的旧版本 `Perl`。在这种情况下，注释掉第 4 行程序即可正常工作。\n\n### 从一个文件读取并写入另一个文件\n\
  \nLisa 让 Josie 修改了 `fileio.pl` 程序。更改如下：\n\n```perl\n1 #!/usr/bin/perl\n2 # fileio.pl\n\
  3 use strict;\n4 use autodie;\n5 my $infile = \"testinput.file\";\n6 my $outfile\
  \ = \"testoutput.file\"; # 新增\n7 my ($record, $linectr, $message); # 新增\n8 open(OUTFILE,\
  \ \">\", $outfile); # 新增\n9 open(INFILE, \"<\", $infile);\n10 while ($record = <INFILE>)\n\
  11 {\n12     print OUTFILE $record; # 修改\n13      $linectr++; # 新增\n14 }\n15 close(INFILE);\n\
  16 close(OUTFILE); # 新增\n17 print \"Copied $linectr\". # 另外两个新行\n18 \"records from\
  \ $infile to $outfile \\n\";\n```\n\n\n\n\n第 6 行没有给我们展示任何新内容，因为它和第 5 行非常相似。第 7 行定义了三个变量。它们被分组在括号内，形成了一个列表。之前只有一个项目时，是不需要括号的。这种方式声明多个变量更加紧凑，而且仍然易于阅读。第\
  \ 8 行是新的，而且和我们之前知道的第 9 行很像。注意，角括号 `>` 现在指向右侧。这表示我们的程序将把内容写入由 `$outfile` 指向的文件。\n\
  \n第 12 行发生了变化。当你使用 `print “this text”` 时，这两个单词将回显到你的屏幕上。这是因为你没有指定打印到哪里，所以屏幕是默认输出地。我们把文件句柄\
  \ `OUTFILE` 放在了那里，因此此输出将只会发送到输出文件 `$outfile`。第 13 行是新的。`++` 是自增运算符；每当我们到达这一行时，`$linectr`\
  \ 就会加 1。这是 `$linectr = $linectr + 1` 的简写。记得，像 `$record` 一样，我们定义了 `$linectr` 但没有提供初始值。因此，`$record`\
  \ 初始为空字符串 `\"\"`，而 `$linectr` 初始为 0。为什么呢？取决于上下文。当 Perl 看到我们第一次使用 `$record` 是为了字符串值时，它会确保我们从\
  \ `$record = “”` 开始。Perl 看到我们第一次使用 `$linectr` 是数值，因此在程序使用它之前，它给它了一个值 0。虽然这看起来可能很困惑，但它非常像口语。我们经常在不意识地根据上下文确定一个单词的用法或含义——这只是自然发生的。这是\
  \ Perl 让使用变得更易用的方面之一。如果你想确保一个变量是特定类型，请用预期的类型值初始化它。\n\n为什么第 12 行和第 13 行有缩进？这让我们更容易看到这两行被包含在\
  \ `while` 循环中。在像这样简单的程序中，缩进可能并不重要，但在更大更复杂的程序中，这确实是一个巨大的帮助。Perl 并不不在乎行是否缩进，但这是我们应该在程序中养成的习惯。\n\
  \n第 16 行没有给我们展示任何新内容。第 17 行和第 18 行对于 Perl 来说是同一行。它被拆分开是为了展示你可以这样做，这通常是为了让长代码行更具可读性。当然，你可以忽略第\
  \ 17 行的注释——那里的代码以字符 `.` 结尾。这是字符串连接运算符。它将它之前的字符串和随后的字符串连接在一起。你会发现变量名在字符串内部。由于我们在字符串周围使用了双引号，变量的值会被替换到该字符串中。如果我们相反在字符串周围使用单引号，那么该值替换就不会发生；相反，我们得到的将完全是\
  \ `$somevariable` 本身，连美元符号在内。\n\n当 Josie 运行程序时，它显示复制的行数与输入文件中的一样。Lisa 让她对输入和输出文件运行了\
  \ `cat` 命令，他们看到两个文件是完全相同的。成功了！\n\n### 一个简单的正则表达式示例\n\nLisa 想给给 Josie 展示一个使用正则表达式的简单示例，所以她让她在\
  \ `testinput.file` 中添加了这一行，如下所示：`Floyd was a loyal`。然后她让 Josie 修改 `fileio.pl` 中\
  \ `while` 循环内部的代码，使其看起来像这样：\n\n```perl\n{\n  if ($record =~ m/loyal/) {\n    print\
  \ OUTFILE $record;\n    $linectr++;\n  }\n}\n```\n\n这里有一行新代码显示了 `if` 语句：`if (condition)`。当括号\
  \ `()` 内的条件求值为真（true）时，执行后续大括号 `{}` 中的代码。这看起来很正常，但那里有一些奇怪的字符。`=~` 表示正则表达式，或正则。`/`\
  \ 字符包围着正则表达式；前面的 `m` 表示我们正尝试用 `$record` 中的内容匹配该正则表达式。在这种情况下，这是一个简单的正则，用于检查单词 `loyal`\
  \ 是否在 `$record` 中。Josie 运行程序，看到复制到输出文件的唯一行是带有单词的 `Floyd is a loyal` 这一行。\n\n“还有一件事要给你看的是正则替换，”Lisa\
  \ 说，并让 Josie 在 `fileio.pl` 的 `print` 语句之前添加一行：\n\n```perl\n$record =~ s/loy/FAP/;\n\
  print OUTFILE $record;\n```\n\n当 Josie 现在再次运行程序时，`testoutput.file` 中再次有一行输出，但它看起来不同了：`FFAPd\
  \ a loyal`。Josie 得出正则表达式开头的 `s` 意味着替换，将 `loy` 替换为 `FAP`。但她问为什么 `loyal` 还是 `loyal`。Lisa\
  \ 解释说，除非在正则表达式最后有 `g`（全局或所有匹配替换），否则第一个匹配项会被替换；在这种情况下，正则表达式看起来像这样：`s/loy/FAP/g`。\n\
  \n### 读取 MARC 文件\n\n根据 Josie 告诉 Lisa 关于 MARC 文件的信息，Lisa 设计了一个程序来读取 MARC 文件并以人类可读的格式显示数据。创建一个名为\
  \ `marcread.pl` 的文件，如下：\n\n```perl\n#!/usr/bin/perl\n### marcread.pl 为 MARC 文件提供人类可读输出\n\
  use strict;\nuse warnings;\n$/ = \"\\x1d\"; # 这个字符表示 MARC 记录的结束\nmy ($baseaddr,\
  \ $strptr);\nmy @marines;\nmy $marcfile = \"test..\";\nopen(MARCFILE, \"<\", $marcfile)\
  \ or die $!;\nmy $recnum = 0;\nwhile ($record = <MARCFILE>) {\n  chomp($record);\n\
  \  my $tagid = substr($record, 0, 3);\n  my $taglen = substr($record, 3, 2);\n \
  \ my $offset = substr($record, 5, 4);\n  my $tagdata = substr($record, 9);\n  printf(\"\
  %s%s:%s:%s\\n\", $tagid, $taglen, $offset, $tagdata);\n  $recnum++;\n}\nclose(MARCFILE);\n\
  print \"读取了 $recnum 条记录\\n\";\n```\n\n\n\n\n“记住，数组是变量的组，”Lisa 说道，“变量的名字总是以 `$` 符号开头的；这样我们才知道它是一个变量。所以，我们通过\
  \ `$encyclopedia[n]` 来指代数组中的第 n 个变量（在这个例子中是第 n 卷），实际上是 `nth + 1` 卷，而 `@encyclopedia`\
  \ 则将整个数组作为一个整体，即整本百科全书。”\n\n在思考了一会儿后，Josie 示意 Lisa 继续说下去。\n\n“好的。第 10 行是将值放入这个数组的行，我觉得这非常酷，”Lisa\
  \ 继续说道，“这与我们之前看到的 `while` 循环不同，我们可以一次性读取整个文件。数组中的每个变量（或元素）都保存着我们读取的文件中的某行。除非你正在读取一个非常大的文件，否则这种方法非常好用！在第\
  \ 12 行，我们设置了 `$recnum`，以便使用它来引用数组 `@marclines` 中的每条元素记录，并且我们在第 13 行的 `while` 循环中设置了它。”\n\
  \n“等等，这太奇怪了，”Josie 打断道，“我们怎么能把数值变量和一个数组进行比较呢？这就像拿苹果比橘子。”\n\n“啊，”Lisa 回答道上下文。Perl\
  \ 知道 `$recnum` 是数字，所以它会以数值的方式来看数组 `@marclines`。它是如何做到的？它知道 `@marclines` 中元素（或变量）的数量。所以\
  \ `while` 循环从 `$recnum` 为 0 开始，并不断访问 `@marclines` 中的变量，直到达到第 n 个元素。然而，第 n 个元素并不存在，因为数组元素是从\
  \ 0 到 `n – 1`！在那个点上，我们完成了 `while` 循环；没有更多数据需要处理了。”\n\n第 15–16 行大部分非常相似。看第 16 行，我们看到\
  \ `substr` 是子字符串函数，奇奇的是，它会复制字符串（字符）的一部分。从数组 `@marclines` 中由当前 `$recnum` 值所指的记录中，提取从位置\
  \ 12 开始、总共 5 个字符的字符副本。由于我们提取的是数字字符，并对其进行数学运算（即 `– 1` 部分），Perl 将这五个数字转换为一个数字并减去 1，然后将该值放入\
  \ `$baseaddr`。第 15 行使用 `print-with-formatting` 函数输出 MARC 记录的引导部分。`printf` 函数在双引号内指定了格式。你也可以在里面放入字面文本，比如\
  \ `LDR:`，并使用像 `\\n` 这样的字符。双引号内以 `%` 开头的某些字符组合表示一种格式。在这种情况下，它是非常基础的 `%s`，意味着它将处理一个未指定长度的字符串而不进行任何额外的格式化。双引号后面是一个逗号，后面是左格式中要替换的变量/值列表。这里我们有一个值，即该子字符串操作的结果，当\
  \ `printf` 执行时，它会替换 `%s`。\n\n下一行感兴趣的行是第 `25\\.` 行。哎呀！让我们逐个查看这个正则表达式。我们知道会发生替换，因为它以\
  \ `s` 开头。它首先查找的是十六进制数。它实际上是用于指示或分隔 MARC 格式中子字段的不可打印字符。然后我们查看方括号 `[ ]` 内部的内容，这表示我们正在寻找任何小写字母或任何单个数字。由于子字段是这样标识的，我们知道这个正则表达式在寻找子字段的开头。现在我们到了\
  \ `/` 正则表达式分隔符，所以后面的是我们要替换的内容。这是一个空格、`|` 字符、`$&` 和另一个空格。`|` 字符控制正则表达式的行为（我们稍后会展示），而我们想要那个字符本身，所以通过在它前面加上\
  \ `\\` 字符对其进行转义。`$&` 是那些保留的 Perl 变量之一，它包含了匹配到的内容（如果有的话）。这就是我们在 `s(ubstitution)`\
  \ 正则表达式的第一部分所做的：寻找或匹配某些内容。上面的插图有助于理解这一点。在这个例子中，让我们使用 `!` 使情况更清晰地显示那个子字段分隔符字符 `\\\
  x1f`。示例输入：`!cPutnams`。示例输出：`|!c Putnams`。这种格式应用于所有子字段，因为正则表达式以 `g` 结尾。\n\n第 27 行看起来可能更容易理解。在这里，我们正在寻找子字段和字段分隔符并移除所有它们。正则表达式第一部分中的\
  \ `|` 匹配 `\\x1f` 或 `\\x1e` 字符，并在遇到时将其移除。示例输入：`\\|!c Putnams`。示例输出：`|c Putnams`。显然更易读了。\n\
  \n第 29 行仅当行首的空格后面跟着 `|` 字符时才删除它。我们知道这一行是在进行替换，因为那个 `s` 是它的开头。脱字符符号 `^`（或帽子）表示从开头开始匹配。它寻找开头的任意两个字符（由\
  \ `..` 表示），然后是一个空格，然后是 `|` 字符。由于我们寻找的是真正的 `|` 字符，我们通过在它前面加上 `\\` 来进行转义。\n\nJosie\
  \ 感到很困惑，“看起来就像任何字符部分都进入了 `$tagdata`，但我不确定是否正确。而且那个 `$1` 是从哪里来的？它不是程序的一部分。”\n\n“好问题，”Lisa\
  \ 回答道，“任何 `$n` 变量（n 是单个数字）都是正则表达式的内部变量或保留变量，并且在该语境下使用。”\n\n\n\n\n\n# # marcunread.pl\
  \ 仅适用于 BIB 记录\n\n```perl\nuse strict;\nuse autodie;\n\nmy $infile = \"test.read\"\
  ;\nmy $outfile = \"test.unread\";\n\nmy ($line, $leader, $tag, $tagsize, $tagcontents,\
  \ $newrec);\nmy $recctr = 0;\nmy (@tags, @tagdata, @taglen);\n\nmy $subfdelim =\
  \ \"\\x1f\"; # MARC 子字段分隔符字符\nmy $fdelim = \"\\x1e\"; # MARC 字段分隔符字符\nmy $recdelim\
  \ = \"\\x1d\"; # MARC 记录结束字符\nopen(OUTFILE, \">\", $outfile);\nopen(INFILE, \"<\"\
  , $infile);\nwhile ($line = <INFILE>)\n{\n    handledataline();\n    # marcread\
  \ 格式的最后一行显示: MARC records read: N\n    if (($line ne '') and ($line !~ /^MARC/))\n\
  \    {\n        $leader = substr($line, 4);\n        $line = <INFILE>;\n       \
  \ handledataline();\n    }\n\n    # 导领之后，获取记录的剩余部分\n    while (($line ne '') and\
  \ ($line !~ /^MARC/))\n    {\n        ($tag, $tagcontents) = ($line =~ /^(\\d{3}).{12}(.+)/);\n\
  \        # 取消子字段的可读性格式化；同时进行指示检查\n        if ($tag ge '010')\n        {\n      \
  \      $tagcontents = substr($tagcontents, 0, 2) . $subfdelim .\n            substr($tagcontents,\
  \ 3, 1) . substr($tagcontents, 5);\n            $tagcontents =~ s/ \\|(.) /$subfdelim$1/g;\n\
  \        }\n        $tagsize = length($tagcontents) + 1;\n\n        # 累积此记录的数据\n\
  \        push @tags, $tag;\n        push @tagdata, $tagcontents;\n        push @taglen,\
  \ $tagsize;\n        $line = <INFILE>;\n        handledataline();\n    }\n\n   \
  \ # 如果到达逻辑 MARC 记录结束，则输出\n    if ($line eq '')\n    {\n        $newrec = createnewrec($leader,\
  \ \\@tags, \\@taglen, \\@tagdata);\n        print OUTFILE $newrec;\n        @tags\
  \ = @taglen = @tagdata = ();\n    }\n    if ($line =~ /^MARC/) {last;} # 我们 *已经完成*\n\
  }\nclose(INFILE);\nclose(OUTFILE);\n\nsub handledataline()\n{\n    chomp $line;\n\
  \    $line =~ s/\\t|\\n|\\f|\\r//g; # 移除问题字符\n    $recctr++;\n}\n\nsub createnewrec()\n\
  {\n    my ($leader, $tagid_array, $taglen_array, $tagdata_array) = @_;\n    my @tagids\
  \ = @$tagid_array;\n    my @taglens = @$taglen_array;\n    my @tagdata = @$tagdata_array;\n\
  \    my @offsets;\n    my ($newmarcrec, $directory, $baseaddress, $idx, $reclen);\n\
  \    my $offset = 0;\n\n    # 数据从导领和标签目录之后开始\n    $baseaddress = 24 + (scalar(@tagids)\
  \ * 12) + 1;\n    # 创建数据目录和记录；获取记录长度\n    for ($idx=0; $idx<@tagids; $idx++)\n \
  \   {\n        $offset += $taglens[$idx-1] unless ($idx == 0);\n        $directory\
  \ .= sprintf(\"%3.3d%4.4d%5.5d\", $tagids[$idx], $taglens[$idx], $offset);\n   \
  \ }\n    $newmarcrec = $leader . $directory;\n    for ($idx=0; $idx<@tagids; $idx++)\
  \ {$newmarcrec .= $fdelim . $tagdata[$idx];}\n    $newmarcrec .= $fdelim . $recdelim;\n\
  \    $reclen = length($newmarcrec);\n    # 更新导领；退出并返回新构建的 MARC 记录\n    substr($newmarcrec,\
  \ 0, 5) = sprintf(\"%5.5d\", $reclen);\n    substr($newmarcrec, 12, 5) = sprintf(\"\
  %5.5d\", $baseaddress);\n    return $newmarcrec;\n}\n```\n\n“哇，这里有很多新花样！”Josie 评论道。\n\
  \nLisa 开始解释道。在第 17 行，我们正在从输入文件中读取一行。由于程序中执行操作的逻辑顺序，我们会在多个地方从文件中读取一行。在每次读取行时，我们都会执行几项操作。为了保持程序更短且更易读，这些步骤被移动到了子程序\
  \ `handledataline()` 中。\n\n那么 `handledataline()` 是做什么的呢？第 63 行有 `chomp`，这对我们来说是新的。它通常被使用，就像这里一样，用于移除行尾的\
  \ `\\n`。此外，在第 64 行中，该字符和其他几个其他字符从 `$line` 可能出现的任何地方被移除。这些是制表符 `\\t`、我们的朋友换行符 `\\\
  n`、分页符 `\\f` 以及以及回车符 `\\r`。这些都是我们不希望出现在 MARC 记录中的字符。\n\n“等一下！”Josie 打断道，“我以为那些是变量。”\n\
  \n Lisa 微笑道，“看看这些变量：`$infile`、`$outfile`、`$line`、`$leader`、`$tag`、`$tagsize`、`$tagcontents`、`$newrec`、`$recctr`、`$subfdelim`、`$fdelim`\
  \ 以及 `$recdelim`。在第 21 行的 `if` 语句中，我们使用了 `$line`。在第 23 行，我们赋值给 `$leader`。在第 35 行，`$tagcontents`\
  \ 被更新。在第 42 到 44 行，我们将值推入 `@tags`、`@tagdata` 和 `@taglen`。在第 52 行，`$newrec` 被 `createnewrec($leader,\
  \ \\@tags, \\@taglen, \\@tagdata)` 的结果赋值。”\n\n“`createnewrec` 函数呢？”Josie 问道，“它接收\
  \ `$leader`、`$tagid_array`、`$taglen_array` 和 `$tagdata_array` 作为参数。在内部，它创建了局部数组\
  \ `@tagids`、`@taglens` 和 `@tagdata`。它还使用了像 `$offsets`、`$newmarcrec`、`$directory`、`$baseaddress`、`$idx`、`$reclen`\
  \ 和 `$offset` 这样的变量。”\n\n在第 79 行，`baseaddress` 被计算。在第 81 行的循环中，`$offset` 被更新并构建了\
  \ `$directory`。在第 86 行，`newmarcrec` 由 `$leader` 和 `$directory` 创建。在第 87 行，`newmarcrec`\
  \ 被扩展。在第 89 行，`reclen` 被设置。最后，第 91 和 92 行使用 `substr` 更新 `$newmarcrec`，然后它被 `return`。”\n\
  \n\n\n\n\n现在让我们回到第 52 行并解释它的功能。这里调用了子程序 `createnewrec`；同时，向它发送了一些数据，它也回传了一些数据。具体来说，它接收了领域数据、所有的字段标识符（如\
  \ 245 等）、每个字段的长度以及每个字段的数据。`createnewrec` 将这些数据组装成 `MARC` 记录，并将其发送（或返回）到调用它的地方。为了让子程序能够正确接收数组，在调用子程序时，数组名称前面应该有一个\
  \ `\\`。\n\n在第 70 行中，我们接收了发送给 `createnewrec` 的数据项。当子程序接收到数据项时，它们都包含在一个名为 `@_` 的单一特殊变量中，并且必须将它们分离出来。\n\
  \nJosie 不得不打断：“数组是传入的，但现在它们变成变量了吗？”\n\n“某种程度上是，”Lisa 解释道，“把它想象成某种文件句柄。注意在第 71–73\
  \ 行中，我们确保可以像往常一样作为数组来引用它们。这是处理这种情况的一种方法，可以让工作变得更简单。”\n\n第 83 行对于程序代码来说有点像英语。只要 `unless`\
  \ 单词右侧的部分求值为“假”，就执行左侧的操作。`+=` 运算符将其右侧的内容加到左侧变量上。如你所见，你可以将表达式放在方括号 `[ ]` 中，这用于引用数组元素\
  \ `n`，只要该表达式的结果是一个整数即可。\n\nLisa 向 Josie 展示了如何在运行 Perl 程序之前检查其句法情况：`perl –cw program.pl`。\n\
  \nJosie 这样做了，并按照指示纠正了几处拼写错误。然后她编辑了 `test.read` 文件，插入了一个 650 字段以获得更好的搜索结果。由于这是 `marcread`\
  \ 格式，Lisa 让她这样操作：`650:1111:11111: 0|aFreddie the Pig (Fictitious character) |v Fiction.`\n\
  \n那些在 650 之后的数字是带有无意义值的占位符；`marcunread.pl` 在将数据转换回 `MARC` 格式时，会计算该字段的长度和偏移量。Josie\
  \ 运行了 `marcunread.pl` 并导入了生成的 `MARC` 文件。她尝试了搜索并成功了！她现在可以通过一次搜索找到所有这些书。有人看到我在这个程序中犯的错误了吗？它并没有阻止程序的正常运行。提示：这涉及到\
  \ `$recctr`。\n\n### 结语\n\n为了简单且紧凑地展示这些程序，它们以精简的形式呈现。我们鼓励使用更多的空行来划分代码区域，以便于理解。此外，还省略了错误检查，特别是\
  \ `marcunread.pl`。该程序及其他程序的更完整版本可以在作者的网页上找到（[`homepages.wmich.edu/~zimmer/marc_index.html`](http://homepages.wmich.edu/~zimmer/marc_index.html)）。下方显示的所有链接均于\
  \ 2015 年 12 月。\n\n## 总结\n\n从简单的 Perl 程序开始，随着你技能的增长，按照自己的速度逐渐转向更复杂的程序。Perl 可以为你隐式地处理编程细节，让你专注于正尝试实现的任务。程序可以用功能性直观且易读的风格编写，也可以用紧凑且凑的风格编写。本章的示例展示了如何处理\
  \ `MARC` 数据，由你自己完成所有的“重活”。或者，你可以从 CPAN 上几十个与 `MARC` 相关的模块中让任务变得更容易。使用 Perl 你可以做任何事情。很有可能已经有人写好了能让你的任务变得简单的模块。\n\
