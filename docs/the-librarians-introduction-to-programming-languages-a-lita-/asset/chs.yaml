- "# 图书员编程语言入门指南：LITA 指南\n\n\n\n![](img/cover.jpeg)\n\n\n\nMarta Mestrovic Deyrup\
  \ 博士，采编编辑，图书馆信息与技术协会（美国图书馆协会分会）\n\n图书馆信息与技术协会 (LITA) 指南为图书馆和 IT 专家提供与前沿技术相关的信息和指导。\n\
  \n这些指南由技术领域的顶尖人士撰写，深受渴望学习新技能或紧跟今日最佳实践的图书员的推崇。\n\n系列中的每本书从构思之初就由 LITA 进行编辑监督，并由对书籍专业领域具有特殊专业知识的\
  \ LITA 成员进行评审。\n\n图书馆与信息技术协会成立于 1966 年，是美国图书馆协会 (ALA) 的分支，为其成员以及整个图书馆和信息科学社区提供了一个讨论论坛、一个学习环境以及一项关于图书馆和信息科学领域自动化和技术系统设计、开发和实施的行动计划。\n\
  \n2007 年至 2015 年间，Neal-Schuman 和 ALA 出版了约 25 份 LITA 指南。Rowman & Littlefield 从 2015\
  \ 年底开始接手该系列的出版。由 Rowman & Littlefield 出版的系列书籍包括：\n\n* 平面媒体的数字化：原理与实践\n\nBeth Thomsett-Scott\
  \ 编辑\n\nRowman & Littlefield\nLanham • Boulder • 纽约 • 伦敦\n\n由 Rowman & Littlefield\
  \ 出版\nRowman & Littlefield Publishing Group, Inc. 全资子公司\n4501 Forbes Boulevard,\
  \ Suite 200, Lanham, Maryland 20706\n[www.rowman.com](http://www.rowman.com)\nUnit\
  \ A, Whitacre Mews, 26-34 Stannary Street, London SE11 4AB\n\n\n\n\n\n《图书员编程语言入门》献给所有想要学习编程但认为自己缺乏基础知识无法开始的图书员。我希望这本书能填补这一空白。\n\
  \n我也将它献给我了不起的女儿 Carol Scott，她在生活的起起伏中坚持不懈；以及 David Scott，我是这个世界带给我们的旅程中最好的朋友。\n\n\
  愿大家平安。\n\n\n## 致谢\n\n这本书的诞生是通过一些曲折的事件实现的。原编辑需要退出，而 LITA 指南系列的编辑 Marta Deyrup 将我与\
  \ Ron T. Brown 结了联系，我们同意共同担任编辑。在书籍的最初构思获得批准后，Ron 获得了一份行业工作并接受了。这个新职位让 Ron 忙得无法继续参与书籍。此时，几位原作者有其他安排，我不得不招募替代者。\n\
  \n在介绍上述之后，我想感谢 Marta Deyrup 对我的信任，感谢 Ron 对书籍构思的指导，感谢在近两年时间里坚持的所有原作者。非常感谢在最后时刻加入并提供精彩章节的作者。\n\
  \n## 前言\n\n《图书员编程语言入门》概述了图书馆中使用的流行的编程语言，包括实际示例，帮助图书员度过“我不行”的阶段。我们从 Python、Ruby 和\
  \ JavaScript 开始，它们被认为可读性最高，因此相对容易学习。接下来是 Perl、PHP 和 SQL，因为它们稍微复杂，但非常有用。C、C# 和 Java\
  \ 完成了本书，作为编译型语言，它们有自己的优缺点，但在图书馆中有许多用途。\n\n虽然有很多致力于教授编程的书籍和网站，但很少有作品涉及多种语言或提供图书馆特定的示例。本书的读者群体包括管理员、从业人员、学生、教育者以及对计算机编程感兴趣的终身学习者。\n\
  \n本书旨在提供每种语言的基础工作知识、图书馆中的应用示例、图书员何时发现每种语言实用的想法，以及用于实践的小示例。还提供了供额外阅读的推荐资源。贡献的形式允许通过更丰富的经验涵盖更广泛的语言。\n\
  \n我代表全体贡献者，愿所有读者在个人和专业领域创建新程序，或与程序员合作实施新的或重新设计的技术时一切好运。\n\n## 1 引言\n\nDean Walton\n\
  \n### 历史与发展\n\n编程从起源到今天已经走了很远的路。我第一次接触编程是使用孔带，即用于传输变化的股票价格的纸带。对于熟悉 60 年代经典情景剧《亚当斯家族》的人来说，Gomez\
  \ 总是盯着他的纸带看。下一个重大进展是孔卡和 `Fortran`。随着个人电脑的出现，编程成为大众大众的一种爱好。\n\n\n\n\n计算机现在是图书员工作中不可或缺的一部分。由于许多计算机程序允许用户自定义并运行短小的程序段落（称为“脚本”），如果图书员不学习一些基础编程，他们可能会错过图书馆世界的一个巨大领域。例如，如果你有预算数据，可以进行重复分析以计算各种场景。有了借阅数据，你可以进行重复分析，以检查特定人群对物品的使用情况、与学期相关的索号范围使用情况以及其他重要的关系。编程允许人们快速地完成复杂的重复性任务，并允许在参数变化时快速修改。\n\
  \n那么，没有编程经验的图书员应该从何开始呢？首先，让我们理解“程序”（program）和“程序代码”（program code）这两个术语是相当互换的。程序是一套完整的独立程序代码。程序代码通常指泛指的代码，而不是一个完整的程序。编程是创建程序的动作，本质上是编写组成程序的代码。代码是我们人类使用的类英语的指令，用于告诉计算机要做什么。你可能听过程序员（programmers）或代码编写员（coders）。这些本质上是一回事：即编写（或编码）程序的人。有人可能会说，现在学习编程是小孩子的游戏。有大量的书籍、在线视频和面向游戏的网站可以提供帮助。其中，`Code.org`\
  \ 是一个基础教学的绝佳网站；它无论使用何种编程语言，都教授编程逻辑。`Code.org` 为小学生提供了教程和内容，让他们学习编程的构建块。当然，成人也可以从该网站学习，并以有趣的方式进行。如果你想学习更高级的内容，YouTube\
  \ 只需点击一下即可，那里有丰富的分步操作视频。不过，必须留意以确保教学质量。本书章节作者提供的资源以及本书的“附加资源”部分将引导你在通往编程之旅的途中找到优质资源。\n\
  \n## 基础知识\n\n区分“与计算机交互”和“在计算机上编程”是非常重要的。对于许多包括图书员在内的成年人来说，第一步是练习交互技能。一个很好的入门方法是找出一台旧的台式机电脑或笔记本电脑，并在上面加载\
  \ `Linux`。操作系统的 `Ubuntu Linux` 的最新版本在加载后将类似于 Windows 或 Apple 操作系统。然而，在 `Linux` 中，仍然可以使用鼠标驱动的图形用户界面，并进入\
  \ `Terminal`（`X-terminal`），在那里运行计算机是命令行驱动的。我的意思是，用户可以在计算机上相应的行上输入命令，因此名为“命令行”。鼠标和它的光标消失了。为了在计算机上移动，用户使用方向键。在\
  \ Windows 机器上，你可以同时按住 `Windows` 键（通常在键盘的左下角）并按住 `X` 键。这将弹出一个命令行菜单，以及具有管理员权限的命令行。\n\
  \n命令行中有几个重要的任务需要学习。为了在这个环境中运行，用户必须学会如何在不同的文件夹或目录之间来回移动；在文件夹或目录内移动、复制或删除内容；以及从其他来源查找、下载并解压程序。掌握这一系列任务将对图书员大有益。一旦实现了这些目标，加载特定编程语言所需的脚本集或库将变得容易得多。\n\
  \n这一切的起点是路径（图 1.1）。这让用户能够知道所有内容在操作系统文件结构中的位置。路径遵循一种类比于“树”的术语。将树与大地连接、将树干与树连接起来的结构是“根”。路径的核心是根目录。根结构包含了允许计算机运行的命令。在根目录中删除任何文件都将不起作用；因此，根目录通常受到保护。在这种情况下，保护意味着需要密码来更改根目录的部分。如果你是计算机的管理员（也就是说，它是你的电脑或你负责它），那么你应该知道根密码。根密码的创建通常发生在向你的计算机加载操作系统时。\n\
  \n![](img/Figure_1.1.jpg)\n\n图 1.1. 计算机操作系统中文件夹或目录的通用路径结构。\n\n用户可以直接从根目录添加或删除文件夹，就像树可以长出新树枝，或者园丁可以修剪掉树枝一样。但请记住，如果你剪掉了根，树就会死。一个很好的问题是，你如何知道你的树路径路径哪些分支？你可以在命令行中输入\
  \ `dir`，并看到你所在位置包含的文件夹列表。要进入其中一个文件夹，你输入 `cd`（“change directory”的缩写）以及目录名称。甚至有一种更简单的方法回到你刚才所在地。通过在命令行输入单个点\
  \ `.` 并按回车，你请求计算机带你回到上一个文件夹。如果你输入两个点 `..`，你请求计算机带你回到所有目录的起点，回到根目录。\n\n许多这些命令还有一些额外功能。一个很好的例子是你如何在\
  \ Windows 中查看文件夹的内容。你可以以列表形式查看，或以带有大小和创建日期详细信息的列表形式查看。新用户将遇到如 `tar`、`grep` 和 `bash`\
  \ 等术语。其中某些概念对于习惯 Windows 或 Mac OS 的人来说是容易理解的。例如，`.tar` 文件是一个压缩文件，类似于压缩过的 Windows\
  \ 文件夹。它需要被解压缩，并将文件夹中的文件移动到适当的文件夹或目录中才能生效。某些文件需要放在现有的文件夹中，而另一些则需要放在用户可能需要创建的新文件夹中。\n\
  \n同样重要的是了解 `Linux` 设计为执行某些任务时无需询问，而对另一些任务进行提问。这防止用户意外破坏计算机的内容。在许多 Linux 系统中，这被定义为\
  \ `SUDO` 用户或超级用户（super user）。实际上发生的是操作系统要求用户验证其确实是计算机管理员，并且这些更改是实际所需的。这有助于防止未经授权的用户进行更改。在\
  \ `Linux` 中，用户有能力查看操作系统并几乎可以进行他们要求的任何更改，无论这些更改是否会导致计算机停止。这意味着管理员拥有巨大的权力，而且在搞乱事情方面比\
  \ Windows 用户拥有更大的权力。\n\n\n\n\n一个简单而有趣的编程挑战示例是类似于相扑机器人比赛。在这种比赛中，两个配备了运动检测器和线条追踪传感器的小型机器人相互竞争，试图将对方推出一个直径三英尺的圆环。这些机器人配有驱动两个轮子的电机，当开启并放置在场地上时，它们会寻找彼此并尝试将对方推出环外。程序员需要编写一个脚本，根据检测到另一个机器人的情况，命令机器人何时执行什么操作。这种编程可以非常简单，它是观察应用编程问题——以及机器人技术的一种方法。再次，定义任务的逻辑对于任何计算机语言来说可能都是相同的，只是表达方式不同。\n\
  \n## 入门\n\n今天，花费二十到八十美元购买一本关于 Arduino、树莓派（Raspberry Pi）、Edison 或 BeagleBone ([`beagleboard.org/bone`](http://beagleboard.org/bone))\
  \ 的项目书籍以及配套电脑板，是兼顾乐趣和学习编程的极佳方式。这些都是类型的微控制器。其中一些比较先进，运行起来更像现在的计算机。微控制器是一组可编程的开关，你可以根据需要和时间告诉控制器开启或关闭。你可以打开灯光、电机或功率传感器，并收集和保存数据。通过其中任何一种，你都可以制作有趣的项目，例如一个挂墙电子日历，它可以随着人员更新自己的个人日历而自动更新（Chee\
  \ 2014），或者制作你自己的机器人。\n\n大多数程序可以在文本编辑器中编写，如果你是 Windows 用户，可以使用 `NotePad`。像 Word 这样的程序将无法工作，因为它会添加许多作者不可见的隐藏文本内容，导致程序无法运行。相比之下，`NotePad`\
  \ 不添加这些内容。然而，并不是所有的文本编辑器都是相同的，有些比其他的有用得多。某些文本编辑器可以为程序的不同部分添加颜色编码。`Sublime Text`\
  \ 和 `NotePad++` 是两种被广泛认可和使用的编辑器，前者适用于 Windows 和 Linux 操作系统。它们都为用户提供了行号，以便跟踪程序的各个部分。\n\
  \n几乎任何新用户都会遇到一种“Hello World”脚本。无论某人使用的是 Perl 还是 Python，大多数教程都从这里开始。学生定义一个变量，例如 `X\
  \ = “Hello World.”`。下一步只是命令计算机在屏幕上显示变量（`Print X`）。结果是学生将在他们的电脑屏幕上看到“Hello World”。\n\
  \n随着越来越多的程序变得开源（这意味着编程脚本（代码）公开可用），图书馆员利用编程的力量日益增长。一个极佳的例子是 `R` 程序。`R` 是一个统计包。它由全球的用户编写和修改，他们不断对其进行添加和改进。如果你有一个想让程序执行的任务但没有运行该任务的脚本，你可以编写该脚本，然后使用程序的其他功能（例如对结果绘图）。一旦你写好了脚本，就可以与其他人分享，以便他们从你的工作中获益。在此过程中，可能会有人将你的脚本与其他一系列相关脚本一起打包，作为库添加到程序中。对于\
  \ `QGIS` 这样的程序也是如此，它是一个可以执行复杂空间分析的高级映射程序。用户可以编写短程序，为整个 `QGIS` 程序提供更强大的功能。\n\n##\
  \ 面向对象\n\n这引入了面向对象编程的概念。面向对象编程编写脚本或短程序的过程，这些程序可以插入或从较大的程序中提取，而不会导致大程序或脚本本身出现任何故障。通过面向对象编程，你可以编写一个脚本来执行某个任务。这个脚本就是对象。其他人可以使用你的对象\
  \ `(script)` 并将其插入完全不同的程序中，以执行你为你的程序编写的相同任务。例如，你可以编写一个脚本来获取某些传感器数据，例如来自自动检票传送带的书籍计数数据，然后每天对数据进行汇总，并提供图书馆还书周平均数。另一个人可以复制你的脚本，用于不同的传感器，以提供进入图书馆的周平均人数。无论你是在数书还是数人，创建周平均数的任务是相同的。正是这种“分块编程”导致了非常强大的程序的开发，并允许普通人也做出贡献。其目标是避免因为想添加一个新任务就得重写整个程序（如果想了解更多，请查阅\
  \ PC 杂志对该定义：[http://www.pcmag.com/encyclopedia/term/48238/object]-oriented-programming）。\n\
  \n开始编程的一种有趣方式是研究谜题，让读者被要求通过编写脚本来解决任务。任何人都可以在网上搜索这些示例。也有关于编程谜题的书籍。然而，其中一些书籍包含复杂的谜题，这些谜题似乎被用于公司招聘新程序员的面试过程中。对于初学者来说，不要避开为孩子写的书。Jason\
  \ Briggs 的《Python for Kids》是一个很好的起点，他的网站 ([`jasonrbriggs.com/python-for-kids/puzzles.html`](http://jasonrbriggs.com/python-for-kids/puzzles.html))\
  \ 发布了针对初者的简单编程挑战。\n\n无论如何，初学者学习编程最简单的方法之一就是通过在项目中获得乐趣，让失败成为学习经验而不是问题。再次，Arduino\
  \ 项目非常适合这种活动。我的最佳建议是在旧笔记本电脑上安装 `Linux`（它是免费的），买一个二十元的 Arduino，并在 [Code.org](http://Code.org)\
  \ 上花些时间。\n\n## 图书馆编程\n\n最后，为什么图书馆员应该学习编程？为了收集数据并解决问题，例如在过去十年中，索号范围 `x–y` 内的书籍每年被借阅超过一次的情况；确定借阅与学生成功是否相关；研究图书馆教学的效果——以及许多其他原因。\n\
  \n这引导我们决定学习哪种语言。通常，这取决于学习背后的原因。如果目标是特定任务，语言的选择将受到影响。对于许多图书馆员来说，编写最简洁的代码可能没有编写他人能读懂的代码重要。这就是为什么如\
  \ `Ruby` 和 `Python` 等语言很受欢迎的原因。它们相当简洁，但重要的是，阅读脚本的人可以很容易看出脚本想要做什么。\n\n《计算机协会通讯》杂志上的一份最新报告（Guo\
  \ 2014）指出，`Python` 是 2014 年最受欢迎的语言。这是基于对大学计算机系近期教学课程的分析，表明许多程序现在是用 `Python` 编写的。因此，除非有使用其他语言的理由，否则它可能是入门语言之一。`Python`\
  \ 简单而强大，你可以相当容易地编写有趣的脚本。如果你主要参与网页设计，那么 `Java` 可能是更好的选择。没有必要学习太多的语言。一旦你学会了一种语言并良好掌握了基础编程术语和概念，在需要或想要时学习另一种语言将变得更容易。\n\
  \n\n\n\n\n2015 年，来自电气电子工程师学会（IEEE）的 Stephen Cass 发布了一份他认为的去年最重要的编程语言列表（Cass 2015）。列出的大多数语言也适用于任何对编程感兴趣的图书馆员，但其重要性顺序可能有所不同。该列表的内容也与本书的内容非常吻合。为了方便面向图书馆员的读者群体，下文对列表进行了重新排序，并参考了作者与程序员的个人交流。这些语言以及其他计算机编程语言的定义可以在堪萨斯大学由\
  \ Bill Kinnersley 维护的网站找到，名为“语言列表”（[`people.ku.edu/~nkinners/LangList/Extras/langlist.htm`](http://people.ku.edu/~nkinners/LangList/Extras/langlist.htm)）。\n\
  \n**Python**——一种易于解释的面向对象的语言，因此非常流行。\n\n**Ruby**——一种非常易于解释的编程语言。`Ruby on Rails`\
  \ 提供了一套协议和结构，允许人们使用 `Ruby` 来创建响应式和动态网站。\n\n**PHP**——一种允许从 Web 服务器调用数据并使其在网络浏览器中可见的语言。它是提供基于\
  \ Web 信息（如商店商品目录内容）的主要工具之一。\n\n**Java**——一种面向服务器的语言，同时也是面向对象的，可以在多个平台或计算机类型上运行。它与\
  \ `C` 和 `C++` 共享一些类似的语法。在不同操作系统上运行的能力使其成为一种实用的语言。\n\n**Perl**——最广泛的对象对象编程语言之一。该语言拥有良好的支持。它的主要竞争对手可能是较新的\
  \ `Python`，后者的优势是更容易解释。\n\n**JavaScript**——一种基于客户端（在本地计算机上运行）的语言，在网络浏览器中运行，由浏览器从网上拉取数据。它是网络浏览器功能的内核。`JavaScript`\
  \ 对于任何创建 Web 应用程序的人来说都是一种重要语言。\n\n**SQL**——一种允许对大型数据集进行组织和深度数据挖掘的语言。\n\n**R**——一种为统计分析设计的编程语言。这种语言提供了基础和高级分析，对数据格式具有灵活性，并且相关的脚本可以实现多功能的数据可视化。\n\
  \n其余的流行语言也非常强大，允许程序员用最少的行数编写高效代码。对于无畏者或考虑将编程视为主要工作职责的图书馆员来说，每一种语言都值得学习。然而，对于刚学习编程或仅将编程作为工作一小部分的人来说，这些语言是最难的：`C`、`C++`、`C#`\
  \ 和 `Objective-C`。\n\n### 学习编程的步骤\n\n1. 访问 [Code.org](http://Code.org) 并开始尝试。任何人都可以从这里开始，只需要连接互联网。然而，这只能让人的大脑开始处理编程的抽象概念，并没有提供实现程序的实用部分。\n\
  2. 访问 Ubuntu Linux 网站（[`www.ubuntu.com/download`](http://www.ubuntu.com/download)）并下载最新版本的\
  \ `Ubuntu` `ISO` 文件。这需要一些时间，因为文件可能在 1GB 左右。`ISO` 文件是可启动的，计算机会在启动时加载它。现在，将此文件刻录到\
  \ DVD 或闪存盘。Windows（[`windows.microsoft.com/en-us/windows7/burn-a-cd-or-dvd-from-an-iso-file`](http://windows.microsoft.com/en-us/windows7/burn-a-cd-or-dvd-from-an-iso-file））或开源程序\
  \ `7-Zip` 可以提供此功能。`7-Zip` 可以从 [http://www.7-zip.org/download](http://www.7-zip.org/download)\
  \ 下载。\n3. 找到一台旧电脑并安装 `Ubuntu`。在计算机启动时加载 `ISO` 文件。\n4. 安装 `Ubuntu`。\n5. 安装好 `Ubuntu`\
  \ 后，使用 `Ctrl+Alt+T` 进入终端命令行。\n6. 这一步骤的第三部分是从 [Amazon.com](http://Amazon.com) 购买\
  \ `Arduino` 套件。你现在可以在 Windows、Apple 或 `Linux` 机器上安装并运行 `Arduino` 程序看到结果。\n7. 在 `Linux`\
  \ 上开始阅读、编写和练习，并享受其中。\n\n本书的章节将帮助读者决定从哪种语言开始，并判断何时学习其他语言。实践示例将带你了解每种语言的基础知识。我希望所有读者都能找到自己喜爱的语言，并实现成为熟练程序员的目标。欢迎来到编程的世界！\n\
  \n## 参考文献\n\n- Cass, S. 2015. “The 2015 Top Ten Programming Languages.” IEEE Spectrum,\
  \ July 20. [`spectrum.ieee.org/computing/software/the-2015-top-ten-languages`](http://spectrum.ieee.org/computing/software/the-2015-top-ten-languages).\n\
  - Chee, Brian. 2014. “Hero Hacks: 14 Raspberry Pi Projects Primed for IT.” InfoWorld,\
  \ July 10. [`www.infoworld.com/article/2606860/consumer-electronics/158674-hero-hacks-14-raspberry-pi-projects-primed-for-it.html`](http://www.infoworld.com/article/2606860/consumer-electronics/158674-hero-hacks-14-raspberry-pi-projects-primed-for-it.html).\n\
  - Guo, Philip. 2014. “Python Is Now the Most Popular Introductory Teaching Language\
  \ at Top U.S. Universities.” Communications of the Association for Computing Machinery,\
  \ July 7. [`cacm.acm.org/blogs/blog-cacm/176450-python-is-now-the-most-popular-introductory-teaching-language-at-top-us-universities/fulltext`](http://cacm.acm.org/blogs/blog-cacm/176450-python-is-now-the-most-popular-introductory-teaching-language-at-top-us-universities/fulltext).\n\
  \n\n\n\n\n## Python 概述\n\nPython 是一种开源的高级脚本语言，用于各种目的，从快速、小型的分析程序到大型应用程序。虽然很难衡量一个开源项目有多少用户，但据估计\
  \ Python 拥有大约一百万用户，并位列世界上最常用编程语言的前五或前十（Lutz 2013）。这种受欢迎的原因之一是 Python 的灵活性；它可以支持面向对象、函数式或传统的过程化（先做这个再做那个）编程范式。更重要的是，Python\
  \ 的一些显式设计特征使其成为一种关注代码质量、开发者生产力、操作系统之间的可移植性，以及与 Python 工具和其他语言集成的语言。换句话说，你可以快速编写出强大、易读阅读、在\
  \ Mac OS、Windows 和 Linux 上无需更改即可运行、并轻松与各种工具接的 Python 代码。这种设计哲学在 Tim Peters (2004)\
  \ 的《Python 之禅》（The Zen of Python）中得到了明确体现，其中包含了“可读性非常重要”和“简单胜于复杂”等陈述。如果你安装了 Python，打开\
  \ Python 解释器并输入 `import this`，就可以阅读完整的《Python 之禅》了。这些思想使得 Python 不仅是一种能够适应各种需求的健壮、强大的语言，而且是一种易于学习的语言、极的入门语言，以及优化库工作流的优秀工具。\n\
  \n### 历史\n\nPython 由 Guido van Rossum 在 1989 年于荷兰研究机构 CWI（一个荷兰语缩写，翻译为数学和计算机科学中心）工作期间创建。二十年后，他写了一系列博客文章，详细介绍了它的历史和发展（Van\
  \ Rossum 2009–2013）。该语言以蒙提·派恩剧团（Monty Python）命名，该协会在文档中一直以 `spam` 变量和几个幽默的俏词的形式存在。它最初大部分是在圣诞期间编写的，旨在作为\
  \ C 语言和 shell 之间“架接桥梁”的侧项目，以加速系统管理工具的开发。Van Rossum 将语言的许多方面基于 ABC（这是他最近作为开发者工作过的一种语言），同时从\
  \ C 和其他更晦涩的语言中获取灵感。他采用了一种显式设计策略，强调开发速度、易用性、可读性、尽可能借鉴他人成果，并使 Python 易于扩展。\n\n在 Van\
  \ Rossum 和他的同事完成初步开发后，Python 于 1991 年 2 月 20 日在 [alt.sources](http://alt.sources)\
  \ 新闻组以 MIT 许可证发布。在社区的鼓励下，Van Rossum 继续更新该语言，并于 1993 年启动了持续至今的 [comp.lang.python](http://comp.lang.python)\
  \ 新闻组。1994 年，列表上的一个热门话题被恰地命名为“如果 Guido 被公车撞了”，其中社区成员担心，考虑到 Van Rossum 继续亲自进行许多更新，该语言的命运将如何。部分由于这个帖子的，Van\
  \ Rossum 在 1994 年被邀请到美国与国家标准与技术研究所工作。在这些关于他那可能不会降临的终结以及来到美国的讨论中，Python 1.0 发布了，1995\
  \ 年 Van Rossum 开始在国家研究倡议组织公司工作，那里又发布了几个主要版本。与此同时，在尝试通过建立一个半官方小组来监督开发以实现 Python 开发多样化的过程中，Van\
  \ Rossum 被授予了“终身仁慈独裁者”的称号，标志着他对 Python 所有事务的持续最终决定权（Lutz 2013）。\n\n在 Python 团队于\
  \ [BeOpen.com](http://BeOpen.com)（一家在互联网泡沫破失败的初创公司）和 Digital Creations 工作了一段时间后，Python\
  \ 2.0 于 2000 年 10 月发布。2001 年，创建了 Python 基金会以监督和协调 Python 语言的进一步开发，该基金一直维护该语言至今。2008\
  \ 年，发布了 Python 3.0，这是一个重大的、不后兼容的版本。然而，考虑到 Python 2 的流行，版本 2.7 正与 3.0 并行维护，尽管仅 `print`\
  \ 命令的更改就确保了几乎所有的 2.x 程序无法在 3.x 上运行，但社区已付出了巨大努力让其正常工作。3.x 中的功能可以使用 `from __future__\
  \ import name_of_function` 移植到 2.x，这样你就可以在无需完全重构代码的情况下利用新功能。秉持 Python 的精神，开发者正专注于灵活性和扩展性，而不是统治世界。\n\
  \n从 Van Rossum 在地下室捣凑代码为了让他的另一份工作更方便，Python 现在由一大开发者作为开源项目进行维护（这些人以及任何特别擅长的 Python\
  \ 编码员被亲切地称为 Pythonistas；同时，按照 Python 社区通用风格编写的代码被称为 Pythonic/Python 式），并具有大量的专门实现。该语言现在用于从电影到\
  \ Web 开发、到科学计算以及专门针对这项工作的库的应用程序。这一切构成了一个充满活力的社区，拥有适用于各种用途的工具。\n\n## 环境与设置\n\n在本地机器上设置\
  \ Python 取决于所使用的操作系统类型。虽然 Python 可以在十多个操作系统上安装和运行（[`www.python.org/download/other`](https://www.python.org/download/other)），但下面包含了三个最常见操作系统——Linux、Macintosh\
  \ 和 Windows——的初始说明。\n\n#### Linux\n\n某些某些版本的 Python（通常是 Python 2.7）已经包含在许多流行的 Linux\
  \ 发行版中，包括 Debian、Fedora 和 Gentoo。然而，并不是每个安装都会包含完整的功能 set。如果你想使用 Python 3.0 或更高版本，你可能需要从操作系统的软件包存储中获取；在\
  \ Ubuntu 上，那可能看起来 `sudo apt-get install python3`。\n\n#### Macintosh\n\n从 Mac OS\
  \ X Yosemite 开始，Python 2.7 是开箱即用的。从终端（Terminal）开始编写命令行提示非常简单，因为 Python 命令可以从任何目录输入。如果你想要不同的版本或未安装\
  \ Python，请访问 [`www.python.org/downloads/mac-osx/`](https://www.python.org/downloads/mac-osx/)\
  \ 并下载你需要的 Python 版本的安装程序。\n\n### Windows\n\n与其基于 UNIX 的同类产品不同，Windows 并不预带安装好的 Python\
  \ 版本。然而，安装通常是快速且无痛的。只需前往 [Python.org](http://Python.org) ([`www.python.org/downloads`](https://www.python.org/downloads))，决定你偏好哪个版本（通常建议采用\
  \ 2.7 或 3 系列中的最新发布，除非你有特定的理由不这样做），然后运行 .exe 文件。这将安装 Python、被称为 Python 标准库的模块集合以及基础\
  \ Python 文本编辑器 IDLE。\n\n\n\n\n你可以在 [pypi.python.org](http://pypi.python.org)（`PyPI`，Python\
  \ 包索引）上搜索超过七万个免费提供的包——这些包涵盖了从数据解析、数据库操作到针对特定终端用户的各种范围。这些包在安装方式上通常是标准化的。作为一个一般规则，为某个版本的\
  \ Python 安装的包可能无法被另一个版本的 Python 识别。简而言之，如果你正在使用 `Python 2.7`，请确保下载适用于该版本的包而不是 `3.x`\
  \ 版本；如果你运行了多个版本的 Python，同一个包可能无法在两个版本上共同工作。在大多数情况下，像 `pip`（下文介绍）这样的工具会为你处理这些问题，但这是一个需要记住的重要方面。\n\
  \nPython 包可以通过多种方式下载和使用，但到目前为止最简单、最常用的方法是使用一个名为 `pip` 的 Python 工具程序。`Pip` 是 `Python\
  \ 2.7.9` 和 `3.4` 及之后版本自带的包管理器；对于早期版本，可以很容易地下载并安装（[`pip.pypa.io/en/latest/installing.html`](https://pip.pypa.io/en/latest/installing.html)）。按照安装说明后，添加新模块通常就像打开命令行并执行命令\
  \ `pip install my_package` 一样简单。你可以使用 `PyPI` 来查找包（这是 `pip` 获取内容的来源），但你也经常会在 StackOverflow\
  \ 或其他讨论 Python 的地方听到关于包的消息。要使用包，只需在 Python 文件的顶部加上 `import my_package`，你就可以访问提供的所有功能。我们将在下面看到这几个示例，因为导入包是\
  \ Python 中最常见的任务之一。\n\n为了真正看到包的力量，让我们从 `Requests`（Reitz 2011）的文档中取一个例子，它是最受欢迎的 Python\
  \ 包之一。`Requests` 允许我们发送 HTTP 请求，抽象了大部分细节，使我们只需专注于我们来此要做的事。使用 Python 内置的 `urllib2`\
  \ 功能，向 GitHub 发起网络请求可能看起来这样：\n\n```\nimport urllib2\n\ngh_url = 'https://api.github.com'\n\
  \nreq = urllib2.Request(gh_url)\n\npassword_manager = urllib2.HTTPPasswordMgrWithDefaultRealm()\n\
  \npassword_manager.add_password(None, gh_url, 'user', 'pass')\n\nauth_manager =\
  \ urllib2.HTTPBasicAuthHandler(password_manager)\n\nopener = urllib2.build_opener(auth_manager)\n\
  \nurllib2.install_opener(opener)\n\nhandler = urllib2.urlopen(req)\n\nprint handler.getcode()\n\
  \nprint handler.headers.getheader('content-type')\n```\n\n如果这段代码对你来说没有任何意义，请不要担心，因为它存在的意义就是为了展示如果你仅使用标准工具向\
  \ GitHub 发起一个简单的 HTTP 请求，然后检查返回的状态码和内容类型时必须编写的复杂代码。它本该让你感到头疼，尤其是如果你是初学者。为了让我们的生活更好，让我们安装\
  \ `Requests`。打开你的命令提示符并输入 `pip install requests`。现在我们可以编写代码：\n\n```python\nimport\
  \ requests\n\nr = requests.get('https://api.github.com', auth=('user', 'pass'))\n\
  \nprint r.status_code\n\nprint r.headers['content-type']\n```\n\n如果你从未见过过 Python\
  \ 代码，你可能也能猜出这段代码的作用。它导入了一个名为 `requests` 的东西，然后用它从 [api.github.com](http://api.github.com)\
  \ 获取信息，使用了用户名和密码（在这里被称为虚拟变量“user”和“pass”）。然后它打印状态码和部分头部信息。感谢 Kenneth Reitz 制作并免费发布了这个库，我们可以在极短的时间内编写易于理解且更容易使用的代码。\n\
  \n### Python 2 对比 Python 3\n\n2008 年底，`Python 3` 发布了。这个新版本与之前的 `Python` 版本不兼容（之前的版本到\
  \ `2.7` 结束）。`Python 3.0` 的发布包含了对语言的许多改进，包括更好的 Unicode 支持、清理过去的弃用功能，以及内置了帮助初学该语言的开发者更好地学习的工具。\n\
  \n在发布时，`Python 3` 被宣布为该语言的未来；然而，因为它与之前的版本不兼容，许多依赖 `2.7` 版本的人发现他们需要升级应用程序。另则接受并在所有新开发中使用较新的\
  \ `Python 3`。不过，在同一台机器上运行多个版本是可能的。由于 `Python 2.7` 在许多机器上是原生安装的（见上一节），可能需要单独安装 `Python\
  \ 3`。这两个版本可以独立运行，但包也需要单独安装——一个包无法在两个平台上同时工作。对于 `pip` 也是如此。但是，通过简单的配置，你可以轻松通过使用如\
  \ `pip2` 或 `python3` 等命令，在你想要运行特定版本时进行跟踪。\n\n### 用途\n\nPython 的灵活性使其适用于各种用途。像 Google、YouTube\
  \ 和 Dropbox 等热门服务使用它为 Web 和桌面环境编写大型项目。在更贴近生活的库领域中，Evergreen 开源图书馆管理系统（ILS）虽然主要用\
  \ Perl 编写，但仍使用 Python 进行某些开发任务。然而，Python 的低门槛使其特别适合小型项目来自动化常见任务。\n\n\n\nPython 在库中非常有用的应用之一，专门针对编目员或技术服务工作流，是使用\
  \ `PyMARC`——这是一个为了访问、创建和处理原始二进制 MARC 数据而编写的 Python 库。这个 `PyMARC` 库允许用户读取 `.mrc`\
  \ 格式的 MARC 记录文件，从记录中提取字段或子字段，通过更改或删除它们来修改字段和子字段，并向记录中添加新字段。根据指定的标准和字段数据，你可以分析 MARC\
  \ 数据并将报告写入文本文件中，这些报告可以用于批量清理项目的统计或错误分析。这种通过编程方式处理数据的能力可以节省大量时间。虽然像 `MarcEdit` 这样的工具可以进行大量的批处理，但学习\
  \ `PyMARC` 既能提供更大的自由度，正如前面提到的，还允许在批处理脚本中调用，因此它可以成为你自动化流程中的众多工具之一。\n\n### 优缺点\n\n\
  如所述，选择 Python 作为首选编程语言有许多优势。Python 通常预装在大多数当前的操作系统中（Windows 除外），因此运行你的第一个脚本不需要太多的设置。对于在命令行界面工作的绝对初学者来说，起初可能不在\
  \ GUI（图形用户界面）环境中工作会让他们感到无畏，但这对任何语言都是如此，只要稍微接触一下基本操作所需的命令，这些恐惧很快就会消失。\n\n虽然 Python\
  \ 可用于执行非常复杂的工作流或构建复杂的框架，但它也允许初学者编写短而简单的脚本来产生强大的结果。通常手动执行需要几个小时的重复性、单调的任务可以在几秒钟内完成。此外，Python\
  \ 社区非常强大，他们创建了包并提供帮助，使得你可能遇到的任何问题可能已经有了答案，并附带了代码示例、语法说明以及一两个冷笑话。\n\nPython 的一个既是帮助也是阻碍的方面是它对大量空白的使用。换句话说，你缩进代码的方式改变了它的运行方式（`http://www.secnetix.de/olli/Python/block_indentation.hawk`）。Python\
  \ 不使用大括号或其他语法来表示嵌套代码块，而是使用行首的制表符或空格来区分代码块的开始和结束。例如，一组 if/else 语句可能看起来像这样：\n\n```\n\
  if x == 1:\n    print \"x is odd\"\nelif x == 2:\n    print \"x is even\"\nelse:\n\
  \    print \"I don't know what x is\"\n```\n\n这与其他许多编程语言不同，但 Python 高度重视可读性和让事情更易于人类。因此，虽然这需要一些适应时间并可能让你对着屏幕大叫，但从长远来看，语言的这一特性使得你的代码更具可读性且更容易维护。\n\
