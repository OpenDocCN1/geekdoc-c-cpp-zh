    C# is a ubiquitous server-side language that is linked hand in hand with `.NET`.
    This allows `C#` to work best in a Windows environment for a wide variety of tasks.
    Strongly supported by Microsoft, `C#` is well documented and widely written about.
    In addition to being fairly easy to learn, it also provides some safety nets to
    keep beginners “safe.”


