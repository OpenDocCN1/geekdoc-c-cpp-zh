    让我们检查一下 `hello.pl`。第 1 行告诉 Linux Perl 的安装位置。为什么呢？因为系统中可能安装了多个版本的 Perl（或其他程序），而这一行明确地指示了去哪里找到它。整行代码对于
    Perl 来说都是一个注释，所以 Perl 会忽略它。在这种情况下，操作系统（即 Linux）会“查看”这个注释。第一行（或其变体）在 `Perl` 程序中是必须的。如果你使用
    `Windows`，则可以省略这一行。第 2 行以 `print` 函数开始，后面是包围你想要打印的字符的双引号。末尾的 `\n` 是什么？它告诉 `print`
    函数“移动”到下一行的开头。你看到第 2 行末尾的分号了吗？它告诉 `Perl` 第 2 行已完成。有时，当你有一行很长的代码时，将其拆分成多行会更具可读性。`Perl`
    在遇到分号时才知道那才是该行的真正结束。请注意，运行 `Perl` 程序有多种方法：`perl program.pl` 或者使用 `./program.pl`。


    ## 从文件中读取数据


    Lisa 告诉 Josie，她现在将向她展示如何使用 `Perl` 读取文件，于是 Lisa 先让她创建了一个名为 `testinput.file` 的文件，并在其中放入了若干行文本。新程序名为
    `fileio.pl`，如下所示。左侧的行号仅供参考，不要在程序中输入它们。


    ```perl

    1 #!/usr/bin/perl

    2 # fileio.pl

    3 use strict;

    4 use autodie;

    5 my $infile = "testinput.file";

    6 my $record;

    7 open(INFILE, "<", $infile);

    8 while ($record = <INFILE>)

    9 {

    10     print $record;

    11 }

    12 close(INFILE);

    ```


    Josie 创建了程序，Lisa 解释了它的工作原理。我们已经知道第 1 行了——这是一个标准。第 2 行是一个包含程序名的注释。将程序名作为前几行之一是一个良好的习惯，通常还会带有对程序功能的简短说明。`#`
    字符之后行内的任何内容都会被视为注释并被 `Perl` 忽略。稍后我们会来看第 3 行和第 4 行的作用。第 5 行定义了要读取的文件名；它将双引号内的文件名放入变量
    `$infile` 中。在 `Perl` 中，简单变量被称为标量（scalars），它们始终以 `$` 作为变量名的开头。第 6 行声明了一个变量但保持其为空，也就是说，初始没有没有存储任何数据。第
    7 行准备读取文件。`INFILE` 是文件句柄（将其想象为程序和文件之间的连接器），应该始终全部大写。


    接下来的部分 `<` 指定了我们想对这个文件做什么。把它想象成一个箭头，指示文件数据移动的方向；在这种情况下，由于我们正在读取文件，数据从文件名流向文件句柄。在第
    8 行，我们开始了文件读取活动的循环。`$record = <INFILE>` 读取输入文件的一行并将该数据放入变量 `$record` 中。文件句柄必须在
    `< >` 尖括号内。这一行以 `while` 单词开头，它需要一个条件语句，且该语句必须括在括号中。这看起来不像条件（比如 `if` 这样 . . . ），确实如此，但它是隐含的。当
    `$record` 接收到数据时，`($record = <INFILE>)` 被求值为真。因此，第 8 行的意思是：只要（或当）`$record` 获取数据的条件为真，就执行后续大括号
    `{ }` 中的任何内容。大括号内可以包含任意数量要运行的代码。只要我们成功读取了数据，这些代码就会执行。当我们到达结束的 `}` 时，我们返回 `while`
    部分并尝试从文件中读取另一行。当整个文件都被读取完毕——该 `while` 条件求值为假（没有更多数据）——我们就退出循环，并跳转到结束的 `}` 之后的程序行，即第
    12 行。现在我们完成了并关闭输入文件。`while` 循环内部的代码是一行将我们的输入记录打印到屏幕上的代码。


    但等一下，我们忘记了一些什么……真的吗？记得在 `hello.pl` 的 `print` 语句中，我们在打印内容末尾有一个 `\n` 吗？为什么我们在这里没有呢？当
    `Perl` 读取一行时，`\n` 已经包含在文件中了。因此，我们不需要在 `print` 语句中添加它。


    现在我们来看第 3 行和第 4 行。每当我们看到 `use some_module` 这种结构时，我们就在调用或包含位于你计算机其他处的指定模块代码。这些模块包含了我们可以在程序中使用（包含）的大量代码，但我们实际上不需要看到它们。这让我们的程序保持简单。那么
    `use strict` 是什么？把它想象成程序的校对。它无法捕捉所有问题，但如果你有语法错误或使用了未定义的变量，它会报错。`use strict` 是可选的，但我建议你始终使用它，因为它会让你的生活更轻松。如果你输入了程序并运行它且没有任何错误，那太好了。编辑你的程序，通过在开头注释掉第
    5 行。现在再次运行程序。`use strict` 会注意到有一个未定义的变量并不允许运行程序。现在也注释掉第 3 行，消除该检查，再次尝试运行程序。


    `use autodie` 不是强制要求的，但也非常建议。如果没有它，当与文件交互（`open`、`read`、`write`、`close`）出现问题时，你会得到比更有用的错误信息。注意：如果你尝试运行此程序时在第
    4 行报错，说明你使用的是内置 `autodie` 的旧版本 `Perl`。在这种情况下，注释掉第 4 行程序即可正常工作。


    ## 从一个文件读取并写入另一个文件


    Lisa 让 Josie 修改了 `fileio.pl` 程序。更改如下：


    ```perl

    1 #!/usr/bin/perl

    2 # fileio.pl

    3 use strict;

    4 use autodie;

    5 my $infile = "testinput.file";

    6 my $outfile = "testoutput.file"; # 新增

    7 my ($record, $linectr, $message); # 新增

    8 open(OUTFILE, ">", $outfile); # 新增

    9 open(INFILE, "<", $infile);

    10 while ($record = <INFILE>)

    11 {

    12     print OUTFILE $record; # 修改

    13      $linectr++; # 新增

    14 }

    15 close(INFILE);

    16 close(OUTFILE); # 新增

    17 print "Copied $linectr". # 另外两个新行

    18 "records from $infile to $outfile \n";

    ```


