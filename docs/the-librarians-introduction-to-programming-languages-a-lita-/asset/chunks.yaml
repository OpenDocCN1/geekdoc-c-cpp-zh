    “记住，数组是变量的组，”Lisa 说道，“变量的名字总是以 `$` 符号开头的；这样我们才知道它是一个变量。所以，我们通过 `$encyclopedia[n]`
    来指代数组中的第 n 个变量（在这个例子中是第 n 卷），实际上是 `nth + 1` 卷，而 `@encyclopedia` 则将整个数组作为一个整体，即整本百科全书。”


    在思考了一会儿后，Josie 示意 Lisa 继续说下去。


    “好的。第 10 行是将值放入这个数组的行，我觉得这非常酷，”Lisa 继续说道，“这与我们之前看到的 `while` 循环不同，我们可以一次性读取整个文件。数组中的每个变量（或元素）都保存着我们读取的文件中的某行。除非你正在读取一个非常大的文件，否则这种方法非常好用！在第
    12 行，我们设置了 `$recnum`，以便使用它来引用数组 `@marclines` 中的每条元素记录，并且我们在第 13 行的 `while` 循环中设置了它。”


    “等等，这太奇怪了，”Josie 打断道，“我们怎么能把数值变量和一个数组进行比较呢？这就像拿苹果比橘子。”


    “啊，”Lisa 回答道上下文。Perl 知道 `$recnum` 是数字，所以它会以数值的方式来看数组 `@marclines`。它是如何做到的？它知道
    `@marclines` 中元素（或变量）的数量。所以 `while` 循环从 `$recnum` 为 0 开始，并不断访问 `@marclines` 中的变量，直到达到第
    n 个元素。然而，第 n 个元素并不存在，因为数组元素是从 0 到 `n – 1`！在那个点上，我们完成了 `while` 循环；没有更多数据需要处理了。”


    第 15–16 行大部分非常相似。看第 16 行，我们看到 `substr` 是子字符串函数，奇奇的是，它会复制字符串（字符）的一部分。从数组 `@marclines`
    中由当前 `$recnum` 值所指的记录中，提取从位置 12 开始、总共 5 个字符的字符副本。由于我们提取的是数字字符，并对其进行数学运算（即 `– 1`
    部分），Perl 将这五个数字转换为一个数字并减去 1，然后将该值放入 `$baseaddr`。第 15 行使用 `print-with-formatting`
    函数输出 MARC 记录的引导部分。`printf` 函数在双引号内指定了格式。你也可以在里面放入字面文本，比如 `LDR:`，并使用像 `\n` 这样的字符。双引号内以
    `%` 开头的某些字符组合表示一种格式。在这种情况下，它是非常基础的 `%s`，意味着它将处理一个未指定长度的字符串而不进行任何额外的格式化。双引号后面是一个逗号，后面是左格式中要替换的变量/值列表。这里我们有一个值，即该子字符串操作的结果，当
    `printf` 执行时，它会替换 `%s`。


    下一行感兴趣的行是第 `25\.` 行。哎呀！让我们逐个查看这个正则表达式。我们知道会发生替换，因为它以 `s` 开头。它首先查找的是十六进制数。它实际上是用于指示或分隔
    MARC 格式中子字段的不可打印字符。然后我们查看方括号 `[ ]` 内部的内容，这表示我们正在寻找任何小写字母或任何单个数字。由于子字段是这样标识的，我们知道这个正则表达式在寻找子字段的开头。现在我们到了
    `/` 正则表达式分隔符，所以后面的是我们要替换的内容。这是一个空格、`|` 字符、`$&` 和另一个空格。`|` 字符控制正则表达式的行为（我们稍后会展示），而我们想要那个字符本身，所以通过在它前面加上
    `\` 字符对其进行转义。`$&` 是那些保留的 Perl 变量之一，它包含了匹配到的内容（如果有的话）。这就是我们在 `s(ubstitution)` 正则表达式的第一部分所做的：寻找或匹配某些内容。上面的插图有助于理解这一点。在这个例子中，让我们使用
