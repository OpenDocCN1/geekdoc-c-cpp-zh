    \ and precision and easily add event handlers to them is only part of its true\
    \ power. jQuery also does an admirable job of dealing with issues of cross-browser\
    \ compatibility (jQuery Foundation n.d.-c). That is to say, not all browsers always\
    \ interpret JavaScript the same way. There may be slight differences in how they\
    \ navigate the nodes in the Document Object Model (DOM) or how they allow JavaScript\
    \ to interact with the DOM. jQuery is designed to cope with the nuances between\
    \ browsers so that the end result of your script remains relatively consistent\
    \ for your users.\n\nIn the same way that jQuery provides shorthand for selecting\
