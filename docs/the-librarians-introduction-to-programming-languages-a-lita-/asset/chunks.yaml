    第 27 行看起来可能更容易理解。在这里，我们正在寻找子字段和字段分隔符并移除所有它们。正则表达式第一部分中的 `|` 匹配 `\x1f` 或 `\x1e`
    字符，并在遇到时将其移除。示例输入：`\|!c Putnams`。示例输出：`|c Putnams`。显然更易读了。


    第 29 行仅当行首的空格后面跟着 `|` 字符时才删除它。我们知道这一行是在进行替换，因为那个 `s` 是它的开头。脱字符符号 `^`（或帽子）表示从开头开始匹配。它寻找开头的任意两个字符（由
    `..` 表示），然后是一个空格，然后是 `|` 字符。由于我们寻找的是真正的 `|` 字符，我们通过在它前面加上 `\` 来进行转义。


    Josie 感到很困惑，“看起来就像任何字符部分都进入了 `$tagdata`，但我不确定是否正确。而且那个 `$1` 是从哪里来的？它不是程序的一部分。”


    “好问题，”Lisa 回答道，“任何 `$n` 变量（n 是单个数字）都是正则表达式的内部变量或保留变量，并且在该语境下使用。”


