    Let’s examine `hello.pl`. Line 1 tells Linux where Perl is installed. Why? It
    is possible to have more than one version of Perl (or other programs) installed,
    and this line unambiguously indicates where to find it. That entire line is a
    comment for Perl, so Perl ignores it. The operating system, in this case Linux,
    “peeks” at the comment. This first line, or some variation of it, is required
    in `Perl` programs. If you use `Windows`, you can omit this line. Line 2 starts
    with the `print` function, followed by the double quotes surrounding the characters
    you want it to print. What’s that `\n` at the end? That tells the `print` function
    to “move” to the beginning of the next line. You see the semicolon at the end
    of line 2? That tells `Perl` that line 2 is complete. Sometimes, when you have
    a long line of code, breaking it up into multiple lines makes it more readable.
    `Perl` knows it’s the real end of the line when it encounters that semicolon.
    Note that there’s more than one way to run a `Perl` program: `perl program.pl`
    or instead `./program.pl`.


    ## Reading Data from a File


    Lisa told Josie that she would now show her how to read a file using `Perl`, so
    Lisa first had her create a file called `testinput.file` and put several lines
    of text in it. The new program, called `fileio.pl`, appears below. The line numbers
    to the left are purely for reference; do not enter them in the program.


    ```perl

    1 #!/usr/bin/perl

    2 # fileio.pl

    3 use strict;

    4 use autodie;

    5 my $infile = "testinput.file";

    6 my $record;

    7 open(INFILE, "<", $infile);

    8 while ($record = <INFILE>)

    9 {

    10     print $record;

    11 }

    12 close(INFILE);

    ```


    Josie created the program, and Lisa explained how it works. Line 1 we know about—it
    is a standard. Line 2 is a comment that contains the name of the program. It’s
    good practice to have the name of the program as one of the first lines, usually
    with a short explanation of what the program does. Anything on a line after the
    `#` character is treated as a comment and is ignored by `Perl`. We’ll see what
    lines 3 and 4 do in just a bit. Line 5 defines the name of the file to be read;
    it puts the file name that’s inside the double quotes into the variable `$infile`.
    Simple variables are known in `Perl` as scalars, and they always have the `$`
    as the first part of the variable name. Line 6 declares a variable but leaves
    it empty, that is, no data is initially stored in it. Line 7 prepares the file
    for reading. `INFILE` is the file handle (think of it as a connector between the
    program and a file) and should always be all uppercase.


    The next part, `<`, specifies what we want to do with this file. Think of it as
    an arrow indicating in which direction the file data is moving; in this case,
    since we’re reading the file, the data flows left from the file name to the file
    handle. In Line 8, we start the loop of file reading activity. `$record = <INFILE>`
    reads one line of the input file and puts that data into the variable `$record`.
    The file handle must be inside the `< >` angle brackets. This line starts with
    the word `while`, which requires a conditional statement, and that must be enclosed
    in parentheses. This doesn’t look conditional, like `if` such-and-such . . . ,
    that’s true, but it is implied. When `$record` receives data, `($record = <INFILE>)`
    is evaluated as being true. So line 8 says that while (or so long as) it is true
    that `$record` is getting data, do whatever comes inside the following curly brackets
    `{ }`. The curly brackets may contain any number of lines of code to be run. So
    long as we are successfully reading data, these lines of code will be run. When
    we reach the ending `}`, we return to the `while` part and try to read another
    line from the file. When the entire file has been read—that `while` condition
    evaluates as false (no more data)—we exit the loop and jump to the program line
    immediately after that ending `}`, line 12. We are done now and close the input
    file. The code inside the `while` loop is one line that prints our input file
    record to the screen.


    But wait, we’re forgetting something . . . or are we? Remember in the `print`
    statement in `hello.pl`, we had that `\n` at the end of what we printed? Why don’t
    we have that here? When `Perl` reads a line, the `\n` is included from that file.
    Thus, we don’t need to add it to the `print` statement.


    Now let’s cover lines 3 and 4. Whenever we see the construct `use some_module`,
    we call in, or include, the program code of the specified module that resides
    somewhere else on your computer. Such modules contain a bunch of code that we
    can use (include) in our program, but we’ll never actually see it (and do not
    need to). This keeps our programs simpler but gives them more power, as we can
    call on that module’s functionality. So, what is `use strict`? Think of it as
    a proofreader for your program. It won’t catch everything, but it will complain
    if you have syntax errors or make use of a variable without defining it. `use
    strict` is optional, but I recommend you always use it, as it will make your life
    easier. If you entered the program and ran it and didn’t get any errors, great.
    Edit your program and comment out line 5 by putting a `#` at the beginning. Now
    run your program again. `use strict` will notice you have an undefined variable
    and will not let you run your program. Now also comment out line 3, eliminating
    that check, and try to run your program again. This time it will let you, but
    you’ll get an error the moment you try to open `INFILE`, because there is now
    no file name.


    `use autodie` is not required but is also highly recommended. Without that, if
    there’s a problem interacting with a file (`open`, `read`, `write`, `close`),
    you will get a more helpful error message than you otherwise would. Note: If you
    get an error at line 4 when you try to run this program, you’ve got an older version
    of `Perl` that doesn’t have `autodie` built in. In that case, comment out line
    4 and the program should work.


    ## Reading from One File and Writing to Another


    Now Lisa had Josie modify the `fileio.pl` program. The changes are shown below:


    ```perl

    1 #!/usr/bin/perl

    2 # fileio.pl

    3 use strict;

    4 use autodie;

    5 my $infile = "testinput.file";

    6 my $outfile = "testoutput.file"; # new

    7 my ($record, $linectr, $message); # new

    8 open(OUTFILE, ">", $outfile); # new

    9 open(INFILE, "<", $infile);

    10 while ($record = <INFILE>)

    11 {

    12     print OUTFILE $record; # modified

    13      $linectr++; # new

    14 }

    15 close(INFILE);

    16 close(OUTFILE); # new

    17 print "Copied $linectr". # two more new lines

    18 "records from $infile to $outfile \n";

    ```

