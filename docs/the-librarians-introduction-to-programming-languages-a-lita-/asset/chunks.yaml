- fmt: "\nLine 4 is the opening brace of the main function. Anytime you define a function\
    \ in C, you need opening and closing brace characters. The great thing is that\
    \ C doesn’t care about indentation or white space. These only exist for the sake\
    \ of the humans reading the code.\n\nLine 5 is the payload of this program. This\
    \ `printf` statement is a function that takes the supplied argument, in our case\
    \ the quintessential introductory statement every programmer begrudgingly learns,\
    \ and prints it to standard output. In most cases, the output will be the screen.\
    \ The bit about `\\n` at the end of the string is an escaped character that appends\
    \ a new line to the end of the string. After `printf` is a semicolon. Every line\
    \ of code in C needs to be terminated with a semicolon, with the exception of\
    \ the include line. With this obligatory example out of the way, let’s delve into\
    \ something particularly C-like.\n\n### Addresses of Values\n\nBack at the command\
    \ prompt, try using `nano` to start a file called `address.c` and then enter the\
    \ following text and save the document:\n\n```c\n/* Looking at the address of\
    \ a variable */\n\n#include <stdio.h>\n\nmain() {\n    int x;\n    int y;\n  \
    \  x = 3;\n    y = 7;\n    printf(\"Value of x is: %d and located: %p\\n\",x,&x);\n\
    \    printf(\"Value of y is: %d and located: %p\\n\",y,&y);\n}\n```\n\nThe command\
    \ line workflow for this example should look like this:\n\n```bash\n>nano address.c\n\
    >gcc address.c\n>ls\naddress.c a.out a.helloworld.c\n>./a.out\nValue of x is:\
    \ 3 and located: 0x7ffe28fd9a08\nValue of y is: 7 and located: 0x7ffe28fd9a0c\n\
    ```\n\nYour output will be different than what is in the image, and we will go\
    \ line by line, skipping the parts we saw with the first bit of code. Lines 4\
    \ and 5 declare two integers. A fundamental data type of any language, values\
    \ are assigned to the newly created integers in lines 6 and 7.\n\nLines 8 and\
    \ 9 are where we see C in action. We once again use `printf` to print some values\
    \ to the screen. `printf` is a pretty versatile function that does more than you\
    \ can imagine. If you provide it a string of text with a `%` character embedded\
    \ in it, it will take other variables provided as arguments into the spot where\
    \ the `%` is located. In our first example, we print `x` using the `%d` sequence.\
    \ Another C-ism in action: C doesn’t really know what is in any memory address,\
    \ so by doing `%d` you are telling the interpreter to print the contents of that\
    \ memory address as if it were an integer. You would use `%s` if you had a string\
    \ you wanted to put in the sequence, `%f` for float, and so on. The second part\
    \ is a `%p`, which stands for pointer. The third argument of `printf` is `&x`,\
    \ which is the address in memory where `x` resides. The `&` operator tells C you\
    \ want the address of the thing you are looking at, not the value of the thing.\n\
    \nThe purpose of this example is to show you just how low in level you can get\
    \ with C code. When we print the two integers, we first print their value. Then\
    \ we do something really obscure: we print the address of the bit of memory where\
