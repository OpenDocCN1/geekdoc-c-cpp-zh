    \ 是 PHP 的权威，提供完全可搜索的免费文档。`http://www.php.net`。\n- **WordPress**: WordPress 是一个开源内容管理系统，最初围绕博客构建，但已发展到支持各种其他网站结构。`https://wordpress.org/`。\n\
    \n# 第七：SQL\nEmily R. Mitchell 和 Lauren Magnuson\n\n### 历史与发展\n结构化查询语言 (`SQL`)\
    \ 是一种用于与存储应用程序数据交互的基本编程语言，这些数据是即使在你关闭程序或重启计算机时一直存在的持久性数据。它主要是一种声明性语言，这与用于编写应用程序的过程性语言（如\
    \ `PHP` 或 `Ruby`）区分开来。`SQL` 的基本语法用于创建、查询、更新和删除存储在数据库中的数据。`SQL` 用于各种图书馆背景，理解它的工作原理可以让图书馆员更好地理解图书馆数据存储、检索、分析的方式，并可能将其扩展到新的应用程序和服务中。要理解为什么\
    \ `SQL` 如此重要，你需要了解 `SQL` 出现之前的生活是什么样的。在 `SQL` 之前，如果你想让程序使用持久数据，你必须告诉程序具体如何获取这些信息。\n\
    \n如果你能想象在一个没有索书号的图书馆里工作，并试图为需要找书的非常胆小且按字面意思的读者提供逐步指示，那么你的思路是正确的。你必须告诉该读者转身，走上两层楼梯，右转，穿过门，走到右侧的第三架书架，并选择从顶部数起第二层的第四本书。如果图书馆购买了更多排在书架上该书之前的书，你必须知道这一点并更改你的指示，这样下一次有人要求这本书时，你可以让他们去拿第六本书而不是第四本。\n\
    \n上面的例子说明了在 `SQL` 时代之前处理持久数据的一个情况。1970 年，E. F. Codd 发表了一篇论文，第一行写道：“未来大型数据库的用户必须保护他们不必知道数据在机器中是如何组织的（内部表示）”（Codd\
    \ 1970, 377）。\n\n"
