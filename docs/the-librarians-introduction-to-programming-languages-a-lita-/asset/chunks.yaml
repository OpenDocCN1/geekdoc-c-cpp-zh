    一个简单而有趣的编程挑战示例是类似于相扑机器人比赛。在这种比赛中，两个配备了运动检测器和线条追踪传感器的小型机器人相互竞争，试图将对方推出一个直径三英尺的圆环。这些机器人配有驱动两个轮子的电机，当开启并放置在场地上时，它们会寻找彼此并尝试将对方推出环外。程序员需要编写一个脚本，根据检测到另一个机器人的情况，命令机器人何时执行什么操作。这种编程可以非常简单，它是观察应用编程问题——以及机器人技术的一种方法。再次，定义任务的逻辑对于任何计算机语言来说可能都是相同的，只是表达方式不同。


    # 入门


    今天，花费二十到八十美元购买一本关于 Arduino、树莓派（Raspberry Pi）、Edison 或 BeagleBone ([`beagleboard.org/bone`](http://beagleboard.org/bone))
    的项目书籍以及配套电脑板，是兼顾乐趣和学习编程的极佳方式。这些都是类型的微控制器。其中一些比较先进，运行起来更像现在的计算机。微控制器是一组可编程的开关，你可以根据需要和时间告诉控制器开启或关闭。你可以打开灯光、电机或功率传感器，并收集和保存数据。通过其中任何一种，你都可以制作有趣的项目，例如一个挂墙电子日历，它可以随着人员更新自己的个人日历而自动更新（Chee
    2014），或者制作你自己的机器人。


    大多数程序可以在文本编辑器中编写，如果你是 Windows 用户，可以使用 `NotePad`。像 Word 这样的程序将无法工作，因为它会添加许多作者不可见的隐藏文本内容，导致程序无法运行。相比之下，`NotePad`
    不添加这些内容。然而，并不是所有的文本编辑器都是相同的，有些比其他的有用得多。某些文本编辑器可以为程序的不同部分添加颜色编码。`Sublime Text`
    和 `NotePad++` 是两种被广泛认可和使用的编辑器，前者适用于 Windows 和 Linux 操作系统。它们都为用户提供了行号，以便跟踪程序的各个部分。


    几乎任何新用户都会遇到一种“Hello World”脚本。无论某人使用的是 Perl 还是 Python，大多数教程都从这里开始。学生定义一个变量，例如 `X
    = “Hello World.”`。下一步只是命令计算机在屏幕上显示变量（`Print X`）。结果是学生将在他们的电脑屏幕上看到“Hello World”。


    随着越来越多的程序变得开源（这意味着编程脚本（代码）公开可用），图书馆员利用编程的力量日益增长。一个极佳的例子是 `R` 程序。`R` 是一个统计包。它由全球的用户编写和修改，他们不断对其进行添加和改进。如果你有一个想让程序执行的任务但没有运行该任务的脚本，你可以编写该脚本，然后使用程序的其他功能（例如对结果绘图）。一旦你写好了脚本，就可以与其他人分享，以便他们从你的工作中获益。在此过程中，可能会有人将你的脚本与其他一系列相关脚本一起打包，作为库添加到程序中。对于
    `QGIS` 这样的程序也是如此，它是一个可以执行复杂空间分析的高级映射程序。用户可以编写短程序，为整个 `QGIS` 程序提供更强大的功能。


    # 面向对象


    这引入了面向对象编程的概念。面向对象编程编写脚本或短程序的过程，这些程序可以插入或从较大的程序中提取，而不会导致大程序或脚本本身出现任何故障。通过面向对象编程，你可以编写一个脚本来执行某个任务。这个脚本就是对象。其他人可以使用你的对象
    `(script)` 并将其插入完全不同的程序中，以执行你为你的程序编写的相同任务。例如，你可以编写一个脚本来获取某些传感器数据，例如来自自动检票传送带的书籍计数数据，然后每天对数据进行汇总，并提供图书馆还书周平均数。另一个人可以复制你的脚本，用于不同的传感器，以提供进入图书馆的周平均人数。无论你是在数书还是数人，创建周平均数的任务是相同的。正是这种“分块编程”导致了非常强大的程序的开发，并允许普通人也做出贡献。其目标是避免因为想添加一个新任务就得重写整个程序（如果想了解更多，请查阅
    PC 杂志对该定义：[http://www.pcmag.com/encyclopedia/term/48238/object]-oriented-programming）。


    开始编程的一种有趣方式是研究谜题，让读者被要求通过编写脚本来解决任务。任何人都可以在网上搜索这些示例。也有关于编程谜题的书籍。然而，其中一些书籍包含复杂的谜题，这些谜题似乎被用于公司招聘新程序员的面试过程中。对于初学者来说，不要避开为孩子写的书。Jason
    Briggs 的《Python for Kids》是一个很好的起点，他的网站 ([`jasonrbriggs.com/python-for-kids/puzzles.html`](http://jasonrbriggs.com/python-for-kids/puzzles.html))
    发布了针对初者的简单编程挑战。


    无论如何，初学者学习编程最简单的方法之一就是通过在项目中获得乐趣，让失败成为学习经验而不是问题。再次，Arduino 项目非常适合这种活动。我的最佳建议是在旧笔记本电脑上安装
    `Linux`（它是免费的），买一个二十元的 Arduino，并在 [Code.org](http://Code.org) 上花些时间。


    # 图书馆编程


    最后，为什么图书馆员应该学习编程？为了收集数据并解决问题，例如在过去十年中，索号范围 `x–y` 内的书籍每年被借阅超过一次的情况；确定借阅与学生成功是否相关；研究图书馆教学的效果——以及许多其他原因。


    这引导我们决定学习哪种语言。通常，这取决于学习背后的原因。如果目标是特定任务，语言的选择将受到影响。对于许多图书馆员来说，编写最简洁的代码可能没有编写他人能读懂的代码重要。这就是为什么如
    `Ruby` 和 `Python` 等语言很受欢迎的原因。它们相当简洁，但重要的是，阅读脚本的人可以很容易看出脚本想要做什么。


    《计算机协会通讯》杂志上的一份最新报告（Guo 2014）指出，`Python` 是 2014 年最受欢迎的语言。这是基于对大学计算机系近期教学课程的分析，表明许多程序现在是用
    `Python` 编写的。因此，除非有使用其他语言的理由，否则它可能是入门语言之一。`Python` 简单而强大，你可以相当容易地编写有趣的脚本。如果你主要参与网页设计，那么
    `Java` 可能是更好的选择。没有必要学习太多的语言。一旦你学会了一种语言并良好掌握了基础编程术语和概念，在需要或想要时学习另一种语言将变得更容易。


