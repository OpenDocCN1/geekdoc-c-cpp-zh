  raw: 'One of the most beneficial applications of Python in libraries, specific for
    catalogers or technical services workflows, is in the use of PyMARC—a Python library
    written to access, create, and manipulate raw binary MARC data. This library of
    PyMARC functions allows one to read in a .mrc file of MARC records, extract fields
    or subfields out of the records, modify fields and subfields by changing or removing
    them, and add new fields to the records. Based on specified criteria and field
    data, you can analyze the MARC data and write out reports to text files, which
    can be used for statistics or error analysis for batch clean-up projects. This
    ability to programmatically work with data can save a large amount of time, and,
    while tools such as MarcEdit can do large amounts of batch processing, learning
    PyMARC both gives greater freedom and, as mentioned, allows calling from batch
    scripts, such that it can be one of a number of things you automate together.


    Pros and Cons


    As noted, there are many advantages to selecting Python as one’s programming language
    of choice. Python generally comes preinstalled on most current operating systems,
    excluding Windows, so there is not a lot of setup in order to run your first script.
    For absolute beginners working on the command line, it may seem daunting at first
    to not be working in a GUI (graphical user interface) environment, but this is
    true for any language, and those fears are quickly overcome with just a little
    bit of exposure to the commands needed for basic operations.


    While Python can be used to perform very complex workflows or build elaborate
    frameworks, it also allows beginners to write short, simple scripts that can create
    powerful results. Repetitive and mundane tasks that would normally take hours
    to perform manually can be completed in seconds. Additionally, the Python community
    is highly robust, creating packages and offering help so that any questions you
    might have will quite possibly already be answered, with code examples, a note
    about syntax, and a joke or two.


    One aspect of Python that can be both a help and a hindrance is its use of significant
    white space. In other words, the way you indent your code changes how it is run
    ([http://www.secnetix.de/olli/Python/block_indentation.hawk](http://www.secnetix.de/olli/Python/block_indentation.hawk)).
    Rather than using curly brackets or other syntax to express nested code blocks,
    Python uses tabs or spaces at the beginnings of lines to distinguish when a block
    of code starts or stops. For example, a set of if/else statements might look something
    like this:


    if x == 1:


          print "x is odd"


    elif x == 2:


         print "x is even"


    else:


         print "I don''t know what x is"


    This is different from many other programming languages, but Python places a high
    value on readability and making things easier for humans. Thus, while it will
    take some getting used to and may have you yelling at your screen, in the long
    run this feature of the language makes your code more readable and easier to work
    with.


    Another confusion beginners sometimes encounter is the difference between running
    Python commands directly in the Python shell (i.e., when the prompt begins with
    >>>) versus calling and running a full Python script using the python command
    and the script file name from the prompt (here a Windows DOS prompt): C:\> python
    [myPythonScript.py](http://myPythonScript.py). The Python shell allows you to
    check how a function operates before using it, or work out some nasty bit of code
    in an interactive environment. It’s a useful feature, but none of your brilliant
    code will be saved, so once you’ve used the prompt to work something out, be sure
    to move it to a .py file and save it to be used in the future as shown above.


    Examples


    Python for Comparing Holdings


    An area where Python excels is the writing of relatively short scripts to automate
    routine tasks. For instance, if we have a list of holdings from a vendor and we
    want to check these against holdings in our catalog, the task becomes onerous
    with even a modest number of holdings. However, with Python we can quickly write
    a script to automate our task, freeing us up to get another cup of coffee.


    from_vendor = [''1234-5678'', ''2345-6789'', ''3456-7890'']


    from_catalog = [''1234-5678'', ''2345-6789'', ''3456-7890'', ''1111-2222'']


    for issn in from_catalog:


          if issn not in from_vendor:


                print issn


    This example demonstrates one very simple way to go about this. We make two variables
    called from_vendor and from_catalog and put a list of ISSN numbers in those variables
    (in Python, square brackets usually mean a list, which is quite literally just
    a list of data points separated by commas; also, these data points can be anything,
    so [''a'', ''number'', 3] is a perfectly valid list). After that we compare the
    two lists using a for loop. The way Python is written is sometimes called “executable
    pseudocode” because the language’s syntax tends much more toward plain English
    than most programming languages, and this code might give you some idea why.


    Once we have our two lists of ISSN numbers, we simply say, “for every ISSN in
    the list called from_catalog, check to see if it is not in the list called from_vendor
    and print those to the screen.” While this example shows us that Python can quickly
    do comparisons, it doesn’t provide much utility over just doing the comparison
    ourselves, especially if we have to manually type in both sets of ISSNs by hand,
    which could get tiresome and time consuming with a whole library’s worth of ISSNs.
    Luckily, Python makes it quick and easy to level up this simple script to handle
    larger sets of data, say by comparing the contents of two CSV files containing
    thousands of ISSN numbers each. For the sake of simplicity, we will assume that
    we have two CSV files, one from our catalog and one from a vendor, and that each
    has a single piece of information, the ISSN of a journal, in each row, as delimited
    by a comma. To get these out of the CSV file and into Python, we might do the
    following:


    import csv


    with open(''issns_from_catalog.csv_from_catalog.csv'', ''r'') as f:


          catalog_reader = csv.reader(f, delimiter='','')


          from_catalog = list(catalog_reader)


    with open(''issns_from_vendor.csv_from_vendor.csv'', ''r'') as f:


          vendor_reader = csv.reader(f, delimiter='','')


          from_vendor = list(vendor_reader)


    To work with CSV data, we first import  the csv package, which is just a set of
    prewritten functions and is part of Python’s base installation. Then we use the
    same code twice to open the files issns_from_catalog.csv  and issns_from_vendor.csv,
    respectively, opening each using the ''r'' parameter to specify for reading only
    and calling each f (we can call them anything we want at this point; f is just
    a common convention for a variable name when opening a file). We then use the
    csv package we imported above to use a function called reader, which is predefined
    code that knows how to get information out of the CSV files we just opened, and
    we store the CSV data in variables called catalog_reader and vendor_reader. Finally,
    we create our from_catalog and from_vendor variables, which will work essentially
    the same as those same variables we wrote by hand earlier. To do this, we use
    the list  function, which tells Python to take the CSV file we read with csv.reader
    and make it a Python list like the ones we typed out earlier. As a side note,
    any time you see yourself repeating code like we did above, you should be thinking
    about making it into a function to reuse your code, which you can read all about
    in the suggested resources below.


    Next, we can reuse our comparison code from above with a slight modification.
    Rather than printing all of the nonmatching ISSNs to the screen, we will collect
    them in their own list.


    not_in_both = []


    for issn in from_catalog:


          if issn not in from_vendor:


                not_in_both.append(issn)'
