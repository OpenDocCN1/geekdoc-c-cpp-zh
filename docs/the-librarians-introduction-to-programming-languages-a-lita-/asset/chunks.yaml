    ## 致谢


    这本书的诞生是通过一些曲折的事件实现的。原编辑需要退出，而 LITA 指南系列的编辑 Marta Deyrup 将我与 Ron T. Brown 结了联系，我们同意共同担任编辑。在书籍的最初构思获得批准后，Ron
    获得了一份行业工作并接受了。这个新职位让 Ron 忙得无法继续参与书籍。此时，几位原作者有其他安排，我不得不招募替代者。


    在介绍上述之后，我想感谢 Marta Deyrup 对我的信任，感谢 Ron 对书籍构思的指导，感谢在近两年时间里坚持的所有原作者。非常感谢在最后时刻加入并提供精彩章节的作者。


    ## 前言


    《图书员编程语言入门》概述了图书馆中使用的流行的编程语言，包括实际示例，帮助图书员度过“我不行”的阶段。我们从 Python、Ruby 和 JavaScript
    开始，它们被认为可读性最高，因此相对容易学习。接下来是 Perl、PHP 和 SQL，因为它们稍微复杂，但非常有用。C、C# 和 Java 完成了本书，作为编译型语言，它们有自己的优缺点，但在图书馆中有许多用途。


    虽然有很多致力于教授编程的书籍和网站，但很少有作品涉及多种语言或提供图书馆特定的示例。本书的读者群体包括管理员、从业人员、学生、教育者以及对计算机编程感兴趣的终身学习者。


    本书旨在提供每种语言的基础工作知识、图书馆中的应用示例、图书员何时发现每种语言实用的想法，以及用于实践的小示例。还提供了供额外阅读的推荐资源。贡献的形式允许通过更丰富的经验涵盖更广泛的语言。


    我代表全体贡献者，愿所有读者在个人和专业领域创建新程序，或与程序员合作实施新的或重新设计的技术时一切好运。


    ## 1 引言


    Dean Walton


    ### 历史与发展


    编程从起源到今天已经走了很远的路。我第一次接触编程是使用孔带，即用于传输变化的股票价格的纸带。对于熟悉 60 年代经典情景剧《亚当斯家族》的人来说，Gomez
    总是盯着他的纸带看。下一个重大进展是孔卡和 `Fortran`。随着个人电脑的出现，编程成为大众大众的一种爱好。


    '
- fmt: '

    Computers are now integral to the work of librarians, and because many computer
    programs allow users to customize and run short program segments, called scripts,
    librarians could be missing out on a huge slice of the library world if they do
    not learn a few programming basics. As an example, if you have budget data, you
    can perform repetitive analyses to calculate various scenarios. With circulation
    data, you can perform repetitive analyses to examine use of items by certain populations,
    call number range use related to semesters, and other important relationships.
    Programming allows a person to perform complex repetitive tasks quickly and allows
    for quick modification as parameters change.


    So how does a librarian with no programming experience start? First, let’s understand
    that the terms program and program code are fairly interchangeable. A program
    is a complete set of stand-alone program code. Program code typically refers to
    code in general, not a complete program. Programming is the action of creating
    a program, essentially writing the code that makes up a program. Code is the English-like
    instructions we humans use to tell a computer what to do. You may have heard of
    programmers or coders. These are essentially the same thing: people who write
    (or code) programs. One might say that learning to program is now kids’ play.
    There are a plethora of books, online videos, and game-oriented websites that
    can help. One of these, `Code.org`, is a great site for basic instruction; it
    teaches the logic of programming regardless of the programming language. `Code.org`
    provides tutorials and content for elementary kids to learn the building blocks
    of programming. Of course, adults can learn from the site as well and do it in
    fun ways. If you want something more advanced, then YouTube is just a click away
    with its wealth of step-by-step videos. One must be careful, though, to ensure
    the quality of the instruction. The resources provided by chapter authors and
    the Additional Resources section of this book will guide you to quality items
    for your trek through the land of programming.


    ## The Basics


    It is important to make a distinction between interfacing with a computer and
    programming on it. A first step for many adults, including librarians, is to practice
    interfacing skills. A good way to start is to pull out an old desktop or laptop
    computer and load `Linux` on it. The newest versions of `Ubuntu Linux`, an operating
    system, will, when loaded, resemble Windows or Apple OS. However, in `Linux`,
    it is still possible to have a mouse-driven graphical user interface and enter
    the `Terminal` (`X-terminal`), where running the computer is command driven. By
    this I mean that the user can type commands on the appropriate lines on the computer,
    hence the name “command line.” Gone is the mouse and its cursor. To move around
    the computer, the user uses the arrow keys. On a Windows machine, you can hold
    down the `Windows` key (often at the bottom left of the keyboard) while also holding
    down the `X` key. This brings up a menu for the command line and also the command
    line with administrator rights.


    There are several important tasks to learn in the command line. In order to function
    in this environment, the user must learn how to move back and forth between different
    folders or directories; move, copy, or delete contents within these folders or
    directories; and find, download, and unpack programs from other sources. Mastering
    this suite of tasks will serve the librarian very well. Once these are achieved,
    loading the sets of scripts, or libraries, needed for a particular programming
    language will be much easier.


    The starting point for all of this is the path (figure 1.1). This is what allows
    the user to know where everything resides in the file structure of the operating
    system. The path follows terminology that is analogous to a tree. The structure
    that connects a tree to the earth and the trunk to the tree are the roots. The
    very core of the path is the root directory. The root structure contains the commands
    that allow the computer to function. Any deletion of files in the root and the
    computer won’t work; thus the root directory is often protected. Protection in
    this case means needing a password to change parts of the root directory. If you
    are the administrator for the computer, that is, it’s your computer or you are
    responsible for it, then you should know the root password. Creation of the root
    password normally happens when you load the operating system onto your computer.


    ![](OEBPS/image/Figure_1.1.jpg)


    Figure 1.1. A generic path structure for folders or directories in a computer
    operating system.


    The user can add or delete folders from the root directly just as a tree can grow
    new branches or a gardener can trim them away. But, remember, if you cut out the
    roots, the tree will die. A good question is how you know what branches your tree
    pathway has. You can type `dir` in the command line and see a list of folders
    contained within your location. To move into one of those folders, you type `cd`,
    short for “change directory,” and the directory’s name. There is even an easier
    way to go back to where you just were. By typing a single period on the command
    line and hitting enter, you ask the computer to bring you back to the previous
    folder. If you type two periods, you ask the computer to take you back to the
    starting point of all of the directories, back to the root directory.


    There are also some added functions to many of these commands. A good example
    is how you can view the contents of a folder in Windows. You can view contents
    as a list or a list with details regarding size and creation date. The new user
    will be confronted with terms like `tar`, `grep`, and `bash`. Some of these refer
    to concepts that are easy to understand for someone used to Windows or Mac OS.
    For example, a `.tar` file is one that is compressed, like a zipped Windows folder.
    It needs to be uncompressed and the files contained within the folder moved to
    the appropriate folders or directories to be useful. Certain files need to be
    placed in an existing folder while others need to be placed in a brand-new folder
    that the user may need to create. It is important to read any associated text
    file or instructions on how to unpack and set up the new program.


