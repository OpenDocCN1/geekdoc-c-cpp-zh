    PHP 在库网站中的作用可能很难被界定，因为它可能被归咎为承担了应用程序中某些它并未执行的任务。PHP 通常不负责数据的字面存储，通常也不负责网页的视觉显示。PHP
    在网站上的通常职责是从数据库或文件系统中查找数据，对这些数据运行某些计算，并将数据发送给用户。PHP 被要求执行的计算逻辑由程序员编写的 PHP 脚本定义。这种计算可以简单到“计算此笔订单的税费”，也可以复杂到“判断此用户是否有权访问我们的机密文件”。PHP
    并不负责了解税率，也不负责了解订单详情。它必须从数据库请求订单详情和税率，以完成请求的计算。PHP 不控制订单摘要在用户面前的视觉呈现，因为那是用户浏览器结合
    HTML、CSS、图像和 JavaScript 完成的工作。由于 PHP 拥有定义良好的脚本来获取数据、对数据运行计算并返回结果，因此 PHP 往往是网站显示原始数据（如书籍零售价格列表）的一种简单方式。无论显示原始数据还是处理后的数据，需要向用户展示数据库信息的网站通常都依赖
    PHP。


    Web 的演进与 PHP 的演进密切相关。PHP 的第一个版本被用作更新个人“个人主页”的工具，这也是 PHP 名称的由来。作为一种旨在运行单个页面的服务器语言，PHP
    的健壮性是恰当的，因为当时的网站包含了闪烁的跑灯和动画 GIF 火炬。早期的 Web 不需要处理大数据或移动端电子商务的复杂流水线，PHP 没有理由提供这些功能。随着
    Web 开发者开始扩展对网站的期望，PHP 也随着 Web 的进步而发展。PHP 被重命名为代表 PHP: Hypertext Preprocessor（超文本预处理器），并开始支持现代
    Web 程序员所渴望的功能。


    这种缓慢的演进给 PHP 语言留下了伤痕，包括不一致的命名规范、奇怪的代码顺序要求以及遗留支持问题。考虑询问变量是否已定义（`isset`）、是否为整数（`is_int`）或是否为公共变量（`isPublic`）的函数名。由于
    PHP 对大小敏感，开发者必须记住所有函数的正确拼写，或者随时准备好 PHP 手册。现代编码工具通过代码补全来缓解这个问题，代码补全就像是程序员的自动拼写检查，但函数名可能会让
    PHP 的入门变得异常烦恼。 PHP 文的最佳来源是 [php.net](http://php.net)。


    这种缓慢演进的优势在于 PHP 周全地包含了丰富的功能和各种开发环境。程序员还可以访问 PECL（PHP 扩展社区库），其中包含免费的 PHP 插件，用于扩展对缓存、压缩、数据库连接、图像处理、电子邮件、调试、加密、国际化等的支持。


    ## 环境与设置


    在开始使用某种编程语言之前所需的物理组件（硬件）和程序（软件）被称为开发环境；然而，你的家用和工作电脑可能完全有能力开发 PHP 程序。任何网站在运行实时
    Web 应用时都需要显著更高的硬件，但 PHP 程序员可以在任何普通的工作站上开发和测试应用程序。运行实时 PHP 程序所需的功率取决于观众的规模。


    生产环境中最常见的 PHP 安装使用了一系列普通电脑用户会感到陌生的程序；然而，这在服务器管理中非常常见，以至于获得了一个缩写 LAMP。LAMP 中的每个字母都代表一个程序：Linux、Apache、MySQL
    和 PHP。我们为编写 PHP 建立的测试环境与假设的生产环境之间最重要的区别在于 Linux。Linux 是 Windows 和 Apple OS 系统的服务器版本。作为运行个人电脑的软件，Windows
    和 Apple OS 旨在提供一种视觉化的使用和维护电脑的方法，并在某些程序需要用户注意时提供视觉警报。Web 服务器不需要视觉警报环境，因为服务器的设计是为了在不需要持续监控的情况下运行。Linux
    刻意排除了那些让个人电脑变得具有个性化的软件，以换取额外的动力、稳定性和。


    为了以模拟 Web 服务器上可能发生的情况来测试脚本，程序员会尝试在测试计算机上尽可能地复制生产环境。在学习 PHP 期间，并不强调创建一个完美、甚至是良好的测试环境。只要
    PHP 可以处理开发者所需的脚本并忽略非脚本内容，该环境就可以用于教程。指定某个文件或文件的某部分为 PHP 脚本最简单的方法是使用封装标签，就像 HTML
    本身一样：


    ```php

    <?php echo "Hello World!"; ?>

    ```


    在这个示例中，发送到 PHP 的唯一代码部分是命令 `echo` “Hello World!”。当浏览器查看此页面时，它将看到类似 `<p>Hello World!</p>`
    的内容。还有其他区分 HTML 和 PHP 的方法，例如排除字母 php（`<?php echo “I''m missing the php letters,
    but why?”; ?>`），这在技术上是允许的，但与今天的最佳实践不符。


    PHP 本质上是不一致的，在某些领域，开发者可以通过同意在存在多种方法的情况下使用一种方法来提供帮助。这些约定总和被称为最佳实践或编码标准。大多数最佳实践是常识性的指南，但某些内容管理系统（包括
    Drupal 和 WordPress）在操作这些系统时会增加额外的最佳实践。使用 PHP 构建的项目通常对该系统有经过深思熟的最佳实践。Drupal 作为这些项目最大的一个，已经建立了渗透到通用
    PHP 开发者世界中的指南。关于文档的指南是 Drupal 影响的一个重要最佳实践，但它们并非诞生于 Drupal，而是被标准化的。代码组织、文件组织和文件夹结构与编码本身关系不大，但统一的项目组织方式使得团队工作变得容易得多。以符合最佳实践的方式组织代码和文件，可以确保同事、社区开发者和未来的开发者能够快速理解你的代码。非框架特定的标准代表了创建互操作
    PHP 最佳实践的努力。最著名的非框架标准是 PSR-1，它来自 PHP-FIG 的 PHP 标准建议（[`www.php-fig.org/psr/psr`](http://www.php-fig.org/psr/psr))-1，这是一套经过民主批准并自愿采用的标准。

