    Inline JavaScript takes advantage of special tag attributes that allow you to
    put JavaScript right into an HTML tag so that the HTML object delineated by the
    tag can act based on events. The JavaScript that looks for an event is known as
    an event listener, while the JavaScript that acts in response to the event when
    it is detected is known as an event handler. Here is an example of some simple,
    inline JavaScript:


    <a href="#" onclick="changeColor();">Click this link to change the background
    color</a>


    The onclick attribute calls the function changeColor if the link is clicked. The
    link’s default behavior is handled by using # for the href attribute. In essence,
    we tell the link not to go anywhere when the user clicks on it. This probably
    seems temptingly straightforward. However, inline JavaScript has some inherent
    problems, as will be discussed further when jQuery event handlers are described.


    Adding an external JavaScript file to a web document is easy. Essentially, it
    just involves a script tag that contains an src attribute pointing to a JavaScript
    file, like so:


    <script type="text/JavaScript" src="js/combined.js"></script>


    jQuery


    As previously noted, within its scope, JavaScript is extremely powerful. However,
    it can also be surprisingly unwieldy for simple tasks. Given that JavaScript is
    essentially the “wiring” that allows the elements in a web page to actually do
    useful things, and given that, in most cases, the things you will want your web
    code to do will be driven by the actions of your users (events), it is essential
    to “attach” your JavaScript to objects in a web page. Such attachments initiate
    JavaScript in response to user actions on those elements, such as when a user
    clicks on a button or tries to drag an image. Building these event handlers for
    elements in a web page with pure JavaScript, however, tends to be clunky. Let’s
    say we have a button with the id push_this and we want to activate the function
    doSomething when a user clicks on it. To attach a click event to it in JavaScript,
    our code would look like this:


    [document.getElementById](http://document.getElementById)(''push_this'').addEventListener(''click'',
    function() {doSomething();});


    We could also just add the function to an onclick attribute in the button element
    itself (inline JavaScript), like so:


    <button id="push_this" onclick="doSomething();">


    However, this kind of event handling is sloppy and often leads to unanticipated
    consequences while producing web code that can be difficult to troubleshoot and
    rewrite. It is always best to avoid mixing script and markup languages together,
    since, as noted earlier, all JavaScript that runs in this fashion runs in what
    is known as the “global” scope. In other words, you can run into problems where
    multiple things you are trying to do with JavaScript interfere with each other
    because they are all part of the same scope.


    This whole process can be improved by using a JavaScript library called jQuery.
    The jQuery library is free and can be downloaded from the web to be added to your
    site. jQuery is loaded into your page just like any other external JavaScript
    file, using a script tag:


    <script type="text/JavaScript" src="jquery.js"></script>


    There are also hosted copies of jQuery available online that you can reference
    instead of using a local copy. The advantage is that if those hosted copies are
    on a content distribution network (CDN), they may load into your page for end
    users more rapidly than if they reside on your servers with your web code. The
    down side is that you have no control over those hosted copies, or the servers
    they run on. This can lead to problems from unexpected outages or content servers
    being compromised. I have seen this happen at organizations, so I recommend using
    a local copy of libraries such as jQuery.


    jQuery extends the power of JavaScript, making client-side scripting easier to
    do. Let’s add our event handler to the button we saw previously using jQuery:


    $("#push_this").click(function(){ doSomething(); });


    This event handler is far more compact than the one we built in straight JavaScript,
    and it is more flexible and less likely to cause unanticipated problems than using
    the onclick attribute. Astute readers will also notice that, in selecting an element,
    jQuery uses CSS selector notation (#push_this). jQuery utilizes the “sizzle” selector
    engine, which leverages the extraordinary power of CSS selectors for use with
    scripting.'
