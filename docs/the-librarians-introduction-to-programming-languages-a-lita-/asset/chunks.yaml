  trans: "\n\n## 运算符\n\n*   `! Not !=` 不等于（松散比较）。`!==` 严格不等于。例如，`$josh !== “human”`\
    \ 等同于 `!($josh === “human”)`。\n\n这里还有特殊情况和额外的运算符，包括此处未包含的位运算符。有关所有运算符的权威列表和描述，请访问\
    \ [`php.net/manual/en/language.operators.php`](http://php.net/manual/en/language.operators.php)。PHP\
    \ 拥有与 C 语言相似的控制语句结构（见表 6.2）。\n\n### 表 6.2 常见 PHP 控制语句\n\n| 语句 | 描述 | 示例 |\n| :---\
    \ | :--- | :--- |\n| `if` | 经典的编程“分支”结构。它通常通过比较两个变量形成。 | `if($mary > $frank) {\
    \ echo \"Mary is old\";}}` |\n| `else` | 用在 `if` 语句之后，为开发者提供一种方法，定义当 `if` 语句为假时应该执行的代码。\
    \ | `if($mary > $frank) { echo \"Mary is old\";} else { echo \"Frank is as old\
    \ or older\";}}` |\n| `while` | 一种基础循环，重复执行直到某个条件为假。 | `$x = 0;while($x < 5) {\
    \ echo $x . \", \"; $x = $x + 1;}` 这将输出 0, 1, 2, 3, 4, |\n| `for` | 编写 `while`\
    \ 循环的快捷方法，旨在运行 `$x` 次。 | `for($x =0; $x < 5; $x = $x + 1) {echo $x . \", \";}`\
    \ 这将输出 0, 1, 2, 3, 4, . 与上一个示例相同，但少了两行。 |\n| `for each` | 编写 `for` 循环的快捷方法，旨在处理数组或对象中的每个元素。\
    \ | `$fruits = array(\"A\", \"B\", \"C\");foreach($fruits as $item) {echo $item\
    \ \" \";}` 这将输出 A B C |\n\n## PHP 5 OOP\n\nPHP 的面向对象编程（OOP）风格允许开发者利用高级编程技术，包括设计模式。其他编程语言引领技术世界进入了面向对象时代，导致\
    \ PHP 在这一领域起步稍晚。正如其名称所示的那样，面向对象编程关注作为变量的对象。对象可以执行 PHP 代码并存储其他变量。\n\n在编程语境下，有很多比喻可以帮助理解对象。如果对象并不是显而易见的，请不要气馁，因为从定义上来说它们是抽象的。对象基于易于复用的代码部分。用我们的比喻来来说，鱼先生（Mr.\
    \ Fish）是鱼群的一部分，鱼群中的所有成员除了年龄和在海中的物理位置外，都是相同的。每条鱼都根据其 `DNA` 知道如何游泳、进食和吐泡泡。如果我们能肉眼看到每条鱼，就能判断它是在游泳、进食还是吐泡泡。如果我们改变了鱼先生游泳的方式，鱼群中所有的鱼都会根据这些新的\
    \ DNA 变化而改变。通过对这个比喻进行几个单词替换，我们就可以描述 PHP 中的对象。鱼是对象，`DNA` 是代码，鱼群是类（表 6.3）。\n\n###\
    \ 表 6.3 英语到 PHP 语法\n\n| 英语 | PHP |\n| :--- | :--- |\n| 鱼先生是魭群的一部分。他四岁，在水下十英尺处。\
    \ | `$mrFish = new Mackerel(4);$mrFish->position = -10;` |\n| 鱼先生游向水面。 | `$mrFish->swim(0);`\
    \ |\n| 如果鱼先生正在吐泡泡，他应该吃饭。 | `if($mrFish->is_blowing_bubbles) { $mrFish->eat();}`\
    \ |\n\n开发者将属性（properties）和方法（methods）称为对象的描述和对象可以执行的操作。`Position` 和 `age` 是鱼先生的属性。`Swim`、`eat`\
    \ 和 吐泡泡是鱼先生的方法。\n\n自习室预订系统是图书馆面向对象编程的一个良好示例。房间需要定义方法来预订房间、查看房间何时可用以及提供房间的路线。每个房间都需要定义名称、位置和房间号的属性。预订本身也可以是对象。预订的属性包括房间、日期、时间和读者；方法包括创建、取消、批准、移动房间、更改时间等。总之，一个预订系统可以包含预订、房间、读者和建筑的类。\n\
    \n使用 PHP 进行面向对象编程还提供了急需的代码和文件组织。在应用程序中，为每个类创建一个新的 PHP 文件是最佳实践。对于房间预订系统，每个类都是一个以其包含的类命名的独立文件。预订系统将结构化类似于以下的文件：\n\
    \n*   [`index.php`](http://index.php)\n*   `[folder]`共享\n    *   [`shared.configuration.php`](http://shared.configuration.php)\n\
    \    *   [`shared.database.php`](http://shared.database.php)\n*   `[folder]` 预订\n\
    \    *   [`reservations.buildings.php`](http://reservations.buildings.php)\n \
    \   *   [`reservations.patrons.php`](http://reservations.patrons.php)\n    * \
    \  [`reservations.reservations.php`](http://reservations.reservations.php)\n \
    \   *   [`reservations.rooms.php`](http://reservations.rooms.php)\n\n## 使用设计模式在库中维护复杂的程序\n\
    \n设计模式有详尽的文档，是任何面向对象语言开发者的必修课。这些模式解决了 PHP 中常见的复杂问题。并不是说没有设计模式或没有对象就无法解决复杂问题。特别是图书馆，需要意识到它们的程序将如何适应未来需求，或者可能如何与其他机构共享。毫无疑问，有才华的程序员可以发明解决设计模式可以解决的问题的方法；但这会让后续或团队程序员的代码变得难以理解。此外，设计模式在开源项目中日益增长的趋势表明，随着越来越多的图书馆软件转向社区开发，开发者需要更稳固地掌握设计模式。虽然设计模式不在介绍范围内，但应用程序设计为解决常见的开发挑战提供了一个有趣的介绍。关于“软件设计模式”的维基百科文章是一个极佳的概述（[`en.wikipedia.org/wiki/Software_design_pattern`](https://en.wikipedia.org/wiki/Software_design_pattern)）。\n\
    \n## 示例\n\n此示例将处理将用户输入发送到数据库的表单提交。常见任务充满了安全问题。\n\n"
