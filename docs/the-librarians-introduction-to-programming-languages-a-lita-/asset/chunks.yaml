    \ numerical values as we did in the last example.\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
    >\n<title>Say My Name</title>\n</head>\n<body>\n<script>\nfunction myName(name)\n\
    {\n      var message=\"Hello \"+name+\". We are sending you this message from\
    \ earth orbit. Do not adjust your television!\";\n      alert(message);\n}\n\n\
    var name = prompt(\"Please Enter Your Name: \");\n\nmyName(name);\n</script>\n\
    </body>\n</html>\n```\n\n### Redirect to a Mobile Site Based on Pixel Size\n"
