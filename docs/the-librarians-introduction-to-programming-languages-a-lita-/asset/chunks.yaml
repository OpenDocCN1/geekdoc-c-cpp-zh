    \ competitor language/framework. There are superficial similarities in syntax\
    \ and expression and even in their assumptions about, for example, an object-oriented\
    \ approach to organizing code. An object-oriented language uses classes, or encapsulated\
    \ modules of code that have some unity of function and that expose methods and\
    \ properties, and these classes may be extended or inherited or interacted with\
    \ by other classes. However, probably the largest influence on the genesis of\
    \ C# was the `C` language and its derivative `C++`: the `C#` name reflects this.\
    \ `C` and `C++` were widely used by “serious” programmers, and C# was intended\
    \ to act as a bridge to `.NET` for that audience, but C#’s inventors also also\
    \ wanted to address what they saw as flaws in those earlier languages (Hasan 2012).\n\
    \nAlthough C# shares syntax features with the other C languages, it is far more\
    \ managed. That is, it does a lot of work behind the scenes to ensure a “safe”\
    \ environment that alleviates or negates common programming missteps. An example\
    \ of this is its automated memory management and garbage collection (cleanup of\
    \ unused memory). Programmers in `C` or `C++` were required to assign memory for\
    \ their code to operate in, and then make sure their code cleaned up after itself\
    \ to avoid memory leaks, which could be a finicky operation. How much memory was\
    \ enough to avoid out-of-memory exceptions? How much was too much, causing other\
    \ components to starve? How often and how aggressively should memory be recycled\
    \ after use, keeping in mind garbage collection incurs its own performance cost?\
