    from the IRB section above. You should see ”Hello, Ruby programmer!” in your terminal
    after you run your file. Note that Microsoft Word will not work as a text editor
    in this situation due to the extra information it puts into files, which will
    cause the program not to run.


    Ruby is a wonderful language that allows you to write programs quickly and efficiently.
    Another excellent feature of Ruby is the concept of gems. Gems are bundled libraries
    of Ruby code that are easy to install and use in projects. Even a large web framework,
    such as Ruby on Rails, is packaged as a Ruby gem and can be downloaded and installed
    with only one line of code: gem install rails. Anyone can create a gem and share
    it with the world through [RubyGems.org](http://RubyGems.org), a gem hosting service
    for the Ruby community.


    Uses


    Ruby is most commonly used in web development, and the Ruby on Rails framework
    is based on the Ruby programming language. Smaller frameworks, including Sinatra
    and Middleman, allow dynamic websites to be created easily and are powered by
    Ruby. Ruby is very effective at powering the server side of websites, which allows
    your computer to connect to a server that can deliver the data you need.


    Because Ruby is natively built into Macs and easy to install on Windows machines,
    it is useful for parsing small data sets. For example, if you have a thousand
    records containing patron data but you only need to access their email addresses,
    you can write a small script that will take that data and export only the email
    addresses to a new file for use in a newsletter.


    Several large frameworks used in library and information sciences are based on
    Ruby. Project Blacklight, Hydra, and Avalon are all built with Ruby; thus having
    even a basic knowledge of how Ruby works will help with the installation, development,
    and maintenance of these frameworks.


    Project Blacklight ([http://projectblacklight.org](http://projectblacklight.org)/)
    is an open-source project that allows for access and discovery of library materials.
    It runs on Ruby on Rails and works with Apache Solr to make searching library
    collections easier. Blacklight is bundled as a gem that can then be used when
    creating a new Rails instance.


    Project Hydra ([http://projecthydra.org](http://projecthydra.org)/) is a digital
    repository with software components built as Ruby gems. Hydra is used as a digital
    asset management framework as well as a framework for providing access to digital
    collections. Like Blacklight, Hydra is bundled as a gem that works with Rails
    and several other gems to create the digital repository.


    Avalon Media System ([http://www.avalonmediasystem.org](http://www.avalonmediasystem.org)/)
    is based on Project Hydra and is intended to handle a library or archive’s digital
    audio and visual assets, and provide access to those assets via a web interface.
