    The syntax is similar to Perl, and the semantics are similar to Smalltalk.


    Environment and Setup


    Ruby comes packaged by default on Mac machines. Additional versions of Ruby and
    other relevant programs can be installed using HomeBrew ([http://brew.sh](http://brew.sh)/),
    a package manager for Mac operating systems. This package manager is built in
    Ruby! If you are using a Windows machine, you will have to install Ruby because
    it is not natively packaged. There is a project called RubyInstaller that can
    help ([http://rubyinstaller.org](http://rubyinstaller.org)/) facilitate this installation.


    To start using Ruby immediately, you can open up the Interactive Ruby Shell, or
    IRB. IRB comes packaged with Ruby, so it is installed when Ruby is installed.
    The ability to get started quickly and to start writing code immediately after
    the installation of the language is one of Ruby’s strengths.


    The IRB is a “shell” that allows you to safely write and test Ruby code in your
    computer’s Terminal. On Macs, typing irb will open it up on your screen. Typing
    quit will quit the program and take you back to your regular Terminal screen.
    Ctrl-D will also quit the program. To open up the IRB on a Windows machine, you
    can click Start and select Interactive Ruby from your menu.


    You can try out programming in Ruby by opening up IRB and entering the following
    code:


    name = "Ruby programmer"


    puts "Hello, #{name}!"


    In this mini program, name is a “variable,” a type of storage location, which
    now contains the phrase “Ruby programmer.” The second line tells Ruby to insert
    the contents of the variable name into the phrase “Hello, _____!” and output the
    final phrase ”Hello, Ruby programmer!” to the screen.


    When you exit the IRB, your code will disappear as well. Instead of using the
    IRB, you can also write a Ruby program. Writing Ruby in a text editor, such as
    SublimeText, Atom, or TextWrangler, and saving it as an .rb file will create a
    Ruby script file. This file can then be run on the command line by typing ruby
