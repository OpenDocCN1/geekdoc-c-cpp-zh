    var authors = new List<string>();\nwhile (iterator.MoveNext()) {\n    authors.Add(navigator.Value);\n\
    }\n\n// 通过 LINQ 获取作者\nvar xml = XElement.Parse(rawXml);\nvar authors =\n    from\
    \ e in xml.Descendants(\"Author\")\n    select e.Value;\n```\n\nLINQ 版本要简单得多！编写更快，阅读更易。XPATHPATH\
    \ 版本受困于过多的变量和复杂的多个步骤过程。当我阅读它时眼睛都看直了，而这还是我自己写的。XPATH 表达式本身没有问题，实际上确实有在 LINQ to\
    \ XML 中处理 XPATH 的方法，但在大多数情况下你甚至不需要它。\n\n## SQL 示例\n\n两个表分别代表书籍（表 9.1）和作者（表 9.2），中间有一个连接表，以便为每本书分配多个作者（表\
    \ 9.3）。表 9.4 显示了 BooksToAuthor 的结果。\n\n### 表 9.1.书籍信息\n\n| BookId | Title | Genre\
    \ | PublishDate | Description |\n| :--- | :--- | :--- | :--- | :--- |\n| book001\
    \ | The Adventures of Captain Underpants | YA Fiction | April 30, 2013 | George\
    \ and Harold have created the greatest superhero in the history of their elementary\
    \ school—and now they’re going to bring him to life! |\n| book002 | LINQ Pocket\
    \ Reference | Nonfiction | March 7, 2008 | This guide has the detail you need\
    \ to grasp Microsoft’s new querying technology, and concise explanations to help\
    \ you learn it quickly. |\n\n### 表 9.2. 作者信息\n\n| AuthorId | Name |\n| :--- |\
    \ :--- |\n| 1 | Pilkey, David |\n| 2 | Albahari, Ben |\n| 3 | Albahari, Joseph\
    \ |\n\n### 表 9.3. 书籍、作者与书籍作者关系\n\n| Books | BooksToAuthors | Authors |\n| :---\
    \ | :--- | :--- |\n| BookId | Id | AuthorId |\n| Title | BookId | Name |\n| Genre\
    \ | AuthorId | |\n| PublishDate | | |\n| Description | | |\n\n### 表 9.4. 书籍作者关系\n\
    \n| Id | BookId | AuthorId |\n| :--- | :--- | :--- |\n| 1 | book001 | 1 |\n| 2\
    \ | book002 | 2 |\n| 3 | book002 | 3 |\n\n### SQL 查询对比：原生 SQL\n\n以下是 Transact-SQL\
    \ (T-SQL) 中的 `select` 语句：\n\n```sql\nSELECT\n    b.BookId,\n    b.Title,\n   \
    \ b.Genre,\n    a.Name AS Author\nFROM Books b\nINNER JOIN BooksToAuthors b2a\
    \ ON b2a.BookId = b.BookId\nINNER JOIN Authors a ON a.AuthorId = b2a.AuthorId\n\
    WHERE b.Title LIKE \"LINQ%\"\n```\n\n`select` 查询的结果如表 9.5 所示。\n\n### 表 9.5. 查询结果\n\
    \n| BookId | Title | Genre | Author |\n| :--- | :--- | :--- | :--- |\n| book002\
    \ | LINQ Pocket Reference | Nonfiction | Albahari, Ben |\n| book002 | LINQ Pocket\
    \ Reference | Nonfiction | Albahari, Joseph |\n\n尽管有一本书符合查询条件，但结果被去规范化为两行，每个作者各占一行。可以使用\
    \ SQL 将作者合并为单行，但这需要一些技巧。即使将作者连接（concatenate）到同一列中，它们也会变成一个单一值，例如 `Albahari, Ben|Albahari,\
    \ Joseph`。人类肉眼可以很容易地理解该值是两个合并的子值，但除非被告知要分割，否则计算机并不知道它们是独立的实体。这并非不可能的任务，只是不符合理想。另一种方案是获取这两行并编写代码根据\
    \ `id` 手动将它们合并，以准确反映数据作为单一标题的真实本质。如果查询结果已经反映了这一点难道不是更好吗？\n\n### SQL 查询对比：LINQ\n\
    \n下面的 LINQ 语句与上面的 SQL 内部连接（inner join）基本等，但在这种情况下实际上不需要显式的连接语法即可获取所需。变量 `db` 代表\
    \ SQL 数据库对象，并假设在配置 LINQ 作为对象关系映射（ORM）过程的一部分时已经定义。因此，它了解 SQL 表、列类型和关系。简而言之，这就是\
    \ LINQ to SQL 强大之处的大部分：我们不需要在每次编写查询时都定义连接，而是提前解释这些关系，并从更简洁的代码中获益。\n\n我们动态创建一个作者集合，以便将多个作者分组在一起，并过滤出有作者的书籍。\n\
    \n```csharp\nvar books =\n    from b2a in db.BooksToAuthor\n    where b2a.Books.Title.StartsWith(\"\
    LINQ\")\n    let authors = b2a.Authors.Name\n    where authors.Any()\n    select\
    \ new CatalogBook\n    {\n        Id = b2a.BookId,\n        Title = b2a.Books.Title,\n\
    \        Genre = b2a.Books.Genre,\n        Authors = authors\n    };\n```\n\n\
    查询的结果始终是一个 `enumerable` 集合。在这种情况下，变量 `books` 包含了每个匹配项的 `CatalogBook` 对象。我们本可以为每个创建一个匿名对象，省去在某处定义\
    \ `CatalogBook` 类型的麻烦，但使用强类型类如 `CatalogBook` 替代匿名对象的优势是，我们在处理它时总是知道会有什么。`CatalogBook`\
    \ 的实例将具有一个值数组属性 `Authors`，而不是有时是数组有时是单一值。预知是 . . . er，力量：我们可以在代码的其他地方继续使用 `CatalogBook`，且始终保持相同的预期，而无需手动解释或转换数据库查询的结果。\n\
    \n将数据库结果立即映射到强类型对象还有另一个更细微的好处，即如果数据库结果不符合对象的预期，将在该点发生错误。错误！没错——而且这是好事。“尽早失败，经常失败”这一建议听起来违背直觉，但由于错误可以在代码中被捕获和处理，因此越早知道问题在何时、何地以及是如何发生的就越好。被放任的问题会在以后引起问题，那时将更难诊断并追溯到其实的源头。“Enumerable”意味着该集合可以进行循环，如下所示的\
    \ `foreach` 结构：\n\n```csharp\nforeach (var book in books) {\n    Console.WriteLine(string.Format(\"\
    {0}, {1}, {2}, {3}\",\n        book.BookId,\n        book.Title,\n        book.Genre,\n\
    \        string.Join(\"; \", book.Authors));\n}\n```\n"
