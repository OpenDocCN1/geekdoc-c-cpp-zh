  trans: '

    Eric Phetteplace 是加州艺术学院的系统图书管理员，他的主要职责是维护和开发网站、机构存储库以及 `ILS`。在此之前，他曾在切萨皮克学院担任过兴技术图书管理员。他拥有斯坦福大学的英语和数学文学理学双学士学位，以及伊利诺伊大学厄尔巴纳-香槟分分校的
    `MLIS` 学位。2015 年，他曾由知识共享（Creative Commons）组织的首届开放领导力学院的研究员。在空闲时间里，他喜欢玩 Netrunner
    卡牌游戏，并会在 `GitHub` 上钻研代码。


    Tim Ribaric 自 2006 年以来一直是布鲁克大学的数字服务图书管理员。除了拥有 `MLIS` 学位外，他还有计算机科学本科学位，目前正在完成计算机科学硕士学位。他的大部分工作在
    `Python` 中完成，但他对自己起步的 `C` 语言有独钟。


    Jessica Rudder 是 Flatiron School 的一名开发者，她专注于构建 Web 应用程序，帮助成年人和高中生学习 `Ruby` 和 `Objective-C`
    编程。她是 Flatiron School Web Immersive 项目的毕业生。除了技术培训外，她还拥有纽约大学蒂晓艺术学院的美术学士学位。她曾为多个品牌从事数字营销工作，包括迪士尼以及比利时、葡萄牙和瑞典的主要欧洲黄页公司。


    Jason Steelman 拥有南加利尼亚大学（USC）的媒体艺术学士学位，目前在爱荷华州迪梅因的 Robert Half Technology 担任顾问。他是企业、学术机构和非营利机构的开发者和技术领袖。他的图书馆经验包括在南卡罗来纳大学从事
    William Gilmore Simms 计划、影像研究收藏、Thomas Cooper 图书馆以及 Ernest F. Hollings 特别收藏图书馆的工作。最近的领导经历包括南卡罗来纳大学的交互式富媒体教育环境计划，他是该项目的负责人。


    Peter Tyrrell 是位于不列颠省哥华 Andornot Consulting 的董事兼首席开发人员（`http://andornot.com`）。他于
    1998 年毕业于维多利亚大学，获得古典和英语文学学士学位，并于 2003 年获得英属哥伦伦比亚大学的 `MLIS` 学位。他于 2001 年受雇于 Andornot，并在
    2010 年成为股东董事。他喜欢编程，并认为研究如何让程序运行是最有趣的事情。Tyrrell 认为自己能通过修理问题很幸运。他为各种图书馆、档案馆和博物馆提供咨询，每天都会编写代码，通常使用
    `.NET` 和 `C#`。


    Dean Walton 是俄勒冈大学的科学技术推广图书管理员。他是生物、地质和环境研究领域的学科专家，并致力于与图书馆及其学科领域相关的体验学习计划。他的其他兴趣还包括灾害信息学、生态制图和环境传感器系统。他拥有生物科学博士学位，曾是自然保护会以及弗吉尼亚和西弗吉尼亚自然遗产计划的植被生态学家。


    Roy Zimmer 在西密根州大学图书馆系统办公室工作。他曾使用过 `NOTIS`、`Voyager` 以及现在的 `Alma+Primo` 图书系统。他编写了许多供任何人使用的
    `MARC` 工具。他开发了一个用于良好索书号排序的规范化程序。在图书馆使用 `Voyager` 期间，他实现了许多供应商记录数据加载，并编写了提取程序以供
    `MeLCat`（密歇根州电子目录，一个州际馆际借关系）使用。随后，他将这些提取程序适配于图书馆使用的发现服务：开源 `VuFind` 和商业产品 `Summon`。他在多次用户小组会议上做过报告。

    '
