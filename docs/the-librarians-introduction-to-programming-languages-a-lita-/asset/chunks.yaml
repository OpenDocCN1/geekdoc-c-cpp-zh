    搭建一个用于编写和编译 C 程序的环境对于每个操作系统来说略有不同。在 Linux 或 Mac OS 环境中，基础工具是开箱即用的，而在 Windows 环境中，则需要在计算机上安装一些额外的工具。这种差异源于这两类操作系统的血缘。UNIX
    及其后代被称为 `POSIX` 兼容系统。该缩写代表“可移植操作系统接口”（Portable Operating System Interface），它是
    IEEE 编写的一项标准，概述了操作系统必须具备的某些要素。这些前提条件大部分与 C 语言的实现细节以及特定的 Linux 实用程序。Windows 的演进路径与
    UNIX 是独立且不同的，因此 `POSIX` 兼容性从未是该操作系统的驱动因素。


    重要的的一点是，`POSIX` 标准的主要目标是确保系统之间的兼容性（Isaak 1990）。这与之前提到的 C 语言的原始目标是一致的，即作为一种可以通过编译
    C 代码来构建 UNIX 的语言。符合 `POSIX` 标准的操作系统隐式地包含了编写 C 代码所需的所有工具。相反，Windows 并不是 `POSIX`
    兼容操作系统，获取基础工具需要安装一个软件，让你的 Windows 计算机表现得更像基于 UNIX 的机器（Daintith and Wright 2008）。然而，在按照下面描述的方法配置计算机后，你可能不想开始编写企业级代码；本章严格来说是一个入门课程，将为你提供关于
    C 语言是什么以及它与其他语言区别的初步体验。


    ## Linux 和 Mac OS


    正如刚才提到的，工具是开箱即用的。我们的研究将使用两个工具。首先是 GCC，代表 GNU C 编译器（GNU C Compiler）。如果你打开 `Terminal`
    窗口并输入 `gcc` 然后按回车，你可能会看到一些错误和如 `compilation terminated` 的消息，这实际上意味着编译已完成。太棒了，这很简单。其次，使用任何文本编辑器输入代码。我们将使用
    `nano`。在 Linux（在此情况下为 Ubuntu）和 Mac OS 中，`nano` 都是预装的。要进行验证，打开 `Terminal` 并输入 `nano`。你将看到屏幕上画出一个原始的界面。按
    `Ctrl + X` 退出。完成。现在将此与 Windows 的说明进行对比。


    ## Windows


    你需要的 C 工具版本并未随 Windows 发行。然而，如果你安装了某个版本的微软 Visual Studio，它将带有所需的工具。但在我们的案例中，我们将采取一些不同的做法。我们将安装一个名为
    `Cygwin` 的工具。`Cygwin` 本质上是一个帮助你在 Windows 中重现 Linux 环境的软件。`Cygwin` 的额外好处是它允许你运行其他有趣且非常有用的
    UNIX shell 命令，例如 `more` 和 `echo`。稍后会详细介绍。


    首先，从 `http://cygwin.com/install.html` 下载正确版本的 Cygwin。为了方便起见，先尝试 64 位版本，如果不起作用再尝试
    32 位。一旦运行下载的文件，系统将提示你进行多次点击。你需要选择一个下载站点（图 8.2）；任何站点都可以。


    ![](img/Figure_8.2.jpg)


    图 8.2. 选择下载站点界面。


    你也可以选择地理位置较的站点以加速下载。只需寻找与你的所在地匹配的域名即可。一旦安装了基础系统，将提示你安装你需要的包。这里有很多选项，但我们要做的只是展开
    `Devel` 复选框并点击双向箭头，这样所有内容都会被安装。它看起来应该像图 8.3 所示。


    ![](img/Figure_8.3.jpg)


    图 8.3. Cygwin 设置 Devel 安装。


    “Bin?” 下方的框将从空方框变为带钩的方框。现在搜索 “nano”，展开 `Editors`，点击 `Skip` 将其切换为带钩方框（图 8.4）。


    ![](img/Figure_8.4.jpg)


    图 8.4. 选择 Editors 界面。


    点击几次 `Next`，等待下载并安装。在最后一步点击 `Finish` 完成过程。在开始菜单中寻找 `Cygwin Terminal` 或类似的内容。结果是一个带有闪烁光标的框，准备让你输入。


    ## 示例


    在开始一些实际示例之前，我们需要对创建 C 程序所涉及的步骤进行通俗概述：


    *   编写应用程序的源代码。源代码扩展名为 `.c`。

    *   将源代码编译成中间“对象文件”，该文件介于人类可读代码和计算机将运行的二进制指令之间。

    *   将新生成的对象文件与额外的对象文件链接，这些额外的文件引入了应用程序所需的内置库函数。例如，如果你的程序包含了处理文件的代码，你将链接到提供此功能的对象文件。这些内置函数的人类可读版本保存在扩展名为
    `.h` 的头文件中。

    *   最后一步是创建一个可以在 `Terminal` 命令行上独立运行的可执行文件。


    在我们的检查中，我们将对这些步骤进行简写，以便理解。


    ## Hello World


    打开 `Terminal` 窗口（取决于你的系统为 Cygwin）并输入：


    ```

    nano helloworld.c

    ```


    你将看到一个原始的文本编辑器界面。输入以下内容：


    ```c

    /* Hello World program */

    #include<stdio.h>


    main() {


    printf("Hello World\n");

    }

    ```


    按 `Control + O` 保存文件。然后按 `Control + X` 退出。一旦回到命令行，输入以下：


    ```

    gcc helloworld.c

    ```


    这会将你的程序编译并链接成可执行文件。


    ```

    ls

    ```


    这将显示当前文件夹/目录的内容。


    ```

    ./a.out

    ```


    这将运行你的程序。`a.out` 是 `gcc` 编译出的默认程序名称。我们在命令开头加上 `./` 是因为我们正在指示先查看当前目录。`.` 是一个引用当前目录的快捷操作符。当我们想要引用目录中的某个内容时，我们使用
    `/` 字符。


    在经过这些魔法操作后，只完成了最基础的任务。这是遵循所有步骤后命令行终端的输出：


    ```

    >nano helloworld.c

    >gcc helloworld.c

    >ls

    a.out helloworld.c

    >./a.out

    Hello World

    ```


