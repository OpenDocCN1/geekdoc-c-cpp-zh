    \n### 授权示例\n\n```csharp\n[Authorize(Roles = \"Administrator, Super User\")]\n\
    public ActionResult Admin() {\n    return View();\n}\n```\n\n接下来，检查客户端请求以获取如何操作的信号。这些信号可能编码在请求的\
    \ URL 路径中，或者在查询字符串中以键值对的形式参数化，或者是随请求包中提交的与 URL 值完全无关的任意数据（包括 cookie）。还可以查看请求头——这些头通常包含关于请求和请求者的元信息。然后，获取满足客户端请求所需的任何内容。这可能需要查询数据库或其他数据源。\n\
    \n### 永久链接示例\n\n```csharp\npublic class HomeController : BaseController {\n  \
    \  private readonly ISearchService _searchService;\n    private readonly ILogger\
    \ _logger;\n    public HomeController(ISearchService searchService, ILogger logger)\n\
    \    : base(logger) {\n        _searchService = searchService;\n        _logger\
    \ = logger;\n    }\n/*\n\n永久链接 URL 可能是 http://example.andornot.com/permalink/123，但除非我们显式检查，否则我们在这一层并不知道。URL\
    \ 在早的路由代码中经过检查，如果匹配到永久链接模式，则会将 ID 部分发送到这里。这意味着你可以有多个模式路由到此 Permalink 方法。\n*/\n\
    \n    public ActionResult Permalink(string id) {\n        if (string.IsNullOrEmpty(id))\
    \ {\n            /*\n            不向视图传递模型等同于传递 null。视图可以检查模型是否为空并显示“无此类永久链接”的内容。\n\
    \            */\n            return View(\"Permalink\");\n        }\n/*\n    \
    \    ISearchResults 是我们在别处定义的代码，用于存储搜索引擎返回的搜索结果信息。搜索服务也是我们编写的与搜索引擎通信的代码。因此，“模型”将封装有关搜索引擎查询的所有信息，包括如果搜索成功时对应\
    \ ID 的结果。\n*/\n        ISearchResults model = _searchService.Single(id);\n/*\n\
    \        视图负责样式和渲染模型中持有的原始搜索结果数据。这是你看到 HTML 的地方。\n*/\n        return View(\"Permalink\"\
    , model);\n    }\n}\n```\n\n将原始信息传递给视图，在视图中将其绑定到 HTML 或用于做出如何构建 HTML 的决策。\n\n\
    ### 永久链接视图示例\n\n```razor\n@model ISearchResultModel // 注意：原文中此处应为模型定义\n/*\n此视图包含在通用布局视图的\
    \ HTML 包装中。\n*/\n```\n此处根据原文代码块翻译：\n```razor\n@model ISearchResultModel\n\n@{\n\
    /*\n此视图包含在通用布局视图的 HTML 包装中。\n*/\n    Layout = \"~/Views/Shared/_Layout.cshtml\"\
    ;\n/*\n模型包含作为强类型文档集合的搜索结果。Model.Documents 的类型为 List<Document>。\n*/\n    var doc\
    \ = Model.Documents.SingleOrDefault();\n    string title = doc == null ? \"Bad\
    \ Permalink\" : doc.Title;\n/*\nViewBag 是内置于视图的动态集合（“袋”）。它提供了一种在视图与视图之间传递任意信息的方便方法。这里的标题将被分配给布局中的\
    \ HTML 标签。\n*/\n    ViewBag.Title = title;\n}\n@if (doc == null)\n{\n    <ul>\n\
    \        <li>\n            <h2><span class=\"text-found\">未找到</span>该 ID 的文档。<span\
    \ class=\"divider\"> </span></h2>\n        </li>\n        <li>\n            那里是拼写错误吗？请重试，或者尝试改用\
    \ @Html.ActionLink(\"新搜索\", \"Index\", \"Home\")。\n        </li>\n    </ul>\n\
    }\nelse\n{\n    <div class=\"permalink-view\">@{\n/*\n在这里我们将模型传递给共享视图，在共享视图中，如果单个搜索结果是搜索结果集的一部分，它将以相同的方式布局。我们不需要仅为永久链接视图重新创建布局，并且保持了\
    \ DRY（不要重复自己）。\n*/\n    Html.RenderPartial(\"_List\", Model);\n}\n    </div>\n\
    }\n```\n\n## 优缺点\n\n有两组 C# 的优缺点需要考虑：与其他编程框架相比的 C# 和 .NET，以及与 .NET 框架内其他语言相比的 C#。\n\
    \n### C# 和 .NET 与其他框架的对比\n\n选择与何种编程框架或环境一起工作是基础性的：这一决定将影响你从今以后做的一切，从编写软件时使用的工具到它可以部署的操作系统。框架将影响你的设计、你解决问题的方法，甚至你可能遇到的问题类型。框架对思维的影响是微妙但深远的，这就是为什么框架倾向于产生编程文化的原因。\n\
    \nJava 国家与 .NET 王国隔着一个海洋，尽管它们都距离那片由 Ruby on Rails 土地、PHP 霸权和 Python 公国组成的人类大陆有万里之遥。这些国家和其他少数国家都有自己独特的边界、死忠的爱国者和无休止的竞争。必须以审慎的态度对待其他者对框架的任何批评。反之，建议可能带有真信者的热情，必须以怀疑的态度来看。我认为人们习惯于为自己选择的群体激烈辩护其优点，但在编程问题上，事实是它们都绰绰有余。\n\
    \n合理的做法是选择你容易获取、运行在你熟悉的操作系统上运行、并且在需要帮助时可以寻求的支持和理解的编程框架和语言。更不用说你可能会在这一决定上投入多年的人生——中途换马是不明智的。在做出框架决定时，你应该问自己以下问题：\n\
    \n* 你是否可以轻松地在计算机上设置所需的编辑工具？\n* 或者更好，是否可以使用你已经拥有并喜欢的编辑器？\n* 调试你编写的代码有多容易？\n* 你是否需要将代码编译成程序集或可执行文件，还是它作为脚本直接运行？\n\
    * 你将你制作的东西部署在何处，目标机器运行需要什么？例如，Web 需要复杂的 Web 服务器堆栈，而命令行工具只是谦虚地需要几个基础要求。\n\n###\
    \ C# 和 .NET 的优点\n\n* 文档齐全，有官方和非官方来源的广泛报道。\n\n"
- fmt: "\n*   Wide body of practitioners to commiserate and share information with.\n\
    *   Mature: fifteen years of iterative releases means that `C#` is full featured\
    \ yet filled with labor-saving shortcut expressions.\n*   Strong choice in a Windows\
    \ environment: `.NET` is embedded in every Windows OS.\n*   Cloud server architecture\
    \ is available with Microsoft Azure.\n*   The `.NET Core Framework`, `ASP.NET\
    \ 5` for building web applications, and the `C#` compiler `Roslyn` are open source\
    \ as of November 2014 (Landwerth 2014).\n*   Backed by Microsoft.\n*   Microsoft\
    \ has vast resources and a vested interest in the success and uptake of its programming\
    \ framework.\n*   The past decade has seen Microsoft’s developer arm become progressively\
    \ more open and responsive to practitioners.\n\nWhen using `C#`, there are fewer\
    \ solutions and tools to choose from when approaching a problem, compared to some\
    \ completely community-guided open-source frameworks. This may seem like a con\
    \ at first glance, but it is a blessing in disguise. Generally, it means there\
    \ is a “right” or at least “best” way to do something, often certified by Microsoft\
    \ professionals, as opposed to a myriad of opinions and overlapping or redundant\
    \ tools to sift through and choose from. Democracy is a wonderful thing but not\
    \ necessarily as efficient as a benevolent dictatorship.\n\n## C# and .NET Cons\n\
    \n*   Historically tied to Windows, though upcoming releases will broaden support\
    \ to MacOS, iOS, Linux, and Android.\n*   The complexity of the development environment,\
    \ and the relative difficulty of initial setup.\n\n## Visual Studio\n\nYour programming\
    \ environment will almost inevitably rely on `Visual Studio`, the integrated development\
    \ environment (IDE) produced by Microsoft. It is a powerful suite of tools, but\
    \ its very power and complexity can be daunting. Microsoft likes to refer to `Visual\
    \ Studio` and `.NET` as a developer “ecosystem,” which should give you a clue\
    \ as to its sheer enormity and diversity. `Visual Studio` is a code editor with\
    \ syntax highlighting and code completion for all its included languages, plus\
    \ `CSS`, `XML`, `JavaScript`, and other types of resources.\n\nCode you write\
    \ requires compilation into an assembly or executable, which means you need a\
    \ compiler. `Visual Studio` is both a code editor and a compiler. It is technically\
    \ possible to compile code without `Visual Studio`, but that is quite an advanced\
    \ feat.\n\nDebugging (that is, stepping through the source code of an assembly\
    \ or executable that is currently running in order to watch what is happening\
    \ as it happens) becomes necessary once your code hits a certain level of complexity.\
    \ Debugging requires a debugger and some investment of time to learn how to do\
    \ it effectively. `Visual Studio` is the only practical choice as a debugger for\
    \ `.NET` code.\n\nThe good news about `Visual Studio` is that, while professional\
    \ versions of `Visual Studio` cost hundreds of dollars per license, a free version\
    \ called `Visual Studio Community Edition` (previously called `Visual Studio Express`)\
    \ is available. `Community Edition` may be used by individual developers or those\
    \ working for “non-enterprise organizations” to develop free or paid apps. The\
    \ `Community Edition` is not function-limited like its ancestor `Visual Studio\
    \ Express`, and the license terms are quite generous since “enterprise” is defined\
    \ as an organization with over 250 PCs or greater than one million dollars in\
    \ annual revenue. Even within an enterprise, `Community Edition` may be used to\
    \ contribute to open-source projects, for academic research, or for classroom\
    \ learning scenarios.\n\n## C# versus Other Languages within .NET\n\nOver thirty\
    \ languages can be used to program `.NET` ([https://en.wikipedia.org/wiki/List_of_CLI_languages](https://en.wikipedia.org/wiki/List_of_CLI_languages)).\
    \ Apart from `C#`, which enjoys the widest use, notable examples include `Javascript`,\
    \ `Ruby`, and `Python`, in the forms of `Managed JScript`, `IronRuby`, and `IronPython`.\n\
    \nThere are many technical features of `C#` that require a lot more explanation\
    \ than we have room for here, and whether they are pros or cons compared to other\
    \ languages depends greatly on your own perspective. Suffice it to say, `C#` has\
    \ many tricks and labor-saving devices that will help you express your intent\
    \ concisely, along with safety nets designed to save you from yourself. Here is\
    \ a short list of features that will reward your efforts to learn more about them:\n\
    \n*   Strict typing, anonymous types, type safety\n*   Object oriented, with multiple\
    \ inheritance via interfaces\n*   `LINQ`\n*   `Generics`\n*   Lambda expressions\
    \ and functional programming\n*   Nullable types\n*   Metaprogramming via attributes\n\
    \n## Examples\n\n### LINQ\n\n`LINQ` stands for `Language-Integrated Query`. It\
    \ provides a set of patterns for querying and updating that smooth out and abstract\
    \ away the idiosyncrasies of the data store being worked with. `LINQ to Objects`,\
    \ `LINQ to XML`, and `LINQ to SQL` are providers included by default in the `.NET`\
    \ framework (Microsoft Developer Network n.d.), such as `LINQ to JSON` and `LINQ\
    \ to ODATA`.\n\nThe advantage of `LINQ` is that the patterns are relatively easy\
    \ to learn and, once mastered, give you a standard approach to working with a\
    \ variety of data sources. Without `LINQ`, you are obligated to write many lines\
    \ of helper code to support the operations you are actually interested in using,\
    \ and you need to understand the vagaries of the underlying data store much more\
    \ deeply. Further, `LINQ` is able to simplify greatly statements that are complicated\
    \ and messy in the original language—this is particularly true with `SQL` (Albahari\
    \ nd). `LINQ` saves a lot of time and brain capacity.\n\nSpeaking of `SQL`, you\
    \ may find `LINQ` operators reminiscent of `SQL` syntax. This is not because we\
    \ are querying an `SQL` database necessarily but because of convergent evolution:\
    \ these operators are efficient expressions. Although `LINQ` syntax is influenced\
    \ by `SQL` languages, it looks the same no matter the nature of the underlying\
    \ data source.\n\n### Tools Needed\n\nYou will need `LINQpad` ([http://www.linqpad.net](http://www.linqpad.net))\
    \ or `Visual Studio` IDE ([https://www.visualstudio.com](https://www.visualstudio.com)).\n\
    \n### LINQ to Objects\n\nAny object in the `.NET` framework that is enumerable\
    \ can be manipulated with `LINQ`. All the built-in collection classes inherit\
    \ either `IEnumerable` or `IEnumerable<T>` interface, and anyone can write a new\
    \ collection that does the same. An interface is a template that forces you to\
    \ add its named methods or properties to your code. `IEnumerable` makes you add\
    \ a method `GetEnumerator()`, for instance. How you write that method and get\
    \ it to return an `IEnumerator` object like it’s supposed to is up to you. The\
    \ interface just enforces the method signature.\n\nArrays and lists are examples\
    \ of commonly used enumerable collections. We would normally use the `foreach`\
    \ operator to enumerate them, but we can also use `LINQ`, particularly if we intend\
    \ to return a subset.\n\n```csharp\nstring[] array = new string[] {\"Chupacabra\"\
    , \"Sasquatch\", \"Honest Politician\"};\n\n// load 'rarities' via foreach\nvar\
    \ rarities = new List<string>();\nforeach (string item in array) {\n  if (item.StartsWith(\"\
    Honest\")) {\n    rarities.Add(item);\n  }\n}\n\n// load 'rarities' via LINQ\n\
    var rarities =\n  from item in array\n  where item.StartsWith(\"Honest\")\n  select\
    \ item;\n```\n\nThe advantages of the `LINQ` version might not be immediately\
    \ obvious, but:\n\n*   It declares and sets the `rarities` variable in a single\
    \ statement, which, when reading the code, eliminates any ambiguity as to what\
    \ rarities will be used for. \n*   The overall purpose of the snippet is easier\
    \ to understand at a glance. A `foreach` loop only tells you there is going to\
    \ be an iteration, not what the iteration is going to achieve, whereas the `LINQ`’s\
    \ `select` operator signals the statement’s intent clearly.\n\n### LINQ to XML\n"
  raw: '*   Wide body of practitioners to commiserate and share information with.


    *   Mature: fifteen years of iterative releases means that C# is full featured
    yet filled with labor-saving shortcut expressions.


    *   Strong choice in a Windows environment: .NET is embedded in every Windows
    OS.


    *   Cloud server architecture is available with Microsoft Azure.


    *   The .NET Core Framework, ASP.NET 5 for building web applications, and the
    C# compiler Roslyn are open source as of November 2014 (Landwerth 2014).


    *   Backed by Microsoft.


    *   Microsoft has vast resources and a vested interest in the success and uptake
    of its programming framework.


    *   The past decade has seen Microsoft’s developer arm become progressively more
    open and responsive to practitioners.


    When using C#, there are fewer solutions and tools to choose from when approaching
    a problem, compared to some completely community-guided open-source frameworks.
    This may seem like a con at first glance, but it is a blessing in disguise. Generally,
    it means there is a “right” or at least “best” way to do something, often certified
    by Microsoft professionals, as opposed to a myriad of opinions and overlapping
    or even redundant tools to sift through and choose from. Democracy is a wonderful
    thing but not necessarily as efficient as a benevolent dictatorship.


    C# and .NET Cons


    *   Historically tied to Windows, though upcoming releases will broaden support
    to MacOS, iOS, Linux, and Android.


    *   The complexity of the development environment, and the relative difficulty
    of initial setup.


    Visual Studio


    Your programming environment will almost inevitably rely on Visual Studio, the
    integrated development environment (IDE) produced by Microsoft. It is a powerful
    suite of tools, but its very power and complexity can be daunting. Microsoft likes
    to refer to Visual Studio and .NET as a developer “ecosystem,” which should give
    you a clue as to its sheer enormity and diversity. Visual Studio is a code editor
    with syntax highlighting and code completion for all its included languages, plus
    CSS, XML, JavaScript, and other types of resources.


    Code you write requires compilation into an assembly or executable, which means
    you need a compiler. Visual Studio is both a code editor and a compiler. It is
    technically possible to compile code without Visual Studio, but that is quite
    an advanced feat.


    Debugging (that is, stepping through the source code of an assembly or executable
    that is currently running in order to watch what is happening as it happens) becomes
    necessary once your code hits a certain level of complexity. Debugging requires
    a debugger and some investment of time to learn how to do it effectively. Visual
    Studio is the only practical choice as a debugger for .NET code.


    The good news about Visual Studio is that, while professional versions of Visual
    Studio cost hundreds of dollars per license, a free version called Visual Studio
    Community Edition (previously called Visual Studio Express) is available. Community
    Edition may be used by individual developers or those working for “non-enterprise
    organizations” to develop free or paid apps. The Community Edition is not function-limited
    like its ancestor Visual Studio Express, and the license terms are quite generous
    since “enterprise” is defined as an organization with over 250 PCs or greater
    than one million dollars in annual revenue. Even within an enterprise, Community
    Edition may be used to contribute to open-source projects, for academic research,
    or for classroom learning scenarios.


    C# versus Other Languages within .NET


    Over thirty languages can be used to program .NET ([https://en.wikipedia.org/wiki/List_of_CLI_languages](https://en.wikipedia.org/wiki/List_of_CLI_languages)).
    Apart from C#, which enjoys the widest use, notable examples include Javascript,
    Ruby, and Python, in the forms of Managed JScript, IronRuby, and IronPython.


    There are many technical features of C# that require a lot more explanation than
    we have room for here, and whether they are pros or cons compared to other languages
    depends greatly on your own perspective. Suffice it to say, C# has many tricks
    and labor-saving devices that will help you express your intent concisely, along
    with safety nets designed to save you from yourself. Here is a short list of features
    that will reward your efforts to learn more about them:


    *   Strict typing, anonymous types, type safety


    *   Object oriented, with multiple inheritance via interfaces


    *   LINQ


    *   Generics


    *   Lambda expressions and functional programming


    *   Nullable types


    *   Metaprogramming via attributes


    Examples


    LINQ


    LINQ stands for Language-Integrated Query. It provides a set of patterns for querying
    and updating that smooth out and abstract away the idiosyncrasies of the data
    store being worked with. LINQ to Objects, LINQ to XML, and LINQ to SQL are providers
    included by default in the .NET framework (Microsoft Developer Network n.d.),
    such as LINQ to JSON and LINQ to ODATA.


    The advantage of LINQ is that the patterns are relatively easy to learn and, once
    mastered, give you a standard approach to working with a variety of data sources.
    Without LINQ, you are obligated to write many lines of helper code to support
    the operations you are actually interested in using, and you need to understand
    the vagaries of the underlying data store much more deeply. Further, LINQ is able
    to simplify greatly statements that are complicated and messy in the original
    language—this is particularly true with SQL (Albahari nd). LINQ saves a lot of
    time and brain capacity.


    Speaking of SQL, you may find LINQ operators reminiscent of SQL syntax. This is
    not because we are querying an SQL database necessarily but because of convergent
    evolution: these operators are efficient expressions. Although LINQ syntax is
    influenced by SQL languages, it looks the same no matter the nature of the underlying
    data source.


    Tools Needed


    You will need LINQpad ([http://www.linqpad.net](http://www.linqpad.net)) or Visual
    Studio IDE ([https://www.visualstudio.com](https://www.visualstudio.com)/).


    LINQ to Objects


    Any object in the .NET framework that is enumerable can be manipulated with LINQ.
    All the built-in collection classes inherit either the IEnumerable or IEnumerable<T>
    interface*, and anyone can write a new collection that does the same. An interface
    is a template that forces you to add its named methods or properties to your own
    code. IEnumerable makes you add a method called GetEnumerator(), for instance.
    How you write that method and get it to return an IEnumerator object like it’s
    supposed to is up to you. The interface just enforces the method signature.


    Arrays and lists are examples of commonly used enumerable collections. We would
    normally use the foreach operator to enumerate them, but we can also use LINQ,
    particularly if we intend to return a subset.


    string[] array = new string[] {"Chupacabra", "Sasquatch", "Honest Politician"};


    // load ''rarities'' via foreach


    var rarities = new List<string>();


    foreach (string item in array) {


         if (item.StartsWith("Honest")) {


              rarities.Add(item);


         }


    }


    // load ''rarities'' via LINQ


    var rarities =


      from item in array


      where item.StartsWith("Honest")


      select item;


    The advantages of the LINQ version might not be immediately obvious, but:


    *   It declares and sets the rarities variable in a single statement, which, when
    reading the code, eliminates any ambiguity as to what rarities will be used for.


    *   The overall purpose of the snippet is easier to understand at a glance. A
    foreach loop only tells you there is going to be an iteration, not what the iteration
    is going to achieve, whereas the LINQ’s select operator signals the statement’s
    intent clearly.


    LINQ to XML'
