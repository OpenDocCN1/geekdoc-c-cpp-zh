    \ @taglen);\n\nmy $subfdelim = \"\\x1f\"; # MARC 子字段分隔符字符\nmy $fdelim = \"\\x1e\"\
    ; # MARC 字段分隔符字符\nmy $recdelim = \"\\x1d\"; # MARC 记录结束字符\nopen(OUTFILE, \">\"\
    , $outfile);\nopen(INFILE, \"<\", $infile);\nwhile ($line = <INFILE>)\n{\n   \
    \ handledataline();\n    # marcread 格式的最后一行显示: MARC records read: N\n    if (($line\
    \ ne '') and ($line !~ /^MARC/))\n    {\n        $leader = substr($line, 4);\n\
    \        $line = <INFILE>;\n        handledataline();\n    }\n\n    # 导领之后，获取记录的剩余部分\n\
