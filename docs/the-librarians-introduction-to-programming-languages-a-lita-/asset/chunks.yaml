  trans: "\n第 4 行是主函数的左大括号。每当你在 C 中定义函数时，你都需要左、右大括号字符。棒的一点是 C 并不不在乎缩进或空格。这些仅仅是为了阅读代码的人而存在的。\n\
    \n第 5 行是该程序的有效负载。这个 `printf` 语句是一个函数，它接收提供的参数（在我们的例子中，是每个程序员都不情愿学习的那句经典的介绍性语句），并将其打印到标准输出。在大多数情况下，输出将是屏幕。字符串末尾的\
    \ `\\n` 部分是一个转义字符，会在字符串末尾添加一个新行。`printf` 之后是一个分号。C 中的每行代码都需要以分号结束，`include` 行除外。在处理完这个强制性的示例之后，让我们深入研究一些特别具有\
    \ C 语言风格的内容。\n\n### 值的地址\n\n回到命令行提示符，尝试使用 `nano` 启动一个名为 `address.c` 的文件，然后输入以下文本并保存文档：\n\
    \n```c\n/* 查看变量的地址 */\n\n#include <stdio.h>\n\nmain() {\n    int x;\n    int y;\n\
    \    x = 3;\n    y = 7;\n    printf(\"Value of x is: %d and located: %p\\n\",x,&x);\n\
    \    printf(\"Value of y is: %d and located: %p\\n\",y,&y);\n}\n```\n\n此示例的命令行工作流应该是这样的：\n\
    \n```bash\n>nano address.c\n>gcc address.c\n>ls\naddress.c a.out a.helloworld.c\n\
    >./a.out\nValue of x is: 3 and located: 0x7ffe28fd9a08\nValue of y is: 7 and located:\
    \ 0x7ffe28fd9a0c\n```\n\n你的输出将与图片中的不同，我们将逐行分析，跳过我们在第一个代码中看过的部分。第 4 行和第 5 行声明了两个整数。作为任何语言的基础数据类型，值在第\
    \ 6 行和第 7 行被赋值给新创建的整数。\n\n第 8 行和第 9 行是我们看到 C 运行的地方。我们再次使用 `printf` 将一些值打印到屏幕上。`printf`\
    \ 是一个非常多功能的函数，它的功能比你想象的要多。如果你给它一个嵌入了 `%` 字符的文本字符串，它会将提供的其他变量填充到 `%` 所在的位置。在我们的第一个示例中，我们使用\
    \ `%d` 序列打印 `x`。这是另一个 C 语言特性：C 并不真正知道任何内存地址中是什么，所以通过 `%d`，你是在告诉解释器打印该内存地址的内容，就像它是整数一样。如果你想在序列中放入字符串，可以使用\
    \ `%s`，对于浮点数使用 `%f`，以此此类推。第二部分是 `%p`，代表指针。`printf` 的第三个参数是 `&x`，它是 `x` 所在的内存地址。`&`\
    \ 运算符告诉 C 你想要你正在查看的实的地址，而不是该实体的值。\n\n这个示例的目的是向你展示 C 代码可以低到什么种程度。当我们打印两个整数时，首先打印它们的值。然后我们做了一件非常模糊的事：打印存储该值的内存位地址（对于\
    \ `x` 来说，这是 `0x7ffe28fd9a08`）。这种查看某个所在地地址的能力是 C 语言的一个基础部分，这种机制被称为指针。理解指针是一项终身追求，任何声称对它们有深入理解的人可能并没有。由于\
    \ C 没有面面向对象的特征，也没有像 Python 等其他语言那样高度抽象的数据结构，当你想要执行复杂操作时，通常会传递一个指向你复杂对象起始部分的指针。例如，一个包含\
    \ `n` 个整数的数组实际上只是内存中 `n` 个连续的位置，每个位置的大小与整数相同。当你想要引用数组中的第三项时，你基本上引用的是位于数组中第一项内存地址偏移加二\
    \ 处的内存内容。回想之前提到的关于糟糕的 C 代码会产生问题。如果你直接访问内存内容，你极有可能会写入或读取一个你不该访问的值。\n\n在移动到下一个示例之前，查看两个整数变量的内存地址之间的区别是值得的。这些数字是用一种叫做十六进制的表示法写的。所以从\
    \ 0 计数到 9，然后是 A 到 F，最后再添加占位符。例如，当你用十进制（我们通常的方法）计数时，当我们从 9 变到 10 时，我们开始新的一一列（`1`），后面跟着\
    \ `0`。在十六进制中，在 F 之后开始新的一列。为了防止事情变得更加混乱，我们每次写十六进制数时都使用前缀 `0x`。在我们的代码中，我们有两个整数，它们很可能被放在计算机内存的连续位置。这两个地址之间的差异是\
    \ `0x4`。因此，一个整数占用四个字节的内存。是的，C 全都是关于这类事情的。太了，我们为什么要关心这个？下一个示例试图说明这种重要性。\n\n###\
    \ 哎\n\n再次使用 `nano` 编辑文件 `oops.c`：\n\n```c\n/* 访问一段内存 */\n#include <stdio.h>\n\n\
    main () {\n    int oops;\n    oops = 8;\n    printf(\"Address of oops is: %p\\\
    n\",oops);\n    printf(\"Contents of oops is: %d\\n\",oops);\n}\n```\n\n程序运行后终端的输出应该是这样的：\n\
    \n```bash\n>nano oops.c\n>gcc oops.c\n>ls\naddress.c a.out oops.c\n>./a.out\n\
    Address of oops is: 0x7ffe28fd9a08\nContents of oops is: 8\n```\n\n为了演示访问你不该访问的内存，尝试这段代码并保存为\
    \ `overflow.c`：\n\n### 溢出\n\n```c\n/* 缓冲区溢出 */\n#include <stdio.h>\n#include <string.h>\n\
    \nint main()\n{\n    int super_user = 0;\n    char login[10];\n    printf(\"Enter\
    \ username: \");\n    gets(login);\n    if (strcmp(\"bob\",login) == 0 )\n   \
    \ {\n        super_user = 1;\n    }\n    if(super_user)\n    {\n        printf(\"\
    Super Access granted!\\n\");\n    }\n    else\n    {\n        printf(\"Sorry,\
    \ you are not a super user\\n\");\n    }\n    /* 做一些只有超级用户才能做的事 */\n    return\
    \ 0;\n}\n```\n\n让我们逐行分析。3 行（忽略空行）包含了 `string.h`，以便我们稍后调用 `strcmp`。在第 4 行中，我们声明\
    \ `main` 函数返回一个 `int`，或整数值。这是为了让示例按预期工作。第 7 行声明了一个长度为 10 的字符数组，这是 C 语言（无论好坏）表示字符串的方式。第\
    \ 9 行让我们使用内置的 `gets` 函数获取直到用户按下回车的输入。\n\n以下显示了代码编写-保存-编译循环以及最终产品的几次运行输出。注意我们必须通过命令行参数向\
    \ `GCC` 传递一些额外信息，以关闭编译器通常使用的某些保护。\n\n```bash\n>nano overflow.c\n>gcc -wall -fno-stack-protector\
    \ overflow.c\n>ls\naddress.c a.out helloworld.c oops.c overflow.c\n>./overflow.out\n\
    Enter username: bob\nSuper Access granted!\n>./overflow.out\nEnter username: peter\n\
    Sorry, you are not a super user\n>./overflow.out\nEnter username: joe\nSorry,\
    \ you are not a super user\n>./overflow.out\nEnter username: abcdefghijklmno\n\
    Super Access granted!\n```\n"
- fmt: "\nLine 12 compares the value entered by the user to the magical super user\
    \ account name. `C` compares strings in a canonical way—character by character—and\
    \ gives you the difference as an integer value. Thus, two identical strings have\
    \ a difference of `0`. In this case, if it checks out `super_user` is set to `1`\
    \ or `true`. Line 16 denotes that if `super_user` is `true`, we know the user\
    \ has special privileges, so we let him or her know about it using a `printf`\
    \ statement. Line 22 allows us to conclude the `main` function without compilation\
    \ error by returning an arbitrary integer `0` (line 23). Much like with the string\
    \ compare, we use `0` here to mean successful, unlike the check of `super_user`,\
    \ where a nonzero number means success. Yup, another `C-ism` in action.\n\nThis\
    \ example is a contrived one to demonstrate the ability `C` has to create something\
    \ called a buffer overflow. Buffer overflows happens when you cram too much data\
    \ into a series of memory locations and something odd happens as a consequence.\
    \ This simple program first asks for someone to enter a username. If that username\
    \ is `bob`, then it grants that user super privileges. However, this program is\
    \ exploitable. The author of the software thought that a username would only be\
    \ ten characters long. However, if you were an enterprising individual, you could\
    \ find out that if you entered in a username longer than ten characters, the program\
    \ tries to cram in all of those characters into ten spots and it dribbles out\
    \ into adjacent memory and causes all sorts of problems. In this case, it shortcuts\
    \ the attempt to compare the entered user name to “bob” and sets `super_user`\
    \ to `1` if that is the case. To beat this example even more over the head, the\
    \ `GCC` line used to compile the program is a bit different than what we have\
    \ seen so far. In this case, we are telling the compiler explicitly not to check\
    \ against buffer overflows.\n\n# Mystery Code\n\nIf `C` looks confusing, well,\
    \ that’s because it is. As demonstrated previously, accessing everything in `C`\
    \ is done at a very low machine level, down to the point of looking directly at\
    \ memory locations. The data structures that you are given are pretty minimal,\
    \ basically a continuous block of memory you need to very carefully reference.\
    \ These low-level specifications create code that works well, but the trade-off\
    \ is code that can be totally unreadable. This incongruence is taken to a shocking\
    \ extreme with a series of events `C` coders participate in. For example, the\
    \ Underhanded C Contest is a competition in which entrants have to create a piece\
    \ of code that seems benign but actually performs some dubious function. In a\
    \ previous year’s contest, the goal was to create software to emulate an airline\
    \ luggage processing system that must secretly reroute certain luggage if a particular\
    \ free text note is applied to the record. The code also had to be written in\
    \ a way that someone looking at it couldn’t divine its purpose.\n\nAnother gem\
    \ is the International Obfuscated C Code Contest. Take, for instance, this code\
    \ block, which is a slight modification of some code that was submitted in `1990\\\
    `. Enter the following in a file called `mystery.c`:\n\n```c\n#include<stdio.h>\n\
    \nv,i,j,k,l,s,a[99];\n\nmain()\n\n{\n\nfor(scanf(\"%d\",&s);*a-s;v=a[j*=v]-a[i],k=i<s,j+=(v=j<s&&(!k&&!!printf(2+\"\
    \\n\\n%c\"-(!l<<!j),\" #Q\"[l^v?(l^j)&1:2])&&++l||a[i]<s&&v&&v-i+j&&v+i-j))&&!(l%=s),v||(i==j?a[i+=k]=0:++a[i])>=s*k&&++a[--i])\n\
    \    ;\n\n}\n```\n\nWithout a clear hint and some diagrams and polite description,\
    \ it would would most likely be impossible to infer the meaning of this code.\
    \ The organizers of the contest have provided some hints on how to run this and\
