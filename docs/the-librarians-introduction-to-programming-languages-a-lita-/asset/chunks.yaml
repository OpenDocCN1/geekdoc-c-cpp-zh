  trans: "\n\n这是一个基础 Hello World 应用程序。它是测试 Java 运行环境的好方法，可以确保你可以成功编译并运行代码。\n\n```java\n\
    public class HelloWorld {\n    public static void main(String[] args) {\n    \
    \    System.out.println(\"Hello World!!!!\");\n    }\n}\n```\n\n如果运行成功，这段代码将简单地打印出\
    \ Hello World!!!! 行。尽管它非常简单，但值得逐行查看这段代码，以更好地理解它的作用。\n\n```java\npublic class HelloWorld\
    \ {\n```\n\n第一行创建了一个名为 HelloWorld 的类。每个 Java 应用程序都构建在类内部。这使得它与其他编程环境非常不同。在 Java\
    \ 中，一切都是对象，而对象是由类创建的。在类内部，代码被封装在函数中。\n\n```java\npublic static void main(String[]\
    \ args)\n```\n\n简单 World 程序中上面的函数被称为 `main`，因为它是我们代码执行的地方。任何应用程序中都只有一个 `main`\
    \ 函数，它必须始终被声明为 `public static void` 并接受一个 `String`，传统上命名为 `args`。该函数由 Java 虚拟机自动调用，如果没有它，你的代码将无法运行。\n\
    \n```java\nSystem.out.println(\"Hello World!!!!\");\n```\n\n代码的最后一行是打印我们想要显示的文本的代码。\n\
    \n### 扩展的 Hello World\n\n下面的程序输出与上面的程序完全相同。为了进一步解释“一切都是对象”的意思，创建了第二个名为 `Welcomer`\
    \ 的类。\n\n```java\npublic class HelloWorld {\n    public static void main(String[]\
    \ args) {\n        Welcomer welcomer = new Welcomer();\n        welcomer.sayHello();\n\
    \    }\n}\n```\n\n```java\npublic class Welcomer {\n    private String welcome\
    \ = \"Hello World!!!!\";\n    public void sayHello() {\n        System.out.println(welcome);\n\
    \    }\n}\n```\n\n初始类 HelloWorld 仍然存在，并包含 Java 运行所需的强制 `main` 函数。\n\n```java\n\
    public class HelloWorld {\n    public static void main(String[] args) {\n    \
    \    Welcomer welcomer = new Welcomer();\n```\n\n`main` 函数做的第一件事是创建一个 `Welcomer`。对于这个程序而言，`Welcomer`\
    \ 可以被认为一个在被要求说话时会大喊“Hello World!!!!”的对象。你可以想象你创建了一个实际的对象，比如一个机器人，它可以执行任务。现在我们只需要告诉它说就行。\n\
    \n```java\nwelcomer.sayHello();\n```\n\n但是，为了让它工作，需要定义第二个类 `Welcomer`。\n\n```java\n\
    public class Welcomer {\n    private String welcome = \"Hello World!!!!\";\n \
    \   public void sayHello() {\n        System.out.println(welcome);\n    }\n}\n\
    ```\n\n这个类创建了 `welcome` 并包含了所有的属性。`welcome` 可以执行的每个函数都在这个类中。在这个类内部，我们创建了一个带有 hello\
    \ 文本的字符串。然后我们创建了一个新函数来打印我们的 hello 文本字符串。这段代码显然让一个打印 Hello World 的非常简单的函数变得显著复杂得多。这主要是为了展示\
    \ Java 中的一切都是对象。有许多理由你想要创建具有不同行为的类。创建多个类仍然是一个有用的实践，因为它简化了扩展程序的过程。例如，如果程序员决定为 `Welcomer`\
    \ 添加任务，例如要求程序用户填写调查卷，可以通过在 `Welcomer` 类内部创建新函数，并在 `main` 函数中调用它们，而只对现有代码进行有限的修改。\n\
    \n### 不只有正确的方法\n\n在 Java 中，像许多许多其他编程语言一样，通常有多种方法来完成同一个类。一种方法并不比另一种更好。有时选择取决于代码如何被使用。在其他情况下，它取决于开发者的喜好。下面的示例显示了遍历简单数组的四种方法。每种循环类型产生相同的输出。\n\
    \n```java\npublic class Main {\n    static private String[] numbers = {\"one\"\
    , \"two\", \"three\", \"four\", \"five\"};\n    public static void main(String[]\
    \ args) {\n        for (String number : numbers) { // for loop\n            System.out.println(number);\n\
    \        }\n        for (int number=0; number < numbers.length; number++) { //\
    \ for loop\n            System.out.println(numbers[number]);\n        }\n    \
    \    int number = 0;\n        while(number < numbers.length) { // while loop\n\
    \            System.out.println(numbers[number]);\n            number++;\n   \
    \     }\n        number = 0;\n        do { // do while loop\n            System.out.println(numbers[number]);\n\
    \            number++;\n        } while (number < numbers.length);\n    }\n}\n\
    ```\n\n上面使用的循环是 `for`、`for each`、`while` 和 `do while`，如注释所示。这些选择没有对错之分，也没有哪一个效率比另一个更高或更低。在\
    \ Java 中，经常会有关于如何执行程序的选择，可能五位经验丰富的程序员会提出五个不同的解决方案，而它们都是正确的。在开发 Java 或任何编程语言时，对于开发者来说，保持开放的心态、富有创造力并找到适合自己的风格是非常重要的。这并不是说在很多情况下没有正确和错误的选择，但也有很大的创意和个人风格空间。\n\
    \n### 使用内置类\n\nJava 的优点之一是有很多内置类，它们已经包含了完成你可能想要执行的任务的函数。在 Java 中编写程序之前，查看是否已经有可以完成操作的\
    \ Java 类是值得的。这是一个使用 Java 内置类类的示例。下面的程序读取你的出生月份、日期和年份，并返回你出生星期几。例如，如果你在 1977 年\
    \ 7 月 25 日出生，程序将返回 Monday（星期一）。\n\n```java\nimport java.util.Calendar;\nimport\
    \ java.util.GregorianCalendar;\nimport java.util.Scanner;\n\npublic class Main\
    \ {\n    public static void main(String[] args) {\n        Scanner input = new\
    \ Scanner(System.in);\n        System.out.println(\"Enter the month of your birth\"\
    );\n        int month = input.nextInt(); // Read in month\n        System.out.println(\"\
    Enter the day of your birth\");\n        int day = input.nextInt(); // Read in\
    \ day\n        System.out.println(\"Enter the year of your birth\");\n       \
    \ int year = input.nextInt(); // Read in year\n        month = month-1; // Java\
    \ 中的月份是 0-11 而不是 1-12\n        GregorianCalendar birthday = new GregorianCalendar(year,\
    \ month, day);\n        String namesOfDays[] = { \"Sunday\", \"Monday\", \"Tuesday\"\
    , \"Wednesday\", \"Thursday\", \"Friday\", \"Saturday\"};\n        String weekday\
    \ = namesOfDays[(birthday.get(Calendar.DAY_OF_WEEK)) - 1];\n        System.out.println(weekday);\n\
    \        input.close();\n    }\n}\n```\n\n`java.util.Calendar` 类是一个抽象类，它提供了方法用于在特定时间与\
    \ `YEAR`、`MONTH` 等日历字段之间进行转换，并对日历字段进行操作，例如获取下周的日期。\n\n"
- fmt: "\nThe `java.util.GregorianCalendar` is a concrete subclass of `Calendar` and\
    \ provides the standard calendar system used by most of the world. The `GregorianCalendar`\
    \ class allows the programmer to enter a date in a familiar format (month, date,\
    \ year, etc.) and easily convert it to a date that Java understands. The `GregorianCalendar`\
    \ class also allows for math functions so you can manipulate dates by adding and\
    \ subtracting time from them (Oracle 2015). The class `java.util.Scanner` is one\
    \ of many ways that data can be read into Java. It is a simple text scanner that\
    \ can parse primitive types and strings using regular expressions (Oracle 2015).\n\
    \nOne important thing to remember when using an existing Java class is that it\
    \ may not work exactly the way you expect. It is important to understand the functions\
    \ of a class before you use them, or you may get undesirable results. For example,\
    \ after the code above reads in an integer for the month, it subtracts one.\n\n\
    ```java\nmonth = month-1; //Months in the Calendar class are 0-11 instead of 1-12\n\
    \nGregorianCalendar birthday = new GregorianCalendar(year, month, day);\n```\n\
    \nThis is because, as the comment indicates, months in the calendar class go from\
    \ 0 to 11 instead of 1 to 12. If a user of this program was born in January, he\
    \ or she would likely enter 1 for the birth month when prompted, but Java would\
    \ interpret that to mean February. It is the responsibility of the program developer\
    \ to make sure that the data is being interpreted properly.\n\nThis specific example\
    \ may never come up, but there will be a lot of times that a class or function\
    \ doesn’t behave in exactly the way an unfamiliar user might expect. It is always\
    \ a good idea to read through the documentation when using something new.\n\n\
    There are many of these types of built-in classes that help with various operations,\
    \ such as `File` (`java.io.File`), which allows users to edit files; `Math` (`java.io.Math`)\
    \ for complex math equations; or `NumberFormat` (`java.io.NumberFormat`), which\
    \ allows users to specify their number format down to details such as currency\
    \ type, including euros verses American dollars. A list of all classes included\
    \ with Java 8 can be found here: [http://docs.oracle.com/javase/8/docs/api/allclasses-noframe.html](http://docs.oracle.com/javase/8/docs/api/allclasses-noframe.html).\n\
    \nIf you want to see what methods are included in a class or how to use a particular\
    \ method, it is worthwhile to look up the documentation on that class. Also, if\
    \ you try to use something and it doesn’t work the way you expect, it is always\
    \ useful to search Java forums on the Internet. It is very likely that someone\
    \ had the same confusion as you.\n\n## Java Applet\n\nThis is an example of code\
    \ that will generate a Java applet that can be embedded in a web browser. Unlike\
    \ console-based applications, code for applets does not require a `static void\
