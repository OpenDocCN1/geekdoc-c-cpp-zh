  trans: "\n\n这个简单的脚本结合了屏幕像素宽度和浏览器信息，当检测到移动设备访问网站时，将用户重定向到移动端站点。必须将 `http://www.google.com`\
    \ 替换为真实的移动端站点 URL。此脚本包含了一些有趣的特性。`screen.width` 提供 `screen` 对象以像素为单位的“宽度”属性。`window.location.assign()`\
    \ 是从指定 URL 加载新网页文档的方法之一。`navigator.userAgent` 是传递给浏览器的关于设备信息的字符串。在脚本中，我们正在这个“用户代理字符串”中搜索“mob”，以查看字符串中是否有指示设备为移动设备的标识，作为测试屏幕尺寸的补充（这对于高分辨率设备尤为重要）。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n<title>Mobile Redirect</title>\n</head>\n\
    <body>\n<h1>This is the desktop Site</h1>\n<p>Here is a paragraph of scintillating\
    \ information</p>\n<script>\nif (screen.width <= 799 || navigator.userAgent.indexOf('Mob')\
    \ != -1)\n{\n    window.location.assign(\"http://www.google.com\");\n}\n</script>\n\
    </body>\n</html>\n```\n\n(Bengtson 2012b)\n\n# 为移动设备更改链接目标\n\n此脚本使用了与上述类似的机制。对于分配了\
    \ `mobile` 类并且在 HTML 中通过 `data-mobile` 属性添加了移动端友好备用目标 URL 的链接，当脚本检测到移动设备访问网站时，链接目标将发生切换。此脚本需要\
    \ `jQuery`。你应该会注意到这段网页代码的两个有趣之处。首先，我们通过第一个 `<script>` 标签从内容分发网络（CDN）向网页文档加载 `jQuery`。这是一个加载外部\
    \ JavaScript 文件的示例，它仅在连接互联网的计算机上有效。其次，与我们的其他示例不同，在这里我们将 JavaScript 添加到网页文档的头部\
    \ 部分中。正如之前讨论的，我们可以使用 `jQuery` ready 函数让事件处理程序在网页文档填充完成后后再绑定。\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html;\
    \ charset=UTF-8\">\n<title>Smartlinks Document</title>\n<script src=\"https://code.jquery.com/jquery-2.1.4.min.js\"\
    ></script>\n<script>\n$(document).ready(function(){\n    $(\"a.mobilev\").click(function(e){\n\
    \        e.preventDefault();\n        var linkm=$(this).attr(\"data-mobile\");\n\
    \        var linkr=$(this).attr(\"href\");\n        mobileswitch(linkm, linkr);\n\
    \    });\n    function mobileswitch(linkm, linkr)\n    {\n        if ((screen.width\
    \ <= 799)|(navigator.userAgent.indexOf('Mobile') != -1))\n        {\n        \
    \    window.location = linkm;\n        }\n        else\n        {\n          \
    \  window.location = linkr;\n        }\n    }\n});\n</script>\n</head>\n<body>\n\
    <h1>This is the desktop Site</h1>\n<p>Here is a paragraph of scintillating information</p>\n\
    <a class=\"mobilev\" href=\"http://thenormaldestination.com\" data-mobile=\"http://themobiledestination.com\"\
    >Here Is My Link</a>\n</body>\n</html>\n```\n\n(Bengtson 2012a)\n\n# 总结\n\nJavaScript\
