    Before looking at the actual code line by line, it is worth pointing out the tight
    coupling between Linux and C. Now to the code listing. Let’s go line by line.


    Line 1 is a comment line. Anything written between /* and */ is there for the
    sake of the human reading the code. The C compiler just skips that line.


    Line 2 is an include statement that essentially tells C to include the libraries
    for standard input and output. Every program you write that does anything interesting
    will require this line. It is a header file that lets you use functions like pritntf
    that we will see later. Put simply, a header file is a human-readable version
    of the object code of those input/output functions.


    Line 3 starts the main function of the program. It is preceded with a keyword
    void. Void is a reserved word in C and indicates that the function won’t provide
    any returning value. We’ll see an example later where we want that main function
    to return an integer. Anytime you write and compile a C program, it will look
