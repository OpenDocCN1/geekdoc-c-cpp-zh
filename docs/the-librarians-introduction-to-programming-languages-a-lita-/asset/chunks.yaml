    \ and hosts fully searchable and free documentation. `http://www.php.net`.\n-\
    \ **WordPress**: WordPress is an open-source content management system originally\
    \ built around blogs but has grown to support a variety of other site structures.\
    \ `https://wordpress.org/`.\n\n# Chapter Seven: SQL\nEmily R. Mitchell and Lauren\
    \ Magnuson\n\n### History and Development\nStructured Query Language (`SQL`) is\
    \ a fundamental programming language for interacting with stored application data,\
    \ which is the persistent data that hangs around even when you close a program\
    \ or reboot your computer. It is primarily a declarative language, distinguishing\
    \ it from procedural programming languages used for writing applications, such\
    \ as `PHP` or `Ruby`. `SQL`’s basic syntax is designed to create, query, update,\
    \ and delete data stored in a database. `SQL` is used in a variety of library\
    \ contexts, and understanding how it works can enable librarians to better understand\
    \ the way library data is stored, retrieved, analyzed, and potentially extended\
    \ to new applications and services. To understand why `SQL` is so important, you\
    \ need to understand what life was like before `SQL`. Before `SQL`, if you wanted\
    \ a program to use persistent data, you would have to tell the program exactly\
    \ how to get to that information.\n\nIf you can imagine working in a library with\
    \ no call numbers and trying to give step-by-step directions to a very timid and\
    \ literal-minded library patron who needs to find a book, you’re on the right\
    \ track here. You’re going to have to tell the library patron to turn around,\
    \ go up two flights of stairs, turn right, go through the door, walk to the third\
    \ bookshelf on the right, and select the fourth book on the second shelf from\
    \ the top. If the library purchases more books that go before the book in question\
    \ on the shelf, you’re going to have to know about it and change your directions\
    \ so that the next time someone asks for this book, you can send that person to\
    \ the sixth book instead of the fourth.\n\nThe above is an example of what it\
    \ was like dealing with persistent data in the days before `SQL`. In 1970, E.\
    \ F. Codd published a paper with a first line that read, “Future users of large\
    \ data banks must be protected from having to know how the data is organized in\
    \ the machine (the internal representation)” (Codd 1970, 377).\n"
