    right of the word unless evaluates as false, do what’s to the left. The += operator
    adds what is to its right to the variable on its left. As you can see, you can
    put an expression inside the square brackets, [ ], used to refer to array element
    n, so long as the expression results in an integer.


    Lisa showed Josie that she can check the syntax of a Perl program before running
    it: perl –cw program.pl.


    Josie did so and corrected several typos, as indicated. Then she edited the test.read
    file, inserting a 650 field to enable better search results. Since this is in
    the marcread format, Lisa had her do it like this: 650:1111:11111: 0|aFreddie
    the Pig (Fictitious character) |v Fiction.


    Those ones after the 650 are placeholders with meaningless values; marcunread.pl
    will figure out the length and offset for that field when it converts the data
    back to MARC format. Josie ran marcunread.pl and imported the resulting MARC file.
    She tried a search and success! She can now find all of these books with one search.
    Did anyone see the mistake I made in this program? It does not prevent the program
    from running correctly. Hint: It involves $recctr.


    Final Notes


    In order to present these programs simply and compactly, they were shown in a
    stripped-down fashion. The use of more blank lines to set off sections of your
    code to make understanding it easier is encouraged. Also, error checking was omitted,
    particularly from marcunread.pl. A more complete version of that and other programs
    can be found at the author’s web pages ([http://homepages.wmich.edu/~zimmer/marc_index.html](http://homepages.wmich.edu/~zimmer/marc_index.html)).
    All links shown below are current as of December 2015.


    Summary


    Start out with simple Perl programs, working your way up to more complex programs
    as your skill set grows, at your own speed. Perl can implicitly handle programming
    details for you, letting you concentrate on the task you are trying to achieve.
    Programs can be written in a style where the functionality is obvious and readable,
    or dense and compact. The examples in this chapter show how to work with MARC
    data, doing all the “heavy lifting” yourself. Or you could choose from dozens
    of MARC-related modules on CPAN to make your task easier. You can do just about
    anything with Perl. Chances are good someone has written a module that will make
    your task easier.


    Recommended Resources


    Websites


    Get Perl, Command Line Version: [http://www.activestate.com/activeperl/downloads](http://www.activestate.com/activeperl/downloads);
    [http://strawberryperl.com](http://strawberryperl.com)/.


    Get Perl, Graphical User Interface: [https://sourceforge.net/projects/citrusperl/files](https://sourceforge.net/projects/citrusperl/files)/.


    Module Repository, CPAN: [http://www.cpan.org](http://www.cpan.org)/.


    Books


    Christiansen, Tom, Brian D. Foy, Larry Wall, and Jon Orwant. 2012. Programming
    Perl: Unmatched Power for Text Processing and Scripting. 4th ed. Sebastopol, CA:
    O’Reilly Media.


    Christiansen, Tom, and Nathan Torkington. 2003\. Perl Cookbook. 2nd ed. Sebastopol,
    CA: O’Reilly Media.


    Schwartz, Randal L., and Brian D. Foy. 2011\. Learning Perl. 6th ed. Sebastopol,
    CA: O’Reilly Media.


    Siever, Ellen, Stephen Spainhour, and Nathan Patwardhan. 2002\. Perl in a Nutshell:
    A Desktop Quick Reference. 2nd ed. Sebastopol, CA: O’Reilly Media.


    Author’s Links


    MARC Programs: [http://homepages.wmich.edu/~zimmer/marc_index.html](http://homepages.wmich.edu/~zimmer/marc_index.html).


    Perl Stuff: [http://homepages.wmich.edu/~zimmer/links/proglang.html#perl](http://homepages.wmich.edu/~zimmer/links/proglang.html#perl).


    Chapter Six


    PHP


    Jason Steelman


    History and Development


    PHP is a beautiful, deceptively simple language. Its strengths are demonstrated
    ubiquity, platform conformity, ease of access, and the richest open-source community
    of any programming language. Most commonly, PHP works within a server to connect
    web pages to databases and perform the heavy lifting of web page manipulation;
    however, PHP can function as a stand-alone program. It is not uncommon to find
    free extensions that allow PHP to manipulate videos, data mine the web, or serve
    as the backbone of a site’s content management system ([http://php.net/manual/en/extensions.alphabetical.php](http://php.net/manual/en/extensions.alphabetical.php)).
    While many programming languages are chosen for their scalpel-specific features,
    such as task performance, hardware support, or high-level functionality, PHP is
    the sledgehammer capable of solving an epic score of problems—perhaps in a less
    elegant manner.


    The bottom line for most library discussions on the acquisition of new software
    is cost. PHP’s ubiquity and its open-source license mean that the language is
    almost always on the list of available options for a library. An important consideration
    in favor of PHP is the long-term support of a project offered by the language’s
    battalions of developers. Finding a new developer largely depends on the complexity
    of the application’s language. PHP developers are generally more affordable and
    more easily available to contract or employ compared to more robust languages.
    If the project lends itself to a complex program, there may be some additional
    time and initial cost to using PHP; however, long-term support for PHP projects
    is often more affordable. Compared to a corporation of similar scale, it is unusual
    for a library to require a new application within a relatively short time frame.
    With a flexible deadline, libraries can take advantage of the lower cost of PHP
    development as long as PHP is capable of solving the problem.'
