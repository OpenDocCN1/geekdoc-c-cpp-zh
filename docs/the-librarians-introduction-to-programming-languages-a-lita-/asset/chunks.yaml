- fmt: '

    There are over seventy thousand freely available packages you can search through
    on `PyPI` (the Python Package Index) at [pypi.python.org](http://pypi.python.org)—these
    range from data parsing, to database manipulation, to packages that target specific
    end users. These packages are normally standardized in the way you’d go about
    installing them. As a general rule, a package installed for one version of Python
    may not be recognized by another version of Python. In short, if you are using
    `Python 2.7`, make sure to download packages for that version and not version
    `3.x`, and if you are running more than one version of Python, the same package
    may not work for two versions. In most cases, tools like `pip` (described below)
    will take care of this for you, but it’s an important aspect to keep in mind.


    Packages in Python can be downloaded and used in a variety of ways, but by far
    the easiest and most common is to use a Python utility called `pip`. `Pip` is
    a package manager included with `Python 2.7.9` and `3.4` onward, and, for earlier
    versions, it is easily downloaded and installed ([https://pip.pypa.io/en/latest/installing.html](https://pip.pypa.io/en/latest/installing.html)).
    After following the instructions to install it, adding new modules is often as
    easy as opening your command line and issuing the command `pip install my_package`.
    You can use `PyPI` to find packages (this is the resource `pip` pulls from), but
    you will also often hear about packages on StackOverflow or other places where
    Python is discussed. To use a package, put `import my_package` at the top of your
    Python file, and you will have access to all the functionality provided. We will
    see several examples of this below as importing packages is one of the most common
    tasks in Python.


    To truly see the power of packages, let’s take an example from the documentation
    for `Requests` (Reitz 2011), one of the most popular Python packages. `Requests`
    allows us to make HTTP requests, abstracting away most of the details so we can
    just do what we came here for. Using Python’s built-in `urllib2` functionality,
    making a web request to GitHub might look like this:


    ```

    import urllib2


    gh_url = ''https://api.github.com''


    req = urllib2.Request(gh_url)


    password_manager = urllib2.HTTPPasswordMgrWithDefaultRealm()


    password_manager.add_password(None, gh_url, ''user'', ''pass'')


    auth_manager = urllib2.HTTPBasicAuthHandler(password_manager)


    opener = urllib2.build_opener(auth_manager)


    urllib2.install_opener(opener)


    handler = urllib2.urlopen(req)


    print handler.getcode()


    print handler.headers.getheader(''content-type'')

    ```


    Don’t worry if this code doesn’t mean anything to you, as its purpose in life
    is to display the convoluted code you would have to write using just the standard
    tools to make a simple HTTP request to GitHub, then check the status code returned
    and the type of content returned. It’s supposed to make you scratch your head,
    especially if you’re just getting started. To make our lives better, let’s install
    `Requests`. Open your command prompt and type `pip install requests`. Now the
    code we can write is:


    ```python

    import requests


    r = requests.get(''https://api.github.com'', auth=(''user'', ''pass''))


    print r.status_code


    print r.headers[''content-type'']

    ```


    If you’ve never seen Python code before, you might still guess what this code
    does. It imports something called `requests`, then uses that to get information
    from [api.github.com](http://api.github.com), using a username and password (here
    called dummy variables “user” and “pass”). Then it prints the status code and
    part of the headers. Thanks to Kenneth Reitz making and freely releasing this
    library, we can write code that is understandable and much easier to use in a
    fraction of the time.


    ## Python 2 versus Python 3


    In late 2008, `Python 3` was released. This new version was backward incompatible
    with past versions of `Python`, which ended with version `2.7`. A number of improvements
    to the language were included with the `Python 3.0` release, including better
    Unicode support, cleaning up past deprecations, and building in tools to assist
    developers new to the language in learning it better.


    At the time of its release, `Python 3` was declared the future of the language;
    however, because it was not backward compatible with previous versions of the
    language, many people who had been reliant on version `2.7` found that they needed
    to upgrade their applications. Others embraced the future of the language and
    used the newer `Python 3` in all new developments. It is, however, possible to
    have multiple versions running on the same machine. Since `Python 2.7` comes installed
    natively on a number of machines (see previous section), it may be necessary to
    install `Python 3` separately. These two versions can run independently, but packages
    will need to be installed separately as well—one package won’t work for both platforms.
    This is true for `pip` as well. However, with a little configuration, you can
    easily just keep track by using commands like `pip2` or `python3` when you want
    to run a specific version.


    ## Uses


    Python’s flexibility makes it appropriate for a variety of uses. Popular services
    such as Google, YouTube, and Dropbox code large-scale projects with it for both
    web and desktop environments. Closer to home in libraries, the Evergreen open-source
    ILS, though written largely with Perl, uses Python for some development tasks.
    However, Python’s low barrier to entry makes it a particularly good fit for smaller
    projects to automate common tasks.

