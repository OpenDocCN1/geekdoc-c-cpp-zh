    84–89.


    Horton, Ivor. 2006\. Beginning C from Novice to Professional. Berlin: Springer.


    Isaak, James. 1990\. “The History of Posix: A Study in the Standards Process.”
    Computer 23 (7): 89–92.


    Kernighan, Brian W., and Dennis M. Ritchie. 1978\. The C Programming Language.
    Englewood Cliffs, NJ: Prentice-Hall.


