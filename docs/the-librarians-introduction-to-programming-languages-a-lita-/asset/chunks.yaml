    tell you the fifty most common words used on your site and the context for some
    of them so you know how the current language fits. As with Scrapy, using the NLTK
    library makes it easy to get this kind of information without writing much code;
    ten lines and you know exactly which pages discuss lumberjacks and where you encounter
    Spam (sorry, couldn’t help myself).'
