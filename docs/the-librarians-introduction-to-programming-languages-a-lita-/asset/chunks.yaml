  trans: "\n例如，存储在 Koha 开源集成管理系统（ILS）中的数据可以直接被查询，Koha 用户已经收集了大量关于编写自定义查询的文档（[`wiki.koha-community.org/wiki/SQL_Reports_Library`](http://wiki.koha-community.org/wiki/SQL_Reports_Library)）。报告通常涉及从数据库中提取数据，或者用\
    \ SQL 用户的话说，即选择（selecting）这些数据。Koha 中的查询与简单的 SQL 请求有所不同，但随着你对 SQL 的了解，你会很快熟悉其基本语法。下面的\
    \ Koha 示例从 Koha 的 `biblioitems` 表中检索特定的 MARC 标签（存储为 `MARCXML`）（[`wiki.koha-community.org/wiki/SQL_Reports_Library`](http://wiki.koha-community.org/wiki/SQL_Reports_Library)#Query_MARC）：\n\
    \n```sql\nSELECT\n    ExtractValue((\n        SELECT marcxml\n        FROM biblioitems\n\
    \        WHERE\n            biblionumber=14),\n        '//datafield[@tag=\"952\"\
    ]/subfield[@code>=\"a\"]') AS ITEM;\n```\n\nInnovative Interfaces 的 Sierra ILS\
    \ 允许图书馆创建自定义应用程序，直接查询图书馆的 PostgreSQL 数据库，以创建新的服务或报告机制。例如，参见此支持 Sierra PostgreSQL\
    \ 数据库中记录模型的 Ruby on Rails 应用程序：[`github.com/uclibs/active_sierra`](https://github.com/uclibs/active_sierra)。Sierra\
    \ 客户的文档（需要身份验证）可以在此处处览：[`techdocs.iii.com/sierradna/app`](http://techdocs.iii.com/sierradna/app)。掌握\
    \ SQL 后，图书馆可以例如“编写一个脚本或应用程序，将采购事务数据提取出来并加载到外部会计系统中”([`blog.sierra.iii.com/feature`](http://blog.sierra.iii.com/feature)-spotlight-sierradna-application)。\n\
    \n## 内容管理与数字资产管理系统\n\n许多图书馆使用的最流行的内容管理系统（Connell 2013）都使用了 `MySQL`，包括：\n\n*  \
    \ WordPress\n*   Drupal（也可以使用 `PostgreSQL` 或 `SQLite`）\n*   LibGuides\n*   基于\
    \ Fedora Commons 的数字资产管理系统，包括 `DSpace`、`Hydra` 和 `Islandora`（后者也使用了 `Drupal`）。这些仓库可以使用多种关系型数据库（RDBMS），包括\
    \ `MySQL`、`PostgreSQL`、`SQLite`、`Oracle` 和 `MS SQL server`。访问 [`wiki.duraspace.org/display/FEDORA37/Installation`](https://wiki.duraspace.org/display/FEDORA37/Installation)+and+Configuration#InstallationandConfiguration-PrepareDatabase\n\
    \n对于图书馆 CMS 管理员来说，SQL 语法和架构（schemas）对于排除应用程序中的故障、备份和恢复 CMS 数据库数据，以及编写额外的自定义功能（例如在现有\
    \ CMS 数据库中存储和访问额外数据的 `Drupal` 模块或 `WordPress` 插件）至关重要。以图书馆中心的 Drupal 模块列表请参见 [`groups.drupal.org/libraries/modules`](https://groups.drupal.org/libraries/modules)。\n\
    \n其他图书馆应用还包括：\n\n*   Guide on the Side，这是一个由亚利桑那大学开发的教程应用程序，它利用 `MySQL` 存储教程数据、元数据和用户信息（[`code.library.arizona.edu/gots`](http://code.library.arizona.edu/gots)/）。\n\
    *   Illiad、Odyssey 和 Ares (OCLC/Atlas Systems) 资源共享系统均使用 `Microsoft SQL (MS SQL)`\
    \ 服务器。\n*   SFX (ExLibris) 链接解析软件利用 `MySQL`。\n\n## 优缺点\n\nSQL 的存在是为了处理持久化数据，但当然也有其他替代方案。例如，如果你只需要一个较短的名字和地址列表，那么文字处理文档中的字母顺序列表（平面文件）就足够了。在这种情况下，没有必要费力建立\
    \ SQL 数据库。然而，一旦你的需求超出此范围，SQL 就会显现威力。\n\n想象你图书馆的 ILS 是由平面文件组成的。这对于基本的借阅任务意味着什么？你可能有一份列出所有有效读者的文档，按证号排序。当有人来到借还台并出示卡时，你打开该文档并扫描，直到在文档中找到对应的条目。然后你输入那个人想要借的书的所有信息，包括还书日期。\n\
    \n这可能很慢，但真的有那么糟吗？对于这种非常基础的任务，它看起来可能不坏，但现实生活很快就会变得复杂。例如，如果有几个人同时在借还台工作怎么办？普通的文字处理文档无法同时处理来自不同计算机的几名工作人员的输入。\n\
    \n此外，考虑一下你想知道现在有多少视频逾期时会发生什么。你可以手动检查文档并统计逾期视频，但那花费的时间远超任何人的空闲时间。你可以尝试写一个程序来判断这一点，但编写一个能处理此类查询的程序将是一项复杂的工程。\n\
    \n与使用 SQL 解决相同问题相比。确实，使用 SQL 的初始设置会比直接打开文档更复杂。你首先需要安装 SQL，然后确定数据架构（data schema），这是一致表示你想要捕获的数据的方法。在这种情况下，你的架构应该包含一个关于读者的表（姓名、证号和地址）。你还需要一个材料的表（包括物品类型、标题、作者等信息）。你还需要第三张表，显示什么被借走了、谁借的、以及什么时候还。你可以画出你的架构图，如图\
    \ 7.1 所示。\n\n![](EBPS/image/Figure_7.jpg\n\n图 7.1 SQL 架构示例。\n\n每个框中的字段在 SQL 中实现时将成为表中的列。每个读者的信息将是读者表中的行；每本书或视频将是材料表中的行；每个被借出的物品将在借出表中获得一行，并在归还时移除。\n\
    \n然而，一旦你完成了 SQL 数据库的设置，你的速度将比使用文字处理文件快得多。想按证号查找某人？查询数据库并选择 `cardnumber` 匹配的条目。想运行一个告诉你哪些视频逾期的报告？连接\
    \ `materials` 和 `checkedout` 表，并选择所有 `duedate` 已过的视频。\n\n简而言之，平面文件是\n\n*   容易设置和理解\n\
    *   难以保持更新和准确\n*   几乎无法运行报告\n\nSQL 是\n\n*   设置较复杂\n*   易于更新和准确\n*   易于运行报告\n\n\
    NoSQL 数据库共享 SQL 的基本优点。然而，与 SQL 相比，它们的优缺点更为微妙，部分是因为有许多类型的 NoSQL 数据库。不同类型的 NoSQL\
    \ 都有自己的优劣。要说明在什么情况下你可能会考虑研究某种 NoSQL 是更容易的。如果出现以下情况，你可能对 NoSQL 感兴趣：\n\n*   你将处理海量信息（许多\
    \ TB），并分布在许多不同的服务器/计算机上；你预计需要将你的数据库与另一个数据库合并，后者的设置与你的不同。\n\n相反，如果，你可能仍然希望坚持使用\
    \ SQL：\n\n*   你需要数据库中的每个事务在移动下一个事务之前都必须成功。\n"
