    the importance.


    Oops


    Use nano again to edit the file oops.c:


    /* Accessing a bit of memory */


    #include <stdio.h>


    main () {


    int oops;


    oops = 8;


    printf("Address of oops is: %p\n",&oops);


    printf("Contents of oops is: %d\n",oops);


    printf("Address of oops plus is: %p\n",&oops + 0x8);


    printf("Contents of oops plus is: %d\n", *(&oops + 0x8));


    }


    The output of the terminal after the program is entered and the compiler has been
    run should look like this:


    >nano oops.c


    >gcc oops.c


    >ls


    address.c a.out helloworld.c oops.c


    >./a.out


    Address of oops is: 0x7ffdff637dfc


    Contents of oops is: 8


    Address of oops plus is: 0x7ffdff637e1c


    Contents of oops plus is: 32765


    >


    So, much like the previous example, we declare an integer and display its address
    in memory (line 6) and then its value (line 7). Next we grab a random address
    that is 0x8 away from oops and display that (line 8) and its contents (line 9)
    to the screen with the puzzling result of 32765\. What is that value? What uses
    it? I’m not sure. The only thing I can say is that this location in memory is
    eight bytes higher than the memory address of oops. Let’s extend this investigation
    to demonstrate an exploit using this idea of accessing memory you aren’t supposed
    to.


    Overflow


    Try this bit of code and save into a file named overflow.c:


    /* Buffer Overflow */


    #include <stdio.h>


    #include <string.h>


