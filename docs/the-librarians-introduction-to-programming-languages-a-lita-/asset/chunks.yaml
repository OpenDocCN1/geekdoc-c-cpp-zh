    # Chapter Five


    ## Perl


    Roy Zimmer


    ### History and Development


    Perl was created in 1987 by Larry Wall. The design of Perl was influenced by Larry’s
    background in linguistics, resulting in Perl’s great flexibility. There are two
    acronyms associated with Perl: PERL itself, for Programmable Extraction and Reporting
    Language, reflecting its original intended use; and TMTOWTDI: There’s More Than
    One Way To Do It. Perl is sometimes referred to as the Swiss Army knife of programming.


    Perl was initially written to extract details from computer log files that system
    administrators have to look at. System administrators are the people who keep
    computers and their programs in good running order. Log files contain detailed
    records of the many things going on in a computer at any given moment.


    There were several major releases of Perl in the years after 1987, “ending” with
    version 5 in 1994. Version 5 is still being updated, using a version number like
    `[5.NN](http://5.NN).n`, with the more major updates incrementing the `NN` part.
    There is a version 6 of Perl, work on which started in 2000. Version 6 is, by
    design, considerably different from and independent of Perl 5, and, although you
    can use it, it is a work in progress. This chapter is only concerned with Perl
    5, as that is what is commonly thought of as Perl. The correct way to refer to
    Perl is with only the leading P capitalized.


    Perl was popular for coding web page interactions when the web was young, and
    some bad Perl code was written back then. This led to the misconception that Perl
    was a language to avoid. Well-written Perl code, like code written in pretty much
    any language, can be “beautiful code” that runs efficiently.


    ### Uses


    Perl’s wide adoption and continual updating lets you use it for just about anything
    on just about any kind of computer running almost any kind of operating system.
    Powerful enough for large and intensive computing needs, Perl was chosen early
    on for work with gene sequencing (`https://web.stanford.edu/class/gene211/handouts/How_Perl_HGP.html](https://web.stanford.edu/class/gene211/handouts/How_Perl_HGP.html)`).
    The BBC created an online database of over four million radio and TV programs
    dating back to the 1920s and, among other software, uses Perl on the web server
    (`http://genome.ch.bbc.co.uk](http://genome.ch.bbc.co.uk)`). There is at least
    one major ILS that uses Perl behind the scenes, installing it with its product.


    What can you do with Perl? Interact with databases, such as Oracle, MySQL, and
    Access. Customize how a web server handles interactions between users and web
    pages. Change the type of data stored in a file, say from comma-separated values
    (CSV) to tab delimited. Process images (pictures), manipulate and transform files,
    extract data from them. These are some examples of what you might want to do with
    Perl in a library setting.


    ### Pros and Cons


    Perl is a scripting language, so the process of creating and running your program
    is relatively simple and quick. Given that there are typically multiple ways to
    do things in Perl, you may encounter code that is hard to read. In that case,
    look in a Perl book to gain the necessary understanding. Well-written Perl code,
    like code written in pretty much any language, can be “beautiful code” that runs
    efficiently.


    Perl is a scripting language, so the process of creating and running your program
    is relatively simple and quick. Given that there are typically multiple ways to
    do things in Perl, you may encounter code that is hard to read. In that case,
    look in a Perl book to gain the necessary understanding. Well-written Perl code,
    like code written in pretty much any language, can be “beautiful code” that runs
    efficiently.


    One of Perl’s strong suits is the use of `regex`. This strange word is commonly
    shorthand for a regular expression. Using a `regex`, you can search for a particular
    word, sequence of characters, or (most powerfully) a pattern of characters. `regexes`
    can also be used to make substitutions or deletions. The origin of regular expressions
    goes back to neuroscience, logic, and computer science in 1940s and 1950s. The
    arrival of Perl was one of the major forces making regular expressions widely
    understood among programmers.


    ### Example


    Josie had a problem. Her library had a set of Freddy Pig books that weren’t cataloged
    well. A search for these didn’t always show the items. She wanted to fix this
    but didn’t know how. Having an interest in computers beyond merely using them,
    Josie had experimented with Linux on her old laptop. She figured out how to extract
    and load a file of MARC records, working with her library’s ILS, but that was
    as far as she got. She couldn’t find a way to add a field to each of these records
    to make the collection searchable. A friend of hers, Lisa, who wrote software
    for a living, had mentioned how much she liked using Perl, so Josie thought she’d
    give it a try. Between Lisa’s willingness to help and Josie’s explaining the structure
    of MARC records, they felt they could solve this problem. As any computer running
    Linux typically comes with Perl, and Josie’s laptop had it, that was one hurdle
    out of the way.


    CPAN, the Comprehensive Archive Network.


    Working on Josie’s Linux machine, Lisa had her get to the command prompt. In this
    chapter, the command prompt is shown as `>>` (your prompt may look different).
    Then, to double-check that Perl was installed, she had Josie enter the command
    which is `perl`. Since the result from that was `/usr/bin/perl`, they were good
    to go. Otherwise, if the result had been just the command line prompt, Lisa would
    have had to install Perl for Josie.


    Lisa decided to get Josie started with a simple program that says, “Hello, world.”
    She had Josie use a text editor, enter the two lines below, and save it as `hello.pl`:


