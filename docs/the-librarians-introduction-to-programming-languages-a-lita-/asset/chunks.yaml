- fmt: '

    Putting an environment together to write and compile C programs is a bit different
    for each operating system. In a Linux or Mac OS environment, the basic tools come
    right out of the box, while in a Windows environment, some additional tools need
    to be installed on the computer. This difference originates in the lineage of
    these two categories of operating systems. UNIX and its descendants are something
    called `POSIX` compliant. The acronym stands for Portable Operating System Interface,
    which is a standard written by the IEEE that outlines some must-haves for an operating
    system. Most of these prerequisites have to do with C implementation details and
    other specific Linux utilities. The way Windows evolved was separate and distinct
    from UNIX, so `POSIX` compliance was never a driving factor with that operating
    system.


    The important thing to remember is that the main goal of the `POSIX` standard
    was to ensure compatibility between systems (Isaak 1990). This goes hand in hand
    with the previously stated original objective of C to be a language that can be
    used to build UNIX through a compilation of C code. `POSIX`-compliant operating
    systems implicitly ship with all the tools you need to write C code. Windows,
    on the other hand, is not a `POSIX`-compliant operating system, and getting the
    basic tools together requires the installation of a piece of software that makes
    your Windows computer behave more like a UNIX-based machine (Daintith and Wright
    2008). However, you wouldn’t want to start writing enterprise-level code after
    setting up your computer using the methods described below; this chapter is strictly
    a crash course that will provide you with just a taste of what C is and how it
    differs from other languages.


    ## Linux and Mac OS


    As just mentioned, the tools are available out of the box. Our investigation will
    use two tools. Firstly, GCC, which stands for GNU C Compiler. If you open a `Terminal`
    window and type `gcc` and hit enter, you’ll probably see some error and a message
    such as `compilation terminated`, which actually means that it was completed.
    Great, that was easy. Secondly, use any text editor to enter code. We’ll use `nano`.
    In both Linux (in this case Ubuntu) and Mac OS, `nano` comes preinstalled. To
    verify, open a `Terminal` and type in `nano`. You’ll see a rudimentary interface
    drawn to the screen. Hit `Ctrl + X` to exit. Done. Compare this now with the instructions
    for Windows.


    ## Windows


    A version of the C tools you’ll need doesn’t ship with Windows. If, however, you
    have some version of Microsoft’s Visual Studio installed, it will come with the
    needed tools. In our case, though, we are going to do something different. We
    are going to install a utility called `Cygwin`. `Cygwin` is essentially a piece
    of software that will help you to recreate a Linux environment in Windows. The
    added benefit of `Cygwin` is that it allows you to run other interesting and very
    helpful UNIX shell commands, such as `more` and `echo`. More on these later. Traditionally
    speaking, learning C goes hand in hand with UNIX; you would be best served to
    spend some time getting comfortable on a command line to get the full flavor of
    the experience.


    To begin, download the correct version of Cygwin from `http://cygwin.com/install.html`.
    To make things easier, try the 64-bit release first and then try the 32-bit if
    that doesn’t work. Once you run the file you downloaded, you’ll be prompted with
    a lot of click-throughs. You’ll need to pick a download site (figure 8.2); any
    site will do.


    ![](OEBPS/image/Figure_8.2.jpg)


    Figure 8.2. Choose A Download Site screen.


    You can also pick a site that is geographically close to help speed up the download.
    Just look for domain names that match your locale. Once the base system is installed,
    you’ll be prompted to install the packages you want. There are many options available
    here, but all we want to do is expand the `Devel` box and click on the double
    arrow so that everything will be installed. It should look like the image in figure
    8.3.


    ![](OEBPS/image/Figure_8.3.jpg)


    Figure 8.3. Cygwin setup Devel install.


    The box under “Bin?” changes from an empty square to a checked square. Now search
    for “nano,” expand `Editors`, click on `Skip` to toggle it to a checked square
    (figure 8.4).


    ![](OEBPS/image/Figure_8.4.jpg)


    Figure 8.4. Select Editors screen.


    Hit `Next` a couple of times, wait for the download, and install. Click `Finish`
    at the last step to complete the process. Look for `Cygwin Terminal` or something
    similar in your start menu. The result is a box with a blinking cursor ready for
    you to type away.


    ## Examples


    Before we can begin with some actual examples, we need a general overview of the
    steps involved in creating a C program:


    *   Write the source code of the application. Source code has the extension `.c`.

    *   Compile the source code into an intermediate “object file” that is something
    halfway between human-readable code and the binary instructions that the computer
    will run.

    *   Link the newly generated object file with additional object files that introduce
    the necessary built-in library functions required by the application. For example,
    if your program includes code that manipulates files, you’ll need to link to object
    files that provide this functionality. The human-readable versions of these built-in
    functions are kept in header files that have the extension `.h`.

    *   The final step is to create an executable file that can be run stand-alone
    on the `Terminal` command line.


    In our examination, we’ll be abbreviating some of these steps to make things a
    bit easier to follow.


    ## Hello World


    Open a `Terminal` window (or Cygwin, depending on your system) and type the following:


    ```

    nano helloworld.c

    ```


    You’ll be greeted with a rudimentary text editor interface. Type in the following
    exactly as it is:


    ```c

    /* Hello World program */

    #include<stdio.h>


    main() {


    printf("Hello World\n");

    }

    ```


    Hit `Control + O` to save the file. Then `Control + X` to exit. Once you have
    returned to the command line, type the following:


    ```

    gcc helloworld.c

    ```


    This will compile and link your program into an executable file.


    ```

    ls

    ```


    This will show you the contents of current folder/directory.


    ```

    ./a.out

    ```


    This will run your program. `a.out` is the default program name that `gcc` compiles
    to. We prepend `./` to the beginning of the command because we are saying look
    in the present directory first. The `.` is a shortcut operator that references
    the current directory. When we want to refer to something that is in a directory,
    we use the `/` character.


    After all of this wizardry, only the most basic of tasks has been completed. This
    is the output from the command terminal after following all of the steps:


    ```

    >nano helloworld.c

    >gcc helloworld.c

    >ls

    a.out helloworld.c

    >./a.out

    Hello World

    ```

