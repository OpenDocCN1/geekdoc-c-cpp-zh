  trans: "\n\n`java.util.GregorianCalendar` 是 `Calendar` 的一个具体子类，提供了世界上大多数地区使用的标准日历系统。`GregorianCalendar`\
    \ 类允许程序员以熟悉的格式（月份、日期、年份等）输入日期，并轻松地将其转换为 Java 能够理解的日期。`GregorianCalendar` 类还提供了数学函数，使你可以通过对日期进行加减时间来操作日期（Oracle\
    \ 2015）。`java.util.Scanner` 类是将数据读入 Java 的众多方法之一。它是一个简单的文本扫描器，可以使用正则表达式解析基本数据类型和字符串（Oracle\
    \ 2015）。\n\n使用现有的 Java 类时，需要记住的一个重要点是，它的工作方式可能与你预期的完全不同。在使用类类的函数之前，理解其功能是非常重要的，否则你可能会得到意外的结果。例如，在上面的代码读取了一个月份整数后，它减了\
    \ 1。\n\n```java\nmonth = month-1; // Calendar 类中的月份是 0-11，而不是 1-12\n\nGregorianCalendar\
    \ birthday = new GregorianCalendar(year, month, day);\n```\n\n这是因为正如注释所指出的，日历类中的月份是从\
    \ 0 到 11，而不是 1 到 12。如果该程序的用户出生在 1 月，当被提示时他可能会输入 1 作为出生月份，但 Java 会将其解释为 2 月。确保数据被正确解释是程序开发者的责任。\n\
    \n这个特定的例子可能永远不会出现，但很多时候，类或函数的行为并不完全按照不熟悉的用户可能预期的方式运行。在在使用新事物时，阅读文档始终是一个好主意。\n\n\
    有许多这类内置类可以帮助各种操作，例如 `File` (`java.io.File`)，允许用户编辑文件；`Math` (`java.io.Math`)，用于复杂的数学方程；或者\
    \ `NumberFormat` (`java.io.NumberFormat`)，它允许用户指定数字数字格式，甚至精确到货币类型（包括欧元和美元）。Java\
    \ 8 包含的所有类列表可以在此处找到：[`docs.oracle.com/javase/8/docs/api/allclasses-noframe.html`](http://docs.oracle.com/javase/8/docs/api/allclasses-noframe.html)。\n\
    \n如果你想查看某个类包含哪些方法或如何使用某个特定方法，查询该类的文档是值得的。此外，如果你尝试使用某些东西但它运行不像你的预期，在互联网上搜索 Java\
    \ 论坛总是很有。很有可能有人遇到过和你同样的困惑。\n\n## Java Applet\n\n这是一个生成可以嵌入网页浏览器的 Java applet 代码示例。与基于控制台的应用程序不同，applet\
    \ 代码运行不需要 `static void main` 函数。此函数对 `graphic` 类的使用非常少，但它可以用于进行更复杂的绘制。还有一个 3D\
    \ 图形类，可以实现三维图形，以及许多其他的图形类。\n\n```java\nimport java.applet.Applet;\nimport java.awt.Graphics;\n\
    import java.awt.Color;\n\npublic class Main extends Applet\n{\n    public void\
    \ paint(Graphics g) {\n        Color color = Color.RED;\n        g.setColor(color);\n\
    \        g.drawString(\"This is a Java Applet\", 25, 25);\n    }\n}\n```\n\n这使用\
    \ `Color` 类来设置文本颜色。在这种情况下，示例使用了内置常量 `RED`，但代码也允许使用颜色十六进制代码来获取用户想要的精确颜色。\n\n##\
    \ 总结\n\nJava 是一种健壮、可移植、面向对象且熟悉的语言。它是所有 Android 应用程序使用的语言，也可以用于许多其他类型的项目，包括从开发\
    \ Web 应用程序到为 SIM 卡和其他微设备的一切。虽然 Java 的学习可能比一些较新的语言复杂，但它是一门拥有深厚历史、庞大用户群可用工具集的成熟语言，可以帮助新手和老手。Java\
    \ 的可移植性、易用性和成熟性使其成为各种各种大小编程项目的强大工具。\n\n## 参考文献\n\n- Deitel, P., H. Deitel, and\
    \ A. Deitel. 2014. *Android for Programmers: An App-Driven Approach*. Upper Saddle\
    \ River, NJ: Prentice Hall.\n- Gassner, D. 2011. “Java Essential Training.” [Lynda.com](http://Lynda.com).\
    \ [`www.lynda.com/Java-tutorials/Java-Essential-Training/377484-2.html`](http://www.lynda.com/Java-tutorials/Java-Essential-Training/377484-2.html).\n\
    - Murach, J. 2011. *Java Programming*. 4th ed. Fresno, CA: Mike Murach & Associates.\n\
    - Niemeyer, P., and D. Leuck. 2013. *Learning Java*. Beijing: O’Reilly Media.\n\
    - Oh, H. S., B. J. Kim, H. K. Choi, and S. M. Moon. 2012. “Evaluation of Android\
    \ Dalvik Virtual Machine.”\n- Schildt, H. 2014. *Java: A Beginner’s Guide*. New\
    \ York: McGraw-Hill Education.\n\n"
- fmt: '

    ### class-based programming

    A style of object-oriented programming in which inheritance is achieved by defining
    classes of objects, as opposed to the objects themselves.


    ### compiler/compiled language

    A computer program (or set of programs) that accepts source code and produces
    a binary executable; in other words, it is another program that executes the instructions
    contained within the code. A compiled programming language is a language that
    is sent through a compiler first before any code is executed. Compare with interpreter/interpreted
    language.


    ### console-based application

    A computer program designed to be used via a text-only computer interface.


    ### database structure

    The database structure defines the format for organizing and storing data. There
    are a variety of different structure types, but most will specify the file, array,
    record, and table. Types of structures include flat files (records within do not
    have any relationship among them), relational (multiple databases that have a
    relationship with each other), and object oriented (data are treated as objects).


    ### data type

    A data type is an attribute that specifies the type of data an object is able
    to hold. This data-type specification affects the values, operations, the way
    values can be stored, and the meaning of the data. Data types include text, byte,
    integer, currency, and many more.


    ### declarative language

    A term used to describe high-level programming languages that, without the programmer
    knowing an exact procedure, can be used to solve problems.


    ### embedded application

    A software application that permanently resides in an industrial or consumer device.


    ### environment

    In general, the programming environment is the base on which the programming is
    performed. This includes the software and hardware needed to complete the programming
    function.


    ### filehandle (file handle)

    A number that an operating system assigns to a file immediately after it is opened.


    ### function

    In the context of programming languages, a function is a construct that takes
    an input, performs some operations, and then possibly returns an output value.
    Unlike mathematical functions, programming functions can operate on nonnumeric
    input. For instance, a `toUppercase` function might take a string of text and
    return the same text but with all lowercase letters transformed into their uppercase
    equivalent.


    ### gem

    A gem is a self-contained holder for Ruby programs and libraries. `RubyGems` is
    a packaging manager that is used to distribute the gems.


    ### hash

    Hashes are similar to arrays, but rather than requiring values to be integers,
    hashes allow any object type.


    ### HTML

    An acronym for HyperText Markup Language, the markup language that powers the
    web. HTML features angle-bracket-encased “tags” like `<title>` that tell web browsers
    what the meaning and function of different text strings should be.


    ### HTML5

    A loose group of web browser features and standards that aimed to move the World
    Wide Web from static documents to a full-fledged application development platform
    that could compete with mobile and desktop operating systems. Examples of HTML5
    features include geolocation, client-side data storage, and the `<video>` and
    `<audio>` HTML tags.


    ### inheritance

    When an object or class is based on another object or class, using the same implementation
    to maintain the same behavior.


    ### integrated development environment (IDE)

    A software application that provides comprehensive facilities to computer programmers
    for software development. An IDE normally consists of a source-code editor, build
    automation tools, and a debugger.


    ### interpreter/interpreted language

    A computer program that accepts source code and immediately executes its instructions
    without creating another executable program in the interim. An interpreted programming
    language is a language that uses an interpreter to execute its code. Compare with
    compiler/compiled language.


    ### library

    In computer programming, a library is a collection of similar objects stored for
    infrequent use, often to develop software. These may include configuration data,
    documentation, help data, message templates, prewritten code and subroutines,
    classes, values, or type specifications.


    ### loop

    A loop is a repeated sequence of coded instructions. The sequence is repeated
    until a specified condition is met.


    ### object/object-oriented programming (OOP)

    A programming language that combines data structures with functions to create
    reusable objects. These objects have data fields (attributes that describe the
    object) and associated procedures known as methods. For instance, in a program
    a book object might have both a `title` property that is a text string as well
    as a `get_cover_image` method that, when invoked, returns a cover image pulled
    from a third-party service. Most programming languages support some form of OOP.


    ### parse

    Parsing text or code means to separate the string of text (think of it as a sentence
    in literature) into its component parts.


    ### portable

    The usability of the same software in different environments.


    ### private variable

    A variable that is visible only to the class to which it belongs.


    ### procedural programming

    Procedural languages are those that function in a step-by-step process, establishing
    each procedure that needs to be completed before moving on to the next. Generally,
    these are older languages, such as `C`.


    ### protected variable

    A variable that is visible only to the class to which it belongs and any subclasses.


    ### public variable

    A variable that is visible to all classes.


    ### regex

    `Regex` (regular expression) is a string or sequence of text or code that is used
    to describe a search pattern. Regexes are useful for searching code to find a
    particular sequence or pattern to update or modify.


    ### runtime environment

    Runtime environment is essentially the configuration of software and hardware
    needed to support the program. Environment support includes CPU type, operating
    system, and other programs or add-ons needed to perform the tasks.


    ### script

    Scripts are sequences of instructions or programs that are read and carried out
    by another program rather than the computer itself or a human operator. This enhances
    the automation of the function(s) being performed.


    ### scripting language

    A scripting language supports the use of scripts.


    ### software development kit (SDK)

    A set of software development tools that allows the creation of applications for
    a certain software package.


    ### strongly or weakly typed language

    These terms are often subjective depending on the point of view of the individual.
    However, in general, a strongly typed language is one needing each variable or
    value to be assigned a data type. A weakly typed language is more flexible in
    that data types do not need to be explicitly assigned.


    ### terminal

    A terminal allows you to communicate with a computer or web page. Communication
    is bidirectional—sending and receiving information. Usually, a terminal involves
    a display screen and keyboard, although there are more sophisticated terminals.


    ### XHR/XmlHttpRequest

    See AJAX.


    ### type/type system

    A programming language with a type system that internally associates each data
    structure with one of an enumerated set of types—which often can be added to by
    the programmer—that each have distinct behaviors and can perhaps only be involved
    in certain kinds of operations. For instance, it is a type system that would insist
    that a text string `hello` could not be multiplied by the floating-point number
    `1.23`.


    Here are a few websites that may help you as you read through the text:


    - http://www.computerhope.com/jargon.htm

    - http://www.math.utah.edu/~wisnia/glossary.html

    - http://www.csci.csusb.edu/dick/cs202/glossary.html

    - http://www.cs.kent.ac.uk/people/staff/djb/oop/glossary.html

    '
