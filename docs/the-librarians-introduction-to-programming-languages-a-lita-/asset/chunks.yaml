- fmt: '

    The predominant programming language used in library software is `PHP`. Drupal,
    ContentDM, Joomla, ResourceSpace, WordPress, LibGuides, MediaWiki, and PHPMyAdmin
    are written entirely or partly with `PHP`. It is common for a `PHP` application
    to include HTML, `CSS`, and `JavaScript` for visually pleasing websites. Any customizations
    a library needs to perform on these systems not covered in an initial installation
    or support contract must be made by a `PHP` developer. Drupal, WordPress, Joomla,
    and MediaWiki are open-source projects that are focused on expandability, with
    modular extensions that can be contributed by the developer community. The inspirational
    idea behind modular extensions is that no institution or library is an island;
    likewise, any feature a librarian might write to help patrons can help any number
    of other libraries’ patrons. Employees who work within institutions should check
    to ensure their institution’s intellectual property policies coincide with their
    position working on open-source projects.


    Modern Websites

    Modern websites have taken on features developed for mobile sites, which feel
    more like web apps with very responsive designs. This is frequently made possible
    with `JavaScript` talking to an application program interface (`API`) powered
    by `PHP`. An `API` gives browsers ways of communicating with a server when other
    mechanisms are not feasible. `PHP` can generate data that is sent to a browser
    when a user requests a web page; however, once that page has loaded, `PHP` cannot
    change any part of the page. Instead, the page includes `JavaScript` that updates
    sections of a page with new data by asking an `API` for an update. Users can find
    live weather updates, election results, shipping statuses, and updated social
    media posts without having to refresh their page. It is important to note that
    `PHP` is not the only language capable of creating an `API`; however, it is a
    popular choice in library environments.


    `PHP` is a common choice for `API` programming languages because `PHP` has documented
    ease of communication with databases. `PHP` can communicate with `CUBRID`, `DB++`,
    `dBase`, `filePro`, `Firebird/InterBase`, `FrontBase`, `IMB DB2`, `Informix`,
    `Ingres`, `MaxDB`, `MongoDB`, `mSQL`, `Mssql`, `MySQL`, `Oracle OCI8`, `Paradox`,
    `PostgreSQL`, `SQLite`, `SQLite3`, `SQLSRV`, `Sybase`, and `tokyo_tyrant` ([http://php.net/manual/en/refs/database.vendors.php](http://php.net/manual/en/refs/database.vendors.php)).
    Support for advanced database features in a `PHP` application ultimately varies
    based on the specific database used in the application. Where a chosen database
    lacks support for a certain feature, `PHP` can sometimes accommodate.


    # PHP Basics


    Handling information going to and returning from databases is the role of variables.
    Variables are the core of any programming language, and `PHP`’s way of handling
    variables is one of the areas weakened by its history. Where other languages explicitly
    define a variable as a number or word, variables in `PHP` do not have strict data
    types. From the perspective of a seasoned `PHP` developer, required data type
    definitions seem like an annoying hurdle. A lack of stated data types can cause
    problems while learning the language, especially when it comes to making an application
    more efficient. If your application has a series of true/false variables, storing
    that in memory the same way you would store whole textbooks would waste precious
    memory. `PHP` tries to allocate enough memory for each chunk of data without overtaxing
    the system. Working with databases poses interesting issues considering that most
    databases explicitly define each piece of data. Careful consideration is needed
    when sending data to a database to be stored. Retrieving data from a database
    is less traumatic because it is easier to move data from a more specific container
    to a less specific container. Likewise, it is easier to convert an on/off switch
    into words than words into whether a switch is on or off.


    Libraries and special collections have a growing interest in encoded archival
    documents. The nature of an electronic thesis or dissertation (ETD) suggests that
    each field be carefully considered for a certain type of data. That precision
    can be lost if not preserved within the application itself. Languages that support
    data types require the type of variable (number, string, true/false, date, and
    similar), which has a clear advantage when working with ETDs. `PHP` developers
    could view these data-type considerations as a bit unnecessary, if only because
    there is not a clear way to keep track of variable types in the `PHP` language.


    ## Data Types

    String, integer, floating point number, array, `Boolean`, objects, and resource
    are the seven types of data `PHP` can store as variables. Variables are defined
    in `PHP` using a dollar sign followed by the name of the variable you want to
    create or change. For example, `$my_variable = 123`.


    *   A string is a sequence of numbers or characters. Letters, words, sentences,
    paragraphs, and books can be stored as a string: `$my_variable = “Go Gamecocks!”`.

    *   An integer is a whole number: `$my_variable = 2`.

    *   A floating point number, sometimes called double precision number or float,
    is a fractional number: `$my_variable = 3.14159`.

    *   An array is a variable that is a collection of other variables. Its form can
    be a little confusing to see for the first time and its true usefulness is beyond
    the scope of this introduction, but, like all `PHP` topics, there’s no shortage
    of free tutorials: `$my_variable = array(“Cat”, “Dog”, 2, 4, 6, 8)`.

    *   A `Boolean` variable holds a binary value of `true` or `false`. This datatype
    has a wide variety of uses, such as on/off, yes/no, dog/not-dog, checked-in/checked-out,
    clean/dirty: `$book_checked_out = true`.

    *   Objects are a type of variable that are like subroutines that can hold their
    own code and variables internally. Objects are discussed in the section on object-oriented
    programming in `PHP`: `$my_object = new my_object()`.

    *   Resources are objects that connect `PHP` to additional resources: `$my_connection
    = new database_connection()`.


    ## Variable Rules

    Variable names have some minor rules and some best practices. This outline of
    do-nots can look overly restrictive but, in practice, makes variables more identifiable:


    *   Variable names must only contain uppercase and lowercase letters, numbers,
    and underscores: `$this!0lid`.

    *   They cannot start with a number: `$2bad`.

    *   (Best Practice) Names should describe what they do: `$time_event_starts =
    “2020-05-29”`.

    *   (Best Practice) Names should not start with an underscore: `$_generally_bad`.


    ## Setup

    For learning and debugging purposes, these instructions will outline a standard
    Windows environment. These instructions depend on two downloads for NetBeans and
    WampServer. NetBeans will be used as our integrated development environment (IDE).
    An IDE can identify missing characters, provide code completion, and aid file
    management. WampServer (Wamp stands for Windows, Apache, MySQL, and PHP) will
    serve as the production environment that will process PHP code written in NetBeans
    and display the results in a browser. WampServer requires certain network permissions
    to run correctly because it causes your computer to act as a web server. These
    instructions can be modified for Macintosh computers by replacing WampServer with
    MAMP ([http://www.mamp.info/en](http://www.mamp.info/en)/). If you have already
    installed NetBeans for working with other languages, you can add support for PHP
    by installing the PHP plug-in from within the NetBeans plug-in tool.


    *   Download WampServer from [http://www.wampserver.com/en](http://www.wampserver.com/en)/.
    If you are unsure you need the 32-bit or 64-bit version, use the 32-bit option.

    *   Install WampServer using the default install location: `C:\Wamp`.

    *   Allow WampServer to start after the install has finished. Whenever there is
    new code to test, WampServer will need to be running.

    '
