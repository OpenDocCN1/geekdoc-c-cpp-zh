    [http://whatis.techtarget.com/glossary/Programming](http://whatis.techtarget.com/glossary/Programming)


    # Additional Resources


    Editor’s note: It was difficult selecting items since there are many to choose
    from, as well as a bevy of online options. The items below come from personal
    experience, examining reviews with many grains of salt, and recommendations from
    colleagues who code. There are others, frequently the For Dummies, O’Reilly, and
    Head Start items, which may work as well. Videos, including those on YouTube,
    offer great tips and programming examples, as do online forums and training sites.
    As librarians, however, we all know to evaluate the quality of our sources.


    ## General Resources


    - **Codecademy**: [http://codeacademy.com](http://codeacademy.com). Free interactive,
    although text-based, courses to learn the fundamentals of `Python`, `Ruby`, `JavaScript`,
    `PHP`, `SQL`, and `Java`.


    - **Code School**: [https://www.codeschool.com/free](https://www.codeschool.com/free).
    Free courses for learning the basics of `Ruby`, `JavaScript`, and `SQL`.


    - **Coding Bat**: [http://codingbat.com](http://codingbat.com)/. Coding practice
    for `Java` and `Python`. Not so much a tutorial as a place to see examples and
    determine the logic behind them. Text and video instruction. Good source once
    you understand how it is designed.


    - **W3Schools**: [http://www.w3schools.com](http://www.w3schools.com)/. Free tutorials
    and code examples for `JavaScript`, `SQL`, and `PHP`.


    ## Books


    ### General Programming and Coding


    - **Abraham, Nikhil. 2015. Coding For Dummies. New York: For Dummies.**: Focused
    on the web-based languages (`JavaScript`, `Ruby`, and `Python`), this book helps
    readers understand interactions among languages as they work together and the
    features of each. Readers will build an actual web-based application. Includes
    inspecting code through a browser tool. Requires basic terminology knowledge but
    does explain beginning topics well. An environment for trying out tutorials and
    practice coding and receiving output is provided, and “End of Chapter” challenges
    are included. Online exercises developed by `Codecademy` to help hone coding skills
    and demonstrate results as you practice.


    - **Farrell, Mary E. 2007. Computer Programming for Teens. Boston: Cengage Learning.**:
    Recommended for the effective explanation of concepts and basic programming topics.
    Having a solid background and understanding of concepts and terminology will makes
    it easier to learn the syntax of programming languages.


    - **Martin, Robert C. 2008. Clean Code: A Handbook of Agile Software Craftsmanship.
    Upper Saddle River, NJ: Prentice Hall.**: Presents best practices for coding,
    including items such as meaningful names, pertinent comments, formatting for followers,
    and more. `Java` is the language used in the examples, but guidelines are applicable
    across most languages. Recommended to read early to follow best practices.


    - **Sande, Warren, and Carter Sande. 2013. Hello World! Computer Programming for
    Kids and Other Beginners. 2nd ed. Greenwich, CT: Manning.**: Not just for kids.
    Easy-to-follow instructions. Although written for early teens, the images, analogies,
    and language let readers focus on content rather than complicated terminology.
    Brings complex ideas, such as `variable nested loops`, into layperson terms. Authors
    do not assume even a basic level of technical knowledge. Helpful features are
    notes and an appendix that provide some key differences between `Python 2.x` and
    `Python 3.x`. Offers exercises at ends of chapters. Software is easy to install
    and access. Includes focus on game development. Provides “Test Your Knowledge”
    and “Try It Out” sections.


    - **Wang, Wallace. 2008. Beginning Programming All-in-One Desk Reference for Dummies.
    New York: For Dummies.**: Good overview of computer science but does not teach
    programming per se. It does offer programming basics in a number of languages.
    Examples will not work due to age of book. Discusses important concepts, including
    compiling, algorithms, debugging, best practices, and much more. Advanced concepts
    include bioinformatics, computer security, and artificial intelligence.


    - **Yelton, Andromeda. 2015. Coding for Librarians: Learning by Example. Chicago:
    American Library Association.**: Compiles interviews with librarians to gather
    examples of real-life learnable programs that are in libraries today, thanks to
    librarians who learned to code to solve problems.


    - **Zelle, John. 2010. Python Programming: An Introduction to Computer Science.
    2nd ed. Portland, OR: Franklin, Beedle & Associates.**: Very good introduction
    to theoretical computer science concepts in general, with a focus on problem solving
    with `Python 3` as language of choice. Reviewed as being an excellent item for
    beginners, both to programming in general and `Python` specifically. Examples
    are somewhat mathematically based so can be harder to learn but do provide solid
    examples of what can be accomplished. Does not teach `Python` step by step. Other
    books provide better `Python` programming.


    ### Python


    - **Severance, Charles R. 2013. Python for Informatics: Exploring Information.
    Seattle: CreateSpace.**: Free and best used in conjunction with his Coursera ([coursera.com](http://coursera.com))
    course. Despite the title, it is an introduction to `Python` with real-world data
    examples as the backdrop. A good starter book written in a concise yet engaging
    style. Works with `Python 2.x`.


    - **Shaw, Zed A. 2015. Learn Python the Hard Way. [http://learnpythonthehardway.org/book](http://learnpythonthehardway.org/book)/.**:
    Solid overview of `Python` for beginners. Not always the easiest to follow but
    does provide a comprehensive tutorial style.


    - **Sweigart, Al. 2015. Automate the Boring Stuff with Python: Practical Programming
    for Total Beginners. San Francisco: No Starch Press.**: Skills and concepts for
    those new to `Python` programming, but not necessarily the absolute beginner.
    Provides solid background to programming concepts in general. Breaks content into
    bit-sized chunks for retention. Build tools that have everyday use. Covers `Python
    3.x`.


    ### Ruby


    - **Metz, Sandi. 2012. Practical Object-Oriented Design in Ruby: An Agile Primer.
    Boston: Addison-Wesley.**: A solid treatise in object-oriented design. Uses `Ruby`
    as the backdrop, but content is extendable to other object-oriented languages.
    Might be too much for absolute beginners but well worth the read once you have
    the underpinnings of `Ruby`.


    - **Pine, Chris. Learn to Program. 2nd ed. Frisco, TX: Pragmatic Bookshelf.**:
    A good introduction to programming with `Ruby`.


    ### JavaScript


    - **Free Code Camp**. [http://www.freecodecamp.com](http://www.freecode.com)/.
    Free online source for practicing `JavaScript`.


    - **Myers, Mark. 2014. A Smarter Way to Learn JavaScript: The New Approach That
    Uses Technology to Cut Your Effort in Half. Seattle: CreateSpace.**: Provides
    a solid foundation for `JavaScript` fundamentals, especially the very basic things
    that a lot of “beginner” books neglect. Written in easy-to-follow language and
    with a well-thought-out design. Provides a sandbox environment to practice the
    examples in. Strongly interactive. Vast array of examples.


    - **Zakas, Nicholas C. 2014. The Principles of Object-Oriented JavaScript. San
    Francisco: No Starch Press.**: Builds on some basics as it works solely with `JavaScript’s
    object-oriented nature. Very clear explanations.


    ### Perl


    - **Christiansen, Tom, Brian D. Foy, Larry Wall, and Jon Orwant. 2012. Programming
    Perl: Unmatched Power for Text Processing and Scripting. 4th ed. Sebastopol, CA:
    O’Reilly Media.**: Considered to be the book on `Perl`. Not known as a beginner’s
    book but a second tier once you have some programming experience.

    '
