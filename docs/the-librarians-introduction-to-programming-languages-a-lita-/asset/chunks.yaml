    \ >\n        <button type=\"submit\">Submit</button>\n    </form>\n</body>\n</html>\n\
    ```\n\n### Submission Logic\nThis file accepts data from the submitted form, then\
    \ sends the data to a database to be stored.\n\n`C:\\Wamp\\www\\my_project\\submit.php`\n\
    \n```php\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"UTF-8\">\n    <title>Submission\
    \ page</title>\n</head>\n<body>\n<?php\n    require_once('configuration.php');\n\
    \    $connection = new PDO( $db_type . \":host=\" . $db_host . \";dbname=\" .\
    \ $db_database,\n        $db_user,\n        $db_pass);\n\n    /*\n    Traditionally,\
    \ input is accessed with $_POST['var_name'] but filter_input allows more sanitation\
    \ to minimize injection access. user_name, user_number, user_msg are the values\
