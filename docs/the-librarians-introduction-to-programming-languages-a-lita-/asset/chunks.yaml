    “Remember, an array is a grouping of variables,” Lisa said. “Variables always
    have the `$` sign first in the name; that’s how we know it’s a variable. So you
    refer to `$encyclopedia[n]` to mean the nth variable (or volume in this example)
    in an array, well really `nth + 1`, whereas `@encyclopedia` refers to the array
    as a single unit, or the whole encyclopedia.”


    After thinking this over a bit, Josie indicated for Lisa to continue.


    “Ok. Line 10 is where we put values into this array, and it’s pretty cool, I think,”
    Lisa went on. “Rather than the `while` loop we saw earlier, we can read the entire
    file all at once. Each variable, or element, in the array holds one line from
    the file we’re reading. Unless you’re reading a really huge file, this method
    works great! In line 12, we set up `$recnum` so that we can use it to refer to
    each record of elements in the array `@marclines`, and we set that up in the `while`
    loop in line 13.”


    “Wait, this is weird,” Josie interrupted. “How can we compare a numerical variable
    to an array? That’s like apples and oranges.”


    “Ah,” Lisa answered, “context. Perl knows that `$recnum` is numeric, so it looks
    at array `@marclines` in a numeric way. How does it make that work? It knows the
    number of elements, or variables, in `@marclines`. So the `while` loop starts
    with `$recnum` as 0 and keeps accessing the variables in `@marclines` until it
    reaches element number n. However, element n does not exist since an array has
    elements 0 through `n – 1`! At that point we’re done with the `while` loop; no
    more data to process.”


    Lines 15–16 are mostly similar. Looking at line 16, we see that `substr` is the
    substring function, which curiously enough, copies a part of a string (of characters).
    From the record in array `@marclines` referred to by the current value of `$recnum`,
    extract a copy of the characters starting at position twelve for a total of five
    characters. Since we’re extracting digit characters, and then doing math with
    them, the `– 1` part, Perl converts those five digits into one number and subtracts
    one, then puts that value into `$baseaddr`. Line 15 uses the `print-with-formatting`
    function to output the leader of a MARC record. The `printf` function has the
    formatting specified inside the double quotes. You can also put literal text in
    there, like `LDR:`, and also use characters like `\n`. Certain character groupings
    that start with `%` inside the double quotes signify a format. In this case it’s
    a very basic `%s`, meaning it will handle a string of unspecified length and doesn’t
    do any further formatting. After the double quotes is a comma, and the list of
    variables/values to be substituted inside the formats on the left. Here we have
    a single value, the result of that substring operation, which replaces the `%s`
    when `printf` does its thing.


    The next line of interest is line `25\.`. Yikes! Let’s look at that regex one
    piece at a time. We know a substitution will occur since it starts with `s`. The
    first thing it looks for is a hexadecimal number. It is actually the unprintable
    character used to indicate or delimit a subfield in the MARC format. Then we look
    at what is inside the square brackets `[ ]`, which indicates that we are looking
    for any lowercase letter or any single digit. Since that’s how subfields are identified,
    we know that this regex looks for the start of a subfield. Now we have reached
    the `/` regex delimiter, so what follows is what we substitute with. That’s a
    space, the `|` character, `$&`, and another space. The `|` character controls
    regex behavior (we’ll show that later) and we want that actual character, so we
    escape it by putting the `\` character in front of it. `$&` is one of those reserved
    Perl variables, and it contains what, if anything, was matched. And that’s what
    we do in the first part of a `s(ubstitution)` regex; find or match something.
    An illustration helps with the above. In this example, let’s show that subfield
    delimiter character, `\x1f`, using a `!` to make things clearer. Example input:
    `!cPutnams`. Example output: `|!c Putnams`. This formatting is applied to all
    subfields, as the regex ends with `g`.


    Line 27 may look a bit easier to understand. Here we are looking for the subfield
    and field delimiter characters and removing all of them. The `|` in that first
    part of the regex means match the `\x1f` or the `\x1e` character and remove these
    whenever encountered. Example input: `\|!c Putnams`. Example output: `|c Putnams`.
    Certainly more readable.


    Line 29 removes the first space in a line only if it is followed by the `|` character.
    We know this one is doing substitution, since that `s` starts it off. The caret
    `^` (or hat) character means to start matching at the beginning. It looks for
    any two characters (indicated by `..`) at the beginning, then a space, and then
    the `|` character. Since we’re looking for the actual `|` character, we have to
    escape it by putting the `\` in front of it.


    Josie is confused, “It sort of looks like that any-character part is going into
    `$tagdata`, but I’m not sure that’s right. And where did that `$1` come from?
    It’s not part of the program.”


    “Excellent question,” Lisa answered. “Any `$n` variables (where n is a single
    digit) are internal, or reserved, to regexes, and are used in that context.”

