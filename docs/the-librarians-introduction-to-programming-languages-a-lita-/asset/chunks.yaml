    Bengtson, J. 2012a. “The Art of Redirection: One Library’s Experiences and Statistical
    Results from the Deployment of Mobile Redirect Script.” Journal of Hospital Librarianship
    12 (3):191–98.


    ———. 2012b. “Scaling into the Future with Smartlinks.” Journal of Hospital Librarianship
    12 (4): 378–83.


    ———. 2013\. “What Is HTML5 and What Do You Need to Know about It?” Journal of
    Hospital Librarianship 13 (4): 392–98.


    Crockford, D. 2008\. JavaScript: The Good Parts. 1st ed. Farnham, UK: O’Reilly
    Media.


    Dahl, R. 2009\. “Ryan Dahl: Original Node.js Presentation.” November 8\. [https://www.youtube.com/watch?v=ztspvPYybIY.](https://www.youtube.com/watch?v=ztspvPYybIY.)


