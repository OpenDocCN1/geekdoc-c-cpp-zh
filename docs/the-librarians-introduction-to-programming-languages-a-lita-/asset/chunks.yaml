    Schwartz, Randal L., Brian D. Foy, and Tom Phoenix. 2011\. Learning Perl. 6th
    ed. Sebastopol, CA: O’Reilly Media. 该书为 `Perl` 的机制提供了一种非常实用的方法，侧重于随着章节推进而不断积累的知识。它是学习
    `Perl` 的极佳入门。可能需要旁边放一本通用的编程书籍，因为这本书本身并不介绍编程概念。


    ## PHP


    [C4Learn.com](http://C4Learn.com). [`www.c4learn.com/php/php-syntax/`](http://www.c4learn.com/php/php-syntax/)。一个设计良好的网站，左侧始终可见目录。它通过易于遵循的示例引导用户从基础转向更复杂的编程。


    PHP The Right Way. [`www.phptherightway.com`](http://www.phptherightway.com)/.
    涵盖了从基础到高级的信息，包括模板、错误与异常、服务器与部署以及额外资源。


    ## SQL


    Forta, Ben. 2012\. SQL in 10 Minutes. 4th ed. Indianapolis: Sams. 为初学者使用 `SQL`
    提供了坚实的背景。包含了最常见的语句和子句。对术语定义清晰。在结尾介绍了一些高级主题，以展示 `SQL` 的功能。通过主要的 DBMS：`MYSQL`、`SQL
    Server`、`Oracle` 和 `DB2` 进行示例教学。可下载的材料结合分步骤说明以及两个免费数据库工具，有助于巩固信息。


    ## C


    Perry, Greg, and Dean Miller. 2013\. C Programming Absolute Beginner’s Guide.
    3rd ed. Indianapolis: Que. 这是一本非常适合初学者的书，从基础开始引导用户进入更高级的话题。作者将主题分成短章节，提供了强大且多样化的示例。内容专为非技术人员编写。


    ## C#


    Miles, Rob. 2015\. The C# Programming Yellow Book. [`www.robmiles.com/c-yellow-book/`](http://www.robmiles.com/c-yellow-book/)。同样提供
    Amazon Kindle 电子书版本。提供了关于 `C#` 语言的细节，并为专业编程的推荐实践提供了良好的背景。文编写良好且易于理解。


    Using the Visual C# Development Environment. [`msdn.microsoft.com/en-us/library/ms173063.aspx`](https://msdn.microsoft.com/en-us/library/ms173063.aspx)。良好涵盖了
    `Visual Studio 2015` 与 `C#` 之间的相互作用。


    ## Java


    Eck, David J. Introduction to Programming Using Java. 7th ed. [`math.hws.edu/javanotes`](http://math.hws.edu/javanotes)/.
    免费提供，定期更新。专为初学者开发。提供了编程概念的妥当概述，并介绍了使用 `Java` 进行编程。


    Sedgewick, Robert, and Kevin Wayne. 2007\. Introduction to Programming in Java:
    An Interdisciplinary Approach. New York: Pearson. 一本设计非常优秀的书，针对初学者。包含了对编程术语和概念的扎实解释。代码示例具有实用性，并说明特定的观点或技术以巩固文本内容。


    ## 关于编辑和贡献者


    Beth Thomsett-Scott 拥有近二十年的科学图书馆经验，目前担任北德克萨斯州大学（UNT）的工程图书。她自 2001 年从加拿大搬来后一直任职于
    UNT。她热于让图书馆用户能够发现、访问和利用他们所需的信息。她的研究兴趣包括网站可用性、用户需求与满意度研究，以及图书馆员工的培训/指导。Thomsett-Scott
    曾在美国图书馆协会科学与技术分会、德克萨斯图书馆协会以及其他几个地区和国家组织中广泛服务，包括担任分部/部门主席、秘书以及各类委员会的主席。她目前的服务重点是特殊图书馆协会（Special
    Libraries Association）的工程与科学技术分部，她在其中担任多个角色。她编辑过两本书，并拥有多项出版和演讲的记录。


    Jason Bengtson 是德克萨斯州德克萨斯州休斯顿的德克萨斯医疗中心图书馆的创新架构师。他分别拥有爱荷华大学和新墨西哥州立大学的图书馆信息硕士（MLIS）和文学硕士（MA）。他曾担任过多个以技术为中心的图书馆职位，包括新墨西哥州立大学健康科学图书馆和信息中心的新兴技术/研发图书员，以及俄克拉荷大学
    Robert M. Bird 图书馆的计算与信息系统主管。他发表过多个不同主题，包括一个将复杂科学概念应用于元数据的理论模型。Bengtson 使用了大量语言和框架进行构建，包括
    `JavaScript`、`jQuery`、`jQuery UI`、`Bootstrap`、`AngularJS`、`HTML5`、`CSS3`、`PHP`、`XSLT`、`MySQL`、`ColdFusion`
    和 `Python`。


    Ashley Blewer 是一名 Web 开发人员和档案员。她拥有南卡罗莱纳大学的 MLIS 以及美术设计文学。她是 Flatiron School Web
    沉浸式学习项目的毕业生，担任数字档案和档案材料访问的独立顾问，侧重于视听格式。她此前曾在私营部门担任过集成工程师，并在南卡罗莱纳大学的移动影像收藏集担任过编目经理。她是湾区视频联盟（BAC）
    `QC Tools`（一种开源视频质量控制软件）以及 PREFORMA 的视频文件合规性检查项目 `MediaConch` 的贡献者。


    Amanda Cowell 是新泽西学院的新兴技术图书员。她拥有史文斯理工学院的计算机科学学士学位，以及鲁格斯大学的 MLIS 和 MBA。Cowell 此前曾在布鲁克林公共图书馆担任布鲁克林遗产项目的技术负责人，并在鲁格斯大学担任数字档案员。在成为图书员之前，她在洛马丁当了多年的软件设计与开发工程师。


    Heidi Frank 是纽约大学的电子资源与特殊格式编目图书员。她从事编目工作已十五多年，主要在传统部门使用领先的编目标准——`MARC`、`AACR2`
    和 `LCSH`。过去的三年里，Python 脚本成为她处理 `MARC` 数据的主要工具，用于改进质量控制、批量处理并创建更高效的工作流。她曾就 `PyMARC`
    和 `Python` 作为编目工具发表过演讲。她还担任相关的专业委员会。


    Charles Ed Hill 是马萨诸塞州韦斯特菲尔德韦斯特州立大学的系统与数字服务图书员。自从 2012 年在印第安纳大学获得图书馆硕士（MLS）以来，Hill
    花了大量时间研究如何通过代码节省时间，并逐个导航栏提升用户体验和无障碍。他目前正在探索使用 `Python` 构建工具和娱乐，以及 `JavaScript`
    和 `PHP`。


    Lauren Magnuson 是加州州立大学诺亚亚奇分校的系统与新兴技术图书员。她拥有密苏里大学的信息科学硕士和教育技术硕士（MEd），以及杜勒南大学的哲学学士学位。她的兴趣包括
    `PHP`、`Python`、数据分析和数据可视化，以及在学术图书馆中推广开源技术。


    Emily R. Mitchell 拥有印第安纳大学的图书馆硕士（MLS）和中央密歇根大学的教育技术硕士。她目前是州立大学奥威戈 Penfield 图书馆的网站管理员图书员，此前曾在
    Marick Learning 担任程序员，并在费里斯州立大学担任过图书员。她的研究重点是图书馆网站的用户体验。


    '
- fmt: '

    Eric Phetteplace is systems librarian at California College of the Arts, where
    his primary duties are maintaining and developing websites, an institutional repository,
    and an `ILS`. Previously, he was emerging technologies librarian at Chesapeake
    College. He holds a bachelor’s of arts and sciences in English and mathematics
    from Stanford University and an `MLIS` from the University of Illinois at Urbana-Champaign.
    In 2015, he was a fellow at the inaugural Institute of Open Leadership organized
    by Creative Commons. In his spare time, he plays the card game Netrunner and fiddles
    with code on `GitHub`.


    Tim Ribaric has been the digital services librarian at Brock University since
    2006. In addition to an `MLIS`, he has an undergraduate degree in computer science
    and is currently completing his master’s of computer science. Most of his work
    is done in `Python`, but he has a soft spot for `C`, the language he cut his teeth
    on.


    Jessica Rudder is a developer at the Flatiron School, where she focuses on building
    web applications that support adults and high school students in their efforts
    to learn to program in `Ruby` and `Objective-C`. She is a graduate of Flatiron
    School’s Web Immersive program. In addition to her technical training, she holds
    a bachelor’s of fine arts from New York University’s Tisch School of the Arts.
    She has worked in digital marketing with brands, including Disney and major European
    yellow pages in Belgium, Portugal, and Sweden.


    Jason Steelman holds a BA in media arts from USC and currently works for Robert
    Half Technology as a consultant in Des Moines, Iowa. He is a developer and technology
    leader in corporate, academic, and nonprofit institutions. His library experience
    includes work for the University of South Carolina with the William Gilmore Simms
    Initiatives, Moving Image Research Collections, Thomas Cooper Library, and Ernest
    F. Hollings Special Collections Library. Recent leadership includes USC’s Interactive
    Media-Rich Educational Environment program, where he served as the project’s lead.


    Peter Tyrrell is the director and lead developer for Andornot Consulting in Vancouver,
    British Columbia (`http://andornot.com`). He graduated with a BA in classics and
    English literature from the University of Victoria in 1998 and an `MLIS` degree
    from the University of British Columbia in 2003. He was hired by Andornot in 2001,
    becoming a shareholding director in 2010. He enjoys programming and considers
    figuring out how to make things work to be the most fun. Tyrrell considers himself
    lucky to be paid to fix things. He’s consulted for a variety of libraries, archives,
    and museums and codes on most days, usually in `.NET` and `C#`.


    Dean Walton is the science and technology outreach librarian at the University
    of Oregon. He is the subject specialist for biology, geology, and environmental
    studies and is working on experiential learning programs as they relate to the
    library and his subject areas. His other interests include work on disaster informatics,
    ecological mapping, and environmental sensor systems. He has a Ph.D. in biological
    sciences and is a past vegetation ecologist for the Nature Conservancy and the
    Virginia and West Virginia Natural Heritage Programs.


    Roy Zimmer works for the Library Systems Office at Western Michigan University.
    He has worked with `NOTIS`, `Voyager`, and now `Alma+Primo` library systems. He
    has written a number of `MARC` utilities available for anyone to use. He developed
    a normalization routine for good call number sorting. While the library was using
    `Voyager`, he implemented a number of vendor record data loads and also wrote
    the extracts to feed `MeLCat` (Michigan eLibrary Catalog), a statewide interlibrary
    loan partnership. He subsequently adapted these extracts for discovery services
    the library was using: the open-source `VuFind` and the commercial product `Summon`.
    He has presented at a number of annual user group meetings.

    '
