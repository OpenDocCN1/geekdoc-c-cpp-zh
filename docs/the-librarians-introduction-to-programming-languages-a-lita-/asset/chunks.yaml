    现在让我们回到第 52 行并解释它的功能。这里调用了子程序 `createnewrec`；同时，向它发送了一些数据，它也回传了一些数据。具体来说，它接收了领域数据、所有的字段标识符（如
    245 等）、每个字段的长度以及每个字段的数据。`createnewrec` 将这些数据组装成 `MARC` 记录，并将其发送（或返回）到调用它的地方。为了让子程序能够正确接收数组，在调用子程序时，数组名称前面应该有一个
    `\`。


    在第 70 行中，我们接收了发送给 `createnewrec` 的数据项。当子程序接收到数据项时，它们都包含在一个名为 `@_` 的单一特殊变量中，并且必须将它们分离出来。


    Josie 不得不打断：“数组是传入的，但现在它们变成变量了吗？”


    “某种程度上是，”Lisa 解释道，“把它想象成某种文件句柄。注意在第 71–73 行中，我们确保可以像往常一样作为数组来引用它们。这是处理这种情况的一种方法，可以让工作变得更简单。”


    第 83 行对于程序代码来说有点像英语。只要 `unless` 单词右侧的部分求值为“假”，就执行左侧的操作。`+=` 运算符将其右侧的内容加到左侧变量上。如你所见，你可以将表达式放在方括号
    `[ ]` 中，这用于引用数组元素 `n`，只要该表达式的结果是一个整数即可。


    Lisa 向 Josie 展示了如何在运行 Perl 程序之前检查其句法情况：`perl –cw program.pl`。


    Josie 这样做了，并按照指示纠正了几处拼写错误。然后她编辑了 `test.read` 文件，插入了一个 650 字段以获得更好的搜索结果。由于这是 `marcread`
    格式，Lisa 让她这样操作：`650:1111:11111: 0|aFreddie the Pig (Fictitious character) |v Fiction.`


    那些在 650 之后的数字是带有无意义值的占位符；`marcunread.pl` 在将数据转换回 `MARC` 格式时，会计算该字段的长度和偏移量。Josie
    运行了 `marcunread.pl` 并导入了生成的 `MARC` 文件。她尝试了搜索并成功了！她现在可以通过一次搜索找到所有这些书。有人看到我在这个程序中犯的错误了吗？它并没有阻止程序的正常运行。提示：这涉及到
    `$recctr`。


    ## 结语


    为了简单且紧凑地展示这些程序，它们以精简的形式呈现。我们鼓励使用更多的空行来划分代码区域，以便于理解。此外，还省略了错误检查，特别是 `marcunread.pl`。该程序及其他程序的更完整版本可以在作者的网页上找到（[`homepages.wmich.edu/~zimmer/marc_index.html`](http://homepages.wmich.edu/~zimmer/marc_index.html)）。下方显示的所有链接均于
    2015 年 12 月。


    ## 总结


    从简单的 Perl 程序开始，随着你技能的增长，按照自己的速度逐渐转向更复杂的程序。Perl 可以为你隐式地处理编程细节，让你专注于正尝试实现的任务。程序可以用功能性直观且易读的风格编写，也可以用紧凑且凑的风格编写。本章的示例展示了如何处理
    `MARC` 数据，由你自己完成所有的“重活”。或者，你可以从 CPAN 上几十个与 `MARC` 相关的模块中让任务变得更容易。使用 Perl 你可以做任何事情。很有可能已经有人写好了能让你的任务变得简单的模块。


    ## 推荐资源


    ### 网站


    - Get Perl，命令行版本：[`www.activestate.com/activeperl/downloads`](http://www.activestate.com/activeperl/downloads)；[`strawberryperl.com`](http://strawberryperl.com)/。

    - Get Perl，图形用户界面：[`sourceforge.net/projects/citrusperl/files`](https://sourceforge.net/projects/citrusperl/files)/。

    - 模块库 CPAN：[`www.cpan.org`](http://www.cpan.org)/。


    ### 书籍


    - Christiansen, Tom, Brian D. Foy, Larry Wall, and Jon Orwant. 2012. *Programming
    Perl: Unmatched Power for Text Processing and Scripting*. 第 4 版. Sebastopol, CA:
    O’Reilly Media.

    - Christiansen, Tom, and Nathan Torkington. 2003. *Perl Cookbook*. 第 2 版. Sebastopol,
    CA: O’Reilly Media.

    - Schwartz, Randal L., and Brian D. Foy. 2011. *Learning Perl*. 第 6 版. Sebastopol,
    CA: O’Reilly Media.

    - Siever, Ellen, Stephen Spainhour, and Nathan Patwardhan. 2002. *Perl in a Nutshell:
    A Desktop Quick Reference*. 第 2 版. Sebastopol, CA: O’Reilly Media.


    ### 作者链接


    - MARC 程序：[`homepages.wmich.edu/~zimmer/marc_index.html`](http://homepages.wmich.edu/~zimmer/marc_index.html)。

    - Perl Stuff：[`homepages.wmich.edu/~zimmer/links/proglang.html#perl`](http://homepages.wmich.edu/~zimmer/links/proglang.html#perl)。


    ## 六章


    ### PHP


    Jason Steelman


    ### 历史与发展


    PHP 是一种优美且简单的语言。它的优势在于无处不在、平台兼容性、易用性以及任何编程语言中最丰富的开源社区。通常情况下，PHP 在服务器内部工作，连接网页与数据库并执行网页处理的重活；然而，PHP
    也可以独立运行。找到让 PHP 处理视频、进行网络爬虫或作为网站内容管理系统骨的免费扩展并不罕见。大多数关于获取新软件的图书馆讨论底线是成本。PHP 的无处不在和开源许可意味着该语言几乎总是出现在选项之列。考虑
    PHP 的一个重要因素是该语言开发者群体对项目提供的长期支持。寻找新开发者在很大程度上取决于应用程序语言的复杂度。PHP 开发者通常比其他强大的语言开发者更便宜，也更容易签约或雇佣。如果项目涉及复杂的程序，使用
    PHP 可能会增加额外的时间和初始成本。只要截止日期灵活，且 PHP 能够解决问题，图书馆就可以利用 PHP 开发成本较低的优势。


