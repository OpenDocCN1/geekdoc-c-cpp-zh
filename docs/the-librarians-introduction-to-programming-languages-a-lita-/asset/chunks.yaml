    *   **ANSI C**——于 1989 年正式诞生，是首次尝试创建一个更完整、更标准的 C 语言版本，以便开始用于新兴的微型计算机家用市场。在此之前，C
    主要用于大型机。

    *   **C99**——首次于 1999 年定稿，其目标是引入一系列新功能，允许如内联函数和变长数组等特性。

    *   **C11**——该版本的工作始于 2007 年，但第一份官方规范于 2011 年发布。与 C99 的迭代类似，这个版本的 C 试图为语言添加更多特性。


    引人注目的是，在四十之后，C 仍然被积极地扩展和改进。这证明了该语言的无处不在和实用性。那么 C 的后代又是呢？既然 C 是一种用于实现 UNIX 的通用语言，它的后代是什么？它们又是何时开始的？全面的回顾将耗费数卷书的内容，但这里是一些亮点：


    *   **C++**——C 的扩展，引入了一种名为面向对象编程的编程范式；其规范首次发布于 1983 年。

    *   **C#**——读音类似于音符：C-sharp。它可以被看作 C 和 C++ 的演进，由微软开发，用于在其专有的 .NET 平台上。它于 2000
    年首次发布。

    *   **Objective-C**——C 语言的微扩展，Apple 广泛用于 OS X 和 iOS 操作系统，也最早出现在 1983 年。

    *   **Python**——Python 经常是对编程感兴趣者的首选语言，尤其是在过去的几年里。它是一种构建在 C 之上的语言，其主要目标是创建人类可读的代码，并用简短的代码片段封装非常复杂的操作。Python
    首次于 1991 年引入。深入理解 C 让编码者能够真正欣赏 Python 程序所能的美感和复杂性。


    ## 用途

    如上述，C 的最初用途是实现 UNIX 操作系统。随着时间的推移，C 证明了对于编写各种应用程序非常有用（Klemens 2014）。C 要求使用它的程序员有大量的理解能力。该语言没有提供一个完全结构化的环境，在需要时交互式地包含所有模块/库。然而，并非所有的
    C 用法都是晦涩或特定于操作系统的。C 知识非常有用处的一个有趣领域是 Arduino 微控制器（Purdum 2006）。Arduino 是一块信用卡大小的微型电路板，它是近期创客空间趋势的关键组件之一。


    图 8.1 显示了一块名为 Yun 的现代 Arduino 板。它的定义特征是内置了 Wi-Fi。回形针是为了展示比例。Arduino 是一种设备，让你能够通过连接在板上的各种不同组件制造与计算机接口的硬件设备（Purdum
    2006）。将开关、按钮、LCD 显示器和红外发射器视为可能的组件。这些传感器插入一系列黑色插头中。你为 Arduino 编写 代码多或是 C 的变体。


    OpenWrt 是一种流行的家用路由器第三方操作系统，它是附带了用 C 编写的工具的 UNIX 版本（Kernighan and Ritchie 1978）。OpenWrt
    是驱动 LibraryBox 的操作系统，LibraryBox 是一个独立的 Wi-Fi 供电文件共享哨站。


    ![](img/Figure_8.1.jpg)


    图 8.1. Yun，一块 Arduino 板。


    ## 优缺点

    一种编程语言如果没有一些迷人的品质，是无法真正拥有四十年的历史的。从缺点来说，这些优点相当特殊。


    ### 优点

    #### 快速且充分利用硬件

    使用 C 的主要且明显的优势是它能非常好地利用其正在运行的计算机/机器。因此，你可以在运行 UNIX 或其变体（如 Linux）的嵌入式系统中找到 C 程序。你家中的路由器很可能在低功耗处理器上运行某个版本的
    Linux。通过 Wi-Fi 天线发送无线电波可能是通过某种 C 代码实现的。OpenWrt 是一种流行的家用路由器第三方操作系统，它是附带了用 C 编写的工具的
    UNIX 版本。


    #### 广泛的支持和现有产品

    由于 C 已经存在了很久，很有可能已经有一个你的程序可以使用的现成库。例如，如果你正在编写某些使用加密算法的软件，你可以利用一个名为 `cryptlib`
    的库，该库用 C 编写，并可以执行你可能需要的所有复杂数学。事实上，许多开源应用都是编译后的 C 产品。例如，用于保护网络浏览器中 HTTPS 流量的软件包
    OpenSSL 就是一个 C 程序。


    #### C 无处不在

    尽管你可能使用其他语言编写和创建程序，但该语言使用的底层编译器实际上可能是用 C 编写的。如前所述，Python 编程语言本身就是 C 的分支。通过一点努力，可以将
    Python 程序编译为相应的 C 程序，这通常是为了让代码运行得更快。同样还有极其流行且无处不在的 Web 语言 PHP。用于解释该语言的底层软件名为 `Zend
    Engine` 的平台，它是用 C 编写的。


    ### 缺点

    #### 集成到 Web 环境中

    今天大多数初学编码的人对创建基于 Web 的服务感兴趣。因此，目前最流行的开发形式似乎是制作通过 浏览器访问的应用。遗憾的是，C 并不擅长此。如果迫于，你可以利用通用网关接口（CGI）程序，Web
    服务器可以渲染网页并将 C 程序的输出包含在最终的 HTML 中（Oliphant 1997）。虽然在 CGI 编程中使用 C 是可行的，但 Perl 通常是这种设置的首选语言。再加上考虑到
    CGI Web 编程通常从不认为是 Web 开发者的首选（Dowling 2005）。


    #### 基于 GUI 的应用程序

    由于 C 诞生于 UNIX 命令行，它大多只能创建命令行程序。如果你想创建一个运行在 GUI 中的桌面应用程序，你需要花时间学习如何使用在界面中渲染窗口的外部库。这可能是类似于
    `GTK+` 之类的东西。对比 Visual Basic，例如，它允许你交互式地绘制控件和表单并添加代码，过程是流畅且交互的。


    ## 环境与设置


