    \ change time, and so on. In total, a reservation system can include classes for\
    \ reservations, rooms, patrons, and buildings.\n\nObject-oriented programming\
    \ with PHP also provides some much needed code and file organization. It is a\
    \ best practice to create a new PHP file for each class in an application. For\
    \ a room reservation system, each class would be a separate file named after the\
    \ class it contains. The reservation system would be structured into files similar\
    \ to the following:\n\n*   [index.php](http://index.php)\n\n*   [folder] shared\n\
    \n    *   [shared.configuration.php](http://shared.configuration.php)\n\n    *\
    \   [shared.database.php](http://shared.database.php)\n\n*   [folder] reservations\n\
    \n    *   [reservations.buildings.php](http://reservations.buildings.php)\n\n\
    \    *   [reservations.patrons.php](http://reservations.patrons.php)\n\n    *\
    \   [reservations.reservations.php](http://reservations.reservations.php)\n\n\
    \    *   [reservations.rooms.php](http://reservations.rooms.php)\n\nFollowing\
    \ this practice makes it more obvious to subsequent developers where to look for\
    \ specific code. This organization also suggests where a developer would add a\
    \ file to develop a new class. For example, a new permissions class would be in\
    \ a file named [reservations.permissions.php](http://reservations.permissions.php)\
    \ in the folder reservations. Again, there are countless ways to create and organize\
    \ a study-room reservation system; however, the critical takeaway for libraries\
    \ is long-term support and development. Using community standards and best practices\
    \ for file management can ensure that a homegrown library project runs smoothly\
    \ into the future because future developers will likely come from the developer\
    \ community.\n\nMaintaining Complex Programs in a Library with Design Patterns\n\
    \nDesign patterns are well documented and required learning for most developers\
    \ in any object-oriented language. These patterns solve complex program issues\
    \ that are rather common in PHP. That is not to say that complex issues cannot\
    \ be solved without design patterns or even without objects altogether. Libraries,\
    \ in particular, need to be aware how their programs will be future proofed or,\
