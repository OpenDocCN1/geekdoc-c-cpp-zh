    >gcc -wall -fno-stack-protector overflow.c


    >ls


    address.c a.out helloworld.c oops.c overflow.c


    >./a.out


    Enter username: bob


    Super Access granted!


    >./a.out


    Enter username: peter


    Sorry, you are not a super user


    >./a.out


    Enter username: joe


    Sorry, you are not a super user


    >./a.out


    Enter username: abcdefghijklmno


    Super Access granted!


    >


    Let’s go line by line. Line 3 (ignoring blank lines) includes string.h so that
    we can use the strcmp call later on. In line 4, we declare that our main function
    returns an int, or integer value. This is used to make the example work as intended.
    Line 7 declares a character array of length 10, which is how C, for better or
    worse, represents strings. Line 9 lets us use the built-in gets function to get
    input from the keyword up until the user hits enter.'
