    to make it readable by Ruby. Now that the data has been modified, it can be organized.
    Here are some simple things we can do:


    data[0]


    # This will return the first tweet in a series


    data[2]["text"]


    # This will return the content of the third tweet in a series


    But what if we want to see more than just one tweet at a time? We can loop through
    the entire text to pull out the desired information.


    data.each do |tweet|


    p tweet["text"]


    end


    This will return the text (the “tweet” part of the tweet) of every JSON object.
    Each tweet has so much associated metadata that even more interesting information
    can be gathered using this similar method, like the number of retweets, geographic
    data, hashtags used, or author descriptions.


    Scraping the Web with Nokogiri


    What is web scraping? Web scraping is programmatically pulling data from the Internet
    so you can use the data in your own applications. Nokogiri is a Ruby gem that
    makes it easy to scrape the web for data. It is also an easy way to consistently
    grab data from various sources and have it all in one place for analysis. Nokogiri
    (from the Japanese word 鋸, for “saw”) is an HTML, XML, SAX, and Reader parser.
    Among Nokogiri’s many features is the ability to search documents via XPath or
    CSS3 selectors ([http://www.nokogiri.org](http://www.nokogiri.org)/).


    To use Nokogiri, we will also need to use Open-URI. Open-URI is a module in Ruby
    that allows us to programmatically make http requests. It will allow us to easily
    open and parse the content of an HTML page via the command line.


    You can write a file that performs all of these actions at once, or you can step
    through them with the tutorial using the IRB—remember that you can access this
    via the Mac Terminal by typing IRB or selecting it from the Start menu on a Windows
    machine. At the top of your file, you will need to require both of these libraries
    in order for your program to know that it needs them. This is as simple as adding
    the following lines of code to the top of your text document:


    require ''nokogiri''


    require ''open-uri''


    Select a website of interest. For this example, we’ll use the “Visiting the Library”
    page from the Library of Congress (figure 3.1). One you have your page selected,
    use Open-URI to open up the site. We do that like this:


    html = open([http://www.loc.gov/visit](http://www.loc.gov/visit)/)


    A temporary object should be printed to the screen. To parse that data with Nokogiri,
    we can run this:


    nokogiri = Nokogiri::HTML(html)


    This will put the contents of that website to the screen. Do you see what we are
    doing here? We are declaring a variable and naming it nokogiri (although you can
    name it anything you want, just like the HTML variable above).


    ![](OEBPS/image/Figure_3.1.jpg)


    Figure 3.1\. “Visiting the Library” (Library of Congress).


    Inspecting the web page’s HTML, we can see that Tours, Exhibitions, and other
    headers use the h2 tag. If you wanted to quickly pull in this list without accessing
    the website, you can use Nokogiri.


    Now that we have the website loaded into the variable nokogiri, we can get the
    contents out of the site. The line title = nokogiri.css(''h2'').text will pull
    in all of the h2 tags on the page. The text will look a little messy because of
    the extra spaces in the code. Ruby will clean up that data.


    title = nokogiri.css(''h2'').collect do |titles|


         titles.text.strip!


    end


    Now we not only have the titles we want, but we also have a lot of nil titles.
    This is from messy data on the site that didn’t have anything inside of it. All
    of these blank tags returned nil.


    [nil, nil, nil, nil, nil, nil, nil, nil, nil, nil, nil, nil, nil, nil, nil, nil,
    nil, nil, nil, nil, nil, nil, "Visiting the Library", "Tours", "Maps & Floor Plans",
    "Dining", "Shopping", "Volunteer Opportunities", "Contact Visitor Services", nil,
    nil, nil, nil]


    We can clean that up quickly with Ruby as well by running the compact! method.


    title.compact!


    Now we have an array with all of the options we want:


    ["Visiting the Library", "Tours", "Maps & Floor Plans", "Dining", "Shopping",
    "Volunteer Opportunities", "Contact Visitor Services"]


    This is a very simple example, but there are many ways to use Nokogiri to scrape
    the web and then manipulate the data easily with Ruby. You can test this out on
    your own website just by replacing the above example and the CSS with your own
    website and the objects you want to scrape. The web scraper is useful for sites
    that have repetitive data structures on different pages, sort of like the Library
    of Congress Subject Heading Authorities page ([http://authorities.loc.gov](http://authorities.loc.gov)/).
    Even if you change the URL you set up in Open-URI, you can still use the same
    code previously written in order to access any page. You can even set up a script
    that could scrape as many pages as you wanted.


    Summary


    Ruby is a dynamic, object-oriented, open-source programming language that strives
    for simplicity and productivity. Ruby was developed with the goal of making a
    programming language that is a joy to work in. The three principles Ruby follows
    are the principle of conciseness, the principle of consistency, and the principle
    of flexibility. Library-centric web applications built on Ruby include Project
    Blacklight and Project Hydra, along with many other easy-to-use libraries of code,
    known as Ruby gems. Its active, caring community; simple but elegant syntax; and
    ease of setup and use make it an excellent programming language for a beginner.


