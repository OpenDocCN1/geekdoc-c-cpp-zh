  trans: '


    图书馆软件中使用的主要编程语言是 `PHP`。Drupal、ContentDM、Joomla、ResourceSpace、WordPress、LibGuides、MediaWiki
    和 PHPMyAdmin 完全或部分使用 `PHP` 编写。`PHP` 通常包含 HTML、`CSS` 和 `JavaScript` 以构建视觉效果美观的网站，这是很常见的。如果图书馆需要对这些系统进行任何未包含在初始安装或支持合同范围内的定制化处理，都必须由
    `PHP` 开发人员完成。Drupal、WordPress、Joomla 和 MediaWiki 是专注于可扩展性的开源项目，拥有由开发者社区贡献的模块化扩展。模块化扩展背后的灵感观点是：没有任何一个机构或图书馆是孤岛；同样，图书员为了帮助读者而编写的任何功能，都可以帮助其他许多图书馆的读者。在机构内部工作的员工应该检查确保其机构的知识产权政策与他们参与开源项目的职位一致。


    现代网站

    现代网站已经引入了为移动端站点开发的特性，这些特性使其更像具有高度响应式设计的 Web 应用。这通常通过 `JavaScript` 调用由 `PHP` 驱动的应用程序接口（`API`）来实现。当其他机制不可行时，`API`
    为浏览器提供了与服务器通信的方法。当用户请求 页面时，`PHP` 可以生成发送到浏览器的数据；然而，一旦页面加载，`PHP` 就无法更改页面的任何部分。相反，页面包含了
    `JavaScript`，它通过向 `API` 请求更新用新数据更新页面的某些部分。用户无需刷新页面即可找到实时天气更新、选举结果、物流状态和更新的社交媒体帖子。需要注意的是，`PHP`
    并不是创建 `API` 的唯一语言；然而，它是图书馆环境中广流行的选择。


    `PHP` 是 `API` 编程语言的常用选择，因为 `PHP` 具有记录良好的易于数据库通信性。`PHP` 可以与 `CUBRID`、`DB++`、`dBase`、`filePro`、`Firebird/InterBase`、`FrontBase`、`IMB
    DB2`、`Informix`、`Ingres`、`MaxDB`、`MongoDB`、`mSQL`、`Mssql`、`MySQL`、`Oracle OCI8`、`Paradox`、`PostgreSQL`、`SQLite`、`SQLite3`、`SQLSRV`、`Sybase`
    以及 `tokyo_tyrant` 进行通信 ([`php.net/manual/en/refs/database.vendors.php`](http://php.net/manual/en/refs/database.vendors.php))。`PHP`
    对高级数据库功能的支持最终取决于应用程序中使用的特定数据库。如果所选数据库缺乏对某些功能的支持，`PHP` 有时可以进行适配。


    # PHP 基础


    处理进入数据库和从数据库返回的信息是变量的作用。变量是任何编程语言的核心，而 `PHP` 处理变量的方式是其历史中削弱的领域之一。其他语言显式将变量定义为数字或单词时，`PHP`
    中的变量没有严格的数据类型。从一个资深 `PHP` 开发者的角度来看，要求的数据类型定义似乎是一个烦人的障碍。缺乏说明的数据类型可能会在学习语言时产生问题，特别是在提高应用程序效率方面。如果你的应用程序有一系列真/假变量，以存储整本教科书的方式将其存储在内存中将浪费宝贵的内存。`PHP`
    尝试为每块数据分配足够的内存，而不会让系统过载。考虑到大多数数据库都显式定义了每条数据，与数据库一起工作带来了有趣的问题。在发送数据到数据库进行存储时，需要仔细考虑。从数据库检索数据则没那么痛苦，因为将数据从一个更具体的容器移动到一个不那么具体的容器更容易。同样，将一个开启/关闭开关转换为单词，比将单词转换为开关的开启或关闭更容易。


    图书馆和特殊收藏品对编码档案文档的兴趣日益增加。电子论文或学位（ETD）的性质决定了每个字段都应该针对特定类型的数据进行仔细考虑。如果不在应用程序本身内部进行保留，这种精确性可能会丢失。支持数据类型的语言需要变量类型（数字、字符串、真/假、日期及类似类型），这在处理
    ETD 时具有明显优势。`PHP` 开发人员可能会认为这些数据类型考虑是有些没必要的，仅仅因为 `PHP` 语言中没有清晰的方法来跟踪变量类型。


    ## 数据类型

    字符串、整数、浮点数、数组、`Boolean`、对象和资源是 `PHP` 可以存储为变量的七种数据类型。在 `PHP` 中，使用美元符号后跟想要创建或更改的变量名称来定义变量。例如，`$my_variable
    = 123`。


    *   字符串是数字或字符的序列。字母、单词、句子、段落和书籍都可以存储为字符串：`$my_variable = “Go Gamecocks!”`。

    *   整数是一个全整数：`$my_variable = 2`。

    *   浮点数（有时称为双精度数或 float）是一个小数：`$my_variable = 3.14159`。

    *   数组是一个包含其他变量合集的变量。它的形式第一次看时可能有点困惑，其真实用处超出了本介绍的范围，但像所有 `PHP` 主题一样，免费教程并不匮乏：`$my_variable
    = array(“Cat”, “Dog”, 2, 4, 6, 8)`。

    *   `Boolean` 变量持有 `true` 或 `false` 的二值值。这种数据类型有非常广泛的用途，例如开启/关闭、是/否、狗/不是狗：`$book_checked_out
    = true`。

    *   对象是一种变量类型，类似于子程序可以在内部持有自己的代码和变量。对象将在 `PHP` 的面向对象编程章节中讨论：`$my_object = new
    my_object()`。

    *   资源是连接 `PHP` 到额外资源的对象：`$my_connection = new database_connection()`。


    ## 变量规则

    变量有一些小规则和最佳实践。这些禁止规则看起来过于严格，但在实践中使变量更易于识别：


    *   变量名只能包含大小写字母、数字和下划线：`$this!0lid`。

    *   不能以数字开头：`$2bad`。

    *   （最佳实践）名称应该描述它们的功能：`$time_event_starts = “2020-05-29”`。

    *   （最佳实践）名称不应以下划线开头：`$_generally_bad`。


