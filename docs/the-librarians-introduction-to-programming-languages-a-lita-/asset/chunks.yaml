- fmt: '

    In 2015, Stephen Cass of the Institute of Electrical and Electronics Engineers
    published a list of what he considered the most important programming languages
    of the last year (Cass 2015). Most of the languages listed can also serve any
    librarian interested in programming, but probably not in the same order of importance.
    The list also comes close to matching the content of this book. The list is reordered
    below for the benefit of a librarian-oriented audience and based on the author’s
    personal communications with programmers. Definitions for these and other computer
    programming language can be found at the site maintained by Bill Kinnersley at
    Kansas University, called The Language List ([http://people.ku.edu/~nkinners/LangList/Extras/langlist.htm](http://people.ku.edu/~nkinners/LangList/Extras/langlist.htm)).


    **Python**—An easy-to-interpret object-oriented language and therefore quite popular.


    **Ruby**—A very easy programming language to interpret. `Ruby on Rails` provides
    a way to use `Ruby` with a set of protocols and structure to create responsive
    and dynamic websites.


    **PHP**—A language that allows the calling of data from a web server so that is
    it visible in a web browser. It is one of the main tools for suppling web-based
    information, such as the content of a store’s merchandise catalog.


    **Java**—A server-oriented language that is also object oriented and that can
    run on multiple platforms or computer types. It shares some similar syntax to
    `C` and `C++`. Its ability to run on different operating systems makes it a useful
    language.


    **Perl**—One of the most widely used object-oriented programming languages. There
    is very good support for the language. Its main competitor is probably the newer
    `Python`, which has the advantage of being easier to interpret.


    **JavaScript**—A client-based (working on your local computer) language that works
    in web browsers with data pulled from the web by the browser. It is what powers
    the functionality of web browsers. `JavaScript` is an important language for anyone
    creating web-based applications.


    **SQL**—A language that allows for the organization and intense data mining of
    very large data sets.


    **R**—A programming language that is designed for statistical analysis. This language
    provides for basic and advanced analysis, is flexible regarding data formats,
    and has associated scripts that allow for versatile data visualizations.


    The remaining popular languages are quite powerful and allow a programmer to write
    efficient code in the fewest number of lines. Each is also worthy of learning
    for the intrepid or for librarians thinking of programming as their major job
    responsibility. However, these languages will be the hardest to interpret for
    a person just learning programming or who may only be programming as just a small
    part of her or his job: `C`, `C++`, `C#`, and `C-Objective`.


    ### Steps for Learning to Program


    1. Visit [Code.org](http://Code.org) and start playing with programming. Anyone
    can start here and all that is needed is an Internet connection. However, this
    only gets a person’s brain working on the abstract concepts of programming and
    doesn’t provide the practical part of implementing a program.

    2. Go to the Ubuntu Linux site ([http://www.ubuntu.com/download](http://www.ubuntu.com/download))
    and download the latest version of `Ubuntu` as an `ISO` file. This will take some
    time as it is likely to be around a gigabyte in size. The `ISO` file is one that
    is bootable and that a computer will load upon start up. Now, burn this file to
    a DVD or to a flash drive. Windows ([http://windows.microsoft.com/en-us/windows7/burn-a-cd-or-dvd-from-an-iso-file](http://windows.microsoft.com/en-us/windows7/burn-a-cd-or-dvd-from-an-iso-file))
    or the open-source program `7-Zip` can provide this function. `7-Zip` can be downloaded
    from [http://www.7-zip.org/download.html](http://www.7-zip.org/download.html)
    and can provide other important archiving functions not directly related to the
    task here.

    3. Find an old computer (laptop or desktop) that is no longer in use and where
    no one cares about the contents on the hard drive. This is a critical review point.
    All data will be overwritten on the hard drive, so be certain that its contents
    are no longer important. Turn on the computer and load the `ISO` file into the
    DVD drive. Allow `Ubuntu` to install and to overwrite the hard drive. This step
    is irreversible, and the program will warn you about this. Say yes, allow the
    program to install, and accept the default options. Prompts for language, keyboard,
    and time zone will come up. Select the appropriate ones.

    4. The program will ask you to create a password. Create one and write it down.
    As this is a training computer, the password is a formality needed to run the
    computer. If it is ever forgotten, you can reinstall `Ubuntu` with the same `ISO`
    DVD and start over.

    5. With `Ubuntu` installed, you can go right to the terminal command line using
    the keyboard command `Ctrl-Alt-T` and start learning command line directives.
    The important part here is that learning how to navigate the command line in `Linux`
    will allow you to implement programs that you write.

    6. Part three of this set of steps is to buy a forty-dollar `Arduino` starter
    kit from [Amazon.com](http://Amazon.com) and download the `Arduino` programming
    package and install this on a Windows, Apple, or `Linux` machine. You can now
    start programming an `Arduino` unit and have it follow a program and actually
    see the results of the program. The starter kit, an `Arduino` with associated
    parts and manual, is the best bet over just purchasing an `Arduino` board without
    parts.

    7. Start reading, writing, and practicing on `Linux` and the `Arduino`, and have
    fun.


    The chapters in this book will help readers decide which language to begin with
    and to assess when to learn additional languages. The practical examples will
    lead you through the basics of each language. It is my hope that all readers will
    find their own favorite language and reach their goal of becoming fluent programmers
    for whatever task and whatever reason led them to purchase this book. Welcome
    to the world of computer programming!


    ### Bibliography


    - Cass, S. 2015. “The 2015 Top Ten Programming Languages.” IEEE Spectrum, July
    20. [http://spectrum.ieee.org/computing/software/the-2015-top-ten-programming-languages](http://spectrum.ieee.org/computing/software/the-2015-top-ten-programming-languages).

    - Chee, Brian. 2014. “Hero Hacks: 14 Raspberry Pi Projects Primed for IT.” InfoWorld,
    July 10. [http://www.infoworld.com/article/2606860/consumer-electronics/158674-Hero-hacks-14-Raspberry-Pi-projects-primed-for-IT.html](http://www.infoworld.com/article/2606860/consumer-electronics/158674-Hero-hacks-14-Raspberry-Pi-projects-primed-for-IT.html).

    - Guo, Philip. 2014. “Python Is Now the Most Popular Introductory Teaching Language
    at Top U.S. Universities.” Communications of the Association for Computing Machinery,
    July 7. [http://cacm.acm.org/blogs/blog-cacm/176450-python-is-now-the-most-popular-introductory-teaching-language-at-top-us-universities/fulltext](http://cacm.acm.org/blogs/blog-cacm/176450-python-is-now-the-most-popular-introductory-teaching-language-at-top-us-universities/fulltext).

