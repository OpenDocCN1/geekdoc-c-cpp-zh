- fmt: "\nOne of the most beneficial applications of Python in libraries, specific\
    \ for catalogers or technical services workflows, is in the use of `PyMARC`—a\
    \ Python library written to access, create, and manipulate raw binary MARC data.\
    \ This library of `PyMARC` functions allows one to read in a `.mrc` file of MARC\
    \ records, extract fields or subfields out of the records, modify fields and subfields\
    \ by changing or removing them, and add new fields to the records. Based on specified\
    \ criteria and field data, you can analyze the MARC data and write out reports\
    \ to text files, which can be used for statistics or error analysis for batch\
    \ clean-up projects. This ability to programmatically work with data can save\
    \ a large amount of time, and, while tools such as `MarcEdit` can do large amounts\
    \ of batch processing, learning `PyMARC` both gives greater freedom and, as mentioned,\
    \ allows calling from batch scripts, such that it can be one of a number of things\
    \ you automate together.\n\n# Pros and Cons\n\nAs noted, there are many advantages\
    \ to selecting Python as one’s programming language of choice. Python generally\
    \ comes preinstalled on most current operating systems, excluding Windows, so\
    \ there is not a lot of setup in order to run your first script. For absolute\
    \ beginners working on the command line, it may seem daunting at first to not\
    \ be working in a GUI (graphical user interface) environment, but this is true\
    \ for any language, and those fears are quickly overcome with just a little bit\
    \ of exposure to the commands needed for basic operations.\n\nWhile Python can\
    \ be used to perform very complex workflows or build elaborate frameworks, it\
    \ also allows beginners to write short, simple scripts that can create powerful\
    \ results. Repetitive and mundane tasks that would normally take hours to perform\
    \ manually can be completed in seconds. Additionally, the Python community is\
    \ highly robust, creating packages and offering help so that any questions you\
    \ might have will quite possibly already be answered, with code examples, a note\
    \ about syntax, and a joke or two.\n\nOne aspect of Python that can be both a\
    \ help and a hindrance is its use of significant white space. In other words,\
    \ the way you indent your code changes how it is run (`http://www.secnetix.de/olli/Python/block_indentation.hawk`).\
    \ Rather than using curly brackets or other syntax to express nested code blocks,\
    \ Python uses tabs or spaces at the beginnings of lines to distinguish when a\
    \ block of code starts or stops. For example, a set of if/else statements might\
    \ look something like this:\n\n```\nif x == 1:\n    print \"x is odd\"\nelif x\
    \ == 2:\n    print \"x is even\"\nelse:\n    print \"I don't know what x is\"\n\
    ```\n\nThis is different from many other programming languages, but Python places\
    \ a high value on readability and making things easier for humans. Thus, while\
    \ it will take some getting used to and may have you yelling at your screen, in\
    \ the long run this feature of the language makes your code more readable and\
    \ easier to work with.\n\nAnother confusion beginners sometimes encounter is the\
    \ difference between running Python commands directly in the Python shell (i.e.,\
    \ when the prompt begins with `>>>`) versus calling and running a full Python\
    \ script using the `python` command and the script file name from the prompt (here\
    \ a Windows DOS prompt): `C:\\> python myPythonScript.py`. The Python shell allows\
    \ you to check how a function operates before using it, or work out some nasty\
    \ bit of code in an interactive environment. It’s a useful feature, but none of\
    \ your brilliant code will be saved, so once you’ve used the prompt to work something\
    \ out, be sure to move it to a `.py` file and save it to be used in the future\
    \ as shown above.\n\n# Examples\n\n## Python for Comparing Holdings\n\nAn area\
    \ where Python excels is the writing of relatively short scripts to automate routine\
    \ tasks. For instance, if we have a list of holdings from a vendor and we want\
    \ to check these against holdings in our catalog, the task becomes onerous with\
    \ even a modest number of holdings. However, with Python we can quickly write\
    \ a script to automate our task, freeing us up to get another cup of coffee.\n\
    \n```\nfrom_vendor = ['1234-5678', '2345-6789', '3456-7890']\nfrom_catalog = ['1234-5678',\
    \ '2345-6789', '3456-7890', '1111-2222']\n\nfor issn in from_catalog:\n    if\
    \ issn not in from_vendor:\n        print issn\n```\n\nThis example demonstrates\
    \ one very simple way to go about this. We make two variables called `from_vendor`\
    \ and `from_catalog` and put a list of ISSN numbers in those variables (in Python,\
