    What is Ruby and how is it different from other languages? In the official documentation,
    Ruby is described as the following: “A dynamic, open source programming language
    with a focus on simplicity and productivity. It has an elegant syntax that is
    natural to read and easy to write” ([https://www.ruby-lang.org/en](https://www.ruby-lang.org/en)/).
    Now let’s break that description down so we can really understand its meaning.


    Ruby is a dynamic language—also referred to as a scripting language. This means
    that programs written in Ruby are interpreted (read) line-by-line as they are
    being executed. This is in contrast to compiled languages where the source code
    is transformed from one programming language (the source language) into another
    computer language (the target language) before the program can be run. Scripting
    languages, such as Ruby, tend to be easier for learners to pick up; however, the
    tradeoff is that they generally run slower than compiled languages.


    Ruby is also an open-source language. When a program is open source, the source
    code is available to the public for free. You can use it as is or modify the code
    as needed. If you make a change that you find useful, you can upload your changes
    for other people to use. The entire source code for the language is available
    online. Seriously! You can go view it here: [https://github.com/ruby/ruby](https://github.com/ruby/ruby).


    Thirdly, Ruby is an object-oriented language. Object-oriented programming languages
    are based on the concept of “objects,” which are data structures, and “methods,”
    which are procedures used to change or utilize those objects. By definition, languages
    built in this way use “objects.” To use a spoken language analogy, these objects
    can be thought of as nouns. And the “methods” could be considered verbs.


    Now that we have defined Ruby, let us take a quick look at its history. By the
    early 1990s, there were a wide variety of programming languages in existence from
    C (a low-level language widely used for system programming) to Python (a language
    that functions similarly to Ruby). Unlike many other languages that were developed
    solely to fit a specific programming need, Ruby was created with both a functional
    and an aesthetic purpose in mind.


    Ruby was designed by Yukihiro Matsumoto (colloquially known as Matz) in the mid-1990s.
    Although he was familiar with Perl, Matz did not believe it would be able to create
    reliable, maintainable programs in a production environment. He also knew Python
    but didn’t feel that it was a true object-oriented language, which was a very
    important characteristic for him. According to Matsumoto, “As a language maniac
    and [object-oriented] fan for 15 years, I really wanted a genuine object-oriented,
    easy-to-use scripting language. I looked for but couldn’t find one. So I decided
    to make it” (Matsumoto 1999).


    Matsumoto also wanted to create a beautiful language that would be a joy to program
    in. He felt that most computer languages place a burden on the human writing the
    code in order to remove a burden from the computer. This resulted in programming
    being unnecessarily hard. Matz believed that the focus needed to be on people
    rather than machines, so his goal was to create a language that would make programming
    enjoyable whether you were a beginner or had been programming for years. To this
    end, he designed Ruby according to the following three principles:'
