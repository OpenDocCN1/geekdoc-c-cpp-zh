    \ say, “for every `issn` in the `from_catalog` list, check if it is not in the\
    \ `from_vendor` list, and print those to the screen.” This example demonstrates\
    \ one very simple way to go about this.\n\nNext,我们可以对上面的比较代码进行微调：\n\n```python\n\
    not_in_both = []\n\nfor issn in from_catalog:\n    if issn not in from_vendor:\n\
