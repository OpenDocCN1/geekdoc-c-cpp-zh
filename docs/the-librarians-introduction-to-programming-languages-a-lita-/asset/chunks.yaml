- fmt: '

    CSS, on the other hand, is meant to tell browsers what objects in a web page look
    like. CSS is very powerful and very granular, allowing developers to set colors,
    fonts, sizes, and even visibility, based on any number of an object’s properties.
    CSS can also be variable, with different colors set based on conditions (pseudoclasses),
    such as whether or not the mouse pointer is hovering over the object in question.


    The subject of this chapter, `JavaScript`, is fundamentally different from HTML
    and CSS. JavaScript is meant to tell browsers what objects in a web page do. Unlike
    HTML, which is just a language for marking up objects, or CSS, which is just a
    language describing the appearance of those objects, JavaScript is an actual programming
    language. Using the powerful `DOM API`, JavaScript can manipulate any node in
    a web document. In the `DOM`, things that happen in or to a web document (events)
    are also objects. Because it employs an asynchronous programming paradigm, as
    noted earlier, JavaScript can listen for these events and act in response to them,
    or even modify the events themselves in a variety of ways. In recent years, HTML5
    and CSS3 have provided exciting new ways for JavaScript to interact with the `DOM`,
    creating new opportunities but requiring a flexible approach to JavaScripting
    skills (Bengtson 2013).


    Within its scope, JavaScript is extremely powerful; however, there are a number
    of things that JavaScript isn’t allowed to do for security reasons. JavaScript,
    for instance, isn’t allowed to save, modify, or in most cases even load files
    from your local computer. JavaScript can’t send emails directly. JavaScript can’t
    load data files, like `XML`, from any domain that is outside the web domain of
    the document it is within (Ruderman 2014). There are two exceptions to that last
    rule, but one has to be activated on a server and the other is an advanced technique
    called `JSON-P` that only works with data files in JavaScript Object Notation
    (`JSON`). `JSON-P` is a little beyond the level of scripting in this chapter.
    What is important for you to understand is that there are a number of actions
    that fall outside the scope of JavaScript but which may be effectively accomplished
    using server-side scripting with a language, such as `PHP`, `Python`, or `Perl`,
    which are all discussed in other chapters.


    ## Adding JavaScript to a Web Document


    There are three basic ways to add JavaScript to a web document. The two fastest
    and easiest are also the two sloppiest: `internal JavaScript` and `inline JavaScript`.
    There is a time and a place to use both of these methods, especially when you
    have no choice but to be a little sloppy due to time constraints, but they produce
    lower-quality web code and may introduce unexpected problems into your app or
    page. The third and best method is to use an external JavaScript file. Besides
    creating a cleaner separation of JavaScript from HTML and CSS, external JavaScript
    files, like external CSS files, can be easily reused by multiple web documents.
    Additionally, using external JavaScript files forces creators to employ healthier
    techniques to handle events in the `DOM`, as we’ll see later.


    ### Internal JavaScript


    Internal JavaScript in a web document looks much like internal CSS. The script
    is placed inside `<script>` tags, like so:


    ```html

    <script>

    document.getElementById(''container'').innerHTML="<p>This is a paragraph</p>";

    </script>

    ```


    ### Inline JavaScript


    Inline JavaScript takes advantage of special tag attributes that allow you to
    put JavaScript right into an HTML tag so that the HTML object delineated by the
    tag can act based on events. The JavaScript that looks for an event is known as
    an `event listener`, while the JavaScript that acts in response to the event when
    it is detected is known as an `event handler`. Here is an example of some simple,
    inline JavaScript:


    ```html

    <a href="#" onclick="changeColor();">Click this link to change the background
    color</a></a>

    ```


    The `onclick` attribute calls the function `changeColor()` if the link is clicked.
    The link’s default behavior is handled by using `#` for the `href` attribute.
    In essence, we tell the link not to go anywhere when the user clicks on it. This
    probably seems temptingly straightforward. However, inline JavaScript has some
    inherent problems, as will be discussed further when `jQuery` event handlers are
    described.


    ### External JavaScript


    Adding an external JavaScript file to a web document is easy. Essentially, it
    just involves a `script` tag that contains an `src` attribute pointing to a JavaScript
    file, like so:


    ```html

    <script type="text/JavaScript" src="js/combined.js"></script>

    ```


    ## jQuery


    As previously noted, within its scope, JavaScript is extremely powerful. However,
    it can also be surprisingly unwieldy for simple tasks. Given that JavaScript is
    essentially the “wiring” that allows the elements in a web page to actually do
    useful things, and given that, in most cases, the things you will want your web
    code to do will be driven by the actions of your users (events), it is essential
    to “attach” your JavaScript to objects in a web page. Such attachments initiate
    JavaScript in response to user actions on those elements, such as when a user
    clicks on a button or tries to drag an image. Building these event handlers for
    elements in a web page with pure JavaScript, however, tends to be clunky. Let’s
    say we have a button with the `id` `push_this` and we want to activate the function
    `doSomething()` when a user clicks on it. To attach a click event to it in JavaScript,
    our code would look like this:


    ```javascript

    document.getElementById(''push_this'').addEventListener(''click'', function()
    {doSomething();});

    ```


    We could also just add the function to an `onclick` attribute in the button element
    itself (inline JavaScript), like so:


    ```html

    <button id="push_this" onclick="doSomething();"></button>

    ```


    However, this kind of event handling is sloppy and often leads to unanticipated
    consequences while producing web code that can be difficult to troubleshoot and
    rewrite. It is always best to avoid mixing script and markup languages together,
    since, as noted earlier, all JavaScript that runs in this fashion runs in what
    is known as the “global” scope. In other words, you can run into problems where
    multiple things you are trying to do with JavaScript interfere with each other
    because they are all part of the same scope.


    This whole process can be improved by using a JavaScript library called `jQuery`.
    The `jQuery` library is free and can be downloaded from the web to be added to
    your site. `jQuery` is loaded into your page just like any other external JavaScript
    file, using a `script` tag:


    ```html

    <script type="text/JavaScript" src="jquery.js"></script>

    ```


    There are also hosted copies of jQuery available online that you can reference
    instead of using a local copy. The advantage is that if those hosted copies are
    on a content distribution network (CDN), they may load into your page for end
    users more rapidly than if they reside on your servers. The down side is that
    you have no control over those hosted copies, or the servers they run on. This
    can lead to problems from unexpected outages or content servers being compromised.
    I recommend using a local copy of libraries such as `jQuery`.


    `jQuery` extends the power of JavaScript, making client-side scripting easier
    to do. Let’s add our event handler to the button we saw previously using `jQuery`:


    ```javascript

    $("#push_this").click(function(){ doSomething(); });

    ```


    This event handler is far more compact than the one we built in straight JavaScript,
    and it is more flexible and less likely to cause unanticipated problems than using
    the `onclick` attribute. Astute readers will also notice that, in selecting an
    element, `jQuery` uses CSS selector notation (`#push_this`). `jQuery` utilizes
    the “sizzle” selector engine, which leverages the extraordinary power of CSS selectors
    for use with scripting.

