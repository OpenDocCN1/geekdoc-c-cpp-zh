- fmt: "\nThis is a basic Hello World application. It is a good way to test your Java\
    \ runtime environment to make sure you can successfully compile and run code.\n\
    \n```java\npublic class HelloWorld {\n    public static void main(String[] args)\
    \ {\n        System.out.println(\"Hello World!!!!\");\n    }\n}\n```\n\nIf run\
    \ successfully, this code will simply print out the line Hello World!!!! Despite\
    \ its simplicity, it is worth taking a look at this code line by line to better\
    \ understand what it is doing.\n\n```java\npublic class HelloWorld {\n```\n\n\
    The first line is creating a class called HelloWorld. Every Java application is\
    \ built inside a class. This makes it very different from other programming environments.\
    \ In Java, everything is an object, and an object is created from a class. Inside\
    \ classes, code is wrapped in functions.\n\n```java\npublic static void main(String[]\
    \ args)\n```\n\nThe function above in the simple World program is called `main`\
    \ because it is where our code is executed. There is only one `main` function\
    \ in any application, and it must always be declared `public static void` and\
    \ accept a `String`, which is traditionally named `args`. This function is called\
    \ automatically by the Java Virtual Machine, and your code will not work without\
    \ it.\n\n```java\nSystem.out.println(\"Hello World!!!!\");\n```\n\nThe last line\
    \ of the code is the code that prints out the text we want.\n\n### Expanded Hello\
    \ World\n\nThe program below produces the exact output as the program above. In\
    \ order to explain further what is meant by saying everything is an object, a\
    \ second class has been created called `Welcomer`.\n\n```java\npublic class HelloWorld\
    \ {\n    public static void main(String[] args) {\n        Welcomer welcomer =\
    \ new Welcomer();\n        welcomer.sayHello();\n    }\n}\n```\n\n```java\npublic\
    \ class Welcomer {\n    private String welcome = \"Hello World!!!!\";\n    public\
    \ void sayHello() {\n        System.out.println(welcome);\n    }\n}\n```\n\nThe\
    \ initial class HelloWorld still exists and contains the mandatory `main` function\
    \ that Java needs to run.\n\n```java\npublic class HelloWorld {\n    public static\
    \ void main(String[] args) {\n        Welcomer welcomer = new Welcomer();\n```\n\
    \nThe first thing the `main` function does is create a `Welcomer`. `Welcomer`\
    \ for the purposes of this program can be thought of as an object that shouts\
    \ “Hello World!!!!” when told to say. You can imagine that you have created an\
    \ actual object, such as a robot, that can perform tasks. Now we just need to\
    \ tell it to say.\n\n```java\nwelcomer.sayHello();\n```\n\nIn order for this to\
    \ work though, a second class `Welcomer` needs to be defined.\n\n```java\npublic\
    \ class Welcomer {\n    private String welcome = \"Hello World!!!!\";\n    public\
    \ void sayHello() {\n        System.out.println(welcome);\n    }\n}\n```\n\nThis\
    \ class is what creates `welcome` and contains all of the attributes. Every function\
    \ the `welcome` can perform is inside this class. Inside this class, we create\
    \ a string with our hello text. Then we create a new function that prints out\
    \ our string of hello text. This code obviously made a very simple function, printing\
    \ out Hello World, significantly more complicated. It was mostly done to show\
    \ everything in Java is an object. There are many reasons you want to create classes\
    \ with different behaviors. Creating multiple classes is still a useful practice\
    \ as it simplifies the process of expanding your programs. For example, if the\
    \ programmer decided to add tasks to the `Welcomer`, such as asking the user of\
    \ the program to fill out an survey, new code could be added by creating new functions\
    \ inside the `Welcomer` class and called from the `main` function with limited\
    \ modification to existing code.\n\n### More Than Right Way\n\nIn Java, as in\
    \ many other programming languages, there are often multiple ways to complete\
    \ the same class. One way is not necessarily better than the other. Sometimes\
    \ the choice depends on how the code is used. In other cases, it can come down\
    \ to preference of the developer. The example below shows four methods of looping\
    \ over a simple array. Each type of loop produces the same output.\n\n```java\n\
    public class Main {\n    static private String[] numbers = {\"one\", \"two\",\
    \ \"three\", \"four\", \"five\"};\n    public static void main(String[] args)\
    \ {\n        for (String number : numbers) { // for loop\n            System.out.println(number);\n\
    \        }\n        for (int number=0; number < numbers.length; number++) { //\
    \ for loop\n            System.out.println(numbers[number]);\n        }\n    \
    \    int number = 0;\n        while(number < numbers.length) { // while loop\n\
    \            System.out.println(numbers[number]);\n            number++;\n   \
    \     }\n        number = 0;\n        do { // do while loop\n            System.out.println(numbers[number]);\n\
    \            number++;\n        } while (number < numbers.length);\n    }\n}\n\
    ```\n\nThe loops used above are `for`, `for each`, `while`, and `do while`, as\
    \ shown by the comments. None of these choices is wrong or right, and none works\
    \ more or less efficiently than another. Many times in Java there will be choices\
    \ about how to execute a program, and it is possible that five experienced programmers\
    \ would come up with five different solutions and all of them would be correct.\
    \ While developing in Java, or any programming language, it is important for a\
    \ developer to have an open mind, be creative, and find a style that suits him\
    \ or her. This is not to say there aren’t right and wrong choices in many circumstance,\
    \ but there is a lot of room for creativity and personal style as well.\n\n###\
    \ Using Built-In Classes\n\nOne of the great things about Java is there are a\
    \ lot of built-in classes that already contain functions to do tasks you may want\
    \ to do. Before writing a program in Java, it is often worthwhile to see if there\
    \ is already a Java class that can do the operations you want to do. Here is an\
    \ example that uses calendar classes built into Java. The program below reads\
    \ in the month, day, and year of your birth and returns the day of the week you\
    \ were born. For example, if you were born on July 25, 1977, the program would\
    \ return the word Monday, as that date fell on a Monday.\n\n```java\nimport java.util.Calendar;\n\
    import java.util.GregorianCalendar;\nimport java.util.Scanner;\n\npublic class\
    \ Main {\n    public static void main(String[] args) {\n        Scanner input\
    \ = new Scanner(System.in);\n        System.out.println(\"Enter the month of your\
    \ birth\");\n        int month = input.nextInt(); // Read in month\n        System.out.println(\"\
    Enter the day of your birth\");\n        int day = input.nextInt(); // Read in\
    \ day\n        System.out.println(\"Enter the year of your birth\");\n       \
    \ int year = input.nextInt(); // Read in year\n        month = month-1; // Months\
    \ in Java are 0-11 instead of 1-12\n        GregorianCalendar birthday = new GregorianCalendar(year,\
    \ month, day);\n        String namesOfDays[] = { \"Sunday\", \"Monday\", \"Tuesday\"\
    , \"Wednesday\", \"Thursday\", \"Friday\", \"Saturday\"};\n        String weekday\
    \ = namesOfDays[(birthday.get(Calendar.DAY_OF_WEEK)) - 1];\n        System.out.println(weekday);\n\
    \        input.close();\n    }\n}\n```\n\nThe class `java.util.Calendar` is an\
    \ abstract class that provides methods for converting between a specific instant\
    \ in time and a set of calendar fields such as `YEAR`, `MONTH`, and so on, and\
    \ for manipulating the calendar fields, such as getting the date of the next week.\n"
  raw: 'This is a basic Hello World application. It is a good way to test your Java
    runtime environment to make sure you can successfully compile and run code.


    public class HelloWorld


    {


         public static void main(String[] args)


         {


              System.out.println("Hello World!!!!");


         }


    }


    If run successfully, this code will simply print out the line Hello World!!!!
    Despite its simplicity, it is worth taking a look at this code line by line to
    better understand what it is doing.


    public class HelloWorld {


    The first line is creating a class called Hello World. Every Java application
    is built inside a class. This makes it very different from other programming environments.
    In Java, everything is an object, and an object is created from a class. Inside
    classes, code is wrapped in functions.


    public static void main(String[] args)


    The function above in the simple Hello World program is called main because it
    is where our main code is executed. There is only one main function in any application,
    and it must always be declared public static void and accept a String, which is
    traditionally named args. This function is called automatically by the Java Virtual
    Machine, and your code will not work without it.


    System.out.println("Hello World!!!!");


    The last line of the code is the code that prints out the text we want.


    Expanded Hello World


    The program below produces the exact same output as the program above. In order
    to explain further what is meant by saying everything is an object, a second class
    has been created called Welcomer.


    public class HelloWorld


    {


         public static void main(String[] args)


         {


              Welcomer welcomer = new Welcomer();


              welcomer.sayHello();


         }


    }


    public class Welcomer


    {


         private String welcome = "Hello World!!!!";


         public void sayHello()


         {


              System.out.println(welcome);


         }


    }


    The initial class Hello World still exists and still contains the mandatory main
    function that Java needs to run.


    public class HelloWorld {


    public static void main(String[] args) {


    The first thing the main function does is create a Welcomer.


    Welcomer welcomer = new Welcomer();


    A Welcomer for the purposes of this program can be thought of as an object that
    shouts “Hello World!!!!” when told to say hello. You can imagine that you have
    created an actual physical object, such as a tiny robot, that can perform tasks.
    Now we just need to tell it to say hello.


    welcomer.sayHello();


    In order for this to work though, a second class Welcomer needs to be defined.


    public class Welcomer {


    This class is what creates our welcome and contains all of the welcome attributes.
    Every function the welcome can perform is inside this class. Inside this class,
    we create a string with our hello text.


    private String welcome = "Hello World!!!!";


    Then we create a new function that prints out our string of hello text.


    public void sayHello() {


    System.out.println(welcome);


    }


    }


    This code obviously made a very simple function, printing out Hello World!!!!,
    significantly more complicated. It was mostly done to show how everything in Java
    is an object. There are many reasons you want to create classes with different
    behaviors. Creating multiple classes is still a useful practice as it simplifies
    the process of expanding your programs. For example, if the programmer decided
    to add tasks to the Welcomer, such as asking the user of the program to fill out
    an introductory survey, new code could be added by creating new functions inside
    the Welcomer class and called from the main function with limited modification
    to existing code.


    More Than One Right Way


    In Java, as in many other programming languages, there are often multiple ways
    to complete the same class. One way is not necessarily better than the other.
    Sometimes the choice depends on how the code is being used. In other cases, it
    can come down to the preference of the developer. The example below shows four
    different methods of looping over a simple array. Each type of loop produces the
    same output.


    public class Main {


    static private String[] numbers = {"one", "two", "three", "four", "five"};


         public static void main(String[] args)


         {


         for (String number : numbers) //for each loop


         {


              System.out.println(number);


         }


         for (int number=0; number < numbers.length; number++) //for loop


         {


              System.out.println(numbers[number]);


         }


         int number = 0;


         while(number < numbers.length) //while loop


         {


              System.out.println(numbers[number]);


              number++;


         }


         number = 0;


         do //do while loop


         {


              System.out.println(numbers[number]);


              number++;


         } while (number < numbers.length);


    }


    }


    The loops used above are for, for each, while, and do while, as shown by the comments.
    None of these choices is wrong or right, and none works more or less efficiently
    than another. Many times in Java there will be choices about how to execute a
    program, and it is possible that five experienced programmers would come up with
    five different solutions and all of them would be correct. While developing in
    Java, or any programming language, it is important for a developer to have an
    open mind, be creative, and find a style that suits him or her. This is not to
    say there aren’t right and wrong choices in many circumstance, but there is a
    lot of room for creativity and personal style as well.


    Using Built-In Classes


    One of the great things about Java is there are a lot of built-in classes that
    already contain functions to do tasks you may want to do. Before writing a program
    in Java, it is often worthwhile to see if there is already a Java class that can
    do the operations you want to do. Here is an example that uses calendar classes
    built into Java. The program below reads in the month, day, and year of your birth
    and returns the day of the week that you were born. For example, if you were born
    on July 25, 1977, the program would return the word Monday, as that particular
    date fell on a Monday.


    import java.util.Calendar;


    import java.util.GregorianCalendar;


    import java.util.Scanner;


    public class Main


    {


         public static void main(String[] args)


         {


              Scanner input = new Scanner( System.in);


              System.out.println("Enter the month of your birth");


              int month = input.nextInt(); //Read in birth month


              System.out.println("Enter the day of your birth");


              int day = input.nextInt(); //Read in birth day


              System.out.println("Enter the year of your birth");


              int year = input.nextInt(); //Read in birth year


              month = month-1; //Months in Java are 0-11 instead of 1-12


              GregorianCalendar birthday = new GregorianCalendar(year, month, day);


              String namesOfDays[] = { "Sunday", "Monday", "Tuesday", "Wednesday",
    "Thursday", "Friday", "Saturday"};


              String weekday = namesOfDays[(birthday.get(Calendar.DAY_OF_WEEK)) -
    1];


              System.out.println(weekday);


              input.close();


         }


    }


    This program imports three existing Java classes:


    import java.util.Calendar;


    import java.util.GregorianCalendar;


    import java.util.Scanner;


    The class java.util.Calendar is an abstract class that provides methods for converting
    between a specific instant in time and a set of calendar fields such as YEAR,
    MONTH, and so on, and for manipulating the calendar fields, such as getting the
    date of the next week. An instant in time can be represented by a millisecond
    value that is an offset from the Epoch, January 1, 1970, 00:00:00.000 GMT (Gregorian)
    (Oracle 2015).'
