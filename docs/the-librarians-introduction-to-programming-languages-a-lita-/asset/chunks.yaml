    Chapter Eight


    C


    Tim Ribaric


    History and Development


    C is one of the most enduring computer programming languages. Unlike other languages
    that were created in the 1970s, C is still actively used to develop many applications.
    Contrast this longevity, for example, with code written in FORTRAN. Many institutions
    with legacy systems have additional development costs allocated exclusively to
    make sure these systems continue to operate, mostly because new programmers do
    not spend time developing FORTRAN skills (Horton 2006). In contrast, code written
    in C doesn’t have the same upkeep costs since programmers with an understanding
    of modern languages de facto have some workable knowledge of C (Bhaskar 2012).


    Since C is a common ancestor of a series of newer languages, including C++, Java,
    Objective-C, and Python, understanding the syntax and semantics of C provides
    a great basis for understanding these newer languages. However, there is an interesting
    dichotomy floating around the industry. Some professionals have advocated that
    C should be the first language any programmer embarks on since it provides the
    right combination of syntactic structures and imparts an understanding of how
    memory is allocated and used (Bhaskar 2012). On the other hand, some have argued
    that writing good code in C is very difficult due to exactly the same rationale.
    In fact, poorly written C might end up being a liability as it sometimes exposes
    every obscure security problem. The recommended resources at the end of this chapter
    include a sampling of this discussion.


    As an information professional, you’ll probably never have a direct reason for
    developing an application or web service in C; however, having an understanding
    of it will inform everything else you’ll do with programming as every language
    out there can classify itself as C-like or not C-like. That might seem like a
    tautology, but the resonating characteristics of C do lend themselves to such
    comparisons. Think of C as Latin since modern programming and paradigms are built
    on the root words of C. Unlike Latin, however, C is not a dead language. In fact,
    it is thriving now as much as it ever has in its four-decade history.


    C was the result of the work of Ken Thompson and Dennis Ritchie, who were employed
    at AT&T Bell Labs (Stackhouse 1996). During the years 1969–1973, Thompson and
    Ritchie were working on a language to reimplement the UNIX operating system, and
    this work first began using a language called B. The result was a great success
    as it allowed UNIX to be written in hardware-agnostic language C (Bhatt 2012).
    For example, a development team just needed to write a C compiler in Assembler
    and then compile the C code using that compiler. Up until this point, an operating
    system was written in the lowest-level language, called Assembler (Horton 2006).
    This means that the operating system was tied very heavily to the Assembler used
    to write it. So, for example, if a new chip came out with more memory on it, the
    Assembler would have to be rewritten to accommodate the new chip, meaning essentially
    a rewrite of the operating system. In the new development paradigm, after a new
    chip is invented, you simply need to write a new C compiler in your Assembler
    to build UNIX for that hardware (Rajaraman 2012). This is considerably easier
    than rewriting the whole operating system.


    As years progressed, however, C began to undertake different authoritative versions
    as computer hardware and understanding evolved. The underlying mechanisms, however,
    were consistent through these iterations, so knowing one type was sufficient to
    know about them all. The major epochs were the following:


    *   K & R—Named after the authors of the original language specification, Kernighan
    and Ritchie, first seen in the early 1970s.'
