    Codd 的论文非常有理论性，并没有实际上创造出一种能够实现他所描述功能的编程语言。他拥有开创性的想法，但许多人怀疑这些想法是否能够可行，更不用说能够高效地运行了（Anthes
    2010）。过了几年之后，Codd 的雇主 IBM 才重新组织了其数据库研究团队，并安排他们投入开发 `System R`——这是一个基于 Codd 想法的新型数据库系统（Biancuzzi
    and Warden 2009）。在那之后又几年，Patricia Selinger 发表了一篇论文，展示了使用 Codd 关系模型的系统如何达到足够高的效率，足以与竞争对手竞争（Anthes
    2010）。


    `System R` 是一个永远改变数据库的项目。Selinger 是 `System R` 团队的成员之一，另外两位是 Donald Chamberlin
    和 Ray Boyce。Chamberlin 和 Boyce 被分配开发查询语言，以将 Codd 的想法变为现实。这两位研究人员对他们的新语言有很多目标，包括它应该具备以下功能：


    *   使用易于理解的英语关键词；

    *   允许用户创建数据库；控制谁有访问权限；并允许用户添加、删减和查询信息；

    *   能够独立运行，但也能与其他编程语言良好协作（Biancuzzi and Warden 2009）。


    Chamberlin 和 Boyce 将他们的语言命名为 `SQL` 并发表了关于它的论文，向世界分享了这种语言。这使得其他小组能够向前推进，在 IBM 实现
    `SQL` 的同时进行实现。事实上，市场上首个基于 `SQL` 的商业产品并非来自 IBM——而是来自 Relational Software Inc. 的产品
    `Oracle`，它后来变成了 Oracle 公司。`Oracle` 版本二（第一个面向公众的版本）于 1979 年推出（Preger 2012）。如今 `Oracle`
    是数据库领域的主要参与者。


    由于有许多小组都在基于 `SQL` 创建自己的系统，`SQL` 在 1986 年成为了创建和管理关系数据库的国际标准。多年来，这些标准得到了更新和改进，增加了新功能并解决了许多问题（Preger
    2012）。然而，由于每个实现 `SQL` 的小组方式各不相同，超出基础标准的合规性一直是一个存在的问题（Sheldon and Moes 2005）。


    因此，如今数据库开发人员可以使用许多不同的 `SQL` 方言。在图书馆世界，最常用的两种 `SQL` 类型是 `MySQL` 和 `PostgreSQL`。就像人类语言的方言一样，这些方言足够相似，使得开发者可以能够毫不费力地理解不熟悉的方言中的大部分内容。然而，要在特定方言中达到真正的精通需要一些努力。这意味着所有的
    `SQL` 数据库都将以表格的形式存储信息，表中的每行代表一个独立的条目，但用于向表中添加信息、从表中提取信息以及其他过程的准确措辞在不同方言之间会有不同。本章中的示例将以
    `MySQL` 为例。


    值得注意的是，近年来数据库系统领域取得了进一步进展。各种类型的 `NoSQL`（或“不仅是 SQL”）在扩展规模以处理大数据集方面正逐渐增长增长势头（Vaish
    2013）。`NoSQL` 世界中目前的一些知名品牌包括 `MongoDB`、`CouchDB` 和 `Hadoop` 等。


    这并不是说 `SQL` 数据库不值得花时间去学习。图书馆在 `SQL` 数据库投入了大量精力。我们的大多数系统都运行在上面，任何想在图书馆世界进行任何编程的人都可能迟早会遇到某种形式的
    `SQL`。


    ## 环境与设置


    `SQL` 语言是一种在各种关系型数据库管理系统（或 `RDBMSs`）中广泛实现的标准。为了使用 `SQL`，你需要访问一个 `RDBMS`。对于那些想要尝试使用
    `SQL` 查询但并不一定想在服务器或其他计算机上安装本地 `RDBMS` 环境的人来说，华盛顿大学开发了一个名为 `SQLShare` 的创新项目，它允许用户通过
    `SQLShare` 接口自由地上传数据并运行 `SQL` 查询。本章中使用的几个示例可以利用 `SQLShare` 平台运行。


    不过，如果你想真正深入学习并应用 `SQL`，你可能想要安装本地的 `RDBMS` 环境。这些环境的示例包括 `MySQL`、`SQLite` 或 `PostgreSQL`。这三者都是流行的开源
    `RDBMSs`，可以免费下载并安装在服务器或其他计算机上。


    `MySQL` 是常用服务器设置（或技术栈）`LAMP`（Linux Apache MySQL PHP）中不可或缺的一部分。`LAMP` 服务器利用 Linux
    操作系统、Apache Web 服务器通过浏览器浏览器内容、`MySQL` `RDBMS` 以及用于编写应用的 `PHP`。因此，如果你有一台 `LAMP`
    服务器，它已经安装了 `MySQL` 并已准备就绪。


    可以安装在 OS X 或 Windows 计算机上的类似软件包包括 `MAMP`（用于 Mac OS X）或 `WAMP/XAMPP`（用于 Windows）。此类技术栈通常用于在你自己的计算机上开发软件，而不是服务器上。如果你安装了
    `MAMP` 或 `WAMP`，你可以用它开启托管在你自己机器上的 Web 服务器，这允许你在自己的计算机（称为“localhost”）上“托管”网页和 Web
    应用程序。


    当你使用 `MySQL` 时，最好记住 `MySQL` 本身是为命令行交互设计的，没有原生的图形用户界面（GUI）。不过，存在工具可以防止 `MySQL`
    用户使用命令行。例如，`phpMyAdmin` 是一个随 `LAMP` 栈的常用的 `MySQL` 交互界面。可以使用 `phpMyAdmin` 创建和删除（drop）`MySQL`
    数据库和表。


    尽管如此，在处理自定义应用程序时，了解 `MySQL` 命令行是有用的。关于与 `MySQL` 命令行交互的详尽文档可以在此处找到：[`dev.mysql.com/doc/refman/5.5/en/mysql.html`](http://dev.mysql.com/doc/refman/5.5/en/mysql.html)。本章的“示例”部分提供了使用
    `MySQL` 的命令行操作示例。


    ## 用途


    `SQL` 环境存在于图书馆各种应用程序中，包括集成图书馆系统（ILS）和资源共享系统、网站内容管理系统（CMS）、数字资产管理系统（DAMS）等。


    ### 集成图书馆和发现系统


    `SQL` 存在多个集成图书馆和发现系统中，包括：


    *   `Koha` 开源 `ILS` (`MySQL`)

    *   `Evergreen` 开源 `ILS` (`PostgreSQL`)

    *   `Sierra` Innovative Interfaces Inc. `ILS` (`PostgreSQL`)

    *   `Intota` ProQuest `ILS` (Microsoft SQL)

    *   `VuFind` 开源发现界面 (`MySQL`)


    在 `ILS` 和发现应用中，理解 `SQL` 语法对于从这些系统中自定义数据收集变得越来越有用。`SQL` 语法知识使图书馆能够收集没有作为“预设”报告直接构建在软件中的数据。

