    number of patrons going through the library door. The task of creating the weekly
    average is the same whether you are counting books or people. It is this kind
    of chunked programming that has led to the development of very powerful programs
    and allowed the person on the street to add to it. The goal is to avoid having
    to rewrite the whole program just because you want to add one new task (to learn
    more, visit PC magazine’s definition at [http://www.pcmag.com/encyclopedia/term/48238/object](http://www.pcmag.com/encyclopedia/term/48238/object)-oriented-programming).


    A fun way to begin programming is to work on puzzles where the reader is asked
    to solve a task by writing a script. Anyone can search online for examples of
    these. There are also books on programming puzzles. However, some of these books
    contain complex puzzles, and it seems these puzzles are used in the interview
    process when firms hire new programmers. For beginners, don’t shy away from books
    written for kids. Jason Briggs’s Python for Kids is a great starting point, and
    his website ([http://jasonrbriggs.com/python-for-kids/puzzles.html](http://jasonrbriggs.com/python-for-kids/puzzles.html))
    posts simple programming challenges for beginners.


    In any event, one of the easiest ways for a beginner to learn programming is by
    having fun working on projects where failure is a learning experience and not
    a security or function problem. Again, Arduino projects are great for this type
    of activity. My best suggestion is to load Linux (it’s free) on an old laptop,
    buy an Arduino for twenty dollars, and spend some time on the web with [Code.org](http://Code.org).


    Programming in Libraries


    Finally, why should a librarian learn to program? To collect data and solve problems
    such as how many books within the call numbers range x–y were checked out more
    than once in any given year over the last ten years, to determine if checkouts
    are related to student success, to examine the effectiveness of library instruction—and
    many other reasons.


    This brings us to deciding which language to learn. Generally, this is going to
    depend on the reason behind wanting to learn. If the goal is a specific task,
    the language choice will be affected. For many librarians, writing the most concise
    code is probably less important than writing code that others can easily interpret.
    This is why languages such as Ruby and Python are popular. They are fairly concise,
    but more importantly, a person reading the script can easily see what the script
    is trying to do.


    A recent report in the Communications of the Association for Computing Machinery
    (Guo 2014) indicated that Python was the most popular language of 2014\. This
    was based on an analysis of recent classes taught in university computer science
    departments and indicates that many programs are now written in Python. Thus it
    will probably be one of the best languages to start with unless there are reasons
    to use something else. Python is simple and powerful, and you will able to write
    interesting scripts fairly easily. If you are mainly involved in web design, then
    Java may be a better fit. There is no need to learn too many languages. Once you
    learn one language and have a good grasp of basic programming terminology and
    concepts, it will be easier to pick up another language when needed or desired.'
