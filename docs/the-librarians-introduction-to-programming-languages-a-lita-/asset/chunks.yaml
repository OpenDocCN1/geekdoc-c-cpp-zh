    Uses


    Python’s flexibility makes it appropriate for a variety of uses. Popular services
    such as Google, YouTube, and Dropbox code large-scale projects with it for both
    web and desktop environments. Closer to home in libraries, the Evergreen open-source
    ILS, though written largely with Perl, uses Python for some development tasks.
    However, Python’s low barrier to entry makes it a particularly good fit for smaller
    projects to automate common tasks, such as web scraping, text analysis, or working
    with MARC records, and robust web frameworks, such as Django, make it a good option
    for CMSs and web development.


    Before even getting outside the standard library, Python serves as a wonderful
    tool for quick data analysis. If you have serial holdings records from a vendor
    that aren’t matching what you have in your ILS, and you do not want to manually
    cross-check hundreds of records, you can download a CSV file of the holdings from
    both systems and use Python to compare them to see where the discrepancies are.
    In a world of distributed systems and holdings coming from a wide variety of sources,
    the ability to do this kind of quick, custom, automated analysis can give you
    back hours of your workday.


    In addition to its large standard library (set of available scripts), there are
    a number of third-party libraries that can make complex tasks simple and routine
    tasks almost effortless. For example, web-scraping libraries, such as Scrapy,
    can make website audits much more streamlined. Rather than going through each
    page and recording what the page is about, who authored the page, when it was
    last updated, and so on, you can use Scrapy to make a Python program that knows
    what kind of information is being looked for, where on pages to find that information,
    and what pages in a domain it should and shouldn’t follow. Combined with built-in
    duplicate removal and output to several common formats, you can have an XML listing
