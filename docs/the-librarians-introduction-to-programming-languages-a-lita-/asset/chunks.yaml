    Chapter Seven


    SQL


    Emily R. Mitchell and Lauren Magnuson


    History and Development


    Structured Query Language (SQL) is a fundamental programming language for interacting
    with stored application data, which is the persistent data that hangs around even
    when you close a program or reboot your computer. It is primarily a declarative
    language, distinguishing it from procedural programming languages used for writing
    applications, such as PHP or Ruby. SQL’s basic syntax is designed to create, query,
    update, and delete data stored in a database. SQL is used in a variety of library
    contexts, and understanding how it works can enable librarians to better understand
    the way library data is stored, retrieved, analyzed, and potentially extended
    to new applications and services. To understand why SQL is so important, you need
    to understand what life was like before SQL. Before SQL, if you wanted a program
    to use persistent data, you would have to tell the program exactly how to get
    to that information.


    If you can imagine working in a library with no call numbers and trying to give
    step-by-step directions to a very timid and literal-minded library patron who
    needs to find a book, you’re on the right track here. You’re going to have to
    tell the library patron to turn around, go up two flights of stairs, turn right,
    go through the door, walk to the third bookshelf on the right, and select the
    fourth book on the second shelf from the top. If the library purchases more books
    that go before the book in question on the shelf, you’re going to have to know
    about it and change your directions so that the next time someone asks for this
    book, you can send that person to the sixth book on the shelf instead of the fourth.
    If the library ever remodels, you’ll have to rememorize everything from scratch.


    The above is an example of what it was like dealing with persistent data in the
    days before SQL. The computer programmer had to know exactly where the information
    she was looking for was stored. If that information was moved or reorganized,
    the programmer’s old code would fail to work and would have to be rewritten. To
    make matters worse, creating and managing a database in the first place took a
    whole other set of equally complicated skills. Clearly, the world was ready for
    an improved means of managing persistent data.


    In 1970, E. F. Codd published a paper with a first line that read, “Future users
    of large data banks must be protected from having to know how the data is organized
    in the machine (the internal representation)” (Codd 1970, 377). In other words,
    you shouldn’t have to memorize the exact location of every book in your library
    before you’re able to direct patrons to them. Codd’s paper was called “A Relational
    Model of Data for Large Shared Data Banks,” and it laid the foundation for SQL:
    a new way of thinking about how pieces of data relate to each other. This emphasis
    on the relationships between pieces of data is why Codd called it a “relational
    model.”'
