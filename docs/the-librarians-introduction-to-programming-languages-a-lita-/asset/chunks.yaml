  raw: 'The java.util.GregorianCalendar is a concrete subclass of Calendar and provides
    the standard calendar system used by most of the world. The GregorianCalendar
    class allows the programmer to enter a date in a familiar format (month, date,
    year, etc.) and easily convert it to a date that Java understands. The GregorianCalendar
    class also allows for math functions so you can manipulate dates by adding and
    subtracting time from them (Oracle 2015). The class java.util.Scanner is one of
    many ways that data can be read into Java. It is a simple text scanner that can
    parse primitive types and strings using regular expressions (Oracle 2015).


    One important thing to remember when using an existing Java class is that it may
    not work exactly the way you expect. It is important to understand the functions
    of a class before you use them, or you may get undesirable results. For example,
    after the code above reads in an integer for the month, it subtracts one.


    month = month-1; //Months in the Calendar class are 0-11 instead of 1-12


    GregorianCalendar birthday = new GregorianCalendar(year, month, day);


    This is because, as the comment indicates, months in the calendar class go from
    0 to 11 instead of 1 to 12\. If a user of this program was born in January, he
    or she would likely enter 1 for the birth month when prompted, but Java would
    interpret that to mean February. It is the responsibility of the program developer
    to make sure that the data is being interpreted properly.


    This specific example may never come up, but there will be a lot of times that
    a class or function doesn’t behave in exactly the way an unfamiliar user might
    expect. It is always a good idea to read through the documentation when using
    something new.


    There are many of these types of built-in classes that help with various operations,
    such as File (java.io.File), which allows users to edit files; Math (java.io.Math)
    for complex math equations; or NumberFormat (java.io.NumberFormat), which allows
    users to specify their number format down to details such as currency type, including
    euros verses American dollars. A list of all classes included with Java 8 can
    be found here: [http://docs.oracle.com/javase/8/docs/api/allclasses-noframe.html](http://docs.oracle.com/javase/8/docs/api/allclasses-noframe.html).


    If you want to see what methods are included in a class or how to use a particular
    method, it is worthwhile to look up the documentation on that class. Also, if
    you try to use something and it doesn’t work the way you expect, it is always
    useful to search Java forums on the Internet. It is very likely that someone had
    the same confusion as you.


    Java Applet


    This is an example of code that will generate a Java applet that can be embedded
    in a web browser. Unlike console-based applications, code for applets does not
    require a static void main function to run. This function uses the graphic class
    very minimally, but it can be used to do more complex drawings. There is also
    a 3D graphics class that allows for three-dimensional graphics and many other
    graphics classes as well.


    All this application does is create a box containing words in red that say “This
    is a Java Applet.”


    import java.applet.Applet;


    import java.awt.Graphics;


    import java.awt.Color;


    public class Main extends Applet


    {


         public void paint(Graphics g) {


         Color color = Color.RED;


         g.setColor(color);


         g.drawString("This is a Java Applet", 25, 25);


         }


    }


    This uses the Color class to set the color of the text. In this case, the example
    uses a built-in constant of RED, but the code would also allow a color hex code
    to get the exact color the user wants.


    Summary


    Java is a robust, portable, object-oriented, and familiar language. It is the
    language used in all Android applications and can also be used for many other
    types of projects, including everything from developing web applications to programming
    SIM cards and other microdevices. While Java can be more complicated to learn
    than some newer languages, it is a mature language with a strong history, large
    user base, and vast tool set available to help both new and veteran users. Java’s
    portability, usability, and maturity make it a powerful tool for a wide variety
    of large and small programming projects.


    Bibliography


    Deitel, P., H. Deitel, and A. Deitel. 2014\. Android for Programmers: An App-Driven
    Approach. Upper Saddle River, NJ: Prentice Hall.


    Gassner, D. 2011\. “Java Essential Training.” [Lynda.com](http://Lynda.com). [http://www.lynda.com/Java-tutorials/Java-Essential-Training/377484-2.html](http://www.lynda.com/Java-tutorials/Java-Essential-Training/377484-2.html).


    Murach, J. 2011\. Java Programming. 4th ed. Fresno, CA: Mike Murach & Associates.


    Niemeyer, P., and D. Leuck. 2013\. Learning Java. Beijing: O’Reilly Media.


    Oh, H. S., B. J. Kim, H. K. Choi, and S. M. Moon. 2012\. “Evaluation of Android
    Dalvik Virtual Machine.” In Proceedings of the 10th International Workshop on
    Java Technologies for Real-Time and Embedded Systems, 115–24\. New York: ACM.


    Oracle. 1997\. “Design Goals of the Java Programming Language.” The Java Programming
    Language Environment. [http://www.oracle.com/technetwork/java/intro-141325.html](http://www.oracle.com/technetwork/java/intro-141325.html).


    ———. 2015\. “Java Platform, Standard Edition 8 API Specification.” [http://docs.oracle.com/javase/8/docs/api/overview-summary.html](http://docs.oracle.com/javase/8/docs/api/overview-summary.html).


    Schildt, H. 2011\. Java the Complete Reference: Comprehensive Coverage of the
    Java Language. 8th ed. New York: McGraw-Hill.


    Schildt, H., and J. Holmes. 2003\. The Art of Java. New York: McGraw-Hill.


    Recommended Resources


    Java Essential Training Online Course. [http://www.lynda.com/Java-tutorials/Java-Essential-Training/377484-2.html](http://www.lynda.com/Java-tutorials/Java-Essential-Training/377484-2.html)
    (requires subscription).


    Oracle’s site where Java, Java tools, and documentation can be found: [http://www.oracle.com/technetwork/java/index.html](http://www.oracle.com/technetwork/java/index.html).


    Schildt, H. 2014\. Java: A Beginner’s Guide. New York: McGraw-Hill Education.


    Stack Overflow. [http://stackoverflow.com](http://stackoverflow.com)/. This is
    a site of user-generated questions and answers and is a great place to find someone
    who is doing or has done the same thing you are trying to do. Like most collaborative
    online sites, not all of the information is correct, and content is not mediated
    for quality.


    Glossary


    Eric Phetteplace, Amanda Cowell, and Beth Thomsett-Scott


    Important note: Many terms have different meanings depending on the language they
    are used in as well as the stage of programming. For convenience, we have defined
    some of the most important terms below. A few web resources are presented at the
    end for further assistance. There are also a variety of dictionaries and handbooks
    in print or online that will be helpful for beginners.


    AJAX. An acronym for Asynchronous JavaScript and XML, AJAX is a technique for
    dynamically pulling in data from other websites or services without requiring
    the web browser to refresh the page. AJAX is an important and common technique
    in modern web development because of how it makes websites feel faster and allows
    multiple data sources to be combined by a web app in real time.


    applet. A small program that can be sent along with a web page to a user.


    array. An object that holds a set number of values of one type. Values are usually
    in columns and rows.


    asynchronous programming. A form of programming that allows different activities
    (events) to occur before a previous one is completed. For example, you are shutting
    off your computer—asynchronous programming allows each program to close and exit
    without following an order. Synchronous programming would request Word to exit
    before starting to close Excel.'
