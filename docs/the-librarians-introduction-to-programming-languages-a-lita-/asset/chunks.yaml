    # The Librarian’s Introduction to Programming Languages


    ## Library Information Technology Association (LITA) Guides


    Marta Mestrovic Deyrup, Ph.D., Acquisitions Editor, Library Information and Technology
    Association, a Division of the American Library Association


    The Library Information Technology Association (LITA) Guides provide information
    and guidance on topics related to cutting-edge technology for library and IT specialists.


    Written by top professionals in the field of technology, the guides are sought
    after by librarians wishing to learn a new skill or to become current in today’s
    best practices.


    Each book in the series has been overseen editorially since conception by LITA
    and reviewed by LITA members with special expertise in the specialty area of the
    book.


    Established in 1966, the Library and Information Technology Association is the
    division of the American Library Association (ALA) that provides its members and
    the library and information science community as a whole with a forum for discussion,
    an environment for learning, and a program for actions on the design, development,
    and implementation of automated and technological systems in the library and information
    science field.


    Approximately twenty-five LITA Guides were published by Neal-Schuman and ALA between
    2007 and 2015. Rowman & Littlefield took over publication of the series beginning
    in late 2015. Books in the series published by Rowman & Littlefield are:


    * Digitizing Flat Media: Principles and Practices

    * The Librarian’s Introduction to Programming Languages

    * The Librarian’s Introduction to Programming Languages

