  trans: "\n\n- 默认情况下，你现在应该能够在你喜喜浏览器中访问 `http://localhost`。如果你收到关于连接服务器的错误，说明 WampServer\
    \ 安装存在问题。\n- 从 [`netbeans.org/downloads`](https://netbeans.org/downloads) 下载带有\
    \ HTML5 和 PHP 的 NetBeans。\n- 安装 NetBeans。NetBeans 安装过程中没有哪些选项会影响本教程。\n\n要创建一个可以在\
    \ NetBeans 中编写并由 WampServer 测试的项目，需要将这些程序设置为在相同的文件上操作。WampServer 的默认文件夹位置是 `C:\\\
    Wamp\\www\\`，此时此处应该是空的。测试项目将命名为 `my_project`。\n\n- 在 `C:\\Wamp\\www` 中创建一个名为 `my_project`\
    \ 的文件夹。\n    - 选择 `Start` > `Computer`。\n    - 选择 `Local Disk (C:\\)`。\n    -\
    \ 选择 `Wamp` 文件夹。\n- 点击屏幕顶部的 `New Folder`（新建文件夹）。\n- 输入 `my_project` 作为文件夹名。\n\
    - 启动 NetBeans。\n- 选择 `File` > `New Project`（文件 > 新项目）。\n- 在项目类别部分下，选择 `PHP`，然后在\
    \ `Projects` 下选择 `PHP Application`（图 6.1）。\n- 点击 `Next`（下一步）。\n- 将项目命名为 `my_project`（项目名称可以包含空格，但保持一致总无坏），并通过浏览到\
    \ `C:\\Wamp\\www\\my_project\\` 新创建的文件夹来设置 `Sources` 文件夹（图 6.2）。\n- 将 `PHP Version`、`Default\
    \ Encoding` 和 `Metadata` 文件夹保持默认值，并点击 `Next`。\n- `Run Configuration`（运行配置）窗口定义了如何部署项目。在服务器上测试项目时，远程设置允许\
    \ NetBeans 直接从服务器上传和下载。对于测试、调试和离线开发，请选择 `Run As Local Web Site`（作为本地网站运行）。如果尚未输入，请使用\
    \ `http://localhost/my_project/` 作为 `Project URL`（图 6.3）。\n- 框架和 Composer 的包含超出了本教程的范围。选择\
    \ `Finish`（完成）。\n\n`my_project` 项目现在应该出现在 `Projects Pane`（项目面板）中（图 6.4）。NetBeans\
    \ 划分为多个面板，可以根据你的屏幕和偏好重新排列。本教程中提到的面板包括 `Projects`、`Files` 和 `Editor` 面板。如果其中任何面板难以识别，请选择\
    \ `Window`（窗口）然后选择面板名称来切换面板的显示。\n\n![](img/Figure_6.1.jpg)\n图 6.1. 初始化新项目。\n\n\
    ![](img/Figure_6.2.jpg)\n图 6.2. 新项目设置。\n\n![](img/Figure_6.3.jpg)\n图 6.3. 新项目运行配置。\n\
    \n![](img/Figure_6.4.jpg)\n图 6.4. NetBeans 完成设置。\n\n为了测试 NetBeans 和 WampServer\
    \ 是否协同工作，在 `my_project` 中创建一个名为 `index.php` 的新文件。\n\n- 选择 `File` > `New File`（文件\
    \ > 新文件）。\n- 在 `File Types`（文件类型）下选择 `PHP File`，然后点击 `Next`。\n- 使用 `index` 作为文件名。NetBeans\
    \ 将自动添加 `.php` 扩展名。\n- 选择 `Finish`（完成）。\n\n如果 NetBeans 和 WampServer 配置正确，访问 `http://localhost/my_project`\
    \ 应该得到一个没有任何错误的空白页面，如图 6.5 所示。\n\n![](img/Figure_6.5.jpg)\n图 6.5. 配置界面。\n\n与传统的编程语言不同，PHP\
    \ 的预览速度与开发环境保存文件的速度一样。换句话说，PHP 不需要可以在服务器接受文件之前编译脚本。缺点是，每当请求脚本时，与请求页面相关的文件都必须拉入内存并进行“实时”编译。这导致了一个主要的考虑因素：需要大量内存密集型资源的项目使用\
    \ Java 等编译型语言可能会运行得更快。不适合作为 PHP 候选的应用程序是那些索引大量文档的程序。“大”无法准确指定，因为它取决于实际生产环境和文档的大小；然而，考虑到库作为数据聚合器的角色，这一考虑是非常重要的。更复杂的是，PECL\
    \ 中存在缓存扩展，可以减少服务器重新编译脚本的频率。\n\n### 谈论 PHP\n\n如果将 PHP 视为一种语言，可以将其视为类似于学习一种外语。任何语言的基础构建块都是名词和动词。如果\
    \ PHP 是一门书面语言，变量就是名词。变量存储了关于谁、什么、何时、何地和为什么的信息。函数、语句和运算符是 PHP 的动词，而运算符也可以充当形容词的角色。这种比较不应理解得太字面，但它可能有意想不到的帮助。此外，类似于书面语言，PHP\
    \ 语法同样是任意的，只是词序在说话者（代码）和听话者（WampServer）之间已协商好，以避免混淆。示例见表 6.1。\n\n表 6.1. PHP 与英语的对比\n\
    \n| 英语 | PHP |\n| :--- | :--- |\n| John 十岁。 | `$john = 10;` |\n| Mary 比 John 大两岁。\
    \ | `$mary = 2 + $john;` |\n| 用你的脚关门。 | `close (\"door\", \"foot\");` |\n| 你对不起。\
    \ | `echo \"You're sorry\";` |\n| 你对 Mary 有什么了解？ | `$raw_results = $mysql_connection->query(\"\
    SELECT age FROM people WHERE name = 'Mary'\");` |\n\n- 每条语句以分号（`;`）结束。\n- 字符串应该封装在单引号（`'`）或双引号（`\"\
    `）中，例如。\n- 双斜杠（`//`）之后的字符被 PHP 解析器忽略，可以作为行内注释：`$a_complicated_variable; //注释`。\n\
    - 注释也可以通过将其放在 `/*` 和 `*/` 之间创建：\n```\n/* 这种风格的注释\n可以跨行并包含任何内容 */\n```\n函数和语句可以执行大量的动作。函数的语法通常需要它作用的对象，这位于括号中。例如，`sort($vegetables)`\
    \ 将对蔬菜数组进行排序，按字母顺序。运算符是简单的动作动词。有一些运算符与其算术对应相同：\n\n- `+` 加、组合或连接\n- `-` 减\n- `*`\
    \ 乘\n- `/` 除\n- `%` 取模或取余数。`7%3` 结果为 `1`，因为 `3` 除 `7` 两次余 `1`。\n- `.`（点）连接字符串。`echo\
    \ $x . \"pesos\";` 将输出类似 30pesos。\n- `=` 赋值。`$mary = 12` 将数字 12 赋值给变量 `$mary`。\n\
    - `==` 比较运算符。`3 == 1+2` 返回 `true`。这种比较被认为是“宽松”的，因为 PHP 会检查值是否相等，所以 `\"3\" == 3`\
    \ 返回 `true`。\n- `===` 严格比较运算符。`3 === 1+2` 返回 `true`。这种比较被认为是“严格”的，因为 PHP 会检查值是否相同，所以\
    \ `\"3\" === 3` 返回 `false`，因为 `\"3\"` 是字符串而 3 是数字。如果开发者使用宽松比较而不是严格比较，NetBeans\
    \ 将警告他们，因为在大多数情况下，严格比较更稳定且运行更快。与宽松比较相比，倾向严格比较也是最佳实践，因为它减少了某些安全问题的可能性。PHP 缺乏严格的数据类型，如果开发者丢失对使用的变量类型的跟踪，可能会难以预测运算符。\n\
    \n- `>`, `<`, `>=`, `<=` 分别大于、小于、大于等于、小于等于。\n\n"
- fmt: "\n## Operators\n\n*   `! Not !=` Not equal (loose comparison). `!==` Strictly\
    \ not equal. For example, `$josh !== “human”` is the same as `!($josh === “human”)`.\n\
    \nThere are special situations and additional operators, including bitwise operators\
    \ that are excluded here. An authoritative list and descriptions for all operators\
    \ is available at [http://php.net/manual/en/language.operators.php](http://php.net/manual/en/language.operators.php).\
    \ PHP has constructions for control statements similar to C (table 6.2).\n\n###\
    \ Table 6.2 Common PHP Control Statements\n\n| Statement | Description | Example\
    \ |\n| :--- | :--- | :--- |\n| `if` | The classic programming “switch.” It is\
    \ usually formed with the comparison of two variables. | `if($mary > $frank) {\
    \ echo \"Mary is old\";}}` |\n| `else` | Used after an `if` statement to provide\
    \ the developer a way to define code that should be executed when the `if` statement\
    \ is false. | `if($mary > $frank) { echo \"Mary is old\";} else { echo \"Frank\
    \ is as old or older\";}}` |\n| `while` | A basic loop that occurs over and over\
    \ until a certain condition is false. | `$x = 0;while($x < 5) { echo $x . \",\
    \ \"; $x = $x + 1;}`This would output 0, 1, 2, 3, 4, |\n| `for` | A shortcut for\
    \ writing `while` loops that are designed to run `$x` number of times. | `for($x\
    \ =0; $x < 5; $x = $x + 1) {echo $x . \", \";}`This would output 0, 1, 2, 3, 4,\
    \ . Identical to the previous example with two fewer lines. |\n| `for each` |\
    \ A shortcut for writing `for` loops that are designed to run on each of the elements\
    \ inside an array or object. | `$fruits = array(\"A\", \"B\", \"C\");foreach($fruits\
    \ as $item) {echo $item \" \";}`This would output A B C |\n\n## PHP 5 OOP\n\n\
    PHP’s object-oriented programming (OOP) style allows developers to take advantage\
    \ of advanced programming techniques, including design patterns. Other programming\
    \ languages led the technology world into object-oriented programming, leaving\
    \ PHP a little late to the table. As its name implies, object-oriented programming\
    \ focuses on objects as a variable. An object can execute PHP code and store other\
    \ variables.\n\nThere is no shortage of metaphors to help with understanding objects\
    \ in a programming context. If objects are not immediately obvious, do not be\
    \ dissuaded because they are, by definition, abstract. Objects are based on portions\
    \ of code that allow for easy reuse. Mr. Fish, a fish, for our metaphor, is part\
    \ of a school of fish where all the members of the school are identical except\
    \ for age and physical position in the sea. Each fish, from its `DNA`, knows how\
    \ to swim, eat, and blow bubbles. If we could visibly see each fish, we could\
    \ determine if it was swimming, eating, or blowing bubbles. If we change how Mr.\
    \ Fish swims, all the fish in the school would change to swim using these new\
    \ DNA changes. With a few word substitutions to this metaphor, we could be describing\
    \ objects in PHP. Fish are objects, `DNA` is code, and schools are classes (table\
    \ 6.3).\n\n### Table 6.3 English to PHP Syntax\n\n| English | PHP |\n| :--- |\
    \ :--- |\n| Mr. Fish is part of a school of mackerel. He is four years old and\
    \ ten feet underwater. | `$mrFish = new Mackerel(4);$mrFish->position = -10;`\
    \ |\n| Mr. Fish swims to the surface. | `$mrFish->swim(0);` |\n| If Mr. Fish is\
    \ blowing bubbles, he should eat. | `if($mrFish->is_blowing_bubbles) { $mrFish->eat();}`\
    \ |\n\nDevelopers term properties and methods as the descriptions of an object\
    \ and the actions an object can perform, respectively. `Position` and `age` are\
    \ the properties of Mr. Fish. `Swim`, `eat`, and blow bubbles are the methods\
    \ of Mr. Fish.\n\nStudy-room reservation systems are good examples of object-oriented\
    \ programming in use at libraries. Rooms need methods defined that can reserve\
    \ the room, see when the room is available, and give directions to the room. Each\
    \ room needs the properties that define the name, location, and room number. Reservations\
    \ themselves can also be objects. Properties of reservations include the room,\
    \ date, time, and patron; methods include create, cancel, approve, move room,\
    \ change time, and so on. In total, a reservation system can include classes for\
    \ reservations, rooms, patrons, and buildings.\n\nObject-oriented programming\
    \ with PHP also provides some much needed code and file organization. It is a\
    \ best practice to create a new PHP file for each class in an application. For\
    \ a room reservation system, each class would be a separate file named after the\
    \ class it contains. The reservation system would be structured into files similar\
    \ to the following:\n\n*   [`index.php`](http://index.php)\n*   `[folder]` shared\n\
    \    *   [`shared.configuration.php`](http://shared.configuration.php)\n    *\
    \   [`shared.database.php`](http://shared.database.php)\n*   `[folder]` reservations\n\
    \    *   [`reservations.buildings.php`](http://reservations.buildings.php)\n \
    \   *   [`reservations.patrons.php`](http://reservations.patrons.php)\n    * \
    \  [`reservations.reservations.php`](http://reservations.reservations.php)\n \
    \   *   [`reservations.rooms.php`](http://reservations.rooms.php)\n\n## Maintaining\
    \ Complex Programs in a Library with Design Patterns\n\nDesign patterns are well\
    \ documented and required learning for most developers in any object-oriented\
    \ language. These patterns solve complex issues that are rather common in PHP.\
    \ That is not to say that complex issues cannot be solved without design patterns\
    \ or even without objects. Libraries, in particular, need to be aware how their\
    \ programs will be future proofed or, possibly, how a program can be shared with\
    \ other institutions. No doubt, a talented programmer can invent ways of solving\
    \ complex issues that a design pattern can solve; however, it obfuscates the code\
    \ for subsequent or team programmers. Additionally, the growing popularity of\
    \ design patterns in open-source projects suggests that library developers will\
    \ need a stronger grasp of design patterns as more library software moves toward\
    \ community development. While design patterns are outside the scope of an introduction,\
    \ application design gives a fun introduction to solving common development challenges.\
    \ The Wikipedia article on “Software design pattern” is a wonderful overview ([https://en.wikipedia.org/wiki/Software_design_pattern](https://en.wikipedia.org/wiki/Software_design_pattern)).\n\
    \n## Example\n\nThis example will handle a form submission that will send user\
    \ input to a database. This common task can be riddled with security issues. The\
    \ frequency of this task in libraries (suggestion box, request forms, fine appeals,\
    \ technology loan agreements, and more) usually suggests that libraries will implement\
    \ either a homegrown form management system or Drupal forms or another open-source\
    \ framework like Form Tools.\n\nThe first file is a standard configuration file.\
    \ The purpose of this file is to be a centralized file for permissions. A best\
    \ practice is to change database and server passwords whenever employee changeover\
    \ occurs or when the passwords may be compromised. Either of those events can\
    \ occur somewhat often. Tracking down those credentials can be laborious if they\
    \ are repeated in each file. Centralizing passwords eases these burdens.\n"
