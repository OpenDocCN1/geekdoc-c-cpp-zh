- fmt: '

    Many libraries use JavaScript to record traffic to their web properties. While
    this in and of itself does not require programming knowledge, as most analytics
    solutions provide a simple snippet of code for you to paste in your website’s
    markup, JavaScript can also record custom events that one defines. These events
    can be anything that JavaScript has access to, including what parts of a page
    users click on, how they interact with tabbed search interfaces, whether they
    play embedded videos, and more. There are many examples of libraries using this
    capability to discover user behavior that can in turn be used to improve user
    interfaces or demonstrate the popularity of a particular service. To name but
    two examples, Kirk Hess used custom events tracked with JavaScript and the colossally
    popular Google Analytics service to learn how visitors interacted with the University
    of Illinois at Urbana-Champaign’s digital library (Hess 2012), and JavaScript
    was used to record usage data for the Summon discovery layer (Pattern 2012; Reidsma
    2012).


    Summon did not report the statistics that librarians were interested in, thus
    the need to resort to JavaScript. Libraries often subscribe to vendor web products
    that, while offering some custom options, do not provide finely grained controls
    for all of their functions. Librarians may be able to insert custom HTML in a
    particular section of the site but not turn off certain features or construct
    new ones. Luckily, if the vendor site does allow one to insert JavaScript (typically
    via a `<script>` tag in your custom HTML header or footer), the possibilities
    for customization are great. Since JavaScript is specifically made for modifying
    web pages, the vendor site can be modified in many ways: elements can be removed,
    text on the page can be altered, interactions specified by the vendor’s JavaScript
    can be superseded, and custom features can be inserted. It is worth noting that
    all customization runs the risk of conflicting with an original feature or breaking
    when the vendor introduces changes in its site.


    Multitab search boxes, filtering search results without a page refresh, recording
    custom analytics, and customizing vendor websites are but a few of the common
    uses of JavaScript in libraries. Data visualization, using data from third-party
    sources, personalization using information stored in cookies, and much more can
    be done. JavaScript is the programming language of the web, and the web’s ubiquity
    makes it a powerful tool for almost any task.


    While historically used almost exclusively in a web browser environment, recent
    projects have begun to add capabilities to JavaScript beyond the creation of dynamic
    HTML documents. Mozilla’s Rhino project provides the means to embed JavaScript
    inside Java applications (Mozilla Developer Network 2014). Rhino is used to make
    certain functions scriptable within the EQUELLA digital repository, for instance.
    While Rhino was one of the earlier projects to bring JavaScript outside the web
    browser, the introduction of `Node.js` in 2009 by Ryan Dahl played a significant
    role in expanding the uses of the language (Dahl 2009). `Node.js` adds the ability
    to perform web server and file system operations, allowing programmers to write
    fast web applications and command line tools. There are also projects, such as
    Apache Cordova, which allow one to write a native app using traditional web technologies
    (HTML, CSS, and JavaScript) instead of the typical Objective C or Java (Apache
    Software Foundation n.d.). Most recently, Apple has expanded the means of automating
    programs in its OS X desktop operating system from only its proprietary AppleScript
    language to include JavaScript as well (Apple 2014). While JavaScript once was
    only used in browsers, it can create server-side applications, native mobile apps,
    and desktop software. This flexibility means that the language is a competitor
    to popular, multipurpose interpreted languages, such as Python and Ruby.


    ## Pros and Cons


    JavaScript’s tremendous popularity is a boon, particularly for new coders. Since
    almost every problem has already been encountered when writing JavaScript, numerous
    answers, tutorials, and documentation exist online. Furthermore, there are many
    popular JavaScript libraries that solve common problems. These libraries can be
    employed to help you rapidly develop complex applications with very little of
    your own code. While many programming languages share a strong set of libraries
    and online assistance, JavaScript is among the best.


    JavaScript is a flexible and forgiving language. Like many high-level scripting
    languages, it abstracts over the intricate minutia of dealing with computer hardware
    and worrying about memory allocation. One can write code without understanding
    how the underlying machine must handle it. On the whole, JavaScript tends toward
    lenience. Where other languages throw errors that stop a program in its tracks,
    JavaScript will continue while providing clues that something is wrong. An excellent
    example of this clemency is accessing object properties that do not yet exist;
    while many other languages throw a reference error in this situation, JavaScript
    returns `"undefined"`. Instead of complicated error handling patterns, one can
    thus perform simple tests to see if a property exists. The language also has a
    flexible type system. Types are how different data are classified by programming
    languages, for instance, as integers, strings of text, or more complex objects
    with sets of special properties. JavaScript does not force one to declare a variable’s
    type when it is created, does allow variables to change types during their lifespans,
    and does not force one to declare what types of data are allowed to be passed
    to one’s functions.


    The debate over whether strongly or weakly typed programming languages are superior
    is decades old. The debate will not be settled by this paragraph. Nonetheless,
    weak-type systems benefit beginning programmers. The beginner does not have to
    first accumulate exhaustive knowledge of a language’s data structures before being
    able to use it. Furthermore, code written in weakly typed languages can create
    elegant interfaces that accept multiple data types and perform intuitive actions
    based on what is given. The enormously popular jQuery library, which will be covered
    later, takes wonderful advantage of this opportunity. For example, once you have
    selected an HTML element with jQuery, you can alter its appearance with the `css`
    method. This method can accept a pair of strings—the first being the property
    name and the second its value—to apply a style written in the Cascading Style
    Sheets (CSS) language to the element. But the `css` method also accepts an object
    of property-value pairings, allowing the programmer to set multiple styles at
    once. If JavaScript was strongly typed, `css` would only be able to accept either
    two strings or an object, making this intuitive interface impossible.


    JavaScript’s implementation of functions is particularly strong. The language
    treats functions as first-class objects, which means, essentially, that functions
    can be dynamically created, passed as parameters, or used in places where other
    languages limit the programmer to a static data type such as strings of text or
    numbers.

