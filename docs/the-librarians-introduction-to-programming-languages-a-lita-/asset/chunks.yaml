    \ Foundation n.d.-b). For AJAX, jQuery has a whole host of functions that smooth\
    \ over inconsistent browser support and simplify the entire process, as shown\
    \ in table 4.1 (jQuery Foundation n.d.-a). Everything from altering element attributes\
    \ to making web document objects appear and disappear can be handled quickly and\
    \ efficiently using jQuery methods. A few of the many jQuery methods are shown\
    \ in table 4.1.\n\n### Table 4.1 Examples of jQuery Methods\n\n| Method | Description\
    \ |\n| :--- | :--- |\n| `.hide()` | Sets an HTML element to display:none, causing\
    \ it to disappear |\n| `.show()` | Causes a hidden HTML element to be shown |\n\
