    # Python Overview


    Python is an open-source high-level scripting language used for a variety of purposes,
    from fast, small analysis programs to large-scale applications. Although it is
    difficult to measure how many users open-source projects have, it is estimated
    that Python has around a million users and is in the top five or ten most commonly
    used programming languages in the world (Lutz 2013). One reason for this popularity
    is Python’s flexibility; it can support object-oriented, functional, or good old
    procedural, do-this-then-that programming paradigms. More important, though, are
    some of the explicit design features of Python that make it a language focused
    on code quality, developer productivity, portability between operating systems,
    and integration with Python tools and other languages. In other words, you can
    quickly write Python code that is powerful; easily readable; works unchanged on
    Mac OS, Windows, and Linux; and hooks in easily with a variety of tools. This
    design philosophy is made explicit in “The Zen of Python” by Tim Peters (2004),
    which includes statements like “Readability counts” and “Simple is better than
    complex.” If you have Python installed, open a Python interpreter and type `import
    this`, and you can read “The Zen of Python” in its entirety. These kinds of ideas
    make Python not only a robust, powerful language able to fit a variety of needs,
    but an approachable language to learn, a great first language for programming,
    and a great tool for sharpening library work flows.


    ## History


    Python was created by Guido van Rossum while working at the Dutch research institute
    CWI (a Dutch acronym that translates as the Center for Mathematics and Computer
    Science) in 1989. Twenty years later, he wrote a series of blog posts detailing
    its history and development (Van Rossum 2009–2013). Named after Monty Python,
    an association that persists in the documentation as `spam` variables and several
    quick quips, it was originally coded mostly over the Christmas season to serve
    as a side project to “bridge the gap” between C and the shell to speed up development
    of system administration tools. Van Rossum based many aspects of the language
    on ABC, a language he had recently worked as a developer on, while taking cues
    from C and other more obscure languages. He worked with an explicit design strategy
    that emphasized speed of development, ease of use, readability, borrowing from
    others whenever possible, and making Python easily extendable.


    After initial development by Van Rossum and his colleagues, Python was released
    on the [alt.sources](http://alt.sources) newsgroup with an MIT license on February
    20, 1991. With encouragement from the community, Van Rossum continued to update
    the language, and in 1993 the [comp.lang.python](http://comp.lang.python) newsgroup,
    which persists to the present day, was started. In 1994, a major topic of conversation
    on the list was aptly titled “If Guido Was Hit by a Bus,” in which members of
    the community worried about the fate of the language given that Van Rossum continued
    to make many of the updates personally. Partially as a result of this thread,
    Van Rossum was invited to the United States to work with the National Institute
    of Standards and Technology in 1994. Amid these conversations of his hopefully-not-imminent
    demise and coming to America, Python 1.0 was launched, and in 1995 Van Rossum
    began work at the Corporation for National Research Initiatives, where several
    more major releases were launched. Simultaneously, during attempts to diversify
    Python development by forming a semi-official group to oversee development, Van
    Rossum was bestowed with the title of Benevolent Dictator for Life, signifying
    his continued last-say in all things Python (Lutz 2013).


    After the Python team did a stint with [BeOpen.com](http://BeOpen.com), a startup
    that failed in the dot-com bust, and Digital Creations, Python 2.0 was released
    in October 2000. In 2001, the Python Software Foundation was created to oversee
    and coordinate the further development of the Python language, and the foundation
    maintains the language to the present day. In 2008, Python 3.0, a major, backward,
    incompatible version, was released. Given the prevalence of Python 2, however,
    version 2.7 is being maintained alongside 3.0 and, although the change to the
    `print` command alone ensures that practically all 2.x programs will not work
    with 3.x, the community has made extensive efforts to make things work. Features
    in 3.x can be ported into 2.x using the `from __future__ import name_of_function`
    so that you can take advantage of the new features without having to completely
    refactor your code. In the spirit of Python, developers are focusing on flexibility
    and extensibility rather than on world domination.


    Moving from Van Rossum hacking it together in his basement to make his other job
    easier, Python is now maintained as an open-source project by a bevy of developers
    (these people and any especially skilled Python coders are affectionately called
    Pythonistas; code written in the general style of the Python community, meanwhile,
    is called Pythonic) with a large number of specialized implementations. The language
    is now used for applications from film to web development to scientific computing
    and, specific to this work, libraries. All of this makes for a vibrant community
    with tools to fit a wide range of uses.


    # Environment and Setup


    Setting up Python on a local machine will vary depending on the type of operating
    system being used. While Python can be installed and run on more than a dozen
    operating systems ([https://www.python.org/download/other](https://www.python.org/download/other)),
    initial instructions on three of the more common operating systems—Linux, Macintosh,
    and Windows—are included below.


    ### Linux


    Some version of Python, typically Python 2.7, is already included with a number
    of the popular Linux distributions, including Debian, Fedora, and Gentoo. However,
    not every installation will include a full set of features. If you want to use
    Python 3.0 or later, you will want to get it from your operating system’s package
    repository; on Ubuntu, that might look like `sudo apt-get install python3`.


    ### Macintosh


    As of Mac OS X Yosemite, Python 2.7 is included out of the box. It’s very straightforward
    to begin writing command line prompts from the Terminal, as Python commands can
    be entered from any directory. If you want a different version or Python is not
    installed, visit [https://www.python.org/downloads/mac-osx/](https://www.python.org/downloads/mac-osx/)
    and download the installer for the version of Python you want.


    ### Windows


    Unlike its UNIX-based counterparts, Windows does not ship with a version of Python
    installed. However, installation is typically quick and painless. Simply go to
    [Python.org](http://Python.org) ([https://www.python.org/downloads](https://www.python.org/downloads)/),
    decide which version you would prefer (it is generally advised to take the most
    recent release in either the 2.7 or 3 lines, unless you have a specific reason
    not to), and run the .exe file. This will install Python, the collection of modules
    known as the Python Standard Library, and the basic Python text editor IDLE. While
    you will almost certainly want to enhance the environment you create your code
    in with better text editors or more modules, this simple install is all you need
    to get up and running writing Python code.

