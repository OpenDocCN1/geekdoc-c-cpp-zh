    # 额外资源


    编辑者注：由于有很多可选项目，还有大量的在线选项，选择起来非常困难。以下项目源于个人经验、对评价持保留态度的审视，以及编写代码的同事的推荐。还有其他资源，例如常见的《傻傻
    way》（For Dummies）、O’Reilly 系列和 Head Start 系列，它们可能同样适用。视频（包括 YouTube 上的视频）提供了很好的技巧和编程示例，在线论坛和培训网站也是如此。然而，作为管理员，我们都知道要评估来源的质量。


    ## 通用资源


    - **Codecademy**: [`codeacademy.com`](http://codeacademy.com)。免费的交互式课程（尽管基于文本），用于学习
    `Python`、`Ruby`、`JavaScript`、`PHP`、`SQL` 和 `Java` 的基础知识。


    - **Code School**: [`www.codeschool.com/free`](https://www.codeschool.com/free)。学习
    `Ruby`、`JavaScript` 和 `SQL` 基础的免费课程。


    - **Coding Bat**: [`codingbat.com`](http://codingbat.com)/。`Java` 和 `Python` 的编程练习。与其说是教程，不如说是查看示例并确定其背后逻辑的地方。提供文本和视频指导。一旦你理解了它的设计，就是一个很好的来源。


    - **W3Schools**: [`www.w3schools.com`](http://www.w3schools.com)/。针对 `JavaScript`、`SQL`
    和 `PHP` 的免费教程和代码示例。


    ## 书


    ### 通用编程与编码


    - **Abraham, Nikhil. 2015. Coding For Dummies. New York: For Dummies.**: 专注于基于
    Web 的语言（`JavaScript`、`Ruby` 和 `Python`），这本书帮助读者理解语言之间协作时的互动以及各语言的特性。读者将构建一个真实的
    Web 应用程序。包含通过浏览器工具检查代码。需要基础术语知识，但它很好地解释了入门主题。提供了一个用于尝试教程、练习编程并接收输出的环境，并包含了“章末”挑战。`Codecademy`
    开发的在线练习有助于在练习时磨练编码技能并演示结果。


    - **Farrell, Mary E. 2007. Computer Programming for Teens. Boston: Cengage Learning.**:
    推荐用于对概念和基础编程主题进行有效解释。拥有良好的背景以及对概念和术语的理解将使得学习编程语言语法变得更容易。


    - **Martin, Robert C. 2008. Clean Code: A Handbook of Agile Software Craftsmanship.
    Upper Saddle River, NJ: Prentice Hall.**: 介绍了编码的最佳实践，包括有意义的命名、相关的注释、针对遵循者的格式化等项目。`Java`
    是示例中使用的语言，但这些指南适用于大多数语言。建议尽早阅读以遵循最佳实践。


    - **Sande, Warren, and Carter Sande. 2013. Hello World! Computer Programming for
    Kids and Other Beginners. 2nd ed. Greenwich, CT: Manning.**: 不仅仅是给孩子看的。指令易于遵循。虽然是为青少年编写的，但图像、类比和语言让读者专注于内容而非复杂的术语。将复杂的想法（如
    `variable nested loops`嵌套循环）转化为通俗易懂的语言。作者并不假设读者具备基本的技术知识。有用的功能是注释和附录，提供了 `Python
    2.x` 和 `Python 3.x` 之间的一些关键区别。章末提供练习。软件容易安装和访问。包含了对游戏开发的关注。提供了“测试你的知识”和“尝试一下”章节。


    - **Wang, Wallace. 2008. Beginning Programming All-in-One Desk Reference for Dummies.
    New York: For Dummies.**: 对计算机科学的良好概述，但本身并不教编程。它确实提供了多种语言的编程基础。由于书籍年代久远，示例将无法正常运行。讨论了重要的概念，包括编译、算法、调试、最佳实践等。进阶概念包括生物信息学、计算机安全和人工智能。


    - **Yelton, Andromeda. 2015. Coding for Librarians: Learning by Example. Chicago:
    American Library Association.**: 汇编了对管理员的采访，收集了如今图书馆中真实的可学习程序示例，这得益于那些学习编码来解决问题的管理员。


    - **Zelle, John. 2010. Python Programming: An Introduction to Computer Science.
    2nd ed. Portland, OR: Franklin, Beedle & Associates.**: 对通用理论计算机科学概念非常好的介绍，重点关注使用
    `Python 3` 作为首选语言解决问题。被评认为是对普通编程和特定的 `Python` 来说都是初者的优秀教材。示例较具有数学性，因此可能较学，但提供了关于可以实现的坚实示例。它没有一步步教
    `Python`。其他书籍提供了更好的 `Python` 编程。


    ### Python


    - **Severance, Charles R. 2013. Python for Informatics: Exploring Information.
    Seattle: CreateSpace.**: 免费且最好结合他的 Coursera ([coursera.com](http://coursera.com))
    课程一起使用。尽管标题如此，但它是以真实世界数据示例为背景的 `Python` 介绍。一本简洁且引人入胜的入门书。适用于 `Python 2.x`。


    - **Shaw, Zed A. 2015. Learn Python the Hard Way. [`learnpythonthehardway.org/book`](http://learnpythonthehardway.org/book)/.**:
    初学者的 `Python` 坚实概述。并不总是易于遵循，但提供了综合教程风格。


    - **Sweigart, Al. 2015. Automate the Boring Stuff with Python: Practical Programming
    for Total Beginners. San Francisco: No Starch Press.**: 针对 `Python` 编程新手的技能和概念，但不一定是绝对初学者。提供了通用编程概念的坚实背景。将内容拆成小块以便记忆。构建日常使用的工具。涵盖
    `Python 3`。


    ### Ruby


    - **Metz, Sandi. 2012. Practical Object-Oriented Design in Ruby: An Agile Primer.
    Boston: Addison-Wesley.**: 关于对象设计的坚实论述。以 `Ruby` 为背景，但内容可以扩展到其他对象语言。对于绝对初学者来说可能太多，但一旦掌握了
    `Ruby` 的基础，非常值得读。


    - **Pine, Chris. Learn to Program. 2nd ed. Frisco, TX: Pragmatic Bookshelf.**:
    `Ruby` 编程的良好介绍。


    ### JavaScript


    - **Free Code Camp**. [`www.freecodecamp.com`](http://www.freecode.com)/. 练习 `JavaScript`
    的免费在线资源。


    - **Myers, Mark. 2014. A Smarter Way to Learn JavaScript: The New Approach That
    Uses Technology to Cut Your Effort in Half. Seattle: CreateSpace.**: 为 `JavaScript`
    基础提供了坚实的基础，特别是许多“初级”书籍忽略的最基础内容。用易于遵循的语言编写，设计良好。提供了一个沙盒环境来练习示例。互动性极强。示例非常多。


    - **Zakas, Nicholas C. 2014. The Principles of Object-Oriented JavaScript. San
    Francisco: No Starch Press.**: 在某些基础的基础上构建，因为它完全适用于 `JavaScript` 的对象特性。解释非常清晰。


    ### Perl


    - **Christiansen, Tom, Brian D. Foy, Larry Wall, and Jon Orwant. 2012. Programming
    Perl: Unmatched Power for Text Processing and Scripting. 4th ed. Sebastopol, CA:
    O’Reilly Media.**: 被认为是 `Perl` 之书。不作为初学者书籍，但在具有编程经验后是第二阶教材。


