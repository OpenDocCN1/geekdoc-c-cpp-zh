  trans: "\n\njQuery 灵活且精确地选择网页中对象的能力，以及轻松地为它们添加事件处理程序，这仅仅是其真实实力的一角。jQuery 在处理跨浏览器兼容性问题方面也表现出色（jQuery\
    \ Foundation n.d.-c）。也就是说，并不是所有浏览器对 JavaScript 的解释方式都是相同的。它们在导航文档对象模型（DOM）中的节点的方式，或者允许\
    \ JavaScript 与 DOM 交互的方式，可能存在细微差异。jQuery 的设计初衷是为了处理浏览器之间的细微差别，以便你的脚本的最终结果对用户来说保持相对的一致。\n\
    \n就像 jQuery 为选择对象提供了简写一样，jQuery 提供了提供了多种函数和方法（在网页元素上执行的命令），供 Web 开发人员使用，以便更快速地完成常见和复杂的任务。例如，在\
    \ Web 文档中可以通过设置位置或更改外边距设置来移动对象。然而，使用 jQuery，你可以直接使用 `.animate()` 方法（jQuery Foundation\
    \ n.d.-b）。对于 AJAX，jQuery 拥有一系列函数可以平滑浏览器支持差异并简化整个过程，如表 4.1 所示（jQuery Foundation\
    \ n.d.-a）。从更改元素属性到让网页文档对象出现或消失，一切操作都可以使用 jQuery 方法快速高效地处理。表 4.1 显示了许多 jQuery 方法中的几种。\n\
    \n### 表 4.1 jQuery 方法示例\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `.hide()` | 将 HTML\
    \ 元素设置为 `display:none`，使其消失 |\n| `.show()` | 让隐藏的 HTML 元素显示 |\n| `.attr()` | 查找或更改\
    \ HTML 元素属性的值 |\n| `.css()` | 查找或更改 HTML 元素的 CSS 属性 |\n| `.each()` | 遍历匹配的元素集合\
    \ |\n| `.val()` | 用于查找或更改 HTML 元素的值 |\n| `.html()` | 设置 HTML 元素的 `innerHTML` 值（允许你重写元素的\
    \ HTML） |\n| `.wrap()` | 使用另一个元素包裹所选的 HTML 元素 |\n| `.bind()` | 为 HTML 元素添加事件处理程序\
    \ |\n\n感谢 jQuery Foundation 提供\n\n使用这些方法，我们可以简化 JavaScript。以以下使用原生 JavaScript\
    \ 为识别出的 HTML 对象添加类的方法为例：\n\n```\ndocument.getElementById(\"topHeader\").setAttribute(\"\
    class\", \"green\");\n```\n\n通过采用 jQuery，我们可以使用 jQuery 选择器和方法实现相同的功能：\n\n```javascript\n\
    $(\"#topHeader\").attr(\"class\", \"green\");\n```\n\n为了进一步简化，我们不直接使用通用的 `.attr`\
    \ 方法，而是使用专门的 `addClass` 方法，如下：\n\n```javascript\n$(\"#topHeader\").addClass(\"\
    green\");\n```\n\n同样，这个让 div 消失的繁琐语句：\n\n```javascript\ndocument.getElementById(\"\
    hideThis\").setAttribute(\"style\", \"display:none\");\n```\n\n可以重写为：\n\n```javascript\n\
    $(\"#hideThis\").hide();\n```\n\n要为网页文档中的对象附加事件处理程序，或使用方法影响对象，该对象必须存在于网页文档中。这种语句听起来像是一个显而易见的观察，但事实上，它具有重大的影响，因为浏览器是从上到下读取网页文档的。换句话说，你需要在引用的对象之后将\
    \ JavaScript 方法引入网页文档中。这就是为什么一些开发者长期坚持认为，虽然大多数像 jQuery 这样的库应该添加到网页文档的 `head` 中，但其他\
    \ JavaScript 应该在关闭 `body` 标签之前添加。然而，jQuery 有一种更好的方法来处理这个问题，即使用 `.ready()` 函数（jQuery\
    \ Foundation n.d.-f）。\n\n你可以将网页文档的所有事件处理程序和方法封装在 `.ready()` 函数中（该函数作为事件处理程序附加到文档对象上），如下：\n\
    \n```javascript\n$( document ).ready(function() {\n  $(\"#push_this\").click(function(){\
    \ doSomething(); });\n});\n```\n\n现在，在文档框架就绪之前，事件处理器不会被引用，确保了事件处理程序有可以挂钩的内容。这是一种使用封装函数（称为闭包）来控制\
    \ JavaScript 作用域的通用方法（Johns n.d.）。闭包是一个比这里能提供的更多讨论的话题，但通过控制作用域而不是让脚本处于默认的全局作用域，编写整洁的\
    \ JavaScript 将变得更容易。闭包是处理 JavaScript 中存在的默认全局作用域的一种技术。\n\njQuery 让编写 JavaScript\
    \ 变得更容易，改进了跨浏览器兼容性，并使高质量的客户端脚本成为可能。对于任何希望尽可能无痛地编写高质量 JavaScript 的人来说，jQuery 库都是一个强大的工具。\n\
    \n## 示例\n\n这里有几个简单的脚本供读者入门。为了提供可以直接输入到读者文本编辑器并在 浏览器中测试的示例，JavaScript 在此处显示为内部（在\
    \ `script` 标签之间），而不是单独的文件。读者可以通过将这些示例键入到简单的文本编辑器（如记事本），将其保存为 `.html` 扩展的文件，并在浏览器中打开它们来轻松进行测试。不要使用\
    \ Word 或 Pages 等文字处理程序，因为它们会向网页代码添加特殊字符，可能会导致代码无法运行。读者可以根据自己的意愿复制和使用这些脚本。\n\n\
    ### 加两个数\n\n此脚本创建了两个提示框，每个框接受一个数字。在答案输出到警示框之前，会将数字相加。在调用提示框时使用 `parseFloat` 将它们通常捕取的字符串（纯文本字符）转换为浮点数，以便可以进行加法。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n<title>Add Two Numbers</title>\n</head>\n\
    <body>\n<script>\nfunction addThem(first, second)\n{\n      var answer=first+second;\n\
    \      alert(\"the answer is: \"+answer);\n}\n\nvar first = parseFloat(prompt(\"\
    Enter Your First Number\", 0));\nvar second = parseFloat(prompt(\"Enter Your Second\
    \ Number\", 0));\n\naddThem(first, second);\n</script>\n</body>\n</html>\n```\n\
    \n### 说出我的名字\n\n以下示例使用提示框接受用户名，然后向警示框中输出个性化消息。再次，脚本块使用函数，它接收提示框中的名称作为参数。然而，在这个示例中，我们将用户输入的“字符串”视为文本字符串，因此不需要像上一个示例那样将此输入转换为数值。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n<title>Say My Name</title>\n</head>\n\
    <body>\n<script>\nfunction myName(name)\n{\n      var message=\"Hello \"+name+\"\
    . We are sending you this message from earth orbit. Do not adjust your television!\"\
    ;\n      alert(message);\n}\n\nvar name = prompt(\"Please Enter Your Name: \"\
    );\n\nmyName(name);\n</script>\n</body>\n</html>\n```\n\n### 根据像素大小重定向到移动站点\n\n"
- fmt: "\nThis simple script uses a combination of screen pixel width and information\
    \ from the browser to send users to a mobile site if a mobile device is detected\
    \ accessing the site. A real mobile site URL must be substituted for `http://www.google.com`.\
    \ A number of interesting features are seen in this script. `screen.width` provides\
    \ the “width” property of the `screen` object in pixels. `window.location.assign()`\
    \ is one way to load a new web document from a specified URL. `navigator.userAgent`\
    \ is a string of information about your device that is communicated to the browser.\
    \ In this script we are searching this “user agent string” for “mob” to see if\
    \ there is an indication in this string that the device is mobile as a backup\
    \ to testing the size of the screen (especially important for high-resolution\
    \ devices).\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n<title>Mobile Redirect</title>\n</head>\n\
    <body>\n<h1>This is the desktop Site</h1>\n<p>Here is a paragraph of scintillating\
    \ information</p>\n<script>\nif (screen.width <= 799 || navigator.userAgent.indexOf('Mob')\
    \ != -1)\n{\n    window.location.assign(\"http://www.google.com\");\n}\n</script>\n\
    </body>\n</html>\n```\n\n(Bengtson 2012b)\n\n# Change Link Destination for Mobile\
    \ Device\n\nThis script uses a mechanism similar to the one above. Links that\
    \ have the class `mobile` assigned, and which have a URL to a mobile-friendly\
    \ alternate destination added as the `data-mobile` attribute in the HTML, will\
    \ have the link destination switched if the script detects that a mobile device\
    \ is accessing the site. This script requires `jQuery`. You should notice two\
    \ interesting things about this piece of web code. First, we are loading `jQuery`\
    \ into the web document via the first script tag from a Content Distribution Network.\
    \ This is an example of loading an external JavaScript file, and it will work\
    \ only on computers with Internet access. Secondly, unlike our other examples,\
    \ here we are adding our JavasScript in the head of the web document. As discussed\
    \ earlier, we can use the `jQuery` ready function to keep the event handlers from\
    \ being attached until after the web document has been populated.\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\" content=\"\
    text/html; charset=UTF-8\">\n<title>Smartlinks Document</title>\n<script src=\"\
    https://code.jquery.com/jquery-2.1.4.min.js\"></script>\n<script>\n$(document).ready(function(){\n\
    \    $(\"a.mobilev\").click(function(e){\n        e.preventDefault();\n      \
    \  var linkm=$(this).attr(\"data-mobile\");\n        var linkr=$(this).attr(\"\
    href\");\n        mobileswitch(linkm, linkr);\n    });\n    function mobileswitch(linkm,\
    \ linkr)\n    {\n        if ((screen.width <= 799)|(navigator.userAgent.indexOf('Mobile')\
    \ != -1))\n        {\n            window.location = linkm;\n        }\n      \
    \  else\n        {\n            window.location = linkr;\n        }\n    }\n});\n\
    </script>\n</head>\n<body>\n<h1>This is the desktop Site</h1>\n<p>Here is a paragraph\
    \ of scintillating information</p>\n<a class=\"mobilev\" href=\"http://thenormaldestination.com\"\
    \ data-mobile=\"http://themobiledestination.com\">Here Is My Link</a>\n</body>\n\
    </html>\n```\n\n(Bengtson 2012a)\n\n# Summary\n\nJavaScript is the language that\
    \ gives the web much of its dynamism, making it indispensable for libraries. Whether\
    \ you need to spice up your website, create complex web apps to serve a variety\
    \ of needs, or build web-based tools capable of communicating with data sources,\
    \ JavaScript provides you with a flexible toolbox to help you accomplish your\
    \ goals. As you build upon the basics in this chapter, keep in mind that the same\
    \ programming structures and (as you become more cognizant of it) object orientation\
    \ found in JavaScript will be present in other languages, including many of the\
    \ other languages covered in this book. JavaScript offers a practical way to begin\
    \ those skills.\n\n# Bibliography\n\n- Apache Software Foundation. n.d. “Apache\
    \ Cordova.” `https://cordova.apache.org`.\n- Apple. 2014. “JavaScript for Automation\
    \ Release Notes.” October 17. `https://developer.apple.com/library/mac/reasenotes/Interapplication/RN_JavaScriptAutomation/index.html`.\n\
    - Bengtson, J. 2012a. “The Art of Redirection: One Library’s Experiences from\
    \ the Deployment of Mobile Script.” `Journal of Librarianship` 12:191–98.\n- Bengtson,\
    \ J. 2012b. “Scaling into the Future. Smartlinks.” `Journal of Librarianship`\
    \ 12:378–83.\n- Bengtson, J. 2013. “What Is HTML5 and Do You Need to Know about?”\
    \ `Journal of Librarianship` 13:392–98.\n- Crockford, D. 2008. `JavaScript: The\
    \ Good Parts.` 1st ed. Farnham: O’Reilly Media.\n- Dahl, R. 2009. “Ryan Dahl:\
    \ Node.js Presentation.” November 8. `https://www.youtube.com/watch?v=ztspPYIY`.\n\
    - ECMA International. 2011. `ECMAScript Language Specification.` Edition 5.1.\
    \ Geneva: ECMA International. `http://www.ecma-international.org/publications/ECMA-ST/Ecma-262.pdf`.\n\
    - ECMAScript Wiki. n.d. “People Working on TC39.” `http://tc39wiki.wiki.org/about/people`.\n\
    - Flanagan, D. 2011. `JavaScript: The Definitive Guide.` 6th ed. Farnham: O’Reilly\
    \ Media.\n- Hess, K. 2012. “Discovering Digital User Behavior with Google Analytics.”\
    \ `CodeLib` 17. `http://journal.code4lib.org/articles/6942`.\n- Johns, M. n.d.\
    \ “JavaScript Closures 101—They’re Not Magic.” `http://www.javascriptkit.com/javatutors/closures.shtml`.\n\
    - jQuery Foundation. n.d.-a. “Ajax.” `http://api.jquery.com/category/ajax`.\n\
    - jQuery Foundation. n.d.-b. `animate()`. `http://api.jquery.com/animate`.\n-\
    \ jQuery Foundation. n.d.-c. “Browser Support.” `http://jquery.com/browser-support/`.\n\
    - jQuery Foundation. n.d.-d. “jQuery API.” `http://api.jquery.com`.\n- jQuery\
    \ Foundation. n.d.-e. `jQuery.noConflict()`. `http://api.jquery.com/jQuery.noConflict`.\n\
    - jQuery Foundation. n.d.-f. `.ready()`. `http://api.jquery.com/ready`.\n- JSHint.\
    \ n.d. “Documentation.” `http://jshint.com/docs`.\n- Mozilla Developer Network.\
    \ n.d. “Strict Mode.” `https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Strict_mode`.\n\
    - Mozilla Developer Network. 2014. “Rhino.” April 14. `https://developer.mozilla.org/en-US/docs/Mozilla/Projects/Rhino`.\n\
    - Pattern, D. 2012. “A Week on Summon.” Self Plagiarism Is Style. May 12. `http://www.daveyp.com/?p=1802`.\n\
    - Reidsma, M. 2012. “Guerrilla Analytics.” July 30. `http://matthew.reidsrow.com/articles/24`.\n\
    - Ruderman, J. 2014. “Same-Origin Policy.” December 9. `https://developer.mozilla.org/en-US/docs/Web/Security/Same-origin_policy`.\n\
    - Wood, C. M., B. Eich, J. Eames, A. Forst, A. J. O’Neal, J. Dance, and T. Caswell.\
    \ 2014. “JavaScript Jabber 124: The Origin of JavaScript with Brendan Eich.” September\
    \ 3. `https://devchat.tv/js-jabber/124-jsj-the-origin-of-javascript-with-brendan-eich`.\n"
  raw: 'This simple script uses a combination of screen pixel width and information
    from the browser to send users to a mobile site if a mobile device is detected
    accessing the site. A real mobile site URL must be substituted for [http://www.google.com](http://www.google.com).
    A number of interesting features are seen in this script. [screen.width](http://screen.width)
    provides the “width” property of the “screen” object in pixels. [window.location.assign](http://window.location.assign)()
    is one way to load a new web document from a specified URL. [navigator.userAgent](http://navigator.userAgent)
    is a string of information about your device that is communicated to the browser.
    In this script we are searching this “user agent string” for “mob” to see if there
    is an indication in this string that the device is mobile as a backup to testing
    the size of the screen (especially important for high-resolution devices).


    <!DOCTYPE html>


    <html>


    <head>


    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


    <title>Mobile Redirect</title>


    </head>


    <body>


    <h1>This is the desktop Site</h1>


    <p>Here is a paragraph of scintillating information</p>


    <script>


    if (screen.width <= 799 || navigator.userAgent.indexOf(''Mob'') != -1)


    {


         window.location.assign("[http://www.google.com](http://www.google.com)");


    }


    </script>


    </body>


    </html>


    (Bengtson 2012b)


    Change Link Destination for Mobile Device


    This script uses a mechanism similar to the one above. Links that have the class
    mobile assigned, and which have a URL to a mobile-friendly alternate destination
    added as the data-mobile attribute in the HTML, will have the link destination
    switched if the script detects that a mobile device is accessing the site. This
    script requires jQuery. You should notice two interesting things about this piece
    of web code. First, we are loading jQuery into the web document via the first
    script tag from a Content Distribution Network. This is an example of loading
    an external JavaScript file, and it will work only on computers with Internet
    access. Secondly, unlike our other examples, here we are adding our JavasScript
    in the head of the web document. As discussed earlier, we can use the jQuery ready
    function to keep the event handlers from being attached until after the web document
    has been populated.


    <!DOCTYPE html>


    <html>


    <head>


    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


    <title>Smartlinks Document</title>


    <script src="https://code.jquery.com/jquery-2.1.4.min.js"></script>


    <script>


    $(document).ready(function(){


         $("a.mobilev").click(function(e){


              e.preventDefault();


             var linkm=$(this).attr("data-mobile");


             var linkr=$(this).attr("href");


             mobileswitch(linkm, linkr);


         });


         function mobileswitch(linkm, linkr)


         {


              if ((screen.width <= 799)||(navigator.userAgent.indexOf(''Mobile'')
    != -1))


              {


              window.location = linkm;


              }


              else


              {


                   window.location = linkr;


              }


         }


    });


    </script>


    </head>


    <body>


    <h1>This is the desktop Site</h1>


    <p>Here is a paragraph of scintillating information</p>


    <a class="mobilev" href="[http://thenormaldestination.com](http://thenormaldestination.com)"
    data-mobile="http://themobiledestination.com">Here Is My Link</a></body>


    </html>


    (Bengtson 2012a)


    Summary


    JavaScript is the language that gives the web much of its dynamism, making it
    indispensable for libraries. Whether you need to spice up your website, create
    complex web apps to serve a variety of needs, or build web-based tools capable
    of communicating with data sources, JavaScript provides you with a flexible toolbox
    to help you accomplish your goals. As you build upon the basics in this chapter,
    keep in mind that the same programming structures and (as you become more cognizant
    of it) object orientation found in JavaScript will be present in other programming
    languages, including many of the other languages covered in this book. JavaScript
    offers a practical way to begin learning those skills.


