    # Chapter Nine


    ## C#


    Peter Tyrrell


    ## History and Development


    C# (pronounced See Sharp) is a language developed by Microsoft for programming
    with the .NET framework. .NET is a large body of instructions, methods, and libraries
    that reflect all the possible tasks you could ask a computing device to do in
    a Windows environment. .NET is at the heart of Windows itself, and of pretty much
    everything Microsoft has produced in the last decade: the SQL Server database
    platform, MS Office, Windows phones and tablets, Windows servers and desktops,
    websites and web applications, and so on. It is key to understand that C# is joined
    at the hip to .NET and is very rarely employed in isolation without it. As a librarian,
    you will likely use C# to create a dynamic website, a mobile app, a command line
    utility, an Office plug-in, or a software application intended for Windows.


    The history of C# is bound up in the story of the birth and maturation of Microsoft’s
    .NET framework (Hasan 2012). .NET took over from earlier frameworks that had been
    developed separately, for various purposes, and as such were silo-like. For example,
    around the time that .NET was invented in the late 1990s, the web was accelerating
    in importance, so naturally Microsoft released a framework to take advantage of
    that—it was called ASP, or Active Server Pages, and it was an early crack at a
    script engine. That is to say, you could make web pages that changed in reaction
    to user input, or that talked to a database and served up the results, unlike
    a static web page that was no more than its HTML.


    While ASP was a leap forward in what could be done with a web page, there were
    many limitations on its ability to interact with the host server. Server-side
    functions were fragile because multiple applications across Windows could have
    a dependency on a set of functions called a COM object. Only one version of a
    given COM object was allowed to be active at any one time, so it was all too easy
    for a programmer to introduce a minor change to a COM object that broke any number
    of applications. This was known colloquially as `DLL hell`, and I have personally
    seen, as a direct result, programmers shouting very bad words very loudly.


    .NET was created to solve problems of incompatibility and to do away with the
    heterogeneous, higgledy-piggledy nature of the programming landscape in the Windows
    environment. It presents a comprehensive and consistent interface to All Things
    Microsoft—mostly. Naturally, there are debates over the tiniest aspects of it,
    but on the whole, one can feel comfortable in the .NET cockpit writing Windows
    desktop software, an ASP.NET website, or a mobile phone app. .NET is the Swiss
    Army knife you must take with you into Microsoft’s vast realm.


    To C#, then. The reason C# was invented at all is not perfectly clear. Microsoft
    had a go-to language called Visual Basic, which you can still use to this day
    when programming .NET. The prevailing direction of .NET’s evolution in the current
    day is toward a much more generic platform to which you can bring the language
    of your choice on the operating system of your choice, even Mac and Linux. But,
    back in the year 2000, it was deemed necessary to invent a language that would
    reflect .NET’s philosophy and nature with a minimum of distortion, which could
    maximize the advantages and changes .NET brought to the table. It is also likely
    that corporate ego played a role, but we shall pass no judgement here on the desires
    of an organization to set the tone and guide the thoughts of those who would employ
    their tools.

