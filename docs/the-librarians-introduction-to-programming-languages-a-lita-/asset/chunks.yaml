  trans: "\nPython 在库中非常有用的应用之一，专门针对编目员或技术服务工作流，是使用 `PyMARC`——这是一个为了访问、创建和处理原始二进制\
    \ MARC 数据而编写的 Python 库。这个 `PyMARC` 库允许用户读取 `.mrc` 格式的 MARC 记录文件，从记录中提取字段或子字段，通过更改或删除它们来修改字段和子字段，并向记录中添加新字段。根据指定的标准和字段数据，你可以分析\
    \ MARC 数据并将报告写入文本文件中，这些报告可以用于批量清理项目的统计或错误分析。这种通过编程方式处理数据的能力可以节省大量时间。虽然像 `MarcEdit`\
    \ 这样的工具可以进行大量的批处理，但学习 `PyMARC` 既能提供更大的自由度，正如前面提到的，还允许在批处理脚本中调用，因此它可以成为你自动化流程中的众多工具之一。\n\
    \n# 优缺点\n\n如所述，选择 Python 作为首选编程语言有许多优势。Python 通常预装在大多数当前的操作系统中（Windows 除外），因此运行你的第一个脚本不需要太多的设置。对于在命令行界面工作的绝对初学者来说，起初可能不在\
    \ GUI（图形用户界面）环境中工作会让他们感到无畏，但这对任何语言都是如此，只要稍微接触一下基本操作所需的命令，这些恐惧很快就会消失。\n\n虽然 Python\
    \ 可用于执行非常复杂的工作流或构建复杂的框架，但它也允许初学者编写短而简单的脚本来产生强大的结果。通常手动执行需要几个小时的重复性、单调的任务可以在几秒钟内完成。此外，Python\
    \ 社区非常强大，他们创建了包并提供帮助，使得你可能遇到的任何问题可能已经有了答案，并附带了代码示例、语法说明以及一两个冷笑话。\n\nPython 的一个既是帮助也是阻碍的方面是它对大量空白的使用。换句话说，你缩进代码的方式改变了它的运行方式（`http://www.secnetix.de/olli/Python/block_indentation.hawk`）。Python\
    \ 不使用大括号或其他语法来表示嵌套代码块，而是使用行首的制表符或空格来区分代码块的开始和结束。例如，一组 if/else 语句可能看起来像这样：\n\n\
    ```\nif x == 1:\n    print \"x is odd\"\nelif x == 2:\n    print \"x is even\"\
    \nelse:\n    print \"I don't know what x is\"\n```\n\n这与其他许多编程语言不同，但 Python 高度重视可读性和让事情更易于人类。因此，虽然这需要一些适应时间并可能让你对着屏幕大叫，但从长远来看，语言的这一特性使得你的代码更具可读性且更容易维护。\n\
    \n初学者有时会遇到的另一个困惑是：在 Python shell 中直接运行 Python 命令（即提示符以 `>>>` 开头）与在提示符中使用 `python`\
    \ 命令和脚本文件名调用并运行完整的 Python 脚本之间的区别（此处为 Windows DOS 提示符）：`C:\\> python myPythonScript.py`。Python\
    \ shell 允许在使用之前检查函数的运行情况，或者在交互式环境中解决一些棘手代码。这是一个很有用的功能，但你的任何精妙代码都不会被保存，因此一旦你使用提示符解决了某个问题，务必将其移动到\
    \ `.py` 文件并保存，以便以后像上面所示使用。\n\n# 示例\n\n## 使用 Python 对馆品\n\nPython 擅长的一个领域是编写较短的脚本来自动化日常任务。例如，如果我们有一份来自供应商的馆品列表，并想将其与我们目录中的馆品进行比对，即使馆品数量较少，这项任务也会变得繁重。然而，通过\
    \ Python 我们可以快速编写一个脚本来自动化我们的任务，腾出时间去喝杯咖啡。\n\n```\nfrom_vendor = ['1234-5678',\
    \ '2345-6789', '3456-7890']\nfrom_catalog = ['1234-5678', '2345-6789', '3456-7890',\
    \ '1111-2222']\n\nfor issn in from_catalog:\n    if issn not in from_vendor:\n\
    \        print issn\n```\n\n这个示例演示了处理此任务的一种非常简单的方法。我们创建了两个变量 `from_vendor` 和 `from_catalog`，并将\
    \ ISSN 数字列表放入这些变量中（在 Python 中，方括号通常表示列表，直白来说就是一个用逗号分隔的数据点列表；此外，这些数据点可以是任何内容，因此\
    \ `['a', 'number', 3]` 是一个完全有效的列表）。之后我们使用 `for` 循环比较这两个列表。Python 的编写方式有时被称为“可执行伪代码”，因为该语言的语法比大多数编程语言更接近英语，这段代码可以给你一些思路。\n\
