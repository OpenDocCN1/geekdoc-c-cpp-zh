- fmt: "\n- By default, you should now be able to visit `http://localhost` in your\
    \ favorite web browser. If you get an error about connecting to the server, there\
    \ is a problem with the WampServer installation.\n- Download NetBeans with HTML5\
    \ and PHP from [https://netbeans.org/downloads](https://netbeans.org/downloads)/.\n\
    - Install NetBeans. There are no options during the NetBeans installation that\
    \ affect this tutorial.\n\nTo create a project that can be authored in NetBeans\
    \ and tested by WampServer, these programs need to be set up to operate on the\
    \ same files. WampServer’s default folder location is `C:\\Wamp\\www\\`, which\
    \ should be empty at this point. The test project will be called `my_project`.\n\
    \n- Create a folder in `C:\\Wamp\\www` named `my_project`.\n    - Select `Start`\
    \ > `Computer`.\n    - Select `Local Disk (C:\\)`.\n    - Select the `Wamp` folder.\n\
    - Click `New Folder` at the top of the screen.\n- Type `my_project` as the folder\
    \ name.\n- Launch NetBeans.\n- Select `File` > `New Project`.\n- Under the project\
    \ category section, select `PHP`, then `PHP Application` under `Projects` (figure\
    \ 6.1).\n- Click `Next`.\n- Name the project `my_project` (project names can have\
    \ spaces, but consistency never hurts) and set the `Sources` folder by browsing\
    \ to the newly created `my_project` folder at `C:\\Wamp\\www\\my_project\\` (figure\
    \ 6.2).\n- Leave the `PHP Version`, `Default Encoding`, and `Metadata` folders\
    \ to their default values and click `Next`.\n- The `Run Configuration` window\
    \ defines how the project should be deployed. When testing a project on a server,\
    \ the remote settings allow NetBeans to directly upload and download from the\
    \ server. For testing, debugging, and offline development, select `Run As Local\
    \ Web Site`. Use `http://localhost/my_project/` as the `Project URL` if it is\
    \ not already entered (figure 6.3).\n- Frameworks and Composer inclusions are\
    \ beyond the scope of this tutorial. Select `Finish`.\n\nThe `my_project` project\
    \ should now appear in the `Projects Pane` (figure 6.4). NetBeans is oriented\
    \ into panes that can be rearranged for your screen(s) and preferences. The panes\
    \ referred to in this tutorial include the `Projects`, `Files`, and `Editor` panes.\
    \ Should any of these panes be difficult to identify, select `Window` followed\
    \ by the name of the pane to toggle the visibility of the pane off and on.\n\n\
    ![](OEBPS/image/Figure_6.1.jpg)\nFigure 6.1. New project initiation.\n\n![](OEBPS/image/Figure_6.2.jpg)\n\
    Figure 6.2. New project setup.\n\n![](OEBPS/image/Figure_6.3.jpg)\nFigure 6.3.\
    \ New project run configuration.\n\n![](OEBPS/image/Figure_6.4.jpg)\nFigure 6.4.\
    \ NetBeans completed setup.\n\nTo test that NetBeans and WampServer are working\
    \ together, create a new file in `my_project` called `index.php`.\n\n- Select\
    \ `File` > `New File`.\n- Select `PHP File` under the `File Types`, then `Next`.\n\
    - Use `index` as the file name. NetBeans will append the `.php` extension automatically.\n\
    - Select `Finish`.\n\nIf NetBeans and WampServer have been configured correctly,\
    \ visiting `http://localhost/my_project` should yield a blank page without any\
    \ errors as shown in figure 6.5.\n\n![](OEBPS/image/Figure_6.5.jpg)\nFigure 6.5.\
    \ Configuration screen.\n\nUnlike traditional programming languages, PHP can be\
    \ previewed as quickly as the development environment can save the file. In other\
    \ words, PHP does not require the script to be compiled before the server can\
    \ accept files. The disadvantage is that all of the files related to the requested\
    \ page must be pulled into memory and compiled “live” each time the script is\
    \ requested. This leads to a major consideration: projects that require a significant\
    \ number of memory-intensive resources may perform faster with compiled languages,\
    \ such as Java. Applications that would not be ideal PHP candidates are those\
    \ that index large numbers of documents. “Large” cannot be accurately specified\
    \ as it depends on the actual production environment and the size of the documents;\
    \ however, given a library’s role as a data aggregator, this consideration is\
    \ significant. Convoluting the issue further, there are caching extensions in\
    \ PECL that minimize the frequency with which the server must recompile scripts.\n\
    \n### Speaking PHP\n\nIf PHP is treated like a language, it can be approached\
    \ as similar to learning a foreign language. The basic building blocks of any\
    \ language are nouns and verbs. If PHP were a written language, variables would\
    \ be nouns. Variables hold the information about who, what, when, where, and why.\
    \ Functions, statements, and operators are the verbs of PHP, while operators can\
    \ also serve the same role as adjectives. This comparison should not be held too\
    \ literally; however, it can be eerily helpful. Additionally, analogous to written\
    \ language, PHP syntax is equally arbitrary except that the sequence of words\
    \ has been mutually negotiated between the speaker (the code) and the listener\
    \ (WampServer) to avoid confusion. Examples are shown in table 6.1.\n\nTable 6.1.\
    \ Example of PHP Compared to English\n\n| English | PHP |\n| :--- | :--- |\n|\
    \ John is ten. | `$john = 10;` |\n| Mary is two more than John. | `$mary = 2 +\
    \ $john;` |\n| Close the door with your foot. | `close (\"door\", \"foot\");`\
    \ |\n| Say you’re sorry. | `echo \"You're sorry\";` |\n| What do you know about\
    \ Mary? | `$raw_results = $mysql_connection->query(\"SELECT age FROM people WHERE\
    \ name = 'Mary'\");` |\n\n- End each statement with a semicolon (`;`).\n- Strings\
    \ should be wrapped in single (`'`) or double (`\"`) quotes, like this.\n- Any\
    \ characters after two slashes (`//`) are ignored by the PHP parser and can be\
    \ used as in-line comments: `$a_complicated_variable; //this is a comment`.\n\
    - Comments can also be created by enclosing them between `/*` and `*/`:\n```\n\
    /* This style of comments\ncan span multiple lines and contain whatever\nmessages\
    \ developer fit */\n```\nOperators, functions, and statements (PHP’s verbs) can\
    \ perform a vast number of actions. The syntax of a function usually requires\
    \ something it acts on, which is included in parentheses. For example, `sort($vegetables)`\
    \ would perform the sort function on an array of vegetables, putting them in alphabetical\
    \ order. Operators are simple action verbs. There are a few operators that should\
    \ be familiar to their arithmetic counterparts:\n\n- `+` Add, combine, or join\n\
    - `-` Subtract\n- `*` Multiply\n- `/` Divide\n- `%` Modulus or remainder. `7%3`\
    \ is `1` because `3` goes into `7` twice with one remainder.\n- `.` (dot) Joins\
    \ strings. `echo $x . \"pesos\";` would output something like 30pesos.\n- `=`\
    \ Assignment. `$mary = 12` assigns the number 12 to the variable `$mary`.\n- `==`\
    \ Comparison operator. `3 == 1+2` returns true. This comparison is considered\
    \ “loose” because PHP will check to see if the values evaluate to be the same,\
    \ so `\"3\" == 3` returns true.\n- `===` Strict comparison operator. `3 === 1+2`\
    \ returns true. This comparison is considered “strict” because PHP will check\
    \ to see if the values are literally the same, so `\"3\" === 3` returns false\
    \ because `\"3\"` is a string and 3 is a number. NetBeans will warn developers\
    \ if they use loose comparison instead of strict comparison because, in almost\
    \ every situation, strict comparisons are more stable and work faster. The preference\
    \ for strict comparison over loose is also a best practice as it reduces the likelihood\
    \ of some security issues. PHP’s lack of strict data typing can make this operator\
    \ difficult to anticipate if a developer loses track of what types of variables\
    \ he or she is using.\n\n- `>`, `<`, `>=`, `<=` Greater than, less than, greater\
    \ than or equal to, less than or equal to, respectively.\n"
