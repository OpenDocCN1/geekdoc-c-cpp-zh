    - **Laravel Framework**: Laravel is a robust framework capable of fast delivery\
    \ of institution-scale web applications. This is not an introductory framework;\
    \ however, it provides prebuilt solutions to tough application scenarios. `https://laravel.com/`.\n\
    - **PHP Extension Community Library**: `https://pecl.php.net/`.\n- **PHP-FIG**:\
    \ A voluntary set of best practices that focus on interoperability of PHP applications.\
