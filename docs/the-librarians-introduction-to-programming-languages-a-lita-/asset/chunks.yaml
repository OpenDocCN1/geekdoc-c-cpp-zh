    ## Acknowledgments


    This book came to be through some circuitous events. The original editor needed
    to withdraw, and Marta Deyrup, editor for the LITA Guide series, put me in touch
    with Ron T. Brown, and we agreed to work as coeditors. After the original concept
    for the book was approved, Ron was offered a job in industry and accepted it.
    This new position kept Ron too busy to work further on the book. By this time,
    a few chapter authors had other commitments and I needed to recruit replacements.


    With the above said to set the stage, I want to offer my grateful thanks to Marta
    Deyrup for her confidence in me, Ron for guiding the concept of the book, and
    all my original authors who have hung in there for nearly two years. Many additional
    thanks to the amazing authors who stepped in at the near last minute to provide
    excellent chapters.


    ## Preface


    A Librarian’s Introduction to Programming Languages provides an overview of the
    most popular programming languages used in libraries, including practical examples
    that will help librarians get past the “I can’t do it” stage. We start with Python,
    Ruby, and JavaScript, which are considered the most readable and thus relatively
    easier-to-learn languages, which also have numerous applications. Perl, PHP, and
    SQL follow, as they are a bit trickier but incredibly useful. C, C#, and Java
    complete the book as compiled languages, with their own ins and outs, yet they
    have a number of important uses in libraries.


    While there are books and websites devoted to teaching programming, few works
    address multiple languages or provide library-specific examples. The audience
    for this book is composed of administrators, practitioners, students, educators,
    and other lifelong learners interested in computer programming.


    This book is designed to provide a basic working knowledge of each language, examples
    where the language is used in libraries, ideas of when a librarian would find
    each language useful, and small examples for practical experience. Recommended
    resources are provided for additional reading. The contributed-chapter format
    allows a wider spectrum of languages to be covered from a greater variety of experiences.


    On behalf of the contributors, I wish all readers the very best of luck in creating
    new programs for their personal and professional use or consulting with programmers
    to implement a new or redesigned technology. We offer our sincere hope that these
    chapters guide you to a lifelong enjoyment of programming regardless of your current
    level of skill. Happy programming!


    ## 1 Introduction


    Dean Walton


    ### History and Development


    Programming has come a long way from its beginnings to today. My first introduction
    to programming was using punch tape, the same tape that was used to deliver changing
    stock market prices. For those familiar with the classic 1960s sitcom The Adams
    Family, Gomez was always pouring over his ticker tape. The next major developments
    were punch cards and `Fortran` (`[http://www.fortran.com](http://www.fortran.com)`).
    With the advent of the personal computer, programming became accessible as a pastime
    for the masses.

