  trans: "\n图 7.4. `COUNT` 查询的输出。\n\n### 查找此集合中最流行的书籍\n\n在此查询中，我们将再次使用 `COUNT`，但这次我们统计的是借阅次数。我们将按照标题对输出进行分组，并按降序排列书籍，这样流行的书籍就会出现在列表顶部。\n\
    \n为了显示书名（这在输出中比项目编号更具可读性），我们可以使用 `JOIN` 函数。这允许我们利用数据内部的关系。每本书在 `checkouts` 表中通过一个唯一标识符列出，该标识符在\
    \ `books` 表的对应记录中也能找到，使我们能够将两个表连接起来。只要两个表中都存在我们预期的匹配值，我们就可以创建一个语句，为 `checkouts.csv`\
    \ 表中列出的每本书从 `books.csv` 中查找标题。恰好，`books.csv` 中的 `record_number` 与 `checkouts.csv`\
    \ 中 `item_number` 列中的的数值集是相同的，因此我们可以根据该维度进行 `JOIN`：\n\n```\nSELECT [youraccount].[table_books.csv].title,\
    \ COUNT([youraccount].[table_checkouts.csv].item_number) as checkouts\n    FROM\
    \ [youraccount].[table_books.csv] JOIN [youraccount].[table_checkouts.csv]\n \
    \   ON [youraccount].[table_books.csv].record_number = [youraccount].[table_checkouts.csv].item_number\n\
    \    GROUP BY [youraccount].[table_books.csv].title\n    ORDER BY checkouts DESC\n\
    ```\n\n输出请见图 7.5。\n\n![](img/Figure_7.5.jpg)\n\n图 7.5. `JOIN` 函数的输出。\n\n### 总结\n\
    \nSQL 是一种广泛应用于各种关系型数据库管理系统的标准。SQL 有许多不同的版本，包括 `MySQL`、`PostgreSQL` 和 `SQLite`。所有\
    \ SQL 版本的设计旨在允许与存储在数据库中的持久化数据进行交互。由于如此，SQL 通常与其他编程语言配合使用，这些语言通常有非常不同的优势。SQL 直观且易学习的语法使其在图书馆领域的业余和专业程序员中都广受欢迎。\n\
    \n### 参考文献\n\nAnthes, G. 2010. “Happy Birthday, RDBMS!” Communications of the\
    \ ACM 53:16–17.\n\nBiancuzzi, F., and S. Warden. 2009. Masterminds of Programming.\
    \ Sebastopol, CA: O’Reilly Media.\n\nChamberlin, D. D. 2012. “Early History of\
    \ SQL.” IEEE Annals of the History of Computing 34 (4): 78–82.\n\nCodd, E. F.\
    \ 1970. “A Relational Model of Data for Large Shared Data Banks.” Communications\
    \ of the ACM 13 (6): 377–87.\n\nConnell, R. S. 2013. “Content Management Systems:\
    \ Trends in Academic Libraries.” Information Technology & Libraries 32 (2): 42–55.\n\
    \nHowe, Bill, Garret Cole, Emad Souroush, Paraschos Koutris, Alicia Key, Nodira\
    \ Khoussainova, and Leilani Battle. 2011. “Database-as-a-Service for Long-Tail\
    \ Science.” In Proceedings of the 23rd International Conference on Scientific\
    \ and Statistical Database Management (SSDBM ’11), ed. Judith Bayard Cushing,\
    \ James French, and Shawn Bowers, 480–89. Berlin: Springer-Verlag.\n\nPreger,\
    \ R. 2012. “The Oracle Story, Part 1: 1977–1986.” IEEE Annals of the History of\
    \ Computing 34 (4): 51–57.\n\nSheldon, Robert, and Geoff Moes. 2005. Beginning\
    \ `MySQL`. Hoboken, NJ: John Wiley & Sons.\n\nVaish, Gaurav. 2013. Getting Started\
    \ with NoSQL. Olton, UK: Packt.\n\n### 推荐资源\n\nKriegel, Alex. 2011. Discovering\
    \ SQL: A Hands-On Guide for Beginners. Indianapolis, IN: Wiley.\n\n`MySQL 5.6\
    \ Reference Manual`. [`dev.mysql.com/doc/refman/5.6/en/index.html`](http://dev.mysql.com/doc/refman/5.6/en/index.html).\n\
