    where each Book has some basic metadata as child nodes, except id, which is an
    attribute of Book. Multiple authors are represented by repeated Author nodes.


    XPath can be used to query XML, but it’s awkward to implement in .NET. There is
    quite a difference in the following example between the functional but complicated
    XPath approach and the brevity of the LINQ version.


    var rawXml = @"


       <Catalog>


         <Book id=''book001''>


              <Author>Pilkey, David</Author>


              <Title>The Adventures of Captain Underpants</Title>


              <Genre>YA Fiction</Genre>


              <PublishDate>2013-04-30</PublishDate>


              <Description>George and Harold have created the greatest superhero in
    the history of their elementary school—and now they''re going to bring him to
    life!</Description>


         </Book>


         <Book id=''book002''>


              <Author>Albahari, Joseph</Author>


              <Author>Albahari, Ben</Author>


              <Title>LINQ Pocket Reference</Title>


              <Genre>Nonfiction</Genre>


              <PublishDate>2008-03-07</PublishDate>


              <Description>This guide has the detail you need to grasp Microsoft''s
    new querying technology, and concise explanations to help you learn it quickly.</Description>


         </Book>


       </Catalog>");


    // get authors via XPath


    var xml = new XmlDocument();


    doc.LoadXml(rawXml);


    XPathNavigator navigator = xml.CreateNavigator();


    XPathExpression authorQuery =


    avigator.Compile("/Catalog/Book/Author");


    XPathNodeIterator iterator = navigator.Select(authorQuery);


    var authors = new List<string>();


    while (iterator.MoveNext()) {


         authors.Add(navigator.Value);


    }


    // get authors via LINQ


    var xml = XElement.Parse(rawXml);


    var authors =


         from e in xml.Descendants("Author")


         select e.Value;


    The LINQ version is so much simpler! Quicker to write, easier to read. The XPATH
    version suffers from too many variables and a complicated multistep process. My
    eyes glaze over when I read it, and I’m the one who wrote it. The XPATH expression
    itself is not at fault, and indeed there are ways to work with XPATH within LINQ
    to XML, but in most cases you won’t even need to.


    SQL Example


    Two tables represent Books (table 9.1) and Authors (table 9.2), with a join table
    in between so books can be assigned multiple authors (table 9.3). Table 9.4 shows
    the BooksToAuthor result.


    Table 9.1. Book Information


    | BookId | Title | Genre | PublishDate | Description |


    | book001 | The Adventures of Captain Underpants | YA Fiction | April 30, 2013
    | George and Harold have created the greatest superhero in the history of their
    elementary school—and now they’re going to bring him to life! |


    | book002 | LINQ Pocket Reference | Nonfiction | March 7, 2008 | This guide has
    the detail you need to grasp Microsoft’s new querying technology, and concise
    explanations to help you learn it quickly. |


    Table 9.2\. Author Information


    | AuthorId | Name |


    | 1 | Pilkey, David |


    | 2 | Albahari, Ben |


    | 3 | Albahari, Joseph |


    Table 9.3. Books, Authors, and BooksToAuthors


    | Books | BooksToAuthors | Authors |


    | BookId | Id | AuthorId |


    | Title | BookId | Name |


    | Genre | AuthorId |  |


    | PublishDate |  |  |


    | Description |  |  |


    Table 9.4. BooksToAuthors


    | Id | BookId | AuthorId |


    | 1 | book001 | 1 |


    | 2 | book002 | 2 |


    | 3 | book002 | 3 |


    SQL Query Comparison: Native SQL


    Here is the select statement in Transact-SQL (T-SQL):


    SELECT


         b.BookId,


         b.Title,


         b.Genre,


         a.Name AS Author


    FROM


         Books b


    INNER JOIN


         BooksToAuthors b2a ON b2a.BookId = b.BookId


    INNER JOIN


         Authors a ON a.AuthorId = b2a.AuthorId


    WHERE


         [b.Title](http://b.Title) LIKE "LINQ%"


    The results of the select query are shown in table 9.5.


    Table 9.5\. Query Results


    | BookId | Title | Genre | Author |


    | book002 | LINQ Pocket Reference | Nonfiction | Albahari, Ben |


    | book002 | LINQ Pocket Reference | Nonfiction | Albahari, Joseph |


    Even though one book satisfies the query, the result is denormalized into two
    rows, one for each author association. It is possible to collapse the authors
    into a single row with SQL, but that requires some advanced trickery. Even were
    the authors to be concatenated together into the same column, they would become
    a single string value such as Albahari, Ben|Albahari, Joseph. That value is readily
    understood by the human eye as two joined subvalues, but a computer has no idea
    they are separate entities unless it is told to explicitly split them apart at
    the separator character. This isn’t an impossible task, just undesirable. The
    alternative is to take the two rows and write code to manually collapse them on
    the id value to accurately reflect the true nature of the data as a single title
    with multiple authors. Wouldn’t it be better if the query results already reflected
    that reality?


    SQL Query Comparison: LINQ


    The following LINQ statement is more or less equivalent to the SQL inner join
    above, but explicit join syntax is not actually required to get what we need in
    this case. The variable db represents the SQL database as an object and is assumed
    to have been defined already when configuring LINQ as part of an object-relational
    mapping (ORM) process. It therefore has knowledge of the SQL tables, column types,
    and relationships. There, in a nutshell, is much of the power of LINQ to SQL:
    instead of defining joins each time we write a query, we explain those relationships
    up front and reap the benefits with cleaner code thereafter.


    We create authors as a collection on the fly to group multiple authors together
    and to filter results to books that have authors.


    var books =


         from b2a in db.BooksToAuthor


         where b2a.Books.Title.StartsWith("LINQ")


         let authors = b2a.Authors.Name


         where authors.Any()


         select new CatalogBook


         {


              Id = b2a.BookId,


              Title = b2a.Books.Title,


              Genre = b2a.Books.Genre,


              Authors = authors


         };


    The result of the query will always be an enumerable* collection. In this case,
    the variable books contains a collection of CatalogBook objects because we create
    one for each item that matches the LINQ query.


    We could have created an anonymous dynamic object for each item and saved ourselves
    the trouble of having to define the CatalogBook type somewhere, but the advantage
    of using a strongly typed class like CatalogBook over an anonymous object is that
    we will always know what to expect when dealing with it. An instance of CatalogBook
    will have an Authors property that is an array of values, not sometimes an array
    and sometimes a single value. Foreknowledge is fore . . . er, power: we can continue
    to use CatalogBook elsewhere in our code, always with the same expectations, and
    never have to manually interpret or convert the results of the database query.


    There is another, subtler benefit to mapping database results immediately to a
    strongly typed object, which is that an error will occur at that point if database
    results do not conform to the object’s expectations. An error! Well yes—and that’s
    good. “Fail early, fail often” is advice that seems counterintuitive, but because
    errors can be trapped and dealt with in code, it is better to know exactly when,
    where, and how something has gone wrong as soon as possible. An issue allowed
    to slide will cause problems down the line, where it will be more difficult to
    diagnose and track back to its actual point of origin. “Enumerable” means that
    the collection can be looped through, as with the following foreach construction:


    foreach (var book in books) {


         Console.WriteLine(string.Format("{0}, {1}, {2}, {3}",


              book.BookId,


              book.Title,


              book.Genre,


              string.Join("; ", book.Authors));


         }


