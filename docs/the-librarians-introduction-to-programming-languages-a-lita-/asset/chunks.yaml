    One thing Josie learned was that, by default, any file or program you create has
    read-only permission. The file explicitly must be given file execute permission,
    allowing it to run. However, this is not true for Windows. Lisa showed her one
    way to do this:


    ```bash

    chmod 755 hello.pl

    ```


    and had Josie run the program:


    ```bash

    perl hello.pl

    ```


    It worked! This is what they saw:


    ```text

    Hello, world

