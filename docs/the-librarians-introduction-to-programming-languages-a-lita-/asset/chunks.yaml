    \ 'user_name');\n    $str_user_number = filter_input(INPUT_POST, 'user_number');\n\
    \    $str_user_msg = filter_input(INPUT_POST, 'user_msg');\n\n    //this will\
    \ test if the browser sent data\n    if($str_user_name !== null) {\n        //the\
    \ quote method sterilizes strings for database input\n        $connection->exec(\"\
    INSERT INTO user_messages SET user_name=\".$connection->quote($str_user_name).\"\
    ,\n            user_number=\".$connection->quote($str_user_number).\",\n     \
    \       user_msg=\".$connection->quote($str_user_msg).\");\n        echo \"Thank\
    \ you for your message\";\n    } else {\n        echo \"There was an error.\"\
    ;\n    }\n?>\n</body>\n</html>\n```\n\nThe above example is a demonstration of\
    \ how PHP can operate. In reality, a submission page would include CSS, images,\
    \ and additional HTML for the library’s branding. If this example evolved into\
    \ a more complete site with material, the number of lines of PHP versus the number\
    \ of lines of HTML could minimize its apparent impact. Given the ease of writing\
    \ and reading PHP, the importance of PHP can be deceptive. Look to conferences\
    \ built around PHP, Joomla, and MediaWiki to find groups that disagree. With PHP’s\
    \ easy inclusion in websites, it may be overlooked as an important language.\n\
    \n### Summary\nPHP is a widely used open-source scripting language. Frequently\
    \ employed for generating dynamic page content, PHP is compatible with most servers\
    \ and platforms. Overall, PHP is easy to learn, has lots of support available,\
    \ and can be used for many tasks.\n\n### Bibliography\n- `php.net`. 2015a. “PHP\
    \ Manual.” `php.net/manual/en/index.php`.\n- —— 2015b. “Vendor Specific Extensions.”\
    \ `php.net/manual/en/refs.database.php`.\n\n### Recommended Resources\n- **Drupal**:\
    \ Drupal is a powerful open-source content management system capable of managing\
