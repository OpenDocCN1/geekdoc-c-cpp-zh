    \ 中再次有一行输出，但它看起来不同了：`FFAPd a loyal`。Josie 得出正则表达式开头的 `s` 意味着替换，将 `loy` 替换为 `FAP`。但她问为什么\
    \ `loyal` 还是 `loyal`。Lisa 解释说，除非在正则表达式最后有 `g`（全局或所有匹配替换），否则第一个匹配项会被替换；在这种情况下，正则表达式看起来像这样：`s/loy/FAP/g`。\n\
    \n## 读取 MARC 文件\n\n根据 Josie 告诉 Lisa 关于 MARC 文件的信息，Lisa 设计了一个程序来读取 MARC 文件并以人类可读的格式显示数据。创建一个名为\
    \ `marcread.pl` 的文件，如下：\n\n```perl\n#!/usr/bin/perl\n# marcread.pl 为 MARC 文件提供人类可读输出\n\
    use strict;\nuse warnings;\n$/ = \"\\x1d\"; # 这个字符表示 MARC 记录的结束\nmy ($baseaddr,\
    \ $strptr);\nmy @marines;\nmy $marcfile = \"test..\";\nopen(MARCFILE, \"<\", $marcfile)\
    \ or die $!;\nmy $recnum = 0;\nwhile ($record = <MARCFILE>) {\n  chomp($record);\n\
    \  my $tagid = substr($record, 0, 3);\n  my $taglen = substr($record, 3, 2);\n\
    \  my $offset = substr($record, 5, 4);\n  my $tagdata = substr($record, 9);\n\
    \  printf(\"%s%s:%s:%s\\n\", $tagid, $taglen, $offset, $tagdata);\n  $recnum++;\n\
    }\nclose(MARCFILE);\nprint \"读取了 $recnum 条记录\\n\";\n```\n"
