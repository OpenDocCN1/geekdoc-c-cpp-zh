    \n我们可以对任何数量的字段执行操作。例如，由于我们知道编辑者，我们可以为她创建一个 700 个人名字段：\n\n```python\nnew_field_700\
    \ = pymarc.Field(\n    tag = '700',\n    indicators = ['1',' '],\n    subfields\
    \ = ['a', 'Thomsett-Scott, Beth C.']\n)\n```\n\n最后，我们想将这两个字段都添加到我们的记录中，并将该记录写入文件（正如本章提供的第一个示例所示）。\n\
    \n```python\nnew_record.add_ordered_field(new_field_245)\nnew_record.add_ordered_field(new_field_700)\n\
    with open('output.mrc', 'w') as f:\n    f.write(new_record.as_marc())\n```\n\n\
    这告诉 Python 使用 `add_ordered_field()` 函数按照字段编号将我们创建的两个字段添加到记录中，通过运行 `as_marc()`\
    \ 确保其格式正确，然后将记录写入名为 `output.mrc` 的文件。这样，我们就可以通过脚本程序化地创建一个 MARC 记录，该脚本可以快速升级，通过从\
    \ CSV 文件或其他数据源提取字段数据（即标题和作者），一次性创建数百条记录。创建此新简短记录的完整脚本汇总如下。\n\n```python\nimport\
    \ pymarc\n\nnew_record = pymarc.Record()\n\nnew_field_245 = pymarc.Field(\n  \
    \  tag = '245',\n    indicators = ['0','0'],\n    subfields = ['a', 'Programming\
    \ for librarians /',\n    'c', 'edited by Beth Thomsett-Scott.']\n)\n\nnew_field_700\
    \ = pymarc.Field(\n    tag = '700',\n    indicators = ['1',' '],\n    subfields\
    \ = ['a', 'Thomsett-Scott, Beth C.']\n)\n\nnew_record.add_ordered_field(new_field_245)\n\
    new_record.add_ordered_field(new_field_700)\nwith open('output.mrc', 'w') as f:\n\
    \    f.write(new_record.as_marc())\n```\n\n## 总结\n\nPython 是一种开源、简单、灵活的编程语言，用于从系统开发到\
    \ Web 开发的各个领域。这种语言以及使用它的充满活力的活跃社区非常看重代码的可读性和尽可能的直观性；清晰优于巧妙，开放优于隐藏。这促使社区发布了大量的开源代码，包括像\
    \ `PyMARC` 这样针对特定库的包，使得人们可以轻松完成任务，而不是重复造轮子。这些清晰的元素（它强烈鼓励你从一开始就编写编写良好、易读的代码）以及深度，使其成为非常适合学习的第一门编程语言，同时也成为用于大型复杂项目的一种强大且可扩展的语言。\n\
    \n## 参考文献\n\nLutz, Mark. 2013\\. *Learning Python*. 5th ed. Sebastopol, CA: O’Reilly\
    \ Media.\n\nPeters, Tim. 2004\\. “The Zen of Python.” August 19. [`www.python.org/dev/peps/pep-0020/`](https://www.python.org/dev/peps/pep-0020/).\n\
    \nReitz, Kenneth. 2011\\. “[0_urllib2.py](http://0_urllib2.py).” GitHub Gist.\
    \ [`gist.github.com/kennethreitz/973705`](https://gist.github.com/kennethreitz/973705).\n\
    \nVan Rossum, Guido. 2009–2013\\. The History of Python. [`python-history.blogspot.com`](http://python-history.blogspot.com)/.\n\
    \n## 推荐资源\n\nCode Academy. [`www.codecademy.com`](https://www.codecademy.com)/。许多自学编程者的首选起点，Code\
    \ Academy 的 Python 课程将向你介绍该语言的主要要点。此外，你可以查看它的 API 课程，了解 Python 如何与网络交互。\n\nHitchhiker’s\
    \ Guide to Python. [`docs.python-guide.org/en/latest/`](http://docs.python-guide.org/en/latest)/。这是一本自认为的带有偏好的学习\
    \ Python 的方法，该指南不仅关注学习语言，还关注如何编写 Pythonic 代码。利用官方的 Python 风格指南，这是像 Pythonista\
    \ 一样编写整洁、复用代码的绝佳资源。\n\nLearning Python the Hard Way. [`learnpythonthehardway.org`](http://learnpythonthehardway.org)/.\
    \ 可购买或免费在线阅读，它提供了一种学习 Python 的实用方法，以深思熟虑的节奏巩概念。这是熟悉语法和编程原则极极方法。\n\nLibrary Juice\
    \ (Python 课程)。图书馆专业人员职业发展服务定期提供入门课程。\n\n## 第三章：Ruby\n\nAshley Blewer 和 Jessica\
    \ Rudder\n\n### 历史与发展\n\n#### 什么是 Ruby，它与其他语言有何不同？\n\n既然我们已经定义了 Ruby，让我们快速回顾一下它的历史。在\
    \ 20 世纪 90 年代初，存在多种编程语言，从 `C`（一种广泛用于系统编程的低级语言）到 `Python`（功能与 Ruby 相似的语言）。与许多仅为了满足特定编程需求而开发的语言不同，Ruby\
    \ 的创建同时兼顾了功能性和美学目的。\n\nRuby 是由松本裕（俗称 `Matz`）在 20 世纪 90 年代中期设计的。尽管他熟悉 `Perl`，但\
    \ `Matz` 不认为它能够在生产环境中创建可靠、可维护的程序。他也了解 `Python`，但不认为它是真正的面向对象语言，这对他来说是一个非常重要的特性。据松本所说，“作为一个\
    \ 15 年的语言狂热爱好者和[面向对象的粉丝]，我真的想要一种真正的面向对象、易用的脚本语言。我寻找过但没有找到。所以我决定自己做一个” (Matsumoto\
    \ 1999)。\n\n松本还想创造一种编程起来令人愉悦的美语言。他认为大多数计算机语言为了减轻计算机的负担，而在编写代码的人施加了负担。这导致了编程变得异常困难。松本认为重点应该放在人而不是机器上，因此他的目标是创建一种让无论是初学者还是编程多年的人员都能享受编程的语言。为了实现这一目标，他根据以下三个原则设计了\
    \ Ruby：\n\n"
- fmt: "\n# Principle of Conciseness\nMatsumoto felt that computers should be able\
    \ to do a lot of work with very few orders. By requiring the computer to do more\
    \ heavy lifting (like figuring out variable types and handling memory management)\
    \ with fewer commands written by the programmer, it reduced both the memory and\
    \ time burden of writing code. To see this in action, you can compare a “Hello,\
    \ World” code from `Java`, a popular object-oriented language, and `Ruby`. In\
    \ `Java`, the code looks like this:\n\n```java\nclass HelloWorld {\n    public\
    \ static void main(String[] args) {\n        System.out.println(\"Hello World!\"\
    );\n    }\n}\n```\n\nIn `Ruby`:\n\n```ruby\nputs \"Hello, World!\"\n```\n\nBoth\
    \ sets of code produce the same result. The text Hello, World! will be printed\
    \ to the screen. The `Ruby` code is much shorter and easier for a programmer to\
    \ both write and understand.\n\n# Principle of Consistency\nRuby is said to follow\
    \ the principle of least astonishment (POLA), meaning it should behave in such\
    \ a way as to minimize confusion for people writing in it. `Ruby` is intended\
    \ to be as simple as possible, while remaining deep, in order to maximize ease\
    \ of use. `Ruby` isn’t meant just to be simple—`Ruby` is meant to be natural to\
    \ read, in the same way that noncomputer languages should be natural.\n\n```ruby\n\
    5.times do\n    puts \"Hello, World!\"\nend\n```\n\nEven someone without programming\
    \ experience can read the code above and have a good sense of what that code would\
    \ do if it were run.\n\n# Principle of Flexibility\nMatsumoto believed that languages\
    \ (including computer languages) were meant to express thoughts. Instead of restricting\
    \ human thought, the language should facilitate it. As such, `Ruby` was created\
    \ with a small, unchangeable core syntax and the ability to extend the language\
    \ as needed and desired throughout libraries. In contrast to `Python`, which emphasizes\
    \ there being “one right way” of completing a task, `Ruby` tries to provide many\
    \ approaches so that the developer can find one that fits him or her best. One\
    \ great example is the code for doing a task multiple times:\n\n1. `10.times do`\n\
    \   puts \"Ruby is flexible!\"\nend\n\n2. `(1..10).each { puts \"Ruby is flexible!\"\
    }`\n\n3. `for i in 1..10 do`\n   puts \"Ruby is flexible!\"\nend\n\n4. `1.upto(10)\
    \ { puts \"Ruby is flexible!\"}`\n\nThe result of the four examples above is the\
    \ same. In each case, the phrase Ruby is flexible! appears ten times. This flexibility\
    \ can be especially useful to people who are new to `Ruby` as it allows them to\
    \ approach the same problem from multiple angles.\n\nBeyond the theory behind\
    \ the language’s development, `Ruby` was influenced by `Perl`, `Smalltalk`, `Eiffel`,\
    \ `Ada`, and `Lisp`, other object-oriented programming languages. The syntax is\
    \ similar to `Perl`, and the semantics are similar to `Smalltalk`.\n\n# Environment\
    \ and Setup\nRuby comes packaged by default on Mac machines. Additional versions\
    \ of `Ruby` and other relevant programs can be installed using `HomeBrew` ([http://brew.sh](http://brew.sh)/),\
    \ a package manager for Mac operating systems. This package manager is built in\
    \ `Ruby`! If you are using a Windows machine, you will have to install `Ruby`\
    \ because it is not natively packaged. There is a project called `RubyInstaller`\
    \ that can help ([http://rubyinstaller.org](http://rubyinstaller.org)/) facilitate\
    \ this installation.\n\nTo start using `Ruby` immediately, you can open up the\
    \ Interactive Ruby Shell, or `IRB`. `IRB` comes packaged with `Ruby`, so it is\
    \ installed when `Ruby` is installed. The ability to get started quickly and to\
    \ start writing code immediately after the installation of the language is one\
    \ of `Ruby`’s strengths.\n\nThe `IRB` is a “shell” that allows you to safely write\
    \ and test `Ruby` code in your computer’s `Terminal`. On Macs, typing `irb` will\
    \ open it up on your screen. Typing `quit` will quit the program and take you\
    \ back to your regular `Terminal` screen. `Ctrl-D` will also quit the program.\
    \ To open up the `IRB` on a Windows machine, you can click Start and select Interactive\
    \ Ruby from your menu.\n\nYou can try out programming in `Ruby` by opening up\
    \ `IRB` and entering the following code:\n\n```ruby\nname = \"Ruby programmer\"\
    \nputs \"Hello, #{name}!\"\n```\n\nIn this mini program, `name` is a “variable,”\
    \ a type of storage location, which now contains the phrase “Ruby programmer.”\
    \ The second line tells `Ruby` to insert the contents of the variable `name` into\
    \ the phrase “Hello, _____!” and output the final phrase ”Hello, Ruby programmer!”\
    \ to the screen.\n\nWhen you exit the `IRB`, your code will disappear as well.\
    \ Instead of using the `IRB`, you can also write a `Ruby` program. Writing `Ruby`\
    \ in a text editor, such as `SublimeText`, `Atom`, or `TextWrangler`, and saving\
    \ it as an `.rb` file will create a `Ruby` script file. This file can then be\
    \ run on the command line by typing `ruby [filename.rb]` and hitting enter. Try\
    \ this out using the code from the `IRB` section above. You should see ”Hello,\
    \ Ruby programmer!” in your terminal after you run your file. Note that Microsoft\
    \ Word will not work as a text editor in this situation due to the extra information\
    \ it puts into files, which will cause the program not to run.\n\n`Ruby` is a\
    \ wonderful language that allows you to write programs quickly and efficiently.\
    \ Another excellent feature of `Ruby` is the concept of `gems`. `gems` are bundled\
    \ libraries of `Ruby` code that are easy to install and use in projects. Even\
    \ a large web framework, such as `Ruby on Rails`, is packaged as a `Ruby gem`\
    \ and can be downloaded and installed with only one line of code: `gem install\
    \ rails`. Anyone can create a gem and share it with the world through [RubyGems.org](http://RubyGems.org),\
    \ a gem hosting service for the Ruby community.\n\n# Uses\nRuby is most commonly\
    \ used in web development, and the `Ruby on Rails` framework is based on the Ruby\
    \ language. Smaller frameworks, including `Sinatra` and `Middleman`, allow dynamic\
    \ websites to be created easily and are powered by `Ruby`. `Ruby` is very effective\
    \ at powering the server side of websites, which allows your computer to connect\
    \ to a server that can deliver the data you need.\n\nBecause `Ruby` is natively\
    \ built into Macs and easy to install on Windows machines, it is useful for parsing\
    \ small data sets. For example, if you have a thousand records containing patron\
    \ data but you only need to access their email addresses, you can write a small\
    \ script that will take that data and export only the email addresses to a new\
    \ file for use in a newsletter.\n\nSeveral large frameworks used in library and\
    \ information sciences are based on Ruby. Project `Blacklight`, `Hydra`, and `Avalon`\
    \ are all built with `Ruby`; thus having even a basic knowledge of how `Ruby`\
    \ works will help with the installation, development, and maintenance of these\
    \ frameworks.\n\nProject Blacklight ([http://projectblacklight.org](http://projectblacklight.org)/)\
    \ is an open-source project that allows for access and discovery of library materials.\
    \ It runs on `Ruby on Rails` and works with `Apache Solr` to make searching library\
    \ collections easier. `Blacklight` is bundled as a gem that can then be used when\
    \ creating a new `Rails` instance.\n\nProject Hydra ([http://projecthydra.org](http://projecthydra.org)/)\
    \ is a digital repository with software components built as `Ruby gems`. `Hydra`\
    \ is used as a digital asset management framework as well as a framework for providing\
    \ access to digital collections. Like `Blacklight`, `Hydra` is bundled as a gem\
    \ that works with `Rails` and several other gems to create the digital repository.\n\
    \nAvalon Media System ([http://www.avalonmediasystem.org](http://www.avalonmediasystem.org)/)\
    \ is based on Project `Hydra` and is intended to handle a library or archive’s\
    \ digital audio and visual assets, and provide access to those assets via a web\
    \ interface. The project was created and is led by Indiana University Bloomington\
    \ and Northwestern University after being funded in part by a two-year grant from\
    \ the Andrew W. Mellon Foundation.\n"
