    Pros and Cons


    There are two sets of C# pros and cons to consider: C# and .NET as compared to
    other programming frameworks, and C# as compared to other languages within the
    .NET framework.


    C# and .NET versus Other Frameworks


    The choice of which programming framework or environment to work with is fundamental:
    that decision will color everything you do henceforth, from the tools used to
    write the software to the operating systems it can be deployed to. The framework
    will influence your design, the way you approach problems, and even the types
    of problems you are likely to encounter. The framework’s effects on the mind are
    subtle but deep, which is why frameworks tend to engender programming cultures.


    The nation of Java is an ocean away from the kingdom of .NET, though both lie
    many miles from that continent peopled by the land of Ruby on Rails, the hegemony
    of PHP, and the principality of Python. These countries and a small host of others
    all have their distinct borders, diehard patriots, and unending rivalries. One
    must take any criticism of a framework by a practitioner of another with a grain
    of salt. And, vice versa, a recommendation may be tinged with zeal by a true believer
    and must be viewed with some skepticism. I suppose it is human nature to argue
    vociferously the merits of one’s chosen group, but the truth when it comes to
    programming is that they are all more than adequate. You’re really not going to
    gain a noticeable performance advantage by choosing one over the other, unless
    you are programming for rocketry or nuclear medicine or something similarly specialized,
    and in that case, you would have already picked Fortran as the obvious choice
    for its strengths in mathematics.


    What does make sense is to choose the programming framework and language that
    you have ready access to, will run on operating systems you are familiar with,
    and that is supported and understood by people you can call on to help when help
    is needed. Not to mention you will probably invest years of your life in this
    decision—switching horses midstream is not advisable.


    The following are the questions you ought to ask yourself when making a framework
    decision:


    *   Can you get the editing tools you need easily set up on your computer?


    *   Or better yet, can you use the editor you already have and like?


    *   How easy is it to debug code you have written?


    *   Will you be required to compile your code into an assembly or executable,
    or will it run as a script, as is?


    *   Where are you going to deploy the thing you have made, and what does the target
    machine require to run it? A web application needs a complex web server stack,
    for instance, whereas a command line utility demurely wants a few humble requirements.


    C# and .NET Pros


    *   Well documented and widely written about, by both official and unofficial
    sources.'
