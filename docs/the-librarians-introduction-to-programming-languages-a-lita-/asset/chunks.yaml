    * **ANSI C**—Came into existence officially in 1989 and was the first attempt
    to create a more complete, standardized version of C so that it could begin to
    be used with the new fledging microcomputer home market. Up until this point,
    C was mostly for mainframe use.

    * **C99**—First finalized in 1999, its goal was to introduce a new collection
    of features that allowed for such things as in-line functions and variable-length
    arrays.

    * **C11**—Work on this version first began in 2007, but the first official specification
    was published in 2011. Much like the C99 iteration, this version of C sought to
    add more features to the language.


    It is fascinating to note that after more than forty years, C is still being actively
    expanded and improved. This is a testament to the ubiquity and usefulness of the
    language. What then about the descendants of C? Knowing that C is a general-purpose
    language useful for implementing UNIX, what were its progeny, and when did they
    first begin? A comprehensive look would take volumes, but here are some of the
    highlights:


    * **C++**—An extension of C that introduced a programming paradigm called object-oriented
    programming; the specification of this was first released in 1983.

    * **C#**—Pronounced as if it were a music note: C-sharp. It can be seen as a progression
    of both C and C++, developed by Microsoft to be utilized on its proprietary .NET
    platform. It was first released in 2000.

    * **Objective-C**—A slight extension of the C language heavily used by Apple for
    the OS X and iOS operating systems, also first seen in 1983.

    * **Python**—Quite often Python is the language of choice for those interested
    in learning to program, especially in the past few years. It is a language built
    on top of C whose primary aim is to create code that is human readable and can
    encapsulate very complex operations in short snippets of code. Python was first
    introduced in 1991. Having a good understanding of C allows a coder to really
    appreciate the beauty and complexity that Python programs are capable of.


    ## Uses

    As mentioned above, the initial use of C was to implement the UNIX operating system.
    As time progressed, C demonstrated that it is very useful for writing all sorts
    of applications (Klemens 2014). C requires a large amount of understanding from
    the programmer who chooses to use it. The language doesn’t provide a completely
    structured environment where all modules/libraries are interactively included
    when needed. However, not all C use is esoteric or operating system specific.
    One interesting field where knowledge of C is handy is with the Arduino microcontroller
    (Purdum 2006). The Arduino is a miniature, credit-card-sized board that has been
    one of the key components of the recent makerspace trend.


    Figure 8.1 shows a modern Arduino board known as Yun. Its defining feature is
    that it has built-in Wi-Fi. The paper clip is to demonstrate scale. An Arduino
    is a device that lets you make hardware devices that interface with your computer
    through a variety of different components attached to the board (Purdum 2006).
    Think switches, buttons, LCD displays, and infrared emitters as possible components.
    These sensors are plugged into the series of black plugs. The code you write for
    the Arduino is more or less a flavor of C.


    ![](OEBPS/image/Figure_8.1.jpg)


    Figure 8.1. Yun, an Arduino board.


    ## Pros and Cons

    A programming language can’t really enjoy a forty-year lineage without have some
    endearing qualities. On the downside, these good qualities are pretty specific.


    ### Pros

    #### Fast and Utilizes Hardware Well

    The primary and obvious benefit to using C is that it utilizes the computer/machine
    it is working on very well. Thus, you can find C programs running on embedded
    systems that are running UNIX or some variation of it, such as Linux. The Internet
    router in your home is most likely running a version of Linux on a low-powered
    processor. Sending out radio waves through the Wi-Fi antennas is probably made
    possible by some sort of C code. OpenWrt, a popular after-market operating system
    for home routers, is a version of UNIX that ships with utilities written in C
    (Kernighan and Ritchie 1978). OpenWrt is the operating system powering the LibraryBox,
    which is a stand-alone Wi-Fi-powered file-sharing outpost.


    #### Extensive Support and Existing Products

    Since C has been around for so long, chances are there is a library already written
    that your program can us. For example, if you are writing some software that uses
    cryptography, you can utilize a library called `cryptlib`, which is written in
    C and can perform all of the complicated math you will ever need. In fact, many
    open-source applications are compiled C products. For example, OpenSSL, a software
    package used to secure the HTTPS traffic in your web browser, is a C program.


    #### C Is Ubiquitous

    Although you may code and create programs in other languages, the underlying compiler
    that the language uses might in fact be written in C. As mentioned earlier, the
    Python programming language is itself an offshoot of C. With a little bit of work,
    it is possible to compile a Python program to a corresponding C program, which
    quite often is done so the code runs quicker. Consider also the extremely popular
    and ubiquitous web language PHP. The underlying software used to interpret the
    language is a platform called `Zend Engine`, which is written in C.


    ### Cons

    #### Integration into a Web Environment

    Most budding coders today are interested in creating web-based services. Thus,
    the most popular form of development these days seems to be making apps that are
    accessed via a web browser. Unfortunately, C does not lend itself well to this.
    If pressed, you could utilize a Common Gateway Interface (CGI) program where a
    web server could render a web page and include the output of a C program in the
    final HTML (Oliphant 1997). While C is a possibility with CGI programming, Perl
    is often the language of choice for this kind of setup. Couple this with the idea
    that CGI web programming, in general, is never really a first choice for web developers
    (Dowling 2005). There are other, more reliable ways to generate dynamic web content;
    unfortunately, C isn’t well suited for this.


    #### GUI-Based Applications

    Since C was born on the UNIX command line, it is mostly capable of creating programs
    for the command line. If you’d like to create a desktop application to run in
    a GUI, you’ll need to spend some time learning how to use an external library
    that renders Windows in the interface. This could be something along the lines
    of `GTK+`. Contrast this, for example, with Visual Basic, which allows you to
    interactively draw widgets and forms and add code in a fluid, interactive process.


    ## Environment and Setup

