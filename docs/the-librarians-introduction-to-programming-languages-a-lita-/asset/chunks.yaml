    PyMARC for Batch Processing MARC Records


    For cataloging librarians, the PyMARC module is especially useful for batch processing
    sets of MARC records and automating technical services workflows. PyMARC can be
    downloaded by running the command pip install pymarc. You can find documentation
    on the PyMARC GitHub page at [https://github.com/edsu/pymarc](https://github.com/edsu/pymarc).
    PyMARC includes a number of core functions that allow you to extract, analyze,
    add, or remove fields and subfields in raw binary MARC record data. These core
    functions are somewhat divided by level of operation, such as file level, record
    level, or field level.


    For example, there are file-level functions that allow you to read in or write
    out a file of binary MARC records in .mrc format—the MARCReader() and MARCWriter()
    functions. Both of these functions require the name of a .mrc file as the parameter
    passed to the function, as follows:


    marc_recs_in = pymarc.MARCReader(file(''marc_input.mrc''))


    marc_recs_out = pymarc.MARCWriter(file(''marc_output.mrc'', ''w''))


    Note that the file parameter for the MARCWriter() function also needs the attribute
    ''w'' so that the specified file name is writable when it is created—meaning that
    MARC records can be “written into” the .mrc file. There are additional, optional
    parameters that can be used with the MARCReader() function when reading in a file
    of MARC records which help to handle Unicode and MARC8 versus UTF8 issues, setting
    the parameters to_unicode and force_utf8 equal to true:


    marc_recs_in = pymarc.MARCReader(file(''marc_input.mrc''), to_unicode=True, force_utf8=True)


    At the record level, the most common functions involve one of three tasks:


    1.  Getting fields out of a record using record.get_fields([MARC_tag])


    2.  Removing a field from a record using record.remove_field([field_object])


    3.  Adding a field to a record using record.add_ordered_field([field_object])


    The get_fields() function accepts one or more MARC field tag numbers separated
    by commas and returns each instance of those fields in a list variable as PyMARC
    “field object” types. The remove_field() function takes a PyMARC field object
    as an argument and removes the matching object. And the add_ordered_field() function
    takes a field object that you would build up in your program and adds it to your
    MARC record.


    Field-level functions work in much the same way as record-level functions, except
    you are getting, setting, or deleting subfields from a field rather than fields
    from a record. The common field-level functions are:


    1.  Getting subfields out of a field using field.get_subfields([subfield_code])


    2.  Removing a subfield from a field using field.delete_subfield([subfield_code])


    3.  Adding a subfield to a field using field.add_subfield([subfield_code], [subfield_content])


    So consider that you wanted to add a placeholder record for this book until you
    get the chance to do some full-level cataloging on it. You would start by importing
    any module you might need, in this case pymarc, then creating a new record for
    our book. It will start as a blank “record object” to which we will add fields.


    import pymarc


    new_record = pymarc.Record()


    First, there is nothing special about naming it new_record. It could have been
    called Gryffindor and the program would run just as well, but it is generally
    good practice to name things in a way that describes what they are. Note that,
    since the Record() function comes from the pymarc module, we have to tell Python
    to get Record() out of there by prefacing it with pymarc.


    Next, we will create a new field to populate our record using the Field() function:


    new_field_245 = pymarc.Field(


         tag = ''245'',


         indicators = [''0'',''0''],


         subfields = [''a'', ''Programming for librarians /'',


               ''c'', ''edited by Beth Thomsett-Scott.'']


    )


    Here we just tell Python this is going to be a field. Then we give it some information
    about the field including the MARC tag number, indicator values, and a list of
    the subfields and their content. As in most programming languages, text strings
    are very literal, so notice that the punctuation must be included in the subfield
    content value in order to create the subfields according to standardized AACR
    rules ([http://www.aacr2.org](http://www.aacr2.org)/). The above Field() command
    creates the following 245 title field and assigns it to our variable called new_field_245:'
