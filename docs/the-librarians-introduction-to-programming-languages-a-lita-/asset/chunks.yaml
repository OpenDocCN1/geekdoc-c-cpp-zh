    91 substr($newmarcrec, 0, 5) = sprintf("%5.5d", $reclen);


    92 substr($newmarcrec, 12, 5) = sprintf("%5.5d", $baseaddress);


    93 return $newmarcrec;


    94 }


    “Wow, a bunch of new stuff here!” Josie remarked.


    Lisa started explaining. In line 17, we’re reading a line from the input file.
    Because of the logical sequence of how things happen in this program, we’ll be
    reading a line from the file in several places. There are several things we do
    each time we read a line in. To keep the program shorter and more readable, those
    steps have been moved to a subroutine, handledataline, located further on in the
    program. Then, each time we need that functionality, there is just one line, which
    calls handledataline, instead of several lines to accomplish the same thing. The
    parentheses ( ) at the end of handledataline indicate that it is a subroutine.
    When the code in the subroutine has run, the program continues running at the
    next line after the call to the subroutine, line 21 in this case (line 20 is all
    comment). Line 21 is an if statement with multiple conditions. The use of parentheses
    helps to group them as intended. Since and is used, both conditions need to be
    true for the entire if statement to be true and the code in the following curly
    brackets { } to be run.


    In line 23, the MARC record leader is copied into $leader, starting with the character
    at position four all the way to the end of $line. In other words, copy $line,
    except for positions zero through three. Then move on to the next input line by
    reading and preprocessing it. The while statement on line 29 makes sure that this
    line has data in it, as does line 21.


    Line 31 looks intimidating, but let’s figure it out. On the left is a list of
    two variables. The following equal sign, =, means we’re assigning values to them
    from the regex.


    “Wait a minute!” Josie interrupted. “I thought regexes resulted in a true or false
    value. And there’s no m or s in front.”


    “True,” Lisa continued.


    When there’s no letter in front of a regex, the m for matching is the default.
    Carefully looking at that regex, you can see two pairs of parentheses, ( ). Anything
    that matches the pattern inside them gets copied out. The result of the first
    pair gets stored in $tag, and the second goes into $tagcontents. With the caret
    or ^ we start matching at the very first position of $line. The \d by itself means
    to look for a single digit. The {3} right after overrides that a bit; it says
    to look for three digits. Since this looking-for-digits part is inside the parentheses,
    whatever matches goes into $tag. We know the . (dot) matches any character, but
    in this case, it’s the next twelve characters, due to the {12}. In the second
    pair of parentheses, the + means one or more, so here we are saying that we don’t
    care how many characters, nor which ones, so long as there is at least one. Since
    this part is inside the ( ), we put the remainder of $line, after the first fifteen
    characters, into $tagcontents.


    Lines 35 and 36 are seen by Perl as one line, and there’s nothing new there. The
    only new thing in line 37 is that there is a program variable in the regex, $subfdelim.
    This line is where the readable subfield formatting is changed back to the MARC
    format. Since the regex ends with the g, we will apply this transformation to
    all such format sequences in $tagcontent. Whenever there’s a space, a |, any single
    character, and another space, keep only that single character that identifies
    the subfield and put the MARC subfield delimiter character in front of it. In
    lines 42–44, we are taking the variable on the right and making it the new last
    element in the array on the left, pushing it to the end, so to speak.


    Skipping ahead a bit to line 54, we are making sure that each of those arrays
    are now empty and can be reused. Then, in lines 61–66, we see the simplest form
    of a subroutine. Basically, it’s a named block of code, inside the { }, that we
    can use at will from elsewhere in the program. Each time that is done, those lines
    of code are run, and the program continues with the next line of code after where
    the subroutine is called. And what does subroutine handledataline  do? Line 63
    has chomp, which is new to us. It’s commonly used, like here, to remove that \n
    from the end of a line. Additionally, in line 64, that and several other characters
    are removed from wherever they might occur in $line. That’s \t for the tab character,
    our friend \n the line feed character, \f for the form feed character, and \r
    for the carriage return character. These are characters we do not want in a MARC
    record. If this regex finds any of these (there’s the g for global at the end),
    it replaces them with nothing, effectively deleting them.'
