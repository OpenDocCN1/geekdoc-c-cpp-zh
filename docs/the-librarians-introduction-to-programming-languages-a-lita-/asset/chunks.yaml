    use autodie;\n\nmy $infile = \"test.read\";\nmy $outfile = \"test.unread\";\n\n\
    my ($line, $leader, $tag, $tagsize, $tagcontents, $newrec);\nmy $recctr = 0;\n\
    my (@tags, @tagdata, @taglen);\n\nmy $subfdelim = \"\\x1f\"; # MARC subfield delimiter\
    \ character\nmy $fdelim = \"\\x1e\"; # MARC field delimiter character\nmy $recdelim\
    \ = \"\\x1d\"; # MARC end-of-record character\nopen(OUTFILE, \">\", $outfile);\n\
    open(INFILE, \"<\", $infile);\nwhile ($line = <INFILE>)\n{\n    handledataline();\n\
    \    # last line in marcread format says: MARC records read: N\n    if (($line\
    \ ne '') and ($line !~ /^MARC/))\n    {\n        $leader = substr($line, 4);\n\
    \        $line = <INFILE>;\n        handledataline();\n    }\n\n    # after the\
    \ leader, get the rest of the record\n    while (($line ne '') and ($line !~ /^MARC/))\n\
    \    {\n        ($tag, $tagcontents) = ($line =~ /^(\\d{3}).{12}(.+)/);\n    \
    \    # undo subfield readability formatting; also perform indicator check\n  \
    \      if ($tag ge '010')\n        {\n            $tagcontents = substr($tagcontents,\
    \ 0, 2) . $subfdelim .\n            substr($tagcontents, 3, 1) . substr($tagcontents,\
    \ 5);\n            $tagcontents =~ s/ \\|(.) /$subfdelim$1/g;\n        }\n   \
    \     $tagsize = length($tagcontents) + 1;\n\n        # accumulate this record's\
    \ data\n        push @tags, $tag;\n        push @tagdata, $tagcontents;\n    \
    \    push @taglen, $tagsize;\n        $line = <INFILE>;\n        handledataline();\n\
    \    }\n\n    # if at end of logical MARC record write it out\n    if ($line eq\
    \ '')\n    {\n        $newrec = createnewrec($leader, \\@tags, \\@taglen, \\@tagdata);\n\
    \        print OUTFILE $newrec;\n        @tags = @taglen = @tagdata = ();\n  \
    \  }\n    if ($line =~ /^MARC/) {last;} # we *are* done\n}\nclose(INFILE);\nclose(OUTFILE);\n\
    \nsub handledataline()\n{\n    chomp $line;\n    $line =~ s/\\t|\\n|\\f|\\r//g;\
    \ # remove problematic characters\n    $recctr++;\n}\n\nsub createnewrec()\n{\n\
    \    my ($leader, $tagid_array, $taglen_array, $tagdata_array) = @_;\n    my @tagids\
    \ = @$tagid_array;\n    my @taglens = @$taglen_array;\n    my @tagdata = @$tagdata_array;\n\
    \    my @offsets;\n    my ($newmarcrec, $directory, $baseaddress, $idx, $reclen);\n\
    \    my $offset = 0;\n\n    # data starts after leader and tags directory\n  \
    \  $baseaddress = 24 + (scalar(@tagids) * 12) + 1;\n    # create the data directory,\
    \ and the record; get the record length\n    for ($idx=0; $idx<@tagids; $idx++)\n\
    \    {\n        $offset += $taglens[$idx-1] unless ($idx == 0);\n        $directory\
    \ .= sprintf(\"%3.3d%4.4d%5.5d\", $tagids[$idx], $taglens[$idx], $offset);\n \
    \   }\n    $newmarcrec = $leader . $directory;\n    for ($idx=0; $idx<@tagids;\
    \ $idx++) {$newmarcrec .= $fdelim . $tagdata[$idx];}\n    $newmarcrec .= $fdelim\
    \ . $recdelim;\n    $reclen = length($newmarcrec);\n    # update the leader; exit\
    \ and return the newly built MARC record\n    substr($newmarcrec, 0, 5) = sprintf(\"\
    %5.5d\", $reclen);\n    substr($newmarcrec, 12, 5) = sprintf(\"%5.5d\", $baseaddress);\n\
    \    return $newmarcrec;\n}\n```\n\n“Wow, a bunch of new stuff here!” Josie remarked.\n\
    \nLisa started explaining. In line 17, we’re reading a line from the input file.\
