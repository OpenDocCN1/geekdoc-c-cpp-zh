    ## Chapter Ten: Java


    Amanda Cowell


    ### History and Development


    `Java` is a class-based object-oriented programming language developed with the
    tagline “write once, run anywhere” (WORA), meaning that it is platform independent
    and its code can be compiled once and run on any platform. Other similar languages,
    such as `C++`, require a specific compiler for each platform. `Java` was also
    designed for simplicity and can automatically manage the creation and deletion
    of memory, which reduces coding errors. While `Java` is widely used for Internet
    applications, it was actually not created with online applications in mind. `Java`
    was initially created for embedded applications inside household electronics,
    such as microwave ovens and dishwashers. Many different brands of appliances need
    the same software capabilities but use different hardware. That is why platform
    independence became so important. As the web grew in popularity, it was discovered
    that `Java`’s portability was ideal for online environments as well. Today, despite
    being an older language, `Java` has maintained its popularity and is the main
    platform used in developing applications for Android mobile devices.


    `Java`, initially called `Oak`, was developed in 1991 by Sun Microsystems. It
    was created as part of something called the Green Project. The goal of Sun’s Green
    Project was to create a portable programing language that could be run on multiple
    operating systems without having to recompile the code. At the time of `Java`’s
    development, most large-scale programs were being developed in `C++`. `C++` requires
    a compiler for each platform. A new solution was needed to create software that
    could be embedded in consumer electronics (Schildt 2011). There were five primary
    goals for the development of `Java`:


    - Simple, object oriented, and familiar

    - Robust and secure

    - Architecturally neutral and portable

    - High performing

    - Interpreted, threaded, and dynamic


    (Oracle 1997).


    `Java` was released to the public in 1995, around the same time that the Internet
    was growing. It soon became apparent that the same cross-platform issues plaguing
    embedded code would also be a problem for code developed to run on the Internet
    due to hardware, browser, and operating system incompatibility. `Java` naturally
    developed into the programming language most used for Internet applications (Schildt
    2011).


    In 1999, Sun Microsystems released Java 2 Platform Micro Edition (`J2ME`) as a
    platform for mobile phones and other similar devices. There was not a great deal
    of interest in consumer applications for these devices at the time, and mobile
    phone hardware was not ready to support these types of applications. As mobile
    phones and other mobile devices grew in popularity and the hardware capabilities
    of these devices improved, `Java`’s ability to create content for these devices
    improved as well. In 2008, the first-generation Android phones were released and,
    by 2013, Android had 81.3 percent of the global smartphone market (Deitel, Deitel,
    and Deitel 2014). `Java` powers all of the applications running on all those devices,
    proving that despite its age, `Java` is still a powerful and important programming
    language.


    ### Uses


    While `Java` code is portable to any similar application, the process of packaging
    a Java application for deployment is very different depending on what type of
    application you are creating (Gassner 2011). For example, you do not package a
    mobile application the same as a desktop application or a web application. In
    most cases, the executables will still be `.jar` files, but they will be created
    and run differently. This means that code written to power one type of microwave
    oven will run on another microwave oven with different hardware, but it is unlikely
    to run on a web browser, or, likewise, an android app is unlikely to run on a
    microwave oven. Applications are still portable from device to device of the same
    type, but write once, run anywhere doesn’t quite mean what it used to.

