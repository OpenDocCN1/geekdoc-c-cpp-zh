  trans: "\n\n*   拥有庞大的从业者群体可以共同交流和分享信息。\n*   成熟：十五年的迭代发布意味着 `C#` 功能完备，且充满了许多省力的快捷表达式。\n\
    *   Windows 环境下的强有力选择：`.NET` 嵌入在每个 Windows 操作系统中。\n*   可以通过 Microsoft Azure 使用云服务器架构。\n\
    *   `.NET Core Framework`、用于构建 Web 的 `ASP.NET 5` 以及 `C#` 编译器 `Roslyn` 已于 2014\
    \ 年 11 月开源（Landwerth 2014）。\n*   由微软支持。\n*   微软拥有巨大的资源，并且对其编程框架的成功和采用有着深切的利益。\n\
    *   在过去的十年里，微软的开发者部门变得日益开放，并对从业者的响应更加迅速。\n\n在使用 `C#` 时，与某些完全由社区引导的开源框架相比，在解决问题时可选的方案和工具较少。初看这可能是一个缺点，但实际上是塞翁得福。通常情况下，这意味着对于某事有一种“正确”或至少是“最佳”的方法，而且这种方法通常由微软专业人士认证，而不是在无数意见以及重叠或冗余的工具中进行筛选和选择。民主是一件好事，但并不一定像仁慈的独裁那样高效。\n\
    \n## C# 和 .NET 的缺点\n\n*   在历史上与 Windows 绑定，尽管即将发布的版本将扩大对 MacOS、iOS、Linux 和 Android\
    \ 的支持。\n*   开发环境的复杂性以及初始设置的相对困难。\n\n## Visual Studio\n\n你的编程环境几乎不可避免地依赖于 `Visual\
    \ Studio`，这是由微软提供的集成开发环境（IDE）。它是一个强大的工具包，但其强大和复杂性可能会令人望而生畏。微软喜欢将 `Visual Studio`\
    \ 和 `.NET` 称为开发者“生态系统”，这应该让你对其巨大的规模和多样性有个概念。`Visual Studio` 是一个代码编辑器，对其包含的所有语言提供语法高亮和代码补全，此外支持\
    \ `CSS`、`XML`、`JavaScript` 以及其他资源。\n\n你编写的代码需要编译成程序集或可执行文件，这意味着你需要一个编译器。`Visual\
    \ Studio` 既是代码编辑器也是编译器。在技术上，没有 `Visual Studio` 编译代码是可能的，但那是一项相当高级的。\n\n一旦你的代码达到一定的复杂程度，调试（即通过步进当前运行的程序集或可执行文件的源代码，以观察正在发生的情况）就变得必要的。调试需要调试器，并需要投入一些时间学习如何有效地进行调试。`Visual\
    \ Studio` 是 `.NET` 代码作为调试器的唯一实际选择。\n\n`Visual Studio` 的好消息是，虽然专业版 `Visual Studio`\
    \ 每个许可证花费数百美元，但有一个名为 `Visual Studio Community Edition`（以前称为 `Visual Studio Express`）的免费版本。`Community\
    \ Edition` 可供个人开发者或为“非企业组织”工作的人员开发免费或付费应用。`Community Edition` 不像它的祖先 `Visual Studio\
    \ Express` 那样有功能限制，而且许可条款非常慷慨，因为“企业”被定义为拥有超过 250 台电脑或年收入超过百万美元的组织。即使在企业内部，`Community\
    \ Edition` 也可以用于贡献开源项目、学术研究或教学场景。\n\n## C# 与 .NET 内的其他语言的比较\n\n可以使用三十种语言来为 `.NET`（[`en.wikipedia.org/wiki/List_of_CLI_languages`](https://en.wikipedia.org/wiki/List_of_CLI_languages)）编程。除了使用最广泛的\
    \ `C#` 之外，著名的示例还包括以 `Managed JScript`、`IronRuby` 和 `IronPython` 形式存在的 `Javascript`、`Ruby`\
    \ 和 `Python`。\n\n`C#` 有许多技术特性比我们这里提供的空间更多，而且它们与其他语言相比是优点还是缺点在很大程度上取决于你个人的观点。可以说，`C#`\
    \ 拥有许多技巧和省力设备，可以帮助你简洁地表达意图，并有旨在防止你犯错的安全网。以下是一些功能列表，学习这些功能将使你进一步了解它们的努力有所回报：\n\n\
    *   强类型、匿名类型、类型安全\n*   面向对象，通过接口实现多重继承\n*   `LINQ`\n*   泛型 (`Generics`)\n*   Lambda\
    \ 表达式和函数式编程\n*   可空类型\n*   通过特性（attributes）进行元编程\n\n## 示例\n\n### LINQ\n\n`LINQ`\
    \ 代表语言集成查询（Language-Integrated Query）。它提供了一套查询和更新的模式，这些模式平滑并抽象了所处理的数据存储的特殊性。`LINQ\
    \ to Objects`、`LINQ to XML` 和 `LINQ to SQL` 是 `.NET` 框架默认提供的程序（Microsoft Developer\
    \ Network n.d.），例如 `LINQ to JSON` 和 `LINQ to ODATA`。\n\n`LINQ` 的优势在于这些模式相对容易学习，一旦掌握，就能为你提供一种处理各种数据源的标准方法。没有\
    \ `LINQ`，你被迫编写许多行辅助代码来支持你真正感兴趣的操作，并且你需要更深入地理解底层数据存储的反复。此外，`LINQ` 能够极大地简化原始语言中复杂混乱的语句——这对于\
    \ `SQL` 尤为如此（Albahari nd）。`LINQ` 节省了大量的时间脑脑。\n\n提到 `SQL`，你可能会发现 `LINQ` 运算符让你联想起\
    \ `SQL` 语法。这并不是因为我们一定在查询 `SQL` 数据库，而是因为了趋同演化：这些运算符是高效的表达式。尽管 `LINQ` 语法受到 `SQL`\
    \ 语言的影响，但无论底层数据源性质如何，它看起来都一样。\n\n### 需要的工具\n\n你需要 `LINQpad` ([`www.linqpad.net`](http://www.linqpad.net))\
    \ 或 `Visual Studio` IDE ([`www.visualstudio.com`](https://www.visualstudio.com))。\n\
    \n### LINQ to Objects\n\n`.NET` 框架中任何可枚举的对象都可以用 `LINQ` 进行操作。所有内置集合类都继承自 `IEnumerable`\
    \ 或 `IEnumerable<T>` 接口，任何人都可以编写一个具有相同功能的新集合。接口是一个模板，强制你向代码中添加其命名的方法或属性。例如，`IEnumerable`\
    \ 强制你添加一个 `GetEnumerator()` 方法。至于你如何编写该方法并让它像预期的那样返回 `IEnumerator` 对象，取决于你。接口只强制方法签名。\n\
    \n数组和列表是常用枚举集合的示例。我们通常使用 `foreach` 运算符来枚举它们，但我们也可以使用 `LINQ`，特别是当我们打算返回一个子集时。\n\
    \n```csharp\nstring[] array = new string[] {\"Chupacabra\", \"Sasquatch\", \"\
    Honest Politician\"};\n\n// 通过 foreach 加载 'rarities'\nvar rarities = new List<string>();\n\
    foreach (string item in array) {\n  if (item.StartsWith(\"Honest\")) {\n    rarities.Add(item);\n\
    \  }\n}\n\n// 通过 LINQ 加载 'rarities'\nvar rarities =\n  from item in array\n  where\
    \ item.StartsWith(\"Honest\")\n  select item;\n```\n\n`LINQ` 版本的优势可能并非显而易见，但：\n\
    \n*   它在一个语句中声明并设置了 `rarities` 变量，这在阅读代码时消除了对 `rarities` 用途的任何歧义。\n*   片段的整体目的更容易理解。`foreach`\
    \ 循环只告诉你将进行迭代，而没有告诉你迭代将实现什么，而 `LINQ` 的 `select` 运算符清晰地信号了语句的意图。\n\n### LINQ to\
    \ XML\n\n"
- fmt: "\nThe XML sample has a root `Catalog` node that contains multiple `Book` nodes,\
    \ where each `Book` has some basic metadata as child nodes, except `id`, which\
    \ is an attribute of `Book`. Multiple authors are represented by repeated `Author`\
    \ nodes.\n\nXPath can be used to query XML, but it’s awkward to implement in .NET.\
    \ There is quite a difference in the following example between the functional\
    \ but complicated XPath approach and the brevity of the LINQ version.\n\n```csharp\n\
    var rawXml = @\"\n<Catalog>\n    <Book id='book001'>\n        <Author>Pilkey,\
    \ David</Author>\n        <Title>The Adventures of Captain Underpants</Title>\n\
    \        <Genre>YA Fiction</Genre>\n        <PublishDate>2013-04-30</PublishDate>\n\
    \        <Description>George and Harold have created the greatest superhero in\
    \ the history of their elementary school—and now they're going to bring him to\
    \ life!</Description>\n    </Book>\n    <Book id='book002'>\n        <Author>Albahari,\
    \ Joseph</Author>\n        <Author>Albahari, Ben</Author>\n        <Title>LINQ\
    \ Pocket Reference</Title>\n        <Genre>Nonfiction</Genre>\n        <PublishDate>2008-03-07</PublishDate>\n\
    \        <Description>This guide has the detail you need to grasp Microsoft's\
    \ new querying technology, and concise explanations to help you learn it quickly.</Description>\n\
    \    </Book>\n</Catalog>\";\n\n// get authors via XPath\nvar xml = new XmlDocument();\n\
    doc.LoadXml(rawXml);\nXPathNavigator navigator = xml.CreateNavigator();\nXPathExpression\
    \ authorQuery = avigator.Compile(\"/Catalog/Book/Author\");\nXPathNodeIterator\
    \ iterator = navigator.Select(authorQuery);\nvar authors = new List<string>();\n\
    while (iterator.MoveNext()) {\n    authors.Add(navigator.Value);\n}\n\n// get\
    \ authors via LINQ\nvar xml = XElement.Parse(rawXml);\nvar authors =\n    from\
    \ e in xml.Descendants(\"Author\")\n    select e.Value;\n```\n\nThe LINQ version\
    \ is so much simpler! Quicker to write, easier to read. The XPATH version suffers\
    \ from too many variables and a complicated multistep process. My eyes glaze over\
    \ when I read it, and I’m the one who wrote it. The XPATH expression itself is\
    \ not at fault, and indeed there are ways to work with XPATH within LINQ to XML,\
    \ but in most cases you won’t even need to.\n\n## SQL Example\n\nTwo tables represent\
    \ Books (table 9.1) and Authors (table 9.2), with a join table in between so books\
    \ can be assigned multiple authors (table 9.3). Table 9.4 shows the BooksToAuthor\
    \ result.\n\n### Table 9.1. Book Information\n\n| BookId | Title | Genre | PublishDate\
    \ | Description |\n| :--- | :--- | :--- | :--- | :--- |\n| book001 | The Adventures\
    \ of Captain Underpants | YA Fiction | April 30, 2013 | George and Harold have\
    \ created the greatest superhero in the history of their elementary school—and\
    \ now they’re going to bring him to life! |\n| book002 | LINQ Pocket Reference\
    \ | Nonfiction | March 7, 2008 | This guide has the detail you need to grasp Microsoft’s\
    \ new querying technology, and concise explanations to help you learn it quickly.\
    \ |\n\n### Table 9.2. Author Information\n\n| AuthorId | Name |\n| :--- | :---\
    \ |\n| 1 | Pilkey, David |\n| 2 | Albahari, Ben |\n| 3 | Albahari, Joseph |\n\n\
    ### Table 9.3. Books, Authors, and BooksToAuthors\n\n| Books | BooksToAuthors\
    \ | Authors |\n| :--- | :--- | :--- |\n| BookId | Id | AuthorId |\n| Title | BookId\
    \ | Name |\n| Genre | AuthorId | |\n| PublishDate | | |\n| Description | | |\n\
    \n### Table 9.4. BooksToAuthors\n\n| Id | BookId | AuthorId |\n| :--- | :--- |\
    \ :--- |\n| 1 | book001 | 1 |\n| 2 | book002 | 2 |\n| 3 | book002 | 3 |\n\n###\
    \ SQL Query Comparison: Native SQL\n\nHere is the `select` statement in Transact-SQL\
    \ (T-SQL):\n\n```sql\nSELECT\n    b.BookId,\n    b.Title,\n    b.Genre,\n    a.Name\
    \ AS Author\nFROM Books b\nINNER JOIN BooksToAuthors b2a ON b2a.BookId = b.BookId\n\
    INNER JOIN Authors a ON a.AuthorId = b2a.AuthorId\nWHERE b.Title LIKE \"LINQ%\"\
    \n```\n\nThe results of the `select` query are shown in table 9.5.\n\n### Table\
    \ 9.5. Query Results\n\n| BookId | Title | Genre | Author |\n| :--- | :--- | :---\
    \ | :--- |\n| book002 | LINQ Pocket Reference | Nonfiction | Albahari, Ben |\n\
    | book002 | LINQ Pocket Reference | Nonfiction | Albahari, Joseph |\n\nEven though\
    \ one book satisfies the query, the result is denormalized into two rows, one\
    \ for each author. It is possible to collapse the authors into a single row with\
    \ SQL, but that requires some trickery. Even the authors to be concatenated together\
    \ into the same column, they would become a single value such as `Albahari, Ben|Albahari,\
    \ Joseph`. That value is readily understood by the human eye as two joined subvalues,\
    \ but a computer has no idea they are separate entities unless it is told to split\
    \ them apart. This isn’t an impossible task, just undesirable. The alternative\
    \ is to take the two rows and write code to manually collapse them on the id to\
    \ accurately reflect the true nature of the data as a single title. Wouldn’t it\
    \ be better if the query results already reflected that?\n\n### SQL Query Comparison:\
    \ LINQ\n\nThe following LINQ statement is more or less equivalent to the SQL inner\
    \ join above, but explicit join syntax is not actually required to get what we\
    \ need in this case. The variable `db` represents the SQL database as an object\
    \ and is assumed to have been defined when configuring LINQ as part of an object-relational\
    \ mapping (ORM) process. It therefore has knowledge of the SQL tables, column\
    \ types, and relationships. There, in a nutshell, is much of the power of LINQ\
    \ to SQL: instead of defining joins each time we write a query, we explain those\
    \ relationships up front and reap the benefits with cleaner code.\n\nWe create\
    \ authors as a collection on the fly to group multiple authors together and to\
    \ filter results to books that have authors.\n\n```csharp\nvar books =\n    from\
    \ b2a in db.BooksToAuthor\n    where b2a.Books.Title.StartsWith(\"LINQ\")\n  \
    \  let authors = b2a.Authors.Name\n    where authors.Any()\n    select new CatalogBook\n\
    \    {\n        Id = b2a.BookId,\n        Title = b2a.Books.Title,\n        Genre\
    \ = b2a.Books.Genre,\n        Authors = authors\n    };\n```\n\nThe result of\
    \ the query will always be an `enumerable` collection. In this case, the variable\
    \ `books` contains a collection of `CatalogBook` objects because we create one\
    \ for each item that matches the LINQ query. We could have created an anonymous\
    \ object for each item and saved ourselves the trouble of having to define the\
    \ `CatalogBook` type somewhere, but the advantage of using a strongly typed class\
    \ like `CatalogBook` over an anonymous object is that we will always know what\
    \ to expect when dealing with it. An instance of `CatalogBook` will have an `Authors`\
    \ property that is an array of values, not sometimes an array and sometimes a\
    \ single value. Foreknowledge is fore . . . er, power: we can continue to use\
    \ `CatalogBook` elsewhere in our code, always with the same expectations, and\
    \ never have to manually interpret or convert the results of the database query.\n\
    \nThere is another, subtler benefit to mapping database results immediately to\
    \ a strongly typed object, which is that an error will occur at that point if\
    \ database results do not conform to the object’s expectations. An error! Well\
    \ yes—and that’s good. “Fail early, fail often” is advice that seems counterintuitive,\
    \ but because errors can be trapped and dealt with in code, it is better to know\
    \ exactly when, where, and how something has gone wrong as soon as possible. An\
    \ issue allowed to slide will cause problems down the line, where it will be more\
    \ difficult to diagnose and track back to its actual point of origin. “Enumerable”\
    \ means that the collection can be looped through, as with the following `foreach`\
    \ construction:\n\n```csharp\nforeach (var book in books) {\n    Console.WriteLine(string.Format(\"\
    {0}, {1}, {2}, {3}\",\n        book.BookId,\n        book.Title,\n        book.Genre,\n\
    \        string.Join(\"; \", book.Authors));\n}\n```\n\n## Summary\n"
