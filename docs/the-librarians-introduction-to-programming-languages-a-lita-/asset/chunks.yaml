    \ further, rather than using the generic `.attr` method, we can use the specialized\
    \ `addClass` method, like so:\n\n```javascript\n$(\"#topHeader\").addClass(\"\
    green\");\n```\n\nSimilarly, this cumbersome statement for making a div disappear:\n\
    \n```javascript\ndocument.getElementById(\"hideThis\").setAttribute(\"style\"\
    , \"display:none\");\n```\n\ncan be rewritten as:\n\n```javascript\n$(\"#hideThis\"\
    ).hide();\n```\n\nTo attach an event handler to an object in a web document, or\
    \ to affect an object using a method, that object must be present in the web document.\
    \ Such a statement may seem like a trite observation, but, in fact, it carries\
    \ significant repercussions since browsers read a web document from top to bottom.\
    \ In other words, you need to introduce your JavaScript methods into the web document\
    \ after the objects they reference. That’s why some developers have long insisted\
    \ that, while most libraries like jQuery should be added in the head of a web\
    \ document, other JavaScript should be added at the bottom, just before the closing\
    \ body tag. jQuery has a much better way to handle this, however, using the `.ready()`\
    \ function (jQuery Foundation n.d.-f).\n\nYou can enclose all of a web document’s\
    \ event handlers and methods in the `.ready()` function (which is attached as\
    \ an event handler to the document object), like so:\n\n```javascript\n$( document\
