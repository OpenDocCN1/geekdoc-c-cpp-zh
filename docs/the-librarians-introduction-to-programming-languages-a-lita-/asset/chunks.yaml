    \n“哇，这里有很多新花样！”Josie 评论道。\n\nLisa 开始解释道。在第 17 行，我们正在从输入文件中读取一行。由于程序中执行操作的逻辑顺序，我们会在多个地方从文件中读取一行。在每次读取行时，我们都会执行几项操作。为了保持程序更短且更易读，这些步骤被移动到了子程序\
