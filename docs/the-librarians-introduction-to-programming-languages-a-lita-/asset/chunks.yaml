    \nSilberschatz, A., H. Korth, and S. Sudarshan. 2010. Database System Concepts.\
    \ Boston: McGraw-Hill.\n\nW3Schools PHP MySQL Database. [`www.w3schools.com/php/php_mysql_intro.asp`](http://www.w3schools.com/php/php_mysql_intro.asp).\n\
    \n# 第八章\n\n## C Tim Ribaric\n\n### 历史与发展\n\n`C` 是最持久的计算机编程语言之一。与其他在 20 世纪 70 年代创建的语言不同，`C`\
    \ 仍被活跃地用于许多应用程序。对比这种寿命，例如用 `FORTRAN` 编写的代码。许多拥有遗留系统的机构也拥有遗留系统。\n\n### C 的演变\n\n\
    `C` 是 `Ken Thompson` 和 `Dennis Ritchie` 工作成果，他们就职于 `AT&T 贝尔实验室`。在 1969 年至 1973\
    \ 年期间，`Thompson` 和 `Ritchie` 致力于开发一种重新实现 `UNIX` 操作系统的语言，这项工作最初使用一种名为 `B` 的语言。结果是巨大的成功，因为它允许\
    \ `UNIX` 使用硬件无关的语言 `C` 来编写。\n"
