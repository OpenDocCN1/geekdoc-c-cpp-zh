  trans: "\n上述内容依赖于 `JSON` 库以必要的方式修改数据，使其能够被 Ruby 读取。现在数据已经过修改，可以对其进行组织了。这里是我们可以做的一些简单操作：\n\
    \n```ruby\ndata[0]\n\n# 这将返回系列中的第一条推文\n\ndata[2][\"text\"]\n\n# 这将返回系列中第三条推文的内容\n\
    ```\n```\n\n如果我们想一次查看不仅仅是一条推文呢？我们可以遍历整个文本来提取出所需的信息。\n\n```ruby\ndata.each do |tweet|\n\
    \  p tweet[\"text\"]\nend\n```\n\n这将返回每个 `JSON` 对象的文本（即推文的“tweet”部分）。每条推文都包含大量的关联元数据，使用这种类似的方法可以收集到更有趣的信息，例如转发次数、地理数据、使用的标签或作者描述。\n\
    \n### 使用 Nokogiri 爬取网页\n\n什么是网络爬虫？网络爬虫是通过通过程序化地从互联网抓取数据，以便你可以在自己的应用程序中使用这些数据。`Nokogiri`\
    \ 是一个 Ruby 库，它可以让你轻松地从网页上爬取数据。它也是一种从各种来源持续获取数据并将其整合在一个处进行分析的简单方法。`Nokogiri`（源自日语单词“鋸”，锯子）是一个\
    \ HTML、XML、SAX 和 Reader 解析器。在 `Nokogiri` 的众多功能中，包含了通过 `XPath` 或 `CSS3` 选择器搜索文档的能力（[`www.nokogiri.org`](http://www.nokogiri.org)）。\n\
    \n要使用 `Nokogiri`，我们还需要 `Open-URI`。`Open-URI` 是 Ruby 中的一个模块，允许我们程序化地发送 http 请求。它允许我们通过命令行轻松地打开并解析\
    \ HTML 页的内容。\n\n你可以编写一个一次性执行所有操作的文件，也可以通过教程配合 `IRB` 逐步进行——记住，你可以通过 Mac 终端输入 `IRB`\
    \ 或在 Windows 机器的开始菜单中选择它来访问。在你的文件顶部，你需要 `require` 这两个库，以便你的程序知道它需要它们。这只需要在文本文档顶部添加以下代码行即可：\n\
    \n```ruby\nrequire 'nokogiri'\nrequire 'open-uri'\n```\n\n选择一个感兴趣的网站。在这个示例中，我们将使用美国国会的“访问图书馆”页面（图\
    \ 3.1）。一旦选定了页面，使用 `Open-URI` 打开该网站。我们这样操作：\n\n```ruby\nhtml = open([`www.loc.gov/visit`](http://www.loc.gov/visit))\n\
    ```\n\n屏幕上应该打印出一个临时对象。要用 `Nokogiri` 解析该数据，我们可以运行以下代码：\n\n```ruby\nnokogiri = Nokogiri::HTML(html)\n\
    ```\n\n这将该网站的内容显示在屏幕上。你看到我们在做什么了吗？我们正在声明一个变量并命名为 `nokogiri`（尽管你可以给它任何名字，就像上面的\
    \ `html` 变量一样）。\n\n![](img/Figure_3.1.jpg)\n\n图 3.1，“访问图书馆”（美国国会）。\n\n检查网页的 HTML，我们可以看到\
    \ Tours（行程）、Exhibitions（展览）和其他其他标题使用了 `h2` 标签。如果你想在不访问网站的情况下快速提取此列表，可以使用 `Nokogiri`。\n\
    \n现在我们已经将网站加载到变量 `nokogiri` 中，我们可以从网站中提取内容。这一行 `title = nokogiri.css('h2').text`\
    \ 将提取页面上所有的 `h2` 标签。由于代码中额外的空格，文本看起来会有些杂乱。Ruby 会清理这些数据。\n\n```ruby\ntitle = nokogiri.css('h2').collect\
    \ do |titles|\n  titles.text.strip!\nend\n```\n\n现在我们不仅拥有了想要的标题，还拥有许多 `nil` 标题。这是由于网站上杂乱的数据，这些标签内部没有任何内容。所有这些空白标签都返回了\
    \ `nil`。\n\n```\n[nil, nil, nil, nil, nil, nil, nil, nil, nil, nil, nil, nil,\
    \ nil, nil, nil, nil, nil, nil, nil, nil, nil, nil, \"Visiting the Library\",\
    \ \"Tours\", \"Maps & Floor Plans\", \"Dining\", \"Shopping\", \"Volunteer Opportunities\"\
    , \"Contact Visitor Services\", nil, nil, nil, nil]\n```\n\n我们也可以通过运行 `compact!`\
    \ 方法用 Ruby 快速清理。\n\n```ruby\ntitle.compact!\n```\n\n现在我们有了一个包含所有所需选项的数组：\n\n```\n\
    [\"Visiting the Library\", \"Tours\", \"Maps & Floor Plans\", \"Dining\", \"Shopping\"\
    , \"Volunteer Opportunities\", \"Contact Visitor Services\"]\n```\n\n这是一个非常简单的示例，但有很多方法可以使用\
    \ `Nokogiri` 爬取网页，然后用 Ruby 轻松地处理数据。你只需要将上面的示例和 `CSS` 替换为你自己的网站和你想要爬取的对象，就可以在你自己的网站上测试。网络爬虫对于不同页面具有重复数据结构的网站非常有用，类似于美国国会主题分类权威页面（[`authorities.loc.gov`](http://authorities.loc.gov)）。即使你更改在\
    \ `Open-URI` 中设置的 URL，你仍然可以使用它。\n\n### 总结\n\nRuby 是一种动态的、面向对象的开源编程语言，其目标是让编程变得简单愉悦。Ruby\
    \ 遵循的三个原则是简洁性、一致性和灵活性。\n\n### 参考文献\n\nMatsumoto, Yuki. 1999. “ruby-talk:0382.”\
    \ 6 月 4 日。[`marc.info/?l=ruby-talk&m=9639833724637&w=2`](http://marc.info/?l=ruby-talk&m=9639833724637&w=2)。\n\
    \n———. 2000. “The Ruby Language.” InformIT，6 月 12 日。[`www.informit.com/articles.aspx?p=18225&seqNum=2`](http://www.informit.com/articles.aspx?p=18225&seqNum=2)。\n\
    \n### 推荐资源\n\n#### 在线资源\n\n[HacketyHack.com](http://HacketyHack.com): [`www.hackety.com`](http://www.hackety.com)\n\
    \n[Learn.co](http://Learn.co): [`learn.co`](https://learn.co)\n\nLearn Ruby with\
    \ the Neo Ruby Koans: [`rubykoans.com`](http://rubykoans.com)\n\nTry Ruby: [`tryruby.org`](http://tryruby.org)\n\
    \nWhy’s (Poignant) Guide to Ruby: [`mislav.uniqpath.com/poignant-guide/`](http://mislav.uniqpath.com/poignant-guide/)\n\
    \n####籍\n\nBlack, David A. 2014. *The Well-Grounded Rubyist*. Greenwich, CT: Manning.\n\
    \nCooper, Peter. 2011. *Beginning Ruby: From Novice to Professional*. New York:\
    \ Apress.\n\nFernandez, Obie, and Kevin Faustino. 2014. *The Rails 4 Way*. Boston:\
    \ Addison-Wesley Professional.\n\nMetz, Sandy. 2012. *Practical Object-Oriented\
    \ Design in Ruby: An Agile Primer*. Boston: Addison-Wesley Professional.\n\nOlsen,\
    \ Russ. 2011. *Eloquent Ruby*. Boston: Addison-Wesley Professional.\n\nShaughnessy,\
    \ Pat. 2013. *Ruby under a Microscope: An Illustrated Guide to Ruby Internals*.\
    \ San Francisco: No Starch Press.\n"
- fmt: "\nUnderstanding JavaScript’s history is an important step in comprehending\
    \ the nature of the language. It was developed as a scripting language for web\
    \ browsers by the Netscape Communications Corporation in 1995. Infamously, the\
    \ original developer was given only ten days to design and code the entire language,\
    \ a language that faced the technical challenges of being embedded within HyperText\
    \ Markup Language (HTML) (Wood et al. 2014). In order to understand this complexity,\
    \ consider that HTML relies on angle brackets around its tags, such as `<body>`,\
    \ so even the use of the common mathematical symbols for greater than and less\
    \ than comparisons posed difficulties for the new language’s design. Given its\
    \ hasty development and the challenges faced, it is no surprise that JavaScript\
    \ has its share of oddities and outright errors. Despite this, JavaScript succeeded\
    \ and is actually one of the most used programming languages on the planet, lauded\
    \ by some for its expressiveness and innovative features.\n\nWhen Netscape developers\
    \ set about designing a scripting language for the browser, they wanted it to\
    \ be approachable, particularly for new programmers (Wood et al. 2014). The design\
    \ goals for the language focused on simplicity, making it possible to accomplish\
    \ tasks with small amounts of code, and not requiring compilation. Compilation\
    \ is the process of passing computer code to a “compiler” program that produces\
    \ a binary executable. JavaScript borrowed its ideas from existing languages,\
    \ such as `Scheme`, `HyperTalk`, and `Smalltalk`, rather than the more complex\
    \ compiled languages of the time, including `C` and `Java`. The name itself is\
    \ often a source of confusion: JavaScript bears no formal relation to `Java`.\
    \ Rather, the JavaScript name was a sort of marketing gimmick aimed to associate\
    \ the new scripting language with the popular `Java` language (Wood et al. 2014).\
    \ While the two do bear some surface similarities, they are in fact very different\
    \ in terms of both their philosophy and their use cases. In fact, while JavaScript\
    \ is the commonly known name, the language is standardized as `ECMAScript` after\
    \ the Ecma International organization, which presides over the standard. \n\n\
    JavaScript’s fate has been bound to that of web browsers, for better and worse.\
    \ Since JavaScript became used on websites across the globe shortly after its\
    \ release, it was difficult to correct the language’s initial defects. While other\
    \ programming languages can release new compiler or interpreter programs that\
    \ remove troublesome features or drastically alter their syntax, JavaScript’s\
    \ web-based nature makes its evolution arduous. Over time, web browsers developed\
    \ inconsistent, competing, and occasionally flawed implementations of the language.\
    \ With browsing as the language’s primary use, it is difficult to discern language\
    \ flaws from poorly designed browser features. After an initial set of updates\
    \ that ended with the third edition of `ECMAScript` published in 1999, the language\
    \ stagnated. A fourth edition was started but never completed due to disagreement\
    \ among the authoring committee (Wood et al. 2014). However, browsers also drove\
    \ the popularity of JavaScript and some of its most innovative uses.\n\nMicrosoft’s\
    \ Internet Explorer introduced what would become the `XMLHttpRequest` feature\
    \ in the late 1990s (Flanagan 2011, 491–94). This browser feature is the foundation\
    \ of so-called `AJAX` (an acronym for Asynchronous JavaScript and XML, though\
    \ non-XML data formats can be used) programming, a lightweight technique for pulling\
    \ data into web pages without requiring a full-page refresh. `AJAX` eventually\
    \ spawned an influx of innovative web applications written in JavaScript, such\
    \ as `Outlook Web App`, `Gmail`, and `Google Maps`. These dynamic applications\
    \ constantly refreshed their data and intelligently responded to user input, a\
    \ far cry from the set of interconnected but static documents that characterized\
    \ the early web of the 1990s.\n\nAs sophisticated web applications were popularized,\
    \ and Internet companies turned profits, JavaScript became a tremendously important\
    \ language. Its stasis risked holding back the development of the web. Major tech\
    \ companies took notice and starting pushing the language forward. Employees of\
    \ `Apple`, `Ebay`, `Google`, `Intel`, `Microsoft`, and `Mozilla` are represented\
    \ on the `TC39` committee in charge of the `ECMAScript` standard (ECMAScript Wiki\
    \ n.d.). A fresh wave of investment in the web resulted in an improved fifth edition\
    \ of `ECMAScript` in 2009 and a massive influx of browser features loosely grouped\
    \ under the term `HTML5`. `HTML5` saw the web move even further from a document-based\
    \ hypertext system to perhaps the premier site for cross-platform application\
    \ development. JavaScript gained access to storage and databases, geolocation\
    \ information, advanced geometric drawing and graphics capabilities, audio and\
    \ video, and user hardware such as microphones and video cameras, previously the\
    \ sole domain of browser plug-ins, such as `Adobe Flash`. Today, JavaScript is\
    \ a robust and thriving language. New features are being rapidly developed for\
    \ web browsers and the language itself. The language is starting to grow roots\
    \ outside of the web browser with exciting new uses that are discussed below.\n\
    \n## Uses\n\nJavaScript is primarily known for a single thing: making websites\
    \ interactive. While other frameworks have attempted this—notably `Java applets`\
    \ and `Adobe Flash`—they do so via browser plug-ins that a user must install,\
    \ while JavaScript is included in every web browser in common use. `Apple`’s decision\
    \ not to allow `Adobe Flash` on the iPhone’s `Mobile Safari` browser gave a large\
    \ edge to JavaScript. It is widely recognized that using JavaScript is the best\
    \ way to write cross-platform interactive websites, and this is the language’s\
    \ principal distinction.\n\nCreating a multitab search box is a good example of\
    \ JavaScript’s capabilities. Multitab search boxes are a common feature of library\
    \ websites since many libraries offer a number of different search engines: a\
    \ catalog of books and media, a discovery layer that includes journal articles,\
    \ a federated search over several separate search engines, a periodicals search,\
    \ `LibGuides`, special collections, archives. Each of these offers different facets\
    \ and instructions to the user, while putting the search forms one after another\
    \ on your website takes up an enormous amount of space. A tabbed search that shows\
    \ only one search form at a time saves space but still offers users access to\
    \ a variety of search engines via the other tabs. These interfaces are implemented\
    \ in JavaScript, which displays the appropriate search form when a tab is clicked.\n\
    \nAnother JavaScript use that improves the search experience is filtering and\
    \ sorting search results in the web browser. Complex search engines offer multiple\
    \ different facets that control the type of results returned. For instance, one\
    \ can search in a library catalog for the author `Toni Morrison` but then choose\
    \ to filter results to only those bearing the `Literature—History and criticism`\
    \ Library of Congress Subject Heading. Or perhaps one wants to see the most recently\
    \ published results first rather than results sorted by their relevance to the\
    \ search query. Modern search engines implement these filtering and sorting features\
    \ by presenting the user with a checkbox or drop-down menu that, upon selection,\
    \ updates the results. Without JavaScript, the only way to update the display\
    \ would be to reload the entire web page, a slow process that disorients the user.\
    \ With JavaScript, one can dynamically update the displayed results, even incorporating\
    \ new information from the web server, without the browser reloading the page.\n"
  raw: 'Understanding JavaScript’s history is an important step in comprehending the
    nature of the language. It was developed as a scripting language for web browsers
    by the Netscape Communications Corporation in 1995\. Infamously, the original
    developer was given only ten days to design and code the entire language, a language
    that faced the technical challenges of being embedded within HyperText Markup
    Language (HTML) (Wood et al. 2014). In order to understand this complexity, consider
    that HTML relies on angle brackets around its tags, such as <body>, so even the
    use of the common mathematical symbols for greater than and less than comparisons
    posed difficulties for the new language’s design. Given its hasty development
    and the challenges faced, it is no surprise that JavaScript has its share of oddities
    and outright errors. Despite this, JavaScript succeeded and is actually one of
    the most used programming languages on the planet, lauded by some for its expressiveness
    and innovative features.


    When Netscape developers set about designing a scripting language for the browser,
    they wanted it to be approachable, particularly for new programmers (Wood et al.
    2014). The design goals for the language focused on simplicity, making it possible
    to accomplish tasks with small amounts of code, and not requiring compilation.
    Compilation is the process of passing computer code to a “compiler” program that
    produces a binary executable. JavaScript borrowed its ideas from existing languages,
    such as Scheme, HyperTalk, and Smalltalk, rather than the more complex compiled
    languages of the time, including C and Java. The name itself is often a source
    of confusion: JavaScript bears no formal relation to Java. Rather, the JavaScript
    name was a sort of marketing gimmick aimed to associate the new scripting language
    with the popular Java language (Wood et al. 2014). While the two do bear some
    surface similarities, they are in fact very different in terms of both their philosophy
    and their use cases. In fact, while JavaScript is the commonly known name, the
    language is standardized as ECMAScript after the Ecma International organization,
    which presides over the standard.


    JavaScript’s fate has been bound to that of web browsers, for better and worse.
    Since JavaScript became used on websites across the globe shortly after its release,
    it was difficult to correct the language’s initial defects. While other programming
    languages can release new compiler or interpreter programs that remove troublesome
    features or drastically alter their syntax, JavaScript’s web-based nature makes
    its evolution arduous. Over time, web browsers developed inconsistent, competing,
    and occasionally flawed implementations of the language. With browsing as the
    language’s primary use, it is difficult to discern language flaws from poorly
    designed browser features. After an initial set of updates that ended with the
    third edition of ECMAScript published in 1999, the language stagnated. A fourth
    edition was started but never completed due to disagreement among the authoring
    committee (Wood et al. 2014). However, browsers also drove the popularity of JavaScript
    and some of its most innovative uses.


    Microsoft’s Internet Explorer introduced what would become the XMLHttpRequest
    feature in the late 1990s (Flanagan 2011, 491–94). This browser feature is the
    foundation of so-called AJAX (an acronym for Asynchronous JavaScript and XML,
    though non-XML data formats can be used) programming, a lightweight technique
    for pulling data into web pages without requiring a full-page refresh. AJAX eventually
    spawned an influx of innovative web applications written in JavaScript, such as
    Outlook Web App, Gmail, and Google Maps. These dynamic applications constantly
    refreshed their data and intelligently responded to user input, a far cry from
    the set of interconnected but static documents that characterized the early web
    of the 1990s.


    As sophisticated web applications were popularized, and Internet companies turned
    profits, JavaScript became a tremendously important language. Its stasis risked
    holding back the development of the web. Major tech companies took notice and
    starting pushing the language forward. Employees of Apple, Ebay, Google, Intel,
    Microsoft, and Mozilla are represented on the TC39 committee in charge of the
    ECMAScript standard (ECMAScript Wiki n.d.). A fresh wave of investment in the
    web resulted in an improved fifth edition of ECMAScript in 2009 and a massive
    influx of browser features loosely grouped under the term HTML5. HTML5 saw the
    web move even further from a document-based hypertext system to perhaps the premier
    site for cross-platform application development. JavaScript gained access to storage
    and databases, geolocation information, advanced geometric drawing and graphics
    capabilities, audio and video, and user hardware such as microphones and video
    cameras, previously the sole domain of browser plug-ins, such as Adobe Flash.
    Today, JavaScript is a robust and thriving language. New features are being rapidly
    developed for web browsers and the language itself. The language is starting to
    grow roots outside of the web browser with exciting new uses that are discussed
    below.


    Uses


    JavaScript is primarily known for a single thing: making websites interactive.
    While other frameworks have attempted this—notably Java applets and Adobe Flash—they
    do so via browser plug-ins that a user must install, while JavaScript is included
    in every web browser in common use. Apple’s decision not to allow Adobe Flash
    on the iPhone’s Mobile Safari browser gave a large edge to JavaScript. It is widely
    recognized that using JavaScript is the best way to write cross-platform interactive
    websites, and this is the language’s principal distinction.


    Creating a multitab search box is a good example of JavaScript’s capabilities.
    Multitab search boxes are a common feature of library websites since many libraries
    offer a number of different search engines: a catalog of books and media, a discovery
    layer that includes journal articles, a federated search over several separate
    search engines, a periodicals search, LibGuides, special collections, archives.
    Each of these offers different facets and instructions to the user, while putting
    the search forms one after another on your website takes up an enormous amount
    of space. A tabbed search that shows only one search form at a time saves space
    but still offers users access to a variety of search engines via the other tabs.
    These interfaces are implemented in JavaScript, which displays the appropriate
    search form when a tab is clicked.


    Another JavaScript use that improves the search experience is filtering and sorting
    search results in the web browser. Complex search engines offer multiple different
    facets that control the type of results returned. For instance, one can search
    in a library catalog for the author Toni Morrison but then choose to filter results
    to only those bearing the “Literature—History and criticism” Library of Congress
    Subject Heading. Or perhaps one wants to see the most recently published results
    first rather than results sorted by their relevance to the search query. Modern
    search engines implement these filtering and sorting features by presenting the
    user with a checkbox or drop-down menu that, upon selection, updates the displayed
    results. Without JavaScript, the only way to update the display would be to reload
    the entire web page, a slow process that disorients the user. With JavaScript,
    one can dynamically update the displayed results, even incorporating new information
    from the web server, without the browser reloading the page.'
