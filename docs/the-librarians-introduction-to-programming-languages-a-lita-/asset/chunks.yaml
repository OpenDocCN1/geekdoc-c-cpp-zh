    Line 5 is the payload of this program. This printf statement is a function that
    takes the supplied argument, in our case the quintessential introductory statement
    every programmer begrudgingly learns, and prints it to standard output. In most
    cases, the output will be the screen. The bit about \n at the end of the string
    is an escaped character that appends a new line to the end of the string. After
    printf is a semicolon. Every line of code in C needs to be terminated with a semicolon,
    with the exception of the include line. With this obligatory example out of the
    way, let’s delve into something particularly C-like.


    Addresses of Values


    Back at the command prompt, try using nano to start a file called address.c and
    then enter the following text and save the document:


    /* Looking at the address of a variable */


    #include <stdio.h>


    main() {


    int x;


    int y;


    x = 3;


    y = 7;


    printf("Value of x is: %d and located: %p\n",x,&x);


    printf("Value of y is: %d and located: %p\n",y,&y);


    }


    The command line workflow for this example should look like this:


    >nano address.c


    >gcc address.c


    >ls


    address.c a.out a.helloworld.c


    >./a.out


    Value of x is: 3 and located: 0x7ffe28fd9a08


    Value of y is: 7 and located: 0x7ffe28fd9a0c


    >


    Your output will be different than what is in the image, and we will go line by
    line, skipping the parts we saw with the first bit of code. Lines 4 and 5 declare
    two integers. A fundamental data type of any language, values are assigned to
    the newly created integers in lines 6 and 7.


