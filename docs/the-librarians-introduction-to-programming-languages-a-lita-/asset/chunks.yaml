    -   你希望尽可能多的开发者在你离开后仍能理解你的代码。


    ## 示例


    ### 在 Drupal 内容管理系统中使用 MySQL


    此示例演示了如何创建一个 `MySQL` 数据库，以便在安装 Drupal 内容管理系统时使用。Drupal 是一种广泛使用的 CMS，被图书馆网站使用，也被用作
    Islandora 数字资产管理系统的前端用户界面本节中使用的命令可以用于各种需要 `MySQL` 的应用程序，用于创建新用户、创建新数据库以及设置用户权限。


    此示例假设运行了如适用于 Mac OS X 的 MAMP 本地服务器，并使用 Mac 内置的终端（Terminal）应用程序（位于“实用工具 > 终端”下）。第一步需要使用终端进入
    `MySQL` 的交互模式，这允许使用 `MySQL` 的命令行语法来执行 `MySQL` 操作。要进入交互模式，首先确保你的本地 `MySQL` 服务器正在运行（点击
    MAMP 应用程序菜单中的“Start Servers”）。然后打开终端并输入以下内容：


    ```bash

    /Applications/MAMP/Library/bin/mysql --host=localhost -uroot –proot

    ```


    此命令的各个部分包括以下内容：


    - `/Applications/MAMP/Library/bin/mysql`——进入 `MySQL` 软件应用程序的位置

    - `--host=localhost`——将 `MySQL` 数据库的主机定义为本地机器或 localhost

    - `-uroot -proot`——这些元素（`-u` 和 `-p`）分别引用用户名和密码。在这种，用户名和密码相同（`root`）。注意，在本地开发中使用这种容易猜到的用户名和密码组合是可以的，但不能用于生产环境应用程序。在生产环境中使用
    `MySQL` 时，建议将 root `MySQL` 密码改为难以猜测的内容。


    终端进入 `MySQL` 交互模式，每行都将显示 `mysql>` 提示符，表示预期输入 `MySQL` 语句。在交互模式下，可以输入 `MySQL` 命令来创建用户和设置权限、创建和删除（drop）数据库等。例如，在
    `MySQL` 交互模式下，以下命令创建一个名为 `mydatabase` 的数据库：


    ```sql

    mysql> CREATE DATABASE mydatabase;

    ```


    输入此命令后，`MySQL` 服务器将报告：


    ```text

    Query OK, 1 row affected (0.01 sec)

    ```


    每当你在 `MySQL` 交互模式下输入命令时，请确保每个语句都以分号（`;`）结束，否则命令行将认为后续输入是同一条记录的一部分。


    Web 服务器利用“端口”为服务器应用程序提供不同的访问点。应用程序可以通过连接到服务器端口 `3306` 并传递身份凭据来访问 `MySQL` 数据。这些身份凭据通常存储在应用程序的配置设置中。例如，在安装
    Drupal 等 CMS 时，安装过程的一个步骤是输入凭据以允许应用程序连接到 `MySQL` 数据库（图 7.2）。详细说明可以从 [`www.drupal.org/documentation/install/run`](https://www.drupal.org/documentation/install/run)-脚本找到。


    ![](img/Figure_7.2.jpg)


    图 7.2. Drupal 安装：“设置数据库”登录屏幕。


    在这一步中，数据库名称是你运行 `CREATE DATABASE` 命令时指定的名称（在上面的示例中，数据库名为 `mydatabase`）。数据库名称、用户名和密码是区分大小写的。虽然在开发过程中，你可以使用访问
    `MySQL` 命令行时相同的 root 凭据，但建议针对应用程序需要访问的数据库创建具有特定权限的唯一用户名和密码。这样，如果一组数据库凭据被泄露或黑客，潜在的损害可能限于创建这些凭据的特定数据库和权限。如果凭据受到限制，例如，黑客无法轻易使用被破解的凭据删除或更改你
    `MySQL` 安装中的所有数据库。数据库用户名和密码也可以在命令行中使用以下语法进行创建，其中 `myuser` 是用户名，`mypass` 是与该用户名关联的密码：


    ```sql

    mysql> CREATE USER ''myuser''@''localhost'' IDENTIFIED BY ''mypass'';

    ```


    为特定数据库创建数据库用户名和密码时，必须设置指示这些凭据有权执行的操作权限。权限根据应用程序的要求而异。例如，Drupal 需要一个具有以下权限的用户：


    ```sql

    mysql> GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, INDEX, ALTER, CREATE
    TEMPORARY TABLES ON mydatabase.* TO ''username''@''localhost'' IDENTIFIED BY ''password'';

    ```


    这意味着为 Drupal 创建的用户需要：


    - 从此数据库的表中选择数据

    - 向这些表中插入新数据

    - 更新（更改）已存在的数据

    - 删除数据

    - 创建新表

    - 删除（删除）表

    - 为表建立索引

    - 更改表的列

    - 创建临时表（这在你学习高级 SQL 时很有用）


    如果你出于某些原因需要删除 `MySQL` 数据库或表，你可以使用 `DROP` 命令来实现。例如，如果你想完全删除所有 Drupal 数据并从头重新安装整个
    CMS，将输入此命令：


    ```sql

    mysql> DROP DATABASE <db_name>;

    ```


    除非你的数据库已经备份，否则数据库一旦删除就无法撤销，因此请务必谨慎使用 `DROP` 命令，并确保这是你真正想要的操作。备份和导出 `MySQL` 数据库的一种简单方法是使用
    `mysqldump` 方法，如位于 [`www.lampdev.org/tutorial/mysql/backup_restore/mysqldump_tutorial.html`](http://www.lampdev.org/tutorial/mysql/backup_restore/mysqldump_tutorial.html)
    教程所示。


    ### 使用 SQLShare 进行 SQL 查询


    此示例不需要使用 RDBMS；相反，你可以利用华盛顿大学的 `SQLShare` 环境来运行 SQL 查询并返回数据，而无需本地安装任何软件。


    开始之前，请从 GitHub 下载以下文件 ([`github.com/lpmagnuson/sqlshare`](http://github.com/lpmagnuson/sqlshare))：


    - `books.csv`

    - `users.csv`

    - `checkouts.csv`


    在华盛顿大学的 `SQLShare` 网上创建一个账户，创建一个唯一账户或使用 Google 账户登录。将所有三个文件上传到 `SQLShare` 网站。


    在以下示例中，将 `youraccount` 替换为你实际创建的账户标识符。通过帐户引用数据的结构是 `SQLShare` 模型特有的，在大多数 RDBMS
    环境中并不。


    #### 获取所有英语专业学生


    此查询非常直观：`user` 表中哪些是英语专业的？为了只查看用户名和专业，我们可以使用此查询从 `users` 表中选择这两列：


    ```sql

    SELECT [youraccount].[table_users.csv].username, [youraccount].[table_users.csv].major
    FROM [youraccount].[table_users.csv]

    WHERE major = ''English''

    ```


    输出如图 7.3 所示。


    ![](img/Figure_7.3.jpg)


    图 7.3. SELECT 查询的输出。


    #### 按专业统计用户人数


    SQL 最用的功能之一是累加值并报告它们。`COUNT` 函数可以查看列的值并统计所有唯一值。注意，`COUNT` 函数需要一个相应的 `GROUP BY`
    语句，以便 SQL 输出知道如何显示结果：


    ```sql

    SELECT [youraccount].[table_users.csv].major, count([youraccount].[table_users.csv].major)
    as number

    FROM [youraccount].[table_users.csv]

    GROUP BY [youraccount].[table_users.csv].major

    ```


    输出如图 7.4 所示。


    ![](img/Figure_7.4.jpg)


