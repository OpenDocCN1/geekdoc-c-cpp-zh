    PHP’s fit in a library’s website can be difficult to pinpoint as it can be attributed
    responsibility for tasks in an application that it has not performed. PHP is not
    usually responsible for the literal storage of data, nor is it usually responsible
    for the visual display of a web page. PHP’s usual responsibility on a website
    is to find data in a database or file system, run some calculations on that data,
    and send the data to the user. The calculation PHP is asked to perform is defined
    by a PHP script written by a programmer. The calculation can be as simplistic
    as “calculate the tax for this order” or as complex as “determine if this user
    has access to our top-secret files.” PHP is not responsible for knowing the tax
    rate, nor is it responsible for knowing the order details. It must request the
    order details and tax rate from a database in order to make the requested calculation.
    PHP does not control how an order summary appears visually to the user as that
    is the role of the user’s browser in conjunction with HTML, CSS, images, and JavaScript.
    Since PHP has well-defined scripts for getting data, running calculations on that
    data, and returning the results, PHP is often a simple way for a website to show
    raw data, such as a list of retail prices for books. Whether displaying raw or
    processed data, websites that need to show users information from a database commonly
    rely on PHP.


    The evolution of the web correlates closely with the evolution of PHP. The first
    version of PHP was used as a tool to update one’s “personal home page,” PHP’s
    original namesake. The robustness of PHP as a server language intended to run
    a single page was appropriate as websites during this time included blinking marquee
    text and animated GIF torches. The early web did not require complex pipelines
    to big data or mobile-compatible e-commerce. PHP had no reason to provide those
    features. As web developers began to expand our expectations for websites, PHP
    developed with advances in the web. PHP was renamed to stand for PHP: Hypertext
    Preprocessor and began to support the features a modern web programmer desires.


    This slow evolution has left scars on the PHP language, including inconsistent
    naming conventions, strange required ordering of code, and legacy support issues.
    Consider the function names that ask if a variable is defined (`isset`), is an
    integer (`is_int`), or is a public variable (`isPublic`). Since PHP is case sensitive,
    a developer must either memorize the correct spelling for all functions or have
    a PHP manual at the ready. Modern coding tools help mitigate this issue with code
    completion, which acts like an automatic spell-check for programmers, but function
    names can make an introduction to PHP unnecessarily annoying. The best source
    for PHP documentation is [php.net](http://php.net).


    The advantage of its slow evolution is PHP’s thoughtful inclusion of rich features
    and a variety of development environments. Programmers also have access to PECL
    (PHP Extension Community Library), which includes free PHP plug-ins that extend
    support for caching, compression, database connections, image manipulation, email,
    debugging, encryption, internationalization, and more.


    ## Environment and Setup


    The physical components (hardware) and programs (software) required before you
    can start working with a programming language are known as a development environment;
    however, your home and work computers are likely fully capable of developing PHP
    programs. Any website requires significantly higher hardware for a live web application,
    but a PHP programmer can develop and test applications on any normal workstation.
    The power required to run a live PHP program varies by the scale of the audience.


    The most common installation of PHP for a production environment uses a series
    of programs that an average computer user will find foreign; however, it is common
    enough in server administration to earn an acronym, LAMP. Each letter in LAMP
    stands for a program: Linux, Apache, MySQL, and PHP. The most significant difference
    between the testing environment we will setup to write PHP versus our hypothetical
    production environment is Linux. Linux is the server’s version of Windows and
    Apple OS. As the software that runs a personal computer, Windows and Apple OS
    are intended to provide a visual way of using and maintaining a computer with
    visual alerts when some program needs the user’s attention. Web servers do not
    need a visual environment for alerts because servers are designed to run without
    the need for constant oversight. Linux intentionally excludes the types of software
    that make a personal computer personal in exchange for added power, stability,
    and security.


    In order to test scripts in a way that replicates what will happen on a web server,
    a programmer tries to replicate the production environment on the testing computer
    as closely as possible. While learning PHP, there is no emphasis on creating a
    perfect, or even good, testing environment. As long as PHP can process scripts
    the developer needs processed and it ignores nonscript content, the environment
    can be used for tutorials. The easiest way to designate a file or section of a
    file as a PHP script is to use encapsulating tags much like HTML itself:


    ```php

    <?php echo "Hello World!"; ?>

    ```


    In this example, the only portion of code sent to PHP is the command `echo` “Hello
    World!”. When a browser views this page, it will see something like `<p>Hello
    World!</p>`. There are other ways of distinguishing HTML from PHP, such as excluding
    the letters php (`<?php echo “I''m missing the php letters, but why?”; ?>`), which
    is technically allowed but is inconsistent with today’s best practices.


    PHP is inherently inconsistent, and there are some areas where developers can
    help by agreeing to use one method where multiple methods may exist. Collectively,
    these agreements are known as best practices or coding standards. The majority
    of best practices are commonsense guidelines, but some content management systems,
    including Drupal and WordPress, add additional best practices when working with
    those systems. Projects built with PHP often have carefully considered best practices
    for that system. Drupal, being the largest of these projects, has established
    guidelines that have seeped into the general PHP developer universe. Guidelines
    on documentation are an important best practice from Drupal’s impact but were
    not born out of Drupal but, rather, standardized. Code organization, file organization,
    and folder structure have little to do with coding itself, but a unified way of
    organizing projects makes group work far easier. Organizing your code and files
    in a way that is consistent with best practices ensures that co-workers, community
    developers, and future developers can quickly understand your code. Nonframework-specific
    standards represent efforts to create interoperable PHP best practices. The most
    notable nonframework standard is PSR-1, from the PHP Standards Recommendations
    from PHP-FIG ([http://www.php-fig.org/psr/psr](http://www.php-fig.org/psr/psr))-1(),
    which is a democratically approved and voluntarily utilized set of standards.

