    /Applications/MAMP/Library/bin/mysql --host=localhost -uroot –proot


    The various pieces of this command include the following:


    *   /Applications/MAMP/Library/bin/mysql—moves into the location of the MySQL
    software application


    *   --host=localhost—defines the host of the MySQL database as the local machine,
    or localhost


    *   -uroot -proot—these elements (-u and -p) refer to username and password, respectively.
    In this case, both the username and password are the same (root). Note that using
    “root” along with this kind of easily guessed username and password combination
    is okay for localhost development but must not be used for production applications.
    When using MySQL in production, it is advisable to change the root MySQL password
    to something hard to guess.


    Terminal enters into MySQL interactive mode, which will display each line with
    a mysql> prompt, indicating that a MySQL statement is expected. While in interactive
    mode, MySQL commands can be entered to create users and set permissions, create
    and delete (“drop”) databases, and more. For example, in MySQL interactive mode,
    the following command creates a database called mydatabase:


    mysql> CREATE DATABASE mydatabase;


    Upon entering this command, the MySQL server will report:


    Query OK, 1 row affected (0.01 sec)


    Whenever you enter commands in MySQL interactive mode, be sure to complete each
    statement with a semicolon (;) or the command line will expect additional input
    as part of the same entry.


    Web servers utilize “ports” to serve up different access points for server applications.
    Applications can access MySQL data by connecting to a server’s port 3306 and passing
    authentication credentials to perform MySQL operations. These authentication credentials
    are often stored within an application’s configuration settings. For example,
    when installing a CMS such as Drupal, one step of the installation process involves
    entering credentials that enable the application to connect to a MySQL database
    (figure 7.2). Detailed instructions can be found at [https://www.drupal.org/documentation/install/run](https://www.drupal.org/documentation/install/run)-script.


    ![](OEBPS/image/Figure_7.2.jpg)


    Figure 7.2\. Drupal installation: “Set up database” login screen.


    In this step, the database name is the name you gave when you ran the CREATE DATABASE
    command (in the example above, the database name is mydatabase). Database names,
    usernames, and passwords are case sensitive. While you could, in development,
    use the same root credentials you used to access the MySQL command line, it is
    always advisable to create unique usernames and passwords with specific permissions
    to the database the application needs to access. This way, if a set of database
    credentials is compromised or hacked, potential damage may be limited to the specific
    database and permissions for which the credentials were created. If credentials
    are limited, a hacker couldn’t, for example, easily use the hacked credentials
    to drop or alter all of the databases in your MySQL installation. Database usernames
    and passwords can also be created at the command line using the following syntax,
    where myuser is the username and mypass is the password associated with that username:


    mysql> CREATE USER ''myuser''@''localhost'' IDENTIFIED BY ''mypass'';


    When creating database usernames and passwords for a particular database, permissions
    indicating what those credentials have permission to do must also be set. Permissions
    may vary by the application’s requirements. Drupal, for example, requires a user
    with the following permissions:


    mysql> GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, INDEX, ALTER, CREATE
    TEMPORARY TABLES ON mydatabase.* TO ''username''@''localhost'' IDENTIFIED BY ''password'';


    This means that the user created for Drupal needs to be able to:


    *   Select data from tables in this database


    *   Insert new data into those tables


    *   Update (change) the data that is already there


    *   Delete data


    *   Create new tables


    *   Drop (delete) tables


    *   Index tables


    *   Change what columns are in a table


    *   Create temporary tables (this is useful when you get into advanced SQL)


    If you need to delete a MySQL database or table for some reason, you can do it
    with the DROP command. For example, if you wanted to completely delete all Drupal
    data and reinstall the entire CMS from scratch, you would enter this command:


    mysql> DROP DATABASE <db_name>;


    Unless your database has been backed up, once a database is dropped it cannot
    be undone, so always use the DROP command with caution and be sure it is what
    you really want to do. A straightforward way to back up and export a MySQL database
    uses the mysqldump method as shown in the tutorial located at [http://www.lampdev.org/tutorial/mysql/backup_restore/mysqldump_tutorial.html](http://www.lampdev.org/tutorial/mysql/backup_restore/mysqldump_tutorial.html).


    SQL Queries with SQLShare


    This example does not require the use of an RDBMS; instead, you can utilize the
    University of Washington’s SQLShare environment to run SQL queries and return
    data without installing any software locally.


    To get started, download the following files from GitHub ([http://github.com/lpmagnuson/sqlshare](http://github.com/lpmagnuson/sqlshare)):


    *   books.csv


    *   users.csv


    *   checkouts.csv


    Create an account on the University of Washington’s SQLShare website, either by
    creating a unique account or logging in with a Google account. Upload all three
    files to the SQLShare website.


    In the following examples, replace youraccount with your actual account identifier
    that you just created. The structure of referencing data by account name is unique
    to SQLShare’s model and is not necessary in most RDBMS environments.


    Retrieve All the English Majors


    This query is fairly straightforward: which users in the user table are English
    majors? To just see usernames and majors, we can select those two columns from
    the users table using this query:


    SELECT [youraccount].[table_users.csv].username, [youraccount].[table_users.csv].major
    FROM [youraccount].[table_users.csv]


    WHERE major = ''English''


    The output is shown in figure 7.3.


    ![](OEBPS/image/Figure_7.3.jpg)


    Figure 7.3\. Output from SELECT query.


    Count the Number of Users by Major


    One of the most useful features of SQL is the ability to add up values and report
    them. The COUNT function can be used to look over a column’s value and count up
    all the unique values. Note that the COUNT function requires a corresponding GROUP
    BY statement so that the SQL output knows how to display the results:


    SELECT [youraccount].[table_users.csv].major, count([youraccount].[table_users.csv].major)
    as number


        FROM [youraccount].[table_users.csv]


        GROUP BY [youraccount].[table_users.csv].major


    Output is shown in figure 7.4.


    ![](OEBPS/image/Figure_7.4.jpg)'
