  trans: '

    计算机现在是图书员工作中不可或缺的一部分。由于许多计算机程序允许用户自定义并运行短小的程序段落（称为“脚本”），如果图书员不学习一些基础编程，他们可能会错过图书馆世界的一个巨大领域。例如，如果你有预算数据，可以进行重复分析以计算各种场景。有了借阅数据，你可以进行重复分析，以检查特定人群对物品的使用情况、与学期相关的索号范围使用情况以及其他重要的关系。编程允许人们快速地完成复杂的重复性任务，并允许在参数变化时快速修改。


    那么，没有编程经验的图书员应该从何开始呢？首先，让我们理解“程序”（program）和“程序代码”（program code）这两个术语是相当互换的。程序是一套完整的独立程序代码。程序代码通常指泛指的代码，而不是一个完整的程序。编程是创建程序的动作，本质上是编写组成程序的代码。代码是我们人类使用的类英语的指令，用于告诉计算机要做什么。你可能听过程序员（programmers）或代码编写员（coders）。这些本质上是一回事：即编写（或编码）程序的人。有人可能会说，现在学习编程是小孩子的游戏。有大量的书籍、在线视频和面向游戏的网站可以提供帮助。其中，`Code.org`
    是一个基础教学的绝佳网站；它无论使用何种编程语言，都教授编程逻辑。`Code.org` 为小学生提供了教程和内容，让他们学习编程的构建块。当然，成人也可以从该网站学习，并以有趣的方式进行。如果你想学习更高级的内容，YouTube
    只需点击一下即可，那里有丰富的分步操作视频。不过，必须留意以确保教学质量。本书章节作者提供的资源以及本书的“附加资源”部分将引导你在通往编程之旅的途中找到优质资源。


    ## 基础知识


    区分“与计算机交互”和“在计算机上编程”是非常重要的。对于许多包括图书员在内的成年人来说，第一步是练习交互技能。一个很好的入门方法是找出一台旧的台式机电脑或笔记本电脑，并在上面加载
    `Linux`。操作系统的 `Ubuntu Linux` 的最新版本在加载后将类似于 Windows 或 Apple 操作系统。然而，在 `Linux` 中，仍然可以使用鼠标驱动的图形用户界面，并进入
    `Terminal`（`X-terminal`），在那里运行计算机是命令行驱动的。我的意思是，用户可以在计算机上相应的行上输入命令，因此名为“命令行”。鼠标和它的光标消失了。为了在计算机上移动，用户使用方向键。在
    Windows 机器上，你可以同时按住 `Windows` 键（通常在键盘的左下角）并按住 `X` 键。这将弹出一个命令行菜单，以及具有管理员权限的命令行。


    命令行中有几个重要的任务需要学习。为了在这个环境中运行，用户必须学会如何在不同的文件夹或目录之间来回移动；在文件夹或目录内移动、复制或删除内容；以及从其他来源查找、下载并解压程序。掌握这一系列任务将对图书员大有益。一旦实现了这些目标，加载特定编程语言所需的脚本集或库将变得容易得多。


    这一切的起点是路径（图 1.1）。这让用户能够知道所有内容在操作系统文件结构中的位置。路径遵循一种类比于“树”的术语。将树与大地连接、将树干与树连接起来的结构是“根”。路径的核心是根目录。根结构包含了允许计算机运行的命令。在根目录中删除任何文件都将不起作用；因此，根目录通常受到保护。在这种情况下，保护意味着需要密码来更改根目录的部分。如果你是计算机的管理员（也就是说，它是你的电脑或你负责它），那么你应该知道根密码。根密码的创建通常发生在向你的计算机加载操作系统时。


    ![](img/Figure_1.1.jpg)


    图 1.1. 计算机操作系统中文件夹或目录的通用路径结构。


    用户可以直接从根目录添加或删除文件夹，就像树可以长出新树枝，或者园丁可以修剪掉树枝一样。但请记住，如果你剪掉了根，树就会死。一个很好的问题是，你如何知道你的树路径路径哪些分支？你可以在命令行中输入
    `dir`，并看到你所在位置包含的文件夹列表。要进入其中一个文件夹，你输入 `cd`（“change directory”的缩写）以及目录名称。甚至有一种更简单的方法回到你刚才所在地。通过在命令行输入单个点
    `.` 并按回车，你请求计算机带你回到上一个文件夹。如果你输入两个点 `..`，你请求计算机带你回到所有目录的起点，回到根目录。


    许多这些命令还有一些额外功能。一个很好的例子是你如何在 Windows 中查看文件夹的内容。你可以以列表形式查看，或以带有大小和创建日期详细信息的列表形式查看。新用户将遇到如
    `tar`、`grep` 和 `bash` 等术语。其中某些概念对于习惯 Windows 或 Mac OS 的人来说是容易理解的。例如，`.tar` 文件是一个压缩文件，类似于压缩过的
    Windows 文件夹。它需要被解压缩，并将文件夹中的文件移动到适当的文件夹或目录中才能生效。某些文件需要放在现有的文件夹中，而另一些则需要放在用户可能需要创建的新文件夹中。


    同样重要的是了解 `Linux` 设计为执行某些任务时无需询问，而对另一些任务进行提问。这防止用户意外破坏计算机的内容。在许多 Linux 系统中，这被定义为
    `SUDO` 用户或超级用户（super user）。实际上发生的是操作系统要求用户验证其确实是计算机管理员，并且这些更改是实际所需的。这有助于防止未经授权的用户进行更改。在
    `Linux` 中，用户有能力查看操作系统并几乎可以进行他们要求的任何更改，无论这些更改是否会导致计算机停止。这意味着管理员拥有巨大的权力，而且在搞乱事情方面比
    Windows 用户拥有更大的权力。

    '
- fmt: '

    An example of a simple and fun programming challenge is something along the lines
    of a Sumo robot competition. In this venue, two small robots set with motion detectors
    and line sensors compete to push each other out of a three-foot circular ring.
    These robots have motors to drive two wheels and when turned on and placed in
    the playing field, the robots seek each other out and try to push each other out
    of the ring. The programmer needs to write a script commanding the robot to do
    what and when, based on it detecting the other robot. The programming can be fairly
    simple, and it is a way to look at applied programming problems—and robotics.
    Again, the logic for defining the tasks would likely be the same for any computer
    language, just expressed differently.


    # Getting Started


    Today, buying a project book for an Arduino, Raspberry Pi, Edison, or BeagleBone
    ([http://beagleboard.org/bone](http://beagleboard.org/bone)) and the matching
    computer board for twenty to eighty dollars is a great way to have fun and learn
    programming at the same time. These are all types of microcontrollers. A few are
    advanced and perform more like current computers. A microcontroller is a set of
    programmable switches that you tell the controller to turn on and off as needed
    and for as long as desired. You can turn on lights, motors, or power sensors and
    collect and save data. With any of these, you can make intriguing projects, such
    as a wall-mounted electronic calendar that updates itself as a person updates
    his or her own personal calendar (Chee 2014) or your own robot.


    Most programs can be written in a text editor, such as `NotePad` if you are a
    Windows user. A program like Word won’t work because it will add a lot of hidden
    text material not visible to the writer, which will keep the program from working.
    In contrast, `NotePad` doesn’t add this material. However, not all text editors
    are the same, and some are much more useful than others. Some text editors can
    add color-coding to different parts of the program. `Sublime Text` and `NotePad++`
    are two widely regarded and utilized editors, with the former working on Windows
    and Linux operating systems. Each provides the user with numbered lines to track
    sections of the program.


    Almost any new user will be confronted with a type of “Hello World” script. Whether
    a person is working in Perl or in Python, most tutorials start here. The student
    defines a variable, such as `X = “Hello World.”`. The next step is just to command
    the computer to show the variable on the screen (`Print X`). The end result is
    that the student will see “Hello World” on his or her computer screen.


    As more and more programs become open source, meaning that the programming script
    (code) is publicly available, the power of programming for the librarian grows.
    A great example of this is with the program `R`. `R` is a statistical package.
    It is written and modified by users around the world, who continually add to and
    improve it. If there is a task you want the program to do and there is no script
    to run the task, you can write the script and then use other functions of the
    program to, for example, graph the results. Once you have written your script,
    you can share it with others so that they can benefit from your work. Along the
    way, someone else will probably bundle your script with a series of other related
    scripts and it will be added as a library to the program. The same is true for
    a program like `QGIS`, an advanced mapping program that can perform complex spatial
    analysis. Users can write short programs that provide much greater function to
    the overall `QGIS` program.


    # Object-Oriented Programming


    This brings us to the concept of object-oriented programming. Object-oriented
    programming is the process of writing scripts or short programs that can be plugged
    into or cut out of larger programs without causing any failures to either the
    larger program or the script in the process. With object-oriented programming,
    you can write a script to perform a task. This script is the object. Others can
    use your object `(script)` and plug it into an entirely different program to perform
    the same task you wrote it for on your program. For example, you could write a
    script to take some sort of sensor data, say book counter data from an automated
    check-in conveyor belt, and then aggregate the data daily and provide the weekly
    average of books that are turned in to the library. Another person could then
    copy your script to use with a different sensor to provide the weekly average
    number of patrons going through the library door. The task of creating the weekly
    average is the same whether you are counting books or people. It is this kind
    of chunked programming that has led to the development of very powerful programs
    and allowed the person on the street to add to it. The goal is to avoid having
    to rewrite the whole program just because you want to add one new task (to learn
    more, visit PC magazine’s definition at [http://www.pcmag.com/encyclopedia/term/48238/object]-oriented-programming).


    A fun way to begin programming is to work on puzzles where the reader is asked
    to solve a task by writing a script. Anyone can search online for examples of
    these. There are also books on programming puzzles. However, some of these books
    contain complex puzzles, and it seems these puzzles are used in the interview
    process when firms hire new programmers. For beginners, don’t shy away from books
    written for kids. Jason Briggs’s `Python for Kids` is a great starting point,
    and his website ([http://jasonrbriggs.com/python-for-kids/puzzles.html](http://jasonrbriggs.com/python-for-kids/puzzles.html))
    posts simple programming challenges for beginners.


    In any event, one of the easiest ways for a beginner to learn programming is by
    having fun working on projects where failure is a learning experience and not
    a problem. Again, Arduino projects are great for this type of activity. My best
    suggestion is to load `Linux` (it’s free) on an old laptop, buy an Arduino for
    twenty dollars, and spend some time on the web with [Code.org](http://Code.org).


    # Programming in Libraries


    Finally, why should a librarian learn to program? To collect data and solve problems
    such as how books within the call numbers range `x–y` were checked out more than
    once in any given year over the last ten years, to determine if checkouts are
    related to student success, to examine the effectiveness of library instruction—and
    many other reasons.


    This brings us to deciding which language to learn. Generally, this is going to
    depend on the reason behind wanting to learn. If the goal is a specific task,
    the language choice will be affected. For many librarians, writing the most concise
    code is probably less important than writing code that others can interpret. This
    is why languages such as `Ruby` and `Python` are popular. They are fairly concise,
    but more importantly, a person reading the script can easily see what the script
    is trying to do.


    A recent report in the Communications of the Association for Computing Machinery
    (`Guo 2014`) indicated that `Python` was the most popular language of 2014. This
    was based on an analysis of recent classes taught in university computer science
    departments and indicates that many programs are now written in `Python`. Thus
    it will probably be one of the best languages to start with unless there are reasons
    to use something else. `Python` is simple and powerful, and you will able to write
    interesting scripts fairly easily. If you are mainly involved in web design, then
    `Java` may be a better fit. There is no need to learn too many languages. Once
    you learn one language and have a good grasp of basic programming terminology
    and concepts, it will be easier to pick up another language when needed or desired.

    '
