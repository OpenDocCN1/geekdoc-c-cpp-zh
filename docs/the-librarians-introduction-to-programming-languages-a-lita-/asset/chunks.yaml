  trans: '

    理解 JavaScript 的历史是理解该语言本质的重要一步。它由 Netscape Communications 公司于 1995 年作为一种网络浏览器的脚本语言开发出来。臭名昭彰的是，原始开发者仅给了十天时间来设计并编写整门语言，而这种语言还面临着必须嵌入超文本标记语言（HTML）中的技术挑战（Wood
    et al. 2014）。为了理解这种复杂性，请考虑 HTML 依赖于标签周围的角括号，例如 `<body>`，因此即使是用于比较的大、小于号等常用数学符号，也为新语言的设计带来了困难。鉴于其仓促的发展和面临的挑战，JavaScript
    出现一些怪异和显而易见的错误并不意外。尽管如此，JavaScript 成功了，并且实际上是地球范围内最使用的编程语言之一，其表达能力创新特性备受某些人的赞誉。


    当 Netscape 开发者们开始为浏览器设计一种脚本语言时，他们希望它是易于上手的，特别是对于初学者而言（Wood et al. 2014）。该语言的设计目标集中于简单性，使其能够通过少量代码完成任务，且不需要编译。编译是将计算机代码传递给产生二进制执行文件的“编译器”程序的过程。JavaScript
    的灵感源自现有语言，如 `Scheme`、`HyperTalk` 和 `Smalltalk`，而不是当时更复杂的编译型语言（包括 `C` 和 `Java`）。这个名称本身通常是困惑的源源：JavaScript
    与 `Java` 之间没有任何正式关系。相反，JavaScript 这个名字是一种营销噱头，旨在将这种新的脚本语言与流行的 `Java` 语言联系起来（Wood
    et al. 2014）。虽然两者在表面上确实有一些相似之处，但在哲学思想和用例方面实际上非常不同。事实上，虽然 JavaScript 是一个广为人知的名称，但该语言由主持该标准的
    Ecma 国际组织标准化为 `ECMAScript`。


    JavaScript 的命运与网络浏览器的命运紧密相连，无论好坏。自从 JavaScript 在发布后不久就开始被全球范围的网站使用以来，纠正这门语言最初的缺陷变得困难。虽然其他编程语言可以发布新的编译器或解释器程序来移除存在问题的功能或彻底改变其语法，但
    JavaScript 基于 Web 的特性使其演进变得艰辛。随着时间的推移，网络浏览器对该语言开发了不一致、竞争性且偶尔有缺陷的实现。由于浏览是该语言的主要用途，很难区分语言本身的缺陷与设计不当浏览器功能。在经历了以
    1999 年发布第三版 `ECMAScript` 为结束的一系列初始更新后，该语言陷入了停滞。第四版曾开始启动，但由于编写委员会内部的分歧，从未完成（Wood
    et al. 2014）。然而，浏览器也推动了 JavaScript 的流行及其一些最具创新的用途。


    微软的 Internet Explorer 在 20 世纪 90 年代后期引入了后来变成 `XMLHttpRequest` 功能（Flanagan 2011,
    491–94）。这一浏览器功能是所谓 `AJAX`（Asynchronous JavaScript 和 XML 的缩写，尽管可以使用非 XML 数据格式）编程的基础，这是一种无需刷新整个页面即可将数据抓取到网页中的轻量级技术。`AJAX`
    最终催生了大量用 JavaScript 编写的创新型 Web 应用程序，如 `Outlook Web App`、`Gmail` 和 `Google Maps`。这些动态应用程序不断刷新其数据并智能地响应用户输入，这与
    20 世纪 90 年代早期 Web 特有的相互连接但静态的文档集有巨大差异。


    随着复杂的 Web 应用程序的普及以及互联网公司实现盈利，JavaScript 变成了一门极其重要的语言。它的停滞面临着阻碍 Web 开发的风险。各大科技公司注意到了并开始推动该语言的发展。`Apple`、`Ebay`、`Google`、`Intel`、`Microsoft`
    和 `Mozilla` 的员工代表负责 `ECMAScript` 标准的 `TC39` 委员会（ECMAScript Wiki n.d.）。Web 领域的新一波投资导致了
    2009 年改进后的第五版 `ECMAScript` 以及松散归类在 `HTML5` 术语下的大量浏览器功能。`HTML5` 让 Web 进一步从一个基于文档的超文本系统转向可能成为跨平台应用开发的首选平台。JavaScript
    获取了存储和数据库、地理位置信息、高级几何绘图和图形能力、音频和视频，以及麦克风和摄像头等用户硬件，而这些曾是 `Adobe Flash` 等浏览器插件的专属领域。今天，JavaScript
    是一门强健且繁荣的语言。针对网络浏览器和语言本身的新特性正在被快速开发。这门语言开始在网络浏览器之外生根，并在下文中讨论了令人兴奋的新用途。


    ## 用途


    JavaScript 主要因一特性而闻名：让网站具有交互性。虽然其他框架也尝试过这一点——特别是 `Java applets` 和 `Adobe Flash`——但它们通过用户必须安装的浏览器插件实现，而
    JavaScript 包含在每个常用的网络浏览器中。`Apple` 决定不在 iPhone 的 `Mobile Safari` 浏览器上允许 `Adobe
    Flash`，这给了 JavaScript 巨大的优势。人们广泛认为使用 JavaScript 是编写跨平台交互网站的最佳方式，这也是该语言的主要区别。


    创建一个多标签搜索框是 JavaScript 能力的一个良好例子。多标签搜索框是图书馆网站的常见功能，因为许多图书馆提供多个搜索引擎：书籍和媒体目录、包含期刊文章的发现层、跨多个独立搜索引擎的联邦搜索、期刊搜索、`LibGuides`、特藏、档案。这些这些每项都为用户提供不同的维度和指令，而在你的网站上一个一个放置搜索表单会占用大量的空间。一次显示一个搜索表单的标签式搜索节省了空间，但通过其他标签为用户提供了访问各种搜索引擎的机会。这些接口是用
    JavaScript 实现的，当点击标签时，它会显示相应的搜索表单。


    另一个改进搜索体验的 JavaScript 用途是在网络浏览器中过滤和排序搜索结果。复杂的搜索引擎提供了多个不同的维度来控制返回的结果类型。例如，人们可以在图书馆目录中搜索作者
    `Toni Morrison`，然后选择过滤仅显示带有“文学——历史与批评”（Literature—History and criticism）美国图书馆主题分类的结果。或者人们可能希望先看到最新发布的结果，而不是根据与搜索查询的相关性排序的结果。现代搜索引擎通过向用户提供复选框或下拉菜单来实现这些过滤和排序功能，在选择后更新结果。没有
    JavaScript，更新显示的唯一方法是重新加载整个 Web 页面，这是一个缓慢且令用户困惑的过程。通过 JavaScript，可以动态更新显示的结果，甚至可以在不刷新网页的情况下整合来自
    Web 服务器的新信息。

