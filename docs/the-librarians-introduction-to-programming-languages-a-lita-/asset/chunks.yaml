    \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
    Hello World!\");\n    }\n}\n```\n\n在 `Ruby` 中：\n\n```ruby\nputs \"Hello, World!\"\
    \n```\n\n这两组代码产生相同的结果。屏幕上会打印出文本 Hello, World!。`Ruby` 的代码短得多，对程序员来说编写和理解都更加容易。\n\
    \n# 一致性原则\nRuby 被认为遵循“最小惊讶原则”（POLA），这意味着它的行为应该尽可能地减少编写该语言的人的困惑。`Ruby` 旨在保持深度的同时尽可能简单，以最大地提高易用性。`Ruby`\
    \ 的意义不仅仅是简单——`Ruby` 旨在读起来是自然的，就像非计算机语言应该是自然的一样。\n\n```ruby\n5.times do\n    puts\
    \ \"Hello, World!\"\nend\n```\n\n即使是没有编程经验的人，也可以阅读上面的代码，并很好地感知这段代码在运行时会做什么。\n\n\
    # 灵活性原则\n松本认为语言（包括计算机语言）是为了表达思想的。语言不应该限制人类思维，而应该促进它。因此，`Ruby` 在创建时拥有一个小小的、不可更改的核心语法，并能够在整个库中根据需要和意愿扩展语言的能力。与强调完成任务有“唯一正确方法”的\
    \ `Python` 相比，`Ruby` 尝试提供许多方法，以便开发者可以找到最适合自己的一种。执行多次某项的任务代码就是一个极佳的例子：\n\n1. `10.times\
    \ do`\n   puts \"Ruby is flexible!\"\nend\n\n2. `(1..10).each { puts \"Ruby is\
    \ flexible!\"}`\n\n3. `for i in 1..10 do`\n   puts \"Ruby is flexible!\"\nend\n\
    \n4. `1.upto(10) { puts \"Ruby is flexible!\"}`\n\n上述四个示例的结果是相同的。在每种情况下，短句 Ruby\
    \ is flexible! 均出现了十次。这种灵活性对于新接触 `Ruby` 的人来说特别有用，因为它允许他们从多个角度来处理同一个问题。\n\n除了语言开发背后的理论，`Ruby`\
    \ 还受到 `Perl`、`Smalltalk`、`Eiffel`、`Ada` 和 `Lisp` 等其他面向对象编程语言的影响。它的语法类似于 `Perl`，语义则类似于\
    \ `Smalltalk`。\n\n# 环境与安装\nRuby 默认内置在 Mac 机器上。可以使用 `HomeBrew` ([`brew.sh`](http://brew.sh)/)——一个\
    \ Mac 系统的包管理器来安装其他版本的 `Ruby` 和其他相关程序。这个包管理器是用 `Ruby` 构建的！如果你使用的是 Windows 机器，你将必须安装\
    \ `Ruby`，因为它不是原生内置的。有一个名为 `RubyInstaller` 的项目可以帮助（[`rubyinstaller.org`](http://rubyinstaller.org)/）完成这种安装。\n\
    \n要立即开始使用 `Ruby`，你可以打开交互式 Ruby 终端，即 `IRB`。`IRB` 随 `Ruby` 一起内置，因此它在安装 `Ruby` 时会被安装。在安装语言后快速开始并立即编写代码的能力是\
    \ `Ruby` 的优势之一。\n\n`IRB` 是一个“壳”，允许你在计算机的 `Terminal` 中安全地编写和测试 `Ruby` 代码。在 Mac\
    \ 上，输入 `irb` 会会在屏幕上打开它。输入 `quit` 会退出程序并回到普通的 `Terminal` 屏幕。`Ctrl-D` 也会退出程序。在 Windows\
    \ 机器上打开 `IRB`，你可以点击“开始”并在菜单中选择 Interactive Ruby。\n\n你可以通过打开 `IRB` 并输入以下代码来尝试 `Ruby`\
    \ 编程：\n\n```ruby\nname = \"Ruby programmer\"\nputs \"Hello, #{name}!\"\n```\n\n\
    在这个小型程序中，`name` 是一个“变量”，一种存储位置，现在它包含了短语“Ruby programmer”。第二行代码告诉 `Ruby` 将变量 `name`\
    \ 的内容插入到短语“Hello, _____!”中，并将最终短语“Hello, Ruby programmer!”输出到屏幕。\n\n当你退出 `IRB`\
    \ 时，你的代码也会消失。除了使用 `IRB`，你还可以编写 `Ruby` 程序。在文本编辑器（如 `SublimeText`、`Atom` 或 `TextWrangler`）中编写\
    \ `Ruby` 并将其保存为 `.rb` 文件将创建一个 `Ruby` 脚本文件。然后可以在命令行中通过输入 `ruby [filename.rb]` 并回车来运行该文件。使用上述\
    \ `IRB` 部分的代码来尝试一下。在运行文件后，你应该会在终端中看到“Hello, Ruby programmer!”。注意，在这种情况下，Microsoft\
    \ Word 不能作为文本编辑器，因为它会在文件中存额外信息，导致程序无法运行。\n\n`Ruby` 是一门奇妙的语言，允许你快速高效地编写程序。`Ruby`\
    \ 的另一个优秀特性是 `gems` 概念。`gems` 是 `Ruby` 代码的库，易于安装和使用。即使是大型框架如 `Ruby on Rails` 也被封装为\
    \ `Ruby gem`，只需一行代码即可下载并安装：`gem install rails`。任何人都可以通过 RubyGems.org](http://RubyGems.org)（Ruby\
    \ 托管服务）创建并共享 gem。\n\n# 用途\nRuby 最常用于 Web 开发，`Ruby on Rails` 框架基于 Ruby 语言。较小的框架包括\
    \ `Sinatra` 和 `Middleman`，它们允许轻松创建网站并由 `Ruby` 驱动。`Ruby` 在网站后端非常高效，允许你的计算机连接到提供数据的服务器。\n\
    \n由于 `Ruby` 原生内置于 Mac 并在 Windows 上容易安装，对于解析小型数据集非常有用。例如，如果你有一千包含读者数据的记录，但只需要他们的电子邮件地址，你可以编写一个小型脚本将这些数据导出到新文件中供通讯稿使用。\n\
    \n几个用于图书馆科学的大框架都基于 Ruby。`Blacklight`、`Hydra` 和 `Avalon` 项目都是用 `Ruby` 构建的；因此，对\
    \ `Ruby` 工作原理的基本知识有助于这些框架的安装、开发和维护。\n\n"
- fmt: "\nSmaller scripts and gems have been created to optimize library-focused work.\
    \ Examples are `ruby-oai`, a Ruby library for building OAI-PMH clients and servers\
    \ ([https://github.com/code4lib/ruby](https://github.com/code4lib/ruby)-oai);\
    \ `nypl-collections`, a gem for easily accessing the digital collections held\
    \ at the New York Public Library ([https://rubygems.org/gems/nypl](https://rubygems.org/gems/nypl)-collections);\
    \ and, `marc`, a gem for (you guessed it) working with MARC catalog records ([https://rubygems.org/gems/marc/versions](https://rubygems.org/gems/marc/versions)/1.0.0).\n\
    \n## Pros and Cons\n\nThe language of Ruby strives to be human readable, which\
    \ is perhaps its greatest strength. The goal of Ruby is not just to be simple,\
    \ but to be natural in the same way that reading English is natural to native\
    \ English speakers. Ruby is simple to understand but complex when understanding\
    \ its full potential.\n\n```ruby\n5.times do\n  puts \"I love Ruby!\"\nend\n```\n\
    \nWith a simple script such as this, you can guess what is going to to happen\
    \ even if you have no prior experience programming. This code will print `I love\
    \ Ruby!` to the screen five times.\n\nInstallation is easy, both the language\
    \ and any language libraries that you may want to install. Ruby is packaged natively\
    \ on Macs, and there are installation instructions for Windows- or Linux-based\
    \ machines. Libraries of code, known as gems, are easy to install using the `gem\
    \ install` command on the command line. Given the above comments, Ruby is a very\
    \ suitable language for beginners since a beginner can learn the core concepts\
    \ of programming without being bogged down with difficult syntax or environment\
    \ setup errors.\n\nBeyond the code itself, Ruby has a strong and dedicated community\
    \ of users and developers. Since Ruby is open source, anyone can improve the language\
    \ or create libraries that make it easier for other people to use the language.\n\
    \nRuby is a great choice for beginners but may not be the best choice in the long\
    \ term, depending on the reason for learning a programming language. For instance,\
    \ Ruby is great for developing code meant for the web, but `JavaScript` is a powerful\
    \ language built for and on the web. `JavaScript` may, therefore, be a more effective\
    \ long-term choice if your main reason for learning to code is to make websites.\n\
    \nWhen it comes to scaling web applications to become Facebook sized, Ruby is\
    \ “slower” than what is necessary, depending on the type of data deployed and\
    \ if it needs to be live while updating. However, Codecademy, AirBNB, and other\
    \ major sites run on Ruby on Rails. Every operation in Ruby—even integer addition—is\
    \ done by invoking methods, so the cost to search and invoke methods cannot be\
    \ ignored, especially for simple programs. When programs get bigger and more complex,\
    \ however, no significant performance difference should arise as a result of methods\
    \ (Matsumoto 2000).\n\n`JavaScript` has had better libraries built around data\
    \ visualization. Ruby still lacks the ability to write code that creates complex\
    \ visualizations. This isn’t because there is anything wrong with the Ruby language\
    \ itself, but unfortunately the needed libraries have not been built by Ruby programmers.\n\
    \nRuby and `Python` are very similar programming languages. `Python` might be\
    \ a better fit over Ruby if the primary focus is on science-based learning. `Python`\
    \ is used more frequently for research and data science, and the community around\
    \ `Python` has supported these needs.\n\n## Examples\n\n### Parsing JSON Data\n\
    \nJSON stands for JavaScript Object Notation. It was built to serve as a lightweight\
    \ way to transfer data from one system to another. The design is intended to be\
    \ easy for humans to read and write and easy for computers to parse and create.\
    \ It is text based and language agnostic, meaning that your JSON can be used in\
    \ programs written in Ruby, `Python`, `C++`, and other languages.\n\nHere is some\
    \ sample JSON taken from Twitter’s API documentation ([https://dev.twitter.com/rest/reference/get/statuses/show](https://dev.twitter.com/rest/reference/get/statuses/show)/:id):\n\
    \n```json\n{\n  \"coordinates\": null,\n  \"favorited\": false,\n  \"truncated\"\
    : false,\n  \"created_at\": \"Wed Jun 06 20:07:10 +0000 2012\",\n  \"id_str\"\
    : \"210462857140252672\",\n  \"entities\": {\n    \"urls\": [\n      {\n     \
    \   \"expanded_url\": \"https://dev.twitter.com/terms/display-guidelines\",\n\
    \        \"url\": \"https://t.co/Ed4omjYs\",\n        \"indices\": [\n       \
    \   76,\n          97\n        ],\n        \"display_url\": \"dev.twitter.com/terms/display-\\\
    u2026\"\n      }\n    ],\n    \"hashtags\": [],\n    \"text\": \"Twitterbird\"\
    ,\n    \"indices\": [\n      19,\n      31\n    ]\n    ],\n    \"user_mentions\"\
    : []\n  },\n  \"in_reply_to_user_id_str\": null,\n  \"contributors\": [\n    14927800\n\
    \  ],\n  \"text\": \"Along with our new #Twitterbird, we've also updated our Display\
    \ Guidelines: https://t.co/Ed4omjYs ^JC\",\n  \"retweet_count\": 66,\n  \"in_reply_to_status_id_str\"\
    : null,\n  \"id\": 210462857140252672,\n  \"geo\": null,\n  \"retweeted\": true,\n\
    \  \"possibly_sensitive\": false,\n  \"in_reply_to\": {\n    \"user\": {\n   \
    \   \"id\": 210462857140252672,\n      \"id_str\": \"210462857140252672\",\n \
    \     \"name\": \"Twitter API\",\n      \"screen_name\": \"twitterapi\",\n   \
    \   \"location\": \"San Francisco, CA\",\n      \"description\": \"The Real Twitter\
    \ API. I tweet about API changes, service issues and happily answer questions\
    \ about Twitter. Don't get an answer? It's on my website.\",\n      \"profile_image_url\"\
    : null,\n      \"profile_image_url_https\": null,\n      \"followers_count\":\
    \ 121963,\n      \"friends_count\": 31,\n      \"following\": true,\n      \"\
    statuses_count\": 3333,\n      \"protected\": false,\n      \"verified\": true,\n\
    \      \"verified_ true,\n      \"time_zone\": \"\n Time\n\n\"utc_offset\": -28800,\n\
    \      \"geo_enabled\": true,\n      \"background_image_url\": null,\n      \"\
    background_image_url_https\": null,\n      \"background_color\": \"DEEF6\",\n\
    \      \"border_color\": \"C0ED\",\n      \"text_color\": \"333333\",\n      \"\
    lang\": \"en\",\n      \"profile_use_background\": true,\n      \"listed_count\"\
    : 10774\n    },\n    \"in_reply_to_status_id\": null,\n    \"in_reply_to_status\"\
    : null\n  },\n  \"source\": \"web\"\n}\n```\n\nRemember that the above is all\
    \ of the metadata associated with just one tweet. Imagine that instead of having\
    \ one JSON block like the above, you have thousands, all with different data inside.\
    \ It would be simpler if you could get all the information you need and not have\
    \ to dig through ten thousand lines of curly brackets, right? Well, Ruby can help\
    \ you do that.\n\nBefore you can begin working with JSON, you will need to install\
    \ one of the JSON libraries created for Ruby. If you haven’t already, you will\
    \ need to run `gem install 'json'`. Then, at the top of your text document, include\
    \ `require 'json'`. Open a valid JSON file in Ruby:\n\n```ruby\nfile = open('test.json')\n\
    json = file.read\ndata = JSON.parse(json)\n```\n"
