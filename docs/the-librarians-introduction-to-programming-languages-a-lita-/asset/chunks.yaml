    \ cars that purred like tigers and were highly optimized for the road ahead of\
    \ them, the sheer expertise and meticulous effort required was a barrier to wider\
    \ adoption of programming by the masses.\n\nMicrosoft recognized that a key to\
    \ the success of its `.NET` framework was adoption by developers—as many developers\
    \ as possible—and that the C# language must therefore strike a balance between\
    \ power of expression, control over the programming environment, and ease of use.\
