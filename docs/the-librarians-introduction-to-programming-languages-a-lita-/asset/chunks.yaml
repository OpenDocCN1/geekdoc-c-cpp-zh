- fmt: '

    Schwartz, Randal L., Brian D. Foy, and Tom Phoenix. 2011\. Learning Perl. 6th
    ed. Sebastopol, CA: O’Reilly Media. Offers a very practical approach to the mechanics
    of `Perl`, focusing on cumulative knowledge as the chapters move along. Excellent
    introduction to learning `Perl`. May need to have a book on general programming
    nearby, as this does not introduce programming concepts per se.


    ## PHP


    [C4Learn.com](http://C4Learn.com). [http://www.c4learn.com/php/php-syntax/](http://www.c4learn.com/php/php-syntax/).
    Well-designed site with table of contents always visible on left side. Leads the
    user through the basics to more complicated programming with easy-to-follow examples.


    PHP The Right Way. [http://www.phptherightway.com](http://www.phptherightway.com)/.
    Covers a multitude of basics through advanced information, including templates,
    errors and exceptions, servers and deployment, and additional resources.


    ## SQL


    Forta, Ben. 2012\. SQL in 10 Minutes. 4th ed. Indianapolis: Sams. Provides solid
    background for beginners to use `SQL`. Most-common statements and clauses. Defines
    terms well. Introduces some advanced topics at the end to show what `SQL` can
    do. Teaches by example using the major DBMSs: `MYSQL`, `SQL Server`, `Oracle`,
    and `DB2`. The downloadable material along with the step-by-step instructions,
    and the two free database utilities, help cement the information.


    ## C


    Perry, Greg, and Dean Miller. 2013\. C Programming Absolute Beginner’s Guide.
    3rd ed. Indianapolis: Que. This is a great book for beginners that starts from
    the basics and leads the user into more advanced topics. The authors have broken
    the topics into short chapters that provide strong and diverse examples. Content
    is written for nontechies.


    ## C#


    Miles, Rob. 2015\. The C# Programming Yellow Book. [http://www.robmiles.com/c-yellow-book/](http://www.robmiles.com/c-yellow-book/).
    Also available as an Amazon Kindle ebook. Provides specifics regarding the `C#`
    language and offers a good background in recommended practices for professional
    programming. Well written and easy to follow.


    Using the Visual C# Development Environment. [https://msdn.microsoft.com/en-us/library/ms173063.aspx](https://msdn.microsoft.com/en-us/library/ms173063.aspx).
    Good coverage of the interplay between `Visual Studio 2015` and `C#`.


    ## Java


    Eck, David J. Introduction to Programming Using Java. 7th ed. [http://math.hws.edu/javanotes](http://math.hws.edu/javanotes)/.
    Freely available, regularly updated. Developed exclusively for beginners. Provides
    a decent overview of programming concepts as well as an introduction to programming
    in `Java`.


    Sedgewick, Robert, and Kevin Wayne. 2007\. Introduction to Programming in Java:
    An Interdisciplinary Approach. New York: Pearson. Very well-designed book aimed
    at beginners. Includes solid explanations of programming terms and concepts. Coding
    examples are practical and illustrate a particular point or technique to solidify
    the text.


    ## About the Editor and Contributors


    Beth Thomsett-Scott has nearly twenty years of experience as a science librarian
    and currently serves as the engineering librarian at the University of North Texas
    (UNT). She has been with UNT since 2001, when she relocated from Canada. She is
    passionate about providing library users with the ability to find, access, and
    utilize the information they need. Her research interests include website usability,
    user needs and satisfaction studies, and coaching/mentoring library employees.
    Thomsett-Scott has served extensively with the Science and Technology Section
    of the American Library Association, the Texas Library Association, and several
    other regional and national organizations, including serving as a chair of divisions/sections
    and as a secretary and chairing a variety of committees. Her current service focus
    is the Engineering and Sci-Tech Divisions of the Special Libraries Association,
    where she serves in several roles. She has edited two books and has a variety
    of publication and presentation credits.


    Jason Bengtson is the innovation architect at the Texas Medical Center Library
    in Houston, Texas. He holds an MLIS and MA from the University of Iowa and the
    University of New Mexico, respectively. He has held a number of technology-focused
    library positions, including emerging technologies/R&D librarian for the University
    of New Mexico Health Sciences Library and Informatics Center and head of Library
    Computing and Information Systems at the University of Oklahoma’s Robert M. Bird
    Library. He has published on a number of diverse topics, including a theoretical
    model to apply concepts of complexity science to metadata. Bengtson has built
    extensively with a wide assortment of languages and frameworks, including `JavaScript`,
    `jQuery`, `jQuery UI`, `Bootstrap`, `AngularJS`, `HTML5`, `CSS3`, `PHP`, `XSLT`,
    `MySQL`, `ColdFusion`, and `Python`.


    Ashley Blewer is a web developer and archivist. She holds an MLIS as well as a
    bachelor’s of art in graphic design from the University of South Carolina. She
    is a graduate of the Flatiron School’s Web Immersive program and works as an independent
    consultant for digital archives and access to archival material, with an emphasis
    on audiovisual formats. She has previously worked in the private sector as an
    integrations engineer and at the University of South Carolina Moving Image Research
    Collections as a cataloging manager. She is a contributor to Bay Area Video Coalition’s
    `QC Tools`, an open-source video quality-control software, and PREFORMA’s video
    file conformance checker project, `MediaConch`.


    Amanda Cowell is the emerging technologies librarian at the College of New Jersey.
    She has a BS in computer science from Stevens Institution of Technology and an
    MLIS and MBA from Rutgers University. Cowell previously worked as the technical
    lead for the Brooklyn Heritage Project at the Brooklyn Public Library and as a
    digital archivist at Rutgers University. Prior to becoming a librarian, she worked
    for several years as a software design and development engineer for Lockheed Martin.


    Heidi Frank is the electronic resources and special formats cataloging librarian
    at New York University. She has been a cataloger for more fifteen years, primarily
    working in traditional services departments using the leading cataloging standards—`MARC`,
    `AACR2`, and `LCSH`. Over the past three years, `Python` scripting has become
    her primary tool for working with `MARC` data in order to improve quality control,
    batch processes, and create more efficient workflows, often through automation.
    She has published and presented on `PyMARC` and `Python` as tools for cataloging.
    She also serves on relevant professional committees.


    Charles Ed Hill is the systems and digital services librarian at Westfield State
    University in Westfield, Massachusetts. Since finishing his MLS at Indiana University
    in 2012, Hill has spent many hours figuring out how to save a few minutes with
    code and enhancing user experience and accessibility one navigation bar at a time.
    He is current exploring `Python` for tool building and fun, as well as `JavaScript`
    and `PHP`.


    Lauren Magnuson serves as the systems and emerging technologies librarian at California
    State University, Northridge. She has an MA in information science and a MEd in
    educational technology, both from the University of Missouri, as well as a BA
    in philosophy from Tulane University. Her interests include `PHP`, `Python`, `analytics`,
    and data visualization, as well as promoting open-source technology in academic
    libraries.


    Emily R. Mitchell has an MLS from Indiana University and an MA in educational
    technology from Central Michigan University. She is currently the webmaster librarian
    at SUNY Oswego’s Penfield Library and has worked previously as a programmer for
    Marick Learning and as a librarian at Ferris State University. Her research focuses
    on user experience on library websites.

