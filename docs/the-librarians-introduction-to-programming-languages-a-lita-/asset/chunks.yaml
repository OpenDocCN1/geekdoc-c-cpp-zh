- fmt: "\nFor example, data stored within Koha’s open-source ILS can be queried directly,\
    \ and Koha users have gathered extensive documentation for writing custom queries\
    \ ([http://wiki.koha-community.org/wiki/SQL_Reports_Library](http://wiki.koha-community.org/wiki/SQL_Reports_Library)).\
    \ Reports typically involve pulling data out of the database or, as an SQL user\
    \ would say, selecting that data. Queries in Koha can vary somewhat from straightforward\
    \ SQL requests, but the basic syntax will quickly become familiar to you as you\
    \ get to know SQL. The Koha example below retrieves a specific MARC tag (stored\
    \ as `MARCXML`) from Koha’s `biblioitems` table ([http://wiki.koha-community.org/wiki/SQL_Reports_Library](http://wiki.koha-community.org/wiki/SQL_Reports_Library)#Query_MARC):\n\
    \n```sql\nSELECT\n    ExtractValue((\n        SELECT marcxml\n        FROM biblioitems\n\
    \        WHERE\n            biblionumber=14),\n        '//datafield[@tag=\"952\"\
    ]/subfield[@code>=\"a\"]') AS ITEM;\n```\n\nInnovative Interfaces’ Sierra ILS\
    \ allows libraries to create custom applications that directly query the library’s\
    \ PostgreSQL database in order to create new services or reporting mechanisms.\
    \ For example, see this Ruby on Rails application that supports record models\
    \ in Sierra’s PostgreSQL database: [https://github.com/uclibs/active_sierra](https://github.com/uclibs/active_sierra).\
    \ Documentation for Sierra customers (authentication required) is available here:\
    \ [http://techdocs.iii.com/sierradna/app](http://techdocs.iii.com/sierradna/app).\
    \ With knowledge of SQL, a library could, for example, “write a script or application\
    \ that pulls acquisitions transactions data out to load into an external accounting\
    \ system” ([http://blog.sierra.iii.com/feature](http://blog.sierra.iii.com/feature)-spotlight-sierradna-application).\n\
    \n## Content Management and Digital Asset Management Systems\n\nMany of the most\
    \ popular content management systems utilized by libraries (Connell 2013) utilize\
    \ `MySQL`, including the following:\n\n*   WordPress\n*   Drupal (can also use\
    \ `PostgreSQL` or `SQLite`)\n*   LibGuides\n*   Fedora Commons–backed digital\
    \ asset management systems, including `DSpace`, `Hydra`, and `Islandora` (which\
    \ also uses `Drupal`). These repositories can use a variety of RDBMSs, including\
    \ `MySQL`, `PostgreSQL`, `SQLite`, `Oracle`, and `MS SQL server`. Visit [https://wiki.duraspace.org/display/FEDORA37/Installation](https://wiki.duraspace.org/display/FEDORA37/Installation)+and+Configuration#InstallationandConfiguration-PrepareDatabase\n\
    \nFor administrators of library CMSs, knowledge of SQL syntax and schemas is essential\
    \ for troubleshooting problems within the application, backing up and recovering\
    \ data in the CMS database, and writing additional customizations, such as `Drupal`\
    \ modules or `WordPress` plug-ins that store and access additional data in the\
    \ existing CMS database. For a list of library-centric Drupal modules, see [https://groups.drupal.org/libraries/modules](https://groups.drupal.org/libraries/modules).\n\
    \nAdditional library applications include the following:\n\n*   Guide on the Side,\
    \ a tutorial application developed at the University of Arizona, utilizes `MySQL`\
    \ to store tutorial data, metadata, and user information ([http://code.library.arizona.edu/gots](http://code.library.arizona.edu/gots)/).\n\
    *   Illiad, Odyssey, and Ares (OCLC/Atlas Systems) resource-sharing systems all\
    \ utilize `Microsoft SQL (MS SQL)` server.\n*   SFX (ExLibris) link resolver software\
    \ utilizes `MySQL`.\n\n## Pros and Cons\n\nSQL exists to deal with persistent\
    \ data, but of course there are other alternatives. For example, if all you need\
    \ is a relatively short list of names and addresses, an alphabetical list in a\
    \ word-processing document (a flat file) will be enough for you. In that case,\
    \ there’s no point in going through the work to set up an SQL database. The minute\
    \ you go beyond that, though, SQL comes into its own.\n\nImagine that your library’s\
    \ ILS is made up of flat files. What would this mean for basic circulation tasks?\
    \ You might have a document that lists all the valid patrons, ordered by their\
    \ library card numbers. When someone comes to the checkout desk and shows you\
    \ her card, you open up that document and scan it until you find the corresponding\
    \ entry in the document. Then you type in all the information about the book that\
    \ person wants to check out, including its due date.\n\nThis might be slow, but\
    \ is it really so bad? It might not seem too bad for this very basic task, but\
    \ real life gets more complicated very quickly. For instance, what if you have\
    \ several people working the checkout desk at once? A regular word-processing\
    \ document won’t be able to handle input from several workers on different computers\
    \ at the same time.\n\nFurthermore, consider what will happen when you want to\
    \ know how many videos are currently overdue. You can manually go through your\
    \ document and count overdue videos, but that will take far more time than anyone\
    \ has to spare. You could try to write a program that could determine this, but\
    \ writing a program that could handle this query would be complicated undertaking.\n\
    \nCompare this to solving the same problem using SQL. It’s true that with SQL,\
    \ initial setup will be more complicated than just opening a document. You’ll\
    \ need to begin by installing SQL and then figuring out data schema, which is\
    \ a way of consistently representing the data you want to capture. In this case,\
    \ your schema should include a table about patrons (their names, library card\
    \ numbers, and addresses). You’ll also want a table of materials that includes\
    \ information such as what type of item it is, its title, author, and so on. You’ll\
    \ want a third table, too, showing what is checked out, who checked it out, and\
    \ when it is due. You could draw a picture of your schema that looks like figure\
    \ 7.1.\n\n![](EBPS/image/Figure_7.jpg\n\nFigure 7.1. Example of SQL schema.\n\n\
    The fields listed in each box will become columns in a table when you implement\
    \ this in SQL. Each patron’s information will be a row in the table of patrons;\
    \ each book or video will be a row in the table of materials; each item checked\
    \ out will get a row in the table of checked items, from which it can be removed\
    \ when the item is returned.\n\nOnce you’re done setting up your SQL database,\
    \ though, you’ll be able to work much more quickly than you would have been able\
    \ to work with your word-processing file. Want to look up someone by library card\
    \ number? Query the database to select the whole entry in the patron table where\
    \ the `cardnumber` matches. Want to run a report telling you what videos are currently\
    \ overdue? Join the `materials` and `checkedout` tables and select just the videos\
    \ whose `duedate` has passed.\n\nIn short, flat files are\n\n*   Easy to set up\
    \ and understand\n*   Difficult to keep current and accurate\n*   Nearly impossible\
    \ to use for running reports\n\nSQL is\n\n*   More complicated to set up\n*  \
    \ Easy to keep current and accurate\n*   Easy to use for running reports\n\nNoSQL\
    \ databases share SQL’s basic strengths. However, compared to SQL, their strengths\
    \ and weakness are more subtle, in part because there are so many types of NoSQL\
    \ databases. Different types of NoSQL have their own pros and cons. It’s easier\
    \ to say under what circumstances you might consider researching some type of\
    \ NoSQL. You might be interested in NoSQL if\n\n*   you will be working with vast\
    \ amounts of information (many terabytes), spread out over many different servers/computers;\n\
    *   you expect to have to merge your database with someone else’s database, which\
    \ has been set up differently from yours.\n\nOn the other hand, you most likely\
    \ will want to stick with SQL if\n\n*   you need every transaction in the database\
    \ to succeed before you move on to the next transaction.\n"
  raw: 'For example, data stored within Koha’s open-source ILS can be queried directly,
    and Koha users have gathered extensive documentation for writing custom queries
    ([http://wiki.koha-community.org/wiki/SQL_Reports_Library](http://wiki.koha-community.org/wiki/SQL_Reports_Library)).
    Reports typically involve pulling data out of the database or, as an SQL user
    would say, selecting that data. Queries in Koha can vary somewhat from straightforward
    SQL requests, but the basic syntax will quickly become familiar to you as you
    get to know SQL. The Koha example below retrieves a specific MARC tag (stored
    as MARCXML) from Koha’s biblioitems table ([http://wiki.koha-community.org/wiki/SQL_Reports_Library](http://wiki.koha-community.org/wiki/SQL_Reports_Library)#Query_MARC):


    SELECT


         ExtractValue((


            SELECT marcxml


            FROM biblioitems


            WHERE


                biblionumber=14),


                ''//datafield[@tag="952"]/subfield[@code>="a"]'') AS ITEM;


    Innovative Interfaces’ Sierra ILS allows libraries to create custom applications
    that directly query the library’s PostgreSQL database in order to create new services
    or reporting mechanisms. For example, see this Ruby on Rails application that
    supports record models in Sierra’s PostgreSQL database: [https://github.com/uclibs/active_sierra](https://github.com/uclibs/active_sierra).
    Documentation for Sierra customers (authentication required) is available here:
    [http://techdocs.iii.com/sierradna/app](http://techdocs.iii.com/sierradna/app).
    With knowledge of SQL, a library could, for example, “write a script or application
    that pulls acquisitions transactions data out to load into an external accounting
    system” ([http://blog.sierra.iii.com/feature](http://blog.sierra.iii.com/feature)-spotlight-sierradna-application).


    Content Management and Digital Asset Management Systems


    Many of the most popular content management systems utilized by libraries (Connell
    2013) utilize MySQL, including the following:


    *   WordPress


    *   Drupal (can also use PostgreSQL or SQLite)


    *   LibGuides


    *   Fedora Commons–backed digital asset management systems, including DSpace,
    Hydra, and Islandora (which also uses Drupal). These repositories can use a variety
    of RDBMSs, including MySQL, PostgreSQL, SQLite, Oracle, and MS SQL server. Visit
    [https://wiki.duraspace.org/display/FEDORA37/Installation](https://wiki.duraspace.org/display/FEDORA37/Installation)+and+Configuration#InstallationandConfiguration-PrepareDatabase.


    For administrators of library CMSs, knowledge of SQL syntax and schemas is essential
    for troubleshooting problems within the application, backing up and recovering
    data in the CMS database, and writing additional customizations, such as Drupal
    modules or WordPress plug-ins that store and access additional data in the existing
    CMS database. For a list of library-centric Drupal modules, see [https://groups.drupal.org/libraries/modules](https://groups.drupal.org/libraries/modules).


    Additional library applications include the following:


    *   Guide on the Side, a tutorial application developed at the University of Arizona,
    utilizes MySQL to store tutorial data, metadata, and user information ([http://code.library.arizona.edu/gots](http://code.library.arizona.edu/gots)/).


    *   Illiad, Odyssey, and Ares (OCLC/Atlas Systems) resource-sharing systems all
    utilize Microsoft SQL (MS SQL) server.


    *   SFX (ExLibris) link resolver software utilizes MySQL.


    Pros and Cons


    SQL exists to deal with persistent data, but of course there are other alternatives.
    For example, if all you need is a relatively short list of names and addresses,
    an alphabetical list in a word-processing document (a flat file) will be enough
    for you. In that case, there’s no point in going through the work to set up an
    SQL database. The minute you go beyond that, though, SQL comes into its own.


    Imagine that your library’s ILS is made up of flat files. What would this mean
    for basic circulation tasks? You might have a document that lists all the valid
    patrons, ordered by their library card numbers. When someone comes to the checkout
    desk and shows you her card, you open up that document and scan it until you find
    the corresponding entry in the document. Then you type in all the information
    about the book that person wants to check out, including its due date.


    This might be slow, but is it really so bad? It might not seem too bad for this
    very basic task, but real life gets more complicated very quickly. For instance,
    what if you have several people working the checkout desk at once? A regular word-processing
    document won’t be able to handle input from several workers on different computers
    at the same time.


    Furthermore, consider what will happen when you want to know how many videos are
    currently overdue. You can manually go through your document and count overdue
    videos, but that will take far more time than anyone has to spare. You could try
    to write a program that could determine this, but writing a program that could
    handle this query would be a complicated undertaking involving many lines of code.
    In addition, you probably wouldn’t be able to use your document during the time
    your program is running—and running it will very likely take quite a bit of time.


    Compare this to solving the same problem using SQL. It’s true that with SQL, initial
    setup will be more complicated than just opening a Word document and starting
    to type. You’ll need to begin by installing SQL and then figuring out a data schema,
    which is a way of consistently representing the data you want to capture. In this
    case, your schema should include a table of information about patrons (their names,
    library card numbers, and addresses). You’ll also want a table of library materials
    that includes information such as what type of item it is, its title, its author,
    and so on. You’ll want a third table, too, showing what is checked out, who checked
    it out, and when it is due. You could draw a picture of your schema that looks
    like figure 7.1.


    ![](OEBPS/image/Figure_7.1.jpg)


    Figure 7.1\. Example of SQL schema.


    The fields listed in each box will become columns in a table when you implement
    this in SQL. Each patron’s information will be a row in the table of patrons;
    each book or video will be a row in the table of library materials; each item
    checked out will get a row in the table of checked out items, from which it can
    be removed when the item is returned.


    Once you’re done setting up your SQL database, though, you’ll be able to work
    much more quickly than you would have been able to work with your word-processing
    file. Want to look up someone by library card number? Query the database to select
    the whole entry in the patron table where the cardnumber matches. Want to run
    a report telling you what videos are currently overdue? Join the materials and
    checkedout tables and select just the videos whose duedate has passed.


    In short, flat files are


    *   Easy to set up and understand


    *   Difficult to keep current and accurate


    *   Nearly impossible to use for running reports


    SQL is


    *   More complicated to set up


    *   Easy to keep current and accurate


    *   Easy to use for running reports


    NoSQL databases share SQL’s basic strengths. However, compared to SQL, their strengths
    and weakness are more subtle, in part because there are so many types of NoSQL
    databases. Different types of NoSQL have their own pros and cons. It’s easier
    to say under what circumstances you might consider researching some type of NoSQL.
    You might be interested in NoSQL if


    *   you will be working with vast amounts of information (many terabytes), spread
    out over many different servers/computers;


    *   you expect to have to merge your database with someone else’s database, which
    has been set up differently from yours.


    On the other hand, you most likely will want to stick with SQL if


    *   you need every transaction in the database to succeed before you move on to
    the next transaction;'
