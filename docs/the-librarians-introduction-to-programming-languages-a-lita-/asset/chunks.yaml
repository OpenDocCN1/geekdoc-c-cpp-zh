  trans: '


    同样地，开发不同类型的应用程序需要不同的工具。例如，如果你计划开发一个 Android 应用程序，你将需要安装 `Android SDK/ADT Bundle`
    以获取开发 Android 应用程序所需的类和工具。你可以在 [`developer.android.com/sdk/index.html`](http://developer.android.com/sdk/index.html)
    下载此包。不同的 Java 库和开发环境并不会让事情变得复杂，但它们是必要的，以便开发者能够利用其所开发设备的特定功能。例如，Android 移动设备具有多点屏，而为这些设备开发的
    Java 应用程序需要利用各种触摸手势（Deitel, Deitel, and Deitel 2014）。


    如果你用 Java 开发 Web 应用程序，创建一个 `Java applet` 可能比创建一个 `Java console-based application`（控制台应用程序）更有价值。`Java
    applet` 是一个可以嵌入网页的小型应用程序。Applets 是 Web 应用程序的理想选择，因为它们对本地资源的访问有限，这避免了计算机病毒的传播并有助于保护用户隐私。为了构建
    applet，用户需要包含 `Abstract Window Toolkit (AWT)` 和包含 `Applet` 类的 `applet` 包。创建的每个
    applet 都必须 `Applet` 的子类（Schildt 2011）。由于其他工具经常可以更快地执行这些相同的任务，Applets 的人气有所下降，且
    Java applets 在过去面临过一些安全问题，但 Java applets 仍然是 Web 上强大且频繁使用的工具。


    由于 Java 的悠久、流行程度和开源设计，有数百种免费和付费的工具可以帮助 Java 开发者完成任何项目。有用于 Java 开发的工具，例如集成开发环境（`IDEs`），它们将在本章后面的部分进行讨论。广泛存在用于调试和测试代码的工具。还有辅助图形开发的工具。在
    Java 使用的二十年里，开发者在每个方向上测试并扩展了它的局限，寻找 Java 工具来协助任何项目总是值得的。


    ## 优缺点


    尽管 Java 是一门较老的语言，但它在不断演进，并有许多当前应用。它简单、面向对象、架构中立，并且可以移植到几乎任何平台。Java 是原生 Android
    应用程序中使用的语言，也是创建动态 Web 应用程序的语言。如果你想为你的库开发移动应用程序，学习 Java 是必不可少的。


    Java 的历史也增加了一些优势，因为它在过去的二十年里得到了很好的使用和记录。对于 Java 初学者可能想要进行的几乎每项任务，都开发了工具。还有一个庞大的开发者社区为其他用户提供支持。在网上找到操作说明或解决开发过程中遇到的大多数问题的解决方案并不困难。


    虽然脚本语言多年来变得越来越流行，例如 `JavaScript`（与 Java 无关）、`Perl`、`Python` 和 `Ruby` 等，但它们并不适用于大规模编程。脚本语言之所以流行是因为它们使用的结构更容易学习，并允许更快速地开发代码。虽然许多脚本语言正在开发能够增强其能力的改进方案，但用于构建大型应用程序时，它们的可用性仍然显著低得多（Niemeyer
    and Leuck 2013）。


    此外，尽管 Java 设计简单，但它可能是一门难以学习的复杂语言，因为它要求开发者理解面向对象的编程。要真正成为一名 Java 开发者并获得成功，仅仅知道
    Java 语法是不够的；还需要对对象、类和继承有良好的理解。这可能让学习 Java 变成一项比用户最初预期的更大的任务。好消息是，Java 将此变得尽可能简单，许多
    `IDEs` 可以让初学者的开发更容易。


    此外，虽然 Java 是一种开发的可移植语言，但已不能说 Java 可以运行在任何平台上了。`Apple IOS` 不允许 Java 在 iPhone 和
    iPad 等 Apple 设备上运行。这需要为移动端创建非 Java 版本的站点，因为大量的移动用户通过 Apple 设备连接。此外，任何为 Android
    设备用 Java 开发的移动应用程序都需要为 `IOS` 环境重新创建。这对 Java 语言流行程度的影响目前尚不清楚，但显然，Java 的兼容性不再影响产品的使用或流行度。没有
    Java，Web 开发仍将继续。


    ## 环境与设置


    Java 开发的第一步是确保你的机器上安装了 Java。Microsoft Windows 机器已经安装了 Java，Windows 用户可以跳过本段的剩余部分。如果你使用的是
    Mac，你的机器上可能安装了也可能没有安装，取决于你使用的操作系统。测试你是否在 Mac 上运行 Java 的最佳方法是打开 `Terminal` 并输入
    `java -version`。你可能会得到没有 Java 的错误信息，也可能会看到一个指示 Java 版本的数字字符串。例如，如果终端输出 Java 版本
    `1.8.0_45`，则你的机器上运行的是 Java 8。如果你发现没有安装 Java 或版本过旧，请访问此处获取在你的机器上下载最新版本 Java 的指令：[`www.java.com/en/download/help/mac_install.xml`](https://www.java.com/en/download/help/mac_install.xml)。


    Mac 和 Windows 用户的下一步都是安装 `Java Development Kit (JDK)`。`JDK` 是 Java 开发中最广泛使用的软件开发包（`SDK`），由
    Oracle 免费提供。在本书编写时，`Java SE`（标准版）的最新版本 `JDK` 可以在这里找到：[`www.oracle.com/technetwork/java/downloads/index.html`](http://www.oracle.com/technetwork/java/downloads/index.html)。下载
    `JDK` 将安装开发 Java 需要的所有内容，包括 `Java Virtual Machine`。


    安装完成后，Java 准备就绪，但在开始编程之前，你需要选择一个文本编辑器。虽然 Java 软件文件只是文本文件，可以在任何文本编辑器中编辑，但有很多选项供选择。如果你已经是一个经验丰富的程序员，可以继续使用过去使用的文本编辑工具。另一种，`IDEs`
    在入门阶段非常有用，特别是如果你对软件开发不太熟悉，因为它们可以帮助你构建、编辑、调试和编译应用程序。


    有很多非常适合入门的 IDE 选项。有些 `IDEs` 只在 Mac 上运行，有些只在 Windows 上运行，许多是跨平台的。既有免费的 `IDEs`，也有通过许可费用提供更复杂功能的付费
    IDE。有些 `IDEs` 适用于小型程序，而另一些则更适合更大更复杂的项目。有许多需要考虑的因素，每个工具都有其优缺点。


    一个很好的入门 IDE 是 `Eclipse`。`Eclipse` 并不一定适合每个人的环境，但 `Eclipse` 有许多优势。`Eclipse` 可以在
    Windows 或 Mac 上使用，是开源免费的，并且内置了 Android 开发工具，这可以使其成为初级 Android 开发者的很好的工具。它也是开发本章示例代码所使用的工具。


