    Codd’s paper was very theoretical and didn’t actually come up with a programming
    language that could do the things he was describing. He had groundbreaking ideas,
    but many people doubted those ideas could ever work, much less work efficiently
    (Anthes 2010). It would be some years before Codd’s employer, IBM, reorganized
    its database research teams and set them to work on `System R`, a new database
    system based on Codd’s ideas (Biancuzzi and Warden 2009). It would be a few more
    years after that before Patricia Selinger published a paper showing how systems
    using Codd’s relational model could be made efficient enough to stand against
    their competition (Anthes 2010).


    `System R` was a project that would change databases forever. Selinger was one
    member of the `System R` team, with two others being Donald Chamberlin and Ray
    Boyce. Chamberlin and Boyce were assigned to develop the query language to bring
    Codd’s ideas to life. These two researchers had a number of goals for their new
    language, including that it should do the following:


    *   use English keywords that are easy to understand;

    *   allow users to create databases; control who has access to them; and let users
    add, subtract, and query information;

    *   be functional on its own, but also play well with other programming languages
    (Biancuzzi and Warden 2009).


    Chamberlin and Boyce called their language `SQL` and published a paper on it,
    sharing their language with the world. This enabled other groups to move forward,
    implementing `SQL` at the same time IBM was. In fact, the first commercial `SQL`-based
    product to appear on the market wasn’t from IBM at all—it was the product `Oracle`,
    from Relational Software Inc., which later went on to become Oracle Corporation.
    `Oracle` version two, the first version released to the public, came out in 1979
    (Preger 2012). `Oracle` is still a major player in the database world today.


    Since so many groups were creating their own systems based on `SQL`, `SQL` became
    an international standard for creating and managing relational databases in 1986.
    These standards have been updated and improved on through the years, adding features
    and solving problems (Preger 2012). However, compliance with the standard beyond
    a basic level has been an ongoing problem since every group implementing `SQL`
    has done so differently (Sheldon and Moes 2005).


    As a result, there are many different dialects of `SQL` available to database
    developers today. Two of the most common types of `SQL` used in the library world
    are `MySQL` and `PostgreSQL`. As with dialects of a spoken, human language, these
    dialects are similar enough that a developer can understand most of what is said
    in an unfamiliar dialect without hardship. However, true fluency in a given dialect
    takes some effort. What this means is that all `SQL` databases will store information
    in tables, with each row in a table representing a separate entry, but the exact
    wording used to add information to the table, or select information out of the
    table, and other processes, will be different from dialect to dialect. Examples
    in this chapter will be given for `MySQL`.


    It is also worth noting that there have been further advances in the world of
    database systems in recent years. Various types of `NoSQL`, or `Not Only SQL`,
    have been gaining momentum for scaling up to deal with large data sets (Vaish
    2013). Some big names in the `NoSQL` world currently are `MongoDB`, `CouchDB`,
    and `Hadoop`, among many others.


    This is not to say that `SQL` databases aren’t worth investing the time to learn.
    Libraries have a lot invested in `SQL` databases. Most of our systems run on them,
    and anyone who wants to do any programming in the library world is very likely
    to encounter some flavor of `SQL` sooner than later.


    ## Environment and Setup


    The `SQL` language is a standard that is widely implemented across various relational
    database management systems, or `RDBMSs`. In order to use `SQL`, you’ll need access
    to an `RDBMS`. For those who want to experiment with using `SQL` queries without
    necessarily installing a local `RDBMS` environment on a server or other computer,
    the University of Washington has developed an innovative project called `SQLShare`
    that enables users to upload data and run `SQL` queries freely through the `SQLShare`
    interface. Several examples used in this chapter can be run utilizing the `SQLShare`
    platform.


    If you want to really dig into learning and applying `SQL`, though, you’ll probably
    want to install a local `RDBMS` environment. Examples of these environments include
    `MySQL`, `SQLite`, or `PostgreSQL`. All three of these are popular open-source
    `RDBMSs` that can be downloaded for free and installed on a server or other computer.


    `MySQL` is an integral part of a common server setup (or stack) known as `LAMP`
    (Linux Apache MySQL PHP). A `LAMP` server utilizes a Linux operating system, an
    Apache web server to deliver content via a web browser, a `MySQL` `RDBMS`, and
    `PHP` to write applications. Thus, if you have access to a `LAMP` server, it already
    has `MySQL` installed and ready to go.


    Analogous software packages that can be installed on OS X or Windows computers
    include `MAMP` (for Mac OS X), or `WAMP/XAMPP` (for Windows). Such stacks are
    often used to develop software on your own computer rather than a server. If you
    have installed `MAMP` or `WAMP`, you can use it to turn on a web server hosted
    on your own machine, which allows you to “host” web pages and web applications
    on your own computer (referred to as “localhost”).


    When you’re using `MySQL`, it’s good to keep in mind that `MySQL` itself is designed
    for command line interaction and does not have a native graphical user interface
    (GUI). However, tools exist to shield `MySQL` users from having to use the command
    line. For example, `phpMyAdmin` is a common `MySQL` interactive interface that
    is packaged with `LAMP`-style software stacks. `phpMyAdmin` can be used to create
    and delete (“drop”) `MySQL` databases and tables without requiring command line
    interaction.


    That being said, knowledge of the `MySQL` command line is useful when working
    with custom applications. Extensive documentation for interacting with the `MySQL`
    command line is available ([`http://dev.mysql.com/doc/refman/5.5/en/mysql.html`](http://dev.mysql.com/doc/refman/5.5/en/mysql.html)).
    A sample of command line operations used with `MySQL` are provided in the “Examples”
    section of this chapter.


    ## Uses


    `SQL` environments are present in a variety of applications utilized in libraries,
    including integrated library systems (ILSs) and resource sharing systems, website
    content management systems (CMSs), digital asset management systems (DAMSs), and
    more.


    ### Integrated Library and Discovery Systems


    `SQL` is found in multiple integrated library and discovery systems, including
    these:


    *   `Koha` open-source `ILS` (`MySQL`)

    *   `Evergreen` open-source `ILS` (`PostgreSQL`)

    *   `Sierra` Innovative Interfaces Inc. `ILS` (`PostgreSQL`)

    *   `Intota` ProQuest `ILS` (Microsoft SQL)

    *   `VuFind` open-source discovery interface (`MySQL`)


    Within `ILS` and discovery applications, an understanding of `SQL` syntax is increasingly
    useful in order to customize data gathering from these systems. Knowledge of `SQL`
    syntax can enable libraries to gather and report data that may not be directly
    built into the software as a “canned” report.

