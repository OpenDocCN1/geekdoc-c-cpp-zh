  raw: 'Line 12 compares the value entered by the user to the magical super user account
    name. C compares strings in a canonical way—character by character—and gives you
    the difference as an integer value. Thus, two identical strings have a difference
    of 0\. In this case, if it checks out super_user is set to 1 or true. Line 16
    denotes that if super_user is true, we know the user has special privileges, so
    we let him or her know about it using a printf statement. Line 22 allows us to
    conclude the main function without compilation error by returning an arbitrary
    integer 0 (line 23). Much like with the string compare, we use 0 here to mean
    successful, unlike the check of super_user, where a nonzero number means success.
    Yup, another C-ism in action.


    This example is a contrived one to demonstrate the ability C has to create something
    called a buffer overflow. Buffer overflows happens when you cram too much data
    into a series of memory locations and something odd happens as a consequence.
    This simple program first asks for someone to enter a username. If that username
    is bob, then it grants that user super privileges. However, this program is exploitable.
    The author of the software thought that a username would only be ten characters
    long. However, if you were an enterprising individual, you could find out that
    if you entered in a username longer than ten characters, the program tries to
    cram in all of those characters into ten spots and it dribbles out into adjacent
    memory and causes all sorts of problems. In this case, it shortcuts the attempt
    to compare the entered user name to “bob” and sets super_user to 1 if that is
    the case. To beat this example even more over the head, the GCC line used to compile
    the program is a bit different than what we have seen so far. In this case, we
    are telling the compiler explicitly not to check against buffer overflows.


    Mystery Code


    If C looks confusing, well, that’s because it is. As demonstrated previously,
    accessing everything in C is done at a very low machine level, down to the point
    of looking directly at memory locations. The data structures that you are given
    are pretty minimal, basically a continuous block of memory you need to very carefully
    reference. These low-level specifications create code that works well, but the
    trade-off is code that can be totally unreadable. This incongruence is taken to
    a shocking extreme with a series of events C coders participate in. For example,
    the Underhanded C Contest is a competition in which entrants have to create a
    piece of code that seems benign but actually performs some dubious function. In
    a previous year’s contest, the goal was to create software to emulate an airline
    luggage processing system that must secretly reroute certain luggage if a particular
    free text note is applied to the record. The code also had to be written in a
    way that someone looking at it couldn’t divine its purpose.


    Another gem is the International Obfuscated C Code Contest. Take, for instance,
    this code block, which is a slight modification of some code that was submitted
    in 1990\. Enter the following in a file called mystery.c:


    #include<stdio.h>


    v,i,j,k,l,s,a[99];


    main()


    {


    for(scanf("%d",&s);*a-s;v=a[j*=v]-a[i],k=i<s,j+=(v=j<s&&(!k&&!!printf(2+"\n\n%c"-(!l<<!j),"
    #Q"[l^v?(l^j)&1:2])&&++l||a[i]<s&&v&&v-i+j&&v+i-j))&&!(l%=s),v||(i==j?a[i+=k]=0:++a[i])>=s*k&&++a[--i])


       ;


    }


    Without a clear hint and some diagrams and polite description, it would most likely
    be impossible to infer the meaning of this code. The organizers of the contest
    have provided some hints on how to run this and what the results should look like.
    The code-entry-and-compiling step is shown here:


    >nano mystery.c


    >gcc matery.c


    mystery.c:2:1: warning: data definition has no type


         or storage class [enabled default]


    >echo 8 | ./a.out


    You will probably get a bit of an error message, but it is safe to ignore. Before
    moving to the description and final product of this, let us look at the last line:


    echo 8 | ./a.out


    Here is another perfect example of how tightly coupled C is with UNIX. If we read
    this line left to right, echo is the name of the UNIX utility that echoes to the
    screen whatever follows it. 8 is what you expect it to be, the numeral 8\. Next
    is the | symbol. In UNIX, this is a command line argument that essentially says
    take the output of the program on the left (a numeral 8 presented to the screen)
    and use it for the input of the next program, in our case the mysterious code
    we just compiled. This process is called piping. You can pipe the output of pretty
    much any UNIX command into any other UNIX command, which makes it possible to
    do very complicated operations on the computer in short order. Have a look at
    the output our example generates. Before reading on to see the description, can
    you determine what the code is doing by viewing this?


     # #Q# #


    # Q # #


    Q# # # #


    # # # Q


     # Q # #


    # # #Q#


     # # # Q


    # Q # #


    Q# # # #


    # # #Q#


     Q # # #


    # # Q #


     # # #Q#


    # #Q# #


     # # # Q


    # #Q# #


    Q# # # #


    # Q # #


     # # Q #


    #Q# # #


     # # #Q#


    # # Q # >


    In short, this code is displaying all the solutions to the “8 Queens” problem.
    This is where you take a chess board and try to place eight Queen pieces on the
    squares so that none of the Queens are attacking one another. I didn’t get that
    either from looking at the code. In our emoticon-style diagram, a space represents
    a white square, a # is a dark square, and the Q is a Queen piece. The good thing
    about this code is that it finds the solutions for the Queens problem for whatever
    number you feed into it. You simply change the number from eight to something
    else. After you click the enter button on the last line, a large string of text
    will zip past the screen. This is actually a UNIX command called more, which will
    only output a screen full of text before stopping and requiring the user to hit
    the space bar before showing another screen full of text. Knowing what you know
    about the | operator, how can you modify our line from above to pipe the output
    from our compiled code into the more command? The answer to this is left as an
    exercise for the reader.


    Summary


    This has been a whirlwind introduction to C that has emphasized how the language
    is used in a Linux-based system and demonstrated the primary uses you might implement
    with the language. The takeaway is that C is great at hardware programming, a
    situation where you want a really low-level interaction with the computer. You
    probably would not want to use the language for any HTML work. It isn’t a plausible
    tool for something like that. C takes some work to understand, but the effort
    invested will pay dividends as you’ll be able to program well since C forces you
    to write everything with simple data structures. You will also develop a strong
    understanding of the underlying operating system and where and how things are
    allocated in memory. These are the major tenets of C and, as time has demonstrated,
    are enduring qualities that keep the language relevant to this day. In other words,
    the more time you spend learning C, the easier every other language will be to
    understand.


    Bibliography


