  raw: 'To demonstrate the power of JavaScript’s functions, let’s look at using functions
    as parameters. One can pass a function to another function as a parameter due
    to its first-class status. For instance, consider a function that does some data
    processing which can either complete successfully or encounter an error, perhaps
    due to being passed incorrectly formatted data initially. One can write a processData
    function that accepts two functions as parameters; one that is called if the processing
    is successful and given the now-processed data as a parameter, and one that is
    called if an error occurs that is given the error as a parameter. This provides
    enormous flexibility, since, rather than specifying error or success behavior
    within the processing function itself, these cases can be broken out into separate
    functions that can differ over the course of the program. One can call processData
    in one context with a very stringent error-handling function that causes the whole
    program to halt, and then call it again in another context where the user is notified
    of errors and given a chance to correct his or her input.


    Passing functions as parameters to other functions is a common property of asynchronous
    programming. Asynchronous programs do not execute from top to bottom in the order
    they are written; rather, certain “events” can happen at any time and trigger
    corresponding code. Asynchronous programming patterns are common on the web and
    in interface design. In JavaScript, events include receiving data from another
    web server or user interaction, such as mouse movement. Every time information
    suddenly spills onto a web page without a refresh, for instance as a social network
    loads incoming posts, asynchronous JavaScript code is responsible.


    Unfortunately, JavaScript is not a perfect programming language. Unlike other
    languages, where design choices may not suit everyone’s taste but generally have
    a rationale behind them, JavaScript has flaws that even its creator acknowledges.
    Probably the most noticeable flaw in JavaScript is that all variables are, by
    default, global (Crockford 2008). The value of a global variable is its accessibility
    everywhere in a program, as opposed to local variables whose values are only available
    within limited scopes. Overuse of global variables causes bugs because disconnected
    pieces of a program may reuse the same variable name while expecting different
    values. In JavaScript, any variable declared without the var keyword is global.
    Global variables quickly lead to conflicts when multiple scripts by multiple authors
    are combined, as often happens on even relatively simple websites. For instance,
    both the jQuery and Prototype libraries create a global variable named $; if one
    wants to use both libraries on a page, one must take care to avoid conflicts,
    for instance, with jQuery’s noConflict method (jQuery Foundation n.d.-e).


    JavaScript’s type system, while flexible, also contains nuances that make it difficult
    to work with. JavaScript’s comparison operators can be classified as either double
    or triple equals. The double equals compare two variables’ values, while the triple
    equals compare both their values and their type. If this seems obtuse, it is.
    The difference between == and === (and their companions != and !==) is a source
    of confusion. Another common task in programming complicated by JavaScript’s type
    system is determining what data type is stored in a particular variable. In JavaScript,
    how a variable obtained its current value can affect what type the language’s
    typeof operator reports. For instance, a string literal declared like var s =
    ''hi'' has typeof === ''string'' while a string created with the String function
    like var s = String(''hi'') has typeof === ''object'' even though for virtually
    all intents and purposes the two variables are equivalent. For this reason, it’s
    best to use literals for strings, numbers, and regular expressions instead of
    JavaScript’s corresponding String, Number, and RegExp constructor functions. On
    top of these issues, typeof reports object for arrays, whether they were initialized
    with the Array constructor or with a literal, making it difficult to detect that
    data type.


    Since JavaScript’s flaws are relatively well known, useful programs have arisen
    that “lint” your code by looking for common problems. These problems can vary
    from outright syntax errors to code that, while technically correct, can be misleading
    or cause unanticipated side effects. For instance, both of the flaws mentioned
    above can be mitigated by code linters that warn against the use of double equals
    or the built-in constructor functions. While Douglas Crockford’s JSLint was the
    program that popularized JavaScript linters originally, nowadays JSHint is a superior
    option. JSHint is open source, boasts numerous configuration options, and comes
    in a number of flavors, such as code editor plug-ins and a command-line tool (JSHint
    n.d.). The language itself is also trying to address flaws in its design through
    introducing new features that either replace older, broken ones or assist programmers
    in writing safer code. Strict Mode, introduced in ECMAScript 5 in 2009, enforces
    stricter coding standards by turning poor practice into errors, while features
    like [Array.isArray](http://Array.isArray) correct for the aforementioned problems
    with determining a variable’s type (ECMA International 2011, 51, 123; Mozilla
    Developer Network n.d.).


    Environment and Setup


    The Document Object Model (DOM) is a way of visualizing and describing web pages
    and apps. In other words, it is an abstraction of a web page. This is the abstraction
    used to describe web pages and apps in the literature, and, more importantly,
    the particulars of this abstraction are used by browsers when they “interpret”
    the web code a developer writes. This function of a web browser is known as the
    DOM application programming interface (API) (World Wide Web Consortium n.d.).
    Through the DOM API, scripting languages like JavaScript have access to the contents
    of a web document. The DOM, simply put, describes a tree structure, with all of
    the contents in a web page forming a hierarchy of objects (or nodes). Everything
    in a web document, be it a header, a button, or an image, forms an object within
    the document. Some of these objects are part of other objects. A piece of text
    may, for instance, fall below the cell of a table in this hierarchy because that
    cell is where the text is located. To the DOM API, an object begins and ends with
    HTML markup tags.


    A web page or app may look like a single unit, but it is normally built out of
    a number of parts that work together. The website that a user sees is built from
    this collection of languages and runs inside the web browser. In a sense, the
    web browser acts like a computer within a computer. This is known as the “client
    side” of web code, because the source code itself is actually running on the user’s
    computer (the “client”). The three main languages that client-side web code is
    built from are HTML, CSS, and JavaScript. Each of these languages is supposed
    to do a particular job in the client. Because of the limitations of technology,
    staggered historical introduction of these languages, and sloppy web coding, these
    languages have been allowed to bleed into each other a little. However, by restricting
    them to the roles, or scopes, described here, developers will have a better chance
    of building solid pages and apps.


    HTML, the oldest of these languages, is meant to tell the web browser what objects
    in a web page are. HTML markup tells the browser what in the page is a heading,
    what is a paragraph, and how the page is divided into logical sections.'
