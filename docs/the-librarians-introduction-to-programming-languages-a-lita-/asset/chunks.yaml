    public variable. A variable that is visible to all classes.


    regex. Regex (regular expression) is a string or sequence of text or code that
    is used to describe a search pattern. Regexes are useful for searching code to
    find a particular sequence or pattern to update or modify.


    runtime environment. Runtime environment is essentially the configuration of software
    and hardware needed to support the program. Environment support includes CPU type,
    operating system, and other programs or add-ons needed to perform the tasks.


    script. Scripts are sequences of instructions or programs that are read and carried
    out by another program rather than the computer itself or a human operator. This
    enhances the automation of the function(s) being performed.


    scripting language. A scripting language supports the use of scripts.


    software development kit (SDK). A set of software development tools that allows
    the creation of applications for a certain software package.


    strongly or weakly typed language. These terms are often subjective depending
    on the point of view of the individual. However, in general, a strongly typed
    language is one needing each variable or value to be assigned a data type. A weakly
    typed language is more flexible in that data types do not need to be explicitly
    assigned.


    terminal. A terminal allows you to communicate with a computer or web page. Communication
    is bidirectional—sending and receiving information. Usually, a terminal involves
    a display screen and keyboard, although there are more sophisticated terminals.


    type/type system. A programming language with a type system that internally associates
    each data structure with one of an enumerated set of types—which often can be
    added to by the programmer—that each have distinct behaviors and can perhaps only
    be involved in certain kinds of operations. For instance, it is a type system
    that would insist that a text string hello could not be multiplied by the floating-point
    number 1.23.


    XHR/XmlHttpRequest. See AJAX.


    Here are a few websites that may help you as you read through the text:


    [http://www.computerhope.com/jargon.htm](http://www.computerhope.com/jargon.htm)


    [http://www.math.utah.edu/~wisnia/glossary.html](http://www.math.utah.edu/~wisnia/glossary.html)


    [http://www.csci.csusb.edu/dick/cs202/glossary.html](http://www.csci.csusb.edu/dick/cs202/glossary.html)


    [http://www.cs.kent.ac.uk/people/staff/djb/oop/glossary.html](http://www.cs.kent.ac.uk/people/staff/djb/oop/glossary.html)'
