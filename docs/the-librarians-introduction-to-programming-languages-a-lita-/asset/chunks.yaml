    some values to the screen. printf is a pretty versatile function that does more
    than you can imagine. If you provide it a string of text with a % character embedded
    in it, it will take other variables provided as arguments into the spot where
    the % is located. In our first example, we print x using the %d sequence. Another
    C-ism in action: C doesn’t really know what is in any memory address, so by doing
    %d you are telling the interpreter to print the contents of that memory address
    as if it were an integer. You would use %s if you had a string you wanted to put
    in the sequence, %f for float, and so on. The second part is a %p, which stands
    for pointer. The third argument of printf is &x, which is the address in memory
    where x resides. The & operator tells C you want the address of the thing you
    are looking at, not the value of the thing.


    The purpose of this example is to show you just how low in level you can get with
    C code. When we print the two integers, we first print their value. Then we do
    something really obscure: we print the address of the bit of memory where that
    value is stored (for x this is 0x7ffe28fd9a08). This ability to look at the address
    where something is located is a fundamental piece of C, and this mechanism is
