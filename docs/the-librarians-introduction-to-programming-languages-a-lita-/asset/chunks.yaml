    \ 库 ([`github.com/code4lib/ruby`](https://github.com/code4lib/ruby)-oai)；`nypl-collections`，一个用于轻松访问纽约公共图书馆数字收藏的\
    \ gem ([`rubygems.org/gems/nypl`](https://rubygems.org/gems/nypl)-collections)；以及\
    \ `marc`，一个用于（你猜得懂的）处理 MARC 目录记录的 gem ([`rubygems.org/gems/marc/versions`](https://rubygems.org/gems/marc/versions)/1.0.0)\
    \ 。\n\n## 优点与缺点\n\nRuby 语言追求人类可读性，这可能是它最大的优势。Ruby 的目标不仅仅是简单，而是要像英语母语者阅读英语一样自然。Ruby\
    \ 易于理解，但要理解它的全部潜力时却非常复杂。\n\n```ruby\n5.times do\n  puts \"I love Ruby!\"\nend\n\
    ```\n\n有了像这样简单的脚本，即使你没有之前的编程经验，也能猜出将发生什么。这段代码将在屏幕上打印五次 `I love Ruby!`。\n\n安装非常简单，无论是这门语言还是你可能想要安装的任何语言库都是。Ruby\
    \ 在 Mac 上是原生打包的，并为 Windows 或 Linux 机器提供了安装说明。代码库（称为 gems）可以使用命令行上的 `gem install`\
    \ 命令轻松安装。考虑到上述注释，Ruby 是一门非常适合初者的语言，因为初可以学习编程的核心概念，而不会被困难的语法或环境设置错误所困扰。\n\n除了代码本身，Ruby\
    \ 还拥有一个强大且专注的用户和开发者社区。由于 Ruby 是开源的，任何人都可以改进这种语言，或者创建让其他人更容易使用该语言的库。\n\n对于初学者来说，Ruby\
    \ 是一个很好的选择，但取决于学习编程语言的原因，长期来看可能不是最佳选择。例如，Ruby 非常适合开发面向 Web 的代码，但 `JavaScript`\
    \ 是一种为 Web 构建并运行在 Web 之上的强大语言。因此，如果你学习编程的主要目的是制作网站，那么 `JavaScript` 可能是更有效的长期选择。\n\
    \n当涉及到将 Web 扩展到 Facebook 级别的规模时，取决于部署的数据类型以及是否在更新时需要实时运行，Ruby 的速度比所需的要“慢”。然而，Codecademy、AirBNB\
    \ 以及其他主要网站运行在 Ruby on Rails 上。Ruby 中的每个操作——即使是整数加法——都是通过调用方法完成的，因此搜索和调用方法的成本不忽视，特别是对于简单的程序而言。然而，当程序变得更大更复杂时，不会因为方法产生显著的性能差异\
    \ (Matsumoto 2000)。\n\n`JavaScript` 围绕数据可视化构建了更好的库。Ruby 仍然缺乏编写创建复杂可视化代码的能力。这并不是因为\
    \ Ruby 语言本身出了问题，而是遗憾的是，Ruby 程序员还没有构建所需的库。\n\nRuby 和 `Python` 是非常相似的编程语言。如果主要重点是基于科学的学习，`Python`\
    \ 可能比 Ruby 更合适。`Python` 更频繁地用于研究和数据科学，`Python` 社区也支持了这些需求。\n\n## 示例\n\n### 解析\
    \ JSON 数据\n\nJSON 代表 JavaScript 对象表示法（JavaScript Object Notation）。它的构建是为了作为数据从一个系统传输到另一个系统的轻量级方式。其设计目标是便于人类读写，并便于计算机解析和创建。它是基于文本且与语言无关的，这意味着你的\
    \ JSON 可以用于用 Ruby、`Python`、`C++` 和其他语言编写的程序。\n\n以下是从 Twitter API 文档提取的一些 JSON\
    \ 示例 ([`dev.twitter.com/rest/reference/get/statuses/show`](https://dev.twitter.com/rest/reference/get/statuses/show)/:id)：\n\
    \n```json\n{\n  \"coordinates\": null,\n  \"favorited\": false,\n  \"truncated\"\
    : false,\n  \"created_at\": \"Wed Jun 06 20:07:10 +0000 2012\",\n  \"id_str\"\
    : \"210462857140252672\",\n  \"entities\": {\n    \"urls\": [\n      {\n     \
    \   \"expanded_url\": \"https://dev.twitter.com/terms/display-guidelines\",\n\
    \        \"url\": \"https://t.co/Ed4omjYs\",\n        \"indices\": [\n       \
    \   76,\n          97\n        ],\n        \"display_url\": \"dev.twitter.com/terms/display-\\\
    u2026\"\n      }\n    ],\n    \"hashtags\": [],\n    \"text\": \"Twitterbird\"\
    ,\n    \"indices\": [\n      19,\n      31\n    ]\n    ],\n    \"user_mentions\"\
    : []\n  },\n  \"in_reply_to_user_id_str\": null,\n  \"contributors\": [\n    14927800\n\
    \  ],\n  \"text\": \"Along with our new #Twitterbird, we've also updated our Display\
    \ Guidelines: https://t.co/Ed4omjYs ^JC\",\n  \"retweet_count\": 66,\n  \"in_reply_to_status_id_str\"\
    : null,\n  \"id\": 210462857140252672,\n  \"geo\": null,\n  \"retweeted\": true,\n\
    \  \"possibly_sensitive\": false,\n  \"in_reply_to\": {\n    \"user\": {\n   \
    \   \"id\": 210462857140252672,\n      \"id_str\": \"210462857140252672\",\n \
    \     \"name\": \"Twitter API\",\n      \"screen_name\": \"twitterapi\",\n   \
    \   \"location\": \"San Francisco, CA\",\n      \"description\": \"The Real Twitter\
    \ API. I tweet about API changes, service issues and happily answer questions\
    \ about Twitter. Don't get an answer? It's on my website.\",\n      \"profile_image_url\"\
    : null,\n      \"profile_image_url_https\": null,\n      \"followers_count\":\
    \ 12163,\n      \"friends_count\": 31,\n      \"following\": true,\n      \"statuses_count\"\
    : 3333,\n      \"protected\": false,\n      \"verified\": true,\n      \"verified_\
    \ true,\n      \"time_zone\": \"\n Time\n\n\"utc_offset\": -28800,\n      \"geo_enabled\"\
    : true,\n      \"background_image_url\": null,\n      \"background_image_url_https\"\
    : null,\n      \"background_color\": \"DEEF6\",\n      \"border_color\": \"C0ED\"\
    ,\n      \"text_color\": \"333333\",\n      \"lang\": \"en\",\n      \"profile_use_background\"\
    : true,\n      \"listed_count\": 10774\n    },\n    \"in_reply_to_status_id\"\
    : null,\n    \"in_reply_to_status\": null\n  },\n  \"source\": \"web\"\n}\n```\n\
    \n记住，以上是与一条推文相关的所有元数据。想象一下，如果不仅仅是一个 JSON 块，而是成千上万个，每个都包含不同的数据。如果可以获取所有所需的信息而不需要翻阅上万行大括号，将会简单得多，不是吗？Ruby\
    \ 可以帮助你做到。\n\n在开始处理 JSON 之前，你需要安装一个为 Ruby 创建的 JSON 库。如果你还没有安装过，你需要运行 `gem install\
    \ 'json'`。然后，在你的文本文档顶部，包含 `require 'json'`。用 Ruby 打开一个有效的 JSON 文件：\n\n```ruby\n\
    file = open('test.json')\njson = file.read\ndata = JSON.parse(json)\n```\n\n"
- fmt: "\nThe above relies on the `JSON` library to modify the data in the necessary\
    \ way to make it readable by Ruby. Now that the data has been modified, it can\
    \ be organized. Here are some simple things we can do:\n\n```ruby\ndata[0]\n\n\
    # This will return the first tweet in a series\n\ndata[2][\"text\"]\n\n# This\
    \ will return the content of the third tweet in a series\n```\n```\n\nBut what\
    \ if we want to see more than just one tweet at a time? We can loop through the\
    \ entire text to pull out the desired information.\n\n```ruby\ndata.each do |tweet|\n\
    \  p tweet[\"text\"]\nend\n```\n\nThis will return the text (the “tweet” part\
    \ of the tweet) of every `JSON` object. Each tweet has so much associated metadata\
    \ that even more interesting information can be gathered using this similar method,\
    \ like the number of retweets, geographic data, hashtags used, or author descriptions.\n\
    \n Scraping the Web with Nokogiri\n\nWhat is web scraping? Web scraping is programmatically\
    \ pulling data from the Internet so you can use the data in your own applications.\
    \ `Nokogiri` is a Ruby gem that makes it easy to scrape the web for data. It is\
    \ also an easy way to consistently grab data from various sources and have it\
    \ all in one place for analysis. `Nokogiri` (from the Japanese word 鋸, for “saw”)\
    \ is an HTML, XML, SAX, and Reader parser. Among `Nokogiri`’s many features is\
    \ the ability to search documents via `XPath` or `CSS3` selectors ([http://www.nokogiri.org](http://www.nokogiri.org)).\n\
    \nTo use `Nokogiri`, we will also need to use `Open-URI`. `Open-URI` is a module\
    \ in Ruby that allows us to programmatically make http requests. It will allow\
    \ us to easily open and parse the content of an HTML page via the command line.\n\
    \nYou can write a file that performs all of these actions at once, or you can\
    \ step through them with the tutorial using the `IRB`—remember that you can access\
    \ this via the Mac Terminal by typing `IRB` or selecting it from the Start menu\
    \ on a Windows machine. At the top of your file, you will need to `require` both\
    \ of these libraries in order for your program to know that it needs them. This\
    \ is as simple as adding the following lines of code to the top of your text document:\n\
    \n```ruby\nrequire 'nokogiri'\nrequire 'open-uri'\n```\n\nSelect a website of\
    \ interest. For this example, we’ll use the “Visiting the Library” page from the\
    \ Library of Congress (figure 3.1). One you have your page selected, use `Open-URI`\
    \ to open up the site. We do that like this:\n\n```ruby\nhtml = open([http://www.loc.gov/visit](http://www.loc.gov/visit))\n\
    ```\n\nA temporary object should be printed to the screen. To parse that data\
    \ with `Nokogiri`, we can run this:\n\n```ruby\nnokogiri = Nokogiri::HTML(html)\n\
    ```\n\nThis will put the contents of that website to the screen. Do you see what\
    \ we are doing here? We are declaring a variable and naming it `nokogiri` (although\
    \ you can name it anything you want, just like the `html` variable above).\n\n\
    ![](OEBPS/image/Figure_3.1.jpg)\n\nFigure 3.1. “Visiting the Library” (Library\
    \ of Congress).\n\nInspecting the web page’s HTML, we can see that Tours, Exhibitions,\
    \ and other headers use the `h2` tag. If you wanted to quickly pull in this list\
    \ without accessing the website, you can use `Nokogiri`.\n\nNow that we have the\
    \ website loaded into the variable `nokogiri`, we can get the contents out of\
    \ the site. The line `title = nokogiri.css('h2').text` will pull in all of the\
    \ `h2` tags on the page. The text will look a little messy because of the extra\
    \ spaces in the code. Ruby will clean up that data.\n\n```ruby\ntitle = nokogiri.css('h2').collect\
    \ do |titles|\n  titles.text.strip!\nend\n```\n\nNow we not only have the titles\
    \ we want, but we also have a lot of `nil` titles. This is from messy data on\
    \ the site that didn’t have anything inside of it. All of these blank tags returned\
    \ `nil`.\n\n```\n[nil, nil, nil, nil, nil, nil, nil, nil, nil, nil, nil, nil,\
    \ nil, nil, nil, nil, nil, nil, nil, nil, nil, nil, \"Visiting the Library\",\
    \ \"Tours\", \"Maps & Floor Plans\", \"Dining\", \"Shopping\", \"Volunteer Opportunities\"\
    , \"Contact Visitor Services\", nil, nil, nil, nil]\n```\n\nWe can clean that\
    \ up quickly with Ruby as well by running the `compact!` method.\n\n```ruby\n\
    title.compact!\n```\n\nNow we have an array with all the options we want:\n\n\
    ```\n[\"Visiting the Library\", \"Tours\", \"Maps & Floor Plans\", \"Dining\"\
    , \"Shopping\", \"Volunteer Opportunities\", \"Contact Visitor Services\"]\n```\n\
    \nThis is a very simple example, but there are many ways to use `Nokogiri` to\
    \ scrape the web and then manipulate the data easily with Ruby. You can test this\
    \ out on your own website just by replacing the above example and the `CSS` with\
    \ your own website and the objects you want to scrape. The web scraper is useful\
    \ for sites that have repetitive data structures on different pages, sort of like\
    \ the Library of Congress Subject Heading Authorities page ([http://authorities.loc.gov](http://authorities.loc.gov)).\
    \ Even if you change the URL you set up in `Open-URI`, you can still use the same\
    \ code previously written in order to access any page. You can even set up a script\
    \ that could scrape as many pages as you wanted.\n\n Summary\n\nRuby is a dynamic,\
    \ object-oriented, open-source programming language that strives for simplicity\
    \ and productivity. Ruby was developed with the goal of making a programming language\
    \ that is a joy to work in. The three principles Ruby follows are the principle\
    \ of conciseness, the principle of consistency, and the principle of flexibility.\n\
    \n Bibliography\n\nMatsumoto, Yukihiro. 1999. “ruby-talk:0382.” June 4. [http://marc.info/?l=ruby-talk&m=9639833724637&w=2](http://marc.info/?l=ruby-talk&m=9639833724637&w=2).\n\
    \n———. 2000. “The Ruby Language.” InformIT, June 12. [http://www.informit.com/articles.aspx?p=18225&seqNum=2](http://www.informit.com/articles.aspx?p=18225&seqNum=2).\n\
    \n Recommended Resources\n\nOnline Sources\n\n[HacketyHack.com](http://HacketyHack.com):\
    \ [http://www.hackety.com](http://www.hackety.com)\n\n[Learn.co](http://Learn.co):\
    \ [https://learn.co](https://learn.co)\n\nLearn Ruby with the Neo Ruby Koans:\
    \ [http://rubykoans.com](http://rubykoans.com)\n\nTry Ruby: [http://tryruby.org](http://tryruby.org)\n\
    \nWhy’s (Poignant) Guide to Ruby: [http://mislav.uniqpath.com/poignant-guide/](http://mislav.uniqpath.com/poignant-guide/)\n\
    \nBooks\n\nBlack, David A. 2014. The Well-Grounded Rubyist. Greenwich, CT: Manning.\n\
    \nCooper, Peter. 2011. Beginning Ruby: From Novice to Professional. New York:\
    \ Apress.\n\nFernandez, Obie, and Kevin Faustino. 2014. The Rails 4 Way. Boston:\
    \ Addison-Wesley Professional.\n\nMetz, Sandy. 2012. Practical Object-Oriented\
    \ Design in Ruby: An Agile Primer. Boston: Addison-Wesley Professional.\n\nOlsen,\
    \ Russ. 2011. Eloquent Ruby. Boston: Addison-Wesley Professional.\n\nShaughnessy,\
    \ Pat. 2013. Ruby under a Microscope: An Illustrated Guide to Ruby Internals.\
    \ San Francisco: No Starch Press.\n\nChapter Four\n\nJavaScript\n\nJason Bengtson\
    \ and Eric Phetteplace\n\nHistory and Development\n"
