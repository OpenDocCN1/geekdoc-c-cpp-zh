    ## Recommended Resources


    - Albahari, Joseph, and Ben Albahari. 2012\. `C#` 5.0 in a Nutshell: The Definitive
    Reference. 5th ed. Sebastopol, CA: O’Reilly Media. This is a tightly packed reference
    book. Not to be read from start to finish, but in small spoonfuls like awful-tasting
