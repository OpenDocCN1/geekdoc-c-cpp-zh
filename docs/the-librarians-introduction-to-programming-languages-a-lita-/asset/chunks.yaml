    \     $tagsize = length($tagcontents) + 1;\n\n        # 累积此记录的数据\n        push\
    \ @tags, $tag;\n        push @tagdata, $tagcontents;\n        push @taglen, $tagsize;\n\
    \        $line = <INFILE>;\n        handledataline();\n    }\n\n    # 如果到达逻辑 MARC\
