    | `.css()` | Find or change the CSS properties of an HTML element |\n| `.each()`\
    \ | Cycles through a collection of matched elements |\n| `.val()` | Used to find\
    \ or change the value of an HTML element |\n| `.html()` | Sets the innerHTML value\
    \ of an HTML element (allowing you to rewrite an element’s HTML) |\n| `.wrap()`\
    \ | Wraps selected HTML elements with another element |\n| `.bind()` | Add event\
    \ handlers to an HTML element |\n\nCourtesy jQuery Foundation\n\nUsing these methods,\
    \ we can simplify our JavaScript. Take this method for adding a class to an identified\
    \ HTML object using straight JavaScript as an example:\n\n```\ndocument.getElementById(\"\
    topHeader\").setAttribute(\"class\", \"green\");\n```\n\nBy employing jQuery,\
    \ we can accomplish the same thing with jQuery selectors and methods:\n\n```javascript\n\
