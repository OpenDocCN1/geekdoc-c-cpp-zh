    ## 第十章：Java


    Amanda Cowell


    ### 历史与发展


    `Java` 是一种基于类的面向对象编程语言，其口号是“一次编写，随运行”（WORA），这意味着它是平台无关的，代码可以编译一次并运行在任何平台上。其他类似的语言（如
    `C++`）则每个平台都需要特定的编译器。`Java` 的设计还考虑了简单性，并可以自动管理内存的创建和删除，从而减少了编码错误。虽然 `Java` 被广泛用于应用程序，但实际上它在创建之初并不是为了在线应用程序设计的。`Java`
    最初是为家用电器内部的嵌入式应用程序设计的，例如微波炉和洗碗机。许多不同品牌的设备需要相同的软件功能但使用的硬件不同。这就是为什么平台无关性变得如此重要的原因。随着互联网的普及，人们发现
    `Java` 的移植性对于在线环境同样理想。今天，尽管是一门老牌语言，`Java` 仍然保持着人气，并且是开发 Android 移动设备应用的主要平台。


    `Java` 最初名为 `Oak`，由太阳系统公司（Sun Microsystems）于 1991 年开发。它是作为名为“绿色项目”（Green Project）的一部分而创建的。太阳绿色项目的目标是创建一种可以在多个操作系统上运行而无需重新编译的可移植编程语言。在
    `Java` 开发期间，大部分程序都是用 `C++` 开发的，而 `C++` 为每个平台都需要编译器。当时需要一种可以嵌入消费电子设备的软件解决方案（Schildt
    2011）。`Java` 开发有五个主要目标：


    - 简单、面向对象且熟悉

    - 健壮且安全

    - 架构中立且可移植

    - 高性能

    - 解释型、多线程且动态


    （Oracle 1997）。


    `Java` 于 1995 年面向公众发布，当时互联网正在发展。人们很快发现，困扰嵌入式代码的跨平台问题也会出现在互联网代码中，由于硬件、浏览器和操作系统的不兼容。`Java`
    自然成为了最用于互联网应用程序的编程语言（Schildt 2011）。


    1999 年，太阳系统公司发布了 Java 2 微型平台（J2ME），作为手机和其他类似设备的平台。当时对这些设备的消费应用兴趣并不大，手机硬件也没有准备好支持这些类型的应用程序。随着手机和其他移动设备的普及以及这些设备能力的提升，`Java`
    创建设备内容的能力也随之提高。2008 年，第一代安卓手机发布，到 2013 年，安卓占了全球智能手机市场的 81.3%（Deitel, Deitel, and
    Deitel 2014）。`Java` 运行在所有这些设备上的所有应用程序，证明了尽管历史悠久，它仍然是一门强大且重要的编程语言。


    ### 用途


    虽然 `Java` 代码可以移植到任何类似的应用程序，但部署 Java 应用程序的打包取决于你创建的应用程序类型（Gassner 2011）。例如，你打包移动应用程序的方式与桌面应用程序或
    应用程序不同。大多数情况下，可执行文件仍然是 `.jar` 文件，但它们的创建和运行方式不同。这意味着为某种类型的微波炉编写的代码可以在具有不同硬件的微波炉上运行，但不太可能运行在浏览器中；同样，安卓应用也不可能运行在微波炉上。

    '
- fmt: '

    Along the same lines, there are different tools required to develop different
    types of applications. For example, if you are planning on developing an application
    for Android, you will need to install the `Android SDK/ADT Bundle` to get access
    to the classes and tools needed to develop Android applications. You can download
    this bundle at [http://developer.android.com/sdk/index.html](http://developer.android.com/sdk/index.html).
    Different Java libraries and development environments do not make things more
    complicated but are needed so that developers can make use of features specific
    to the device they are developing for. For example, Android mobile devices have
    multitouch screens, and Java applications developed for those devices need to
    make use of various touch-screen gestures (Deitel, Deitel, and Deitel 2014).


    If you are developing web-based applications in Java, it can be worthwhile to
    create a `Java applet` as opposed to a `Java console-based application`. A `Java
    applet` is a small application that can be embedded inside a web page. Applets
    are ideal for web applications as they have limited access to local resources,
    which avoids the spread of computer viruses and helps protect the privacy of users.
    In order to build an applet, the user needs to include the `Abstract Window Toolkit
    (AWT)` and the `applet` package, which contains the class `Applet`. Every applet
    created needs to be a subclass of `Applet` (Schildt 2011). Applets have decreased
    in popularity as other tools can frequently perform these same tasks more quickly
    and Java applets have faced some security issues in the past, but Java applets
    are still a powerful and frequently used tool on the web.


    Due to Java’s age, popularity, and open-source design, there are hundreds of tools,
    both free and paid, available to assist Java developers with any project. There
    are tools for Java development, such as integrated development environments (`IDEs`),
    which are discussed later in the chapter. Tools for debugging and testing code
    are widely available. There are tools to assist in developing graphics. In Java’s
    twenty years of use, developers have tested and expanded its limits in every direction,
    and it is always worthwhile to look for a Java tool to assist with any project.


    ## Pros and Cons


    Despite being an older language, Java is constantly evolving and has many current
    applications. It is simple, object oriented, architecturally neutral, and portable
    to nearly any platform. Java is the language used in native Android apps as well
    as for the creation of dynamic web applications. If you are looking to develop
    a mobile application for your library, learning Java is a necessity.


    Java’s age adds some benefits as well, as it has been well used and well documented
    over the last two decades. Tools have been developed for almost every task a Java
    beginner might want to undertake. There is also a large community of developers
    offering support to other users. It is not difficult to find online instructions
    or solutions to most problems encountered during development.


    While scripting languages have gained popularity over the years, such as `JavaScript`
    (which is unrelated to Java), `Perl`, `Python`, and `Ruby`, to name a few, they
    are not well suited to large-scale programming. Scripting languages are popular
    because they use a structure that is easier to learn and allows for faster development
    of code. While many scripting languages are developing advancements that are increasing
    their capabilities, they are still significantly less usable for building large
    applications (Niemeyer and Leuck 2013).


    Alternatively, despite its simplistic design, Java can be a complicated language
    to learn because it requires the developer to understand object-oriented programming.
    To really succeed as a Java developer, it is not enough to know Java syntax; it
    is also necessary to have a good understanding of objects, classes, and inheritance.
    This can make learning Java a larger undertaking than users initially expect.
    The good news about this is that Java makes this as simple as possible, and many
    `IDEs` can make development easier for beginners.


    Also, while Java is a portable language for development, it can no longer be said
    that Java can run on any platform. `Apple IOS` does not allow Java to run on Apple
    devices such as iPhones and iPads. This requires non-Java versions of sites to
    be created for mobile usage since a great number of mobile users connect from
    Apple devices. Also, any mobile application developed in Java for Android devices
    needs to be recreated for the `IOS` environment. The impact of this on the popularity
    of the Java language is currently unknown, but it is clear that Java compatibility
    no longer has an impact on a product’s usage or popularity. Without Java, web
    development will still go on.


    ## Environment and Setup


    The first step to Java development is to make sure Java is installed on your machine.
    Microsoft Windows machines already have Java installed, and Windows users can
    skip the remainder of this paragraph. If you are on a Mac, you may or may not
    have Java installed on your machine, depending on what operating system you are
    using. The best way to test if you are running Java on your Mac is to open up
    `Terminal` and type `java -version`. You may get an error that you don’t have
    Java or you may see a number string that indicates your Java version. For example,
    if terminal outputs Java version `1.8.0_45`, you are running Java 8 on your machine.
    If you find that you do not have Java or you have an outdated version, go here
    for instructions on how to download the latest version of Java onto your machine:
    [https://www.java.com/en/download/help/mac_install.xml](https://www.java.com/en/download/help/mac_install.xml).


    The next step for both Mac and Windows users is to install the `Java Development
    Kit (JDK)`. `JDK` is the most widely used software development kit (`SDK`) for
    Java development, and it is offered for free from Oracle. As of the writing of
    this book, the most recent version of `JDK` for `Java SE` (Standard Edition) can
    be found here: [http://www.oracle.com/technetwork/java/downloads/index.html](http://www.oracle.com/technetwork/java/downloads/index.html).
    Downloading `JDK` will install everything needed to develop in Java, including
    the `Java Virtual Machine`.


    Once installed, Java is ready to go, but before you start programming, you need
    to choose a text editor. While Java software files are just text files and can
    be edited in any text editing software, there are a lot of options to choose from.
    If you are already a seasoned programmer, you can continue using text editing
    tools you have used in the past. Alternatively, `IDEs` are very useful when starting
    out, especially if you are somewhat new to software development, as they can help
    you build, edit, debug, and compile your applications.


    There are many IDEIDE options that are great for getting started. Some `IDEs`
    only run on Macs, some only run on Windows, and many are cross-platform. There
    are free `IDEs` and also paid ones that offer more complex functions for a licensing
    fee. Some `IDEs` work well for small-scale programs while others are better for
    larger, more involved projects. There are many factors to consider and many pros
    and cons of each tool.


    One good IDE to start with is `Eclipse`. `Eclipse` is not necessarily the right
    environment for everyone, but there many advantages to `Eclipse`. `Eclipse` can
    be used on Windows or Mac, is open source and free to use, and has Android developer
    tools built in, which can make it a great tool for beginner Android developers.
    It is also the tool that was used to develop the example code in this chapter.


