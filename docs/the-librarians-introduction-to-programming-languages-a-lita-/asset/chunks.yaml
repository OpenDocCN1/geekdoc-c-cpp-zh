    # 第五章


    ## Perl


    Roy Zimmer


    ### 历史与发展


    Perl 由 Larry Wall 在 1987 年创建。Perl 的设计深受 Larry 语言学背景的影响，这导致了 Perl 极大的灵活性。与 Perl
    相关的有两个缩写：PERL 本身，代表可编程提取与报告语言（Programmable Extraction and Reporting Language），反映了它最初的用途；以及
    TMTOWTDI：不止有一种种方法可以实现某事。Perl 有时被称为编程语言的瑞士军刀。


    Perl 最初编写是为了从系统管理员必须查看的计算机日志文件中提取详细信息。系统管理员是维护计算机及其程序良好运行的人。日志文件包含了计算机在任何给定时刻发生的许多事情的详细记录。


    1987 年后的几年里，Perl 发布了几个版本，并在 1994 年以版本 5 “结束”。版本 5 仍在更新中，使用类似 `[5.NN](http://5.NN).n`
    的版本号，更主要的更新会增加 `NN` 部分。Perl 有一个版本 6，相关工作于 2000 年开始。从设计上讲，版本 6 与 Perl 5 有显著不同且相互独立，尽管你可以使用，但它仍处于进行工作中。本章仅关注
    Perl 5，因为那通常被人们认为是 Perl。指代 Perl 的正确方式仅将首字母 P 大写。


    在 Web 早期阶段，Perl 在编写网页交互方面非常流行，那时编写了一些糟糕的 Perl 代码。这导致了 Perl 是一门应该避免的语言的误解。编写良好的
    Perl 代码，就像用几乎任何语言编写的代码一样，可以是运行高效的“优美代码”。


    ### 用途


    Perl 的广泛采用和持续更新让你几乎可以在运行几乎任何操作系统的任何类型的计算机上执行任何事情。Perl 足够应对大型且密集的计算需求，早期就被用于基因测序工作（[`web.stanford.edu/class/gene211/handouts/How_Perl_HGP.html`](https://web.stanford.edu/class/gene211/handouts/How_Perl_HGP.html)）。BBC
    创建了一个包含追溯到 1920 年代的超过 400 万个广播电视节目的在线数据库，并在其他软件中，在 Web 服务器（[`genome.ch.bbc.co.uk`](http://genome.ch.bbc.co.uk)）上
    Perl。至少有一个主要的 ILS 在后台使用 Perl 并在产品中安装它。


    你可以用 Perl 做什么？与数据库（如 Oracle、MySQL 和 Access）交互。自定义 Web 服务器处理用户与网页之间交互的方式。更改文件中存储的数据类型，例如从逗号分隔值
    (CSV) 变为制表符分隔。处理图像（图片），操作并转换文件，从中提取数据。这些都是你在图书馆环境中可能想用 Perl 完成的一些示例。


    ### 优缺点


    Perl 是一种脚本语言，因此创建和运行程序的过程相对简单快速。鉴于 Perl 中通常有多种方法来实现某事，你可能会遇到难以阅读的代码。在这种情况下，查阅
    Perl 书以获得必要的理解。编写良好的 Perl 代码，就像用几乎任何语言编写的代码一样，可以是运行高效的“优美代码”。


    Perl 是一种脚本语言，因此创建和运行程序的过程相对简单快速。鉴于 Perl 中通常有多种方法来实现某事，你可能会遇到难以阅读的代码。在这种情况下，查阅
    Perl 书以获得必要的理解。编写良好的 Perl 代码，就像用几乎任何语言编写的代码一样，可以是运行高效的“优美代码”。


    Perl 的强项之一是使用 `regex`。这个奇怪的词是正则表达式的缩写。使用 `regex`，你可以搜索特定的单词、字符序列或（最强大的）字符模式。`regexes`
    还可以用于替换或删除。正则表达式的起源可以追溯到 1940 年代和 1950 年代的神经科学、逻辑和计算机科学。Perl 的出现是正则表达式在程序员中被广泛理解的主要力量之一。


