- fmt: "\nAs you can see, this code works very similarly to the code above. Only now\
    \ we are making an empty list called `not_in_both` first by using empty brackets\
    \ (in `Python`, and many other languages, you can give yourself an empty version\
    \ of a container by using empty brackets or empty curly braces; these are useful\
    \ when you want a list but you want to fill it up as you go along rather than\
    \ all at once), and we will fill this list up as we go with ISSNs that are in\
    \ `from_catalog` but not in `from_vendor`. Once we do our check, we place the\
    \ ISSNs into `not_in_both` using `.append`, which just appends an item onto the\
    \ end of a list.\n\nFor a more physical example of `.append()`, imagine we have\
    \ a list called `numbers` with 1, 2, and 3 in it, like `numbers = [1,2,3]`. If\
    \ we wanted to add 4 to that list, using `numbers.append(4)` would give us the\
    \ list `[1,2,3,4]`. So by the end of this segment of code, we have gone through\
    \ thousands of journal ISSNs and made a list of the ones that our catalog claims\
    \ we have access to but our vendor does not have listed. Not bad for roughly eleven\
    \ lines of code.\n\nOne final improvement we might want to make is to create a\
    \ new file that will list all of these ISSNs so we can send them to our cataloger\
    \ or vendor to get to the bottom of the discrepancy. To do this, we will open\
    \ one more file similarly to how we opened the CSV files before, with a key difference.\n\
    \n```python\nwith open('compared_lists.txt', 'w') as f:\n    for issn in not_in_both:\n\
    \        f.write(issn+'\\n')\n```\n\nWe start very similarly to opening the CSV\
    \ files above, using `with open` and a file name to actually open a file, only\
    \ this time we use the parameter `'w'` to tell `Python` we want to write to this\
    \ file rather than `'r'` to read from it (please note: any time you open a file\
    \ with `'w'`, anything currently in that file will be deleted before anything\
    \ new is added, so be careful not to overwrite important information). We then\
    \ use `for` to go over everything in the `not_in_both` list we just made. For\
    \ each item in that list, we tell `Python` to write the ISSN to the file we are\
    \ calling `f` and add a newline (`\\n`) so each ISSN is on its own line. As an\
    \ added bonus, you don’t even have to worry about a file named `compared_lists.txt`\
    \ existing before you open it; if it does not already exist, `Python` will just\
    \ create it for you.\n\nWe can pull all of our pieces together to have a small\
    \ program that can automate a task that could take human eyes hours. If everything\
    \ does not make complete sense yet, stick with it and know that the particulars\
    \ of lists, working with files, packages, functions, and so on will become clear\
    \ as you learn and practice. Even if it isn’t clear yet, we hope you can see that\
    \ `Python` is an excellent language for writing these short utility programs that\
    \ can automate common tasks, and that with only about fourteen lines of code,\
    \ we have opened two files, gotten thousands of pieces of information out of them,\
    \ compared them, and made a new file that lists our results.\n\nHere is the full\
    \ program we just created:\n\n```python\nimport csv\n\nwith open('issns_from_catalog.cvs',\
    \ 'r') as f:\n    catalog_reader = csv.reader(f, delimiter=',')\n    from_catalog\
    \ = list(catalog_reader)\n\nwith open('issns_from_vendor.csv', 'r') as f:\n  \
    \  vendor_reader = csv.reader(f, delimiter=',')\n    from_vendor = list(vendor_reader)\n\
    \nnot_in_both = []\n\nfor issn in from_catalog:\n    if issn not in from_vendor:\n\
    \        not_in_both.append(issn)\n\nwith open('compared_lists.txt', 'w') as f:\n\
    \    for issn in not_in_both:\n        f.write(issn+'\\n')\n```\n\n# PyMARC for\
    \ Batch Processing MARC Records\n\nFor cataloging librarians, the `PyMARC` module\
    \ is especially useful for batch processing sets of MARC records and automating\
    \ technical services workflows. `PyMARC` can be downloaded by running the command\
    \ `pip install pymarc`. You can find documentation on the `PyMARC` GitHub page\
    \ at [https://github.com/edsu/pymarc](https://github.com/edsu/pymarc). `PyMARC`\
    \ includes a number of core functions that allow you to extract, analyze, add,\
    \ or remove fields and subfields in raw binary MARC record data. These core functions\
    \ are somewhat divided by level of operation, such as file level, record level,\
    \ or field level.\n\nFor example, there are file-level functions that allow you\
    \ to read in or write out a file of binary MARC records in `.mrc` format—the `MARCReader()`\
    \ and `MARCWriter()` functions. Both of these functions require the name of a\
    \ `.mrc` file as the parameter passed to the function, as follows:\n\n```python\n\
    marc_recs_in = pymarc.MARCReader(file('marc_input.mrc'))\n```\n\n```python\nmarc_recs_out\
    \ = pymarc.MARCWriter(file('marc_output.mrc'), 'w')\n```\n\nNote that the `MARCWriter()`\
    \ function also needs the `'w'` so that the file is writable. There are additional\
    \ optional parameters that can be used with `MARCReader` handle Unicode and UTF8:\n\
    \n```python\nmarc_recs_in = pymarc.MARCReader(file('marc_input.mrc'), to_unicode=True,\
    \ force_utf8=True)\n```\n\nAt the record level, the most common functions involve\
    \ three tasks:\n\n1. Getting fields out of a record using `record.get_fields()`\n\
    2. Removing a field from a record using `record.remove_field()`\n3. Adding a field\
    \ to a record using `record.add_field()`\n\nThe `get_fields()` function accepts\
    \ one or more field tags separated by commas and returns each instance of those\
    \ fields in a list. The `remove_field()` function takes a field object and removes\
    \ it. And the `add_field()` function takes a field object that you would build.\n\
    \nField-level functions work in much the same way as record-level functions, except\
    \ you are getting, setting, or deleting subfields from a field rather than a record:\n\
    \n1. Getting subfields out of a field using `field.get_subfields()`\n2. Removing\
    \ a subfield from a field using `field.delete_subfield()`\n3. Adding a subfield\
    \ to a field using `field.add_subfield()`\n\nSo consider that you wanted to add\
    \ a placeholder record for this book until you get the chance to do some full\
    \ cataloging on it. You would start by importing any module you need, in this\
    \ case `pymarc`, then creating a new record for our book. It will start as a blank\
    \ “record object” to which we will add fields.\n\n```python\nimport pymarc\n\n\
    new_record = pymarc.Record()\n```\n\nFirst, there is nothing special about naming\
    \ it `new_record`. It could have been `gryffindor` and the program would run as\
    \ well, but it is generally good practice to name things in a way that describes\
    \ what they are. Note that, since the `Record()` function comes from the `pymarc`\
    \ module, we have to tell `Python` to get `Record()` out of there by prefacing\
    \ it with `pymarc`.\n\nNext, we will create a new field to populate our record\
    \ using the `Field()` function:\n\n```python\nnew_field_245 = pymarc.Field(\n\
    \    tag = '245',\n    indicators = ['0','0'],\n    subfields = [\n        'a',\
    \ 'Programming for librarians /',\n        'c', 'edited by Beth Thomsett-Scott.'\n\
    \    ]\n)\n```\n\nHere we just tell `Python` this is going to be a field. Then\
    \ we give it some information about the field including the MARC tag number, indicator\
    \ values, and a list of the subfields and their content. As in most programming\
    \ languages, text strings are very literal, so notice that the punctuation must\
    \ be included in the subfield content value in order to create the subfields according\
    \ to standardized AACR rules ([http://www.aacr2.org](http://www.aacr2.org)/).\
    \ The above `Field()` command creates the following 245 title field and assigns\
    \ it to our variable called `new_field_245`:\n"
