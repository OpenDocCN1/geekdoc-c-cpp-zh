    Examples are ruby-oai, a Ruby library for building OAI-PMH clients and servers
    ([https://github.com/code4lib/ruby](https://github.com/code4lib/ruby)-oai); nypl-collections,
    a gem for easily accessing the digital collections held at the New York Public
    Library ([https://rubygems.org/gems/nypl](https://rubygems.org/gems/nypl)-collections);
    and, marc, a gem for (you guessed it) working with MARC catalog records ([https://rubygems.org/gems/marc/versions](https://rubygems.org/gems/marc/versions)/1.0.0).


    Pros and Cons


    The language of Ruby strives to be human readable, which is perhaps its greatest
    strength. The goal of Ruby is not just to be simple, but to be natural in the
    same way that reading English is natural to native English speakers. Ruby is simple
    to understand but complex when understanding its full potential.


    5\. times do


         puts "I love Ruby!"


    end


    With a simple script such as this, you can guess what is going to to happen even
    if you have no prior experience programming. This code will print I love Ruby!
    to the screen five times.


    Installation is easy, both the language and any language libraries that you may
    want to install. Ruby is packaged natively on Macs, and there are installation
    instructions for Windows- or Linux-based machines. Libraries of code, known as
    gems, are easy to install using the gem install command on the command line. Given
    the above comments, Ruby is a very suitable language for beginners since a beginner
    can learn the core concepts of programming without being bogged down with difficult
    syntax or environment setup errors.


    Beyond the code itself, Ruby has a strong and dedicated community of users and
    developers. Since Ruby is open source, anyone can improve the language or create
    libraries that make it easier for other people to use the language.


    Ruby is a great choice for beginners but may not be the best choice in the long
    term, depending on the reason for learning a programming language. For instance,
    Ruby is great for developing code meant for the web, but JavaScript is a powerful
    language built for and on the web. JavaScript may, therefore, be a more effective
    long-term choice if your main reason for learning to code is to make websites.


    When it comes to scaling web applications to become Facebook sized, Ruby is “slower”
    than what is necessary, depending on the type of data deployed and if it needs
    to be live while updating. However, Codecademy, AirBNB, and other major sites
    run on Ruby on Rails. Every operation in Ruby—even integer addition—is done by
    invoking methods, so the cost to search and invoke methods cannot be ignored,
    especially for simple programs. When programs get bigger and more complex, however,
    no significant performance difference should arise as a result of methods (Matsumoto
    2000).


    JavaScript has had better libraries built around data visualization. Ruby still
    lacks the ability to write code that creates complex visualizations. This isn’t
    because there is anything wrong with the Ruby language itself, but unfortunately
    the needed libraries have not been built by Ruby programmers.


    Ruby and Python are very similar programming languages. Python might be a better
    fit over Ruby if the primary focus is on science-based learning. Python is used
    more frequently for research and data science, and the community around Python
    has supported these needs.


    Examples


