    另一方面，CSS 的目的是告诉浏览器网页中的对象看起来什么样。CSS 非常强大且粒度极细，允许开发者根据对象的任意属性设置颜色、字体、大小甚至可见性。CSS
    也可以是可变的，可以根据条件（伪类）设置不同的颜色，例如鼠标指针是否悬停在目标对象上。


    本章的主题 `JavaScript` 从根本上与 HTML 和 CSS 有所不同。JavaScript 的目的是告诉浏览器网页中的对象做什么。与 HTML（它仅仅是用于标记对象的语言）或
    CSS（它仅仅是用于描述这些对象外观的语言）不同，JavaScript 是一门真正的编程语言。使用强大的 `DOM API`，JavaScript 可以操作网页文档中的任何节点。在
    `DOM` 中，发生在网页文档内部或作用于网页文档的事务（事件）也是对象。正如前面提到的，由于它采用了异步编程范式，JavaScript 可以监听这些事件并对它们做出响应，甚至以多种方式修改事件本身。近年来，HTML5
    和 CSS3 为 JavaScript 与 `DOM` 的交互提供了许多令人兴奋的新方法，创造了新的机会，但也要求更灵活的 JavaScript 技能方法（Bengtson
    2013）。


    在它的范围内，JavaScript 极其强大；然而，出于安全考虑，JavaScript 有许多事情是不允许做的。例如，JavaScript 不允许从你的本地计算机保存、修改，在大多数情况下甚至加载文件。JavaScript
    无法直接发送电子邮件。JavaScript 不能从其所在文档域之外的任何域名加载数据文件（如 `XML`）（Ruderman 2014）。最后一条规则有两个例外，但一个必须在服务器上激活，另一个是称为
    `JSON-P` 的高级技术，它仅适用于 JavaScript 对象表示法（`JSON`）数据文件。`JSON-P` 的水平略超出了本章脚本的范围。你需要理解的是，有很多操作超出了
    JavaScript 的范围，但可以使用使用端脚本脚本语言（如 `PHP`、`Python` 或 `Perl`）有效地完成，这些语言在其他章节中都会讨论。


    ## 向网页文档添加 JavaScript


    将 JavaScript 添加到网页文档有三种基本方法。最快最简单的两种方法也是最草率的：`内部 JavaScript`（internal JavaScript）和`内联
    JavaScript`（inline JavaScript）。这两种方法都有使用的时间和场合，特别是当你由于时间限制而不得不稍微草率时，但它们产生的 Web
    代码质量较低，并可能为应用程序或页面引入意外问题。第三种也是最好的方法是使用外部 JavaScript 文件。除了让 JavaScript 与 HTML 和
    CSS 的分离更加清晰外，外部 JavaScript 文件像外部 CSS 文件一样可以被多个网页轻松复用。此外，正如我们后面看到的，使用外部 JavaScript
    文件强制开发者采用更健康的技术来处理 `DOM` 中的事件。


    ### 内部 JavaScript


    网页文档中的内部 JavaScript 看起来非常内部 CSS。脚本放在 `<script>` 标签内部，如下：


    ```html

    <script>

    document.getElementById(''container'').innerHTML="<p>这是一个段落</p>";

    </script>

    ```


    ### 内联 JavaScript


    内联 JavaScript 利用特殊的标签属性，允许将 JavaScript 直接放入 HTML 标签中，以便标签定义的 HTML 对象根据事件执行。寻找事件的
    JavaScript 被称为 `事件监听器`（event listener），而在检测到事件时响应的 JavaScript 被称为 `处理器`（event
    handler）。这里有一些简单的内联 JavaScript 示例：


    ```html

    <a href="#" onclick="changeColor();">点击此链接更改背景颜色</a></a>></a>

    ```


    如果点击链接，`onclick` 属性将调用 `changeColor()` 函数。链接的默认行为通过在 `href` 属性中使用 `#` 来处理。本质上，我们告诉链接在用户点击它时不要去任何地方。这可能看起来非常简单直观。然而，正如稍后描述
    `jQuery` 事件处理器时将进一步讨论的，内联 JavaScript 有一些固有问题。


    ### 外部 JavaScript


    向网页文档添加外部 JavaScript 文件很容易。本质上，它只需要一个包含 `src` 属性的 `script` 标签，该属性指向一个 JavaScript
    文件，如下：


    ```html

    <script type="text/JavaScript" src="js/combined.js"></script>

    ```


    ## jQuery


    正如前面提到的，在它的范围内，JavaScript 极其强大。然而，对于简单任务，它也可能异常地难以处理。考虑到 JavaScript 本质上是允许网页中的元素实际执行有用操作的“接线”，而且在大多数情况下，你希望网页代码执行的操作将由用户的操作（事件）驱动，因此将你的
    JavaScript “挂载”到网页中的对象上是关重要的。这种挂载会在用户对这些元素执行操作时触发 JavaScript，例如用户点击按钮或尝试拖动图像时。然而，使用纯
    JavaScript 为网页中的元素构建这些事件处理器往往很笨拙。假设我们有一个 `id` 为 `push_this` 的按钮，我们希望在用户点击时激活函数
    `doSomething()`。要在 JavaScript 中为它挂载点击事件，我们的代码看起来如下：


    ```javascript

    document.getElementById(''push_this'').addEventListener(''click'', function()
    {doSomething();});

    ```


    我们也可以直接将函数添加到按钮元素本身的 `onclick` 属性中（内联 JavaScript），如下：


    ```html

    <button id="push_this" onclick="doSomething();"></button>

    ```


    然而，这种事件处理方式是草率的，并且会导致难以排错和重写的 Web 代码。最好的总是避免混合脚本和标记语言，因为正如前面提到的，以这种方式运行的所有 JavaScript
    都在所谓的“全局”作用域中。换句话说，你可能会遇到多个 JavaScript 操作之间相互干扰的问题，因为它们处于同一个作用域。


    使用名为 `jQuery` 的 JavaScript 库可以改进整个过程。`jQuery` 扩展了 JavaScript 的功能，使客户端脚本更容易编写。`jQuery`
    库是免费的，可以从网上下载到你的网站。`jQuery` 与其他外部 JavaScript 文件一样，使用 `script` 标签加载到你的页面：


    ```html

    <script type="text/JavaScript" src="jquery.js"></script>

    ```


    网上还有 jQuery 的托管副本供你引用，而不是使用本地副本。优点是如果这些托管副本位于内容分发网络（CDN），它们加载到用户页面的速度可能比位于你的服务器上更快。缺点是你无法对这些托管副本或其运行的服务器进行控制。这可能会导致意外停机或内容服务器受到攻击引起的问题。我建议使用
    `jQuery` 等库的本地副本。


    `jQuery` 增强了 JavaScript 的力量，使客户端脚本变得简单。让我们使用 `jQuery` 为之前看到的按钮添加事件处理器：


    ```javascript

    $("#push_this").click(function(){ doSomething(); });

    ```

