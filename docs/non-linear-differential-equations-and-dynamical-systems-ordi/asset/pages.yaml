    # 4.8.14 Spin Prediction, Testing, and Recovery


    A typical combat situation that can lead to stall and spin is described next:
    (i) a fighter aircraft performs a high-speed turn with small radius to escape
    a threat or to gain a firing position; (ii) the large centrifugal force must be
    countered by the horizontal component of the lift with a bank angle; (iii) the
    high lift will require a large angle-of-attack close to be achieved in an instantaneous
    turn; (iv) the high lift implies high drag, and to perform a sustained turn a
    high matching thrust is needed; (vi) the engine may flame-out in a turn due to
    inlet flow distortion or a rapid throttle movement; (vii) thus the conditions
    for a spin are created. The stall and spin protection of a fighter aircraft must
    allow for high maneuverability and survivability, and the risk of stall followed
    by spin can be excluded. The flight manual gives instructions on: (i) how to avoid
    and spin; (ii) the types of spin the particular aircraft can have; (iii) the control
    actions that can recover from each type of spin; (iv) the conditions in which
    no further attempt should be made to counter the spin, and ejection is advisable.
    In order to prepare the flight manual it is necessary to predict, test, and demonstrate
    spin recovery.


