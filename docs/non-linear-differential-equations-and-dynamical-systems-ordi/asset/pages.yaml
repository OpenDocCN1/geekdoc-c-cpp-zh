    # 4.8.12 Transition from Laminar to Turbulent Flow


    The simplest scenario of transition to turbulence (problem 146) can involve only
    one bifurcation and non-linear and parametric resonance in steps: (i) a bifurcation
    may cause an oscillatory system with natural frequency $\omega_1$ to gain another
    natural frequency $\omega_2$; (ii) if the starting system is non-oscillatory,
    a preliminary bifurcation could generate the first natural frequency, for a total
    of two bifurcations; (iii) it is assumed that the two frequencies are not multiples
