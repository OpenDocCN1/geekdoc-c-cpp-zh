    $$\frac{d}{dt}\left(\frac{1}{J}\frac{dJ}{dt}\right)=\pm\frac{Z}{2\pi L}\frac{d\Omega}{dt}=\pm\frac{Z}{2\pi
    L}\left(\pm\frac{a}{2\pi l}\Omega J+\frac{M}{I}\right)=\pm\frac{aZ}{2\pi I L}\left(L\frac{dJ}{dt}+RJ+\frac{M}{a}\right),$$


