    $m,n,p \in \mathbb{Z}: \quad \omega_{m,n} = m\omega_1 + n\omega_2; \quad \omega_{m,n,p}
    = \frac{m\omega_1 + n\omega_2}{p} \quad (4.466a-c)

    ```


    (v) if the system is time dependent, parametric resonance can lead to sub-harmonics
    (4.446b), leading to a three-parameter (4.466a) family of frequencies; (vi) given
    two frequencies $\omega_1$ and $\omega_2$, that are not multiples of any third
    frequency, $\omega_3$ can be approximated by (4.446c) through a suitable choice
    of three integers; (vii) if the tous is a dense set of frequencies corresponding
    to a chaotic system then the dynamics of non-linear and time dependent systems
    provide mechanisms for the transition to an almost dense set of oscillations like
    found in turbulence. The non-linear generation of harmonics corresponds to the
