    # 4.7.8 Magnetic Field Generation in Planets and Stars


    The earth and other planets and the sun and other stars have a steady magnetic
    field (Figure 4.18). The possibility of a primordial magnetic field, dating from
    the origins of the celestial bodies, can be excluded because the electrical conductivity
    is too high, and such a magnetic field would already have been dissipated, given
    the age of the planet or star. The remaining possibility is a permanently generated
    steady magnetic field associated with an analogue of the dynamo effect: (i) a
    cloud of particles (gas) collapses under mutual gravitational attraction to form
    a planet (star); (ii) the cloud is initially rotating, and the conservation of
    the angular momentum implies that as it collapses the angular velocity increases;
    (iii) the gravitational collapse increases the mass density, pressure and temperature
    sufficiently to separate electrons from atoms that become ions; and (iv) the ionized
    matter subject'
