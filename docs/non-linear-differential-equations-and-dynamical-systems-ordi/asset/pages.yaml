- pgno: 148
  md: '# 4.3.12 Wave Envelope with Amplitude Modulation


    Two differences between the undamped normal (parametric) resonance [section 2.6
    (subsections 4.3.1–4.11)] are: (i) the amplitude grows linearly (exponentially)
    in time; and (ii) the oscillation occurs at applied frequency that must be equal
    to the natural frequency (a discrete set of excitation frequencies that are multiples
    or submultiples of the natural frequency). The differences between the ordinary
    (parametric) resonance relate to the lasting support, and are illustrated by approximate
    solutions of (4.88). In the case of fixed support the oscillations will be sinusoidal
    with constant amplitude, and in the vibrating support the method of variation
    of parameters is used (subsection 1.3.6; notes 1.2–1.4; section 2.9; section 3.3)
    with the amplitudes taken as functions of time:


    ```

    x(t) = A(t)\cos(\omega t) + B(t)\sin(\omega t),    (4.148)

    ```


    and the frequency of oscillation $\omega$ is also to be determined. The approximate
    solution (4.148) allows for the two main features of parametric resonance: (i)
    periodic oscillation with sinusoidal form as the lowest-order approximation (subsections
    4.3.7–4.3.11) and (ii) constant amplitude or wave envelope with amplitude modulation,
    in this amplitude increasing or decreasing exponentially with time (subsections
    4.3.1–4.3.6).

    The equation of the parametric oscillator is (4.76) ≡ (4.134):


    ```

    \ddot{x} + \omega^2x = -2h\omega\cos(\omega t)x(t),    (4.149)

    ```


    where the term on the r.h.s. is: (i) it is specified a priori for ordinary resonance
    (2.165a) but not for parametric resonance (4.144) because the displacement in
    the r.h.s. of (4.149) appears as a factor (2.165b) (ii) forced oscillation occurs
    even if the initial displacement and velocity of the free motion are zero; and
    (iii) the parametric response does not occur if the initial displacement and velocity
    are both zero and thus requires a disturbance from the state of rest. The L.h.s.
    of (4.149) involves the acceleration and second-order derivative of (4.148) specified
    by (4.150a):


    ```

    \ddot{x} = (\ddot{A}-\omega^2A + 2h\omegaB\cos(\omega t)) + (\ddot{B}-\omega^2B
    - 2h\omegaA\sin(\omega t)),    (4.150a)

    ```


    ```

    2x(t)\cos(\omega t) = 2\cos(\omega t)[A\cos((\omega - \omega t)t) + B\sin((\omega
    - \omega t)t)]

    ```


    ```

    = A{[cos((\omega + \omega t)t)] + [cos((\omega - \omega t)t)]} + B{[sin((\omega
    + \omega t)t)] - [sin((\omega - \omega t)t)]},    (4.150b)

    ```


    and the r.h.s. of (4.149) involves (4.150b) which (II.5.88a, c) were used.'
