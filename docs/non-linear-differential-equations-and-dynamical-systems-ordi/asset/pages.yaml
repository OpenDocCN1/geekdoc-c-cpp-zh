  md: '# 4.8.13 Stall and Departure from Stable Flight


    The straight, level, and steady flight of an aircraft (Figure 4.31a) requires
    that: (i) the weight W be balanced by the lift L generated mostly by the wing;
    (ii) associated with the lift there is drag D that must be balanced by the thrust
    T of the engine. This stable flight condition is maintained for angle-of-attack
    smaller than stall, when the flow around the aircraft is mostly laminar. If the
    angle of attack exceeds the stall value (Figure 4.31b): (i) there is flow separation
    in the upper surface of the wing, increasing the pressure so that there is a loss
    of lift; (ii) the transition from laminar to turbulent flow increases the drag,
    which may exceed the available thrust, causing the aircraft to slow down. The
    reduction in airspeed (ii) aggravates the (i) loss of lift, which is insufficient
    to balance the weight, so the aircraft falls down. The departure from stable flight
    is quite sensitive to initial conditions, for example a slight asymmetry may cause
    the port or left wing to drop first or to reverse. The velocity


    ![](img/6a4cb3b3bd1429197bb791c4b642651c_256_0.png)


    FIGURE 4.31

    In the controlled flight of an aircraft at angle-of-attack below stall (a) the
    flow is mostly laminar. If the stall angle-of-attack is exceeded, flow separation
    occurs (b), and the transition from laminar to turbulent flow reduces lift L and
    increases drag D. The lift no longer compensates weight W and the thrust T of
    the engine does not balance drag D, leading to a departure from controlled flight
    that (c) include spiraling-slip and a side force S. This combination of forces
    and moments causes a spiraling falling motion or spin with rapid loss of altitude
    that may be a chaotic motion, and requires recovery action to escape this hazardous
    situation.'
