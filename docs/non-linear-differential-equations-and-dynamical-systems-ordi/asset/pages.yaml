  md: '# 3.6.5 Direct Solution of the Original Riccati Equation


    The generalized Riccati equation (3.58) is an extension of the original Riccati
    equation (3.117d) corresponding to the coefficients (3.117a–c):


    ```

    $R(x),Q(x),P(x)=\\{b,\frac{\lambda}{x},ax^{\lambda}\}: \quad y''=ax^{\lambda\|+\frac{\lambda}{x}y+by^{2}.
    \quad (3.117a–d)

    ```


    ```

    $y(x)=x^{\lambda}u(x): \quad x^{\lambda}u''=ax^{\lambda}+bu^{2}x^{\lambda}. \quad
    (3.118a, b)

    ```


    In the particular case (3.119a) the differential equation (3.118a) simplifies
    to (3.119b) that is separable:


    ```

    $n=2\lambda: \quad x^{-\lambda}u''=a+bu^{2}, \quad \int\frac{du}{a+bu^{2}}-C=\int
    x^{\lambda}dx=\frac{x^{1+\lambda}}{1+\lambda}. \quad (3.119a–c)

    ```


    The integration on the r.h.s. of (3.119c) is immediate and on the l.h.s. is distinct
    (3.120b)[3.121b] for (a, b) with the same (3.120a) [opposite (3.121a)] signs:


    ```

    $k=\frac{b}{a}>0: \quad \int\frac{du}{a+bu^{2}}=\int\frac{du}{1+ku^{2}}=\frac{1}{a\sqrt{k}}\int\frac{dv^{u\sqrt{k}}}{1+v^{2}}=\frac{1}{\sqrt{ab}}arc\tan(u\sqrt{k})$

    ```


    ```

    $=\frac{1}{\sqrt{ab}}arc\tan(x^{-\lambda}y\sqrt{\frac{b}{a}}), \quad (3.120a,
    b)

    ```


    ```

    $k=-\frac{b}{a}>0: \quad \int\frac{du}{a+bu^{2}}=\int\frac{du}{1-ku^{2}}=\frac{1}{a\sqrt{k}}\int\frac{dv^{u\sqrt{k}}}{1-v^{2}}=\frac{1}{\sqrt{-ab}}arc\tan(u\sqrt{k})$

    ```


    ```

    $=\frac{1}{\sqrt{-ab}}arg\tan(x^{-\lambda}y\sqrt{\frac{b}{a}}), \quad (3.121a,
    b)

    ```


