    \ is an undamped oscillator with mass and spring resilience varying with time\
    \ (subsection 4.3.1) that corresponds to an oscillator with “natural frequency”\
    \ as a function of time; another example is a mass suspended from a linear spring\
    \ with vibrating support (subsection 4.3.2), leading to the Mathieu equation.\
    \ For this or any other linear-order differential equations with periodic coefficients\
