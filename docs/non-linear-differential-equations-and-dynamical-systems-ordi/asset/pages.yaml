- pgno: 27
  md: '# Differentials and First-Order Equations


    # 3.1.2 Constant of Integration and Boundary Condition


    The preceding geometric property may be re-stated in analytical terms: the general
    integral (3.2) of the first-order differential equation (3.1a, b), involves one
    arbitrary constant of integration C, and includes, for particular values of C,
    all particular integrals. A rigorous proof will be given in section 9.1, and here
    is provided a heuristic explanation; there may be singular integrals not included
    in the general integral (chapter 5). If the general integral (3.2) is differentiated
    with respect to x it is


    ```

    $$\frac{\partial f}{\partial x} + y\frac{\partial f}{\partial y} = 0$, (3.3)$

    ```


    where the partial derivatives may depend on the constant of integration C. Taking
    C as a parameter, and eliminating between (3.2) and (3.3), leads back to the differential
    equation of first order (3.1b). If the general integral (3.2) involved more than
    one constant of integration, say two C, C_v, then elimination of C with (3.3)
    with the remaining constant C_o would have appeared in (3.1b). If the general
    integral (3.2) involved no constant of integration, then elimination with (3.3)
    for (3.1b) would generally be impossible, unless the case of singular or special
    (sections 5.1-5.4) integrals. Excepting the special cases, the general integral
    (3.2) of a first-order (3.1a) differential equation (3.1b) involves one arbitrary
    constant of integration that can be determined from a boundary condition:


    ```

    $$\f(x_0, y_0, C) = 0$, (3.4)$

    ```


    selecting the integral curve passing through a given point, assuming there is
    one and only one.


    # 3.1.3 Algebra, Analysis, and Differential Equations


    A differential equation may be considered a third-level problem in the sense that
    it is considered solved when it reduces to a problem of analysis, like an integration.
    For, the simplest ordinary differential equation of first order (3.5b):


    ```

    $f \in E(|\mathbb{R}|), \quad y'' = f(x), \quad y = \int_{0}^{x} f(\xi)d\xi +
    C$, (3.5a–c)$

    ```


    where f(x) is an integrable function (3.5a), has general integral (3.5c) obtained
    by a single integration or quadrature, involving one arbitrary constant of integration.
    Performing the integration, regardless of whether it is elementary or not, is
    a second-level problem of analysis. The solution of the problem may lead to a
    general integral in implicit form (3.2) or in'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Non-Linear Differential Equations and Dynamical Systems


    explicit form (3.6) involving the roots of an algebraic equation, such as the
    characteristic polynomial of a linear differential equations with constant (homogeneous)
    coefficients [1.3-1.5 (1.6-1.8)]. Finding the roots or obtaining one or more explicit
    solution in the form:


    ```

    y = y(x; C),

    ```


    a first-level problem of algebra. Thus is there a four-level hierarchy of problems:
    (i) algebraic at level one; (ii) analysis at level two involving equations or
    quadratures; (iii) differential equations at level three, involving relations
    between functions and derivatives; (iv) variational problems at level four whose
    solution lead to differential equations.


    # 3.1.4 Solution by Quadratures and Indefinite Integrals


    A differential equation is solved by quadratures when its solution is expressed
    by an integral, for example (3.5c) is the solution by quadratures of the differential
    equation (3.5b) where the function f is integrable (3.5a). The general integral
    (3.5b) specifies a family of integral curves, differing from each other by a translation
    along the y-axis (Figure 3.3); hence only one curve passes through each point
    (x0, y0):


    ```

    y - y0 = ∫f(ζ)dζ - ∫x0 f(ζ)dζ = ∫f(ζ)dζ,

    ```


    thus the indefinite integral in the general solution (3.5c) is replaced by a definite
    integral (3.7a) in the particular solution corresponding to the constant of integration:


    ```

    C = y0 - ∫f(ζ)dζ,

    ```


    An example of first-order ordinary differential is the case of linear slope (3.8a):


    ```

    y'' = 2x, y = x^2 + C,

    ```


    whose general integral (3.8b) is a family of parabolas (Figure 3.4) cutting the
    y-axis x = 0 at y = C, for example the parabola through the origin is the particular
    integral C = 0. The solution of a first-order differential equation may consist
    of N families of functions if it is of degree N (subsection 5.4.4); next is given
    an example of degree N = 2 (subsection 3.1.5).'
