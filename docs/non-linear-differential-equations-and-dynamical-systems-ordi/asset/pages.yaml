    that is balanced by the driving torque (4.347b), equal to the product (4.347c)
    of the electromotive force (4.344a) by the moment arm a; that is, the radius of
    the disk (Figure 4.16) leading to (4.347d). The result (4.347d) can be interpreted
    in terms of the Lorentz force (subsection I.28.3.2 and note III.8.10) that is
    proportional to the velocity and magnetic field; these are proportional respectively
    to the angular velocity Ω and magnetic flux or (4.343c) current J. Thus the torque
    should scale on the product of the electric current by the angular velocity (4.347d)
    like the electromotive force (4.344a), and they are in a constant ratio a in (4.348b)
    corresponding to the moment arm a. If the resistive term in (4.344a) is small
    compared with that due to the mutual induction (4.348a), the current equation
