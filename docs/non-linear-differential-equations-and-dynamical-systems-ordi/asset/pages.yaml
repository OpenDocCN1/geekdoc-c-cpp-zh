    # 3.6 Linear Second-Order Differential Equation with Variable Coefficients


    The Riccati equation is a non-linear-first-order differential equation (section
    3.5) that can be transformed via a change of variable (subsection 3.6.1) to a
    linear second-order differential equation (section 3.6). The general integral
    of the latter is not known, and a wide variety of special functions (sections
    9.4–9.9 and notes 9.1–9.47) are solutions of second-order linear differential
    equations with simple forms of the variable coefficients (subsection 3.6.2); this
    leaves scant of finding a general integral of the Riccati equation, although specific
    cases of solution are known, for example: (i) using known particular integrals
    (subsections 3.5.2–3.5.5); using the relation with linear second-order equations,
    the simplest being constant (homogeneous) coefficients [subsection 3.6.3 (3.6.4)];
    and (ii) direct solution for less general sub-cases of the Riccati equation (subsection
    3.6.5).


    # 3.6.1 Transformation between Riccati and a Linear O.D.E.


    The change of variable (3.95a) leads to (3.95b, c:


    ```

    y = \frac{u''}{Ru}; \ y'' = \frac{u''''}{Ru} - \frac{u''R''}{Ru^2}, Ry^2 = \frac{u''^2}{Ru^2},
    (3.95a–c)

    ```


    where the non-linear term involving $u''^2$ is the same. Thus the non-linear terms
    cancel when substituting (3.95a–c) in the Riccati equation (3.58):


    ```

    u'''' - (P + \frac{R''}{R})u'' + QRu = 0, (3.96)

    ```'
