  md: '# 4.3.7 Expansion of Mathieu (1873) Functions in Trigonometric Series


    The solution of the Mathieu equation (4.89) may be sought in the form of a trigonometric
    series:


    ```

    $w(\theta) = \sum_{m=-\infty}^{\infty} A_m \cos(m\theta) + \sum_{m=-\infty}^{\infty}
    B_m \sin(m\theta), \quad (4.115)$

    ```


    that is similar to a Fourier series (II.5.188b) = (4.115) is more general than
    the Fourier series (II.5.188b) since the coefficients may not satisfy the formula
    for the coefficients (II.5.189a, b; II.5.190a, b Substituting the trigonometric
    series (4.115) in the Mathieu equation (4.89) leads to:


    ```

    $0 = \sum_{m=-\infty}^{\infty} [(a-m^2) \cos(m\theta) - 2q \cos(m\theta) \cos(2\theta)]
    A_m \\n+ \sum_{m=-\infty}^{\infty} [(a-m^2) \sin(m\theta) - 2q \sin(m\theta) \cos(2\theta)]
    B_m. \quad (4.116)$

    ```


    Using the identities (II.5.88a) = (4.117a) and (II.5.88c) = (4.117b):


    ```

    $2 \cos(m\theta) \cos(2\theta) = \cos[(m+2)\theta] + \cos[(m-2)\theta], \quad
    (4.117a)$

    ```


    ```

    $2 \sin(m\theta) \cos(2\theta) = \sin[(m+2)\theta] + \sin[(m-2)\theta], \quad
    (4.117b)$

    ```


    leads to:


    ```

    $0 = \sum_{m=-\infty}^{\infty} [(a-m^2) A_m - q(A_{m+2} + A_{m-2})] \cos(m\theta)
    \\n+ \sum_{m=-\infty}^{\infty} [(a-m^2) B_m - q(B_{m+2} + B_{m-2})] \sin(m\theta).
    \quad (4.118)$

    ```


    In order for the trigonometric series to vanish, all terms in square brackets
    must vanish, leading to the recurrence formulas for the coefficients.


