    FIGURE 4.33

    The index of a singularity of a dynamical system is the number of times the path
    of coefficients goes a full rotation around the origin once (a); for example,
    the index or winding number is $l=2$ in (b). The index of a set of singularities
    is the sum of the indices of each of them (c) because the path can be subdivided
    into sub-paths around each singularity with cancellation in all internal paths
    since they are taken twice in opposite directions. The inversion relative to the
    origin specifies the index at infinity (d).


    The index of the singularity or equilibrium point (4.491b) is the integral of
    the angle of the vector tangent to the integral curve along the circle (4.491a)
    divided by $2\pi$:


    ```

    $$\partial D: |z-z_0|=r; \quad 2\pi \int d\theta = \int_{\partial D} d [\operatorname{\tan}\left(\frac{v}{u}\right)]
    = \int_{\partial D} \frac{u\dv-v\du}{u^2+v^2}, \quad (4.491a, b)$

