- pgno: 25
  md: '# Differentials and First-Order Equations


    ![](img/6a4cb3b3bd1429197bb791c4b642651c_25_0.png)


    FIGURE 3.1

    An explicit first-order differential equation specifies one slope at each point
    of the plane and its solution is an integral curve with the corresponding tangents.


    The function y(x) is the dependent variable, and the variable x is the independent
    variable. A solution of the differential equation is a function y(x) that satisfies
    it (3.1b) when substituted together with its first derivative (3.1a). The solution
    of the differential equation (3.1a, b) may be given a geometric interpretation
    (Figure 3.1); the first-order ordinary differential (3.1b) specifies at each point
    of the (x, y)-plane one (or more) slopes y''. A solution must be a curve, whose
    tangent at the point (x, y) has a slope y'' and is called an integral curve. Since
    it specifies one (or more) slopes or tangents at each point, the most general
    solution is a family of curves (Figure 3.2):


    ```

    $f(x, y, C) = 0 \quad\quad (3.2)$

    ```


    involving a parameter C, and this is the general integral of the first order ordinary
    differential equation (3.1b). Giving to the parameter C as a particular value
    C=Cv specifies a particular curve, or a particular integral of the differential
    equation. Thus an ordinary differential of first order relates a family of curves
    (3.2) to the slopes (3.1a) of its tangents at each point (x, y). The cases in
    which the tangent is not unique may lead to more than one family of integral curves
    or to curves with multiple points, the simplest being double points (Figure 3.3).
    If the family of integral curves has an envelope this a singular or special integral
    (section 1.1); the locus of double points or other loci may also lead to special
    integrals (sections 5.1–5.4).'
