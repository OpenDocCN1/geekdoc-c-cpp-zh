- pgno: 186
  md: '# 4.5 Perturbation Equations and Generation of Harmonics


    It has been shown (section 4.4) that a non-linear restoring force: (i) changes
    the frequency of oscillation relative to the natural frequency of the linear system
    (subsection 4.4.13); and (ii) generates harmonics of the fundamental mode (subsection
    4.4.15). The most direct way to obtain the frequency changes and amplitudes of
    the harmonics is to use a perturbation expansion (section 4.5). The perturbation
    expansion is an approximate method (section 4.5) alternating. It is applied to
    a more general restoring force including linear, quadratic, and cubic terms (subsection
    4.5.1), to obtain the first (second) order non-linear corrections (subsection
    4.5.2 and 4.5.3) to the harmonic oscillator, that specify in frequency and the
    generation of harmonics.


    # 4.5.1 Restoring Force with Quadratic and Cubic Terms


    The unforced, undamped, unharmonic oscillator (4.216b) is reconsidered with a
    restoring force containing linear, quadratic, and cubic terms (4.273) corresponding
    to the potential (4.274) with quadratic, cubic, and quartic terms:


    ```

    $m\ddot{x}=-j(x)(1+\varepsilon ax+\varepsilon^2 \beta x^2)=-\frac{d\Phi}{dx},$
    (4.273)

    ```


    ```

    $$\Phi(x)=\frac{1}{2}kx^2(1+\frac{2}{3}\varepsilon ax+\frac{1}{2}\varepsilon^2
    \beta x^2),$ (4.274)

    ```


    where the small parameter $\varepsilon$ indicates that quadratic (cubic) term
    in the restoring force (4.273a); that is, the cubic (quadratic) term in the potential
    (4.273) is of first (second) order of smallness. The potential (4.274) satisfies
    (4.214b, c) and thus the origin is in position of stable equilibrium, and its
    neighborhood is a potential well corresponding to oscillatory motion. Introducing
    the natural frequency (4.221c) = (4.275a) of the harmonic oscillator (4.54c) leads
    to (4.275b).


    ```

    $$\omega_0=\sqrt{\frac{k}{m}} \;quad \ddot{x}+\omega_0^2x=-\omega_0^2(\varepsilon
    ax+\varepsilon^2 \beta x^3),$ (4.275a, b)

    ```


    involving the quadratic (cubic) non-linearity parameters $\alpha(\beta).$ The
    displacement (4.276a) and frequency (4.276b) are specified by parametric expansions:


    ```

    $x(t)=x_1(t)+\varepsilon x_2(t)+\varepsilon^2 x_3(t)+..., \quad \omega=\omega_0+\varepsilon
    \omega_1+\varepsilon^2 \omega_2+....$ (4.276a, b)

    ```'
