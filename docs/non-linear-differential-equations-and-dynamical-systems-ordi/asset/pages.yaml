    #  3.9 Existence or Non-Existence of Integrating Factor


    In addition to the two cases (i, ii) for a first-order differential in two variables
    (subsection 3.8) there is a third case (iii) for three variables, that is non-existence
    of an integrating factor leading to the Pfaff problems. For a first-order differential
    in two variables an integrating factor always exists, implying that there plane
    curves orthogonal to a continuous vector field specified by the coefficients.
    For a first-order differential in three variables there are three cases (i-iii).
    The case (i) is an exact differential if the curl of the vector of coefficients
    is zero (subsection 3.9.1); in this case the integration is immediate and satisfies
    a family of surfaces orthogonal to the vector field. A family of surfaces orthogonal
    to the vector field also exists (subsection 3.9.4) in the case (ii), when the
    differential is inexact and has an integrating factor (subsection 3.9.2); the
    necessary and sufficient condition of integrity is the Beltrami condition that
    the vector field of coefficients is orthogonal to its curl (subsection3.9.3),
    implying that the tangent curves have no torsion or zero velocity (subsection
    3.9.5). The simplest Pfaff problem arises in the case (iii) of an inexact differential
    in three variables where the vector of coefficients does not satisfy the Beltrami
    condition (subsection 3.9.6); but on any regular surface there is a family of
    curves orthogonal to the vector field (subsection 3.9.7). The general first-order
    differential in three variables leads to a general representation of a vector
    field by three scalar Clebsch potentials (subsection 3.9.8). Two alternative representations
    exist (subsection 3.9.9); by a different set of scalar potentials; and (ii) replacing
    two of the scalar potentials by a vector potential. The work of a three-dimensional
    force is, in (a), an inexact first-order differential in three variables without
    an integrating factor (subsection 3.9.10); it becomes an exact differential in
    the particular case (b) of a conservative force field that is the gradient of
    a single scalar potential. The general case (a) leads to the first principle of
    thermodynamics (subsection 3.11); that is, to the existence of entropy, temperature,
    and internal energy.'
