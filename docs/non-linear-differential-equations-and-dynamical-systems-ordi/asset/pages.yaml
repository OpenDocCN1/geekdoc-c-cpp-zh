    The first term on the r.h.s. of (4.282) is a forcing at the frequency $\omega$,
    and would lead to an undamped resonance (subsection 2.7.3) with amplitude growing
    linearly with time (2.17b); this would imply that the energy of the oscillator
    would grow quadratically with time (2.17c), which is not possible because there
    is no external force acting on the system and the total energy is conserved (4.210c).
    Thus this term must be excluded, imposing the **secular condition** that its amplitude
    is zero; there is no frequency change to first order (4.283a), and (4.282) simplifies
    to (4.283b):


    ```

    $\omega_1 = 0;\quad \dot{x}_2 + \omega_2^2 x_2 = -\frac{\alpha}{2}\omega_2^2[1
