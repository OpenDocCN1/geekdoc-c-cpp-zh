    # Conclusion 3


    A first-order differential equation relates a function (or dependent variable)
    to its variable (or independent variable) and to its first-order derivative. The
    solution or general integral is obtainable by specific methods tailored to eight
    classes: (i) separable; (ii/iii) linear unbiased (forced); (iv/v) non-linear Bernoulli
    (Riccati); (vi) homogeneous; (vii/viii) exact (inexact) differentials. Of the
    eight there are: (a) always reducible to integrations or quadratures; (b) one
    requires finding an integrating factor; and (c) one is not generally solvable
    (v it can be solved in many cases, for example if one particular is integrable.
    The latter remark is one of the cases in Table 3.1 indicating the number $q$ of
    quadratures needed to find the general integral of a linear first order (non-linear
    Riccati) equation if $p$ linearly independent (distinct but not necessarily independent)
    integrals are known, with the sum being $p+q=2$. The exception is $p=0$ because
    the Riccati equation is not generally integrable; it is related to the linear
    second-order differential equation with variable coefficients that is also not
    integrable, though it is solvable in many important specific cases like special
    functions (chapter 9).


    A first-order differential equation has one slope at each point of the plane (Figure
    3.1) if it is explicit, that has only one root for the slope. The curve with this
    slope is an integral curve, or particular integral of the differential equation.
    Since there is an integral curve through every regular point, they form a family
    of curvesFigure 3.2) involving an arbitrary constant; that is, the general integral
    of the differential equation. Choosing a value of the arbitrary constant leads
    back to the particular integral passing through a given point taken as the boundary
    condition (Figure 3.4). If the differential equation leads to more than one slope
    at particular points there are multiple points through which the curve passes
    several times in different directions, for example twice through the double points
    (Figure 3.3). If'
