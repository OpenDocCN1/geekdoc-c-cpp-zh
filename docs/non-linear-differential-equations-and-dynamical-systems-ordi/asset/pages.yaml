    # 4.4.3 Separation of Limit Cycles and Open Paths


    Since the kinetic energy is always positive $x^2>0$, it follows that for an undamped,
    forced non-linear oscillator (problem 106): (i) the position is possible where
    the potential energy does not exceed the total energy $\Phi(x)\leq E$, and their
    difference difference is the velocity $\dot{x}$; (ii) the velocity $\dot{x}=0$
    at the stopping points $a=0$ where the potential equals the total energy $\Phi(a)=a$,
    that is, are the boundaries of the motion; (iii) a boundary of the motion is an
    equilibrium point if the acceleration is zero (4.210b), that is the restoring
    force is zero and the potential is stationary; (iv) the equilibrium will be stable
    if the potential has a minimum; (v) the closed (open) paths or limit cycles (unstable
    regimes) are separated by saddle points; (vi) through a saddle point pass two
