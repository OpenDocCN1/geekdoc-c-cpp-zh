  md: '# Differentials and First-Order Equations


    # 3.2.1 Explicit and Separable Differential Equation


    The first-order explicit differential equation (3.1b) is explicit (3.9b) \equiv
    (3.11a) if it can be solved for the slope:


    ```

    $$\frac{dy}{dx} = y'' = g(x,y) = \frac{X(x)}{Y(y)},$ (3.11a, b)

    ```


    if, in addition, the function $g(x,y)$ splits into the ratio of two functions,
    one of each variable differential equation (3.11b) is separable (standard L):


    ```

    $$\Y(\eta)d\eta = C - \int^{x} X(\xi)d\xi,$$$ (3.11c)

    ```


    and can be integrated by quadratures (3.11c). For example, the separable equation
    (3.12a):


    ```

    $$\frac{dy}{dx} = ye^{x}, \quad y(x) = C\exp(e^{x}),$ (3.12a, b)

    ```


    has the general integral (3.12b) because:


    ```

    $$\log y = \int_{y} \frac{dy}{y} = \int e^{x} dx + C_1 = \exp(e^{x}) + \log C.$$
    (3.13a, b)

    ```


    In passing from (3.13a) to (3.12b), $exp$ was replaced by $C$ because the exponential
    (or any function) of an arbitrary constant is another arbitrary constant; alternatively,
    the constant in (3.13b) can be designated $C_1 = \log C$ for consistency (3.13a)
    \equiv (3.13b). Differentiating (3.12b) with respect to x:


    ```

    $$$y'' = Ce^{x}(e^{x}) = e^{y},$$$ (3.14)

    ```


    provides a check that it is indeed a solution of the differential equation (3.12a).
    The integral curves (3.12b) do not pass through the origin $y=0$ for any finite
    value of $x$, and are asymptotic to the horizontal line $y \rightarrow C$ for
    $x \rightarrow -\infty$. The boundary condition (3.15a):


    ```

    $$$1 = y(0) = Ce; \quad y(x) = \frac{\exp(e^{x})}{e} = \exp(e^{x}-1),$$$ (3.15a,
    b)

    ```


    specifies the constant and leads to the unique solution (3.15b).'
