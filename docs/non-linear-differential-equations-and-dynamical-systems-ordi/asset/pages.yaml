    # NOTE 4.4: Analytical Approximations to the Solution of Differential Equations


    If a differential equation in its general form has no known exact analytical solution,
    it may be possible to simplify some terms so that it falls into one of the classes
    to which analytical methods apply. This introduces a systematic error associated
    with the approximation(s) made or term(s) omitted, in addition to the truncation
    error of computation. An example is the method of parametric expansions (section
    4.5) that transforms a nonlinear differential equation into a sequence of linear
    equations solvable by recurrence. The approximation may also have limitations,
    for example the parametric solutions often can be obtained without excessive labor
    only for the lowest orders. They may also raise questions of validity, such as
    convergence. It may happen that the approximate analytical solution of a differential
    equation can be obtained in finite terms using elementary functions whereas the
    exact analytical solution would require infinite expansions or special functions.
    The interpretation of the approximate analytical solution should take into account
    all the consequences of the approximation (i) properties that are not valid but
    due to the approximation; (ii) the possibility that other solutions are excluded
    by the assumptions made. The approximate analytical solution of a differential
    equation is an intermediate compromise: (a) the analytics solution (note 4.3)
    that is more accurate but may be more complex or unavailable for the differential
    equation (note 4.5) that will apply to wider classes of differential equations,
    and in this sense being the only alternative, while raising more issues.


    # NOTE 4.5: Numerical Solution of Differential Equations


    The chief attraction of numerical methods is that they provide quantitative solutions
    of the widest classes of differential equations, and in many cases are the only
    option available. Numerical methods can: (i) deceptively simple to apply; (ii)
    often much harder to justify fully than an analytic method; and (iii) almost always
    lead to some numbers at the end (except for overflows or underflows) The numerical
    methods are usually based on a discretization of a continuum into a sequence of
    discrete steps; this introduces a discretization error, which adds to the systematic
    (truncation) errors associated with approximations [note 4.4 (4.3)] with computations).
