- pgno: 23
  md: '# 3

    Differentials and First-Order Equations


    If a differential equation involves derivatives with regard to one (several) variables,
    it is an ordinary (partial) differential equation; ordinary differential equations
    it will be considered in the present volume IV, and partial equations in the next
    volume V. In the dynamics of the second-order linear system with constant (variable)
    coefficients (chapter 2(4)), the independent variable is time only, leading to
    an ordinary differential equation. If the particle or system has one (several)
    degrees of freedom, for example its position is specified by one (system of equations)
    then the solution of an ordinary differential equation (system of N simultaneous
    ordinary differential equations), is a function (N functions) of one variable.
    The derivative of highest order appearing in a differential equation specifies
    the order of that equation; for example in the differential equation of a particle
    with one degree of freedom the ordinary differential equation is of order two,
    because the highest order derivative of position with regard to time is the second,
    specifying the acceleration. Not all differential equations are readily solvable;
    this is why it is important to classify them into (i) ordinary or partial, (ii)
    equations or systems, (iii) one or higher, and (iv) particular standards or sub-types.
    The aim is to identify classes of differential equations that have certain properties
    methods of solution. The starting point was the linear differential equations
    with constant or homogeneous coefficients that have a characteristic polynomial
    of degree N (chapter 1); analogy other equations with one characteristic polynomial.
    Considering (i) linear equations with variable coefficients or (ii) non-linear
    differential equations, it is simpler to solve with those of first order (chapter
    3).


    After the discussion of general properties of first-order differential equations
    (section 3.1), methods of solution are presented for eight classes or standards:
    (i) the separable equation (section 3.2), where the derivative is the ratio of
    two separate functions of the independent and dependent variable, which can be
    solved by quadratures; the solution reduces to one (or two) integration(s); (ii)
    the linear forced equation, a particular case of the separable equation and hence
    always solvable (section 3.2); (iii) the solution of the linear forced equation
    is obtained from its forced part by the method of variation of parameters (section
    3.3), used before (notes 1.2–1 and section 2.9); (iv) the Bernoulli equation,
    which is non-linear but can be transformed to the linear type, and hence is always
    solvable (section 3.4); (v) the Riccati equation, while there is no known general
    solution,'
  merge: -1
  img_proc: true
