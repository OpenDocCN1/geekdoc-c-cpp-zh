  md: '# Non-Linear Differential Equations and Dynamical Systems


    The evolution of a system by perturbations determines its stability (section 4.9);
    that is, it is stable (unstable) if the perturbations always decay (grow at least
    in some cases).


    # 4.1 Streamlines of a Flow Near a Stagnation Point


    Consider a steady flow in the plane with a stagnation point where the velocity
    is zero; in a neighborhood, the components of velocity be linear functions of
    position, leading to a system of coupled first-order differential equations with
    constant coefficients. Eliminating time leads to a non-linear differential equation
    for the trajectory, with a singularity of degree unity at the stagnation point;
    eliminating one of the variables leads to a second-order linear equation, representing
    a generalized oscillator. The trajectories near the stagnation point may be interpreted
    as the coupling of two identical, orthogonal, generalized oscillators, and in
    the case (I) of critical damping the point (subsection 4.1.4) where the trajectories
    (Figure 4.1a) have an inflection tangent to a straight line. In the case (II)
    of overcritical damping the trajectory may be; (III) a focus (Figure 4.1b), a
    focus (Figure 4.1c), through which all paths pass with the same direction; (IV)
    a simple point (Figure 4.1d), through which passes only one of a family of parallel
    lines (subsection 4.1.6) or (V) a saddle point (Figure 4.1e), which converge to
    two principal lines to which all paths asymptote (subsection 4.1.7). In the case
    (III) of subcritical damping the paths have no common tangents nor asymptotes
    and there are two cases: (VI) the case of zero decay degenerates into sets of
    ellipses (subsection 4.1.8) with a common center (Figure 4.1f) and (VII) an asymptotic
    point as the limiting point (subsection 4.1.9) of a spiral (Figure 4.1g). Other
    shapes of streamlines are possible if the vanishing of the velocity in the neighborhood
    of the stagnation point is quadratic (example 10.9) or of higher degree.


    # 4.1.1 Distinction between Path and Trajectory


    For a steady motion in the (x, y) plane the components of velocity (u, v) do not
    depend on time t and depend only on the position:


    ```

    $$\frac{dx}{dt} = u(x,y), \quad \frac{dy}{dt} = v(x,y). \quad (4.1a, b)$

    ```


    Integration of the system (4.1a, b) of coupled first-order differential equations
    specifies the trajectory:


    ${x_0, y_0\} \equiv \{x(t_0), y(t_0)\}, \quad x(t) = f(t;x_0,y_0), \quad y(t)
    = g(t;x_0,y_0), \quad (4.2a–d)$'
