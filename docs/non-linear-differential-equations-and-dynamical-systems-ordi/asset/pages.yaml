  md: '# 4.7 Non-Linear Damping and Self-Excited Oscillations


    Following non-linear restoring forces (sections 4.4–4.6), non-linear damping or
    amplification is considered (section 4.7). If there is damping at all times, a
    limit cycle is not possible (subsection 4.7.1) and the system spirals down to
    rest. Self-excited oscillations are possible (subsection 4.7.2) if there is damping
    for large and amplification for small amplitudes or velocities so that the system
    can neither diverge nor decay to rest. An example is the homopolar dynamo (subsections
    4.7.3–4.7.5); the dynamo effect may be related to magnetic field generation in
    rotating bodies like the earth, sun, and other planets and stars (subsections
    4.7.6–4.7.8). The reverse of non-linear restoring force with linear damping (section
    4.6) is linear restoring force with non-linear damping (subsection 4.7.15). An
    example of restoring and friction forces both non-linear is the large amplitude
    motion of a pendulum. The undamped, non-linear motion of a pendulum includes (subsections
    4.7.9–4.7.14) three cases: (i) if the total energy exceeds the potential energy
    at the highest point, that is, circulatory motion; (ii) if the total energy equals
    the potential energy at the highest point, that is, a position of unstable equilibrium,
    the pendulum takes an infinite time to reach the position of rest; and (iii) if
    the total energy is less than the potential energy at the highest point, the latter
    cannot be reached, and there are large amplitude oscillations that include linear
    oscillations for small amplitude around the lowest position of stable equilibrium.
    In the presence of damping, the pendular motion ultimately decays to the equilibrium
    position regardless of the initial condition, whether it is circulatory or a large
    or small oscillation. This is shown for small oscillations with quadratic damping
    (subsection 4.7.15). The quadratic damping is also considered for large amplitude
    pendulum motion (subsection 4.7.16); if the initial angular velocity is high enough
    the pendulum performs a finite number of revolutions, after which it settles to
    a damped oscillation leading to rest (subsection 4.7.17).


    # 4.7.1 Dissipation Function, Damping, and Amplification


    The unforced (4.339a) general second-order system with separable non-linear restoring
    and friction forces (4.208c) is (4.339b):


    F(t)=0: mẍ - j(ẋ)=h(x)= - dΦ/dx. (4.339a, b)


    The rate of change with time of the total (4.210b), that is, kinetic plus potential
    energy (4.340a) is specified:


