    other celestial bodies through the non-linear interaction between rotation and
    the ionized flow. The electrical conductivity of the earth is such that any original
    magnetic field would have decayed at its present age, so a steady mechanism to
    generate the existing magnetic field must be present. Having considered non-linear
    restoring forces (sections 4.4–4.6) and non-linear damping or amplification (subsections
    4.7.1–4.7.9), non-linear restoring force (subsections 4.7.10–4.7.11) with non-linear
    damping (subsections 4.7.12–4.7.15) for the large amplitude motion of a pendulum
    is considered next.


    # 4.7.10 Small and Large Amplitude Motion of a Pendulum


    Consider a circular pendulum (Figure 4.19a) consisting of a mass m linked to the
    rotation point O by an inextensible rod of length L and negligible mass compared
    to m. In the uniform gravity field with constant acceleration g the equation of
    motion (4.371a) balances: (i) the inertia force, equal to mass times the linear
    acceleration that in turn is the product of the angular acceleration θ̈ by the
    radius L of the circular trajectory; (ii) against the weight directed downward
    −mg and projected along the tangent to the trajectory:


    mLθ̈ = −mg sinθ = − Φ′(θ)/L,      Φ(θ) = −mgL cosθ,      Φ(π/2) = 0,      (4.371a–c)


    where (4.371b) is the potential energy measured (4.371c) from the height of the
    center of rotation. The equation (4.371a) ≡ (I.8.2a) corresponds to the balance
    of tangential forces (section I.8). The potential has extrema (4.372b, c) where
    the tangential force vanishes (4.372a):


    F(θ) = −LΦ′(θ) = −mg sinθ = 0:          θ₁ = 0   or   θ₁ = π;          (4.372a–c)'
