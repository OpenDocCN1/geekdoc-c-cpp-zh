    # 4.8.11 Comparison of Deterministic and Chaotic Systems (Ruelle & Takens 1971)


    The apparently random motion of a fluid known as turbulence may be interpreted
    as a chaotic motion. The transition of a flow from laminar to turbulent then corresponds
    to the passage (problem 145) from a deterministic to a chaotic system. An infinite
    sequence of bifurcations could lead to chaos (Landau 1953). A more economical
    scenario (Ruelle-Takens 1971) observes three bifurcations: (i) from a periodic
    orbit with one frequency $\omega$, to a quasi-periodic orbit with frequencies
    $(\omega_1, \omega_2)$; (ii) another quasi-periodic orbit $(\omega_1, \omega_2,
    \omega_3)$ which can be perturbed into (iii) a chaotic motion. In the case of
    Hopf bifurcations it can be (i) all visible (Figure 4.30a), (ii) two visible (Figure
    4.30b), or (iii) only visible (Figure 4.30c). Besides a sequence of bifurcations,
    other properties of non-linear systems can contribute to'
