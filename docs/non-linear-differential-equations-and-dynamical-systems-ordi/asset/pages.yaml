    # NOTE 4.3: Exact Analytical Solutions of Differential Equations


    In principle, the exact analytical solution of a differential equation should
    contain all properties with arbitrary accuracy. It must be ensured that what is
    obtained is the general integral that contains all particular integrals; if there
    are special integrals not included in the general integral they need to be investigated.
    An exact analytical solution has to be computed, and there are truncation errors
    that can be reduced by using more digits. The exact analytical solutions of some
    differential equations may be obtained in finite terms using only elementary functions.
    Wider classes of differential equations may still be amenable to exact analytical
    solution but only in terms of series, parametric integrals, continued fractions,
    infinite products, or other representations raising convergence issues (section
    9,4–9.9). These solutions enlarge the class of ordinary functions to the special
    functions, e.g. hypergeometric, Legendre, Chebychev, Bessel, Hermite, etc., each
    having an associated theory that may be quite extensive (notes 9.1–9.47). The
