    ```

    $$\tilde{X} = \{X(x,y)dx+Y(x,y)dy = \tilde{X} \cdot dx,$

    ```


    that is, the differential equations considered before (sections 3.1–3) are instances
    of the type (3.145b)(Figure 3.6) of plane curves orthogonal to the vector field
    (3.145a). This is an exact differential (standard LXVI) if it coincides with the
    differential (3.146b) of a differentiable function (3.146a):


    ```

    $$\Phi \in D(|R^2|); \quad 0=d\Phi= \frac{\partial \Phi}{\partial x}dx+\frac{\partial
    \Phi}{\partial y}dy; \quad \Phi(x,y)=C$

    ```


    In this case the general integral is obtained by equating the function to an arbitrary
    constant (3.146c). A necessary condition that (3.145b) is an exact'
