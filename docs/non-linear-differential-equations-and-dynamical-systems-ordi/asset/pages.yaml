  md: 'to rotation acts as the homopolar dynamo and generates a steady magnetic field.
    The role of the magnetic field is best understood considering the successive layers
    of a planet or star from the center outward; the internal structure of planets
    (stars) is best known for the earth (sun).


    In the case of the sun (bottom of the Figure 4.18), the central temperature in
    the core T ~ 10^7 K is sufficiently high to cause thermonuclear fusion of hydrogen
    and its isotopes (deuterium and tritium) into helium, providing the main source
    of energy. The energy is transmitted through a radiation zone, then interacts
    with matter in the convection zone, where interaction with rotation generates
    the magnetic field through the dynamo effect. The magnetic field permeates the
    solar atmosphere, starting with the deepest layer, the photosphere, so named because
    it is the source of most solar radiation. The temperature decreases with altitude
    towards a temperature minimum in the chromosphere, so named because it gives the
    sun its yellow colour. The waves generated by hydromagnetic turbulence in the
    photosphere propagate upward through the chromosphere and are dissipated in the
    transition region to the corona. The steep temperature gradients in the transition
    region lead to high coronal temperature T ~ 1.8x10^6 K, leading to its expansion
    into the solar wind. The corona owes its name to its irregular shape, which is
    due to flows directed by the magnetic field. The solar wind then reaches the earth
    and other planets.


    # 4.7.9 Solar-Terrestrial System and Solar Cycle


    The Earth (top of the Figure 4.18) has its own magnetic field generated in the
    outer core made of molten metal by the dynamo effect associated with rotation.
    The inner core is solid, as is the mantle separating the core from the crust,
    which is the solid layer underlying the oceans and the land masses. The atmosphere
    supports life on the earth. Above the earth its magnetic field traps the solar
    wind in radiation belts forming the ionosphere. The ionosphere and atmosphere
    protect the surface of the earth from the most intense solar radiation. The combination
    of the sun and earth and their interactions forms the solar-terrestrial system
    (Figure 4.18). The remaining planets in the solar system have their own magnetic
    fields interacting with the sun in a way that is significantly affected by the
    distance; for example, the inner planets (Mercury and Venus) are much hotter than
    the outer planets (Mars, Jupiter, Saturn, Neptune and Uranus), with the earth
    as an intermediate case. The magnetic fields of planets are quite stable, varying
    slowly in direction and magnitude over time; this is not the case for the sun.


    The solar magnetic field changes polarity during a solar cycle of 11–14 years.
    The change of polarity or inversion of direction of the solar magnetic field implies
    that it is weak at the start and end of a cycle and is strongest in mid-cycle.
    The evolution of the solar magnetic field during the solar cycle is observed in
    sunspots that are dark regions of strong magnetic field in the photosphere. The
    number and size of sunspots and their motion change'
