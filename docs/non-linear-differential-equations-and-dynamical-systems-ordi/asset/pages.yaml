    and (3.257b) that the vector of coefficients is the sum of the gradients of two
    Euler potentials $(\Phi, \Psi)$, with the second multiplied by a third potential
    $\Theta$. Another representation of a vector field (III.5.266a–c) = (3.258a) is
    the sum of an irrotational (solenoidal) part that is the gradient (curl) of a
    scalar (vector) potential:


    ```

