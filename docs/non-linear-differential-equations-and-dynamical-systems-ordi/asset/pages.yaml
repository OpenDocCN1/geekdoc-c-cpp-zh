  md: '# Unsteady, Non-Linear, and Chaotic Systems


    # 4.1.2 Stagnation Point and Degree of the Singularity


    The differential equation (4.3a) is regular at a point $(x_0, y_0)$ if the derivative
    is uniquely defined there; the point $(x_0, y_0)$ is a singularity of the differential
    equation (4.3a) if the derivative is indeterminate, or infinite, for $y'' = 0/0$.
    The singularity of the differential equation (4.3a) for a steady flow corresponds
    to a stagnation point where both components of velocity vanish; taking the origin
    as the stagnation point, if the velocity is a differentiable function of position
    (4.4a), its components are linear functions (4.4b) in the neighborhood of the
    stagnation point:


    ```

    $u, v \in D^1(\mathbb{R}^2): \begin{bmatrix} u(x,y) \ v(x,y) \end{bmatrix} = \begin{bmatrix}
    \frac{\partial u}{\partial x} & \frac{\partial u}{\partial y} \ \frac{\partial
    v}{\partial x} & \frac{\partial v}{\partial y} \end{bmatrix}_{x=y=0} \begin{bmatrix}
    a & b \ c & d \end{bmatrix} x,$ (4.4a, b)

    ```


    where terms of $O(x^2, xy, y^2)$ have been neglected, assuming that the origin
    is a simple zero. In this case (4.4b), the origin is a singular point of degree
    one of the differential equation (4.3a) = (4.5b).


    ```

    $\frac{c}{a} \neq \frac{d}{b} : \frac{dy}{dx} = \frac{cx+dy}{ax+by},$ (4.5a, b)

    ```


    that is non-trivial if the condition (4.5a) is met. In the general case of the
    first order differential equation (4.6b):


    ```

    $N = \max(m,n,p,q): \frac{dy}{dx} = \frac{cx^m+dy^n}{ax^p+by^q},$ (4.6a, b)

    ```


    the origin would be a singularity of degree (4.6a) equal to the largest of the
    numbers $n_m,n,p,q$. First-order differential equations with singularities of
    degree higher than the first are considered in the EXAMPLE 10.9; the first-order
    singularity is addressed next (subsections 4.1.3–4.1.9).


    # 4.1.3 Singularity of First Degree and Homogeneous O.D.E.


    The first-order differential equation (4.5a, b) is of homogeneous type (3.127)
    when the r.h.s. is a function of the ratio of variables (3.131a) = (4.7a). Using
    the latter variable (4.7a), the first-order singular differential of degree one
    (4.5b) becomes (4.7b):


    ```

    $z = \frac{y}{x} : x = \frac{dz}{dx} \frac{d}{dx}(xz)-z = \frac{c+dz}{a+bz}-z
    = \frac{bz^2+(a-d)z-c}{a+bz},$ (4.7a, b)

    ```'
