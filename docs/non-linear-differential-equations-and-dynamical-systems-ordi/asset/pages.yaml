    \ 0, \\ unstable: &-\\frac{\\partial f}{\\partial x}\\frac{\\partial^2\\Phi}{\\\
    partial x^2} < 0. \\end{cases} \\quad (4.430a-d)$\n```\n\nNext to be considered\
