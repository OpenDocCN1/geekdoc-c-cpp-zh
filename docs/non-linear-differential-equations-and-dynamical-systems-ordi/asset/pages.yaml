    # 4.9.3 Existence and Identification of Limit Cycles


    The following two criteria may indicate limit cycles: (i) the iterated map (subsection
    4.8.10) is a fixed point (4.465a) or tends to a fixed point (4.465b); and (ii)
    the linearized system has a pair of complex conjugate eigenvalues (subsection
    4.9.4). Thus, if complex eigenvalues are calculated as a function of the parameters
    of a dynamical system with real coefficients, when they reach the imaginary axis
    a limit cycle can exist, provided that it is stable. The following theorem concerns
    the non-existence of a limit cycle: the dynamical system (4.477a, b) with continuously
    differentiable vector whose divergence (problem 149) does not vanish in a limit
    cycle in the domain.


    ```

    {x,y}=u,v∈c¹(D):

    R=\frac{\partial u}{\partial x\|+\frac{\partial v}{\partial y} \neq 0 in D.  (4.477a–c)

    ```'
