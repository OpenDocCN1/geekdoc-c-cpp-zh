  md: '# Unsteady, Non-Linear, and Chaotic Systems


    Substituting (4.150a, b) in (4.88) $\equiv$ (4.149) gives:


    ```

    $\$\dot{A} + (\omega_0^2 - \omega^2)A + 2\omega\dot{B}]\cos(\omega t) + [\dot{B}
    + (\omega_0^2 - \omega^2)B - 2\omega\dot{A}]\sin(\omega t)$$

    $- = h\omega_0\dot{A}\{\cos((\omega_0 + \omega)t) + [\cos((\omega_0 - \omega)t)]\}\quad(4.150c)$$

    $- = h\omega_0^2B[\sin((\omega_0 + \omega)t) - \sin((\omega_0 - \omega)t)]$.

    ```


    There are only two $\{A, B\}$ available to satisfy (4.150c); the coefficients
    of cosines and sines with different frequencies must vanish, leading to six conditions,
    unless $\omega$ and $\omega_0 \pm \omega$ coincide (4.151a):


    ```

    $\omega = \omega_0 \pm \omega:\quad\omega_c = 0\quad\text{or}\quad\omega_c \sim
    2\omega_0,\quad(4.151a–c$)$

    ```


    implying: (i) for the upper sign in (4.151a) where the excitation frequency is
    zero (4.152a) and there is no parametric resonance, only an harmonic oscillation
    (4.152b) with natural resonance (4.152c):


    ```

    $\omega_c = 0:\quad m\ddot{x} + k(1+2h)x = 0:\quad\sqrt{\frac{k}{m}}(1+2h);\quad(4.152a–c$)$

    ```


    (ii) for the lower sign in (4.151a), an excitation frequency (4.151c) equal to
    twice the frequency $\omega_0$, so that parametric resonance is strongest at the
    first harmonic; (iii) the frequency $\omega$ must be close to the natural frequency
    to allow the cancellation of some terms for the amplitudes $\{A, B\}$ in (4.150c)
    and (iv) in this case remain (4.150c) terms with frequency $\omega_0 + \omega
    = 3\omega$ that are of higher order and hence negligible. The statements (iii)
    [(iv)] will be provided in detail next [subsections 4.3.13 (4.3.14)].


    # 4.3.13 Excitation at the First Harmonic and Parametric Resonance at the Fundamental


    In the case of excitation frequency close to the first harmonic (4.151c) $\equiv$
    (4.153a), the parametric resonance leads to an oscillation close to the natural
