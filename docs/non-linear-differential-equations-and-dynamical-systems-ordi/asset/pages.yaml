    # 3.9.11 First Principle of Thermodynamics


    The first-order inexact differential in three variables without an integrating
    factor (3.257a) leads to the first principle of thermodynamics: the work (3.264)
    of the force F in an infinitesimal displacement dX generally a first-order differential
    in three variables that may be inexact without an integrating factor but always
    has (3.257a) the representation (3.268):


    ```

    $\hat{F}.d\hat{x} = dW = -dU-dS; \quad (3.268)$

    ```


    that can be interpreted as: (i) the heat (3.269a) is an inexact differential added
    because to the work it leads to the internal energy (3.269b) that is an exact
    differential or function of state U:


    ```

