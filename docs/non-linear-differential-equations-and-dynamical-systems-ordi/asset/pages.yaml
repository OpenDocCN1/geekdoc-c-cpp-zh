    $z = kx; \quad y = k; \quad 0 = g(k) = bk^2 + (a-d)k - c, \quad (4.8a-c)$

    ```


    whose k is a root of (4.8c); the binomial (4.8b) is related to the characteristic
    polynomial of the system of coupled first-order linear differential equations
    with constant coefficients:


    ```

    $\frac{dx}{dt} = ax + by, \quad \frac{dy}{dt} = cx + dy, \quad (4.9a, b)$

    ```


    obtained from (4.1a, b) by linearization (4.4b) at the stagnation point of degree
    unity at the origin; the characteristic polynomial appears in the theory (subsection
    4.2.1). Since (4.8c) is a quadratic equation with real coefficients, three cases
    arise; (i) a real double root (subsection 4.1.4); (ii) two distinct real roots
    (subsections 4.1.5–4.1.7); and (iii) a pair of complex conjugate roots (subsections
