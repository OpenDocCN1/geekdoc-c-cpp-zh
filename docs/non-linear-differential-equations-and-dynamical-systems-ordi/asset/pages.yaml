  md: '# Non-Linear Differential Equations and Dynamical Systems


    oscillator (subsection 4.8.7) is a non-linear example of non-separable displacement
    and velocity terms (subsection 4.8.6); it has a Hopf bifurcation with a hysteresis
    loop (subsection 4.8.7). Two of the most common or important bifurcations are
    the fold (cusp) catastrophe [subsection 4.8.8 (4.8.9)] corresponding to a one
    (two)-parameter value with a cubic (quadratic) term. The nature of the orbits
    of dynamical systems can be investigated with the help of iterated maps (subsection
    4.8.10); can indicate the emergence of chaos (subsection 4.8.11), for example
    the transition from laminar to turbulent flow (subsection 4.8.12). The transition
    from laminar to turbulent flow is associated with a loss of lift that can cause
    an aircraft to stall (subsection 4.8.13); stall is a departure from stable flight
    that can lead to a spin (subsection 4.8.14); that is, a hazardous falling motion
    that needs recovery within the altitude to avoid an accident.


    # 4.8.1 Physical, Phase, and Parameter Spaces


    A second-order dynamical system has several equivalent representations in different
    spaces, and may include one (more) parameter(s) q. The trajectory in the physical
    space (x, y) is specified by (4.1a, b) = (4.426a, b) the two components of the
    velocity of a system of coupled first-order differential equations:


    ```

    $$\frac{dx}{dt}=\dot{x}(x,y;t);$\quad \frac{dy}{dt}=\dot{y}(x,y;t);$\quad (4.426a,
    b)$

    ```


    choosing an initial position (4.426c, d) at time $t_0$ leads to the trajectory
    (4.426e, f) for all time:


    ```

    $x_0\equiv x(t_0),y_0\equiv y(t_0);\quad x\equiv x(t_0,y_0;q);\quad y\equiv y(t_0,y_0;q);\quad
    (4.426c–f)$

    ```


    Solving (4.426a) for $y$ leads to (4.427a) and substitution in (4.426b) leads
    to a single second-order differential equation (4.427b) for the dependent variable
    x:


    ```

    $y\equiv y(x,\dot{x};t;q)=\quad F(x,\dot{x};t;q)=0,\quad (4.427a, b)$

    ```


    and likewise for $y$; choosing an initial position (4.427c) and velocity (4.427d)
    at time $t_0$ leads from (4.427b) to the trajectory (4.427e) for all time:


    ```

    $x_0\equiv x(t_0),\dot{x}_0\equiv\dot{x}(t_0);\quad x\equiv x(t_0,x_0;q);\quad
    (4.427c–e)$

    ```


    From (4.427e) follows the trajectory (4.428a) and eliminating time with (4.427e)
    leads to the path in **the phase plane:**


    ```

    $$\dot{x}\equiv\dot{x}(t_0,x_0;q);\quad G(x,x_0;q)=0,\quad (4.428a, b)$

    ```


    whose coordinates are the position and velocity.'
