    # 3.6.2 Relation with the Theory of Special Functions


    The transformations (3.97a, b) hold in directions: (i) if y is a solution of the
    Riccati equation (3.58), then (3.97b) is a solution of the linear second-order
    differential equation (3.98a-c); (ii) if u is a solution of the linear differential
    equation (3.98a-c) is known, then (3.97a) specifies a solution of the Riccati
    equation (3.100):


    ```

    $$y'' =-\frac{B}{R}\left(A-\frac{R''}{R}\right)y + Ry^2.$$

    $(3.100)$

    ```


    The solution of linear second-order differential equations specifies a wide variety
    of special functions, as Legendre (hyperspherical Legendre) polynomials [section
    III.8.3 (III.9.6)] and hypergeometric functions (notes I.23.2-I.23.3). These special
    functions generally have infinite representations, like the power series for the
    Gaussian (sections I.29.9 and II.3.9) and generalized (section I.30.20 and note
    II.3) of hypergeometric series and also hypergeometric series (section II.1.9).
    The theory of linear differential equations with variable coefficients and related
