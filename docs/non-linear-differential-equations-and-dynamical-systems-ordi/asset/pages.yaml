    # 3.8 Exact and Inexact First-Order Differentials


    A first-order differential equation is equivalent to a differential in two variables,
    leading to two cases depending on whether the vector of coefficients has zero
    (non-zero) curl; whether the differential is an exact (inexact) differential [sections
    3.8.1-3.8.2](3.8.3-3.8.11)]; that is, whether it coincides (does not coincide)
    with the differential of a function. Thus, the integrability condition for a differential
    is that the vector of coefficients has zero curl [subsection 3.8.1]; or in this
    case it is the differential of a function, equated to an arbitrary constant, specifies
    the general integral. The general integral may be found by inspection [subsection
    3.8.1] or by formal integration ([subsection 3.8.2).


    If the differential in two variables is inexact, it can be made exact [subsection
    3.8.3] and hence, solved by multiplying by an integrating factor [section 3.8.4);
    the integrating factor satisfies a partial differential equation [subsection 3.8.5)
    and any solution will, the simpler the better. These are infinitely many integrating
    factors [subsections 3.8.6] and the ratio of two of them is a solution of the
    inexact differential. To obtain the solution of the inexact differential it is
    sufficient to find one integration factor, for example: (i) a function of one
    variable ([subsection 3.8.7); (ii) a symmetric function of two variables, as [subsection
    3.8.8 (3.8.9)] the sum (product); (iii) the ratio of two variables [subsection
    3.8.10]; or (iv) a non-symmetric non-homogeneous function of two variables [subsection
    3.8.11).


