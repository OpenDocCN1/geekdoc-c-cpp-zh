- pgno: 166
  md: '# 4.4.1 Linear/Non-Linear Time Dependent/Independent Systems


    The simplest second-order system (chapter 2; sections 4.1–4.2) is linear with
    constant coefficients:


    ```

    $$\ddot{x}+2\lambda\dot{x}+\omega_0^2x=f(t),$\quad (4.208a)$

    ```


    where the forcing is an arbitrary function of time. For a linear, time-dependent
    system the coefficients are the damping and frequency that depend on:


    ```

    $$\ddot{x}+2\lambda(t)\dot{x}+[\omega(t)]^2x=f(t),\quad (4.208b)$

    ```


    an example is parametric resonance (section 4.3), for which the damping was constant
    but not the frequency. A non-linear system has non-linear damping (subsections
    4.4.7–4.4.8) and/or restoring (subsections 4.4.4–4.4.6) forces:


    ```

    $$\ddot{x}+h(\dot{x})-j(x)=f(t),\quad (4.208c)$

    ```


    The combination of (4.208b) and (4.208c) is the unsteady and non-linear damping:


    ```

    $$\ddot{x}+h(\dot{x},t)-j(x,t)=f(t),\quad (4.208d)$

    ```


    This is a particular case of the general non-linear second-order differential
    equation solvable for the acceleration:


    ```

    $$\ddot{x}=F(x,xt),\quad (4.209)$

    ```


    The non-linear oscillator (4.208c) will be considered in the sequence: (i) no
    forcing or damping (sections 4.4–4.5); (ii) forcing (section 4.6); (iii) damping
    (section 4.7); and (iv) more general cases (sections 4.8–4.9).


    # 4.4.2 Non-Linear Restoring Without Damping or Forcing


    The study of non-linear second-order systems starts with a non-linear restoring
    force (sections 4.4–4.5), subsequently considering forcing (section 4.6) and non-linear
    damping or amplification (sections 4.7–4.8). An example is the one-dimensional
    motion of a particle with constant mass (4.210a) under a force that depends only
    on position. The non-linear restoring force (4.210b) derives from a potential:


    ```

    $$$m=const: m\ddot{x}=h(x)=-\frac{d\Phi}{dx},\quad E=\frac{m}{2}\dot{x}^2+\Phi(x)=const,\quad
    (4.210a–c)$

    ```'
