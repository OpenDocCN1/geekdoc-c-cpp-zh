- pgno: 15
  md: '# Preface


    Volume IV ("Ordinary Differential Equations with Applications to Trajectories
    and Oscillations") is organized like the preceding three volumes of the series
    "Mathematics and Physics Applied to Science and Technology": (volume III) "Generalized
    Calculus with Applications to Matter and Forces"; (volume II) "Elementary Transcendentals
    with Applications to Solids and Fluids"; (volume I) "Complex Analysis with Applications
    to Flows and Fields". These volumes consist on complex, transcendental, and generalized
    functions complete Topic A, "Theory of Functions and Potential Fields", "Boundary
    and Initial-Value Problems" starts with volume IV on "Ordinary Differential Equations
    with Applications to Trajectories and Oscillations".


    Volume IV consists of ten chapters: (i) the odd-numbered chapters mathematical
    developments; (ii) the even-numbered chapters physical and engineering applications;
    (iii) the last chapter is a set of 20 detailed examples of (i) and (ii). The first
    book "Differential Equations and Oscillators" of volume IV corresponds to the
    fourth book of the series and consists of chapters 1 and 2 of volume IV. The present
    book, "Non-linear Differential Equations and Dynamical Systems", corresponds to
    the fifth book of the series and consists of chapters 3 and 4 of volume IV.


    Chapter 1 described linear equations of any order with constant or power coefficients,
    and chapter 3 focuses on non-linear differential equations of first-order, including
    higher than the first and in more than two variables, and applications to the
    representation of vector fields by potentials. Chapter 2 discussed linear oscillators
    with damping/amplification and forcing with constant coefficients, including ordinary
    resonance. Chapter 4 considers linear oscillators with variable coefficients leading
    to parametric resonance, and non-linear oscillators leading to non-linear amplitude
    and hysteresis. Together with electromechanical dynamos and non-linear damping,
    these are examples of dynamical systems that may have bifurcations leading to
    chaotic motions.


    # Organization of the Book


    The chapters are divided into sections and subsections, for example chapter 3,
    section 3.1, and subsection 3.1.1. The formulas are numbered by chapters in curved
    brackets; for example, (3.2) is equation 2 of chapter 3. When'
