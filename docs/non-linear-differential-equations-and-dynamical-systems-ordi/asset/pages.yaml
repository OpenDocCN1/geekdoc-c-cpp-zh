  md: "# # 4\n Unsteady, Non-Linear, and Chaotic Systems\n\nThe basic linear second-order\
    \ system with coefficients independent of time is the damped or amplified harmonic\
    \ oscillator and forced attractor or repeller (chapter 2) that can be generalized\
    \ in three directions. The first generalization is to consider all singularities\
    \ of a linear system of two first-order differential equations with constant coefficients\
    \ as regards the trajectory in the physical plane (section 4.2) and the paths\
    \ in the phase plane (section 4.1); the corresponding singularities are the points\
    \ that are not (i) ordinary, are the (ii) contact, (iii) nodal, (iv) focal, (v)\
    \ saddle, and (vi) asymptotic or spiral points, plus the (vii) center. A second\
    \ generalization is to allow the coefficients of the linear second-order system\
    \ to depend on time; for example, in the case of a harmonic oscillator with vibrating\
    \ support (section 4.3) the energy input into the oscillator with support causes\
    \ a parametric resonance (section 4.3) that is distinct from ordinary resonance\
    \ (sections 2.7–28). Parametric resonance occurs only for frequencies close to\
    \ the first harmonic of the natural frequency, and also more weakly for its sub-multiples,\
    \ and it leads to exponential rather than linear growth of amplitude with time,\
    \ in the absence of damping. The effect of damping on the boundary while the amplitude\
    \ still grows exponentially with time; in ordinary resonance there is no threshold\
    \ amplitude and the oscillations have constant amplitude.\n\nThe third generalization\
    \ considers a non-linear second-order system with constant coefficients, corresponding\
    \ to non-linear resonance and friction forces (sections 4.4–4.6). An example is\
    \ a soft or hard spring connecting to a non-linear restoring force (section 4.4)\
    \ leading to elliptic integrals; the nonlinear resonance generates free harmonics,\
    \ which causes oscillations multiples of the fundamental frequency (section 4.5).\
    \ The forcing of a non-linear oscillator can lead to non-linear resonance with\
    \ two distinct amplitudes, amplitude jumps and hysteresis loops extracting or\
    \ feeding energy (section 4.6). The non-linear damping or amplification lead respectively\
    \ to decay or growth of fields; an example of the latter is the self-excited dynamo\
    \ (section 4.7) that generates the magnetic field of rotating bodies like the\
    \ earth and other planets and stars. The preceding examples include cases of bifurcations;\
    \ that is, the existence of multiple solutions of a differential equation beyond\
    \ a bifurcation value of a parameter (section 4.8); a large number of successive\
    \ bifurcations can lead to a “chaotic” state, in the sense that it is strongly\
    \ affected by small changes of initial conditions."
