  md: '# Differentials and First-Order Equations


    # 3.5 Solution of the Riccati (1724) – D’Alembert (1763) Differential Equation


    The Riccati (1724) equation (sections 3.5–3.6) is a joint generalization (D''Alembert
    1763) of: (i) the linear forced equation (section 3.3) adding a term quadratic
    in the dependent variable so that differential equation becomes non-linear; (ii)
    the non-linear Bernoulli equation (section 3.4) with quadratic non-linear term
    adding a forcing term. The original Riccati (1824) equation was actually due to
    Bernoulli (1691), the generalized Riccati equation considered next (sections 3.4–3.5)
    is a joint generalization of the linear and Bernoulli equations, and the former
    provides a better starting point for analogies and differences. The general integral
    of the linear equation involves two quadratures (section 3.3), and (subsection
    3.5.1): if one particular integral is known the general integral can be obtained
    by quadrature; if two distinct particular integrals are known the general integral
    can be obtained without any quadratures by the constancy of the three-point crossratio.
    In the case of the Riccati equation the general integral is not known, but (iii/iv)
    if one (two) distinct particular integral(s) is known the general integral can
    be obtained [subsection 3.5.2–3.5.3] by two quadratures; (v) if three distinct
    particular integrals are known, then the general integral can be obtained without
    any integrations from the constancy of the four-point cross-ratio (subsection
    3.5.5). The properties (i) to (v) are summarized in Table 3.1, and (ii) [v] imply
    the following analogy (subsection 3.5.4): any three (four) solutions of the linear
    (Riccati) order first differential equation have a constant three (four)-point
    cross ratio and (b) choosing one to be the general integral follows that it is
    a linear (bilinear) function of constant of integration.


    # 3.5.1 Linear Equation and Three-Point Cross-Ratio


    The general integral of the first-order linear forced differential equation (3.27):
    (i) is a linear function (3.31b) of the arbitrary constant of integration; and
    (ii) involves


    # TABLE 3.1

    General Integral of the Linear and Riccati Differential Equations


    | Number of quadratures needed for general integral: $q =$ | 2 | 1 | 0 |

    | Number of particular integrals known: $p = $ | | | |

    | Linear forced differential equation: $p+q=2$ | 0 | 1 | 2 |

    | Riccati differential equation: $p+q=3$ | 1 | 2 | 3 |


    Note: Number of quadratures needed to obtain the general integral of a linear
    first-order (non-linear Riccati) equation when $p$ linearly independent (distinct
    but not necessarily linearly independent) particular integrals are known.'
