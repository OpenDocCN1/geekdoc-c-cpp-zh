    a non-linear generalization of the Bernoulli equation (section 3.6), and it can
    be shown (section 3.5) if one/two/three particular integrals are known, then the
    general integral can be obtained via two/one quadratures.


    A sixth method is (vi) a change of variable that may render a differential equation
    solvable; for the homogeneous first-order differential equation, in which the
    dependent and independent variable appear only through their ratio, can be transformed
    into a separable variable, and hence integrated in all cases (section 3.7). Proceeding
    from the first to the next two classes, any first-order differential equation
    is equivalent to a first-order in two variables (section 3.8) leading to two cases:
    (vii) if it satisfies a condition of integrability, it is an exact differential
    that is of a function, equated to an arbitrary constant the general integral;
    (viii) if the integrability condition is not satisfied, the first-order differential
    equation is equivalent to an inexact differential, and is not the differential
    of a function, though it becomes when multiplied by an integrating factor that
    always exists. This is no longer the case for a first-order differential in three
    variables (section 3.9), when there are three possibilities: (i/ii) exact (inexact)
    satisfying (not satisfying) an integrability condition and not needing (needing)
    an integration factor, as for a first-order differential in two variables; (ii/iii)
    the existence (non-existence) of an integrating factor depends on the satisfaction
    (non-satisfaction) of a more general integrability condition. The first-order
    differential may be extended to: (i) more than three variables (notes 3.11–3.15);
    (ii) homogeneous differentials (notes 3.16–3.20); (iii) higher-order differentials
    (notes 3.21–3.24).


    # 3.1 General Properties of First-Order Equations


    The general properties include a classification of solutions (subsection 3.1.1)
    and the determination of the arbitrary constant in the general integral (subsection
    3.1.2). The differential equation is considered to be solved when it is reduced
    to an integration (subsection 3.1.3) or quadrature (subsection 3.1.4) that may
    be elementary or not. The general integral of a first-order differential equation
    is one family (or several families) of integral curves [subsection 3.1.1 (3.5)],
    and each value of the arbitrary constant corresponds to one of the curve (of each
    family).


    # 3.1.1 General Integral and Integral Curves


    An ordinary differential equation of the first order is a relation between a function
    y(x), its variable x, and its first derivative y'':


    ```

    y'' = \frac{dy}{dx}; \quad F(x,y;y'') = 0. \quad (3.1a, b)

    ```'
