    # ## 1.12.2 Basic Operations Performed in MS Excel


    Worksheet is the actual working area consisting of rows and columns. The worksheets
    are also known as the spreadsheets. A workbook in MS Excel is a combination of
    several worksheets. Each workbook of MS Excel contains three worksheets by default.
    The key operations that are performed in MS Excel include:


    +   * Creating a worksheet

    +   * Saving a worksheet

    +   * Modifying a worksheet

    +   * Renaming a worksheet

    +   * Deleting a worksheet

    +   * Moving a worksheet

    +   * Editing a worksheet


    # # 1.13 MS POWERPOINT SYSTEM


    MS PowerPoint is a software application included in the MS Office package that
    allows us to create presentations. PowerPoint provides a GUI with the help of
    which we can create attractive presentations quickly and easily. The presentation
    may include slides, handouts, notes, outlines, graphics and animations. A slide
    in PowerPoint is a combination of images, text, graphics, charts, etc., that is
    used to convey some meaning information. The presentations in MS PowerPoint are
    usually saved with the extension .ppt. The interface of MS PowerPoint is similar
    to the other interfaces of MS Office applications. PowerPoint presentations are
    commonly used in business, schools, colleges, training programmes, etc.


    # ## 1.13.1 Accessing MS PowerPoint


    For working in MS PowerPoint, we need to first install the MS Office package in
    our computer system. After installing MS Office, we can start MS PowerPoint using
    any of the following two ways:


    +   * Start menu

    +   * Run command


    **Using Start menu** We can start MS PowerPoint by performing the following steps
    using the Start menu:


    +   1. Select Start -> All Programs -> Microsoft Office.

    +   2. Select the Microsoft Office PowerPoint 2007 option to display the GUI of
    MS PowerPoint, as shown in Fig. 1.21.'
