  md: '# ## Variable Number of Arguments


    Some functions have a variable number of arguments and data types which cannot
    be known at compile time. The **printf** and **scanf** functions are typical examples.
    The ANSI standard proposes new symbol called the *ellipsis* to handle such functions.
    The *ellipsis* consists of three periods (…) and used as shown below:


    ```

    ```

    double area(float d,…)

    ```

    ```


    Both the function declaration and definition should use ellipsis to indicate that
    the arguments are arbitrary both in number and type.


    # ### 11.9.3 Arguments with Return Values


    The function **value** in Fig. 11.7 receives data from the calling function through
    arguments, but does not send back any value. Rather, it displays the results of
    calculations at the terminal. However, we may not always wish to have the result
    of a function displayed. We may use it in the calling function for further processing.
    Moreover, to assure a high degree of portability between programs, a function
    should generally be coded without involving any I/O operations. For example, different
    programs may require different output formats for display of results. These shortcomings
    can be overcome by handing over the result of a function to its calling function
    where the returned value can be used as required by the program.


    A self-contained and independent function should behave like a ‘black box’ that
    receives a predefined form of input and outputs a desired value. Such functions
    will have two-way data communication as shown in Fig. 11.8.


    ![](img/11b034a94fc590add0a7808250a38792_403_0.png)


    We shall modify the program in Fig. 11.7 to illustrate the use of two-way data
    communication between the *calling* and the *called functions*.


    # ### WORKED-OUT PROBLEM 11.3


    In the program presented in Fig. 11.7 modify the function value, to return the
    final amount calculated to the **main**, which will display the required output
    at the terminal. Also extend the versatility of the function **printline** by
    having it to take the length of the line as an argument.


    The modified program with the proposed changes is presented in Fig. 11.9. One
    major change is the movement of the **printf** statement from **value** to **main**.'
