- pgno: 369
  md: 'We must make sure that the size of string1 (to which string2 is appended) is
    large enough to accommodate the final string.


    strcat function may also append a string constant to a string variable. The following
    is valid:


    ```

    `strcat(part1, "6000");`

    ```


    C permits nesting of strcat functions. For example, the statement


    ```

    `strcat(strcat(string1,string2), string3);`

    ```


    is allowed and concatenates all the three strings together. The resultant string
    is stored in string1.


    # ## strcmp() Function


    The strcmp function compares two strings identified by the arguments and has a
    value 0 if they are equal. If they are not, it has the numeric difference between
    the first nonmatching characters in the strings. It takes the form:


    ```

    `strcmp(string1, string2);`

    ```


    string1 and string2 may be string variables or string constants. Examples are:


    ```

    `strcmp(name1, name2);`

    ```


    ```

    `strcmp(name1, "John");`

    ```


    ```

    `strcmp("Ram", "Ram");`

    ```


    Our major concern is to determine whether the strings are equal; if not, which
    is alphabetically above. The value of the mismatch is rarely important. For example,
    the statement


    ```

    `strcmp("their", "there");`

    ```


    will return a value of -9 which is the numeric difference between ASCII "i" and
    ASCII "r". That is, "i" minus "r" in ASCII code is -9. If the value is negative,
    string1 is alphabetically above string2.


    # ## strcpy() Function


    The strcpy function works almost like a string-assignment operator. It takes the
    following form:


    ```

    `strcpy(string1, string2);`

    ```


    and assigns the contents of string2 to string1. string2 may be a character array
    variable or a string constant. For example, the statement


    ```

    `strcpy(city, "DELHI");`

    ```


    will assign the string "DELHI" to the string variable city. Similarly, the statement


    ```

    `strcpy(city1, city2);`

    ```


    will assign the contents of the string variable city2 to the string variable city1.
    The size of the array city1 should be large enough to receive the contents of
    city2.


    # ## strlen() Function


    This function counts and returns the number of characters in a string. It takes
    the form


    ```

    `n = strlen(string);`

    ```


    Where n is an integer variable, which receives the value of the length of the
    string. The argument may be a string constant. The counting ends at the first
    null character.


