    | %e | read a floating point value |

    | %f | read a floating point value |

    | %g | read a floating point value |

    | %h | read a short integer |

    | %i | read a decimal, hexadecimal or octal integer |

    | %o | read an octal integer |

    | %s | read a string |

    | %u | read an unsigned decimal integer |

    | %x | read a hexadecimal integer |

    | %[...] | read a string of word(s) |


    The following letters may be used as prefix for certain conversion characters.


    +   - h  for short integers

    +   - l  for long integers or double

    +   - L  for long double


    > > **Note**  C99 adds some more format codes. See the Appendix “C99 Features”.


    # ### 6.4.6 Points to Remember while Using scanf


    If we do not plan carefully, some ‘crazy’ things can happen with **scanf**. Since
    the I/O routines are not a part of C language, they are made available either
    as a separate module of the C library or as a part of the operating system (like
    UNIX). New features are added to these routines from time to time as new versions
    of systems are released. We should consult the system reference manual before
    using these routines. Given below are some of the general points to keep in mind
    while writing a **scanf** statement.


    +   1. All function arguments, except the control string, *must* be pointers to
    variables.

    +   2. Format specifications contained in the control string should match the
    arguments in order.

    +   3. Input data items must be separated by spaces and must match the variables
