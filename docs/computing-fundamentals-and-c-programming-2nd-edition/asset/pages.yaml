  md: "# ## # elif Directive\n\nThe `#elif` enables us to establish an “if..else..if..”\
    \ sequence for testing multiple conditions. The general form of use of `#elif`\
    \ is:\n\n```\n```c\n#if expression 1\n        statement sequence 1\n#elif expression\
    \ 2\n        statement sequence 2\n    .....\n    .....\n#elif expression N\n\
    \        statement sequence N\n#endif\n```\n```\n\nFor example:\n\n```\n```c\n\
    #if MACHINE == HCL\n        #define FILE \"hcl.h\"\n#elif MACHINE == WIPRO\n \
    \       #define FILE \"wipro.h\"\n\n#elif MACHINE == DCM\n        #define FILE\
    \ \"dcm.h\"\n#endif\n#include FILE\n```\n```\n\n# ## #pragma Directive\n\nThe\
    \ `#pragma` is an implementation oriented directive that allows us to specify\
    \ various instructions to be given to the compiler. It takes the following form:\n\
    \n```\n```c\n#pragma name\n```\n```\n\nwhere, *name* is the name of the **pragma**\
    \ we want. For example, under Microsoft C,\n\n```\n```c\n#pragma loop_opt(on)\n\
    ```\n```\n\ncauses loop optimization to be performed. It is ignored, if the compiler\
    \ does not recognize it.\n\n# ## #error Directive\n\nThe `#error` directive is\
    \ used to produce diagnostic messages during debugging. The general form is\n\n\
    ```\n```c\n#error error message\n```\n```\n\nWhen the `#error` directive is encountered,\
    \ it displays the error message and terminates processing. Example.\n\n```\n```c\n\
    #if !defined(FILE_G)\n        #error NO GRAPHICS FACILITY\n#endif\n```\n```\n\n\
    Note that we have used a special processor operator `defined` along with `#if`.\
    \ `defined` is a new addition and takes a *name* surrounded by parentheses. If\
    \ a compiler does not support this, we can replace it as follows:\n\n```\n```c\n\
    #if !defined    by    #ifndef\n#if defined     by    #ifdef\n```\n```"
