- pgno: 368
  md: '| Function | Action |

    | --- | --- |

    | strcat() | concatenates two strings |

    | strcmp() | compares two strings |

    | strcpy() | copies one string over another |

    | strlen() | finds the length of a string |


    We shall discuss briefly how each of these functions can be used in the processing
    of strings.


    # **strcat() Function**


    The **strcat** function joins two strings together. It takes the following form:


    ```

    `strcat(string1, string2);`

    ```


    **string1** and **string2** are character arrays. When the function **strcat**
    is executed, **string2** is appended to **string1**. It does so by removing the
    null character at the end of **string1** and placing **string2** from there. The
    string at **string2** remains unchanged. For example, consider the following three
    strings:


    ![](img/11b034a94fc590add0a7808250a38792_368_0.png)


    Execution of the statement


    ```

    `strcat(part1, part2);`

    ```


    will result in:


    ![](img/11b034a94fc590add0a7808250a38792_368_1.png)


    while the statement


    will result in:


    ![](img/11b034a94fc590add0a7808250a38792_368_2.png)'
