    # **13.9 POINTER INCREMENTS AND SCALE FACTOR**


    **LO 13.4**


    We have seen that the pointers can be incremented like


    ```

    ~~~c

    p1 = p2 + 2;

    p1 = p1 + 1;

    ~~~

    ```


    and so on. Remember, however, an expression like


    ```

    ~~~c

    p1++;

    ~~~

    ```


    will cause the pointer **p1** to point to the next value of its type. For example,
    if **p1** is an integer pointer with an initial value, say 2800, then after the
    operation **p1 = p1 + 1**, the value of **p1** will be 2802, and not 2801. That
    is, when we increment a pointer, its value is increased by the ‘length’ of the
    data type that it points to. This length called the *scale factor*.


    For an IBM PC, the length of various data types are as follows:


    +   - characters: 1 byte

    +   - integers: 2 bytes

    +   - floats: 4 bytes

    +   - long integers: 4 bytes

    +   - doubles: 8 bytes


    The number of bytes used to store various data types depends on the system and
    can be found by making use of the **sizeof** operator. For example, if x is a
    variable, then **sizeof(x)** returns the number of bytes needed for the variable.
    (Systems like Pentium use 4 bytes for storing integers and 2 bytes for short integers.)


