  md: '+   - Supplying more initializers in the initializer list is a compile time
    error. (LO 9.2)

    +   - When using expressions for subscripts, make sure that their results do not
    go outside the permissible range of 0 to size −1. Referring to an element outside
    the array bounds is an error. (LO 9.2)

    +   - When using control structures for looping through an array, use proper relational
    expressions to eliminate “off-by-one” errors. For example, for an array of size
    5, the following `for` statements are wrong: (LO 9.2)

    +     - `for (i = 1; i <= 5; i++)`

    +     - `for (i = 0; i <= 5; i++)`

    +     - `for (i = 0; i = 5; i++)`

    +     - `for (i = 0; i < 4; i++)`

    +   - Referring to a two-dimensional array element like `x[i, j]` instead of `x[i][j]`
    is a compile time error. (LO 9.3)

    +   - Leaving out the subscript reference operator `[]` in an assignment operation
    is a compile time error. (LO 9.3)

    +   - When initializing character arrays, provide enough space for the terminating
    null character. (LO 9.4)

    +   - Make sure that the subscript variables have been properly initialized before
    they are used. (LO 9.4)

    +   - During initialization of multi-dimensional arrays, it is an error to omit
    the array size for any dimension other than the first. (LO 9.5)

    +   - While using static arrays, choose the array size in such a way that the
    memory space is efficiently utilized and there is no overflow condition. (LO 9.6)


    # KEY TERMS TO REMEMBER


    +   - **Array:** Is a fixed-size sequenced collection part of elements of the
    same data type. (LO 9.1)

    +   - **One-dimensional array:** Is a list of items that has one variable name
    and one subscript to access the items. (LO 9.1)

    +   - **Structured data types:** Represent data values that have a structure of
    some sort. For example, arrays, structures, etc. (LO 9.1)

    +   - **Searching:** Is the process of finding the location of the specified element
    in the list. (LO 9.2)

    +   - **Sorting:** Is the process of rearranging elements in the list as per ascending
    or descending order. (LO 9.2)

    +   - **Two-dimensional array:** Is an array of arrays that has two subscripts
    for accessing its values. It is used to represent table or matrix data. (LO 9.3)

    +   - **Multi-dimensional array:** Is an array with more than one dimension. Examples
    of multi-dimensional arrays are two-dimensional array, three-dimensional array
    and so on. (LO 9.5)

    +   - **Dynamic arrays:** Are the arrays declared using dynamic memory allocation
    technique. (LO 9.6)

    +   - **Dynamic memory allocation:** Is the process of allocating memory at run
    time. (LO 9.6)

    +   - **Static arrays:** Are the arrays declared using static memory allocation
    technique. (LO 9.6)

    +   - **Static memory allocation:** Is the process of allocating memory at compile
    time. (LO 9.6)


