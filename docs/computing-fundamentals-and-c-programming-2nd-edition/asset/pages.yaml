    # ## 5.15 OPERATOR PRECEDENCE AND ASSOCIATIVITY LO 5.5


    As mentioned earlier each operator, in C has a precedence associated with it.
    This precedence is used to determine how an expression involving more than one
    operator is evaluated. There are distinct *levels of precedence* and an operator
    may belong to one of these levels. The operators at the higher level of precedence
    are evaluated first. The operators of the same precedence are evaluated either
    from ''left to right'' or from ''right to left'', depending on the level. This
    is known as the *associativity* property of an operator. Table 5.8 provides a
    complete list of operators, their precedence levels, and their rules of association.
    The groups are listed in the order of decreasing precedence. Rank 1 indicates
    the highest precedence level and 15 the lowest. The list also includes those operators,
    which we have not yet been discussed.


    It is very important to note carefully, the order of precedence and associativity
    of operators. Consider the following conditional statement:


    ```

    ```c

    if (x == 10 + 15 && y < 10)

    ```

    ```


    The precedence rules say that the *addition* operator has a higher priority than
    the logical operator (&&) and the relational operators ( == and < ). Therefore,
    the addition of 10 and 15 is executed first. This is equivalent to :


    ```

    ```c

    if (x == 25 && y < 10)

    ```

    ```


    The next step is to determine whether x is equal to 25 and y is less than 10.
    If we assume a value of 20 for x and 5 for y, then


    ```

    ```

    x == 25 is FALSE (0)

    y < 10 is TRUE (1)

    ```

    ```


    Note that since the operator < enjoys a higher priority compared to ==, y < 10
    is tested first and then x == 25 is tested.

    Finally we get:


    ```

    ```c

    if (FALSE && TRUE)

    ```

    ```


    Because one of the conditions is FALSE, the complex condition is FALSE.

    In the case of &&, it is guaranteed that the second operand will not be evaluated
    if the first is zero and in the case of ||, the second operand will not be evaluated
    if the first is non-zero.


    # ### Rules of Precedence and Associativity


    +   - Precedence rules decide the order in which different operators are applied

    +   - Associativity rule decides the order in which multiple occurrences of the
    same level operator are applied'
