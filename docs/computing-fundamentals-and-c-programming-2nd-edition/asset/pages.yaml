  md: "# 3.2 IMPORTANCE OF C\n\nLO 3.1\n\nThe increasing popularity of C is probably\
    \ due to its many desirable qualities. It is a **robust language** whose rich\
    \ set of built-in functions and operators can be used to write any complex program.\
    \ The C compiler combines the capabilities of an assembly language with the features\
    \ of a high-level language and therefore it is well suited for writing both system\
    \ software and business packages. In fact, many of the C compilers available in\
    \ the market are written in C.\n\nPrograms written in C are **efficient and fast**.\
    \ This is due to its variety of data types and powerful operators. It is many\
    \ times faster than BASIC. For example, a program to increment a variable from\
    \ 0 to 15000 takes about one second in C while it takes more than 50 seconds in\
    \ an interpreter BASIC.\n\nThere are only 32 keywords in ANSI C and its strength\
    \ lies in its **built-in functions**. Several standard functions are available\
    \ which can be used for developing programs.\n\nC is **highly portable**. This\
    \ means that C programs written for one computer can be run on another with little\
    \ or no modification. Portability is important if we plan to use a new computer\
    \ with a different operating system.\n\nC language is well suited for **structured\
    \ programming**, thus requiring the user to think of a problem in terms of function\
    \ modules or blocks. A proper collection of these modules would make a complete\
    \ program. This modular structure makes program debugging, testing and maintenance\
    \ easier.\n\nAnother important feature of C is its **ability to extend** itself.\
    \ A C program is basically a collection of functions that are supported by the\
    \ C library. We can continuously add our own functions to C library. With the\
    \ availability of a large number of functions, the programming task becomes simple.\n\
    \nBefore discussing specific features of C, we shall look at some sample C programs,\
    \ and analyse and understand how they work.\n\n# 3.3 SAMPLE PROGRAM 1: PRINTING\
    \ A MESSAGE\n\nLO 3.2\n\nConsider a very simple program given in Fig. 3.2.\n\n\
    ```\n~~~c\nmain( )\n{\n    /*........printing begins........*/\n    printf(\"\
    I see, I remember\");\n    /*........printing ends........*/\n}\n~~~\n```\n\n\
    **Fig. 3.2** *A program to print one line of text*\n\nThis program when executed\
    \ will produce the following output:\n\nI see, I remember\n\nLet us have a close\
    \ look at the program. The first line informs the system that the name of the\
    \ program is **main** and the execution begins at this line. The **main( )** is\
    \ a special function used by the C system to tell the computer where the program\
    \ starts. Every program must have *exactly one* **main** function. If we use more\
    \ than one **main** function, the compiler cannot understand which one marks the\
    \ beginning of the program."
  merge: -1
  img_proc: true
- pgno: 113
  md: 'The empty pair of parentheses immediately following **main** indicates that
    the function **main** has no *arguments* (or parameters).


    The opening brace “{” in the second line marks the beginning of the function **main**
    and the closing brace “}” in the last line indicates the end of the function.
    In this case, the closing brace also marks the end of the program. All the statements
    between these two braces form the *function body*. The function body contains
    a set of instructions to perform the given task.


    In this case, the function body contains three statements out of which only the
    **printf** line is an executable statement. The lines beginning with # and ending
    with # are known as *comment* lines. These are used in a program to enhance its
    readability and understanding. Comment lines are not executable statements and
    therefore anything between # and # is ignored by the compiler. In general, a comment
    can be inserted wherever blank spaces can occur—at the beginning, middle or end
    of a line—“but never in the middle of a word”.


    Although comments can appear anywhere, they cannot be nested in C. That means,
    we cannot have comments inside comments. Once the compiler finds an opening token,
    it ignores everything until it finds a closing token. The comment line


    ```

    `/* * * * * * */ * * * * * * / * * * * * */`

    ```


    is not valid and therefore results in an error.


    Since comments do not affect the execution speed and the size of a compiled program,
    we should use them liberally in our programs. They help the programmers and other
    users in understanding the various functions and operations of a program and serve
    as an aid to debugging and testing. We shall see the use of comment lines more
    in the examples that follow.


    Let us now look at the **printf** ( ) function, the only executable statement
    of the program.


    ```

    `printf("I see, I remember");`

    ```


    **printf** is a predefined standard C function for printing output. *Predefined*
    means that it is a function that has already been written and compiled, and linked
    together with our program at the time of linking. The concepts of compilation
    and linking are explained later in this chapter. The **printf** function causes
    everything between the starting and the ending quotation marks to be printed out.
    In this case, the output will be:


    ```

    `I see, I remember`

    ```


    Note that the print line ends with a semicolon. *Every statement in C should end
    with a semicolon (;)* mark.


    Suppose we want to print the above quotation in two lines as


    ```

    ```

    I see,

    I remember!

    ```

    ```


    This can be achieved by adding another **printf** function as shown below:


    ```

    ```

    printf("I see, \n");

    printf("I remember !");

    ```

    ```


    The information contained between the parentheses is called the *argument* of
    the function. This argument of the first **printf** function is “I see, \n” and
    the second is “I remember !”. These arguments are simply strings of characters
    to be printed out.


    Notice that the argument of the first **printf** contains a combination of two
    characters \ and **n** at the end of the string. This combination is collectively
    called the *newline* character. A newline character instructs the computer to
    go to the next (new) line. It is similar in concept to the carriage return key
    on a typewriter. After printing the character comma (,) the presence of the newline
    character \n causes the string “I remember !” to be printed on the next line.
    No space is allowed between \ and n.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'If we omit the newline character from the first **printf** statement, then
    the output will again be a single line as shown below.


    ```

    I see, I remember !

    ```


    This is similar to the output of the program in Fig. 3.2. However, note that there
    is no space between and I.


    It is also possible to produce two or more lines of output by one **printf** statement
    with the use of newline character at appropriate places. For example, the statement


    ```

    printf("I see,\n I remember !");

    ```


    will output


    ```

    I see,

    I remember !

    ```


    while the statement


    ```

    printf( "I\n.. see,\n_ _ _ I\n_ _ _ remember !");

    ```


    will print out


    ```

    I

    .. see,

    _ _ _ I

    _ _ _ remember !

    ```


    > **Note** Some authors recommend the inclusion of the statement.


    ```

    #include <stdio.h>

    ```


    at the beginning of all programs that use any input/output library functions.
    However, this is not necessary for the functions **printf** and **scanf** which
    have been defined as a part of the C language.


    Before we proceed to discuss further examples, we must note one important point.
    C does make a distinction between **uppercase** and **lowercase** letters. For
    example, **printf** and **PRINTF** are not the same. In C, everything is written
    in lowercase letters. However, uppercase letters are used for symbolic names representing
    constants. We may also use uppercase letters in output strings like “I SEE” and
    “I REMEMBER”.


    The above example that printed **I see, I remember** is one of the simplest programs.
    Figure 3.3 highlights the general format of such simple programs. All C programs
    need a **main** function.


    ![](img/11b034a94fc590add0a7808250a38792_114_0.png)


    Fig. 3.3 Format of simple C programs


    # 3.3.1 The main Function


    The main is a part of every C program. C permits different forms of main statement.
    Following forms are allowed.'
