  md: 'We can also specify the field width using the form %ws in the scanf statement
    for reading a specified number of characters from the input string. Example:


    ```

    ```c

    scanf("%ws", name);

    ```

    ```


    Here, the two following things may happen:


    +   1. The width **w** is equal to or greater than the number of characters typed
    in. The entire string will be stored in the string variable.

    +   2. The width **w** is less than the number of characters in the string. The
    excess characters will be truncated and left unread.


    Consider the following statements:


    ```

    ```c

    char name[10];

    scanf("%5s", name);

    ```

    ```


    The input string RAM will be stored as:


    ![](img/11b034a94fc590add0a7808250a38792_355_0.png)


    The input string KRISHNA will be stored as:


    ![](img/11b034a94fc590add0a7808250a38792_355_1.png)


    # **Reading a Line of Text**


    We have seen just now that **scanf** with **%s** or **%ws** can read only strings
    without whitespaces. That is, they cannot be used for reading a text containing
    more than one word. However, C supports a format specification known as the *edit
    set conversion code* **%[. .]** that can be used to read a line containing a variety
    of characters, including whitespaces. Recall that we have used this conversion
    code in Chapter 6. For example, the program segment


    ```

    ```c

    char line [80];

    scanf("%[^\n]", line);

    printf("%s", line);

    ```

    ```


    will read a line of input from the keyboard and display the same on the screen.
    We would very rarely use this method, as C supports an intrinsic string function
    to do this job. This is discussed in the next section.


    # **Using getchar and gets Functions**


    We have discussed in Chapter 6 as to how to read a single character from the terminal,
    using the function **getchar**. We can use this function repeatedly to read successive
    single characters from the input and place them into a character array. Thus,
    an entire line of text can be read and stored in an array. The reading is terminated
    when the newline character (''\n'') is entered and the null character is then
    inserted at the end of the string. The **getchar** function call takes the following
    form:


    ```

    ```c

    char ch;

    ch = getchar( );

    ```

    ```


    > *Note that the **getchar** function has no parameters.*'
