  md: "# # BRIEF CASES\n\n# ## I. Book Shop Inventory [LO 12.2, 12.3, 12.4, 12.5,\
    \ 12.6, 12.7 M]\n\nA book shop uses a personal computer to maintain the inventory\
    \ of books that are being sold at the shop. The list includes details such as\
    \ author, title, price, publisher, stock position, etc. Whenever a customer wants\
    \ a book, the shopkeeper inputs the title and author of the book and the system\
    \ replies whether it is in the list or not. If it is not, an appropriate message\
    \ is displayed. If book is in the list, then the system displays the book details\
    \ and asks for number of copies. If the requested copies are available, the total\
    \ cost of the books is displayed; otherwise the message \"Required copies not\
    \ in stock\" is displayed.\n\nA program to accomplish this is shown in Fig. 12.8.\
    \ The program uses a template to define the structure of the book. Note that the\
    \ date of publication, a member of **record** structure, is also defined as a\
    \ structure.\n\nWhen the title and author of a book are specified, the program\
    \ searches for the book in the list using the function\n\n```\n`look_up(table,\
    \ s1, s2, m)`\n```\n\nThe parameter **table** which receives the structure variable\
    \ **book** is declared as type **struct record**. The parameters **s1** and **s2**\
    \ receive the string values of **title** and **author** while **m** receives the\
    \ total number of books in the list. Total number of books is given by the expression\n\
    \n```\n`sizeof(book)/sizeof(struct record)`\n```\n\nThe search ends when the book\
    \ is found in the list and the function returns the serial number of the book.\
    \ The function returns –1 when the book is not found. Remember that the serial\
    \ number of the first book in the list is zero. The program terminates when we\
    \ respond \"NO\" to the question\n\nDo you want any other book?\n\nNote that we\
    \ use the function\n\n```\n`get(string)`\n```\n\nto get title, author, etc. from\
    \ the terminal. This enables us to input strings with spaces such as \"C Language\"\
    . We cannot use **scanf** to read this string since it contains two words.\n\n\
    Since we are reading the quantity as a string using the **get(string)** function,\
    \ we have to convert it to an integer before using it in any expressions. This\
    \ is done using the **atoi()** function.\n\n```\n```c\nPrograms\n\n#include <stdio.h>\n\
    #include <string.h>\nstruct record\n{\n    char author[20];\n    char title[30];\n\
    \    float price;\n    struct\n    {\n        char month[10];\n        int year;\n\
    \    }\n}\n```\n```"
