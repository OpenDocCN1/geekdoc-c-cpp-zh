  md: "# ### 11.9.6 Nesting of Functions\n\nC permits nesting of functions freely.\
    \ **main** can call **function1**, which calls **function2**, which calls **function3**,\
    \ ……… and so on. There is in principle no limit as to how deeply functions can\
    \ be nested.\n\nConsider the following program:\n\n```\n```c\nfloat ratio (int\
    \ x, int y, int z);\nint difference (int x, int y);\nmain( )\n{\n    int a, b,\
    \ c;\n    scanf(\"%d %d %d\", &a, &b, &c);\n    printf(\"%f \\n\", ratio(a,b,c));\n\
    }\n\nfloat ratio(int x, int y, int z)\n{\n    if(difference(y, z))\n        return(x/(y-z));\n\
    \    else\n        return(0.0);\n}\nint difference(int p, int q)\n{\n    if(p\
    \ != q)\n        return (1);\n    else\n        return(0);\n}\n```\n```\n\nThe\
    \ above program calculates the ratio\n\n$$\\frac{a}{b-c}$$\n\nand prints the result.\
    \ We have the following three functions:\n\n+   - **main( )**\n+   - **ratio(\
    \ )**\n+   - **difference( )**\n\n**main** reads the values of a, b, and c and\
    \ calls the function **ratio** to calculate the value a/(b-c). This ratio cannot\
    \ be evaluated if (b-c) = 0. Therefore, **ratio** calls another function **difference**\
    \ to test whether the difference (b-c) is zero or not. **difference** returns\
    \ 1, if b is not equal to c; otherwise returns zero to the function **ratio**.\
    \ In turn, **ratio** calculates the value a/(b-c) if it receives 1 and returns\
    \ the result in **float**. In case, **ratio** receives zero from **difference**,\
    \ it sends back 0.0 to **main** indicating that (b-c) = 0.\n\nNesting of function\
    \ calls is also possible. For example, a statement like\n\n```\n```c\np = mul(mul(5,2),6);\n\
    ```\n```\n\nis valid. This represents two sequential function calls. The inner\
    \ function call is evaluated first and the returned value is again used as an\
    \ actual argument in the outer function call. If **mul** returns the product of\
    \ its arguments, then the value of **p** would be 60 (= 5 × 2 × 6)."
