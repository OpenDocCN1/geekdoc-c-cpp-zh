    %s %d %s %d %f\\n\",\n        person.name,\n        person.day,\n        person.month,\n\
    \        person.year,\n        person.salary);\n}\n\nOutput\n\nInput Values\n\
    M.L.Goel 10 January 1945 4500\nM.L.Goel 10 January 1945 4500.00\n```\n```\n\n\
