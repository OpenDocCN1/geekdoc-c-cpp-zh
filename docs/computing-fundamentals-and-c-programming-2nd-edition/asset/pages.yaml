- pgno: 250
  md: 'We should try to avoid using **goto** as far as possible. But there is nothing
    wrong, if we use it to enhance the readability of the program or to improve the
    execution speed.


    # ## Learning Outcomes


    +   - Be aware of any side effects in the control expression such as if(x++).
    LO 7.4.1

    +   - Check the use of =operator in place of the equal operator ==. LO 7.4.1

    +   - Do not give any spaces between the two symbols of relational operators =
    =, !=, >= and <=. LO 7.4.1

    +   - Writing !=, >= and <= operators like =!, => and =< is an error. LO 7.4.1

    +   - Remember to use two ampersands (&&) and two bars (||) for logical operators.
    Use of single operators will result in logical errors. LO 7.4.1

    +   - Do not forget to place parentheses for the if expression. LO 7.4.1

    +   - It is an error to place a semicolon after the if expression. LO 7.4.1

    +   - Do not use the equal operator to compare two floating-point values. They
    are seldom exactly equal. LO 7.4.1

    +   - Avoid using operands that have side effects in a logical binary expression
    such as (x--&&++y). The second operand may not be evaluated at all. LO 7.4.1

    +   - Be aware of dangling else statements. LO 7.4.2

    +   - Use braces to encapsulate the statements in if and else clauses of an if...
    else statement. LO 7.4.2

    +   - Do not forget to use a break statement when the cases in a switch statement
    are exclusive. LO 7.4.3

    +   - Although it is optional, it is a good programming practice to use the default
    clause in a switch statement. LO 7.4.3

    +   - It is an error to use a variable as the value in a case label of a switch
    statement. (Only integral constants are allowed.) LO 7.4.3

    +   - Do not use the same constant in two case labels in a switch statement. LO
    7.4.3

    +   - Try to use simple logical expressions. LO 7.4.4

    +   - Be careful while placing a goto label in a program as it may lead to an
    infinite loop condition. LO 7.4.5


    # ## Key Terms to Remember


    +   - **Decision-making statements:** Are the statements that control the flow
    of execution in a program. LO 7.4.1

    +   - **switch statement:** Is a multi-way decision making statement that chooses
    the statement block to be executed by matching the given value with a list of
    case values. LO 7.4.3

    +   - **Conditional operator:** Is a two-way decision making statement that returns
    one of the two expression values based on the result of the conditional expression.
    LO 7.4.4

    +   - **goto statement:** Is used for unconditional branching. It transfers the
    flow of control to the place where matching label is found. LO 7.4.5

    +   - **Infinite loop:** Is a condition where a set of instructions is repeatedly
    executed. LO 7.4.5'
