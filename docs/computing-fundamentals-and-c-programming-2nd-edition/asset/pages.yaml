  md: "![](img/11b034a94fc590add0a7808250a38792_373_0.png)\n\n![](img/11b034a94fc590add0a7808250a38792_373_1.png)\n\
    \nAfter **strncat (s1, s2, 4);** execution:\n\n![](img/11b034a94fc590add0a7808250a38792_373_2.png)\n\
    \n# **strstr**\n\nIt is a two-parameter function that can be used to locate a\
    \ sub-string in a string. This takes the following forms:\n\n```\nstrstr (s1,\
    \ s2);\nstrstr (s1, \"ABC\");\n```\n\nThe function **strstr** searches the string\
    \ **s1** to see whether the string **s2** is contained in **s1**. If yes, the\
    \ function returns the position of the first occurrence of the sub-string. Otherwise,\
    \ it returns a NULL pointer.\n\nExample:\n\n```\nif (strstr (s1, s2) == NULL)\n\
    \    printf(\"substring is not found\");\nelse\n    printf(\"s2 is a substring\
    \ of s1\");\n```\n\nWe also have functions to determine the existence of a character\
    \ in a string. The function call\n\n```\nstrchr(s1, 'm');\n```\n\nwill locate\
    \ the first occurrence of the character 'm' and the call\n\n```\nstrrchr(s1, 'm');\n\
    ```\n\nwill locate the last occurrence of the character 'm' in the string **s1**.\n\
    \n# Warning\n\n+   - When allocating space for a string during declaration, remember\
    \ to count the terminating null character.\n+   - When creating an array to hold\
    \ a copy of a string variable of unknown size, we can compute the size required\
    \ using the expression\n+     ```\n+     strlen (stringname) +1.\n+     ```\n\
    +   - When copying or concatenating one string to another, we must ensure that\
    \ the target (destination) string has enough space to hold the incoming characters.\
    \ Remember that no error message will be available even if this condition is not\
    \ satisfied. The copying may overwrite the memory and the program may fail in\
    \ an unpredictable way.\n+   - When we use **strncpy** to copy a specific number\
    \ of characters from a source string, we must ensure to append the null character\
    \ to the target string, in case the number of characters is less than or equal\
    \ to the source string."
