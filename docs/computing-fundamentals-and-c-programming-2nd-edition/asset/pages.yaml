- pgno: 456
  md: "```\n```c\nstruct personal_record\n{\n    struct name_part name;\n    struct\
    \ addr_part address;\n    struct date date_of_birth;\n    .....\n    .....\n};\n\
    struct personal_record person1;\n```\n```\n\nThe first member of this structure\
    \ is **name**, which is of the type **struct name_part**. Similarly, other members\
    \ have their structure types.\n\n> > **Note** C permits nesting up to 15 levels.\
    \ However, C99 allows 63 levels of nesting.\n\n# ## 12.10 STRUCTURES AND FUNCTIONS\
    \ LO 12.6\n\nWe know that the main philosophy of C language is the use of functions.\
    \ And therefore, it is natural that C supports the passing of structure values\
    \ as arguments to functions. There are three methods by which the values of a\
    \ structure can be transferred from one function to another.\n\n+   1. The first\
    \ method is to pass each member of the structure as an actual argument of the\
    \ function call. The actual arguments are then treated independently like ordinary\
    \ variables. This is the most elementary method and becomes unmanageable and inefficient\
    \ when the structure size is large.\n+   2. The second method involves passing\
    \ of a copy of the entire structure to the called function. Since the function\
    \ is working on a copy of the structure, any changes to structure members within\
    \ the function are not reflected in the original structure (in the calling function).\
    \ It is, therefore, necessary for the function to return the entire structure\
    \ back to the calling function. All compilers may not support this method of passing\
    \ the entire structure as a parameter.\n+   3. The third approach employs a concept\
    \ called *pointers* to pass the structure as an argument. In this case, the address\
    \ location of the structure is passed to the called function. The function can\
    \ access indirectly the entire structure and work on it. This is similar to the\
    \ way arrays are passed to function. This method is more efficient as compared\
    \ to the second one.\n\nIn this section, we discuss in detail the second method,\
    \ while the third approach using pointers is discussed in the next chapter, where\
    \ pointers are dealt in detail.\n\nThe general format of sending a copy of a structure\
    \ to the called function is:\n\n```\n```c\nfunction_name(structure_variable_name);\n\
    ```\n```\n\nThe called function takes the following form:\n\n```\n```c\ndata_type\
    \ function_name(struct_type st_name)\n{\n    ......\n    ......\n    return(expression);\n\
    }\n```\n```"
