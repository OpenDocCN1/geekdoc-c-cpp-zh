    \       salary = 300;\nelse\n    salary = 4.5 * x+150;\n~~~\n```\n\nWhen the conditional\
    \ operator is used, the code becomes more concise and perhaps, more efficient.\
    \ However, the readability is poor. It is better to use **if** statements when\
