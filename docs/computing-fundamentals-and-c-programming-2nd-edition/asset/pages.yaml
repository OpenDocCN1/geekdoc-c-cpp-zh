  md: "Character strings are often used to build meaningful and readable programs.\
    \ The common operations performed on character strings include the following:\n\
    \n+   - Reading and writing strings.\n+   - Combining strings together.\n+   -\
    \ Copying one string to another.\n+   - Comparing strings for equality.\n+   -\
    \ Extracting a portion of a string.\n\nIn this chapter, we shall discuss these\
    \ operations in detail and examine library functions that implement them.\n\n\
    # ## 10.2 DECLARING AND INITIALIZING STRING VARIABLES    LO 10.1\n\nC does not\
    \ support strings as a data type. However, it allows us to represent strings as\
    \ character arrays. In C, therefore, a string variable is any valid C variable\
    \ name and is always declared as an array of characters. The general form of declaration\
    \ of a string variable is:\n\n```\n    char string_name[ size ];\n```\n\nThe size\
    \ determines the number of characters in the string_name. Some examples are as\
    \ follows:\n\n```\n    char city[10];\n    char name[30];\n```\n\nWhen the compiler\
    \ assigns a character string to a character array, it automatically supplies a\
    \ null character ('\\0') at the end of the string. Therefore, the size should\
    \ be equal to the maximum number of characters in the string plus one.\n\nLike\
    \ numeric arrays, character arrays may be initialized when they are declared.\
    \ C permits a character array to be initialized in either of the following two\
    \ forms:\n\n```\n    char city[9] = \"NEW YORK \";\n    char city[9]={'N','E','W','\
    \ ','Y','O','R','K','\\0'};\n```\n\nThe reason that city had to be 9 elements\
    \ long is that the string NEW YORK contains 8 characters and one element space\
    \ is provided for the null terminator. Note that when we initialize a character\
    \ array by listing its elements, we must supply explicitly the null terminator.\n\
    \nC also permits us to initialize a character array without specifying the number\
    \ of elements. In such cases, the size of the array will be determined automatically,\
    \ based on the number of elements initialized. For example, the statement\n\n\
    ```\n    char string [ ] = {'G','O','O','D','\\0'};\n```\n\ndefines the array\
    \ string as a five element array.\n\nWe can also declare the size much larger\
    \ than the string size in the initializer. That is, the statement\n\n```\n   \
    \ char str[10] = \"GOOD\";\n```\n\nis permitted. In this case, the computer creates\
    \ a character array of size 10, places the value “GOOD” in it, terminates with\
    \ the null character, and initializes all other elements to NULL. The storage\
    \ will look like\n\n| G | O | O | D | \\0 | \\0 | \\0 | \\0 | \\0 | \\0 |\n|---|---|---|---|---|---|---|---|---|---|\n\
    \nHowever, the following declaration is illegal."
