- pgno: 441
  md: "Structures help to organize complex data in a more meaningful way. It is a\
    \ powerful concept that we may often need to use in our program design. This chapter\
    \ is devoted to the study of structures and their applications in program development.\
    \ Another related concept known as *unions* is also discussed.\n\n# ## 12.2 DEFINING\
    \ A STRUCTURE\n\nLO 12.1\n\nUnlike arrays, structures must be defined first for\
    \ their format that may be used later to declare structure variables. Let us use\
    \ an example to illustrate the process of structure definition and the creation\
    \ of structure variables. Consider a book database consisting of book name, author,\
    \ number of pages, and price. We can define a structure to hold this information\
    \ as follows:\n\n```\n```\nstruct book_bank\n{\n    char    title[20];\n    char\
    \    author[15];\n    int     pages;\n    float   price;\n};\n```\n```\n\nThe\
    \ keyword **struct** declares a structure to hold the details of four data fields,\
    \ namely **title**, **author**, **pages**, and **price**. These fields are called\
    \ *structure elements* or *members*. Each member may belong to a different type\
    \ of data. **book_bank** is the name of the structure and is called the *structure\
    \ tag*. The tag name may be used subsequently to declare variables that have the\
    \ tag's structure.\n\nNote that the above definition has not declared any variables.\
    \ It simply describes a format called *template* to represent information as shown\
    \ below:\n\n![](img/11b034a94fc590add0a7808250a38792_441_0.png)\n\nThe general\
    \ format of a structure definition is as follows:\n\n```\n```\nstruct        tag_name\n\
    {\n    data_type     member1;\n    data_type     member2;\n    ----          ----\n\
    \    ----          ----\n};\n```\n```"
  merge: -1
  img_proc: true
- pgno: 442
  md: "In defining a structure you may note the following syntax:\n\n+   1. The template\
    \ is terminated with a semicolon.\n+   2. While the entire definition is considered\
    \ as a statement, each member is declared independently for its name and type\
    \ in a separate statement inside the template.\n+   3. The tag name such as **book_bank**\
    \ can be used to declare structure variables of its type, later in the program.\n\
    \n# ### 12.2.1 Arrays vs Structures\n\nBoth the arrays and structures are classified\
    \ as structured data types as they provide a mechanism that enable us to access\
    \ and manipulate data in a relatively easy manner. But they differ in a number\
    \ of ways which are as follows:\n\n+   1. An array is a collection of related\
    \ data elements of same type. Structure can have elements of different types.\n\
    +   2. An array is derived data type whereas a structure is a programmer-defined\
    \ one.\n+   3. Any array behaves like a built-in data type. All we have to do\
    \ is to declare an array variable and use it. But in the case of a structure,\
    \ first we have to design and declare a data structure before the variables of\
    \ that type are declared and used.\n\n# ## 12.3 DECLARING STRUCTURE VARIABLES\n\
    \nAfter defining a structure format we can declare variables of that type. A structure\
    \ variable declaration is similar to the declaration of variables of any other\
    \ data types. It includes the following elements:\n\n+   1. The keyword **struct**.\n\
    +   2. The structure tag name.\n+   3. List of variable names separated by commas.\n\
    +   4. A terminating semicolon.\n\nFor example, the statement\n\n```\n```c\nstruct\
    \ book_bank, book1, book2, book3;\n```\n```\n\ndeclares **book1**, **book2**,\
    \ and **book3** as variables of type **struct book_bank**.\n\nEach one of these\
    \ variables has four members as specified by the template. The complete declaration\
    \ might look like this:\n\n```\n```c\nstruct book_bank\n{\n    char    title[20];\n\
    \    char    author[15];\n    int     pages;\n    float   price;\n};\nstruct book_bank\
    \ book1, book2, book3;\n```\n```\n\nRemember that the members of a structure themselves\
    \ are not variables. They do not occupy any memory until they are associated with\
    \ the structure variables such as **book1**. When the compiler comes"
  merge: -1
  img_proc: true
