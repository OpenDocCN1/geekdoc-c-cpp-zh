    \ 13.13 Use of pointers to functions\n\n# ### 13.15.1 Compatibility and Casting\n\
    \nA variable declared as a pointer is not just a pointer type variable. It is\
    \ also a pointer to a specific fundamental data type, such as a character. A pointer\
    \ therefore always has a type associated with it. We cannot assign a pointer of\
    \ one type to a pointer of another type, although both of them have memory addresses\
    \ as their values. This is known as incompatibility of pointers.\n\nAll the pointer\
    \ variables store memory addresses, which are compatible, but what is not compatible\
    \ is the underlying data type to which they point to. We cannot use the assignment\
    \ operator with the pointers of different types. We can however make explicit\
    \ assignment between incompatible pointer types by using cast operator, as we\
    \ do with the fundamental types. Example:\n\n```\n````c\nint x;\nchar *p;\np =\
    \ (char *) & x;\n````\n```\n\nIn such cases, we must ensure that all operations\
    \ that use the pointer p must apply casting properly."
