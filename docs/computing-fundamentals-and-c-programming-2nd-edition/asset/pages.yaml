    Three levels of programming languages are available. They are:


    +   1. machine languages (low level languages)

    +   2. assembly (or symbolic) languages

    +   3. procedure-oriented languages (high level languages)


    # ### 2.9.1 Machine Language


    As computers are made of two-state electronic devices they can understand only
    pulse and no-pulse (or ‘1’ and ‘0’) conditions. Therefore, all instructions and
    data should be written using binary codes 1 and 0. The binary code is called the
    machine code or machine language.


    Computers do not understand English, Hindi or Tamil. They respond only to machine
    language. Added to this, computers are not identical in design, therefore, each
    computer has its own machine language. (However, the script 1 and 0, is the same
    for all computers). This poses two problems for the user.


    First, it is difficult to understand and remember the various combinations of
    1s and 0s representing numerous data and instructions. Also, writing error-free
    instructions is a slow process.


    Secondly, since every machine has its own machine language, the user cannot communicate
    with other computers (If he does not know its language). Imagine a Tamilian making
    his first trip to Delhi. He would face enormous obstacles as the language barrier
    would prevent him from communicating.


    Machine languages are usually referred to as the first generation languages.


    # ### 2.9.2 Assembly Language


    The Assembly language, introduced in 1950s, reduced programming complexity and
    provided some standardization to build an application. The assembly language,
    also referred to as the second-generation programming language, is also a low-level
    language. In an assembly language, the 0s and 1s of machine language are replaced
    with abbreviations or mnemonic code.


    The main advantages of an assembly language over a machine language are:


    +   - As we can locate and identify syntax errors in assembly language, it is
    easy to debug it.

    +   - It is easier to develop a computer application using assembly language in
    comparison to machine language.

    +   - Assembly language operates very efficiently.


    An assembly language program consists of a series of instructions and mnemonics
    that correspond to a stream of executable instructions. An assembly language instruction
    consists of a mnemonic code followed by zero or more operands. The mnemonic code
    is called the operation code or opcode, which specifies the operation to be performed
    on the given arguments. Consider the following machine code:


    ```

    ```

    10110000 01100001

    ```

    ```


    Its equivalent assembly language representation is:


    ```

    ```

    mov al, 061h

    ```

    ```


    In the above instruction, the opcode “move” is used to move the hexadecimal value
    61 into the processor register named ‘al’. The following program shows the assembly
    language instructions to subtract two numbers:


    ```

    ```

    ORG 500        /Origin of program is location 500

    LDA SUB        /Load subtrahend to AC

    ```

    ```'
