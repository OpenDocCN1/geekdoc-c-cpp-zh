- pgno: 66
  md: 'Table 2.4 Place values in hexadecimal system


    | Digit | 4 | A | 9 | . | 2 | B |

    |---|---|---|---|---|---|---|

    | Weight | 16² | 16¹ | 16⁰ | . | 16⁻¹ | 16⁻² |


    The value of the hexadecimal number can be computed as the sum of the products
    of the symbol multiplied by the weight of the symbol itself. Therefore, the value
    of the given hexadecimal number is:


    ```

    4 × 16² + 10 × 16¹ + 9 × 16⁰ + 2 × 16⁻¹ + 11 × 16⁻²

    = 1024 + 160 + 9 + 0.125 + 0.0429

    = 1193 + 0.1679

    = 1193.1679

    ```


    The hexadecimal number 4A9.2B represents the decimal value 1193.1679.


    # 2.5 OCTAL SYSTEM


    The octal system is the positional number system that uses base 8 to represent
    different values. Therefore, this number system is also known as *base-8 system*.
    As this system uses base 8, eight symbols are available for representing the values
    in this system. These symbols are the digits 0 to 7.


    The weight associated with each digit in the given octal number can be determined
    by raising 8 to a power equivalent to the position of digit in the number. To
    understand this concept, let us consider the following octal number:


    2 1 5 . 4 3


    In octal system, the point used to separate the integer and the fraction part
    of a number is known as *octal point*. Table 2.5 lists the weights associated
    with each digit in the given octal number.


    Table 2.5 Place values in octal system


    | Digit | 2 | 1 | 5 | . | 4 | 3 |

    |---|---|---|---|---|---|---|

    | Weight | 8² | 8¹ | 8⁰ | . | 8⁻¹ | 8⁻² |


    Using these place values, we can now determine the value of the given octal number
    as:


    ```

    2 × 8² + 1 × 8¹ + 5 × 8⁰ + 4 × 8⁻¹ + 3 × 8⁻²

    = 128 + 8 + 5 + 0.5 + 0.0469

    = 141 + 0.5469

    = 141.5469

    ```


    The octal number 215.43 represents the decimal value 141.5469.


    Table 2.6 lists the octal representation of decimal numbers 0 through 15.'
