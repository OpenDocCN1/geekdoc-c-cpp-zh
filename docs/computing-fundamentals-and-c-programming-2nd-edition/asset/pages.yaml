    ```\n\n**Fig. 8.8**  *Program to build a pyramid*\n\n# **Selecting a Loop**\n\n\
    Given a problem, the programmer’s first concern is to decide the type of loop\
    \ structure to be used. To choose one of the three loop supported by C, we may\
    \ use the following strategy:\n\n+   * Analyse the problem and see whether it\
    \ required a pre-test or post-test loop.\n+   * If it requires a post-test loop,\
    \ then we can use only one loop, **do while**.\n+   * If it requires a pre-test\
    \ loop, then we have two choices: **for** and **while**.\n+   * Decide whether\
    \ the loop termination requires counter-based control or sentinel-based control.\n\
    +   * Use **for** loop if the counter-based control is necessary.\n+   * Use **while**\
    \ loop if the sentinel-based control is required.\n+   * Note that both the counter-controlled\
    \ and sentinel-controlled loops can be implemented by all the three control structures."
