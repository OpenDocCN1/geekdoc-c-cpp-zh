  md: "|  |  |  |\n|---|---|---|\n| -56789L | long int | -56,789 |\n| 987654UL | unsigned\
    \ long int | 9,87,654 |\n\nSimilarly, floating point constants, by default represent\
    \ **double** type data. If we want the resulting data type to be **float** or\
