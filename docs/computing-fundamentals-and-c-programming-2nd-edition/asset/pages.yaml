  md: '# ### 1.11.1 Accessing MS Word


    For working in MS Word, we need to install MS Office in a computer system. After
    installing MS Office, we can start MS Word by using any of the following two ways:


    +   - Start menu

    +   - Run command


    We can start MS Word by performing the following steps using the Start menu:


    +   1. Select Start → All Programs → Microsoft Office.

    +   2. Select the Microsoft Office Word 2007 option to display the Graphical User
    Interface (GUI) of MS Word, as shown in Fig. 1.19.


    ![](img/11b034a94fc590add0a7808250a38792_37_0.png)


    **Using Run command** We can also start MS Word by performing the following steps
    using the Run command:


    +   1. Select Start → All Programs → Accessories → Run to display the Run dialog
    box.

    +   2. Type winword in the Open text box and click OK to display the Document1
    – Microsoft Word window.


    # ### 1.11.2 Basic Operations Performed in MS Word


    The following are the key operations that we can perform in MS Word:


    +   - Creating a document

    +   - Saving a document

    +   - Editing a document

    +   - Formatting a document

