  md: "# # Chapter 6\n\n# Managing Input and Output Operations\n\n# ## LEARNING OBJECTIVES\n\
    \n+   **After reading this chapter, you will be able to**\n+   \n+   - **LO 6.1**\
    \ Describe how a character is read\n+   - **LO 6.2** Express how a character is\
    \ written\n+   - **LO 6.3** Explain formatted input\n+   - **LO 6.4** Discuss\
    \ formatted output\n\n# ## 6.1 INTRODUCTION\n\nReading, processing, and writing\
    \ of data are the three essential functions of a computer program. Most programs\
    \ take some data as input and display the processed data, often known as *information*\
    \ or *results*, on a suitable medium. So far we have seen two methods of providing\
    \ data to the program variables. One method is to assign values to variables through\
    \ the assignment statements such as `x = 5; a = 0;` and so on. Another method\
    \ is to use the input function **scanf** which can read data from a keyboard.\
    \ We have used both the methods in most of our earlier example programs. For outputting\
    \ results we have used extensively the function **printf** which sends results\
    \ out to a terminal.\n\nUnlike other high-level languages, C does not have any\
    \ built-in input/output statements as part of its syntax. All input/output operations\
    \ are carried out through function calls such as **printf** and **scanf**. There\
    \ exist several functions that have more or less become standard for input and\
    \ output operations in C. These functions are collectively known as the standard\
    \ I/O library. In this chapter we shall discuss some common I/O functions that\
    \ can be used on many machines without any change. However, one should consult\
    \ the system reference manual for exact details of these functions and also to\
    \ see what other functions are available."
