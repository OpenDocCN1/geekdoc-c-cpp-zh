  md: "# # BRIEF CASES\n\n# ## 1. Counting Words in a Text [LO 10.1, 10.2 M]\n\nOne\
    \ of the practical applications of string manipulations is counting the words\
    \ in a text. We assume that a word is a sequence of any characters, except escape\
    \ characters and blanks, and that two words are separated by one blank character.\
    \ The algorithm for counting words is as follows:\n\n+   1. Read a line of text.\n\
    +   2. Beginning from the first character in the line, look for a blank. If a\
    \ blank is found, increment words by 1.\n+   3. Continue steps 1 and 2 until the\
    \ last line is completed.\n\nThe implementation of this algorithm is shown in\
    \ Fig. 10.13. The first **while** loop will be executed once for each line of\
    \ text. The end of text is indicated by pressing the 'Return' key an extra time\
    \ after the entire text has been entered. The extra 'Return' key causes a newline\
    \ character as input to the last line and as a result, the last line contains\
    \ only the null character.\n\nThe program checks for this special line using the\
    \ test\n\n    if ( line[0] == '\\0' )\n\nand if the first (and only the first)\
    \ character in the line is a null character, then counting is terminated. Note\
    \ the difference between a null character and a blank character.\n\n```\nProgram\n\
    \n```c\n#include <stdio.h>\nmain()\n{\n    char line[81], ctr;\n    int i, c,\n\
    \        end = 0,\n        characters = 0,\n        words = 0,\n        lines\
    \ = 0;\n    printf(\"KEY IN THE TEXT.\\n\");\n    printf(\"GIVE ONE SPACE AFTER\
    \ EACH WORD.\\n\");\n    printf(\"WHEN COMPLETED, PRESS 'RETURN'.\\n\\n\");\n\
    \    while( end == 0)\n    {\n        /* Reading a line of text */\n        c\
    \ = 0;\n        while((ctr=getchar()) != '\\n')\n            line[c++] = ctr;\n\
    \        line[c] = '\\0';\n        /* counting the words in a line */\n      \
    \  if(line[0] == '\\0')\n            break ;\n```\n```"
  merge: -1
  img_proc: true
