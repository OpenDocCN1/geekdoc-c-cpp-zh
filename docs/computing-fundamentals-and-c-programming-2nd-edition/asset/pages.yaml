  md: "continues to evaluate the body of the *loop* once again. This process continues\
    \ as long as the *condition* is true. When the condition becomes false, the loop\
    \ will be terminated and the control goes to the statement that appears immediately\
    \ after the while statement.\n\nSince the *test-condition* is evaluated at the\
    \ bottom of the loop, the **do...while** construct provides an *exit-controlled*\
    \ loop and therefore the body of the loop is *always executed at least once*.\n\
    \nA simple example of a **do...while** loop is:\n\n```\ndo\n{\n    printf (\"\
    Input a number\\n\");\n    number = getnum ();\n}\nwhile (number > 0);\n```\n\n\
    This segment of a program reads a number from the keyboard until a zero or a negative\
    \ number is keyed in, and assigned to the *sentinel* variable **number**.\n\n\
    The test conditions may have compound relations as well. For instance, the statement\n\
    \n```c\nwhile (number > 0 && number < 100)\n```\n\nin the above example would\
    \ cause the loop to be executed as long as the number keyed in lies between 0\
    \ and 100.\n\nConsider another example:\n\n```\n-------\nI = 1;              \
    \           /* Initializing */\nsum = 0;\ndo\n{\n    sum = sum + I;\n    I = I+2;\
    \                      /* Incrementing */\n}\nwhile(sum < 40 || I < 10);     \
    \  /* Testing */\nprintf(\"%d %d\\n\", I, sum);\n-------\n```\n\nThe loop will\
    \ be executed as long as one of the two relations is true.\n\n# WORKED-OUT PROBLEM\
    \ 8.2\n\nA program to print the multiplication table from 1 × 1 to 12 × 10 as\
