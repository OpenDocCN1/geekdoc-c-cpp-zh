    # ## KEY TERMS TO REMEMBER


    +   - **Transistor:** A semiconductor device that is used to increase the power
    of the incoming signals by preserving the shape of the original signal. LO 1.1

    +   - **Microprocessor:** An integrated circuit that contains the entire central
    processing unit of a computer on a single chip. LO 1.1

    +   - **Vacuum Tube:** An electron tube from which all or most of the gas has
    been removed, permitting electrons to move with low interaction with any remaining
    gas molecules. LO 1.1

    +   - **LSI:** Large Scale Integration. LO 1.1

    +   - **VLSI:** Very large-scale integration (VLSI) refers to an IC or technology
    with many devices on one chip. LO 1.1

    +   - **ICs:** The circuits that combine various electronic components, such as
    transistors, resistors, capacitors, etc. onto a single small silicon chip. LO
    1.1

    +   - **Microcomputer:** A small digital computer that is designed to be used
    by individuals. LO 1.2

    +   - **Super computer:** The fastest type of computer that can perform complex
    operations at a very high speed. LO 1.2

    +   - **Mainframe computer:** A very large computer that is employed by large
    business organisations for handling major applications, such as financial transaction
    processing applications and ERP. LO 1.2

    +   - **Input device:** It is an electromechanical device that is generally used
    for entering information into a computer system. LO 1.3

    +   - **Keyboard:** It is a computer input device consisting of keys or buttons
    arranged in the similar fashion as they are arranged in a typewriter. LO 1.3

    +   - **Mouse:** It is a pointing device that basically controls the two-dimensional
    movement of the cursor on the displayed screen. LO 1.3

    +   - **Scanning devices:** These are the input devices that electronically capture
    text and images and convert them into computer readable form. LO 1.3

    +   - **Monitor:** Monitor is the most commonly used output device, which displays
    the soft copy output of text and graphics to the users. LO 1.3

    +   - **Printers:** Printers are the output devices that are used to produce a
    hard copy output of the text or the documents stored in a computer. LO 1.3

    +   - **Speakers:** Speakers are the output devices used to generate output in
    an audio format from the computer. LO 1.3'
