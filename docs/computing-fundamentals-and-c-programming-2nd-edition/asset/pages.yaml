  md: "# # BRIEF CASES\n\n# ## I. Range of Numbers    [LO 7.1, 7.2 M]\n\n**Problem:**\
    \ A survey of the computer market shows that personal computers are sold at varying\
    \ costs by the vendors. The following is the list of costs (in hundreds) quoted\
    \ by some vendors:\n\n35.00, 40.50, 25.00, 31.25, 68.15,\n47.00, 26.65, 29.00,\
    \ 53.45, 62.50\n\nDetermine the average cost and the range of values.\n\n**Problem\
    \ analysis:** Range is one of the measures of dispersion used in statistical analysis\
    \ of a series of values. The range of any series is the difference between the\
    \ highest and the lowest values in the series. That is\n\nRange = highest value\
