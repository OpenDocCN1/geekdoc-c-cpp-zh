  md: "```\nProgram\n\nstruct class\n{\n    int number;\n    char name[20];\n    float\
    \ marks;\n};\n\nmain()\n{\n    int x;\n    struct class student1 = {111,\"Rao\"\
    ,72.50};\n    struct class student2 = {222,\"Reddy\", 67.00};\n    struct class\
    \ student3;\n\n    student3 = student2;\n\n    x = ((student3.number == student2.number)\
    \ &&\n         (student3.marks == student2.marks)) ? 1 : 0;\n\n    if(x == 1)\n\
    \    {\n        printf(\"\\nstudent2 and student3 are same\\n\\n\");\n       \
    \ printf(\"%d %s %f\\n\", student3.number,\n               student3.name,\n  \
    \             student3.marks);\n    }\n    else\n        printf(\"\\nstudent2\
    \ and student3 are different\\n\\n\");\n\n}\n\nOutput\n\nstudent2 and student3\
    \ are same\n\n222 Reddy 67.000000\n```\n\n**Fig. 12.2** Comparing and copying\
    \ structure variables\n\n# 12.5.1 Word Boundaries and Slack Bytes\n\nComputer\
    \ stores structures using the concept of “word boundary”. The size of a word boundary\
    \ is machine dependent. In a computer with two bytes word boundary, the members\
    \ of a structure are stored left_aligned on the word boundary, as shown below.\
    \ A character data takes one byte and an integer takes two bytes. One byte between\
    \ them is left unoccupied. This unoccupied byte is known as the *slack byte*."
  merge: -1
  img_proc: true
- pgno: 449
  md: "![](img/11b034a94fc590add0a7808250a38792_449_0.png)\n\nWhen we declare structure\
    \ variables, each one of them may contain slack bytes and the values stored in\
    \ such slack bytes are undefined. Due to this, even if the members of two variables\
    \ are equal, their structures do not necessarily compare equal. C, therefore,\
    \ does not permit comparison of structures. However, we can design our own function\
    \ that could compare individual members to decide whether the structures are equal\
    \ or not.\n\n# ## 12.6 OPERATIONS ON INDIVIDUAL MEMBERS\n\nLO 12.3\n\nAs pointed\
    \ out earlier, the individual members are identified using the member operator,\
    \ the *dot*. A member with the *dot operator* along with its structure variable\
    \ can be treated like any other variable name and therefore can be manipulated\
    \ using expressions and operators. Consider the program in Fig. 12.2. We can perform\
    \ the following operations:\n\n```\n```c\nif (student1.number == 111)\n    student1.marks\
    \ += 10.00;\nfloat sum = student1.marks + student2.marks;\nstudent2.marks *= 0.5;\n\
    ```\n```\n\nWe can also apply increment and decrement operators to numeric type\
    \ members. For example, the following statements are valid:\n\n```\n```c\nstudent1.number\
    \ ++;\n++ student1.number;\n```\n```\n\nThe precedence of the *member* operator\
    \ is higher than all *arithmetic* and *relational* operators and therefore no\
    \ parentheses are required.\n\n# ### Three Ways to Access Members\n\nWe have used\
    \ the dot operator to access the members of structure variables. In fact, there\
    \ are two other ways. Consider the following structure:\n\n```\n```c\ntypedef\
    \ struct\n{\n    int x;\n    int y;\n} VECTOR;\nVECTOR v, *ptr;\nptr = & v;\n\
    ```\n```\n\nThe identifier ptr is known as pointer that has been assigned the\
    \ address of the structure variable n. Now, the members can be accessed in the\
    \ following three ways:\n\n+   - using dot notation : v.x\n+   - using indirection\
    \ notation : (*ptr).x"
  merge: -1
