  md: "# Rules for ++ and -- Operators\n\n+   - Increment and decrement operators\
    \ are unary operators and they require variable as their operands.\n+   - When\
    \ postfix ++ (or --) is used with a variable in an expression, the expression\
    \ is evaluated first using the original value of the variable and then the variable\
    \ is incremented (or decremented) by one.\n+   - When prefix ++(or --) is used\
    \ in an expression, the variable is incremented (or decremented) first and then\
    \ the expression is evaluated using the new value of the variable.\n+   - The\
    \ precedence and associativity of ++ and -- operators are the same as those of\
    \ unary + and unary -.\n\n# 5.7 CONDITIONAL OPERATOR\n\nLO 5.1\n\nA ternary operator\
    \ pair \"?:\" is available in C to construct conditional expressions of the form\n\
    \n`exp1 ? exp2 : exp3`\n\nwhere `exp1`, `exp2`, and `exp3` are expressions.\n\n\
    The operator `? :` works as follows: `exp1` is evaluated first. If it is nonzero\
    \ (true), then the expression `exp2` is evaluated and becomes the value of the\
    \ expression. If `exp1` is false, `exp3` is evaluated and its value becomes the\
    \ value of the expression. Note that only one of the expressions (either `exp2`\
    \ or `exp3`) is evaluated. For example, consider the following statements:\n\n\
    ```\n```\na = 10;\nb = 15;\nx = (a > b) ? a : b;\n```\n```\n\nIn this example,\
    \ x will be assigned the value of b. This can be achieved using the if.else statements\
    \ as follows:\n\n```\n```\nif (a > b)\n    x = a;\nelse\n    x = b;\n```\n```\n\
    \n# 5.8 BITWISE OPERATORS\n\nLO 5.2\n\nC has a distinction of supporting special\
    \ operators known as *bitwise operators* for manipulation of data at bit level.\
    \ These operators are used for testing the bits, or shifting them right or left.\
    \ Bitwise operators may not be applied to *float* or *double*. Table 5.5 lists\
    \ the bitwise operators and their meanings.\n\n*Table 5.5 Bitwise Operators*\n\
    \n| Operator | Meaning |\n|---|---|\n| & | bitwise AND |\n| \\| | bitwise OR |\n\
    | ^ | bitwise exclusive OR |\n| << | shift left |\n| >> | shift right |"
