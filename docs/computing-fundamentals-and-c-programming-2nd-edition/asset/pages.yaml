    Your number is smaller than 100

    ```

    ```


    is printed on the screen. Otherwise, the message


    ```

    ```

    Your number contains more than two digits

    ```

    ```


    is printed. Outputs of the program run for two different inputs are also shown
    in Fig. 4.9.'
