  md: 'ae-1 and ae-2 are arithmetic expressions, which may be simple constants, variables
    or combination of them. Given below are some examples of simple relational expressions
    and their values:


    ```

    4.5 <= 10 TRUE

    4.5 < -10 FALSE

    -35 >= 0 FALSE

    10 < 7+5 TRUE

    ```


    a+b = c+d TRUE only if the sum of values of a and b is equal to the sum of values
    of c and d.


    When arithmetic expressions are used on either side of a relational operator,
    the arithmetic expressions will be evaluated first and then the results compared.
    That is, arithmetic operators have a higher priority over relational operators.


    Relational expressions are used in *decision statements* such as **if** and **while**
    to decide the course of action of a running program. We have already used the
    **while** statement in Chapter 3. Decision statements are discussed in detail
    in Chapters 7 and 8.


    # Relational Operator Complements


    Among the six relational operators, each one is a complement of another operator.


    ```

    >   is complement of   <=

    <   is complement of   >=

    ==  is complement of   !=

    ```


    We can simplify an expression involving the *not* and the *less than* operators
    using the complements as shown below:


    | Actual one | Simplified one |

    |---|---|

    | !(x < y) | x >= y |

    | !(x > y) | x <= y |

    | !(x != y) | x == y |

    | !(x <= y) | x > y |

    | !(x >= y) | x < y |

    | !(x == y) | x != y |


    # 5.4 LOGICAL OPERATORS


    In addition to the relational operators, C has the following three *logical operators*.


    ```

    &&    meaning logical    AND

    ||    meaning logical    OR

    !     meaning logical    NOT

    ```


    The logical operators && and || are used when we want to test more than one condition
    and make decisions. An example is:


    ```

    a > b && x == 10

    ```


    An expression of this kind, which combines two or more relational expressions,
    is termed as a *logical expression* or a *compound relational expression*. Like
    the simple relational expressions, a logical expression also yields a value of
    *one* or *zero*, according to the truth table shown in Table 5.3. The logical
    expression given above is true only if **a > b** is *true* and **x == 10** is
    *true*. If either (or both) of them are false, the expression is false.'
