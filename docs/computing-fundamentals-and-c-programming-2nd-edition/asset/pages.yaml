  md: 'Table 4.4 Examples of Numeric Constants


    | Constant | Valid? | Remarks |

    | :--- | :--- | :--- |

    | 698354L | Yes | Represents long integer |

    | 25,000 | No | Comma is not allowed |

    | +5.0E3 | Yes | (ANSI C supports unary plus) |

    | 3.5e-5 | Yes | |

    | 7.1e 4 | No | No white space is permitted |

    | -4.5e-2 | Yes | |

    | 1.5E+2.5 | No | Exponent must be an integer |

    | $255 | No | $ symbol is not permitted |

    | 0X7B | Yes | Hexadecimal integer |


    # 4.5.3 Single-Character Constants


    A single character constant (or simply character constant) contains a single character
    enclosed within a pair of *single* quote marks. Example of character constants
    are:


    ```

    ''5''   ''X''   '';''   '',''

    ```


    Note that the character constant ''5'' is not the same as the *number* 5. The
    last constant is a blank space. Character constants have integer values known
    as ASCII values. For example, the statement


    ```

    printf("%d", ''a'');

    ```


    would print the number 97, the ASCII value of the letter a. Similarly, the statement


    ```

    printf("%c", ''97'');

    ```


    would output the letter ''a''. ASCII values for all characters are given in Appendix
    II.


    Since each character constant represents an integer value, it is also possible
    to perform arithmetic operations on character constants.


    # 4.5.4 String Constants


    A string constant is a sequence of characters enclosed in *double* quotes. The
    characters may be letters, numbers, special characters and blank space. Examples
    are:


    ```

    "Hello!" "1987" "WELL DONE" "?...!" "5+3" "X"

    ```


    Remember that a character constant (e.g., ''X'') is not equivalent to the single
    character string constant (e.g., "X"). Further, a single character string constant
    does not have an equivalent integer value while a character constant has an integer
    value. Character strings are often used in programs to build meaningful programs.


    # 4.5.5 Backslash Character Constants


    C supports some special backslash character constants that are used in output
    functions. For example, the symbol ''\n'' stands for newline character. A list
    of such backslash character constants is given in Table 4.5. Note that each one
    of them represents one character, although they consist of two characters. These
    characters combinations are known as *escape sequences*.'
