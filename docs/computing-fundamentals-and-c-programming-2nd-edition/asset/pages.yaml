  md: "# ## 11.5 DEFINITION OF FUNCTIONS\n\nA *function definition*, also known as\
    \ *function implementation* shall include the following elements:\n\n+   1. function\
    \ name;\n+   2. function type;\n+   3. list of parameters;\n+   4. local variable\
    \ declarations;\n+   5. function statements; and\n+   6. a return statement.\n\
    \nAll the six elements are grouped into two parts, namely,\n\n+   - function header\
    \ (First three elements); and\n+   - function body (Second three elements).\n\n\
    A general format of a function definition to implement these two parts is given\
    \ below:\n\n```\n```\nfunction_type function_name(parameter list)\n{\n    local\
    \ variable declaration;\n    executable statement1;\n    executable statement2;\n\
    \    . . . . .\n    . . . . .\n    return statement;\n}\n```\n```\n\nThe first\
    \ line *function_type function_name(parameter list)* is known as the *function\
    \ header* and the statements within the *opening and closing braces* constitute\
    \ the *function body*, which is a compound statement.\n\n# ### 11.5.1 Function\
    \ Header\n\nThe function header consists of three parts: the function type (also\
    \ known as *return type*), the function name, and the *formal* parameter list.\
    \ Note that a semicolon is not used at the end of the function header.\n\n# ###\
    \ 11.5.2 Name and Type\n\nThe *function type* specifies the type of value (like\
    \ *float* or *double*) that the function is expected to return to the program\
    \ calling the function. If the return type is not explicitly specified, C will\
    \ assume that it is an integer type. If the function is not returning anything,\
    \ then we need to specify the return type as *void*. Remember, *void* is one of\
    \ the fundamental data types in C. It is a good programming practice to code explicitly\
    \ the return type, even when it is an integer. The value returned is the output\
    \ produced by the function.\n\nThe *function name* is any valid C identifier and\
    \ therefore must follow the same rules of formation as other variable names in\
    \ C. The name should be appropriate to the task performed by the function. However,\
    \ care must be exercised to avoid duplicating library routine names or operating\
    \ system commands."
  merge: -1
  img_proc: true
- pgno: 392
  md: "# ### 11.5.3 Formal Parameter List\n\nThe *parameter list* declares the variables\
    \ that will receive the data sent by the calling program. They serve as input\
    \ data to the function to carry out the specified task. Since they represent the\
    \ actual input values, they are often referred to as *formal* parameters. These\
    \ parameters can also be used to send values to the calling programs. This aspect\
    \ will be covered later when we discuss more about functions. The parameters are\
    \ also known as *arguments*.\n\nThe parameter list contains declaration of variables\
    \ separated by commas and surrounded by parentheses.\nExamples:\n\n```\n    float\
    \ quadratic (int a, int b, int c) { ... }\n    double power (double x, int n)\
    \ { ... }\n    float mul (float x, float y) { ... }\n    int sum (int a, int b)\
    \ { ... }\n```\n\nRemember, there is no semicolon after the closing parenthesis.\
    \ Note that the declaration of parameter variables cannot be combined. That is,\
    \ **int sum (int a,b)** is illegal.\n\nA function need not always receive values\
    \ from the calling program. In such cases, functions have no formal parameters.\
    \ To indicate that the parameter list is empty, we use the keyword **void** between\
    \ the parentheses as in\n\n```\n    void printline (void)\n    {\n        ...\n\
    \    }\n```\n\nThis function neither receives any input values nor returns back\
    \ any value. Many compilers accept an empty set of parentheses, without specifying\
    \ anything as in\n\n```\n    void printline ( )\n```\n\nBut, it is a good programming\
    \ style to use **void** to indicate a nil parameter list.\n\n# ### 11.5.4 Function\
    \ Body\n\nThe *function body* contains the declarations and statements necessary\
    \ for performing the required task. The body enclosed in braces, contains three\
    \ parts, in the order given below:\n\n+   1. Local declarations that specify the\
    \ variables needed by the function.\n+   2. Function statements that perform the\
    \ task of the function.\n+   3. A **return** statement that returns the value\
    \ evaluated by the function.\n\nIf a function does not return any value (like\
    \ the **printline** function), we can omit the **return** statement. However,\
    \ note that its return type should be specified as **void**. Again, it is nice\
    \ to have a return statement even for **void** functions.\n\nSome examples of\
    \ typical function definitions are:\n\n```\n    (a) float mul (float x, float\
    \ y)\n        {\n            float result;            /* local variable */\n \
    \           result = x * y;          /* computes the product */\n            return\
    \ (result);         /* returns the result */\n        }\n```"
