- pgno: 62
  md: '# CHAPTER 2


    # Computing Concepts


    # LEARNING OBJECTIVES


    +   After reading this chapter, you will be able to

    +   - LO 2.1 Identify the various positional number systems

    +   - LO 2.2 Carry out number conversions from one number system to another

    +   - LO 2.3 Explain how binary arithmetic operations are performed

    +   - LO 2.4 Describe primary logic gates

    +   - LO 2.5 Discuss various levels of programming languages

    +   - LO 2.6 Know various problem solving techniques and computer applications


    # 2.1 INTRODUCTION


    Computers store and process numbers, letters and words that are often referred
    to as *data*.


    +   - How do we communicate data to computers?

    +   - How do the computers store and process data?


    Since the computers cannot understand the Arabic numerals or the English alphabets,
    we should use some ''codes'' that can be easily understood by them.


    In all modern computers, storage and processing units are made of a set of silicon
    chips, each containing a large number of transistors. A transistor is a two-state
    device that can be put ''off'' and ''on'' by passing an electric current through
    it. Since the transistors are sensitive to currents and act like switches, we
    can communicate with the computers using electric signals, which are represented
    as a series of ''pulse'' and ''no-pulse'' conditions. For the sake of convenience
    and ease of use, a pulse is represented by the code ''1'' and a no-pulse by the
    code ''0''. They are called *bits*, an abbreviation of ''binary digits''. A series
    of 1s and 0s are used to represent a number or a character and thus they provide
    a way for humans and computers to communicate with one another. This idea was
    suggested by John Von Neumann in 1946. The numbers represented by'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'binary digits are known as *binary numbers*. Computers not only store numbers
    but also perform operations on them in binary form.


    In this chapter, we discuss how the numbers are represented using what are known
    as *binary codes*, how computers perform arithmetic operations using the binary
    representation, how digital circuits known as *logic gates* are used to manipulate
    data, how instructions are designed using what are known as *programming languages*
    and how *algorithms* and *flow charts* might help us in developing programs.


    # ## 2.2 DECIMAL SYSTEM


    **LO 2.1**


    The *decimal system* is the most common number system used by human beings. It
    is a positional number system that uses 10 as a base to represent different values.
    Therefore, this number system is also known as *base10 number system*. In this
    system, 10 symbols are available for representing the values. These symbols include
    the digits from 0 to 9. The common operations performed in the decimal system
    are addition (+), subtraction (–), multiplication (×) and division (/).


    The decimal system can be used to represent both the integer as well as floating
    point values. The floating point values are generally represented in this system
    by using a period called decimal point. The decimal point is used to separate
    the integer part and the fraction part of the given floating point number. However,
    there is no need to use a decimal point for representing integer values. The value
    of any number represented in the decimal system can be determined by first multiplying
    the weight associated with each digit in the given number with the digit itself
    and then adding all these values produced as a result of multiplication operation.
    The weight associated with any digit depends upon the position of the digit itself
    in the given number. The most common method to determine the weight of any digit
    in any number system is to raise the base of the number system to a power that
    initially starts with a 0 and then increases by 1 as we move from right to left
    in the given number. To understand this concept, let us consider the following
    floating point number represented in the decimal system:


    Decimal point


    6 5 4 3 . 1 2 4


    In the above example, the value 6543, which comes before the decimal point, is
    called *integer value* and the value 124, which comes after the decimal point,
    is called *fraction value*. Table 2.1 lists the weights associated with each digit
    in the given decimal number.


    **Table 2.1** *Place values in decimal system*


    | Digit | 6 | 5 | 4 | 3 | . | 1 | 2 | 4 |

    |---|---|---|---|---|---|---|---|---|

    | Weight | 10^3 | 10^2 | 10^1 | 10^0 |  | 10^-1 | 10^-2 | 10^-3 |


    The above table shows that the powers to the base increases by 1 towards the left
    for the integer part and decreases by 1 towards the right for the fraction part.
    Using the place values, the floating point number 6543.124 in decimal system can
    be computed as:


    6 × 10^3 + 5 × 10^2 + 4 × 10^1 + 3 × 10^0 + 1 × 10^-1 + 2 × 10^-2 + 4 × 10^-3

    = 6000 + 500 + 40 + 3 + 0.1 + 0.02 + 0.004

    = 6543.124'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# 2.3 BINARY SYSTEM


    Among all the positional number systems, the binary system is the most dominant
    number system that is employed by almost all the modern digital computer systems.
    The binary system uses base 2 to represent different values. Therefore, the binary
    system is also known as *base-2 system*. As this system uses base 2, only two
    symbols are available for representing the different values in this system. These
    symbols are 0 and 1, which are also known as *bits* in computer terminology. Using
    binary system, the computer systems can store and process each type of data in
    terms of 0s and 1s only.


    The following are some of the technical terms used in binary system:


    +   - **Bit.** It is the smallest unit of information used in a computer system.
    It can either have the value 0 or 1. Derived from the words Binary digit.

    +   - **Nibble.** It is a combination of 4 bits.

    +   - **Byte.** It is a combination of 8 bits. Derived from words ‘by eight’.

    +   - **Word.** It is a combination of 16 bits.

    +   - **Double word.** It is a combination of 32 bits.

    +   - **Kilobyte (KB).** It is used to represent the 1024 bytes of information.

    +   - **Megabyte (MB).** It is used to represent the 1024 KBs of information.

    +   - **Gigabyte (GB).** It is used to represent the 1024 MBs of information.


    We can determine the weight associated with each bit in the given binary number
    in the similar manner as we did in the decimal system. In the binary system, the
    weight of any bit can be determined by raising 2 to a power equivalent to the
    position of bit in the number. To understand this concept, let us consider the
    following binary number:


    ![](img/11b034a94fc590add0a7808250a38792_64_0.png)


    In binary system, the point used to separate the integer and fraction part of
    a number is known as *binary point*. Table 2.2 lists the weights associated with
    each bit in the given binary number.


    Table 2.2 Place values in binary system


    | Digit | 1 | 0 | 1 | 0 | 0 | 1 | . | 0 | 1 | 0 | 1 |

    | Weight | 2^5 | 2^4 | 2^3 | 2^2 | 2^1 | 2^0 | | 2^-1 | 2^-2 | 2^-3 | 2^-4 |


    Like the decimal system, the powers to the base increases by 1 towards the left
    for the integer part and decreases by 1 towards the right for the fraction part.
    The value of the given binary number can be determined as the sum of the products
    of the bits multiplied by the weight of the bit itself. Therefore, the value of
    the binary number 101001.0101 can be obtained as:


    ```

    1 × 2^5 + 0 × 2^4 + 1 × 2^3 + 0 × 2^2 + 0 × 2^1 + 1 × 2^0 + 0 × 2^-1 + 1 × 2^-2
    + 0 × 2^-3 + 1 × 2^-4

    = 32 + 8 + 1 + 0.25 + 0.0625

    = 41.3125

    ```


    The binary number 101001.0101 represents the decimal value 41.3125.'
  merge: -1
  img_proc: true
