  md: "# 12.4.1  Structure Initialization\n\nLike any other data type, a structure\
    \ variable can be initialized at compile time.\n\n```\n    main()\n    {\n   \
    \         struct\n            {\n                    int weight;\n           \
    \         float height;\n            }\n            student = {60, 180.75};\n\
    \            .....\n            .....\n    }\n```\n\nThis assigns the value 60\
    \ to **student. weight** and 180.75 to **student. height**. There is a one-to-one\n\
    correspondence between the members and their initializing values.\n\nA lot of\
    \ variation is possible in initializing a structure. The following statements\
    \ initialize two structure\nvariables. Here, it is essential to use a tag name.\n\
    \n```\n    main()\n    {\n            struct st_record\n            {\n      \
    \              int weight;\n                    float height;\n            };\n\
    \            struct st_record student1 = { 60, 180.75 };\n            struct st_record\
    \ student2 = { 53, 170.60 };\n            .....\n            .....\n    }\n```\n\
    \nAnother method is to initialize a structure variable outside the function as\
    \ shown below:\n\n```\n    struct st_record\n    {\n            int weight;\n\
    \            float height;\n    }\n    student1 = {60, 180.75};\n    main()\n\
    \    {\n            struct st_record student2 = {53, 170.60};\n            .....\n\
    \            .....\n    }\n```"
