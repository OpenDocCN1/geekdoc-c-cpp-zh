    \ in other systems.) The file INPUT is closed at this signal.\n\n```\nProgram\n\
    \n#include <stdio.h>\n\nmain()\n{\n    FILE *f1;\n    char c;\n    printf(\"Data\
    \ Input\\n\\n\");\n    /* Open the file INPUT */\n    f1 = fopen(\"INPUT\", \"\
