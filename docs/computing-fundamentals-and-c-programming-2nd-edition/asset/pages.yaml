    \    sancloan = (loan1>0) ? 0 : ((sum23>MAXLOAN)?\n                MAXLOAN - loan2\
    \ : loan3);\n    printf(\"\\n\\n\");\n    printf(\"Previous loans pending:\\n%ld\
    \ %ld\\n\",loan1,loan2);\n    printf(\"Loan requested = %ld\\n\", loan3);\n  \
    \  printf(\"Loan sanctioned = %ld\\n\", sancloan);\n}\n~~~\n```\n\n# **Output**\n\
