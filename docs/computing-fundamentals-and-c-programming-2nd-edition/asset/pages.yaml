  md: "# 10.6 PUTTING STRINGS TOGETHER\n\nLO 10.4\n\nJust as we cannot assign one\
    \ string to another directly, we cannot join two strings together by the simple\
    \ arithmetic addition. That is, the statements such as\n\n```\n```\nstring3 =\
    \ string1 + string2;\nstring2 = string1 + \"hello\";\n```\n```\n\nare not valid.\
    \ The characters from **string1** and **string2** should be copied into the **string3**\
    \ one after the other. The size of the array **string3** should be large enough\
    \ to hold the total characters.\n\nThe process of combining two strings together\
    \ is called *concatenation*. Program 10.9 illustrates the concatenation of three\
    \ strings.\n\n# **WORKED-OUT PROBLEM 10.8**\n\nThe names of employees of an organization\
    \ are stored in three arrays, namely **first_name**, **second_name**, and **last_name**.\
    \ Write a program to concatenate the three parts into one string to be called\
    \ **name**.\n\nThe program is given in Fig. 10.9. Three *for* loops are used to\
    \ copy the three strings. In the first loop, the characters contained in the **first_name**\
    \ are copied into the variable **name** until the *null* character is reached.\
    \ The *null* character is not copied; instead it is replaced by a *space* by the\
    \ assignment statement\n\n```\n```\nname[i] = ' ' ;\n```\n```\n\nSimilarly, the\
    \ **second_name** is copied into **name**, starting from the column just after\
    \ the space created by the above statement. This is achieved by the assignment\
    \ statement\n\n```\n```\nname[i+j+1] = second_name[j];\n```\n```\n\nIf **first_name**\
    \ contains 4 characters, then the value of *i* at this point will be 4 and therefore\
    \ the first character from **second_name** will be placed in the *fifth cell*\
    \ of **name**. Note that we have stored a space in the *fourth cell*.\n\nIn the\
    \ same way, the statement\n\n```\n```\nname[i+j+k+2] = last_name[k];\n```\n```\n\
    \nis used to copy the characters from **last_name** into the proper locations\
    \ of **name**.\n\nAt the end, we place a null character to terminate the concatenated\
    \ string **name**. In this example, it is important to note the use of the expressions\
    \ **i+j+1** and **i+j+k+2**.\n\n```\n```\nProgram\n\nmain()\n{\n    int i, j,\
    \ k ;\n    char first_name[10] = {\"VISWANATH\"} ;\n    char second_name[10] =\
    \ {\"PRATAP\"} ;\n    char last_name[10] = {\"SINGH\"} ;\n    char name[30] ;\n\
    \    /* Copy first name into name */\n    for( i = 0 ; first_name[i] != '\\0'\
    \ ; i++ )\n        name[i] = first_name[i] ;\n```\n```"
