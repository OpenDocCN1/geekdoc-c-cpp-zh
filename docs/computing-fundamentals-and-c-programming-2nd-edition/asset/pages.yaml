  md: "```\n```c\nvoid mathoperation (int a, int b, int *sum, int *diff)\n{\n    *sum\
    \ = a+b;\n    *diff = a-b;\n}\n```\n```\n\nThe actual arguments x and y are input\
    \ arguments, s and d are output arguments. In the function call, while we pass\
    \ the actual values of x and y to the function, we pass the addresses of locations\
    \ where the values of s and d are stored in the memory. (That is why, the operator\
    \ & is called the address operator.) When the function is called the following\
    \ assignments occur:\n\nvalue of x to a\nvalue of y to b\naddress of s to sum\n\
    address of d to diff\n\nNote that indirection operator * in the declaration of\
    \ sum and diff in the header indicates these variables are to store addresses,\
    \ not actual values of variables. Now, the variables sum and diff point to the\
    \ memory locations of s and d respectively.\n\n(The operator * is known as indirection\
    \ operator because it gives an indirect reference to a variable through its address.)\n\
    \nIn the body of the function, we have two statements:\n\n```\n```c\n*sum = a+b;\n\
    *diff = a-b;\n```\n```\n\nThe first one adds the values a and b and the result\
    \ is stored in the memory location pointed to by sum. Remember, this memory location\
    \ is the same as the memory location of s. Therefore, the value stored in the\
    \ location pointed to by sum is the value of s.\n\nSimilarly, the value of a-b\
    \ is stored in the location pointed to by diff, which is the same as the location\
    \ d. After the function call is implemented, the value of s is a+b and the value\
    \ of d is a-b. Output will be:\n\n```\n```\ns = 30\nd = 10\n```\n```\n\nThe variables\
    \ *sum and *diff are known as pointers and sum and diff as pointer variables.\
    \ Since they are declared as int, they can point to locations of int type data.\n\
    \nThe use of pointer variables as actual parameters for communicating data between\
    \ functions is called “pass by pointers” or “call by address or reference”. Pointers\
    \ and their applications are discussed in detail in Chapter 13.\n\n# ### Rules\
    \ for Pass by Pointers\n\n+   1. The types of the actual and formal arguments\
    \ must be same.\n+   2. The actual arguments (in the function call) must be the\
    \ addresses of variables that are local to the calling function.\n+   3. The formal\
    \ arguments in the function header must be prefixed by the indirection operator\
    \ *.\n+   4. In the prototype, the arguments must be prefixed by the symbol *.\n\
    +   5. To access the value of an actual argument in the called function, we must\
    \ use the corresponding formal argument prefixed with the indirection operator\
    \ *."
