    Let x, y and z be the numbers. Now, we can follow the algorithm below to determine
    the greatest number among the three:


    +   1. Read the three numbers.

    +   2. If x > y

    +       a. If x > z, then x is the greatest number.

    +       b. Else, z is the greatest number

    +   3. Else,

    +       a. If y > z, then y is the greatest number.

    +       b. Else, z is the greatest number.


    # **Example 2.50** *Write the algorithm for converting the degree in Celsius from
    Fahrenheit*


    Let us consider x to be the temperature given in Celsius. Now, we need to follow
    the algorithm below to determine the temperature in Fahrenheit:


    +   1. Read x

    +   2. Multiply x with 9/5.

    +   3. Add 32 to the multiplied result.

    +   4. Print the final value which is the temperature in Fahrenheit.


    # **Example 2.51** *Write the algorithm for calculating the average of n integers.*'
