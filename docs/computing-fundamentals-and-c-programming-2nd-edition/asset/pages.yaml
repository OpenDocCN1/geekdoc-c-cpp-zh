- pgno: 515
  md: "+   - reading data from a file,\n+   - writing data to a file, and\n+   - closing\
    \ a file.\n\nThere are two distinct ways to perform file operations in C. The\
    \ first one is known as the *low-level I/O* and uses UNIX system calls. The second\
    \ method is referred to as the *high-level I/O* operation and uses functions in\
    \ C's standard I/O library. We shall discuss in this chapter, the important file\
    \ handling functions that are available in the C library. They are listed in Table\
    \ 14.1.\n\n**Table 14.1** *High Level I/O Functions*\n\n| Function name | Operation\
    \ |\n| --- | --- |\n| fopen() | * Creates a new file for use. |\n| fclose() |\
    \ * Opens an existing file for use. |\n| getc() | * Closes a file which has been\
    \ opened for use. |\n| putc() | * Reads a character from a file. |\n| fprintf()\
    \ | * Writes a character to a file. |\n| fscanf() | * Writes a set of data values\
    \ to a file. |\n| getw() | * Reads a set of data values from a file. |\n| putw()\
    \ | * Reads an integer from a file. |\n| fseek() | * Writes an integer to a file.\
    \ |\n| ftell() | * Sets the position to a desired point in the file. |\n| rewind()\
    \ | * Gets the current position in the file (in terms of bytes from the start).\
    \ |\n\nThere are many other functions. Not all of them are supported by all compilers.\
    \ You should check your C library before using a particular I/O function.\n\n\
    # ## 14.2 DEFINING AND OPENING A FILE\n\n**LO 14.1**\n\nIf we want to store data\
    \ in a file in the secondary memory, we must specify certain things about the\
    \ file, to the operating system. They include the following:\n\n+   1. Filename\n\
    +   2. Data structure\n+   3. Purpose\n\n*Filename* is a string of characters\
    \ that make up a valid filename for the operating system. It may contain two parts,\
    \ a *primary name* and an *optional period* with the extension. Examples:\n\n\
    Input.data  \nstore  \nPROG.C  \nStudent.c  \nText.out"
  merge: -1
  img_proc: true
- pgno: 516
  md: "Data structure of a file is defined as **FILE** in the library of standard\
    \ I/O function definitions. Therefore, all files should be declared as type FILE\
    \ before they are used. **FILE** is a defined data type.\n\nWhen we open a file,\
    \ we must specify what we want to do with the file. For example, we may write\
    \ data to the file or read the already existing data.\n\nFollowing is the general\
    \ format for declaring and opening a file:\n\n```\nFILE *fp;\n    fp = fopen(\"\
    filename\", \"mode\");\n```\n\nThe first statement declares the variable **fp**\
    \ as a \"pointer to the data type **FILE**\". As stated earlier, **FILE** is a\
    \ structure that is defined in the I/O library. The second statement opens the\
    \ file named filename and assigns an identifier to the **FILE** type pointer **fp**.\
    \ This pointer, which contains all the information about the file is subsequently\
    \ used as a communication link between the system and the program.\n\nThe second\
    \ statement also specifies the purpose of opening this file. The mode does this\
    \ job. Mode can be one of the following:\n\n+   * **r** open the file for reading\
    \ only.\n+   * **w** open the file for writing only.\n+   * **a** open the file\
    \ for appending (or adding) data to it.\n\nNote that both the filename and mode\
    \ are specified as strings. They should be enclosed in double quotation marks.\n\
    \nWhen trying to open a file, one of the following things may happen:\n\n+   1.\
    \ When the mode is 'writing', a file with the specified name is created if the\
    \ file does not exist. The contents are deleted, if the file already exists.\n\
    +   2. When the purpose is 'appending', the file is opened with the current contents\
    \ safe. A file with the specified name is created if the file does not exist.\n\
    +   3. If the purpose is 'reading', and if it exists, then the file is opened\
    \ with the current contents safe otherwise an error occurs.\n\nConsider the following\
    \ statements:\n\n```\nFILE *p1, *p2;\n    p1 = fopen(\"data\", \"r\");\n    p2\
    \ = fopen(\"results\", \"w\");\n```\n\nThe file **data** is opened for reading\
    \ and **results** is opened for writing. In case, the **results** file already\
    \ exists, its contents are deleted and the file is opened as a new file. If **data**\
    \ file does not exist, an error will occur.\n\nMany recent compilers include additional\
    \ modes of operation. They include:\n\n+   * **r+** The existing file is opened\
    \ to the beginning for both reading and writing.\n+   * **w+** Same as **w** except\
    \ both for reading and writing.\n+   * **a+** Same as **a** except both for reading\
    \ and writing.\n\nWe can open and use a number of files at a time. This number\
    \ however depends on the system we use.\n\n# ### 14.3 CLOSING A FILE\n\nA file\
    \ must be closed as soon as all operations on it have been completed. This ensures\
    \ that all outstanding information associated with the file is flushed out from\
    \ the buffers and all links to the file are broken. It also prevents any accidental\
    \ misuse of the file. In case, there is a limit to the number of files that can\
    \ be kept open simultaneously, closing of unwanted files might help open the required\
    \ files. Another instance where"
  merge: -1
  img_proc: true
- pgno: 517
  md: "we have to close a file is when we want to reopen the same file in a different\
    \ mode. The I/O library supports a function to do this for us. It takes the following\
    \ form:\n\n```\n`fclose(file_pointer);`\n```\n\nThis would close the file associated\
    \ with the **FILE** pointer **file_pointer**. Look at the following segment of\
    \ a program.\n\n```\n    ......\n    FILE *p1, *p2;\n    p1 = fopen(\"INPUT\"\
    , \"w\");\n    p2 = fopen(\"OUTPUT\", \"r\");\n    ......\n    ......\n    fclose(p1);\n\
    \    fclose(p2);\n    ......\n```\n\nThis program opens two files and closes them\
    \ after all operations on them are completed. Once a file is closed, its file\
    \ pointer can be reused for another file.\n\nAs a matter of fact all files are\
    \ closed automatically whenever a program terminates. However, closing a file\
    \ as soon as you are done with it is a good programming habit.\n\n# ## 14.4 INPUT/OUTPUT\
    \ OPERATIONS ON FILES\n\nOnce a file is opened, reading out of or writing to it\
    \ is accomplished using the standard I/O routines that are listed in Table 14.1.\n\
    \n# ### The getc and putc Functions\n\nThe simplest file I/O functions are **getc**\
    \ and **putc**. These are analogous to **getchar** and **putchar** functions and\
    \ handle one character at a time. Assume that a file is opened with mode **w**\
    \ and file pointer **fp1**. Then, the statement\n\n```\n`putc(c, fp1);`\n```\n\
    \nwrites the character contained in the character variable **c** to the file associated\
    \ with **FILE** pointer **fp1**. Similarly, **getc** is used to read a character\
    \ from a file that has been opened in read mode. For example, the statement\n\n\
    ```\n`c = getc(fp2);`\n```\n\nwould read a character from the file whose file\
    \ pointer is **fp2**.\n\nThe file pointer moves by one character position for\
    \ every operation of **getc** or **putc**. The **getc** will return an end-of-file\
    \ marker **EOF**, when end of the file has been reached. Therefore, the reading\
    \ should be terminated when **EOF** is encountered.\n\n# ## WORKED-OUT PROBLEM\
    \ 14.1\n\nWrite a program to read data from the keyboard, write it to a file called\
    \ **INPUT**, again read the same data from the **INPUT** file, and display it\
    \ on the screen."
