- pgno: 310
  md: "The size may be omitted. In such cases, the compiler allocates enough space\
    \ for all initialized elements. For example, the statement\n\n```\nint counter[\
    \ ] = {1,1,1,1};\n```\n\nwill declare the **counter** array to contain four elements\
    \ with initial values 1. This approach works fine as long as we initialize every\
    \ element in the array.\n\nCharacter arrays may be initialized in a similar manner.\
    \ Thus, the statement\n\n```\nchar name[ ] = {'J', 'o', 'h', 'n', '\\0'};\n```\n\
    \ndeclares the **name** to be an array of five characters, initialized with the\
    \ string “John” ending with the null character. Alternatively, we can assign the\
    \ string literal directly as under:\n\n```\nchar name [ ] = \"John\";\n```\n\n\
    (Character arrays and strings are discussed in detail in Chapter 10.)\n\nCompile\
    \ time initialization may be partial. That is, the number of initializers may\
    \ be less than the declared size. In such cases, the remaining elements are initialized\
    \ to zero, if the array type is numeric and NULL if the type is char. For example,\n\
    \n```\nint number [5] = {10, 20};\n```\n\nwill initialize the first two elements\
    \ to 10 and 20 respectively, and the remaining elements to 0. Similarly, the declaration.\n\
    \n```\nchar city [5] = {'B'};\n```\n\nwill initialize the first element to ‘B’\
    \ and the remaining four to NULL. It is a good idea, however, to declare the size\
    \ explicitly, as it allows the compiler to do some error checking.\n\nRemember,\
    \ however, if we have more initializers than the declared size, the compiler will\
    \ produce an error. That is, the statement\n\n```\nint number [3] = {10, 20, 30,\
    \ 40};\n```\n\nwill not work. It is illegal in C.\n\n# ## 9.4.2   Run Time Initialization\n\
    \nAn array can be explicitly initialized at run time. This approach is usually\
    \ applied for initializing large arrays. For example, consider the following segment\
    \ of a C program.\n\n```\n-------\n-------\nfor (i = 0; i < 100; i = i+1)\n{\n\
    \    if i < 50\n        sum[i] = 0.0;          /* assignment statement */\n  \
    \  else\n        sum[i] = 1.0;\n}\n-------\n-------\n-------\n```\n\nThe first\
    \ 50 elements of the array **sum** are initialized to zero while the remaining\
    \ 50 elements are initialized to 1.0 at run time.\n\nWe can also use a read function\
    \ such as **scanf** to initialize an array. For example, the statements\n\n```\n\
    int x [3];\n```"
