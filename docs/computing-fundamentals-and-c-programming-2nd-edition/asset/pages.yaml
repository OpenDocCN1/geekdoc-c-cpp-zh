- pgno: 232
  md: "The program uses **count** to count the number of terms added. The program\
    \ stops when the value of the term is less than 0.0001 (**ACCURACY**). Note that\
    \ when a term is less than **ACCURACY**, the value of *n* is set equal to 999\
    \ (a number higher than 100) and therefore the **while** loop terminates. The\
    \ results are printed outside the **while** loop.\n\n# 7.5 NESTING OF IF...ELSE\
    \ STATEMENTS  LO 7.2\n\nWhen a series of decisions are involved, we may have to\
    \ use more than one **if...else** statement in *nested* form as shown below:\n\
    \n![](img/11b034a94fc590add0a7808250a38792_232_0.png)\n\nThe logic of execution\
    \ is illustrated in Fig. 7.7. If the *condition-1* is false, the statement-3 will\
    \ be executed; otherwise it continues to perform the second test. If the *condition-2*\
    \ is true, the statement-1 will be evaluated; otherwise the statement-2 will be\
    \ evaluated and then the control is transferred to the statement-x.\n\nA commercial\
    \ bank has introduced an incentive policy of giving bonus to all its deposit holders.\
    \ The policy is as follows: A bonus of 2 per cent of the balance held on 31st\
    \ December is given to every one, irrespective of their balance, and 5 per cent\
    \ is given to female account holders if their balance is more than Rs. 5000. This\
    \ logic can be coded as follows:\n\n```\n~~~\n..........\nif (sex is female)\n\
    {\n    if (balance > 5000)\n        bonus = 0.05 * balance;\n    else\n      \
    \  bonus = 0.02 * balance;\n}\nelse\n{\n    bonus = 0.02 * balance;\n}\nbalance\
    \ = balance + bonus;\n..........\n..........\n~~~\n```"
  merge: -1
  img_proc: true
- pgno: 233
  md: "![](img/11b034a94fc590add0a7808250a38792_233_0.png)\n\nFig. 7.7 Flow chart\
    \ of nested if...else statements\n\nWhen nesting, care should be exercised to\
    \ match every *if* with an *else*. Consider the following alternative to the above\
    \ program (which looks right at the first sight):\n\n```\nif (sex is female)\n\
    \    if (balance > 5000)\n        bonus = 0.05 * balance;\n    else\n        bonus\
    \ = 0.02 * balance;\nbalance = balance + bonus;\n```\n\nThere is an ambiguity\
    \ as to over which *if* the *else* belongs to. In C, an else is linked to the\
    \ closest non-terminated *if*. Therefore, the *else* is associated with the inner\
    \ *if* and there is no else option for the outer *if*. This means that the computer\
    \ is trying to execute the statement\n\n```\nbalance = balance + bonus;\n```\n\
    \nwithout really calculating the bonus for the male account holders."
  merge: -1
  img_proc: true
