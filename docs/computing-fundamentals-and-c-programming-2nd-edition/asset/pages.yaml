- pgno: 463
  md: '+   - We cannot declare a variable at the time of creating a `typedef` definition.
    We must use the `type_name` to declare a variable in an independent statement.
    LO 12.2

    +   - It is an error to use a structure variable as a member of its own `struct`
    type structure. LO 12.1

    +   - Declaring a variable using the tag name only (without the keyword `struct`)
    is an error. LO 12.2

    +   - It is illegal to refer to a structure member using only the member name.
    LO 12.2

    +   - When using `scanf` for reading values for members, we must use address operator
    `&` with non-string members. LO 12.4

    +   - Always provide a structure tag name when creating a structure. It is convenient
    to use tag name to declare new structure variables later in the program. LO 12.2

    +   - Use short and meaningful structure tag names. LO 12.2

    +   - Avoid using same names for members of different structures (although it
    is not illegal). LO 12.2

    +   - It is an error to compare two structure variables. LO 12.3

    +   - Assigning a structure of one type to a structure of another type is an error.
    LO 12.3

    +   - When accessing a member with a pointer and dot notation, parentheses are
    required around the pointer, like `(*ptr).number`. LO 12.3

    +   - The selection operator (`->`) is a single token. Any space between the symbols
    `-` and `>` is an error. LO 12.3

    +   - Forgetting to include the array subscript when referring to individual structures
    of an array of structures is an error. LO 12.3

    +   - When structures are nested, a member must be qualified with all levels of
    structures nesting it. LO 12.5

    +   - Passing structures to functions by pointers is more efficient than passing
    by value. (Passing by pointers are discussed in Chapter 13.) LO 12.5

    +   - A union can store only one of its members at a time. We must exercise care
    in accessing the correct member. Accessing a wrong data is a logic error. LO 12.7

    +   - It is an error to initialize a union with data that does not match the type
    of the first member. LO 12.7

    +   - We cannot take the address of a bit field. Therefore, we cannot use `scanf`
    to read values in bit fields. We can neither use pointer to access the bit fields.
    LO 12.7

    +   - Bit fields cannot be arrayed. LO 12.7


    # ## KEY TERMS TO REMEMBER


    +   - **Array:** It is a fixed-size sequenced collection of elements of the same
    data type. LO 12.1

    +   - **Dot operator:** This links a structure variable with a structure member.
    It is used to read/write member values. LO 12.4

    +   - **Structure:** This is a user-defined data type that allows different data
    types to be combined together to represent a data record. LO 12.2

    +   - **Union:** It is similar to a structure in syntax but differs in storage
    technique. Unlike structures, union members use the same memory location for storing
    all member values. LO 12.7

    +   - **Bit field:** This refers to a set of adjacent bits with size ranging from
    1 to 16 bits. LO 12.7'
