  md: '# LEARNING OUTCOMES


    +   - Use macros to manage changes made to a program code in a systematic manner.
    LO 15.1

    +   - Use #undef to undefine a macro so that it is restricted to only a specific
    part in a program. LO 15.1

    +   - Remember that `#include <filename>` directive searches the file only in
    the standard directories as defined by the compiler. However, the `#include "filename"`
    directive searches the file in the program''s source directory; and if the file
    is not located, it then searches for the file in the standard directories. LO
    15.2

    +   - Use #ifndef to end if directives for conditional compilation of program
    code. LO 15.3


    # KEY TERMS TO REMEMBER


    +   - **Macro call:** It substitutes the macro identifier with the corresponding
    string, replacing formal parameters with actual parameters. LO 15.1

    +   - **Macro substitution:** It is a process where an identifier in a program
    is replaced by a predefined string composed of one or more tokens. LO 15.1

    +   - **Preprocessor:** It is a program that processes the source code before
    it passes through the compiler. LO 15.1

    +   - **Conditional Compilation:** It is a feature that allows for a particular
    line or group of lines of code to be compiled if certain condition is met. LO
