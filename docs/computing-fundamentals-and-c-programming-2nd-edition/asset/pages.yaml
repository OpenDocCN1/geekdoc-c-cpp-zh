    # ### 2.11.1 Algorithms


    An algorithm is a complete, detailed, and precise step-by-step method for solving
    a problem independently of the software or hardware of the computer. Algorithms
    are very essential, as they instruct the computer what specific steps it needs
    to perform to carry out a particular task or to solve a problem. To understand
    how an algorithm works, let us consider the following example:


    Let us assume that XYZ company gives each of its salespersons Rs 5000 at the starting
    of the month for covering various expenses, such as food, lodge, and travel. At
    the end of the month, the salesperson must submit the receipts of his/her total
    expenditures to the company. If the amount is less than Rs 5000, then the remaining
    amount must be returned to the company. Now, a simple algorithm can be developed
    to find out how much money, if any, should be returned to the company.


    +   1. Calculate the total expense receipts of the month.

    +   2. Subtract this amount from Rs 5000.

    +   3. If the remainder is greater than 0, return the amount to the company.


    # ### 2.11.2 Top-down Approach of Algorithms


    The top-down approach of an algorithm to solve a given problem is also known as
    divide and conquer. In this approach, the given problem is divided into two or
    more sub problems, each of which resembles the original problem. The solution
    of each sub problem is taken out independently. Finally, the solution of all sub
    problems is combined to obtain the solution of the main problem. One of the most
    common examples of the implementation of top-down approach is binary search.


    Binary search is a method, which helps search the required data from a given list
    of data. This method involves comparing the data to be searched and the data present
    at the middle position of the list. If the data available at the middle position
    of the list is similar to the data to be searched, the search is considered successful.
    Otherwise, the list is divided into two parts, left half and right half. The data
    to be searched is compared with the data present at the mid position. If it is
    lesser than the data available at the mid position, the left half of the list
    is searched and if it is greater than the data at the mid position, the right
    half of the list is searched. This process is repeated until the data to be searched
    is found or the whole list has been searched. If the data to be searched is found
    then the search is successful, otherwise the search becomes unsuccessful.


