  md: "# Decision Making and Looping\n\n# CHAPTER 8\n\n# LEARNING OBJECTIVES\n\nAfter\
    \ reading this chapter, you will be able to\n\n+   - **LO 8.1** Discuss while\
    \ statement\n+   - **LO 8.2** Explain do statement\n+   - **LO 8.3** Describe\
    \ for statement\n+   - **LO 8.4** Illustrate how jumps are applied in loops\n\n\
    # 8.1  INTRODUCTION\n\nWe have seen in Chapter 7 that it is possible to execute\
    \ a segment of a program repeatedly by introducing a counter and later testing\
    \ it using the if statement. While this method is quite satisfactory for all practical\
    \ purposes, we need to initialize and increment a counter and test its value at\
    \ an appropriate place in the program for the completion of the loop. For example,\
    \ suppose we want to calculate the sum of squares of all integers between 1 and\
    \ 10, we can write a program using the if statement as follows:\n\n```\nsum =\
    \ 0;\nn = 1;\nloop:\n    sum = sum + n*n;\n    if (n == 10)\n        goto print;\n\
    \    else\n    {\n        n = n+1;\n        goto loop;\n    }\nprint:\n```"
  merge: -1
  img_proc: true
- pgno: 265
  md: 'This program does the following things:


    +   1. Initializes the variable **n**.

    +   2. Computes the square of **n** and adds it to **sum**.

    +   3. Tests the value of **n** to see whether it is equal to 10 or not. If it
    is equal to 10, then the program prints the results.

    +   4. If **n** is less than 10, then it is incremented by one and the control
    goes back to compute the **sum** again.


    The program evaluates the statement


    ```

    sum = sum + n*n;

    ```


    10 times. That is, the loop is executed 10 times. This number can be increased
    or decreased easily by modifying the relational expression appropriately in the
    statement if (n == 10). On such occasions where the exact number of repetitions
    are known, there are more convenient methods of looping in C. These looping capabilities
    enable us to develop concise programs containing repetitive processes without
    the use of goto statements.


    In looping, a sequence of statements are executed until some conditions for termination
    of the loop are satisfied. A *program loop* therefore consists of two segments,
    one known as the *body of the loop* and the other known as the *control statement*.
    The control statement tests certain conditions and then directs the repeated execution
    of the statements contained in the body of the loop.


    Depending on the position of the control statement in the loop, a control structure
    may be classified either as the *entry-controlled loop* or as the *exit-controlled
    loop*. The flow charts in Fig. 8.1 illustrate these structures. In the entry-controlled
    loop, the control conditions are tested before the start of the loop execution.
    If the conditions are not satisfied, then the body of the loop will not be executed.
    In the case of an exit-controlled loop, the test is performed at the end of the
    body of the loop and therefore the body is executed unconditionally for the first
    time. The entry-controlled and exit-controlled loops are also known as *pre-test*
    and *post-test* loops respectively.


    ![](img/11b034a94fc590add0a7808250a38792_265_0.png)


    **Fig. 8.1** *Loop control structures*'
