    \                /* Incrementing */\n    }\n    /* END OF LOOP */\n    printf(\"\
    \\n x = %f; n = %d; x to power n = %f\\n\",x,n,y);\n}\n```\n\n**Output**\n```text\n\
    Enter the values of x and n : 2.5 4\nx = 2.500000; n = 4; x to power n = 39.062500\n\
    Enter the values of x and n : 0.5 4\nx = 0.500000; n = 4; x to power n = 0.062500\n\
    ```\n```\n\n**Fig. 8.2**  *Program to compute x to the power n using while loop*\n\
    \n# 8.3 THE DO STATEMENT\n\n![](img/11b034a94fc590add0a7808250a38792_268_0.png)\n\
    \nThe **while** loop construct that we have discussed in the previous section,\
    \ makes a test of condition *before* the loop is executed. Therefore, the body\
    \ of the loop may not be executed at all if the condition is not satisfied at\
    \ the very first attempt. On some occasions it might be necessary to execute the\
    \ body of the loop before the test is performed. Such situations can be handled\
    \ with the help of the **do** statement. This takes the form:\n\n```\n```c\ndo\n\
    {\n    body of the loop\n}\nwhile (test-condition);\n```\n```\n\nOn reaching the\
    \ **do** statement, the program proceeds to evaluate the body of the loop first.\
    \ At the end of the loop, the *test-condition* in the **while** statement is evaluated.\
    \ If the condition is true, the program"
