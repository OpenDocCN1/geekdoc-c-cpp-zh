    \nVariables in C can have not only *data type* but also *storage class* that provides\
    \ information about their location and visibility. The storage class decides the\
    \ portion of the program within which the variables are recognized. Consider the\
    \ following example:\n\n```\n```c\n/* Example of storage classes */\nint m;\n\
    main()\n{\n    int i;\n    float balance;\n    ....\n    ....\n    function1();\n\
    }\nfunction1()\n{\n    int i;\n    float sum;\n    ....\n    ....\n}\n```\n```\n\
    \nThe variable **m** which has been declared before the **main** is called *global\
    \ variable*. It can be used in all the functions in the program. It need not be\
    \ declared in other functions. A global variable is also known as an *external\
    \ variable*.\n\nThe variables **i**, **balance** and **sum** are called *local\
    \ variables* because they are declared inside a function. Local variables are\
    \ visible and meaningful only inside the functions in which they are declared.\
    \ They are"
