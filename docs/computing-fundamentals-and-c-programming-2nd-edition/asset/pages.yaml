- pgno: 459
  md: "# ## 12.11 UNIONS AND STRUCTURES\n\n**LO 12.7**\n\nUnions are a concept borrowed\
    \ from structures and therefore follow the same syntax as structures. However,\
    \ there is major distinction between them in terms of storage. In structures,\
    \ each member has its own storage location, whereas all the members of a union\
    \ use the same location. This implies that, although a union may contain many\
    \ members of different types, it can handle only one member at a time. Like structures,\
    \ a union can be declared using the keyword union as follows:\n\n```\n```c\nunion\
    \ item\n{\n    int m;\n    float x;\n    char c;\n} code;\n```\n```\n\nThis declares\
    \ a variable **code** of type **union item**. The union contains three members,\
    \ each with a different data type. However, we can use only one of them at a time.\
    \ This is due to the fact that only one location is allocated for a union variable,\
    \ irrespective of its size.\n\nThe compiler allocates a piece of storage that\
    \ is large enough to hold the largest variable type in the union. In the declaration\
    \ above, the member *x* requires 4 bytes which is the largest among the members.\
    \ Figure 12.7 shows how all the three variables share the same address. This assumes\
    \ that a float variable requires 4 bytes of storage.\n\n![](img/11b034a94fc590add0a7808250a38792_459_0.png)\n\
    \nTo access a union member, we can use the same syntax that we use for structure\
    \ members. That is,\n\n```\n```c\ncode.m\ncode.x\ncode.c\n```\n```\n\nare all\
    \ valid member variables. During accessing, we should make sure that we are accessing\
    \ the member whose value is currently stored. For example, the statements such\
    \ as\n\n```\n```c\ncode.m = 379;\ncode.x = 7859.36;\nprintf(\"%d\", code.m);\n\
    ```\n```\n\nwould produce erroneous output (which is machine dependent).\n\nIn\
    \ effect, a union creates a storage location that can be used by any one of its\
    \ members at a time. When a different member is assigned a new value, the new\
    \ value supersedes the previous member's value.\n\nUnions may be used in all places\
    \ where a structure is allowed. The notation for accessing a union member which\
    \ is nested inside a structure remains the same as for the nested structures.\n\
    \nUnions may be initialized when the variable is declared. But, unlike structures,\
    \ it can be initialized only with a value of the same type as the first union\
    \ member. For example, with the preceding, the declaration\n\n```\n```c\nunion\
    \ item abc = {100};\n```\n```\n\nis valid but the declaration\n\n```\n```c\nunion\
    \ item abc = {10.75};\n```\n```"
