    \ pointer operators are discussed in Chapter 13. Member selection operators which\
    \ are used to select members of a structure are discussed in Chapters 12 and 13.\
    \ ANSI committee has introduced two preprocessor operators known as “string-izing”\
    \ and “token-pasting” operators (# and ##).\n\n# 5.9.1  The Comma Operator\n\n\
    The comma operator can be used to link the related expressions together. A comma-linked\
    \ list of expressions are evaluated left to right and the value of right-most\
    \ expression is the value of the combined expression. For example, the statement\n\
    \n```\nvalue = (x = 10, y = 5, x+y);\n```\n\nfirst assigns the value 10 to x,\
    \ then assigns 5 to y, and finally assigns 15 (i.e. 10 + 5) to value. Since comma\
    \ operator has the lowest precedence of all operators, the parentheses are necessary.\
    \ Some applications of comma operator are:\n\n```\nIn for loops:\n\n    for (\
    \ n = 1, m = 10, n <=m; n++, m++)\n\nIn while loops:\n\n    while (c = getchar(),\
    \ c != '10')\n\nExchanging values:\n\n    t = x, x = y, y = t;\n```\n\n# 5.9.2\
    \  The sizeof Operator\n\nThe sizeof is a compile time operator and, when used\
    \ with an operand, it returns the number of bytes the operand occupies. The operand\
    \ may be a variable, a constant or a data type qualifier. Examples:\n\n```\nm\
    \ = sizeof (sum);\nn = sizeof (long int);\nk = sizeof (235L);\n```\n\nThe sizeof\
    \ operator is normally used to determine the lengths of arrays and structures\
    \ when their sizes are not known to the programmer. It is also used to allocate\
    \ memory space dynamically to variables during execution of a program.\n\n# WORKED-OUT\
