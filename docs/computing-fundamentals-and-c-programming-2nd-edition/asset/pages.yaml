    > > **Note** *Relative precedence of the relational and logical operators is as
    follows:*

    > >

    > > Highest  `!`

    > > `>` `>=` `<` `<=`

    > > `==` `!=`

    > > `&&`

    > > Lowest `||`

    > >

    > > *It is important to remember this when we use these operators in compound
    expressions.*


    # 5.5 ASSIGNMENT OPERATORS


    ![](img/11b034a94fc590add0a7808250a38792_167_0.png)


    Assignment operators are used to assign the result of an expression to a variable.
    We have seen the usual assignment operator, `=`. In addition, C has a set of ‘shorthand’
    assignment operators of the form


    ```

    `v op= exp;`

    ```


    Where *v* is a variable, *exp* is an expression and *op* is a C binary arithmetic
    operator. The operator `op=` is known as the shorthand assignment operator.


    The assignment statement


    ```

    `v op= exp;`

    ```


    is equivalent to


    ```

    `v = v op (exp);`

    ```


    with *v* evaluated only once. Consider an example


    ```

    `x += y+1;`

    ```


    This is same as the statement


    ```

    `x = x + (y+1);`

    ```


    The shorthand operator `+=` means ‘add y+1 to x’ or ‘increment x by y+1’. For
    y = 2, the above statement becomes


    ```

    `x += 3;`

    ```


    and when this statement is executed, 3 is added to x. If the old value of x is,
    say 5, then the new value of x is 8. Some of the commonly used shorthand assignment
    operators are illustrated in Table 5.4.'
