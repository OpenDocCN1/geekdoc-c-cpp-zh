  md: '# ### 4.2.1 Trigraph Characters


    Many non-English keyboards do not support all the characters mentioned in Table
    4.1. ANSI C introduces the concept of “trigraph” sequences to provide a way to
    enter certain characters that are not available on some keyboards. Each trigraph
    sequence consists of three characters (two question marks followed by another
    character) as shown in Table 4.2.


    For example, if a keyboard does not support square brackets, we can still use
    them in a program using the trigraphs ??( and ??).


    **Table 4.2** *ANSI C Trigraph Sequences*


    | Trigraph sequence | Translation |

    |---|---|

    | ??= | # number sign |

    | ??( | [ left bracket |

    | ??) | ] right bracket |

    | ??< | { left brace |

    | ??> | } right brace |

    | ??! | \| vertical bar |

    | ??/ | \ back slash |

    | ??'' | ^ caret |

    | ??- | ~ tilde |


    # ### 4.3 C TOKENS LO 4.1


    In a passage of text, individual words and punctuation marks are called *tokens*.
    Similarly, in a C program the smallest individual units are known as C tokens.
    C has six types of tokens as shown in Fig. 4.1. C programs are written using these
    tokens and the syntax of the language.


    ![](img/11b034a94fc590add0a7808250a38792_134_0.png)


    Fig. 4.1 C tokens and examples'
  merge: -1
