  md: "```\n```c\nmain( )                    // Outer block\n{\n    int a = 20;\n\
    \    int b = 10;\n    . . . .\n    {                      // Inner block\n   \
    \     int a = 0;\n        int c = a + b;\n        . . . .\n    }\n    b = a;\n\
    }\n```\n```\n\nWhen this program is executed, the value c will be 10, not 30.\
    \ The statement b = a; assigns a value of 20 to b and not zero. Although the scope\
    \ of a extends up to the end of main it is not “visible” inside the inner block\
    \ where the variable a has been declared again. The inner a hides the visibility\
    \ of the outer a in the inner block. However, when we leave the inner block, the\
    \ inner a is no longer in scope and the outer a becomes visible again.\n\nRemember,\
    \ the variable b is not re-declared in the inner block and therefore it is visible\
    \ in both the blocks. That is why when the statement `int c = a + b;` is evaluated,\
    \ a assumes a values of 0 and b assumes a value of 10.\n\nAlthough main’s variables\
    \ are visible inside the nested block, the reverse is not true.\n\n# Scope Rules\n\
    \n**Scope**\nThe region of a program in which a variable is available for use.\n\
    \n**Visibility**\nThe program’s ability to access a variable from the memory.\n\
    \n**Lifetime**\nThe lifetime of a variable is the duration of time in which a\
    \ variable exists in the memory during execution.\n\n# Rules of use\n\n+   1.\
    \ The scope of a global variable is the entire program file.\n+   2. The scope\
    \ of a local variable begins at point of declaration and ends at the end of the\
    \ block or function in which it is declared.\n+   3. The scope of a formal function\
    \ argument is its own function.\n+   4. The lifetime (or longevity) of an **auto**\
    \ variable declared in **main** is the entire program execution time, although\
    \ its scope is only the **main** function.\n+   5. The life of an **auto** variable\
    \ declared in a function ends when the function is exited.\n+   6. A **static**\
    \ local variable, although its scope is limited to its function, its lifetime\
    \ extends till the end of program execution.\n+   7. All variables have visibility\
    \ in their scope, provided they are not declared again.\n+   8. If a variable\
    \ is redeclared within its scope again, it loses its visibility in the scope of\
    \ the redeclared variable."
