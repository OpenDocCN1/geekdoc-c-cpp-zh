  md: '# CHAPTER 11


    # # User-Defined Functions


    # LEARNING OBJECTIVES


    After reading this chapter, you will be able to


    +   - **LO 11.1** Outline user-defined functions

    +   - **LO 11.2** Identify the elements of user-defined functions

    +   - **LO 11.3** Explain the different categories of functions

    +   - **LO 11.4** Know the concept of recursion

    +   - **LO 11.5** Describe how arrays are passed to functions

    +   - **LO 11.6** Discuss the relevance of storage classes on scope, visibility
    and lifetime of variables


    # ## 11.1 INTRODUCTION


    We have mentioned earlier that one of the strengths of C language is C functions.
    They are easy to define and use. We have used functions in every program that
    we have discussed so far. However, they have been primarily limited to the three
    functions, namely, **main**, **printf**, and **scanf**. In this chapter, we shall
    consider in detail the following:


    +   - How a function is designed?

    +   - How a function is integrated into a program?

    +   - How two or more functions are put together? and

    +   - How they communicate with one another?


    C functions can be classified into two categories, namely, *library functions*
    and *user-defined functions*. **main** is an example of user-defined functions.
    **printf** and **scanf** belong to the category of library functions. We have
    also used other library functions such as **sqrt**, **cos**, **strcat**, etc.
    The main distinction between these two categories is that library functions are
    not required to be written by us whereas a user-defined function has to be developed
    by the user at the time of writing a program. However, a user-defined function
    can later become a part of the C program library. In fact, this is one of the
    strengths of C language.'
