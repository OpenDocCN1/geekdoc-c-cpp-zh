    ```\n```c\nif(feof(fp))\n    printf(\"End of data.\\n\");\n```\n```\n\nwould display\
    \ the message “End of data.” on reaching the end of file condition.\n\nThe **ferror**\
    \ function reports the status of the file indicated. It also takes a **FILE**\
