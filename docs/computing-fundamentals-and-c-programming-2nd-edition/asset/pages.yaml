- pgno: 41
  md: 'PCs, minis and mainframes spanning a particular geographical area. Computer
    networks that are commonly used today may be classified as follows:


    +   - Based on geographical area:

    +     - Local Area Networks (LANs)

    +     - Wide Area Networks (WANs)

    +     - Metropolitan Area Networks (MANs)

    +     - International Network (Internet)

    +     - Intranet

    +   - Based on how computer nodes are used:

    +     - Client Server Networks (CSNs)

    +     - Peer-to-peer Networks (PPNs)

    +     - Value-added Networks (VANs)


    # ### 1.14.1 Local Area Network (LAN)


    LAN is a group of computers, as shown in Fig. 1.22, that are connected in a small
    area such as building, home, etc. Through this type of network, users can easily
    communicate with each other by sending and receiving messages. LAN is generally
    used for connecting two or more personal computers through some medium such as
    twisted pair, coaxial cable, etc. Though the number of computers connected in
    a LAN is limited, the data is transferred at an extremely faster rate.


    ![](img/11b034a94fc590add0a7808250a38792_41_0.png)


    # ### 1.14.2 Wide Area Network (WAN)


    WAN is a group of computers that are connected in a large area such as continent,
    country, etc. WAN is generally used for connecting two or more LANs through some
    medium such as leased telephone lines, microwaves, etc. In WAN, data is transferred
    at slow rate. A typical WAN network is shown in Fig. 1.23.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '![](img/11b034a94fc590add0a7808250a38792_42_0.png)


    # ### 1.14.3  Metropolitan Area Network (MAN)


    MAN is a network of computers that covers a large area like a city. The size of
    the MAN generally lies between that of LAN and WAN, typically covering a distance
    of 5 km to 50 km. The geographical area covered by MAN is comparatively larger
    than LAN but smaller than WAN. MAN is generally owned by private organisations.
    MAN is generally connected with the help of optical fibres, copper wires etc.
    One of the most common example of MAN is cable television network within a city
    as shown in Fig. 1.24. A network device known as *router* is used to connect the
    LANs together. The router directs the information packets to the desired destination.


    ![](img/11b034a94fc590add0a7808250a38792_42_1.png)'
  merge: -1
  img_proc: true
