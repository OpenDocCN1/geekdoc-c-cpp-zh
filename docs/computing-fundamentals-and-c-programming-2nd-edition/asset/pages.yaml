  md: 'It may be recalled that we have included a statement


    ```

    `#include <math.h>`

    ```


    in the Sample Program 5 in Chapter 3, where a math library function cos(x) has
    been used. This is to instruct the compiler to fetch the function cos(x) from
    the math library, and that it is not a part of C language. Similarly, each program
    that uses a standard input/output function must contain the statement


    ```

    `#include <stdio.h>`

    ```


    at the beginning. However, there might be exceptions. For example, this is not
    necessary for the functions **print** and **scanf** which have been defined as
    a part of the C language.


    The file name `stdio.h` is an abbreviation for *standard input-output header file*.
    The instruction `#include <stdio.h>` tells the compiler ‘to search for a file
    named `stdio.h` and place its contents at this point in the program’. The contents
    of the header file become part of the source code when it is compiled.


    # ## 6.2 READING A CHARACTER


    **LO 6.1**


    The simplest of all input/output operations is reading a character from the ‘standard
    input’ unit (usually the keyboard) and writing it to the ‘standard output’ unit
    (usually the screen). Reading a single character can be done by using the function
    `getchar`. (This can also be done with the help of the `scanf` function which
    is discussed in Section 6.4.) The `getchar` takes the following form:


    ```

    `variable_name = getchar( );`

    ```


    *variable_name* is a valid C name that has been declared as **char** type. When
    this statement is encountered, the computer waits until a key is pressed and then
    assigns this character as a value to **getchar** function. Since **getchar** is
    used on the right-hand side of an assignment statement, the character value of
    **getchar** is in turn assigned to the variable name on the left. For example


    ```

    `char name;`

    `name = getchar();`

    ```


    will assign the character ‘H’ to the variable name when we press the key H on
    the keyboard. Since `getchar` is a function, it requires a set of parentheses
    as shown.


    # ### WORKED-OUT PROBLEM 6.1  **L**


    The program in Fig. 6.1 shows the use of `getchar` function in an interactive
    environment.


    The program displays a question of YES/NO type to the user and reads the user’s
    response in a single character (Y or N). If the response is Y or y, it outputs
    the message


    My name is BUSY BEE


    otherwise, outputs


    You are good for nothing


    > > **Note** *There is one line space between the input text and output message.*'
