  md: "# # Understanding Fundamentals of the Computer\n\n# CHAPTER 1\n\n# ### LEARNING\
    \ OBJECTIVES\n\n+   **After reading this chapter, you will be able to**\n+   \n\
    +   - **LO 1.1** Identify the various generations of computers\n+   - **LO 1.2**\
    \ Classify computers on the basis of different criteria\n+   - **LO 1.3** Describe\
    \ the computer system\n+   - **LO 1.4** Classify various computer software\n+\
    \   - **LO 1.5** Discuss various operating systems\n+   - **LO 1.6** Discuss Microsoft\
    \ software\n+   - **LO 1.7** Know various networking concepts and protocols\n\n\
    # ## 1.1 INTRODUCTION\n\nA computer is an *electronic machine* that takes input\
    \ from the user, processes the given input and generates output in the form of\
    \ useful information. A computer accepts input in different forms such as data,\
    \ programs and user reply. *Data* refer to the raw details that need to be processed\
    \ to generate some useful *information*. Programs refer to the set of instructions\
    \ that can be executed by the computer in sequential or non-sequential manner.\
    \ User reply is the input provided by the user in response to a question asked\
    \ by the computer.\n\nA computer includes various devices that function as an\
    \ integrated system to perform several tasks described above (Fig. 1.1). These\
    \ devices are:\n\n**Central Processing Unit (CPU)** It is the processor of the\
    \ computer that is responsible for controlling and executing instructions in the\
    \ computer. It is considered as the most significant component of the computer.\n\
    \n**Monitor** It is a screen, which displays information in visual form, after\
    \ receiving the video signals from the computer.\n\n**Keyboard and Mouse** These\
    \ are the devices, which are used by the computer, for receiving input from the\
    \ user."
  merge: -1
  img_proc: true
