    \ Program to read and print name of months in the range of 1 and 12*\n\n# 7.8\
    \ THE ? : OPERATOR\n\nThe C language has an unusual operator, useful for making\
    \ two-way decisions. This operator is a combination of ? and :, and takes three\
    \ operands. This operator is popularly known as the *conditional operator*. The\
    \ general form of use of the conditional operator is as follows:\n\n```\n*conditional\
    \ expression ? expression1 : expression2*\n```\n\nThe *conditional expression*\
    \ is evaluated first. If the result is non-zero, *expression1* is evaluated and\
    \ is returned as the value of the conditional expression. Otherwise, *expression2*\
    \ is evaluated and its value is returned. For example, the segment\n\n```\nif\
    \ (x < 0)\n    flag = 0;\nelse\n    flag = 1;\n```\n\ncan be written as\n\n```\n\
    flag = ( x < 0 ) ? 0 : 1;\n```\n\nConsider the evaluation of the following function:\n\
    \n```\ny = 1.5x + 3 for x ≤ 2\ny = 2x + 5 for x > 2\n```\n\nThis can be evaluated\
    \ using the conditional operator as follows:\n\n```\ny = ( x > 2 ) ? (2 * x +\
    \ 5) : (1.5 * x + 3);\n```\n\nThe conditional operator may be nested for evaluating\
    \ more complex assignment decisions. For example, consider the weekly salary of\
    \ a salesgirl who is selling some domestic products. If x is the number of products\
    \ sold in a week, her weekly salary is given by\n\n```\nSalary = | 4x + 100  \
    \ for x < 40\n         | 300        for x = 40\n         | 4.5x + 150 for x >\
    \ 40\n```\n\nThis complex equation can be written as\n\n```\nsalary = (x != 40)\
    \ ? ((x < 40) ? (4*x+100) : (4.5*x+150)) : 300;\n```"
  merge: -1
  img_proc: true
