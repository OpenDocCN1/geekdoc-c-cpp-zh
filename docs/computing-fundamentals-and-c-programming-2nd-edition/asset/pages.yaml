    \ 8.8 9.9 10.10\n\n x[ 1] = 1.10\n x[ 2] = 2.20\n x[ 3] = 3.30\n x[ 4] = 4.40\n\
    \ x[ 5] = 5.50\n x[ 6] = 6.60\n x[ 7] = 7.70\n x[ 8] = 8.80\n x[ 9] = 9.90\n x[10]\
    \ = 10.10\n\nTotal = 446.86\n```\n```\n\nFig. 9.1  Program to illustrate one-dimensional\
    \ array\n\n> > **Note** C99 permits arrays whose size can be specified at run\
    \ time. See Appendix “C99 Features”.\n\n# ## 9.4 INITIALIZATION OF ONE-DIMENSIONAL\
    \ ARRAYS  **LO 9.2**\n\nAfter an array is declared, its elements must be initialized.\
    \ Otherwise, they will contain “garbage”. An array can be initialized at either\
    \ of the following stages:\n\n+   - At compile time\n+   - At run time\n\n# ###\
    \ 9.4.1 Compile Time Initialization\n\nWe can initialize the elements of arrays\
    \ in the same way as the ordinary variables when they are declared. The general\
    \ form of initialization of arrays is:\n\n```\n```c\ntype array-name[size] = {\
    \ list of values };\n```\n```\n\nThe values in the list are separated by commas.\
    \ For example, the statement\n\n```\n```c\nint number[3] = { 0,0,0 };\n```\n```\n\
    \nwill declare the variable **number** as an array of size 3 and will assign zero\
    \ to each element. If the number of values in the list is less than the number\
    \ of elements, then only that many elements will be initialized. The remaining\
    \ elements will be set to zero automatically. For instance,\n\n```\n```c\nfloat\
    \ total[5] = {0.0,15.75,-10};\n```\n```\n\nwill initialize the first three elements\
    \ to 0.0, 15.75, and –10.0 and the remaining two elements to zero."
