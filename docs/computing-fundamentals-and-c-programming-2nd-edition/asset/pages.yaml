- pgno: 315
  md: "+   - Bubble sort\n+   - Selection sort\n+   - Insertion sort\n\nOther sorting\
    \ techniques include Shell sort, Merge sort and Quick sort.\n\nSearching is the\
    \ process of finding the location of the specified element in a list. The specified\
    \ element is often called the search key. If the process of searching finds a\
    \ match of the search key with a list element value, the search said to be successful;\
    \ otherwise, it is unsuccessful. The two most commonly used search techniques\
    \ are:\n\n+   - Sequential search\n+   - Binary search\n\nA detailed discussion\
    \ on these techniques is beyond the scope of this text. However you may refer\
    \ the QR section for additional information.\n\n# ## 9.5 TWO-DIMENSIONAL ARRAYS\n\
    \nLO 9.3\n\nSo far we have discussed the array variables that can store a list\
    \ of values. There could be situations where a table of values will have to be\
    \ stored. Consider the following data table, which shows the value of sales of\
    \ three items by four sales girls:\n\n| | Item1 | Item2 | Item3 |\n|---|---|---|---|\n\
    | Salesgirl #1 | 310 | 275 | 365 |\n| Salesgirl #2 | 210 | 190 | 325 |\n| Salesgirl\
    \ #3 | 405 | 235 | 240 |\n| Salesgirl #4 | 260 | 300 | 380 |\n\nThe table contains\
    \ a total of 12 values, three in each line. We can think of this table as a matrix\
    \ consisting of four rows and three columns. Each row represents the values of\
    \ sales by a particular salesgirl and each column represents the values of sales\
    \ of a particular item.\n\nIn mathematics, we represent a particular value in\
    \ a matrix by using two subscripts such as v<sub>ij</sub>. Here v denotes the\
    \ entire matrix and v<sub>ij</sub> refers to the value in the i<sup>th</sup> row\
    \ and j<sup>th</sup> column. For example, in the above table v<sub>32</sub> refers\
    \ to the value 325.\n\nC allows us to define such tables of items by using two-dimensional\
    \ arrays. The table discussed above can be defined in C as\n\n```\n    v[4][3]\n\
    ```\n\nTwo-dimensional arrays are declared as follows:\n\n```\n    type array_name\
    \ [row_size][column_size];\n```\n\nNote that unlike most other languages, which\
    \ use one pair of parentheses with commas to separate array sizes, C places each\
    \ size in its own set of brackets.\n\nTwo-dimensional arrays are stored in memory,\
    \ as shown in Fig. 9.4. As with the single-dimensional arrays, each dimension\
    \ of the array is indexed from zero to its maximum size minus one; the first index\
    \ selects the row and the second index selects the column within that row."
