  md: '# ## 4.12 DECLARING A VARIABLE AS CONSTANT **LO 4.4**


    We may like the value of certain variables to remain constant during the execution
    of a program. We can achieve this by declaring the variable with the qualifier
    **const** at the time of initialization. Example:


    ```

    const int class_size = 40;

    ```


    **const** is a new data type qualifier defined by ANSI standard. This tells the
    compiler that the value of the **int** variable **class_size** must not be modified
    by the program. However, it can be used on the right hand side of an assignment
    statement like any other variable.


    # ## 4.13 DECLARING A VARIABLE AS VOLATILE **LO 4.4**


    ANSI standard defines another qualifier **volatile** that could be used to tell
    explicitly the compiler that a variable''s value may be changed at any time by
    some external sources (from outside the program). For example:


    ```

    volatile int date;

    ```


    The value of **date** may be altered by some external factors even if it does
    not appear on the left-hand side of an assignment statement. When we declare a
    variable as **volatile**, the compiler will examine the value of the variable
    each time it is encountered to see whether any external alteration has changed
    the value.


    Remember that the value of a variable declared as **volatile** can be modified
    by its own program as well. If we wish that the value must not be modified by
    the program while it may be altered by some other process, then we may declare
    the variable as both **const** and **volatile** as shown below:


    ```

    volatile const int location = 100;

    ```


    > **Note** C99 adds another qualifier called **restrict**. See the Appendix "C99
    Features".


    # ### 4.13.1 Overflow and Underflow of Data


    Problem of data overflow occurs when the value of a variable is either too big
    or too small for the data type to hold. The largest value that a variable can
    hold also depends on the machine. Since floating-point values are rounded off
    to the number of significant digits allowed (or specified), an overflow normally
    results in the largest possible real value, whereas an underflow results in zero.


    Integers are always exact within the limits of the range of the integral data
    types used. However, an overflow which is a serious problem may occur if the data
    type does not match the value of the constant. C does not provide any warning
    or indication of integer overflow. It simply gives incorrect results. (Overflow
    normally produces a negative number.) We should therefore exercise a greater care
    to define correct data types for handling the input/output values.


    # ## LEARNING OUTCOMES


    +   - Do not use the underscore as the first character of identifiers (or variable
    names) because many of the identifiers in the system library start with underscore.
    **LO 4.1**

    +   - Use only 31 or less characters for identifiers. This helps ensure portability
    of programs. **LO 4.1**'
