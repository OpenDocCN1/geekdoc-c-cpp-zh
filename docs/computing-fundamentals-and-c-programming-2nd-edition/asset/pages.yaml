  md: "We have an exception. The exception is the void pointer (void *). The void\
    \ pointer is a **generic pointer** that can represent any pointer type. All pointer\
    \ types can be assigned to a void pointer and a void pointer can be assigned to\
    \ any pointer without casting. A void pointer is created as follows:\n\n```\n\
    ```\nvoid *vp;\n```\n```\n\nRemember that since a void pointer has no object type,\
    \ it cannot be de-referenced.\n\n# ## 13.16 POINTERS AND STRUCTURES\n\nWe know\
    \ that the name of an array stands for the address of its zeroth element. The\
    \ same thing is true of the names of arrays of structure variables. Suppose **product**\
    \ is an array variable of **struct** type. The name **product** represents the\
    \ address of its zeroth element. Consider the following declaration:\n\n```\n\
    ```\nstruct inventory\n{\n    char name[30];\n    int number;\n    float price;\n\
    } product[2], *ptr;\n```\n```\n\nThis statement declares **product** as an array\
    \ of two elements, each of the type **struct inventory** and **ptr** as a pointer\
    \ to data objects of the type **struct inventory**. The assignment\n\n```\n```\n\
    ptr = product;\n```\n```\n\nwould assign the address of the zeroth element of\
    \ **product** to **ptr**. That is, the pointer **ptr** will now point to **product[0]**.\
    \ Its members can be accessed using the following notation.\n\n```\n```\nptr ->\
    \ name\nptr -> number\nptr -> price\n```\n```\n\nThe symbol -> is called the **arrow\
    \ operator** (also known as **member selection operator**) and is made up of a\
    \ minus sign and a greater than sign. Note that **ptr->** is simply another way\
    \ of writing **product[0]**.\n\nWhen the pointer **ptr** is incremented by one,\
    \ it is made to point to the next record, i.e., product[1]. The following **for**\
    \ statement will print the values of members of all the elements of **product**\
    \ array.\n\n```\n```\nfor(ptr = product; ptr < product+2; ptr++)\n    printf (\"\
    %s %d %f\\n\", ptr->name, ptr->number, ptr->price);\n```\n```\n\nWe could also\
    \ use the notation\n\n```\n```\n(*ptr).number\n```\n```\n\nto access the member\
    \ **number**. The parentheses around \\*ptr are necessary because the member operator\
    \ '.' has a higher precedence than the operator \\*.\n\n# ### WORKED-OUT PROBLEM\
    \ 13.9\n\nWrite a program to illustrate the use of structure pointers.\n\nA program\
    \ to illustrate the use of a structure pointer to manipulate the elements of an\
    \ array of structures is shown in Fig. 13.14. The program highlights all the features\
    \ discussed above. Note that the pointer **ptr** (of type **struct invent**) is\
    \ also used as the loop control index in **for** loops."
