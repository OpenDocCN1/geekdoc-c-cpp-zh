  md: "# # Chapter 5: Operators and Expressions\n\n+   **After reading this chapter,\
    \ you will be able to**\n+   \n+   - **LO 5.1** Know the various built-in operators\
    \ of C language\n+   - **LO 5.2** Identify bitwise and special operators\n+  \
    \ - **LO 5.3** Determine how arithmetic expressions are evaluated\n+   - **LO\
    \ 5.4** Explain type conversions in expressions\n+   - **LO 5.5** Discuss how\
    \ operator precedence and associativity rules are applied\n\n# ## 5.1 INTRODUCTION\n\
    \nAn *operator* is a symbol that tells the computer to perform certain mathematical\
    \ or logical manipulations. Operators are used in programs to manipulate data\
    \ and variables. They usually form a part of the mathematical or logical *expressions*.\n\
    \nC operators can be classified into a number of categories. They include:\n\n\
    +   1. Arithmetic operators\n+   2. Relational operators\n+   3. Logical operators\n\
    +   4. Assignment operators\n+   5. Increment and decrement operators\n+   6.\
    \ Conditional operators\n+   7. Bitwise operators\n+   8. Special operators\n\n\
    An expression is a sequence of operands and operators that reduces to a single\
    \ value. For example, 10 + 15 is an expression whose value is 25. The value can\
    \ be any type other than *void*."
