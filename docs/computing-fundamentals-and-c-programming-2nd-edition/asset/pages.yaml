- pgno: 143
  md: '# #### 4.7.4 Character Types


    A single character can be defined as a **character(char)** type data. Characters
    are usually stored in 8 bits (one byte) of internal storage. The qualifier **signed**
    or **unsigned** may be explicitly applied to char. While **unsigned chars** have
    values between 0 and 255, **signed chars** have values from –128 to 127.


    ![](img/11b034a94fc590add0a7808250a38792_143_0.png)


    # ## 4.8 DECLARATION OF VARIABLES


    After designing suitable variable names, we must declare them to the compiler.
    Declaration does two things:


    +   1. It tells the compiler what the variable name is.

    +   2. It specifies what type of data the variable will hold.


    The declaration of variables must be done before they are used in the program.


    # ### 4.8.1 Primary Type Declaration


    A variable can be used to store a value of any data type. That is, the name has
    nothing to do with its type. The syntax for declaring a variable is as follows:


    ```

    ```

    data-type v1,v2,...vn ;

    ```

    ```


    v1, v2, ...vn are the names of variables. Variables are separated by commas. A
    declaration statement must end with a semicolon. For example, valid declarations
    are:


    ```

    ```

    int count;

    int number, total;

    double ratio;

    ```

    ```


    **int** and **double** are the keywords to represent integer type and real type
    data values respectively. Table 4.9 shows various data types and their keyword
    equivalents.


    **Table 4.9** *Data Types and Their Keywords*


    | Data type | Keyword equivalent |

    | --- | --- |

    | Character | char |

    | Unsigned character | unsigned char |

    | Signed character | signed char |

    | Signed integer | signed int (or int) |

    | Signed short integer | signed short int<br>(or short int or short) |

    | Signed long integer | signed long int<br>(or long int or long) |

    | Unsigned integer | unsigned int (or unsigned) |

    | Unsigned short integer | unsigned short int<br>(or unsigned short) |

    | Unsigned long integer | unsigned long int<br>(or unsigned long) |'
