    \ form:\n\n```\nprintf(\"%*.*f\", width, precision, number);\n```\n\nIn this case,\
    \ both the field width and the precision are given as arguments which will supply\
    \ the values for w and p. For example,\n\n```\nprintf(\"%*.*f\",7,2,number);\n\
    ```\n\nis equivalent to\n\n```\nprintf(\"%7.2f\",number);\n```\n\nThe advantage\
    \ of this format is that the values for *width* and *precision* may be supplied\
    \ at run time, thus making the format a *dynamic* one. For example, the above\
    \ statement can be used as follows:\n\n```\nint width = 7;\nint precision = 2;\n\
    .......\n.......\nprintf(\"%*.*f\", width, precision, number);\n```\n\n# WORKED-OUT\
    \ PROBLEM 6.10\n\nAll the options of printing a real number are illustrated in\
    \ Fig. 6.10.\n\n```\nProgram\n\nmain()\n{\n    float y = 98.7654;\n    printf(\"\
    %7.4f\\n\", y);\n    printf(\"%f\\n\", y);\n    printf(\"%7.2f\\n\", y);\n   \
    \ printf(\"%-7.2f\\n\", y);\n    printf(\"%07.2f\\n\", y);\n    printf(\"%*.*f\"\
    , 7, 2, y);\n    printf(\"\\n\");\n    printf(\"%10.2e\\n\", y);\n    printf(\"\
    %12.4e\\n\", -y);\n    printf(\"%-10.2e\\n\", y);\n    printf(\"%e\\n\", y);\n\
    }\n\nOutput\n98.7654\n98.765404\n```"
