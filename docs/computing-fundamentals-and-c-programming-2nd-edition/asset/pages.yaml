    +   4. Trying to perform an operation on a file, when the file is opened for another\
    \ type of operation.\n+   5. Opening a file with an invalid filename.\n+   6.\
    \ Attempting to write to a write-protected file.\n\nIf we fail to check such read\
    \ and write errors, a program may behave abnormally when an error occurs. An unchecked\
    \ error may result in a premature termination of the program or incorrect output.\
    \ Fortunately, we have two status-inquiry library functions: **feof** and **ferror**\
    \ that can help us detect I/O errors in the files.\n\nThe **feof** function can\
    \ be used to test for an end of file condition. It takes a **FILE** pointer as\
    \ its only argument and returns a nonzero integer value if all of the data from\
    \ the specified file has been read, and returns zero otherwise. If **fp** is a\
