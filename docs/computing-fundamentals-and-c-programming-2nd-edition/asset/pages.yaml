- pgno: 457
  md: "The following points are important to note:\n\n+   1. The called function must\
    \ be declared for its type, appropriate to the data type it is expected to return.\
    \ For example, if it is returning a copy of the entire structure, then it must\
    \ be declared as **struct** with an appropriate tag name.\n+   2. The structure\
    \ variable used as the actual argument and the corresponding formal argument in\
    \ the called function must be of the same **struct** type.\n+   3. The **return**\
    \ statement is necessary only when the function is returning some data back to\
    \ the calling function. The *expression* may be any simple variable or structure\
    \ variable or an expression using simple variables.\n+   4. When a function returns\
    \ a structure, it must be assigned to a structure of identical type in the calling\
    \ function.\n+   5. The called functions must be declared in the calling function\
    \ appropriately.\n\n# **WORKED-OUT PROBLEM 12.6**\n\nWrite a simple program to\
    \ illustrate the method of sending an entire structure as a parameter to a function.\n\
    \nA program to update an item is shown in Fig. 12.6. The function **update** receives\
    \ a copy of the structure variable **item** as one of its parameters. Note that\
    \ both the function **update** and the formal parameter **product** are declared\
    \ as type **struct stores**. It is done so because the function uses the parameter\
    \ **product** to receive the structure variable **item** and also to return the\
    \ updated values of **item**.\n\nThe function **mul** is of type **float** because\
    \ it returns the product of **price** and **quantity**. However, the parameter\
    \ **stock**, which receives the structure variable **item** is declared as type\
    \ **struct stores**.\n\nThe entire structure returned by **update** can be copied\
    \ into a structure of identical type. The statement\n\n    item = update(item,\
    \ p_increment, q_increment);\n\nreplaces the old values of **item** by the new\
    \ ones.\n\nProgram\n\n```\n```c\n/*  Passing a copy of the entire structure  \
    \      */\nstruct stores\n{\n    char    name[20];\n    float   price;\n    int\
    \     quantity;\n};\nstruct stores update (struct stores product, float p, int\
    \ q);\nfloat mul (struct stores stock);\nmain()\n{\n    float   p_increment, value;\n\
    \    int     q_increment;\n\n    struct stores item = {\"XYZ\", 25.75, 12};\n\
    ```\n```"
