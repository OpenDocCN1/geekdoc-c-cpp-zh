    # ## 2.8.2 OR Gate


    The OR gate is another basic logic gate that gives an output signal of value 1
    whenever its one input signal is of value 1. In other words, the OR gate gives
    an output signal of value 0 when all its input signals are of value 0.


    # **Logical Expression**


    The logical expression for the OR function is:


    F = A + B


    where, F is the output that depends on inputs A and B.


    # **Symbol**


    The symbol of the OR gate is shown in Fig. 2.2.'
