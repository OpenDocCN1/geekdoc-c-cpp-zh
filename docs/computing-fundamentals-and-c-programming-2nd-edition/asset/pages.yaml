- pgno: 389
  md: 'The **main** function calls the user-defined **printline** function two times
    and the library function **printf** once. We may notice that the **printline**
    function itself calls the library function **printf** 39 times repeatedly.


    Any function can call any other function. In fact, it can call itself. A “called
    function” can also call another function. A function can be called more than once.
    In fact, this is one of the main features of using functions. Figure 11.2 illustrates
    the flow of control in a multi-function program.


    Except the starting point, there are no other predetermined relationships, rules
    of precedence, or hierarchies among the functions that make up a complete program.
    The functions can be placed in any order. A called function can be placed either
    before or after the calling function. However, it is the usual practice to put
    all the called functions at the end. See the box “Modular Programming”.


    ![](img/11b034a94fc590add0a7808250a38792_389_0.png)


    **Fig. 11.2** *Flow of control in a multi-function program.*'
