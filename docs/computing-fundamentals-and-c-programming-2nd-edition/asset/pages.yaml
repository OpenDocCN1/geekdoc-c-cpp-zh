  md: '# ## CHAPTER 9


    # # Array


    # ### LEARNING OBJECTIVES


    After reading this chapter, you will be able to


    +   - **LO 9.1** Define the concept of arrays

    +   - **LO 9.2** Determine how one-dimensional array is declared and initialized

    +   - **LO 9.3** Understand the concept of two-dimensional arrays

    +   - **LO 9.4** Discuss how two-dimensional array is declared and initialized

    +   - **LO 9.5** Describe multi-dimensional arrays

    +   - **LO 9.6** Explain dynamic arrays


    # ## 9.1 INTRODUCTION


    So far we have used only the fundamental data types, namely **char**, **int**,
    **float**, **double** and variations of **int** and **double**. Although these
    types are very useful, they are constrained by the fact that a variable of these
    types can store only one value at any given time. Therefore, they can be used
    only to handle limited amounts of data. In many applications, however, we need
    to handle a large volume of data in terms of reading, processing and printing.
    To process such large amounts of data, we need a powerful data type that would
    facilitate efficient storing, accessing and manipulation of data items. C supports
    a derived data type known as *array* that can be used for such applications.


    An array is a *fixed-size* sequenced collection of elements of the same data type.
    It is simply a grouping of like-type data. In its simplest form, an array can
    be used to represent a list of numbers, or a list of names. Some examples where
    the concept of an array can be used:


    +   - List of temperatures recorded every hour in a day, or a month, or a year.

    +   - List of employees in an organization.

    +   - List of products and their cost sold by a store.

    +   - Test scores of a class of students.'
  merge: -1
  img_proc: true
- pgno: 305
  md: "+   - List of customers and their telephone numbers.\n+   - Table of daily\
    \ rainfall data.\n\nand so on.\n\nSince an array provides a convenient structure\
    \ for representing data, it is classified as one of the *data structures* in C.\
    \ Other data structures include structures, lists, queues and trees. A complete\
    \ discussion of all data structures is beyond the scope of this text. However,\
    \ we shall consider structures in Chapter 12.\n\nAs we mentioned earlier, an array\
    \ is a sequenced collection of related data items that share a common name. For\
    \ instance, we can use an array name *salary* to represent a *set of salaries*\
    \ of a group of employees in an organization. We can refer to the individual salaries\
    \ by writing a number called *index* or *subscript* in brackets after the array\
    \ name. For example,\n\n```\n`salary [10]`\n```\n\nrepresents the salary of 10th\
    \ employee. While the complete set of values is referred to as an array, individual\
    \ values are called *elements*.\n\nThe ability to use a single name to represent\
    \ a collection of items and to refer to an item by specifying the item number\
    \ enables us to develop concise and efficient programs. For example, we can use\
    \ a loop construct, discussed earlier, with the subscript as the control variable\
    \ to read the entire array, perform calculations, and print out the results.\n\
    \nWe can use arrays to represent not only simple lists of values but also tables\
    \ of data in two, three or more dimensions. In this chapter, we introduce the\
    \ concept of an array and discuss how to use it to create and apply the following\
    \ types of arrays.\n\n+   - One-dimensional arrays\n+   - Two-dimensional arrays\n\
    +   - Multidimensional arrays\n\n# ### 9.1.1 Data Structures\n\nC supports a rich\
    \ set of derived and user-defined data types in addition to a variety of fundamental\
    \ types as shown below:\n\n![](img/11b034a94fc590add0a7808250a38792_305_0.png)\n\
    \n+   - Arrays\n+   - Functions\n+   - Pointers\n+   \n+   - Integral Types\n\
    +   - Float Types\n+   - Character Types\n+   \n+   - Structures\n+   - Unions\n\
    +   - Enumerations\n\nArrays and structures are referred to as *structured data\
    \ types* because they can be used to represent data values that have a structure\
    \ of some sort. Structured data types provide an organizational scheme that shows\
    \ the relationships among the individual elements and facilitate efficient data\
    \ manipulations. In programming parlance, such data types are known as *data structures*."
