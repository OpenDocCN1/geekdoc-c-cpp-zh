  md: "# 13.14  FUNCTIONS RETURNING POINTERS\n\nWe have seen so far that a function\
    \ can return a single value by its name or return multiple values through pointer\
    \ parameters. Since pointers are a data type in C, we can also force a function\
    \ to return a pointer to the calling function. Consider the following code:\n\n\
    ```\n```c\nint *larger (int *, int *);    /* prototype */\nmain ( )\n{\n     \
    \   int a = 10;\n        int b = 20;\n        int *p;\n        p = larger(&a,\
    \ &b);  /*Function call */\n        printf (\"%d\", *p);\n}\nint *larger (int\
    \ *x, int *y)\n{\n        if (*x>*y)\n                return (x);  /* address\
    \ of a */\n        else\n                return (y);  /* address of b */\n}\n\
    ```\n```\n\nThe function larger receives the addresses of the variables a and\
    \ b, decides which one is larger using the pointers x and y and then returns the\
    \ address of its location. The returned value is then assigned to the pointer\
    \ variable p in the calling function. In this case, the address of b is returned\
    \ and assigned to p and therefore the output will be the value of b, namely, 20.\n\
    \nNote that the address returned must be the address of a variable in the calling\
    \ function. It is an error to return a pointer to a local variable in the called\
    \ function.\n\n# 13.15  POINTERS TO FUNCTIONS\n\nA function, like a variable,\
    \ has a type and an address location in the memory. It is therefore possible to\
    \ declare a pointer to a function, which can then be used as an argument in another\
    \ function. A pointer to a function is declared as follows:\n\n```\n```c\ntype\
    \ (*fptr) ();\n```\n```\n\nThis tells the compiler that fptr is a pointer to a\
    \ function, which returns type value. The parentheses around *fptr are necessary.\
    \ Remember that a statement like\n\n```\n```c\ntype *gptr();\n```\n```\n\nwould\
    \ declare gptr as a function returning a pointer to type.\n\nWe can make a function\
    \ pointer to point to a specific function by simply assigning the name of the\
    \ function to the pointer. For example, the statements\n\n```\n```c\ndouble mul(int,\
    \ int);\n```\n```"
