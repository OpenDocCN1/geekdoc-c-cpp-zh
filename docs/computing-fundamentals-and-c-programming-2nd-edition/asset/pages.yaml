  md: '# 9.7 MULTI-DIMENSIONAL ARRAYS


    LO 9.5


    C allows arrays of three or more dimensions. The exact limit is determined by
    the compiler. The general form of a multi-dimensional array is


    ```

    `type array_name[s1] [s2] [s3] .... [sm] ;`

    ```


    where s_i is the size of the ith dimension. Some examples are:


    ```

    `int survey[3][5][12];`

    `float table[5][4][5][3];`

    ```


    **survey** is a three-dimensional array declared to contain 180 integer type elements.
    Similarly **table** is a four-dimensional array containing 300 elements of floating-point
    type.


    The array **survey** may represent a survey data of rainfall during the last three
    years from January to December in five cities.


    If the first index denotes year, the second city and the third month, then the
    element **survey[2][3][10]** denotes the rainfall in the month of October during
    the second year in city-3.


    Remember that a three-dimensional array can be represented as a series of two-dimensional
    arrays as shown below:


    **Year 1**


    | month city | 1 | 2 | ............. | 12 |

    |---|---|---|---|---|

    | 1 | | | | |

    | . | | | | |

    | . | | | | |

    | . | | | | |

    | . | | | | |

    | 5 | | | | |


    **Year 2**


    | month city | 1 | 2 | ............. | 12 |

    |---|---|---|---|---|

    | 1 | | | | |

    | . | | | | |

    | . | | | | |

    | . | | | | |

    | . | | | | |

    | 5 | | | | |


    ANSI C does not specify any limit for array dimension. However, most compilers
    permit seven to ten dimensions. Some allow even more.'
