    \ cannot be used as a stand-alone statement. (LO 11.1)\n+   - Where more functions\
    \ are used, they may be placed in any order. (LO 11.1)\n+   - It is a syntax error\
    \ if the types in the declaration and function definition do not match. (LO 11.2)\n\
    +   - It is a syntax error if the number of actual parameters in the function\
    \ call do not match the number in the declaration statement. (LO 11.2)\n+   -\
    \ It is a logic error if the parameters in the function call are placed in the\
    \ wrong order. (LO 11.2)\n+   - Placing a semicolon at the end of header line\
    \ is illegal. (LO 11.2)\n+   - Forgetting the semicolon at the end of a prototype\
    \ declaration is an error. (LO 11.2)\n+   - A **return** statement can occur anywhere\
    \ within the body of a function. (LO 11.2)\n+   - A function definition may be\
    \ placed either after or before the **main** function. (LO 11.2)\n+   - A **return**\
    \ statement is required if the return type is anything other than **void**. (LO\
    \ 11.3)\n+   - If a function does not return any value, the return type must be\
    \ declared **void**. (LO 11.3)\n+   - If a function has no parameters, the parameter\
    \ list must be declared **void**. (LO 11.3)\n+   - Using **void** as return type\
    \ when the function is expected to return a value is an error. (LO 11.3)\n+  \
    \ - Trying to return a value when the function type is marked **void** is an error.\
