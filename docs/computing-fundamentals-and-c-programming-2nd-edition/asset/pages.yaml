    +   2. `if (number < 0 || number > 100)`


    We shall see more of them when we discuss decision statements.


    **Table 5.3** *Truth Table*


    | op-1 | op-2 | Value of the expression | |

    |---|---|---|---|

    |  |  | op-1 && op-2 | op-1 \|\| op-2 |

    | Non-zero | Non-zero | 1 | 1 |

