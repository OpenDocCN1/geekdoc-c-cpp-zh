    # ### 2.9.3 High-Level Languages


    High level languages further simplified programming tasks by reducing the number
    of computer operation details that had to be specified. High level languages like
    COBOL, Pascal, FORTRAN, and C are more abstract, easier to use, and more portable
    across platforms, as compared to low-level programming languages. Instead of dealing
    with registers, memory addresses and call stacks, a programmer can concentrate
    more on the logic to solve the problem with the help of variables, arrays or Boolean
    expressions. For example, consider the following assembly language code:


    ```

    ~~~

    LOAD A

    ADD B

    STORE C

    ~~~

    ```


    Using FORTRAN, the above code can be represented as:


    ```

    ~~~

    C = A + B

    ~~~

    ```


    The above high-level language code is executed by translating it into the corresponding
    machine language code with the help of a compiler or interpreter.


    High-level languages can be classified into the following three categories:


    +   - Procedure-oriented languages (third generation)

    +   - Problem-oriented languages (fourth generation)

    +   - Natural languages (fifth generation)


