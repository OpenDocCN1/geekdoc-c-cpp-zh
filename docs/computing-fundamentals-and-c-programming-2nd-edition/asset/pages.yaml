- pgno: 502
  md: 'We list here some pointer errors that are more commonly committed by the programmers.


    +   - Assigning values to uninitialized pointers

    +     ```c

    +     int * p, m = 100 ;

    +     *p = m ;               /* Error */

    +     ```

    +   - Assigning value to a pointer variable

    +     ```c

    +     int *p, m = 100 ;

    +     p = m;                 /* Error */

    +     ```

    +   - Not dereferencing a pointer when required

    +     ```c

    +     int *p, x = 100;

    +     p = &x;

    +     printf("%d",p);        /* Error */

    +     ```

    +   - Assigning the address of an uninitialized variable

    +     ```c

    +     int m, *p

    +     p = &m;                /* Error */

    +     ```

    +   - Comparing pointers that point to different objects

    +     ```c

    +     char name1 [ 20 ], name2 [ 30 ];

    +     char *p1 = name1;

    +     char *p2 = name2;

    +     if(p1 > p2)........      /* Error */

    +     ```


    We must be careful in declaring and assigning values to pointers correctly before
    using them. We must also make sure that we apply the address operator & and referencing
    operator * correctly to the pointers. That will save us from sleepless nights.


    # LEARNING OUTCOMES


    +   - Only an address of a variable can be stored in a pointer variable. LO 13.1

    +   - Do not store the address of a variable of one type into a pointer variable
    of another type. LO 13.1

    +   - The value of a variable cannot be assigned to a pointer variable. LO 13.1

    +   - A very common error is to use (or not to use) the address operator (&) and
    the indirection operator (*) in certain places. Be careful. The compiler may not
    warn such mistakes. LO 13.1

    +   - Remember that the definition for a pointer variable allocates memory only
    for the pointer variable, not for the variable to which it is pointing. LO 13.1

    +   - A pointer variable contains garbage until it is initialized. Therefore,
    we must not use a pointer variable before it is assigned, the address of a variable.
    LO 13.2

    +   - It is an error to assign a numeric constant to a pointer variable. LO 13.2

    +   - It is an error to assign the address of a variable to a variable of any
    basic data types. LO 13.2

    +   - A proper understanding of a precedence and associativity rules is very important
    in pointer applications. For example, expressions like *p++, *p[], ( *p)[], (p).member
    should be carefully used. LO 13.4

    +   - Be careful while using indirection operator with pointer variables. A simple
    pointer uses single indirection operator (*ptr) while a pointer to a pointer uses
    additional indirection operator symbol (**ptr). LO 13.4'
