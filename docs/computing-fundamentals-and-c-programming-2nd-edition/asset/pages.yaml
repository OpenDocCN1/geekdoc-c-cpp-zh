    \ of the equation. A quadratic equation has two roots which are given by the following\
    \ two formulae:\n\n$$\\text{root1} = \\frac{-b + \\sqrt{b^2 - 4ac}}{2a}$$\n\n\
    $$\\text{root 2} = \\frac{-b - \\sqrt{b^2 - 4ac}}{2a}$$\n\nA program to evaluate\
    \ these roots is given in Fig. 5.11. The program requests the user to input the\
    \ values of **a**, **b** and **c** and outputs **root 1** and **root 2**.\n\n\
    ```\n```c\nProgram\n\n#include <math.h>\nmain()\n{\n    float a, b, c, discriminant,\n\
