- pgno: 332
  md: "During the first trip, three pairs of items are compared and interchanged whenever\
    \ needed. It should be noted that the number 80, the largest among the items,\
    \ has been moved to the bottom at the end of the first trip. This means that the\
    \ element 80 (the last item in the new list) need not be considered any further.\
    \ Therefore, trip-2 requires only two pairs to be compared. This time, the number\
    \ 65 (the second largest value) has been moved down the list. Notice that each\
    \ trip brings the smallest value 10 up by one level.\n\nThe number of steps required\
    \ in a trip is reduced by one for each trip made. The entire process will be over\
    \ when a trip contains only one step. If the list contains **n** elements, then\
    \ the number of comparisons involved would be **n(n−1)/2**.\n\n```\nProgram\n\n\
    ```c\n#define N 10\nmain( )\n{\n    int i,j,n;\n    float median,a[N],t;\n   \
    \ printf(\"Enter the number of items\\n\");\n    scanf(\"%d\", &n);\n    /* Reading\
    \ items into array a */\n    printf(\"Input %d values \\n\",n);\n    for (i =\
    \ 1; i <= n ; i++)\n        scanf(\"%f\", &a[i]);\n    /* Sorting begins */\n\
    \    for (i = 1 ; i <= n-1 ; i++)\n    {\n        /* Trip-i begins */\n      \
    \  for (j = 1 ; j <= n-i ; j++)\n        {\n            if (a[j] <= a[j+1])\n\
    \            {\n                /* Interchanging values */\n                t\
    \ = a[j];\n                a[j] = a[j+1];\n                a[j+1] = t;\n     \
    \       }\n            else\n                continue ;\n        }\n    } /* sorting\
    \ ends */\n    /* calculation of median */\n    if ( n % 2 == 0)\n        median\
    \ = (a[n/2] + a[n/2+1])/2.0 ;\n    else\n        median = a[n/2 + 1];\n    /*\
    \ Printing */\n    for (i = 1 ; i <= n ; i++)\n```\n```"
