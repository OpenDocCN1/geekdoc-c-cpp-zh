  md: '# ## LEARNING OUTCOMES


    +   - Do not try to use a file before opening it. LO 14.1

    +   - Remember, when an existing file is open using ''w'' mode, the contents of
    file are deleted. LO 14.1

    +   - When a file is used for both reading and writing, we must open it in ''w+''
    mode. LO 14.1

    +   - It is an error to omit the file pointer when using a file function. LO 14.1

    +   - It is an error to open a file for reading when it does not exist. LO 14.1

    +   - It is an error to access a file with its name rather than its file pointer.
    LO 14.1

    +   - It is a good practice to close all files before terminating a program. LO
    14.1

    +   - EOF is integer type with a value -1. Therefore, we must use an integer variable
    to test EOF. LO 14.2

    +   - It is an error to try to read from a file that is in write mode and vice
    versa. LO 14.2

    +   - To avoid I/O errors while working with files, it is a good practice to include
    error handling code in programs by using functions such as feof and ferror. LO
    14.3

    +   - It is an error to attempt to place the file marker before the first byte
    of a file. LO 14.4

    +   - It is a good practice to check the return value of fseek function every
    time it is invoked. A positive return value ensures that the file pointer is within
    the file boundaries. LO 14.5


    # ## KEY TERMS TO REMEMBER


    +   - **Filename:** It is a string of characters that make up a valid filename
    for the operating system. LO 14.1

    +   - **fseek:** It is a function that sets the position to a desired point in
    the file. LO 14.4

    +   - **ftell:** It is a function that returns the current position in the file.
    LO 14.4

    +   - **rewind:** It is a function that sets the position to the beginning of
    the file. LO 14.4

    +   - **Command line argument:** It is a parameter supplied to a program from
    command prompt when the program is invoked. LO 14.5


    # ## REVIEW QUESTIONS


