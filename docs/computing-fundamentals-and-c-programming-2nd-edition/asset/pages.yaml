  md: "❖ using selection notation        :        ptr → x\n\nThe second and third\
    \ methods will be considered in Chapter 13.\n\n# 12.7  ARRAYS OF STRUCTURES\n\n\
    # LO 12.4\n\nWe use structures to describe the format of a number of related variables.\
    \ For example, in analyzing the marks obtained by a class of students, we may\
    \ use a template to describe student name and marks obtained in various subjects\
    \ and then declare all the students as structure variables. In such cases, we\
    \ may declare an array of structures, each element of the array representing a\
    \ structure variable. For example:\n\n```\n```c\nstruct class student[100];\n\
    ```\n```\n\ndefines an array called **student**, that consists of 100 elements.\
    \ Each element is defined to be of the type **struct class**. Consider the following\
    \ declaration:\n\n```\n```c\nstruct marks\n{\n    int   subject1;\n    int   subject2;\n\
    \    int   subject3;\n};\nmain()\n{\n    struct marks student[3] =\n        {{45,68,81},\
    \ {75,53,69}, {57,36,71}};\n}\n```\n```\n\nThis declares the **student** as an\
    \ array of three elements **student[0]**, **student[1]**, and **student[2]** and\
    \ initializes their members as follows:\n\n```\n```c\nstudent[0].subject1 = 45;\n\
    student[0].subject2 = 65;\n....\n....\nstudent[2].subject3 = 71;\n```\n```\n\n\
    Note that the array is declared just as it would have been with any other array.\
    \ Since **student** is an array, we use the usual array-accessing methods to access\
    \ individual elements and then the member operator to access members. Remember,\
    \ each element of **student** array is a structure variable with three members.\n\
    \nAn array of structures is stored inside the memory in the same way as a multi-dimensional\
    \ array. The array **student** actually looks as shown in Fig. 12.3.\n\n# WORKED-OUT\
    \ PROBLEM 12.4\n\nFor the **student** array discussed above, write a program to\
