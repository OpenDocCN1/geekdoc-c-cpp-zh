    # ### 13.5.1 Pointer Flexibility


    Pointers are flexible. We can make the same pointer to point to different data
    variables in different statements. Example;


    ```

    ```

    int x, y, z, *p;

    . . . .

    p = &x;

    . . . .

    p = &y;

    . . . .

    p = &z;

    . . . .

    ```

    ```


    ![](img/11b034a94fc590add0a7808250a38792_480_0.png)


    We can also use different pointers to point to the same data variable. Example;


    ```

    ```

    int x;

    int *p1 = &x;

    int *p2 = &x;

    int *p3 = &x;

    . . . .

    . . . .

    ```

    ```


    With the exception of NULL and 0, no other constant value can be assigned to a
    pointer variable. For example, the following is wrong:


    ```

    ```

    int *p = 5360;          / *absolute address */

    ```

    ```


    # ## 13.6 ACCESSING A VARIABLE THROUGH ITS POINTER


    LO 13.2


    Once a pointer has been assigned the address of a variable, the question remains
