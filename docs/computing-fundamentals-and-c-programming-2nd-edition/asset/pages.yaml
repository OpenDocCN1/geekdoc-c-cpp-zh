  md: "We should ensure that the function call has matching arguments. In case, the\
    \ actual arguments are more than the formal arguments (m > n), the extra actual\
    \ arguments are discarded. On the other hand, if the actual arguments are less\
    \ than the formal arguments, the unmatched formal arguments are initialized to\
    \ some garbage values. Any mismatch in data type may also result in passing of\
    \ garbage values. Remember, no error message will be generated.\n\nWhile the formal\
    \ arguments must be valid variable names, the actual arguments may be variable\
    \ names, expressions, or constants. The variables used in actual arguments must\
    \ be assigned values before the function call is made.\n\nRemember that, when\
    \ a function call is made, only a copy of the values of actual arguments is passed\
    \ into the called function. What occurs inside the function will have no effect\
    \ on the variables used in the actual argument list.\n\n# ## WORKED-OUT PROBLEM\
