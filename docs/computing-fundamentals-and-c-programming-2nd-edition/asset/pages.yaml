  md: "The salary structure contains a member named **allowance**, which itself is\
    \ a structure with three members. The members contained in the inner structure\
    \ namely **dearness**, **house_rent**, and **city** can be referred to as:\n\n\
    ```\nemployee.allowance.dearness\nemployee.allowance.house_rent\nemployee.allowance.city\n\
    ```\n\nAn inner-most member in a nested structure can be accessed by chaining\
    \ all the concerned structure variables (from outer-most to inner-most) with the\
    \ member using dot operator. The following are invalid:\n\n```\n**employee.allowance**\
    \ (actual member is missing)\n**employee.house_rent** (inner structure variable\
    \ is missing)\n```\n\nAn inner structure can have more than one variable. The\
    \ following form of declaration is legal:\n\n```\nstruct salary\n{\n    .....\n\
    \    struct\n    {\n        int dearness;\n        .....\n    }\n    allowance,\n\
    \    arrears;\n}\nemployee[100];\n```\n\nThe inner structure has two variables,\
    \ **allowance** and **arrears**. This implies that both of them have the same\
    \ structure template. Note the comma after the name **allowance**. A base member\
    \ can be accessed as follows:\n\n```\n**employee[1].allowance.dearness**\n**employee[1].arrears.dearness**\n\
    ```\n\nWe can also use tag names to define inner structures. Example:\n\n```\n\
    struct pay\n{\n    int dearness;\n    int house_rent;\n    int city;\n};\nstruct\
    \ salary\n{\n    char name;\n    char department;\n    struct pay allowance;\n\
    \    struct pay arrears;\n};\nstruct salary employee[100];\n```\n\n**pay** template\
    \ is defined outside the **salary** template and is used to define the structure\
    \ of **allowance** and **arrears** inside the **salary** structure.\n\nIt is also\
    \ permissible to nest more than one type of structures."
