  md: "We cannot save the value of a memory address directly. We can only obtain the\
    \ value through the variable stored there using the address operator (&). The\
    \ value thus obtained is known as *pointer value*. The pointer value (i.e. the\
    \ address of a variable) may change from one run of the program to another.\n\n\
    Once we have a pointer value, it can be stored into another variable. The variable\
    \ that contains a pointer value is called a *pointer variable*.\n\n# ## 13.3 ACCESSING\
    \ THE ADDRESS OF A VARIABLE  LO 13.1\n\nThe actual location of a variable in the\
    \ memory is system dependent and therefore, the address of a variable is not known\
    \ to us immediately. How can we then determine the address of a variable? This\
    \ can be done with the help of the operator & available in C. We have already\
    \ seen the use of this *address operator* in the **scanf** function. The operator\
    \ & immediately preceding a variable returns the address of the variable associated\
    \ with it. For example, the statement\n\n```\n```c\np = &quantity;\n```\n```\n\
    \nwould assign the address 5000 (the location of **quantity**) to the variable\
    \ **p**. The & operator can be remembered as ‘address of’.\n\nThe & operator can\
    \ be used only with a simple variable or an array element. The following are illegal\
    \ use of address operator:\n\n+   1. `&125` (pointing at constants).\n+   2. `int\
