    # **Pass by Value versus Pass by Pointers**


    The technique used to pass data from one function to another is known as *parameter
    passing*. Parameter passing can be done in following two ways:


    +   - Pass by value (also known as call by value).

    +   - Pass by pointers (also known as call by pointers).


    In *pass by value*, values of actual parameters are copied to the variables in
    the parameter list of the called function. The called function works on the copy
    and not on the original values of the actual parameters. This ensures that the
    original data in the calling function cannot be changed accidentally.


    In *pass by pointers* (also known as pass by address), the memory addresses of
    the variables rather than the copies of values are sent to the called function.
    In this case, the called function directly works on the data in the calling function
    and the changed values are available in the calling function for its use.


    Pass by pointers method is often used when manipulating arrays and strings. This
    method is also used when we require multiple values to be returned by the called
    function.


    # ## 11.13 THE SCOPE, VISIBILITY, AND LIFETIME OF VARIABLES


    LO 11.6


    Variables in C differ in behaviour from those in most other languages. For example,
    in a BASIC program, a variable retains its value throughout the program. It is
    not always the case in C. It all depends on the ''storage'' class a variable may
    assume.


    In C not only do all variables have a data type, they also have a *storage class*.
    The following variable storage classes are most relevant to functions:


    +   1. Automatic variables.

    +   2. External variables.

    +   3. Static variables.

    +   4. Register variables.


    We shall briefly discuss the *scope*, *visibility*, and *longevity* of each of
    the above class of variables. The *scope* of variable determines over what region
    of the program a variable is actually available for use (''active''). *Longevity*
    refers to the period during which a variable retains a given value during execution
    of a program (''alive''). So longevity has a direct effect on the utility of a
    given variable. The *visibility* refers to the accessibility of a variable from
    the memory.


    The variables may also be broadly categorized, depending on the place of their
