- pgno: 242
  md: "It is possible to nest the **switch** statements. That is, a **switch** may\
    \ be part of a **case** statement. ANSI C permits 15 levels of nesting.\n\n# ###\
    \ 7.7.1 Rules for Switch Statement\n\n+   - The **switch** expression must be\
    \ an integral type.\n+   - Case labels must be constants or constant expressions.\n\
    +   - Case labels must be unique. No two labels can have the same value.\n+  \
    \ - Case labels must end with colon.\n+   - The **break** statement transfers\
    \ the control out of the **switch** statement.\n+   - The **break** statement\
    \ is optional. That is, two or more case labels may belong to the same statements.\n\
    +   - The **default** label is optional. If present, it will be executed when\
    \ the expression does not find a matching case label.\n+   - There can be at most\
    \ one **default** label.\n+   - The **default** may be placed anywhere but usually\
    \ placed at the end.\n+   - It is permitted to nest **switch** statements.\n\n\
    # ## WORKED-OUT PROBLEM 7.6\n\nWrite a complete C program that reads a value in\
    \ the range of 1 to 12 and print the name of that month and the next month. Print\
    \ error for any other input value.\n\n```\n```c\nProgram\n\n#include<stdio.h>\n\
    #include<conio.h>\n#include<stdlib.h>\nvoid main()\n{\n    char month[12][20]\
    \ = {\"January\",\"February\",\"March\",\"April\",\"May\",\"June\",\n    \"July\"\
    ,\"August\",\"September\",\"October\",\"November\",\"December\"};\n    int i;\n\
    \n    printf(\"Enter the month value: \");\n    scanf(\"%d\",&i);\n\n    if(i<1\
    \ || i>12)\n    {\n        printf(\"Incorrect value!!\\nPress any key to terminate\
    \ the program...\");\n        getch();\n        exit(0);\n    }\n\n    if(i!=12)\n\
    \        printf(\"%s followed by %s\",month[i-1],month[i]);\n```\n```"
