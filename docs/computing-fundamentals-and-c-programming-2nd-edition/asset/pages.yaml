    # ## 13.2 UNDERSTANDING POINTERS


    LO 13.1


    The computer''s memory is a sequential collection of *storage cells* as shown
    in Fig. 13.1. Each cell, commonly known as a *byte*, has a number called *address*
    associated with it. Typically, the addresses are numbered consecutively, starting
    from zero. The last address depends on the memory size. A computer system having
    64 K memory will have its last address as 65,535.


    ![](img/11b034a94fc590add0a7808250a38792_475_0.png)


    *Fig. 13.1  Memory organisation*


    Whenever we declare a variable, the system allocates, somewhere in the memory,
    an appropriate location to hold the value of the variable. Since, every byte has
    a unique address number, this location will have its own address number. Consider
    the following statement


    ```

    int quantity = 179;

    ```


    This statement instructs the system to find a location for the integer variable
    **quantity** and puts the value 179 in that location. Let us assume that the system
    has chosen the address location 5000 for **quantity**. We'
