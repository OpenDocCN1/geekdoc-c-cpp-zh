- pgno: 47
  md: 'Some of the commonly used network protocols are Hyper Text Transfer protocol
    (HTTP), Simple Mail Transfer Protocol (SMTP), File Transfer Protocol (FTP), Transmission
    Control Protocol/ Internet Protocol (TCP/IP), Telecommunications Network (Telnet),
    Domain Name System (DNS) etc.


    # # HTTP


    Hyper Text Transfer Protocol (HTTP) is the communication protocol used by the
    World Wide Web. It acts as a request-response protocol where the client browser
    and the Web server interact with each other through HTTP protocol rules. These
    rules define how messages are formatted and transmitted and what actions should
    the browser and Web server take in response to these messages. For example, when
    we type a URL in the address bar of a browser, then an HTTP request is sent to
    the Web server to fetch the requested Web page. The Web page details are transmitted
    to the client browser and rendered on the browser window through HTML.


    In a typical situation, the client browser submits an HTTP request to the server
    and the server processes the request and returns an HTTP response to the client.
    The response contains status information pertaining to the request as well as
    the requested content (Figs 1.31–1.32).


    ![](img/11b034a94fc590add0a7808250a38792_47_0.png)


    HTTP protocol supports various methods that are used by the client browsers to
    send request messages to the server. Some of the common HTTP methods are:


    +   - **GET**: Gets information from the specified resource

    +   - **HEAD**: Gets only the HTTP headers

    +   - **POST**: Posts information to the specified resource

    +   - **DELETE**: Deletes the specified resource

    +   - **OPTIONS**: Returns the list of HTTP methods that are supported by the
    Web server

    +   - **TRACE**: Returns a diagnostic trace of the actions taken at the server
    end


    The first line in an HTTP response object comprises a status line, which carries
    the response status code indicating the outcome of the HTTP request processed
    by the server. The status code is a 3-digit number and carries specific meaning,
    as described below:


    +   - **1xx**: Comprises information status messages indicating that the server
    is still processing the request

    +   - **2xx**: Comprises success status messages indicating that the request was
    received, accepted and processed by the server

    +   - **3xx**: Comprises redirection status messages indicating that further action
    needs to be taken in order to process the request

    +   - **4xx**: Comprises error status messages indicating error at client side,
    for example incorrect request syntax

    +   - **5xx**: Comprises error status messages indicating error at server side,
    for example inability of the server to process the request'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# ### SMTP


    Simple Mail Transfer Protocol (SMTP) is an e-mail protocol which is widely used
    for sending e-mail messages between mail servers. While SMTP supports capabilities
    for both sending and receiving e-mail messages, e-mail systems primarily used
    SMTP protocol for sending e-mail messages. For receiving, they use other protocols
    such as POP3 or IMAP. In Unix-based systems, sendmail is the most widely used
    SMTP server for e-mail. In Windows-based systems, Microsoft Exchange comes with
    an SMTP server and can be configured to include POP3 support.


    # ### FTP


    File Transfer Protocol (FTP) is a standard protocol used for sharing files over
    the Internet. FTP is based on the client-server architecture and uses Internet''s
    TCP/IP protocol for file transfer. The users need to authenticate themselves by
    specifying user name/password in order to establish a connection with the FTP
    server. However, some FTP sites also support anonymous login where users are not
    required to enter their credentials. To facilitate secure transfer of user''s
    credentials and file contents over the Internet, FTP encrypts the content using
    cryptographic protocols such as TLS/SSL.


    The following steps illustrate how file transfer happens through FTP:


    +   1. The client machine uses Internet to connect to the FTP server''s IP address.

    +   2. User authentication happens by entering relevant user name and password.

    +   3. Once the connection is established, the client machine sends FTP commands
    to access and transfer files. Now-a-days, various GUI-based FTP software are available
    that enable transfer of files through simple operations, such as drag and drop.


    # ### Telnet


    Telnet is a protocol that allows users to connect to remote computers over a TCP/IP
    network, such as intranet or internet. While HTTP and FTP protocols are used for
    transferring Web pages and files over the Internet, the Telnet protocol is used
    for logging onto a remote computer and performing operations just as a normal
    user. The users need to enter their credentials before logging on the remote host
    machine.


    Command-line based telnet access is available in major operating systems such
    as Windows, Mac OS, Unix and Linux. Generic format of the telnet command is given
    below:


    ```

    ```

    Telnet host port

    ```

    ```


    Here,


    +   - **telnet**: Is the command that establishes telnet connection

    +   - **host**: Is the address of the host machine

    +   - **port**: Is the port number on which telnet services are available on the
    host machine


