    \ of alphabets in reverse cast*\n\n# **6.4 FORMATTED INPUT**\n\nFormatted input\
    \ refers to an input data that has been arranged in a particular format. For example,\
    \ consider the following data:\n\n15.75 123 John\n\nThis line contains three pieces\
    \ of data, arranged in a particular form. Such data has to be read conforming\
    \ to the format of its appearance. For example, the first part of the data should\
    \ be read into a variable **float**, the second into **int**, and the third part\
    \ into **char**. This is possible in C using the **scanf** function. (**scanf**\
    \ means *scan formatted*.)\n\nWe have already used this input function in a number\
    \ of examples. Here, we shall explore all of the options that are available for\
    \ reading the formatted data with **scanf** function. The general form of **scanf**\
    \ is\n\n```\nscanf (\"control string\", arg1, arg2, ..... argn);\n```\n\nThe *control\
    \ string* specifies the field format in which the data is to be entered and the\
    \ arguments *arg1*, *arg2*, ...., *argn* specify the address of locations where\
    \ the data is stored. Control string and arguments are separated by commas.\n\n\
    Control string (also known as *format string*) contains field specifications,\
    \ which direct the interpretation of input data. It may include:\n\n+   * Field\
    \ (or format) specifications, consisting of the conversion character %, a data\
    \ type character (or type specifier), and an *optional* number, specifying the\
    \ field width.\n+   * Blanks, tabs, or newlines.\n\nBlanks, tabs and newlines\
    \ are ignored. The data type character indicates the type of data that is to be\
    \ assigned to the variable associated with the corresponding argument. The field\
    \ width specifier is optional. The discussions that follow will clarify these\
    \ concepts."
