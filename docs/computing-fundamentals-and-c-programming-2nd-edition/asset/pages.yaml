- pgno: 424
  md: "```\n```c\nstatic int x;\nstatic float y;\n```\n```\n\nA static variable may\
    \ be either an internal type or an external type depending on the place of declaration.\
    \ Internal static variables are those which are declared inside a function. The\
    \ scope of internal static variables extend up to the end of the function in which\
    \ they are defined. Therefore, internal **static** variables are similar to **auto**\
    \ variables, except that they remain in existence (alive) throughout the remainder\
    \ of the program. Therefore, internal **static** variables can be used to retain\
    \ values between function calls. For example, it can be used to count the number\
    \ of calls made to a function.\n\n# ## WORKED-OUT PROBLEM 11.10\n\nWrite a program\
    \ to illustrate the properties of a static variable.\n\nThe program in Fig. 11.16\
    \ explains the behaviour of a static variable.\n\n```\n```c\nProgram\n\nvoid stat(void);\n\
    main ( )\n{\n    int i;\n    for(i=1; i<=3; i++)\n        stat( );\n}\nvoid stat(void)\n\
    {\n    static int x = 0;\n\n    x = x+1;\n    printf(\"x = %d\\n\", x);\n}\n\n\
    Output\n\nx = 1\nx = 2\nx = 3\n```\n```\n\nFig. 11.16  *Illustration of static\
    \ variable*\n\nA static variable is initialized only once, when the program is\
    \ compiled. It is never initialized again. During the first call to **stat**,\
    \ **x** is incremented to 1. Because **x** is static, this value persists and\
    \ therefore, the next call adds another 1 to **x** giving it a value of 2. The\
    \ value of **x** becomes three when the third call is made.\n\nHad we declared\
    \ **x** as an **auto** variable, the output would have been:\n\n```\n```\nx =\
    \ 1\nx = 1\nx = 1\n```\n```"
