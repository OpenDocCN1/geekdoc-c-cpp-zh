  md: '# ## Modular Programming


    Modular programming is a strategy applied to the design and development of software
    systems. It is defined as organizing a large program into small, independent program
    segments called *modules* that are separately named and individually callable
    *program units*. These modules are carefully integrated to become a software system
    that satisfies the system requirements. It is basically a “divide-and-conquer”
    approach to problem solving.


    Modules are identified and designed such that they can be organized into a top-down
    hierarchical structure (similar to an organization chart). In C, each module refers
    to a function that is responsible for a single task.


    Some characteristics of modular programming are as follows:


    +   1. Each module should do only one thing.

    +   2. Communication between modules is allowed only by a calling module.

    +   3. A module can be called by one and only one higher module.

    +   4. No communication can take place directly between modules that do not have
    calling – called relationship.

    +   5. All modules are designed as *single-entry, single-exit* systems using control
    structures.


    # ## 11.4 ELEMENTS OF USER-DEFINED FUNCTIONS


    **LO 11.2**


    We have discussed and used a variety of data types and variables in our programs
    so far. However, declaration and use of these variables were primarily done inside
    the **main** function. As we mentioned in Chapter 6, functions are classified
    as one of the derived data types in C. We can therefore define functions and use
    them like any other variables in C programs. It is therefore not a surprise to
    note that there exist some similarities between functions and variables in C.


    +   - Both function names and variable names are considered identifiers and therefore,
    they must adhere to the rules for identifiers.

    +   - Like variables, functions have types (such as *int*) associated with them.

    +   - Like variables, function names and their types must be declared and defined
    before they are used in a program.


    In order to make use of a user-defined function, we need to establish three elements
    that are related to functions.


    +   1. Function definition.

    +   2. Function call.

    +   3. Function declaration.


    The *function definition* is an independent program module that is specially written
    to implement the requirements of the function. In order to use this function we
    need to invoke it at a required place in the program. This is known as the *function
    call*. The program (or a function) that calls the function is referred to as the
    *calling program or calling function*. The calling program should declare any
    function (like declaration of a variable) that is to be used later in the program.
    This is known as the *function declaration or function prototype*.'
