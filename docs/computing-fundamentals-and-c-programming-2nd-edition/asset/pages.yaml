    \ in an expression (on the right-hand side of the equal sign), the pointer returns\
    \ the value of the variable of which the pointer value is the address. In this\
    \ case, *p returns the value of the variable quantity, because p is the address\
    \ of quantity. The * can be remembered as 'value at address'. Thus, the value\
    \ of n would be 179. The two statements\n\n```\n```\np = &quantity;\nn = *p;\n\
    ```\n```\n\nare equivalent to\n\n```\n```\nn = *&quantity;\n```\n```\n\nwhich\
    \ in turn is equivalent to\n\n```\n```\nn = quantity;\n```\n```\n\nIn C, the assignment\
    \ of pointers and addresses is always done symbolically, by means of symbolic\
