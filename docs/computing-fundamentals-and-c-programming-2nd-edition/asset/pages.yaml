    # ## 9.2 ONE-DIMENSIONAL ARRAYS


    A list of items can be given one variable name using only one subscript and such
    a variable is called a *single-subscripted variable* or a *one-dimensional array*.
    In mathematics, we often deal with variables that are single-subscripted. For
    instance, we use the equation


    \[ A = \frac{\sum_{i=1}^{n} x_i}{n} \]


    to calculate the average of *n* values of *x*. The subscripted variable *x_i*
    refers to the ith element of *x*. In C, single-subscripted variable *x_i* can
    be expressed as


    ```

    ```

    x[1], x[2], x[3],...........x[n]

    ```

    ```


    The subscript can begin with number 0. That is


    ```

    ```

    x[0]

    ```

    ```


    is allowed. For example, if we want to represent a set of five numbers, say (35,
    40, 20, 57, 19), by an array variable **number**, then we may declare the variable
    **number** as follows


    ```

    ```c

    int number[5];

    ```

    ```


    and the computer reserves five storage locations as shown below:


    ![](img/11b034a94fc590add0a7808250a38792_306_0.png)


    The values to the array elements can be assigned as follows:


    ```

    ```c

    number[0] = 35;

    number[1] = 40;

    number[2] = 20;

    number[3] = 57;

    number[4] = 19;

    ```

    ```


    This would cause the array **number** to store the values as shown below:


    | | |

    |---|---|

    | number [0] | 35 |

    | number [1] | 40 |

    | number [2] | 20 |

    | number [3] | 57 |

    | number [4] | 19 |'
