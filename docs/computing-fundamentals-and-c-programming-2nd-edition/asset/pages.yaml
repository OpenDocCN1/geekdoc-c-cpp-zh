- pgno: 558
  md: '# ## AIII.1 INTRODUCTION


    Data storage is an important function of a computer system. While the facility
    of storing the data is provided by hardware storage devices, we cannot simply
    dump the entire data in them. We must logically organize the data in such a way
    that future data access and manipulation becomes simpler and efficient. Database
    system is one such dedicated program that manages the collection of a large number
    of data elements in a systematic manner. Computer applications and users simply
    interact with the database system through an interface while the later works behind
    the scenes to access and retrieve the required data elements. There are different
    data models on which we can base the design of our database. The choice of a particular
    data model is made on the basis of the type of the data to be stored and its associated
    relationships.


    # ## AIII.2 DATA MODELS


    Data model refers to the structure of a database system describing how data objects
    are arranged inside the database. It also describes several other concepts related
    to the database system, such as constraints, relationships, etc. The various types
    of data models are:


    +   - Entity-relationship (ER) model

    +   - Hierarchical model

    +   - Network model


    # ### AIII.2.1 ER Model


    The ER model realizes all real-world objects and concepts as entities and defines
    relationships amongst these entities. It is primarily used for designing a relational
    database system. It represents the overall logical structure of the entire database
    system.


    The key terminologies related to the ER model are:


    +   - **Entity**: It represents a real-world object, such as an employee, a bank
    account, etc.

    +   - **Entity set**: It is a collection of entities of similar type, such as
    a group of employees.

    +   - **Attributes**: It refers to the characteristics that represent the entity.
    For example, name, employee number, department, etc are the attributes of the
    employee entity.

    +   - **Relationship**: It specifies how two or more entities are related to each
    other.

    +   - **Relationship set**: It is a group of relationships of similar types.

    +   - **ER diagram**: It is a diagrammatic representation of the logical structure
    of a database. It represents entity sets by rectangles, relationship sets by diamonds
    and attributes by ellipses.'
  merge: -1
  img_proc: true
- pgno: 559
  md: 'Fig. AIII.1 Shows a sample ER diagram.


    ![](img/11b034a94fc590add0a7808250a38792_559_0.png)


    Fig. AIII.1 ER Diagram


    In the above diagram, Vendor and Vendor account are entity sets while Name, Address,
    ID etc. are attributes of the entity sets. Supplier is the relationship set that
    defines the relationship between the two entity sets. Here, the relationship is
    of one-to-one type; however a relationship set can have other types as well, such
    as one to many, many to many, etc. A complete ER diagram for a given scenario
    can be used as a blue print or a design document for creating a relational database
    system.


    # ### AIII.2.2 Hierarchical Model


    As the name suggests, the hierarchical data model arranges the data in hierarchical
    or tree format. It follows the simple parent-child relationship for arranging
    data where each parent can have zero or many children, while each child has only
    one parent. Hierarchical data model is suitable in situation where there is a
    direct relationship between records. To understand the hierarchical data model,
    let us take the analogy of the product range of an electronic products manufacturing
    company, as shown in Fig. AIII.2:


    ![](img/11b034a94fc590add0a7808250a38792_559_1.png)


    Fig. AIII.2 Hierarchical Structure.


    As shown in Fig AIII.2, the related products are grouped inside their parent categories
    in a hierarchical fashion. It is important to note that hierarchical database
    design is suitable in situations where there is a hierarchical relationship between
    the data items.


    Some of the key advantages of hierarchical data model are:


    +   - It is simple to understand and implement.

    +   - It is particularly suitable in situations where the data items and their
    relationships are already known, and are not expected to change.'
  merge: -1
  img_proc: true
- pgno: 560
  md: '+   - It helps to build faster and efficient databases.


    Apart from the above advantages, the hierarchical model also has certain limitations,
    which are:


    +   - It is less flexible and difficult to change.

    +   - There is a comparatively lesser scope of query optimization in hierarchical
    databases.


    # AIII.2.3  Network Model


    If hierarchical data model is analogous to a tree structure, network data model
    is analogous to a graph. This means, unlike hierarchical model, a child node in
    network model can have multiple parent nodes. This signifies many-to-many relationship
    between various data items. Thus flexibility becomes one of the most significant
    advantages of a network model.


    The network data model was formally put forward by the Conference on Data Systems
    Languages (CODASYL) in 1971. With many-to-many relationship concept, it removes
    any kind of restrictions on the database structure, as is prevalent in the hierarchical
    model. Thus, it facilitates convenient modelling relationships between entities.
    Figure AIII.3 represents a network data model:


    ![](img/11b034a94fc590add0a7808250a38792_560_0.png)


    **Fig. AIII.3**  *Network model*


    # AIII.3  ARCHITECTURE OF DATABASE SYSTEM


    The architecture of a database system depicts the structure and layout of the
    data stored and the mechanisms used for accessing the stored data. It shows how
    various functional components are arranged inside the database system to facilitate
    typical database related operations. Figure AIII.4 shows the generic view of the
    database system architecture:


    As shown in Fig. AIII.4 a database system comprises the following typical components:


    +   - **DML language:** Also known as query language, it is used for manipulating
    (inserting, modifying, and deleting) data stored in various tables of the database.

    +   - **DDL language:** It is used defining the structure of the database, i.e.
    table and their attributes, relationships, constraints, etc.

    +   - **Query Optimizer:** It Optimizes the execution of a query. There could
    be multiple ways of executing a particular query; the query optimizer chooses
    the fastest and most efficient methods amongst them.

    +   - **Database Manager:** It acts as a controller for performing database related
    operations.

    +   - **File Manager:** It manages the database files.

    +   - **Physical Database:** It is the physical storage device on which data is
    actually stored.

    +   - **Meta Data:** It is the data dictionary used for storing meta information,
    i.e., data about data.

    +   - **User Interface:** It is the entry point from where users and applications
    interact with the database.


    There is another point of view of looking at the database architecture, i.e.,
    in terms of schemas, as explained next.'
  merge: -1
  img_proc: true
- pgno: 561
  md: '![](img/11b034a94fc590add0a7808250a38792_561_0.png)


    **Fig. AIII.4** Database System Architecture.


    # ## AIII.4 DATA DICTIONARY


    Data dictionary is a key part of a database system that contains information about
    the database itself, as well as the data elements stored in it. Thus, data dictionary
    is nothing but a collection of meta-data or ''data about data''. The data dictionary
    of a database may be created in any of the following forms:


    +   - Tables

    +   - Text of XML Files

    +   - Spreadsheet


    The main objective of a data dictionary is to store accurate and complete meta-information
    so that the users who want to work with the database can access it as a ready
    reference. Typically, data dictionary may include the following:


    +   - Table name

    +   - Column names

    +   - Data type information

    +   - Default field values

    +   - Data constraints

    +   - Schema information

    +   - User information and their privileges'
  merge: -1
  img_proc: true
- pgno: 562
  md: 'Most of the database systems automatically update the data dictionary when
    a user issues any data definition language (DDL) statement. A data dictionary
    might be of interest to any one of the following users:


    +   - Database developers

    +   - Application developers

    +   - Database Administrator (DBA)


    # ### AIII.5 DBA


    Database administrator or DBA is the person responsible for development and management
    of a database system. A DBA has the centralized control over the database and
    is primarily responsible for its maintenance and support. The typical roles and
    roles and responsibilities of a DBA include the following:


    +   - Implementing database models

    +   - Designing and creating database schemas

    +   - Managing user rights and privileges

    +   - Implementing backup and recovery procedures

    +   - Establishing and enforcing database standards

    +   - Implementing integrity constraints

    +   - Database performance tuning

    +   - Executing all database control and administration tasks

    +   - Ensuring database availability

    +   - Planning and implementing database migration as and when required

    +   - Managing database storage devices

    +   - Implementing and reviewing database security policies

    +   - Updating database documentation


    The actual roles and responsibilities of a DBA may vary from one organization
    to the other.


    # ### AIII.6 PRIMARY KEY AND FOREIGN KEY


    # #### AIII.6.1 Primary Key


    A table in a relational database system may comprise an attribute or a column
    that contains unique values. If not for a single attribute, a combination of multiple
    attributes may generate unique identifier values in a table. These unique values
    may help us in uniquely identifying each tuple or row in the table. Such attributes
    or combination of attributes that help uniquely identify all the tuples in a table
    are called primary keys.


    If there are multiple attributes present in a table that may help us in uniquely
    identifying the tuples then only the designated attribute is called primary key
    while all the other attributes are referred as candidate keys. They are called
    candidate key because they possess the candidature of becoming a primary key,
    if required. A primary key does not contain null or duplicate values.


    Consider a table containing employee information, as shown in Table AIII.1'
