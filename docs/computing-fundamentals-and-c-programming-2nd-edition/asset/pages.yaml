  md: "# Stringizing Operator #\n\nANSI C provides an operator # called stringizing\
    \ operator to be used in the definition of macro functions. This operator allows\
    \ a formal argument within a macro definition to be converted to a string. Consider\
    \ the example below:\n\n```\n    #define sum(xy) printf(#xy \" = %f\\n\", xy)\n\
    \    main()\n    {\n        ... ...\n        sum(a+b);\n        ... ...\n    }\n\
    ```\n\nThe preprocessor will convert the line\n\n```\n    sum(a+b);\n```\n\ninto\n\
    \n```\n    printf(\"a+b\" \" = %f\\n\", a+b);\n```\n\nwhich is equivalent to\n\
    \n```\n    printf(\"a+b = %f\\n\", a+b);\n```\n\nNote that the ANSI standard also\
    \ stipulates that adjacent strings will be concatenated.\n\n# Token Pasting Operator\
    \ ##\n\nThe token pasting operator ## defined by ANSI standard enables us to combine\
    \ two tokens within a macro definition to form a single token. For example:\n\n\
    ```\n    #define combine(s1,s2) s1 ## s2\n    main()\n    {\n        ... ...\n\
    \        printf(\"%f\", combine(total, sales));\n        ... ...\n        ...\
    \ ...\n    }\n```\n\nThe preprocessor transforms the statement\n\n```\n    printf(\"\
    %f\", combine(total, sales));\n```\n\ninto the statement\n\n```\n    printf(\"\
    %f\", totalsales);\n```\n\nConsider another macro definition:\n\n```\n    #define\
    \ print(i) printf(\"a\" #i \" = %f\", a##i)\n```\n\nThis macro will convert the\
    \ statement\n\n```\n    print(5);\n```\n\ninto the statement\n\n```\n    printf(\"\
    a5 = %f\", a5)\n```"
