- pgno: 461
  md: "![](img/11b034a94fc590add0a7808250a38792_461_0.png)\n\nThere are several specific\
    \ points to observe:\n\n+   1. The first field always starts with the first bit\
    \ of the word.\n+   2. A bit field cannot overlap integer boundaries. That is,\
    \ the sum of lengths of all the fields in a structure should not be more than\
    \ the size of a word. In case, it is more, the overlapping field is automatically\
    \ forced to the beginning of the next word.\n+   3. There can be unnamed fields\
    \ declared with size. Example:\n+   \n+      ```c\n+      Unsigned : bit-length\n\
    +      ```\n+   \n+      Such fields provide padding within the word.\n+   4.\
    \ There can be unused bits in a word.\n+   5. We cannot take the address of a\
    \ bit field variable. This means we cannot use `scanf` to read values into bit\
    \ fields. We can neither use the pointer to access the bit fields.\n+   6. Bit\
    \ fields cannot be arrayed.\n+   7. Bit fields should be assigned values that\
    \ are within the range of their size. If we try to assign larger values, behaviour\
    \ would be unpredictable.\n\nSuppose, we want to store and use personal information\
    \ of employees in compressed form, this can be done as follows:\n\n```\n```c\n\
    struct personal\n{\n    unsigned sex              :     1\n    unsigned age  \
    \            :     7\n    unsigned m_status         :     1\n    unsigned children\
    \         :     3\n    unsigned                 :     4\n} emp;\n```\n```\n\n\
    This defines a variable name **emp** with four bit fields. The range of values\
    \ each field could have is as follows:\n\n| Bit field | Bit length | Range of\
    \ value |\n|---|---:|---|\n| sex | 1 | 0 or 1 |\n| age | 7 | 0 or 127 (2⁷ − 1)\
    \ |\n| m_status | 1 | 0 or 1 |\n| children | 3 | 0 to 7 (2³−1) |\n\nOnce bit fields\
    \ are defined, they can be referenced just as any other structure-type data item\
    \ would be referenced. The following assignment statements are valid.\n\n```\n\
    ```c\nemp.sex = 1;\nemp.age = 50;\n```\n```\n\nRemember, we cannot use `scanf`\
    \ to read values into a bit field. We may have to read into a temporary variable\
    \ and then assign its value to the bit field. For example:\n\n```\n```c\nscanf(\"\
    %d %d\", &AGE, &CHILDREN);\nemp.age = AGE;\n```\n```"
  merge: -1
  img_proc: true
- pgno: 462
  md: "```\nemp.children = CHILDREN;\n```\n\nOne restriction in accessing bit fields\
    \ is that a pointer cannot be used. However, they can be used in normal expressions\
    \ like any other variable. For example:\n\n```\nsum = sum + emp.age;\nif(emp.m_status)\
    \ . . . ;\nprintf(\"%d\\n\", emp.age);\n```\n\nare valid statements.\n\nIt is\
    \ possible to combine normal structure elements with bit field elements. For example:\n\
    \n```\nstruct personal\n{\n    char        name[20];   /* normal variable */\n\
    \    struct addr address;    /* structure variable */\n    unsigned    sex : 1;\n\
    \    unsigned    age : 7;\n    . . . .\n    . . . .\n} emp[100];\n```\n\nThis\
    \ declares **emp** as a 100 element array of type **struct personal**. This combines\
    \ normal variable name and structure type variable **address** with bit fields.\n\
    \nBit fields are packed into words as they appear in the definition. Consider\
    \ the following definition.\n\n```\nstruct pack\n{\n    unsigned a:2;\n    int\
    \ count;\n    unsigned b : 3;\n};\n```\n\nHere, the bit field **a** will be in\
    \ one word, the variable **count** will be in the second word and the bit field\
    \ **b** will be in the third word. The fields **a** and **b** would not get packed\
    \ into the same word.\n\n> **Note** *Other related topics such as ‘Structures\
    \ with Pointers’ and ‘Structures and Linked Lists’ are discussed in Chapter 13\
    \ and Chapter 14, respectively.*\n\n# LEARNING OUTCOMES\n\n+   - Remember to place\
    \ a semicolon at the end of definition of structures and unions. LO 12.1\n+  \
    \ - We can declare a structure variable at the time of definition of a structure\
    \ by placing it after the closing brace but before the semicolon. LO 12.2\n+ \
    \  - Do not place the structure tag name after the closing brace in the definition.\
    \ That will be treated as a structure variable. The tag name must be placed before\
    \ the opening brace but after the keyword **struct**. LO 12.2\n+   - When we use\
    \ **typedef** definition, the **type_name** comes after the closing brace but\
    \ before the semicolon. LO 12.4"
