    # 2.6 CONVERSION OF NUMBERS


    The computer systems accept the data in decimal form, whereas they store and process
    the data in binary form. Therefore, it becomes necessary to convert the numbers
    represented in one system into the numbers represented in another system. The
    different types of number system conversions can be divided into the following
    major categories:


    +   - Non-decimal to decimal

    +   - Decimal to non-decimal

    +   - Octal to hexadecimal


    # 2.6.1 Non-Decimal to Decimal


    The non-decimal to decimal conversions can be implemented by taking the concept
    of place values into consideration. The non-decimal to decimal conversion includes
    the following number system conversions:


    +   - Binary to decimal conversion

    +   - Hexadecimal to decimal conversion

    +   - Octal to decimal conversion


    **Binary to decimal conversion** A binary number can be converted to equivalent
    decimal number by calculating the sum of the products of each bit multiplied by
    its corresponding place value.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# **Example 2.1** *Convert the binary number 10101101 into its corresponding
    decimal number.*


