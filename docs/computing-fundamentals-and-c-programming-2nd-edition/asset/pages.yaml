- pgno: 147
  md: "not known to other functions. Note that the variable i has been declared in\
    \ both the functions. Any change in the value of i in one function does not affect\
    \ its value in the other.\n\nC provides a variety of storage class specifiers\
    \ that can be used to declare explicitly the scope and lifetime of variables.\
    \ The concepts of scope and lifetime are important only in multifunction and multiple\
    \ file programs and therefore the storage classes are considered in detail later\
    \ when functions are discussed. For now, remember that there are four storage\
    \ class specifiers (auto, register, static, and extern) whose meanings are given\
    \ in Table 4.10.\n\nThe storage class is another qualifier (like long or unsigned)\
    \ that can be added to a variable declaration as shown below:\n\n```\n```c\nauto\
    \ int count;\nregister char ch;\nstatic int x;\nextern long total;\n```\n```\n\
    \nStatic and external (extern) variables are automatically initialized to zero.\
    \ Automatic (auto) variables contain undefined values (known as ‘garbage’) unless\
    \ they are initialized explicitly.\n\n**Table 4.10** Storage Classes and Their\
    \ Meaning\n\n| Storage class | Meaning |\n| :--- | :--- |\n| **auto** | Local\
    \ variable known only to the function in which it is declared. *Default is auto.*\
    \ |\n| **static** | Local variable which exists and retains its value even after\
    \ the control is transferred to the calling function. |\n| **extern** | Global\
    \ variable known to all functions in the file. |\n| **register** | Local variable\
    \ which is stored in the register. |\n\n# **4.10 ASSIGNING VALUES TO VARIABLES**\n\
    \nVariables are created for use in program statements such as,\n\n```\n```c\n\
    value = amount + inrate * amount;\nwhile (year <= PERIOD)\n{\n    ....\n    ....\n\
    \    year = year + 1;\n}\n```\n```\n\nIn the first statement, the numeric value\
    \ stored in the variable **inrate** is multiplied by the value stored in **amount**\
    \ and the product is added to **amount**. The result is stored in the variable\
    \ **value**. This process is possible only if the variables **amount** and **inrate**\
    \ have already been given values. The variable **value** is called the *target\
    \ variable*. While all the variables are declared for their type, the variables\
    \ that are used in expressions (on the right side of equal (=) sign of a computational\
    \ statement) *must* be assigned values before they are encountered in the program.\
    \ Similarly, the variable **year** and the symbolic constant **PERIOD** in the\
    \ **while** statement must be assigned values before this statement is encountered."
