    +   1. Analyse the given problem.

    +   2. Divide the process used to solve the problem in a series of elementary
    tasks.

    +   3. Formulate the algorithm to solve the problem.

    +   4. Express the algorithm as a precise notation, which is known as a computer
    program.

    +   5. Feed the computer program in the computer. CPU interprets the given program,
    processes the data accordingly, and generates the result.

    +   6. Send the generated result to the output unit, which displays it.'
