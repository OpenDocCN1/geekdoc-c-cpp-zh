  md: '# # 11.2 NEED FOR USER-DEFINED FUNCTIONS


    As pointed out earlier, **main** is a specially recognized function in C. Every
    program must have a **main** function to indicate where the program has to begin
    its execution. While it is possible to code any program utilizing only **main**
    function, it leads to a number of problems. The program may become too large and
    complex and as a result the task of debugging, testing, and maintaining becomes
    difficult. If a program is divided into functional parts, then each part may be
    independently coded and later combined into a single unit. These independently
    coded programs are called *subprograms* that are much easier to understand, debug,
    and test. In C, such subprograms are referred to as "**functions**".


    There are times when certain type of operations or calculations are repeated at
    many points throughout a program. For instance, we might use the factorial of
    a number at several points in the program. In such situations, we may repeat the
    program statements wherever they are needed. Another approach is to design a function
    that can be called and used whenever required. This saves both time and space.


    This "division" approach clearly results in a number of advantages.


    +   1. It facilitates top-down modular programming as shown in Fig. 11.1. In this
    programming style, the high level logic of the overall problem is solved first
    while the details of each lower-level function are addressed later.

    +   2. The length of a source program can be reduced by using functions at appropriate
    places. This factor is particularly critical with microcomputers where memory
    space is limited.

    +   3. It is easy to locate and isolate a faulty function for further investigations.

    +   4. A function may be used by many other programs. This means that a C programmer
    can build on what others have already done, instead of starting all over again
    from scratch.


    ![](img/11b034a94fc590add0a7808250a38792_387_0.png)


    **Fig. 11.1** *Top-down modular programming using functions*


