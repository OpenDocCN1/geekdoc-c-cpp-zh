- pgno: 235
  md: "# ### 7.5.1 Dangling Else Problem\n\nOne of the classic problems encountered\
    \ when we start using nested if....else statements is the dangling else. This\
    \ occurs when a matching else is not available for an if. The answer to this problem\
    \ is very simple. Always match an else to the most recent unmatched if in the\
    \ current block. In some cases, it is possible that the false condition is not\
    \ required. In such situations, else statement may be omitted\n\n> > “else is\
    \ always paired with the most recent unpaired if”\n\n# ## 7.6 THE ELSE IF LADDER\n\
    \nLO 7.2\n\nThere is another way of putting ifs together when multipath decisions\
    \ are involved. A multipath decision is a chain of ifs in which the statement\
    \ associated with each else is an if. It takes the following general form:\n\n\
    ```\n~~~\nif ( condition 1)\n    statement-1;\n\n    else if ( condition 2)\n\
    \        statement-2;\n\n        else if ( condition 3)\n            statement-3;\n\
    \n            else if ( condition n)\n                statement-n;\n         \
    \       else\n                    default-statement;\n\nstatement-x;\n~~~\n```\n\
    \nThis construct is known as the else if ladder. The conditions are evaluated\
    \ from the top (of the ladder), downwards. As soon as a true condition is found,\
    \ the statement associated with it is executed and the control is transferred\
    \ to the statement-x (skipping the rest of the ladder). When all the n conditions\
    \ become false, then the final else containing the default-statement will be executed.\
    \ Figure 7.9 shows the logic of execution of else if ladder statements.\n\nLet\
    \ us consider an example of grading the students in an academic institution. The\
    \ grading is done according to the following rules:\n\n| Average marks | Grade\
    \ |\n| --- | --- |\n| 80 to 100 | Honours |\n| 60 to 79 | First Division |\n|\
    \ 50 to 59 | Second Division |\n| 40 to 49 | Third Division |\n| 0 to 39 | Fail\
    \ |"
  merge: -1
  img_proc: true
- pgno: 236
  md: "![](img/11b034a94fc590add0a7808250a38792_236_0.png)\n\nThis grading can be\
