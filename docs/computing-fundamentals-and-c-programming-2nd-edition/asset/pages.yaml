  md: 'user interface, which was first introduced in 1981 for IBM computers. Although
    MS DOS, nowadays, is not used as a stand-alone product, but it comes as an integrated
    product with the various versions of Windows.


    In MS DOS, unlike Graphical User Interface (GUI)-based operating systems, there
    is a command line interface, which is known as MS DOS prompt. Here, we need to
    type the various commands to perform the operations in MS DOS operating system.
    The MS DOS commands can be broadly categorized into the following three classes:


    +   - **Environment command** — These commands usually provide information on
    or affects operating system environment. Some of these commands are:

    +     - **CLS:** It allows the user to clear the complete content of the screen
    leaving only the MS-DOS prompt.

    +     - **TIME:** It allows the user to view and edit the time of the computer.

    +     - **DATE:** It allows the user to view the current date as well as change
    the date to an alternate date.

    +     - **VER:** It allows us to view the version of the MS-DOS operating system.

    +   - **File manipulation command** — These commands help in manipulating files,
    such as copying a file or deleting a file. Some of these commands include:

    +     - **COPY:** It allows the user to copy one or more files from one specified
    location to an alternate location.

    +     - **DEL:** It helps in deleting a file from the computer.

    +     - **TYPE:** It allows the user to view the contents of a file in the command
    prompt.

    +     - **DIR:** It allows the user to view the files available in the current
    and/or parent directories.

    +   - **Utilities** — These are special commands that perform various useful functions,
    such as formatting a diskette or invoking the text editor in the command prompt.
    Some of these commands include:

    +     - **FORMAT:** It allows the user to erase all the content from a computer
    diskette or a fixed drive.

    +     - **EDIT:** It allows the user to view a computer file in the command prompt,
    create and modify the computer files.


    # ## 1.10.2 MS Windows Operating System


    # ### Windows Architecture


    The architecture of Windows operating system comprises a modular structure that
    is compatible with a variety of hardware platforms. Figure 1.17 shows the architecture
    of Windows 2000; the later releases of Windows operating systems are based on
    similar architecture.


    At a high level, the architecture is divided into three layers, viz.


    +   - **User mode:** Comprises application and I/O specific software components

    +   - **Kernel mode:** Has complete access to system resources and hardware

    +   - **Hardware:** Comprises underlying hardware platform


    # ### User Mode


    The various subsystems in the user mode are divided into the following two categories:


    +   - **Environment subsystems:** Comprise subsystems that run applications written
    for other operating systems. These subsystems cannot directly request hardware
    access; instead such requests are processed by virtual memory manager present
    in the kernel mode. The three main environment subsystems include Win32, OS/2
    and POSIX. Each of these subsystems possess dynamic link libraries for converting
    user application calls to Windows calls.

    +   - **Integral subsystems:** Takes care of the operating system specific functions
    on behalf of the environment subsystems. The various integral subsystems include
    workstation service, server service and security.'
  merge: -1
  img_proc: true
