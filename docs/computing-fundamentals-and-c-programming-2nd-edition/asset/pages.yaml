- pgno: 23
  md: '# 1.3 CLASSIFICATION OF COMPUTERS


    Computers can be classified into several categories depending on their computing
    ability and processing speed. These include


    +   - ❖ Microcomputer

    +   - ❖ Minicomputer

    +   - ❖ Mainframe computers

    +   - ❖ Supercomputers


    # **Microcomputers**


    A microcomputer is defined as a computer that has a microprocessor as its CPU
    and can perform the following basic operations:


    +   - ❖ **Inputting** — entering data and instructions into the microcomputer
    system.

    +   - ❖ **Storing** — saving data and instructions in the memory of the microcomputer
    system, so that they can be use whenever required.

    +   - ❖ **Processing** — performing arithmetic or logical operations on data,
    where data, such as addition, subtraction, multiplication and division.

    +   - ❖ **Outputting** — It provides the results to the user, which could be in
    the form of visual display and/or printed reports.

    +   - ❖ **Controlling** — It helps in directing the sequence and manner in which
    all the above operations are performed.


    # **Minicomputers**


    A minicomputer is a medium-sized computer that is more powerful than a microcomputer.
    It is usually designed to serve multiple users simultaneously, hence called a
    multiterminal, time-sharing system. Minicomputers are popular among research and
    business organizations today. They are more expensive than microcomputers.


    # **Mainframe Computers**


    Mainframe computers help in handling the information processing of various organizations
    like banks, insurance companies, hospitals and railways. Mainframe computers are
    placed on a central location and are connected to several user terminals, which
    can act as access stations and may be located in the same building. Mainframe
    computers are larger and expensive in comparison to the workstations.


    # **Supercomputers**


    In supercomputers, multiprocessing and parallel processing technologies are used
    to promptly solve complex problems. Here, the microprocessor can enable the user
    to divide a complex problem into smaller problems. A supercomputer also supports
    multiprogramming where multiple users can access the computer simultaneously.
    Presently, some of the popular manufacturers of supercomputers are IBM, Silicon
    Graphics, Fujitsu, and Intel.'
  merge: -1
  img_proc: true
