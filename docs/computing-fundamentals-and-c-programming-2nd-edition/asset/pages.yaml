- pgno: 35
  md: "+   - **PnP manager:** Supports plug-and-play devices by determining the correct\
    \ driver for a device and further loading the driver.\n+   - **Power manager:**\
    \ Performs power management for the various devices. It also optimizes power utilization\
    \ by putting the devices to sleep that are not in use.\n+   - **GDI:** Stands\
    \ for Graphics Device Interface and is responsible for representing graphical\
    \ objects in Windows environment. It also transfers the graphical objects to the\
    \ output devices such as printer and monitor.\n+   - **Object manager:** Manages\
    \ Windows Executive objects and abstract data types that represent the various\
    \ resources such as processes, threads, etc.\n\n# ### 1.10.3 Unix Operating System\n\
    \nUNIX operating system was developed by a group of AT&T employees at Bell Labs\
    \ in the year 1969. UNIX is primarily designed to allow multiple users access\
    \ the computer at the same time and share resources. The UNIX operating system\
    \ is written in C language. The significant properties of UNIX include:\n\n+ \
    \  - Multi-user capability\n+   - Multi-tasking capability\n+   - Portability\n\
    +   - Flexibility\n+   - Security\n\n# #### Architecture of UNIX\n\nUNIX has a\
    \ hierarchical architecture consisting of several layers, where each layer provides\
    \ a unique function as well as maintains interaction with its lower layers. The\
    \ layers of the UNIX operating system are:\n\n+   - Kernel\n+   - Service\n+ \
    \  - Shell\n+   - User applications\n\nFigure 1.18 shows the various layers of\
    \ the UNIX operating system.\n\n+   - **Kernel** — The kernel is the core of the\
    \ UNIX operating system and it gets loaded into memory whenever we switch on the\
    \ computer. Three components of kernel are:\n+       - **Scheduler** — It allows\
    \ scheduling the processing of various jobs.\n+       - **Device driver** — It\
    \ helps in controlling the Input/Output devices attached to the computer.\n+ \
    \      - **I/O buffer** — It controls the I/O operations in the computer.\n+ \
    \  \n+     Various functions performed by the kernel are:\n+       - Initiating\
    \ and executing different programs at the same time\n+       - Allocating memory\
    \ to various user and system processes\n+       - Monitoring the files that reside\
    \ on the disk\n+       - Sending and receiving information to and from the network\n\
    +   - **Service** — In the service layer, requests are received from the shell\
    \ and they are then transformed into commands to the kernel. The service layer,\
    \ which is also known as the *resident module layer*, is indistinguishable from\
    \ the kernel and consists of a collection of programs providing various services,\
    \ which include:\n+       - Providing access to various I/O devices, such as keyboard\
    \ and monitor\n+       - Providing access to storage devices, such as disk drives\n\
    +       - Controlling different file manipulation activities, such as reading\
    \ from a file and writing to a file"
  merge: -1
  img_proc: true
- pgno: 36
  md: '![](img/11b034a94fc590add0a7808250a38792_36_0.png)


    Fig. 1.18  The layers of UNIX operating system


    ❖ **Shell**  The third layer in the UNIX architecture is the shell, which acts
    as an interface between a user and the computer for accepting the requests and
    executing programs. The shell is also known as the command interpreter that helps
    in controlling the interaction with the UNIX operating system. The primary function
    of the shell is to read the data and instructions from the terminal, and then
    execute commands and finally display the output on the monitor. The shell is also
    termed as the utility layer as it contains various library routines for executing
    routine tasks. The various shells that are found in the UNIX operating system
    are:


    +   * Bourne shell

    +   * C shell

    +   * Korn shell

    +   * Restricted shell


    ❖ **User applications**  The last layer in the UNIX architecture is the user applications,
    which are used to perform several tasks and communicating with other users of
    UNIX. Some of the important examples of user applications include text processing,
    software development, database management and electronic communication.


    # 1.11 MS WORD


    MS Word is application software that can be used to create, edit, save and print
    personal as well as professional documents in a very simple and efficient manner.
    MS Word is an important tool of the MS office suite that is mainly designed for
    word processing. Other word processing applications available are, Open Office
    Writer and Google Docs.'
