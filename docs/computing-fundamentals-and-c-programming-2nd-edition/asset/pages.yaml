  md: "# 9.6.1  Memory Layout\n\nThe subscripts in the definition of a two-dimensional\
    \ array represent rows and columns. This format maps the way that data elements\
    \ are laid out in the memory. The elements of all arrays are stored contiguously\
    \ in increasing memory locations, essentially in a single list. If we consider\
    \ the memory as a row of bytes, with the lowest address on the left and the highest\
    \ address on the right, a simple array will be stored in memory with the first\
    \ element at the left end and the last element at the right end. Similarly, a\
    \ two-dimensional array is stored “row-wise,” starting from the first row and\
    \ ending with the last row, treating each row like a simple array. This is illustrated\
    \ below.\n\n![](img/11b034a94fc590add0a7808250a38792_323_0.png)\n\nFor a multi-dimensional\
    \ array, the order of storage is that the first element stored has 0 in all its\
    \ subscripts, the second has all of its subscripts 0 except for the right which\
    \ has a value of 1 and so on. The elements of a 2 × 3 × 3 array will be stored\
    \ as under.\n\n![](img/11b034a94fc590add0a7808250a38792_323_1.png)\n\nThe far\
    \ right subscript increments first and the other subscripts increment in order\
    \ from right to left. The sequence numbers 1, 2,……, 18 represents the location\
    \ of that element in the list.\n\n# WORKED-OUT PROBLEM 9.7\n\nThe program in Fig.\
    \ 9.9 shows how to find the transpose of a matrix.\n\n```\nAlgorithm\n    Step\
    \ 1 – Start\n    Step 2 – Read a 3 × 3 matrix (a[3][3])\n    Step 3 – Initialize\
    \ the looping counter i = 0\n    Step 4 – Repeat Steps 5–9 while i<3\n```"
