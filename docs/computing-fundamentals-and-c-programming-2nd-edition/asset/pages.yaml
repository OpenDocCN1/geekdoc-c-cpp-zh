  md: '# ## 4.4 KEYWORDS AND IDENTIFIERS


    LO 4.1


    Every C word is classified as either a *keyword* or an *identifier*. All keywords
    have fixed meanings and these meanings cannot be changed. The list of all keywords
    of ANSI C are listed in Table 4.3. All keywords must be written in lowercase.
    Some compilers may use additional keywords that must be identified from the C
    manual.


    > > **Note** C99 adds some more keywords. See the Appendix “C99 Features”.


    Table 4.3 ANSI C Keyword


    | auto | double | int | struct |

    |---|---|---|---|

    | break | else | long | switch |

    | case | enum | register | typedef |

    | char | extern | return | union |

    | const | float | short | unsigned |

    | continue | for | signed | void |

    | default | goto | sizeof | volatile |

    | do | if | static | while |


    **Identifiers** refer to the names of variables, functions and arrays. These are
    user-defined names. Both uppercase and lowercase letters are permitted. The underscore
    character is also permitted in identifiers.


    # ### Rules for Identifiers


    +   1. First character must be an alphabet (or underscore).

    +   2. Must consist of only letters, digits or underscore.

    +   3. Only first 31 characters are significant.

    +   4. Cannot use a keyword.

    +   5. Must not contain white space.


    # ## 4.5 CONSTANTS


    LO 4.2


    Constants in C refer to fixed values that do not change during the execution of
    a program. C supports several types of constants as illustrated in Fig. 4.2.


    # ### 4.5.1 Integer Constants


    An *integer constant* refers to a sequence of digits. There are three types of
    integers, namely, *decimal integer*, *octal integer* and *hexadecimal integer*.


    **Decimal integers** consist of a set of digits, 0 through 9, preceded by an optional
    – or + sign. Valid examples of decimal integer constants are:


    ```

    `123  –321  0  654321  +78`

    ```'
  merge: -1
  img_proc: true
- pgno: 136
  md: '![](img/11b034a94fc590add0a7808250a38792_136_0.png)


    **Fig. 4.2** Basic types of C constants


    Embedded spaces, commas, and non-digit characters are not permitted between digits.
    For example,


    15 750   20,000   $1000


    are illegal numbers.


    > **Note** ANSI C supports unary plus which was not defined earlier.


    An *octal integer* constant consists of any combination of digits from the set
    0 through 7, with a leading 0. Some examples of octal integer are:


    ```

    ```

    037   0   0435   0551

    ```

    ```


    A sequence of digits preceded by 0x or 0X is considered as *hexadecimal integer*.
    They may also include alphabets A through F or a through f. The letter A through
    F represent the numbers 10 through 15. Following are the examples of valid hex
    integers:


    ```

    ```

    0X2  0x9F  0Xbed  0x

    ```

    ```


    We rarely use octal and hexadecimal numbers in programming.


    The largest integer value that can be stored is machine-dependent. It is 32767
    on 16-bit machines and 2,147,483,647 on 32-bit machines. It is also possible to
    store larger integer constants on these machines by appending *qualifiers* such
    as U,L and UL to the constants. Examples:


    ```

    ```

    56789U                 or 56789u                  (unsigned integer)

    987612347UL            or 98761234ul             (unsigned long integer)

    9876543L               or 9876543l               (long integer)

    ```

    ```


    The concept of unsigned and long integers are discussed in detail in Section 4.7.


    # ### WORKED-OUT PROBLEM 4.1


    Representation of integer constants on a 16-bit computer.


    The program in Fig. 4.3 illustrates the use of integer constants on a 16-bit machine.
    The output in Fig. 4.3 shows that the integer values larger than 32767 are not
    properly stored on a 16-bit machine. However, when they are qualified as long
    integer (by appending L), the values are correctly stored.'
