    # ### 1.14  NETWORKING CONCEPTS


    Computer network is a system of interconnected computers that enable the computers
    to communicate with each other and share their resources, data and applications.
    The physical location of each computer is tailored to personal and organisational
    needs. A network may include only personal computers or a mix of'
