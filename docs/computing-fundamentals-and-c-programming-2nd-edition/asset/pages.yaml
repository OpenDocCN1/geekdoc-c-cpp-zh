  md: '# # 2.12 USING THE COMPUTER  **LO 2.6**


    Computers can be used to solve specific problems that may be scientific or commercial
    in nature. In either case, there are some basic steps involved in using the computers.
    These are as follows:


    +   * **Problem analysis** Identify the known and unknown parameters and state
    the constraints under which the problem is to be solved. Select a method of solution.

    +   * **Collecting information** Collect data, information and the documents necessary
    for solving the problem and also plan the layout of output results.

    +   * **Preparing the computer logic** Identify the sequence of operations to
    be performed in the process of solving the problem and plan the program logic,
    preferably using a program flow chart.

    +   * **Writing the computer program** Write the program of instructions for the
    computer in a suitable language.

    +   * **Testing the program** There are usually errors(bugs) in it. Remove all
    these errors which may be either in using the language or in the logic.

    +   * **Preparing the data** Prepare input data in the required form.

    +   * **Running the program** This may be done either in batch mode or interactive
    mode. The computations are performed by the computer and the results are given
    out.


    The use of a particular input/output device depends upon the nature of the problem,
    type of input data in the form of output required.


    # ## LEARNING OUTCOMES


    +   * Computer codes help the computer system to convert the data received in
    a different number system to the data in the binary form so that it can be stored
    and processed in an efficient manner. **LO 2.1**

    +   * In computer terminology, the number system used to represent data is generally
    known as positional number system, because the value of the number represented
    in this system depends upon the position of the digits in the given number. **LO
    2.1**

    +   * The positional number system can be of four different types, namely, decimal
    system, binary system, hexadecimal system and octal system. **LO 2.1**

    +   * We can easily convert the number represented in one system to its equivalent
    in another system. The major number system conversions are non-decimal to decimal,
    decimal to non-decimal and octal to hexadecimal. **LO 2.2**

    +   * The basic arithmetic operations performed by the computer system are binary
    addition, binary multiplication, binary subtraction and binary division. **LO
    2.3**

    +   * The basic unit of the hardware components of a computer system is the logic
    gate. **LO 2.4**

    +   * There are three Basic Logic gates – AND gate, OR gate and NOT gate. **LO
    2.4**

    +   * Three levels of programming languages are available – machine languages,
    assembly languages and procedure-oriented languages. **LO 2.5**

    +   * Algorithms and flow charts are two important techniques that help in solving
    problem using a computer. **LO 2.6**'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# **KEY TERMS TO REMEMBER**


    +   - **Computer codes:** The computer codes are the codes that help in converting
    the data entered by the users into the binary form. **LO 2.1**

    +   - **Positional number system:** The positional number system is a system in
    which numbers are represented using certain symbols called digits and the values
    of these numbers is determined by taking the position of digits into consideration.
    **LO 2.1**

    +   - **Decimal system:** The decimal system is a positional number system that
    uses base 10 to represent different values. **LO 2.1**

    +   - **Binary system:** The binary system is a positional number system that
    uses base 2 to represent different values. **LO 2.1**

    +   - **Hexadecimal system:** The hexadecimal system is a positional number system
    that uses base 16 to represent different values. **LO 2.1**

    +   - **Octal system:** The octal system is a positional number system that uses
    base 8 to represent different values. **LO 2.1**

    +   - **Number system conversions:** The different type of number system conversions
    can be divided into three major categories: non-decimal to decimal, decimal to
    non-decimal and octal to hexadecimal. **LO 2.2**

    +   - **ALU:** ALU is an important component of CPU that is used to perform various
    arithmetic and logical operations in the computer system. **LO 2.3**

    +   - **Integer arithmetic:** Integer arithmetic refers to various arithmetic
    operations involving integer operands only. **LO 2.3**

    +   - **Floating-point arithmetic:** Floating point arithmetic refers to various
    arithmetic operations involving floating-point operands only. **LO 2.3**

    +   - **Unsigned binary number:** Unsigned binary number is the number with a
    magnitude of either zero or greater than zero. **LO 2.3**

    +   - **Basic logic gates:** Basic logic gates are the building blocks of digital
    circuits that perform logical operations such as AND, OR and NOT, on the binary
    inputs. **LO 2.4**

    +   - **Machine Language:** The computer instructions written using binary codes
    1 and 0 are machine code or machine language. **LO 2.5**

    +   - **Assembly Language:** In an assembly language, the 0s and 1s of machine
    language are replaced with abbreviations or mnemonic code. **LO 2.5**

    +   - **High Level Language:** High level language code is executed by translating
    it into corresponding machine language code with the help of a compiler or interpreter.
    **LO 2.5**

    +   - **Algorithms:** An algorithm is a complete, detailed and precise step-by-step
    method for solving a problem independently of the software or hardware of the
    computer. **LO 2.6**

    +   - **Flow charts:** A flow chart is the pictorial representation of the algorithm
    depicting the flow of the various steps. **LO 2.6**'
  merge: -1
  img_proc: true
