    # BRIEF CASES


    # 1. Calculation of Area under a Curve [LO 11.1, 11.2, 11.3, 11.6 M]


    One of the applications of computers in numerical analysis is computing the area
    under a curve. One simple method of calculating the area under a curve is to divide
    the area into a number of trapezoids of same width and summing up the area of
    individual trapezoids. The area of a trapezoid is given by


    Area = 0.5 * (h1 + h2) * b


    where h1 and h2 are the heights of two sides and b is the width as shown in Fig.
    11.19.


    The program in Fig. 11.21 calculates the area for a curve of the function


    f(x) = x² + 1


    between any two given limits, say, A and B.


    *Input*


    +   Lower limit (A)

    +   Upper limit (B)

    +   Number of trapezoids


