    \    47   167\n    51   170\n    Number of boys with weight < 50 kg\n    and height\
    \ > 170 cm =3\n```\n\n**Fig. 7.4**  *Use of if for counting*\n\n# ### 7.3.1 Applying\
    \ De Morgan's Rule\n\nWhile designing decision statements, we often come across\
    \ a situation where the logical NOT operator is applied to a compound logical\
    \ expression, like !(x&&y||z). However, a positive logic is always easy to read\
    \ and comprehend than a negative logic. In such cases, we may apply what is known\
    \ as **De Morgan's rule** to make the total expression positive. This rule is\
    \ as follows:\n\n> > “Remove the parentheses by applying the NOT operator to every\
    \ logical expression component, while complementing the relational operators”\n\
    \nThat is,\n\n```\n    x becomes !x\n    !x becomes x\n    && becomes ||\n   \
    \ || becomes &&\n```\n\nExamples:\n\n```\n    !(x && y || z) becomes !x || !y\
    \ && z\n    !(x <= 0 || !condition) becomes x >0&& condition\n```"
