    \ variables that can have one of the values enclosed within the braces (known\
    \ as *enumeration constants*). After this definition, we can declare variables\
    \ to be of this ‘new’ type as below:\n\n```\n    enum identifier v1, v2, ... vn;\n\
    ```\n\nThe enumerated variables v1, v2, ... vn can only have one of the values\
    \ value1, value2, ... valuen. The assignments of the following types are valid:\n\
