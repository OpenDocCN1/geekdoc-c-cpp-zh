    \n# ## 8.4 THE FOR STATEMENT\n\n**LO 8.3**\n\n# ### Simple ‘for’ Loops\n\nThe\
    \ **for** loop is another *entry-controlled* loop that provides a more concise\
    \ loop control structure. The general form of the **for** loop is\n\n```\n```\n\
    for ( initialization ; test-condition ; increment)\n{\n    body of the loop\n\
    }\n```\n```\n\nThe execution of the **for** statement is as follows:\n\n+   1.\
    \ *Initialization of the control variables* is done first, using assignment statements\
    \ such as `i = 1` and `count = 0`. The variables `i` and `count` are known as\
    \ loop-control variables.\n+   2. The value of the control variable is tested\
    \ using the test-condition. The *test-condition* is a relational expression, such\
    \ as `i < 10` that determines when the loop will exit. If the condition is *true*,\
    \ the body of the loop is executed; otherwise the loop is terminated and the execution\
    \ continues with the statement that immediately follows the loop.\n+   3. When\
    \ the body of the loop is executed, the control is transferred back to the **for**\
    \ statement after evaluating the last statement in the loop. Now, the control\
    \ variable is *incremented* using an assignment statement such as `i = i+1` and\
    \ the new value of the control variable is again tested to see whether it satisfies\
    \ the loop condition. If the condition is satisfied, the body of the loop is again\
    \ executed. This process continues till the value of the control variable fails\
    \ to satisfy the test-condition.\n\n> > **Note** *C99 enhances the **for** loop\
    \ by allowing declaration of variables in the initialization permits portion.\
    \ See the Appendix “C99 Features”.*\n\nConsider the following segment of a program:\n\
    \n```\n```\nfor ( x = 0 ; x <= 9 ; x = x+1)\n{\n    printf(\"%d\", x);\n}\nprintf(\"\
    \\n\");\n```\n```\n\nThis **for** loop is executed 10 times and prints the digits\
    \ 0 to 9 in one line. The three sections enclosed within parentheses must be separated\
    \ by semicolons. Note that there is no semicolon at the end of the *increment\
    \ section, x = x+1*.\n\nThe **for** statement allows for *negative increments*.\
    \ For example, the loop discussed above can be written as follows:"
