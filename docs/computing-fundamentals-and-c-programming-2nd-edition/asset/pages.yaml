- pgno: 444
  md: "A complex number has two parts: real and imaginary. Structures can be used\
    \ to realize complex numbers in C, as shown below:\n\n```\n~~~c\nstruct complex\
    \ /*Declaring the complex number datatype using structure*/\n{\n    double real;/*Real\
    \ part*/\n    double img;/*Imaginary part*/\n};\n~~~\n```\n\nFunction to return\
    \ the sum of two complex numbers\n\n```\n~~~c\nstruct complex add(struct complex\
    \ c1, struct complex c2)\n{\n    struct complex c3;\n    c3.real=c1.real+c2.real;\n\
    \    c3.img=c1.img+c2.img;\n    return(c3);\n}\n~~~\n```\n\nFunction to return\
    \ the product of two complex numbers\n\n```\n~~~c\nstruct complex product(struct\
    \ complex c1, struct complex c2)\n{\n    struct complex c3;\n    c3.real=c1.real*c2.real-c1.img*c2.img;\n\
    \    c3.img=c1.real*c2.img+c1.img*c2.real;\n    return(c3);\n}\n~~~\n```\n\n#\
    \ ## 12.4 ACCESSING STRUCTURE MEMBERS\n\nLO 12.2\n\nWe can access and assign values\
    \ to the members of a structure in a number of ways. As mentioned earlier, the\
    \ members themselves are not variables. They should be linked to the structure\
    \ variables in order to make them meaningful members. For example, the word **title**,\
    \ has no meaning whereas the phrase 'title of book3' has a meaning. The link between\
    \ a member and a variable is established using the *member operator* '.', which\
    \ is also known as 'dot operator' or 'period operator'. For example,\n\n`book1.price`\n\
    \nis the variable representing the price of **book1** and can be treated like\
    \ any other ordinary variable. Here is how we would assign values to the members\
    \ of **book1**:\n\n```\n~~~c\nstrcpy(book1.title, \"BASIC\");\nstrcpy(book1.author,\
    \ \"Balagurusamy\");\nbook1.pages = 250;\nbook1.price = 120.50;\n~~~\n```"
  merge: -1
  img_proc: true
