    \ of y inside the functions informs the compiler that y is an integer type defined\
    \ somewhere else in the program. Note that **extern** declaration does not allocate\
    \ storage space for variables. In case of arrays, the definition should include\
    \ their size as well.\n\nExample:\n\n```\n```c\nmain( )\n{    int i;\n     void\
