  md: '![](img/11b034a94fc590add0a7808250a38792_19_0.png)


    # ## 1.2 GENERATIONS OF COMPUTERS


    The history of computer development is often discussed in terms of different generation
    of computers, as listed below.


    +   - First generation computers

    +   - Second generation computers

    +   - Third generation computers

    +   - Fourth generation computers

    +   - Fifth generation computers


    # ### 1.2.1 First Generation Computers


    These computers used the *vacuum tubes* technology (Fig. 1.2) for calculation
    as well as for storage and control purposes. Therefore, these computers were also
    known as vacuum tubes or thermionic valves based machines. Some examples of first
    generation computers are ENIAC, EDVAC, EDSAC and UNIVAC.


    ![](img/11b034a94fc590add0a7808250a38792_19_1.png)


    # **Advantages**


    +   - Fastest computing devices of their time.

    +   - Able to execute complex mathematical problems in an efficient manner.


    # **Disadvantages**


    +   - These computers were not very easy to program being machine dependent.

    +   - They were not very flexible in running different types of applications as
    designed for special purposes.

    +   - The use of vacuum tube technology made these computers very large and'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'bulky and also required to be placed in cool places.


    +   - They could execute only one program at a time and hence, were not very productive.

    +   - They generated huge amount of heat and hence were prone to hardware faults.


    # ### 1.2.2 Second Generation Computers


    These computers use *transistors* in place of vacuum tubes in building the basic
    logic circuits. A transistor is a semiconductor device that is used to increase
    the power of the incoming signals by preserving the shape of the original signal
    (Fig. 1.3).


    ![](img/11b034a94fc590add0a7808250a38792_20_0.png)


    Some examples of second generation computers are PDP-8, IBM 1401 and IBM 7090.


    # #### Advantages


    +   - Fastest computing devices of their time.

    +   - Easy to program because of the use of assembly language.

    +   - Small and light weight computing devices.

    +   - Required very less power in carrying out operations.


    # #### Disadvantages


    +   - Input and output media for these computers were not improved to a considerable
    extent.

    +   - Required to be placed in air-conditioned places.

    +   - Very expensive and beyond the reach of home users.

    +   - Being special-purpose computers they could execute only specific applications.


    # ### 1.2.3 Third Generation Computers


    The major characteristic feature of third generation computer systems was the
    use of *Integrated Circuits (ICs)*. ICs are the circuits that combine various
    electronic components, such as transistors, resistors, capacitors, etc. onto a
    single small silicon chip.


    ![](img/11b034a94fc590add0a7808250a38792_20_1.png)


    Some examples of third generation computers are NCR 395, B6500, IBM 370, PDP 11
    and CDC 7600.


    # #### Advantages


    +   - Computational time for these computers was usually in nanoseconds hence
    were the fastest computing devices

    +   - Easily transportable because of their small size.

    +   - They used high-level languages which is machine independent hence very easy
    to use.

    +   - Easily installed and required less space.

    +   - Being able to execute any type of application (business and scientific)
    these were considered as general-purpose computers.


    # #### Disadvantages


    +   - Very less storage capacity.

    +   - Degraded performance while executing complex computations because of the
    small storage capacity.

    +   - Very expensive.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 1.2.4 Fourth Generation Computers


    The progress in LSI and VLSI technologies led to the development of microprocessor,
    which became the major characteristic feature of the fourth generation computers.
    The LSI and VLSI technology allowed thousands of transistors to be fitted onto
    one small silicon chip.


    A microprocessor incorporates various components of a computer—such as CPU, memory
    and Input/Output (I/O) controls—onto a single chip. Some popular later microprocessors
    include Intel 386, Intel 486 and Pentium.


    Some of the examples of fourth generation computers are IBM PC, IBM PC/AT, Apple
    and CRAY-1.


    ![](img/11b034a94fc590add0a7808250a38792_21_0.png)


    **Fig. 1.5** *The Intel P4004 microprocessor chip*


    # **Advantages**


    +   - LSI and VLSI technologies made them small, cheap, compact and powerful.

    +   - high storage capacity

    +   - highly reliable and required very less maintenance.

    +   - provided a user-friendly environment with the development of GUIs and interactive
    I/O devices.

    +   - programs written on these computers were highly portable because of the
    use of high-level languages.

    +   - very versatile and suitable for every type of applications.

    +   - required very less power to operate.


    # **Disadvantages**


    +   - the soldering of LSI and VLSI chips on the wiring board was complicated

    +   - still dependent on the instructions given by the programmer.


    # 1.2.5 Fifth Generation Computers


    Fifth generation computers are based on the Ultra Large Scale Integration (ULSI)
    technology that allows almost ten million electronic components to be fabricated
    on one small chip.


    # **Advantages**


    +   - faster, cheaper and most efficient computers till date.

    +   - They are able to execute a large number of applications at the same time
    and that too at a very high speed.

    +   - The use of ULSI technology helps in decreasing the size of these computers
    to a large extent.

    +   - very comfortable to use because of the several additional multimedia features.

    +   - versatile for communications and resource sharing.


    # **Disadvantage**


    They are not provided with an intelligent program that could guide them in performing
    different operations.


    Figure 1.6 shows a tree of computer family that illustrates the area-wise developments
    during the last four decades and their contributions to the various generations
    of computers.'
  merge: -1
  img_proc: true
