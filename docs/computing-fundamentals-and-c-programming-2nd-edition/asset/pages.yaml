  md: "# ## 5.2 ARITHMETIC OPERATORS\n\nC provides all the basic arithmetic operators.\
    \ They are listed in Table 5.1. The operators +, −, *, and / all work the same\
    \ way as they do in other languages. These can operate on any built-in data type\
    \ allowed in C. The unary minus operator, in effect, multiplies its single operand\
    \ by −1. Therefore, a number preceded by a minus sign changes its sign.\n\n**Table\
    \ 5.1** *Arithmetic Operators*\n\n| Operator | Meaning |\n| :---: | :--- |\n|\
    \ + | Addition or unary plus |\n| − | Subtraction or unary minus |\n| * | Multiplication\
    \ |\n| / | Division |\n| % | Modulo division |\n\nInteger division truncates any\
    \ fractional part. The modulo division operation produces the remainder of an\
    \ integer division. Examples of use of arithmetic operators are:\n\n```\n    a\
    \ − b        a + b\n    a * b        a / b\n    a % b       −a * b\n```\n\nHere\
    \ **a** and **b** are variables and are known as *operands*. The modulo division\
    \ operator % cannot be used on floating point data. Note that C does not have\
    \ an operator for *exponentiation*. Older versions of C does not support unary\
    \ plus but ANSI C supports it.\n\n# ### 5.2.1 Integer Arithmetic\n\nWhen both\
    \ the operands in a single arithmetic expression such as a+b are integers, the\
