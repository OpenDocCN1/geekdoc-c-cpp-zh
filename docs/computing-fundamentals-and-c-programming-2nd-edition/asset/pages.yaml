  md: "Another unique aspect of **for** loop is that one or more sections can be omitted,\
    \ if necessary. Consider the following statements:\n\n```\n```\n--------\nm =\
    \ 5;\nfor ( ; m != 100 ; )\n{\n    printf(\"%d\\n\", m);\n    m = m+5;\n}\n--------\n\
    ```\n```\n\nBoth the initialization and increment sections are omitted in the\
    \ **for** statement. The initialization has been done before the **for** statement\
    \ and the control variable is incremented inside the loop. In such cases, the\
    \ sections are left 'blank'. However, the semicolons separating the sections must\
    \ remain. If the test-condition is not present, the **for** statement sets up\
    \ an 'infinite' loop. Such loops can be broken using **break** or **goto** statements\
    \ in the loop.\n\nWe can set up time delay loops using the null statement as follows:\n\
    \n```\n```\nfor ( j = 1000; j > 0; j = j-1)\n    ;\n```\n```\n\nThis loop is executed\
    \ 1000 times without producing any output; it simply causes a time delay. Notice\
    \ that the body of the loop contains only a semicolon, known as a **null statement**.\
    \ This can also be written as following:\n\n```\n```\nfor (j=1000; j > 0; j =\
    \ j-1);\n```\n```\n\nThis implies that the C compiler will not give an error message\
    \ if we place a semicolon by mistake at the end of a **for** statement. The semicolon\
    \ will be considered as a **null statement** and the program may produce some\
    \ nonsense.\n\n# ### 8.4.2 Nesting of for Loops\n\nNesting of loops, that is,\
    \ one **for** statement within another **for** statement, is allowed in C. For\
    \ example, two loops can be nested as follows:\n\n![](img/11b034a94fc590add0a7808250a38792_277_0.png)"
