  md: "would load the executable object code into the computer memory and execute\
    \ the instructions. During execution, the program may request for some data to\
    \ be entered through the keyboard. Sometimes the program does not produce the\
    \ desired results. Perhaps, something is wrong with the program logic or data.\
    \ Then it would be necessary to correct the source program or the data. In case\
    \ the source program is modified, the entire process of compiling, linking and\
    \ executing the program should be repeated.\n\n# ### 3.11.4 Creating Your Own\
    \ Executable File\n\nNote that the linker always assigns the same name a.out.\
    \ When we compile another program, this file will be overwritten by the executable\
    \ object code of the new program. If we want to prevent from happening, we should\
    \ rename the file immediately by using the command.\n\n```\n    mv a.out name\n\
    ```\n\nWe may also achieve this by specifying an option in the cc command as follows:\n\
    \n```\n    cc -o name source-file\n```\n\nThis will store the executable object\
    \ code in the file name and prevent the old file a.out from being destroyed.\n\
    \n# ### 3.11.5 Multiple Source Files\n\nTo compile and link multiple source program\
    \ files, we must append all the files names to the cc command.\n\n```\n    cc\
    \ filename-1.c ... filename-n.c\n```\n\nThese files will be separately compiled\
    \ into object files called\n\n```\n    filename-1.o\n```\n\nand then linked to\
    \ produce an executable program file a.out as shown in Fig. 3.11.\n\n![](img/11b034a94fc590add0a7808250a38792_125_0.png)\n\
    \nFig. 3.11 Compilation of multiple files\n\nIt is also possible to compile each\
    \ file separately and link them later. For example, the commands\n\n```\n    cc\
    \ -c mod1.c\n    cc -c mod2.c\n```\n\nwill compile the source files mod1.c and\
    \ mod2.c into objects files mod1.o and mod2.o. They can be linked together by\
    \ the command\n\n```\n    cc mod1.o mod2.o\n```\n\nwe may also combine the source\
    \ files and object files as follows:\n\n```\n    cc mod1.c mod2.o\n```\n\nOnly\
    \ mod1.c is compiled and then linked with the object file mod2.o. This approach\
    \ is useful when one of the multiple source files need to be changed and recompiled\
    \ or an already existing object files is to be used along with the program to\
    \ be compiled."
