    # ### 5.13 SOME COMPUTATIONAL PROBLEMS


    When expressions include real values, then it is important to take necessary precautions
    to guard against certain computational errors. We know that the computer gives
    approximate values for real numbers and the errors due to such approximations
    may lead to serious problems. For example, consider the following statements:


    ```

    ```c

    a = 1.0/3.0;

    b = a * 3.0;

    ```

    ```


    We know that (1.0/3.0) 3.0 is equal to 1. But there is no guarantee that the value
    of b computed in a program will equal 1.


    Another problem is division by zero. On most computers, any attempt to divide
    a number by zero will result in abnormal termination of the program. In some cases
    such a division may produce meaningless results. Care should be taken to test
    the denominator that is likely to assume zero value and avoid any division by
    zero.


    The third problem is to avoid overflow or underflow errors. It is our responsibility
    to guarantee that operands are of the correct type and range, and the result may
    not produce any overflow or underflow.'
