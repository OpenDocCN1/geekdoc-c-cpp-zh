    \ Value |\n|---|---|---|\n| 0. | double | 0.0 |\n| .0 | double | 0.0 |\n| 12.0\
    \ | double | 12.0 |\n| 1.234 | double | 1.234 |\n| -1.2f | float | -1.2 |\n| 1.23456789L\
    \ | long double | 1.23456789 |\n\n# 4.8.2  User-Defined Type Declaration\n\nC\
    \ supports a feature known as “type definition” that allows users to define an\
    \ identifier that would represent an existing data type. The user-defined data\
    \ type identifier can later be used to declare variables. It takes the general\
    \ form:\n\n```\n    typedef type identifier;\n```\n\nWhere *type* refers to an\
    \ existing data type and “identifier” refers to the “new” name given to the data\
    \ type. The existing data type may belong to any class of type, including the\
    \ user-defined ones. Remember that the new type is “new” only in name, but not\
    \ the data type. **typedef** cannot create a new type. Some examples of type definition\
    \ are:\n\n```\n    typedef int units;\n    typedef float marks;\n```\n\nHere,\
    \ **units** symbolizes **int** and **marks** symbolizes **float**. They can be\
    \ later used to declare variables as follows:\n\n```\n    units batch1, batch2;\n\
    \    marks name1[50], name2[50];\n```\n\nbatch1 and batch2 are declared as **int**\
    \ variable and name1[50] and name2[50] are declared as 50 element floating point\
    \ array variables. The main advantage of **typedef** is that we can create meaningful\
    \ data type names for increasing the readability of the program.\n\nAnother user-defined\
    \ data type is enumerated data type provided by ANSI standard. It is defined as\
    \ follows:\n\n```\n    enum identifier {value1, value2, ... valuen};\n```\n\n\
