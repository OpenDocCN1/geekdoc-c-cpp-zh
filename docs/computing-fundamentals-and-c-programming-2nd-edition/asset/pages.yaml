  md: '# # 10.10 OTHER FEATURES OF STRINGS


    **LO 10.4**


    Other aspects of strings we have not discussed in this chapter include the following:


    +   - Manipulating strings using pointers.

    +   - Using string as function parameters.

    +   - Declaring and defining strings as members of structures.


    These topics will be dealt with later when we discuss functions, structures, and
    pointers.


    # ## LEARNING OUTCOMES


    +   - Character constants are enclosed in single quotes and string constants are
    enclosed in double quotes. LO 10.1

    +   - Allocate sufficient space in a character array to hold the null character
    at the end. LO 10.1

    +   - Avoid processing single characters as strings. LO 10.1

    +   - It is a compile time error to assign a string to a character variable. LO
    10.1

    +   - The header file `<stdio.h>` is required when using standard I/O functions.
    LO 10.1

    +   - The header file `<stdlib.h>` is required when using general utility functions.
    LO 10.1

    +   - Using the address operator `&` with a string variable in the `scanf` function
    call is an error. LO 10.2

    +   - Use `%s` format for printing strings or character arrays terminated by null
    character. LO 10.3

    +   - Using a string variable name on the left of the assignment operator is illegal.
    LO 10.4

    +   - When accessing individual characters in a string variable, it is logical
    error to access outside the array bounds. LO 10.4

    +   - Strings cannot be manipulated with operators. Use string functions. LO 10.4

    +   - Do not use string functions on an array `char` type that is not terminated
    with the null character. LO 10.4

    +   - Do not forget to append the null character to the target string when the
    number of characters copied is less than or equal to the source string. LO 10.4

    +   - Be aware of the return values when using the functions `strcmp` and `strncmp`
    for comparing strings. LO 10.4

    +   - When using string functions for copying and concatenating strings, make
    sure that the target string has enough space to store the resulting string. Otherwise
    memory overwriting may occur. LO 10.4

    +   - The header file `<ctype.h>` is required when using character handling functions.
    LO 10.4

    +   - The header file `<string.h>` is required when using string manipulation
    functions. LO 10.4


    # ## KEY TERMS TO REMEMBER


    +   - **String**: Is a sequence of characters that is considered as a single data
    item. LO 10.1

    +   - **Strcat**: Concatenates two strings. LO 10.3

    +   - **strcmp**: Compares two strings and determines whether they are equal or
    not. LO 10.4

    +   - **strcpy**: Copies one string into another. LO 10.4

    +   - **strstr**: Determines whether one string is a subset of another. LO 10.4'
