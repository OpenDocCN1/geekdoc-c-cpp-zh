    # ### III.8.1 INSERT


    The INSERT command is used for inserting records or rows in a database table.
    For example, consider the following command:


    ```

    ```sql

    INSERT INTO emp_details values (''Rahul'', ''Sharma'', 199, ''Sales'')

    ```

    ```


    In the above command, the values to be inserted are specified in the same order
    as the order of the attributes or column in the emp_details table.


    # ### III.8.2 SELECT


    The SELECT command is used to extract and display table information in different
    ways. For example, consider the following command:


    ```

    ```sql

    SELECT * FROM emp_details

    ```

    ```


    The above command will display the entire contents of the emp_details table.


    However, if we want to display only some rows of the emp_details table then we
    need specify the corresponding selection criteria, as shown below:


    ```

    ```sql

    SELECT * FROM emp_details WHERE emp_id > 99

    ```

    ```


    The above command will display all the rows in which the value of emp_id attribute
    is greater than 99.


    Further, we may also extract only specific attribute values or columns from a
    table, as shown below:


    ```

    ```sql

    SELECT first_name FROM emp_details

    ```

    ```


    The above command will fetch and display all the values under the first_name column
    and ignore all other column values.


    # ### III.8.3 UPDATE


    The UPDATE command is used to modify the existing information contained in a table.
    For example, consider the following statement:


    ```

    ```sql

    UPDATE emp_details SET emp_id = emp_id + 100

    ```

    ```


    The above command will increase all the employee ID values stored in the table
    by 100.


    Similarly, we can also update only some records in a table by specifying certain
    updation criteria. For example, consider the following statement:


    ```

    ```sql

    UPDATE emp_details SET department = ''Sales'' WHERE emp_id = 002

    ```

    ```


    The above command will change the department of the employee having ID 002 to
    Sales.


    # ### III.8.4 DELETE


    The DELETE command is used for removing a record or row from a table. For example,
    consider the following statement:


    ```

    ```sql

    DELETE FROM emp_details WHERE cust_id = 002

    ```

    ```


    The above command will remove details of the employee having ID 002 from the table.'
  merge: -1
  img_proc: true
