  md: '# ## LEARNING OUTCOMES


    +   - It is a common error to use wrong relational operator in test expressions.
    Ensure that the loop is evaluated exactly the required number of times. LO 8.3.1


    +   - Avoid a common error using = in place of == operator. LO 8.3.1


    +   - Do not compare floating-point values for equality. LO 8.3.1


    +   - When performing an operation on a variable repeatedly in the body of a loop,
    make sure that the variable is initialized properly before entering the loop.
    LO 8.3.1


    +   - Indent the statements in the body of loops properly to enhance readability
    and understandability. LO 8.3.1


    +   - Use of blank spaces before and after the loops and terminating remarks are
    highly recommended. LO 8.3.1


    +   - Do not forget to place the semicolon at the end of do ...while statement.
    LO 8.3.2


    +   - Do not forget to place the increment statement in the body of a while or
    do...while loop. LO 8.3.2


    +   - Avoid using while and for statements for implementing exit-controlled (post-test)
    loops. Use do... while statement. Similarly, do not use do...while for pre-test
    loops. LO 8.3.2


    +   - Placing a semicolon after the control expression in a while or for statement
    is not a syntax error but it is most likely a logic error. LO 8.3.3


    +   - Using commas rather than semicolon in the header of a for statement is an
    error. LO 8.3.3


    +   - Do not change the control variable in both the for statement and the body
    of the loop. It is a logic error. LO 8.3.3


    +   - Although it is legally allowed to place the initialization, testing, and
    increment sections outside the header of a for statement, avoid them as far as
    possible. LO 8.3.3


    +   - Although it is permissible to use arithmetic expressions in initialization
    and increment section, be aware of round off and truncation errors during their
    evaluation. LO 8.3.3


    +   - Although statements preceding a for and statements in the body can be placed
    in the for header, avoid doing so as it makes the program more difficult to read.
    LO 8.3.3


    +   - The use of break and continue statements in any of the loops is considered
    unstructured programming. Try to eliminate the use of these jump statements, as
    far as possible. LO 8.3.4


    +   - Avoid the use of goto anywhere in the program. LO 8.3.4


    +   - Use the function exit() only when breaking out of a program is necessary.
    LO 8.3.4


    # ## KEY TERMS TO REMEMBER


    +   - **Control statement:** Tests certain conditions and directs the repeated
    execution of the body of the loop. LO 8.3.1


    +   - **Program loop:** Executes a sequence of statements repeatedly until some
    conditions for termination of the loop are satisfied. LO 8.3.1


    +   - **while statement:** Is an entry-controlled loop that evaluates the test-condition
    first and then executes the body of the loop if the condition is true. LO 8.3.1


    +   - **do statement:** Executes the body of the loop first and then evaluates
    the test-condition in the subsequent while statement. LO 8.3.2


    +   - **break statement:** Terminates the loop and takes the program control to
    the statement immediately following the loop. LO 8.3.4'
