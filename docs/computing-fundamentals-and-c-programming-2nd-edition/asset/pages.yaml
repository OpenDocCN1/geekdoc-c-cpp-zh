- pgno: 44
  md: '# ### 1.15.2  Linear Bus Topology


    In the linear bus topology, all the nodes are connected to the single backbone
    or bus with some medium such as twisted pair, coaxial cable, etc. Figure 1.26
    shows the arrangement of computers in the linear bus topology.


    Advantages of linear bus topology are:


    +   - The linear bus topology usually requires less cabling.

    +   - The linear bus topology is relatively simple to configure and install.

    +   - In the linear bus topology, the failure of one computer does not affect
    the other computers in the network.


    The following are the disadvantages of linear bus topology:


    +   - In the linear bus topology, the failure of the backbone cable results in
    the breakdown of entire network.

    +   - Addition of computers in the linear bus topology results in the performance
    degradation of the network.

    +   - The bus topology is difficult to reconstruct in case of faults.


    # ### 1.15.3  Star Topology


    In the star topology, all the nodes are connected to a common device known as
    hub. Nodes are connected with the help of twisted pair, coaxial cable or optical
    fibre. Figure 1.27 shows the arrangement of computers in star topology.


    Advantages of star topology are:


    +   - This topology allows easy error detection and correction.

    +   - In the star topology, the failure of one computer does not affect the other
    computers in the network.

    +   - This topology is easy to install.


    The following are the disadvantages of star topology:


    +   - In the star topology, the hub failure leads to the overall network crash.

    +   - The star topology requires more amount of cable for connecting the nodes.

    +   - It is expensive due to the cost of hub.


    # ### 1.15.4  Ring Topology


    In the ring topology, the nodes are connected in the form of a ring with the help
    of twisted pair. Each node is connected directly to the other two nodes in the
    network. Figure 1.28 shows the arrangement of computers in the ring topology.


    ![](img/11b034a94fc590add0a7808250a38792_44_0.png)


    ![](img/11b034a94fc590add0a7808250a38792_44_1.png)'
  merge: -1
  img_proc: true
- pgno: 45
  md: '![](img/11b034a94fc590add0a7808250a38792_45_0.png)


    Advantages of ring topology are:


    +   - Each node has an equal access to other nodes in the network.

    +   - Addition of new nodes does not degrade the performance of the network.

    +   - Ring topology is easy to configure and install.


    The following are the disadvantages of ring topology:


    +   - It is relatively expensive to construct the ring topology.

    +   - The failure of one node in the ring topology affects the other nodes in
    the ring.


    # ### 1.15.5 Mesh Topology


    In mesh topology, each computer is connected to every other computer in point-to-point
    mode as shown in Fig. 1.29. If we have n computers, we must have n(n - 1)/2 links.


    ![](img/11b034a94fc590add0a7808250a38792_45_1.png)


    Advantages of mesh topology are:


    +   - Message delivery is more reliable.

    +   - Network congestion is minimum due to large number of links.


    The following are the disadvantages:


    +   - It is very expensive to implement.

    +   - It is very difficult to configure and install.


    # ### 1.15.6 Hybrid Topology


    The hybrid topology is the combination of multiple topologies, used for constructing
    a single large topology. Figure 1.30 shows a typical arrangement of computers
    in hybrid topology.'
  merge: -1
  img_proc: true
