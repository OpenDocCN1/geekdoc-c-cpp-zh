  md: "+   * main()\n+   * int main()\n+   * void main()\n+   * main(void)\n+   *\
    \ void main(void)\n+   * int main(void)\n\nThe empty pair of parentheses indicates\
    \ that the function has no arguments. This may be explicitly indicated by using\
    \ the keyword **void** inside the parentheses. We may also specify the keyword\
    \ **int** or **void** before the word **main**. The keyword **void** means that\
    \ the function does not return any information to the operating system and **int**\
    \ means that the function returns an integer value to the operating system. When\
    \ **int** is specified, the last statement in the program must be \"return 0\"\
