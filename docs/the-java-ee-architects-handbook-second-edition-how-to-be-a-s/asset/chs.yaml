  | 技术设计 | |\n| 数据库设计/数据建模 | 16 小时 |\n| 第三方产品研究 | 16 小时 |\n| 对象建模 | 16 小时 |\n| 流程图\
  \ | 16 小时 |\n| 环境设置 | |\n| 项目设置 | |\n| 源代码控制仓库设置 | 4 小时 |\n| 开发构建脚本 | 4 小时 |\n|\
  \ 持续集成设置 | 4 小时 |\n| 部署设置 | |\n| 开发数据库 | 8 小时 |\n| 系统测试 | 8 小时 |\n| 用户验收测试 | 8 小时\
